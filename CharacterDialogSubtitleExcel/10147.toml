[translation]
10147-CVGroup_UITitle_Idle1-1 = "Blue Archive"
10147-CVGroup_CharacterGet_Idle1-1 = "Oh, did you call for me, Sensei?\nShall we promise to cooperate for the next few thousand years?"
10147-CVGroup_Cafe_Idle1-1 = "I wonder... is sunscreen unnecessary here?"
10147-CVGroup_Cafe_Idle2-1 = "Round and round... round and round...\nI wonder if this much practice is enough."
10147-CVGroup_Cafe_Idle3-1 = "The population density is rising...\nThe danger level is going up, isn't it?"
10147-CVGroup_Cafe_Idle4-1 = "I wonder where Sensei is.\nI want us to watch each other's backs."
10147-CVGroup_Cafe_Idle5-1 = "That... it has a somewhat dangerous scent to it."
10147-CVGroup_WeaponGet_Idle1-1 = "Oh, did you prepare this for me?\nThank you, Sensei.\nBut you haven't given me a reward yet... how about the right to do whatever I want with you?"
10147-CVGroup_UIEventLobby_Enter1-1 = "Sigh... I never thought it would come to this..."
10147-CVGroup_UIEventLobby_Enter1-2 = "It's alright, Sensei.\nWe'll manage somehow."
10147-CVGroup_UIEventLobby_Enter2-1 = "To think we'd end up drifting at sea...\nLet's just start with what we can do."
10147-CVGroup_UIEventLobby_Enter3-1 = "A-a ghost ship... is that for real?\nSensei, do something about it...!"
10147-CVGroup_UIEventLobby_Enter4-1 = "Makoto-chan is really getting into character, isn't she...\nWell, I trust that it'll be fine."
10147-CVGroup_UIEventLobby_Enter5-1 = "Is everything... resolved now?\nCase closed, I suppose."
10147-CVGroup_UIEventLobby_Idle1-1 = "Hm? What is it?"
10147-CVGroup_UIEventLobby_Idle1-2 = "...Are you sure you shouldn't be so worried?"
10147-CVGroup_UIEventLobby_Idle1-3 = "Hehe, Sensei. Are you trying to comfort me?"
10147-CVGroup_UIEventLobby_Idle2-1 = "It's a bit different from what I expected, but..."
10147-CVGroup_UIEventLobby_Idle2-2 = "Well, the ocean is a dangerous place to begin with. It can't be helped."
10147-CVGroup_UIEventLobby_Idle3-1 = "This swimsuit?"
10147-CVGroup_UIEventLobby_Idle3-2 = "Oh, it's fine. I've applied plenty of sunscreen."
10147-CVGroup_UIEventLobby_Idle3-3 = "After all, you have to wear something you like."
10147-CVGroup_UIEventLobby_Idle4-1 = "...Yeah. As I thought, Sensei's hands are warm."
10147-CVGroup_UIEventLobby_Idle4-2 = "Holding them makes me feel at ease."