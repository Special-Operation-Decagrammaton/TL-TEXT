[translation]
10146-CVGroup_UITitle_Idle1-1 = "Hehehe... Blue Archive, it is."
10146-CVGroup_CharacterGet_Idle1-1 = "Haa... It seems those who are too talented are never allowed a moment's rest.\nI, the great Makoto, shall lend you a hand, Sensei."
10146-CVGroup_Cafe_Idle1-1 = "We should place one of these in the Pandemonium Society as well."
10146-CVGroup_Cafe_Idle2-1 = "Hmph. It seems you are overwhelmed by the aura of the great Makoto."
10146-CVGroup_Cafe_Idle3-1 = "I suppose this, too, is something I was born with."
10146-CVGroup_Cafe_Idle4-1 = "Sensei, why do you prefer such a cramped place...?"
10146-CVGroup_Cafe_Idle5-1 = "It wouldn't be a bad idea to build a Pandemonium Society annex by the seaside."
10146-CVGroup_WeaponGet_Idle1-1 = "Sensei... I have always obtained everything I desired.\nIn the dictionary of the great Makoto, there are no such words as 'defeat' or 'impossible'.\nI shall be satisfied with this for now, but... one day, I will surely..."
10146-CVGroup_UIEventLobby_Enter1-1 = "...Ugh."
10146-CVGroup_UIEventLobby_Enter1-2 = "...What on earth is happening!?"
10146-CVGroup_UIEventLobby_Enter2-1 = "I, I am not flustered at all."
10146-CVGroup_UIEventLobby_Enter2-2 = "Everything is proceeding exactly according to plan!"
10146-CVGroup_UIEventLobby_Enter3-1 = "That Iroha... how long does she intend to go on about something like that..."
10146-CVGroup_UIEventLobby_Enter4-1 = "Ah~! Welcome to the Man of Pandemonium! Yo-ho-ho!"
10146-CVGroup_UIEventLobby_Enter5-1 = "Ah, Sensei. Are you enjoying the voyage?"
10146-CVGroup_UIEventLobby_Enter5-2 = "Hehehe! Everything went exactly as predicted!"
10146-CVGroup_UIEventLobby_Enter5-3 = "Everything went perfectly, didn't it!"
10146-CVGroup_UIEventLobby_Idle1-1 = "S-Sensei. I'm sorry, but I'd like you not to touch me."
10146-CVGroup_UIEventLobby_Idle1-2 = "I, I'm terribly seasick... ugh."
10146-CVGroup_UIEventLobby_Idle2-1 = "Uuu... This is why I didn't want to come to the sea."
10146-CVGroup_UIEventLobby_Idle2-2 = "I was the one who planned it... but... ugh."
10146-CVGroup_UIEventLobby_Idle2-3 = "But seeing how happy Ibuki was, obsessed with that fish movie! I wanted you to see it too, Sensei!"
10146-CVGroup_UIEventLobby_Idle3-1 = "Why do you keep touching me...?"
10146-CVGroup_UIEventLobby_Idle3-2 = "I see, so that's it!\nBy placing yourself in an extreme situation, you've realized your true feelings, haven't you?"
10146-CVGroup_UIEventLobby_Idle3-3 = "But wait... I'm not mentally prepared for this yet."
10146-CVGroup_UIEventLobby_Idle4-1 = "That Iroha... to think she's actually using social media."
10146-CVGroup_UIEventLobby_Idle4-2 = "But why hasn't she followed the Pandemonium Society account?"
10146-CVGroup_UIEventMiniGameMission_Enter1-1 = "Righteous deeds deserve rewards."
10146-CVGroup_UIEventMiniGameMission_Enter1-2 = "That is the natural mindset for one in a position of leadership."
10146-CVGroup_UIEventMiniGameMission_Enter2-1 = "You've come at a good time, Sensei! There is much to be done!"
10146-CVGroup_UIEventMiniGameMission_Enter2-2 = "Help me with them one by one!"
10146-CVGroup_UIEventMiniGameMission_Idle1-1 = "I am well aware that the great Makoto is charming."
10146-CVGroup_UIEventMiniGameMission_Idle1-2 = "However, now is the time to focus on the mission."
10146-CVGroup_UIEventMiniGameMission_Idle2-1 = "A moderate amount of skinship is important, but—"
10146-CVGroup_UIEventMiniGameMission_Idle2-2 = "—I have a sense of shame, too, you know."
10146-CVGroup_UIEventMiniGameMission_Buy1-1 = "...A thought suddenly crossed my mind.\nCould it be that all of this is just a midsummer night's dream?"
10146-CVGroup_UIEventMiniGameMission_Buy1-2 = "Well, that's not the case at all! Hehehe!"
10146-CVGroup_UIEventMiniGameMission_Buy2-1 = "Truly excellent work."
10146-CVGroup_UIEventMiniGameMission_Buy2-2 = "The more I get to know you, Sensei, the more I want to keep you by my side."
10146-CVGroup_UIEventMiniGameMission_Interaction1-1 = "Is this all?"
10146-CVGroup_UIEventMiniGameMission_Interaction1-2 = "Daily effort is essential, but..."