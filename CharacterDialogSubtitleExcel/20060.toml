[translation]
20060-CVGroup_UITitle_Idle1-1 = "Blue Archive, it is!"
20060-CVGroup_CharacterGet_Idle1-1 = "Ibuki is going to the beach with everyone too!\nSensei, let's set sail together!"
20060-CVGroup_Cafe_Idle1-1 = "Once we're out of the ocean, we have to brush off the sand and dry ourselves off..."
20060-CVGroup_Cafe_Idle2-1 = "If I drink some coffee, will I be able to play for even longer?"
20060-CVGroup_Cafe_Idle3-1 = "Sensei~ are you still not ready yet~ hehe..."
20060-CVGroup_Cafe_Idle4-1 = "I wonder if they sell pudding here?"
20060-CVGroup_Cafe_Idle5-1 = "Coffee smells so good, but it's super bitter. Why is that?"
20060-CVGroup_WeaponGet_Idle1-1 = "Ibuki will treasure this forever and ever!\nI promise! Thank you, Sensei!"
20060-CVGroup_UIEventLobby_Enter1-1 = "You see, this is my first time at the beach... so I was really looking forward to it."
20060-CVGroup_UIEventLobby_Enter1-2 = "I'm so happy I could come with you, Sensei!"
20060-CVGroup_UIEventLobby_Enter2-1 = "Iroha-senpai looks busy."
20060-CVGroup_UIEventLobby_Enter2-2 = "I'll help her out!"
20060-CVGroup_UIEventLobby_Enter3-1 = "Everyone, please don't fight... I don't like fighting..."
20060-CVGroup_UIEventLobby_Enter3-2 = "Uuu... is it because I'm a bad girl...? \nIs it my fault...?"
20060-CVGroup_UIEventLobby_Enter4-1 = "Aye aye! Captain! Yo-ho!"
20060-CVGroup_UIEventLobby_Enter5-1 = "Hey, hey, Sensei, playing at the beach was so much fun!"
20060-CVGroup_UIEventLobby_Enter5-2 = "So let's come back again, all of us, okay... *yawn*..."
20060-CVGroup_UIEventLobby_Idle1-1 = "Sensei, what's wrong?"
20060-CVGroup_UIEventLobby_Idle1-2 = "Hehe, are you going to play with me?"
20060-CVGroup_UIEventLobby_Idle2-1 = "Chiaki-senpai always takes lots and lots of pictures of me!"
20060-CVGroup_UIEventLobby_Idle2-2 = "That's why I have this many photos of myself!"
20060-CVGroup_UIEventLobby_Idle3-1 = "Sensei! Look! Amazing! So amazing!"
20060-CVGroup_UIEventLobby_Idle3-2 = "From here, all the way to there! It's all ocean!"
20060-CVGroup_UIEventLobby_Idle4-1 = "I wonder if there are any fish I can talk to?"
20060-CVGroup_UIEventLobby_Idle4-2 = "I saw it in a movie! \nYou can say 'Hello!' and have a conversation with them!"
20060-CVGroup_UIEventMission_Enter1-1 = "Welcome, Sensei!\nI'm in charge here!"
20060-CVGroup_UIEventMission_Enter1-2 = "I'm a member of the Pandemonium Society, after all!"
20060-CVGroup_UIEventMission_Enter2-1 = "Whoa! That looks hard...!"
20060-CVGroup_UIEventMission_Enter2-2 = "Sensei, do you understand all of this? Amazing! So amazing!"
20060-CVGroup_UIEventMission_Buy1-1 = "Well done, me.\nHehe! I was taught how to stamp this perfectly!"
20060-CVGroup_UIEventMission_Buy2-1 = "Are you busy, Sensei?\nI'll help you out too!"
20060-CVGroup_UIEventMission_Interaction1-1 = "Sensei has finished his homework. Hehe."
20060-CVGroup_UIEventMission_Idle1-1 = "Ahem! I'm working right now!"
20060-CVGroup_UIEventMission_Idle1-2 = "Playing comes after work is done!"
20060-CVGroup_UIEventMission_Idle2-1 = "I can do it all by myself."
20060-CVGroup_UIEventMission_Idle2-2 = "But I do like working together with you, Sensei!"