[translation]
10148-CVGroup_UITitle_Idle1-1 = "Blue Archive."
10148-CVGroup_CharacterGet_Idle1-1 = "Why do we have to do this even while on vacation...\nWell, since it's come to this, let's both do our best."
10148-CVGroup_Cafe_Idle1-1 = "This is exactly why I hate standing out..."
10148-CVGroup_Cafe_Idle2-1 = "I'd like to be somewhere with as few Gehenna students as possible..."
10148-CVGroup_Cafe_Idle3-1 = "I wish Makoto-senpai and the others would learn from that."
10148-CVGroup_Cafe_Idle4-1 = "It's actually quite comfortable here."
10148-CVGroup_Cafe_Idle5-1 = "Did you arrange all of this, Sensei?"
10148-CVGroup_WeaponGet_Idle1-1 = "Things like 'try harder' or 'put in more effort'...\nUsually, those kinds of things are just a hassle, aren't they?\nBut if those expectations are coming from you, Sensei... I suppose that's not so bad."
10148-CVGroup_UIEventLobby_Enter1-1 = "Seriously, just..."
10148-CVGroup_UIEventLobby_Enter1-2 = "How did things end up like this?"
10148-CVGroup_UIEventLobby_Enter2-1 = "Why is it that no one else understands the gravity of the situation?"
10148-CVGroup_UIEventLobby_Enter2-2 = "Haa... I'm glad you're here, Sensei."
10148-CVGroup_UIEventLobby_Enter3-1 = "Why... why am I still in the Pandemonium Society..."
10148-CVGroup_UIEventLobby_Enter3-2 = "Oh, Sensei. No, it's nothing. Please, don't worry about it."
10148-CVGroup_UIEventLobby_Enter4-1 = "Seriously, what is this!"
10148-CVGroup_UIEventLobby_Enter4-2 = "Why am I the only one being embarrassed!?"
10148-CVGroup_UIEventLobby_Enter4-3 = "Playing pirates... please, think about your age..."
10148-CVGroup_UIEventLobby_Enter5-1 = "...It's cleaned up now."
10148-CVGroup_UIEventLobby_Enter5-2 = "Please just leave me alone for now."
10148-CVGroup_UIEventLobby_Idle1-1 = "When I was a first-year, I thought the Pandemonium Society was a group of honor students."
10148-CVGroup_UIEventLobby_Idle1-2 = "...I want to wake my past self up."
10148-CVGroup_UIEventLobby_Idle2-1 = "Sensei."
10148-CVGroup_UIEventLobby_Idle2-2 = "Are you about to say something like 'let's all do our best'?"
10148-CVGroup_UIEventLobby_Idle2-3 = "It's written all over your face."
10148-CVGroup_UIEventLobby_Idle3-1 = "Makoto-senpai's good points?\nAre you asking that seriously?"
10148-CVGroup_UIEventLobby_Idle3-2 = "Hmmmm..."
10148-CVGroup_UIEventLobby_Idle3-3 = "Her face isn't bad.\n...As long as she stays quiet."
10148-CVGroup_UIEventLobby_Idle4-1 = "I never realized how grateful I'd be to have someone I can actually talk to..."
10148-CVGroup_UIEventLobby_Idle4-2 = "Maybe I should be a little nicer to Chiaki."
10148-CVGroup_UIEventShop_Enter1-1 = "Haa... I want to slack off..."
10148-CVGroup_UIEventShop_Enter1-2 = "If you don't mind, could you lend me a hand?"
10148-CVGroup_UIEventShop_Enter2-1 = "For now, just bring it to me and I'll handle it."
10148-CVGroup_UIEventShop_Enter2-2 = "Actually, why is it that no one else can do this..."
10148-CVGroup_UIEventShop_Enter3-1 = "I guess it's time to say goodbye to this junk."
10148-CVGroup_UIEventShop_Enter3-2 = "Take the rest of it. I don't care where you use it."
10148-CVGroup_UIEventShop_Idle1-1 = "...Was that on purpose?"
10148-CVGroup_UIEventShop_Idle1-2 = "No, it's nothing."
10148-CVGroup_UIEventShop_Idle2-1 = "Um, Sensei..."
10148-CVGroup_UIEventShop_Idle2-2 = "You're hitting it..."
10148-CVGroup_UIEventShop_Buy1-1 = "Thank you. That's one less headache for me."
10148-CVGroup_UIEventShop_Buy2-1 = "Ah... so you do it like this."
10148-CVGroup_UIEventShop_Buy3-1 = "Is that something you need? Huh..."
10148-CVGroup_UIEventShop_Buy4-1 = "I was just looking for this. Thank you."