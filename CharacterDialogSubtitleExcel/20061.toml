[translation]
20061-CVGroup_UITitle_Idle1-1 = "Indeed! Blue Archive!"
20061-CVGroup_CharacterGet_Idle1-1 = "……Can you hear it? The sound of gunpowder exploding.\nThere's no stopping a lit bomb――\nThat, in itself, is true romance."
20061-CVGroup_Cafe_Idle1-1 = "Formal beauty is something to be treasured."
20061-CVGroup_Cafe_Idle2-1 = "Splendid! To think there's a collection of books this vast……."
20061-CVGroup_Cafe_Idle3-1 = "I felt a gaze upon me just now…… or was it my imagination?"
20061-CVGroup_Cafe_Idle4-1 = "Fitting it into the hot spring's decor is…… rather difficult."
20061-CVGroup_Cafe_Idle5-1 = "Hmm, this design…… quite reference-worthy."
20061-CVGroup_WeaponGet_Idle1-1 = "You're willing to stay by my side, fully aware of the risks? Then it couldn't be better――\nShall we go all the way together on this one-way ticket to hell?\nHa-ha-ha-ha-ha!"
20061-CVGroup_UIEventLobby_Enter1-1 = "Blue skies, vast seas!"
20061-CVGroup_UIEventLobby_Enter1-2 = "Indeed! What a beautiful beach!"
20061-CVGroup_UIEventLobby_Enter1-3 = "Right here, we could build a hot spring with a panoramic view of the ocean!"
20061-CVGroup_UIEventLobby_Enter2-1 = "Oh, Sensei? If it isn't Sensei!"
20061-CVGroup_UIEventLobby_Enter2-2 = "Regrettably, the hot spring isn't built yet, you see."
20061-CVGroup_UIEventLobby_Enter3-1 = "Ow…… Honestly, I wish Ichika-chan would pull her punches a bit."
20061-CVGroup_UIEventLobby_Enter3-2 = "Especially given our relationship…… Wouldn't you agree, Sensei?"
20061-CVGroup_UIEventLobby_Enter4-1 = "――A single spark."
20061-CVGroup_UIEventLobby_Enter4-2 = "A chain reaction,"
20061-CVGroup_UIEventLobby_Enter4-3 = "always begins with the tiniest spark."
20061-CVGroup_UIEventLobby_Enter4-4 = "Now then―― what happens"
20061-CVGroup_UIEventLobby_Enter4-5 = "if I were to drop just one spark? Aren't you curious?"
20061-CVGroup_UIEventLobby_Enter5-1 = "My, my, I sure got taken for a ride there! Ha-ha-ha-ha-ha!"
20061-CVGroup_UIEventLobby_Enter5-2 = "Hm? I look like I'm in a good mood?"
20061-CVGroup_UIEventLobby_Enter5-3 = "……Is that how I look?"
20061-CVGroup_UIEventLobby_Idle1-1 = "A private beach, eh? The height of bourgeois luxury."
20061-CVGroup_UIEventLobby_Idle1-2 = "How about having some principles like us?"
20061-CVGroup_UIEventLobby_Idle2-1 = "The countless \"potential hot springs\" scattered across Trinity――"
20061-CVGroup_UIEventLobby_Idle2-2 = "Still lying buried and undiscovered."
20061-CVGroup_UIEventLobby_Idle2-3 = "That's why,"
20061-CVGroup_UIEventLobby_Idle2-4 = "we have come."
20061-CVGroup_UIEventLobby_Idle3-1 = "Hmph…… So that is the Tea Party."
20061-CVGroup_UIEventLobby_Idle3-2 = "Is this really fine? Making contact so easily……."
20061-CVGroup_UIEventLobby_Idle3-3 = "What happened to their bodyguards?"
20061-CVGroup_UIEventLobby_Idle3-4 = "Don't look at me like that, Sensei."
20061-CVGroup_UIEventLobby_Idle3-5 = "I'm not doing anything suspicious."
20061-CVGroup_UIEventLobby_Idle4-1 = "Hm? What is it, Sensei!\nThat tickles! Haha! Stop that!"
