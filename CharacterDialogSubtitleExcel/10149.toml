[translation]
10149-CVGroup_UITitle_Idle1-1 = "Blue! Archive!"
10149-CVGroup_CharacterGet_Idle1-1 = "I'm Toumi Kokoro, the head of the Odyssey Marine High School Diving Club...\nIf you ever drop something in the ocean, just let me know."
10149-CVGroup_Cafe_Idle1-1 = "What a great day for diving.\nI feel like I can dive deeper than usual today."
10149-CVGroup_Cafe_Idle2-1 = "To think Schale has a place like this..."
10149-CVGroup_Cafe_Idle3-1 = "Could that person be... No, I must be seeing things."
10149-CVGroup_Cafe_Idle4-1 = "Amazing... Where on earth did they find such a pretty fragment?"
10149-CVGroup_Cafe_Idle5-1 = "Ugh, it's cold... I want to drink some warm miso soup..."
10149-CVGroup_WeaponGet_Idle1-1 = "Thank you, Sensei.\nWith this equipment, I should be able to work steadily even underwater.\n...Fufu, it's cute."
10149-CVGroup_UIEventLobby_Enter1-1 = "Welcome to the Diving Club, Sensei!"
10149-CVGroup_UIEventLobby_Enter1-2 = "Kombu tea... Please have some if you'd like..."
10149-CVGroup_UIEventLobby_Enter2-1 = "D-Did we mess something up again...?"
10149-CVGroup_UIEventLobby_Enter3-1 = "Ugh... I'd hate not being able to dive..."
10149-CVGroup_UIEventLobby_Enter4-1 = "A treasure map..."
10149-CVGroup_UIEventLobby_Enter4-2 = "I wonder if there's really any treasure out there..."
10149-CVGroup_UIEventLobby_Enter4-3 = "...I suppose there's no other way."
10149-CVGroup_UIEventLobby_Enter5-1 = "Phew... Time to do my best scraping off the barnacles..."
10149-CVGroup_UIEventLobby_Idle1-1 = "Um... Do you need something?"
10149-CVGroup_UIEventLobby_Idle2-1 = "\"Aqua Seal\" ice cream..."
10149-CVGroup_UIEventLobby_Idle2-2 = "It chills my body, so I try not to eat things that are too cold..."
10149-CVGroup_UIEventLobby_Idle3-1 = "Air tank refills... Replacing the regulator..."
10149-CVGroup_UIEventLobby_Idle3-2 = "Ugh... Looks like things are going to be tight this month too..."
10149-CVGroup_UIEventLobby_Idle4-1 = "Ah, ahaha! Th-That tickles...!"
10149-CVGroup_UIEventTreasure_Enter1-1 = "You're my buddy today, Sensei."
10149-CVGroup_UIEventTreasure_Enter2-1 = "Come on, let's go."
10149-CVGroup_UIEventTreasure_Enter2-2 = "To the world of water."
10149-CVGroup_UIEventTreasure_Enter3-1 = "Just in case... let's double-check to make sure we didn't miss anything."
10149-CVGroup_UIEventTreasure_Enter4-1 = "Good work, Sensei."
10149-CVGroup_UIEventTreasure_Enter4-2 = "I was just cleaning up."
10149-CVGroup_UIEventTreasure_Idle1-1 = "Th-That hand signal is..."
10149-CVGroup_UIEventTreasure_Idle1-2 = "It's going to lead to misunderstandings..."
10149-CVGroup_UIEventTreasure_Idle2-1 = "Eh! Is there something... behind me?!"
10149-CVGroup_UIEventTreasure_Idle2-2 = "D-Don't say scary things!"
10149-CVGroup_UIEventTreasure_Idle2-3 = "Sharks are one thing, but I'm really not good with s-scary stuff...!"
10149-CVGroup_UIEventTreasure_FindTreasure1-1 = "There seems to be... something in here."
10149-CVGroup_UIEventTreasure_FindTreasure2-1 = "Ah...! It just moved!"
10149-CVGroup_UIEventTreasure_GetTreasure1-1 = "Found it!"
10149-CVGroup_UIEventTreasure_GetTreasure2-1 = "Wow...! So this was what was hiding!"
10149-CVGroup_UIEventTreasure_RoundRenewal1-1 = "Let's head for the next point."
10149-CVGroup_UIEventMission_Enter1-1 = "Time to start the briefing!"
10149-CVGroup_UIEventMission_Enter2-1 = "I'm going to explain the work plan, so please pay attention...!"
10149-CVGroup_UIEventMission_Idle1-1 = "When doing underwater work, you have to set proper objectives."
10149-CVGroup_UIEventMission_Idle2-1 = "W-What is it?"
10149-CVGroup_UIEventMission_Idle2-2 = "...Did I miss a spot?"
10149-CVGroup_UIEventMission_Buy1-1 = "Is it already done? Sensei, you're amazing...!"
10149-CVGroup_UIEventMission_Buy2-1 = "Ah, yes! That works! That was fast..."
10149-CVGroup_UIEventMission_Interaction1-1 = "Let's call it a day here."
10149-CVGroup_UIEventMission_Interaction1-2 = "We need to make sure we take proper breaks."
