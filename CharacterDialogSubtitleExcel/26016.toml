[translation]
26016-CVGroup_UITitle_Idle1-1 = "Blue... Archive!"
26016-CVGroup_CharacterGet_Idle1-1 = "Blue skies, vast seas, and the dazzling sun of eternal summer...\nA midsummer dream is right here!\nWherever there's a scoop, you'll find me!"
26016-CVGroup_Cafe_Idle1-1 = "Chiaki Radar, on!\nNow then, what are they talking about?"
26016-CVGroup_Cafe_Idle2-1 = "Whoa! This is a sight you don't even see often in Gehenna...!"
26016-CVGroup_Cafe_Idle3-1 = "It's Motomiya! Sorry to bother you! May I have an interview?"
26016-CVGroup_Cafe_Idle4-1 = "I'm curious about that club... Do you think I could try it out?"
26016-CVGroup_Cafe_Idle5-1 = "(I wonder... what kind of relationship do they have?)"
26016-CVGroup_WeaponGet_Idle1-1 = "The pen is mightier than the sword!\n...Well, this is an exception, though!"
26016-CVGroup_UIEventLobby_Enter1-1 = "Man, this is really tough!"
26016-CVGroup_UIEventLobby_Enter1-2 = "Ahaha... it really is, isn't it..."
26016-CVGroup_UIEventLobby_Enter2-1 = "I think experience is important for a reporter, but..."
26016-CVGroup_UIEventLobby_Enter2-2 = "This is a bit much...!"
26016-CVGroup_UIEventLobby_Enter3-1 = "There's nothing good about fighting, even if you do..."
26016-CVGroup_UIEventLobby_Enter3-2 = "Ugh..."
26016-CVGroup_UIEventLobby_Enter4-1 = "Oh! Captain Makoto, you look so cool! Yo-ho-ho!"
26016-CVGroup_UIEventLobby_Enter5-1 = "The next issue of the Weekly Pandemonium is going to be a thick one! Ahaha!"
26016-CVGroup_UIEventLobby_Idle1-1 = "I'm a secretary, not a novelist, but...\nEverything should have a happy ending, right?"
26016-CVGroup_UIEventLobby_Idle2-1 = "Well, we've always managed to make it work somehow..."
26016-CVGroup_UIEventLobby_Idle3-1 = "I want to take a picture of everyone smiling..."
26016-CVGroup_UIEventLobby_Idle4-1 = "As the secretary, I'm recording every single bit of it!"
26016-CVGroup_UIEventLobby_Idle4-2 = "Whether or not to believe this story is up to the readers!"