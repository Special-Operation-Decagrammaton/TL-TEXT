[translation]
10152-CVGroup_UITitle_Idle1-1 = "Blue Archive, and Peace."
10152-CVGroup_CharacterGet_Idle1-1 = "I'm Shiina Tsumugi from the Occult Research Club at Wildhunt Art Academy.\nYes, I have my guitar—'Love and Peace'.\n...It's important, after all."
10152-CVGroup_Cafe_Idle1-1 = "Hehe, I'd love to hold a live concert here."
10152-CVGroup_Cafe_Idle2-1 = "That decoration... it looks like it could be used as a percussion instrument."
10152-CVGroup_Cafe_Idle3-1 = "I think I could build a 'gingerbread house' around here."
10152-CVGroup_Cafe_Idle4-1 = "If we're playing background music... death metal would be perfect."
10152-CVGroup_Cafe_Idle5-1 = "This is a place where everyone's memories reside...\nPerhaps it's the same for me, too."
10152-CVGroup_WeaponGet_Idle1-1 = "Thank you, Sensei.\nWith this girl by my side, I can hold a concert anywhere.\nTo lead us toward peace—with a melody of purgatory."
10152-CVGroup_UIEventLobby_Enter1-1 = "Welcome. To a wonderland of dreams and hope."
10152-CVGroup_UIEventLobby_Enter2-1 = "Hehe, I am honored to be the one to guide you, Sensei."
10152-CVGroup_UIEventLobby_Enter3-1 = "May everyone's efforts bear fruit."
10152-CVGroup_UIEventLobby_Enter4-1 = "It's almost... time for the ending."
10152-CVGroup_UIEventLobby_Enter4-2 = "The feast is prepared."
10152-CVGroup_UIEventLobby_Enter5-1 = "I hope it was a melody that will remain in your soul, Sensei."
10152-CVGroup_UIEventLobby_Idle1-1 = "Sensei, would you like to try some corpse paint?"
10152-CVGroup_UIEventLobby_Idle1-2 = "Leave it to me. I'll make you look wonderful, I promise."
10152-CVGroup_UIEventLobby_Idle2-1 = "...Should I have greeted you\nin a bunny girl outfit after all?"
10152-CVGroup_UIEventLobby_Idle3-1 = "My guitar sings of peace."
10152-CVGroup_UIEventLobby_Idle3-2 = "...Yes, I'm not lying."
10152-CVGroup_UIEventLobby_Idle4-1 = "Hehe. The resonance of souls felt during a session is wonderful, but..."
10152-CVGroup_UIEventLobby_Idle4-2 = "I'd like to cherish the touch of our fingertips, too."
