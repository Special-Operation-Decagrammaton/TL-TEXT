[translation]
10150-CVGroup_UITitle_Idle1-1 = "Blue Archive~"
10150-CVGroup_CharacterGet_Idle1-1 = "Fuchigami Kotone, Vice President of the Odysseia Marine High School Diving Club.\nUm... You're Sensei from Schale, right?\nMy eyesight is bad, so I can't see very well."
10150-CVGroup_Cafe_Idle1-1 = "(It feels like there's something weird over there...\n...Did my eyesight get worse again?)"
10150-CVGroup_Cafe_Idle2-1 = "Is this popular on land...?"
10150-CVGroup_Cafe_Idle3-1 = "Such nice weather...\nI need to dry my marine suit this afternoon."
10150-CVGroup_Cafe_Idle4-1 = "This author's new book... came out."
10150-CVGroup_Cafe_Idle5-1 = "(A place where I can sit and relax... Is there one somewhere?)"
10150-CVGroup_WeaponGet_Idle1-1 = "I'm not very good at darts, but...\nWith this, I feel like I could hit a bullseye even underwater.\nThank you, Sensei."
10150-CVGroup_UIEventLobby_Enter1-1 = "Odysseia Marine High School--"
10150-CVGroup_UIEventLobby_Enter1-2 = "No, that's not it..."
10150-CVGroup_UIEventLobby_Enter1-3 = "Welcome to the Diving Club, Sensei."
10150-CVGroup_UIEventLobby_Enter2-1 = "I've been waiting, Sensei."
10150-CVGroup_UIEventLobby_Enter2-2 = "I'll show you around."
10150-CVGroup_UIEventLobby_Enter3-1 = "Hah... Looks like those kids got into trouble again."
10150-CVGroup_UIEventLobby_Enter4-1 = "(12 nautical miles...)"
10150-CVGroup_UIEventLobby_Enter4-2 = "(Right outside Trident's patrol range...)"
10150-CVGroup_UIEventLobby_Enter4-3 = "(...Seems a bit suspicious.)"
10150-CVGroup_UIEventLobby_Enter5-1 = "Cleaning barnacles is tough work, but..."
10150-CVGroup_UIEventLobby_Enter5-2 = "It can't be helped."
10150-CVGroup_UIEventLobby_Enter5-3 = "It's something only we can do..."
10150-CVGroup_UIEventLobby_Enter5-4 = "You gotta tackle things like this step by step, you know."
10150-CVGroup_UIEventLobby_Idle1-1 = "Sensei... You might be staring a bit too much."
10150-CVGroup_UIEventLobby_Idle1-2 = "Even I can notice."
10150-CVGroup_UIEventLobby_Idle2-1 = "Ice cream? I don't hate it, but..."
10150-CVGroup_UIEventLobby_Idle2-2 = "...The calories are a bit high."
10150-CVGroup_UIEventLobby_Idle2-3 = "I do care about that, you know."
10150-CVGroup_UIEventLobby_Idle3-1 = "Sensei, has anyone ever told you that you have a nice voice?"
10150-CVGroup_UIEventLobby_Idle3-2 = "...I'd love to hear you read 'Twenty Thousand Leagues Under the Sea', Sensei."
10150-CVGroup_UIEventLobby_Idle4-1 = "Everyone in the diving club is a second-year..."
10150-CVGroup_UIEventLobby_Idle4-2 = "Is something wrong with that?"
10150-CVGroup_UIEventLobby_Idle4-3 = "Don't tell me... did I look like a third-year to you?"
10150-CVGroup_UIEventShop_Enter1-1 = "Donations are always welcome."
10150-CVGroup_UIEventShop_Enter1-2 = "If it's diving gear... I'd be happy."
10150-CVGroup_UIEventShop_Enter2-1 = "Want to trade for things I found in the ocean?"
10150-CVGroup_UIEventShop_Enter3-1 = "I'm going to pack up soon, so"
10150-CVGroup_UIEventShop_Enter3-2 = "if there's anything you want to exchange, do it now."
10150-CVGroup_UIEventShop_Idle1-1 = "We should be able to save a bit on the club budget this month. Thanks to you, Sensei."
10150-CVGroup_UIEventShop_Idle2-1 = "While cleaning the ocean, I sometimes find unusual things."
10150-CVGroup_UIEventShop_Idle2-2 = "It's one of my few pleasures, I guess."
10150-CVGroup_UIEventShop_Buy1-1 = "This... looks like it can still be used."
10150-CVGroup_UIEventShop_Buy2-1 = "Thanks for helping out, Sensei."
10150-CVGroup_UIEventShop_Buy3-1 = "Going with that? Sounds good."
10150-CVGroup_UIEventShop_Buy4-1 = "Eh... Do you really need that?"
