[translation]
20064-CVGroup_UITitle_Idle1-1 = "Blue Archive, at your service."
20064-CVGroup_CharacterGet_Idle1-1 = "Greetings, Sensei.\nI am Unrin-in Urara, Vice President of the Art Council at Wildhunt School of the Arts.\nI hope this meeting will be as beautiful and memorable as a fragrant, blooming flower."
20064-CVGroup_Cafe_Idle1-1 = "Decorating with flowers would be lovely, wouldn't it?"
20064-CVGroup_Cafe_Idle2-1 = "This place has such a delightful scent."
20064-CVGroup_Cafe_Idle3-1 = "Is there... some secret hidden here as well?"
20064-CVGroup_Cafe_Idle4-1 = "Hmm, I wonder where a place to relax might be..."
20064-CVGroup_Cafe_Idle5-1 = "It seems we should keep a close eye on that person..."
20064-CVGroup_WeaponGet_Idle1-1 = "It is not my intention to hurt anyone, but... I suppose there are times when it is necessary.\nFor justice without strength is nothing more than a fantasy.\nThank you, Sensei."
20064-CVGroup_UIEventLobby_Enter1-1 = "Welcome to the Council, Sensei."
20064-CVGroup_UIEventLobby_Enter2-1 = "Let us face this crisis together."
20064-CVGroup_UIEventLobby_Enter3-1 = "If I could help it, I would rather not ask for that person's assistance..."
20064-CVGroup_UIEventLobby_Enter4-1 = "Let us proceed together until the curtain falls."
20064-CVGroup_UIEventLobby_Enter5-1 = "The incident has been resolved, but... it seems the true crisis is yet to come."
20064-CVGroup_UIEventLobby_Idle1-1 = "If there is anything you need, please do not hesitate to ask."
20064-CVGroup_UIEventLobby_Idle1-2 = "Ah, though... there are some things I cannot do."
20064-CVGroup_UIEventLobby_Idle2-1 = "Beautiful roses have thorns..."
20064-CVGroup_UIEventLobby_Idle2-2 = "If you reach out carelessly, you will get hurt, you know?"
20064-CVGroup_UIEventLobby_Idle2-3 = "Fufu... though that may have nothing to do with me."
20064-CVGroup_UIEventLobby_Idle3-1 = "Even without exchanging words, it is enough to simply feel each other's breath by one's side..."
20064-CVGroup_UIEventLobby_Idle3-2 = "That is the kind of relationship I prefer."
20064-CVGroup_UIEventLobby_Idle3-3 = "Do you... have someone like that, Sensei?"
20064-CVGroup_UIEventLobby_Idle4-1 = "Everyone wears a persona, after all... which is why,"
20064-CVGroup_UIEventLobby_Idle4-2 = "I am not one to trust people easily..."
20064-CVGroup_UIEventLobby_Idle4-3 = "But for you, Sensei... I feel I could entrust myself to you."
20064-CVGroup_UIEventShop_Enter1-1 = "We have a variety of items in stock."
20064-CVGroup_UIEventShop_Enter2-1 = "Is there anything you need?"
20064-CVGroup_UIEventShop_Enter3-1 = "This stage has closed its curtains, but—"
20064-CVGroup_UIEventShop_Enter3-2 = "I truly wish to be of help to you, Sensei."
20064-CVGroup_UIEventShop_Enter3-3 = "Please, stay with me for the curtain call."
20064-CVGroup_UIEventShop_Idle1-1 = "Unfortunately, as it is by Manami-sama's order, it is not free."
20064-CVGroup_UIEventShop_Idle2-1 = "Can you smell the roses...?"
20064-CVGroup_UIEventShop_Buy1-1 = "Here you go."
20064-CVGroup_UIEventShop_Buy2-1 = "It has a lovely scent."
20064-CVGroup_UIEventShop_Buy3-1 = "I am glad it is to your liking."
20064-CVGroup_UIEventShop_Buy4-1 = "Yes, here you are."
