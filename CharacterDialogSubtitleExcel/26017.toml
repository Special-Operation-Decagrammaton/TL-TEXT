[translation]
26017-CVGroup_UITitle_Idle1-1 = "Blue Archive."
26017-CVGroup_CharacterGet_Idle1-1 = "I am Rana Furuhata, from the 183rd Special Class. \nHmm... Have you tried rebooting?"
26017-CVGroup_Cafe_Idle1-1 = "Sensei, did you manage to find any avocados?\nIf there were avocados, I need to buy six cartons of milk."
26017-CVGroup_Cafe_Idle2-1 = "It's lively here.\nI hope I can get along well with everyone."
26017-CVGroup_Cafe_Idle3-1 = "I behaved myself properly.\nThere's no need to worry."
26017-CVGroup_Cafe_Idle4-1 = "The world is vast.\nThere are all sorts of people, which gives me plenty to analyze."
26017-CVGroup_Cafe_Idle5-1 = "The atmosphere here feels a bit different from District 183.\nIt's fascinating."
26017-CVGroup_WeaponGet_Idle1-1 = "Hmm, looks like it'll be great for making lots of punch cards.\nThis should help speed up evaluations."
26017-CVGroup_UIEventLobby_Enter1-1 = "Vrooom, v-v-v-v-vroooom!"
26017-CVGroup_UIEventLobby_Enter1-2 = "That was the sound of a diesel engine starting up on a cold morning."
26017-CVGroup_UIEventLobby_Enter1-3 = "Well? Was it accurate?"
26017-CVGroup_UIEventLobby_Enter2-1 = "Seeing all these different tanks really gets me hyped up."
26017-CVGroup_UIEventLobby_Enter3-1 = "What indeed, is the fate of the 183rd Special Class—"
26017-CVGroup_UIEventLobby_Enter3-2 = "...That was me imitating a voice from the heavens."
26017-CVGroup_UIEventLobby_Enter4-1 = "There are so many smiling people here..."
26017-CVGroup_UIEventLobby_Enter4-2 = "It's making me smile, too."
26017-CVGroup_UIEventLobby_Enter5-1 = "The Gehenna Cup is over.\nLet's hurry back before the parking lot gets crowded."
26017-CVGroup_UIEventLobby_Idle1-1 = "It's quite crowded.\nPlease be careful not to let any children get lost."
26017-CVGroup_UIEventLobby_Idle2-1 = "Holding hands is a great way to prevent getting lost."
26017-CVGroup_UIEventLobby_Idle2-2 = "It's a scientifically proven theory, so there's no doubt about it."
26017-CVGroup_UIEventLobby_Idle3-1 = "Headpats are nice, but don't forget to hold hands as well."
26017-CVGroup_UIEventLobby_Idle4-1 = "That place looks fun.\nI'd be happy if you could take me there."
26017-CVGroup_UIEventShop_Enter1-1 = "Ah, equivalent exchange, is it?"
26017-CVGroup_UIEventShop_Enter2-1 = "When shopping, I think it's best to prioritize things."
26017-CVGroup_UIEventShop_Enter3-1 = "I've heard tales of a phenomenon called a 'closing-down sale'...\nThey aren't holding one here, I see."
26017-CVGroup_UIEventShop_Idle1-1 = "I am not for sale.\nBesides, with you being Sensei, there's no need to go out of your way to buy me."
26017-CVGroup_UIEventShop_Idle2-1 = "Thank you for the headpats.\nIs there anything you'd like?"
26017-CVGroup_UIEventShop_Buy1-1 = "I'd say that's an optimal choice."
26017-CVGroup_UIEventShop_Buy2-1 = "Do you use this too, Sensei?"
26017-CVGroup_UIEventShop_Buy3-1 = "Sensei. Have you ever tried saying, 'Keep the change'?"
26017-CVGroup_UIEventShop_Buy4-1 = "Without even a shopping list... you memorized all of that.\nThat's so cool."
26017-CVGroup_UIEventMission_Enter1-1 = "An assignment, then.\nI accept the challenge."
26017-CVGroup_UIEventMission_Enter2-1 = "It's work. I did consider finishing it for you instead,"
26017-CVGroup_UIEventMission_Enter2-2 = "but I shouldn't rob Sensei of the fun."
26017-CVGroup_UIEventMission_Idle1-1 = "Meow."
26017-CVGroup_UIEventMission_Idle1-2 = "My nose... Is there something on it?\nWas it contaminated?\nDid it get deformed?"
26017-CVGroup_UIEventMission_Idle2-1 = "I could watch Sensei's fine work all day long."
26017-CVGroup_UIEventMission_Buy1-1 = "You did it. Wonderful."
26017-CVGroup_UIEventMission_Buy2-1 = "I'm not sure of the details,"
26017-CVGroup_UIEventMission_Buy2-2 = "but knowing you, Sensei,\nI'm sure you've accomplished something amazing."
26017-CVGroup_UIEventMission_Interaction1-1 = "That's it for today. We'll continue next time.\nPlease don't make such a lonely face."
26017-CVGroup_UIEventMiniGameMission_Enter1-1 = "Welcome to the tank racing mission."
26017-CVGroup_UIEventMiniGameMission_Enter2-1 = "Normally, I understand racing missions to be about 'avoiding accidents' and 'winning the championship'."
26017-CVGroup_UIEventMiniGameMission_Idle1-1 = "Meow."
26017-CVGroup_UIEventMiniGameMission_Idle1-2 = "You must really like my cheeks, Sensei.\nIt makes me happy."
26017-CVGroup_UIEventMiniGameMission_Idle2-1 = "I am not a start button.\nI prefer headpats."
26017-CVGroup_UIEventMiniGameMission_Buy1-1 = "Effort is usually accompanied by a reward... but I wonder if rewards require effort, too?"
26017-CVGroup_UIEventMiniGameMission_Buy2-1 = "Reward acquisition route mapped. How very simple."
26017-CVGroup_UIEventMiniGameMission_Interaction1-1 = "Sensei's processing speed is like a vacuum tube. Very fast."
