[translation]
20063-CVGroup_UITitle_Idle1-1 = "Blue Archive."
20063-CVGroup_CharacterGet_Idle1-1 = "Shiroko Azusa, joining the Make-Up Work Club team.\nLet me know if you find the target."
20063-CVGroup_Cafe_Idle1-1 = "There are so many mysterious things here...\nIt feels fresh every time I come."
20063-CVGroup_Cafe_Idle2-1 = "It's fun here with so many different people gathering."
20063-CVGroup_Cafe_Idle3-1 = "It feels like someone is staring right at me..."
20063-CVGroup_Cafe_Idle4-1 = "I want to put this parasol somewhere."
20063-CVGroup_Cafe_Idle5-1 = "Is there somewhere I can take a break..."
20063-CVGroup_WeaponGet_Idle1-1 = "Thank you as always, Sensei.\nI want to be of help to you.\nSomeday... I want you to let me share the burden of your resolve."
20063-CVGroup_UIEventLobby_Enter1-1 = "Welcome to the Gehenna Cup, Sensei."
20063-CVGroup_UIEventLobby_Enter2-1 = "I want to make precious memories.\nFor that reason, safety comes first."
20063-CVGroup_UIEventLobby_Enter3-1 = "I need to follow everyone's example too."
20063-CVGroup_UIEventLobby_Enter4-1 = "The air is filled with the scent of gasoline and gunpowder... it's thrilling."
20063-CVGroup_UIEventLobby_Enter5-1 = "Everyone is giving their best, returning to their daily lives."
20063-CVGroup_UIEventLobby_Enter5-2 = "I like things like this."
20063-CVGroup_UIEventLobby_Idle1-1 = "Are you hot?\nDo you want to share my parasol?"
20063-CVGroup_UIEventLobby_Idle2-1 = "I like being petted, but... there are too many people right now, so let's do it later..."
20063-CVGroup_UIEventLobby_Idle3-1 = "I hope I can have all kinds of experiences with everyone."
20063-CVGroup_UIEventLobby_Idle4-1 = "I wonder if I'll be able to make a lot of friends."
20063-CVGroup_UIEventMission_Enter1-1 = "Mission start."
20063-CVGroup_UIEventMission_Enter2-1 = "Let's clear the highest priority items first."
20063-CVGroup_UIEventMission_Idle1-1 = "What is it, Sensei?\nDon't tell me you want to take a picture together?"
20063-CVGroup_UIEventMission_Idle1-2 = "I don't think that was on the mission list."
20063-CVGroup_UIEventMission_Idle2-1 = "Sensei's instructions and goals are so clear, it makes things very easy to do."
20063-CVGroup_UIEventMission_Buy1-1 = "A well-deserved reward.\nIt's the fruit of Sensei's hard work."
20063-CVGroup_UIEventMission_Buy2-1 = "Yeah, I'm satisfied with the result."
20063-CVGroup_UIEventMission_Interaction1-1 = "Objective achieved!\nThat's enough for today."
20063-CVGroup_UIEventMiniGameMission_Enter1-1 = "Practical training is always welcome."
20063-CVGroup_UIEventMiniGameMission_Enter2-1 = "Aside from suppression and victory, there are a mountain of other objectives."
20063-CVGroup_UIEventMiniGameMission_Idle1-1 = "A worthy opponent. I'm looking forward to it."
20063-CVGroup_UIEventMiniGameMission_Idle2-1 = "I feel like I've lost a bit of muscle recently.\nI need to train more."
20063-CVGroup_UIEventMiniGameMission_Idle3-1 = "Hmm, what is it?\nIf you need something, you can just call me on the radio anytime."
20063-CVGroup_UIEventMiniGameMission_Buy1-1 = "I'm glad I could be of help too."
20063-CVGroup_UIEventMiniGameMission_Buy2-1 = "How is it? Am I paying Sensei back even a little?"
20063-CVGroup_UIEventMiniGameMission_Interaction1-1 = "Yeah, it was a flawless operation."
