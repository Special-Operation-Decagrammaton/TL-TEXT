[translation]
10153-CVGroup_UITitle_Idle1-1 = "Blue Archive!"
10153-CVGroup_CharacterGet_Idle1-1 = "Eh? This outfit?\nIt's the official uniform!\nHehehe... I'll be counting on you!"
10153-CVGroup_Cafe_Idle1-1 = "Phew... It's very comfortable here.\nI need to fix Crusader-chan's AC soon..."
10153-CVGroup_Cafe_Idle2-1 = "Everyone is so unique, I'm a little envious..."
10153-CVGroup_Cafe_Idle3-1 = "Wow, it's so cute!"
10153-CVGroup_Cafe_Idle4-1 = "(T-That's a bold outfit...)"
10153-CVGroup_Cafe_Idle5-1 = "(As expected, I suppose I'm pretty ordinary...)"
10153-CVGroup_WeaponGet_Idle1-1 = "Thank you!\nThis gun is easy to handle, even inside a tank."
10153-CVGroup_UIEventLobby_Enter1-1 = "The main tournament is finally here, Sensei!"
10153-CVGroup_UIEventLobby_Enter2-1 = "I'll do my best to cross the finish line!"
10153-CVGroup_UIEventLobby_Enter3-1 = "I hope everyone can just have fun without worrying about the results..."
10153-CVGroup_UIEventLobby_Enter4-1 = "May everyone be filled with smiles!"
10153-CVGroup_UIEventLobby_Enter5-1 = "I hope this tournament, for everyone――"
10153-CVGroup_UIEventLobby_Enter5-2 = "becomes a cherished memory of our youth."
10153-CVGroup_UIEventLobby_Idle1-1 = "This outfit?\nIt's the official uniform!"
10153-CVGroup_UIEventLobby_Idle2-1 = "Ah, do you get it too, Sensei?"
10153-CVGroup_UIEventLobby_Idle2-2 = "It's made of really great material!"
10153-CVGroup_UIEventLobby_Idle3-1 = "So many uniquely crafted tanks...!"
10153-CVGroup_UIEventLobby_Idle3-2 = "Sensei, would you like to go check them out together?"
10153-CVGroup_UIEventLobby_Idle4-1 = "Do you like tanks too, Sensei?"
10153-CVGroup_UIEventLobby_Idle4-2 = "Hehe, we're the same!\nI love them too!"
10153-CVGroup_UIEventShop_Enter1-1 = "Please let me know if there's anything you'd like!"
10153-CVGroup_UIEventShop_Enter2-1 = "Are you looking for something? I can help!"
10153-CVGroup_UIEventShop_Enter3-1 = "Is there anything you forgot to buy?\nI'll keep you company until the very end!"
10153-CVGroup_UIEventShop_Idle1-1 = "Peroro-sama merchandise?\nI'll guide you to the sales floor!"
10153-CVGroup_UIEventShop_Idle2-1 = "Eh? You need... me?\nIf you're okay with me, just say the word!"
10153-CVGroup_UIEventShop_Buy1-1 = "That's super nice!\nI totally get it!"
10153-CVGroup_UIEventShop_Buy2-1 = "It's important to save up when you can, after all."
10153-CVGroup_UIEventShop_Buy3-1 = "Shopping is so much fun, isn't it?"
10153-CVGroup_UIEventShop_Buy4-1 = "Would you like to look at other things too?"
10153-CVGroup_UIEventMiniGameMission_Enter1-1 = "Let's do our best together again today, Sensei!"
10153-CVGroup_UIEventMiniGameMission_Enter2-1 = "Getting results is important, but safety comes first!"
10153-CVGroup_UIEventMiniGameMission_Idle1-1 = "Au."
10153-CVGroup_UIEventMiniGameMission_Idle1-2 = "...Was there something on my cheek?"
10153-CVGroup_UIEventMiniGameMission_Idle2-1 = "Good job, you say... Huh? Are you talking to me?\nI haven't done anything yet, though!?"
10153-CVGroup_UIEventMiniGameMission_Buy1-1 = "So many... I'm so happy! We did it, Sensei!"
10153-CVGroup_UIEventMiniGameMission_Buy2-1 = "Hehehe, thanks to you, Sensei!"
10153-CVGroup_UIEventMiniGameMission_Interaction1-1 = "Goal achieved! That was over in a flash!"
