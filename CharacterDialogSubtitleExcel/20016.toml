[translation]
20016-CVGroup_UITitle_Idle1-1 = "*sigh*... Blue Archive!"
20016-CVGroup_CharacterGet_Idle1-1 = "*sigh* How did it come to this? Well, I'll just have to deal with it."
20016-CVGroup_Cafe_Idle1-1 = "Is there a quiet place to read?"
20016-CVGroup_Cafe_Idle2-1 = "Ugh. What a nuisance..."
20016-CVGroup_Cafe_Idle3-1 = "I don't really like big crowds..."
20016-CVGroup_Cafe_Idle4-1 = "Where...can we go hide?"
20016-CVGroup_Cafe_Idle5-1 = "Indeed. I think we'll be safe here."
20016-CVGroup_WeaponGet_Idle1-1 = "*sigh* Seriously...what do you expect me to do when you act like this?"
20016-CVGroup_UIEventLobby_Enter1-1 = "Seriously, there are so many problems."
20016-CVGroup_UIEventLobby_Enter2-1 = "*sigh*... I can't do this."
20016-CVGroup_UIEventLobby_Enter3-1 = "It's taking a while. Do you think it can be done in time?"
20016-CVGroup_UIEventLobby_Enter4-1 = "It's getting there...but don't let your guard down until the end."
20016-CVGroup_UIEventLobby_Enter4-2 = "I hate annoying stuff."
20016-CVGroup_UIEventLobby_Enter5-1 = "It looks like the commotion ended. Great work, Sensei."
20016-CVGroup_UIEventLobby_Idle1-1 = "The exchange meeting somehow ended up a mess."
20016-CVGroup_UIEventLobby_Idle2-1 = "*sigh* ...Why can't they consider the person who has to clean up the mess afterwards?"
20016-CVGroup_UIEventLobby_Idle3-1 = "Why am I in still stuck putting things in order in a different district?"
20016-CVGroup_UIEventLobby_Idle4-1 = "I guess this is the pain of a middle manager."
20016-CVGroup_UIEventMission_Enter1-1 = "These are the problems that need to be solved."
20016-CVGroup_UIEventMission_Enter2-1 = "Please check the list, Sensei."
20016-CVGroup_UIEventMission_Idle1-1 = "It's annoying, but I'm glad you're with me, Sensei."
20016-CVGroup_UIEventMission_Idle2-1 = "It's so hard!"
20016-CVGroup_UIEventMission_Buy1-1 = "Phew... One problem resolved."
20016-CVGroup_UIEventMission_Buy2-1 = "Did you take care of it? Great job."
20016-CVGroup_UIEventMission_Interaction1-1 = "I think that's enough for today. Great work!"
20016-CVGroup_UIEventMiniGameMission_Enter1-1 = "やることが山積みですね。\n二つ以上もあるじゃないですか。"
20016-CVGroup_UIEventMiniGameMission_Enter1-2 = "山積みですよ。"
20016-CVGroup_UIEventMiniGameMission_Enter2-1 = "……いつもの仕事よりは幾分まとも、ですね。ふふ。"
20016-CVGroup_UIEventMiniGameMission_Idle1-1 = "う、髪が乱れます。"
20016-CVGroup_UIEventMiniGameMission_Idle1-2 = "雑だと言われたことはありませんか？"
20016-CVGroup_UIEventMiniGameMission_Idle2-1 = "はあ、帽子には触らないでください。被り直すの、大変なんですよ。"
20016-CVGroup_UIEventMiniGameMission_Buy1-1 = "報酬に興味はありませんが、別にいらないわけではありません。"
20016-CVGroup_UIEventMiniGameMission_Buy2-1 = "報酬もあるとは……いいですね。"
20016-CVGroup_UIEventMiniGameMission_Interaction1-1 = "ふぅ、終わりましたね。お疲れ様でした、先生。"
