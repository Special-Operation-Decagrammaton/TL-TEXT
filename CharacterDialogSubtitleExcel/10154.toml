[translation]
10154-CVGroup_UITitle_Idle1-1 = "Blue Archive."
10154-CVGroup_CharacterGet_Idle1-1 = "I am Uruwashi Manami, President of the Art Council at Wild Hunt Art Academy.\n'Collection'—it is art that transcends time and space.\nMay this moment become a memorable work of art."
10154-CVGroup_Cafe_Idle1-1 = "Sensei... you have quite refined tastes, don't you?"
10154-CVGroup_Cafe_Idle2-1 = "This kind of atmosphere isn't bad at all."
10154-CVGroup_Cafe_Idle3-1 = "...I see. Let's just call this art as well."
10154-CVGroup_Cafe_Idle4-1 = "So this is your museum, Sensei."
10154-CVGroup_Cafe_Idle5-1 = "I see... I will refrain from commenting."
10154-CVGroup_WeaponGet_Idle1-1 = "My enemies are the enemies of Wild Hunt.\nI shall have the fools experience the ways of our academy firsthand."
10154-CVGroup_UIEventLobby_Enter1-1 = "Welcome to the Art Council, Sensei."
10154-CVGroup_UIEventLobby_Enter2-1 = "Please, enjoy the essence of Wild Hunt to your heart's content."
10154-CVGroup_UIEventLobby_Enter3-1 = "We've found a lead to the solution, haven't we?"
10154-CVGroup_UIEventLobby_Enter4-1 = "The Seven Prisoners... they truly are a troublesome bunch."
10154-CVGroup_UIEventLobby_Enter5-1 = "Is this the end of the matter for now?"
10154-CVGroup_UIEventLobby_Enter5-2 = "On behalf of the students of Wild Hunt, I thank you."
10154-CVGroup_UIEventLobby_Idle1-1 = "I have instructed the dormitory supervisors to grant you special privileges, Sensei."
10154-CVGroup_UIEventLobby_Idle1-2 = "...You wouldn't dream of returning kindness with ingratitude, would you?"
10154-CVGroup_UIEventLobby_Idle2-1 = "Standing as the Council President, I encounter some rather interesting things."
10154-CVGroup_UIEventLobby_Idle2-2 = "Hehe, power is a curious thing, isn't it?"
10154-CVGroup_UIEventLobby_Idle3-1 = "Oh... you aren't intimidated by me at all, are you, Sensei?"
10154-CVGroup_UIEventLobby_Idle3-2 = "Hehe, I don't mind that distance between us."
10154-CVGroup_UIEventLobby_Idle4-1 = "If you wish to deepen our friendship, let's do so later."
10154-CVGroup_UIEventLobby_Idle4-2 = "One must maintain a distinction between public and private matters."
10154-CVGroup_UIEventTreasure_Enter1-1 = "Now then, please show me your art, Sensei."
10154-CVGroup_UIEventTreasure_Enter2-1 = "I look forward to seeing your aesthetic eye."
10154-CVGroup_UIEventTreasure_Enter3-1 = "That was a meaningful time."
10154-CVGroup_UIEventTreasure_Enter4-1 = "Art is eternal."
10154-CVGroup_UIEventTreasure_Enter4-2 = "Please join me again next time, if you'd like."
10154-CVGroup_UIEventTreasure_Idle1-1 = "Art is always by our side."
10154-CVGroup_UIEventTreasure_Idle1-2 = "The clothes you are wearing are also a product of art."
10154-CVGroup_UIEventTreasure_Idle1-3 = "Everything other than your clothes could be considered that as well."
10154-CVGroup_UIEventTreasure_Idle1-4 = "So, please cherish your belongings."
10154-CVGroup_UIEventTreasure_Idle2-1 = "I'm relieved that you are someone I can reason with, Sensei."
10154-CVGroup_UIEventTreasure_Idle2-2 = "It is especially significant that our views on art align."
10154-CVGroup_UIEventTreasure_Idle2-3 = "In our academy, that is the biggest point of contention."
10154-CVGroup_UIEventTreasure_FindTreasure1-1 = "I see... so that is the point of appreciation."
10154-CVGroup_UIEventTreasure_FindTreasure2-1 = "Art is only truly appreciated when examined in every detail."
10154-CVGroup_UIEventTreasure_GetTreasure1-1 = "A wonderful piece.\nI shall display it somewhere it can be seen clearly."
10154-CVGroup_UIEventTreasure_GetTreasure2-1 = "So this is your art, Sensei...\nTruly fascinating."
10154-CVGroup_UIEventTreasure_RoundRenewal1-1 = "Now, I wonder what kind of work awaits us next."
10154-CVGroup_UIEventMission_Enter1-1 = "Here is what I would like to request of you, Sensei. Please take a look."
10154-CVGroup_UIEventMission_Enter2-1 = "Here is the task list. It's quite artistic."
10154-CVGroup_UIEventMission_Idle1-1 = "Is something the matter?"
10154-CVGroup_UIEventMission_Idle2-1 = "It seems I've bored you.\nYou seem to have enough free time to play with me."
10154-CVGroup_UIEventMission_Buy1-1 = "Oh, your problem-solving skills live up to the rumors."
10154-CVGroup_UIEventMission_Buy2-1 = "Hehe, my judgment was not mistaken."
10154-CVGroup_UIEventMission_Interaction1-1 = "Thank you for your hard work. Please, take this memento."
