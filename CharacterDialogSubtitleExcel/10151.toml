[translation]
10151-CVGroup_UITitle_Idle1-1 = "Blue Archive!"
10151-CVGroup_CharacterGet_Idle1-1 = "I am Niki Anna, the class representative of Special Class 183.\nSorry, but autographs will have to wait."
10151-CVGroup_Cafe_Idle1-1 = "(Marker pen ready, check.)"
10151-CVGroup_Cafe_Idle2-1 = "This chair is wonderful.\nYou can sit on it, and it's light enough to swing around..."
10151-CVGroup_Cafe_Idle3-1 = "Such a wonderful design... I am deeply impressed."
10151-CVGroup_Cafe_Idle4-1 = "Ah... So you've realized it.\nYes, that's right. I am Niki Anna."
10151-CVGroup_Cafe_Idle5-1 = "(I sense the psychic waves of wrestling talent emanating from this room...)"
10151-CVGroup_WeaponGet_Idle1-1 = "Thank you, Sensei.\nThis gift has just as many uses as a power tool... It's a huge help."
10151-CVGroup_UIEventLobby_Enter1-1 = "Red Winter's proud class of scientists—"
10151-CVGroup_UIEventLobby_Enter1-2 = "Welcome to Special Class 183!"
10151-CVGroup_UIEventLobby_Enter1-3 = "And I am Niki Anna, the class representative of Special Class 183."
10151-CVGroup_UIEventLobby_Enter2-1 = "Building a tank?\nThat's a piece of cake."
10151-CVGroup_UIEventLobby_Enter3-1 = "Progress?\nY-Yes! Of course,\nit's going smoothly!"
10151-CVGroup_UIEventLobby_Enter3-2 = "Yeah..."
10151-CVGroup_UIEventLobby_Enter4-1 = "Confidence?\nI-I certainly have some..."
10151-CVGroup_UIEventLobby_Enter4-2 = "Yeah... Ahaha..."
10151-CVGroup_UIEventLobby_Enter5-1 = "Ugh... Ugh..."
10151-CVGroup_UIEventLobby_Enter5-2 = "Thank you... so very much...!"
10151-CVGroup_UIEventLobby_Idle1-1 = "Yes, I am that genius."
10151-CVGroup_UIEventLobby_Idle1-2 = "The genuine, authentic article."
10151-CVGroup_UIEventLobby_Idle1-3 = "S-Soo... Soo...!"
10151-CVGroup_UIEventLobby_Idle2-1 = "Headpats...?\nU-Usually, aren't you supposed to shake hands?"
10151-CVGroup_UIEventLobby_Idle3-1 = "Most inventions in Red Winter were made by us."
10151-CVGroup_UIEventLobby_Idle3-2 = "Well... though it wasn't my intention."
10151-CVGroup_UIEventLobby_Idle4-1 = "Escaping the special clas— The day of completion is near."
10151-CVGroup_UIEventShop_Enter1-1 = "Shopping, huh.\nSince you usually buy things for me, it's been a while since I came myself."
10151-CVGroup_UIEventShop_Enter2-1 = "Shopping... H-How do you do it again?"
10151-CVGroup_UIEventShop_Enter3-1 = "Are there no \"going out of business sales\"...?\nThe newspaper said there would be..."
10151-CVGroup_UIEventShop_Enter3-2 = "What...?"
10151-CVGroup_UIEventShop_Idle1-1 = "Um... I have things I want to buy, too..."
10151-CVGroup_UIEventShop_Idle1-2 = "I'd be happy if you could help me look for them."
10151-CVGroup_UIEventShop_Idle1-3 = "Um... about 100kg of GOST 5632..."
10151-CVGroup_UIEventShop_Idle1-4 = "Let me know if you find any."
10151-CVGroup_UIEventShop_Idle2-1 = "W-What is it?\nI'm not going to buy anything for you, you know?"
10151-CVGroup_UIEventShop_Buy1-1 = "No procurement contracts needed either, that helps."
10151-CVGroup_UIEventShop_Buy2-1 = "If I work hard here... do you think I might get an amnesty? Probably not."
10151-CVGroup_UIEventShop_Buy3-1 = "Wonderful judgment. Yes, just like my achievements."
10151-CVGroup_UIEventShop_Buy4-1 = "The calculations are also flawless."
10151-CVGroup_UIEventMission_Enter1-1 = "Such a long list...\nThis really brings out my managerial skills."
10151-CVGroup_UIEventMission_Enter2-1 = "\"Check the list\""
10151-CVGroup_UIEventMission_Enter2-2 = "Yes, it was also written on my to-do list."
10151-CVGroup_UIEventMission_Idle1-1 = "Let's finish our quota first. Autographs can wait."
10151-CVGroup_UIEventMission_Idle2-1 = "Let's finish up quickly and take a break, Sensei."
10151-CVGroup_UIEventMission_Buy1-1 = "Praise and rewards can never be too many."
10151-CVGroup_UIEventMission_Buy2-1 = "Sensei needs a reward too. Yes, naturally."
10151-CVGroup_UIEventMission_Interaction1-1 = "That's it for today. Quota achieved."
