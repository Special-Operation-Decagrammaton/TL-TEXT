[translation]
20062-CVGroup_UITitle_Idle1-1 = "Blue... hng... Ah! Archive!"
20062-CVGroup_CharacterGet_Idle1-1 = "Hello hello! I'm Elina Niki from Class 183!\nUm, what a fine day it is today—... Wait, how does it go again?"
20062-CVGroup_Cafe_Idle1-1 = "Wah! No drafty wind getting in, this is the best!"
20062-CVGroup_Cafe_Idle2-1 = "Your outfit is so cute! Where did you buy that?!"
20062-CVGroup_Cafe_Idle3-1 = "Ah... This might even be better than Red Winter's downtown..."
20062-CVGroup_Cafe_Idle4-1 = "So waaarm... I probably won't catch a cold!"
20062-CVGroup_Cafe_Idle5-1 = "That person might have the makings of a chemist?!"
20062-CVGroup_WeaponGet_Idle1-1 = "With this, even bears are no problem! And debating too, of course!"
20062-CVGroup_UIEventLobby_Enter1-1 = "An outsider?! Eh, seriously...?"
20062-CVGroup_UIEventLobby_Enter1-2 = "Come on in, come on in! You're very welcome!"
20062-CVGroup_UIEventLobby_Enter2-1 = "Do you happen to have a recent newspaper on you?"
20062-CVGroup_UIEventLobby_Enter2-2 = "If it's within a month, I'd be super happy!"
20062-CVGroup_UIEventLobby_Enter3-1 = "Hello hello, Sensei~! It's freezing today, too~"
20062-CVGroup_UIEventLobby_Enter3-2 = "Make sure you don't catch a cold..."
20062-CVGroup_UIEventLobby_Enter3-3 = "Achoo!!"
20062-CVGroup_UIEventLobby_Enter4-1 = "Ah! Make sure you close the window properly!\nThe wind blows in and..."
20062-CVGroup_UIEventLobby_Enter4-2 = "Worst of all, bears will come!"
20062-CVGroup_UIEventLobby_Enter5-1 = "Waaaaah!!!\nThanks to you, Sensei~~!!"
20062-CVGroup_UIEventLobby_Idle1-1 = "Ugh... Uuuuhuuu...!"
20062-CVGroup_UIEventLobby_Idle1-2 = "...Nnnnaaaah!"
20062-CVGroup_UIEventLobby_Idle1-3 = "My sneeze went away!!"
20062-CVGroup_UIEventLobby_Idle2-1 = "Eep! You scared me..."
20062-CVGroup_UIEventLobby_Idle2-2 = "I thought you were another reindeer!"
20062-CVGroup_UIEventLobby_Idle3-1 = "Hm? Are you hungry?"
20062-CVGroup_UIEventLobby_Idle3-2 = "Then I'll whip something up! I'm in charge of meals, after all!"
20062-CVGroup_UIEventLobby_Idle4-1 = "S-So cold..."
20062-CVGroup_UIEventLobby_Idle4-2 = "Even my scalp is freezing..."
20062-CVGroup_UIEventShop_Enter1-1 = "Shopping!!\nMy specialty!!"
20062-CVGroup_UIEventShop_Enter2-1 = "What should I buy~♪"
20062-CVGroup_UIEventShop_Enter3-1 = "Ugh...\nShopping is on hold for a while."
20062-CVGroup_UIEventShop_Idle1-1 = "Were you eyeing this too, Sensei?\nLet's buy it, let's buy it!"
20062-CVGroup_UIEventShop_Idle2-1 = "When you're struggling to decide what to buy, you just try buying everything!"
20062-CVGroup_UIEventShop_Buy1-1 = "Whoa~! Sensei, you're so cool!\nThe financial power of an adult! The best!"
20062-CVGroup_UIEventShop_Buy2-1 = "*Ahem ahem!*\nAhem! If I had this, I'd be so happy, man~"
20062-CVGroup_UIEventShop_Buy2-2 = "I wonder if someone would just buy it all for me..."
20062-CVGroup_UIEventShop_Buy3-1 = "By the way, though...\nDo you happen to have an outing permit or something?"
20062-CVGroup_UIEventShop_Buy4-1 = "Total... One, two... Um..."
20062-CVGroup_UIEventShop_Buy4-2 = "Well, looks about right!"
20062-CVGroup_UIEventMission_Enter1-1 = "Who would ever do homework!"
20062-CVGroup_UIEventMission_Enter2-1 = "I don't wanna, don't wanna, don't wanna do homework~~!"
20062-CVGroup_UIEventMission_Idle1-1 = "Poking me isn't going to finish my homework, you know?"
20062-CVGroup_UIEventMission_Idle2-1 = "What is it?\nEh? Are you putting it off too? Yay!"
20062-CVGroup_UIEventMission_Buy1-1 = "I hate homework, but I love rewards!\nHehehedh♪"
20062-CVGroup_UIEventMission_Buy2-1 = "Oh, nice~!"
20062-CVGroup_UIEventMission_Buy2-2 = "It would've been the absolute best if the newspaper was the latest issue!"
20062-CVGroup_UIEventMission_Interaction1-1 = "Yay! Homework is done! Let's go play, Sensei!!"
