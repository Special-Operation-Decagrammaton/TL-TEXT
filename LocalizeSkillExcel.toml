3890119215-NameJp = "No Boarding Allowed"
3890119215-DescriptionJp = "Absorbs the souls of allies in the same space and inflicts Stun ([c][007eff]14 seconds[-][/c]).\nAfter a certain time, converts absorbed souls into tickets and destroys them, dealing [c][007eff]400%[-][/c] of ATK as damage, [c][007eff]100%[-][/c] of ATK as DoT ([c][007eff]3 seconds[-][/c]), and inflicting Stun ([c][007eff]20 seconds[-][/c]).\nWhile using this skill, if damage taken from other spaces accumulates to [c][007eff]1000[-][/c] or more, the Monkey Conductor enters Groggy state and stops using the skill. Afterward, damage taken by the Monkey Conductor increases by [c][007eff]80%[-][/c] ([c][007eff]16 seconds[-][/c]).\nWhile using this skill, all attacks except damage from other spaces are nullified."
