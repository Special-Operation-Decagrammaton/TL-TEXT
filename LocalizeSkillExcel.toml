3328330928-NameJp = "Unending Dream"
3328330928-DescriptionJp = "Every [c][007eff]5 seconds[-][/c], deals [c][007eff]50%[-][/c] of ATK as damage to all allies.\nAllies with HP below [c][007eff]50%[-][/c] have Cost Recovery reduced by [c][007eff]3000[-][/c] (This debuff cannot be removed by debuff removal skills).\n(However, this debuff is removed when HP is 50% or higher.)\nAll attacks from Nightmare Express are unavoidable.\nHowever, damage is reduced in proportion to Evasion.\nAll attacks from Nightmare Express pierce shields and add [c][007eff]300%[-][/c] to Nightmare Express's Explosive Effectiveness.\nNightmare Express's ATK is significantly increased, but damage taken is reduced based on the allies' terrain combat effectiveness (up to [c][007eff]50%[-][/c] reduction)."
