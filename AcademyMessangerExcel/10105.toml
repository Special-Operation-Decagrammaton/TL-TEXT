[translation]
10105-101050010 = "Esta é uma situação totalmente inesperada."
10105-101050020 = "Quem diria que"
10105-101050030 = "eu me tornaria uma idol..."
10105-101050040 = "Ainda está ensaiando?"
10105-101050050 = "Está indo tudo bem?"
10105-101050060 = "Ah"
10105-101050070 = "Sim."
10105-101050080 = "Graças a você, está correndo tudo muito bem, Sensei!"
10105-101050090 = "Sensei, muito obrigada por hoje."
10105-101050100 = "Graças à sua ajuda, o ensaio rendeu bastante."
10105-101050110 = "Que bom."
10105-101050120 = "O tamagoyaki estava uma delícia."
10105-101050130 = "Que alívio."
10105-101050140 = "Fico muito feliz que tenha gostado."
10105-101050150 = "Muito obrigada, Sensei."
10105-101050160 = "Imagina, sou eu quem deveria agradecer."
10105-101050170 = "Dessa vez fui eu quem ganhou um presente seu, Mari! A vitória é minha...!"
10105-101050180 = "Hum..."
10105-101050190 = "Nesse caso, que bom... eu acho?"
10105-101050200 = "Fizemos o ensaio geral,"
10105-101050210 = "e eu não imaginava que receberia tanto apoio assim."
10105-101050220 = "Estou muito feliz."
10105-101050230 = "Eu já imaginava!"
10105-101050240 = "Afinal, todo mundo adora você, Mari!"
10105-101050250 = "...S-Sério?"
10105-101050260 = "A ficha de que sou uma idol ainda não caiu direito..."
10105-101050270 = "Por falar nisso,"
10105-101050280 = "como posso dizer..."
10105-101050290 = "Havia algumas pessoas torcendo de um jeito bem peculiar."
10105-101050300 = "Foi bem inesperado."
10105-101050310 = "Ver tantas pessoas reunidas daquele jeito..."
10105-101050320 = "O que será que aconteceu...?"
10105-101050330 = "Eu já imaginava!"
10105-101050340 = "Afinal, todo mundo adora você, Mari!"
10105-101050350 = "Sensei...?"
10105-101050360 = "Tenho a impressão de que você mandou exatamente a mesma mensagem agora há pouco..."
10105-101050370 = "De todo modo, muito obrigada por hoje."
10105-101050380 = "Hum,"
10105-101050390 = "na próxima vez,"
10105-101050400 = "por favor, deixe-me mostrar o figurino especialmente para você, Sensei."
10105-101050410 = "A agenda acabou ficando"
10105-101050420 = "mais corrida do que eu imaginava."
10105-101050430 = "Mas fico muito feliz em ver todos tão contentes."
10105-101050440 = "Então vai ter apresentação extra também, né?"
10105-101050450 = "Vai ter outro show?"
10105-101050460 = "Hum,"
10105-101050470 = "não sei se podemos chamar de apresentação extra, mas"
10105-101050480 = "foi decidido que faremos mais um show"
10105-101050490 = "a pedido de todos."
10105-101050500 = "Muito obrigada por ter vindo hoje!"
10105-101050510 = "Sinto como se tivesse ganhado um presente surpresa."
10105-101050520 = "Boa sorte no restante dos shows também."
10105-101050530 = "Vou estar torcendo por você até o fim."
10105-101050540 = "Sim!"
10105-101050550 = "Venha assistir de novo, por favor, Sensei."
10105-101050560 = "Sensei"
10105-101050570 = "Se não for incômodo,"
10105-101050580 = "hoje no fim da tarde,"
10105-101050590 = "você teria um tempinho para mim?"
10105-101050600 = "Claro que sim, Mari."
10105-101050610 = "Aconteceu alguma coisa?"
10105-101050620 = "Muito obrigada."
10105-101050630 = "Sobre o assunto, prefiro contar quando nos encontrarmos mais tarde..."
10105-101050640 = "E-Então,"
10105-101050650 = "conto com a sua presença."
10105-101050660 = "Sensei,"
10105-101050670 = "muito obrigada por me acompanhar na volta."
10105-101050680 = "Se eu tiver outra oportunidade de subir ao palco,"
10105-101050690 = "darei o meu melhor novamente."
10105-101050700 = "Tenho certeza de que todo mundo vai adorar!"
10105-101050710 = "Isso não significa que acabou para sempre. Fique tranquila."
10105-101050720 = "Hehe."
10105-101050730 = "Muito obrigada."
10105-101050740 = "Então, boa noite, Sensei."
10105-101050750 = "...Na próxima vez, se você quiser,"
10105-101050760 = "deixe-me cantar para você de novo, tá?"
