[translation]
10105-101050010 = "Неожиданный поворот событий."
10105-101050020 = "Неужели"
10105-101050030 = "я стану идолом..."
10105-101050040 = "Ты сейчас тренируешься?"
10105-101050050 = "Всё получается?"
10105-101050060 = "А."
10105-101050070 = "Да."
10105-101050080 = "Благодаря вам, Сенсей, всё идёт хорошо!"
10105-101050090 = "Сенсей, спасибо вам за сегодня."
10105-101050100 = "Благодаря вам тренировка продвинулась."
10105-101050110 = "Это хорошо."
10105-101050120 = "Яичный омлет был вкусным."
10105-101050130 = "Я спокойна."
10105-101050140 = "Рада, что вам понравилось."
10105-101050150 = "Спасибо, Сенсей."
10105-101050160 = "Нет, это я должен благодарить."
10105-101050170 = "В этот раз ведь это ты всё приготовила! Моя победа...!"
10105-101050180 = "Ну..."
10105-101050190 = "Значит, всё хорошо...?"
10105-101050200 = "Мы провели репетицию,"
10105-101050210 = "и я получила столько поддержки."
10105-101050220 = "Это просто замечательно."
10105-101050230 = "Я так и знал!"
10105-101050240 = "Мари ведь все любят!"
10105-101050250 = "...П-правда?"
10105-101050260 = "Я всё ещё не чувствую себя идолом..."
10105-101050270 = "Кстати,"
10105-101050280 = "как бы сказать..."
10105-101050290 = "Был один зритель с необычной поддержкой."
10105-101050300 = "Это было неожиданно."
10105-101050310 = "Столько людей..."
10105-101050320 = "Что бы это значило..."
10105-101050330 = "Я так и знал!"
10105-101050340 = "Мари ведь все любят!"
10105-101050350 = "Сенсей...?"
10105-101050360 = "Это же почти то же самое, что вы сказали раньше..."
10105-101050370 = "В любом случае, спасибо за сегодня."
10105-101050380 = "Если позволите,"
10105-101050390 = "в следующий раз"
10105-101050400 = "я покажу вам свой наряд."
10105-101050410 = "График оказался"
10105-101050420 = "более напряжённым, чем я думала."
10105-101050430 = "Но я рада, что всем понравилось."
10105-101050440 = "Будут ещё концерты?"
10105-101050450 = "У вас будет дополнительное выступление?"
10105-101050460 = "Ну..."
10105-101050470 = "Не знаю, можно ли назвать это дополнительным,"
10105-101050480 = "но следующий концерт уже назначен."
10105-101050490 = "По просьбе зрителей."
10105-101050500 = "Спасибо, что пришли сегодня!"
10105-101050510 = "Как будто я получила сюрприз."
10105-101050520 = "Удачи на оставшихся выступлениях."
10105-101050530 = "Я буду болеть за тебя до конца."
10105-101050540 = "Да!"
10105-101050550 = "Приходите ещё, Сенсей."
10105-101050560 = "Сенсей."
10105-101050570 = "Если вам удобно,"
10105-101050580 = "сегодня вечером"
10105-101050590 = "у вас найдётся время?"
10105-101050600 = "Конечно, Мари."
10105-101050610 = "Что-то случилось?"
10105-101050620 = "Спасибо."
10105-101050630 = "Подробности скажу при встрече..."
10105-101050640 = "Тогда,"
10105-101050650 = "буду рассчитывать на вас."
10105-101050660 = "Сенсей."
10105-101050670 = "Спасибо, что проводили меня."
10105-101050680 = "Если у меня снова будет возможность выйти на сцену,"
10105-101050690 = "я постараюсь изо всех сил."
10105-101050700 = "Я уверен, все будут рады!"
10105-101050710 = "Это ведь не конец. Всё будет хорошо."
10105-101050720 = "Хе-хе."
10105-101050730 = "Спасибо."
10105-101050740 = "Ну тогда, Сенсей, спокойной ночи."
10105-101050750 = "...В следующий раз, если можно,"
10105-101050760 = "я спою для вас."