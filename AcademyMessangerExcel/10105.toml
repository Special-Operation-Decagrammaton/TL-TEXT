[translation]
10105-101050010 = "Всё превратилось"
10105-101050020 = "в нечто совершенно неожиданное."
10105-101050030 = "Чтобы я стала айдолом..."
10105-101050040 = "Ты сейчас репетируешь?"
10105-101050050 = "Всё идёт хорошо?"
10105-101050060 = "А."
10105-101050070 = "Да."
10105-101050080 = "Благодаря тебе всё идёт гладко!"
10105-101050090 = "Огромное спасибо за сегодня, Сенсей."
10105-101050100 = "Без тебя репетиция не прошла бы так хорошо."
10105-101050110 = "Рулет из омлета был вкусным."
10105-101050120 = "Такое чувство, что больше всего выиграл я."
10105-101050130 = "Не говори так"
10105-101050140 = "Но я рада, что тебе понравилось"
10105-101050150 = "Спасибо, Сенсей."
10105-101050160 = "Ха-ха! Сегодня полный успех!"
10105-101050170 = "Никаких возражений! Полная победа!"
10105-101050180 = "...???"
10105-101050190 = "Что?"
10105-101050200 = "Репетиционное выступление..."
10105-101050210 = "Я совсем этого не ожидала,"
10105-101050220 = "но оно понравилось стольким людям! Я так счастлива!"
10105-101050230 = "...? А я именно этого и ожидал"
10105-101050240 = "Мари, похоже, ты единственная, кто не ожидал."
10105-101050250 = "Вот как?"
10105-101050260 = "Тогда я рада это слышать..."
10105-101050270 = "Но с другой стороны"
10105-101050280 = "Как бы сказать?"
10105-101050290 = "Некоторые люди отреагировали... странно."
10105-101050300 = "Это превзошло все мои ожидания."
10105-101050310 = "Чтобы столько людей..."
10105-101050320 = "Как вообще так получилось...?"
10105-101050330 = "...? А я именно этого и ожидал"
10105-101050340 = "Мари, похоже, ты единственная, кто не ожидал."
10105-101050350 = "Сенсей...?"
10105-101050360 = "У меня странное чувство дежавю."
10105-101050370 = "В любом случае, спасибо за сегодня."
10105-101050380 = "Эм..."
10105-101050390 = "В следующий раз"
10105-101050400 = "надеюсь, мы снова сможем сделать что-то подобное... вместе."
10105-101050410 = "Наш график"
10105-101050420 = "оказался плотнее, чем я ожидала."
10105-101050430 = "Но я рада, что всем понравилось."
10105-101050440 = "Вы будете давать ещё концерты?"
10105-101050450 = "О-о-о, дополнительный концерт?"
10105-101050460 = "А."
10105-101050470 = "Эм-м. Точного термина я не знаю..."
10105-101050480 = "Да."
10105-101050490 = "Что-то такое."
10105-101050500 = "Спасибо, что пришли сегодня, Сенсей."
10105-101050510 = "Это был такой приятный сюрприз."
10105-101050520 = "Удачи с оставшимися концертами."
10105-101050530 = "Старайся до самого конца!"
10105-101050540 = "...!"
10105-101050550 = "Да!!"
10105-101050560 = "Сенсей"
10105-101050570 = "Случайно"
10105-101050580 = "у вас сегодня вечером"
10105-101050590 = "найдётся немного времени?"
10105-101050600 = "...Мари?"
10105-101050610 = "Да, но... всё в порядке?"
10105-101050620 = "А."
10105-101050630 = "Всё хорошо..."
10105-101050640 = "Спасибо."
10105-101050650 = "Тогда скоро увидимся."
10105-101050660 = "Ты нормально добрался домой, Сенсей?"
10105-101050670 = "Спасибо, что помогли мне безопасно добраться обратно. Сейчас я отдыхаю в своей комнате."
10105-101050680 = "Надеюсь, однажды"
10105-101050690 = "у нас снова будет возможность для чего-то подобного."
10105-101050700 = "Когда захочешь, Мари."
10105-101050710 = "Талант-то у тебя никуда не денется!"
10105-101050720 = "Хи-хи."
10105-101050730 = "Вы правы. Я это запомню."
10105-101050740 = "Тогда спокойной ночи, Сенсей."
10105-101050750 = "Может быть, в следующий раз я спою для вас песню"
10105-101050760 = "Если захотите, конечно."
