[translation]
20061-200610010 = "Hm-mph!!"
20061-200610020 = "Hmph-mph-mph!!!"
20061-200610030 = "Mph-mph-mph-mph-mph~~~~!!!!"
20061-200610040 = "I've seen this pattern before..."
20061-200610050 = "Having some trouble?"
20061-200610060 = "As expected of Sensei."
20061-200610070 = "You're quick on the uptake, which really helps!"
20061-200610080 = "I see—well, first of all..."
20061-200610090 = "Shall we meet up and talk?"
20061-200610100 = "Thanks to you, my shopping went smoothly."
20061-200610110 = "My thanks."
20061-200610120 = "There was an envelope along with the taiyaki."
20061-200610130 = "Is this Kasumi's?"
20061-200610140 = "Yeah."
20061-200610150 = "That's just a little something for your trouble."
20061-200610160 = "You should keep it."
20061-200610170 = "I'm going to return it."
20061-200610180 = "Where are you right now?"
20061-200610190 = "No need to be polite."
20061-200610200 = "I wouldn't be able to rest easy otherwise."
20061-200610210 = "Kasumi?"
20061-200610220 = "Hah..."
20061-200610230 = "Understood."
20061-200610240 = "Understood completely."
20061-200610250 = "Are you free at all?"
20061-200610260 = "You helped me prepare for the trip before, didn't you?"
20061-200610270 = "Today is that day."
20061-200610280 = "I can't just keep accepting favors without returning them."
20061-200610290 = "I'd like to invite Sensei as a guest."
20061-200610300 = "Is it really okay for me to join?"
20061-200610310 = "Wasn't this a club trip?"
20061-200610320 = "Sensei is more than welcome."
20061-200610330 = "When I told the club members about this..."
20061-200610340 = "They were through the roof."
20061-200610350 = "If you hadn't come after all this, goodness knows what would have happened..."
20061-200610360 = "Sensei."
20061-200610370 = "Did you make it back safely?"
20061-200610380 = "I got yelled at a lot."
20061-200610390 = "Somehow, yes."
20061-200610400 = "I'm sorry for dragging you into this."
20061-200610410 = "Instead of paying back my debt, I've just added to it."
20061-200610420 = "I will definitely make it up to you properly."
20061-200610430 = "Hmph."
20061-200610440 = "How troubling."
20061-200610450 = "This wasn't my intention at all."
20061-200610460 = "I'm getting used to this pattern too."
20061-200610470 = "Need any help?"
20061-200610480 = "It helps that you catch on so fast."
20061-200610490 = "The Prefect Team seems quite furious this time."
20061-200610500 = "It's difficult even to walk outside."
20061-200610510 = "So you'll feel safe if I accompany you?"
20061-200610520 = "Sure, let's head out together!"
20061-200610530 = "Well, that's assuming Sensei is willing."
20061-200610540 = "I'll send you my location, so come over if you feel like it."
20061-200610550 = "Did you make it back safely?"
20061-200610560 = "It can be dangerous around here, after all."
20061-200610570 = "We only went to places where the Prefect Team wasn't around, though."
20061-200610580 = "Did I really need to come with you?"
20061-200610590 = "Hm?"
20061-200610600 = "Naturally."
20061-200610610 = "Or perhaps..."
20061-200610620 = "You're saying this was just an excuse to be with Sensei?"
20061-200610630 = "Do you have a moment?"
20061-200610640 = "I always say I'm going to repay you..."
20061-200610650 = "Yet I never seem to do it properly."
20061-200610660 = "It's fine."
20061-200610670 = "Helping students is my job, after all."
20061-200610680 = "I'm not fine with it."
20061-200610690 = "Haven't I always told you?"
20061-200610700 = "I hate owing people."
20061-200610710 = "Sensei."
20061-200610720 = "I am truly sorry."
20061-200610730 = "I acted selfishly even though you must be busy."
20061-200610740 = "Did anything happen on your way back?"
20061-200610750 = "Nothing happened, but..."
20061-200610760 = "Are you really okay?"
20061-200610770 = "Don't worry about me."
20061-200610780 = "I'll contact you again."
20061-200610790 = "Good grief..."
20061-200610800 = "Is expressing gratitude really this difficult?"
20061-200610810 = "So..."
20061-200610820 = "Sensei."
20061-200610830 = "It's fine."
20061-200610840 = "Where shall we meet today?"
20061-200610850 = "I'll send you a map."
20061-200610860 = "Knowing you are Sensei..."
20061-200610870 = "I trust that nothing untoward will happen."
20061-200610880 = "So if word of today's events were to reach my ears..."
20061-200610890 = "My first priority would be confirming Sensei's safety."
20061-200610900 = "Yikes!"
20061-200610910 = "That's heavy!"
20061-200610920 = "Just joking."
20061-200610930 = "I trust you, after all."
