[translation]
20061-200610010 = "Hmph!!"
20061-200610020 = "Hm-hmph!!!"
20061-200610030 = "Hmph-hmph-hmph~!!!!"
20061-200610040 = "Eu já vi esse padrão antes..."
20061-200610050 = "Está com algum problema?"
20061-200610060 = "Como esperado do Sensei!"
20061-200610070 = "Ter alguém perspicaz assim ajuda muito!"
20061-200610080 = "Pois bem — para começar,"
20061-200610090 = "que tal nos encontrarmos para conversar?"
20061-200610100 = "Graças a você, as compras renderam muito bem"
20061-200610110 = "Agradeço"
20061-200610120 = "Tinha um envelope junto com o saco de taiyaki"
20061-200610130 = "Isso é seu, Kasumi?"
20061-200610140 = "Ah"
20061-200610150 = "Isso é só uma pequena gratificação pelo seu trabalho"
20061-200610160 = "Pode ficar para você"
20061-200610170 = "Estou indo aí devolver"
20061-200610180 = "Onde você está agora?"
20061-200610190 = "Não precisa de cerimônia"
20061-200610200 = "Se eu não fizer isso, não fico com a consciência tranquila"
20061-200610210 = "Kasumi?"
20061-200610220 = "Suspiro..."
20061-200610230 = "Entendi"
20061-200610240 = "Já entendi, está bem"
20061-200610250 = "Você está com a agenda livre?"
20061-200610260 = "Lembra que me ajudou com os preparativos daquela viagem antes?"
20061-200610270 = "Pois hoje é o grande dia"
20061-200610280 = "E como eu não posso ficar apenas em dívida com você,"
20061-200610290 = "resolvi convidá-lo como nosso convidado de honra, Sensei"
20061-200610300 = "Mas tudo bem eu ir junto?"
20061-200610310 = "Não era uma viagem do clube?"
20061-200610320 = "Sendo você, Sensei, é mais do que bem-vindo!"
20061-200610330 = "Quando ouviram falar disso,"
20061-200610340 = "os membros do clube ficaram em polvorosa"
20061-200610350 = "Se você não vier agora, nem sei o que pode acontecer..."
20061-200610360 = "Sensei"
20061-200610370 = "Conseguiu voltar bem pra casa?"
20061-200610380 = "Levei uma bronca colossal"
20061-200610390 = "Dei um jeito de voltar, sim"
20061-200610400 = "Foi mal por acabar te arrastando pra confusão"
20061-200610410 = "Eu queria quitar a minha dívida e acabei ficando com uma maior ainda"
20061-200610420 = "Juro que vou compensar você por isso em outra ocasião"
20061-200610430 = "Hum..."
20061-200610440 = "Que complicação"
20061-200610450 = "Não era essa a minha intenção, mas..."
20061-200610460 = "Já até me acostumei com esse padrão"
20061-200610470 = "Quer ajuda com alguma coisa?"
20061-200610480 = "Gosto assim, quando a gente se entende rápido"
20061-200610490 = "Desta vez o Comitê Disciplinar parece estar furioso pra valer,"
20061-200610500 = "então está difícil até de dar um passo na rua"
20061-200610510 = "Quer dizer que, se eu estiver junto, você fica mais segura?"
20061-200610520 = "Pode deixar, vamos sair juntos então!"
20061-200610530 = "Bom, só se não for te atrapalhar, Sensei"
20061-200610540 = "Vou te mandar a minha localização; se estiver a fim, apareça por aqui"
20061-200610550 = "Chegou bem em casa?"
20061-200610560 = "Essa região anda bem perigosa"
20061-200610570 = "A gente só passou por lugares onde o Comitê Disciplinar não estava..."
20061-200610580 = "Precisava mesmo de mim indo junto?"
20061-200610590 = "Hum?"
20061-200610600 = "É claro que precisava"
20061-200610610 = "Ou o que você está insinuando?"
20061-200610620 = "Que tudo não passou de uma desculpa para ficar junto com você, Sensei?"
20061-200610630 = "Tem um minutinho?"
20061-200610640 = "Vivo dizendo que vou retribuir os seus favores,"
20061-200610650 = "mas ainda não consegui fazer isso direito"
20061-200610660 = "Não esquenta com isso"
20061-200610670 = "Ajudar as minhas alunas é o meu trabalho"
20061-200610680 = "Mas EU me importo com isso"
20061-200610690 = "Eu sempre digo, não digo?"
20061-200610700 = "Que detesto ficar devendo favores"
20061-200610710 = "Sensei"
20061-200610720 = "Peço mil desculpas mesmo"
20061-200610730 = "Sei que você anda ocupado e mesmo assim fui egoísta"
20061-200610740 = "Não aconteceu nenhum imprevisto no caminho de volta?"
20061-200610750 = "Não aconteceu nada, mas..."
20061-200610760 = "Tem certeza de que você está bem?"
20061-200610770 = "Não se preocupe comigo"
20061-200610780 = "Entro em contato de novo depois"
20061-200610790 = "Francamente..."
20061-200610800 = "Dar um simples agradecimento sempre foi algo tão difícil assim?"
20061-200610810 = "Então..."
20061-200610820 = "Sensei"
20061-200610830 = "Tudo bem sim"
20061-200610840 = "Onde a gente se encontra hoje?"
20061-200610850 = "Vou te mandar o mapa"
20061-200610860 = "Tratando-se de você, Sensei,"
20061-200610870 = "sei que não há chance de vazar por acidente"
20061-200610880 = "Portanto, se a história de hoje chegar aos meus ouvidos vinda de algum lugar..."
20061-200610890 = "A primeira coisa que farei será ir conferir pessoalmente o seu 'bem-estar', Sensei"
20061-200610900 = "Que medo!"
20061-200610910 = "Que pesado!"
20061-200610920 = "É brincadeira"
20061-200610930 = "Afinal, eu confio em você"
