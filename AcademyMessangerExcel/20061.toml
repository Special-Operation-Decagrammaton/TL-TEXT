[translation]
20061-200610010 = "Хм!!"
20061-200610020 = "Хммм!!!"
20061-200610030 = "Хмммммммм!!!"
20061-200610040 = "Я уже видел эту закономерность..."
20061-200610050 = "Вас что-то беспокоит?"
20061-200610060 = "Как и следовало ожидать от Сенсея"
20061-200610070 = "Я ценю вашу проницательность!"
20061-200610080 = "Ну, во-первых"
20061-200610090 = "Может, встретимся и поговорим?"
20061-200610100 = "Благодаря вам мои покупки прошли удачно."
20061-200610110 = "Спасибо."
20061-200610120 = "Вместе с тайяки был конверт."
20061-200610130 = "Это от Касуми?"
20061-200610140 = "Да."
20061-200610150 = "Это небольшая плата за труды."
20061-200610160 = "Оставьте себе."
20061-200610170 = "Я приду и верну его."
20061-200610180 = "Где ты сейчас?"
20061-200610190 = "Не стесняйтесь."
20061-200610200 = "Пока не сделаю — не успокоюсь."
20061-200610210 = "Касуми?"
20061-200610220 = "Ха..."
20061-200610230 = "Понял."
20061-200610240 = "Я всё прекрасно понимаю."
20061-200610250 = "У вас есть свободное время?"
20061-200610260 = "Вы же помогали мне готовиться к поездке раньше, правда?"
20061-200610270 = "Сегодня как раз тот день."
20061-200610280 = "Я не могу вечно быть вам обязанной."
20061-200610290 = "Давайте пригласим Сенсея в качестве гостя."
20061-200610300 = "Можно мне присоединиться?"
20061-200610310 = "Разве это не была клубная поездка?"
20061-200610320 = "Если это Сенсей, то всегда добро пожаловать."
20061-200610330 = "Услышав эту новость,"
20061-200610340 = "Члены клуба на седьмом небе от счастья."
20061-200610350 = "Кто знает, что будет, если вы не придёте..."
20061-200610360 = "Сенсей."
20061-200610370 = "Ты благополучно добрался домой?"
20061-200610380 = "Меня сильно отругали."
20061-200610390 = "Как-то так."
20061-200610400 = "Извини, что втянул тебя."
20061-200610410 = "Хотел вернуть долг, а только увеличил его."
20061-200610420 = "Обязательно отплачу за это как-нибудь."
20061-200610430 = "Хм."
20061-200610440 = "Вот незадача."
20061-200610450 = "Я не этого хотел."
20061-200610460 = "Я уже привык к такому."
20061-200610470 = "Может, помочь чем-нибудь?"
20061-200610480 = "Хорошо, что ты быстро понимаешь."
20061-200610490 = "Похоже, на этот раз Дисциплинарный комитет сильно недоволен."
20061-200610500 = "Даже выйти на улицу сложно."
20061-200610510 = "То есть со мной вам спокойнее?"
20061-200610520 = "Ладно, пойдёмте вместе!"
20061-200610530 = "Ну, если Сенсей не против."
20061-200610540 = "Я пришлю вам место, приходите, если захотите."
20061-200610550 = "Вы благополучно добрались домой?"
20061-200610560 = "Тут район опасный."
20061-200610570 = "Мы ходили только туда, где нет Дисциплинарного комитета."
20061-200610580 = "Разве было нужно, чтобы я шла с вами?"
20061-200610590 = "М?"
20061-200610600 = "Конечно."
20061-200610610 = "Или что?"
20061-200610620 = "Думаете, это был повод побыть с Сенсеем?"
20061-200610630 = "Можно тебя на минутку?"
20061-200610640 = "Я всё время говорю, что хочу отблагодарить."
20061-200610650 = "Но у меня это не получается."
20061-200610660 = "Всё в порядке."
20061-200610670 = "Помогать ученикам — моя работа."
20061-200610680 = "Это я не в порядке."
20061-200610690 = "Я же всегда говорю, правда?"
20061-200610700 = "Что не люблю быть в долгу."
20061-200610710 = "Сенсей."
20061-200610720 = "Правда, извините."
20061-200610730 = "Вы, наверное, заняты, а я тут со своими просьбами."
20061-200610740 = "По дороге домой ничего не случилось?"
20061-200610750 = "Ничего не было, но..."
20061-200610760 = "Ты точно в порядке?"
20061-200610770 = "Не беспокойтесь обо мне."
20061-200610780 = "Я свяжусь с вами позже."
20061-200610790 = "Совсем..."
20061-200610800 = "Неужели благодарность так сложна?"
20061-200610810 = "Итак..."
20061-200610820 = "Сенсей"
20061-200610830 = "Всё в порядке."
20061-200610840 = "Где встретимся сегодня?"
20061-200610850 = "Я пришлю вам карту."
20061-200610860 = "Это ведь вы, Сенсей."
20061-200610870 = "Я думаю, ничего плохого не случится."
20061-200610880 = "Так что если услышу что-то о сегодняшнем..."
20061-200610890 = "Первым делом проверю, что с Сенсеем всё в порядке."
20061-200610900 = "Страшно!"
20061-200610910 = "Тяжело!"
20061-200610920 = "Шутка."
20061-200610930 = "Я верю в тебя."