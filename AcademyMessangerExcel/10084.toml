[translation]
10084-100840010 = "Я читала одну статью со сплетнями,"
10084-100840020 = "и там говорилось, что самый популярный вид упражнений для пар"
10084-100840030 = "— это походы в горы."
10084-100840040 = "Почему именно походы?"
10084-100840050 = "У такого занятия в целом низкий порог входа."
10084-100840060 = "А ещё, поскольку в горах обычно меньше людей,"
10084-100840070 = "у пар больше возможностей для глубоких разговоров."
10084-100840080 = "Понятно..."
10084-100840090 = "Понимаю преимущества."
10084-100840100 = "Именно поэтому"
10084-100840110 = "я очень жду этих выходных."
10084-100840120 = "Почему...?"
10084-100840130 = "Алло? Котама?"
10084-100840140 = "Может, вице-президент была права."
10084-100840150 = "Возможно, быть немного активнее в этом году и правда было бы неплохо."
10084-100840160 = "Согласен, но я удивлён!"
10084-100840170 = "Что заставило тебя так решить?"
10084-100840180 = "Я поняла, что хакерам тоже нужно быть в хорошей физической форме."
10084-100840190 = "Тот поход был суровым столкновением с реальностью..."
10084-100840200 = "А если бы я могла взбираться на холмы, как вице-президент Чихиро,"
10084-100840210 = "я могла бы подслушивать откуда угодно."
10084-100840220 = "Не уверен, что мне нравится такая мотивация."
10084-100840230 = "Вы свободны на выходных, Сенсей?"
10084-100840240 = "Особых планов у меня нет..."
10084-100840250 = "Тогда пойдём со мной в горы."
10084-100840260 = "Мне нужен реванш."
10084-100840270 = "Могу, но..."
10084-100840280 = "Хочешь, в этот раз я возьму спички?"
10084-100840290 = "Нет. Не в этот раз."
10084-100840300 = "На этот раз — никакой искусственности."
10084-100840310 = "Я хочу записать саму сущность природы."
10084-100840320 = "Я редактировала звуковые фрагменты с нашего прошлого похода,"
10084-100840330 = "и в записи попали какие-то странные звуки."
10084-100840340 = "Думаю, мне нужно вернуться в горы и попробовать снова."
10084-100840350 = "В запись попал мой голос?"
10084-100840360 = "Нет-нет."
10084-100840370 = "Если бы там был голос Сенсея, я бы хранила эти записи вечно..."
10084-100840380 = "А."
10084-100840390 = "Ты не меняешься, Котама."
10084-100840400 = "В следующий раз, когда пойдёшь в горы, возьми меня с собой!"
10084-100840410 = "А?"
10084-100840420 = "У тебя есть работа для Шале где-то в глуши?"
10084-100840430 = "Ну, мы ведь каждый раз сдаёмся на полпути."
10084-100840440 = "Давай вместе доберёмся до вершины!"
10084-100840450 = "Хорошо."
10084-100840460 = "...Ладно?"
