[translation]
10084-100840010 = "Недавно в журнале..."
10084-100840020 = "В рубрике «Рекомендации для пар, которые мало двигаются! 10 лёгких упражнений»"
10084-100840030 = "пеший туризм занял первое место."
10084-100840040 = "...Туризм?"
10084-100840050 = "Говорят, что по сравнению с другими видами спорта"
10084-100840060 = "для пешего туризма не нужны тренировки или специальная подготовка, поэтому начать легко,"
10084-100840070 = "и можно проводить много времени наедине, разговаривая."
10084-100840080 = "Понятно..."
10084-100840090 = "Если подумать, возможно, так и есть."
10084-100840100 = "Да, поэтому..."
10084-100840110 = "Я жду следующих выходных с нетерпением."
10084-100840120 = "Следующих выходных...?"
10084-100840130 = "...Эм, Котама?"
10084-100840140 = "Действительно, как сказала заместительница..."
10084-100840150 = "Возможно, неплохо бы иметь немного больше физической силы."
10084-100840160 = "Это хорошая мысль, но..."
10084-100840170 = "...Почему вдруг?"
10084-100840180 = "Для деятельности хакера тоже нужна определённая физическая выносливость."
10084-100840190 = "Я осознала это во время прошлого похода..."
10084-100840200 = "Если бы я могла приобрести такую же силу, как у заместительницы Чихиро, которая легко взбирается по крутым обрывам..."
10084-100840210 = "Тогда у меня было бы больше вариантов для мест ожидания при прослушке."
10084-100840220 = "...И что мне на это ответить?"
10084-100840230 = "Сенсей, вы свободны в эти выходные?"
10084-100840240 = "Особых планов нет, но..."
10084-100840250 = "Тогда не хотите ли сходить в горы вдвоём?"
10084-100840260 = "...Я хочу взять реванш за прошлый раз."
10084-100840270 = "Я не против, но..."
10084-100840280 = "На всякий случай взять зажигалку?"
10084-100840290 = "Нет, не надо."
10084-100840300 = "На этот раз я исключу все искусственные факторы..."
10084-100840310 = "Я планирую записать только саму природу."
10084-100840320 = "Прослушивая запись, сделанную в прошлый раз в горах..."
10084-100840330 = "Оказалось, что в неё попали какие-то помехи..."
10084-100840340 = "Нужно сходить снова."
10084-100840350 = "Может, туда попал мой голос?"
10084-100840360 = "Нет, не то..."
10084-100840370 = "Скорее, если бы туда попал ваш голос, его можно было бы использовать по-разному..."
10084-100840380 = "А."
10084-100840390 = "Котама не меняется..."
10084-100840400 = "Если у вас снова есть дело, пойдёмте вместе."
10084-100840410 = "Что?"
10084-100840420 = "У Сенсея тоже есть какое-то дело в горах?"
10084-100840430 = "Потому что вы всегда возвращаетесь на полпути..."
10084-100840440 = "В этот раз, может, попробуем вместе дойти до вершины."
10084-100840450 = "Да."
10084-100840460 = "...Да?"