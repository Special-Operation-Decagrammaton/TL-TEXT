[translation]
10084-100840010 = "Outro dia, vi numa revista..."
10084-100840020 = "Uma matéria chamada \"Recomendado para casais sedentários! 10 exercícios leves\","
10084-100840030 = "e trilha na montanha estava em 1º lugar."
10084-100840040 = "...Trilha na montanha?"
10084-100840050 = "Comparada a outros esportes, a trilha"
10084-100840060 = "é fácil de começar, já que não exige treino nem preparativos especiais,"
10084-100840070 = "e dizem que é porque dá para passar bastante tempo conversando a sós."
10084-100840080 = "Entendi..."
10084-100840090 = "Pensando bem, faz sentido."
10084-100840100 = "Sim, portanto..."
10084-100840110 = "Estou ansiosa pelo próximo fim de semana."
10084-100840120 = "Próximo fim de semana...?"
10084-100840130 = "...Er, senhorita Kotama?"
10084-100840140 = "De fato, como a vice-presidente disse..."
10084-100840150 = "Talvez seja melhor eu ter um pouco mais de preparo físico."
10084-100840160 = "É uma boa ideia, mas..."
10084-100840170 = "...Por que isso do nada?"
10084-100840180 = "Para atuar como hacker, também é necessário ter um certo condicionamento físico."
10084-100840190 = "Percebi isso na pele durante a última trilha na montanha..."
10084-100840200 = "Se eu tivesse o preparo físico da vice-presidente Chihiro para escalar até penhascos íngremes com facilidade..."
10084-100840210 = "Certamente ampliaria o meu leque de pontos de tocaia para escutas."
10084-100840220 = "...Nem sei o que responder a isso."
10084-100840230 = "Sensei, você está livre neste fim de semana?"
10084-100840240 = "Não tenho nada planejado, mas..."
10084-100840250 = "Nesse caso, que tal irmos para a montanha juntos?"
10084-100840260 = "...Quero uma revanche pela última vez."
10084-100840270 = "Por mim tudo bem, mas..."
10084-100840280 = "Quer que eu leve fósforos por precaução?"
10084-100840290 = "Não, não precisa."
10084-100840300 = "Desta vez, pretendo eliminar todos os elementos artificiais..."
10084-100840310 = "e gravar a própria natureza em seu estado puro."
10084-100840320 = "Eu estava conferindo os áudios que gravei na montanha da última vez..."
10084-100840330 = "Mas parece que entrou um pouco de ruído em uma parte..."
10084-100840340 = "Vou precisar ir lá mais uma vez."
10084-100840350 = "Será que a minha voz acabou saindo na gravação...?"
10084-100840360 = "Não, não foi isso..."
10084-100840370 = "Pelo contrário, se a sua voz tivesse entrado, Sensei, teria várias utilidades..."
10084-100840380 = "Ah"
10084-100840390 = "Você não muda mesmo, né, Kotama...?"
10084-100840400 = "Se precisar ir lá de novo, vamos juntos."
10084-100840410 = "Como?"
10084-100840420 = "Você também tem algo para fazer na montanha, Sensei?"
10084-100840430 = "É que a gente sempre voltava da metade do caminho..."
10084-100840440 = "Pensei que dessa vez podíamos tentar chegar juntos até o topo."
10084-100840450 = "Sim."
10084-100840460 = "...Quê?"
