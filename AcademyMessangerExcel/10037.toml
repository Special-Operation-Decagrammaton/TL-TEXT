[translation]
10037-100370010 = "Tem algo de errado."
10037-100370020 = "???"
10037-100370030 = "Ultimamente, os lanches armazenados no Clube de Merenda Escolar têm sumido um atrás do outro."
10037-100370040 = "Principalmente a quantidade de pudins, que não bate de jeito nenhum com os números registrados no livro-caixa."
10037-100370050 = "Não foi só um erro na contagem...?"
10037-100370060 = "Será que alguém não comeu escondido?"
10037-100370070 = "Não, isso é impossível!"
10037-100370080 = "Afinal, eu recontei várias e várias vezes junto com as outras integrantes do Comitê de Segurança!"
10037-100370090 = "Não, isso é impossível!"
10037-100370100 = "As instalações do Clube de Merenda Escolar são vigiadas rigorosamente por nós, do Comitê de Segurança!"
10037-100370110 = "Se não foi erro de contagem e ninguém comeu, então só resta uma explicação..."
10037-100370120 = "Sem dúvida alguma, trata-se de um ato de sabotagem executado por um espião que planeja atacar a Academia Federal Red Winter!"
10037-100370130 = "...Um espião?"
10037-100370140 = "Isso mesmo. Além de o território da Academia Federal Red Winter ser imenso, os registros das alunas quase não são digitalizados. Há até várias estudantes das quais a Secretaria nem tem controle."
10037-100370150 = "Não seria nada estranho se um \"espião\" enviado por alguma academia externa tivesse se infiltrado no meio delas."
10037-100370160 = "Certamente estava usando esses pequenos incidentes para sondar o terreno antes de incitar um conflito interno na Academia Federal Red Winter em um futuro próximo..."
10037-100370170 = "Chegando a esse ponto, não há escolha... A partir de agora, dou início à operação de caça ao espião!"
10037-100370180 = "Sensei, trago novas informações sobre aquele espião."
10037-100370190 = "Parece que aquele espião covarde teve a audácia de roubar o pudim da Presidente Cherino desta vez."
10037-100370200 = "Tem certeza absoluta de que isso é obra de um espião?"
10037-100370210 = "Sim, com certeza. Afinal, a segurança da Academia Federal Red Winter é sempre impecável!"
10037-100370220 = "Seria impossível ocorrer qualquer problema a menos que um espião tivesse se infiltrado!"
10037-100370230 = "Portanto, é indiscutivelmente obra de um espião."
10037-100370240 = "Contudo, surgiu um problema... Por algum motivo, a Presidente Cherino parece achar que fui eu quem roubou o pudim."
10037-100370250 = "Quer dizer, não é que eu não tenha ideia do motivo de ela pensar isso, mas..."
10037-100370260 = "Pelo contrário, é uma ótima oportunidade! Desta vez vou capturar o espião e provar a minha competência e a minha inocência!"
10037-100370270 = "...Escute só, Sensei."
10037-100370280 = "Estou cumprindo punição por aquele incidente em que quebrei a estátua de pedra da Presidente Cherino outro dia..."
10037-100370290 = "Não me diga que você está no prédio antigo da escola agora?"
10037-100370300 = "Vou aí te visitar de vez em quando. Se precisar de alguma coisa, é só falar."
10037-100370310 = "Não! Eu não fui mandada para o prédio antigo!!"
10037-100370320 = "Graças à imensa misericórdia da Presidente Cherino, fui poupada de ir para o prédio antigo, mas..."
10037-100370330 = "Assim como das outras vezes, recebi a pena de \"uma semana limpando os banheiros\"."
10037-100370340 = "No entanto, de certa forma, isso também é uma missão ordenada pela Presidente Cherino."
10037-100370350 = "Eu, Marina, cumprirei a ordem da Presidente com todas as minhas forças!"
10037-100370360 = "Entendi, bom trabalho. Boa sorte lá."
10037-100370370 = "Do que você está falando?"
10037-100370380 = "Você também vai limpar os banheiros comigo, Sensei."
10037-100370390 = "...Hã?"
10037-100370400 = "Quando a estátua da Presidente quebrou, você também estava lá comigo, não estava?"
10037-100370410 = "Proteger a autoridade do Bigode é dever de todos. Logo, você também cometeu crime de lesa-majestade, Sensei, e é natural que compartilhe dessa responsabilidade comigo."
10037-100370420 = "Vamos lá, Sensei. Amanhã às 7h da manhã, ponto de encontro em frente à Secretaria!"
10037-100370430 = "Cedo demais..."
10037-100370440 = "...Sensei."
10037-100370450 = "Foi mal pedir assim em cima da hora, mas você tem um tempinho agora?"
10037-100370460 = "Aconteceu um problema complicado que não posso contar para as outras integrantes da Secretaria..."
10037-100370470 = "Entendido, já estou indo."
10037-100370480 = "O que aconteceu?"
10037-100370490 = "Pois é, desculpe por ser em um lugar tão afastado da Secretaria, mas..."
10037-100370500 = "Acabei sendo capturada pelas integrantes do Comitê de Segurança..."
10037-100370510 = "O que foi que você aprontou... Estou indo para aí agora mesmo."
