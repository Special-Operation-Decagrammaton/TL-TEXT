[translation]
10037-100370010 = "Что-то не так."
10037-100370020 = "???"
10037-100370030 = "В последнее время из отдела питания одно за другим пропадают угощения."
10037-100370040 = "Особенно количество пудингов совсем не совпадает с записями в журнале."
10037-100370050 = "Может, это ошибка подсчёта...?"
10037-100370060 = "Или кто-то тайком съел?"
10037-100370070 = "Нет, этого не может быть!"
10037-100370080 = "Ведь мы с другими членами охранного комитета пересчитывали несколько раз!"
10037-100370090 = "Нет, этого не может быть!"
10037-100370100 = "Мы, охранный комитет, тщательно следим за объектами отдела питания!"
10037-100370110 = "Если это не ошибка подсчёта и не кто-то съел, тогда..."
10037-100370120 = "Это, без сомнения, диверсия шпиона, пытающегося атаковать федеральную академию Красной Зимы!"
10037-100370130 = "...Шпиона?"
10037-100370140 = "Да. Территория федеральной академии Красной Зимы обширна, а записи о студентах не полностью оцифрованы. В канцелярии даже не знают о многих студентах."
10037-100370150 = "Вполне возможно, что среди них затесался «шпион», присланный из другой академии."
10037-100370160 = "Вероятно, они следили за обстановкой через такие мелкие происшествия и планировали в скором времени устроить внутренний конфликт в академии..."
10037-100370170 = "Раз так, ничего не поделаешь... Начинаю операцию по поимке шпиона!"
10037-100370180 = "Сенсей, есть новые сведения о том шпионе."
10037-100370190 = "Какой-то подлый шпион, судя по всему, украл пудинг председателя Черино."
10037-100370200 = "Вы уверены, что это точно дело рук шпиона?"
10037-100370210 = "Да. Ведь безопасность федеральной академии Красной Зимы всегда безупречна!"
10037-100370220 = "Если бы не шпион, никаких проблем бы не возникло!"
10037-100370230 = "Так что это точно проделки шпиона."
10037-100370240 = "Но есть одна проблема... Почему-то председатель Черино думает, что это я украл пудинг."
10037-100370250 = "Конечно, у меня есть кое-какие подозрения, но..."
10037-100370260 = "С другой стороны, это хороший шанс. На этот раз я поймаю шпиона и докажу свою компетентность и невиновность!"
10037-100370270 = "...Послушайте, Сенсей."
10037-100370280 = "За то, что я разбил статую председателя Черино, меня наказали..."
10037-100370290 = "Может, вы сейчас в старом здании?"
10037-100370300 = "Я буду иногда навещать вас. Если что-то понадобится, скажите."
10037-100370310 = "Нет, меня не отправили в старое здание!!"
10037-100370320 = "Благодаря милости председателя Черино меня не отправили туда, но..."
10037-100370330 = "меня приговорили к «неделе мытья туалетов»."
10037-100370340 = "Но в некотором смысле это тоже приказ председателя Черино."
10037-100370350 = "Я, Марина, выполню приказ председателя изо всех сил!"
10037-100370360 = "Понятно, трудно вам. Держитесь."
10037-100370370 = "Что вы говорите?"
10037-100370380 = "Вы, Сенсей, будете мыть вместе со мной."
10037-100370390 = "...Что?"
10037-100370400 = "Когда разбилась статуя председателя, вы тоже были рядом."
10037-100370410 = "Защита авторитета бороды — обязанность всех. Значит, и вы виновны в неуважении и должны разделить ответственность."
10037-100370420 = "Итак, Сенсей. Завтра в 7 утра у входа в канцелярию!"
10037-100370430 = "Так рано..."
10037-100370440 = "...Сенсей."
10037-100370450 = "Извините, не могли бы вы уделить мне время прямо сейчас?"
10037-100370460 = "Случилось кое-что неприятное, о чём я не могу рассказать другим членам канцелярии..."
10037-100370470 = "Понял, сейчас приду."
10037-100370480 = "Что случилось?"
10037-100370490 = "Да, простите, что приходится встречаться вдали от канцелярии, но..."
10037-100370500 = "меня поймали охранники..."
10037-100370510 = "Что же случилось... Я сейчас приду."
