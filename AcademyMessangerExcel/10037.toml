[translation]
10037-100370010 = "Подозрительно..."
10037-100370020 = "Что?"
10037-100370030 = "Из Клуба школьного питания таинственным образом пропадают закуски."
10037-100370040 = "Особенно заметно, что пудингов гораздо меньше, чем записано в журнале."
10037-100370050 = "Может, вы ошиблись при подсчёте?"
10037-100370060 = "Может, кто-то их съел?"
10037-100370070 = "Это невозможно."
10037-100370080 = "Я несколько раз всё пересчитывала вместе с другими членами Совета безопасности."
10037-100370090 = "Это невозможно."
10037-100370100 = "Совет безопасности следит за помещением Клуба школьного питания как ястреб!"
10037-100370110 = "Так что если это не ошибка подсчёта и никто их не ел..."
10037-100370120 = "Должен быть шпион, который пытается саботировать Академию Красная Зима!"
10037-100370130 = "Шпион?"
10037-100370140 = "Академия Красная Зима очень большая. Есть студенты, о которых мы мало знаем, потому что наши записи ещё не полностью оцифрованы."
10037-100370150 = "Вполне возможно, среди студентов есть шпион из другой академии."
10037-100370160 = "Этот шпион наверняка пытается вызвать внутренний конфликт, ударив по нашим слабостям. Как низко."
10037-100370170 = "Так что с сегодняшнего дня начинается специальная операция по поиску шпиона!"
10037-100370180 = "Сенсей, у нас снова шпионский инцидент."
10037-100370190 = "Этот подлый шпион украл пудинг президента Черины."
10037-100370200 = "Откуда ты знаешь, что это был шпион?"
10037-100370210 = "Потому что система безопасности Академии Красная Зима безупречна!"
10037-100370220 = "Без какого-то саботажа такое просто не могло случиться."
10037-100370230 = "Значит, это шпион."
10037-100370240 = "Но почему-то президент Черина думает, что воровка — я."
10037-100370250 = "Кажется, я догадываюсь, почему она так думает."
10037-100370260 = "Но я поймаю шпиона и докажу свою невиновность!"
10037-100370270 = "Плохие новости, Сенсей."
10037-100370280 = "Меня сурово наказали за то, что я выстрелила в статую президента Черины."
10037-100370290 = "Тебя отправляют в Бывший институт?"
10037-100370300 = "Я навещу тебя, когда смогу."
10037-100370310 = "Нет, меня НЕ отправляют в Бывший институт!"
10037-100370320 = "Благодаря милосердию президента Черины я избежала сурового наказания."
10037-100370330 = "Но мне придётся неделю чистить туалеты, как и в прошлый раз..."
10037-100370340 = "Это унизительная и мерзкая работа, но таков приказ президента Черины."
10037-100370350 = "Я всегда буду следовать воле нашей президента!"
10037-100370360 = "У тебя много работы."
10037-100370370 = "А? Что вы имеете в виду?"
10037-100370380 = "Ты будешь чистить туалет вместе со мной, Сенсей."
10037-100370390 = "Это ещё кто решил?!"
10037-100370400 = "Я решила, потому что вы были там, когда статую президента разрушили."
10037-100370410 = "Защищать власть усов — долг каждого. Значит, вы тоже несёте ответственность за эту лёгкую измену."
10037-100370420 = "Начнём завтра с самого утра. Встретимся в 7:00 перед зданием Секретариата!"
10037-100370430 = "Это какой-то абсурд..."
10037-100370440 = "Эй, Сенсей."
10037-100370450 = "Мы можем где-нибудь встретиться?"
10037-100370460 = "У меня неприятности, и я не могу рассказать другим членам Секретариата."
10037-100370470 = "Хорошо, скоро буду."
10037-100370480 = "А что произошло?"
10037-100370490 = "Простите, что прошу прийти в Секретариат..."
10037-100370500 = "Меня арестовал Совет безопасности."
10037-100370510 = "Значит, у тебя и правда неприятности."
