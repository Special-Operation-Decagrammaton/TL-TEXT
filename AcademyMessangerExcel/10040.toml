[translation]
10040-100400010 = "Hum, Sensei..."
10040-100400020 = "Se você não se importar..."
10040-100400030 = "O que houve?"
10040-100400040 = "Tem uma coisa sobre a qual eu queria pedir um conselho..."
10040-100400050 = "Você teria um tempinho...?"
10040-100400060 = "Claro! Para um pedido da Tsukuyo, tenho tempo a qualquer hora!"
10040-100400070 = "Muito obrigada...! Vou te mandar a localização daqui a pouquinho...!"
10040-100400080 = "Sensei, se não for pedir muito..."
10040-100400090 = "Você poderia me ajudar no meu treinamento de novo?"
10040-100400100 = "Me desculpe, eu sei que você anda muito ocupado... Perdão..."
10040-100400110 = "Sem problemas, para onde eu devo ir?"
10040-100400120 = "Muito obrigada...! Então, hum, pode ser no mesmo lugar de antes!"
10040-100400130 = "Sensei!"
10040-100400140 = "Acho que acabei de fazer uma descoberta incrível...!"
10040-100400150 = "Você tem um tempinho agora...!?"
10040-100400160 = "Tenho sim, mas... o que aconteceu?"
10040-100400170 = "Então estou indo para a Schale agora mesmo...!"
10040-100400180 = "Sensei!"
10040-100400190 = "Pelo visto aquele livro era o que chamam de \"livro de paródia\"...!"
10040-100400200 = "Ah, entendi..."
10040-100400210 = "Então era por isso que a capa era tão suspeita."
10040-100400220 = "Desta vez eu acabei sendo enganada, mas...!"
10040-100400230 = "Da próxima vez, vou encontrar um livro de verdade sobre \"kunoichi\"!"
10040-100400240 = "Quando eu achar, conto com a sua ajuda novamente...!"
10040-100400250 = "Hum... tá bom, vamos dar o nosso melhor."
10040-100400260 = "Sim, muito obrigada por hoje também!"
10040-100400270 = "Sensei, eu queria fazer meu treinamento hoje também..."
10040-100400280 = "Será que... eu poderia pedir a sua ajuda...?"
10040-100400290 = "Claro. Nos encontramos no lugar de sempre, então?"
10040-100400300 = "Sim!"
10040-100400310 = "Muito obrigada!"
