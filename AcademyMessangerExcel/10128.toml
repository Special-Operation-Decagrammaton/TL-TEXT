[translation]
10128-101280010 = "Давно не виделись, Сенсей."
10128-101280020 = "Завтра у меня запланирован выход в город,"
10128-101280030 = "могу купить что-нибудь, если вам нужно."
10128-101280040 = "...Нет, всё в порядке."
10128-101280050 = "Фуфу, тогда спрошу снова в следующий раз."
10128-101280060 = "Мы, Картель свободной торговли, надеемся и дальше вести с вами дела!"
10128-101280070 = "Мы ещё даже не начинали никаких дел!"
10128-101280080 = "Сенсей"
10128-101280090 = "Почему катапульты так легко ломаются?"
10128-101280100 = "Ты что, ведёшь осаду...?"
10128-101280110 = "Нет. Кое-что ещё круче."
10128-101280120 = "...Дела Картеля свободной торговли?"
10128-101280130 = "Именно, Сенсей! Вы попали в точку!"
10128-101280140 = "Как поживаете, Сенсей?"
10128-101280150 = "На этой неделе я буду встречаться с вами как представитель студентов,"
10128-101280160 = "поэтому решила заранее поздороваться!"
10128-101280170 = "...Но на этой неделе тебя нет в графике дежурств."
10128-101280180 = "Фу-фу."
10128-101280190 = "Ч-Что...?!"
10128-101280200 = "Сенсей"
10128-101280210 = "Не хотите сходить на выставку?"
10128-101280220 = "Хм?"
10128-101280230 = "Она пройдёт в художественном центре Saint & Medical, зал A!"
10128-101280240 = "Прямо сейчас?!"
