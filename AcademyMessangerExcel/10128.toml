[translation]
10128-101280010 = "Давно не виделись, Сенсей."
10128-101280020 = "Завтра я планирую выйти, так что"
10128-101280030 = "если вам что-то понадобится, я приму заказ."
10128-101280040 = "Нет... ничего особенного."
10128-101280050 = "Поняла."
10128-101280060 = "Тогда ждём вас снова!"
10128-101280070 = "Я ещё ни разу не заказывал...!"
10128-101280080 = "Сенсей,"
10128-101280090 = "почему катапульты такие хрупкие?"
10128-101280100 = "Ты что, в осаду играешь...?"
10128-101280110 = "Нет, это кое-что получше."
10128-101280120 = "... Деятельность отдела особой торговли?"
10128-101280130 = "Верно! Вы хорошо осведомлены!"
10128-101280140 = "Давно не виделись, Сенсей."
10128-101280150 = "На этой неделе я планирую заступить на дежурство,"
10128-101280160 = "поэтому решила предупредить вас заранее!"
10128-101280170 = "А разве Фую на этой неделе дежурит...?"
10128-101280180 = "Хе-хе"
10128-101280190 = "Фую...?"
10128-101280200 = "Сенсей,"
10128-101280210 = "может, сходим на выставку, если вам будет интересно?"
10128-101280220 = "Что?"
10128-101280230 = "Тогда встретимся в корпусе А Художественного центра при Святых и Медицинских учреждениях!"
10128-101280240 = "Я ведь ещё не сказал, что пойду!?"