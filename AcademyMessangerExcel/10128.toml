[translation]
10128-101280010 = "Quanto tempo, Sensei."
10128-101280020 = "Tenho planos de sair da academia amanhã,"
10128-101280030 = "então, se precisar que eu traga alguma mercadoria, é só fazer o pedido."
10128-101280040 = "Não... não preciso de nada em especial."
10128-101280050 = "Compreendido."
10128-101280060 = "Agradeço a preferência e aguardo a sua próxima encomenda!"
10128-101280070 = "Mas eu nunca encomendei nada com você...?!"
10128-101280080 = "Sensei,"
10128-101280090 = "por que será que catapultas quebram tão facilmente?"
10128-101280100 = "Você está travando uma guerra de cerco, por acaso...?"
10128-101280110 = "Não, é para uma finalidade muito mais encantadora."
10128-101280120 = "...Atividades do Departamento de Comércio Especial?"
10128-101280130 = "Exatamente! Vejo que conhece bem o nosso trabalho!"
10128-101280140 = "Como tem passado, Sensei?"
10128-101280150 = "Estou programada para ir aí como plantonista esta semana,"
10128-101280160 = "então resolvi entrar em contato com antecedência!"
10128-101280170 = "Ué, você estava escalada para o plantão desta semana, Fuyu...?"
10128-101280180 = "Hehe."
10128-101280190 = "Fuyu...?"
10128-101280200 = "Sensei,"
10128-101280210 = "gostaria de ir a uma exposição comigo?"
10128-101280220 = "Hã?"
10128-101280230 = "Combinado então! Nos vemos no Pavilhão A do Centro de Artes Anexo da Saint & Medical!"
10128-101280240 = "Mas eu nem disse que ia?!"
