[translation]
16008-160080010 = "Это Фубуки, первокурсница отдела общественной безопасности, плановый доклад."
16008-160080020 = "Сегодня тоже без происшествий, так что продолжаем в том же духе."
16008-160080030 = "Фубуки, ты не ошиблась адресатом?"
16008-160080040 = "Ага, я знаю, так что не волнуйся."
16008-160080050 = "Тогда давай работать усердно."
16008-160080060 = "...Фубуки? Что значит «не волнуйся»...?"
16008-160080070 = "Я и сама не знаю, но..."
16008-160080080 = "Может, для начала свяжешься с отделом охраны?"
16008-160080090 = "Отделом охраны...?"
16008-160080100 = "Фубуки, ты в порядке?"
16008-160080110 = "Ага, я тоже так думаю."
16008-160080120 = "...?"
16008-160080130 = "..."
16008-160080140 = "Из-за того, что на днях меня поймали на том, что я бездельничала в рабочее время..."
16008-160080150 = "в качестве наказания мне назначили патрулирование в выходные..."
16008-160080160 = "Это несправедливо — работать даже в выходные..."
16008-160080170 = "Самой же и виновата..."
16008-160080180 = "Ну, в выходные тоже могут произойти преступления. Удачи."
16008-160080190 = "Кивотус в основном мирное место..."
16008-160080200 = "Даже если что-то случится, это просто перестрелки студентов или взрывы магазинов..."
16008-160080210 = "«Просто»...?"
16008-160080220 = "Ну, всякое бывает, и вообще, полицейскому такое говорить не стоит..."
16008-160080230 = "Хлопотно..."
16008-160080240 = "Раз уж так, Сенсей, не хочешь составить мне компанию в патруле в эти выходные?"
16008-160080250 = "Если мы разойдёмся по разным направлениям, может, управимся быстрее!?"
16008-160080260 = "Я не против, но перекладывать своё наказание на кого-то ещё — разве это правильно...?"
16008-160080270 = "Сенсей, происшествие!"
16008-160080280 = "По информации от отдела охраны, сегодня на Чёрном рынке может появиться разыскиваемый преступник, занимающийся незаконной торговлей оружием!"
16008-160080290 = "Неизвестно, когда он пройдёт, так что лучше устроить засаду в округе."
16008-160080300 = "Выезжаем сейчас же!"
16008-160080310 = "...Фубуки?"
16008-160080320 = "Может, ты себя плохо чувствуешь?"
16008-160080330 = "Что это за реакция?"
16008-160080340 = "Разве плохо, что полицейский проявляет рвение в работе?"
16008-160080350 = "Но Фубуки..."
16008-160080360 = "Ты же не любишь выезжать на места?"
16008-160080370 = "Сейчас не время!"
16008-160080380 = "Сенсей, я выеду на место первая и буду ждать!"
16008-160080390 = "Скучно..."
16008-160080400 = "Я уже переиграла во все игры, что были под рукой, и стало скучно..."
16008-160080410 = "Тогда, может, займёшься работой?"
16008-160080420 = "Ни за что. Может, попробую «ничего не делать»..."
16008-160080430 = "Да и сейчас нет никакой работы."
16008-160080440 = "А чем вообще занимается отдел общественной безопасности?"
16008-160080450 = "А чем занимается, говоришь..."
16008-160080460 = "В отдел общественной безопасности особо много работы не поступает."
16008-160080470 = "Кирино сама создаёт себе работу, но обычно мы просто сидим и ждём."
16008-160080480 = "Разве что днём вздремнём..."
16008-160080490 = "Это не работа."