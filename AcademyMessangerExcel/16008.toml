[translation]
16008-160080010 = "Aqui é a Fubuki, 1º ano do Departamento de Segurança Comunitária, fazendo o relato periódico"
16008-160080020 = "Nenhuma anormalidade em especial hoje também, seguimos mantendo o padrão"
16008-160080030 = "Fubuki, não mandou para a pessoa errada?"
16008-160080040 = "Uhum, disso eu já sei, não esquenta"
16008-160080050 = "Bom, bora trabalhar firme então"
16008-160080060 = "......Fubuki? Como assim \"não esquenta\"......?"
16008-160080070 = "Isso nem eu sei dizer, mas......"
16008-160080080 = "Por que não tenta consultar o Departamento de Vigilância primeiro?"
16008-160080090 = "Departamento de Vigilância......?"
16008-160080100 = "Fubuki, tá tudo bem?"
16008-160080110 = "Uhum, também acho"
16008-160080120 = "......?"
16008-160080130 = "......"
16008-160080140 = "Só porque descobriram que eu tava matando serviço durante o expediente outro dia......"
16008-160080150 = "Me deram patrulha no fim de semana como castigo......"
16008-160080160 = "Ter que trabalhar até na folga é uma baita injustiça......"
16008-160080170 = "Mas você não colheu o que plantou......?"
16008-160080180 = "Bom, crimes também acontecem nos dias de folga. Boa sorte"
16008-160080190 = "Mas Kivotos é um lugar tão pacífico no geral......"
16008-160080200 = "Quando acontece alguma coisa, é no máximo um tiroteio entre alunas ou uma loja indo pelos ares......"
16008-160080210 = "\"No máximo\"......?"
16008-160080220 = "Bom, acontece de tudo, mas uma policial não devia falar assim......"
16008-160080230 = "Que preguiça......"
16008-160080240 = "Já que não tem jeito, Sensei, que tal fazer patrulha comigo neste fim de semana?"
16008-160080250 = "Se a gente dividir o serviço entre nós dois, rapidinho acaba!"
16008-160080260 = "Eu até não me importo, mas jogar o seu castigo nas costas dos outros é meio errado, né......?"
16008-160080270 = "Sensei, temos um caso!"
16008-160080280 = "Segundo informações do Departamento de Vigilância, um criminoso procurado por tráfico ilegal de armas pode dar as caras hoje no Mercado Negro!"
16008-160080290 = "Como não sabemos a que horas o suspeito vai passar, o ideal é fazer uma tocaia pelos arredores"
16008-160080300 = "Vamos entrar em ação agora mesmo!"
16008-160080310 = "......Fubuki?"
16008-160080320 = "Por acaso você tá passando mal?"
16008-160080330 = "Que reação é essa?"
16008-160080340 = "Qual é o problema de uma policial estar motivada para resolver um caso?"
16008-160080350 = "Mas, Fubuki......"
16008-160080360 = "Você não detestava serviço externo?"
16008-160080370 = "Não temos tempo a perder!"
16008-160080380 = "Sensei, vou indo na frente pro local da ocorrência e te espero lá!"
16008-160080390 = "Que tédio......"
16008-160080400 = "Já zerei todos os jogos que eu tinha em mãos, tô entediada......"
16008-160080410 = "Que tal trabalhar um pouco pra variar?"
16008-160080420 = "Isso jamais. Acho que vou começar a praticar a arte de \"não fazer nada\"......"
16008-160080430 = "Até porque não tem nenhum trabalho pra fazer agora"
16008-160080440 = "O que o Departamento de Segurança Comunitária costuma fazer no dia a dia?"
16008-160080450 = "No dia a dia, é......"
16008-160080460 = "Pra começar, quase não chega trabalho pro Departamento de Segurança Comunitária~"
16008-160080470 = "A Kirino sai procurando sarna pra se coçar por conta própria, mas o padrão é ficar sentada de prontidão"
16008-160080480 = "No máximo tirar um cochilo e tal"
16008-160080490 = "Isso definitivamente não faz parte do trabalho"
