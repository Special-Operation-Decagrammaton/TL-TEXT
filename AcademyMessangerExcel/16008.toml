[translation]
16008-160080010 = "Доклад Фубуки, студенты первого курса Бюро общественной безопасности."
16008-160080020 = "Сегодня проблем нет. Я очень усердно работаю."
16008-160080030 = "Ты точно хотела отправить это мне?"
16008-160080040 = "Да-да. Не переживай."
16008-160080050 = "Я же сказала: усердно работаю."
16008-160080060 = "Вы вообще прочитали, что я написала?"
16008-160080070 = "Не совсем понимаю, что ты имеешь в виду..."
16008-160080080 = "Почему бы не обратиться в Бюро безопасности?"
16008-160080090 = "А при чём здесь Бюро безопасности?"
16008-160080100 = "Фубуки, что-то случилось?"
16008-160080110 = "Ага, я тоже так думаю."
16008-160080120 = "...?"
16008-160080130 = "*вздох*..."
16008-160080140 = "Меня поймали за бездельем на работе."
16008-160080150 = "Так что в наказание придётся патрулировать в эти выходные."
16008-160080160 = "Не могу поверить, что мне приходится работать по выходным! Несправедливо!"
16008-160080170 = "Что посеешь, то и пожнёшь."
16008-160080180 = "Преступления могут случаться и по выходным."
16008-160080190 = "Да ну. Нет места спокойнее Кивотоса."
16008-160080200 = "Всего-то иногда бывают перестрелки между студентами да взрываются магазины. Вот и всё."
16008-160080210 = "Вот и всё?!"
16008-160080220 = "Представителям власти не стоит говорить такие вещи."
16008-160080230 = "Уф. Как же это раздражает!"
16008-160080240 = "Сенсей, почему бы нам вместе не пойти патрулировать город в эти выходные?"
16008-160080250 = "Если разделим район, закончим быстрее!"
16008-160080260 = "Не пытайся свалить на меня свою работу."
16008-160080270 = "Большие новости, Сенсей!"
16008-160080280 = "По данным Бюро безопасности, сегодня на Чёрном рынке может появиться разыскиваемый преступник, торгующий оружием нелегально!"
16008-160080290 = "Мы не знаем, когда он появится, поэтому придётся работать под прикрытием неподалёку."
16008-160080300 = "Выдвигаемся сейчас!"
16008-160080310 = "Фубуки? Это точно ты?"
16008-160080320 = "Ты в порядке? На себя не похожа."
16008-160080330 = "Что это за ответ, Сенсей?"
16008-160080340 = "Что странного в том, что полицейская с энтузиазмом относится к делу?"
16008-160080350 = "Но ты же Фубуки..."
16008-160080360 = "Я думал, ты ненавидишь лишнюю работу..."
16008-160080370 = "Нет времени объяснять!"
16008-160080380 = "Сенсей, я буду ждать вас на месте!"
16008-160080390 = "Мне скучно..."
16008-160080400 = "У меня закончились развлечения."
16008-160080410 = "Работа может тебя развлечь."
16008-160080420 = "Я лучше буду скучать без дела, чем работать."
16008-160080430 = "Сейчас всё равно нечем заняться."
16008-160080440 = "Какой работой обычно занимается Бюро общественной безопасности?"
16008-160080450 = "Обычно?"
16008-160080460 = "В Бюро общественной безопасности очень мало работы."
16008-160080470 = "Если специально не создавать проблемы, как Кирино, большую часть времени мы просто ждём."
16008-160080480 = "А ещё... спим."
16008-160080490 = "Это не работа."
