10136-101360180 = "Хо-@^#*&рошо"
10136-101360190 = "э-@+;то"
10136-101360200 = "по-*&сле#дняя~SA-батарея"
10136-101360210 = "Передаю ко-&ad*&ординаты"
10136-101360220 = "Сегодня вы хорошо поработали, Сенсей."
10136-101360230 = "День пролетает быстро..."
10136-101360240 = "Да, действительно быстро."
10136-101360250 = "Особенно здесь время ощущается иначе."
10136-101360260 = "Ведь сегодня я почти всё время был в помещении."
10136-101360270 = "Да, но..."
10136-101360280 = "Я подумала, не сменить ли обстановку."
10136-101360290 = "Сенсей?"
10136-101360300 = "Всё в порядке?"
10136-101360310 = "Всё хорошо. А что?"
10136-101360320 = "Я подумала, не простудились ли вы."
10136-101360330 = "Беспокоилась."
10136-101360340 = "Я не настолько слаб..."
10136-101360350 = "Понятно."
10136-101360360 = "Немного жаль."
10136-101360370 = "Шучу."
10136-101360380 = "Как хорошо."
10136-101360390 = "Ты хотела что-то сказать?"
10136-101360400 = "Признавайся честно!"
10136-101360410 = "Ничего."
10136-101360420 = "Просто,"
10136-101360430 = "говорят, что самый эффективный способ согреться —"
10136-101360440 = "это тепло тела."
10136-101360450 = "... Это что?"
10136-101360460 = "... Эйми!? Эйми!?"