10136-101360100 = "Я думала, что по калориям и балансу питательных веществ всё отлично..."
10136-101360110 = "Сейчас буду тренироваться, так что..."
10136-101360120 = "Ты что-то собираешься делать?"
10136-101360130 = "Ага. Прямо сейчас"
10136-101360140 = "собираюсь выйти в ночную разведку."
10136-101360150 = "Зачем?"
10136-101360160 = "Се-ен-сей#@$%!^?"
