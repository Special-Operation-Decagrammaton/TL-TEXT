[translation]
10136-101360010 = "Вы хорошо спали, Сенсей?"
10136-101360020 = "Сенсей?"
10136-101360030 = "Алло?"
10136-101360040 = "чёё"
10136-101360050 = "Спасибо, что разбудила, Эйми..."
10136-101360060 = "Хорошо, что вы проснулись."
10136-101360070 = "Увидимся позже."
10136-101360080 = "Как вам ужин?"
10136-101360090 = "...так себе"
10136-101360100 = "Честный ответ."
10136-101360110 = "По-моему, было неплохо. Калорий было достаточно."
10136-101360120 = "Что дальше будешь делать, Эйми?"
10136-101360130 = "Наверное,"
10136-101360140 = "приступлю к ночной разведке."
10136-101360150 = "Ночной... чему?"
10136-101360160 = "Сенсей!#@$%!^?"
10136-101360170 = "Эйми?"
10136-101360180 = "Я р@^#*&ада."
10136-101360190 = "Наверное, это"
10136-101360200 = "последн*&#SAяя батарея"
10136-101360210 = "передаёт &@ad*&координаты."
10136-101360220 = "Хорошая работа сегодня, Сенсей."
10136-101360230 = "Ещё один день закончился..."
10136-101360240 = "Да."
10136-101360250 = "В последнее время у меня будто сбились внутренние часы."
10136-101360260 = "Может, потому что ты весь день работаешь в помещении?"
10136-101360270 = "Да."
10136-101360280 = "Думаю, пора немного сменить обстановку."
10136-101360290 = "Сенсей?"
10136-101360300 = "Ты в порядке?"
10136-101360310 = "Я совершенно в порядке. Почему?"
10136-101360320 = "Я волновался,"
10136-101360330 = "что ты простудилась или что-то вроде того."
10136-101360340 = "Я не НАСТОЛЬКО слабая..."
10136-101360350 = "Верно."
10136-101360360 = "Как жаль."
10136-101360370 = "Погодите."
10136-101360380 = "То есть, я рад это слышать."
10136-101360390 = "Что это должно значить...?!"
10136-101360400 = "Эйми! Скажи честно!"
10136-101360410 = "Пустяки."
10136-101360420 = "Я просто..."
10136-101360430 = "слышала однажды, что делиться теплом тела"
10136-101360440 = "— самый эффективный способ согреть человека."
10136-101360450 = "...Эйми?"
10136-101360460 = "Мисс Эйми?!"
