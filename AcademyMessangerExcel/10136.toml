[translation]
10136-101360010 = "Bom dia, Sensei."
10136-101360020 = "...Sensei?"
10136-101360030 = "Tá acordado?"
10136-101360040 = "Uaaah!"
10136-101360050 = "Obrigado por me acordar, Eimi..."
10136-101360060 = "Pelo visto você dormiu bem."
10136-101360070 = "Até mais tarde."
10136-101360080 = "O que achou do jantar?"
10136-101360090 = "Normal... eu acho."
10136-101360100 = "Pensei que as calorias e o equilíbrio nutricional estavam na medida certa..."
10136-101360110 = "É que ainda vou fazer exercício agora..."
10136-101360120 = "Vai fazer alguma coisa a esta hora?"
10136-101360130 = "Sim. Estou saindo agora"
10136-101360140 = "para fazer um reconhecimento noturno."
10136-101360150 = "Por quê?"
10136-101360160 = "Sense#@$%!^?"
10136-101360170 = "Eimi?"
10136-101360180 = "Que@^#*&bom"
10136-101360190 = "Es~-@+;ta"
10136-101360200 = "Últi*&ma#SA~bateria"
10136-101360210 = "Enviando&@ad*&coordenadas"
10136-101360220 = "Bom trabalho hoje também, Sensei."
10136-101360230 = "O dia passou voando, né..."
10136-101360240 = "Passou num piscar de olhos mesmo."
10136-101360250 = "Ainda mais aqui, onde a gente perde totalmente a noção do tempo."
10136-101360260 = "Passamos quase o dia inteiro em ambiente fechado hoje, afinal."
10136-101360270 = "Pois é, e falando nisso..."
10136-101360280 = "Estava pensando em sair um pouco para tomar um ar."
10136-101360290 = "Sensei?"
10136-101360300 = "Tudo bem com você?"
10136-101360310 = "Tudo sim. Por quê?"
10136-101360320 = "Estava pensando se você não tinha pegado um resfriado."
10136-101360330 = "Fiquei preocupada."
10136-101360340 = "Eu não sou tão frágil assim..."
10136-101360350 = "Entendi."
10136-101360360 = "Que pena."
10136-101360370 = "Brincadeira."
10136-101360380 = "Que bom."
10136-101360390 = "O que você ia dizendo ali antes?"
10136-101360400 = "Pode confessar tudo direitinho!"
10136-101360410 = "Não é nada."
10136-101360420 = "É só que"
10136-101360430 = "dizem que a forma mais eficiente de aquecer alguém"
10136-101360440 = "é usando o calor do próprio corpo."
10136-101360450 = "...Como é que é?"
10136-101360460 = "...Eimi?! Senhorita Eimi?!"
