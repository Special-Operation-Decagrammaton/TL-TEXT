[translation]
10017-100170010 = "Alegre-se, Camarada!"
10017-100170020 = "Em reconhecimento aos seus esforços contínuos até hoje, Camarada,"
10017-100170030 = "nossa gloriosa Academia Federal Red Winter decidiu condecorá-lo com uma nova medalha:"
10017-100170040 = "a \"Medalha Especial da Boa Vizinhança\"!"
10017-100170050 = "Ué... eu já não tinha ganhado a Medalha Especial da Boa Vizinhança outro dia?"
10017-100170060 = "Que absurdo está dizendo?! A medalha que lhe concedi da outra vez foi a \"Medalha Especial da Camaradagem\"!"
10017-100170070 = "Confundir as categorias das condecorações é uma afronta inadmissível!"
10017-100170080 = "Não sabia que existiam tantas medalhas diferentes assim..."
10017-100170090 = "Em Red Winter, para homenagear aqueles que contribuem grandemente para o progresso da academia,"
10017-100170100 = "existem nada menos que 247 tipos de medalhas!"
10017-100170110 = "Quanta medalha! E quantas você tem, Cherino?"
10017-100170120 = "Fufu, que pergunta tola, Camarada."
10017-100170130 = "...Todas as 247, é claro!"
10017-100170140 = "Contemple, Camarada! Este é o design da nova medalha que eu mesma desenhei depois daquele dia!"
10017-100170160 = "Fufu, só pelo desenho já dá para ver como ela reluz de autoridade, não acha?"
10017-100170170 = "Ficou muito boa!"
10017-100170180 = "...Mandou muito bem!"
10017-100170190 = "Fufu, pode me elogiar ainda mais!"
10017-100170200 = "Quem sabe eu não tenha um talento nato para ser designer também...!"
10017-100170210 = "Uuu..."
10017-100170220 = "Ei, Camarada, existe alguma comida que você deteste?"
10017-100170230 = "Por que essa pergunta do nada?"
10017-100170240 = "Eu odeio pimentão! É amargo e tem um gosto horrível!"
10017-100170250 = "Urgh... aquele gosto medonho bem que merecia ser chamado de comida do demônio!"
10017-100170260 = "Ficar escolhendo comida faz mal pra saúde, viu?"
10017-100170270 = "Não é frescura! Não conseguir comer pimentão é uma reação perfeitamente natural de qualquer ser humano!"
10017-100170280 = "Por que ninguém consegue compreender uma verdade tão simples quanto essa...?"
10017-100170290 = "Fufufu, Camarada."
10017-100170300 = "Imagino que não tenha se esquecido da promessa de me pagar um pudim que fez outro dia, não é?"
10017-100170310 = "Claro que não, eu lembro sim."
10017-100170320 = "Como esperado do Camarada! Vejo que não é um adulto de promessas vazias."
10017-100170330 = "Já que o Camarada vai bancar tudo, para conseguir comer um montão,"
10017-100170340 = "hoje eu até pulei o lanche da tarde! Fufu, mal posso esperar...!"
10017-100170350 = "Estarei esperando na frente da confeitaria depois da aula, então trate de não se atrasar!"
10017-100170360 = "Ué, acho que eu não falei nada sobre comprar \"um montão\"...?"
10017-100170370 = "Camarada, olhe lá fora!"
10017-100170380 = "É neve! Está caindo uma nevasca incrível!"
10017-100170390 = "Aqui pros lados da Schale o céu tá limpinho, sem nenhuma nuvem..."
10017-100170400 = "O quê?! Nesse caso, venha imediatamente para a nossa Academia Federal Red Winter!"
10017-100170410 = "Aqui você poderá fazer quantos bonecos e coelhinhos de neve quiser!"
10017-100170420 = "Assim que eu terminar o trabalho aqui eu vou."
10017-100170430 = "Negativo! Não sabemos quando a neve vai parar, não há tempo a perder!"
10017-100170440 = "Agora mesmo! Venha imediatamente!"
10017-100170450 = "Camarada, você tem medo de alguma coisa?"
10017-100170460 = "Humm, fantasmas, talvez..."
10017-100170470 = "Morro de medo de manju docinho..."
10017-100170480 = "Humpf. Ter medo de fantasmas mostra que até você tem um lado infantil, Camarada."
10017-100170490 = "Mas não tema, Camarada! Se algum fantasma ousar aparecer, eu mesma darei um jeito nele!"
10017-100170500 = "Manju? Aquele docinho recheado? Como alguém pode ter medo daquilo?"
10017-100170510 = "Às vezes você diz umas coisas bem sem pé nem cabeça, Camarada..."
10017-100170520 = "E você, Cherino, tem medo de alguma coisa?"
10017-100170530 = "E-Eu?! Claro que eu não tenho medo de absolutamente nada!"
10017-100170540 = "Para uma grande líder, o medo é uma emoção totalmente desnecessária!"
10017-100170550 = "Como presidente do conselho estudantil da Academia Federal Red Winter, secretária-geral, chefe do departamento de embelezamento ambiental e chefe do departamento de limpeza, não há nada que eu tema!"
