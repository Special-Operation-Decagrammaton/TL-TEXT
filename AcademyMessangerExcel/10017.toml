[translation]
10017-100170010 = "Радуйся, товарищ."
10017-100170020 = "Чтобы отметить заслуги товарища,"
10017-100170030 = "Федеральная академия Красная Зима решила наградить тебя..."
10017-100170040 = "Особой медалью ученической дружбы!"
10017-100170050 = "Погоди, разве в прошлый раз я не получил Особую медаль ученической дружбы?"
10017-100170060 = "О чём ты говоришь? В прошлый раз это была Особая медаль ученического добросердечия."
10017-100170070 = "Как можно перепутать названия?"
10017-100170080 = "Сколько вообще существует разных наград?"
10017-100170090 = "В Федеральной академии Красная Зима всего 247 разных медалей, которыми"
10017-100170100 = "награждают студентов, внёсших большой вклад в развитие нашей академии."
10017-100170110 = "А сколько медалей получила ты, Черина?"
10017-100170120 = "Какой глупый вопрос, товарищ."
10017-100170130 = "...Я получила все 247 медалей!"
10017-100170140 = "Смотри, товарищ. Это новейшая медаль, которую разработала лично я!"
10017-100170160 = "Хи-хи! Разве это не самый невероятный дизайн в твоей жизни?"
10017-100170170 = "Впечатляет, это точно."
10017-100170180 = "Такого дизайна я ещё не видел..."
10017-100170190 = "Правда? Не стесняйся, расскажи, насколько он великолепен!"
10017-100170200 = "Может, я просто гениальный дизайнер!"
10017-100170210 = "Эм..."
10017-100170220 = "Есть еда, которую ты не любишь, товарищ?"
10017-100170230 = "Что? Еда, которую я не люблю?"
10017-100170240 = "Ненавижу сладкий перец. Он острый, горький и странный!"
10017-100170250 = "Уф... По-моему, его вообще можно назвать плодом смерти."
10017-100170260 = "Привередничать в еде вредно для здоровья."
10017-100170270 = "Это не привередливость! Все ненавидят сладкий перец!"
10017-100170280 = "Почему студенты не понимают такую очевидную вещь?"
10017-100170290 = "Ха-ха-ха, товарищ."
10017-100170300 = "Ты ведь не забыл обещание купить мне пудинг, да?"
10017-100170310 = "Конечно нет."
10017-100170320 = "Я так и знала. Взрослые всегда умеют держать обещания."
10017-100170330 = "Сегодня я пропустила обед и перекус,"
10017-100170340 = "только чтобы съесть пудинги, которые ты мне купишь."
10017-100170350 = "Я буду ждать у магазина после занятий. Не опаздывай!"
10017-100170360 = "Не помню, чтобы я говорил, что куплю больше одного..."
10017-100170370 = "Посмотри в окно, товарищ!"
10017-100170380 = "Снег! Идёт снег!"
10017-100170390 = "За окном Шале солнечно... Ни облачка."
10017-100170400 = "Тогда немедленно приезжай в район Красной Зимы!"
10017-100170410 = "Если приедешь, сможешь слепить сколько угодно снеговиков и снежных кроликов!"
10017-100170420 = "Приеду сразу после работы."
10017-100170430 = "Нет! Никогда не знаешь, когда снег прекратится! Нужно приехать прямо сейчас!"
10017-100170440 = "Приезжай прямо сейчас! Сейчас!"
10017-100170450 = "Чего ты боишься, товарищ?"
10017-100170460 = "Я боюсь призраков."
10017-100170470 = "Я боюсь мандзю."
10017-100170480 = "Ха-ха! Боишься призраков? По-детски, товарищ."
10017-100170490 = "Не волнуйся, товарищ. Я разнесу любого призрака, прежде чем он до тебя доберётся!"
10017-100170500 = "А? Как можно бояться мандзю? Они вкусные и сладкие."
10017-100170510 = "Странный ты, товарищ..."
10017-100170520 = "А чего боишься ты, Черина?"
10017-100170530 = "О чём ты говоришь? Я ничего не боюсь!"
10017-100170540 = "Страху нет места в сердце великого лидера!"
10017-100170550 = "Я Великий Лидер, уважаемый президент Студенческого совета, Благоустроитель Земель и Главный Санитар Академии Красная Зима! Я ничего не боюсь!"
