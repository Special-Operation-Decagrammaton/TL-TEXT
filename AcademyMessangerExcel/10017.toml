[translation]
10017-100170010 = "Радуйся, товарищ!"
10017-100170020 = "В знак признания твоих прежних заслуг"
10017-100170030 = "наша федеральная академия Красной Зимы награждает тебя новой медалью —"
10017-100170040 = "«Орденом особой дружбы»!"
10017-100170050 = "А разве... я уже не получал этот орден в прошлый раз?"
10017-100170060 = "Что ты говоришь? В прошлый раз я вручал тебе «Орден особой дружбы»."
10017-100170070 = "Путать разные ордена — недостойно."
10017-100170080 = "Их, оказывается, столько видов..."
10017-100170090 = "В Красной Зиме для награждения отличившихся на благо академии"
10017-100170100 = "существует целых 247 видов орденов."
10017-100170110 = "Ого, как много. А сколько орденов есть у тебя, Черино?"
10017-100170120 = "Ха-ха, глупый вопрос, товарищ."
10017-100170130 = "...Все 247, конечно же!"
10017-100170140 = "Смотри, товарищ. Я собственноручно доработала дизайн нового ордена!"
10017-100170160 = "Ха-ха, разве он не сияет уже одним своим видом?"
10017-100170170 = "Красиво!"
10017-100170180 = "...Ты хорошо постаралась!"
10017-100170190 = "Ха-ха, можешь хвалить меня и дальше!"
10017-100170200 = "Возможно, у меня есть талант к дизайну...!"
10017-100170210 = "У-у-у..."
10017-100170220 = "Слушай, товарищ, есть у тебя еда, которую ты не любишь?"
10017-100170230 = "С чего вдруг?"
10017-100170240 = "Я ненавижу болгарский перец. Горький и с отвратительным вкусом!"
10017-100170250 = "Уф... этот ужасный вкус можно назвать пищей демонов."
10017-100170260 = "Разве привередливость в еде не вредна?"
10017-100170270 = "Это не привередливость! Не есть болгарский перец — естественно для человека!"
10017-100170280 = "Почему же все не могут понять эту простую истину..."
10017-100170290 = "Ха-ха, товарищ."
10017-100170300 = "Ты ведь не забыл, что обещал купить мне пудинг?"
10017-100170310 = "Конечно, помню."
10017-100170320 = "Молодец, товарищ. Ты не из тех взрослых, кто даёт пустые обещания."
10017-100170330 = "Раз уж ты угощаешь, я хочу съесть побольше, поэтому"
10017-100170340 = "сегодня я даже отказалась от полдника! Ха-ха, с нетерпением жду...!"
10017-100170350 = "Я буду ждать у магазина после уроков, не опаздывай!"
10017-100170360 = "Кажется, я не говорил, что куплю много...?"
10017-100170370 = "Товарищ, посмотри в окно!"
10017-100170380 = "Снег! Снег валит просто ужасно!"
10017-100170390 = "В Шале же ясное безоблачное небо..."
10017-100170400 = "Что!? Тогда немедленно приезжай в нашу федеральную академию Красной Зимы!"
10017-100170410 = "Здесь можно лепить снеговиков и снежных зайцев сколько душе угодно!"
10017-100170420 = "Я приду, когда закончу работу."
10017-100170430 = "Нельзя! Неизвестно, когда снег прекратится, так что времени нет!"
10017-100170440 = "Прямо сейчас! Приезжай прямо сейчас!"
10017-100170450 = "Товарищ, ты чего-нибудь боишься?"
10017-100170460 = "Хм, наверное, привидений..."
10017-100170470 = "Мандзю страшные."
10017-100170480 = "Ха-ха. Бояться привидений — это у тебя детские замашки, товарищ."
10017-100170490 = "Не беспокойся, товарищ. Даже если появится привидение, я его одолею!"
10017-100170500 = "А мандзю — это те сладкие пампушки? Почему их бояться?"
10017-100170510 = "Ты иногда говоришь странные вещи, товарищ..."
10017-100170520 = "А ты, Черино, чего-нибудь боишься?"
10017-100170530 = "М-мне, бояться? С чего бы!"
10017-100170540 = "Для великого лидера страх — это лишнее чувство!"
10017-100170550 = "Я, председатель студсовета федеральной академии Красная Зима, а также генеральный секретарь, начальник отдела благоустройства и начальник отдела уборки, — мне нечего бояться!"
