[translation]
10150-101500010 = "Я хочу кое-что спросить."
10150-101500020 = "Сенсей, вы обычно носите очки?"
10150-101500030 = "Ношу."
10150-101500040 = "Не ношу."
10150-101500060 = "А, я тоже."
10150-101500070 = "У меня тоже плохое зрение, так что я ношу очки всегда, кроме времени погружений."
10150-101500080 = "Понятно."
10150-101500090 = "Завидую, что ты можешь жить без очков."
10150-101500100 = "Я ношу очки уже много лет из-за плохого зрения."
10150-101500140 = "Насколько плохое у тебя зрение?"
10150-101500150 = "М-м... я давно не проверялась, так что не знаю точно..."
10150-101500160 = "Но без очков я, наверное, не смогла бы сделать и шагу."
10150-101500170 = "Должно быть, тяжело..."
10150-101500180 = "Но на самом деле не так уж и неудобно."
10150-101500190 = "Есть способы чувствовать опасность, не полагаясь на зрение."
10150-101500200 = "Сенсей, вы сейчас заняты?"
10150-101500210 = "Я хочу вас кое о чём попросить."
10150-101500220 = "Всё в порядке, я как раз отдыхал."
10150-101500230 = "Что случилось?"
10150-101500240 = "Извини."
10150-101500250 = "Я не могу понять, что здесь написано."
10150-101500260 = "???"
10150-101500270 = "Извини, если текст получился странным."
10150-101500280 = "Я сейчас использую голосовой ввод."
10150-101500290 = "Дело в том, что мне нужна ваша помощь."
10150-101500300 = "Я у книжного магазина, как обычно."
10150-101500310 = "Похоже, я заблудилась."
10150-101500320 = "...Заблудилась?"
10150-101500330 = "Сенсей, вы не проходилм мимо «Родоса»?"
10150-101500340 = "Вы были в Одиссее по делам?"
10150-101500350 = "Да. Я заходил по вопросу морского патрулирования."
10150-101500360 = "Я был в Трайденте."
10150-101500370 = "Сенсей из Шале занимается и такими делами?"
10150-101500380 = "Должно быть, вы много работаете."
10150-101500390 = "Котоне, у тебя сегодня тоже работа по дайвингу?"
10150-101500400 = "Нет, сегодня я свободна."
10150-101500410 = "Я думала весь день читать книгу."
10150-101500420 = "Здесь прохладно и приятно, так что это отличное место для чтения."
10150-101500430 = "Ты имеешь в виду, что это место для отдыха?"
10150-101500440 = "Хотелось бы увидеть его. Могу я зайти после работы?"
10150-101500450 = "Конечно."
10150-101500460 = "Я буду спокойно ждать, читая книгу."
10150-101500470 = "Когда будете рядом, скажите мне."
10150-101500480 = "Сенсей, знаете такой факт?"
10150-101500490 = "Говорят, у косаток есть социальные связи, в среднем около десяти друзей."
10150-101500500 = "И они могут дружить с дельфинами и даже с людьми."
10150-101500510 = "Хм, интересно."
10150-101500520 = "Правда?"
10150-101500530 = "Но я не такая."
10150-101500540 = "У меня почти нет друзей, кроме членов клуба."
10150-101500550 = "Поэтому иногда я думаю:"
10150-101500560 = "может, мой круг общения меньше, чем у косаток?"
10150-101500570 = "М-м, думаю, не стоит слишком переживать..."
10150-101500580 = "Почему?"
10150-101500590 = "В дружбе важнее не количество, а глубина отношений."
10150-101500600 = "Все в дайвинг-клубе — незаменимые друзья друг для друга, верно?"
10150-101500610 = "Да, но..."
10150-101500620 = "Этого достаточно?"
10150-101500630 = "Если ты считаешь, что этого достаточно, значит, так и есть."
10150-101500640 = "Тогда"
10150-101500650 = "я считаю, что этого достаточно."
10150-101500660 = "Сенсей, хорошие новости."
10150-101500670 = "Мне пришёл ответ от той девочки."
10150-101500680 = "Отлично!"
10150-101500690 = "У неё были какие-то причины?"
10150-101500700 = "Да."
10150-101500710 = "Она обычно постоянно сидит в сети,"
10150-101500720 = "но когда флот Одиссеи вернулся в Д.У., её связь внезапно перестала работать."
10150-101500730 = "По-моему, она говорила, что у неё отобрали оборудование."
10150-101500740 = "Отобрали оборудование?"
10150-101500750 = "У вас в клубе такие строгие порядки?"
10150-101500760 = "Не знаю, в подробности я не вникала."
10150-101500770 = "Но в сообщении говорилось,"
10150-101500780 = "что в Шале нашли подслушивающее устройство, и её за это отчитали."
10150-101500790 = "...Что?"
10150-101500800 = "Подслушивающее устройство...?"
10150-101500810 = "Ага. Ты что-то об этом знаешь?"
10150-101500820 = "М-м..."
10150-101500830 = "Вариантов так много, что я даже не знаю..."
10150-101500840 = "Хм? В любом случае, если бы не ты, я бы так и жила с недопониманием."
10150-101500850 = "Спасибо вам большое."