[translation]
10150-101500010 = "Tem uma coisa que eu queria te perguntar"
10150-101500020 = "Sensei, você costuma usar óculos no dia a dia?"
10150-101500030 = "Uso sim"
10150-101500040 = "Não uso não"
10150-101500060 = "Ah, igual a mim então"
10150-101500070 = "Minha visão também é ruim, então uso óculos o tempo todo, menos quando estou mergulhando"
10150-101500080 = "Entendi"
10150-101500090 = "Que invejinha de quem consegue viver sem precisar de óculos"
10150-101500100 = "Minha visão é ruim e eu uso óculos há um bom tempo"
10150-101500140 = "Quão ruim é a sua visão?"
10150-101500150 = "Huum... faz tempo que não faço exame, então não sei ao certo, mas..."
10150-101500160 = "No nível de não conseguir dar nem um passo se eu tirar os óculos... eu acho"
10150-101500170 = "Nossa, parece bem difícil..."
10150-101500180 = "Mas nem é tão inconveniente assim"
10150-101500190 = "Porque existem formas de perceber o perigo mesmo sem depender dos olhos"
10150-101500200 = "Sensei, você está ocupado agora?"
10150-101500210 = "Queria te pedir um favor"
10150-101500220 = "Tranquilo, eu estava justamente fazendo uma pausa"
10150-101500230 = "O que houve assim do nada?"
10150-101500240 = "Desculpa"
10150-101500250 = "Não consigo ler o que está escrito"
10150-101500260 = "???"
10150-101500270 = "Me perdoa se as frases saírem estranhas"
10150-101500280 = "É que estou usando digitação por voz agora"
10150-101500290 = "Na verdade, preciso da sua ajuda, Sensei"
10150-101500300 = "Eu estava na frente daquela livraria de sempre, mas"
10150-101500310 = "acho que acabei me perdendo"
10150-101500320 = "...Se perdendo?"
10150-101500330 = "Sensei, você não passou na frente do navio Rhodes agorinha?"
10150-101500340 = "Tinha algum assunto para resolver na Odyssey?"
10150-101500350 = "Sim. Tinha um pedido sobre fiscalização marítima..."
10150-101500360 = "Então fui até a Trident"
10150-101500370 = "O Sensei da Schale faz até esse tipo de coisa?"
10150-101500380 = "Deve dar um trabalhão"
10150-101500390 = "E você, Kotone, tem trabalho de mergulho hoje também?"
10150-101500400 = "Não, hoje estou de folga"
10150-101500410 = "Estou pensando em passar o dia inteiro lendo"
10150-101500420 = "Aqui é fresquinho e agradável, perfeito para ler um livro"
10150-101500430 = "É o seu cantinho de descanso recomendado?"
10150-101500440 = "Fiquei curioso para conhecer. Posso passar aí depois que terminar o trabalho?"
10150-101500450 = "Claro"
10150-101500460 = "Vou ficar lendo tranquila enquanto te espero"
10150-101500470 = "Me avisa quando estiver chegando perto"
10150-101500480 = "Sensei, você sabia dessa curiosidade?"
10150-101500490 = "As orcas são animais muito sociais, então têm em média umas 10 amigas"
10150-101500500 = "E dizem que às vezes elas fazem amizade até com golfinhos e humanos"
10150-101500510 = "Uau, que interessante"
10150-101500520 = "Não é?"
10150-101500530 = "Mas comigo não é bem assim..."
10150-101500540 = "Fora o pessoal do clube, quase não tenho ninguém que eu possa chamar de amiga"
10150-101500550 = "Por isso, às vezes fico pensando"
10150-101500560 = "Que talvez o meu círculo de amizades seja menor do que o de uma orca"
10150-101500570 = "Huum, acho que você não precisa se preocupar com isso..."
10150-101500580 = "Por quê?"
10150-101500590 = "Porque na amizade... a profundidade do laço importa muito mais do que a quantidade"
10150-101500600 = "As meninas do Clube de Mergulho são grandes amigas insubstituíveis umas para as outras, não são?"
10150-101500610 = "Isso é verdade, mas..."
10150-101500620 = "Será que está tudo bem ser assim?"
10150-101500630 = "Se para você estiver bom assim, Kotone, então está ótimo"
10150-101500640 = "Nesse caso"
10150-101500650 = "Acho que para mim está ótimo assim"
10150-101500660 = "Sensei, tenho boas notícias"
10150-101500670 = "Aquela garota me respondeu"
10150-101500680 = "Que maravilha!"
10150-101500690 = "Tinha mesmo acontecido algum imprevisto com ela?"
10150-101500700 = "Sim"
10150-101500710 = "Ela normalmente vive grudada na internet, mas"
10150-101500720 = "Disse que quando a frota da Odyssey voltou para o D.U., os aparelhos de comunicação dela acabaram ficando indisponíveis"
10150-101500730 = "Se não me engano, ela falou que a vice-presidente do clube confiscou tudo"
10150-101500740 = "Confiscaram os aparelhos dela?"
10150-101500750 = "Parece um clube bem rígido..."
10150-101500760 = "Será? Não sei dos detalhes, mas"
10150-101500770 = "Pelo que ela escreveu"
10150-101500780 = "Parece que descobriram uma escuta que ela tinha instalado na Schale e deram uma bronca nela"
10150-101500790 = "...Hã?"
10150-101500800 = "Uma escuta...?"
10150-101500810 = "Isso. Faz ideia de quem seja?"
10150-101500820 = "Huum..."
10150-101500830 = "Tem tantas suspeitas que nem sei dizer qual delas..."
10150-101500840 = "Sério? Bom, de qualquer forma, se não fosse por você, Sensei, acho que o mal-entendido teria continuado para sempre"
10150-101500850 = "Muito obrigada mesmo"
