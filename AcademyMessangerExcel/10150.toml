[translation]
10150-101500010 = "There's something I wanted to ask you."
10150-101500020 = "Sensei, do you usually wear glasses?"
10150-101500030 = "I do."
10150-101500040 = "I don't."
10150-101500060 = "Ah, same as me."
10150-101500070 = "My eyesight is bad too, so I wear glasses all the time except when I'm diving."
10150-101500080 = "I see."
10150-101500090 = "I'm kind of envious that you can live without needing glasses."
10150-101500100 = "My eyesight has been bad for a long time, so I've been wearing glasses for ages."
10150-101500140 = "Just how bad is your eyesight?"
10150-101500150 = "Hmm... I haven't checked recently, so I'm not entirely sure, but..."
10150-101500160 = "If I take my glasses off, I can't even walk a single step... or something like that."
10150-101500170 = "That sounds rough..."
10150-101500180 = "It's not really all that inconvenient, though."
10150-101500190 = "Even if you don't rely on your eyes, there are ways to sense danger."
10150-101500200 = "Sensei, are you busy right now?"
10150-101500210 = "There's a favor I want to ask."
10150-101500220 = "No, I was just taking a break."
10150-101500230 = "What's wrong, all of a sudden?"
10150-101500240 = "Sorry."
10150-101500250 = "I can't really tell what this says."
10150-101500260 = "???"
10150-101500270 = "Please forgive me if it turns into a weird message."
10150-101500280 = "I'm using voice-to-text right now."
10150-101500290 = "Actually, I need your help, Sensei."
10150-101500300 = "I'm in front of the usual bookstore, but..."
10150-101500310 = "It looks like I've gotten lost."
10150-101500320 = "...Lost?"
10150-101500330 = "Sensei, weren't you just passing in front of the Rhodes?"
10150-101500340 = "Did you have business with the Odyssey?"
10150-101500350 = "Yeah. I had a request regarding maritime patrol..."
10150-101500360 = "So I went over to Trident."
10150-101500370 = "Schale's Sensei does stuff like that too?"
10150-101500380 = "You really have your hands full with all sorts of things."
10150-101500390 = "Are you working on diving today, Kotone?"
10150-101500400 = "Nope. I'm off-duty today."
10150-101500410 = "I was thinking of just reading books all day."
10150-101500420 = "It's nice and cool here, so it's the perfect spot for reading."
10150-101500430 = "So it's a recommended rest area?"
10150-101500440 = "I'd love to check it out sometime. Can I drop by when I'm done with work?"
10150-101500450 = "Of course."
10150-101500460 = "I'll be relaxing and reading a book while I wait."
10150-101500470 = "Let me know when you get close."
10150-101500480 = "Sensei, do you know this piece of trivia?"
10150-101500490 = "Orcas are social creatures, so they usually have about 10 friends on average."
10150-101500500 = "Apparently, they sometimes even make friends with dolphins and humans."
10150-101500510 = "Huh, that's an interesting story."
10150-101500520 = "Right?"
10150-101500530 = "But I'm not like that..."
10150-101500540 = "Outside of club members, I hardly have anyone I could call a friend."
10150-101500550 = "So, I sometimes think..."
10150-101500560 = "My social circle might actually be smaller than an orca's."
10150-101500570 = "Hmm, I don't think you need to worry about that too much..."
10150-101500580 = "Why is that?"
10150-101500590 = "When it comes to friends... the depth of the relationship is more important than the number."
10150-101500600 = "Everyone in the diving club is an irreplaceable best friend to one another, right?"
10150-101500610 = "That's true, but..."
10150-101500620 = "Is that really okay?"
10150-101500630 = "If Kotone thinks it's okay, then it's fine."
10150-101500640 = "In that case..."
10150-101500650 = "I think that's okay."
10150-101500660 = "Sensei, I have good news."
10150-101500670 = "I got a reply from her."
10150-101500680 = "That's great!"
10150-101500690 = "Was there some kind of circumstance after all?"
10150-101500700 = "Yeah."
10150-101500710 = "She's usually glued to the internet, but..."
10150-101500720 = "When the Odyssey fleet returned to D.U., her communication device apparently stopped working by coincidence."
10150-101500730 = "If I recall, she said the vice president confiscated it."
10150-101500740 = "Her device got confiscated?"
10150-101500750 = "That sounds like a pretty strict club..."
10150-101500760 = "Who knows? I don't know the details up to that point."
10150-101500770 = "According to what she wrote,"
10150-101500780 = "they found a wiretap that was planted in Schale and she got chewed out for it."
10150-101500790 = "...Huh?"
10150-101500800 = "A wiretap...?"
10150-101500810 = "Yeah. Does that ring any bells?"
10150-101500820 = "Um..."
10150-101500830 = "There are too many, so I might not be sure..."
10150-101500840 = "Huh? Anyway, I think I would have stayed under a misunderstanding if you weren't here, Sensei."
10150-101500850 = "Thank you so much."
