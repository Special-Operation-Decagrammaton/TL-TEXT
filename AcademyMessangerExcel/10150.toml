[translation]
10150-101500010 = "Я хочу кое-что спросить у вас."
10150-101500020 = "Вы обычно носите очки, Сенсей?"
10150-101500030 = "Да."
10150-101500040 = "Нет."
10150-101500060 = "О, я тоже ношу очки."
10150-101500070 = "У меня тоже плохое зрение, поэтому я ношу очки постоянно, кроме случаев, когда занимаюсь дайвингом."
10150-101500080 = "Понятно."
10150-101500090 = "Я немного завидую, что вы можете жить без очков."
10150-101500100 = "У меня плохое зрение, поэтому я ношу очки уже довольно давно."
10150-101500140 = "Насколько плохое у тебя зрение?"
10150-101500150 = "Хм... Я давно не проверяла зрение, поэтому не знаю..."
10150-101500160 = "Если я сниму очки, я не смогу сделать ни шагу..."
10150-101500170 = "Звучит тяжело..."
10150-101500180 = "Но это не так уж и неудобно."
10150-101500190 = "Есть способы почувствовать опасность, не полагаясь на зрение."
10150-101500200 = "Сенсей, вы сейчас заняты?"
10150-101500210 = "Я хотела бы кое-что спросить."
10150-101500220 = "Всё в порядке, у меня просто был перерыв."
10150-101500230 = "Что случилось вдруг?"
10150-101500240 = "Извините."
10150-101500250 = "Я не понимаю, что здесь написано."
10150-101500260 = "???"
10150-101500270 = "Простите, если это странное предложение."
10150-101500280 = "Сейчас я использую голосовой ввод."
10150-101500290 = "На самом деле, мне нужна ваша помощь, Сенсей."
10150-101500300 = "Я перед своим обычным книжным магазином."
10150-101500310 = "Похоже, я заблудилась."
10150-101500320 = "...Заблудилась?"
10150-101500330 = "Сенсей, разве вы не проходили мимо Родоса раньше?"
10150-101500340 = "У вас были дела с «Одиссеей»?"
10150-101500350 = "Да. У меня был запрос по поводу морской полиции..."
10150-101500360 = "Я был на «Трезубце»."
10150-101500370 = "Сенсей из Шале вообще занимается подобными вещами?"
10150-101500380 = "Должно быть, это довольно много работы."
10150-101500390 = "Котоне, ты сегодня снова работаешь водолазом?"
10150-101500400 = "Нет. Сегодня я не на дежурстве."
10150-101500410 = "Думаю весь день почитать книгу."
10150-101500420 = "Здесь прохладно и приятно, так что идеально для чтения книги."
10150-101500430 = "Значит, это рекомендуемое место для отдыха?"
10150-101500440 = "Я бы хотел как-нибудь заглянуть сюда. Можно зайти после работы?"
10150-101500450 = "Конечно."
10150-101500460 = "Я подожду там не спеша, читая книгу."
10150-101500470 = "Дайте знать, когда будете рядом."
10150-101500480 = "Сенсей, вы знаете этот забавный факт?"
10150-101500490 = "Косатки — социальные существа, поэтому в среднем у них около 10 друзей."
10150-101500500 = "Иногда они дружат с дельфинами и даже с людьми."
10150-101500510 = "Ух ты, интересная история."
10150-101500520 = "Верно?"
10150-101500530 = "Но я не такой..."
10150-101500540 = "Кроме членов клуба, у меня почти нет никого, кого я мог бы назвать другом."
10150-101500550 = "Вот почему я иногда думаю..."
10150-101500560 = "Интересно, мой круг друзей меньше, чем у косатки."
10150-101500570 = "Хм, думаю, тебе не стоит слишком об этом беспокоиться..."
10150-101500580 = "Почему?"
10150-101500590 = "Потому что в отношениях с друзьями... глубина отношений важнее количества друзей."
10150-101500600 = "Каждый в дайвинг-клубе — незаменимый лучший друг, верно?"
10150-101500610 = "Это правда, но..."
10150-101500620 = "Это действительно нормально?"
10150-101500630 = "Если Котоне считает, что это нормально, то это хорошо."
10150-101500640 = "В таком случае..."
10150-101500650 = "Я думаю, что это нормально."
10150-101500660 = "Сенсей, у меня хорошие новости."
10150-101500670 = "Я получила от неё ответ."
10150-101500680 = "Это здорово!"
10150-101500690 = "Значит, всё-таки была какая-то причина?"
10150-101500700 = "Да."
10150-101500710 = "Она обычно не отходит от интернета."
10150-101500720 = "По-видимому, когда флот «Одиссеи» вернулся в Р.У., её коммуникационное оборудование оказалось непригодным."
10150-101500730 = "Кажется, она сказала, что его конфисковал заместитель директора."
10150-101500740 = "Устройства были конфискованы?"
10150-101500750 = "Кажется, это довольно строгий клуб..."
10150-101500760 = "Не знаю. Я мало что знаю."
10150-101500770 = "Судя по тому, что я прочитала..."
10150-101500780 = "Видимо, у них возникли проблемы, потому что было обнаружено подслушивающее устройство, которое они установили в Шале."
10150-101500790 = "...Что?"
10150-101500800 = "Подслушивающее устройство...?"
10150-101500810 = "Да. У вас есть хоть какое-нибудь представление о том, что это может быть?"
10150-101500820 = "Хм..."
10150-101500830 = "Их так много, я даже не знаю, с чего начать..."
10150-101500840 = "Хм? В любом случае, думаю, я бы продолжал всё понимать неправильно, если бы не вы, Сенсей."
10150-101500850 = "Большое спасибо."