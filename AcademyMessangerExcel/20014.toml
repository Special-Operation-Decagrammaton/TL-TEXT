[translation]
20014-200140010 = "Сенсей, в Шале есть швейная коробка?"
20014-200140020 = "Да, в столе."
20014-200140030 = "Можешь пользоваться, конечно. А что случилось?"
20014-200140040 = "У каски лопнул ремешок, висит на честном слове."
20014-200140050 = "Придётся чинить самой..."
20014-200140060 = "Для починки, получается, придётся снять каску?"
20014-200140070 = "Ну, разумеется."
20014-200140080 = "...Почему все думают, что я её вообще никогда не снимаю?"
20014-200140090 = "Сенсей, на всякий случай."
20014-200140100 = "Я оставила корзину перед Шале, не трогайте её, оставьте как есть. Я заберу."
20014-200140110 = "А, это та, где было много травы?"
20014-200140120 = "Ага. Вообще-то это не трава... ты не знаешь, что такое «тарабо»?"
20014-200140130 = "Свежие ростки тара. Деликатес, который тут легко найти."
20014-200140140 = "Их можно слегка отварить, вкусно, и для темпуры тоже годятся. Отличная закуска к рису!"
20014-200140150 = "...Но, конечно, в нынешней ситуации, когда муки и масла днём с огнём не сыщешь, темпура — это просто несбыточная мечта."
20014-200140160 = "Возможно..."
20014-200140170 = "Похоже, что-то подобное растёт на западной горной тропе, кажется."
20014-200140180 = "Правда!?"
20014-200140190 = "Сенсей, сейчас же веди меня!"
20014-200140200 = "Сенсей, у телевизора в Шале есть функция записи?"
20014-200140210 = "Сегодня вечером по каналу Хронос идёт документальный фильм, который меня интересует..."
20014-200140220 = "Да, запишу."
20014-200140230 = "Ах"
20014-200140240 = "Здорово, спасибо."
20014-200140250 = "В последнее время везде аппараты с кучей функций, инструкции постоянно оцифровывают, читать невозможно..."
20014-200140260 = "Скучаю по старым моделям, простым и понятным..."
20014-200140270 = "Нет, «старым»..."
20014-200140280 = "Хм?"
20014-200140290 = "То есть ты хочешь сказать, что я старуха?"
20014-200140300 = "Нет, не в том смысле..."
20014-200140310 = "Слушай, я от знакомого из Валькирии узнал,"
20014-200140320 = "что на горе за парком набросали кучу кемпингового снаряжения."
20014-200140330 = "Когда-то там была небольшая база, и когда она закрылась, всё так и оставили."
20014-200140340 = "Даже если старьё, для нас сейчас это лучше, чем ничего."
20014-200140350 = "Я подумал, может, сходить на выходных..."
20014-200140360 = "Ну, как я понял, там много вещей,"
20014-200140370 = "поможешь — буду рад."
20014-200140380 = "Да, договорились. С радостью."
20014-200140390 = "Спасибо."
20014-200140400 = "Все, вроде, заняты, но одному туда-сюда тоже как-то..."
20014-200140410 = "Кстати, говорят, тропа на ту гору довольно крутая,"
20014-200140420 = "так что лучше приходить в нормальной одежде."
20014-200140430 = "Сенсей, извини, но..."
20014-200140440 = "ты не мог бы заглянуть в комнату отдыха Шале?"
20014-200140450 = "На столе, по-моему, лежит книга."
20014-200140460 = "Там написано «Кууи», сразу узнаешь."
20014-200140470 = "Если найдёшь, сохрани мне её. Я заберу!"
20014-200140480 = "Забудь, что было сегодня."
20014-200140490 = "Если информация просочится, я применю силу."
20014-200140500 = "Маркер не стирается..."
20014-200140510 = "Так тебе и надо!"
20014-200140520 = "Если Саки что-то написала, то и я, наверное, что-то важное?"
20014-200140530 = "Чт-о-о"
20014-200140540 = "Ты ска-а"
20014-200140550 = "...Хочешь попробовать на вкус миномёт!?"