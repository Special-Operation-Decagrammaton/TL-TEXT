[translation]
20014-200140010 = "Sensei, tem kit de costura aí na Schale?"
20014-200140020 = "Tem sim, está na gaveta da minha mesa."
20014-200140030 = "Pode usar à vontade, mas aconteceu alguma coisa?"
20014-200140040 = "A tira do meu capacete balístico está quase arrebentando."
20014-200140050 = "Na nossa situação atual, não tenho escolha a não ser consertar sozinha..."
20014-200140060 = "Se você vai consertar, quer dizer que vai tirar o capacete?"
20014-200140070 = "Bom, claro que sim."
20014-200140080 = "...Por que todo mundo acha que eu nunca tiro esse capacete por nada?"
20014-200140090 = "Sensei, só por precaução..."
20014-200140100 = "Deixei um cesto na frente da Schale. Por favor, não mexa nele e deixe como está, passo aí para buscar certinho depois."
20014-200140110 = "Ah, aquele cesto cheio de um mato estranho?"
20014-200140120 = "Isso. Quer dizer, que história é essa de mato...? Você não conhece \"tarabo\", Sensei?"
20014-200140130 = "São brotos frescos de arália, uma iguaria que dá para colher facilmente até por aqui."
20014-200140140 = "Fica uma delícia só de dar uma fervida rápida, e empanado como tempurá também é ótimo. É o acompanhamento perfeito para o arroz!"
20014-200140150 = "...Bom, claro que, na nossa situação atual, sem conseguir nem farinha de trigo nem óleo direito, comer tempurá não passa de um sonho distante."
20014-200140160 = "Posso estar enganado, mas..."
20014-200140170 = "Tenho a impressão de que vi um monte de plantas igualzinhas a essa crescendo na trilha da montanha a oeste."
20014-200140180 = "Sério mesmo?!"
20014-200140190 = "Sensei, me leve até lá agora mesmo!"
20014-200140200 = "Sensei. A TV que tem aí na Schale tem função de gravação?"
20014-200140210 = "Vai passar um documentário hoje à noite no \"Canal Kronos\" que eu queria muito assistir..."
20014-200140220 = "Tem sim, vou deixar gravando pra você."
20014-200140230 = "Ah."
20014-200140240 = "Salva a pátria, obrigada."
20014-200140250 = "Os aparelhos de hoje em dia têm funções demais sem necessidade, e os manuais estão ficando cada vez mais digitalizados e ruins de ler..."
20014-200140260 = "Sinto falta dos produtos de antigamente, que tinham funções simples e eram fáceis de usar..."
20014-200140270 = "Calma aí, \"antigamente\"...?"
20014-200140280 = "Hm?"
20014-200140290 = "Por acaso está querendo dizer que eu falo como uma \"velhinha\"?"
20014-200140300 = "Não, não foi isso que eu quis dizer..."
20014-200140310 = "Acabei de ouvir uma coisa de uma conhecida da Valkyrie."
20014-200140320 = "Parece que deixaram vários equipamentos de acampamento abandonados na montanha que fica atrás do parque."
20014-200140330 = "Dizem que havia uma espécie de pequena base lá antigamente, e quando a desativaram acabaram deixando tudo para trás."
20014-200140340 = "Mesmo que sejam coisas velhas, para a nossa situação atual é muito melhor do que nada."
20014-200140350 = "Estava pensando em dar um pulo lá neste fim de semana, mas..."
20014-200140360 = "Bom, pelo que ouvi, parece que tem bastante coisa."
20014-200140370 = "Se você pudesse me ajudar a carregar, seria uma mão na roda."
20014-200140380 = "Claro, entendido. Vou com todo prazer."
20014-200140390 = "Obrigada."
20014-200140400 = "Parece que as outras meninas estão todas ocupadas, e ficar fazendo várias viagens sozinha seria complicado..."
20014-200140410 = "Ah, e parece que a trilha dessa montanha é bem íngreme."
20014-200140420 = "Então é melhor vir com roupas adequadas."
20014-200140430 = "Sensei, foi mal incomodar, mas..."
20014-200140440 = "Você pode dar uma olhada na sala de descanso da Schale para mim?"
20014-200140450 = "Acho que deixei um livro em cima da mesa."
20014-200140460 = "Está escrito \"Sorai\" na capa, então você vai reconhecer na hora."
20014-200140470 = "Se estiver aí, guarde ele para mim, por favor. Já estou indo buscar!"
20014-200140480 = "Esqueça o que aconteceu hoje."
20014-200140490 = "Se essa informação vazar, não hesitarei em usar força militar."
20014-200140500 = "Tinta de caneta permanente não sai mesmo, né..."
20014-200140510 = "Bem feito!"
20014-200140520 = "Se foi você quem escreveu em mim, Saki, será que eu também virei um dos seus preciosos manuais de instrução?"
20014-200140530 = "O q u e"
20014-200140540 = "você tá fal-"
20014-200140550 = "...Quer sentir o gostinho de um tiro de morteiro na pele?!"
