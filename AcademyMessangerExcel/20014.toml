[translation]
20014-200140010 = "Сенсей, в Шале есть набор для шитья?"
20014-200140020 = "Да, на офисном столе."
20014-200140030 = "Зачем тебе набор для шитья?"
20014-200140040 = "Эм, подкладка моего шлема совсем износилась."
20014-200140050 = "Очевидно, новый мне никто не выдаст, так что пытаюсь починить сама."
20014-200140060 = "Я не знал, что ты вообще снимаешь шлем."
20014-200140070 = "А? Конечно снимаю. Это просто снаряжение."
20014-200140080 = "Вы думаете, я какая-то чудачка, которая спит в шлеме?"
20014-200140090 = "Сенсей, не трогайте корзину перед офисом Шале."
20014-200140100 = "Я заберу её по дороге назад."
20014-200140110 = "Она была набита какой-то травой."
20014-200140120 = "Травой? Вы не знаете, как выглядят молодые побеги фатсии?"
20014-200140130 = "Свежие побеги фатсии — деликатес, который легко найти в дикой природе."
20014-200140140 = "Их можно слегка бланшировать или обжарить во фритюре и положить на рис, как тэмпуру!"
20014-200140150 = "Конечно, без муки и масла жарить будет сложно."
20014-200140160 = "Эту траву..."
20014-200140170 = "Я видел её целую кучу на горной тропе в западных пригородах."
20014-200140180 = "Что? Где именно, Сенсей?"
20014-200140190 = "Ведите меня туда, сейчас же!"
20014-200140200 = "Сенсей, вы знаете, как поставить запись передачи на телевизоре в комнате отдыха?"
20014-200140210 = "Сегодня поздно ночью на канале Кронос будет интересный документальный фильм..."
20014-200140220 = "Я запишу его для тебя."
20014-200140230 = "О, эм, спасибо."
20014-200140240 = "У современной электроники столько функций, что это почти неудобно."
20014-200140250 = "К тому же цифровые инструкции довольно трудно читать..."
20014-200140260 = "Я скучаю по обычным устройствам с базовыми функциями..."
20014-200140270 = "Ты довольно консервативна..."
20014-200140280 = "Что...?"
20014-200140290 = "Вы только что назвали меня старомодной?!"
20014-200140300 = "Я сказал не совсем это..."
20014-200140310 = "Сенсей, я кое-что услышала от знакомой из Полицейской школы Валькирия."
20014-200140320 = "На склоне холма за парком осталось неиспользованное походное снаряжение."
20014-200140330 = "Когда ближайший пост охраны эвакуировали, оборудование оставили там."
20014-200140340 = "Всё довольно старое, но, наверное, нам пригодится."
20014-200140350 = "Я собираюсь забрать вещи, когда пойду в поход на выходных."
20014-200140360 = "Но одна я всё, скорее всего, не унесу."
20014-200140370 = "...Поможете?"
20014-200140380 = "Хорошо, конечно. Помогу."
20014-200140390 = "...Спасибо за помощь."
20014-200140400 = "Все остальные были заняты, и я боялась, что одна всё не унесу."
20014-200140410 = "Кстати, туристическая тропа там довольно сложная..."
20014-200140420 = "Обязательно наденьте удобную обувь."
20014-200140430 = "Сенсей. Простите за просьбу."
20014-200140440 = "Вы случайно не видели книгу, которую я могла оставить в комнате отдыха?"
20014-200140450 = "Она может лежать на столе. Если найдёте, пожалуйста, сохраните её для меня."
20014-200140460 = "На ней написано «Сораи», так что сразу узнаете."
20014-200140470 = "Понятно? Я заберу её, когда позже зайду в Шале!"
20014-200140480 = "Сенсей. Сегодня вы ничего не видели."
20014-200140490 = "Если проболтаетесь, я применю грубую силу!"
20014-200140500 = "Это был перманентный маркер, поэтому он плохо смывался."
20014-200140510 = "Сам виноват!"
20014-200140520 = "Похоже, раз ты это написала, Саки, оно стало инструкцией."
20014-200140530 = "asdf"
20014-200140540 = "asdfa"
20014-200140550 = "Я уже иду с миномётом. Ждите там."
