[translation]
10115-101150010 = "Bom dia, Sensei!"
10115-101150020 = "Aqui é a Nomasa Rei, do Clube de Beisebol da Escola de Ciências Millennium!"
10115-101150030 = "Bom dia, Rei."
10115-101150040 = "Como estão indo as coisas ultimamente?"
10115-101150050 = "Estou dando o meu melhor em busca de um home run!"
10115-101150060 = "Hoje também tenho treino de beisebol programado."
10115-101150070 = "Ah, já sei!"
10115-101150080 = "Se quiser, por que não vem assistir ao treino, Sensei?"
10115-101150090 = "O campo de treinamento é aberto a visitantes!"
10115-101150100 = "Bom dia, Sensei!"
10115-101150110 = "Muito obrigada mesmo por toda a ajuda outro dia!"
10115-101150120 = "Fico feliz se pude ser útil, mas..."
10115-101150130 = "Na verdade, Sensei,"
10115-101150140 = "para melhorar as minhas rebatidas,"
10115-101150150 = "acho que só treinar rebatida não é o suficiente."
10115-101150160 = "Percebi que preciso de outros tipos de treinamento especial também."
10115-101150170 = "Outros tipos de treinamento?"
10115-101150180 = "Isso mesmo!"
10115-101150190 = "Acho que é mais rápido você ver pessoalmente do que eu tentar explicar."
10115-101150200 = "Como eu disse antes, o campo de treinamento é aberto a visitantes,"
10115-101150210 = "então dê uma passada aqui quando for melhor para você, Sensei!"
10115-101150220 = "Sensei! Você lembra direitinho do nosso compromisso de hoje, né?"
10115-101150230 = "Vamos assistir ao jogo de beisebol, certo?"
10115-101150270 = "Mandou muito bem conseguindo comprar dois ingressos!"
10115-101150240 = "Estou muito feliz de poder ir junto com você, Sensei!"
10115-101150250 = "A partida de hoje é um confronto espetacular!"
10115-101150260 = "Pode criar expectativas!"
10115-101150280 = "Ordem de chegada... uma disputa acirrada onde um único segundo decide o destino..."
10115-101150290 = "Mas, de algum jeito, consegui garantir os nossos."
10115-101150300 = "Acho que isso também é fruto dos meus treinos diários!"
10115-101150310 = "Bom, Sensei,"
10115-101150320 = "estou te esperando no Browns Socks Stadium."
10115-101150330 = "Se atrasar, vai levar penalidade, hein!"
10115-101150340 = "Sensei! Hoje é dia de inspeção dos equipamentos do Clube de Beisebol!"
10115-101150350 = "Inspeção dos equipamentos?"
10115-101150360 = "Você faz a manutenção manual das luvas e do resto?"
10115-101150370 = "Não, isso fica para outro dia."
10115-101150380 = "Vamos enviar os equipamentos danificados para a oficina de reparos,"
10115-101150390 = "então hoje eu faço a checagem geral antes do envio."
10115-101150400 = "Posso ir aí acompanhar?"
10115-101150410 = "Hã?"
10115-101150420 = "Por mim você é super bem-vindo, claro, mas..."
10115-101150430 = "Sinceramente, acho que não vai ser nada muito divertido de ficar olhando, viu?"
10115-101150440 = "Não ligo pra isso, não."
10115-101150450 = "Sério?"
10115-101150460 = "Então venha sim, por favor!"
10115-101150470 = "Hehe."
10115-101150480 = "Vou estar te esperando!"
