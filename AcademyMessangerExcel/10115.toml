[translation]
10115-101150010 = "Доброе утро, Сенсей!"
10115-101150020 = "Я Номаса Реи из бейсбольного клуба научной академии Миллениум!"
10115-101150030 = "Доброе утро, Рей."
10115-101150040 = "Как у тебя дела в последнее время?"
10115-101150050 = "Я стараюсь изо всех сил, чтобы забить хоум-ран."
10115-101150060 = "Сегодня тоже планирую тренироваться."
10115-101150070 = "А, кстати,"
10115-101150080 = "если хотите, приходите посмотреть!"
10115-101150090 = "На тренировочную площадку можно свободно заходить."
10115-101150100 = "Доброе утро, Сенсей!"
10115-101150110 = "Большое спасибо за помощь в прошлый раз!"
10115-101150120 = "Рад, что смог помочь, но..."
10115-101150130 = "Дело в том, Сенсей,"
10115-101150140 = "чтобы улучшить технику удара,"
10115-101150150 = "одних только тренировок по отбиванию недостаточно."
10115-101150160 = "Я понял, что нужны и другие тренировки."
10115-101150170 = "Другие тренировки?"
10115-101150180 = "Да."
10115-101150190 = "Лучше один раз увидеть, чем сто раз услышать."
10115-101150200 = "Как я уже говорил, на площадку можно заходить свободно,"
10115-101150210 = "так что приходите, когда будет удобно."
10115-101150220 = "Сенсей! Вы ведь помните о сегодняшней договорённости?"
10115-101150230 = "Мы ведь идём смотреть бейсбольный матч?"
10115-101150240 = "Я рад, что иду с вами!"
10115-101150250 = "Сегодняшний матч — просто потрясающий!"
10115-101150260 = "Ждите с нетерпением!"
10115-101150270 = "Как тебе удалось достать целых два билета?"
10115-101150280 = "В порядке очереди... жёсткая борьба, где доля секунды решает всё..."
10115-101150290 = "Но мне удалось их заполучить."
10115-101150300 = "Наверное, это результат ежедневных тренировок."
10115-101150310 = "Тогда, Сенсей,"
10115-101150320 = "я буду ждать вас на стадионе «Браунс Сокс»."
10115-101150330 = "Если опоздаете, будет штраф!"
10115-101150340 = "Сенсей! Сегодня день проверки инвентаря бейсбольного клуба!"
10115-101150350 = "Проверка инвентаря?"
10115-101150360 = "Вручную обслуживаешь перчатки и всё такое?"
10115-101150370 = "Нет, это в другой день."
10115-101150380 = "Сегодня мы отправляем сломанный инвентарь в мастерскую,"
10115-101150390 = "поэтому перед этим проводим проверку."
10115-101150400 = "Можно прийти посмотреть?"
10115-101150410 = "А?"
10115-101150420 = "Я, конечно, только за..."
10115-101150430 = "Но, честно говоря, это не очень интересное зрелище."
10115-101150440 = "Меня это не беспокоит."
10115-101150450 = "Правда?"
10115-101150460 = "Тогда приходите обязательно!"
10115-101150470 = "Хе-хе"
10115-101150480 = "Я буду ждать!"