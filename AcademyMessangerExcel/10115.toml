[translation]
10115-101150010 = "Здравствуйте, Сенсей."
10115-101150020 = "Это Номаса Рэй!"
10115-101150030 = "Привет, Рэй. Чем занимаешься?"
10115-101150040 = "Чем ты обычно занимаешься после уроков, Рэй?"
10115-101150050 = "Разве не очевидно?"
10115-101150060 = "Тренировка по бейсболу! Ну!"
10115-101150070 = "А, точно."
10115-101150080 = "Хочешь как-нибудь прийти посмотреть?"
10115-101150090 = "Тренировочная площадка Бейсбольного клуба Миллениума всегда открыта для гостей!"
10115-101150100 = "Привет, Сенсей."
10115-101150110 = "Спасибо за всю помощь в прошлый раз."
10115-101150120 = "Ох... конечно... Если это можно назвать помощью..."
10115-101150130 = "Да! Именно поэтому"
10115-101150140 = "помимо тренировки ударов"
10115-101150150 = "Стой-стой, нет. Чтобы улучшить свои удары,"
10115-101150160 = "мне нужно попробовать разные виды тренировок!"
10115-101150170 = "Какие тренировки?"
10115-101150180 = "Ну..."
10115-101150190 = "Хочешь прийти и увидеть сам?"
10115-101150200 = "Как я и говорила,"
10115-101150210 = "Тренировочная площадка Бейсбольного клуба Миллениума всегда открыта для гостей!"
10115-101150220 = "Сенсей! Ты помнишь обещание, которое дал мне?"
10115-101150230 = "Конечно. Сегодня мы идём смотреть бейсбольный матч."
10115-101150270 = "Конечно! Мы полетим верхом на угре!"
10115-101150240 = "Ура! Ты запомнил!"
10115-101150250 = "Надеюсь, ты готов!"
10115-101150260 = "Сегодня будет КРУТО!"
10115-101150280 = "Что за...?! То есть это было бы довольно круто, но"
10115-101150290 = "Стой, подожди! Нет, не то!"
10115-101150300 = "Мы сегодня должны идти смотреть бейсбольный матч!"
10115-101150310 = "Понял, Сенсей?!"
10115-101150320 = "Встретимся на стадионе Brown Sox!"
10115-101150330 = "Не опаздывайте!"
10115-101150340 = "Сенсей! Сегодня бейсбольный клуб обслуживает инвентарь!"
10115-101150350 = "Вы умеете ремонтировать оборудование?"
10115-101150360 = "И всё обслуживание вы делаете вручную?!"
10115-101150370 = "Нет-нет! Мы сами ничего не ремонтируем!"
10115-101150380 = "Мы только проверяем состояние инвентаря"
10115-101150390 = "чтобы понять, что нужно отправить в ремонт."
10115-101150400 = "Можно прийти посмотреть?"
10115-101150410 = "А? Правда?"
10115-101150420 = "Это было бы очень круто, но... ты уверен?"
10115-101150430 = "Не думаю, что на это особенно интересно смотреть."
10115-101150440 = "Я совсем не против."
10115-101150450 = "В таком случае..."
10115-101150460 = "Да. Пожалуйста, приходи."
10115-101150470 = "Хи-хи."
10115-101150480 = "Буду ждать!"
