[translation]
10120-101200010 = "Когда сжимаешь молоток,"
10120-101200020 = "всё в мире кажется гвоздями."
10120-101200030 = "А когда берёшь барабанные палочки,"
10120-101200040 = "всё в мире начинает казаться барабанами."
10120-101200050 = "... Стресс накопился?"
10120-101200060 = "Тренировки тяжело...?"
10120-101200070 = "Но-но."
10120-101200080 = "Это мысли «барабанщицы» Юдзуки Нацу."
10120-101200090 = "... Но это тоже неплохо, наверное."
10120-101200100 = "Тогда встречаемся в том месте~"
10120-101200110 = "Э?"
10120-101200120 = "Искусство — это не жизнь,"
10120-101200130 = "жизнь — это искусство."
10120-101200140 = "Иногда важно прикасаться и к другим видам искусства..."
10120-101200150 = "Тогда встречаемся в кинотеатре~"
10120-101200160 = "Э?"
10120-101200170 = "А"
10120-101200180 = "Ещё рано"
10120-101200190 = "Сенсей, вы?"
10120-101200200 = "Тренировочная комната"
10120-101200210 = "быстрее"
10120-101200220 = "Э!?"
10120-101200230 = "Чтобы проявить силу,"
10120-101200240 = "нужно расслабиться."
10120-101200250 = "Эта антиномия — тоже судьба, которую должен нести барабанщик..."
10120-101200260 = "Э...?"