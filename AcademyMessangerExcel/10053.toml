[translation]
10053-100530010 = "Сенсей, ты уже отправил счета за этот месяц?"
10053-100530020 = "Срок сдачи почти наступил, но, кажется, я ничего не получила."
10053-100530030 = "Я приложил их к прошлому отчёту. Они должны быть сзади."
10053-100530040 = "Ох, я совсем их не заметила."
10053-100530050 = "В последнее время я немного не в себе. Прости."
10053-100530060 = "Ты уверена, что просто не перерабатываешь?"
10053-100530070 = "Я занята, да... Но в конце концов работа должна быть сделана."
10053-100530080 = "Скоро мы будем проводить Фестиваль ореолов Кивотоса."
10053-100530090 = "И мои обычные обязанности в Семинаре никуда не делись. Естественно, работы стало больше."
10053-100530100 = "Похоже, ты очень стараешься, Юука."
10053-100530110 = "Уверен, благодаря тебе фестиваль пройдёт отлично."
10053-100530120 = "...Спасибо, что говоришь это."
10053-100530130 = "Но сейчас всё идёт не очень гладко."
10053-100530140 = "Скорее наоборот, похоже, мне придётся взять на себя ещё больше работы."
10053-100530150 = "Кстати, разве столовая не будет закрыта во время Фестиваля ореолов Кивотоса?"
10053-100530160 = "Наверняка будут торговцы и палатки с едой, но у меня, скорее всего, не будет времени заходить туда из-за работы в комитете..."
10053-100530170 = "Лучше заранее приготовить бэнто."
10053-100530180 = "Хорошая идея."
10053-100530190 = "Ты часто готовишь, Юука?"
10053-100530200 = "Нет."
10053-100530210 = "У меня не так много опыта с полноценными блюдами..."
10053-100530220 = "Но сейчас хороший шанс начать."
10053-100530230 = "Кстати, скоро начнутся региональные отборочные соревнования Кивотосского Интерхая."
10053-100530240 = "Я слышала, бейсбольный клуб Миллениума будет участвовать..."
10053-100530250 = "Но команда не очень сильная, так что кто знает, как всё сложится в этом году..."
10053-100530260 = "Ты любишь бейсбол, Юука?"
10053-100530270 = "Не сказала бы, что я фанатка,"
10053-100530280 = "но всегда болею за команду Миллениума."
10053-100530290 = "Фестиваль ореолов Кивотоса и всё безумие вокруг него наконец закончились..."
10053-100530300 = "Спасибо за всю тяжёлую работу, Сенсей."
10053-100530310 = "Ты тоже, Юука."
10053-100530320 = "Совсем нет. Как член Семинара, я просто обязана была участвовать во всём этом."
10053-100530330 = "Кстати, мы должны обсудить сотрудничество с Шале, о котором я просила."
10053-100530340 = "Я приду в Шале, как только закончу работу в академии."
10053-100530350 = "Буду ждать встречи."
10053-100530370 = "В итоге я написала несколько строк..."
10053-100530380 = "...Что думаешь?"
10053-100530390 = "Немного суховато..."
10053-100530400 = "Попробуй добавить чуть больше страсти..."
10053-100530410 = "Проси сколько угодно..."
10053-100530430 = "Это только один раз."
