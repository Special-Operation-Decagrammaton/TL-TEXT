[translation]
10053-100530010 = "Сенсей, что с отчётом за этот месяц?"
10053-100530020 = "Срок подачи уже скоро, а я его ещё не получила."
10053-100530030 = "Его нет в папке с отчётами, которую я передал Юуке?"
10053-100530040 = "Ах, нашла."
10053-100530050 = "В последнее время столько дел... прошу прощения."
10053-100530060 = "Да, ты выглядишь очень занятой."
10053-100530070 = "Это действительно так, но... сейчас ничего не поделаешь."
10053-100530080 = "Скоро Праздник Света, который организует Миллениум."
10053-100530090 = "Кроме обычных дел Семинара, нужно готовить Миллениум к празднику, так что минуты свободной нет..."
10053-100530100 = "Ты, наверное, устала, Юука."
10053-100530110 = "Я с нетерпением жду Праздник Света."
10053-100530120 = "От разговора с вами настроение немного улучшилось."
10053-100530130 = "Если я переусердствую и упаду в обморок, все усилия пойдут прахом..."
10053-100530140 = "Нужно будет уделить внимание и своему здоровью."
10053-100530150 = "Кстати, во время Праздника Света, кажется, нельзя будет пользоваться столовой на территории академии."
10053-100530160 = "Должны открыться киоски неподалёку, но в день мероприятия я буду занята работой в организационном комитете, так что времени зайти не будет..."
10053-100530170 = "Я собираюсь приготовить обед с собой."
10053-100530180 = "Отличная идея."
10053-100530190 = "Юука, ты обычно готовишь?"
10053-100530200 = "Нет..."
10053-100530210 = "Я никогда не готовила серьёзно..."
10053-100530220 = "Но раз уж есть повод, может, попрактикуюсь."
10053-100530230 = "Сенсей, скоро региональные отборочные турниры Кивотоса."
10053-100530240 = "Кажется, от Миллениума тоже участвует бейсбольная команда..."
10053-100530250 = "Хотя, с чего бы им побеждать, у нас слабая команда."
10053-100530260 = "Ты, Юука, часто смотришь бейсбол?"
10053-100530270 = "Ну, как все, наверное.\nЯ не из тех, кто фанатично болеет, но..."
10053-100530280 = "Когда играет команда Миллениума, я хотя бы поддерживаю их."
10053-100530290 = "Наконец-то закончился этот суматошный Праздник Света..."
10053-100530300 = "Вы хорошо поработали, Сенсей."
10053-100530310 = "Ты тоже, Юука."
10053-100530320 = "Спасибо. Но это естественно для члена Семинара."
10053-100530330 = "Сенсей, точно.\nИз-за суматохи на Празднике Света я так и не обработала запрос на сотрудничество с Шале."
10053-100530340 = "Как только разгребу текущие дела, зайду в Шале."
10053-100530350 = "Тогда до встречи."
10053-100530370 = "Я попробовала добавить кое-что..."
10053-100530380 = "К-как вам?"
10053-100530390 = "Может, стоит сделать немного милее..."
10053-100530400 = "Не слишком строго?"
10053-100530410 = "М-м..."
10053-100530430 = "...Это только для вас."
