[translation]
10053-100530010 = "Sensei, o que houve com as faturas deste mês?"
10053-100530020 = "O prazo de entrega já está acabando e eu ainda não recebi nada."
10053-100530030 = "Não estão naquela pasta de relatórios que te entreguei outro dia, Yuuka?"
10053-100530040 = "Ah, achei!"
10053-100530050 = "Ando tão na correria ultimamente... Peço desculpas."
10053-100530060 = "Você parece especialmente ocupada esses dias, né?"
10053-100530070 = "É verdade que estou bem ocupada... mas agora não tem jeito."
10053-100530080 = "Afinal, o Festival Halo sediado pela Millennium já está chegando."
10053-100530090 = "Além do trabalho normal do Seminário, ter que tocar os preparativos do Festival Halo pela Millennium não me deixa tempo nem para descansar..."
10053-100530100 = "Bom trabalho, Yuuka."
10053-100530110 = "Estou ansioso pelo Festival Halo!"
10053-100530120 = "Conversar com você já me deu um pouco mais de ânimo, Sensei."
10053-100530130 = "Se eu exagerar e acabar passando mal, aí é que tudo vai por água abaixo mesmo..."
10053-100530140 = "Vou tomar cuidado para cuidar direitinho da minha saúde também."
10053-100530150 = "Aliás, parece que não vai dar para usar o refeitório do campus durante o Festival Halo."
10053-100530160 = "Deve ter barraquinhas por perto, mas no dia vou estar tão atolada com o trabalho do comitê organizador que acho que não vou ter tempo nem de passar lá..."
10053-100530170 = "Por isso, desta vez estou pensando em preparar uma marmita para levar."
10053-100530180 = "É uma ótima ideia."
10053-100530190 = "Você costuma cozinhar no dia a dia, Yuuka?"
10053-100530200 = "Não..."
10053-100530210 = "Nunca fiz nada que dê para chamar de comida de verdade, mas..."
10053-100530220 = "Pensei que seria uma boa oportunidade para tentar praticar um pouco."
10053-100530230 = "Sensei, as classificatórias regionais do Intercolegial de Kivotos já estão chegando, né?"
10053-100530240 = "Parece que o clube de beisebol da Millennium também vai participar, mas..."
10053-100530250 = "Não sei o que esperar, já que o nosso time de beisebol é bem fraquinho."
10053-100530260 = "Você costuma assistir beisebol, Yuuka?"
10053-100530270 = "Bom, o normal.\nNão é como se eu fosse uma torcedora super fanática, mas..."
10053-100530280 = "Quando um time da Millennium joga, eu pelo menos faço questão de torcer."
10053-100530290 = "O Festival Halo foi uma correria só, mas finalmente acabou, né..."
10053-100530300 = "Muito obrigada pelo seu trabalho duro, Sensei."
10053-100530310 = "Bom trabalho para você também, Yuuka."
10053-100530320 = "Obrigada. Mas não fiz mais que a minha obrigação como membra do Seminário."
10053-100530330 = "Ah, é mesmo, Sensei.\nComo estava tudo uma loucura por causa do Festival Halo, acabei não conseguindo resolver a papelada do pedido de cooperação que fizemos à Schale."
10053-100530340 = "Assim que eu terminar as tarefas que tenho em mãos, dou uma passada aí na Schale, tá?"
10053-100530350 = "Então, até mais tarde."
10053-100530370 = "Eu tentei deixar um bilhetinho junto, mas..."
10053-100530380 = "O-o que achou?"
10053-100530390 = "Podia ser um pouquinho mais fofo..."
10053-100530400 = "Não ficou meio formal demais?"
10053-100530410 = "Huum..."
10053-100530430 = "...É só para você, viu, Sensei?"
