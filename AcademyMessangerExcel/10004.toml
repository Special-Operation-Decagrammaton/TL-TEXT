[translation]
10004-1 = "Сенсей. Извините за внезапность, но мне нужно кое-что сказать."
10004-2 = "После того как я закончу работу, уже глубокой ночью, но мы сможем встретиться?"
10004-3 = "Конечно, если просишь ты, Хина."
10004-4 = "У вас работа до полуночи... ты, наверное, устала..."
10004-5 = "Прости, что в такое позднее время, тогда место..."
10004-6 = "Вы из-за меня недосыпаете?"
10004-7 = "Если так, скажите."
10004-8 = "Я не хочу вас обременять."
10004-9 = "Ради тебя я готов на всё."
10004-10 = "Я в порядке. Хина, ты тоже высыпайся."
10004-11 = "...Мм, спасибо."
10004-12 = "Спокойной ночи, Сенсей."
10004-13 = "Сенсей. У вас будет время в ближайший выходной, глубокой ночью?"
10004-14 = "У меня работа закончится примерно в то же время, что и в прошлый раз."
10004-15 = "Если вам неудобно, ничего страшного."
10004-16 = "Всё в порядке."
10004-17 = "Я потом немного подумала, и, наверное, не стоит слишком беспокоиться о чужих взглядах."
10004-18 = "В конце концов, это деловая встреча."
10004-19 = "В следующий раз можно будет найти время и встретиться днём, при свете..."
10004-20 = "Встретиться с Хиной при свете дня..."
10004-21 = "Как же я жду."
10004-22 = "Что вы такое говорите..."
10004-23 = "Это не свидание, вы поняли?"
10004-24 = "Это работа."
10004-25 = "Работа с Хиной, начинающаяся при свете дня... как же я жду."
10004-26 = "..."
10004-27 = "*вздох*"
10004-28 = "Ладно. Я, ну... тоже, наверное..."
10004-29 = "Немного жду."
10004-30 = "Всё, разговор окончен. Спокойной ночи, Сенсей."
10004-31 = "Сенсей."
10004-32 = "Насчёт отчёта по стрелковым тренировкам за этот месяц..."
10004-33 = "Не важно, Хина."
10004-34 = "Сейчас есть дело поважнее."
10004-35 = "...?"
10004-36 = "Что?"
10004-37 = "Какой-то пропущенный пункт повестки..."
10004-38 = "Давай сходим вместе по магазинам."
10004-39 = "..."
10004-40 = "...Что?"
10004-41 = "А?"
10004-42 = "По магазинам?"
10004-43 = "...Зачем?"
10004-44 = "Потому что обещали."
10004-45 = "Это важное дело."
10004-46 = "Но торговые центры ночью закрыты..."
10004-47 = "Тогда круглосуточные."
10004-48 = "Обычно днём."
10004-49 = "А."
10004-50 = "...Простите, я поняла."
10004-51 = "..."
10004-52 = "...Да, я обещала."
10004-53 = "Хорошо."
10004-54 = "Я найду время, так что жди."
10004-55 = "Сенсей."
10004-56 = "Сегодня по поводу той работы..."
10004-57 = "Сегодня такой приятный солнечный свет."
10004-58 = "Очень хорошая погода."
10004-59 = "А?"
10004-60 = "Погода...?"
10004-61 = "Погода хорошая или нет — ничего не меняет."
10004-62 = "То есть, отличный день для прогулки!"
10004-63 = "Вместо работы пойдём гулять!!"
10004-64 = "Прогулка...?"
10004-65 = "Э-это..."
10004-66 = "Прямо сейчас?"
10004-67 = "...Ну, если недолго, то..."
10004-68 = "Ну и ну..."
10004-69 = "Сенсей, вы и правда..."
10004-70 = "...Вот ведь."
10004-71 = "Последние несколько дней я совсем без сна, всё вверх дном... и правда надоело."
10004-72 = "Много дел, требующих выездов, а неразобранные бумаги только копятся..."
10004-73 = "Как что-то случается, все сразу смотрят на меня..."
10004-74 = "...Фух."
10004-75 = "Вот поэтому даже в выходной я вот так одна работаю..."
10004-76 = "Надоело, бесит."
10004-77 = "*вздох*"
10004-78 = "На тебя все полагаются, да?"
10004-79 = "Председателю непросто, ты молодец."
10004-80 = "..."
10004-81 = "Простите, вырвалось."
10004-82 = "Забудьте."
10004-83 = "Ну, э-это..."
10004-84 = "Вчера ночью я не говорила чего-то странного...?"
10004-85 = "Не помню точно, сон ли это был, но мне кажется... что-то..."
10004-86 = "Ужасно стыдное..."
10004-87 = "Нет..."
10004-88 = "Такого не было, да?"
10004-89 = "О чём ты?"
10004-90 = "Наверное, тебе приснилось."
10004-91 = "..."
10004-92 = "Да, пусть будет так."
10004-93 = "...Спасибо."
10004-100040010 = "Сенсей, можно вас на минутку?"
10004-100040020 = "Что-то случилось?"
10004-100040030 = "А, ну, это..."
10004-100040040 = "Сегодня у меня выходной, но..."
10004-100040050 = "Если вы не против,"
10004-100040060 = "я бы хотела провести время с вами."
10004-100040070 = "Хорошо, что у тебя выходной."
10004-100040080 = "Просто я хочу увидеть вас..."
10004-100040090 = "Если вы заняты, то не надо..."
10004-100040100 = "Наоборот, я сам тебя позову!"
10004-100040110 = "Я сейчас приду!"
10004-100040120 = "...А?"
10004-100040130 = "Хе-хе."
10004-100040140 = "Тогда я буду ждать вас, Сенсей."
