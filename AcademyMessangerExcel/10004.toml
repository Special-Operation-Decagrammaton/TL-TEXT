[translation]
10004-1 = "Сенсей, знаю, это внезапно, но мне срочно нужно кое-что с Вами обсудить."
10004-2 = "Можем встретиться сегодня вечером, когда я закончу работу?"
10004-3 = "Конечно. Как хочешь."
10004-4 = "Значит, ты тоже работаешь допоздна..."
10004-5 = "Да. Простите, что беспокою вас в такой час... Я сообщу, где мы сможем встретиться."
10004-6 = "Надеюсь, я не отнимаю у вас время на отдых."
10004-7 = "Если это так, пожалуйста, скажите мне."
10004-8 = "Я не хочу доставлять вам неудобства."
10004-9 = "Можешь доставлять мне неудобства когда угодно, Хина."
10004-10 = "Со мной всё будет хорошо. Тебе стоит поспать."
10004-11 = "...Хорошо. Спасибо."
10004-12 = "Спокойной ночи, Сенсей."
10004-13 = "Сенсей, вы будете свободны вечером на этих выходных?"
10004-14 = "К тому времени я закончу работу."
10004-15 = "Если вам неудобно, можем встретиться в другой раз."
10004-16 = "Подойдёт. Тогда увидимся."
10004-17 = "Я тут подумала, что, возможно, мне не стоит так переживать о том, что нас увидят другие."
10004-18 = "В конце концов, наши встречи строго связаны с работой."
10004-19 = "Может, в следующий раз встретимся днём..."
10004-20 = "Выйти куда-нибудь с Хиной средь бела дня. Вот мне повезло."
10004-21 = "Думаю, будет весело."
10004-22 = "Ч-Что вы такое думаете?!"
10004-23 = "Это не свидание! Вы ведь понимаете, да?"
10004-24 = "Это работа. Работа!"
10004-25 = "Работать с Хиной посреди дня. Уже жду."
10004-26 = "..."
10004-27 = "*вздох*"
10004-28 = "Ну да. Я тоже вроде как..."
10004-29 = "жду этого"
10004-30 = "Спокойной ночи, Сенсей."
10004-31 = "Сенсей."
10004-32 = "Насчёт отчёта по тактическим стрельбам за этот месяц..."
10004-33 = "Перед этим, Хина."
10004-34 = "Нам нужно обсудить кое-что гораздо важнее."
10004-35 = "А?"
10004-36 = "Х-Хорошо."
10004-37 = "Что такое?"
10004-38 = "Мне нужно, чтобы вы сходили со мной в торговый центр."
10004-39 = "..."
10004-40 = "...А?"
10004-41 = "То..."
10004-42 = "Торговый центр?"
10004-43 = "Почему туда?"
10004-44 = "Мне нужно кое-что сделать."
10004-45 = "Это важно."
10004-46 = "Но ночью торговый центр будет закрыт..."
10004-47 = "Если только это не круглосуточное место..."
10004-48 = "..."
10004-49 = "А."
10004-50 = "Я-я понимаю, к чему вы клоните."
10004-51 = "..."
10004-52 = "Хорошо... В конце концов, я обещала."
10004-53 = "Ладно."
10004-54 = "Я найду время. Как-нибудь."
10004-55 = "Сенсей."
10004-56 = "Насчёт сегодняшнего дня..."
10004-57 = "Сегодня солнечно и приятно."
10004-58 = "Погода отличная."
10004-59 = "А?"
10004-60 = "Погода?"
10004-61 = "*вздох* Я не об этом хотела поговорить."
10004-62 = "Идеальный день для прогулки!"
10004-63 = "Пойдём гулять!"
10004-64 = "Прогулка?"
10004-65 = "Э-Эм..."
10004-66 = "Сейчас?"
10004-67 = "А... Хорошо. Может, совсем ненадолго..."
10004-68 = "Сенсей..."
10004-69 = "Я правда..."
10004-70 = "*вздох*"
10004-71 = "Последние несколько дней я не спала ночами, поэтому совсем не соображаю."
10004-72 = "К тому же отчёты о выездах и документы, которые мне нужно обработать, всё копятся..."
10004-73 = "Стоит чему-то случиться, и все сразу обращаются ко мне..."
10004-74 = "..."
10004-75 = "У всех остальных сегодня выходной, а работаю только я..."
10004-76 = "Это раздражает и бесит."
10004-77 = "*вздох*"
10004-78 = "Все полагаются на тебя, Хина."
10004-79 = "Потому что они рассчитывают на старшего префекта."
10004-80 = "..."
10004-81 = "Простите, я не хотела жаловаться вам."
10004-82 = "Пожалуйста, забудьте, что я сказала."
10004-83 = "Эм..."
10004-84 = "Я вчера не сказала ничего... странного?"
10004-85 = "Я не помню, сон это был или нет... но мне кажется..."
10004-86 = "Я могла сказать что-то ужасно неловкое."
10004-87 = "Так что..."
10004-88 = "сказала?"
10004-89 = "А? Не понимаю, о чём ты."
10004-90 = "Наверное, тебе приснилось."
10004-91 = "..."
10004-92 = "Да. Наверное, так и было."
10004-93 = "...Спасибо."
10004-100040010 = "Сенсей... У вас есть минутка?"
10004-100040020 = "Хина? Всё в порядке?"
10004-100040030 = "А... Понимаете... Эм..."
10004-100040040 = "Я взяла выходной..."
10004-100040050 = "Эм... Поэтому сегодня у меня нет никаких обязанностей в Команде Префектов."
10004-100040060 = "Не хотите... провести сегодня немного времени со мной?"
10004-100040070 = "А..."
10004-100040080 = "Конечно, это просто моё личное желание..."
10004-100040090 = "Я не хочу вас утруждать, поэтому не чувствуйте себя обязанным."
10004-100040100 = "В таких вещах можешь давить на меня сколько захочешь!"
10004-100040110 = "Я уже в пути!"
10004-100040120 = "Правда...?"
10004-100040130 = "Хорошо..."
10004-100040140 = "Хи-хи. Тогда буду ждать вас, Сенсей."
