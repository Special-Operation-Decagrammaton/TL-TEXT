[translation]
10004-1 = "Sensei. Sei que é de repente, mas tenho um assunto para conversar com você."
10004-2 = "Depois que o meu expediente terminar, já vai ser alta madrugada, mas a gente pode se ver rapidinho?"
10004-3 = "Claro, se é um pedido da Hina."
10004-4 = "Trabalhando até de madrugada... bom trabalho..."
10004-5 = "Desculpa pelo horário. Bom, o lugar vai ser..."
10004-6 = "Você não tá dormindo menos por minha causa, tá?"
10004-7 = "Se estiver, pode falar."
10004-8 = "Não quero te dar trabalho."
10004-9 = "Pela Hina, faço qualquer esforço."
10004-10 = "Por mim tá tranquilo. Vê se dorme direitinho também, Hina."
10004-11 = "...Hum, obrigada."
10004-12 = "Boa noite, Sensei."
10004-13 = "Sensei. Na madrugada da próxima folga, você tem um tempinho?"
10004-14 = "Por aqui o trabalho deve terminar mais ou menos no mesmo horário da última vez."
10004-15 = "Se ficar ruim pra você, tudo bem."
10004-16 = "Zero problema."
10004-17 = "Fiquei pensando um pouco depois daquele dia, e talvez não seja bom me preocupar tanto assim com os olhares alheios."
10004-18 = "Afinal, trata-se estritamente de uma reunião de trabalho."
10004-19 = "Da próxima vez, quem sabe a gente não arranja um horário durante o dia, enquanto ainda está claro..."
10004-20 = "Poder encontrar a Hina em plena luz do dia..."
10004-21 = "Tô super ansioso por isso."
10004-22 = "O que você tá falando..."
10004-23 = "Não é um encontro nem nada do tipo, entendeu?"
10004-24 = "É trabalho."
10004-25 = "Trabalhar com a Hina em plena luz do dia... mal posso esperar."
10004-26 = "......"
10004-27 = "Ai, ai..."
10004-28 = "Deixa pra lá. Eu também, bom..."
10004-29 = "Tô um pouquinho ansiosa."
10004-30 = "Pronto, fim de papo. Boa noite, Sensei."
10004-31 = "Sensei."
10004-32 = "Sobre o relatório do treino de tiro deste mês..."
10004-33 = "Deixa isso pra lá um instante, Hina-chan."
10004-34 = "Temos uma coisa muito mais importante agora."
10004-35 = "...?"
10004-36 = "O quê?"
10004-37 = "Ficou alguma pauta pendente...?"
10004-38 = "Vamos sair para fazer compras juntos."
10004-39 = "......"
10004-40 = "...Hã?"
10004-41 = "Oi?"
10004-42 = "Fazer compras?"
10004-43 = "...Por quê?"
10004-44 = "Porque é uma promessa."
10004-45 = "Porque é um compromisso muito importante."
10004-46 = "Mas os shoppings estão fechados à noite..."
10004-47 = "Ou você diz alguma loja 24 horas?"
10004-48 = "Durante o dia mesmo, normalmente."
10004-49 = "Ah."
10004-50 = "...Desculpa, só agora caiu a ficha."
10004-51 = "......"
10004-52 = "...É mesmo, a gente tinha prometido."
10004-53 = "Entendi."
10004-54 = "Vou abrir um espaço na agenda, me espera."
10004-55 = "Sensei."
10004-56 = "Hoje é sobre aquele trabalho do outro dia..."
10004-57 = "O sol tá tão gostoso hoje, né?"
10004-58 = "O tempo tá maravilhoso."
10004-59 = "Hã?"
10004-60 = "O tempo...?"
10004-61 = "Mesmo que o tempo esteja bom, não muda nada pra mim."
10004-62 = "Ou seja, um dia perfeito para caminhar!"
10004-63 = "Deixa o trabalho de lado e vamos dar um passeio!!"
10004-64 = "Um passeio...?"
10004-65 = "Hum..."
10004-66 = "Agora?"
10004-67 = "...Bom, se for só um pouquinho..."
10004-68 = "Francamente..."
10004-69 = "Você não tem jeito mesmo, Sensei..."
10004-70 = "...Puxa vida."
10004-71 = "Nos últimos dias tenho virado a noite na correria sem parar... que saco."
10004-72 = "Tem muitos casos que exigem viagens longas, e a pilha de documentos pendentes só aumenta..."
10004-73 = "E basta acontecer qualquer coisa que todo mundo olha logo pra mim..."
10004-74 = "...Ufa."
10004-75 = "Por causa disso, mesmo no dia de folga de todo mundo, cá estou eu trabalhando sozinha..."
10004-76 = "Que saco, que irritante."
10004-77 = "Ai, ai..."
10004-78 = "É porque todo mundo confia muito em você."
10004-79 = "Vida de presidente não é fácil, né? Bom trabalho."
10004-80 = "......"
10004-81 = "Desculpa, acabei desabafando sem querer."
10004-82 = "Esquece o que eu disse."
10004-83 = "Hum..."
10004-84 = "Ontem à noite eu... não falei nenhuma besteira, falei?"
10004-85 = "Não tenho certeza se foi um sonho e não lembro direito, mas... tenho a sensação..."
10004-86 = "de ter dito coisas vergonhosas demais..."
10004-87 = "Não..."
10004-88 = "Não aconteceu nada disso, né?"
10004-89 = "Do que você tá falando?"
10004-90 = "Acho que você devia estar sonhando."
10004-91 = "......"
10004-92 = "É, vamos deixar assim então."
10004-93 = "...Obrigada."
10004-100040010 = "Sensei, tem um minutinho?"
10004-100040020 = "Aconteceu alguma coisa?"
10004-100040030 = "Ah, hum..."
10004-100040040 = "Hoje eu tô de folga..."
10004-100040050 = "E se você não se importar, Sensei,"
10004-100040060 = "eu queria passar o tempo com você..."
10004-100040070 = "Que ótimo que você conseguiu tirar uma folga!"
10004-100040080 = "Sou só eu querendo te ver mesmo, Sensei..."
10004-100040090 = "Se estiver ocupado, não precisa se forçar..."
10004-100040100 = "Pelo contrário, pode me chamar até à força!"
10004-100040110 = "Tô indo praí agora mesmo!"
10004-100040120 = "...Hã?"
10004-100040130 = "Fufu."
10004-100040140 = "Então vou estar te esperando, Sensei."
