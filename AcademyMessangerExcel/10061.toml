[translation]
10061-100610010 = "Хи-хи."
10061-100610020 = "Хи-хи-хи-хи..."
10061-100610030 = "...? Сакурако?"
10061-100610040 = "Что происходит?"
10061-100610050 = "Ничего, Сенсей."
10061-100610060 = "Просто дружеское приветствие."
10061-100610070 = "Я уже некоторое время искала возможность поговорить с тобой."
10061-100610080 = "Надеюсь, такая возможность скоро появится."
10061-100610090 = "А до тех пор..."
10061-100610100 = "Береги себя."
10061-100610110 = "Хи-хи."
10061-100610120 = "Хи-хи-хи..."
10061-100610130 = "...?"
10061-100610140 = "Ура! Сенсей! ☆"
10061-100610150 = "Как у тебя сегодня дела?"
10061-100610160 = "Я всегда молюсь о твоём спокойствии, Сенсей!"
10061-100610170 = "Хорошего дня!"
10061-100610180 = "Пока-а-а! ☆"
10061-100610190 = "...Сакурако???"
10061-100610200 = "Это ты?"
10061-100610210 = "......."
10061-100610220 = "Хм."
10061-100610230 = "Прости. Похоже, у меня не получилось."
10061-100610240 = "Я искала в интернете «как казаться дружелюбной»."
10061-100610250 = "Если я повела себя плохо..."
10061-100610260 = "Прошу прощения."
10061-100610270 = "До следующего раза..."
10061-100610280 = "Сенсей."
10061-100610290 = "Я впервые пишу тебе после работы."
10061-100610300 = "Огромное спасибо за сегодня, Сенсей."
10061-100610310 = "Знаю, это большая просьба... но, пожалуйста, помоги мне, если подобное случится снова."
10061-100610320 = "Ну тогда..."
10061-100610330 = "Пусть тебя всегда сопровождают мир и удача."
10061-100610340 = "Пока-а-а~!"
10061-100610350 = "Знаю, уже поздно... и предупреждаю в последний момент, но..."
10061-100610360 = "Сенсей, ты не против немного побыть со мной?"
10061-100610370 = "В любое время. Что случилось?"
10061-100610380 = "Что такое?"
10061-100610390 = "О, ничего тревожного..."
10061-100610400 = "Но, ну, мне просто было интересно... Не то чтобы это было чем-то необычным..."
10061-100610410 = "Ты не против прийти один?"
10061-100610420 = "Это..."
10061-100610430 = "Я хочу рассказать тебе секрет. Личный."
10061-100610440 = "Да."
10061-100610450 = "Прости... Я слишком поздно тебе написала."
10061-100610460 = "Я не успела подготовить тебе кровать или что-нибудь ещё."
10061-100610470 = "Хорошо."
10061-100610480 = "В следующий раз подготовлюсь как следует."
10061-100610490 = "Пусть тебя всегда сопровождают мир и удача."
10061-100610500 = "Сенсей."
10061-100610510 = "Прости, что так внезапно. Надеюсь, ты не против."
10061-100610520 = "Если позволишь спросить... Чем ты занимаешься в выходные?"
10061-100610530 = "О? А почему тебе интересно?"
10061-100610540 = "Да так, то одно, то другое..."
10061-100610550 = "Ну, недавно меня кто-то об этом спросил."
10061-100610560 = "Эм..."
10061-100610570 = "Я не знала, что ответить."
10061-100610580 = "Поэтому просто промолчала."
10061-100610590 = "Сенсей."
10061-100610600 = "Мне так жаль за сегодня."
10061-100610610 = "Но спасибо, что помог мне разобраться с трудностями..."
10061-100610620 = "Я очень признательна."
10061-100610630 = "Не совсем понимаю, что именно я сделал, но рад."
10061-100610640 = "Главное, что ты счастлива."
10061-100610650 = "Хорошо."
10061-100610660 = "Ну... Тогда желаю тебе спокойного дня."
10061-100610670 = "Случайно..."
10061-100610680 = "Не знаю,"
10061-100610690 = "когда именно, но..."
10061-100610700 = "думаю, мне снова понадобится с тобой посоветоваться..."
10061-100610710 = "Я хотела предупредить заранее."
10061-100610720 = "Буду ждать этого момента."
10061-100610730 = "Сенсей."
10061-100610740 = "У меня проблема."
10061-100610750 = "Проблема?"
10061-100610760 = "Что такое?"
10061-100610770 = "Это вышло совершенно случайно, но..."
10061-100610780 = "стало чем-то вроде привычки."
10061-100610790 = "Мне нужна твоя помощь с этим."
10061-100610800 = "Прости. Я знаю, ты очень старался..."
10061-100610810 = "Не знаю, что пошло не так. Может, я просила слишком многого."
10061-100610820 = "О, эм... Понятно."
10061-100610830 = "Прости, что не смог помочь."
10061-100610840 = "Вовсе нет. Ты всё равно очень помог, просто другим способом."
10061-100610850 = "По крайней мере, кажется, что..."
10061-100610860 = "им стало немного комфортнее, чем раньше."
10061-100610870 = "Но мне кажется,"
10061-100610880 = "что для них я стала"
10061-100610890 = "непредсказуемой и странной."
10061-100610900 = "Ну, это первый шаг."
10061-100610910 = "Давай двигаться постепенно."
10061-100610920 = "Хорошо."
10061-100610930 = "Ещё раз огромное спасибо."
10061-100610940 = "Если мне снова понадобится помощь, я обращусь к тебе."
