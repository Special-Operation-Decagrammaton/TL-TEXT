[translation]
10061-100610010 = "Hehe"
10061-100610020 = "Ufufu"
10061-100610030 = "...Sakurako?"
10061-100610040 = "O que houve?"
10061-100610050 = "...Não se preocupe, Sensei."
10061-100610060 = "Vejamos... Se eu fosse explicar, diria que é apenas um cumprimento..."
10061-100610070 = "Há algum tempo venho procurando uma oportunidade para conversar com você, Sensei."
10061-100610080 = "Talvez... em um futuro próximo, tenhamos a ocasião de nos encontrar."
10061-100610090 = "Até lá, então."
10061-100610100 = "Que os seus dias sejam serenos."
10061-100610110 = "Hehe"
10061-100610120 = "Ufufu"
10061-100610130 = "...???"
10061-100610140 = "Olar~ Sensei☆"
10061-100610150 = "Como está sendo o seu dia hoje?"
10061-100610160 = "A Sakurako está sempre torcendo para que o dia do Sensei seja cheio de paz!"
10061-100610170 = "Tenha um ótimo dia hoje tambééém~!!"
10061-100610180 = "Até mais, então☆"
10061-100610190 = "...Sakurako???"
10061-100610200 = "É você mesma... né?"
10061-100610210 = "..."
10061-100610220 = "Hum,"
10061-100610230 = "Peço mil desculpas, Sensei. Pelo visto, não era bem assim."
10061-100610240 = "Eu pesquisei na internet como agir como uma \"pessoa acessível e amigável\", mas..."
10061-100610250 = "Hum... se cometi alguma indelicadeza..."
10061-100610260 = "Peço perdão."
10061-100610270 = "Até mais, então..."
10061-100610280 = "Sensei, bom trabalho hoje."
10061-100610290 = "É a primeira vez que entro em contato após nos despedirmos, não é?"
10061-100610300 = "Muito obrigada mesmo pelo dia de hoje."
10061-100610310 = "Hum... sei que é um pedido presunçoso da minha parte, mas... se surgir qualquer outra coisa, conto com o seu apoio."
10061-100610320 = "Até breve, Sensei."
10061-100610330 = "Que o dia de amanhã também seja tranquilo para você."
10061-100610340 = "Então... Wappi~!"
10061-100610350 = "Perdoe-me pelo incômodo a esta hora da noite, Sensei..."
10061-100610360 = "Você teria um momento?"
10061-100610370 = "Tenho sim, o que houve?"
10061-100610380 = "Aconteceu alguma coisa?"
10061-100610390 = "Não é nada grave, mas..."
10061-100610400 = "Apenas gostaria que desta vez... quer dizer, como das outras vezes também..."
10061-100610410 = "Se possível, você poderia vir sozinho, Sensei?"
10061-100610420 = "Hum, como eu poderia colocar isso..."
10061-100610430 = "Há algo sobre o qual eu gostaria de conversar a sós com você..."
10061-100610440 = "Hum... pensando bem..."
10061-100610450 = "Fiquei preocupada por ter chamado você tão tarde da noite."
10061-100610460 = "Eu deveria ter conversado com você antes e preparado um lugar para descansar."
10061-100610470 = "Peço desculpas..."
10061-100610480 = "Na próxima vez, farei isso."
10061-100610490 = "Então... que você esteja sempre em paz e segurança."
10061-100610500 = "Olá, Sensei."
10061-100610510 = "Se não for incomodar..."
10061-100610520 = "Poderia lhe perguntar o que você costuma fazer nos seus dias de folga?"
10061-100610530 = "Claro, mas por que a pergunta?"
10061-100610540 = "Eu faço um pouco de tudo..."
10061-100610550 = "Hum... na verdade, fizeram-me essa mesma pergunta recentemente, mas..."
10061-100610560 = "Er..."
10061-100610570 = "Eu não soube bem o que responder,"
10061-100610580 = "e acabei desconversando."
10061-100610590 = "Sensei... hum"
10061-100610600 = "Peço sinceras desculpas pelo que houve hoje."
10061-100610610 = "Mas, graças a você, Sensei, consegui resolver a minha preocupação."
10061-100610620 = "Queria lhe transmitir a minha gratidão."
10061-100610630 = "Que bom então."
10061-100610640 = "Se você está satisfeita, Sakurako, para mim já é o bastante."
10061-100610650 = "Muito obrigada."
10061-100610660 = "Que o seu amanhã também seja abençoado."
10061-100610670 = "Hum..."
10061-100610680 = "Algum dia, quem sabe..."
10061-100610690 = "Em outra oportunidade,"
10061-100610700 = "pode ser que eu volte a lhe pedir conselhos sobre outro assunto."
10061-100610710 = "Quando esse momento chegar..."
10061-100610720 = "Ficaria muito feliz se pudesse me conceder um pouco do seu tempo."
10061-100610730 = "Olá, Sensei."
10061-100610740 = "Hum... surgiu um problema."
10061-100610750 = "Um problema?"
10061-100610760 = "O que aconteceu?"
10061-100610770 = "Não foi minha intenção que isso acontecesse, mas..."
10061-100610780 = "...Gostaria de saber se você poderia"
10061-100610790 = "me emprestar a sua ajuda, Sensei."
10061-100610800 = "Peço desculpas... Você gentilmente reservou um tempo para mim, mas..."
10061-100610810 = "O que será que deu errado...? É mais difícil do que eu imaginava."
10061-100610820 = "Hum, desculpa..."
10061-100610830 = "Por não ter conseguido ajudar muito."
10061-100610840 = "Imagina, você me ajudou imensamente."
10061-100610850 = "Pelo menos, com toda a certeza,"
10061-100610860 = "a impressão de que sou uma pessoa difícil de lidar parece ter diminuído em relação a antes."
10061-100610870 = "Em compensação, a impressão de que sou uma pessoa"
10061-100610880 = "meio excêntrica e impossível de decifrar..."
10061-100610890 = "parece ter surgido no lugar."
10061-100610900 = "Bom, já é um passo à frente, né?"
10061-100610910 = "Vamos resolvendo uma coisa de cada vez."
10061-100610920 = "Sim..."
10061-100610930 = "Muito obrigada mesmo."
10061-100610940 = "Conto com você daqui em diante também."
