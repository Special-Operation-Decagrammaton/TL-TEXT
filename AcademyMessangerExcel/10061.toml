[translation]
10061-100610010 = "Хе-хе."
10061-100610020 = "Хе-хе-хе."
10061-100610030 = "...Сакурако?"
10061-100610040 = "Что случилось?"
10061-100610050 = "...Не обращайте внимания, Сенсей."
10061-100610060 = "Если и говорить, то разве что поздороваться..."
10061-100610070 = "Я уже давно искала возможность поговорить с вами."
10061-100610080 = "Возможно... в ближайшее время мы сможем встретиться."
10061-100610090 = "Тогда до той поры."
10061-100610100 = "Пусть дни будут безмятежными."
10061-100610110 = "Хе-хе."
10061-100610120 = "Хе-хе-хе."
10061-100610130 = "...???"
10061-100610140 = "Здравствуйте~ Сенсей ☆"
10061-100610150 = "Как у вас сегодня дела?"
10061-100610160 = "Сакурако всегда желает, чтобы ваш день был мирным!"
10061-100610170 = "Хорошего вам дня~!!"
10061-100610180 = "Тогда до встречи ☆"
10061-100610190 = "...Сакурако???"
10061-100610200 = "Это ведь вы... да?"
10061-100610210 = "..."
10061-100610220 = "Ну, э-то..."
10061-100610230 = "Прошу прощения, Сенсей. Похоже, это не то."
10061-100610240 = "Я искала в интернете «дружелюбного человека»,"
10061-100610250 = "и если я была чем-то невежлива..."
10061-100610260 = "Прошу прощения."
10061-100610270 = "Тогда до встречи..."
10061-100610280 = "Сенсей, с возвращением."
10061-100610290 = "Я впервые пишу вам после расставания."
10061-100610300 = "Спасибо большое за сегодня."
10061-100610310 = "Я понимаю, что нагло с моей стороны, но... если что-то случится, буду рассчитывать на вас."
10061-100610320 = "Тогда, Сенсей."
10061-100610330 = "Пусть завтра тоже будет мирный день."
10061-100610340 = "Тогда... ваппи~!"
10061-100610350 = "Простите за поздний час, Сенсей..."
10061-100610360 = "Не могли бы вы уделить мне немного времени?"
10061-100610370 = "Конечно, что случилось?"
10061-100610380 = "Что-то произошло?"
10061-100610390 = "Ничего особенного,"
10061-100610400 = "просто в этот раз... впрочем, как и всегда,"
10061-100610410 = "если можно, не могли бы вы прийти один?"
10061-100610420 = "Как бы это сказать..."
10061-100610430 = "Я хотела бы поговорить с вами наедине..."
10061-100610440 = "Но, наверное..."
10061-100610450 = "я беспокоюсь, что побеспокоила вас так поздно."
10061-100610460 = "Мне следовало сначала посоветоваться с вами и подготовить место для отдыха."
10061-100610470 = "Простите..."
10061-100610480 = "В следующий раз я так и сделаю."
10061-100610490 = "Тогда... пусть всё будет мирно."
10061-100610500 = "Сенсей, здравствуйте."
10061-100610510 = "Если вас не затруднит,"
10061-100610520 = "можно спросить, чем вы занимаетесь в выходные?"
10061-100610530 = "Конечно, что случилось?"
10061-100610540 = "У меня много дел, но..."
10061-100610550 = "На самом деле, меня недавно спросили то же самое,"
10061-100610560 = "и я..."
10061-100610570 = "не знала, что ответить,"
10061-100610580 = "и просто ушла от ответа."
10061-100610590 = "Сенсей, послушайте..."
10061-100610600 = "Сегодня я действительно приношу извинения."
10061-100610610 = "Но благодаря вам проблема благополучно разрешилась."
10061-100610620 = "Я хотела поблагодарить вас."
10061-100610630 = "Ну и хорошо."
10061-100610640 = "Если вы, Сакурако, довольны, этого достаточно."
10061-100610650 = "Спасибо вам."
10061-100610660 = "Пусть завтрашний день тоже будет благословенным."
10061-100610670 = "Ну..."
10061-100610680 = "Когда-нибудь, но..."
10061-100610690 = "в другой раз, наверное."
10061-100610700 = "Я могу снова попросить у вас совета."
10061-100610710 = "Тогда я буду рада, если вы..."
10061-100610720 = "найдёте для меня время."
10061-100610730 = "Здравствуйте, Сенсей."
10061-100610740 = "Ну... возникла проблема."
10061-100610750 = "Проблема?"
10061-100610760 = "Что случилось?"
10061-100610770 = "Я не хотела этого, но..."
10061-100610780 = "всё же мне нужна ваша помощь."
10061-100610790 = "Я подумала, что вы можете помочь."
10061-100610800 = "Прошу прощения... я отняла у вас время."
10061-100610810 = "В чём же была проблема? Оказалось сложнее, чем я думала."
10061-100610820 = "Извините."
10061-100610830 = "Что я не смог помочь."
10061-100610840 = "Вовсе нет, вы очень помогли."
10061-100610850 = "По крайней мере, теперь я точно"
10061-100610860 = "меньше кажусь человеком с трудным характером."
10061-100610870 = "Зато теперь у меня"
10061-100610880 = "сложилась репутация странного человека..."
10061-100610890 = "Но, похоже, это шаг вперёд."
10061-100610900 = "Похоже, это шаг вперёд."
10061-100610910 = "Будем решать проблемы по одной."
10061-100610920 = "Да..."
10061-100610930 = "Спасибо вам большое."
10061-100610940 = "И впредь... буду рассчитывать на вас."
