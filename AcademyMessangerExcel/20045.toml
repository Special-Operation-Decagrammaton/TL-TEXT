[translation]
20045-200450010 = "Chefe!"
20045-200450020 = "Quer dizer, Sensei!"
20045-200450030 = "É a Pinaaa!"
20045-200450040 = "Quanto tempo, Pina"
20045-200450050 = "Faz um tempão mesmo!"
20045-200450060 = "Na verdade, a Pina aqui acabou de renascer das cinzas feito uma fênix!"
20045-200450070 = "Mandei mensagem porque quero muito te mostrar essa minha nova versão!"
20045-200450080 = "Não deixe de dar um pulo em Hyakkiyako, por favor!"
20045-200450090 = "Tô te esperando lá!"
20045-200450100 = "Pisei na bola feio..."
20045-200450110 = "Era a minha grande chance de mostrar todo o charme de Hyakkiyako até a alma..."
20045-200450120 = "Que frustração!"
20045-200450130 = "Não tem jeito. Cachorros gostam de sair correndo livremente pra brincar mesmo"
20045-200450140 = "Ficar nervosa a ponto de esquecer uma coisa tão básica assim..."
20045-200450150 = "Mas ver você se esforçando tanto foi incrível, Pina"
20045-200450160 = "!!"
20045-200450170 = "É muita bondade sua, Chefe!"
20045-200450180 = "Graças a você, já recuperei a compostura!"
20045-200450190 = "Da próxima vez, vou apresentar as especialidades de Hyakkiyako direitinho!"
20045-200450200 = "Esta humilde Pina vai atrás da revanche com força total!"
20045-200450210 = "Chefe! Bom diaaa!"
20045-200450220 = "Hoje eu vou trabalhar como guia da excursão de ônibus..."
20045-200450230 = "E ainda tem lugar vago, então vem participar também!"
20045-200450240 = "Pode esperar pra ver o tour guiado no melhor estilo cavalheiresco da Pina!"
20045-200450250 = "Hoje eu ia te mostrar o meu trabalho de guia mais Perfect de todos...!"
20045-200450260 = "Mas acabei cometendo outro erro..."
20045-200450270 = "Não tenho nem cara pra olhar pro Chefe...!"
20045-200450280 = "E ainda por cima você me defendeu daquele jeito..."
20045-200450290 = "Esta humilde Pina está profundamente emocionada!"
20045-200450300 = "Mas a sua atitude de falar a verdade com sinceridade foi supermaneira, Pina"
20045-200450310 = "Até pensei que preciso seguir o seu exemplo"
20045-200450320 = "!!"
20045-200450330 = "O Chefe seguir o exemplo da Pina...?! Que honra imensa!!"
20045-200450340 = "Mas ouvir você me chamar de maneira... pra ser sincera, me deixa superfeliz!"
20045-200450350 = "Esta humilde Pina vai se dedicar ainda mais daqui pra frente!"
20045-200450360 = "Olá, Sensei!"
20045-200450370 = "A Pina de hoje está em outro nível!"
20045-200450380 = "Porque hoje é o dia em que vou brilhar como uma verdadeira profissional!"
20045-200450390 = "Quero muito que você veja o quanto eu evoluí, Sensei!"
20045-200450400 = "Estarei te esperando lá na Vila do Cinema Uzumaki!"
20045-200450410 = "Ai, meu rosto ainda tá pegando fogo de vergonha..."
20045-200450420 = "Da próxima vez vou ficar muito mais atenta..."
20045-200450430 = "Todo mundo se divertiu bastante, então fica tranquila"
20045-200450440 = "Acho que você tem um talento natural pra animar o pessoal, Pina"
20045-200450450 = "!!"
20045-200450460 = "Ouvir isso me deixa bem mais aliviada!"
20045-200450470 = "Ehehe... Esta humilde Pina vai usar o tropeço de hoje como aprendizado pra dominar o caminho da honra!"
20045-200450480 = "Sob a sua orientação, Sensei, consegui crescer muito como guia!"
20045-200450490 = "Graças a você, a Pina finalmente está sendo reconhecida como uma verdadeira guia do código de honra!"
20045-200450500 = "Hoje é o último tour! Que tal vir junto também, Sensei?!"
20045-200450510 = "Esta humilde Pina vai dar o sangue na hospitalidade até o último segundo!!!"
20045-200450520 = "Chefe"
20045-200450530 = "Oh, quer dizer,"
20045-200450540 = "Sensei! Aqui é a Pina"
20045-200450550 = "Consegui cumprir a missão do distrito comercial até o fim!"
20045-200450560 = "Tudo graças a você, Sensei, que esteve olhando por mim"
20045-200450570 = "Sabe, da próxima vez, em vez de ir como guia,"
20045-200450580 = "eu queria ir como uma visitante passeando junto..."
20045-200450590 = "Só nós dois dando uma volta por Hyakkiyako, Sensei~... Brincadeirinha!"
20045-200450600 = "...E-Esquece o que eu acabei de falar, por favor!"
20045-200450610 = "Parece superdivertido também!"
20045-200450620 = "!!"
20045-200450630 = "Você topa mesmo passear de novo comigo, Sensei?!"
20045-200450640 = "Muito obrigadaaa!"
20045-200450650 = "Então a gente se vê em breve, Chefe!"
