[translation]
20045-200450010 = "Босс!"
20045-200450020 = "То есть, Мастер!"
20045-200450030 = "Это я, Пина!"
20045-200450040 = "Привет, Пина. Давно не виделись."
20045-200450050 = "Да! Пина на связи!"
20045-200450060 = "Я, Пина, восстала из пепла, словно феникс!"
20045-200450070 = "И хотела связаться с вами, чтобы выразить свою огромную гордость!"
20045-200450080 = "Так что найдите меня, когда будете в Хяккияко!"
20045-200450090 = "Обещай!"
20045-200450100 = "Какая жалость..."
20045-200450110 = "Это была идеальная возможность показать истинное очарование Хяккияко."
20045-200450120 = "И я её упустила!"
20045-200450130 = "Щенки вольны бегать где хотят... а граффити ведь временные..."
20045-200450140 = "Моё возбуждение пересилило здравый смысл..."
20045-200450150 = "Но твоя решимость всё равно потрясает, Пина."
20045-200450160 = "!!!"
20045-200450170 = "Я благодарна, Сенсей!!!"
20045-200450180 = "И ещё я благодарна, что благодаря вам пришла в себя!"
20045-200450190 = "В следующий раз я проведу вас по самым надёжным достопримечательностям!"
20045-200450200 = "Я выложусь на все сто!"
20045-200450210 = "Здравствуйте, Сенсей! Пина на связи!"
20045-200450220 = "Сегодня я гид автобусной экскурсии!"
20045-200450230 = "По воле судьбы у нас одно свободное место! Хотите присоединиться?"
20045-200450240 = "Я покажу вам, на что способна!"
20045-200450250 = "Я... так хотела показать вам сегодня свою крутую и безупречную сторону."
20045-200450260 = "Но, увы! Я снова оплошала!"
20045-200450270 = "Мне нет оправдания!!!"
20045-200450280 = "А вам пришлось специально прикрывать такую некомпетентную и никчёмную меня..."
20045-200450290 = "Я, Пина, плачу!!!"
20045-200450300 = "Твоя честность и открытость очень меня вдохновили."
20045-200450310 = "Сегодня я многому у тебя научился!"
20045-200450320 = "!!!"
20045-200450330 = "Мастер чему-то научился у меня?! Как такое возможно?!"
20045-200450340 = "Услышав это... я испытываю непостижимое счастье!"
20045-200450350 = "Я приму вашу поддержку всем сердцем и стану ещё лучше!"
20045-200450360 = "Сенсей, Пина на связи!"
20045-200450370 = "Сегодня тот самый день, когда я, эксперт Пина,"
20045-200450380 = "смогу совершить великие дела!"
20045-200450390 = "Я хочу показать вам, как выросла и изменилась!"
20045-200450400 = "Поэтому буду с нетерпением ждать вас в кинодеревне!"
20045-200450410 = "Угх... Лицо до сих пор горит..."
20045-200450420 = "В следующий раз я буду бесконечно осторожнее..."
20045-200450430 = "Не переживай. Всем понравилось!"
20045-200450440 = "У тебя настоящий талант вести за собой других."
20045-200450450 = "!!!"
20045-200450460 = "Какое облегчение!"
20045-200450470 = "Хи-хи-хи. Я унесу сегодняшние уроки с собой в будущее!"
20045-200450480 = "Благодаря вашим наставлениям я снова выросла!"
20045-200450490 = "Теперь я полноценный гангстер, который не совершает ошибок!"
20045-200450500 = "Сегодня наша самая последняя экскурсия, так что надеюсь, вы присоединитесь!"
20045-200450510 = "Тогда до завтра!"
20045-200450520 = "Босс."
20045-200450530 = "Нет. То есть"
20045-200450540 = "Сенсей, это Пина."
20045-200450550 = "Я успешно выполнила просьбу торгового района!"
20045-200450560 = "Без вашей бдительной помощи я бы никогда не преодолела эту трудность!"
20045-200450570 = "В следующий раз я хочу"
20045-200450580 = "пройтись по Хяккияко только вдвоём,"
20045-200450590 = "не как гиды, а как два туриста, изучающих район."
20045-200450600 = "Н-неважно! Пожалуйста, забудьте, что я это сказала!!!"
20045-200450610 = "Это тоже звучит весело."
20045-200450620 = "!!!"
20045-200450630 = "Вы правда снова проведёте со мной время!!"
20045-200450640 = "С-спасибо!!"
20045-200450650 = "Тогда я пойду, Босс!!"
