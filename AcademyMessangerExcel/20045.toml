[translation]
20045-200450010 = "Босс!"
20045-200450020 = "Нет, Сенсей!"
20045-200450030 = "Это Пина!"
20045-200450040 = "Давно не виделись, Пина."
20045-200450050 = "Давно не виделись!"
20045-200450060 = "Дело в том, что Пина возродилась, как феникс!"
20045-200450070 = "Я хотела показать свой новый облик, поэтому и связалась!"
20045-200450080 = "Обязательно приезжайте в Хяккияко!"
20045-200450090 = "Буду ждать!"
20045-200450100 = "Я всё испортила..."
20045-200450110 = "Был же шанс показать всю прелесть Хяккияко до костей..."
20045-200450120 = "Обидно."
20045-200450130 = "Ничего не поделаешь. Собаки любят гулять, где хотят."
20045-200450140 = "Как я могла забыть такую простую вещь в спешке..."
20045-200450150 = "Но старательная Пина была прекрасна."
20045-200450160 = "!!"
20045-200450170 = "Я польщена! Босс!"
20045-200450180 = "Благодаря вам я снова обрела спокойствие!"
20045-200450190 = "В следующий раз я как следует представлю достопримечательности Хяккияко!"
20045-200450200 = "Недостойная Пина, я сделаю всё для реванша!"
20045-200450210 = "Босс! Доброе утро!"
20045-200450220 = "Сегодня я работаю гидом на автобусной экскурсии..."
20045-200450230 = "Есть ещё свободные места, обязательно присоединяйтесь!"
20045-200450240 = "Ждите с нетерпением гида в стиле «Нинкё» от Пины!"
20045-200450250 = "Я хотела показать идеальное ведение экскурсии!"
20045-200450260 = "Опять я ошиблась..."
20045-200450270 = "Мне стыдно смотреть вам в глаза, Босс...!"
20045-200450280 = "И вы ещё заступаетесь за такую Пину..."
20045-200450290 = "Недостойная Пина глубоко тронута!"
20045-200450300 = "Но вид Пины, которая говорит честно, был очень крутым."
20045-200450310 = "Я подумал, что мне тоже стоит брать с тебя пример."
20045-200450320 = "!!"
20045-200450330 = "Чтобы Босс брал пример с Пины... я польщена!!"
20045-200450340 = "Но слышать, что я крутая... честно говоря, очень приятно!"
20045-200450350 = "Недостойная Пина будет прилагать ещё больше усилий!"
20045-200450360 = "Здравствуйте, Сенсей!"
20045-200450370 = "Сегодня Пина будет совсем другой!"
20045-200450380 = "Потому что сегодня я сияю как профессионал!"
20045-200450390 = "Я хочу, чтобы Сенсей увидел мой новый облик!"
20045-200450400 = "Тогда я буду ждать вас в Узумаки Эйгамура!"
20045-200450410 = "Уух, у меня всё ещё горит лицо..."
20045-200450420 = "В следующий раз я буду более собранной..."
20045-200450430 = "Все хорошо повеселились, так что всё в порядке."
20045-200450440 = "Я думаю, у Пины есть талант поднимать настроение."
20045-200450450 = "!!"
20045-200450460 = "Тогда я спокойна!"
20045-200450470 = "Эхе-хе... Недостойная Пина превратит сегодняшнюю неудачу в топливо для совершенствования на пути Нинкё!"
20045-200450480 = "Благодаря наставничеству Сенсея я смогла вырасти как гид!"
20045-200450490 = "Благодаря вам Пину начинают признавать как гида Нинкё!"
20045-200450500 = "Сегодня последний тур! Как насчёт того, чтобы присоединиться, Сенсей!?"
20045-200450510 = "Недостойная Пина! Я буду развлекать вас изо всех сил до самого конца!!!"
20045-200450520 = "Босс"
20045-200450530 = "О, нет"
20045-200450540 = "Сенсей! Это Пина!"
20045-200450550 = "Мне удалось выполнить задание из торгового района!"
20045-200450560 = "Благодаря тому, что Сенсей наблюдал за мной."
20045-200450570 = "Пина, в следующий раз не как гид, а"
20045-200450580 = "как попутчик в путешествии"
20045-200450590 = "Я хотела бы вместе с Сенсеем обойти Хяккияко... шучу"
20045-200450600 = "...П-пожалуйста, забудьте о том, что я только что сказала!"
20045-200450610 = "Это тоже звучит весело!"
20045-200450620 = "!!"
20045-200450630 = "Вы снова обойдёте Хяккияко вместе с Пиной!?"
20045-200450640 = "Спасибо вам!"
20045-200450650 = "Увидимся снова! Босс!"