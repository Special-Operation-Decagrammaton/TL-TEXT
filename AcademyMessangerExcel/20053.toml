[translation]
20053-200530010 = "Приветствую, Сенсей."
20053-200530020 = "Приветствую, Мичиру."
20053-200530030 = "О!"
20053-200530040 = "Вы уже почти как ниндзя~"
20053-200530050 = "Может, вам пора вступить в клуб исследования ниндзюцу?"
20053-200530060 = "А что случилось сегодня?"
20053-200530070 = "Вы проигнорировали!?"
20053-200530080 = "Уу, у ниндзя тоже есть чувства..."
20053-200530090 = "...Так вот, я исследую новое ниндзюцу,"
20053-200530100 = "но у меня не получается..."
20053-200530110 = "Я немного поранилась."
20053-200530120 = "Ранилась!?"
20053-200530130 = "Ах"
20053-200530140 = "Нет, ничего серьёзного, просто"
20053-200530150 = "Я сейчас приду."
20053-200530160 = "Что?"
20053-200530170 = "Сенсей"
20053-200530180 = "Ну..."
20053-200530190 = "Спасибо тебе."
20053-200530200 = "То, что ты мне купил, я тоже буду беречь."
20053-200530210 = "И прости за то, что было раньше."
20053-200530220 = "...Нет, всё-таки я ведь не виновата!?"
20053-200530230 = "(Ба-бах!) ← звуковой эффект дымовой шашки"
20053-200530240 = "Приветствую, Сенсей."
20053-200530250 = "Пришло известие..."
20053-200530260 = "что рана полностью зажила."
20053-200530270 = "...Ты про платье, которое сдала?"
20053-200530280 = "Фу-фу-фу! Как быстро вы поняли, Сенсей!"
20053-200530290 = "Ну, пошли забирать!"
20053-200530300 = "Будь осторожна."
20053-200530310 = "Что вы говорите?"
20053-200530320 = "Быть безупречной от начала и до конца —"
20053-200530330 = "вот железное правило ниндзя!"
20053-200530340 = "И раз мы сдавали вместе,"
20053-200530350 = "то и забирать тоже вместе!"
20053-200530360 = "Как так!?"
20053-200530370 = "Через час буду ждать у магазина!"
20053-200530380 = "Сенсей"
20053-200530390 = "Ну, прости, что сбежала..."
20053-200530400 = "Меня бросила Мичиру..."
20053-200530410 = "!?!?"
20053-200530420 = "Ты что несёшь!?!?"
20053-200530430 = "Наконец-то"
20053-200530440 = "я это нашла."
20053-200530450 = "Секрет увеличения аудитории."
20053-200530460 = "И способ заполучить этот секрет...!"
20053-200530470 = "Что случилось?"
20053-200530480 = "Фу-фу-фу"
20053-200530490 = "Вот так сюрприз,"
20053-200530500 = "я получила приглашение на один семинар!"
20053-200530510 = "Говорят, если на него пойти,"
20053-200530520 = "то там раскроют секрет"
20053-200530530 = "увеличения просмотров и подписчиков!"
20053-200530540 = "...П-понятно."
20053-200530550 = "Я покажу вам свой собственный, лучший секрет!"
20053-200530560 = "Ждите с нетерпением!"
20053-200530570 = "Будем ждать, Мичиру."
20053-200530580 = "Ня-ха-ха, спасибо, Сенсей!"
20053-200530590 = "Хе-хе"
20053-200530600 = "Фу-фу-фу-фу-фу"
20053-200530610 = "Наконец-то я поняла, Сенсей!"
20053-200530620 = "\"Что именно?\""
20053-200530630 = "Ну, это..."
20053-200530640 = "Нет"
20053-200530650 = "Наверное, лучше сказать не в Момотолке,"
20053-200530660 = "а при встрече!"
20053-200530670 = "Я сейчас приду!"
20053-200530680 = "Жди меня!"
20053-200530690 = "Сенсей..."
20053-200530700 = "Я больше не буду слепо следовать трендам..."
20053-200530710 = "Я серьёзно пойду по пути ниндзя..."