[translation]
20053-200530010 = "Домо, почтенный Сенсей."
20053-200530020 = "Домо, почтенная Мичиру."
20053-200530030 = "О!"
20053-200530040 = "С каждым днём ты всё больше похожа на настоящего ниндзя!"
20053-200530050 = "Хотите вступить в Клуб изучения ниндзюцу?"
20053-200530060 = "Так что случилось, почтенная Мичиру?"
20053-200530070 = "Сенсей применил особую технику: полностью уклониться от вопроса!"
20053-200530080 = "Бу-у. У ниндзя тоже есть чувства, знаете ли!"
20053-200530090 = "Ну и ладно! Так вот, я изучаю новое ниндзюцу,"
20053-200530100 = "но пока получается не очень."
20053-200530110 = "Я даже немного поранилась..."
20053-200530120 = "Что? Где?! Что случилось?"
20053-200530130 = "Э, ничего страшного."
20053-200530140 = "В общем..."
20053-200530150 = "Я уже иду. Прямо сейчас."
20053-200530160 = "А?"
20053-200530170 = "Почтенный Сенсей."
20053-200530180 = "Я найду хорошее применение спортивному костюму"
20053-200530190 = "и"
20053-200530200 = "Эм... Спасибо..."
20053-200530210 = "И насчёт того, что было раньше... Я"
20053-200530220 = "Знаете что?! Нет! Мне ВООБЩЕ не жаль"
20053-200530230 = "(Пуф-ф-ф!) <- Звук взрыва дымовой бомбы"
20053-200530240 = "Почтенный Сенсей"
20053-200530250 = "Наконец-то! Я услышала новости!"
20053-200530260 = "Травма зажила!"
20053-200530270 = "...Ты про платье? В ателье?"
20053-200530280 = "Вахаха! Быстро схватываете, почтенный Сенсей!"
20053-200530290 = "Это надо отметить визитом!"
20053-200530300 = "Хорошо! Счастливого пути, Мичиру!"
20053-200530310 = "Хм? Почтенный Сенсей, о чём вы?"
20053-200530320 = "Начало и конец должны быть одинаковыми!"
20053-200530330 = "Таков путь ниндзя!"
20053-200530340 = "Раз мы оставили его там вместе,"
20053-200530350 = "то и забрать должны тоже вместе!"
20053-200530360 = "Вот как это работает...?!"
20053-200530370 = "Увидимся в ателье через час!"
20053-200530380 = "Эм-м"
20053-200530390 = "Простите... что убежала..."
20053-200530400 = "*хнык* Мичиру бросила меня..."
20053-200530410 = "А-а-а-а!"
20053-200530420 = "ajskdhtkjajakhsdt"
20053-200530430 = "Наконец-то"
20053-200530440 = "я нашла его."
20053-200530450 = "Секрет, как раскрутить мой канал...!"
20053-200530460 = "И возможность узнать этот секрет...!"
20053-200530470 = "...Что происходит?"
20053-200530480 = "Фу-фу."
20053-200530490 = "Дело в том,"
20053-200530500 = "Меня пригласили на презентацию!"
20053-200530510 = "И презентация! Будет о том!"
20053-200530520 = "Как быстро увеличить просмотры и число подписчиков...!"
20053-200530530 = "И обо всех секретах этого!"
20053-200530540 = "Эм... М-м... Понятно..."
20053-200530550 = "Вот увидите, почтенный Сенсей."
20053-200530560 = "Я вернусь с невероятной стратегией!"
20053-200530570 = "Буду ждать, почтенная Мичиру!"
20053-200530580 = "Ньяхаха! Спасибо, почтенный Сенсей!"
20053-200530590 = "Фу-фу."
20053-200530600 = "Уфуфуфу"
20053-200530610 = "Я наконец-то поняла, почтенный Сенсей!"
20053-200530620 = "Хм? Поняла что...?"
20053-200530630 = "Это"
20053-200530640 = "Мм."
20053-200530650 = "лучше сказать лично,"
20053-200530660 = "чем через MomoTalk!"
20053-200530670 = "Скоро буду!"
20053-200530680 = "Ждите меня!"
20053-200530690 = "Отныне"
20053-200530700 = "я не буду уходить в посторонние темы..."
20053-200530710 = "Я буду твёрдо следовать пути ниндзя...!"
