[translation]
20053-200530010 = "Domo, Sensei-dono!"
20053-200530020 = "Domo, Michiru-dono"
20053-200530030 = "Ooh!"
20053-200530040 = "Você já está pegando o jeito de falar como um verdadeiro ninja, Sensei-dono~"
20053-200530050 = "Já bateu aquela vontade de entrar pro Clube de Pesquisa de Ninjutsu?"
20053-200530060 = "A propósito, o que houve hoje?"
20053-200530070 = "Me ignorou na cara dura?!"
20053-200530080 = "Buáá, sabia que ninjas também têm sentimentos...?"
20053-200530090 = "...Bom, é que eu tô pesquisando um ninjutsu novo,"
20053-200530100 = "mas não tá dando muito certo, sabe..."
20053-200530110 = "E acabei me machucando um pouquinho"
20053-200530120 = "Se machucou?!"
20053-200530130 = "Ah"
20053-200530140 = "Não, calma, não foi nada grave assim..."
20053-200530150 = "Estou indo pra aí agora"
20053-200530160 = "Hã?"
20053-200530170 = "Sensei-dono"
20053-200530180 = "Hum..."
20053-200530190 = "Obrigada, viu?"
20053-200530200 = "Vou cuidar com muito carinho do que você comprou pra mim"
20053-200530210 = "Ah, e desculpa por agora há pouco"
20053-200530220 = "...Espera, pensando bem, a culpa não foi minha, né?!"
20053-200530230 = "(PUF!) ← Efeito sonoro de bomba de fumaça"
20053-200530240 = "Domo, Sensei-dono"
20053-200530250 = "Acabo de receber um informe..."
20053-200530260 = "Dizem que o ferimento foi completamente curado"
20053-200530270 = "...Está falando do vestido que deixamos no conserto?"
20053-200530280 = "Fufufu! Muito perspicaz, Sensei-dono!"
20053-200530290 = "Agora, vamos lá resgatá-lo!"
20053-200530300 = "Vá com cuidado"
20053-200530310 = "Ué, do que você tá falando?"
20053-200530320 = "Executar a missão com perfeição do início ao fim..."
20053-200530330 = "Essa é a regra de ouro de um ninja!"
20053-200530340 = "Além do mais, a gente deixou lá juntos,"
20053-200530350 = "então temos que buscar juntos também!"
20053-200530360 = "Como assim?!"
20053-200530370 = "Te espero na frente da loja daqui a uma hora!"
20053-200530380 = "Sensei-dono"
20053-200530390 = "Hum, desculpa ter saído correndo daquele jeito..."
20053-200530400 = "Fui abandonado pela Michiru..."
20053-200530410 = "?!?!"
20053-200530420 = "O que cê tá faladnoo?!?!"
20053-200530430 = "Finalmente..."
20053-200530440 = "Eu descobri"
20053-200530450 = "o segredo para fazer o meu canal crescer"
20053-200530460 = "E também o método para colocar as mãos nesse segredo...!"
20053-200530470 = "O que deu em você assim do nada...?"
20053-200530480 = "Fufufu"
20053-200530490 = "Pasme, Sensei-dono:"
20053-200530500 = "eu ganhei o direito de participar de uma palestra exclusiva!"
20053-200530510 = "E disseram que quem participa"
20053-200530520 = "aprende a fórmula secreta"
20053-200530530 = "para multiplicar as visualizações e o número de inscritos!"
20053-200530540 = "...E-Entendi"
20053-200530550 = "Vou criar a minha própria fórmula secreta especial com as minhas próprias mãos!"
20053-200530560 = "Aguarde para ver!"
20053-200530570 = "Estarei aguardando ansiosamente, Michiru-dono"
20053-200530580 = "Nyahaha, valeu, Sensei-dono!"
20053-200530590 = "Hehe"
20053-200530600 = "Fufufufufu"
20053-200530610 = "Finalmente descobri tudo, Sensei-dono!"
20053-200530620 = "D-Descobriu o quê?"
20053-200530630 = "É que, sabe..."
20053-200530640 = "Quer dizer, não!"
20053-200530650 = "Em vez de falar pelo MomoTalk,"
20053-200530660 = "acho melhor te contar pessoalmente!"
20053-200530670 = "Irei até aí imediatamente!"
20053-200530680 = "Espere por mim!"
20053-200530690 = "Sensei-dono..."
20053-200530700 = "Vou parar de tentar copiar qualquer modinha sem pensar..."
20053-200530710 = "Vou trilhar o caminho ninja com seriedade de agora em diante..."
