[translation]
10107-101070010 = "★Semanário Pandemonium★ ☞ Assine já e ganhe um brinde comemorativo exclusivo!"
10107-101070020 = "Entre em contato agora mesmo!"
10107-101070030 = "Chiaki?"
10107-101070040 = "É a Chiaki... né?"
10107-101070050 = "Opa?"
10107-101070060 = "Muito obrigada pela resposta, Sensei!!"
10107-101070070 = "Deseja fazer uma assinatura do \"Semanário Pandemonium\"?"
10107-101070080 = "Ah, não é isso..."
10107-101070090 = "Hehe! Não vou forçar a barra!"
10107-101070100 = "Primeiro dê uma olhada em um exemplar de verdade e depois decida!"
10107-101070110 = "Ah, por falar nisso,"
10107-101070120 = "quase ia me esquecendo!"
10107-101070130 = "Depois vou mandar o brinde comemorativo de assinatura do \"Semanário Pandemonium\" pra você, tá?"
10107-101070140 = "E o que é o brinde?"
10107-101070150 = "Hehehe"
10107-101070160 = "Isso é surpresa até chegar aí~!"
10107-101070170 = "Olá~, Sensei!"
10107-101070180 = "Você está na Schale hoje?"
10107-101070190 = "Sim... Estou trabalhando..."
10107-101070200 = "Ué? Parece meio desanimado, hein?"
10107-101070210 = "Nesse caso,"
10107-101070220 = "para mandar esse desânimo da tarde para bem longe de uma vez só,"
10107-101070230 = "vou entregar pessoalmente o seu brinde comemorativo de assinatura do \"Semanário Pandemonium\"!"
10107-101070240 = "Estou indo para aí agora mesmo, me espere só um pouquinho!"
10107-101070250 = "Uugh..."
10107-101070260 = "Não aguento mais... Meu estômago tá embrulhado..."
10107-101070270 = "O quanto você comeu...?"
10107-101070280 = "Comi todos aqueles doces de agora há pouco..."
10107-101070290 = "Mas todo mundo me ajudou!"
10107-101070300 = "E consegui tirar um montão de fotos também!"
10107-101070310 = "Menos mal, então."
10107-101070320 = "Mas, por um bom tempo, doces eu não quero nem ver..."
10107-101070330 = "Uugh..."
10107-101070340 = "- Aviso -"
10107-101070350 = "O \"Semanário Pandemonium\" não terá edição nesta semana!"
10107-101070360 = "Pedimos desculpas pelo transtorno, aguardem ansiosamente pela edição da semana que vem!"
10107-101070370 = "Sensei"
10107-101070380 = "Se você tiver gostado de algum dos clubes que visitamos hoje,"
10107-101070390 = "que tal nos tornarmos membros convidados juntos?!"
10107-101070400 = "Boa ideia. Vou pensar no caso."
10107-101070410 = "Isso!"
10107-101070420 = "Pode me chamar a qualquer hora, viu~!"
10107-101070430 = "A próxima edição do \"Semanário Pandemonium\" será uma edição especial!"
10107-101070440 = "Não é empolgante, Sensei?"
10107-101070450 = "Edição especial?"
10107-101070460 = "Sim!"
10107-101070470 = "Vamos revelar nos mínimos detalhes"
10107-101070480 = "todas as informações que os nossos leitores estão loucos para saber!"
10107-101070490 = "Fiquei curioso..."
10107-101070500 = "Sobre o que vai ser?"
10107-101070510 = "Hehe"
10107-101070520 = "Isso~ ainda é segredo!"
10107-101070530 = "Muito obrigada mesmo por hoje!"
10107-101070540 = "Graças a você, acho que vou conseguir escrever uma matéria incrível!"
10107-101070550 = "Fico feliz se pude ajudar."
10107-101070560 = "Assim que esta edição especial sair da gráfica, você será o primeiro a receber um exemplar, Sensei!"
10107-101070570 = "Aguarde~!"
