[translation]
10107-101070010 = "★ Еженедельник «Пандемониум» ★ ☞ При подписке вы гарантированно получите памятный подарок!"
10107-101070020 = "Свяжитесь с нами прямо сейчас!"
10107-101070030 = "Чиаки?"
10107-101070040 = "Чиаки... ведь так?"
10107-101070050 = "О?"
10107-101070060 = "Спасибо за ответ, Сенсей!!"
10107-101070070 = "Вы хотите оформить подписку на «Еженедельник Пандемониум»?"
10107-101070080 = "А, нет, дело не в этом..."
10107-101070090 = "Хе-хе! Я не настаиваю!"
10107-101070100 = "Сначала взгляните на сам журнал, а потом решайте!"
10107-101070110 = "А, кстати,"
10107-101070120 = "я совсем забыла!"
10107-101070130 = "Памятный подарок за подписку на «Еженедельник Пандемониум» я пришлю позже!"
10107-101070140 = "И что же там можно получить?"
10107-101070150 = "Хе-хе-хе"
10107-101070160 = "Это сюрприз, когда получите!"
10107-101070170 = "Здравствуйте, Сенсей!"
10107-101070180 = "Вы сегодня в Шале?"
10107-101070190 = "Да... я на работе..."
10107-101070200 = "Ой? Что-то вы выглядите невесёлым?"
10107-101070210 = "В таком случае"
10107-101070220 = "чтобы развеять послеобеденную хандру!"
10107-101070230 = "Я доставлю вам памятный подарок за подписку на «Еженедельник Пандемониум»!"
10107-101070240 = "Я сейчас приду, подождите немного!"
10107-101070250 = "У-у-у..."
10107-101070260 = "Всё, не могу... желудок бунтует..."
10107-101070270 = "Сколько же ты съела...?"
10107-101070280 = "Все сладости, что только что ела..."
10107-101070290 = "Но все мне помогали!"
10107-101070300 = "И фотографий наделали много!"
10107-101070310 = "Ну, и хорошо."
10107-101070320 = "Но сладкого теперь надолго..."
10107-101070330 = "У-у-у..."
10107-101070340 = "- Объявление -"
10107-101070350 = "На этой неделе «Еженедельник Пандемониум» не выходит!"
10107-101070360 = "Приносим извинения за неудобства, ждите следующего выпуска!"
10107-101070370 = "Сенсей,"
10107-101070380 = "если сегодня вам понравился какой-нибудь кружок,"
10107-101070390 = "может, попробуете стать приглашённым участником?"
10107-101070400 = "Хорошо, подумаю."
10107-101070410 = "Да!"
10107-101070420 = "Обращайтесь в любое время!"
10107-101070430 = "Следующий выпуск «Еженедельника Пандемониум» будет специальным!"
10107-101070440 = "Вам не интересно, Сенсей?"
10107-101070450 = "Специальный выпуск?"
10107-101070460 = "Да!"
10107-101070470 = "Мы покажем информацию, которую читатели хотят узнать,"
10107-101070480 = "без утайки!"
10107-101070490 = "Любопытно..."
10107-101070500 = "А о чём именно?"
10107-101070510 = "Хе-хе"
10107-101070520 = "Это пока секрет!"
10107-101070530 = "Большое спасибо за сегодня!"
10107-101070540 = "Благодаря вам, похоже, получится отличная статья!"
10107-101070550 = "Рад, что смог помочь."
10107-101070560 = "Когда специальный выпуск будет напечатан, я первым делом принесу его вам, Сенсей!"
10107-101070570 = "Ждите с нетерпением!"