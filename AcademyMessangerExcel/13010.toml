[translation]
13010-94 = "Здравствуйте, Сенсей. Это Юука."
13010-95 = "Вы меня помните?"
13010-96 = "Конечно помню."
13010-97 = "Кто-о-о?"
13010-98 = "Что ж, я рада."
13010-99 = "Хаясэ Юука! Вы уже правда меня забыли?!"
13010-100 = "Хорошо, что я раньше получила ваши контактные данные."
13010-101 = "Мне нужно было обсудить с вами кое-что важное."
13010-102 = "Шале до сих пор не возместили расходы за операцию по возвращению клубной комнаты."
13010-103 = "Когда вы выставите счёт?"
13010-104 = "А мы должны были это сделать?"
13010-105 = "Конечно. Пули не бесплатные."
13010-106 = "Составьте счёт и отправьте его в Генеральный студенческий совет."
13010-107 = "Они разберутся с остальным."
13010-108 = "А как его составить?"
13010-109 = "В Миллениуме мы используем стандартную форму."
13010-110 = "В следующий раз, когда приду в Шале, принесу вам одну."
13010-111 = "Спасибо за помощь."
13010-112 = "Ничего особенного."
13010-113 = "Хорошего дня."
13010-114 = "Сенсей! Почему к счёту Шале приложен чек за игрушку?"
13010-115 = "Покупка игрушек никак не связана с работой!"
13010-116 = "Но она была нужна мне для работы..."
13010-117 = "Можешь один раз закрыть на это глаза?"
13010-118 = "Нет! Сенсей, ваша задача - подавать студентам хороший пример!"
13010-119 = "Этот счёт - полный бардак... Я его переделаю."
13010-120 = "Погодите... Вы ведь не специально всё испортили, чтобы самому не делать, да?"
13010-121 = "Сенсеееей!"
13010-122 = "Сенсей, можете сегодня после уроков зайти в кабинет студсовета?"
13010-123 = "У меня проблема, с которой даже я не могу справиться..."
13010-124 = "Если даже ты не смогла, сомневаюсь, что смогу я."
13010-125 = "Нет, это не так."
13010-126 = "Мне правда нужна помощь взрослого!"
13010-127 = "Если я могу помочь, то постараюсь."
13010-128 = "Хорошо. Буду ждать вас в кабинете студсовета."
13010-129 = "Серьёзно... Почему студенты Тринити и Геенны не могут следить за своим снаряжением?"
13010-130 = "А теперь-то почему ты злишься?"
13010-131 = "Что значит «теперь»? Вы говорите так, будто я каждый день злюсь!"
13010-132 = "В общем, насчёт контрабанды с Чёрного рынка..."
13010-133 = "Я расследовала происхождение конфискованного оружия..."
13010-134 = "Похоже, оно поступило из Тринити и Геенны."
13010-135 = "Я видела, как продавали оружие и даже танки с метками их академий."
13010-136 = "Сомневаюсь, что эти две академии вообще как-то учитывают своё снаряжение."
13010-137 = "В Миллениуме очень строгий учёт,"
13010-138 = "поэтому мы никогда ничего такого не теряем!"
13010-139 = "Правда?"
13010-140 = "..."
13010-141 = "Ну, если не считать личные изделия, которые студенты сами модифицируют и продают..."
13010-142 = "Сенсей, сегодня утром вы снова опоздали."
13010-143 = "Я понимаю, что никто не следит, но разве это хороший пример?"
13010-144 = "Но вчера я допоздна работал..."
13010-145 = "Я бы не опаздывал, если бы ты каждое утро приходила меня будить."
13010-146 = "Опаздывать нельзя, даже если у вас было много работы!"
13010-147 = "Хватит вести себя как ребёнок! Вы взрослый или нет?"
13010-148 = "Мне кажется, вы слишком расслабились, потому что школьные правила на Шале не распространяются."
13010-149 = "Больше никаких оправданий! Если завтра снова опоздаете, придётся выполнять мои приказы!"
13010-150 = "Значит, если ТЫ опоздаешь, я смогу отдавать приказы тебе?"
13010-151 = "Что? С чего бы мне вообще опаздывать?"
13010-152 = "Просто не опаздывайте завтра. Пожалуйста!"
13010-153 = "Сенсей, я видела настольную игру в административном кабинете Шале."
13010-154 = "Если ей никто не пользуется, можно я её одолжу?"
13010-155 = "Не вижу причин отказывать. Ты любишь игры?"
13010-156 = "Конечно!"
13010-157 = "Я люблю и настольные, и онлайн-игры."
13010-158 = "Не ожидал."
13010-159 = "Похоже, вы обо мне неправильного мнения,"
13010-160 = "но я люблю игры не меньше остальных студентов."
13010-161 = "Придумывать разные стратегии против сложных врагов так же весело, как решать задачи по математике."
13010-130100010 = "Когда я занимаюсь бухгалтерией..."
13010-130100020 = "мне кажется, будто весь мир состоит из чисел."
13010-130100030 = "Звучит как опасный мир..."
13010-130100040 = "Вы бы назвали его опасным?"
13010-130100050 = "Я бы не заходила так далеко..."
13010-130100060 = "Не то чтобы мир должен работать только на цифрах..."
13010-130100070 = "Я скорее хочу сказать..."
13010-130100080 = "Если бы люди понимали важность цифр..."
13010-130100090 = "...возможно, моя работа была бы не такой тяжёлой. Вот и всё."
13010-130100100 = "Расчёты снова не сходятся?"
13010-130100110 = "Да..."
13010-130100120 = "У моего калькулятора села батарея."
13010-130100130 = "Я просто жалуюсь, пока он заряжается."
