[translation]
13010-94 = "Olá, Sensei. Aqui é a Yuuka"
13010-95 = "Você se lembra de mim?"
13010-96 = "Sim, é claro"
13010-97 = "...Quem é mesmo?"
13010-98 = "Que bom, fico feliz que se lembre de mim"
13010-99 = "Sou eu, Hayase Yuuka! Já se esqueceu de mim?!"
13010-100 = "Fiz muito bem em pegar o seu contato antes, Sensei"
13010-101 = "Ah, sim, indo direto ao assunto"
13010-102 = "Ainda não identificamos a transferência referente aos custos de munição da operação anterior de retomada da Schale"
13010-103 = "A fatura já deve ter chegado aí na Schale, mas quando será efetuado o pagamento?"
13010-104 = "Sou eu quem precisa processar isso por aqui...?"
13010-105 = "É claro que sim, afinal munição também não cai do céu de graça"
13010-106 = "Como entra como despesa operacional, basta enviar a requisição ao Conselho Estudantil Geral"
13010-107 = "que o valor será repassado à Schale. Aí é só transferir esse montante diretamente para nós"
13010-108 = "Yuuka, como é que se preenche uma requisição de pagamento mesmo...?"
13010-109 = "...*Suspiro*. Nós temos um modelo padrão de fatura que usamos aqui na Millennium,"
13010-110 = "então vou levar para você na próxima vez que eu for à Schale"
13010-111 = "Muito obrigado...!"
13010-112 = "Imagina, não é nada demais"
13010-113 = "Bom, tenha um ótimo dia hoje"
13010-114 = "Sensei! Por que tem outro recibo de brinquedo aqui no meio?!"
13010-115 = "Brinquedos não têm absolutamente nada a ver com o seu trabalho, não é?!"
13010-116 = "Sem isso eu não consigo trabalhar..."
13010-117 = "Só dessa vez, faz vista grossa só dessa vez, por favor..."
13010-118 = "De jeito nenhum! Você precisa dar o exemplo para as alunas, Sensei!"
13010-119 = "Vou separar todas essas coisas direitinho e organizar as contas como deve ser!"
13010-120 = "...Não me diga que você está fazendo a papelada de qualquer jeito só porque acha chato?"
13010-121 = "...Senseeeeei!!!!!"
13010-122 = "Sensei, você poderia dar uma passada na sala do conselho estudantil hoje depois da aula?"
13010-123 = "Estou diante de um problema muito difícil que não consigo calcular sozinha..."
13010-124 = "Se é um problema que nem você consegue resolver, Yuuka, duvido muito que eu dê conta..."
13010-125 = "Não, hum, não é bem esse tipo de cálculo..."
13010-126 = "Eu realmente preciso da sua ajuda, Sensei"
13010-127 = "Se for algo que esteja ao meu alcance, com todo o prazer"
13010-128 = "Muito obrigada, estarei esperando na sala do conselho estudantil então"
13010-129 = "Francamente... Como é que a Trinity e a Gehenna fazem o controle de patrimônio delas?"
13010-130 = "O que aconteceu dessa vez para você estar tão brava?"
13010-131 = "Como assim \"dessa vez\"...? Na sua visão eu pareço estar brava o tempo todo, Sensei?"
13010-132 = "Estou falando dos itens contrabandeados no Mercado Negro"
13010-133 = "Fui investigar a origem do armamento que confiscamos recentemente,"
13010-134 = "e descobri que a grande maioria tinha sido desviada da Trinity e da Gehenna"
13010-135 = "Não só armas de fogo com o brasão das escolas gravado, mas até tanques de guerra foram parar no mercado paralelo..."
13010-136 = "É impossível acreditar que qualquer uma das duas academias esteja fazendo uma gestão séria"
13010-137 = "É claro que aqui na Millennium o nosso controle é rigoroso e impecável,"
13010-138 = "então jamais aconteceria de nossos equipamentos vazarem lá para fora!"
13010-139 = "Tem certeza?"
13010-140 = "..."
13010-141 = "Bom, tirando as invenções pessoais que as alunas modificam por conta própria e saem vendendo escondido..."
13010-142 = "Sensei, fiquei sabendo que você chegou atrasado hoje de manhã de novo"
13010-143 = "Só porque não existe um professor para cobrar o Sensei, não acha que está se atrasando demais?"
13010-144 = "É que ontem tive tanto trabalho que acabei indo dormir super tarde..."
13010-145 = "Se você viesse me acordar de manhã, Yuuka..."
13010-146 = "Mesmo assim não pode se atrasar!"
13010-147 = "Você é um adulto, pare de querer mimo!"
13010-148 = "Você está relaxado demais só porque a Schale não tem um regulamento interno"
13010-149 = "Vamos estabelecer uma penalidade. A partir de amanhã, para cada atraso seu, você terá que obedecer a uma ordem minha!"
13010-150 = "E se for você quem se atrasar, Yuuka, eu posso te dar uma ordem também?"
13010-151 = "Que absurdo você está dizendo? Como se eu fosse chegar atrasada algum dia!"
13010-152 = "Enfim, vê se não se atrasa de jeito nenhum amanhã. De jeito nenhum, ouviu?!"
13010-153 = "Vi que tinha um jogo de tabuleiro largado no escritório da Schale,"
13010-154 = "se você não estiver usando, tudo bem se eu ficar com ele?"
13010-155 = "Sim, pode pegar. Você também gosta de jogos, Yuuka?"
13010-156 = "Claro que sim"
13010-157 = "Gosto tanto de jogos de tabuleiro quanto de jogos online"
13010-158 = "Essa me surpreendeu"
13010-159 = "Acho que você tem uma imagem meio equivocada de mim..."
13010-160 = "Eu gosto de videogames normalmente, tanto quanto qualquer outra aluna"
13010-161 = "Afinal, bolar estratégias para derrotar os inimigos é tão divertido quanto resolver problemas de matemática"
13010-130100010 = "Quando fico muito tempo trabalhando com planilhas e números..."
13010-130100020 = "Não começa a dar a sensação de que o mundo inteiro é feito de números?"
13010-130100030 = "Sinto cheiro de um mundo bem perigoso..."
13010-130100040 = "Perigoso, você acha?"
13010-130100050 = "Eu não acho nem um pouco"
13010-130100060 = "Não estou dizendo que um mundo onde tudo seja explicado por números seria o ideal, claro"
13010-130100070 = "É só que, bem"
13010-130100080 = "Se cada um entendesse um pouquinho melhor a importância dos números,"
13010-130100090 = "o meu trabalho ficaria muito mais fácil..."
13010-130100100 = "Deixa eu adivinhar: as contas não estão batendo de novo?"
13010-130100110 = "Sim, na mosca"
13010-130100120 = "A bateria da minha calculadora acabou justo agora,"
13010-130100130 = "então aproveitei a pausa para trocar as pilhas e desabafar um pouquinho com você"
