[translation]
13010-94 = "Здравствуйте, Сенсей. Это Юука."
13010-95 = "Вы помните меня?"
13010-96 = "Да, конечно."
13010-97 = "...А ты кто?"
13010-98 = "Как хорошо, что вы помните, я счастлива."
13010-99 = "Я Хаясt Юука! Вы уже забыли!?"
13010-100 = "Я правильно сделала, что взяла у вас контакты."
13010-101 = "Ах да, по делу."
13010-102 = "Насчёт расходов на боеприпасы во время операции по возвращению Шале, перевод ещё не подтверждён."
13010-103 = "Счёт-фактура должен был прийти в Шале, когда вы планируете оплатить?"
13010-104 = "Мне нужно самому этим заниматься...?"
13010-105 = "Конечно, пули ведь не бесплатные."
13010-106 = "Это ведь рабочие расходы, так что если вы подадите заявку в Федеральный студенческий совет,"
13010-107 = "то Шале должно получить оплату. Тогда вы могли бы просто перечислить нам эту сумму."
13010-108 = "Юука, а как составлять счёт-фактуру...?"
13010-109 = "...Фух. У нас в Миллениуме есть шаблон счёта-фактуры,"
13010-110 = "так что я принесу его, когда в следующий раз приду в Шале."
13010-111 = "Спасибо...!"
13010-112 = "Не за что, это мелочь."
13010-113 = "Тогда хорошего дня."
13010-114 = "Сенсей! Почему у вас снова чек на игрушку!?"
13010-115 = "Игрушки ведь не имеют отношения к работе!?"
13010-116 = "Без неё я не могу работать..."
13010-117 = "Если бы вы только в этот раз закрыли на это глаза..."
13010-118 = "Нет! Сенсей должен быть примером для студентов!"
13010-119 = "Я отложу такие и приведу всё в порядок!"
13010-120 = "...Неужели вы делаете это небрежно, потому что вам лень возиться с документами?"
13010-121 = "...Сенсей!!!!!"
13010-122 = "Сенсей, не могли бы вы зайти в кабинет студсовета сегодня после уроков?"
13010-123 = "Я столкнулась с одной сложной проблемой, которую не могу решить сама..."
13010-124 = "Если даже Юука не может решить, то у меня тем более вряд ли получится..."
13010-125 = "Нет, эм, не в этом дело..."
13010-126 = "Мне нужна ваша помощь, Сенсей."
13010-127 = "Если это в моих силах, я с радостью."
13010-128 = "Спасибо, тогда я буду ждать вас в кабинете студсовета."
13010-129 = "Ну что же... интересно, как Тринити и Геенна управляют своими запасами?"
13010-130 = "А на этот раз что случилось, что ты так злишься?"
13010-131 = "Вы сказали «ещё»... я по-вашему всегда злюсь?"
13010-132 = "Дело в контрабанде на Чёрном рынке."
13010-133 = "Я проверила происхождение конфискованного оружия,"
13010-134 = "и почти всё оно поступало из Тринити и Геенны."
13010-135 = "Там не только оружие с эмблемами школ, но даже танки продаются на чёрном рынке..."
13010-136 = "Похоже, ни одна из этих академий не ведёт должный учёт."
13010-137 = "Конечно, в Миллениуме учёт ведётся безупречно и строго,"
13010-138 = "так что никакого хищения имущества быть не может!"
13010-139 = "Правда?"
13010-140 = "..."
13010-141 = "Ну, если не считать личные вещи студентов, которые они сами переделывают и продают..."
13010-142 = "Сенсей, говорят, вы сегодня утром снова опоздали."
13010-143 = "Сколько бы вас ни не контролировали, вы слишком часто опаздываете, не находите?"
13010-144 = "Вчера было много работы, так что я лёг поздно..."
13010-145 = "Если бы Юука разбудила меня..."
13010-146 = "Но опоздания недопустимы!"
13010-147 = "Вы же взрослый, не надо капризничать!"
13010-148 = "Из-за того, что в Шале нет школьных правил, вы слишком расслабились."
13010-149 = "Давайте введём наказание. С завтрашнего дня за каждое опоздание вы будете выполнять одно моё поручение!"
13010-150 = "Тогда если Юука опоздает, я смогу отдавать приказы тебе?"
13010-151 = "Что вы говорите, я ведь не опаздываю."
13010-152 = "В любом случае, завтра не опаздывайте ни в коем случае. Ясно!"
13010-153 = "В кабинете Шале я нашла оставленную настольную игру."
13010-154 = "Если вы её не используете, можно мне её взять?"
13010-155 = "Да, конечно. Ты тоже любишь игры, Юука?"
13010-156 = "Конечно."
13010-157 = "Я люблю и настольные, и онлайн-игры."
13010-158 = "Неожиданно, наверное."
13010-159 = "Возможно, вы неправильно меня представляете..."
13010-160 = "Я люблю игры так же, как и другие студенты."
13010-161 = "Думать о том, как пройти противника, так же весело, как решать математические задачи."
13010-130100010 = "Когда я работаю с числами, как-то..."
13010-130100020 = "не кажется ли вам, что весь мир состоит из цифр?"
13010-130100030 = "Пахнет опасным миром..."
13010-130100040 = "Опасным?"
13010-130100050 = "Я так не считаю."
13010-130100060 = "Я не говорю, что мир, где всё можно объяснить цифрами, идеален."
13010-130100070 = "Просто..."
13010-130100080 = "если бы все немного лучше понимали важность этого,"
13010-130100090 = "моя работа стала бы легче..."
13010-130100100 = "Может, у тебя снова что-то не сходится?"
13010-130100110 = "Да, именно так."
13010-130100120 = "Как раз батарейка в калькуляторе села,"
13010-130100130 = "вот я и решила заодно немного пожаловаться."