[translation]
10145-101450010 = "Раз уж мы оказались в долине"
10145-101450020 = "может попробуем отойти от привычного уклада жизни?"
10145-101450030 = "Имеет смысл."
10145-101450040 = "Хм."
10145-101450050 = "Раз уж Вы согласны"
10145-101450060 = "пожалуйста, немедленно приезжайте по адресу, который я вам пришлю."
10145-101450070 = "Всё очень быстро обострилось!!"
10145-101450080 = "К тому же"
10145-101450090 = "опоздания не останутся безнаказанными."
10145-101450100 = "Мне тут вдруг"
10145-101450110 = "вспомнились вчерашние события."
10145-101450120 = "Когда ты... Капризничала?"
10145-101450130 = "Фу-фу."
10145-101450140 = "Это даже несколько стыдно"
10145-101450150 = "слышать подобное от Вас, Сенсей."
10145-101450160 = "Тогда сегодня я тоже буду под Вашей опекой."
10145-101450170 = "Ведь Вы лучший, Сенсей!"
10145-101450180 = "Кисаки?.."
10145-101450190 = "Уже просулись, Сенсей?"
10145-101450200 = "В такой час?"
10145-101450210 = "Вы довольно рано."
10145-101450220 = "Всё относительно."
10145-101450230 = "Однако, жизнь коротка."
10145-101450240 = "Если не воспользоваться этим мимолетным мгновением"
10145-101450250 = "отпуск останется в памяти, омраченный сожалением."
10145-101450260 = "Мы вернулись из долины..."
10145-101450270 = "Однако летнее солнце всё так же палит."
10145-101450280 = "И вот так."
10145-101450290 = "Я пришла к выводу"
10145-101450300 = "что мне нужно подобрать оптимальные условия для купания в купальнике."
10145-101450310 = "Что...?"
10145-101450320 = "Должна Вас поблагодарить за то, что насладились этим летом со мной, Сенсей."
10145-101450330 = "Солнце село в незабываемое время."
10145-101450340 = "Не совсем, Кисаки."
10145-101450350 = "В смысле?"
10145-101450360 = "Как ты и сказала!"
10145-101450370 = "Снаружи всё ещё лето!"
10145-101450380 = "Да, я сказала, что лето ещё не кончилось, однако..."
10145-101450390 = "Понятно."
10145-101450400 = "Вы собираетесь проводить больше летнего времени в моей компании?"
10145-101450410 = "До тех пор, пока ты сама этого желаешь, Кисаки!"
10145-101450420 = "Понятно."
10145-101450430 = "Фу-фу."
10145-101450440 = "Пусть я не считаю Вас таким человеком,"
10145-101450450 = "но всё же надеюсь, что Вы не разбрасываетесь такими словами просто так."
10145-101450460 = "Ведь бабочка помнит обещание всю жизнь."
