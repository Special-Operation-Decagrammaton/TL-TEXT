[translation]
10145-101450010 = "Раз уж мы пришли в ущелье,"
10145-101450020 = "не думаете ли вы, что стоит провести время с достоинством?"
10145-101450030 = "Да, ты права."
10145-101450040 = "Хм."
10145-101450050 = "Похоже, мы сошлись во мнении."
10145-101450060 = "Тогда встретимся в месте, которое я сейчас назову."
10145-101450070 = "А, прямо сейчас!?"
10145-101450080 = "Не волнуйтесь. У меня хватает терпения."
10145-101450090 = "... Но есть и предел."
10145-101450100 = "Внезапно"
10145-101450110 = "я вспомнила вчерашний день."
10145-101450120 = "Было весело, правда?"
10145-101450130 = "Да, это так."
10145-101450140 = "Однако"
10145-101450150 = "оставлять это в прошлом пока рано."
10145-101450160 = "Итак, сегодня я тоже буду ждать тебя."
10145-101450170 = "Ведь Сенсей всегда лучший!"
10145-101450180 = "Кисаки...?"
10145-101450190 = "Сенсей, вы уже встали?"
10145-101450200 = "Мм...?"
10145-101450210 = "Что ты так рано?"
10145-101450220 = "Рано вставать — это похвально."
10145-101450230 = "Время течёт непрерывно."
10145-101450240 = "Использовать его с пользой хотя бы немного"
10145-101450250 = "поможет провести отпуск без сожалений."
10145-101450260 = "Жаркие дни продолжаются, вы здоровы?"
10145-101450270 = "Когда солнце такое сильное,"
10145-101450280 = "начинаешь скучать по тому ущелью."
10145-101450290 = "Как насчёт вас, Сенсей?"
10145-101450300 = "Отправимся в место, достойное купальников?"
10145-101450310 = "Мм...?"
10145-101450320 = "Я благодарна вам за то, что провела это лето вместе с вами."
10145-101450330 = "Все эти воспоминания незабываемы."
10145-101450340 = "Ещё не всё."
10145-101450350 = "О?"
10145-101450360 = "На улице ведь всё ещё жарко, правда?"
10145-101450370 = "Лето ведь продолжается, так?"
10145-101450380 = "Это так, но..."
10145-101450390 = "Понимаю."
10145-101450400 = "Тогда вы останетесь со мной ещё?"
10145-101450410 = "Если ты хочешь, сколько угодно."
10145-101450420 = "Вот как."
10145-101450430 = "Хе-хе."
10145-101450440 = "Только не говорите таких вещей где попало."
10145-101450450 = "С вами, Сенсей, я могу не волноваться..."
10145-101450460 = "Но, говорят, одна бабочка запоминает обещания навечно."