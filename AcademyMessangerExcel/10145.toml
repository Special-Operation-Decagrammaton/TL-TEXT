[translation]
10145-101450010 = "Já que viemos até este cânion"
10145-101450020 = "não achas que devemos desfrutar do tempo à altura?"
10145-101450030 = "Com certeza"
10145-101450040 = "Hum"
10145-101450050 = "Vejo que nossas opiniões estão de acordo"
10145-101450060 = "Sendo assim, encontremo-nos no local que direi agora"
10145-101450070 = "Hã, agora mesmo?!"
10145-101450080 = "Fica tranquilo. Sou deveras paciente"
10145-101450090 = "...Embora tudo tenha limite"
10145-101450100 = "De súbito"
10145-101450110 = "pus-me a recordar o dia de ontem"
10145-101450120 = "Foi muito divertido, né"
10145-101450130 = "De fato"
10145-101450140 = "Contudo"
10145-101450150 = "ainda é cedo demais para relegá-lo ao passado"
10145-101450160 = "Portanto, hoje também estarei à tua espera"
10145-101450170 = "Afinal, o Sensei é sempre o máximo!"
10145-101450180 = "Kisaki...?"
10145-101450190 = "Sensei, estás acordado?"
10145-101450200 = "Hum...?"
10145-101450210 = "O que houve tão cedo?"
10145-101450220 = "Admirável que já estejas de pé a esta hora"
10145-101450230 = "O tempo flui incessantemente"
10145-101450240 = "Aproveitá-lo da melhor forma, por menor que seja o instante,"
10145-101450250 = "é o que conduz a um descanso sem arrependimentos"
10145-101450260 = "Os dias quentes persistem, mas passas bem?"
10145-101450270 = "Com o sol inclemente deste jeito"
10145-101450280 = "acabo sentindo saudades daquele cânion"
10145-101450290 = "Que me dizes, Sensei?"
10145-101450300 = "Vamos a um lugar digno de trajes de banho"
10145-101450310 = "Hum...?"
10145-101450320 = "Agradeço-te por teres compartilhado este verão comigo"
10145-101450330 = "Todas as lembranças são inesquecíveis"
10145-101450340 = "Ainda não acabou"
10145-101450350 = "Oh?"
10145-101450360 = "Ainda está calor lá fora, não está?"
10145-101450370 = "O verão ainda continua, não é?"
10145-101450380 = "Quanto a isso, tens razão, mas..."
10145-101450390 = "Compreendo"
10145-101450400 = "Sendo assim, permanecerás ainda na minha companhia?"
10145-101450410 = "Pelo tempo que você desejar"
10145-101450420 = "Entendo"
10145-101450430 = "Fufu"
10145-101450440 = "Cuidado para não saíres dizendo esse tipo de coisa a outros por aí"
10145-101450450 = "Talvez não haja motivo para preocupação tratando-se de ti, Sensei, mas..."
10145-101450460 = "dizem que certa borboleta guarda uma promessa na memória por toda a eternidade"
