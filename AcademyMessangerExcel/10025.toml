[translation]
10025-100250010 = "Сенсей, кажется, побочный эффект того лекарства снова проявляется..."
10025-100250020 = "Из-за уменьшения возраста всё теперь кажется выше."
10025-100250030 = "Всё тело такое лёгкое и непривычное."
10025-100250040 = "Ты в порядке? Думаю, тебе стоит отдохнуть внутри."
10025-100250050 = "Я в порядке. Я собираюсь посетить моё любимое место с десертами."
10025-100250060 = "Есть кое-что, что я хотела попробовать, став ребёнком!"
10025-100250070 = "Читать это как-то наоборот."
10025-100250080 = "Не думала, что в таком теле у меня ещё и вкус станет детским."
10025-100250090 = "Как мне теперь читать лекции студентам Сада цветущей сливы о правильном питании?"
10025-100250100 = "Наверное, пока не вернусь в нормальное тело, придётся есть взрослую еду."
10025-100250110 = "Пожалуй, начну с рома, который добавляют в изюм с ромом..."
10025-100250120 = "Так нельзя!"
10025-100250130 = "Вы заняты, Сенсей?"
10025-100250140 = "Что происходит?"
10025-100250150 = "Я разбирала вещи в Саду цветущей сливы, и случился небольшой инцидент..."
10025-100250160 = "И сейчас я не могу двигаться."
10025-100250170 = "Уже иду в Сад цветущей сливы."
10025-100250180 = "Вы слышали, Сенсей?"
10025-100250190 = "В центре Кивотоса собираются открыть огромную крытую игровую площадку."
10025-100250200 = "Студенты Сада цветущей сливы хотят провести там следующую экскурсию, поэтому я хотела заранее проверить безопасность."
10025-100250210 = "Не могли бы вы сходить со мной на площадку в эти выходные?"
10025-100250220 = "Конечно. У меня всё равно ничего не запланировано."
10025-100250230 = "Тебе будет удобно с твоим нынешним ростом?"
10025-100250240 = "Думаю, да."
10025-100250250 = "Вообще-то, так даже может быть проще."
10025-100250260 = "Я смогу увидеть площадку глазами ребёнка!"
10025-100250270 = "Сенсей, раньше вы что-то убирали перед Садом цветущей сливы..."
10025-100250280 = "Там было что-то странное?"
10025-100250290 = "Кто-то сделал что-то вроде палатки из старой простыни и стульев."
10025-100250300 = "Похоже, младшие студенты снова построили тайную базу."
10025-100250310 = "Тайную базу?"
10025-100250320 = "Да. Каждый ребёнок хочет иметь своё собственное место."
10025-100250330 = "Иногда они строят небольшие убежища в укромных местах."
10025-100250340 = "Вы делали что-нибудь такое в детстве?"
10025-100250350 = "Конечно. У меня была потрясающая тайная база."
10025-100250360 = "Хи-хи. Кстати, я давно там не была."
10025-100250370 = "Сенсей, если сегодня днём у вас есть время, приходите на площадку возле Сада цветущей сливы."
10025-100250380 = "Я расскажу вам секрет, который никому ещё не рассказывала. ♥"
10025-100250390 = "Самая большая разница между мной в детстве и сейчас"
10025-100250400 = "похоже, в причёске."
10025-100250410 = "Почему ты так думаешь?"
10025-100250420 = "В детстве мне казалось, что я могу носить любую причёску."
10025-100250430 = "Но чем старше становилась, тем меньше оставалось вариантов."
10025-100250440 = "Думаю, тебе идёт любая причёска, Шун."
10025-100250450 = "Хи-хи-хи. Очень приятно это слышать, Сенсей."
