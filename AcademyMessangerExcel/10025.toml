[translation]
10025-100250010 = "Сенсей, похоже, у меня опять проявились побочные эффекты..."
10025-100250020 = "В этом облике взгляд ниже, и руки-ноги легче, как-то странно."
10025-100250030 = "Лучше тебе не выходить на улицу, пока не подействует антидот."
10025-100250040 = "...Нет, я не могу упустить этот момент. Сенсей, пойдёмте есть сладости!"
10025-100250050 = "Когда я стала ребёнком, я захотела попробовать кое-что!"
10025-100250060 = "...?"
10025-100250070 = "Как же так, оказывается, вместе с телом изменились и вкусовые ощущения..."
10025-100250080 = "В таком виде я не могу говорить детям из Сада цветущей сливы, что «нельзя привередничать»."
10025-100250090 = "Мне нужно понемногу пробовать разную еду и преодолевать свои слабости."
10025-100250100 = "Для начала по порядку, ром в ром-изюме..."
10025-100250110 = "Это нельзя!"
10025-100250120 = "...Сенсей, вы сейчас заняты?"
10025-100250130 = "Что случилось?"
10025-100250140 = "Ну, я убиралась в Саду цветущей сливы и случился небольшой инцидент..."
10025-100250150 = "Сейчас я в положении, когда не могу двигаться..."
10025-100250160 = "Жди, я сейчас приду."
10025-100250170 = "Сенсей, вы слышали?"
10025-100250180 = "Говорят, в центральном районе Кивотоса открывается большой крытый парк развлечений — «Плейленд»!"
10025-100250190 = "Все дети из Сада цветущей сливы хотят туда пойти, так что я собираюсь сначала проверить безопасность и всё такое."
10025-100250200 = "Если хотите, не сходите со мной в эти выходные?"
10025-100250210 = "Да, если я гожусь, с удовольствием."
10025-100250220 = "Но, Шун, ты уверена, что в таком теле можно выходить?"
10025-100250230 = "Да, всё в порядке!"
10025-100250240 = "Более того, сейчас самое подходящее время."
10025-100250250 = "Такой возможности взглянуть на всё с детской точки зрения редко выпадает!"
10025-100250260 = "Сенсей, вы случайно не убирали что-то перед Садом цветущей сливы...?"
10025-100250270 = "Там было что-то странное?"
10025-100250280 = "Кто-то соорудил что-то вроде палатки из ткани и стульев, я подумала, что опасно, и немного отодвинула."
10025-100250290 = "Ах, наверное, это был секретный штаб."
10025-100250300 = "Секретный штаб?"
10025-100250310 = "Да. Дети ведь хотят иметь своё личное пространство, правда?"
10025-100250320 = "Иногда они тайком от нас устраивают такие укрытия."
10025-100250330 = "Понятно. А ты, Шун, тоже делала такое в детстве?"
10025-100250340 = "Да, примерно в том же возрасте."
10025-100250350 = "Кстати, последний раз я была в том штабе уже давно..."
10025-100250360 = "Сенсей, если у вас есть время, не зайдёте ли в Саду цветущей сливы?"
10025-100250370 = "...Если хотите узнать мои секреты, конечно ♡"
10025-100250380 = "Одно из больших отличий меня в детстве и сейчас —"
10025-100250390 = "это причёска."
10025-100250400 = "Почему ты так думаешь?"
10025-100250410 = "В детстве можно делать любую причёску,"
10025-100250420 = "но когда вырастаешь... многое уже не идёт."
10025-100250430 = "Я думаю, Шун идёт любая причёска."
10025-100250440 = "Хе-хе. Мне приятно уже от одних слов. Спасибо, Сенсей."
10025-100250450 = "えへへ。お言葉だけでも嬉しいです。ありがとうございます、先生"
