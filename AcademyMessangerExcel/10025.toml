[translation]
10025-100250010 = "Sensei, na verdade, parece que o efeito colateral apareceu de novo..."
10025-100250020 = "Nessa forma, meu campo de visão fica mesmo bem mais baixo,"
10025-100250030 = "meus braços e pernas ficam leves, e tudo parece meio estranho."
10025-100250040 = "Talvez seja melhor evitar sair muito até o antídoto fazer efeito."
10025-100250050 = "...Não, não posso deixar essa oportunidade passar. Sensei, vamos comer doces!"
10025-100250060 = "Tem uma coisa que eu queria muito experimentar se voltasse a ser criança!"
10025-100250070 = "...?"
10025-100250080 = "Quem diria que, junto com o corpo encolhendo, até o meu paladar mudaria..."
10025-100250090 = "Desse jeito, não vou ter moral para dizer às crianças do Jardim da Flor de Ameixeira que \"não pode ter frescura para comer\"."
10025-100250100 = "Preciso comer um pouquinho de cada coisa para superar o que não gosto também."
10025-100250110 = "Primeiro, por partes, começando pelo rum do sorvete de passas ao rum..."
10025-100250120 = "Isso não pode!"
10025-100250130 = "...Sensei. Você está ocupado agora?"
10025-100250140 = "O que houve?"
10025-100250150 = "É que eu estava arrumando várias coisas no Jardim da Flor de Ameixeira e, digamos que aconteceu um pequeno acidente..."
10025-100250160 = "E agora estou numa situação em que não consigo me mexer..."
10025-100250170 = "Espera aí, já estou indo."
10025-100250180 = "Sensei, você ficou sabendo?"
10025-100250190 = "Parece que vão inaugurar um grande parque coberto chamado \"Playland\" no Distrito Central de Kivotos!"
10025-100250200 = "Como todas as crianças do Jardim da Flor de Ameixeira estão dizendo que querem ir, pensei em dar uma passada lá antes para verificar a segurança e tudo mais."
10025-100250210 = "Se não se importar, gostaria de ir comigo neste fim de semana?"
10025-100250220 = "Claro, se a minha companhia servir, vou com prazer."
10025-100250230 = "Ah, mas tudo bem você sair na rua com esse corpo atual, Shun?"
10025-100250240 = "Sim, sem problemas!"
10025-100250250 = "Aliás, na verdade este é o momento perfeito."
10025-100250260 = "Afinal, raramente tenho a oportunidade de conferir tudo do ponto de vista das crianças!"
10025-100250270 = "Sensei. Agora há pouco, em frente ao Jardim da Flor de Ameixeira, você não estava desmontando alguma coisa...?"
10025-100250280 = "Tinha alguma coisa estranha lá?"
10025-100250290 = "Tinham feito tipo uma barraca com panos e cadeiras, e achei meio perigoso. Aí só afastei um pouquinho pro lado."
10025-100250300 = "Ah, com certeza era uma base secreta."
10025-100250310 = "Base secreta?"
10025-100250320 = "Sim. Sabe como as crianças sempre querem ter um cantinho só delas?"
10025-100250330 = "De vez em quando, elas aproveitam quando não estamos olhando para montar esses espaços secretos."
10025-100250340 = "Entendi. Você também costumava fazer isso quando era criança, Shun?"
10025-100250350 = "Sim, justamente quando eu tinha mais ou menos essa idade."
10025-100250360 = "Pensando bem, já faz bastante tempo desde a última vez que fui àquela base secreta..."
10025-100250370 = "Sensei. Se tiver um tempinho, poderia vir ao Jardim da Flor de Ameixeira agora?"
10025-100250380 = "...Isso se você quiser saber o meu segredo, é claro♡"
10025-100250390 = "Uma das grandes diferenças entre quando somos pequenos e agora"
10025-100250400 = "eu acho que é o penteado."
10025-100250410 = "Por que acha isso?"
10025-100250420 = "Quando somos pequenos, podemos usar qualquer tipo de penteado,"
10025-100250430 = "mas depois que crescemos... muitos acabam não combinando mais."
10025-100250440 = "Eu acho que qualquer penteado fica ótimo em você, Shun."
10025-100250450 = "Ehehe. Só de ouvir isso já fico feliz. Obrigada, Sensei."
