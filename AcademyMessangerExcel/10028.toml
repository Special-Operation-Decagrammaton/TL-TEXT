[translation]
10028-100280010 = "Mestreee! O que tá fazendo agora? Dormindo? Deve tá dormindo, né~"
10028-100280020 = "Afinal, olha só a hora."
10028-100280030 = "Ainda estou acordado, o que houve?"
10028-100280040 = "Acordada até uma hora dessas, hein, Asuna?"
10028-100280050 = "Oh!"
10028-100280060 = "Que surpresa! Você tá acordado!"
10028-100280070 = "Eu tinha umas coisinhas pra resolver agora,"
10028-100280080 = "aí tô aqui numa lavanderia 24 horas."
10028-100280090 = "Ah, não é trabalho nem nada, viu? Só fiquei aqui de bobeira esperando e resolvi mandar mensagem."
10028-100280100 = "Nem é trabalho e você está acordada até uma hora dessas...?"
10028-100280110 = "O caminho de volta é tranquilo? Tem alguém com você?"
10028-100280120 = "Ahaha!"
10028-100280130 = "Obrigada por se preocupar, mas tá tudo tranquilo!"
10028-100280140 = "Bom, tenha uma boa noite!"
10028-100280150 = "Mestreee~"
10028-100280160 = "Mestre, por acaso você entende bastante de coelhos?"
10028-100280170 = "Pensei que talvez você soubesse."
10028-100280180 = "Coelhos?"
10028-100280190 = "Uhum!"
10028-100280200 = "Eu pesquisei várias coisas, mas parece que ainda não entrou direito na minha cabeça, sabe?"
10028-100280210 = "Huum..."
10028-100280220 = "Já que é assim, o jeito vai ser..."
10028-100280230 = "...?"
10028-100280240 = "Decidi!"
10028-100280250 = "Vou testar na prática pra ter certeza!"
10028-100280260 = "Mestreee?"
10028-100280270 = "Pra onde você foooi?"
10028-100280280 = "Por acaso a gente tá brincando de esconde-esconde?"
10028-100280290 = "Hehe, se for isso, pode deixar comigo!"
10028-100280300 = "Porque a Asuna não desiste!"
10028-100280310 = "Eu agradeceria se você desistisse..."
10028-100280320 = "Fazer cafuné em você vestida assim é meio..."
10028-100280330 = "Quêê?"
10028-100280340 = "Huum..."
10028-100280350 = "Nem vem♪ Não vou desistir!"
10028-100280360 = "Mestreee~"
10028-100280370 = "Onde você tá agora?"
10028-100280380 = "Outro dia eu tava conversando com as meninas e me disseram: \"Uma roupa de coelhinha e um coelho de verdade não são coisas bem diferentes?\""
10028-100280390 = "Foi por isso que você fugiu de mim outro dia, Mestre?"
10028-100280400 = "É isso mesmo?"
10028-100280410 = "É mais ou menos por aí..."
10028-100280420 = "Entendi!"
10028-100280430 = "Então tem uma outra coisa que eu quero te perguntar."
10028-100280440 = "Mais tarde eu passo aí pra te ver, Mestre!"
10028-100280450 = "Ah, lembrei que esqueci de perguntar!"
10028-100280460 = "E você, Mestre? Tá feliz? Tá se divertindo?"
10028-100280470 = "Vai me responder, né?"
10028-100280480 = "Estar com você é sempre divertido, Asuna."
10028-100280490 = "E se você também estiver se divertindo, isso é o que me deixa mais feliz."
10028-100280500 = "..."
10028-100280510 = "!!"
10028-100280520 = "Acho que entendi."
10028-100280530 = "Sim! Agora faz sentido!"
10028-100280540 = "Brigadão, Mestre! Vou continuar te divertindo muuuuito daqui pra frente, viu?"
10028-100280550 = "Mestreee!!"
10028-100280560 = "Tá muito ocupado hoje?"
10028-100280570 = "Tranquilo, estou livre."
10028-100280580 = "Aconteceu alguma coisa?"
10028-100280590 = "Ebaaa!!"
10028-100280600 = "Então tá combinado!"
10028-100280610 = "Os detalhes eu explico depois!"
10028-100280620 = "Tô te esperando!"
10028-100280630 = "???"
10028-100280640 = "Asuna?"
10028-100280650 = "Mestre!"
10028-100280660 = "Hoje também foi super divertido!"
10028-100280670 = "Toda vez que eu encontro você, Mestre, é uma alegria só."
10028-100280680 = "Quer dizer, meu coração dispara tanto que até dói às vezes... mas acho que já tá na hora de eu me acostumar."
10028-100280690 = "Fico feliz que você tenha se divertido, Asuna."
10028-100280700 = "Ahaha!!"
10028-100280710 = "Então, pra ajudar nisso também,"
10028-100280720 = "a partir de agora a Asuna vai vir te ver todo dia, tá bom, Mestre?"
10028-100280730 = "Isso, decidido!"
10028-100280740 = "Porque aí todos os dias vão ser super divertidos!"
10028-100280750 = "Vai continuar brincando com a Asuna daqui pra frente, né?"
10028-100280760 = "Então até amanhã, Mestre!!"
