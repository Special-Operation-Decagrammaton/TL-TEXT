[translation]
10028-100280010 = "Хозяин~! Что вы сейчас делаете? Спите? Спите~?"
10028-100280020 = "Уже так поздно."
10028-100280030 = "Я ещё не сплю, что случилось?"
10028-100280040 = "Асуна, ты не спишь в такое время."
10028-100280050 = "О."
10028-100280060 = "Сюрприз! Вы не спали!"
10028-100280070 = "У меня сейчас есть кое-какие дела."
10028-100280080 = "Сейчас я в круглосуточной прачечной."
10028-100280090 = "А, это не работа. Просто мне стало скучно, вот я и написала."
10028-100280100 = "Даже если не работа, ты всё равно не спишь в такое время...?"
10028-100280110 = "Тебе не страшно возвращаться одной? Кто-нибудь есть рядом?"
10028-100280120 = "Аха-ха!"
10028-100280130 = "Спасибо, что беспокоитесь, но всё в порядке!"
10028-100280140 = "Тогда спокойной ночи!"
10028-100280150 = "Хозяин~."
10028-100280160 = "А вы, хозяин, разбираетесь в кроликах?"
10028-100280170 = "Я подумала, может, вы знаете."
10028-100280180 = "Кролики?"
10028-100280190 = "Да!"
10028-100280200 = "Я много чего искала, но что-то не складывается."
10028-100280210 = "Хм-м..."
10028-100280220 = "В таком случае, наверное..."
10028-100280230 = "...?"
10028-100280240 = "Решено!"
10028-100280250 = "Лучше просто проверить на практике!"
10028-100280260 = "Хозяин~?"
10028-100280270 = "Куда вы пропали~?"
10028-100280280 = "Может, это игра в прятки?"
10028-100280290 = "Хе-хе, если так, тогда я готова."
10028-100280300 = "Асуна не сдаётся!"
10028-100280310 = "Было бы лучше, если бы вы сдались..."
10028-100280320 = "В таком виде гладить немного..."
10028-100280330 = "Эй~?"
10028-100280340 = "Хм-м..."
10028-100280350 = "Не-ет~ Не сдамся!"
10028-100280360 = "Хозяин~."
10028-100280370 = "Где вы сейчас?"
10028-100280380 = "На днях мы говорили с ребятами, и мне сказали: «Образ зайчика и кролика — это же разное, разве нет?»."
10028-100280390 = "Так что в прошлый раз вы сбежали?"
10028-100280400 = "Вот как?"
10028-100280410 = "Наверное, примерно так..."
10028-100280420 = "Понятно!"
10028-100280430 = "Тогда я хочу спросить кое-что ещё."
10028-100280440 = "Я скоро приду к вам, хозяин!"
10028-100280450 = "Ах, кстати, я забыла спросить!"
10028-100280460 = "А вы, хозяин, рады? Вам весело?"
10028-100280470 = "Вы ведь ответите?"
10028-100280480 = "Мне всегда весело с тобой, Асуна."
10028-100280490 = "Если тебе тоже весело, я буду рад."
10028-100280500 = "..."
10028-100280510 = "!!"
10028-100280520 = "Кажется, поняла."
10028-100280530 = "Да! Вот оно что!"
10028-100280540 = "Спасибо, хозяин~! Я буду делать так, чтобы вам было весело-весело!"
10028-100280550 = "Хозяин~!!"
10028-100280560 = "Вы сегодня заняты?"
10028-100280570 = "Совсем нет."
10028-100280580 = "Что-то случилось?"
10028-100280590 = "Ура!!"
10028-100280600 = "Тогда решено!"
10028-100280610 = "Подробности позже."
10028-100280620 = "Я буду ждать!"
10028-100280630 = "???"
10028-100280640 = "Асуна?"
10028-100280650 = "Хозяин!"
10028-100280660 = "Сегодня было так весело!"
10028-100280670 = "Когда я вижусь с хозяином, каждый раз действительно весело."
10028-100280680 = "Иногда сердце болит... но, наверное, пора привыкать."
10028-100280690 = "Хорошо, что тебе было весело."
10028-100280700 = "Аха-ха!!"
10028-100280710 = "Тогда ради этого"
10028-100280720 = "я буду приходить к вам каждый день, хозяин?"
10028-100280730 = "Да, решено!"
10028-100280740 = "Тогда каждый день должен быть весёлым!"
10028-100280750 = "Вы ведь будете играть со мной и дальше?"
10028-100280760 = "Тогда до завтра, хозяин!!"
