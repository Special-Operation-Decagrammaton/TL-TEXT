[translation]
10030-100300010 = "Здравствуйте, Сенсей."
10030-100300020 = "Вчера, когда я уходила после дежурства, в Шале ещё горел свет..."
10030-100300030 = "И я слышала, что в прошлые выходные вы задерживались допоздна..."
10030-100300040 = "Вы нормально отдыхаете?"
10030-100300050 = "В последнее время не очень..."
10030-100300060 = "Это плохо, отдых — такая же важная часть обязанностей."
10030-100300070 = "Как ответственная за медицинское обеспечение в дисциплинарном комитете Геенны, я не могу это игнорировать."
10030-100300080 = "В последнее время вас что-то беспокоит?"
10030-100300090 = "Кажется, последнее время глаза устают..."
10030-100300100 = "Кажется, плечи затекают..."
10030-100300110 = "Понятно... типичные симптомы хронической усталости."
10030-100300120 = "Кстати, в академии Геенны много горячих источников, которые помогают восстановить силы."
10030-100300130 = "Когда у вас будет время, почему бы не посетить горячие источники Геенны?"
10030-100300140 = "Правда? Звучит неплохо."
10030-100300150 = "Как-нибудь зайду."
10030-100300160 = "Да, обязательно."
10030-100300170 = "Надеюсь, это хоть немного снимет вашу усталость."
10030-100300180 = "~Чинацу~"
10030-100300190 = "Сенсей, с возвращением."
10030-100300200 = "После посещения горячего источника не возникло никаких неудобств?"
10030-100300210 = "Нет, всё в порядке."
10030-100300220 = "Благодаря тому, что вы позаботились, всё прошло отлично."
10030-100300230 = "Это хорошо."
10030-100300240 = "Теперь по существу... можно ли мне сейчас зайти к вам?"
10030-100300250 = "Нет, в смысле, не подумайте ничего такого...!"
10030-100300260 = "Я нашла чай, полезный при усталости, и подумала, не выпить ли нам его вместе."
10030-100300270 = "Что скажете?"
10030-100300280 = "Конечно. Спасибо, буду ждать."
10030-100300290 = "Нет, что вы, это я благодарна."
10030-100300300 = "Тогда я скоро приду."
10030-100300310 = "~Чинацу~"
10030-100300320 = "Здравствуйте, Сенсей."
10030-100300330 = "Если вам не трудно, не могли бы вы уделить мне время сегодня после обеда?"
10030-100300340 = "Дело в том, что мне нужна ваша помощь..."
10030-100300350 = "Да, конечно."
10030-100300360 = "Если просите вы, Чинацу, я готов на всё!"
10030-100300370 = "Огромное спасибо."
10030-100300380 = "Тогда я буду ждать вас у магазина сувениров."
10030-100300390 = "Буду рассчитывать на вас."
10030-100300400 = "~Чинацу~"
10030-100300410 = "Сенсей, здравствуйте."
10030-100300420 = "Спасибо за вашу помощь с выбором сувениров в прошлый раз."
10030-100300430 = "И вы даже сделали мне подарок..."
10030-100300440 = "Возможно, это звучит странно — отплатить за отплату, но..."
10030-100300450 = "Я тоже хочу отблагодарить вас и забронировала одну гостиницу."
10030-100300460 = "Это довольно хорошее место, там отличная кухня и прекрасные удобства, так что, уверена, вам понравится."
10030-100300470 = "Тогда я буду ждать вас."
10030-100300480 = "~Чинацу~"
