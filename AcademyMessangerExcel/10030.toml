[translation]
10030-100300010 = "Здравствуйте, Сенсей."
10030-100300020 = "Вчера по дороге домой после дежурства я заметила, что свет в офисе Шале горел допоздна."
10030-100300030 = "Я слышала, что в прошлые выходные вы тоже перерабатывали."
10030-100300040 = "Вы достаточно отдыхаете?"
10030-100300050 = "У меня слишком много работы, ничего не поделаешь."
10030-100300060 = "Так не пойдёт. Отдых — тоже часть работы."
10030-100300070 = "Как глава Медицинского Комитета Команды Префектов Геенны, я не могу спокойно смотреть, как ухудшается ваше здоровье."
10030-100300080 = "В последнее время вас что-нибудь особенно беспокоит?"
10030-100300090 = "Часто устают глаза."
10030-100300100 = "Часто затекают плечи."
10030-100300110 = "У вас классические симптомы хронической усталости."
10030-100300120 = "Кстати, в Академии Геенна много горячих источников, которые помогают снять усталость."
10030-100300130 = "Как насчёт приехать в Академию Геенна и отдохнуть в горячих источниках, когда будет время?"
10030-100300140 = "Хорошая идея."
10030-100300150 = "Загляну, когда будет время."
10030-100300160 = "Да."
10030-100300170 = "Тогда буду ждать дня, когда вы посетите нашу академию."
10030-100300180 = "— Чинацу"
10030-100300190 = "Здравствуйте, Сенсей. Это Чинацу."
10030-100300200 = "Вам ничего не мешает во время отдыха на горячих источниках?"
10030-100300210 = "Нет, совсем нет."
10030-100300220 = "Всё благодаря тебе, Чинацу."
10030-100300230 = "Рада это слышать."
10030-100300240 = "Если вы не против, могу я сейчас зайти к вам в комнату?"
10030-100300250 = "Разумеется, не по какой-нибудь странной причине!"
10030-100300260 = "Просто я купила несколько сортов чая, которые хорошо снимают усталость..."
10030-100300270 = "и подумала, не хотите ли вы выпить чашку вместе."
10030-100300280 = "Конечно."
10030-100300290 = "Да."
10030-100300300 = "Тогда скоро увидимся."
10030-100300310 = "— Чинацу"
10030-100300320 = "Здравствуйте, Сенсей."
10030-100300330 = "Если вы не против, можете уделить мне немного времени после обеда?"
10030-100300340 = "Мне нужна ваша помощь с одним делом, Сенсей."
10030-100300350 = "Да, конечно."
10030-100300360 = "Для тебя что угодно, Чинацу!"
10030-100300370 = "Спасибо."
10030-100300380 = "Тогда я буду ждать вас в сувенирном магазине у входа на курорт с горячими источниками."
10030-100300390 = "Увидимся после обеда."
10030-100300400 = "— Чинацу"
10030-100300410 = "Здравствуйте, Сенсей. Это Чинацу."
10030-100300420 = "В прошлый раз вы помогли мне выбрать благодарственные подарки для моих товарищей."
10030-100300430 = "И ещё сами подарили мне много подарков."
10030-100300440 = "Мне кажется неправильным только принимать, никак не отвечая на вашу доброту."
10030-100300450 = "Я забронировала номер в роскошном рёкане неподалёку."
10030-100300460 = "Этот рёкан славится прекрасной едой и удобствами, так что уверена, вам понравится, Сенсей."
10030-100300470 = "Тогда буду ждать вас."
10030-100300480 = "— Чинацу"
