[translation]
10030-100300010 = "Olá, Sensei."
10030-100300020 = "Ontem, quando terminei meu plantão e estava voltando para casa, vi que as luzes da Schale ainda estavam acesas..."
10030-100300030 = "Também ouvi dizer que você fez hora extra até tarde no último fim de semana..."
10030-100300040 = "Você tem descansado direitinho?"
10030-100300050 = "Ultimamente tem sido meio difícil..."
10030-100300060 = "Isso não é nada bom. O descanso também é uma parte legítima do seu dever."
10030-100300070 = "Como encarregada médica do Comitê Disciplinar de Gehenna, não posso fazer vista grossa para isso."
10030-100300080 = "Tem sentido algum incômodo no corpo ultimamente?"
10030-100300090 = "Acho que meus olhos têm ficado meio cansados ultimamente..."
10030-100300100 = "Meus ombros têm ficado bem tensos ultimamente..."
10030-100300110 = "Entendo... São sintomas típicos de fadiga crônica."
10030-100300120 = "Falando nisso, na Academia Gehenna há várias fontes termais que são ótimas para recuperar o cansaço."
10030-100300130 = "Quando tiver um tempinho, que tal experimentar as fontes termais de Gehenna?"
10030-100300140 = "Sério? Parece uma ótima ideia."
10030-100300150 = "Vou dar uma passada lá quando tiver um tempo."
10030-100300160 = "Sim, vá mesmo, por favor."
10030-100300170 = "Espero que isso ajude a aliviar pelo menos um pouco do seu cansaço, Sensei."
10030-100300180 = "~Chinatsu~"
10030-100300190 = "Bom trabalho hoje, Sensei."
10030-100300200 = "Deu tudo certo no banho de fonte termal? Teve algum inconveniente?"
10030-100300210 = "Deu tudo certo sim."
10030-100300220 = "Foi perfeito graças a toda a sua atenção, Chinatsu."
10030-100300230 = "Fico muito feliz em ouvir isso."
10030-100300240 = "Bem, indo ao assunto principal... Eu poderia dar uma passada aí onde você está agora?"
10030-100300250 = "D-digo, claro que não com alguma intenção estranha...!"
10030-100300260 = "É que consegui um chá ótimo contra o cansaço e pensei que poderíamos tomá-lo juntos, se você quiser."
10030-100300270 = "Hum... O que acha?"
10030-100300280 = "Claro. Obrigado, vou estar esperando."
10030-100300290 = "Imagina, eu é que agradeço."
10030-100300300 = "Então já estou indo aí."
10030-100300310 = "~Chinatsu~"
10030-100300320 = "Olá, Sensei."
10030-100300330 = "Hum, se não for incomodar, você teria um tempinho livre hoje à tarde?"
10030-100300340 = "Na verdade, tem uma coisa em que eu gostaria de pedir a sua ajuda, Sensei..."
10030-100300350 = "Claro, deixa comigo."
10030-100300360 = "Se é um pedido da Chinatsu, ajudo quantas vezes precisar!"
10030-100300370 = "M-muito obrigada."
10030-100300380 = "Então estarei te esperando em frente à loja de lembrancinhas."
10030-100300390 = "Desde já, muito obrigada."
10030-100300400 = "~Chinatsu~"
10030-100300410 = "Olá, Sensei."
10030-100300420 = "Muito obrigada por me ajudar a escolher as lembrancinhas outro dia."
10030-100300430 = "E ainda por cima ganhei um presente seu..."
10030-100300440 = "Hum, talvez pareça estranho retribuir algo que já era uma retribuição, mas..."
10030-100300450 = "Como eu queria agradecer de alguma forma, fiz uma reserva em uma pousada tradicional."
10030-100300460 = "É um lugar muito bom, famoso pela comida excelente e pelas ótimas instalações, então tenho certeza de que você vai gostar."
10030-100300470 = "Bem, estarei te esperando lá."
10030-100300480 = "~Chinatsu~"
