[translation]
10077-100770010 = "Сенсей, здравствуйте."
10077-100770020 = "Я слышала, вы скоро приедете в Тринити."
10077-100770030 = "По какой-то причине"
10077-100770040 = "в этот раз мне поручили помогать вам."
10077-100770050 = "Так что буду рассчитывать на вас."
10077-100770060 = "Здравствуйте, Ичика."
10077-100770070 = "Буду рада!"
10077-100770080 = "Да!"
10077-100770090 = "Тогда до встречи."
10077-100770100 = "Сенсей, вы добрались?"
10077-100770110 = "Да, спасибо."
10077-100770120 = "Спасибо, Ичика."
10077-100770130 = "Это было легко."
10077-100770140 = "Ну,"
10077-100770150 = "я уже собираюсь спать,"
10077-100770160 = "спокойной ночи."
10077-100770170 = "Хм-м."
10077-100770180 = "Что же делать..."
10077-100770190 = "Сенсей,"
10077-100770200 = "чем вы занимаетесь, когда нет работы?"
10077-100770210 = "Наверное, сплю как убитый..."
10077-100770220 = "Читаю мангу или играю в игры."
10077-100770230 = "А-а."
10077-100770240 = "Понятно."
10077-100770250 = "Вот оно что."
10077-100770260 = "Ну, было весело."
10077-100770270 = "Сегодня был очень насыщенный день."
10077-100770280 = "Ты всё ещё играешь на гитаре?"
10077-100770290 = "Тебе стало интересно играть?"
10077-100770300 = "А?"
10077-100770310 = "Ах, нет."
10077-100770320 = "Я пробовала дома несколько раз,"
10077-100770330 = "но как-то не пошло."
10077-100770340 = "Просто убрала в шкаф."
10077-100770350 = "Аха-ха."
10077-100770360 = "Сенсей."
10077-100770370 = "У вас есть время сейчас?"
10077-100770380 = "А? Что случилось?"
10077-100770390 = "Я как раз был свободен."
10077-100770400 = "Ну, э-то..."
10077-100770410 = "Да просто так."
10077-100770420 = "Мне стало немного скучно."
10077-100770430 = "До следующей встречи ещё много времени."
10077-100770440 = "А заняться нечем."
10077-100770450 = "Сенсей."
10077-100770460 = "Что вы сейчас делаете?"
10077-100770470 = "А-а."
10077-100770480 = "Ничего особенного, просто..."
10077-100770490 = "Я закончил работу и отдыхаю."
10077-100770500 = "Давайте встретимся в парке."
10077-100770510 = "О."
10077-100770520 = "Звучит хорошо."
10077-100770530 = "Тогда до встречи!"
10077-100770540 = "Фу-ух."
10077-100770550 = "Сегодня было весело благодаря вам, Сенсей."
10077-100770560 = "Спасибо вам большое."
10077-100770570 = "Я хочу прийти ещё!"
10077-100770580 = "Вы ведь сами сказали, что это хорошая идея!"
10077-100770590 = "Конечно, я всегда готов составить компанию."
10077-100770600 = "Надеюсь, ты найдёшь то, что увлечёт тебя."
10077-100770610 = "Да!"
10077-100770620 = "...Хм-м."
10077-100770630 = "Но..."
10077-100770640 = "..."
10077-100770650 = "Пока что ещё"
10077-100770660 = "сейчас самое лучшее время, так что всё в порядке!"
10077-100770670 = "Ха-ха."
