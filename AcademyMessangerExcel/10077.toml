[translation]
10077-100770010 = "Ходят слухи,"
10077-100770020 = "что ты сегодня приезжаешь в Тринити."
10077-100770030 = "Ха-ха."
10077-100770040 = "Хочешь верь, хочешь нет,"
10077-100770050 = "в этот раз меня назначили тебе помогать."
10077-100770060 = "Привет, Ичика."
10077-100770070 = "Давай постараемся!"
10077-100770080 = "Да!"
10077-100770090 = "Увидимся там!"
10077-100770100 = "Сенсей! Ты нормально вернулся?"
10077-100770110 = "Да."
10077-100770120 = "Благодаря тебе."
10077-100770130 = "Пустяки. Ха-ха."
10077-100770140 = "Теперь, когда я убедилась, что ты благополучно вернулся,"
10077-100770150 = "я тоже пойду спать."
10077-100770160 = "Спокойной ночи!"
10077-100770170 = "А..."
10077-100770180 = "Что делать?"
10077-100770190 = "Сенсей..."
10077-100770200 = "Что ты делаешь, когда работы нет?"
10077-100770210 = "Сплю как убитый."
10077-100770220 = "Играю... или занимаюсь другими хобби. А почему спрашиваешь?"
10077-100770230 = "Мм."
10077-100770240 = "Понятно."
10077-100770250 = "Да. Ха-ха..."
10077-100770260 = "Ого, было весело."
10077-100770270 = "Сегодня я многое получила. Во многих смыслах."
10077-100770280 = "Будешь продолжать играть на гитаре?"
10077-100770290 = "Играть было весело, да?"
10077-100770300 = "А?"
10077-100770310 = "А-а-а..."
10077-100770320 = "Нет."
10077-100770330 = "Я несколько раз пыталась играть дома, но никак не могу втянуться."
10077-100770340 = "Теперь гитара стоит в углу моей комнаты."
10077-100770350 = "Ха-ха."
10077-100770360 = "Сенсей."
10077-100770370 = "Ты сейчас свободен?"
10077-100770380 = "Более-менее. Что случилось?"
10077-100770390 = "Я просто отдыхал."
10077-100770400 = "А..."
10077-100770410 = "Ничего."
10077-100770420 = "Мне ужасно скучно."
10077-100770430 = "Я жду других людей, и мне нечего делать."
10077-100770440 = "Ха-ха."
10077-100770450 = "Сенсей."
10077-100770460 = "У тебя сейчас есть время?"
10077-100770470 = "О..."
10077-100770480 = "Не переживай. Ничего плохого не случилось."
10077-100770490 = "Время есть. Я приду к тебе."
10077-100770500 = "Может, встретимся в парке?"
10077-100770510 = "О!"
10077-100770520 = "Было бы здорово."
10077-100770530 = "Увидимся там."
10077-100770540 = "Мм."
10077-100770550 = "Благодаря тебе сегодня было очень весело."
10077-100770560 = "Спасибо, Сенсей."
10077-100770570 = "Обязательно буду писать, когда понадобится помощь."
10077-100770580 = "Ты ведь сам просил."
10077-100770590 = "Хорошо. И помни: доверяй своему сердцу."
10077-100770600 = "Это всё, что нужно делать, ладно?"
10077-100770610 = "Да!"
10077-100770620 = "Мм..."
10077-100770630 = "Хотя..."
10077-100770640 = "Пока что..."
10077-100770650 = "Ха-ха."
10077-100770660 = "не уверена, что найду что-нибудь,"
10077-100770670 = "что будет говорить со мной сильнее, чем это."
