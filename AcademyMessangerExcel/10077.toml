[translation]
10077-100770010 = "Olá, Sensei."
10077-100770020 = "Ouvi dizer que você vem para a Trinity em breve."
10077-100770030 = "E, não sei bem como,"
10077-100770040 = "parece que desta vez eu fui escalada para te ajudar."
10077-100770050 = "Então é isso, conto com você!"
10077-100770060 = "Olá, Ichika."
10077-100770070 = "Eu que conto com a sua ajuda!"
10077-100770080 = "Pode deixar!"
10077-100770090 = "Até mais tarde, então."
10077-100770100 = "Sensei, já chegou em casa?"
10077-100770110 = "Sim, cheguei bem graças a você."
10077-100770120 = "Obrigado, Ichika."
10077-100770130 = "Imagina, isso não foi nada."
10077-100770140 = "Bom,"
10077-100770150 = "eu já vou indo dormir também."
10077-100770160 = "Boa noiteee~"
10077-100770170 = "Huum..."
10077-100770180 = "O que será que eu faço, hein..."
10077-100770190 = "Ei, Sensei,"
10077-100770200 = "o que você costuma fazer quando está sem trabalho?"
10077-100770210 = "Acho que durmo feito uma pedra..."
10077-100770220 = "Fico lendo mangá ou jogando videogame."
10077-100770230 = "Aaah..."
10077-100770240 = "Saquei."
10077-100770250 = "Então é mais ou menos nessa linha, né?"
10077-100770260 = "Cara, como foi divertido!"
10077-100770270 = "O dia de hoje rendeu demais, né?"
10077-100770280 = "Você ainda toca violão?"
10077-100770290 = "Deu vontade de voltar a tocar algum instrumento?"
10077-100770300 = "Hã?"
10077-100770310 = "Ah, não..."
10077-100770320 = "Eu até tentei tocar algumas vezes em casa, mas"
10077-100770330 = "não me empolguei muito"
10077-100770340 = "e acabei guardando no fundo do armário, sabe?"
10077-100770350 = "Ahaha."
10077-100770360 = "Sensei."
10077-100770370 = "Você tem um tempinho agora?"
10077-100770380 = "Sim? O que houve?"
10077-100770390 = "Estava à toa agora mesmo."
10077-100770400 = "Ah, hum..."
10077-100770410 = "Não, foi só por perguntar mesmo."
10077-100770420 = "Bateu um tédio aqui..."
10077-100770430 = "Ainda falta um bom tempo para o meu próximo compromisso,"
10077-100770440 = "e percebi que não tenho nada para fazer até lá."
10077-100770450 = "Sensei."
10077-100770460 = "O que está fazendo agora?"
10077-100770470 = "Opa, quer dizer,"
10077-100770480 = "não é que eu tenha algum assunto urgente nem nada, mas..."
10077-100770490 = "Acabei de terminar o trabalho e estava descansando um pouco."
10077-100770500 = "Que tal nos encontrarmos no parque?"
10077-100770510 = "Opa!"
10077-100770520 = "Boa ideia."
10077-100770530 = "Então até daqui a pouco!"
10077-100770540 = "Ufa..."
10077-100770550 = "Hoje foi muito divertido graças a você, Sensei."
10077-100770560 = "Muito obrigada mesmo, Sensei."
10077-100770570 = "Quero muito sair para passear assim de novo!"
10077-100770580 = "Até porque foi você mesmo que disse que isso me faria bem, viu?!"
10077-100770590 = "Claro, faço companhia para você quando quiser."
10077-100770600 = "Tomara que você encontre um hobby que te apaixone logo."
10077-100770610 = "Sim!"
10077-100770620 = "...Huum~"
10077-100770630 = "Mas..."
10077-100770640 = "..."
10077-100770650 = "Por um bom tempo ainda,"
10077-100770660 = "do jeito que está agora já está bom demais, então não tenho pressa!"
10077-100770670 = "Haha."
