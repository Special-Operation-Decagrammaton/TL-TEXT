[translation]
10101-101010010 = "Sensei."
10101-101010020 = "Está aproveitando o festival?"
10101-101010030 = "Com certeza, Saori."
10101-101010040 = "Estou curtindo bastante."
10101-101010050 = "Fico feliz em saber."
10101-101010060 = "Acabei de começar um bico em um restaurante à beira-mar."
10101-101010070 = "Se bater a fome, não deixe de dar uma passada aqui, Sensei."
10101-101010080 = "Sensei, obrigada pela ajuda outro dia."
10101-101010090 = "Hoje vou fazer a ronda pelo local do evento, mas parece que não vou dar conta sozinha..."
10101-101010100 = "Se não se importar, poderia me emprestar a sua ajuda, Sensei?"
10101-101010110 = "Claro, eu te ajudo."
10101-101010120 = "Agradeço. Vamos nos encontrar na entrada do evento, então."
10101-101010130 = "Sensei, tentei editar aqueles sons que gravei agora há pouco."
10101-101010140 = "Acho que ficou um bom trabalho."
10101-101010150 = "Que ótimo!"
10101-101010160 = "Vou mandar o arquivo para você também, Sensei. Dê uma ouvida depois."
10101-101010170 = "(Falha no envio do arquivo)"
10101-101010180 = "Ah."
10101-101010190 = "Entendo."
10101-101010200 = "É pesado demais..."
10101-101010210 = "Eu escuto pessoalmente aí no evento."
10101-101010220 = "Certo, combinado."
10101-101010230 = "Sensei."
10101-101010240 = "Hoje no fim da tarde vai ter uma apresentação de DJ."
10101-101010250 = "Se tiver tempo, você poderia vir assistir?"
10101-101010260 = "Claro, vou sem falta."
10101-101010270 = "Está programado para começar no palco principal assim que o sol se puser."
10101-101010280 = "Estarei esperando."
