[translation]
10101-101010010 = "Сенсей."
10101-101010020 = "Наслаждаетесь праздником?"
10101-101010030 = "Конечно, Саори."
10101-101010040 = "Мне нравится."
10101-101010050 = "Это хорошо."
10101-101010060 = "Я только что начала подрабатывать в кафе на пляже."
10101-101010070 = "Если проголодаетесь, обязательно заходите, Сенсей."
10101-101010080 = "Сенсей, спасибо за прошлый раз."
10101-101010090 = "Сегодня я собираюсь осматривать территорию, но одной мне, похоже, не справиться..."
10101-101010100 = "Если не трудно, не могли бы вы помочь?"
10101-101010110 = "Конечно, я помогу."
10101-101010120 = "Благодарю. Тогда встретимся у входа."
10101-101010130 = "Сенсей, я обработала запись, которую сделала ранее."
10101-101010140 = "Кажется, получилось неплохо."
10101-101010150 = "Отлично!"
10101-101010160 = "Я отправлю вам файл, послушайте."
10101-101010170 = "(Ошибка отправки файла)"
10101-101010180 = "А."
10101-101010190 = "Точно."
10101-101010200 = "Из-за размера..."
10101-101010210 = "Я послушаю на месте."
10101-101010220 = "Ага, понял."
10101-101010230 = "Сенсей."
10101-101010240 = "Сегодня вечером будет диджей-сет."
10101-101010250 = "Если хотите, приходите посмотреть."
10101-101010260 = "Да, я обязательно приду."
10101-101010270 = "Планируем начать на главной сцене после заката."
10101-101010280 = "Тогда жду."