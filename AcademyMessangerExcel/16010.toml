[translation]
16010-160100010 = "Чем вы обычно занимаетесь в выходные, Сенсей?"
16010-160100020 = "Наверное, ничего особенного..."
16010-160100030 = "Борюсь с накопившейся бумажной работой."
16010-160100040 = "Но ведь отдыхать тоже важно."
16010-160100050 = "Рада, что вы наслаждаетесь выходными, Сенсей."
16010-160100060 = "...Вы не слишком много работаете?"
16010-160100070 = "Работать без отдыха — только снижает эффективность."
16010-160100080 = "А ты, Хибики?"
16010-160100090 = "...Я?"
16010-160100100 = "Ну, не знаю..."
16010-160100110 = "В основном я что-то мастерю."
16010-160100120 = "...Сенсей, вы в порядке? Я слышала о том случае."
16010-160100130 = "Из-за внезапного отключения электричества в Шале"
16010-160100140 = "вы потеряли данные за целый день работы..."
16010-160100150 = "Неужели нельзя их восстановить?"
16010-160100160 = "Я обращалась в Веритас, но они сказали, что восстановление вряд ли возможно..."
16010-160100170 = "Тогда, может, я могу что-то сделать..."
16010-160100180 = "...Но я всё равно хочу помочь вам."
16010-160100190 = "Буду рада, если вы поддержите меня."
16010-160100200 = "Поддержать..."
16010-160100210 = "Да, поняла."
16010-160100220 = "Удачи вам, Сенсей."
16010-160100230 = "...После того случая я много думала."
16010-160100240 = "Какие же инструменты для поддержки могут повысить мотивацию к офисной работе."
16010-160100250 = "...Методом проб и ошибок я наконец сделала прототип."
16010-160100260 = "Это лучший инструмент поддержки для офисного работника."
16010-160100270 = "...В следующий раз, когда я буду дежурить, я принесу его."
16010-160100280 = "...И что же ты сделала?"
16010-160100290 = "Мне кажется, тот прошлый инструмент был неплох..."
16010-160100300 = "Но раз он вам не понравился, ничего не поделаешь."
16010-160100310 = "Хороший мастер всегда должен прислушиваться к мнению клиента."
16010-160100320 = "В этот раз я подготовила другой инструмент."
16010-160100330 = "Если я ещё зайду в Шале, я принесу его."
16010-160100340 = "Надеюсь, он не взорвётся?"
16010-160100350 = "..."
16010-160100360 = "...Пожалуй, я всё-таки зайду к вам сейчас."
16010-160100370 = "Он ведь точно не взорвётся!?"