[translation]
16010-160100010 = "Сенсей, чем ты обычно занимаешься по выходным?"
16010-160100020 = "Наверное, просто отдыхаю и ничего не делаю..."
16010-160100030 = "Хотя чаще всего всё равно приходится работать и в выходные."
16010-160100040 = "Отдых — важная часть жизни."
16010-160100050 = "Рада слышать, что ты наслаждаешься выходными."
16010-160100060 = "...Ты ведь не перерабатываешь?"
16010-160100070 = "Работа без отдыха непродуктивна и неэффективна."
16010-160100080 = "Хибики, а как ты проводишь выходные?"
16010-160100090 = "...Меня?"
16010-160100100 = "Обычно мои выходные заняты"
16010-160100110 = "тем, что я что-нибудь мастерю и возюсь с техникой."
16010-160100120 = "...Сенсей, я слышала новости."
16010-160100130 = "Из-за внезапного отключения электричества в Шале"
16010-160100140 = "вся работа за день была потеряна..."
16010-160100150 = "Можно как-нибудь всё восстановить?"
16010-160100160 = "Студенты Веритас сказали, что не могут ничего обещать насчёт восстановления данных..."
16010-160100170 = "Я чувствую себя такой беспомощной..."
16010-160100180 = "Я могу чем-нибудь помочь?"
16010-160100190 = "Можно. Подбодришь меня?"
16010-160100200 = "Подбодрить тебя..."
16010-160100210 = "Поняла."
16010-160100220 = "Сенсей, не падай духом!"
16010-160100230 = "...После прошлого случая я много думала."
16010-160100240 = "И поняла, что работающим людям нужно... устройство, которое сможет мотивировать их по требованию."
16010-160100250 = "В конце концов от мыслей я перешла к делу и успешно создала прототип."
16010-160100260 = "В теории это идеальное устройство мотивации для офисных работников."
16010-160100270 = "Испытаю его в следующий раз, когда буду рядом."
16010-160100280 = "...Хорошо, но что это вообще такое?"
16010-160100290 = "Ну, мне казалось, что в прошлый раз я сделала неплохую вещь..."
16010-160100300 = "Но, похоже, ты был другого мнения."
16010-160100310 = "А хороший мастер всегда думает о клиенте."
16010-160100320 = "Поэтому я придумала полностью переработанное устройство."
16010-160100330 = "Поверь, в следующий раз ты сразу заметишь разницу."
16010-160100340 = "Ха-ха. Оно ведь не взрывается или что-то такое?"
16010-160100350 = "..."
16010-160100360 = "...Скоро сам увидишь."
16010-160100370 = "...Оно ведь не взрывается или что-то такое, правда?!"
