[translation]
16010-160100010 = "O que você costuma fazer nos seus dias de folga, Sensei?"
16010-160100020 = "Acho que acabo não fazendo nada......"
16010-160100030 = "Fico lutando contra a pilha de papelada acumulada"
16010-160100040 = "Realmente, descansar o corpo também é importante"
16010-160100050 = "Que bom que você consegue aproveitar a sua folga, Sensei"
16010-160100060 = "......Você não está se forçando demais?"
16010-160100070 = "Trabalhar sem parar e sem descanso acaba sendo contraproducente"
16010-160100080 = "E você, Hibiki?"
16010-160100090 = "......Eu?"
16010-160100100 = "Humm, deixa eu ver......"
16010-160100110 = "Quase sempre estou construindo alguma coisa"
16010-160100120 = "......Sensei, tudo bem? Fiquei sabendo do que aconteceu"
16010-160100130 = "Que caiu a energia de repente aí na Schale"
16010-160100140 = "E você perdeu os dados do trabalho do dia inteiro......"
16010-160100150 = "Não tem mesmo nenhum jeito de recuperar......?"
16010-160100160 = "Pedi ajuda para a Veritas, mas disseram que vai ser difícil recuperar......"
16010-160100170 = "Então acho que não há nada que eu possa fazer quanto aos dados......"
16010-160100180 = "......Mas será que não posso ajudar de alguma outra forma?"
16010-160100190 = "Se você torcer por mim, já vou ficar muito feliz"
16010-160100200 = "Torcer por você......"
16010-160100210 = "Sim, entendi"
16010-160100220 = "Força no trabalho, Sensei"
16010-160100230 = "......Depois do que aconteceu outro dia, fiquei pensando bastante"
16010-160100240 = "Em qual seria o equipamento de torcida ideal para aumentar a motivação no trabalho de escritório"
16010-160100250 = "......Depois de muita tentativa e erro, finalmente concluí um protótipo"
16010-160100260 = "Este é o equipamento de torcida definitivo para quem trabalha na escrivaninha"
16010-160100270 = "......No meu próximo dia de plantão, vou levar aí para testarmos"
16010-160100280 = "......O que exatamente você construiu?"
16010-160100290 = "Eu achei que aquele equipamento de torcida da última vez tinha ficado muito bom, mas......"
16010-160100300 = "Como você não gostou muito, Sensei, fazer o quê"
16010-160100310 = "Uma boa Meister deve sempre dar ouvidos à opinião do cliente"
16010-160100320 = "Por isso, preparei um equipamento de torcida diferente desta vez"
16010-160100330 = "Na próxima vez que eu for à Schale, levo para você ver"
16010-160100340 = "Dessa vez não tem função de autodestruição, né?"
16010-160100350 = "......"
16010-160100360 = "......Pensando bem, acho que vou levar aí agora mesmo"
16010-160100370 = "Não vai se autodestruir mesmo, né?!"
