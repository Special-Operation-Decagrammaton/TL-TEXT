[translation]
10131-101310010 = "Здравствуйте, Сенсей."
10131-101310020 = "Сегодня я дежурю в Шале,"
10131-101310030 = "поэтому, чтобы не быть невежливой, я сначала написала вам это приветственное сообщение."
10131-101310040 = "Можно было и не церемониться..."
10131-101310050 = "Я вас затруднила...?"
10131-101310060 = "Нет, не настолько, но я бы хотел, чтобы ты общалась проще."
10131-101310070 = "Поняла."
10131-101310080 = "Тогда желаю хорошего дня."
10131-101310090 = "Можно узнать ваши планы, Сенсей?"
10131-101310100 = "Скоро полуфинал Кубка по хоккею с шайбой!"
10131-101310110 = "Если вам удобно, не хотите ли пойти вместе в тот день..."
10131-101310120 = "Ах"
10131-101310130 = "Прошу прощения."
10131-101310140 = "Я самовольно решила, не спросив вашего расписания..."
10131-101310150 = "Не переживай! Я рад, что ты так воодушевлена."
10131-101310160 = "Т-т"
10131-101310170 = "Т-так вот как..."
10131-101310180 = "Как хорошо..."
10131-101310190 = "Я согласую, когда получу расписание. Пришли мне его позже."
10131-101310200 = "То есть..."
10131-101310210 = "Да, спасибо!"
10131-101310220 = "Сенсей!"
10131-101310230 = "Сегодня же, верно?"
10131-101310240 = "Вы ведь не забыли?"
10131-101310250 = "Я тоже очень ждал этого."
10131-101310260 = "Да!"
10131-101310270 = "Тогда я буду ждать вас в комнате издательского клуба."
10131-101310280 = "Спасибо, что вместе посмотрели хоккей на днях."
10131-101310290 = "Но"
10131-101310300 = "что касается всего, что случилось в тот день..."
10131-101310310 = "мне... действительно очень жаль..."
10131-101310320 = "Не беспокойся. Мне тоже было весело."
10131-101310330 = "П-правда?"
10131-101310340 = "И, раз уж так! В качестве извинения"
10131-101310350 = "сегодня я хочу угостить вас обедом."
10131-101310360 = "Ты сама готовила!?"
10131-101310370 = "Да."
10131-101310380 = "К тому же сегодня как раз «Фестиваль ростков»."
10131-101310390 = "Фестиваль... ростков?"
10131-101310400 = "Здравствуйте, Сенсей!"
10131-101310410 = "Ты сегодня в хорошем настроении, Такане."
10131-101310420 = "Да! Произошло кое-что очень приятное..."
10131-101310430 = "Сенсей, вы знаете?"
10131-101310440 = "Говорят, сегодня ночью можно увидеть северное сияние!"
10131-101310450 = "Поэтому я хочу пойти сфотографировать пейзажи."
10131-101310460 = "Эм... если вы не против..."
10131-101310470 = "не хотите ли пойти со мной?"
10131-101310480 = "Фотографировать северное сияние?"
10131-101310490 = "Да."
10131-101310500 = "Конечно, я понимаю, что вы заняты, поэтому..."
10131-101310510 = "не напрягайтесь..."
10131-101310520 = "вы можете и отказаться."
10131-101310530 = "Раз ты просишь, я обязан пойти!"
10131-101310540 = "К тому же это законный способ уйти с работы пораньше, так что пойду!"
10131-101310550 = "Т-т"
10131-101310560 = "Как же вы можете так говорить..."
10131-101310570 = "Мне... немного неловко, но"
10131-101310580 = "я правда вам благодарна."
10131-101310590 = "Хе-хе"
10131-101310600 = "Я немного понимаю это чувство."
10131-101310610 = "Перед дедлайном всегда хочется пойти погулять."
10131-101310620 = "Тогда я буду ждать вас."