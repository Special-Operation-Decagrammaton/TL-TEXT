[translation]
10131-101310010 = "Um excelente dia para você, Sensei."
10131-101310020 = "Como hoje é o meu dia de plantão na SCHALE,"
10131-101310030 = "envio esta mensagem de saudação antecipada para não faltar com a cortesia."
10131-101310040 = "Não precisa de tanta formalidade assim..."
10131-101310050 = "Por acaso fui inconveniente...?"
10131-101310060 = "Não, imagina! Só queria que você ficasse mais à vontade para conversar comigo."
10131-101310070 = "Compreendido."
10131-101310080 = "Então conto com a sua orientação durante o dia de hoje."
10131-101310090 = "Poderia me informar como está a sua agenda, Sensei?"
10131-101310100 = "As semifinais da Copa de Hóquei no Gelo acontecerão muito em breve!"
10131-101310110 = "Se não for incômodo, adoraria que pudéssemos ir assistir juntos nesse dia..."
10131-101310120 = "Ah!"
10131-101310130 = "Peço mil desculpas."
10131-101310140 = "Fui logo fazendo o convite sem sequer considerar os seus compromissos..."
10131-101310150 = "Não esquenta! Fico feliz em ver você tão empolgada, Takane."
10131-101310160 = "M-"
10131-101310170 = "M-Mesmo?"
10131-101310180 = "Que alívio..."
10131-101310190 = "Me manda a data depois que eu organizo a minha agenda."
10131-101310200 = "Isso quer dizer que..."
10131-101310210 = "Sim, muito obrigada!"
10131-101310220 = "Sensei!"
10131-101310230 = "O grande dia é hoje."
10131-101310240 = "Você não se esqueceu, não é?"
10131-101310250 = "Claro que não, eu estava super ansioso por isso."
10131-101310260 = "Maravilha!"
10131-101310270 = "Estarei aguardando por você na sala do Departamento de Publicação."
10131-101310280 = "Muito obrigada por ter ido assistir à partida de hóquei no gelo comigo no outro dia."
10131-101310290 = "Contudo,"
10131-101310300 = "sobre todos os imprevistos que aconteceram naquela ocasião,"
10131-101310310 = "eu... sinto muitíssimo mesmo..."
10131-101310320 = "Não precisa se preocupar com isso. Eu me diverti bastante."
10131-101310330 = "M-Mesmo?"
10131-101310340 = "Sendo assim, como forma de pedir desculpas,"
10131-101310350 = "gostaria de lhe oferecer o almoço hoje por minha conta."
10131-101310360 = "Comida caseira feita pela Takane?!"
10131-101310370 = "Sim."
10131-101310380 = "Ainda mais porque hoje é justamente o dia do \"Festival do Broto de Feijão\"!"
10131-101310390 = "Festival... do Broto de Feijão?"
10131-101310400 = "Um excelente dia para você, Sensei!"
10131-101310410 = "Parece que alguém está de ótimo humor hoje, hein, Takane?"
10131-101310420 = "Sim! Aconteceu uma coisa maravilhosa..."
10131-101310430 = "Você já está sabendo, Sensei?"
10131-101310440 = "Dizem que será possível ver a aurora boreal esta noite!"
10131-101310450 = "Por isso, estou pensando em sair para tirar algumas fotos da paisagem."
10131-101310460 = "Hum... e se não for incômodo..."
10131-101310470 = "Gostaria de me acompanhar?"
10131-101310480 = "Fotografar a paisagem da aurora boreal?"
10131-101310490 = "Sim."
10131-101310500 = "Naturalmente, sei muito bem o quão ocupado você é..."
10131-101310510 = "Portanto, não se sinta obrigado..."
10131-101310520 = "Pode recusar sem cerimônia se estiver atarefado."
10131-101310530 = "Sendo um convite da Takane, eu não perderia por nada!"
10131-101310540 = "É a desculpa perfeita para escapar legalmente da hora extra, eu vou!"
10131-101310550 = "Q-"
10131-101310560 = "Que alegria ouvir você dizer isso..."
10131-101310570 = "Fico até... um pouco encabulada,"
10131-101310580 = "mas agradeço de todo o coração."
10131-101310590 = "Hehe."
10131-101310600 = "Compreendo perfeitamente esse sentimento."
10131-101310610 = "Quando o prazo de entrega está batendo à porta, dá uma vontade enorme de sair para passear, não é?"
10131-101310620 = "Estarei aguardando por você, então."
