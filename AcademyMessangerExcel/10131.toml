[translation]
10131-101310010 = "Приветствую, Сенсей."
10131-101310020 = "В преддверии моего дежурства представителем студентов в Шале я сочла правильным"
10131-101310030 = "заранее уведомить вас о своём прибытии."
10131-101310040 = "Не обязательно быть настолько официальной..."
10131-101310050 = "Вас это беспокоит?"
10131-101310060 = "Нет, но мы можем общаться попроще, Таканэ."
10131-101310070 = "Хорошо."
10131-101310080 = "В любом случае, сегодня рассчитываю на наше сотрудничество."
10131-101310090 = "Когда вам будет удобно, Сенсей?"
10131-101310100 = "Если честно, скоро начнётся полуфинал по хоккею,"
10131-101310110 = "так что, может, встретимся примерно в это время и посмотрим трансляцию вместе?"
10131-101310120 = "А!"
10131-101310130 = "Прошу прощения."
10131-101310140 = "С моей стороны это было слишком самонадеянно, правда?"
10131-101310150 = "Я рад, что тебе стало комфортнее!"
10131-101310160 = "Эм"
10131-101310170 = "Вот как?"
10131-101310180 = "Я рада это слышать..."
10131-101310190 = "Пришлите удобное вам время, и я постараюсь подстроиться."
10131-101310200 = "То есть..."
10131-101310210 = "Прекрасно! Спасибо!"
10131-101310220 = "Сенсей!"
10131-101310230 = "Сегодня тот самый день!"
10131-101310240 = "Вы ведь помните, что мы собирались делать?"
10131-101310250 = "Конечно. Я обещал."
10131-101310260 = "Несомненно!"
10131-101310270 = "Тогда, пожалуйста, приходите в Издательский отдел!"
10131-101310280 = "Спасибо, что посмотрели со мной хоккей."
10131-101310290 = "Но..."
10131-101310300 = "Насчёт... этого..."
10131-101310310 = "Прости..."
10131-101310320 = "Всё нормально. Мне тоже было весело."
10131-101310330 = "В ЛЮБОМ СЛУЧАЕ!"
10131-101310340 = "Чтобы отплатить за вашу доброту и как следует извиниться..."
10131-101310350 = "я подумала, может, приготовить вам обед?"
10131-101310360 = "Готовка Таканэ?!"
10131-101310370 = "Да."
10131-101310380 = "Скоро начнётся фестиваль ростков... если вам интересно."
10131-101310390 = "Фестиваль... только для ростков?"
10131-101310400 = "Здравствуйте, Сенсей!!"
10131-101310410 = "Ты сегодня воодушевлена, Таканэ."
10131-101310420 = "И не без причины!"
10131-101310430 = "Знаете почему?"
10131-101310440 = "Сегодня ночью должно быть северное сияние! И небо ясное!"
10131-101310450 = "Я подумала, что смогу попрактиковаться в фотографии."
10131-101310460 = "Если вы свободны и вам интересно,"
10131-101310470 = "не хотите присоединиться ко мне?"
10131-101310480 = "Фотографировать северное сияние..."
10131-101310490 = "Как я и сказала."
10131-101310500 = "Конечно, если вы слишком напряжены"
10131-101310510 = "или"
10131-101310520 = "если это доставит слишком много хлопот, ничего страшного. Никакого давления..."
10131-101310530 = "Если Таканэ говорит идти — я иду!"
10131-101310540 = "А значит, я смогу уйти с работы пораньше!"
10131-101310550 = "Эм..."
10131-101310560 = "Я рада это слышать,"
10131-101310570 = "хоть мне и немного неловко."
10131-101310580 = "Спасибо."
10131-101310590 = "А."
10131-101310600 = "Но я понимаю, о чём вы."
10131-101310610 = "Хвататься за любой повод сбежать от дедлайна..."
10131-101310620 = "Тогда я буду вас ждать."
