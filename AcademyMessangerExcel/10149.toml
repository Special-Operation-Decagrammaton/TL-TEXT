[translation]
10149-101490010 = "I heard from a student at Trident that..."
10149-101490020 = "Sensei, you actually brought a banana with you, didn't you?"
10149-101490030 = "It became quite a hot topic, you know."
10149-101490040 = "Yeah... I got scolded really badly..."
10149-101490050 = "Everyone's stares were so scary..."
10149-101490060 = "On a ship, bananas are considered taboo."
10149-101490070 = "Because they tend to make other food spoil easily."
10149-101490080 = "You might think it's an exaggeration, but please understand it as a safety measure."
10149-101490090 = "Well, if it's a rule, it can't be helped."
10149-101490100 = "Come to think of it, are there rules in diving too?"
10149-101490110 = "Yes, there are quite a few."
10149-101490120 = "For example—"
10149-101490130 = "After entering the water,"
10149-101490140 = "you must always come back out of the water, and so on."
10149-101490150 = "That sounds kind of profound..."
10149-101490160 = "The other day, when I visited Schale on duty,"
10149-101490170 = "there was a wonderful song playing, wasn't there?"
10149-101490180 = "If you don't mind, could you tell me the title of the song?"
10149-101490190 = "Ah... sorry, that was just"
10149-101490200 = "playing on the radio, so even I don't know the song title..."
10149-101490210 = "Is that so?"
10149-101490220 = "It's a shame, but it can't be helped."
10149-101490230 = "I was thinking of adding it to my playlist."
10149-101490240 = "You really like listening to music, don't you?"
10149-101490250 = "Yes."
10149-101490260 = "I like listening to it, but..."
10149-101490270 = "Well..."
10149-101490280 = "I just love singing."
10149-101490290 = "I'm in trouble..."
10149-101490300 = "What's wrong?"
10149-101490310 = "Actually, I just found out tomorrow's miso soup..."
10149-101490320 = "It's going to make diving difficult, so"
10149-101490330 = "I'm already feeling depressed..."
10149-101490340 = "...Miso soup?"
10149-101490350 = "Yes."
10149-101490360 = "Sensei,"
10149-101490370 = "what do you think?"
10149-101490380 = "I don't really understand, but..."
10149-101490390 = "I happen to like miso soup."
10149-101490400 = "Really?"
10149-101490410 = "I suppose tastes vary from person to person, but"
10149-101490420 = "I'm really not fond of it..."
10149-101490430 = "Well, everyone has different likes and dislikes."
10149-101490440 = "I was hoping my preferences would match Sensei's, though..."
10149-101490450 = "It's a bit disappointing."
10149-101490460 = "Regarding tomorrow's diving observation..."
10149-101490470 = "Please bring something to pass the time."
10149-101490480 = "Like a book, a game console,"
10149-101490490 = "or maybe some work you've been putting off."
10149-101490500 = "I plan to stay underwater for two whole hours without coming up, so"
10149-101490510 = "Two hours of diving?!"
10149-101490520 = "Are you going to dive that deep...?"
10149-101490530 = "Yes, I am planning to dive a bit deeper than usual, but..."
10149-101490540 = "I've been diving continuously for the past few days,"
10149-101490550 = "so I need to take my time ascending to prevent decompression sickness."
10149-101490560 = "Wouldn't staying under for a long time actually *cause* decompression sickness?"
10149-101490570 = "No. Decompression sickness is caused by rapid changes in atmospheric pressure,"
10149-101490580 = "so ascending slowly is much safer."
10149-101490590 = "There's also the option of using a decompression chamber, but..."
10149-101490600 = "Anyway, I'm counting on you tomorrow as well!"
10149-101490610 = "I'm sorry about the other day..."
10149-101490620 = "I was feeling out of it from decompression sickness and"
10149-101490630 = "I kind of..."
10149-101490640 = "Well, said some weird things..."
10149-101490650 = "Don't worry about it!"
10149-101490660 = "It was my fault to begin with..."
10149-101490670 = "Are you feeling better now?"
10149-101490680 = "I underwent decompression right away, so there were no issues."
10149-101490690 = "To make sure something like that doesn't happen again..."
10149-101490700 = "No."
10149-101490710 = "If anything ever happens again,"
10149-101490720 = "I'd be happy if Sensei could help me out."
10149-101490730 = "Of course!"
10149-101490740 = "Hehe."
10149-101490750 = "Thank you very much!"
