[translation]
10149-101490010 = "Я слышал от студентов Трайдента..."
10149-101490020 = "Сенсей, вы принесли с собой бананы."
10149-101490030 = "Это вызвало большой резонанс."
10149-101490040 = "Да... меня сильно поругали..."
10149-101490050 = "У всех были такие страшные глаза..."
10149-101490060 = "На кораблях бананы считаются табу."
10149-101490070 = "Потому что они ускоряют порчу продуктов рядом."
10149-101490080 = "Возможно, это кажется преувеличением, но прошу понять это как меру безопасности."
10149-101490090 = "Если это правило, ничего не поделаешь."
10149-101490100 = "Кстати, у дайвинга тоже есть правила?"
10149-101490110 = "Да, есть несколько."
10149-101490120 = "Например..."
10149-101490130 = "после того, как вошёл в воду,"
10149-101490140 = "ты обязательно должен из неё выйти."
10149-101490150 = "Звучит как-то глубокомысленно..."
10149-101490160 = "На днях, когда я была на дежурстве в Шале,"
10149-101490170 = "там играла прекрасная песня."
10149-101490180 = "Если не трудно, не могли бы вы сказать, как она называется?"
10149-101490190 = "А... извини, с этим проблема."
10149-101490200 = "Я просто включил радио, так что названия я и сам не знаю..."
10149-101490210 = "Вот как..."
10149-101490220 = "Жаль, но ничего не поделаешь."
10149-101490230 = "Я хотела добавить её в плейлист."
10149-101490240 = "Ты любишь слушать музыку."
10149-101490250 = "Да."
10149-101490260 = "Я люблю не только слушать, но и..."
10149-101490270 = "Ну, скажем так..."
10149-101490280 = "я люблю петь."
10149-101490290 = "Проблема..."
10149-101490300 = "Что случилось?"
10149-101490310 = "Дело в том, что я узнал, что завтра на обед будет мисо-суп..."
10149-101490320 = "Из-за этого дайвинг станет сложнее,"
10149-101490330 = "так что я уже сейчас в унынии..."
10149-101490340 = "...Мисо-суп?"
10149-101490350 = "Да."
10149-101490360 = "А вы, Сенсей,"
10149-101490370 = "что об этом думаете?"
10149-101490380 = "Не совсем понимаю, но..."
10149-101490390 = "я люблю мисо-суп."
10149-101490400 = "Правда?"
10149-101490410 = "У каждого свои предпочтения, но..."
10149-101490420 = "я очень не люблю его..."
10149-101490430 = "У всех вкусы разные."
10149-101490440 = "Хотелось бы, чтобы наши вкусы совпадали, но..."
10149-101490450 = "немного жаль."
10149-101490460 = "Насчёт завтрашнего наблюдения за дайвингом..."
10149-101490470 = "возьмите с собой что-нибудь, чем можно занять время."
10149-101490480 = "Книгу, игровую консоль..."
10149-101490490 = "Или, может, отложенную работу."
10149-101490500 = "Я планирую не выходить из воды два часа."
10149-101490510 = "Два часа дайвинга?"
10149-101490520 = "Ты собираешься нырять так глубоко...?"
10149-101490530 = "Да, я планирую погрузиться чуть глубже, чем обычно, но..."
10149-101490540 = "поскольку я ныряю несколько дней подряд,"
10149-101490550 = "я буду подниматься медленно, чтобы предотвратить декомпрессионную болезнь."
10149-101490560 = "Разве длительное погружение не увеличивает риск декомпрессионной болезни?"
10149-101490570 = "Нет. Декомпрессионная болезнь возникает из-за резкого перепада давления,"
10149-101490580 = "так что медленный подъём безопаснее."
10149-101490590 = "Можно также использовать декомпрессионную камеру, но..."
10149-101490600 = "В любом случае, завтра тоже рассчитываю на вас!"
10149-101490610 = "Прошу прощения за прошлый раз..."
10149-101490620 = "Я был в тумане из-за декомпрессионной болезни"
10149-101490630 = "и, кажется..."
10149-101490640 = "сказал какую-то ерунду..."
10149-101490650 = "Не обращай внимания!"
10149-101490660 = "В конце концов, это я виноват..."
10149-101490670 = "С самочувствием теперь всё в порядке?"
10149-101490680 = "Я сразу провела декомпрессию, так что проблем не было."
10149-101490690 = "Постараюсь, чтобы такого больше не повторилось..."
10149-101490700 = "Нет."
10149-101490710 = "Если что-то случится снова,"
10149-101490720 = "я буду рада, если вы мне поможете."
10149-101490730 = "Конечно!"
10149-101490740 = "Хе-хе."
10149-101490750 = "Спасибо!"