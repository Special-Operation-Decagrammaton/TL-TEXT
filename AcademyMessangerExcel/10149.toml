[translation]
10149-101490010 = "Ouvi das alunas da Trident, mas..."
10149-101490020 = "Sensei, você acabou trazendo bananas a bordo, não foi?"
10149-101490030 = "Isso virou o assunto do momento por lá"
10149-101490040 = "Pois é... levei uma baita bronca..."
10149-101490050 = "O olhar de todo mundo deu até calafrios..."
10149-101490060 = "É que dentro de um navio, bananas são consideradas um tabu"
10149-101490070 = "Porque elas fazem os outros alimentos ao redor apodrecerem mais rápido"
10149-101490080 = "Pode parecer exagero, mas por favor entenda que é uma medida de segurança"
10149-101490090 = "Se é regra, não tem jeito né"
10149-101490100 = "Por falar nisso, no mergulho também existem regras assim?"
10149-101490110 = "Sim, existem algumas"
10149-101490120 = "Por exemplo..."
10149-101490130 = "Depois de entrar na água"
10149-101490140 = "você obrigatoriamente precisa sair da água, coisas assim"
10149-101490150 = "Isso soou meio profundo..."
10149-101490160 = "Outro dia, quando fui à Schale como ajudante do plantão"
10149-101490170 = "Estava tocando uma música muito bonita, não estava?"
10149-101490180 = "Se não se importar, poderia me dizer o nome da música?"
10149-101490190 = "Ah... foi mal, é que naquela hora"
10149-101490200 = "Eu só tinha deixado o rádio ligado, então nem eu sei o nome da música..."
10149-101490210 = "Ah, então era isso"
10149-101490220 = "Que pena, mas fazer o quê, né"
10149-101490230 = "Eu estava pensando em colocar na minha playlist"
10149-101490240 = "Você gosta bastante de ouvir música, né"
10149-101490250 = "Sim"
10149-101490260 = "Gosto de ouvir, mas..."
10149-101490270 = "Digamos que"
10149-101490280 = "eu amo músicas em geral"
10149-101490290 = "Que problema..."
10149-101490300 = "O que houve?"
10149-101490310 = "Na verdade, descobri que amanhã vai ser puro missoshiru..."
10149-101490320 = "Como o mergulho vai ficar muito difícil"
10149-101490330 = "já estou desanimada desde agora..."
10149-101490340 = "...Missoshiru?"
10149-101490350 = "Sim"
10149-101490360 = "E você, Sensei"
10149-101490370 = "o que acha?"
10149-101490380 = "Não entendi muito bem a relação, mas..."
10149-101490390 = "Eu gosto de missoshiru"
10149-101490400 = "Sério?"
10149-101490410 = "Acho que gosto varia de pessoa para pessoa, mas"
10149-101490420 = "eu detesto..."
10149-101490430 = "Bom, cada um tem seus gostos, né"
10149-101490440 = "Se possível, eu queria ter o mesmo gosto que você, Sensei..."
10149-101490450 = "É uma pena"
10149-101490460 = "Sobre a observação do mergulho de amanhã..."
10149-101490470 = "Por favor, traga alguma coisa para passar o tempo"
10149-101490480 = "Como um livro ou um videogame portátil"
10149-101490490 = "Ou então algum trabalho que você estava adiando"
10149-101490500 = "Porque depois que eu entrar na água, não pretendo sair por 2 horas"
10149-101490510 = "2 horas inteiras mergulhando?"
10149-101490520 = "Vai mergulhar tão fundo assim...?"
10149-101490530 = "Sim, planejo mergulhar um pouco mais fundo do que o normal, mas..."
10149-101490540 = "Como tenho mergulhado vários dias seguidos"
10149-101490550 = "vou subir bem devagar para prevenir a doença descompressiva"
10149-101490560 = "Ficar muito tempo debaixo d'água não causa justamente a doença descompressiva?"
10149-101490570 = "Não. Como a doença descompressiva acontece por mudanças bruscas de pressão,"
10149-101490580 = "é mais seguro subir bem devagar"
10149-101490590 = "Também existe a opção de usar uma câmara de descompressão, mas..."
10149-101490600 = "De todo modo, conto com você amanhã também!"
10149-101490610 = "Peço desculpas pelo outro dia..."
10149-101490620 = "Fiquei meio zonza por causa da descompressão"
10149-101490630 = "E acabei..."
10149-101490640 = "Bem, dizendo coisas estranhas..."
10149-101490650 = "Não se preocupe com isso!"
10149-101490660 = "Para começo de conversa, a culpa foi minha..."
10149-101490670 = "Já está se sentindo melhor?"
10149-101490680 = "Como fiz a descompressão logo em seguida, não houve problema nenhum"
10149-101490690 = "Vou tomar cuidado para que isso não aconteça na próxima..."
10149-101490700 = "Não, quer dizer"
10149-101490710 = "Se acontecer alguma coisa de novo"
10149-101490720 = "ficarei muito feliz se você vier me ajudar, Sensei"
10149-101490730 = "Com certeza!"
10149-101490740 = "Fufu"
10149-101490750 = "Muito obrigada!"
