[translation]
10149-101490010 = "Я слышала от студента «Трезубца»..."
10149-101490020 = "Сенсей, вы принесли с собой банан, да?"
10149-101490030 = "Об этом довольно много говорили."
10149-101490040 = "Да... меня сильно отругали..."
10149-101490050 = "Взгляды у всех были такие страшные..."
10149-101490060 = "На корабле бананы считаются табу."
10149-101490070 = "Они ускоряют порчу продуктов вокруг."
10149-101490080 = "Может показаться преувеличением, но прошу понять это как меру безопасности."
10149-101490090 = "Если это правило, ничего не поделаешь."
10149-101490100 = "Кстати, в дайвинге тоже есть правила?"
10149-101490110 = "Да, есть несколько."
10149-101490120 = "Например..."
10149-101490130 = "После того как войдёшь в воду,"
10149-101490140 = "обязательно нужно выйти из воды, и тому подобное."
10149-101490150 = "Как-то это многозначительно..."
10149-101490160 = "На днях, когда я была на дежурстве в Шале,"
10149-101490170 = "играла прекрасная музыка, верно?"
10149-101490180 = "Если можно, не могли бы вы сказать название песни?"
10149-101490190 = "А-а... извини, это..."
10149-101490200 = "Я просто включил радио, так что названия даже я не знаю..."
10149-101490210 = "Вот как."
10149-101490220 = "Жаль, но ничего не поделаешь."
10149-101490230 = "Я думала добавить её в плейлист."
10149-101490240 = "Ты любишь слушать песни."
10149-101490250 = "Да."
10149-101490260 = "Слушать мне тоже нравится, но..."
10149-101490270 = "Да."
10149-101490280 = "Я люблю песни."
10149-101490290 = "Вот беда..."
10149-101490300 = "Что случилось?"
10149-101490310 = "На самом деле, я узнала, что завтра будет мисо-суп..."
10149-101490320 = "Из-за этого дайвинг станет тяжёлым,"
10149-101490330 = "и мне уже тоскливо..."
10149-101490340 = "...Мисо-суп?"
10149-101490350 = "Да."
10149-101490360 = "А вы, Сенсей,"
10149-101490370 = "что вы думаете?"
10149-101490380 = "Не очень понимаю, но..."
10149-101490390 = "Я люблю мисо-суп."
10149-101490400 = "Правда?"
10149-101490410 = "Думаю, у всех разные вкусы, но"
10149-101490420 = "я его очень не люблю..."
10149-101490430 = "Вкусы у всех разные, да."
10149-101490440 = "Если бы можно было, я бы хотела иметь такие же вкусы, как у Сенсея..."
10149-101490450 = "Немного жаль."
10149-101490460 = "Насчёт завтрашнего наблюдения за дайвингом..."
10149-101490470 = "Возьмите с собой что-нибудь, чтобы скоротать время."
10149-101490480 = "Книгу или игровую приставку."
10149-101490490 = "Или отложенную работу."
10149-101490500 = "Планируется не выходить из воды в течение двух часов после погружения."
10149-101490510 = "Два часа дайвинга?"
10149-101490520 = "Так глубоко погружаться...?"
10149-101490530 = "Да, есть также план погрузиться немного глубже, чем обычно..."
10149-101490540 = "Последние несколько дней я погружаюсь подряд, поэтому"
10149-101490550 = "я трачу время на всплытие, чтобы предотвратить декомпрессионную болезнь."
10149-101490560 = "Если долго погружаться, разве не наоборот будет декомпрессионная болезнь?"
10149-101490570 = "Нет. Декомпрессионная болезнь возникает из-за резких перепадов давления,"
10149-101490580 = "поэтому медленно всплывать безопаснее."
10149-101490590 = "Есть также вариант использовать декомпрессионную камеру, но..."
10149-101490600 = "Так или иначе, завтра тоже рассчитываю на вас!"
10149-101490610 = "Простите за тот раз..."
10149-101490620 = "Я была как в тумане из-за декомпрессионной болезни"
10149-101490630 = "и..."
10149-101490640 = "ну, сказала странное..."
10149-101490650 = "Не обращай внимания!"
10149-101490660 = "Если разобраться, это из-за меня..."
10149-101490670 = "Ты уже в порядке?"
10149-101490680 = "Я сразу же прошла декомпрессию, так что проблем не было."
10149-101490690 = "Чтобы в следующий раз такого не было..."
10149-101490700 = "Нет..."
10149-101490710 = "Но если снова что-то случится,"
10149-101490720 = "буду рада, если Сенсей поможет."
10149-101490730 = "Конечно!"
10149-101490740 = "Фу-фу."
10149-101490750 = "Спасибо большое!"