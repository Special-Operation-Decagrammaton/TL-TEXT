[translation]
20026-200260010 = "<Объявление> Строительный отдел Красной Зимы / Профессиональная рабочая сила / Долгосрочная, краткосрочная, подённая работа / Строительство, земляные работы, реконструкция, снос, ремонт / Обращайтесь по любым вопросам! Чтобы отписаться от рассылки, свяжитесь с нами через MomoTalk."
20026-200260020 = "Сенсей, вам нужны рабочие руки?"
20026-200260030 = "Что случилось...?"
20026-200260040 = "Понимаете..."
20026-200260050 = "В последнее время заказов почти нет."
20026-200260060 = "У нас в строительном отделе простаивают руки."
20026-200260070 = "Вам в Шале не нужны работники?"
20026-200260080 = "Собираетесь расширять офис"
20026-200260090 = "или ставить памятник Сенсею?"
20026-200260100 = "Пока таких планов нет..."
20026-200260110 = "Вот как, жаль."
20026-200260120 = "Если вдруг понадобятся руки,"
20026-200260130 = "обращайтесь к нам, в строительный отдел Ред Винтер."
20026-200260140 = "Без посредников, связывайтесь напрямую!"
20026-200260150 = "Да, спасибо."
20026-200260160 = "Сенсей, можно вас на минуту?"
20026-200260170 = "Я пишу сочинение, но застряла."
20026-200260180 = "Хочу услышать ваш совет."
20026-200260190 = "Сочинения — это сложно."
20026-200260200 = "О чём ты пишешь?"
20026-200260210 = "Ну,"
20026-200260220 = "во-первых, нужно затронуть чувства читателя,"
20026-200260230 = "чтобы зажечь в нём боевой дух революции."
20026-200260240 = "А затем, внушив свои идеи,"
20026-200260250 = "пробудить желание противостоять злобной буржуазии с их привилегиями."
20026-200260260 = "Вот такое сочинение я пишу."
20026-200260270 = "...Эт-то довольно радикально."
20026-200260280 = "Сенсей, завтра..."
20026-200260290 = "мы ведь договорились об экскурсии в строительный отдел, да?"
20026-200260300 = "Да, планировал, но...?"
20026-200260310 = "По прогнозу, завтра ожидается сильный холодный фронт."
20026-200260320 = "Чтобы избежать несчастных случаев, завтрашние работы отменяются."
20026-200260330 = "Прости, что меняю планы в последний момент."
20026-200260340 = "Всё в порядке."
20026-200260350 = "Безопасность превыше всего."
20026-200260360 = "Да, на объектах безопасность всегда на первом месте."
20026-200260370 = "Тогда приходи, когда у тебя будет время."
20026-200260380 = "Кстати, Сенсей,"
20026-200260390 = "я недавно прочитала одну интересную книгу."
20026-200260400 = "Под названием «Почему ученицы Кивотоса несчастны?»."
20026-200260410 = "И о чём же там?"
20026-200260420 = "Похоже, её написала ученица, работавшая в финансовом отделе Федерального совета."
20026-200260430 = "Изучив спрос и предложение на такие товары, как пудинги, в Кивотосе..."
20026-200260440 = "она пришла к выводу, что их достаточно, чтобы хватило на всех учениц."
20026-200260450 = "Однако из-за того, что некоторые ученицы едят по два и более пудинга, баланс нарушается."
20026-200260460 = "Интересная статистика."
20026-200260470 = "Но эти ученицы, которые едят по два пудинга, не думают об окружающих."
20026-200260480 = "Поэтому почти половина учениц не получает пудингов и остаётся несчастной."
20026-200260490 = "Я думаю, счастье не только в пудингах..."
20026-200260500 = "О чём ты говоришь? Пудинги — это источник счастья!"
20026-200260510 = "В любом случае, пока мы не отнимем пудинги у буржуа, страдания не прекратятся."
20026-200260520 = "Я и так занята борьбой в академии, но..."
20026-200260530 = "я придумала, как решить эту проблему радикально."
20026-200260540 = "Как насчёт того, чтобы сократить количество учениц вдвое...?"
20026-200260550 = "Прекрати мыслить как какой-то финальный босс..."