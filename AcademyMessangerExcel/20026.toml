[translation]
20026-200260010 = "<Ad> Трудовая партия Красной Зимы / Профессиональный подбор персонала на длительные и краткосрочные подработки / Гражданское строительство, стройка, ремонт, снос, реконструкция / Ищете работников / Ищете работу / Свяжитесь с нами! / Отписаться через MomoTalk"
20026-200260020 = "Сенсей, тебе нужны рабочие?"
20026-200260030 = "Эм... Это что ещё за рабочие?"
20026-200260040 = "Ну..."
20026-200260050 = "Из-за недавнего роста цен на материалы строительный рынок переживает спад."
20026-200260060 = "У Трудовой партии Красной Зимы сейчас мало работы."
20026-200260070 = "Шале не нужны рабочие?"
20026-200260080 = "Можно пристроить дополнительное крыло к офису Шале..."
20026-200260090 = "Или построить перед зданием памятник тебе..."
20026-200260100 = "У нас в ближайшее время нет строительных планов..."
20026-200260110 = "О, жаль."
20026-200260120 = "Ну, если появится что-нибудь, для чего понадобятся рабочие,"
20026-200260130 = "обязательно сообщи нам."
20026-200260140 = "Не нанимай рабочих у кого-то другого!!"
20026-200260150 = "Не буду."
20026-200260160 = "Сенсей, у тебя есть минутка?"
20026-200260170 = "Я пытаюсь кое-что написать, но мне тяжело..."
20026-200260180 = "Я надеялась получить совет."
20026-200260190 = "Самое важное в тексте — его цель."
20026-200260200 = "О чём ты пишешь?"
20026-200260210 = "Ну..."
20026-200260220 = "О чём-то, что поднимает эмоции!"
20026-200260230 = "Наполняет революционным пылом!"
20026-200260240 = "Склоняет читателя к философии автора!"
20026-200260250 = "Вдохновляет бороться с системой!"
20026-200260260 = "Что-то такое."
20026-200260270 = "А, пропаганда. Классический жанр."
20026-200260280 = "Сенсей, ты разве не говорил, что завтра"
20026-200260290 = "собираешься в Академию Красная Зима посмотреть на работу Трудовой партии?"
20026-200260300 = "Да. Есть проблема?"
20026-200260310 = "Ну, я посмотрела прогноз погоды, и завтра ожидается сильное похолодание..."
20026-200260320 = "Мы решили приостановить полевые работы, чтобы избежать несчастных случаев."
20026-200260330 = "Прошу прощения за внезапное изменение расписания."
20026-200260340 = "Не переживай."
20026-200260350 = "Это вопрос безопасности, так что всё нормально."
20026-200260360 = "Ага! Безопасность важнее всего."
20026-200260370 = "В любом случае, увидимся в следующий раз."
20026-200260380 = "Кстати, Сенсей."
20026-200260390 = "Недавно я прочитала очень интересную книгу."
20026-200260400 = "Она называлась «Почему половина Кивотоса несчастна»."
20026-200260410 = "О, и о чём она?"
20026-200260420 = "Её написал студент, работавший в финансовом отделе Генерального студенческого совета."
20026-200260430 = "Изучив спрос на предметы роскоши вроде пудинга по всему Кивотосу,"
20026-200260440 = "автор выяснила, что пудинга хватило бы всем, если разделить его поровну."
20026-200260450 = "Но поскольку некоторые студенты съедают по два пудинга, возникает дисбаланс распределения."
20026-200260460 = "Интересная статистика."
20026-200260470 = "Но поскольку те, кто ест по два пудинга, не хотят отдавать свой пудинг,"
20026-200260480 = "почти половина студентов остаётся без пудинга и несчастна."
20026-200260490 = "Конечно, причина несчастья, скорее всего, не только в пудинге..."
20026-200260500 = "В смысле? Пудинг — источник всего счастья!"
20026-200260510 = "Пока мы не отберём пудинг у буржуазии, несчастье не исчезнет!"
20026-200260520 = "Но поскольку нынешняя борьба внутри Академии Красная Зима и так достаточно тяжела,"
20026-200260530 = "фундаментальным решением этой проблемы может стать..."
20026-200260540 = "сокращение числа студентов вдвое...?"
20026-200260550 = "Не говори глупостей!"
