[translation]
20026-200260010 = "<Anúncio> Departamento de Obras Públicas da Academia Federal Red Winter / Terceirização de Mão de Obra Especializada / Longo prazo, curto prazo e diárias / Engenharia civil, construção, ampliação, demolição e reformas / Consulte-nos sem compromisso! Para cancelar o recebimento destas mensagens, entre em contato via MomoTalk."
20026-200260020 = "Sensei, está precisando de mão de obra de construção?"
20026-200260030 = "Por que essa pergunta do nada...?"
20026-200260040 = "É que..."
20026-200260050 = "Ultimamente quase não têm entrado novos pedidos de serviço."
20026-200260060 = "O pessoal do Departamento de Obras Públicas está todo de mãos abanando."
20026-200260070 = "Não estão precisando de mão de obra aí na Schale?"
20026-200260080 = "Tipo ampliar o escritório..."
20026-200260090 = "Ou quem sabe erguer um monumento em sua homenagem, Sensei?"
20026-200260100 = "Acho que não tenho planos para isso no momento..."
20026-200260110 = "Entendo, que pena."
20026-200260120 = "Se algum dia precisar de mão de obra..."
20026-200260130 = "Nós, do Departamento de Obras Públicas da Academia Federal Red Winter, assumiremos o serviço!"
20026-200260140 = "Entre em contato diretamente conosco, sem intermediários!"
20026-200260150 = "Combinado, obrigado."
20026-200260160 = "Sensei, tem um minutinho?"
20026-200260170 = "Estou escrevendo uma redação, mas acabei empacando."
20026-200260180 = "Queria pedir alguns conselhos a você."
20026-200260190 = "Escrever redação é difícil mesmo, né?"
20026-200260200 = "Sobre o que você está escrevendo?"
20026-200260210 = "Hum."
20026-200260220 = "Primeiro, quero abalar profundamente as emoções do leitor"
20026-200260230 = "e incendiar o seu espírito de luta revolucionário."
20026-200260240 = "Depois, ao inculcar a ideologia da autora na mente dele..."
20026-200260250 = "Quero despertar o desejo de se rebelar contra a burguesia perversa que monopoliza os privilégios."
20026-200260260 = "É esse tipo de texto que estou escrevendo."
20026-200260270 = "...M-Meio radical, não acha?"
20026-200260280 = "Sensei, sobre amanhã..."
20026-200260290 = "Tínhamos combinado que você viria observar o trabalho do Departamento de Obras Públicas, certo?"
20026-200260300 = "Sim, estava nos meus planos, mas... aconteceu algo?"
20026-200260310 = "Segundo a previsão do tempo, uma forte frente fria vai atingir a região amanhã."
20026-200260320 = "Para evitar acidentes, decidi suspender as obras de amanhã."
20026-200260330 = "Desculpe por mudar os planos assim em cima da hora."
20026-200260340 = "Imagina, tudo bem."
20026-200260350 = "Segurança em primeiro lugar, afinal."
20026-200260360 = "Exato. No canteiro de obras, a segurança sempre vem em primeiro lugar."
20026-200260370 = "Remarcamos para outro dia em que você tiver disponibilidade, então."
20026-200260380 = "Por falar nisso, Sensei..."
20026-200260390 = "Li um livro muito interessante recentemente."
20026-200260400 = "O título era: \"Por Que as Alunas de Kivotos São Infelizes?\"."
20026-200260410 = "Sobre o que fala o livro?"
20026-200260420 = "Parece que foi escrito por uma aluna que fazia parte do Departamento Financeiro do Conselho Estudantil Geral."
20026-200260430 = "Ela pesquisou a oferta e a demanda de produtos de luxo que circulam em Kivotos, como pudins..."
20026-200260440 = "E descobriu que, se fossem distribuídos de forma justa entre todas as alunas, haveria o suficiente para todo mundo."
20026-200260450 = "Porém, como uma minoria de alunas come dois ou mais pudins, o equilíbrio acaba sendo destruído."
20026-200260460 = "Que estatística curiosa."
20026-200260470 = "E o pior é que as alunas que comem dois ou mais pudins jamais se importam com quem está ao redor."
20026-200260480 = "Por causa disso, quase metade das alunas fica sem comer pudim e cai na infelicidade."
20026-200260490 = "Acho que pudim não é tudo na vida, mas..."
20026-200260500 = "O que está dizendo? O pudim é a própria fonte da felicidade humana!"
20026-200260510 = "Seja como for, enquanto não tomarmos os pudins das mãos da burguesia, a infelicidade continuará."
20026-200260520 = "Eu já tenho trabalho de sobra apenas com a luta sindical aqui na academia, mas..."
20026-200260530 = "Acabei de pensar em uma solução definitiva para resolver esse problema pela raiz."
20026-200260540 = "E se reduzíssemos o número total de alunas pela metade...?"
20026-200260550 = "Pare já com essas ideias de vilão final de filme..."
