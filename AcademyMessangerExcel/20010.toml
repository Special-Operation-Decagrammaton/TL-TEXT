[translation]
20010-200100010 = "Meus parabéns pelo seu árduo trabalho no dia de hoje também, Sensei."
20010-200100020 = "Se for do seu agrado, eu adoraria cuidar do seu corpo cansado para ajudá-lo a relaxar. O que me diz?"
20010-200100030 = "...Você comeu alguma coisa estragada?"
20010-200100040 = "Não acha muita maldade falar assim quando só estou sendo atenciosa?!"
20010-200100050 = "Ops!"
20010-200100060 = "N-Não foi nada. Por favor, ignore isso, ohoho..."
20010-200100070 = "Está tudo bem? Aconteceu alguma coisa?"
20010-200100080 = "Não, é só que... digamos que tive uma pequena mudança de mentalidade..."
20010-200100090 = "Eu aprendi muitas coisas durante o período em que administramos aquela estância termal."
20010-200100100 = "Desde como limpar os banhos impecavelmente até como organizar o estoque de vários suprimentos..."
20010-200100110 = "No entanto, sinto que deixei muito a desejar no atendimento e acabei cometendo várias indelicadezas com os hóspedes, inclusive com você, Sensei."
20010-200100120 = "Por isso, pensei em treinar bastante de antemão para não falhar na próxima oportunidade."
20010-200100130 = "Em outras palavras, estou em treinamento!"
20010-200100140 = "O meu último treinamento foi um fracasso total."
20010-200100150 = "Eu jamais imaginaria que a culinária kaiseki fosse algo tão complexo daquele jeito..."
20010-200100160 = "Para mim, que passei quase todos os dias comendo apenas rações distribuídas, aquilo era um mundo completamente desconhecido..."
20010-200100170 = "Mas eu não vou desistir! Ainda há muito o que fazer."
20010-200100180 = "O próximo passo é cuidar da instalação mais importante de qualquer estância termal... a própria fonte termal!"
20010-200100190 = "Faz sentido."
20010-200100200 = "Uma estância termal gira literalmente em torno de suas fontes termais."
20010-200100210 = "Se tivermos banhos excelentes, os clientes certamente virão por conta própria."
20010-200100220 = "Por isso, desta vez vou dar o meu melhor na limpeza da área de banho!"
20010-200100230 = "...Limpando o banho de onde?"
20010-200100240 = "Depois de todos esses treinamentos, eu finalmente alcancei a iluminação."
20010-200100250 = "A verdadeira essência da hospitalidade não está na comida nem nas instalações... mas sim na própria atitude de quem atende!"
20010-200100260 = "Entendi. E se tiver comida gostosa junto, fica perfeito."
20010-200100270 = "Entendi. E se tiver uma ótima fonte termal junto, fica perfeito."
20010-200100280 = "É-É verdade..."
20010-200100290 = "Mas, bom, digamos que essa segunda parte vai ser meio complicada por enquanto..."
20010-200100300 = "Com o nosso orçamento, é difícil providenciar pratos caros ou instalações luxuosas..."
20010-200100310 = "Enfim, vamos começar pelo que está ao nosso alcance! Desta vez, quero dominar gestos elegantes dignos de uma verdadeira anfitriã de pousada termal."
20010-200100320 = "Ou seja, um treinamento de etiqueta!"
20010-200100330 = "Sensei."
20010-200100340 = "O que foi?"
20010-200100350 = "Não é nada demais, mas..."
20010-200100360 = "Se quando eu torci um pé você me carregou nas costas, Sensei..."
20010-200100370 = "Será que, se eu machucar o outro pé também, você faria algo ainda melhor por mim...?"
20010-200100380 = "Por favor, nem pense em se machucar de propósito..."
20010-200100390 = "O meu pé foi melhorando aos poucos desde aquele dia, mas sinto que ainda não está cem por cento recuperado."
20010-200100400 = "Não chega a atrapalhar o dia a dia, mas ainda dói um pouquinho quando tento andar normalmente..."
20010-200100410 = "Parece que vai ser difícil retomar o meu treinamento por enquanto..."
20010-200100420 = "Falando nisso, ouvi falar outro dia de uma fonte termal que é ótima para recuperação terapêutica."
20010-200100430 = "Eu te levo até lá. O que acha de irmos neste fim de semana?"
20010-200100440 = "Ah, muito obrigada."
20010-200100450 = "Então combinado para o fim de semana."
20010-200100460 = "p"
20010-200100470 = "per"
20010-200100480 = "Espere um pouco! Ir para uma fonte termal junto com você, Sensei?!?!?!"
