[translation]
20010-200100010 = "Благодарю за сегодняшнюю работу, Сенсей."
20010-200100020 = "Если вы не против, я бы хотела позаботиться о вашем уставшем теле. Как вам?"
20010-200100030 = "Вы что-то странное съели?"
20010-200100040 = "Я просто забочусь о вас, это так плохо!?"
20010-200100050 = "Ах"
20010-200100060 = "Н-ничего. Не обращайте внимания, о-хо-хо..."
20010-200100070 = "Вы в порядке? Что-то случилось?"
20010-200100080 = "Нет, просто небольшое изменение в настроении, понимаете..."
20010-200100090 = "Я многому научилась, управляя тем курортом."
20010-200100100 = "Начиная с того, как правильно мыть ванну, и заканчивая учётом различных предметов..."
20010-200100110 = "Но особенно в обслуживании гостей мне многого не хватало, и мне кажется, я допустила ошибки по отношению к вам и другим посетителям."
20010-200100120 = "Поэтому, чтобы не ошибиться в следующий раз, я решила провести репетицию."
20010-200100130 = "То есть, это тренировка!"
20010-200100140 = "Прошлая тренировка была полным провалом."
20010-200100150 = "Я и представить не могла, что банкетная кухня может быть такой..."
20010-200100160 = "Для меня, питавшейся почти исключительно пайками, это был совсем незнакомый мир..."
20010-200100170 = "Но я не сдаюсь, мне ещё многое предстоит сделать."
20010-200100180 = "Следующее, на что я должна обратить внимание — самое важное место на курорте... горячий источник!"
20010-200100190 = "Понятно."
20010-200100200 = "Горячий курорт буквально держится на источнике."
20010-200100210 = "Если будет хороший источник, гости сами придут."
20010-200100220 = "Так что в этот раз я сосредоточусь на уборке купальни!"
20010-200100230 = "...Где?"
20010-200100240 = "Пройдя через прошлые тренировки, я поняла,"
20010-200100250 = "что суть обслуживания не в еде или удобствах, а в отношении персонала!"
20010-200100260 = "Понятно. А если ещё и вкусная еда, будет идеально."
20010-200100270 = "Понятно. А если ещё и отличный источник, будет идеально."
20010-200100280 = "Д-да, наверное..."
20010-200100290 = "Но с последним пока сложно, скажем так."
20010-200100300 = "На наши деньги трудно обеспечить дорогую еду или роскошные удобства..."
20010-200100310 = "В общем, начнём с того, что можем! В этот раз я хочу освоить изящные манеры, как у настоящей хозяйки курорта."
20010-200100320 = "То есть, тренировка этикета!"
20010-200100330 = "Сенсей"
20010-200100340 = "Что случилось?"
20010-200100350 = "Нет, ничего серьёзного, но..."
20010-200100360 = "Если я повредила одну ногу, и вы меня понесли,"
20010-200100370 = "то, может быть, если я поврежу другую, вы сделаете что-то ещё лучше...?"
20010-200100380 = "Вообще-то, лучше бы без намеренных травм..."
20010-200100390 = "После того случая нога понемногу заживает, но ещё не до конца восстановилась."
20010-200100400 = "В повседневной жизни проблем нет, но когда пытаюсь ходить обычно, немного больно..."
20010-200100410 = "Похоже, тренировки пока откладываются..."
20010-200100420 = "Кстати, я слышал об одном источнике, который полезен для лечения."
20010-200100430 = "Я подвезу тебя, может, сходим в эти выходные?"
20010-200100440 = "А, спасибо вам."
20010-200100450 = "Тогда на выходных."
20010-200100460 = "п"
20010-200100470 = "по"
20010-200100480 = "Подождите, в горячий источник вместе с Сенсеем!?!?"