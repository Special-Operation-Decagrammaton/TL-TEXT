[translation]
20010-200100010 = "Отличная работа сегодня при исполнении официальных обязанностей."
20010-200100020 = "Если вы не против, я хотела бы позаботиться о вашем уставшем теле."
20010-200100030 = "...Что ты задумала?"
20010-200100040 = "Как грубо! Я просто пытаюсь быть вежливой!"
20010-200100050 = "О!"
20010-200100060 = "Ничего, Сенсей. Ха-ха..."
20010-200100070 = "...Есть проблема?"
20010-200100080 = "Нет, я просто передумала."
20010-200100090 = "В прошлый раз, управляя курортом с горячими источниками, я многому научилась."
20010-200100100 = "От уборки купален до организации запасов банных принадлежностей..."
20010-200100110 = "Однако мне не хватало гостеприимства, и, думаю, я могла доставить гостям неудобства."
20010-200100120 = "Поэтому, чтобы больше не ошибаться, я заранее потренируюсь."
20010-200100130 = "Другими словами... тренировка горячих источников!"
20010-200100140 = "Уф... Моя прошлая тренировка была полным провалом."
20010-200100150 = "Я понятия не имела, что кухня кайсэки настолько сложна и разнообразна..."
20010-200100160 = "Для человека, который каждый день ел пайки, это был совершенно новый, невообразимый мир."
20010-200100170 = "Но благодаря этому я узнала кое-что новое."
20010-200100180 = "Самое важное место на курорте с горячими источниками... это купальня!"
20010-200100190 = "Обычно так и есть."
20010-200100200 = "Курорт с горячими источниками буквально создан для того, чтобы наслаждаться горячими источниками."
20010-200100210 = "Если у нас будут отличные купальни, гости сами потянутся к нам."
20010-200100220 = "Так что на этот раз я сосредоточусь на поддержании чистоты в купальнях!"
20010-200100230 = "...Где?"
20010-200100240 = "После нескольких тренировок я наконец кое-что поняла."
20010-200100250 = "В конечном счёте гостеприимство заключается в отношении персонала, а не в дорогой кухне или удобствах..."
20010-200100260 = "Разве вкусная еда не важнее?"
20010-200100270 = "Разве хорошие купальни не важнее?"
20010-200100280 = "Ха."
20010-200100290 = "Но мы не можем этого сделать."
20010-200100300 = "На наши средства мы не можем готовить дорогие блюда или предлагать роскошные удобства..."
20010-200100310 = "В любом случае, я хочу воспользоваться возможностью и пройти специальную тренировку, чтобы освоить манеры достойной хозяйки курорта с горячими источниками."
20010-200100320 = "Другими словами... тренировка этикета!"
20010-200100330 = "Сенсей..."
20010-200100340 = "Что-то не так?"
20010-200100350 = "Нет, вовсе нет. Просто..."
20010-200100360 = "Поскольку вы носили меня на руках, когда я повредила одну ногу,"
20010-200100370 = "я подумала, может, случилось бы что-нибудь ещё лучше, если бы я повредила и вторую..."
20010-200100380 = "Не думай о таких ужасных вещах!"
20010-200100390 = "Лодыжка, которую я раньше подвернула, никак не проходит."
20010-200100400 = "В повседневной жизни почти не мешает, но всё ещё немного болит..."
20010-200100410 = "Так она начнёт мешать моим тренировкам на горячих источниках."
20010-200100420 = "Я слышала, поблизости есть источники для лечебных купаний..."
20010-200100430 = "Если вы не против, не хотите сходить со мной в эти выходные?"
20010-200100440 = "Да, пойду. Спасибо."
20010-200100450 = "А."
20010-200100460 = "Ч—"
20010-200100470 = "Чего-о-о?!"
20010-200100480 = "Вы собираетесь зайти со мной в купальню, Сенсей?"
