[translation]
20035-200350010 = "Bom diaaa~ Sensei."
20035-200350020 = "Ah, oi, Tsubaki."
20035-200350030 = "Estava treinando hoje também?"
20035-200350040 = "Sim, sou eu mesma~\nAcabei de terminar o treino... Fwaah..."
20035-200350050 = "Dessa vez não é um treino comum..."
20035-200350060 = "Por isso, resolvi me dedicar ainda mais do que de costume"
20035-200350070 = "e até troquei de roupa~"
20035-200350080 = "Não está usando a sua roupa de sempre hoje?"
20035-200350090 = "Não."
20035-200350100 = "Se você vier até Hyakkiyako..."
20035-200350110 = "Eu te mostro como ficou."
20035-200350120 = "Ei, Sensei..."
20035-200350130 = "Posso dar uma passada aí na Schale agora?"
20035-200350140 = "Claro, pode vir."
20035-200350150 = "Que coisa rara você vir até aqui, Tsubaki."
20035-200350160 = "Obrigadaaa~ Sensei.\nIsso também faz parte do meu treinamento de guia."
20035-200350170 = "Hoje eu sou Kasuga Tsubaki, a guia do sono..."
20035-200350180 = "Da última vez, acabei não conseguindo guiar o seu sono direito, lembra...?"
20035-200350190 = "Então hoje vou guiar você direitinho para compensar a última vez."
20035-200350200 = "Ou seja, você está vindo para a Schale para dormir..."
20035-200350210 = "Acho que no fim das contas dá na mesma, né...?"
20035-200350220 = "Mas hoje você vai dormir junto comigo, viu, Sensei?"
20035-200350230 = "Senseeei~"
20035-200350240 = "Ouvi dizer que você vem para Hyakkiyako a trabalho..."
20035-200350250 = "Sim, estou planejando ir."
20035-200350260 = "Entendi."
20035-200350270 = "Hehe, então..."
20035-200350280 = "Será que podemos nos encontrar um pouquinho depois do seu trabalho?"
20035-200350290 = "Quando terminar os seus compromissos... você me manda mensagem?"
20035-200350300 = "Combinado, até mais tarde."
20035-200350310 = "Obrigadaaa~"
20035-200350320 = "Como da outra vez também não consegui fazer o meu trabalho de guia do sono, quero fazer tudo certinho agora."
20035-200350330 = "Você ainda estava preocupada com aquilo, né?"
