[translation]
20035-200350010 = "Доброе утро~ Сенсей."
20035-200350020 = "А, это Цубаки."
20035-200350030 = "Ты сегодня тоже тренировалась?"
20035-200350040 = "Да, это я~\nТолько что закончила тренировку... зеваю"
20035-200350050 = "В этот раз не обычная тренировка..."
20035-200350060 = "Поэтому я решила отнестись к этому серьёзнее, чем обычно."
20035-200350070 = "И переоделась в другую одежду~"
20035-200350080 = "Ты сегодня не в обычной одежде?"
20035-200350090 = "Да."
20035-200350100 = "Если вы придёте в Хяккияко,"
20035-200350110 = "я вам покажу."
20035-200350120 = "Слушайте, Сенсей."
20035-200350130 = "Можно я сейчас приду в Шале?"
20035-200350140 = "Конечно, можно."
20035-200350150 = "Ты редко приходишь, Цубаки."
20035-200350160 = "Спасибо~ Сенсей.\nЭто тоже тренировка гида."
20035-200350170 = "Сегодня я — гид по сну, Касуга Цубаки..."
20035-200350180 = "В прошлый раз я не смогла как следует провести для вас гид по сну...?"
20035-200350190 = "Поэтому сегодня я хорошо всё сделаю, чтобы компенсировать то, что было раньше."
20035-200350200 = "Ты приходишь в Шале, чтобы спать..."
20035-200350210 = "Наверное, так и есть...?"
20035-200350220 = "Но сегодня и вы будете спать вместе со мной."
20035-200350230 = "Сенсей~"
20035-200350240 = "Я слышала, вы приезжаете в Хяккияко по работе..."
20035-200350250 = "Да, планирую."
20035-200350260 = "Вот как."
20035-200350270 = "Хе-хе, тогда"
20035-200350280 = "мы сможем встретиться после работы?"
20035-200350290 = "Вы напишете мне, когда закончите?"
20035-200350300 = "Да, увидимся позже."
20035-200350310 = "Спасибо~"
20035-200350320 = "В прошлый раз я не смогла провести гид по сну, так что на этот раз я хочу сделать это как следует."
20035-200350330 = "Ты беспокоилась об этом, да?"