[translation]
20035-200350010 = "Привет, Сенсей."
20035-200350020 = "О, Цубаки!"
20035-200350030 = "Ты сегодня тоже тренируешься?"
20035-200350040 = "Ага."
20035-200350050 = "Но сегодня"
20035-200350060 = "я особенно мотивирована."
20035-200350070 = "Я даже постаралась и переоделась перед тренировкой."
20035-200350080 = "Ты переоделась?"
20035-200350090 = "Да."
20035-200350100 = "Когда придёшь в Хяккияко,"
20035-200350110 = "я покажу тебе свой наряд."
20035-200350120 = "Кстати, Сенсей."
20035-200350130 = "Думаю прийти в Шале. Можно?"
20035-200350140 = "Конечно можно,"
20035-200350150 = "но я удивлён, что ты едешь так далеко."
20035-200350160 = "Ну, это само собой."
20035-200350170 = "Сейчас я Гид по сну Касуга Цубаки."
20035-200350180 = "В прошлый раз я не смогла провести для тебя полноценную экскурсию по сну, Сенсей..."
20035-200350190 = "Сегодня я исправлю эту ошибку."
20035-200350200 = "То есть ты устраиваешь ночёвку в Шале..."
20035-200350210 = "Не совсем,"
20035-200350220 = "потому что тебе тоже придётся уснуть, Сенсей."
20035-200350230 = "Сенсей,"
20035-200350240 = "Я слышала, ты приезжаешь в Хяккияко по работе. Это правда?"
20035-200350250 = "Ага, всё верно."
20035-200350260 = "Понятно."
20035-200350270 = "Хи-хи."
20035-200350280 = "В таком случае,"
20035-200350290 = "Позвони мне, когда закончишь... Хорошо?"
20035-200350300 = "Хорошо."
20035-200350310 = "И я серьёзно насчёт экскурсии по сну."
20035-200350320 = "На этот раз я обязательно устрою тебе полноценную."
20035-200350330 = "А, значит, ты всё ещё об этом думаешь..."
