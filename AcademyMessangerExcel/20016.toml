[translation]
20016-200160010 = "Сенсей, вы сейчас в Шале?"
20016-200160020 = "Да, а что?"
20016-200160030 = "Понятно."
20016-200160040 = "...Ироха?"
20016-200160050 = "Тогда я сегодня зайду, чтобы, ну, немного отдохнуть,"
20016-200160060 = "точнее, по рабочим вопросам."
20016-200160070 = "...Ироха, вы даже не пытаетесь скрыть, да?"
20016-200160080 = "Сенсей, вы сегодня тоже работаете?"
20016-200160090 = "Объём работы просто огромный..."
20016-200160100 = "Ну, я понимаю ваши чувства."
20016-200160110 = "Только разгребёшь, как появляется новое, думаешь, кто-то сделает, а никто не делает."
20016-200160120 = "Тяжело быть средним звеном, правда?"
20016-200160130 = "Кстати,"
20016-200160140 = "сегодня мне хочется чего-то горького."
20016-200160150 = "Закажите мне крепкий американо, пожалуйста."
20016-200160160 = "Ироха, вы видели моё предыдущее сообщение?"
20016-200160170 = "Да, конечно."
20016-200160180 = "Тогда до встречи позже."
20016-200160190 = "Может, это я что-то не понимаю..."
20016-200160200 = "Невыносимо."
20016-200160210 = "Ироха, что случилось?"
20016-200160220 = "Нет, ничего серьёзного, но..."
20016-200160230 = "Зачем людям так суетиться, думаю я..."
20016-200160240 = "Сенсей, есть ли смысл нам жить, если мы так устаём?"
20016-200160250 = "Разговор внезапно стал очень серьёзным, но я считаю, что смысл есть!?"
20016-200160260 = "Хлопотно, но ничего не поделаешь..."
20016-200160270 = "Мне даже писать уже лень."
20016-200160280 = "Д-держитесь..."
20016-200160290 = "Сенсей, вы сейчас заняты?"
20016-200160300 = "Я свободен."
20016-200160310 = "Вы сегодня тоже придёте?"
20016-200160320 = "Нет, сегодня я немного занята,"
20016-200160330 = "так что не смогу зайти в Шале..."
20016-200160340 = "Когда придёте, возьмите мне американо."
20016-200160350 = "Что...?"
20016-200160360 = "Спасибо за кофе."
20016-200160370 = "Не за что!?"
20016-200160380 = "Я открыла ту книгу, и..."
20016-200160390 = "вспомнила кое-что."
20016-200160400 = "Вкус сегодняшнего кофе."