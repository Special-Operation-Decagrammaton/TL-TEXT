[translation]
20016-200160010 = "Sensei, você está na Schale agora?"
20016-200160020 = "Sim, estou. O que houve?"
20016-200160030 = "Entendo."
20016-200160040 = "...Iroha?"
20016-200160050 = "Bom, então hoje também vou passar aí para matar trabalho..."
20016-200160060 = "Quer dizer, para tratar de assuntos profissionais."
20016-200160070 = "...Você nem faz questão de disfarçar, né, senhorita Iroha?"
20016-200160080 = "Sensei, trabalhando duro hoje também?"
20016-200160090 = "Tem uma montanha interminável de serviço aqui..."
20016-200160100 = "É, eu entendo perfeitamente como você se sente."
20016-200160110 = "Quando você acha que terminou, brota mais trabalho, e quando espera que alguém vá resolver, ninguém move um dedo."
20016-200160120 = "Vida de gerência intermediária não é fácil, né?"
20016-200160130 = "Por sinal..."
20016-200160140 = "Hoje estou com vontade de tomar algo amargo."
20016-200160150 = "Gostaria de um americano bem forte, por favor."
20016-200160160 = "Iroha, você leu as mensagens que eu mandei aí em cima?"
20016-200160170 = "Sim, claro que li."
20016-200160180 = "Então até daqui a pouco."
20016-200160190 = "Será que sou eu quem não está sabendo interpretar a conversa...?"
20016-200160200 = "Eu desisto, não dá mais."
20016-200160210 = "O que aconteceu, Iroha?"
20016-200160220 = "Não é nada demais, mas..."
20016-200160230 = "Fico me perguntando por que o ser humano precisa viver nessa correria sem fim..."
20016-200160240 = "Sensei, será que existe algum sentido em continuarmos vivendo à base de tanto esforço?"
20016-200160250 = "O papo ficou super pesado do nada, mas eu acho que existe sim?!"
20016-200160260 = "Que preguiça, mas não tenho escolha a não ser trabalhar..."
20016-200160270 = "Estou com preguiça até de digitar."
20016-200160280 = "F-Força aí..."
20016-200160290 = "Sensei, você está ocupado agora?"
20016-200160300 = "Estou livre."
20016-200160310 = "Vai vir pra cá hoje também?"
20016-200160320 = "Não, hoje estou meio atolada de coisas por aqui."
20016-200160330 = "Vai ser difícil dar uma passada na Schale, então..."
20016-200160340 = "Quando vier me ver, traga um copo de americano, por favor."
20016-200160350 = "Oi...?"
20016-200160360 = "Obrigada pelo café, estava ótimo."
20016-200160370 = "Por nada, disponha?!"
20016-200160380 = "Quando abri aquele livro depois de tanto tempo..."
20016-200160390 = "Acabei me lembrando de repente..."
20016-200160400 = "Do gosto do café de hoje."
