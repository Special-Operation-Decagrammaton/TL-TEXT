[translation]
20016-200160010 = "Сенсей, вы в Шале?"
20016-200160020 = "О, привет, Ироха. Да. А что?"
20016-200160030 = "Хорошо тогда."
20016-200160040 = "...Ироха? Что случилось?"
20016-200160050 = "Я иду к вам прогуливать работу..."
20016-200160060 = "Нет, то есть буду там по работе."
20016-200160070 = "...Прогуливать? Что?"
20016-200160080 = "Сенсей, какое у вас сегодня расписание?"
20016-200160090 = "Я сегодня по уши в делах..."
20016-200160100 = "О, понимаю ваши чувства."
20016-200160110 = "Только думаешь, что закончил, как появляется что-то ещё."
20016-200160120 = "Пытаешься делегировать — а оно возвращается бумерангом. Такова жизнь менеджера среднего звена."
20016-200160130 = "Однако..."
20016-200160140 = "Ну, сегодня я хочу крепкий американо."
20016-200160150 = "Почему-то хочется чего-нибудь горького и крепкого."
20016-200160160 = "Ироха, ты правда прочитала моё сообщение выше?"
20016-200160170 = "А? Конечно прочитала."
20016-200160180 = "Увидимся позже."
20016-200160190 = "Я уже даже не знаю, что сказать..."
20016-200160200 = "*вздох* Какая морока..."
20016-200160210 = "Ироха, что-то не так?"
20016-200160220 = "Нет, ничего серьёзного. Просто..."
20016-200160230 = "Я задумалась, почему людям приходится работать, чтобы жить..."
20016-200160240 = "Сенсей. В чём смысл всей этой тяжёлой работы?"
20016-200160250 = "Фух, тяжёлая тема. Думаю, смысл есть, но..."
20016-200160260 = "Даже если я очень не хочу что-то делать, наверное, выбора нет."
20016-200160270 = "Но всё равно раздражает."
20016-200160280 = "О, эм. Не унывай..."
20016-200160290 = "Сенсей, вы не заняты?"
20016-200160300 = "Мне нечем заняться! Приходи в гости!"
20016-200160310 = "Ты собираешься поехать в Шале?"
20016-200160320 = "Ах, я сегодня немного занят."
20016-200160330 = "У меня нет времени на визиты..."
20016-200160340 = "Так что, пожалуйста, принесите мне айс американо по дороге."
20016-200160350 = "Что...?"
20016-200160360 = "Спасибо за кофе."
20016-200160370 = "ТЕПЕРЬ ты так говоришь?!"
20016-200160380 = "Прошло много времени с тех пор, как я читал эту книгу."
20016-200160390 = "И глядя на неё я вспоминаю"
20016-200160400 = "вкус сегодняшнего кофе."
