[translation]
10130-101300010 = "Просто уточняю."
10130-101300020 = "Этот номер"
10130-101300030 = "принадлежит Сенсею, верно?"
10130-101300040 = "Верно, Субару."
10130-101300050 = "Какое облегчение."
10130-101300060 = "Далее — доклад о ситуации."
10130-101300070 = "В итоге я"
10130-101300080 = "взяла на себя патрулирование в Ариусе."
10130-101300090 = "Патрулирование?"
10130-101300100 = "Да."
10130-101300110 = "Просто держу вас в курсе."
10130-101300120 = "Понятно."
10130-101300130 = "Значит..."
10130-101300140 = "Надо бы мне заглянуть в Ариус!"
10130-101300150 = "Что? Вы придёте сюда?"
10130-101300160 = "Я не понимаю твою логику!"
10130-101300170 = "Здравствуйте, Сенсей"
10130-101300180 = "Наконец-то придёте как представитель студентов!"
10130-101300190 = "Полагаю, да."
10130-101300200 = "Я провела исследование"
10130-101300210 = "о работе представителя студентов от Шале."
10130-101300220 = "Так что я хорошо подготовлена."
10130-101300230 = "Нервничаешь?"
10130-101300240 = "Нет."
10130-101300250 = "Ничего подобного."
10130-101300260 = "С чего бы?"
10130-101300270 = "За кого вы меня принимаете?"
10130-101300280 = "Ну ко-о-онечно!"
10130-101300290 = "Да-да, конечно!"
10130-101300300 = "Сенсей...?"
10130-101300310 = "Наверное, это можно назвать школьной политикой,"
10130-101300320 = "но я устроилась на подработку."
10130-101300330 = "Субару?! На подработку?!"
10130-101300340 = "Не драматизируйте так."
10130-101300350 = "Это утомительно."
10130-101300360 = "Я просто делала свою работу и получила премию."
10130-101300370 = "Кажется, я не до конца понимаю внешний мир..."
10130-101300380 = "Возможно, людей, которые действительно усердно работают, найти не так-то просто..."
10130-101300390 = "...И мир всё ещё как-то работает?"
10130-101300400 = "...Удивительно, но да?"
10130-101300410 = "Пожалуйста, верните мне хоть немного веры в жизнь..."
10130-101300420 = "Здравствуйте, Сенсей."
10130-101300430 = "У вас сегодня выходной?"
10130-101300440 = "Только потому, что вчера я работал сверхурочно."
10130-101300450 = "Наконец-то я могу... отдохнуть..."
10130-101300460 = "Так взрослые не могут отдыхать, пока не закончат всю работу..."
10130-101300470 = "Уа-а-а, я тоже хочу быть ребёнком."
10130-101300480 = "Дай вкусняшек, Субару..."
10130-101300490 = "Ведите себя соответственно возрасту!"
10130-101300500 = "Серьёзно..."
10130-101300510 = "Я получила немного карманных денег"
10130-101300520 = "с прошлой подработки."
10130-101300530 = "Но я не уверена, на что хочу их потратить."
10130-101300540 = "Есть что-нибудь, что ты хочешь сделать или купить?"
10130-101300550 = "Что?"
10130-101300560 = "Эм..."
10130-101300570 = "Мм."
10130-101300580 = "Ну..."
10130-101300590 = "Не то чтобы"
10130-101300600 = "совсем ничего..."
10130-101300610 = "Я слишком долго была на вечернем ветру."
10130-101300620 = "Мне холодно."
10130-101300630 = "Возьмёте на себя ответственность?"
10130-101300640 = "...И как мне это сделать...?"
10130-101300650 = "Я просто шучу."
10130-101300660 = "Но вместо этого"
10130-101300670 = "в следующий раз снова сходите со мной за покупками."
10130-101300680 = "К тому времени я разучу ещё одну песню."
10130-101300690 = "Здравствуйте, Сенсей"
10130-101300700 = "Я на патруле, но решила поздороваться."
10130-101300710 = "Ты сегодня тоже патрулируешь?"
10130-101300720 = "Да, это важная работа."
10130-101300730 = "И я могу проверить, всё ли в порядке у тех, кого встречу"
10130-101300740 = "во время патруля."
10130-101300750 = "А кто позаботится о тебе, Субару?"
10130-101300760 = "Хм?"
10130-101300770 = "Я о таком не думаю."
10130-101300780 = "Мне вот интересно..."
10130-101300790 = "Можно ли играть хэви-метал на губной гармошке?"
10130-101300800 = "Эм... как учитель..."
10130-101300810 = "я бы хотел сказать, что нет ничего невозможного..."
10130-101300820 = "Правда? Ничего невозможного?"
10130-101300830 = "Хорошо, я вам верю."
10130-101300840 = "Тогда однажды я обязательно сыграю для вас хэви-метал на губной гармошке."
