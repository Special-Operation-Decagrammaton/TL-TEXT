[translation]
10130-101300010 = "Este número..."
10130-101300020 = "É mesmo o seu, Sensei?"
10130-101300030 = "Mandei mensagem apenas para confirmar."
10130-101300040 = "É o meu sim, pode ficar tranquila."
10130-101300050 = "Que alívio."
10130-101300060 = "Gostaria de informar como andam as coisas por aqui."
10130-101300070 = "Aconteceram várias coisas,"
10130-101300080 = "e acabei ficando encarregada de fazer as rondas por Arius."
10130-101300090 = "Rondas?"
10130-101300100 = "Sim."
10130-101300110 = "Queria apenas deixá-lo avisado por enquanto."
10130-101300120 = "Entendi."
10130-101300130 = "Então preciso ir"
10130-101300140 = "para Arius agora mesmo!"
10130-101300150 = "Hã?"
10130-101300160 = "Por quê?"
10130-101300170 = "Bom dia, Sensei."
10130-101300180 = "Hoje é o dia do seu plantão aqui, né, Subaru!"
10130-101300190 = "Isso mesmo."
10130-101300200 = "Sobre o trabalho na SCHALE,"
10130-101300210 = "fiz questão de pesquisar bastante coisa com antecedência."
10130-101300220 = "Estou totalmente preparada."
10130-101300230 = "Está um pouquinho nervosa?"
10130-101300240 = "Não."
10130-101300250 = "Nem um pouco."
10130-101300260 = "Não tem motivo nenhum para eu ficar nervosa."
10130-101300270 = "Está me subestimando, por acaso?"
10130-101300280 = "Entendi."
10130-101300290 = "Vamos fingir que é isso mesmo, então!"
10130-101300300 = "Sensei...?"
10130-101300310 = "Seguindo a nova diretriz da academia, digamos assim..."
10130-101300320 = "Decidi começar um trabalho de meio período."
10130-101300330 = "Você trabalhando de meio período, Subaru?!!"
10130-101300340 = "Não precisa ficar tão chocado assim!"
10130-101300350 = "Pare com isso, está me deixando sem graça!"
10130-101300360 = "Eu só fiz o básico que qualquer um faria, mas acabaram me pagando um bônus extra."
10130-101300370 = "Eu realmente não entendo como o mundo lá fora funciona..."
10130-101300380 = "É que não se encontra todo dia alguém capaz de fazer o que você fez..."
10130-101300390 = "...E a sociedade consegue funcionar direito desse jeito?"
10130-101300400 = "...Por incrível que pareça, sim."
10130-101300410 = "A-Agora é que eu não entendo mais nada mesmo..."
10130-101300420 = "Olá, Sensei."
10130-101300430 = "Hoje é dia de folga. Como está aproveitando o dia?"
10130-101300440 = "Como consegui dar conta de todo o serviço ontem..."
10130-101300450 = "Hoje finalmente posso descansar..."
10130-101300460 = "Então os adultos só podem descansar depois que terminam todo o trabalho..."
10130-101300470 = "É puxado... Acho que vou voltar a ser criança."
10130-101300480 = "Subaru-senpaaai, me dá um docinho~"
10130-101300490 = "O que você está dizendo?! Francamente..."
10130-101300500 = "Quanto a mim,"
10130-101300510 = "graças ao pagamento daquele bico do outro dia,"
10130-101300520 = "fiquei com um dinheirinho sobrando,"
10130-101300530 = "mas não faço ideia de como gastar."
10130-101300540 = "Não tem nada que você queira fazer ou comprar?"
10130-101300550 = "Hã?"
10130-101300560 = "Ah..."
10130-101300570 = "Huum..."
10130-101300580 = "Bem..."
10130-101300590 = "Não é que"
10130-101300600 = "não tenha nada, mas..."
10130-101300610 = "Acho que por ter ficado tomando vento por tanto tempo,"
10130-101300620 = "sinto que o meu corpo esfriou um pouco."
10130-101300630 = "Assuma a responsabilidade, Sensei."
10130-101300640 = "Como eu devo assumir a responsabilidade?!"
10130-101300650 = "É brincadeira."
10130-101300660 = "Em compensação,"
10130-101300670 = "me acompanhe nas compras de novo qualquer dia desses."
10130-101300680 = "Vou ensaiar outra música até lá."
10130-101300690 = "Olá, Sensei."
10130-101300700 = "Estou no meio da ronda, mas resolvi mandar mensagem."
10130-101300710 = "Dando duro hoje também?"
10130-101300720 = "É uma tarefa importante, afinal."
10130-101300730 = "Eu preciso "
10130-101300740 = "cuidar das minhas calouras."
10130-101300750 = "E quanto a cuidar de você mesma, Subaru?"
10130-101300760 = "Hã?"
10130-101300770 = "Nunca tinha parado muito para pensar nisso."
10130-101300780 = "Mas pensei um pouco aqui..."
10130-101300790 = "Será que dá para tocar heavy metal na gaita?"
10130-101300800 = "Bom, como professor,"
10130-101300810 = "eu gostaria de dizer que nada é impossível, mas..."
10130-101300820 = "Entendo."
10130-101300830 = "Se você diz, Sensei..."
10130-101300840 = "Um dia eu ainda vou tocar heavy metal na gaita, pode escrever!"
