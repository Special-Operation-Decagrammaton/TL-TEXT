[translation]
10130-101300010 = "Этот номер..."
10130-101300020 = "Ваш, Сенсей?"
10130-101300030 = "Я связалась, чтобы проверить."
10130-101300040 = "Да, всё верно."
10130-101300050 = "Хорошо."
10130-101300060 = "Я сообщу о последних событиях."
10130-101300070 = "Так получилось, что"
10130-101300080 = "я теперь патрулирую Ариус."
10130-101300090 = "Патрулируешь?"
10130-101300100 = "Да."
10130-101300110 = "Просто хотела сообщить вам."
10130-101300120 = "Понятно."
10130-101300130 = "Тогда сейчас же"
10130-101300140 = "нужно отправиться в Ариус!"
10130-101300150 = "Что?"
10130-101300160 = "С чего вдруг?"
10130-101300170 = "Доброе утро, Сенсей."
10130-101300180 = "Сегодня Субару дежурит!"
10130-101300190 = "Да."
10130-101300200 = "Насчёт работы в Шале"
10130-101300210 = "я заранее многое разузнала."
10130-101300220 = "Я готова."
10130-101300230 = "Немного волнуешься?"
10130-101300240 = "Нет."
10130-101300250 = "Совсем нет."
10130-101300260 = "С чего бы мне волноваться?"
10130-101300270 = "Вы меня недооцениваете?"
10130-101300280 = "Понятно."
10130-101300290 = "Будем считать, что так!"
10130-101300300 = "Сенсей...?"
10130-101300310 = "Такова политика академии..."
10130-101300320 = "я устроилась на подработку."
10130-101300330 = "Субару работает!?"
10130-101300340 = "Вы слишком удивлены!"
10130-101300350 = "Прекратите, мне неловко!"
10130-101300360 = "Я всего лишь сделала то, что должна, а мне ещё и заплатили сверх."
10130-101300370 = "Не понимаю этот внешний мир..."
10130-101300380 = "Такие люди редко встречаются, потому что..."
10130-101300390 = "... И при этом всё работает? Мир вообще?"
10130-101300400 = "... Да, как ни странно."
10130-101300410 = "Теперь я ещё меньше понимаю..."
10130-101300420 = "Здравствуйте, Сенсей."
10130-101300430 = "Сегодня выходной, как у вас дела?"
10130-101300440 = "Вчера я кое-как закончил работу..."
10130-101300450 = "и сегодня могу отдохнуть..."
10130-101300460 = "Взрослым нельзя отдыхать, пока не закончат работу..."
10130-101300470 = "Тяжело... может, стать ребёнком?"
10130-101300480 = "Субару, дайте мне сладостей."
10130-101300490 = "О чём вы говорите!? Ну вас..."
10130-101300500 = "Что касается меня,"
10130-101300510 = "благодаря деньгам с прошлой подработки"
10130-101300520 = "у меня появилось немного свободных средств,"
10130-101300530 = "но я не знаю, на что их потратить."
10130-101300540 = "Есть что-то, что ты хочешь сделать или купить?"
10130-101300550 = "А?"
10130-101300560 = "Ну..."
10130-101300570 = "М-м..."
10130-101300580 = "Хм..."
10130-101300590 = "Сказать, что ничего нет,"
10130-101300600 = "нельзя, но..."
10130-101300610 = "Похоже, из-за того, что я долго была на ветру,"
10130-101300620 = "я замёрзла."
10130-101300630 = "Вы за это ответите, Сенсей."
10130-101300640 = "И как мне ответить!?"
10130-101300650 = "Шучу."
10130-101300660 = "Вместо этого"
10130-101300670 = "в следующий раз снова пойдём по магазинам."
10130-101300680 = "К тому времени я выучу другую мелодию."
10130-101300690 = "Здравствуйте, Сенсей."
10130-101300700 = "Я в патруле, но решила написать."
10130-101300710 = "Ты и сегодня стараешься?"
10130-101300720 = "Это важно."
10130-101300730 = "Нужно присматривать"
10130-101300740 = "за младшими."
10130-101300750 = "А ты сама?"
10130-101300760 = "Что?"
10130-101300770 = "Я об этом не задумывалась."
10130-101300780 = "Но поразмыслив,"
10130-101300790 = "можно ли на губной гармошке играть хэви-метал?"
10130-101300800 = "Ну... как учитель, я хотел бы сказать, что нет ничего невозможного, но..."
10130-101300810 = "Понятно."
10130-101300820 = "Раз вы так говорите, Сенсей..."
10130-101300830 = "Я обязательно когда-нибудь сыграю хэви-метал на губной гармошке!"