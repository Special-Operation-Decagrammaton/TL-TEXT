[translation]
26009-260090010 = "Эм, Сенсей..."
26009-260090020 = "Тебе нравятся формы горничных?"
26009-260090030 = "Да, нравятся!"
26009-260090040 = "Почему спрашиваешь?"
26009-260090050 = "Понятно. Я так и думала..."
26009-260090060 = "Ничего особенного, правда..."
26009-260090070 = "Я просто думала добавить нового персонажа в игру, которую делаю."
26009-260090080 = "И подумала, что это могла бы быть горничная."
26009-260090090 = "Но у формы горничной так много мелких деталей и разновидностей... Это сложно."
26009-260090100 = "Я не совсем понимаю, как её реализовать..."
26009-260090110 = "Почему бы не спросить C&C?"
26009-260090120 = "Эм, просто участницы C&C..."
26009-260090130 = "Они немного пугающие."
26009-260090140 = "Я бы очень хотела найти другой вариант..."
26009-260090150 = "Сенсей."
26009-260090160 = "Как думаешь, какая подработка мне бы подошла?"
26009-260090170 = "Я работаю над новой игрой, но ресурсы заканчиваются."
26009-260090180 = "Такими темпами бюджета разработки не хватит..."
26009-260090190 = "Какие виды работы тебе нравятся?"
26009-260090200 = "Эм... Не уверена, что сейчас могу привередничать..."
26009-260090210 = "Но очень хотелось бы не встречаться со слишком большим количеством людей."
26009-260090220 = "Тогда я знаю идеальное кафе."
26009-260090230 = "Когда я там бываю, народу почти нет, а сотрудники добрые, так что, думаю, тебе будет комфортно."
26009-260090240 = "Ты думаешь, мне стоит... работать в кафе?"
26009-260090250 = "Эм, звучит немного страшно..."
26009-260090260 = "Но раз ты думаешь, что всё будет нормально, Сенсей, я попробую."
26009-260090270 = "Прости, Сенсей."
26009-260090280 = "Я пропустила твой звонок? Я была занята на работе..."
26009-260090290 = "Ничего. Я примерно так и подумал."
26009-260090300 = "Но почему ты звонишь в такое время? Всё в порядке?"
26009-260090310 = "Да, всё хорошо. Просто поняла, что завтра утром буду рядом с твоим кафе."
26009-260090320 = "Можно зайти в гости?"
26009-260090330 = "Что?!"
26009-260090340 = "Ты хочешь прийти в кафе горничных?"
26009-260090350 = "То есть, эм, конечно можно, просто я..."
26009-260090360 = "Эм, я..."
26009-260090370 = "Я просто немного нервничаю."
26009-260090380 = "В последнее время я слишком сосредоточилась на игре, которую делаю."
26009-260090390 = "И боюсь, моё рабочее место стало немного грязным..."
26009-260090400 = "Мне нужно потратить день на уборку, пока остальных участниц клуба нет."
26009-260090410 = "Ты усердно работаешь."
26009-260090420 = "Зайду помочь, если будет время."
26009-260090430 = "...А?"
26009-260090440 = "Почему?"
26009-260090450 = "Я всегда убираюсь одна."
26009-260090460 = "Правда?"
26009-260090470 = "Просто подумал, что с ещё одной парой рук будет легче."
26009-260090480 = "О! Спасибо, но я справлюсь."
26009-260090490 = "Но спасибо за предложение."
