[translation]
26009-260090010 = "Эм, Сенсей..."
26009-260090020 = "Вы любите горничных?"
26009-260090030 = "...Ну, в общем, да..."
26009-260090040 = "А что?"
26009-260090050 = "Понятно..."
26009-260090060 = "Дело в том, что..."
26009-260090070 = "в игре, которую я сейчас разрабатываю,"
26009-260090080 = "я планирую добавить персонажа-горничную."
26009-260090090 = "Ведь горничные пользуются определённой популярностью."
26009-260090100 = "Понимаете... я хотела бы подробнее узнать об устройстве формы горничной, но среди знакомых нет никого, у кого она есть... я подумала, что вы, возможно, знаете."
26009-260090110 = "А почему бы не попросить C&C?"
26009-260090120 = "Ну... я... я пока не хочу обращаться к другим..."
26009-260090130 = "Мне всё ещё... страшновато."
26009-260090140 = "Поищу другой способ..."
26009-260090150 = "Сенсей"
26009-260090160 = "Вы не знаете, где можно найти подработку, которая мне подойдёт?"
26009-260090170 = "Мне нужно собрать ресурсы для разработки новой игры..."
26009-260090180 = "Похоже, что текущих средств не хватит..."
26009-260090190 = "Понял. Какая работа тебя интересует?"
26009-260090200 = "Я не в том положении, чтобы выбирать, но..."
26009-260090210 = "по возможности, хотелось бы ту, где меньше контактов с людьми..."
26009-260090220 = "Тогда я порекомендую одно кафе, куда я часто хожу."
26009-260090230 = "Клиентов немного, и персонал там очень добрый."
26009-260090240 = "Обслуживание в кафе..."
26009-260090250 = "Мне немного тревожно, но..."
26009-260090260 = "Я доверюсь вам и попробую."
26009-260090270 = "Сенсей, вы, случайно, мне не звонили?"
26009-260090280 = "Извините, я была на работе и не могла ответить..."
26009-260090290 = "Всё в порядке. Я так и думал."
26009-260090300 = "Спасибо. А что вы хотели?"
26009-260090310 = "Завтра утром я буду проходить рядом с кафе, где ты работаешь."
26009-260090320 = "Если хочешь, могу зайти?"
26009-260090330 = "Да!? Завтра!?"
26009-260090340 = "А, нет, я не против, просто..."
26009-260090350 = "Всё-таки"
26009-260090360 = "немного"
26009-260090370 = "волнительно..."
26009-260090380 = "Наверное, потому что я в последнее время с утра до вечера занимаюсь разработкой,"
26009-260090390 = "чувствуется, что рабочее пространство немного захламилось..."
26009-260090400 = "Сегодня других никого нет, так что я потихоньку приберусь."
26009-260090410 = "Ты молодец."
26009-260090420 = "Если будет время, я зайду помочь."
26009-260090430 = "...Что?"
26009-260090440 = "Зачем?"
26009-260090450 = "Обычно уборкой занимаются в одиночку..."
26009-260090460 = "Разве...?"
26009-260090470 = "Я думал, что если нас будет больше, то мы быстрее закончим."
26009-260090480 = "Спасибо за заботу, но не нужно."
26009-260090490 = "Благодарю за внимание."