[translation]
26009-260090010 = "Hum, Sensei..."
26009-260090020 = "Você gosta... de maids?"
26009-260090030 = "...Bom, gosto sim, mas..."
26009-260090040 = "Por que a pergunta assim do nada?"
26009-260090050 = "Entendo..."
26009-260090060 = "Na verdade, hum..."
26009-260090070 = "No jogo que estamos desenvolvendo agora,"
26009-260090080 = "estou pensando em colocar uma personagem maid."
26009-260090090 = "Como maids têm um público fiel,"
26009-260090100 = "hum... eu queria entender melhor a estrutura de um uniforme de maid, mas não conheço ninguém próximo que tenha um... Aí pensei que talvez você entendesse do assunto, Sensei."
26009-260090110 = "Que tal pedir ajuda para a C&C?"
26009-260090120 = "Hum... P-pedir ajuda para outras pessoas..."
26009-260090130 = "Ainda me dá... um pouco de medo."
26009-260090140 = "Vou ver se encontro algum outro jeito..."
26009-260090150 = "Sensei"
26009-260090160 = "Você conhece algum trabalho de meio período que até alguém como eu consiga fazer?"
26009-260090170 = "Quero garantir os recursos necessários para desenvolver o nosso novo jogo..."
26009-260090180 = "Do jeito que está, acho que o orçamento vai ficar um pouco curto..."
26009-260090190 = "Entendi. Que tipo de trabalho você prefere?"
26009-260090200 = "Sei que não estou em posição de escolher, mas..."
26009-260090210 = "Se possível, algo em que eu precise lidar o mínimo possível com outras pessoas..."
26009-260090220 = "Nesse caso, vou te indicar uma cafeteria que costumo frequentar."
26009-260090230 = "Não tem muito movimento e os funcionários de lá são todos muito gentis."
26009-260090240 = "Atendimento em cafeteria, é...?"
26009-260090250 = "Fico um pouco insegura, mas..."
26009-260090260 = "Vou confiar em você e tentar, Sensei."
26009-260090270 = "Sensei, por acaso você me ligou?"
26009-260090280 = "Desculpe, eu estava no meio do expediente e não consegui atender..."
26009-260090290 = "Tudo bem. Imaginei que fosse isso mesmo."
26009-260090300 = "Muito obrigada. Qual era o assunto?"
26009-260090310 = "Amanhã de manhã vou passar perto da cafeteria onde você trabalha, Yuzu."
26009-260090320 = "Tudo bem se eu der uma passada aí?"
26009-260090330 = "Oi?! Amanhã?!"
26009-260090340 = "Ah, não, não é que não possa, mas..."
26009-260090350 = "Confesso que"
26009-260090360 = "fico um pouquinho"
26009-260090370 = "nervosa..."
26009-260090380 = "Talvez por eu estar desenvolvendo jogos de manhã até de noite ultimamente,"
26009-260090390 = "sinto que o meu espaço de trabalho ficou meio bagunçado..."
26009-260090400 = "Como as outras meninas não vêm hoje, vou aproveitar para limpar tudo com calma."
26009-260090410 = "Bom trabalho."
26009-260090420 = "Se eu tiver um tempinho, passo aí para ajudar."
26009-260090430 = "...Hã?"
26009-260090440 = "Por quê?"
26009-260090450 = "Normalmente faxina é algo que se faz sozinha, não é...?"
26009-260090460 = "Ué, é mesmo...?"
26009-260090470 = "Achei que com mais gente terminaria mais rápido."
26009-260090480 = "Fico feliz pela intenção, mas não precisa se preocupar."
26009-260090490 = "Muito obrigada pela consideração."
