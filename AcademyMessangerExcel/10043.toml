[translation]
10043-100430010 = "Sensei, há quanto tempo."
10043-100430020 = "Hoje está um verdadeiro dia de pleno verão. Como você tem passado?"
10043-100430030 = "Obrigado por se preocupar, Wakamo. Estou bem, sim."
10043-100430040 = "E você, Wakamo, está bem de saúde?"
10043-100430050 = "Aaah... Essa sua resposta gentil, que nunca muda não importa o momento..."
10043-100430060 = "Sim, pode ficar tranquilo. Esta Wakamo tem plena confiança na própria saúde."
10043-100430070 = "Ter saúde é o mais importante."
10043-100430080 = "Ufufu... A propósito, Sensei,"
10043-100430090 = "esta Wakamo sabe muito bem o quão extremamente atarefado você anda, meu querido, mas"
10043-100430100 = "por acaso hoje você também vai trabalhar...?"
10043-100430110 = "Sim, planejo ficar o dia inteiro na Schale hoje também... Por quê?"
10043-100430120 = "Entendo... Evitar o calor impiedoso do sol é algo bom, mas..."
10043-100430130 = "isso significa que o seu dia hoje não terá absolutamente nada de clima de verão, meu querido..."
10043-100430140 = "Sim... Isso seria uma pena imensa..."
10043-100430150 = "Hum... Wakamo?"
10043-100430160 = "Compreendo perfeitamente."
10043-100430170 = "Por você, meu querido, esta Wakamo vai arregaçar as mangas e entrar em ação."
10043-100430180 = "Por favor, aguarde ansiosamente♥"
10043-100430190 = "Hã...?"
10043-100430200 = "...O-o que você quer dizer com isso?"
10043-100430210 = "Sensei, como você está?"
10043-100430220 = "Ouvi dizer que você está na praia hoje a trabalho pela Schale."
10043-100430230 = "Estou sim, mas... como é que você ficou sabendo disso, Wakamo...?"
10043-100430240 = "É por causa daquele festival de fogos de artifício que estávamos preparando outro dia."
10043-100430250 = "Aaah, eu sabia...!"
10043-100430260 = "Hum... Se não for incomodar, eu gostaria muito de ir cumprimentá-lo, Sensei..."
10043-100430270 = "Desculpa! Hoje estou mesmo muito ocupado... Fica para a próxima!"
10043-100430280 = "Oh... Entendo."
10043-100430290 = "Quando eu terminar a maior parte do trabalho, dou um jeito...!"
10043-100430300 = "Depois do trabalho, então..."
10043-100430310 = "...Compreendo. É uma pena, mas deixemos para uma próxima oportunidade, então."
10043-100430320 = "Estarei aguardando... Ufufu."
10043-100430330 = "Sensei, como você está? ...Hum, se você não se importar,"
10043-100430340 = "conforme a promessa que me concedeu antes, poderíamos ir juntos..."
10043-100430350 = "Desculpa, Wakamo. Estou um pouco enrolado agora..."
10043-100430360 = "Pode me esperar só um pouquinho?"
10043-100430370 = "Sim. Compreendo perfeitamente."
10043-100430380 = "Esta Wakamo esperará por você pelo tempo que for preciso, meu querido."
10043-100430390 = "Muito obrigada pelo dia de hoje."
10043-100430400 = "Para esta Wakamo, o dia de hoje se tornou uma lembrança inestimável."
10043-100430410 = "Imagina, eu é que agradeço."
10043-100430420 = "Na próxima vez, vamos nos encontrar de um jeito mais normal."
10043-100430430 = "Sim, gravarei essas suas palavras no fundo do meu peito, meu querido."
10043-100430440 = "Na próxima vez... vejamos."
10043-100430450 = "Para que algo assim não volte a acontecer, farei como as outras pessoas"
10043-100430460 = "e irei visitá-lo entrando pelo portão principal da Schale."
10043-100430470 = "Ah, mas o portão principal costuma ficar com o sistema de segurança ativado."
10043-100430480 = "Ufufu, aquele sistema de segurança não é obstáculo algum para esta Wakamo."
10043-100430490 = "...Wakamo? Espera um pouco, isso quer dizer que..."
10043-100430500 = "Com estima."
10043-100430510 = "Hã, Wakamo!? Espera!?"
10043-100430520 = "Sensei, o calor intenso continua sem dar trégua."
10043-100430530 = "Você tem se sentido bem?"
10043-100430540 = "Quero ir à praia..."
10043-100430550 = "Quero descansar na beira do mar..."
10043-100430560 = "Se for esse o caso..."
10043-100430570 = "Esta Wakamo conhece uma praia bem tranquila."
10043-100430580 = "Se quiser, gostaria de passar um tempo lá comigo?"
10043-100430590 = "Parece ótimo!"
10043-100430600 = "Vamos agora mesmo!"
10043-100430610 = "Ufufu, muito obrigada."
10043-100430620 = "Então assumirei a responsabilidade de guiá-lo até lá, meu querido."
10043-100430630 = "Nos vemos daqui a pouco no local combinado."
10043-100430640 = "Hoje foi muito divertido."
10043-100430650 = "Se houver outra oportunidade, adoraria ir à praia com você novamente, meu querido."
10043-100430660 = "Sim, graças a você eu também me diverti bastante."
10043-100430670 = "Aaah, ouvir essas palavras faz o meu coração bater mais forte."
10043-100430680 = "Então, até o dia em que nos encontraremos de novo,"
10043-100430690 = "por favor, cuide-se bem."
