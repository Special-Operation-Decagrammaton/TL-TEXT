[translation]
10043-100430010 = "Сенсей, давно не виделись."
10043-100430020 = "Сегодня, кажется, настоящий летний зной, как твои дела?"
10043-100430030 = "Спасибо за беспокойство, Вакамо. У меня всё в порядке."
10043-100430040 = "А ты, Вакамо, как себя чувствуешь?"
10043-100430050 = "Ах... этот всегда неизменный, ласковый ответ..."
10043-100430060 = "Да, не волнуйся. Я, Вакамо, уверена в своём здоровье."
10043-100430070 = "Здоровье — это самое главное."
10043-100430080 = "Хе-хе-хе... кстати, Сенсей."
10043-100430090 = "Я, Вакамо, прекрасно знаю, что ты очень занят,"
10043-100430100 = "но, может быть, и сегодня...?"
10043-100430110 = "Да, сегодня я планирую весь день быть в Шале. А что?"
10043-100430120 = "Вот как... Хорошо, что можно укрыться от беспощадного солнца, но..."
10043-100430130 = "это значит, что сегодня для тебя совсем не летний день..."
10043-100430140 = "Это слишком..."
10043-100430150 = "Э-э... Вакамо?"
10043-100430160 = "Я поняла."
10043-100430170 = "Ради тебя я, Вакамо, приложу все усилия."
10043-100430180 = "Ожидайте с нетерпением ♥"
10043-100430190 = "Что...?"
10043-100430200 = "...Что это значит?"
10043-100430210 = "Сенсей, как твои дела?"
10043-100430220 = "Я слышала, что сегодня ты по работе будешь на море."
10043-100430230 = "Да, но... откуда ты, Вакамо, узнала...?"
10043-100430240 = "По поводу того фестиваля фейерверков, который мы готовили."
10043-100430250 = "Ах, я так и знала...!"
10043-100430260 = "Ну... если тебе не трудно, я хотела бы поприветствовать тебя..."
10043-100430270 = "Прости! Сегодня я правда очень занят... Давай в другой раз!"
10043-100430280 = "Ах... вот как."
10043-100430290 = "Если я закончу хоть часть дел, то смогу...!"
10043-100430300 = "Если после работы..."
10043-100430310 = "...Хорошо. Тогда, к сожалению, перенесём."
10043-100430320 = "Я буду ждать... хе-хе-хе."
10043-100430330 = "Сенсей, как твои дела? ...Если тебе не трудно,"
10043-100430340 = "как мы и договаривались, не могли бы мы вместе..."
10043-100430350 = "Прости, Вакамо. Я сейчас немного занят..."
10043-100430360 = "Можешь немного подождать?"
10043-100430370 = "Да, конечно."
10043-100430380 = "Я, Вакамо, буду ждать тебя сколько угодно."
10043-100430390 = "Спасибо за сегодняшний день."
10043-100430400 = "Для меня, Вакамо, сегодняшний день стал важным воспоминанием."
10043-100430410 = "Нет, это я благодарен."
10043-100430420 = "Давай в следующий раз встретимся как-нибудь обычно."
10043-100430430 = "Да, я запечатлею твои слова глубоко в сердце."
10043-100430440 = "В следующий раз... да."
10043-100430450 = "Чтобы такого не повторилось, как всегда,"
10043-100430460 = "я приду через главные ворота Шале."
10043-100430470 = "Ах, главные ворота обычно охраняются."
10043-100430480 = "Хе-хе-хе, такая охрана для меня, Вакамо, вовсе не помеха."
10043-100430490 = "...Вакамо? Подожди, это значит..."
10043-100430500 = "С уважением"
10043-100430510 = "Эй, Вакамо!? Подожди!?"
10043-100430520 = "Сенсей, стоит невыносимая жара,"
10043-100430530 = "но как твоё самочувствие?"
10043-100430540 = "Хочу на море..."
10043-100430550 = "Хочу отдохнуть на пляже..."
10043-100430560 = "Тогда..."
10043-100430570 = "Я, Вакамо, знаю один тихий пляж."
10043-100430580 = "Если хотите, не провести ли тебе время там?"
10043-100430590 = "Отлично!"
10043-100430600 = "Пойдём прямо сейчас!"
10043-100430610 = "Хе-хе-хе, спасибо."
10043-100430620 = "Тогда я с радостью проведу тебя."
10043-100430630 = "Встретимся позже на условленном месте."
10043-100430640 = "Сегодня было очень весело."
10043-100430650 = "Если будет возможность, я бы хотела снова сходить с тобой на море."
10043-100430660 = "Да, благодаря тебе мне тоже было весело."
10043-100430670 = "Ах, от этих слов моё сердце бьётся быстрее."
10043-100430680 = "Тогда до нашей новой встречи."
10043-100430690 = "Будь здоров."
