[translation]
10043-100430010 = "Сенсей. Сегодня особенно жарко."
10043-100430020 = "Как твоё здоровье?"
10043-100430030 = "О, спасибо за заботу, Вакамо. Я в порядке."
10043-100430040 = "А ты как?"
10043-100430050 = "О, ты всегда такой добрый."
10043-100430060 = "У меня всё отлично. Я совершенно уверена в своём здоровье."
10043-100430070 = "Нет ничего важнее здоровья."
10043-100430080 = "О, кстати, Сенсей..."
10043-100430090 = "Я знаю, что ты всегда занят работой, но..."
10043-100430100 = "Ты собираешься...?"
10043-100430110 = "Сегодня я весь день буду в Шале. Что такое?"
10043-100430120 = "Понятно... Я рада, что в это беспощадно жаркое лето ты будешь не на солнце,"
10043-100430130 = "но тогда ты не увидишь этот прекрасный день."
10043-100430140 = "А, теперь я поняла."
10043-100430150 = "А? Что вы имеете в виду?"
10043-100430160 = "Я поняла, что нужно сделать, Сенсей."
10043-100430170 = "Я сделаю для тебя всё что угодно."
10043-100430180 = "Пожалуйста, жди."
10043-100430190 = "А...? Эм... Вакамо?"
10043-100430200 = "...Эй?"
10043-100430210 = "Эм... Сенсей."
10043-100430220 = "Я слышала, ты ездил на ближайший пляж по делам Шале."
10043-100430230 = "Да... Ты всегда отлично осведомлена..."
10043-100430240 = "Я ездил туда из-за местного летнего фестиваля фейерверков."
10043-100430250 = "О, понятно...!"
10043-100430260 = "Ну... если ты не против... я хотела бы тебя увидеть."
10043-100430270 = "О, прости, Вакамо! Я сейчас очень занят."
10043-100430280 = "Х-хорошо... Я понимаю."
10043-100430290 = "Но позже я освобожусь."
10043-100430300 = "Позже тоже подойдёт..."
10043-100430310 = "Хорошо, договорились. Тогда увидимся позже."
10043-100430320 = "Я буду ждать тебя. Хи-хи-хи."
10043-100430330 = "Сенсей. Если ты не против..."
10043-100430340 = "Как мы и обещали раньше..."
10043-100430350 = "Прости, Вакамо! Я сейчас очень занят."
10043-100430360 = "Можешь меня подождать?"
10043-100430370 = "Конечно."
10043-100430380 = "Я всегда буду тебя ждать."
10043-100430390 = "Большое спасибо, что провёл сегодня со мной время, Сенсей."
10043-100430400 = "Сегодня у меня появились очень особенные воспоминания."
10043-100430410 = "У меня тоже."
10043-100430420 = "В следующий раз давай встретимся более... нормально."
10043-100430430 = "Да, я обязательно это запомню."
10043-100430440 = "В следующий раз... Да."
10043-100430450 = "Вместо того чтобы вот так ждать..."
10043-100430460 = "я приду к главным воротам Шале, чтобы увидеть тебя."
10043-100430470 = "Но там камеры наблюдения."
10043-100430480 = "Хи-хи-хи. Охрана для меня совсем не проблема."
10043-100430490 = "...А? Вакамо? Подожди, это значит..."
10043-100430500 = "Тогда до встречи. Пока-пока."
10043-100430510 = "О, э-эй! Вакамо?!"
10043-100430520 = "Сенсей. Как ты сегодня себя чувствуешь?"
10043-100430530 = "Я увидела, насколько жарко, и забеспокоилась о тебе."
10043-100430540 = "Я хочу к морю..."
10043-100430550 = "Хочу отдохнуть на пляже..."
10043-100430560 = "Ах, в таком случае..."
10043-100430570 = "Я, Вакамо, как раз знаю один уединённый пляж."
10043-100430580 = "Не хочешь провести там спокойный отдых... вместе со мной?"
10043-100430590 = "Да! Звучит отлично!"
10043-100430600 = "Пойдём прямо сейчас!"
10043-100430610 = "Фу-фу, спасибо."
10043-100430620 = "Я очень хорошо о тебе позабочусь."
10043-100430630 = "Тогда встретимся там."
10043-100430640 = "Сенсей. Сегодня было очень весело."
10043-100430650 = "Если возможно, я хотела бы снова побывать с тобой на пляже."
10043-100430660 = "Мне тоже было весело."
10043-100430670 = "А-а-а! От твоего ответа моё сердце так колотится."
10043-100430680 = "Тогда однажды снова встретимся у моря."
10043-100430690 = "До тех пор желаю тебе покоя."
