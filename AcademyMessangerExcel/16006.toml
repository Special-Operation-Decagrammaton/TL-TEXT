[translation]
16006-160060010 = "Сенсей! Лето! Лето!"
16006-160060020 = "Раз лето, надо сходить поесть летней еды!"
16006-160060030 = "Летней еды, значит..."
16006-160060040 = "Да, пойдём! Я устал от работы!"
16006-160060050 = "Холодное, кисло-сладкое, насыщенные вкусы — они зовут нас!"
16006-160060060 = "...Я уже проголодалась! Так куда пойдём?"
16006-160060070 = "Верно-верно, в занятые дни еда особенно важна!"
16006-160060080 = "Да. Кстати, есть место, куда хочется пойти?"
16006-160060090 = "Ага, для начала...!"
16006-160060100 = "Я думаю пойти в пляжную закусочную!"
16006-160060110 = "Отлично, это же классика."
16006-160060120 = "Вот именно!"
16006-160060130 = "И, похоже, это не обычная пляжная закусочная!"
16006-160060140 = "Говорят, если выиграешь в игре, можно получить бесплатно местные деликатесы!"
16006-160060150 = "Ого, я немного загорелся!"
16006-160060160 = "Тут только идти, правда?"
16006-160060170 = "Тогда встречаемся перед закусочной! Увидимся позже, Сенсей!"
16006-160060180 = "Слушай, Сенсей. Раз уж лето, я..."
16006-160060190 = "хочу есть летние деликатесы всё больше и больше!"
16006-160060200 = "Да, сезонные продукты лучше есть в сезон."
16006-160060210 = "Но я поняла, Сенсей:"
16006-160060220 = "деликатесы сами не придут, если их ждать!"
16006-160060230 = "Как будто из клуба гурманов!"
16006-160060240 = "Да, у них ведь ног нет. ...Обычно."
16006-160060250 = "Ага! Нельзя просто сидеть с открытым ртом и ждать, еда сама не придёт!"
16006-160060260 = "Если только ты не будешь кормить меня чипсами, Сенсей."
16006-160060270 = "Э, ты намекаешь, чтобы я тебя покормил...?"
16006-160060280 = "Чипсы потом... А сейчас отправимся на поиски летних деликатесов!"
16006-160060290 = "Наша команда «Вечнолетние гурманы» в деле!"
16006-160060300 = "Команда «Вечнолетние гурманы»...?"
16006-160060310 = "...Что?"
16006-160060320 = "Я буду ждать тебя в том месте!"
16006-160060330 = "Сенсей!"
16006-160060340 = "Наше путешествие в поисках деликатесов команды «Вечнолетние гурманы» ещё не закончилось!"
16006-160060350 = "Тебе так нравится это название..."
16006-160060360 = "Итак, что же будем есть сегодня?"
16006-160060370 = "Можно попробовать знаменитое джелато на западном побережье..."
16006-160060380 = "Или вкусные вафли на восточной улице..."
16006-160060390 = "Но сейчас меня больше всего интересует..."
16006-160060400 = "Слышала, в ларьке на центральной улице продают «такояки со вкусом клубники и банана»!"
16006-160060410 = "Изуми, ты, похоже, не боишься летней жары."
16006-160060420 = "Ведь нас ждёт столько вкусной еды!"
16006-160060430 = "Нельзя терять время, Сенсей!"
16006-160060440 = "Тогда сегодня снова жду у пляжной закусочной!"
16006-160060450 = "Если опоздаешь, я съем половину твоей порции!"
16006-160060460 = "Это не проблема... но смотри, не объешься."
16006-160060470 = "Оставим эти мелочи~"
16006-160060480 = "Пойдём на море, Сенсей!!"
16006-160060490 = "Ты даже научилась пропускать объяснения..."
16006-160060500 = "Фух... учить тебя больше нечему."
16006-160060510 = "Э-э-э...?"
16006-160060520 = "Не знаю, как объяснить, но говорят, сегодня особенно жарко!"
16006-160060530 = "Поэтому, чтобы забыть о жаре..."
16006-160060540 = "мы отправляемся в ещё более весёлое путешествие за деликатесами!"