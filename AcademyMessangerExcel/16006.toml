[translation]
16006-160060010 = "Sensei! É verão! Verão!"
16006-160060020 = "E já que é verão, a gente precisa sair pra comer pratos com cara de verão!"
16006-160060030 = "Pratos com cara de verão, é......"
16006-160060040 = "Bora! Tô exausto de tanto trabalhar!"
16006-160060050 = "Aquele agridoce geladinho e aqueles temperos bem marcantes estão chamando pela gente!"
16006-160060060 = "......Já até bateu uma fome! E aí, pra onde a gente vai?"
16006-160060070 = "Isso aí! Quanto mais corrido o trabalho, mais importante é comer bem!"
16006-160060080 = "Verdade. Aliás, já tem algum lugar em mente que você queira ir?"
16006-160060090 = "Sim, pra começar tem que ser lá......!"
16006-160060100 = "Tô pensando em ir numa barraca de praia!"
16006-160060110 = "Boa, clássico de verão mesmo"
16006-160060120 = "Né?!"
16006-160060130 = "E parece que não é uma barraca de praia comum, viu!"
16006-160060140 = "Fiquei sabendo que, se a gente vencer um jogo lá, ganha uma iguaria da casa totalmente de graça como prêmio!"
16006-160060150 = "Opa, agora até eu me animei!"
16006-160060160 = "Não tem como a gente perder uma dessas, né?!"
16006-160060170 = "Então combinado, nos vemos na frente da barraca! Até daqui a pouco, Sensei!"
16006-160060180 = "Ei, Sensei. Já que estamos no verão, eu......"
16006-160060190 = "Quero provar muito, muito mais iguarias de verão!"
16006-160060200 = "Realmente, pratos da estação têm que ser aproveitados enquanto a temporada dura"
16006-160060210 = "Mas eu percebi uma coisa, Sensei"
16006-160060220 = "Não adianta ficar parada esperando, as iguarias não vêm até a gente sozinhas!"
16006-160060230 = "Frase digna da Sociedade de Pesquisa Gourmet!"
16006-160060240 = "Pois é, comida não cria perna pra sair andando. ......Bom, normalmente não"
16006-160060250 = "Isso mesmo! Ficar de boca aberta olhando pro nada não faz a comida cair do céu!"
16006-160060260 = "A menos que você esteja bem do meu ladinho me dando batata frita na boca, Sensei!"
16006-160060270 = "Ué, isso foi uma indireta pra eu fazer isso de novo......?"
16006-160060280 = "Deixando a batata frita pra depois...... vamos lá caçar as iguarias de verão!"
16006-160060290 = "É hora da nossa Dupla Gourmet de Verão entrar em ação!"
16006-160060300 = "Dupla Gourmet de Verão......?"
16006-160060310 = "......Que história é essa?"
16006-160060320 = "Tô te esperando lá naquele lugar, viu!"
16006-160060330 = "Sensei!"
16006-160060340 = "A jornada da nossa Dupla Gourmet de Verão atrás de iguarias ainda não acabou!"
16006-160060350 = "Você gostou mesmo desse nome, hein......"
16006-160060360 = "Sendo assim, o que vamos comer hoje?"
16006-160060370 = "Aquele gelato famoso lá da praia do lado oeste parece ótimo......"
16006-160060380 = "E aquele waffle super elogiado da avenida leste também é uma boa, mas......"
16006-160060390 = "O que mais tá me deixando curiosa agora é......!"
16006-160060400 = "O tal do \"takoyaki sabor morango com banana\" que ouvi dizer que estão vendendo numa barraquinha da avenida central!"
16006-160060410 = "Izumi, pelo visto o calor do verão nunca tira o seu apetite, né?"
16006-160060420 = "Claro que não, tem um monte de comida gostosa esperando pela gente!"
16006-160060430 = "Não podemos perder tempo, Sensei!"
16006-160060440 = "Vou ficar te esperando na frente da barraca de praia hoje de novo, tá?!"
16006-160060450 = "Se você atrasar, eu vou comer metade da sua porção também, hein!"
16006-160060460 = "Por mim tudo bem...... só toma cuidado pra não passar mal"
16006-160060470 = "Deixa os detalhes pra lá~"
16006-160060480 = "Vamos pra praia, Sensei!!"
16006-160060490 = "Agora você aprendeu até a pular as explicações......"
16006-160060500 = "Ufa...... não tenho mais nada a te ensinar"
16006-160060510 = "Hããã......?"
16006-160060520 = "Não entendi muito bem, mas disseram que hoje vai fazer um calor especial!"
16006-160060530 = "Então, pra esquecer o calorão......"
16006-160060540 = "Vamos partir pra mais uma jornada super divertida atrás de iguarias!"
