[translation]
16006-160060010 = "Сенсей! Событие!"
16006-160060020 = "Нам нужно пойти попробовать фирменные блюда!"
16006-160060030 = "Фирменные блюда...?"
16006-160060040 = "Если ты этого хочешь — идём!"
16006-160060050 = "Фирменные блюда зовут нас, Сенсей!"
16006-160060060 = "Д-Да?"
16006-160060070 = "Я знала, что вы сразу согласитесь, Сенсей!"
16006-160060080 = "Итак, что тебя заинтересовало?"
16006-160060090 = "На этот раз..."
16006-160060100 = "в Пляжной хижине началось специальное летнее событие!"
16006-160060110 = "Пляжная хижина? Звучит по-летнему."
16006-160060120 = "Правда? Правда?!"
16006-160060130 = "И вот что самое главное!"
16006-160060140 = "Если победить в игре, получишь кучу призов и еды!"
16006-160060150 = "Это действительно аппетитно."
16006-160060160 = "Тогда решено!"
16006-160060170 = "Увидимся в Пляжной хижине, Сенсей!"
16006-160060180 = "Нам нужно вернуться на пляж, Сенсей!"
16006-160060190 = "Я хочу ещё летней еды!"
16006-160060200 = "Летняя еда довольно вкусная."
16006-160060210 = "Но я кое-что поняла, Сенсей..."
16006-160060220 = "Она сама ко МНЕ не придёт!"
16006-160060230 = "Вот это дух Общества исследования гурманства!"
16006-160060240 = "Ты входишь во вкус!"
16006-160060250 = "Ага! Сидеть на месте как дура не поможет мне наесться."
16006-160060260 = "Ну, кроме всех ваших чипсов, которыми вы со мной поделитесь."
16006-160060270 = "Когда это я на такое соглашался?!"
16006-160060280 = "Тогда вперёд за летней едой!"
16006-160060290 = "Тур по летней-летней еде начинается!"
16006-160060300 = "Летней-летней...?"
16006-160060310 = "Тур по еде...?"
16006-160060320 = "Буду ждать!"
16006-160060330 = "Сенсей!"
16006-160060340 = "Тур по летней-летней еде только начинается!"
16006-160060350 = "Тебе правда нравится это название, да?"
16006-160060360 = "Итак! Что будем есть сегодня?"
16006-160060370 = "Знаменитое джелато с Западного пляжа было бы отлично!"
16006-160060380 = "Вафельный торт с Восточной улицы тоже хорош..."
16006-160060390 = "Но то, что мы обязательно должны попробовать..."
16006-160060400 = "это такояки со вкусом клубники и банана из того магазинчика на Центральной улице!"
16006-160060410 = "То есть мы снова идём есть?"
16006-160060420 = "Верно! Нельзя терять время, Сенсей!"
16006-160060430 = "Если ещё подождём, всё вкусное раскупят!"
16006-160060440 = "Увидимся у Пляжной хижины, Сенсей!"
16006-160060450 = "Кто опоздает, отдаёт другому половину своей порции!"
16006-160060460 = "К-Конечно. Ладно."
16006-160060470 = "Мы можем оставить все заботы позади"
16006-160060480 = "и отправиться в море, Сенсей!"
16006-160060490 = "Оставить заботы позади..."
16006-160060500 = "Ты выпустилась, Изуми. Мне больше нечему тебя учить."
16006-160060510 = "...?"
16006-160060520 = "Я слышала, сегодня будет очень жарко!"
16006-160060530 = "Так что, чтобы победить жару..."
16006-160060540 = "нам стоит отправиться в гастрономическое приключение!"
