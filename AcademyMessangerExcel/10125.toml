[translation]
10125-101250010 = "Хе-хе-хе"
10125-101250020 = "Здравствуйте, Мастер."
10125-101250030 = "Сегодня мир тоже полон маны!"
10125-101250040 = "Как у вас настроение, Мастер?"
10125-101250050 = "Не знаю, полно ли маны, но энергии хоть отбавляй!"
10125-101250060 = "Бесполезно притворяться."
10125-101250070 = "Ведь я вижу это по гаданию."
10125-101250080 = "Вчера вы тоже задерживались на работе допоздна, верно?"
10125-101250090 = "Кх...!"
10125-101250100 = "Давайте сегодня на время забудем о работе"
10125-101250110 = "и спокойно проведём время со мной?"
10125-101250120 = "Отдых так же важен, как и работа."
10125-101250130 = "Пожалуй, так и сделаю."
10125-101250140 = "Тогда куплю что-нибудь из сладостей."
10125-101250150 = "Хе-хе, как и ожидалось, наши сердца с Мастером бьются в унисон."
10125-101250160 = "Тогда я буду ждать!"
10125-101250170 = "Сегодня было очень весело, Мастер."
10125-101250180 = "Благодаря вам я некоторое время могу не беспокоиться, что мана иссякнет."
10125-101250190 = "А вы, Мастер, смогли хоть немного восполнить свою ману?"
10125-101250200 = "Да! Я полон сил!"
10125-101250210 = "Хе-хе"
10125-101250220 = "Если захотите снова сменить обстановку, всегда обращайтесь."
10125-101250230 = "Ведь нас связывает магия."
10125-101250240 = "Мастер!"
10125-101250250 = "Беда!"
10125-101250260 = "Произошло нечто ужасное!"
10125-101250270 = "Тебя преследует патруль общежития?"
10125-101250280 = "Нет!"
10125-101250290 = "Всё гораздо серьёзнее!"
10125-101250300 = "Даже гадание не смогло этого предвидеть...!"
10125-101250310 = "Что именно случилось?"
10125-101250320 = "Видите ли,"
10125-101250330 = "сегодня у меня практический экзамен по живописи, но..."
10125-101250340 = "на экзаменационной площадке"
10125-101250350 = "запрещено носить шляпу...!"
10125-101250360 = "............"
10125-101250370 = "Мастер..."
10125-101250380 = "Практический экзамен... закончился..."
10125-101250390 = "Как прошло? Удачно?"
10125-101250400 = "Хе..."
10125-101250410 = "Хе-хе-хе..."
10125-101250420 = "Мастер,"
10125-101250430 = "я подумываю изучить новое заклинание."
10125-101250440 = "«Заклинание забвения»..."
10125-101250450 = "Если бы оно у меня было..."
10125-101250460 = "я смогла бы стереть все эти позорные воспоминания!"
10125-101250470 = "К-как ты собираешься их стереть!?"
10125-101250480 = "Нанести сильный физический удар по голове!"
10125-101250490 = "Не горячись! В следующий раз обязательно получится!"
10125-101250500 = "... Д-думаете?"
10125-101250510 = "Уф..."
10125-101250520 = "В любом случае... спасибо большое за сегодня."
10125-101250530 = "Увидимся в ближайшее время..."
10125-101250540 = "Мастер..."
10125-101250550 = "После того практического экзамена мана совсем не восстанавливается."
10125-101250560 = "Даже когда открываю гримуар, не вижу пути..."
10125-101250570 = "Что же мне делать...?"
10125-101250580 = "Хочешь сменить обстановку рядом с Шале?"
10125-101250590 = "О, кажется, от одних этих слов у меня прибавилось сил!"
10125-101250600 = "Неужели это..."
10125-101250610 = "магия слов, заключающая силу в словах!?"
10125-101250620 = "Н-но эта магия давно утеряна...!"
10125-101250630 = "Мастер, откуда вам известна такая древняя магия...!"
10125-101250640 = "..."
10125-101250650 = "Уф..."
10125-101250660 = "Простите."
10125-101250670 = "Обычно такие разговоры о магии поднимают мне настроение,"
10125-101250680 = "но сегодня почему-то совсем нет сил..."
10125-101250690 = "Однако я поняла, Мастер."
10125-101250700 = "Я сейчас же приду к вам."
10125-101250710 = "Вы благополучно добрались?"
10125-101250720 = "Сегодня я переосмыслила очень многое..."
10125-101250730 = "Это был поистине волшебный день."
10125-101250740 = "Чувствую, что мой магический уровень вырос сразу на два ранга."
10125-101250750 = "А магия сотворения мира десятого ранга, вы сможете её применить?"
10125-101250760 = "До такого пока далеко..."
10125-101250770 = "Но близкие к ней заклинания я уже могу использовать."
10125-101250780 = "Магия, которая позволяет нарисовать на холсте свой собственный мир..."
10125-101250790 = "Хе-хе-хе"
10125-101250800 = "Ждите нашей следующей встречи!"
10125-101250810 = "Мастер. Наконец настал тот час."
10125-101250820 = "Час, когда я покажу вам свою «магию сотворения мира»!"
10125-101250830 = "О, наконец-то!"
10125-101250840 = "Хотя она ещё не на сто процентов завершена,"
10125-101250850 = "я вложу в неё всю свою ману и подготовлюсь."
10125-101250860 = "Тогда встретимся в академии!"
10125-101250870 = "Мастер. Спасибо вам большое за сегодня."
10125-101250880 = "Благодаря вам я обрела уверенность."
10125-101250890 = "Значит, я немного продвинулась вперёд."
10125-101250900 = "Да! На следующем экзамене у тебя точно всё получится!"
10125-101250910 = "Если мне снова придётся снимать шляпу..."
10125-101250920 = "Фу-у... я постараюсь изо всех сил."
10125-101250930 = "Кстати, вы сохранили мой портрет?"
10125-101250940 = "Да. Повешу его на видное место."
10125-101250950 = "Хе-хе-хе"
10125-101250960 = "Спасибо."
10125-101250970 = "Каждый раз, глядя на эту картину, вспоминайте обо мне, хорошо?"
10125-101250980 = "Тогда до новой встречи!"
10125-101250990 = "Пусть на вас снизойдёт магия счастья!"