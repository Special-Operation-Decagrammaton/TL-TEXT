[translation]
10125-101250010 = "Nyufufufu"
10125-101250020 = "Saudações, Mestre."
10125-101250030 = "O mundo está transbordando de mana hoje também!"
10125-101250040 = "E como está o seu estado hoje, Mestre?"
10125-101250050 = "Não sei dizer sobre o mana, mas estou cheio de energia!"
10125-101250060 = "Não adianta tentar disfarçar, sabia?"
10125-101250070 = "Eu já vi tudo na minha adivinhação."
10125-101250080 = "Você ficou fazendo hora extra até tarde ontem de novo, não foi?"
10125-101250090 = "Guh...!"
10125-101250100 = "Que tal deixar o trabalho um pouco de lado hoje"
10125-101250110 = "e passar um tempo relaxando comigo?"
10125-101250120 = "Afinal, o descanso é tão importante quanto o trabalho."
10125-101250130 = "Acho que vou aceitar a sugestão."
10125-101250140 = "Então vou passar para comprar uns doces no caminho."
10125-101250150 = "Nyufufu, sabia que os nossos corações estavam conectados, Mestre!"
10125-101250160 = "Estarei esperando por você!"
10125-101250170 = "Hoje foi muito divertido mesmo, Mestre."
10125-101250180 = "Graças a você, não precisarei me preocupar em ficar sem mana por um bom tempo."
10125-101250190 = "E você, Mestre? Conseguiu recarregar um pouco do seu mana?"
10125-101250200 = "Sim! Estou sentindo o poder transbordar!"
10125-101250210 = "Nyufufu"
10125-101250220 = "Sempre que quiser espairecer de novo, é só me chamar."
10125-101250230 = "Afinal, estamos ligados pela magia!"
10125-101250240 = "Mestre!"
10125-101250250 = "É uma emergência!"
10125-101250260 = "Aconteceu uma catástrofe terrível!"
10125-101250270 = "Está sendo perseguida pela Guarda do Dormitório de novo?"
10125-101250280 = "Não é isso!"
10125-101250290 = "É muito mais grave!"
10125-101250300 = "Como pude não prever isso nem nas minhas adivinhações...?!"
10125-101250310 = "O que foi que aconteceu?"
10125-101250320 = "É que..."
10125-101250330 = "Hoje eu tenho uma prova prática de pintura, só que..."
10125-101250340 = "Na sala do exame..."
10125-101250350 = "É proibido usar chapéu...!"
10125-101250360 = "............"
10125-101250370 = "Mestre..."
10125-101250380 = "A prova prática... acabou..."
10125-101250390 = "E como foi? Deu tudo certo?"
10125-101250400 = "Nyu..."
10125-101250410 = "Nyufufufu..."
10125-101250420 = "Mestre,"
10125-101250430 = "estou pensando em pesquisar uma nova magia."
10125-101250440 = "Chama-se \"Magia do Esquecimento\"..."
10125-101250450 = "Com ela..."
10125-101250460 = "Poderei apagar todas essas memórias vergonhosas de uma vez por todas!"
10125-101250470 = "C-Como você pretende apagar isso?!"
10125-101250480 = "Aplicando um forte impacto físico direto no crânio!"
10125-101250490 = "Não faça nenhuma loucura! Na próxima vai dar tudo certo!"
10125-101250500 = "...V-Você acha mesmo?"
10125-101250510 = "Haaaa..."
10125-101250520 = "Enfim... muito obrigada por hoje, de verdade."
10125-101250530 = "Nos vemos em breve..."
10125-101250540 = "Mestre..."
10125-101250550 = "Desde aquela prova prática, o meu poder mágico não voltou ao normal."
10125-101250560 = "Mesmo abrindo o meu grimório, não consigo enxergar o caminho a seguir..."
10125-101250570 = "O que eu devo fazer...?"
10125-101250580 = "Quer dar uma volta perto da SCHALE para espairecer?"
10125-101250590 = "Oh! Só de ler a sua mensagem, sinto minhas forças voltando!"
10125-101250600 = "N-Não me diga que isso é..."
10125-101250610 = "A \"Magia do Kotodama\", que infunde poder mágico nas palavras?! "
10125-101250620 = "M-Mas essa magia deveria ter se perdido há eras...!"
10125-101250630 = "Mestre, como você domina uma magia ancestral dessas...?!"
10125-101250640 = "..."
10125-101250650 = "Haaa..."
10125-101250660 = "Desculpe."
10125-101250670 = "Normalmente, conversar sobre magia assim já me deixaria animada,"
10125-101250680 = "mas hoje não consigo reunir forças de jeito nenhum..."
10125-101250690 = "Mesmo assim, entendido, Mestre."
10125-101250700 = "Estou indo para aí agora mesmo."
10125-101250710 = "Chegou bem em casa?"
10125-101250720 = "Hoje você me fez refletir sobre tantas coisas..."
10125-101250730 = "Foi realmente um dia mágico."
10125-101250740 = "Sinto até que minha proficiência mágica subiu uns dois níveis de uma vez!"
10125-101250750 = "Acha que já consegue usar a \"Magia da Criação do Mundo\" de Décimo Nível?"
10125-101250760 = "Aí já seria demais..."
10125-101250770 = "Mas acho que já consigo usar uma magia bem parecida."
10125-101250780 = "A magia de dar vida ao meu próprio mundo sobre a tela..."
10125-101250790 = "Nyufufufu"
10125-101250800 = "Aguarde ansiosamente pelo nosso próximo encontro!"
10125-101250810 = "Mestre. Finalmente a hora chegou."
10125-101250820 = "A hora de lhe mostrar a minha \"Magia da Criação do Mundo\"!"
10125-101250830 = "Opa, finalmente chegou o grande dia!"
10125-101250840 = "Ainda não posso dizer que está 100% perfeita,"
10125-101250850 = "mas vou concentrar todo o meu poder mágico para deixar tudo pronto."
10125-101250860 = "Nos vemos na academia, então!"
10125-101250870 = "Mestre. Muito obrigada por hoje, de coração."
10125-101250880 = "Graças a você, recuperei toda a minha confiança."
10125-101250890 = "Isso significa que consegui dar um passo à frente, não é?"
10125-101250900 = "Sim! Tenho certeza de que você vai se sair super bem na próxima prova!"
10125-101250910 = "Mesmo se eu tiver que tirar o chapéu de novo..."
10125-101250920 = "Fuu... Vou dar o meu melhor dentro do possível."
10125-101250930 = "A propósito, você... levou o retrato direitinho?"
10125-101250940 = "Sim. Vou deixá-lo exposto em um lugar bem visível."
10125-101250950 = "Nyufufufu"
10125-101250960 = "Muito obrigada."
10125-101250970 = "Promete se lembrar de mim toda vez que olhar para esse quadro?"
10125-101250980 = "Pois bem, até o dia em que nos encontrarmos novamente!"
10125-101250990 = "Que a magia da felicidade recaia sobre você também, Mestre!"
10125-101251000 = "Mestre! É verdade que você vem à academia hoje?"
10125-101251010 = "Sim! Quer que eu leve alguma coisa?"
10125-101251020 = "Nyufufu, hoje não precisa se preocupar!"
10125-101251030 = "Pelo contrário, sou eu quem tenho uma oferenda para lhe conceder."
10125-101251040 = "Ultimamente, a inspiração tem jorrado sem parar,"
10125-101251050 = "e a minha Magia da Criação do Mundo está a todo vapor!"
10125-101251060 = "Embora eu ainda tenha muito a aprender..."
10125-101251070 = "Gostaria muito de entregar uma obra especialmente a você, Mestre."
10125-101251080 = "Pretendo ficar no ateliê o dia todo hoje,"
10125-101251090 = "então, se puder, venha me ver!"
10125-101251100 = "Mal posso esperar!"
10125-101251110 = "Mestre, me perdoe..."
10125-101251120 = "Eu estava fora de mim..."
10125-101251130 = "Na próxima vez que nos encontrarmos,"
10125-101251140 = "estarei agindo normalmente, eu juro!"
10125-101251150 = "Está tudo bem, não precisa esquentar a cabeça com isso!"
10125-101251160 = "O quadro ficou incrível, vou pendurar no meu escritório!"
10125-101251170 = "...Sim!"
10125-101251180 = "Fico tão feliz que tenha gostado!"
10125-101251190 = "Então, até o dia em que nos encontrarmos novamente!"
