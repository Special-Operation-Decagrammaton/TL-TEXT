[translation]
10125-101250010 = "Нюхуху."
10125-101250020 = "Здравствуйте, Мастер."
10125-101250030 = "Сегодня мир снова переполнен маной!"
10125-101250040 = "А как насчёт тебя, Мастер?"
10125-101250050 = "Не знаю насчёт маны, но энергии у меня хоть отбавляй!"
10125-101250060 = "Правда?"
10125-101250070 = "Перед моим гаданием твоя ложь раскрывается!"
10125-101250080 = "Ты ведь вчера снова работал сверхурочно, да?"
10125-101250090 = "Ай!"
10125-101250100 = "Вот именно! Так что сегодня отложи работу,"
10125-101250110 = "и вместо этого проведи время со мной!"
10125-101250120 = "Одна работа без отдыха до добра не доведёт, Сенсей!"
10125-101250130 = "Ты права. Давай!"
10125-101250140 = "Мне купить по дороге что-нибудь перекусить?"
10125-101250150 = "Нюхуху. Я знала, что ты поймаешь мою волну, Мастер."
10125-101250160 = "С нетерпением жду твоего прибытия!"
10125-101250170 = "Сегодня было так весело, Мастер."
10125-101250180 = "Благодаря тебе мне какое-то время не придётся беспокоиться о запасе маны."
10125-101250190 = "А ты смог подзарядиться, Мастер?"
10125-101250200 = "Ага! Я прямо переполнен силой!"
10125-101250210 = "Нюхуху."
10125-101250220 = "Когда тебе снова понадобится передышка, просто скажи мне!"
10125-101250230 = "Теперь мы связаны нашей магией!"
10125-101250240 = "Мастер!"
10125-101250250 = "Чрезвычайная ситуация!"
10125-101250260 = "Самая настоящая чрезвычайная ситуация!"
10125-101250270 = "Совет Префектов снова за тобой охотится?"
10125-101250280 = "Нет, не в этом дело!"
10125-101250290 = "На этот раз я серьёзно!"
10125-101250300 = "Даже мой магический гримуар не предвидел такого!"
10125-101250310 = "Ладно, ладно. Что случилось?"
10125-101250320 = "В общем..."
10125-101250330 = "Сегодня у меня практический экзамен..."
10125-101250340 = "Но я не могу"
10125-101250350 = "надеть на экзамен свою ведьминскую шляпу..."
10125-101250360 = "..."
10125-101250370 = "Здравствуйте, Мастер."
10125-101250380 = "Сегодня я сдавала практический экзамен."
10125-101250390 = "И как? Всё прошло хорошо?"
10125-101250400 = "Хуху..."
10125-101250410 = "Нюхуху..."
10125-101250420 = "Мастер."
10125-101250430 = "Я собираюсь начать исследовать новый вид магии."
10125-101250440 = "Магию стирания воспоминаний!"
10125-101250450 = "Если бы я смогла это сделать..."
10125-101250460 = "Я могла бы стереть все до единого постыдные воспоминания!"
10125-101250470 = "И-И как бы работала такая магия?"
10125-101250480 = "Нужно просто хорошенько и сильно стукнуть по голове!"
10125-101250490 = "Всё хорошо! В следующий раз получится лучше!"
10125-101250500 = "...Надеюсь."
10125-101250510 = "У-у-у..."
10125-101250520 = "Но всё равно спасибо за сегодня, Мастер."
10125-101250530 = "Может, в следующий раз..."
10125-101250540 = "Мастер..."
10125-101250550 = "Моя магическая сила всё ещё не восстановилась после прошлого практического экзамена."
10125-101250560 = "И мой магический гримуар тоже молчит..."
10125-101250570 = "Что мне делать?"
10125-101250580 = "Может, тебе просто нужно сменить обстановку! В Шале!"
10125-101250590 = "!!! От одной этой мысли силы уже возвращаются ко мне!"
10125-101250600 = "...Неужели это"
10125-101250610 = "магия, накладываемая словами?"
10125-101250620 = "Я думала, такая магия давно исчезла!"
10125-101250630 = "Как ты колдуешь древнюю магию, Мастер?!"
10125-101250640 = "..."
10125-101250650 = "Ух."
10125-101250660 = "Прошу прощения."
10125-101250670 = "Обычно мне достаточно просто поговорить о магии, чтобы стало лучше."
10125-101250680 = "Но сейчас я правда совсем не могу собраться с силами."
10125-101250690 = "В любом случае, звучит неплохо!"
10125-101250700 = "Скоро увидимся!"
10125-101250710 = "Ты благополучно добрался домой, Мастер?"
10125-101250720 = "Ты дал мне много пищи для размышлений."
10125-101250730 = "Это и правда был волшебный день."
10125-101250740 = "Такое чувство, будто я разом поднялась на два круга."
10125-101250750 = "Как думаешь, ты можешь использовать «Магию сотворения мира» 10-го круга?"
10125-101250760 = "Не настолько,"
10125-101250770 = "но, думаю, я могу сотворить нечто похожее."
10125-101250780 = "Магию, создающую мой собственный мир на холсте."
10125-101250790 = "Нюхуху."
10125-101250800 = "Что ж, тогда с нетерпением жди нашей следующей встречи!"
10125-101250810 = "Мастер. Время наконец пришло."
10125-101250820 = "Пора показать тебе мою версию магии сотворения мира!"
10125-101250830 = "О-о-о! Наконец-то!"
10125-101250840 = "Я ещё не довела её до совершенства,"
10125-101250850 = "но соберу всю свою магическую силу и постараюсь изо всех сил!"
10125-101250860 = "Приходи ко мне в академию!"
10125-101250870 = "Мастер. Огромное спасибо за сегодня."
10125-101250880 = "Ты помог мне почувствовать себя увереннее."
10125-101250890 = "Пусть небольшой, но сегодня я сделала ещё один шаг вперёд!"
10125-101250900 = "Ага! И следующий экзамен у тебя точно пройдёт отлично!"
10125-101250910 = "Но если мне снова не разрешат надеть шляпу..."
10125-101250920 = "У-у-у... Я постараюсь!"
10125-101250930 = "Кстати, ты сохранил портрет?"
10125-101250940 = "Ага! Повешу его на самом видном месте!"
10125-101250950 = "Нюхуху."
10125-101250960 = "Отлично."
10125-101250970 = "Каждый раз, когда будешь на него смотреть, вспоминай обо мне!"
10125-101250980 = "И до нашей следующей встречи."
10125-101250990 = "Пусть магия счастья благословит тебя!"
10125-101251000 = "マスター！今日学院に来るって本当ですか？"
10125-101251010 = "うん！何か持って行こうか？"
10125-101251020 = "にゅふふ、今は大丈夫ですぞ"
10125-101251030 = "逆に、私から授けたい品がありまして"
10125-101251040 = "最近、インスピレーションがどかどか湧いて"
10125-101251050 = "世界創造魔法が絶好調なんです！"
10125-101251060 = "まだまだ未熟ではありますが……"
10125-101251070 = "マスターには、ぜひ1枚お渡ししたいなと"
10125-101251080 = "今日はずっとアトリエにいる予定ですので"
10125-101251090 = "よければ会いに来てください！"
10125-101251100 = "楽しみにしてるね！"
10125-101251110 = "マスター、ごめんなさい……"
10125-101251120 = "正気じゃなかったです……"
10125-101251130 = "次にお会いする時は"
10125-101251140 = "いつも通りなので！"
10125-101251150 = "大丈夫だから気にしすぎないで！"
10125-101251160 = "絵、すごく良かったから執務室に飾るね！"
10125-101251170 = "……はい！"
10125-101251180 = "気に入っていただけてよかったです！"
10125-101251190 = "では、またお会いするその日まで！"
