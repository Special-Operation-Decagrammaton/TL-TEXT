[translation]
20030-200300010 = "Sensei."
20030-200300020 = "Agora que a Grande Gincana Esportiva começou..."
20030-200300030 = "Gostaria de fazer uma proposta \"especial\" a você."
20030-200300040 = "O que me diz?"
20030-200300050 = "Opa, parece interessante."
20030-200300060 = "Ufufu."
20030-200300070 = "Tenho certeza de que para nós dois..."
20030-200300080 = "Será uma experiência simplesmente inesquecível."
20030-200300090 = "Mas hoje vai ser meio difícil."
20030-200300100 = "Tenho um trabalho urgente que não posso adiar..."
20030-200300110 = "Ora?"
20030-200300120 = "Eu tenho plena ciência do quão ocupado você costuma ser, Sensei, mas..."
20030-200300130 = "É raro ver você recusar de forma tão categórica assim."
20030-200300140 = "Interessante..."
20030-200300150 = "Sim, deveras interessante."
20030-200300160 = "Haruna...?"
20030-200300170 = "Sensei."
20030-200300180 = "Como está a sua programação para o dia de hoje?"
20030-200300190 = "Me pediram para fazer a patrulha do local do evento..."
20030-200300200 = "Então provavelmente vou passar o dia andando para lá e para cá."
20030-200300210 = "Compreendo."
20030-200300220 = "Que pena."
20030-200300230 = "Porém, fico mais tranquila em saber que você estará presente no local do evento."
20030-200300240 = "Hum... Desculpa mesmo, tá...?"
20030-200300250 = "Não há motivo algum para se desculpar."
20030-200300260 = "Pelo contrário..."
20030-200300270 = "Ficar imaginando quando e onde vou esbarrar com você durante a sua patrulha..."
20030-200300280 = "Deixou tudo ainda mais emocionante. Nos vemos pelo evento, então."
20030-200300290 = "Já que estamos na Grande Gincana Esportiva..."
20030-200300300 = "Decidi que também vou participar de uma das modalidades."
20030-200300310 = "Você competindo, Haruna?!"
20030-200300320 = "Fufufu."
20030-200300330 = "E se eu puder contar com a sua torcida, Sensei..."
20030-200300340 = "Sentirei uma motivação inigualável para dar o meu melhor."
20030-200300350 = "Pode deixar que vou torcer com todas as forças."
20030-200300360 = "Muito obrigada. Nos vemos na arena, então."
20030-200300370 = "Fazia tempo que não me exercitava assim, foi muito divertido."
20030-200300380 = "Graças a isso, fiquei com muito mais apetite do que o normal."
20030-200300390 = "Fazer exercício é muito importante, né?"
20030-200300400 = "E aproveitando o assunto..."
20030-200300410 = "Você poderia me conceder um pouco do seu tempo hoje à noite?"
20030-200300420 = "Claro, com certeza."
20030-200300430 = "Que alegria ouvir isso."
20030-200300440 = "Mostrarei a você a verdadeira essência da gastronomia."
20030-200300450 = "O clima aqui na arena está fervendo de animação."
20030-200300460 = "Imagino que você também esteja muito atarefado, Sensei."
20030-200300470 = "Tranquilo, acabei de dar uma pausa nas tarefas por aqui."
20030-200300480 = "Hum... Compreendo."
20030-200300490 = "Nesse caso, se não for incomodar..."
20030-200300500 = "Podemos nos encontrar agora?"
20030-200300510 = "Ora, ora."
20030-200300520 = "Não esperava que o convite partisse de você, Sensei."
20030-200300530 = "Pois bem, estarei esperando."
