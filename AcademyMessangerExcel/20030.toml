[translation]
20030-200300010 = "Сенсей"
20030-200300020 = "В связи с началом большого спортивного праздника"
20030-200300030 = "я хотела бы сделать «особое» предложение."
20030-200300040 = "Как вам?"
20030-200300050 = "О, звучит интересно."
20030-200300060 = "У-хе-хе"
20030-200300070 = "Для нас"
20030-200300080 = "это, несомненно, станет незабываемым опытом."
20030-200300090 = "Но сегодня, наверное, не получится."
20030-200300100 = "У меня есть работа, которую нужно сделать..."
20030-200300110 = "Ой?"
20030-200300120 = "Я знаю, что вы заняты,"
20030-200300130 = "но слышать это от вас довольно необычно."
20030-200300140 = "Интересно..."
20030-200300150 = "Да, очень интересно."
20030-200300160 = "Харуна...?"
20030-200300170 = "Сенсей"
20030-200300180 = "Какое у вас расписание на сегодня?"
20030-200300190 = "Меня попросили патрулировать площадку..."
20030-200300200 = "Так что, видимо, придётся много ходить."
20030-200300210 = "Вот как."
20030-200300220 = "Это печально."
20030-200300230 = "Но раз вы будете на площадке, я спокойна."
20030-200300240 = "Эм... прости, хорошо?"
20030-200300250 = "Вам не за что извиняться."
20030-200300260 = "Наоборот..."
20030-200300270 = "Теперь я даже с нетерпением жду, когда и где встречу вас во время патруля."
20030-200300280 = "Тогда до встречи на площадке."
20030-200300290 = "Раз уж это большой спортивный праздник,"
20030-200300300 = "я тоже подумала поучаствовать в соревнованиях."
20030-200300310 = "Харуна!?"
20030-200300320 = "Хе-хе-хе"
20030-200300330 = "Если вы будете меня поддерживать,"
20030-200300340 = "я смогу показать всё, на что способна."
20030-200300350 = "Я буду болеть за тебя изо всех сил."
20030-200300360 = "Спасибо. Тогда увидимся на стадионе."
20030-200300370 = "Давно я так не двигалась, было весело."
20030-200300380 = "Из-за этого я проголодалась больше обычного."
20030-200300390 = "Спорт — это важно."
20030-200300400 = "И вот, кстати..."
20030-200300410 = "Не могли бы вы уделить мне немного времени сегодня вечером?"
20030-200300420 = "Да, конечно."
20030-200300430 = "Как приятно."
20030-200300440 = "Я покажу вам истинную суть гастрономии."
20030-200300450 = "На площадке просто невероятная атмосфера."
20030-200300460 = "Вы, наверное, очень заняты, Сенсей."
20030-200300470 = "Всё в порядке, я как раз закончил одну часть дел."
20030-200300480 = "Хм... понятно."
20030-200300490 = "Тогда, если вы не против..."
20030-200300500 = "Вы можете встретиться со мной сейчас?"
20030-200300510 = "Ой"
20030-200300520 = "Вы сами меня приглашаете."
20030-200300530 = "Тогда я буду ждать вас."