[translation]
20030-200300010 = "Здравствуйте, Сенсей."
20030-200300020 = "Итак, в честь спортивного праздника..."
20030-200300030 = "я хотела бы сделать тебе особое предложение."
20030-200300040 = "Как тебе звучит?"
20030-200300050 = "Особое предложение от Харуны? Звучит волнующе."
20030-200300060 = "Хи-хи-хи."
20030-200300070 = "Опыт точно будет незабываемым."
20030-200300080 = "Таким, который мы никогда не забудем."
20030-200300090 = "Но боюсь, сегодня будет сложно."
20030-200300100 = "Сначала мне нужно кое с чем разобраться."
20030-200300110 = "...?"
20030-200300120 = "Сенсей, я знаю, что ты всегда очень занят, но..."
20030-200300130 = "я никогда не слышала, чтобы ты говорил, что у тебя нет времени на студента."
20030-200300140 = "Как интригующе."
20030-200300150 = "Да, очень интригующе."
20030-200300160 = "Харуна...?"
20030-200300170 = "Сенсей."
20030-200300180 = "Как у тебя сегодня с расписанием?"
20030-200300190 = "Меня попросили следить за спортивной площадкой..."
20030-200300200 = "Занят. Буду носиться повсюду."
20030-200300210 = "Понятно."
20030-200300220 = "Ну, это"
20030-200300230 = "немного разочаровывает... но одновременно даёт надежду."
20030-200300240 = "Эм... Прости, что разочаровал?"
20030-200300250 = "Не переживай."
20030-200300260 = "Разочарование есть, да, но"
20030-200300270 = "ещё у меня есть предвкушение,"
20030-200300280 = "что мы можем случайно встретиться в какой-нибудь момент."
20030-200300290 = "Знаешь, если подумать,"
20030-200300300 = "может, мне тоже стоит принять участие в соревнованиях."
20030-200300310 = "Хочешь участвовать?"
20030-200300320 = "Хи-хи-хи."
20030-200300330 = "Если ты будешь болеть за меня, Сенсей,"
20030-200300340 = "думаю, я отлично выступлю."
20030-200300350 = "Обязательно буду болеть за тебя."
20030-200300360 = "Тогда увидимся на поле."
20030-200300370 = "Было приятно наконец немного размяться."
20030-200300380 = "Вообще-то у меня даже появился аппетит."
20030-200300390 = "Физические упражнения важны, правда?"
20030-200300400 = "Сенсей, я тут подумала..."
20030-200300410 = "Сможешь сегодня вечером найти время на ужин со мной?"
20030-200300420 = "Конечно, смогу."
20030-200300430 = "Рад это слышать."
20030-200300440 = "Я покажу тебе, на что способно Общество исследования гурманства."
20030-200300450 = "Какая напряжённая атмосфера."
20030-200300460 = "Уверена, ты тоже очень занят, Сенсей."
20030-200300470 = "Большинство крупных мероприятий уже закончилось."
20030-200300480 = "Понятно."
20030-200300490 = "Тогда у тебя сейчас есть свободная минутка?"
20030-200300500 = "Хочешь встретиться?"
20030-200300510 = "Ох."
20030-200300520 = "Не ожидала, что ты сам предложишь."
20030-200300530 = "Тогда я буду ждать."
