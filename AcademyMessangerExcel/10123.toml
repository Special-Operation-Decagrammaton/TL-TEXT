[translation]
10123-101230010 = "Сенсей"
10123-101230020 = "Можно одолжить немного вашего времени?"
10123-101230030 = "У меня... своего рода чрезвычайная ситуация."
10123-101230040 = "Да, конечно, но... что происходит?"
10123-101230050 = "Чрезвычайная ситуация? Ты где?"
10123-101230060 = "Я сейчас же приду."
10123-101230070 = "До Шале мне недолго добираться."
10123-101230080 = "Скоро увидимся."
10123-101230090 = "Довольно весело менять привычный стиль одежды."
10123-101230100 = "Пожалуй, это немного не похоже на меня."
10123-101230110 = "Но в каком-то смысле — именно на меня."
10123-101230120 = "Разговор стал неожиданно глубоким."
10123-101230130 = "Оба утверждения верны."
10123-101230140 = "Да."
10123-101230150 = "Пусть это и двусмысленно, зато в нужный момент может стать хорошим оправданием."
10123-101230160 = "И достаточно гибко, чтобы подходить к самым разным рассуждениям."
10123-101230170 = "Хорошо, тогда"
10123-101230180 = "я с интересом жду, как вы"
10123-101230190 = "ответите."
10123-101230200 = "Похоже,"
10123-101230210 = "всё подходит к концу."
10123-101230220 = "В этот момент..."
10123-101230230 = "я хочу, чтобы вы были рядом со мной, Сенсей."
10123-101230240 = "*кхе-кхе*"
10123-101230250 = "Можете... помочь мне?"
10123-101230260 = "Кто вообще пишет «кхе» в чате? лол"
10123-101230270 = "Какой розыгрыш ты на этот раз задумала?"
10123-101230280 = "О боже"
10123-101230290 = "Похоже, это не сработало."
10123-101230300 = "Что ж, хорошо."
10123-101230310 = "В любом случае, присоединитесь ко мне?"
10123-101230320 = "Надо было сразу действовать так."
10123-101230330 = "С учётом сегодняшнего счёт 1 - 1"
10123-101230340 = "Буду ждать следующего раза."
10123-101230350 = "Это что, какое-то соревнование?"
10123-101230360 = "Ты считаешь победы и поражения?"
10123-101230370 = "Да? Конечно?"
10123-101230380 = "Ваши и мои, Сенсей."
10123-101230390 = "В любом случае,"
10123-101230400 = "когда появится возможность, я снова с вами поговорю."
10123-101230410 = "Какое невероятное достижение."
10123-101230420 = "Я услышала то, чего никогда не могла представить."
10123-101230430 = "Невероятное достижение?"
10123-101230440 = "Что-то, чего ты не могла представить?"
10123-101230450 = "Да."
10123-101230460 = "Раз уж это ещё и хорошая новость,"
10123-101230470 = "я удостою вас особым визитом, Сенсей."
10123-101230480 = "Поездка была весёлой."
10123-101230490 = "Пишите, когда снова захочется прокатиться."
10123-101230500 = "Но меня вообще-то похитили?!"
10123-101230510 = "Моё настроение... вообще для тебя важно?!"
10123-101230520 = "Ну, как есть."
10123-101230530 = "Фу-фу."
10123-101230540 = "Спасибо, Сенсей."
10123-101230550 = "Не думаю, что будет преувеличением сказать: благодаря вам я полностью изменилась."
10123-101230560 = "Так что"
10123-101230570 = "Пожалуйста,"
10123-101230580 = "и дальше"
10123-101230590 = "заботьтесь обо мне."
