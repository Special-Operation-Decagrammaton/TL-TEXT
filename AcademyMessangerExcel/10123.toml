[translation]
10123-101230010 = "Terias um momento livre agora?"
10123-101230020 = "Surgiu uma situação que requer certa urgência."
10123-101230030 = "Seria de grande ajuda se pudesses me atender."
10123-101230040 = "Tudo bem por mim, mas o que houve?"
10123-101230050 = "Quer que eu te espere na SCHALE?"
10123-101230060 = "Sua perspicácia é sempre muito útil."
10123-101230070 = "Irei para aí imediatamente."
10123-101230080 = "Não se preocupe, não o farei esperar muito."
10123-101230090 = "Dizem que mudar os trajes também transforma o espírito."
10123-101230100 = "De certa forma, isto não combina comigo."
10123-101230110 = "Porém, sob outra perspectiva, talvez nada seja mais parecido comigo do que isto."
10123-101230120 = "Que reflexão filosófica."
10123-101230130 = "Sinto que ambas as visões estão certas."
10123-101230140 = "Certamente."
10123-101230150 = "Essa ambiguidade, por vezes, serve como uma desculpa bastante conveniente."
10123-101230160 = "Afinal, pode-se inventar quantas justificativas lógicas quisermos depois do fato."
10123-101230170 = "Pois bem..."
10123-101230180 = "Que tipo de razão você atribuirá a esta questão, Sensei?"
10123-101230190 = "Aguardo ansiosamente pela sua resposta."
10123-101230200 = "Ao que tudo indica..."
10123-101230210 = "A minha hora final se aproxima."
10123-101230220 = "Ao menos neste último instante,"
10123-101230230 = "gostaria de partir ao seu lado..."
10123-101230240 = "Cof, cof."
10123-101230250 = "Não realizarias... este meu último desejo?"
10123-101230260 = "Você está tossindo por texto..."
10123-101230270 = "Qual é a travessura da vez?"
10123-101230280 = "Compreendo."
10123-101230290 = "Pelo visto, o mesmo truque não funciona duas vezes."
10123-101230300 = "Pois bem, não importa."
10123-101230310 = "Você... passará um tempo comigo mesmo assim, não é?"
10123-101230320 = "Teria sido melhor fazer daquele jeito desde o início."
10123-101230330 = "De todo modo, diria que hoje terminamos empatados."
10123-101230340 = "Sendo assim, tenho boas expectativas para a próxima vez."
10123-101230350 = "Falando assim, parece até uma competição."
10123-101230360 = "Por acaso pretende decidir um vencedor entre nós?"
10123-101230370 = "Não é evidente?"
10123-101230380 = "Considerando a relação que temos, Sensei."
10123-101230390 = "Pois bem..."
10123-101230400 = "Quando surgir uma nova oportunidade, voltarei a chamá-lo."
10123-101230410 = "Algo surpreendente aconteceu."
10123-101230420 = "Ouvi palavras que jamais imaginaria escutar."
10123-101230430 = "Algo surpreendente?"
10123-101230440 = "Palavras que não esperava?"
10123-101230450 = "Sim."
10123-101230460 = "Estou de excelente humor."
10123-101230470 = "Irei até aí agora mesmo para lhe contar."
10123-101230480 = "Foi um passeio de carro deveras agradável."
10123-101230490 = "Quando me der vontade, repetiremos a dose."
10123-101230500 = "Eu nem tive direito de recusar..."
10123-101230510 = "Onde fica a minha vontade nessa história...?"
10123-101230520 = "Você já sabe a resposta, não sabe? Francamente, como você é maldoso, Sensei."
10123-101230530 = "Obrigada, Sensei."
10123-101230540 = "Você mudou tudo em mim."
10123-101230550 = "Não é exagero algum."
10123-101230560 = "Por isso,"
10123-101230570 = "daqui em diante,"
10123-101230580 = "à medida que eu continuar assumindo novas formas,"
10123-101230590 = "promete observar cada mudança ao meu lado?"
