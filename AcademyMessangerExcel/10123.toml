[translation]
10123-101230010 = "Сейчас вы свободны?"
10123-101230020 = "Сложилась ситуация, требующая срочности."
10123-101230030 = "Буду признательна, если вы сможете найти время."
10123-101230040 = "Всё в порядке, но что случилось?"
10123-101230050 = "Мне ждать вас в Шале?"
10123-101230060 = "Благодарю, вы быстро соображаете."
10123-101230070 = "Я сейчас приду."
10123-101230080 = "Что ж, долго ждать не заставлю."
10123-101230090 = "Говорят, в другой одежде меняется и настроение."
10123-101230100 = "В некотором смысле это не свойственно мне."
10123-101230110 = "Но если взглянуть под другим углом, может быть, это как раз и есть я."
10123-101230120 = "Философский разговор."
10123-101230130 = "Кажется, оба варианта верны."
10123-101230140 = "Верно."
10123-101230150 = "Иногда такая неопределённость служит удобным оправданием."
10123-101230160 = "Ведь можно подвести любую логику задним числом."
10123-101230170 = "Ну что ж,"
10123-101230180 = "посмотрим, какую логику вы примените к этому вопросу, Сенсей."
10123-101230190 = "Буду с нетерпением ждать."
10123-101230200 = "Похоже,"
10123-101230210 = "близится последний час."
10123-101230220 = "Хотя бы этот момент"
10123-101230230 = "я хочу встретить с вами..."
10123-101230240 = "*кхе, кхе*"
10123-101230250 = "Не исполните ли вы моё желание..."
10123-101230260 = "Кашляет буквами..."
10123-101230270 = "И что за шалость на этот раз?"
10123-101230280 = "Вот как."
10123-101230290 = "Значит, тот же трюк не срабатывает."
10123-101230300 = "Впрочем, ладно."
10123-101230310 = "Вы ведь... проведёте со мной время?"
10123-101230320 = "Надо было сразу так сделать."
10123-101230330 = "Что ж, сегодня на пять с плюсом."
10123-101230340 = "Если так, то в следующий раз можно ожидать хорошего результата."
10123-101230350 = "Звучит как состязание."
10123-101230360 = "Неужели вы намерены решать, кто победил?"
10123-101230370 = "Разумеется."
10123-101230380 = "В конце концов, это между нами, Сенсей."
10123-101230390 = "Ну что ж, тогда..."
10123-101230400 = "когда представится следующий случай, я снова свяжусь с вами."
10123-101230410 = "Удивительно."
10123-101230420 = "Вы сказали нечто неожиданное."
10123-101230430 = "Удивительно?"
10123-101230440 = "Неожиданное?"
10123-101230450 = "Да."
10123-101230460 = "Настроение прекрасное."
10123-101230470 = "Сейчас приду доложить."
10123-101230480 = "Это была действительно увлекательная поездка."
10123-101230490 = "Когда будет настроение, снова..."
10123-101230500 = "У меня не было права отказаться..."
10123-101230510 = "А куда делась моя воля..."
10123-101230520 = "Ведь вы знаете? Сенсей, вы такой хитрый."
10123-101230530 = "Спасибо, Сенсей."
10123-101230540 = "Вы изменили всё в моей жизни."
10123-101230550 = "Это не преувеличение."
10123-101230560 = "Поэтому"
10123-101230570 = "и впредь"
10123-101230580 = "вы будете наблюдать за мной,"
10123-101230590 = "меняющейся вновь и вновь?"