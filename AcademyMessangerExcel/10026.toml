[translation]
10026-100260010 = "О."
10026-100260020 = "Почему это происходит?"
10026-100260030 = "...?"
10026-100260040 = "Что происходит?"
10026-100260050 = "Эм..."
10026-100260060 = "Посмотрите на это."
10026-100260080 = "..."
10026-100260090 = "???"
10026-100260100 = "Это..."
10026-100260110 = "Я не знаю, как это надевать."
10026-100260120 = "Если так продолжится, я разозлюсь и разорву всё к чертям,"
10026-100260130 = "так что приходите и помогите."
10026-100260140 = "Прямо сейчас."
10026-100260150 = "Сенсей."
10026-100260160 = "Помните, что вы говорили мне раньше?"
10026-100260170 = "Конечно."
10026-100260180 = "Отныне я буду чаще вам звонить."
10026-100260190 = "Так что не игнорируйте меня. Понятно?"
10026-100260200 = "Ха-ха-ха."
10026-100260210 = "Сенсей."
10026-100260220 = "Можете прямо сейчас оказать мне услугу?"
10026-100260230 = "Конечно. Чем помочь?"
10026-100260240 = "Быстро вы."
10026-100260250 = "Ну, ничего особенного."
10026-100260260 = "Ну же, вы сами сказали, что всё нормально, Сенсей."
10026-100260270 = "Это то, о чём мне комфортно просить только вас."
10026-100260280 = "Мне просто нужно, чтобы вы купили пластырь. Если не можете — ничего страшного."
10026-100260290 = "Хорошо. Сейчас приду."
10026-100260300 = "Пластырь? Ты ранена?"
10026-100260310 = "..."
10026-100260320 = "Не волнуйтесь. Ничего такого."
10026-100260330 = "Хм."
10026-100260340 = "Пока просто скажу спасибо."
10026-100260350 = "Увидимся, когда придёте."
10026-100260360 = "Ха-ха."
10026-100260370 = "Просить об услугах гораздо проще, чем я думала."
10026-100260380 = "Можно мне иногда просить вас ещё о чём-нибудь?"
10026-100260390 = "Конечно."
10026-100260400 = "Ха-ха. Хорошо."
10026-100260410 = "Давайте скоро снова встретимся."
10026-100260420 = "Сенсей."
10026-100260430 = "Есть ещё кое-что, что я хочу спросить."
10026-100260440 = "Точнее, я скорее хочу кое-что подтвердить."
10026-100260450 = "Тебе что-то интересно?"
10026-100260460 = "Что происходит?"
10026-100260470 = "Ничего серьёзного."
10026-100260480 = "Просто люди ведут себя странно."
10026-100260490 = "Я даже толком не могу объяснить."
10026-100260500 = "Вы сейчас свободны? Можете прийти?"
