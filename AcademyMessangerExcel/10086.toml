[translation]
10086-100860010 = "Сенсей, у меня есть к вам разговор"
10086-100860020 = "Хорошо, я немедленно выезжаю!"
10086-100860030 = "А? Выезжаешь...?"
10086-100860040 = "Куда мне идти?"
10086-100860050 = "В смысле «выезжаю» — вы просто хотели меня увидеть?"
10086-100860060 = "Хе-хе, это так на вас похоже"
10086-100860070 = "Сегодня я сама приду в Шале"
10086-100860080 = "Тогда до встречи, Сенсей"
10086-100860090 = "Сенсей, насчёт нашего недавнего разговора..."
10086-100860100 = "Ага, мы же собирались купить платье!"
10086-100860110 = "Я так рад пойти по магазинам!"
10086-100860120 = "Хе-хе... Приятно, что вы так воодушевлены"
10086-100860130 = "Итак, насчёт места, где мы будем покупать платье"
10086-100860140 = "В Геенне много тех, кто недолюбливает Дисциплинарный комитет"
10086-100860150 = "В местном торговом центре мы можем не успеть спокойно всё посмотреть..."
10086-100860160 = "Поэтому..."
10086-100860170 = "Тогда давайте поищем за пределами Геенны?"
10086-100860180 = "Да, я пришлю вам место встречи"
10086-100860190 = "Жду вас, Сенсей"
10086-100860200 = "Сенсей, вы свободны завтра?"
10086-100860210 = "Вечеринка в Геенне закончилась, так что у меня появилось немного свободного времени"
10086-100860220 = "Если хотите, я бы хотела вас увидеть..."
10086-100860230 = "Как редко у тебя бывает свободное время!"
10086-100860240 = "Я обязательно приду!"
10086-100860250 = "Хе-хе, вы преувеличиваете"
10086-100860260 = "Тогда я буду ждать вас на месте проведения вечеринки"