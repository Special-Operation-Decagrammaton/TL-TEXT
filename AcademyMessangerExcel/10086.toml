[translation]
10086-100860010 = "Сенсей. Мне нужен твой совет по одному рабочему вопросу."
10086-100860020 = "Хорошо. Шале, выдвигаемся."
10086-100860030 = "Ч-что? Выдвигаемся?"
10086-100860040 = "Где встретимся, Хина?"
10086-100860050 = "А, понятно. Под «выдвигаемся» ты имел в виду, что хочешь встретиться прямо сейчас."
10086-100860060 = "Хи-хи. Как и ожидалось от тебя, Сенсей."
10086-100860070 = "Сегодня я зайду в Шале."
10086-100860080 = "Скоро увидимся, Сенсей."
10086-100860090 = "Сенсей, насчёт того обещания, которое ты мне дал..."
10086-100860100 = "Наконец-то пришло время ВЫБИРАТЬ ТЕБЕ ПЛАТЬЕ!"
10086-100860110 = "Я так долго ждала возможности сходить с тобой за покупками!"
10086-100860120 = "Хи-хи. Какая страсть. Я ценю это."
10086-100860130 = "Итак, насчёт того, где мы будем выбирать платье."
10086-100860140 = "В руководстве Геенны полно нарушительниц спокойствия вроде Общества Пандемониума. А некоторые и вовсе настоящие хулиганки."
10086-100860150 = "Поход в торговый центр Геенны может вызвать проблемы. Причём в самых разных смыслах."
10086-100860160 = "Так что..."
10086-100860170 = "Ты хочешь встретиться за пределами района Геенны? Понятно."
10086-100860180 = "Я отправлю тебе адрес."
10086-100860190 = "Увидимся там, Сенсей."
10086-100860200 = "Сенсей. Ты свободен завтра?"
10086-100860210 = "Теперь, когда моё выступление на вечеринке Геенны закончено, у меня стало немного больше свободного времени..."
10086-100860220 = "Если ты не против, я хотела бы встретиться."
10086-100860230 = "У ТЕБЯ есть свободное время? Такое бывает раз в сто лет!"
10086-100860240 = "Я не могу упустить такую возможность! Уже иду!"
10086-100860250 = "Ох, Сенсей. Ты вечно поднимаешь шум. Хи-хи."
10086-100860260 = "Увидимся завтра. Я буду ждать в зале вечеринки."
