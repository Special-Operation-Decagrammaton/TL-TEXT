[translation]
10086-100860010 = "Sensei, tenho um assunto para conversar com você."
10086-100860020 = "Certo, mobilização imediata!"
10086-100860030 = "H-Hã? Mobilização...?"
10086-100860040 = "Para onde eu devo ir?"
10086-100860050 = "Com \"mobilização\", você quis dizer que viria me encontrar?"
10086-100860060 = "Hehe, bem a sua cara, Sensei."
10086-100860070 = "Hoje sou eu quem vai até a Schale."
10086-100860080 = "Até daqui a pouco, Sensei."
10086-100860090 = "Sensei, sobre a nossa promessa do outro dia..."
10086-100860100 = "Sim, vamos sair para comprar o seu vestido, né!"
10086-100860110 = "Mal posso esperar para irmos às compras!"
10086-100860120 = "Hehe... Fico feliz em ver você tão animado assim."
10086-100860130 = "Então, sobre o lugar onde vamos comprar o vestido..."
10086-100860140 = "Em Gehenna, há muitas pessoas que não veem o Comitê Disciplinar com bons olhos, sabe?"
10086-100860150 = "Se formos a um shopping daqui, talvez não consigamos fazer compras com calma..."
10086-100860160 = "Por isso..."
10086-100860170 = "Que tal procurarmos fora de Gehenna, então?"
10086-100860180 = "Sim, vou te mandar o local de encontro."
10086-100860190 = "Estarei esperando, Sensei."
10086-100860200 = "Sensei, você está livre amanhã?"
10086-100860210 = "Agora que a festa de Gehenna acabou, tenho um pouco mais de tempo livre."
10086-100860220 = "Se não for incômodo, eu gostaria de ver você, Sensei..."
10086-100860230 = "Que raro você estar com a agenda livre, Hina!"
10086-100860240 = "Com certeza vou te encontrar!"
10086-100860250 = "Hehe, que exagero."
10086-100860260 = "Então estarei esperando no salão de festas."
