[translation]
10108-101080010 = "Sensei, você já foi dormir?"
10108-101080020 = "Não, ainda estou acordado."
10108-101080030 = "O que houve a uma hora dessas?"
10108-101080040 = "Desculpe."
10108-101080050 = "É que... eu estava meio sem sono..."
10108-101080060 = "Então aproveitei para terminar de organizar o relatório contábil que preciso entregar para a Schale."
10108-101080070 = "Já deixei enviado, então por favor dê uma olhada quando tiver um tempinho livre."
10108-101080080 = "Obrigado por trabalhar até tão tarde, Yuuka."
10108-101080090 = "Mas cuide da sua saúde, viu?"
10108-101080100 = "Pode deixar, meus cálculos de horas de sono estão perfeitos."
10108-101080110 = "Bom, boa noite."
10108-101080120 = "Graças aos conselhos que você me deu, Sensei,"
10108-101080130 = "tenho conseguido dormir melhor do que antes."
10108-101080140 = "Embora ainda acabe passando da meia-noite..."
10108-101080150 = "Menos mal, fico feliz em saber."
10108-101080160 = "Tem alguma coisa te preocupando?"
10108-101080170 = "Não tenho nenhuma preocupação em especial."
10108-101080180 = "Mas, se for falar de algo que não me sai da cabeça..."
10108-101080190 = "<SYSTEM> Erro ao enviar mensagem!"
10108-101080200 = "Yuuka...?"
10108-101080210 = "<SYSTEM> Erro ao enviar mensagem!"
10108-101080220 = "<SYSTEM> Erro ao enviar mensagem!"
10108-101080230 = "Sensei, acabei vendo uma coisa agora há pouco, quando terminei o meu plantão."
10108-101080240 = "Tinha um monte de macarrão instantâneo guardado lá, não tinha?"
10108-101080250 = "Não me diga que você está levando uma rotina pouco saudável de novo..."
10108-101080260 = "Não são meus!"
10108-101080270 = "Deixo guardado para servir às alunas que aparecem aqui com fome!"
10108-101080280 = "Entendi..."
10108-101080290 = "Se é assim, tudo bem."
10108-101080300 = "Mas vê se faz as suas refeições direitinho, ouviu?"
10108-101080310 = "Sim, senhora..."
10108-101080320 = "E você, Yuuka, tem se alimentado direito?"
10108-101080330 = "Claro que sim."
10108-101080340 = "Estou comendo direitinho."
10108-101080350 = "Senti uma pequena hesitação aí..."
10108-101080360 = "Por recomendação da veterana Kotama,"
10108-101080370 = "ultimamente tenho ouvido rádio antes de dormir."
10108-101080380 = "Rádio é bem legal, né?"
10108-101080390 = "O que você costuma ouvir?"
10108-101080400 = "Chama-se <Music Trip da DJ Mary>."
10108-101080410 = "Ela lê cartas dos ouvintes enquanto toca músicas suaves,"
10108-101080420 = "é perfeito para ouvir deitada na cama."
10108-101080430 = "Acho que vou tentar ouvir também quando estiver sem sono."
10108-101080440 = "Sim, experimente ouvir."
10108-101080450 = "Vou ficar feliz se você também gostar, Sensei."
10108-101080460 = "Hum, Sensei..."
10108-101080470 = "Você chegou a ouvir aquele programa de rádio de que falei antes?"
10108-101080480 = "Ouvi sim, por quê?"
10108-101080490 = "No último programa..."
10108-101080500 = "...Não,"
10108-101080510 = "deixa pra lá, não é nada."
10108-101080520 = "No último programa?"
10108-101080530 = "Do que você está falando...?"
10108-101080540 = "Desculpe, provavelmente foi só impressão minha,"
10108-101080550 = "então não ligue para isso!"
10108-101080560 = "Por falar nisso, Yuuka,"
10108-101080570 = "a sua insônia já melhorou?"
10108-101080580 = "Então era mesmo..."
10108-101080590 = "Sim, graças a você."
10108-101080600 = "Conto com você hoje também, Sensei."
10108-101080610 = "Eu que digo, bom trabalho pra nós."
