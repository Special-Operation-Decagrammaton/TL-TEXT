[translation]
10108-101080010 = "Сенсей, вы уже ложитесь спать?"
10108-101080020 = "Нет, я ещё не сплю."
10108-101080030 = "Что случилось в такое время?"
10108-101080040 = "Простите."
10108-101080050 = "Я что-то не могла уснуть..."
10108-101080060 = "Я составляла отчёт о расходах для Шале."
10108-101080070 = "Я отправила его, так что проверьте, когда будет время."
10108-101080080 = "Спасибо, что работаешь так поздно, Юука."
10108-101080090 = "Следи за своим здоровьем."
10108-101080100 = "Всё в порядке, я идеально рассчитала время для сна."
10108-101080110 = "Тогда спокойной ночи."
10108-101080120 = "Благодаря вашим советам, Сенсей,"
10108-101080130 = "я стала засыпать лучше, чем раньше."
10108-101080140 = "Хотя время всё ещё переваливает за полночь..."
10108-101080150 = "Это хорошо."
10108-101080160 = "У тебя есть какие-то заботы?"
10108-101080170 = "Особых забот нет."
10108-101080180 = "Но есть кое-что, что меня немного беспокоит."
10108-101080190 = "<СИСТЕМА> Ошибка отправки сообщения!"
10108-101080200 = "Юука...?"
10108-101080210 = "<СИСТЕМА> Ошибка отправки сообщения!"
10108-101080220 = "<СИСТЕМА> Ошибка отправки сообщения!"
10108-101080230 = "Сенсей, я видела, когда заканчивала дежурство,"
10108-101080240 = "что у вас было много лапши быстрого приготовления."
10108-101080250 = "Неужели вы опять ведёте нездоровый образ жизни..."
10108-101080260 = "Это не моё!"
10108-101080270 = "Это для голодных студентов!"
10108-101080280 = "Понятно..."
10108-101080290 = "В таком случае ничего не поделаешь."
10108-101080300 = "Но вы всё равно должны нормально питаться, ладно?"
10108-101080310 = "Да..."
10108-101080320 = "А ты сама, Юука, нормально питаешься?"
10108-101080330 = "Конечно."
10108-101080340 = "Я питаюсь правильно."
10108-101080350 = "Что-то у тебя была пауза..."
10108-101080360 = "По рекомендации Котамы"
10108-101080370 = "я недавно слушаю радио перед сном."
10108-101080380 = "Радио — это интересно."
10108-101080390 = "Что ты слушаешь?"
10108-101080400 = "Программа «Музыкальное путешествие с диджеем Мери»."
10108-101080410 = "Там читают письма слушателей и играют спокойную музыку."
10108-101080420 = "Идеально подходит, чтобы слушать лёжа в постели."
10108-101080430 = "Я тоже, может, включу, когда не смогу уснуть."
10108-101080440 = "Обязательно послушайте."
10108-101080450 = "Буду рада, если вам тоже понравится."
10108-101080460 = "Сенсей,"
10108-101080470 = "вы слушали то радио, о котором я говорила?"
10108-101080480 = "Да, а что такое?"
10108-101080490 = "В прошлом выпуске..."
10108-101080500 = "... Нет."
10108-101080510 = "Ничего, не обращайте внимания."
10108-101080520 = "В прошлом выпуске?"
10108-101080530 = "О чём речь...?"
10108-101080540 = "Простите, наверное, я обозналась."
10108-101080550 = "Не берите в голову!"
10108-101080560 = "Кстати, Юука,"
10108-101080570 = "твоя бессонница уже прошла?"
10108-101080580 = "Всё-таки..."
10108-101080590 = "Да, спасибо вам."
10108-101080600 = "Сенсей, сегодня тоже на вас рассчитываю."
10108-101080610 = "Да, и я на тебя."