[translation]
10108-101080010 = "Сенсей, вы спите?"
10108-101080020 = "Нет, ещё не сплю."
10108-101080030 = "Уже так поздно. Всё в порядке?"
10108-101080040 = "Надеюсь, я не мешаю вам спать..."
10108-101080050 = "Но почему-то сегодня мне не удаётся уснуть."
10108-101080060 = "Я привела в порядок финансовый отчёт, который должна завтра отправить в Шале."
10108-101080070 = "Я пришлю его по почте, посмотрите, когда будет возможность."
10108-101080080 = "Отличная работа, Юука."
10108-101080090 = "Ты не слишком себя загоняешь?"
10108-101080100 = "Всё в порядке. Моё расписание, включая сон, идеально."
10108-101080110 = "Тогда увидимся завтра. Спокойной ночи."
10108-101080120 = "Спасибо за совет, Сенсей."
10108-101080130 = "В последнее время мне стало гораздо легче засыпать."
10108-101080140 = "Конечно, я всё ещё часто не ложусь до полуночи, но..."
10108-101080150 = "Я волнуюсь..."
10108-101080160 = "Тебя что-то беспокоит?"
10108-101080170 = "Ничего особенного."
10108-101080180 = "Если что-то и немного беспокоит, то"
10108-101080190 = "<system> Ошибка передачи сообщения!"
10108-101080200 = "Юука...?"
10108-101080210 = "<system> Ошибка передачи сообщения!"
10108-101080220 = "<system> Ошибка передачи сообщения!"
10108-101080230 = "Сенсей, по дороге назад я сегодня"
10108-101080240 = "увидела много коробок лапши быстрого приготовления..."
10108-101080250 = "Вы ведь не питаетесь одной лапшой из стаканчиков?"
10108-101080260 = "Они не для меня!"
10108-101080270 = "Это перекус для представителей студентов, которые проголодаются на работе!"
10108-101080280 = "Хм..."
10108-101080290 = "Это я могу одобрить, но..."
10108-101080300 = "Ты всё равно должна нормально питаться и вовремя!"
10108-101080310 = "Ладно, ладно..."
10108-101080320 = "А ты, Юука? Нормально ешь?"
10108-101080330 = "Ну... Конечно..."
10108-101080340 = "Я нормально питаюсь."
10108-101080350 = "Ты как-то медленно ответила..."
10108-101080360 = "Недавно Котама посоветовала мне слушать радио по ночам."
10108-101080370 = "Я стала делать это, чтобы легче засыпать."
10108-101080380 = "В радио действительно есть своё очарование."
10108-101080390 = "Какую передачу ты слушаешь?"
10108-101080400 = "Она называется «Музыкальное путешествие DJ Мэри»."
10108-101080410 = "Там читают занимательные истории и включают музыку, чтобы помочь уснуть."
10108-101080420 = "Приятно слушать перед сном."
10108-101080430 = "Может, мне тоже попробовать в те ночи, когда не спится."
10108-101080440 = "Да."
10108-101080450 = "Надеюсь, вам тоже понравится."
10108-101080460 = "Эм, Сенсей?"
10108-101080470 = "Ты случайно не слушаешь радио?"
10108-101080480 = "Иногда. А что?"
10108-101080490 = "Ты случайно во время прошлого эфира..."
10108-101080500 = "Хм..."
10108-101080510 = "Неважно, ничего."
10108-101080520 = "Прошлого эфира?"
10108-101080530 = "О чём ты?"
10108-101080540 = "Прости. Наверное, я ошиблась."
10108-101080550 = "Не обращай внимания."
10108-101080560 = "Кстати, Юука."
10108-101080570 = "Твоя бессонница уже прошла?"
10108-101080580 = "О..."
10108-101080590 = "Да, благодаря вам, Сенсей..."
10108-101080600 = "Сегодня снова рассчитываю на вас!"
10108-101080610 = "Это я должен тебя благодарить."
