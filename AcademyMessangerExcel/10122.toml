[translation]
10122-101220010 = "Сенсей, привет~"
10122-101220020 = "Меня слышно? Здравствуйте!"
10122-101220030 = "Здравствуй, Мика."
10122-101220040 = "Хе-хе"
10122-101220050 = "Я хотела поздороваться официально,"
10122-101220060 = "вот и решила написать!"
10122-101220070 = "Я вам не помешала?"
10122-101220080 = "Вовсе нет."
10122-101220090 = "Как хорошо!"
10122-101220100 = "Где вы сейчас, Сенсей?"
10122-101220110 = "Можно я зайду к вам чуть позже?"
10122-101220120 = "Слушайте, Сенсей,"
10122-101220130 = "я хочу кое-что спросить..."
10122-101220140 = "У вас ведь тоже... есть?"
10122-101220150 = "Другое лицо, или, скажем..."
10122-101220160 = "Другая сторона, о которой вы сами не знаете."
10122-101220170 = "Что-то вроде скрытой грани."
10122-101220180 = "Думаю, есть."
10122-101220190 = "Наверное."
10122-101220200 = "Хм"
10122-101220210 = "Вот как."
10122-101220220 = "У взрослых тоже такое бывает..."
10122-101220230 = "Хе-хе"
10122-101220240 = "Что-то мне стало легче."
10122-101220250 = "Может, я хочу увидеть и другую сторону Сенсея ♪"
10122-101220260 = "Сенсей... вы заняты?"
10122-101220270 = "Сейчас можно?"
10122-101220280 = "У меня есть время."
10122-101220290 = "Ого"
10122-101220300 = "Как хорошо."
10122-101220310 = "Мика, хочешь тоже просто побыть?"
10122-101220320 = "!! Ох!!"
10122-101220330 = "Хочу!!"
10122-101220340 = "Хе-хе"
10122-101220350 = "Где вы~?"
10122-101220360 = "Сегодняшний урок"
10122-101220370 = "был самым весёлым!"
10122-101220380 = "Скорее игра, чем урок...?"
10122-101220390 = "Хе-хе, наверное."
10122-101220400 = "Давай ещё... поиграем ☆"
10122-101220410 = "Сенсей, вы знаете?"
10122-101220420 = "На берегу моря"
10122-101220430 = "много красивых вещей."
10122-101220440 = "Вы видели их?"
10122-101220450 = "Например?"
10122-101220460 = "Ну..."
10122-101220470 = "Например... я?"
10122-101220480 = "Аха-ха, шучу ☆"
10122-101220490 = "Я примерно представляю, какое у вас сейчас лицо!"
10122-101220500 = "Если говорить о красивых вещах на берегу..."
10122-101220510 = "наверное, ракушки."
10122-101220520 = "Се-ен-се-ей---;-?"
10122-101220530 = "Хе-хе-хе"
10122-101220540 = "Мика...?"
10122-101220550 = "Чуть-чуть"
10122-101220560 = "Ой, смотри"
10122-101220570 = "Как высоко"
10122-101220580 = "Сенсей"
10122-101220590 = "..."
10122-101220600 = "Простите."
10122-101220610 = "Заснула..."
10122-101220620 = "А ведь это был просто сок..."
10122-101220630 = "Как только я подумала, что так даже лучше,"
10122-101220640 = "напряжение, похоже, спало..."
10122-101220650 = "Простите, что доставила хлопоты."
10122-101220660 = "Отдыхай, Мика."
10122-101220670 = "Да, спасибо."
10122-101220680 = "Сенсей, эм... насчёт сегодняшнего..."
10122-101220690 = "Ну..."
10122-101220700 = "Нет, ничего."
10122-101220710 = "Вы тоже отдыхайте, Сенсей!"
10122-101220720 = "Сенсей, вы сейчас свободны?"
10122-101220730 = "Уделите мне немного времени!"
10122-101220740 = "Дело в том..."
10122-101220750 = "... я нашла прекрасное место!"
10122-101220760 = "Если не поторопиться, можно опоздать!"
10122-101220770 = "Понял, где ты сейчас?"
10122-101220780 = "Ура!"
10122-101220790 = "Ну, слушайте?"
10122-101220800 = "Сенсей, вы ведь проголодались?"
10122-101220810 = "Может, и нет..."
10122-101220820 = "Ну, не говорите так~"
10122-101220830 = "Я-то знаю."
10122-101220840 = "Вы ведь голодны?"
10122-101220850 = "Может, даже очень сильно хотите есть?"
10122-101220860 = "Ну, если подумать...?"
10122-101220870 = "Хе-хе"
10122-101220880 = "Ждите! Я принесу еду!"
10122-101220890 = "Мика сама готовила?"
10122-101220900 = "На самом деле"
10122-101220910 = "я приготовила для вас."
10122-101220920 = "Попробуете?"
10122-101220930 = "Сенсей"
10122-101220940 = "Да."
10122-101220950 = "Ну..."
10122-101220960 = "Я всегда..."
10122-101220970 = "Благодарю вас."