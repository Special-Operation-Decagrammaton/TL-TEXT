[translation]
10122-101220010 = "Alô, alô, Sensei~"
10122-101220020 = "Chegou aí? Oiê!"
10122-101220030 = "Oi, Mika."
10122-101220040 = "Ehehe"
10122-101220050 = "Queria te dar um oi direitinho,"
10122-101220060 = "então resolvi mandar mensagem!"
10122-101220070 = "Estou atrapalhando?"
10122-101220080 = "Claro que não, imagina."
10122-101220090 = "Que bom!"
10122-101220100 = "Onde você está agora, Sensei?"
10122-101220110 = "Será que posso passar aí para te ver daqui a pouco?"
10122-101220120 = "Ei, Sensei"
10122-101220130 = "Posso te fazer uma pergunta...?"
10122-101220140 = "Você também tem... sabe?"
10122-101220150 = "Tipo uma outra face, ou melhor..."
10122-101220160 = "Um outro lado seu"
10122-101220170 = "que nem você mesmo conhece?"
10122-101220180 = "Acho que tenho sim."
10122-101220190 = "Provavelmente."
10122-101220200 = "Uau"
10122-101220210 = "Entendi"
10122-101220220 = "Então adultos também têm isso..."
10122-101220230 = "Hehe"
10122-101220240 = "Me deu até um alívio agora."
10122-101220250 = "Acho que eu adoraria conhecer esse seu outro lado também♪"
10122-101220260 = "Sensei... tá ocupado?"
10122-101220270 = "Tem um tempinho agora?"
10122-101220280 = "Estou de bobeira aqui."
10122-101220290 = "Uaaau"
10122-101220300 = "Que maravilha!"
10122-101220310 = "Quer ficar de bobeira comigo também, Mika?"
10122-101220320 = "!! Qefro !!"
10122-101220330 = "Quero!!"
10122-101220340 = "Ehehe"
10122-101220350 = "Onde você tá~?"
10122-101220360 = "A aula de hoje"
10122-101220370 = "foi a mais divertida que já tive!"
10122-101220380 = "Acho que parecia mais brincadeira do que aula, né...?"
10122-101220390 = "Ehehe, pode ser."
10122-101220400 = "Vamos... brincar de novo qualquer dia, tá?☆"
10122-101220410 = "Sensei, você sabia?"
10122-101220420 = "Na beira da praia"
10122-101220430 = "tem um montão de coisas lindas."
10122-101220440 = "Você já viu alguma?"
10122-101220450 = "Tipo o quê?"
10122-101220460 = "Huum..."
10122-101220470 = "Tipo... eu?"
10122-101220480 = "Ahaha, é brincadeira☆"
10122-101220490 = "Consigo até imaginar a cara que você fez agora!"
10122-101220500 = "Falando de coisas bonitas na praia..."
10122-101220510 = "Acho que as conchinhas, né?"
10122-101220520 = "Seeenseeeiii;-?"
10122-101220530 = "Hehe h"
10122-101220540 = "Mika...?"
10122-101220550 = "Só vim"
10122-101220560 = "da bua noitw"
10122-101220570 = "mesmoo"
10122-101220580 = "Sensei"
10122-101220590 = "..."
10122-101220600 = "Me desculpa."
10122-101220610 = "Acabei apagando, né..."
10122-101220620 = "E era só suco... "
10122-101220630 = "Acho que quando percebi que estava tudo bem ficar assim,"
10122-101220640 = "toda a tensão que eu estava sentindo foi embora de vez..."
10122-101220650 = "Desculpa ter te dado trabalho."
10122-101220660 = "Descanse bastante, Mika."
10122-101220670 = "Uhum, obrigada."
10122-101220680 = "Sensei, é que... sobre o que aconteceu hoje..."
10122-101220690 = "Huum..."
10122-101220700 = "Não, deixa pra lá."
10122-101220710 = "Bom descanso pra você também, Sensei!"
10122-101220720 = "Sensei, tá livre agora?"
10122-101220730 = "Me dá só um minutinho do seu tempo!"
10122-101220740 = "Na verdade..."
10122-101220750 = "...Eu encontrei um lugar incrível!"
10122-101220760 = "Se você não vier rápido, vamos perder o momento!"
10122-101220770 = "Beleza, onde você está?"
10122-101220780 = "Ebaaa!"
10122-101220790 = "Olha só..."
10122-101220800 = "Sensei! Você tá com fome, não tá?"
10122-101220810 = "Acho que nem tanto..."
10122-101220820 = "Lá vem você dizendo isso de novo~"
10122-101220830 = "Eu te conheço muito bem!"
10122-101220840 = "Tá com fome sim, né?"
10122-101220850 = "Na verdade, tá morrendo de fome, não tá~?"
10122-101220860 = "P-Parando pra pensar, acho que sim...?"
10122-101220870 = "Ehehe"
10122-101220880 = "Me espera aí! Vou levar uma marmita pra você!"
10122-101220890 = "Foi você mesma que fez, Mika?"
10122-101220900 = "Pois é..."
10122-101220910 = "Eu fiz especialmente pra você, Sensei."
10122-101220920 = "Vai comer tudinho por mim?"
10122-101220930 = "Sensei"
10122-101220940 = "Oi?"
10122-101220950 = "Hum..."
10122-101220960 = "Muito obrigada..."
10122-101220970 = "por tudo que você sempre faz por mim."
