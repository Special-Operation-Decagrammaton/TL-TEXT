[translation]
10122-101220010 = "Сенсей, привет-привет!"
10122-101220020 = "Ты там?"
10122-101220030 = "Привет, Мика."
10122-101220040 = "Хи-хи-хи"
10122-101220050 = "Раз уж случай особенный,"
10122-101220060 = "я решила написать тебе!"
10122-101220070 = "Если только... я не мешаю"
10122-101220080 = "Нет, совсем нет!"
10122-101220090 = "Это здорово!"
10122-101220100 = "Ты сейчас где, Сенсей?"
10122-101220110 = "Можно я скоро зайду?"
10122-101220120 = "Сенсей."
10122-101220130 = "У тебя тоже есть что-то такое?"
10122-101220140 = "Ну знаешь,"
10122-101220150 = "какая-нибудь неожиданная сторона тебя"
10122-101220160 = "Сторона,"
10122-101220170 = "о которой даже ты сам не знаешь"
10122-101220180 = "Может быть?"
10122-101220190 = "Наверное."
10122-101220200 = "Хех."
10122-101220210 = "Понятно"
10122-101220220 = "Значит, даже у взрослого вроде тебя..."
10122-101220230 = "Фу-фу."
10122-101220240 = "Какое облегчение!"
10122-101220250 = "И мне ооочень интересно увидеть эти разные стороны тебя. ♪"
10122-101220260 = "Сенсееей"
10122-101220270 = "Чё делаешь?"
10122-101220280 = "Да ничего особенного"
10122-101220290 = "Ого"
10122-101220300 = "Понятно"
10122-101220310 = "Хочешь присоединиться ко мне, Мика?"
10122-101220320 = "Я?"
10122-101220330 = "Да-да-ДА!!!"
10122-101220340 = "Хи-хи."
10122-101220350 = "Где вы?"
10122-101220360 = "Из всех занятий, которые у меня были в последнее время,"
10122-101220370 = "сегодняшнее было самым весёлым."
10122-101220380 = "Я бы не назвал это «занятием»..."
10122-101220390 = "Хи-хи."
10122-101220400 = "Давай как-нибудь повторим. ☆"
10122-101220410 = "Сенсей"
10122-101220420 = "Ты знал?"
10122-101220430 = "В океане гораздо больше красивых вещей,"
10122-101220440 = "чем можно подумать"
10122-101220450 = "Например каких?"
10122-101220460 = "Эм"
10122-101220470 = "Мисоно Мика?"
10122-101220480 = "Ахаха, шучу ☆"
10122-101220490 = "Я прямо представляю твоё лицо"
10122-101220500 = "Ну, например,"
10122-101220510 = "моллюски и раковины"
10122-101220520 = "seni"
10122-101220530 = "he"
10122-101220540 = "Мика...?"
10122-101220550 = "jus"
10122-101220560 = "a"
10122-101220570 = "^&t"
10122-101220580 = "Сенсей"
10122-101220590 = "..."
10122-101220600 = "Простите."
10122-101220610 = "Я уснула..."
10122-101220620 = "В нём ведь не было никаких снотворных ингредиентов..."
10122-101220630 = "Я просто совсем расслабилась."
10122-101220640 = "Почему-то мне было так уютно."
10122-101220650 = "Простите."
10122-101220660 = "Ты ничего не могла с этим поделать. Отдохни, Мика."
10122-101220670 = "Ладно, спасибо..."
10122-101220680 = "Насчёт сегодняшнего дня"
10122-101220690 = "Эм"
10122-101220700 = "Нет, забудь."
10122-101220710 = "Тебе тоже стоит отдохнуть, Сенсей!"
10122-101220720 = "Сенсей"
10122-101220730 = "У тебя есть минутка?"
10122-101220740 = "Ничего серьёзного!"
10122-101220750 = "Я просто нашла одно очень классное место."
10122-101220760 = "И именно сейчас самое подходящее время, чтобы туда сходить!"
10122-101220770 = "Где встретимся?"
10122-101220780 = "Ладненько!"
10122-101220790 = "Это место..."
10122-101220800 = "Ты голоден, Сенсей?"
10122-101220810 = "Хм? Не особо..."
10122-101220820 = "Нет."
10122-101220830 = "Я уверена, ты голоден"
10122-101220840 = "Ты ведь голоден, да?"
10122-101220850 = "Кажется, я вдруг начинаю чувствовать голод?"
10122-101220860 = "М-Может, я и правда голоден?"
10122-101220870 = "Хи-хи."
10122-101220880 = "Я принесу бэнто!"
10122-101220890 = "Бэнто... от тебя?"
10122-101220900 = "Ага"
10122-101220910 = "Мне просто почему-то захотелось его приготовить"
10122-101220920 = "Ты съешь его, Сенсей?"
10122-101220930 = "Сенсей"
10122-101220940 = "Конечно, Мика."
10122-101220950 = "М-м-м"
10122-101220960 = "Спасибо,"
10122-101220970 = "как всегда"
