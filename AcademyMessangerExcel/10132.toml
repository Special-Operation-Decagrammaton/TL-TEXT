[translation]
10132-101320010 = "Президент, заранее прошу прощения..."
10132-101320020 = "но вы не будете против, если мы перенесём дату..."
10132-101320030 = "нашей следующей видеосъёмки...?"
10132-101320040 = "Ого! И когда это меня повысили до президента Клуба изучения ниндзюцу?"
10132-101320050 = "ASDFGHKLDSG СЕНСЕЙ?!"
10132-101320060 = "Мне о-очень-очень жаль!"
10132-101320070 = "Я написала не тому человеку...!"
10132-101320080 = "Но почему ты не сможешь прийти?"
10132-101320090 = "Ну..."
10132-101320100 = "Так получилось, что в тот день я..."
10132-101320110 = "работаю моделью..."
10132-101320120 = "Сенсей"
10132-101320130 = "Вам нравится искусство...?"
10132-101320140 = "Эм... Смотря какое?"
10132-101320150 = "Если вы его хотя бы НЕ НЕНАВИДИТЕ..."
10132-101320160 = "не могли бы вы помочь мне кое с чем, связанным с искусством...?"
10132-101320170 = "Всегда готов! Но с чем... именно?"
10132-101320180 = "Я..."
10132-101320190 = "нужно посетить урок рисования...!"
10132-101320200 = "Урок рисования?!"
10132-101320210 = "Ты нормально добрался домой, Сенсей?"
10132-101320220 = "Сегодня еда была такой вкусной...!"
10132-101320230 = "Когда я вернулась домой, то поняла..."
10132-101320240 = "Это ведь всегда вы помогаете мне..."
10132-101320250 = "Так что... в следующий раз... обязательно...!"
10132-101320260 = "Сенсей?"
10132-101320270 = "Вы уже обедали...?"
10132-101320280 = "...Сейчас разве не восемь утра?!"
10132-101320290 = "Значит, ещё нет...! Какое облегчение...!"
10132-101320300 = "Тогда"
10132-101320310 = "можно я займу немного времени"
10132-101320320 = "из вашего обеденного перерыва...?"
10132-101320330 = "Сенсей"
10132-101320340 = "Это правда будет последний раз...!"
10132-101320350 = "А...?"
10132-101320360 = "А..."
10132-101320370 = "Это действительно, совершенно, абсолютно последнее"
10132-101320380 = "модное шоу, в котором я буду участвовать...!"
10132-101320390 = "Не могли бы вы..."
10132-101320400 = "пойти со мной...?"
10132-101320410 = "Конечно!"
10132-101320420 = "Сенсей."
10132-101320430 = "Мне всё ещё очень жаль..."
10132-101320440 = "Всё нормально. Иногда такое случается."
10132-101320450 = "Я буду усердно тренировать свои навыки ниндзя..."
10132-101320460 = "чтобы подобное больше никогда не повторилось,"
10132-101320470 = "что бы на мне ни было...!"
10132-101320480 = "Я в тебя верю!"
10132-101320490 = "Спасибо! Сенсей!"
