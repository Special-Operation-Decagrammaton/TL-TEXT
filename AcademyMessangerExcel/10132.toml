[translation]
10132-101320010 = "Desculpe, Presidente..."
10132-101320020 = "Sobre a nossa próxima gravação de vídeo..."
10132-101320030 = "Será que poderíamos remarcar a data...?"
10132-101320040 = "Desde quando eu virei presidente do clube...?!"
10132-101320050 = "Sensei?!"
10132-101320060 = "Me desculpe!!"
10132-101320070 = "Mandei a mensagem para a pessoa errada!"
10132-101320080 = "Surgiu algum imprevisto nesse dia?"
10132-101320090 = "Na verdade..."
10132-101320100 = "Justo nesse dia,"
10132-101320110 = "eu acabei aceitando um trabalho de meio período como modelo fotográfica..."
10132-101320120 = "Sensei,"
10132-101320130 = "você gosta de arte?"
10132-101320140 = "Por que a pergunta assim de repente...?"
10132-101320150 = "Se não for incomodar,"
10132-101320160 = "eu queria te pedir um favor..."
10132-101320170 = "Pode pedir o que quiser!"
10132-101320180 = "É que eu..."
10132-101320190 = "Vou precisar ir a um cursinho preparatório de belas-artes...!"
10132-101320200 = "Despertou o seu lado artístico?!"
10132-101320210 = "Você também chegou bem em casa, Sensei?"
10132-101320220 = "A refeição de hoje estava deliciosa!"
10132-101320230 = "Mas, parando para pensar,"
10132-101320240 = "você sempre acaba pagando tudo para mim..."
10132-101320250 = "Na próxima vez, eu faço questão de pagar...!"
10132-101320260 = "Sensei,"
10132-101320270 = "você já almoçou hoje...?"
10132-101320280 = "A-Ainda são 8 da manhã..."
10132-101320290 = "Ou seja, ainda não almoçou...!"
10132-101320300 = "Então,"
10132-101320310 = "que tal sairmos para almoçar"
10132-101320320 = "juntos mais tarde...?"
10132-101320330 = "Sensei,"
10132-101320340 = "esta será a última vez...!"
10132-101320350 = "Hã?"
10132-101320360 = "Hum..."
10132-101320370 = "Para encerrar de vez, pela última vez mesmo,"
10132-101320380 = "decidi participar de um desfile de moda...!"
10132-101320390 = "E por isso..."
10132-101320400 = "Queria muito que você fosse comigo..."
10132-101320410 = "Vamos sim!"
10132-101320420 = "Sensei,"
10132-101320430 = "me desculpe pelo que aconteceu agora há pouco..."
10132-101320440 = "Está tudo bem, não esquenta com isso."
10132-101320450 = "Vou treinar muito mais"
10132-101320460 = "para conseguir pular cercas"
10132-101320470 = "não importa que roupa eu esteja vestindo...!"
10132-101320480 = "Isso aí, estou torcendo por você!"
10132-101320490 = "Muito obrigada, Sensei!"
