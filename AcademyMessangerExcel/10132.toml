[translation]
10132-101320010 = "Простите, начальник..."
10132-101320020 = "Насчёт следующей съёмки видео..."
10132-101320030 = "Не могли бы вы скорректировать расписание...?"
10132-101320040 = "С каких пор я начальник...!?"
10132-101320050 = "Сенсей!?"
10132-101320060 = "Простите!!"
10132-101320070 = "Я ошиблась адресатом!"
10132-101320080 = "У тебя появились срочные дела?"
10132-101320090 = "Дело в том..."
10132-101320100 = "как раз в этот день"
10132-101320110 = "у меня подработка в качестве модели..."
10132-101320120 = "Сенсей,"
10132-101320130 = "вы любите изобразительное искусство?"
10132-101320140 = "К чему ты вдруг...?"
10132-101320150 = "Если вам не трудно,"
10132-101320160 = "у меня есть просьба..."
10132-101320170 = "Говори!"
10132-101320180 = "Я..."
10132-101320190 = "я решила пойти в художественную школу...!"
10132-101320200 = "К тебе пришло озарение!?"
10132-101320210 = "Вы тоже благополучно добрались, Сенсей?"
10132-101320220 = "Сегодняшняя еда была очень вкусной!"
10132-101320230 = "Я подумала,"
10132-101320240 = "что всё время вы меня угощаете..."
10132-101320250 = "В следующий раз обязательно я...!"
10132-101320260 = "Сенсей,"
10132-101320270 = "вы уже пообедали...?"
10132-101320280 = "Сейчас ведь только 8 утра..."
10132-101320290 = "То есть не ели...!"
10132-101320300 = "Тогда"
10132-101320310 = "давайте пообедаем"
10132-101320320 = "вместе...?"
10132-101320330 = "Сенсей,"
10132-101320340 = "это в последний раз...!"
10132-101320350 = "Что?"
10132-101320360 = "Ну..."
10132-101320370 = "в самый последний-препоследний раз"
10132-101320380 = "я хочу выступить на показе мод...!"
10132-101320390 = "И поэтому..."
10132-101320400 = "я хотела бы, чтобы вы пошли со мной..."
10132-101320410 = "Пойду!"
10132-101320420 = "Сенсей,"
10132-101320430 = "прошу прощения за предыдущее..."
10132-101320440 = "Ничего страшного, не переживай."
10132-101320450 = "В любой одежде"
10132-101320460 = "я буду тренироваться так,"
10132-101320470 = "чтобы перепрыгивать через забор...!"
10132-101320480 = "Да, я болею за тебя!"
10132-101320490 = "Спасибо, Сенсей!"