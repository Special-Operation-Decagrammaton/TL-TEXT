[translation]
16016-160160010 = "Сенсей"
16016-160160020 = "Простите за столь внезапную просьбу, но вы сейчас заняты чем-то важным?"
16016-160160030 = "Если нет, есть вопрос, по которому мне нужно ваше мнение."
16016-160160040 = "Моё мнение?"
16016-160160050 = "А? Что-то происходит?"
16016-160160060 = "Да."
16016-160160070 = "Это не обязательно что-то плохое или повод для беспокойства."
16016-160160080 = "Но в любом случае я буду очень признательна за ваш совет."
16016-160160090 = "Сенсей"
16016-160160100 = "Эм..."
16016-160160110 = "Неважно."
16016-160160120 = "Зови меня когда угодно!"
16016-160160130 = "Хочу снова увидеть милую Минэ!"
16016-160160140 = "!!!"
16016-160160150 = "Эм..."
16016-160160160 = "Да..."
16016-160160170 = "Хм."
16016-160160180 = "Всё так, как вы сказали."
16016-160160190 = "Время от времени перемены действительно можно воспринимать положительно."
16016-160160200 = "Хм?"
16016-160160210 = "О чём ты?"
16016-160160220 = "А."
16016-160160230 = "Понимаешь..."
16016-160160240 = "Неважно."
16016-160160250 = "Прошу прощения, Сенсей. Я просто рассуждала вслух."
16016-160160260 = "Пожалуйста, не обращайте внимания."
16016-160160270 = "Я глубоко извиняюсь за сегодняшний день, Сенсей."
16016-160160280 = "Я слишком растерялась. Я показала сторону себя, которую обычно скрываю."
16016-160160290 = "Нет-нет. Это было очень мило!"
16016-160160300 = "Надеюсь, в следующий раз ты будешь чувствовать себя свободнее!"
16016-160160310 = "Хи-хи."
16016-160160320 = "Ваши слова вызывают во мне сильное предвкушение."
16016-160160330 = "Да."
16016-160160340 = "Тогда встретимся снова."
16016-160160350 = "Сенсей"
16016-160160360 = "Не найдётся ли у вас случайно свободной минуты? Неважно когда."
16016-160160370 = "Минэ? Что-то случилось?"
16016-160160380 = "Кажется, тебя что-то беспокоит."
16016-160160390 = "Эм..."
16016-160160400 = "Да..."
16016-160160410 = "На этот раз... да."
16016-160160420 = "Я обращаюсь к вам за советом, Сенсей."
16016-160160430 = "Пожалуйста, сообщите, когда у вас освободится время,"
16016-160160440 = "и я навещу вас."
16016-160160450 = "Сенсей"
16016-160160460 = "Я искренне прошу прощения."
16016-160160470 = "Вернувшись домой, я всё обдумала. Возможно, я сказала что-то..."
16016-160160480 = "Что-то милое? Всё нормально!"
16016-160160490 = "Давай видеться чаще, айдол Минэ!"
16016-160160500 = "!"
16016-160160510 = "Хи-хи."
16016-160160520 = "Да."
16016-160160530 = "Меня это тоже порадует."
16016-160160540 = "Сенсей"
16016-160160550 = "Вы помните обещание,"
16016-160160560 = "которое мы дали на сегодня?"
16016-160160570 = "Конечно, помню."
16016-160160580 = "Я жду этого, Минэ!"
16016-160160590 = "А."
16016-160160600 = "Хи-хи."
16016-160160610 = "Спасибо."
16016-160160620 = "Я тоже в восторге. Скоро увидимся, Сенсей."
16016-160160630 = "Это было приятно."
16016-160160640 = "Вы спали очень крепко. Даже крепче, чем я считала возможным."
16016-160160650 = "Меня несколько тревожит ваша привычка слишком много работать."
16016-160160660 = "Благодаря тебе я полностью зарядился!"
16016-160160670 = "Мне настолько лучше, что я, пожалуй, снова попрошу тебя о помощи!"
16016-160160680 = "!"
16016-160160690 = "Прекрасно. Обращайтесь ко мне за помощью когда пожелаете."
16016-160160700 = "Я ведь чувствую то же самое."
16016-160160710 = "Чем больше поводов вот так встречаться, тем лучше."
