20055-200550290 = "Не совсем «купить»..."
20055-200550300 = "Какая катастрофа..."
20055-200550310 = "Надеюсь, никто не подумал ничего странного... из-за всех этих криков."
20055-200550320 = "Но, Юзу, это же показывает, как они восхищаются твоим невероятным талантом!"
20055-200550330 = "Не говори так! Я не хочу, чтобы меня ещё кто-то просил..."
20055-200550340 = "В любом случае, ведущий только что отправил Virtual Boss 4.0 в клубную комнату."
20055-200550350 = "Ему пришлось, потому что я... забыла забрать её на месте мероприятия."
20055-200550360 = "Так что, если вы не против..."
20055-200550370 = "может, поиграем вместе в Virtual Boss?"
20055-200550380 = "У меня есть несколько эксклюзивов для этой консоли!"
