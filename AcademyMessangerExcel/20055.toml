[translation]
20055-200550010 = "Sensei, eu... eu não consigo"
20055-200550020 = "mais entrar no meu armário..."
20055-200550030 = "Eu queria muito entrar,"
20055-200550040 = "mas o meu corpo..."
20055-200550050 = "A Yuzu não consegue entrar no armário...?"
20055-200550060 = "Tô indo dar uma olhada aí agora!"
20055-200550070 = "Hã?"
20055-200550080 = "N-Não, não é nada que precise fazer você vir até aqui..."
20055-200550090 = "Uuu..."
20055-200550100 = "...Por favor, me ajude"
20055-200550110 = "Jogos..."
20055-200550120 = "são mesmo tão difíceis assim, né...?"
20055-200550130 = "Ver a Yuzu dizendo uma coisa dessas..."
20055-200550140 = "Estou indo pra aí agora mesmo!"
20055-200550150 = "Hã?!"
20055-200550160 = "E-Espere, por favor!"
20055-200550170 = "E-Eu estou bem de verdade, juro!"
20055-200550180 = "Aquele novo console de VR que acabou de ser lançado,"
20055-200550190 = "o 'Virtual Boss 4.0'..."
20055-200550200 = "Você conseguiu comprar, Sensei...?"
20055-200550210 = "Eu também não consegui..."
20055-200550220 = "Não deu nem pra colocar no carrinho..."
20055-200550230 = "Ai..."
20055-200550240 = "Eu também não consegui comprar..."
20055-200550250 = "Todo lançamento novo é difícil de conseguir, mas... desta vez parece estar disputado demais..."
20055-200550260 = "Mas ainda não estamos totalmente sem opções pra conseguir um!"
20055-200550270 = "Hã?"
20055-200550280 = "Existe um jeito de conseguir um mesmo nessa situação?!"
20055-200550290 = "Sim, existe..."
20055-200550300 = "Aquilo virou uma confusão gigantesca..."
20055-200550310 = "Tomara que não espalhem nenhum mal-entendido estranho..."
20055-200550320 = "Mas isso só mostra o quanto todo mundo ficou impressionado com o seu talento, Yuzu!"
20055-200550330 = "I-Imagina! E se começarem a espalhar boatos estranhos sobre mim...?"
20055-200550340 = "Ah, é mesmo... Enviaram o console do 'Virtual Boss 4.0' aqui para a sala do Clube de Desenvolvimento de Jogos"
20055-200550350 = "Como aquele dia foi uma correria só e eu não consegui retirar o prêmio na hora..."
20055-200550360 = "Se você quiser,"
20055-200550370 = "que tal jogarmos o 'Virtual Boss' juntos qualquer dia desses?"
20055-200550380 = "Eu já vou deixar os jogos preparados!"
20055-200550390 = "Com certeza. Vou nem que chova canivete!"
20055-200550400 = "Sim! Vou ficar te esperando!"
20055-200550410 = "Ultimamente tenho me acostumado cada vez mais com os jogos de VR"
20055-200550420 = "Já consigo movimentar o corpo de um jeito bem mais fluido..."
20055-200550430 = "Agora não existe mais nenhum gênero de jogo capaz de parar a UZQueen..."
20055-200550440 = "N-Não"
20055-200550450 = "Não diga isso..."
20055-200550460 = "Poxa... Não fique tirando sarro de mim, por favor!"
