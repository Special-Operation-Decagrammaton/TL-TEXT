20055-200550420 = "Движения стали менее шаткими. И меня меньше укачивает..."
20055-200550430 = "Нет игрового испытания, которое UZQueen не способна пройти!"
20055-200550440 = "Эм"
20055-200550450 = "А-а-а-а-а"
20055-200550460 = "Не дразните меня...!"
