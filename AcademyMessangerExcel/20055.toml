20055-200550040 = "но одновременно не хочу."
20055-200550050 = "Юзу... отказывается от шкафа...?"
20055-200550060 = "Я уже иду."
20055-200550070 = "Что?"
20055-200550080 = "Нет-нет, подожди."
20055-200550090 = "Тебе не обязательно приходить, но..."
20055-200550100 = "...пожалуйста?"
20055-200550110 = "Сенсей?"
20055-200550120 = "Я не знала, что игры могут быть настолько сложными..."
20055-200550130 = "Юзу... испытывает трудности с игрой...?"
20055-200550140 = "Я уже иду."
20055-200550150 = "Что?"
20055-200550160 = "Нет-нет-нет-нет-нет!"
20055-200550170 = "Я-Я правда в порядке! По крайней мере на этот раз!"
20055-200550180 = "Сенсей"
20055-200550190 = "Вы знаете Virtual Boss 4.0... Новую игровую VR-консоль?"
20055-200550200 = "...Ты достала её?"
20055-200550210 = "Даже близко нет..."
