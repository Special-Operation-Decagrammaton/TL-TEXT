[translation]
10142-101420010 = "Вы связались со мной, да?"
10142-101420020 = "Что-то срочное?"
10142-101420030 = "Я подумал, не жарко ли тебе в последнее время."
10142-101420040 = "А... да, спасибо."
10142-101420050 = "Что беспокоитесь."
10142-101420060 = "Всё в порядке. Я охлаждаюсь водой."
10142-101420070 = "На море?"
10142-101420080 = "В бассейне?"
10142-101420090 = "На самом деле..."
10142-101420100 = "Я устраиваю небольшие стрельбы во дворе."
10142-101420110 = "Водяным пистолетом, правда."
10142-101420120 = "То есть... это игра с водяным пистолетом?"
10142-101420130 = "Если так сказать... наверное?"
10142-101420140 = "Всё же..."
10142-101420150 = "Похоже, я слишком переживала."
10142-101420160 = "Все из Хяккарёран говорили мне то же самое."
10142-101420170 = "Что никто не будет страдать от моего вида в купальнике."
10142-101420180 = "Ну вот! Я же говорил."
10142-101420190 = "Ага."
10142-101420200 = "Поэтому в следующий раз..."
10142-101420210 = "Я пойду на море со всеми."
10142-101420220 = "Наверное... будет весело."
10142-101420230 = "Отлично. Не забудь солнцезащитный крем!"
10142-101420240 = "Ага. Спасибо."
10142-101420250 = "С тех пор, как я сходила на море со всеми..."
10142-101420260 = "Я замечаю, что стала ходить на море, сама не замечая."
10142-101420270 = "На море ведь весело."
10142-101420280 = "Ага. Весело."
10142-101420290 = "Плавание помогает тренироваться."
10142-101420300 = "И хорошо очищает голову от мыслей."
10142-101420310 = "К тому же, там особенная атмосфера."
10142-101420320 = "Если так, стоило ходить туда раньше."
10142-101420330 = "Можно ходить сколько угодно и сейчас."
10142-101420340 = "...Да, верно."
10142-101420350 = "Теперь я планирую ходить на море почаще."
10142-101420360 = "Слухи о снежной женщине, похоже, всё ещё ходят."
10142-101420370 = "М-м..."
10142-101420380 = "Если я буду всё объяснять, это может вызвать недопонимание."
10142-101420390 = "Что же мне делать?"
10142-101420400 = "Давай снова сходим на море вместе!"
10142-101420410 = "Если мы будем продолжать появляться вместе с Сенсеем,"
10142-101420420 = "то слухи быстро утихнут, так?"
10142-101420430 = "Ага... понял."
10142-101420440 = "Ведь это ради Нагусы..."
10142-101420450 = "..."
10142-101420460 = "Как и ожидалось, Сенсей, вы хитры."
10142-101420470 = "Почему!?"
10142-101420480 = "Я случайно услышала на обратном пути,"
10142-101420490 = "что слухи о снежной женщине на море..."
10142-101420500 = "всё оказалось ложью."
10142-101420510 = "О, операция удалась!"
10142-101420520 = "Ага. Большой успех."
10142-101420530 = "Теперь можно спокойно ходить на море."
10142-101420540 = "Ты ведь снова пойдёшь со мной?"
10142-101420550 = "..."
10142-101420560 = "Да."
10142-101420570 = "Тогда до встречи."
10142-101420580 = "Похоже, всю неделю будет хорошая погода."
10142-101420590 = "И поэтому, если Сенсей не против..."
10142-101420600 = "Не встретимся в выходные?"
10142-101420610 = "Конечно!"
10142-101420620 = "Я тоже об этом думал!"
10142-101420630 = "Тогда снова пойдём на море."
10142-101420640 = "Может, будет что-то интересное."