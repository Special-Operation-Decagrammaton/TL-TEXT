[translation]
10142-101420010 = "Você tinha me mandado mensagem, né"
10142-101420020 = "Era urgente?"
10142-101420030 = "Como tem feito calor ultimamente, só queria saber se você estava bem"
10142-101420040 = "Ah... sim, obrigada"
10142-101420050 = "por se preocupar comigo"
10142-101420060 = "Estou bem. Estou me refrescando direitinho na água"
10142-101420070 = "Na praia?"
10142-101420080 = "Na piscina?"
10142-101420090 = "Na verdade..."
10142-101420100 = "Estou fazendo um pequeno treino de tiro no quintal"
10142-101420110 = "Mas é com pistola d'água"
10142-101420120 = "Ou seja... está brincando de guerrinha d'água?"
10142-101420130 = "Colocando desse jeito... acho que sim?"
10142-101420140 = "Realmente..."
10142-101420150 = "Parece que eu estava me preocupando demais"
10142-101420160 = "O pessoal da Hyakkaryouran me disse a mesma coisa"
10142-101420170 = "Que ninguém vai sofrer por me ver de roupa de banho"
10142-101420180 = "Viu só! Não foi exatamente o que eu disse?"
10142-101420190 = "Sim"
10142-101420200 = "Por isso, da próxima vez..."
10142-101420210 = "Vou tentar ir à praia com todo mundo"
10142-101420220 = "Acho que... vai ser divertido"
10142-101420230 = "Que ótimo. Não esqueça o protetor solar!"
10142-101420240 = "Pode deixar. Obrigada"
10142-101420250 = "Desde que fui à praia com o pessoal..."
10142-101420260 = "Quando dou por mim, já estou indo para a praia de novo"
10142-101420270 = "A praia é uma delícia, né"
10142-101420280 = "Sim. É muito bom"
10142-101420290 = "Nadar serve como treinamento"
10142-101420300 = "E também é ótimo para limpar a mente de distrações"
10142-101420310 = "Além disso, tem toda uma atmosfera única"
10142-101420320 = "Se eu soubesse que era assim, teria vindo muito mais vezes antes"
10142-101420330 = "Você pode ir bastante daqui para frente"
10142-101420340 = "...Sim. Tem razão"
10142-101420350 = "De agora em diante, pretendo ir cada vez mais à praia"
10142-101420360 = "Parece que o boato sobre a Yuki-onna ainda está rolando"
10142-101420370 = "Huum..."
10142-101420380 = "Se eu ficar tentando explicar para cada um, é capaz de entenderem mais errado ainda"
10142-101420390 = "O que será que eu faço?"
10142-101420400 = "Vamos para a praia juntos de novo!"
10142-101420410 = "Se continuarem me vendo junto com você, Sensei"
10142-101420420 = "Quer dizer que o boato vai sumir rapidinho?"
10142-101420430 = "Sim... entendi"
10142-101420440 = "É tudo pelo seu bem, Nagusa..."
10142-101420450 = "..."
10142-101420460 = "Você é mesmo bem astuto, né, Sensei"
10142-101420470 = "Por quê?!"
10142-101420480 = "Ouvi por acaso no caminho de volta"
10142-101420490 = "Que aquele boato de que uma Yuki-onna aparecia na praia..."
10142-101420500 = "Estão dizendo que era tudo mentira"
10142-101420510 = "Opa, missão cumprida então!"
10142-101420520 = "Sim. Um grande sucesso"
10142-101420530 = "Agora já posso ir à praia tranquila"
10142-101420540 = "Você vai comigo de novo, não vai?"
10142-101420550 = "..."
10142-101420560 = "Sim"
10142-101420570 = "Bom, até mais"
10142-101420580 = "Parece que o tempo vai continuar ótimo a semana inteira"
10142-101420590 = "Então, se tudo bem para você, Sensei..."
10142-101420600 = "Que tal nos encontrarmos no fim de semana?"
10142-101420610 = "Claro!"
10142-101420620 = "Eu estava pensando na mesma coisa!"
10142-101420630 = "Então vamos à praia de novo"
10142-101420640 = "Quem sabe não acontece outra coisa divertida"
