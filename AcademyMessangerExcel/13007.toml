[translation]
13007-1159 = "Уф... Почему вкусная еда такая дорогая..."
13007-1160 = "Хотела бы я зарабатывать деньги, не работая..."
13007-1161 = "Не стоит надеяться на лёгкие пути. Нужна настоящая работа."
13007-1162 = "Я тоже хочу зарабатывать деньги, не работая..."
13007-1163 = "Это правда, но..."
13007-1164 = "Погодите, учителю вообще нормально такое говорить?"
13007-1165 = "Ну, как бы вы ни говорили, к своей подработке я отношусь серьёзно."
13007-1166 = "У тебя есть подработка, Джунко?"
13007-1167 = "И что это должно значить?"
13007-1168 = "Что плохого в том, что я работаю на подработке?!"
13007-1169 = "Сенсей, Сенсей!"
13007-1170 = "Я только что узнала нечто невероятное!"
13007-1171 = "Что случилось?"
13007-1172 = "Я нашла способ есть кучу премиальных морепродуктов почти за бесценок!"
13007-1173 = "Правда?"
13007-1174 = "Джунко, не стоит нарушать закон даже ради дорогих морепродуктов."
13007-1175 = "Да. Но подробностей пока не скажу. Хи-хи."
13007-1176 = "За кого вы меня принимаете? Я не совершаю преступлений!"
13007-1177 = "Если хотите узнать подробности, приходите сегодня к ужину в столовую Академии Геенны."
13007-1178 = "Не опаздывайте!"
13007-1179 = "Ух."
13007-1180 = "Если бы я не купила тот пудинг для эксперимента с поддельной едой, сегодня могла бы нормально поужинать..."
13007-1181 = "Джунко."
13007-1182 = "Что?"
13007-1183 = "Я видел в интернете, что если полить огурец мёдом, он будет на вкус как дыня."
13007-1184 = "Очередной интернет-обман! К тому же мёд дороже самой дыни!"
13007-1185 = "Больше меня поддельной едой не обманешь!"
13007-1186 = "Хи-хи! Сенсей, вы сейчас обзавидуетесь."
13007-1187 = "Сегодня на ужин Общество исследования гурманства будет есть... мясо!"
13007-1188 = "...Мясо!"
13007-1189 = "И не просто мясо! Мы будем есть премиальную вагю!"
13007-1190 = "...Вагю!"
13007-1191 = "Хи-хи. Завидуете, Сенсей?"
13007-1192 = "Сегодня вы должны позеленеть от зависти!"
13007-1193 = "Я тоже хочу..."
13007-1194 = "Я вступаю в Общество исследования гурманства!"
13007-1195 = "Нет. Ресторан якинику, куда мы идём, принимает только небольшие компании."
13007-1196 = "Но когда вернусь, расскажу, какой вкусной была вагю!"
13007-1197 = "Сегодня на обед я иду с остальными из Общества исследования гурманства на шведский стол с тортами!"
13007-1198 = "Шведский стол с тортами?"
13007-1199 = "Что, вы не знаете, что это такое, Сенсей?"
13007-1200 = "Тогда объясню."
13007-1201 = "Это ресторан, где выставляют самые разные торты и можно есть сколько угодно."
13007-1202 = "По сути, ресторан моей мечты."
13007-1203 = "Звучит так, будто можно заболеть..."
13007-1204 = "Не будьте таким слабаком!"
13007-1205 = "Не каждый день дают возможность есть торты без ограничений!"
13007-1206 = "Угх..."
13007-1207 = "Как твой живот?"
13007-1208 = "Уже немного лучше."
13007-1209 = "Никогда не думала, что от сушёной ламинарии меня так раздует..."
13007-1210 = "В прошлый раз я видела, как Акари съела целую коробку сушёной ламинарии на перекус..."
13007-1211 = "Что особенного в желудке Акари?"
13007-1212 = "Сенсей, слышали про китайский квартал возле Академии Шаньхайцзин?"
13007-1213 = "Там все улицы забиты китайскими ресторанами, и говорят, что каждый из них потрясающий!"
13007-1214 = "Я тоже такое слышал."
13007-1215 = "Да, еда там действительно настолько хороша, как говорят."
13007-1216 = "Если даже ты об этом знаешь, значит, место и правда отличное."
13007-1217 = "Что? Вы уже были там без меня? Как жестоко!"
13007-1218 = "В любом случае как член Общества исследования гурманства и мастер гастрономии я не могу игнорировать такую новость."
13007-1219 = "Поэтому я подумала... Если у вас есть время на этих выходных, не хотите сходить со мной в Академию Шаньхайцзин?"
13007-1220 = "Конечно."
13007-1221 = "Хи-хи! Обещаете?"
13007-1222 = "Тогда увидимся у главных ворот Академии Шаньхайцзин на этих выходных!"
13007-130070010 = "Сенсей, Сенсей!"
13007-130070020 = "Вы... рады со мной разговаривать? Вот это что-то новенькое."
13007-130070030 = "Надо сделать скриншот нашего MomoTalk, чтобы никогда не забыть этот момент."
13007-130070040 = "Что за чушь вы несёте?!"
13007-130070050 = "Я... должна спросить."
13007-130070060 = "Вы ведь правда не сделали скриншот?"
13007-130070070 = "Конечно нет."
13007-130070080 = "Хорошо."
13007-130070090 = "Наконец-то готово!"
13007-130070100 = "Что?"
13007-130070110 = "Хи-хи-хи... Увидите при встрече."
13007-130070120 = "Вы в Шале?"
13007-130070130 = "Сейчас буду!"
