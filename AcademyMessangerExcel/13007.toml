[translation]
13007-1159 = "Uuu... Por que coisas gostosas têm que ser tão caras assim...?"
13007-1160 = "Queria ganhar dinheiro sem precisar trabalhar..."
13007-1161 = "Não fique esperando ganhar na loteria, tem que trabalhar direitinho e com esforço"
13007-1162 = "Eu também queria viver ganhando dinheiro sem precisar trabalhar..."
13007-1163 = "Uuu, eu sei que você tem razão, mas..."
13007-1164 = "...Sei que fui eu quem começou com esse papo, mas um Sensei deveria mesmo dizer uma coisa dessas?"
13007-1165 = "Bom, falei do fundo do coração, mas quando faço bico eu levo o trabalho bem a sério, tá?"
13007-1166 = "A Junko fazendo bico...?!"
13007-1167 = "Ei, que reação é essa?!"
13007-1168 = "Por acaso tem algo de estranho em eu trabalhar meio período?!"
13007-1169 = "Sensei, Sensei!"
13007-1170 = "Acabei de descobrir uma coisa incrível!"
13007-1171 = "O que foi?"
13007-1172 = "Descobri um jeito de comer um monte de frutos do mar de luxo por um precinho super em conta!"
13007-1173 = "Sério mesmo?"
13007-1174 = "Junko, por mais que você queira comer essas coisas, cometer crimes não pode, viu"
13007-1175 = "Claro que é sério. O método exato é segredo, mas... fufu"
13007-1176 = "O que você acha que eu sou?! Não é crime nenhum!"
13007-1177 = "Se quiser saber dos detalhes, venha ao refeitório de Gehenna hoje à noite!"
13007-1178 = "E vê se não se atrasa!"
13007-1179 = "Uuu..."
13007-1180 = "Se eu não tivesse gastado comprando ingredientes para aquele experimento maluco, daria para ter feito uma refeição de luxo..."
13007-1181 = "Ei, ei, Junko"
13007-1182 = "Hum, o quê?"
13007-1183 = "Vi na internet que se você passar mel no pepino, fica com gosto de melão"
13007-1184 = "De novo essas histórias da internet! E além do mais, mel já é caro pra caramba!"
13007-1185 = "Não vou cair nessa de novo, tá me ouvindo?!"
13007-1186 = "Fufu, ei, Sensei. Quer que eu te conte uma coisa boa?"
13007-1187 = "O jantar de hoje da Sociedade de Pesquisa Gourmet vai ser nada menos que... carne!"
13007-1188 = "Carne!"
13007-1189 = "E não é qualquer carne, é Wagyu de altíssima qualidade!"
13007-1190 = "Wagyu?!"
13007-1191 = "Fufu. Bateu aquela invejinha, né, Sensei?"
13007-1192 = "Hoje eu deixo você morrer de inveja de mim à vontade!"
13007-1193 = "Eu também quero comer..."
13007-1194 = "Vou entrar para a Sociedade de Pesquisa Gourmet também!"
13007-1195 = "Não pooode, o restaurante aonde vamos hoje tem limite de pessoas na reserva"
13007-1196 = "Em compensação, quando eu voltar, te conto em detalhes o quão delicioso estava!"
13007-1197 = "Hoje no almoço eu vou a um rodízio de bolos com a Sociedade de Pesquisa Gourmet!"
13007-1198 = "Rodízio de bolos?"
13007-1199 = "Ué, você não sabe o que é um rodízio de bolos, Sensei?"
13007-1200 = "Um rodízio de bolos é um lugar onde"
13007-1201 = "ficam vários tipos diferentes de bolo enfileirados, e você pode comer o quanto quiser dentro do tempo limite..."
13007-1202 = "É um estilo de refeição que parece saído de um sonho!"
13007-1203 = "Acho que eu enjoaria de tanto doce na metade..."
13007-1204 = "Não fala uma coisa dessas!"
13007-1205 = "Não é todo dia que aparece uma oportunidade de comer bolo até não aguentar mais!"
13007-1206 = "Uuu..."
13007-1207 = "Como você está se sentindo?"
13007-1208 = "É, já deu uma melhorada..."
13007-1209 = "Não sabia que alga kombu inchava tanto assim dentro do estômago..."
13007-1210 = "Outro dia a Akari comeu um pacote inteiro de alga kombu seca temperada como lanchinho, mas..."
13007-1211 = "O que será que tem dentro do estômago da Akari, afinal...?"
13007-1212 = "Sensei, você já ouviu os boatos sobre a Chinatown que fica perto de Shanhaijing?"
13007-1213 = "Dizem que é cheia de restaurantes chineses e que a comida de todos eles é deliciosa!"
13007-1214 = "Eu também já ouvi falar por alto"
13007-1215 = "A comida de lá é uma delícia mesmo"
13007-1216 = "Entendi. Se a fama já chegou até os seus ouvidos, Sensei, então não tem erro mesmo...!"
13007-1217 = "Quê?! Você foi lá sozinho sem nem me chamar?! Isso não vale!"
13007-1218 = "Enfim, como membro da Sociedade de Pesquisa Gourmet, eu simplesmente tenho que ir lá"
13007-1219 = "Então, err... No próximo fim de semana, se você estiver livre, não quer ir comigo?"
13007-1220 = "Claro, vamos sim"
13007-1221 = "Fufu, é uma promessa, hein?"
13007-1222 = "Então nos vemos no fim de semana, em frente ao portão principal do Colégio Sênior Shanhaijing!"
13007-130070010 = "Sensei, Sensei!"
13007-130070020 = "Parece animada, hein, Junko"
13007-130070030 = "Como isso é raro, acho que vou até tirar um print dessa tela do MomoTalk"
13007-130070040 = "Ei, o que você quer dizer com isso?!"
13007-130070050 = "...Só por via das dúvidas"
13007-130070060 = "Você não salvou o print de verdade, né?"
13007-130070070 = "Não salvei não..."
13007-130070080 = "Bom mesmo"
13007-130070090 = "Mas então... finalmente ficou pronto!"
13007-130070100 = "Ficou pronto o quê...?"
13007-130070110 = "Fufu... Você está na Schale agora, né?"
13007-130070120 = "Vou te mostrar pessoalmente!"
13007-130070130 = "Me espera aí que já estou indo!"
