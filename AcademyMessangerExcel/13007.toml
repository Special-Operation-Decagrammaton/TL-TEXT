[translation]
13007-1159 = "Уу... почему вкусная еда такая дорогая..."
13007-1160 = "Хочу денег, не работая..."
13007-1161 = "Не стоит рассчитывать на лёгкие деньги, лучше честно работать, пусть и понемногу."
13007-1162 = "Я тоже хочу жить на деньги, не работая..."
13007-1163 = "Уу, это-то верно, но..."
13007-1164 = "...Как ни странно, но вы, Сенсей, не должны так говорить."
13007-1165 = "Ну, это тоже правда, но когда я на подработке, я серьёзно работаю."
13007-1166 = "Джунко, ты работаешь...!?"
13007-1167 = "Эй, что это за реакция!"
13007-1168 = "Разве я не могу работать!?"
13007-1169 = "Сенсей, Сенсей!"
13007-1170 = "Я узнала кое-что потрясающее!"
13007-1171 = "Что случилось?"
13007-1172 = "Я нашла способ есть много дорогих морепродуктов по доступной цене!"
13007-1173 = "Правда?"
13007-1174 = "Джунко, как бы ты ни хотела такого, нельзя нарушать закон."
13007-1175 = "Конечно. Подробности секрет, но... хе-хе."
13007-1176 = "За кого вы меня принимаете!? Это не преступление!"
13007-1177 = "Если хотите узнать подробности, приходите сегодня вечером в столовую Геенны!"
13007-1178 = "Не опаздывайте!"
13007-1179 = "Уу..."
13007-1180 = "Если бы не пришлось покупать материалы для того эксперимента, я могла бы устроить роскошный ужин..."
13007-1181 = "Слушай, Джунко."
13007-1182 = "А? Что?"
13007-1183 = "Я видел в интернете: говорят, если намазать огурец мёдом, он будет на вкус как дыня."
13007-1184 = "Опять интернет-чушь! И мёд сам по себе дорогой!"
13007-1185 = "Меня больше не обманешь!"
13007-1186 = "Хе-хе, Сенсей, хотите, расскажу кое-что хорошее?"
13007-1187 = "Сегодня на ужин в клубе гурманов будет... мясо!"
13007-1188 = "Мясо!"
13007-1189 = "И притом высококачественная говядина!"
13007-1190 = "Говядина!?"
13007-1191 = "Хе-хе. Завидно, Сенсей?"
13007-1192 = "Сегодня вы можете сколько угодно мне завидовать!"
13007-1193 = "Я тоже хочу поесть..."
13007-1194 = "Я тоже вступлю в клуб гурманов!"
13007-1195 = "Нельзя, в том ресторане, куда мы идём сегодня, есть ограничение по числу мест."
13007-1196 = "Но когда я вернусь, я расскажу вам, как там было вкусно!"
13007-1197 = "Сегодня в клубе гурманов мы идём на шведский стол с тортами!"
13007-1198 = "Шведский стол с тортами?"
13007-1199 = "А, Сенсей не знает о шведском столе с тортами?"
13007-1200 = "Шведский стол с тортами — это когда"
13007-1201 = "стоит много разных тортов, и ты можешь есть сколько хочешь в течение определённого времени..."
13007-1202 = "Это просто мечта!"
13007-1203 = "Мне, наверное, быстро надоест..."
13007-1204 = "Не говори так!"
13007-1205 = "Возможность есть торты вволю выпадает не так часто!"
13007-1206 = "Уу..."
13007-1207 = "Как себя чувствуешь?"
13007-1208 = "Ага, уже немного лучше..."
13007-1209 = "Кто бы мог подумать, что морская капуста так сильно разбухает в желудке..."
13007-1210 = "На днях Акари съела целый пакет приправленной сушёной капусты как перекус..."
13007-1211 = "Что же у неё в желудке..."
13007-1212 = "Сенсей, вы слышали про китайский квартал рядом с Шанхайцзин?"
13007-1213 = "Там полно ресторанов китайской кухни, и везде говорят, очень вкусно!"
13007-1214 = "Я тоже слышал такие слухи."
13007-1215 = "Там было очень вкусно."
13007-1216 = "Понятно. Раз даже до тебя дошли слухи, значит, правда...!"
13007-1217 = "Что!? Вы пошли туда одна, даже не позвав меня!? Это нечестно!"
13007-1218 = "В любом случае, как член клуба гурманов, я обязана туда сходить."
13007-1219 = "Так что... эм, в эти выходные, если хотите, пойдём вместе?"
13007-1220 = "Да, давай."
13007-1221 = "Хе-хе, договорились?"
13007-1222 = "Тогда в выходные у главных ворот академии Шанхайцзин!"
13007-130070010 = "Сенсей, Сенсей!"
13007-130070020 = "Как весело, Джунко."
13007-130070030 = "Это редкость, может, я сделаю скриншот этого Момотолка?"
13007-130070040 = "Эй, что ты делаешь!?"
13007-130070050 = "...На всякий случай спрошу:"
13007-130070060 = "вы ведь не сохранили его?"
13007-130070070 = "Нет..."
13007-130070080 = "Ну и ладно."
13007-130070090 = "И вот... наконец-то всё готово!"
13007-130070100 = "Готово? Что готово...?"
13007-130070110 = "Хе-хе... вы сейчас в Шале?"
13007-130070120 = "Я сейчас всё вам покажу!"
13007-130070130 = "Ждите, я скоро буду!"