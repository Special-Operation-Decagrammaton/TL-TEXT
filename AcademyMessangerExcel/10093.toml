[translation]
10093-100930010 = "Oiê, oiê~"
10093-100930020 = "Essa aqui é a conta do Sensei mesmo, né?"
10093-100930030 = "Oiê, oiê~"
10093-100930040 = "Era essa mesmo~! Oiê, oiê~!"
10093-100930050 = "Hoje eu tava batendo papo com as minhas amigas,"
10093-100930060 = "e a gente começou a falar sobre as coisas de que a gente mais gosta."
10093-100930070 = "Aí eu percebi que o que eu mais amo mesmo é jogar conversa fora~!"
10093-100930080 = "E você, Sensei?"
10093-100930090 = "Gosta de bater papo?"
10093-100930100 = "Gosto sim."
10093-100930110 = "Eu também adoro conversar com você, Kirara."
10093-100930120 = "Hã, jura~?"
10093-100930130 = "A gente pensou a mesma coisa! Amei!"
10093-100930140 = "Oiê, oiê~"
10093-100930150 = "Tive uma ideia incrível, sou muito gênia!"
10093-100930160 = "Sensei, que tal você virar o conselheiro do Clube Cintilante?"
10093-100930170 = "Ah, pode responder quando quiser! Sem pressa, me avisa quando der!"
10093-100930180 = "Toc, toc"
10093-100930190 = "Sensei"
10093-100930200 = "Senseeei! (´；ω；`)"
10093-100930210 = "É a Kirara... né?"
10093-100930220 = "Buááá!"
10093-100930230 = "Me salva, Sensei! (＞＜)"
10093-100930240 = "Tirei nota vermelha na prova~ (´；ω；`)"
10093-100930250 = "Me ajuda a estudar aí na Schale~ (´；ω；`)"
10093-100930260 = "Ah, tá ocupado agora?"
10093-100930270 = "Imagina, tá tranquilo. Vou ficar te esperando."
10093-100930280 = "Você é demais, Sensei (＞＜) Valeu mesmo!"
10093-100930290 = "Sensei, muito obrigada mesmo (´；ω；`)"
10093-100930300 = "Graças a você eu consegui me esforçar horrores nos estudos!"
10093-100930310 = "Fico feliz em ter ajudado..."
10093-100930320 = "Ué? Tá meio desanimado, Sensei?"
10093-100930330 = "Quer que eu te dê uma injeção de ânimo na próxima?"
10093-100930340 = "Bom, até mais! Conto com você na próxima também!"
10093-100930350 = "Na próxima...?"
10093-100930360 = "Uhum! Te mando mensagem de novo bem rapidinho (＞＜)"
10093-100930370 = "Sensei!!!!!"
10093-100930380 = "Você tem tempo hoje?"
10093-100930390 = "Tenho sim, tudo tranquilo."
10093-100930400 = "Que bom♪"
10093-100930410 = "Então, pode me ajudar a estudar igual da outra vez?"
10093-100930420 = "Claro, deixa comigo."
10093-100930430 = "Dessa vez vem aqui pra minha sala de aula!"
10093-100930440 = "Hoje não tem ninguém aqui, então dá pra gente estudar no maior silêncio!"
10093-100930450 = "Bom, tô te esperando~!"
10093-100930460 = "Fiquei com uma pulga atrás da orelha aqui..."
10093-100930470 = "Você realmente não tava pensando em nada demais naquela hora, né?"
10093-100930480 = "Ah, não é que eu esteja duvidando de você nem nada!"
10093-100930490 = "Er, você quer que eu diga o que achei...?"
10093-100930500 = "Como assi"
10093-100930510 = "Epa,"
10093-100930520 = "o que você tá querendo me fazer falar!?"
10093-100930530 = "Você também tem um lado bem sério e dedicado, né, Kirara?"
10093-100930540 = "?"
10093-100930550 = "Ah..."
10093-100930560 = "Tá falando dos estudos?"
10093-100930570 = "Boa sorte na prova de recuperação!"
10093-100930580 = "T-Tá bom..."
10093-100930590 = "Enfim, valeu♪"
10093-100930600 = "Sensei!!!!!"
10093-100930610 = "Sensei, Sensei, Senseeei, Sensei, Senseeei!!!!!!!!!!!"
10093-100930620 = "O que aconteceu?"
10093-100930630 = "Consegui!"
10093-100930640 = "Passei na recuperação!!"
10093-100930650 = "Parabéns!"
10093-100930660 = "Ehehe"
10093-100930670 = "Tudo graças a você, Sensei♪"
10093-100930680 = "Por isso, deixa eu te recompensar?"
10093-100930690 = "Vem, bora sair pra passear!"
10093-100930700 = "Sensei!"
10093-100930710 = "Olha só,"
10093-100930720 = "quando eu passar na prova de novo, que tal a gente sair pra passear juntos mais uma vez?"
10093-100930730 = "Com certeza."
10093-100930740 = "Foi muito divertido passear por aí com você, Kirara."
10093-100930750 = "Ehehe"
10093-100930760 = "Então vou ter que ralar muito nos estudos de novo (´；ω；`) kkk"
10093-100930770 = "Bom, até mais!"
10093-100930780 = "Sensei! Socorro!"
10093-100930790 = "Perdi o meu caderno de espiral!"
10093-100930800 = "Você não viu ele por aí em algum lugar, Sensei...?"
10093-100930810 = "Só se você lembrar de cabeça mesmo."
10093-100930820 = "Como é esse caderno...?"
10093-100930830 = "Sabia que você não ia ter visto..."
10093-100930840 = "Desculpa, deixa pra lá...!"
10093-100930850 = "A gente se fala depois!"
10093-100930860 = "...Kirara?"
10093-100930870 = "Desculpa, Sensei!"
10093-100930880 = "Acabei de lembrar de um compromisso urgente!"
10093-100930890 = "Ah, e outra coisa..."
10093-100930900 = "Hum..."
10093-100930910 = "Sobre aquilo lá de agora há pouco..."
10093-100930920 = "Aquela parada..."
10093-100930930 = "Es-"
10093-100930940 = "Esquece..."
10093-100930950 = "Quer dizer,"
10093-100930960 = "não liga praquilo!"
10093-100930970 = "Entendido!?"
10093-100930980 = "E-Entendido...?"
10093-100930990 = "Isso aí! Fechou então!"
10093-100931000 = "Bom,"
10093-100931010 = "até mais, Sensei!"
