[translation]
10094-100940010 = "Sensei, Sensei!"
10094-100940020 = "Momoi, Momoi!"
10094-100940030 = "Escuta só!"
10094-100940040 = "Eu consegui uma roupa de maid!"
10094-100940050 = "A Momoi virou uma maid!"
10094-100940060 = "Sim... E assim teve início o meu plano profundo..."
10094-100940070 = "Para compreender o verdadeiro encanto contido em um uniforme de maid...!"
10094-100940080 = "Primeiro, eu preciso entrar totalmente no espírito de uma maid!"
10094-100940090 = "Bem a sua cara, Momoi."
10094-100940100 = "Acha? ...Bom, é isso aí!"
10094-100940110 = "Para entrar no clima de maid, nada melhor do que fazer coisas de maid, né?"
10094-100940120 = "Por isso, estou indo aí agora mesmo limpar a sala de descanso da Schale!"
10094-100940130 = "Me espera aí, Sensei!"
10094-100940140 = "Momoi? Momoi!?"
10094-100940150 = "Sensei, Sensei!"
10094-100940160 = "Momoi, Momoi!"
10094-100940170 = "Escuta só, Sensei!"
10094-100940180 = "Depois daquilo, eu dei uma pesquisada sobre o trabalho de uma maid!"
10094-100940190 = "Dizem que preparar as refeições também é super importante para uma maid!"
10094-100940200 = "Bom... comer é essencial para viver, né?"
10094-100940210 = "Sim... E assim o meu plano profundo foi posto em marcha novamente..."
10094-100940220 = "Uma maid que não consegue satisfazer o seu Mestre com a sua culinária ainda é uma amadora...!"
10094-100940230 = "Por isso! Decidi que preciso preparar um prato incrível para você, Sensei!"
10094-100940240 = "Então já sabe! Te espero mais tarde lá na sala do Clube de Desenvolvimento de Jogos!"
10094-100940250 = "Momoi? Momoi!?"
10094-100940260 = "Sensei!"
10094-100940270 = "Momoi!?"
10094-100940280 = "Escuta só, Sensei!"
10094-100940290 = "Eu tinha esquecido uma parte super importante do trabalho de uma maid!"
10094-100940300 = "Acabei de me lembrar disso agora há pouco..."
10094-100940310 = "Lá vem coisa suspeita de novo..."
10094-100940320 = "Já disse que não é nada disso!"
10094-100940330 = "Tenho certeza de que você também vai adorar isso, Sensei!"
10094-100940340 = "...Eu acho."
10094-100940350 = "E o que foi que você esqueceu?"
10094-100940360 = "É o seguinte...!"
10094-100940370 = "Fazer o Mestre descansar o corpo e a mente com calma!"
10094-100940380 = "T-Tem certeza de que dessa vez é só descansar mesmo?"
10094-100940390 = "Sim! Até porque,"
10094-100940400 = "se a gente não descansar, acaba pifando, né?"
10094-100940410 = "Por isso é super importante descansar para o dia de amanhã!"
10094-100940420 = "Você também não acha, Sensei?"
10094-100940430 = "Sim, ter um descanso adequado é importante."
10094-100940440 = "Não é?!"
10094-100940450 = "Então vem aqui pra Millennium depois!"
10094-100940460 = "Como maid, vou te dar o melhor descanso de todos de presente!"
10094-100940470 = "Uugh..."
10094-100940480 = "Ainda tô toda dolorida..."
10094-100940490 = "Eu também..."
10094-100940500 = "Descansar era uma coisa tão difícil assim!?"
10094-100940510 = "A gente devia ter só relaxado normalmente..."
10094-100940520 = "Mas!"
10094-100940530 = "Assim não tem graça!"
10094-100940540 = "Tinha que ser algo muito mais super-ultra-revolucionário e eficiente!"
10094-100940550 = "Algo que ficasse gravado na memória pra sempre!"
10094-100940560 = "Huum, será que não existe um método de descanso assim em algum lugar?"
10094-100940570 = "Quando a dor muscular passar, a gente pensa nisso de novo..."
10094-100940580 = "..."
10094-100940590 = "É verdade."
10094-100940600 = "Hehe, é uma promessa, hein, Sensei!"
