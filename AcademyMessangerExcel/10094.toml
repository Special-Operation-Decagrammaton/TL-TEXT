[translation]
10094-100940010 = "Сенсей, Сенсей!"
10094-100940020 = "Момои, Момои!"
10094-100940030 = "Послушайте!"
10094-100940040 = "Я заполучила горничную форму!"
10094-100940050 = "Момои становится горничной!"
10094-100940060 = "Да... так начинается мой глубокий план..."
10094-100940070 = "Чтобы понять романтику, заложенную в форме горничной, нужно прежде всего"
10094-100940080 = "войти в роль горничной!"
10094-100940090 = "Вот это по-Момоевски."
10094-100940100 = "Да?.. Ну, ладно, так и быть!"
10094-100940110 = "Если уж входить в роль, то лучше всего делать что-то по-горничному, верно?"
10094-100940120 = "Итак, сейчас я пойду убираться в комнате отдыха Шале!"
10094-100940130 = "Ну, Сенсей, ждите!"
10094-100940140 = "Момои? Момои!?"
10094-100940150 = "Сенсей, Сенсей!"
10094-100940160 = "Момои, Момои!"
10094-100940170 = "Послушайте, Сенсей!"
10094-100940180 = "Я немного почитала о работе горничной после того раза!"
10094-100940190 = "Оказывается, для горничной приготовление еды тоже очень важно!"
10094-100940200 = "Ну... еда — неотъемлемая часть жизни."
10094-100940210 = "Да... так мой глубокий план снова запущен..."
10094-100940220 = "Если горничная не может угодить господину своей стряпнёй, она неполноценна...!"
10094-100940230 = "Поэтому! Я должна приготовить вам вкусное угощение!"
10094-100940240 = "Вот так! Встречаемся позже в клубе разработки игр!"
10094-100940250 = "Момои? Момои!?"
10094-100940260 = "Сенсей!"
10094-100940270 = "Момои!?"
10094-100940280 = "Послушайте, Сенсей!"
10094-100940290 = "Я забыла кое-что важное в работе горничной!"
10094-100940300 = "И только что вспомнила..."
10094-100940310 = "Опять какие-то подозрительные тучи..."
10094-100940320 = "Нет, не то!"
10094-100940330 = "Я думаю, и вам это понравится!"
10094-100940340 = "...Наверное."
10094-100940350 = "Что же вы забыли?"
10094-100940360 = "А вот что...!"
10094-100940370 = "Давать телу и душе полноценный отдых!"
10094-100940380 = "В-вы уверены, что в этот раз только отдых?"
10094-100940390 = "Да! Потому что"
10094-100940400 = "человек без отдыха сломается, верно?"
10094-100940410 = "Так что отдыхать ради завтрашнего дня — важно!"
10094-100940420 = "Вы ведь тоже так считаете, Сенсей?"
10094-100940430 = "Да, умеренный отдых важен."
10094-100940440 = "Вот видите!"
10094-100940450 = "Так что приходите в Миллениум!"
10094-100940460 = "Как горничная, я подарю вам лучший отдых!"
10094-100940470 = "У-у-у..."
10094-100940480 = "Всё ещё болят мышцы..."
10094-100940490 = "У меня тоже..."
10094-100940500 = "Разве отдых может быть таким сложным!?"
10094-100940510 = "Надо было просто нормально расслабиться..."
10094-100940520 = "Но!"
10094-100940530 = "Так же неинтересно!"
10094-100940540 = "Нужно что-то супер-ультра-революционное и эффективное!"
10094-100940550 = "И чтобы запомнилось надолго!"
10094-100940560 = "Хм... не найдётся ли где-нибудь такого способа отдохнуть?"
10094-100940570 = "Когда мышцы перестанут болеть, можно будет подумать снова..."
10094-100940580 = "..."
10094-100940590 = "Да, наверное."
10094-100940600 = "Хе-хе, договорились, Сенсей!"