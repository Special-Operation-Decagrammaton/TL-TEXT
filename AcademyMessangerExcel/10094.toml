[translation]
10094-100940010 = "Сенсей, Сенсей!"
10094-100940020 = "Момои, Момои!"
10094-100940030 = "Угадай что?"
10094-100940040 = "Смотри, что у меня есть! Костюм горничной!"
10094-100940050 = "Внезапно мне стало тревожно!"
10094-100940060 = "В общем, я придумала потрясающий план!"
10094-100940070 = "Я надела костюм горничной! И вдруг!"
10094-100940080 = "Мне захотелось БЫТЬ горничной!"
10094-100940090 = "Просто плывёшь по течению."
10094-100940100 = "И вот! Поэтому!"
10094-100940110 = "Если я хочу почувствовать себя настоящей горничной, мне надо выполнять обязанности горничной, да?"
10094-100940120 = "Так что я приду убрать гостиную Шале!"
10094-100940130 = "Вот! Увидимся там, Сенсей!"
10094-100940140 = "Момои? Момои?!"
10094-100940150 = "Сенсей, Сенсей!"
10094-100940160 = "Да! Момои, Момои!"
10094-100940170 = "Угадай что?"
10094-100940180 = "Я тут почитала, что входит в обязанности горничной."
10094-100940190 = "И, оказывается, готовить еду — одна из самых важных задач!"
10094-100940200 = "Потому что всем нам надо есть, чтобы жить...?"
10094-100940210 = "И поэтому я придумала план ещё лучше прошлого!"
10094-100940220 = "В этот раз я приготовлю Сенсею"
10094-100940230 = "САМОЕ ЛУЧШЕЕ БЛЮДО!"
10094-100940240 = "Встретимся в клубной комнате Клуба разработки игр, ладно?"
10094-100940250 = "Момои? Момои?!"
10094-100940260 = "Сенсей!"
10094-100940270 = "Момои!"
10094-100940280 = "Угадай что?"
10094-100940290 = "Я всё это время кое-что забывала"
10094-100940300 = "об ежедневных обязанностях горничной..."
10094-100940310 = "Почему мне так тревожно...?"
10094-100940320 = "Ничего такого!"
10094-100940330 = "Тебе и это понравится, Сенсей!"
10094-100940340 = "...Наверное."
10094-100940350 = "Так что именно ты забывала?"
10094-100940360 = "Я забыла про"
10094-100940370 = "отдых для души и тела!"
10094-100940380 = "Это немного... неожиданно."
10094-100940390 = "Вовсе нет!"
10094-100940400 = "Без отдыха люди ломаются, знаешь ли!"
10094-100940410 = "Так что сегодня отдыхаешь, а завтра снова усердно работаешь!"
10094-100940420 = "Может, это и не обязательно, но всё равно очень важно!"
10094-100940430 = "Контекст немного странный, но от отдыха я никогда не откажусь."
10094-100940440 = "Вот именно!"
10094-100940450 = "Приходи в Миллениум,"
10094-100940460 = "и я устрою тебе лучший отдых на свете!"
10094-100940470 = "Уа-а..."
10094-100940480 = "У меня всё тело до сих пор болит..."
10094-100940490 = "У меня тоже..."
10094-100940500 = "Я и не знала, что отдых может быть таким опасным!"
10094-100940510 = "В следующий раз попробуем более обычный способ отдохнуть..."
10094-100940520 = "Но понимаешь..."
10094-100940530 = "Это же скучно!"
10094-100940540 = "Думаю, нам просто надо найти самый-самый крутой"
10094-100940550 = "умный, необычный, эффективный и незабываемый"
10094-100940560 = "способ отдыхать, Сенсей!"
10094-100940570 = "Мы придумаем его вместе! ...Как только спины перестанут болеть."
10094-100940580 = "..."
10094-100940590 = "Хорошо..."
10094-100940600 = "Обещаешь?"
