[translation]
10079-100790010 = "Olha, até que é bem interessante."
10079-100790020 = "Parece tudo igual à primeira vista, mas tem várias diferenças."
10079-100790030 = "Me sinto como se estivesse passeando num ponto turístico."
10079-100790040 = "O que você está olhando?"
10079-100790050 = "O que achou diferente, por exemplo?"
10079-100790060 = "Huum..."
10079-100790070 = "Quer saber?"
10079-100790080 = "Acho que fica mais fácil de entender se você vier aqui ver."
10079-100790090 = "Você tem tempo agora?"
10079-100790100 = "........."
10079-100790110 = "Argh..."
10079-100790120 = "F-foi mal."
10079-100790130 = "Eu não devia ter me metido..."
10079-100790140 = "Ah."
10079-100790150 = "Não, eu agradeço pela ajuda, Sensei."
10079-100790160 = "Graças a você pude conhecer vários lugares diferentes."
10079-100790170 = "Por enquanto, vou me dar por satisfeita com isso."
10079-100790180 = "...Mas"
10079-100790190 = "não ache que eu vou desistir assim tão fácil, viu?"
10079-100790200 = "Sensei."
10079-100790210 = "Escuta..."
10079-100790220 = "Foi mal te incomodar, mas acabei me metendo numa pequena confusão."
10079-100790230 = "Você tá livre agora?"
10079-100790240 = "Confusão?!"
10079-100790250 = "O quê?! O que houve? Onde você está agora?!"
10079-100790260 = "Então..."
10079-100790270 = "Ufa..."
10079-100790280 = "Que canseira."
10079-100790290 = "E quem diria que até vindo parar num lugar desses iam me chamar de \"Onee-sama\"..."
10079-100790300 = "Espera, isso quer dizer..."
10079-100790310 = "Que já costumam te chamar assim de onde você veio?"
10079-100790320 = "É-é um mal-entendido!"
10079-100790330 = "Huum..."
10079-100790340 = "Explicar isso ia dar muito pano pra manga, então vamos encerrar esse assunto por aqui."
10079-100790350 = "...Enfim, você me salvou hoje, Sensei."
10079-100790360 = "Bom, depois eu entro em contato de novo."
10079-100790370 = "Sensei."
10079-100790380 = "Tá ocupado agora?"
10079-100790390 = "O que foi?"
10079-100790400 = "É alguma urgência?"
10079-100790410 = "Não."
10079-100790420 = "Não é nada urgente assim, mas..."
10079-100790430 = "Se estiver ocupado, deixa pra lá."
10079-100790440 = "Eu só queria te perguntar uma coisinha."
10079-100790450 = "Sabe aquele Peroro que você comprou pra mim, Sensei?"
10079-100790460 = "Parece que ele não é um Peroro comum."
10079-100790470 = "Dizem que o nome dele é \"Dr. Peroro\"."
10079-100790480 = "Não dá quase na mesma...?"
10079-100790490 = "No fim das contas não continua sendo o Peroro?"
10079-100790500 = "?????"
10079-100790510 = "Não."
10079-100790520 = "Não mesmo, são completamente diferentes!"
10079-100790530 = "Basta olhar pra ver que são diferentes!"
10079-100790540 = "Ufa..."
10079-100790550 = "Vou pesquisar mais a fundo sobre eles e depois te ensino tudo direitinho, Sensei."
10079-100790560 = "Obrigada por hoje!"
10079-100790570 = "Até mais, Sensei!"
10079-100790580 = "Aaah, qual é!"
10079-100790590 = "O que é isso?!"
10079-100790600 = "Não acredito que ela aprontou uma dessas comigo aqui também!"
10079-100790610 = "\"Aqui também\"...?"
10079-100790620 = "O que aconteceu?"
10079-100790630 = "Sensei,"
10079-100790640 = "consegue vir pra cá agora mesmo?"
10079-100790650 = "Queria uma ajudinha sua..."
10079-100790660 = "Ah, aliás,"
10079-100790670 = "só pra deixar bem claro:"
10079-100790680 = "Eu não costumo ser tão violenta assim no dia a dia, tá bom?"
10079-100790690 = "Não vá fazer ideia errada de mim!"
10079-100790700 = "Mas eu nem tinha pensado nisso..."
10079-100790710 = "Ou será que a carapuça serviu?"
10079-100790720 = "N-não!"
10079-100790730 = "Não é nada disso!"
10079-100790740 = "Claro que não é, poxa!"
