[translation]
10079-100790010 = "Довольно интересно."
10079-100790020 = "Все вроде похожи, но есть различия."
10079-100790030 = "Такое чувство, будто я в туристическом месте."
10079-100790040 = "Что вы смотрите?"
10079-100790050 = "Например, что именно?"
10079-100790060 = "Хм…"
10079-100790070 = "Да, наверное."
10079-100790080 = "Наверное, будет проще, если вы придёте и сами увидите."
10079-100790090 = "У вас есть время?"
10079-100790100 = "…………"
10079-100790110 = "Кх…"
10079-100790120 = "П-простите."
10079-100790130 = "Я сказала лишнее…"
10079-100790140 = "Ах."
10079-100790150 = "Нет, я благодарна вам, Сенсей."
10079-100790160 = "Благодаря вам я смогла посмотреть много разных мест."
10079-100790170 = "Пока что будем считать, что этого достаточно."
10079-100790180 = "…Но"
10079-100790190 = "Я не собираюсь сдаваться на этом."
10079-100790200 = "Сенсей."
10079-100790210 = "Слушайте,"
10079-100790220 = "извините, но у меня небольшая проблема."
10079-100790230 = "Вы сейчас свободны?"
10079-100790240 = "Проблема!?"
10079-100790250 = "Что!? Что случилось? Где вы сейчас!?"
10079-100790260 = "Ну…"
10079-100790270 = "Ох…"
10079-100790280 = "Я устала."
10079-100790290 = "Вернее, даже здесь меня называют «старшей сестрой»…"
10079-100790300 = "Это значит…"
10079-100790310 = "То есть вас всегда так называли?"
10079-100790320 = "Н-не поймите неправильно!"
10079-100790330 = "Хм…"
10079-100790340 = "Станет запутанно, давайте закончим эту тему."
10079-100790350 = "…Спасибо, выручили, Сенсей."
10079-100790360 = "Ну, я свяжусь с вами позже."
10079-100790370 = "Сенсей."
10079-100790380 = "Вы сейчас заняты?"
10079-100790390 = "Что случилось?"
10079-100790400 = "Это срочно?"
10079-100790410 = "Нет."
10079-100790420 = "Не то чтобы срочно, но…"
10079-100790430 = "Если вы заняты, то ничего."
10079-100790440 = "Просто хочу кое-что спросить."
10079-100790450 = "Насчёт Пероро, которого вы мне купили."
10079-100790460 = "Похоже, это не обычный Пероро."
10079-100790470 = "Говорят, он называется «Доктор Пероро»."
10079-100790480 = "Разве это не одно и то же…?"
10079-100790490 = "Ведь это всё равно Пероро, разве нет?"
10079-100790500 = "?????"
10079-100790510 = "Нет."
10079-100790520 = "Нет-нет, они совсем разные!"
10079-100790530 = "По-моему, очевидно, что разные!"
10079-100790540 = "Фух…"
10079-100790550 = "Я стану более осведомлённой и многое расскажу вам, Сенсей."
10079-100790560 = "Спасибо за сегодня!"
10079-100790570 = "До встречи, Сенсей!"
10079-100790580 = "Ах, ну вот."
10079-100790590 = "Что такое?"
10079-100790600 = "И здесь меня накрыло!"
10079-100790610 = "И здесь — это…?"
10079-100790620 = "Что случилось?"
10079-100790630 = "Сенсей."
10079-100790640 = "Вы можете прийти прямо сейчас?"
10079-100790650 = "Я хочу попросить вас о помощи…"
10079-100790660 = "Кстати,"
10079-100790670 = "на всякий случай скажу:"
10079-100790680 = "я не такая уж и агрессивная в обычной жизни, знаете ли."
10079-100790690 = "Не поймите неправильно, ладно?"
10079-100790700 = "Я так и не думала, но…"
10079-100790710 = "Может, вы это осознаёте?"
10079-100790720 = "Тьфу."
10079-100790730 = "Нет."
10079-100790740 = "Нет же, хватит!"