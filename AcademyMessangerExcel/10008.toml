[translation]
10008-644 = "Эй, Сенсей. Вы заняты?"
10008-645 = "Загляните как-нибудь в Миллениум."
10008-646 = "Я тоже занята, но найду время увидеться с вами!"
10008-647 = "Конечно, зайду, как только будет возможность."
10008-648 = "Хорошо. Буду ждать."
10008-649 = "Ха-ха-ха, ладно."
10008-650 = "Эх, Сенсей! В следующий раз предупредите, когда придёте."
10008-651 = "Но ты же сама сказала мне прийти."
10008-652 = "Я говорил, что загляну."
10008-653 = "Р-Разве?"
10008-654 = "Может быть..."
10008-655 = "В-В любом случае!"
10008-656 = "Кхм."
10008-657 = "В общем, утро было весёлым."
10008-658 = "Аканэ... Можешь... связаться со всеми за меня?"
10008-659 = "Не могу поверить, но... кажется, я простудилась."
10008-660 = "Кажется... я опоздаю..."
10008-661 = "Нэру? Кажется, ты ошиблась номером."
10008-662 = "Ты заболела?"
10008-663 = "Эй, Сенсей. Каша была так себе."
10008-664 = "Но, эм... спасибо, что навестили меня, когда я болела."
10008-665 = "Я обязательно отплачу, ладно?"
10008-666 = "Выздоравливай скорее, Нэру."
10008-667 = "Буду ждать."
10008-668 = "Эй, Сенсей."
10008-669 = "Вы в порядке? Я слышала, вы простудились."
10008-670 = "Это правда?"
10008-671 = "Кхе... Температура... Уф..."
10008-672 = "Меня ещё и знобит..."
10008-673 = "Хорошо, готовьтесь."
10008-674 = "Я уже иду в Шале."
10008-675 = "*вздох* В последнее время я столько пропустила, что посещаемости почти не осталось."
10008-676 = "Что мне делать?"
10008-677 = "Думаю, тебе просто нужно постараться ходить на занятия."
10008-678 = "Думаю, тебе просто нужно стараться усерднее."
10008-679 = "Л-Легко сказать!"
10008-680 = "Я хочу простое решение..."
10008-681 = "Такого не бывает."
10008-682 = "Так дела не делаются."
10008-683 = "..."
10008-684 = "Я... Ясно."
10008-685 = "Хмф, я-я и так это знала!"
10008-686 = "Просто буду стараться!"
10008-687 = "Мне всего-то надо не опаздывать!"
10008-688 = "Ты справишься!"
10008-689 = "Сенсей!"
10008-690 = "Хочешь увидеть кое-что реально крутое?"
10008-691 = "Что-то потрясающее?!"
10008-692 = "Подозрительно..."
10008-693 = "Что такое?"
10008-694 = "Ха-ха-ха!"
10008-695 = "Раз уж тебе так интересно, почему бы не найти время и не прийти сюда?"
10008-696 = "Это правда потрясающе! Не пожалеешь!"
10008-697 = "Скажи, если захочешь снова туда сходить! Пойдём вместе!"
10008-698 = "Если пойдёшь один, я тебя убью!"
10008-699 = "Хорошо, обещаю."
10008-100080010 = "А."
10008-100080020 = "Мне скучно."
10008-100080030 = "Сенсей, что вы сейчас делаете?"
10008-100080040 = "Ничего особенного..."
10008-100080050 = "Наверное, ты сегодня свободна, Нэру."
10008-100080060 = "Ха."
10008-100080070 = "Ну,"
10008-100080080 = "у меня выходной."
10008-100080090 = "Как там расписание?"
10008-100080100 = "Если тебе нечего делать, давай потусуемся."
10008-100080110 = "А."
10008-100080120 = "Кстати, Сенсей, я уже упоминала, но..."
10008-100080130 = "Насчёт бомбера."
10008-100080140 = "Скажите, если понадобится. Я могу достать вам один."
10008-100080150 = "Хорошо?"
10008-100080160 = "Хочешь одинаковые? Как у парочки?"
10008-100080170 = "..."
10008-100080180 = "Не..."
10008-100080190 = "Больше никогда не говорите такую тупую чушь!"
