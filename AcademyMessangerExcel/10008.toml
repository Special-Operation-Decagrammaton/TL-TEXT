[translation]
10008-644 = "Эй, Сенсей, ты в последнее время занят?"
10008-645 = "Я тебя в Миллениуме не вижу, если выпадет момент, загляни как-нибудь."
10008-646 = "Я тоже занята, но на пару встреч время найду."
10008-647 = "Ага, тогда приду."
10008-648 = "Да, хорошо, как-нибудь зайду."
10008-649 = "Ха, буду ждать, но без особых надежд."
10008-650 = "Ну блин, если собрался прийти, предупреждай. Я тут расслабилась..."
10008-651 = "Но ведь ты сама меня позвала, разве нет?"
10008-652 = "Я же говорил, что приду в гости...?"
10008-653 = "А? Да ну?"
10008-654 = "Раз ты так говоришь, может, и правда..."
10008-655 = "К-короче!!"
10008-656 = "А... ну, как бы это..."
10008-657 = "Я удивилась, когда увидела тебя с утра... а, но обещание ты выполнишь!?"
10008-658 = "Аканэ... всем... передай привет..."
10008-659 = "Не верится, но... похоже, я простудилась."
10008-660 = "Опоздаю... наверное..."
10008-661 = "Неру? Ты, случайно, не ошиблась адресатом?"
10008-662 = "Неру!? Ты в порядке!?"
10008-663 = "Эй, Сенсей. Та каша была так себе на вкус."
10008-664 = "...Но спасибо, что навестил."
10008-665 = "Я обязательно отплачу тебе за это, так что готовься."
10008-666 = "Поправляйся скорее."
10008-667 = "Ага, буду ждать."
10008-668 = "Эй, Сенсей."
10008-669 = "Слышал, ты простудился?"
10008-670 = "Это правда?"
10008-671 = "Кашель... температура..."
10008-672 = "Озноб..."
10008-673 = "Ха, ну ты и слабак. Готовься."
10008-674 = "Сейчас приеду в Шале."
10008-675 = "В последнее время я слишком часто опаздываю и прогуливаю, так что посещаемость на грани..."
10008-676 = "Может, есть какой-то способ..."
10008-677 = "Думаю, надо просто ходить на занятия."
10008-678 = "Лучше стать прилежной ученицей."
10008-679 = "Мне сейчас не нужны такие правильные ответы!"
10008-680 = "Нет ли какого-то удобного способа!?"
10008-681 = "Такого не существует."
10008-682 = "Обманывать нельзя."
10008-683 = "..."
10008-684 = "...Ну, наверное, ты прав."
10008-685 = "Тьфу, понял-понял!"
10008-686 = "Буду ходить, как надо!"
10008-687 = "Просто не опаздывать и не прогуливать!"
10008-688 = "Держись!"
10008-689 = "Слушай, Сенсей."
10008-690 = "Хочешь увидеть кое-что классное?"
10008-691 = "Это довольно неплохая вещь."
10008-692 = "Подозрительно..."
10008-693 = "Что это...?"
10008-694 = "Ха-ха!"
10008-695 = "Если интересно, приходи сегодня вечером в Миллениум."
10008-696 = "Не пожалеешь."
10008-697 = "Если захочешь в то место, скажи мне! Я пойду с тобой!"
10008-698 = "Если пойдёшь одна — убью, понял!?"
10008-699 = "Ага, договорились. Спасибо за сегодня."
10008-100080010 = "Эй, Сенсей."
10008-100080020 = "Мне скучно."
10008-100080030 = "Что делаешь сейчас?"
10008-100080040 = "Ничего."
10008-100080050 = "Мне тоже скучно."
10008-100080060 = "Ха-ха."
10008-100080070 = "Понятно."
10008-100080080 = "...Так, значит, скучаешь?"
10008-100080090 = "Раз уж выходной,"
10008-100080100 = "если заняться нечем, приезжай в Миллениум."
10008-100080110 = "Кстати,"
10008-100080120 = "продолжим прошлый разговор."
10008-100080130 = "А, насчёт той куртки с вышивкой."
10008-100080140 = "Если захочешь — скажи в любое время."
10008-100080150 = "Я поищу тебе."
10008-100080160 = "Как насчёт одинаковых?"
10008-100080170 = "..."
10008-100080180 = "За-заткнись!!"
10008-100080190 = "Не говори глупостей!!"
