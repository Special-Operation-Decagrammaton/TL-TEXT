[translation]
10008-644 = "E aí, Sensei, anda ocupado ultimamente?"
10008-645 = "Nem tenho te visto pela Millennium. Quando der um tempinho, por que não dá as caras por aqui?"
10008-646 = "Eu também tô na correria, mas consigo arrumar um tempinho pra gente se ver."
10008-647 = "Beleza, então vou dar um pulo aí."
10008-648 = "Boa ideia, passo aí qualquer hora dessas."
10008-649 = "Humpf, vou esperar sem criar expectativa."
10008-650 = "Pô, se vinha mesmo, avisava antes! Me pegou totalmente desprevenida..."
10008-651 = "Mas não foi você que me chamou, Neru?"
10008-652 = "Eu tenho certeza de que avisei que vinha..."
10008-653 = "Hã? Foi mesmo?"
10008-654 = "Agora que você falou, acho que foi isso mesmo..."
10008-655 = "E-Enfim!!"
10008-656 = "É que... como é que eu digo..."
10008-657 = "Só fiquei surpresa de te encontrar logo cedo... Ah, e vê se cumpre a promessa, hein?!"
10008-658 = "Akane... avisa... o pessoal pra mim..."
10008-659 = "Nem eu tô acreditando, mas... parece que peguei um resfriado."
10008-660 = "Vou chegar atrasada... eu acho..."
10008-661 = "Neru? Você não mandou mensagem pra pessoa errada, não?"
10008-662 = "Neru?! Você tá bem?!"
10008-663 = "E aí, Sensei. Aquele mingau tava com um gosto meio duvidoso, viu?"
10008-664 = "...Mas valeu por ter vindo me visitar."
10008-665 = "Um dia eu pago essa dívida sem falta, então pode se preparar."
10008-666 = "Melhoras, viu?"
10008-667 = "Beleza, vou ficar esperando."
10008-668 = "E aí, Sensei."
10008-669 = "Fiquei sabendo que você pegou um resfriado?"
10008-670 = "É verdade mesmo?"
10008-671 = "Que tosse... que febre..."
10008-672 = "Tô com calafrios..."
10008-673 = "Hah, que papelão. Pode ir se preparando aí."
10008-674 = "Tô indo pra Schale agora mesmo."
10008-675 = "Ultimamente andei chegando atrasada e faltando tanto que minha presença tá por um fio..."
10008-676 = "Será que não tem nenhum jeito esperto de resolver isso, não...?"
10008-677 = "Acho que é só começar a assistir às aulas direitinho."
10008-678 = "Que tal virar uma aluna exemplar?"
10008-679 = "Não tô pedindo sermão certinho uma hora dessas!"
10008-680 = "Não tem nenhum atalho mais conveniente, não?!"
10008-681 = "Não existe atalho pra isso."
10008-682 = "Sem trapaça."
10008-683 = "......"
10008-684 = "...É, fazer o quê, né."
10008-685 = "Tsc, tá bom, já entendi!"
10008-686 = "É só eu ir pra aula direito, né?!"
10008-687 = "É só não atrasar nem faltar mais e pronto!"
10008-688 = "Boa sorte!"
10008-689 = "Ei, Sensei."
10008-690 = "Não tá a fim de ver uma parada bem maneira?"
10008-691 = "Garanto que não é nada mal, viu?"
10008-692 = "Sei não, tá meio suspeito..."
10008-693 = "Como assim...?"
10008-694 = "Haha!"
10008-695 = "Se ficou curioso, aparece na Millennium hoje à noite."
10008-696 = "Você não vai se arrepender."
10008-697 = "Quando quiser ir naquele lugar de novo, fala comigo! Eu vou junto com você!"
10008-698 = "Se for sozinho eu te arrebento, ouviu bem?!"
10008-699 = "Tá bom, combinado. Prometo. Valeu por hoje!"
10008-100080010 = "Fala, Sensei."
10008-100080020 = "Tô meio à toa aqui."
10008-100080030 = "Tá fazendo o que agora?"
10008-100080040 = "Nada de mais."
10008-100080050 = "Também tô à toa."
10008-100080060 = "Haha."
10008-100080070 = "Saquei."
10008-100080080 = "...Beleza, então você tá livre, né?"
10008-100080090 = "Já que hoje é dia de folga,"
10008-100080100 = "se não tem nada pra fazer, dá um pulo aqui na Millennium."
10008-100080110 = "Por falar nisso,"
10008-100080120 = "continuando o papo de agora há pouco..."
10008-100080130 = "Ah, sobre a jaqueta sukajan."
10008-100080140 = "Se bater vontade de ter uma, pode me falar a qualquer hora."
10008-100080150 = "Eu mesma descolo uma pra você."
10008-100080160 = "Que tal usarmos duas iguais combinando?"
10008-100080170 = "......"
10008-100080180 = "I-Idiota!"
10008-100080190 = "Não fala essas coisas esquisitas do nada!!"
