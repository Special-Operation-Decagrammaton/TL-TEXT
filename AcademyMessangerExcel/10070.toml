[translation]
10070-100700010 = "Este número..."
10070-100700020 = "É do Sensei da Schale, certo?"
10070-100700030 = "Sim, sou eu mesmo..."
10070-100700040 = "Ah, ótimo."
10070-100700050 = "Aqui é Konoe Mina."
10070-100700060 = "O plantão de hoje na Schale ficou comigo, não foi?"
10070-100700070 = "Sim, estou te esperando."
10070-100700080 = "Meu primeiro plantão."
10070-100700090 = "Pode esperar grandes coisas de mim."
10070-100700100 = "Chegarei aí pontualmente."
10070-100700110 = "Nos vemos na Schale, então."
10070-100700120 = "Sensei, seu espírito está preparado?"
10070-100700130 = "Para ajudar minhas alunas, estou sempre pronto."
10070-100700140 = "Fico grata por ter aceitado de bom grado, mas..."
10070-100700150 = "Ter que recorrer à ajuda do Sensei para manter a ordem pública em Shanhaijing"
10070-100700160 = "é uma falha vergonhosa para uma executiva do Genryumon."
10070-100700170 = "Juro que retribuirei essa dívida de gratidão em nome do Genryumon."
10070-100700180 = "Não precisa esquentar a cabeça com isso."
10070-100700190 = "Fico feliz em poder ajudar."
10070-100700200 = "Entendo..."
10070-100700210 = "Nesse caso, conto com você."
10070-100700220 = "Mas, por favor, coloque a sua própria segurança em primeiro lugar."
10070-100700230 = "Se algo acontecesse com você, Sensei..."
10070-100700240 = "Seria um grande problema para mim também."
10070-100700250 = "Tem trabalho em Shanhaijing hoje de novo?"
10070-100700260 = "Sim, mas devo terminar perto da hora do almoço."
10070-100700270 = "Tenho visto você com bastante frequência por Shanhaijing ultimamente, Sensei."
10070-100700280 = "S-será que estou atrapalhando...?"
10070-100700290 = "Não."
10070-100700300 = "Longe disso. Na verdade, é muito conveniente."
10070-100700310 = "Perto da hora do almoço, então... Entendi."
10070-100700320 = "Se precisar de alguma coisa, é só me avisar antes..."
10070-100700330 = "Heh."
10070-100700340 = "Não precisa se preocupar tanto."
10070-100700350 = "Nos vemos logo depois do almoço, então."
10070-100700360 = "Sensei."
10070-100700370 = "Soube que você pegou um resfriado. Está tudo bem?"
10070-100700380 = "Que frio... e minha cabeça também está doendo..."
10070-100700390 = "Descanse bastante..."
10070-100700400 = "Heh."
10070-100700410 = "Já eu estou perfeitamente bem."
10070-100700420 = "Então aquele velho ditado estava certo mesmo..."
10070-100700430 = "Que ditado popular seria esse?"
10070-100700440 = "Hum... aquele lá..."
10070-100700450 = "De que certas pessoas nunca pegam resfriado, faça chuva ou faça sol..."
10070-100700460 = "...O que exatamente você quer dizer com isso?"
10070-100700470 = "...Sensei."
10070-100700480 = "Sensei?"
10070-100700490 = "Tínhamos combinado de você vir ao Genryumon hoje, mas podemos deixar para outro dia?"
10070-100700500 = "Desculpe avisar em cima da hora, mas surgiu um compromisso no Jardim da Flor de Ameixeira."
10070-100700510 = "Ah, no Jardim da Flor de Ameixeira..."
10070-100700520 = "Faz tempo que não passo lá, acho que vou dar um pulo aí também!"
10070-100700530 = "Às vezes eu me pergunto..."
10070-100700540 = "O trabalho na Schale é tão tranquilo assim?"
10070-100700550 = "...De vez em quando, quem sabe?"
10070-100700560 = "Pode ser impressão minha, mas"
10070-100700570 = "parece acontecer com frequência demais para um simples \"de vez em quando\"."
10070-100700580 = "Bom, que seja."
10070-100700590 = "Se o seu trabalho permitir, vamos juntos então."
10070-100700600 = "Estarei esperando na frente do Jardim da Flor de Ameixeira."
