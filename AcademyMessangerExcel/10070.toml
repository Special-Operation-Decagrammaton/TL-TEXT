[translation]
10070-100700010 = "Этот номер..."
10070-100700020 = "Вы Сенсей из Шале?"
10070-100700030 = "Да, это я, но..."
10070-100700040 = "А, хорошо."
10070-100700050 = "Я Коное Мина."
10070-100700060 = "Сегодня я дежурю в Шале, верно?"
10070-100700070 = "Да, буду ждать."
10070-100700080 = "Первое дежурство."
10070-100700090 = "Ждите с нетерпением."
10070-100700100 = "Буду вовремя."
10070-100700110 = "Тогда встретимся в Шале."
10070-100700120 = "Сенсей, вы готовы?"
10070-100700130 = "Помогать студентам — я всегда готов."
10070-100700140 = "Вы согласились легко, но..."
10070-100700150 = "Мне придётся просить вашей помощи в поддержании порядка в Шанхайцзине."
10070-100700160 = "Как члену Генрюмон, это позорно."
10070-100700170 = "Я обязательно отблагодарю вас именем Генрюмон."
10070-100700180 = "Не волнуйтесь."
10070-100700190 = "Я рад, что могу помочь."
10070-100700200 = "Вот как..."
10070-100700210 = "Тогда рассчитываю на вас."
10070-100700220 = "Но, пожалуйста, берегите себя."
10070-100700230 = "Если с вами что-то случится..."
10070-100700240 = "для меня это будет серьёзной проблемой."
10070-100700250 = "У вас сегодня снова дела в Шанхайцзине?"
10070-100700260 = "Да, к обеду я освобожусь."
10070-100700270 = "В последнее время я часто вижу вас в Шанхайцзине."
10070-100700280 = "Я вам не мешаю...?"
10070-100700290 = "Нет."
10070-100700300 = "Вовсе нет. Наоборот, удачно."
10070-100700310 = "К обеду... понятно."
10070-100700320 = "Если у вас есть какие-то дела, скажите заранее..."
10070-100700330 = "Фу."
10070-100700340 = "Не волнуйтесь так."
10070-100700350 = "Тогда увидимся после обеда."
10070-100700360 = "Сенсей."
10070-100700370 = "Я слышала, вы простудились, вы в порядке?"
10070-100700380 = "Мне холодно... и голова болит..."
10070-100700390 = "Отдыхайте как следует..."
10070-100700400 = "Хм."
10070-100700410 = "Со мной-то всё в порядке."
10070-100700420 = "Та поговорка была верна..."
10070-100700430 = "Что за суеверие?"
10070-100700440 = "Ну... то самое."
10070-100700450 = "Что есть люди, которые никогда не болеют, что бы ни случилось..."
10070-100700460 = "...Это что за бред?"
10070-100700470 = "...Сенсей."
10070-100700480 = "Сенсей?"
10070-100700490 = "Сегодня я планировала попросить вас прийти в Генрюмон, но можно перенести?"
10070-100700500 = "Простите за внезапность, я должна идти в Сад цветущей сливы."
10070-100700510 = "Вот как, в Сад цветущей сливы..."
10070-100700520 = "Давно я там не была, может, тоже загляну?"
10070-100700530 = "Иногда мне кажется..."
10070-100700540 = "что у вас в Шале как-то слишком много свободного времени?"
10070-100700550 = "...Ну, иногда, наверное?"
10070-100700560 = "Может, мне кажется,"
10070-100700570 = "но это «иногда» звучит слишком часто."
10070-100700580 = "Впрочем, ладно."
10070-100700590 = "Если ваша работа позволяет, давайте пойдём вместе."
10070-100700600 = "Я подожду вас у Сада цветущей сливы."
