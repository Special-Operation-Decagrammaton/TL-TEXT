[translation]
10070-100700010 = "Этот номер..."
10070-100700020 = "Это номер Сенсея?"
10070-100700030 = "Так и есть..."
10070-100700040 = "Отлично. Я не ошиблась."
10070-100700050 = "Я Коноэ Мина."
10070-100700060 = "Сегодня я работаю в Шале."
10070-100700070 = "Буду ждать встречи."
10070-100700080 = "Это мой первый день обязанностей."
10070-100700090 = "Я обязательно тебя не разочарую."
10070-100700100 = "Я буду вовремя, несмотря ни на что."
10070-100700110 = "Увидимся в Шале."
10070-100700120 = "Ты готов, Сенсей?"
10070-100700130 = "Сенсей всегда готов помочь студенту."
10070-100700140 = "Да, но всё же..."
10070-100700150 = "Подумать только, мне понадобилась помощь, чтобы обезопасить Шаньхайцзин..."
10070-100700160 = "Мне стыдно как офицеру Генрюмона."
10070-100700170 = "Однажды я отплачу этот долг, во имя Генрюмона."
10070-100700180 = "Не нужно так себя чувствовать."
10070-100700190 = "В какой-то мере я делаю это потому, что сам хочу."
10070-100700200 = "Понятно."
10070-100700210 = "В таком случае я приму твою помощь."
10070-100700220 = "Пожалуйста, береги себя."
10070-100700230 = "Если с тобой что-нибудь случится, Сенсей..."
10070-100700240 = "...для меня это тоже будет большой проблемой."
10070-100700250 = "Ты сегодня снова работаешь в Шаньхайцзине?"
10070-100700260 = "Да, но думаю, закончу утром."
10070-100700270 = "В последнее время я часто вижу тебя в Шаньхайцзине."
10070-100700280 = "Это проблема?"
10070-100700290 = "Нет."
10070-100700300 = "Вообще-то нет. Совсем нет."
10070-100700310 = "В любом случае, днём... Ну..."
10070-100700320 = "Если хочешь что-то сказать, говори..."
10070-100700330 = "Ухе..."
10070-100700340 = "Ничего."
10070-100700350 = "Тогда скоро увидимся, Сенсей."
10070-100700360 = "Сенсей."
10070-100700370 = "Я слышала, ты простудился. Ты в порядке?"
10070-100700380 = "Мне холодно, и всё болит..."
10070-100700390 = "Это... плохо..."
10070-100700400 = "Ухе..."
10070-100700410 = "Я, конечно, чувствую себя прекрасно."
10070-100700420 = "Это доказывает тот старый миф...?"
10070-100700430 = "Какой миф?"
10070-100700440 = "Ну, знаешь..."
10070-100700450 = "Что некоторые типы людей не простужаются..."
10070-100700460 = "Что это значит?"
10070-100700470 = "Сенсей?"
10070-100700480 = "Сенсей?"
10070-100700490 = "Если ты собирался сегодня прийти в Генрюмон, я хотела бы попросить тебя перенести визит."
10070-100700500 = "Сегодня я собираюсь в Сад цветущей сливы."
10070-100700510 = "Сад цветущей сливы..."
10070-100700520 = "Может, и мне стоит заглянуть..."
10070-100700530 = "Иногда у меня возникает ощущение..."
10070-100700540 = "что работа Сенсея в Шале... оставляет довольно много свободного времени?"
10070-100700550 = "Обычно нет, но иногда бывает?"
10070-100700560 = "Может, мне кажется, но..."
10070-100700570 = "по-моему, это происходит чаще, чем иногда."
10070-100700580 = "В любом случае, отлично!"
10070-100700590 = "Если собираешься в Сад цветущей сливы, пойдём вместе."
10070-100700600 = "Увидимся там."
