[translation]
10039-100390010 = "Э-э..."
10039-100390020 = "Сенсей."
10039-100390030 = "Если вам не трудно..."
10039-100390040 = "не могли бы вы уделить время в эти выходные?"
10039-100390050 = "Да, конечно. Что случилось?"
10039-100390060 = "Ну..."
10039-100390070 = "Э-э..."
10039-100390080 = "Я хотела бы сходить в магазин товаров для активного отдыха."
10039-100390090 = "Все из отряда RABBIT, ну..."
10039-100390100 = "Мне одной неловко... так что если вам не трудно, не могли бы вы пойти со мной?"
10039-100390110 = "Если нужно помочь с покупками, я с радостью!"
10039-100390120 = "Ах, нет, я не прошу помочь с покупками..."
10039-100390130 = "Если я пойду одна, наверное..."
10039-100390140 = "никто не станет со мной разговаривать..."
10039-100390150 = "...???"
10039-100390160 = "Э-э, Сенсей."
10039-100390170 = "Сегодня задание отряда RABBIT закончилось рано,"
10039-100390180 = "так что я, возможно, приду раньше, чем ожидала."
10039-100390190 = "Так что, ну..."
10039-100390200 = "Если вам нужно что-то купить..."
10039-100390210 = "...?"
10039-100390220 = "Э-э, Сенсей?"
10039-100390230 = "Вы, наверное, отдыхаете...?"
10039-100390240 = "Э-э, Сенсей."
10039-100390250 = "Простите..."
10039-100390260 = "Из-за меня вас, кажется, неправильно поняли..."
10039-100390270 = "Я всё-таки бесполезна... простите..."
10039-100390280 = "Нет, всё в порядке. Не переживайте."
10039-100390290 = "Да..."
10039-100390300 = "Но я впервые привлекла столько внимания, поэтому тот ошейник немного жалко выбрасывать..."
10039-100390310 = "Если вы не против,"
10039-100390320 = "может, я буду носить ошейник только в Шале...?"
10039-100390330 = "Это слишком рискованно, извините, но лучше не надо..."
10039-100390340 = "Ну, Сенсей."
10039-100390350 = "В последнее время у меня одни неудачи..."
10039-100390360 = "Я действительно обуза для отряда RABBIT, я бесполезна..."
10039-100390370 = "Это не так."
10039-100390380 = "Ты, Мию, отличный снайпер."
10039-100390390 = "Но..."
10039-100390400 = "Прошло много времени с моей последней официальной тренировки... можно ли назвать меня отличной..."
10039-100390410 = "Возможно, мои навыки стали хуже..."
10039-100390420 = "...Сенсей, если вы не против,"
10039-100390430 = "не могли бы вы помочь мне с тренировкой?"
10039-100390440 = "Спасибо за прошлую тренировку."
10039-100390450 = "Кажется, моя точность немного улучшилась."
10039-100390460 = "Но... в последнее время я склонна думать о плохом..."
10039-100390470 = "И настроение часто падает..."
10039-100390480 = "Может, попробуешь как следует заняться своим хобби?"
10039-100390490 = "Хобби..."
10039-100390500 = "Понятно..."
10039-100390510 = "Возможно, вы правы."
10039-100390520 = "Я попробую."
10039-100390530 = "Сенсей, завтра вы собираетесь в город?"
10039-100390540 = "Если вам не трудно, я бы хотела пойти с вами..."
10039-100390550 = "Конечно!"
10039-100390560 = "У вас есть какие-то дела?"
10039-100390570 = "Ну..."
10039-100390580 = "У меня есть задание от СРТ..."
10039-100390590 = "Бои в городе...!?"
10039-100390600 = "Н-нет... не настолько серьёзное задание...!"
10039-100390610 = "Э-э..."
10039-100390620 = "Иногда люди, которые делятся со мной овощами,"
10039-100390630 = "просят меня избавиться от вредителей..."
10039-100390640 = "Тогда я пойду с тобой."
10039-100390650 = "Вы уверены?"
10039-100390660 = "Б-буду очень признательна...!"
