[translation]
10039-100390010 = "Hum..."
10039-100390020 = "Sensei"
10039-100390030 = "Se você não se importar..."
10039-100390040 = "Neste fim de semana, você teria um tempinho...?"
10039-100390050 = "Claro, tudo bem. O que houve?"
10039-100390060 = "Bom..."
10039-100390070 = "Hum..."
10039-100390080 = "Eu queria ir a uma loja de artigos de acampamento, mas..."
10039-100390090 = "As meninas do Pelotão RABBIT estão..."
10039-100390100 = "E ir sozinha é meio complicado... então, se você puder ir comigo..."
10039-100390110 = "Se precisar de alguém para carregar as compras, deixa comigo!"
10039-100390120 = "Ah, não, não é para carregar as compras que eu queria pedir ajuda..."
10039-100390130 = "É que, provavelmente, se eu for sozinha..."
10039-100390140 = "acho que nenhum atendente vai notar a minha presença..."
10039-100390150 = "...???"
10039-100390160 = "Hum, Sensei"
10039-100390170 = "Hoje a missão do Pelotão RABBIT terminou mais cedo,"
10039-100390180 = "então acho que vou conseguir chegar aí antes do esperado."
10039-100390190 = "Por isso, hum..."
10039-100390200 = "Se precisar que eu compre alguma coisa no caminho..."
10039-100390210 = "...?"
10039-100390220 = "Hum, Sensei?"
10039-100390230 = "Será que você está descansando...?"
10039-100390240 = "Hum, Sensei"
10039-100390250 = "Me desculpe..."
10039-100390260 = "Soube que entenderam você errado por minha causa, Sensei..."
10039-100390270 = "Eu sou mesmo uma inútil... Me perdoe..."
10039-100390280 = "Imagina, está tudo bem. Não esquenta com isso."
10039-100390290 = "Sim..."
10039-100390300 = "Mas, como foi a primeira vez que recebi tanta atenção daquele jeito, dá até um pouco de pena de jogar aquela coleira fora..."
10039-100390310 = "Se você não se importar, Sensei,"
10039-100390320 = "que tal eu usar a coleira só quando estiver na Schale...?"
10039-100390330 = "Isso é perigoso em vários sentidos, então foi mal, mas é melhor deixar quieto..."
10039-100390340 = "Hum, Sensei..."
10039-100390350 = "Ultimamente eu só tenho cometido erros atrás de erros..."
10039-100390360 = "Não tem jeito, eu sou mesmo um peso morto para o Pelotão RABBIT, uma completa inútil..."
10039-100390370 = "Não diga isso, não é verdade."
10039-100390380 = "Você é uma excelente sniper, Miyu."
10039-100390390 = "Mas..."
10039-100390400 = "Já faz tanto tempo desde a última vez que tive um treinamento oficial... Não sei se ainda posso ser chamada de excelente..."
10039-100390410 = "Talvez a minha habilidade tenha piorado em relação a antes..."
10039-100390420 = "...Sensei, se você não se importar,"
10039-100390430 = "poderia me acompanhar em um treinamento?"
10039-100390440 = "Muito obrigada pelo treinamento do outro dia."
10039-100390450 = "Sinto que a minha precisão melhorou um pouquinho."
10039-100390460 = "Mas... ultimamente eu ainda acabo pensando sempre pelo lado negativo..."
10039-100390470 = "e fico desanimada com facilidade..."
10039-100390480 = "Que tal tentar curtir bastante algum hobby seu para distrair?"
10039-100390490 = "Um hobby..."
10039-100390500 = "Entendo..."
10039-100390510 = "Realmente, pode ser uma boa ideia."
10039-100390520 = "Vou tentar fazer isso."
10039-100390530 = "Sensei, amanhã você vai até o centro da cidade, não é?"
10039-100390540 = "Se não se importar, eu poderia ir junto com você...?"
10039-100390550 = "Claro!"
10039-100390560 = "Tem alguma coisa para resolver lá também?"
10039-100390570 = "Bom..."
10039-100390580 = "É que surgiu uma missão da SRT..."
10039-100390590 = "Combate no meio da cidade...!?"
10039-100390600 = "N-não... Não é uma missão grandiosa assim...!"
10039-100390610 = "Hum..."
10039-100390620 = "As pessoas que às vezes dividem verduras conosco"
10039-100390630 = "nos pediram para ajudar no controle de pragas..."
10039-100390640 = "Nesse caso, eu vou junto com você."
10039-100390650 = "Tem certeza?"
10039-100390660 = "M-muito obrigada, conto com você...!"
