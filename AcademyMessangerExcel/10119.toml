[translation]
10119-101190010 = "Прошу прощения."
10119-101190020 = "Вы мне звонили?"
10119-101190030 = "Только что."
10119-101190040 = "Ты была занята?"
10119-101190050 = "Я была на тренировке, поэтому не видела..."
10119-101190060 = "Срочно?"
10119-101190070 = "Что-то случилось?"
10119-101190080 = "Завтра я собираюсь в Хяккияко,"
10119-101190090 = "и хочу обсудить сотрудничество с Хяккарёран."
10119-101190100 = "Завтра...?"
10119-101190110 = "Хорошо, но... справлюсь ли я?"
10119-101190120 = "... В смысле справлюсь?"
10119-101190130 = "Я могу принимать важные решения"
10119-101190140 = "за Хяккарёран?"
10119-101190150 = "Кто сейчас представляет Хяккарёран?"
10119-101190160 = "... Точно."
10119-101190170 = "Я всё ещё не привыкла."
10119-101190180 = "Ну, тогда до завтра."
10119-101190190 = "Я слышала,"
10119-101190200 = "ты придёшь на фестиваль в эти выходные?"
10119-101190210 = "Да, наверное."
10119-101190220 = "Меня пригласил торговый совет."
10119-101190230 = "Вот как."
10119-101190240 = "Меня тоже пригласили,"
10119-101190250 = "я буду помогать."
10119-101190260 = "Чем ты будешь помогать, Нагуса?"
10119-101190270 = "Буду жарить курицу на лотке."
10119-101190280 = "Говорят, не хватает рук."
10119-101190290 = "Курица от Нагусы! С нетерпением жду!"
10119-101190300 = "Похоже, будет много других лотков."
10119-101190310 = "Надеюсь, фестиваль будет весёлым."
10119-101190320 = "Конечно, и для вас, Сенсей, тоже."
10119-101190330 = "Спасибо."
10119-101190340 = "Я смогла поучаствовать в завершении."
10119-101190360 = "Хорошее фото."
10119-101190370 = "Всё было так, как вы и сказали, Сенсей."
10119-101190380 = "Когда я честно всё рассказала, все обрадовались."
10119-101190390 = "Но в конце все сильно смеялись..."
10119-101190400 = "Что же было смешного...?"
10119-101190410 = "Что ты сказала?"
10119-101190420 = "Что даже если выгляжу крутой красавицей, на самом деле это не так..."
10119-101190430 = "Хе-хе"
10119-101190440 = "Думаю, Нагуса гораздо забавнее, чем думает о себе."
10119-101190450 = "Забавная? Я...?"
10119-101190460 = "Может, мне кажется,"
10119-101190470 = "но в последнее время ночных происшествий стало больше."
10119-101190480 = "Хяккарёрану тоже нелегко."
10119-101190490 = "Нагуса, будь осторожна на ночных дорогах."
10119-101190500 = "Всё в порядке."
10119-101190510 = "В этом наша роль."
10119-101190520 = "Ночью людей мало, а я хорошо вижу в темноте."
10119-101190530 = "Но если возникнут проблемы, это будет хлопотно."
10119-101190540 = "Похоже, нужно усилить ночное патрулирование на время."
10119-101190550 = "Сегодня я планирую закончить работу,"
10119-101190560 = "если можно, я тоже пойду с вами?"
10119-101190570 = "Правда?"
10119-101190580 = "Тогда увидимся позже."
10119-101190590 = "Ты знаешь, что такое юки-онна?"
10119-101190600 = "Её часто изображают как красивую горную ведьму,"
10119-101190610 = "интересно, почему?"
10119-101190620 = "Причин может быть много..."
10119-101190630 = "Может, потому что это бросается в глаза и привлекает внимание?"
10119-101190640 = "Точно."
10119-101190650 = "Если хочешь обмануть людей, красивая внешность удобнее."
10119-101190660 = "... Если бы я была горной ведьмой, я бы стала великой горной ведьмой."
10119-101190670 = "Хороший настрой!"