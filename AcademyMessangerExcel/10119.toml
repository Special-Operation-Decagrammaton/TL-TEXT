[translation]
10119-101190010 = "Desculpa."
10119-101190020 = "Você tinha me mandado mensagem?"
10119-101190030 = "Agorinha mesmo."
10119-101190040 = "Estava ocupada?"
10119-101190050 = "Eu estava no meio do treino e acabei não vendo..."
10119-101190060 = "É urgente?"
10119-101190070 = "Precisava de alguma coisa?"
10119-101190080 = "Vou à Hyakkiyako amanhã"
10119-101190090 = "E queria conversar sobre a cooperação com o Hyakkaryouran."
10119-101190100 = "Amanhã...?"
10119-101190110 = "Por mim tudo bem, mas... tem certeza de que pode ser comigo?"
10119-101190120 = "...Como assim?"
10119-101190130 = "Não sei se sou eu quem deveria decidir"
10119-101190140 = "Assuntos tão importantes do Hyakkaryouran..."
10119-101190150 = "Quem é a representante atual do Hyakkaryouran mesmo?"
10119-101190160 = "...É verdade."
10119-101190170 = "Ainda não me acostumei com isso."
10119-101190180 = "Bom, até amanhã então."
10119-101190190 = "Ouvi dizer que..."
10119-101190200 = "Você vem para o festival neste fim de semana?"
10119-101190210 = "Sim, provavelmente."
10119-101190220 = "A Associação de Comerciantes me convidou."
10119-101190230 = "Ah, entendi."
10119-101190240 = "Eu também fui chamada."
10119-101190250 = "Vou lá ajudar."
10119-101190260 = "No que você vai ajudar, Nagusa?"
10119-101190270 = "Fiquei encarregada de assar espetinhos de frango na barraca."
10119-101190280 = "Disseram que estavam precisando de gente."
10119-101190290 = "Espetinhos feitos pela Nagusa! Mal posso esperar!"
10119-101190300 = "Parece que vai ter várias outras barracas também."
10119-101190310 = "Tomara que seja um festival divertido."
10119-101190320 = "Para você também, claro, Sensei."
10119-101190330 = "Obrigada."
10119-101190340 = "Me deixaram participar da confraternização."
10119-101190360 = "Que foto ótima."
10119-101190370 = "Foi exatamente como você disse, Sensei."
10119-101190380 = "Quando falei com sinceridade, todo mundo ficou feliz."
10119-101190390 = "Mas, no final, todas caíram na gargalhada..."
10119-101190400 = "O que será que acharam tão engraçado...?"
10119-101190410 = "O que você disse?"
10119-101190420 = "Disse que, embora eu pareça uma beldade fria e calculista, na verdade não sou nada disso..."
10119-101190430 = "Hehe."
10119-101190440 = "Acho que você é bem mais divertida do que imagina, Nagusa."
10119-101190450 = "Divertida? Eu...?"
10119-101190460 = "Pode ser impressão minha, mas"
10119-101190470 = "Sinto que os problemas noturnos aumentaram ultimamente."
10119-101190480 = "O trabalho do Hyakkaryouran não é fácil mesmo."
10119-101190490 = "Tome cuidado andando à noite também, Nagusa."
10119-101190500 = "Não se preocupe."
10119-101190510 = "Esse é o nosso dever, afinal."
10119-101190520 = "Quase não tem gente na rua à noite, e eu enxergo bem no escuro."
10119-101190530 = "Mas se acontecer algum problema vai dar dor de cabeça,"
10119-101190540 = "então acho melhor reforçarmos as rondas noturnas por um tempo."
10119-101190550 = "Parece que vou conseguir terminar o trabalho cedo hoje."
10119-101190560 = "Se não se importar, posso ir junto?"
10119-101190570 = "Mesmo?"
10119-101190580 = "Então até mais tarde."
10119-101190590 = "Você conhece a lenda da Yuki-onna, a Mulher da Neve?"
10119-101190600 = "Ela quase sempre é retratada como uma youkai muito bonita,"
10119-101190610 = "mas por que será?"
10119-101190620 = "Deve haver vários motivos nos detalhes do folclore, mas..."
10119-101190630 = "Não seria porque assim fica mais fácil de chamar a atenção?"
10119-101190640 = "Faz sentido."
10119-101190650 = "Para enganar as pessoas, ser bonita é bem mais conveniente, né."
10119-101190660 = "...Se eu fosse uma youkai, talvez tivesse me tornado uma Grande Youkai."
10119-101190670 = "Assim que se fala!"
