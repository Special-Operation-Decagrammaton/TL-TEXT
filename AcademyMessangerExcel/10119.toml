[translation]
10119-101190010 = "Ах. Сенсей."
10119-101190020 = "Простите. Вы звонили?"
10119-101190030 = "Привет, Нагуса! Да!"
10119-101190040 = "Ты, наверное, была занята!"
10119-101190050 = "Я не брала телефон на тренировку."
10119-101190060 = "В любом случае, что-то случилось?"
10119-101190070 = "Вам нужна моя помощь?"
10119-101190080 = "Ничего срочного! Завтра я приеду в Хяккияко!"
10119-101190090 = "Завтра обсудим наше сотрудничество с Хяккарёран!"
10119-101190100 = "Завтра...?"
10119-101190110 = "Я могу освободить время, но... это правда нормально?"
10119-101190120 = "Что нормально?"
10119-101190130 = "Я никто."
10119-101190140 = "Мне не подобает принимать решения за Хяккарёран."
10119-101190150 = "А? Нагуса! Ты представительница Хяккарёран!"
10119-101190160 = "А."
10119-101190170 = "Простите. Я опять забыла."
10119-101190180 = "Поняла. Буду ждать завтрашней встречи."
10119-101190190 = "Сенсей."
10119-101190200 = "В эти выходные в Хяккияко проходит Фестиваль торговой улицы. Вы придёте?"
10119-101190210 = "Если работа не помешает, буду!"
10119-101190220 = "Меня попросила быть там гильдия торговцев!"
10119-101190230 = "Понятно."
10119-101190240 = "Тогда, возможно, наши пути пересекутся."
10119-101190250 = "Торговцы попросили моей помощи."
10119-101190260 = "Здорово! Чем будешь заниматься?"
10119-101190270 = "Я буду... жарить шашлычки в киоске."
10119-101190280 = "Говорят, им не хватает поваров."
10119-101190290 = "О-о-о! Шашлычки, приготовленные Нагусой! Мне обязательно нужны!"
10119-101190300 = "Там будут продавать множество разных уличных блюд."
10119-101190310 = "Я очень надеюсь, что фестиваль взбодрит всех участников."
10119-101190320 = "И надеюсь, вы тоже хорошо проведёте время, Сенсей."
10119-101190330 = "Спасибо, Сенсей."
10119-101190340 = "Благодаря вашим усилиям мне было приятно пообщаться с людьми из торгового района."
10119-101190360 = "Похоже, было очень весело!"
10119-101190370 = "Да."
10119-101190380 = "Я говорила от сердца, как вы и советовали, и мои слова приняли хорошо."
10119-101190390 = "На самом деле все разразились смехом, пока я говорила."
10119-101190400 = "Хотя я не рассказывала шутку."
10119-101190410 = "Что ты сказала?"
10119-101190420 = "Я могу казаться загадочной, хладнокровной и неприступной красавицей, но, пожалуйста, относитесь ко мне как к любой другой."
10119-101190430 = "Нагуса."
10119-101190440 = "Ты вообще-то очень забавный человек. Ты знала?"
10119-101190450 = "Вот... как?"
10119-101190460 = "Возможно, мне лишь кажется,"
10119-101190470 = "но похоже, в последнее время Моурё действуют по ночам."
10119-101190480 = "Может, из-за жары!"
10119-101190490 = "Даже они не могут безобразничать в такую жару!"
10119-101190500 = "...Возможно."
10119-101190510 = "Ночью улицы под лунным светом тоже пустеют,"
10119-101190520 = "что позволяет им без труда заниматься незаконными делами."
10119-101190530 = "Чтобы противостоять этому, я собираюсь чаще патрулировать по ночам."
10119-101190540 = "Мы не можем допустить, чтобы студент пострадал в ночной темноте."
10119-101190550 = "Нелегко приходится Хяккарёран."
10119-101190560 = "Ты тоже будь осторожна, Нагуса!"
10119-101190570 = "Не беспокойтесь."
10119-101190580 = "Я отлично вижу ночью."
10119-101190590 = "Сенсей, вы слышали предания о снежной деве?"
10119-101190600 = "Во многих сказаниях её изображают цветущей красавицей."
10119-101190610 = "Мне любопытно, почему её описывают именно так."
10119-101190620 = "Причин много... но одна особенно приходит на ум."
10119-101190630 = "Может, потому что «красота» привлекает внимание людей?"
10119-101190640 = "Потому что «красота» привлекательна... Понятно."
10119-101190650 = "Никто не попадётся в ловушку без приманки. Поэтому «цветущая красавица» вполне подходит на роль наживки."
10119-101190660 = "Я даже рада, что я не ёкай."
10119-101190670 = "Мне нравится эта уверенность!"
