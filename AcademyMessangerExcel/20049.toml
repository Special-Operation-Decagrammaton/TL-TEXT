[translation]
20049-200490010 = "Песок"
20049-200490020 = "Вода"
20049-200490030 = "Зонт"
20049-200490040 = "Мисаки?"
20049-200490050 = "Я всё смотрю и думаю..."
20049-200490060 = "Что же в этом находят люди?"
20049-200490070 = "То есть..."
20049-200490080 = "ты хочешь поиграть вместе?"
20049-200490090 = "С чего ты это взял?"
20049-200490100 = "Я устала."
20049-200490110 = "Двигаться в воде оказалось так трудно."
20049-200490120 = "Ты уже немного научилась плавать."
20049-200490130 = "Правда? Я помню только, что барахталась."
20049-200490140 = "Если будет следующий раз... я поищу другой способ."
20049-200490150 = "Может, лучше было взять круг?"
20049-200490160 = "..."
20049-200490170 = "Нет, не то."
20049-200490180 = "Опять я одна на пляже."
20049-200490190 = "Ах"
20049-200490200 = "Я больше не буду плавать."
20049-200490210 = "Есть и другие способы наслаждаться морем."
20049-200490220 = "Например, играть с песком."
20049-200490230 = "...«Играть с песком», значит?"
20049-200490240 = "Не обращайся со мной как с ребёнком."
20049-200490250 = "Мне кажется, вместе было бы весело."
20049-200490260 = "Всё остальное я ещё могу терпеть,"
20049-200490270 = "но к этому солнцу никак не привыкну."
20049-200490280 = "Палящее солнце — это и есть главная прелесть летнего моря!"
20049-200490290 = "..."
20049-200490300 = "Что ещё ты задумал на этот раз?"
20049-200490310 = "Может, позагораем вместе?"
20049-200490320 = "Ну давай, пока."
20049-200490330 = "Хорошо! Я сейчас приду!"
20049-200490340 = "Эй, ты читаешь, что я пишу?"
20049-200490350 = "В итоге всё время было пасмурно."
20049-200490360 = "Это считается за загар?"
20049-200490370 = "Хм, ну это было неожиданно..."
20049-200490380 = "Я так и думала."
20049-200490390 = "В итоге день прошёл зря."
20049-200490400 = "..."
20049-200490410 = "Кроме разговора с тобой."