[translation]
20049-200490010 = "Areia"
20049-200490020 = "Água"
20049-200490030 = "Guarda-sol"
20049-200490040 = "Misaki?"
20049-200490050 = "Já faz um tempão que estou olhando pra isso, mas..."
20049-200490060 = "Que graça será que todo mundo vê nisso aqui?"
20049-200490070 = "Ou seja..."
20049-200490080 = "Quer dizer que você quer brincar junto comigo?"
20049-200490090 = "De onde você tirou essa conclusão?"
20049-200490100 = "Cansei"
20049-200490110 = "Não sabia que se mexer dentro d'água dava tanto trabalho assim"
20049-200490120 = "Você já está conseguindo nadar um pouquinho"
20049-200490130 = "Acha mesmo...? Só lembro de ter ficado me debatendo"
20049-200490140 = "Se tiver uma próxima vez... vou procurar outro jeito"
20049-200490150 = "Seria melhor ter usado uma boia mesmo?"
20049-200490160 = "..."
20049-200490170 = "Não é isso"
20049-200490180 = "Acabei ficando sozinha na praia de novo"
20049-200490190 = "Ah"
20049-200490200 = "Já vou avisando que não vou mais nadar"
20049-200490210 = "Existem outras formas de curtir a praia"
20049-200490220 = "Tipo brincar na areia"
20049-200490230 = "...Está me mandando 'brincar na areia'?"
20049-200490240 = "Não me trate como criança"
20049-200490250 = "Acho que se fizermos juntos vai ser bem divertido"
20049-200490260 = "O resto eu até consigo tolerar, mas"
20049-200490270 = "não consigo me acostumar com esse sol forte"
20049-200490280 = "Mas esse sol brilhando é justamente a melhor parte da praia no verão!"
20049-200490290 = "..."
20049-200490300 = "O que você pretende me fazer tentar desta vez?"
20049-200490310 = "Que tal tomarmos um banho de sol juntos?"
20049-200490320 = "Falou, bom trabalho hoje"
20049-200490330 = "Beleza! Tô indo pra aí agora!"
20049-200490340 = "Ei, você está lendo o que eu mandei?"
20049-200490350 = "No fim das contas, o tempo ficou nublado o dia inteiro"
20049-200490360 = "Será que dá pra chamar isso de banho de sol?"
20049-200490370 = "É, aquilo fugiu um pouco do planejado..."
20049-200490380 = "Eu já imaginava que ia dar nisso"
20049-200490390 = "No fim, foi um dia sem nenhum ganho"
20049-200490400 = "..."
20049-200490410 = "Tirando a parte de ter conversado com você, Sensei"
