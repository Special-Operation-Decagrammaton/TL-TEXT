[translation]
20049-200490010 = "Песок."
20049-200490020 = "Вода."
20049-200490030 = "Зонтик."
20049-200490040 = "Мисаки?"
20049-200490050 = "Я уже несколько часов смотрю в одну и ту же точку."
20049-200490060 = "Почему людям это нравится?"
20049-200490070 = "То есть, проще говоря..."
20049-200490080 = "тебе скучно?"
20049-200490090 = "Как ты пришёл к такому выводу?"
20049-200490100 = "Я устала."
20049-200490110 = "Двигаться под водой утомительно."
20049-200490120 = "Но зато не зря! Ты научилась плавать!"
20049-200490130 = "Если греблю руками можно назвать плаванием, то, наверное."
20049-200490140 = "Если мне снова придётся заходить в воду, найду другой способ."
20049-200490150 = "Тебе больше понравился круг?"
20049-200490160 = "..."
20049-200490170 = "Нет."
20049-200490180 = "Я снова одна на пляже."
20049-200490190 = "А."
20049-200490200 = "Плавать не хочу. Даже не предлагай."
20049-200490210 = "Ты вообще-то на ПЛЯЖЕ!"
20049-200490220 = "Можем строить замки из песка!"
20049-200490230 = "Ты предлагаешь мне... играть в песке?"
20049-200490240 = "Я похожа на ребёнка?"
20049-200490250 = "Просто попробуй!"
20049-200490260 = "Я могу терпеть что угодно,"
20049-200490270 = "но только не солнце."
20049-200490280 = "Но в этом же вся суть пляжа!"
20049-200490290 = "..."
20049-200490300 = "Что ты задумал на этот раз?"
20049-200490310 = "Давай вместе позагораем!"
20049-200490320 = "Нет."
20049-200490330 = "Ладно! Увидимся там!"
20049-200490340 = "...Ты вообще читаешь мои сообщения?"
20049-200490350 = "Похоже, у облаков сегодня были другие планы."
20049-200490360 = "Погода совсем не подходила для загара."
20049-200490370 = "Даже я не могла такого предсказать..."
20049-200490380 = "А я могла."
20049-200490390 = "Так что, по-моему, сегодня вообще ничего не произошло."
20049-200490400 = "..."
20049-200490410 = "Кроме разговора с тобой, Сенсей."
