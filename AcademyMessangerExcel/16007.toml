[translation]
16007-160070010 = "Здравствуйте, Сенсей."
16007-160070020 = "Если это не слишком обременительно, сможете уделить немного времени днём?"
16007-160070030 = "Конечно. Что случилось?"
16007-160070040 = "Мне нужно сходить в торговый район возле Шале и купить вещи для работы Администрации Красной Зимы, но..."
16007-160070050 = "Я давно не покидала район Красной Зимы и, признаться, плохо ориентируюсь на здешних дорогах."
16007-160070060 = "Если вы не против, я надеялась, что вы сопроводите меня."
16007-160070070 = "Конечно!"
16007-160070080 = "Спасибо, Сенсей."
16007-160070090 = "Тогда увидимся перед торговым районом днём."
16007-160070100 = "Сенсей, простите, что пишу так поздно."
16007-160070110 = "Просто отчёт Шале по списочному составу Академии Красная Зима задерживается."
16007-160070120 = "Сегодня крайний срок. Вы случайно не забыли?"
16007-160070130 = "Прости, совсем забыл!"
16007-160070140 = "Обязательно закончу к завтрашнему дню!"
16007-160070150 = "Хи-хи, не нужно так спешить."
16007-160070160 = "Если это связано с Академией Красная Зима, я как-нибудь смогу отсрочить."
16007-160070170 = "Так ещё страшнее!"
16007-160070180 = "В последнее время по всей Академии Красная Зима стало много пропаганды, очерняющей президента Черину."
16007-160070190 = "Думаю, пришло время очередного Периодического тура с речами."
16007-160070200 = "Периодический тур с речами?"
16007-160070210 = "Вас интересуют туры с речами нашей академии, Сенсей?"
16007-160070220 = "Тур с речами Академии Красная Зима — это мероприятие, на котором президент Черина ездит по разным районам и речами распространяет своё величие."
16007-160070230 = "Но поскольку район очень большой, объехать всю академию занимает немало времени."
16007-160070240 = "Не хотите присоединиться к нам в предстоящем туре с речами, Сенсей?"
16007-160070250 = "Я пас..."
16007-160070260 = "Нет, я настаиваю."
16007-160070270 = "У меня ещё много замечательных историй о президенте Черине, которыми я хочу с вами поделиться!"
16007-160070280 = "Меня опять заставляют участвовать?!"
16007-160070290 = "Сенсей, вы сейчас заняты?"
16007-160070300 = "Мне срочно нужна ваша помощь."
16007-160070310 = "Да, конечно."
16007-160070320 = "Что происходит?"
16007-160070330 = "Просто новое поручение президента Черины слишком сложное."
16007-160070340 = "...Меня могут подвергнуть чистке."
16007-160070350 = "...Можешь меня в это не втягивать?"
16007-160070360 = "Нет! Не могу поверить, что вы пытаетесь сбежать, услышав такое..."
16007-160070370 = "Если меня подвергнут чистке, я дам показания, что за мной стояли вы, Сенсей!"
16007-160070380 = "Как страшно!"
16007-160070390 = "Какие фильмы вам нравятся, Сенсей?"
16007-160070400 = "Мне нравятся спокойные независимые фильмы."
16007-160070410 = "Мне нравятся яркие блокбастеры."
16007-160070420 = "Ха-ха, понятно. Как я и ожидала от вас, Сенсей."
16007-160070430 = "А какой твой любимый фильм, Томоэ?"
16007-160070440 = "Мой любимый фильм?"
16007-160070450 = "Я..."
16007-160070460 = "Мой любимый фильм — «Достижения Великих Усов»."
16007-160070470 = "Впервые слышу."
16007-160070480 = "Ну, конечно."
16007-160070490 = "«Достижения Великих Усов» — документальный фильм о предпочтениях и повседневной жизни президента Черины..."
16007-160070500 = "Я как раз собираюсь начать его снимать!"
16007-160070510 = "Так что давайте, Сенсей. Присоединяйтесь ко мне и задокументируем достижения великой президента Черины!"
16007-160070520 = "Меня опять заставляют участвовать?!"
