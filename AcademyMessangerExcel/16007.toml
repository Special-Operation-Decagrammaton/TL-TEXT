[translation]
16007-160070010 = "Здравствуйте, Сенсей."
16007-160070020 = "Если вам не трудно, не могли бы вы уделить мне немного времени сегодня днём?"
16007-160070030 = "Да, конечно. Что-то случилось?"
16007-160070040 = "Я планирую сходить в торговый квартал рядом с Шале, чтобы пополнить запасы канцелярии..."
16007-160070050 = "Признаться, я давно не покидала академию, и особенно плохо знаю окрестности Шале..."
16007-160070060 = "Если у вас будет время, я хотела бы попросить вас составить мне компанию."
16007-160070070 = "Понял, положись на меня."
16007-160070080 = "Хе-хе, спасибо."
16007-160070090 = "Тогда я буду ждать вас перед торговым кварталом."
16007-160070100 = "Сенсей, простите за поздний час."
16007-160070110 = "Дело в том, что отчёт о дежурстве в Шале, касающийся нашей академии, ещё не поступил..."
16007-160070120 = "Сегодня был крайний срок, всё в порядке?"
16007-160070130 = "Извини, я совсем забыл...!"
16007-160070140 = "Я обязательно подготовлю его к завтрашнему дню!"
16007-160070150 = "Ах, нет-нет. Не нужно так спешить."
16007-160070160 = "Если это касается Редвинтера, я обычно могу «как-то» это уладить."
16007-160070170 = "Я благодарен, но это звучит как-то пугающе..."
16007-160070180 = "В последнее время по всей Красной Зиме стали появляться листовки, порочащие председателя Черино."
16007-160070190 = "Похоже, пришло время для агитационного турне."
16007-160070200 = "Агитационного турне...?"
16007-160070210 = "Если хотите, вы тоже можете послушать."
16007-160070220 = "Это мероприятие, в ходе которого мы объезжаем различные районы Редвинтера и вновь доносим до людей величие председателя Черино через речи."
16007-160070230 = "Как вы знаете, наша территория очень обширна, так что чтобы объехать всё, потребуется немало времени..."
16007-160070240 = "Как вам? Не желаете присоединиться?"
16007-160070250 = "Не знаю, стоит ли..."
16007-160070260 = "...Нет, я задам вопрос иначе. Пожалуйста, приходите."
16007-160070270 = "У меня ещё осталось множество историй о председателе, которыми я хочу поделиться!"
16007-160070280 = "Понятно, это принудительное участие!"
16007-160070290 = "Сенсей, вы сейчас заняты?"
16007-160070300 = "Извините, что прошу внезапно, но мне нужна ваша помощь..."
16007-160070310 = "Да, всё в порядке."
16007-160070320 = "Положись на меня, что случилось?"
16007-160070330 = "Я немного переживаю из-за председателя Черино..."
16007-160070340 = "Если так пойдёт, меня могут исключить..."
16007-160070350 = "Что-то нехорошее предчувствие..."
16007-160070360 = "Не вздумайте сбежать, раз уже зашли так далеко!"
16007-160070370 = "Если меня исключат, я обязательно заберу вас с собой!"
16007-160070380 = "Это слишком страшно!"
16007-160070390 = "Сенсей, какие фильмы вы любите?"
16007-160070400 = "Наверное, независимые."
16007-160070410 = "Блокбастеры!"
16007-160070420 = "Понятно. Сначала я удивилась, но, подумав, поняла, что это вполне в вашем вкусе."
16007-160070430 = "А ты, Томое? Какой твой любимый фильм?"
16007-160070440 = "Мой любимый фильм?"
16007-160070450 = "Я..."
16007-160070460 = "Наверное, «Будни великих усов»."
16007-160070470 = "Впервые слышу такое название."
16007-160070480 = "Да, наверное."
16007-160070490 = "«Будни великих усов» — это фильм, который описывает привычки и повседневную жизнь председателя Черино..."
16007-160070500 = "и который я планирую снять в ближайшее время!"
16007-160070510 = "Так что, Сенсей, давайте вместе запечатлим будни председателя!"
16007-160070520 = "А, на этот раз тоже обязательно!"