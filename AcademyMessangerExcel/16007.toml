[translation]
16007-160070010 = "Olá, Sensei"
16007-160070020 = "Se não for incômodo, você poderia me ceder um tempinho hoje à tarde?"
16007-160070030 = "Claro, sem problemas. Aconteceu alguma coisa?"
16007-160070040 = "Na verdade, estou planejando ir ao centro comercial perto da Schale para repor os suprimentos da Secretaria, mas......"
16007-160070050 = "Confesso que faz tempo que não saio da academia e não conheço muito bem os arredores da Schale......"
16007-160070060 = "Se a sua agenda permitir, gostaria muito de pedir a sua companhia"
16007-160070070 = "Entendi, pode deixar comigo"
16007-160070080 = "Hehe, muito obrigada"
16007-160070090 = "Estarei te esperando na entrada do centro comercial, então"
16007-160070100 = "Sensei, desculpe incomodar a esta hora"
16007-160070110 = "É que o relatório sobre o plantão da Schale referente à nossa academia ainda não chegou......"
16007-160070120 = "O prazo era hoje, está tudo bem por aí?"
16007-160070130 = "Desculpa, esqueci completamente......!"
16007-160070140 = "Prometo deixar pronto até amanhã sem falta!"
16007-160070150 = "Ah, imagina. Não precisa ter tanta pressa assim"
16007-160070160 = "Quando o assunto envolve a Red Winter, eu quase sempre consigo dar um \"jeitinho\" em tudo"
16007-160070170 = "Eu agradeço, mas isso soou meio assustador......"
16007-160070180 = "Ultimamente, têm aparecido panfletos difamando a Presidente Cherino por vários cantos da Red Winter"
16007-160070190 = "Pelo visto, chegou a hora de sair em turnê com os meus discursos regulares"
16007-160070200 = "Discursos regulares......?"
16007-160070210 = "Se quiser, gostaria de vir ouvir também, Sensei?"
16007-160070220 = "É um evento em que percorro os vários distritos autônomos da Academia Federal Red Winter fazendo discursos para relembrar a todos a grandiosidade da Presidente Cherino"
16007-160070230 = "Como você sabe, os distritos são bem extensos, então leva bastante tempo para passar por todos eles, mas......"
16007-160070240 = "O que me diz? Gostaria de participar?"
16007-160070250 = "Humm, não sei se é uma boa......"
16007-160070260 = "......Pensando bem, deixe-me reformular o convite. Venha comigo, por favor"
16007-160070270 = "Ainda tenho uma montanha de histórias incríveis sobre a Presidente que quero muito contar para você, Sensei!"
16007-160070280 = "Saquei, a participação é obrigatória!"
16007-160070290 = "Sensei, você está ocupado agora?"
16007-160070300 = "Desculpe o pedido repentino, mas tem uma coisa em que eu precisava da sua ajuda......"
16007-160070310 = "Sim, estou livre"
16007-160070320 = "Pode contar comigo, do que se trata?"
16007-160070330 = "Na verdade, estou com um pequeno dilema envolvendo a Presidente Cherino......"
16007-160070340 = "Se as coisas continuarem assim, corro até o risco de sofrer um expurgo......"
16007-160070350 = "Estou com um mau pressentimento sobre isso......"
16007-160070360 = "Depois de ouvir até aqui, não vale fugir, viu?!"
16007-160070370 = "Se eu acabar sendo expurgada, faço questão de levar você junto comigo, Sensei!"
16007-160070380 = "Essa sua determinação dá medo!"
16007-160070390 = "Mudando de assunto de repente, que tipo de filme você gosta, Sensei?"
16007-160070400 = "Acho que filmes indie"
16007-160070410 = "Blockbusters!"
16007-160070420 = "Entendo. De início achei surpreendente, mas parando para pensar, combina bem com o seu gosto, Sensei"
16007-160070430 = "E você, Tomoe? Qual é o seu filme favorito?"
16007-160070440 = "O meu filme favorito?"
16007-160070450 = "Eu diria que é......"
16007-160070460 = "\"O Cotidiano do Grande Bigode\", provavelmente"
16007-160070470 = "Acho que nunca ouvi falar desse título"
16007-160070480 = "Sim, imagino que não"
16007-160070490 = "Afinal, \"O Cotidiano do Grande Bigode\" retrata os gostos e hábitos diários da Presidente Cherino......"
16007-160070500 = "E é o documentário que eu vou começar a filmar agora mesmo!"
16007-160070510 = "Portanto, Sensei, vamos juntos registrar o dia a dia da Presidente!"
16007-160070520 = "Ah, dessa vez a participação também é obrigatória?!"
