[translation]
10029-100290010 = "Ir aonde quiser ir, dormir quando quiser dormir,"
10029-100290020 = "e comer o que quiser comer, onde der vontade."
10029-100290030 = "Sem se prender a nada, ignorando qualquer restrição e vivendo exatamente como bem entender!"
10029-100290040 = "Exatamente como um biscoito caseiro!"
10029-100290050 = "...Hum, do que você está falando?"
10029-100290060 = "É alguma citação famosa?"
10029-100290070 = "Huum..."
10029-100290080 = "Você ainda tem muito o que aprender."
10029-100290090 = "Essa reação deixou a desejar~"
10029-100290100 = "Falta romance em você, Sensei."
10029-100290110 = "Sendo assim, acho que vou te ensinar o que é romance, Sensei."
10029-100290120 = "Hehe, não precisa se preocupar~"
10029-100290130 = "Garanto que você não vai ficar entediado."
10029-100290140 = "O mundo é um lugar duro."
10029-100290150 = "É difícil aceitar ideais diferentes dos nossos, e as pessoas raramente conseguem aceitar umas às outras..."
10029-100290160 = "Mesmo sabendo que, se superarmos isso, poderemos alcançar novos horizontes."
10029-100290170 = "Lamentável, deveras lamentável... Você não acha, Sensei?"
10029-100290180 = "Que papo pesado... O que houve?"
10029-100290190 = "Aconteceu alguma coisa difícil...?"
10029-100290200 = "Não, nada demais~"
10029-100290210 = "Só me veio esse pensamento do nada."
10029-100290220 = "Mas..."
10029-100290230 = "É, acho que com você tudo bem, Sensei."
10029-100290240 = "Me espera aí, Sensei."
10029-100290250 = "Já tô indo."
10029-100290260 = "Valeu por hoje, viu, Sensei~"
10029-100290270 = "Da outra vez também foi assim, conversar com você me deixa com a alma leve."
10029-100290280 = "Se você não se importar,"
10029-100290290 = "espero poder contar com você assim mais vezes."
10029-100290300 = "Sensei"
10029-100290310 = "Hoje tem um grande evento, um evento importante que eu não consigo realizar sozinha."
10029-100290320 = "É a minha deixa para entrar em cena?"
10029-100290330 = "E o que vai ser dessa vez?"
10029-100290340 = "Hehe, dessa vez é \"algo romântico\"."
10029-100290350 = "Entra fácil na categoria das coisas bem românticas deste mundo, sem dúvida."
10029-100290360 = "Portanto,"
10029-100290370 = "recomendo fortemente que você venha."
10029-100290380 = "Bom, tô te esperando."
10029-100290390 = "Sensei, só pra garantir..."
10029-100290400 = "...O que rolou hoje é segredo nosso, viu?"
10029-100290410 = "Um sol quentinho, uma brisa suave."
10029-100290420 = "O céu está alto e o mundo brilha em azul."
10029-100290430 = "Seria um desperdício enorme deixar um dia desses simplesmente passar..."
10029-100290440 = "Para onde você saiu hoje?"
10029-100290450 = "Está no meio de um piquenique, por acaso?"
10029-100290460 = "Hehe~"
10029-100290470 = "Boa, muito boa. Você já está pegando o jeito, Sensei."
10029-100290480 = "Sendo assim, vou pular o resto das explicações."
10029-100290490 = "Tô te esperando!"
10029-100290500 = "Hoje foi muito divertido mesmo, Sensei."
10029-100290510 = "Se rolar alguma coisa, conto com você de novo~"
10029-100290520 = "...E mesmo se não rolar nada, também."
