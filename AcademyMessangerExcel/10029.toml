[translation]
10029-100290010 = "Идти туда, куда хочется, спать, когда хочется,"
10029-100290020 = "и есть то, что хочется, там, где хочется."
10029-100290030 = "Не быть ничем связанным, не знать ограничений, жить по своей воле!"
10029-100290040 = "Это как домашнее печенье!"
10029-100290050 = "...Эм, о чём это вы?"
10029-100290060 = "Какая-то цитата?"
10029-100290070 = "Хм-м..."
10029-100290080 = "Ещё не то."
10029-100290090 = "Такой реакции недостаточно."
10029-100290100 = "Не хватает романтики, Сенсей."
10029-100290110 = "Тогда я научу вас романтике."
10029-100290120 = "Хе-хе, не волнуйтесь."
10029-100290130 = "Я не дам вам заскучать."
10029-100290140 = "Мир суров."
10029-100290150 = "Трудно принимать чужие идеи, и принимать друг друга не получается..."
10029-100290160 = "Но если преодолеть это, можно прийти к чему-то новому."
10029-100290170 = "Как печально, правда печально... Вы не согласны, Сенсей?"
10029-100290180 = "Серьёзный разговор... Что случилось?"
10029-100290190 = "Что-то случилось тяжёлое...?"
10029-100290200 = "Нет, ничего."
10029-100290210 = "Просто подумалось."
10029-100290220 = "Но"
10029-100290230 = "да, с вами, наверное, всё будет в порядке."
10029-100290240 = "Ждите, Сенсей."
10029-100290250 = "Я скоро приду."
10029-100290260 = "Спасибо за сегодня, Сенсей."
10029-100290270 = "Как и в прошлый раз, после разговора с вами становится легче."
10029-100290280 = "Если вы не против,"
10029-100290290 = "я бы хотела и дальше так общаться."
10029-100290300 = "Сенсей."
10029-100290310 = "Сегодня большое событие, такое, что одной мне не справиться."
10029-100290320 = "Мой выход?"
10029-100290330 = "На этот раз что за событие?"
10029-100290340 = "Хе-хе, на этот раз «нечто романтичное»."
10029-100290350 = "Это, пожалуй, одно из самых романтичных событий в мире, точно."
10029-100290360 = "Поэтому"
10029-100290370 = "я очень рекомендую вам прийти."
10029-100290380 = "Тогда жду."
10029-100290390 = "Сенсей, на всякий случай."
10029-100290400 = "...Сегодняшнее пусть останется между нами, ладно?"
10029-100290410 = "Тёплое солнце, нежный ветер."
10029-100290420 = "Небо высокое, мир сияет голубизной."
10029-100290430 = "Такой день жалко просто пропустить..."
10029-100290440 = "Вы сейчас где-то гуляете?"
10029-100290450 = "Может, на пикнике?"
10029-100290460 = "Хи-хи."
10029-100290470 = "Хорошо, очень хорошо. Сенсей, вы уже привыкли."
10029-100290480 = "Так что дальше опускаю."
10029-100290490 = "Жду!"
10029-100290500 = "Сегодня было правда весело, Сенсей."
10029-100290510 = "Если что, всегда обращайтесь."
10029-100290520 = "...Даже если ничего."
