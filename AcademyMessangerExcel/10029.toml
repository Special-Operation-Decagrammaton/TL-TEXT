[translation]
10029-100290010 = "Иди куда хочешь. Спи где хочешь."
10029-100290020 = "И ешь там, где хочешь."
10029-100290030 = "Не сдерживай себя, забудь об ограничениях и живи так, как тебе хочется!"
10029-100290040 = "Прямо как печенье, которое создаётся кончиками твоих пальцев!"
10029-100290050 = "О чём ты?"
10029-100290060 = "Это какая-то знаменитая поговорка или цитата?"
10029-100290070 = "Хм."
10029-100290080 = "Немного неожиданно."
10029-100290090 = "Какая жалость. Правда. Я не ожидала такой реакции."
10029-100290100 = "Вам не хватает романтики, Сенсей."
10029-100290110 = "Так не пойдёт. Придётся научить вас, что такое настоящая романтика."
10029-100290120 = "Хи-хи."
10029-100290130 = "Не волнуйтесь. Скучно не будет."
10029-100290140 = "Мир так суров."
10029-100290150 = "Люди не понимают друг друга и не принимают чужие идеи."
10029-100290160 = "Если люди смогут выйти за эти рамки, они наверняка откроют новые горизонты."
10029-100290170 = "Это по-настоящему трагично. Что вы думаете об этой печальной реальности, Сенсей?"
10029-100290180 = "Довольно тяжёлая тема."
10029-100290190 = "А? Что-то не так?"
10029-100290200 = "Нет, совсем нет."
10029-100290210 = "Просто мысль внезапно пришла в голову."
10029-100290220 = "Но..."
10029-100290230 = "Да, верно. Если это Сенсей, наверное, всё будет хорошо."
10029-100290240 = "Сенсей."
10029-100290250 = "Я прямо сейчас иду к вам."
10029-100290260 = "Спасибо за сегодня, Сенсей."
10029-100290270 = "Как и в прошлый раз, после разговора с вами мне стало легче, Сенсей."
10029-100290280 = "Когда-нибудь, если вы не против, Сенсей..."
10029-100290290 = "я хотела бы снова попросить вас о такой услуге. Спасибо, Сенсей."
10029-100290300 = "Сенсей."
10029-100290310 = "Сегодня очень важное событие. Настолько важное, что я не справлюсь одна."
10029-100290320 = "Наверняка тебе нужна моя помощь!"
10029-100290330 = "Что на этот раз?"
10029-100290340 = "Хи-хи. Нечто романтичное."
10029-100290350 = "Осмелюсь сказать, одно из самых романтичных вещей в мире."
10029-100290360 = "Не лучше ли прийти и услышать об этом лично?"
10029-100290370 = "Буду ждать."
10029-100290380 = "С тоской и предвкушением, Ютори Нацу."
10029-100290390 = "Сенсей, вы ведь уже знаете, да?"
10029-100290400 = "То, что сегодня произошло, — секрет."
10029-100290410 = "Тёплое солнце. Мягкий ветер."
10029-100290420 = "Высокое небо, и весь мир сияет голубым."
10029-100290430 = "Сцена, которую было бы жаль упустить."
10029-100290440 = "Ты сейчас на улице?"
10029-100290450 = "У тебя пикник?"
10029-100290460 = "Хи-хи."
10029-100290470 = "Да, очень хорошо. Вы уже привыкли, Сенсей!"
10029-100290480 = "Поэтому больше ничего говорить не буду."
10029-100290490 = "Буду ждать!"
10029-100290500 = "Сегодня было так весело, Сенсей."
10029-100290510 = "Я буду ждать ещё таких моментов. Когда что-то происходит..."
10029-100290520 = "И даже когда ничего не происходит."
