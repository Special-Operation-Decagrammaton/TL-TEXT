[translation]
10098-100980010 = "Sensei"
10098-100980020 = "Tá ocupado agora?"
10098-100980030 = "Não muito."
10098-100980040 = "Que bom."
10098-100980050 = "Na verdade, tô com um probleminha aqui,"
10098-100980060 = "e queria pedir uma mãozinha sua."
10098-100980070 = "Claro, pode falar."
10098-100980080 = "Tem certeza?"
10098-100980090 = "Eu nem falei o que é ainda..."
10098-100980100 = "Eu vou fazer uma patrulha pelo distrito autônomo agora."
10098-100980110 = "Se quiser, que tal vir comigo, Sensei?"
10098-100980120 = "Com certeza vou te acompanhar!"
10098-100980130 = "Se é um pedido de uma heroína, não posso recusar!"
10098-100980140 = "Uugh..."
10098-100980150 = "Esse negócio de heroína..."
10098-100980160 = "Ainda me dá mó vergonha~"
10098-100980170 = "Bom, de qualquer forma, tô te esperando~"
10098-100980180 = "Sensei"
10098-100980190 = "Como tá se sentindo?"
10098-100980200 = "Não pegou resfriado nem nada?"
10098-100980210 = "Eu tô bem, e você, Hoshino?"
10098-100980220 = "Esta tiozona aqui tá ótima também~"
10098-100980230 = "Deve ser porque a gente ficou grudado a noite inteira, né?"
10098-100980240 = "Opa!"
10098-100980250 = "Quer dizer,"
10098-100980260 = "a gente só se enrolou no mesmo cobertor!"
10098-100980270 = "Falando desse jeito vão entender tudo errado!"
10098-100980280 = "...Ah, e outra coisa."
10098-100980290 = "Sabe ontem, quando a gente ajudou as pessoas juntos lá no distrito?"
10098-100980300 = "Eu já fiz algo bem parecido com aquilo antigamente."
10098-100980310 = "Acabei sentindo uma pontinha de nostalgia."
10098-100980320 = "Então, sabe..."
10098-100980330 = "É, enfim, obrigada mesmo."
10098-100980340 = "Sensei"
10098-100980350 = "Sensei, lembra da patrulha do outro dia?"
10098-100980360 = "Claro."
10098-100980370 = "A gente deu uma olhada em vários lugares, né?"
10098-100980380 = "Mas não achamos nenhum rastro da Gangue do Capacete."
10098-100980390 = "Verdade..."
10098-100980400 = "Eu dei uma investigada depois daquilo,"
10098-100980410 = "e consegui a informação de que elas têm sido vistas direto perto do distrito comercial."
10098-100980420 = "Provavelmente o esconderijo delas fica por ali."
10098-100980430 = "A heroína já está pronta para a ação?"
10098-100980440 = "Uhehe. Pode apostar que sim, parceiro."
