[translation]
13003-938 = "Сенсей."
13003-939 = "Я хотела бы лично кое о чём вас спросить."
13003-940 = "Можно посоветоваться с вами?"
13003-941 = "Конечно. О чём угодно, Хасуми."
13003-942 = "Можешь звонить мне в любое время."
13003-943 = "А."
13003-944 = "Отлично!"
13003-945 = "Спасибо. Я боялась, что вы откажете..."
13003-946 = "Я даже немного впечатлён."
13003-947 = "Эм... Я сама не знаю, что говорю."
13003-948 = "Хорошо, скоро увидимся."
13003-949 = "Сенсей..."
13003-950 = "В-Вообще-то, забудьте."
13003-951 = "Пожалуйста, забудьте о сегодняшнем..."
13003-952 = "Сенсей, я понимаю, что просьба эгоистичная..."
13003-953 = "Но можем продолжить нашу консультацию, раз в прошлый раз не закончили?"
13003-954 = "Да, конечно. На этот раз обсудим всё до конца."
13003-955 = "О..."
13003-956 = "Хорошо. Спасибо."
13003-957 = "Буду ждать вас."
13003-958 = "Сенсей..."
13003-959 = "И снова, пожалуйста, забудьте... о сегодняшнем..."
13003-960 = "Надеюсь, вы понимаете..."
13003-961 = "Иногда приятно побыть одной."
13003-962 = "Не то чтобы мне одиночество нравилось больше, чем другим."
13003-963 = "Ты, кажется, довольно чувствительная по натуре."
13003-964 = "Ты ведь довольно чувствительная, Хасуми?"
13003-965 = "А-А?!"
13003-966 = "В-Вы так думаете?"
13003-967 = "Мне как-то неловко... Простите."
13003-968 = "Сегодня вы столько для меня сделали."
13003-969 = "Хотя, наверное, мы почти ничего не делали, кроме разговора..."
13003-970 = "Этого было более чем достаточно. Спасибо."
13003-971 = "Хм... В последнее время я плохо сплю."
13003-972 = "И голова болит... Интересно почему."
13003-973 = "Хм... Не знаю. Может, стоит сходить к врачу?"
13003-974 = "Да... Это было бы правильно, но..."
13003-975 = "Я не могу отсутствовать из-за такой мелочи..."
13003-976 = "Пожалуйста, не волнуйтесь, Сенсей."
13003-977 = "Вряд ли это что-то серьёзное."
13003-978 = "Но диету я прекращать не стану."
13003-979 = "Мне сложно объяснить, но..."
13003-980 = "если прекращу, будет ощущение, будто я проиграла самой себе."
13003-981 = "...Я доверяю твоему решению, Хасуми."
13003-982 = "Разбираться в собственных мыслях бывает сложно..."
13003-983 = "В последнее время я допоздна занята клубной работой..."
13003-984 = "Вы тоже работаете допоздна, верно?"
13003-985 = "Я тоже постараюсь."
13003-986 = "Да. Вперёд, Хасуми!"
13003-987 = "Мы справимся!"
13003-988 = "Сенсей."
13003-989 = "Примите горячую ванну и хорошо отдохните,"
13003-990 = "чтобы не простудиться."
13003-991 = "До встречи."
13003-130030010 = "Сенсей."
13003-130030020 = "Прошу прощения, что обращаюсь так внезапно."
13003-130030030 = "Всё в порядке?"
13003-130030040 = "Я ищу потерянную вещь."
13003-130030050 = "Вы нигде не видели блокнот?"
13003-130030060 = "На обложке должен быть большой логотип Комитета справедливости."
13003-130030070 = "Да, он у меня!"
13003-130030080 = "О! Я нашёл один в переговорной."
13003-130030090 = "Ах, значит, я и правда оставила его там."
13003-130030100 = "Скоро зайду и заберу. Надеюсь, это не слишком вас затруднит."
13003-130030110 = "Сенсей."
13003-130030120 = "Ещё раз прошу прощения за беспокойство."
13003-130030130 = "С твоей чрезвычайной ситуацией всё в порядке?"
13003-130030140 = "Что? Чрезвычайной ситуацией?"
13003-130030150 = "А."
13003-130030160 = "Ничего."
13003-130030170 = "Да... Благодаря вам всё разрешилось."
