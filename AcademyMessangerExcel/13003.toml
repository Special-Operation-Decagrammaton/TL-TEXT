[translation]
13003-938 = "Здравствуйте, Сенсей."
13003-939 = "Есть кое-что, что я хотела бы обсудить..."
13003-940 = "Если вы не против, не могли бы вы выслушать меня?"
13003-941 = "Конечно."
13003-942 = "Звони в любое время."
13003-943 = "А, спасибо большое!"
13003-944 = "П-простите, я невольно..."
13003-945 = "Я всё думала, что будет, если вы откажете..."
13003-946 = "Я очень облегчённо вздохнула."
13003-947 = "Простите, кажется, я говорю что-то странное..."
13003-948 = "Я свяжусь с вами позже, спасибо."
13003-949 = "Сенсей, эм..."
13003-950 = "Нет, н-ничего."
13003-951 = "Забудьте о том, что я сказала сегодня..."
13003-952 = "Сенсей, простите, что я капризничаю, но..."
13003-953 = "Можно я снова попрошу вас о том разговоре, который не состоялся на днях...?"
13003-954 = "Да. Конечно."
13003-955 = "Спасибо!"
13003-956 = "Извините за беспокойство, спасибо."
13003-957 = "Эм, тогда место..."
13003-958 = "Сенсей..."
13003-959 = "Забудьте и о сегодняшнем дне..."
13003-960 = "Пожалуйста..."
13003-961 = "У вас бывает такое, что иногда хочется побыть одному?"
13003-962 = "Я не то чтобы особо люблю одиночество, но иногда такие чувства возникают."
13003-963 = "Такое бывает, особенно в школьные годы."
13003-964 = "Это по-девичьи, ничего плохого в этом нет!"
13003-965 = "А, эм..."
13003-966 = "Простите, мне стало как-то неловко..."
13003-967 = "Извините, что сама завела этот разговор..."
13003-968 = "Спасибо за сегодня."
13003-969 = "Хотя сегодня, кажется, я ничего особенного и не делала."
13003-970 = "Но я хорошо провела время, спасибо."
13003-971 = "В последнее время я плохо сплю..."
13003-972 = "Голова болит, и я не знаю причины..."
13003-973 = "Может, стоит сходить к врачу...?"
13003-974 = "Да, наверное, вы правы..."
13003-975 = "Но сейчас у меня много дел в комитете, я не могу отлучиться..."
13003-976 = "Простите, что заставила вас волноваться."
13003-977 = "Спасибо, Сенсей."
13003-978 = "Спасибо за сегодня, Сенсей."
13003-979 = "Но я не сдамся в диете."
13003-980 = "Как бы сказать, если я сейчас сдамся, это будет как поражение самой себе."
13003-981 = "Только не загоняй себя слишком сильно..."
13003-982 = "Девичье сердце сложное... пожалуйста, не переусердствуйте."
13003-983 = "В последнее время каждый день работа в комитете затягивается допоздна..."
13003-984 = "Но я знаю, что вы тоже много работаете, Сенсей."
13003-985 = "Я тоже постараюсь."
13003-986 = "Да, я поддерживаю тебя."
13003-987 = "Будем стараться вместе!"
13003-988 = "Сенсей."
13003-989 = "Чтобы не простудиться, примите горячую ванну"
13003-990 = "и хорошенько отдохните."
13003-991 = "Тогда до встречи."
13003-130030010 = "Сенсей, спасибо за работу."
13003-130030020 = "Я хочу кое-что спросить..."
13003-130030030 = "Что-то случилось?"
13003-130030040 = "Вы не видели мой ежедневник?"
13003-130030050 = "На обложке большая эмблема Комитета по достижению справедливости."
13003-130030060 = "Мне неловко признаваться, но, кажется, я где-то его оставила."
13003-130030070 = "Тогда он у меня."
13003-130030080 = "Тот, что лежал в переговорной, да?"
13003-130030090 = "Ах, как хорошо..."
13003-130030100 = "Если у вас есть время, я могу зайти за ним прямо сейчас?"
13003-130030110 = "Спасибо, что подобрали мой ежедневник."
13003-130030120 = "Вы очень помогли."
13003-130030130 = "Всё в порядке? Срочное дело решено?"
13003-130030140 = "Срочное дело?"
13003-130030150 = "А."
13003-130030160 = "Ничего."
13003-130030170 = "Да, благодаря вам."