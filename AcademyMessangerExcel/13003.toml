[translation]
13003-938 = "Olá, Sensei"
13003-939 = "Há algo sobre o qual eu gostaria que você me ouvisse..."
13003-940 = "Se não for incomodar, eu poderia pedir um conselho seu?"
13003-941 = "Claro"
13003-942 = "Pode me chamar a qualquer hora"
13003-943 = "M-Muito obrigada!"
13003-944 = "D-Desculpe, acabei me empolgando..."
13003-945 = "É que eu não parava de pensar no que faria se você recusasse..."
13003-946 = "Fiquei tão aliviada"
13003-947 = "Perdão, acho que estou falando coisas meio sem sentido..."
13003-948 = "Entrarei em contato novamente mais tarde. Muito obrigada desde já"
13003-949 = "Sensei, hum..."
13003-950 = "Não, n-não é nada"
13003-951 = "Por favor, esqueça o que aconteceu hoje..."
13003-952 = "Sensei, peço desculpas por estar sendo tão egoísta, mas..."
13003-953 = "Sobre aquela conversa que não conseguimos ter outro dia, será que eu poderia pedir mais uma chance...?"
13003-954 = "Sim, claro"
13003-955 = "Muito obrigada!"
13003-956 = "Desculpe tomar o seu tempo quando está tão ocupado, conto com você"
13003-957 = "Hum, então sobre o lugar..."
13003-958 = "Sensei..."
13003-959 = "O que aconteceu hoje também... por favor, esqueça..."
13003-960 = "Eu imploro..."
13003-961 = "Você não sente falta de ter um tempinho só para si de vez em quando?"
13003-962 = "Não é que eu goste particularmente da solidão, mas às vezes me bate esse sentimento"
13003-963 = "Tem momentos assim mesmo, principalmente na época de estudante"
13003-964 = "Coisas de uma jovem na flor da idade! Acho super normal!"
13003-965 = "Hã? A-Ah, bem..."
13003-966 = "Me desculpe, acabei ficando com vergonha de repente..."
13003-967 = "Perdão por dizer isso sendo que fui eu quem puxou o assunto..."
13003-968 = "Obrigada pelo seu trabalho hoje também"
13003-969 = "Sinto como se não tivéssemos feito nada demais hoje, mas"
13003-970 = "foi um momento maravilhoso. Muito obrigada"
13003-971 = "Ultimamente não tenho conseguido dormir direito..."
13003-972 = "Também estou com uma dor de cabeça forte e nem sei qual é a causa..."
13003-973 = "Não seria melhor ir ao hospital dar uma olhada...?"
13003-974 = "Você tem razão..."
13003-975 = "Mas no momento o trabalho do Comitê está tão acumulado que mal consigo sair da minha mesa..."
13003-976 = "Me desculpe por acabar deixando você preocupado"
13003-977 = "Muito obrigada, Sensei"
13003-978 = "Muito obrigada pelo dia de hoje, Sensei"
13003-979 = "Mas eu ainda não vou desistir da dieta"
13003-980 = "Como posso dizer... sinto que se eu parar agora, estarei perdendo para mim mesma"
13003-981 = "Só não se cobre demais, viu...?"
13003-982 = "O coração de uma garota é mesmo complexo... Só espero que você não passe dos limites"
13003-983 = "Ultimamente o trabalho do Comitê tem se estendido até tarde quase todos os dias..."
13003-984 = "Mas você também passa por momentos difíceis fazendo hora extra, não é, Sensei?"
13003-985 = "Eu também vou dar o meu melhor"
13003-986 = "Sim, estou torcendo por você"
13003-987 = "Vamos dar o nosso melhor juntos!"
13003-988 = "Sensei"
13003-989 = "Tome um banho bem quentinho para não pegar um resfriado"
13003-990 = "e descanse bastante, está bem?"
13003-991 = "Até a próxima"
13003-130030010 = "Sensei, bom trabalho hoje"
13003-130030020 = "Gostaria de lhe fazer uma pergunta..."
13003-130030030 = "Aconteceu alguma coisa?"
13003-130030040 = "Por acaso você não viu a minha agenda por aí?"
13003-130030050 = "É uma que tem o brasão do Comitê de Realização da Justiça bem grande na capa"
13003-130030060 = "Morro de vergonha em admitir, mas parece que acabei esquecendo em algum lugar"
13003-130030070 = "Se for essa, está guardada comigo"
13003-130030080 = "É aquela que estava na sala de reuniões, né?"
13003-130030090 = "Aah, que alívio..."
13003-130030100 = "Se você estiver livre agora, tudo bem se eu for aí buscá-la?"
13003-130030110 = "Muito obrigada por ter guardado a minha agenda"
13003-130030120 = "Você me salvou"
13003-130030130 = "Está tudo certo agora? Conseguiu resolver aquele compromisso urgente?"
13003-130030140 = "Compromisso urgente?"
13003-130030150 = "Ah"
13003-130030160 = "Não era nada demais"
13003-130030170 = "Sim, graças a você deu tudo certo"
