[translation]
20020-200200010 = "Хе-хе. Здравствуйте, Сенсей."
20020-200200020 = "Хм?"
20020-200200030 = "Ах. Вы так рады, что я написала, что слов не находите."
20020-200200040 = "Да, это естественно."
20020-200200050 = "Ведь я, гениальная красавица, вдруг прислала вам сообщение."
20020-200200060 = "Простите, а вы кто?"
20020-200200070 = "Что, не может быть, чтобы вы не записали мой контакт...?"
20020-200200080 = "Извини, я пошутил, Химари."
20020-200200090 = "«Пьен»... Сенсей, вы так жестоко шутите."
20020-200200100 = "Даже гениальная красавица удивилась."
20020-200200110 = "Что Химари использует такие модные словечки, как «пьен»..."
20020-200200120 = "Я же одновременно являюсь и главой Веритас, так что я немного разбираюсь в интернет-культуре."
20020-200200130 = "В таких случаях, наверное, стоило бы сказать это с гордым видом."
20020-200200140 = "Н-наверное..."
20020-200200150 = "Но у меня есть к вам разговор."
20020-200200160 = "Я только что взломала... то есть проверила Шале,"
20020-200200170 = "и, судя по всему, у вас сегодня выходной, верно?"
20020-200200180 = "Так и сказала «взломала»..."
20020-200200190 = "Да, выходной, но..."
20020-200200200 = "Хе-хе, как раз кстати."
20020-200200210 = "Я пришлю вам координаты позже,"
20020-200200220 = "буду ждать вас в Миллениуме, Сенсей."
20020-200200230 = "То есть я уже должен прийти? Сейчас буду."
20020-200200240 = "Сенсей, сегодня вы приедете в Миллениум по делам Шале."
20020-200200250 = "Да, верно."
20020-200200260 = "Тогда после того, как закончите дела... скажем, в 15:00?"
20020-200200270 = "...У меня к вам будет просьба."
20020-200200280 = "Хорошо, как только закончу, сразу приду."
20020-200200290 = "Хе-хе-хе, тогда до встречи."
20020-200200300 = "Сенсей, случилась небольшая неприятность."
20020-200200310 = "Что? Всё в порядке?"
20020-200200320 = "Я бы сказала, что одна я с этим не справлюсь..."
20020-200200330 = "Не могли бы вы срочно прийти в укрытие? Буду ждать."
20020-200200340 = "Сенсей. Я раздобыла невероятное сокровище."
20020-200200350 = "Если Химари говорит о сокровище..."
20020-200200360 = "то это и интересно, и тревожно..."
20020-200200370 = "Какое грустное замечание."
20020-200200380 = "Некогда стоять на месте, я хочу показать вам это прямо сейчас."
20020-200200390 = "Хорошо, я сейчас приду."
20020-200200400 = "Хе-хе, тогда до встречи."