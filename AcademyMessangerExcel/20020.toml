[translation]
20020-200200010 = "Hehe. Olá, Sensei."
20020-200200020 = "Hm?"
20020-200200030 = "Ora, ora. Pelo visto você ficou tão emocionado por receber uma mensagem minha que até perdeu as palavras."
20020-200200040 = "Sim, é perfeitamente compreensível."
20020-200200050 = "Afinal, não é todo dia que se recebe uma mensagem repentina de uma bela garota prodígio como eu."
20020-200200060 = "Desculpe, quem fala?"
20020-200200070 = "O-O quê?! Não me diga que você ainda não salvou o meu contato...?!"
20020-200200080 = "Desculpa, foi só brincadeira, Himari."
20020-200200090 = "\"Snif, snif\"... Que brincadeira mais maldosa a sua, Sensei."
20020-200200100 = "Até mesmo esta bela garota prodígio ficou surpresa agora."
20020-200200110 = "Jamais imaginaria ver você usando gírias da internet assim, Himari..."
20020-200200120 = "Como alguém que também já ocupou o cargo de presidente da Veritas, tenho lá o meu conhecimento sobre a cultura da internet."
20020-200200130 = "Em um momento como este... eu deveria dizer isso fazendo uma \"cara de convencida\", não é?"
20020-200200140 = "É-É verdade..."
20020-200200150 = "Deixando isso de lado, tenho um assunto para tratar com você."
20020-200200160 = "Há pouco, quando hackeei... digo, investiguei a Schale..."
20020-200200170 = "Vi que você está de folga hoje. Confere?"
20020-200200180 = "Você acabou de falar \"hackeei\" na cara dura..."
20020-200200190 = "Realmente estou de folga hoje, mas..."
20020-200200200 = "Hehe, que ótimo timing."
20020-200200210 = "Vou te enviar as coordenadas daqui a pouco."
20020-200200220 = "Estarei esperando por você em Millennium, Sensei."
20020-200200230 = "Então já está decidido que eu vou... Tudo bem, já estou indo."
20020-200200240 = "Sensei, soube que hoje você virá a Millennium a trabalho pela Schale."
20020-200200250 = "Sim, isso mesmo."
20020-200200260 = "Então, assim que terminar os seus compromissos... vejamos, que tal por volta das 15h?"
20020-200200270 = "...Tenho um favor para te pedir."
20020-200200280 = "Combinado. Assim que terminar o trabalho aqui, vou direto praí."
20020-200200290 = "Hehehe, então nos vemos mais tarde."
20020-200200300 = "Sensei, temos um pequeno grande problema por aqui."
20020-200200310 = "O que houve? Você está bem?!"
20020-200200320 = "Digamos que é uma situação que foge completamente do que consigo resolver sozinha..."
20020-200200330 = "Você poderia vir imediatamente para o meu esconderijo? Estarei esperando."
20020-200200340 = "Sensei. Eu coloquei as mãos em um tesouro simplesmente extraordinário."
20020-200200350 = "Quando você chama alguma coisa de tesouro, Himari..."
20020-200200360 = "Não sei se fico curioso ou preocupado..."
20020-200200370 = "Ora, que comentário mais frio."
20020-200200380 = "Não temos tempo a perder. Quero mostrar isso a você o quanto antes."
20020-200200390 = "Entendi. Já estou indo praí."
20020-200200400 = "Hehe, até daqui a pouco, então."
