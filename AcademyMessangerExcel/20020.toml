[translation]
20020-200200010 = "Хи-хи. Здравствуй, Сенсей!"
20020-200200020 = "Что?"
20020-200200030 = "Ох, ты потерял дар речи от моих трогательных усилий связаться с тобой!"
20020-200200040 = "Как всегда, я всё прекрасно понимаю."
20020-200200050 = "Любой бы так отреагировал, получив сообщение от такой прекрасной сверхгениальной девушки, как я..."
20020-200200060 = "Конечно. Кстати, мы знакомы?"
20020-200200070 = "...Серьёзно? Сенсей, ты правда даже не сохранил мой контакт...?"
20020-200200080 = "Ха-ха, шучу. Прости, Химари."
20020-200200090 = "Хе-хе, ха-ха... Сенсей, тебе стоило бы знать. Есть вещи, над которыми просто нельзя шутить."
20020-200200100 = "То есть я, конечно, прекрасный сверхгений, но даже я была в шоке!"
20020-200200110 = "Не знал, что ты используешь такие слова, Химари..."
20020-200200120 = "Как президент Веритас, я отлично разбираюсь во всех аспектах интернет-культуры."
20020-200200130 = "Я просто невероятно хороша в знании всякого."
20020-200200140 = "Да-да..."
20020-200200150 = "В любом случае, к делу..."
20020-200200160 = "После взлома... то есть после расспросов..."
20020-200200170 = "мне стало известно, что сегодня у тебя выходной, Сенсей, верно?"
20020-200200180 = "Погоди, что именно ты взломала?"
20020-200200190 = "Да, но насчёт того, откуда ты узнала..."
20020-200200200 = "Хи-хи. Не переживай, всё обошлось."
20020-200200210 = "Сейчас отправлю тебе своё местоположение."
20020-200200220 = "Я буду ждать вас, Сенсей."
20020-200200230 = "Похоже, ты уже всё решила за меня... Ну ладно."
20020-200200240 = "Сенсей, я слышала, сегодня ты приезжаешь в Миллениум по делам Шале. Это правда?"
20020-200200250 = "Похоже на то."
20020-200200260 = "Тогда сможешь зайти ко мне в три часа дня, когда закончишь?"
20020-200200270 = "Есть кое-что, о чём я хочу тебя попросить..."
20020-200200280 = "Хорошо. Приду сразу, как закончу."
20020-200200290 = "Хи-хи-хи! Хорошо! Буду ждать!"
20020-200200300 = "Сенсей. Произошёл инцидент."
20020-200200310 = "Инцидент? Что случилось?! Химари, ты в порядке?!"
20020-200200320 = "Просто... Я не могу справиться с этим одна."
20020-200200330 = "Пожалуйста, приходи в моё убежище. Я буду ждать."
20020-200200340 = "Сенсей, сегодня тот день, когда я, Акэбоши Химари, обрела невероятное сокровище."
20020-200200350 = "Раз уж даже ты называешь это сокровищем, Химари... Наверное, это действительно нечто, да?"
20020-200200360 = "Мне одновременно любопытно и тревожно."
20020-200200370 = "Ну перестань, не говори так."
20020-200200380 = "О, знаю! Я бы очень хотела показать тебе лично, так что..."
20020-200200390 = "Ни слова больше. Сегодня зайду к тебе."
20020-200200400 = "Хи-хи! Хорошо! До встречи."
