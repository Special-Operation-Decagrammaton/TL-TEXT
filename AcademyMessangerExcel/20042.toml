[translation]
20042-200420010 = "Послушай меня, Сенсей."
20042-200420020 = "Как ни посмотри, это уже слишком!"
20042-200420030 = "Что случилось, Маки?"
20042-200420040 = "Ты часто бываешь в Миллениуме, Сенсей! Ты же видел, какой огромный у нас учебный центр!"
20042-200420050 = "Семинар заставляет меня в одиночку подметать все опавшие листья"
20042-200420060 = "во всём этом гигантском учебном центре!"
20042-200420070 = "Я понимаю, что Семинар не фанат Веритаса, но это уже перебор, нет?"
20042-200420080 = "Они заставили тебя делать такую тяжёлую работу в одиночку, Маки?"
20042-200420090 = "Тебе поручили это просто так?"
20042-200420100 = "Эм..."
20042-200420110 = "Нууу, до того как Семинар отправил меня сюда..."
20042-200420120 = "...у меня были маааленькие неприятности из-за граффити на школьных монорельсах."
20042-200420130 = "Но вряд ли причина в этом."
20042-200420140 = "Думаю, причина именно в этом..."
20042-200420150 = "Сенсей"
20042-200420160 = "Ты случайно не свободен на этих выходных?"
20042-200420170 = "Ничего особенного не планировал... А что?"
20042-200420180 = "Эм, нууу"
20042-200420190 = "Я хотела сходить в поход на ближайшую гору, но одной будет ужасно скучно."
20042-200420200 = "Не хочешь пойти со мной?"
20042-200420210 = "Маки..."
20042-200420220 = "...и поход?!"
20042-200420230 = "Что за реакция?!"
20042-200420240 = "Мы ведь уже встречались на улице раньше?!"
20042-200420250 = "Прости-прости. Просто..."
20042-200420260 = "Такое чувство, что ты впервые сама зовёшь меня куда-то на природу."
20042-200420270 = "Обычно ты хочешь только рисовать граффити или покупать электронику."
20042-200420280 = "…"
20042-200420290 = "Ладно, наверное, это правда, но всё равно...!"
20042-200420300 = "В общем, время у тебя есть, да?"
20042-200420310 = "Увидимся на выходных, Сенсей!"
20042-200420320 = "Сенсей!"
20042-200420330 = "Ты и на этих выходных свободен?"
20042-200420340 = "Я слышала об очень популярном кемпинге недалеко от D.U."
20042-200420350 = "Так что не хочешь сходить со мной в кемпинг?"
20042-200420360 = "...В этом кемпинге можно получить какой-то игровой предмет?"
20042-200420370 = "А. Откуда ты знаешь?"
20042-200420380 = "Ты тоже играешь в Mushiqueen AR, Сенсей?"
20042-200420390 = "Нет, просто подумал: раз уж ты заговорила о кемпинге..."
20042-200420400 = "...наверняка это связано с игрой."
20042-200420410 = "Как грубо с твоей стороны так меня стереотипизировать!"
20042-200420420 = "...Хотя ты не ошибся."
20042-200420430 = "В общем, сможешь уделить мне время на выходных?"
20042-200420440 = "Всё-таки одиночный кемпинг для новичков очень опасен..."
20042-200420450 = "Я пойду с тобой исключительно ради безопасности."
20042-200420460 = "Спасибо, Сенсей!"
20042-200420470 = "Если подумать, этот год уже почти закончился."
20042-200420480 = "А всё равно кажется, что я ещё столько всего хотела сделать."
20042-200420490 = "Время просто летит!"
20042-200420500 = "Согласен..."
20042-200420510 = "В этом году ещё столько работы осталось..."
20042-200420520 = "Если подумать, Семинар был страшно занят всеми делами под конец года."
20042-200420530 = "А в Шале как? Я могу чем-нибудь помочь?"
20042-200420540 = "Можешь в следующую смену представителя студентов помочь мне разобрать чеки?"
20042-200420550 = "Для годового расчёта ещё осталась куча чеков."
20042-200420560 = "Хорошо. Помогу, когда в следующий раз буду представителем студентов."
20042-200420570 = "А?"
20042-200420580 = "Если подумать, разве срок сдачи расходов Шале не сегодня?"
20042-200420590 = "Но если ждать, пока я снова буду на дежурстве..."
20042-200420600 = "Юука об этом знает?"
20042-200420610 = "..."
20042-200420620 = "Можешь оставить это в тайне?"
20042-200420630 = "Фу-фу."
20042-200420640 = "Почему-то мне захотелось лимитированного вкуса Frenzy MAX Tropical..."
20042-200420650 = "...К твоей следующей смене всё будет готово."
