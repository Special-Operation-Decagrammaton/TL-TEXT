[translation]
20042-200420010 = "Sensei, escuta só"
20042-200420020 = "Não importa como você olhe, isso não é muita sacanagem?"
20042-200420030 = "O que aconteceu?"
20042-200420040 = "Você sabe bem o tamanho da Área de Estudos, né, Sensei?"
20042-200420050 = "O Seminário me mandou varrer"
20042-200420060 = "todas as folhas caídas de lá sozinha!"
20042-200420070 = "Por mais que elas tenham birra com a gente, você não acha que é maldade demais?"
20042-200420080 = "Realmente, limpar tudo sozinha é puxado..."
20042-200420090 = "Mas mandaram você limpar do nada?"
20042-200420100 = "Bom, na verdade..."
20042-200420110 = "Eu fiz um grafite no monotrilho da Millennium"
20042-200420120 = "e levei uma bronca daquelas..."
20042-200420130 = "Será que foi por causa disso?"
20042-200420140 = "Acho bem provável..."
20042-200420150 = "Sensei"
20042-200420160 = "Já tem planos pra este fim de semana?"
20042-200420170 = "Nada em especial, por quê?"
20042-200420180 = "Então..."
20042-200420190 = "Eu tava pensando em subir uma montanha aqui perto, mas ir sozinha é meio solitário"
20042-200420200 = "Se tiver afim, não quer ir comigo?"
20042-200420210 = "A Maki..."
20042-200420220 = "...fazendo trilha na montanha?!"
20042-200420230 = "Ei, que reação é essa...?"
20042-200420240 = "A gente já até se encontrou na montanha antes!"
20042-200420250 = "Foi mal, foi mal, mas é que..."
20042-200420260 = "Quando não envolve eletrônicos nem grafite,"
20042-200420270 = "é meio raro você me chamar pra sair assim, Maki"
20042-200420280 = "Hmm..."
20042-200420290 = "Pior que é verdade..."
20042-200420300 = "Enfim, posso considerar isso um 'sim', né?"
20042-200420310 = "Então até o fim de semana!"
20042-200420320 = "Sensei"
20042-200420330 = "Tem tempo neste fim de semana também?"
20042-200420340 = "Fiquei sabendo que tem um acampamento famoso perto do D.U."
20042-200420350 = "Que tal a gente ir lá juntos?"
20042-200420360 = "...Por acaso aparece algum monstro raro limitado nesse acampamento?"
20042-200420370 = "Ué, como você descobriu?"
20042-200420380 = "Não me diga que você também tá jogando AR Mushi Queen, Sensei?"
20042-200420390 = "Pensei que, pra Maki falar de acampamento..."
20042-200420400 = "só podia ter alguma coisa a ver com jogo"
20042-200420410 = "Ah, que maldade!"
20042-200420420 = "...Bom, pior que é isso mesmo"
20042-200420430 = "E aí, tá livre no fim de semana?"
20042-200420440 = "Ir sozinha pode ser perigoso, então..."
20042-200420450 = "Eu vou com você"
20042-200420460 = "Valeu, Sensei!"
20042-200420470 = "O ano já tá quase acabando, né?"
20042-200420480 = "Eu tinha tanta coisa que queria fazer,"
20042-200420490 = "mas o ano passou num piscar de olhos"
20042-200420500 = "Pois é..."
20042-200420510 = "E ainda tem o trabalho que eu preciso terminar antes do ano acabar..."
20042-200420520 = "Falando nisso, o pessoal do Seminário também parecia super ocupado"
20042-200420530 = "Sensei, deixa eu te ajudar com alguma coisa também!"
20042-200420540 = "Então acho que vou te pedir pra organizar os recibos no seu próximo plantão"
20042-200420550 = "A organização dos recibos não andou nadinha..."
20042-200420560 = "Beleza, deixa comigo!"
20042-200420570 = "...Ué?"
20042-200420580 = "O prazo disso aí não era até hoje?"
20042-200420590 = "Acho que deixar pro próximo plantão não vai dar tempo..."
20042-200420600 = "A veterana Yuuka sabe disso?"
20042-200420610 = "..."
20042-200420620 = "Será que você pode guardar segredo...?"
20042-200420630 = "Hehe"
20042-200420640 = "Bateu uma vontade de tomar um Youkai MAX sabor Tropical Limitado agora~"
20042-200420650 = "...Vou deixar garantido até o dia do seu plantão"
