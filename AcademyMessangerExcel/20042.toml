[translation]
20042-200420010 = "Сенсей, послушайте."
20042-200420020 = "Вы не находите, что это просто ужасно?"
20042-200420030 = "Что случилось?"
20042-200420040 = "Вы же знаете, какая большая учебная зона."
20042-200420050 = "А мне сказали убирать там все листья одной!"
20042-200420060 = "Так сказали в Семинаре!"
20042-200420070 = "Как ни крути, это жестоко, даже если мы у них на плохом счету, вы так не думаете?"
20042-200420080 = "Да, одной действительно тяжело..."
20042-200420090 = "Вам сказали убирать прямо сейчас?"
20042-200420100 = "Понимаете..."
20042-200420110 = "Я нарисовала граффити на монорельсе Миллениума,"
20042-200420120 = "и меня немного отчитали..."
20042-200420130 = "Может, это из-за того самого?"
20042-200420140 = "Наверное..."
20042-200420150 = "Сенсей"
20042-200420160 = "У вас уже есть планы на эти выходные?"
20042-200420170 = "Особых планов нет, а что?"
20042-200420180 = "Ну вот..."
20042-200420190 = "Я хотела подняться в горы, но одной как-то грустно."
20042-200420200 = "Не хотите пойти со мной?"
20042-200420210 = "Маки..."
20042-200420220 = "...пойдёт в горы!?"
20042-200420230 = "Ну что за реакция..."
20042-200420240 = "Мы же уже встречались в горах раньше."
20042-200420250 = "Прости-прости, но..."
20042-200420260 = "Разве это не связано ни с техникой, ни с граффити?"
20042-200420270 = "Маки редко зовёт куда-то сама, мне показалось."
20042-200420280 = "Хм-м"
20042-200420290 = "Наверное, да..."
20042-200420300 = "В общем, договорились?"
20042-200420310 = "Тогда до выходных!"
20042-200420320 = "Сенсей"
20042-200420330 = "У вас есть время в эти выходные?"
20042-200420340 = "Говорят, недалеко от Д.У. есть известный кемпинг."
20042-200420350 = "Не хотите сходить вместе?"
20042-200420360 = "...В этом кемпинге, случайно, не появляется редкий монстр?"
20042-200420370 = "Ах, откуда вы знаете?"
20042-200420380 = "Вы тоже играете в AR Мусикуин?"
20042-200420390 = "Когда Маки говорит о кемпинге..."
20042-200420400 = "я подумал, что это, наверное, связано с игрой."
20042-200420410 = "Ах, как жестоко!"
20042-200420420 = "...Ну, вообще-то, так и есть."
20042-200420430 = "Так что, вы свободны в эти выходные?"
20042-200420440 = "Одной, наверное, опасно..."
20042-200420450 = "Я пойду с тобой."
20042-200420460 = "Спасибо, Сенсей!"
20042-200420470 = "Этот год уже подходит к концу."
20042-200420480 = "Казалось, столько всего хотелось сделать,"
20042-200420490 = "но год пролетел незаметно."
20042-200420500 = "Это точно..."
20042-200420510 = "У меня есть работа, которую нужно успеть до конца года..."
20042-200420520 = "Кстати, Семинар вроде тоже был очень занят."
20042-200420530 = "Сенсей, позвольте мне помочь вам!"
20042-200420540 = "Тогда, в следующий раз, когда будешь дежурить, поможешь мне разобрать квитанции?"
20042-200420550 = "У меня совсем руки не доходят..."
20042-200420560 = "Хорошо, я попробую."
20042-200420570 = "...А?"
20042-200420580 = "Разве срок сдачи не сегодня?"
20042-200420590 = "То есть, если ждать следующего дежурства, уже не успеть..."
20042-200420600 = "Юука знает об этом?"
20042-200420610 = "..."
20042-200420620 = "Может, никому не скажешь...?"
20042-200420630 = "Хе-хе"
20042-200420640 = "А то мне захотелось лимитированного тропического Макса..."
20042-200420650 = "...Я куплю его до твоего дежурства."