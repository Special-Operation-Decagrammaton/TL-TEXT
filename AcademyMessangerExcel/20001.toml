[translation]
20001-2328 = "C&C служит Миллениуму. Такова наша работа как горничных."
20001-2329 = "Не знаю, какое будет задание, но завтрашняя операция пройдёт в городской зоне Миллениума."
20001-2330 = "Задание горничной... уборка?"
20001-2331 = "Будь осторожна."
20001-2332 = "...Это не так далеко от истины."
20001-2333 = "Устранение тех, кто вредит Миллениуму,"
20001-2334 = "тоже можно назвать уборкой, наверное."
20001-2335 = "Конечно, будь то уборка или что-то иное..."
20001-2336 = "Спасибо за беспокойство."
20001-2337 = "Каким бы ни было задание... C&C будет служить изо всех сил."
20001-2338 = "Спасибо за помощь ранее. Я безмерно благодарна."
20001-2339 = "Когда-нибудь я хочу отплатить тебе своей службой."
20001-2340 = "Если бы у меня было больше сил,"
20001-2341 = "я бы стёрла с лица земли предмет «математика»..."
20001-2342 = "Что случилось вдруг?"
20001-2343 = "Прости за внезапную жалобу..."
20001-2344 = "По дороге в библиотеку мне вдруг захотелось рассказать вам."
20001-2345 = "А вторую мечту я расскажу, когда она исполнится."
20001-2346 = "Я никому не говорила, но"
20001-2347 = "в любом случае первым узнаете вы..."
20001-2348 = "Сенсей, шокирующая новость."
20001-2349 = "Шокирующая?"
20001-2350 = "Надеюсь, это что-то хорошее."
20001-2351 = "Тест полностью провален (*‿*)ノ"
20001-2352 = "...Эм, я правильно использовала этот смайлик?"
20001-2353 = "Сенсей, спасибо. Сегодня было весело."
20001-2354 = "...Правда, от всего сердца."
20001-2355 = "Сенсей, вы ведь Сенсей, но..."
20001-2356 = "Я хочу попросить тебя как друга. Выслушаешь мою проблему?"
20001-2357 = "Конечно, что случилось?"
20001-2358 = "Хорошо, куда мне прийти?"
20001-2359 = "Спасибо."
20001-2360 = "Приходи на крышу Миллениума."
20001-2361 = "Сенсей, случилось нечто удивительное."
20001-2362 = "Я купила пиццу и зашла в класс, а там меня ждала та подруга, о которой я говорила."
20001-2363 = "...Она принесла салат."
20001-2364 = "Мне было очень радостно."
20001-2365 = "У подруги появились срочные дела, и я согласилась подменить её на работе."
20001-2366 = "Говорят, там милая униформа, так что я жду с нетерпением."
20001-2367 = "Хотелось бы увидеть Карин в милой униформе."
20001-2368 = "...То место, оно нормальное?"
20001-2369 = "Мне приятно, что ты так говоришь, но"
20001-2370 = "...немного неловко."
20001-2371 = "Хм? Что ты имеешь в виду?"
20001-2372 = "Где бы я ни была,"
20001-2373 = "если я нужна как горничная C&C,"
20001-2374 = "я хочу быть полезной."
20001-2375 = "Ну, тогда я пошла."
20001-2376 = "Когда освоюсь, приглашу и тебя."
20001-2377 = "Кстати, Сенсей..."
20001-2378 = "Когда я делала тот самый... жест, мне показалось, ты наводил планшет..."
20001-2379 = "Надеюсь, ты не снимал?"
20001-2380 = "Я не снимал Карин. Зато снял твою ослепительную улыбку, Карин."
20001-2381 = "Пользуюсь правом хранить молчание."
20001-2382 = "Удали сейчас же!"
20001-2383 = "Эй, Сенсей! Не игнорируй меня!"
20001-2384 = "Сенсей"
20001-2385 = "Похоже, у подруги всё уладилось."
20001-2386 = "Теперь мне не нужно идти в кафе вместо неё."
20001-2387 = "Отдыхай с чувством выполненного долга!"
20001-2388 = "Мне бы хотелось увидеть это ещё раз!"
20001-2389 = "Ну, хоть всего было по-всякому, но подруга сказала, что я ей помогла."
20001-2390 = "К сожалению, мне больше не придётся работать в кафе горничных,"
20001-2391 = "так что я больше не смогу сделать для тебя тот самый милый жест."
20001-2392 = "Жаль... или нет?"
20001-2393 = "...Шучу. В любом случае, будем дружить и дальше."
20001-2394 = "Мой Хозяин."