[translation]
20001-2328 = "A C&C serve à Millennium. Afinal, esse é o nosso dever como maids"
20001-2329 = "Ainda não sei os detalhes, mas parece que a missão de amanhã será na área urbana da Millennium"
20001-2330 = "Missão de maid seria...... faxina?"
20001-2331 = "Tome cuidado lá"
20001-2332 = "......Não está tão longe da verdade"
20001-2333 = "Eliminar aqueles que causam problemas para a Millennium"
20001-2334 = "Provavelmente também pode ser chamado de faxina"
20001-2335 = "Claro que, sendo faxina literal ou não......"
20001-2336 = "Obrigada pela preocupação"
20001-2337 = "Qualquer que seja a missão...... a C&C servirá com força total"
20001-2338 = "Você me salvou agora há pouco, muito obrigada. Nem sei como agradecer o suficiente"
20001-2339 = "Qualquer dia desses, quero retribuir prestando meus serviços a você"
20001-2340 = "Se eu tivesse mais poder,"
20001-2341 = "Apagaria a matéria chamada \"Matemática\" da face da Terra......"
20001-2342 = "Por que isso assim do nada?"
20001-2343 = "Desculpe desabafar assim de repente......"
20001-2344 = "No caminho para a biblioteca, deu vontade de desabafar com você, Sensei"
20001-2345 = "Hum, quanto àquele meu segundo sonho...... eu te conto direitinho quando ele se realizar"
20001-2346 = "Nunca contei para ninguém, mas"
20001-2347 = "De um jeito ou de outro, você provavelmente será a primeira pessoa a saber, Sensei......"
20001-2348 = "Sensei, tenho uma notícia bombástica"
20001-2349 = "Notícia bombástica?"
20001-2350 = "Tomara que seja uma notícia boa"
20001-2351 = "Fui massacrada na prova (*‿*)ノ"
20001-2352 = "......Ué, será que usei o emoticon certo?"
20001-2353 = "Obrigada, Sensei. Hoje foi muito divertido"
20001-2354 = "......De verdade, do fundo do coração"
20001-2355 = "Eu sei que você é o nosso Sensei, mas......"
20001-2356 = "Queria te pedir isso como amiga. Você poderia ouvir um desabafo meu?"
20001-2357 = "Claro, o que aconteceu?"
20001-2358 = "Combinado, onde a gente se encontra?"
20001-2359 = "Obrigada"
20001-2360 = "Gostaria que você viesse ao terraço da Millennium"
20001-2361 = "Sensei, aconteceu uma coisa incrível"
20001-2362 = "Comprei a pizza e, quando entrei na sala de aula, aquela amiga de quem te falei estava lá me esperando"
20001-2363 = "......E ela tinha comprado salada para comermos juntas"
20001-2364 = "Fiquei muito, muito feliz"
20001-2365 = "Surgiu um imprevisto com uma amiga minha e acabei topando cobrir o turno dela no trabalho de meio período"
20001-2366 = "Parece que a loja é famosa pelo uniforme fofo, então estou animada"
20001-2367 = "Eu adoraria ver você com um uniforme fofo, Karin"
20001-2368 = "......Tem certeza de que vai dar tudo certo nessa loja?"
20001-2369 = "F-Fico feliz que diga isso, mas"
20001-2370 = "......Me deixa um pouco sem jeito"
20001-2371 = "Hm? Como assim?"
20001-2372 = "Não importa onde seja,"
20001-2373 = "Se precisarem de mim como maid da C&C,"
20001-2374 = "Eu quero ajudar"
20001-2375 = "Bom, já está na hora de eu ir"
20001-2376 = "Quando eu pegar o jeito do trabalho, convido você para ir lá também, Sensei"
20001-2377 = "Pensando bem, Sensei......"
20001-2378 = "Quando eu fiz aquela...... aquela pose, tive a impressão de ver você segurando o tablet......"
20001-2379 = "Não me diga que você tirou foto?"
20001-2380 = "Da Karin eu não tirei. Mas tirei uma da Catherine com um sorriso radiante"
20001-2381 = "Invoco o meu direito de permanecer em silêncio"
20001-2382 = "Apaga isso agora mesmo!"
20001-2383 = "Ei, Sensei!? Não visualiza e me deixa no vácuo!"
20001-2384 = "Sensei"
20001-2385 = "Parece que a minha amiga já resolveu o compromisso dela"
20001-2386 = "Com isso, não preciso mais ir cobrir o turno no maid café"
20001-2387 = "Bom trabalho!"
20001-2388 = "Queria ter visto só mais uma última vez!"
20001-2389 = "Sim. Aconteceu de tudo um pouco, mas minha amiga agradeceu bastante pela ajuda"
20001-2390 = "Infelizmente, como não vou mais trabalhar no maid café,"
20001-2391 = "Também não vou mais poder fazer aquele \"Moe Moe Kyun\" para você, Sensei"
20001-2392 = "Você acha...... uma pena?"
20001-2393 = "......Brincadeira. De qualquer forma, conto com você daqui para frente também"
20001-2394 = "Meu Mestre"
20001-200010010 = "Ultimamente tenho feito vários tipos de limpeza"
20001-200010020 = "E por aí, Sensei, como estão as coisas?"
20001-200010030 = "Se precisar de ajuda, é só falar"
20001-200010040 = "Eu dou uma mão"
20001-200010050 = "Você está falando...... no sentido literal de limpeza, né?"
20001-200010060 = "Claro. Meu trabalho não se resume só a missões de agente"
20001-200010070 = "Nesse caso, eu estava mesmo pensando em dar uma geral aqui no escritório"
20001-200010080 = "Entendido"
20001-200010090 = "Já estou indo"
