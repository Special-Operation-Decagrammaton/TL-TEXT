[translation]
20001-2328 = "C&C служит Миллениуму. Такова работа горничной."
20001-2329 = "Не знаю, каким будет завтрашнее задание, но оно пройдёт в городском районе Миллениума."
20001-2330 = "Разве задача горничной не уборка?"
20001-2331 = "Будь осторожна."
20001-2332 = "Это не совсем неверно..."
20001-2333 = "Избавляться от тех, кто вредит Миллениуму..."
20001-2334 = "тоже считается «уборкой»."
20001-2335 = "Даже если это не уборка в буквальном смысле..."
20001-2336 = "Спасибо за заботу."
20001-2337 = "Я буду стараться на каждом задании..."
20001-2338 = "Я просто так благодарна."
20001-2339 = "Позже... я отплачу вам по-своему."
20001-2340 = "Если бы я была чуточку сильнее..."
20001-2341 = "Если и есть что-то, что я хотела бы стереть из этого мира, так это математику."
20001-2342 = "О чём ты?"
20001-2343 = "О, я просто жалуюсь."
20001-2344 = "Я шла в библиотеку... и захотела написать вам."
20001-2345 = "Моя следующая мечта... Ну, расскажу, когда она сбудется."
20001-2346 = "Я никому об этом не говорила."
20001-2347 = "Чувствую, вы узнаете первым."
20001-2348 = "У меня сюрприз, Сенсей."
20001-2349 = "Сюрприз?"
20001-2350 = "Надеюсь, что хороший."
20001-2351 = "Я полностью завалила тест. :D"
20001-2352 = "Этот смайлик подходит?"
20001-2353 = "Сегодняшний ужин был весёлым."
20001-2354 = "Очень весёлым..."
20001-2355 = "Я знаю... вы мой учитель, но..."
20001-2356 = "мы можем быть друзьями? Могу я рассказывать вам о своих проблемах?"
20001-2357 = "Конечно. Что случилось?"
20001-2358 = "Проблемы? Где хочешь встретиться?"
20001-2359 = "Спасибо, что так быстро ответили."
20001-2360 = "Встретимся на крыше."
20001-2361 = "У меня удивительная новость."
20001-2362 = "Я купила пиццу и пришла в клубную комнату, а там меня ждала подруга."
20001-2363 = "У неё был салат..."
20001-2364 = "Я была так счастлива."
20001-2365 = "У моей подруги, которая подрабатывает в кафе, случилось ЧП, так что я вышла вместо неё."
20001-2366 = "Это кафе знаменито милой формой, поэтому я немного взволнована."
20001-2367 = "Уверен, форма тебе очень пойдёт, Карин."
20001-2368 = "...Разве это не странно?"
20001-2369 = "Очень мило с вашей стороны."
20001-2370 = "Но теперь мне немного неловко."
20001-2371 = "А? Что странного?"
20001-2372 = "Даже если это странно..."
20001-2373 = "если кому-то нужна я как горничная C&C,"
20001-2374 = "я хочу помочь."
20001-2375 = "Я пошла на работу."
20001-2376 = "Приглашу вас, когда стану лучше справляться."
20001-2377 = "Сенсей..."
20001-2378 = "Я видела, что вы держали планшет, когда я делала «моэ-моэ, кюн»..."
20001-2379 = "Вы меня фотографировали?"
20001-2380 = "Тебя я не фотографировал. А вот Кэтрин сфотографировал."
20001-2381 = "Отказываюсь свидетельствовать против себя!"
20001-2382 = "Удалите сейчас же!"
20001-2383 = "Ответьте мне!"
20001-2384 = "Сенсей!"
20001-2385 = "Кажется, ей уже лучше."
20001-2386 = "Наверное, мне больше не придётся работать в мэйд-кафе."
20001-2387 = "Хорошая работа."
20001-2388 = "Я хотел увидеть тебя там в последний раз!"
20001-2389 = "Да, было тяжело, но подруга меня поблагодарила."
20001-2390 = "Уже поздно. Наверное, я больше там работать не буду."
20001-2391 = "Наверное, больше не смогу делать для вас «моэ-моэ, кюн»."
20001-2392 = "Какая жалость."
20001-2393 = "Огромное спасибо."
20001-2394 = "Мой Мастер."
20001-200010010 = "最近、色んな掃除をしてるんだけど"
20001-200010020 = "先生はどう？"
20001-200010030 = "必要であれば言ってくれ"
20001-200010040 = "私が手伝おう"
20001-200010050 = "それ……言葉通りの意味だよね？"
20001-200010060 = "もちろん。エージェントの仕事ばかりじゃないから"
20001-200010070 = "それなら、執務室の掃除をしようと思ってたんだ"
20001-200010080 = "分かった"
20001-200010090 = "すぐ行く"
