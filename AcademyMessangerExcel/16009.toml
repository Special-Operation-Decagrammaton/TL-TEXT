[translation]
16009-160090010 = "Домо, Сенсей. Я Мичиру."
16009-160090020 = "Эмм... Мичиру? Что происходит?"
16009-160090030 = "Так традиционно приветствуют друг друга такие фанаты ниндзя, как мы!"
16009-160090040 = "Вы должны принять это приветствие, чтобы стать моим другом-фанатом ниндзя... а в итоге и моим товарищем-ниндзя!"
16009-160090050 = "Не помню, чтобы соглашался..."
16009-160090060 = "Уф... Так обидно это слышать!"
16009-160090070 = "Ну же, Сенсей... Вы забыли?!"
16009-160090080 = "Поздней ночью... под луной, разговоры о засадах... только вы и я!"
16009-160090090 = "Кстати, «засада» — это ниндзевский сленг для скрытного движения в кустах. Не забудьте!"
16009-160090100 = "Я вообще этого не помню! О какой засаде речь?!"
16009-160090110 = "Ну, не будем переживать о деталях!"
16009-160090120 = "Но не расстраивайтесь! У вас редкий потенциал ниндзя."
16009-160090130 = "Вас ждёт светлое будущее! Как президент Клуба изучения ниндзюцу, я ручаюсь!"
16009-160090140 = "Эм... С-Спасибо, наверное...?"
16009-160090150 = "Ва-ха-ха! Не стоит благодарности!"
16009-160090160 = "Так зачем ты написала мне сегодня, Мичиру?"
16009-160090170 = "О! Мы опоздаем на поезд!"
16009-160090180 = "Мне пора! Надеюсь когда-нибудь снова вас увидеть! Адиос! Сайонара!"
16009-160090190 = "*поп-поп-поп-поп* <- звук дымовой бомбы"
16009-160090200 = "А? Даже звуковые эффекты..."
16009-160090210 = "Эмм, в общем, адиос! Сайонара!"
16009-160090220 = "Сегодня днём навещу Шале. — Ниндзя М"
16009-160090230 = "Ну, ты вроде предупредила, но..."
16009-160090240 = "Ниндзя предупреждают не так. Это скорее как загадочный вор..."
16009-160090250 = "Ну же! Не обращайте внимания на детали!"
16009-160090260 = "К тому же загадочные воры немного связаны с ниндзя, так что всё нормально!"
16009-160090270 = "У тебя всё связано с ниндзя, да?!"
16009-160090280 = "Ва-ха-ха! В любом случае я предупредила, так что ждите меня!"
16009-160090290 = "Скоро увидимся!"
16009-160090300 = "*поп-поп-поп-поп* <- звук дымовой бомбы"
16009-160090310 = "*вжух* <- быстро удаляется"
16009-160090320 = "...Ещё больше звуковых эффектов?"
16009-160090330 = "Как вы знаете, я президент Клуба изучения ниндзюцу."
16009-160090340 = "Ага. Конечно."
16009-160090350 = "Но это неофициальный клуб. Разве можно называть себя президентом?"
16009-160090360 = "Аргх! Это было лишнее! Я знаю, что делаю!"
16009-160090370 = "Я всё время очень усердно работаю! Изучаю ниндзя, создаю контент..."
16009-160090380 = "Если я продолжу так же стараться, однажды я расскажу о ниндзя всему Кивотосу, и Клуб изучения ниндзюцу наконец признают официальным клубом!"
16009-160090390 = "Да, я знаю, как усердно ты стараешься, Мичиру. Я тебя поддерживаю."
16009-160090400 = "Ва-ха-ха! Спасибо, Сенсей! Для меня это очень много значит."
16009-160090410 = "Рада это слышать..."
16009-160090420 = "Я не просто так это говорю. Ты даже не представляешь, насколько сильно мне помогаешь."
16009-160090430 = "Твоя поддержка настолько сильна, что все мои сомнения полностью исчезли!"
16009-160090440 = "А?"
16009-160090450 = "Мне ведь не стоит скупиться на вложения в свои старания, правда?"
16009-160090460 = "Я слышала, в один из моих любимых магазинов завезли новые товары с ниндзя."
16009-160090470 = "Т-то есть инструменты для ниндзюцу!"
16009-160090480 = "Они довольно дорогие, поэтому я сомневалась... но теперь передумала!"
16009-160090490 = "Ага! Это инвестиция в моё будущее!"
16009-160090500 = "Какая же ты жадная..."
16009-160090510 = "Ва-ха-ха! Буду ждать тебя, Сенсей!"
16009-160090520 = "*вжух* *татататат* <- звук очень быстрого бега"
16009-160090530 = "Л-ладно... Поняла."
16009-160090540 = "О, Сенсей. Можешь поискать ту штуку в офисе Шале?"
16009-160090550 = "Штуку? Какую штуку?"
16009-160090560 = "Мангу, которую я постоянно читаю. «Битва ветров Кама-Боко, том 19»."
16009-160090570 = "Я обыскала всю клубную комнату, но нигде её не нашла. Она точно в офисе."
16009-160090580 = "Когда ты вообще успела принести её в Шале?"
16009-160090590 = "А...? Ну, наша клубная комната временная, и неизвестно, когда эти придурки из Хяккарёрана снова нагрянут."
16009-160090600 = "Клуб Инь-Ян тоже постоянно приходит и устраивает переполох."
16009-160090610 = "Согласно моему ниндзя-мозгу..."
16009-160090620 = "Хранить такую ценность в Шале было самым логичным решением."
16009-160090630 = "Шале — не склад, Мичиру..."
16009-160090640 = "О! Если тебе станет скучно, обязательно почитай! Очень рекомендую серию «Кама-Боко»!"
16009-160090650 = "И ещё напомню: сегодня вечером собираемся в парке. Не забудь!"
16009-160090660 = "Буду ждать тебя, Сенсей!"
16009-160090670 = "Как ты быстро сменила тему!"
16009-160090680 = "Так что ты собираешься делать сегодня вечером?"
16009-160090690 = "*швуп-швуп-швуп-швуп* <- звук завязывания шнурков"
16009-160090700 = "Это тоже должно быть ниндзя-приёмом...?"
16009-160090710 = "Сенсей. Кажется... вчера..."
16009-160090720 = "Кажется... я простудилась..."
16009-160090730 = "...Ладно. Я сварю тебе суп."
16009-160090740 = "Эм... Л-ладно. Спасибо, Сенсей."
16009-160090750 = "Я-я буду ждать..."
16009-160090760 = "Почтенный Сенсей."
16009-160090770 = "Древние записи минувших эпох"
16009-160090780 = "и старые записи древних времён..."
16009-160090790 = "Я сумела тебя заинтересовать?"
16009-160090800 = "Неужели это ТО САМОЕ...?!"
16009-160090810 = "Свитки древних ниндзя?!"
16009-160090820 = "Я знала, что ты так скажешь, почтенный Сенсей!"
16009-160090830 = "Но ты ошибаешься!"
16009-160090840 = "Ня-ха-ха! Ты попался в мою ловушку!"
16009-160090850 = "Я?! Ошибаюсь?!"
16009-160090860 = "Ну, если говорить технически,"
16009-160090870 = "ты примерно наполовину прав..."
16009-160090880 = "Так что, если тебе интересно,"
16009-160090890 = "встретимся у входа в торговый район, где мы обычно встречаемся!"
16009-160090900 = "Буду ждать, почтенный Сенсей!"
16009-160090910 = "*Шубабаба* <- я очень быстро бегу"
16009-160090920 = "Х-Хорошо..."
