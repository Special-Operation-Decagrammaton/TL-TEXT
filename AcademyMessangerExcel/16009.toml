[translation]
16009-160090010 = "Domo, Sensei-dono...... Eu me chamo Michiru"
16009-160090020 = "Hum......?"
16009-160090030 = "Hehe...... Essa é a saudação tradicional passada de geração em geração entre os otakus de ninjas!"
16009-160090040 = "Não saber responder a isso mostra que você ainda é inexperiente como colega otaku de ninjas...... digo, como Ninja Mate, Sensei-dono!"
16009-160090050 = "Ninja Mate......?"
16009-160090060 = "Grr, por algum motivo isso me deu uma pontada de frustração......!"
16009-160090070 = "S-Sensei-dono...... Não me diga que você esqueceu?!"
16009-160090080 = "Naquela calada da noite, quando até as plantas dormiam...... aquela lembrança de quando fizemos um ambush juntinhos sob a luz do luar!"
16009-160090090 = "Ah, a propósito, \"ambush\" é um termo ninja que significa \"agir furtivamente no meio dos arbustos\". Anota aí pra não esquecer!"
16009-160090100 = "Acho que não tenho lembrança disso não......?"
16009-160090110 = "Ora, ora, não vamos nos prender a pequenos detalhes~"
16009-160090120 = "Relaxa, não precisa desanimar! Você tem talento pra ser ninja, Sensei-dono!"
16009-160090130 = "Eu mesma, como presidente do Clube de Pesquisa de Ninjutsu, garanto o seu potencial!"
16009-160090140 = "Hum, obrigado......?"
16009-160090150 = "Nyahaha, não há de quê!"
16009-160090160 = "Por falar nisso, Michiru, o que manda hoje?"
16009-160090170 = "Eita, já tá quase na hora do meu trem!"
16009-160090180 = "Então até o dia em que nos encontrarmos novamente, Sensei-dono! Adiós = SAYONARA!"
16009-160090190 = "(PUFF!!) ← Efeito sonoro de bomba de fumaça"
16009-160090200 = "Você escreveu a explicação do efeito sonoro......?!"
16009-160090210 = "Hum...... Adiós = SAYONARA!"
16009-160090220 = "Hoje à tarde, comparecerei à Schale. — Ninja M"
16009-160090230 = "Um aviso prévio......?!"
16009-160090240 = "Isso não é coisa de ladrão-fantasma em vez de ninja......?"
16009-160090250 = "Sem implicar com os detalhes!"
16009-160090260 = "Se parar pra pensar por cima, ladrão-fantasma e ninja dão quase no mesmo, então tá valendo!"
16009-160090270 = "Tem certeza disso?!"
16009-160090280 = "Enfim, o aviso está dado, Sensei-dono! Prepare o seu pescoço e aguarde!"
16009-160090290 = "Muito em breve estaremos frente a frente!"
16009-160090300 = "(PUFF!!) ← Efeito sonoro de bomba de fumaça"
16009-160090310 = "(SHUBABABA!) ← Som de quem está partindo velozmente"
16009-160090320 = "......Obrigado por explicar gentilmente toda vez"
16009-160090330 = "Eu sou a presidente do Clube de Pesquisa de Ninjutsu, certo?"
16009-160090340 = "Sim"
16009-160090350 = "Pensando bem, será que um clube não oficializado pode ter \"presidente\"?"
16009-160090360 = "Ugyah! Esse comentário foi totalmente desnecessário! Pode sim!"
16009-160090370 = "A gente realiza nossas atividades direitinho todo dia! Estudamos sobre ninjas, gravamos vídeos e tudo mais!"
16009-160090380 = "Se continuarmos firmes assim, logo logo todo mundo em Kivotos vai conhecer os ninjas e o dia em que seremos reconhecidas como clube oficial estará próximo!"
16009-160090390 = "Verdade, vocês estão se esforçando bastante. Estou na torcida"
16009-160090400 = "Obrigada, Sensei-dono! Ouvir você dizer isso me dá ainda mais gás pra continuar"
16009-160090410 = "Fico feliz em ouvir isso"
16009-160090420 = "Suas palavras me encheram de energia......"
16009-160090430 = "Graças a você, todas as minhas dúvidas sumiram!"
16009-160090440 = "......Hã?"
16009-160090450 = "Quando se trata de se esforçar pelos nossos objetivos, não podemos economizar nos investimentos, né?"
16009-160090460 = "Fiquei sabendo que vai chegar uma remessa nova de produtos ninjas naquela loja que eu sempre vou"
16009-160090470 = "Ah, quer dizer! Ferramentas ninjas!"
16009-160090480 = "Eu tava meio na dúvida porque é salgado pro bolso, mas ouvir suas palavras me deu o empurrãozinho que faltava!"
16009-160090490 = "Isso mesmo, é um investimento para o futuro do Clube de Pesquisa de Ninjutsu!"
16009-160090500 = "Tem certeza de que não é só porque você quer comprar pra você mesma......?"
16009-160090510 = "Então nos vemos no lugar de sempre, Sensei-dono!"
16009-160090520 = "(GIROU! SHUBABABABA!) ← Som de quem deu um mortal super estiloso e saiu correndo"
16009-160090530 = "E-Entendido......"
16009-160090540 = "Ah, Sensei, por acaso aquilo lá não tá aí na Schale?"
16009-160090550 = "Aquilo o quê......?"
16009-160090560 = "O volume 19 de \"Kamaboko Toppuden\"!"
16009-160090570 = "Como não tá na sala do clube, achei que só podia estar na Schale"
16009-160090580 = "Quando foi que você deixou isso aqui......?"
16009-160090590 = "É que, bom, a nossa sala do clube é só um espaço provisório...... e nunca se sabe quando o Hyakkaryouran pode baixar lá de repente......"
16009-160090600 = "Sem falar no Clube Yin-Yang, que também pode aparecer a qualquer momento......"
16009-160090610 = "Daí, após cálculos avançados do meu cérebro ninja,"
16009-160090620 = "Cheguei à conclusão lógica de que o mais seguro é guardar a minha coleção na Schale!"
16009-160090630 = "A Schale não é depósito, senhorita Michiru......"
16009-160090640 = "Claro que você também pode ler se quiser, Sensei-dono, a série \"Kamaboko\" é muito boa!"
16009-160090650 = "Ah, aliás, hoje à noite o ponto de encontro é no parque, viu?"
16009-160090660 = "Tô te esperando lá, Sensei-dono!"
16009-160090670 = "Mudando de assunto do nada como sempre!"
16009-160090680 = "Tudo bem, mas o que a gente vai fazer hoje à noite?"
16009-160090690 = "(SHUBABABABABABA!!!) ← Som de quem está amarrando o cadarço do tênis"
16009-160090700 = "Isso já nem é mais uma ação ninja......?!"
16009-160090710 = "Sensei-dono, acho que por causa daquilo de ontem......"
16009-160090720 = "Acabei pegando um resfriadooo......"
16009-160090730 = "Estou indo aí fazer um mingau pra você......"
16009-160090740 = "Obrigada, Sensei-dono......"
16009-160090750 = "Hum, vou ficar te esperando, então......"
16009-160090760 = "Sensei-dono"
16009-160090770 = "Você por acaso tem interesse"
16009-160090780 = "Em manuscritos de tempos remotos"
16009-160090790 = "Ou mídias de registro da antiguidade......?"
16009-160090800 = "Não me diga que é dos Ninjas Ancestrais......!"
16009-160090810 = "Aquele pergaminho lendário?!"
16009-160090820 = "Mandou muito bem, Sensei-dono!"
16009-160090830 = "Adorei a reação~!"
16009-160090840 = "Mas não é isso"
16009-160090850 = "Depois de todo esse clima?!"
16009-160090860 = "Pra falar a verdade,"
16009-160090870 = "Você acertou metade~"
16009-160090880 = "Se ficou curioso,"
16009-160090890 = "Vem até o centro comercial!"
16009-160090900 = "Tô te esperando, Sensei-dono!"
16009-160090910 = "(SHUBABABA) ← Som de quem está correndo velozmente"
16009-160090920 = "T-Tá bom......"
