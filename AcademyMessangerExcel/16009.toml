[translation]
16009-160090010 = "Здравия, Сенсей... Я — Мичиру."
16009-160090020 = "Э-э...?"
16009-160090030 = "Хе-хе... Это же традиционное приветствие, передаваемое из поколения в поколение среди фанатов ниндзя!"
16009-160090040 = "Раз вы не смогли ответить на него, Сенсей, значит, вы ещё неопытны как друг-нинзя... как ниндзя-мэйт!"
16009-160090050 = "Ниндзя-мэйт...?"
16009-160090060 = "Уф, как обидно...!"
16009-160090070 = "С-Сенсей... вы что, забыли!?"
16009-160090080 = "Ту самую ночь, когда даже трава и деревья спали... В лунном свете мы вдвоём устроили засаду, помните!"
16009-160090090 = "А, кстати, «амбуш» — это термин ниндзя, означающий «действовать скрытно в кустах». Запомните!"
16009-160090100 = "Что-то я не припоминаю такого..."
16009-160090110 = "Ладно-ладно, не будем зацикливаться на мелочах~"
16009-160090120 = "Не расстраивайся! У тебя есть талант ниндзя!"
16009-160090130 = "Я, как глава клуба изучения ниндзюцу, ручаюсь за ваш потенциал!"
16009-160090140 = "Эм, спасибо...?"
16009-160090150 = "Ня-ха-ха, не стоит благодарности!"
16009-160090160 = "Кстати, Мичиру, что ты сегодня хотела?"
16009-160090170 = "Ой, уже скоро поезд!"
16009-160090180 = "Тогда, Сенсей! До встречи! Адиос=САЙОНАРА!"
16009-160090190 = "(БАМ!!) ← звук дымовой шашки"
16009-160090200 = "Она ещё и звук объяснила...!?"
16009-160090210 = "Эм... Адиос=САЙОНАРА!"
16009-160090220 = "Сегодня днём я навещу Шале. Ниндзя М."
16009-160090230 = "Предупреждение...!?"
16009-160090240 = "Это же не ниндзя, а вор!"
16009-160090250 = "Не будем зацикливаться на мелочах!"
16009-160090260 = "Вор — это тоже в некотором роде ниндзя, так что всё нормально!"
16009-160090270 = "Вы правда так думаете!?"
16009-160090280 = "Я предупредила, Сенсей! Готовьтесь!"
16009-160090290 = "Скоро мы снова встретимся!"
16009-160090300 = "(БАМ!!) ← звук дымовой шашки"
16009-160090310 = "(Шш-ш-ш!) ← звук быстрого ухода"
16009-160090320 = "...Спасибо, что каждый раз так подробно всё объясняешь."
16009-160090330 = "Я же глава клуба изучения ниндзюцу, верно?"
16009-160090340 = "Да."
16009-160090350 = "Кстати, можно ли называть «главой» неофициальный кружок?"
16009-160090360 = "Ай! Лишние слова! Можно, можно!"
16009-160090370 = "Мы же постоянно чем-то заняты! Учим ниндзюцу, снимаем видео!"
16009-160090380 = "Если продолжать в том же духе, скоро все в Кивотосе узнают о ниндзя, и нас официально признают!"
16009-160090390 = "Да, ты стараешься. Я поддерживаю тебя."
16009-160090400 = "Спасибо, Сенсей! Когда вы так говорите, я стараюсь ещё больше."
16009-160090410 = "Я рад."
16009-160090420 = "Ваши слова придают мне сил..."
16009-160090430 = "И сомнения ушли!"
16009-160090440 = "...А?"
16009-160090450 = "Ведь для успеха нужно не жалеть вложений, правда?"
16009-160090460 = "Говорят, в мой любимый магазин завезли новые товары для ниндзя."
16009-160090470 = "А, нет! Ниндзя-инструменты!"
16009-160090480 = "Они дорогие, и я сомневалась, но ваши слова помогли мне решиться!"
16009-160090490 = "Да, это инвестиция в будущее клуба изучения ниндзюцу!"
16009-160090500 = "То есть вы берёте не потому, что сами хотите...?"
16009-160090510 = "Тогда встретимся в том же месте, Сенсей!"
16009-160090520 = "(Кувырок! Шш-ш-ш!) ← звук крутого переворота и убегания"
16009-160090530 = "П-понял..."
16009-160090540 = "Кстати, Сенсей, у вас есть кое-что?"
16009-160090550 = "Что именно...?"
16009-160090560 = "19-й том «Камбодзи — Вихревой ветер»!"
16009-160090570 = "В клубе его нет, так что, может, он в Шале?"
16009-160090580 = "И когда ты его туда положила..."
16009-160090590 = "Ну, наша комната временная... и я не знаю, когда нагрянут из Хякка Рёран..."
16009-160090600 = "И отдел инь-ян тоже может прийти в любой момент..."
16009-160090610 = "Поэтому я, используя свой ниндзя-мозг, рассчитала,"
16009-160090620 = "что лучше всего хранить вещи в Шале!"
16009-160090630 = "Шале — это не склад, Мичиру..."
16009-160090640 = "Конечно, вы тоже можете почитать, Сенсей, серия «Камбодзи» очень интересная!"
16009-160090650 = "А, кстати, сегодня вечером встречаемся в парке."
16009-160090660 = "Жду, Сенсей!"
16009-160090670 = "Ты всегда так резко меняешь тему!"
16009-160090680 = "Ладно, а что мы будем делать сегодня вечером?"
16009-160090690 = "(Шш-ш-ш-ш-ш!!!) ← звук завязывания шнурков"
16009-160090700 = "Это уже даже не ниндзя-движение!"
16009-160090710 = "Сенсей, из-за вчерашнего..."
16009-160090720 = "Я простудилась..."
16009-160090730 = "Я приду с кашей..."
16009-160090740 = "Спасибо, Сенсей..."
16009-160090750 = "Эм, я буду ждать..."
16009-160090760 = "Сенсей."
16009-160090770 = "Вас интересуют древние свитки"
16009-160090780 = "или древние носители информации..."
16009-160090790 = "?"
16009-160090800 = "Неужели, ниндзя древности...!"
16009-160090810 = "Тот самый древний свиток!?"
16009-160090820 = "Как и ожидалось от Сенсея!"
16009-160090830 = "Отличная реакция~!"
16009-160090840 = "Но не в этом дело."
16009-160090850 = "После такого вступления!?"
16009-160090860 = "Если быть точной,"
16009-160090870 = "вы угадали на половину."
16009-160090880 = "Если интересно,"
16009-160090890 = "приходите в торговый квартал!"
16009-160090900 = "Жду, Сенсей!"
16009-160090910 = "(Шш-ш-ш) ← звук быстрого бега"
16009-160090920 = "А-ага..."й