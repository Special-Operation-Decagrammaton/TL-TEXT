[translation]
20043-200430010 = "С Новым годом!"
20043-200430020 = "С Новым годом, Изуми."
20043-200430030 = "Новый год наступил!"
20043-200430040 = "А в Новый год главное... это оно!"
20043-200430050 = "Как вы думаете, о чём я, Сенсей?"
20043-200430060 = "Раз уж ты спрашиваешь... наверное, еда?"
20043-200430070 = "Правильно! Но не простая, а особенная!"
20043-200430080 = "Та, которую можно есть только в Новый год!"
20043-200430090 = "А что вы обычно едите в Новый год, Сенсей?"
20043-200430100 = "Наверное, я не особо привередлив."
20043-200430110 = "В этом году я заказал закуски."
20043-200430120 = "Понятно."
20043-200430130 = "Но раз уж наступил Новый год, почему бы не съесть что-то особенное!"
20043-200430140 = "Закуски — это здорово!"
20043-200430150 = "Вы не готовите сами, а заказываете."
20043-200430160 = "А я в этом году..."
20043-200430170 = "решила попробовать приготовить новогоднее блюдо!"
20043-200430180 = "Я была бы рада, если бы вы посмотрели."
20043-200430190 = "Сенсей"
20043-200430200 = "У вас есть время после этого?"
20043-200430210 = "Что случилось?"
20043-200430220 = "Вы почти не попробовали тот новогодний обед,"
20043-200430230 = "и меня это волнует."
20043-200430240 = "Не переживай, всё в порядке!"
20043-200430250 = "Я переживаю!"
20043-200430260 = "Я ведь хотела, чтобы вы поели..."
20043-200430270 = "Поэтому сегодня я приготовила"
20043-200430280 = "особый сюрприз!"
20043-200430290 = "Ждите с нетерпением!"
20043-200430300 = "Спасибо, что проводили меня, Сенсей!"
20043-200430310 = "Не за что."
20043-200430320 = "Но вам не было холодно?"
20043-200430330 = "Рядом с тобой мне было совсем не холодно."
20043-200430340 = "Мне тоже!"
20043-200430350 = "Как странно."
20043-200430360 = "Когда я с вами, каждый день чувствуется по-новому."
20043-200430370 = "Как будто я пробую новое блюдо!"
20043-200430380 = "Давайте снова"
20043-200430390 = "отправимся в гастрономическое приключение!"
20043-200430400 = "Если можно, лучше бы обычное приключение..."
20043-200430410 = "А?"
20043-200430420 = "Хорошо!"
20043-200430430 = "Тогда вы будете в обычном приключении!"
20043-200430440 = "Спокойной ночи, Сенсей."
20043-200430450 = "Спокойной ночи, Изуми."
20043-200430460 = "Да!"