[translation]
20043-200430010 = "Вкусного Нового года, Сенсей!"
20043-200430020 = "Ага. И тебя с Новым годом, Изуми."
20043-200430030 = "Кстати, Сенсей."
20043-200430040 = "Сейчас ведь Новый год, да?"
20043-200430050 = "Что самое важное в новом году?"
20043-200430060 = "А ты как думаешь, Изуми?"
20043-200430070 = "Ну конечно..."
20043-200430080 = "Еда с новыми вкусами в честь нового года!"
20043-200430090 = "А что ты обычно ешь на Новый год, Сенсей?"
20043-200430100 = "Да что под руку попадётся, наверное?"
20043-200430110 = "Разве что заказываю какую-нибудь особую новогоднюю еду?"
20043-200430120 = "Вот как...?"
20043-200430130 = "Но если на Новый год есть что-нибудь особенное, становишься гораздо счастливее."
20043-200430140 = "Ого."
20043-200430150 = "Значит, ты тоже так делаешь, Сенсей"
20043-200430160 = "Кстати об этом..."
20043-200430170 = "Я приготовила новогоднее блюдо"
20043-200430180 = "которое хотела тебе показать!"
20043-200430190 = "Сенсей"
20043-200430200 = "Ты свободен сегодня днём?"
20043-200430210 = "Да, вроде свободен. А что?"
20043-200430220 = "Дело в том, что меня беспокоило,"
20043-200430230 = "что в прошлый раз тебе не удалось вдоволь насладиться едой."
20043-200430240 = "Тебе не нужно об этом переживать."
20043-200430250 = "Но меня всё равно это беспокоит!"
20043-200430260 = "Так что"
20043-200430270 = "Я долго думала..."
20043-200430280 = "и попробовала кое-что приготовить."
20043-200430290 = "Тогда увидимся после обеда!"
20043-200430300 = "Спасибо, что проводили меня, Сенсей!"
20043-200430310 = "В любое время."
20043-200430320 = "Но вам, должно быть, было холодно!"
20043-200430330 = "Рядом с тобой мне совсем не было холодно, Изуми."
20043-200430340 = "Мне тоже!"
20043-200430350 = "Потрясающе, правда?"
20043-200430360 = "Каждое мгновение с вами ощущается как совершенно новый опыт!"
20043-200430370 = "Как когда я нахожу новый вкус!"
20043-200430380 = "Давай скоро снова"
20043-200430390 = "отправимся в гастрономическое приключение!"
20043-200430400 = "Я предпочитаю обычные приключения..."
20043-200430410 = "Вот как?"
20043-200430420 = "Поняла!"
20043-200430430 = "Тогда обычное приключение, Сенсей!"
20043-200430440 = "Спокойной ночи!"
20043-200430450 = "Спокойной ночи, Изуми."
20043-200430460 = "Потом поговорим!"
