[translation]
20043-200430010 = "Feliz Ano-Novo~!"
20043-200430020 = "Feliz Ano-Novo, Izumi"
20043-200430030 = "O ano virou!"
20043-200430040 = "E falando em primeiro de janeiro... tem AQUILO!"
20043-200430050 = "O que você acha que é, Sensei?"
20043-200430060 = "Vindo da Izumi... comida?"
20043-200430070 = "Acertooou! Mas ó, não é qualquer comida comum, viu?"
20043-200430080 = "É aquela especial que só dá pra comer no Ano-Novo!"
20043-200430090 = "O que você costuma comer no Ano-Novo, Sensei?"
20043-200430100 = "Acho que não tenho nenhuma tradição fixa"
20043-200430110 = "Mas este ano eu encomendei uma tábua de frios e petiscos"
20043-200430120 = "Entendiii"
20043-200430130 = "Mas já que é Ano-Novo, é sempre legal comer alguma coisa especial, né?!"
20043-200430140 = "Boa, uma tábua de petiscos parece ótima!"
20043-200430150 = "Então você é do time que encomenda em vez de cozinhar, Sensei"
20043-200430160 = "Este ano, eu..."
20043-200430170 = "resolvi tentar preparar a ceia tradicional de Ano-Novo!"
20043-200430180 = "Eu ia ficar muito feliz se você viesse dar uma olhada, Sensei"
20043-200430190 = "Sensei"
20043-200430200 = "Você tem um tempinho mais tarde?"
20043-200430210 = "O que houve?"
20043-200430220 = "Sabe aquele Osechi Especial do outro dia?"
20043-200430230 = "Fiquei preocupada porque você quase não conseguiu comer nada"
20043-200430240 = "Ah, não precisa se preocupar com isso!"
20043-200430250 = "Eu me preocupo sim!"
20043-200430260 = "Eu queria muito que você tivesse provado..."
20043-200430270 = "Por isso, pra nossa aventura de hoje,"
20043-200430280 = "preparei uma surpresa superespecial!"
20043-200430290 = "Pode esperar pra ver!"
20043-200430300 = "Obrigada por me acompanhar até em casa, Sensei!"
20043-200430310 = "Por nada!"
20043-200430320 = "Mas você não passou um pouco de frio?"
20043-200430330 = "Como eu estava com você, Izumi, não senti frio nenhum"
20043-200430340 = "Nem eu!"
20043-200430350 = "É curioso, né?"
20043-200430360 = "Quando estou com você, Sensei, todo dia parece uma novidade fresquinha"
20043-200430370 = "Igualzinho a quando descubro um sabor novo!"
20043-200430380 = "Vamos sair juntos de novo"
20043-200430390 = "em outra aventura gastronômica!"
20043-200430400 = "Se possível, acho que prefiro uma aventura normal..."
20043-200430410 = "Ué?"
20043-200430420 = "Combinado!"
20043-200430430 = "Então pra você vai ser uma aventura normal, Sensei!"
20043-200430440 = "Boa noite, Sensei"
20043-200430450 = "Boa noite pra você também, Izumi"
20043-200430460 = "Sim!"
