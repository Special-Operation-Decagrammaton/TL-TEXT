[translation]
10057-100570010 = "Olá, Sensei."
10057-100570020 = "Como está passando estes dias com a chegada do Ano Novo?"
10057-100570030 = "Mais ou menos como sempre. E você, Haruna?"
10057-100570040 = "Hehe."
10057-100570050 = "Da minha parte, mesmo no fim de ano continuo na minha busca pela alta gastronomia como sempre, mas..."
10057-100570060 = "Na gastronomia, a estação e a atmosfera também são elementos essenciais."
10057-100570070 = "Ou seja, esta época de virada de ano..."
10057-100570080 = "É a oportunidade perfeita para se aventurar em sabores diferentes do habitual."
10057-100570090 = "E-entendi..."
10057-100570100 = "Não há necessidade de pensar nisso de forma tão complicada."
10057-100570110 = "Sendo assim, Sensei..."
10057-100570120 = "Poderia me fazer companhia por um instante?"
10057-100570130 = "C-como assim \"sendo assim\"...?!"
10057-100570140 = "Sensei."
10057-100570150 = "No trabalho, o que você considera mais importante: o resultado ou o processo?"
10057-100570160 = "Pergunta difícil, hein..."
10057-100570170 = "Acho que os dois são importantes..."
10057-100570180 = "Imaginei que diria isso."
10057-100570190 = "É claro que o resultado é fundamental."
10057-100570200 = "Mas nem por isso podemos dizer que o processo não tenha valor..."
10057-100570210 = "Acredito que o mesmo vale para o caminho da gastronomia."
10057-100570220 = "Talvez... seja?"
10057-100570230 = "Ufufu."
10057-100570240 = "Hoje, vamos explorar justamente esse processo."
10057-100570250 = "Pode aguardar com grandes expectativas."
10057-100570260 = "Sensei, muito obrigada pelo dia de hoje."
10057-100570270 = "Da próxima vez, sem falta, vamos desfrutar juntos da mais suprema gastronomia."
10057-100570280 = "Ufufu."
10057-100570290 = "Sensei."
10057-100570300 = "Você se lembra da nossa promessa de antes?"
10057-100570310 = "Lembro sim. De apreciarmos a suprema gastronomia, né?"
10057-100570320 = "Claro, a promessa de irmos pescar siri, né?"
10057-100570330 = "...?"
10057-100570340 = "Não sei com quem você está me confundindo, mas..."
10057-100570350 = "Falo da nossa busca pela suprema gastronomia. Embora caranguejo também não seja uma má ideia..."
10057-100570360 = "Acabei entrando em contato em cima da hora, mas você teria um tempinho mais tarde?"
10057-100570370 = "Pois bem, o horário e o local serão..."
