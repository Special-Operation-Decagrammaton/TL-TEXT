[translation]
10057-100570010 = "Здравствуйте, Сенсей."
10057-100570020 = "Ты готов к Новому году?"
10057-100570030 = "Жду с нетерпением. А ты, Харуна?"
10057-100570040 = "Хи-хи."
10057-100570050 = "В новом году я планирую продолжить своё гастрономическое путешествие..."
10057-100570060 = "Но время и атмосфера тоже важные составляющие гастрономии."
10057-100570070 = "В этот Новый год..."
10057-100570080 = "настанет время бросить вызов уникальной, революционной гурманской кухне."
10057-100570090 = "Звучит сложно..."
10057-100570100 = "Это только кажется."
10057-100570110 = "Хи-хи."
10057-100570120 = "Именно поэтому тебе стоит провести время со мной."
10057-100570130 = "Какая ещё причина?!"
10057-100570140 = "Сенсей."
10057-100570150 = "Что, по-твоему, важнее: средства или результат?"
10057-100570160 = "Сложный вопрос..."
10057-100570170 = "Мне кажется, важно и то и другое?"
10057-100570180 = "Понятно."
10057-100570190 = "Мир сосредоточен на результатах."
10057-100570200 = "Но я считаю, что важность процесса нельзя отбрасывать."
10057-100570210 = "Думаю, то же самое относится и к пути гурмана."
10057-100570220 = "Вот как...?"
10057-100570230 = "Хи-хи."
10057-100570240 = "Сегодняшняя встреча будет интересной."
10057-100570250 = "Мы будем исследовать «процесс»."
10057-100570260 = "В следующий раз..."
10057-100570270 = "мы вместе насладимся лучшей гурманской едой, Сенсей."
10057-100570280 = "Хи-хи."
10057-100570290 = "Сенсей..."
10057-100570300 = "Вы помните наше обещание?"
10057-100570310 = "Помню. Чтобы насладиться лучшей гурманской едой, верно?"
10057-100570320 = "Помню. Мы говорили, что будем ловить крабов, да?"
10057-100570330 = "...?"
10057-100570340 = "О чём ты говоришь?"
10057-100570350 = "Я сказала, что мы должны насладиться лучшей гурманской едой."
10057-100570360 = "Не могли бы вы сегодня прийти ко мне?"
10057-100570370 = "Буду ждать вас."
