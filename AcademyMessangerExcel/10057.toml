[translation]
10057-100570010 = "Здравствуйте, Сенсей."
10057-100570020 = "Как вы проводите время в преддверии Нового года?"
10057-100570030 = "Примерно как обычно. А у тебя, Харуна?"
10057-100570040 = "Хе-хе."
10057-100570050 = "У меня тоже ничего не изменилось — я по-прежнему исследую гастрономию, но..."
10057-100570060 = "В гастрономии сезон и атмосфера — тоже важные составляющие."
10057-100570070 = "То есть именно сейчас, в конце года,"
10057-100570080 = "отличная возможность попробовать что-то необычное."
10057-100570090 = "П-понятно..."
10057-100570100 = "Не нужно думать слишком сложно."
10057-100570110 = "Итак, Сенсей,"
10057-100570120 = "не уделите ли вы мне немного времени?"
10057-100570130 = "Что вы имеете в виду...!?"
10057-100570140 = "Сенсей."
10057-100570150 = "Как вы думаете, что важнее в работе — результат или процесс?"
10057-100570160 = "Сложный вопрос..."
10057-100570170 = "Наверное, и то и другое..."
10057-100570180 = "Я так и знала."
10057-100570190 = "Конечно, результат важен,"
10057-100570200 = "но нельзя сказать, что процесс бессмысленен..."
10057-100570210 = "Думаю, в гастрономии то же самое."
10057-100570220 = "Возможно..."
10057-100570230 = "Хе-хе-хе."
10057-100570240 = "Сегодня давайте исследуем этот процесс."
10057-100570250 = "Можете ждать с нетерпением."
10057-100570260 = "Спасибо за сегодня, Сенсей."
10057-100570270 = "В следующий раз насладимся лучшей гастрономией вместе."
10057-100570280 = "Хе-хе-хе."
10057-100570290 = "Сенсей."
10057-100570300 = "Помните наше обещание?"
10057-100570310 = "Помню. Насладиться лучшей гастрономией."
10057-100570320 = "Конечно, мы же договаривались о ловле крабов, верно?"
10057-100570330 = "...?"
10057-100570340 = "Не знаю, с кем вы меня путаете, но..."
10057-100570350 = "Речь шла о лучшей гастрономии. Крабы — это тоже хорошо, но..."
10057-100570360 = "Хотя я пишу в день встречи, не могли бы вы уделить время позже?"
10057-100570370 = "Насчёт времени и места..."
