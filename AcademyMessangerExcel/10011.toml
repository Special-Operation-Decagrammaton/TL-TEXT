[translation]
10011-808 = "O lanche de hoje aqui no Jardim da Flor de Ameixeira são frutas bem docinhas que ganhamos da Associação Comercial!"
10011-809 = "Pessoal, não se atrasem para a hora do lanche!"
10011-810 = "...Será que essa mensagem era pra mim mesmo?"
10011-811 = "O que achou do sabor, Sensei?"
10011-812 = "Estava uma delícia, obrigado!"
10011-813 = "Fufu, que bom que agradou ao seu paladar."
10011-814 = "Sempre preparamos lanchinhos por aqui, então venha visitar o Jardim da Flor de Ameixeira quando quiser!"
10011-815 = "Na verdade, hoje por volta do meio-dia,"
10011-816 = "vamos apresentar um teatro de fantoches para incentivar as crianças do Jardim da Flor de Ameixeira a escovarem os dentes direitinho."
10011-817 = "Teatro de fantoches? Parece divertido!"
10011-818 = "Sim!"
10011-819 = "É uma peça estilo Super Sentai onde os heróis derrotam as bactérias da cárie, e as crianças adoram todas as vezes."
10011-820 = "Só que estamos sem um assistente para fazer o papel da \"Cárie\" hoje..."
10011-821 = "Se não for incomodar, você poderia me ajudar, Sensei?"
10011-822 = "Eu não levo muito jeito pra atuar, mas..."
10011-823 = "Fufu, não se preocupe. Estarei bem ao seu lado para ajudar."
10011-824 = "Graças a você, Sensei, o teatro de fantoches foi um verdadeiro sucesso!"
10011-825 = "E você também não pode esquecer de escovar os dentes depois das refeições, viu, Sensei?"
10011-826 = "Sim, senhora Instrutora Shun!"
10011-827 = "Pode deixar, eu não sou mais criança..."
10011-828 = "Fufu, que menino bonzinho~ Brincadeirinha."
10011-829 = "Escovar os dentes é muito importante para os adultos também!"
10011-830 = "Vou fazer inspeções surpresa de vez em quando, então vê se não esquece!"
10011-831 = "Peço desculpas, não estou me sentindo muito bem hoje... Vou direto para casa sem passar no Jardim da Flor de Ameixeira."
10011-832 = "Você tá bem? Será que pegou um resfriado?"
10011-833 = "É apenas um leve mal-estar... Desculpe por deixá-lo preocupado."
10011-834 = "Cuide bem da sua saúde também, Sensei."
10011-835 = "Fufu, só de conversar com você já me sinto muito mais disposta, Sensei."
10011-836 = "Parece que, quando estou diante de você, acabo voltando a ser uma criança comum."
10011-837 = "Agora há pouco vi você fazendo uma brincadeira super divertida com as crianças do Jardim da Flor de Ameixeira..."
10011-838 = "Uma brincadeira divertida?"
10011-839 = "Aquela de segurar debaixo dos braços e levantar bem alto dizendo \"Upa, upa!\"!"
10011-840 = "Se não se importar, você poderia fazer comigo também?"
10011-841 = "Fazer isso com você não seria meio perigoso em vários sentidos, Shun...?"
10011-842 = "Não tem problema nenhum. Meu corpo é muito mais leve e flexível do que você imagina, Sensei."
10011-843 = "Fufu, na próxima vez que nos encontrarmos, vou cobrar, viu?"
10011-844 = "Muito obrigada por brincar sempre com as crianças do Jardim da Flor de Ameixeira, Sensei."
10011-845 = "Mas pode ter certeza de que ainda vou fazer você me levantar no \"Upa, upa!\" qualquer dia desses,"
10011-846 = "então não vá esquecer!"
10011-847 = "Mas eu já disse que fazer isso com você é perigoso em vários sentidos..."
10011-848 = "Sensei, você teria um tempinho livre hoje à tarde?"
10011-849 = "Tenho sim. O que houve?"
10011-850 = "Aqui no Jardim da Flor de Ameixeira entregamos presentes para os aniversariantes de cada mês,"
10011-851 = "mas eu sempre fico em dúvida na hora de escolher os presentes..."
10011-852 = "Se puder, você me ajudaria a escolher os presentes hoje?"
10011-853 = "Com certeza!"
10011-854 = "Fufu, muito obrigada."
10011-855 = "Então nos encontramos depois da aula no shopping do centro de Kivotos."
10011-856 = "Todas as crianças adoraram aquele bolo que você indicou, Sensei!"
10011-857 = "Muito obrigada por me apresentar uma confeitaria tão maravilhosa."
10011-858 = "Fico muito feliz em saber!"
10011-859 = "Conto com a sua ajuda na próxima vez também!"
10011-860 = "Sensei, por acaso você não anda se esforçando além da conta ultimamente?"
10011-861 = "Você parecia tão exausto..."
10011-862 = "Virei duas noites seguidas em claro, mas ainda aguento firme."
10011-863 = "(Sem resposta. Parece que já caiu no sono.)"
10011-864 = "Não está nada bem, não senhor...!"
10011-865 = "Se continuar nesse ritmo, vai acabar ficando seriamente doente!"
10011-866 = "Puxa vida! Se tiver dormido mesmo, menos mal, mas você ainda tá acordado, né...?!"
10011-867 = "O cansaço é a raiz de todas as doenças, então dormir bem é fundamental, ouviu?"
10011-868 = "Fufu, está se sentindo um pouco melhor agora, Sensei?"
10011-869 = "Sim, graças a você estou novinho em folha."
10011-870 = "Sempre que o cansaço apertar de novo, dê uma passadinha no Jardim da Flor de Ameixeira."
10011-871 = "Vou deixar um futon estendido escondidinho para ninguém descobrir. Fufu..."
