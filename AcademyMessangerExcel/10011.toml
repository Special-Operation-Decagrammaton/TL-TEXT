[translation]
10011-808 = "Сегодняшнее угощение в Саду цветущей сливы — сладкие фрукты, которые мы получили от торговой палаты."
10011-809 = "Все, не опаздывайте, приходите!"
10011-810 = "...Это сообщение действительно для меня?"
10011-811 = "Как вам понравилось, Сенсей?"
10011-812 = "Было вкусно, спасибо."
10011-813 = "Хе-хе, я рада, что вам пришлось по вкусу."
10011-814 = "Я ещё приготовлю угощение, так что заходите в Сад цветущей сливы в любое время!"
10011-815 = "Кстати, сегодня около полудня"
10011-816 = "мы планируем устроить кукольный спектакль, чтобы дети из Сада цветущей сливы охотнее чистили зубы."
10011-817 = "Кукольный спектакль, звучит весело."
10011-818 = "Да."
10011-819 = "Это спектакль в стиле супергероев, которые побеждают злых бактерий кариеса, реакция всегда отличная."
10011-820 = "Только вот сейчас нет помощника, который бы сыграл роль «кариеса»..."
10011-821 = "Если вы не против, не поможете ли нам, Сенсей?"
10011-822 = "Я не уверен в своих актёрских способностях..."
10011-823 = "Хе-хе, не волнуйтесь. Я буду рядом, помогу."
10011-824 = "Благодаря вам, Сенсей, мы успешно провели кукольный спектакль!"
10011-825 = "И вы, Сенсей, не забывайте чистить зубы после еды!"
10011-826 = "Так точно, инструктор Шун!"
10011-827 = "Я ведь не ребёнок..."
10011-828 = "Хе-хе, какой послушный. Но для взрослых это тоже важно!"
10011-829 = "Я буду проводить внезапные проверки, так что не забывайте!"
10011-830 = "Извините, я плохо себя чувствую... не зайду в Сад цветущей сливы, позвольте мне сразу уйти."
10011-831 = "Ты в порядке? Может, простудилась?"
10011-832 = "Просто немного нехорошо... извините за беспокойство."
10011-833 = "Сенсей, тоже берегите своё здоровье."
10011-834 = "Хе-хе, когда я говорила с вами, у меня поднялось настроение."
10011-835 = "Перед вами я словно снова становлюсь обычным ребёнком."
10011-836 = "Я только что видела, как дети из Сада цветущей сливы делали кое-что забавное..."
10011-837 = "Что-то забавное?"
10011-838 = "Ту игру, когда поднимают высоко, подхватив под мышки — «такай-такай»!"
10011-839 = "Если вы не против, не сделаете ли вы это со мной?"
10011-840 = "Но с Шун это может быть опасно..."
10011-841 = "Всё в порядке. Я более гибкая, чем вы думаете."
10011-842 = "Хе-хе, когда мы встретимся в следующий раз, я обязательно попрошу вас об этом."
10011-843 = "Спасибо, что всегда играете с детьми из Сада цветущей сливы, Сенсей."
10011-844 = "Но «такай-такай» вы мне обязательно сделаете, когда-нибудь."
10011-845 = "Не забывайте!"
10011-846 = "Потому что с Шун это опасно по многим причинам..."
10011-847 = "Сенсей, у вас есть время сегодня после обеда?"
10011-848 = "Да, в порядке. А что?"
10011-849 = "В Саду цветущей сливы мы каждый месяц дарим подарки детям, у которых день рождения."
10011-850 = "Но я каждый раз мучаюсь с выбором подарка..."
10011-851 = "Если вы не против, не поможете ли мне сегодня выбрать подарок?"
10011-852 = "Конечно."
10011-853 = "Хе-хе, спасибо."
10011-854 = "Тогда встречаемся после уроков в торговом центре в городе Кивотос."
10011-855 = "Тот торт, который вы посоветовали, всем очень понравился."
10011-856 = "Спасибо, что познакомили с таким хорошим магазином."
10011-857 = "Я рад, что понравилось."
10011-858 = "Обязательно обратимся к вам и в следующий раз!"
10011-859 = "Сенсей, вы, случайно, не переутомляетесь в последнее время?"
10011-860 = "Вы выглядели уставшим..."
10011-861 = "Хотя я не спал вторую ночь подряд, я пока в порядке."
10011-862 = "(Ответа нет. Похоже, уже заснул.)"
10011-863 = "Вот это не порядок...!"
10011-864 = "Если так продолжится, вы можете серьёзно заболеть!"
10011-865 = "Ну всё! Если вы действительно заснули, это хорошо, но ведь вы не спите...!?"
10011-866 = "Усталость — причина всех болезней, так что крепкий сон очень важен, понятно?"
10011-867 = "Хе-хе, вам стало немного легче, Сенсей?"
10011-868 = "Да, благодаря вам я чувствую себя намного лучше."
10011-869 = "Если вам снова станет тяжело, всегда заходите в Сад цветущей сливы."
10011-870 = "Я тайком постелю вам постель, чтобы никто не заметил. Хе-хе..."
10011-871 = "みんなにはバレないよう、こっそり布団を敷いておきますので。ふふっ……"
