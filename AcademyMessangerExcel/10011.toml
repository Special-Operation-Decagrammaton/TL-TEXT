[translation]
10011-808 = "Все, сегодня на полдник в Саду цветущей сливы будут сладкие фрукты, которые я привезла с Променада."
10011-809 = "Так что обязательно приходите на полдник и НЕ опаздывайте!"
10011-810 = "...Ты точно хотела отправить это мне?"
10011-811 = "Вам понравились фрукты, Сенсей?"
10011-812 = "Да. Было вкусно."
10011-813 = "Хи-хи, рада, что вам понравилось."
10011-814 = "Завтра приготовлю для вас ещё сладостей, так что заходите в Сад цветущей сливы почаще!"
10011-815 = "Сенсей, сегодня после обеда..."
10011-816 = "Мы устраиваем кукольный спектакль, чтобы научить студентов Сада цветущей сливы чистить зубы."
10011-817 = "Кукольный спектакль звучит... весело."
10011-818 = "Да."
10011-819 = "Это вроде спектакля в стиле сэнтай про победу над бактериями кариеса, и студентам он очень нравится!"
10011-820 = "Но сегодня у нас нет инструктора, который сыграет роль кариеса..."
10011-821 = "Не могли бы вы нам помочь?"
10011-822 = "Я не особо актёр..."
10011-823 = "Хи-хи, ничего страшного. Я буду рядом и помогу."
10011-824 = "Благодаря вашей помощи спектакль удался! Хи-хи."
10011-825 = "Не забывайте чистить зубы после каждого приёма пищи, Сенсей!"
10011-826 = "Да, инструктор Шун!"
10011-827 = "Хотя я уже не ребёнок..."
10011-828 = "Хи-хи, вы отлично справились."
10011-829 = "Взрослым тоже важно чистить зубы!"
10011-830 = "В следующий раз проверю вас на кариес, так что до тех пор следите за гигиеной!"
10011-831 = "Сегодня я не очень хорошо себя чувствую... Придётся пропустить Сад цветущей сливы и сразу пойти домой."
10011-832 = "Ты простудилась или что-то такое?"
10011-833 = "Нет, просто немного нездоровится... Не волнуйтесь."
10011-834 = "Вы тоже берегите себя, Сенсей."
10011-835 = "Хи-хи. Теперь, когда я поговорила с вами, мне намного лучше."
10011-836 = "Почему-то рядом с вами я забываю о возрасте и сама становлюсь как ребёнок."
10011-837 = "Сенсей, я видела, как вы раньше играли во что-то весёлое со студентами Сада цветущей сливы..."
10011-838 = "Во что-то весёлое?"
10011-839 = "В ту игру, где вы берёте их за руки и поднимаете высоко-высоко... Кажется, она называется «Выше и выше»."
10011-840 = "Если вы не против... можете так же поиграть со мной?"
10011-841 = "Разве это не будет для тебя немного опасно, Шун...?"
10011-842 = "Со мной всё будет хорошо. Я куда гибче, чем вы думаете."
10011-843 = "Хи-хи, расскажу подробности лично."
10011-844 = "Спасибо, что всегда проводите время со студентами Сада цветущей сливы, Сенсей."
10011-845 = "Но в следующий раз вы обязательно должны дать и мне поиграть в «Выше и выше»."
10011-846 = "Будьте готовы, Сенсей!"
10011-847 = "Я же уже сказал, что для тебя это слишком опасно, Шун..."
10011-848 = "Сенсей, вы свободны сегодня после обеда?"
10011-849 = "Да. Что случилось?"
10011-850 = "Каждый месяц Сад цветущей сливы дарит подарки детям, у которых день рождения."
10011-851 = "Так часто выбирать подарки непросто."
10011-852 = "Если вы не против, поможете мне выбрать подарки в универсальном магазине?"
10011-853 = "Конечно."
10011-854 = "Хи-хи. Тогда хорошо."
10011-855 = "Увидимся после уроков в торговом центре в центре Кивотоса."
10011-856 = "Всем понравился торт из магазина, который вы мне посоветовали."
10011-857 = "Спасибо, что познакомили меня с этим магазином."
10011-858 = "Рад, что вам понравилось."
10011-859 = "Да, в следующий раз тоже буду на вас рассчитывать!"
10011-860 = "Сенсей, вам не кажется, что в последнее время вы слишком много работаете?"
10011-861 = "Вы выглядите таким уставшим..."
10011-862 = "Я две ночи подряд не спал, но пока держусь."
10011-863 = "(Я не ответил. Я уже засыпал.)"
10011-864 = "Пожалуйста, не говорите так."
10011-865 = "Так можно серьёзно заболеть!"
10011-866 = "Правда! Не шутите такими вещами!"
10011-867 = "Усталость - причина большинства болезней, поэтому важно хорошо высыпаться."
10011-868 = "Хи-хи. Вы отдохнули, Сенсей?"
10011-869 = "Да, после сна мне определённо стало намного лучше."
10011-870 = "В следующий раз, если начнёте засыпать на работе, приходите в Сад цветущей сливы."
10011-871 = "Я постелю вам отдельный мат, чтобы другие студенты не узнали. Хи-хи..."
