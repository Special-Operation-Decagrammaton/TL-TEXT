[translation]
20052-200520010 = "Небольшой тест. Из следующего списка"
20052-200520020 = "выберите, что должен сделать Издательский отдел,"
20052-200520030 = "чтобы выжить в Красной Зиме. (4 балла)"
20052-200520040 = "1. Поощрять грамотность"
20052-200520050 = "2. Перевести письменные материалы в цифровой формат"
20052-200520060 = "3. Провести линии связи"
20052-200520070 = "Как пункт №3 связан с издательством?"
20052-200520080 = "Отвечайте на вопрос"
20052-200520090 = "Не знаю..."
20052-200520100 = "Неверно. Как я и предполагала,"
20052-200520110 = "правильный ответ — 3"
20052-200520120 = "А...?"
20052-200520130 = "Если хотите получить более подробные ответы, обращайтесь в"
20052-200520140 = "Издательский отдел Красной Зимы!"
20052-200520150 = "Готовьтесь к «Дадаистскому трактату об Издательском отделе Красной Зимы"
20052-200520160 = "в исторической и тайной встрече с Шале»"
20052-200520170 = "Как вам такое название?"
20052-200520180 = "Это слишком!"
20052-200520190 = "Я думала, длина подчёркивает его значимость"
20052-200520200 = "Я даже думала напечатать об этом отдельный материал..."
20052-200520210 = "Давайте во время твоего визита представителем студентов обойдёмся чем-нибудь обычным..."
20052-200520220 = "Сенсей"
20052-200520230 = "Вы говорили, что сегодня покидаете Красную Зиму, верно?"
20052-200520240 = "Ага. Поеду обратно на поезде."
20052-200520250 = "Правда...?"
20052-200520260 = "На поезде НАШЕЙ школы...?"
20052-200520270 = "? А что-то не так?"
20052-200520280 = "М-м-м..."
20052-200520290 = "Ну..."
20052-200520300 = "Я вас провожу. Как вам?"
20052-200520310 = "Вы благополучно добрались, Сенсей?"
20052-200520320 = "Я прекрасно провела время, и всё благодаря вам."
20052-200520330 = "Приятно слышать."
20052-200520340 = "Но, если подумать, мне кажется очевидным, что корень проблемы"
20052-200520350 = "в ужасном расписании поездов нашей академии."
20052-200520360 = "Погодите-ка."
20052-200520370 = "Значит, если железная дорога Красной Зимы и дальше будет ужасной,"
20052-200520380 = "вы снова возьмёте меня в поездку на поезде?"
20052-200520390 = "Да ладно."
20052-200520400 = "Ну конечно..."
20052-200520410 = "Ты там?"
20052-200520420 = "Сенсей? Ответьте, пожалуйста."
20052-200520430 = "Я зде-е-есь."
20052-200520440 = "Хорошо"
20052-200520450 = "У меня дело"
20052-200520460 = "Нет,"
20052-200520470 = "по работе Издательского отдела"
20052-200520480 = "для которого нужна консультация"
20052-200520490 = "и компетентное мнение со стороны"
20052-200520500 = "Ты хочешь, чтобы я пришёл в Издательский отдел?"
20052-200520510 = "Хм?"
20052-200520520 = "Да."
20052-200520530 = "Именно это я и имела в виду. Спасибо."
20052-200520540 = "Краткий стиль речи..."
20052-200520550 = "Мне тоже стоит его практиковать."
20052-200520560 = "Сенсей?"
20052-200520570 = "Почему"
20052-200520580 = "Я ПРОДАЮ ТАК МНОГО?"
20052-200520590 = "Хорошие вещи случаются,"
20052-200520600 = "когда слушаешь опытного взрослого."
20052-200520610 = "Это бесит..."
20052-200520620 = "Но с цифрами не поспоришь"
20052-200520630 = "М-м-м..."
20052-200520640 = "Я хотела спросить, могу ли взять интервью у великого Сенсея"
20052-200520650 = "для следующего материала в «Красном Медведе»."
20052-200520660 = "С уважением отказываюсь, главный редактор."
20052-200520670 = "Я так и думала..."
20052-200520680 = "Но всё равно мне придётся время от времени навещать вас"
20052-200520690 = "будь то ради редакционного вдохновения"
20052-200520700 = "...или просто так."
20052-200520710 = "Заходи когда угодно."
20052-200520720 = "Знаменитые последние слова."
