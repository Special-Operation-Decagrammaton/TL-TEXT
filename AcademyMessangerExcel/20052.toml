[translation]
20052-200520010 = "Вопрос:"
20052-200520020 = "Что из перечисленного издательский отдел должен предпринять"
20052-200520030 = "для выживания в Красной Зиме? (4 балла)"
20052-200520040 = "1. Организовать неделю просвещения чтения"
20052-200520050 = "2. Запустить проект по электронным книгам"
20052-200520060 = "3. Провести работы по прокладке линий связи"
20052-200520070 = "Последнее ведь не связано с издательским отделом...?"
20052-200520080 = "Это ваш окончательный ответ?"
20052-200520090 = "Эй... сдаюсь."
20052-200520100 = "Му-фу-фу, так и думала."
20052-200520110 = "Правильный ответ — третий."
20052-200520120 = "Хм...?"
20052-200520130 = "Если хотите объяснение,"
20052-200520140 = "обращайтесь в издательский отдел Красной Зимы."
20052-200520150 = "«Дадаистский тезис об исторической встрече издательского отдела Красной Зимы"
20052-200520160 = "и Шале в частной сфере»."
20052-200520170 = "Это название следующей статьи. Как вам?"
20052-200520180 = "Тяжело!"
20052-200520190 = "В честь памятного дня визита в Шале"
20052-200520200 = "я планировала сделать большой спецвыпуск,"
20052-200520210 = "но я просто пришла на дежурство..."
20052-200520220 = "Сенсей"
20052-200520230 = "Ваша командировка в Красную Зиму ведь заканчивается сегодня, верно?"
20052-200520240 = "Да, я как раз сажусь на поезд обратно."
20052-200520250 = "Что?"
20052-200520260 = "На поезд Красной Зимы...?"
20052-200520270 = "Какие-то проблемы?"
20052-200520280 = "Хм-м..."
20052-200520290 = "Короче,"
20052-200520300 = "позвольте мне вас проводить."
20052-200520310 = "Вы уже добрались до дома?"
20052-200520320 = "Мне было весело сегодня, благодаря вам."
20052-200520330 = "Хорошо!"
20052-200520340 = "Если подумать, корень проблемы,"
20052-200520350 = "наверное, в расписании, но"
20052-200520360 = "Ой"
20052-200520370 = "Если железная дорога Красной Зимы никогда не заработает,"
20052-200520380 = "то получается, вы навсегда будете составлять мне компанию в поездках...?"
20052-200520390 = "Ну уж нет."
20052-200520400 = "Понятно..."
20052-200520410 = "Вы здесь?"
20052-200520420 = "Сенсей"
20052-200520430 = "Да, я здесь~"
20052-200520440 = "Хорошо."
20052-200520450 = "По делу,"
20052-200520460 = "нет,"
20052-200520470 = "по издательскому отделу"
20052-200520480 = "я хотела бы посоветоваться,"
20052-200520490 = "мне нужно мнение со стороны."
20052-200520500 = "Я приду в издательский отдел!"
20052-200520510 = "Что?"
20052-200520520 = "Да."
20052-200520530 = "Спасибо вам."
20052-200520540 = "Эта ваша манера говорить чётко и по делу"
20052-200520550 = "мне тоже стоит перенять."
20052-200520560 = "Сенсей"
20052-200520570 = "Почему"
20052-200520580 = "это так хорошо продаётся?"
20052-200520590 = "Получилось!"
20052-200520600 = "Как я и предполагала!"
20052-200520610 = "Что-то обидно."
20052-200520620 = "Но результат есть результат."
20052-200520630 = "Хм-м"
20052-200520640 = "В следующий раз я хочу взять у вас специальное интервью «Красный медведь»"
20052-200520650 = "и сделать совместный номер с вами~"
20052-200520660 = "Вежливо отказываюсь, главный редактор."
20052-200520670 = "Я так и знала."
20052-200520680 = "В любом случае, буду рассчитывать на вас и дальше."
20052-200520690 = "По деловым вопросам"
20052-200520700 = "или по другим поводам."
20052-200520710 = "Всегда приходи."
20052-200520720 = "Да, я так и сделаю. Му-фу-фу."