[translation]
20052-200520010 = "Questão:"
20052-200520020 = "Dentre as alternativas abaixo, para sobreviver em Red Winter,"
20052-200520030 = "qual medida o Departamento de Publicação deve tomar? (Vale 4 pontos)"
20052-200520040 = "1. Criar uma Semana de Incentivo à Leitura"
20052-200520050 = "2. Avançar com um projeto de livros digitais"
20052-200520060 = "3. Realizar obras de infraestrutura nas linhas de comunicação"
20052-200520070 = "A última opção não tem nada a ver com o Departamento de Publicação, né...?"
20052-200520080 = "Essa é a sua resposta final?"
20052-200520090 = "Hãã... Eu desisto"
20052-200520100 = "Mufufu, imaginei que diria isso"
20052-200520110 = "Afinal, a resposta correta é a número 3"
20052-200520120 = "Hã...?"
20052-200520130 = "Caso deseje conferir a resolução comentada,"
20052-200520140 = "sinta-se à vontade para visitar o Departamento de Publicação de Red Winter"
20052-200520150 = "'Uma Tese Dadaísta Sobre o Encontro Histórico em que o Departamento de Publicação de Red Winter"
20052-200520160 = "Estabelece Contato com a Schale na Esfera Privada'"
20052-200520170 = "É o título do meu próximo artigo. O que acha?"
20052-200520180 = "Pesado demais!"
20052-200520190 = "Eu pretendia aproveitar esta data memorável de visita à Schale"
20052-200520200 = "para montar uma grande matéria especial, mas..."
20052-200520210 = "Venha só cumprir o plantão normalmente, por favor..."
20052-200520220 = "Sensei"
20052-200520230 = "A sua viagem de trabalho a Red Winter terminava hoje, certo?"
20052-200520240 = "Sim. Estou prestes a pegar o trem de volta"
20052-200520250 = "Como é?"
20052-200520260 = "O trem de Red Winter, você disse...?"
20052-200520270 = "Tem algum problema com ele?"
20052-200520280 = "Hmm..."
20052-200520290 = "Por ora,"
20052-200520300 = "deixe que eu o acompanhe até a estação"
20052-200520310 = "Já chegou em casa?"
20052-200520320 = "Hoje foi muito divertido graças a você, Sensei"
20052-200520330 = "Que bom!"
20052-200520340 = "Pensando bem, sinto que a raiz do problema"
20052-200520350 = "está na tabela de horários dos trens, mas..."
20052-200520360 = "Ora, ora"
20052-200520370 = "Se a ferrovia de Red Winter continuasse um caos para sempre,"
20052-200520380 = "será que o Sensei me faria companhia nessa viagem de trem pela eternidade...?"
20052-200520390 = "Aí já é pedir demais"
20052-200520400 = "Imaginei..."
20052-200520410 = "Está por aí,"
20052-200520420 = "Sensei?"
20052-200520430 = "Estou sim~"
20052-200520440 = "Certo"
20052-200520450 = "Sobre os negócios..."
20052-200520460 = "Quer dizer,"
20052-200520470 = "sobre o Departamento de Publicação,"
20052-200520480 = "eu gostaria de pedir um conselho, ou melhor,"
20052-200520490 = "ouvir a opinião imparcial de uma terceira pessoa"
20052-200520500 = "Estou indo para o Departamento de Publicação!"
20052-200520510 = "Hã?"
20052-200520520 = "Sim,"
20052-200520530 = "muito obrigada"
20052-200520540 = "Essa sua retórica de ir direto à conclusão com tanta clareza..."
20052-200520550 = "Preciso aprender com você"
20052-200520560 = "Sensei"
20052-200520570 = "Por que"
20052-200520580 = "isto aqui está vendendo tão bem?"
20052-200520590 = "Deu supercerto!"
20052-200520600 = "Exatamente como eu previ!"
20052-200520610 = "Confesso que dá uma pontinha de frustração,"
20052-200520620 = "mas resultado é resultado"
20052-200520630 = "Hmm..."
20052-200520640 = "Na próxima edição da 'Red Bear', eu gostaria de montar"
20052-200520650 = "uma matéria especial de entrevista exclusiva com o Sensei~"
20052-200520660 = "Recuso educadamente, Editora-Chefe"
20052-200520670 = "Eu sabia que diria isso"
20052-200520680 = "Bom, continuo contando com o seu apoio daqui para frente"
20052-200520690 = "Seja para consultoria de negócios"
20052-200520700 = "ou para qualquer outra coisa,"
20052-200520710 = "apareça para passear quando quiser"
20052-200520720 = "Sim, farei exatamente isso, no sentido literal da palavra. Mufufu"
