[translation]
26001-1558 = "Сенсей, Сенсей."
26001-1559 = "Есть ли у вас что-то, что вы всегда цените?"
26001-1560 = "Сходу ничего не приходит в голову..."
26001-1561 = "А что-то, что вы особенно любите и собираете?"
26001-1562 = "Есть ли у вас любимая вещь, которую вы носите с собой весь день?"
26001-1563 = "Что-то, что вы постоянно носите с собой и без чего чувствуете беспокойство?"
26001-1564 = "У меня нет ничего, к чему я был бы так привязан..."
26001-1565 = "Вот как... Сложно."
26001-1566 = "Что именно сложно?"
26001-1567 = "Нет, ничего."
26001-1568 = "Сенсей, вы знаете страшную историю про «телефон Мери»?"
26001-1569 = "Наверное, не слышал."
26001-1570 = "Однажды девушке звонит кукла по имени Мери, которую она когда-то выбросила."
26001-1571 = "Страшно то, что с каждым звонком Мери приближается..."
26001-1572 = "Вот это история... А почему ты вдруг о ней вспомнила?"
26001-1573 = "Особой причины нет, просто так."
26001-1574 = "...Если отследить источник звонка, можно узнать, где находится Мери."
26001-1575 = "Хотелось бы, чтобы Мери позвонила мне на телефон."
26001-1576 = "Страшно..."
26001-1577 = "Сенсей, вам случайно не звонили странные люди в последнее время?"
26001-1578 = "Например, звонил кто-то страшный или с подозрительными словами..."
26001-1579 = "Вроде бы нет, а что?"
26001-1580 = "Понимаете..."
26001-1581 = "Нет, я скажу позже при личной встрече."
26001-260010010 = "...Ах"
26001-260010020 = "Что случилось?"
26001-260010030 = "Я встала, не отключив наушники от компьютера, и чуть не упала."
26001-260010040 = "Такое часто бывает, когда увлекаешься."
26001-260010050 = "Да. Слух легко привыкает к повторяющимся раздражителям."
26001-260010060 = "А какую музыку ты обычно слушаешь, Котама?"
26001-260010070 = "Музыка, которую я слушаю..."
26001-260010080 = "Ну, это..."
26001-260010090 = "..."
26001-260010100 = "Секрет."
26001-260010110 = "Почему!?"