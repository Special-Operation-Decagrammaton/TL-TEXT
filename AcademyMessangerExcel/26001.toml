[translation]
26001-1558 = "Sensei, Sensei."
26001-1559 = "Você tem algum objeto que guarda com muito carinho o tempo todo?"
26001-1560 = "Assim de cabeça, acho que não tenho nada..."
26001-1561 = "E algo de que você goste muito e colecione?"
26001-1562 = "Ou algum item favorito que você carregue consigo o dia inteiro?"
26001-1563 = "Não tem nada que você nunca desgrude e que te deixe ansioso se ficar longe nem que seja por um instante?"
26001-1564 = "Acho que não tenho nada a que eu seja tão apegado assim..."
26001-1565 = "Entendo... Que difícil."
26001-1566 = "O que é difícil?"
26001-1567 = "Não, não é nada."
26001-1568 = "Sensei, você conhece a lenda urbana do 'Telefonema da Mary-san'?"
26001-1569 = "Acho que nunca ouvi falar."
26001-1570 = "Uma garota começa a receber ligações de uma boneca chamada Mary, que ela havia jogado fora anos atrás."
26001-1571 = "O assustador é que, a cada ligação, a Mary-san vai chegando cada vez mais perto..."
26001-1572 = "Então é assim a história... Mas por que resolveu contar essa história de terror do nada?"
26001-1573 = "Por nada em especial, só lembrei."
26001-1574 = "...Se rastrearmos o sinal dessa ligação, dá para descobrir a localização exata da Mary-san."
26001-1575 = "Bem que a Mary-san podia ligar para o meu celular, né?"
26001-1576 = "Que medo..."
26001-1577 = "Sensei, por acaso você não recebeu nenhuma ligação estranha ultimamente?"
26001-1578 = "Alguma chamada de alguém assustador, ou com algum conteúdo suspeito..."
26001-1579 = "Acho que não, mas por quê?"
26001-1580 = "Na verdade..."
26001-1581 = "Não, mais tarde eu te conto pessoalmente."
26001-260010010 = "...Ah."
26001-260010020 = "O que houve?"
26001-260010030 = "Levantei com o fone ainda conectado no computador e quase levei um tombo."
26001-260010040 = "Quando a gente tá concentrado, isso acontece direto, né?"
26001-260010050 = "Sim. A audição se acostuma facilmente a estímulos repetitivos."
26001-260010060 = "Que tipo de música você costuma ouvir, Kotama?"
26001-260010070 = "A música que eu costumo ouvir..."
26001-260010080 = "Hum, isso é..."
26001-260010090 = "..."
26001-260010100 = "É segredo."
26001-260010110 = "Por quê?!"
