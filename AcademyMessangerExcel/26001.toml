[translation]
26001-1558 = "Сенсей! Сенсей!"
26001-1559 = "Есть что-то, что вам особенно нравится?"
26001-1560 = "Очень широкий вопрос..."
26001-1561 = "Например, что-то, что вы коллекционируете?"
26001-1562 = "Или что-то, что носите с собой весь день?"
26001-1563 = "Такое, что если забудете, будете весь день тревожиться?"
26001-1564 = "Не особо..."
26001-1565 = "Правда? Тогда это может всё усложнить..."
26001-1566 = "Что усложнить?"
26001-1567 = "Неважно."
26001-1568 = "Слышали страшилку под названием «Звонок Мэри», Сенсей?"
26001-1569 = "Никогда не слышал."
26001-1570 = "«Звонок Мэри» — страшная история о девочке с куклой по имени Мэри. Когда девочка выбрасывает куклу, та начинает ей звонить."
26001-1571 = "Самое страшное, что с каждым звонком Мэри оказывается всё ближе к девочке. В конце кукла появляется прямо у неё за спиной."
26001-1572 = "И зачем ты мне это рассказываешь?"
26001-1573 = "Не знаю. Мне просто стало интересно, слышали ли вы её."
26001-1574 = "Если отследить звонки, интересно, можно ли увидеть, откуда звонит Мэри?"
26001-1575 = "Хотела бы я, чтобы Мэри когда-нибудь позвонила мне."
26001-1576 = "Как жутко!"
26001-1577 = "В последнее время вам не поступали странные звонки?"
26001-1578 = "Например, какой-нибудь подозрительный человек не говорил вам чего-то страшного?"
26001-1579 = "Не припоминаю. А что?"
26001-1580 = "На самом деле..."
26001-1581 = "Неважно. Расскажу в следующий раз."
26001-260010010 = "...Итак."
26001-260010020 = "Что случилось?"
26001-260010030 = "Ну... Я чуть не упала, когда вставала со стула. Но только потому, что наушники были подключены к компьютеру."
26001-260010040 = "Наверное, в этом и опасность слишком хорошей музыки."
26001-260010050 = "Да, человеческий слух удивительно уязвим к повторяющимся раздражителям."
26001-260010060 = "Кстати, какую музыку вы вообще слушаете?"
26001-260010070 = "Какую музыку я слушаю?"
26001-260010080 = "Ну, это..."
26001-260010090 = "..."
26001-260010100 = "Это секрет."
26001-260010110 = "Почему?!"
