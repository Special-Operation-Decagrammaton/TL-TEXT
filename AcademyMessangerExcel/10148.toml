[translation]
10148-101480010 = "Сенсей."
10148-101480020 = "Мне дали немного выходных."
10148-101480030 = "Ого! Поздравляю!"
10148-101480040 = "Даже завидую!"
10148-101480050 = "Поэтому с нетерпением жду нашей встречи."
10148-101480060 = "А?"
10148-101480070 = "Сенсей."
10148-101480080 = "Я, конечно, не удивлена, но вы и правда удивительный человек..."
10148-101480090 = "Никогда не думала, что вы заставите меня надеть купальник прямо у себя в кабинете."
10148-101480100 = "Зачем ты такое выдумываешь?!"
10148-101480110 = "Ты вообще зачем взяла с собой купальник?"
10148-101480120 = "И откуда он у тебя взялся?!"
10148-101480130 = "Алло? Ироха?"
10148-101480140 = "Алло...?"
10148-101480150 = "Сенсей."
10148-101480160 = "Вы сейчас в Шале?"
10148-101480170 = "Да, но..."
10148-101480180 = "Только не надо... Опять... Прошу...?"
10148-101480190 = "Что?"
10148-101480200 = "А, мой купальник. Раз вы так настаиваете, я его принесу."
10148-101480210 = "Я! Совсем! Не это! Имел в виду!"
10148-101480220 = "Но это неважно..."
10148-101480230 = "Пожалуйста, приезжай сюда на Торамару."
10148-101480240 = "...?"
10148-101480250 = "Конечно, смогу."
10148-101480260 = "Ничего себе."
10148-101480270 = "Сегодня был насыщенный день."
10148-101480280 = "Вот что я называю удачным выходным."
10148-101480290 = "Ну, если ты довольна..."
10148-101480300 = "Вышло совсем не так, как я ожидал."
10148-101480310 = "Не забивайте себе голову."
10148-101480320 = "На выходных нужно пользоваться случаем и отдыхать!"
10148-101480330 = "Говоришь прямо как измученный работяга..."
10148-101480340 = "Сенсей."
10148-101480350 = "Хотите сбежать со мной?"
10148-101480360 = "Сенсей."
10148-101480370 = "Ещё не поздно. Хотите сбежать со мной?"
10148-101480380 = "Уф. Кто вообще так работает?"
10148-101480390 = "Скоро и у меня будет выходной!"
10148-101480400 = "В конце концов, следующее лето никто не отменял!"
10148-101480410 = "Что?"
10148-101480420 = "Вы просто хотите снова увидеть меня в купальнике, верно?"
10148-101480430 = "Я такого не говорил?!"
10148-101480440 = "...Не то чтобы я был против!"
10148-101480450 = "Угх..."
10148-101480460 = "вздо-о-ох"
10148-101480470 = "Постараемся изо всех сил...!"
10148-101480480 = "А."
10148-101480490 = "Ну..."
10148-101480500 = "Да."
