[translation]
10148-101480010 = "Спасибо за работу."
10148-101480020 = "Сегодня я выиграла выходной."
10148-101480030 = "Поздравляю!"
10148-101480040 = "Завидую!"
10148-101480050 = "Раз так, прошу вас."
10148-101480060 = "В смысле?"
10148-101480070 = "Я знала, но всё равно..."
10148-101480080 = "Надеть купальник в кабинете?"
10148-101480090 = "Это какой-то извращённый вкус."
10148-101480100 = "Я такое говорила!?"
10148-101480110 = "И вообще, почему у тебя с собой купальник?"
10148-101480120 = "Ты с самого начала это планировала?"
10148-101480130 = "А?"
10148-101480140 = "Эй."
10148-101480150 = "Спасибо за работу."
10148-101480160 = "Ты сейчас в Шале?"
10148-101480170 = "Да, но..."
10148-101480180 = "Неужели... опять?"
10148-101480190 = "Что?"
10148-101480200 = "А, купальник. Мне его взять, да?"
10148-101480210 = "На всякий случай, если есть..."
10148-101480220 = "Но вообще,"
10148-101480230 = "ты не могла бы приехать на Торамару?"
10148-101480240 = "...Зачем?"
10148-101480250 = "Ладно, без разницы."
10148-101480260 = "Ах."
10148-101480270 = "Сегодня я отлично провела время."
10148-101480280 = "Я очень довольна."
10148-101480290 = "Ну и хорошо, но..."
10148-101480300 = "это было не совсем то, что я ожидал..."
10148-101480310 = "Лежать и ничего не делать."
10148-101480320 = "В выходной лучше этого ничего нет."
10148-101480330 = "Совсем как уставший взрослый..."
10148-101480340 = "Сенсей."
10148-101480350 = "А не сбежать ли нам вместе?"
10148-101480360 = "Нельзя."
10148-101480370 = "Невозможно."
10148-101480380 = "Может, прямо сейчас сбежим?"
10148-101480390 = "Давай просто дотерпим до выходных...!"
10148-101480400 = "Дотерпим до летних каникул следующего года...!"
10148-101480410 = "Что?"
10148-101480420 = "Вы так хотите увидеть меня в купальнике?"
10148-101480430 = "Нет!"
10148-101480440 = "Не... не то чтобы нет!"
10148-101480450 = "Ах..."
10148-101480460 = "Аааа..."
10148-101480470 = "Потерпим...!"
10148-101480480 = "Ох."
10148-101480490 = "Ну..."
10148-101480500 = "Фух."