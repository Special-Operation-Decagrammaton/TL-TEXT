[translation]
10016-100160010 = "У вас есть минутка, Сенсей?"
10016-100160020 = "Просто..."
10016-100160030 = "мне нужно кое о чём с вами поговорить..."
10016-100160040 = "А? Поговорить со мной?"
10016-100160050 = "Да! Я буду ждать вас в нашей клубной комнате!"
10016-100160060 = "Простите..."
10016-100160070 = "Я так увлеклась этой игрой... и не заметила, сколько хлопот вам доставляю, Сенсей..."
10016-100160080 = "Я увидел неожиданную сторону тебя, Мидори..."
10016-100160090 = "Всё нормально. Было очень весело!"
10016-100160100 = "А-а... Хочу куда-нибудь спрятаться..."
10016-100160110 = "В следующий раз можем сыграть во что-нибудь не такое соревновательное...?"
10016-100160120 = "В Миллениуме открывается выставка игрового арта, Сенсей!"
10016-100160130 = "На выставке будем только вы и я..."
10016-100160140 = "...То есть!"
10016-100160150 = "Мне нужно проводить тщательное исследование, когда я работаю над новой игрой!"
10016-100160160 = "Да. Исследования важны."
10016-100160170 = "П-Правда?"
10016-100160180 = "Именно. Так что..."
10016-100160190 = "Пойдёте со мной?"
10016-100160200 = "Сенсей! У меня потрясающие новости! Просто безумие!"
10016-100160210 = "Успокойся, Мидори."
10016-100160220 = "Потрясающие новости? Мне готовить конфетти?!"
10016-100160230 = "*глубокий вдох* Хорошо, я успокоилась!"
10016-100160240 = "Так что случилось?"
10016-100160250 = "Эм... На самом деле это не настолько безумно..."
10016-100160260 = "В общем!"
10016-100160270 = "Они выпустили продолжение легендарной классической игры-шедевра!"
10016-100160280 = "Я достала лимитированное издание!"
10016-100160290 = "Сыграете со мной, Сенсей?"
10016-100160300 = "Спасибо за сегодня."
10016-100160310 = "Давайте в следующий раз снова поиграем, Сенсей."
10016-100160320 = "Я слышала о месте под названием игровой зал."
10016-100160330 = "Говорят, там полно страшных людей..."
10016-100160340 = "Неужели это правда такое страшное место?"
10016-100160350 = "Не стоит делать выводы только по слухам."
10016-100160360 = "О, верно. Надо самой сходить и проверить..."
10016-100160370 = "Хотите пойти вместе?"
10016-100160380 = "В игровой зал?!"
10016-100160390 = "Спасибо, что провели сегодня время со мной."
10016-100160400 = "Но то, что мы вместе ходили в игровой зал..."
10016-100160410 = "Можно... эм..."
10016-100160420 = "Можно сохранить это в секрете?"
10016-100160430 = "Сенсей!"
10016-100160440 = "Вы помните наше обещание?"
10016-100160450 = "Час охоты приближается..."
10016-100160460 = "В полдень Сенсей присоединяется к охоте..."
10016-100160470 = "Вы помнили!"
10016-100160480 = "Ура!"
10016-100160490 = "Я буду в клубной комнате!"
