[translation]
10016-100160010 = "Сенсей, у вас есть время сегодня?"
10016-100160020 = "На самом деле, э-то..."
10016-100160030 = "есть кое-что, о чём я хотела посоветоваться..."
10016-100160040 = "Посоветоваться?"
10016-100160050 = "Да. Я буду весь день в клубе, так что если вам удобно, пожалуйста!"
10016-100160060 = "...Простите."
10016-100160070 = "Я слишком увлеклась и доставила вам хлопоты..."
10016-100160080 = "Раскрылась новая сторона Мидори..."
10016-100160090 = "Всё в порядке, было очень весело."
10016-100160100 = "У-у-у... хочется провалиться сквозь землю..."
10016-100160110 = "В следующий раз я хочу игру не соревновательного жанра..."
10016-100160120 = "Сенсей. Говорят, скоро в Миллениуме пройдёт выставка игрового искусства."
10016-100160130 = "Так что, может, вы и я вдвоём..."
10016-100160140 = "...не то!"
10016-100160150 = "Чтобы разрабатывать новые игры, нужно и учиться...!"
10016-100160160 = "Учёба действительно важна."
10016-100160170 = "В-вот именно, правда!?"
10016-100160180 = "Ну, э-это, так что..."
10016-100160190 = "...не хотите пойти со мной?"
10016-100160200 = "Сенсей, срочные новости! Срочные! Невероятная новость!"
10016-100160210 = "Мидори, успокойся. Остынь."
10016-100160220 = "Невероятная новость? Ой, может, стоит приготовить фейерверки!?"
10016-100160230 = "...Да, я сделала глубокий вдох и успокоилась!"
10016-100160240 = "Что случилось?"
10016-100160250 = "Ну, фейерверки, наверное, не нужны...!"
10016-100160260 = "К-короче!"
10016-100160270 = "Говорят, скоро выйдет продолжение легендарной классической ретро-игры!"
10016-100160280 = "Я хочу обязательно достать лимитированное первое издание."
10016-100160290 = "Сенсей, вы составите мне компанию?"
10016-100160300 = "Спасибо за сегодня."
10016-100160310 = "В следующий раз мы поиграем вместе, Сенсей."
10016-100160320 = "Я слышала,"
10016-100160330 = "что в игровых центрах много страшных людей..."
10016-100160340 = "Это правда?"
10016-100160350 = "Хм, наверное, зависит от места...?"
10016-100160360 = "А, точно. Я ещё ни разу там не была..."
10016-100160370 = "Тогда не хочешь как-нибудь сходить вместе?"
10016-100160380 = "А? В игровой центр!? С удовольствием!!"
10016-100160390 = "Спасибо, что пошли сегодня."
10016-100160400 = "Но то, что мы сегодня ходили в игровой центр,"
10016-100160410 = "это, ну..."
10016-100160420 = "Это секрет от всех, ладно?"
10016-100160430 = "Сенсей!"
10016-100160440 = "Вы помните нашу сегодняшнюю договорённость?"
10016-100160450 = "Время охоты..."
10016-100160460 = "Сегодня Сенсей тоже присоединится!"
10016-100160470 = "Отлично!"
10016-100160480 = "Я рада!"
10016-100160490 = "Тогда я жду вас в клубе."
