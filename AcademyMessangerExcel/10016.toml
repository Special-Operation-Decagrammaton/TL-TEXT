[translation]
10016-100160010 = "Sensei, você tem um tempinho livre hoje?"
10016-100160020 = "Na verdade, hum,"
10016-100160030 = "eu queria pedir um conselho seu..."
10016-100160040 = "Um conselho?"
10016-100160050 = "Sim. Vou ficar na sala do clube o dia todo hoje, então se puder dar uma passadinha aqui, por favor!"
10016-100160060 = "...Me desculpe."
10016-100160070 = "Acabei me empolgando demais e te deixando numa situação difícil, Sensei..."
10016-100160080 = "Descobri um lado totalmente novo da Midori..."
10016-100160090 = "Relaxa, foi super divertido!"
10016-100160100 = "U-Uuu... que vergonha, queria enfiar a cara num buraco..."
10016-100160110 = "Na próxima vez, vamos jogar algo que não seja competitivo, por favor..."
10016-100160120 = "Sensei. Fiquei sabendo que vai ter uma exposição de arte de jogos aqui na Millennium."
10016-100160130 = "Então, hum, pensei de irmos só nós dois..."
10016-100160140 = "...Quer dizer, não é isso!"
10016-100160150 = "Para desenvolver jogos novos, é fundamental estudar referências também...!"
10016-100160160 = "Com certeza, estudar referências é muito importante."
10016-100160170 = "N-Não é verdade?!"
10016-100160180 = "H-Hum, então, sendo assim..."
10016-100160190 = "...Você gostaria de ir comigo?"
10016-100160200 = "Sensei, notícia urgente! Urgente! Uma novidade incrível!"
10016-100160210 = "Calma, Midori. Respira fundo primeiro."
10016-100160220 = "Uma novidade incrível? E agora, será que devo preparar fogos de artifício?!"
10016-100160230 = "...Pronto, respirei fundo e me acalmei!"
10016-100160240 = "O que aconteceu?"
10016-100160250 = "Hum, acho que não precisa chegar ao ponto de soltar fogos, mas...!"
10016-100160260 = "E-Enfim!"
10016-100160270 = "Anunciaram a continuação daquele jogo retrô lendário!"
10016-100160280 = "Eu quero garantir a edição limitada de lançamento de qualquer jeito."
10016-100160290 = "Sensei, você poderia ir comigo?"
10016-100160300 = "Muito obrigada por hoje!"
10016-100160310 = "Vamos jogar juntos da próxima vez, tá bom, Sensei?"
10016-100160320 = "Eu já ouvi boatos de que"
10016-100160330 = "os fliperamas são lugares cheios de gente mal-encarada e assustadora..."
10016-100160340 = "Será que é verdade mesmo?"
10016-100160350 = "Humm, acho que depende muito do lugar..."
10016-100160360 = "É-É mesmo, né? É que eu nunca fui a um fliperama de verdade..."
10016-100160370 = "Então que tal irmos juntos conhecer um qualquer dia desses?"
10016-100160380 = "Hã, num fliperama?! Eu adoraria!!"
10016-100160390 = "Muito obrigada por ter me acompanhado hoje."
10016-100160400 = "Só que, sobre termos ido ao fliperama juntos hoje,"
10016-100160410 = "hum, este..."
10016-100160420 = "É SEGREDO DAS OUTRAS MENINAS, TÁ BOM?"
10016-100160430 = "Sensei!"
10016-100160440 = "Você lembra do nosso compromisso de hoje?"
10016-100160450 = "Chegou a hora da caçada..."
10016-100160460 = "Hoje o Sensei também vai entrar na partida!"
10016-100160470 = "Que bom!"
10016-100160480 = "Fico tão feliz!"
10016-100160490 = "Então vou estar te esperando na sala do clube!"
