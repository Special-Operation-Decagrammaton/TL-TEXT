[translation]
10051-100510010 = "Foi mal incomodar, Sensei."
10051-100510020 = "Por acaso o meu jaleco ficou aí na Schale?"
10051-100510030 = "Seria este aqui? Estava pendurado no sofá."
10051-100510040 = "Esse mesmo! Que alívio que achou..."
10051-100510050 = "Acho que acabei esquecendo quando tirei na sala de descanso."
10051-100510060 = "Eu ia começar a trabalhar num projeto agora, mas..."
10051-100510070 = "para piorar, meu jaleco reserva está lavando."
10051-100510080 = "Quer que eu leve aí para você?"
10051-100510090 = "Huum... Não, não precisa."
10051-100510100 = "Vou procurar alguma coisa por aqui que sirva para quebrar o galho."
10051-100510110 = "Lembra que no último festival esportivo eu apresentei o Trovãozinho em versão especial?"
10051-100510120 = "Desde então, vários clientes vieram me pedir para desenvolver robôs de torcida."
10051-100510130 = "Construir um simples robô de torcida seria moleza, mas..."
10051-100510140 = "se vieram encomendar especialmente comigo, fazer algo comum seria uma desonra para o Clube de Engenharia."
10051-100510150 = "Mas um robô normal já não estaria de bom tamanho...?"
10051-100510160 = "Não, de jeito nenhum."
10051-100510170 = "Como representante do Clube de Engenharia, vou desenvolver uma invenção totalmente nova!"
10051-100510180 = "Tenho certeza absoluta de que é isso que o cliente espera de mim."
10051-100510190 = "S-será mesmo...?"
10051-100510200 = "E por falar nisso, queria te pedir um favor: você poderia vir até a Millennium daqui a pouco?"
10051-100510210 = "Quero testar logo o protótipo do robô de torcida..."
10051-100510220 = "e gostaria que você desse uma olhada nele, Sensei."
10051-100510230 = "Que problemão... Sensei, você tem um tempinho agora?"
10051-100510240 = "Está com algum problema?"
10051-100510250 = "É sobre aquela encomenda do robô de torcida que comentei outro dia."
10051-100510260 = "Estou reforçando as articulações do robô e fazendo modificações para que ele suporte movimentos na velocidade do som, mas..."
10051-100510270 = "acho que vai ser difícil terminar dentro do prazo."
10051-100510280 = "Mas velocidade do som já não é exagero...?"
10051-100510290 = "E se você explicar a situação e pedir para adiar o prazo de entrega?"
10051-100510300 = "Pode ser..."
10051-100510310 = "Mas preciso corresponder às expectativas do cliente que confiou em mim para fazer o pedido."
10051-100510320 = "Como uma Meister, não é algo de que eu me orgulhe, mas..."
10051-100510330 = "chegando a esse ponto, só me resta resolver isso com o próprio corpo...!"
10051-100510340 = "...C-com o próprio corpo!?"
10051-100510350 = "Foi mal, Sensei..."
10051-100510360 = "Ainda está rouca?"
10051-100510370 = "Sim, pois é."
10051-100510380 = "Está atrapalhando até para conversar com as meninas do clube..."
10051-100510390 = "Por isso, estou projetando um novo dispositivo de assistência de comunicação."
10051-100510400 = "Para que até uma voz baixinha consiga alcançar a todos..."
10051-100510410 = "O mecanismo capta a voz de entrada, amplifica o volume e depois reproduz o som."
10051-100510420 = "...Mas isso não é só um megafone?"
10051-100510430 = "Sinto que as integrantes do clube andam meio desanimadas ultimamente."
10051-100510440 = "Você tem ideia do que pode ser, Sensei?"
10051-100510450 = "Bom, teve prova outro dia, né?"
10051-100510460 = "Será que não tiraram notas ruins?"
10051-100510470 = "Entendo..."
10051-100510480 = "Os resultados delas não devem ter sido ruins, mas"
10051-100510490 = "pelo visto não foram bons o bastante para deixá-las satisfeitas."
10051-100510500 = "Seria ótimo se houvesse um jeito de animar todo mundo."
10051-100510510 = "Pois é..."
10051-100510520 = "Nessa hora, cabe a mim, como presidente do clube, entrar em ação para dar uma força."
