[translation]
10051-100510010 = "Извините, Сенсей."
10051-100510020 = "Мой белый халат случайно не в Шале?"
10051-100510030 = "Этот? Висел на диване."
10051-100510040 = "Он! Хорошо, что нашёлся..."
10051-100510050 = "Похоже, я забыла его, когда снимала в комнате отдыха."
10051-100510060 = "Я как раз собиралась приступать к работе, но..."
10051-100510070 = "К сожалению, запасной халат тоже в стирке."
10051-100510080 = "Мне принести?"
10051-100510090 = "М-м... нет, не надо."
10051-100510100 = "Поищу что-нибудь, что может заменить его."
10051-100510110 = "Помните, на прошлом большом спортивном празднике я показывала специальную версию Каминари?"
10051-100510120 = "После этого несколько заказчиков попросили меня разработать роботов для поддержки."
10051-100510130 = "Если просто сделать обычного робота-болельщика — это легко..."
10051-100510140 = "Но раз уж они обратились ко мне, я не могу ударить в грязь лицом перед инженерным отделом."
10051-100510150 = "Разве обычный робот не подойдёт...?"
10051-100510160 = "Нет, так нельзя."
10051-100510170 = "Как инженерный отдел, мы должны создать новое изобретение!"
10051-100510180 = "Заказчик наверняка этого и ждёт."
10051-100510190 = "М-может быть...?"
10051-100510200 = "Вот о чём я хотел спросить: ты не мог бы зайти в Миллениум позже?"
10051-100510210 = "Я хочу сразу же протестировать прототип робота-болельщика..."
10051-100510220 = "Хочу, чтобы ты посмотрел на него."
10051-100510230 = "Вот незадача... Сенсей, у тебя есть время?"
10051-100510240 = "Какие-то проблемы?"
10051-100510250 = "Помнишь, я говорил о заказе на разработку робота-болельщика?"
10051-100510260 = "Я увеличиваю прочность соединений, чтобы он выдерживал движение на сверхзвуковой скорости..."
10051-100510270 = "Но, похоже, трудно уложиться в срок."
10051-100510280 = "Разве сверхзвуковая скорость — это не слишком..."
10051-100510290 = "Может, объяснить ситуацию и попросить отсрочку?"
10051-100510300 = "Возможно..."
10051-100510310 = "Но я должен оправдать доверие заказчика, который положился на меня."
10051-100510320 = "Для мастера это не самый лучший выход, но..."
10051-100510330 = "Если так, придётся действовать физически...!"
10051-100510340 = "...Ф-физически!?"
10051-100510350 = "Извините, Сенсей."
10051-100510360 = "У вас всё ещё горло болит?"
10051-100510370 = "Да, так и есть."
10051-100510380 = "Из-за этого даже общение с членами отдела осложнилось..."
10051-100510390 = "Вот я и думаю о новом устройстве для поддержки коммуникации."
10051-100510400 = "Чтобы даже тихий голос был слышен..."
10051-100510410 = "Оно записывает введённый голос, усиливает громкость и выводит."
10051-100510420 = "...Это же просто мегафон, да?"
10051-100510430 = "В последнее время мне кажется, что члены отдела не очень энергичны."
10051-100510440 = "Сенсей, вам что-нибудь известно?"
10051-100510450 = "Ну, недавно были экзамены."
10051-100510460 = "Может, результаты не очень хорошие?"
10051-100510470 = "Вот оно что..."
10051-100510480 = "У всех, вроде, были неплохие результаты."
10051-100510490 = "Нет, видимо, они не были удовлетворены."
10051-100510500 = "Хорошо бы найти способ подбодрить их."
10051-100510510 = "Да, точно..."
10051-100510520 = "Вот здесь я, как глава отдела, проявлю инициативу."
