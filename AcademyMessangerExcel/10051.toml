[translation]
10051-100510010 = "О. Ох ты."
10051-100510020 = "Сенсей, ты не видел мой лабораторный халат?"
10051-100510030 = "Тот, что валяется на диване?"
10051-100510040 = "Похоже на правду."
10051-100510050 = "Наверное, я забыла его там."
10051-100510060 = "Но мне уже нужно начинать работу. Что делать?"
10051-100510070 = "Всё остальное, что можно было бы надеть, сейчас в стирке..."
10051-100510080 = "Хочешь, я принесу его?"
10051-100510090 = "Нет, всё нормально."
10051-100510100 = "Найду что-нибудь другое."
10051-100510110 = "После того как на спортивном празднике мы показали специальную версию Thundergun,"
10051-100510120 = "нам начали поступать заказы на роботов-болельщиков отовсюду."
10051-100510130 = "Сделать обычных роботов было бы несложно, но..."
10051-100510140 = "Эти заказы поступили прямо к нам. Не могу же я отдать им что-то совершенно стандартное."
10051-100510150 = "А стандартный вариант был бы настолько плох?"
10051-100510160 = "Безусловно."
10051-100510170 = "Если бы им был нужен стандартный вариант, они бы взяли готовый. Но они пришли к нам."
10051-100510180 = "Они ждут и заслуживают чего-то уникального."
10051-100510190 = "Кто бы мог подумать, что ты так убедительна!"
10051-100510200 = "Настолько убедительна, что ты уделишь мне немного времени сегодня днём?"
10051-100510210 = "Я хочу показать прототип, который сделала..."
10051-100510220 = "И кто лучше тебя, Сенсей, сможет его оценить?"
10051-100510230 = "Уф, какая головная боль..."
10051-100510240 = "Что-то беспокоит?"
10051-100510250 = "Ты не помнишь мою прошлую попытку?"
10051-100510260 = "Я пыталась модифицировать роботов, чтобы они выдерживали хотя бы скорость Мах 1, но..."
10051-100510270 = "Не уверена, что успею к сроку."
10051-100510280 = "Возможно, делать роботов, способных выдержать сверхзвуковое движение, было немного слишком амбициозно..."
10051-100510290 = "Почему бы честно не попросить клиентов продлить срок?"
10051-100510300 = "Ну, технически это вариант..."
10051-100510310 = "Но клиенты доверились нам. Не хочу отплачивать за доверие задержкой."
10051-100510320 = "Это не слишком похоже на решение мастера, но..."
10051-100510330 = "придётся решить проблему своим телом."
10051-100510340 = "....Своим телом?!"
10051-100510350 = "Прости за все сегодняшние хлопоты..."
10051-100510360 = "Как твой голос?"
10051-100510370 = "Всё ещё хриплый..."
10051-100510380 = "Я едва могу разговаривать с остальными... Всё громче шёпота очень неприятно."
10051-100510390 = "Но это заставило меня задуматься о новом устройстве связи..."
10051-100510400 = "Таком, которое позволит легко услышать даже тихий голос."
10051-100510410 = "Возможно, устройство, которое распознаёт и записывает голос, а затем громко его воспроизводит..."
10051-100510420 = "...То есть громкоговоритель?"
10051-100510430 = "В последнее время участницы клуба выглядят совсем без энергии."
10051-100510440 = "Есть догадки почему, Сенсей?"
10051-100510450 = "Может, настроение упало вместе с оценками?"
10051-100510460 = "Они что-нибудь говорили о результатах тестов?"
10051-100510470 = "...Думаешь, дело в этом?"
10051-100510480 = "Оценки, которые они называли, вроде были не такими уж плохими..."
10051-100510490 = "Но если что-то не плохо, это ещё не значит, что оно не разочаровывает."
10051-100510500 = "Не можешь придумать хороший способ их подбодрить?"
10051-100510510 = "Хм..."
10051-100510520 = "В такие моменты я должна проявить себя как президент клуба."
