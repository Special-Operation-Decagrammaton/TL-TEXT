[translation]
10000-327 = "Сенсей, мы получили отзыв по прошлому заказу."
10000-328 = "Клиент остался очень доволен."
10000-329 = "Хех. Отличная работа."
10000-330 = "О чём ты?"
10000-331 = "Это стало возможным только благодаря тебе, Ару."
10000-332 = "А? Вы что, не помните?"
10000-333 = "Ну, я понимаю, всё было очень хаотично, но..."
10000-334 = "В-В любом случае...!"
10000-335 = "Вы довольно ловко говорите. Н-Наверное, взрослым это легко даётся!"
10000-336 = "...А может, и нет."
10000-337 = "Моя обязанность как начальницы - награждать сотрудников,"
10000-338 = "которые показывают отличные результаты."
10000-339 = "Как думаете, какая награда была бы лучшей, Сенсей?"
10000-340 = "Я думаю об этом с тех пор, как вернулась."
10000-341 = "Если я скажу всем, что в награду сотрудникам мы будем есть огромный парфе из меню испытаний,"
10000-342 = "думаю, они только разозлятся."
10000-343 = "...Я слишком думала об эффективности и совсем не учла этого."
10000-344 = "Так что в следующий раз... эм..."
10000-345 = "Надеюсь, вы снова присоединитесь к нам, Сенсей."
10000-346 = "Сенсей, начальнице нужны не только лидерские качества."
10000-347 = "Конечно, мои лидерские качества превосходны,"
10000-348 = "но мне требуется ещё много других навыков."
10000-349 = "Навыков?"
10000-350 = "Например каких?"
10000-351 = "Хех, правда хотите знать?"
10000-352 = "Тогда приходите сегодня в библиотеку, Сенсей."
10000-353 = "Сенсей, я не ожидала, что всё так выйдет."
10000-354 = "Но запомните:"
10000-355 = "В следующий раз я вам так легко не уступлю!"
10000-356 = "Давайте как-нибудь снова позанимаемся вместе! ♪"
10000-357 = "Сенсей, слышали?"
10000-358 = "Сейчас показывают фильм, который уже называют легендарным шедевром."
10000-359 = "Если у вас есть время, может, сходим вместе?"
10000-360 = "О! Ты приглашаешь меня на свидание, Ару?"
10000-361 = "Ч-Что вы такое говорите, Сенсей?!"
10000-362 = "Х-Хватит шутить. Встретимся перед кинотеатром!"
10000-363 = "Сенсей, вы сегодня свободны?"
10000-364 = "Да, свободен."
10000-365 = "Даже если бы был занят, я бы нашёл для тебя время, Ару."
10000-366 = "К-Кхм! Ч-Что ж, хорошо."
10000-367 = "Мне нужно обсудить с вами кое-что важное, Сенсей."
10000-368 = "Приходите сегодня в офис «Решателей проблем 68»."
10000-369 = "Буду ждать."
10000-370 = "Вы видели, какой крутой я сегодня была?"
10000-371 = "Спасибо, что всегда рядом, Сенсей!"
10000-372 = "И кстати, это действительно был деловой звонок, так что не подумайте лишнего!"
10000-100000010 = "Сенсей."
10000-100000020 = "Мы, Решалы 68, благодарны вам."
10000-100000030 = "Мне немного неловко слышать такое от тебя, Ару."
10000-100000040 = "Хи-хи. Да ладно, не смущайтесь."
10000-100000050 = "Это на вас не похоже."
10000-100000060 = "Не хочу смущаться одна, так что придётся заставить вас чувствовать то же самое!"
10000-100000070 = "Ч-Что вы такое говорите?!"
10000-100000080 = "Ну, я просто шучу."
10000-100000090 = "*вздох* Иногда разговоры с вами действительно меня удивляют."
10000-100000100 = "В-В любом случае! Я давно хотела отплатить за всю вашу помощь..."
10000-100000110 = "Я хочу пригласить вас куда-нибудь. Что скажете?"
10000-100000120 = "Конечно, принимаю."
10000-100000130 = "Хи-хи-хи, правда?"
10000-100000140 = "Тогда буду ждать, Сенсей."
