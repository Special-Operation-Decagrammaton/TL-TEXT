[translation]
10000-327 = "Sensei. Aquele serviço em que você me ajudou antes finalmente foi resolvido de vez."
10000-328 = "Parece que o cliente também ficou super satisfeito."
10000-329 = "Fufu, bom trabalho."
10000-330 = "Do que mesmo a gente tava falando?"
10000-331 = "Tudo isso graças à Presidente Aru!"
10000-332 = "Hã? Não me diga que você não lembra?"
10000-333 = "Bom, naquela hora a coisa realmente tava bem corrida, mas..."
10000-334 = "E-Enfim...!"
10000-335 = "Q-Que jogo de cintura natural... então é isso que é ser um adulto...!"
10000-336 = "...Quer dizer, não é isso!"
10000-337 = "Quando um funcionário entrega um ótimo resultado, dar uma recompensa à altura..."
10000-338 = "Acho que esse tipo de coisa também é dever de uma presidente."
10000-339 = "Diga lá, qual seria a melhor recompensa para você, Sensei?"
10000-340 = "Eu voltei pra casa e fiquei pensando bastante no assunto, mas..."
10000-341 = "Se eu dissesse \"Como recompensa, vamos encarar o parfait gigante do cardápio de desafios\","
10000-342 = "acho que as meninas iam ficar uma fera comigo."
10000-343 = "...Quem diria que por trás da eficiência haveria um ponto cego desses."
10000-344 = "Por isso, hum..."
10000-345 = "Sensei, você me faria companhia de novo na próxima vez?"
10000-346 = "Sensei, liderança não é a única habilidade necessária para ser uma presidente."
10000-347 = "Claro que a minha liderança é impecável, mas"
10000-348 = "no trabalho a gente precisa de várias outras habilidades também."
10000-349 = "Várias outras habilidades?"
10000-350 = "Por exemplo?"
10000-351 = "Hehehe, quer saber? Quer saber mesmo, né?"
10000-352 = "Então passe na biblioteca hoje. Vou estar te esperando, Sensei."
10000-353 = "Sensei, você subiu no meu conceito."
10000-354 = "Mas pode anotar aí:"
10000-355 = "Na próxima vez eu não vou cair tão fácil assim!"
10000-356 = "...Deixando isso de lado, vamos estudar juntos de novo qualquer dia desses♪"
10000-357 = "Sensei, ficou sabendo da novidade?"
10000-358 = "Parece que vão relançar aquele filme clássico lendário nos cinemas."
10000-359 = "Se você tiver um tempinho livre, que tal irmos assistir juntos?"
10000-360 = "Boa! Um convite de encontro da Aru!"
10000-361 = "O-O-O que você tá dizendo, Sensei?!"
10000-362 = "P-Pare de falar besteira e me encontre na frente do cinema, tá bom?!"
10000-363 = "Sensei, você está livre hoje?"
10000-364 = "Sim, tô livre."
10000-365 = "Se a Aru-chan está me chamando, não tenho como recusar."
10000-366 = "H-Humm...?! B-Bom, então tá ótimo."
10000-367 = "Hoje tenho um assunto importante para tratar com você, Sensei."
10000-368 = "Pode dar um pulo no escritório do Faz-Tudo mais tarde?"
10000-369 = "Tô te esperando."
10000-370 = "Ver o meu lado super descolado como hoje é um privilégio raro, sabia?"
10000-371 = "Conto com você daqui pra frente também, Sensei!"
10000-372 = "...Aliás, aquela ligação era trabalho de verdade mesmo! Juro!"
10000-100000010 = "Sensei "
10000-100000020 = "Mais uma vez... todas nós do Faz-Tudo agradecemos a você de coração, Sensei."
10000-100000030 = "Falando desse jeito eu até fico sem graça."
10000-100000040 = "Hehehe, isso não combina com você, Sensei."
10000-100000050 = "Se ficar com vergonha só com isso, não vai aguentar o tranco daqui pra frente, viu?"
10000-100000060 = "Então vamos inverter os papéis: hora de deixar a Aru com vergonha também."
10000-100000070 = "Como é que é?!?!"
10000-100000080 = "Foi mal, só falei por falar."
10000-100000090 = "A-Ah, tá..."
10000-100000100 = "Enfim, indo direto ao assunto: como agradecimento por cuidar sempre da gente,"
10000-100000110 = "que tal sairmos para comer alguma coisa juntos?"
10000-100000120 = "Com certeza!"
10000-100000130 = "Que ótimo!"
10000-100000140 = "Então vou estar te esperando, Sensei."
