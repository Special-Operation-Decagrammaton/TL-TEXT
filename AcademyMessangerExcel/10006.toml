[translation]
10006-520 = "Сенсей, слышали слух?"
10006-521 = "Какой слух?"
10006-522 = "Говорят, по переулкам шатается извращенец и задирает девушкам юбки."
10006-523 = "Уф, какой мерзкий мир."
10006-524 = "Ужасно..."
10006-525 = "Если увидите кого-то подозрительного, немедленно свяжитесь с Командой Префектов Геенны."
10006-526 = "Хорошо, понял."
10006-527 = "Сенсей, в последнее время вы часто бываете в Академии Геенны..."
10006-528 = "Ну, в последнее время у меня много работы в Геенне."
10006-529 = "Не могу не хотеть увидеть тебя."
10006-530 = "Понятно... Вы много работаете."
10006-531 = "А?! О чём вы вообще говорите?"
10006-532 = "В любом случае в академии я почти никогда с вами не сталкиваюсь."
10006-533 = "Где вы проводите большую часть времени, когда приходите?"
10006-534 = "На кампусе."
10006-535 = "На кампусе? А что там?"
10006-536 = "Расскажу лично."
10006-537 = "Вы ведёте себя ужасно подозрительно..."
10006-538 = "Согласно недавнему отчёту разведки, объём контрабанды на Чёрном рынке, похоже, вырос."
10006-539 = "Всё необходимое для повседневной жизни можно купить на обычном рынке..."
10006-540 = "Так чем же торгуют на Чёрном рынке?"
10006-541 = "Мне это не особо интересно, поэтому я мало что знаю."
10006-542 = "Это заметно."
10006-543 = "Обычному человеку вообще незачем задумываться о Чёрном рынке."
10006-544 = "Постарайтесь не связываться с этими мерзавцами с Чёрного рынка, Сенсей."
10006-545 = "Буду иметь в виду."
10006-546 = "Вы точно не собираетесь делать ничего странного с моим школьным альбомом?"
10006-547 = "Я доверяю вам... но никому больше его не показывайте!"
10006-548 = "Иори."
10006-549 = "А-А? Что?"
10006-550 = "В начальной школе ты тоже была милой."
10006-551 = "Замолчите! Я вас убью!"
10006-552 = "Сегодня вы мне очень помогли. Спасибо."
10006-553 = "Это я должен тебя благодарить."
10006-554 = "Команда Префектов всегда мне помогает. Спасибо."
10006-555 = "Для вас особенно опасно получить пулю, Сенсей."
10006-556 = "Логично, что мы сопровождаем вас на опасных заданиях, где используется оружие."
10006-557 = "Но разве ты"
10006-558 = "не пострадала во время задания?"
10006-559 = "А... Вы про рану на спине?"
10006-560 = "Не волнуйтесь. Просто царапина."
10006-561 = "Сенсей, когда увидите это сообщение, пожалуйста, приходите в жилой район №3 у главных ворот Геенны."
10006-562 = "Тут... небольшая проблема."
10006-563 = "Что случилось?"
10006-564 = "Не спрашивайте! Просто приходите!"
10006-565 = "И не говорите другим студентам, что я здесь!"
10006-566 = "Сенсей!"
10006-567 = "Что это за фотография, которую вы только что прислали мне на почту?!"
10006-569 = "Хороший кадр, правда?"
10006-570 = "Мило!"
10006-571 = "Что значит «хороший кадр»?!"
10006-572 = "Совсем не мило!"
10006-573 = "Я же сказала удалить эту фотографию!"
10006-574 = "Почему она до сих пор у вас?!"
10006-575 = "Удалите! Сейчас же!"
10006-576 = "Вы меня слышите? Удалите немедленно!"
