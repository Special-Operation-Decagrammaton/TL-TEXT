[translation]
10006-520 = "Sensei, você ouviu aquele boato?"
10006-521 = "Que boato?"
10006-522 = "Tá rolando um boato de que tem um pervertido à solta tentando espiar debaixo da saia das alunas."
10006-523 = "Francamente, a que ponto chegamos..."
10006-524 = "Isso é grave mesmo."
10006-525 = "Sensei, se você também vir algum pervertido suspeito por aí, avise o Comitê Disciplinar imediatamente."
10006-526 = "Entendido, deixa comigo."
10006-527 = "Sensei, parece que você tem vindo bastante a Gehenna a trabalho ultimamente..."
10006-528 = "É que têm aparecido muitos assuntos ligados à Academia Gehenna nos últimos dias."
10006-529 = "É que bateu saudade da Iori-chan e eu não resisti..."
10006-530 = "...Ah, entendi. Bom trabalho."
10006-531 = "...Hã? Que besteira você tá falando?!"
10006-532 = "Mas, pensando bem, a gente quase não se esbarra pelo campus."
10006-533 = "Quando você vem pra cá a trabalho, por onde costuma ficar?"
10006-534 = "Pelo pátio e arredores."
10006-535 = "...No pátio? Fazendo o quê?"
10006-536 = "Na próxima vez que a gente se encontrar eu te conto."
10006-537 = "Isso tá muito suspeito..."
10006-538 = "Segundo os relatórios, o volume de contrabando no Mercado Negro aumentou bastante ultimamente."
10006-539 = "Sendo que qualquer item necessário pro dia a dia pode ser comprado num mercado comum..."
10006-540 = "Que tipo de negócios será que estão fazendo no Mercado Negro?"
10006-541 = "Eu não faço ideia, e também não tenho o menor interesse..."
10006-542 = "Imagino que sim."
10006-543 = "Uma pessoa comum dificilmente colocaria os pés no Mercado Negro."
10006-544 = "Sensei, tome cuidado para não se envolver com os criminosos do Mercado Negro também."
10006-545 = "Pode deixar, vou guardar bem esse conselho."
10006-546 = "...Sensei, você não vai mesmo usar o meu álbum de formatura pra nenhuma esquisitice, né?"
10006-547 = "Eu te emprestei porque confio em você... Não vá mostrar pra mais ninguém, ouviu?!"
10006-548 = "...Ei, Iori."
10006-549 = "Hum? Que foi?"
10006-550 = "A Iori da época do fundamental também era uma gracinha."
10006-551 = "Cala a boca! Morre!"
10006-552 = "Obrigada pela ajuda nas atividades do Comitê Disciplinar hoje."
10006-553 = "Eu que agradeço."
10006-554 = "Tanto você quanto o resto do Comitê Disciplinar de Gehenna me ajudaram demais."
10006-555 = "Ao contrário de nós, se você levar um tiro, corre perigo de vida de verdade, Sensei."
10006-556 = "Em missões perigosas como aquela, não fazemos mais do que a nossa obrigação em escoltá-lo."
10006-557 = "Obrigado mesmo. Aliás, Iori,"
10006-558 = "você não tinha machucado as costas durante a operação agora há pouco?"
10006-559 = "Ah... agora que você falou, é verdade."
10006-560 = "Não se preocupe, não foi nada de mais."
10006-561 = "Sensei, assim que vir esta mensagem, venha até a Quadra 3 do bairro residencial em frente ao portão principal de Gehenna..."
10006-562 = "Tive um pequeno... imprevisto."
10006-563 = "Que tipo de imprevisto?"
10006-564 = "Não importa, só vem logo!"
10006-565 = "E outra coisa! Não conte pra nenhuma outra aluna que eu tô aqui, de jeito nenhum!"
10006-566 = "SENSEI!!"
10006-567 = "Por que você ainda tá guardando aquela foto que enviaram agora há pouco?!"
10006-569 = "Ficou tão boa que achei que talvez você fosse querer."
10006-570 = "Não ficou fofa?"
10006-571 = "Querer o caramba!!!!!"
10006-572 = "O problema não é esse!"
10006-573 = "Eu mandei você apagar!"
10006-574 = "Por que ainda tá com ela aí?!"
10006-575 = "Apaga! Agora mesmo!"
10006-576 = "Tá me ouvindo?! Ei!!"
