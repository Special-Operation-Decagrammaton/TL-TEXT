[translation]
10006-520 = "Сенсей, вы слышали тот слух?"
10006-521 = "Какой слух?"
10006-522 = "Говорят, появился извращенец, который пытается заглядывать под юбки школьницам."
10006-523 = "Вот это да, печальный мир."
10006-524 = "Это серьёзно."
10006-525 = "Сенсей, если вы увидите подозрительного извращенца, сразу сообщите в Комитет по дисциплине."
10006-526 = "Понял, положись на меня."
10006-527 = "Сенсей, в последнее время вы часто приезжаете в Геенну в командировки..."
10006-528 = "В последнее время много работы, связанной с академией Геенны."
10006-529 = "Просто я хочу видеть Иори, вот и..."
10006-530 = "...Понятно. Вы, наверное, устали."
10006-531 = "...Что? Что ты несёшь?"
10006-532 = "Но на самом деле, мы редко видимся в академии."
10006-533 = "Когда вы приезжаете в командировку, где вы бываете?"
10006-534 = "На школьном дворе, например."
10006-535 = "...На школьном дворе? Зачем?"
10006-536 = "Расскажу, когда встретимся в следующий раз."
10006-537 = "Что-то подозрительно..."
10006-538 = "По докладам, в последнее время на Чёрном рынке вырос объём торговли контрабандой."
10006-539 = "Если нужно что-то для жизни, на обычном рынке всё можно купить..."
10006-540 = "Какие же сделки заключаются на Чёрном рынке?"
10006-541 = "Я не знаю, меня это и не интересует..."
10006-542 = "Ну, это логично."
10006-543 = "Обычному человеку не так-то просто ступить на Чёрный рынок."
10006-544 = "Сенсей, постарайтесь не связываться с плохишами с Чёрного рынка."
10006-545 = "Хорошо, я запомню."
10006-546 = "...Сенсей, вы ведь не собираетесь использовать мой выпускной альбом во что-то странное?"
10006-547 = "Я вам доверила его... не показывайте никому!"
10006-548 = "...Слушай, Иори."
10006-549 = "А? Что?"
10006-550 = "Ты в начальной школе была милой."
10006-551 = "Заткнись! Умри!"
10006-552 = "Спасибо за помощь в сегодняшней деятельности Комитета по дисциплине."
10006-553 = "Я тоже благодарна."
10006-554 = "Вы и Комитет по дисциплине Геенны нам очень помогли."
10006-555 = "Сенсей в отличие от нас, если в него попадут из оружия, будет по-настоящему опасно."
10006-556 = "В таких опасных миссиях мы обязаны быть рядом."
10006-557 = "Да, спасибо. Кстати, Иори,"
10006-558 = "ты не ранила спину во время операции?"
10006-559 = "Ах... точно, было дело."
10006-560 = "Не обращай внимания, это не серьёзно."
10006-561 = "Сенсей, когда увидите это сообщение, приходите в 3-й квартал жилого района перед главными воротами Геенны..."
10006-562 = "Случилось... небольшое происшествие."
10006-563 = "Что за происшествие?"
10006-564 = "Просто быстрее приходите!"
10006-565 = "И ещё! Другим ученицам ни в коем случае не говорите, что я здесь!"
10006-566 = "Сенсей!!"
10006-567 = "Почему у тебя всё ещё есть это фото, которое я тебе отправляла!!"
10006-569 = "Оно ведь хорошо получилось, думал, может, ты захочешь."
10006-570 = "Разве не мило?"
10006-571 = "Не хочу!!!!"
10006-572 = "Не в этом дело!"
10006-573 = "Я же просила удалить!"
10006-574 = "Почему оно всё ещё у тебя!"
10006-575 = "Удаляй! Сейчас же!"
10006-576 = "Ты слышишь?! Эй!"
