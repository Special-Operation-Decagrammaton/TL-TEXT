[translation]
10027-100270010 = "Sensei, você tem um tempo agora?"
10027-100270020 = "Tenho sim."
10027-100270030 = "Aconteceu alguma coisa?"
10027-100270040 = "Queria te pedir um favor... tem um item necessário para a missão,"
10027-100270050 = "e seria de grande ajuda se você pudesse entregá-lo para a Asuna-senpai no local que vou te passar daqui a pouco."
10027-100270060 = "Estou um pouco ocupada agora e não consigo sair daqui..."
10027-100270070 = "Beleza, deixa comigo."
10027-100270080 = "Já estou indo."
10027-100270090 = "Obrigada."
10027-100270100 = "Talvez hoje eu não consiga te encontrar pessoalmente para agradecer, mas depois faço isso direito."
10027-100270110 = "Conto com você, então."
10027-100270120 = "Sensei"
10027-100270130 = "Obrigada por hoje."
10027-100270140 = "Vou te retribuir em uma próxima oportunidade."
10027-100270150 = "Retribuir...!?"
10027-100270160 = "Que tal me deixar te acompanhar de novo qualquer dia desses?"
10027-100270170 = "..."
10027-100270180 = "Ai, ai..."
10027-100270190 = "Sensei, tem um minutinho?"
10027-100270200 = "Sobre aquilo do outro dia,"
10027-100270210 = "pensei em retribuir o favor direitinho."
10027-100270220 = "Como estou em uma missão de infiltração, se a situação mudar talvez não dê tempo... mas agora as coisas estão calmas, então acho que tudo bem."
10027-100270230 = "O que acha?"
10027-100270240 = "Com todo o prazer!"
10027-100270250 = "Não é exagero dizer que trabalhei duro só esperando por este dia!"
10027-100270260 = "Que bom."
10027-100270270 = "..."
10027-100270280 = "Bom, de qualquer forma,"
10027-100270290 = "até daqui a pouco, então."
10027-100270300 = "Sensei"
10027-100270310 = "Hum..."
10027-100270320 = "Sobre o que aconteceu hoje..."
10027-100270330 = "..."
10027-100270340 = "Não,"
10027-100270350 = "deixa pra lá, na próxima eu falo pessoalmente."
10027-100270360 = "Sensei, está ocupado agora?"
10027-100270370 = "Queria ter uma conversa um pouco séria..."
10027-100270380 = "...Por acaso é a continuação daquela conversa do outro dia?"
10027-100270390 = "*Gole*..."
10027-100270400 = "Impressão minha ou você está meio tenso...?"
10027-100270410 = "Se preferir, quer deixar para outro dia?"
10027-100270420 = "Não precisa mesmo ser hoje,"
10027-100270430 = "não é nada urgente..."
10027-100270440 = "Não, pode ser hoje mesmo sem problemas."
10027-100270450 = "Tem algo que eu já quero confirmar, ou melhor, deixar claro..."
10027-100270460 = "Tem certeza?"
10027-100270470 = "Certo, então por favor."
10027-100270480 = "Quanto ao lugar..."
10027-100270490 = "Para ninguém descobrir, acho que tem que ser lá mesmo."
10027-100270500 = "Conto com você, então. Entro em contato de novo mais tarde."
10027-100270510 = "Sensei"
10027-100270520 = "Bom..."
10027-100270530 = "Obrigada por ter vindo hoje."
10027-100270540 = "Graças a você, Sensei, esta roupa se tornou ainda mais especial."
10027-100270550 = "Obrigada, Sensei."
10027-100270560 = "Você está sempre me ensinando tantas coisas."
10027-100270570 = "Bom, depois eu entro em contato de novo."
10027-100270580 = "Obrigada pelo contato, Sensei. Precisa de uma atiradora de elite?"
10027-100270590 = "Se for o caso, me passe os detalhes."
10027-100270600 = "Sim! Preciso de uma atiradora de elite vestida de coelhinha!"
10027-100270610 = "Hã? Quer dizer que é uma missão especial?"
10027-100270620 = "Certo, entendido."
10027-100270630 = "Me informe o ponto de encontro."
