[translation]
10027-100270010 = "Сенсей, вы сейчас свободны? Я хотела попросить об услуге..."
10027-100270020 = "Да. Что такое?"
10027-100270030 = "Конечно. Чем помочь?"
10027-100270040 = "Ничего особенного. Мне нужны кое-какие вещи для выполнения миссии, и я хотела попросить вас принести их."
10027-100270050 = "Вам не нужно ехать сюда. Просто принесите их в указанное место, и Асуна будет вас ждать."
10027-100270060 = "Обычно мы справляемся сами, но сейчас ситуация оказалась немного сложной."
10027-100270070 = "Конечно, я совсем не против."
10027-100270080 = "Не волнуйся. Скоро выйду."
10027-100270090 = "А."
10027-100270100 = "Спасибо, Сенсей. Раз мы не увидимся лично, поблагодарю заранее."
10027-100270110 = "Буду ждать."
10027-100270120 = "Сенсей"
10027-100270130 = "Сегодня вы очень помогли."
10027-100270140 = "Когда-нибудь обязательно отплачу за услугу."
10027-100270150 = "Правда? Буду ждать."
10027-100270160 = "Отплати мне тем, что будешь просить ещё больше."
10027-100270170 = "..."
10027-100270180 = "Хм..."
10027-100270190 = "Сенсей, вы сейчас свободны?"
10027-100270200 = "Ничего серьёзного. Просто мне кажется, одного «спасибо» недостаточно."
10027-100270210 = "Я хотела бы отплатить вам за всю помощь."
10027-100270220 = "Сейчас я веду расследование под прикрытием, связанное с обслуживанием клиентов."
10027-100270230 = "Если вы не слишком заняты, я хотела бы пригласить вас. Можно?"
10027-100270240 = "С удовольствием. Спасибо."
10027-100270250 = "Я ждала этого дня!"
10027-100270260 = "Хм."
10027-100270270 = "..."
10027-100270280 = "Подтверждаю."
10027-100270290 = "В общем, тогда увидимся."
10027-100270300 = "..."
10027-100270310 = "Эм."
10027-100270320 = "Сенсей, насчёт сегодняшнего..."
10027-100270330 = "..."
10027-100270340 = "Хм."
10027-100270350 = "Вообще-то, неважно. Обсудим позже."
10027-100270360 = "Сенсей, вы позже будете свободны?"
10027-100270370 = "Если вы не против, я хотела бы поговорить о чём-то довольно серьёзном."
10027-100270380 = "Это насчёт костюма кролика?"
10027-100270390 = "Время пришло."
10027-100270400 = "Эм."
10027-100270410 = "Вообще-то... неважно."
10027-100270420 = "Простите. Забудьте."
10027-100270430 = "Думаю, я слишком поспешила."
10027-100270440 = "Вообще-то, так даже лучше."
10027-100270450 = "Давайте воспользуемся случаем и всё проясним."
10027-100270460 = "Правда?"
10027-100270470 = "Не знаю как."
10027-100270480 = "Хорошо, Сенсей."
10027-100270490 = "Тогда я найду безопасное, незаметное место для встречи."
10027-100270500 = "Скоро увидимся."
10027-100270510 = "Сенсей."
10027-100270520 = "Эм."
10027-100270530 = "Что касается наряда, который я сегодня носила, думаю, он мне нескоро надоест."
10027-100270540 = "Я привязалась к нему из-за того, что произошло."
10027-100270550 = "Это помогло мне понять кое-что важное..."
10027-100270560 = "И за это я должна благодарить вас, Сенсей."
10027-100270570 = "Поговорим позже."
10027-100270580 = "Спасибо, что связались, Сенсей. Насколько я понимаю, Вам нужна поддержка снайпера?"
10027-100270590 = "Пожалуйста, расскажите детали миссии."
10027-100270600 = "Да! Мне нужна снайпер девочка-кролик!"
10027-100270610 = "Похоже, это особая миссия."
10027-100270620 = "Поняла. Доверьтесь мне."
10027-100270630 = "Где место встречи?"
