10027-100270170 = "..."
10027-100270180 = "*вздох*"
10027-100270190 = "Сенсей, можно на минутку?"
10027-100270200 = "Насчёт того дела."
10027-100270210 = "Я хочу отблагодарить вас должным образом."
10027-100270220 = "Я на подпольном задании, так что если ситуация изменится, будет не до благодарности... но сейчас тихо, так что, наверное, всё в порядке."
10027-100270230 = "Как думаете?"
10027-100270240 = "С радостью."
10027-100270250 = "Можно сказать, я работал ради этого дня!"
10027-100270260 = "Хорошо."
10027-100270270 = "..."
10027-100270280 = "Ну, в общем."
10027-100270290 = "Тогда увидимся позже."
10027-100270300 = "Сенсей."
10027-100270310 = "Ну..."
10027-100270320 = "Насчёт сегодняшнего..."
10027-100270330 = "..."
10027-100270340 = "Нет."
10027-100270350 = "Ничего, я скажу при личной встрече."
10027-100270360 = "Сенсей, вы сейчас заняты?"
10027-100270370 = "Мне нужно кое-что серьёзное обсудить..."
10027-100270380 = "...Может, продолжение того разговора?"
10027-100270390 = "Глоток..."
10027-100270400 = "Вы что, нервничаете...?"
10027-100270410 = "Если что, можно перенести на другой день."
10027-100270420 = "Совсем не обязательно сегодня."
10027-100270430 = "Это не срочно..."
10027-100270440 = "Нет, сегодня вполне подходит."
10027-100270450 = "Я хочу убедиться, прояснить..."
10027-100270460 = "Правда?"
10027-100270470 = "Тогда прошу."
10027-100270480 = "Место..."
10027-100270490 = "Чтобы никто не узнал, наверное, то самое место."
10027-100270500 = "Тогда прошу. Я свяжусь позже."
10027-100270510 = "Сенсей."
10027-100270520 = "Ну..."
10027-100270530 = "Спасибо, что пришли сегодня."
10027-100270540 = "Благодаря вам эта одежда стала для меня особенной."
10027-100270550 = "Сенсей, спасибо."
10027-100270560 = "Вы всегда учите меня разным вещам."
10027-100270570 = "Тогда я ещё свяжусь."
10027-100270580 = "Спасибо за сообщение, Сенсей. Нужен снайпер?"
10027-100270590 = "Если да, дайте подробности."
10027-100270600 = "Да! Нужен снайпер в костюме зайчика!"
10027-100270610 = "А? Спецзадание?"
10027-100270620 = "Хорошо, понял."
10027-100270630 = "Скажите место сбора."
