[translation]
10027-100270010 = "Сенсей, у вас есть время сейчас?"
10027-100270020 = "Да, есть."
10027-100270030 = "Что случилось?"
10027-100270040 = "Нужна небольшая просьба, точнее, кое-что для задания."
10027-100270050 = "Я позже скажу место, если передадите это Асуне, мне очень поможет."
10027-100270060 = "Сейчас я немного занята..."
10027-100270070 = "Хорошо, положитесь на меня."
10027-100270080 = "Я сейчас приду."
10027-100270090 = "Спасибо."
10027-100270100 = "Сегодня, возможно, не смогу поблагодарить лично, но как-нибудь в другой раз."
10027-100270110 = "Тогда прошу."
10027-100270120 = "Сенсей."
10027-100270130 = "Спасибо за сегодня."
10027-100270140 = "Я отплачу вам в другой раз."
