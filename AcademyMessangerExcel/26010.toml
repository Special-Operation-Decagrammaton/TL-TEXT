[translation]
26010-260100010 = "Животные в лесу скрываются, сливаясь с окружением."
26010-260100020 = "Точно так же снайперы используют камуфляж, чтобы спрятаться."
26010-260100030 = "В дикой местности тело скрывают листьями и ветками,"
26010-260100040 = "но в городе, полном людей, лучшим камуфляжем может быть обычная одежда."
26010-260100050 = "Поэтому большинство снайперов на городских операциях носят неприметную одежду."
26010-260100060 = "Понятно. Очень интересно."
26010-260100070 = "Мию, у тебя есть любимая камуфляжная одежда?"
26010-260100080 = "Д-дело в том..."
26010-260100090 = "В моём случае"
26010-260100100 = "большинство людей не замечают меня даже без камуфляжа..."
26010-260100110 = "Поэтому единственный камуфляж, которым я действительно пользуюсь, — школьная форма..."
26010-260100120 = "Но поскольку мы едем в рыбацкую деревню, где вокруг нет студентов,"
26010-260100130 = "я хочу попробовать новый камуфляж."
26010-260100140 = "Спасибо за помощь, Сенсей..."
26010-260100150 = "Но в итоге меня заметили все остальные рыбаки..."
26010-260100160 = "Моя операция под прикрытием полностью провалилась..."
26010-260100170 = "Но рыба, которую ты поймала, была огромной, Мию."
26010-260100180 = "Да, поймать такую большую рыбу было приятно, но..."
26010-260100190 = "Но в итоге меня заметили именно потому, что я была слишком незаметной..."
26010-260100200 = "Какая загадка..."
26010-260100210 = "Поездка к морю"
26010-260100220 = "подарила мне столько особенных впечатлений."
26010-260100230 = "Неожиданная встреча..."
26010-260100240 = "Что-то знакомое в незнакомом месте..."
26010-260100250 = "Мию?"
26010-260100260 = "О чём ты?"
26010-260100270 = "А."
26010-260100280 = "Прости, Сенсей. Я просто болтаю."
26010-260100290 = "Я говорила о камешках."
26010-260100300 = "Сенсей."
26010-260100310 = "Прости..."
26010-260100320 = "Я вернула камни, которые мы собрали, туда, где им место."
26010-260100330 = "Ты так старался собирать их вместе со мной. Прости."
26010-260100340 = "Ничего. Не переживай."
26010-260100350 = "Но почему ты так сделала?"
26010-260100360 = "Я подумала и..."
26010-260100370 = "Эти камни выполняли здесь свою роль, хотя никто их не замечал."
26010-260100380 = "Если ты не можешь делать то, для чего предназначен, даже если кто-то говорит, что ты ценен..."
26010-260100390 = "Ну, мне было бы грустно..."
26010-260100400 = "Это не совсем замена, но..."
26010-260100420 = "Ты сделала фотографии!"
26010-260100430 = "О, здорово."
26010-260100440 = "Ага..."
26010-260100450 = "Так я смогу сохранить воспоминание."
26010-260100460 = "Сегодня было очень весело."
26010-260100470 = "Спасибо."
26010-260100480 = "Когда в поле я жду момента для выстрела..."
26010-260100490 = "у меня много времени смотреть в небо."
26010-260100500 = "В отличие от земли, которая никогда не движется,"
26010-260100510 = "небо постоянно меняется, мгновение за мгновением."
26010-260100520 = "Думаю, поэтому мне никогда не надоедает смотреть на небо."
26010-260100530 = "Но небо, которое я увидела у моря..."
26010-260100540 = "было немного другим."
26010-260100550 = "Чем другим?"
26010-260100560 = "Д-дело в том..."
26010-260100570 = "Ну..."
26010-260100580 = "Прости..."
26010-260100590 = "Сложно объяснить..."
26010-260100600 = "Я нашла на земле журнал, где было написано, что"
26010-260100610 = "можно привлечь внимание, просто сменив одежду."
26010-260100620 = "Если надеть наряд, который не подходит обстановке, иногда люди будут обращать на тебя больше внимания."
26010-260100630 = "Вот я и подумала, что могу надеть новый наряд"
26010-260100640 = "и прогуляться по городу."
26010-260100650 = "Пробовать новую одежду — это хорошо, но..."
26010-260100660 = "разве единственный новый наряд, который ты купила, не купальник?"
26010-260100670 = "Поговорим позже."
26010-260100680 = "Мию?"
26010-260100690 = "Мию?!"
