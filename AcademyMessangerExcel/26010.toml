[translation]
26010-260100010 = "Как лесные звери прячутся с помощью маскировочной окраски,"
26010-260100020 = "так снайперы скрывают себя с помощью маскировочных костюмов."
26010-260100030 = "На открытой местности часто используют листья и ветки..."
26010-260100040 = "Но в людных городских районах обычная одежда привлекает меньше внимания."
26010-260100050 = "Поэтому... у большинства снайперов есть специальная одежда для маскировки в городе."
26010-260100060 = "Вот как, понятно."
26010-260100070 = "У тебя тоже есть такая, Мию?"
26010-260100080 = "Ну..."
26010-260100090 = "На самом деле,"
26010-260100100 = "мне не нужна маскировка, чтобы меня не замечали..."
26010-260100110 = "Так что кроме школьной формы у меня ничего особенного..."
26010-260100120 = "Но... в этот раз операция будет в рыбацкой деревне, где почти нет студентов,"
26010-260100130 = "так что я хочу воспользоваться моментом и попробовать замаскироваться."
26010-260100140 = "Сенсей, спасибо вам за помощь..."
26010-260100150 = "В конце концов, я всё равно привлекла внимание рыбаков..."
26010-260100160 = "Можно сказать, моя маскировка провалилась..."
26010-260100170 = "Но рыба, которую ты поймала, была действительно большой."
26010-260100180 = "Да, я рада, что поймала такую крупную, но..."
26010-260100190 = "Из-за того, что меня почти не видно, я, наоборот, привлекла толпу..."
26010-260100200 = "Ничто не идёт по плану..."
26010-260100210 = "Всё-таки, когда я пришла к морю,"
26010-260100220 = "я получила необычный опыт."
26010-260100230 = "Были и неожиданные встречи,"
26010-260100240 = "и знакомые лица в неожиданных местах..."
26010-260100250 = "...Мию?"
26010-260100260 = "Что-то случилось...?"
26010-260100270 = "А"
26010-260100280 = "Простите, я неясно выразилась."
26010-260100290 = "Я о поиске камешков."
26010-260100300 = "Сенсей"
26010-260100310 = "Простите..."
26010-260100320 = "Все камешки, которые мы собирали вместе, я вернула на место."
26010-260100330 = "Вы так старались... мне очень жаль..."
26010-260100340 = "Всё в порядке, не переживай."
26010-260100350 = "Но почему ты вернула их все...?"
26010-260100360 = "После того как мы расстались, я подумала..."
26010-260100370 = "эти камешки тихо выполняли свою роль здесь..."
26010-260100380 = "И если я заберу их только потому, что они мне понравились,"
26010-260100390 = "то камешкам, наверное, станет грустно..."
26010-260100400 = "Но вместо этого"
26010-260100420 = "я сделала фотографии."
26010-260100430 = "Вот как, хорошо."
26010-260100440 = "Да."
26010-260100450 = "Сегодняшние воспоминания стали моим сокровищем..."
26010-260100460 = "Мне было очень весело провести время с вами."
26010-260100470 = "Спасибо вам."
26010-260100480 = "Выполнение заданий зависит и от погоды,"
26010-260100490 = "поэтому во время снайперских миссий я часто смотрю в небо."
26010-260100500 = "На земле всё относительно статично, но"
26010-260100510 = "небо меняется быстро."
26010-260100520 = "Поэтому... его можно разглядывать бесконечно."
26010-260100530 = "Но небо, видимое с берега моря..."
26010-260100540 = "...оно кажется немного другим."
26010-260100550 = "А чем отличается?"
26010-260100560 = "Ну..."
26010-260100570 = "У-у..."
26010-260100580 = "Простите."
26010-260100590 = "Я не могу подобрать слов..."
26010-260100600 = "Недавно я прочитала выброшенный модный журнал, и там говорилось, что"
26010-260100610 = "с помощью одежды можно привлечь внимание..."
26010-260100620 = "Если надеть что-то неподходящее для места, это привлечёт взгляды..."
26010-260100630 = "Сегодня я надену недавно купленную одежду"
26010-260100640 = "и прогуляюсь по городу."
26010-260100650 = "Идея хорошая, но..."
26010-260100660 = "это ведь не купальник...?"
26010-260100670 = "Т-тогда... я пошла."
26010-260100680 = "...Мию?"
26010-260100690 = "............Мию?"