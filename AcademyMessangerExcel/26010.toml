[translation]
26010-260100010 = "Assim como os animais selvagens da floresta usam cores de camuflagem para se esconder,"
26010-260100020 = "os atiradores de elite apagam sua presença usando trajes ghillie."
26010-260100030 = "Ao ar livre, costumamos cobrir o corpo com folhas e galhos de árvore, mas..."
26010-260100040 = "Em áreas urbanas movimentadas, vestir roupas comuns chama menos atenção."
26010-260100050 = "Por isso... a maioria dos snipers tem roupas civis para se disfarçar na cidade."
26010-260100060 = "Entendi, faz sentido."
26010-260100070 = "Você também tem, Miyu?"
26010-260100080 = "Hum..."
26010-260100090 = "Na verdade..."
26010-260100100 = "No meu caso, as pessoas já não notam a minha presença mesmo sem disfarce..."
26010-260100110 = "Então, fora o uniforme, não tenho nada em especial..."
26010-260100120 = "Mas... como esta operação vai acontecer em uma vila de pescadores onde quase não há estudantes,"
26010-260100130 = "quero aproveitar a oportunidade para tentar usar um disfarce também."
26010-260100140 = "Sensei, muito obrigada por me ajudar..."
26010-260100150 = "No fim, acabei atraindo a atenção de todos aqueles pescadores..."
26010-260100160 = "Acho que a minha infiltração foi um fracasso..."
26010-260100170 = "É que o peixe que você pescou era gigantesco mesmo, Miyu."
26010-260100180 = "Sim, fiquei feliz por ter pescado um peixão daqueles, mas..."
26010-260100190 = "Quem diria que, por ter tão pouca presença, eu acabaria juntando uma multidão ao meu redor..."
26010-260100200 = "Nada na vida sai como o planejado mesmo..."
26010-260100210 = "Vindo para a praia,"
26010-260100220 = "pude viver uma experiência especial e bem diferente do habitual."
26010-260100230 = "Tive encontros inesperados,"
26010-260100240 = "e também vi rostos familiares em lugares surpreendentes..."
26010-260100250 = "...Miyu?"
26010-260100260 = "Aconteceu alguma coisa...?"
26010-260100270 = "Ah"
26010-260100280 = "Me desculpe, ficou confuso do jeito que falei, né?"
26010-260100290 = "Estou falando de quando procuramos pedrinhas na praia."
26010-260100300 = "Sensei"
26010-260100310 = "Me desculpe..."
26010-260100320 = "Acabei devolvendo todas aquelas pedrinhas que juntamos juntos para o lugar de onde vieram."
26010-260100330 = "Você se esforçou tanto para me ajudar a procurar... Me desculpe mesmo..."
26010-260100340 = "Tudo bem, não se preocupe com isso."
26010-260100350 = "Mas por que devolveu todas...?"
26010-260100360 = "Depois que nos despedimos, fiquei pensando..."
26010-260100370 = "Percebi que aquelas pedrinhas estavam cumprindo o papel delas ali em silêncio..."
26010-260100380 = "Então, levá-las embora só porque achei bonitas..."
26010-260100390 = "Fiquei com a sensação de que as pedrinhas... ficariam solitárias..."
26010-260100400 = "Mas, em compensação..."
26010-260100420 = "Você registrou em foto!"
26010-260100430 = "Entendi, que ótima ideia."
26010-260100440 = "Sim."
26010-260100450 = "Assim posso guardar a lembrança de hoje como um tesouro..."
26010-260100460 = "Passar esse tempo com você, Sensei... foi realmente muito divertido."
26010-260100470 = "Muito obrigada."
26010-260100480 = "Como as missões dependem muito das condições climáticas,"
26010-260100490 = "costumo olhar bastante para o céu durante as missões de tocaia."
26010-260100500 = "Olhar para o chão quase não traz mudanças, mas..."
26010-260100510 = "A paisagem do céu muda muito rápido."
26010-260100520 = "Talvez por isso... eu consiga ficar olhando para ele por horas a fio."
26010-260100530 = "Só que o céu visto da beira do mar..."
26010-260100540 = "...parece um pouco diferente."
26010-260100550 = "Diferente como?"
26010-260100560 = "Hum..."
26010-260100570 = "Uugh..."
26010-260100580 = "Me desculpe."
26010-260100590 = "Não consigo... colocar em palavras direito."
26010-260100600 = "Outro dia, li uma revista de moda que tinham jogado fora..."
26010-260100610 = "E dizia que mudar o visual ajuda a chamar a atenção das pessoas..."
26010-260100620 = "Que usar propositalmente uma roupa que destoe do ambiente atrai os olhares..."
26010-260100630 = "Hoje vou vestir a roupa que comprei recentemente"
26010-260100640 = "e tentar caminhar pela cidade."
26010-260100650 = "Acho uma boa ideia, mas..."
26010-260100660 = "Não está falando do maiô, né...?"
26010-260100670 = "B-bom... já estou indo."
26010-260100680 = "...Miyu?"
26010-260100690 = ".........Senhorita Miyu?"
