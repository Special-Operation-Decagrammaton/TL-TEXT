[translation]
10058-100580010 = "Sensei."
10058-100580020 = "Imagino que esteja ocupado, mas... se possível, poderia me ceder um pouco do seu tempo hoje?"
10058-100580030 = "Se é um pedido seu, Mine, claro que sim."
10058-100580040 = "Muito obrigada."
10058-100580050 = "Então, o que houve?"
10058-100580060 = "Parando para pensar..."
10058-100580070 = "Aceitar o meu pedido de prontidão assim, sem nem mesmo perguntar do que se trata..."
10058-100580080 = "Faz-me pensar que você é realmente uma pessoa querida e digna de toda a minha confiança, Sensei."
10058-100580090 = "Não pude deixar de ter esse pensamento."
10058-100580100 = "Mine...?"
10058-100580110 = "Sensei, por mais raro que pareça..."
10058-100580120 = "Hoje estou com o dia livre."
10058-100580130 = "D-descansar também é importante!"
10058-100580140 = "O que você costuma fazer quando tem tempo livre, Mine?"
10058-100580150 = "Vejamos..."
10058-100580160 = "Não sei se posso chamar isso de hobby, mas..."
10058-100580170 = "Costumo passar o tempo admirando os suprimentos médicos que colecionei."
10058-100580180 = "Admirando suprimentos médicos...?"
10058-100580190 = "Sim."
10058-100580200 = "Quando fico comparando a eficácia de cada um ou imaginando situações para usá-los..."
10058-100580210 = "É tão fascinante que o tempo voa num piscar de olhos."
10058-100580220 = "Nunca tinha ouvido falar de um hobby desses..."
10058-100580230 = "Não diga?"
10058-100580240 = "Nesse caso, aproveitando a oportunidade..."
10058-100580250 = "Eu gostaria muito de lhe mostrar a minha coleção de suprimentos médicos..."
10058-100580260 = "Você poderia vir até aqui?"
10058-100580270 = "Sensei."
10058-100580280 = "Poderia me conceder um momento hoje à tarde?"
10058-100580290 = "Com certeza, sem problemas."
10058-100580300 = "É sobre a patrulha de socorro de antes?"
10058-100580310 = "Já concluí a patrulha de socorro de hoje pela manhã."
10058-100580320 = "Por isso, pensei que talvez pudéssemos apreciar um chá da tarde juntos, Sensei."
10058-100580330 = "Vou terminar o trabalho rapidinho aqui e já vou!"
10058-100580340 = "Muito obrigada."
10058-100580350 = "Estarei aguardando, então."
10058-100580360 = "Esta é a primeira vez que ajudo no trabalho da Schale."
10058-100580370 = "Há algo que seja melhor eu deixar preparado com antecedência?"
10058-100580380 = "Não, não precisa trazer nada em especial."
10058-100580390 = "Entendo."
10058-100580400 = "Nesse caso, há alguma regra ou ponto de atenção que eu deva saber previamente...?"
10058-100580410 = "Os detalhes eu te explico quando você chegar aqui."
10058-100580420 = "Compreendido."
10058-100580430 = "Irei até aí mais tarde, então."
10058-100580440 = "É um pouco embaraçoso admitir algo assim, mas..."
10058-100580450 = "Na verdade... estou bastante nervosa."
