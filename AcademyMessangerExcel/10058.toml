[translation]
10058-100580010 = "Сенсей."
10058-100580020 = "Если у тебя есть минутка, я хотела бы попросить твоего времени сегодня."
10058-100580030 = "Проси что угодно, Минэ."
10058-100580040 = "Спасибо!"
10058-100580050 = "Так что случилось?"
10058-100580060 = "Ты только сейчас спрашиваешь подробности?"
10058-100580070 = "Ты согласился на мою просьбу вслепую."
10058-100580080 = "Сенсей, твои поступки действительно достойны драгоценного человека."
10058-100580090 = "Надёжного человека."
10058-100580100 = "Эм... Минэ...?"
10058-100580110 = "Я столкнулась с редкой ситуацией."
10058-100580120 = "Похоже, в моём расписании ничего нет."
10058-100580130 = "Это и правда довольно неожиданно."
10058-100580140 = "У тебя есть хобби или что-нибудь, чем занимаешься в свободное время?"
10058-100580150 = "Хм..."
10058-100580160 = "Хобби я бы это не назвала, но..."
10058-100580170 = "я провожу инвентаризацию собранных медицинских принадлежностей."
10058-100580180 = "Ты коллекционируешь медицинские принадлежности?"
10058-100580190 = "Да."
10058-100580200 = "Мне это нравится..."
10058-100580210 = "Я сравниваю и предполагаю, какой эффект даёт каждая из них."
10058-100580220 = "Это, конечно... интересное хобби."
10058-100580230 = "Да."
10058-100580240 = "Если тебе интересно..."
10058-100580250 = "я хотела бы показать тебе свою коллекцию."
10058-100580260 = "Если ты не возражаешь, я хотела бы пригласить тебя в свою комнату."
10058-100580270 = "Сенсей."
10058-100580280 = "Ты свободен сегодня днём?"
10058-100580290 = "Ага, сегодня ничего не запланировано."
10058-100580300 = "Это насчёт патруля?"
10058-100580310 = "Патруль я закончила рано утром."
10058-100580320 = "Поэтому надеялась устроить с тобой чаепитие днём."
10058-100580330 = "Для тебя я найду время, даже если времени нет!"
10058-100580340 = "Тогда буду ждать."
10058-100580350 = "Спасибо."
10058-100580360 = "Я впервые буду работать в Шале."
10058-100580370 = "Нужно ли мне подготовить что-то особенное?"
10058-100580380 = "Не нужно относиться к этому так серьёзно..."
10058-100580390 = "Понятно."
10058-100580400 = "Есть ли какие-нибудь правила поведения или инструкции, которым я должна следовать?"
10058-100580410 = "Я же говорю, это не настолько серьёзно..."
10058-100580420 = "Кажется, я понимаю."
10058-100580430 = "Тогда увидимся в Шале."
10058-100580440 = "Немного неловко признаваться,"
10058-100580450 = "но я довольно нервничаю."
