[translation]
10058-100580010 = "Сенсей."
10058-100580020 = "Я знаю, вы заняты, но... если вам не трудно, не могли бы вы уделить мне немного времени сегодня?"
10058-100580030 = "Если просишь ты, Мине, я всегда готов."
10058-100580040 = "Благодарю вас."
10058-100580050 = "Так что случилось?"
10058-100580060 = "Если подумать,"
10058-100580070 = "вы соглашаетесь помочь, даже не спросив, в чём дело..."
10058-100580080 = "Наверное, вы для меня очень важный и надёжный человек."
10058-100580090 = "Мне так кажется."
10058-100580100 = "Мине...?"
10058-100580110 = "Сенсей, какая редкость..."
10058-100580120 = "Сегодня у меня есть свободное время."
10058-100580130 = "Отдыхать тоже важно!"
10058-100580140 = "Чем ты занимаешься, когда есть время, Мине?"
10058-100580150 = "Ну..."
10058-100580160 = "Не знаю, можно ли это назвать хобби,"
10058-100580170 = "но я люблю рассматривать собранные медицинские принадлежности."
10058-100580180 = "Рассматривать медицинские принадлежности...?"
10058-100580190 = "Да."
10058-100580200 = "Когда я сравниваю их свойства и представляю, где их можно использовать..."
10058-100580210 = "это так увлекательно, что время пролетает незаметно."
10058-100580220 = "Впервые слышу о таком хобби..."
10058-100580230 = "Вот как."
10058-100580240 = "Тогда, раз уж есть такая возможность,"
10058-100580250 = "я хотела бы показать вам свои медицинские принадлежности..."
10058-100580260 = "не зайдёте ли?"
10058-100580270 = "Сенсей."
10058-100580280 = "Не могли бы вы уделить мне немного времени сегодня после обеда?"
10058-100580290 = "Конечно."
10058-100580300 = "Речь о том дежурном обходе?"
10058-100580310 = "Сегодняшний обход я закончила утром."
10058-100580320 = "Я подумала, не провести ли нам чаепитие во второй половине дня."
10058-100580330 = "Я быстро закончу дела и приду!"
10058-100580340 = "Спасибо вам."
10058-100580350 = "Тогда я буду ждать."
10058-100580360 = "Я впервые помогаю с работой в Шале."
10058-100580370 = "Нужно ли что-то подготовить?"
10058-100580380 = "Нет, даже если ничего не будет, всё в порядке."
10058-100580390 = "Понятно."
10058-100580400 = "Тогда, может, есть какие-то правила или что-то, на что стоит обратить внимание?"
10058-100580410 = "Объясню на месте, когда придёшь."
10058-100580420 = "Хорошо."
10058-100580430 = "Тогда я зайду позже."
10058-100580440 = "Мне неловко говорить об этом,"
10058-100580450 = "но... я очень волнуюсь."
