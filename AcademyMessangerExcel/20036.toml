[translation]
20036-200360010 = "Так"
20036-200360020 = "В основном всё убрала!"
20036-200360030 = "Ты молодец, Серика."
20036-200360040 = "Что будешь делать дальше?"
20036-200360050 = "Что за вопрос?"
20036-200360060 = "Отдыхать по полной!"
20036-200360070 = "Я не говорю, что восстановительные работы не были весёлыми, но..."
20036-200360080 = "Этого недостаточно для отличного отдыха!"
20036-200360090 = "Вы пойдёте со мной, Сенсей!"
20036-200360100 = "Слушай"
20036-200360110 = "Сенсей"
20036-200360120 = "Мои вещи случайно не у тебя..."
20036-200360130 = "Я их храню."
20036-200360140 = "Отдам завтра."
20036-200360150 = "Что"
20036-200360160 = "Ах"
20036-200360170 = "Да."
20036-200360180 = "...Спасибо."
20036-200360190 = "Кстати, Сенсей"
20036-200360200 = "Я нашла кое-что интересное на складе."
20036-200360210 = "Не взглянешь?"
20036-200360220 = "А, если вы заняты, ничего страшного."
20036-200360230 = "Что ты нашла?"
20036-200360240 = "Я сейчас подойду, как только соберусь."
20036-200360250 = "Ну"
20036-200360260 = "ничего особенного, но..."
20036-200360270 = "Я пойду вперёд и буду ждать!"
20036-200360280 = "Сенсей!"
20036-200360290 = "Куда ты делся!"
20036-200360300 = "Ну всё, я тебя не прощу!"
20036-200360310 = "В сновидениях..."
20036-200360320 = "В твоём сердце, Серика..."
20036-200360330 = "Готовься!"
20036-200360340 = "Я тебя найду!"
20036-200360350 = "Как поймаю — привяжу к лодке!!"
20036-200360360 = "Вздох"
20036-200360370 = "Пыли оказалось больше, чем я думала, тяжело."
20036-200360380 = "Мы слишком долго не убирались в тех местах, которые не видно."
20036-200360390 = "Ты что, убираешься в классе?"
20036-200360400 = "А где остальные?"
20036-200360410 = "У них, кажется, дела."
20036-200360420 = "А у меня как раз было свободное время."
20036-200360430 = "Я подумала, раз уж так, почему бы не прибраться."
20036-200360440 = "Тогда это моя очередь."
20036-200360450 = "Я приду помочь."
20036-200360460 = "?"
20036-200360470 = "Что?"
20036-200360480 = "Сенсей?"
20036-200360490 = "Я так и знала."
20036-200360500 = "В следующий раз так не делай!"
20036-200360510 = "Ни за что!"
20036-200360520 = "Ты ещё напишешь."
20036-200360530 = "Я всегда могу зайти."
20036-200360540 = "Да"
20036-200360550 = "Ах"
20036-200360560 = "Нет"
20036-200360570 = "Нет-нет-нет!"
20036-200360580 = "Я не это имела в виду! Ничего!!"