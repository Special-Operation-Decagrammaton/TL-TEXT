[translation]
20036-200360010 = "Pronto"
20036-200360020 = "Já terminei de organizar quase tudo!"
20036-200360030 = "Bom trabalho, Serika"
20036-200360040 = "O que você vai fazer agora?"
20036-200360050 = "Não é óbvio?"
20036-200360060 = "Aproveitar as melhores férias de todas!"
20036-200360070 = "Não é que ajudar na reconstrução não tenha sido divertido, mas..."
20036-200360080 = "Não dá pra chamar de férias perfeitas se for só isso, né?!"
20036-200360090 = "E você vem junto comigo, Sensei!"
20036-200360100 = "Ei"
20036-200360110 = "Sensei"
20036-200360120 = "Por acaso a minha bagagem tá aí com você...?"
20036-200360130 = "Tá guardada comigo sim"
20036-200360140 = "Amanhã eu te entrego"
20036-200360150 = "Ah"
20036-200360160 = "Hã"
20036-200360170 = "Tá"
20036-200360180 = "...Obrigada"
20036-200360190 = "Aliás, Sensei"
20036-200360200 = "Achei uma coisa bem interessante lá no depósito"
20036-200360210 = "Não quer vir dar uma olhada?"
20036-200360220 = "Ah, mas se estiver ocupado, tudo bem"
20036-200360230 = "O que você achou?"
20036-200360240 = "Assim que eu me arrumar, vou aí"
20036-200360250 = "Bom"
20036-200360260 = "Também não é nada tão grandioso assim, mas..."
20036-200360270 = "Vou indo na frente e te espero lá!"
20036-200360280 = "Sensei!"
20036-200360290 = "Pra onde você foi?!"
20036-200360300 = "Aff, dessa vez eu não te perdoo!"
20036-200360310 = "Nos seus sonhos..."
20036-200360320 = "No coração da Serika..."
20036-200360330 = "Pode ir se preparando!"
20036-200360340 = "Vou te achar rapidinho!"
20036-200360350 = "Quando eu te pegar, vou te amarrar num bote, viu?!"
20036-200360360 = "Ufa..."
20036-200360370 = "Tem muito mais poeira do que eu pensava, que sufoco"
20036-200360380 = "Acabei deixando de lado por tempo demais só porque ficava escondido"
20036-200360390 = "Tá limpando a sala de aula?"
20036-200360400 = "E o resto do pessoal?"
20036-200360410 = "Parece que todo mundo tinha compromisso"
20036-200360420 = "Como eu estava com tempo livre"
20036-200360430 = "Pensei em aproveitar pra dar uma geral"
20036-200360440 = "Então essa é a minha deixa"
20036-200360450 = "Estou indo aí te ajudar"
20036-200360460 = "?"
20036-200360470 = "Quê?"
20036-200360480 = "Sensei?"
20036-200360490 = "Eu sabia que ia acabar assim"
20036-200360500 = "Não vai ter próxima vez!"
20036-200360510 = "De jeito nenhum!"
20036-200360520 = "Me manda mensagem de novo depois"
20036-200360530 = "Venho te visitar a qualquer hora"
20036-200360540 = "Tá..."
20036-200360550 = "Ah"
20036-200360560 = "Não"
20036-200360570 = "Não, não, não!"
20036-200360580 = "Não é isso! Deixa pra lá!!"
