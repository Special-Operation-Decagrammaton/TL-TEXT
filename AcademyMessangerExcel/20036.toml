[translation]
20036-200360010 = "Хорошо"
20036-200360020 = "С уборкой покончено! Пора!"
20036-200360030 = "Пора чего?"
20036-200360040 = "Пора... что-то сделать?"
20036-200360050 = "Я разве не говорила?!"
20036-200360060 = "Какая бы ни была ситуация, я всё равно устрою себе лучший отпуск на свете!"
20036-200360070 = "Я рада, что с обслуживанием и всем остальным в итоге разобрались..."
20036-200360080 = "Но моего «лучшего отпуска» у меня всё ещё не было!"
20036-200360090 = "Это не пустяк. Лучше приготовься, Сенсей!"
20036-200360100 = "А."
20036-200360110 = "Странно"
20036-200360120 = "Сенсей, случайно..."
20036-200360130 = "Я подобрал это, не переживай."
20036-200360140 = "Я сохраню это до завтра, так что отдохни. Уже поздно."
20036-200360150 = "О."
20036-200360160 = "А."
20036-200360170 = "Ага"
20036-200360180 = "Спасибо."
20036-200360190 = "Кстати, Сенсей"
20036-200360200 = "Я нашла кое-что довольно крутое в сарае."
20036-200360210 = "Хочешь выйти со мной и посмотреть?"
20036-200360220 = "Если только ты не занят или типа того. Мне всё равно!"
20036-200360230 = "О? Что такое?"
20036-200360240 = "На улицу? Это что-то, с чем можно поиграть?"
20036-200360250 = "Ну..."
20036-200360260 = "Только не жди ничего особенного..."
20036-200360270 = "Просто... Просто приходи посмотреть, раз тебе так интересно!"
20036-200360280 = "Я заставлю тебя заплатить!"
20036-200360290 = "Где вы?"
20036-200360300 = "Ты сейчас где?!"
20036-200360310 = "Везде, где живут воспоминания..."
20036-200360320 = "В сердце нашей дорогой Серики"
20036-200360330 = "Хватит нести эту чушь!"
20036-200360340 = "Лучше молись, чтобы я тебя не поймала!"
20036-200360350 = "Я привяжу тебя к лодке и вытащу наружу!"
20036-200360360 = "Уф."
20036-200360370 = "Тут пыльнее, чем я ожидала..."
20036-200360380 = "С глаз долой — из сердца вон, видимо."
20036-200360390 = "Ты убираешь клубную комнату? Одна?"
20036-200360400 = "А остальные участницы что делают?"
20036-200360410 = "Все чем-то заняты."
20036-200360420 = "Только у меня действительно есть свободное время."
20036-200360430 = "Вот я и решила немного прибраться."
20036-200360440 = "Ага. Похоже, это мой выход."
20036-200360450 = "Уже иду помогать."
20036-200360460 = "?"
20036-200360470 = "Что?"
20036-200360480 = "Сенсей?"
20036-200360490 = "Я знала, что так будет"
20036-200360500 = "Следующего раза не будет."
20036-200360510 = "Никогда!"
20036-200360520 = "Зови меня ещё."
20036-200360530 = "Я всегда свободен."
20036-200360540 = "Ага"
20036-200360550 = "А."
20036-200360560 = "Погоди."
20036-200360570 = "Нетнетнет!!!"
20036-200360580 = "Нет!!"
