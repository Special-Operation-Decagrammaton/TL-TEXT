[translation]
16002-1249 = "Если что-то интересует, всегда, что угодно, сколько угодно раз!"
16002-1250 = "Не утруждайтесь поисками, обязательно спрашивайте у меня, Котори!"
16002-1251 = "Специализация Котори — естественные науки в целом?"
16002-1252 = "Всё...?"
16002-1253 = "Ну, да..."
16002-1254 = "Формально моя специализация — преимущественно естественные науки, но"
16002-1255 = "в основном, всё в порядке!"
16002-1256 = "Если я могу это объяснить, я готова ко всему!"
16002-1257 = "Сенсей? Куда вы ушли?"
16002-1258 = "Вы ведь не сбежали, правда?"
16002-1259 = "...Сенсей?"
16002-1260 = "Если что-то интересует, всегда говорите!"
16002-1261 = "Рядом с вашим любопытством всегда будет Котори!"
16002-1262 = "Спасибо, Сенсей! Я потрясена!"
16002-1263 = "Не ожидала, что вы так быстро поймёте!"
16002-1264 = "...Эм, Сенсей, если можно, хотя бы иногда,"
16002-1265 = "...пожалуйста, рассчитывайте на меня!"
16002-1266 = "Сенсей."
16002-1267 = "У вас есть сейчас время?"
16002-1268 = "А, это не очень важно, но"
16002-1269 = "нет, лично для меня это важно...!"
16002-1270 = "К-короче..."
16002-1271 = "Ну,"
16002-1272 = "можно сказать, вопрос"
16002-1273 = "я хочу кое-что спросить...!"
16002-1274 = "Всё в порядке, что случилось?"
16002-1275 = "Вопрос, а не объяснение?"
16002-1276 = "А"
16002-1277 = "Спасибо!"
16002-1278 = "Без колебаний, как и ожидалось от Сенсея!"
16002-1279 = "Для вывода нужен ввод."
16002-1280 = "И к тому же"
16002-1281 = "это именно то, что я хочу спросить у вас!"
16002-1282 = "Хе-хе, тогда в том месте"
16002-1283 = "Жду!"
16002-1284 = "...Эм"
16002-1285 = "А, ещё раз спасибо за тот раз!"
16002-1286 = "Я правильно сделала, что спросила у Сенсея!"
16002-1287 = "Теперь я смогу всё как следует объяснить!"
16002-1288 = "Это хорошо."
16002-1289 = "Так что же это было?"
16002-1290 = "Хе-хе..."
16002-1291 = "Да, правда хорошо."
16002-1292 = "Спасибо, Сенсей!"
16002-1293 = "Э-это..."
16002-1294 = "Ну..."
16002-1295 = "..."
16002-1296 = "Секрет..."
16002-1297 = "Эм, тогда до встречи."
16002-160020010 = "Доброе утро! Если что-то интересует, всегда говорите!"
16002-160020020 = "Если есть сомнения или вопросы, всегда обращайтесь ко мне, Котори!"
16002-160020030 = "..."
16002-160020040 = "На всякий случай..."
16002-160020050 = "Вы ведь не поставили меня на беззвучный режим?"
16002-160020060 = "Иногда такое бывает..."
16002-160020070 = "Нет, такого нет, и кстати, я как раз хотел кое-что спросить."
16002-160020080 = "Отличный момент, у меня есть вопрос, Котори!"
16002-160020090 = "..."
16002-160020100 = "П-п"
16002-160020110 = "Правда!?"
16002-160020120 = "Положись на меня, я отвечу на всё!"
16002-160020130 = "Тогда, Котори! Я сейчас приду! >_<"
16002-160020140 = "Извини"
16002-160020150 = "Извините, Сенсей... ну, это был настолько неожиданный вопрос..."
16002-160020160 = "Правда, он застал меня врасплох..."
16002-160020170 = "Извините, кажется, такое уже было..."
16002-160020180 = "..."
16002-160020190 = "Эм"
16002-160020200 = "Если в следующий раз будет удобно"
16002-160020210 = "нет, я ещё не готова, так что не прямо сейчас,"
16002-160020220 = "но можно в тот раз?"
16002-160020230 = "Я точно"
16002-160020240 = "дам точный ответ."
16002-160020250 = "Фух!"
16002-160020260 = "Было опасно!"
16002-160020270 = "Котори?"
16002-160020280 = "Что случилось?"
16002-160020290 = "А, ничего серьёзного!"
16002-160020300 = "Дело в том, что у меня сломались очки, и я отдала их в ремонт."
16002-160020310 = "Я думала, что один день без них обойдусь,"
16002-160020320 = "но с моим зрением это оказалось невозможно! Ахаха!!"