[translation]
16002-1249 = "Se tiver qualquer curiosidade, a qualquer hora, sobre qualquer coisa e quantas vezes quiser!"
16002-1250 = "Nem precisa se dar ao trabalho de pesquisar, pode perguntar direto para a Kotori aqui!"
16002-1251 = "Sua especialidade eram ciências naturais em geral, né, Kotori?"
16002-1252 = "Qualquer coisa mesmo......?"
16002-1253 = "Hum, pois é......"
16002-1254 = "Tecnicamente a minha área principal é ciências naturais em geral, mas,"
16002-1255 = "Basicamente, pode perguntar qualquer coisa!"
16002-1256 = "Desde que seja algo que eu consiga explicar, pode mandar ver sem medo!"
16002-1257 = "Sensei? Aonde você foi?"
16002-1258 = "Não me diga que você fugiu?!"
16002-1259 = "......Sensei?"
16002-1260 = "Se tiver curiosidade sobre qualquer coisa, é só me chamar a qualquer hora, viu!"
16002-1261 = "Onde houver curiosidade intelectual, a Kotori estará sempre por perto!"
16002-1262 = "Muito obrigada, Sensei! Fiquei emocionada!"
16002-1263 = "Jamais imaginei que você fosse entender tudo tão rápido!"
16002-1264 = "......Hum, Sensei, se não for incômodo, mesmo que seja só de vez em quando,"
16002-1265 = "......Conto com você de novo, tá bom?!"
16002-1266 = "Sensei"
16002-1267 = "Você teria um tempinho agora?"
16002-1268 = "Ah, não é nada demais, mas"
16002-1269 = "Quer dizer, para mim pessoalmente é algo bem importante......!"
16002-1270 = "E-Enfim......"
16002-1271 = "É que,"
16002-1272 = "Eu tenho uma pequena dúvida, digamos assim"
16002-1273 = "Tem uma coisa que eu gostaria de te perguntar......!"
16002-1274 = "Tudo bem, o que houve?"
16002-1275 = "Uma pergunta, e não uma explicação?"
16002-1276 = "Ah,"
16002-1277 = "Muito obrigada!"
16002-1278 = "Sem hesitar nem um segundo! Não esperava menos de você, Sensei!"
16002-1279 = "Afinal, para ter um bom output é preciso ter um bom input primeiro"
16002-1280 = "Além do mais,"
16002-1281 = "É algo que eu queria perguntar especificamente para você, Sensei, e mais ninguém!"
16002-1282 = "Hehe, então lá naquele lugar"
16002-1283 = "Estarei te esperando!"
16002-1284 = "......Hum"
16002-1285 = "M-Mais uma vez, muito obrigada por agora há pouco!"
16002-1286 = "Sabia que perguntar para você era a decisão certa, Sensei!"
16002-1287 = "Acho que agora vou conseguir explicar tudo direitinho!"
16002-1288 = "Que ótima notícia"
16002-1289 = "Mas afinal, do que se tratava?"
16002-1290 = "Ehehe......"
16002-1291 = "Sim, que bom mesmo"
16002-1292 = "Muito obrigada, Sensei!"
16002-1293 = "I-Isso é......"
16002-1294 = "Hum......"
16002-1295 = "......"
16002-1296 = "É segredo......"
16002-1297 = "Hum, então, até mais"
16002-160020010 = "Bom dia! Se tiver curiosidade sobre qualquer assunto, é só falar a qualquer hora!"
16002-160020020 = "Qualquer dúvida ou pergunta, pode contar sempre com a Kotori aqui!"
16002-160020030 = "......"
16002-160020040 = "Só por desencargo de consciência......"
16002-160020050 = "Hum, você não silenciou as minhas notificações, né......?"
16002-160020060 = "É que às vezes fazem isso comigo......"
16002-160020070 = "Claro que não! Inclusive, tinha mesmo uma coisa que eu queria te perguntar"
16002-160020080 = "Na hora certa! Tenho uma pergunta, senhorita Kotori!"
16002-160020090 = "......"
16002-160020100 = "S-"
16002-160020110 = "Sério mesmo?!"
16002-160020120 = "Pode deixar comigo, eu respondo qualquer coisa!"
16002-160020130 = "Então a Kotori já está indo aí agora mesmo! >_<"
16002-160020140 = "Me descul"
16002-160020150 = "Me desculpe, Sensei...... É que foi uma pergunta tão inesperada, digamos assim......"
16002-160020160 = "Eu realmente fui pega completamente de surpresa......"
16002-160020170 = "Desculpe, tenho a impressão de que já aconteceu algo parecido antes......"
16002-160020180 = "......"
16002-160020190 = "Hum"
16002-160020200 = "Se tudo bem para você, numa próxima vez"
16002-160020210 = "Quer dizer, como ainda não estou preparada, não vai ser já, mas"
16002-160020220 = "Pode ficar para quando eu estiver pronta?"
16002-160020230 = "Eu prometo"
16002-160020240 = "Eu prometo que vou trazer uma resposta direitinho"
16002-160020250 = "Ufa!"
16002-160020260 = "Essa foi por pouco!"
16002-160020270 = "Kotori?"
16002-160020280 = "O que aconteceu?"
16002-160020290 = "Ah, não foi nada demais!"
16002-160020300 = "É que meus óculos quebraram e eu mandei para o conserto"
16002-160020310 = "Achei que daria para aguentar pelo menos um diazinho sem eles, mas"
16002-160020320 = "Com a minha miopia foi impossível! Ahaha!!"
