[translation]
16002-1249 = "Спрашивайте меня о чём угодно! В любое время и в любом месте!"
16002-1250 = "Не нужно никуда больше идти! Просто спросите Котори!"
16002-1251 = "Научные знания?"
16002-1252 = "Что угодно...?"
16002-1253 = "Эм..."
16002-1254 = "Да, наука — моя специализация,"
16002-1255 = "но спрашивать можно о чём угодно!"
16002-1256 = "Если этому есть объяснение!"
16002-1257 = "Сенсей? Куда вы делись?"
16002-1258 = "...Вы сбежали?"
16002-1259 = "...Сенсей?"
16002-1260 = "Если у вас будут вопросы, просто спрашивайте меня в любое время!"
16002-1261 = "Я отвечу на все ваши вопросы!"
16002-1262 = "Спасибо, Сенсей! Я тронута..."
16002-1263 = "Я и представить не могла, что кто-то поймёт!"
16002-1264 = "Так что можете ждать, что я буду спрашивать вас..."
16002-1265 = "Время от времени!"
16002-1266 = "Сенсей"
16002-1267 = "Вы сейчас свободны?"
16002-1268 = "О, ничего."
16002-1269 = "То есть это довольно важно!"
16002-1270 = "В общем..."
16002-1271 = "Я просто..."
16002-1272 = "Эм..."
16002-1273 = "Хочу кое-что у вас спросить!"
16002-1274 = "Что угодно."
16002-1275 = "Вопрос, а не объяснение?"
16002-1276 = "О-о-о!"
16002-1277 = "Спасибо!"
16002-1278 = "Я знала, что на тебя можно рассчитывать!"
16002-1279 = "Я знаю, что умная, но и у меня могут быть вопросы!"
16002-1280 = "И кроме того..."
16002-1281 = "Я спрашиваю не кого попало. Я спрашиваю ВАС!"
16002-1282 = "Хи-хи-хи."
16002-1283 = "Буду ждать!"
16002-1284 = "..."
16002-1285 = "Большое спасибо!"
16002-1286 = "Позвонить вам — всегда хорошая идея!"
16002-1287 = "Думаю, я смогу всё нормально объяснить! Не волнуйтесь!"
16002-1288 = "Какое облегчение."
16002-1289 = "О чём речь?"
16002-1290 = "Хи-хи..."
16002-1291 = "Вот именно! Какое облегчение."
16002-1292 = "Спасибо, Сенсей."
16002-1293 = "..."
16002-1294 = "Это..."
16002-1295 = "Это секрет."
16002-1296 = "Это секрет."
16002-1297 = "Ладно, пока!"
16002-160020010 = "Если у вас будут вопросы, просто спрашивайте меня в любое время!"
16002-160020020 = "Я отвечу на все ваши вопросы!"
16002-160020030 = "..."
16002-160020040 = "Кажется, я отправляла одно и то же сообщение уже тысячу раз..."
16002-160020050 = "Мне просто интересно, вы ведь не добавили меня... в спам-фильтр?"
16002-160020060 = "Иногда такое бывает..."
16002-160020070 = "Вообще-то у меня был вопрос."
16002-160020080 = "Как вовремя! У меня вопрос!"
16002-160020090 = "..."
16002-160020100 = "Ого."
16002-160020110 = "......!!!!!!!! Правда?!"
16002-160020120 = "Ура, я так рада это слышать! Спрашивайте что угодно!"
16002-160020130 = "Котори уже в пути!! >_<!!"
16002-160020140 = "Прос"
16002-160020150 = "Простите, Сенсей... Я совсем не ожидала вашего вопроса, поэтому..."
16002-160020160 = "Я правда не ожидала, что вы такое спросите..."
16002-160020170 = "Кстати, кажется, нечто подобное уже случалось."
16002-160020180 = "Хмм.... Эмм..."
16002-160020190 = "Эм..."
16002-160020200 = "В следующий раз..."
16002-160020210 = "В следующий раз, если можно, пожалуйста, спрашивайте, когда я буду готова!"
16002-160020220 = "Пожалуйста, спросите меня снова..."
16002-160020230 = "В следующий раз..."
16002-160020240 = "Обещаю, я смогу ответить."
16002-160020250 = "Фух!"
16002-160020260 = "Это могло закончиться катастрофой!"
16002-160020270 = "Котори?"
16002-160020280 = "Что такое?"
16002-160020290 = "А! Ничего!"
16002-160020300 = "Мои очки немного сломались, поэтому я отдала их в ремонт."
16002-160020310 = "Я думала, что один день выдержу без них,"
16002-160020320 = "но оказалось, с плохим зрением это довольно сложно! Ха-ха!!"
