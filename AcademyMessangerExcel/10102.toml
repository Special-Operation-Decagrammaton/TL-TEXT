[translation]
10102-101020010 = "Olá, Sen"
10102-101020020 = "sei. Ehehe"
10102-101020030 = "Olá, Hiyori."
10102-101020040 = "Parece que o Wi-Fi continua ruim como sempre, né...?"
10102-101020050 = "As ruínas onde estamos agora são bem abafadas e o Wi-Fi cai toda hora, mas..."
10102-101020060 = "A-Ainda dá para aguentar...!"
10102-101020070 = "Afinal, ficou decidido que vamos para a praia!"
10102-101020080 = "E acima de tudo,"
10102-101020090 = "estou super animada pelos biquínis fofos!"
10102-101020100 = "Quem sabe"
10102-101020110 = "eu não consiga ganhar um traje de banho de graça!"
10102-101020120 = "Sensei"
10102-101020130 = "Este biquíni..."
10102-101020140 = "D-Deu algum problema?"
10102-101020150 = "Sim, na verdade deu um problema..."
10102-101020160 = "Hiyori, isso..."
10102-101020170 = "Este biquíni é um pouco pequeno!"
10102-101020180 = "Eu devia ter anotado as minhas medidas direitinho!"
10102-101020190 = "Ah, entendi."
10102-101020200 = "Mas ele só está um pouquinho apertado, então acho que dá para vestir."
10102-101020210 = "Mal posso esperar para ir à praia!"
10102-101020220 = "Que estranho..."
10102-101020230 = "Por que será que a minha pele começa a arder quando tomo sol...?"
10102-101020240 = "Sabia que até curtir uma praia seria sofrido para mim..."
10102-101020250 = "A mim não é permitido sequer aproveitar o verão..."
10102-101020260 = "Você passou protetor solar?"
10102-101020270 = "Hum..."
10102-101020280 = "Por via das dúvidas, passei um substituto no lugar, mas..."
10102-101020290 = "Minha pele está coçando cada vez mais..."
10102-101020300 = "Um substituto...?"
10102-101020310 = "Sensei, o"
10102-101020320 = "lá, aqui é a Hiyori."
10102-101020330 = "Olá, Hiyori."
10102-101020340 = "Na verdade, tem uma coisa que eu gostaria de conversar com você."
10102-101020350 = "Sensei, está conseguindo ver?"
10102-101020360 = "(Imagem)"
10102-101020370 = "(Vídeo)"
10102-101020380 = "(Hiyori enviou um cupom de presente)"
10102-101020390 = "Ué..."
10102-101020400 = "O \"Método Infalível para Fazerem Lerem seu MomoTalk\" não funciona!?"
10102-101020410 = "Calma, Hiyori. É só por causa do Wi-Fi!"
10102-101020420 = "Ah, que alívio..."
10102-101020430 = "Sensei, você poderia vir até a praia hoje no fim da tarde?"
10102-101020440 = "O motivo ainda é segredo...!"
10102-101020450 = "Hoje foi muito divertido, Sensei..."
10102-101020460 = "Aconteceram alguns imprevistos, mas..."
10102-101020470 = "Eu também me diverti muito graças a você, Hiyori."
10102-101020480 = "Ehehe, que bom..."
10102-101020490 = "Eu"
10102-101020500 = "Eu também me diverti muito."
10102-101020510 = "Brincar com fogos de artifício junto com você, Sensei..."
10102-101020520 = "...Tornou-se uma lembrança inesquecível."
