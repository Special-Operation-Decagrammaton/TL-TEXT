[translation]
10102-101020010 = "Здравствуйте, Сен"
10102-101020020 = "сей. Хе-хе."
10102-101020030 = "Здравствуй, Хиёри."
10102-101020040 = "У тебя по-прежнему проблемы с Wi-Fi, похоже..."
10102-101020050 = "В заброшенном здании, где я сейчас, душно, и Wi-Fi постоянно обрывается, но..."
10102-101020060 = "Я ещё терплю...!"
10102-101020070 = "Раз уж мы едем на море!"
10102-101020080 = "И к тому же"
10102-101020090 = "Я так рада красивому купальнику!"
10102-101020100 = "Может быть,"
10102-101020110 = "Мне даже достанется купальник бесплатно!"
10102-101020120 = "Сенсей."
10102-101020130 = "Этот купальник..."
10102-101020140 = "Что-то не так?"
10102-101020150 = "Да, проблема в том, что..."
10102-101020160 = "Хиёри, это же..."
10102-101020170 = "Этот купальник мне маловат!"
10102-101020180 = "Надо было правильно указать свой размер!"
10102-101020190 = "А, понятно."
10102-101020200 = "Но он чуть тесноват, так что, наверное, надеть можно."
10102-101020210 = "Я просто не могу дождаться, когда поеду на море!"
10102-101020220 = "Странно..."
10102-101020230 = "Почему от солнца кожа начинает болеть...?"
10102-101020240 = "Наверное, даже радоваться пляжу мне тяжело."
10102-101020250 = "Мне даже наслаждаться летом не позволено..."
10102-101020260 = "Ты нанесла солнцезащитный крем?"
10102-101020270 = "Ну..."
10102-101020280 = "Я нанесла что-то вместо него, но"
10102-101020290 = "Кожа всё больше чешется..."
10102-101020300 = "Вместо него...?"
10102-101020310 = "Сенсей, здра"
10102-101020320 = "вствуйте, это Хиёри."
10102-101020330 = "Здравствуй, Хиёри."
10102-101020340 = "На самом деле, я хотела кое-что обсудить."
10102-101020350 = "Сенсей, вы видите?"
10102-101020360 = "(Изображение)"
10102-101020370 = "(Видео)"
10102-101020380 = "(Хиёри подарила вам купон)"
10102-101020390 = "А..."
10102-101020400 = "Метод «Как заставить Сенсея прочитать Момотолк» не сработал!?"
10102-101020410 = "Успокойся, Хиёри. Это всё из-за Wi-Fi!"
10102-101020420 = "А, слава богу..."
10102-101020430 = "Сенсей, не могли бы вы прийти на пляж сегодня вечером?"
10102-101020440 = "Причина пока секрет...!"
10102-101020450 = "Сегодня было весело, Сенсей..."
10102-101020460 = "Хотя были и неожиданные моменты..."
10102-101020470 = "Мне тоже было весело, благодаря тебе, Хиёри."
10102-101020480 = "Хе-хе, как хорошо..."
10102-101020490 = "Я"
10102-101020500 = "Мне тоже было весело."
10102-101020510 = "Фейерверк, который мы запускали вместе с тобой..."
10102-101020520 = "...Останется незабываемым воспоминанием."