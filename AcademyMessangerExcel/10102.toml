[translation]
10102-101020010 = "Привет, Сен"
10102-101020020 = "сей. Хи-хи."
10102-101020030 = "Привет, Хиёри."
10102-101020040 = "Похоже, Wi-Fi у тебя всё ещё плохой..."
10102-101020050 = "В моём убежище летом пекло, И Wi-Fi плохой..."
10102-101020060 = "Но я выдержу!"
10102-101020070 = "Потому что мы е"
10102-101020080 = "дем на пляж!"
10102-101020090 = "И больше всего я ждала..."
10102-101020100 = "Красивых купальников!"
10102-101020110 = "Возможно, скоро мне бесплатно достанется новый купальник!"
10102-101020120 = "Эй, Сенсей"
10102-101020130 = "Я так и знала..."
10102-101020140 = "Есть проблема?"
10102-101020150 = "Я узнала правду об этом купальнике..."
10102-101020160 = "На самом деле..."
10102-101020170 = "Он на размер меньше моего обычного!"
10102-101020180 = "Надо было написать об этом на открытке!"
10102-101020190 = "Понятно."
10102-101020200 = "Но всё же я... смогу в него влезть."
10102-101020210 = "Так что не переживайте слишком сильно, Сенсей..."
10102-101020220 = "Как странно..."
10102-101020230 = "Почему на солнце у меня болит кожа...?"
10102-101020240 = "Я так и знала. Даже отдых на пляже причиняет боль."
10102-101020250 = "Похоже, отдых и романтика мне не положены"
10102-101020260 = "Ты намазалась солнцезащитным кремом?"
10102-101020270 = "Да."
10102-101020280 = "Ну, у меня его не было, поэтому я намазалась кое-чем другим."
10102-101020290 = "Но кожа с каждой минутой горит всё сильнее"
10102-101020300 = "Кое-чем другим — чем именно...?"
10102-101020310 = "Сен"
10102-101020320 = "сей, это Хиёри."
10102-101020330 = "Привет, Хиёри."
10102-101020340 = "Я хотела кое-что сказать..."
10102-101020350 = "Сенсей? Вы здесь??"
10102-101020360 = "(Изображение)"
10102-101020370 = "(Видео)"
10102-101020380 = "(Хиёри отправила вам купон.)"
10102-101020390 = "Эх..."
10102-101020400 = "Настройки MomoTalk не работают?"
10102-101020410 = "Наверное, просто плохой Wi-Fi."
10102-101020420 = "Ох, слава богу..."
10102-101020430 = "Сенсей, пожалуйста, приходите сегодня вечером на пляж"
10102-101020440 = "Я лично объясню почему..."
10102-101020450 = "Сегодня было весело, Сенсей..."
10102-101020460 = "Хотя мои планы и пошли наперекосяк..."
10102-101020470 = "Было весело."
10102-101020480 = "Хи-хи... Я рада это слышать..."
10102-101020490 = "Я"
10102-101020500 = "Мне тоже было весело"
10102-101020510 = "Как мы вместе запускали фейерверки, Сенсей..."
10102-101020520 = "Я никогда этого не забуду."
