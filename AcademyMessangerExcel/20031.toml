[translation]
20031-200310010 = "Сенсей."
20031-200310020 = "Разве ты не говорил, что тебе нужны татами для комнаты отдыха в Шале?"
20031-200310030 = "Ага. Несколько студентов хотели бы удобно сидеть на полу."
20031-200310040 = "Кажется, я упоминал об этом, но... Почему спрашиваешь?"
20031-200310050 = "В следующий раз, когда заглянешь в Бывший институт, я приготовлю для тебя несколько татами."
20031-200310060 = "Когда мы убирались после курорта с горячими источниками, я нашла на складе целую кучу хороших татами."
20031-200310070 = "Студентам Спецотряда они не нужны?"
20031-200310080 = "Ну... Они довольно мягкие и приятно пахнут, но..."
20031-200310090 = "Полы с татами слишком легко гниют. Не думаю, что Бывший институт для них подходит."
20031-200310100 = "А просто держать их на складе — пустая трата..."
20031-200310110 = "Думаю, лучше отдать их тому, кто действительно будет ими пользоваться."
20031-200310120 = "Мне неловко что-то забирать у Бывшего института."
20031-200310130 = "Разве вам не нужны материалы для ремонта и восстановления?"
20031-200310140 = "Всё нормально. В окрестных руинах можно найти полно материалов."
20031-200310150 = "Если нам чего-то и не хватает..."
20031-200310160 = "Так это закусок. Хороших, чтобы было чем занять рот."
20031-200310170 = "Еды в природе можно добыть более чем достаточно, а вот сладостей всегда мало."
20031-200310180 = "В следующий раз, когда загляну, принесу печенье."
20031-200310190 = "Хи-хи. Я жду этого с нетерпением."
20031-200310200 = "Увидимся позже, Сенсей."
20031-200310210 = "Источник наполняется ужасно медленно."
20031-200310220 = "Уже прошло несколько дней с тех пор, как мы его осушили, а воды едва хватает, чтобы поплескаться."
20031-200310230 = "Пройдёт как минимум ещё неделя, прежде чем мы сможем принять горячую ванну..."
20031-200310240 = "И как вы будете поддерживать чистоту всё это время?"
20031-200310250 = "Будет хлопотно, но ничего не поделаешь."
20031-200310260 = "Придётся, как раньше, мыться в ледяной реке."
20031-200310270 = "Холодные ванны вредны для здоровья..."
20031-200310280 = "Почему бы не помыться где-нибудь ещё?"
20031-200310290 = "М-м. Интересно..."
20031-200310300 = "Даже если от таких отстранённых от занятий студентов, как мы, подобного и ожидают,"
20031-200310310 = "будет скандал, если мы попробуем купаться в подогреваемых фонтанах на площади..."
20031-200310320 = "Я имел в виду другую ванну!"
20031-200310330 = "Я экспериментирую с рецептами фруктового молока."
20031-200310340 = "Дело в том, что фруктовое молоко вкуснее всего сразу после смешивания."
20031-200310350 = "Если оставить его слишком надолго, начинают меняться запах и текстура."
20031-200310360 = "Пожалуй."
20031-200310370 = "И, конечно, есть ещё риск, что молоко испортится."
20031-200310380 = "Но большинство курортов с горячими источниками и бань просто продают напитки из магазина, верно?"
20031-200310390 = "И мне пришла идея..."
20031-200310400 = "Что, если в зоне отдыха будет бармен, который после купания каждого клиента будет на месте смешивать ему свежее фруктовое молоко?"
20031-200310410 = "Тогда клиент получит не только самое вкусное фруктовое молоко, но ещё и приготовленное специально под его вкус!"
20031-200310420 = "Идея интересная, но..."
20031-200310430 = "Найдётся ли курорт с горячими источниками, который наймёт человека только ради этого?"
20031-200310440 = "Узнать наверняка можно только одним способом — попробовать. Поэтому я провожу эксперимент."
20031-200310450 = "Владелец городской бани устроил меня на временную работу в другой курорт с горячими источниками."
20031-200310460 = "...Ну, это довольно внезапно."
20031-200310470 = "Сенсей. Я слышала, ты простудился."
20031-200310480 = "По дороге домой мне всё равно нужно было пройти неподалёку от Шале."
20031-200310490 = "Я оставила тебе в комнате отдыха немного имбиря и чая с молоком."
20031-200310500 = "Угощайся, если тебе холодно."
20031-200310510 = "Ты подобрала именно ту смесь молока, которая мне нужна..."
20031-200310520 = "Спасибо, что позаботилась обо мне."
20031-200310530 = "Нужно было просто разделить со мной футон, как я и предлагала."
20031-200310540 = "Сегодня обязательно укройся особенно толстым одеялом."
20031-200310550 = "Одного алкоголя недостаточно, чтобы согреться."
20031-200310560 = "Учту..."
20031-200310570 = "Сенсей, нам наконец удалось снова наполнить ванну."
20031-200310580 = "Я всё прибрала и добавила бомбочки для ванны."
20031-200310590 = "Буду рада, если ты придёшь и искупаешься здесь."
20031-200310600 = "Рад слышать, что ванну починили..."
20031-200310610 = "Ты ведь снова не использовала вино?"
20031-200310620 = "Хи-хи... Кто знает."
20031-200310630 = "Если сомневаешься, приходи и проверь сам."
20031-200310640 = "Я буду ждать, Сенсей."
