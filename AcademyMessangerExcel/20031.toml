[translation]
20031-200310010 = "Сенсей."
20031-200310020 = "Недавно вы говорили, что для новой комнаты отдыха в Шале нужны татами?"
20031-200310030 = "Да, мне сказали, что хотят комнату отдыха в японском стиле..."
20031-200310040 = "Но к чему вдруг этот разговор?"
20031-200310050 = "Тогда в следующий раз, когда будете в старом здании, можете взять их с собой."
20031-200310060 = "Когда я разбирала территорию бывшего курорта, нашла много дорогих татами."
20031-200310070 = "Вы не будете их использовать в Особом классе?"
20031-200310080 = "Хм, татами пахнут приятно, но..."
20031-200310090 = "они легко портятся, так что для старого здания не очень подходят."
20031-200310100 = "Но и оставлять их просто так жалко..."
20031-200310110 = "Я подумала, что лучше отдать тем, кому они нужны."
20031-200310120 = "Это очень любезно с вашей стороны, но..."
20031-200310130 = "У вас хватает материалов для ремонта старого здания?"
20031-200310140 = "Да. С территории бывшего курорта мы получили достаточно стройматериалов."
20031-200310150 = "Если уж говорить, чего не хватает..."
20031-200310160 = "наверное, сладостей."
20031-200310170 = "Другие продукты можно достать где угодно, а со сладостями сложнее."
20031-200310180 = "Тогда давайте обменяем татами на сладости."
20031-200310190 = "Хе-хе, договорились. Буду ждать."
20031-200310200 = "Тогда до встречи, Сенсей."
20031-200310210 = "Сенсей, с давлением воды в подземном источнике что-то не так."
20031-200310220 = "Прошло несколько дней с последней чистки, а в ванне почти нет воды."
20031-200310230 = "Такой темп — придётся ждать ещё неделю..."
20031-200310240 = "И как же вы будете мыться?"
20031-200310250 = "Хм, ничего не поделаешь..."
20031-200310260 = "Придётся снова купаться в реке, как раньше..."
20031-200310270 = "Но вы же простудитесь!"
20031-200310280 = "Может, сходите в другое место?"
20031-200310290 = "Не знаю..."
20031-200310300 = "Как бы ни были мы особенными,"
20031-200310310 = "купаться в горячей воде из фонтана на площади — это поднимет шум."
20031-200310320 = "Я имела в виду «сходите в другую баню»!"
20031-200310330 = "С тех пор как я в прошлый раз сделала фруктовое молоко, я всё экспериментирую,"
20031-200310340 = "и мне кажется, что фруктовое молоко вкуснее всего сразу после смешивания."
20031-200310350 = "Ведь у фруктов быстро меняются аромат и текстура."
20031-200310360 = "Согласен."
20031-200310370 = "К тому же молоко быстро теряет свежесть."
20031-200310380 = "Но в обычных банях продают уже готовое фруктовое молоко, да?"
20031-200310390 = "Поэтому я подумала вот о чём..."
20031-200310400 = "Как насчёт того, чтобы устроить в комнате отдыха бар с фруктовым молоком? Бармен будет смешивать свежее молоко для гостей сразу после того, как они выйдут из ванны."
20031-200310410 = "Тогда они смогут пить его свежим, и можно будет подбирать ингредиенты по вкусу. Думаю, стоит попробовать."
20031-200310420 = "Идея интересная, но..."
20031-200310430 = "Станут ли банные заведения так заморачиваться ради фруктового молока?"
20031-200310440 = "А, об этом не беспокойтесь."
20031-200310450 = "Я договорилась поработать несколько дней в той бане, которую нам порекомендовали."
20031-200310460 = "............Что?"
20031-200310470 = "Сенсей, я слышала, вы простудились?"
20031-200310480 = "Я заходила в Шале по делам,"
20031-200310490 = "и оставила вам в комнате отдыха молочный чай с имбирём."
20031-200310500 = "Подогрейте и выпейте, когда почувствуете озноб."
20031-200310510 = "Этот напиток создан специально для меня сейчас..."
20031-200310520 = "Спасибо, что беспокоишься обо мне."
20031-200310530 = "А я ведь говорила, что вам нужно просто лечь со мной в одну постель."
20031-200310540 = "Сегодня хорошо выспитесь в тёплой постели."
20031-200310550 = "...Без помощи «ферментации»."
20031-200310560 = "...Зарублю себе на носу."
20031-200310570 = "Сенсей, в ванне старого здания набралась вода."
20031-200310580 = "Заодно я привела в порядок территорию вокруг и добавила новую соль для ванн."
20031-200310590 = "Если хотите, заходите искупаться."
20031-200310600 = "Хорошо, что всё починили, но..."
20031-200310610 = "«Виноградного сока» там нет...?"
20031-200310620 = "Хе-хе, а как вы думаете?"
20031-200310630 = "Если интересно, почему бы не прийти и не проверить самим?"
20031-200310640 = "Я жду вас, Сенсей."