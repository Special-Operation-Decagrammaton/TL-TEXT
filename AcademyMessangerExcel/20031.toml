[translation]
20031-200310010 = "Sensei."
20031-200310020 = "Outro dia você não tinha comentado que precisava de tatames porque ia montar uma nova sala de descanso na Schale?"
20031-200310030 = "Sim, me pediram para criar um espaço de descanso com piso de tatame..."
20031-200310040 = "Mas por que lembrou disso agora?"
20031-200310050 = "É que, na próxima vez que você vier ao prédio antigo da escola, pode levar alguns."
20031-200310060 = "Estava arrumando o terreno da antiga estância termal e encontrei um monte de tatames de primeira linha."
20031-200310070 = "Vocês não vão usar aí na Classe Especial?"
20031-200310080 = "Huum, o cheirinho do tatame até que é bom, mas..."
20031-200310090 = "Como estraga fácil com a umidade, acho que não combina muito com o prédio antigo."
20031-200310100 = "Mas seria um desperdício deixar tudo jogado lá..."
20031-200310110 = "Então achei melhor doar para quem estiver precisando."
20031-200310120 = "Isso me ajuda muito, mas..."
20031-200310130 = "Vocês têm materiais suficientes para os reparos do prédio antigo?"
20031-200310140 = "Sim. Conseguimos recuperar bastante material de construção das ruínas da estância termal."
20031-200310150 = "Mas, se você faz questão de retribuir..."
20031-200310160 = "Quem sabe alguns doces bem gostosos?"
20031-200310170 = "Outros ingredientes a gente consegue fácil por aqui mesmo, mas doces já são outra história."
20031-200310180 = "Fechado, então vamos trocar os tatames por doces."
20031-200310190 = "Hehe, adorei. Vou ficar esperando ansiosa."
20031-200310200 = "Até a próxima, então, Sensei."
20031-200310210 = "Sensei, a pressão da água subterrânea está meio estranha."
20031-200310220 = "Já faz vários dias desde a última limpeza e a banheira quase não encheu nada."
20031-200310230 = "Nesse ritmo, vai levar mais uma semana inteira pra encher..."
20031-200310240 = "E como vocês vão fazer para tomar banho até lá?"
20031-200310250 = "Huum, não tem muito jeito..."
20031-200310260 = "A saída vai ser tomar banho no rio, como fazíamos antes..."
20031-200310270 = "Mas assim você vai acabar pegando um resfriado!"
20031-200310280 = "Por que não vai tomar banho em outro lugar?"
20031-200310290 = "Sei não..."
20031-200310300 = "Por mais que sejamos alunas da Classe Especial..."
20031-200310310 = "Acho que daria o maior bafafá se a gente começasse a tomar banho na fonte de água quente lá da praça..."
20031-200310320 = "Eu quis dizer para você ir a outra casa de banho!"
20031-200310330 = "Desde que preparei aquele leite com frutas outro dia, venho fazendo vários testes..."
20031-200310340 = "E cheguei à conclusão de que o leite com frutas fica muito mais gostoso quando é batido na hora."
20031-200310350 = "Porque o aroma e a textura das frutas mudam muito rápido."
20031-200310360 = "Faz sentido."
20031-200310370 = "Sem falar que o leite também perde o frescor facilmente."
20031-200310380 = "Mas nas fontes termais comuns eles só vendem leite com frutas industrializado já pronto, né?"
20031-200310390 = "Por isso, tive uma ideia..."
20031-200310400 = "Que tal montar um bar de leite com frutas na área de descanso? Com uma bartender pronta para preparar o blend na hora assim que o cliente sair do banho."
20031-200310410 = "Assim todo mundo pode beber enquanto está fresquinho e gostoso, e ainda dá para personalizar a mistura ao gosto de cada cliente. Acho que vale a pena testar."
20031-200310420 = "É uma ideia bem interessante, mas..."
20031-200310430 = "Será que alguma pousada termal teria todo esse trabalho só por causa de leite com frutas...?"
20031-200310440 = "Ah, quanto a isso já está tudo resolvido."
20031-200310450 = "Aquela casa de banho nos indicou uma pousada termal, e vão me deixar trabalhar lá por alguns dias."
20031-200310460 = ".........Quê?"
20031-200310470 = "Sensei, fiquei sabendo que você acabou pegando um resfriado mesmo, é verdade?"
20031-200310480 = "Como precisei dar uma passada na Schale agora há pouco..."
20031-200310490 = "Deixei um chá com leite e gengibre lá na sala de descanso para você."
20031-200310500 = "Quando sentir calafrios, esquente um pouco antes de beber."
20031-200310510 = "É o blend perfeito para mim neste momento..."
20031-200310520 = "Muito obrigado por ter se preocupado comigo."
20031-200310530 = "Eu bem que avisei que era melhor você ter dormido debaixo do mesmo futon que eu."
20031-200310540 = "Hoje vê se dorme bem quentinho para descansar direito, tá?"
20031-200310550 = "...E sem recorrer a nada \"fermentado\"."
20031-200310560 = "...Vou guardar esse conselho no coração."
20031-200310570 = "Sensei, a banheira do prédio antigo finalmente encheu de água quente."
20031-200310580 = "Aproveitei para dar um trato no ambiente ao redor e coloquei sais de banho novos."
20031-200310590 = "Se quiser, venha tomar um banho aqui também, Sensei."
20031-200310600 = "Que bom que voltou a funcionar, mas..."
20031-200310610 = "Você não misturou \"suco de uva\" na água, né...?"
20031-200310620 = "Hehe, quem sabe?"
20031-200310630 = "Se ficou curioso, que tal vir conferir pessoalmente?"
20031-200310640 = "Estou te esperando, Sensei."
