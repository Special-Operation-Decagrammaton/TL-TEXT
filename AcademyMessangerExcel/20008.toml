[translation]
20008-200080010 = "Я всегда у вас в долгу, Сенсей."
20008-200080020 = "Это Амау Ако, старший администратор Команды Префектов Геенны."
20008-200080030 = "Речь о совместном задании для Шале."
20008-200080040 = "...Ако?"
20008-200080050 = "Точные сведения о месте и времени я сообщу позже. Буду очень признательна, если вы сможете выделить немного времени из своего плотного графика."
20008-200080060 = "Буду ждать встречи."
20008-200080070 = "Х-Хорошо."
20008-200080080 = "Сенсей, я у вас в долгу."
20008-200080090 = "Это не совсем связано с нашим разговором, но когда я проверила дело, оказалось, что прошлой ночью электричество отключили из-за ремонтных работ."
20008-200080100 = "Кстати, вам случайно не нужны 100 камер наблюдения?"
20008-200080110 = "НЕ НУЖНЫ!!"
20008-200080120 = "...ц."
20008-200080130 = "*вздох*"
20008-200080140 = "Я больше не могу это терпеть."
20008-200080150 = "...Ако?"
20008-200080160 = "Всё снова и снова ходит по кругу...!"
20008-200080170 = "Ты в порядке...?"
20008-200080180 = "Сенсей, мне нужно сделать кое-что важное."
20008-200080190 = "В любом случае, это срочно, так что вы должны прийти прямо сейчас."
20008-200080200 = "Даже не думайте убегать."
20008-200080210 = "Ага, угу..."
20008-200080220 = "Сенсей."
20008-200080230 = "Сегодня ты отлично справилась."
20008-200080240 = "В следующий раз снова буду на вас рассчитывать."
20008-200080250 = "Нет, отказываюсь..."
20008-200080260 = "Сенсей"
20008-200080270 = "Ничего серьёзного, но..."
20008-200080280 = "Я занят."
20008-200080290 = "А?"
20008-200080300 = "Что за реакция?!"
20008-200080310 = "Неинтересно. Неинтересно."
20008-200080320 = "Со мной обращаются как с продавцом, который ходит по домам!"
20008-200080330 = "Ч-Что это?!"
20008-200080340 = "Это что, новый способ издеваться надо мной?"
20008-200080350 = "И вы тоже, Сенсей?"
20008-200080360 = "...?"
20008-200080370 = "Что-то случилось...?"
20008-200080380 = "А!"
20008-200080390 = "...Да, именно."
20008-200080400 = "Не то чтобы что-то случилось."
20008-200080410 = "Я просто..."
20008-200080420 = "...?"
20008-200080430 = "...Ако?"
20008-200080440 = "Сенсей? Вы благополучно вернулись?"
20008-200080450 = "Я случайно забрала с собой поводок."
20008-200080460 = "О. Понятно."
20008-200080470 = "Теперь я понимаю."
20008-200080480 = "Верну его завтра."
20008-200080490 = "Да."
20008-200080500 = "А."
20008-200080510 = "Нет, всё нормально. Не нужно всё усложнять."
20008-200080520 = "Оставь его себе, Сенсей."
20008-200080530 = "А?"
20008-200080540 = "Спасибо за сегодняшнюю работу."
20008-200080550 = "До следующего раза, Сенсей."
