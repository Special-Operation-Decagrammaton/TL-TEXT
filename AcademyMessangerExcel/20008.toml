[translation]
20008-200080010 = "Agradeço desde já pela sua contínua colaboração."
20008-200080020 = "Aqui é Amau Ako, Oficial Administrativa do Comitê Disciplinar de Gehenna."
20008-200080030 = "Entro em contato para tratar sobre a parceria de trabalho com a Schale."
20008-200080040 = "Ako...?"
20008-200080050 = "Enviarei os detalhes de data, horário e local em breve. Sei que tem uma agenda cheia, mas agradeceria se pudesse nos conceder um momento do seu tempo."
20008-200080060 = "Conto com a sua colaboração."
20008-200080070 = "T-Tá bom."
20008-200080080 = "Bom trabalho hoje, Sensei."
20008-200080090 = "Não tem muita relação com o que conversamos hoje, mas fui verificar e parece que houve uma queda temporária de energia ontem à noite por conta de obras na rede elétrica."
20008-200080100 = "...A propósito, por acaso você não estaria precisando de umas 100 câmeras de segurança?"
20008-200080110 = "Não preciso."
20008-200080120 = "...Haah."
20008-200080130 = "Francamente."
20008-200080140 = "Não dá para aguentar uma coisa dessas..."
20008-200080150 = "Ako?"
20008-200080160 = "Por que tem que aparecer um problema atrás do outro desse jeito...?!"
20008-200080170 = "Hum, está tudo bem...?"
20008-200080180 = "Sensei, tenho um assunto importante para tratar."
20008-200080190 = "E como é urgente, você poderia vir imediatamente?"
20008-200080200 = "Imagino que você não vá me deixar plantada esperando, não é?"
20008-200080210 = "S-Sim, senhora..."
20008-200080220 = "Sensei."
20008-200080230 = "Obrigada pelo seu trabalho hoje também."
20008-200080240 = "Conto com você da próxima vez."
20008-200080250 = "Então já está decidido que vai ter uma próxima vez..."
20008-200080260 = "Sensei."
20008-200080270 = "Veja bem..."
20008-200080280 = "..."
20008-200080290 = "Ei!"
20008-200080300 = "Que reação é essa?!"
20008-200080310 = "Eu não vou comprar nada, viu?"
20008-200080320 = "Você está me tratando como se eu fosse uma vendedora ambulante insistente...!"
20008-200080330 = "Q-Qual é o seu problema, afinal?!"
20008-200080340 = "O que é isso, algum tipo novo de provocação?!"
20008-200080350 = "Francamente, até você agindo assim comigo, Sensei..."
20008-200080360 = "...?"
20008-200080370 = "Tudo bem? Aconteceu alguma coisa?"
20008-200080380 = "Bom..."
20008-200080390 = "Digamos que sim."
20008-200080400 = "Não é nada de muito grave, mas..."
20008-200080410 = "É só que..."
20008-200080420 = "?"
20008-200080430 = "...Ako?"
20008-200080440 = "Sensei, você chegou bem em casa?"
20008-200080450 = "Desculpa, acabei trazendo a coleira comigo sem querer."
20008-200080460 = "Ah, entendo."
20008-200080470 = "Então foi isso."
20008-200080480 = "Amanhã eu passo aí para devolver."
20008-200080490 = "Certo."
20008-200080500 = "Ah."
20008-200080510 = "Não, não precisa se dar ao trabalho de trazer de volta."
20008-200080520 = "Pode ficar com ela, Sensei."
20008-200080530 = "...?"
20008-200080540 = "Obrigada pelo seu trabalho hoje também."
20008-200080550 = "Até a próxima."
