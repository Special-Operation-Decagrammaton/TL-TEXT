[translation]
20008-200080010 = "Всегда благодарна за вашу поддержку."
20008-200080020 = "Я администратор дисциплинарного комитета Геенны, Амау Ако."
20008-200080030 = "Я связалась с вами по вопросу делового сотрудничества с Шале."
20008-200080040 = "Ако...?"
20008-200080050 = "Позже я пришлю вам подробности о дате и месте. Прошу прощения за беспокойство, но не могли бы вы уделить мне немного времени?"
20008-200080060 = "Буду очень признательна."
20008-200080070 = "Д-да."
20008-200080080 = "С возвращением, Сенсей."
20008-200080090 = "Это не связано с сегодняшним разговором, но я выяснила, что прошлой ночью из-за ремонтных работ было временное отключение электричества."
20008-200080100 = "...Кстати, не нужны ли вам около сотни камер наблюдения?"
20008-200080110 = "Не нужны."
20008-200080120 = "...Вздох"
20008-200080130 = "Ну вот опять..."
20008-200080140 = "Это просто невыносимо..."
20008-200080150 = "Ако?"
20008-200080160 = "Почему всё одно за другим...!"
20008-200080170 = "Эм, ты в порядке...?"
20008-200080180 = "Сенсей, у меня есть важное дело."
20008-200080190 = "Оно срочное, не могли бы вы прийти прямо сейчас?"
20008-200080200 = "Вы ведь не пропустите, правда?"
20008-200080210 = "Д-да..."
20008-200080220 = "Сенсей"
20008-200080230 = "Благодарю за сегодняшнюю работу."
20008-200080240 = "Тогда до новых встреч, буду рассчитывать на вас."
20008-200080250 = "То есть уже точно будет «до новых»..."
20008-200080260 = "Сенсей"
20008-200080270 = "Дело в том, что..."
20008-200080280 = "..."
20008-200080290 = "Постой"
20008-200080300 = "Что это за реакция!"
20008-200080310 = "Я ведь ничего не покупаю?"
20008-200080320 = "Меня принимают за торговца внавязку...!"
20008-200080330 = "Ну что же это такое!"
20008-200080340 = "Это что, новый способ издевательства!?"
20008-200080350 = "Вот чёрт, даже вы так со мной..."
20008-200080360 = "...?"
20008-200080370 = "Ты в порядке? Что-то случилось?"
20008-200080380 = "Ну"
20008-200080390 = "да, наверное."
20008-200080400 = "Ничего серьёзного,"
20008-200080410 = "просто"
20008-200080420 = "?"
20008-200080430 = "...Ако?"
20008-200080440 = "Сенсей, вы благополучно добрались?"
20008-200080450 = "Прости, я случайно принёс ошейник с собой."
20008-200080460 = "А, вот как."
20008-200080470 = "Понимаю."
20008-200080480 = "Завтра верну."
20008-200080490 = "Хорошо."
20008-200080500 = "А"
20008-200080510 = "Нет, не нужно приносить."
20008-200080520 = "Оставьте его у себя."
20008-200080530 = "...?"
20008-200080540 = "Благодарю за сегодняшнюю работу."
20008-200080550 = "Тогда до встречи."