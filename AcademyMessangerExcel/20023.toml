[translation]
20023-200230010 = "Aqui é Ogata Kanna, Diretora do Departamento de Segurança Pública da Escola de Polícia Valkyrie."
20023-200230020 = "Amanhã, por volta das 10h30, farei uma visita ao escritório da Schale."
20023-200230030 = "Então finalmente chegou a hora..."
20023-200230040 = "Sou inocente, foi uma armação!"
20023-200230050 = "...Do que você está falando?"
20023-200230060 = "Estou falando do plantão na Schale que havíamos combinado..."
20023-200230070 = "Ou por acaso há algum problema em eu ir?"
20023-200230080 = "Ah, era sobre o plantão..."
20023-200230090 = "Não há problema nenhum, pode vir tranquila."
20023-200230100 = "Se é assim, menos mal..."
20023-200230110 = "Então irei amanhã no horário que informei."
20023-200230120 = "Sensei, desculpe incomodar a esta hora da noite."
20023-200230130 = "Aqui é Ogata Kanna, da Escola de Polícia Valkyrie."
20023-200230140 = "O que houve?"
20023-200230150 = "Peço desculpas pela inconveniência da minha parte, mas..."
20023-200230160 = "Teria problema remarcarmos a data do meu plantão da semana que vem?"
20023-200230170 = "Problema nenhum, fique tranquila."
20023-200230180 = "Aconteceu algum imprevisto?"
20023-200230190 = "Aquelas idiotas do Departamento de Patrulha aprontaram de novo..."
20023-200230200 = "Não."
20023-200230210 = "Esqueça o que eu disse."
20023-200230220 = "Surgiu um chamado de emergência e terei que participar da operação pessoalmente."
20023-200230230 = "Que correria, hein..."
20023-200230240 = "Isso também faz parte do meu dever como Diretora do Departamento de Segurança Pública."
20023-200230250 = "Bom, enviarei a nova data do plantão por e-mail depois."
20023-200230260 = "Não se preocupe com o caso e vá descansar, Sensei."
20023-200230270 = "O refeitório da Escola de Polícia Valkyrie tem preços acessíveis e um cardápio bem variado, mas..."
20023-200230280 = "O horário de funcionamento é limitado."
20023-200230290 = "Quando fico concentrada no trabalho, muitas vezes ele já fechou quando percebo."
20023-200230300 = "Então acabo pulando refeições com certa frequência..."
20023-200230310 = "E você não pode sair para comer fora?"
20023-200230320 = "Não é que exista alguma regra proibindo, mas..."
20023-200230330 = "Sinto um certo peso na consciência de sair para comer fora enquanto ainda há trabalho pendente."
20023-200230340 = "Falando nisso, lá no Departamento de Segurança Comunitária..."
20023-200230350 = "Parece que há um bom número de alunas pedindo transferência para o Departamento de Patrulha ou de Investigação."
20023-200230360 = "Acho que já ouvi falar disso."
20023-200230370 = "Será que são tantas assim...?"
20023-200230380 = "E você, Kanna, sempre quis entrar para o Departamento de Segurança Pública desde o começo?"
20023-200230390 = "Eu?"
20023-200230400 = "No meu caso..."
20023-200230410 = "No primeiro ano, eu me candidatei para o Departamento de Segurança Comunitária, mas..."
20023-200230420 = "Disseram que, com essa minha cara, seria difícil trabalhar no atendimento direto aos cidadãos..."
20023-200230430 = "Puxa, que..."
20023-200230440 = "Tem algum comentário a fazer?"
20023-200230450 = "N-Não, nada não!"
