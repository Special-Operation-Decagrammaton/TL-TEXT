[translation]
20023-200230010 = "Это Огата Канна, начальница Бюро общественного порядка Полицейской школы Валькирия."
20023-200230020 = "Завтра в 10:30 я приду в офис Шале."
20023-200230030 = "Итак, настал час расплаты..."
20023-200230040 = "Я ничего плохого не сделал!"
20023-200230050 = "...О чём ты говоришь?"
20023-200230060 = "Как я и сказала, я прибуду в Шале на дежурство."
20023-200230070 = "Не проблема, если я приду завтра?"
20023-200230080 = "А, это из-за ученических обязанностей..."
20023-200230090 = "Всё нормально. Никаких проблем."
20023-200230100 = "Рада это слышать."
20023-200230110 = "Тогда увидимся завтра в назначенное время."
20023-200230120 = "Прости, что пишу так поздно, Сенсей."
20023-200230130 = "Это Огата Канна из Полицейской школы Валькирия."
20023-200230140 = "Что-то не так?"
20023-200230150 = "Если ты не против,"
20023-200230160 = "я хотела бы перенести встречу на следующую неделю."
20023-200230170 = "Без проблем."
20023-200230180 = "Что-то не так?"
20023-200230190 = "Всё из-за идиотов из Бюро безопасности."
20023-200230200 = "Вообще-то..."
20023-200230210 = "Прошу прощения за выражение."
20023-200230220 = "В Полицейской школе возникла срочная проблема, поэтому я выйду на патруль."
20023-200230230 = "У тебя полно забот..."
20023-200230240 = "Это всего лишь мой долг как офицера Полицейской школы Валькирия."
20023-200230250 = "Я пришлю письмо с новым расписанием."
20023-200230260 = "На этом всё. Желаю спокойного дня."
20023-200230270 = "В столовой Полицейской школы Валькирия есть множество недорогих блюд."
20023-200230280 = "К сожалению, она открыта недолго."
20023-200230290 = "Когда я сосредотачиваюсь на работе, часто пропускаю обеденное время."
20023-200230300 = "И в итоге остаюсь без еды."
20023-200230310 = "Разве нельзя поесть что-нибудь за пределами кампуса?"
20023-200230320 = "Можно, но..."
20023-200230330 = "по какой-то причине мне не хочется есть вне школы."
20023-200230340 = "Кстати, в Бюро общественной безопасности"
20023-200230350 = "было много студентов, которые хотели перевестись в Бюро безопасности или Следственное бюро."
20023-200230360 = "Их и правда было немало."
20023-200230370 = "Правда...?"
20023-200230380 = "Ты с самого начала хотела подать заявление в Бюро общественного порядка?"
20023-200230390 = "Я?"
20023-200230400 = "Нет, вообще-то. В моём случае"
20023-200230410 = "на первом курсе я подала заявление в Бюро общественной безопасности."
20023-200230420 = "Но мне сказали, что мой характер плохо подходит для работы с жалобами граждан."
20023-200230430 = "Эм..."
20023-200230440 = "Ты хотел что-то сказать?"
20023-200230450 = "Н-Ничего!"
