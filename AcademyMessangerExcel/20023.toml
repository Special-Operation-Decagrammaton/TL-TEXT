[translation]
20023-200230010 = "Я Огата Канна, начальник полицейского управления академии Валькирия."
20023-200230020 = "Завтра около 10:30 я зайду в ваш кабинет в Шале."
20023-200230030 = "Наконец-то этот момент настал..."
20023-200230040 = "Это ложное обвинение!"
20023-200230050 = "...Что вы имеете в виду?"
20023-200230060 = "Речь о нашем предыдущем разговоре по поводу дежурства в Шале..."
20023-200230070 = "Вас что-то не устраивает?"
20023-200230080 = "А, дежурство..."
20023-200230090 = "Никаких проблем, всё в порядке."
20023-200230100 = "Тогда хорошо..."
20023-200230110 = "В таком случае я завтра приду в указанное время."
20023-200230120 = "Сенсей, прошу прощения за поздний час."
20023-200230130 = "Это Огата Канна из академии Валькирия."
20023-200230140 = "Что случилось?"
20023-200230150 = "Прошу прощения за своеволие, но..."
20023-200230160 = "можно перенести дежурство на следующей неделе?"
20023-200230170 = "Конечно, нет проблем."
20023-200230180 = "Какие-то трудности?"
20023-200230190 = "Опять эти идиоты из отдела охраны..."
20023-200230200 = "Нет"
20023-200230210 = "Забудьте."
20023-200230220 = "Поступил экстренный вызов, и мне нужно присоединиться к операции."
20023-200230230 = "Тяжело тебе..."
20023-200230240 = "Это моя обязанность как начальника управления."
20023-200230250 = "Тогда о новом времени дежурства я сообщу отдельно по электронной почте."
20023-200230260 = "Не беспокойтесь о происшествиях, Сенсей, отдыхайте."
20023-200230270 = "Столовая академии Валькирия дешёвая, а выбор блюд богатый,"
20023-200230280 = "но время работы ограничено."
20023-200230290 = "Когда я сосредоточена на работе, часто оказывается, что она уже закрыта,"
20023-200230300 = "поэтому иногда приходится пропускать приёмы пищи..."
20023-200230310 = "А почему бы не поесть снаружи?"
20023-200230320 = "Нет, таких правил нет, но..."
20023-200230330 = "мне как-то неловко уходить на обед, когда есть работа."
20023-200230340 = "Кстати, в управление общественной безопасности"
20023-200230350 = "похоже, есть несколько студентов, которые хотят перевестись из отдела охраны или следственного отдела."
20023-200230360 = "Я, кажется, слышал об этом."
20023-200230370 = "Их много?"
20023-200230380 = "А ты сама, Канна, с самого начала хотела попасть в полицейское управление?"
20023-200230390 = "Я?"
20023-200230400 = "Что касается меня,"
20023-200230410 = "на первом курсе я подала заявку в управление общественной безопасности, но..."
20023-200230420 = "мне сказали, что с такой внешностью работать на приёме граждан будет сложно..."
20023-200230430 = "Довольно-таки..."
20023-200230440 = "Что вы хотели сказать?"
20023-200230450 = "Нет-нет, ничего!"