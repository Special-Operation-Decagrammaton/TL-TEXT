10074-100740320 = "Это было очень приятно. Спасибо, Сенсей."
10074-100740330 = "Сенсей."
10074-100740340 = "Где вы сейчас?"
10074-100740350 = "Я хотела бы кое-что обсудить..."
10074-100740360 = "Что случилось?"
10074-100740370 = "Нужен совет?"
10074-100740380 = "Да."
10074-100740390 = "Если скажете, где вы,"
10074-100740400 = "я сразу приду ♡"
