[translation]
10074-100740010 = "Olá, Sensei."
10074-100740020 = "Você teria um tempinho agora?"
10074-100740030 = "Tenho sim, Hanako."
10074-100740040 = "Aconteceu alguma coisa?"
10074-100740050 = "Não é nada grandioso, mas..."
10074-100740060 = "Hum..."
10074-100740070 = "É que aconteceu uma coisinha muito boa♡"
10074-100740080 = "Uma coisinha boa?"
10074-100740090 = "Vindo de você, Hanako, isso soa meio suspeito..."
10074-100740100 = "Hehe."
10074-100740110 = "Hum..."
10074-100740120 = "Quero muito que você venha ver com seus próprios olhos, Sensei."
10074-100740130 = "Sensei, o que houve?"
10074-100740140 = "Não era nada daquilo que você falou?!"
10074-100740150 = "Você não disse que lá eu podia ficar tranquilo?!"
10074-100740160 = "Ora..."
10074-100740170 = "De fato, eu disse isso, mas..."
10074-100740180 = "Isso só vale quando estamos nós dois a sós, sabia?"
10074-100740190 = "Ufufu."
10074-100740200 = "♡"
10074-100740210 = "A água daqui é uma delícia mesmo."
10074-100740220 = "Tão cristalina..."
10074-100740230 = "Por acaso você está na praia?"
10074-100740240 = "Não."
10074-100740250 = "Eu também gosto do mar, mas agora estou em outro lugar."
10074-100740260 = "Se tiver oportunidade, não quer vir dar uma olhada também, Sensei?"
10074-100740270 = "Que pena que você me deixou para trás e foi embora, Sensei."
10074-100740280 = "Eu queria esperar a minha roupa secar para voltarmos juntos..."
10074-100740290 = "Aí já seria demais para o meu coração..."
10074-100740300 = "Eu acabei baixando a guarda..."
10074-100740310 = "Ufufu, estou só brincando."
10074-100740320 = "Foram momentos muito divertidos. Muito obrigada, Sensei."
10074-100740330 = "Sensei."
10074-100740340 = "Onde você está agora?"
10074-100740350 = "Hum, há algo sobre o qual eu gostaria de conversar..."
10074-100740360 = "O que houve?"
10074-100740370 = "Quer pedir algum conselho?"
10074-100740380 = "Sim."
10074-100740390 = "Se você me disser onde está,"
10074-100740400 = "vou para aí agora mesmo♡"
