10074-100740150 = "Ты же говорила, что здесь можно не волноваться!?"
10074-100740160 = "Ах."
10074-100740170 = "Да, я так и сказала, но..."
10074-100740180 = "это только когда мы вдвоём."
10074-100740190 = "Хе-хе-хе."
10074-100740200 = "♡"
10074-100740210 = "Вода здесь действительно приятная."
10074-100740220 = "Такая кристально чистая..."
10074-100740230 = "Ты, наверное, на море?"
10074-100740240 = "Нет."
10074-100740250 = "Я тоже люблю море, но сейчас я в другом месте."
10074-100740260 = "Если будет возможность, не хотите ли посмотреть, Сенсей?"
10074-100740270 = "Жаль, что вы ушли без меня."
