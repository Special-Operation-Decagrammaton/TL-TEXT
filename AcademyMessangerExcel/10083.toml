[translation]
10083-100830010 = "Хяккарёран постепенно возвращается к обычной жизни."
10083-100830020 = "Думаю, настало время обсудить характер отношений между Хяккарёраном и Шале."
10083-100830030 = "Если ты свободен."
10083-100830040 = "У меня ничего не запланировано!"
10083-100830050 = "Хорошо."
10083-100830060 = "Я приму тебя в офисе Совета урегулирования Хяккарёран."
10083-100830070 = "Буду ждать твоего прибытия."
10083-100830080 = "Сенсей."
10083-100830090 = "Пожалуйста, доложи о своём текущем статусе."
10083-100830100 = "О моём текущем... А? Кикё?"
10083-100830110 = "Если ты придерживаешься расписания,"
10083-100830120 = "сейчас ты должен находиться в исполнительном офисе Шале."
10083-100830130 = "Подтверди."
10083-100830140 = "Откуда ты знаешь, где я...?"
10083-100830150 = "Благодарю за подтверждение."
10083-100830160 = "Скоро прибуду."
10083-100830170 = "Скоро? То есть прямо сейчас?!"
10083-100830180 = "Алло-о? Кикё! Ты здесь?"
10083-100830190 = "Сегодня я сделала для тебя исключение, Сенсей."
10083-100830200 = "Можешь быть уверен: второго раза не будет."
10083-100830210 = "Я свяжусь с тобой снова."
10083-100830220 = "Буду ждать твоего сообщения в MomoTalk."
10083-100830230 = "...Хорошо."
10083-100830240 = "Сенс13й, касающ0сь сег0дняшнег0 зад0ния"
10083-100830250 = "Ты в порядке, Кикё?"
10083-100830260 = "Не обращай внимания на моё предыдущее сообщение."
10083-100830270 = "Оно не должно было отправиться."
10083-100830280 = "Сенсей, касательно сегодняшнего задания..."
10083-100830290 = "Возникло срочное дело, которым я должна заняться."
10083-100830300 = "Сожалею, но нашу встречу придётся перенести."
10083-100830310 = "Ничего страшного, но..."
10083-100830320 = "Хор0ш0"
10083-100830330 = "Хорошо"
10083-100830340 = "Спасибо за понимание."
10083-100830350 = "Я прочитала довольно занимательную книгу."
10083-100830360 = "Я хотела бы показать её тебе, Сенсей."
10083-100830370 = "...Кикё?"
10083-100830380 = "Я ожидала более восторженной реакции."
10083-100830390 = "Просто ты впервые написала мне не по работе."
10083-100830400 = "Это было неожиданно."
10083-100830410 = "Приятно неожиданно, разве нет?"
10083-100830420 = "Даже я способна на обычную беседу."
10083-100830430 = "Хотя я уже чувствую, как во мне расцветает сильное сожаление."
10083-100830440 = "И это твоя вина, Сенсей."
10083-100830450 = "Я ведь не говорил, что мне это не понравилось!"
10083-100830460 = "Что ж, умерь свою радость."
10083-100830470 = "Вместо этого можешь выразить благодарность, посетив сегодня офис Совета урегулирования."
10083-100830480 = "Я одолжу тебе книгу."
10083-100830490 = "Уже иду!"
