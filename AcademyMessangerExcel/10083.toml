[translation]
10083-100830010 = "Наконец-то Хяккарёран вернулась в норму."
10083-100830020 = "Я хочу обсудить дальнейшее сотрудничество."
10083-100830030 = "У вас есть время сейчас?"
10083-100830040 = "Конечно, есть."
10083-100830050 = "Хорошо."
10083-100830060 = "Тогда я жду вас в арбитражной комнате."
10083-100830070 = "До встречи."
10083-100830080 = "Сенсей."
10083-100830090 = "Вы где?"
10083-100830100 = "Что-то случилось?"
10083-100830110 = "Если мои записи не изменились,"
10083-100830120 = "вы сейчас должны быть в кабинете Шале."
10083-100830130 = "Я не ошиблась?"
10083-100830140 = "Н-нет... я тут, но..."
10083-100830150 = "Хорошо."
10083-100830160 = "Тогда я скоро подойду."
10083-100830170 = "Что? П-прямо сейчас...?"
10083-100830180 = "...Кикьё?"
10083-100830190 = "Сегодня вы меня уговорили,"
10083-100830200 = "но во второй раз этого не будет."
10083-100830210 = "Я свяжусь с вами позже."
10083-100830220 = "Да, буду ждать."
10083-100830230 = "...Вот как."
10083-100830240 = "Сенсей, сегодняшние лекарственные травы как-то..."
10083-100830250 = "...Кикьё?"
10083-100830260 = "Просто опечатка."
10083-100830270 = "Не обращайте внимания."
10083-100830280 = "Итак, насчёт согласования дел, которые мы обсуждали,"
10083-100830290 = "у меня вклинились срочные дела..."
10083-100830300 = "Можно перенести на другой день?"
10083-100830310 = "Да, не переживайте."
10083-100830320 = "Спасиб...о."
10083-100830330 = "...Спасибо."
10083-100830340 = "Ну, до встречи."
10083-100830350 = "Я нашла интересную книгу."
10083-100830360 = "Хотела порекомендовать её вам, Сенсей."
10083-100830370 = "Что...?"
10083-100830380 = "Что это за реакция?"
10083-100830390 = "Ну, от Кикьё впервые пришло личное сообщение, поэтому..."
10083-100830400 = "Я немного удивлён, вот."
10083-100830410 = "Ну и ладно."
10083-100830420 = "Я тоже могу такие сообщения писать."
10083-100830430 = "...Зря я, наверное, это сделала."
10083-100830440 = "Всё из-за вас."
10083-100830450 = "Да, понятно."
10083-100830460 = "И что дальше?"
10083-100830470 = "Если вы не против, приходите в арбитражную комнату."
10083-100830480 = "Я дам вам книгу почитать."
10083-100830490 = "Да, сейчас приду."