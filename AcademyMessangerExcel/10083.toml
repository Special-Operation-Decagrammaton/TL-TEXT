[translation]
10083-100830010 = "Agora que a Hyakkaryouran finalmente voltou ao normal,"
10083-100830020 = "eu queria conversar sobre a nossa parceria de trabalho daqui pra frente."
10083-100830030 = "Você tem um tempinho agora?"
10083-100830040 = "Claro, sem problemas."
10083-100830050 = "Entendi."
10083-100830060 = "Bom, vou estar esperando na Sala de Mediação."
10083-100830070 = "Conto com você."
10083-100830080 = "Sensei."
10083-100830090 = "Onde você tá?"
10083-100830100 = "Aconteceu alguma coisa?"
10083-100830110 = "Se o cronograma que eu tenho em mãos não mudou,"
10083-100830120 = "você deveria estar no escritório da Schale agora."
10083-100830130 = "Estou errada?"
10083-100830140 = "N-Não... Eu tô aqui, sim, mas..."
10083-100830150 = "Certo."
10083-100830160 = "Então já estou indo aí."
10083-100830170 = "Hã? A-Agora...?"
10083-100830180 = "...Senhorita Kikyou?"
10083-100830190 = "Hoje você conseguiu me enrolar na conversa, Sensei,"
10083-100830200 = "mas não vai ter uma segunda vez, viu?"
10083-100830210 = "Depois entro em contato de novo."
10083-100830220 = "Tá bom, vou ficar esperando."
10083-100830230 = "...Certo."
10083-100830240 = "Sensei, sobre as ervas medicinais de hoke"
10083-100830250 = "...Kikyou?"
10083-100830260 = "Só digitei errado."
10083-100830270 = "Não precisa ligar pra isso."
10083-100830280 = "Enfim, sobre o alinhamento de trabalho que tínhamos combinado..."
10083-100830290 = "Surgiu um imprevisto de última hora..."
10083-100830300 = "Tudo bem se deixarmos para outro dia?"
10083-100830310 = "Claro, não se preocupe comigo."
10083-100830320 = "Obrigafa"
10083-100830330 = "...Obrigada."
10083-100830340 = "Bom, até mais."
10083-100830350 = "Achei um livro interessante"
10083-100830360 = "e pensei em recomendar pra você também, Sensei."
10083-100830370 = "Hã...?"
10083-100830380 = "Que reação é essa?"
10083-100830390 = "É que é a primeira vez que você me manda mensagem pra falar de algo pessoal, Kikyou..."
10083-100830400 = "Fiquei um pouco surpreso, sei lá."
10083-100830410 = "E qual é o problema?"
10083-100830420 = "Até eu mando esse tipo de mensagem às vezes."
10083-100830430 = "...Quer saber, era melhor eu ter deixado quieto."
10083-100830440 = "E a culpa é toda sua."
10083-100830450 = "Haha, entendi."
10083-100830460 = "E então?"
10083-100830470 = "Se não achar ruim, venha até a Sala de Mediação."
10083-100830480 = "Vou te emprestar o livro."
10083-100830490 = "Beleza, já tô indo."
