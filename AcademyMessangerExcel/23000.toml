[translation]
23000-1829 = "Sensei, Sensei!"
23000-1830 = "Parece que o 'Café Mille-Feuille' lançou um doce novo desta vez!"
23000-1831 = "Que tal irmos juntos?"
23000-1832 = "Foi mal, estou absurdamente ocupado agora..."
23000-1833 = "Se eu estiver vivo para ver o sol nascer amanhã, eu topo com certeza..."
23000-1834 = "Ah... Você está tão ocupado assim...?"
23000-1835 = "Você está bem, Sensei? (⊙_⊙;)"
23000-1836 = "Sensei~"
23000-1837 = "O que achou dos cupcakes de hoje?"
23000-1838 = "Estavam gostosos?"
23000-1839 = "Sim, estavam uma delícia."
23000-1840 = "Eu estava justamente travado no trabalho, então muito obrigado."
23000-1841 = "Ai, que ótimo! (❁´▽`)"
23000-1842 = "Então até a próxima!"
23000-1843 = "o(^▽^)o"
23000-1844 = "Sensei~"
23000-1845 = "Como têm sido as coisas ultimamente? Continua ocupado como sempre?"
23000-1846 = "Na correria de sempre..."
23000-1847 = "Queria aprender o jutsu dos clones..."
23000-1848 = "Então hoje também está ocupado, né... Bom trabalho..."
23000-1849 = "╯︿╰"
23000-1850 = "Aconteceu alguma coisa? Tudo bem?"
23000-1851 = "Eu estava pensando em ir comer doces e, de repente, me lembrei de você, Sensei."
23000-1852 = "Mas se estiver ocupado, deixamos pra uma próxima vez~ (*￣▽￣*)"
23000-1853 = "Se o assunto é esse!"
23000-1854 = "Tô indo agora mesmo!"
23000-1855 = "Hã? T-tem certeza de que tudo bem?"
23000-1856 = "Sensei!? ╚(•⌂•)╝"
23000-1857 = "Sensei, queria te fazer uma perguntinha..."
23000-1858 = "Você tem planos de vir à Trinity em breve?"
23000-1859 = "Sim, estava justamente planejando ir."
23000-1860 = "Ah, sério?"
23000-1861 = "Se não for incômodo, poderia me avisar quando vier? ヾ(•ω•`)o"
23000-1862 = "É que tem uma coisa sobre a qual eu queria pedir seu conselho, Sensei."
23000-1863 = "Claro, te aviso sim."
23000-1864 = "Se for para ajudar a Airi, será um prazer."
23000-1865 = "Oba, muito obrigada!"
23000-1866 = "Fico te esperando, Sensei!\n(((o(≧∇≦)o)))"
23000-1867 = "Sensei~ (～￣▽￣)～"
23000-1868 = "Como estão as coisas ultimamente? Está ocupado?"
23000-1869 = "Ué, Sensei?"
23000-1870 = "Parece que você está ocupado mesmo... (｡´・_・｀｡)"
23000-1871 = "Força aí no trabalho!"
23000-1872 = "A Airi está sempre torcendo por você! ヾ(^▽^*)))"
23000-1873 = "Sensei, muito obrigada mesmo por hoje! o(^▽^)o"
23000-1874 = "Daqui pra frente, de vez em quando, será que... bom..."
23000-1875 = "A gente poderia sair para caminhar juntos?"
23000-1876 = "E quando formos, vamos comprar sorvete de novo com certeza!"
23000-1877 = "Claro!"
23000-1878 = "Eu que agradeço, se você quiser, Airi."
23000-1879 = "M-muito obrigada!"
23000-1880 = "Eu estou sempre torcendo por você, Sensei!"
23000-1881 = "Então tenha um ótimo dia hoje e amanhã também! (✿•‿•✿)"
