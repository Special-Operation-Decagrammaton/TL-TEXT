[translation]
10104-101040010 = "Olá, Sensei."
10104-101040020 = "Soube que você vem até Shanhaijing amanhã, é verdade?"
10104-101040030 = "Como você ficou sabendo disso!?"
10104-101040040 = "Então era verdade mesmo."
10104-101040050 = "Naturalmente, nós da Associação Comercial Genbu"
10104-101040060 = "possuímos a nossa própria rede de informações."
10104-101040070 = "Rede de informações..."
10104-101040080 = "Para falar a verdade,"
10104-101040090 = "não é nada tão grandioso assim, mas..."
10104-101040100 = "Sensei, se você tiver um tempinho amanhã de manhã,"
10104-101040110 = "que tal conversarmos um pouco?"
10104-101040120 = "De qualquer forma, estarei cumprindo a minha rotina matinal,"
10104-101040130 = "então, se estiver ocupado, podemos deixar para outro dia."
10104-101040140 = "Você vem visitar a Associação Comercial hoje, não é?"
10104-101040150 = "Sim, estou ansioso por isso."
10104-101040160 = "Fico feliz em ouvir isso, mas"
10104-101040170 = "confesso que me deixa um pouco nervosa."
10104-101040180 = "F-Foi mal..."
10104-101040190 = "Não, eu não disse isso para que se desculpasse."
10104-101040200 = "É muito melhor do que não ter expectativa nenhuma."
10104-101040210 = "Ainda mais para quem está na posição de servir a comida."
10104-101040220 = "Sendo assim, Sensei,"
10104-101040230 = "nos vemos mais tarde."
10104-101040240 = "Como acredito já ter comentado antes..."
10104-101040250 = "Hoje receberemos uma auditoria da Genryumon."
10104-101040260 = "Tomara que corra tudo bem."
10104-101040270 = "Sim."
10104-101040280 = "Mas há uma coisa que me deixou curiosa:"
10104-101040290 = "Havia mesmo necessidade de até você vir, Sensei...?"
10104-101040300 = "Por via das dúvidas, como conselheiro."
10104-101040310 = "Entendo, mas..."
10104-101040320 = "Haah..."
10104-101040330 = "Na última auditoria,"
10104-101040340 = "os membros do nosso clube acabaram mandando os auditores para o hospital..."
10104-101040350 = "Para o hospital!?"
10104-101040360 = "N-Não!"
10104-101040370 = "Aquilo foi puramente um acidente..."
10104-101040380 = "Embora, a esta altura, qualquer coisa que eu diga"
10104-101040390 = "vá soar apenas como desculpa."
10104-101040400 = "Lamento pelo incômodo, mas conto com o seu apoio hoje."
10104-101040410 = "T-Tá bom..."
10104-101040420 = "Para assumir o plantão na Schale,"
10104-101040430 = "preciso fazer algum preparativo em especial?"
10104-101040440 = "Não precisa de nada, pode vir tranquila."
10104-101040450 = "Compreendido."
10104-101040460 = "Então nos vemos mais tarde na Schale."
