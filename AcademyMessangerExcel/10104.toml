[translation]
10104-101040010 = "Здравствуйте, Сенсей."
10104-101040020 = "Ты завтра будешь в Шаньхайцзине?"
10104-101040030 = "Откуда ты знаешь?!"
10104-101040040 = "Значит, правда."
10104-101040050 = "Считай это частью"
10104-101040060 = "бизнес-стратегии Променада Чёрной Черепахи."
10104-101040070 = "Бизнес-стратегии..."
10104-101040080 = "Вообще-то ничего настолько впечатляющего..."
10104-101040090 = "..."
10104-101040100 = "Скорее..."
10104-101040110 = "Место, которое я отправила вам утром... Не встретитесь со мной там?"
10104-101040120 = "Я покажу вам"
10104-101040130 = "кусочек своей повседневной жизни."
10104-101040140 = "Вы сегодня придёте в Променад, верно?"
10104-101040150 = "Так точно! Я так жду!"
10104-101040160 = "Я РАДА это слышать, но"
10104-101040170 = "это было немного слишком энергично..."
10104-101040180 = "...Тебе бы хотелось, чтобы я не приходил?"
10104-101040190 = "Нет-нет."
10104-101040200 = "Просто не завышайте ожидания."
10104-101040210 = "Особенно насчёт ресторана..."
10104-101040220 = "Тогда, Сенсей."
10104-101040230 = "Увидимся."
10104-101040240 = "Я уже упоминала, но..."
10104-101040250 = "Сегодня день инспекции Променада Чёрной Черепахи."
10104-101040260 = "Надеюсь, Генрюмон не будет слишком строг с нами..."
10104-101040270 = "Да..."
10104-101040280 = "В любом случае я подумала и не считаю, что вам обязательно"
10104-101040290 = "приходить и наблюдать."
10104-101040300 = "Я просто побуду советником!"
10104-101040310 = "Знаю, знаю."
10104-101040320 = "*вздох*"
10104-101040330 = "Если бы только одна из наших участниц в прошлый раз не"
10104-101040340 = "отправила инспектора в больницу..."
10104-101040350 = "В больницу?!"
10104-101040360 = "Эм... Не переживайте об этом."
10104-101040370 = "Это был несчастный случай. Полностью, абсолютно непреднамеренный."
10104-101040380 = "..."
10104-101040390 = "Всё, что я скажу, всё равно будет звучать как оправдание."
10104-101040400 = "Заранее прошу прощения за возможные неудобства, но надеюсь на ваше сотрудничество сегодня."
10104-101040410 = "Д-да..."
10104-101040420 = "Насколько я понимаю, сегодня у меня смена в Шале."
10104-101040430 = "Есть ли что-то, о чём мне следует знать? Или обязанности, к которым нужно морально готовиться?"
10104-101040440 = "Нет-нет. Ни о чём не переживай."
10104-101040450 = "Понятно..."
10104-101040460 = "Тогда увидимся в Шале."
