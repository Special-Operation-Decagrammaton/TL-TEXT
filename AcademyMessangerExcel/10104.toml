[translation]
10104-101040010 = "Здравствуйте, Сенсей."
10104-101040020 = "Кажется, завтра вы приедете в Шанхайцзин?"
10104-101040030 = "Откуда вы узнали!?"
10104-101040040 = "Значит, это правда."
10104-101040050 = "Разумеется, у ресторана «Чёрная черепаха»"
10104-101040060 = "есть собственная сеть информации."
10104-101040070 = "Сеть информации..."
10104-101040080 = "На самом деле,"
10104-101040090 = "она не такая уж и внушительная, но..."
10104-101040100 = "Сенсей, если у вас есть время завтра утром,"
10104-101040110 = "не хотите ли поболтать?"
10104-101040120 = "В любом случае, я буду выполнять свои ежедневные дела,"
10104-101040130 = "так что если вы заняты, можно и в другой день."
10104-101040140 = "Сегодня вы ведь придёте в ресторан?"
10104-101040150 = "Да, с нетерпением жду."
10104-101040160 = "Рада, что вы так говорите."
10104-101040170 = "Но я немного волнуюсь."
10104-101040180 = "П-простите..."
10104-101040190 = "Нет, я не хотела, чтобы вы извинялись."
10104-101040200 = "Лучше, чем когда от вас ничего не ждут."
10104-101040210 = "Тем более, когда вы с той стороны, что подаёт блюда."
10104-101040220 = "Ну что ж, Сенсей,"
10104-101040230 = "увидимся позже."
10104-101040240 = "Кажется, я уже говорила это ранее, но..."
10104-101040250 = "сегодня планируется проверка от Генрюмон."
10104-101040260 = "Надеюсь, всё пройдёт хорошо."
10104-101040270 = "Да."
10104-101040280 = "Меня интересует один вопрос:"
10104-101040290 = "зачем вам приходить?"
10104-101040300 = "Ну, как советник, знаете."
10104-101040310 = "Это так, но..."
10104-101040320 = "Ох..."
10104-101040330 = "Во время прошлой проверки"
10104-101040340 = "наш член отправил проверяющего в больницу..."
10104-101040350 = "В больницу!?"
10104-101040360 = "Н-нет!"
10104-101040370 = "То был несчастный случай..."
10104-101040380 = "Но что бы я ни говорила сейчас,"
10104-101040390 = "это будут лишь оправдания."
10104-101040400 = "Прошу прощения, но сегодня я надеюсь на вас."
10104-101040410 = "А-ага..."
10104-101040420 = "Для исполнения обязанностей в Шале"
10104-101040430 = "нужна какая-то подготовка?"
10104-101040440 = "Всё в порядке, приходите без напряга."
10104-101040450 = "Поняла."
10104-101040460 = "Тогда увидимся позже в Шале."