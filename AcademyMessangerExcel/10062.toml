10062-100620120 = "Спасибо."
10062-100620130 = "Тогда увидимся в школе."
10062-100620140 = "Кажется, сегодня я должна работать в Шале."
10062-100620150 = "Верно, Сенсей?"
10062-100620160 = "Твой первый день здесь... Жду с нетерпением."
10062-100620170 = "...?"
10062-100620180 = "Не понимаю."
10062-100620190 = "Но я постараюсь оправдать твои ожидания."
10062-100620200 = "Увидимся в Шале, Сенсей."
10062-100620210 = "Сенсей."
10062-100620220 = "Сегодня я немного опоздаю. Нужно разобраться с личным делом."
10062-100620230 = "Прости, что не смогу вовремя тебе помогать."
10062-100620240 = "О, это на тебя не похоже."
10062-100620250 = "Можно спросить, что случилось?"
10062-100620260 = "Хм."
10062-100620270 = "Ничего важного."
10062-100620280 = "Пожалуйста, не беспокойся."
10062-100620290 = "Тогда увидимся позже."
10062-100620300 = "Думаю, пришло время"
10062-100620310 = "назначить «символ» наших отношений."
10062-100620320 = "Сегодня я пришла обсудить это с тобой."
10062-100620330 = "Что это вообще значит?"
10062-100620340 = "Всё в порядке."
10062-100620350 = "Даже если ты не понимаешь, я понимаю."
10062-100620360 = "Токи...?"
