[translation]
10062-100620010 = "Сенсей, я слышала, что вы сегодня тоже работаете."
10062-100620020 = "В Шале, наверное, всегда много работы."
10062-100620030 = "Кто...?"
10062-100620040 = "Как и ожидалось, в такие моменты нужен помощник."
10062-100620050 = "Я скоро приду, Сенсей."
10062-100620060 = "Кто же это!?"
10062-100620070 = "Сенсей, у вас есть время сейчас?"
10062-100620080 = "Мне пришло незнакомое письмо, и я не знаю, что делать."
10062-100620090 = "Если вы заняты, я попытаюсь разобраться одна, но..."
10062-100620100 = "Я решила сначала посоветоваться с вами."
10062-100620110 = "Токи в беде!? Всё в порядке? Я сейчас приду!"
10062-100620120 = "Спасибо."
10062-100620130 = "Тогда не могли бы вы прийти в школу?"
10062-100620140 = "Я слышала, что сегодня я дежурю в Шале."
10062-100620150 = "В расписании нет ошибки?"
10062-100620160 = "С нетерпением жду твоего первого дежурства, Токи."
10062-100620170 = "...?"
10062-100620180 = "Я не совсем понимаю, но..."
10062-100620190 = "Я сделаю всё возможное, чтобы оправдать ваши ожидания."
10062-100620200 = "Тогда увидимся позже."
10062-100620210 = "Сенсей."
10062-100620220 = "Сегодня дела затянулись, и я приду позже обычного."
10062-100620230 = "Простите, что не смогу помочь в назначенное время."
10062-100620240 = "Всё в порядке, но ты редко опаздываешь, Токи."
10062-100620250 = "Можно спросить, что случилось?"
10062-100620260 = "Нет."
10062-100620270 = "Ничего серьёзного."
10062-100620280 = "Не беспокойтесь слишком."
10062-100620290 = "Тогда увидимся позже."
10062-100620300 = "Сенсей. Я думаю, между нами уже пора"
10062-100620310 = "установить «доказательство»."
10062-100620320 = "Я хотела бы поговорить с вами об этом."
10062-100620330 = "Ч-что это значит!? Что за «доказательство»!?"
10062-100620340 = "Всё в порядке."
10062-100620350 = "Достаточно того, что понимаю я."
10062-100620360 = "Токи...?"
