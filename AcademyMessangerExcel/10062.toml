[translation]
10062-100620010 = "Sensei, soube que você está trabalhando hoje também."
10062-100620020 = "O trabalho na Schale parece ser sempre muito puxado."
10062-100620030 = "Quem é...?"
10062-100620040 = "Como esperado, em momentos assim você precisa de assistência."
10062-100620050 = "Estou indo para aí imediatamente, Sensei."
10062-100620060 = "Mas quem está falando?!"
10062-100620070 = "Sensei, você tem um momento agora?"
10062-100620080 = "Recebi uma carta estranha e não sei bem como proceder."
10062-100620090 = "Se você estiver ocupado, posso tentar resolver sozinha, mas..."
10062-100620100 = "Pensei em consultar você primeiro."
10062-100620110 = "A Toki está com problemas?! Tudo bem por aí? Já estou indo!"
10062-100620120 = "Obrigada."
10062-100620130 = "Nesse caso, você poderia vir até a escola?"
10062-100620140 = "Fui informada de que hoje é o meu dia de plantão na Schale."
10062-100620150 = "A agenda está correta?"
10062-100620160 = "Estou ansioso pelo seu primeiro plantão, Toki."
10062-100620170 = "...?"
10062-100620180 = "Não entendi muito bem, mas..."
10062-100620190 = "Darei o meu máximo para auxiliá-lo e corresponder às suas expectativas, Sensei."
10062-100620200 = "Então, nos vemos mais tarde."
10062-100620210 = "Sensei."
10062-100620220 = "Hoje um compromisso acabou se estendendo um pouco, então devo chegar mais tarde que o normal."
10062-100620230 = "Peço desculpas por não poder auxiliá-lo no horário combinado."
10062-100620240 = "Tudo bem, mas é raro ver você se atrasar, Toki."
10062-100620250 = "Posso perguntar o que aconteceu?"
10062-100620260 = "Não."
10062-100620270 = "Não era nada de importante."
10062-100620280 = "Por favor, não se preocupe demais com isso."
10062-100620290 = "Então, nos vemos mais tarde."
10062-100620300 = "Sensei. Acredito que já está na hora de termos"
10062-100620310 = "uma \"prova\" do que existe entre nós."
10062-100620320 = "Por isso, gostaria de conversar com você."
10062-100620330 = "C-como assim?! Que \"prova\" é essa?!"
10062-100620340 = "Está tudo bem."
10062-100620350 = "Basta que eu saiba do que se trata."
10062-100620360 = "Senhorita Toki...?"
