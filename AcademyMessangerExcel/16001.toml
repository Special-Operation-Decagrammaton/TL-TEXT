[translation]
16001-2052 = "Мастер! У вас сейчас есть время?"
16001-2053 = "Хотите сходить в кафе?"
16001-2054 = "Мастер? Не «Сенсей»?"
16001-2055 = "С чего вдруг кафе?"
16001-2056 = "А?"
16001-2057 = "Я горничная, так что вы, конечно, мой Мастер!"
16001-2058 = "Ха-ха-ха! Не обращайте внимания на мелочи."
16001-2059 = "Да! В кафе!"
16001-2060 = "Есть одно место, куда я давно хочу сходить, так что пойдём!"
16001-2061 = "Буду ждать!"
16001-2062 = "Мастер!"
16001-2063 = "Огромное спасибо за сегодня!"
16001-2064 = "Благодаря вам всё прошло гладко!"
16001-2065 = "Всё благодаря вам!"
16001-2066 = "Я буду иногда писать вам, Мастер!"
16001-2067 = "Сегодня просто такой день."
16001-2068 = "Я очень по вам скучаю, Мастер!"
16001-2069 = "Помогите!"
16001-2070 = "Мне нужна ваша помощь!"
16001-2071 = "Вы ведь поможете, да?"
16001-2072 = "Какая помощь?"
16001-2073 = "Ты всегда такая спонтанная."
16001-2074 = "Да! Именно!"
16001-2075 = "Помогите!"
16001-2076 = "Буду ждать!"
16001-2077 = "Сегодня был лучший день в моей жизни!"
16001-2078 = "Большое спасибо, Мастер!"
16001-2079 = "Я знала, что позвать вас — отличная идея."
16001-2080 = "Вы как мой талисман удачи!"
16001-2081 = "До следующего раза!"
16001-2082 = "Хорошего дня!"
16001-2083 = "Мастер! Вы свободны?"
16001-2084 = "В последнее время вы так много мне помогали."
16001-2085 = "Я хотела отблагодарить вас!"
16001-2086 = "Отблагодарить? Меня?"
16001-2087 = "А что я сделал...?"
16001-2088 = "Не каждый день тебе предлагают превосходные услуги горничной!"
16001-2089 = "Эм..."
16001-2090 = "Наверное? Ха-ха!"
16001-2091 = "В общем, я загляну!"
16001-2092 = "До скорого, Мастер!"
16001-2093 = "Эм..."
16001-2094 = "Ух!"
16001-2095 = "Я так расстроена! Что-то не так!"
16001-2096 = "Надеюсь, позже смогу на вас рассчитывать, Мастер!"
16001-2097 = "Пожалуйста, не отказывайте, ладно?"
16001-2098 = "О..."
16001-2099 = "Доставленная еда всегда такая вкусная."
16001-2100 = "Давайте как-нибудь снова поедим вместе!"
16001-160010010 = "У нас проблема, Мастер! Большая проблема!"
16001-160010020 = "Мне нужна ваша помощь! Это чрезвычайная ситуация!"
16001-160010030 = "Чрезвычайная ситуация в том, что тебе скучно?"
16001-160010040 = "Наверное, даже покой может быть проблемой..."
16001-160010050 = "...?"
16001-160010060 = "А."
16001-160010070 = "О чём вы говорите? О чём я говорю?"
16001-160010080 = "...Что?"
16001-160010090 = "Ты забыла наш разговор прямо во время разговора?"
16001-160010100 = "Ну..."
16001-160010110 = "Да."
16001-160010120 = "Да! Похоже, именно так и произошло!"
16001-160010130 = "На этот раз по-настоящему, реально-реально, мне правда нужна помощь!"
16001-160010140 = "Нужна была."
16001-160010150 = "?"
16001-160010160 = "А? Что происходит?"
16001-160010170 = "Мастер?"
16001-160010180 = "Я дома!"
16001-160010190 = "Вы нормально вернулись? Благодаря вам всё прошло так хорошо!"
16001-160010200 = "Мне неловко, что я постоянно на вас полагаюсь."
16001-160010210 = "Не переживай. Когда на тебя полагаются — это часть работы."
16001-160010220 = "Главное, чтобы тебе было комфортно."
16001-160010230 = "Но почему ты об этом заговорила? Что-то беспокоит?"
16001-160010240 = "Хм... Я и сама не совсем понимаю..."
16001-160010250 = "Главное, что вы помогли!"
16001-160010260 = "А работа горничной — служить, так что возможностей отплатить будет ещё много! Обязательно!"
16001-160010270 = "До встречи, Мастер!"
16001-160010280 = "И ещё раз огромное спасибо!"
16001-160010290 = "Мастер."
16001-160010300 = "Вы заняты??"
16001-160010310 = "ПОМОГИТЕ АСУНЕ, ПОЖАЛУЙСТА!!"
16001-160010320 = "Я прямо сейчас свободен!"
16001-160010330 = "Где встретимся?"
16001-160010340 = "О!"
16001-160010350 = "Повезло!!!"
16001-160010360 = "Прямо сейчас я"
