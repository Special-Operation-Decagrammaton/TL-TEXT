16001-2087 = "Разве я что-то для тебя сделал...?"
16001-2088 = "Да!"
16001-2089 = "Было же много всего!"
16001-2090 = "Такая возможность получить мою услугу выпадает нечасто!"
16001-2091 = "В любом случае, я приду позже!"
16001-2092 = "Ждите меня, хозяин!"
16001-2093 = "М-м..."
16001-2094 = "М-м~~~~~~!!"
16001-2095 = "Чего-то не хватает!! Что-то ещё осталось!"
16001-2096 = "В следующий раз я снова попрошу, хозяин!"
16001-2097 = "Обязательно!"
16001-2098 = "Обязательно!"
16001-2099 = "А, доставка была вкусной."
16001-2100 = "Давай поедим вместе ещё раз!!"
16001-160010010 = "Беда!"
16001-160010020 = "Беда, хозяин! Помогите сейчас же!"
