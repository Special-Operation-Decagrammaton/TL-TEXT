[translation]
16001-2052 = "Хозяин~! У вас есть время?"
16001-2053 = "Не хотите сходить в кафе?"
16001-2054 = "Хозяин...?"
16001-2055 = "Вдруг кафе?"
16001-2056 = "Хм? Что-то не так?"
16001-2057 = "Я же горничная, так что вы для меня хозяин!"
16001-2058 = "Не забивайте голову мелочами!"
16001-2059 = "Да! Кафе!"
16001-2060 = "Я знаю одно кафе, которое хотела посетить, пошли!"
16001-2061 = "Тогда я буду ждать перед магазином!"
16001-2062 = "Увидимся позже!"
16001-2063 = "Спасибо за сегодня, хозяин!"
16001-2064 = "Задание выполнено, отличный день!"
16001-2065 = "Может, это потому, что вы были рядом?"
16001-2066 = "Тогда я ещё свяжусь с вами, хозяин!"
16001-2067 = "Помогите, хозяин!!"
16001-2068 = "Мне нужна ваша помощь!"
16001-2069 = "Вероятно! Точно! Возможно!"
16001-2070 = "Ну, в общем, вы сможете прийти на помощь?"
16001-2071 = "Вы ведь придёте? Да?"
16001-2072 = "Мне нужна помощь...?"
16001-2073 = "Как всегда внезапно."
16001-2074 = "Да!"
16001-2075 = "Вы придёте? Спасибо!"
16001-2076 = "Тогда я жду!"
16001-2077 = "Сегодня был лучший день!!"
16001-2078 = "Спасибо большое, хозяин!"
16001-2079 = "Как и ожидалось, я правильно сделала, что связалась с вами~"
16001-2080 = "Когда я с вами, случаются только хорошие вещи!"
16001-2081 = "Тогда до встречи!"
16001-2082 = "Я помолюсь, чтобы завтрашний день тоже был хорошим!"
16001-2083 = "Хозяин~! У вас сейчас есть время?"
16001-2084 = "В качестве благодарности за всё,"
16001-2085 = "я хочу отблагодарить вас!"
