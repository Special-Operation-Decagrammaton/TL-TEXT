16001-160010040 = "Что случилось...?"
16001-160010050 = "...?"
16001-160010060 = "А?"
16001-160010070 = "Что это было со мной?"
16001-160010080 = "...? А?"
16001-160010090 = "В каком смысле...?"
16001-160010100 = "А"
16001-160010110 = "Да"
16001-160010120 = "Вот! Вот так!"
16001-160010130 = "В этот раз по-настоящему, помощь действительно"
16001-160010140 = "нужна"
16001-160010150 = "?"
