[translation]
23005-2194 = "Olá, Sensei. Aqui é a Ayane."
23005-2195 = "Você teria um minutinho?"
23005-2196 = "Claro, o que houve?"
23005-2197 = "Estou meio ocupado, mas para a Ayane eu sempre tenho tempo!"
23005-2198 = "Muito obrigada. Na verdade..."
23005-2199 = "H-hum, ahaha... M-muito obrigada."
23005-2200 = "Na verdade..."
23005-2201 = "Digamos que é um conselho, ou melhor, algo que eu gostaria que você me ouvisse falar..."
23005-2202 = "Tem um assunto sobre o qual eu queria conversar um pouco."
23005-2203 = "Desculpe abordar isso tão de repente!"
23005-2204 = "Certo, entendi."
23005-2205 = "Imagina, sem problemas."
23005-2206 = "M-muito obrigada! Então nos vemos na escola no próximo dia de folga!"
23005-2207 = "Sensei, sobre aquele livro..."
23005-2208 = "Pedi para avaliarem no antiquário do distrito comercial,"
23005-2209 = "e disseram que é apenas um romance popular antigo sem muito valor..."
23005-2210 = "Puxa vida..."
23005-2211 = "Entendo..."
23005-2212 = "Ahaha... Mas ainda assim me pagaram 1.200 ienes por ele."
23005-2213 = "Mesmo dizendo que não tinha valor, parece que rendeu pelo menos isso."
23005-2214 = "Então não foi perda de tempo."
23005-2215 = "Que bom, né?"
23005-2216 = "Sim, verdade."
23005-2217 = "Talvez eu volte a te pedir conselhos estranhos como esse, mas conto com a sua ajuda, Sensei."
23005-2218 = "Sensei, tenho boas notícias."
23005-2219 = "Encontrei uma certa coisa aqui na escola,"
23005-2220 = "e parece que pode render um bom dinheiro."
23005-2221 = "Hehe, talvez seja uma sorte grande inesperada."
23005-2222 = "Que tipo de coisa?"
23005-2223 = "Parece ser ferro comum, mas"
23005-2224 = "como tem bastante quantidade, acho que deve dar uma boa quantia."
23005-2225 = "Posso ir aí ver também?"
23005-2226 = "Hã?"
23005-2227 = "Ah, sim, claro que pode, mas..."
23005-2228 = "Bom trabalho hoje, Sensei."
23005-2229 = "Você está bem...?"
23005-2230 = "Sim, estou bem."
23005-2231 = "Meus óculos ficaram meio bambos e, bom, meu uniforme rasgou um pouquinho, mas..."
23005-2232 = "Conseguimos o dobro do valor! Foi a nossa vitória!"
23005-2233 = "Bom trabalho..."
23005-2234 = "Ultimamente, as instalações da escola têm apresentado defeitos seguidos, e estou um pouco preocupada."
23005-2235 = "Ontem ficamos sem luz por 2 horas..."
23005-2236 = "E anteontem até a água foi cortada."
23005-2237 = "Será que aconteceu algum problema nas instalações subterrâneas...?"
23005-2238 = "Por que não tenta chamar uma empresa de manutenção?"
23005-2239 = "Não seria melhor chamar alguém que entenda do assunto para dar uma olhada?"
23005-2240 = "É que se chamarmos um técnico para inspecionar todos os lugares suspeitos, o valor vai ficar absurdo..."
23005-2241 = "Preciso arrumar um tempinho nos dias de folga para ir consertando aos poucos..."
23005-2242 = "Quer que eu ajude?"
23005-2243 = "Vamos consertar juntos."
23005-2244 = "Ah... Tem certeza?"
23005-2245 = "Então vou aceitar a sua gentileza. Muito obrigada, Sensei."
23005-2246 = "Obrigada pelo esforço de hoje, Sensei."
23005-2247 = "Graças a você, conseguimos concluir os reparos em segurança."
23005-2248 = "Sim, bom trabalho."
23005-2249 = "Bom trabalho para você também, Ayane."
23005-2250 = "Hum... Este..."
23005-2251 = "Sabe..."
23005-2252 = "Hm?"
23005-2253 = "Que foi?"
23005-2254 = "Será que... posso te chamar de novo outra hora? É que..."
23005-2255 = "Hoje eu acabei te dando trabalho, mas... eu gosto de ficar com você, Sensei..."
23005-2256 = "Claro que pode."
23005-2257 = "Claro, pode me chamar sempre que quiser."
23005-2258 = "...Muito obrigada, Sensei."
23005-2259 = "Então entrarei em contato novamente."
23005-230050010 = "Hoje é o meu dia de plantão na Schale, mas... antes de ir para aí,"
23005-230050020 = "poderia me adiantar algumas informações sobre o andamento do trabalho?"
23005-230050030 = "Ayane, me salva..."
23005-230050040 = "Hoje estou no inferno da papelada..."
23005-230050050 = "S-sério?!"
23005-230050060 = "Estou indo para aí agora mesmo!"
