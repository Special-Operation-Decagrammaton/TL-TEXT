[translation]
23005-2194 = "Здравствуйте, Сенсей. Это Аяне."
23005-2195 = "Вы сейчас, случайно, не свободны?"
23005-2196 = "Конечно. Что случилось?"
23005-2197 = "Я очень занят, но для тебя всегда есть время."
23005-2198 = "Хорошо, ничего серьёзного, но..."
23005-2199 = "Ох... Спасибо."
23005-2200 = "Ничего серьёзного, но..."
23005-2201 = "...мне нужно кое-что обсудить."
23005-2202 = "Можем поговорить?"
23005-2203 = "Простите, что беспокою!"
23005-2204 = "Поняла."
23005-2205 = "Ничего страшного."
23005-2206 = "Спасибо! Увидимся в Абидосе в Ваш выходной!"
23005-2207 = "Помните ту книгу, Сенсей?"
23005-2208 = "Я спросила в антикварном магазине торгового района, и..."
23005-2209 = "Они сказали, что это просто старый роман, который почти ничего не стоит..."
23005-2210 = "А..."
23005-2211 = "Понятно."
23005-2212 = "Но... мне всё-таки дали за него 1200 йен."
23005-2213 = "Наверное, он был не совсем бесполезным."
23005-2214 = "Время потрачено не совсем зря."
23005-2215 = "Я рад."
23005-2216 = "Ха-ха-ха... Да."
23005-2217 = "Надеюсь, скоро снова смогу с Вами поговорить, Сенсей."
23005-2218 = "Сенсей, у меня хорошие новости!"
23005-2219 = "Я кое-что нашла."
23005-2220 = "Похоже, там полно ценностей..."
23005-2221 = "Ого... Чувствую себя королевой."
23005-2222 = "Что такое?"
23005-2223 = "Эм... Это какой-то металлолом."
23005-2224 = "Но, кажется, его можно продать..."
23005-2225 = "Я взгляну."
23005-2226 = "Да?"
23005-2227 = "О, нет. Вам не нужно ехать сюда ради этого..."
23005-2228 = "Спасибо, Сенсей."
23005-2229 = "Ты в порядке?.."
23005-2230 = "Да, всё нормально."
23005-2231 = "Форма вся порвалась, а очки сломались, но..."
23005-2232 = "я смогу продать эти вещи вдвое дороже!"
23005-2233 = "Хорошая работа сегодня..."
23005-2234 = "Я переживаю, потому что кажется, что школа разваливается."
23005-2235 = "Вчера у нас дважды отключали свет."
23005-2236 = "А недавно вообще не было воды."
23005-2237 = "Может что-то не так с коммуникациями в подвале?"
23005-2238 = "Почему бы не вызвать техника?"
23005-2239 = "Стоит позвать кого-нибудь для проверки."
23005-2240 = "Ха-ха... У нас нет бюджета."
23005-2241 = "Придётся самой выкраивать время и чинить потихоньку."
23005-2242 = "Помочь?"
23005-2243 = "Давай вместе."
23005-2244 = "Вы серьёзно?"
23005-2245 = "Было бы просто замечательно, Сенсей!"
23005-2246 = "Сегодня Вы очень усердно работали, Сенсей."
23005-2247 = "Теперь в школе всё починено."
23005-2248 = "Сегодня ты отлично справилась."
23005-2249 = "Отличная работа, Аяне."
23005-2250 = "О, эм..."
23005-2251 = "Так что..."
23005-2252 = "А?"
23005-2253 = "Что такое?"
23005-2254 = "Эмм... Могу я потом снова Вас позвать?"
23005-2255 = "Сегодня я многого от Вас попросила, но..."
23005-2256 = "Конечно."
23005-2257 = "В любое время."
23005-2258 = "Ха-ха... Спасибо, Сенсей."
23005-2259 = "До встречи."
23005-230050010 = "Здравствуйте, Сенсей."
23005-230050020 = "Интересно, над чем же я буду работать во время дежурства сегодня."
23005-230050030 = "Помоги, Аяне..."
23005-230050040 = "Я застрял в адском измерении бумажной волокиты..."
23005-230050050 = "В-Вы в порядке?!"
23005-230050060 = "Я буду там, как только смогу!"
