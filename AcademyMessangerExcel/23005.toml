[translation]
23005-2194 = "Здравствуйте, Сенсей. Это Аяне."
23005-2195 = "У вас найдётся немного времени?"
23005-2196 = "Всё в порядке, что случилось?"
23005-2197 = "Я довольно занят, но ради Аяне я всегда свободен!"
23005-2198 = "Спасибо, на самом деле..."
23005-2199 = "Э-эм, а-ха-ха... А, спасибо вам."
23005-2200 = "На самом деле..."
23005-2201 = "Мне нужно с вами посоветоваться, вернее, я хотела бы, чтобы вы меня выслушали..."
23005-2202 = "Есть кое-что, о чём я хотела бы поговорить."
23005-2203 = "Простите за внезапность!"
23005-2204 = "Да, понял."
23005-2205 = "Нет-нет, всё в порядке."
23005-2206 = "А, спасибо! Тогда в следующие выходные встретимся в школе!"
23005-2207 = "Сенсей, насчёт той книги..."
23005-2208 = "Я обратилась в антикварный магазин в торговом районе, и..."
23005-2209 = "оказалось, что это старая бульварная книга, не представляющая особой ценности..."
23005-2210 = "Вот как..."
23005-2211 = "Понятно..."
23005-2212 = "Аха-ха... но мне дали за неё целых 1200 иен."
23005-2213 = "Хотя она и не ценная, похоже, столько удалось выручить."
23005-2214 = "Значит, время не было потрачено зря."
23005-2215 = "Хорошо."
23005-2216 = "Да, вы правы."
23005-2217 = "Я, возможно, ещё обращусь к вам с каким-нибудь странным вопросом, но буду рассчитывать на вас, Сенсей."
23005-2218 = "Сенсей, у меня хорошие новости."
23005-2219 = "Я нашла в школе кое-что."
23005-2220 = "Похоже, это может принести неплохие деньги."
23005-2221 = "Хе-хе, возможно, это будет неожиданная удача."
23005-2222 = "Что за вещь?"
23005-2223 = "Это похоже на обычный металлолом, но..."
23005-2224 = "поскольку его много, возможно, это будет стоить приличную сумму."
23005-2225 = "Можно мне тоже посмотреть?"
23005-2226 = "Что?"
23005-2227 = "А, да, конечно, можно, но..."
23005-2228 = "С возвращением, Сенсей."
23005-2229 = "Ты в порядке...?"
23005-2230 = "Да, всё в порядке."
23005-2231 = "Очки шатаются, и форма немного порвалась, но..."
23005-2232 = "Зато мы заработали вдвое больше! Это наша победа!"
23005-2233 = "Ты молодец..."
23005-2234 = "В последнее время меня немного беспокоит, что в школе постоянно ломается оборудование."
23005-2235 = "Вчера электричество отключалось на два часа..."
23005-2236 = "Позавчера ещё и воду отключили."
23005-2237 = "Может, с подземными коммуникациями что-то случилось..."
23005-2238 = "Может, вызвать специалиста?"
23005-2239 = "Позови кого-нибудь, кто разбирается, пусть посмотрит."
23005-2240 = "Если вызывать специалиста для проверки всех проблемных мест, это, наверное, будет стоить целое состояние..."
23005-2241 = "Придётся находить время и понемногу чинить в выходные..."
23005-2242 = "Может, мне помочь?"
23005-2243 = "Давай починим вместе."
23005-2244 = "А... правда?"
23005-2245 = "Тогда я воспользуюсь вашим предложением. Спасибо, Сенсей."
23005-2246 = "Спасибо за сегодня, Сенсей."
23005-2247 = "Благодаря вам мы успешно закончили ремонт."
23005-2248 = "Да, ты молодец."
23005-2249 = "И ты, Аяне, молодец."
23005-2250 = "Эм... ну..."
23005-2251 = "В общем..."
23005-2252 = "Хм?"
23005-2253 = "Что случилось?"
23005-2254 = "Можно мне... снова обратиться к вам? Ну..."
23005-2255 = "Я сегодня причинила вам хлопоты... но мне было приятно с вами..."
23005-2256 = "Конечно."
23005-2257 = "Конечно, зови в любое время."
23005-2258 = "...Спасибо вам, Сенсей."
23005-2259 = "Тогда я ещё напишу."
23005-230050010 = "Сегодня я дежурная в Шале, но... перед тем как пойти в Шале..."
23005-230050020 = "можно задать вам несколько вопросов о рабочей ситуации?"
23005-230050030 = "Аяне, спаси..."
23005-230050040 = "Сегодня у меня бумажный ад..."
23005-230050050 = "П-правда!?"
23005-230050060 = "Я сейчас приду!"