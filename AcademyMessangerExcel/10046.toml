[translation]
10046-100460010 = "Meu Senhor!!!!"
10046-100460020 = "É verão, chegou o verão!"
10046-100460030 = "Pois é, chegou o verão."
10046-100460040 = "Como é verão, dá para ver a miragem do calor tremulando por toda parte!"
10046-100460050 = "Igualzinho ao 26º filme do diretor Shiba Inu Wanzo, \"Duelo Sangrento na Miragem\"!"
10046-100460060 = "Aquele filme foi incrível demais!"
10046-100460070 = "Não entendi muito bem a referência, mas fico feliz que esteja animada, Izuna."
10046-100460080 = "Você parece ainda mais cheia de energia do que o normal, Izuna."
10046-100460090 = "Talvez seja graças à energia do sol de verão!"
10046-100460100 = "Ah, não podemos perder tempo parados aqui! Meu Senhor, vamos à praia juntos!"
10046-100460110 = "Hora de começar o treinamento para me tornar uma ninja adaptada ao verão e ao mar!"
10046-100460120 = "Beleza, vamos lá."
10046-100460130 = "Sim! Estarei te esperando!"
10046-100460140 = "Meu Senhor!"
10046-100460150 = "Se você tiver um tempinho hoje..."
10046-100460160 = "Pela Izuna, eu vou para qualquer lugar!"
10046-100460170 = "Ah"
10046-100460180 = "Sim!"
10046-100460190 = "Ehehe!"
10046-100460200 = "Muito obrigada! Então estarei esperando na praia, Meu Senhor!"
10046-100460210 = "Hoje está quente desde cedo também, não é, Meu Senhor!"
10046-100460220 = "De tanto calor que está fazendo, a Izuna já acordou encharcada de suor hoje de manhã..."
10046-100460230 = "Principalmente a cauda..."
10046-100460240 = "Essa época do ano deve ser bem difícil para você..."
10046-100460250 = "Contudo, não importa o quão quente esteja!"
10046-100460260 = "A Izuna deseja se dedicar ao treinamento ao lado do Meu Senhor hoje também!"
10046-100460270 = "Sendo assim, Meu Senhor!"
10046-100460280 = "Beleza, vou me arrumar então."
10046-100460290 = "Ehehe! Sim!"
10046-100460300 = "A Izuna também vai se preparar rapidinho e já vai!"
10046-100460310 = "Hum..."
10046-100460320 = "Mil perdões, Meu Senhor!"
10046-100460330 = "A própria Izuna pediu para treinar e acabou pegando no sono no meio do caminho...!"
10046-100460340 = "Não esquenta. Ficar enterrado na areia é bem gostoso, né?"
10046-100460350 = "Meu Senhor...!"
10046-100460360 = "Ainda temos bastante tempo, então fica tranquila."
10046-100460370 = "Sim!"
10046-100460380 = "Até daqui a pouco, então!"
10046-100460390 = "Vamos continuar nos divertindo bastante juntos, Meu Senhor!"
10046-100460400 = "Meu Senhor! O que vamos fazer hoje?"
10046-100460410 = "Ainda tem uma montanha de coisas que a Izuna quer fazer com o Meu Senhor!"
10046-100460420 = "Hoje também está bem quente, né... O que vamos fazer?"
10046-100460430 = "Vejamos...!"
