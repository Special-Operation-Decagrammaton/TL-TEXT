[translation]
10046-100460010 = "Господин!"
10046-100460020 = "Наступило лето. Самое настоящее лето!"
10046-100460030 = "Да, уже наступило."
10046-100460040 = "Сегодня повсюду стояла дымка!"
10046-100460050 = "Всё выглядело как сцена из «Кровавой битвы в дымке», двадцать шестого фильма режиссёра Шиба Дог Ван Вана..."
10046-100460060 = "Это было потрясающе!"
10046-100460070 = "Не совсем понимаю, что это значит, но рад, что тебе понравилось."
10046-100460080 = "Ты выглядишь энергичнее обычного."
10046-100460090 = "Думаешь, это из-за энергии летнего солнца?"
10046-100460100 = "Ой, некогда медлить! Господин, пойдём вместе на пляж!"
10046-100460110 = "Мне нужно тренироваться, чтобы стать ниндзя, приспособленной к лету и пляжу."
10046-100460120 = "Ну, раз ты так говоришь!"
10046-100460130 = "Хи-хи! Я буду ждать!"
10046-100460140 = "Господин!"
10046-100460150 = "Если у тебя сегодня есть время..."
10046-100460160 = "Конечно! Я пойду с тобой куда угодно, Изуна!"
10046-100460170 = "О...!"
10046-100460180 = "Хорошо!"
10046-100460190 = "Хи-хи-хи!"
10046-100460200 = "Хорошо, тогда увидимся на пляже, господин!"
10046-100460210 = "Господин! С самого утра так жарко!"
10046-100460220 = "Было так жарко, что"
10046-100460230 = "когда я проснулась, мой хвост был весь мокрый!"
10046-100460240 = "Ого, неприятно."
10046-100460250 = "Но даже в такую жару..."
10046-100460260 = "я хочу усердно тренироваться вместе с тобой, господин!"
10046-100460270 = "Так что...!"
10046-100460280 = "Хорошо, Изуна. Тогда увидимся там?"
10046-100460290 = "Хи-хи-хи. Да!"
10046-100460300 = "Я сразу подготовлюсь и выйду!"
10046-100460310 = "О, эм... Ну..."
10046-100460320 = "Прости меня, господин!"
10046-100460330 = "Это я предложила тренировку... но уснула..."
10046-100460340 = "Не переживай. Такое бывает, когда тебя закапывают в песок."
10046-100460350 = "Господин...!"
10046-100460360 = "У нас есть время. Потренируемся как-нибудь позже."
10046-100460370 = "О, спасибо!"
10046-100460380 = "Хи-хи! В следующий раз!"
10046-100460390 = "Тогда увидимся, господин!"
10046-100460400 = "Господин! Чем займёмся сегодня?"
10046-100460410 = "Я столько всего хочу попробовать вместе с тобой!"
10046-100460420 = "Сегодня так жарко... Чем займёмся?"
10046-100460430 = "Ага! Хм!"
10046-100460440 = "Может... поплаваем?"
10046-100460450 = "А? О, эм."
10046-100460460 = "Так что, эм..."
10046-100460470 = "Ты не любишь плавать?"
10046-100460480 = "О, эм, то есть... не то чтобы не люблю... но..."
10046-100460490 = "Так что..."
10046-100460500 = "Я-я просто..."
10046-100460510 = "Я-я буду ждать на пляже, господин!"
10046-100460520 = "О, э-э, хорошо."
