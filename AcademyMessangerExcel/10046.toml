[translation]
10046-100460010 = "Господин!!!!"
10046-100460020 = "Лето, лето!"
10046-100460030 = "Да, лето."
10046-100460040 = "Летом повсюду видно марево!"
10046-100460050 = "Прямо как в 26-м фильме режиссёра Сиба-ину Ван-куро! «Кровавая битва марева»!"
10046-100460060 = "Это было действительно потрясающе!"
10046-100460070 = "Я не совсем понимаю, но рад, что тебе, Изуна, было весело."
10046-100460080 = "Изуна, ты сегодня особенно энергична."
10046-100460090 = "Возможно, это благодаря летней солнечной энергии!"
10046-100460100 = "Ах, но сейчас не время для этого. Господин, пойдёмте на море!"
10046-100460110 = "Начинаем тренировку, чтобы стать ниндзя, готовым к лету и морю!"
10046-100460120 = "Хорошо, пошли."
10046-100460130 = "Да, я буду ждать вас!"
10046-100460140 = "Господин!"
10046-100460150 = "Если у вас есть время сегодня,"
10046-100460160 = "Ради Изуны я готов на всё!"
10046-100460170 = "А."
10046-100460180 = "Да!"
10046-100460190 = "Хе-хе!"
10046-100460200 = "Спасибо! Тогда я буду ждать вас на пляже, Господин!"
10046-100460210 = "Сегодня с утра жарко, Господин!"
10046-100460220 = "От такой жары Изуна проснулась вся в поту..."
10046-100460230 = "Особенно хвост..."
10046-100460240 = "В это время года тебе, наверное, тяжело..."
10046-100460250 = "Но какой бы ни была жара!"
10046-100460260 = "Изуна сегодня тоже готова тренироваться вместе с вами, Господин!"
10046-100460270 = "Итак, Господин!"
10046-100460280 = "Хорошо, тогда я подготовлюсь."
10046-100460290 = "Хе-хе! Да!"
10046-100460300 = "Изуна тоже быстро приготовится!"
10046-100460310 = "Ну..."
10046-100460320 = "Простите, Господин!"
10046-100460330 = "Я сама предложила тренироваться, но уснула прямо посредине...!"
10046-100460340 = "Не волнуйтесь. В песке так уютно."
10046-100460350 = "Господин...!"
10046-100460360 = "У нас ещё много времени, всё в порядке."
10046-100460370 = "Да!"
10046-100460380 = "Тогда ещё увидимся!"
10046-100460390 = "Продолжим играть вместе, Господин!"
10046-100460400 = "Господин! Чем займёмся сегодня?"
10046-100460410 = "У Изуны ещё много дел, которые хочется сделать с вами!"
10046-100460420 = "Сегодня тоже жарко... чем займёмся?"
10046-100460430 = "Ну...!"
10046-100460440 = "Плавание... может, не стоит?"
10046-100460450 = "А."
10046-100460460 = "Ну, это..."
10046-100460470 = "Изуна, ты не любишь плавать?"
10046-100460480 = "Ах, не то чтобы не люблю..."
10046-100460490 = "Ну..."
10046-100460500 = "Изуна..."
10046-100460510 = "К-короче, я буду ждать вас на пляже, Господин!"
10046-100460520 = "П-понял."
