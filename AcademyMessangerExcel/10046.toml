10046-100460450 = "Ah..."
10046-100460460 = "Hum, é que..."
10046-100460470 = "Por acaso você não gosta de nadar, Izuna?"
10046-100460480 = "Ah, hum, não é bem não gostar..."
10046-100460490 = "É que..."
10046-100460500 = "A Izuna..."
