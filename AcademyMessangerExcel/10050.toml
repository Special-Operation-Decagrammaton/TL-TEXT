[translation]
10050-100500010 = "Olá, Sensei."
10050-100500020 = "Como você tem passado?"
10050-100500030 = "Eu estou ótima. Afinal de contas, sou a instrutora do Jardim da Flor de Ameixeira!"
10050-100500040 = "Instrutora, é... Deve ser puxado para você também, né, Kokona?"
10050-100500050 = "Não é muito puxado?"
10050-100500060 = "Tem horas em que dá bastante trabalho, mas eu tiro de letra."
10050-100500070 = "Acima de tudo, eu já sou uma verdadeira dama!"
10050-100500080 = "Sensei. Quando tiver um tempinho, que tal fazer uma visita ao Jardim da Flor de Ameixeira?"
10050-100500090 = "Vou mostrar para você como eu sou trabalhando como instrutora!"
10050-100500100 = "Conseguiu voltar bem para casa outro dia?"
10050-100500110 = "Que pena que não consegui mostrar um lado mais apresentável meu."
10050-100500120 = "Você já foi super legal lá, Kokona-chan."
10050-100500130 = "Você mandou muito bem como instrutora, Kokona-chan."
10050-100500140 = "Já falei que não é \"Kokona-chan\"!"
10050-100500150 = "Se você me chama de Kokona-chan,"
10050-100500160 = "então não deveria chamar a minha irmã Shun de \"Shun-chan\" também?"
10050-100500170 = "Acho que a Shun ia adorar se eu chamasse ela assim."
10050-100500180 = "Hum... Como assim?"
10050-100500190 = "Minha boca ainda está amarga..."
10050-100500200 = "Odeio café..."
10050-100500210 = "Eu estive pensando sobre isso,"
10050-100500220 = "e acho que conseguir tomar café não significa necessariamente ser adulto."
10050-100500230 = "Também devem existir adultos que não tomam café, não é?"
10050-100500240 = "Sim. Você não precisa se forçar a beber."
10050-100500250 = "Sabia que você ia concordar!"
10050-100500260 = "No mundo também existem comidas e bebidas com as quais a gente simplesmente não combina,"
10050-100500270 = "tipo eu e as cenouras, por exemplo."
10050-100500280 = "Da próxima vez eu coloco leite e açúcar no seu café."
10050-100500290 = "Leite e açúcar...!?"
10050-100500300 = "B-bom, se for assim, talvez eu possa reconsiderar...?"
10050-100500310 = "Não! Pensando bem, não precisa."
10050-100500320 = "Eu sou uma verdadeira dama, então não preciso dessas coisas."
10050-100500330 = "É só que o meu paladar e o café não combinam mesmo."
10050-100500340 = "Bom, então acho que eu mesmo vou colocar leite e açúcar para tomar um café bem gostoso."
10050-100500350 = "Isso não vale!"
10050-100500360 = "Os adultos são todos uns trapaceiros!"
10050-100500370 = "Por mais que eu pense, tenho certeza de que estou sendo enganada..."
10050-100500380 = "É impossível cenoura ficar gostosa..."
10050-100500390 = "Vamos lá comer cenouras deliciosas!"
10050-100500400 = "Pronta para ir ao restaurante de cenouras?"
10050-100500410 = "Eu tenho... mesmo... que ir...?"
10050-100500420 = "Buáá... snif... buááá..."
10050-100500430 = "Se eu morrer hoje, a culpa vai ser toda sua, viu, Sensei..."
10050-100500440 = "Confie em mim."
10050-100500450 = "Vou tratar você como uma verdadeira dama."
10050-100500460 = "Está bem."
10050-100500470 = "Eu vou... confiar em você, Sensei."
