[translation]
10050-100500010 = "Здравствуйте, Сенсей."
10050-100500020 = "Как ваши дела?"
10050-100500030 = "У меня всё отлично. Всё-таки я инструктор в Саду цветущей сливы!"
10050-100500040 = "Инструктор... Коконе, тебе, наверное, непросто."
10050-100500050 = "Непросто?"
10050-100500060 = "Иногда бывает тяжело, но всё в порядке."
10050-100500070 = "В конце концов, я уже взрослая леди!"
10050-100500080 = "Сенсей, если у вас будет время, не зайдёте ли в Сад цветущей сливы?"
10050-100500090 = "Я покажу вам себя в роли инструктора!"
10050-100500100 = "Вы тогда благополучно добрались?"
10050-100500110 = "Жаль, что я не смогла показать себя с лучшей стороны."
10050-100500120 = "Ты и так выглядела очень достойно, Кокона."
10050-100500130 = "Ты отлично справлялась с ролью инструктора, Кокона."
10050-100500140 = "Я же не Кокона!"
10050-100500150 = "Если вы называете меня Кокона,"
10050-100500160 = "то стоит называть Шун «Шун-тян», как вы думаете?"
10050-100500170 = "Шун, наверное, обрадовалась бы."
10050-100500180 = "Э-э... что это значит?"
10050-100500190 = "У меня всё ещё горько во рту..."
10050-100500200 = "Я ненавижу кофе..."
10050-100500210 = "Я подумала,"
10050-100500220 = "что быть взрослым не обязательно означает уметь пить кофе."
10050-100500230 = "Есть же взрослые, которые его не пьют."
10050-100500240 = "Да, не обязательно заставлять себя."
10050-100500250 = "Вот именно!"
10050-100500260 = "В мире есть продукты, которые просто не идут,"
10050-100500270 = "например, как я и морковь."
10050-100500280 = "В следующий раз я добавлю в кофе молоко и сахар."
10050-100500290 = "Молоко и сахар...!?"
10050-100500300 = "Т-тогда, может быть, я попробую...?"
10050-100500310 = "Нет, не стоит."
10050-100500320 = "Я же взрослая леди, мне это не нужно."
10050-100500330 = "Просто кофе мне не подходит."
10050-100500340 = "Тогда я выпью вкусный кофе с молоком и сахаром."
10050-100500350 = "Нечестно!"
10050-100500360 = "Все взрослые такие нечестные!"
10050-100500370 = "Это точно какой-то обман..."
10050-100500380 = "Морковь не может быть вкусной..."
10050-100500390 = "Пойдём есть вкусную морковь!"
10050-100500400 = "Вы готовы пойти в морковный ресторан?"
10050-100500410 = "Неужели... обязательно...?"
10050-100500420 = "У-у-у... у-у-у..."
10050-100500430 = "Если я умру сегодня, это будет ваша вина..."
10050-100500440 = "Поверьте мне."
10050-100500450 = "Я буду относиться к вам как к прекрасной леди."
10050-100500460 = "Хорошо."
10050-100500470 = "Я... поверю вам."
