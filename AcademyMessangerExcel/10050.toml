[translation]
10050-100500010 = "Здравствуйте, Сенсей."
10050-100500020 = "Как дела?"
10050-100500030 = "У меня всё хорошо, ведь я наставница Сада цветущей сливы!"
10050-100500040 = "Наставница... На тебе много всего, Кокона."
10050-100500050 = "Разве не тяжело?"
10050-100500060 = "Да, но я справляюсь."
10050-100500070 = "И самое главное — теперь я настоящая леди!"
10050-100500080 = "Приходи в Сад цветущей сливы, когда сможешь!"
10050-100500090 = "Я покажу тебе, как работаю наставницей."
10050-100500100 = "Ты благополучно добрался?"
10050-100500110 = "Мне жаль, что я не смогла показать себя с лучшей стороны."
10050-100500120 = "Ты была крутой, Кокона."
10050-100500130 = "Всё было отлично, Кокона."
10050-100500140 = "Не называй меня Коконой. Зови меня наставницей Коконой!"
10050-100500150 = "Если называешь меня Коконой,"
10050-100500160 = "то и наставницу Шун будешь называть просто Шун?"
10050-100500170 = "Может, Шун это даже понравится."
10050-100500180 = "В смысле?"
10050-100500190 = "Я всё ещё чувствую эту горечь..."
10050-100500200 = "Ненавижу кофе..."
10050-100500210 = "Я тут подумала."
10050-100500220 = "Не думаю, что любовь к кофе делает человека взрослым."
10050-100500230 = "Наверняка есть взрослые, которые не любят кофе."
10050-100500240 = "Может, тебе пока рано, Кокона."
10050-100500250 = "Я просто говорю!"
10050-100500260 = "Нельзя ведь приучить себя любить абсолютно всё, понимаешь?"
10050-100500270 = "Например, я не могу есть морковь."
10050-100500280 = "В следующий раз добавлю тебе в кофе молоко и сахар."
10050-100500290 = "Молоко и сахар...?!"
10050-100500300 = "Т-тогда я, может быть, передумаю..."
10050-100500310 = "Нет, пожалуй, нет."
10050-100500320 = "Я настоящая леди, мне такое не нужно."
10050-100500330 = "Я просто не люблю кофе, вот и всё."
10050-100500340 = "Тогда я один буду пить вкусный кофе с молоком и сахаром!"
10050-100500350 = "Это нечестно!"
10050-100500360 = "Взрослые все нечестные!"
10050-100500370 = "У меня чувство, будто меня постоянно обманывают..."
10050-100500380 = "Я никогда не полюблю морковь..."
10050-100500390 = "Пойдём есть вкусную морковь!"
10050-100500400 = "Готова отправиться в морковный ресторан?"
10050-100500410 = "Мне... обязательно идти...?"
10050-100500420 = "У-у-у-у..."
10050-100500430 = "Если я сегодня умру, это будет твоя вина..."
10050-100500440 = "Доверься мне."
10050-100500450 = "Я буду обращаться с тобой как с настоящей леди."
10050-100500460 = "Хорошо."
10050-100500470 = "Я тебе верю."
