[translation]
13014-130140010 = "Сенсей, вы когда-нибудь слышали такую историю?"
13014-130140020 = "Типа «чем меньше одежды, тем выше защита»?"
13014-130140030 = "Типа бикини-доспехов?"
13014-130140040 = "Где ты это услышала!?"
13014-130140050 = "Бред какой-то, правда?"
13014-130140060 = "Но тренироваться в купальнике... как-то неловко."
13014-130140070 = "...Но разве молодость не в том, чтобы пробовать новое?"
13014-130140080 = "Раз уж так, сегодня я потренируюсь в купальнике."
13014-130140090 = "Ты идёшь в бассейн?"
13014-130140100 = "Нет, в горы."
13014-130140110 = "В купальнике!?"
13014-130140120 = "Ну всё."
13014-130140130 = "Решено!"
13014-130140140 = "Сенсей, тоже принесите купальник!"
13014-130140150 = "Сенсей, вы благополучно добрались?"
13014-130140160 = "Сегодня было правда весело."
13014-130140170 = "Было немного неловко, но я правильно сделала, что решилась."
13014-130140180 = "В следующий раз будет вторая часть тренировки в купальнике..."
13014-130140190 = "Буду рада, если снова составите мне компанию!"
13014-130140200 = "Только без упражнений, в которых купальник может слететь...!"
13014-130140210 = "Ладно, я подумаю!"
13014-130140220 = "Сенсей."
13014-130140230 = "Вторая часть тренировки в купальнике!"
13014-130140240 = "Соглашайся!"
13014-130140250 = "Что за тренировка?"
13014-130140260 = "На этот раз место действия..."
13014-130140270 = "Море!"
13014-130140280 = "О! Звучит круто!"
13014-130140290 = "Хе-хе, я знала, что вы обрадуетесь."
13014-130140300 = "Тогда до встречи в тот день!"
13014-130140310 = "Сенсей, вы благополучно добрались?"
13014-130140320 = "Видимо, даже для меня «побег на плоту» было перебором."
13014-130140330 = "У меня всё тело болит от крепатуры."
13014-130140340 = "А? Сенсей? Вы ведь это читаете...?"
13014-130140350 = "Прочитал, а ответа нет..."
13014-130140360 = "Неужели у вас даже пальцы не слушаются...?"
13014-130140370 = "А-а-а..."
13014-130140380 = "..."
13014-130140390 = "Я так и знала."
13014-130140400 = "В следующий раз я придумаю что-нибудь полегче."
13014-130140410 = "А пока отдыхайте спокойно!"
13014-130140420 = "Следующая тренировка –"
13014-130140430 = "костёр на пляже!"
13014-130140440 = "Ого!"
13014-130140450 = "Я сейчас приду!"
13014-130140460 = "Хе-хе, здорово же будет, правда?"
13014-130140470 = "Тогда я жду!"
13014-130140480 = "С-сенсей."
13014-130140490 = "Вы ведь благополучно добрались?"
13014-130140500 = "Прости, что из-за моих капризов"
13014-130140510 = "вам пришлось так тяжело."
13014-130140520 = "Я в порядке!"
13014-130140530 = "Мне тоже было весело!"
13014-130140540 = "Приятно слышать, спасибо."
13014-130140550 = "В следующий раз я исправлю эту ошибку!"
13014-130140560 = "Ну, до встречи!"
13014-130140570 = "Сенсей."
13014-130140580 = "Есть кое-что, что я хочу попробовать..."
13014-130140590 = "Ты не против составить мне компанию?"
13014-130140600 = "На этот раз это не тренировка."
13014-130140610 = "Я хочу искупить вину за тот костёр."
13014-130140620 = "Конечно! Я с тобой куда угодно, Ренге!"
13014-130140630 = "Спасибо, Сенсей!"
13014-130140640 = "Тогда встречаемся на ночном пляже!"
13014-130140650 = "Как тебе сегодняшнее...?"
13014-130140660 = "Было очень весело!"
13014-130140670 = "Я насладилась молодостью!"
13014-130140680 = "Ну и хорошо."
13014-130140690 = "Мне тоже... было весело."
13014-130140700 = "В следующий раз запустим фейерверки вместе."
13014-130140710 = "В этот раз, наверное, возьмём фейерверки побольше."
13014-130140720 = "Конечно, не слишком большие!"
13014-130140730 = "Да, я с нетерпением жду!"
13014-130140740 = "Хе-хе, давай ещё раз насладимся молодостью!"