[translation]
13014-130140010 = "Наставник. Вы когда-нибудь слышали такое?"
13014-130140020 = "Чем меньше одежды, тем выше защита."
13014-130140030 = "Типа... брони-бикини?"
13014-130140040 = "Где ты это услышала?!"
13014-130140050 = "Звучит странно, да?"
13014-130140060 = "И тренироваться в купальнике довольно... стыдно..."
13014-130140070 = "Но принять такой вызов — тоже часть юности!"
13014-130140080 = "Поэтому сегодня я буду тренироваться в купальнике!"
13014-130140090 = "Ты идёшь в бассейн?"
13014-130140100 = "Нет. В горы."
13014-130140110 = "В купальнике?!"
13014-130140120 = "Хорошо!"
13014-130140130 = "Я решила!"
13014-130140140 = "Вам тоже нужно взять купальник, Наставник!"
13014-130140150 = "Наставник! Вы благополучно добрались домой?"
13014-130140160 = "Сегодняшняя тренировка была очень весёлой, правда?"
13014-130140170 = "Я так и знала... Стоило набраться смелости и преодолеть смущение!"
13014-130140180 = "Будет второй раунд тренировки в купальнике..."
13014-130140190 = "Так что в следующий раз тоже присоединяйтесь, Наставник!"
13014-130140200 = "...Только если мой купальник останется на месте... пожалуйста."
13014-130140210 = "Ха-ха, учту!"
13014-130140220 = "Наставник."
13014-130140230 = "Тренировка в купальнике! Раунд 2!"
13014-130140240 = "Пора!"
13014-130140250 = "Какая тренировка на этот раз?"
13014-130140260 = "Местом действия будет"
13014-130140270 = "океан!!"
13014-130140280 = "О, пляж! Я в деле!"
13014-130140290 = "Фуфу, я знала, что вы согласитесь, Наставник."
13014-130140300 = "Тогда увидимся! Расписание тренировки уже готово!"
13014-130140310 = "Наставник! Вы благополучно добрались домой?"
13014-130140320 = "Угх... Видимо, строить спасательный плот было немного чересчур..."
13014-130140330 = "Всё тело болит."
13014-130140340 = "Хм? Наставник? Алло? Вы здесь, да?"
13014-130140350 = "Я вижу отметку о прочтении, но вы не отвечаете!"
13014-130140360 = "Вы... настолько устали, что даже пальцами пошевелить не можете?"
13014-130140370 = "Аг"
13014-130140380 = "..."
13014-130140390 = "А. Понятно..."
13014-130140400 = "В следующий раз тренировка будет легче. Обещаю."
13014-130140410 = "Хорошенько отдохните! Я ещё свяжусь!"
13014-130140420 = "Я придумала хорошую тренировку на пляже!"
13014-130140430 = "Развести костёр!"
13014-130140440 = "О-о, костёр!"
13014-130140450 = "Я иду!"
13014-130140460 = "Фуфуфу. Звучит весело, правда?"
13014-130140470 = "Тогда встретимся!"
13014-130140480 = "Эм, Наставник."
13014-130140490 = "Ты нормально добрался обратно?"
13014-130140500 = "Я опять слишком увлеклась, да?"
13014-130140510 = "Прости, что заставила тебя через всё это пройти..."
13014-130140520 = "Я в порядке!"
13014-130140530 = "Мне было весело, так что не переживай!"
13014-130140540 = "Хорошо... Спасибо, что успокоили, Наставник."
13014-130140550 = "Тогда увидимся позже."
13014-130140560 = "Обещаю, в следующий раз всё компенсировать!"
13014-130140570 = "Эм, так вот."
13014-130140580 = "Есть кое-что, что я хотела бы сделать с вами вдвоём... на пляже."
13014-130140590 = "Пойдёте со мной?"
13014-130140600 = "Это не тренировка, так что обещаю: ничего тяжёлого или сложного не будет!"
13014-130140610 = "Я правда хочу загладить вину за тот провал с костром!"
13014-130140620 = "С удовольствием! Куда угодно, Рэнгэ!"
13014-130140630 = "Отлично! Спасибо, Наставник!"
13014-130140640 = "Увидимся сегодня вечером на пляже!"
13014-130140650 = "Как вам сегодня, Наставник?"
13014-130140660 = "Мне понравились фейерверки!"
13014-130140670 = "Я по-настоящему почувствовала «юность»!"
13014-130140680 = "Рада, что вам было весело, Наставник."
13014-130140690 = "Мне тоже было очень хорошо..."
13014-130140700 = "Давайте как-нибудь повторим, ладно?"
13014-130140710 = "Я подготовлю фейерверки побольше."
13014-130140720 = "Но не слишком большие! Обещаю!"
13014-130140730 = "Звучит хорошо. Буду ждать."
13014-130140740 = "Хи-хи, давайте и дальше наслаждаться юностью вместе!"
