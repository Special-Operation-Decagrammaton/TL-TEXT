[translation]
13014-130140010 = "Mestre, você já ouviu falar daquela história?"
13014-130140020 = "Aquela de que \"quanto mais pele à mostra, maior é a defesa da armadura\""
13014-130140030 = "E-Está falando de armadura-biquíni de RPG?"
13014-130140040 = "Onde foi que você ouviu isso?!"
13014-130140050 = "É uma história bem absurda, né"
13014-130140060 = "Treinar de roupa de banho dá um pouquinho de vergonha, mas..."
13014-130140070 = "...A juventude é feita de encarar novos desafios, não é?"
13014-130140080 = "Então vou aproveitar para fazer o meu treinamento de roupa de banho hoje"
13014-130140090 = "Vai para a piscina ou algo assim?"
13014-130140100 = "Não, vou para a montanha mesmo"
13014-130140110 = "De roupa de banho?!"
13014-130140120 = "Beleeza"
13014-130140130 = "Decidido!"
13014-130140140 = "Traga a sua roupa de banho também, Mestre!"
13014-130140150 = "Mestre! Chegou bem em casa?"
13014-130140160 = "Hoje foi muito divertido mesmo"
13014-130140170 = "Fiquei com um pouco de vergonha, mas... valeu a pena criar coragem"
13014-130140180 = "Da próxima vez vai rolar a Parte 2 do treinamento de roupa de banho..."
13014-130140190 = "Ficaria muito feliz se você me acompanhasse de novo!"
13014-130140200 = "Por favor, escolha uma modalidade em que a roupa de banho não corra o risco de sair...!"
13014-130140210 = "Deixa comigo, vou pensar em algo!"
13014-130140220 = "Mestre"
13014-130140230 = "Chegou a hora da Parte 2 do treinamento de roupa de banho!"
13014-130140240 = "Vem comigo, por favor!"
13014-130140250 = "Que tipo de treino vai ser?"
13014-130140260 = "O palco desta vez será..."
13014-130140270 = "O mar!"
13014-130140280 = "Opa! Aí sim!"
13014-130140290 = "Fufu, sabia que você ia gostar"
13014-130140300 = "Nos vemos no dia, então!"
13014-130140310 = "Mestre! Conseguiu voltar bem pra casa?"
13014-130140320 = "Acho que até para mim \"fugir do mar em uma jangada\" foi um pouco de exagero"
13014-130140330 = "Meus músculos estão todos doloridos"
13014-130140340 = "Ué? Mestre? Você está lendo isso... não está?"
13014-130140350 = "Apareceu como lido, mas não tem resposta"
13014-130140360 = "Não me diga que você está sem forças até nos dedos para digitar...?"
13014-130140370 = "u  ah"
13014-130140380 = "..."
13014-130140390 = "Sabia, era isso mesmo"
13014-130140400 = "Da próxima vez vou escolher um treino bem mais leve"
13014-130140410 = "Descanse bastante até lá!"
13014-130140420 = "O treinamento desta vez será..."
13014-130140430 = "Uma fogueira de acampamento na praia!"
13014-130140440 = "Ooooh!"
13014-130140450 = "Estou indo agora mesmo!"
13014-130140460 = "Fufu, anima qualquer um, né?"
13014-130140470 = "Então fico te esperando!"
13014-130140480 = "M-Mestre"
13014-130140490 = "Você conseguiu chegar bem em casa, né?"
13014-130140500 = "Por causa da minha teimosia"
13014-130140510 = "acabei fazendo você passar por um baita aperto, me desculpa"
13014-130140520 = "Eu estou ótimo!"
13014-130140530 = "Eu também me diverti bastante!"
13014-130140540 = "Fico mais aliviada em ouvir isso, obrigada"
13014-130140550 = "Juro que na próxima vez vou compensar esse fracasso!"
13014-130140560 = "Até mais!"
13014-130140570 = "Mestre"
13014-130140580 = "Tem uma coisa que eu queria muito experimentar..."
13014-130140590 = "Você me faria companhia?"
13014-130140600 = "Dessa vez não é treinamento, viu"
13014-130140610 = "É que quero compensar o que aconteceu naquela fogueira"
13014-130140620 = "Claro! Pela Renge eu vou para qualquer lugar!"
13014-130140630 = "Obrigada, Mestre!"
13014-130140640 = "Então nos vemos na praia à noite!"
13014-130140650 = "O que achou de hoje...?"
13014-130140660 = "Foi super divertido!"
13014-130140670 = "Curti a juventude ao máximo!"
13014-130140680 = "Fico muito feliz em saber"
13014-130140690 = "Eu também... me diverti demais"
13014-130140700 = "Vamos soltar fogos de artifício juntos na próxima também"
13014-130140710 = "E da próxima vez, quem sabe uns fogos um pouquinho maiores"
13014-130140720 = "Claro, sem exagerar no tamanho!"
13014-130140730 = "Sim, mal posso esperar!"
13014-130140740 = "Hehe, vamos sair para curtir a juventude de novo!"
