[translation]
13000-2260 = "Здравствуйте, Мастер."
13000-2261 = "Это правда?"
13000-2262 = "А, точно. Не Мастер, а Сенсей!"
13000-2263 = "Такой у вас юмор, да?"
13000-2264 = "Рада познакомиться. Меня зовут Аканэ, и я ваша горничная."
13000-2265 = "...А?"
13000-2266 = "Сегодня было весело."
13000-2267 = "Я буду рядом всякий раз, когда понадоблюсь. Разве не здорово?"
13000-2268 = "Я уже скучаю по вам."
13000-2269 = "Кажется, прошло так много времени."
13000-2270 = "Когда мы впервые встретились..."
13000-2271 = "моё сердце так сильно колотилось!"
13000-2272 = "А что чувствовали вы?"
13000-2273 = "У меня сердце тоже быстро билось. Когда здание взорвалось..."
13000-2274 = "Я помню это как вчера."
13000-2275 = "О! Я так рада."
13000-2276 = "Когда закрываю глаза... вижу ваше лицо в тот момент нашей первой встречи."
13000-2277 = "Лучшие отношения начинаются с сильного первого впечатления."
13000-2278 = "Огромное спасибо."
13000-2279 = "Хорошего дня, Мастер."
13000-2280 = "Я на важном задании и мне нужно отправиться на Чёрный рынок."
13000-2281 = "Чёрный рынок? Но там опасно."
13000-2282 = "Важное задание?"
13000-2283 = "Да... очень опасное."
13000-2284 = "Я про мои цели."
13000-2285 = "Уверена, вы помните с прошлого раза..."
13000-2286 = "Горничная C&C — это своего рода агент."
13000-2287 = "Пора сделать что-нибудь значимое для Миллениума."
13000-2288 = "Моя единственная надежда..."
13000-2289 = "что сегодня я встречу вас..."
13000-2290 = "Вот о чём я думаю."
13000-2291 = "Вы как четырёхлистный клевер — всегда приносите мне удачу."
13000-2292 = "Не-а."
13000-2293 = "Встреча с вами, возможно, лучшее, что случалось со мной в последнее время."
13000-2294 = "Согласен."
13000-2295 = "Я тоже рад, что встретил тебя, Аканэ."
13000-2296 = "Ого! Скромностью вы не страдаете."
13000-2297 = "Ха-ха! Но мне это нравится."
13000-2298 = "Ха-ха! Рада слышать."
13000-2299 = "Надеюсь, удача сегодня будет на вашей стороне, Сенсей!"
13000-2300 = "Мы идём на задание вместе. Я так взволнована!"
13000-2301 = "Вы тоже ждёте сегодняшний день?"
13000-2302 = "Я прошлой ночью едва смогла заснуть от волнения."
13000-2303 = "Сон важен."
13000-2304 = "Ты точно справишься?"
13000-2305 = "О, не волнуйтесь."
13000-2306 = "Пока я с вами, Сенсей..."
13000-2307 = "я всегда в лучшей форме."
13000-2308 = "Благодаря C&C все злодеи понесли наказание!"
13000-2309 = "Но MVP сегодняшнего дня... это вы, Мастер!"
13000-2310 = "Возможно, ещё слишком рано, чтобы вы увидели это сообщение, но..."
13000-2311 = "Я только что вышла."
13000-2312 = "Куда? К вам домой, Мастер."
13000-2313 = "Прямо сейчас? Глубокая ночь."
13000-2314 = "Это сон?"
13000-2315 = "Я вас не подведу!"
13000-2316 = "В следующий раз, когда увидимся, будет наша годовщина!"
13000-2317 = "Годовщина?"
13000-2318 = "Хи-хи! Вы должны радоваться!"
13000-2319 = "Вы выполнили все мои просьбы, Мастер?"
13000-2320 = "Подождите минутку."
13000-2321 = "Теперь я начну отплачивать вам."
13000-2322 = "П-Погоди! Просьб слишком много!"
13000-2323 = "Отплачивать мне?"
13000-2324 = "Пожалуйста, подождите!"
13000-2325 = "Вы захотите, чтобы..."
13000-2326 = "я была первым человеком, которого вы увидите, открыв глаза."
13000-2327 = "Именно так вы подумаете."
