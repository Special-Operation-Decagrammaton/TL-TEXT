[translation]
10085-100850010 = "Sensei"
10085-100850020 = "Você já ouviu o termo \"nômade digital\"?"
10085-100850030 = "Acho que já vi na internet antes..."
10085-100850040 = "Nômade digital se refere a pessoas que trabalham pelo computador sem ficarem presas a um único lugar."
10085-100850050 = "Os aparelhos digitais estão cada vez mais compactos hoje em dia..."
10085-100850060 = "E dizem que muitos programadores andam com o notebook por aí para programar ao ar livre."
10085-100850070 = "Parece bem legal."
10085-100850080 = "Pois é. Vi umas fotos que o pessoal postou num fórum trabalhando em vários lugares, e achei legal a ideia de trabalhar apreciando a paisagem."
10085-100850090 = "Será que na próxima eu tento trabalhar lá fora também...?"
10085-100850100 = "Ué, você não detestava sair ao ar livre?"
10085-100850110 = "..."
10085-100850120 = "Não é bem assim, Sensei."
10085-100850130 = "Eu só odeio ambientes com mudanças bruscas de temperatura e sem conexão com a internet."
10085-100850140 = "Na verdade, eu até gosto de paisagens bonitas."
10085-100850150 = "Já que estamos falando nisso... que tal experimentar esse trabalho nômade comigo, Sensei?"
10085-100850160 = "Sabe, ultimamente..."
10085-100850170 = "Parece que \"glamping\" está na moda entre as alunas."
10085-100850180 = "Glamping?"
10085-100850190 = "É. É um termo que significa acampamento de luxo, onde você pode curtir tranquilamente usando os equipamentos que já ficam prontos no local."
10085-100850200 = "E ouvi dizer que tem lugares equipados até com TV e ar-condicionado."
10085-100850210 = "Parece divertido..."
10085-100850220 = "Eu bem que gostaria de ir pelo menos uma vez..."
10085-100850230 = "Seria bom ter um servidor também, né?"
10085-100850240 = "Já que é pra ir, eu ia querer usar a internet à vontade."
10085-100850250 = "E também queria que tivesse uma loja de conveniência 24 horas por perto..."
10085-100850260 = "Pensando bem, acho que seria mais fácil armar uma barraca dentro do campus da escola mesmo."
10085-100850270 = "Mas aí já não é mais glamping, né...?"
10085-100850280 = "Sensei, você pode vir para a Millennium agora?"
10085-100850290 = "Não consigo resolver isso sozinha de jeito nenhum..."
10085-100850300 = "Se puder, queria a sua ajuda."
10085-100850310 = "Claro, já estou indo."
10085-100850320 = "Um problema que nem a Hare consegue resolver..."
10085-100850330 = "O que será...?"
10085-100850340 = "Não é um problema tão difícil assim, mas..."
10085-100850350 = "Ah, quando vier, venha com um calçado confortável para caminhar."
10085-100850360 = "Pode ser que a gente tenha que ir longe."
10085-100850370 = "...Como assim?"
10085-100850380 = "Descobri depois que voltei,"
10085-100850390 = "mas parece que aquele e-mail anônimo era da vice-presidente."
10085-100850400 = "Acho que ela queria me fazer exercitar a qualquer custo..."
10085-100850410 = "A Chihiro?"
10085-100850420 = "Que incomum."
10085-100850430 = "Poxa vida..."
10085-100850440 = "Como pedido de desculpas, ela me pagou um café que parecia bem caro."
10085-100850450 = "Bom, dessa vez nem precisava de pedido de desculpas, na verdade."
10085-100850460 = "Quer dizer,"
10085-100850470 = "esquece o que eu acabei de falar."
10085-100850480 = "Sensei"
10085-100850490 = "Na verdade, saiu o resultado do meu check-up médico."
10085-100850500 = "Disseram que o meu estômago não está muito bem."
10085-100850510 = "Por isso, parece que vou precisar reduzir a cafeína..."
10085-100850520 = "...Talvez seja uma boa oportunidade?"
10085-100850530 = "Bom, se piorar vai ser tarde demais..."
10085-100850540 = "Racionalmente eu entendo isso,"
10085-100850550 = "mas na hora que me concentro no trabalho, minha mão vai no automático..."
10085-100850560 = "Hábitos não mudam tão fácil assim, né?"
10085-100850570 = "Por isso mesmo, tive uma boa ideia para diminuir a cafeína."
10085-100850580 = "Mas preciso fazer alguns preparativos antes."
10085-100850590 = "Você me ajuda, Sensei?"
10085-100850600 = "Com certeza."
10085-100850610 = "Precisa que eu leve alguma coisa?"
10085-100850620 = "Obrigada."
10085-100850630 = "Então, neste fim de semana, você pode vir até a área de camping da Millennium?"
10085-100850640 = "Explico os detalhes quando você chegar."
