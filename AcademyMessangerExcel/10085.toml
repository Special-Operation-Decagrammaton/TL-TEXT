[translation]
10085-100850010 = "Сенсей."
10085-100850020 = "Ты слышал выражение «цифровой кочевник»?"
10085-100850030 = "Кажется, я когда-то видел это в статье..."
10085-100850040 = "Всё буквально: люди путешествуют со своими технологиями. Они не привязаны к одному дому и ездят куда захотят."
10085-100850050 = "За последние годы устройства стали очень портативными."
10085-100850060 = "Я даже знаю программистов, которые просто отдыхают на улице и пишут код на ноутбуках."
10085-100850070 = "Звучит интересно."
10085-100850080 = "Правда? Я читала об этом на форуме. Звучало довольно круто."
10085-100850090 = "Думаю, попробую и я."
10085-100850100 = "Но природа ведь не совсем твоё..."
10085-100850110 = "..."
10085-100850120 = "Ты судишь стереотипами, Сенсей."
10085-100850130 = "Я просто не люблю места с экстремальной погодой и без интернета."
10085-100850140 = "Красивый вид мне нравится не меньше, чем любому другому студенту."
10085-100850150 = "Так что теперь, когда ты в курсе... Попробуешь со мной образ жизни цифрового кочевника в следующие выходные?"
10085-100850160 = "Я увидела в интернете один тренд."
10085-100850170 = "Называется глэмпинг."
10085-100850180 = "Что это?"
10085-100850190 = "Это сокращение от «гламурного кемпинга». В кемпинге предоставляют палатки, спальные места, кухонное оборудование и всё необходимое. Нужно только приехать."
10085-100850200 = "Иногда там даже есть телевизор, кондиционер и простая кухня!"
10085-100850210 = "Звучит удобно!"
10085-100850220 = "Я хочу попробовать..."
10085-100850230 = "Всё это здорово,"
10085-100850240 = "но для меня важнее всего очень хороший доступ в интернет."
10085-100850250 = "О, и круглосуточный магазин с энергетиками."
10085-100850260 = "Было бы неплохо, если бы кемпинг был ещё и рядом с клубной комнатой. Тогда не пришлось бы далеко ходить."
10085-100850270 = "Кажется, мы упускаем сам смысл кемпинга..."
10085-100850280 = "Сенсей! Можешь прямо сейчас прийти? Я в Миллениуме."
10085-100850290 = "У меня тут вроде как... проблема, с которой я не могу справиться сама."
10085-100850300 = "Так что я прошу тебя помочь."
10085-100850310 = "Уже иду!"
10085-100850320 = "Проблема, которую даже Харэ не может решить..."
10085-100850330 = "Интересно, что может поставить Харэ в тупик..."
10085-100850340 = "Ну, дело не столько в самой проблеме, сколько..."
10085-100850350 = "Лучше объясню лично."
10085-100850360 = "Правда, идти, возможно, далеко, так что надень удобную обувь."
10085-100850370 = "...И что именно мы будем делать?"
10085-100850380 = "Задним числом всё всегда кажется очевидным."
10085-100850390 = "Анонимное письмо оказалось просто розыгрышем Чихиро."
10085-100850400 = "Она сказала: «Я сделаю всё, чтобы заставить тебя больше двигаться!»"
10085-100850410 = "Я не то чтобы злюсь, но..."
10085-100850420 = "от неё такого совсем не ожидала."
10085-100850430 = "Правда?!"
10085-100850440 = "Правда, в качестве извинения она купила мне очень дорогой кофе..."
10085-100850450 = "Так что, наверное, в итоге всё уравновесилось."
10085-100850460 = "Нет."
10085-100850470 = "Ничего."
10085-100850480 = "Хм..."
10085-100850490 = "В прошлом месяце я ходила к врачу,"
10085-100850500 = "и, похоже, он немного беспокоится о состоянии моего желудка."
10085-100850510 = "Мне сказали, что стоит пить меньше кофеина?"
10085-100850520 = "Наверное, это хорошая идея."
10085-100850530 = "Лучшее лечение — профилактика."
10085-100850540 = "Эй, сказать проще, чем сделать."
10085-100850550 = "Я УЖЕ пыталась бросить, но будто вообще не могу работать, если на столе нет энергетика."
10085-100850560 = "От привычек очень трудно избавляться!"
10085-100850570 = "Подожди. У меня есть идея."
10085-100850580 = "Правда, придётся многое продумать."
10085-100850590 = "Поможешь мне, Сенсей?"
10085-100850600 = "Можно и то и другое!"
10085-100850610 = "Чем помочь?"
10085-100850620 = "Спасибо, Сенсей."
10085-100850630 = "Как насчёт этих выходных? Встретишься со мной в кемпинге возле школы?"
10085-100850640 = "Там и расскажу план!"
