[translation]
10085-100850010 = "Сенсей"
10085-100850020 = "Вы слышали такое слово — «цифровой кочевник»?"
10085-100850030 = "Кажется, я раньше слышал это в интернете..."
10085-100850040 = "Цифровой кочевник — это человек, который работает не привязавшись к месту, используя для этого компьютер"
10085-100850050 = "В последнее время цифровые устройства становятся всё компактнее..."
10085-100850060 = "Говорят, много программистов носят с собой ноутбуки и пишут код на улице"
10085-100850070 = "Звучит круто"
10085-100850080 = "Ага. Я на форуме видела фотографии, сделанные в местах, где кочевники работают. Здорово, когда можно любоваться пейзажем и работать одновременно"
10085-100850090 = "Может, мне тоже попробовать поработать на улице...?"
10085-100850100 = "Разве ты не не любишь находиться на улице?"
10085-100850110 = "..."
10085-100850120 = "Не совсем так, Сенсей"
10085-100850130 = "Я просто не люблю резкие перепады температур и места без интернета"
10085-100850140 = "Напротив, красивые виды я люблю"
10085-100850150 = "Раз уж так... может, попробуем поработать вместе, как цифровые кочевники?"
10085-100850160 = "Недавно"
10085-100850170 = "Говорят, среди студентов стало модно заниматься «глэмпингом»"
10085-100850180 = "Глэмпинг?"
10085-100850190 = "Ага. Это слово означает «роскошный кемпинг». В кемпингах уже всё подготовлено, так что можно легко наслаждаться отдыхом"
10085-100850200 = "И, кстати, говорят, в некоторых местах даже есть телевизоры и кондиционеры"
10085-100850210 = "Звучит интересно..."
10085-100850220 = "Может, как-нибудь съездить..."
10085-100850230 = "И ещё нужен сервер"
10085-100850240 = "Раз уж поехали, хочется пользоваться интернетом свободно"
10085-100850250 = "И чтобы круглосуточный магазин был рядом..."
10085-100850260 = "Мне кажется, проще было бы поставить палатку прямо на территории школы"
10085-100850270 = "Это уже не глэмпинг, правда...?"
10085-100850280 = "Сенсей, вы можете приехать в Миллениум прямо сейчас?"
10085-100850290 = "Одной мне не справиться..."
10085-100850300 = "Если не трудно, мне нужна ваша помощь"
10085-100850310 = "Конечно, я сейчас приду"
10085-100850320 = "Проблема, которую не решить даже Харе..."
10085-100850330 = "Что же это..."
10085-100850340 = "Это не такая уж сложная проблема..."
10085-100850350 = "А, кстати, когда будешь идти, надень удобную обувь"
10085-100850360 = "Возможно, путь будет долгим"
10085-100850370 = "...В каком смысле?"
10085-100850380 = "Я узнала уже после того, как вернулась"
10085-100850390 = "Оказывается, то анонимное письмо было от заместителя председателя"
10085-100850400 = "Интересно, она так хотела, чтобы я занялась спортом?"
10085-100850410 = "Тихо?"
10085-100850420 = "Она редко так делает"
10085-100850430 = "Ну что за..."
10085-100850440 = "В качестве извинения она угостила меня дорогим кофе"
10085-100850450 = "Впрочем, на этот раз я бы и без извинений обошлась"
10085-100850460 = "Не"
10085-100850470 = "Забудь, что я сказала"
10085-100850480 = "Сенсей"
10085-100850490 = "Я получила результаты медосмотра"
10085-100850500 = "Сказали, что у меня не очень хорошее состояние желудка"
10085-100850510 = "Поэтому мне нужно сократить потребление кофеина..."
10085-100850520 = "...Может, это хороший повод?"
10085-100850530 = "Да уж, пока не станет хуже..."
10085-100850540 = "Головой-то я понимаю"
10085-100850550 = "Но когда начинаю работать, рука сама тянется..."
10085-100850560 = "Привычки не так просто менять"
10085-100850570 = "И я придумала, как хорошо сократить кофеин"
10085-100850580 = "Но мне нужна подготовка"
10085-100850590 = "Сенсей, поможете?"
10085-100850600 = "Конечно"
10085-100850610 = "Что-то нужно принести?"
10085-100850620 = "Спасибо"
10085-100850630 = "Тогда в эти выходные приезжайте в кемпинг Миллениума"
10085-100850640 = "Подробности расскажу на месте"