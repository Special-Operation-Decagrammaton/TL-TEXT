[translation]
10146-101460010 = "Хорошие новости для Сенсея."
10146-101460020 = "Макото приготовила особое видео."
10146-101460030 = "Как вы думаете, что там?"
10146-101460040 = "Вы ведь умираете от любопытства, правда!?"
10146-101460050 = "Эм... о чём речь?"
10146-101460060 = "Интересно!!!"
10146-101460070 = "Кихехе."
10146-101460080 = "Я жду вас в Пандемониуме."
10146-101460090 = "Радуйтесь."
10146-101460100 = "Вам выпала честь запечатлеть в своих глазах великий первый шаг Макото!"
10146-101460110 = "У Макото есть гениальная идея."
10146-101460120 = "Я долго думала и придумала нечто прекрасное."
10146-101460130 = "Это важное дело, хочу обсудить лично, не в Момотолке."
10146-101460140 = "Я сейчас пришлю за вами!"
10146-101460150 = "Всё в порядке, я сам приду."
10146-101460160 = "Лимузин не нужен..."
10146-101460170 = "Мм?"
10146-101460180 = "Кихехе! Сенсей проницателен."
10146-101460190 = "Действительно, нужно действовать осторожно..."
10146-101460200 = "Кажется, я так хотела поскорее рассказать вам, что не учла это."
10146-101460210 = "Тогда жду вас!"
10146-101460220 = "В купальнике!"
10146-101460230 = "Зачем в купальнике!?"
10146-101460240 = "Я же простужусь."
10146-101460250 = "Всё же..."
10146-101460260 = "Это Макото."
10146-101460270 = "Сенсей."
10146-101460280 = "Наконец я поняла, что это за чувство."
10146-101460290 = "И я смогла идеально выразить его словами."
10146-101460300 = "Ого! И что же?"
10146-101460310 = "Что это за чувство?"
10146-101460320 = "…………"
10146-101460330 = "Это секрет!"
10146-101460340 = "Сенсей из Шале."
10146-101460350 = "Ой!?"
10146-101460360 = "Что случилось!?"
10146-101460370 = "...Что такое?"
10146-101460380 = "Кстати, насчёт модели купальников."
10146-101460390 = "Ах, да, вы об этом."
10146-101460400 = "Я забыл..."
10146-101460410 = "Я пришлю подробности позже."
10146-101460420 = "Вы обязательно должны прийти посмотреть."