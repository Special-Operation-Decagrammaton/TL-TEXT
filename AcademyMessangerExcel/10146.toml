[translation]
10146-101460010 = "Trago boas novas para você, Sensei"
10146-101460020 = "A grande Makoto-sama preparou um vídeo especial"
10146-101460030 = "Sobre o que você acha que é?"
10146-101460040 = "Deve estar tão curioso que mal consegue se aguentar, não é?!"
10146-101460050 = "Err... do que você está falando?"
10146-101460060 = "Estou super curioso!!!"
10146-101460070 = "Kishishi!"
10146-101460080 = "Estarei esperando no Pandemonium"
10146-101460090 = "Alegre-se"
10146-101460100 = "Pois terá a honra de gravar em suas retinas o grandioso primeiro passo de Makoto-sama!"
10146-101460110 = "Makoto-sama teve uma ideia brilhante"
10146-101460120 = "Depois daquilo, refleti profundamente... e me ocorreu um plano esplêndido"
10146-101460130 = "Trata-se de um assunto da mais alta importância. Quero falar pessoalmente, não pelo MomoTalk"
10146-101460140 = "Vou mandar uma escolta buscá-lo imediatamente!"
10146-101460150 = "Tudo bem, eu vou sozinho"
10146-101460160 = "Não precisa mandar limusine..."
10146-101460170 = "Hum?"
10146-101460180 = "Kishishi! Você é bem perspicaz, Sensei"
10146-101460190 = "De fato, precisamos agir com cautela neste caso..."
10146-101460200 = "Quem diria que alguém como eu estaria tão ansiosa para contar ao Sensei o quanto antes"
10146-101460210 = "Pois bem, estarei esperando!"
10146-101460220 = "De roupa de banho!"
10146-101460230 = "Por que de roupa de banho?!"
10146-101460240 = "Você vai acabar pegando um resfriado"
10146-101460250 = "Não esperava menos"
10146-101460260 = "de Makoto-sama"
10146-101460270 = "Ouça, Sensei"
10146-101460280 = "Finalmente descobri a verdadeira natureza dos meus próprios sentimentos"
10146-101460290 = "E mais: consegui colocá-los em palavras com perfeição"
10146-101460300 = "Oh! E então?"
10146-101460310 = "Que sentimento era esse?"
10146-101460320 = "............"
10146-101460330 = "Isso é segredo!"
10146-101460340 = "Ó Sensei da Schale"
10146-101460350 = "Ouh?!"
10146-101460360 = "Quê que fex?!"
10146-101460370 = "...O que houve?"
10146-101460380 = "Aliás, sobre aquele assunto de ser modelo de roupa de banho"
10146-101460390 = "Ah, era sobre isso"
10146-101460400 = "Eu tinha esquecido..."
10146-101460410 = "Entrarei em contato novamente com os detalhes"
10146-101460420 = "Faço questão que você venha assistir"
