[translation]
10146-101460010 = "Сенсей."
10146-101460020 = "Я, великая Макото, специально для вас подготовила видео."
10146-101460030 = "Знаю, вы просто сгораете от любопытства."
10146-101460040 = "Вам ведь ужасно хочется узнать, о чём оно, правда?"
10146-101460050 = "Что вообще происходит...?"
10146-101460060 = "Да! Очень хочется!"
10146-101460070 = "Ки-хе-хе."
10146-101460080 = "Буду ждать вас в зале Общества Пандемониума."
10146-101460090 = "Приготовьтесь."
10146-101460100 = "Ведь вам предстоит увидеть нечто ПОТРЯСАЮЩЕЕ!"
10146-101460110 = "Сенсей из Шале."
10146-101460120 = "После нашей прошлой встречи я долго размышляла. И придумала гениальный план."
10146-101460130 = "Но всё величие моего открытия невозможно передать обычным сообщением в MomoTalk!"
10146-101460140 = "Я пришлю за вами официальный эскорт, чтобы вас сюда доставили!"
10146-101460150 = "Нет-нет. Я сам доберусь."
10146-101460160 = "Мне правда не нужен лимузин..."
10146-101460170 = "Хм?"
10146-101460180 = "Сенсей, у вас превосходное чутьё! Как всегда!"
10146-101460190 = "Разумеется, такое дело требует строжайшей секретности!"
10146-101460200 = "Не верится, что я, великая Макото, чуть не загубила свою гениальную задумку ещё до начала!"
10146-101460210 = "Что ж, буду вас ждать!"
10146-101460220 = "В купальнике!"
10146-101460230 = "Просто ждите в обычной одежде..."
10146-101460240 = "Вы же простудитесь..."
10146-101460250 = "Понятно."
10146-101460260 = "Как и следовало от меня ожидать."
10146-101460270 = "Сенсей."
10146-101460280 = "После нашей прошлой встречи я наконец разобралась в своих истинных чувствах."
10146-101460290 = "И не только! Я ещё и нашла идеальные слова, чтобы их выразить!"
10146-101460300 = "О! Хочу услышать!"
10146-101460310 = "И какие же?"
10146-101460320 = "..."
10146-101460330 = "Это совершенно секретно!"
10146-101460340 = "Сенсей из Шале."
10146-101460350 = "Да-а-а?"
10146-101460360 = "Что?!"
10146-101460370 = "...Почему такая вялая реакция?"
10146-101460380 = "Речь о работе моделью, о которой я говорила раньше."
10146-101460390 = "А. Точно, об этом."
10146-101460400 = "Чуть не забыл..."
10146-101460410 = "Мы определились с местом и временем."
10146-101460420 = "Приходите, если сможете."
