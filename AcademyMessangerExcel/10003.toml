[translation]
10003-476 = "Sensei, Sensei!"
10003-477 = "Eu consegui!"
10003-478 = "Ontem eu consegui colocar as mãos em um produto super raro dos Momo Friends!"
10003-479 = "Que maravilha! Que tipo de produto é?"
10003-480 = "Ehehe, isso ainda é segredo."
10003-481 = "Mostro pra você pessoalmente na próxima vez que a gente se encontrar!"
10003-482 = "Parece que vão lançar uma bolsa nova dos Momo Friends no formato do Grande Irmão!"
10003-483 = "Humm... ela também é uma graça e me deixa meio na dúvida, mas..."
10003-484 = "Acho que pra mim a bolsa do Peroro-sama continua sendo a número um...!"
10003-485 = "Falando nisso, Hifumi, você tá sempre com a mesma bolsa, né?"
10003-486 = "Ah, diz aquela bolsa do Peroro-sama?"
10003-487 = "Ehehe, ela é fofa demais, né?"
10003-488 = "Aquela bolsa é um item de edição limitada lançado bem no comecinho dos Momo Friends."
10003-489 = "Tem bastante espaço interno e cabe um monte de coisas."
10003-490 = "É o meu tesouro número 1!"
10003-491 = "Sensei, sabe a máquina de garra do fliperama em frente à estação?!"
10003-492 = "Parece que chegaram pelúcias novas dos Momo Friends lá!"
10003-493 = "Quais pelúcias será que colocaram?"
10003-494 = "Mal posso esperar pelo fim das aulas hoje!"
10003-495 = "Se tá tão curiosa assim, que tal darmos um pulo juntos no fliperama na hora do almoço?"
10003-496 = "Sério mesmo?! Tem certeza?!"
10003-497 = "Muito obrigada! Então vou estar te esperando, Sensei!\n(o^－^o)"
10003-498 = "Por que será que existem tantas pessoas sofrendo neste mundo?"
10003-499 = "Eu queria muito poder fazer alguma coisa para que todos fossem felizes, mas..."
10003-500 = "Não consigo fazer nada... e isso me deixa triste."
10003-501 = "Tá tudo bem? Aconteceu alguma coisa que tá te preocupando?"
10003-502 = "Não, comigo está tudo bem, mas..."
10003-503 = "Muito obrigada por me ouvir hoje, Sensei."
10003-504 = "Poder desabafar o que eu estava guardando no peito há tanto tempo me deixou bem mais aliviada."
10003-505 = "Hum... se eu voltar a ficar preocupada com alguma coisa, você me escuta de novo?"
10003-506 = "Pode contar comigo a qualquer hora."
10003-507 = "Muito obrigada, Sensei."
10003-508 = "Fico tão feliz por ter você ao meu lado, Sensei."
10003-509 = "Sensei, sobre o meu plantão na Schale que estava marcado para amanhã à tarde..."
10003-510 = "Tudo bem se a gente mudar para a parte da manhã?"
10003-511 = "É que surgiu um outro compromisso que eu queria encaixar à tarde..."
10003-512 = "Claro, sem problemas. Aliás, que compromisso é esse?"
10003-513 = "Combinei com as minhas amigas da escola de sairmos para passear em algum lugar."
10003-514 = "Já tô super animada pensando no que a gente vai fazer! Ehehe...!"
10003-515 = "Sensei, você está livre no próximo fim de semana?"
10003-516 = "Preciso ir perto da Arena Pública comprar alguns materiais para o Clube de Aulas de Recuperação."
10003-517 = "Se quiser, que tal aproveitarmos para fazer compras juntos depois?"
10003-518 = "Eu também tinha umas coisas pra resolver por lá, então vamos sim!"
10003-519 = "Que ótimo! Então nos vemos no próximo fim de semana, em frente à Arena Pública de Kivotos!"
