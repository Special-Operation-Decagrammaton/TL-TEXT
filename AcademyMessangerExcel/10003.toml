[translation]
10003-476 = "Сенсей, Сенсей!"
10003-477 = "Получилось!"
10003-478 = "Вчера я смогла заполучить редкий товар по Момофрендс!"
10003-479 = "Это здорово, что за товар?"
10003-480 = "Хе-хе, это пока секрет."
10003-481 = "В следующий раз, когда увидимся, я покажу вам лично!"
10003-482 = "Говорят, скоро выйдет новая сумка в виде Старшего Брата из Момофрендс!"
10003-483 = "Хм-м... она тоже милая, и я немного в замешательстве..."
10003-484 = "Но для меня сумка с Пероро-сама, наверное, всё же самая лучшая...!"
10003-485 = "Кстати, Хифуми, ты всегда носишь одну и ту же сумку."
10003-486 = "А, ту сумку с Пероро-сама?"
10003-487 = "Хе-хе, она ведь милая, правда?"
10003-488 = "Это лимитированная вещь, которая вышла ещё в самом начале Момофрендс."
10003-489 = "В ней много отделений, можно много чего положить."
10003-490 = "Это мое сокровище номер один!"
10003-491 = "Сенсей, в игровом автомате у вокзала!"
10003-492 = "Похоже, туда положили новые плюшевые игрушки по Момофрендс!"
10003-493 = "Что же там за игрушки?"
10003-494 = "Я уже сейчас с нетерпением жду после уроков!"
10003-495 = "Если тебе так интересно, может, сходим в игровой центр во время обеда?"
10003-496 = "Правда!? Это правда можно!?"
10003-497 = "Спасибо! Тогда я буду ждать вас, Сенсей!\n(o^－^o)"
10003-498 = "Почему в мире так много страдающих людей?"
10003-499 = "Если возможно, я хотела бы что-то сделать, чтобы все были счастливы, но..."
10003-500 = "Я ничего не могу... мне грустно."
10003-501 = "Ты в порядке? Что-то тебя беспокоит?"
10003-502 = "Нет, со мной всё в порядке, но..."
10003-503 = "Спасибо, что выслушали меня, Сенсей."
10003-504 = "Я высказала то, что давно держала в себе, и стало легче."
10003-505 = "Э-это... если я снова начну переживать, вы выслушаете меня?"
10003-506 = "Можешь всегда рассчитывать на меня."
10003-507 = "Спасибо, Сенсей."
10003-508 = "Я так рада, что вы рядом."
10003-509 = "Сенсей, насчёт дежурства в Шале, которое было запланировано на завтра после полудня,"
10003-510 = "можно перенести на утро?"
10003-511 = "Я хочу кое-что запланировать на вторую половину дня..."
10003-512 = "Да, без проблем. А что за планы?"
10003-513 = "Мы договорились с друзьями из академии пойти куда-нибудь развлечься."
10003-514 = "Я уже сейчас жду, что мы будем делать! Хе-хе...!"
10003-515 = "Сенсей, вы свободны в эти выходные?"
10003-516 = "Мне нужно съездить к общественной арене за принадлежностями для класса дополнительных занятий."
10003-517 = "Если хотите, можем потом вместе пойти по магазинам?"
10003-518 = "Как раз у меня там дела, так что с удовольствием."
10003-519 = "Отлично! Тогда в следующие выходные перед общественной ареной Кивотоса!"
