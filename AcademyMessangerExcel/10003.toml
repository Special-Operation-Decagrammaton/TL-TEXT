[translation]
10003-476 = "Сенсей, Сенсей!"
10003-477 = "У меня хорошие новости!"
10003-478 = "Я достала на аукционе редкий мерч Momo Friends!"
10003-479 = "На аукционе? Что именно?"
10003-480 = "Хи-хи, пока секрет."
10003-481 = "Покажу при следующей встрече!"
10003-482 = "Сенсей, Momo Friends выпускают новую сумку Старшего Брата!"
10003-483 = "Эм... Эта тоже милая, но..."
10003-484 = "Сумка с Пероро - моя любимая!"
10003-485 = "Кстати, ты всегда носишь одну и ту же сумку."
10003-486 = "Вы про мою сумку с Пероро?"
10003-487 = "Хи-хи, разве она не милая?"
10003-488 = "Эта сумка - драгоценная лимитированная вещь, выпущенная при первом запуске Momo Friends."
10003-489 = "Она довольно вместительная, поэтому туда помещается много всего."
10003-490 = "Это моё сокровище!"
10003-491 = "Сенсей, я слышала, что в игровом зале рядом со станцией"
10003-492 = "в автомате-кран появился новый плюшевый Momo Friends!"
10003-493 = "Интересно, какой именно..."
10003-494 = "Ох, не могу дождаться конца уроков!"
10003-495 = "Раз тебе так интересно, почему бы не заглянуть в игровой зал во время обеда?"
10003-496 = "Правда? Так можно?"
10003-497 = "Тогда я приду раньше и буду ждать вас, Сенсей!\n(o^－^o)"
10003-498 = "Почему в мире так много страдающих людей?"
10003-499 = "Хотела бы я знать, как сделать всех счастливыми..."
10003-500 = "Мне всегда больно оттого, что я ничем не могу им помочь."
10003-501 = "Тебя что-то беспокоит, Хифуми?"
10003-502 = "Нет, ничего..."
10003-503 = "Спасибо, что выслушали меня, Сенсей."
10003-504 = "Теперь, когда я выговорилась, мне гораздо легче."
10003-505 = "Эм... Если вы не против, можно я снова приду к вам, когда у меня будет проблема?"
10003-506 = "В любое время."
10003-507 = "Спасибо, Сенсей."
10003-508 = "Вы даже не представляете, как мне повезло, что вы у меня есть."
10003-509 = "Сенсей, можно перенести дежурство в Шале, назначенное"
10003-510 = "на завтра после обеда, на утро?"
10003-511 = "Мои друзья внезапно запланировали кое-что на вторую половину дня."
10003-512 = "Конечно. А что вы будете делать?"
10003-513 = "После уроков мы с друзьями идём в город!"
10003-514 = "Я уже жду не дождусь! Хи-хи..."
10003-515 = "Сенсей, вы свободны на этих выходных?"
10003-516 = "Мне нужно зайти к арене купить припасы для Клуба дополнительных занятий."
10003-517 = "Если вы не против, не хотите сходить со мной за покупками?"
10003-518 = "Договорились. Мне тоже нужно кое-что сделать в том районе."
10003-519 = "Отлично. Тогда встретимся перед Ареной Кивотоса на следующих выходных!"
