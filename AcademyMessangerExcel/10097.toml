[translation]
10097-100970010 = "Сенсей!"
10097-100970020 = "Занят?"
10097-100970030 = "Особых планов у меня нет..."
10097-100970040 = "Что случилось? Что-то произошло?"
10097-100970050 = "Я пишу тебе поздно ночью, разве не очевидно?"
10097-100970060 = "Мне чертовски скучно!"
10097-100970070 = "А где остальные из отряда RABBIT?"
10097-100970080 = "А, дело в том..."
10097-100970090 = "Эх, неинтересно просто писать тебе об этом."
10097-100970100 = "Если хочешь узнать, приходи по адресу, который я только что отправила."
10097-100970110 = "Буду ждать."
10097-100970120 = "Сенсей"
10097-100970130 = "Тут есть кое-что потрясающее!"
10097-100970140 = "Что происходит, Моэ?"
10097-100970150 = "Если тебе просто скучно, как в прошлый раз..."
10097-100970160 = "Взрывы"
10097-100970170 = "Взрывы не прекращаются!"
10097-100970180 = "Бесконечные взрывы!"
10097-100970190 = "Что?!"
10097-100970200 = "Что взрывается?!"
10097-100970210 = "Держись! Я иду тебя спасать!"
10097-100970220 = "Я слышала, что фрукты и мясо вкуснее всего прямо перед тем, как испортятся."
10097-100970230 = "Думаешь, с рыбой так же?"
10097-100970240 = "Что заставило тебя так решить?"
10097-100970250 = "Тут мне довелось попробовать кусаю..."
10097-100970260 = "А запах? ФУХ. Мерзость. Тухлятина. Но вкус был самым насыщенным из всего, что я пробовала."
10097-100970270 = "И я задумалась: вся рыба становится вкусной, если протухнет?"
10097-100970280 = "Существует множество видов ферментирующих бактерий, которые расщепляют белок."
10097-100970290 = "Технически это немного отличается от того, чтобы просто оставить продукт гнить."
10097-100970300 = "...Думаешь?"
10097-100970310 = "Ну..."
10097-100970320 = "В любом случае меня завораживает этот мерзкий запах, а не вкус."
10097-100970330 = "Тебе понравилась именно ЭТА часть?!"
10097-100970340 = "Какая морока..."
10097-100970350 = "Всё нормально?"
10097-100970360 = "Вчера переносной генератор начал барахлить, и я пошла посмотреть."
10097-100970370 = "Вокруг фильтра скопилась куча кристаллов соли."
10097-100970380 = "Наверное, морской бриз всё разъел."
10097-100970390 = "Звучит плохо."
10097-100970400 = "Так и есть. Сейчас уже не обработать антикоррозийным составом,"
10097-100970410 = "а перенести лагерь туда, где он будет защищён от морского бриза, некуда."
10097-100970420 = "Есть дешёвая комната, где поместился бы весь отряд?"
10097-100970430 = "Мы в глуши. Сомневаюсь."
10097-100970440 = "Эм..."
10097-100970450 = "Кажется, у меня есть решение."
10097-100970460 = "А? Правда?"
