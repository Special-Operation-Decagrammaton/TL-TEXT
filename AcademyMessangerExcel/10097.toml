[translation]
10097-100970010 = "Sensei~"
10097-100970020 = "Tá ocupado agora?"
10097-100970030 = "Não tenho nada em especial planejado..."
10097-100970040 = "Aconteceu alguma coisa?"
10097-100970050 = "Só pode ter um motivo pra eu te mandar mensagem a uma hora dessas, né?"
10097-100970060 = "Tô entediada!"
10097-100970070 = "...E o resto do pessoal?"
10097-100970080 = "Aah~"
10097-100970090 = "Se eu contar, capaz de você não querer vir."
10097-100970100 = "Se ficou curioso, dá um pulo aqui."
10097-100970110 = "Tô te esperando~"
10097-100970120 = "Sensei"
10097-100970130 = "Tem uma coisa absurda aqui!"
10097-100970140 = "O que deu em você assim do nada?"
10097-100970150 = "Por acaso você tá entediada de novo...?"
10097-100970160 = "As explosões..."
10097-100970170 = "As explosões não param!"
10097-100970180 = "Tá explodindo pra caramba!"
10097-100970190 = "Quê!?"
10097-100970200 = "O que tá explodindo!?"
10097-100970210 = "Aguenta firme! Já tô indo aí te ajudar!"
10097-100970220 = "Ouvi dizer que carnes e frutas ficam mais gostosas quando estão quase apodrecendo."
10097-100970230 = "Será que com peixe também é assim?"
10097-100970240 = "Por que essa pergunta do nada...?"
10097-100970250 = "É que eu tive a chance de provar kusaya aqui na vila,"
10097-100970260 = "e apesar do cheiro ser horrível, o sabor era super concentrado..."
10097-100970270 = "Aí fiquei pensando no que aconteceria se eu deixasse outros peixes apodrecerem também."
10097-100970280 = "Fermentação controlada e simplesmente deixar apodrecer..."
10097-100970290 = "Acho que são coisas bem diferentes, não?"
10097-100970300 = "...Ah, é?"
10097-100970310 = "Bom, mais do que no sabor,"
10097-100970320 = "eu só tô interessada na parte do cheiro horrível mesmo."
10097-100970330 = "Nessa parte!?"
10097-100970340 = "Complicado, viu..."
10097-100970350 = "O que houve?"
10097-100970360 = "É que o nosso gerador portátil tá dando problema desde ontem."
10097-100970370 = "Quando fui dar uma olhada, vi que tinha cristais de sal grudados no filtro."
10097-100970380 = "Por causa da maresia, a parte de dentro também enferrujou..."
10097-100970390 = "Poxa, que problemão..."
10097-100970400 = "Fazer tratamento anticorrosivo a essa altura do campeonato já não adianta."
10097-100970410 = "Mas mudar o nosso acampamento de lugar também é difícil."
10097-100970420 = "Será que não tem nenhuma pousada baratinha aqui por perto onde dê pra todo mundo ficar?"
10097-100970430 = "Acho difícil ter uma pousada dando sopa assim tão fácil..."
10097-100970440 = "Huum..."
10097-100970450 = "Se for isso, acho que consigo ajudar vocês."
10097-100970460 = "Hã, sério?"
