[translation]
10097-100970010 = "Сенсей~"
10097-100970020 = "Вы сейчас заняты?"
10097-100970030 = "Особых планов нет, но..."
10097-100970040 = "Что-то случилось?"
10097-100970050 = "Причина связаться в такое время только одна, верно?"
10097-100970060 = "Мне скучно!"
10097-100970070 = "...А остальные?"
10097-100970080 = "А~"
10097-100970090 = "Если я скажу, вы можете не прийти."
10097-100970100 = "Если интересно, приходите сюда."
10097-100970110 = "Жду~"
10097-100970120 = "Сенсей."
10097-100970130 = "Здесь нечто невероятное!"
10097-100970140 = "Что вдруг случилось?"
10097-100970150 = "Может, вам опять скучно...?"
10097-100970160 = "Взрывы."
10097-100970170 = "Взрывы не прекращаются."
10097-100970180 = "Сплошные взрывы!"
10097-100970190 = "Что!?"
10097-100970200 = "Что взрывается!?"
10097-100970210 = "Ждите! Я сейчас приду на помощь!"
10097-100970220 = "Говорят, что мясо и фрукты самые вкусные, когда они на грани порчи."
10097-100970230 = "Интересно, с рыбой тоже так?"
10097-100970240 = "С чего это вдруг...?"
10097-100970250 = "Видите ли, в этой деревне мне довелось попробовать кусайю."
10097-100970260 = "Запах был ужасный, но вкус был концентрированным..."
10097-100970270 = "И я задумалась, что будет с другой рыбой, если дать ей испортиться."
10097-100970280 = "Ферментация и простое гниение – это..."
10097-100970290 = "Наверное, разные вещи, верно?"
10097-100970300 = "...Понятно."
10097-100970310 = "Ну, меня больше, чем вкус,"
10097-100970320 = "интересует ужасный запах."
10097-100970330 = "Вот как!?"
10097-100970340 = "Проблема..."
10097-100970350 = "Что случилось?"
10097-100970360 = "Видите ли, с вчерашнего дня портативный генератор барахлит."
10097-100970370 = "Когда я проверил, на фильтре были кристаллы соли."
10097-100970380 = "Из-за морского ветра внутри тоже появилась ржавчина..."
10097-100970390 = "Серьёзная проблема..."
10097-100970400 = "Уже поздно обрабатывать антикоррозийным покрытием."
10097-100970410 = "С другой стороны, переносить лагерь тоже сложно."
10097-100970420 = "Нет ли поблизости дешёвого жилья для всех?"
10097-100970430 = "Вряд ли так удачно найдётся жильё..."
10097-100970440 = "Хм..."
10097-100970450 = "Тогда, может, я смогу помочь."
10097-100970460 = "Что, правда?"