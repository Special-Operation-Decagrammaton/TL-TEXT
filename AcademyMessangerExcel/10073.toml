[translation]
10073-100730010 = "Uuu..."
10073-100730020 = "Haah... Estou exausta."
10073-100730030 = "Tanto desta roupa quanto deste lugar..."
10073-100730040 = "Ui...?"
10073-100730050 = "O que houve?"
10073-100730060 = "Ah, não..."
10073-100730070 = "Não é que tenha acontecido algum problema..."
10073-100730080 = "Quer dizer, se há algum problema aqui, sou eu mesma..."
10073-100730090 = "Haah..."
10073-100730100 = "Desculpe. Não é o tipo de desabafo muito agradável de se ouvir, né?"
10073-100730110 = "Hum... só por garantia, quero deixar claro que"
10073-100730120 = "não é culpa sua, Sensei, então por favor não se preocupe."
10073-100730130 = "Depois de ouvir o que você disse, Sensei, mudei um pouco meu jeito de pensar."
10073-100730140 = "Talvez eu não consiga ser positiva o tempo todo, mas..."
10073-100730150 = "Se eu encontrar alguma coisa,"
10073-100730160 = "eu entro em contato com você."
10073-100730170 = "Afinal, já viemos parar tão longe mesmo..."
10073-100730180 = "Hehe..."
10073-100730190 = "Agora já posso ficar tranquila."
10073-100730200 = "Finalmente encontrei um lugar maravilhoso."
10073-100730210 = "Tranquila?"
10073-100730220 = "Um lugar maravilhoso?"
10073-100730230 = "Sim, aqui não terei problema algum."
10073-100730240 = "Os seres humanos sempre dão um jeito de encontrar uma forma de sobreviver."
10073-100730250 = "Vejamos..."
10073-100730260 = "Para você, Sensei, não há problema."
10073-100730270 = "Gostaria de vir dar uma olhada?"
10073-100730280 = "Hum..."
10073-100730290 = "Sensei..."
10073-100730300 = "Desculpe."
10073-100730310 = "Parando para pensar, aquele copo..."
10073-100730320 = "Er... e-eu já tinha encostado a boca..."
10073-100730330 = "Quer dizer..."
10073-100730340 = "...Copo?"
10073-100730350 = "Do que você está falando?"
10073-100730360 = "..."
10073-100730370 = "N-não..."
10073-100730380 = "Pensando bem, não é nada."
10073-100730390 = "Por favor, não dê importância a isso, Sensei."
10073-100730400 = "Sensei."
10073-100730410 = "Você teria um tempinho agora?"
10073-100730420 = "Ah"
10073-100730430 = "M-me desculpe."
10073-100730440 = "Já está tão tarde e eu..."
10073-100730450 = "Tudo bem, onde você está?"
10073-100730460 = "Se é um pedido da Ui, eu vou correndo a qualquer hora."
10073-100730470 = "Hehe..."
10073-100730480 = "Obrigada."
10073-100730490 = "Então, hum..."
10073-100730500 = "Estou aqui na praia, se você puder vir..."
10073-100730510 = "Fico te esperando."
10073-100730520 = "Hum..."
10073-100730530 = "Sobre aquelas coisas estranhas que eu disse agora há pouco..."
10073-100730540 = "Depois que esfriei a cabeça,"
10073-100730550 = "fiquei me perguntando onde eu estava com a cabeça para falar aquilo..."
10073-100730560 = "Por favor, esqueça tudo aquilo, de verdade."
10073-100730570 = "Deve ser o clima de verão, né?"
10073-100730580 = "Mas achei que você ficou muito fofa daquele jeito também, Ui."
10073-100730590 = "Como você consegue falar uma coisa dessas assim, sem um pingo de vergonha...?"
10073-100730600 = "Para você, Sensei,"
10073-100730610 = "acho que com menos açúcar é na medida certa mesmo."
10073-100730620 = "Ou será..."
10073-100730630 = "que você prefere zero açúcar?"
