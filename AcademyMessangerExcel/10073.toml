[translation]
10073-100730010 = "Ак"
10073-100730020 = "Хм... Всё это для меня ужасно сложно."
10073-100730030 = "Этот наряд. Это место."
10073-100730040 = "Что случилось?"
10073-100730050 = "Ты в порядке, Уи?"
10073-100730060 = "Нет-нет."
10073-100730070 = "Никакой проблемы нет."
10073-100730080 = "Если и есть проблема, то это моя проблема, о которой мне и переживать."
10073-100730090 = "Просто..."
10073-100730100 = "Прости. Мне действительно не стоит больше ничего говорить."
10073-100730110 = "Это тебя не касается. Не нужно беспокоиться."
10073-100730120 = "Пожалуйста, поверь мне."
10073-100730130 = "После нашего прошлого разговора я кое о чём подумала."
10073-100730140 = "Не хочу ничего обещать,"
10073-100730150 = "но если что-то найду или увижу,"
10073-100730160 = "я сообщу тебе."
10073-100730170 = "Всё равно я здесь."
10073-100730180 = "Хи-хи..."
10073-100730190 = "Теперь мне намного лучше."
10073-100730200 = "Я нашла хорошее место... Вообще-то отличное."
10073-100730210 = "Рад, что тебе лучше."
10073-100730220 = "Так что это за место?"
10073-100730230 = "Оно не идеально, но, как я сказала... отличное."
10073-100730240 = "Люди умеют приспосабливаться. Полагаю, это относится и ко мне."
10073-100730250 = "Хм..."
10073-100730260 = "Может быть, всё нормально... В конце концов, это ты..."
10073-100730270 = "Хочешь посмотреть?"
10073-100730280 = "Эм..."
10073-100730290 = "Сенсей."
10073-100730300 = "Мне ужасно жаль."
10073-100730310 = "Я только что поняла... та чашка..."
10073-100730320 = "Я... пила из этой чашки..."
10073-100730330 = "Понимаешь..."
10073-100730340 = "Какая чашка?"
10073-100730350 = "О чём ты?"
10073-100730360 = "..."
10073-100730370 = "Ничего."
10073-100730380 = "Я так и знала..."
10073-100730390 = "Ты вообще об этом не думал..."
10073-100730400 = "Сенсей."
10073-100730410 = "Вы случайно не свободны?"
10073-100730420 = "Знаю, немного поздно, но..."
10073-100730430 = "А..."
10073-100730440 = "Неважно. Всё нормально."
10073-100730450 = "У меня есть время. Где ты?"
10073-100730460 = "Если я тебе нужна, я приду."
10073-100730470 = "Хм."
10073-100730480 = "Мне неловко."
10073-100730490 = "Не хочу отнимать твоё время, но..."
10073-100730500 = "Ну, хорошо."
10073-100730510 = "Я буду ждать тебя..."
10073-100730520 = "Хм..."
10073-100730530 = "Не знаю, что на меня нашло, когда я говорила всё это раньше."
10073-100730540 = "Если оглянуться назад,"
10073-100730550 = "не уверена, что была в здравом уме."
10073-100730560 = "Пожалуйста, забудь, что я сказала."
10073-100730570 = "Не переживай. Это часть лета."
10073-100730580 = "В такие моменты быть в здравом уме совсем не весело."
10073-100730590 = "Я ожидала другого ответа..."
10073-100730600 = "Для тебя, Сенсей,"
10073-100730610 = "думаю, сладость стоит уменьшить."
10073-100730620 = "Вообще-то..."
10073-100730630 = "Может, вообще без сахара."
