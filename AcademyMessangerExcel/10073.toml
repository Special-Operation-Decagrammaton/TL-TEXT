[translation]
10073-100730010 = "У-у-у..."
10073-100730020 = "*вздох* я устала."
10073-100730030 = "И этот вид, и это место..."
10073-100730040 = "Уи...?"
10073-100730050 = "Что случилось?"
10073-100730060 = "Ах, нет..."
10073-100730070 = "Никаких проблем..."
10073-100730080 = "Вернее, если и есть проблема, то она во мне."
10073-100730090 = "*вздох*"
10073-100730100 = "Простите, это, наверное, неприятно слушать."
10073-100730110 = "Ну... на всякий случай скажу:"
10073-100730120 = "это не ваша вина, не беспокойтесь."
10073-100730130 = "Послушав вас, я немного изменила своё мнение."
10073-100730140 = "Не всегда получается быть оптимисткой, но..."
10073-100730150 = "если я что-то найду,"
10073-100730160 = "я напишу вам."
10073-100730170 = "Раз уж я приехала так далеко..."
10073-100730180 = "Фуфу..."
10073-100730190 = "Теперь я спокойна."
10073-100730200 = "Я наконец нашла прекрасное место."
10073-100730210 = "Спокойна?"
10073-100730220 = "Прекрасное место?"
10073-100730230 = "Да, здесь проблем не будет."
10073-100730240 = "Человек всегда находит способ выжить."
10073-100730250 = "Ну да..."
10073-100730260 = "Если это вы, Сенсей, то всё будет хорошо."
10073-100730270 = "Не хотите взглянуть?"
10073-100730280 = "Ну..."
10073-100730290 = "Сенсей."
10073-100730300 = "Простите."
10073-100730310 = "Если подумать, та чашка..."
10073-100730320 = "Э-это... я к ней прикасалась..."
10073-100730330 = "Ну, понимаете..."
10073-100730340 = "...Чашка?"
10073-100730350 = "О чём вы?"
10073-100730360 = "..."
10073-100730370 = "Н-нет..."
10073-100730380 = "Ничего."
10073-100730390 = "Не обращайте внимания."
10073-100730400 = "Сенсей."
10073-100730410 = "Можно вас на минуту?"
10073-100730420 = "Ах."
10073-100730430 = "П-простите."
10073-100730440 = "Уже так поздно..."
10073-100730450 = "Всё в порядке, куда мне прийти?"
10073-100730460 = "Если просишь, Уи, я всегда приду."
10073-100730470 = "Хе-хе..."
10073-100730480 = "Спасибо."
10073-100730490 = "Тогда..."
10073-100730500 = "я на море, так что если вы придёте..."
10073-100730510 = "Я буду ждать."
10073-100730520 = "Ну..."
10073-100730530 = "За то, что я сказала ранее..."
10073-100730540 = "Когда я успокоилась,"
10073-100730550 = "я подумала: «Что же я такое говорила?»"
10073-100730560 = "Пожалуйста, забудьте."
10073-100730570 = "Наверное, это из-за лета."
10073-100730580 = "Но ты была милой в такие моменты, Уи."
10073-100730590 = "Как вы можете говорить такие вещи без стеснения..."
10073-100730600 = "Как и ожидалось от вас, Сенсей,"
10073-100730610 = "вам лучше быть менее сладким."
10073-100730620 = "Или..."
10073-100730630 = "вы предпочитаете без сахара?"
