[translation]
26015-260150010 = "Olha, a praia..."
26015-260150020 = "Não é tão deslumbrante"
26015-260150030 = "quanto dizem nas revistas e na TV..."
26015-260150040 = "Na real, não tem muita coisa pra fazer aqui, né?"
26015-260150050 = "Que reação mais seca..."
26015-260150060 = "Você precisa aproveitar a flor da juventude!"
26015-260150070 = "Haha"
26015-260150080 = "Pior que é verdade, né?"
26015-260150090 = "Fiquei pensando naquilo depois,"
26015-260150100 = "mas, pra falar a verdade,"
26015-260150110 = "acho que eu não levo muito jeito"
26015-260150120 = "pra curtir dias de folga ao máximo!"
26015-260150130 = "Que reação mais seca..."
26015-260150140 = "Você precisa aproveitar a flor da juventude!"
26015-260150150 = "A gente já não teve essa exata conversa antes?"
26015-260150160 = "Sensei, tá acordado?"
26015-260150170 = "Tô acordado sim, que houve?"
26015-260150180 = "Já tava indo dormir."
26015-260150190 = "É que eu tava meio sem sono..."
26015-260150200 = "Mas tá tudo tranquilo!"
26015-260150210 = "Ah"
26015-260150220 = "Então deixa quieto."
26015-260150230 = "Foi mal incomodar!"
26015-260150240 = "Bom,"
26015-260150250 = "boa noite!"
26015-260150260 = "Hmm."
26015-260150270 = "Sinto que saí meio no prejuízo."
26015-260150280 = "Com o quê?"
26015-260150290 = "Nosso passeio noturno"
26015-260150300 = "acabou virando sessão de aconselhamento na metade do caminho."
26015-260150310 = "Quando perder o sono, pode me chamar a qualquer hora!"
26015-260150320 = "Vamos sair pra caminhar de novo!"
26015-260150330 = "Peraí,"
26015-260150340 = "isso aí..."
26015-260150350 = "Hum..."
26015-260150360 = "...Entendido!"
26015-260150370 = "Boa noite, Sensei."
26015-260150380 = "Sensei"
26015-260150390 = "Tá dormindo?"
26015-260150400 = "Tô acordado!"
26015-260150410 = "Já tava esperando sua mensagem!"
26015-260150420 = "Então,"
26015-260150430 = "tem um tempinho agora?"
26015-260150440 = "Haha"
26015-260150450 = "Qual é, para com isso~"
26015-260150460 = "Nos vemos na frente da pousada."
26015-260150470 = "Beleza~"
26015-260150480 = "Foi mal..."
26015-260150490 = "Pelo quê?"
26015-260150500 = "O que houve?"
26015-260150510 = "Ugh"
26015-260150520 = "Vai mesmo me fazer"
26015-260150530 = "dizer isso com todas as letras?"
26015-260150540 = "...É sobre ontem à noite."
26015-260150550 = "Também tenho uma coisa pra conversar com você."
26015-260150560 = "Oi?"
26015-260150570 = "Ponto de encontro: na frente da pousada!"
26015-260150580 = "Ah"
26015-260150590 = "Entendido."
26015-260150600 = "Olha lá, hein..."
26015-260150610 = "Não vou pegar leve não, viu?"
26015-260150620 = "E-entendi!"
26015-260150630 = "Pegue leve comigo, por favor...!"
26015-260150640 = "Haha!"
26015-260150650 = "Tamo junto daqui pra frente também, Sensei."
