[translation]
26015-260150010 = "Море, оно..."
26015-260150020 = "не такое уж и сверкающее,"
26015-260150030 = "как говорят в журналах и по телевизору."
26015-260150040 = "Заняться, по сути, нечем."
26015-260150050 = "Какой ты прагматичный..."
26015-260150060 = "Надо же наслаждаться молодостью!"
26015-260150070 = "Ха-ха"
26015-260150080 = "Пожалуй, вы правы."
26015-260150090 = "Но, поразмыслив,"
26015-260150100 = "я понял,"
26015-260150110 = "что наслаждаться отдыхом"
26015-260150120 = "у меня не очень получается!"
26015-260150130 = "Какой же ты прагматичный..."
26015-260150140 = "Надо же наслаждаться молодостью!"
26015-260150150 = "Мы это уже обсуждали, кажется?"
26015-260150160 = "Сенсей, вы не спите?"
26015-260150170 = "Не сплю, а что?"
26015-260150180 = "Я думал уже ложиться,"
26015-260150190 = "но что-то не спится."
26015-260150200 = "Хотя, всё нормально!"
26015-260150210 = "А"
26015-260150220 = "Тогда всё в порядке."
26015-260150230 = "Извините, что побеспокоил!"
26015-260150240 = "Ну тогда"
26015-260150250 = "спокойной ночи."
26015-260150260 = "Хм"
26015-260150270 = "Чувствую себя обделённым."
26015-260150280 = "В каком смысле?"
26015-260150290 = "Вместо ночной прогулки"
26015-260150300 = "получился разговор."
26015-260150310 = "Если не сможешь уснуть, всегда зови!"
26015-260150320 = "Давай ещё прогуляемся!"
26015-260150330 = "Нет"
26015-260150340 = "Это ведь"
26015-260150350 = "ну..."
26015-260150360 = "...Понял!"
26015-260150370 = "Спокойной ночи, Сенсей."
26015-260150380 = "Сенсей"
26015-260150390 = "Вы спите?"
26015-260150400 = "Не сплю!"
26015-260150410 = "Я так и знал!"
26015-260150420 = "Тогда"
26015-260150430 = "найдёте время?"
26015-260150440 = "Ха-ха"
26015-260150450 = "Опять?"
26015-260150460 = "Встретимся у гостиницы."
26015-260150470 = "Договорились."
26015-260150480 = "Простите..."
26015-260150490 = "Что случилось?"
26015-260150500 = "Что-то не так?"
26015-260150510 = "У..."
26015-260150520 = "Вы хотите, чтобы я"
26015-260150530 = "сам это сказал?"
26015-260150540 = "...Речь о прошлой ночи."
26015-260150550 = "Хотел кое-что обсудить."
26015-260150560 = "Да?"
26015-260150570 = "Встреча у гостиницы!"
26015-260150580 = "А"
26015-260150590 = "Понял."
26015-260150600 = "Только учтите,"
26015-260150610 = "я не буду сдерживаться!"
26015-260150620 = "П-понял!"
26015-260150630 = "Пожалуйста, поосторожнее...!"
26015-260150640 = "Ха-ха"
26015-260150650 = "Рад был познакомиться, Сенсей."