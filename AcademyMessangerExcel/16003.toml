[translation]
16003-1741 = "Здравствуйте, Сенсей. Это Сузуми. Не уверена, что вы меня помните."
16003-1742 = "Я просто хотела узнать, как вы. Простите, если отвлекаю."
16003-1743 = "Я надеялась встретиться, когда у вас будет время."
16003-1744 = "Просто сообщите мне."
16003-1745 = "Это Сузуми. Вы благополучно вернулись, Сенсей?"
16003-1746 = "Да, благодаря тебе. Большое спасибо."
16003-1747 = "Ничего особенного. Я рада."
16003-1748 = "И кроме того..."
16003-1749 = "Эм..."
16003-1750 = "Эм..."
16003-1751 = "Просто скажите, если вам когда-нибудь что-то понадобится. Я сразу приду."
16003-1752 = "..."
16003-1753 = "Речь о сопровождении."
16003-1754 = "Это Сузуми, Сенсей."
16003-1755 = "Как я уже говорила, просто сообщите, если понадобится сопровождение."
16003-1756 = "Я безопасно доставлю вас до места назначения."
16003-1757 = "Спасибо."
16003-1758 = "Старшеклассницы такие страшные! Защити меня!"
16003-1759 = "Конечно. Спасибо, что обратился ко мне."
16003-1760 = "..."
16003-1761 = "Ну..."
16003-1762 = "Я вообще-то тоже старшеклассница."
16003-1763 = "Да, в общем..."
16003-1764 = "Буду ждать вас снаружи."
16003-1765 = "Увидимся."
16003-1766 = "Это Сузуми. Сегодня было приятно."
16003-1767 = "До следующего раза, Сенсей."
16003-1768 = "Здравствуйте, Сенсей. Это Сузуми."
16003-1769 = "Как я уже говорила, просто сообщите, если я понадоблюсь."
16003-1770 = "В этот раз я пойду с вами как спутница, а не как охрана."
16003-1771 = "Эм..."
16003-1772 = "О, ничего. Вы наверняка заняты."
16003-1773 = "Пойду, если ты этого хочешь."
16003-1774 = "Давай встретимся прямо сейчас."
16003-1775 = "%!&^@#%&"
16003-1776 = "..."
16003-1777 = "Простите."
16003-1778 = "Я уронила телефон."
16003-1779 = "Спасибо."
16003-1780 = "Сейчас дам вам адрес."
16003-1781 = "Я просто надеюсь, что когда-нибудь..."
16003-1782 = "смогу просто гулять весь день и вообще ничего не делать."
16003-1783 = "Эм..."
16003-1784 = "До этого ещё далеко..."
16003-1785 = "По крайней мере, я пришла к такому выводу."
16003-160030010 = "Здравствуйте, Сенсей. Это Сузуми."
16003-160030020 = "Вы сегодня свободны?"
16003-160030030 = "Ничего важного, просто личный вопрос. Я пойму, если вы заняты."
16003-160030040 = "Всё нормально, я свободен."
16003-160030050 = "Твои проблемы важны для меня."
16003-160030060 = "П-Правда?"
16003-160030070 = "Хорошо. Спасибо."
16003-160030080 = "Простите, что доставляю неудобства..."
16003-160030090 = "Я пришлю место, хорошо?"
16003-160030100 = "Эм..."
16003-160030110 = "Нет, ничего. Я буду ждать."
16003-160030120 = "Вы благополучно добрались домой, Сенсей? Это Сузуми."
16003-160030130 = "Ещё раз спасибо, что вышли так поздно."
16003-160030140 = "Понимаю, возможно, такое сообщение неуместно, но..."
16003-160030150 = "Я подумала, что хотя бы должна поблагодарить вас."
16003-160030160 = "..."
16003-160030170 = "Спасибо, Сенсей."
16003-160030180 = "Буду ждать нашей следующей беседы."
16003-160030190 = "Здравствуйте, Сенсей. Это Сузуми."
16003-160030200 = "Я слышала, скоро вы посетите Тринити."
16003-160030210 = "Если вдруг понадобится..."
16003-160030220 = "Эм..."
16003-160030230 = "я могла бы быть вашим сопровождающим... или гидом, наверное."
16003-160030240 = "Просто попросите — и я приду."
16003-160030250 = "Вот и всё... Спасибо."
16003-160030260 = "Я был бы очень благодарен. Спасибо, Сузуми."
16003-160030270 = "О! Может, прогуляемся вместе? Давно не гуляли."
16003-160030280 = "А."
16003-160030290 = "Давай."
16003-160030300 = "Спасибо. Тогда увидимся, когда вы приедете."
16003-160030310 = "Огромное спасибо за сегодня."
16003-160030320 = "Это было неожиданно приятно."
16003-160030330 = "Это ты показывала мне всё вокруг."
16003-160030340 = "Так что благодарить должен я."
16003-160030350 = "Эм..."
16003-160030360 = "Вообще-то..."
16003-160030370 = "Хорошо."
16003-160030380 = "Буду ждать следующего раза, Сенсей."
16003-160030390 = "Если вам что-нибудь понадобится, просто попросите."
16003-160030400 = "И ещё..."
16003-160030410 = "Эм..."
16003-160030420 = "Это может быть что угодно. Не только если вам нужен гид."
