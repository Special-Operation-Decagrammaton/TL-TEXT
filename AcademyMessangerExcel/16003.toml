[translation]
16003-1741 = "Olá, Sensei. Aqui é a Suzumi. Você se lembra de mim?"
16003-1742 = "Entrei em contato só para mandar um cumprimento mesmo. Desculpe incomodar no meio do seu trabalho"
16003-1743 = "Ficarei feliz se pudermos nos encontrar de novo algum dia"
16003-1744 = "Até mais, então"
16003-1745 = "Aqui é a Suzumi. Sensei, você chegou bem em casa?"
16003-1746 = "Sim, graças a você. Muito obrigado mesmo"
16003-1747 = "Imagina, fico aliviada em saber"
16003-1748 = "É que,"
16003-1749 = "Hum,"
16003-1750 = "Como eu posso dizer......"
16003-1751 = "Sempre que precisar de mim, pode me chamar. Eu vou para o seu lado imediatamente"
16003-1752 = "......Quer dizer,"
16003-1753 = "Estou falando de escolta, claro"
16003-1754 = "Sensei, aqui é a Suzumi"
16003-1755 = "Sempre que precisar de escolta como hoje, pode falar comigo a qualquer momento"
16003-1756 = "Eu levarei você em segurança até o seu destino"
16003-1757 = "Obrigado, conto com você"
16003-1758 = "Colegiais dão medo! Me salva, Suzumi!"
16003-1759 = "Sim, pode deixar comigo"
16003-1760 = "......Hum"
16003-1761 = "É que......"
16003-1762 = "Tecnicamente, eu também sou uma colegial......"
16003-1763 = "Bom, deixando isso de lado"
16003-1764 = "Estarei na frente da Schale antes do horário de você sair hoje"
16003-1765 = "Até mais tarde"
16003-1766 = "Aqui é a Suzumi. Muito obrigada por hoje, eu me diverti bastante"
16003-1767 = "Vamos nos encontrar de novo outra hora, Sensei"
16003-1768 = "Olá, Sensei. Aqui é a Suzumi"
16003-1769 = "Se quiser, pode me chamar a qualquer hora, viu?"
16003-1770 = "Dessa vez não será como escolta, vou apenas te fazer companhia normalmente"
16003-1771 = "Hum"
16003-1772 = "Claro que, se você estiver ocupado, não precisa se forçar a me chamar......"
16003-1773 = "Se o convite é da Suzumi, eu vou na mesma hora"
16003-1774 = "Então, podemos nos encontrar agora?"
16003-1775 = "al%$g3r#$%^"
16003-1776 = "......"
16003-1777 = "Me desculpe"
16003-1778 = "Deixei o celular cair"
16003-1779 = "Muito obrigada"
16003-1780 = "Sendo assim, tudo bem se eu escolher o lugar dessa vez?"
16003-1781 = "Seria tão bom se um dia a gente pudesse caminhar juntos o dia inteiro assim,"
16003-1782 = "Sem que nenhum problema acontecesse, né?"
16003-1783 = "......Bom,"
16003-1784 = "Por enquanto, talvez esse dia ainda demore a chegar......"
16003-1785 = "Mas é exatamente por isso que eu continuo fazendo o meu trabalho"
16003-160030010 = "Bom dia, Sensei. Aqui é a Suzumi."
16003-160030020 = "Como você planeja passar o dia de hoje?"
16003-160030030 = "Não é nada muito urgente, mas se você estiver livre, gostaria de pedir um pouquinho do seu tempo......"
16003-160030040 = "Tô 100% livre!!"
16003-160030050 = "Difícil existir algo mais importante do que um compromisso com a Suzumi"
16003-160030060 = "A-Ah, é mesmo?"
16003-160030070 = "Então vou aceitar a sua gentileza, muito obrigada"
16003-160030080 = "Peço desculpas se acabei insistindo demais sem querer"
16003-160030090 = "Mais tarde eu te mando a localização certinho"
16003-160030100 = "Hum"
16003-160030110 = "Não, não é nada. Até mais tarde, então"
16003-160030120 = "Aqui é a Suzumi. Você chegou bem em casa?"
16003-160030130 = "Muito obrigada por ter vindo mesmo tão tarde"
16003-160030140 = "Como já é alta madrugada, fiquei com receio de mandar mensagem agora e acabar te acordando......"
16003-160030150 = "Mas achei que precisava te agradecer hoje mesmo"
16003-160030160 = "......"
16003-160030170 = "Muito obrigada, Sensei"
16003-160030180 = "Conto com você daqui para frente também"
16003-160030190 = "Olá, Sensei. Aqui é a Suzumi"
16003-160030200 = "Ouvi dizer que você tem planos de vir à Trinity em breve"
16003-160030210 = "Hum......"
16003-160030220 = "Se você não se importar"
16003-160030230 = "Eu gostaria muito de fazer a sua escolta nessa ocasião"
16003-160030240 = "Para mim, qualquer horário está ótimo"
16003-160030250 = "Ficarei muito feliz se você me avisar quando vier"
16003-160030260 = "Obrigado como sempre, Suzumi. Posso contar com você, então?"
16003-160030270 = "Vamos dar uma caminhada juntos depois de tanto tempo, então?"
16003-160030280 = "S-Sim"
16003-160030290 = "Muito obrigada. Até lá, então"
16003-160030300 = "Irei ao seu encontro quando você vier"
16003-160030310 = "Muito obrigada mesmo por hoje"
16003-160030320 = "Graças a você, Sensei, eu me diverti muito"
16003-160030330 = "Obrigado. Eu também me diverti bastante"
16003-160030340 = "Eu que agradeço, espero continuar contando com você"
16003-160030350 = "Imagina"
16003-160030360 = "Isso é, hum......"
16003-160030370 = "Sim"
16003-160030380 = "Continue contando comigo também, Sensei"
16003-160030390 = "Se precisar de qualquer coisa, fique à vontade para entrar em contato"
16003-160030400 = "Aliás"
16003-160030410 = "Não precisa nem ter motivo"
16003-160030420 = "......Para você, Sensei, estou sempre disponível"
