[translation]
16003-1741 = "Здравствуйте, Сенсей. Это Сузуми. Вы меня помните?"
16003-1742 = "Я связалась с вами просто чтобы поздороваться. Извините за беспокойство."
16003-1743 = "Буду рада, если мы ещё встретимся."
16003-1744 = "Тогда до встречи."
16003-1745 = "Это Сузуми. Сенсей, вы благополучно добрались до дома?"
16003-1746 = "Да, спасибо. Правда спасибо."
16003-1747 = "Ну и хорошо."
16003-1748 = "Эм..."
16003-1749 = "Ну..."
16003-1750 = "Как бы сказать..."
16003-1751 = "Если я вам понадоблюсь, всегда говорите. Я сразу приду."
16003-1752 = "...Эм,"
16003-1753 = "речь о сопровождении."
16003-1754 = "Сенсей, это Сузуми."
16003-1755 = "Если вам понадобится сопровождение, как сегодня, всегда говорите."
16003-1756 = "Я в безопасности доставлю вас в нужное место."
16003-1757 = "Спасибо, рассчитываю на тебя."
16003-1758 = "Старшеклассницы страшны! Помоги, Сузуми!"
16003-1759 = "Да, полагайтесь на меня."
16003-1760 = "...Эм"
16003-1761 = "Ну..."
16003-1762 = "Я тоже, в общем-то, старшеклассница..."
16003-1763 = "Ну, неважно."
16003-1764 = "Тогда я приду к Шале до времени нашей прогулки сегодня."
16003-1765 = "До встречи."
16003-1766 = "Это Сузуми, спасибо за сегодня. Было весело."
16003-1767 = "Увидимся в следующий раз, Сенсей."
16003-1768 = "Здравствуйте, Сенсей. Это Сузуми."
16003-1769 = "Если вам удобно, всегда зовите меня."
16003-1770 = "На этот раз я не для сопровождения, а просто составлю вам компанию."
16003-1771 = "Эм"
16003-1772 = "Конечно, если вы заняты, не обязательно..."
16003-1773 = "Если зовёшь меня, я приду сразу же."
16003-1774 = "Тогда можем встретиться сейчас?"
16003-1775 = "Ал%$г3р#$%^"
16003-1776 = "..."
16003-1777 = "Извините."
16003-1778 = "Я уронила телефон."
16003-1779 = "Спасибо."
16003-1780 = "Тогда место на этот раз я выберу, можно?"
16003-1781 = "Хотелось бы, чтобы когда-нибудь наступил день, когда мы сможем гулять вместе целый день,"
16003-1782 = "и ничего не случится."
16003-1783 = "...Впрочем,"
16003-1784 = "скорее всего, такой день не скоро наступит..."
16003-1785 = "Поэтому я и продолжаю так действовать."
16003-160030010 = "Доброе утро, Сенсей. Это Сузуми."
16003-160030020 = "Какие у вас планы на сегодня?"
16003-160030030 = "Это не очень важное дело, но если вам не трудно, я хотела бы попросить немного вашего времени..."
16003-160030040 = "Свободен!!"
16003-160030050 = "Нет ничего важнее дела с Сузуми."
16003-160030060 = "Ну, если так..."
16003-160030070 = "Тогда позвольте воспользоваться вашей добротой, спасибо."
16003-160030080 = "Как-то получилось, что я вас затруднила, извините."
16003-160030090 = "Тогда я пришлю вам место позже."
16003-160030100 = "Эм..."
16003-160030110 = "Нет, ничего. Тогда до встречи, спасибо."
16003-160030120 = "Это Сузуми. Вы благополучно добрались?"
16003-160030130 = "Спасибо, что пришли, несмотря на поздний час."
16003-160030140 = "Уже поздно, и я подумала, что если напишу, то разбужу вас, но..."
16003-160030150 = "всё же я хотела поблагодарить вас."
16003-160030160 = "..."
16003-160030170 = "Спасибо, Сенсей."
16003-160030180 = "Надеюсь на вашу поддержку и впредь."
16003-160030190 = "Здравствуйте, Сенсей. Это Сузуми."
16003-160030200 = "Я слышала, что вы скоро собираетесь в Тринити."
16003-160030210 = "Эм..."
16003-160030220 = "Если вам не трудно,"
16003-160030230 = "я хотела бы сопроводить вас в тот раз."
16003-160030240 = "Я всегда свободна,"
16003-160030250 = "так что буду очень рада, если вы сообщите мне."
16003-160030260 = "Спасибо тебе всегда, Сузуми. Могу я попросить тебя?"
16003-160030270 = "Тогда давай прогуляемся вдвоём впервые за долгое время."
16003-160030280 = "Д-да"
16003-160030290 = "Спасибо. Тогда до встречи."
16003-160030300 = "Я зайду, когда вы будете приходить."
16003-160030310 = "Спасибо большое за сегодня."
16003-160030320 = "Благодаря вам было очень весело."
16003-160030330 = "Спасибо, мне тоже было весело."
16003-160030340 = "Спасибо тебе, я тоже надеюсь на дальнейшее сотрудничество."
16003-160030350 = "Нет"
16003-160030360 = "Это, эм..."
16003-160030370 = "Да"
16003-160030380 = "Надеюсь на вашу поддержку и впредь, Сенсей."
16003-160030390 = "Если что-то случится, пожалуйста, свяжитесь со мной."
16003-160030400 = "Нет"
16003-160030410 = "Даже без причины — нормально."
16003-160030420 = "...Сенсей, я всегда готова."