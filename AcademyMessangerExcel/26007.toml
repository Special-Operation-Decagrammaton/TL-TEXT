[translation]
26007-260070010 = "Сенсей!"
26007-260070020 = "Когда я разбирала склад, нашла кучу всякого... Это невероятно!"
26007-260070030 = "Там столько отличных вещей! И состояние вполне приличное!"
26007-260070040 = "Если забрать их и продать на свалке..."
26007-260070050 = "Вообще-то..."
26007-260070060 = "Может, сначала починить, чтобы продать подороже..."
26007-260070070 = "А? О чём ты говоришь?"
26007-260070080 = "Успокойся, Аяне."
26007-260070090 = "А!"
26007-260070100 = "Прости. Я так обрадовалась, что захотела сразу поделиться с тобой."
26007-260070110 = "Не хочу заставлять тебя идти сюда через весь путь, поэтому просто пришлю фотографии."
26007-260070120 = "Нет, я приду."
26007-260070130 = "Где вы?"
26007-260070140 = "О!"
26007-260070150 = "Это..."
26007-260070160 = "Эм-м..."
26007-260070170 = "Я нашла много всего, но смогла забрать только несколько вещей."
26007-260070180 = "Там было слишком много... Чувствую, будто вернулась к исходной точке."
26007-260070190 = "Так и должно быть."
26007-260070200 = "Но всё нормально, ведь тебе понравился сам процесс, правда?"
26007-260070210 = "...!"
26007-260070220 = "Да."
26007-260070230 = "Именно."
26007-260070240 = "A alw agla wlaa gwag"
26007-260070250 = "...Аяне?"
26007-260070260 = "А?"
26007-260070270 = "aa gg wrgtgxlq q"
26007-260070280 = "Что это? Какая-то ошибка?"
26007-260070290 = "Ты нажимаешь кнопки во сне...?"
26007-260070300 = "aaaa gwld wqgk"
26007-260070310 = "Сенсей."
26007-260070320 = "Эм..."
26007-260070330 = "Ничего серьёзного, но..."
26007-260070340 = "Сегодня утром"
26007-260070350 = "я никому ничего не сказала."
26007-260070360 = "Твоя секретная база всё ещё секретная."
26007-260070370 = "..."
26007-260070380 = "Хорошо."
26007-260070390 = "Спасибо."
26007-260070400 = "Сенсей."
26007-260070410 = "Если ты не против, у меня есть просьба."
26007-260070420 = "Конечно."
26007-260070430 = "Что такое?"
26007-260070440 = "Я готовлюсь ремонтировать вертолёт, но"
26007-260070450 = "похоже, деталей понадобится больше, чем я думала."
26007-260070460 = "Ничего тяжёлого... но я оставила упаковку винтов в коридоре."
26007-260070470 = "Хорошо. Я прямо сейчас пойду."
26007-260070480 = "Курьер уже выдвигается!"
26007-260070490 = "А-ха-ха..."
26007-260070500 = "Спасибо. Буду ждать."
26007-260070510 = "Раньше я говорила уверенно,"
26007-260070520 = "но поняла, что пользоваться вертолётом не так уж просто."
26007-260070530 = "Может, в итоге он и не даст такой большой разницы..."
26007-260070540 = "Но иметь его всё равно важно."
26007-260070550 = "Специальное вооружение ведь используют нечасто."
26007-260070560 = "П-правда?"
26007-260070570 = "А-ха... ха..."
26007-260070580 = "Спасибо, Сенсей."
