[translation]
26007-260070010 = "Sensei! Escuta só isso!!"
26007-260070020 = "Eu estava arrumando o depósito e apareceram várias coisas... E olha, é incrível!"
26007-260070030 = "Tem um montão de achados raros... e estão todos praticamente novos!"
26007-260070040 = "Imagina quanto não daria se levássemos tudo isso para um brechó..."
26007-260070050 = "Ah, mas vender do jeito que está seria um pouco de desperdício."
26007-260070060 = "Se fizermos os reparos direitinho antes de vender, deve render uma bela..."
26007-260070070 = "D-do que você está falando?"
26007-260070080 = "Ayane, primeiro respira fundo e se acalma."
26007-260070090 = "Ah...!"
26007-260070100 = "Me desculpe, me empolguei. A vontade de compartilhar a notícia falou mais alto..."
26007-260070110 = "Como vir até aqui pessoalmente daria trabalho, vou te mandar algumas fotos."
26007-260070120 = "Tranquilo, eu vou até aí."
26007-260070130 = "Onde você está agora?"
26007-260070140 = "Ah..."
26007-260070150 = "Hum..."
26007-260070160 = "Obrigada pelo trabalho de hoje."
26007-260070170 = "Encontramos muitos tesouros, mas no fim não conseguimos levar muita coisa para casa, né?"
26007-260070180 = "Quase tudo era grande demais... Acabamos voltando à estaca zero..."
26007-260070190 = "Imagina, acho que 'se divertir' é exatamente isso."
26007-260070200 = "Mas foi divertido, então valeu a pena, não acha?"
26007-260070210 = "...!"
26007-260070220 = "Sim."
26007-260070230 = "Você tem toda razão. Muito obrigada."
26007-260070240 = "jjjjjjjmnmjjjjjjjjjj"
26007-260070250 = "...Ayane?"
26007-260070260 = "O que aconteceu?"
26007-260070270 = "jjjjjjj,,iuiijjjjjjjjjj"
26007-260070280 = "O que será que houve..."
26007-260070290 = "Será que está dormindo em cima do celular...?"
26007-260070300 = "nnnnllllllllll"
26007-260070310 = "Sensei..."
26007-260070320 = "Hum, este..."
26007-260070330 = "Para falar a verdade..."
26007-260070340 = "Sobre o que aconteceu hoje de manhã..."
26007-260070350 = "Não contei para ninguém."
26007-260070360 = "Afinal, é uma base secreta, né?"
26007-260070370 = "..."
26007-260070380 = "Sim."
26007-260070390 = "Muito obrigada..."
26007-260070400 = "Sensei, se não for incômodo..."
26007-260070410 = "Posso te pedir um favor...?"
26007-260070420 = "Claro, sem problemas."
26007-260070430 = "O que foi?"
26007-260070440 = "Estou fazendo a manutenção do helicóptero agora mesmo,"
26007-260070450 = "mas parece que vou precisar de mais peças do que imaginava..."
26007-260070460 = "Não é nada muito pesado... São só uns parafusos que deixei separados lá no salão..."
26007-260070470 = "Entendido, já estou indo. Voando."
26007-260070480 = "Entregador saindo para a entrega~"
26007-260070490 = "Ahaha..."
26007-260070500 = "Muito obrigada. Fico no aguardo!"
26007-260070510 = "Eu disse que você podia me chamar a qualquer hora, mas..."
26007-260070520 = "Pensando bem, colocar um helicóptero no ar não é algo tão simples assim, né..."
26007-260070530 = "No fim das contas, acho que não mudou muita coisa em relação a antes..."
26007-260070540 = "Mas só o fato de termos um helicóptero já faz toda a diferença."
26007-260070550 = "Um golpe especial não é algo que se use toda hora, afinal."
26007-260070560 = "V-você acha?"
26007-260070570 = "Ahaha..."
26007-260070580 = "Muito obrigada, Sensei."
