[translation]
26007-260070010 = "Сенсей! Послушайте!!"
26007-260070020 = "Я разбирала склад, и там нашлось столько всего... это невероятно!"
26007-260070030 = "Много ценных вещей... все как новые!"
26007-260070040 = "Если бы я отнесла всё это в комиссионный магазин, сколько бы..."
26007-260070050 = "Но, хотя, продавать их просто так было бы немного жалко."
26007-260070060 = "Если хорошо починить и продать, можно выручить..."
26007-260070070 = "О чём это ты?"
26007-260070080 = "Аяне, сначала успокойся."
26007-260070090 = "Ах...!"
26007-260070100 = "Простите, я увлеклась. Мне так хотелось поделиться, что я забежала вперёд..."
26007-260070110 = "Я думаю, вам неудобно приходить лично, поэтому я пришлю фото."
26007-260070120 = "Всё в порядке, я сам приду."
26007-260070130 = "Где ты сейчас?"
26007-260070140 = "Ах..."
26007-260070150 = "Эм..."
26007-260070160 = "Спасибо за сегодняшний день."
26007-260070170 = "Мы нашли много сокровищ, но фактически взять с собой удалось немного."
26007-260070180 = "Большинство были слишком большими... в итоге всё вернулось на круги своя..."
26007-260070190 = "Нет, я думаю, «игра» — это именно то, что мы делали."
26007-260070200 = "Но ведь было весело, значит, всё хорошо?"
26007-260070210 = "...!"
26007-260070220 = "Да."
26007-260070230 = "Вы правы. Спасибо вам."
26007-260070240 = "ллллллллм... м... лллллллллл"
26007-260070250 = "...Аяне?"
26007-260070260 = "Что случилось?"
26007-260070270 = "лллллллл, ... йй... лллллллллл"
26007-260070280 = "Что же с ней..."
26007-260070290 = "Спросонья...?"
26007-260070300 = "ммммммллллллллл"
26007-260070310 = "Сенсей..."
26007-260070320 = "Это, эм..."
26007-260070330 = "Дело в том, что"
26007-260070340 = "сегодня утром..."
26007-260070350 = "Я никому не говорил."
26007-260070360 = "Потому что это тайная база."
26007-260070370 = "..."
26007-260070380 = "Да."
26007-260070390 = "Спасибо вам..."
26007-260070400 = "Сенсей, если можно..."
26007-260070410 = "Могу я попросить вас об одном одолжении...?"
26007-260070420 = "Конечно, без проблем."
26007-260070430 = "Что случилось?"
26007-260070440 = "Как раз сейчас я занимаюсь ремонтом вертолёта,"
26007-260070450 = "но оказалось, что требуется больше деталей, чем я думала..."
26007-260070460 = "Они не такие тяжёлые... заранее подготовленные винты лежат в холле..."
26007-260070470 = "Понял, сейчас приду. Быстро."
26007-260070480 = "Курьер выезжает!"
26007-260070490 = "Аха-ха..."
26007-260070500 = "Спасибо вам. Жду!"
26007-260070510 = "Я говорила, что вы можете звать меня в любое время, но"
26007-260070520 = "если подумать, поднимать вертолёт в воздух не так-то просто..."
26007-260070530 = "В итоге, наверное, ничего не изменилось..."
26007-260070540 = "Но важно, что у нас есть вертолёт."
26007-260070550 = "Секретные приёмы не стоит применять слишком часто."
26007-260070560 = "Р-разве?"
26007-260070570 = "Аха-ха..."
26007-260070580 = "Спасибо вам, Сенсей."