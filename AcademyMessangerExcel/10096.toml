[translation]
10096-100960010 = "Здравствуйте, Сенсей. Это Канна."
10096-100960020 = "Давно не виделись, Канна."
10096-100960030 = "Как ты?"
10096-100960040 = "Простите, что так внезапно пишу, но мне нужен ваш совет."
10096-100960050 = "Редко ты просишь совета!"
10096-100960060 = "Ничего серьёзного, просто одно за другим, и в итоге я согласилась работать спасателем."
10096-100960070 = "Всё бы ничего, но у меня проблема с купальником."
10096-100960080 = "Проблема?"
10096-100960090 = "Будет проще спросить лично, если у вас есть время."
10096-100960100 = "Мне неудобно решать это одной."
10096-100960110 = "Конечно, скоро буду."
10096-100960120 = "Вы нормально добрались? Спасибо за помощь сегодня, Сенсей."
10096-100960130 = "Вы очень помогли мне выбрать купальник."
10096-100960140 = "Рад, что он тебе понравился, Канна."
10096-100960150 = "..."
10096-100960160 = "Я поняла это только потом..."
10096-100960170 = "Думаю, мне просто нужно было, чтобы кто-то меня поддержал."
10096-100960180 = "Я впервые работаю спасателем, поэтому чувствовала себя не очень уверенно."
10096-100960190 = "Хорошо, что всё получилось. Как ты себя сейчас чувствуешь?"
10096-100960200 = "Гораздо увереннее."
10096-100960210 = "Я знала, что правильно сделала, попросив вас о помощи."
10096-100960220 = "Эй, Сенсей."
10096-100960230 = "Надеюсь, вам нравится парк."
10096-100960240 = "Да. Я сразу же нырнул в воду, как только пришёл."
10096-100960250 = "Как спасатель, рада это слышать."
10096-100960260 = "Но всё же, могу я попросить вас об услуге?"
10096-100960270 = "Что это?"
10096-100960280 = "«Мега-горка» находится на открытой площадке. Можете встретиться со мной там?"
10096-100960290 = "Перед официальным запуском её нужно испытать."
10096-100960300 = "Сегодня аквапарк закрыт."
10096-100960310 = "Пожалуйста, учитывайте это при планировании визитов."
10096-100960320 = "Значит, у тебя выходной, Канна?"
10096-100960330 = "К сожалению, нет."
10096-100960340 = "В обязанности спасателя входит уборка и регулярное обслуживание объектов в дни закрытия."
10096-100960350 = "Нам нужно постараться, чтобы гости могли безопасно отдыхать в парке."
10096-100960360 = "Никаких выходных..."
10096-100960370 = "Ты не слишком много работаешь?"
10096-100960380 = "Когда речь о безопасности, халтурить нельзя."
10096-100960390 = "Особенно если среди гостей будете вы, Сенсей."
