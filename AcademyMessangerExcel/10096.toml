[translation]
10096-100960010 = "Olá, Sensei."
10096-100960020 = "Quanto tempo, Kanna."
10096-100960030 = "Como você tem passado?"
10096-100960040 = "Há quanto tempo. Na verdade, há um assunto sobre o qual eu gostaria de pedir o seu conselho."
10096-100960050 = "Você me pedindo conselho, Kanna? Que raro."
10096-100960060 = "Bem, eu fui designada como salva-vidas da piscina, mas..."
10096-100960070 = "Estou com dificuldade para escolher o traje de banho."
10096-100960080 = "...O traje de banho?"
10096-100960090 = "Sim. Se não for incômodo, você poderia me dar a sua opinião pessoalmente?"
10096-100960100 = "Para mim, esse tipo de coisa é meio difícil..."
10096-100960110 = "Combinado, já estou indo."
10096-100960120 = "Sensei, muito obrigada por hoje."
10096-100960130 = "Graças a você consegui decidir o maiô, que alívio."
10096-100960140 = "Ficou ótimo em você."
10096-100960150 = "..."
10096-100960160 = "Só agora me dei conta de uma coisa."
10096-100960170 = "Talvez tudo de que eu precisasse fosse apenas ouvir alguém dizer que \"ficou ótimo\"."
10096-100960180 = "Por ser a minha primeira missão como salva-vidas, acho que eu estava tensa demais."
10096-100960190 = "Já está se sentindo mais tranquila?"
10096-100960200 = "Sim."
10096-100960210 = "Definitivamente fiz a escolha certa ao pedir a sua ajuda, Sensei."
10096-100960220 = "Olá, Sensei."
10096-100960230 = "Está aproveitando o parque?"
10096-100960240 = "Sim, estou me divertindo bastante."
10096-100960250 = "Como salva-vidas, fico muito feliz em ouvir isso."
10096-100960260 = "Hum, se você tiver um tempinho, posso lhe pedir um favor?"
10096-100960270 = "Que favor?"
10096-100960280 = "Poderia vir até o \"Mega Toboágua\", na área externa?"
10096-100960290 = "Gostaria que você me acompanhasse em um teste de funcionamento."
10096-100960300 = "Hoje o parque aquático está fechado para folga semanal."
10096-100960310 = "Por favor, tome cuidado para não vir aqui por engano."
10096-100960320 = "Então hoje é sua folga também, Kanna?"
10096-100960330 = "Não, eu estou trabalhando."
10096-100960340 = "Temos que fazer a limpeza e a manutenção das instalações,"
10096-100960350 = "para garantir que todos os visitantes possam se divertir com segurança."
10096-100960360 = "Puxado trabalhar até no dia em que o parque fecha, né..."
10096-100960370 = "Você não está se esforçando demais?"
10096-100960380 = "A segurança dos visitantes está em jogo, então isso não é nada mais que a minha obrigação."
10096-100960390 = "E, claro, você também está incluído entre eles, Sensei."
