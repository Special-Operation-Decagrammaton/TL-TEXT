[translation]
10096-100960010 = "Здравствуйте, Сенсей."
10096-100960020 = "Давно не виделись, Канна."
10096-100960030 = "Как дела?"
10096-100960040 = "Давно не виделись. На самом деле, у меня есть кое-что, о чём хотела бы посоветоваться."
10096-100960050 = "Редко когда Канна просит совета."
10096-100960060 = "Меня назначили спасателем в бассейне..."
10096-100960070 = "И я не могу выбрать купальник."
10096-100960080 = "...Купальник?"
10096-100960090 = "Да. Если вы не против, не могли бы вы дать мне совет лично?"
10096-100960100 = "Мне это довольно сложно..."
10096-100960110 = "Хорошо, я сейчас приду."
10096-100960120 = "Сенсей, спасибо вам за сегодня."
10096-100960130 = "Благодаря вам я выбрала купальник, теперь я спокойна."
10096-100960140 = "Тебе он шёл."
10096-100960150 = "..."
10096-100960160 = "Только сейчас поняла."
10096-100960170 = "Возможно, мне просто было нужно услышать от вас слово «идёт»."
10096-100960180 = "Наверное, я слишком переживала перед своим первым заданием спасателя."
10096-100960190 = "Теперь тебе легче?"
10096-100960200 = "Да."
10096-100960210 = "Как и следовало ожидать, я правильно сделала, что обратилась к вам за помощью."
10096-100960220 = "Здравствуйте, Сенсей."
10096-100960230 = "Вам нравится в парке?"
10096-100960240 = "Да, нравится."
10096-100960250 = "Я рада, как спасатель."
10096-100960260 = "Эм, если у вас есть время, могу я попросить вас кое-о-чём?"
10096-100960270 = "О чём именно?"
10096-100960280 = "Не могли бы вы прийти к аттракциону «Мега-горка»?"
10096-100960290 = "Мне нужно, чтобы вы помогли с тестовым запуском."
10096-100960300 = "Сегодня в аквапарке выходной."
10096-100960310 = "Пожалуйста, будьте внимательны и не перепутайте."
10096-100960320 = "Значит, у тебя тоже выходной?"
10096-100960330 = "Нет, я работаю."
10096-100960340 = "Нужно убирать и ремонтировать сооружения."
10096-100960350 = "Я должна сделать так, чтобы посетители могли безопасно и весело проводить время."
10096-100960360 = "Тяжело, даже в выходной..."
10096-100960370 = "Ты не перетруждаешься?"
10096-100960380 = "На карту поставлена безопасность посетителей, так что это естественно."
10096-100960390 = "И вы, конечно, тоже в их числе, Сенсей."