[translation]
10035-100350010 = "Честно говоря..."
10035-100350020 = "я не могу заставить себя это сделать."
10035-100350030 = "Имею в виду общаться с посторонними."
10035-100350040 = "Что такое?"
10035-100350050 = "Ты в порядке, Уи?"
10035-100350060 = "Ну..."
10035-100350070 = "Ничего. Просто недавно у меня были некоторые проблемы с посторонними."
10035-100350080 = "Это всё, что могу сказать. Больше говорить не стоит."
10035-100350090 = "Но вас это не касается. Не волнуйтесь."
10035-100350100 = "Поверьте мне."
10035-100350110 = "Спасибо, Сенсей. Сегодня было весело."
10035-100350120 = "Сообщите, когда в следующий раз будете приезжать."
10035-100350130 = "Хорошо. Обязательно предупрежу заранее."
10035-100350140 = "Ой, а мне понравилась эта твоя сторона, Уи."
10035-100350150 = "..."
10035-100350160 = "А?"
10035-100350170 = "..."
10035-100350180 = "Верно."
10035-100350190 = "Сенсей."
10035-100350200 = "Вы сейчас свободны?"
10035-100350210 = "Что-то не так?"
10035-100350220 = "Ну..."
10035-100350230 = "Вообще-то мне нужна ваша помощь."
10035-100350240 = "Надеюсь, можно попросить вас об этом."
10035-100350250 = "Не хочу вас пугать."
10035-100350260 = "Но один из моих драгоценных детей пропал."
10035-100350270 = "Что?!"
10035-100350280 = "Я уже иду."
10035-100350290 = "Погодите."
10035-100350300 = "Сенсей?"
10035-100350310 = "Мне стоит объяснить."
10035-100350320 = "Огромное спасибо за сегодня, Сенсей."
10035-100350330 = "Знаю, уже очень поздно. Спасибо."
10035-100350340 = "И не только за это."
10035-100350350 = "Спасибо и за вашу заботу."
10035-100350360 = "Сенсей."
10035-100350370 = "У меня есть предложение. Хотите услышать?"
10035-100350380 = "Предложение? Конечно."
10035-100350390 = "Давай."
10035-100350400 = "Спасибо, Сенсей."
10035-100350410 = "Тогда я начну готовиться."
10035-100350420 = "Загляните ко мне, и я расскажу подробнее."
10035-100350430 = "Сенсей."
10035-100350440 = "Мне очень жаль, но я хотела попросить об услуге. Если можно."
10035-100350450 = "Конечно. Что случилось?"
10035-100350460 = "Что-то не так?"
10035-100350470 = "Ничего серьёзного. На самом деле мне даже неловко просить, потому что это такая мелочь."
10035-100350480 = "Если захотите зайти, я оставлю дверь открытой."
10035-100350490 = "И ещё."
10035-100350500 = "Не могли бы вы принести мне что-нибудь попить и жвачку, чтобы не уснуть?"
10035-100350510 = "А."
10035-100350520 = "Я уснула."
10035-100350530 = "Я даже не успела поприветствовать вас, когда вы пришли. И не могу поверить, что уснула до того, как вы ушли."
10035-100350540 = "Простите."
10035-100350550 = "Не переживай."
10035-100350560 = "Ты всегда можешь просить меня о таких вещах."
10035-100350570 = "Хорошо."
10035-100350580 = "Теперь я смогу получать удовольствие от работы. Благодаря вам."
10035-100350590 = "Так что..."
10035-100350600 = "если вы не против,"
10035-100350610 = "я хотела бы чаще видеть вас вот так."
10035-100350620 = "Добрый день."
