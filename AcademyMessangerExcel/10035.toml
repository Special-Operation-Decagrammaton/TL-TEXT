[translation]
10035-100350010 = "Haah..."
10035-100350020 = "Que situação complicada..."
10035-100350030 = "É por isso que as pessoas lá de fora..."
10035-100350040 = "O que houve?"
10035-100350050 = "Ui?"
10035-100350060 = "Hum..."
10035-100350070 = "Não é nada demais, mas... é que ontem, quando precisei lidar com o pessoal lá de fora..."
10035-100350080 = "Não, pensando bem, finja que eu não disse nada, por favor..."
10035-100350090 = "Ah, claro que eu não estou falando de você, Sensei."
10035-100350100 = "Só para deixar claro..."
10035-100350110 = "Muito obrigada, Sensei. Graças a você, hoje foi bem divertido."
10035-100350120 = "Pode entrar em contato comigo sempre que quiser. Estarei esperando."
10035-100350130 = "Pode deixar, mando mensagem de novo em breve."
10035-100350140 = "Ver esse seu lado de vez em quando também não é nada mau, Ui."
10035-100350150 = "..."
10035-100350160 = "Hã, ah, hum..."
10035-100350170 = "..."
10035-100350180 = "...S-sim."
10035-100350190 = "Sensei"
10035-100350200 = "Você tem um tempinho agora?"
10035-100350210 = "Sim, o que aconteceu?"
10035-100350220 = "Na verdade,"
10035-100350230 = "se possível, eu gostaria de pedir uma ajudinha..."
10035-100350240 = "Hum, não sei se é certo pedir esse tipo de coisa para você, Sensei,"
10035-100350250 = "fico meio na dúvida, mas..."
10035-100350260 = "Uma grande amiga minha desapareceu."
10035-100350270 = "Vou correndo para a Biblioteca Antiga."
10035-100350280 = "Já estou indo."
10035-100350290 = "Não,"
10035-100350300 = "Sensei, hum,"
10035-100350310 = "me escuta primeiro..."
10035-100350320 = "Muito obrigada mesmo por hoje, Sensei."
10035-100350330 = "Por ter ficado até tão tarde..."
10035-100350340 = "E, hum,"
10035-100350350 = "por todo o resto também, digamos assim... Muito... obrigada."
10035-100350360 = "Sensei, você tem um tempo agora?"
10035-100350370 = "Eu tenho uma pequena proposta para fazer, ou melhor..."
10035-100350380 = "Uma \"proposta\"?"
10035-100350390 = "Tenho sim, o que houve?"
10035-100350400 = "Muito obrigada."
10035-100350410 = "Então vou deixar tudo preparado."
10035-100350420 = "Pode vir quando quiser."
10035-100350430 = "Sensei, desculpe incomodar tão de repente, mas"
10035-100350440 = "eu poderia te pedir um favor?"
10035-100350450 = "Claro, o que foi?"
10035-100350460 = "Sim, aconteceu alguma coisa?"
10035-100350470 = "Não é nada demais... quer dizer, também é falta de jeito pedir um favor dizendo que \"não é nada demais\", mas..."
10035-100350480 = "Hum, é que..."
10035-100350490 = "Vou deixar a porta destrancada,"
10035-100350500 = "então eu ficaria muito grata se você pudesse comprar e trazer um energético e algum chiclete bem forte para espantar o sono..."
10035-100350510 = "Mil desculpas."
10035-100350520 = "Acabei pegando no sono sem perceber."
10035-100350530 = "Fui falta de educação te chamar até aqui"
10035-100350540 = "e nem consegui me despedir direito quando você foi embora..."
10035-100350550 = "Não esquenta com isso. Bom trabalho hoje."
10035-100350560 = "Pode me chamar sempre que precisar."
10035-100350570 = "Sim."
10035-100350580 = "Graças a você, acho que vou conseguir trabalhar me divertindo bem mais do que antes."
10035-100350590 = "Hum..."
10035-100350600 = "Se você não se importar, Sensei,"
10035-100350610 = "por favor, venha me visitar de novo quando quiser."
10035-100350620 = "Bem, tenha um ótimo dia amanhã também."
