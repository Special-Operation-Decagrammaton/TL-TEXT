[translation]
20033-200330010 = "Время пришло."
20033-200330020 = "…?"
20033-200330030 = "Кихехе, не нужно паниковать."
20033-200330040 = "Это известие о том, что мой идеальный план готов."
20033-200330050 = "Наконец-то, я, Ханума Макото..."
20033-200330060 = "Нет, начинается наша великая история!"
20033-200330070 = "………?"
20033-200330080 = "Итак, Сенсей из Шале."
20033-200330090 = "Я жду вас в Пандемониуме, кихехе."
20033-200330100 = "Эм... вы имеете в виду, что хотите, чтобы я пришёл в Пандемониум...?"
20033-200330110 = "Кихехе. Давно не виделись, Сенсей."
20033-200330120 = "Доброе утро, Макото."
20033-200330130 = "Ваша реакция — ни капли волнения, даже получив сообщение от меня, Макото."
20033-200330140 = "Как и ожидалось от того, кого я признала. Вы мне нравитесь всё больше."
20033-200330150 = "Спасибо...?"
20033-200330160 = "Хватит болтовни, перейдём к делу."
20033-200330170 = "Причина, по которой я сегодня связалась с вами..."
20033-200330180 = "...Хм, уже пришли?"
20033-200330190 = "Вы сегодня куда-то собираетесь?"
20033-200330200 = "Куда? Конечно, в Шале."
20033-200330210 = "Что, в Шале? Сейчас?"
20033-200330220 = "Кихехе. Продолжим разговор при личной встрече."
20033-200330230 = "А, эм...?"
20033-200330240 = "Кихехехе! Как и ожидалось от меня!!"
20033-200330250 = "Я нашла магазин того бренда, о котором говорила, Ироха!"
20033-200330260 = "Вновь доказано, что в словаре Макото нет слова «невозможно»!"
20033-200330270 = "Итак! Преклонитесь перед великой Макото!"
20033-200330280 = "...Эм, что случилось вдруг?"
20033-200330290 = "Мм?"
20033-200330300 = "Ой"
20033-200330310 = "Я увидела уведомление и подумала, что..."
20033-200330320 = "Понятно."
20033-200330330 = "Похоже, я случайно отправила это вам вместо Ирохи."
20033-200330340 = "...Эм, а о чём вы обычно разговариваете?"
20033-200330350 = "Обычные разговоры...?"
20033-200330360 = "В любом случае, извиняюсь за ошибку."
20033-200330370 = "Кстати, у вас ведь тоже выходные на этих выходных?"
20033-200330380 = "Кихехе, давайте оба хорошо проведём выходные."
20033-200330390 = "А, да. И вы хорошо проведите время...?"
20033-200330400 = "Время пришло."
20033-200330410 = "Как дежавю..."
20033-200330420 = "Кажется, я уже получал такое же сообщение раньше..."
20033-200330430 = "Кихехе, правда?"
20033-200330440 = "Я ведь рассказывала вам о бизнесе, который я продвигаю."
20033-200330450 = "Наконец-то всё готово к презентации."
20033-200330460 = "Поэтому я и связалась."
20033-200330470 = "Я удивлён, что это произошло быстрее, чем я думал."
20033-200330480 = "Сразу к делу: вы сегодня свободны?"
20033-200330490 = "Конечно, время есть, но..."
20033-200330500 = "Кихехе. Хорошо! Тогда я сейчас зайду за вами!"