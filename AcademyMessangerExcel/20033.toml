[translation]
20033-200330010 = "Время пришло, Сенсей из Шале."
20033-200330020 = "?"
20033-200330030 = "Ки-хе-хе. Не бойся."
20033-200330040 = "Подготовка моего великого плана завершена."
20033-200330050 = "С сегодняшнего дня я, Великая Макото..."
20033-200330060 = "Нет. МЫ вместе сделаем этот первый великий шаг!"
20033-200330070 = "??"
20033-200330080 = "Итак, Сенсей из Шале."
20033-200330090 = "Я буду ждать тебя в Обществе Пандемониума. Ки-хе-хе."
20033-200330100 = "Хм. То есть ты хочешь, чтобы я пришёл в Общество Пандемониум? Хорошо."
20033-200330110 = "Хе-хе. Как поживаешь, Сенсей?"
20033-200330120 = "О. Привет, Макото."
20033-200330130 = "Тебя не потрясло, что тебе написала в MomoTalk я, Макото?"
20033-200330140 = "Как и ожидалось от человека твоего уровня. Одобряю."
20033-200330150 = "Эм... Э-э... Спасибо?"
20033-200330160 = "Хватит болтовни. К делу."
20033-200330170 = "Причина, по которой я сегодня связалась с тобой, в том, что"
20033-200330180 = "Подожди. Где ты? Я уже пришла."
20033-200330190 = "Пришла?"
20033-200330200 = "Я только что пришла к Шале."
20033-200330210 = "Что? К Шале? Прямо сейчас?"
20033-200330220 = "Ки-хе-хе. Теперь обсудим всё лицом к лицу."
20033-200330230 = "Постой. Что? Макото?!"
20033-200330240 = "Ки-хе-хе. Хе-хе-хе! Как и ожидалось от великой Макото!"
20033-200330250 = "Я успешно нашла того продавца, о котором говорила в прошлый раз, Ироха!"
20033-200330260 = "И вновь я, Великая Макото, доказала, что для меня нет ничего невозможного!"
20033-200330270 = "Поклонись, негодница! Пади ниц перед моим величием!"
20033-200330280 = "Эм, прости, Макото. Я понятия не имею, о чём ты."
20033-200330290 = "Хм?"
20033-200330300 = "О. Ты ничего из только что прочитанного не видел."
20033-200330310 = "Мои замыслы непостижимы даже для самых острых умов."
20033-200330320 = "Это касается и тебя, Сенсей."
20033-200330330 = "С таким сообщением справится только Ироха. Так что не читай его."
20033-200330340 = "Это вы обычно обсуждаете в MomoTalk?"
20033-200330350 = "Эм, болтаете ни о чём?"
20033-200330360 = "В любом случае забудь, что видел."
20033-200330370 = "Кстати, у тебя ведь тоже должен быть выходной в эти выходные."
20033-200330380 = "Хе. Тогда хорошо тебе отдохнуть."
20033-200330390 = "Эм, ага. И тебе хороших выходных, Макото."
20033-200330400 = "Время пришло, Сенсей."
20033-200330410 = "Это дежавю?"
20033-200330420 = "Такое чувство, что я уже видел это точное сообщение."
20033-200330430 = "Ки-хе-хе. Не паникуй, Сенсей."
20033-200330440 = "В прошлый раз я знакомила тебя со своим новым предприятием."
20033-200330450 = "Сегодня этот проект почти завершён,"
20033-200330460 = "и ты станешь моим свидетелем, Сенсей."
20033-200330470 = "Не верится, что прошло уже столько времени."
20033-200330480 = "Когда ты свободен?"
20033-200330490 = "У меня есть немного времени, но..."
20033-200330500 = "Ки-хе-хе. Отлично. Тогда я заеду за тобой!"
