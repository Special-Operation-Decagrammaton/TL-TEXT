[translation]
20033-200330010 = "Chegou a hora."
20033-200330020 = "...?"
20033-200330030 = "Kikiki, não precisa entrar em pânico desse jeito."
20033-200330040 = "Vim apenas anunciar que o meu plano perfeito está finalmente pronto."
20033-200330050 = "Finalmente, a grandiosa história desta ilustre Hanuma Makoto..."
20033-200330060 = "Quer dizer, a nossa grandiosa história está prestes a começar!"
20033-200330070 = ".........?"
20033-200330080 = "Venha, Sensei da Schale!"
20033-200330090 = "Estarei esperando por você no Pandemonium! Kikiki!"
20033-200330100 = "Hum... Isso quer dizer que você quer que eu vá até a Sociedade Pandemonium, né...?"
20033-200330110 = "Kikiki. Quanto tempo, Sensei."
20033-200330120 = "Bom dia, Makoto."
20033-200330130 = "Receber um MomoTalk da própria Grande Makoto e responder sem demonstrar o menor abalo..."
20033-200330140 = "Digno de alguém que conquistou o meu reconhecimento! Gosto cada vez mais da sua atitude!"
20033-200330150 = "Muito obrigado...?"
20033-200330160 = "Mas chega de conversa fiada, vamos direto ao assunto."
20033-200330170 = "O motivo pelo qual entrei em contato com você hoje é—"
20033-200330180 = "...Opa, parece que já chegamos."
20033-200330190 = "Para onde você está saindo hoje?"
20033-200330200 = "Como assim para onde? Para a Schale, é óbvio!"
20033-200330210 = "Quê?! Na Schale? Agora?!"
20033-200330220 = "Kikiki! Continuaremos essa conversa pessoalmente, cara a cara!"
20033-200330230 = "E-Espera aí...?"
20033-200330240 = "Kikiki, kishishishishi! Eu sou mesmo um gênio!!"
20033-200330250 = "Encontrei uma loja que vende aquela marca que você tinha falado outro dia, Iroha!"
20033-200330260 = "Mais uma vez ficou provado que a palavra \"impossível\" não existe no dicionário da Grande Makoto!"
20033-200330270 = "Vamos, curve-se diante da grandiosidade de Makoto!"
20033-200330280 = "...Hum, o que deu em você assim do nada?"
20033-200330290 = "Hm?"
20033-200330300 = "Opa."
20033-200330310 = "Achei estranho quando vi a notificação, mas..."
20033-200330320 = "Entendi."
20033-200330330 = "Parece que confundi o chat da Iroha e acabei mandando para você, Sensei."
20033-200330340 = "...Que tipo de conversa vocês duas costumam ter no dia a dia?"
20033-200330350 = "Conversas perfeitamente normais, ué...?"
20033-200330360 = "De qualquer forma, peço desculpas pelo engano."
20033-200330370 = "Aliás, você também está de folga neste fim de semana, não é, Sensei?"
20033-200330380 = "Kikiki, tenhamos ambos um ótimo fim de semana!"
20033-200330390 = "Ah, sim. Bom fim de semana pra você também, Makoto..."
20033-200330400 = "Chegou a hora."
20033-200330410 = "Estou tendo um déjà-vu..."
20033-200330420 = "Tenho a impressão de que já recebi exatamente essa mesma mensagem antes..."
20033-200330430 = "Kishishi, acha mesmo?"
20033-200330440 = "Lembra daquele empreendimento que eu, a Grande Makoto, apresentei a você outro dia?"
20033-200330450 = "Os preparativos para a grande inauguração estão finalmente concluídos!"
20033-200330460 = "Foi por isso que entrei em contato."
20033-200330470 = "Ficou pronto bem mais rápido do que eu imaginava, estou surpreso."
20033-200330480 = "Sem mais delongas, você está livre hoje?"
20033-200330490 = "Claro, tempo eu tenho, mas..."
20033-200330500 = "Kikiki. Perfeito! Então vou aí te buscar agora mesmo!"
