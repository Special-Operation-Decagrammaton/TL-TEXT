[translation]
10090-100900010 = "Фестиваль, Сенсей!"
10090-100900020 = "Так внезапно?"
10090-100900030 = "А, точно. Наверное, ты не знаешь."
10090-100900040 = "Ты говорил, что сегодня работаешь в Хяккияко, верно?"
10090-100900050 = "По совпадению, сегодня вечером проходит фестиваль..."
10090-100900060 = "Если ты свободен, буду рада, если присоединишься!"
10090-100900070 = "Звучит здорово, но я даже не знаю, что мы празднуем..."
10090-100900080 = "Ничего страшного!"
10090-100900090 = "Я буду твоим гидом. Просто доверься мне, хорошо?"
10090-100900100 = "Могу рассчитывать, что ты придёшь сегодня вечером?"
10090-100900110 = "Буду ждать!"
10090-100900120 = "Здравствуйте, Сенсей."
10090-100900130 = "Можно спросить, что у тебя сегодня по плану?"
10090-100900140 = "Ничего серьёзного,"
10090-100900150 = "но... подозреваю, что окажусь в Момоёдо."
10090-100900160 = "Правда?!"
10090-100900170 = "Какое совпадение, у меня там тоже дела!"
10090-100900180 = "Дай знать, когда будешь там..."
10090-100900190 = "Как насчёт сегодняшнего дня?"
10090-100900200 = "Да?"
10090-100900210 = "Д-да!"
10090-100900220 = "Тогда увидимся! Даже если мне придётся поменяться сменами!"
10090-100900230 = "Эй, Сенсей,"
10090-100900240 = "Эм... если ты не против..."
10090-100900250 = "Хочешь, я загляну в Момоёдо?"
10090-100900260 = "Хи-хи-хи."
10090-100900270 = "Да."
10090-100900280 = "Буду ждать!"
10090-100900290 = "Прости за то, что раньше была груба..."
10090-100900300 = "Тебе уже лучше, Умика?"
10090-100900310 = "Да. Всё благодаря тебе, Сенсей..."
10090-100900320 = "Эм, Сенсей?"
10090-100900330 = "Это связано с тем, что произошло..."
10090-100900340 = "Но если ты сегодня свободен,"
10090-100900350 = "не мог бы ты прийти в Момоёдо?"
10090-100900360 = "Сегодня ты свободен? Наконец-то!"
10090-100900370 = "Д-да. Сегодня получится..."
10090-100900380 = "Хотя... может, и нет..."
10090-100900390 = "Ничего страшного. Просто... если ты сегодня не заглянешь..."
10090-100900400 = "...я могу оказаться в небольшой передряге."
10090-100900410 = "Хорошо, тогда встретимся в Момоёдо."
10090-100900420 = "Сенсей?"
10090-100900430 = "Ты там?"
10090-100900440 = "Я здесь!"
10090-100900450 = "Где вы?"
10090-100900460 = "Прости!"
10090-100900470 = "Я немного опаздываю..."
10090-100900480 = "Всё нормально, не спеши!"
10090-100900490 = "Я скоро буду!"
10090-100900500 = "Хорошая работа, Сенсей."
10090-100900510 = "И ты, Умика."
10090-100900520 = "И спасибо за куклу."
10090-100900530 = "...!"
10090-100900540 = "Конечно!"
10090-100900550 = "Спасибо!!"
