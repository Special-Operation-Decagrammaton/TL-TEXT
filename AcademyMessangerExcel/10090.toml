[translation]
10090-100900010 = "Sensei! É dia de festival~!"
10090-100900020 = "Hum...? Vai ter festival em algum lugar?"
10090-100900030 = "Ah, é verdade. Você ainda não sabia, Sensei..."
10090-100900040 = "Hum... Sensei, você comentou que tinha assuntos para resolver em Hyakkiyako hoje, não foi?"
10090-100900050 = "Por coincidência, vai acontecer um festival em Hyakkiyako hoje a partir do fim da tarde!"
10090-100900060 = "Se tiver disponibilidade, por favor, venha participar!"
10090-100900070 = "Que legal. Eu nunca tive muitas oportunidades de ir a festivais..."
10090-100900080 = "Não se preocupe!"
10090-100900090 = "Eu vou guiar você para garantir que aproveite o festival 100%!"
10090-100900100 = "Então nos vemos no fim da tarde!"
10090-100900110 = "Estarei esperando por você no local!"
10090-100900120 = "Olá, Sensei."
10090-100900130 = "Hum, será que eu poderia perguntar quais são os seus planos para hoje...?"
10090-100900140 = "Acho que não tenho nada urgente."
10090-100900150 = "Na verdade, estou até com vontade de dar uma passada na Hyakuyadou..."
10090-100900160 = "Sério?!"
10090-100900170 = "Hoje eu estou trabalhando na Hyakuyadou... então vou ficar muito feliz se você vier, Sensei!"
10090-100900180 = "Que horas mais ou menos você acha que consegue vir...?"
10090-100900190 = "Acho que lá pela tarde?"
10090-100900200 = "Combinado!"
10090-100900210 = "Então vamos conseguir nos encontrar na Hyakuyadou!"
10090-100900220 = "Estarei esperando por você!"
10090-100900230 = "Sensei..."
10090-100900240 = "Hum, você está muito ocupado hoje...? Se não for incômodo, é que..."
10090-100900250 = "Quer que eu dê um pulo na Hyakuyadou?"
10090-100900260 = "Ehehe... Sim!"
10090-100900270 = "Muito obrigada, Sensei~"
10090-100900280 = "Então estarei esperando por você na Hyakuyadou!"
10090-100900290 = "Sensei, peço desculpas pelo outro dia..."
10090-100900300 = "As coisas já se acalmaram por aí, Umika?"
10090-100900310 = "Sim. Graças a você..."
10090-100900320 = "Hum, Sensei, tem uma coisa sobre a qual eu queria pedir o seu conselho."
10090-100900330 = "Tem um pouco a ver com aquele assunto do outro dia..."
10090-100900340 = "Se for conveniente para você..."
10090-100900350 = "Você poderia vir até a Hyakuyadou...?"
10090-100900360 = "Então hoje eu posso ir!"
10090-100900370 = "Hã? S-Sim!"
10090-100900380 = "N-Na verdade..."
10090-100900390 = "Hoje eu faço muita questão que você venha..."
10090-100900400 = "Por isso, estarei esperando por você."
10090-100900410 = "Tá bom. Nos vemos na Hyakuyadou."
10090-100900420 = "Sensei?"
10090-100900430 = "Você já chegou?"
10090-100900440 = "Acabei de chegar."
10090-100900450 = "Por onde você está agora?"
10090-100900460 = "Me desculpe!"
10090-100900470 = "Parece que vou me atrasar um pouquinho..."
10090-100900480 = "Não precisa ter pressa, pode vir com calma."
10090-100900490 = "Chego aí rapidinho!"
10090-100900500 = "Muito obrigada pelo seu trabalho hoje, Sensei."
10090-100900510 = "Bom trabalho pra você também, Umika."
10090-100900520 = "Aliás, você não esqueceu um boneco aqui?"
10090-100900530 = "Ah...!"
10090-100900540 = "Hum... se você não se importar,"
10090-100900550 = "eu ficaria muito feliz se você pudesse cuidar dele para mim."
