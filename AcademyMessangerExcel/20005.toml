[translation]
20005-20005010 = "Сенсей, у вас есть время сегодня?"
20005-20005020 = "После уроков думаю зайти в торговый центр в городе Шиба и купить купальник..."
20005-20005030 = "Если можно, я хотела бы, чтобы вы посмотрели, какой купальник лучше!"
20005-20005040 = "Эм, если я вам подхожу, то с удовольствием."
20005-20005050 = "Может быть, у вас нет купальника...?"
20005-20005060 = "Школьный купальник есть, но..."
20005-20005070 = "Так нельзя!"
20005-20005080 = "Н-нельзя...?"
20005-20005090 = "Лето и море — это поле битвы, где каждый показывает свои скрытые достоинства..."
20005-20005100 = "А появляться там в школьном купальнике — всё равно что для обычного человека выйти на поле боя без оружия!"
20005-20005110 = "Раз уж так, я тоже хочу впервые заявить о себе летом...!"
20005-20005120 = "Сенсей, говорят, недалеко от рынка, немного в стороне от Муигахамы, есть малоизвестный красивый пляж!"
20005-20005130 = "Не хотите ли сходить туда сегодня днём поплавать?"
20005-20005140 = "Есть такое место? Тогда обязательно."
20005-20005150 = "Но там вроде не ходят ни автобусы, ни поезда..."
20005-20005160 = "Всё в порядке."
20005-20005170 = "Я приеду за вами на танке!"
20005-20005180 = "На танке!?"
20005-20005190 = "Сенсей, спасибо за сегодня. И извините..."
20005-20005200 = "Из-за меня всё стало только хуже...(；＿；)"
20005-20005210 = "Не переживай."
20005-20005220 = "Купальник можно починить?"
20005-20005230 = "Наверное, как-нибудь справлюсь..."
20005-20005240 = "В следующий раз, когда пойдём купаться, поедем на такси, а не на танке!"
20005-20005250 = "Разве в купальнике в такси не стыдно?"
20005-20005260 = "..."
20005-20005270 = "Действительно...!((º□º;))"
20005-20005280 = "Сенсей!"
20005-20005290 = "Небо чистое, погода отличная!"
20005-20005300 = "Раз уж стоит такая прекрасная погода,"
20005-20005310 = "может, позагораем вместе?"
20005-20005320 = "Хорошо, давай."
20005-20005330 = "Тогда нужно подготовиться."
20005-20005340 = "Предоставьте это мне!ヾ(•ω•`)o"
20005-20005350 = "Ведь у нас теперь есть Крусайдер!"
20005-20005360 = "Что ты собралась делать с танком!?"
20005-20005370 = "Сенсей, вы уже пообедали?"
20005-20005380 = "Нет, ещё нет."
20005-20005390 = "Вот как! Я как раз собиралась пойти поесть."
20005-20005400 = "Слышала, в ближайшем пляжном кафе продают вкусную лапшу якисоба..."
20005-20005410 = "Если хотите, не присоединитесь?"
20005-20005420 = "Якисоба — здорово, пошли!"
20005-20005430 = "Тогда я буду ждать вас у кафе!"
20005-20005440 = "И всё же море, а вы..."
20005-20005450 = "Сенсей, вы всё время такой занятой."
20005-20005460 = "Я могу чем-то помочь?"
20005-20005470 = "Мне уже приятно от одной этой мысли."
20005-20005480 = "Почему-то куда ни приду, везде просят о чём-то..."
20005-20005490 = "Тяжело вам, наверное..."
20005-20005500 = "Пожалуйста, не переусердствуйте."
20005-20005510 = "«Нет ничего печальнее лета, которое прошло без дела»,"
20005-20005520 = "говорил господин Николаев в рекламе летней распродажи!"
20005-20005530 = "Да, постараюсь. Спасибо."