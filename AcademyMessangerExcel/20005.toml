[translation]
20005-20005010 = "Sensei, você tem um tempinho hoje?"
20005-20005020 = "Estava pensando em ir ao shopping de Shiba Town depois da aula para comprar uma roupa de banho..."
20005-20005030 = "Se não for incomodar, queria muito que você me ajudasse a escolher uma que ficasse boa...!"
20005-20005040 = "Bom, se a minha opinião servir, vou com todo prazer."
20005-20005050 = "Por acaso você não tem nenhuma roupa de banho...?"
20005-20005060 = "Eu tenho o maiô escolar da academia, mas..."
20005-20005070 = "Com aquele não dá!"
20005-20005080 = "N-Não dá...?"
20005-20005090 = "O verão e a praia são um verdadeiro campo de batalha onde todas revelam seus charmes secretos..."
20005-20005100 = "Para uma garota comum como eu, ir a um lugar desses de maiô escolar é o mesmo que entrar no campo de batalha sem munição!"
20005-20005110 = "Já que surgiu a oportunidade, eu também quero fazer a minha estreia de verão...!"
20005-20005120 = "Sensei, ouvi dizer que tem uma praia linda e pouco conhecida perto de um mercado um pouco afastado de Muigahama!"
20005-20005130 = "O que acha de irmos nadar lá juntos hoje à tarde?"
20005-20005140 = "Não sabia que existia um lugar assim. Vamos sim!"
20005-20005150 = "Mas, se não me engano, não passa ônibus nem trem por aquelas bandas..."
20005-20005160 = "Não se preocupe!"
20005-20005170 = "Eu passo aí para te buscar de tanque!"
20005-20005180 = "De tanque?!"
20005-20005190 = "Sensei, muito obrigada por hoje. E me desculpe..."
20005-20005200 = "Por minha causa, as coisas acabaram virando uma confusão ainda maior... (；＿；)"
20005-20005210 = "Imagina, não esquenta com isso."
20005-20005220 = "Acha que vai dar para consertar o biquíni?"
20005-20005230 = "Acho que consigo dar um jeito, sim..."
20005-20005240 = "Da próxima vez que formos nadar, vamos de táxi em vez de tanque!"
20005-20005250 = "Pegar um táxi só de roupa de banho também não seria meio vergonhoso?"
20005-20005260 = "..."
20005-20005270 = "É verdade...! ((º□º;))"
20005-20005280 = "Sensei!"
20005-20005290 = "Não tem uma única nuvem no céu, o tempo está maravilhoso!"
20005-20005300 = "Já que está fazendo um sol tão lindo..."
20005-20005310 = "O que acha de tomarmos um banho de sol juntos?"
20005-20005320 = "Boa ideia, vamos sim!"
20005-20005330 = "Então vamos precisar preparar várias coisas."
20005-20005340 = "Pode deixar essa parte comigo! ヾ(•ω•`)o"
20005-20005350 = "Afinal, agora nós temos a Crusader-chan do nosso lado!"
20005-20005360 = "O que exatamente você pretende fazer com um tanque?!"
20005-20005370 = "Sensei, você já almoçou?"
20005-20005380 = "Ainda não, estava indo comer agora."
20005-20005390 = "Que ótimo! Eu também estava pensando em ir comer alguma coisa agora mesmo."
20005-20005400 = "Ouvi dizer que vendem um yakisoba delicioso num quiosque aqui perto..."
20005-20005410 = "Se quiser, que tal ir comigo, Sensei?"
20005-20005420 = "Yakisoba parece ótimo, vamos lá!"
20005-20005430 = "Então vou te esperar na frente do quiosque!"
20005-20005440 = "Puxa, logo agora que estamos na praia..."
20005-20005450 = "Parece que você não para de trabalhar um segundo, Sensei."
20005-20005460 = "Tem alguma coisa em que eu possa ajudar?"
20005-20005470 = "Só de saber que você quer ajudar já fico feliz."
20005-20005480 = "Não sei por quê, mas todo lugar que eu vou alguém me pede um favor..."
20005-20005490 = "Deve estar sendo bem puxado..."
20005-20005500 = "Por favor, tente não se esforçar demais, tá?"
20005-20005510 = "\"Não há nada mais triste do que um verão que passa em branco!\""
20005-20005520 = "Foi o próprio Sr. Nicolai quem disse isso no comercial da promoção especial de verão!"
20005-20005530 = "Pode deixar, vou tomar cuidado. Obrigado."
