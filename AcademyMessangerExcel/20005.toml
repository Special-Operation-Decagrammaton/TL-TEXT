[translation]
20005-20005010 = "Сенсей, вы свободны сегодня после обеда?"
20005-20005020 = "После занятий я иду в торговый центр города Шиба покупать купальник."
20005-20005030 = "Было бы здорово, если бы вы сказали, какой мне больше подходит. (≧∇≦)"
20005-20005040 = "Конечно, пойдём вместе."
20005-20005050 = "Разве у тебя уже нет купальника?"
20005-20005060 = "У меня есть школьный купальник, который я обычно ношу..."
20005-20005070 = "Но он слишком обычный! Я не хочу идти в каком попало купальнике!"
20005-20005080 = "Почему? Что с ним не так?"
20005-20005090 = "Летний пляж — поле битвы. Это борьба за то, чтобы выделиться..."
20005-20005100 = "Прийти на пляж в школьном купальнике — всё равно что выйти с ножом против пистолета!"
20005-20005110 = "Это как мой летний дебют!"
20005-20005120 = "Сенсей, я слышала, возле рынка Муигахама есть красивый пляж — настоящая скрытая жемчужина."
20005-20005130 = "Хотите сегодня днём поехать туда плавать?"
20005-20005140 = "Конечно."
20005-20005150 = "Но как туда добраться? Поблизости нет ни автобусных остановок, ни станции."
20005-20005160 = "Всё нормально. Я вас заберу."
20005-20005170 = "На моём танке!"
20005-20005180 = "На танке?!"
20005-20005190 = "Сенсей, мне так жаль."
20005-20005200 = "Из-за меня вам пришлось через всё это пройти...\n(；＿；)"
20005-20005210 = "Всё в порядке."
20005-20005220 = "А купальник цел?"
20005-20005230 = "С порванным купальником уже ничего не сделать, но у меня есть запасной. Всё будет нормально."
20005-20005240 = "В следующий раз поедем плавать на такси, а не на танке!"
20005-20005250 = "Разве не неловко ехать в такси в купальнике?"
20005-20005260 = "О..."
20005-20005270 = "О БОЖЕ! ((º□º;))"
20005-20005280 = "Сенсей, посмотрите на улицу!"
20005-20005290 = "На небе ни облачка. Погода отличная!"
20005-20005300 = "Идеальная погода, чтобы загорать на пляже!"
20005-20005310 = "Ну что? Хотите со мной?"
20005-20005320 = "Конечно, пошли."
20005-20005330 = "Разве нам не понадобятся кое-какие вещи для загара?"
20005-20005340 = "Не волнуйтесь. ヾ(•ω•)o"
20005-20005350 = "Пусть у нас нет всего необходимого, зато есть танк!"
20005-20005360 = "И что ты собираешься делать с танком?!"
20005-20005370 = "Вы уже обедали, Сенсей?"
20005-20005380 = "Ещё нет."
20005-20005390 = "О, отлично. Я как раз собиралась поесть."
20005-20005400 = "Я слышала, в Пляжной хижине продают отличную якисобу..."
20005-20005410 = "Не хотите пообедать там вместе?"
20005-20005420 = "Конечно, звучит отлично."
20005-20005430 = "Отлично! Тогда скоро увидимся у Пляжной хижины!"
20005-20005440 = "Мы не так часто бываем у моря..."
20005-20005450 = "Но вы так заняты, что не уверена, успеете ли насладиться отдыхом!"
20005-20005460 = "Я могу чем-нибудь помочь?"
20005-20005470 = "Спасибо за предложение."
20005-20005480 = "Странно. Куда бы я ни пошла, люди просят меня о помощи..."
20005-20005490 = "Да, ты даже в отпуске много работаешь."
20005-20005500 = "Но не переусердствуй, хорошо?"
20005-20005510 = "Как сказал господин Николай в рекламе летней распродажи:"
20005-20005520 = "«Нет ничего печальнее потраченного впустую лета!»"
20005-20005530 = "Буду иметь в виду."
