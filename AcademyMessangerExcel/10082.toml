[translation]
10082-100820010 = "Сенсей. Не пугайся!"
10082-100820020 = "Но это самое серьёзное препятствие, с которым мне когда-либо приходилось сталкиваться!"
10082-100820030 = "Проблема довольно запутанная, но..."
10082-100820040 = "Всё в порядке, Рэнгэ?"
10082-100820050 = "Я в последнее время очень много думала,"
10082-100820060 = "и, кажется, наконец поняла корень проблемы!"
10082-100820070 = "Такими темпами всему может прийти конец! Что бы я ни делала!"
10082-100820080 = "Прости, Рэнгэ. Я вообще не понимаю, о чём ты!"
10082-100820090 = "А?! Серьёзно? Эм... Может, это слишком сложно объяснить через MomoTalk."
10082-100820100 = "В конце концов, через текст не почувствуешь мою пылающую страсть!"
10082-100820110 = "О? Похоже, для тебя это действительно важно!"
10082-100820120 = "Ещё бы! Поэтому нельзя терять ни минуты, Сенсей!"
10082-100820130 = "Пожалуйста! Мне нужен твой совет!"
10082-100820140 = "Я всегда готов поговорить, но..."
10082-100820150 = "Правда?!"
10082-100820160 = "Отлично! Тогда буду ждать!"
10082-100820170 = "Сенсей..."
10082-100820180 = "Нет, Наставник!"
10082-100820190 = "Я всё ещё не уверен, что думаю об этом обращении..."
10082-100820200 = "Не переживай об этом так сильно!"
10082-100820210 = "Ведь именно ты направляешь меня в поисках моей юности!"
10082-100820220 = "Одной этой мысли достаточно, чтобы ты расправил плечи!"
10082-100820230 = "Раз ты так говоришь..."
10082-100820240 = "Отлично! Теперь нас ждут настоящие занятия юностью!"
10082-100820250 = "Начиная с сегодняшнего дня я стану"
10082-100820260 = "великой искательницей юности, которая верно следует твоим наставлениям!"
10082-100820270 = "Сказано уверенно и гордо!"
10082-100820280 = "Это так на тебя похоже, Рэнгэ!"
10082-100820290 = "Ха-ха, да! Встретимся в офисе Совета урегулирования Хяккарёран, Наставник!"
10082-100820300 = "Я думала об этом по дороге домой, но..."
10082-100820310 = "Знаешь, раз Сенсей — учитель..."
10082-100820320 = "вся эта история с переводным студентом была немного перебором, да?"
10082-100820330 = "Только сейчас до тебя дошло...?"
10082-100820340 = "Ну, отношения ведь бывают не только у переводных студентов!"
10082-100820350 = "В следующий раз придумаю что-нибудь получше!"
10082-100820360 = "Я верю в тебя, Рэнгэ!"
10082-100820370 = "В следующий раз найдём ещё больше занятий юностью!"
10082-100820380 = "Да! В следующий раз!"
10082-100820390 = "Хм... В любых юношеских отношениях"
10082-100820400 = "ОБЯЗАТЕЛЬНО должна быть «та самая» дружба..."
10082-100820410 = "Как я могла всё это время забывать?"
10082-100820420 = "Мы должны это сделать! Даже если это... ну, «то самое»."
10082-100820430 = "Эта твоя игра в загадочные местоимения меня пугает..."
10082-100820440 = "Ну, понимаешь..."
10082-100820450 = "Хм."
10082-100820460 = "ХМ-М-М..."
10082-100820470 = "Думаю, заставлю тебя немного подождать, Сенсей. Так интереснее!"
10082-100820480 = "Наше следующее занятие юностью уже подготовлено и готово к запуску!"
10082-100820490 = "Завтра я приду в Шале, хорошо?"
10082-100820500 = "Хорошо! Как скажешь, Рэнгэ!"
10082-100820510 = "Тогда до завтра!"
10082-100820520 = "ЭЙ! Забудь всё, что произошло сегодня, ладно?!"
10082-100820530 = "Для нас... вообще ничего не произошло!"
10082-100820540 = "Просто сотри это из памяти навсегда! Отношения друзей детства явно невозможно воссоздать!"
10082-100820550 = "Правда? По-моему, всё прошло довольно неплохо!"
10082-100820560 = "А-а-а! Я сказала забыть!"
10082-100820570 = "Мы попробуем другой тип отношений!"
10082-100820580 = "Вот увидишь, Наставник!"
10082-100820590 = "Есть, мэм."
10082-100820600 = "Мы уже довольно давно занимаемся юношескими делами,"
10082-100820610 = "Сенсей."
10082-100820620 = "Да."
10082-100820630 = "Время пролетело незаметно!"
10082-100820640 = "Я прокладывала путь по земле, на которую прежде никогда не ступала."
10082-100820650 = "Как бы трудно ни было, я преодолевала препятствия и медленно, но верно продвигалась вперёд!"
10082-100820660 = "Нужно продолжать в том же духе, Сенсей!"
10082-100820670 = "Я прямо сейчас иду в Шале!"
10082-100820680 = "Хорошо, что у меня сегодня не было планов..."
10082-100820690 = "Скоро увидимся!"
10082-100820700 = "Я ведь сильно тебе надоедала, да, Сенсей?"
10082-100820710 = "Прости..."
10082-100820720 = "Я хочу пережить с тобой ещё больше юношеских приключений, Рэнгэ."
10082-100820730 = "Тебе не за что извиняться."
10082-100820740 = "О... Правда?"
10082-100820750 = "Спасибо, Сен..."
10082-100820760 = "То есть... Наставник! Ещё поговорим!"
10082-100820770 = "Наставник! Есть минутка?"
10082-100820780 = "Меня заинтересовало новое занятие юностью..."
10082-100820790 = "Что такое?"
10082-100820800 = "Взять своего студента"
10082-100820810 = "за покупками в её выходной!"
10082-100820820 = "Думаю, это то, чем можно по-настоящему насладиться только будучи студентом."
10082-100820830 = "О-о-о! Как захватывающе! Куда пойдём?"
10082-100820840 = "Что будем покупать?"
10082-100820850 = "Хм, я ещё не решила."
10082-100820860 = "Но главное — просто провести время вместе, ходя по магазинам!"
10082-100820870 = "В витринах тоже есть своё очарование, правда?"
10082-100820880 = "То есть как свидание?"
10082-100820890 = "Ха-ха, что значит «свидание»?"
10082-100820900 = "..."
10082-100820910 = "Подожди-ка."
10082-100820920 = "Это свидание?"
10082-100820930 = "..."
10082-100820940 = "А-а-а, забудь!"
10082-100820950 = "Встретимся в торговом районе, когда освободишься!"
10082-100820960 = "Эм, Наставник."
10082-100820970 = "Спасибо за сегодняшний подарок."
10082-100820980 = "Эта лента для меня очень много значит..."
10082-100820990 = "Я буду это беречь."
10082-100821000 = "И тебе спасибо за подарок."
10082-100821010 = "В следующий раз подарю тебе что-нибудь получше."
10082-100821020 = "Так что... давай снова сходим вместе за покупками."
10082-100821030 = "Хорошо?"
10082-100821040 = "Давай! Не могу дождаться!"
10082-100821050 = "Я тоже!"
