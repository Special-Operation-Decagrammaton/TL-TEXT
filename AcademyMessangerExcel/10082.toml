[translation]
10082-100820010 = "Сенсей, послушайте."
10082-100820020 = "Фува Ренге, я в самой большой жизненной опасности!"
10082-100820030 = "С чего вдруг такие речи..."
10082-100820040 = "Ренге, что случилось?"
10082-100820050 = "Я несколько дней думала об этом."
10082-100820060 = "Я осознала."
10082-100820070 = "Если так пойдёт дальше, всё может закончиться!"
10082-100820080 = "Извините, что вы имеете в виду!?"
10082-100820090 = "Ну... в Момотолке это трудно объяснить..."
10082-100820100 = "Такие вещи нужно говорить лично!"
10082-100820110 = "Я не против, но..."
10082-100820120 = "Сенсей, вот что..."
10082-100820130 = "Пожалуйста, помогите советом!"
10082-100820140 = "Конечно."
10082-100820150 = "Правда!?"
10082-100820160 = "Тогда я жду!"
10082-100820170 = "Сенсей..."
10082-100820180 = "Нет, Наставник!"
10082-100820190 = "Когда меня называют наставником, немного неловко..."
10082-100820200 = "Ещё не привыкли?"
10082-100820210 = "Мы же уже наставник и ученица!"
10082-100820220 = "Будем с гордостью!"
10082-100820230 = "Да..."
10082-100820240 = "Ну, нельзя терять время. Сразу начнём нашу молодёжную деятельность."
10082-100820250 = "С сегодняшнего дня я буду непосредственно получать наставления от Наставника."
10082-100820260 = "Я покажу, что могу прожить достойную молодость!"
10082-100820270 = "Твёрдое заявление, без тени сомнения...!"
10082-100820280 = "Вот это настрой, Ренге!"
10082-100820290 = "Хорошо! Встречаемся в арбитражной комнате, Наставник!"
10082-100820300 = "Сенсей, я дома подумала как следует."
10082-100820310 = "Всё-таки Сенсей есть Сенсей."
10082-100820320 = "Роль новенькой ученицы, наверное, была не очень удачной..."
10082-100820330 = "Только сейчас...?"
10082-100820340 = "Ну, отношения не ограничиваются только новенькой!"
10082-100820350 = "Теперь попробуем новые отношения!"
10082-100820360 = "Да, звоните в любое время."
10082-100820370 = "Жду с нетерпением следующего раза."
10082-100820380 = "Спасибо, Сенсей!"
10082-100820390 = "Хм, если говорить о классике молодёжи..."
10082-100820400 = "То «этого» никак не избежать."
10082-100820410 = "Как я могла забыть об этом до сих пор..."
10082-100820420 = "«Этого»...?"
10082-100820430 = "Что именно вы имеете в виду...?"
10082-100820440 = "А вот что."
10082-100820450 = "..."
10082-100820460 = "Хм..."
10082-100820470 = "Нет, если сказать заранее, будет неинтересно!"
10082-100820480 = "Итак, следующая «молодёжная деятельность» — это решено!"
10082-100820490 = "Это сюрприз, когда завтра приду в Шале!"
10082-100820500 = "Понял. Тогда до завтра."
10082-100820510 = "Да!"
10082-100820520 = "Сегодняшнее мероприятие отменяется!"
10082-100820530 = "Да, отменяется!"
10082-100820540 = "Роль друзей детства для нас — слишком высокая планка!"
10082-100820550 = "Н-неужели?"
10082-100820560 = "Да, точно!"
10082-100820570 = "Поэтому в следующий раз придумаю другие отношения!"
10082-100820580 = "Будьте готовы, Наставник!"
10082-100820590 = "Д-да..."
10082-100820600 = "Сенсей, как-то незаметно, с тех пор как мы начали «молодёжную деятельность»..."
10082-100820610 = "Прошло уже порядочно времени."
10082-100820620 = "Да, верно."
10082-100820630 = "Уже столько прошло?"
10082-100820640 = "Были и неудачи..."
10082-100820650 = "Но я уверена, что мы шаг за шагом движемся вперёд."
10082-100820660 = "И так, снова настало время для молодёжной деятельности!"
10082-100820670 = "Я зайду в Шале!"
10082-100820680 = "Да, жду."
10082-100820690 = "Тогда увидимся позже!"
10082-100820700 = "Сенсей, я доставила вам много хлопот..."
10082-100820710 = "Ну..."
10082-100820720 = "Давайте и дальше стараться в нашей «молодёжной деятельности»."
10082-100820730 = "Спасибо, что беспокоитесь."
10082-100820740 = "А... ага."
10082-100820750 = "А ты всё понимаешь! Сенсей... нет, Наставник!"
10082-100820760 = "Давайте снова вместе займёмся «молодёжной деятельностью»!"
10082-100820770 = "Наставник, можно?"
10082-100820780 = "У меня есть одна интересная идея для молодёжной деятельности..."
10082-100820790 = "На этот раз какая?"
10082-100820800 = "Поход наставника и студента –"
10082-100820810 = "Поход по магазинам в выходной!"
10082-100820820 = "Я подумала, что это именно та молодёжная деятельность, которая подходит студентам."
10082-100820830 = "Звучит весело!"
10082-100820840 = "У тебя есть что-то, что хочешь купить?"
10082-100820850 = "Нет, конкретно ничего."
10082-100820860 = "Но я думаю, что «провести время вместе в торговом ряду» — это и есть молодость."
10082-100820870 = "Разве не весело просто смотреть по сторонам?"
10082-100820880 = "То есть... как свидание?"
10082-100820890 = "Ха-ха! Что вы, такое –"
10082-100820900 = "..."
10082-100820910 = "Подождите..."
10082-100820920 = "Это что, свидание...?"
10082-100820930 = "..."
10082-100820940 = "В-в любом случае!"
10082-100820950 = "Я жду вас в торговом ряду!"
10082-100820960 = "Н-Наставник."
10082-100820970 = "Спасибо за ленту."
10082-100820980 = "Правда... она стала для меня чем-то особенным."
10082-100820990 = "Я буду беречь её."
10082-100821000 = "Маску я поставлю на видное место."
10082-100821010 = "Да... было очень весело."
10082-100821020 = "Давай ещё сходим по магазинам."
10082-100821030 = "Вместе..."
10082-100821040 = "Да! Буду ждать с нетерпением!"
10082-100821050 = "И я тоже!"