[translation]
10082-100820010 = "Sensei, me escuta!"
10082-100820020 = "Eu, Fuwa Renge, estou enfrentando a maior crise da minha vida!"
10082-100820030 = "O que é isso assim do nada...?"
10082-100820040 = "Renge, o que aconteceu?"
10082-100820050 = "Passei os últimos dias inteiros pensando nisso,"
10082-100820060 = "e acabei me dando conta de uma coisa."
10082-100820070 = "Se eu continuar assim, pode ser o fim de tudo para mim!"
10082-100820080 = "Desculpa, mas como assim?!"
10082-100820090 = "Hum... realmente, explicar pelo MomoTalk é meio difícil..."
10082-100820100 = "Esse tipo de coisa a gente precisa conversar cara a cara, né?!"
10082-100820110 = "Por mim tudo bem, mas..."
10082-100820120 = "Então, Sensei..."
10082-100820130 = "Por favor, me dá um conselho!"
10082-100820140 = "Claro que dou."
10082-100820150 = "Sério?!"
10082-100820160 = "Então vou ficar te esperando!"
10082-100820170 = "Sensei..."
10082-100820180 = "Quer dizer, Mestre!"
10082-100820190 = "Ser chamado de Mestre dá uma certa vergonha..."
10082-100820200 = "Ainda não se acostumou?"
10082-100820210 = "Agora nós somos mestre e discípula!"
10082-100820220 = "Vamos estufar o peito de orgulho!"
10082-100820230 = "S-sim..."
10082-100820240 = "Beleza, não podemos perder tempo! Vamos começar logo as nossas Atividades da Juventude!"
10082-100820250 = "A partir de hoje, receberei os ensinamentos diretamente do meu Mestre."
10082-100820260 = "Vou mostrar que sou capaz de viver uma juventude exemplar!"
10082-100820270 = "Que declaração poderosa e cheia de convicção...!"
10082-100820280 = "Esse é o espírito, Renge!"
10082-100820290 = "Isso aí! Ponto de encontro na sala de mediação, Mestre!"
10082-100820300 = "Sensei, estive pensando com calma em casa,"
10082-100820310 = "e como você é o Sensei, no fim das contas,"
10082-100820320 = "acho que fazer o papel de aluno transferido foi meio forçado..."
10082-100820330 = "Só agora você percebeu...?"
10082-100820340 = "B-bom, aluno transferido não é o único tipo de dinâmica que existe!"
10082-100820350 = "Da próxima vez, vamos testar uma relação diferente!"
10082-100820360 = "Beleza, pode me chamar quando quiser."
10082-100820370 = "Já estou ansioso pela próxima."
10082-100820380 = "Obrigada, Sensei!"
10082-100820390 = "Huum, falando em clássicos da juventude,"
10082-100820400 = "definitivamente não pode faltar \"aquilo\"."
10082-100820410 = "Como foi que eu esqueci disso até agora...?"
10082-100820420 = "\"Aquilo\"...?"
10082-100820430 = "O que seria isso exatamente...?"
10082-100820440 = "É o seguinte:"
10082-100820450 = "..."
10082-100820460 = "Huum..."
10082-100820470 = "Não, se eu contar antes perde a graça!"
10082-100820480 = "Fechado, a nossa próxima \"Atividade da Juventude\" já está decidida!"
10082-100820490 = "Vai ser surpresa até eu chegar aí na Schale amanhã!"
10082-100820500 = "Combinado. Até amanhã, então."
10082-100820510 = "Até!"
10082-100820520 = "O-o evento de hoje está cancelado!"
10082-100820530 = "Isso mesmo, cancelado!"
10082-100820540 = "Fazer papel de amigos de infância era um nível alto demais para nós!"
10082-100820550 = "V-você acha?"
10082-100820560 = "Acho, com toda a certeza!"
10082-100820570 = "Por isso, na próxima vou pensar em outro tipo de relação!"
10082-100820580 = "Pode ir se preparando, Mestre!"
10082-100820590 = "S-sim, senhora..."
10082-100820600 = "Sensei, parando para pensar, desde que começamos as nossas \"Atividades da Juventude\"..."
10082-100820610 = "Já se passou um bom tempo, né?"
10082-100820620 = "Verdade."
10082-100820630 = "Já faz tanto tempo assim?"
10082-100820640 = "Tivemos alguns tropeços pelo caminho, mas..."
10082-100820650 = "Mesmo assim, sinto que estamos avançando com firmeza, passo a passo."
10082-100820660 = "Dito isso, chegou a hora da nossa Atividade da Juventude de hoje!"
10082-100820670 = "Vou dar uma passada aí na Schale!"
10082-100820680 = "Beleza, estou te esperando."
10082-100820690 = "Então até daqui a pouco!"
10082-100820700 = "Sensei, sei que acabei te dando bastante trabalho hoje, mas..."
10082-100820710 = "Hum..."
10082-100820720 = "Vamos continuar dando o nosso melhor nas \"Atividades da Juventude\", tá?"
10082-100820730 = "Obrigado por se preocupar comigo."
10082-100820740 = "S-sim..."
10082-100820750 = "Você me conhece bem mesmo, hein, Sense... digo, Mestre!"
10082-100820760 = "Vamos fazer mais \"Atividades da Juventude\" juntos na próxima!"
10082-100820770 = "Mestre, tem um minutinho?"
10082-100820780 = "Tem uma Atividade da Juventude que me chamou a atenção..."
10082-100820790 = "Qual é a de hoje?"
10082-100820800 = "Um passeio de mestre e discípula:"
10082-100820810 = "Fazer compras no dia de folga!"
10082-100820820 = "Achei que é uma típica atividade de juventude de estudante."
10082-100820830 = "Parece divertido!"
10082-100820840 = "Tem alguma coisa específica que você queira comprar?"
10082-100820850 = "Nada em especial, na verdade."
10082-100820860 = "É que achei que \"passar o tempo juntos no centro comercial\" tem tudo a ver com a juventude..."
10082-100820870 = "Só de ficar olhando as lojas já é divertido, não acha?"
10082-100820880 = "Ou seja... tipo um encontro?"
10082-100820890 = "Haha! Claro que não é nada dis—"
10082-100820900 = "..."
10082-100820910 = "Espera..."
10082-100820920 = "Isso seria um encontro...?"
10082-100820930 = "..."
10082-100820940 = "E-enfim!"
10082-100820950 = "Tô te esperando no centro comercial!"
10082-100820960 = "M-Mestre..."
10082-100820970 = "Obrigada pelo laço."
10082-100820980 = "De verdade... ele se tornou algo muito especial para mim."
10082-100820990 = "Vou guardar com todo o carinho."
10082-100821000 = "E eu vou guardar a máscara com carinho de recordação."
10082-100821010 = "Sim... foi tão divertido hoje."
10082-100821020 = "Vamos sair para fazer compras de novo outra hora."
10082-100821030 = "Juntos..."
10082-100821040 = "Claro! Vou ficar esperando ansioso!"
10082-100821050 = "Eu também!"
