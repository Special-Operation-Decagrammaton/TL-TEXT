26013-260130140 = "Есть две вещи, которые я очень хочу сфотографировать."
26013-260130150 = "Кхм"
26013-260130160 = "На этот раз я точно положила батарейки внутрь."
26013-260130170 = "Эй, Сенсей"
26013-260130180 = "У меня плохие новости."
