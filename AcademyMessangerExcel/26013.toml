[translation]
26013-260130010 = "Olá, Sensei."
26013-260130020 = "Olá, Atsuko."
26013-260130030 = "O mar é ainda mais bonito do que eu imaginava."
26013-260130040 = "Não consigo tirar os olhos dele."
26013-260130050 = "No festival também, tudo o que vejo é novidade pra mim."
26013-260130060 = "Que bom que você está se divertindo!"
26013-260130070 = "Já que estou aqui, quero guardar fotos de recordação."
26013-260130080 = "Vou dar uma voltinha."
26013-260130090 = "Quer vir junto, Sensei?"
26013-260130100 = "Sensei"
26013-260130110 = "Está ocupado agora?"
26013-260130120 = "Tenho tempo livre sim."
26013-260130130 = "Então pode vir comigo um pouquinho?"
26013-260130140 = "Tem duas coisas que eu quero muito fotografar."
26013-260130150 = "Ah"
26013-260130160 = "Desta vez vou colocar a bateria direitinho antes de sair."
26013-260130170 = "Sensei"
26013-260130180 = "Tenho uma má notícia."
26013-260130190 = "O que houve?"
26013-260130200 = "A bateria da câmera está quase no fim."
26013-260130210 = "Não dá para tirar muitas fotos."
26013-260130220 = "Então preciso escolher com muito cuidado o que vou fotografar."
