[translation]
26013-260130010 = "Здравствуйте, Сенсей."
26013-260130020 = "Здравствуй, Ацуко."
26013-260130030 = "Море оказалось красивее, чем я думала,"
26013-260130040 = "от него невозможно оторвать взгляд."
26013-260130050 = "На фестивале тоже всё в новинку."
26013-260130060 = "Рад, что тебе нравится!"
26013-260130070 = "Раз уж так, я хочу запечатлеть это на фото."
26013-260130080 = "Я ненадолго отойду."
26013-260130090 = "Сенсей, хотите пойти со мной?"
26013-260130100 = "Сенсей"
26013-260130110 = "Вы сейчас заняты?"
26013-260130120 = "Времени хватает."
26013-260130130 = "Тогда составите мне компанию?"
26013-260130140 = "Есть две вещи, которые я обязательно хочу сфотографировать."
26013-260130150 = "Ах"
26013-260130160 = "В этот раз я не забуду вставить батарейку."
26013-260130170 = "Сенсей"
26013-260130180 = "У меня плохие новости."
26013-260130190 = "Что случилось?"
26013-260130200 = "В камере почти не осталось заряда,"
26013-260130210 = "я смогу сделать всего несколько снимков."
26013-260130220 = "Так что нужно тщательно выбирать, что снимать."