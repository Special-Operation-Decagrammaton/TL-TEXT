[translation]
20044-200440010 = "Olá, Treinador"
20044-200440020 = "O que você está fazendo agora?"
20044-200440030 = "Tô deitado na cama"
20044-200440040 = "Entendo"
20044-200440050 = "Se desejar,"
20044-200440060 = "gostaria que eu lhe apresentasse alguns treinos"
20044-200440070 = "que podem ser feitos exatamente nessa posição?"
20044-200440080 = "Existe treino pra fazer deitado na cama?!"
20044-200440090 = "Existe sim. Porém..."
20044-200440100 = "Desta vez não entrei em contato para falar de treino,"
20044-200440110 = "e sim para lhe dar um informe"
20044-200440120 = "Na verdade, comecei a trabalhar em um emprego de meio período"
20044-200440130 = "Por que resolveu fazer bico?"
20044-200440140 = "É que o novo aparelho de musculação que eu tanto queria entrou em promoção"
20044-200440150 = "Contudo, não tenho fundos suficientes para a compra..."
20044-200440160 = "É tão caro assim?"
20044-200440170 = "Sim... O preço original é 600 mil ienes, mas..."
20044-200440180 = "Na promoção está saindo por 450 mil ienes"
20044-200440190 = "Que caro!"
20044-200440200 = "Por que não tenta solicitar verba como equipamento do clube?"
20044-200440210 = "Isso levaria tempo demais,"
20044-200440220 = "e o período da promoção acabaria antes"
20044-200440230 = "Além disso, esse trabalho de meio período"
20044-200440240 = "já serve como treino ao mesmo tempo, matando dois coelhos com uma cajadada só"
20044-200440250 = "Não sabia que existia um trabalho assim...!"
20044-200440260 = "Se tiver interesse,"
20044-200440270 = "por favor, venha visitar o Estádio Atlético qualquer dia desses"
20044-200440280 = "Tenho ótimas notícias, Treinador"
20044-200440290 = "Podemos chamar isso de um resultado impecável"
20044-200440300 = "Resultado impecável?"
20044-200440310 = "Aquele aparelho de treino de que falei antes..."
20044-200440320 = "Consegui comprá-lo à vista em segurança!"
20044-200440330 = "Comprou algo tão caro assim à vista?!"
20044-200440340 = "Sim"
20044-200440350 = "Realmente, derramar suor e receber a recompensa por isso é algo maravilhoso!"
20044-200440360 = "E é justamente por isso que acho curioso..."
20044-200440370 = "Treinar também segue o mesmo princípio de 'movimentar o corpo e se esforçar',"
20044-200440380 = "então por que será que as pessoas evitam tanto?"
20044-200440390 = "B-Boa pergunta... Por que será, né?"
20044-200440400 = "Treinador"
20044-200440410 = "O que você considera mais importante na vida?"
20044-200440420 = "Descansar!"
20044-200440430 = "Ah, e jogar videogame também!"
20044-200440440 = "O descanso é de fato essencial"
20044-200440450 = "Continuar treinando além do limite aumenta o risco de lesões"
20044-200440460 = "e acaba prejudicando a hipertrofia muscular"
20044-200440470 = "Jogar videogame, você diz...?"
20044-200440480 = "Seria como uma forma de aliviar o estresse?"
20044-200440490 = "É verdade que o estresse afeta o condicionamento físico"
20044-200440500 = "Mas, na minha opinião..."
20044-200440510 = "Acredito que a 'saúde' ainda seja a coisa mais importante na vida"
20044-200440520 = "Olá, Treinador"
20044-200440530 = "Você tem um tempinho agora?"
20044-200440540 = "Claro. Aconteceu alguma coisa?"
20044-200440550 = "Na verdade, há algo sobre o qual eu gostaria de pedir seu conselho..."
20044-200440560 = "O gerente do estádio onde eu trabalhava antes entrou em contato comigo."
20044-200440570 = "E há uma coisa que eu gostaria que você visse também, Treinador"
20044-200440580 = "Do gerente do estádio...?"
20044-200440590 = "Entendi. Estou indo pra aí agora mesmo!"
20044-200440600 = "Bom dia, Treinador"
20044-200440610 = "Se você tiver alguma folga na sua agenda,"
20044-200440620 = "momentos assim são a oportunidade perfeita para exercitar o corpo"
20044-200440630 = "Se tiver tempo, não deixe de dar uma passada na academia!"
20044-200440640 = "Sumire, deu a maior confusão!"
20044-200440650 = "Confusão?"
20044-200440660 = "É raro ver você tão afobado assim, Treinador"
20044-200440670 = "O que aconteceu?"
20044-200440680 = "A internet inteira tá em polvorosa falando de você, Sumire!"
20044-200440690 = "...De mim?"
20044-200440700 = "O que será que houve?"
20044-200440710 = "Vamos conversar um instante"
20044-200440720 = "Se a minha memória não falha,"
20044-200440730 = "receber um convite diretamente de você, Treinador,"
20044-200440740 = "é algo extremamente raro"
20044-200440750 = "É uma experiência muito gratificante"
20044-200440760 = "Sinto até a minha frequência cardíaca subir..."
20044-200440770 = "Estou indo para aí imediatamente!"
