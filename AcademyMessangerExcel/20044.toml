[translation]
20044-200440010 = "Здравствуйте, Тренер."
20044-200440020 = "Чем вы сейчас занимаетесь?"
20044-200440030 = "Лежу в кровати."
20044-200440040 = "Понимаю."
20044-200440050 = "Если хотите,"
20044-200440060 = "я могу предложить вам упражнения,"
20044-200440070 = "которые можно выполнять в этом положении."
20044-200440080 = "Упражнения, которые можно делать прямо здесь!?"
20044-200440090 = "Да, есть. Но..."
20044-200440100 = "на этот раз я связалась с вами не для разговора о тренировках,"
20044-200440110 = "а чтобы сообщить кое-что."
20044-200440120 = "Дело в том, что я решила устроиться на подработку."
20044-200440130 = "Почему подработку?"
20044-200440140 = "Новая модель тренажёра, которую я хотела, сейчас на распродаже."
20044-200440150 = "Но у меня не хватает денег на покупку..."
20044-200440160 = "Он так дорог?"
20044-200440170 = "Да... Обычная цена — 600 000, а"
20044-200440180 = "по скидке — 450 000."
20044-200440190 = "Дорого!"
20044-200440200 = "А почему бы не подать заявку на бюджет как на оборудование?"
20044-200440210 = "Это займёт слишком много времени,"
20044-200440220 = "а распродажа скоро закончится."
20044-200440230 = "К тому же, эта подработка"
20044-200440240 = "позволяет совмещать работу и тренировки, так что это два в одном."
20044-200440250 = "Не знал, что бывает такая работа...!"
20044-200440260 = "Если вам интересно,"
20044-200440270 = "приходите как-нибудь в спортивный стадион."
20044-200440280 = "У меня хорошие новости, Тренер."
20044-200440290 = "Это можно назвать лучшим результатом."
20044-200440300 = "Лучшим результатом?"
20044-200440310 = "Тренажёр, о котором я говорила раньше,"
20044-200440320 = "я купила его за наличные!"
20044-200440330 = "Такую дорогую вещь!?"
20044-200440340 = "Да."
20044-200440350 = "Похоже, потрудиться и получить за это вознаграждение — это замечательно!"
20044-200440360 = "Но именно поэтому мне непонятно..."
20044-200440370 = "Тренировки тоже требуют усилий и движений,"
20044-200440380 = "но почему все их так избегают?"
20044-200440390 = "Н-ну... не знаю."
20044-200440400 = "Тренер"
20044-200440410 = "Что, по-вашему, самое важное в жизни?"
20044-200440420 = "Отдых!"
20044-200440430 = "И ещё, например, игры!"
20044-200440440 = "Отдых действительно важен."
20044-200440450 = "Если продолжать тренировки через силу, повышается риск травм,"
20044-200440460 = "к тому же это мешает росту мышц."
20044-200440470 = "Игры...?"
20044-200440480 = "Возможно, как способ снять стресс?"
20044-200440490 = "Действительно, стресс влияет на самочувствие."
20044-200440500 = "Но, по моему мнению..."
20044-200440510 = "всё-таки самое важное в жизни — это «здоровье»."
20044-200440520 = "Здравствуйте, Тренер."
20044-200440530 = "У вас есть время сейчас?"
20044-200440540 = "Конечно. Что-то случилось?"
20044-200440550 = "Мне нужно с вами кое-что обсудить..."
20044-200440560 = "Мне позвонил менеджер стадиона, где я работала раньше."
20044-200440570 = "И я хочу, чтобы вы тоже посмотрели кое-что."
20044-200440580 = "Менеджер стадиона...?"
20044-200440590 = "Хорошо, я сейчас приду!"
20044-200440600 = "Доброе утро, Тренер."
20044-200440610 = "Если у вас есть свободное время в расписании,"
20044-200440620 = "это отличный шанс подвигаться."
20044-200440630 = "Если у вас есть время, обязательно загляните в спортзал!"
20044-200440640 = "Смирэ, случилось нечто серьёзное!"
20044-200440650 = "Нечто серьёзное?"
20044-200440660 = "Редко вижу Тренера таким взволнованным."
20044-200440670 = "Что случилось?"
20044-200440680 = "Сейчас в сети все только о тебе и говорят!"
20044-200440690 = "...Обо мне?"
20044-200440700 = "Что же там произошло?"
20044-200440710 = "Давай встретимся и поговорим."
20044-200440720 = "Если я не ошибаюсь,"
20044-200440730 = "это довольно редкий случай, когда Тренер приглашает меня."
20044-200440740 = "Я рада такому опыту."
20044-200440750 = "Моё сердце бьётся чаще, и..."
20044-200440760 = "Я сейчас приду!"