[translation]
20044-200440010 = "Тренер."
20044-200440020 = "Ты там?"
20044-200440030 = "Я сейчас лежу на кровати."
20044-200440040 = "Понятно."
20044-200440050 = "Может, мне"
20044-200440060 = "научить вас нескольким упражнениям,"
20044-200440070 = "которые можно делать лёжа."
20044-200440080 = "Ты написала мне ради разговора об упражнениях?!"
20044-200440090 = "А."
20044-200440100 = "Нет, совсем нет."
20044-200440110 = "Я хотела сказать,"
20044-200440120 = "что устроилась на подработку."
20044-200440130 = "Зачем?"
20044-200440140 = "На недавно вышедший тренажёр, который я хочу, сейчас скидка."
20044-200440150 = "Но сейчас у меня нет средств, чтобы его купить."
20044-200440160 = "Сколько он стоит?"
20044-200440170 = "450 000 иен."
20044-200440180 = "Обычная цена — 600 000 иен."
20044-200440190 = "Так дорого!"
20044-200440200 = "Разве нельзя просто оформить покупку за счёт школы?"
20044-200440210 = "Оформление займёт слишком много времени."
20044-200440220 = "Скидка действует лишь ограниченное время."
20044-200440230 = "Дополнительное преимущество в том, что моя подработка"
20044-200440240 = "заодно служит физической тренировкой. Два дела одним махом."
20044-200440250 = "Что за подработка...?"
20044-200440260 = "Проще показать."
20044-200440270 = "Можем встретиться на спортивном стадионе."
20044-200440280 = "У меня хорошие новости, Тренер."
20044-200440290 = "Нет. Лучшие новости."
20044-200440300 = "А что произошло?"
20044-200440310 = "Насчёт тренажёра, который я хотела."
20044-200440320 = "Мне удалось оплатить его сразу."
20044-200440330 = "Сразу?!"
20044-200440340 = "Да, Тренер."
20044-200440350 = "Приятно наслаждаться плодами собственного труда."
20044-200440360 = "С тренировками так же."
20044-200440370 = "Они утомляют тело, но приносят много пользы."
20044-200440380 = "Почему же люди так стараются избегать тренировок?"
20044-200440390 = "Н-не знаю..."
20044-200440400 = "Тренер."
20044-200440410 = "Что, по-твоему, самое важное в жизни?"
20044-200440420 = "Отдых!"
20044-200440430 = "Игры!"
20044-200440440 = "Отдых действительно важен."
20044-200440450 = "Тренировки без должного отдыха не только повышают риск травм,"
20044-200440460 = "но и мешают росту мышц."
20044-200440470 = "Игры, говорите...?"
20044-200440480 = "Возможно, это способ справляться со стрессом?"
20044-200440490 = "Верно... Если не контролировать стресс, он сильно вредит организму."
20044-200440500 = "Но для меня,"
20044-200440510 = "нет ничего важнее здоровья."
20044-200440520 = "Тренер."
20044-200440530 = "У вас есть минутка?"
20044-200440540 = "Конечно. Что случилось?"
20044-200440550 = "Управляющий со стадиона, где мы были в прошлый раз"
20044-200440560 = "связался со мной."
20044-200440570 = "И я хотела бы попросить вашего совета."
20044-200440580 = "Управляющий стадиона...? Ладно, иду."
20044-200440590 = "Уже иду!"
20044-200440600 = "Здравствуйте, Тренер."
20044-200440610 = "На этот раз проблем нет. Я просто хотела поздороваться."
20044-200440620 = "И ещё, если вам интересно, я хотела пригласить вас"
20044-200440630 = "размяться со мной в тренировочном центре."
20044-200440640 = "Конечно-конечно! Но сначала у нас чрезвычайная ситуация, Сумирэ!"
20044-200440650 = "Хм?"
20044-200440660 = "Никогда не видела, чтобы вы говорили с такой срочностью."
20044-200440670 = "По крайней мере, насколько я помню."
20044-200440680 = "Весь интернет говорит о тебе!"
20044-200440690 = "Обо мне...?"
20044-200440700 = "Что происходит?"
20044-200440710 = "Давай встретимся и поговорим!"
20044-200440720 = "Я также не припоминаю,"
20044-200440730 = "чтобы Тренер сам"
20044-200440740 = "инициировал встречу."
20044-200440750 = "В каком-то смысле для меня это памятное событие."
20044-200440760 = "Я даже немного его жду."
20044-200440770 = "Тогда скоро увидимся."
