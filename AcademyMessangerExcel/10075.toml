[translation]
10075-100750010 = "Se~n~se~i~"
10075-100750020 = "Me~ sa~l~va~!"
10075-100750030 = "Tenho um mau pressentimento..."
10075-100750040 = "Ei! Nada de falar em mau pressentimento!"
10075-100750050 = "Tem uma aluna bem aqui implorando pela ajuda do Sensei..."
10075-100750060 = "Não me diga que você pretende fingir que não viu?!"
10075-100750070 = "Brincadeira. O que aconteceu?"
10075-100750080 = "Qual é a emergência?"
10075-100750090 = "É um caso gravíssimo!! Não sai nada no papel!!!"
10075-100750100 = "O bloqueio criativo de sempre, né?"
10075-100750110 = "Errado! Pelo contrário, as ideias estão jorrando sem parar!"
10075-100750120 = "Só que desta vez surgiu outro problema, de ordem física..."
10075-100750130 = "O que houve?! Você se machucou?!"
10075-100750140 = "Não, não é nada disso..."
10075-100750150 = "É que a minha caneta quebrou..."
10075-100750160 = "...A caneta?"
10075-100750170 = "Já~ e~ra~"
10075-100750180 = "É~ o~ meu~ fi~m~~"
10075-100750190 = "É a Meru de sempre."
10075-100750200 = "Que frieza! Falando assim como se não tivesse nada a ver com você!"
10075-100750210 = "Me~ a~ju~da~ va~i~"
10075-100750220 = "É~ ho~ra~ da~ vin~gan~ça~"
10075-100750230 = "Que mensagem mais ameaçadora..."
10075-100750240 = "Aquele rancor de antes..."
10075-100750250 = "Achou mesmo que eu ia deixar barato~~~?!"
10075-100750260 = "Não sabia que você era do tipo rancorosa, Meru..."
10075-100750270 = "Eu não vou deixar passar em branco de jeito nenhum!"
10075-100750280 = "Não sossego enquanto não pagar uma dívida na mesma moeda! Essa sou eu, Himeki Meru!"
10075-100750290 = "Pode esperar..."
10075-100750300 = "Hoje sou eu que vou deixar você na palma da minha mão, Sensei!"
10075-100750310 = "Renasci das cinzas!"
10075-100750320 = "Que bom, fico feliz."
10075-100750330 = "Já falei pra parar de responder com esse desdém todo!"
10075-100750340 = "Até porque você também tem uma parcela de culpa pelo que aconteceu hoje, Sensei..."
10075-100750350 = "Eu?! Por quê?!"
10075-100750360 = "Se eu tô dizendo que tem, é porque tem!"
10075-100750370 = "Ei, Sensei,"
10075-100750380 = "por acaso você tá ocupado hoje também?"
10075-100750390 = "Slurp! Esse gosto... é o \"gosto\" de quem está querendo atenção, né?"
10075-100750400 = "Não vem me tratar como personagem carente que implora por atenção!"
10075-100750410 = "Que mania feia!"
10075-100750420 = "Quer dizer, bom... errado você não tá, mas..."
10075-100750430 = "Calhou de eu ter umas coisas para resolver em Red Winter hoje mesmo."
10075-100750440 = "Sério?"
10075-100750450 = "Então..."
10075-100750460 = "Só se sobrar um tempinho mesmo,"
10075-100750470 = "eu talvez ficasse feliz se você desse uma passada na Frente de Libertação do Conhecimento..."
10075-100750480 = "Ou talvez não seja que eu não deixaria de não ficar feliz!"
10075-100750490 = "Decide logo qual dos dois é..."
