[translation]
10075-100750010 = "ПОМОГИ!!"
10075-100750020 = "Помоги мне!"
10075-100750030 = "Звучит серьёзно..."
10075-100750040 = "Не называй меня серьёзной!"
10075-100750050 = "Сенсей, когда ты слышишь отчаянные мольбы своего студента,"
10075-100750060 = "ты ведь не отвернёшься от неё, правда?"
10075-100750070 = "Если так ставить вопрос..."
10075-100750080 = "В чём проблема, Мэру?"
10075-100750090 = "Я больше не могу рисовать!"
10075-100750100 = "А, у тебя «творческий блок»?"
10075-100750110 = "Нет! У меня полно идей! Под завязку!"
10075-100750120 = "Проблема... скорее физическая..."
10075-100750130 = "Ты повредила запястье?"
10075-100750140 = "Нет."
10075-100750150 = "Моё... перо планшета сломалось."
10075-100750160 = "О, и всё?"
10075-100750170 = "Я погибла!"
10075-100750180 = "Мне конец!"
10075-100750190 = "Старая добрая Мэру..."
10075-100750200 = "Это СЕРЬЁЗНО!!"
10075-100750210 = "ПОМОГИ!!"
10075-100750220 = "МЕСТЬ!!"
10075-100750230 = "Страшно..."
10075-100750240 = "У меня есть счёты, которые нужно свести!"
10075-100750250 = "Ты ведь не думал, что я забуду?"
10075-100750260 = "Хе-хе. Я вроде надеялся."
10075-100750270 = "Ни за что!"
10075-100750280 = "Я, Химэки Мэру, всегда возвращаю долги!"
10075-100750290 = "Вот увидишь, Сенсей."
10075-100750300 = "Сегодня я потащу тебя куда захочу."
10075-100750310 = "Я ЖИВА!"
10075-100750320 = "Рад это слышать."
10075-100750330 = "Не веди себя так отстранённо..."
10075-100750340 = "Ты частично виноват в том, что сегодня произошло."
10075-100750350 = "Что я опять сделал?!"
10075-100750360 = "Не отрицай!"
10075-100750370 = "Сенсей."
10075-100750380 = "Ты сегодня занят?"
10075-100750390 = "Похоже, кому-то нужно внимание..."
10075-100750400 = "Мне НЕ нравится, что ты подразумеваешь!"
10075-100750410 = "Я звучу так, будто мне не хватает внимания!"
10075-100750420 = "...Хотя ты не совсем неправ."
10075-100750430 = "Вообще-то мне нужно заглянуть в Академию Красная Зима."
10075-100750440 = "Правда?"
10075-100750450 = "В таком случае..."
10075-100750460 = "То есть ты не обязан, но..."
10075-100750470 = "Может, заглянешь во Фронт освобождения знаний..."
10075-100750480 = "Я была бы очень признательна..."
10075-100750490 = "А где это ещё раз?"
