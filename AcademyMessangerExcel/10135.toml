[translation]
10135-101350010 = "Сенсей."
10135-101350020 = "Что случилось, Кей-Кей?"
10135-101350030 = "Не называйте меня Кей-Кей."
10135-101350040 = "В любом случае."
10135-101350050 = "Как неуглеродному сознательному существу"
10135-101350060 = "положено снимать стресс?"
10135-101350070 = "Сразу начинаем с вопроса высокой сложности!"
10135-101350080 = "Полагаю, да."
10135-101350090 = "...Сама виновата, что чего-то от вас ожидала, Сенсей."
10135-101350100 = "Как жестоко..."
10135-101350110 = "Сенсей."
10135-101350120 = "Что случилось, Кей-Кей?"
10135-101350130 = "Не называйте меня Кей-Кей."
10135-101350140 = "В любом случае."
10135-101350150 = "Вы правда придёте?"
10135-101350160 = "Я же обещал тебе, Кей-Кей."
10135-101350170 = "Я прекрасно это знаю!"
10135-101350180 = "Но ПОЧЕМУ вам вообще нужно наблюдать за моим занятием?!"
10135-101350190 = "Я слежу за учебными успехами студента!"
10135-101350200 = "Это одна из моих обязанностей как учителя!"
10135-101350210 = "Вы вспоминаете об этом аргументе только когда вам удобно!"
10135-101350220 = "Почему-то"
10135-101350230 = "В итоге я"
10135-101350240 = "получаю... всякие приглашения..."
10135-101350250 = "Этот учитель так счастлив и горд."
10135-101350260 = "Ух."
10135-101350270 = "Тебя это правда так беспокоит?"
10135-101350280 = "Эм"
10135-101350290 = "Эм"
10135-101350300 = "Я"
10135-101350310 = "..."
10135-101350320 = "не ненавижу."
10135-101350330 = "Сен"
10135-101350340 = "ei"
10135-101350350 = "помоги"
10135-101350360 = "Что происходит?!"
10135-101350370 = "Просто"
10135-101350380 = "небольшая пробл"
10135-101350390 = "Нет,"
10135-101350400 = "серьёзно"
10135-101350410 = "Да что за"
10135-101350420 = "ЭТОТ БАГ"
10135-101350430 = "Баг?"
10135-101350440 = "ШТУКА."
10135-101350450 = "Хм."
10135-101350460 = "Погоди."
10135-101350470 = "Хм."
10135-101350480 = "Сенсей."
10135-101350490 = "Вы сейчас свободны."
10135-101350500 = "Приходите."
10135-101350510 = "Э-э-э? У меня сегодня полно дел..."
10135-101350520 = "Нет, не полно."
10135-101350530 = "Получить доступ к таким данным — детская задача."
10135-101350540 = "А как же личная конфиденциальность?!"
10135-101350550 = "Разве вы не говорите постоянно, что студенты для вас на первом месте?"
10135-101350560 = "А-А-А!!"
10135-101350570 = "А-а-а-а-а"
10135-101350580 = "Что такое?"
10135-101350590 = "НИЧЕГО не случилось."
10135-101350600 = "Но прошло всего три дня, а я снова убираю клубную комнату."
10135-101350610 = "Я устала."
10135-101350620 = "Убираешь клубную комнату?"
10135-101350630 = "Так надо."
10135-101350640 = "Я почти на месте. Зайду сама."
10135-101350650 = "Сегодня Кей — представитель студентов в Шале!!!"
10135-101350660 = "Уф, серьёзно."
10135-101350670 = "Я вернулась в общежитие..."
10135-101350680 = "Рад, что ты благополучно добралась."
10135-101350690 = "Да."
10135-101350700 = "А!"
10135-101350710 = "Что такое?"
10135-101350720 = "Я забыла сделать ежедневки!"
10135-101350730 = "А, ага, точно. Это важно."
