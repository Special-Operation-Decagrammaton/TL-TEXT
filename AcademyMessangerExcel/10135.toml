[translation]
10135-101350010 = "Sensei, tem um minuto?"
10135-101350020 = "O que foi, Kei-chan?"
10135-101350030 = "Não me chame de Kei-chan."
10135-101350040 = "Francamente... Deixando isso de lado,"
10135-101350050 = "para uma consciência que habita um receptáculo inorgânico,"
10135-101350060 = "qual seria o método mais adequado de aliviar o estresse?"
10135-101350070 = "Já chega fazendo uma pergunta difícil dessas..."
10135-101350080 = "Pois é."
10135-101350090 = "Fui tola de esperar alguma resposta útil de você, Sensei."
10135-101350100 = "Que maldade..."
10135-101350110 = "Sensei, você está falando sério?"
10135-101350120 = "Que foi, Kei-chan?"
10135-101350130 = "Já disse que não sou Kei-chan."
10135-101350140 = "Enfim,"
10135-101350150 = "você vem mesmo?"
10135-101350160 = "Eu prometi para a Kei-chan, não prometi?"
10135-101350170 = "Prometeu, mas...!"
10135-101350180 = "Por que faz tanta questão assim de vir assistir à minha aula?!"
10135-101350190 = "Acompanhar o desenvolvimento acadêmico das alunas"
10135-101350200 = "é o dever de todo professor, afinal."
10135-101350210 = "Você só fala bonito nessas horas, não é?!"
10135-101350220 = "Por algum motivo,"
10135-101350230 = "no fim das contas,"
10135-101350240 = "acabei recebendo convites de um monte de gente..."
10135-101350250 = "Fico muito feliz por você."
10135-101350260 = "Haa..."
10135-101350270 = "Achou tão ruim assim...?"
10135-101350280 = "Ugh"
10135-101350290 = "Não é isso..."
10135-101350300 = "Huum..."
10135-101350310 = "..."
10135-101350320 = "Não é que eu tenha achado ruim."
10135-101350330 = "Sense"
10135-101350340 = "So"
10135-101350350 = "corro"
10135-101350360 = "O que aconteceu?!"
10135-101350370 = "Tô"
10135-101350380 = "meio encrencad"
10135-101350390 = "Aaah"
10135-101350400 = "Qual é"
10135-101350410 = "Mas que droga"
10135-101350420 = "de bug é esse?"
10135-101350430 = "Bug?"
10135-101350440 = "Não é nada, estou falando sozinha."
10135-101350450 = "Hã?"
10135-101350460 = "Espere um instante."
10135-101350470 = "Huum..."
10135-101350480 = "Sensei,"
10135-101350490 = "você está livre agora, não está?"
10135-101350500 = "Venha até aqui rapidinho."
10135-101350510 = "Hã? Mas eu tenho compromissos..."
10135-101350520 = "Eu sei muito bem que não tem."
10135-101350530 = "Verificar a sua agenda é ridiculamente fácil para mim."
10135-101350540 = "E onde fica a minha privacidade?!"
10135-101350550 = "As alunas não são a sua prioridade número um?"
10135-101350560 = "Guh..."
10135-101350570 = "Haaaa..."
10135-101350580 = "O que houve?"
10135-101350590 = "Nada."
10135-101350600 = "Só estou desanimada ao pensar que não faz nem três dias"
10135-101350610 = "e já vou ter que limpar a sala do clube tudo de novo."
10135-101350620 = "Limpar?"
10135-101350630 = "Deixa pra lá, coisas aqui do clube."
10135-101350640 = "Estou aqui na frente da SCHALE."
10135-101350650 = "A plantonista de hoje é a Kei-chan!!"
10135-101350660 = "Haa, francamente..."
10135-101350670 = "Cheguei no dormitório."
10135-101350680 = "Que bom que chegou bem."
10135-101350690 = "Sim."
10135-101350700 = "Ah!"
10135-101350710 = "Esqueceu alguma coisa?"
10135-101350720 = "Esqueci de fazer as missões diárias do jogo!"
10135-101350730 = "Ah, sim... Isso realmente é muito importante."
