[translation]
10135-101350010 = "Сенсей, можно вас на минуту?"
10135-101350020 = "Что случилось, Кей?"
10135-101350030 = "Я не Кей."
10135-101350040 = "Ну вот... ладно, неважно."
10135-101350050 = "Как сознанию, обитающему в неодушевлённом объекте,"
10135-101350060 = "следует снимать стресс?"
10135-101350070 = "Ты задаёшь сложные вопросы с ходу..."
10135-101350080 = "Вот именно."
10135-101350090 = "Глупо было рассчитывать на вас."
10135-101350100 = "Как жестоко..."
10135-101350110 = "Сенсей, вы серьёзно?"
10135-101350120 = "Что случилось, Кей?"
10135-101350130 = "Я не Кей."
10135-101350140 = "Но неважно."
10135-101350150 = "Вы правда придёте?"
10135-101350160 = "Я же обещал Кей."
10135-101350170 = "Обещали, да!"
10135-101350180 = "Зачем вам вообще смотреть на занятия!?"
10135-101350190 = "Наблюдать за успеваемостью учеников"
10135-101350200 = "— это долг учителя."
10135-101350210 = "Вы всегда в таких случаях говорите правильные вещи!"
10135-101350220 = "Что-то я"
10135-101350230 = "в итоге"
10135-101350240 = "получила приглашения от многих людей..."
10135-101350250 = "Я рад."
10135-101350260 = "Уф..."
10135-101350270 = "Тебе так не нравится...?"
10135-101350280 = "Ой"
10135-101350290 = "Нет"
10135-101350300 = "Ну-у"
10135-101350310 = "..."
10135-101350320 = "Мне не то чтобы не нравится."
10135-101350330 = "Се-ен-сей"
10135-101350340 = "По"
10135-101350350 = "Спасите"
10135-101350360 = "Что случилось!?"
10135-101350370 = "Сейчас"
10135-101350380 = "Немного проблем"
10135-101350390 = "А"
10135-101350400 = "Да ну"
10135-101350410 = "Что это"
10135-101350420 = "за баг"
10135-101350430 = "Баг?"
10135-101350440 = "Я не вам."
10135-101350450 = "Хм?"
10135-101350460 = "Подождите"
10135-101350470 = "М-м"
10135-101350480 = "Сенсей"
10135-101350490 = "Вы ведь сейчас свободны?"
10135-101350500 = "Подойдите-ка."
10135-101350510 = "Э? У меня планы..."
10135-101350520 = "Я знаю, что их нет."
10135-101350530 = "Мне несложно это выяснить."
10135-101350540 = "А моя личная жизнь!?"
10135-101350550 = "Разве ученики не на первом месте?"
10135-101350560 = "Кх..."
10135-101350570 = "Уф..."
10135-101350580 = "Что случилось?"
10135-101350590 = "Нет."
10135-101350600 = "Просто я подумала, что снова нужно убирать комнату, хотя и трёх дней не прошло,"
10135-101350610 = "и мне стало тоскливо."
10135-101350620 = "Уборка?"
10135-101350630 = "Да, так, неважно."
10135-101350640 = "Я пришла к Шале."
10135-101350650 = "Сегодня дежурит Кей!!"
10135-101350660 = "Уф, ну вот опять..."
10135-101350670 = "Я добралась до общежития."
10135-101350680 = "Хорошо."
10135-101350690 = "Да."
10135-101350700 = "А!"
10135-101350710 = "Что случилось?"
10135-101350720 = "Я забыла сделать ежедневку!"
10135-101350730 = "А, ну да... это важно."