[translation]
10018-100180010 = "Где вы проводите свободное время, Сенсей?"
10018-100180020 = "В общежитии Шале."
10018-100180030 = "В ванной."
10018-100180040 = "Понятно. В общежитии Шале много мест для отдыха."
10018-100180050 = "...Там немного влажно, но, наверное, не так уж плохо."
10018-100180060 = "А я... люблю тёмные, укромные места, где почти нет людей."
10018-100180070 = "Тихое место для отдыха, где никто не потревожит..."
10018-100180080 = "Там я чувствую покой и могу оставаться сколько захочу."
10018-100180090 = "Пожалуйста, в следующий раз найдите другой шкаф, Сенсей."
10018-100180100 = "Шкаф Клуба разработки игр принадлежит мне."
10018-100180110 = "Мне нравится твой шкаф."
10018-100180120 = "Я знаю, но..."
10018-100180130 = "Нет значит нет."
10018-100180140 = "Какие игры вам нравятся, Сенсей?"
10018-100180150 = "Мне нравятся консольные игры."
10018-100180160 = "Мне нравятся аркадные игры."
10018-100180170 = "Мне нравятся почти все игры,"
10018-100180180 = "но я не очень люблю онлайн-игры, где нужно сотрудничать с другими людьми..."
10018-100180190 = "Мне не нравится, что там приходится разговаривать с людьми."
10018-100180200 = "Но файтинги я всё равно люблю."
10018-100180210 = "Файтинги?"
10018-100180220 = "Да. Чтобы играть в них, ни с кем разговаривать не нужно."
10018-100180230 = "Один из моих любимых разработчиков игр делает новый файтинг, так что я очень его жду."
10018-100180240 = "Не могу представить тебя за такой игрой, Юзу."
10018-100180250 = "Правда? Не знаю..."
10018-100180260 = "Когда я была маленькой, я даже не представляла, сколько денег стоит разработка игры."
10018-100180270 = "Когда я делала прошлую игру, мне не хватило денег на обслуживание серверов..."
10018-100180280 = "Иногда игроки теряли данные прямо посреди игры..."
10018-100180290 = "(ﾟﾛﾟ;) Какой кошмар. И что ты сделала?"
10018-100180300 = "К счастью, у меня была резервная копия, так что все данные мы не потеряли."
10018-100180310 = "Но всё равно четыре дня работы просто пропали."
10018-100180320 = "Мир разработки игр звучит жестоко."
10018-100180330 = "Так и есть..."
10018-100180340 = "Когда мы начали работать над следующей игрой, мы заранее накопили достаточно денег,"
10018-100180350 = "чтобы не повторить ту же ошибку."
10018-100180360 = "Моя прошлая подработка была кошмаром."
10018-100180370 = "Стоило мне оказаться перед покупателем, как я замирала и делала миллион ошибок..."
10018-100180380 = "Менеджер говорил, что всё нормально, но я знаю, что разочаровала его."
10018-100180390 = "Почему бы не попробовать другую подработку?"
10018-100180400 = "А? Другую подработку?"
10018-100180410 = "Не могу! Я и с работой в магазине едва справилась..."
10018-100180420 = "Всё нормально. На этой работе даже не нужно встречаться с людьми лично."
10018-100180430 = "Работа, где не нужно видеть людей...?"
10018-100180440 = "Звучит неплохо..."
10018-100180450 = "Я получила свою первую зарплату, Сенсей!"
10018-100180460 = "Мне заплатили гораздо больше, чем я ожидала, так что на оставшиеся деньги я купила подарки членам клуба."
10018-100180470 = "('◡') Здорово. Поздравляю!"
10018-100180480 = "Эм... Если у вас есть время на выходных, хотите заглянуть ко мне в парк развлечений, где я работаю?"
10018-100180490 = "В парк развлечений? Зачем?"
10018-100180500 = "Я хочу кое-что вам отдать..."
10018-100180510 = "Тебе не нужно дарить мне подарок."
10018-100180520 = "Нет, я правда хочу быть с вами..."
10018-100180530 = "То есть..."
10018-100180540 = "Я хочу подарить вам подарок!"
10018-100180550 = "Так что, пожалуйста, приходите в парк развлечений на выходных!"
10018-100180570 = "Ты возвращаешь мне билет, который я тебе дал...?"
10018-100180580 = "Вы хотите, чтобы я что-нибудь сделала, Сенсей?"
10018-100180590 = "Купи мне хлеб и молоко по дороге в Шале."
10018-100180600 = "Я знаю, что сказала «что угодно», но не тратьте свободный пропуск на такую мелочь!"
10018-100180610 = "Я могу сделать это для вас и без пропуска!"
10018-100180620 = "Часто бывает, что потерянные вещи"
10018-100180630 = "в итоге находятся"
10018-100180640 = "в самых странных местах, да?"
10018-100180650 = "Явление, знакомое многим..."
10018-100180660 = "Особенно с пультами..."
10018-100180670 = "Если честно,"
10018-100180680 = "наверное, я просто забыла,"
10018-100180690 = "куда его положила..."
10018-100180700 = "Но точно"
10018-100180710 = "не только у меня так бывает."
10018-100180720 = "Наверное, отсюда и появились старые истории"
10018-100180730 = "о воришках-феях и других проказниках,"
10018-100180740 = "которые крадут вещи."
10018-100180750 = "Забавный факт."
10018-100180760 = "Так что моё лучшее предположение —"
10018-100180770 = "вы что-то потеряли?"
10018-100180780 = "Нет."
10018-100180790 = "...Ну, может, и потеряла?"
10018-100180800 = "А может, и нет..."
