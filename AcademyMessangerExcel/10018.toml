[translation]
10018-100180010 = "Где вы обычно проводите время на отдыхе, Сенсей?"
10018-100180020 = "Обычно в Шале."
10018-100180030 = "Обычно в туалете."
10018-100180040 = "Действительно, в Шале много мест, подходящих для отдыха."
10018-100180050 = "Н-ну, это... но, наверное, я понимаю. Неплохо, правда."
10018-100180060 = "Я... люблю тёмные места, где никто не ходит и есть тень."
10018-100180070 = "Пространство для отдыха, где никто не мешает, только моё..."
10018-100180080 = "В таких местах я могу оставаться бесконечно."
10018-100180090 = "Сенсей, если бы вы в следующий раз поискали другой шкафчик..."
10018-100180100 = "В клубе разработки игр у меня личный шкафчик..."
10018-100180110 = "А вместе пользоваться нельзя?"
10018-100180120 = "Н-но даже если вы так говорите, нас туда двоих не поместится..."
10018-100180130 = "Нельзя — значит нельзя."
10018-100180140 = "Сенсей, какие игры вы любите?"
10018-100180150 = "Наверное, консольные игры."
10018-100180160 = "Наверное, аркадные игры."
10018-100180170 = "А, понятно. Я... люблю почти все игры."
10018-100180180 = "Но вот онлайн-игры, где нужно играть с другими, немного..."
10018-100180190 = "Я чувствую давление... поэтому не играю."
10018-100180200 = "Ах, но я часто играю в файтинги."
10018-100180210 = "Правда?"
10018-100180220 = "Да, игры такого типа мне не слишком сложны."
10018-100180230 = "Говорят, скоро выйдет новый файтинг от компании, которую я люблю, я жду."
10018-100180240 = "Юдзу и файтинги — как-то неожиданно."
10018-100180250 = "П-правда...?"
10018-100180260 = "Разработка игр требует больших денег, правда..."
10018-100180270 = "В прошлый раз не хватило денег на содержание серверов,"
10018-100180280 = "и даже были случаи, когда данные терялись в процессе..."
10018-100180290 = "(ﾟﾛﾟ;) Это серьёзно... Что в итоге?"
10018-100180300 = "К счастью, у нас были резервные копии, так что мы восстановили, но..."
10018-100180310 = "4 дня работы пропали даром..."
10018-100180320 = "Мир разработки игр тяжёл..."
10018-100180330 = "Да..."
10018-100180340 = "Чтобы не повторять те же ошибки при разработке следующей игры,"
10018-100180350 = "нужно заранее собрать средства на разработку."
10018-100180360 = "На прошлой подработке я наделала ошибок..."
10018-100180370 = "Я несколько раз замирала перед клиентами, и ошибки шли одна за другой..."
10018-100180380 = "Менеджер сказал, что всё в порядке, но..."
10018-100180390 = "Тогда не хочешь попробовать другую подработку?"
10018-100180400 = "А? Другую подработку...?"
10018-100180410 = "Н-невозможно! Даже прошлая подработка в магазине была на пределе..."
10018-100180420 = "Всё в порядке. Эта работа не требует смотреть людям в лицо."
10018-100180430 = "А, есть такая работа..."
10018-100180440 = "Тогда, возможно, всё будет хорошо..."
10018-100180450 = "Сенсей, я получила зарплату за эту подработку!"
10018-100180460 = "Сумма оказалась больше, чем я ожидала, так что я смогла сделать подарки всем членам клуба."
10018-100180470 = "('‿') Отлично, молодец!"
10018-100180480 = "И вот, э-то... если вы не против, не могли бы вы прийти в эти выходные в тот парк аттракционов?"
10018-100180490 = "В парк аттракционов?"
10018-100180500 = "Ну... у меня есть подарок, который я хотела бы вам вручить."
10018-100180510 = "Мне достаточно одной мысли."
10018-100180520 = "Нет, я хочу с вами..."
10018-100180530 = "Не то, но и это тоже, э-то..."
10018-100180540 = "Я очень хочу вручить вам подарок!"
10018-100180550 = "Так что приходите в парк аттракционов в эти выходные! Пожалуйста!"
10018-100180570 = "Я и не думала, что безлимитный пропуск вернётся так быстро."
10018-100180580 = "Желание... определились?"
10018-100180590 = "Не могла бы ты приносить хлеб и молоко, когда идёшь в Шале?"
10018-100180600 = "Я, конечно, сказала «что угодно», но не используйте такой дорогой пропуск для этого...!"
10018-100180610 = "Если бы вы просто сказали, я бы купила!"
10018-100180620 = "Потерянные вещи..."
10018-100180630 = "в результате поисков"
10018-100180640 = "оказываются в неожиданных местах..."
10018-100180650 = "Понимаю!"
10018-100180660 = "Пульт, например..."
10018-100180670 = "На самом деле"
10018-100180680 = "просто забыли, куда положили."
10018-100180690 = "Но..."
10018-100180700 = "Наверное, потому что у всех такой опыт."
10018-100180710 = "В старые времена в таких случаях"
10018-100180720 = "говорили, что это «шаловливые феи»"
10018-100180730 = "украли это."
10018-100180740 = "Так думали."
10018-100180750 = "Интересная история."
10018-100180760 = "Может быть..."
10018-100180770 = "Ты что-то потеряла?"
10018-100180780 = "Н-нет."
10018-100180790 = "Я ничего не забыла."
10018-100180800 = "...Наверное."
