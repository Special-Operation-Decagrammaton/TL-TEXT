[translation]
10018-100180010 = "Sensei, quando você tira uma pausa para descansar, onde costuma ficar?"
10018-100180020 = "Geralmente pela Schale mesmo."
10018-100180030 = "Geralmente no banheiro."
10018-100180040 = "É verdade, a Schale tem vários cantinhos ótimos para descansar, né?"
10018-100180050 = "A-Ah... mas acho que consigo entender um pouquinho. Não é um lugar ruim, né?"
10018-100180060 = "Eu... gosto de lugares escurinhos, na sombra e onde não passa ninguém."
10018-100180070 = "Um refúgio só meu, onde ninguém possa me incomodar..."
10018-100180080 = "Em um lugar assim, sinto que eu poderia ficar para sempre."
10018-100180090 = "Sensei, da próxima vez acho melhor você procurar um outro armário..."
10018-100180100 = "Porque aquele do Clube de Desenvolvimento de Jogos é o meu armário exclusivo..."
10018-100180110 = "Não dá pra gente dividir o mesmo?"
10018-100180120 = "M-Mesmo que você peça isso, não cabem duas pessoas lá dentro..."
10018-100180130 = "O que não dá, não dá mesmo."
10018-100180140 = "Sensei, que tipo de jogos você mais gosta?"
10018-100180150 = "Gosto mais de jogos de console."
10018-100180160 = "Gosto mais de jogos de fliperama."
10018-100180170 = "Ah, entendi. Eu... tratando-se de jogos, gosto de quase todos os gêneros."
10018-100180180 = "Só que jogos online, em que a gente precisa jogar com outras pessoas, são meio..."
10018-100180190 = "Acabo sentindo muita pressão... então quase não jogo."
10018-100180200 = "Ah, mas jogos de luta competitivos eu jogo bastante!"
10018-100180210 = "Sério?"
10018-100180220 = "Sim, com esse estilo de jogo eu não tenho tanta dificuldade."
10018-100180230 = "Aliás, uma produtora que eu adoro vai lançar um jogo de luta novo em breve, estou super ansiosa."
10018-100180240 = "A Yuzu mandando ver em jogo de luta é uma combinação bem surpreendente."
10018-100180250 = "V-Você acha...?"
10018-100180260 = "Desenvolver um jogo exige tanto dinheiro, né..."
10018-100180270 = "No nosso último projeto, faltou verba para manter o servidor funcionando"
10018-100180280 = "e chegamos a perder os dados no meio do desenvolvimento..."
10018-100180290 = "(ﾟﾛﾟ;) Que desespero... e o que aconteceu no fim?"
10018-100180300 = "Felizmente tínhamos um backup salvo e conseguimos recuperar quase tudo, mas..."
10018-100180310 = "Quatro dias inteiros de trabalho foram por água abaixo..."
10018-100180320 = "O mundo do desenvolvimento de jogos é puxado mesmo, né..."
10018-100180330 = "Pois é..."
10018-100180340 = "Para não repetirmos o mesmo erro no nosso próximo jogo,"
10018-100180350 = "precisamos juntar a verba de desenvolvimento com antecedência."
10018-100180360 = "Naquele trabalho de meio período do outro dia, acabei me atrapalhando toda..."
10018-100180370 = "Travei várias vezes na frente dos clientes e cometi um erro atrás do outro..."
10018-100180380 = "O gerente foi gentil e disse que estava tudo bem, mas..."
10018-100180390 = "Então que tal tentar um trabalho de meio período diferente da próxima vez?"
10018-100180400 = "Hã? Outro trabalho de meio período...?"
10018-100180410 = "N-Não consigo! Até naquele bico na loja de conveniência eu já sobrevivi por um triz..."
10018-100180420 = "Relaxa. Nesse próximo trabalho você não precisa encarar o rosto das pessoas diretamente."
10018-100180430 = "Hã? Existe um trabalho assim...?"
10018-100180440 = "Se for assim, talvez eu consiga dar conta..."
10018-100180450 = "Sensei, recebi o pagamento deste mês do meu trabalho de meio período!"
10018-100180460 = "Veio mais do que eu esperava, então com o que sobrou consegui até comprar presentes para as meninas do clube!"
10018-100180470 = "('‿') Que maravilha! Bom trabalho!"
10018-100180480 = "Então, hum... se você estiver livre neste fim de semana, poderia ir até aquele parque de diversões?"
10018-100180490 = "Ao parque de diversões?"
10018-100180500 = "É que... eu também tenho um presente que queria entregar para você, Sensei."
10018-100180510 = "Só a sua intenção já me deixa super feliz."
10018-100180520 = "Não, é que eu queria ir com você, Sensei..."
10018-100180530 = "Quer dizer, isso também, mas, hum..."
10018-100180540 = "Eu faço muita questão de entregar o presente para você, Sensei!"
10018-100180550 = "Então, por favor, venha ao parque de diversões neste fim de semana! Por favor!"
10018-100180570 = "Não achei que o passe livre fosse voltar para as minhas mãos tão rápido."
10018-100180580 = "Você já decidiu... o que vai querer pedir?"
10018-100180590 = "Quando vier para a Schale, pode comprar pão e leite no caminho pra mim?"
10018-100180600 = "Eu sei que disse \"qualquer coisa\", mas não gaste um passe livre tão especial com uma coisa dessas...!"
10018-100180610 = "Se for só isso, é só me pedir normalmente que eu compro pra você com o maior prazer!"
10018-100180620 = "Sabe quando a gente perde alguma coisa,"
10018-100180630 = "procura por tudo quanto é canto"
10018-100180640 = "e acaba achando no lugar mais improvável...?"
10018-100180650 = "Entendo demais!"
10018-100180660 = "Tipo o controle remoto, né..."
10018-100180670 = "Na prática,"
10018-100180680 = "a gente só esqueceu onde colocou mesmo,"
10018-100180690 = "mas..."
10018-100180700 = "Como todo mundo passa por isso,"
10018-100180710 = "dizem que antigamente, quando isso acontecia,"
10018-100180720 = "as pessoas achavam que tinha sido roubado por uma"
10018-100180730 = "\"fadinha travessa\"..."
10018-100180740 = "Pelo menos é o que contam."
10018-100180750 = "Que história curiosa!"
10018-100180760 = "Espera aí, por acaso..."
10018-100180770 = "Você perdeu alguma coisa, Yuzu?"
10018-100180780 = "N-Não!"
10018-100180790 = "Não esqueci onde botei nada, não!"
10018-100180800 = "...Eu acho."
