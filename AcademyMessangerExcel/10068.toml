10068-100680160 = "Se divertiu?"
10068-100680170 = "Sim!!"
10068-100680180 = "Muito mesmo!!!"
10068-100680190 = "Como posso dizer, hum..."
10068-100680200 = "Fiquei pensando por que será que eu estava esquentando tanto a cabeça com aquilo!"
10068-100680210 = "Eu devia ter pedido conselho para você muito antes, Sensei!"
10068-100680220 = "É como dizem: na prática é muito mais fácil do que ficar só se preocupando!"
10068-100680230 = "Muito, muito obrigada mesmo!!!!"
10068-100680240 = "Sensei!"
10068-100680250 = "Se possível, você poderia atender a um pedido meu?!"
10068-100680260 = "Claro, mas do que se trata?"
10068-100680270 = "Um pedido...?"
10068-100680280 = "Hum..."
10068-100680290 = "Pensei que você deve entender bastante de métodos para recuperar o cansaço, Sensei!"
10068-100680300 = "...Recuperar o cansaço?"
10068-100680310 = "Sim!"
10068-100680320 = "Por favor, me ensine o segredo!"
10068-100680330 = "Uaaaah!! Mil desculpas!!!"
10068-100680340 = "Eu acabei pegando no sono aí na Schale!! Quando dei por mim, já estava tudo escuro lá fora?!"
10068-100680350 = "Me desculpe por não ter me despedido direitinho!!"
10068-100680360 = "Não precisa se preocupar com isso."
10068-100680370 = "Conseguiu descansar um pouco o corpo?"
10068-100680380 = "Sim!!!"
10068-100680390 = "Ah..."
10068-100680400 = "Hum... quando conversei direitinho com todo mundo, tudo se resolveu super fácil!"
10068-100680410 = "Agora tanto a diversão quanto a patrulha estão garantidas!"
10068-100680420 = "Perfeito!!!"
10068-100680430 = "Muito, muito obrigada mesmo!!!"
10068-100680440 = "Sensei! Bom trabalho hoje!!"
10068-100680450 = "Você poderia deixar um dia livre na sua agenda para mim em breve?!"
10068-100680460 = "Claro que sim."
10068-100680470 = "Que bom ver você tão animada."
10068-100680480 = "Ahaha!"
10068-100680490 = "Você está sempre fazendo tanta coisa por mim, Sensei!!"
10068-100680500 = "Desta vez! Eu quero! Retribuir! O favor! A você, Sensei!!"
10068-100680510 = "Vou proporcionar um dia incrivelmente maravilhoso para você!! Pode esperar ansioso!"
10068-100680520 = "Boa noite, Sensei..."
10068-100680530 = "Não é novidade, mas...\nA patrulha da madrugada é uma verdadeira batalha contra o sono..."
10068-100680540 = "Ué, a uma hora dessas?"
10068-100680550 = "Aconteceu algum problema?"
10068-100680560 = "Ah!!!"
10068-100680570 = "Não, nenhum problema em especial... pelo menos por enquanto."
10068-100680580 = "Mas, como membra do Corpo de Vigilantes, preciso estar pronta para qualquer imprevisto!!"
10068-100680590 = "Se você ainda estiver trabalhando, Sensei, trate de ir descansar logo também!"
10068-100680600 = "Boa noite!!"
10068-100680610 = "Aaaah!!"
10068-100680620 = "Acabei dando trabalho para você de novo, Sensei...!!"
10068-100680630 = "Não achei trabalho nenhum, fique tranquila."
10068-100680640 = "Fiquei preocupado achando que você podia ter pegado um resfriado, mas que bom que está bem."
10068-100680650 = "Ahaha... Muito obrigada!"
10068-100680660 = "Eu me diverti muito passando esse tempo com você, Sensei!"
10068-100680670 = "Tanto a lua quanto o sol que vimos juntos..."
10068-100680680 = "Estavam lindos demais!!"
10068-100680690 = "Se eu estivesse sozinha, tenho certeza de que nem teria reparado."
10068-100680700 = "Sensei..."
10068-100680710 = "Muito obrigada mesmo."
