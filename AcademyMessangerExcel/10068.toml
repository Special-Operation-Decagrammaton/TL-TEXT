10068-100680450 = "Можно попросить вас освободить время в следующий раз!!"
10068-100680460 = "Конечно."
10068-100680470 = "Рад, что ты выглядишь бодрой."
10068-100680480 = "Аха-ха!"
10068-100680490 = "Вы всегда столько для меня делаете!!"
10068-100680500 = "Теперь я хочу! вас! отблагодарить!!"
10068-100680510 = "Я сделаю этот день незабываемым!! Ждите с нетерпением!"
10068-100680520 = "Добрый вечер, Сенсей..."
10068-100680530 = "Как обычно... ночной патруль — это борьба со сном..."
10068-100680540 = "Эй, в такое время?"
10068-100680550 = "Что-то случилось?"
10068-100680560 = "Ах!!!"
10068-100680570 = "Нет, проблем особо нет... пока что."
10068-100680580 = "Но как члену Целевой группы по вопросам правосудия, я должна быть готова к любым неожиданностям!!"
10068-100680590 = "Сенсей, если вы ещё работаете, уже пора отдохнуть!"
