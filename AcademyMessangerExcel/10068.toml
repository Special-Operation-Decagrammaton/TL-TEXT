[translation]
10068-100680010 = "Bom dia, Sensei!"
10068-100680020 = "Uzawa Reisa se apresentando!"
10068-100680030 = "Bom dia, Reisa."
10068-100680040 = "O que houve?"
10068-100680050 = "Ah"
10068-100680060 = "Huum..."
10068-100680070 = "Não aconteceu nada em especial, eu só queria dar um oi mesmo..."
10068-100680080 = "Como você disse que eu podia mandar mensagem a qualquer hora..."
10068-100680090 = "Er..."
10068-100680100 = "Peço perdão pelo incômodo!!!!!!!!!!!"
10068-100680110 = "Sensei!! Bom trabalho hoje!!"
10068-100680120 = "Aqui é a Reisa!!"
10068-100680140 = "Tcharãããn! Eu consegui!!!"
