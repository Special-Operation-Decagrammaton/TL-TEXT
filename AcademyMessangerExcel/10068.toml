10068-100680320 = "Пожалуйста, научите меня!"
10068-100680330 = "Ой-ой-ой!! Простите!!!"
10068-100680340 = "Я уснула в Шале!! Когда очнулась, на улице уже было темно!?"
10068-100680350 = "Простите, что не попрощалась как следует!!"
10068-100680360 = "Не волнуйтесь, всё в порядке."
10068-100680370 = "Хоть немного отдохнули?"
10068-100680380 = "Да!!!"
10068-100680390 = "Ах..."
10068-100680400 = "Ну... когда я всё объяснила, проблема решилась сама собой!"
10068-100680410 = "Теперь и игры, и патрулирование будут в порядке!"
10068-100680420 = "Идеально!!!"
10068-100680430 = "Спасибо вам огромное-преогромное!!!"
