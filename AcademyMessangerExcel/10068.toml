[translation]
10068-100680010 = "Здравствуйте, Сенсей!"
10068-100680020 = "Это я, Удзава Рейса!"
10068-100680030 = "Привет, Рейса."
10068-100680040 = "О. Рейса. Что такое?"
10068-100680050 = "О!"
10068-100680060 = "Эм. Э-э."
10068-100680070 = "Вообще-то всё."
10068-100680080 = "Ты сказал, что я могу писать тебе о чём угодно..."
10068-100680090 = "Эм-м..."
10068-100680100 = "Прости!!"
10068-100680110 = "Сенсей!"
10068-100680120 = "Это я, Рейса!"
10068-100680140 = "Дан-дан-дан... Та-дам!!"
10068-100680150 = "Ха-ха."
10068-100680160 = "Похоже, ты хорошо провела время."
10068-100680170 = "Ага!"
10068-100680180 = "Даже лучше, чем ожидала!"
10068-100680190 = "Потому что, ну..."
10068-100680200 = "Всё прошло так хорошо! На самом деле настолько гладко, что мне даже неловко, что я вообще волновалась."
10068-100680210 = "Типа, я одна вообще переживала?"
10068-100680220 = "Ладно! Неважно."
10068-100680230 = "Спасибо!!"
10068-100680240 = "Сенсей!"
10068-100680250 = "Можно кое-что спросить? Можно?"
10068-100680260 = "Хм? Рейса?"
10068-100680270 = "Что ты хотела спросить?"
10068-100680280 = "Так вот, эм..."
10068-100680290 = "Я подумала, что ты наверняка много знаешь о том, как восстанавливаться после усталости!"
10068-100680300 = "...Восстанавливаться после усталости?"
10068-100680310 = "Пожалуйста!"
10068-100680320 = "Пожалуйста, научи меня, как ты это делаешь!"
10068-100680330 = "У-у-у-у!"
10068-100680340 = "Я заснула! Заснула прямо здесь!"
10068-100680350 = "Прости, что торопилась и не успела попрощаться!"
10068-100680360 = "Всё в порядке."
10068-100680370 = "Я просто рад, что ты отдохнула."
10068-100680380 = "Да!"
10068-100680390 = "О!"
10068-100680400 = "И я уже поговорила с друзьями из Отряда вигилантов! И никаких проблем вообще не было."
10068-100680410 = "Мы составили целое расписание патрулей и выходных."
10068-100680420 = "И оно идеальное!"
10068-100680430 = "Спасибо!"
10068-100680440 = "Сенсей!"
10068-100680450 = "Эй! Ты позже свободен? Что скажешь?"
10068-100680460 = "Конечно."
10068-100680470 = "Ты полна энергии."
10068-100680480 = "Ха-ха-ха!"
10068-100680490 = "Потому что! До сих пор только я что-то получала от тебя. Но!"
10068-100680500 = "Теперь всё изменится! В этот раз всё за мой счёт!"
10068-100680510 = "Будет супер-пупер особенное!"
10068-100680520 = "Каждый раз..."
10068-100680530 = "Каждый ночной патруль — эпическая битва. Битва со сном. Нужно не уснуть!"
10068-100680540 = "Правда? Так поздно?"
10068-100680550 = "Думаешь, что-то случится?"
10068-100680560 = "О..."
10068-100680570 = "Нет, не особо! То есть шанс совсем маленький. Наверное, всё будет нормально!"
10068-100680580 = "Но никогда-никогда нельзя быть уверенной!"
10068-100680590 = "В общем, удачи с тем, чем ты сегодня ночью занимаешься."
10068-100680600 = "Спокойной ночи!"
10068-100680610 = "А-а-а-ах!"
10068-100680620 = "Как только пришла в себя, поняла... Я была такой обузой!"
10068-100680630 = "Ты вовсе не обуза."
10068-100680640 = "Я просто рад, что ты не простудилась."
10068-100680650 = "Ха-ха!"
10068-100680660 = "Ага! Здорова как бык! Благодаря тебе, Сенсей!"
10068-100680670 = "И ещё я заметила... Луна, которую мы видели на патруле, и утреннее солнце..."
10068-100680680 = "Они были такими красивыми!"
10068-100680690 = "И если бы я была одна, я бы даже не подумала об этом!"
10068-100680700 = "Сенсей."
10068-100680710 = "Спасибо."
