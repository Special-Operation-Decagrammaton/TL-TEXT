10068-100680200 = "Я подумала, зачем же я так переживала!"
10068-100680210 = "Нужно было раньше с вами посоветоваться!"
10068-100680220 = "Всё оказывается проще, чем кажется!"
10068-100680230 = "Спасибо вам огромное-преогромное!!!!"
10068-100680240 = "Сенсей!"
