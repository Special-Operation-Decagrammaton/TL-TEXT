[translation]
16019-160190010 = "Доброе утро, Сенсей."
16019-160190020 = "Доброе утро... или сейчас всё ещё ночь?"
16019-160190030 = "Учитывая обстоятельства..."
16019-160190040 = "Верно..."
16019-160190050 = "Тогда я буду ждать."
16019-160190060 = "Асума Токи вернулась с патруля."
16019-160190070 = "Я немедленно навещу вас, чтобы представить отчёт."
16019-160190080 = "Вы нигде не ранены?"
16019-160190090 = "Спасибо за заботу."
16019-160190100 = "Но, как обычно, я была и идеальна, и в полном порядке. Идеально в полном порядке."
16019-160190110 = "Сенсей"
16019-160190120 = "Что вы думаете о концепции «улучшения»?"
16019-160190130 = "То, что нажимаешь, когда фармишь бесплатные ресурсы?"
16019-160190140 = "То, что необходимо даже ценой других удобств?"
16019-160190150 = "Понятно."
16019-160190160 = "Предполагаю, вы говорите в контексте видеоигр."
16019-160190170 = "Значит, ваше внимание сосредоточено на управлении ресурсами."
16019-160190180 = "Понятно."
16019-160190190 = "Уверена, вы говорите в контексте видеоигр."
16019-160190200 = "Я размышляла в похожем направлении."
16019-160190210 = "Понимаешь..."
16019-160190220 = "Мне нужно обсудить с вами кое-что касательно улучшений."
16019-160190230 = "Пожалуйста, свяжитесь со мной, когда встанете."
16019-160190240 = "Я вернулась с утреннего патруля."
16019-160190250 = "...?"
16019-160190260 = "Солнце ещё даже не взошло..."
16019-160190270 = "Да. Именно."
16019-160190280 = "Сегодня снова был суматошный день."
16019-160190290 = "Сейчас ещё только полдень..."
16019-160190300 = "Да. Верно..."
16019-160190310 = "И ещё. Насчёт последнего мгновения мира."
16019-160190320 = "Я не отказалась от этой идеи."
16019-160190330 = "...А?"
16019-160190340 = "Пожалуйста, помните:"
16019-160190350 = "рядом с вами всегда будет"
16019-160190360 = "идеальная горничная и идеальный агент разведки,"
16019-160190370 = "Асума Токи."
