[translation]
16019-160190010 = "Доброе утро."
16019-160190020 = "Доброе утро... хотя для этого немного рановато..."
16019-160190030 = "Но обстоятельства обязывают."
16019-160190040 = "Это верно..."
16019-160190050 = "Тогда я буду ждать."
16019-160190060 = "Токи только что завершила разведку и вернулась."
16019-160190070 = "Позже явлюсь с докладом."
16019-160190080 = "Ранений не было?"
16019-160190090 = "Спасибо за беспокойство."
16019-160190100 = "К счастью, сегодня тоже всё прошло благополучно."
16019-160190110 = "У меня есть вопрос."
16019-160190120 = "Что вы думаете об улучшениях?"
16019-160190130 = "Если есть ресурсы, то идёт усиление, наверное."
16019-160190140 = "Или усиливать даже ценой отказа от другого, наверное."
16019-160190150 = "Понимаю."
16019-160190160 = "Хороший подход."
16019-160190170 = "Сенсей, вы уделяете внимание распределению ресурсов."
16019-160190180 = "Понимаю."
16019-160190190 = "Хороший подход."
16019-160190200 = "Я тоже думаю о подобном."
16019-160190210 = "И то, о чём я хочу сказать сегодня, как раз"
16019-160190220 = "касается консультации по улучшениям."
16019-160190230 = "Прошу прощения за поздний час."
16019-160190240 = "Я завершила разведку на рассвете и вернулась."
16019-160190250 = "...?"
16019-160190260 = "Разве не слишком рано? Ещё темно..."
16019-160190270 = "Да, именно поэтому."
16019-160190280 = "Сегодня тоже суетливый день."
16019-160190290 = "Уже обеденное время."
16019-160190300 = "Верно..."
16019-160190310 = "Сейчас я решила наслаждаться ходом времени."
16019-160190320 = "Но я не оставляю намерения стать вашей «последней»."
16019-160190330 = "Хм...?"
16019-160190340 = "Запомните."
16019-160190350 = "Рядом с вами, Сенсей,"
16019-160190360 = "находится идеальная горничная и идеальная разведчица —"
16019-160190370 = "Токи."