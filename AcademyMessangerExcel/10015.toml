[translation]
10015-1001500010 = "Сенсей, наконец-то Алиса отправляется в приключение."
10015-1001500020 = "Сначала я слышала, что нужно поднять уровень в окрестностях «Стартовой деревни»."
10015-1001500030 = "Я ушла. Пожелайте мне удачи."
10015-1001500040 = "Приключение...?"
10015-1001500050 = "Значит, настало время и тебе отправиться в путь..."
10015-1001500060 = "Сегодняшнее приключение прошло хорошо."
10015-1001500070 = "Составите мне компанию и в следующий раз?"
10015-1001500080 = "Да, конечно. Мы же команда."
10015-1001500090 = "Ты же наш важный талисман!"
10015-1001500100 = "Да, буду рада."
10015-1001500110 = "Алисе очень нравится приключения с Сенсеем."
10015-1001500120 = "Тра-та-та-да!"
10015-1001500130 = "Уровень повышен. Теперьшняя Алиса сильнее вчерашней."
10015-1001500140 = "Растёт день ото дня...!"
10015-1001500150 = "Поздравляю с повышением уровня!"
10015-1001500160 = "Вы тоже старайтесь, Сенсей, а то с таким уровнем вы справитесь?"
10015-1001500170 = "П-постараюсь..."
10015-1001500180 = "Всё в порядке, проблем нет... надеюсь, наверное."
10015-1001500190 = "Тогда сегодня я снова отправляюсь в приключение, Сенсей, вы со мной?"
10015-1001500200 = "Да, с удовольствием."
10015-1001500210 = "Тогда я буду ждать."
10015-1001500220 = "Из-за действий Алисы я доставила много хлопот..."
10015-1001500230 = "Меня поругал и ученический совет,"
10015-1001500240 = "так что приключения временно отменяются..."
10015-1001500250 = "Бывает и такое, не переживай слишком сильно."
10015-1001500260 = "Период зарядки тоже важен."
10015-1001500270 = "У меня внезапно появилось свободное время."
10015-1001500280 = "Поэтому сегодня я попробую поиграть в новую игру, которую вы мне посоветовали."
10015-1001500290 = "Я взяла напрокат портативную консоль, так что, может, поиграю в кафе."
10015-1001500300 = "Хорошая идея!"
10015-1001500310 = "Интересно, что это за игра...!"
10015-1001500320 = "Я нашла скрытую концовку, где можно быть вместе и с Его Величеством Бородатым, и с Лысым Императором, но..."
10015-1001500330 = "члены Семинара ворвались, заявив, что обнаружено использование нелегального ПО,"
10015-1001500340 = "и консоль отобрали прямо перед финалом."
10015-1001500350 = "Сказали, что «это нелегально распространяемый товар, содержание не проверено»,"
10015-1001500360 = "...что это значит?"
10015-1001500370 = "Никто мне не объяснил..."
10015-1001500380 = "Думаю, тебе лучше не знать..."
10015-1001500390 = "В жизни есть вещи, о которых лучше не знать ради счастья..."
10015-1001500400 = "Понятно..."
10015-1001500410 = "Мне это кажется несправедливым, но я поняла."
10015-1001500420 = "Спасибо, Сенсей. Алиса стала ещё немного умнее."
10015-1001500430 = "Пожалуйста."
10015-1001500440 = "Я ещё свяжусь с вами."
10015-1001500450 = "Сенсей, вы хорошо разбираетесь в кошках?"
10015-1001500460 = "Алиса не очень разбирается."
10015-1001500470 = "Кошки очень быстрые."
10015-1001500480 = "А ещё они мяукают, это всё, что я знаю."
10015-1001500490 = "Вы не знаете, как подружиться с кошкой?"
10015-1001500500 = "Кошка, да..."
10015-1001500510 = "Хм-м..."
10015-1001500520 = "Сегодня я одна в клубе."
10015-1001500530 = "Так что хочу поиграть с Сенсеем в игры."
10015-1001500540 = "Если хотите, приходите."
10015-1001500550 = "Мне, может, понадобится время, но ты не против?"
10015-1001500560 = "Да, подожди немного."
10015-1001500570 = "Хорошо, я подожду. Спасибо."
10015-1001500580 = "Я буду ждать."
10015-1001500590 = "Почему в подземельях есть сундуки с сокровищами,"
10015-1001500600 = "а внутри них лежат предметы?"
10015-1001500610 = "Кто-то их туда положил...?"
10015-1001500620 = "Не знаю кто, но этот человек очень добрый."
10015-1001500630 = "Алиса тоже хочет быть таким человеком."
10015-1001500640 = "Я буду за тебя держать кулачки."
10015-1001500650 = "Ты обязательно сможешь."
10015-1001500660 = "Спасибо, Сенсей."
10015-1001500670 = "Сенсей."
10015-1001500680 = "Вы сейчас заняты?"
10015-1001500690 = "Вовсе нет!"
10015-1001500700 = "Как хорошо!"
10015-1001500710 = "На самом деле Алиса"
10015-1001500720 = "хочет кое-что показать Сенсею!"
10015-1001500730 = "Кое-что показать...?"
10015-1001500740 = "Да!"
10015-1001500750 = "Я буду ждать в клубе разработки игр!"
