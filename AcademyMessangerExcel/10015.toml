[translation]
10015-1001500010 = "Sensei, chegou a hora da Aris partir em uma aventura."
10015-1001500020 = "Ouvi dizer que primeiro é preciso subir de nível nos arredores da \"Vila Inicial\"."
10015-1001500030 = "Estou indo. Por favor, deseje-me boa sorte."
10015-1001500040 = "Uma aventura...?"
10015-1001500050 = "Então finalmente chegou a hora de tu partires em jornada..."
10015-1001500060 = "A aventura de hoje rendeu ótimos frutos."
10015-1001500070 = "Na próxima vez, você aceita formar grupo comigo de novo?"
10015-1001500080 = "Claro, com certeza. Somos do mesmo grupo, afinal."
10015-1001500090 = "Afinal, você é a nossa mascote indispensável!"
10015-1001500100 = "Sim, conto com você."
10015-1001500110 = "Aventurar-se ao lado do Sensei é super divertido para a Aris."
10015-1001500120 = "Tã-rã-rã-rããã!"
10015-1001500130 = "Subi de nível! A Aris de hoje está mais forte do que a Aris de ontem."
10015-1001500140 = "Evoluindo a cada dia que passa...!"
10015-1001500150 = "Parabéns pelo level up!"
10015-1001500160 = "Esforce-se também, Sensei. Tem certeza de que consegue avançar estando nesse nível?"
10015-1001500170 = "V-Vou me esforçar..."
10015-1001500180 = "Relaxa, dá pro gasto... eu acho."
10015-1001500190 = "Pois bem, estou saindo em aventura hoje também. Quer vir junto, Sensei?"
10015-1001500200 = "Bora, com prazer."
10015-1001500210 = "Então estarei esperando por você."
10015-1001500220 = "Por causa das ações da Aris, acabei causando muitos transtornos..."
10015-1001500230 = "Até levei bronca do pessoal do conselho estudantil,"
10015-1001500240 = "então as aventuras estão suspensas por um tempo..."
10015-1001500250 = "Essas coisas acontecem às vezes, não fica tão chateada."
10015-1001500260 = "Tirar um tempinho para recarregar as energias também é importante."
10015-1001500270 = "De repente fiquei com bastante tempo livre sozinha."
10015-1001500280 = "Por isso, hoje pretendo testar um jogo novo que me recomendaram."
10015-1001500290 = "Também peguei um console portátil emprestado, então vou tentar jogar na cafeteria."
10015-1001500300 = "Boa ideia!"
10015-1001500310 = "Fiquei curioso pra saber que jogo é esse...!"
10015-1001500320 = "Eu tinha acabado de descobrir a rota secreta em que a protagonista se casa tanto com Sua Majestade Barbudo quanto com o Imperador Careca..."
10015-1001500330 = "Mas aí o pessoal do Seminário invadiu o local dizendo ter detectado o uso de software ilegal,"
10015-1001500340 = "e confiscaram o meu console bem na cara do final."
10015-1001500350 = "Disseram que era \"um produto de distribuição ilegal cujo conteúdo não passou pelo conselho de classificação\"..."
10015-1001500360 = "...O que será que isso quer dizer?"
10015-1001500370 = "Ninguém quer me explicar..."
10015-1001500380 = "Acho melhor você não saber..."
10015-1001500390 = "Há coisas neste mundo que a gente é mais feliz sem saber..."
10015-1001500400 = "Entendo..."
10015-1001500410 = "Ainda não me convenceu totalmente, mas compreendi."
10015-1001500420 = "Obrigada, Sensei. A Aris ficou um pouquinho mais sábia hoje."
10015-1001500430 = "Disponha."
10015-1001500440 = "Entrarei em contato novamente depois."
10015-1001500450 = "Sensei, você entende bastante de gatos?"
10015-1001500460 = "A Aris não entende muito."
10015-1001500470 = "Os gatos têm a agilidade muito alta."
10015-1001500480 = "E eles fazem \"miau\". É basicamente tudo o que sei sobre eles."
10015-1001500490 = "Você conhece algum método para fazer amizade com gatos?"
10015-1001500500 = "Gatos, é...?"
10015-1001500510 = "Humm..."
10015-1001500520 = "Hoje a Aris está sozinha na sala do clube."
10015-1001500530 = "Por isso, gostaria de jogar junto com o Sensei."
10015-1001500540 = "Se puder, venha me fazer uma visita."
10015-1001500550 = "Talvez eu demore um pouquinho pra chegar, tudo bem?"
10015-1001500560 = "Sim, me espera só um pouquinho."
10015-1001500570 = "Sim, sem problemas. Muito obrigada."
10015-1001500580 = "Estarei esperando."
10015-1001500590 = "Por que será que existem baús de tesouro nas masmorras,"
10015-1001500600 = "e dentro desses baús sempre há itens úteis?"
10015-1001500610 = "Será que alguém os deixou lá de propósito para nós...?"
10015-1001500620 = "Não sei quem foi, mas certamente é uma pessoa muito bondosa."
10015-1001500630 = "A Aris também quer se tornar uma pessoa assim."
10015-1001500640 = "Estou torcendo por você."
10015-1001500650 = "Tenho certeza de que você consegue, Aris."
10015-1001500660 = "Obrigada, Sensei."
10015-1001500670 = "Sensei."
10015-1001500680 = "Você está ocupado agora?"
10015-1001500690 = "Tranquilíssimo!"
10015-1001500700 = "Que bom!"
10015-1001500710 = "Na verdade, a Aris"
10015-1001500720 = "tem uma coisa que quer muito mostrar para o Sensei!"
10015-1001500730 = "Uma coisa pra me mostrar...?"
10015-1001500740 = "Sim!"
10015-1001500750 = "Estarei esperando na sala do Clube de Desenvolvimento de Jogos!"
