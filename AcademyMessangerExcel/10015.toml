[translation]
10015-1001500010 = "Наконец-то я отправляюсь в приключение, Сенсей."
10015-1001500020 = "Я слышала, что сначала нужно повысить уровень возле города, где начинается путь."
10015-1001500030 = "Так что пожелайте мне удачи."
10015-1001500040 = "А? Приключение?"
10015-1001500050 = "Похоже, время наконец пришло..."
10015-1001500060 = "Сегодняшнее приключение прошло гладко."
10015-1001500070 = "В следующий раз тоже присоединитесь к группе?"
10015-1001500080 = "Конечно. Ни за что не пропущу."
10015-1001500090 = "Талисман — важный спутник!"
10015-1001500100 = "Верно."
10015-1001500110 = "Мне нравится отправляться с вами в приключения, Сенсей."
10015-1001500120 = "Ба-ба-ба-бам! Бам-бам!"
10015-1001500130 = "Я повысила уровень! Теперь я намного сильнее."
10015-1001500140 = "Н-Неужели?"
10015-1001500150 = "Поздравляю с повышением уровня!"
10015-1001500160 = "Вам тоже нужно стараться усерднее, Сенсей. На вашем нынешнем уровне нельзя расслабляться."
10015-1001500170 = "Д-Да, буду..."
10015-1001500180 = "Простите..."
10015-1001500190 = "Поэтому вам стоит присоединиться к моей группе. Я как раз собираюсь в новое приключение!"
10015-1001500200 = "Хорошо. Пойдём вместе."
10015-1001500210 = "Да. Я буду ждать вас."
10015-1001500220 = "Я доставила остальным много хлопот."
10015-1001500230 = "Даже студенческий совет меня отругал..."
10015-1001500240 = "Наверное, мне стоит ненадолго отдохнуть от приключений..."
10015-1001500250 = "Хорошая идея..."
10015-1001500260 = "Тебе стоит отдохнуть."
10015-1001500270 = "Теперь у меня появилось немного времени для себя."
10015-1001500280 = "Я собираюсь сыграть в новую игру, которую мне посоветовали."
10015-1001500290 = "Я одолжила портативную консоль, так что поиграю в кафе."
10015-1001500300 = "Хорошо. Удачи!"
10015-1001500310 = "Удачи в кафе!"
10015-1001500320 = "Я нашла скрытую концовку и с Бородатым Королём, и с Лысым Императором, но..."
10015-1001500330 = "прямо перед концовкой появилось сообщение, что обнаружено нелегальное ПО."
10015-1001500340 = "Пришли люди из Семинара и забрали игру."
10015-1001500350 = "Они сказали, что это незаконно распространяемая нецензурированная копия..."
10015-1001500360 = "Что это значит?"
10015-1001500370 = "Никто мне не объясняет..."
10015-1001500380 = "Наверное, лучше тебе этого не знать..."
10015-1001500390 = "Некоторые знания не должны открываться миру..."
10015-1001500400 = "Вот как?"
10015-1001500410 = "Я не понимаю, но могу это принять."
10015-1001500420 = "Спасибо, что объяснили, Сенсей."
10015-1001500430 = "Не унывай!"
10015-1001500440 = "Да, не буду."
10015-1001500450 = "Сенсей, вы много знаете о кошках?"
10015-1001500460 = "Я не очень много о них знаю..."
10015-1001500470 = "Кошки очень быстрые."
10015-1001500480 = "И они говорят: «мяу»!"
10015-1001500490 = "Есть способ подружиться с кошками?"
10015-1001500500 = "Кошки?"
10015-1001500510 = "Не уверен..."
10015-1001500520 = "Сегодня я одна в клубе."
10015-1001500530 = "Мне скучно, так что приходите поиграть со мной."
10015-1001500540 = "Пожалуйста, загляните."
10015-1001500550 = "Зайду, если будет время."
10015-1001500560 = "Хорошо, загляну проведать тебя."
10015-1001500570 = "Хорошо. Спасибо."
10015-1001500580 = "Я буду ждать вас."
10015-1001500590 = "Как сундуки с сокровищами попадают в подземелья?"
10015-1001500600 = "И почему внутри них лежат предметы?"
10015-1001500610 = "Кто-то их туда кладёт?"
10015-1001500620 = "Не знаю, кто это делает, но он, должно быть, очень добрый."
10015-1001500630 = "Я тоже хочу стать тем, кто наполняет сундуки сокровищами."
10015-1001500640 = "Что ж, я тебя поддерживаю, Алиса."
10015-1001500650 = "Ты справишься!"
10015-1001500660 = "Спасибо, Сенсей."
10015-1001500670 = "Сенсей!"
10015-1001500680 = "Вы заняты?"
10015-1001500690 = "Если просишь ты, Алиса — нет!"
10015-1001500700 = "Ура!"
10015-1001500710 = "Если так"
10015-1001500720 = "я хотела бы кое-что вам показать!"
10015-1001500730 = "Правда? Что?"
10015-1001500740 = "Вы должны узнать сами!"
10015-1001500750 = "Я буду ждать вас в комнате Клуба разработки игр!"
