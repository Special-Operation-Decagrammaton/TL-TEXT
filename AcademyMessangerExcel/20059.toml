[translation]
20059-200590010 = "Куфуфу!"
20059-200590020 = "Аха-ха-ха-ха!"
20059-200590030 = "Ты сегодня весёлая, Муцуки!"
20059-200590040 = "Слушай, Сенсей?"
20059-200590050 = "Как вам мой смех?"
20059-200590060 = "Милый?"
20059-200590070 = "Забавный?"
20059-200590080 = "Милый!"
20059-200590090 = "Забавный!"
20059-200590100 = "О-о, правда?"
20059-200590110 = "А что, если я засмеюсь по-другому?"
20059-200590120 = "Ну, например: О-хо-хо!"
20059-200590130 = "Или: А-ха-ха-ха!"
20059-200590140 = "Что случилось?"
20059-200590150 = "Ничего особенного..."
20059-200590160 = "Просто хочу кое-что попробовать."
20059-200590170 = "Хотите встретиться и поговорить?"
20059-200590180 = "Сенсей! Сегодня было весело!"
20059-200590190 = "Я хорошо потренировалась?"
20059-200590200 = "Потренировалась?"
20059-200590210 = "Ах"
20059-200590220 = "Куфуфу! Конечно!"
20059-200590230 = "Когда-нибудь я это применю!"
20059-200590240 = "Когда-нибудь? А разве это не нужно было для работы...?"
20059-200590250 = "Аха-ха-ха!"
20059-200590260 = "Вы и правда в это поверили?"
20059-200590270 = "Я просто хотела с вами поиграть!"
20059-200590280 = "Сенсей, вы такой доверчивый, да?"
20059-200590290 = "Я и так знал!?"
20059-200590300 = "Да ну? Куфуфу"
20059-200590310 = "Ладно, главное, что нам обоим было весело?"
20059-200590320 = "Так что договорились."
20059-200590330 = "Ну, до встречи, Сенсей!"
20059-200590340 = "Сенсей, что вы сегодня делаете?"
20059-200590350 = "Если свободны, давайте вечером сходим в магазин!"
20059-200590360 = "В этот раз вам точно понравится!"
20059-200590370 = "Понравится?"
20059-200590380 = "Куфуфу, это секрет."
20059-200590390 = "В общем, вы согласны?"
20059-200590400 = "Тогда до встречи!"
20059-200590410 = "Сенсей, я собираюсь на некоторое время залечь на дно."
20059-200590420 = "Так что не удивляйтесь, если не увидите меня в «Удобной лавке»."
20059-200590430 = "Что случилось?"
20059-200590440 = "Помните ту историю с перекупщиками?"
20059-200590450 = "После неё была ещё одна маленькая неприятность."
20059-200590460 = "Но ничего серьёзного."
20059-200590470 = "Если я немного скроюсь, всё уладится."
20059-200590480 = "Я уже предупредила остальных."
20059-200590490 = "И куда ты скроешься?"
20059-200590500 = "Хм, ещё не решила, но"
20059-200590510 = "раз уж есть возможность,"
20059-200590520 = "может, устрою себе отпуск в отеле?"
20059-200590530 = "Сенсей, хорошие новости!"
20059-200590540 = "В магазинах снова появились бомбы!"
20059-200590550 = "Ну вот, теперь жизнь возвращается в нормальное русло?"
20059-200590560 = "Хорошо, что перекупщики ушли."
20059-200590570 = "С ними нужно бороться!"
20059-200590580 = "А, кстати, вы уже решили, на что потратите деньги?"
20059-200590590 = "Наверное, на наше с вами будущее?"
20059-200590600 = "Я пожертвую их!"
20059-200590610 = "Аха-ха!"
20059-200590620 = "Ну, это тоже неплохо?"
20059-200590630 = "Похоже, я сделала что-то не свойственное мне, но"
20059-200590640 = "это тоже было весело."
20059-200590650 = "Хорошо бы было ещё что-то интересное."
20059-200590660 = "Правда, Сенсей?"
20059-200590670 = "Да, ты права."
20059-200590680 = "Куфуфу"
20059-200590690 = "Тогда я ещё напишу!"
20059-200590700 = "Сенсей, вы сегодня заняты?"
20059-200590710 = "Если нет, может, сходим куда-нибудь?"
20059-200590720 = "Я знаю одно место."
20059-200590730 = "Тогда нужно идти!"
20059-200590740 = "Куфуфу, я так и знала."
20059-200590750 = "Тогда собирайтесь быстрее."
20059-200590760 = "Мы идём..."
20059-200590770 = "в оперный театр!"