[translation]
20059-200590010 = "Kufufu!"
20059-200590020 = "Ahahahahaha!"
20059-200590030 = "Está animada como sempre hoje, hein, Mutsuki!"
20059-200590040 = "Ei, Sensei~"
20059-200590050 = "O que você acha da minha risada?"
20059-200590060 = "Acha fofa?"
20059-200590070 = "Ou engraçada?"
20059-200590080 = "Fofa!"
20059-200590090 = "Engraçada!"
20059-200590100 = "Hmm~ Então é isso que você acha?"
20059-200590110 = "E o que você acharia se eu risse de um jeito diferente?"
20059-200590120 = "Tipo 'Ohohoho!'"
20059-200590130 = "Ou 'Aaahahahaha!'"
20059-200590140 = "De onde surgiu isso do nada?"
20059-200590150 = "Não é nada demais, mas..."
20059-200590160 = "Tem uma coisinha que eu quero testar"
20059-200590170 = "Que tal a gente se encontrar rapidinho pra conversar?"
20059-200590180 = "Sensei! Hoje foi superdivertido!"
20059-200590190 = "Deu pra treinar direitinho?"
20059-200590200 = "Treinar?"
20059-200590210 = "Ah"
20059-200590220 = "Kufufu! Claro que sim!"
20059-200590230 = "Um dia eu vou fazer bom uso disso!"
20059-200590240 = "Um dia? Mas não era pra um trabalho de agora...?"
20059-200590250 = "Ahahahaha!"
20059-200590260 = "Você acreditou mesmo naquilo?"
20059-200590270 = "Eu só queria brincar com você, Sensei!"
20059-200590280 = "Você é mesmo muito fácil de enganar, né, Sensei?"
20059-200590290 = "E-Eu já sabia desde o começo, tá?!"
20059-200590300 = "Ah, é? Kufufu"
20059-200590310 = "Bom, nós dois nos divertimos bastante, né?"
20059-200590320 = "Então tá tudo certo!"
20059-200590330 = "Até mais, Sensei!"
20059-200590340 = "Senseeei, o que tá fazendo hoje?"
20059-200590350 = "Se estiver livre, vamos fazer compras no fim da tarde!"
20059-200590360 = "Acho que você vai adorar a programação de hoje!"
20059-200590370 = "Vou adorar?"
20059-200590380 = "Kufufu, é segredo"
20059-200590390 = "Enfim, combinado então, né?"
20059-200590400 = "Até mais tarde!"
20059-200590410 = "Sensei, tô pensando em ficar escondida por um tempinho"
20059-200590420 = "Então não se assuste se eu não estiver lá no escritório do Faz-Tudo, viu?"
20059-200590430 = "O que aconteceu?"
20059-200590440 = "Lembra daquela confusão com os cambistas outro dia?"
20059-200590450 = "Na verdade, rolou mais uma treta depois daquilo"
20059-200590460 = "Mas relaxa, não é nada demais"
20059-200590470 = "É só eu sumir do mapa por uns dias que fica tudo certo"
20059-200590480 = "Já até avisei as meninas"
20059-200590490 = "Aliás, pra onde você vai?"
20059-200590500 = "Hmm~ Ainda não decidi, mas"
20059-200590510 = "já que surgiu a oportunidade,"
20059-200590520 = "acho que vou curtir umas férias num hotel chique!"
20059-200590530 = "Sensei, boas notícias!"
20059-200590540 = "As bombas voltaram pras prateleiras das lojas!"
20059-200590550 = "Acho que agora tudo finalmente voltou ao normal, né?"
20059-200590560 = "Ainda bem que os cambistas sumiram"
20059-200590570 = "Cambista tem mais é que ser extinto mesmo!"
20059-200590580 = "Ah, é mesmo, já pensou no que vai fazer com aquele dinheiro?"
20059-200590590 = "Vai usar para o nosso futuro juntos?"
20059-200590600 = "V-Vou doar tudo!"
20059-200590610 = "Ahahaha!"
20059-200590620 = "É, não é uma má ideia!"
20059-200590630 = "Sinto que acabei fazendo uma boa ação, o que nem combina comigo, mas"
20059-200590640 = "foi bem divertido do seu próprio jeito"
20059-200590650 = "Tomara que apareçam mais coisas divertidas assim"
20059-200590660 = "Né, Sensei?"
20059-200590670 = "Sim, com certeza"
20059-200590680 = "Kufufu"
20059-200590690 = "Bom, depois eu te mando mensagem de novo!"
20059-200590700 = "Sensei, tá ocupado hoje?"
20059-200590710 = "Se não tiver nada marcado, vamos sair pra nos divertir?"
20059-200590720 = "Tem um lugar onde eu tô muito afim de ir"
20059-200590730 = "Então não podemos deixar de ir!"
20059-200590740 = "Kufufu, sabia que você ia dizer isso"
20059-200590750 = "Então se arruma logo aí"
20059-200590760 = "Porque agora nós vamos..."
20059-200590770 = "para a Casa de Ópera!"
