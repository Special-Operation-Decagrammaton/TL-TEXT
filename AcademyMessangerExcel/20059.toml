[translation]
20059-200590010 = "Куфуфу!"
20059-200590020 = "А-ха-ха!"
20059-200590030 = "Ещё один день, полный веселья!"
20059-200590040 = "Сенсей."
20059-200590050 = "Что думаете о моём смехе?"
20059-200590060 = "Милый?"
20059-200590070 = "Смешной?"
20059-200590080 = "Милый!"
20059-200590090 = "Смешной!"
20059-200590100 = "Хе? Вот как вы думаете?"
20059-200590110 = "А если я буду смеяться иначе?"
20059-200590120 = "Например, «Охохохо»"
20059-200590130 = "Или «Кьяхаха»"
20059-200590140 = "Это для чего?"
20059-200590150 = "Куфуфу. Ничего серьёзного."
20059-200590160 = "Просто пробую новый подход."
20059-200590170 = "Хотите обсудить это лично?"
20059-200590180 = "Сенсей! Сегодня было весело!"
20059-200590190 = "Практика прошла хорошо?"
20059-200590200 = "Практика?"
20059-200590210 = "А!"
20059-200590220 = "Куфуфу, конечно!"
20059-200590230 = "Когда-нибудь это пригодится!"
20059-200590240 = "Когда-нибудь? Разве всё это было не ради работы?"
20059-200590250 = "А-ха-ха-ха!"
20059-200590260 = "Вы правда в это поверили?"
20059-200590270 = "Это всё был предлог, чтобы провести время с вами!"
20059-200590280 = "Вы такой наивный, Сенсей."
20059-200590290 = "Я?! Нет! Я всё это время знал!"
20059-200590300 = "Куфуфу, конечно."
20059-200590310 = "Ну, нам обоим было весело, правда?"
20059-200590320 = "Значит, всё О-КЕЙ!"
20059-200590330 = "До следующего раза!"
20059-200590340 = "Эй, Сенсей! Чем сегодня занимаетесь?"
20059-200590350 = "Сегодня вечером заняты? Давайте потом сходим за покупками!"
20059-200590360 = "Вы ТОЧНО захотите увидеть, что я куплю на этот раз."
20059-200590370 = "И что же это?"
20059-200590380 = "Куфуфу, СЕКРЕТ."
20059-200590390 = "В общем, время у вас есть, да?"
20059-200590400 = "Тогда увидимся!!"
20059-200590410 = "Сенсей. Мне придётся залечь на дно на несколько дней."
20059-200590420 = "Не ищите меня. Даже вместе с «Решателями проблем 68»."
20059-200590430 = "Всё в порядке?"
20059-200590440 = "Помните тех перекупщиков бомб с прошлого раза?"
20059-200590450 = "Ну-у-у, есть несколько мелочей, связанных с этим."
20059-200590460 = "Нечего из-за этого шум поднимать."
20059-200590470 = "Мне просто нужно ненадолго залечь на дно."
20059-200590480 = "Остальные уже тоже знают."
20059-200590490 = "И где ты собираешься прятаться?"
20059-200590500 = "Хм-м... Ещё не решила."
20059-200590510 = "Может, извлеку из этого максимум пользы"
20059-200590520 = "и устрою себе небольшой «отельный отпуск»."
20059-200590530 = "Сенсей! Хорошие новости!"
20059-200590540 = "Магазин бомб снова начал продавать бомбы!"
20059-200590550 = "Так что всё снова как должно быть!"
20059-200590560 = "Рад, что перекупщики исчезли."
20059-200590570 = "Ага! Перекупщиков надо уничтожать!"
20059-200590580 = "А, точно. Вы уже решили, на что потратите деньги?"
20059-200590590 = "Будете копить их на наше совместное будущее?"
20059-200590600 = "Я-Я пожертвую их!"
20059-200590610 = "А-ха-ха!"
20059-200590620 = "Знаете, так тоже пойдёт!"
20059-200590630 = "Для меня это было необычно мило,"
20059-200590640 = "но всё равно весело."
20059-200590650 = "И надеюсь, в следующий раз тоже будет весело!"
20059-200590660 = "Разве нет?"
20059-200590670 = "Да! Очень надеюсь."
20059-200590680 = "Куфуфу."
20059-200590690 = "Тогда до встречи!"
20059-200590700 = "Сенсей. Вы сегодня заняты?"
20059-200590710 = "Если нет — проведите время со мной!"
20059-200590720 = "Есть одно место, куда я хочу сходить!"
20059-200590730 = "Тогда мы обязаны туда пойти!"
20059-200590740 = "Куфуфу, я знала, что вы так скажете."
20059-200590750 = "Приготовьтесь!"
20059-200590760 = "Потому что мы"
20059-200590770 = "идём в оперный театр!"
