[translation]
13002-1223 = "Por que será que não vendem gyudon em tamanhos maiores do que o extragrande?"
13002-1224 = "O extragrande já não é grande o bastante...?"
13002-1225 = "Não mesmo, apenas uma tigela extragrande não dá nem para o começo"
13002-1226 = "Por que você come tanto assim, Akari?"
13002-1227 = "Fufu, que pergunta boba. O motivo pelo qual eu como tanto é muito simples"
13002-1228 = "É porque... a comida está lá!"
13002-1229 = "Sensei, quando você come lámen, começa pelo macarrão ou pelo caldo?"
13002-1230 = "Acho que pelo macarrão"
13002-1231 = "Acho que pelo caldo"
13002-1232 = "Entendo, então é assim"
13002-1233 = "Entendo, então é assim"
13002-1234 = "Pessoalmente, para mim não há outra escolha além de começar pelo caldo"
13002-1235 = "Não é exagero dizer que o caldo é a própria essência que concentra tudo o que há de melhor no lámen"
13002-1236 = "E quando você adiciona alho triturado nele... Aah, que maravilha divina!"
13002-1237 = "Você tem um paladar digno de um tiozão, hein..."
13002-1238 = "Eu acho que o rodízio e o buffet livre são uma cultura simplesmente maravilhosa"
13002-1239 = "Poder comer tudo o que quiser, o quanto aguentar, por um preço fixo..."
13002-1240 = "Quem teve essa ideia com certeza é um verdadeiro gênio!"
13002-1241 = "Já para os donos do restaurante que te recebem como cliente, é uma verdadeira calamidade..."
13002-1242 = "Ficou decidido que o prato do próximo campeonato de quem come mais será \"curry\""
13002-1243 = "Curry... Não tenho muita confiança nesse prato, então preciso fazer um treino especial antes"
13002-1244 = "Existe comida que até você tem dificuldade para encarar, Akari?"
13002-1245 = "De comer eu consigo tranquilamente, mas para competições de comer em grande quantidade é meio complicado..."
13002-1246 = "Com curry, por exemplo, acabo bebendo água várias vezes no meio do caminho..."
13002-1247 = "Por outro lado, como eu adoro sushi, consigo comer o dobro do que os outros participantes"
13002-1248 = "Só porque alguém come muito não quer dizer que não tenha suas preferências, sabia?"
