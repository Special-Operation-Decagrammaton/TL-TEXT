[translation]
13002-1223 = "Почему не продают порцию говяжьего донбури больше, чем «экстра-большая»?"
13002-1224 = "Разве «экстра-большой» не достаточно большой...?"
13002-1225 = "Нет, одной экстра-большой порции мне не насытиться."
13002-1226 = "Почему ты так много ешь, Акари?"
13002-1227 = "Хе-хе, глупый вопрос. Причина, по которой я много ем, проста."
13002-1228 = "Потому что... там есть еда!"
13002-1229 = "Когда вы едите рамэн, вы сначала едите лапшу или сначала пробуете бульон?"
13002-1230 = "Наверное, сначала лапшу."
13002-1231 = "Наверное, сначала бульон."
13002-1232 = "Понятно, вот как."
13002-1233 = "Понятно, вот как."
13002-1234 = "Лично я всегда выбираю бульон."
13002-1235 = "Не будет преувеличением сказать, что бульон — это сама суть рамэна, в нём заключено всё."
13002-1236 = "А если туда добавить растёртый чеснок... о, как это прекрасно!"
13002-1237 = "Похоже, у тебя вкус как у старика..."
13002-1238 = "Я считаю, что система «всё, что можешь съесть» — это поистине замечательная культура."
13002-1239 = "За фиксированную цену можно есть сколько хочешь, что душе угодно..."
13002-1240 = "Тот, кто придумал эту идею, определённо гений!"
13002-1241 = "Для тех, кто принимает таких гостей, как Акари, это настоящая катастрофа..."
13002-1242 = "Говорят, что следующим соревнованием по поеданию будет «карри»."
13002-1243 = "Карри... я не очень уверена в своих силах, так что мне нужно заранее потренироваться."
13002-1244 = "У Акари тоже есть еда, с которой возникают трудности?"
13002-1245 = "Я могу её есть, но для соревнований по обжорству она не очень подходит."
13002-1246 = "Например, во время карри мне приходится много раз пить воду, так что..."
13002-1247 = "А вот суши, наоборот, я люблю, и могу съесть в два раза больше обычного."
13002-1248 = "То, что я много ем, вовсе не значит, что у меня нет пристрастий."