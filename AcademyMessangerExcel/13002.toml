[translation]
13002-1223 = "Знаете, я тут подумала... Почему в ресторанах не продают гюдон больше королевского размера?"
13002-1224 = "Разве королевского размера недостаточно?"
13002-1225 = "Нет! Одной королевской порцией я никогда не наедаюсь."
13002-1226 = "Акари, почему ты ешь так много за раз?"
13002-1227 = "Хи-хи! Какой глупый вопрос."
13002-1228 = "Если я вижу еду... я её ем! Всю!"
13002-1229 = "Когда ешь рамэн, сначала ешь лапшу или пьёшь бульон?"
13002-1230 = "Сначала лапшу."
13002-1231 = "Сначала бульон."
13002-1232 = "Значит, в рамэне тебе важнее лапша."
13002-1233 = "Значит, в рамэне тебе важнее бульон."
13002-1234 = "Я предпочитаю начинать с бульона."
13002-1235 = "Густой бульон — сама суть рамэна, в нём заключён настоящий вкус."
13002-1236 = "А если добавить резкий вкус давленого чеснока... Ох, невозможно устоять!"
13002-1237 = "Звучит как то, что понравилось бы старику..."
13002-1238 = "«Ешь сколько хочешь» — отличная концепция."
13002-1239 = "Можно есть сколько угодно и не думать о цене..."
13002-1240 = "Тот, кто это придумал, наверняка гений!"
13002-1241 = "А для владельца ресторана «ешь сколько хочешь», где ты была недавно, ты наверняка стала стихийным бедствием..."
13002-1242 = "Похоже, в следующем соревновании по еде нужно будет съесть много карри."
13002-1243 = "С карри я не так уверена... Надо потренироваться."
13002-1244 = "Что, есть еда, которую ты не любишь?"
13002-1245 = "Не то чтобы я не могла её есть, просто некоторые блюда я не могу есть в огромных количествах."
13002-1246 = "Например, с острыми блюдами вроде карри я пью много воды и быстро наедаюсь."
13002-1247 = "А вот любимой еды, вроде суши, могу съесть вдвое больше."
13002-1248 = "У гурманов тоже есть предпочтения!"
