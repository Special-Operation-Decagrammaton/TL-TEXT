[translation]
10133-101330010 = "Сенсей. Как вам живётся на транспортном корабле?"
10133-101330020 = "Сообщите мне, если испытываете какие-либо неудобства."
10133-101330030 = "Я сделаю всё возможное, чтобы их устранить."
10133-101330040 = "Я живу как король!"
10133-101330050 = "У меня всё отлично, и всё благодаря тебе!"
10133-101330060 = "Я рада это слышать."
10133-101330070 = "Но не стесняйтесь просить,"
10133-101330080 = "если вам понадобится абсолютно что угодно."
10133-101330090 = "А ты, Рио? Как держишься?"
10133-101330100 = "...? Что вы имеете в виду? Я в порядке."
10133-101330110 = "Почему спрашиваешь...?"
10133-101330120 = "Ну... робот-горничная..."
10133-101330130 = "Докладываю, Сенсей."
10133-101330140 = "Если сразу к сути..."
10133-101330150 = "Одолжить костюм горничной..."
10133-101330160 = "Не удалось."
10133-101330170 = "Однако. Если рассуждать рационально."
10133-101330180 = "Разве нельзя убедительно утверждать,"
10133-101330190 = "что Avant Guard, занимающийся домашней работой,"
10133-101330200 = "является роботом-горничной?"
10133-101330210 = "Горничная — это человек, для которого домашняя работа является профессией."
10133-101330220 = "Avant Guard — робот, выполняющий домашнюю работу."
10133-101330230 = "Следовательно, Avant Guard"
10133-101330240 = "является роботом-горничной, поскольку выполняет ту же роль."
10133-101330250 = "Следуя этому силлогизму,"
10133-101330260 = "мы можем найти и другие сходства между ними."
10133-101330270 = "Ты победила, Рио... Победила."
10133-101330280 = "Похоже, сегодня на корабле"
10133-101330290 = "будем только мы вдвоём."
10133-101330300 = "Все ушли по личным делам."
10133-101330310 = "Тогда будет тихо."
10133-101330320 = "Именно. Я собираюсь воспользоваться этим"
10133-101330330 = "и заняться работой, которая давно откладывалась."
10133-101330340 = "Некоторые особо тонкие задачи требуют от меня работать в спокойной обстановке."
10133-101330350 = "Операционная система корабля может ненадолго перезапуститься."
10133-101330360 = "Это не связано с неисправностями, так что, пожалуйста, не паникуйте."
10133-101330370 = "И чем же ты занимаешься?"
10133-101330380 = "секрет"
10133-101330390 = "Это всё."
10133-101330400 = "Удачи в ваших начинаниях"
10133-101330410 = "Спасибо, Сенсей."
10133-101330420 = "Без вашей помощи я бы не смогла завершить модернизацию корабля."
10133-101330430 = "Хотя масштаб улучшений оказался не таким, как я надеялась..."
10133-101330440 = "Эти маленькие шаги со временем сложатся в настоящий прогресс."
10133-101330450 = "Отличная работа, правда."
10133-101330460 = "И насчёт вашей неожиданной смены темы..."
10133-101330470 = "Я подумала об этом."
10133-101330480 = "Может быть..."
10133-101330490 = "вы неправильно поняли и"
10133-101330500 = "решили, что я общалась с кем-то в VR?"
10133-101330510 = "Да! Ага! Именно это я и подумал!"
10133-101330520 = "Понятно."
10133-101330530 = "К сожалению, я не пользуюсь VR-чатом."
10133-101330540 = "Хотя однажды я создала аватар. Из любопытства."
10133-101330550 = "Правда?! Хочу посмотреть! Как он выглядит?"
10133-101330560 = "Хотите знать?"
10133-101330570 = "Что ж, как-нибудь покажу."
10133-101330580 = "На нём костюм горничной"
10133-101330590 = "Ого...!"
10133-101330600 = "Потому что это Avant Guard."
10133-101330610 = "Не могу дождаться..."
10133-101330620 = "Сегодня в ангаре много работы."
10133-101330630 = "Я проведу массовое обслуживание своих модулей AMAS."
10133-101330640 = "Имейте это в виду, если вам понадобится доступ к каким-либо объектам там."
10133-101330650 = "Можно прийти посмотреть?"
10133-101330660 = "Хотите посмотреть?"
10133-101330670 = "Для вас это вряд ли будет особенно интересно..."
10133-101330680 = "Но если настаиваете, можете прийти."
10133-101330690 = "Сама работа монотонная и повторяющаяся."
10133-101330700 = "Даже мне не помешает компания."
10133-101330710 = "Хм-м, как ни посмотри, этого недостаточно."
10133-101330720 = "Я хочу приблизить его к совершенству настолько, насколько возможно."
10133-101330730 = "Avant Guard?"
10133-101330740 = "Хотя мне нравится работать и над Avant Guard..."
10133-101330750 = "На этот раз я говорю о своём костюме."
10133-101330760 = "Если бы я могла каким-то образом встроить функцию обогрева,"
10133-101330770 = "то была бы лучше подготовлена к более широкому спектру условий."
10133-101330780 = "Логично."
10133-101330790 = "Звучит очень рационально."
10133-101330800 = "Тогда нельзя терять время."
10133-101330810 = "Сенсей. Эм..."
10133-101330820 = "Я не ожидала, что так опозорюсь."
10133-101330830 = "Прошу прощения."
10133-101330840 = "Я была совершенно, на 100% невозмутима! Правда!"
10133-101330850 = "...Правда?"
10133-101330860 = "..."
10133-101330870 = "Слава богу."
10133-101330880 = "Если честно, это был первый раз,"
10133-101330890 = "когда кто-то увидел меня с такой стороны."
10133-101330900 = "В любом случае, спасибо за помощь сегодня."
10133-101330910 = "Отдохните. До следующего раза."
