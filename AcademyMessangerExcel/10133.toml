[translation]
10133-101330010 = "Как вам живётся на транспортном корабле?"
10133-101330020 = "Если что-то неудобно, скажите."
10133-101330030 = "Я постараюсь улучшить в возможных пределах."
10133-101330040 = "Очень комфортно!"
10133-101330050 = "Ни в чём не нуждаюсь!"
10133-101330060 = "Ну и хорошо."
10133-101330070 = "Я всегда принимаю пожелания."
10133-101330080 = "Не стесняйтесь."
10133-101330090 = "А ты как, Рио? В порядке?"
10133-101330100 = "Я?"
10133-101330110 = "У меня тоже особых проблем нет..."
10133-101330120 = "Насчёт робота-горничной."
10133-101330130 = "Доложу о результатах."
10133-101330140 = "Если кратко,"
10133-101330150 = "костюм горничной"
10133-101330160 = "мне не удалось одолжить."
10133-101330170 = "Однако, если подумать,"
10133-101330180 = "Авангарда, помогающего по дому,"
10133-101330190 = "считать «не» роботом-горничной"
10133-101330200 = "пожалуй, сложно."
10133-101330210 = "Горничная — это та, чья профессия — ведение домашнего хозяйства."
10133-101330220 = "Авангард — это робот, выполняющий домашнюю работу."
10133-101330230 = "То есть Авангард"
10133-101330240 = "это робот, выполняющий функции горничной."
10133-101330250 = "Даже в силлогизме"
10133-101330260 = "я считаю, что многие элементы совпадают."
10133-101330270 = "Я признаю поражение..."
10133-101330280 = "Вы заметили?"
10133-101330290 = "Сегодня на этом корабле только мы."
10133-101330300 = "Похоже, все разошлись по делам."
10133-101330310 = "Неудивительно, что так тихо."
10133-101330320 = "Раз уж есть возможность,"
10133-101330330 = "я планирую сделать накопившуюся работу."
10133-101330340 = "Я откладывала задачи, требующие сосредоточенности."
10133-101330350 = "Возможно, системе потребуется перезагрузка,"
10133-101330360 = "но это не ошибка, так что не удивляйтесь."
10133-101330370 = "Что ты планируешь делать?"
10133-101330380 = "Подробности я пока опущу."
10133-101330390 = "Всё, что нужно было сказать."
10133-101330400 = "Сегодня тоже рассчитываю на вас."
10133-101330410 = "Сенсей, я хочу вас поблагодарить."
10133-101330420 = "Благодаря вам я успешно завершила модернизацию транспортного корабля."
10133-101330430 = "Производительность выросла не так сильно, как ожидалось, но..."
10133-101330440 = "Такие накопления потом дают результат."
10133-101330450 = "Вы отлично поработали!"
10133-101330460 = "И ещё, насчёт того, что вы недавно ушли от ответа:"
10133-101330470 = "я подумала и пришла к выводу,"
10133-101330480 = "может быть..."
10133-101330490 = "вы подумали, что я общаюсь с кем-то в виртуальном пространстве?"
10133-101330500 = "Сенсей, вы неправильно поняли?"
10133-101330510 = "Н-ну, вроде того!"
10133-101330520 = "Вот оно что."
10133-101330530 = "Но я ещё не пробовала этого делать."
10133-101330540 = "Из любопытства я создала аватар, но только."
10133-101330550 = "О, и какой же?"
10133-101330560 = "Вам интересно?"
10133-101330570 = "Я горжусь им, между прочим."
10133-101330580 = "Он одет в костюм горничной."
10133-101330590 = "Ого...!"
10133-101330600 = "Это Авангард."
10133-101330610 = "Понятно..."
10133-101330620 = "Сегодня будет масштабное техобслуживание AMAS,"
10133-101330630 = "в ангаре будет немного шумно."
10133-101330640 = "Если собираетесь пользоваться помещениями, имейте в виду."
10133-101330650 = "Можно посмотреть?"
10133-101330660 = "Посмотреть?"
10133-101330670 = "Не думаю, что это будет интересно, но..."
10133-101330680 = "Если вы хотите, я не против, мне даже легче будет."
10133-101330690 = "Это просто повторение однообразных действий,"
10133-101330700 = "так что если есть с кем поговорить, это отвлекает."
10133-101330710 = "Очевидно, чего-то не хватает."
10133-101330720 = "Я хочу сделать всё более идеально, но..."
10133-101330730 = "Речь об Авангарде?"
10133-101330740 = "Это тоже неплохо."
10133-101330750 = "Но на этот раз речь о моём костюме."
10133-101330760 = "Если добавить в костюм функцию обогрева,"
10133-101330770 = "он сможет справляться с самыми разными ситуациями."
10133-101330780 = "Да."
10133-101330790 = "Всё-таки это рациональнее."
10133-101330800 = "Я займусь этим прямо сейчас."
10133-101330810 = "Сенсей, эм..."
10133-101330820 = "Я показала вам свои странные стороны."
10133-101330830 = "Простите."
10133-101330840 = "Я не обращаю внимания! Правда!"
10133-101330850 = "... Правда?"
10133-101330860 = "..."
10133-101330870 = "Если так, то хорошо..."
10133-101330880 = "Такое моё состояние"
10133-101330890 = "я никому другому не показывала..."
10133-101330900 = "В любом случае, спасибо за сегодняшнюю помощь."
10133-101330910 = "Отдыхайте хорошенько."