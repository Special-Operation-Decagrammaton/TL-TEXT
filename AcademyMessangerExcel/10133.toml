[translation]
10133-101330010 = "Como está sendo a vida a bordo do navio de transporte?"
10133-101330020 = "Se houver qualquer inconveniente, por favor, me avise."
10133-101330030 = "Farei as melhorias necessárias dentro do possível."
10133-101330040 = "Está super confortável!"
10133-101330050 = "Não está me faltando nada por aqui!"
10133-101330060 = "Fico aliviada em ouvir isso."
10133-101330070 = "Mas estou sempre aberta a solicitações,"
10133-101330080 = "então não precisa fazer cerimônia."
10133-101330090 = "E você, Rio? Está tudo bem por aí?"
10133-101330100 = "Eu?"
10133-101330110 = "Por aqui também não há nenhum problema em particular..."
10133-101330120 = "É sobre a questão do robô maid."
10133-101330130 = "Vim relatar o resultado."
10133-101330140 = "Indo direto à conclusão,"
10133-101330150 = "não consegui pegar emprestado"
10133-101330160 = "o uniforme de maid."
10133-101330170 = "Contudo, refletindo novamente sobre o assunto,"
10133-101330180 = "não seria difícil definir que o Avant-Garde-kun auxiliar doméstico"
10133-101330190 = "\"não é\" um robô maid,"
10133-101330200 = "você não acha?"
10133-101330210 = "Premissa maior: quem realiza tarefas domésticas por ofício é uma maid."
10133-101330220 = "Premissa menor: o Avant-Garde-kun é um robô que realiza tarefas domésticas."
10133-101330230 = "Logo, o Avant-Garde-kun"
10133-101330240 = "é um robô que desempenha o papel de uma maid."
10133-101330250 = "Analisando sob a ótica do silogismo,"
10133-101330260 = "considero que ambos compartilham inúmeros elementos em comum."
10133-101330270 = "Eu me rendo, você venceu..."
10133-101330280 = "Não sei se você já percebeu,"
10133-101330290 = "mas só há nós dois neste navio hoje."
10133-101330300 = "Parece que todas as outras saíram para resolver compromissos."
10133-101330310 = "Bem que eu achei que estava tudo muito silencioso."
10133-101330320 = "Como é uma ótima oportunidade,"
10133-101330330 = "pretendo adiantar algumas tarefas acumuladas."
10133-101330340 = "Eu havia deixado para depois os procedimentos que exigiam maior concentração."
10133-101330350 = "É possível que o sistema passe por algumas reinicializações,"
10133-101330360 = "mas não se assuste, pois não se trata de um erro."
10133-101330370 = "O que você pretende fazer exatamente?"
10133-101330380 = "Prefiro manter os detalhes em sigilo por enquanto."
10133-101330390 = "Era apenas isso que eu precisava avisar."
10133-101330400 = "Bom trabalho para nós hoje."
10133-101330410 = "Sensei, gostaria de lhe agradecer."
10133-101330420 = "Graças à sua ajuda, concluí a atualização do navio de transporte em segurança."
10133-101330430 = "O ganho de desempenho não foi tão alto quanto o estimado, mas..."
10133-101330440 = "São esses pequenos avanços acumulados que fazem a diferença a longo prazo."
10133-101330450 = "Ótimo trabalho hoje!"
10133-101330460 = "Além disso, sobre aquilo que você tentou desconversar agora há pouco..."
10133-101330470 = "Estive pensando sozinha a respeito."
10133-101330480 = "Por acaso..."
10133-101330490 = "Você achou que eu estava me comunicando com alguém no espaço virtual?"
10133-101330500 = "Seria esse o mal-entendido, Sensei?"
10133-101330510 = "F-Foi mais ou menos isso aí!"
10133-101330520 = "Então era isso mesmo."
10133-101330530 = "Para falar a verdade, ainda não tentei fazer isso na prática."
10133-101330540 = "Apenas criei um avatar por pura curiosidade."
10133-101330550 = "Opa, e como ficou o seu avatar?"
10133-101330560 = "Ficou curioso?"
10133-101330570 = "Modéstia à parte, tenho bastante orgulho do resultado."
10133-101330580 = "Está vestindo um uniforme de maid..."
10133-101330590 = "Oooh...!"
10133-101330600 = "É o Avant-Garde-kun."
10133-101330610 = "Ah, entendi..."
10133-101330620 = "Hoje farei uma manutenção em larga escala nos AMAS,"
10133-101330630 = "então o hangar ficará um pouco barulhento."
10133-101330640 = "Por favor, tenha isso em mente caso vá utilizar as instalações."
10133-101330650 = "Posso ir assistir?"
10133-101330660 = "Assistir?"
10133-101330670 = "Não acho que seja um trabalho muito interessante de se ver, mas..."
10133-101330680 = "Se não se importar com isso, para mim será de grande ajuda."
10133-101330690 = "Como é uma repetição de tarefas mecânicas,"
10133-101330700 = "ter alguém para conversar ajuda a distrair a mente."
10133-101330710 = "Por mais que eu analise, ainda não é o bastante."
10133-101330720 = "Eu gostaria de deixá-lo ainda mais perfeito, mas..."
10133-101330730 = "Está falando do Avant-Garde-kun?"
10133-101330740 = "Aprimorá-lo também não seria má ideia."
10133-101330750 = "Porém, desta vez refiro-me ao meu próprio traje."
10133-101330760 = "Se eu adicionar uma função de aquecimento térmico ao traje atual,"
10133-101330770 = "ele deverá ser capaz de lidar com uma variedade muito maior de situações."
10133-101330780 = "Sim."
10133-101330790 = "Definitivamente é a decisão mais racional."
10133-101330800 = "Vou começar a trabalhar nisso imediatamente."
10133-101330810 = "Sensei, hum..."
10133-101330820 = "Acabei permitindo que você me visse em uma situação bem estranha."
10133-101330830 = "Peço desculpas."
10133-101330840 = "Não precisa esquentar com isso! Sério mesmo!"
10133-101330850 = "...Tem certeza?"
10133-101330860 = "..."
10133-101330870 = "Se você diz, fico mais tranquila, mas..."
10133-101330880 = "Eu nunca havia mostrado"
10133-101330890 = "aquele meu lado para mais ninguém..."
10133-101330900 = "De todo modo, obrigada por me ajudar hoje."
10133-101330910 = "Tenha um bom descanso."
