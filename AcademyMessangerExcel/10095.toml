[translation]
10095-100950010 = "Здравствуйте, Сенсей."
10095-100950020 = "Ты... сегодня занят?"
10095-100950030 = "Да, но буду неподалёку."
10095-100950040 = "Вообще-то у меня дела в Миллениуме."
10095-100950050 = "А? Ты..."
10095-100950060 = "Ты будешь в Миллениуме?"
10095-100950070 = "Ага! Именно!"
10095-100950080 = "П-понятно..."
10095-100950090 = "Эм, Сенсей?"
10095-100950100 = "Тогда, если ты не против..."
10095-100950110 = "И только если у тебя будет свободное время!"
10095-100950120 = "Я была бы очень рада,"
10095-100950130 = "если бы ты заглянул в клубную комнату..."
10095-100950140 = "Эм, Сенсей?"
10095-100950150 = "Информация о выставке, которую ты только что прислал..."
10095-100950160 = "Да. Это выставка классического искусства моды."
10095-100950170 = "Я подумал, тебе может пригодиться."
10095-100950180 = "Спасибо!"
10095-100950190 = "Эм, случайно..."
10095-100950200 = "Правда, совершенно случайно,"
10095-100950210 = "на эту выставку..."
10095-100950220 = "Мы можем... сходить вместе, Сенсей?"
10095-100950230 = "Почему бы и нет? У нас ведь два билета."
10095-100950240 = "Правда?!"
10095-100950250 = "Спасибо!"
10095-100950260 = "Я буду ждать... хорошо?"
10095-100950270 = "Ты здесь, Мастер?"
10095-100950280 = "Прекрати!"
10095-100950290 = "Ах! Прости, Сенсей."
10095-100950300 = "Я слишком привыкла к этому обращению..."
10095-100950310 = "Как преподавателю... мне... нормально так?"
10095-100950320 = "В-вполне нормально!"
10095-100950330 = "...Наверное."
10095-100950340 = "Ну что ж, Мастер."
10095-100950350 = "Нет! Сенсей!"
10095-100950360 = "Ты... сегодня тоже придёшь, да?"
10095-100950370 = "Сенсей?"
10095-100950380 = "Ты здесь...?"
10095-100950390 = "Как продвигается работа над иллюстрацией?"
10095-100950400 = "А?"
10095-100950410 = "Да."
10095-100950420 = "Благодаря тебе."
10095-100950430 = "Что важнее, если ты не против..."
10095-100950440 = "Насчёт рисунка..."
10095-100950450 = "Ты потерял оригинал? Нужна ещё одна копия?"
10095-100950460 = "Нет-нет! Я бы его не потеряла."
10095-100950470 = "Просто..."
10095-100950480 = "Эм, и только если ты не против, Сенсей."
10095-100950490 = "Ты... сохранишь его? Навсегда?"
10095-100950500 = "Да... Навсегда."
