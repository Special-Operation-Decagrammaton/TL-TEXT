[translation]
10095-100950010 = "Olá, Sensei."
10095-100950020 = "Hum... você está ocupado hoje?"
10095-100950030 = "Ocupado, digamos que..."
10095-100950040 = "Estou com um trabalho na Millennium, então se precisar de algo posso ir aí rapidinho."
10095-100950050 = "!"
10095-100950060 = "E-Entendi...!"
10095-100950070 = "Aconteceu alguma coisa?"
10095-100950080 = "Hum..."
10095-100950090 = "Se não for incômodo,"
10095-100950100 = "quer dizer, só se sobrar um tempinho mesmo,"
10095-100950110 = "você poderia dar uma passada na sala do clube?"
10095-100950120 = "Pode ser a qualquer hora."
10095-100950130 = "Vou ficar na sala do clube o dia todo hoje...!"
10095-100950140 = "Sensei?"
10095-100950150 = "Sobre as informações da exposição que você acabou de me mandar..."
10095-100950160 = "Sim, parece que vai ter uma exposição de arte de figurinos,"
10095-100950170 = "e achei que poderia ser útil pra você, Midori."
10095-100950180 = "Muito obrigada!"
10095-100950190 = "Hum..."
10095-100950200 = "Se não se importar..."
10095-100950210 = "S-Só se você estiver a fim mesmo, claro,"
10095-100950220 = "mas será que... você poderia ir a essa exposição... junto comigo, Sensei...?"
10095-100950230 = "Vamos sim. Por coincidência eu tenho dois ingressos aqui."
10095-100950240 = "S-Sério!?"
10095-100950250 = "Muito obrigada!"
10095-100950260 = "E-Eu... posso ficar criando expectativas, então, né?"
10095-100950270 = "Mestre, você está aí?"
10095-100950280 = "Eu não sou seu Mestre!?"
10095-100950290 = "Ah, desculpe, Sensei."
10095-100950300 = "Acho que chamar você assim está virando um hábito..."
10095-100950310 = "Talvez eu seja um fracasso como professor..."
10095-100950320 = "I-Isso não é verdade!"
10095-100950330 = "...Eu acho."
10095-100950340 = "Sendo assim, Mestre..."
10095-100950350 = "Quer dizer, Sensei,"
10095-100950360 = "você vem na sala do clube hoje também...?"
10095-100950370 = "Sensei?"
10095-100950380 = "Você pode falar agora...?"
10095-100950390 = "As ilustrações estão indo bem?"
10095-100950400 = "Hã?"
10095-100950410 = "S-Sim!"
10095-100950420 = "Graças a você, Sensei."
10095-100950430 = "Hum... É sobre a foto de hoje."
10095-100950440 = "Se você não se importar..."
10095-100950450 = "Apagou sem querer? Quer que eu mande de novo?"
10095-100950460 = "N-Não!"
10095-100950470 = "Não é isso."
10095-100950480 = "Hum..."
10095-100950490 = "Se possível, eu queria que você guardasse ela... para sempre."
10095-100950500 = "Sempre pertinho de você, Sensei."
