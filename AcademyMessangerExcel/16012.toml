[translation]
16012-160120010 = "Sensei, você tá ocupado hoje?"
16012-160120020 = "Se tiver um tempinho, pode dar uma passada lá onde eu faço bico?"
16012-160120030 = "Se não me engano...... o nome era \"L'Oiseau Bleu\", né?"
16012-160120040 = "Isso mesmo. Aliás, mandou bem de lembrar o nome!"
16012-160120050 = "Tem uma coisa que eu quero te mostrar, Sensei"
16012-160120060 = "Tô te esperando, então vê se vem mesmo!"
16012-160120070 = "Sensei, Sensei!"
16012-160120080 = "Caiu o pagamento do meu bico!"
16012-160120090 = "Fruto do seu esforço, Junko"
16012-160120100 = "Pois é! E sendo assim......"
16012-160120110 = "Chegou a hora do troco!"
16012-160120120 = "......Como assim?"
16012-160120130 = "P-Por favor, poupe ao menos a minha vida......"
16012-160120140 = "Hehe, aguarde e verá"
16012-160120150 = "Não fala desse jeito ameaçador!"
16012-160120160 = "Enfim"
16012-160120170 = "Quando chegar o fim da tarde, vem pra rua do festival"
16012-160120180 = "Sem falta, hein!"
16012-160120190 = "O feriado prolongado"
16012-160120200 = "Acabou"
16012-160120210 = "Acabou de vez......"
16012-160120220 = "C-Calma, Junko. Tecnicamente o feriado vai até amanhã"
16012-160120230 = "Eu sei disso!"
16012-160120240 = "Mas dentro do meu coração o feriado já morreu! Não está mais entre nós!"
16012-160120250 = "Nem nas minhas costas, nem no meu peito ele vai continuar vivendo junto comigo!"
16012-160120260 = "Mas nem por isso eu posso deixar que ele termine desse jeito!"
