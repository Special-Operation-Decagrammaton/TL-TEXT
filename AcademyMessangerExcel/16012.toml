[translation]
16012-160120010 = "Эй, Сенсей! Ты сегодня занят?"
16012-160120020 = "Если нет, загляни ко мне на работу!"
16012-160120030 = "О, где это было? L'Oiseau Bleu?"
16012-160120040 = "Ага, точно!"
16012-160120050 = "Хочу кое-что тебе показать."
16012-160120060 = "Буду ждать!"
16012-160120070 = "Сенсей, Сенсей!"
16012-160120080 = "Мне выдали зарплату!"
16012-160120090 = "Поздравляю! Ты заслужила."
16012-160120100 = "Так что теперь..."
16012-160120110 = "пришло время рассчитаться!"
16012-160120120 = "...Что именно ты имеешь в виду?"
16012-160120130 = "Пожалуйста, не делай мне больно..."
16012-160120140 = "Хи-хи, увидишь!"
16012-160120150 = "Но ничего странного не будет."
16012-160120160 = "Тебе ведь интересно, правда?"
16012-160120170 = "Тогда приходи вечером на фестивальную улицу."
16012-160120180 = "Обещай!"
16012-160120190 = "Праздник..."
16012-160120200 = "Праздник закончился."
16012-160120210 = "Всё кончено."
16012-160120220 = "Джунко, успокойся. У тебя ещё один день."
16012-160120230 = "Я знаю!"
16012-160120240 = "Но в моей душе он уже ушёл... исчез..."
16012-160120250 = "Какой смысл, если я больше не чувствую праздничного настроения?"
16012-160120260 = "Мой драгоценный праздник не может вот так исчезнуть!"
