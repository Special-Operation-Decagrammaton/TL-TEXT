[translation]
16012-160120010 = "Сенсей, вы сегодня заняты?"
16012-160120020 = "Если есть время, не зайдёте ко мне на подработку?"
16012-160120030 = "Кажется... это «Рувазо-Бюре», да?"
16012-160120040 = "Ага. Вы и правда запомнил."
16012-160120050 = "У меня есть кое-что, что я хочу показать вам, Сенсей."
16012-160120060 = "Я буду ждать, так что обязательно придите!"
16012-160120070 = "Сенсей, Сенсей!"
16012-160120080 = "Я получила зарплату за подработку!"
16012-160120090 = "Это потому, что Джунко старалась."
16012-160120100 = "Ну да! И поэтому..."
16012-160120110 = "Время отплатить!"
16012-160120120 = "...В каком смысле?"
16012-160120130 = "П-пощадите, только не убивайте..."
16012-160120140 = "Хе-хе, смотрите."
16012-160120150 = "Не говорите таких страшных вещей!"
16012-160120160 = "В общем."
16012-160120170 = "Приходите вечером на Фестивальную улицу."
16012-160120180 = "Обязательно!"
16012-160120190 = "Выходные"
16012-160120200 = "закончились."
16012-160120210 = "Закончились..."
16012-160120220 = "У-успокойся, Джунко. Выходные ведь ещё до завтра."
16012-160120230 = "Я знаю!"
16012-160120240 = "Но в моём сердце выходные уже умерли! Их больше нет!"
16012-160120250 = "Они не продолжают жить единым целым ни в моей спине, ни в груди!"
16012-160120260 = "Но это не значит, что я позволю всему закончиться просто так!"