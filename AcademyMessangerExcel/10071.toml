[translation]
10071-100710010 = "Сенсей, не могли бы вы уделить мне немного времени?"
10071-100710020 = "Скоро лето, и становится всё жарче."
10071-100710030 = "Я подбираю снаряжение под сезон, чтобы оно не мешало операциям СРТ, но..."
10071-100710040 = "есть моменты, в которых мне трудно принять решение, и я хотела бы посоветоваться с вами."
10071-100710050 = "Если ты, Мияко, хочешь посоветоваться, я всегда готов тебя выслушать."
10071-100710060 = "Спасибо, что согласились."
10071-100710070 = "Я пришлю координаты, так что жду вас там."
10071-100710080 = "Тогда я буду ждать в точке рандеву."
10071-100710090 = "Выполняя эту операцию, я поняла..."
10071-100710100 = "что подготовка СРТ в основном ориентирована на наземные действия,"
10071-100710110 = "и нам не хватает навыков для морских операций."
10071-100710120 = "Ты, Мияко, и так хорошо стараешься."
10071-100710130 = "...Спасибо."
10071-100710140 = "Но я осознаю свою неопытность."
10071-100710150 = "У меня к вам внезапная просьба..."
10071-100710160 = "Я хочу провести тренировку по спасению заложников на море,"
10071-100710170 = "и мне нужна ваша помощь."
10071-100710180 = "Да, конечно."
10071-100710190 = "Спасибо."
10071-100710200 = "Тогда я буду ждать вас на причале к востоку от деревни."
10071-100710210 = "Сенсей, вы слышали?"
10071-100710220 = "Говорят, с западного побережья деревни есть остров, до которого можно дойти пешком."
10071-100710230 = "По воде...?"
10071-100710240 = "Да. Говорят, западный берег мелкий, и"
10071-100710250 = "когда вода отступает, появляется дорога, ведущая к острову."
10071-100710260 = "Звучит интересно."
10071-100710270 = "Я тоже так подумала. И ещё — виды на острове красивые, и жители часто ходят туда отдыхать по выходным."
10071-100710280 = "Если вы не против,"
10071-100710290 = "не составите ли вы мне компанию?"
10071-100710300 = "Конечно, с удовольствием."
10071-100710310 = "Спасибо, Сенсей."
10071-100710320 = "Тогда завтра, к отливу, встретимся у причала."
10071-100710330 = "Это RABBIT1. Докладываю обстановку."
10071-100710340 = "Текущее время 06:00. Раненых нет, продолжаем –"
10071-100710350 = "Ах..."
10071-100710360 = "Простите за такое время."
10071-100710370 = "Я ошиблась адресатом..."
10071-100710380 = "Всё в порядке, не волнуйтесь."
10071-100710390 = "Тем более, вы встаёте в такую рань."
10071-100710400 = "Да. Регулярный распорядок — основа для спецподразделения."
10071-100710410 = "За исключением дней с ночными операциями и когда я плохо себя чувствую, я каждый день в это время привожу в порядок журналы..."
10071-100710420 = "А ещё бегаю по утрам, делаю лёгкую разминку и разминаю тело."
10071-100710430 = "Ты удивительная, Мияко."
10071-100710440 = "Хе-хе. Сначала это может быть немного утомительно, но если войдёт в привычку — ничего сложного."
10071-100710450 = "Более того, когда я пропускаю утреннюю пробежку, я чувствую тяжесть в теле."
