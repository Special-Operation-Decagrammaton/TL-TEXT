[translation]
10071-100710010 = "Sensei, você teria um momento?"
10071-100710020 = "Como o verão já está chegando e os dias estão ficando cada vez mais quentes,"
10071-100710030 = "estamos preparando equipamentos adequados à estação para não prejudicar as operações da SRT, mas..."
10071-100710040 = "Há alguns pontos que são difíceis de decidir sozinha, então eu gostaria de pedir a sua opinião."
10071-100710050 = "Se você precisa de um conselho, Miyako, pode contar comigo a qualquer hora."
10071-100710060 = "Muito obrigada por aceitar tão prontamente."
10071-100710070 = "Vou enviar as coordenadas, por favor venha até este local."
10071-100710080 = "Estarei aguardando no ponto de encontro."
10071-100710090 = "Estive pensando durante a execução desta operação..."
10071-100710100 = "Como a maior parte do treinamento da SRT é voltada para combates em terra,"
10071-100710110 = "sinto que nos falta preparo para lidar com operações marítimas."
10071-100710120 = "Você já está se esforçando mais do que o suficiente, Miyako."
10071-100710130 = "...Muito obrigada."
10071-100710140 = "Ainda assim, tenho consciência da minha falta de experiência."
10071-100710150 = "Sei que é um pedido repentino, mas..."
10071-100710160 = "Gostaria de realizar um treinamento simulando um resgate de reféns no mar."
10071-100710170 = "Você poderia cooperar comigo nisso, Sensei?"
10071-100710180 = "Sim, claro."
10071-100710190 = "Muito obrigada."
10071-100710200 = "Estarei esperando por você no píer ao leste da vila."
10071-100710210 = "Sensei, você ficou sabendo?"
10071-100710220 = "Disseram que há uma pequena ilha afastada na qual dá para ir andando a partir da costa oeste da vila."
10071-100710230 = "Andando sobre o mar...?"
10071-100710240 = "Sim. Como a água na costa oeste é bem rasa,"
10071-100710250 = "ouvi dizer que, quando a maré baixa, surge um caminho ligando a praia até a ilha."
10071-100710260 = "Parece bem interessante."
10071-100710270 = "Eu também achei. Além disso, a vista da ilha é linda, então parece que os moradores costumam passear bastante por lá nos dias de folga."
10071-100710280 = "Se você quiser, Sensei,"
10071-100710290 = "gostaria de ir lá comigo?"
10071-100710300 = "Claro, com todo o prazer."
10071-100710310 = "Muito obrigada, Sensei."
10071-100710320 = "Então nos encontramos amanhã em frente ao píer, no horário da maré baixa."
10071-100710330 = "Aqui é RABBIT 1. Reportando a situação."
10071-100710340 = "Horário atual: 0600. Zero baixas, prosseguindo com—"
10071-100710350 = "Ah..."
10071-100710360 = "Perdão pela mensagem a uma hora dessas."
10071-100710370 = "Acabei enviando para o contato errado..."
10071-100710380 = "Tudo bem, não esquenta."
10071-100710390 = "Mas nossa, você já está acordada tão cedo assim?"
10071-100710400 = "Sim. Manter uma rotina regrada é o básico para qualquer unidade de forças especiais."
10071-100710410 = "Exceto em dias de operações noturnas ou quando não estou me sentindo bem, todos os dias neste horário eu organizo o diário de bordo..."
10071-100710420 = "Depois, faço uma corrida matinal e alguns exercícios leves para alongar o corpo."
10071-100710430 = "Você é incrível mesmo, Miyako..."
10071-100710440 = "Hehe. No começo pode parecer um pouco trabalhoso, mas depois que vira hábito, é super tranquilo."
10071-100710450 = "Na verdade, nos dias em que não consigo fazer a minha corrida matinal, chego até a sentir o corpo pesado."
