[translation]
10071-100710010 = "Сенсей, вы сегодня свободны?"
10071-100710020 = "Погода становится теплее, скоро лето."
10071-100710030 = "Мне нужно обновить запасы вооружения и снаряжения, чтобы смена погоды не мешала операциям..."
10071-100710040 = "Но есть кое-что, в чём я не уверена, поэтому хотела спросить твоего совета."
10071-100710050 = "Для тебя у меня всегда найдётся время."
10071-100710060 = "Спасибо за понимание."
10071-100710070 = "Скоро пришлю координаты."
10071-100710080 = "Встретимся в точке сбора."
10071-100710090 = "Во время этой миссии я почувствовала..."
10071-100710100 = "Поскольку подготовка SRT сосредоточена на наземных операциях,"
10071-100710110 = "мы не очень хорошо справляемся с действиями на море."
10071-100710120 = "Мияко, ты отлично справляешься."
10071-100710130 = "Спасибо..."
10071-100710140 = "Но я прекрасно осознаю свои недостатки."
10071-100710150 = "И это возвращает меня к сути."
10071-100710160 = "Я планирую провести учения по спасению заложников на море."
10071-100710170 = "Сможешь помочь нам с этим?"
10071-100710180 = "Эм, конечно."
10071-100710190 = "Спасибо, Сенсей."
10071-100710200 = "Буду ждать тебя у доков на восточной стороне города."
10071-100710210 = "Сенсей, ты слышал?"
10071-100710220 = "У западного побережья города есть остров, до которого можно дойти пешком."
10071-100710230 = "Остров, до которого можно дойти пешком?"
10071-100710240 = "Да. Во время отлива вода отступает и открывает путь."
10071-100710250 = "И в это время можно пешком дойти до острова."
10071-100710260 = "Потрясающе."
10071-100710270 = "Да. И там красивые виды, поэтому местные ходят туда в выходные."
10071-100710280 = "Если ты не против..."
10071-100710290 = "хочешь сходить со мной на остров?"
10071-100710300 = "Хорошо."
10071-100710310 = "Спасибо, Сенсей."
10071-100710320 = "Встретимся завтра у пристани, когда вода отступит."
10071-100710330 = "Это RABBIT 1. Доклад о состоянии Отряда RABBIT."
10071-100710340 = "Текущее время — 0600. Все члены отряда на месте."
10071-100710350 = "А."
10071-100710360 = "Надеюсь, я тебя не разбудила, Сенсей."
10071-100710370 = "Похоже, я случайно отправила тебе доклад Отряда RABBIT..."
10071-100710380 = "Ничего. Не переживай."
10071-100710390 = "Ты так рано просыпаешься."
10071-100710400 = "Строгий режим критически важен для спецназа."
10071-100710410 = "Если я не болею и не была на ночной операции, всегда просыпаюсь в это время и привожу записи в порядок."
10071-100710420 = "А потом иду на утреннюю прогулку или делаю упражнения, чтобы размяться."
10071-100710430 = "Очень впечатляет."
10071-100710440 = "Хи-хи. Нужно немного привыкнуть, но когда входит в привычку, ничего особенного."
10071-100710450 = "Сейчас я чувствую себя вяло, если пропускаю утренние упражнения."
