[translation]
26006-260060010 = "Насколько вы верите в гороскопы, Сенсей?"
26006-260060020 = "Довольно сильно."
26006-260060030 = "Наверное, не очень..."
26006-260060040 = "Вот как. Тогда в следующий раз расскажите мне, какой гороскоп вы смотрите!"
26006-260060050 = "Правда? Я рекомендую «Гороскоп на сегодня» в ежедневном Кивотосе."
26006-260060060 = "Этот гороскоп ещё ни разу не ошибался!"
26006-260060070 = "Согласно гороскопу, у меня сегодня отличная финансовая удача!"
26006-260060080 = "Впервые с тех пор, как я в Особом классе, у меня был хороший прогноз на финансы...!"
26006-260060090 = "Хе-хе, я уже в предвкушении!"
26006-260060100 = "Хорошо бы, чтобы случилось что-то хорошее."
26006-260060110 = "Да!"
26006-260060120 = "У-у, я не доела те дорогие сладости, и они не дают мне спать..."
26006-260060130 = "А ведь была такая удача, я упустила шанс... какая досада..."
26006-260060140 = "В следующий раз я угощу тебя в том же кафе."
26006-260060150 = "Н-нет! Если вы так пообещаете, я..."
26006-260060160 = "я не смогу уснуть до того, как мы туда сходим!"
26006-260060170 = "Сенсей, вы сегодня весь день будете в Шале?"
26006-260060180 = "Да, планирую. А что, есть дело?"
26006-260060190 = "Нет, ничего, сейчас нет."
26006-260060200 = "Просто спросила, хе-хе."
26006-260060210 = "???"
26006-260060220 = "Сенсей, вы слышали?"
26006-260060230 = "Метеорный поток, метеорный поток!"
26006-260060240 = "Метеорный поток?"
26006-260060250 = "Да, я видела в новостях, что в полнолуние можно будет увидеть метеорный поток Леониды!"
26006-260060260 = "И к тому же, говорят, что этот поток Леонид будет виден даже в автономном районе Красной Зимы!"
26006-260060270 = "В прошлый раз метеорный поток было не видно, и это было так обидно, но теперь...!"
26006-260060280 = "Интересно, насколько это красиво, если увидеть своими глазами?"
26006-260060290 = "Я уже с нетерпением жду!"
26006-260060300 = "Сенсей! Говорят, пик потока сегодня в 11 вечера!"
26006-260060310 = "Так что приходите до этого времени!"
26006-260060320 = "Хорошо, я постараюсь прийти за час до."
26006-260060330 = "Не опаздывайте!"
26006-260060340 = "Ладно-ладно."
26006-260060350 = "Обязательно! Обязательно!"
26006-260060360 = "Какая погода вам нравится, Сенсей?"
26006-260060370 = "Наверное, солнечная."
26006-260060380 = "Наверное, дождливая."
26006-260060390 = "Понятно, много людей любят солнечные дни."
26006-260060400 = "Мне кажется, дождь не так популярен, как солнце, но у него тоже есть поклонники."
26006-260060410 = "Я люблю и ясное безоблачное небо, и мелкий дождик..."
26006-260060420 = "Но на самом деле больше всего я люблю небо, полностью покрытое облаками!"
26006-260060440 = "Посмотрите, Сенсей!"
26006-260060450 = "Вот фотография, которую я обещала. Как вам?"
26006-260060460 = "Очень красиво."
26006-260060470 = "Да, правда! Я люблю облачные дни именно из-за таких пейзажей."
26006-260060480 = "Было бы ещё лучше, если бы мы пошли вместе..."
26006-260060490 = "Н-не обращайте внимания на то, что я только что написала!"