[translation]
26006-260060010 = "Вы верите в гороскопы, Сенсей?"
26006-260060020 = "Думаю, доля правды в них есть."
26006-260060030 = "Я так не думаю..."
26006-260060040 = "Понятно. Потом расскажите мне свой гороскоп, Сенсей!"
26006-260060050 = "Правда? Тогда давайте посмотрим ежедневный гороскоп в газете!"
26006-260060060 = "Здесь гороскопы ещё ни разу не ошибались!"
26006-260060070 = "По моему гороскопу меня ждут деньги!"
26006-260060080 = "Такого гороскопа у меня не было с тех пор, как я вступила в Спецотряд № 227..."
26006-260060090 = "Не могу дождаться!"
26006-260060100 = "Надеюсь, случится что-нибудь хорошее."
26006-260060110 = "Вот и я о том!"
26006-260060120 = "Ах... Не могу уснуть, потому что всё думаю о том дорогом десерте, который не доела."
26006-260060130 = "Не могу поверить, что не смогла доесть... Так грустно."
26006-260060140 = "В следующий раз куплю тебе сладостей из L'Oiseau Bleu."
26006-260060150 = "Нет! Если вы так скажете..."
26006-260060160 = "я вообще не смогу уснуть!"
26006-260060170 = "Вы сегодня останетесь в Шале, Сенсей?"
26006-260060180 = "Да, буду здесь. Тебе что-то нужно?"
26006-260060190 = "Нет, ничего."
26006-260060200 = "Просто захотелось спросить. Хи-хи."
26006-260060210 = "???"
26006-260060220 = "Вы слышали новости, Сенсей?"
26006-260060230 = "Будет метеорный дождь! Метеорный дождь!"
26006-260060240 = "...Метеорный дождь?"
26006-260060250 = "Да, я прочитала в газете: в следующее полнолуние будет метеорный поток Леониды!"
26006-260060260 = "Самое лучшее — его будет видно из района Академии Красная Зима."
26006-260060270 = "Прошлый метеорный дождь отсюда не было видно, и я очень расстроилась."
26006-260060280 = "Наверняка вживую это очень красиво!"
26006-260060290 = "Я уже в предвкушении!"
26006-260060300 = "Сенсей! Пик метеорного дождя будет сегодня в одиннадцать вечера!"
26006-260060310 = "Вы должны прийти до этого!"
26006-260060320 = "Знаю. Приду за час, чтобы времени хватило."
26006-260060330 = "Только не опаздывайте!"
26006-260060340 = "Я же сказал, знаю..."
26006-260060350 = "Вот и не опаздывайте! Хорошо?!"
26006-260060360 = "Какую погоду вы любите, Сенсей?"
26006-260060370 = "Солнечные дни."
26006-260060380 = "Дождливые дни."
26006-260060390 = "Довольно обычно. Все любят солнечные дни."
26006-260060400 = "Это не так распространено, но, похоже, многим нравятся дождливые дни."
26006-260060410 = "Солнечные дни с ясным небом прекрасны, но и дождливые тоже..."
26006-260060420 = "Но больше всего я люблю дни, когда всё небо в облаках!"
26006-260060440 = "Посмотрите, Сенсей."
26006-260060450 = "Я сделала красивую фотографию, чтобы показать вам. Что думаете?"
26006-260060460 = "Какое красивое небо."
26006-260060470 = "Правда? Вот почему я люблю облачные дни."
26006-260060480 = "Было бы здорово, если бы вы были там со мной..."
26006-260060490 = "Погодите... забудьте моё последнее сообщение!"
