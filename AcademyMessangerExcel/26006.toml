[translation]
26006-260060010 = "Sensei, o quanto você acredita em horóscopo e adivinhação?"
26006-260060020 = "Acredito bastante."
26006-260060030 = "Acho que não sou muito de acreditar..."
26006-260060040 = "Ah, é mesmo? Qualquer dia me conta qual horóscopo você costuma acompanhar, Sensei!"
26006-260060050 = "Sério? Eu super recomendo a coluna 'Sorte de Hoje' do Diário de Kivotos!"
26006-260060060 = "Aquele horóscopo nunca errou uma vez sequer!"
26006-260060070 = "Segundo a 'Sorte de Hoje', a minha sorte para dinheiro está nas alturas!"
26006-260060080 = "Desde que vim para a Classe Especial, é a primeira vez que tiro sorte alta para finanças...!"
26006-260060090 = "Hehe, mal posso esperar para ver o que vai acontecer!"
26006-260060100 = "Tomara que aconteça alguma coisa boa."
26006-260060110 = "Sim!"
26006-260060120 = "Uugh, aqueles doces de luxo que não aguentei comer tudo e acabei deixando no prato não saem da minha cabeça, não consigo nem dormir..."
26006-260060130 = "Logo hoje que eu estava com sorte para dinheiro, desperdicei a oportunidade... Que pecado..."
26006-260060140 = "Da próxima vez eu te levo na mesma loja por minha conta."
26006-260060150 = "N-não pode! S-se você me fizer uma promessa dessas..."
26006-260060160 = "Eu não vou conseguir pregar o olho nenhum dia até a gente ir nessa loja de novo!"
26006-260060170 = "Sensei, você vai ficar na Schale o dia todo hoje?"
26006-260060180 = "Sim, é o plano. Precisa de alguma coisa?"
26006-260060190 = "Não, tudo bem, não é nada em especial por enquanto."
26006-260060200 = "Só perguntei por curiosidade mesmo, ehehe."
26006-260060210 = "???"
26006-260060220 = "Sensei, você ficou sabendo?"
26006-260060230 = "Chuva de meteoros, Sensei! Uma chuva de meteoros!"
26006-260060240 = "Chuva de meteoros?"
26006-260060250 = "Sim! Vi no noticiário que na próxima noite de lua cheia vai dar para ver a chuva de meteoros Leônidas!"
26006-260060260 = "E ainda por cima, disseram que desta vez ela vai ser visível aqui no distrito autônomo da Red Winter também!"
26006-260060270 = "Da última vez foi uma pena enorme porque não deu para observar daqui, mas agora vai...!"
26006-260060280 = "Quão linda será que ela é vista pessoalmente?"
26006-260060290 = "Já estou contando os segundos!"
26006-260060300 = "Sensei! Parece que o pico da chuva de meteoros hoje à noite vai ser às 11 horas!"
26006-260060310 = "Por isso, chegue antes desse horário, viu?"
26006-260060320 = "Combinado, vou chegar com uma hora de antecedência para garantir."
26006-260060330 = "Não pode se atrasar de jeito nenhum!"
26006-260060340 = "Tá bom, tá bom."
26006-260060350 = "É promessa, hein! Sem falta!"
26006-260060360 = "Sensei, de que tipo de clima você mais gosta?"
26006-260060370 = "Acho que dias de sol."
26006-260060380 = "Acho que dias de chuva."
26006-260060390 = "Entendo, muita gente gosta de dias ensolarados mesmo, né?"
26006-260060400 = "Tenho a impressão de que não são tantos quanto os que preferem sol, mas a chuva também tem seus fãs, né?"
26006-260060410 = "Eu gosto tanto do céu limpo sem nenhuma nuvem quanto da chuvinha caindo de mansinho, mas..."
26006-260060420 = "Na verdade, o que eu mais amo é um céu inteirinho coberto de nuvens!"
26006-260060440 = "Olhe só, Sensei!"
26006-260060450 = "É a foto que prometi tirar. O que acha?"
26006-260060460 = "Ficou linda demais."
26006-260060470 = "Não é?! É por amar paisagens assim que eu gosto tanto de dias nublados."
26006-260060480 = "Teria sido ainda melhor se você tivesse ido comigo, Sensei..."
26006-260060490 = "E-esqueça essa última mensagem, por favor!"
