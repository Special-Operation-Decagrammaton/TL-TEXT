[translation]
10124-101240010 = "Sensei."
10124-101240020 = "Ficou decidido que iremos ao mar como parte das atividades do Comitê de Realização da Justiça."
10124-101240030 = "...Achei prudente informá-lo com antecedência."
10124-101240040 = "É verão! É praia!"
10124-101240050 = "É roupa de banho!!!"
10124-101240060 = "...Compreendo."
10124-101240070 = "Receio que esteja havendo algum mal-entendido, mas..."
10124-101240080 = "Isso é estritamente parte das atividades oficiais do Comitê de Realização da Justiça."
10124-101240090 = "Ah, desculpa..."
10124-101240100 = "Como é praia no verão, achei que vocês iam aproveitar para relaxar um pouco..."
10124-101240110 = "...Se é assim,"
10124-101240120 = "poderia me conceder um momento do seu tempo? Irei até aí explicar pessoalmente."
10124-101240130 = "Sensei."
10124-101240140 = "Perdoe-me pelo meu comportamento agora há pouco."
10124-101240150 = "Daqui a uma semana, mostrarei os \"resultados\"."
10124-101240160 = "Ah, tá bom. Boa... sorte?"
10124-101240170 = "Não entendi muito bem, mas estou na torcida!"
10124-101240180 = "Sim."
10124-101240190 = "Garanto que jamais, sob nenhuma circunstância, deixarei que se decepcione comigo, Sensei."
10124-101240200 = "Finalmente... este dia chegou."
10124-101240210 = "Hasumi?"
10124-101240220 = "Uma semana..."
10124-101240230 = "Normalmente... passa num piscar de olhos, mas..."
10124-101240240 = "É a primeira vez... que sinto sete dias durarem uma eternidade."
10124-101240250 = "Eu, Hanekawa Hasumi, já estou preparada para tudo."
10124-101240260 = "...Pode vir quando quiser."
10124-101240270 = "Hã? T-Tá bom..."
10124-101240280 = "Já estou indo!"
10124-101240290 = "Sensei."
10124-101240300 = "Muito obrigada por me acompanhar hoje."
10124-101240310 = "Você está bem mesmo...?"
10124-101240320 = "Estou bem, sim."
10124-101240330 = "Ainda resta algum tempo até o dia de irmos à praia."
10124-101240340 = "N-Não vá forçar demais a barra..."
10124-101240350 = "Força aí..."
10124-101240360 = "Agradeço o apoio."
10124-101240370 = "Desta vez... provarei claramente até onde sou capaz de chegar."
10124-101240380 = "Não precisa levar como questão de vida ou morte..."
10124-101240390 = "Cuidado para não exagerar...!"
10124-101240400 = "Pois bem, nos vemos na praia."
10124-101240410 = "Finalmente... este dia chegou."
10124-101240420 = "E o tamanho do traje de banho também serviu perfeitamente."
10124-101240430 = "Você se esforçou pra valer, né, Hasumi?"
10124-101240440 = "Incrível... Você é incrível demais...!"
10124-101240450 = "Sim, de fato..."
10124-101240460 = "Cortar os lanches durante o expediente já era esperado..."
10124-101240470 = "Mas foram dias amargos resistindo até à sobremesa depois das refeições..."
10124-101240480 = "Tive que recusar com dor no coração o rocambole que recebi da Tea Party..."
10124-101240490 = "E suportei até a provação de abrir mão do bolo em edição limitada da Miracle 5000 que eu nunca havia provado...!"
10124-101240500 = "H-Hasumi...?"
10124-101240510 = "Calma! A linha de chegada já está bem na sua frente!"
10124-101240520 = "...Peço perdão."
10124-101240530 = "Parece que perdi um pouco a compostura."
10124-101240540 = "Muito obrigada pelo dia de hoje, de verdade."
10124-101240550 = "Parece que... eu sempre acabo mostrando esse meu lado vulnerável na sua frente, Sensei."
10124-101240560 = "A sua saúde vem sempre em primeiro lugar."
10124-101240570 = "Sempre que quiser sair para se divertir de novo, é só me chamar!"
10124-101240580 = "Sim, muito obrigada."
10124-101240590 = "Sensei."
10124-101240600 = "Você disse que eu poderia chamá-lo a qualquer momento, mas..."
10124-101240610 = "Que sincronia! Consegue vir até a praia agora?"
10124-101240620 = "Poderia vir até a praia esta noite?"
10124-101240630 = "...Pois não?"
10124-101240640 = "Compreendido."
10124-101240650 = "Estou a caminho."
10124-101240660 = "Sensei."
10124-101240670 = "Tenho certeza de que jamais esquecerei este verão."
10124-101240680 = "Que ótimo!"
10124-101240690 = "Eu também me diverti muito!"
10124-101240700 = "Foi a primeira vez que aproveitei tanto a estação do \"verão\"."
10124-101240710 = "Muito obrigada por me proporcionar lembranças tão especiais."
10124-101240720 = "Para mim também foi divertido do começo ao fim."
10124-101240730 = "Hehe..."
10124-101240740 = "Tanto o treino de natação... quanto o jantar que você me pagou..."
10124-101240750 = "E a beleza dos fogos de artifício..."
10124-101240760 = "Guardarei na memória tudo o que aconteceu neste verão... hehe."
