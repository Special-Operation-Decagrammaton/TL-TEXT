[translation]
10124-101240010 = "Сенсей."
10124-101240020 = "Комитет справедливости отправляется на пляж."
10124-101240030 = "Я просто решила сообщить вам."
10124-101240040 = "Ура! Пляж!"
10124-101240050 = "Ура! Купальник!"
10124-101240060 = "Что...?"
10124-101240070 = "Ах, понятно. Возникло серьёзное недоразумение."
10124-101240080 = "Это не беззаботный отпуск. Мы отправляемся по официальным делам Комитета справедливости."
10124-101240090 = "Ах, прошу прощения..."
10124-101240100 = "Какая жалость..."
10124-101240110 = "...Мне стоило сразу дать вам контекст."
10124-101240120 = "Когда вы будете свободны? Я зайду в удобное для вас время."
10124-101240130 = "Сенсей."
10124-101240140 = "Хотя сегодня я была недостаточно подготовлена..."
10124-101240150 = "на следующей неделе всё будет иначе."
10124-101240160 = "Эм, ладно. Старайся."
10124-101240170 = "Я всё ещё ничего не понимаю, но удачи."
10124-101240180 = "Да."
10124-101240190 = "Обещаю, я вас не разочарую."
10124-101240200 = "Наконец этот день настал."
10124-101240210 = "Хасуми?"
10124-101240220 = "Неделя."
10124-101240230 = "По сравнению с самой жизнью это ничто."
10124-101240240 = "Но это действительно была самая долгая неделя в моей жизни."
10124-101240250 = "Я, Ханэкава Хасуми, готова."
10124-101240260 = "Я готова ко всему в любой момент."
10124-101240270 = "Скоро буду."
10124-101240280 = "...? Х-хорошо."
10124-101240290 = "Сенсей."
10124-101240300 = "Спасибо, что сегодня пошли со мной за покупками."
10124-101240310 = "Ты точно в порядке...?"
10124-101240320 = "Да."
10124-101240330 = "До поездки на пляж ещё достаточно времени."
10124-101240340 = "Не переусердствуй..."
10124-101240350 = "Держись..."
10124-101240360 = "Спасибо."
10124-101240370 = "Я покажу всё, на что способна."
10124-101240380 = "Ты слишком серьёзно к этому относишься..."
10124-101240390 = "Пожалуйста, не выкладывайся на полную..."
10124-101240400 = "Увидимся на пляже, Сенсей."
10124-101240410 = "Мы наконец добрались."
10124-101240420 = "И купальник мне подходит."
10124-101240430 = "Хорошая работа, Хасуми."
10124-101240440 = "Невероятно... Невероятная работа!"
10124-101240450 = "Да. Это было очень..."
10124-101240460 = "Я не перекусывала в рабочее время"
10124-101240470 = "Я отказывалась от десерта"
10124-101240480 = "Я даже отказалась от рулета, который Чайная партия прислала в благодарность за мою работу"
10124-101240490 = "И когда владелец фудтрака, которому я помогла во время патруля, подарил мне лимитированный торт Miracle 5000, который я раньше не имела чести попробовать, я всё равно воздержалась."
10124-101240500 = "Х-хасуми...?"
10124-101240510 = "Глубоко дыши! Глубоко дыши!"
10124-101240520 = "Прошу прощения."
10124-101240530 = "Я увлеклась."
10124-101240540 = "Правда, спасибо за сегодня."
10124-101240550 = "Я постоянно позорюсь перед вами."
10124-101240560 = "Здоровье всегда на первом месте!"
10124-101240570 = "Больше никаких чрезмерных диет!"
10124-101240580 = "Да. Я запомню."
10124-101240590 = "Сенсей."
10124-101240600 = "Как вы просили, я пишу вам в MomoTalk, пока у меня есть немного свободного времени."
10124-101240610 = "Можем ненадолго встретиться на пляже?"
10124-101240620 = "Отличный момент! Встретимся у входа!"
10124-101240630 = "Да?"
10124-101240640 = "Поняла."
10124-101240650 = "Я прямо сейчас спущусь."
10124-101240660 = "Сенсей."
10124-101240670 = "Спасибо. Это лето действительно станет незабываемым."
10124-101240680 = "Это здорово!"
10124-101240690 = "Мне тоже было весело!"
10124-101240700 = "Да. Никогда раньше я так не наслаждалась летом."
10124-101240710 = "От начала до конца я по-настоящему смаковала каждый момент."
10124-101240720 = "Фейерверки в конце были красивыми."
10124-101240730 = "Фейерверки...?"
10124-101240740 = "А."
10124-101240750 = "Да. Фейерверки. Они были очень красивыми."
10124-101240760 = "Я до сих пор очень отчётливо вижу их перед глазами."
