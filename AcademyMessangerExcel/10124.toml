[translation]
10124-101240010 = "Сенсей."
10124-101240020 = "На этот раз в рамках деятельности Комитета по восстановлению справедливости мы собираемся поехать на море."
10124-101240030 = "... Я подумал, что лучше предупредить вас заранее."
10124-101240040 = "Лето! Море!"
10124-101240050 = "Купальники!!!"
10124-101240060 = "... Понятно."
10124-101240070 = "Похоже, вы меня неправильно поняли, но..."
10124-101240080 = "Это всего лишь часть деятельности Комитета по восстановлению справедливости."
10124-101240090 = "А, прости..."
10124-101240100 = "Я подумал, раз уж лето и море, может, вы хотите немного передохнуть..."
10124-101240110 = "... Если так, то"
10124-101240120 = "уделите мне немного времени? Я приду и всё объясню лично."
10124-101240130 = "Сенсей."
10124-101240140 = "Прошу прощения за предыдущее."
10124-101240150 = "Через неделю я покажу вам «результат»."
10124-101240160 = "А, да. Удачи...? Что?"
10124-101240170 = "Я не совсем понимаю, но я за вас болею!"
10124-101240180 = "Да."
10124-101240190 = "Я ни за что, ни за что не разочарую вас."
10124-101240200 = "Наконец... этот день настал."
10124-101240210 = "Хасуми?"
10124-101240220 = "Неделя..."
10124-101240230 = "Обычно она пролетает мгновенно, но..."
10124-101240240 = "Впервые я ощутила, как она тянется так долго."
10124-101240250 = "Ханекава Хасуми уже приняла решение."
10124-101240260 = "... Приходите в любое время."
10124-101240270 = "Что? А-а, да..."
10124-101240280 = "Я сейчас приду!"
10124-101240290 = "Сенсей."
10124-101240300 = "Спасибо, что нашли для меня время сегодня."
10124-101240310 = "Ты точно в порядке...?"
10124-101240320 = "Всё в порядке."
10124-101240330 = "До поездки на море ещё есть время."
10124-101240340 = "Не перенапрягайся..."
10124-101240350 = "Держись..."
10124-101240360 = "Благодарю."
10124-101240370 = "На этот раз... я чётко покажу, на что способна."
10124-101240380 = "Не нужно так решительно настраиваться..."
10124-101240390 = "Только не переусердствуй...!"
10124-101240400 = "Тогда встретимся на море."
10124-101240410 = "Наконец... этот день настал."
10124-101240420 = "Размер купальника тоже в порядке."
10124-101240430 = "Ты очень старалась, Хасуми."
10124-101240440 = "Потрясающе... просто потрясающе...!"
10124-101240450 = "Да, правда..."
10124-101240460 = "Я, конечно, воздерживалась от перекусов во время работы..."
10124-101240470 = "И отказывалась от десертов после еды, это были тяжёлые дни..."
10124-101240480 = "Пришлось отказаться даже от рулета, который дали на чаепитии..."
10124-101240490 = "И даже выдержала, не попробовав лимитированный торт «Миracle 5000», который ни разу не ела...!"
10124-101240500 = "Х-Хасуми...?"
10124-101240510 = "Успокойся! Финиш уже близко!"
10124-101240520 = "... Прошу прощения."
10124-101240530 = "Похоже, я немного расстроилась."
10124-101240540 = "Спасибо вам большое за сегодня."
10124-101240550 = "Я постоянно показываю вам только такие свои стороны..."
10124-101240560 = "Здоровье — самое главное."
10124-101240570 = "Если захочешь снова куда-то поехать, всегда пиши!"
10124-101240580 = "Да, спасибо."
10124-101240590 = "Сенсей."
10124-101240600 = "Вы сказали, что я могу обратиться в любое время, но..."
10124-101240610 = "Отличный момент! Не могли бы вы приехать на пляж?"
10124-101240620 = "Можно попросить вас прийти на пляж сегодня вечером?"
10124-101240630 = "... Что?"
10124-101240640 = "Понял."
10124-101240650 = "Я приду."
10124-101240660 = "Сенсей."
10124-101240670 = "Я обязательно запомню это лето."
10124-101240680 = "Как хорошо!"
10124-101240690 = "Мне тоже было весело!"
10124-101240700 = "Я никогда раньше так не наслаждалась «летом»."
10124-101240710 = "Спасибо, что подарили мне особенные воспоминания."
10124-101240720 = "Мне тоже было весело с самого начала и до конца."
10124-101240730 = "Хе-хе..."
10124-101240740 = "И тренировки по плаванию... и ужин, которым вы меня угостили..."
10124-101240750 = "И красота фейерверков..."
10124-101240760 = "Всё, что произошло этим летом, я не забуду... хе-хе."