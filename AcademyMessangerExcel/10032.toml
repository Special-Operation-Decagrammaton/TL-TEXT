[translation]
10032-100320010 = "Sensei!"
10032-100320020 = "Mais uma vez, Feliz Ano-Novooo!"
10032-100320030 = "Quando foi que já virou Ano-Novo..."
10032-100320040 = "Valeu, Feliz Ano-Novo."
10032-100320050 = "Aaaah, que reação é essa, Sensei? Que sem graçaaa~"
10032-100320060 = "Não tem jeito mesmo... Pra fazer até um Sensei desanimado assim pegar fogo de vez,"
10032-100320070 = "vou preparar \"uma coisa superdivertida\" pra você!"
10032-100320080 = "Desanimado...?"
10032-100320090 = "\"Uma coisa superdivertida\"...?"
10032-100320100 = "Pode esperar ansioso, viu, Sensei!"
10032-100320110 = "H-hã...?"
10032-100320120 = "Mutsuki...?"
10032-100320130 = "Sensei, você já decidiu qual vai ser o seu pedido de Ano-Novo?"
10032-100320140 = "Claro!"
10032-100320150 = "Pensando bem, ainda não..."
10032-100320160 = "Huum, é mesmo?"
10032-100320170 = "Fiquei curiosa pra saber qual é o seu pedido, Sensei~"
10032-100320180 = "Ah, entendi."
10032-100320190 = "Bom, você pode decidir com calma a partir de agora, né?"
10032-100320200 = "Por enquanto, vamos lá, Sensei!"
10032-100320210 = "Hum, pra onde?"
10032-100320220 = "Em pleno Ano-Novo, já não é óbvio?"
10032-100320230 = "Se é Ano-Novo, temos que ir a um lugar típico de Ano-Novo!"
10032-100320240 = "Vamos, vamos, se arruma logo, Sensei!"
10032-100320250 = "Sensei! Vamos jogar hanetsuki!"
10032-100320260 = "Do nada assim...?"
10032-100320270 = "Vou me vingar com gosto da humilhação daquela derrota do outro dia!"
10032-100320280 = "Vamos lá, prepare-se para um duelo justo!"
10032-100320290 = "Tô te esperando, viu! Rápido, rápido!"
10032-100320300 = "Graças a você, meu Ano-Novo foi superdivertido, Sensei! Brigadinha!"
10032-100320310 = "Daqui pra frente e pra sempre,"
10032-100320320 = "continue brincando muuuuito comigo, viu, Sensei♡"
