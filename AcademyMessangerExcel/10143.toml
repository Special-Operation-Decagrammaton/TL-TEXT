[translation]
10143-101430010 = "Сенсей, как вам отдых в ущелье?"
10143-101430020 = "Природа — это круто..."
10143-101430030 = "Хе-хе. Я рада, что вам нравится."
10143-101430040 = "Кстати, Сенсей,"
10143-101430050 = "сегодня я хотела бы присоединиться к вам там."
10143-101430060 = "Можно?"
10143-101430070 = "Я люблю лето."
10143-101430080 = "Что именно тебе нравится?"
10143-101430090 = "Причин несколько, но..."
10143-101430100 = "Наверное, потому что можно показать"
10143-101430110 = "свою необычную сторону?"
10143-101430120 = "Хе-хе, поэтому"
10143-101430130 = "я хотела бы показать вам свою необычную сторону."
10143-101430140 = "Можно попросить вашего времени?"
10143-101430150 = "Простите за вчерашнее..."
10143-101430160 = "Правда, за всё..."
10143-101430170 = "Наконец-то Шун заговорила со мной..."
10143-101430180 = "Что?"
10143-101430190 = "Если подумать, да, действительно..."
10143-101430200 = "Тогда..."
10143-101430210 = "Я ничего не видел! Ничего не помню!"
10143-101430220 = "..."
10143-101430230 = "Это немного"
10143-101430240 = "печально, наверное..."
10143-101430250 = "Что же мне делать..."
10143-101430260 = "Ну, да..."
10143-101430270 = "..."
10143-101430280 = "Если вы не против,"
10143-101430290 = "я хотела бы взять реванш вместе с вами..."
10143-101430300 = "Если у вас есть время, можно прямо сейчас...?"
10143-101430310 = "Сенсей, я хочу попросить вас кое о чём..."
10143-101430320 = "Если не трудно..."
10143-101430330 = "Не могли бы вы выслушать?"
10143-101430340 = "Конечно, говори!"
10143-101430350 = "Сегодня мы с детьми из Сада цветущей сливы"
10143-101430360 = "собираемся в аквапарк..."
10143-101430370 = "Не могли бы вы пойти с нами как сопровождающий?"
10143-101430380 = "Полагайся на меня!"
10143-101430390 = "Хе-хе."
10143-101430400 = "Спасибо, Сенсей."
10143-101430410 = "Вы благополучно добрались, Сенсей?"
10143-101430420 = "А-ага... только мышцы болят..."
10143-101430430 = "Хе-хе."
10143-101430440 = "Игры в воде отнимают больше сил, чем кажется."
10143-101430450 = "Спасибо вам большое за сегодня."
10143-101430460 = "Если вы не против, конечно..."
10143-101430470 = "Я бы хотела снова провести время вот так."
10143-101430480 = "Звони в любое время."
10143-101430490 = "Хе-хе. Спасибо."
10143-101430500 = "Я знала, что вы так скажете."
10143-101430510 = "В таком случае, в следующий раз..."
10143-101430520 = "я организую возможность побыть наедине."