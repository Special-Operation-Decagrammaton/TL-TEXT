[translation]
10143-101430010 = "Как вам долина, Сенсей?"
10143-101430020 = "Природа удивительна..."
10143-101430030 = "Рада это слышать."
10143-101430040 = "Кстати об этом..."
10143-101430050 = "Я надеялась сегодня мы с Вами пойти к реке."
10143-101430060 = "Не составите мне компанию?"
10143-101430070 = "Лето — интереснная пора."
10143-101430080 = "Чем же?"
10143-101430090 = "Да много чем."
10143-101430100 = "Но, думаю, для меня..."
10143-101430110 = "Это возможность поприветствовать кого-нибудь в новом образе."
10143-101430120 = "Тем не менее"
10143-101430130 = "я бы хотела показать Вам себя с новой стороны."
10143-101430140 = "Надеюсь, Вы не против??"
10143-101430150 = "По поводу вчерашнего..."
10143-101430160 = "Прошу прощения, во многих смыслах."
10143-101430170 = "Ты наконец-то снова мне пишешь..."
10143-101430180 = "Что?"
10143-101430190 = "Да, полагаю, я Вас несколько избегала..."
10143-101430200 = "Но и я..."
10143-101430210 = "Я вообще ничего не видел! И вообще уже всё забыл!"
10143-101430220 = "..."
10143-101430230 = "Это немного"
10143-101430240 = "разочаровывает?.."
10143-101430250 = "Какой... тут должен быть правильный ответ?"
10143-101430260 = "Не совсем уверена..."
10143-101430270 = "..."
10143-101430280 = "Сенсей,"
10143-101430290 = "Думаю, было бы неплохо"
10143-101430300 = "если бы Вы помогли мне отомстить."
10143-101430310 = "Здравствуйте, Сенсей."
10143-101430320 = "Прошу прощения за беспокойство..."
10143-101430330 = "Но можно я попрошу Вас об одной услуге?"
10143-101430340 = "Ну конечно!"
10143-101430350 = "Сегодня я пойду в аквапарк с детьми из Сада Цветущей Сливы."
10143-101430360 = "Если ты не против,"
10143-101430370 = "не хотели бы Вы помочь присмотреть за ними… Вместе со мной?"
10143-101430380 = "Конечно!"
10143-101430390 = "Фу-фу."
10143-101430400 = "Спасибо, Сенсей."
10143-101430410 = "Вы благополучно добрались, Сенсей?"
10143-101430420 = "Уффф... Я выдохся, все мышцы ноют..."
10143-101430430 = "Фу-фу."
10143-101430440 = "Игры в воде могут быть довольно утомительны."
10143-101430450 = "Огромное спасибо за сегодня."
10143-101430460 = "Если вы не против..."
10143-101430470 = "Надеюсь, мы сможем когда-нибудь повторить что-то подобное."
10143-101430480 = "В любое время.."
10143-101430490 = "Фуфу, знала, что Вы так скажете."
10143-101430500 = "Но я благодарна."
10143-101430510 = "Тогда в следующий раз..."
10143-101430520 = "Мы можем сделать что-то тлько вдвоём."
