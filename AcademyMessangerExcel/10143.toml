[translation]
10143-101430010 = "Sensei, como estão sendo os seus momentos de lazer no cânion?"
10143-101430020 = "A natureza é demais..."
10143-101430030 = "Fufu. Fico muito feliz em saber que está se divertindo"
10143-101430040 = "Por falar nisso, Sensei"
10143-101430050 = "Eu gostaria de lhe fazer companhia aí hoje"
10143-101430060 = "Tudo bem por você?"
10143-101430070 = "Eu gosto muito do verão"
10143-101430080 = "Do que você mais gosta nele?"
10143-101430090 = "Há vários motivos, mas..."
10143-101430100 = "Talvez seja porque consigo expressar"
10143-101430110 = "um lado meu... diferente do habitual?"
10143-101430120 = "Fufu, sendo assim"
10143-101430130 = "Eu gostaria de lhe mostrar esse meu lado diferente do habitual"
10143-101430140 = "Poderia me conceder um tempinho seu?"
10143-101430150 = "Peço desculpas pelo incômodo de ontem..."
10143-101430160 = "De verdade, por tanta coisa..."
10143-101430170 = "Finalmente você veio falar comigo, Shun..."
10143-101430180 = "Hã?"
10143-101430190 = "Pensando bem, você tem razão..."
10143-101430200 = "Naquela hora..."
10143-101430210 = "Eu não vi nada! Não lembro de nadinha!"
10143-101430220 = "..."
10143-101430230 = "Isso é um pouquinho"
10143-101430240 = "triste, sabia...?"
10143-101430250 = "O que... você quer que eu faça, então...?"
10143-101430260 = "Vejamos..."
10143-101430270 = "..."
10143-101430280 = "Se você não se importar"
10143-101430290 = "Eu gostaria de tentar uma revanche junto com você, Sensei..."
10143-101430300 = "Se tiver tempo, poderia ser... agora mesmo?"
10143-101430310 = "Sensei, há um favor que eu gostaria de lhe pedir..."
10143-101430320 = "Se possível..."
10143-101430330 = "Poderia me ouvir?"
10143-101430340 = "Pode pedir o que quiser!"
10143-101430350 = "Hoje ficou decidido que vou ao parque aquático"
10143-101430360 = "com as crianças do Jardim da Flor de Ameixeira..."
10143-101430370 = "Você poderia me ajudar a acompanhá-las?"
10143-101430380 = "Deixa comigo!"
10143-101430390 = "Fufu"
10143-101430400 = "Muito obrigada, Sensei"
10143-101430410 = "Chegou bem em casa, Sensei?"
10143-101430420 = "S-Sim... só estou com o corpo todo dolorido..."
10143-101430430 = "Fufu"
10143-101430440 = "Brincar na água exige mais preparo físico do que parece, não é?"
10143-101430450 = "Muito obrigada mesmo pelo dia de hoje"
10143-101430460 = "Se você estiver disposto, Sensei..."
10143-101430470 = "Eu adoraria ter mais momentos assim"
10143-101430480 = "Pode me chamar sempre que quiser"
10143-101430490 = "Fufu. Muito obrigada"
10143-101430500 = "Imaginei que você diria isso"
10143-101430510 = "Nesse caso, da próxima vez..."
10143-101430520 = "Vou preparar uma ocasião para passarmos um tempo a sós"
