[translation]
23003-1630 = "Вы слышали о новом фильме «Eliminator 4»?"
23003-1631 = "Это та фантастическая серия, где огромные роботы разрушают город, да?"
23003-1632 = "Да, но говорят, в этой части помощник главного героя"
23003-1633 = "— хакер."
23003-1634 = "Я и так ждала этот фильм, а теперь узнала, что там будет хакер! Разве не захватывающе?"
23003-1635 = "Не могу дождаться, как это покажут."
23003-1636 = "Надеюсь, тебе понравится."
23003-1637 = "Он выходит на этих выходных, так что расскажу, как посмотрю."
23003-1638 = "Когда сегодня придёте в клубную комнату, можете принести мне из города энергетик?"
23003-1639 = "Энергетик? Вроде Frenzy MAX?"
23003-1640 = "Да, Frenzy MAX! Со вкусом маракуйи."
23003-1641 = "Я нигде поблизости не могу найти вкус маракуйи."
23003-1642 = "Хорошо."
23003-1643 = "Спасибо!"
23003-1644 = "Я слышала, новая видеокарта, которая только вышла, невероятно производительная..."
23003-1645 = "Я спросила у компании-продавца, и сказали, что из-за дефицита каждому продают только одну."
23003-1646 = "Я мало понимаю в компьютерах, но одной видеокарты недостаточно?"
23003-1647 = "Нет."
23003-1648 = "Чтобы нормально протестировать функции нового симулятора, мне нужно минимум две видеокарты."
23003-1649 = "Честно говоря, даже двух мало..."
23003-1650 = "Но они и так очень дорогие, придётся довольствоваться двумя..."
23003-1651 = "Не знаю, о чём ты говоришь, но звучит важно."
23003-1652 = "Мир компьютеров навсегда останется для меня загадкой..."
23003-1653 = "Так что я хотела спросить... Можете сходить со мной в магазин комплектующих на этих выходных?"
23003-1654 = "Я за всё заплачу. Вам нужно только, ну... постоять рядом."
23003-1655 = "Хорошо. Увидимся на выходных."
23003-1656 = "Я закончила модернизировать дрон, который сделала раньше, Сенсей."
23003-1657 = "Наконец закончила? Поздравляю!"
23003-1658 = "Что ты в нём изменила?"
23003-1659 = "Да! Я добавила несколько новых функций, надеюсь, они пригодятся."
23003-1660 = "Я добавила множество новых возможностей для удобства пользователя."
23003-1661 = "Я продемонстрирую их на крыше академии, так что приходите посмотреть."
23003-1662 = "Приду сразу после работы."
23003-230030020 = "Это для чего?"
23003-230030030 = "Выглядит мило. Но зачем...?"
23003-230030040 = "...Харэ?"
23003-230030050 = "Сенсей."
23003-230030060 = "Эм, насчёт той фотографии..."
23003-230030070 = "Можете удалить её?"
23003-230030080 = "Но ты на ней милая!"
23003-230030090 = "Вы так говорите, но..."
23003-230030100 = "Я сделаю другую и отправлю вам."
23003-230030110 = "А."
23003-230030120 = "Хорошо."
23003-230030130 = "Эм... Это было..."
23003-230030140 = "Афина-3 снова чудит..."
23003-230030150 = "Пожалуйста, просто забудьте."
