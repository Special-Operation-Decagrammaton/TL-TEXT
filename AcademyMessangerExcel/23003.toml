[translation]
23003-1630 = "Сенсей, вы слышали слух о новом фильме «Истребитель 4»?"
23003-1631 = "Это тот фантастический сериал, где гигантские роботы разрушают город, да?"
23003-1632 = "Да-да. И, похоже, в этот раз в качестве поддержки главного героя"
23003-1633 = "появится хакер."
23003-1634 = "В сиквеле фильма, который я и так люблю, появляется персонаж, связанный с хакерством..."
23003-1635 = "Интересно, как его изобразят, уже сейчас жду."
23003-1636 = "Точно. Пока неизвестно, но хотелось бы, чтобы это было круто."
23003-1637 = "Да. Похоже, премьера на этих выходных, я расскажу, что думаю, после просмотра."
23003-1638 = "Сенсей, когда будете идти в клубную комнату, не могли бы вы купить мне энергетик?"
23003-1639 = "Энергетик? Подойдёт «Ёкай MAX»?"
23003-1640 = "Да, возьмите, пожалуйста, со вкусом маракуйи."
23003-1641 = "Почему-то этот вкус не очень распространён в этих местах."
23003-1642 = "Понятно. Хорошо, договорились."
23003-1643 = "Спасибо, буду ждать."
23003-1644 = "Графическая карта, которая недавно вышла, похоже, очень мощная."
23003-1645 = "Я спрашивала у продавца, и он сказал, что продают только по одной штуке в руки из-за ограниченного запаса."
23003-1646 = "Я не разбираюсь в компьютерах, но одной карты недостаточно?"
23003-1647 = "Да, недостаточно, наверное."
23003-1648 = "Нужно как минимум две, чтобы нормально протестировать новый симулятор."
23003-1649 = "Лично мне даже двух мало."
23003-1650 = "Они и так дорогие, а ставить больше — тяжело, так что придётся довольствоваться двумя..."
23003-1651 = "Честно говоря, не совсем понимаю, но это впечатляет..."
23003-1652 = "Мир компьютеров глубок..."
23003-1653 = "И вот, на этих выходных, не мог бы ты сходить со мной купить её?"
23003-1654 = "Деньги, конечно, я плачу, буду рада, если ты придёшь."
23003-1655 = "Хорошо, тогда до выходных."
23003-1656 = "Сенсей, я закончил модификацию дрона, который делал раньше."
23003-1657 = "Наконец-то закончил, поздравляю."
23003-1658 = "Что ты там модифицировал?"
23003-1659 = "Спасибо. В этот раз я добавил много новых функций, так что жди."
23003-1660 = "Разные полезные нововведения для пользователя."
23003-1661 = "Сегодня днём я планирую тестовый прогон на крыше Миллениума, не хочешь посмотреть?"
23003-1662 = "Как только закончу работу, сразу приду."
23003-230030020 = "Харе, что случилось?"
23003-230030030 = "Это селфи милое! Но почему вдруг...?"
23003-230030040 = "Эм, Харе...?"
23003-230030050 = "Сенсей"
23003-230030060 = "Насчёт той фотографии..."
23003-230030070 = "Если можно, я бы хотел, чтобы вы её удалили..."
23003-230030080 = "Я думаю, что получилось мило, правда?"
23003-230030090 = "Но"
23003-230030100 = "Ну, как бы это сказать... я пришлю тебе другое, более красивое фото..."
23003-230030110 = "Ах"
23003-230030120 = "Эт"
23003-230030130 = "То"
23003-230030140 = "Это, ну... это снова Атена-3 пошалила..."
23003-230030150 = "Так что не обращайте внимания..."