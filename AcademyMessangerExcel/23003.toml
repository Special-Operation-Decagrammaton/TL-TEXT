[translation]
23003-1630 = "Sensei. Ouviu os boatos sobre o novo filme que vai estrear, 'Eliminator 4'?"
23003-1631 = "Aquela franquia de ficção científica em que robôs gigantes destroem a cidade, né?"
23003-1632 = "Isso mesmo. Pelo visto, parece que desta vez, no papel de suporte do protagonista,"
23003-1633 = "vai aparecer ninguém menos que um hacker."
23003-1634 = "Pensar que na sequência de um filme que eu já curtia vai ter um personagem ligado a hacking..."
23003-1635 = "Mal posso esperar pra ver como vão retratar isso."
23003-1636 = "Realmente. Ainda não dá pra saber, mas tomara que seja maneiro."
23003-1637 = "Uhum. Parece que estreia neste fim de semana, então quando eu assistir te conto o que achei."
23003-1638 = "Sensei, quando vier para a sala do clube hoje, pode comprar uma lata de energético pra mim?"
23003-1639 = "Energético? Pode ser o 'Yokai MAX'?"
23003-1640 = "Uhum, 'Yokai MAX' sabor maracujá, por favor."
23003-1641 = "Não sei por quê, mas parece que quase não vendem esse sabor por aqui."
23003-1642 = "Ah, é? Beleza, pode deixar."
23003-1643 = "Obrigada, conto com você."
23003-1644 = "A placa de vídeo que lançaram outro dia parece ter um desempenho absurdo."
23003-1645 = "Perguntei na loja e disseram que, como o estoque é limitado, só vendem uma unidade por pessoa."
23003-1646 = "Não entendo muito de computador, mas uma só não basta?"
23003-1647 = "É, acho que não dá."
23003-1648 = "Se não tiver pelo menos duas, não consigo testar direito o novo simulador por questão de desempenho."
23003-1649 = "Pessoalmente, acho que nem duas dão conta, mas..."
23003-1650 = "Já são caras por natureza e colocar mais do que isso pesa no bolso, então vou me contentar com duas..."
23003-1651 = "Sinceramente não entendi muito bem, mas impressionante..."
23003-1652 = "O mundo dos computadores é profundo mesmo..."
23003-1653 = "Por isso, neste fim de semana, será que você não poderia ir comigo comprar?"
23003-1654 = "O dinheiro obviamente sai do meu bolso, mas eu ficaria feliz se você viesse junto."
23003-1655 = "Combinado, nos vemos no fim de semana então."
23003-1656 = "Sensei, terminei a modificação daquele drone que eu estava montando antes."
23003-1657 = "Finalmente terminou, hein? Parabéns!"
23003-1658 = "Que tipo de modificação você estava fazendo mesmo?"
23003-1659 = "Obrigada. Adicionei um monte de funções novas desta vez, então pode esperar coisa boa."
23003-1660 = "Várias funções novas bem práticas para o usuário."
23003-1661 = "Pretendo fazer um voo de teste no terraço da Millennium hoje à tarde. Quer vir ver?"
23003-1662 = "Assim que terminar o trabalho aqui eu vou."
23003-230030020 = "Hare, o que houve?"
23003-230030030 = "Que selfie fofa! Mas por que mandou isso do nada...?"
23003-230030040 = "Hum, senhorita Hare...?"
23003-230030050 = "Sensei"
23003-230030060 = "Hum, sobre aquela foto..."
23003-230030070 = "Se puder, queria pedir pra você apagar..."
23003-230030080 = "Mas eu achei que você saiu super fofa."
23003-230030090 = "Mas"
23003-230030100 = "Como posso dizer... Se for pra mandar foto, depois eu tiro uma bem fofa de verdade e te mando..."
23003-230030110 = "Ah"
23003-230030120 = "Er"
23003-230030130 = "hm"
23003-230030140 = "Isso de agora foi, hum, a Athena Nº 3 aprontando de novo..."
23003-230030150 = "Então, por favor, finge que não viu..."
