[translation]
10055-100550010 = "Сенсей?"
10055-100550020 = "Ходят слухи, что ты скоро нас посетишь. Это правда?"
10055-100550030 = "Ага. Слухи правдивы."
10055-100550040 = "А почему спрашиваешь?"
10055-100550050 = "Да без особой причины."
10055-100550060 = "Просто думаю... увижу ли тебя, пока ты здесь."
10055-100550070 = "Хи-хи."
10055-100550080 = "Загляни в Спецотряд... если будет время."
10055-100550090 = "То есть ты же каждый раз думаешь о нас, когда приезжаешь, правда? Хи-хи."
10055-100550100 = "Мне кажется, наша школа занимает намного больше места, чем нужно."
10055-100550110 = "Да, она довольно большая."
10055-100550120 = "К тому же везде дикие медведи и всегда холодно."
10055-100550130 = "В общем, сообщи, когда доберёшься."
10055-100550140 = "Если попытаешься ходить по кампусу без проводника,"
10055-100550150 = "можешь нарваться на серьёзные проблемы."
10055-100550160 = "Хорошо?"
10055-100550170 = "Ты нормально вернулся, Сенсей?"
10055-100550180 = "Нигде не отвлёкся и не заблудился?"
10055-100550190 = "Я уже дома, благодаря тебе."
10055-100550200 = "Сейчас отдохну, так что не волнуйся."
10055-100550210 = "Хорошо-хорошо. Раз ты так говоришь."
10055-100550220 = "Но, как я и сказала,"
10055-100550230 = "ты обязан сообщать мне, когда приезжаешь в Академию Красная Зима."
10055-100550240 = "Обещаешь?"
10055-100550250 = "Что-то нужно, Сенсей?"
10055-100550260 = "Я слышала, ты меня искал."
10055-100550270 = "Да. У тебя есть свободное время?"
10055-100550280 = "Хотел отплатить тебе за прошлую помощь."
10055-100550290 = "О..."
10055-100550300 = "Не ожидала, что ты будешь настолько... прямолинейным, наверное."
10055-100550310 = "Ну..."
10055-100550320 = "Ладно, почему бы и нет?"
10055-100550330 = "я буду ждать."
10055-100550340 = "До скорого, Сенсей."
10055-100550350 = "Ты нормально добрался домой, Сенсей?"
10055-100550360 = "В этот раз я не слишком переживала. Даже ты не заблудишься в такой день."
10055-100550370 = "Я цел и невредим. А ты?"
10055-100550380 = "Вы благополучно добрались домой?"
10055-100550390 = "Да, благодаря тебе."
10055-100550400 = "Серьёзно, спасибо. Еда тоже была очень вкусной."
10055-100550410 = "В следующий раз угощаю я."
10055-100550420 = "Такой обмен был бы неплох, понимаешь?"
10055-100550430 = "Договорились? Следующий раз за мной."
10055-100550440 = "Хи-хи."
10055-100550450 = "Ладно, хорошего дня, Сенсей."
10055-100550460 = "Сенсей."
10055-100550470 = "Не хочу давить, но у тебя сегодня есть время?"
10055-100550480 = "Мне ещё нужно отплатить тебе за прошлый раз."
10055-100550490 = "Так что сегодня позволь мне приготовить тебе еду."
10055-100550500 = "Ты хочешь приготовить для меня?"
10055-100550510 = "В Шале?"
10055-100550520 = "Ага, именно."
10055-100550530 = "Я приду с ингредиентами, просто скажи, когда освободишься."
10055-100550540 = "У меня запланировано кое-что потрясающее."
10055-100550550 = "До скорого, Сенсей!"
10055-100550560 = "О..."
10055-100550570 = "Я забыла сказать спасибо..."
10055-100550580 = "Ты очень вкусно приготовил."
10055-100550590 = "Но я кое о чём подумала..."
10055-100550600 = "Эм-м..."
10055-100550610 = "Мне кажется, блюду не хватало немного водки. Для вкуса."
10055-100550620 = "Для готовки используют рисовое вино, а не водку."
10055-100550630 = "Водку студентам нельзя ни пить, ни использовать в готовке!"
10055-100550640 = "Хи-хи."
10055-100550650 = "Может, мне просто нравится, как ты меня отчитываешь, Сенсей."
10055-100550660 = "Хорошо."
10055-100550670 = "Увидимся, Сенсей."
