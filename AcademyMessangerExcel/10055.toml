[translation]
10055-100550010 = "Sensei."
10055-100550020 = "Ouvi dizer que você vem para Red Winter em breve, é verdade?"
10055-100550030 = "Sim, é o que pretendo."
10055-100550040 = "Precisa de alguma coisa?"
10055-100550050 = "Não, não é nada em especial."
10055-100550060 = "Só pensei que finalmente vamos poder nos ver depois de tanto tempo."
10055-100550070 = "Hehe."
10055-100550080 = "Se tiver um tempinho, eu ia adorar se você desse uma passada aqui na 227 também."
10055-100550090 = "Acho que você já sabe, Sensei, mas..."
10055-100550100 = "O campus da nossa academia é grande até demais, né?"
10055-100550110 = "É, nisso você tem razão."
10055-100550120 = "Além disso, faz um frio danado e está cheio de animais selvagens ferozes."
10055-100550130 = "Por isso, quando vier, me chama, tá?"
10055-100550140 = "Se sair andando por aí sem guia..."
10055-100550150 = "Pode acabar passando por maus bocados."
10055-100550160 = "Bom, combinado então."
10055-100550170 = "Sensei, conseguiu voltar direitinho?"
10055-100550180 = "Não me diga que fez algum desvio pelo caminho, né?"
10055-100550190 = "Cheguei são e salvo graças a você."
10055-100550200 = "Hoje vou aproveitar para descansar bastante."
10055-100550210 = "Ótimo, que bom então."
10055-100550220 = "Como eu disse antes..."
10055-100550230 = "Sempre que vier para Red Winter, vê se me avisa direitinho."
10055-100550240 = "Segurança em primeiro lugar.\nEntendido?"
10055-100550250 = "Sensei, acabei de ouvir um boato."
10055-100550260 = "Por acaso você estava me procurando?"
10055-100550270 = "Sim, você tem um tempinho mais tarde?"
10055-100550280 = "Queria te agradecer pelo outro dia."
10055-100550290 = "Ué, vou ficar esperando ansiosa então."
10055-100550300 = "Não precisava se preocupar tanto com isso, hehe."
10055-100550310 = "Mas tudo bem, não vou reclamar."
10055-100550320 = "Combinado."
10055-100550330 = "Então, até mais tarde."
10055-100550340 = "Conto com você."
10055-100550350 = "Sensei, voltou em segurança?"
10055-100550360 = "Bom, hoje não era um lugar onde você fosse se perder, né."
10055-100550370 = "Sim, voltei direitinho."
10055-100550380 = "E você, Shigure, tudo bem por aí?"
10055-100550390 = "Sim, graças a você."
10055-100550400 = "Muito obrigada mesmo por hoje."
10055-100550410 = "Acho que na próxima é a minha vez de agradecer."
10055-100550420 = "Ficar trocando agradecimentos assim sem parar até que não é nada mal, né?"
10055-100550430 = "Então me aguarde quando chegar a hora."
10055-100550440 = "Hehe."
10055-100550450 = "Bom, tenha um ótimo dia."
10055-100550460 = "Sensei."
10055-100550470 = "Se puder, me dá um tempinho mais tarde?"
10055-100550480 = "Como forma de agradecer pelo outro dia também..."
10055-100550490 = "Pensei em cozinhar alguma coisa para você."
10055-100550500 = "Cozinhar?"
10055-100550510 = "Você vem até a Schale?"
10055-100550520 = "Sim, isso mesmo."
10055-100550530 = "Eu levo os ingredientes."
10055-100550540 = "Pode criar expectativas, viu?"
10055-100550550 = "Então depois a gente combina o dia direitinho."
10055-100550560 = "Pensando bem, acho que esqueci de te agradecer."
10055-100550570 = "Foi mal pela demora."
10055-100550580 = "Obrigada, estava uma delícia."
10055-100550590 = "E aí, tive uma ideia agora há pouco..."
10055-100550600 = "Sabe aquela vodca de antes?"
10055-100550610 = "Não seria uma boa usar para temperar a comida?"
10055-100550620 = "Na culinária se usa saquê culinário, viu?"
10055-100550630 = "Vodca não pode."
10055-100550640 = "Hehe."
10055-100550650 = "Você é mesmo engraçado, Sensei."
10055-100550660 = "Anotado, vou fazer isso então."
10055-100550670 = "Até mais, Sensei."
