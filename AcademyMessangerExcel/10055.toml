[translation]
10055-100550010 = "Сенсей."
10055-100550020 = "Я слышала, вы скоро приедете в Красную Зиму, это правда?"
10055-100550030 = "Да, планирую."
10055-100550040 = "У вас какие-то дела?"
10055-100550050 = "Нет, ничего такого."
10055-100550060 = "Просто подумала, что мы давно не виделись."
10055-100550070 = "Хе-хе."
10055-100550080 = "Если будет время, загляните в 227-й, я буду рада."
10055-100550090 = "Вы ведь знаете,"
10055-100550100 = "территория нашей академии слишком большая."
10055-100550110 = "Это уж точно."
10055-100550120 = "К тому же холодно, и диких животных много."
10055-100550130 = "Так что когда будете приезжать, позовите меня."
10055-100550140 = "Если пойдёте без проводника,"
10055-100550150 = "можете попасть в беду."
10055-100550160 = "Ну, тогда договорились."
10055-100550170 = "Сенсей, вы благополучно добрались?"
10055-100550180 = "Надеюсь, вы не задержались по дороге?"
10055-100550190 = "Спасибо, всё хорошо."
10055-100550200 = "Сегодня я отдохну как следует."
10055-100550210 = "Хорошо, что так."
10055-100550220 = "Как я уже говорила,"
10055-100550230 = "когда приедете в Красную Зиму, обязательно предупредите меня."
10055-100550240 = "Безопасность превыше всего. Договорились?"
10055-100550250 = "Сенсей, я только что слышала,"
10055-100550260 = "вы, случайно, не искали меня?"
10055-100550270 = "Да, у вас будет время позже?"
10055-100550280 = "Я хочу отблагодарить вас за прошлый раз."
10055-100550290 = "Ого, с нетерпением жду."
10055-100550300 = "Можно было и не беспокоиться, хе-хе."
10055-100550310 = "Ну, мне не трудно."
10055-100550320 = "Понял."
10055-100550330 = "Тогда увидимся позже."
10055-100550340 = "До встречи."
10055-100550350 = "Сенсей, вы добрались?"
10055-100550360 = "Хотя сегодня место было не из тех, где можно заблудиться."
10055-100550370 = "Да, добрался."
10055-100550380 = "А ты, Шигуре, как?"
10055-100550390 = "Всё хорошо, спасибо."
10055-100550400 = "Спасибо большое за сегодня."
10055-100550410 = "Теперь мой черёд благодарить."
10055-100550420 = "Если так будем продолжать, это никогда не закончится."
10055-100550430 = "Но мне это даже нравится."
10055-100550440 = "Хе-хе."
10055-100550450 = "Тогда хорошего дня."
10055-100550460 = "Сенсей."
10055-100550470 = "Если вам удобно, не могли бы вы уделить мне время позже?"
10055-100550480 = "Заодно и отблагодарю за прошлый раз."
10055-100550490 = "Я хотела бы приготовить для вас что-нибудь."
10055-100550500 = "Еду?"
10055-100550510 = "Вы приедете в Шале?"
10055-100550520 = "Да, так и есть."
10055-100550530 = "Продукты я принесу с собой."
10055-100550540 = "Можете ждать с нетерпением."
10055-100550550 = "Тогда решим, когда, позже."
10055-100550560 = "Кстати, я, кажется, забыла поблагодарить вас."
10055-100550570 = "Простите за задержку."
10055-100550580 = "Спасибо, было очень вкусно."
10055-100550590 = "И тут я подумала:"
10055-100550600 = "насчёт той водки."
10055-100550610 = "Может, использовать её для маринада?"
10055-100550620 = "Для готовки нужен саке,"
10055-100550630 = "водка не подойдёт."
10055-100550640 = "Хе-хе."
10055-100550650 = "Как всегда, вы забавный, Сенсей."
10055-100550660 = "Поняла, так и сделаю."
10055-100550670 = "Тогда до встречи, Сенсей."
