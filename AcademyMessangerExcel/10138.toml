[translation]
10138-101380010 = "Сенсей. Вы ведь сегодня придёте в нашу академию?"
10138-101380020 = "Ага. По полевым делам. Просто инспекция."
10138-101380030 = "А, идеально."
10138-101380040 = "Тогда можете принести мне кое-какие материалы?"
10138-101380050 = "В магазине академии того, что мне нужно, не продают."
10138-101380060 = "Это что... просьба о КОНТРАБАНДЕ?"
10138-101380070 = "Не говорите так!"
10138-101380080 = "Это не запрещённые товары!"
10138-101380090 = "Их даже не отметят при проверке."
10138-101380100 = "Я отправлю вам список, хорошо?"
10138-101380110 = "Так что просто... Пожалуйста! Сделайте мне одолжение!"
10138-101380120 = "Сенсей? Вы нормально добрались обратно?"
10138-101380130 = "Они ведь снова не порвались или что-то такое?"
10138-101380140 = "Ага! Ты починила очень надёжно!"
10138-101380150 = "Теперь вы мне за это должны."
10138-101380160 = "Потом обязательно отплатите!"
10138-101380170 = "Я так обрадовался, что это была ты, Рэна!"
10138-101380180 = "А я вообще не обрадовалась, знаете ли?!"
10138-101380190 = "Неважно. Я рада, что вы нормально добрались."
10138-101380200 = "Поговорим позже."
10138-101380210 = "Эй, помните, что вы всё ещё мне должны? За прошлый раз?"
10138-101380220 = "Пришло время вернуть долг."
10138-101380230 = "И... как именно?"
10138-101380240 = "Здесь слишком сложно объяснять."
10138-101380250 = "Просто приходите встретиться со мной."
10138-101380260 = "Я отправлю место и время."
10138-101380270 = "Сенсей... Мне конец."
10138-101380280 = "Хм? Зачем?"
10138-101380290 = "Я встретила соседок по комнате"
10138-101380300 = "и показала им фотографии..."
10138-101380310 = "А ещё была"
10138-101380320 = "размытая фотография вашей руки"
10138-101380330 = "на одном из снимков"
10138-101380340 = "Что ты им сказала??"
10138-101380350 = "Я не могла сказать, что это вы!!"
10138-101380360 = "Поэтому просто сказала, что это призрак"
10138-101380370 = "У-У-УГГГХХХХХХ"
10138-101380380 = "Я сказала им!!!"
10138-101380390 = "Что призраки существуют!!!"
10138-101380400 = "СВОИМИ СОБСТВЕННЫМИ УСТАМИ!!!"
10138-101380410 = "И мои старшие"
10138-101380420 = "в панике!!! говорят, что это скрытая седьмая тайна!"
10138-101380430 = "А-а-а-у-у-ух!!"
10138-101380440 = "Клянусь...!"
10138-101380450 = "В следующий раз точно...!"
10138-101380460 = "Давайте... продолжать стараться..."
10138-101380470 = "Сенсей. Помните, что случилось в прошлый раз?"
10138-101380480 = "Когда ваша рука попала на фотографию"
10138-101380490 = "и я сказала старшекурсницам,"
10138-101380500 = "что это призрак?"
10138-101380510 = "Ага. Прости за это..."
10138-101380520 = "Почему вы извиняетесь?"
10138-101380530 = "Это моя вина, что я плохо фотографирую."
10138-101380540 = "В общем, из-за этого"
10138-101380550 = "девочки сказали,"
10138-101380560 = "что мне нужно сделать себе омамори."
10138-101380570 = "Поэтому я заодно"
10138-101380580 = "сделаю один и вам."
10138-101380590 = "...Омамори для меня?? СДЕЛАННЫЙ ТОБОЙ??"
10138-101380600 = "ЭЙ!!!!"
10138-101380610 = "НЕ ДЕЛАЙТЕ ИЗ ЭТОГО СОБЫТИЕ!"
10138-101380620 = "Я вообще не знаю, зачем мне это делать!"
10138-101380630 = "Уф. В общем! Загляните в школу, когда будет время."
10138-101380640 = "Уже иду! Буду сегодня после обеда!"
10138-101380650 = "Сенсей..."
10138-101380660 = "По дороге домой ничего странного не случилось, да?"
10138-101380670 = "Например... не знаю, снова наступили на жвачку?"
10138-101380680 = "Всё отлично! Благодаря твоему омамори!"
10138-101380690 = "Не то чтобы я суеверная или что-то такое..."
10138-101380700 = "Но держите его при себе."
10138-101380710 = "Потому что я вам его дала."
10138-101380720 = "Поняли?"
10138-101380730 = "Ага. Ведь он сделан с твоими чувствами."
10138-101380740 = "ВЫ!! Хватит говорить странные вещи!"
10138-101380750 = "До следующего раза! Наверное!"
10138-101380760 = "Сенсей. Вы сегодня придёте в Вайлдхант?"
10138-101380770 = "Ага. Хочешь блинчик с шоколадом и бананом или что-нибудь такое?"
10138-101380780 = "Я-Я в порядке!"
10138-101380790 = "На самом деле мне нужно другое."
10138-101380800 = "У меня опять закончились материалы для аксессуаров."
10138-101380810 = "Потому что в магазине произошла террористическая атака..."
10138-101380820 = "ЧТО? Какая ещё?"
10138-101380830 = "Кто-то нарисовал кучу странных рисунков"
10138-101380840 = "по всей стене магазина."
10138-101380850 = "Так что он закрыт, пока с этим не разберутся."
10138-101380860 = "вздо-о-ох"
10138-101380870 = "Так что, пожалуйста, сделайте мне это одолжение."
10138-101380880 = "И блинчик тоже возьму!"
10138-101380890 = "...Делайте что хотите!"
