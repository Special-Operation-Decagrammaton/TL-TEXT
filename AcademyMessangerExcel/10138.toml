[translation]
10138-101380010 = "Сенсей, вы ведь говорили, что сегодня придёте в академию?"
10138-101380020 = "Да, меня попросили провести небольшое расследование."
10138-101380030 = "Как раз кстати."
10138-101380040 = "Не могли бы вы заодно купить мне материалы для украшений?"
10138-101380050 = "В здешнем магазине нет подходящих."
10138-101380060 = "...Запрос на контрабанду?"
10138-101380070 = "С чего бы это!"
10138-101380080 = "Это же не запрещённый товар!"
10138-101380090 = "На контроле не задержат!"
10138-101380100 = "Я пришлю список."
10138-101380110 = "Заодно, когда будете идти сюда, пожалуйста!"
10138-101380120 = "Сенсей, вы благополучно добрались?"
10138-101380130 = "Опять ничего не порвалось?"
10138-101380140 = "Всё в порядке! Без проблем!"
10138-101380150 = "Хе-хе. Так что это у вас должок."
10138-101380160 = "В следующий раз обязательно верните, ладно?"
10138-101380170 = "Хорошо, что нашла вас Рена!"
10138-101380180 = "А вот мне было нехорошо!?"
10138-101380190 = "Ну ладно. Главное, что вы добрались целым."
10138-101380200 = "Свяжусь с вами позже."
10138-101380210 = "Вы ведь не забыли о том случае?"
10138-101380220 = "Представился шанс вернуть долг?"
10138-101380230 = "Что нужно сделать?"
10138-101380240 = "Объяснять на словах неудобно,"
10138-101380250 = "так что просто подойдите, хорошо?"
10138-101380260 = "В то же время, в том же месте."
10138-101380270 = "Сенсей... что же мне делать..."
10138-101380280 = "Что случилось?"
10138-101380290 = "Я показала старшим"
10138-101380300 = "ту самую фотографию,"
10138-101380310 = "и на ней оказалась ваша рука..."
10138-101380320 = "Слегка видно, но она есть."
10138-101380330 = "Была такая."
10138-101380340 = "Разве это было плохо...?"
10138-101380350 = "Я не могу же сказать, что была с вами."
10138-101380360 = "Поэтому я сказала, что это и есть привидение."
10138-101380370 = "Своими словами..."
10138-101380380 = "Шшшшш!!!"
10138-101380390 = "Что здесь было привидение... вот"
10138-101380400 = "Я сама! Своими словами сказала!"
10138-101380410 = "И старшие после этого"
10138-101380420 = "подняли шум, мол, это седьмое чудо!!!!"
10138-101380430 = "А-а-а-а!! Да чтоб тебя!!!!!!"
10138-101380440 = "Погодите у меня!!!!"
10138-101380450 = "В следующий раз обязательно...!!!!!!"
10138-101380460 = "Давайте справимся вместе..."
10138-101380470 = "Помните тот случай?"
10138-101380480 = "Когда на фото засветилась ваша рука,"
10138-101380490 = "и я сказала, что это привидение,"
10138-101380500 = "старшим."
10138-101380510 = "Помню. Прости..."
10138-101380520 = "За что вы извиняетесь?"
10138-101380530 = "Это ведь я не заметила, что вы попали в кадр."
10138-101380540 = "И вот..."
10138-101380550 = "Старшие посоветовали мне"
10138-101380560 = "сделать оберег."
10138-101380570 = "Так что, когда делала свой,"
10138-101380580 = "решила сделать и для вас."
10138-101380590 = "Рена... сделает оберег?"
10138-101380600 = "Ух"
10138-101380610 = "Не повторяйте это специально!"
10138-101380620 = "Я и сама знаю, что это звучит странно!"
10138-101380630 = "Так что заходите, когда будет время."
10138-101380640 = "Тогда я зайду сейчас!"
10138-101380650 = "Сенсей, как у вас дела после того дня?"
10138-101380660 = "Ничего странного не происходило?"
10138-101380670 = "Например, не наступали на жвачку."
10138-101380680 = "Благодаря вашему оберегу всё нормально!"
10138-101380690 = "Хотя я не особо верю в обереги..."
10138-101380700 = "Носите его постоянно."
10138-101380710 = "Ведь это я вам его дала."
10138-101380720 = "Договорились?"
10138-101380730 = "Да! В нём же ваша забота."
10138-101380740 = "Опять вы за своё."
10138-101380750 = "Ну, пока."
10138-101380760 = "Сенсей, вы ведь сегодня придёте в Дикую Охоту?"
10138-101380770 = "Да. Хотите, куплю шоколадно-банановый креп?"
10138-101380780 = "Не надо мне!"
10138-101380790 = "В общем, у меня просьба."
10138-101380800 = "Нужно купить материалы для украшений."
10138-101380810 = "В магазин напали террористы."
10138-101380820 = "Террористы!?"
10138-101380830 = "Кто-то на стене магазина"
10138-101380840 = "нарисовал странную картину..."
10138-101380850 = "И говорят, что будут закрыты, пока всё не смоют."
10138-101380860 = "Вздох..."
10138-101380870 = "Вот такие дела. Полагаюсь на вас."
10138-101380880 = "А креп-то я всё равно куплю!"
10138-101380890 = "Делайте что хотите!?"