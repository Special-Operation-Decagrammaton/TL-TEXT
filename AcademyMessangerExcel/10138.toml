[translation]
10138-101380010 = "Sensei, você disse que vinha para a academia hoje, né?"
10138-101380020 = "Sim, me pediram para fazer uma pequena investigação."
10138-101380030 = "Veio bem a calhar."
10138-101380040 = "Pode comprar uns materiais de bijuteria para mim no caminho?"
10138-101380050 = "Não tem do tipo que eu preciso nas lojas daqui."
10138-101380060 = "...Está me pedindo para fazer contrabando?"
10138-101380070 = "Claro que não, tá doido?!"
10138-101380080 = "Não é nenhum item proibido pelas regras!"
10138-101380090 = "Não vai nem ser barrado na revista da entrada!"
10138-101380100 = "Vou te mandar a lista,"
10138-101380110 = "então traz pra mim já que você vem pra cá!"
10138-101380120 = "Sensei, conseguiu voltar pra casa direitinho?"
10138-101380130 = "Não rasgou a roupa de novo não, né?"
10138-101380140 = "Tudo certo! Sem nenhum problema!"
10138-101380150 = "Hehe. Agora você me deve uma, viu?"
10138-101380160 = "Trate de retribuir o favor depois, tá?"
10138-101380170 = "Ainda bem que foi você quem me encontrou, Rena!"
10138-101380180 = "Pra mim não foi nada bom, tá?!"
10138-101380190 = "Mas deixa pra lá. O importante é que você voltou em segurança."
10138-101380200 = "Depois a gente se fala."
10138-101380210 = "Não esqueceu do que rolou no outro dia, né?"
10138-101380220 = "Chegou a hora de pagar o que me deve!"
10138-101380230 = "O que eu preciso fazer?"
10138-101380240 = "Explicar por mensagem é meio ruim,"
10138-101380250 = "então pode vir até aqui primeiro?"
10138-101380260 = "Naquele horário e naquele lugar de antes."
10138-101380270 = "Sensei... e agora, o que eu faço?"
10138-101380280 = "O que aconteceu?"
10138-101380290 = "Eu mostrei aquelas fotos"
10138-101380300 = "para as minhas veteranas, só que..."
10138-101380310 = "Tinha uma foto em que o seu braço..."
10138-101380320 = "aparecia bem de levinho"
10138-101380330 = "no canto da imagem."
10138-101380340 = "E deu algum problema...?"
10138-101380350 = "Eu não podia falar que tinha ido lá escondida com você, né!"
10138-101380360 = "Então acabei dizendo que aquilo era a verdadeira forma do fantasma..."
10138-101380370 = "Com a minha própria boca..."
10138-101380380 = "Hisss!!!"
10138-101380390 = "Eu mesma!!!"
10138-101380400 = "Disse com a minha própria boca que tinha um fantasma lá!"
10138-101380410 = "E agora as veteranas"
10138-101380420 = "estão no maior alvoroço dizendo que esse é o Sétimo Mistério da academia!!!!"
10138-101380430 = "Aaaaaah!! Que ódio!!!!!!"
10138-101380440 = "Elas vão ver só!!!!"
10138-101380450 = "Da próxima vez não passa nada...!!!!!"
10138-101380460 = "Vamos dar o nosso melhor juntos na próxima..."
10138-101380470 = "Lembra daquela história do outro dia?"
10138-101380480 = "Da foto em que o seu braço saiu sem querer"
10138-101380490 = "e eu acabei falando para as veteranas"
10138-101380500 = "que aquilo era um fantasma?"
10138-101380510 = "Lembro sim. Desculpa por aquilo..."
10138-101380520 = "Por que você tá pedindo desculpa, Sensei?"
10138-101380530 = "A culpa foi minha por não ter notado que você tinha saído na foto."
10138-101380540 = "Enfim..."
10138-101380550 = "As veteranas vieram me dizer"
10138-101380560 = "que seria bom eu fazer um amuleto de proteção."
10138-101380570 = "Então, aproveitando que vou fazer o meu,"
10138-101380580 = "pensei em fazer um para você também, Sensei."
10138-101380590 = "Você... fazendo um amuleto, Rena?"
10138-101380600 = "Argh"
10138-101380610 = "Não precisa repetir em voz alta!"
10138-101380620 = "Até eu sei que isso não faz o menor sentido pra mim!"
10138-101380630 = "Enfim, passa aqui quando estiver livre."
10138-101380640 = "Então estou indo para aí agora mesmo!"
10138-101380650 = "E aí, Sensei, como estão as coisas desde aquele dia?"
10138-101380660 = "Não aconteceu nada de estranho não, né?"
10138-101380670 = "Tipo pisar num chiclete na rua ou algo assim?"
10138-101380680 = "Graças ao seu amuleto, não aconteceu nada de ruim, Rena!"
10138-101380690 = "Não é que eu acredite no poder de amuletos nem nada, mas..."
10138-101380700 = "Vê se anda sempre com ele, viu?"
10138-101380710 = "Afinal, fui eu que fiz pra você."
10138-101380720 = "Entendeu?"
10138-101380730 = "Claro! Está cheio do seu carinho, afinal."
10138-101380740 = "Lá vem você falando essas coisas de novo..."
10138-101380750 = "Bom, até mais."
10138-101380760 = "Sensei, você vem para a Wild Hunt hoje, né?"
10138-101380770 = "Vou sim. Quer que eu leve um crepe de banana com chocolate?"
10138-101380780 = "Não preciso disso não!"
10138-101380790 = "Aliás, queria te pedir outro favor."
10138-101380800 = "Pode comprar materiais de bijuteria para mim de novo?"
10138-101380810 = "É que a loja daqui sofreu um atentado terrorista..."
10138-101380820 = "Um atentado terrorista?!"
10138-101380830 = "Alguém pichou uma pintura"
10138-101380840 = "super bizarra no muro da loja..."
10138-101380850 = "E disseram que vão ficar fechados até conseguirem remover toda a tinta."
10138-101380860 = "Haa..."
10138-101380870 = "Então já sabe, conto com você."
10138-101380880 = "Vou levar o crepe de banana com chocolate também!"
10138-101380890 = "Faça o que quiser?!"
