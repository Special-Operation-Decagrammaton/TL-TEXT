[translation]
26008-260080010 = "Sensei, bom trabalho!"
26008-260080020 = "Hehe, ufufufufu..."
26008-260080030 = "Kukukuku?"
26008-260080040 = "Fufufufu...?"
26008-260080050 = "Que risada de vilão de quinta categoria é essa?!"
26008-260080060 = "Eu não estava rindo desse jeito, tá bom?!"
26008-260080070 = "Mas e aí, o que deu em você do nada, Shizukinha?"
26008-260080080 = "Shizukinha...?"
26008-260080090 = "Bom, vou deixar passar! Afinal, hoje é o melhor dia desde a fundação da Momoyodou!"
26008-260080100 = "Vou aceitar a brincadeira de coração aberto!"
26008-260080110 = "Pode me agradecer pela generosidade, fufufu!"
26008-260080120 = "Parece que você está de ótimo humor hoje."
26008-260080130 = "Sim, 'ótimo' não chega nem perto de descrever!"
26008-260080140 = "A partir desta barraca de praia, a Momoyodou..."
26008-260080150 = "Vai renascer como a maior rede de franquias de toda Kivotos!"
26008-260080160 = "Por isso, Sensei,"
26008-260080170 = "você tem a obrigação de testemunhar cada detalhe dessa jornada ao meu lado!"
26008-260080180 = "Lá vem você me intimando do nada como sempre..."
26008-260080190 = "Hum, Sensei..."
26008-260080200 = "O que foi?"
26008-260080210 = "Não,"
26008-260080220 = "pensando bem, não é nada."
26008-260080230 = "Enfim, vamos continuar dando o nosso melhor hoje também!"
26008-260080240 = "Por acaso tem alguma coisa te preocupando?"
26008-260080250 = "N-não é nada disso...!"
26008-260080260 = "É impressão sua, Sensei!"
26008-260080270 = "De vez em quando é bom bater um papo"
26008-260080280 = "com a dona da Momoyodou, né?"
26008-260080290 = "...S-se você coloca dessa forma!"
26008-260080300 = "Não é como se a gente não pudesse... se encontrar para conversar! Sim!"
26008-260080310 = "Sensei!"
26008-260080320 = "Bom trabalho!!"
26008-260080330 = "Bom trabalho."
26008-260080340 = "Parece que você está ainda mais animada do que o normal hoje, hein?"
26008-260080350 = "Ufufufufufu, mas é claro!"
26008-260080360 = "A Shizuko está sempre transbordando energia!"
26008-260080370 = "É que da última vez você parecia meio, hum..."
26008-260080380 = "Realmente, pode ser que sim."
26008-260080390 = "Ah, por sinal,"
26008-260080400 = "o motivo de eu ter entrado em contato hoje é que"
26008-260080410 = "tenho uma coisa que quero te mostrar agora mesmo"
26008-260080420 = "e também um assunto para conversar com você."
26008-260080430 = "Espere para ver!"
