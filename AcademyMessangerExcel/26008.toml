[translation]
26008-260080010 = "Сенсей, с возвращением!"
26008-260080020 = "Хе-хе, у-хе-хе-хе..."
26008-260080030 = "Хе-хе-хе?"
26008-260080040 = "Хе-хе-хе...?"
26008-260080050 = "Что это за смех, как у дешёвого злодея!"
26008-260080060 = "Я же так не смеюсь!?"
26008-260080070 = "И что случилось, Шизуко?"
26008-260080080 = "Шизуко...?"
26008-260080090 = "Ну да ладно! Ведь сегодня лучший день с момента открытия «Хякуядо»!"
26008-260080100 = "Я проявлю великодушие!"
26008-260080110 = "Можете даже поблагодарить меня, хе-хе-хе!"
26008-260080120 = "Ты сегодня в хорошем настроении."
26008-260080130 = "Да, это даже не «хорошее»!"
26008-260080140 = "Начиная с этого «пляжного домика», «Хякуядо» переродится..."
26008-260080150 = "...в крупнейшую сеть во всём Кивотосе!"
26008-260080160 = "Поэтому у вас, Сенсей,"
26008-260080170 = "есть долг наблюдать за этим процессом вместе со мной!"
26008-260080180 = "Как всегда, безбашенная просьба."
26008-260080190 = "Эм, Сенсей."
26008-260080200 = "Что-то случилось?"
26008-260080210 = "Нет."
26008-260080220 = "Всё-таки ничего."
26008-260080230 = "В общем, давайте сегодня постараемся!"
26008-260080240 = "Может, тебя что-то беспокоит?"
26008-260080250 = "Н-ничего такого...!"
26008-260080260 = "Вам показалось!"
26008-260080270 = "Иногда я хотел бы просто поболтать"
26008-260080280 = "с владелицей «Хякуядо»."
26008-260080290 = "...Е-если так, то!"
26008-260080300 = "Я не против встретиться и поговорить! Да!"
26008-260080310 = "Сенсей!"
26008-260080320 = "С возвращением!!"
26008-260080330 = "И тебе."
26008-260080340 = "Ты сегодня как-то особенно энергична?"
26008-260080350 = "У-хе-хе-хе, это же очевидно!"
26008-260080360 = "Шизуко всегда полна энергии!"
26008-260080370 = "А в прошлый раз ты была какой-то..."
26008-260080380 = "Да, наверное, так и было."
26008-260080390 = "А, кстати,"
26008-260080400 = "причина, по которой я вам сегодня написала,"
26008-260080410 = "в том, что я хочу кое-что показать"
26008-260080420 = "и кое-что рассказать."
26008-260080430 = "Ждите с нетерпением!"