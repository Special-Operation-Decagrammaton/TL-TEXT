[translation]
26008-260080010 = "Сенсей!"
26008-260080020 = "Хи-хи... Хи-хи-хи! Хи-хи-хи-хи! Ха-ха-ха!"
26008-260080030 = "Мва-ха-ха-ха!"
26008-260080040 = "Хи-хи-хи...?"
26008-260080050 = "Звучишь как третьесортная злодейка из плохого фильма!"
26008-260080060 = "Я так не смеюсь!"
26008-260080070 = "Ну и чем ты занимаешься этим летом, маленькая Шизуко?"
26008-260080080 = "Маленькая...?"
26008-260080090 = "Ну, сегодня лучший день для Момоёдо!"
26008-260080100 = "Так что я проявлю великодушие и спущу тебе это с рук!"
26008-260080110 = "Можешь поблагодарить меня. Хи-хи-хи!"
26008-260080120 = "Ты в хорошем настроении."
26008-260080130 = "И это ещё не всё!"
26008-260080140 = "Используя Пляжную хижину как первый шаг,"
26008-260080150 = "Момоёдо переродится во франшизу, известную по всему Кивотосу!"
26008-260080160 = "Так что, Сенсей,"
26008-260080170 = "твой долг — стать свидетелем нашего господства!"
26008-260080180 = "Как всегда напористая..."
26008-260080190 = "Эм, Сенсей?"
26008-260080200 = "Что такое?"
26008-260080210 = "Нет..."
26008-260080220 = "Ничего. Ага."
26008-260080230 = "Давай и дальше работать вместе."
26008-260080240 = "Тебе нужен совет?"
26008-260080250 = "Н-ничего подобного!"
26008-260080260 = "Не воображай лишнего и не радуйся раньше времени!"
26008-260080270 = "Хм... Я хочу поболтать с хозяйкой"
26008-260080280 = "Пляжной хижины Момоёдо."
26008-260080290 = "В-в таком случае..."
26008-260080300 = "Ну, почему бы и нет? Можем встретиться и поболтать! Конечно!"
26008-260080310 = "Привет!"
26008-260080320 = "Сенсей!"
26008-260080330 = "Привет, Шизуко."
26008-260080340 = "Ты сегодня... ещё энергичнее обычного!"
26008-260080350 = "Хи-хи, хи-хи-хи. Конечно!"
26008-260080360 = "Я всегда полна энергии!"
26008-260080370 = "Но раньше..."
26008-260080380 = "Я не уверена, но пока будем считать так."
26008-260080390 = "Так вот, причина, по которой"
26008-260080400 = "я позвала тебя..."
26008-260080410 = "Есть кое-что, что я хочу"
26008-260080420 = "тебе показать! И обсудить!"
26008-260080430 = "Готовься удивляться!"
