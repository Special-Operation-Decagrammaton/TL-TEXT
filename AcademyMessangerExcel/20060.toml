[translation]
20060-200600010 = "Сен"
20060-200600020 = "Сен"
20060-200600030 = "Сенсей"
20060-200600040 = "У Ибуки есть пляжный зонтик и коврик для пикника!"
20060-200600050 = "Пойдём-ё-ём!"
20060-200600060 = "Ибуки тоже хочет!"
20060-200600070 = "Сенсей, Сенсей!"
20060-200600080 = "Ибуки совсем поправилась!"
20060-200600090 = "А вы как, Сенсей?"
20060-200600100 = "Полон сил!"
20060-200600110 = "У Ибуки сегодня занятие."
20060-200600120 = "Мо..."
20060-200600130 = "Можете прийти?"
20060-200600140 = "Конечно!"
20060-200600150 = "Хи-хи."
20060-200600160 = "Увидимся у камней на пляже"
20060-200600170 = "через полчаса!"
20060-200600180 = "Простите, Сенсей..."
20060-200600190 = "Ибуки была тяжёлой...?"
20060-200600200 = "Ничего подобного."
20060-200600210 = "Я могу носить тебя на руках хоть целый день."
20060-200600220 = "Хи-хи."
20060-200600230 = "Спасибо, Сенсей...!"
20060-200600240 = "Сенсей!"
20060-200600250 = "Рядом с пляжем открылась новая торговая улочка!"
20060-200600260 = "Что? Правда?!"
20060-200600270 = "Ибуки хочет пойти"
20060-200600280 = "туда вместе с Сенсеем!"
20060-200600290 = "Стоит тебе позвать, и я приду, Ибуки!"
20060-200600300 = "Сенсей!"
20060-200600310 = "Ибуки"
20060-200600320 = "придумала новый способ рисовать!"
20060-200600330 = "Ого, какой?"
20060-200600340 = "Это..."
20060-200600350 = "эм"
20060-200600360 = "Ибуки вам покажет!"
20060-200600370 = "Сенсей, Сенсей!"
20060-200600380 = "Вы хорошо добрались домой?"
20060-200600390 = "Да! А что с твоим рисунком?"
20060-200600400 = "Ты закончила рисунок, Ибуки?"
20060-200600410 = "А."
20060-200600420 = "У Ибуки закончились кусочки,"
20060-200600430 = "поэтому Ибуки нарисовала только половину!"
20060-200600440 = "А..."
20060-200600450 = "Но Ибуки не расстраивается!"
20060-200600460 = "Она может снова пойти на пляж"
20060-200600470 = "и набрать ещё!"
20060-200600480 = "И Сенсей тоже придёт, правда?"
20060-200600490 = "Как вчера, да?"
20060-200600500 = "Конечно!"
