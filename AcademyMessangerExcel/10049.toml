[translation]
10049-100490010 = "Здравствуйте, Сенсей. Это Казуса Анзама."
10049-100490020 = "Ах..."
10049-100490030 = "Вы, наверное, заняты сейчас? Ответьте, когда будет время."
10049-100490040 = "Тогда я буду ждать."
10049-100490050 = "Ты говоришь довольно дружелюбно."
10049-100490060 = "Смешиваешь вежливый и неформальный стиль...?"
10049-100490070 = "...Что."
10049-100490080 = "Раз я пишу вам, иногда мне кажется, что лучше использовать вежливую форму."
10049-100490090 = "Короче... раз вы отвечаете, значит, у вас есть время. Хорошо."
10049-100490100 = "Вы, наверное, заняты, так что я сама подойду к Шале."
10049-100490110 = "Тогда свяжусь позже."
10049-100490120 = "Сенсей, вы благополучно добрались?"
10049-100490130 = "Я добралась до своей комнаты. Как раз собиралась принять душ."
10049-100490140 = "Ах..."
10049-100490150 = "Зачем я вообще это сказала..."
10049-100490160 = "М-м-м..."
10049-100490170 = "...В общем, не обращайте внимания. Просто подумала, что стоит сказать."
10049-100490180 = "В любом случае, спасибо большое за сегодня!"
10049-100490190 = "Тогда"
10049-100490200 = "до встречи, Сенсей."
10049-100490210 = "Я устала."
10049-100490220 = "Сенсей, вы сейчас работаете?"
10049-100490230 = "Да, но..."
10049-100490240 = "Казуса, ты ещё не дома?"
10049-100490250 = "А, ну, да..."
10049-100490260 = "Сегодня я решила наверстать упущенное и задержалась в школе допоздна."
10049-100490270 = "Собираюсь уходить."
10049-100490280 = "По дороге мне стало скучно, вот я и написала. Ничего особенного."
10049-100490290 = "Тогда хорошего вам дня."
10049-100490300 = "Ах,"
10049-100490310 = "Сенсей."
10049-100490320 = "..."
10049-100490340 = "Фото?"
10049-100490350 = "Вы благополучно добрались?"
10049-100490360 = "Ну, да."
10049-100490370 = "Короче, уже поздно,"
10049-100490380 = "вот и всё."
10049-100490390 = "Раз я была с вами до такого часа,"
10049-100490400 = "решила, что стоит сообщить, что я добралась."
10049-100490410 = "Но я не привыкла фотографироваться, так что выражение лица немного... неловко."
10049-100490420 = "Так что"
10049-100490430 = "посмотрите и удалите."
10049-100490440 = "Тогда до встречи."
10049-100490450 = "Сенсей, вы сейчас, случайно, не заняты?"
10049-100490460 = "Если да, то ничего страшного."
10049-100490470 = "Продолжая прошлый раз... у вас есть любимые десерты?"
10049-100490480 = "Любимые десерты?"
10049-100490490 = "Ты собираешься принести?"
10049-100490500 = "Ах, наверное, это было слишком внезапно."
10049-100490510 = "??? О чём вы?"
10049-100490520 = "Ах, ну, может, и принесу, если захочу?"
10049-100490530 = "Ведь если я куплю, а вам не понравится, будет неловко."
10049-100490540 = "М-м..."
10049-100490550 = "Ладно, забудьте."
10049-100490560 = "Считайте, что я ничего не говорила."
10049-100490570 = "Сенсей, вы, случаем,"
10049-100490580 = "сейчас на месте?"
10049-100490590 = "Да, на месте."
10049-100490600 = "Что случилось?"
10049-100490610 = "Да нет, ничего серьёзного."
10049-100490620 = "Раз вы на месте, хорошо."
10049-100490630 = "Я сейчас зайду."
10049-100490640 = "Слушайте, Сенсей."
10049-100490650 = "На всякий случай скажу ещё раз:"
10049-100490660 = "это действительно не просто «утилизация»."
10049-100490670 = "Но в этот раз я выбрала и принесла порцию и для вас."
10049-100490680 = "Эти два утверждения противоречат друг другу."
10049-100490690 = "Не волнуйтесь, было вкусно."
10049-100490700 = "...Да."
10049-100490710 = "М-м..."
10049-100490720 = "И напоследок:"
10049-100490730 = "то, с кошкой —"
10049-100490740 = "вы ведь шутили, да?"
10049-100490750 = "Кто знает."
10049-100490760 = "В итоге всё раскрылось."
10049-100490770 = "..."
10049-100490780 = "Как же низко..."
