[translation]
10049-100490010 = "Здравствуйте, Сенсей. Это Кёяма Кадзуса."
10049-100490020 = "Эм..."
10049-100490030 = "Ты сейчас занят? Дай знать, хорошо?"
10049-100490040 = "Буду ждать. Спасибо."
10049-100490050 = "Ты одновременно вежливая и непринуждённая."
10049-100490060 = "Каким-то образом ты и формальная, и неформальная одновременно."
10049-100490070 = "Странно..."
10049-100490080 = "Иногда мне кажется, что я должна быть вежливой, потому что ты учитель."
10049-100490090 = "В любом случае ты ответил, значит, время есть?"
10049-100490100 = "Я знаю, что ты занят, поэтому сама приду к тебе."
10049-100490110 = "Напишу, когда буду на месте."
10049-100490120 = "Сенсей, ты благополучно добрался?"
10049-100490130 = "Я дома. Уже в комнате, скоро пойду в душ."
10049-100490140 = "О!"
10049-100490150 = "Зачем я вообще тебе это пишу?"
10049-100490160 = "Ха-ха..."
10049-100490170 = "Ну, не обращай внимания. Просто хотела сообщить, что я дома."
10049-100490180 = "Огромное спасибо за сегодня."
10049-100490190 = "Ну тогда..."
10049-100490200 = "Увидимся позже, Сенсей."
10049-100490210 = "Я устала."
10049-100490220 = "Сенсей, ты сейчас работаешь?"
10049-100490230 = "Да..."
10049-100490240 = "Ты всё ещё на улице?"
10049-100490250 = "О, ну, да."
10049-100490260 = "Я задержалась в школе, чтобы подтянуть учёбу."
10049-100490270 = "Сейчас уже собираюсь возвращаться."
10049-100490280 = "Просто хотела поздороваться. Вот и всё."
10049-100490290 = "Хорошего дня!"
10049-100490300 = "А!"
10049-100490310 = "Сенсей."
10049-100490320 = "..."
10049-100490340 = "??? Фотография, сейчас?"
10049-100490350 = "Это значит, что ты благополучно добралась домой?"
10049-100490360 = "Ну,"
10049-100490370 = "Было уже поздно, поэтому..."
10049-100490380 = "Да."
10049-100490390 = "Я была с тобой допоздна."
10049-100490400 = "Поэтому решила сообщить, когда добралась домой."
10049-100490410 = "Но я не привыкла фотографироваться, поэтому лицо получилось странным."
10049-100490420 = "А!"
10049-100490430 = "Можешь теперь удалить."
10049-100490440 = "Увидимся."
10049-100490450 = "Сенсей, вы сейчас заняты?"
10049-100490460 = "Ничего, если да."
10049-100490470 = "Сенсей, у тебя есть любимый десерт? Кажется, мы уже немного об этом говорили."
10049-100490480 = "О моих вкусах?"
10049-100490490 = "Если скажу, ты купишь?"
10049-100490500 = "Эм, наверное, это немного внезапно."
10049-100490510 = "???"
10049-100490520 = "Ну, может быть, если смогу?"
10049-100490530 = "Если я собираюсь тебе что-то подарить, хочу убедиться, что тебе действительно понравится."
10049-100490540 = "Эм-м..."
10049-100490550 = "Не переживай. Давай просто сделаем вид, что я тебе не писала."
10049-100490560 = "Не будем об этом говорить."
10049-100490570 = "Сенсей."
10049-100490580 = "Ты там?"
10049-100490590 = "Ага. Это я."
10049-100490600 = "Что происходит?"
10049-100490610 = "Ничего."
10049-100490620 = "Просто хотела узнать, на месте ли ты."
10049-100490630 = "Сейчас приду."
10049-100490640 = "Эм..."
10049-100490650 = "Сенсей."
10049-100490660 = "Я знаю, что уже говорила, но я не пыталась от этого избавиться или что-то такое."
10049-100490670 = "В следующий раз я выберу что-нибудь специально для тебя."
10049-100490680 = "Даже не знаю, что думать о твоих словах..."
10049-100490690 = "Всё нормально. Было вкусно."
10049-100490700 = "Эм..."
10049-100490710 = "Хм..."
10049-100490720 = "И ещё кое-что..."
10049-100490730 = "Эм..."
10049-100490740 = "Ты ведь дразнил меня этим разговором про кошачий язык, да?"
10049-100490750 = "О, только сейчас поняла?"
10049-100490760 = "Хм, ладно, поймал."
10049-100490770 = "..."
10049-100490780 = "Уф."
