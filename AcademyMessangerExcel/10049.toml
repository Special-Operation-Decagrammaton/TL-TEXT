[translation]
10049-100490010 = "Olá, Sensei. Aqui é a Kyouyama Kazusa."
10049-100490020 = "Aaah..."
10049-100490030 = "Será que você tá ocupado agora? Quando tiver um tempinho, se puder me responder..."
10049-100490040 = "Bom, fico no aguardo."
10049-100490050 = "Seu jeito de falar é bem amigável, né?"
10049-100490060 = "Misturando jeito formal com informal...?"
10049-100490070 = "...Que foi?"
10049-100490080 = "Como é mensagem pro Sensei, às vezes eu fico pensando se não é melhor ser mais formal, só isso."
10049-100490090 = "Enfim... se você já tá respondendo, parece que tem tempo agora. Que bom."
10049-100490100 = "Imagino que você esteja ocupado, então eu vou aí pros lados da Schale."
10049-100490110 = "Bom, mais tarde mando mensagem de novo."
10049-100490120 = "Sensei, conseguiu voltar tranquilo?"
10049-100490130 = "Eu já cheguei direitinho no meu quarto. Tava pensando em tomar um banho agora."
10049-100490140 = "Ah..."
10049-100490150 = "Por que é que eu fui falar um negócio desses do nada?"
10049-100490160 = "Uuuugh..."
10049-100490170 = "...Bom, deixa pra lá. Só achei que era bom avisar que cheguei."
10049-100490180 = "Enfim, muito obrigada mesmo por hoje!"
10049-100490190 = "Falou,"
10049-100490200 = "até mais, Sensei."
10049-100490210 = "Que cansaço..."
10049-100490220 = "Sensei, tá trabalhando agora?"
10049-100490230 = "Estou trabalhando sim, mas..."
10049-100490240 = "Ainda está na rua, Kazusa?"
10049-100490250 = "Ah, pois é..."
10049-100490260 = "Hoje resolvi revisar de uma vez toda a matéria acumulada e acabei ficando até tarde na escola."
10049-100490270 = "Tava indo embora agora."
10049-100490280 = "Como tô à toa no caminho de volta, resolvi mandar mensagem. Não tem nenhum motivo especial não."
10049-100490290 = "Bom, bom trabalho aí."
10049-100490300 = "Ah,"
10049-100490310 = "Sensei"
10049-100490320 = "..."
10049-100490340 = "Uma foto?"
10049-100490350 = "Chegou em casa em segurança?"
10049-100490360 = "Uhum, sim."
10049-100490370 = "Enfim, já tá tarde e..."
10049-100490380 = "É isso aí."
10049-100490390 = "Como fiquei com você até aquela hora, Sensei,"
10049-100490400 = "achei melhor pelo menos avisar direitinho que cheguei bem."
10049-100490410 = "Mas como não tenho muito costume de tirar selfie, minha cara saiu meio... haha..."
10049-100490420 = "Então,"
10049-100490430 = "depois que vir, apaga, tá?"
10049-100490440 = "Até mais."
10049-100490450 = "Sensei, por acaso tá ocupado agora?"
10049-100490460 = "Se tiver, deixa pra lá, mas"
10049-100490470 = "continuando o papo do outro dia... tem algum doce de que você goste muito?"
10049-100490480 = "Um doce de que eu goste?"
10049-100490490 = "Por acaso você vai comprar e trazer para mim?"
10049-100490500 = "Aaah, acho que perguntei meio do nada, né?"
10049-100490510 = "??? Do que você está falando?"
10049-100490520 = "Ah, bom... Se me der na telha, quem sabe eu compro?"
10049-100490530 = "Tipo... seria chato eu comprar e acabar não sendo do seu gosto, né?"
10049-100490540 = "Huum..."
10049-100490550 = "Quer saber, fim de papo."
10049-100490560 = "Finge que não leu isso."
10049-100490570 = "Sensei, por acaso"
10049-100490580 = "você tá na sua sala agora?"
10049-100490590 = "Sim, estou aqui."
10049-100490600 = "O que houve?"
10049-100490610 = "Não é nada demais."
10049-100490620 = "Se você tá aí, então beleza."
10049-100490630 = "Tô entrando aí rapidinho."
10049-100490640 = "Hum, Sensei"
10049-100490650 = "Só pra garantir, vou repetir mais uma vez:"
10049-100490660 = "Eu não tava só \"desovando as sobras\" em você, tá?"
10049-100490670 = "Mas da próxima vez eu escolho e levo a sua parte direitinho."
10049-100490680 = "Essas duas frases já estão se contradizendo logo de cara."
10049-100490690 = "Fica tranquila, estava uma delícia."
10049-100490700 = "...Ah, é?"
10049-100490710 = "Huum..."
10049-100490720 = "Ah, e por último..."
10049-100490730 = "Tipo, sabia..."
10049-100490740 = "Você tava tirando uma com a minha cara naquela parte do gato, né?"
10049-100490750 = "Quem sabe, né?"
10049-100490760 = "Acabou descobrindo, é?"
10049-100490770 = "..."
10049-100490780 = "Você não presta..."
