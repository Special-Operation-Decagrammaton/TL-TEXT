[translation]
10065-100650010 = "Здравствуйте, Сенсей."
10065-100650020 = "Эм, здравствуйте... Кто это?"
10065-100650030 = "Ах, разумеется. Я впервые приветствую тебя не в официальном качестве."
10065-100650040 = "Меня зовут Куваками Кахо. Я имею честь быть вице-президентом Клуба Инь-Ян Объединённой академии Хяккияко."
10065-100650050 = "А также являюсь главным стратегом команды поддержки по связям с общественностью в сфере туризма и культуры Хяккияко."
10065-100650060 = "Приношу глубочайшие извинения за запоздалое представление. Для меня честь официально познакомиться с тобой, Сенсей из Шале."
10065-100650070 = "Стратег... связи... с общественностью...?"
10065-100650080 = "Эм... Приятно познакомиться... По какому поводу?"
10065-100650090 = "Я связываюсь с тобой по вопросу, который мы обсуждали ранее."
10065-100650100 = "А? Какому вопросу...?"
10065-100650110 = "Если тебе удобно, я хотела бы посетить Шале, чтобы обсудить именно его."
10065-100650120 = "А, понятно. Хорошо. Приходи сегодня в любое время."
10065-100650130 = "Большое спасибо. Тогда я немедленно отправляюсь."
10065-100650140 = "Немедленно...? А?!"
10065-100650150 = "Сенсей, хотя у меня не было такого намерения, факт остаётся фактом: в прошлый раз я доставила тебе неудобства."
10065-100650160 = "За это я хотела бы ещё раз извиниться."
10065-100650170 = "А? Нет, это вовсе не было неудобством..."
10065-100650180 = "Я глубоко ценю твоё понимание."
10065-100650190 = "Однако всё же хочу как следует извиниться. Не мог бы ты уделить мне немного времени сегодня?"
10065-100650200 = "О, конечно. Без проблем."
10065-100650210 = "Прекрасно! Я буду с нетерпением ждать твоего прибытия."
10065-100650220 = "Конечно. Уже иду."
10065-100650230 = "Сегодня тот день, когда я, Куваками Кахо, идеально проведу тебя."
10065-100650240 = "...А? В смысле проведёшь...?"
10065-100650250 = "Прошу прощения, я забежала вперёд. Сенсей, не мог бы ты сегодня уделить мне ещё немного времени?"
10065-100650260 = "У меня полно времени, Кахо. Что нужно?"
10065-100650270 = "Я ещё не выполнила обещание, данное тебе."
10065-100650280 = "Так что..."
10065-100650290 = "Я снова связываюсь с тобой в надежде получить ещё один шанс сопровождать тебя."
10065-100650300 = "Окажешь мне такую честь, Сенсей?"
10065-100650310 = "Да, конечно. Скоро буду."
10065-100650320 = "Большое спасибо."
10065-100650330 = "Буду ждать твоего прибытия."
10065-100650340 = "Хи-хи."
10065-100650350 = "Кахо? Ты получила хорошие новости?"
10065-100650360 = "Сенсей! Пожалуйста, дай объяснить."
10065-100650370 = "Наконец-то оно здесь..."
10065-100650380 = "Что наконец-то здесь?"
10065-100650390 = "Что же ещё! Наконец прибыла новая рекламная продукция Хяккияко, произведённая и выпущенная Клубом Инь-Ян!"
10065-100650400 = "О. Поздравляю!"
10065-100650410 = "Кхм. Разумеется, я хотела бы дать немного и тебе. Что скажешь?"
10065-100650420 = "Эм... То есть, если ты позволишь. Если не против..."
10065-100650430 = "С удовольствием. Сейчас приду!"
10065-100650440 = "Хи-хи! Великолепно. Буду ждать."
10065-100650450 = "Здравствуй, Сенсей. Это Кахо."
10065-100650460 = "Я слышала, завтра ты должен посетить Клуб Инь-Ян по работе."
10065-100650470 = "Да! Твои сведения верны!"
10065-100650480 = "Хи-хи. Как чудесно, что у нас снова будет возможность увидеться."
10065-100650490 = "Возможно, когда закончишь работу, мы сможем вместе выпить чаю в комнате отдыха."
10065-100650500 = "Время на отдых в чистой обстановке на самом деле повысит общую эффективность работы."
10065-100650510 = "Почему бы и нет!"
10065-100650520 = "Спасибо."
10065-100650530 = "Тогда буду ждать вас."
