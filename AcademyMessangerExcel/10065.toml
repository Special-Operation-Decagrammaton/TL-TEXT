[translation]
10065-100650010 = "Olá, Sensei."
10065-100650020 = "O-olá... Com quem eu falo?"
10065-100650030 = "De fato, nunca havíamos nos falado pelo contato pessoal antes."
10065-100650040 = "Sou a vice-presidente do Clube Yin-Yang da Academia Aliada Hyakkiyako e também..."
10065-100650050 = "Líder Estratégica do Departamento de Apoio e Relações Públicas da Indústria Cultural e Turística de Hyakkiyako. Meu nome é Kuwakami Kaho."
10065-100650060 = "Mesmo que um pouco tarde, gostaria de lhe apresentar meus cumprimentos."
10065-100650070 = "Estratégica... Relações Públicas...?"
10065-100650080 = "M-muito prazer... Mas o que houve assim de repente?"
10065-100650090 = "É a respeito \"daquele assunto\" sobre o qual entrei em contato outro dia."
10065-100650100 = "Outro dia? \"Aquele assunto\"...?"
10065-100650110 = "Eu gostaria de ir até aí para discutirmos os detalhes. Você teria disponibilidade hoje?"
10065-100650120 = "Ah, sim. Hoje está tranquilo."
10065-100650130 = "Muito obrigada. Nesse caso, estou indo para aí imediatamente."
10065-100650140 = "Assim tão rápido?!"
10065-100650150 = "Sensei, acabei lhe causando um enorme transtorno outro dia..."
10065-100650160 = "Peço-lhe sinceras desculpas."
10065-100650170 = "Imagina, não foi transtorno nenhum."
10065-100650180 = "Agradeço imensamente a sua gentileza, mas..."
10065-100650190 = "Como forma de me desculpar pelo incômodo, você poderia vir até Hyakkiyako?"
10065-100650200 = "Claro, posso ir agora mesmo?"
10065-100650210 = "Sim, estarei aguardando a sua chegada."
10065-100650220 = "Já estou a caminho."
10065-100650230 = "Eu, Kuwakami Kaho, farei questão de escoltá-lo com perfeição hoje, Sensei."
10065-100650240 = "Me escoltar...?"
10065-100650250 = "Sensei, você teria um tempinho livre hoje?"
10065-100650260 = "Tempo eu tenho, mas o que houve?"
10065-100650270 = "Eu gostaria de cumprir a promessa que fiz outro dia..."
10065-100650280 = "Hum, isto é..."
10065-100650290 = "Entrei em contato porque todos os preparativos para escoltá-lo já estão prontos."
10065-100650300 = "Portanto, Sensei, se for do seu agrado..."
10065-100650310 = "Entendi. Posso ir para aí agora?"
10065-100650320 = "Sim, muito obrigada."
10065-100650330 = "Estarei esperando por você."
10065-100650340 = "Hehehe."
10065-100650350 = "Aconteceu alguma coisa boa?"
10065-100650360 = "Sensei, escute só isso!"
10065-100650370 = "Finalmente... finalmente!"
10065-100650380 = "Finalmente...?!"
10065-100650390 = "Os produtos promocionais de Hyakkiyako que encomendamos pelo Clube Yin-Yang acabaram de chegar!"
10065-100650400 = "Parabéns!"
10065-100650410 = "Hehe, você não gostaria de levar um também, Sensei?"
10065-100650420 = "Se for do seu interesse, é claro..."
10065-100650430 = "Obrigado, já estou indo!"
10065-100650440 = "Hehe, estarei esperando."
10065-100650450 = "Olá, Sensei. Aqui é a Kaho."
10065-100650460 = "Soube que você virá ao Clube Yin-Yang a trabalho amanhã, então resolvi mandar uma mensagem."
10065-100650470 = "Sim, conto com você amanhã."
10065-100650480 = "Sim, estou ansiosa para vê-lo."
10065-100650490 = "Além disso, se não se importar, que tal tomarmos um chá depois do expediente?"
10065-100650500 = "Afinal, fazer uma pausa é fundamental."
10065-100650510 = "Obrigado. Vou aceitar o convite, então."
10065-100650520 = "Perfeito, vou prepará-lo com todo o carinho."
10065-100650530 = "Estarei aguardando a sua visita."
