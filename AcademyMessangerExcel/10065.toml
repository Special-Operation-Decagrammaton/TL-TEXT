[translation]
10065-100650010 = "Здравствуйте, Сенсей."
10065-100650020 = "З-здравствуйте... кто вы?"
10065-100650030 = "Я никогда не связывалась с вами по личным вопросам."
10065-100650040 = "Я заместитель главы Отдела Инь-Янь Объединённой академии Хяккияко, а также"
10065-100650050 = "стратегический лидер отдела по связям с общественностью и поддержке туризма и культуры Хяккияко — меня зовут Кахо Кувагами."
10065-100650060 = "Немного с опозданием, но я хотела представиться."
10065-100650070 = "Стратегия, связи с общественностью...?"
10065-100650080 = "П-приятно познакомиться... но что случилось?"
10065-100650090 = "Насчёт того дела, о котором я упоминала ранее."
10065-100650100 = "Ранее? Что за дело...?"
10065-100650110 = "Я хотела бы обсудить это с вами, у вас есть время сегодня?"
10065-100650120 = "А, да. Сегодня я свободен."
10065-100650130 = "Спасибо. Тогда я скоро приду."
10065-100650140 = "Так внезапно!?"
10065-100650150 = "Сенсей, в прошлый раз я доставила вам много хлопот..."
10065-100650160 = "Приношу свои извинения."
10065-100650170 = "Хлопот? Вовсе нет."
10065-100650180 = "Благодарю за доброту, но..."
10065-100650190 = "Чтобы извиниться за доставленные неудобства, не могли бы вы приехать в Хяккияко?"
10065-100650200 = "Хорошо, мне просто прийти?"
10065-100650210 = "Да, я буду ждать."
10065-100650220 = "Я сейчас приду."
10065-100650230 = "Я, Кахо Кувагами, сегодня безупречно проведу вас, Сенсей."
10065-100650240 = "Проведёте...?"
10065-100650250 = "Сенсей, у вас есть время сегодня?"
10065-100650260 = "Время есть, а что случилось?"
10065-100650270 = "Я хочу выполнить обещанное в прошлый раз..."
10065-100650280 = "Ну, это..."
10065-100650290 = "Подготовка к сопровождению завершена, поэтому я и написала."
10065-100650300 = "Итак, Сенсей, если вы не против..."
10065-100650310 = "Хорошо, понял. Мне просто прийти?"
10065-100650320 = "Да, спасибо."
10065-100650330 = "Тогда я буду ждать."
10065-100650340 = "Фуфуфу."
10065-100650350 = "Что-то хорошее случилось?"
10065-100650360 = "Сенсей, послушайте."
10065-100650370 = "Наконец-то... наконец-то!"
10065-100650380 = "Наконец-то...!?"
10065-100650390 = "Пришли рекламные товары Хяккияко, заказанные специально для Отдела Инь-Янь!"
10065-100650400 = "Поздравляю!"
10065-100650410 = "Фуфу, не хотите ли один, Сенсей?"
10065-100650420 = "Конечно, если вам не трудно..."
10065-100650430 = "Спасибо, я сейчас приду!"
10065-100650440 = "Фуфу, буду ждать."
10065-100650450 = "Сенсей, здравствуйте. Это Кахо."
10065-100650460 = "Я слышала, что завтра вы будете в Отделе Инь-Янь по работе, и решила написать."
10065-100650470 = "Да, завтра буду рассчитывать на вас."
10065-100650480 = "Хорошо, я с нетерпением жду встречи."
10065-100650490 = "И если вы не против, не выпить ли нам чаю после работы?"
10065-100650500 = "Отдых важен."
10065-100650510 = "Спасибо. Тогда я с удовольствием."
10065-100650520 = "Хорошо, я приготовлю всё от души."
10065-100650530 = "Тогда буду ждать."
