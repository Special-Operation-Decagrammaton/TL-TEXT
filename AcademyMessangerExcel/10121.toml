[translation]
10121-101210010 = "Приветствую, Сенсей!"
10121-101210020 = "Ситуация такова... я отправляюсь к морю отдыхать!"
10121-101210030 = "И вдобавок вместе со старшими из Хяккарёран!"
10121-101210040 = "Это здорово!"
10121-101210050 = "Да! Быть может, это всего лишь сон, по которому я плыву!"
10121-101210060 = "И чтобы наши летние каникулы прошли успешно..."
10121-101210070 = "я должна немедленно начать упражняться на гаку-бива!"
10121-101210080 = "...Гаку-бива?"
10121-101210090 = "Как традиционный инструмент связан с отпуском?"
10121-101210100 = "А!"
10121-101210110 = "Или мне лучше вместо этого потренировать танцы?"
10121-101210120 = "Обсудим это лично! Сенсей!!!"
10121-101210130 = "Эм, прямо сейчас?"
10121-101210140 = "Я начинаю замечать закономерность..."
10121-101210150 = "Да! Я уже в пути!"
10121-101210160 = "Сенсей!"
10121-101210170 = "Я надёжно убрала купальник, который мы сегодня купили!"
10121-101210180 = "Вообще-то он предназначен для того, чтобы ты его носила!"
10121-101210190 = "Понимаю! Конечно, вещь обретает истинную ценность, лишь когда выполняет своё предназначение!"
10121-101210200 = "Этот наряд такой милый и драгоценный! Не носить его как задумано было бы оскорблением для швеи!"
10121-101210210 = "Сенсей!"
10121-101210220 = "Последние несколько дней я ворочалась по ночам, думая, думая и думая!"
10121-101210230 = "Как восходящая звезда Хяккарёран и его будущее — блестящее будущее — эта элитная девушка"
10121-101210240 = "должна показать невероятную сторону себя у моря!"
10121-101210250 = "Что на тебя вдруг нашло?"
10121-101210260 = "Что именно ты имеешь в виду?"
10121-101210270 = "Ну, видите ли, невероятная морская версия меня!!"
10121-101210280 = "Будет!!"
10121-101210290 = "Хорошо плавать!"
10121-101210300 = "Результат многих бессонных ночей размышлений..."
10121-101210310 = "Я примерно так же думал в начальной школе!"
10121-101210320 = "Да! Чтобы добиться этого, я должна начать интенсивный курс тренировок! Сегодня!"
10121-101210330 = "И у меня есть просьба к вам, Сенсей!"
10121-101210340 = "Не могли бы вы передать мне тайные техники искусства плавания?"
10121-101210350 = "Ничего особенного там нет, но если хочешь..."
10121-101210360 = "Хочешь встретиться прямо сейчас?"
10121-101210370 = "Да! Пожалуйста!"
10121-101210380 = "Сенсей. Прошу прощения за мою прислугу..."
10121-101210390 = "Они повели себя не так, как обычно... Когда дело касается меня, они становятся чрезмерно заботливыми..."
10121-101210400 = "Так они показывают, что заботятся о тебе, Юкари."
10121-101210410 = "Всё нормально! Как ты себя чувствуешь, Юкари?"
10121-101210420 = "Чувствую себя немного...! МММммм!"
10121-101210430 = "Я упустила прекрасную возможность приятно провести с вами время, Сенсей."
10121-101210440 = "В следующий раз поплаваем."
10121-101210450 = "В океане вместе нам будет безопасно!"
10121-101210460 = "Фуфу! Обещание!"
10121-101210470 = "Я буду с нетерпением ждать этого дня!"
10121-101210480 = "Сенсей!"
10121-101210490 = "Сенсей! Вы выглядывали наружу?!"
10121-101210500 = "Это море!"
10121-101210510 = "О, ты снова стала собой."
10121-101210520 = "Сегодня ты полна энергии!"
10121-101210530 = "Да! Времени у нас не так много, нельзя тратить его на уныние!"
10121-101210540 = "Время — золото, как говорится!"
10121-101210550 = "Очень по-юкарински!"
10121-101210560 = "Как позитивно!"
10121-101210570 = "Тогда, Сенсей!"
10121-101210580 = "Как вы и обещали, мы должны вместе поплавать в океане!"
10121-101210590 = "Сенсей! Мне было так весело!"
10121-101210600 = "Настолько, что я едва могу держать глаза открытыми!"
10121-101210610 = "Вы очень хорошо плаваете!"
10121-101210620 = "Это было очень элегантное плавание."
10121-101210630 = "А? Нет! Я всего лишь на среднем уровне!"
10121-101210640 = "Я не могу называться элитой Хяккарёран, если я всего лишь средняя!"
10121-101210650 = "Я буду за тебя болеть!"
10121-101210660 = "Ты всегда полна энергии, Юкари."
10121-101210670 = "Спокойной ночи."
10121-101210680 = "Сенсей... Я уснула."
10121-101210690 = "Как невежливо с моей стороны... прямо посреди разговора..."
10121-101210700 = "Хорошо поспала?"
10121-101210710 = "Главное, что ты отдохнула!"
10121-101210720 = "Да! Я полностью восстановилась!"
10121-101210730 = "Более того, я прямо сейчас могла бы снова отправиться в океан!"
10121-101210740 = "Не стоит. Ночью заходить в воду опасно."
10121-101210750 = "Отдохни сегодня, чтобы завтра мы смогли повеселиться ещё больше!"
10121-101210760 = "Но сегодня я просто не могу заставить себя уснуть!"
10121-101210770 = "Мои приключения в океане были и новыми, и захватывающими!"
10121-101210780 = "Сенсей!"
10121-101210790 = "Сегодня мне было так весело!"
10121-101210800 = "Рад это слышать."
10121-101210810 = "Мне тоже было весело."
10121-101210820 = "Я, Юкари, возможно, молода, но одно знаю совершенно точно!"
10121-101210830 = "Я никогдаааа!"
10121-101210840 = "Никогдаааа! Не забуду это лето!"
