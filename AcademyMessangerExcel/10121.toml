[translation]
10121-101210010 = "Sensei! Desejo-lhe um excelente dia!"
10121-101210020 = "Ficou decidido que iremos passear na praia em breve!"
10121-101210030 = "E o melhor... junto com as minhas veteranas do Hyakkaryouran!"
10121-101210040 = "Oh, que maravilha!"
10121-101210050 = "Sim! Parece até um sonho!"
10121-101210060 = "Para aproveitar esse momento maravilhoso ao máximo..."
10121-101210070 = "Iniciarei um treinamento intensivo de biwa!"
10121-101210080 = "...De biwa?"
10121-101210090 = "Vocês vão para a praia, não é...?  "
10121-101210100 = "Por acaso uma dança tradicional seria mais adequada para a ocasião?"
10121-101210110 = "Sensei!"
10121-101210120 = "Irei até aí para pedir o seu conselho!"
10121-101210130 = "Hã?"
10121-101210140 = "Agora?"
10121-101210150 = "Estou indo imediatamente!"
10121-101210160 = "Sensei!"
10121-101210170 = "Guardarei o traje de banho de hoje com todo o carinho do mundo!"
10121-101210180 = "Tem que usar na ocasião certa, hein!  "
10121-101210190 = "Com toda a certeza!"
10121-101210200 = "Afinal, o verdadeiro valor de um item brilha ainda mais quando ele cumpre o seu propósito!"
10121-101210210 = "Estive refletindo debaixo das cobertas..."
10121-101210220 = "Passei os últimos dias pensando e repensando sem parar!"
10121-101210230 = "O que eu poderia fazer na praia para exibir uma figura esplêndida"
10121-101210240 = "que honre o nome do Hyakkaryouran?!"
10121-101210250 = "E a que conclusão chegou?"
10121-101210260 = "O que seria uma \"figura esplêndida\" na praia?"
10121-101210270 = "Ora, nada mais, nada menos do que..."
10121-101210280 = "Um nado magnífico,"
10121-101210290 = "como o dos peixes que bailam livremente pelas águas!"
10121-101210300 = "Realmente, isso seria muito elegante."
10121-101210310 = "De fato, é uma excelente ideia."
10121-101210320 = "Pretendo me dedicar a um treino rigoroso de natação a partir de agora!"
10121-101210330 = "Por isso, tenho um favor a lhe pedir, Sensei."
10121-101210340 = "Se não for incômodo, poderia me ensinar os segredos supremos da natação? "
10121-101210350 = "Não sei se tenho uma técnica tão grandiosa assim, mas..."
10121-101210360 = "Claro, vamos treinar juntos."
10121-101210370 = "Sim!"
10121-101210380 = "Peço perdão pela indelicadeza do pessoal da minha família hoje..."
10121-101210390 = "Quando o assunto sou eu, eles acabam sendo superprotetores demais."
10121-101210400 = "É porque você é muito importante para eles, Yukari."
10121-101210410 = "Não precisa se preocupar comigo."
10121-101210420 = "E pensar que você havia reservado o seu precioso tempo para mim,"
10121-101210430 = "e que finalmente poderíamos treinar natação...!"
10121-101210440 = "Fica para a próxima."
10121-101210450 = "Da próxima vez vamos treinar direto no mar, né?"
10121-101210460 = "Hehe! Está prometido!"
10121-101210470 = "Já estou aguardando ansiosamente por esse momento!"
10121-101210480 = "Sensei!"
10121-101210490 = "Hoje finalmente chegou o tão aguardado..."
10121-101210500 = "Dia de ir à praia!"
10121-101210510 = "Opa, quanta animação!"
10121-101210520 = "Está empolgada, hein!"
10121-101210530 = "Sim! Desta vez vou nadar de montão! Seria um desperdício ficar cabisbaixa!"
10121-101210540 = "Afinal, tempo é dinheiro!"
10121-101210550 = "Esse jeito de pensar é bem a sua cara, Yukari!"
10121-101210560 = "Isso que é pensamento positivo!"
10121-101210570 = "Pois bem, Sensei!"
10121-101210580 = "Nos encontramos na praia!"
10121-101210590 = "Consegui nadar bastante hoje!"
10121-101210600 = "Sinto que sou capaz de adormecer a qualquer instante!"
10121-101210610 = "Você mandou muito bem nadando!"
10121-101210620 = "Foi um nado cheio de graça e elegância!"
10121-101210630 = "Que nada, o meu nado ainda tem muito a melhorar."
10121-101210640 = "Com apenas isso não posso me chamar de eli"
10121-101210650 = "Yukari?"
10121-101210660 = "Será que pegou no sono?"
10121-101210670 = "Boa noite, Yukari."
10121-101210680 = "Acabei cochilando sem perceber agora há pouco!"
10121-101210690 = "Perdoe-me por dormir bem no meio da nossa conversa."
10121-101210700 = "Conseguiu descansar bem?"
10121-101210710 = "Não esquenta com isso!"
10121-101210720 = "Sim! Graças a você!"
10121-101210730 = "Sinto até que tenho energia para dar mais um mergulho!"
10121-101210740 = "O mar à noite é perigoso, então"
10121-101210750 = "vamos deixar para brincar mais amanhã."
10121-101210760 = "Acho que não vou conseguir dormir tão cedo esta noite."
10121-101210770 = "É a primeira vez que descubro como a praia pode ser um lugar tão divertido!"
10121-101210780 = "E ainda tive o Sensei só para mim o dia inteirinho!"
10121-101210790 = "O dia de hoje foi maravilhoso!"
10121-101210800 = "Fico muito feliz em ouvir isso!"
10121-101210810 = "Eu também me diverti muito."
10121-101210820 = "Sensei,"
10121-101210830 = "eu jamais esquecerei este verão..."
10121-101210840 = "Jamais, em hipótese alguma!!"
