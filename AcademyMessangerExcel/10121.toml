[translation]
10121-101210010 = "Сенсей! Как поживаете!"
10121-101210020 = "Мы собираемся поехать на море!"
10121-101210030 = "И... вместе со старшими из Хяккарёран!"
10121-101210040 = "О, здорово!"
10121-101210050 = "Да! Это как сон!"
10121-101210060 = "Чтобы насладиться этим прекрасным временем..."
10121-101210070 = "Я буду усиленно тренироваться на биве!"
10121-101210080 = "... Бива?"
10121-101210090 = "Мы же на море едем...?"
10121-101210100 = "Может быть, танец больше подойдёт?"
10121-101210110 = "Сенсей!"
10121-101210120 = "Я приду к вам за советом!"
10121-101210130 = "Что?"
10121-101210140 = "Прямо сейчас?"
10121-101210150 = "Я сейчас же приду!"
10121-101210160 = "Сенсей!"
10121-101210170 = "Я бережно уберу сегодняшний купальник!"
10121-101210180 = "Надо надевать его как следует!"
10121-101210190 = "Конечно!"
10121-101210200 = "Ведь вещь обретает ценность, только когда её используют!"
10121-101210210 = "Я думала, лёжа в постели,"
10121-101210220 = "и несколько дней обдумывала всё досконально!"
10121-101210230 = "Как показать на море"
10121-101210240 = "великолепный образ, достойный имени Хякка Рёран!"
10121-101210250 = "И что же ты придумала?"
10121-101210260 = "Что такое «великолепный образ» на море?"
10121-101210270 = "Это, иными словами!"
10121-101210280 = "Подобно рыбам, свободно танцующим под водой,"
10121-101210290 = "превосходное плавание!"
10121-101210300 = "Действительно, это великолепно."
10121-101210310 = "Действительно, это отличная идея."
10121-101210320 = "Я планирую усердно тренироваться в плавании."
10121-101210330 = "И у меня к вам просьба, Сенсей."
10121-101210340 = "Если вас не затруднит, не могли бы вы обучить меня секретам плавания?"
10121-101210350 = "Такого уж великого мастерства у меня нет, но..."
10121-101210360 = "Хорошо, давайте потренируемся вместе."
10121-101210370 = "Да!"
10121-101210380 = "Сегодня мои домашние были бестактны..."
10121-101210390 = "Похоже, они слишком опекают меня, когда дело касается меня."
10121-101210400 = "Они просто заботятся о тебе, Юкари."
10121-101210410 = "Не беспокойся обо мне."
10121-101210420 = "Я так хотела воспользоваться вашим временем, Сенсей,"
10121-101210430 = "думала, мы сможем потренироваться в плавании...!"
10121-101210440 = "Перенесём на следующий раз."
10121-101210450 = "В следующий раз будем тренироваться на море, да?"
10121-101210460 = "Хе-хе! Это обещание!"
10121-101210470 = "Я уже сейчас очень жду!"
10121-101210480 = "Сенсей!"
10121-101210490 = "Сегодня долгожданный..."
10121-101210500 = "день, когда мы едем на море!"
10121-101210510 = "О, ты полна энергии!"
10121-101210520 = "Ты в нетерпении!"
10121-101210530 = "Да! Теперь точно много поплаваем! Ведь было бы жаль унывать!"
10121-101210540 = "Время — деньги! Поэтому!"
10121-101210550 = "Мысли в духе Юкари!"
10121-101210560 = "Как позитивно!"
10121-101210570 = "Тогда, Сенсей!"
10121-101210580 = "Встретимся на море!"
10121-101210590 = "Сегодня я много поплавала!"
10121-101210600 = "Кажется, я могу заснуть прямо сейчас!"
10121-101210610 = "Ты отлично плавала!"
10121-101210620 = "Твоё плавание было изящным и полным достоинства!"
10121-101210630 = "Моё плавание ещё далеко от совершенства."
10121-101210640 = "С таким уровнем я ещё не элита."
10121-101210650 = "Юкари?"
10121-101210660 = "Уснула, что ли?"
10121-101210670 = "Спокойной ночи, Юкари."
10121-101210680 = "Только что я невольно задремала."
10121-101210690 = "Прошу прощения, что прервала разговор."
10121-101210700 = "Хорошо выспалась?"
10121-101210710 = "Не переживай!"
10121-101210720 = "Да! Благодаря вам!"
10121-101210730 = "Чувствую, что могу ещё раз поплавать!"
10121-101210740 = "Ночное море опасно,"
10121-101210750 = "давай завтра снова повеселимся."
10121-101210760 = "Сегодня вечером я, похоже, ещё не усну."
10121-101210770 = "Я и не знала, что море может быть таким весёлым местом!"
10121-101210780 = "Я завладела вами на целый день, Сенсей!"
10121-101210790 = "Сегодня было очень весело!"
10121-101210800 = "Как хорошо!"
10121-101210810 = "Мне тоже понравилось."
10121-101210820 = "Сенсей,"
10121-101210830 = "я этот летний день обязательно"
10121-101210840 = "абсолютно точно никогда не забуду!"