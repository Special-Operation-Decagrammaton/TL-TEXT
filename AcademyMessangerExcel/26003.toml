[translation]
26003-1663 = "Para qualquer coisa na vida, a saúde vem em primeiro lugar, Sensei."
26003-1664 = "Por mais ocupado que esteja, não exagere e descanse direitinho nos intervalos do trabalho, viu?"
26003-1665 = "(≧∇≦)ﾉ"
26003-1666 = "Obrigado."
26003-1667 = "Bem que eu queria poder fazer isso..."
26003-1668 = "Hehe, imagina."
26003-1669 = "Não faço mais do que a minha obrigação."
26003-1670 = "Então é assim, né..."
26003-1671 = "Entendi, compreendo."
26003-1672 = "..."
26003-1673 = "Me espere só um pouquinho, tá?\n`(*>﹏<*)′"
26003-1674 = "Mesmo que não esteja passando mal, quando se sentir cansado, não deixe de me avisar."
26003-1675 = "Não importa quando nem onde, eu irei até você, Sensei."
26003-1676 = "Obrigado, vou contar com você quando precisar."
26003-1677 = "Sim! O(∩_∩)O"
26003-1678 = "Sempre que você estiver cansado, Sensei, irei correndo até aí."
26003-1679 = "Pode me chamar a qualquer hora quando precisar!"
26003-1680 = "Muito obrigado."
26003-1681 = "...Por acaso você esteve aqui na Schale até agorinha mesmo, Serina?"
26003-1682 = "Hã?"
26003-1683 = "..."
26003-1684 = "Você estava mesmo exausto, não é?\n(✿˘‿˘)"
26003-1685 = "Hoje também, as Cavaleiras Hospitalárias vão a qualquer hora e a qualquer lugar onde precisarem de ajuda!"
26003-1686 = "Não se esforce demais você também, Sensei, e se tiver qualquer problema me avise na hora!"
26003-1687 = "Pode deixar, obrigado."
26003-1688 = "(@^0^@)/"
26003-1689 = "Sensei♪(´▽｀)"
26003-1690 = "...Hum"
26003-1691 = "Este..."
26003-1692 = "..."
26003-1693 = "Só por desencargo de consciência..."
26003-1694 = "Você não está me achando estranha nem nada do tipo, né...?"
26003-1695 = "Decidi pensar em você como uma espécie de super-heroína."
26003-1696 = "..."
26003-1697 = "Hum... tá bom..."
26003-1698 = "Por favor, continue pensando assim então... _(┐「ε:)_"
26003-260030010 = "Bom dia, Sensei!"
26003-260030020 = "Espero que o seu dia hoje seja maravilhoso!\n(✿˘‿˘)"
26003-260030030 = "Sim. Conto com você hoje também."
26003-260030040 = "Fico te esperando."
26003-260030050 = "Sim!"
26003-260030060 = "...Ué? Hum... Nós tínhamos algum compromisso marcado para hoje...?"
26003-260030070 = "...?"
26003-260030080 = "Hum, tínhamos alguma coisa combinada para hoje...?"
26003-260030090 = "...Sensei?"
26003-260030100 = "Muito obrigada mesmo por hoje, Sensei."
26003-260030110 = "Acabei ficando surpresa na hora, mas justamente por isso vai se tornar uma lembrança muito preciosa."
26003-260030120 = "Como posso explicar..."
26003-260030130 = "Alguém fazer absolutamente tudo daquele jeito pensando só em mim... Me deu uma sensação tão diferente..."
26003-260030140 = "Meu coração ainda está flutuando nas nuvens e não consigo colocar esse sentimento em palavras direito, mas..."
26003-260030150 = "...Muito obrigada."
26003-260030160 = "Eu estou muito, muito feliz! (´▽｀)♪"
