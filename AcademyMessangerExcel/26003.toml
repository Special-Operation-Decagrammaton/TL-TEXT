26003-1671 = "Хорошо. Я это запомню."
26003-1672 = "..."
26003-1673 = "В разных смыслах..."
26003-1674 = "Скажите, когда снова устанете, Сенсей."
26003-1675 = "Я всегда буду рядом и позабочусь о вас."
26003-1676 = "Конечно!"
26003-1677 = "Ага! Хи-хи!"
26003-1678 = "Серина всегда поможет вам восстановить силы, Сенсей!"
26003-1679 = "Возвращайтесь в любое время, Сенсей!"
26003-1680 = "Спасибо за то, что было раньше."
26003-1681 = "Вы сегодня заходили меня проведать?"
26003-1682 = "Да?"
26003-1683 = "..."
26003-1684 = "Наверное, вы очень устали. Хи-хи.\n(✿˘‿˘)"
26003-1685 = "Рыцари помощи всегда будут рядом, когда понадобится помощь!"
26003-1686 = "Хорошего дня, Сенсей! Скажите, если что-нибудь понадобится!"
26003-1687 = "Хорошо, спасибо."
26003-1688 = "Не за что! Хи-хи-хи."
26003-1689 = "Эм, Сенсей?"
26003-1690 = "Эм..."
26003-1691 = "Так что..."
26003-1692 = "..."
26003-1693 = "Я на всякий случай хочу это сказать..."
26003-1694 = "Только не подумайте ничего странного, ладно?"
26003-1695 = "Я решила просто считать вас кем-то вроде супергероя."
26003-1696 = "..."
26003-1697 = "Эм... Хорошо..."
26003-1698 = "Спасибо..."
26003-260030010 = "Здравствуйте, Сенсей!"
26003-260030020 = "Надеюсь, сегодня у вас будет замечательный день!\n(✿˘‿˘)"
26003-260030030 = "Ага. Давайте сделаем этот день хорошим!"
26003-260030040 = "Буду ждать."
26003-260030050 = "Да!"
26003-260030060 = "Хм? Постараемся...?"
26003-260030070 = "...?"
26003-260030080 = "А? Что вы имеете в виду?"
26003-260030090 = "Сенсей?"
26003-260030100 = "Огромное спасибо за сегодня, Сенсей."
26003-260030110 = "Сама я бы до такого не додумалась, поэтому это ещё более памятно."
26003-260030120 = "Это было как..."
26003-260030130 = "Вообще-то я сама не знаю. Впервые мне кажется, будто заботятся именно обо мне..."
26003-260030140 = "Но одно я знаю точно."
26003-260030150 = "..."
26003-260030160 = "Я счастлива!\n♪(´▽｀)"
