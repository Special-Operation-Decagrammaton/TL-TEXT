[translation]
26003-1663 = "Здоровье — главное богатство, Сенсей."
26003-1664 = "Не стоит перерабатывать. Иногда нужно отдыхать."
26003-1665 = ":D"
26003-1666 = "Спасибо."
26003-1667 = "Я бы очень хотел, но..."
26003-1668 = "Ха-ха. Ничего."
26003-1669 = "Я хочу помочь."
