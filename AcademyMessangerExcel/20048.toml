[translation]
20048-200480010 = "Сенсей"
20048-200480020 = "Вы хорошо проводите отпуск?"
20048-200480030 = "Благодаря тебе, я хорошо отдыхаю."
20048-200480040 = "Это радует."
20048-200480050 = "Если можно, тихо..."
20048-200480060 = "и быстро..."
20048-200480070 = "не могли бы вы подойти к моей палатке?"
20048-200480080 = "Хм?"
20048-200480090 = "Сенсей, вы не видели бежевую палатку"
20048-200480100 = "рядом с большой пальмой?"
20048-200480110 = "А, я только что видел."
20048-200480120 = "Я забыла сказать,"
20048-200480130 = "но вы можете свободно пользоваться тем, что внутри."
20048-200480140 = "Я приготовила это для общего удовольствия, но, похоже, никто ещё не пользовался..."
20048-200480150 = "И что же там внутри...?"
20048-200480160 = "Сенсей"
20048-200480170 = "Не обращайте на меня внимания..."
20048-200480180 = "Что...?"
20048-200480190 = "Сенсей"
20048-200480200 = "Вы разбираетесь в рыбалке?"
20048-200480210 = "Немного..."
20048-200480220 = "Если вы не против,"
20048-200480230 = "в бассейне я хотела бы попросить вас о небольшой помощи."