[translation]
10045-100450010 = "Sensei, queria te pedir um favorzinho."
10045-100450020 = "Se as meninas estiverem me procurando, pode responder que \"não sabe\" onde eu tô?"
10045-100450030 = "Tô fazendo uma coisa muito importante agora."
10045-100450040 = "E finge que nem viu essa mensagem também, Sensei. Conto com você~"
10045-100450050 = "Tudo bem, mas... você está no quarto?"
10045-100450060 = "Por acaso está tirando uma soneca no quarto?"
10045-100450070 = "Ué~ Bom, é mais ou menos isso."
10045-100450080 = "Não tô dormindo ainda, mas... tô aqui no quarto sim~"
10045-100450090 = "Enfim... se perguntarem, responde isso pra mim, viu, Sensei?"
10045-100450100 = "Valeu por hoje, viu, Sensei."
10045-100450110 = "Tirar um cochilo juntos foi uma delícia."
10045-100450120 = "Agora nós dois já somos cúmplices."
10045-100450130 = "Cúmplices de matar o serviço, digamos assim."
10045-100450140 = "...!?"
10045-100450150 = "Fui enganado... Esse era o seu plano desde o começo!?"
10045-100450160 = "Ehehe~"
10045-100450170 = "Uuh..."
10045-100450180 = "Socorro, Sensei..."
10045-100450190 = "Deu ruim aqui..."
10045-100450200 = "Hoshino?"
10045-100450210 = "O que aconteceu?"
10045-100450220 = "Eu tô aqui pros lados da praia agora,"
10045-100450230 = "e precisava de uma ajudinha..."
10045-100450240 = "É uma coisa que só você pode fazer, Sensei,"
10045-100450250 = "então não chama as meninas, vem sozinho sem falta..."
10045-100450260 = "Por favorzinho, conto com você~"
10045-100450270 = "Para o Sensei:"
10045-100450280 = "Trago más notícias."
10045-100450290 = "Acabaram descobrindo tudo?"
10045-100450300 = "Vão me chamar para levar bronca também...?"
10045-100450310 = "Ah, não é nada disso."
10045-100450320 = "Sabe que a gente acabou pegando muito mais frutos do mar do que esperava, né?"
10045-100450330 = "Aí pediram pra gente continuar indo pegar todo dia daqui pra frente~"
10045-100450340 = "Sendo assim,"
10045-100450350 = "conto com você nos próximos dias também, Sensei."
10045-100450360 = "O mar é tão bom, né?"
10045-100450370 = "A areia branquinha, o horizonte que se estende sem fim..."
10045-100450380 = "Que poética."
10045-100450390 = "Realmente é muito bom."
10045-100450400 = "Ué..."
10045-100450410 = "Hum..."
10045-100450420 = "Só deu vontade de falar uma frase bonita mesmo."
10045-100450430 = "Não tem nenhum significado profundo não."
10045-100450440 = "Aliás, Sensei,"
10045-100450450 = "eu ouvi falar em algum lugar que,"
10045-100450460 = "igual àquela tainha de agora há pouco,"
10045-100450470 = "as baleias também dão saltos fora d'água."
10045-100450480 = "Mas me diz uma coisa,"
10045-100450490 = "quanto tempo será que a gente precisa esperar pra conseguir ver uma?"
10045-100450500 = "Acho que da beira da praia não dá para ver."
10045-100450510 = "Se a gente for para o alto-mar, talvez dê para ver."
10045-100450520 = "..."
10045-100450530 = "Ué... Aí já fica meio complicado."
10045-100450540 = "Que pena..."
10045-100450550 = "Bom, mas"
10045-100450560 = "se surgir a oportunidade, vamos ver juntos qualquer dia."
10045-100450570 = "Juntinhos, viu?"
