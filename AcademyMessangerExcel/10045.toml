[translation]
10045-100450010 = "Сенсей, можно попросить вас кое о чём?"
10045-100450020 = "Если меня будут искать, скажете, что не знаете?"
10045-100450030 = "Я сейчас занята важным делом."
10045-100450040 = "Притворитесь, что ничего не слышали. Договорились?"
10045-100450050 = "Хорошо, но... ты в своей комнате?"
10045-100450060 = "Спишь в комнате, что ли?"
10045-100450070 = "Ух-хе... ну, что-то вроде того."
10045-100450080 = "Я не сплю, но в комнате да."
10045-100450090 = "Короче... если спросят, так и отвечайте, Сенсей."
10045-100450100 = "Спасибо за сегодня, Сенсей."
10045-100450110 = "Было весело вздремнуть вместе."
10045-100450120 = "Теперь мы соучастники."
10045-100450130 = "Соучастники прогулов... вот так."
10045-100450140 = "...!?"
10045-100450150 = "Попалась... вы с самого начала это задумали!?"
10045-100450160 = "Хе-хе."
10045-100450170 = "У-у-у..."
10045-100450180 = "Помогите, Сенсей..."
10045-100450190 = "Случилось кое-что..."
10045-100450200 = "Хошино?"
10045-100450210 = "Что случилось?"
10045-100450220 = "Я сейчас у пляжа."
10045-100450230 = "Мне нужна ваша помощь."
10045-100450240 = "Это может сделать только вы, Сенсей."
10045-100450250 = "Не зовите остальных, приходите один..."
10045-100450260 = "Пожалуйста, рассчитываю на вас~"
10045-100450270 = "Сенсею."
10045-100450280 = "Плохие новости."
10045-100450290 = "Всё-таки раскрылось?"
10045-100450300 = "Меня тоже вызовут...?"
10045-100450310 = "Ах, нет, не то."
10045-100450320 = "Мы наловили морских гадов больше, чем ожидали."
10045-100450330 = "Так что теперь говорят: «Приносите ещё каждый день»~"
10045-100450340 = "В общем,"
10045-100450350 = "буду рассчитывать на вас и дальше, Сенсей."
10045-100450360 = "Море — это прекрасно."
10045-100450370 = "Белый песок, бесконечный горизонт..."
10045-100450380 = "Поэтично."
10045-100450390 = "Правда, красиво."
10045-100450400 = "Ух-хе..."
10045-100450410 = "Ну,"
10045-100450420 = "мне просто захотелось это сказать."
10045-100450430 = "Ничего особенного."
10045-100450440 = "Кстати, Сенсей."
10045-100450450 = "Я где-то слышала,"
10045-100450460 = "что киты, как те дельфины,"
10045-100450470 = "тоже выпрыгивают из воды."
10045-100450480 = "И сколько"
10045-100450490 = "надо ждать, чтобы это увидеть?"
10045-100450500 = "С пляжа, наверное, не увидишь."
10045-100450510 = "Может, если выйти в открытое море, получится."
10045-100450520 = "..."
10045-100450530 = "Ух-хе... это сложновато."
10045-100450540 = "Жаль..."
10045-100450550 = "Ну, но"
10045-100450560 = "если будет возможность, давайте сходим посмотрим вместе."
10045-100450570 = "Вместе."
