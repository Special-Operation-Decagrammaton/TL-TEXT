[translation]
10045-100450010 = "Хм..."
10045-100450020 = "Я заметила, что меня снова кто-то ищет."
10045-100450030 = "Я сейчас занята очень важным делом."
10045-100450040 = "Так что если кто-нибудь спросит, просто скажи, что не знаешь, где я."
10045-100450050 = "Хорошо... Ты собираешься спать в домике?"
10045-100450060 = "Опять будешь дремать?"
10045-100450070 = "Ухе~ Ну, может и так."
10045-100450080 = "Но ты ведь понял задание, да?"
10045-100450090 = "В общем, рассчитываю на тебя, Сенсей."
10045-100450100 = "Сенсей."
10045-100450110 = "Ты тоже поспал."
10045-100450120 = "Мы сообщники."
10045-100450130 = "Понимаешь?"
10045-100450140 = "...?!"
10045-100450150 = "Попалась. Таков и был твой план с самого начала!"
10045-100450160 = "Хи-хи-хи."
10045-100450170 = "Аргх."
10045-100450180 = "Помогите мне, Сенсей..."
10045-100450190 = "У меня проблема."
10045-100450200 = "Хошино?"
10045-100450210 = "Что происходит?"
10045-100450220 = "Я сейчас на пляже."
10045-100450230 = "Мне нужна ваша помощь."
10045-100450240 = "Нужен именно ты."
10045-100450250 = "Никому не говори и приходи один."
10045-100450260 = "Пожалуйста!"
10045-100450270 = "Сенсей."
10045-100450280 = "Какая жалость."
10045-100450290 = "Тебя поймали?"
10045-100450300 = "Меня теперь вызовут?"
10045-100450310 = "Нет."
10045-100450320 = "Потому что я принесла больше, чем ожидала."
10045-100450330 = "Меня попросили продолжать приносить вещи."
10045-100450340 = "Так что я хотела сказать..."
10045-100450350 = "Надеюсь на дальнейшее сотрудничество, Сенсей."
10045-100450360 = "Ну..."
10045-100450370 = "На пляже всегда хорошо."
10045-100450380 = "Впечатляет."
10045-100450390 = "Да. Мне нравится пляж."
10045-100450400 = "Ухе..."
10045-100450410 = "Ну,"
10045-100450420 = "Просто хотела это сказать."
10045-100450430 = "Без особой причины."
10045-100450440 = "Кстати, Сенсей."
10045-100450450 = "Я где-то видела,"
10045-100450460 = "что, как и кефаль,"
10045-100450470 = "киты"
10045-100450480 = "тоже выпрыгивают из воды, да?"
10045-100450490 = "Сколько мне ждать, чтобы это увидеть?"
10045-100450500 = "С берега увидеть будет трудно."
10045-100450510 = "Нужно уйти далеко в море."
10045-100450520 = "..."
10045-100450530 = "Ухе..."
10045-100450540 = "Жаль."
10045-100450550 = "Ну..."
10045-100450560 = "Надо как-нибудь сходить и посмотреть."
10045-100450570 = "Вместе."
