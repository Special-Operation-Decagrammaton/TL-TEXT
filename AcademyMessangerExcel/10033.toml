10033-100330190 = "Эм, Вакамо?"
10033-100330200 = "Я так рада, что мы сегодня поговорили."
10033-100330210 = "Я уже жду следующей встречи."
10033-100330220 = "Надеюсь, в следующий раз мы найдём более тихое место."
