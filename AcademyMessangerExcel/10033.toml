10033-100330330 = "Эм, спасибо. Наверное."
10033-100330340 = "Здравствуйте, Сенсей."
10033-100330350 = "Надеюсь, вы не забыли!"
10033-100330360 = "Сегодня наконец тот самый день! Вы обещали провести со мной целый день!"
