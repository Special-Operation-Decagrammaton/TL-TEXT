[translation]
10033-100330010 = "Хе-хе-хе..."
10033-100330020 = "Доброе утро, Сенсей. Прекрасное утро."
10033-100330030 = "Доброе утро, Вакамо."
10033-100330040 = "Ах... этот всегда неизменный, ласковый ответ..."
10033-100330050 = "Одного лишь прикосновения к буквам моего имени, дарованного тобой..."
10033-100330060 = "достаточно, чтобы согреть сердце до жара."
10033-100330070 = "Э-это хорошо..."
10033-100330080 = "Сегодня солнечно и стоит чудесная погода."
10033-100330090 = "Но нельзя терять бдительность."
10033-100330100 = "Когда температура резко меняется, легко заболеть."
10033-100330110 = "Погода в это время года переменчива."
10033-100330120 = "Вакамо, тоже береги своё здоровье."
10033-100330130 = "То, что ты беспокоишься о моём теле..."
10033-100330140 = "Хе-хе, я решила."
10033-100330150 = "В такой знаменательный момент я не могу ограничиться лишь перепиской."
10033-100330160 = "Не мог бы ты подождать немного?"
10033-100330170 = "До-ро-го-й мо-й ♡"
10033-100330180 = "...Что?"
10033-100330190 = "Эм, Вакамо?"
10033-100330200 = "Я очень рада, что снова тебя вижу."
10033-100330210 = "Я с нетерпением жду нашей следующей встречи."
10033-100330220 = "Давай в следующий раз встретимся более спокойно..."
10033-100330230 = "Да, конечно!"
10033-100330240 = "Если ты так желаешь, я готова!"
10033-100330250 = "Сенсей, сегодня у тебя выходной, верно?"
10033-100330260 = "Да, я говорил об этом?"
10033-100330270 = "Хе-хе..."
10033-100330280 = "Я, Вакамо, храню твоё расписание в сердце без единой ошибки."
10033-100330290 = "П-понятно..."
10033-100330300 = "Ты всегда так занят и редко имеешь возможность отдохнуть, и вот наконец выходной..."
10033-100330310 = "Пусть этот день будет безопасным и приятным."
10033-100330320 = "Я буду молиться за тебя, следуя за тобой."
10033-100330330 = "Эм, спасибо...?"
10033-100330340 = "Сенсей, ты в порядке?"
10033-100330350 = "Ты ведь не забыл?"
10033-100330360 = "Сегодня тот самый день, когда ты обещал встретиться со мной..."
10033-100330370 = "Сколько бессонных ночей я провела в ожидании этого дня..."
10033-100330380 = "С трудом сдерживая волнение, я составила идеальный план свидания!"
10033-100330390 = "П-понятно."
10033-100330400 = "Тогда я буду ждать тебя на условленном месте. Хе-хе..."
10033-100330410 = "Хорошо, я скоро подойду."
10033-100330420 = "Сенсей, если тебя не затруднит"
10033-100330430 = "не мог бы ты уделить мне немного твоего драгоценного времени сегодня?"
10033-100330440 = "Ах, извини, у меня сейчас работа, от которой не оторваться..."
10033-100330450 = "Вот как..."
10033-100330460 = "Жаль, но ничего не поделаешь."
10033-100330470 = "Сколько бы я ни хотела, мои капризы не должны мешать твоей работе..."
10033-100330480 = "Тогда сегодня я пойду одна."
10033-100330490 = "За покупками?"
10033-100330500 = "Да, мне кое-что нужно... я собиралась на Чёрный рынок."
10033-100330510 = "На Чёрный рынок одной..."
10033-100330520 = "...Я быстро закончу, пойдём вместе. Подождёшь немного?"
10033-100330530 = "Ах, как это мило с твоей стороны..."
10033-100330540 = "Хе-хе... тогда я буду ждать."
10033-100330550 = "Большое спасибо, что составили мне компанию сегодня."
10033-100330560 = "Я, Вакамо,"
10033-100330570 = "правда,"
10033-100330580 = "правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда"
10033-100330590 = "правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда-правда"
10033-100330600 = "рада была быть с тобой ♡"
10033-100330610 = "Хе-хе-хе..."
10033-100330620 = "Я рад, что тебе понравилось."
10033-100330630 = "Тогда до встречи."
10033-100330640 = "С нетерпением жду дня, когда мы увидимся снова."
10033-100330650 = "С уважением"
10033-100330660 = "Доброе утро, Сенсей. Как твои дела?"
10033-100330670 = "Доброе утро, Вакамо."
10033-100330680 = "Я боялась, что такие сообщения могут отнять у тебя драгоценное время,"
10033-100330690 = "и мне немного неловко, но..."
10033-100330700 = "У меня как раз перерыв, так что что случилось?"
10033-100330710 = "Какое удивительное совпадение."
10033-100330720 = "У меня тоже как раз появилось свободное время."
10033-100330730 = "Хе-хе, такое везение..."
10033-100330740 = "Чтобы увековечить этот чудесный момент..."
10033-100330750 = "сегодня я сделаю всё возможное ради тебя ♡"
10033-100330760 = "В-Вакамо? Что это значит..."
