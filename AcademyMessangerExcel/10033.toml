[translation]
10033-100330010 = "Ufufu..."
10033-100330020 = "Bom dia, Sensei. Que bela manhã, não é?"
10033-100330030 = "Bom dia, Wakamo."
10033-100330040 = "Aaah... Essa sua resposta gentil, que nunca muda não importa o momento..."
10033-100330050 = "Só de acariciar as letras do meu nome enviadas por você, meu querido..."
10033-100330060 = "meu coração se aquece tanto que chega a queimar."
10033-100330070 = "Q-que bom..."
10033-100330080 = "O sol está quentinho hoje, um tempo maravilhoso."
10033-100330090 = "Contudo, não devemos baixar a guarda."
10033-100330100 = "Quando a temperatura muda de repente, é muito fácil acabar adoecendo."
10033-100330110 = "Afinal, estamos na mudança de estação."
10033-100330120 = "Cuide bem da sua saúde também, Wakamo."
10033-100330130 = "Imaginar que você se preocuparia assim com o meu bem-estar, Sensei..."
10033-100330140 = "Fufu, está decidido."
10033-100330150 = "Em uma ocasião tão memorável, não consigo me contentar apenas com o MomoTalk."
10033-100330160 = "Poderia aguardar só um instante?"
10033-100330170 = "Meu que-ri-do♡"
10033-100330180 = "...Hã?"
10033-100330190 = "Hum, Wakamo?"
10033-100330200 = "Fiquei imensamente feliz em poder vê-lo novamente."
10033-100330210 = "Estarei aguardando ansiosamente pelo nosso próximo encontro."
10033-100330220 = "Na próxima vez, vamos tentar nos encontrar com mais calma..."
10033-100330230 = "S-sim!"
10033-100330240 = "Se é isso que você deseja, meu querido, farei exatamente como quiser...!"
10033-100330250 = "Sensei. Hoje você está de folga do trabalho na Schale, não está?"
10033-100330260 = "Sim. Ué, eu cheguei a te avisar antes?"
10033-100330270 = "Fufufu..."
10033-100330280 = "Esta Wakamo tem toda a agenda do Sensei gravada no coração sem um único segundo de erro."
10033-100330290 = "Ah, entendi..."
10033-100330300 = "Em meio à sua rotina tão atarefada e sem descanso, finalmente um dia de folga..."
10033-100330310 = "Para que o seu dia seja seguro e muito agradável,"
10033-100330320 = "estarei rezando por você enquanto sigo os seus passos de perto."
10033-100330330 = "Hum, obrigado...?"
10033-100330340 = "Sensei, como você está?"
10033-100330350 = "Não me diga que você se esqueceu?"
10033-100330360 = "Hoje é o dia em que você me concedeu a honra de uma promessa..."
10033-100330370 = "Quantas noites em claro eu não passei aguardando ansiosamente por este dia..."
10033-100330380 = "Enquanto tentava conter o meu coração acelerado, planejei o nosso encontro nos mínimos detalhes!"
10033-100330390 = "Ah, é verdade."
10033-100330400 = "Bem, estarei esperando no local combinado. Fufufu..."
10033-100330410 = "Certo. Já estou indo para aí também."
10033-100330420 = "Sensei, se não for pedir muito,"
10033-100330430 = "poderia me conceder o seu precioso tempo durante o dia de hoje?"
10033-100330440 = "Ah, desculpa... Estou com um trabalho urgente agora que não posso largar..."
10033-100330450 = "Entendo..."
10033-100330460 = "É uma pena, mas não há o que fazer."
10033-100330470 = "Por mais que eu deseje estar ao seu lado, meu egoísmo jamais deve atrapalhar o trabalho do Sensei..."
10033-100330480 = "Infelizmente, hoje irei sozinha."
10033-100330490 = "Vai fazer alguma compra?"
10033-100330500 = "Sim, preciso de algumas coisinhas... então pensei em dar uma passada no Mercado Negro."
10033-100330510 = "Ir ao Mercado Negro sozinha, é..."
10033-100330520 = "...Vou terminar tudo rapidinho aqui e vamos juntos. Pode me esperar um pouco?"
10033-100330530 = "Aaah, quanta gentileza..."
10033-100330540 = "Fufu... Então estarei aguardando por você."
10033-100330550 = "Muito obrigada pela sua companhia hoje."
10033-100330560 = "Esta Wakamo"
10033-100330570 = "ficou muito,"
10033-100330580 = "muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito,"
10033-100330590 = "muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito, muito"
10033-100330600 = "feliz por poder estar ao seu lado, meu querido♡"
10033-100330610 = "Ufufufu..."
10033-100330620 = "Fico feliz em saber."
10033-100330630 = "Até a próxima, então."
10033-100330640 = "Aguardo ansiosamente pelo dia em que nos encontraremos de novo."
10033-100330650 = "Com estima."
10033-100330660 = "Bom dia, Sensei. Como está se sentindo hoje?"
10033-100330670 = "Bom dia, Wakamo."
10033-100330680 = "Sinto muito se ao entrar em contato assim eu estiver tomando o seu precioso tempo,"
10033-100330690 = "meu querido, mas..."
10033-100330700 = "Acabei de entrar no intervalo. O que houve hoje?"
10033-100330710 = "Mas que feliz coincidência!"
10033-100330720 = "Eu também acabei de ficar com o tempo livre agora mesmo."
10033-100330730 = "Fufu, ser abençoada com tamanha sorte assim..."
10033-100330740 = "Para tornar eterno este momento digno de um milagre..."
10033-100330750 = "hoje me dedicarei de corpo e alma a você, meu querido♡"
10033-100330760 = "W-Wakamo? O que você quer dizer com isso..."
