[translation]
20022-200220010 = "Olá, Sensei."
20022-200220020 = "A virada do ano já está quase aí, né?"
20022-200220030 = "Muito obrigada por todo o seu apoio ao longo deste ano."
20022-200220040 = "Eu é que agradeço por tudo."
20022-200220050 = "Você tem algum plano para hoje, Fuuka?"
20022-200220060 = "Acho que hoje o dia também vai ser bem corrido para mim aqui no Clube de Merenda Escolar..."
20022-200220070 = "Mas está tudo bem."
20022-200220080 = "Vou dar o meu melhor até o último minuto do ano!"
20022-200220090 = "Hum... Bom dia."
20022-200220100 = "Quando abri os olhos, já era essa hora..."
20022-200220110 = "Você dormindo até tarde, Fuuka? Que raridade...!"
20022-200220120 = "Que vergonha..."
20022-200220130 = "Imagina, nessa época do ano você merece descansar. E achei fofo, aliás."
20022-200220140 = "A-Ah, poxa..."
20022-200220150 = "Não fique me provocando assim, por favor."
20022-200220160 = "Por sinal, hum..."
20022-200220170 = "Sei que já passou da hora certa, mas..."
20022-200220180 = "Se você quiser, que tal comermos um soba de Ano Novo meio atrasado juntos?"
20022-200220190 = "Comida caseira da Fuuka! Quero comer agora mesmo!"
20022-200220200 = "A-Ah, muito obrigada."
20022-200220210 = "Como preciso preparar algumas coisas antes, tudo bem se for no fim da tarde?"
20022-200220220 = "Estarei te esperando no refeitório."
20022-200220230 = "Você está muito ocupado hoje também, Sensei?"
20022-200220240 = "Estava pensando aqui que o feriado prolongado já está acabando e resolvi mandar mensagem..."
20022-200220250 = "O tempo voa nos dias de folga, né...?"
20022-200220260 = "Por aqui está tudo como sempre. E você, Fuuka?"
20022-200220270 = "Bom, quando dei por mim, o feriado meio que já tinha acabado..."
20022-200220280 = "E como a partir de amanhã já preciso começar os preparativos do Clube de Merenda Escolar..."
20022-200220290 = "Amanhã cedo já tenho que sair para comprar os ingredientes."
20022-200220300 = "Espera, então quer dizer que hoje é o seu último dia de folga...?!"
20022-200220310 = "É-É, basicamente isso."
20022-200220320 = "Bom, já estou acostumada, digamos assim."
20022-200220330 = "Faz parte de ser do Clube de Merenda Escolar, não tem jeito."
20022-200220340 = "Tem jeito sim!"
20022-200220350 = "Nesse caso, não tenho escolha a não ser sequestrar você hoje, Fuuka..."
20022-200220360 = "Oi?!"
20022-200220370 = "Até você vai me sequestrar agora, Sensei?!"
20022-200220380 = "Claro, temos que aproveitar o seu último dia de folga!"
20022-200220390 = "O-O que você quer dizer com isso...?"
