[translation]
20022-200220010 = "Здравствуйте, Сенсей."
20022-200220020 = "Можешь поверить, что год уже заканчивается?"
20022-200220030 = "Желаю тебе всего самого лучшего в Новом году!"
20022-200220040 = "В этом году ты многое сделала, Фуука."
20022-200220050 = "Как у тебя сегодня с расписанием?"
20022-200220060 = "Весь день буду занята работой в Клубе школьного питания."
20022-200220070 = "Но это не проблема."
20022-200220080 = "В конце концов, я хочу стараться до самого конца."
20022-200220090 = "Здравствуйте, Сенсей."
20022-200220100 = "Я... сегодня проспала."
20022-200220110 = "Правда? Ты, Фуука?!"
20022-200220120 = "Знаю. Мне стыдно..."
20022-200220130 = "Это настолько же неожиданно, насколько мило."
20022-200220140 = "Серьёзно?"
20022-200220150 = "Пожалуйста, перестань меня дразнить..."
20022-200220160 = "Эм, Сенсей."
20022-200220170 = "Я спрашиваю в последний момент, и ты можешь быть занят..."
20022-200220180 = "Но не хочешь вместе поесть лапшу в канун Нового года?"
20022-200220190 = "Конечно! Я не могу пропустить лапшу с Фуукой!"
20022-200220200 = "О! Рада слышать."
20022-200220210 = "Тогда увидимся вечером."
20022-200220220 = "Буду ждать вас."
20022-200220230 = "Как ты сегодня, Сенсей?"
20022-200220240 = "Не верится, что праздничный сезон почти закончился."
20022-200220250 = "Почему во время каникул время всегда летит так быстро?"
20022-200220260 = "Хорошо провела Новый год, Фуука?"
20022-200220270 = "Не уверена."
20022-200220280 = "Завтра нужно купить продукты."
20022-200220290 = "Для Клуба школьного питания."
20022-200220300 = "Значит, сегодня твой последний выходной?"
20022-200220310 = "Э-э-э..."
20022-200220320 = "Наверное, ты прав."
20022-200220330 = "Ну, это моя работа."
20022-200220340 = "Нельзя постоянно так говорить."
20022-200220350 = "Вообще-то сегодня днём я тебя похищу."
20022-200220360 = "Что?!"
20022-200220370 = "Т-ты собираешься меня похитить, Сенсей?!"
20022-200220380 = "Перед тем как убирать кимоно, мы должны кое-что сделать!"
20022-200220390 = "Я уже вообще ничего не понимаю..."
