[translation]
20022-200220010 = "Здравствуйте, Сенсей."
20022-200220020 = "Скоро Новый год."
20022-200220030 = "Спасибо вам за этот год."
20022-200220040 = "Это я должен вас благодарить."
20022-200220050 = "У тебя, Фуука, есть сегодня планы?"
20022-200220060 = "Сегодня я, наверное, опять буду занята в столовой..."
20022-200220070 = "Но всё в порядке."
20022-200220080 = "Я сделаю всё, что могу, до самого конца!"
20022-200220090 = "Эм... доброе утро."
20022-200220100 = "Когда я проснулась, уже было так поздно..."
20022-200220110 = "Фуука проспала — это редкость...!"
20022-200220120 = "Как же стыдно..."
20022-200220130 = "Нет, в такое время это даже мило. Так что всё хорошо."
20022-200220140 = "Ну всё"
20022-200220150 = "Не дразните меня."
20022-200220160 = "Кстати..."
20022-200220170 = "Момент уже прошёл, конечно,"
20022-200220180 = "но если хотите, не хотите ли немного запоздалой новогодней лапши?"
20022-200220190 = "Готовить будешь ты! Хочу попробовать сейчас же!"
20022-200220200 = "А, спасибо вам."
20022-200220210 = "Мне нужно немного подготовиться, встретимся вечером, хорошо?"
20022-200220220 = "Буду ждать в столовой."
20022-200220230 = "Сенсей, вы сегодня тоже, наверное, заняты?"
20022-200220240 = "Вот и подходят к концу выходные, я решила написать..."
20022-200220250 = "В выходные время летит так быстро..."
20022-200220260 = "У меня всё как обычно. А у тебя?"
20022-200220270 = "Ну, я просто сидела без дела, и время пролетело..."
20022-200220280 = "Но с завтрашнего дня мне снова нужно готовиться к работе в столовой,"
20022-200220290 = "так что завтра нужно будет сходить за продуктами."
20022-200220300 = "То есть сегодня — последний день выходных...!?"
20022-200220310 = "Д-да, наверное."
20022-200220320 = "Ну, в общем, как обычно,"
20022-200220330 = "я же работаю в столовой, так что ничего не поделаешь."
20022-200220340 = "Не ничего не поделаешь!"
20022-200220350 = "Если так, придётся похитить тебя сегодня..."
20022-200220360 = "Что!?"
20022-200220370 = "Меня даже вы, Сенсей, будете похищать!?"
20022-200220380 = "Ведь это последний день выходных!"
20022-200220390 = "Ч-что вы имеете в виду...?"