[translation]
10152-101520010 = "Tcharam"
10152-101520020 = "Olá, Sensei"
10152-101520030 = "Aqui é a Branca de Neve do mundo das bandas,"
10152-101520040 = "Shiina Tsumugi"
10152-101520050 = "B-Branca de Neve?"
10152-101520060 = "Claro que nenhum espelho mágico me disse que sou a mais bela do mundo, mas..."
10152-101520070 = "...\"Saber se vender\""
10152-101520080 = "...é fundamental, afinal"
10152-101520090 = "E agora, uma pergunta para você, Sensei"
10152-101520100 = "Você sabe que dia é hoje?"
10152-101520110 = "É o dia do show de rua da Tsumugi!"
10152-101520120 = "Fufu"
10152-101520130 = "Que memória esplêndida"
10152-101520140 = "Como esperado, você nunca decepciona as minhas expectativas, Sensei"
10152-101520150 = "Sendo assim, por favor apareça quando tiver um tempinho"
10152-101520160 = "Estarei esperando por você naquele lugar o tempo todo"
10152-101520170 = "Foi uma apresentação muito divertida, não foi?"
10152-101520180 = "O que você achou, Sensei?"
10152-101520190 = "Conseguiu se divertir?"
10152-101520200 = "Mandou todo o meu estresse pelos ares!"
10152-101520210 = "Fufu, que maravilha"
10152-101520220 = "Agora eu poderia até morder uma maçã envenenada e cair em um sono profundo sem arrependimentos"
10152-101520230 = "É claro que não vou morder uma maçã envenenada de verdade"
10152-101520240 = "e nem cair em um sono profundo, mas"
10152-101520250 = "é que nessas horas..."
10152-101520260 = "\"Expressividade\" é fundamental, né?"
10152-101520270 = "Ora"
10152-101520280 = "Nossos pensamentos estão em perfeita sintonia"
10152-101520290 = "Sendo assim, até a próxima"
10152-101520300 = "E quando nos reencontrarmos, espero que..."
10152-101520310 = "seja mais um momento de paz e harmonia"
10152-101520320 = "Ouvi falar por acaso outro dia..."
10152-101520330 = "Dizem que você costuma trabalhar até tarde da noite com frequência, Sensei"
10152-101520340 = "Quando o sono ataca no meio do trabalho,"
10152-101520350 = "o que você costuma fazer?"
10152-101520360 = "Acho que costumo dar uma caminhada pelo parque"
10152-101520370 = "Ah, entendo"
10152-101520380 = "Como a própria \"Bela Adormecida\","
10152-101520390 = "não posso deixar de sentir que isso é obra do destino"
10152-101520400 = "O-O que você quer dizer com isso...?"
10152-101520410 = "Fufu, não é nada"
10152-101520420 = "Tenha um ótimo dia hoje também"
10152-101520430 = "Muito obrigada pelo outro dia, Sensei"
10152-101520440 = "Graças a você, consegui voltar para o dormitório sem que ninguém percebesse"
10152-101520450 = "Eu também consegui terminar todo o meu trabalho graças a você, Tsumugi"
10152-101520460 = "Então saímos ambos ganhando"
10152-101520470 = "Se eu acabar dando uma escapulida à noite de novo,"
10152-101520480 = "passarei aí para te ver, Sensei"
10152-101520490 = "Death metal também é ótimo, mas"
10152-101520500 = "da próxima vez..."
10152-101520510 = "gostaria que você ouvisse uma melodia um pouco mais doce"
10152-101520520 = "Como tem passado, Sensei?"
10152-101520530 = "Tem aproveitado bem os seus dias?"
10152-101520540 = "Sim, todo dia é divertido!"
10152-101520550 = "Fico muito feliz em ouvir isso"
10152-101520560 = "Eu também tenho vivido dias empolgantes"
10152-101520570 = "Afinal, a vida foi feita para ser aproveitada"
10152-101520580 = "É claro que às vezes há dias desanimadores, mas"
10152-101520590 = "o melhor a fazer é deixar a melancolia de lado o quanto antes"
10152-101520600 = "Eu penso exatamente igual!"
10152-101520610 = "Ah, se todos pudessem pensar da mesma forma,"
10152-101520620 = "o mundo certamente seria um lugar muito mais pacífico..."
10152-101520630 = "Pois bem, hoje também irei tocar minha guitarra"
10152-101520640 = "pela alegria das pessoas e pela paz"
10152-101520650 = "Se tiver um tempinho, vamos nos encontrar naquele parque"
10152-101520660 = "Hoje"
10152-101520670 = "sinto a minha inspiração criativa transbordando"
10152-101520680 = "Na verdade, há um lugar aonde eu gostaria muito de ir com você, Sensei"
10152-101520690 = "Estaria disponível?"
10152-101520700 = "Claro, eu vou com você!"
10152-101520710 = "Então, que tal irmos agora mesmo"
10152-101520720 = "ao museu de arte da Wild Hunt?"
10152-101520730 = "Começou uma exposição nova por lá"
