[translation]
10152-101520010 = "Бах"
10152-101520020 = "Привет, Сенсей"
10152-101520030 = "Белоснежка из мира оркестра"
10152-101520040 = "Я Шиина Цумуги"
10152-101520050 = "П-Белоснежка?"
10152-101520060 = "Конечно, зеркало не говорило мне, что я самая красивая в мире..."
10152-101520070 = "...Привлекательность"
10152-101520080 = "...важно"
10152-101520090 = "Теперь у меня вопрос к Сенсею"
10152-101520100 = "Вы знаете, какой сегодня день?"
10152-101520110 = "Сегодня день уличного выступления Цумуги!"
10152-101520120 = "Хе-хе"
10152-101520130 = "У вас потрясающая память."
10152-101520140 = "Как и ожидалось, Сенсей меня никогда не разочаровывает."
10152-101520150 = "Тогда, пожалуйста, приходите, когда у вас будет время."
10152-101520160 = "Я буду ждать вас там."
10152-101520170 = "Это было весёлое представление."
10152-101520180 = "Как вам понравилось, Сенсей?"
10152-101520190 = "Вам понравилось?"
10152-101520200 = "Мой стресс исчез!"
10152-101520210 = "Хе-хе, это хорошо."
10152-101520220 = "Теперь я не пожалею, если «съем» отравленное яблоко и «усну» крепким сном."
10152-101520230 = "Конечно, я на самом деле не собираюсь есть отравленное яблоко."
10152-101520240 = "И крепко спать я тоже не собираюсь."
10152-101520250 = "Вот такие вещи..."
10152-101520260 = "Это потому, что «выразительность» важна?"
10152-101520270 = "Ох"
10152-101520280 = "Как будто мы общаемся без слов."
10152-101520290 = "Ну тогда давайте встретимся снова."
10152-101520300 = "Надеюсь, тогда тоже настанет мирное время."
10152-101520310 = "Мне довелось кое-что услышать на днях..."
10152-101520330 = "Я слышал, что вы часто работаете в ночные смены."
10152-101520340 = "Когда вас одолевает сонливость во время работы,"
10152-101520350 = "Что вы делаете?"
10152-101520360 = "Интересно, вы гуляете в парке?"
10152-101520370 = "Понятно."
10152-101520380 = "Будучи «Спящей красавицей»,"
10152-101520390 = "Я не могу отделаться от ощущения, что это судьба."
10152-101520400 = "Ч-что вы имеете в виду...?"
10152-101520410 = "Хе-хе, ничего страшного."
10152-101520420 = "Хорошего дня."
10152-101520430 = "Спасибо за вчерашний день, Сенсей."
10152-101520440 = "Благодаря тебе мне удалось вернуться в общежитие незаметно."
10152-101520450 = "Благодаря Цумуги мне тоже удалось закончить свою работу."
10152-101520460 = "Это выгодно для нас обоих, не так ли?"
10152-101520470 = "Если я когда-нибудь снова буду тайком выходить ночью,"
10152-101520480 = "я приду к тебе, Сенсей."
10152-101520490 = "Дэт-метал тоже хорош, но..."
10152-101520500 = "Тогда было немного больше..."
10152-101520510 = "Я бы также хотел, чтобы вы послушали несколько приятных песен."
10152-101520520 = "Сенсей, как дела?"
10152-101520530 = "Вы хорошо проводите свои дни?"
10152-101520540 = "Да, я хорошо провожу время!"
10152-101520550 = "Приятно это слышать."
10152-101520560 = "Я тоже наслаждаюсь каждым днём."
10152-101520570 = "В конце концов, жизнью нужно наслаждаться."
10152-101520580 = "Конечно, бывают дни, когда мне грустно."
10152-101520590 = "Лучше всего как можно скорее отпустить мрачные чувства."
10152-101520600 = "Согласен!"
10152-101520610 = "Ах, если бы все думали одинаково,"
10152-101520620 = "Мир стал бы спокойнее..."
10152-101520630 = "Итак, сегодня, ради радости и мира людей"
10152-101520640 = "Я пойду поиграю на гитаре»"
10152-101520650 = "Если у вас будет время, давай встретимся в том парке"
10152-101520660 = "Сегодня"
10152-101520670 = "Я чувствую прилив творческой энергии"
10152-101520680 = "На самом деле, есть место, куда я хотела бы пойти с вами, Сенсей"
10152-101520690 = "Это нормально?"
10152-101520700 = "Конечно, я пойду!"
10152-101520710 = "Итак, как насчёт того, чтобы пойти сейчас?"
10152-101520720 = "Пойдём в Музей Вайлдханта?"
10152-101520730 = "Только что открылась новая выставка."