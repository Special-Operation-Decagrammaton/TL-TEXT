[translation]
10042-100420010 = "Сенсей, вы здесь?"
10042-100420020 = "Вы сейчас свободны? Это сообщение доходит?"
10042-100420030 = "Ацуко?"
10042-100420040 = "Да, это я. Доброе утро."
10042-100420050 = "Доброе утро."
10042-100420060 = "Уже почти ночь, но доброе утро."
10042-100420070 = "Мы сейчас перемещаемся с места на место,"
10042-100420080 = "потому что нельзя долго задерживаться на одном месте."
10042-100420090 = "И мы часто бываем порознь."
10042-100420100 = "Когда я одна, мне скучно."
10042-100420110 = "Чтобы встретиться с вами,"
10042-100420120 = "нужно, чтобы вы пришли к нам."
10042-100420130 = "То есть, ты хочешь сказать, что тебе скучно, и ты хочешь встретиться...?"
10042-100420140 = "Да."
10042-100420150 = "Именно так."
10042-100420160 = "Тогда увидимся позже."
10042-100420170 = "Сенсей, добрый вечер."
10042-100420180 = "Нам нужно уходить отсюда сейчас."
10042-100420190 = "Тогда до встречи. Когда сменим место, я напишу."
10042-100420200 = "Сенсей, доброе утро."
10042-100420210 = "Я нашла интересное место."
10042-100420220 = "Если у вас будет время, не хотите зайти?"
10042-100420230 = "Что за место?"
10042-100420240 = "Там можно играть в школу."
10042-100420250 = "Думаю, будет весело."
10042-100420260 = "Хорошо, я понял. Буду ждать."
10042-100420270 = "Сенсей."
10042-100420280 = "Насчёт моего хобби."
10042-100420290 = "Я люблю цветы."
10042-100420300 = "Цветы... выращивать цветы?"
10042-100420310 = "Да. Возможно, я создам садоводческий кружок."
10042-100420320 = "Хотя членом буду только я."
10042-100420330 = "Тогда спокойной ночи."
10042-100420340 = "Сенсей, доброе утро."
10042-100420350 = "Я решила."
10042-100420360 = "Я хочу сделать цветы своим хобби."
10042-100420370 = "Понятно. Например, икебана?"
10042-100420380 = "Наверное, неплохо."
10042-100420390 = "Поддержите меня, Сенсей."
10042-100420400 = "Конечно. А у тебя, Ацуко, есть любимые цветы?"
10042-100420410 = "...Любимые цветы?"
10042-100420420 = "Хм-м..."
10042-100420430 = "Я люблю любые цветы."
10042-100420440 = "Я люблю и гортензии,"
10042-100420450 = "и розы."
10042-100420460 = "Почему?"
10042-100420470 = "Нет, спасибо."
10042-100420480 = "Сенсей, с возвращением."
10042-100420490 = "Благодаря вам я успела много пересадить."
10042-100420500 = "Надеюсь, они хорошо вырастут."
10042-100420510 = "Да, правда."
10042-100420520 = "И спасибо вам."
10042-100420530 = "Я сохраню это в тайне от всех и буду дорожить."
10042-100420540 = "Здравствуйте, Сенсей."
10042-100420550 = "Ночью был сильный дождь."
10042-100420560 = "Надеюсь, с клумбой всё в порядке..."
10042-100420570 = "Я хочу пойти проверить, но одной страшно."
10042-100420580 = "Вы пойдёте со мной?"
10042-100420590 = "Конечно, с удовольствием."
