10042-100420200 = "Сенсей, доброе утро."
10042-100420210 = "Я нашла интересное место."
10042-100420220 = "Заглянешь, если будет время?"
10042-100420230 = "А? Что за место?"
10042-100420240 = "Место, где мы можем поиграть в школу."
10042-100420250 = "Думаю, будет весело. Гарантирую."
10042-100420260 = "О. Ладно."
10042-100420270 = "Сенсей."
10042-100420280 = "Ты ведь спрашивал меня о хобби, да?"
10042-100420290 = "Я люблю цветы."
10042-100420300 = "То есть... выращивать цветы?"
10042-100420310 = "Возможно, однажды я смогу создать цветочный клуб."
10042-100420320 = "Хотя, думаю, я буду его единственной участницей."
10042-100420330 = "Ладно. Спокойной ночи."
10042-100420340 = "Сенсей, доброе утро."
10042-100420350 = "Я приняла решение."
10042-100420360 = "Найду себе хобби, связанное с цветами."
10042-100420370 = "Например, икебана?"
10042-100420380 = "Это начало клубной деятельности?"
10042-100420390 = "Пожелай мне удачи, Сенсей."
10042-100420400 = "Какой твой любимый цветок, Ацуко?"
10042-100420410 = "А?"
10042-100420420 = "Мой любимый цветок?"
10042-100420430 = "Ну, мне нравятся самые разные, но..."
10042-100420440 = "я люблю гортензии"
10042-100420450 = "и розы."
10042-100420460 = "Что?"
10042-100420470 = "Хорошо."
10042-100420480 = "Сенсей."
10042-100420490 = "Отличная работа."
10042-100420500 = "Надеюсь, он хорошо вырастет."
10042-100420510 = "Да, знаю."
10042-100420520 = "И... спасибо."
10042-100420530 = "Пусть это останется моим маленьким секретом."
10042-100420540 = "Сенсей."
10042-100420550 = "Прошлой ночью был сильный ливень."
10042-100420560 = "Как думаешь, с цветником всё в порядке?"
10042-100420570 = "Нужно проверить, но я не хочу идти одна."
10042-100420580 = "Сходишь со мной?"
10042-100420590 = "Да, хорошо."
