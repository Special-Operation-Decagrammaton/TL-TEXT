10042-100420040 = "Да. Доброе утро."
10042-100420050 = "Доброе утро."
10042-100420060 = "Хотя уже не утро."
10042-100420070 = "Как ты знаешь, сейчас мы постоянно переезжаем с места на место."
10042-100420080 = "Мы не можем долго оставаться в одном месте."
