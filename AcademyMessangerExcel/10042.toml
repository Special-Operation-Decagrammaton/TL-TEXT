10042-100420130 = "Хочешь, чтобы я пришёл к тебе, потому что тебе скучно...?"
10042-100420140 = "Да."
10042-100420150 = "Именно."
10042-100420160 = "Скоро увидимся."
10042-100420170 = "Сенсей."
10042-100420180 = "Я решила уйти."
