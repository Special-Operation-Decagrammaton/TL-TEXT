[translation]
10042-100420010 = "Sensei, tá aí?"
10042-100420020 = "Pode falar agora? Essa mensagem chegou?"
10042-100420030 = "Atsuko?"
10042-100420040 = "Uhum, sou eu. Bom dia."
10042-100420050 = "Bom dia."
10042-100420060 = "Já está quase de noite, mas bom dia."
10042-100420070 = "No momento, nós estamos indo de um lugar para o outro,"
10042-100420080 = "porque não podemos ficar muito tempo no mesmo lugar."
10042-100420090 = "Além disso, na maior parte do tempo estamos todas separadas,"
10042-100420100 = "e ficar sozinha é entediante."
10042-100420110 = "Por isso, para a gente se encontrar,"
10042-100420120 = "fica difícil se você não vier até mim, Sensei."
10042-100420130 = "Resumindo, posso entender que você está entediada e quer que eu vá te ver...?"
10042-100420140 = "Uhum."
10042-100420150 = "Exatamente."
10042-100420160 = "Bom, até daqui a pouco."
10042-100420170 = "Boa noite, Sensei."
10042-100420180 = "Vamos sair deste lugar agora."
10042-100420190 = "Até mais, então. Quando mudarmos de lugar, eu aviso."
10042-100420200 = "Bom dia, Sensei."
10042-100420210 = "Encontrei um lugar interessante."
10042-100420220 = "Se tiver um tempinho, não quer vir aqui me ver?"
10042-100420230 = "Que tipo de lugar?"
10042-100420240 = "Um lugar onde dá para brincar de escolinha."
10042-100420250 = "Acho que vai ser divertido."
10042-100420260 = "Beleza, combinado. Mal posso esperar."
10042-100420270 = "Sensei"
10042-100420280 = "Sobre aquele assunto do meu hobby..."
10042-100420290 = "Eu gosto de flores."
10042-100420300 = "Flores... Quer dizer cultivar flores?"
10042-100420310 = "Uhum. Acho que vou tentar criar um Clube de Jardinagem qualquer dia desses."
10042-100420320 = "Mesmo que só tenha eu de integrante."
10042-100420330 = "Bom, boa noite."
10042-100420340 = "Bom dia, Sensei."
10042-100420350 = "Eu já me decidi."
10042-100420360 = "Vou fazer das flores o meu hobby."
10042-100420370 = "Entendi. Tipo arranjos florais?"
10042-100420380 = "Acho uma ótima ideia."
10042-100420390 = "Torça por mim, viu, Sensei?"
10042-100420400 = "Pode deixar. E tem alguma flor de que você goste mais, Atsuko?"
10042-100420410 = "...Uma flor de que eu goste?"
10042-100420420 = "Huum..."
10042-100420430 = "Sendo flor, eu gosto de qualquer uma."
10042-100420440 = "Gosto de hortênsias,"
10042-100420450 = "e também gosto de rosas."
10042-100420460 = "Por quê?"
10042-100420470 = "Nada não, obrigada."
10042-100420480 = "Bom trabalho hoje, Sensei."
10042-100420490 = "Graças a você, consegui replantar várias mudas."
10042-100420500 = "Tomara que elas cresçam fortes e saudáveis."
10042-100420510 = "Uhum. Tomara mesmo."
10042-100420520 = "Ah, e obrigada."
10042-100420530 = "Vou cuidar muito bem delas em segredo das outras."
10042-100420540 = "Olá, Sensei."
10042-100420550 = "Choveu muito forte ontem à noite."
10042-100420560 = "Será que o canteiro de flores está bem...?"
10042-100420570 = "Quero ir lá conferir, mas estou com receio de ir sozinha."
10042-100420580 = "Você pode ir comigo?"
10042-100420590 = "Claro, com todo o prazer."
