[translation]
20013-200130010 = "Сенсей, простите, что беспокою вас в такое время."
20013-200130020 = "Мне нужно проверить серверы Шале из-за проблем с безопасностью."
20013-200130030 = "Нужно будет открыть компьютер на месте, так что встретимся позже в офисе Шале?"
20013-200130040 = "А, тогда подождите."
20013-200130050 = "Я напишу вам пароль."
20013-200130060 = "Стойте."
20013-200130070 = "Передавать пароль по обычной линии связи — абсолютно недопустимо."
20013-200130080 = "Под монитором лежит записка с паролем, можете посмотреть."
20013-200130090 = "Что"
20013-200130100 = "...Вы шутите, да?"
20013-200130110 = "Сенсей, у меня есть к вам просьба."
20013-200130120 = "Да, конечно. Что случилось?"
20013-200130130 = "Сегодня днём мне нужно посетить одну компанию."
20013-200130140 = "Директор там довольно упрямый, так что я хочу подготовиться заранее."
20013-200130150 = "По-настоящему, в стиле Веритаса."
20013-200130160 = "В стиле Веритаса...?"
20013-200130170 = "Взлом, что ли?"
20013-200130180 = "Да. Я планирую установить небольшой бэкдор, и мне нужна ваша помощь."
20013-200130190 = "Бэкдор...?"
20013-200130200 = "Я полный нуб во взломе, это нормально?"
20013-200130210 = "Ну, когда я говорю «помочь», вам просто нужно будет просто быть там."
20013-200130220 = "Тогда увидимся позже."
20013-200130230 = "Сенсей, вы мне звонили?"
20013-200130240 = "Извините, я немного вздремнула."
20013-200130250 = "А, да. Прости, если разбудил."
20013-200130260 = "Сейчас уже обед, а ты вчера не ложился допоздна?"
20013-200130270 = "Нет. Сегодня ночью будет обслуживание серверов той компании, для которой я работаю консультантом."
20013-200130280 = "Скорее всего, придётся не спать всю ночь, поэтому я решила немного поспать заранее."
20013-200130290 = "Понятно, тяжело тебе."
20013-200130300 = "Если хочешь, можно мне прийти посмотреть?"
20013-200130310 = "Посмотреть?"
20013-200130320 = "Можно, но... это довольно скучно, вряд ли будет интересно, ты уверен?"
20013-200130330 = "Да, всё равно."
20013-200130340 = "Ладно. Тогда встречаемся сегодня в 00:00. Я пришлю место позже."
20013-200130350 = "Только учти, в этот раз неизвестно, когда мы закончим."
20013-200130360 = "Готовься к бессонной ночи, лучше поспи сейчас немного."
20013-200130370 = "Ты, наверное, знаешь, но ребята из Веритаса вечно по любому поводу пытаются взломать..."
20013-200130380 = "К счастью, пока до серьёзных проблем не доходило, но неприятности случаются постоянно."
20013-200130390 = "Если так продолжится, их репутация как хакеров..."
20013-200130400 = "У меня всегда был образ хакеров именно таким. Это предрассудки?"
20013-200130410 = "Ну, в последнее время, когда говорят «хакер», все вспоминают «чёрных хакеров»..."
20013-200130420 = "Но изначально «хакер» — это почти то же самое, что сейчас «белый хакер» — специалист по безопасности."
20013-200130430 = "Вздох, надо будет найти время и провести с ними занятия по этике хакеров... Нельзя же только полагаться на взлом..."
20013-200130440 = "В последнее время я так занята, что даже редко захожу в клуб..."