[translation]
20013-200130010 = "Сенсей, простите, я знаю, что вы заняты."
20013-200130020 = "В Шале произошло нарушение безопасности, поэтому я хотела бы проверить серверы."
20013-200130030 = "Мне нужен пароль от компьютера. Можете прийти в офис Шале?"
20013-200130040 = "Хорошо, уже иду."
20013-200130050 = "Пароль..."
20013-200130060 = "Погодите."
20013-200130070 = "Никогда не пишите пароли по незащищённому каналу."
20013-200130080 = "Я приклеил стикер с паролем снизу монитора. Используй его."
20013-200130090 = "Что?!"
20013-200130100 = "Вы издеваетесь?"
20013-200130110 = "Сенсей, не могли бы вы оказать мне услугу?"
20013-200130120 = "Чем помочь?"
20013-200130130 = "Сегодня днём я собираюсь представить предложение компании, поставляющей оборудование Миллениуму."
20013-200130140 = "Но президент очень упрямый, поэтому я хочу подготовиться, прежде чем говорить с ним."
20013-200130150 = "Я хочу сделать это способом Веритас."
20013-200130160 = "Что значит «способом Веритас»?"
20013-200130170 = "Через взлом?"
20013-200130180 = "Да. Перед работой хочу установить бэкдор на узел. Мне понадобится ваша помощь."
20013-200130190 = "Узел? Бэкдор?"
20013-200130200 = "Чем я помогу? Я ничего не понимаю во взломе."
20013-200130210 = "Всё нормально. Звучит сложно, но вам нужно просто быть рядом."
20013-200130220 = "Увидимся."
20013-200130230 = "Сенсей, вы звонили?"
20013-200130240 = "Я спала. Простите."
20013-200130250 = "Прости, если разбудил."
20013-200130260 = "Ты всю ночь не спала?"
20013-200130270 = "Обслуживание серверов консалтинговой компании запланировано на полночь."
20013-200130280 = "Я подумала, что стоит немного поспать перед ночной работой."
20013-200130290 = "Сверхурочное обслуживание... Звучит тяжело."
20013-200130300 = "Можно я пойду с тобой?"
20013-200130310 = "Хотите посмотреть, как я обслуживаю серверы?"
20013-200130320 = "Я не против, но будет скучно. Вы уверены?"
20013-200130330 = "Уверен."
20013-200130340 = "Хорошо. Отправлю место. Будьте там к полуночи."
20013-200130350 = "Но я не знаю, сколько займёт работа."
20013-200130360 = "Обязательно отдохните заранее, ведь нам придётся не спать всю ночь."
20013-200130370 = "Меня беспокоит, что младшие участницы Веритас продолжат взламывать системы просто ради развлечения."
20013-200130380 = "Пока всё не вышло из-под контроля, но иногда они всё же влипают в неприятности."
20013-200130390 = "Боюсь, это может повредить репутации нашего клуба."
20013-200130400 = "Я думал, хакеры именно этим и занимаются... Или это просто стереотип?"
20013-200130410 = "Сейчас при слове «хакер» люди думают только о чёрных хакерах."
20013-200130420 = "Раньше «хакер» означало что-то вроде специалиста по безопасности. То есть белого хакера."
20013-200130430 = "Надо было научить участниц хакерской этике, пока было время..."
20013-200130440 = "Я давно не заходила в клубную комнату, потому что была очень занята."
