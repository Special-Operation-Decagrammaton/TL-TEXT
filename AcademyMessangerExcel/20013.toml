[translation]
20013-200130010 = "Sensei, desculpa incomodar no meio da correria."
20013-200130020 = "Queria dar uma olhada no servidor da Schale por conta de uma questão de segurança."
20013-200130030 = "Como preciso acessar pelo PC daí, podemos nos encontrar no escritório da Schale mais tarde?"
20013-200130040 = "Ah, então espera só um pouquinho."
20013-200130050 = "Já te mando a senha por aqui."
20013-200130060 = "Para tudo."
20013-200130070 = "Nunca mande uma senha por uma conexão comum dessas."
20013-200130080 = "Tem um post-it com a senha anotada colado embaixo do monitor, pode olhar lá direto se quiser."
20013-200130090 = "Quê?"
20013-200130100 = "...Você tá brincando, né?"
20013-200130110 = "Sensei, queria te pedir um favorzinho."
20013-200130120 = "Claro, o que houve?"
20013-200130130 = "Hoje à tarde eu vou visitar uma empresa, sabe?"
20013-200130140 = "O presidente de lá é bem cabeça-dura, então achei melhor deixar tudo preparado de antemão."
20013-200130150 = "Uma preparação ao estilo da Veritas."
20013-200130160 = "Ao estilo da Veritas...?"
20013-200130170 = "Quer dizer... hackeando?"
20013-200130180 = "Isso. Estou pensando em deixar um backdoor instalado por precaução e queria a sua ajuda."
20013-200130190 = "Um backdoor...?"
20013-200130200 = "Mas eu sou totalmente leigo em hacking, tem certeza?"
20013-200130210 = "Bom, quando digo ajudar, você só precisa estar lá comigo mesmo."
20013-200130220 = "Até mais tarde, então."
20013-200130230 = "Sensei, por acaso você me ligou agorinha?"
20013-200130240 = "Desculpa, eu estava cochilando."
20013-200130250 = "Ah, sim. Desculpa se acabei te acordando."
20013-200130260 = "Já é hora do almoço... Ficou acordada até tarde ontem?"
20013-200130270 = "Não. É que hoje de madrugada vai ter manutenção nos servidores de uma empresa para a qual presto consultoria."
20013-200130280 = "Como provavelmente vou virar a noite, achei melhor dormir um pouco antes."
20013-200130290 = "Entendi, que puxado."
20013-200130300 = "Se não tiver problema, posso ir junto para acompanhar?"
20013-200130310 = "Acompanhar?"
20013-200130320 = "Por mim tudo bem, mas... é um trabalho bem monótono, acho que você vai achar chato, viu?"
20013-200130330 = "Não tem problema, quero ir mesmo assim."
20013-200130340 = "Entendi. Então nos encontramos hoje à meia-noite. Depois te mando o local."
20013-200130350 = "Só que, pelo tipo de serviço dessa vez, não dá para saber que horas vai terminar."
20013-200130360 = "Então já vá preparado para virar a noite e aproveite para dormir um pouco agora enquanto dá."
20013-200130370 = "Você já deve saber disso, mas as meninas da Veritas têm mania de sair hackeando as coisas por pura curiosidade..."
20013-200130380 = "Felizmente ainda não causaram nenhum problema grave de verdade, mas vivem se metendo em confusão."
20013-200130390 = "Se continuar assim, a nossa imagem como hackers vai..."
20013-200130400 = "Confesso que eu também tinha meio que essa imagem de hackers... É preconceito meu?"
20013-200130410 = "Claro que, especialmente hoje em dia, quando se fala em \"hacker\", todo mundo já pensa logo em \"black hat\", mas..."
20013-200130420 = "Originalmente, o termo \"hacker\" significava um \"especialista em segurança\", muito mais próximo do que hoje chamamos de \"white hat\"."
20013-200130430 = "Haah... Preciso arranjar um tempo para dar outra aula de ética hacker para aquelas meninas... Elas não podem ficar recorrendo a esses meios para tudo..."
20013-200130440 = "O problema é que ando tão ocupada ultimamente que mal tenho conseguido aparecer no clube..."
