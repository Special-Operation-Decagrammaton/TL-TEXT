[translation]
23001-1449 = "Sensei, tenho um favor para te pedir..."
23001-1450 = "Você teria um tempinho hoje?"
23001-1451 = "Claro, tenho sim."
23001-1452 = "Q-que alívio!"
23001-1453 = "Então vou estar te esperando no refeitório. Conto com você."
23001-1454 = "Muito obrigada por me ajudar hoje."
23001-1455 = "Imagina, não fiz nada demais."
23001-1456 = "Não diga isso. Vou retribuir esse favor outro dia sem falta."
23001-1457 = "Pode esperar ansioso, viu?"
23001-1458 = "Sensei, está tudo pronto."
23001-1459 = "Pronto? Pronto o quê...?"
23001-1460 = "Você poderia vir ao refeitório estudantil da Gehenna hoje?"
23001-1461 = "Vou te mostrar todo o potencial da Fuuka."
23001-1462 = "M-me desculpe, Sensei."
23001-1463 = "Eu queria tanto te receber com uma comida deliciosa que acabei me empolgando..."
23001-1464 = "Me desculpe mesmo por hoje!"
23001-1465 = "Sensei, já acordou? Como está se sentindo...?"
23001-1466 = "Sim, acabei de acordar."
23001-1467 = "Estou bem, não foi nada."
23001-1468 = "Ufa, que alívio..."
23001-1469 = "Até agora há pouco, eu estava pensando em várias formas de me redimir com você,"
23001-1470 = "e acabou de me ocorrer uma ótima ideia..."
23001-1471 = "Será que podemos nos encontrar hoje à tarde?"
23001-1472 = "Claro, com todo o prazer."
23001-1473 = "Muito obrigada! Então fico te esperando!"
23001-1474 = "O que achou do prato de enguia de hoje?"
23001-1475 = "Espero que tenha agradado ao seu paladar, Sensei."
23001-1476 = "Da próxima vez, vou preparar algo ainda mais gostoso para você!"
23001-1477 = "Sensei. Na verdade, outro dia eu inventei uma receita nova,"
23001-1478 = "e queria muito que você fosse o primeiro a experimentar."
23001-1479 = "Se não for incômodo..."
23001-1480 = "Prato novo da Fuuka! Eu vou com certeza!"
23001-1481 = "Hehe. Certo, estarei te esperando."
23001-1482 = "Sensei."
23001-1483 = "Você se lembra direitinho de que combinou de me ajudar hoje?"
23001-1484 = "Lembro sim."
23001-1485 = "...Era hoje mesmo?"
23001-1486 = "Que bom♪"
23001-1487 = "Ah, será que eu não tinha te avisado direito...?"
23001-1488 = "Foi mal, é brincadeira."
23001-1489 = "Ah, era... brincadeira...?"
23001-1490 = "Quando você faz uma brincadeira maldosa dessas,"
23001-1491 = "eu fico magoada..."
23001-1492 = "M-me desculpa...!"
23001-1493 = "...Brincadeirinha, isso também foi só uma piada."
23001-1494 = "Você me pegou!"
23001-1495 = "Hehe, bom, deixando as brincadeiras de lado,"
23001-1496 = "estou te esperando no refeitório!"
23001-1497 = "S-Sensei..."
23001-1498 = "Hum, sobre o que aconteceu hoje..."
23001-1499 = "Aconteceu alguma coisa?"
23001-1500 = "A Fuuka-tan estava tão fofinha..."
23001-1501 = "U-uuugh...! É-é segredo das outras pessoas, ouviu bem...?"
