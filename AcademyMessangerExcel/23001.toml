[translation]
23001-1449 = "У меня есть просьба, Сенсей."
23001-1450 = "У вас сегодня есть время?"
23001-1451 = "Конечно, без проблем."
23001-1452 = "Ура!"
23001-1453 = "Буду ждать вас в школьной столовой."
23001-1454 = "Спасибо за помощь сегодня."
23001-1455 = "Пустяки."
23001-1456 = "Я отплачу вам за сегодня."
23001-1457 = "Вы не разочаруетесь."
23001-1458 = "Всё готово, Сенсей."
23001-1459 = "Готово? Что готово?"
23001-1460 = "Приходите в школьную столовую Геенны и узнаете!"
23001-1461 = "Я покажу вам силу Фууки!"
23001-1462 = "П-Простите, Сенсей."
23001-1463 = "Я правда хотела угостить вас чем-нибудь вкусным..."
23001-1464 = "Мне так жаль из-за сегодняшнего!"
23001-1465 = "Вы уже проснулись, Сенсей? Как себя чувствуете?"
23001-1466 = "Да, проснулся."
23001-1467 = "Всё нормально. Чувствую себя хорошо."
23001-1468 = "Фух, какое облегчение."
23001-1469 = "Я хочу исправиться за тот прошлый провал."
23001-1470 = "У меня есть отличная идея..."
23001-1471 = "Можно увидеться с вами сегодня после обеда, Сенсей?"
23001-1472 = "Конечно."
23001-1473 = "Хорошо, тогда буду ждать!"
23001-1474 = "Как вам сегодняшний угорь?"
23001-1475 = "Надеюсь, вам понравилось."
23001-1476 = "В следующий раз приготовлю что-нибудь ещё лучше!"
23001-1477 = "Сенсей, я приготовила блюдо по новому рецепту."
23001-1478 = "Хочу, чтобы вы попробовали!"
23001-1479 = "Если у вас есть время..."
23001-1480 = "Новое блюдо от Фууки? Я уже иду!"
23001-1481 = "Хи-хи! Тогда буду ждать!"
23001-1482 = "Сенсей."
23001-1483 = "Вы обещали помочь мне сегодня во время обеда. Вы ведь не забыли?"
23001-1484 = "Помню."
23001-1485 = "Я такое говорил?"
23001-1486 = "О, да. Какое облегчение. ♪"
23001-1487 = "О, наверное, мы друг друга не поняли."
23001-1488 = "Я просто шучу."
23001-1489 = "О, это была шутка..."
23001-1490 = "Не делайте так..."
23001-1491 = "Вы пытаетесь задеть мои чувства?"
23001-1492 = "Прости!"
23001-1493 = "А? Это была шутка!"
23001-1494 = "Ты меня подловила!"
23001-1495 = "Ха-ха! На сегодня хватит дурачиться."
23001-1496 = "Буду ждать вас в школьной столовой!"
23001-1497 = "Сенсей..."
23001-1498 = "То, что сегодня произошло..."
23001-1499 = "А что произошло?"
23001-1500 = "Это было мило, Фуука."
23001-1501 = "Пожалуйста, никому не рассказывайте! Пожалуйста!"
