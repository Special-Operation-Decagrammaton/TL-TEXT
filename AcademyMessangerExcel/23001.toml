[translation]
23001-1449 = "Сенсей, у меня к вам просьба..."
23001-1450 = "У вас сегодня есть время?"
23001-1451 = "Да, есть."
23001-1452 = "Х-хорошо!"
23001-1453 = "Тогда я буду ждать вас в столовой. Заранее спасибо."
23001-1454 = "Спасибо, что помогли мне сегодня."
23001-1455 = "Я почти ничего не сделал."
23001-1456 = "Нет-нет. Я обязательно отблагодарю вас в другой раз."
23001-1457 = "Ждите с нетерпением."
23001-1458 = "Сенсей, я всё подготовила."
23001-1459 = "Подготовила... что?"
23001-1460 = "Не могли бы вы сегодня зайти в студенческую столовую Геенны?"
23001-1461 = "Я покажу вам всё, на что способна."
23001-1462 = "П-простите, Сенсей!"
23001-1463 = "Я хотела угостить вас вкусным блюдом и слишком увлеклась..."
23001-1464 = "Сегодня мне правда очень жаль!"
23001-1465 = "Сенсей, вы проснулись? Как вы себя чувствуете...?"
23001-1466 = "Да, только что встал."
23001-1467 = "Всё в порядке, я нормально."
23001-1468 = "Фух, слава богу..."
23001-1469 = "Я думала о том, как можно загладить свою вину."
23001-1470 = "И у меня появилась хорошая идея..."
23001-1471 = "Мы не могли бы встретиться сегодня днём?"
23001-1472 = "Да, с радостью."
23001-1473 = "Спасибо! Тогда я буду ждать!"
23001-1474 = "Как вам сегодняшнее блюдо из угря?"
23001-1475 = "Надеюсь, вам понравилось."
23001-1476 = "В следующий раз я угощу вас чем-то ещё более вкусным!"
23001-1477 = "Сенсей. На самом деле, недавно я придумала новое блюдо."
23001-1478 = "Я очень хочу, чтобы вы попробовали его первым."
23001-1479 = "Если вы не против..."
23001-1480 = "Новое блюдо от Фууки! Я обязательно приду!"
23001-1481 = "Хе-хе. Я буду ждать."
23001-1482 = "Сенсей"
23001-1483 = "Вы помните наш разговор о том, что поможете мне сегодня?"
23001-1484 = "Да, помню."
23001-1485 = "...Разве это не сегодня?"
23001-1486 = "Как хорошо♪"
23001-1487 = "Ах, может, я неверно объяснила...?"
23001-1488 = "Прости, я пошутил."
23001-1489 = "А, это была шутка..."
23001-1490 = "Если вы будете так жестоко шутить,"
23001-1491 = "я расстроюсь..."
23001-1492 = "П-прости...!"
23001-1493 = "...Хотя это тоже шутка."
23001-1494 = "Я попался!"
23001-1495 = "Хе-хе, хватит шуток."
23001-1496 = "Я буду ждать вас в столовой!"
23001-1497 = "С-Сенсей..."
23001-1498 = "Ну, то, что было сегодня..."
23001-1499 = "А что такое?"
23001-1500 = "Фуука была такой милой..."
23001-1501 = "У-ух...! Н-никому не говорите, ладно...?"