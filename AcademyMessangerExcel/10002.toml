[translation]
10002-416 = "Я собиралась продолжить своё гастрономическое путешествие, но"
10002-417 = "столкнулась с препятствием."
10002-418 = "Нужно подумать, как его преодолеть."
10002-419 = "Не знаю, что это за препятствие, но я на твоей стороне!"
10002-420 = "А."
10002-421 = "Я как раз собиралась попросить вашей помощи."
10002-422 = "Хи-хи-хи."
10002-423 = "Кстати, я думала: может, похожего вкуса можно добиться с помощью кулинарного вина."
10002-424 = "Кулинарное вино и виноградный сок. Запишу."
10002-425 = "Только исследуй осторожно..."
10002-426 = "И о себе тоже позаботься..."
10002-427 = "Хи-хи, вы за меня переживаете?"
10002-428 = "Я рада."
10002-429 = "Если задуматься,"
10002-430 = "чайные церемонии учат"
10002-431 = "высшей форме этикета,"
10002-432 = "связанной со вкусом."
10002-433 = "А? Чайные церемонии?"
10002-434 = "Тема непростая."
10002-435 = "Хи-хи-хи."
10002-436 = "Значит, снова пора на поиски."
10002-437 = "Я уже подготовила место,"
10002-438 = "так что, пожалуйста, присоединитесь к моему гастрономическому путешествию."
10002-439 = "Хорошо. Увидимся позже."
10002-440 = "Чайная церемония... Звучит сложно."
10002-441 = "Тогда буду ждать вас."
10002-442 = "Сенсей."
10002-443 = "Не знаю, что произошло, но..."
10002-444 = "когда я снова попробовала это у себя в комнате, вкус был уже не тот,"
10002-445 = "хотя все ингредиенты были одинаковыми."
10002-446 = "Как думаете, почему?"
10002-447 = "Потому что место было другим?"
10002-448 = "Нет... Моя комната такая же приятная и просторная, как чайный домик."
10002-449 = "Тогда в чём причина?"
10002-450 = "Ингредиенты, температура и способ заваривания были одинаковыми."
10002-451 = "Хм..."
10002-452 = "Я ещё подумаю над этим."
10002-453 = "На этот раз я наконец-то собираюсь в тот дорогой ресторан, на который уже несколько месяцев засматриваюсь."
10002-454 = "Иногда еду лучше оценивать в одиночку, так что так и поступлю."
10002-455 = "А? Ты пойдёшь одна?"
10002-456 = "Пойти в ресторан одной... Ты и правда повышаешь ставки."
10002-457 = "Хи-хи. Расскажу, как всё прошло, когда вернусь."
10002-458 = "Я ненадолго беру паузу в своём личном гастрономическом путешествии."
10002-459 = "У меня сейчас слишком противоречивые чувства..."
10002-460 = "Не унывай, Харуна."
10002-461 = "Я могу чем-нибудь помочь?"
10002-462 = "Хи-хи-хи."
10002-463 = "Вы такой добрый."
10002-464 = "Одной вашей доброты достаточно, чтобы меня исцелить."
10002-465 = "Спасибо."
10002-466 = "Тайяки, которые мы ели вместе, были лучшей едой за последнее время."
10002-467 = "Как думаете, почему?"
10002-468 = "Хм, не знаю. Обычные тайяки."
10002-469 = "У меня идей нет..."
10002-470 = "Хи-хи."
10002-471 = "Кажется, я поняла почему."
10002-472 = "О? Правда?"
10002-473 = "Но я вам не скажу."
10002-474 = "Пусть пока останется моим секретом."
10002-475 = "Хи-хи. Сенсей, давайте скоро снова поедим вместе."
