[translation]
10002-416 = "Исследование гастрономии продолжается и сегодня... так должно было быть, но"
10002-417 = "я наткнулась на стену."
10002-418 = "Как решить эту трудную задачу... нужно немного подумать."
10002-419 = "Не знаю, в чём дело, но удачи!"
10002-420 = "Ах, пришла хорошая мысль."
10002-421 = "Сенсей, не могли бы вы немного помочь?"
10002-422 = "Я буду ждать вас в Геенне."
10002-423 = "Если подумать, можно было бы использовать и кулинарное вино."
10002-424 = "Кулинарное вино и виноградный сок, в следующий раз попробуем с ними."
10002-425 = "В следующий раз будь осторожнее..."
10002-426 = "Главное — безопасность..."
10002-427 = "Хе-хе, вы беспокоитесь обо мне?"
10002-428 = "Как приятно. Хе-хе, спасибо вам."
10002-429 = "Я тут подумала:"
10002-430 = "чайная церемония —"
10002-431 = "не является ли она высшей формой поведения по отношению к еде?"
10002-432 = "Мне так показалось."
10002-433 = "Чайная церемония?"
10002-434 = "Сложный мир."
10002-435 = "Хе-хе-хе."
10002-436 = "Раз это сложный мир, я сама ещё в процессе постижения."
10002-437 = "Поэтому я подготовила место,"
10002-438 = "не хотите ли вместе поискать этот высший вкус?"
10002-439 = "С нетерпением жду."
10002-440 = "Чайная церемония... звучит сложно."
10002-441 = "Хе-хе, я буду ждать вас."
10002-442 = "Сенсей."
10002-443 = "Почему же..."
10002-444 = "Я только что попробовала приготовить это снова, потому что захотелось ещё раз съесть, но"
10002-445 = "вышло не очень вкусно."
10002-446 = "Ингредиенты те же, но почему...?"
10002-447 = "Может, из-за того, что место другое?"
10002-448 = "Моя комната такая же просторная и удобная, как чайная..."
10002-449 = "В чём же причина..."
10002-450 = "Ингредиенты, температура, способ приготовления — всё должно быть одинаково..."
10002-451 = "Хм-м, что-то, что отличалось от того раза..."
10002-452 = "Я немного подумаю, если заметите что-то, пожалуйста, скажите мне."
10002-453 = "Сегодня я собираюсь в ресторан высшего класса, на который охотилась последние несколько месяцев."
10002-454 = "В этот раз пойду одна. Иногда так лучше для оценки блюда."
10002-455 = "Понятно, удачного похода."
10002-456 = "Одной в ресторан высшего класса... круто..."
10002-457 = "Хе-хе-хе, по возвращении расскажу вам свои впечатления."
10002-458 = "Внезапно, но я решила приостановить свою личную гастрономическую деятельность на некоторое время."
10002-459 = "Мне нужно многое обдумать..."
10002-460 = "Ты в порядке? Держись."
10002-461 = "Я могу тебе чем-то помочь?"
10002-462 = "Хе-хе-хе."
10002-463 = "Сенсей такой добрый."
10002-464 = "От одних ваших слов я уже получила достаточно сил."
10002-465 = "Спасибо вам."
10002-466 = "Сегодняшняя таяки была, без сомнения, самой вкусной из того, что я ела в последнее время."
10002-467 = "...А знаете ли вы, Сенсей, почему?"
10002-468 = "Правда? Хм-м... мне показалось, обычная таяки..."
10002-469 = "Наверное, я не понял..."
10002-470 = "Хе-хе."
10002-471 = "Вероятно. Таким вы и должны быть, Сенсей."
10002-472 = "А ты, Харуна, знаешь?"
10002-473 = "Да, но я не могу вам сказать."
10002-474 = "Пусть это будет мой маленький секрет."
10002-475 = "Ну что же, давайте снова вместе пойдём есть что-то вкусное, Сенсей."
