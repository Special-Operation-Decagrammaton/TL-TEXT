[translation]
20041-200410010 = "Сенсей, вы меня слышите?"
20041-200410020 = "Рио!?"
20041-200410030 = "Да, это я."
20041-200410040 = "И вообще..."
20041-200410050 = "Не слишком ли вы удивлены?"
20041-200410060 = "Я не ожидал, что ты напишешь."
20041-200410070 = "Сразу скажу — это вспомогательное устройство."
20041-200410080 = "Записывать контакт не нужно."
20041-200410090 = "Ситуация настолько серьёзна, что ты используешь вспомогательное устройство...?"
20041-200410100 = "Возникли какие-то проблемы?"
20041-200410110 = "Было бы неприятно, если бы засекли связь, верно?"
20041-200410120 = "...Сочувствую операторам связи."
20041-200410130 = "..."
20041-200410140 = "Я не думала с этой стороны."
20041-200410150 = "Но это самый рациональный способ."
20041-200410160 = "И что же случилось?"
20041-200410170 = "Я пришла в супермаркет за обедом, но..."
20041-200410180 = "он временно закрыт... не могли бы вы зайти ко мне?"
20041-200410190 = "Вы ещё не спите?"
20041-200410200 = "Что случилось?"
20041-200410210 = "Я закончила того «Авангарда» с кулинарной функцией, о котором вы говорили."
20041-200410220 = "Ого, он работает?"
20041-200410230 = "Да, в целом."
20041-200410240 = "Только, в отличие от вашей домашней еды,"
20041-200410250 = "...он не может дать отзыв о вкусе."
20041-200410260 = "Я ещё приготовлю тебе, так что ешь нормально, даже одна."
20041-200410270 = "Спасибо."
20041-200410280 = "Можно будет просить вас о еде раз в два дня?"
20041-200410290 = "Хотя бы раз в три дня..."
20041-200410300 = "...Хорошо."
20041-200410310 = "Сенсей, у меня небольшая проблема."
20041-200410320 = "Рио!"
20041-200410330 = "Хорошо бы я могла справиться сама, но..."
20041-200410340 = "и это сложно..."
20041-200410350 = "Я сделаю всё, что ты попросишь, Рио."
20041-200410360 = "Спасибо, Сенсей."
20041-200410370 = "Тогда я укажу Шале как адрес для получения посылок."
20041-200410380 = "...Что?"
20041-200410390 = "Сенсей."
20041-200410400 = "Я использовала те детали, что были в прошлый раз,"
20041-200410410 = "и модернизировала «Авангарда» с кулинарной функцией."
20041-200410420 = "Кажется, вкус стал более насыщенным, чем раньше."
20041-200410430 = "Как хорошо, Рио!"
20041-200410440 = "Да."
20041-200410450 = "Я благодарна."
20041-200410460 = "Много чего было,"
20041-200410470 = "но наконец-то всё успокоилось."
20041-200410480 = "И я подумала"
20041-200410490 = "возобновить то, что делала раньше."
20041-200410500 = "То, что делала раньше?"
20041-200410510 = "Создание объектов."
20041-200410520 = "Промышленный дизайн, если так понятнее."
20041-200410530 = "Но в убежище"
20041-200410540 = "сложно найти место."
20041-200410550 = "И проблема с вентиляцией..."
20041-200410560 = "Тогда, может, займёшься в Шале?"
20041-200410570 = "..."
20041-200410580 = "Это не будет помехой?"
20041-200410590 = "Всё в порядке!"
20041-200410600 = "...Спасибо."
20041-200410610 = "Как и в прошлый раз,"
20041-200410620 = "если можно будет снова оформить получение посылок на Шале,"
20041-200410630 = "мне это очень поможет."
20041-200410640 = "Хотя сейчас уже поздно говорить об этом..."
20041-200410650 = "Я хочу, чтобы вы позволили мне"
20041-200410660 = "отплатить вам."
20041-200410670 = "Не стоит беспокоиться."
20041-200410680 = "Я знала, что вы так скажете."
20041-200410690 = "Но, учитывая социальные нормы,"
20041-200410700 = "а также расчёты вероятностей и статистики,"
20041-200410710 = "я решила, что так будет правильно."
20041-200410720 = "Вероятности и статистика..."
20041-200410730 = "Короче."
20041-200410740 = "Я приглашаю вас в своё убежище."
20041-200410750 = "...Если не против, приходите."
20041-200410760 = "Вы добрались благополучно?"
20041-200410770 = "...Сенсей."
20041-200410780 = "Большое спасибо за сегодня."
20041-200410790 = "И ещё..."
20041-200410800 = "В том, что я скажу дальше, нет скрытого смысла."
20041-200410810 = "Но, пожалуйста, удалите это после прочтения."
20041-200410820 = "Давно я не проводила время в такой уютной комнате."
20041-200410830 = "И к тому же..."
20041-200410840 = "С тех пор как я стала проводить время с вами,"
20041-200410850 = "я чувствую, что во мне потихоньку происходят перемены."
20041-200410860 = "Можно сказать, это чувства, которых во мне раньше не было."
20041-200410870 = "Вы показали мне, что мои мысли не обязательно должны быть безупречны."
20041-200410880 = "Разговаривая с вами, я получаю новый взгляд на вещи."
20041-200410890 = "Я знаю, что с вами много хлопот, но..."
20041-200410900 = "всё же... если вы не против,"
20041-200410910 = "я была бы рада, если бы вы снова нашли для меня время."
20041-200410920 = "Спокойной ночи, Рио."
20041-200410930 = "Да."
20041-200410940 = "Спокойной ночи, Сенсей."