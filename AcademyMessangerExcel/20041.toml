[translation]
20041-200410010 = "Sensei, será que minha mensagem está chegando?"
20041-200410020 = "Rio?!"
20041-200410030 = "Sim, sou eu"
20041-200410040 = "Quer dizer..."
20041-200410050 = "Você não está surpreso até demais?"
20041-200410060 = "É que eu não esperava receber uma mensagem sua, Rio"
20041-200410070 = "Já vou avisando de antemão: este é um aparelho secundário"
20041-200410080 = "Não há necessidade de salvar o contato"
20041-200410090 = "A situação é grave a ponto de precisar usar um aparelho secundário...?"
20041-200410100 = "Algum problema com isso?"
20041-200410110 = "Seria problemático se rastreassem a comunicação, não acha?"
20041-200410120 = "...Só pensei que as operadoras de telefonia também não têm vida fácil"
20041-200410130 = "..."
20041-200410140 = "Eu não tinha pensado por essa perspectiva"
20041-200410150 = "Mas esta é a escolha mais racional"
20041-200410160 = "Enfim, o que aconteceu?"
20041-200410170 = "Eu vim ao supermercado comprar uma marmita, mas..."
20041-200410180 = "Está fechado temporariamente... Você poderia vir até aqui um instante?"
20041-200410190 = "Ainda está acordado?"
20041-200410200 = "O que houve?"
20041-200410210 = "Terminei de construir o Avant-Garde-kun com função culinária que você havia mencionado"
20041-200410220 = "Opa, e está funcionando direitinho?"
20041-200410230 = "Sim, em teoria"
20041-200410240 = "Porém, diferente da sua comida caseira, Sensei..."
20041-200410250 = "...Não consigo formular nenhuma impressão sobre o sabor"
20041-200410260 = "Eu cozinho pra você de novo depois, então vê se come direitinho mesmo quando estiver sozinha"
20041-200410270 = "Obrigada"
20041-200410280 = "Acha que tudo bem comer marmita pronta uma vez a cada dois dias?"
20041-200410290 = "Que seja pelo menos a cada três dias..."
20041-200410300 = "...Entendido"
20041-200410310 = "Sensei, surgiu uma situação um tanto complicada"
20041-200410320 = "Rio!"
20041-200410330 = "Seria bom se eu mesma pudesse lidar com isso, mas..."
20041-200410340 = "Também está difícil para mim..."
20041-200410350 = "Se for um pedido seu, Rio, eu ajudo no que precisar"
20041-200410360 = "Obrigada, Sensei"
20041-200410370 = "Então vou colocar a Schale como endereço de entrega das encomendas"
20041-200410380 = "...Hã?"
20041-200410390 = "Sensei"
20041-200410400 = "Usei aquelas peças do outro dia"
20041-200410410 = "para modificar o Avant-Garde-kun com função culinária,"
20041-200410420 = "e sinto que o sabor ficou mais encorpado do que antes"
20041-200410430 = "Que notícia boa, Rio!"
20041-200410440 = "Sim"
20041-200410450 = "Eu te agradeço"
20041-200410460 = "Muita coisa aconteceu, mas"
20041-200410470 = "finalmente a situação se acalmou"
20041-200410480 = "Por isso, estou pensando em retomar"
20041-200410490 = "aquilo que eu fazia antes"
20041-200410500 = "O que você fazia antes?"
20041-200410510 = "A criação de objetos"
20041-200410520 = "Talvez seja mais fácil de entender se eu chamar de design industrial"
20041-200410530 = "Mas aqui no esconderijo"
20041-200410540 = "é difícil conseguir espaço suficiente"
20041-200410550 = "E também há o problema da ventilação..."
20041-200410560 = "Então por que não vem fazer aqui na Schale?"
20041-200410570 = "..."
20041-200410580 = "Não seria um incômodo?"
20041-200410590 = "Imagina, pode vir tranquila!"
20041-200410600 = "Hum... Obrigada"
20041-200410610 = "E, assim como da última vez,"
20041-200410620 = "se eu puder pedir para receber as encomendas por mim,"
20041-200410630 = "seria de grande ajuda"
20041-200410640 = "Sei que é um pouco tarde para dizer isso, mas..."
20041-200410650 = "Gostaria que me deixasse"
20041-200410660 = "retribuir tudo o que fez por mim"
20041-200410670 = "Não precisa se preocupar com isso"
20041-200410680 = "Eu sabia que você diria isso, Sensei"
20041-200410690 = "Mas, com base nas normas sociais,"
20041-200410700 = "bem como em probabilidades e estatísticas,"
20041-200410710 = "concluí que é o que devo fazer"
20041-200410720 = "Probabilidades e estatísticas...?"
20041-200410730 = "De todo modo,"
20041-200410740 = "quero convidá-lo para o meu esconderijo"
20041-200410750 = "...Se puder, por favor, venha"
20041-200410760 = "Conseguiu voltar em segurança?"
20041-200410770 = "...Sensei"
20041-200410780 = "Muito obrigada pelo dia de hoje"
20041-200410790 = "Além disso..."
20041-200410800 = "A mensagem que vou enviar agora não tem nenhum significado profundo"
20041-200410810 = "Porém, peço que a apague depois de ler"
20041-200410820 = "Há quanto tempo será que eu não passava um tempo em um quarto tão arrumado assim?"
20041-200410830 = "E também..."
20041-200410840 = "Desde que comecei a passar tempo com você, Sensei,"
20041-200410850 = "sinto que pequenas mudanças estão acontecendo dentro de mim"
20041-200410860 = "Poderia até chamar de sentimentos que não existiam em mim antes"
20041-200410870 = "Você me fez perceber que minhas ideias não precisam ser perfeitas o tempo todo,"
20041-200410880 = "e conversar com você sempre me traz novas perspectivas"
20041-200410890 = "Bem... sei que acabo dando bastante trabalho em vários sentidos,"
20041-200410900 = "mas, ainda assim... se não for incômodo para você, Sensei,"
20041-200410910 = "eu ficaria muito feliz se pudesse reservar um tempo para mim novamente"
20041-200410920 = "Boa noite, Rio"
20041-200410930 = "Sim"
20041-200410940 = "Boa noite, Sensei"
