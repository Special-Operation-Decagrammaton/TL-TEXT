[translation]
20041-200410010 = "Сенсей."
20041-200410020 = "А? Кто это?"
20041-200410030 = "А."
20041-200410040 = "Вы меня не знаете."
20041-200410050 = "Это я, Сенсей. Рио."
20041-200410060 = "Рио?! Ты сейчас где?!"
20041-200410070 = "Я использую одноразовый телефон."
20041-200410080 = "В следующий раз номер изменится, так что сохранять его нет смысла."
20041-200410090 = "Ты в порядке?.."
20041-200410100 = "Есть проблема?"
20041-200410110 = "Я просто действую рационально. Мне нужно убедиться, что меня нельзя отследить."
20041-200410120 = "Но оператор связи всё равно будет знать, где ты..."
20041-200410130 = "М-м."
20041-200410140 = "Об этом я не подумала."
20041-200410150 = "Но всё равно у меня не было выбора."
20041-200410160 = "Так что случилось?"
20041-200410170 = "Я вышла купить бэнто со скидкой на ужин..."
20041-200410180 = "Но оказалось, что магазин сегодня закрыт..."
20041-200410190 = "Сенсей? Вы ещё не спите?"
20041-200410200 = "Что случилось?"
20041-200410210 = "Я сделала кулинарного Avant Guard, как вы и сказали..."
20041-200410220 = "Он работает?"
20041-200410230 = "Да. И работает хорошо."
20041-200410240 = "Но он приготовил что-то, похожее на то, что приготовили бы вы."
20041-200410250 = "Неплохо, но и вкусным не назовёшь..."
20041-200410260 = "Зато полезно, так что давайте разделим."
20041-200410270 = "Хорошо..."
20041-200410280 = "Кстати, нормально ли есть бэнто со скидкой, скажем, через день?"
20041-200410290 = "Раз в ТРИ дня."
20041-200410300 = "Хорошо..."
20041-200410310 = "Сенсей, вы здесь?"
20041-200410320 = "Дай угадаю, это Рио?"
20041-200410330 = "Вы угадали."
20041-200410340 = "Я хотела попросить вас кое о чём, если вы не против?"
20041-200410350 = "Если студент просит о помощи — в любое время."
20041-200410360 = "Хорошо."
20041-200410370 = "Мне нужно отправить несколько вещей в ваш офис."
20041-200410380 = "...Что?"
20041-200410390 = "Сенсей."
20041-200410400 = "Я пыталась улучшить кулинарного Avant Guard,"
20041-200410410 = "раз уж получила те детали."
20041-200410420 = "Еда понемногу становится вкуснее."
20041-200410430 = "Хорошо."
20041-200410440 = "Да, становится."
20041-200410450 = "Спасибо, Сенсей."
20041-200410460 = "По разным причинам"
20041-200410470 = "сейчас я не так занята."
20041-200410480 = "Поэтому я подумала"
20041-200410490 = "вернуться к тому, чем когда-то занималась."
20041-200410500 = "К тому, чем занималась раньше?"
20041-200410510 = "Делать разные вещи, например скульптуры."
20041-200410520 = "Что-то вроде промышленного дизайна."
20041-200410530 = "Но у меня не так много места"
20041-200410540 = "здесь, в убежище."
20041-200410550 = "И есть проблема с вентиляцией."
20041-200410560 = "Тогда не хочешь прийти в Шале?"
20041-200410570 = "А?"
20041-200410580 = "Можно?"
20041-200410590 = "Я не против."
20041-200410600 = "Эм..."
20041-200410610 = "Спасибо."
20041-200410620 = "Тогда, как и в прошлый раз,"
20041-200410630 = "попрошу вас забрать кое-что для меня."
20041-200410640 = "Эм, Сенсей?"
20041-200410650 = "Я подумала"
20041-200410660 = "и считаю, что должна отплатить вам за многое."
20041-200410670 = "Не обязательно."
20041-200410680 = "Я знала, что вы скажете что-то подобное."
20041-200410690 = "Но с точки зрения обычной вежливости,"
20041-200410700 = "а также вероятности и статистики,"
20041-200410710 = "считаю, что это необходимо."
20041-200410720 = "Интересно, что для тебя значит «вероятность и статистика»..."
20041-200410730 = "В общем..."
20041-200410740 = "Я хочу пригласить вас в своё убежище."
20041-200410750 = "Если вы не против."
20041-200410760 = "Ты нормально вернулся, Сенсей?"
20041-200410770 = "Эм..."
20041-200410780 = "Не знаю, стоит ли мне это говорить..."
20041-200410790 = "И если сможете,"
20041-200410800 = "было бы неплохо удалить сообщение после прочтения."
20041-200410810 = "Я просто не знаю, Сенсей."
20041-200410820 = "Я впервые испытываю что-то подобное."
20041-200410830 = "Не знаю, как это определить."
20041-200410840 = "Не знаю, чувствовали ли вы когда-нибудь такое."
20041-200410850 = "Может быть"
20041-200410860 = "Наверное, не так уж важно,"
20041-200410870 = "знаете вы или нет."
20041-200410880 = "Но сейчас почему-то"
20041-200410890 = "я очень хочу снова вас увидеть."
20041-200410900 = "Вот и всё."
20041-200410910 = "Спокойной ночи."
20041-200410920 = "Спокойной ночи, Рио."
20041-200410930 = "Да, становится."
20041-200410940 = "Как всегда, спасибо."
