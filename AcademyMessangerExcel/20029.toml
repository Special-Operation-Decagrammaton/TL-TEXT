[translation]
20029-200290010 = "Сенсей?"
20029-200290020 = "Ты готов идти на пляж?"
20029-200290030 = "Хм... Что же взять..."
20029-200290040 = "Пожалуйста, не переживай!"
20029-200290050 = "Я принесу всё необходимое, так что от тебя нужен только ты сам."
20029-200290060 = "Ну, ты сам и твой купальник."
20029-200290070 = "Конечно..."
20029-200290080 = "Хорошо, увидимся перед моей комнатой."
20029-200290090 = "Буду ждать!"
20029-200290100 = "Тебе понравилось загорать, Сенсей?"
20029-200290110 = "Кажется, даже слишком понравилось..."
20029-200290120 = "О? Что ты имеешь в виду?"
20029-200290130 = "Ах, тебе ведь не больно?"
20029-200290140 = "Благодаря тебе всё отлично, Мимори!"
20029-200290150 = "Правда? Хи-хи! Рада слышать."
20029-200290160 = "Давай скоро снова поговорим!"
20029-200290170 = "Здравствуйте, Сенсей."
20029-200290180 = "Доброе утро, Мимори."
20029-200290190 = "Сегодня прекрасная погода."
20029-200290200 = "Да, чудесная."
20029-200290210 = "И такой приятный ветерок."
20029-200290220 = "У меня хорошее предчувствие насчёт сегодняшнего дня."
20029-200290230 = "Потрясающего тебе дня!"
20029-200290240 = "Здравствуйте, Сенсей."
20029-200290250 = "Я хотела бы сегодня снова сходить с тобой на пляж."
20029-200290260 = "Это не проблема?"
20029-200290270 = "Да, мне бы понравилось."
20029-200290280 = "Тогда договорились."
20029-200290290 = "Я... так взволнована..."
20029-200290300 = "Сердце так быстро бьётся!"
20029-200290310 = "Хм. Тебе, наверное, стоит успокоиться..."
