[translation]
20029-200290010 = "Sensei,"
20029-200290020 = "já terminou de se arrumar para irmos à praia?"
20029-200290030 = "Hum, o que exatamente eu deveria levar...?"
20029-200290040 = "Hehe, não se preocupe."
20029-200290050 = "Eu já preparei tudo o que vamos precisar, então basta você vir com o coração preparado."
20029-200290060 = "Ah... e não se esqueça de trazer a sua própria roupa de banho, tá?"
20029-200290070 = "P-Pelo menos isso pode deixar que eu levo..."
20029-200290080 = "Hehe. Então nos encontramos na frente do meu quarto."
20029-200290090 = "Estarei esperando por você."
20029-200290100 = "O que achou do banho de sol, Sensei?"
20029-200290110 = "Que bom que ainda estou vivo..."
20029-200290120 = "Oi...? Hum, você está se sentindo bem?"
20029-200290130 = "Não se esqueça de beber bastante água antes de dormir, viu?"
20029-200290140 = "Graças a você, Mimori, já estou novinho em folha!"
20029-200290150 = "Hehe, fico muito aliviada em ouvir isso."
20029-200290160 = "Nos vemos mais tarde, então."
20029-200290170 = "Bom dia, Sensei."
20029-200290180 = "Bom dia, Mimori."
20029-200290190 = "O tempo está ótimo hoje de novo, né?"
20029-200290200 = "Sim, está fazendo um dia lindo mesmo."
20029-200290210 = "A brisa está bem suave e agradável também."
20029-200290220 = "Tenho a sensação de que hoje será um dia maravilhoso."
20029-200290230 = "Bom, vamos dar o nosso melhor hoje também!"
20029-200290240 = "Sensei."
20029-200290250 = "Hoje eu gostaria de passar um tempo com você na praia..."
20029-200290260 = "Você está livre?"
20029-200290270 = "Claro que estou."
20029-200290280 = "Então combinado, conto com você."
20029-200290290 = "...Estou tão ansiosa por isso."
20029-200290300 = "Meu coração está batendo tão forte..."
20029-200290310 = "V-Vamos com calma, tá...?"
