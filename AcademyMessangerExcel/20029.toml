[translation]
20029-200290010 = "Сенсей,"
20029-200290020 = "вы уже готовы к поездке на море?"
20029-200290030 = "Эм, а что мне нужно взять с собой..."
20029-200290040 = "Хе-хе, всё в порядке."
20029-200290050 = "Я всё подготовила, так что просто будьте готовы морально."
20029-200290060 = "Ах... и не забудьте взять свой купальник."
20029-200290070 = "Н-ну, это само собой..."
20029-200290080 = "Хе-хе. Тогда встретимся у моей комнаты."
20029-200290090 = "Буду ждать вас."
20029-200290100 = "Как вам понравился солнечный свет, Сенсей?"
20029-200290110 = "Жить хорошо..."
20029-200290120 = "Да...? Эм, вы в порядке?"
20029-200290130 = "Не забудьте выпить воды перед сном."
20029-200290140 = "Благодаря тебе, Мимори, я уже в порядке!"
20029-200290150 = "Хе-хе, как хорошо."
20029-200290160 = "Тогда до встречи позже."
20029-200290170 = "Доброе утро, Сенсей."
20029-200290180 = "Доброе утро, Мимори."
20029-200290190 = "Сегодня снова хорошая погода."
20029-200290200 = "Да, погода правда прекрасная."
20029-200290210 = "И ветерок спокойный, очень комфортно."
20029-200290220 = "Кажется, сегодня будет чудесный день."
20029-200290230 = "Тогда давайте постараемся!"
20029-200290240 = "Сенсей"
20029-200290250 = "Сегодня я хотела бы провести время с вами у моря..."
20029-200290260 = "У вас найдётся время?"
20029-200290270 = "Конечно."
20029-200290280 = "Тогда буду рада."
20029-200290290 = "...Я очень жду этого."
20029-200290300 = "У меня так колотится сердце..."
20029-200290310 = "Н-ну, давай немного спокойнее...?"