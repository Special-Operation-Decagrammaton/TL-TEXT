[translation]
10001-373 = "Сенсей, вам не кажется, что в последнее время стало гораздо жарче?"
10001-374 = "После операций так душно..."
10001-375 = "Правда? До лета ещё далеко..."
10001-376 = "Может, это потому, что ты старалась изо всех сил во время операции?"
10001-377 = "Может, я ошибаюсь...?"
10001-378 = "А, кстати, Сенсей"
10001-379 = "недавно я видела перед магазином мороженого"
10001-380 = "студентку из Тринити, которая ела мятно-шоколадное мороженое..."
10001-381 = "Интересно, помогает ли мороженое со вкусом зубной пасты регулировать температуру тела...?"
10001-382 = "Не понимаю людей, которым нравится мята с шоколадом..."
10001-383 = "Это не зубная паста! Извинись перед мятно-шоколадным!"
10001-384 = "Правда ведь?"
10001-385 = "Ах... Сенсей, вы на их стороне?"
10001-386 = "Всё-таки мир старшеклассниц глубок..."
10001-387 = "Сенсей, у меня в последнее время есть одна проблема..."
10001-388 = "Проблема? Связана с работой в Семинаре?"
10001-389 = "Нет. Это не связано, это сугубо личное."
10001-390 = "Я хочу, чтобы вы меня выслушали."
10001-391 = "Если я могу помочь, я всегда готов слушать."
10001-392 = "Хорошо, пожалуйста."
10001-393 = "...Спасибо, Сенсей."
10001-394 = "Сенсей, вы же раньше говорили, что поможете с опросом о том, что любят школьницы?"
10001-395 = "Да, вроде говорил..."
10001-396 = "Давайте проведём следующий опрос."
10001-397 = "Приходите в центр Кивотоса."
10001-398 = "Прямо сейчас?"
10001-399 = "Да, прямо сейчас."
10001-400 = "Я и не знала, что петь в закрытом помещении так весело..."
10001-401 = "Было такое же возбуждение, как когда стреляешь по врагам."
10001-402 = "...Может, было бы ещё веселее, если стрелять в караоке?"
10001-403 = "Это категорически нельзя!"
10001-404 = "Сенсей, сегодня я пойду покупать новую одежду."
10001-405 = "Надеюсь, найдёшь что-то красивое."
10001-406 = "Я хочу, чтобы вы посмотрели, идёт ли мне одежда..."
10001-407 = "Ты свободна сегодня после уроков?"
10001-408 = "А, да. Всё в порядке."
10001-409 = "Хорошо. Тогда встречаемся в торговом центре в центре Кивотоса."
10001-410 = "Операция завершена, миссия выполнена. Отдыхайте, Сенсей."
10001-411 = "Когда мы только разминулись, мне показалось, у вас из руки шла кровь, вы уже обработали рану?"
10001-412 = "Всё в порядке, просто небольшое оцарапал."
10001-413 = "Во время операции такие травмы — обычное дело."
10001-414 = "Так нельзя. Я обработаю рану, идём в медпункт."
10001-415 = "Но я же в порядке..."
10001-100010010 = "Сенсей, помогите немного."
10001-100010020 = "Возле руин обнаружили странный сигнал."
10001-100010030 = "Заодно и по работе Отдела расследования аномалий, хочу съездить в одно далёкое место."
10001-100010040 = "Будет жаркий день, но..."
10001-100010050 = "В этот раз всё в порядке, положитесь на меня."
10001-100010060 = "Ого, похоже, в этот раз ты уверена в себе."
10001-100010070 = "В этот раз ты подготовилась?"
10001-100010080 = "Ага."
10001-100010090 = "Я приготовилась к таким случаям."
10001-100010100 = "Ждите."
10001-100010110 = "Странно..."
10001-100010120 = "Я охлаждалась вентилятором, но почему-то Сэнсэю было жарко."
10001-100010130 = "Может, мощности не хватило? Или Сенсей тоже чувствителен к жаре?"
10001-100010140 = "Хм-м..."
10001-100010150 = "Наверное, лучше было прижаться поближе."
10001-100010160 = "Если бы я прильнула всем телом, результат мог бы быть другим."
10001-100010170 = "Как думаете?"
10001-100010180 = "Я думаю, проблема в другом..."
10001-100010190 = "Но всё равно, это был неплохой опыт."
10001-100010200 = "Хм-м..."
10001-100010210 = "? Это как понять?"
10001-100010220 = "Хм-м..."
10001-100010230 = "В общем, в следующий раз я придумаю и другие способы."
10001-100010240 = "Тогда до встречи, Сенсей."
