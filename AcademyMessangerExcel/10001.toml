[translation]
10001-373 = "Сенсей, вам не кажется, что в последнее время стало жарче?"
10001-374 = "После задания жара ощущается ещё сильнее..."
10001-375 = "Да? До лета ещё далеко."
10001-376 = "Может, ты просто слишком много работаешь!"
10001-377 = "Да? Может, дело и правда во мне..."
10001-378 = "А, точно. Сенсей."
10001-379 = "Я недавно видела девушек из Тринити,"
10001-380 = "которые брали мятно-шоколадное мороженое..."
10001-381 = "Думаете, мороженое со вкусом зубной пасты помогает им остыть?"
10001-382 = "Никогда не понимала, почему людям нравится мята."
10001-383 = "Как зубная паста? Эй, ты должна извиниться перед мятой!"
10001-384 = "Вот именно!"
10001-385 = "А? Чего вы так злитесь?"
10001-386 = "Мир старшеклассниц довольно сложен..."
10001-387 = "Сенсей, в последнее время у меня появилась проблема..."
10001-388 = "Проблема? Это связано с заданием Семинара?"
10001-389 = "Нет, к заданию это отношения не имеет. Это... личное."
10001-390 = "Я хотела бы поговорить с вами, Сенсей."
10001-391 = "Я всегда выслушаю, если захочешь поговорить."
10001-392 = "Я знала, что правильно сделала, обратившись к вам..."
10001-393 = "Спасибо, Сенсей."
10001-394 = "Сенсей, разве вы не говорили, что поможете мне понять, что нравится девушкам моего возраста?"
10001-395 = "Говорил, но..."
10001-396 = "Я провожу новое исследование."
10001-397 = "Пожалуйста, приходите в центр Кивотоса."
10001-398 = "Прямо сейчас?"
10001-399 = "Да, прямо сейчас."
10001-400 = "Петь в закрытом помещении неожиданно весело..."
10001-401 = "Я чувствую странный подъём, почти как когда стреляю по врагу."
10001-402 = "...А если делать и то и другое одновременно? Будет ещё веселее?"
10001-403 = "Так нельзя!"
10001-404 = "Сенсей. Сегодня я иду в бутик покупать новую одежду."
10001-405 = "Надеюсь, найдёшь что-нибудь красивое."
10001-406 = "Я хотела бы, чтобы вы пошли со мной и сказали, что мне идёт..."
10001-407 = "У вас есть время сегодня после уроков?"
10001-408 = "Да. Есть."
10001-409 = "Отлично! Тогда увидимся в торговом центре в центре Кивотоса."
10001-410 = "Миссия выполнена. Отличная работа, Сенсей."
10001-411 = "Я заметила, что у вас раньше шла кровь из руки. Вам нужна помощь?"
10001-412 = "Всё нормально. Просто царапина."
10001-413 = "Такие царапины на заданиях - обычное дело."
10001-414 = "Это нехорошо. Идите в медпункт, я продезинфицирую рану."
10001-415 = "Я в порядке. Правда..."
10001-100010010 = "Сенсей, запрашиваю вашу поддержку."
10001-100010020 = "Наше оборудование возле руин обнаружило ещё одну аномальную реакцию."
10001-100010030 = "В рамках обязанностей члена Отряда по исследованию сверхъестественных явлений мне придётся отправиться довольно далеко для расследования."
10001-100010040 = "По прогнозу будет немного жарко, но..."
10001-100010050 = "На этот раз проблем не предвижу."
10001-100010060 = "Ого, ты так уверена."
10001-100010070 = "На этот раз у тебя хороший план?"
10001-100010080 = "Да."
10001-100010090 = "Я подозревала, что этот день настанет, поэтому позаботилась о тщательной подготовке."
10001-100010100 = "Ждите с нетерпением."
10001-100010110 = "Я заметила кое-что странное."
10001-100010120 = "Почему-то после того, как вы воспользовались вентилятором, вам стало ещё жарче."
10001-100010130 = "Ему не хватало мощности? Или у вас от природы много тепла, как у меня?"
10001-100010140 = "Хм."
10001-100010150 = "Может, чтобы почувствовать эффект, его нужно было поднести ближе."
10001-100010160 = "Результат мог бы быть другим при полном телесном контакте."
10001-100010170 = "Ну как тебе?"
10001-100010180 = "Не думаю, что это решило бы проблему..."
10001-100010190 = "Но опыт был неплохой."
10001-100010200 = "Эм..."
10001-100010210 = "Не совсем понимаю, о чём ты."
10001-100010220 = "Хм."
10001-100010230 = "В любом случае в следующий раз я подготовлю запасной план."
10001-100010240 = "До тех пор, Сенсей."
