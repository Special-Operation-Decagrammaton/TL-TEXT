[translation]
10001-373 = "Sensei, você não acha que esquentou bastante ultimamente?"
10001-374 = "Depois que termino uma operação, fica um abafado horrível..."
10001-375 = "Acha? O verão ainda tá bem longe..."
10001-376 = "Não é porque você se esforçou pra valer durante a operação?"
10001-377 = "Será? Impressão minha...?"
10001-378 = "Ah, por falar nisso, Sensei..."
10001-379 = "Agorinha mesmo, na frente da sorveteria,"
10001-380 = "eu vi uma aluna da Trinity tomando sorvete de chocomenta..."
10001-381 = "Será que sorvete com gosto de pasta de dente ajuda a regular a temperatura do corpo...?"
10001-382 = "Não consigo entender a cabeça de quem gosta de sabor chocomenta..."
10001-383 = "Não tem gosto de pasta de dente coisa nenhuma! Peça desculpas ao chocomenta!"
10001-384 = "Pois é, né?"
10001-385 = "Ah... Sensei, você é daquele time?"
10001-386 = "Realmente, o universo das colegiais é profundo..."
10001-387 = "Sensei, ultimamente tenho tido uma preocupação..."
10001-388 = "Uma preocupação? Tem a ver com o trabalho do Seminário?"
10001-389 = "Não. Não tem nada a ver com isso, é uma coisa bem pessoal..."
10001-390 = "Mas eu queria que você me ouvisse, Sensei."
10001-391 = "Se eu puder ajudar, te escuto a qualquer hora."
10001-392 = "Sim, por favor."
10001-393 = "...Obrigada, Sensei."
10001-394 = "Sensei, outro dia você disse que ia me ajudar na pesquisa sobre o que as garotas gostam, lembra?"
10001-395 = "É, bem que eu disse mesmo..."
10001-396 = "Vamos fazer a próxima pesquisa."
10001-397 = "Quero que você venha até o centro de Kivotos."
10001-398 = "Agora?"
10001-399 = "Sim, agora."
10001-400 = "Quem diria que cantar num espaço fechado seria tão divertido..."
10001-401 = "Deu uma euforia parecida com a de metralhar inimigos sem parar."
10001-402 = "...Pensando bem, será que atirar dentro do karaokê não seria mais divertido ainda?"
10001-403 = "Isso aí nem pensar!"
10001-404 = "Sensei, hoje vou sair para comprar roupas novas."
10001-405 = "Tomara que você encontre roupas bem bonitas."
10001-406 = "Eu queria que você visse se as roupas combinam comigo, Sensei..."
10001-407 = "Você tá livre hoje depois da aula?"
10001-408 = "Ah, sim. Tudo tranquilo."
10001-409 = "Que bom. Então nos encontramos no shopping do centro de Kivotos."
10001-410 = "Operação encerrada, missão cumprida. Bom trabalho, Sensei."
10001-411 = "Quando cruzamos agora há pouco, tive a impressão de que seu braço tava sangrando. Já fez um curativo?"
10001-412 = "Tá tudo bem, foi só um arranhãozinho."
10001-413 = "Durante uma operação, um machucado desse tamanho é super normal."
10001-414 = "Nada disso. Vou desinfetar isso aí, então venha já pra enfermaria."
10001-415 = "Mas eu tô bem..."
10001-100010010 = "Sensei, me dá uma mãozinha aqui."
10001-100010020 = "Encontraram um sinal misterioso perto das ruínas."
10001-100010030 = "Aproveitando o trabalho da Força-Tarefa de Fenômenos Paranormais, tô pensando em ir investigar num lugar meio distante."
10001-100010040 = "Acho que vai fazer bastante calor hoje..."
10001-100010050 = "Desta vez tá tudo certo, deixa comigo."
10001-100010060 = "Opa, parece que desta vez você tá confiante."
10001-100010070 = "Tomou alguma medida contra o calor desta vez?"
10001-100010080 = "Sim."
10001-100010090 = "Já deixei tudo preparado exatamente para uma ocasião dessas."
10001-100010100 = "Pode esperar pra ver."
10001-100010110 = "Que estranho..."
10001-100010120 = "Mesmo a gente se refrescando com o ventilador, você parecia estar com tanto calor, Sensei."
10001-100010130 = "Será que faltou potência? Ou você também sente muito calor, Sensei?"
10001-100010140 = "Humm..."
10001-100010150 = "Acho que no fim das contas a gente devia ter ficado ainda mais coladinho."
10001-100010160 = "Se a gente tivesse encostado o corpo inteiro, talvez o resultado fosse diferente."
10001-100010170 = "O que você acha?"
10001-100010180 = "Acho que o problema era outro..."
10001-100010190 = "Mas, ainda assim, não foi uma experiência ruim, não."
10001-100010200 = "Humm."
10001-100010210 = "? Como assim?"
10001-100010220 = "Humm..."
10001-100010230 = "Bom, na próxima vez vou pensar em outras medidas também."
10001-100010240 = "Até mais, Sensei."
