[translation]
20039-200390010 = "Sensei, estás aí?"
20039-200390020 = "Sim, estou aqui"
20039-200390030 = "Hum, esplêndido"
20039-200390040 = "Quero que me escutes com atenção..."
20039-200390050 = "Ou melhor, que leias com atenção"
20039-200390060 = "Neste exato momento, na Genryumon..."
20039-200390070 = "Aliás, com a líder da Genryumon,"
20039-200390080 = "está ocorrendo um incidente sem precedentes"
20039-200390090 = "Como assim?!"
20039-200390100 = "É uma situação urgente, onde cada segundo importa"
20039-200390110 = "Evidentemente, trata-se também de um assunto confidencial"
20039-200390120 = "Se és de fato um educador que corresponde às expectativas de tuas alunas,"
20039-200390130 = "não reveles isto a ninguém..."
20039-200390140 = "E vem imediatamente para Shanhaijing"
20039-200390150 = "O que achaste da experiência de trabalho na Genryumon, Sensei?"
20039-200390160 = "Eu achei que você... é incrível, Kisaki"
20039-200390170 = "Fufu. Ao menos em Shanhaijing,"
20039-200390180 = "tumultos que passem demais dos limites não costumam ocorrer"
20039-200390190 = "Embora, claro, impedir que ocorram seja igualmente essencial"
20039-200390200 = "Entendo, faz todo sentido."
20039-200390210 = "Hum"
20039-200390220 = "Pois bem"
20039-200390230 = "Da próxima vez, serei eu a visitar a Schale"
20039-200390240 = "Fufu, podes aguardar com expectativa"
20039-200390250 = "Pois bem. Como havíamos conversado antes,"
20039-200390260 = "pretendo visitar a Schale hoje como encarregada do dia"
20039-200390270 = "Claro, pode vir quando quiser"
20039-200390280 = "Hum"
20039-200390290 = "Uma resposta deveras tranquilizadora"
20039-200390300 = "Vemo-nos mais tarde, então"
20039-200390310 = "Como está a tua disposição, Sensei?"
20039-200390320 = "Estou bem melhor, mas..."
20039-200390330 = "Hoje você veio mesmo para a Schale, né, Kisaki?"
20039-200390340 = "Hum"
20039-200390350 = "Compreendo..."
20039-200390360 = "..."
20039-200390370 = "Fufu"
20039-200390380 = "E o que farias se eu respondesse que tampouco sei dizer ao certo?"
20039-200390390 = "Hã?! Como assim...?!"
20039-200390400 = "O sonho da borboleta... como dizem"
20039-200390410 = "Não achas um conto deveras fascinante?"
20039-200390420 = "Bom, deixando isso de lado,"
20039-200390430 = "registrei muito bem em foto o teu rosto enquanto dormias, Sensei"
20039-200390440 = "Q-Quando foi que você tirou isso?!"
20039-200390450 = "Sinto que, pouco a pouco,"
20039-200390460 = "estou me habituando aos turnos na Schale... O que achas?"
20039-200390470 = "Você está tirando de letra, impecável"
20039-200390480 = "Será mesmo...?"
20039-200390490 = "Os membros da Genryumon"
20039-200390500 = "parecem ficar mais preocupados comigo a cada dia que passa"
20039-200390510 = "Hum... Pois bem"
20039-200390520 = "Farei uma visita à Schale hoje também"
20039-200390530 = "Ué? Hoje também é seu dia de plantão?"
20039-200390540 = "Fufu"
20039-200390550 = "Não te preocupes com ninharias"
20039-200390560 = "Será que isso é mesmo uma ninharia?!"
20039-200390570 = "Uma das virtudes da líder da Genryumon"
20039-200390580 = "é honrar suas promessas"
20039-200390590 = "Cumprir promessas é muito importante mesmo"
20039-200390600 = "E há outra virtude:"
20039-200390610 = "aquilo que foi prometido,"
20039-200390620 = "fazer com que seja cumprido, custe o que custar"
20039-200390630 = "Custe o que custar?!"
20039-200390640 = "É apenas uma brincadeira"
20039-200390650 = "Contudo, Sensei,"
20039-200390660 = "eu me lembro muito bem"
20039-200390670 = "daquela promessa de irmos conhecer vários lugares juntos"
20039-200390680 = "Jamais ouses esquecer a promessa que fizeste a mim, ouviste?"
20039-200390690 = "É que, por pura curiosidade..."
20039-200390700 = "O que acontece... se eu não cumprir a promessa?"
20039-200390710 = "..."
20039-200390720 = "Ora, nada de tão grave acontecerá"
20039-200390730 = "Apenas..."
20039-200390740 = "em nome da Genryumon, farei com que pagues um preço à altura"
20039-200390750 = "Eu vou cumprir com toda certeza..."
20039-200390760 = "Sensei"
20039-200390770 = "Estás aí?"
20039-200390780 = "Sim, estou aqui. Como está passando?"
20039-200390790 = "Ah, não precisas te preocupar"
20039-200390800 = "...Embora eu tenha levado um pequeno sermão da Sociedade de Estudo de Alquimia"
20039-200390810 = "Mas foi só isso. Permita-me agradecer por teres me acompanhado até Shanhaijing"
20039-200390820 = "Imagina, não foi nada"
20039-200390830 = "Hum"
20039-200390840 = "Como forma de retribuição, se assim posso chamar,"
20039-200390850 = "gostaria de demonstrar minha gratidão adequadamente"
20039-200390860 = "..."
20039-200390870 = "Ainda que eu duvide se isto pode mesmo ser chamado de retribuição..."
20039-200390880 = "Aconteceu alguma coisa?"
20039-200390890 = "..."
20039-200390900 = "Bem..."
20039-200390910 = "Em suma,"
20039-200390920 = "..."
20039-200390930 = "é isto aqui"
20039-200390950 = "?!?!"
20039-200390960 = "Isto é...! Não me diga que...?!"
20039-200390970 = "Tirei agora há pouco, mas..."
20039-200390980 = "Muito obrigado! Vou guardar como relíquia de família!"
20039-200390990 = "Compreendo"
20039-200391000 = "..."
20039-200391010 = "Se isso te deixou feliz, é o que importa"
20039-200391020 = "E, bem... mantenha isso em segredo dos outros"
