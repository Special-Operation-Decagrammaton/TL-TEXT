[translation]
20039-200390010 = "Сенсей, вы здесь?"
20039-200390020 = "Да, я здесь."
20039-200390030 = "Хм, это отрадно."
20039-200390040 = "Я хочу, чтобы вы внимательно выслушали..."
20039-200390050 = "Нет, прочитали."
20039-200390060 = "Сейчас в Генрюмоне,"
20039-200390070 = "вернее, с главой Генрюмона,"
20039-200390080 = "произошло беспрецедентное событие."
20039-200390090 = "Что случилось!?"
20039-200390100 = "Это вопрос времени."
20039-200390110 = "Разумеется, это касается и секретности."
20039-200390120 = "Если вы, как наставник, оправдываете ожидания студентов,"
20039-200390130 = "то никому не говорите..."
20039-200390140 = "и приезжайте в Шанхайцзин прямо сейчас."
20039-200390150 = "Как тебе опыт работы в Генрюмоне, Сенсей?"
20039-200390160 = "Кисаки... я думал, ты удивительная."
20039-200390170 = "Хе-хе. По крайней мере, в Шанхайцзине"
20039-200390180 = "не бывает слишком уж громких скандалов."
20039-200390190 = "Хотя, конечно, важно и не допускать их,"
20039-200390200 = "Понятно."
20039-200390210 = "Хм"
20039-200390220 = "Ну что ж"
20039-200390230 = "В следующий раз я навещу Шале."
20039-200390240 = "Хе-хе, ждите с нетерпением."
20039-200390250 = "Итак. Как мы и говорили ранее,"
20039-200390260 = "сегодня я планирую навестить Шале в качестве «дежурной»."
20039-200390270 = "Да, приходи в любое время."
20039-200390280 = "Хм"
20039-200390290 = "Обнадёживающий ответ."
20039-200390300 = "Тогда до встречи позже."
20039-200390310 = "Как твоё самочувствие, Сенсей?"
20039-200390320 = "Мне уже гораздо лучше, но..."
20039-200390330 = "Ты ведь сегодня была в Шале, Кисаки?"
20039-200390340 = "Хм"
20039-200390350 = "Вот как..."
20039-200390360 = "..."
20039-200390370 = "Хе-хе"
20039-200390380 = "А что бы ты сделала, если бы я сказала, что тоже ничего не помню?"
20039-200390390 = "Что, что ты имеешь в виду...!?"
20039-200390400 = "Как говорится, «сон бабочки»..."
20039-200390410 = "Разве это не интересно?"
20039-200390420 = "Но шутки в сторону."
20039-200390430 = "Я сфотографировала твоё спящее лицо."
20039-200390440 = "К-когда ты успела!?"
20039-200390450 = "Я думаю, я уже понемногу привыкаю"
20039-200390460 = "быть дежурной в Шале... Как тебе?"
20039-200390470 = "Ты прекрасно справляешься."
20039-200390480 = "Вот как..."
20039-200390490 = "Однако члены Генрюмона"
20039-200390500 = "с каждым днём всё больше за меня беспокоятся."
20039-200390510 = "Хм... ну да ладно."
20039-200390520 = "Сегодня я снова навещу Шале."
20039-200390530 = "А? А сегодня ведь дежурство?"
20039-200390540 = "Хе-хе"
20039-200390550 = "Не стоит зацикливаться на мелочах."
20039-200390560 = "Разве это мелочи!?"
20039-200390570 = "Одна из добродетелей главы Генрюмона"
20039-200390580 = "— это держать слово."
20039-200390590 = "Да, держать слово важно."
20039-200390600 = "А вторая —"
20039-200390610 = "заставлять других держать слово"
20039-200390620 = "любыми средствами."
20039-200390630 = "Любыми средствами!?"
20039-200390640 = "Шучу."
20039-200390650 = "Но, Сенсей,"
20039-200390660 = "я помню."
20039-200390670 = "То обещание — пойти вместе посмотреть на разные места."
20039-200390680 = "Только не забудь о своём обещании мне, хорошо?"
20039-200390690 = "Мне просто интересно..."
20039-200390700 = "А что случится, если я не сдержу слово?"
20039-200390710 = "..."
20039-200390720 = "Ну, ничего страшного не случится."
20039-200390730 = "Просто..."
20039-200390740 = "от имени Генрюмона я попрошу тебя заплатить соответствующую цену."
20039-200390750 = "Я обязательно сдержу слово..."
20039-200390760 = "Сенсей"
20039-200390770 = "Ты здесь?"
20039-200390780 = "Да, я здесь. Как ты себя чувствуешь?"
20039-200390790 = "Ах, не волнуйся."
20039-200390800 = "...Хотя кружок алхимии немного пожурил меня."
20039-200390810 = "Но это мелочи. Спасибо, что проводил меня до Шанхайцзина."
20039-200390820 = "Не за что."
20039-200390830 = "Хм"
20039-200390840 = "Я хочу отблагодарить тебя по-настоящему,"
20039-200390850 = "скажем так, в качестве благодарности."
20039-200390860 = "..."
20039-200390870 = "Сомневаюсь, что это можно назвать благодарностью, но..."
20039-200390880 = "Что-то случилось?"
20039-200390890 = "..."
20039-200390900 = "Ну"
20039-200390910 = "то есть"
20039-200390920 = "..."
20039-200390930 = "Вот так."
20039-200390950 = "!?!?"
20039-200390960 = "Это...! Неужели!?"
20039-200390970 = "Я сделала это только что."
20039-200390980 = "Большое спасибо! Я буду хранить это как реликвию!"
20039-200390990 = "Вот как"
20039-200391000 = "..."
20039-200391010 = "Рада, что ты доволен."
20039-200391020 = "Только... никому не говори, ладно?"