[translation]
20039-200390010 = "Вы там, Сенсей?"
20039-200390020 = "Да. Я здесь!"
20039-200390030 = "Мм."
20039-200390040 = "Буду признательна, если вы внимательно выслушаете"
20039-200390050 = "...то есть, прочитаете моё сообщение."
20039-200390060 = "Прямо сейчас происходит нечто небывалое"
20039-200390070 = "в Генрюмон."
20039-200390080 = "А точнее — со мной, президентом Генрюмон."
20039-200390090 = "Так внезапно?!"
20039-200390100 = "Время не ждёт."
20039-200390110 = "И требуется абсолютная конфиденциальность."
20039-200390120 = "Я верю, что вы — педагог, который никогда не подведёт своего студента"
20039-200390130 = "Я прошу сохранить всё в строжайшей тайне"
20039-200390140 = "и немедленно прибыть в Шаньхайцзин."
20039-200390150 = "Как вам работалось с Генрюмон, Сенсей?"
20039-200390160 = "Я почувствовал, что... ты очень впечатляющая, Кисаки."
20039-200390170 = "Что ж. Ничего слишком радикального или ужасного"
20039-200390180 = "в Шаньхайцзине обычно не происходит."
20039-200390190 = "И чтобы так оставалось, приходится трудиться."
20039-200390200 = "Почему-то кажется, что за этими словами скрывается ещё один смысл."
20039-200390210 = "Хм?"
20039-200390220 = "Не совсем понимаю, о чём ты."
20039-200390230 = "В следующий раз я сама отправлюсь в Шале."
20039-200390240 = "Фуфу. До следующей встречи, Сенсей."
20039-200390250 = "Как я уже сообщала вам,"
20039-200390260 = "сегодня я буду работать представительницей учеников в Шале."
20039-200390270 = "Тебе здесь всегда рады."
20039-200390280 = "Мм."
20039-200390290 = "Рада, что вы так считаете."
20039-200390300 = "Тогда я вскоре отправлюсь в Шале."
20039-200390310 = "Как вы себя чувствуете, Сенсей?"
20039-200390320 = "Нормально, но..."
20039-200390330 = "Ты ведь сегодня была в Шале?"
20039-200390340 = "Хм?"
20039-200390350 = "А. Понятно."
20039-200390360 = "..."
20039-200390370 = "Фу-фу."
20039-200390380 = "И как вы отреагируете, если я заявлю, что сама не знаю?"
20039-200390390 = "Разве это не проблема?!"
20039-200390400 = "Бабочка — это я? Или я — бабочка?"
20039-200390410 = "Вопрос тайны и бренности."
20039-200390420 = "С определённой точки зрения это тоже может быть хорошо."
20039-200390430 = "А в итоге фотография Сенсея останется в моём телефоне."
20039-200390440 = "Удали! Пожалуйста!"
20039-200390450 = "Похоже,"
20039-200390460 = "я постепенно привыкаю к обязанностям представительницы."
20039-200390470 = "По-моему, ты уже давно привыкла."
20039-200390480 = "Вот как?"
20039-200390490 = "Напротив, дела Генрюмон"
20039-200390500 = "с каждым днём только множатся."
20039-200390510 = "Так что в ваших словах определённо есть смысл."
20039-200390520 = "Поэтому сегодня я снова навещу Шале."
20039-200390530 = "Я не понимаю твою логику!"
20039-200390540 = "Вы разве не знаете, Сенсей?"
20039-200390550 = "Порой логика — фактор, которым можно пренебречь."
20039-200390560 = "Теперь я запутался ещё сильнее!"
20039-200390570 = "Как президент Генрюмон, я всегда должна"
20039-200390580 = "держать свои обещания."
20039-200390590 = "Верно. Обещания важны."
20039-200390600 = "И ещё один важный принцип —"
20039-200390610 = "никогда не забывать обещание, данное мне,"
20039-200390620 = "и взыскивать долги."
20039-200390630 = "Правда?!"
20039-200390640 = "Шучу, Сенсей."
20039-200390650 = "Однако."
20039-200390660 = "Я очень хорошо помню ваше обещание"
20039-200390670 = "вместе посетить разные места."
20039-200390680 = "Надеюсь, вы его не забыли."
20039-200390690 = "Просто из любопытства..."
20039-200390700 = "Что будет, если забуду?"
20039-200390710 = "..."
20039-200390720 = "Полагаю, последствия будут незначительными."
20039-200390730 = "Всего лишь"
20039-200390740 = "вам придётся вернуть долг — по правилам Генрюмон."
20039-200390750 = "Точно не забуду!"
20039-200390760 = "Мм."
20039-200390770 = "Вы там, Сенсей?"
20039-200390780 = "Вы хорошо себя чувствуете?"
20039-200390790 = "Ага! Никаких проблем."
20039-200390800 = "...В Обществе восточной алхимии сейчас небольшая суматоха."
20039-200390810 = "Но я хотела поблагодарить вас за то, что проводили меня обратно в Шаньхайцзин."
20039-200390820 = "Не за что."
20039-200390830 = "Мм."
20039-200390840 = "Наверное, в ответ,"
20039-200390850 = "чтобы... вернуть долг"
20039-200390860 = "Хм..."
20039-200390870 = "Я бы всё же не стал описывать ситуацию именно так..."
20039-200390880 = "? О чём мы говорим?"
20039-200390890 = "..."
20039-200390900 = "Ну..."
20039-200390910 = "Видите ли."
20039-200390920 = "..."
20039-200390930 = "Это..."
20039-200390950 = "?!?!"
20039-200390960 = "Это...! Это?!"
20039-200390970 = "Я снял это раньше."
20039-200390980 = "Я буду хранить это вечно!"
20039-200390990 = "Понятно."
20039-200391000 = "..."
20039-200391010 = "Как пожелаете."
20039-200391020 = "Но прошу, пусть это останется только между нами."
