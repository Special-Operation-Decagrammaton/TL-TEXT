[translation]
10081-100810010 = "Sensei! Desejo-lhe um excelente dia!"
10081-100810020 = "Bom dia, vejo que está animada hoje também."
10081-100810030 = "Sim! Manter o corpo e a mente sãos é o maior orgulho desta que vos fala. Heheh!"
10081-100810040 = "Contudo, ultimamente... só tenho conseguido me soltar e sorrir assim na sua presença, Sensei..."
10081-100810050 = "Aconteceu alguma coisa?"
10081-100810060 = "Hum... É que as exigências lá em casa ficaram ainda mais rigorosas..."
10081-100810070 = "Meus dias têm sido inteiramente tomados por aulas de etiqueta e estudos dignos de uma integrante da família Kadenokouji..."
10081-100810080 = "Estudando sem parar dia após dia desse jeito..."
10081-100810090 = "No futuro, acabarei me tornando um demônio dos cálculos que maneja o ábaco com a mão esquerda e a calculadora com a direita!"
10081-100810100 = "Nunca ouvi falar de um demônio desses?!"
10081-100810110 = "Tirar um tempinho para respirar fundo também é importante."
10081-100810120 = "Respirar... fundo?"
10081-100810130 = "Dar uma pausa para respirar em um lugar tranquilo... Entendo, huum."
10081-100810140 = "Compreendi perfeitamente!"
10081-100810150 = "Sendo assim, aceitarei de bom grado a sua gentil sugestão, Sensei... e irei fazer uma visita agora mesmo!"
10081-100810160 = "Hã? Agora mesmo...?"
10081-100810170 = "Sim, agora mesmo!"
10081-100810180 = "Outro dia, enquanto eu saboreava uma \"sobremesa\" após a refeição..."
10081-100810190 = "Tive uma ideia simplesmente brilhante!"
10081-100810200 = "Que ideia você teve?"
10081-100810210 = "Doces tradicionais, \"mont blanc\", \"pudim\" e tantos outros..."
10081-100810220 = "Todas as \"sobremesas\" são doces, não é mesmo?!"
10081-100810230 = "Porém, refletindo melhor sobre o assunto..."
10081-100810240 = "Cheguei à conclusão de que sabores salgados também cairiam muito bem!"
10081-100810250 = "Portanto, se criarmos uma \"sobremesa\" salgada, todos poderão apreciá-la sem enjoar...!"
10081-100810260 = "Na verdade... já existem quitutes e biscoitos salgados."
10081-100810270 = "...Hã?"
10081-100810280 = "Sensei, perdoe-me pelo contato repentino, mas..."
10081-100810290 = "Hoje, mais uma vez,"
10081-100810300 = "gostaria muito que você me ensinasse coisas novas, Sensei!"
10081-100810310 = "Claro! Estarei te esperando aqui na Schale, então."
10081-100810320 = "Sim! Estou indo para aí imediatamente!"
10081-100810330 = "Sensei, trago \"big news\"!"
10081-100810340 = "Ouvi dizer que hoje haverá um \"sorteio premiado\" no Sétimo Distrito Comercial de Hyakkiyako!"
10081-100810350 = "Aqueles sorteios clássicos de rua comercial, né?"
10081-100810360 = "Dizem que entre os prêmios há até ingressos para um \"resort\" do Colégio Marítimo Odyssey!"
10081-100810370 = "Nossa, tem prêmios chiques assim também?"
10081-100810380 = "Sim!"
10081-100810390 = "E, hum, sendo assim..."
10081-100810400 = "Sim, vamos lá juntos?"
10081-100810410 = "Sim! Estarei aguardando no nosso lugar de sempre!"
