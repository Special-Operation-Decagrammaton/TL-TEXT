[translation]
10081-100810010 = "Сенсей! Здравствуйте!"
10081-100810020 = "Доброе утро, ты сегодня бодра."
10081-100810030 = "Да! Быть здоровой душой и телом — моя гордость. Хе-хе!"
10081-100810040 = "Но в последнее время... я могу так радоваться только перед вами, Сенсей..."
10081-100810050 = "Что-то случилось?"
10081-100810060 = "Ну... дома стали строже следить за мной..."
10081-100810070 = "Каждый день я получаю наставления по этикету и учёбе, достойные рода Каденокоджи..."
10081-100810080 = "И если так каждый день только учиться..."
10081-100810090 = "В будущем я стану монстром счёта, который левой рукой стучит на счётах, а правой — на калькуляторе!"
10081-100810100 = "О таком монстре я не слышал!?"
10081-100810110 = "Иногда важно и передохнуть."
10081-100810120 = "Передохнуть?"
10081-100810130 = "Передохнуть в месте, где можно отдохнуть... Понятно, хм."
10081-100810140 = "Я поняла!"
10081-100810150 = "Тогда позвольте воспользоваться вашими словами... Я зайду прямо сейчас!"
10081-100810160 = "Что? Прямо сейчас...?"
10081-100810170 = "Да, прямо сейчас!"
10081-100810180 = "На днях, когда я ела десерт после еды..."
10081-100810190 = "Мне пришла в голову гениальная идея!"
10081-100810200 = "Какая же?"
10081-100810210 = "Вагаси, монблан, пудинг и всё такое..."
10081-100810220 = "Десерты все сладкие!"
10081-100810230 = "Но если подумать..."
10081-100810240 = "Я поняла, что солёные тоже подойдут!"
10081-100810250 = "И если сделать солёный десерт, то всем будет не скучно его есть...!"
10081-100810260 = "На самом деле... солёные сладости тоже существуют."
10081-100810270 = "...Что?"
10081-100810280 = "Сенсей, прошу прощения за неожиданный звонок, но..."
10081-100810290 = "Сегодня опять!"
10081-100810300 = "Я хочу, чтобы вы научили меня чему-то новому!"
10081-100810310 = "Конечно! Тогда жду в Шале."
10081-100810320 = "Да! Я сразу приду!"
10081-100810330 = "Сенсей, большие новости!"
10081-100810340 = "Я слышала, что сегодня на Седьмой торговой улице Хяккияко будет лотерея!"
10081-100810350 = "Да, такие часто проводят в торговых рядах."
10081-100810360 = "Говорят, среди призов есть даже пригласительные билеты на курорт морской академии «Одиссея»."
10081-100810370 = "Вот это да, такие роскошные призы."
10081-100810380 = "Да!"
10081-100810390 = "И вот, э-э..."
10081-100810400 = "Да, пойдём вместе."
10081-100810410 = "Да! Буду ждать вас на обычном месте!"