[translation]
10081-100810010 = "Сенсей! Привет-привет!"
10081-100810020 = "Привет, Юкари. Ты, как всегда, полна энергии."
10081-100810030 = "Ага! Я считаю свою безграничную энергию одним из лучших качеств!"
10081-100810040 = "Но... такой я могу быть только рядом с тобой."
10081-100810050 = "Почему?"
10081-100810060 = "Просто... дома в последнее время довольно напряжённо."
10081-100810070 = "Я должна соответствовать имени Кадэнокодзи и учиться ещё усерднее."
10081-100810080 = "Но я уже не знаю, насколько ещё сильнее могу стараться..."
10081-100810090 = "Такими темпами я умру и воскресну призраком-ботаником, обречённым вечно таскать с собой соробан и калькулятор!"
10081-100810100 = "Как ты вообще до такого додумалась?!"
10081-100810110 = "В любом случае, время от времени важно переводить дух."
10081-100810120 = "Переводить дух?"
10081-100810130 = "Перевести... дух... Хм, точно."
10081-100810140 = "Теперь я поняла!"
10081-100810150 = "Последую твоему совету! Уже иду к тебе!"
10081-100810160 = "А? П-прямо сейчас?"
10081-100810170 = "Да!"
10081-100810180 = "Недавно я ела небольшой перекус после еды,"
10081-100810190 = "и мне пришла потрясающая идея!"
10081-100810200 = "Правда? И какая?"
10081-100810210 = "Итак. Большинство сладостей сладкие, верно?"
10081-100810220 = "Например, вагаси, Монблан или пудинг!"
10081-100810230 = "Но когда я хорошенько об этом подумала..."
10081-100810240 = "мне пришла потрясающая идея! Солёные закуски!"
10081-100810250 = "Нам нужно больше разнообразия в индустрии закусок!"
10081-100810260 = "На рынке и так полно солёных закусок..."
10081-100810270 = "...А?"
10081-100810280 = "Сенсей, я знаю, что прошу многого, но..."
10081-100810290 = "давай не сбавлять темп!"
10081-100810300 = "Я хочу научиться у тебя ещё большему, Сенсей!"
10081-100810310 = "Я в Шале, когда понадоблюсь."
10081-100810320 = "Ладушки! Я уже иду!"
10081-100810330 = "Сенсей, у меня ОГРОМНЫЕ новости!"
10081-100810340 = "Я слышала, сегодня в Торговом районе № 7 Хяккияко проходит специальное событие — лотерея!"
10081-100810350 = "О, там часто проводят лотереи."
10081-100810360 = "And they're raffling away an invitation to the Odyssey Maritime Academy resort!"
10081-100810370 = "Отличный приз."
10081-100810380 = "Так чего же мы ждём?!"
10081-100810390 = "Сенсей!"
10081-100810400 = "Хочешь сходить?"
10081-100810410 = "Да! Встречаемся на обычном месте!"
