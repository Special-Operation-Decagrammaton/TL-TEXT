[translation]
26012-260120010 = "Olá, Sensei."
26012-260120020 = "Por favor, será que você poderia prestar auxílio a esta oficial...?"
26012-260120030 = "Claro que sim."
26012-260120040 = "Na verdade, esta oficial recebeu a missão de atuar como salva-vidas."
26012-260120050 = "Como uma policial que protege a segurança dos cidadãos, é uma grande honra, mas..."
26012-260120060 = "Hum..."
26012-260120070 = "Eu não tenho experiência em resgate aquático,"
26012-260120080 = "e só descobri ontem que é necessário passar por um treinamento especial..."
26012-260120090 = "Que situação complicada..."
26012-260120100 = "Acha que vai dar tempo de treinar?"
26012-260120110 = "É exatamente sobre isso que eu gostaria de falar..."
26012-260120120 = "Quero pedir que me acompanhe no treinamento!"
26012-260120130 = "Sensei, olá."
26012-260120140 = "Refleti bastante depois daquilo, mas..."
26012-260120150 = "Realmente, mesmo começando a treinar agora, não vai dar tempo."
26012-260120160 = "Em um ou dois dias é difícil mesmo..."
26012-260120170 = "Por isso, esta oficial decidiu se dedicar exclusivamente aos primeiros socorros!"
26012-260120180 = "Para aumentar nem que seja um pouco a taxa de sobrevivência das vítimas de afogamento!"
26012-260120190 = "Mudou de estratégia, hein?"
26012-260120200 = "De fato, essa parte também é fundamental."
26012-260120210 = "Sim! Se estiver tudo bem para você, Sensei, poderia me acompanhar no treinamento desta vez também?"
26012-260120220 = "Fique tranquilo, pois não cometerei o mesmo erro da vez passada!"
26012-260120230 = "...Sensei, por acaso você leu o manual?"
26012-260120240 = "Sim, eu li."
26012-260120250 = "Se eu me afogar, você vai me salvar, né, Kirino?"
26012-260120260 = "M-mas..."
26012-260120270 = "Mas é claro!"
26012-260120280 = "Esta oficial é uma policial que sabe separar a vida pessoal do dever profissional!"
26012-260120290 = "Eu estava falando do desfibrilador..."
26012-260120300 = "N-não fique provocando esta oficial, por favor!"
26012-260120310 = "Sensei! Olá, aqui é a Kirino!"
26012-260120320 = "Graças a você, concluí o treinamento de salva-vidas, Sensei!"
26012-260120330 = "Parabéns, Kirino!"
26012-260120340 = "Tudo isso graças à sua cooperação, Sensei!"
26012-260120350 = "Estou pensando em fazer uma última revisão do treinamento. Poderia me acompanhar mais uma vez?"
26012-260120360 = "Claro que vou."
26012-260120370 = "Muito obrigada!"
26012-260120380 = "Desta vez, vou lhe mostrar o quanto evoluí!"
