[translation]
26012-260120010 = "Здравствуйте, Сенсей."
26012-260120020 = "Не могли бы вы помочь мне...?"
26012-260120030 = "Конечно."
26012-260120040 = "Дело в том, что меня назначили на должность спасателя на воде."
26012-260120050 = "Как полицейскому, охраняющему безопасность граждан, это почётно, но..."
26012-260120060 = "Понимаете..."
26012-260120070 = "у меня нет опыта спасения людей на воде."
26012-260120080 = "Только вчера я узнала, что мне нужно пройти специальную подготовку..."
26012-260120090 = "Это серьёзно..."
26012-260120100 = "Успеешь потренироваться?"
26012-260120110 = "Поэтому у меня к вам просьба..."
26012-260120120 = "Не могли бы вы составить мне компанию на тренировках!"
26012-260120130 = "Сенсей, здравствуйте."
26012-260120140 = "Подумав после прошлого раза..."
26012-260120150 = "всё-таки, даже если начать тренироваться сейчас, вряд ли успею."
26012-260120160 = "За пару дней сложно, да..."
26012-260120170 = "Поэтому я решила сосредоточиться на оказании первой помощи!"
26012-260120180 = "Чтобы хоть немного повысить шансы на выживание пострадавших!"
26012-260120190 = "Ты изменила тактику."
26012-260120200 = "Действительно, это тоже важно."
26012-260120210 = "Да! Если вы не против, не могли бы вы снова помочь мне с тренировкой?"
26012-260120220 = "Я не допущу прошлых ошибок, обещаю!"
26012-260120230 = "...Сенсей, вы случайно не читали инструкцию?"
26012-260120240 = "Да, прочитал."
26012-260120250 = "Если я утону, ты ведь спасёшь меня, Кирино?"
26012-260120260 = "Д-"
26012-260120270 = "Да, конечно!"
26012-260120280 = "Я полицейский и умею разделять личное и служебное!"
26012-260120290 = "Я имел в виду дефибриллятор..."
26012-260120300 = "Н-не дразните меня, Сенсей!"
26012-260120310 = "Сенсей! Здравствуйте, это Кирино!"
26012-260120320 = "Благодаря вам я завершила подготовку спасателя!"
26012-260120330 = "Поздравляю, Кирино."
26012-260120340 = "Это всё благодаря вашей помощи!"
26012-260120350 = "Я хочу напоследок повторить тренировку, не могли бы вы снова составить мне компанию?"
26012-260120360 = "Конечно, приду."
26012-260120370 = "Спасибо вам!"
26012-260120380 = "Теперь я покажу вам, как выросла!"