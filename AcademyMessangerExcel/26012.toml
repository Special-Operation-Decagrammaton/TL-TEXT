[translation]
26012-260120010 = "Здравствуйте, Сенсей."
26012-260120020 = "Могу я случайно попросить вас о помощи?"
26012-260120030 = "Конечно. Что нужно?"
26012-260120040 = "Я взяла на себя обязанности спасателя."
26012-260120050 = "Как сотрудница полиции, живущая ради защиты граждан, я не могу представить большей чести!"
26012-260120060 = "Но..."
26012-260120070 = "Основные стили плавания я знаю, но слышала, что для спасения на поверхности воды есть особый."
26012-260120080 = "А узнала о его существовании только вчера!"
26012-260120090 = "Разве это не большая проблема?"
26012-260120100 = "Тебе не стоит начать тренироваться прямо сейчас?"
26012-260120110 = "Поэтому... Поможете мне с тренировкой по плаванию, Сенсей?!"
26012-260120120 = "Такими темпами меня могут признать непригодной к службе!"
26012-260120130 = "Сенсей! Здравствуйте!"
26012-260120140 = "После прошлой тренировки я много размышляла над своими ошибками..."
26012-260120150 = "И в итоге поняла, что выучить спасательный стиль плавания за такое короткое время — слишком сложная задача!"
26012-260120160 = "Определённо, особенно если ты к нему не привыкла."
26012-260120170 = "Поэтому вместо этого я сосредоточусь на первой помощи!"
26012-260120180 = "Тогда, когда кто-то вытащит утопающего, я смогу помочь, оказав помощь и приведя его в сознание!"
26012-260120190 = "Смена подхода?"
26012-260120200 = "Это важная часть процесса."
26012-260120210 = "Именно! Поэтому, если вы не против, снова присмотрите за моей тренировкой, Сенсей!"
26012-260120220 = "Я учла прошлые ошибки, так что можете не беспокоиться!"
26012-260120230 = "Вы прочитали руководство, Сенсей?"
26012-260120240 = "Да, прочитал."
26012-260120250 = "А ту часть, которую мы пропустили на тренировке... если бы я действительно тонула, вы бы сделали это, да?"
26012-260120260 = "Э-"
26012-260120270 = "Конечно!"
26012-260120280 = "Всё-таки я сотрудница полиции! Профессионал!"
26012-260120290 = "Я вообще-то про AED?"
26012-260120300 = "П-пожалуйста, не дразните меня!"
26012-260120310 = "Сенсей! Здравствуйте! Это Кирино!"
26012-260120320 = "Спасибо, что помогли мне закончить подготовку спасателя! Осталась только последняя проверка!"
26012-260120330 = "Поздравляю, Кирино."
26012-260120340 = "Без вас я бы не справилась!"
26012-260120350 = "И всё же я надеялась, что вы ещё раз, в последний раз, присмотрите за моей тренировкой?"
26012-260120360 = "Конечно. Я буду."
26012-260120370 = "Спасибо!"
26012-260120380 = "Я закончу на отлично!"
