[translation]
10137-101370010 = "Quanto tempo, Sensei."
10137-101370020 = "Aqui é a Shima Konoka."
10137-101370030 = "Konoka?!"
10137-101370040 = "Falando mais formal que o normal..."
10137-101370050 = "Que isso, do que você tá falando?"
10137-101370060 = "Acho que eu sempre falo nesse tom educado, ué."
10137-101370070 = "Ah, é verdade. É que na ação da sorte do horóscopo de hoje dizia para \"se apresentar direitinho\","
10137-101370080 = "aí resolvi falar meu nome completo."
10137-101370090 = "Ah, é mesmo?! Sabia disso não, chefia!"
10137-101370100 = "Sensei... o que deu em você?"
10137-101370110 = "Bom, deixa pra lá. Quando tiver um tempinho livre mais tarde, dá um pulo aqui na Valkyrie."
10137-101370120 = "Quero tratar de uns trâmites administrativos com você."
10137-101370130 = "Olha, isso aqui tá ardendo pra caramba."
10137-101370140 = "Você está bem?"
10137-101370150 = "Ah, bom, isso aqui eu tiro de letra."
10137-101370160 = "Ainda bem que tinha leite na geladeira, me salvou."
10137-101370170 = "Aquela aluna de hoje... vai sofrer alguma punição disciplinar?"
10137-101370180 = "Capaz, imagina!"
10137-101370190 = "Quem sabe desconfiar dos outros daquele jeito leva muito jeito pra trabalhar na Valkyrie."
10137-101370200 = "Se eu fosse novata, provavelmente teria feito a mesmíssima coisa!"
10137-101370210 = "Mandou bem demais! Não é à toa que é a Vice-Diretora!"
10137-101370220 = "Bom, e dessa vez a culpa também foi minha..."
10137-101370230 = "O horóscopo bem que me avisou, mas eu não me apresentei direito pra ela..."
10137-101370240 = "Colhi o que plantei, basicamente."
10137-101370250 = "E aí, Sensei, tudo tranquilo?"
10137-101370260 = "Parece que a ação da sorte de hoje é \"ser pontual\"."
10137-101370270 = "Quer dizer, cumprir horário já é meio que obrigação básica, né?"
10137-101370280 = "Mas às vezes é mais difícil do que parece."
10137-101370290 = "Pois é, as ações da sorte do horóscopo costumam ser coisas que a gente já deveria praticar no dia a dia,"
10137-101370300 = "mas quando tá escrito lá, dá vontade de prestar ainda mais atenção que o normal, sabe?"
10137-101370310 = "Enfim, só passei pra compartilhar a dica da sorte de hoje!"
10137-101370320 = "Tenha um ótimo dia! Falooou~"
10137-101370330 = "Acho que acabei te dando um susto, né?"
10137-101370340 = "Cara, colocar a ação da sorte em prática logo cedo dá uma sensação ótima!"
10137-101370350 = "Mas ser pontual... não era a ação da sorte de ontem?"
10137-101370360 = "Hã?"
10137-101370370 = "Aaah..."
10137-101370380 = "Deixa eu ver, a de hoje é..."
10137-101370390 = "\"Não se prender demais aos horários.\""
10137-101370400 = "..."
10137-101370410 = "Ééé..."
10137-101370420 = "Tenho uma informação confidencial aqui..."
10137-101370430 = "Mas acho que pra você não tem problema contar, Sensei."
10137-101370440 = "Vou te mandar o endereço, a gente se encontra lá."
10137-101370450 = "Opa, e aí, Sensei!"
10137-101370460 = "A ação da sorte de hoje é \"agir junto com o seu parceiro\"!"
10137-101370470 = "Sendo assim, topa ser meu parceiro de patrulha pelo dia todo hoje?"
10137-101370480 = "Conto com você!"
10137-101370490 = "Ah..."
10137-101370500 = "Vou tirar licença médica hoje,"
10137-101370510 = "então dá um jeito no plantão aí pra mim."
10137-101370520 = "Deixo o resto nas suas mãos~"
10137-101370530 = "??"
10137-101370540 = "Que reação é essa com a sua superior? Haa..."
10137-101370550 = "Acabei pegando um resfriado naquela investigação do outro dia."
10137-101370560 = "Enfim, quebra essa pra mim, valeu."
10137-101370570 = "Totalmente! Recuperada!"
10137-101370580 = "Muito obrigada pela ajuda no outro dia, Sensei."
10137-101370590 = "Eu não acabei passando o resfriado pra você não, né?"
10137-101370600 = "Estou ótimo!"
10137-101370610 = "Só estou com um pouco de febre alta, dor de garganta e dor no corpo todo!"
10137-101370620 = "Você pegou o meu resfriado com toda a certeza!"
10137-101370630 = "Nesse caso..."
10137-101370640 = "Para retribuir o favor, vou aí cuidar de você."
10137-101370650 = "E ainda te pago um bom lámen tonkotsu!"
