[translation]
10137-101370010 = "Здравствуйте, Сенсей."
10137-101370020 = "Это Шима Конока."
10137-101370030 = "Конока?!"
10137-101370040 = "Чего ты вдруг такая официальная?"
10137-101370050 = "А?"
10137-101370060 = "Разве я не всегда такая?"
10137-101370070 = "В общем, сегодняшний гороскоп сказал, что мне следует «производить хорошее первое впечатление»."
10137-101370080 = "Вот я и пробую."
10137-101370090 = "Я б тебя ваще не узнал!"
10137-101370100 = "Обидно... Я вообще-то не так разговариваю, знаешь ли!"
10137-101370110 = "В общем, у меня есть немного административной работы, которую нужно с вами разобрать. Сможете как-нибудь заглянуть в Валькирию?"
10137-101370120 = "Я бу-у-уду очень благодарна!"
10137-101370130 = "Ух, это было так остро."
10137-101370140 = "Тебе уже лучше?"
10137-101370150 = "Я в порядке. Ничего страшного."
10137-101370160 = "Хорошо, что в холодильнике было молоко."
10137-101370170 = "А насчёт той девочки... Ты её отругала?"
10137-101370180 = "Э, а зачем мне это делать?"
10137-101370190 = "Наверное, когда я только начинала, была такой же."
10137-101370200 = "Организации нужны такие энергичные люди, чтобы всё продолжало работать."
10137-101370210 = "Как круто! Ты и правда заместитель директора!"
10137-101370220 = "Да и частично это была моя вина."
10137-101370230 = "Я ведь не произвела хорошего первого впечатления, как велел гороскоп, помнишь?"
10137-101370240 = "Ничего не поделаешь. лол"
10137-101370250 = "Здравствуйте, Сенсей."
10137-101370260 = "Сегодняшний гороскоп сказал, что мне следует «вовремя выполнять обещания»."
10137-101370270 = "Разве это не само собой разумеется?"
10137-101370280 = "Сказать легче, чем сделать, ясно?!"
10137-101370290 = "Советы из гороскопов обычно просто хорошие жизненные советы."
10137-101370300 = "Но я бы всё равно не стала испытывать судьбу, НЕ следуя им!"
10137-101370310 = "В общем. Мне показалось это забавным, поэтому решила отправить вам."
10137-101370320 = "Хорошего дня, Сенсей!"
10137-101370330 = "Вы удивились, Сенсей?"
10137-101370340 = "Когда следуешь гороскопу, день и правда ощущается иначе!"
10137-101370350 = "Разве «вовремя выполнять обещания» было не вчера?"
10137-101370360 = "А?"
10137-101370370 = "А."
10137-101370380 = "Тогда сегодняшний гороскоп..."
10137-101370390 = "«Пусть время следует за тобой, а не наоборот»."
10137-101370400 = "..."
10137-101370410 = "А..."
10137-101370420 = "Мне нужно рассказать вам секрет."
10137-101370430 = "Наконец пришло время им поделиться."
10137-101370440 = "Встретимся по этому адресу."
10137-101370450 = "Здравствуйте, Сенсей."
10137-101370460 = "Сегодняшний гороскоп говорит, что мне нужен напарник."
10137-101370470 = "Так что у меня вопрос. Побудете сегодня моим напарником?"
10137-101370480 = "Давай!!"
10137-101370490 = "Эй."
10137-101370500 = "Ваша старшая сестрёнка сегодня слишком больна, чтобы выйти на работу."
10137-101370510 = "Скажи дежурным на выходных расслабиться и побаловать себя чем-нибудь приятным."
10137-101370520 = "Ладно. Спокойной ночи."
10137-101370530 = "???"
10137-101370540 = "Только не ??? заместителю директора."
10137-101370550 = "Я промокла под дождём и простудилась."
10137-101370560 = "Тогда увидимся позже лол"
10137-101370570 = "Полностью выздоровела!"
10137-101370580 = "Сенсей, вы благополучно вернулись?"
10137-101370590 = "Вы не заразились от меня простудой?"
10137-101370600 = "Я в порядке!"
10137-101370610 = "Просто температура, горло болит и слабость!"
10137-101370620 = "Это буквально определение простуды. Что значит «в порядке»?"
10137-101370630 = "лол"
10137-101370640 = "На этот раз я навещу тебя."
10137-101370650 = "По дороге возьму рамэн тонкоцу!"
