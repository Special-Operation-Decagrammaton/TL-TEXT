[translation]
10137-101370010 = "Давно не виделись, Сенсей."
10137-101370020 = "Это Шима Конока."
10137-101370030 = "Конока!?"
10137-101370040 = "Ты более вежлива, чем обычно..."
10137-101370050 = "Что вы имеете в виду?"
10137-101370060 = "Я всегда так говорю, мне кажется."
10137-101370070 = "А, точно. Сегодня в моём списке удачных действий было «представиться как следует»,"
10137-101370080 = "вот я и назвалась."
10137-101370090 = "Вот оно что! Я и не знал!"
10137-101370100 = "Сенсей... что с вами?"
10137-101370110 = "Ладно, неважно. Зайдите позже, когда будет время, в Валькирию."
10137-101370120 = "Нужно обсудить кое-что по административным формальностям."
10137-101370130 = "Это довольно тяжко, вот."
10137-101370140 = "Ты в порядке?"
10137-101370150 = "А, да, в общем, в этом нет ничего страшного."
10137-101370160 = "Хорошо, что в холодильнике было молоко – выручило."
10137-101370170 = "А что с той сегодняшней... её накажут?"
10137-101370180 = "Да ну, что вы."
10137-101370190 = "Для Валькирии как раз хорошо, когда человек умеет так сомневаться в других."
10137-101370200 = "Будь я новичком, поступила бы так же."
10137-101370210 = "Круто! Не зря вы заместитель начальника!"
10137-101370220 = "Ну и, к тому же, на этот раз я тоже виновата..."
10137-101370230 = "Хотя гадание и предупреждало, но я не представилась как следует..."
10137-101370240 = "Что посеешь, то и пожнёшь."
10137-101370250 = "Сенсей, как ваши дела?"
10137-101370260 = "Сегодняшнее удачное действие – «приходить вовремя», или что-то такое."
10137-101370270 = "Но, думаю, приходить вовремя – это само собой разумеется, правда?"
10137-101370280 = "Хотя это и не так просто, как кажется."
10137-101370290 = "Ну, удачные действия по гороскопу – это обычно то, что стоит делать и в повседневной жизни,"
10137-101370300 = "так что если написано – я стараюсь придерживаться этого даже больше обычного."
10137-101370310 = "Вот я и поделилась сегодняшним удачным действием!"
10137-101370320 = "Хорошего дня! Пока-пока~"
10137-101370330 = "Я вас напугала, наверное?"
10137-101370340 = "Ну надо же – с утра выполнять удачные действия – так приятно."
10137-101370350 = "Пунктуальность... разве это не было вчерашним удачным действием?"
10137-101370360 = "Э?"
10137-101370370 = "Ах..."
10137-101370380 = "Эм, сегодня..."
10137-101370390 = "«Не слишком зацикливаться на времени»."
10137-101370400 = "..."
10137-101370410 = "А-а..."
10137-101370420 = "У меня есть секретная информация..."
10137-101370430 = "Но, думаю, вам, Сенсей, можно рассказать."
10137-101370440 = "Я пришлю адрес, встретимся там."
10137-101370450 = "Добрый день, Сенсей."
10137-101370460 = "Сегодняшнее удачное действие – «действовать вместе с напарником»!"
10137-101370470 = "Так что не хотите ли стать моим напарником на сегодня?"
10137-101370480 = "Прошу вас!"
10137-101370490 = "А-а..."
10137-101370500 = "Сегодня я возьму больничный."
10137-101370510 = "Дежурство сделай как-нибудь."
10137-101370520 = "Остальное оставляю на тебя~"
10137-101370530 = "??"
10137-101370540 = "Что это за реакция на начальника? Вздох..."
10137-101370550 = "Простудилась на прошлом задании."
10137-101370560 = "Ну ладно, надеюсь на тебя."
10137-101370570 = "Полное выздоровление!"
10137-101370580 = "Сенсей, спасибо вам за тот день."
10137-101370590 = "Надеюсь, я вас не заразила?"
10137-101370600 = "Всё в порядке!"
10137-101370610 = "Просто немного жар, горло и тело болят – и всё!"
10137-101370620 = "Это же явно простуда."
10137-101370630 = "Тогда..."
10137-101370640 = "В качестве благодарности я приду проведать вас."
10137-101370650 = "Угощу вас тонной свиного рамена!"