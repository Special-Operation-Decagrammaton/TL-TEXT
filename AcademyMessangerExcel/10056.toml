[translation]
10056-100560010 = "Здравствуйте, Сенсей."
10056-100560020 = "Счастливого Рождества!"
10056-100560030 = "С Рождеством, Серина!"
10056-100560040 = "Хи-хи. Спасибо."
10056-100560050 = "Я слышала, сегодня в центре проходит благотворительное мероприятие."
10056-100560060 = "Хочешь пойти со мной?"
10056-100560070 = "Не могу отказаться от приглашения от тебя, Серина!"
10056-100560080 = "П-правда? Неужели?"
10056-100560090 = "Хорошо! Буду ждать тебя там."
10056-100560100 = "Здравствуйте, Сенсей!"
10056-100560110 = "Надеюсь, в последнее время ты следишь за здоровьем."
10056-100560120 = "Иногда! Вроде того!"
10056-100560130 = "Сенсей! Опять?"
10056-100560140 = "Я уже говорила тебе, нельзя быть таким безответственным."
10056-100560150 = "Ты ведь знаешь, как сильно я из-за тебя переживаю, Сенсей!"
10056-100560160 = "..."
10056-100560170 = "Эм."
10056-100560180 = "У тебя... есть сегодня время?"
10056-100560190 = "Нет! Но для тебя есть!"
10056-100560200 = "...?"
10056-100560210 = "Ч-что? Что это значит?"
10056-100560220 = "...Сенсей?"
10056-100560230 = "Как ты, Сенсей?"
10056-100560240 = "Сегодня в больнице проходит благотворительное мероприятие."
10056-100560250 = "Все пациенты меня знают, так что я не уверена, как они отреагируют, если я появлюсь в костюме Санты."
10056-100560260 = "Можно мне прийти? На мероприятие?"
10056-100560270 = "Ч-что?"
10056-100560280 = "Я-я имею в виду... Наверное, причин, почему тебе нельзя, нет."
10056-100560290 = "Но почему? Так внезапно?"
10056-100560300 = "Сенсей?"
