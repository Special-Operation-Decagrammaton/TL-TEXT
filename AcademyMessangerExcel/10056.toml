[translation]
10056-100560010 = "Olá, Sensei!"
10056-100560020 = "Feliz Natal!"
10056-100560030 = "Feliz Natal para você também, Serina!"
10056-100560040 = "Hehe, muito obrigada."
10056-100560050 = "Hoje teremos uma ação voluntária no centro da cidade."
10056-100560060 = "Se você tiver um tempinho, não gostaria de vir assistir, Sensei?"
10056-100560070 = "Se é um convite especial da Serina, eu vou custe o que custar!"
10056-100560080 = "M-muito obrigada!"
10056-100560090 = "Estarei te esperando!"
10056-100560100 = "Olá, Sensei!"
10056-100560110 = "Como tem passado de saúde ultimamente?"
10056-100560120 = "Vontade de me cuidar direitinho eu até tenho, mas..."
10056-100560130 = "Ah, poxa...!"
10056-100560140 = "Eu sei que você anda ocupado, mas assim não dá!"
10056-100560150 = "Se continuar desse jeito, uma hora dessas..."
10056-100560160 = "..."
10056-100560170 = "Hum..."
10056-100560180 = "Você tem um tempinho livre hoje?"
10056-100560190 = "Mesmo se não tiver, eu dou um jeito de ter!"
10056-100560200 = "H-hã...?"
10056-100560210 = "Fico feliz em ouvir isso, mas..."
10056-100560220 = "B-bom, até mais tarde então."
10056-100560230 = "Sensei, está tudo bem com a sua saúde?"
10056-100560240 = "Hoje eu vou visitar um hospital como voluntária."
10056-100560250 = "Eu já costumo encontrar bastante os pacientes de lá, mas como desta vez vou vestida de Mamãe Noel, estou um pouquinho nervosa."
10056-100560260 = "Não diga mais nada. Posso ir junto também?"
10056-100560270 = "Oi?"
10056-100560280 = "N-não é que não possa, mas..."
10056-100560290 = "O que deu em você assim tão de repente?"
10056-100560300 = "Hum... Sensei?"
