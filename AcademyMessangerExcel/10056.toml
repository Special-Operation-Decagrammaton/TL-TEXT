[translation]
10056-100560010 = "Здравствуйте, Сенсей!"
10056-100560020 = "С Рождеством!"
10056-100560030 = "И тебя, Серина, с Рождеством!"
10056-100560040 = "Хе-хе, спасибо."
10056-100560050 = "Сегодня я буду заниматься волонтёрской деятельностью в городе."
10056-100560060 = "Если хотите, не заглянете ли посмотреть?"
10056-100560070 = "Если Серина приглашает, я обязательно приду!"
10056-100560080 = "Спасибо!"
10056-100560090 = "Буду ждать вас!"
10056-100560100 = "Здравствуйте, Сенсей!"
10056-100560110 = "Как вы себя чувствуете в последнее время?"
10056-100560120 = "Я хочу заботиться о себе, но..."
10056-100560130 = "Ну всё...!"
10056-100560140 = "Я понимаю, что вы заняты, но так нельзя."
10056-100560150 = "Если так продолжится, со временем..."
10056-100560160 = "..."
10056-100560170 = "Слушайте."
10056-100560180 = "У вас есть время сегодня?"
10056-100560190 = "Даже если нет, я найду!"
10056-100560200 = "Э-э...?"
10056-100560210 = "Я рада, но..."
10056-100560220 = "Тогда до встречи."
10056-100560230 = "Сенсей, вы в порядке?"
10056-100560240 = "Сегодня я по волонтёрской работе иду в одну больницу."
10056-100560250 = "Я часто вижу пациентов, но в этот раз я иду как Санта, так что немного волнуюсь."
10056-100560260 = "Вот как. Можно мне пойти с тобой?"
10056-100560270 = "Что?"
10056-100560280 = "Нет, не то чтобы нельзя..."
10056-100560290 = "Почему вдруг?"
10056-100560300 = "Э-э, Сенсей?"
