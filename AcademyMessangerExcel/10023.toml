[translation]
10023-100230010 = "Сенсей, не могли бы вы оказать мне услугу?"
10023-100230020 = "Конечно."
10023-100230030 = "Какую?"
10023-100230040 = "Не могли бы вы принести мне солнцезащитный крем, когда в следующий раз будете в Академии Геенна?"
10023-100230050 = "Перед летним лагерем у меня закончился крем, а работа Команды Префектов не оставляет времени."
10023-100230060 = "У меня нет времени сходить за новым."
10023-100230070 = "Хорошо."
10023-100230080 = "Масло для загара из Seaside подойдёт?"
10023-100230090 = "Да, подойдёт."
10023-100230100 = "Тогда буду ждать."
10023-100230110 = "То, о чём я просила, у вас с собой, верно?"
10023-100230120 = "И ещё раз: другим студентам об этом ни слова!"
10023-100230130 = "Иори?"
10023-100230140 = "Ты точно хотела отправить это мне?"
10023-100230150 = "Сенсей?"
10023-100230160 = "afjhdaklfhdalk"
10023-100230170 = "Э-Это ничего!"
10023-100230180 = "Не обращайте внимания на моё последнее сообщение."
10023-100230190 = "Теперь мне ещё интереснее..."
10023-100230200 = "Спасибо, что помогли с тренировкой по плаванию, Сенсей."
10023-100230210 = "Пусть я и не профессионал, но теперь умею плавать."
10023-100230220 = "Думаю, нарукавники мне больше не нужны."
10023-100230230 = "Эй, Иори."
10023-100230240 = "Что?"
10023-100230250 = "Ты выбрала эти нарукавники из-за милых утят по бокам?"
10023-100230260 = "Замолчите! Я вас убью!"
10023-100230270 = "У нас ситуация, Сенсей!"
10023-100230280 = "Только что сообщили, что какие-то хулиганы устроили беспорядок перед Пляжной хижиной!"
10023-100230290 = "Как член Команды Префектов Геенны я не могу просто сидеть и смотреть на это безобразие!"
10023-100230300 = "Встретьтесь со мной у Пляжной хижины. Сейчас же."
10023-100230310 = "Возможно, придётся зайти в воду, так что возьмите купальник."
10023-100230320 = "Погоди. Зачем мне заходить в воду?"
10023-100230330 = "Сенсей, на стойке сказали, что вас нет уже несколько часов..."
10023-100230340 = "Где вы?"
10023-100230350 = "Я на пляже."
10023-100230360 = "На пляже? Что вы там делаете?"
10023-100230370 = "Лежу."
10023-100230380 = "...Почему?"
10023-100230390 = "Вообще-то, кажется, я понимаю, что происходит."
10023-100230400 = "Скоро приду вас арестовывать."
10023-100230410 = "Погоди! Что ты думаешь, я делаю?"
10023-100230420 = "Сенсей. Срочная ситуация."
10023-100230430 = "Хм? Что происходит?"
10023-100230440 = "Какие-то бандиты устроили беспорядок в пляжном ресторане."
10023-100230450 = "Я думала, мы в прошлый раз всех разогнали, но они снова появились."
10023-100230460 = "В общем, нам пригодится ваша помощь."
10023-100230470 = "Хорошо. Где встретимся?"
