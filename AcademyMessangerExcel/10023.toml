[translation]
10023-100230010 = "Сенсей, можно попросить тебя кое о чём?"
10023-100230020 = "Конечно, говори, что нужно."
10023-100230030 = "Что я должен сделать?"
10023-100230040 = "Когда будешь в Геенне, купи мне солнцезащитный крем."
10023-100230050 = "Тот, что я использовала, кончился, и я хотела купить перед сборами,"
10023-100230060 = "но работа в комитете оказалась слишком напряжённой..."
10023-100230070 = "Всё в порядке, положись на меня."
10023-100230080 = "Крем «Сисайд», да?"
10023-100230090 = "Да, он самый."
10023-100230100 = "Тогда прошу."
10023-100230110 = "...Ты готов?"
10023-100230120 = "Повторяю: ни в коем случае не говори никому из учениц!"
10023-100230130 = "...Иори?"
10023-100230140 = "Ты уверена, что это сообщение мне?"
10023-100230150 = "...Что?"
10023-100230160 = "Клджлак"
10023-100230170 = "Н-нет, ничего!"
10023-100230180 = "Забудь то, что я отправила!"
10023-100230190 = "Когда ты так говоришь, становится ещё интереснее..."
10023-100230200 = "Ну... спасибо, что помог с тренировкой по плаванию, Сенсей."
10023-100230210 = "Благодаря тебе я, конечно, не могу сказать, что научилась, но хотя бы плавать более-менее могу..."
10023-100230220 = "Возможно, на сборы мне не придётся брать надувной круг."
10023-100230230 = "Это хорошо. Кстати, Иори."
10023-100230240 = "...Что?"
10023-100230250 = "На круге была нарисована утка, ты любишь уток?"
10023-100230260 = "Заткнись! Умри!"
10023-100230270 = "Сенсей, где ты сейчас?"
10023-100230280 = "Мне сообщили, что у пляжного домика хулиганы устроили беспорядки."
10023-100230290 = "Как член дисциплинарного комитета Геенны, я не могу это игнорировать."
10023-100230300 = "Но мы не знаем, сколько их, да и другие члены комитета заняты, так что мне нужна твоя помощь."
10023-100230310 = "Ах, ты можешь упасть в воду, так что лучше в купальнике!"
10023-100230320 = "Эй, подожди, подожди!?"
10023-100230330 = "Сенсей. Стойка администратора сказала, что тебя не было больше полдня..."
10023-100230340 = "Где ты сейчас?"
10023-100230350 = "На пляже."
10023-100230360 = "На пляже? И что ты там делаешь...?"
10023-100230370 = "Просто лежу."
10023-100230380 = "Что...? Зачем?"
10023-100230390 = "Неважно, не говори. Я поняла."
10023-100230400 = "Я сейчас найду наручники и приду, не двигайся с места."
10023-100230410 = "Стой, о чём ты думаешь?"
10023-100230420 = "Сенсей, чрезвычайная ситуация."
10023-100230430 = "Что случилось?"
10023-100230440 = "У пляжной столовой хулиганят ученицы..."
10023-100230450 = "Я их уже разогнала, но... вздох..."
10023-100230460 = "Мне не хватает рук, так что я хочу попросить тебя взять на себя командование."
10023-100230470 = "Понял, куда мне идти?"
