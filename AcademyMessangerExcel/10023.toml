[translation]
10023-100230010 = "Sensei, posso te pedir um favor?"
10023-100230020 = "Claro, pode falar."
10023-100230030 = "Sim, o que você precisa?"
10023-100230040 = "Na próxima vez que vier a Gehenna, queria que você trouxesse um protetor solar pra mim."
10023-100230050 = "O que eu usava sempre acabou, e eu planejava comprar outro antes do acampamento de verão,"
10023-100230060 = "mas o trabalho do comitê ficou muito mais corrido do que eu esperava..."
10023-100230070 = "Tranquilo, deixa comigo."
10023-100230080 = "É aquele protetor solar da marca \"Seaside\", né?"
10023-100230090 = "Isso, esse mesmo."
10023-100230100 = "Valeu, conto com você então."
10023-100230110 = "...Já está tudo pronto aí?"
10023-100230120 = "Só pra reforçar: não conte sobre isso para nenhuma outra aluna, sob hipótese alguma!"
10023-100230130 = "...Iori?"
10023-100230140 = "Tem certeza de que essa mensagem era pra mim?"
10023-100230150 = "...Hã?"
10023-100230160 = "jguaklf"
10023-100230170 = "N-Não é nada!"
10023-100230180 = "Esqueça a mensagem que eu acabei de mandar!"
10023-100230190 = "Falando assim eu fico mais curioso ainda..."
10023-100230200 = "Hum... obrigada por me acompanhar no treino de natação, Sensei."
10023-100230210 = "Graças a você, ainda não dá pra dizer que domino a natação, mas pelo menos já consigo não afundar..."
10023-100230220 = "Com isso, acho que não vou mais precisar levar boia pro acampamento de verão."
10023-100230230 = "Que ótimo! Aliás, Iori,"
10023-100230240 = "...Que foi?"
10023-100230250 = "Vi o desenho na sua boia: você gosta de patinhos, Iori?"
10023-100230260 = "Cala a boca! Morre!"
10023-100230270 = "Sensei, onde você está agora?"
10023-100230280 = "Acabei de receber um chamado dizendo que há delinquentes causando tumulto perto dos quiosques da praia."
10023-100230290 = "Como integrante do Comitê Disciplinar de Gehenna, não posso fazer vista grossa."
10023-100230300 = "Porém, não sabemos quantas são e o restante do Comitê Disciplinar está ocupado, então preciso que você venha comigo, Sensei."
10023-100230310 = "Ah, e como corre o risco de cairmos no mar, acho melhor você vir de roupa de banho!"
10023-100230320 = "Hã?! Espera aí, como assim?!"
10023-100230330 = "Sensei. Acabei de ouvir na recepção que você saiu há mais de meio dia e ainda não voltou..."
10023-100230340 = "Onde você está uma hora dessas?"
10023-100230350 = "Na areia da praia."
10023-100230360 = "Na areia da praia? Fazendo o que na areia da praia...?"
10023-100230370 = "Só deitado."
10023-100230380 = "Hã...? Por quê?"
10023-100230390 = "Não, nem precisa responder. Já entendi tudo."
10023-100230400 = "Vou pegar as minhas algemas e já vou praí, então não dê nem um passo!"
10023-100230410 = "Calma aí, o que você tá imaginando?!"
10023-100230420 = "Sensei, temos uma emergência."
10023-100230430 = "O que aconteceu?"
10023-100230440 = "Tem alunas delinquentes quebrando tudo num restaurante da orla..."
10023-100230450 = "E olha que eu já tinha acabado com a bagunça delas uma vez... ai, ai..."
10023-100230460 = "Estamos com pouca gente aqui, então queria pedir que você assumisse o comando da operação, Sensei."
10023-100230470 = "Entendido, pra onde eu vou?"
