[translation]
10111-101110010 = "Aah..."
10111-101110020 = "Putz."
10111-101110030 = "Não consigo me acostumar com isso."
10111-101110040 = "Aconteceu algum problema?"
10111-101110050 = "Não é nada tão sério a ponto de precisar consultar você, Sensei, mas..."
10111-101110060 = "...Pensando bem, quer saber?"
10111-101110070 = "Se tiver um tempinho, dá pra gente se encontrar?"
10111-101110080 = "Tem uma paradinha que eu quero te perguntar."
10111-101110090 = "Hoje foi mó divertido, Sensei!"
10111-101110100 = "Quem diria que ninguém ia me reconhecer até eu puxar assunto."
10111-101110110 = "É a primeira vez que passo por isso."
10111-101110120 = "Se você se divertiu, é o que importa."
10111-101110130 = "Acho que vou tentar de novo na próxima folga."
10111-101110140 = "Agora a parada ficou divertida!"
10111-101110150 = "E aí, Sensei."
10111-101110160 = "Tá ocupado?"
10111-101110170 = "Hoje tô livre."
10111-101110180 = "Caiu como uma luva."
10111-101110190 = "Já que hoje é dia de folga,"
10111-101110200 = "pensei em ter um dia diferente do normal."
10111-101110210 = "Não me diga que você está de uniforme escolar hoje também?"
10111-101110220 = "Opa,"
10111-101110230 = "pegou rápido no ar, hein."
10111-101110240 = "Bora sair agora."
10111-101110250 = "E hoje é o último dia"
10111-101110260 = "em que vou andar por aí de uniforme."
10111-101110270 = "Amanhã já volta para a sua jaqueta sukajan?"
10111-101110280 = "É."
10111-101110290 = "..."
10111-101110300 = "Dá até uma pontinha de pena."
10111-101110310 = "Tô com vontade de fazer alguma coisa memorável pra fechar com chave de ouro."
10111-101110320 = "Tipo o quê...?"
10111-101110330 = "Aquilo lá, pô!"
10111-101110340 = "Uma parada tipo CABUM! ou POW!"
10111-101110350 = "Não conhece nada nessa pegada não, Sensei?"
10111-101110360 = "Tipo terminar o dia com uma explosão...?"
10111-101110370 = "Ei,"
10111-101110380 = "Sensei."
10111-101110390 = "Sobre aquilo que eu falei agora há pouco..."
10111-101110400 = "Acho que fui meio mandona demais."
10111-101110410 = "Tipo..."
10111-101110420 = "Se você não estiver a fim, pode recusar de boa, tá?"
10111-101110430 = "Pelo contrário, você só vai me chamar pra sair quando estiver de uniforme?"
10111-101110440 = "Putz..."
10111-101110450 = "Você é sempre assim, né, Sensei?"
10111-101110460 = "Então tá..."
10111-101110470 = "Conto com você na próxima folga também!"
