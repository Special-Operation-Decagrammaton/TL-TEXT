[translation]
10111-101110010 = "А-а..."
10111-101110020 = "Да ну..."
10111-101110030 = "Привыкнуть не могу."
10111-101110040 = "У тебя что-то случилось?"
10111-101110050 = "Не настолько, чтобы обсуждать с Сенсеем, но..."
10111-101110060 = "... Да, наверное."
10111-101110070 = "Может, встретимся, если будет время?"
10111-101110080 = "Есть кое-что, что хочу спросить."
10111-101110090 = "Сегодня было весело, Сенсей!"
10111-101110100 = "Не ожидал, что вы меня не заметите, пока я не заговорю."
10111-101110110 = "Такое впервые."
10111-101110120 = "Если было весело, то и отлично."
10111-101110130 = "Может, попробуем и в следующий выходной?"
10111-101110140 = "Становится интересно!"
10111-101110150 = "Здорово, Сенсей."
10111-101110160 = "Заняты?"
10111-101110170 = "Сегодня я свободен."
10111-101110180 = "Отлично."
10111-101110190 = "Раз уж выходной,"
10111-101110200 = "хочу сделать этот день непохожим на другие."
10111-101110210 = "Может, сегодня снова в форме?"
10111-101110220 = "О!"
10111-101110230 = "Ты быстро понимаешь."
10111-101110240 = "Пойдём прямо сейчас."
10111-101110250 = "День в форме"
10111-101110260 = "сегодня последний."
10111-101110270 = "Значит, с завтрашнего дня снова в куртке?"
10111-101110280 = "Ага."
10111-101110290 = "..."
10111-101110300 = "Жалко расставаться."
10111-101110310 = "Хочется сделать что-то запоминающееся напоследок."
10111-101110320 = "Например...?"
10111-101110330 = "Ну, то самое."
10111-101110340 = "Вроде «Бах!» или «Бум!»."
10111-101110350 = "Сенсей, может, есть идеи?"
10111-101110360 = "Взрывающийся финал, что ли...?"
10111-101110370 = "Слушай."
10111-101110380 = "Сенсей."
10111-101110390 = "Насчёт того, что я сказал ранее."
10111-101110400 = "Кажется, я был слишком настойчив."
10111-101110410 = "Ну..."
10111-101110420 = "Если не хочешь, можешь отказаться."
10111-101110430 = "Ты что, только в форме меня приглашаешь?"
10111-101110440 = "Да ну..."
10111-101110450 = "Сенсей, ты всегда такой."
10111-101110460 = "Тогда..."
10111-101110470 = "В следующий выходной тоже рассчитываю на тебя."