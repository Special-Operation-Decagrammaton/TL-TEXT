[translation]
10111-101110010 = "А."
10111-101110020 = "Неловко."
10111-101110030 = "Никак не могу привыкнуть."
10111-101110040 = "Есть проблема?"
10111-101110050 = "Ну, вам не о чем беспокоиться, Сенсей, но"
10111-101110060 = "Эм..."
10111-101110070 = "можем встретиться, если у вас случайно будет время?"
10111-101110080 = "Я хочу кое о чём попросить."
10111-101110090 = "Сегодня было весело, Сенсей!"
10111-101110100 = "Большинство людей меня не узнавали, пока я с ними не заговорила."
10111-101110110 = "Я правда никогда такого не испытывала."
10111-101110120 = "Рад, что тебе весело."
10111-101110130 = "Значит, теперь выходные будут ощущаться вот так?"
10111-101110140 = "Кажется, они начинают мне нравиться."
10111-101110150 = "Йо, Сенсей."
10111-101110160 = "Занят?"
10111-101110170 = "Сегодня я свободен."
10111-101110180 = "О, отлично."
10111-101110190 = "У меня ещё есть несколько выходных."
10111-101110200 = "Так что, если ты не против..."
10111-101110210 = "Ты задумала на сегодня что-то особенное?"
10111-101110220 = "Ну..."
10111-101110230 = "Что-то такое."
10111-101110240 = "Давай обсудим лично или типа того."
10111-101110250 = "Здесь я всего ещё один день"
10111-101110260 = "буду носить школьную форму."
10111-101110270 = "А потом снова сможешь надеть свою куртку-бомбер, да?"
10111-101110280 = "Верно."
10111-101110290 = "..."
10111-101110300 = "Приятно, но одновременно немного грустно."
10111-101110310 = "Интересно, что я буду помнить больше всего, когда вернусь к обычной жизни."
10111-101110320 = "Что именно запомнишь?"
10111-101110330 = "Ну, знаешь"
10111-101110340 = "Какое-нибудь большое новое важное воспоминание, чтобы всё закончилось огромным «БАБАХ!» или «БУМ!»"
10111-101110350 = "Мне нужно что-то такое."
10111-101110360 = "В буквальном смысле взрыв, что ли?"
10111-101110370 = "Эм..."
10111-101110380 = "Сенсей."
10111-101110390 = "Насчёт того, что я говорила раньше."
10111-101110400 = "Такое чувство, что говорила в основном я."
10111-101110410 = "Эм..."
10111-101110420 = "Если тебе это не понравилось, можешь сказать."
10111-101110430 = "Ты можешь говорить всё, что хочешь, сколько хочешь, Нэру."
10111-101110440 = "А."
10111-101110450 = "Серьёзно,"
10111-101110460 = "вы всегда такой, Сенсей."
10111-101110470 = "Тогда буду ждать следующего выходного."
