[translation]
10036-100360010 = "Желаю всем сегодня мира и спокойствия!"
10036-100360020 = "Если будете заходить в собор Тринити, обращайтесь, я помогу."
10036-100360030 = "Спасибо, тогда буду рассчитывать."
10036-100360040 = "Что угодно?"
10036-100360050 = "Ах."
10036-100360060 = "Но, только"
10036-100360070 = "в пределах моих возможностей..."
10036-100360080 = "Далеко уходить мне сложновато..."
10036-100360090 = "Но в остальном — в любое время!"
10036-100360100 = "Ну, Сенсей..."
10036-100360110 = "На самом деле я немного растерялась..."
10036-100360120 = "Что случилось?"
10036-100360130 = "В чём дело?"
10036-100360140 = "Ну..."
10036-100360150 = "В последнее время все твердят мне: «Отдохните»."
10036-100360160 = "Может, я выгляжу ненадёжной?"
10036-100360170 = "Или слишком перенапрягаюсь?"
10036-100360180 = "Хм-м..."
10036-100360190 = "Я вроде бы не переутомляюсь..."
10036-100360200 = "..."
10036-100360210 = "Что же это значит?"
10036-100360220 = "Я в замешательстве..."
10036-100360230 = "Сенсей."
10036-100360240 = "Благодаря вам мне стало легче."
10036-100360250 = "После того, что вы сказали сегодня"
10036-100360260 = "я почувствовала"
10036-100360270 = "настоящее облегчение."
10036-100360280 = "Спасибо вам большое."
10036-100360290 = "Сенсей, здравствуйте."
10036-100360300 = "Сегодня я планирую пойти в парк позади собора. Это часть моей работы по уходу."
10036-100360310 = "Ах, ну..."
10036-100360320 = "У меня нет особой просьбы."
10036-100360330 = "Я просто хотела сказать, что у меня всё хорошо."
10036-100360340 = "И это благодаря вам."
10036-100360350 = "Я ничего особенного не делал. Как-нибудь зайду."
10036-100360360 = "Раз уж так, может, и я зайду?"
10036-100360370 = "Конечно, я буду очень рада!"
10036-100360380 = "Если напишете, я сразу приду встречать!"
10036-100360390 = "Сенсей, извините, что сегодня суматоха. Но есть кое-что ещё..."
10036-100360400 = "Ничего, вы хорошо поработали. Что случилось?"
10036-100360410 = "Что-то произошло?"
10036-100360420 = "Ну..."
10036-100360430 = "В общем, меня спрашивали намёками, похоже, ходят странные слухи."
10036-100360440 = "Спрашивали, что я делала в пустом складе, за собором"
10036-100360450 = "или в кустах..."
10036-100360460 = "Но я понятия не имею, о чём речь..."
10036-100360470 = "...Интересно, о чём бы это?"
10036-100360480 = "...Возможно, эти слухи из-за меня. Простите."
10036-100360490 = "...?"
10036-100360500 = "Э-э..."
10036-100360510 = "...Сенсей?"
10036-100360520 = "Сенсей."
10036-100360530 = "Сегодня у меня выходной."
10036-100360540 = "И вот"
10036-100360550 = "ну..."
10036-100360560 = "?"
10036-100360570 = "Да."
10036-100360580 = "Если вы не против, не могли бы вы уделить мне немного времени...?"
10036-100360590 = "Конечно."
10036-100360600 = "Я буду рад."
10036-100360610 = "!"
10036-100360620 = "Спасибо! Тогда я пойду вперёд и займу место..."
10036-100360630 = "Э-это..."
10036-100360640 = "Сенсей, у вас есть время сейчас?"
10036-100360650 = "Что случилось, Хината?"
10036-100360660 = "Да, всё в порядке."
10036-100360670 = "Ну, вот."
10036-100360680 = "Я хотела спросить на всякий случай..."
10036-100360690 = "Как вам понравился тот обед, который я приготовила для пикника?"
10036-100360700 = "Надеюсь, вам понравилось..."
10036-100360710 = "Конечно, было очень вкусно."
10036-100360720 = "Буду рад, если приготовите ещё."
10036-100360730 = "П-правда?"
10036-100360740 = "Спасибо!"
10036-100360750 = "Ах."
10036-100360760 = "Ну..."
10036-100360770 = "Сенсей!"
10036-100360780 = "Простите, что снова беспокою..."
10036-100360790 = "Я только что заметила..."
10036-100360800 = "Похоже, я по ошибке взяла ваш контейнер для обеда вместо своего."
10036-100360810 = "А, действительно."
10036-100360820 = "Возможно, поэтому он казался тяжёлым... Тогда в ближайшее время встретимся в том парке."
10036-100360830 = "А."
10036-100360840 = "Да!"
10036-100360850 = "Спасибо вам..."
10036-100360860 = "あ"
10036-100360870 = "はいっ！"
10036-100360880 = "ありがとうございます……"
