[translation]
10036-100360010 = "Que a paz e a tranquilidade estejam com todos hoje também!"
10036-100360020 = "Se passar pela Catedral da Trinity, é só falar comigo que eu ajudo no que precisar!"
10036-100360030 = "Obrigado, vou contar com você quando for aí."
10036-100360040 = "No que precisar mesmo?"
10036-100360050 = "Ah!"
10036-100360060 = "Só que, hum..."
10036-100360070 = "Dentro do que estiver ao meu alcance, é claro..."
10036-100360080 = "Ir para lugares muito longe fica um pouquinho difícil para mim..."
10036-100360090 = "Mas fora isso, pode pedir a qualquer hora!"
10036-100360100 = "Hum, Sensei..."
10036-100360110 = "Na verdade, estou com um probleminha..."
10036-100360120 = "Aconteceu alguma coisa?"
10036-100360130 = "O que houve?"
10036-100360140 = "Hum..."
10036-100360150 = "É que ultimamente todas as irmãs vivem insistindo para eu tirar uma folga e descansar..."
10036-100360160 = "Será que eu passo a impressão de não ser confiável?"
10036-100360170 = "Não é porque você anda se esforçando demais o tempo todo?"
10036-100360180 = "Huum..."
10036-100360190 = "Mas eu tenho certeza de que não estou passando dos limites nem nada..."
10036-100360200 = "..."
10036-100360210 = "Por que será que estão dizendo isso?"
10036-100360220 = "Que dilema..."
10036-100360230 = "Sensei"
10036-100360240 = "Graças a você, me sinto bem mais aliviada."
10036-100360250 = "Ouvir você me dizer aquelas palavras hoje,"
10036-100360260 = "de alguma forma, hum..."
10036-100360270 = "fez eu me sentir realmente salva."
10036-100360280 = "Muito obrigada, de verdade."
10036-100360290 = "Olá, Sensei."
10036-100360300 = "Hoje eu vou ao parque que fica atrás da catedral. Faz parte do meu trabalho de manutenção."
10036-100360310 = "Ah, hum,"
10036-100360320 = "não é que eu tenha nenhum favor em especial para pedir, viu?"
10036-100360330 = "Pelo contrário, só queria te avisar que estou super bem e disposta!"
10036-100360340 = "E tudo isso é graças a você, Sensei."
10036-100360350 = "Eu não fiz nada demais. Qualquer dia desses vou aí te ver."
10036-100360360 = "Já que você está por aí, que tal eu dar uma passada para te ver?"
10036-100360370 = "Claro, venha sim, por favor!"
10036-100360380 = "É só me avisar que eu vou correndo te buscar!"
10036-100360390 = "Hum, Sensei..."
10036-100360400 = "Desculpe pela correria toda de hoje. Mas, mudando de assunto, hum..."
10036-100360410 = "Imagina, bom trabalho hoje. O que houve?"
10036-100360420 = "Aconteceu alguma coisa?"
10036-100360430 = "Hum..."
10036-100360440 = "Na verdade, como posso explicar..."
10036-100360450 = "Vieram me perguntar umas coisas meio fazendo rodeios, e acho que pode estar rolando um boato estranho por aí."
10036-100360460 = "No depósito vazio, atrás da catedral,"
10036-100360470 = "e no meio dos arbustos... me perguntaram o que é que eu estava fazendo nesses lugares..."
10036-100360480 = "Mas mesmo perguntando \"o que eu estava fazendo\", eu não fazia ideia do que queriam dizer..."
10036-100360490 = "...O que será, né?"
10036-100360500 = "...Acho que esse boato em si pode ser culpa minha. Desculpa."
10036-100360510 = "...?"
10036-100360520 = "Hum..."
10036-100360530 = "...Sensei?"
10036-100360540 = "Sensei"
10036-100360550 = "Na verdade, hoje eu estou de folga."
10036-100360560 = "E aí,"
10036-100360570 = "hum..."
10036-100360580 = "?"
10036-100360590 = "Sim?"
10036-100360600 = "Se você não se importar, poderia me dar um pouquinho do seu tempo...?"
10036-100360610 = "Claro."
10036-100360620 = "Com todo o prazer."
10036-100360630 = "!"
10036-100360640 = "M-muito obrigada! Então vou indo na frente para guardar um lugar para nós...!"
10036-100360650 = "Hum..."
10036-100360660 = "Sensei, você tem um minutinho agora?"
10036-100360670 = "O que foi, Hinata?"
10036-100360680 = "Sim, pode falar."
10036-100360690 = "É que, bom..."
10036-100360700 = "Eu queria muito te perguntar uma coisinha..."
10036-100360710 = "O que você achou do bentô que eu levei para o nosso piquenique outro dia...?"
10036-100360720 = "Espero que tenha gostado..."
10036-100360730 = "Claro, estava uma delícia!"
10036-100360740 = "Eu ficaria muito feliz se você fizesse de novo qualquer dia."
10036-100360750 = "S-..."
10036-100360760 = "Sério mesmo?"
10036-100360770 = "Muito obrigada!"
10036-100360780 = "Ah!"
10036-100360790 = "Hum..."
10036-100360800 = "Sensei!"
10036-100360810 = "Desculpe incomodar tantas vezes..."
10036-100360820 = "Acabei de perceber uma coisa..."
10036-100360830 = "Parece que eu confundi a sua marmita com o livro de registros e acabei trazendo ela para casa..."
10036-100360840 = "Ah, é verdade!"
10036-100360850 = "Bem que eu achei que estava meio pesado... Então nos vemos naquele parque de novo em breve."
10036-100360860 = "Ah..."
10036-100360870 = "Sim!"
10036-100360880 = "Muito obrigada..."
