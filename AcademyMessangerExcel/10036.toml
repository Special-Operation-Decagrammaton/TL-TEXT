[translation]
10036-100360010 = "Пусть сегодня вас найдут мир и счастье!"
10036-100360020 = "Сообщите, когда у вас будут дела в соборе Тринити. Я помогу чем смогу."
10036-100360030 = "Возможно, воспользуюсь предложением."
10036-100360040 = "С чем угодно?"
10036-100360050 = "А."
10036-100360060 = "Эм..."
10036-100360070 = "Вообще-то я могу помогать только в районе собора."
10036-100360080 = "Это моя зона ответственности."
10036-100360090 = "Буду ждать встречи!"
10036-100360100 = "Так что..."
10036-100360110 = "Сегодня было... непросто."
10036-100360120 = "Непросто?"
10036-100360130 = "Что-то не так?"
10036-100360140 = "Дело в том,"
10036-100360150 = "что все говорят мне расслабиться и полежать."
10036-100360160 = "Это потому, что я плохо работаю?"
10036-100360170 = "Ты не перерабатываешь?"
10036-100360180 = "Я так не думаю..."
10036-100360190 = "Вовсе нет. Правда."
10036-100360200 = "..."
10036-100360210 = "Наверное, именно так они и думают."
10036-100360220 = "Это сложно..."
10036-100360230 = "Сенсей, это Хината."
10036-100360240 = "Я добралась до своей комнаты."
10036-100360250 = "Насчёт сегодняшнего дня..."
10036-100360260 = "Не знаю, как вы к этому отнесётесь, но там вы очень мне помогли."
10036-100360270 = "Так что, эм..."
10036-100360280 = "Спасибо."
10036-100360290 = "Сенсей, это Хината."
10036-100360300 = "Сегодня я буду следить за парком за собором."
10036-100360310 = "О, но"
10036-100360320 = "ничего не происходит, так что не волнуйтесь."
10036-100360330 = "Я просто хотела сказать, что у меня всё хорошо."
10036-100360340 = "И всё благодаря вам."
10036-100360350 = "Рад это слышать."
10036-100360360 = "Я мог бы заглянуть проверить тебя."
10036-100360370 = "...!"
10036-100360380 = "Конечно. Вы всегда можете прийти в собор!"
10036-100360390 = "Ну..."
10036-100360400 = "Эм, Сенсей?"
10036-100360410 = "Хината?"
10036-100360420 = "Что-то не так?"
10036-100360430 = "Ну..."
10036-100360440 = "Ничего особенного, просто..."
10036-100360450 = "Кажется, обо мне ходят странные слухи."
10036-100360460 = "Будто я делаю что-то странное в кладовой."
10036-100360470 = "В углу собора или в кустах, когда никто не видит..."
10036-100360480 = "Что они имеют в виду под «странными вещами»? Никто мне не объясняет."
10036-100360490 = "Да, интересно..."
10036-100360500 = "Это моя вина. Прости."
10036-100360510 = "А?"
10036-100360520 = "Сенсей?"
10036-100360530 = "Сенсей?"
10036-100360540 = "Сенсей."
10036-100360550 = "Сегодня у меня выходной, что бывает нечасто."
10036-100360560 = "Так что, к слову..."
10036-100360570 = "Эм..."
10036-100360580 = "Да?"
10036-100360590 = "Что происходит?"
10036-100360600 = "Если это не слишком неудобно, у вас сегодня есть свободное время?"
10036-100360610 = "Да, конечно."
10036-100360620 = "Да! Для тебя — всегда."
10036-100360630 = "...!"
10036-100360640 = "Спасибо. Я пойду первой и займу место."
10036-100360650 = "Сенсей..."
10036-100360660 = "Так что..."
10036-100360670 = "Хината?"
10036-100360680 = "Что-то случилось?"
10036-100360690 = "А."
10036-100360700 = "Ничего особенного, просто..."
10036-100360710 = "Как вам понравился бэнто в прошлый раз?"
10036-100360720 = "Надеюсь, он был нормальным..."
10036-100360730 = "Более чем. Я бы с удовольствием съел ещё."
10036-100360740 = "Почему? Ты правда собираешься сделать мне ещё один?"
10036-100360750 = "А."
10036-100360760 = "Можно?"
10036-100360770 = "Спасибо!"
10036-100360780 = "Эм-м..."
10036-100360790 = "Так что..."
10036-100360800 = "Сен"
10036-100360810 = "Сенсей!"
10036-100360820 = "Мне так жаль, Сенсей, я"
10036-100360830 = "снова перепутала бэнто с журналом учёта и по ошибке принесла его..."
10036-100360840 = "Увы, я и сама только что заметила."
10036-100360850 = "Неудивительно, что он был таким тяжёлым. Давайте снова встретимся там."
10036-100360860 = "А."
10036-100360870 = "Хорошо!"
10036-100360880 = "Спасибо, Сенсей..."
