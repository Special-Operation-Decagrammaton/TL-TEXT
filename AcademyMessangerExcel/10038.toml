[translation]
10038-100380010 = "RABBIT1, запрашиваю разрешение на посадку."
10038-100380020 = "...Мияко? Ты не ошиблась адресатом?"
10038-100380030 = "Снижаюсь до высоты 2000 футов, готовность."
10038-100380040 = "...???"
10038-100380050 = "До цели примерно 1.5 мили – скоро вхожу."
10038-100380060 = "...Мияко? Куда ты собираешься входить?"
10038-100380070 = "Внезапный вопрос, Сенсей: вы любите собак или кошек?"
10038-100380080 = "Собак."
10038-100380090 = "Кошек."
10038-100380100 = "Понятно. Многие любят собак за верность и дружелюбие."
10038-100380110 = "Понятно. Кошек действительно любят за их милую и независимую привлекательность."
10038-100380120 = "А ты, Мияко, любишь собак или кошек?"
10038-100380130 = "Ну, я..."
10038-100380140 = "...Если уж на то пошло, скорее, кроликов."
10038-100380160 = "Сенсей, посмотрите на фото."
10038-100380170 = "Он как раз поел и спит."
10038-100380180 = "Очень милый."
10038-100380190 = "Правда? В кроликах есть своя прелесть, не как у собак или кошек."
10038-100380200 = "Когда он проснётся, я пришлю ещё фото."
10038-100380210 = "Кстати, я ещё не придумала имя тому кролику, которого вы подарили."
10038-100380220 = "Не придумаете ли имя, которое отражало бы его милый, любимый и храбрый характер?"
10038-100380230 = "Стэнфорд II."
10038-100380240 = "Унагидон."
10038-100380250 = "По-моему, это слишком вычурно для кролика..."
10038-100380260 = "...Думаю, не стоит так называть кролика."
10038-100380270 = "Тогда как насчёт «Пёнько»?"
10038-100380280 = "Пёнько, Пёнько..."
10038-100380290 = "Да, отличное имя."
10038-100380300 = "Тогда отныне я буду звать этого кролика Пёнько."
10038-100380310 = "Это RABBIT1, запрашиваю разрешение на взлёт..."
10038-100380320 = "Мияко, стоп! Стоп!"
10038-100380330 = "...А? Сенсей?"
10038-100380340 = "А. Опять ошиблась адресатом, простите."
10038-100380350 = "Сегодня опять высадка?"
10038-100380360 = "Да. На 22:00 запланирована операция по высадке с вертолёта."
10038-100380370 = "Задание — атаковать контрабандистов, незаконно ввозящих животных в Кивотос."
10038-100380380 = "Я тоже пойду с тобой на эту высадку."
10038-100380390 = "А? Вы тоже сядете в вертолёт, Сенсей?"
10038-100380400 = "Это опасно... Вы уверены?"
10038-100380410 = "Сенсей, можно вас на минуту?"
10038-100380420 = "Нет, я не по делу..."
10038-100380430 = "Я лучше напишу позже."
10038-100380440 = "Прости, Мияко. Я был на совещании, поэтому задержался."
10038-100380450 = "Мияко...?"
10038-100380460 = "Раньше, когда я училась в СРТ, я не знала,"
10038-100380470 = "но в долгой полевой жизни летом труднее, чем зимой."
10038-100380480 = "Что-то случилось?"
10038-100380490 = "Да. Недавно начался сезон дождей."
10038-100380500 = "Снаряжение ржавеет, еда портится быстрее,"
10038-100380510 = "и это доставляет много хлопот."
10038-100380520 = "А главное — из-за дождя бельё никак не сохнет..."
10038-100380530 = "Мы все думали, как быть."
10038-100380540 = "Тогда не хочешь постирать в Шале?"
10038-100380550 = "В Шале?"
10038-100380560 = "В комнате отдыха Шале есть сушилка."
10038-100380570 = "Думаю, полдня хватит, чтобы высушить."
10038-100380580 = "Нет, даже если вы так говорите, я не могу"
10038-100380590 = "злоупотреблять вашей добротой."
10038-100380600 = "Только на этот раз..."
10038-100380610 = "Пожалуйста..."
