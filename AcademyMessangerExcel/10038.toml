[translation]
10038-100380010 = "Aqui é RABBIT 1, solicitando permissão para pouso."
10038-100380020 = "...Miyako? Não mandou mensagem para a pessoa errada?"
10038-100380030 = "Descendo para a altitude de 2.000 pés, preparativos concluídos."
10038-100380040 = "...???"
10038-100380050 = "Cerca de 1,5 milha até o alvo — iniciando incursão em instantes."
10038-100380060 = "...Miyako? Onde é que você está prestes a invadir?"
10038-100380070 = "Mudando de assunto de repente, Sensei, você prefere cães ou gatos?"
10038-100380080 = "Prefiro cães."
10038-100380090 = "Prefiro gatos."
10038-100380100 = "Entendo. De fato, os cães são leais e muito amigáveis, então muita gente gosta deles."
10038-100380110 = "Entendo. De fato, os gatos são fofos e têm aquele charme meio arisco, então muita gente gosta deles."
10038-100380120 = "E você, Miyako? Prefere cães ou gatos?"
10038-100380130 = "Vejamos, eu..."
10038-100380140 = "...Se tiver que escolher, acho que prefiro coelhos."
10038-100380160 = "Sensei, aqui está uma foto."
10038-100380170 = "Acabou de comer a ração e pegou no sono."
10038-100380180 = "Que fofura!"
10038-100380190 = "Não é? Os coelhos têm um encanto diferente do dos cães e gatos."
10038-100380200 = "Mais tarde, quando acordar, tiro outra foto e mando para você."
10038-100380210 = "Aliás, ainda não decidimos o nome daquele coelho que você nos deu de presente, Sensei."
10038-100380220 = "Você teria alguma sugestão de nome que expresse bem a personalidade fofa, adorável e corajosa deste coelho?"
10038-100380230 = "Stanford II"
10038-100380240 = "Tigela de Enguia (Unagidon)"
10038-100380250 = "Acho que esse nome é um pouco pomposo demais para colocar em um coelho..."
10038-100380260 = "...Acho meio questionável dar um nome desses para um coelho."
10038-100380270 = "Que tal \"Pyonko\", então?"
10038-100380280 = "Pyonko, Pyonko..."
10038-100380290 = "Sim, acho um nome adorável."
10038-100380300 = "Então, a partir de agora, vamos chamar este coelhinho de Pyonko."
10038-100380310 = "Aqui é RABBIT 1. Solicitando permissão para decolagem..."
10038-100380320 = "Miyako, pare! Pare!"
10038-100380330 = "...Ué? Sensei?"
10038-100380340 = "Ah. Enviei para o destinatário errado de novo, mil desculpas."
10038-100380350 = "Hoje vocês têm outra operação de salto?"
10038-100380360 = "Sim. Hoje, às 22h00, está programada uma operação de desembarque aéreo de helicóptero."
10038-100380370 = "É uma missão de ataque contra contrabandistas que estão importando animais ilegalmente para Kivotos."
10038-100380380 = "Vou acompanhar vocês nessa operação de salto desta vez."
10038-100380390 = "Como? Você também vai embarcar no helicóptero conosco, Sensei?"
10038-100380400 = "Acho que pode ser perigoso... Tem certeza disso?"
10038-100380410 = "Sensei, você tem um minutinho...?"
10038-100380420 = "Não, não entrei em contato por nenhum assunto urgente em especial, mas..."
10038-100380430 = "Pensando bem, entro em contato novamente mais tarde."
10038-100380440 = "Desculpa, Miyako. Eu estava em reunião e acabei demorando para ver a mensagem."
10038-100380450 = "Miyako...?"
10038-100380460 = "Na época em que vivíamos na Academia Especial SRT eu não fazia ideia, mas"
10038-100380470 = "quando se acampa por um longo período, o verão é muito mais difícil do que o inverno."
10038-100380480 = "Aconteceu alguma coisa?"
10038-100380490 = "Sim. Como entramos na estação chuvosa recentemente,"
10038-100380500 = "os equipamentos enferrujam e a comida estraga muito mais rápido,"
10038-100380510 = "então estamos passando por vários apuros."
10038-100380520 = "E, acima de tudo, por causa da chuva a roupa lavada não seca de jeito nenhum..."
10038-100380530 = "Estávamos todas aqui quebrando a cabeça para saber o que fazer."
10038-100380540 = "Nesse caso, que tal lavar a roupa na Schale?"
10038-100380550 = "Na Schale, você diz?"
10038-100380560 = "Na sala de descanso da Schale também tem secadora,"
10038-100380570 = "então acho que em meio dia tudo fica sequinho."
10038-100380580 = "Não, por mais que você esteja oferecendo, Sensei,"
10038-100380590 = "não podemos abusar da sua boa vontade assim..."
10038-100380600 = "Só desta vez..."
10038-100380610 = "Por favor..."
