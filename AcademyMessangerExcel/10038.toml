[translation]
10038-100380010 = "<SYSTEM> Это RABBIT 1. Запрашиваю разрешение на посадку."
10038-100380020 = "Мияко? Кажется, ты отправила это не тому человеку."
10038-100380030 = "<SYSTEM> Снижаюсь до высоты 2000 футов. Готова к снижению."
10038-100380040 = "...???"
10038-100380050 = "<SYSTEM> До цели около 1,5 мили. Скоро входим."
10038-100380060 = "...Мияко? Ты сейчас куда-то проникаешь?"
10038-100380070 = "Сенсей, вы больше любите собак или кошек?"
10038-100380080 = "Собак."
10038-100380090 = "Кошек."
10038-100380100 = "Понятно. Собаки верные и послушные, поэтому многие их любят."
10038-100380110 = "Понятно. Кошки милые и своенравные, поэтому многие их любят."
10038-100380120 = "А ты кого больше любишь, Мияко — собак или кошек?"
10038-100380130 = "Ну, вообще-то... Думаю..."
10038-100380140 = "Я люблю кроликов."
10038-100380160 = "Сенсей, вот фотография кролика, которого мы приютили."
10038-100380170 = "Она уснула сразу после еды."
10038-100380180 = "Какой милый кролик."
10038-100380190 = "Правда? У кроликов своё очарование, не такое, как у собак или кошек."
10038-100380200 = "Когда она проснётся, я сделаю для вас ещё одну фотографию."
10038-100380210 = "Кстати, я ещё не придумала ей имя."
10038-100380220 = "Какое имя подошло бы такому милому и храброму кролику?"
10038-100380230 = "Ватсон Второй."
10038-100380240 = "Унадон."
10038-100380250 = "Для кролика это звучит слишком роскошно."
10038-100380260 = "...Я не хочу, чтобы моего кролика кто-нибудь съел."
10038-100380270 = "Как тебе «Бун-Бун»?"
10038-100380280 = "Бун-Бун..."
10038-100380290 = "Да, думаю, это отличное имя."
10038-100380300 = "Пусть будет Бун-Бун."
10038-100380310 = "<SYSTEM> Это RABBIT 1. Запрашиваю разрешение на посадку."
10038-100380320 = "Мияко! Стой! Стой!"
10038-100380330 = "А? Сенсей?"
10038-100380340 = "О... Я снова перепутала ваш адрес с диспетчерской вертолётов. Простите."
10038-100380350 = "У тебя сегодня операция?"
10038-100380360 = "Да, Сенсей. Сегодня в 2200 запланирована операция по высадке с вертолёта."
10038-100380370 = "Задача — провести рейд на контрабандистов, которые незаконно ввозят животных в Кивотос."
10038-100380380 = "Я пойду."
10038-100380390 = "А? Вы хотите полететь на вертолёте?"
10038-100380400 = "Но это будет опасно... Вы уверены?"
10038-100380410 = "Сенсей, вы здесь?"
10038-100380420 = "Ничего особенного. Просто проверяю связь..."
10038-100380430 = "Напишу позже."
10038-100380440 = "Прости, Мияко. Я был на совещании и только сейчас увидел."
10038-100380450 = "Мияко...?"
10038-100380460 = "Пока я жила в SRT, мне не приходилось об этом задумываться,"
10038-100380470 = "но длительный лагерь летом на самом деле тяжелее, чем зимой."
10038-100380480 = "Почему?"
10038-100380490 = "Летом сезон дождей гораздо суровее."
10038-100380500 = "Из-за постоянных ливней оборудование ржавеет, а еда быстро портится."
10038-100380510 = "Мы столкнулись с разными трудностями..."
10038-100380520 = "Особенно сложно понять, как сушить одежду..."
10038-100380530 = "У меня и остальных членов отряда уже закончились идеи. Грязного белья становится всё больше."
10038-100380540 = "Почему бы просто не принести его в Шале?"
10038-100380550 = "В Шале...?"
10038-100380560 = "В комнате отдыха Шале есть стиральная и сушильная машины."
10038-100380570 = "Это займёт всего полдня."
10038-100380580 = "О... Я благодарна за предложение, но..."
10038-100380590 = "То есть..."
10038-100380600 = "Ну, наверное... только в этот раз..."
10038-100380610 = "Хорошо. Скоро буду."
