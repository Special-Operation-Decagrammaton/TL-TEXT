[translation]
20017-200170010 = "Olá, Sensei. Ehehe..."
20017-200170020 = "Hum, esta é mesmo a conta do Sensei, né?"
20017-200170030 = "Hiyori?"
20017-200170040 = "Ehehe... Sim. Hum, é que agora eu achei um Wi-Fi gra"
20017-200170060 = "...?"
20017-200170070 = "...Hiyori?"
20017-200170080 = "tuito dando sopa... ehehe."
20017-200170090 = "Digamos que sempre há uma forma de sobreviver..."
20017-200170100 = "Hum... Então, o que você está fazendo agora, Sensei?"
20017-200170110 = "Sensei?"
20017-200170120 = "Ué, por que você não me responde?"
20017-200170130 = "...Será que, no fim das contas, até você me abandonou, Sensei?"
20017-200170140 = "É isso, não é? Acabou, agora é o fim mesmo, está tudo acabado buáááásocorrooo"
20017-200170150 = "Calma, Hiyori, dá uma olhada no sinal da sua conexão."
20017-200170160 = "Como é Wi-Fi grátis, as mensagens podem estar demorando para chegar."
20017-200170170 = "Ah, é-é verdade. O Wi-Fi tinha caído mesmo..."
20017-200170180 = "Então era só isso..."
20017-200170190 = "Me desculpe..."
20017-200170200 = "Sensei... Ehehe, olá."
20017-200170210 = "Hoje é o meu dia de sorte."
20017-200170220 = "Pensar que até na minha vida, que é como um cogumelo brotando de uma marmita vencida de loja de conveniência... algo tão bom poderia acontecer."
20017-200170230 = "Aconteceu alguma coisa boa?"
20017-200170240 = "Sim! Na verdade, hoje..."
20017-200170250 = "Ah, acho que é mais rápido você ver com os próprios olhos. Só um minutinho..."
20017-200170260 = "Vou te mandar uma foto."
20017-200170270 = "Sensei, consegue ver isto aqui?"
20017-200170280 = "A imagem não foi enviada...? Ué, por quê?"
20017-200170290 = "Buááá! O Wi-Fi caiu de novo!"
20017-200170300 = "Quando eu penso que não pode piorar, acontece exatamente o pior! Que sofrimento... É igualzinho"
20017-200170310 = "...Espera aí, vamos nos encontrar e conversar pessoalmente."
20017-200170320 = "à minha vida, este celular que não consegue nem mandar uma simples imagem... Hã?! Quê?! V-Você vem até aqui?"
20017-200170330 = "...Sensei. Parando para pensar, acho que acabei nem te agradecendo direito..."
20017-200170340 = "M-Muito obrigada..."
20017-200170350 = "Se as meninas descobrirem que você cuidou de mim de novo, vão brigar comigo..."
20017-200170360 = "Então vou guardar as revistas que você comprou para mim como um segredo só meu..."
20017-200170370 = "Sensei! Na edição mais recente da \"ron-ro\"..."
20017-200170380 = "Parece que tem uma matéria especial chamada"
20017-200170390 = "\"Top 10 Segredos que a Escola Jamais Vai te Ensinar\"!!"
20017-200170400 = "Hum... É-É mesmo?"
20017-200170410 = "Segredos que a escola jamais vai nos ensinar..."
20017-200170420 = "O que será que pode ser...? Você faz alguma ideia, Sensei?"
20017-200170430 = "Eu também não faço a menor ideia..."
20017-200170440 = "B-Boa pergunta... O que será, né?"
20017-200170450 = "O que será que é tão secreto que nem mesmo você sabe, Sensei?!"
20017-200170460 = "Normalmente leva meses até a edição mais recente ir parar no lixo reciclável..."
20017-200170470 = "Como é que eu vou aguentar esperar tudo isso...? Acabou, é o fim do mundo, definitivamente o fim."
20017-200170480 = "E olha que ler revistas é a única coisa que tenho para fazer quando estou sozinha..."
