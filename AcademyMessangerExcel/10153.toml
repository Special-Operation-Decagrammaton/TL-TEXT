[translation]
10153-101530010 = "Sensei, I have something I'd like to give you."
10153-101530020 = "It's a Gehenna Cup collaboration Peroro-sama!"
10153-101530030 = "I was lucky enough to get two of them,"
10153-101530040 = "so I'm giving one to you, Sensei! (≧∇≦)v"
10153-101530050 = "Are you sure it's okay for me to have such a rare item!?"
10153-101530060 = "Of course!"
10153-101530070 = "See you later, then!"
10153-101530080 = "Sensei,"
10153-101530090 = "This might just be my imagination,"
10153-101530100 = "but today it felt like I was drawing a lot of attention..."
10153-101530110 = "I kind of felt that too,"
10153-101530120 = "but I don't think you need to worry about it."
10153-101530130 = "Even if you say that..."
10153-101530140 = "As I thought,"
10153-101530150 = "should I have made it flashier?"
10153-101530160 = "Maybe it didn't look very athlete-like."
10153-101530170 = "That's probably not it,"
10153-101530180 = "I think you're fine just the way you are!"
10153-101530190 = "Is that so!?"
10153-101530200 = "Then what on earth was the problem? ((º□º;))"
10153-101530210 = "Hello, Sensei!"
10153-101530220 = "If you don't mind,"
10153-101530230 = "would you like to go shopping with me later?"
10153-101530240 = "Sure! I was just looking to change of pace."
10153-101530250 = "Thank you! (≧∇≦)"
10153-101530260 = "I'll bring out Crusader-chan!"
10153-101530270 = "I'll come pick you up! ヾ(•ω•`)o"
10153-101530280 = "Sensei, are you alright...?"
10153-101530290 = "I didn't mean to drive like that,"
10153-101530300 = "but I really wanted to stop them, and I just..."
10153-101530310 = "I'm okay! That was so cool!"
10153-101530320 = "You looked like a hero!"
10153-101530330 = "I-It wasn't quite that...!"
10153-101530340 = "I'll drive safely from now on!"
10153-101530350 = "I promise!"
10153-101530360 = "Hello, Sensei!"
10153-101530370 = "All of a sudden, but could you give me your signature?"
10153-101530380 = "Sure, but what kind of document is it?"
10153-101530390 = "It's an extracurricular activity participation certificate!"
10153-101530400 = "It looks like I need the advisor's signature."
10153-101530410 = "If you don't mind, I'll stop by later!"
10153-101530420 = "Of course!"
10153-101530430 = "Thank you very much!"
10153-101530440 = "See you later, then! (^▽^)v"
10153-101530450 = "Sensei, did you make it back safely?"
10153-101530460 = "Thank you for signing those documents earlier."
10153-101530470 = "I feel like I'm always relying on you, Sensei..."
10153-101530480 = "Don't worry about it! It's a special request from Hifumi, after all!"
10153-101530490 = "Special... ehehe."
10153-101530500 = "I feel a bit energized now. Thank you, Sensei!"
10153-101530510 = "Are you busy right now?"
10153-101530520 = "There's something I'd like to get your opinion on."
10153-101530530 = "I'd be so happy if you could help..."
10153-101530540 = "Of course! Leave it to me!"
10153-101530550 = "I'll help you with top priority!"
10153-101530560 = "Thank you so much!"
10153-101530570 = "Then, I'll be waiting behind the lodge! (≧∇≦)/"
10153-101530580 = "Sensei!!"
10153-101530590 = "Are your clothes dirty!?"
10153-101530600 = "I think I'm fine... Why do you ask?"
10153-101530610 = "Phew, I'm glad..."
10153-101530620 = "Ah, um... Did any happen to get on your hands?"
10153-101530630 = "Ah, just a tiny bit."
10153-101530640 = "Awawawa!"
10153-101530650 = "I'm so sorry!!"
10153-101530660 = "I'll bring some detergent right away!!"
