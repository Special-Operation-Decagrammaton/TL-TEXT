[translation]
10153-101530010 = "Sensei, tenho um presente que queria muito te entregar!"
10153-101530020 = "É um Peroro-sama da colaboração especial com a Copa Gehenna!"
10153-101530030 = "Como dei a sorte de ganhar 2,"
10153-101530040 = "vou dar 1 para você, Sensei! (≧∇≦)v"
10153-101530050 = "Tem certeza de que posso ficar com um item tão raro assim?!"
10153-101530060 = "Claro que sim!"
10153-101530070 = "Nos vemos mais tarde!"
10153-101530080 = "Sensei."
10153-101530090 = "Pode ser só impressão minha, mas..."
10153-101530100 = "Sinto que hoje eu estava atraindo um monte de olhares..."
10153-101530110 = "Eu também tive um pouco essa impressão,"
10153-101530120 = "mas acho que não precisa esquentar com isso."
10153-101530130 = "Mesmo você dizendo isso..."
10153-101530140 = "Pensando bem,"
10153-101530150 = "será que eu devia ter deixado o visual mais chamativo?"
10153-101530160 = "Talvez eu não estivesse parecendo uma piloto de verdade."
10153-101530170 = "Tenho quase certeza de que o motivo não era esse."
10153-101530180 = "Acho que está ótimo do jeitinho que está!"
10153-101530190 = "Sério mesmo?!"
10153-101530200 = "Então qual será que era o problema? ((º□º;))"
10153-101530210 = "Olá, Sensei!"
10153-101530220 = "Se você estiver livre,"
10153-101530230 = "gostaria de ir fazer compras comigo daqui a pouco?"
10153-101530240 = "Bora! Eu tava mesmo querendo espairecer um pouco."
10153-101530250 = "Muito obrigada! (≧∇≦)"
10153-101530260 = "Vou tirar a Crusader-chan da garagem!"
10153-101530270 = "Já passo aí para te buscar! ヾ(•ω•`)o"
10153-101530280 = "Sensei, você está bem...?"
10153-101530290 = "Eu não tinha a intenção de dirigir de um jeito tão radical,"
10153-101530300 = "mas eu precisava parar aquilo de qualquer jeito e acabei me empolgando..."
10153-101530310 = "Tô ótimo! Você mandou super bem!"
10153-101530320 = "Parecia até uma heroína de cinema!"
10153-101530330 = "N-Não foi pra tanto assim...!"
10153-101530340 = "Na próxima vez vou dirigir com toda a prudência!"
10153-101530350 = "Sem falta!"
10153-101530360 = "Olá, Sensei!"
10153-101530370 = "Sei que é meio de repente, mas você poderia assinar um documento pra mim?"
10153-101530380 = "Claro, mas que documento é esse?"
10153-101530390 = "É o certificado de participação em atividades extracurriculares!"
10153-101530400 = "Parece que precisa da assinatura do orientador responsável,"
10153-101530410 = "então, se puder, passo aí mais tarde para pegar!"
10153-101530420 = "Com certeza!"
10153-101530430 = "Muito obrigada!"
10153-101530440 = "Até mais tarde, então! (^▽^)v"
10153-101530450 = "Sensei, chegou bem de volta?"
10153-101530460 = "Muito obrigada pela assinatura de agora há pouco."
10153-101530470 = "Você está sempre me salvando, Sensei..."
10153-101530480 = "Imagina! Para um pedido especial da Hifumi, faço com gosto!"
10153-101530490 = "Especial... ehehe."
10153-101530500 = "Isso me deu um baita ânimo. Muito obrigada, Sensei!"
10153-101530510 = "Você está ocupado agora?"
10153-101530520 = "Tem uma coisa sobre a qual eu queria ouvir a sua opinião,"
10153-101530530 = "e ficaria muito feliz se você pudesse me ajudar..."
10153-101530540 = "Claro! Deixa comigo!"
10153-101530550 = "Vou te ajudar com prioridade máxima!"
10153-101530560 = "Muito obrigada!"
10153-101530570 = "Então vou estar te esperando no morro atrás da pousada! (≧∇≦)/"
10153-101530580 = "Sensei!!"
10153-101530590 = "Sua roupa não ficou suja?!"
10153-101530600 = "Acho que não... Por quê?"
10153-101530610 = "Ufa, que alívio..."
10153-101530620 = "Ah, hum... mas por acaso não sujou um pouquinho a sua mão?"
10153-101530630 = "Ah, pegou só um tiquinho na mão."
10153-101530640 = "Ai, meu Deus!"
10153-101530650 = "Mil desculpas!!"
10153-101530660 = "Vou levar sabão pra você agora mesmo!!"
