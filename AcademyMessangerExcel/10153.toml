[translation]
10153-101530010 = "Сенсей, я хочу кое-что вам подарить."
10153-101530020 = "Это Пероро из коллаборации Gehenna Cup!"
10153-101530030 = "Мне посчастливилось получить два."
10153-101530040 = "Я подарю вам один, Сенсей! (≧∇≦)v"
10153-101530050 = "Вы уверены, что хотите такой редкий предмет?!"
10153-101530060 = "Конечно!"
10153-101530070 = "Увидимся позже!"
10153-101530080 = "Сенсей"
10153-101530090 = "Возможно, я ошибаюсь, но..."
10153-101530100 = "Сегодня мне казалось, что я привлекаю к себе внимание..."
10153-101530110 = "Я тоже так чувствовал."
10153-101530120 = "Думаю, тебе не стоит об этом беспокоиться."
10153-101530130 = "Даже если ты так скажешь..."
10153-101530140 = "Я так и думал."
10153-101530150 = "Может, стоило сделать это более броским?"
10153-101530160 = "Может, я не произвёл впечатления повесы."
10153-101530170 = "Не думаю."
10153-101530180 = "Думаю, ты и так хорош!"
10153-101530190 = "Вот как!?"
10153-101530200 = "Тогда в чём проблема? ((º□º;))"
10153-101530210 = "Здравствуйте, Сенсей!"
10153-101530220 = "Если вы не возражаете."
10153-101530230 = "Пойдёмте вместе по магазинам после этого?"
10153-101530240 = "Конечно! Я просто хотел сменить обстановку."
10153-101530250 = "Спасибо! (≧∇≦)"
10153-101530260 = "Я выведу Крестоносца!"
10153-101530270 = "Я приеду за тобой! ヾ(•ω•`)o"
10153-101530280 = "Сенсей, вы в порядке...?"
10153-101530290 = "Я не собирался так ехать."
10153-101530300 = "Мне просто очень захотелось, и пришлось остановиться..."
10153-101530310 = "Я в порядке! Это было круто!"
10153-101530320 = "Вы были как герой!"
10153-101530330 = "Я... я не так уж плохо справляюсь...!"
10153-101530340 = "В следующий раз я буду ехать осторожно!"
10153-101530350 = "Конечно!"
10153-101530360 = "Здравствуйте, Сенсей!"
10153-101530370 = "Извините, не могли бы вы поставить свою подпись?"
10153-101530380 = "Конечно, но что это за документ?"
10153-101530390 = "Это свидетельство об участии во внеклассных мероприятиях!"
10153-101530400 = "Похоже, нужна подпись руководителя."
10153-101530410 = "Если можно, я приду позже!"
10153-101530420 = "Конечно!"
10153-101530430 = "Спасибо!"
10153-101530440 = "Увидимся позже! (^▽^)v"
10153-101530450 = "Сенсей, вы благополучно вернулись?"
10153-101530460 = "Спасибо, что подписали раньше."
10153-101530470 = "Я всегда буду вам благодарен, Сенсей..."
10153-101530480 = "Не беспокойтесь! Это особая просьба от Хифуми!"
10153-101530490 = "Особенная... хе-хе"
10153-101530500 = "Теперь я чувствую себя намного лучше. Спасибо, Сенсей!"
10153-101530510 = "Вы сейчас заняты?"
10153-101530520 = "Я хотел бы узнать ваше мнение."
10153-101530530 = "Я был бы очень рад, если бы вы могли сделать это для меня..."
10153-101530540 = "Конечно! Доверьте это мне!"
10153-101530550 = "Я помогу вам в первую очередь!"
10153-101530560 = "Спасибо!"
10153-101530570 = "Тогда я буду ждать вас на холме за гостиницей! (≧∇≦)/"
10153-101530580 = "Сенсей!!"
10153-101530590 = "Ваша одежда грязная!?"
10153-101530600 = "Думаю, с ней всё в порядке... что случилось?"
10153-101530610 = "Фух, это хорошо..."
10153-101530620 = "Эм, ну... возможно, немного попало вам на руки?"
10153-101530630 = "А, совсем чуть-чуть."
10153-101530640 = "О нет!"
10153-101530650 = "Мне очень жаль!!"
10153-101530660 = "Я сейчас же принесу моющее средство!!"