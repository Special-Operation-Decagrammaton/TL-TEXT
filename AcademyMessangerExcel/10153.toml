10153-101530210 = "Hello Sensei!"
10153-101530220 = "If you don't mind"
10153-101530230 = "Would you like to go shopping together?"
10153-101530240 = "Sure thing! I was looking for a little change of pace"
10153-101530250 = "Thank you! (≧∇≦)"
10153-101530260 = "I'll be bringing Crusader-chan!"
