[translation]
26014-260140010 = "Миссия выполнена."
26014-260140020 = "Следующие несколько дней у меня выходные,"
26014-260140030 = "но, думаю, я продолжу носить школьную форму."
26014-260140040 = "Рад, что у тебя есть время отдохнуть."
26014-260140050 = "Чем ты обычно занимаешься в такие дни?"
26014-260140060 = "Эм..."
26014-260140070 = "Ну, чем мне заняться?"
26014-260140080 = "...Почему ты спрашиваешь меня?"
26014-260140090 = "Эй, Сенсей"
26014-260140100 = "Ты сегодня рано встала, да?"
26014-260140110 = "Эм..."
26014-260140120 = "Простите."
26014-260140130 = "Дело в том,"
26014-260140140 = "Я забыла, что у меня выходной, и проснулась рано."
26014-260140150 = "Такое бывает, когда привыкаешь к постоянному расписанию..."
26014-260140160 = "Поэтому я просто сижу в прострации."
26014-260140170 = "Не знаю, что делать дальше..."
26014-260140180 = "Тогда как насчёт прийти отдохнуть в Шале?"
26014-260140190 = "Сегодня было весело."
26014-260140200 = "И ещё"
26014-260140210 = "Прости за то, что было раньше."
26014-260140220 = "Я немного потеряла терпение,"
26014-260140230 = "подумав, что моя помощь тебе не нужна."
26014-260140240 = "Я не хотел беспокоить тебя в выходной, Карин."
26014-260140250 = "Не стесняйтесь."
26014-260140260 = "Если понадобится помощь — просто скажите в любое время."
26014-260140270 = "Эй, Сенсей"
26014-260140280 = "Хорошие новости."
26014-260140290 = "Хорошие новости?"
26014-260140300 = "У меня появилась идея."
26014-260140310 = "Идея, как провести особенный выходной."
26014-260140320 = "Что бы ты ни задумала, я постараюсь помочь!"
26014-260140330 = "Спасибо."
26014-260140340 = "Ваша помощь всегда кстати."
26014-260140350 = "Я уже собираюсь выходить в школу."
26014-260140360 = "Так что, если хотите пойти со мной, можем встретиться у моего дома."
26014-260140370 = "...Твой особенный выходной — в школе?"
