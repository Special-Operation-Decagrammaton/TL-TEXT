[translation]
26014-260140010 = "Sensei, bom trabalho."
26014-260140020 = "Como as missões deram uma trégua,"
26014-260140030 = "recebi alguns dias de folga a partir de hoje."
26014-260140040 = "Folga, que inveja boa..."
26014-260140050 = "O que você costuma fazer nos dias de folga?"
26014-260140060 = "Humm."
26014-260140070 = "Normalmente... minha rotina não muda muito dos dias de missão."
26014-260140080 = "...Tudo bem se eu der uma passada aí?"
26014-260140090 = "Sensei, está acordado?"
26014-260140100 = "O que houve a essa hora?"
26014-260140110 = "Hum..."
26014-260140120 = "Desculpe."
26014-260140130 = "Na verdade... esqueci que hoje era meu dia de folga"
26014-260140140 = "e acabei acordando no horário de sempre."
26014-260140150 = "Quando se leva uma vida regrada, isso acontece mesmo..."
26014-260140160 = "Para ser sincera, estou sem saber o que fazer com tanto tempo livre..."
26014-260140170 = "Se não for incomodar, posso ir para a Schale?"
26014-260140180 = "Claro. Fico te esperando."
26014-260140190 = "Hoje foi muito divertido."
26014-260140200 = "E além disso..."
26014-260140210 = "Eu já sabia, mas você está sempre atarefado mesmo, Sensei."
26014-260140220 = "Vive me dizendo para descansar, mas..."
26014-260140230 = "Você mesmo tem descansado direito, Sensei?"
26014-260140240 = "Graças a você, Karin, hoje consegui relaxar como não fazia há tempos."
26014-260140250 = "Sempre que precisar de mim, pode contar comigo sem cerimônia."
26014-260140260 = "Ajudar você é sempre um prazer, Sensei."
26014-260140270 = "Sensei."
26014-260140280 = "Tive uma ideia de como aproveitar o meu dia de folga do meu próprio jeito."
26014-260140290 = "Aê, que ótimo!"
26014-260140300 = "Então... se você puder..."
26014-260140310 = "Queria muito que você viesse comigo, Sensei..."
26014-260140320 = "Irei com todo o prazer."
26014-260140330 = "Obrigada."
26014-260140340 = "Se você estiver junto, com certeza vai ser divertido."
26014-260140350 = "Bom, estou indo para a escola agora."
26014-260140360 = "Poderia ir me buscar na saída depois?"
26014-260140370 = "...Hã?"
