[translation]
26014-260140010 = "Сенсей, с возвращением."
26014-260140020 = "Задание закончено,"
26014-260140030 = "так что у меня несколько выходных начиная с сегодняшнего дня."
26014-260140040 = "Выходные — это здорово..."
26014-260140050 = "А что ты обычно делаешь в выходные?"
26014-260140060 = "Хм-м"
26014-260140070 = "Обычно... почти как в рабочие дни."
26014-260140080 = "...Можно мне зайти к вам?"
26014-260140090 = "Сенсей, вы не спите?"
26014-260140100 = "В такой час? Что случилось?"
26014-260140110 = "Ну"
26014-260140120 = "Простите."
26014-260140130 = "Я просто... забыла, что у меня выходной,"
26014-260140140 = "и проснулась в обычное время."
26014-260140150 = "Когда ведёшь размеренный образ жизни, так и получается..."
26014-260140160 = "Честно говоря, я не знаю, чем себя занять..."
26014-260140170 = "Если вы не против, я могу зайти в Шале?"
26014-260140180 = "Конечно. Я жду."
26014-260140190 = "Сегодня было весело."
26014-260140200 = "И ещё..."
26014-260140210 = "Я знаю, что вы всегда заняты, но..."
26014-260140220 = "Вы говорите мне «отдыхай», а сами..."
26014-260140230 = "Вы сами-то отдыхаете как следует?"
26014-260140240 = "Благодаря тебе, Карин, я сегодня впервые за долгое время расслабился."
26014-260140250 = "Если я буду нужен, не стесняйтесь обращаться."
26014-260140260 = "Я всегда рада помочь вам."
26014-260140270 = "Сенсей"
26014-260140280 = "Я придумала свой способ проводить выходные."
26014-260140290 = "Отлично!"
26014-260140300 = "И вот... если вы не против..."
26014-260140310 = "я бы хотела, чтобы вы пошли со мной..."
26014-260140320 = "Я с радостью."
26014-260140330 = "Спасибо."
26014-260140340 = "С вами мне будет веселее."
26014-260140350 = "Тогда я сейчас пойду в академию,"
26014-260140360 = "вы сможете зайти за мной?"
26014-260140370 = "...Что?"