[translation]
10134-101340010 = "Você sabia?"
10134-101340020 = "Não adianta nada ter uma armadura se ela não estiver equipada direitinho."
10134-101340030 = "É mesmo?"
10134-101340040 = "O que aconteceu?"
10134-101340050 = "É o básico de qualquer RPG!"
10134-101340060 = "E a Aris acabou de se lembrar de uma coisa!"
10134-101340070 = "Apenas equipar ainda não é o suficiente!"
10134-101340080 = "Sensei,"
10134-101340090 = "o caminho de volta balançou bastante!"
10134-101340100 = "Desculpa, era mais pesado do que eu imaginava..."
10134-101340110 = "Eu dei o meu melhor para carregar, mas..."
10134-101340120 = "Não, foi super divertido, então não se preocupe!"
10134-101340130 = "Parecia até que eu estava em um brinquedo de parque de diversões!"
10134-101340140 = "Menos mal, então..."
10134-101340150 = "Sensei, forme uma party com a Aris, por favor!"
10134-101340160 = "Hoje é mais um dia de treinamento de herói!"
10134-101340170 = "Ó nobre heroína, tem certeza de que apenas isso basta?"
10134-101340180 = "Sensei?"
10134-101340190 = "Preparei um treinamento secreto especial para a Aris! "
10134-101340200 = "Vamos fazer um treino intensivo para subir de nível rapidinho!"
10134-101340210 = "Existe mesmo um treinamento assim?!"
10134-101340220 = "A Aris quer muito saber como é!"
10134-101340230 = "Sensei!"
10134-101340240 = "Isso é incrível mesmo!"
10134-101340250 = "Não fico mais nem um pouquinho tensa usando a Armadura de Herói!"
10134-101340260 = "O treinamento especial deu resultado!"
10134-101340270 = "Tudo graças ao seu esforço, Aris!"
10134-101340280 = "Sozinha, a Aris jamais teria pensado em um treinamento daqueles!"
10134-101340290 = "O Sensei é mesmo incrível!"
10134-101340300 = "Buááá..."
10134-101340310 = "Acho que a Aris falhou como heroína."
10134-101340320 = "Aris?"
10134-101340330 = "Aconteceu alguma coisa?"
10134-101340340 = "A Aris vai voltar a ser uma heroína aprendiz..."
10134-101340350 = "Onde você está agora?"
10134-101340360 = "Me espera aí que já estou indo."
10134-101340370 = "Sensei!"
10134-101340380 = "Você ainda estava acordado!"
10134-101340390 = "Sim, mas..."
10134-101340400 = "Como você descobriu?!"
10134-101340410 = "Fufufu!"
10134-101340420 = "Olhe pela janela, por favor!"
10134-101340430 = "Pela janela?"
10134-101340440 = "Sensei!"
10134-101340450 = "HELP!"
10134-101340460 = "Precisa de ajuda?"
10134-101340470 = "Está em uma aventura hoje também?"
10134-101340480 = "É uma emergência!"
10134-101340490 = "Venha para cá, por favor!"
10134-101340500 = "Sensei!"
10134-101340510 = "Parta em muitas outras aventuras com a Aris de novo, tá?"
10134-101340520 = "Com certeza!"
10134-101340530 = "Afinal, a nossa aventura está só começando."
10134-101340540 = "Sim! A aventura da Aris ainda tem um longo caminho pela frente!"
10134-101340550 = "E agora temos uma nova companheira no grupo também!"
