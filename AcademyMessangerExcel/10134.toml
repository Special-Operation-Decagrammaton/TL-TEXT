[translation]
10134-101340010 = "Сенсей."
10134-101340020 = "От брони нет никакого смысла, если её правильно не экипировать."
10134-101340030 = "Что...?"
10134-101340040 = "В смысле?"
10134-101340050 = "Это базовые знания RPG!"
10134-101340060 = "Однако я узнала кое-что ещё!"
10134-101340070 = "Иногда просто экипировать её недостаточно!"
10134-101340080 = "Сенсей."
10134-101340090 = "Дорога обратно была очень тряской."
10134-101340100 = "Прости, просто это было таким тяжёлым..."
10134-101340110 = "Я изо всех сил старалась выдержать..."
10134-101340120 = "Но всё равно было очень весело!"
10134-101340130 = "Словно я каталась на американских горках в парке развлечений!"
10134-101340140 = "Рад это слышать..."
10134-101340150 = "Алиса отправила вам приглашение в группу."
10134-101340160 = "Сегодня мы снова занимаемся тренировкой Героя!"
10134-101340170 = "Герой, вас устраивает такая тренировка?"
10134-101340180 = "Сенсей?"
10134-101340190 = "Я подготовил для тебя специальный тренировочный курс, Алиса!"
10134-101340200 = "Это суперкурс для быстрого повышения уровня!"
10134-101340210 = "Такое существует?!"
10134-101340220 = "Да, я хочу попробовать!"
10134-101340230 = "Сенсей!"
10134-101340240 = "Это потрясающе!"
10134-101340250 = "Теперь мне больше не тяжело носить броню героя!"
10134-101340260 = "Вот результат специальной тренировки!"
10134-101340270 = "Всё потому, что ты усердно трудилась, Алиса."
10134-101340280 = "Сама я никогда бы не додумалась до такого метода тренировки!"
10134-101340290 = "Вы потрясающий, Сенсей!"
10134-101340300 = "Бу-у..."
10134-101340310 = "Возможно, мне не суждено быть героем."
10134-101340320 = "...Алиса?"
10134-101340330 = "Что происходит?"
10134-101340340 = "Меня понизили до начинающего искателя приключений."
10134-101340350 = "Где вы сейчас?"
10134-101340360 = "Стой, я уже иду."
10134-101340370 = "Сенсей!"
10134-101340380 = "Вы всё ещё не спите!"
10134-101340390 = "Хм? Ага, но..."
10134-101340400 = "Откуда ты узнала?"
10134-101340410 = "Фуфу!"
10134-101340420 = "Посмотрите в окно!"
10134-101340430 = "В окно?"
10134-101340440 = "Сенсей!"
10134-101340450 = "Помоги мне!"
10134-101340460 = "Что происходит?"
10134-101340470 = "Ты сегодня тоже отправляешься в приключение?"
10134-101340480 = "Нет! Совсем не в приключение!"
10134-101340490 = "Это чрезвычайная ситуация!"
10134-101340500 = "Сенсей!"
10134-101340510 = "Пожалуйста, снова отправьтесь со мной в приключение!"
10134-101340520 = "Конечно!"
10134-101340530 = "Приключение ведь только началось, верно?"
10134-101340540 = "Да, моё путешествие ещё не окончено!"
10134-101340550 = "И со мной будут новые союзники!"
