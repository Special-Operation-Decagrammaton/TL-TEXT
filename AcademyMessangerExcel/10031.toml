[translation]
10031-100310010 = "За этот год мы искренне благодарим вас за тёплую поддержку и покровительство Бенрии 68."
10031-100310020 = "...?"
10031-100310030 = "Ч-что значит эта реакция!?"
10031-100310040 = "Прости, просто я удивился."
10031-100310050 = "Дай-ка проверю, кто отправитель..."
10031-100310060 = "Н-ну и ладно! Я великодушная!"
10031-100310070 = "Короче, с официальными приветствиями покончено!"
10031-100310080 = "Итак, Сенсей, до конца года осталось совсем немного."
10031-100310090 = "Есть дела, которые нужно сделать перед Новым годом, так что сегодня вы составите мне компанию."
10031-100310100 = "Кстати, как коллега, вы не имеете права отказаться!"
10031-100310110 = "..."
10031-100310120 = "Ну, Сенсей, вы ведь свободны... да...?"
10031-100310130 = "Позвольте сказать ещё раз: с Новым годом!"
10031-100310140 = "С Новым годом."
10031-100310150 = "Я связалась с вами не просто так..."
10031-100310160 = "Помните, мы брали кимоно напрокат?"
10031-100310170 = "А, когда ты, Ару, всё время уступала."
10031-100310180 = "Если что, можем сходить в магазин вместе и спросить, можно ли его вернуть?"
10031-100310190 = "Нет, не то! И вообще, тогда это были стратегические инвестиции!"
10031-100310200 = "Я просто хотела сказать, что нашла применение тому кимоно...!"
10031-100310210 = "Применение... повесить в офисе, например?"
10031-100310220 = "Я бы не стала звать вас только ради этого! И вообще, вы ведь специально прикидываетесь, да!?"
10031-100310230 = "Было бы слишком печально повесить его и ни разу не надеть!"
10031-100310240 = "...Короче! Я нашла место, куда можно пойти в этом кимоно!"
10031-100310250 = "И притом довольно изысканное место, где кимоно будет уместно..."
10031-100310260 = "Так что я подумала попросить вас проводить меня... как вам?"
10031-100310270 = "Конечно, я и одна справлюсь!"
10031-100310280 = "...Вы заняты?"
10031-100310290 = "Конечно, я пойду."
10031-100310300 = "Да, правильно! Я знала, что вы согласитесь!"
10031-100310310 = "Хе-хе, тогда я буду ждать ♪"
10031-100310320 = "Сенсей, вы помните, о чём мы говорили в прошлый раз?"
10031-100310330 = "Хотя немного поздно, но..."
10031-100310340 = "Вы же ещё не были на новогодних мероприятиях, верно?"
10031-100310350 = "Мы оба были заняты."
10031-100310360 = "Мероприятия, прохождение, предметы..."
10031-100310370 = "Правда?"
10031-100310380 = "...Сенсей, вы в порядке? О чём вы?"
10031-100310390 = "Ну, короче..."
10031-100310400 = "не уделите ли вы мне сегодня немного времени?"
10031-100310410 = "Сенсей, наступил Новый год."
10031-100310420 = "Как вы думаете, предпринимателю стоит участвовать в мероприятиях, которые бывают только в это время?"
10031-100310430 = "Да, я не особенно верю в это."
10031-100310440 = "Нет, ни за что, совсем не в этом дело."
10031-100310450 = "Пойдёмте со мной тянуть бумажку с предсказанием?"
10031-100310460 = "...Ару, ты очень веришь в эти предсказания?"
10031-100310470 = "Хватит об этом! Просто идите скорее!"
