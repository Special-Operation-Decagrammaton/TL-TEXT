[translation]
10031-100310010 = "Agradecemos sinceramente pelo seu caloroso apoio e preferência pela Faz-Tudo 68 ao longo de todo este ano."
10031-100310020 = "...?"
10031-100310030 = "Q-que reação é essa!?"
10031-100310040 = "Desculpa, só fiquei um pouco surpreso."
10031-100310050 = "Deixa eu só conferir quem mandou a mensagem..."
10031-100310060 = "B-bom, deixa pra lá! Afinal, eu sou uma pessoa generosa!"
10031-100310070 = "Enfim, chega de cumprimentos formais!"
10031-100310080 = "Muito bem, Sensei, falta pouquinho para o ano acabar, não é?"
10031-100310090 = "Tenho coisas para resolver para o fim e o começo de ano, então hoje você vai me fazer companhia, ouviu?"
10031-100310100 = "E só para constar, como colega do ramo, você não tem o direito de recusar, Sensei!"
10031-100310110 = "..."
10031-100310120 = "Hum, Sensei, sua agenda está livre, né...? Né...?"
10031-100310130 = "Acho bom desejar formalmente: Feliz Ano-Novo."
10031-100310140 = "Feliz Ano-Novo."
10031-100310150 = "O motivo do meu contato hoje não é outro senão..."
10031-100310160 = "Lembra que eu aluguei um quimono outro dia?"
10031-100310170 = "Ah, daquela vez em que passaram a lábia em você sem parar."
10031-100310180 = "Se quiser, quer que eu vá lá na loja com você para ver se aceitam devolução?"
10031-100310190 = "Não é nada disso! E para sua informação, aquilo foi puramente um investimento estratégico!"
10031-100310200 = "Hoje eu só queria te avisar que surgiu uma ocasião para usar aquele quimono...!"
10031-100310210 = "Uma ocasião... Tipo deixar de enfeite no escritório?"
10031-100310220 = "É óbvio que eu não ia te chamar só pra isso, né!? Aliás, você está falando isso de propósito, não está!?"
10031-100310230 = "Deixar de enfeite sem nem vestir seria triste demais!"
10031-100310240 = "...E-enfim! Surgiu um lugar para eu ir vestindo este quimono!"
10031-100310250 = "E é uma ocasião bem refinada, digna de um quimono..."
10031-100310260 = "Por isso, bom, pensei em pedir para você me escoltar, Sensei... O que acha?"
10031-100310270 = "C-claro que eu poderia ir sozinha sem problema nenhum, tá!?"
10031-100310280 = "...Você está ocupado?"
10031-100310290 = "Claro que eu vou."
10031-100310300 = "N-não é!? Eu sabia que você viria!"
10031-100310310 = "Hehe, então estarei te esperando♪"
10031-100310320 = "Sensei, você lembra do que conversamos outro dia, não lembra?"
10031-100310330 = "Acabou ficando um pouco tarde, mas..."
10031-100310340 = "Já estamos no Ano-Novo e ainda nem fomos a nenhum evento típico de Ano-Novo juntos, né?"
10031-100310350 = "Afinal, nós dois estávamos bem ocupados."
10031-100310360 = "Eventos, farmar fases, itens..."
10031-100310370 = "Pois é, não é?"
10031-100310380 = "...Sensei, você está bem? Do que está falando?"
10031-100310390 = "Bom, de qualquer forma, hum..."
10031-100310400 = "Você poderia me dar um tempinho hoje?"
10031-100310410 = "Sensei, o novo ano começou."
10031-100310420 = "Sendo assim, não acha que participar dos eventos exclusivos desta época também faz parte dos deveres de uma empresária?"
10031-100310430 = "Isso mesmo, não é que eu acredite nessas coisas nem nada,"
10031-100310440 = "sim, de forma alguma, jamais seria por superstição, mas..."
10031-100310450 = "Vamos tirar a sorte no omikuji juntos?"
10031-100310460 = "...Aru, você acredita pra valer em omikuji, né?"
10031-100310470 = "Deixa essa conversa pra lá! Venha logo!"
