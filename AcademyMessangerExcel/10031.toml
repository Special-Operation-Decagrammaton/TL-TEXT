[translation]
10031-100310010 = "Искренне благодарим вас за интерес и любовь к Решалам 68 в этом году."
10031-100310020 = "...?"
10031-100310030 = "Э-Эй! Что за неловкая реакция!"
10031-100310040 = "Я просто опешил от твоего внезапного странного приветствия."
10031-100310050 = "Я подумал, что это спам, потому что ты обычно так не пишешь."
10031-100310060 = "Н-Ну, всё нормально! Ведь я великодушна!"
10031-100310070 = "Хи-хи-хи, хватит формальных приветствий!"
10031-100310080 = "Сенсей, этот год почти закончился."
10031-100310090 = "Поэтому давайте сегодня проведём время вместе."
10031-100310100 = "Кстати, как мой деловой партнёр, вы не имеете права вето!"
10031-100310110 = "Эм..."
10031-100310120 = "Ваше расписание сегодня свободно... правда?"
10031-100310130 = "С Новым годом, Сенсей."
10031-100310140 = "И тебя с Новым годом, Ару."
10031-100310150 = "Кхм, у меня есть веская причина написать вам вот так..."
10031-100310160 = "В прошлый раз... я арендовала то дорогое кимоно, помните?"
10031-100310170 = "Да, тебя тогда так легко развели, Ару."
10031-100310180 = "Хочешь, я схожу вернуть его вместе с тобой?"
10031-100310190 = "П-Погодите! Это было частью стратегической инвестиции!"
10031-100310200 = "Я написала сегодня, чтобы сообщить: я нашла отличный способ использовать этот наряд!"
10031-100310210 = "Я как раз подумал, что он красиво смотрелся бы как украшение комнаты. Помочь?"
10031-100310220 = "Я прошу помощи не потому, что хочу выставить его в офисе!"
10031-100310230 = "Ну же! Что за печальное развитие событий сразу после того, как я гордо заявила, что нашла ему хорошее применение!"
10031-100310240 = "...В-В любом случае, мне нужно кое-куда сходить в этом наряде."
10031-100310250 = "Это очень важная встреча, где элегантное кимоно будет как раз к месту."
10031-100310260 = "Кстати... Что скажете, Сенсей? Я хочу попросить вас сопровождать меня. Пойдёте со мной?"
10031-100310270 = "...К-Конечно, я прекрасно справлюсь одна. Да, никаких проблем, но всё же!"
10031-100310280 = "...Вы пойдёте со мной?"
10031-100310290 = "Да, конечно."
10031-100310300 = "О... Ура!"
10031-100310310 = "Хи-хи, хорошо. Тогда я буду ждать! ♪"
10031-100310320 = "Сенсей, я хотела бы продолжить наш прошлый разговор..."
10031-100310330 = "Так что, хоть уже и поздновато..."
10031-100310340 = "Всё ещё Новый год, а я так и не смогла поучаствовать с вами ни в одном событии."
10031-100310350 = "Мы были слишком заняты для такого."
10031-100310360 = "Уф, участвовать в событиях, фармить предметы...!"
10031-100310370 = "Да?"
10031-100310380 = "А? О чём вы говорите, Сенсей?"
10031-100310390 = "Так вот, я просто подумала..."
10031-100310400 = "Не проведёте ли вы сегодня время со мной, Сенсей?"
10031-100310410 = "Сенсей, наступил Новый год."
10031-100310420 = "Для владельца бизнеса естественно хотеть воспользоваться событиями, которые бывают только в это время года."
10031-100310430 = "Не то чтобы я суеверна или что-то такое."
10031-100310440 = "Конечно нет. Определённо нет. И всё же..."
10031-100310450 = "Как насчёт вместе вытянуть омикудзи?!"
10031-100310460 = "Когда ты так говоришь, кажется, будто ты веришь..."
10031-100310470 = "Н-Неважно! Давайте встретимся!"
