[translation]
16011-160110010 = "Сенсей, у тебя есть минутка?"
16011-160110020 = "Есть документы по предстоящему Фестивалю ореолов Кивотоса, которые нужно проверить..."
16011-160110030 = "Но они касаются других академий, поэтому я хотела бы проверить их вместе с тобой. Ты не против?"
16011-160110040 = "Конечно. Сейчас приду."
16011-160110050 = "Спасибо, Сенсей."
16011-160110060 = "Я сейчас пришлю местоположение."
16011-160110070 = "Огромное спасибо за сегодня, Сенсей."
16011-160110080 = "Я и так была благодарна за твою помощь с проверкой. Не нужно было ещё и провожать меня домой..."
16011-160110090 = "Кстати, я слышала, что ты тоже будешь участвовать в мероприятии."
16011-160110100 = "Надеюсь, увидимся в день соревнований."
16011-160110110 = "Доберись домой безопасно."
16011-160110120 = "Вы сейчас свободны, Сенсей?"
16011-160110130 = "Фестиваль ореолов Кивотоса начинается завтра. Но перед этим..."
16011-160110140 = "А."
16011-160110150 = "Я пишу не потому, что мне нужна консультация или меня что-то тревожит..."
16011-160110160 = "Я просто хотела отплатить тебе за всю помощь."
16011-160110170 = "А, понятно."
16011-160110180 = "Если хочешь, у меня сейчас есть время. Где встретимся?"
16011-160110190 = "Мм."
16011-160110200 = "Спасибо, что согласился. Сейчас же пришлю место."
16011-160110210 = "Я не хотела отнимать у тебя столько времени, Сенсей."
16011-160110220 = "Как всегда, большое спасибо."
16011-160110230 = "Насчёт того лимонного джема с мёдом..."
16011-160110240 = "Его ещё более чем достаточно, поэтому не стесняйся сказать, если закончится."
16011-160110250 = "Эм."
16011-160110260 = "Вообще, совсем не стесняйся писать мне в любое время."
16011-160110270 = "Немного в сторону, но..."
16011-160110280 = "...Бывает у тебя так, что то, что обычно хорошо получается, вдруг становится намного сложнее?"
16011-160110290 = "О чём ты?"
16011-160110300 = "...Это про твою диету?"
16011-160110310 = "Просто... словно что-то витает в воздухе... и все эти виды вокруг меня..."
16011-160110320 = "...Неважно. Пожалуйста, не обращай внимания."
16011-160110330 = "Прости, что заговорила об этом, Сенсей."
16011-160110340 = "Прости, Сенсей. Не могу поверить, что съела всё целиком. И после всех трудов, которые приложила, чтобы отдать это тебе..."
16011-160110350 = "Я принесу тебе ещё потом."
16011-160110360 = "Всё нормально. В следующий раз можем поесть вместе."
16011-160110370 = "А."
16011-160110380 = "Вместе? В следующий раз?"
16011-160110390 = "Но калории..."
16011-160110400 = "Я не могу... Но ладно."
16011-160110410 = "Спасибо..."
16011-160110420 = "Сенсей."
16011-160110430 = "Знаешь, в последнее время я кое о чём думаю."
16011-160110440 = "Большая часть твоей работы — документы и всё такое за столом, верно?"
16011-160110450 = "Но долго сидеть вредно. Как насчёт лёгких упражнений?"
16011-160110460 = "Предлагаешь упражнения?"
16011-160110470 = "Наверное, спортивный праздник сильно тебя мотивировал."
16011-160110480 = "Эм."
16011-160110490 = "Да, это может показаться немного не в моём характере."
16011-160110500 = "Но, надеюсь, ты понимаешь: я не предлагаю тебе прямо сейчас немедленно вставать и заниматься."
16011-160110510 = "Некоторое время я буду свободна, так что сообщи, если захочешь принять моё предложение."
16011-160110520 = "Увидимся позже, когда бы это ни было..."
16011-160110530 = "Рада, что мы хорошо позанимались вместе."
16011-160110540 = "Но, кажется, в десертном кафе после этого я свела на нет всю тренировку, Сенсей."
16011-160110550 = "Какой смысл тренироваться, если потом так есть?"
16011-160110560 = "Вообще-то, думаю, наоборот. Лучшее в тренировке — потом можно побаловать себя такой едой!"
16011-160110570 = "Считай это работой ради цели или чего-то приятного! Здорово же, правда?"
16011-160110580 = "..."
16011-160110590 = "А."
16011-160110600 = "Вот как?"
16011-160110610 = "Ну, ты меня убедил."
16011-160110620 = "Спасибо. До следующего раза."
