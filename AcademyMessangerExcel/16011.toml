[translation]
16011-160110010 = "Sensei, você teria um momento agora?"
16011-160110020 = "Gostaria de conversar com você sobre o Grande Festival Esportivo que acontecerá em breve......"
16011-160110030 = "Como é um assunto que envolve outras academias também, entrei em contato para saber se você poderia dar uma olhada nisso comigo"
16011-160110040 = "Claro, já estou indo"
16011-160110050 = "Muito obrigada"
16011-160110060 = "Vou te enviar a localização"
16011-160110070 = "Sensei, muito obrigada mesmo por hoje"
16011-160110080 = "Além de me ajudar com a questão, você ainda fez a gentileza de me acompanhar na volta......"
16011-160110090 = "Por falar nisso, sei que você também estará presente no Grande Festival Esportivo, Sensei"
16011-160110100 = "Espero muito que possamos nos encontrar lá no evento também"
16011-160110110 = "Bom, como já está tarde da noite, tome cuidado no caminho de volta, por favor"
16011-160110120 = "Sensei, você está livre agora?"
16011-160110130 = "O Grande Festival Esportivo já começa amanhã, mas antes disso......"
16011-160110140 = "Ah, hum......"
16011-160110150 = "Desta vez não é para tratar de trabalho"
16011-160110160 = "Eu gostaria de agradecer por toda a ajuda que você tem me dado até agora......"
16011-160110170 = "Não precisava se preocupar com isso, mas muito obrigado"
16011-160110180 = "Estou livre, sim. Aonde devo ir?"
16011-160110190 = "Obrigada por responder"
16011-160110200 = "Estarei te aguardando, então"
16011-160110210 = "Desculpe por ter acabado tomando tanto do seu tempo sem querer"
16011-160110220 = "Muito obrigada pela sua consideração"
16011-160110230 = "Hum...... sobre os limões em conserva no mel"
16011-160110240 = "Se não tiver sido suficiente, pode me falar, viu? Ainda tenho bastante aqui"
16011-160110250 = "E, hum......"
16011-160110260 = "Ficarei feliz se você me chamar para outros assuntos também"
16011-160110270 = "Mudando um pouco de assunto......"
16011-160110280 = "Coisas que normalmente conseguimos controlar bem acabam ficando difíceis quando o ambiente muda, não é mesmo......?"
16011-160110290 = "Por que isso de repente?"
16011-160110300 = "......Por acaso está falando da dieta?"
16011-160110310 = "O clima ao redor deixa todo mundo empolgado, e ainda tem esta roupa......"
16011-160110320 = "Não, não é nada...... por favor, ignore o que eu disse"
16011-160110330 = "Desculpe por puxar um assunto tão estranho"
16011-160110340 = "Perdão, Sensei. Era um presente para você, mas eu mesma acabei comendo tudo......"
16011-160110350 = "Vou preparar outra porção para você depois"
16011-160110360 = "Não tem problema. Na próxima a gente come junto de novo"
16011-160110370 = "Hum...... é que"
16011-160110380 = "Comer junto de novo......"
16011-160110390 = "As calorias são um pouquinho......"
16011-160110400 = "Quer dizer, sim......"
16011-160110410 = "Muito obrigada......"
16011-160110420 = "Olá, Sensei"
16011-160110430 = "Há algo que vem me preocupando ultimamente"
16011-160110440 = "A maior parte do seu trabalho envolve lidar com documentos...... ou seja, trabalho de escritório, certo?"
16011-160110450 = "Ouvi dizer que ficar sentado o tempo todo não faz bem à saúde, então que tal fazer um pouco de exercício leve?"
16011-160110460 = "Verdade, acabo ficando bem sedentário. Mas por que isso de repente?"
16011-160110470 = "A Hasumi despertou o gosto por exercícios no Grande Festival Esportivo......?!"
16011-160110480 = "Ah, hum......"
16011-160110490 = "Desculpe falar assim do nada...... É que eu pensei que, se você quisesse......"
16011-160110500 = "Não quero dizer que precisamos nos exercitar agora mesmo, mas"
16011-160110510 = "Hum, eu estarei com a agenda livre pelos próximos dias"
16011-160110520 = "Então ficarei muito feliz se você me chamar quando tiver um tempinho"
16011-160110530 = "Até a parte de nos exercitarmos juntos foi tudo ótimo, mas"
16011-160110540 = "Na cafeteria em que paramos na volta, acabamos comendo uma bela quantidade de doces, não foi?"
16011-160110550 = "Desse jeito, todo o exercício que fizemos perde o sentido......"
16011-160110560 = "Pelo contrário! A gente se exercita justamente para poder comer coisas gostosas!"
16011-160110570 = "Nós nos esforçamos em busca da felicidade, então valeu muito a pena!"
16011-160110580 = "......"
16011-160110590 = "S-"
16011-160110600 = "Será mesmo?"
16011-160110610 = "......Tem razão, hehe. Acho que pensar assim é muito melhor"
16011-160110620 = "Muito obrigada. Conto com a sua companhia na próxima vez também"
