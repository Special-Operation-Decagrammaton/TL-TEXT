[translation]
16011-160110010 = "Сенсей, у вас есть сейчас время?"
16011-160110020 = "У меня вопрос насчёт предстоящего большого спортивного праздника..."
16011-160110030 = "Поскольку это касается и других академий, если вы не против, я хотела бы попросить вас присутствовать вместе со мной, поэтому и связалась с вами."
16011-160110040 = "Конечно, я сейчас приду."
16011-160110050 = "Спасибо."
16011-160110060 = "Я пришлю вам место."
16011-160110070 = "Сенсей, спасибо большое за сегодня."
16011-160110080 = "Вы не только выслушали мою просьбу, но и проводили меня..."
16011-160110090 = "Кстати, я знаю, что вы тоже будете на большом спортивном празднике."
16011-160110100 = "Буду рада, если мы встретимся и на месте."
16011-160110110 = "Уже поздно, так что будьте осторожны на обратном пути."
16011-160110120 = "Сенсей, у вас есть сейчас время?"
16011-160110130 = "Завтра уже начинается большой спортивный праздник, но перед этим..."
16011-160110140 = "А, эм..."
16011-160110150 = "На этот раз не по делу..."
16011-160110160 = "Я хотела отблагодарить вас за помощь."
16011-160110170 = "Не стоило так беспокоиться, но спасибо."
16011-160110180 = "Всё в порядке. Куда мне прийти?"
16011-160110190 = "Спасибо за ответ."
16011-160110200 = "Тогда я буду ждать вас."
16011-160110210 = "Простите, что задержала вас так надолго."
16011-160110220 = "Спасибо за вашу заботу."
16011-160110230 = "Эм... насчёт лимона в мёде..."
16011-160110240 = "Если его окажется мало, скажите. У меня ещё есть."
16011-160110250 = "Эм..."
16011-160110260 = "Я буду рада, если вы позовёте меня и по другим делам."
16011-160110270 = "Кстати..."
16011-160110280 = "Даже то, что я обычно контролирую, становится сложнее, когда меняются обстоятельства."
16011-160110290 = "Что ты имеешь в виду?"
16011-160110300 = "...Может, речь о диете?"
16011-160110310 = "Вокруг такая праздничная атмосфера, и одежда тоже..."
16011-160110320 = "Нет, ничего... не обращайте внимания."
16011-160110330 = "Простите, что сказала что-то странное."
16011-160110340 = "Простите, Сенсей. Я подарила вам угощение, но съела всё сама..."
16011-160110350 = "Я сделаю ещё позже."
16011-160110360 = "Ничего страшного. Давай съедим вместе в следующий раз."
16011-160110370 = "Эм... ну..."
16011-160110380 = "Есть вместе..."
16011-160110390 = "Немного... калорийно..."
16011-160110400 = "Нет, да..."
16011-160110410 = "Спасибо..."
16011-160110420 = "Здравствуйте, Сенсей."
16011-160110430 = "В последнее время меня кое-что беспокоит."
16011-160110440 = "Вы ведь в основном занимаетесь офисной работой, документами, верно?"
16011-160110450 = "Говорят, что сидеть весь день вредно для здоровья, так что, может, попробуете немного подвигаться?"
16011-160110460 = "Действительно, я часто мало двигаюсь. А ты с чего вдруг?"
16011-160110470 = "Неужели Хасуми увлеклась спортом благодаря большому спортивному празднику...!?"
16011-160110480 = "А, эм..."
16011-160110490 = "Простите за внезапность... если вам не трудно..."
16011-160110500 = "Я не имела в виду, что нужно прямо сейчас начинать заниматься."
16011-160110510 = "Ну, я ещё некоторое время буду свободна, так что"
16011-160110520 = "буду рада, если вы свяжетесь со мной, когда вам будет удобно."
16011-160110530 = "Хорошо, что мы дошли до совместных занятий спортом."
16011-160110540 = "Но на обратном пути мы зашли в кафе и съели довольно много сладостей."
16011-160110550 = "Тогда какой смысл был в спорте..."
16011-160110560 = "Наоборот. Мы же тренировались, чтобы с удовольствием поесть!"
16011-160110570 = "Ты старалась ради счастья, так что это хорошо!"
16011-160110580 = "..."
16011-160110590 = "Н-ну"
16011-160110600 = "Наверное, так и есть."
16011-160110610 = "...Да, хе-хе. Думаю, так и нужно."
16011-160110620 = "Спасибо. Я снова обращусь к вам."