[translation]
20038-200380010 = "Жизнь в Шаньхайцзине определённо ощущается по-новому."
20038-200380020 = "Думаешь, уже привыкаешь?"
20038-200380030 = "Если честно, да."
20038-200380040 = "Но часть меня противится мысли, что я так быстро к этому привыкну."
20038-200380050 = "Почему?"
20038-200380060 = "Хм... Точно сказать не могу."
20038-200380070 = "Возможно, если я слишком привыкну к этому месту,"
20038-200380080 = "всё перестанет казаться таким свежим? Интересным?"
20038-200380090 = "Посещение новой академии научило меня многому."
20038-200380100 = "Между Шаньхайцзином и Красной Зимой очень много различий."
20038-200380110 = "Например?"
20038-200380120 = "Жарко. Так жарко."
20038-200380130 = "Я даже не двигаюсь, а всё равно потею..."
20038-200380140 = "Я никогда не сталкивалась с такой температурой."
20038-200380150 = "А, логично. Особенно после Красной Зимы."
20038-200380160 = "Естественно, мне стало интересно,"
20038-200380170 = "есть ли где-нибудь место ещё холоднее Красной Зимы."
20038-200380180 = "Но всё же переносить такую жару нелегко."
20038-200380190 = "Сенсееей~"
20038-200380200 = "Вы заняты?"
20038-200380210 = "Я сейчас свободен. Что случилось?"
20038-200380220 = "Не хочешь пообедать вместе?"
20038-200380230 = "Конечно, только если ты не против."
20038-200380240 = "Отлично! Я знаю хороший китайский ресторан неподалёку."
20038-200380250 = "Хотя... ты, наверное, уже наелась китайской кухни досыта, да?"
20038-200380260 = "Это так, но"
20038-200380270 = "если это ваше предложение, Сенсей, всё иначе."
20038-200380280 = "Думаю, это будет особенный опыт. Жду с нетерпением."
20038-200380290 = "Только не завышай ожидания. Чтобы не разочароваться."
20038-200380300 = "Я совершенно уверена,"
20038-200380310 = "что этого не случится."
20038-200380320 = "В конце концов, я пойду туда с вами, Сенсей."
