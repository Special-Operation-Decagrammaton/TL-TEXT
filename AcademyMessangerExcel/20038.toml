[translation]
20038-200380010 = "Жизнь в Шанхайцзине действительно новая для меня."
20038-200380020 = "Ты уже немного привыкла?"
20038-200380030 = "Пока ещё мало, но..."
20038-200380040 = "Я также не хочу слишком привыкать."
20038-200380050 = "Почему?"
20038-200380060 = "Хм..."
20038-200380070 = "Наверное, потому что если привыкну,"
20038-200380080 = "то это радостное чувство уменьшится."
20038-200380090 = "Я снова осознала,"
20038-200380100 = "что Шанхайцзин и Красная Зима действительно сильно отличаются во многом."
20038-200380110 = "А что именно отличается?"
20038-200380120 = "Прежде всего, жара."
20038-200380130 = "То, что потеешь даже просто стоя на месте,"
20038-200380140 = "для меня впервые."
20038-200380150 = "Да, это правда."
20038-200380160 = "Конечно,"
20038-200380170 = "мест, где прохладнее, чем в Красной Зиме, меньше, но"
20038-200380180 = "это оказалось сильнее, чем я ожидала."
20038-200380190 = "Сенсей"
20038-200380200 = "Вы сейчас заняты?"
20038-200380210 = "У меня есть время, что случилось?"
20038-200380220 = "Если вы не против, я бы хотела пообедать вместе с вами."
20038-200380230 = "Конечно, если вам удобно."
20038-200380240 = "Тогда я покажу тебе известный китайский ресторан!"
20038-200380250 = "Но я подумал, что Томое, наверное, уже знает о нём."
20038-200380260 = "Действительно, я провела небольшое исследование перед приездом, но..."
20038-200380270 = "Если вы сами покажете мне,"
20038-200380280 = "я буду очень рада."
20038-200380290 = "Боюсь, не смогу оправдать твои ожидания, но..."
20038-200380300 = "Могу с уверенностью сказать,"
20038-200380310 = "что волноваться не о чем."
20038-200380320 = "Ведь вы пойдёте со мной."