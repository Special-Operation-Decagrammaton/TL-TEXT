[translation]
20038-200380010 = "A vida em Shanhaijing é realmente uma experiência nova para mim"
20038-200380020 = "Já conseguiu se acostumar um pouco?"
20038-200380030 = "Apenas um pouco, mas..."
20038-200380040 = "Parte de mim sente que não quer se acostumar demais"
20038-200380050 = "Por quê?"
20038-200380060 = "Hmm..."
20038-200380070 = "Acho que é porque, se eu acabar me acostumando,"
20038-200380080 = "essa sensação tão divertida de novidade pode acabar diminuindo"
20038-200380090 = "Estive pensando novamente, e"
20038-200380100 = "Shanhaijing e Red Winter são mesmo muito diferentes em vários aspectos"
20038-200380110 = "O que você achou mais diferente, especificamente?"
20038-200380120 = "Acima de tudo, o calor"
20038-200380130 = "Suar mesmo ficando completamente parada..."
20038-200380140 = "É a primeira vez que passo por isso"
20038-200380150 = "Faz sentido, realmente"
20038-200380160 = "Claro,"
20038-200380170 = "imagino que existam poucos lugares mais frios que Red Winter, mas"
20038-200380180 = "isso superou todas as minhas expectativas"
20038-200380190 = "Sensei"
20038-200380200 = "Você está ocupado agora?"
20038-200380210 = "Estou livre, sim. O que houve?"
20038-200380220 = "Se não for incômodo, gostaria de convidá-lo para almoçarmos juntos"
20038-200380230 = "Isto é, se você estiver disponível, é claro"
20038-200380240 = "Então vou te apresentar um restaurante chinês bem famoso!"
20038-200380250 = "Ia sugerir um lugar, mas tenho a impressão de que você já conhece tudo, Tomoe"
20038-200380260 = "De fato, pesquisei bastante coisa antes de vir para cá, mas..."
20038-200380270 = "Se for uma recomendação sua, Sensei,"
20038-200380280 = "será um imenso prazer conhecer"
20038-200380290 = "Só fico preocupado se vou conseguir atender às suas expectativas..."
20038-200380300 = "Posso garantir"
20038-200380310 = "que não há com o que se preocupar"
20038-200380320 = "Afinal, terei a sua companhia, Sensei"
