[translation]
10139-101390010 = "Здравствуйте, это FOX EATS!"
10139-101390020 = "Ваш заказ прибудет примерно через 10 минут!"
10139-101390030 = "Пожалуйста, подтвердите ваш адрес."
10139-101390040 = "FOX EATS? Кажется, вы ошиблись номером..."
10139-101390050 = "Я ничего не заказывал..."
10139-101390060 = "Это за счёт заведения! Бесплатно!"
10139-101390070 = "Так что хоть раз расслабьтесь и насладитесь особым поздним ужином от FOX EATS!"
10139-101390080 = "Но откуда ты знаешь, что я ещё не ужинал?"
10139-101390090 = "Фуфу, у нас есть свои способы."
10139-101390100 = "Это коммерческая тайна FOX EATS."
10139-101390110 = "У меня какое-то дежавю..."
10139-101390120 = "Ваш заказ почти прибыл!"
10139-101390130 = "Ради вашей безопасности отойдите от двери и приготовьтесь к столкновению!"
10139-101390140 = "Что это вообще за доставка еды...?!"
10139-101390150 = "Сенсей"
10139-101390160 = "Ты доел инаризуси, которые я вчера оставила в холодильнике?"
10139-101390170 = "Ага. Доел."
10139-101390180 = "Они были настолько вкусными, что я съел всё за один присест."
10139-101390190 = "Я рад."
10139-101390200 = "Инаризуси вкуснее всего, когда немного настоятся."
10139-101390210 = "В следующий раз, когда будет возможность, сделаю тебе ещё!"
10139-101390220 = "Но не вздумай пропускать еду в надежде, что я приду тебя кормить!"
10139-101390230 = "Есть, мэм."
10139-101390240 = "Сенсей, у вас сегодня после обеда будет немного свободного времени?"
10139-101390250 = "Как раз сегодня я свободен."
10139-101390260 = "Чем-нибудь помочь?"
10139-101390270 = "У нас через несколько часов запланирована специальная операция по снабжению..."
10139-101390280 = "Но остальные члены отряда больше не смогут прийти."
10139-101390290 = "Не могли бы вы их заменить?"
10139-101390300 = "Что угодно!"
10139-101390310 = "Что мне нужно будет делать?"
10139-101390320 = "Не знаю, смогу ли я поспевать за вашими спецоперациями!"
10139-101390330 = "Не беспокойтесь. Опасно не будет!"
10139-101390340 = "...Наверное."
10139-101390350 = "Наверное?!"
10139-101390360 = "Сенсей"
10139-101390370 = "Слышали поговорку: «Если что-то может пойти не так, оно пойдёт не так»?"
10139-101390380 = "Ты про закон Мёрфи."
10139-101390390 = "На работе часто его слышу."
10139-101390400 = "Да. Думаю, большинство считает его правдивым."
10139-101390410 = "Однажды я забыла провести ежедневную проверку снаряжения..."
10139-101390420 = "И ИМЕННО в тот день случилась авария, и мне влетело."
10139-101390430 = "Я серьёзно не могла поверить, что сбой безопасности произошёл в ЕДИНСТВЕННЫЙ день, когда я забыла."
10139-101390440 = "Не переживай, такое случается со всеми. Даже со мной!"
10139-101390450 = "Вот почему и говорят, что совпадений не бывает!"
10139-101390460 = "Но недавно я прочитала в книге:"
10139-101390470 = "Нам так кажется, потому что плохие воспоминания мы запоминаем лучше хороших."
10139-101390480 = "А случаи, когда ты ошибся и ничего не произошло, запоминаются гораздо хуже."
10139-101390490 = "А! Значит, этому есть научное объяснение."
10139-101390500 = "Но всё равно немного жаль..."
10139-101390510 = "Хотелось бы, чтобы хорошие воспоминания сохранялись дольше."
10139-101390520 = "Но, думаю, есть веская причина помнить плохое."
10139-101390530 = "Так можно учиться на ошибках и в следующий раз поступать лучше."
10139-101390540 = "Сенсей."
10139-101390550 = "В кладовой Шале была целая куча зонтов."
10139-101390560 = "Они все принадлежат Шале?"
10139-101390570 = "Большинство забыли представительницы студентов."
10139-101390580 = "Наша куча «Потерянного и найденного» и правда разрослась..."
10139-101390590 = "Ага"
10139-101390600 = "Когда дождя нет, зонт очень легко забыть."
10139-101390610 = "И большинство студентов не подписывают свои вещи..."
10139-101390620 = "Так что найти владельцев наверняка будет сложно."
10139-101390630 = "Можно оставить записку с напоминанием забрать свои вещи."
10139-101390640 = "Да."
10139-101390650 = "О, тебе тоже стоит подписывать свои вещи, чтобы"
10139-101390660 = "Погоди."
10139-101390670 = "Вообще-то, думаю, это может дать обратный эффект..."
10139-101390680 = "А? Почему?!"
10139-101390690 = "Сенсей, вы планируете что-нибудь особенное на этих выходных?"
10139-101390700 = "В основном просто отдыхать и разлагаться..."
10139-101390710 = "А ты?"
10139-101390720 = "Планов нет! Я думал попробовать что-нибудь новое."
10139-101390730 = "Можно мне воспользоваться кухней Шале на этих выходных?"
10139-101390740 = "Я хотела приготовить боевые пайки для будущих заданий."
10139-101390750 = "Конечно, когда захочешь..."
10139-101390760 = "Но какие именно боевые пайки?"
10139-101390770 = "Хочу сделать такие, которые хорошо сохраняют вкус и свежесть!"
10139-101390780 = "Мне интересно. Очень интересно."
10139-101390790 = "О-о-о! Из чего они будут?"
10139-101390800 = "Фуфу, покажу, когда закончу их готовить."
