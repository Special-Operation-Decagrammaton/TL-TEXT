[translation]
10139-101390010 = "Boa noite, aqui é da \"FOX EATS\"!"
10139-101390020 = "O seu pedido será entregue em aproximadamente 10 minutos."
10139-101390030 = "Por gentileza, confirme novamente o seu endereço."
10139-101390040 = "FOX EATS?"
10139-101390050 = "Mas eu não lembro de ter pedido nada..."
10139-101390060 = "Não se preocupe, o pagamento já foi devidamente efetuado!"
10139-101390070 = "Basta aguardar confortavelmente no seu lugar pelo jantar especial da FOX EATS."
10139-101390080 = "Como você sabia que eu ainda não tinha jantado?"
10139-101390090 = "Hehe, como será, né?"
10139-101390100 = "Digamos que é segredo comercial."
10139-101390110 = "Tenho a impressão de que já passei por uma situação parecida antes..."
10139-101390120 = "Chegaremos em instantes."
10139-101390130 = "Para a sua segurança, afaste-se o máximo possível da porta e prepare-se para o impacto."
10139-101390140 = "Hã?! Como assim?!"
10139-101390150 = "Sensei,"
10139-101390160 = "você comeu os inarizushis direitinho?"
10139-101390170 = "Comi sim."
10139-101390180 = "Estavam tão gostosos que comi tudo num instante..."
10139-101390190 = "Hehe, fico muito feliz."
10139-101390200 = "O inarizushi fica mesmo ainda mais saboroso depois de descansar um tempinho para pegar o tempero."
10139-101390210 = "Quando tiver outra oportunidade, levarei mais para você."
10139-101390220 = "...Mas não vá pular as refeições de propósito só esperando por isso, viu?"
10139-101390230 = "Pode deixar, vou guardar bem esse aviso."
10139-101390240 = "Sensei, você tem algum tempo livre hoje à tarde?"
10139-101390250 = "Tenho sim. Acabei de ficar com a agenda livre."
10139-101390260 = "O que houve?"
10139-101390270 = "É que... eu estava planejando realizar uma \"Operação Especial de Suprimentos\" hoje à tarde,"
10139-101390280 = "mas as outras meninas do pelotão tiveram um imprevisto e não poderão vir..."
10139-101390290 = "Se não for pedir demais, você poderia me ajudar no lugar delas, Sensei?"
10139-101390300 = "Claro que sim!"
10139-101390310 = "Mas... será que eu consigo ser útil em alguma coisa?"
10139-101390320 = "Eu não entendo nada de operações especiais."
10139-101390330 = "Fique tranquilo. Não é uma operação tão perigosa assim."
10139-101390340 = "...Provavelmente."
10139-101390350 = "Provavelmente?!"
10139-101390360 = "Sensei, tenho uma pergunta."
10139-101390370 = "Você conhece aquele ditado que diz: \"Tudo o que puder dar errado, dará errado\"?"
10139-101390380 = "É a Lei de Murphy, né?"
10139-101390390 = "A gente ouve muito isso no trabalho."
10139-101390400 = "Sim. Parece que muita gente se identifica com ela."
10139-101390410 = "Antigamente, houve um único dia em que esqueci de fazer a inspeção diária do meu equipamento..."
10139-101390420 = "E, por azar, foi justo nesse dia que tive um problema em campo."
10139-101390430 = "Olhei para o céu na hora pensando: \"Por que justo hoje...?\""
10139-101390440 = "Já passei por coisas parecidas várias vezes também."
10139-101390450 = "As coincidências adoram aparecer nos piores momentos, né?"
10139-101390460 = "Na época, acabei lendo um livro sobre o assunto e descobri uma coisa interessante..."
10139-101390470 = "Dizem que essa sensação acontece porque o nosso cérebro grava acontecimentos ruins com muito mais facilidade do que os bons."
10139-101390480 = "Ou seja, a gente simplesmente esquece todas as outras vezes em que cometeu um deslize e nada de ruim aconteceu."
10139-101390490 = "Então existe uma explicação científica por trás disso."
10139-101390500 = "Mas dá uma certa pena pensar nisso..."
10139-101390510 = "Já que é para guardar na memória, seria bem melhor lembrar das coisas boas."
10139-101390520 = "Você acha? Eu prefiro que as memórias dos erros fiquem bem gravadas."
10139-101390530 = "Assim podemos aprender com as falhas para não repeti-las na próxima vez... não acha?"
10139-101390540 = "Notei que há vários guarda-chuvas no depósito da SCHALE..."
10139-101390550 = "Sensei... por acaso"
10139-101390560 = "todos aqueles guarda-chuvas são patrimônio da SCHALE?"
10139-101390570 = "São das alunas plantonistas que acabam esquecendo aqui."
10139-101390580 = "Quando me dei conta, já tinha acumulado esse monte..."
10139-101390590 = "Compreendo."
10139-101390600 = "Realmente, quando a chuva para antes da hora de ir embora, é muito fácil esquecer."
10139-101390610 = "Mas, como nenhum deles tem nome,"
10139-101390620 = "deve dar um bom trabalho encontrar as donas de cada um."
10139-101390630 = "Acho que depois vou colocar um aviso no mural para as donas virem buscar."
10139-101390640 = "Boa ideia."
10139-101390650 = "Quem sabe eu não escreva o seu nome nos seus pertences também, Sensei, para encontrarem rápido caso você perca—"
10139-101390660 = "Quer dizer, não."
10139-101390670 = "Pensando bem, acho que isso teria o efeito oposto."
10139-101390680 = "Por quê?!"
10139-101390690 = "Você tem algum plano especial para o próximo dia de folga?"
10139-101390700 = "Provavelmente só vou ficar descansando mesmo..."
10139-101390710 = "E você, Niko? Tem algum plano?"
10139-101390720 = "Eu também não tenho nada marcado para este fim de semana... por isso estava pensando em tentar algo novo."
10139-101390730 = "Se não for incômodo... você poderia me emprestar a cozinha da SCHALE neste fim de semana?"
10139-101390740 = "Quero tentar preparar rações de combate para usarmos na nossa próxima operação."
10139-101390750 = "Pode usar a cozinha à vontade, mas..."
10139-101390760 = "Rações de combate?"
10139-101390770 = "Sim. Alimentos de longa conservação, que demoram para estragar e mantêm o sabor."
10139-101390780 = "Fiquei curioso agora."
10139-101390790 = "Que ingredientes você vai usar?"
10139-101390800 = "Hehe... Quando estiver pronto, eu mostro para você."
