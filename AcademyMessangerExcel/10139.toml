[translation]
10139-101390010 = "Добрый вечер, это «FOX EATS»!"
10139-101390020 = "Ваш заказ будет доставлен через 10 минут."
10139-101390030 = "Пожалуйста, ещё раз подтвердите ваш адрес."
10139-101390040 = "«FOX EATS»?"
10139-101390050 = "Я вроде ничего не заказывал..."
10139-101390060 = "Не волнуйтесь, оплата уже произведена!"
10139-101390070 = "Вам остаётся только ждать ужин, который доставит FOX EATS."
10139-101390080 = "Откуда ты узнала, что я ещё не ужинал?"
10139-101390090 = "Хе-хе, как вы думаете?"
10139-101390100 = "Это коммерческая тайна."
10139-101390110 = "Кажется, что-то подобное уже было..."
10139-101390120 = "Доставка скоро будет."
10139-101390130 = "В целях безопасности, пожалуйста, отойдите подальше от двери и приготовьтесь к удару."
10139-101390140 = "Что!?"
10139-101390150 = "Сенсей,"
10139-101390160 = "вы съели инаридзуши?"
10139-101390170 = "Да, съел."
10139-101390180 = "Было так вкусно, что я сразу всё съел..."
10139-101390190 = "Хе-хе, как хорошо."
10139-101390200 = "Всё-таки инаридзуши вкуснее, если дать ему немного настояться."
10139-101390210 = "Если будет возможность, я снова принесу вам."
10139-101390220 = "... Но не пропускайте приёмы пищи ради этого, хорошо?"
10139-101390230 = "Да, запомню."
10139-101390240 = "Сенсей, у вас есть время сегодня после обеда?"
10139-101390250 = "Да. Как раз освободился."
10139-101390260 = "А что, что-то случилось?"
10139-101390270 = "Ну... сегодня после обеда я планировала провести «специальную операцию по снабжению»,"
10139-101390280 = "но все из отряда не смогли прийти..."
10139-101390290 = "Если вас не затруднит, не могли бы вы мне помочь, Сенсей?"
10139-101390300 = "Конечно!"
10139-101390310 = "Но... чем я могу быть полезен?"
10139-101390320 = "Я ничего не понимаю в специальных операциях."
10139-101390330 = "Всё в порядке. Это не настолько опасная операция."
10139-101390340 = "... Наверное."
10139-101390350 = "Наверное!?"
10139-101390360 = "Вопрос к вам, Сенсей."
10139-101390370 = "Вы знаете поговорку: «Если есть вероятность, что что-то пойдёт не так, оно обязательно пойдёт не так»?"
10139-101390380 = "Да, это закон Мёрфи."
10139-101390390 = "На работе часто слышу её."
10139-101390400 = "Да. Похоже, многие с ним согласны."
10139-101390410 = "Однажды я забыла проверить снаряжение, хотя делала это каждый день..."
10139-101390420 = "И именно в тот день случилась нештатная ситуация."
10139-101390430 = "Я тогда подумала: «Почему именно сегодня?» и возвела глаза к небу."
10139-101390440 = "У меня тоже несколько раз такое было."
10139-101390450 = "Совпадения действительно приходят в самый неподходящий момент."
10139-101390460 = "Тогда я как раз читала книгу на эту тему и узнала, что..."
10139-101390470 = "На самом деле такие законы возникают из-за того, что плохие события запоминаются лучше, чем хорошие."
10139-101390480 = "То есть мы не помним дней, когда неудача не случилась, хотя могла бы."
10139-101390490 = "Значит, у этого есть научное объяснение."
10139-101390500 = "Но что-то мне кажется, что это немного обидно..."
10139-101390510 = "Я бы предпочёл запоминать хорошие моменты."
10139-101390520 = "Правда? А я считаю, что лучше запоминать плохое."
10139-101390530 = "Ведь тогда можно извлечь урок из ошибки... верно?"
10139-101390540 = "В кладовой Шале много зонтов..."
10139-101390550 = "Сенсей, это всё"
10139-101390560 = "принадлежит Шале?"
10139-101390570 = "Это забытые вещи, которые оставляют дежурные."
10139-101390580 = "Как-то незаметно накопилось..."
10139-101390590 = "Понятно."
10139-101390600 = "Да, когда уходишь и не идёт дождь, легко забыть зонт."
10139-101390610 = "Но на них нет имён,"
10139-101390620 = "так что найти владельцев, похоже, будет непросто."
10139-101390630 = "Может, написать на доске объявлений, чтобы владельцы пришли забрать?"
10139-101390640 = "Да."
10139-101390650 = "На ваших вещах, Сенсей, тоже, наверное, стоит написать имя, чтобы в случае потери сразу найти..."
10139-101390660 = "Нет,"
10139-101390670 = "это может возыметь обратный эффект."
10139-101390680 = "Почему!?"
10139-101390690 = "У вас есть особые планы на следующие выходные?"
10139-101390700 = "Наверное, просто отдохну..."
10139-101390710 = "А у тебя, Нико, есть какие-то планы?"
10139-101390720 = "У меня тоже на этих выходных ничего особенного нет... поэтому я решила попробовать что-то новое."
10139-101390730 = "Если вас не затруднит... можно мне в выходные воспользоваться кухней в Шале?"
10139-101390740 = "Я хочу приготовить боевые пайки для предстоящей операции."
10139-101390750 = "Кухней можно пользоваться свободно, но..."
10139-101390760 = "Боевые пайки?"
10139-101390770 = "Да. Это консервы, которые долго не портятся и не теряют вкуса."
10139-101390780 = "Мне стало интересно."
10139-101390790 = "Из чего их делают?"
10139-101390800 = "Хе-хе... я покажу вам, когда закончу."