[translation]
10112-101120010 = "Mestre, você costuma andar muito de ônibus?"
10112-101120020 = "De vez em quando, eu acho?"
10112-101120030 = "Eu também!"
10112-101120040 = "Eu pego pra ir e voltar da escola,"
10112-101120050 = "mas tá sempre tão cheio de gente~"
10112-101120060 = "Realmente, nesse horário..."
10112-101120070 = "Acho que não tem muito jeito..."
10112-101120080 = "Uhum, uhum!"
10112-101120090 = "É puxado mesmo, né?"
10112-101120100 = "Ah"
10112-101120110 = "Acabei esquecendo de avisar agora há pouco,"
10112-101120120 = "mas acho que ficou um pouco de base na sua camisa, Sensei."
10112-101120130 = "Ah, é verdade."
10112-101120140 = "Ficando coladinhos daquele jeito..."
10112-101120150 = "Desculpa, foi culpa minha!"
10112-101120160 = "Assim que a aula acabar, eu lavo ela pra você!"
10112-101120170 = "Huum..."
10112-101120180 = "Mas aí será que eu vou ter que colocar a minha roupa de maid antes?"
10112-101120190 = "Entre o uniforme escolar e a roupa de maid,"
10112-101120200 = "qual você prefere, Sensei?"
10112-101120210 = "C-Como assim!?"
10112-101120220 = "Já tá quase na hora do intervalo do almoço, né?"
10112-101120230 = "Minha barriga já tá vazia de tanta fome!"
10112-101120240 = "Já a minha agenda tá sempre vazia pra você..."
10112-101120250 = "Ahaha!"
10112-101120260 = "Que papo é esse?"
10112-101120270 = "E o que você vai comer no almoço, Asuna?"
10112-101120280 = "Huum..."
10112-101120290 = "Tô pensando ainda!"
10112-101120300 = "Aliás,"
10112-101120310 = "tenho a impressão de que ultimamente"
10112-101120320 = "eu esbarro com você em tudo quanto é lugar, Sensei!"
10112-101120330 = "É verdade."
10112-101120340 = "Quem sabe a gente não se esbarra por aí de novo?"
10112-101120350 = "Ahaha!"
10112-101120360 = "Esses encontros inesperados"
10112-101120370 = "são muito divertidos, né?!"
10112-101120380 = "Eu tô aqui no parque,"
10112-101120390 = "e achei uma nuvem que é a sua cara, Sensei!"
10112-101120400 = "Ahaha!"
10112-101120410 = "Está passeando?"
10112-101120420 = "Uhum!"
10112-101120430 = "Então, sabe..."
10112-101120440 = "Aconteceu alguma coisa?"
10112-101120450 = "Asuna?"
10112-101120460 = "Senseeei~!"
10112-101120470 = "Obrigada por se preocupar comigo!"
10112-101120480 = "E pelo celular também!"
10112-101120490 = "Ainda bem que encontramos."
10112-101120500 = "Uhum!"
10112-101120510 = "Vou tomar cuidado pra não deixar cair mais."
10112-101120520 = "Afinal, foi o celular que você me ajudou a procurar, Sensei!"
10112-101120530 = "Foi só chegar em casa que bateu um soninho..."
10112-101120540 = "Bom descanso hoje."
10112-101120550 = "Boa noite, Asuna."
10112-101120560 = "Ehehe"
10112-101120570 = "Uhum, boa noite!"
