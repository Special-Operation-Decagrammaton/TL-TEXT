[translation]
10112-101120010 = "Хозяин, вы часто ездите на автобусе?"
10112-101120020 = "Ну, бывает."
10112-101120030 = "Я тоже!"
10112-101120040 = "Езжу по дороге в школу и обратно."
10112-101120050 = "Там всегда много народу."
10112-101120060 = "Действительно, в это время..."
10112-101120070 = "Наверное, ничего не поделаешь..."
10112-101120080 = "Угу-угу."
10112-101120090 = "Всё-таки тяжело, да?"
10112-101120100 = "А,"
10112-101120110 = "я забыла сказать раньше, но"
10112-101120120 = "на вашей рубашке, кажется, остался тональный крем."
10112-101120130 = "А, и правда."
10112-101120140 = "Если так тесно прижиматься..."
10112-101120150 = "Простите, это из-за меня."
10112-101120160 = "После школы я её постираю!"
10112-101120170 = "Хм..."
10112-101120180 = "Тогда мне придётся переодеться в горничную?"
10112-101120190 = "Школьная форма и форма горничной."
10112-101120200 = "Какая вам больше нравится, Сенсей?"
10112-101120210 = "Ч-что ты имеешь в виду!?"
10112-101120220 = "Скоро обеденный перерыв."
10112-101120230 = "Я уже проголодалась."
10112-101120240 = "Я всегда голодна..."
10112-101120250 = "Аха-ха"
10112-101120260 = "Что это?"
10112-101120270 = "Асуна, что ты будешь есть на обед?"
10112-101120280 = "Ну..."
10112-101120290 = "Думаю!"
10112-101120300 = "Кстати,"
10112-101120310 = "в последнее время в разных местах"
10112-101120320 = "я чувствую, что встречаю Сенсея!"
10112-101120330 = "Да, наверное."
10112-101120340 = "Может, ещё встретимся где-нибудь."
10112-101120350 = "Аха-ха"
10112-101120360 = "Неожиданные встречи —"
10112-101120370 = "это интересно, правда!"
10112-101120380 = "Я в парке."
10112-101120390 = "Нашла облако, похожее на вас, Сенсей."
10112-101120400 = "Аха-ха"
10112-101120410 = "Гуляешь?"
10112-101120420 = "Ага!"
10112-101120430 = "И вот,"
10112-101120440 = "Что-то случилось?"
10112-101120450 = "Асуна?"
10112-101120460 = "Сенсей~!"
10112-101120470 = "Спасибо, что волновались."
10112-101120480 = "И телефон тоже!"
10112-101120490 = "Хорошо, что нашёлся."
10112-101120500 = "Ага!"
10112-101120510 = "Постараюсь больше не ронять."
10112-101120520 = "Ведь этот телефон вы помогли мне искать, Сенсей!"
10112-101120530 = "Когда пришла домой, начала хотеть спать."
10112-101120540 = "Ты сегодня устала."
10112-101120550 = "Спокойной ночи, Асуна."
10112-101120560 = "Хе-хе"
10112-101120570 = "Ага, спокойной ночи!"