[translation]
10112-101120010 = "Ты часто ездишь на автобусе, Мастер?"
10112-101120020 = "Иногда?"
10112-101120030 = "Я тоже, я тоже."
10112-101120040 = "Я езжу на автобусе в школу и обратно домой."
10112-101120050 = "И там всегда так много людей."
10112-101120060 = "Да. Пожалуй..."
10112-101120070 = "Если примерно в это время..."
10112-101120080 = "Ага-ага."
10112-101120090 = "Значит, Мастер тоже знает это чувство."
10112-101120100 = "А."
10112-101120110 = "Забыла сказать, когда вышла,"
10112-101120120 = "но моя косметика осталась на вашей рубашке, Сенсей."
10112-101120130 = "О, и правда."
10112-101120140 = "Наверное, я слишком расслабилась..."
10112-101120150 = "Простите! Я слишком сильно на вас опиралась."
10112-101120160 = "Я всё за тебя приведу в порядок."
10112-101120170 = "Ой, но"
10112-101120180 = "чтобы это сделать, мне придётся надеть форму горничной..."
10112-101120190 = "Хм..."
10112-101120200 = "Что тебе больше нравится: школьная форма или форма горничной?"
10112-101120210 = "Не совсем понимаю, что ты имеешь в виду..."
10112-101120220 = "Скоро обед."
10112-101120230 = "Примерно в это время я всегда начинаю хотеть есть."
10112-101120240 = "Я всегда хочу есть..."
10112-101120250 = "Ахаха"
10112-101120260 = "О чём ты говоришь?"
10112-101120270 = "Что будешь есть на обед, Асуна?"
10112-101120280 = "Хм-м... Посмотрим."
10112-101120290 = "Думаю!"
10112-101120300 = "Теперь, когда я об этом думаю..."
10112-101120310 = "В последнее время я часто с вами сталкиваюсь, Сенсей"
10112-101120320 = "Не согласен?"
10112-101120330 = "И правда."
10112-101120340 = "Никогда не знаю, когда встречу вас в следующий раз."
10112-101120350 = "Ахаха"
10112-101120360 = "Неожиданная встреча..."
10112-101120370 = "Это всегда весело!"
10112-101120380 = "Я сейчас в парке на холме,"
10112-101120390 = "и тут облако, похожее на вас, Сенсей."
10112-101120400 = "Ахаха"
10112-101120410 = "Гуляешь, Асуна?"
10112-101120420 = "Ага"
10112-101120430 = "Эм..."
10112-101120440 = "Что-то случилось?"
10112-101120450 = "Асуна?"
10112-101120460 = "Сенсей!"
10112-101120470 = "Спасибо, что пришли ко мне сегодня."
10112-101120480 = "И что нашли мой телефон."
10112-101120490 = "Да, рад, что теперь мы можем вот так общаться в MomoTalk."
10112-101120500 = "Точно-точно."
10112-101120510 = "Я постараюсь больше его не терять,"
10112-101120520 = "ведь мы нашли его вместе."
10112-101120530 = "Теперь, когда я дома, меня ужасно клонит в сон"
10112-101120540 = "Сегодня тебе досталось."
10112-101120550 = "Спокойной ночи, Асуна."
10112-101120560 = "Ага! Хи-хи."
10112-101120570 = "Спокойной ночи, Сенсей!"
