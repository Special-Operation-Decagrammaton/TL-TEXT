[translation]
10034-100340010 = "Sensei, eu fiquei sabendo."
10034-100340020 = "Disseram que você anda muito ocupado com o trabalho ultimamente."
10034-100340030 = "Ouvi dizer que não tem conseguido dormir direito e que ontem chegou até a se atrasar para ir à Schale."
10034-100340040 = "A sua rotina está tão corrida assim...?"
10034-100340050 = "Bom, de vez em quando acontece..."
10034-100340060 = "Acho que tenho conseguido dormir razoavelmente bem..."
10034-100340070 = "Entendo... Compreendo."
10034-100340080 = "Essa é uma situação muito preocupante..."
10034-100340090 = "Como integrante do Clube de Treino Espiritual, preciso fazer alguma coisa a respeito."
10034-100340100 = "Hã? Como assim?"
10034-100340110 = "Hum, Mimori?"
10034-100340120 = "Depois daquilo, você conseguiu chegar a tempo?"
10034-100340130 = "Obrigado por hoje. Mas por que você fez tudo aquilo, Mimori...?"
10034-100340140 = "Bem, isso é porque..."
10034-100340150 = "Eu sou uma integrante do Clube de Treino Espiritual que se dedica diariamente para se tornar uma verdadeira Yamato Nadeshiko."
10034-100340160 = "E, como parte desse treinamento, vim ajudar você hoje, Sensei."
10034-100340170 = "Daqui para frente, sempre que estiver em apuros, pode me chamar a qualquer hora!"
10034-100340180 = "A qualquer momento, para o que precisar. Basta me chamar que virei imediatamente."
10034-100340190 = "Pois vou provar que posso me tornar a Yamato Nadeshiko ideal...!"
10034-100340200 = "Ah, entendi. Obrigado."
10034-100340210 = "Ah, e se estiver com dificuldade para dormir, quer que eu vá até aí fazer companhia até você pegar no sono?"
10034-100340220 = "N-não precisa chegar a tanto!"
10034-100340230 = "Guh...! E-eu vou passar dessa vez...!"
10034-100340240 = "Não precisa ficar com vergonha, sabia? Fufu♪"
10034-100340250 = "Sensei, dando continuidade ao meu treinamento anterior, desta vez estou pensando em preparar comida caseira."
10034-100340260 = "Por isso, se você não se importar..."
10034-100340270 = "Espera, a comida caseira da Mimori...?"
10034-100340280 = "Espera, a Mimori preparando comida caseira...?"
10034-100340290 = "Hã...? Ah, sim. Isso mesmo, mas...?"
10034-100340300 = "Então, se possível, eu gostaria muito que você me ajudasse nesse treinamento..."
10034-100340310 = "Não existe outra opção além de ajudar."
10034-100340320 = "Eu ajudo! Com todas as minhas forças!"
10034-100340330 = "Ah, certo! E-então conto com você...!"
10034-100340340 = "Como atividade do Clube de Treino Espiritual, vamos fazer trabalho voluntário de limpeza em breve."
10034-100340350 = "Você sempre se dedica tanto a tudo o que faz, né, Mimori?"
10034-100340360 = "Fufu, muito obrigada. Depois da culinária, vem a limpeza."
10034-100340370 = "Afinal, tudo isso também faz parte do meu treino para me tornar uma esplêndida Yamato Nadeshiko e uma noiva maravilhosa."
10034-100340380 = "E falando nisso..."
10034-100340390 = "Se não for incomodar, você poderia me ajudar nisso também, Sensei?"
10034-100340400 = "Sim, claro."
10034-100340410 = "Muito obrigada! Conto com você, então♪"
10034-100340420 = "Sensei, você teria um tempinho hoje?"
10034-100340430 = "Para você, eu tenho tempo a qualquer hora, Mimori."
10034-100340440 = "O que houve?"
10034-100340450 = "Ah, é-é mesmo...?"
10034-100340460 = "Ouvir você dizer isso me deixa... muito feliz."
10034-100340470 = "Hum, na verdade..."
10034-100340480 = "Tem uma coisinha que eu queria comprar na loja de departamentos,"
10034-100340490 = "e entrei em contato porque gostaria muito de ir com você, Sensei..."
10034-100340500 = "Hum, não seria um incômodo para você...?"
10034-100340510 = "Imagina, problema nenhum."
10034-100340520 = "Pode me chamar sempre que quiser."
10034-100340530 = "Sim, muito obrigada!"
10034-100340540 = "Então estarei te esperando em frente à loja de departamentos."
10034-100340550 = "Olá, Sensei."
10034-100340560 = "Ouvi dizer que você vem a Hyakkiyako hoje."
10034-100340570 = "Sim, esse é o plano."
10034-100340580 = "H-hum..."
10034-100340590 = "Nesse caso,"
10034-100340600 = "faz tempo que não faço isso, então gostaria de convidá-lo para dar uma passada aqui, Sensei."
10034-100340610 = "Tudo bem... para você...?"
10034-100340620 = "Com certeza!"
