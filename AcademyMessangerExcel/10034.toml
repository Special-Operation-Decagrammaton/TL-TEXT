[translation]
10034-100340010 = "Я слышала слух, Сенсей."
10034-100340020 = "Говорят, в последнее время вы очень заняты работой."
10034-100340030 = "И что вчера опоздали, потому что проспали."
10034-100340040 = "Это правда?"
10034-100340050 = "Ну, бывает."
10034-100340060 = "Не конец света."
10034-100340070 = "Хм. Понятно."
10034-100340080 = "Это серьёзная проблема."
10034-100340090 = "Я из Клуба внутренней дисциплины. Не могу просто сидеть сложа руки."
10034-100340100 = "В смысле?"
10034-100340110 = "Э-э-э... Мимори?"
10034-100340120 = "Вы сегодня вовремя пришли на работу?"
10034-100340130 = "Да, но почему ты сегодня пришла?"
10034-100340140 = "А?"
10034-100340150 = "Потому что я член Клуба внутренней дисциплины. Я стараюсь стать настоящей леди."
10034-100340160 = "Я пришла помочь."
10034-100340170 = "Сообщайте, когда попадёте в беду!"
10034-100340180 = "Я всегда буду рядом."
10034-100340190 = "Это часть моей работы!"
10034-100340200 = "Хорошо, спасибо."
10034-100340210 = "О! Я могу помочь, если вам трудно уснуть ночью."
10034-100340220 = "Нет! Всё совершенно нормально!"
10034-100340230 = "Нет-нет-нет, в этом нет необходимости!"
10034-100340240 = "Правда, никаких проблем!"
10034-100340250 = "Сенсей, продолжая наш прошлый разговор, я хотела бы потренироваться в домашней кухне."
10034-100340260 = "Если вы, конечно, не против."
10034-100340270 = "Погоди. Ты имеешь в виду ТВОЮ домашнюю кухню?"
10034-100340280 = "Ты собираешься готовить домашнюю еду?"
10034-100340290 = "Да, а что?"
10034-100340300 = "Мне понадобится ваша помощь."
10034-100340310 = "Эм, хорошо. Я попробую."
10034-100340320 = "Сделаю что смогу."
10034-100340330 = "Правда? Тогда рассчитываю на вас!"
10034-100340340 = "Я занимаюсь волонтёрством в рамках клубной деятельности."
10034-100340350 = "Ты всегда стараешься изо всех сил, да?"
10034-100340360 = "Конечно. Сначала приготовлю еду, потом уберу!"
10034-100340370 = "Это всё часть моего пути к тому, чтобы стать настоящей леди."
10034-100340380 = "Кстати..."
10034-100340390 = "Не могли бы вы помочь мне с волонтёрской работой? Если это не слишком обременительно."
10034-100340400 = "Не против."
10034-100340410 = "Отлично, это очень поможет!"
10034-100340420 = "Вы сегодня свободны, Сенсей?"
10034-100340430 = "Для тебя я всегда свободен, Мимори."
10034-100340440 = "Да, что такое?"
10034-100340450 = "Вы...?"
10034-100340460 = "Хорошо знать... Я рада."
10034-100340470 = "О, ничего слишком серьёзного."
10034-100340480 = "В магазине есть кое-что, на что я давно смотрю."
10034-100340490 = "Я надеялась, что вы пойдёте со мной."
10034-100340500 = "Можно?"
10034-100340510 = "Да, конечно."
10034-100340520 = "Я буду."
10034-100340530 = "Правда? Хорошо!"
10034-100340540 = "Встретимся в универмаге!"
10034-100340550 = "Здравствуйте, Сенсей."
10034-100340560 = "Я слышала, вы собираетесь приехать в Академию Хяккияко."
10034-100340570 = "Таков план."
10034-100340580 = "Э-Эм..."
10034-100340590 = "В таком случае..."
10034-100340600 = "я хотела бы... пригласить вас ко мне..."
10034-100340610 = "Это... можно?"
10034-100340620 = "Я приду!"
