[translation]
10034-100340010 = "Сенсей, я слышала."
10034-100340020 = "Что вы очень заняты работой в последнее время."
10034-100340030 = "Мне сказали, что вы не высыпаетесь и даже опоздали в Шале вчера."
10034-100340040 = "Неужели вы так перегружены...?"
10034-100340050 = "Ну, иногда такое бывает..."
10034-100340060 = "Наверное, я достаточно сплю..."
10034-100340070 = "Вот как... понятно."
10034-100340080 = "Это серьёзная проблема."
10034-100340090 = "Как члену клуба самосовершенствования, я просто обязана что-то сделать."
10034-100340100 = "А? Что вы имеете в виду?"
10034-100340110 = "Эм, Мимори?"
10034-100340120 = "Вы после того успели вовремя?"
10034-100340130 = "Спасибо за сегодня. Но почему вы, Мимори...?"
10034-100340140 = "Дело в том..."
10034-100340150 = "Я член клуба самосовершенствования, стремлюсь стать идеальной японской женщиной."
10034-100340160 = "И как часть этого я пришла сегодня помочь вам."
10034-100340170 = "В будущем, если вам будет трудно, всегда обращайтесь!"
10034-100340180 = "В любое время, по любому поводу. Я сразу же приду, как только вы позовёте."
10034-100340190 = "Я стану идеальной японской женщиной...!"
10034-100340200 = "П-понятно. Спасибо."
10034-100340210 = "Ах, если вам трудно заснуть, я могу прийти и уложить вас, как ребёнка?"
10034-100340220 = "Н-нет, до такого не надо!"
10034-100340230 = "Уф... я, пожалуй, откажусь...!"
10034-100340240 = "Не стесняйтесь! Хе-хе ♪"
10034-100340250 = "Сенсей, как продолжение самосовершенствования, я хочу попробовать приготовить домашнюю еду."
10034-100340260 = "И если вы не против..."
10034-100340270 = "Подождите, домашняя еда от Мимори...?"
10034-100340280 = "Подождите, Мимори готовит...?"
10034-100340290 = "Что...? А, да. Так и есть, но...?"
10034-100340300 = "И я хотела бы попросить вас помочь мне с этим."
10034-100340310 = "У меня нет выбора, кроме как помочь."
10034-100340320 = "Я помогу изо всех сил!"
10034-100340330 = "А, да! Т-тогда буду рассчитывать на вас...!"
10034-100340340 = "В рамках деятельности клуба мы собираемся пойти на волонтёрскую уборку."
10034-100340350 = "Мимори, ты всегда так стараешься."
10034-100340360 = "Хе-хе, спасибо. После готовки — уборка."
10034-100340370 = "Всё это — часть тренировок, чтобы стать настоящей японской женщиной и хорошей невестой."
10034-100340380 = "И вот..."
10034-100340390 = "Если вы не против, не поможете ли вы нам?"
10034-100340400 = "Да, конечно."
10034-100340410 = "Спасибо, тогда буду рассчитывать на вас ♪"
10034-100340420 = "Сенсей, у вас есть время сегодня?"
10034-100340430 = "Ради Мимори я всегда готов."
10034-100340440 = "Что случилось?"
10034-100340450 = "Ах, п-правда...?"
10034-100340460 = "Когда вы так говорите, мне... очень приятно."
10034-100340470 = "Дело в том..."
10034-100340480 = "Мне нужно кое-что купить в универмаге."
10034-100340490 = "Я хотела пойти вместе с вами, поэтому и написала..."
10034-100340500 = "Вам это не доставит хлопот...?"
10034-100340510 = "Вообще-то нет."
10034-100340520 = "Зовите меня в любое время."
10034-100340530 = "Да, спасибо!"
10034-100340540 = "Тогда я буду ждать вас у универмага."
10034-100340550 = "Здравствуйте, Сенсей."
10034-100340560 = "Я слышала, вы сегодня будете в Хяккияко."
10034-100340570 = "Да, планирую."
10034-100340580 = "Ну, э-то..."
10034-100340590 = "Тогда"
10034-100340600 = "я хотела бы снова пригласить вас в гости."
10034-100340610 = "Можно...?"
10034-100340620 = "Конечно!"
