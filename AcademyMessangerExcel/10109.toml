[translation]
10109-101090010 = "Сенсей, прошу прощения."
10109-101090020 = "Я не смогу выйти на дежурство завтра."
10109-101090030 = "Утром у меня был небольшой жар, но когда я измерила температуру недавно, она поднялась..."
10109-101090040 = "Что? Ты в порядке?"
10109-101090050 = "После того как я выпила лекарство, стало немного легче."
10109-101090060 = "Но если я пойду в таком состоянии, то только доставлю хлопоты."
10109-101090070 = "Я обязательно отработаю пропущенное."
10109-101090080 = "Отдыхай хорошенько."
10109-101090090 = "Если что-то понадобится, напиши."
10109-101090100 = "Спасибо, Сенсей."
10109-101090110 = "Здравствуйте, Сенсей."
10109-101090120 = "Благодаря вам мне стало гораздо лучше."
10109-101090130 = "Как вы себя чувствуете?"
10109-101090140 = "Я в порядке."
10109-101090150 = "Ты уже совсем поправилась?"
10109-101090160 = "Да, спасибо вам."
10109-101090170 = "Кстати, если у вас будет время,"
10109-101090180 = "не могли бы вы зайти ко мне в комнату на этих выходных?"
10109-101090190 = "Можно мне снова прийти?"
10109-101090200 = "Ой,"
10109-101090210 = "вы же поможете мне с перестановкой мебели, верно?"
10109-101090220 = "Надеюсь, вы не забыли..."
10109-101090230 = "А, конечно, нет!"
10109-101090240 = "Я просто спросил на всякий случай!"
10109-101090250 = "Хе-хе, не нужно так волноваться."
10109-101090260 = "Я пошутила."
10109-101090270 = "Тогда я буду ждать с нетерпением."
10109-101090280 = "Сенсей, вы в порядке?"
10109-101090290 = "Я слышала от Юки, что вы простудились."
10109-101090300 = "Всё нормально."
10109-101090310 = "Сейчас я отдыхаю."
10109-101090320 = "Возможно, вы скажете, что это не так,"
10109-101090330 = "но я подумала, что, может быть,"
10109-101090340 = "в этом виновата я..."
10109-101090350 = "Ты не виновата!"
10109-101090360 = "Не переживай."
10109-101090370 = "Но..."
10109-101090380 = "Сенсей, у вас есть планы на завтра?"
10109-101090390 = "Если вы не против, позвольте мне навестить вас."
10109-101090400 = "Планов особых нет, но..."
10109-101090410 = "Твоя работа в Семинаре в порядке?"
10109-101090420 = "С работой я уже закончила."
10109-101090430 = "Завтра я приду в Шале."
10109-101090440 = "Из-за затяжных дождей стало прохладнее."
10109-101090450 = "Но из-за этого форма долго сохнет, что доставляет неудобства."
10109-101090460 = "Понимаю..."
10109-101090470 = "И запах сырости тоже напрягает."
10109-101090480 = "Ноа, сколько у тебя форм?"
10109-101090490 = "Эм..."
10109-101090500 = "Всего четыре."
10109-101090510 = "В Миллениуме правила относительно формы не строгие,"
10109-101090520 = "поэтому у многих учениц есть только одна-две."
10109-101090530 = "Но я состою в Семинаре, так что..."
10109-101090540 = "Кстати, я, кажется, никогда не видел тебя в повседневной одежде."
10109-101090550 = "Немного жаль..."
10109-101090560 = "Хе-хе"
10109-101090570 = "Как-нибудь я вам её покажу."