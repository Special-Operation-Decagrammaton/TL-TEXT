[translation]
10109-101090010 = "Sensei, peço mil desculpas."
10109-101090020 = "Não vou conseguir ir ao plantão de amanhã."
10109-101090030 = "De manhã eu estava apenas com uma febre baixa, mas medi agora há pouco e ela subiu..."
10109-101090040 = "Hã?! Você está bem?"
10109-101090050 = "Tomei um remédio e já melhorei um pouco."
10109-101090060 = "Mas, se eu for nesse estado, tenho receio de acabar causando problemas para você."
10109-101090070 = "Prometo que vou compensar por isso sem falta."
10109-101090080 = "Descanse bastante."
10109-101090090 = "Se precisar de qualquer coisa, me avise."
10109-101090100 = "Muito obrigada, Sensei."
10109-101090110 = "Olá, Sensei."
10109-101090120 = "Graças a você, já estou me sentindo muito melhor."
10109-101090130 = "E como você está, Sensei?"
10109-101090140 = "Eu estou ótimo."
10109-101090150 = "Já está recuperada mesmo?"
10109-101090160 = "Sim, graças a você."
10109-101090170 = "Falando nisso, se você tiver disponibilidade,"
10109-101090180 = "poderia vir ao meu quarto neste fim de semana?"
10109-101090190 = "Posso ir aí de novo?"
10109-101090200 = "Ora,"
10109-101090210 = "você vai me ajudar a redecorar o quarto, não vai?"
10109-101090220 = "Não me diga que você tinha esquecido..."
10109-101090230 = "C-Claro que vou!"
10109-101090240 = "Só perguntei pra confirmar!"
10109-101090250 = "Hehe, não precisa ficar tão nervoso assim."
10109-101090260 = "Estou só brincando."
10109-101090270 = "Bom, estarei esperando ansiosamente."
10109-101090280 = "Sensei, você está bem?"
10109-101090290 = "Ouvi da Yuuka-chan que você pegou um resfriado."
10109-101090300 = "Estou bem, sim."
10109-101090310 = "Agora estou descansando bastante."
10109-101090320 = "Talvez você negue, Sensei, mas"
10109-101090330 = "quando penso que"
10109-101090340 = "isso pode ter sido culpa minha..."
10109-101090350 = "Não foi culpa sua, Noa!"
10109-101090360 = "Não se preocupe com isso."
10109-101090370 = "Mesmo assim..."
10109-101090380 = "Sensei, você já tem compromissos marcados para amanhã?"
10109-101090390 = "Se não for incomodar, deixe-me fazer uma visita para cuidar de você."
10109-101090400 = "Não tenho nada marcado, mas..."
10109-101090410 = "E o trabalho do Seminário, tudo bem?"
10109-101090420 = "Já deixei todo o meu trabalho adiantado,"
10109-101090430 = "então amanhã passo aí na Schale para ver você."
10109-101090440 = "Depois de tantos dias seguidos de chuva, o clima deu uma boa refrescada, né?"
10109-101090450 = "O problema é que o uniforme demora para secar."
10109-101090460 = "Entendo perfeitamente..."
10109-101090470 = "E aquele cheiro de roupa úmida também incomoda, né?"
10109-101090480 = "Quantos uniformes você tem, Noa?"
10109-101090490 = "Vejamos..."
10109-101090500 = "Tenho quatro ao todo."
10109-101090510 = "Na Millennium as regras sobre o uso de uniforme não são rígidas,"
10109-101090520 = "então poucas alunas têm várias mudas,"
10109-101090530 = "mas eu faço parte do Seminário, afinal."
10109-101090540 = "Pensando bem, acho que nunca vi você usando roupas casuais, Noa."
10109-101090550 = "Que pena..."
10109-101090560 = "Hehe."
10109-101090570 = "Qualquer dia desses eu mostro para você."
