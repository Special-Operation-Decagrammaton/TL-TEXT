[translation]
10109-101090010 = "Сенсей, это Ноа."
10109-101090020 = "Простите, но, похоже, завтра я не смогу выйти на смену представителя студентов."
10109-101090030 = "Утром у меня была небольшая температура, но в течение дня стало хуже."
10109-101090040 = "О нет, всё серьёзно?"
10109-101090050 = "Не волнуйтесь. Я приняла лекарство, и мне уже лучше."
10109-101090060 = "Но я боюсь заразить вас, если приду в Шале в таком состоянии."
10109-101090070 = "Простите за отмену в последний момент."
10109-101090080 = "Не переживай обо мне. Просто отдыхай!"
10109-101090090 = "Если что-то случится, пиши мне в любое время."
10109-101090100 = "Хорошо, спокойной ночи, Сенсей."
10109-101090110 = "Здравствуйте, Сенсей."
10109-101090120 = "Из-за простуды я в последнее время не могла к вам приходить."
10109-101090130 = "Вы следите за своим здоровьем?"
10109-101090140 = "Конечно, со мной всё хорошо."
10109-101090150 = "Тебе уже лучше?"
10109-101090160 = "Я полностью выздоровела!"
10109-101090170 = "Поэтому, если вы не против..."
10109-101090180 = "Не могли бы вы снова зайти ко мне в комнату на этих выходных?"
10109-101090190 = "В твою комнату?"
10109-101090200 = "Ну..."
10109-101090210 = "В прошлый раз, когда вы были здесь, вы обещали помочь мне с оформлением."
10109-101090220 = "Вы ведь не забыли?"
10109-101090230 = "Ах! Да! Конечно, помню!"
10109-101090240 = "Я просто уточнила на всякий случай!"
10109-101090250 = "Фуфу, не нужно так смущаться."
10109-101090260 = "Я просто вас дразнила."
10109-101090270 = "Тогда увидимся на выходных."
10109-101090280 = "Сенсей, вы в порядке?"
10109-101090290 = "Я слышала от другого студента, что вы простудились..."
10109-101090300 = "О, Ноа."
10109-101090310 = "Я в порядке. Наконец-то впервые за долгое время могу немного отдохнуть."
10109-101090320 = "Даже если вы говорите, что всё нормально,"
10109-101090330 = "я всё равно не могу отделаться от мысли, что это я вас заразила."
10109-101090340 = "Мне так неловко..."
10109-101090350 = "Это не из-за тебя, Ноа."
10109-101090360 = "Не переживай."
10109-101090370 = "Но всё же..."
10109-101090380 = "Сенсей, у вас ведь на завтра ничего особенного не запланировано?"
10109-101090390 = "Тогда можно я зайду примерно в обед?"
10109-101090400 = "Я не против, но..."
10109-101090410 = "У тебя будет время? Нет дел Семинара?"
10109-101090420 = "Всё хорошо. Я уже разобралась со всей работой, накопившейся за время болезни."
10109-101090430 = "Увидимся завтра."
10109-101090440 = "Хорошо, что с дождём стало прохладнее,"
10109-101090450 = "но зато бельё не успевает нормально высохнуть."
10109-101090460 = "Понимаю это чувство..."
10109-101090470 = "А если бельё слишком долго сушится, оно начинает пахнуть."
10109-101090480 = "Кстати, сколько у тебя школьных форм, Ноа?"
10109-101090490 = "Хм..."
10109-101090500 = "С запасными — примерно 4 комплекта?"
10109-101090510 = "В Миллениуме форма одежды не очень строгая,"
10109-101090520 = "поэтому сомневаюсь, что большинство студентов держат несколько одинаковых комплектов."
10109-101090530 = "Но я ведь из Семинара."
10109-101090540 = "Если подумать, я никогда не видел тебя в повседневной одежде."
10109-101090550 = "Хм... Какая жалость..."
10109-101090560 = "Хи-хи."
10109-101090570 = "Когда-нибудь покажу, если представится возможность."
