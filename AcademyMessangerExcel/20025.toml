[translation]
20025-200250010 = "Feliz Ano Novo! Aqui é (Seu Nome)."
20025-200250020 = "Que este novo ano seja repleto de felicidades para o(a) Sr.(a) (Nome do Destinatário)."
20025-200250030 = "Desejo tudo de bom do fundo do meu coração."
20025-200250040 = "Conto com o seu apoio neste ano também. Atenciosamente, (Seu Nome)."
20025-200250050 = "...?"
20025-200250060 = "Ah! Obrigado, Haruka!"
20025-200250070 = "Feliz Ano Novo pra você também!"
20025-200250080 = "Ah!"
20025-200250090 = "Sim, senhor!!"
20025-200250100 = "Sensei..."
20025-200250110 = "É que..."
20025-200250120 = "Hum..."
20025-200250130 = "Ouvi dizer que você estava me procurando."
20025-200250140 = "Sim, obrigado por mandar mensagem."
20025-200250150 = "Você tem um tempinho agora?"
20025-200250160 = "Hã?"
20025-200250170 = "Ah, sim! Estou indo agora mesmo!"
20025-200250180 = "Eu vou até aí, então pode ficar esperando onde estiver, Sensei!"
20025-200250190 = "Muito obrigada por me chamar!"
20025-200250200 = "Muito obrigada, Sensei. Graças a você, fiquei quentinha durante todo o caminho de volta para casa."
20025-200250210 = "Ah, que bom."
20025-200250220 = "Fiz um tratamento especial de conservação no aquecedor de mão que você me deu e o tranquei num cofre. Vou protegê-lo com a minha própria vida como uma relíquia de família."
20025-200250230 = "Certo."
20025-200250240 = "...Hã?"
20025-200250250 = "Como o vento anda muito gelado ultimamente, agasalhe-se bem para não pegar um resfriado."
20025-200250260 = "Ah."
20025-200250270 = "Não!"
20025-200250280 = "Acabou soando como se eu estivesse te dando uma ordem..."
20025-200250290 = "Não era a minha intenção escrever desse jeito!"
20025-200250300 = "Quer dizer, não é que eu não quisesse que você se cuidasse, mas..."
20025-200250310 = "Não!"
20025-200250320 = "Me desculpe, me desculpe, me desculpe, me desculpe!"
20025-200250330 = "Calma, eu entendi direitinho o que você quis dizer."
20025-200250340 = "Obrigado, Haruka."
20025-200250350 = "Ah..."
20025-200250360 = "Sim."
20025-200250370 = "Me desculpe..."
20025-200250380 = "Sensei..."
20025-200250390 = "Hum..."
20025-200250400 = "Como você me deu tantas coisas hoje, como eu disse agora há pouco..."
20025-200250410 = "Mesmo na próxima encarnação..."
20025-200250420 = "Por favor..."
20025-200250430 = "Deixe-me continuar servindo a você."
20025-200250440 = "Muito obrigada por tudo."
20025-200250450 = "Eu é que agradeço, Haruka."
20025-200250460 = "Está fazendo bastante frio, então cuide bem da saúde você também."
20025-200250470 = "Ah!"
20025-200250480 = "Sim, senhor!!"
