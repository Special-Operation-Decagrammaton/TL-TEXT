13006-1074 = "Я работаю."
13006-1075 = "Я дышу."
13006-1076 = "Правда? Хм, понятно."
13006-1077 = "Тогда нельзя вам мешать."
13006-1078 = "Ну, удачи, Сенсей!"
13006-1079 = "Ахахаха!!"
13006-1080 = "Понятно~ ага-ага! Дышать очень важно!"
