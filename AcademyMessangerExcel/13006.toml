13006-1082 = "Ну, удачи!"
13006-1083 = "Куфуфу."
13006-1084 = "Сегодня было весело~, Сенсей!"
13006-1085 = "В следующий раз обязательно много поиграем."
13006-1086 = "Сенсей, у вас сегодня есть свободное время?"
13006-1087 = "Эм, я занят, но...?"
13006-1088 = "Как ты узнала!?"
13006-1089 = "Что~? Заняты~?"
