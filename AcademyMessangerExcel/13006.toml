13006-1091 = "Потому что у вас с самого начала не было выбора!"
13006-1092 = "М-м? Почему?"
13006-1093 = "...Куфуфу, недооценивать разведывательные способности Бенрии не стоит~?"
13006-1094 = "Поэтому сегодня я хочу, чтобы вы пришли к нам в гости! (≧∇≦)ﾉ"
13006-1095 = "У вас есть какие-нибудь увлечения, Сенсей?"
13006-1096 = "Конечно."
13006-1097 = "Наверное, нет таких, чтобы я называл их увлечениями..."
13006-1098 = "Понятно~. Всё-таки, иметь хобби — это здорово~"
13006-1099 = "Когда увлекаешься, время летит незаметно."
13006-1100 = "И когда узнаёшь что-то новое о любимом деле, чувствуешь удовлетворение?"
13006-1101 = "Это весело~!"
13006-1102 = "Хм, вот как~?"
13006-1103 = "Это немного обидно~"
13006-1104 = "Хотелось бы как-нибудь поговорить с тобой о таких вещах, это должно быть интересно! (〇'ヮ'〇)"
13006-1105 = "Сенсей, к нам в Бенрию поступил странный заказ!"
13006-1106 = "И он очень-очень странный~?"
13006-1107 = "Но при этом очень интересный~?"
13006-1108 = "Если Муцуки говорит, что он очень странный, что же это за заказ..."
13006-1109 = "Если Муцуки говорит, что он очень интересный, что же это за заказ..."
13006-1110 = "М-м, ну ладно! Оставим подробности!"
13006-1111 = "Я хочу, чтобы вы помогли, Сенсей~?"
13006-1112 = "Сегодня было весело~, Сенсей!"
13006-1113 = "В следующий раз я точно добьюсь успеха,"
13006-1114 = "так что будьте готовы~! ＼( 'ω') /"