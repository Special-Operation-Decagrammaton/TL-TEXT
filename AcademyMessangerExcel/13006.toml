[translation]
13006-1072 = "Мне скучно! (つ ◑▽◑)つ"
13006-1073 = "Сенсей, что вы сейчас делаете?"
13006-1074 = "Я работаю."
13006-1075 = "Я дышу."
13006-1076 = "Да? Хм. Хорошо."
13006-1077 = "Тогда, пожалуй, не буду мешать."
13006-1078 = "Ладно! Работайте усердно, Сенсей!"
13006-1079 = "А-ха-ха-ха!"
13006-1080 = "Понятно! Да, дышать очень важно!"
13006-1081 = "Я буду болеть за вас, Сенсей."
13006-1082 = "Вперёд!"
13006-1083 = "Хи-хи-хи."
13006-1084 = "Сегодня было так весело, Сенсей!"
13006-1085 = "Давайте в следующий раз снова поиграем."
13006-1086 = "Сенсей, вы сегодня свободны, да?"
13006-1087 = "Нет, я занят."
13006-1088 = "К-Как ты узнала?!"
13006-1089 = "А? Вы заняты?"
13006-1090 = "Ну, неважно!"
13006-1091 = "У вас всё равно изначально не было выбора!"
13006-1092 = "А? В смысле как я узнала?"
13006-1093 = "Хи-хи... Не недооценивайте разведданные Решателей проблем!"
13006-1094 = "Приходите сегодня в офис «Решателей проблем 68»!\n(≧∇≦)ﾉ"
13006-1095 = "Сенсей, у вас есть хобби?"
13006-1096 = "Конечно."
13006-1097 = "Нет, ничего такого, что я назвал бы хобби."
13006-1098 = "Ха-ха! Конечно... иметь хобби здорово!"
13006-1099 = "Когда я увлечена, время летит незаметно."
13006-1100 = "Разбираться в интересной теме так приятно — чувствуешь, что чего-то достиг."
13006-1101 = "Да! Это очень весело!"
13006-1102 = "О, правда?"
13006-1103 = "Это немного разочаровывает..."
13006-1104 = "Да, давайте как-нибудь поговорим о наших хобби! (〇╹ヮ╹〇)"
13006-1105 = "Сенсей, «Решатели проблем 68» получили особый заказ!"
13006-1106 = "Снова огромный заказ?"
13006-1107 = "Снова интересный заказ?"
13006-1108 = "Когда вы говорите «огромный», я даже не знаю, чего вы ожидаете..."
13006-1109 = "Когда вы говорите «интересный», я даже не знаю, чего вы ожидаете..."
13006-1110 = "Эм... Уже неважно."
13006-1111 = "Помогите, Сенсей!"
13006-1112 = "Сегодня было очень весело, Сенсей!"
13006-1113 = "Следующее дело точно будет полным успехом."
13006-1114 = "Так что берегитесь! ＼( ╹ω╹) /"
