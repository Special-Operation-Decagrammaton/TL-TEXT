[translation]
20003-2136 = "Спасибо за сегодняшнюю работу."
20003-2137 = "Это я должна сказать тебе, Маширо."
20003-2138 = "Благодаря вам, Сенсей, мы сегодня благополучно отразили зло."
20003-2139 = "Ваше командование сегодня было великолепным. Я многому научилась."
20003-2140 = "А, кстати..."
20003-2141 = "Кстати?"
20003-2142 = "Что-то ещё случилось?"
20003-2143 = "Нет, просто во время операции распоролся шов на юбке..."
20003-2144 = "Если не получится починить, возможно, придётся достать запасную форму."
20003-2145 = "Недавно я прочитала интересную книгу о справедливости."
20003-2146 = "О том, как должен поступать тот, кто стремится к справедливости, в различных ситуациях..."
20003-2147 = "Это была книга, которая учит таким вещам."
20003-2148 = "Что-то вроде руководства для героя справедливости?"
20003-2149 = "Есть ли книги для тех, кто преследует зло?"
20003-2150 = "Возможно, это похоже на то. Было очень интересно."
20003-2151 = "Этого, прошу прощения, я не знаю..."
20003-2152 = "Однако при чтении встретились моменты, которые я не совсем поняла."
20003-2153 = "Должно быть, из-за недостатка моего понимания справедливости..."
20003-2154 = "Если вы не против, Сенсей, не могли бы вы научить меня справедливости?"
20003-2155 = "Справедливости...?"
20003-2156 = "Я завершила сегодняшнюю тренировку в Шале. После этого вернусь в академию."
20003-2157 = "А какие тренировки обычно проходят снайперы?"
20003-2158 = "Вас интересует подготовка снайпера?"
20003-2159 = "Хотя, по сути, она мало чем отличается от других."
20003-2160 = "Разница разве что в том, что мы учимся искусству скрытности."
20003-2161 = "Можно мне как-нибудь посмотреть?"
20003-2162 = "Смотреть можно, но... это вряд ли будет интересно, правда?"
20003-2163 = "Я уже говорила ранее, но повторю:"
20003-2164 = "из-за сегодняшней тренировки сегодняшнее дежурство перенесено на другой день."
20003-2165 = "Заранее спасибо."
20003-2166 = "Хорошо, понял. Кстати, можно мне пойти с вами на тренировку?"
20003-2167 = "Вы хотите помочь с тренировкой?"
20003-2168 = "Да, можно?"
20003-2169 = "Проблем нет, но... сегодняшняя будет довольно тяжёлой, так что советую вам быть готовым."
20003-2170 = "( ºㅁº )"
20003-2171 = "Эм, Сенсей... вы в порядке?"
20003-2172 = "На обратном пути у вас было такое лицо, будто душа вышла..."
20003-2173 = "( ºㅁº )"
20003-2174 = "Всё-таки та тренировка была слишком суровой для первого раза..."
20003-2175 = "( ºㅁº )"
20003-2176 = "Сенсей!?"
20003-2177 = "Настало время вершить справедливость!"
20003-2178 = "Что случилось?"
20003-2179 = "Наконец настал час моей кончины..."
20003-2180 = "Что? Сенсей, вы что-то совершили против справедливости?"
20003-2181 = "Эм, по информации старших,"
20003-2182 = "сегодня в полдень негодяй с чёрного рынка, настоящий злодей,"
20003-2183 = "должен проезжать рядом с Тринити."
20003-2184 = "Давайте подкараулим его на крыше и застрелим!"
20003-2185 = "Застрелить... страшно..."
20003-2186 = "Сегодня тренировка закончилась раньше, чем я ожидала."
20003-2187 = "Раз мы так хорошо поработали, есть время для себя."
20003-2188 = "А что ты обычно делаешь в таких случаях, Маширо?"
20003-2189 = "Ну, читаю или гуляю..."
20003-2190 = "Ещё я люблю забираться на высоту."
20003-2191 = "На высоту...?"
20003-2192 = "Эта реакция... может, это странное увлечение?"
20003-2193 = "Я думала, это нормально..."
20003-200030010 = "Можно спросить кое-что..."
20003-200030020 = "Вы любите читать?"
20003-200030030 = "В общем, да..."
20003-200030040 = "Понятно."
20003-200030050 = "Ты читаешь книги о справедливости?"
20003-200030060 = "Нет, не совсем."
20003-200030070 = "Просто стало интересно."