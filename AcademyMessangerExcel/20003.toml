[translation]
20003-2136 = "Bom trabalho hoje também"
20003-2137 = "Bom trabalho para você também, Mashiro"
20003-2138 = "Graças a você, Sensei, conseguimos repelir o mal em segurança e sem nenhum ferido hoje"
20003-2139 = "O seu comando foi impecável mais uma vez. Aprendi muito com você"
20003-2140 = "Ah, por falar nisso......"
20003-2141 = "Sim?"
20003-2142 = "Houve algum outro problema?"
20003-2143 = "Não, é que a costura da minha saia acabou descosturando durante a operação......"
20003-2144 = "Se eu não conseguir consertar, talvez precise pegar o uniforme reserva"
20003-2145 = "Recentemente, li um livro muito interessante sobre a justiça"
20003-2146 = "Ele ensinava como aqueles que buscam a justiça devem agir diante das mais diversas situações......"
20003-2147 = "Foi uma leitura bastante instrutiva"
20003-2148 = "Tipo um...... Manual do Herói da Justiça?"
20003-2149 = "Será que também existe um livro para aqueles que buscam o mal?"
20003-2150 = "De fato, pode-se dizer que é algo bem próximo disso. Achei muito fascinante"
20003-2151 = "Quanto a isso, peço desculpas, não saberia dizer......"
20003-2152 = "Contudo, houve algumas partes do livro que não consegui compreender muito bem"
20003-2153 = "Imagino que seja porque a minha compreensão sobre a justiça ainda é insuficiente......"
20003-2154 = "Se não se importar, Sensei, você poderia me ensinar mais sobre a justiça?"
20003-2155 = "Sobre a justiça......?"
20003-2156 = "Concluí o treinamento de hoje na Schale. Estou retornando para a academia agora"
20003-2157 = "Como costuma ser o treinamento de uma sniper?"
20003-2158 = "Você tem curiosidade sobre o treinamento de sniper?"
20003-2159 = "Para falar a verdade, no geral não é muito diferente do treino das outras integrantes"
20003-2160 = "A principal diferença talvez seja o foco em aprender técnicas de ocultação e camuflagem"
20003-2161 = "Posso ir assistir qualquer dia desses?"
20003-2162 = "Não me importo que venha assistir, mas...... acho que você não vai achar nada muito empolgante, viu?"
20003-2163 = "Como já havia comentado antes, passo para confirmar que,"
20003-2164 = "Devido ao treinamento de hoje, mudei o meu plantão que estava agendado para outro dia"
20003-2165 = "Agradeço a compreensão"
20003-2166 = "Certo, combinado. Aliás, posso ir junto no treinamento de hoje?"
20003-2167 = "Você quer me ajudar no treinamento?"
20003-2168 = "Sim, tudo bem por você?"
20003-2169 = "Não há problema algum, mas...... o treino de hoje é um pouco puxado, então recomendo vir preparado"
20003-2170 = "( ºㅁº )"
20003-2171 = "Hum, Sensei...... você está bem?"
20003-2172 = "No caminho de volta, você estava com uma expressão como se a sua alma tivesse saído do corpo......"
20003-2173 = "( ºㅁº )"
20003-2174 = "Receio que aquele treinamento tenha sido pesado demais para quem está começando......"
20003-2175 = "( ºㅁº )"
20003-2176 = "Sensei!?"
20003-2177 = "Chegou a hora de realizarmos a justiça!"
20003-2178 = "O que aconteceu?"
20003-2179 = "Então finalmente chegou o fim da minha vida......"
20003-2180 = "Hã? Por acaso você cometeu algum ato contra a justiça, Sensei?"
20003-2181 = "Hum, segundo informações das minhas veteranas,"
20003-2182 = "Um criminoso cruel e infame do Mercado Negro vai passar"
20003-2183 = "Perto da Academia Geral Trinity hoje ao meio-dia"
20003-2184 = "Vamos ficar de tocaia no terraço de um prédio e neutralizar esse malfeitor à distância!"
20003-2185 = "Neutralizar à distância dá medo......"
20003-2186 = "O treinamento de hoje terminou bem mais cedo do que eu esperava"
20003-2187 = "Graças ao nosso esforço, parece que terei algum tempo livre para mim"
20003-2188 = "O que você costuma fazer quando sobra um tempinho assim, Mashiro?"
20003-2189 = "Vejamos, gosto de ler livros ou fazer caminhadas, mas......"
20003-2190 = "Também gosto muito de subir em lugares altos"
20003-2191 = "Lugares altos......?"
20003-2192 = "Pela sua reação...... por acaso esse é um passatempo estranho?"
20003-2193 = "Eu sempre achei que fosse um hobby perfeitamente normal......"
20003-200030010 = "Gostaria de fazer uma pequena pergunta......"
20003-200030020 = "Você gosta de ler, Sensei?"
20003-200030030 = "Gosto razoavelmente, eu diria......"
20003-200030040 = "Entendo"
20003-200030050 = "Está lendo algum livro sobre a justiça?"
20003-200030060 = "Não, não é isso"
20003-200030070 = "Fiquei apenas curiosa"
