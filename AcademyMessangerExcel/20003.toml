[translation]
20003-2136 = "Хорошая работа сегодня."
20003-2137 = "Ты тоже отлично справилась, Маширо."
20003-2138 = "Благодаря вашим наставлениям сегодня я смогла безопасно сразиться со злом."
20003-2139 = "Ваши указания были безупречны. Сегодня я многому научилась."
20003-2140 = "Но..."
20003-2141 = "Но...?"
20003-2142 = "Что-то не так?"
20003-2143 = "Во время задания у меня порвалась юбка."
20003-2144 = "Возможно, мне понадобится запасная форма."
20003-2145 = "Недавно я прочитала интересную книгу о справедливости."
20003-2146 = "Это книга, которая рассказывает людям, стремящимся к справедливости,"
20003-2147 = "как вести себя в разных ситуациях."
20003-2148 = "То есть что-то вроде руководства для героев справедливости?"
20003-2149 = "А есть книга для тех, кто стремится к несправедливости?"
20003-2150 = "Да, она довольно интересная."
20003-2151 = "Насчёт этого не знаю..."
20003-2152 = "Но пока читала, встретила несколько вещей, которые не смогла понять."
20003-2153 = "Может, потому что я ещё не до конца понимаю справедливость."
20003-2154 = "Можете научить меня, что она значит?"
20003-2155 = "Справедливость?"
20003-2156 = "Я только что закончила интенсивную тренировку на стрельбище Шале и вернулась в школу."
20003-2157 = "Как обычно тренируются снайперы?"
20003-2158 = "Вы хотите знать, как тренируются снайперы?"
20003-2159 = "Наши тренировки не так уж отличаются от тренировок других студентов."
20003-2160 = "Единственная разница — мы учимся маскироваться."
20003-2161 = "Можно прийти посмотреть?"
20003-2162 = "Не вижу причин отказывать, но весело не будет."
20003-2163 = "Из-за сегодняшней тренировки"
20003-2164 = "наши обязанности немного задержались."
20003-2165 = "Пожалуйста, имейте это в виду."
20003-2166 = "Можно пойти на тренировку с тобой?"
20003-2167 = "Вы хотите помочь мне с сегодняшней тренировкой?"
20003-2168 = "Да, есть проблема?"
20003-2169 = "Нет, но сегодняшняя тренировка должна быть довольно интенсивной... Учтите это."
20003-2170 = "( ºㅁº )"
20003-2171 = "Эм... Сенсей? Вы в порядке?"
20003-2172 = "Вы так побледнели..."
20003-2173 = "( ºㅁº )"
20003-2174 = "Я же говорила, что тренировка интенсивная..."
20003-2175 = "( ºㅁº )"
20003-2176 = "Сенсей?!"
20003-2177 = "Пришло время справедливости, Сенсей!"
20003-2178 = "Что происходит?"
20003-2179 = "Значит, ты наконец пришла за мной..."
20003-2180 = "Что вы имеете в виду? Вы сделали что-то противоположное справедливости?"
20003-2181 = "По моей информации,"
20003-2182 = "какие-то злодеи с мерзкого Чёрного рынка"
20003-2183 = "должны появиться возле Тринити сегодня в полдень."
20003-2184 = "Я буду ждать их на крыше соседнего здания и обезврежу!"
20003-2185 = "Обезвредишь? Страшно звучит..."
20003-2186 = "Сегодня тренировка закончилась немного раньше."
20003-2187 = "Кажется, у меня есть немного свободного времени."
20003-2188 = "Что ты обычно делаешь в свободное время, Маширо?"
20003-2189 = "Иногда читаю. Обычно гуляю..."
20003-2190 = "А ещё люблю подниматься на высокие места."
20003-2191 = "Высокие места?"
20003-2192 = "А? Это странно? Почему вы так удивлены?"
20003-2193 = "Я думала, это довольно обычное увлечение..."
20003-200030010 = "Может, вопрос покажется случайным,"
20003-200030020 = "но вы любите читать, Сенсей?"
20003-200030030 = "Наверное...?"
20003-200030040 = "Понятно."
20003-200030050 = "Ты снова читаешь книгу о справедливости?"
20003-200030060 = "Нет, дело не в этом."
20003-200030070 = "Мне просто стало интересно."
