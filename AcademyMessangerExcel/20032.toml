[translation]
20032-200320010 = "Взрослые придирчивы к одежде?"
20032-200320020 = "Думаю, у всех по-разному."
20032-200320030 = "Для меня это не главный приоритет..."
20032-200320040 = "У меня есть свободное время. Я хотела потратить его на покупки."
20032-200320050 = "Но мода мне чужда. Ты учитель, так что обучи меня своим методам."
20032-200320060 = "Я встречусь с тобой после того, как соберу всё необходимое."
20032-200320070 = "???"
20032-200320080 = "Спасибо за сегодняшнее обучение, Сенсей."
20032-200320090 = "Я скоро свяжусь с тобой."
20032-200320100 = "День настал, Сенсей."
20032-200320110 = "Какой день?"
20032-200320120 = "Раньше ты согласился помочь мне выбрать одежду."
20032-200320130 = "Сегодня ты выполнишь своё обещание."
20032-200320140 = "Сейчас отправлю местоположение. Пожалуйста, приходи немедленно."
20032-200320150 = "Ты такая напористая, сама того не замечая..."
20032-200320160 = "Я очень благодарна за сегодняшнюю помощь, Сенсей."
20032-200320170 = "Ты выполнил первоначальное поручение и купил мне подарок."
20032-200320180 = "Я был рад это сделать."
20032-200320190 = "ПОЖАЛУЙСТА, не надевай один купальник, если собираешься к Ледниковому морю."
20032-200320200 = "Да. Мне нравится эта куртка."
20032-200320210 = "Я буду носить её как можно чаще."
20032-200320220 = "Сенсей."
20032-200320230 = "Ты занят? Встреться со мной в комнате спецопераций, чтобы обсудить нашу следующую миссию."
20032-200320240 = "У меня сейчас довольно плотное расписание."
20032-200320250 = "Понятно. Принято."
20032-200320260 = "Я свяжусь с тобой позже."
20032-200320270 = "Вам уже лучше, Сенсей?"
20032-200320280 = "Я уже согрелась! Спасибо!"
20032-200320290 = "Я рада это слышать."
20032-200320300 = "Спасибо за помощь сегодня, Сенсей."
20032-200320310 = "Я не понимала, какой подтекст несёт мой наряд."
20032-200320320 = "Заменить купальник нижним бельём было вдохновенным решением."
20032-200320330 = "Впитывающий материал купальника отлично подходит, чтобы впитывать пот под курткой."
20032-200320340 = "Кажется, для этого есть термин. Функциональность?"
20032-200320350 = "Можно и так сказать!"
20032-200320360 = "Ты очень мудр, Сенсей."
20032-200320370 = "Мода — сложная и запутанная индустрия."
20032-200320380 = "Я с нетерпением жду возможности узнать о ней от тебя ещё больше."
20032-200320390 = "Думаю, это рай, Сенсей."
20032-200320400 = "Рай?"
20032-200320410 = "Да. Здесь очень хорошо."
20032-200320420 = "Хочешь посетить рай?"
20032-200320430 = "О! Надеюсь, это горячий источник!"
20032-200320440 = "Эм... Это из той же категории..."
20032-200320450 = "Я решила, что мои эксперименты с холодной ванной были нереалистичны."
20032-200320460 = "Рад это слышать."
20032-200320470 = "Хотя ты довольно сильно воодушевилась этим проектом."
20032-200320480 = "Мне будет не хватать расслабляющей температуры воды..."
20032-200320490 = "Однако ты не всегда сможешь заваривать чай."
20032-200320500 = "Я не могу простудиться и заставить Сенсея волноваться."
20032-200320510 = "..."
20032-200320520 = "Спасибо за заботу, Сенсей."
