[translation]
20032-200320010 = "Взрослые, наверное, довольно придирчивы к одежде."
20032-200320020 = "Возможно, ты права."
20032-200320030 = "Я не очень разбираюсь в этом, но..."
20032-200320040 = "У меня появилось свободное время, и я подумала сходить за покупками."
20032-200320050 = "Я не очень разбираюсь в моде, так что хотела бы позже спросить вашего совета."
20032-200320060 = "Короче, я принесу несколько вещей."
20032-200320070 = "???"
20032-200320080 = "Спасибо за сегодня, Сенсей."
20032-200320090 = "Я напишу вам позже."
20032-200320100 = "Сегодня день нашей встречи."
20032-200320110 = "Встречи...?"
20032-200320120 = "Вы же поможете мне выбрать одежду?"
20032-200320130 = "Вы же обещали."
20032-200320140 = "Приходите по адресу, который я сейчас пришлю."
20032-200320150 = "П-понял...!"
20032-200320160 = "Спасибо за сегодня, Сенсей."
20032-200320170 = "Вы даже подарили мне подарок..."
20032-200320180 = "Не за что."
20032-200320190 = "Когда пойдёте в Ледяное море, обязательно надевайте тёплую одежду!?"
20032-200320200 = "Да. Она мне очень понравилась."
20032-200320210 = "Буду носить её каждый день."
20032-200320220 = "Сенсей"
20032-200320230 = "У меня есть разговор по поводу следующей операции, у вас есть время?"
20032-200320240 = "Сегодня я занят..."
20032-200320250 = "Тогда ничего не поделаешь."
20032-200320260 = "Я напишу вам позже."
20032-200320270 = "Сенсей... вы не простудились?"
20032-200320280 = "Нет, я согрелся, и мне стало лучше."
20032-200320290 = "Ну и хорошо."
20032-200320300 = "Спасибо и за сегодня, Сенсей."
20032-200320310 = "Я и не знала, что у одежды есть сочетаемость."
20032-200320320 = "Кстати, может, я буду носить купальник вместо нижнего белья?"
20032-200320330 = "Я сильно вспотела в куртке, но мне было всё равно, потому что купальник не промокает."
20032-200320340 = "Это называется функциональная красота...?"
20032-200320350 = "Ну, в общем... наверное."
20032-200320360 = "Как и ожидалось от Сенсея."
20032-200320370 = "Мода — это действительно глубоко."
20032-200320380 = "В следующий раз расскажите мне ещё что-нибудь."
20032-200320390 = "Сенсей, это место, возможно, рай."
20032-200320400 = "Рай?"
20032-200320410 = "Да... я нашла хорошее место."
20032-200320420 = "Вы тоже хотите пойти?"
20032-200320430 = "Может, вы нашли горячий источник?"
20032-200320440 = "Мм... похоже на то..."
20032-200320450 = "Я откажусь от холодной ванны."
20032-200320460 = "Хорошо!"
20032-200320470 = "Но почему вы отказались?"
20032-200320480 = "Холодная ванна была приятной, но..."
20032-200320490 = "Вы же не каждый раз будете заваривать мне чай..."
20032-200320500 = "И если я простужусь, вы будете переживать."
20032-200320510 = "..."
20032-200320520 = "Спасибо вам всегда, Сенсей."