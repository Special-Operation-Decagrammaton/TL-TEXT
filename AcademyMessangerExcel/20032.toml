[translation]
20032-200320010 = "Adultos costumam ligar bastante para roupas, né?"
20032-200320020 = "É, acho que sim."
20032-200320030 = "Embora eu não entenda muito do assunto..."
20032-200320040 = "Como sobrou um tempinho livre, estava pensando em sair para fazer compras."
20032-200320050 = "Não entendo quase nada de moda, então queria pedir a sua opinião depois, Sensei."
20032-200320060 = "Por enquanto, vou levar várias peças comigo."
20032-200320070 = "???"
20032-200320080 = "Obrigada por hoje, Sensei."
20032-200320090 = "Depois entro em contato de novo."
20032-200320100 = "Hoje é o dia da nossa promessa."
20032-200320110 = "Promessa...?"
20032-200320120 = "Você vai me ajudar a escolher roupas novas, lembra?"
20032-200320130 = "Você me prometeu outro dia."
20032-200320140 = "Venha até o endereço que vou te mandar agora."
20032-200320150 = "E-Entendido...!"
20032-200320160 = "Obrigada por hoje, Sensei."
20032-200320170 = "Acabei até ganhando um presente seu..."
20032-200320180 = "Imagina, não foi nada."
20032-200320190 = "Mas quando voltarmos para o mar glacial, venha com roupa de frio de verdade, combinado?!"
20032-200320200 = "Tá bom. Eu gostei muito dessa peça que você me deu."
20032-200320210 = "Vou usar todos os dias."
20032-200320220 = "Sensei."
20032-200320230 = "Queria conversar sobre a próxima operação, você tem um tempinho?"
20032-200320240 = "Hoje estou meio atolado de trabalho aqui..."
20032-200320250 = "Entendi, então deixa pra próxima."
20032-200320260 = "Depois te mando mensagem de novo."
20032-200320270 = "Sensei... E o seu resfriado, melhorou?"
20032-200320280 = "Sim, fiquei bem agasalhado e já melhorei."
20032-200320290 = "Que bom."
20032-200320300 = "Obrigada por hoje também, Sensei."
20032-200320310 = "Eu não sabia que existia esse negócio de combinar peças de roupa."
20032-200320320 = "Aliás, acho que daqui pra frente vou passar a usar biquíni no lugar de roupa íntima."
20032-200320330 = "Agora há pouco eu suei bastante por baixo da jaqueta, mas como estava de biquíni, nem me incomodou ficar molhada."
20032-200320340 = "É isso que chamam de beleza funcional...?"
20032-200320350 = "Hum, bom... errado não está..."
20032-200320360 = "Não esperava menos de você, Sensei."
20032-200320370 = "O mundo da moda é mesmo profundo."
20032-200320380 = "Me ensine mais coisas da próxima vez."
20032-200320390 = "Sensei, acho que este lugar é o paraíso."
20032-200320400 = "O paraíso?"
20032-200320410 = "Sim... encontrei um lugar ótimo."
20032-200320420 = "Quer vir também, Sensei?"
20032-200320430 = "Achou alguma fonte termal ou algo assim?"
20032-200320440 = "Hm... Digamos que é parecido..."
20032-200320450 = "Vou desistir dos banhos de água gelada."
20032-200320460 = "Ainda bem!"
20032-200320470 = "Mas o que fez você mudar de ideia?"
20032-200320480 = "O banho gelado era muito refrescante, mas..."
20032-200320490 = "Você não vai estar sempre por perto para preparar chá quente para mim..."
20032-200320500 = "E se eu acabar pegando um resfriado, você vai ficar preocupado comigo, Sensei."
20032-200320510 = "..."
20032-200320520 = "Obrigada por tudo sempre, Sensei."
