[translation]
20034-200340010 = "В это время года в торговом районе проводят много мероприятий."
20034-200340020 = "Полагаю, эти мероприятия привлекли твоё внимание?"
20034-200340030 = "Конечно."
20034-200340040 = "Особенно те, где есть еда."
20034-200340050 = "Подожди... Торговый район... Мероприятия... Еда?"
20034-200340060 = "Хи-хи."
20034-200340070 = "Волнуешься?"
20034-200340080 = "Не могу дождаться!"
20034-200340090 = "Одзони такое вкусное."
20034-200340100 = "Настолько вкусное, что из-за него могла случиться небольшая неприятность..."
20034-200340110 = "Когда ты говоришь «небольшая» неприятность..."
20034-200340120 = "звучит так, будто всё серьёзно..."
20034-200340130 = "О, Сенсей."
20034-200340140 = "Правда, это совсем небольшая неприятность. Обещаю."
20034-200340150 = "Я положила слишком много моти в одзони,"
20034-200340160 = "и в итоге использовала все моти, что оставались дома."
20034-200340170 = "Во всём нужна умеренность..."
20034-200340180 = "Но я хочу ещё моти."
20034-200340190 = "Именно поэтому"
20034-200340200 = "я кое-что приготовила."
20034-200340210 = "Мне всегда нравится"
20034-200340220 = "как мы отмечаем это время года вкусной едой и ценим особые моменты."
20034-200340230 = "По-моему, отличная традиция."
20034-200340240 = "Ты имела в виду какое-то конкретное блюдо?"
20034-200340250 = "Ну, это не совсем определённая еда,"
20034-200340260 = "но мне ужасно хочется кое-чего особенного."
20034-200340270 = "И подумать только, всё началось с небольшого слуха."
20034-200340280 = "От одного рассказа у меня уже живот урчит."
20034-200340290 = "Похоже, ты услышала о какой-то новой вкусной еде."
20034-200340300 = "Да."
20034-200340310 = "И когда ты о ней услышишь, тоже захочешь, Сенсей."
