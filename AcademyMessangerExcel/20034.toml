[translation]
20034-200340010 = "Nesta época do ano, o distrito comercial costuma realizar vários eventos diferentes, né?"
20034-200340020 = "Não sabia que você também se interessava por esse tipo de evento, Akari."
20034-200340030 = "Mas é claro que sim★"
20034-200340040 = "Porque ocasiões assim costumam ser ótimas oportunidades para descobrir novas iguarias gastronômicas!"
20034-200340050 = "Iguarias gastronômicas...?"
20034-200340060 = "Hehe."
20034-200340070 = "Só de pensar nisso já não dá uma empolgação, Sensei?"
20034-200340080 = "Eu estou super empolgada!"
20034-200340090 = "Sopa ozoni de Ano Novo é uma delícia, não é?"
20034-200340100 = "E justamente por ser tão gostosa, acabou surgindo um pequeno probleminha."
20034-200340110 = "Vindo de você, Akari..."
20034-200340120 = "Tenho a impressão de que não é nada pequeno..."
20034-200340130 = "Ora, ora."
20034-200340140 = "Desta vez é algo realmente simples, viu?"
20034-200340150 = "Estava tão gostoso que acabei usando todo o estoque de mochi lá de casa"
20034-200340160 = "para preparar ozoni."
20034-200340170 = "Tudo em excesso faz falta depois..."
20034-200340180 = "Mas é que eu estava com tanta vontade de comer bastante mochi!"
20034-200340190 = "E por conta disso..."
20034-200340200 = "Tive uma ideia para resolver esse problema!"
20034-200340210 = "Passar um momento especial saboreando um prato especial..."
20034-200340220 = "Essa é, sem dúvida,"
20034-200340230 = "a melhor parte desta época do ano."
20034-200340240 = "Tem alguma coisa que você está com vontade de comer?"
20034-200340250 = "Mais do que algo que já gosto..."
20034-200340260 = "Tem uma coisa que fiquei morrendo de vontade de experimentar."
20034-200340270 = "O poder do boca a boca é mesmo impressionante, né?"
20034-200340280 = "Desperta o nosso apetite quase que instantaneamente."
20034-200340290 = "Leu alguma matéria de gastronomia?"
20034-200340300 = "Acertou em cheio!"
20034-200340310 = "Tenho certeza de que você também vai ficar curioso quando vir, Sensei!"
