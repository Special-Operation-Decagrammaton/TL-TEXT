[translation]
20034-200340010 = "В этом сезоне в торговом районе проходит много разных мероприятий, правда?"
20034-200340020 = "Ты тоже интересуешься такими вещами, Акари?"
20034-200340030 = "Конечно!★"
20034-200340040 = "Ведь это часто шанс открыть для себя новую гастрономию."
20034-200340050 = "Гастрономию...?"
20034-200340060 = "Хе-хе"
20034-200340070 = "Сенсей, разве вам не становится интересно от такой мысли?"
20034-200340080 = "Я очень взволнована!"
20034-200340090 = "О-дзони ведь вкусное, да?"
20034-200340100 = "Поэтому можно сказать, что у него есть небольшая проблема."
20034-200340110 = "Когда Акари говорит..."
20034-200340120 = "это звучит совсем не как что-то мелкое..."
20034-200340130 = "Ой"
20034-200340140 = "На этот раз это действительно мелочь?"
20034-200340150 = "От того, как было вкусно, я использовала все моти из дома"
20034-200340160 = "на о-дзони."
20034-200340170 = "Всё хорошо в меру..."
20034-200340180 = "Потому что я хотела съесть много моти."
20034-200340190 = "И поэтому"
20034-200340200 = "я придумала решение."
20034-200340210 = "Провести особенное время с особенной едой..."
20034-200340220 = "в этом сезоне —"
20034-200340230 = "это лучшее, что есть."
20034-200340240 = "Есть что-то, что ты хочешь съесть?"
20034-200340250 = "Скорее, не то, что хочется съесть,"
20034-200340260 = "а то, что захотелось попробовать."
20034-200340270 = "Сила молвы удивительна."
20034-200340280 = "Само собой возникает желание поесть."
20034-200340290 = "Ты, наверное, прочитала какой-то гастрономический обзор?"
20034-200340300 = "Верно."
20034-200340310 = "Думаю, вам тоже станет интересно!"