[translation]
16017-160170010 = "О"
16017-160170020 = "Доброе утро, Сенсей."
16017-160170030 = "Доброе утро, Аоба."
16017-160170040 = "Хе-хе"
16017-160170050 = "Вы даже ответили мне..."
16017-160170060 = "Позже я хотела бы кое-что спросить у вас,"
16017-160170070 = "но это не срочно..."
16017-160170080 = "Хотя и не срочно..."
16017-160170090 = "Конечно!"
16017-160170100 = "Спрашивай что угодно."
16017-160170110 = "О-о, спасибо вам..."
16017-160170120 = "Сенсей, сегодня я действительно..."
16017-160170130 = "благодарна вам."
16017-160170140 = "Я получила так много..."
16017-160170150 = "Всё в порядке."
16017-160170160 = "Кстати, ты ведь говорила, что хочешь что-то спросить?"
16017-160170170 = "Ах"
16017-160170180 = "Это..."
16017-160170190 = "Может, в другой раз?"
16017-160170200 = "Конечно, когда угодно."
16017-160170210 = "Спасибо вам."
16017-160170220 = "Если будет следующий раз, но..."
16017-160170230 = "Тогда до встречи."
16017-160170240 = "Увидетьс... ть..."
16017-160170250 = "Аоба??"
16017-160170260 = "Ничего!"
16017-160170270 = "Сенсей..."
16017-160170280 = "Это Аоба..."
16017-160170290 = "Прошу прощения за внезапность, но..."
16017-160170300 = "Если у вас есть время..."
16017-160170310 = "мне нужна ваша помощь..."
16017-160170320 = "Конечно. Куда мне прийти?"
16017-160170330 = "Ах!"
16017-160170340 = "Спасибо вам!"
16017-160170350 = "Вы так быстро ответили;＠・！；！"
16017-160170360 = "Итак, место..."
16017-160170370 = "Сенсей"
16017-160170380 = "Сегодня я действительно благодарна."
16017-160170390 = "Вы всегда мне помогаете,"
16017-160170400 = "поэтому если я могу быть полезна,"
16017-160170410 = "не стесняйтесь звать."
16017-160170420 = "Хорошо. Понял."
16017-160170430 = "Аоба, ты сегодня тоже устала, наверное."
16017-160170440 = "Спасибо вам, вы меня очень выручили."
16017-160170450 = "Тогда на сегодня всё."
16017-160170460 = "Сенсей, это Аоба..."
16017-160170470 = "У вас ничего не сломано,"
16017-160170480 = "или что-то неудобно в быту...?"
16017-160170490 = "Если подумать..."
16017-160170500 = "Значит, есть!"
16017-160170510 = "Сломался кофейник..."
16017-160170520 = "Я сейчас приду!!"
16017-160170530 = "Пожалуйста, подоооождите!!"
16017-160170540 = "Нет, это не так срочно..."
16017-160170550 = "Сейчччас идууу!!"
16017-160170560 = "Сенсей... сегодня я действительно..."
16017-160170570 = "была счастлива."
16017-160170580 = "Спасибо вам..."
16017-160170590 = "Я рад, что ты рада."
16017-160170600 = "Если станет грустно, скажи."
16017-160170610 = "А, нет."
16017-160170620 = "Такие дни, как сегодня,"
16017-160170630 = "хороши тем, что они бывают редко."
16017-160170640 = "Иначе..."
16017-160170650 = "..."
16017-160170660 = "Нет, ничего."
16017-160170670 = "Правда, спасибо вам!"
16017-160170680 = "Сегодня, похоже, будет тяжёлый день..."
16017-160170690 = "У меня куча ремонтных работ,"
16017-160170700 = "придётся, наверное, не спать... всю ночь."
16017-160170710 = "Могу я чем-то помочь?"
16017-160170720 = "Что?"
16017-160170730 = "С-Сенсей... вы?"
16017-160170740 = "Н-нет"
16017-160170750 = "Я не в том смысле"
16017-160170760 = "это сказалаааааа"
16017-160170770 = "Аяяо!"
16017-160170780 = "!!!"
16017-160170790 = "Вдвоём мы, возможно, управимся быстро."
16017-160170800 = "А"
16017-160170810 = "А-а-аа!..) аааа"
16017-160170820 = "Т-тогда..."
16017-160170830 = "Я уже легла в кровать, но"
16017-160170840 = "завтрашний день"
16017-160170850 = "я жду с нетерпением...!"
16017-160170860 = "Да, я тоже."
16017-160170870 = "Всё это"
16017-160170880 = "благодаря"
16017-160170890 = "вам, Сенсей."
16017-160170900 = "Я здесь ни при чём."
16017-160170910 = "Это ты постаралась."
16017-160170920 = "Хе-хе"
16017-160170930 = "Может быть, и так,"
16017-160170940 = "но мне радостно."
16017-160170950 = "Правда... спасибо вам."
16017-160170960 = "Спокойной ночи."