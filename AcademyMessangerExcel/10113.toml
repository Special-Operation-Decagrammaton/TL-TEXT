[translation]
10113-101130010 = "Sensei, aqui é a Himuro Sena, do Clube de Medicina de Emergência."
10113-101130020 = "Entrei em contato para informar que estou de folga hoje."
10113-101130030 = "Além disso, como não temos nos encontrado ultimamente e senti sua falta, ficaria feliz se pudesse me ceder um pouco do seu tempo."
10113-101130040 = "Espera só um pouquinho..."
10113-101130050 = "Vamos nos encontrar no parque, então?"
10113-101130060 = "Sensei, aqui é a Himuro Sena, do Clube de Medicina de Emergência."
10113-101130070 = "Informo que estou de folga novamente hoje."
10113-101130080 = "Vai ficar de prontidão hoje também?"
10113-101130090 = "Não, hoje tenho um assunto para resolver,"
10113-101130100 = "então pretendo ir à sala do Clube de Medicina de Emergência com roupas casuais."
10113-101130110 = "Na sala do clube, de roupa casual, em pleno dia de folga...?"
10113-101130120 = "Eu também vou!"
10113-101130130 = "Como...?"
10113-101130140 = "Mas você não costuma estar sempre ocupado...?"
10113-101130150 = "Não importa, eu vou!"
10113-101130160 = "..."
10113-101130170 = "Compreendido."
10113-101130180 = "Estarei aguardando, então."
10113-101130190 = "Sensei, aqui é a Himuro Sena, do Clube de Medicina de Emergência."
10113-101130200 = "Tenho a impressão de estar fazendo este mesmo comunicado repetidas vezes ultimamente..."
10113-101130210 = "É dia de folga da Sena!"
10113-101130220 = "..."
10113-101130230 = "Exatamente."
10113-101130240 = "E o que vai fazer hoje? Ficar de prontidão? Organizar os medicamentos?"
10113-101130250 = "Hoje tenho planos diferentes do habitual."
10113-101130260 = "Gostaria que compreendesse que"
10113-101130270 = "trata-se de uma situação extremamente excepcional."
10113-101130280 = "Que seria... o quê?"
10113-101130290 = "Gostaria de ir ver o mar."
10113-101130300 = "!!!"
10113-101130310 = "Entendido, deixe comigo!"
