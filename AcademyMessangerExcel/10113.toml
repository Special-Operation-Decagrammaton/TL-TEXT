[translation]
10113-101130010 = "Сенсей, это Химуро Сена из отделения экстренной медицины."
10113-101130020 = "Поскольку сегодня я не дежурю, я связалась с вами."
10113-101130030 = "И ещё, мне грустно, что мы не виделись в последнее время, поэтому я была бы рада, если бы вы нашли немного времени."
10113-101130040 = "Подожди немного..."
10113-101130050 = "Тогда давай встретимся в парке."
10113-101130060 = "Сенсей, это Химуро Сена из отделения экстренной медицины."
10113-101130070 = "Я снова не дежурю, поэтому докладываю."
10113-101130080 = "Ты сегодня тоже будешь дежурить?"
10113-101130090 = "Нет, сегодня у меня дела."
10113-101130100 = "Я думаю пойти в комнату отделения в гражданской одежде."
10113-101130110 = "В выходной день, в гражданской одежде, в комнату отделения...?"
10113-101130120 = "Я тоже пойду!"
10113-101130130 = "Что...?"
10113-101130140 = "Разве вы не всегда заняты...?"
10113-101130150 = "В любом случае, я иду!"
10113-101130160 = "..."
10113-101130170 = "Понял."
10113-101130180 = "Тогда я буду ждать."
10113-101130190 = "Сенсей, это Химуро Сена из отделения экстренной медицины."
10113-101130200 = "Мне кажется, я в последнее время уже несколько раз докладывала одно и то же..."
10113-101130210 = "Сена не дежурит!"
10113-101130220 = "..."
10113-101130230 = "Верно."
10113-101130240 = "Что будешь делать сегодня? Ждать? Разбирать лекарства?"
10113-101130250 = "Сегодня у меня планы, отличные от обычных."
10113-101130260 = "Это крайне исключительная ситуация,"
10113-101130270 = "было бы хорошо, если бы вы поняли."
10113-101130280 = "Это... что?"
10113-101130290 = "Я хочу пойти посмотреть на море."
10113-101130300 = "!!!"
10113-101130310 = "Понял, положись на меня!"