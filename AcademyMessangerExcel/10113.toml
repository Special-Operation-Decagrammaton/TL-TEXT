[translation]
10113-101130010 = "Сенсей, это Химуро Сэна из Клуба экстренной медицинской помощи."
10113-101130020 = "Хотела сообщить, что сегодня я не на дежурстве."
10113-101130030 = "Кроме того, я хотела бы назначить встречу: мы давно не виделись, и мне одиноко."
10113-101130040 = "Подожди. Дай мне осмыслить."
10113-101130050 = "Ладно... Да. Конечно! Давай."
10113-101130060 = "Сенсей, это Химуро Сэна из Клуба экстренной медицинской помощи."
10113-101130070 = "Хотела сообщить, что сегодня я тоже не на дежурстве."
10113-101130080 = "Значит, ты в режиме ожидания?"
10113-101130090 = "Нет. Сегодня у меня есть другое дело."
10113-101130100 = "Поэтому я собираюсь зайти в клубную комнату Клуба экстренной медицинской помощи в повседневной одежде."
10113-101130110 = "Клубная комната... в выходной... в повседневной одежде?"
10113-101130120 = "Я с тобой!"
10113-101130130 = "Что?"
10113-101130140 = "Не думаю, что произойдёт что-то необычное."
10113-101130150 = "Всё равно пойду с тобой!"
10113-101130160 = "Хм."
10113-101130170 = "Понимаю."
10113-101130180 = "Тогда буду вас ждать."
10113-101130190 = "Сенсей, это Химуро Сэна из Клуба экстренной медицинской помощи."
10113-101130200 = "...Хм. В последнее время я часто повторяюсь."
10113-101130210 = "Наверное, у тебя выходной!"
10113-101130220 = "Хм."
10113-101130230 = "Вы хорошо меня знаете, Сенсей."
10113-101130240 = "Что сегодня по плану? Дежурство? Разбирать лекарства?"
10113-101130250 = "Вообще-то я как раз хотела поговорить об этом."
10113-101130260 = "Произошло кое-что необычное."
10113-101130270 = "Мне пришла неожиданная мысль, а это со мной редко бывает."
10113-101130280 = "Что... за мысль?"
10113-101130290 = "Я хочу на пляж."
10113-101130300 = "!!"
10113-101130310 = "Хорошо! Положись на меня!!"
