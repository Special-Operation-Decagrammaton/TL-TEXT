[translation]
26000-1882 = "Давно не виделись, это Чинацу. Вы меня помните?"
26000-1883 = "В прошлый раз всё было в суматохе, и я не смогла как следует поздороваться."
26000-1884 = "Было бы замечательно, если бы в скором времени представилась возможность встретиться и познакомиться по-настоящему."
26000-1885 = "—Чинацу—"
26000-1886 = "Спасибо вам большое за сегодня, Сенсей."
26000-1887 = "Как мне отблагодарить вас за эту доброту..."
26000-1888 = "Когда-нибудь я обязательно отплачу вам."
26000-1889 = "...Тогда"
26000-1890 = "Буду рада сотрудничеству. —Чинацу—"
26000-1891 = "Здравствуйте, Сенсей."
26000-1892 = "Напомнив о прошлом долге,"
26000-1893 = "я бы хотела встретиться с вами снова..."
26000-1894 = "У вас найдётся время?"
26000-1895 = "Если зовёт Чинацу, я доступен 24 часа в сутки!"
26000-1896 = "Я ждал этого дня... этого дня!"
26000-1897 = "Эм..."
26000-1898 = "Простите, я немного опешила."
26000-1899 = "Нет, я не против, просто..."
26000-1900 = "..."
26000-1901 = "Хорошо, я пришлю вам место встречи позже. Буду ждать вас там."
26000-1902 = "—Чинацу—"
26000-1903 = "Сегодня правда было очень приятно, Сенсей."
26000-1904 = "Я не знаю, как выразить свои чувства."
26000-1905 = "Понимаете..."
26000-1906 = "...Нет."
26000-1907 = "Простите, ничего."
26000-1908 = "Спасибо вам, до встречи. —Чинацу—"
26000-1909 = "Здравствуйте, Сенсей."
26000-1910 = "Если можно, скажите, когда вам удобно?"
26000-1911 = "У меня есть личная просьба."
26000-1912 = "Как насчёт после работы сегодня?"
26000-1913 = "Можно и прямо сейчас!"
26000-1914 = "Договорились, тогда так и сделаем."
26000-1915 = "Спасибо, что уделили время."
26000-1916 = "Я приду. —Чинацу—"
26000-1917 = "Если почувствуете усталость, всегда обращайтесь."
26000-1918 = "Нет,"
26000-1919 = "если предвидите что-то утомительное, позовите меня."
26000-1920 = "Я помогу вам, чтобы усталость не накапливалась."
26000-1921 = "Тогда до встречи. —Чинацу—"
26000-260000010 = "Доброе утро, Сенсей. Это Чинацу."
26000-260000020 = "Вы сейчас очень заняты?"
26000-260000030 = "На самом деле, у меня есть к вам просьба..."
26000-260000040 = "Что случилось?"
26000-260000050 = "Неужели...!?"
26000-260000060 = "Ничего серьёзного,"
26000-260000070 = "нет,"
26000-260000080 = "понимаете,"
26000-260000090 = "это не совсем то, что вы подумали,"
26000-260000100 = "короче..."
26000-260000110 = "Мне нужна помощь с работой. Я хотела попросить вас помочь с бумагами."
26000-260000120 = "Для одной меня объём слишком велик..."
26000-260000130 = "Конечно, если вы заняты, я не настаиваю."
26000-260000140 = "Всё в порядке, я сейчас приду."
26000-260000150 = "Ах"
26000-260000160 = "Не торопитесь, я подожду."
26000-260000170 = "Спасибо. —Чинацу—"
26000-260000180 = "Сегодня правда было очень приятно."
26000-260000190 = "Если бы вы не пришли, я бы не справилась."
26000-260000200 = "Понимаете,"
26000-260000210 = "если"
26000-260000220 = "если можно, то..."
26000-260000230 = "могу ли я обратиться к вам снова, если понадобится?"
26000-260000240 = "Да, конечно."
26000-260000250 = "Спасибо."
26000-260000260 = "Тогда в следующий раз я выберу другое место,"
26000-260000270 = "ах"
26000-260000280 = "ну..."
26000-260000290 = "..."
26000-260000300 = "Простите."
26000-260000310 = "То есть"
26000-260000320 = "..."
26000-260000330 = "в том же месте, хорошо."
26000-260000340 = "Сенсей, как вы поживаете?"
26000-260000350 = "У меня сегодня выходной, впервые за долгое время..."
26000-260000360 = "У меня тоже выходной!"
26000-260000370 = "Сегодня я оторвусь по полной...!"
26000-260000380 = "Хе-хе"
26000-260000390 = "Как хорошо."
26000-260000400 = "..."
26000-260000410 = "...только не переусердствуйте."
26000-260000420 = "Простите за неожиданное сообщение."
26000-260000430 = "Хорошего дня. —Чинацу—"
26000-260000440 = "С возвращением, Сенсей."
26000-260000450 = "В выходной день я заставила вас работать..."
26000-260000460 = "Благодаря тебе выходной прошёл с пользой."
26000-260000470 = "Устал физически, но духом воспрянул!"
26000-260000480 = "Вот как."
26000-260000490 = "Тогда в следующий выходной вы восстановите силы."
26000-260000500 = "Хе-хе"
26000-260000510 = "Скоро увидимся. —Чинацу—"