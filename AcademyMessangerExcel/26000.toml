[translation]
26000-1882 = "Это Чинацу. Не уверена, что вы меня помните."
26000-1883 = "В прошлый раз у меня не было возможности нормально представиться."
26000-1884 = "Надеюсь, скоро она появится."
26000-1885 = "— Чинацу"
26000-1886 = "Огромное спасибо за сегодня, Сенсей."
26000-1887 = "Я не знаю, как вам отплатить..."
26000-1888 = "Но скоро что-нибудь придумаю."
26000-1889 = "..."
26000-1890 = "Надеюсь снова увидеть вас. — Чинацу."
26000-1891 = "Здравствуйте, Сенсей. Как вы?"
26000-1892 = "Я хотела узнать, сможете ли вы встретиться."
26000-1893 = "Я хочу отплатить вам за прошлый раз..."
26000-1894 = "Вы свободны?"
26000-1895 = "Для Чинацу у меня всегда есть время."
26000-1896 = "Я ждала этого дня! Ха-ха."
26000-1897 = "Эм..."
26000-1898 = "О, пожалуйста, не говорите так."
26000-1899 = "Простите. Не то чтобы мне это не нравилось."
26000-1900 = "..."
26000-1901 = "Я дам вам адрес. Буду ждать там."
26000-1902 = "— Чинацу"
26000-1903 = "Огромное спасибо за сегодня, Сенсей."
26000-1904 = "Не знаю, как вас благодарить."
26000-1905 = "Эм..."
26000-1906 = "..."
26000-1907 = "Неважно."
26000-1908 = "Спасибо. Хорошего дня. — Чинацу"
26000-1909 = "Здравствуйте, Сенсей."
26000-1910 = "Можете сообщить, когда будете свободны?"
26000-1911 = "Мне нужно обсудить с вами кое-что личное."
26000-1912 = "Я свободен после работы."
26000-1913 = "Я свободен прямо сейчас!"
26000-1914 = "Да."
26000-1915 = "Большое спасибо, что нашли время."
26000-1916 = "В этот раз я сама приду к вам. — Чинацу"
26000-1917 = "Просто скажите, если что-нибудь понадобится, Сенсей."
26000-1918 = "Не-а."
26000-1919 = "Если чувствуете, что впереди что-то утомительное, просто сообщите заранее."
26000-1920 = "Я помогу вам так, чтобы вы вообще не устали."
26000-1921 = "Хорошего дня. — Чинацу"
26000-260000010 = "Здравствуйте, Сенсей. Это Чинацу."
26000-260000020 = "У вас есть немного свободного времени?"
26000-260000030 = "У меня просьба..."
26000-260000040 = "Что происходит?"
26000-260000050 = "Конечно, я найду для тебя время."
26000-260000060 = "Ничего особенного."
26000-260000070 = "Нет..."
26000-260000080 = "Эм..."
26000-260000090 = "Если вы так реагируете..."
26000-260000100 = "*вздох*"
26000-260000110 = "Это по работе, Сенсей. Просто очень много бумаг."
26000-260000120 = "Но одной мне многовато... Дополнительные руки очень пригодились бы."
26000-260000130 = "Ничего страшного, если вы заняты."
26000-260000140 = "Нет. Я уже иду."
26000-260000150 = "Хорошо."
26000-260000160 = "...А?"
26000-260000170 = "Сейчас...?"
26000-260000180 = "Ещё раз спасибо за сегодня, Сенсей."
26000-260000190 = "Без вас было бы очень тяжело."
26000-260000200 = "..."
26000-260000210 = "В-Вы знаете..."
26000-260000220 = "Ну... Если вы не против..."
26000-260000230 = "...можно в следующий раз снова попросить вашей помощи?"
26000-260000240 = "Конечно."
26000-260000250 = "Спасибо, Сенсей."
26000-260000260 = "Я обязательно выберу другое место..."
26000-260000270 = "..."
26000-260000280 = "Эм..."
26000-260000290 = "Вообще-то..."
26000-260000300 = "Ну.."
26000-260000310 = "В следующий раз..."
26000-260000320 = "..."
26000-260000330 = "Можно встретиться там же? — Чинацу"
26000-260000340 = "Наконец-то у меня выходной."
26000-260000350 = "А вы, Сенсей? Сегодня заняты?"
26000-260000360 = "Какое совпадение. У меня тоже выходной."
26000-260000370 = "Пора бездельничать!"
26000-260000380 = "Фу-фу."
26000-260000390 = "Приятно слышать."
26000-260000400 = ";;;;"
26000-260000410 = "Это немного..."
26000-260000420 = "В любом случае простите."
26000-260000430 = "Желаю вам прекрасного дня. — Чинацу"
26000-260000440 = "Отличная работа, Сенсей."
26000-260000450 = "В итоге я заставила вас работать в выходной."
26000-260000460 = "Всё нормально! Я полон энергии!"
26000-260000470 = "Силы закончились, но морально я, кажется, восстановился."
26000-260000480 = "Вот как?"
26000-260000490 = "Что ж, тогда придётся восстановить ещё и ваши силы."
26000-260000500 = "Фу-фу. Как удачно."
26000-260000510 = "Тогда скоро навещу вас. — Чинацу"
