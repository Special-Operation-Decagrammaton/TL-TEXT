[translation]
26000-1882 = "Quanto tempo, aqui é a Chinatsu. Você se lembra de mim?"
26000-1883 = "Da última vez estava a maior correria e não consegui cumprimentá-lo direito,"
26000-1884 = "então eu ficaria feliz se tivéssemos a oportunidade de conversar com calma qualquer dia desses."
26000-1885 = "~Chinatsu~"
26000-1886 = "Muito obrigada mesmo por hoje, Sensei."
26000-1887 = "Não sei nem como retribuir esse favor..."
26000-1888 = "Um dia, por favor, deixe-me retribuir sem falta."
26000-1889 = "...B-bom, então,"
26000-1890 = "conto com você daqui para frente ~Chinatsu~"
26000-1891 = "Olá, Sensei."
26000-1892 = "Como ainda tenho aquele favor da última vez para retribuir,"
26000-1893 = "gostaria muito de me encontrar com você novamente, se possível..."
26000-1894 = "Como está a sua agenda?"
26000-1895 = "Se a Chinatsu chamar, estou disponível 24 horas por dia!"
26000-1896 = "Este dia! Eu estava esperando tanto por este dia...!"
26000-1897 = "H-hum..."
26000-1898 = "Desculpe, fiquei um pouco assustada agora."
26000-1899 = "Não, quer dizer, não é que eu tenha achado ruim, mas..."
26000-1900 = "..."
26000-1901 = "Hum, mais tarde te passo o local. Estarei te esperando lá."
26000-1902 = "~Chinatsu~"
26000-1903 = "Muito obrigada mesmo por hoje, Sensei."
26000-1904 = "Mal sei como expressar em palavras o que estou sentindo agora."
26000-1905 = "Hum..."
26000-1906 = "...Não."
26000-1907 = "Desculpe, não é nada."
26000-1908 = "Muito obrigada, até a próxima ~Chinatsu~"
26000-1909 = "Olá, Sensei."
26000-1910 = "Se não for incômodo, poderia me dizer qual horário fica melhor para você?"
26000-1911 = "Há um assunto pessoal sobre o qual eu gostaria de pedir o seu conselho."
26000-1912 = "Que tal hoje, quando eu terminar o trabalho?"
26000-1913 = "Pode ser agora mesmo!"
26000-1914 = "Entendido, combinado então."
26000-1915 = "Muito obrigada por reservar um tempinho para mim."
26000-1916 = "Irei até aí ~Chinatsu~"
26000-1917 = "Sempre que se sentir cansado, pode entrar em contato comigo a qualquer hora."
26000-1918 = "Aliás,"
26000-1919 = "sempre que surgir algo que pareça cansativo, por favor, me chame."
26000-1920 = "Quero ajudar para que você não acumule cansaço de novo."
26000-1921 = "Até mais ~Chinatsu~"
26000-260000010 = "Sensei, bom dia. Aqui é a Chinatsu."
26000-260000020 = "Você anda muito ocupado ultimamente?"
26000-260000030 = "Na verdade, tenho um favor para te pedir..."
26000-260000040 = "O que houve?"
26000-260000050 = "Não me diga que isso é...?!"
26000-260000060 = "Não é nada tão grandioso, mas..."
26000-260000070 = "Não"
26000-260000080 = "Hum"
26000-260000090 = "Digamos que não é nada desse tipo..."
26000-260000100 = "Este..."
26000-260000110 = "É sobre trabalho. Gostaria de pedir a sua ajuda com uma papelada."
26000-260000120 = "É que o volume está um pouco grande demais para eu dar conta sozinha..."
26000-260000130 = "Claro que, se você estiver ocupado, não quero forçar a barra."
26000-260000140 = "Tranquilo, já estou indo para aí."
26000-260000150 = "Ah"
26000-260000160 = "Hum, não precisa vir com tanta pressa assim."
26000-260000170 = "Muito obrigada ~Chinatsu~"
26000-260000180 = "Muito obrigada mesmo por hoje."
26000-260000190 = "Se você não tivesse vindo, Sensei, acho que eu não teria conseguido terminar."
26000-260000200 = "Hum"
26000-260000210 = "Se..."
26000-260000220 = "Se não for pedir demais..."
26000-260000230 = "Caso surja mais alguma coisa, tudo bem se eu pedir sua ajuda de novo?"
26000-260000240 = "Sim, claro."
26000-260000250 = "Muito obrigada."
26000-260000260 = "Da próxima vez, vou escolher um outro lugar direitinho..."
26000-260000270 = "Ah"
26000-260000280 = "Hum"
26000-260000290 = "..."
26000-260000300 = "Desculpe."
26000-260000310 = "Sabe..."
26000-260000320 = "..."
26000-260000330 = "Pode ser no mesmo lugar mesmo."
26000-260000340 = "Sensei, como está passando o dia?"
26000-260000350 = "Hoje eu finalmente consegui um dia de folga depois de muito tempo..."
26000-260000360 = "Eu também estou de folga!"
26000-260000370 = "Hoje eu vou chutar o balde...!"
26000-260000380 = "Hehe"
26000-260000390 = "Que notícia boa."
26000-260000400 = "..."
26000-260000410 = "...Só não exagere demais, por favor."
26000-260000420 = "Desculpe mandar mensagem assim do nada."
26000-260000430 = "Tenha um ótimo dia ~Chinatsu~"
26000-260000440 = "Bom trabalho hoje, Sensei."
26000-260000450 = "Mesmo sendo seu dia de folga, acabei fazendo você trabalhar..."
26000-260000460 = "Graças a você, tive um dia de folga super produtivo."
26000-260000470 = "Gastei energia física, mas recarreguei as energias da alma!"
26000-260000480 = "Fico feliz em ouvir isso."
26000-260000490 = "Então, na próxima folga, vamos focar em recuperar a sua energia física."
26000-260000500 = "Hehe"
26000-260000510 = "Irei visitá-lo em breve ~Chinatsu~"
