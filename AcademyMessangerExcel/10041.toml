10041-100410190 = "Я пришлю место позже..."
10041-100410200 = "Ну..."
10041-100410210 = "Спасибо."
10041-100410220 = "...Не обращайтесь со мной как с ребёнком."
10041-100410230 = "Бесит, хуже некуда."
10041-100410240 = "Простите..."
10041-100410250 = "..."
10041-100410260 = "За то, что вы мне помогли сегодня, я отплачу в другой раз."
10041-100410270 = "Сенсей."
10041-100410280 = "Тогда до завтра."
10041-100410290 = "Сенсей."
10041-100410300 = "Вы не видели сумку, которую оставили в Шале?"
10041-100410310 = "Нет, не видел."
