10041-100410110 = "но на всякий случай сообщаю."
10041-100410120 = "Будь осторожна. Когда будет время, расскажи, что случилось."
10041-100410130 = "...Мм? Что случилось со мной?"
10041-100410140 = "Это..."
10041-100410150 = "Сенсей, вы сейчас свободны?"
10041-100410160 = "Мисаки...?"
