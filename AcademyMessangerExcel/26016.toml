[translation]
26016-260160010 = "★Semanário Pandemonium★ Evento Especial para Leitores Fiéis!"
26016-260160020 = "Que tal escrever uma matéria você também? Inscreva-se já!"
26016-260160030 = "Hã...?"
26016-260160040 = "Os leitores é que vão escrever a matéria...?"
26016-260160050 = "Ah, você já ficou desconfiado, né..."
26016-260160060 = "Aah, tá bom! Eu admito!"
26016-260160070 = "É só uma desculpa pra sair e me divertir com você, Sensei!"
26016-260160080 = "Fazer reportagem sozinha dá uma solidão..."
26016-260160090 = "Pelo menos você é sincera..."
26016-260160100 = "Claro! Tirar a verdade do Semanário Pandemonium é como tirar o macarrão do lámen!"
26016-260160110 = "Tem gente que diz: 'Mas aí não sobra só o caldo?'... Enfim, deixando isso de lado!"
26016-260160120 = "Estarei te esperando no local!"
26016-260160130 = "Deu ruim! A matéria mínguou, foi pro espaço!"
26016-260160140 = "Eu tinha escrito uma matéria especial sobre aquele restaurante do outro dia, 'Restaurantes Incríveis Perto de Nós',"
26016-260160150 = "mas bem no meio da edição, parece que o restaurante faliu!"
26016-260160160 = "Tinha tantos clientes lá, como é que pode?!"
26016-260160170 = "Falência no azul, por falta de fluxo de caixa...?"
26016-260160180 = "Então esse tipo de coisa existe mesmo, né?!"
26016-260160190 = "Vivendo e aprendendo!"
26016-260160200 = "Mudando totalmente de assunto, Sensei, você conhece o mar?"
26016-260160210 = "Pelo que ouvi dizer, é um lugar onde tem muita água!"
26016-260160220 = "Claro, é o mar, né?!"
26016-260160230 = "Exatamente!"
26016-260160240 = "Ao apresentar um fato óbvio de forma impactante assim,"
26016-260160250 = "conseguimos fisgar o interesse das pessoas! É uma técnica jornalística!"
26016-260160260 = "Sendo assim, vamos lá conferir pessoalmente quanta água tem no mar!"
26016-260160270 = "Não faço ideia de como vamos conferir isso, mas combinado!"
26016-260160280 = "Muito obrigada pelo relato valioso do outro dia!"
26016-260160290 = "Sem aquilo, acho que eu nunca teria conseguido me recuperar..."
26016-260160300 = "Você me salvou!"
26016-260160310 = "Realmente, depender só da própria memória..."
26016-260160320 = "É um perigo!"
26016-260160330 = "A edição desta semana também foi fechada com sucesso!"
26016-260160340 = "Mas o conteúdo da matéria..."
26016-260160350 = "Parece bem diferente do que eu tinha te contado..."
26016-260160360 = "É totalmente baseado em fatos reais... só dei uma leve dramatizada!"
26016-260160370 = "Graças a isso, está dando o que falar!"
26016-260160380 = "Devo tudo a você, Sensei!"
26016-260160390 = "Assinatura periódica do 'Semanário Pandemonium'..."
26016-260160400 = "Faça já a sua..."
26016-260160410 = "Eu já sou assinante..."
26016-260160420 = "Você parece meio desanimada hoje, o que houve?"
26016-260160430 = "Uugh..."
26016-260160440 = "Não consigo pensar em nenhuma pauta para a matéria de jeito nenhum."
26016-260160450 = "Não acontece nada de interessante..."
26016-260160460 = "Nesse ritmo, o único jeito vai ser eu mesma causar um incidente explosivo..."
26016-260160470 = "Não sei bem o que você pretende, mas para agora mesmo!"
26016-260160480 = "Que tal dar uma caminhada por lugares onde possa surgir um furo de reportagem?"
26016-260160490 = "Oh?"
26016-260160500 = "Ooooh!"
26016-260160510 = "Bem pensado!"
26016-260160520 = "É o espírito de ir a campo cem vezes!"
26016-260160530 = "Então nos vemos daqui a pouco~!"
26016-260160540 = "Eu também vou?!"
26016-260160550 = "Sensei, olhe só isso!"
26016-260160560 = "Tcharãããn!"
26016-260160580 = "A edição desta semana do Semanário Pandemonium bateu o recorde histórico de tiragem!"
26016-260160590 = "A veterana Makoto até disse que vai me indicar ao prêmio de Repórter do Ano!"
26016-260160600 = "Tudo bem que eu sou a única repórter, mas... deixando isso de lado!"
26016-260160610 = "Graças a você, consegui um furo de reportagem incrível, Sensei!"
26016-260160620 = "Fico feliz em ter ajudado!"
26016-260160630 = "Sim! Conto com você na próxima também!"
26016-260160640 = "E o que aconteceu com aquela alga kombu?"
26016-260160650 = "Levei para a cozinha e transformei em tirinhas de kombu no vinagre!"
26016-260160660 = "Afinal, guardar aquilo tudo daria o maior trabalho!"
26016-260160670 = "Ué, não ia guardar com carinho como relíquia?!"
26016-260160680 = "A matéria especial de verão finalmente entrou na reta final!"
26016-260160690 = "Desta vez vou fazer os ajustes finais lá na praia mesmo!"
26016-260160700 = "Quero transmitir toda a atmosfera do local direto para as páginas!"
26016-260160710 = "Sendo assim, pode vir até a barraca de praia?"
26016-260160720 = "Estou te esperando!"
26016-260160730 = "Hum... Sensei..."
26016-260160740 = "Este..."
26016-260160750 = "Não! Deixa pra lá, está tudo bem!"
26016-260160760 = "Esqueci o que eu ia falar!"
26016-260160770 = "Então é isso! Até mais!"
