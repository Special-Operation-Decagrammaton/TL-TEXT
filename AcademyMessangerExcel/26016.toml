[translation]
26016-260160010 = "★Еженедельный Пандемониум★ Специальное мероприятие для постоянных читателей!"
26016-260160020 = "Хотите попробовать написать статью сами? Поторопитесь с заявкой!"
26016-260160030 = "Что...?"
26016-260160040 = "Читатели пишут статьи...?"
26016-260160050 = "О, вы с подозрением..."
26016-260160060 = "Ах, да, признаюсь!"
26016-260160070 = "Это был предлог, чтобы поиграть с вами!"
26016-260160080 = "Ведь одному брать интервью грустно..."
26016-260160090 = "Ты честна..."
26016-260160100 = "Естественно! Отделить правду от «Еженедельном Пандемониуме» — всё равно что убрать лапшу из рамена!"
26016-260160110 = "Кто-то скажет, что это просто суп... но не будем о том!"
26016-260160120 = "Тогда жду на месте!"
26016-260160130 = "Беда! Статья провалилась!"
26016-260160140 = "Я написала спецстатью «Лучшие места рядом с нами» про тот ресторан,"
26016-260160150 = "но, пока я редактировала, этот ресторан закрылся!"
26016-260160160 = "Там же было столько посетителей, почему?"
26016-260160170 = "Банкротство при прибыли...?"
26016-260160180 = "Оказывается, и такое бывает!"
26016-260160190 = "Я поучилась!"
26016-260160200 = "Внезапный вопрос: Сенсей, вы знаете, что такое море?"
26016-260160210 = "Говорят, это место, где много воды!"
26016-260160220 = "Ну разумеется, это же море!?"
26016-260160230 = "Да!"
26016-260160240 = "Таким образом, вынося на обсуждение очевидные факты,"
26016-260160250 = "можно привлечь интерес людей! Это один из приёмов в журналистике!"
26016-260160260 = "Так что давайте отправимся и проверим, сколько там воды!"
26016-260160270 = "Не знаю, как это проверить, но понял!"
26016-260160280 = "Спасибо за вашу ценную беседу на днях!"
26016-260160290 = "Без неё я не смогла бы оправиться..."
26016-260160300 = "Благодаря вам я спасена!"
26016-260160310 = "Всё-таки полагаться только на память —"
26016-260160320 = "опасно!"
26016-260160330 = "На этой неделе мы благополучно сдали номер!"
26016-260160340 = "Но содержание статьи..."
26016-260160350 = "Мне кажется, это сильно отличается от того, что я рассказывал..."
26016-260160360 = "Мы основываемся на фактах, но... немного добавили красок."
26016-260160370 = "Благодаря этому обсуждение бурлит!"
26016-260160380 = "Это всё благодаря вам, Сенсей!"
26016-260160390 = "Подписка на «Еженедельный Пандемониум»"
26016-260160400 = "оформляйте прямо сейчас..."
26016-260160410 = "Но я уже подписан..."
26016-260160420 = "Ты выглядишь уставшей?"
26016-260160430 = "Увы..."
26016-260160440 = "Я не могу придумать тему для статьи."
26016-260160450 = "Ничего интересного не происходит..."
26016-260160460 = "В таком случае, мне придётся самой устроить какой-нибудь переполох..."
26016-260160470 = "Не знаю, о чём ты, но стоп!"
26016-260160480 = "Как насчёт прогуляться в поисках сенсации?"
26016-260160490 = "О?"
26016-260160500 = "О-о!"
26016-260160510 = "Точно!"
26016-260160520 = "Мудрость «семь раз отмерь»!"
26016-260160530 = "Тогда до встречи!"
26016-260160540 = "Я тоже иду!?"
26016-260160550 = "Сенсей, посмотрите!"
26016-260160560 = "Та-да!"
26016-260160580 = "На этой неделе «Еженедельный Пандемониум» побил рекорд тиража!"
26016-260160590 = "Старшая Макото сказала, что выдвинет меня на премию репортёра года!"
26016-260160600 = "Хотя я единственный репортёр... но не будем о том!"
26016-260160610 = "Благодаря вам я получила сенсацию!"
26016-260160620 = "Рад, что смог помочь!"
26016-260160630 = "Да! Буду рассчитывать на вас и в следующий раз!"
26016-260160640 = "И что стало с той ламинарией?"
26016-260160650 = "Отнесла на кухню и сделала маринованную!"
26016-260160660 = "Хранить её тоже было непросто!"
26016-260160670 = "То есть не бережно хранить!?"
26016-260160680 = "Летний спецвыпуск уже почти готов!"
26016-260160690 = "В этот раз я хочу провести финальную доработку на море!"
26016-260160700 = "Хочется передать атмосферу места!"
26016-260160710 = "Так что, не могли бы вы зайти в пляжный домик?"
26016-260160720 = "Жду вас!"
26016-260160730 = "Эм, Сенсей..."
26016-260160740 = "Ну..."
26016-260160750 = "Нет! Всё в порядке!"
26016-260160760 = "Я забыла, что хотела сказать!"
26016-260160770 = "Тогда! На этом всё!"