[translation]
26016-260160010 = "★Weekly Pandemonium★ Special Event for Our Loyal Readers!"
26016-260160020 = "Why don't you try writing an article yourself? Sign up soon!"
26016-260160030 = "Huh...?"
26016-260160040 = "A reader writing an article...?"
26016-260160050 = "Ah, you're suspicious, aren't you..."
26016-260160060 = "Oh, fine! I admit it!"
26016-260160070 = "It's just an excuse to hang out with Sensei!"
26016-260160080 = "It gets lonely doing interviews all by myself..."
26016-260160090 = "You're honest, at least..."
26016-260160100 = "Of course! Removing the truth from Weekly Pandemonium is like serving ramen without the noodles!"
26016-260160110 = "People might say, 'Isn't that just soup?' but... anyway!"
26016-260160120 = "I'll be waiting for you at the scene!"
26016-260160130 = "This is bad! The article fell through!"
26016-260160140 = "I was writing a feature article about that shop the other day, titled 'Great Local Shops We Know'."
26016-260160150 = "But while I was editing it, the shop went out of business!"
26016-260160160 = "They had so many customers, so why did that happen?"
26016-260160170 = "Bankruptcy despite being profitable...?"
26016-260160180 = "I guess things like that happen!"
26016-260160190 = "I learned something new!"
26016-260160200 = "This is sudden, but Sensei, do you know what the ocean is?"
26016-260160210 = "I hear it's a place with a lot of water!"
26016-260160220 = "Well, yeah, it's the ocean!?"
26016-260160230 = "Yes!"
26016-260160240 = "By stating the obvious like this,"
26016-260160250 = "you can grab people's interest! It's a type of journalistic technique!"
26016-260160260 = "Now, let's go verify just how much water there is!"
26016-260160270 = "I'm not sure how we're going to verify that, but sure!"
26016-260160280 = "Thank you for your valuable advice the other day!"
26016-260160290 = "If not for that, I wouldn't have been able to recover..."
26016-260160300 = "Thanks to you, I was saved!"
26016-260160310 = "Relying entirely on memory is..."
26016-260160320 = "Dangerous, isn't it!"
26016-260160330 = "Another issue finished without a hitch!"
26016-260160340 = "But, the content of the article..."
26016-260160350 = "It feels quite different from what I actually said..."
26016-260160360 = "It's based on facts, but... I embellished it a little."
26016-260160370 = "Thanks to that, it's the talk of the town!"
26016-260160380 = "I owe it all to you, Sensei!"
26016-260160390 = "Subscribe to 'Weekly Pandemonium' today!"
26016-260160400 = "Sign up now..."
26016-260160410 = "I'm already a subscriber, but..."
26016-260160420 = "You seem a bit down, don't you?"
26016-260160430 = "Ugh..."
26016-260160440 = "I just can't think of any ideas for an article."
26016-260160450 = "Nothing interesting is happening..."
26016-260160460 = "If it comes to this, I might just have to cause a big incident myself..."
26016-260160470 = "I don't know what you're planning, but stop right there!"
26016-260160480 = "Why don't you try taking a walk in places where you might find a scoop?"
26016-260160490 = "Oh?"
26016-260160500 = "Oh!"
26016-260160510 = "That's it!"
26016-260160520 = "The spirit of 'visiting the scene a hundred times'!"
26016-260160530 = "I'll see you later, then!"
26016-260160540 = "Wait, am I going too!?"
26016-260160550 = "Sensei, look!"
26016-260160560 = "Ta-da!"
26016-260160580 = "This week's Weekly Pandemonium hit a record high in circulation!"
26016-260160590 = "Makoto-senpai even said she'd nominate me for the Reporter of the Year award!"
26016-260160600 = "I'm the only reporter, but... anyway!"
26016-260160610 = "Thanks to you, Sensei, I was able to get the scoop!"
26016-260160620 = "I'm glad I could help!"
26016-260160630 = "Yes! I look forward to working with you again!"
26016-260160640 = "So, what happened to that kelp?"
26016-260160650 = "I took it to the kitchen and made pickled kelp!"
26016-260160660 = "It's too much trouble to store it as is!"
26016-260160670 = "You're not going to preserve it!?"
26016-260160680 = "The summer feature article is finally reaching its climax!"
26016-260160690 = "I'm thinking of doing the final adjustments at the beach!"
26016-260160700 = "I want to capture the atmosphere of the scene exactly as it is!"
26016-260160710 = "So, will you come to the beach house?"
26016-260160720 = "I'll be waiting!"
26016-260160730 = "Um... Sensei..."
26016-260160740 = "Uh..."
26016-260160750 = "No! It's fine!"
26016-260160760 = "I forgot what I was going to say!"
26016-260160770 = "So! That's that!"