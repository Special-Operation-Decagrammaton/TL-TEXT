[translation]
26016-260160010 = "★ Еженедельник Пандемониума ★☞ Специальное событие для подписчиков!"
26016-260160020 = "Напишем статью вместе! Записывайтесь прямо сейчас!"
26016-260160030 = "Чиаки?"
26016-260160040 = "Заставить читателя написать статью... и назвать это событием?"
26016-260160050 = "Вот и мне кажется, что тут что-то нечисто."
26016-260160060 = "Ладно! Признаюсь!"
26016-260160070 = "Я просто хотела найти повод провести с вами время!"
26016-260160080 = "Одной бегать за новостями так скучно..."
26016-260160090 = "По крайней мере, ты честно призналась..."
26016-260160100 = "Фу-фу! «Еженедельник Пандемониума» — уважаемое издание Общества Пандемониума, и его главная ценность — ПРАВДА!"
26016-260160110 = "Правда, поэтому нас уже прозвали зомби, но сейчас не об этом!"
26016-260160120 = "Тогда увидимся на месте!"
26016-260160130 = "Я пропустила срок сдачи! Тц!"
26016-260160140 = "Для спецвыпуска «Честный бизнес по соседству» я выбрала магазин, куда мы с вами заходили."
26016-260160150 = "И только я закончила статью, как магазин закрылся!"
26016-260160160 = "Когда мы там были, покупателей было полно! Что случилось?"
26016-260160170 = "Банкротство из-за слишком бурного роста...?"
26016-260160180 = "Разве с заведениями общепита такое тоже бывает?!"
26016-260160190 = "Понятия не имела!"
26016-260160200 = "Вопрос немного неожиданный, но вы знаете, что такое «океан», Сенсей?"
26016-260160210 = "Говорят, это место, где ОЧЕНЬ много воды!"
26016-260160220 = "Так это же само определение океана!"
26016-260160230 = "И правда!"
26016-260160240 = "Но я ведь заставила вас отреагировать, да?"
26016-260160250 = "Привлекла ваше внимание очевидным фактом! Со статьями тот же принцип!"
26016-260160260 = "Так что давайте проверим, правда ли это!"
26016-260160270 = "Надеюсь, да! Но на всякий случай проверим!"
26016-260160280 = "Спасибо за вашу бесценную историю!"
26016-260160290 = "Без неё всё бы пошло прахом!"
26016-260160300 = "Вы меня спасли!"
26016-260160310 = "Для секретаря полагаться только на память —"
26016-260160320 = "значит напрашиваться на неприятности!"
26016-260160330 = "Ещё неделю можно жить спокойно!"
26016-260160340 = "Кстати, статья получилась... довольно провокационной..."
26016-260160350 = "По-моему, кое-что там вырвали из контекста..."
26016-260160360 = "Я немного подредактировала факты, чтобы подать их поинтереснее!"
26016-260160370 = "Вот поэтому статья и разлетелась по всему Кивотосу!"
26016-260160380 = "Огромное спасибо, Сенсей!"
26016-260160390 = "Еженедельник Пандемониума"
26016-260160400 = "Подписывайтесь прямо сейчас..."
26016-260160410 = "Но я же уже подписан?!"
26016-260160420 = "Откуда столько напора?!"
26016-260160430 = "Уа-а..."
26016-260160440 = "У меня полный творческий кризис."
26016-260160450 = "Ни одной интересной темы для статьи."
26016-260160460 = "Если новостей нет, придётся самой их создать..."
26016-260160470 = "Что бы ты ни задумала, немедленно прекрати!"
26016-260160480 = "Лучше прогуляйся там, где всегда кипит жизнь!"
26016-260160490 = "А?"
26016-260160500 = "О!"
26016-260160510 = "И как я сама до этого не додумалась?!"
26016-260160520 = "Точно! Ответы всегда можно найти на месте событий!"
26016-260160530 = "Тогда увидимся там, Сенсей!"
26016-260160540 = "Мне тоже идти?!"
26016-260160550 = "СенсейСенсейСенсей!"
26016-260160560 = "Та-дам!"
26016-260160580 = "У «Еженедельника Пандемониума» на этой неделе рекордный тираж!"
26016-260160590 = "Макото сказала, что гордится мной. Она собирается выдвинуть меня на звание репортёра года!"
26016-260160600 = "Вообще-то, я единственный репортёр в Геенне, но всё равно!"
26016-260160610 = "И всё благодаря тому, что вы помогли мне найти сенсацию!"
26016-260160620 = "Поздравляю!"
26016-260160630 = "Так что и в следующий раз я на вас рассчитываю, договорились?"
26016-260160640 = "Что ты сделала с ламинарией, которую забрала с собой?"
26016-260160650 = "Отнесла на школьную кухню, и там её замариновали!"
26016-260160660 = "Всё-таки у меня в комнате общежития столько водорослей не уместится!"
26016-260160670 = "Ты что, собиралась хранить её всю у себя?!"
26016-260160680 = "Летняя спецстатья наконец-то на стадии последних правок!"
26016-260160690 = "Хочу закончить её прямо на месте событий!"
26016-260160700 = "В таком деле очень важна атмосфера."
26016-260160710 = "Так что-о-о... вы придёте ко мне в пляжную хижину?"
26016-260160720 = "Сможем поработать вместе!"
26016-260160730 = "Эм..."
26016-260160740 = "Так вот, Сенсей."
26016-260160750 = "Н-нет, ничего!"
26016-260160760 = "Забыла, что хотела сказать!"
26016-260160770 = "Да, сделаем вид, что ничего не было!"
