[translation]
13013-130130010 = "Эм... Сенсей."
13013-130130020 = "У вас есть время сейчас?"
13013-130130030 = "Конечно!"
13013-130130040 = "Как хорошо..."
13013-130130050 = "На самом деле, у меня к вам просьба..."
13013-130130060 = "Хорошо, я сейчас приду."
13013-130130070 = "Вы благополучно добрались?"
13013-130130080 = "Простите, что из-за меня задержал вас допоздна..."
13013-130130090 = "Какая задержка, мне тоже было весело."
13013-130130100 = "Нужно хорошо сохранить эти додзинси."
13013-130130110 = "Да!"
13013-130130120 = "А вы, Сенсей,"
13013-130130130 = "собираете что-нибудь?"
13013-130130140 = "У меня коллекция усталости, можно сказать..."
13013-130130150 = "Э-это"
13013-130130160 = "должно быть, тяжело..."
13013-130130170 = "А ты, Момиджи?"
13013-130130180 = "Собираешь что-нибудь?"
13013-130130190 = "Хе-хе..."
13013-130130200 = "Я собираю редкие книги одного автора."
13013-130130210 = "Сенсей..."
13013-130130220 = "Сенсей...!"
13013-130130230 = "Наконец-то... он наступает...!"
13013-130130240 = "Что наступает?"
13013-130130250 = "Звучит весело, Момиджи."
13013-130130260 = "Ах, простите..."
13013-130130270 = "Я невольно обрадовалась..."
13013-130130280 = "Расскажешь?"
13013-130130290 = "Сегодня..."
13013-130130300 = "день книжного фестиваля Красной Зимы!"
13013-130130310 = "Да...?"
13013-130130320 = "Сенсей, спасибо, что составили мне компанию сегодня!"
13013-130130330 = "Мы много ходили, вы не устали?"
13013-130130340 = "Для меня это мелочи!"
13013-130130350 = "Как хорошо."
13013-130130360 = "Я тоже рада завтрашнему дню!"
13013-130130370 = "А, завтра тоже!?"
13013-130130380 = "Книжный фестиваль длится два дня!"
13013-130130390 = "Завтра я хочу полностью пройти все оставшиеся уголки!"
13013-130130400 = "П-постараюсь..."
13013-130130410 = "Спасибо!"
13013-130130420 = "Хе-хе, я буду ждать."
13013-130130430 = "Спокойной ночи!"
13013-130130440 = "Доброе утро, Сенсей."
13013-130130450 = "Доброе утро, Момиджи..."
13013-130130460 = "А?"
13013-130130470 = "Что случилось?"
13013-130130480 = "Дело в том..."
13013-130130490 = "я не спала две ночи подряд, и голова как в тумане..."
13013-130130500 = "Как ужасно!"
13013-130130510 = "Я тоже, бывает, читаю книгу и не замечаю, как наступает утро, но..."
13013-130130520 = "Эм, Сенсей."
13013-130130530 = "Если вы не против, не могли бы вы зайти в библиотеку Красной Зимы?"
13013-130130540 = "В библиотеку...?"
13013-130130550 = "Сенсей."
13013-130130560 = "Простите."
13013-130130570 = "Сегодня я не смогу встретиться."
13013-130130580 = "Что случилось!?"
13013-130130590 = "В библиотеке я потеряла что-то важное..."
13013-130130600 = "Нет, мелочь..."
13013-130130610 = "Потерянную вещь..."
13013-130130620 = "...нужно найти."
13013-130130630 = "Я помогу."
13013-130130640 = "Что?"
13013-130130650 = "Вы, Сенсей, поможете?"