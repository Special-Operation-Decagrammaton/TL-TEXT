[translation]
13013-130130010 = "Эм... Сенсей?"
13013-130130020 = "Можно одолжить тебя ненадолго?"
13013-130130030 = "Привет, Момиджи. Конечно."
13013-130130040 = "Хорошо..."
13013-130130050 = "Если не против, я хотела бы попросить об одолжении..."
13013-130130060 = "Конечно."
13013-130130070 = "Ты благополучно добрался домой, Сенсей?"
13013-130130080 = "Я заставила тебя столько пережить..."
13013-130130090 = "О, ничего страшного."
13013-130130100 = "Лучше найди безопасное место для этого додзинси."
13013-130130110 = "Конечно!"
13013-130130120 = "Сенсей,"
13013-130130130 = "Ты что-нибудь коллекционируешь?"
13013-130130140 = "Я накопил много усталости..."
13013-130130150 = "А?"
13013-130130160 = "Это нехорошо!"
13013-130130170 = "А ты?"
13013-130130180 = "Ты что-нибудь коллекционируешь?"
13013-130130190 = "Я..."
13013-130130200 = "Хи-хи. Я собираю книги."
13013-130130210 = "Сенсей..."
13013-130130220 = "Сенсей!"
13013-130130230 = "Начинается! Наконец-то!"
13013-130130240 = "Что это?"
13013-130130250 = "Момиджи, ты сегодня особенно взволнована!"
13013-130130260 = "Ах, да, потому что!"
13013-130130270 = "Прости, я забежала вперёд и"
13013-130130280 = "Успокойся и печатай медленно."
13013-130130290 = "Точно..."
13013-130130300 = "Это Книжный фестиваль Красной Зимы!"
13013-130130310 = "Хм?"
13013-130130320 = "Сенсей, ты благополучно добрался домой?"
13013-130130330 = "Ты не слишком устал?"
13013-130130340 = "Я в порядке."
13013-130130350 = "Какое облегчение!"
13013-130130360 = "Завтра тоже поможешь, правда?"
13013-130130370 = "З-завтра?!"
13013-130130380 = "Да! Книжный фестиваль Красной Зимы продолжается и завтра!"
13013-130130390 = "И там ещё столько разделов, которые мне нужно посмотреть!"
13013-130130400 = "Я приду..."
13013-130130410 = "Ура! Спасибо!"
13013-130130420 = "Не могу дождаться!"
13013-130130430 = "Спи крепко!"
13013-130130440 = "Здравствуйте, Сенсей."
13013-130130450 = "Привет........"
13013-130130460 = "А?"
13013-130130470 = "Что-то не так?"
13013-130130480 = "Ни в чём..."
13013-130130490 = "Просто устала после двух бессонных ночей подряд..."
13013-130130500 = "О нет, это уже серьёзно!"
13013-130130510 = "То есть я и сама иногда не спала несколько ночей, читая мангу, но..."
13013-130130520 = "Эм, Сенсей?"
13013-130130530 = "Если ты в состоянии... можешь заглянуть в библиотеку Красной Зимы?"
13013-130130540 = "В библиотеку...?"
13013-130130550 = "Сенсей"
13013-130130560 = "Прошу прощения."
13013-130130570 = "Сегодня уже не смогу встретиться."
13013-130130580 = "Почему?"
13013-130130590 = "Я потеряла кое-что важное."
13013-130130600 = "Нет,"
13013-130130610 = "кое-что незначительное в библиотеке."
13013-130130620 = "Так что сначала нужно это найти."
13013-130130630 = "Тогда я помогу."
13013-130130640 = "Прости?"
13013-130130650 = "Ты правда поможешь?"
