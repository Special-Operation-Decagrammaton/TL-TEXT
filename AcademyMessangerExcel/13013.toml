[translation]
13013-130130010 = "Hum... Sensei"
13013-130130020 = "Você tem um tempinho agora?"
13013-130130030 = "Claro!"
13013-130130040 = "Que alívio..."
13013-130130050 = "Na verdade, tenho um favor para te pedir, Sensei..."
13013-130130060 = "Entendi, já estou indo para aí"
13013-130130070 = "Conseguiu voltar bem para casa?"
13013-130130080 = "Me desculpe por ter segurado você até tão tarde por minha culpa..."
13013-130130090 = "Imagina, não foi incômodo nenhum, eu também me diverti"
13013-130130100 = "Cuide bem dos seus doujinshis, viu?"
13013-130130110 = "Sim!"
13013-130130120 = "Sensei,"
13013-130130130 = "você costuma colecionar alguma coisa?"
13013-130130140 = "Se contar tipos diferentes de cansaço, minha coleção já está bem grande..."
13013-130130150 = "I-Isso"
13013-130130160 = "parece bem puxado..."
13013-130130170 = "E você, Momiji?"
13013-130130180 = "Coleciona alguma coisa?"
13013-130130190 = "Ehehe..."
13013-130130200 = "Eu coleciono livros fora de catálogo de um certo autor"
13013-130130210 = "Sensei..."
13013-130130220 = "Sensei...!"
13013-130130230 = "Finalmente... chegou o grande dia...!"
13013-130130240 = "D-Do quê?"
13013-130130250 = "Você parece bem empolgada, Momiji"
13013-130130260 = "Uauá, me desculpe..."
13013-130130270 = "Acabei me empolgando sem perceber..."
13013-130130280 = "Pode me contar o que é?"
13013-130130290 = "Hoje é..."
13013-130130300 = "O dia do Festival do Livro de Red Winter!"
13013-130130310 = "Hum...?"
13013-130130320 = "Sensei, muito obrigada por ter me acompanhado hoje!"
13013-130130330 = "Andamos para todo lado... Você não ficou cansado?"
13013-130130340 = "Aquilo ali eu tiro de letra!"
13013-130130350 = "Que bom"
13013-130130360 = "Mal posso esperar pelo dia de amanhã!"
13013-130130370 = "A-Amanhã também?!"
13013-130130380 = "É que o Festival do Livro dura 2 dias!"
13013-130130390 = "Amanhã pretendo explorar todos os setores que faltaram!"
13013-130130400 = "V-Vou dar o meu melhor..."
13013-130130410 = "Muito obrigada!"
13013-130130420 = "Ehehe, estou super ansiosa"
13013-130130430 = "Boa noite!"
13013-130130440 = "Bom dia, Sensei"
13013-130130450 = "Bom dia, Momiji..."
13013-130130460 = "Ué?"
13013-130130470 = "Aconteceu alguma coisa?"
13013-130130480 = "Na verdade..."
13013-130130490 = "Virei duas noites seguidas trabalhando e estou com a cabeça meio aérea..."
13013-130130500 = "Ai, não! Que perigo!"
13013-130130510 = "Quer dizer, às vezes eu também fico lendo tanto que quando percebo já amanheceu, mas..."
13013-130130520 = "Hum, Sensei"
13013-130130530 = "Se você puder... gostaria de vir até a biblioteca de Red Winter?"
13013-130130540 = "Até a biblioteca...?"
13013-130130550 = "Sensei"
13013-130130560 = "Me desculpe"
13013-130130570 = "Hoje não vou conseguir me encontrar com você"
13013-130130580 = "O-O que aconteceu?!"
13013-130130590 = "É que lá na biblioteca eu perdi uma coisa muito importante..."
13013-130130600 = "Quer dizer, uma coisinha à toa..."
13013-130130610 = "E preciso..."
13013-130130620 = "...procurar o que deixei cair"
13013-130130630 = "Eu te ajudo a procurar"
13013-130130640 = "Hã?"
13013-130130650 = "Você mesmo, Sensei?"
