[translation]
16004-2101 = "Как поживаете, босс!"
16004-2102 = "Я Пина из «группы Комитета по управлению фестивалями» Объединённой академии Хяккиякко! Прошу любить и жаловать!"
16004-2103 = "Буду рассчитывать на вашу поддержку!"
16004-2104 = "Босс...?"
16004-2105 = "Группа Комитета по управлению фестивалями...?"
16004-2106 = "Ах."
16004-2107 = "Прошу прощения."
16004-2108 = "Это было внезапное представление."
16004-2109 = "Я ещё ко многому не привыкла."
16004-2110 = "Позвольте мне немного потренироваться и в следующий раз попробовать снова."
16004-2111 = "В любом случае, обязательно заходите к нам в гости!!"
16004-2112 = "Сегодня было очень весело, Сенсей!"
16004-2113 = "Я пока не понимаю, что значит «рыцарский кодекс Фины», о котором вы говорили, но"
16004-2114 = "раз уж вы сказали, значит, это точно правильно!"
16004-2115 = "Когда-нибудь я тоже пойму!"
16004-2116 = "Тогда до встречи!! Обязательно!!"
16004-2117 = "Сенсей~~!! Помогите! HELP!!"
16004-2118 = "Я могу попросить только вас! Помогите!"
16004-2119 = "Что случилось?"
16004-2120 = "Что ты натворила?"
16004-2121 = "Я не могу объяснить в сообщении!"
16004-2122 = "Если у вас есть время, не могли бы вы прийти? Пожалуйста!!"
16004-2123 = "Я жду!!"
16004-2124 = "Спасибо большое, Сенсей!"
16004-2125 = "Сегодня мы вместе смотрели фильм, который выбрали вы, так что"
16004-2126 = "в следующий раз давайте посмотрим фильм, который выберу я!"
16004-2127 = "Обязательно! Обязательно!"
16004-2128 = "Сенсей, это Пина!"
16004-2129 = "Как я и говорила, давайте посмотрим фильм, который я выбрала!"
16004-2130 = "Билеты уже готовы!"
16004-2131 = "Тогда я жду!"
16004-2132 = "Прошу!"
16004-2133 = "Спасибо за сегодня!"
16004-2134 = "Простите, что я вас затруднила! И спасибо!!"
16004-2135 = "Давайте и в следующий раз посмотрим кино! Обычное, в кинотеатре!"
16004-160040010 = "Сенсей! Наконец настал момент! Этот момент!"
16004-160040020 = "«Этот момент»...?"
16004-160040030 = "Да!"
16004-160040040 = "Мы провели вместе много времени!"
16004-160040050 = "Доверие тоже накопилось!"
16004-160040060 = "Тогда... остаётся только это!"
16004-160040070 = "...«Это»?"
16004-160040080 = "Именно!"
16004-160040090 = "Итак, недостойная Пина!"
16004-160040100 = "Будет ждать вашего прихода!"