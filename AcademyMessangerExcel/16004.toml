[translation]
16004-2101 = "Здравствуйте! Я просто хотела поздороваться, босс!"
16004-2102 = "Я Пина из Отдела проведения фестивалей Академии Хяккияко."
16004-2103 = "Рада познакомиться!"
16004-2104 = "Почему ты называешь меня «босс»?"
16004-2105 = "Отдел фестивалей?"
16004-2106 = "О!"
16004-2107 = "Прошу прощения."
16004-2108 = "Наверное, я толком и не представилась."
16004-2109 = "Я ещё не очень привыкла к такой манере речи."
16004-2110 = "Надо ещё немного попрактиковаться."
16004-2111 = "В общем, обязательно как-нибудь загляните!"
16004-2112 = "Сегодня было здорово, Сенсей!"
16004-2113 = "Я всё ещё не совсем понимаю, что вы называете «нинкё». Моё рыцарство?"
16004-2114 = "Но уверена, вы имеете в виду что-то хорошее!"
16004-2115 = "Может, со временем пойму."
16004-2116 = "Скоро снова увидимся! Обещаю!"
16004-2117 = "Сенсей! Помогите! Пожалуйста, помогите!"
16004-2118 = "Пожалуйста, помогите! Только вы можете мне помочь, Сенсей!"
16004-2119 = "Что происходит?"
16004-2120 = "Ты сделала что-то плохое?"
16004-2121 = "Я не могу объяснить в сообщении!"
16004-2122 = "Можете прийти, если есть время? Пожалуйста!"
16004-2123 = "Буду ждать!"
16004-2124 = "Огромное спасибо за сегодня, Сенсей!"
16004-2125 = "Раз сегодняшний фильм выбирали вы..."
16004-2126 = "в следующий раз позвольте выбрать мне!"
16004-2127 = "Пожалуйста, не отказывайте!"
16004-2128 = "Я здесь, Сенсей!"
16004-2129 = "Как и говорила, я пришла отвести вас в кино!"
16004-2130 = "У меня уже есть два билета! Хи-хи."
16004-2131 = "Буду ждать!"
16004-2132 = "Приходите, когда будет время!"
16004-2133 = "Кажется, сегодня я столько всего на вас свалила!"
16004-2134 = "Простите... И спасибо!"
16004-2135 = "В следующий раз обязательно предупрежу, прежде чем покупать билеты!"
16004-160040010 = "Сенсей! Наконец настало время!"
16004-160040020 = "Время...?"
16004-160040030 = "Да!"
16004-160040040 = "Мы уже довольно давно знакомы!"
16004-160040050 = "И теперь очень доверяем друг другу!"
16004-160040060 = "Нам только это и нужно!"
16004-160040070 = "Нужно?"
16004-160040080 = "Да!"
16004-160040090 = "Тогда до вашего приезда!"
16004-160040100 = "Буду ждать вас, Сенсей!"
