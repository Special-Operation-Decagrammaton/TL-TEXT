[translation]
16004-2101 = "Como está passando, Chefe?!"
16004-2102 = "Sou a Pina, do clã \"Comitê de Gestão de Festivais\" da Academia Aliada Hyakkiyako!"
16004-2103 = "Tamo junto pro que der e vier!"
16004-2104 = "Chefe......?"
16004-2105 = "\"Clã\" Comitê de Festivais......?"
16004-2106 = "Opa"
16004-2107 = "Peço perdão"
16004-2108 = "Foi uma apresentação meio do nada, né?"
16004-2109 = "É que ainda não peguei o jeito da coisa"
16004-2110 = "Vou treinar mais um pouquinho e depois você me deixa tentar de novo, por favor!"
16004-2111 = "Enfim, aparece lá pra visitar a gente qualquer hora dessas!!"
16004-2112 = "Hoje foi super divertido, Sensei!"
16004-2113 = "Ainda não entendi direito o que é esse tal \"espírito yakuza da Pina\" que você falou, mas"
16004-2114 = "Se foi você quem disse, Sensei, então não tem erro!"
16004-2115 = "Um dia com certeza eu vou sacar o que significa!"
16004-2116 = "Então até a próxima!! Sem falta, hein!!"
16004-2117 = "Senseeei!! Me ajudaaa! HELP!!"
16004-2118 = "Só posso pedir isso pra você, Sensei! Socorro!"
16004-2119 = "O que aconteceu?"
16004-2120 = "Aprontou alguma coisa?"
16004-2121 = "Não dá pra explicar por mensagem!"
16004-2122 = "Se tiver um tempinho, você pode vir até aqui? Por favooor!!"
16004-2123 = "Tô te esperando!!"
16004-2124 = "Muito obrigada mesmo, Sensei!"
16004-2125 = "Como hoje a gente assistiu ao filme que você escolheu,"
16004-2126 = "Na próxima vamos assistir juntinhos ao filme que a Pina escolher!"
16004-2127 = "Combinado?! Combinado mesmo, hein!"
16004-2128 = "Sensei, é a Pina!"
16004-2129 = "Como eu falei outro dia, dessa vez vamos ver o filme que eu escolhi!"
16004-2130 = "Já até garanti os ingressos!"
16004-2131 = "Tô te esperando lá, então!"
16004-2132 = "Conto com você!"
16004-2133 = "Muito obrigada pelo esforço hoje!"
16004-2134 = "Desculpa a confusão por minha causa! E muito obrigada mesmo!!"
16004-2135 = "Vamos ver outro filme na próxima! Dessa vez num cinema normal!"
16004-160040010 = "Sensei! Finalmente chegou a hora! A grande hora!"
16004-160040020 = " \"A grande hora\"......?"
16004-160040030 = "Isso mesmo!"
16004-160040040 = "Nós já passamos muito tempo juntos até hoje!"
16004-160040050 = "E a nossa confiança mútua só cresceu!"
16004-160040060 = "Sendo assim...... só resta AQUILO!"
16004-160040070 = " ......\"AQUILO\"?"
16004-160040080 = "Exatamente!"
16004-160040090 = "Portanto, esta humilde Pina que vos fala"
16004-160040100 = "Aguarda ansiosamente a sua chegada, Sensei!"
