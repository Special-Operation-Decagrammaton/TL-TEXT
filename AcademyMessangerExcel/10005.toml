[translation]
10005-162 = "Эм, Сенсей, можете зайти в комнату Комитета по противодействию закрытию, когда будет время?"
10005-163 = "Мне нужна ваша помощь."
10005-164 = "А ещё я слышала, что киты задерживают дыхание под водой. Вы знали?"
10005-165 = "В комнату Комитета по противодействию закрытию? Хорошо."
10005-166 = "Не знал. Всё-таки они млекопитающие."
10005-167 = "Уф. Сенсей, я проснулась с ужасной болью в спине... Всё тело болит..."
10005-168 = "Вот как должен ощущаться утиный пух?"
10005-169 = "Теперь, когда я постарела, может, мне стоит спать на твёрдом полу."
10005-170 = "В следующий раз тебе стоит найти место поудобнее для сна."
10005-171 = "Ну, в любом случае пока перестану пользоваться матом."
10005-172 = "Уф, почему вообще нужно просыпаться утром?"
10005-173 = "Веки такие тяжёлые. Помогите, Сенсей..."
10005-174 = "Ах, ученическая жизнь."
10005-175 = "Ты справишься, Хошино!"
10005-176 = "Хотела бы я быть без век, как рыба. Хм..."
10005-177 = "Сенсей, вы знали?"
10005-178 = "Некоторые рыбы, живущие в самых глубоких частях океана, сами излучают свет, чтобы защищаться."
10005-179 = "О, сегодня я снова иду искать сокровища. Хотите со мной?"
10005-180 = "Понятно. Ты и дня не пропустишь, да?"
10005-181 = "Не знал. Море - такое загадочное место."
10005-182 = "Сенсей, Сенсей! Смотрите!"
10005-184 = "О, ты прикрепила их к потолку?"
10005-185 = "Красиво!"
10005-186 = "Хе-хе, правда здорово? Когда лежу, выглядит потрясающе!"
10005-187 = "Сегодня было очень весело. Спасибо за подарок!"
10005-188 = "Давайте в следующий раз снова куда-нибудь сходим."
10005-189 = "Хорошо. Спокойной ночи."
10005-190 = "Кровать под звёздами? Звучит мечтательно."
10005-191 = "Ухее～ Вся неделя тяжёлая, если я не сплю до рассвета."
10005-192 = "Я что, старею?"
10005-193 = "Вам тоже не стоит бодрствовать в такое время, Сенсей."
10005-194 = "Вам нужно беречь себя!"
10005-195 = "Почему вы ещё не спите?"
10005-196 = "Вам стоит ложиться пораньше."
10005-197 = "Ну, причин несколько..."
10005-198 = "Вы за меня переживаете?"
10005-199 = "Ого! Я тронута..."
10005-200 = "Я просто ворчу."
10005-201 = "Будьте честны, Сенсей. Ухе-хе~"
10005-202 = "Сенсей, можете никому не рассказывать о сегодняшнем? Я знаю, вы умеете хранить секреты."
10005-203 = "Эм... Мне просто ужасно неловко."
10005-204 = "Ухе~ Ну тогда до встречи."
10005-205 = "Спокойной ночи, Хошино!"
10005-206 = "Увидимся, крокодил!"
10005-207 = "Я хочу купить книгу. Поможете мне, Сенсей?"
10005-208 = "Книги, которую я ищу, нет в моём городе."
10005-209 = "Хорошо. Сходим в книжный магазин в торговом центре?"
10005-210 = "О, конечно. Он далековато от Абидоса,"
10005-211 = "но уверена, там найдётся нужная мне книга!"
10005-212 = "Вы пойдёте со мной?"
10005-213 = "Конечно, Хошино."
10005-214 = "Встретимся где-нибудь неподалёку и пойдём вместе."
10005-215 = "Ого, сегодня было потрясающе."
10005-216 = "Мне нравится, как вы настроены победить. Это часть взрослой жизни? Я бы тоже хотела этому научиться. Хм."
10005-217 = "Вот оно, преимущество взрослого!"
10005-218 = "...Хотя мы могли просто потратить эти деньги на билет."
10005-219 = "Это жульничество!"
10005-220 = "В жизни есть битвы, которые просто необходимо принять."
10005-221 = "Ухе, вот как?"
10005-222 = "Спасибо."
10005-223 = "Эй, хочешь в следующий раз сходить со мной в океанариум? У меня два билета..."
10005-224 = "Пойду. Если ты не против."
10005-225 = "Конечно. Можешь приглашать меня когда угодно."
10005-226 = "Да?"
10005-227 = "...Ухе-хе!"
10005-228 = "Обещаете?"
10005-229 = "Скажите, когда сможем пойти, Сенсей!"
10005-230 = "Сенсей, насчёт тех билетов в океанариум, которые я получила раньше..."
10005-231 = "У них скоро закончится срок действия. Сходим?"
10005-232 = "Буду ждать перед океанариумом."
10005-233 = "Хорошо. Увидимся там."
10005-100050010 = "У меня проблема."
10005-100050020 = "Неважно, где я прячусь!"
10005-100050030 = "Мои милые младшеклассницы всегда меня находят и отчитывают..."
10005-100050040 = "Эта старушка очень грустит."
10005-100050050 = "Тебя снова отругали?"
10005-100050060 = "Ты совсем не меняешься, Хошино."
10005-100050070 = "Не поспоришь!"
10005-100050080 = "Так вот..."
10005-100050100 = "Погоди."
10005-100050110 = "Это не по теме, но..."
10005-100050120 = "Сенсей"
10005-100050130 = "Ты потом свободен?"
10005-100050140 = "Сенсей"
10005-100050150 = "У этой старушки есть ещё кое-что подобное."
10005-100050160 = "Разве тебе не любопытно?"
10005-100050170 = "Ты меня заинтересовала."
10005-100050180 = "Мне нужно открывать каждый предмет, выполняя определённые условия?"
10005-100050190 = "Наверное?"
10005-100050200 = "Да, звучит неплохо."
10005-100050210 = "В следующий раз покажу ещё один."
10005-100050220 = "Жди с нетерпением!"
