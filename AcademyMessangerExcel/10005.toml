[translation]
10005-162 = "Сенсей, если у вас будет время, не могли бы вы прийти в класс Комитета по контролю в ближайший выходной?"
10005-163 = "Мне нужна ваша помощь."
10005-164 = "И, кстати, вы знали, что киты задерживают дыхание под водой?"
10005-165 = "Класс Комитета по контролю, понял."
10005-166 = "Не знал. Действительно, они же млекопитающие."
10005-167 = "Сенсей, когда я проснулась, у меня так болела спина, что я чуть не закричала... караул..."
10005-168 = "Это что, перья такие?"
10005-169 = "Наверное, в моём возрасте слишком мягкое спать вредно..."
10005-170 = "Лучше спать на нормальной кровати."
10005-171 = "Хм-м... похоже, тот матрас снова отправится на склад..."
10005-172 = "Почему люди должны просыпаться по утрам..."
10005-173 = "Веки такие тяжёлые, что вот-вот упадут на пол... Сенсей, помогите..."
10005-174 = "Потому что это удел учениц..."
10005-175 = "Держись! Хосино, у тебя получится!"
10005-176 = "Может, было бы проще, если бы у меня, как у рыб, не было век... муня..."
10005-177 = "Сенсей, вы знали?"
10005-178 = "Говорят, у рыб, живущих в глубоком море, некоторые испускают свет, чтобы защитить себя."
10005-179 = "Кстати, сегодня я опять иду искать сокровища, пойдёте?"
10005-180 = "Есть, капитан!"
10005-181 = "Не знал, мир океана действительно глубок."
10005-182 = "Сенсей, посмотрите сюда!"
10005-184 = "Я приклеила это на потолок."
10005-185 = "Здорово, красиво."
10005-186 = "Хе-хе-хе~, правда же? Это превзошло мои ожидания~"
10005-187 = "Сегодня было весело, спасибо за подарок."
10005-188 = "Тогда в следующий раз снова куда-нибудь сходим. Обещайте."
10005-189 = "Хорошо, спокойной ночи."
10005-190 = "Кровать, окутанная светом, романтично."
10005-191 = "Ух~, если не спать до полуночи, на следующий день это аукается..."
10005-192 = "Может, это из-за возраста~"
10005-193 = "Сенсей, вы тоже не ходите гулять слишком поздно."
10005-194 = "Давайте заботиться друг о друге~"
10005-195 = "А почему Хосино не спит до ночи?"
10005-196 = "Да, лучше ложиться пораньше."
10005-197 = "Ну, у дяди свои обстоятельства, так сказать..."
10005-198 = "А вообще, Сенсей, вы обо мне беспокоитесь?"
10005-199 = "Дядя растроган~"
10005-200 = "Это замечание ученице с плохим поведением."
10005-201 = "Какой вы неискренний, Сенсей, ух-хе~"
10005-202 = "Сенсей, то, что было сегодня, — никому ни слова, ладно? Я знаю, что вы умеете держать язык за зубами."
10005-203 = "Это... ну, в общем, мне стыдно."
10005-204 = "Ух-хе, тогда до встречи."
10005-205 = "Хорошо, спокойной ночи."
10005-206 = "Пока."
10005-207 = "Я хочу купить кое-какие книги. Сенсей, вы не составите мне компанию?"
10005-208 = "В этих краях их не купишь, придётся ехать далеко..."
10005-209 = "Хорошо, давай съездим в торговый центр?"
10005-210 = "Давай~, хотя от Абидоса это далековато."
10005-211 = "Но там, наверное, есть что надо~"
10005-212 = "Кстати, вы согласились без колебаний, как и ожидалось от Сенсея~"
10005-213 = "Конечно, потому что просишь ты, Хосино."
10005-214 = "Тогда встретимся где-нибудь поблизости."
10005-215 = "Ну и ну, удивили вы меня~"
10005-216 = "Пытаться вырвать удачу силой воли — это по-нашему, Сенсей. Дядя просто поражён."
10005-217 = "Это и есть сила взрослого!"
10005-218 = "...Но если подумать, на эти деньги мы могли бы просто купить билеты."
10005-219 = "Если так рассуждать, то всему конец!"
10005-220 = "У взрослых бывают моменты, когда нельзя отступать."
10005-221 = "Ух-хе, понятно~"
10005-222 = "Но в любом случае, спасибо вам."
10005-223 = "...Э-это, а вы не хотите сходить в тот аквариум? Билетов ведь два..."
10005-224 = "Да, если я подхожу."
10005-225 = "Конечно, спасибо."
10005-226 = "...Ух-хе."
10005-227 = "...Вы сказали, да, Сенсей?"
10005-228 = "Вы же обещали?"
10005-229 = "Тогда в следующий раз, когда нам обоим будет удобно, сходим. Я ещё свяжусь~"
10005-230 = "Сенсей, насчёт того разговора про аквариум."
10005-231 = "Срок действия билетов скоро истекает, так что, может, в эти выходные?"
10005-232 = "Если устраивает, тогда встречаемся у аквариума, договорились~"
10005-233 = "Хорошо, без проблем. С нетерпением жду."
10005-100050010 = "Ну и дела..."
10005-100050020 = "Куда бы я ни спряталась,"
10005-100050030 = "всё равно от милых младших слышу нотации..."
10005-100050040 = "Дяде грустно."
10005-100050050 = "Опять нотации..."
10005-100050060 = "Ты всё такая же, Хосино."
10005-100050070 = "Ну да."
10005-100050080 = "А вообще,"
10005-100050100 = "нет."
10005-100050110 = "Это не связано."
10005-100050120 = "Сенсей,"
10005-100050130 = "вы не могли бы встретиться прямо сейчас?"
10005-100050140 = "Сенсей,"
10005-100050150 = "знаете, у дяди есть куча разных штук для дневного сна."
10005-100050160 = "Вам не интересно~?"
10005-100050170 = "Если ты так говоришь, мне становится интересно."
10005-100050180 = "Можно я как-нибудь приду ещё?"
10005-100050190 = "Правда?"
10005-100050200 = "Тогда,"
10005-100050210 = "в следующий раз я покажу вам кое-что другое."
10005-100050220 = "Ждите~"
