[translation]
10005-162 = "Sensei, se tiver um tempinho na próxima folga, pode dar um pulo na sala do Comitê de Contramedidas?"
10005-163 = "Queria pedir uma mãozinha sua."
10005-164 = "Ah, e mudando totalmente de assunto: sabia que as baleias prendem a respiração debaixo d'água?"
10005-165 = "Na sala do Comitê de Contramedidas, né? Combinado."
10005-166 = "Não sabia. Faz sentido, já que são mamíferos."
10005-167 = "Sensei, acordei com uma dor nas costas que parece que vou partir ao meio... minha coluna tá gritando..."
10005-168 = "Colchão de plumas é assim mesmo?"
10005-169 = "Pelo visto, nessa idade não dá pra dormir em coisa macia demais..."
10005-170 = "É melhor você dormir numa cama de verdade."
10005-171 = "Humm... acho que aquele colchonete vai acabar voltando pro depósito..."
10005-172 = "Por que será que o ser humano é obrigado a acordar cedo de manhã...?"
10005-173 = "Minhas pálpebras tão tão pesadas que vão cair no chão... Me salva, Sensei..."
10005-174 = "É o triste fardo de ser estudante..."
10005-175 = "Força! Você consegue, Hoshino!"
10005-176 = "Quem sabe não fosse mais fácil não ter pálpebras igual aos peixes......... nham, zzz..."
10005-177 = "Sensei, você sabia?"
10005-178 = "Dizem que no fundo do mar existem peixes que emitem luz do próprio corpo para se proteger."
10005-179 = "Deixando isso de lado, hoje vou sair à caça ao tesouro de novo, quer vir?"
10005-180 = "Ciente, Capitã!"
10005-181 = "Não sabia, o mundo marinho é fascinante."
10005-182 = "Sensei, olha só isso!"
10005-184 = "Colei tudo no teto."
10005-185 = "Uau, ficou lindo!"
10005-186 = "Hehehe~, ficou show, né? Superou minhas expectativas~"
10005-187 = "Hoje foi muito divertido, valeu pelo presente."
10005-188 = "Bom, vamos sair juntos pra algum lugar na próxima também. Promessa, hein?"
10005-189 = "Sim, boa noite."
10005-190 = "Uma cama cercada de luzes... que romântico."
10005-191 = "Uéé~, ficar acordada até tarde da noite realmente cobra o preço no dia seguinte..."
10005-192 = "Será que é a idade pesando~?"
10005-193 = "Você também não pode ficar saindo de madrugada por aí não, viu, Sensei?"
10005-194 = "Vamos nos cuidar direitinho~"
10005-195 = "E por que você fica acordada até tarde da noite, Hoshino?"
10005-196 = "Pois é, nada melhor do que dormir cedo à noite."
10005-197 = "Bom, esta tiozona aqui tem lá os seus motivos..."
10005-198 = "Aliás, Sensei, você tá preocupado comigo?"
10005-199 = "Assim a tiozona aqui fica até emocionada~"
10005-200 = "É só uma bronca numa aluna malcomportada."
10005-201 = "Como você é difícil de admitir as coisas, Sensei, uhehe~"
10005-202 = "Sensei, o que rolou hoje é segredo das meninas, viu? Eu sei que você sabe guardar segredo, mas..."
10005-203 = "É que... dá mó vergonha."
10005-204 = "Uhehe, então até mais!"
10005-205 = "Sim, boa noite."
10005-206 = "Até mais."
10005-207 = "Tô querendo comprar um livro. Sensei, você não quer vir comigo?"
10005-208 = "É um livro que não vende por aqui, então vou ter que ir meio longe..."
10005-209 = "Claro, vamos sim. Quer dar um pulo lá pros lados do shopping?"
10005-210 = "Bora lá~, fica meio longe de Abydos, mas"
10005-211 = "lá com certeza deve ter~"
10005-212 = "Aliás, você topou na hora sem nem pestanejar! Esse é o meu Sensei~"
10005-213 = "Claro, né? Ainda mais sendo um pedido da Hoshino."
10005-214 = "Por enquanto, vamos nos encontrar aqui por perto."
10005-215 = "Rapaz~, fiquei de cara agora~"
10005-216 = "Tentar arrancar a sorte na pura raça... só você mesmo, Sensei. A tiozona aqui ficou impressionada."
10005-217 = "Esse é o poder de um adulto!"
10005-218 = "...Mas, parando pra pensar, com aquele dinheiro dava pra ter comprado o ingresso normalmente, né?"
10005-219 = "Se você falar isso, estraga tudo!"
10005-220 = "Tem horas na vida de um adulto em que não dá pra recuar."
10005-221 = "Uhehe, entendi~"
10005-222 = "Bom, de qualquer forma, obrigada, viu?"
10005-223 = "...Hum, aquele aquário, não quer ir comigo? São 2 ingressos mesmo..."
10005-224 = "Claro, se a minha companhia servir."
10005-225 = "Com certeza! Valeu~"
10005-226 = "...Uhehe."
10005-227 = "...Você disse que vai, hein, Sensei?"
10005-228 = "Prometeu, tá prometido, viu?"
10005-229 = "Então vamos num dia que fique bom pros dois. Te mando mensagem depois~"
10005-230 = "Sensei, sobre aquela ida ao aquário que a gente combinou..."
10005-231 = "A validade dos ingressos tá quase vencendo, que tal irmos neste fim de semana?"
10005-232 = "Se tiver tudo certo pra você, nos encontramos na frente do aquário. Combinado~!"
10005-233 = "Combinado. Tô ansioso pelo passeio."
10005-100050010 = "Que situação complicada, viu~"
10005-100050020 = "Não importa onde eu me esconda,"
10005-100050030 = "as minhas queridas calouras me acham pra dar sermão..."
10005-100050040 = "A tiozona aqui fica triste."
10005-100050050 = "Levando sermão de novo..."
10005-100050060 = "Você não muda mesmo, né, Hoshino?"
10005-100050070 = "Pois é, né~"
10005-100050080 = "Sendo assim..."
10005-100050100 = "Não, pera,"
10005-100050110 = "isso não tem nada a ver com aquilo, mas..."
10005-100050120 = "Sensei,"
10005-100050130 = "a gente pode se encontrar agora?"
10005-100050140 = "Sensei,"
10005-100050150 = "sabia que a tiozona aqui tem uma coleção inteira de acessórios para soneca?"
10005-100050160 = "Não bateu uma curiosidade~?"
10005-100050170 = "Falando assim, até que fiquei curioso."
10005-100050180 = "Posso passar aí de novo qualquer dia desses?"
10005-100050190 = "Não falei?"
10005-100050200 = "Então beleza,"
10005-100050210 = "da próxima vez te mostro outra coisa."
10005-100050220 = "Pode esperar pra ver~"
