[translation]
26002-1972 = "Сенсей, угадайте, какая специя самая важная в готовке."
26002-1973 = "Сахар?"
26002-1974 = "Соль?"
26002-1975 = "Ну, это тоже важно."
26002-1976 = "Что может быть важнее?"
26002-1977 = "А? Но..."
26002-1978 = "Есть кое-что ещё, что невероятно важно."
26002-1979 = "Ответ..."
26002-1980 = "ЛЮБОВЬ!"
26002-1981 = "Любовь...?"
26002-1982 = "Ну, некоторые так говорят."
26002-1983 = "Вот именно!"
26002-1984 = "Но если это так, у меня вопрос."
26002-1985 = "Какой?"
26002-1986 = "Ну, я согласна, что любовь — важнейшая приправа в готовке."
26002-1987 = "Но тогда..."
26002-1988 = "сколько любви нужно добавлять?"
26002-1989 = "Сколько любви?"
26002-1990 = "Может, совсем чуть-чуть, как специи?"
26002-1991 = "Или достаточно, чтобы чувствовался вкус?"
26002-1992 = "Или целую кастрюлю?"
26002-1993 = "Я не могу понять!"
26002-1994 = "Э-Эм?"
26002-1995 = "Поможете мне разобраться?"
26002-1996 = "Что?"
26002-1997 = "Сенсей... Я снова попала в неприятности."
26002-1998 = "А? За что?"
26002-1999 = "Что значит «снова»?"
26002-2000 = "Я случайно снова устроила взрыв во время готовки..."
26002-2001 = "Случайно?"
26002-2002 = "Но как?"
26002-2003 = "Да?"
26002-2004 = "Я смешала уксус, сахар, соль и майонез. И вдруг..."
26002-2005 = "всё взорвалось!"
26002-2006 = "Погоди... Ты смешала уксус, сахар, соль и майонез, и оно взорвалось?"
26002-2007 = "А что, при готовке такого не бывает?"
26002-2008 = "Взрывов."
26002-2009 = "Я пыталась сделать вкусный соус!"
26002-2010 = "Все макают хлебные палочки в такой соус!"
26002-2011 = "По крайней мере, мне кажется!"
26002-2012 = "Эм... Нет, не думаю, что взрывы так уж обычны..."
26002-2013 = "Правда? Может, взрывы встречаются чаще, чем вы думаете..."
26002-2014 = "Хм... Но теперь у меня проблемы."
26002-2015 = "Интересно, что не так с моей готовкой..."
26002-2016 = "Самой мне сложно разобраться..."
26002-2017 = "Почему бы мне не посмотреть, как ты готовишь?"
26002-2018 = "Правда?"
26002-2019 = "Если вы посмотрите, мы наверняка поймём, что я делаю неправильно..."
26002-2020 = "Хи-хи! Скоро увидимся!"
26002-2021 = "Я многому у вас научилась, Сенсей."
26002-2022 = "Большое спасибо."
26002-2023 = "Теперь я наконец понимаю, насколько опасно было то, что я делала."
26002-2024 = "В следующий раз попробую другой метод!"
26002-2025 = "Может, просто следовать рецепту...?"
26002-2026 = "Но готовка — это творчество!"
26002-2027 = "Это одна из главных радостей готовки! Разве нет?"
26002-2028 = "Ну... Если тебе весело."
26002-2029 = "Я снова попала в неприятности..."
26002-2030 = "Что на этот раз?"
26002-2031 = "Сайра, которую я жарила на обед, внезапно убежала..."
26002-2032 = "Погоди, что? Убежала?"
26002-2033 = "Но она же жареная..."
26002-2034 = "Жареная сайра обычно убегает?"
26002-2035 = "Эм..."
26002-2036 = "Мне немного неловко..."
26002-2037 = "Но да..."
26002-2038 = "Такое бывает примерно раз в неделю..."
26002-2039 = "Тут нечего стесняться... Наверное?"
26002-2040 = "А, значит, это регулярно!"
26002-2041 = "Не понимаю, почему со мной постоянно такое происходит!"
26002-2042 = "Что мне делать, Сенсей?"
26002-2043 = "Почему бы не провести эксперимент?"
26002-2044 = "Эксперимент?"
26002-2045 = "Эксперимент, чтобы выяснить, почему это происходит, когда ты готовишь."
26002-2046 = "Мы найдём причину."
26002-2047 = "Интересно..."
26002-2048 = "Если найдём причину, возможно, сможем найти и решение."
26002-2049 = "Вот об этом я и говорю!"
26002-2050 = "Да! Хорошо!"
26002-2051 = "Увидимся в школьной столовой!"
26002-260020010 = "Сенсей, эм..."
26002-260020020 = "А? Джури, что случилось?"
26002-260020030 = "...Тебя снова отругали?"
26002-260020040 = "О, нет! Ничего не случилось."
26002-260020050 = "Вообще-то думаю, сегодня я заслуживаю похвалы!"
26002-260020060 = "Сегодня во время готовки не взорвалась ни одна кастрюля. Хи-хи!"
26002-260020070 = "П-Понятно. Это здорово..."
26002-260020080 = "Хи-хи! Я понемногу улучшаюсь!"
26002-260020090 = "Но на самом деле я написала вам потому что..."
26002-260020100 = "Так что, эмм..."
26002-260020110 = "Сенсей, вы свободны на этих выходных?"
26002-260020120 = "На этих выходных будет обычное мероприятие Клуба школьного питания Геенны..."
26002-260020130 = "Я надеялась, вы мне поможете..."
26002-260020140 = "Конечно. Без проблем."
26002-260020150 = "Хи-хи! Хорошо!"
26002-260020160 = "Тогда встретимся на выходных в школьной столовой!"
26002-260020170 = "П-простите, что сегодня доставила вам неудобства, Сенсей."
26002-260020180 = "Ты в порядке? Сегодня было довольно жарко."
26002-260020190 = "Я в порядке!"
26002-260020200 = "Дело не в этом..."
26002-260020210 = "...?"
26002-260020220 = "Н-Ничего! Потом поговорим!"
26002-260020230 = "Давайте снова вместе поработаем в огороде, Сенсей!"
26002-260020240 = "В следующий раз постараемся, чтобы было не так жарко..."
26002-260020250 = "В-В любом случае, я уже жду!"
