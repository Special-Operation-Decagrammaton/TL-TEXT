[translation]
26002-1972 = "Как вы думаете, Сенсей, какая самая важная приправа в готовке?"
26002-1973 = "Сахар?"
26002-1974 = "Соль?"
26002-1975 = "Да, они, безусловно, важны, но..."
26002-1976 = "Но...?"
26002-1977 = "По-настоящему важная приправа..."
26002-1978 = "Это не просто сахар или соль."
26002-1979 = "Правильный ответ..."
26002-1980 = "Любовь!"
26002-1981 = "Любовь...?"
26002-1982 = "В самом деле..."
26002-1983 = "Верно?"
26002-1984 = "Но у меня есть одно сомнение."
26002-1985 = "Сомнение?"
26002-1986 = "Я не спорю, что лучшая приправа для еды — это любовь."
26002-1987 = "Но вопрос в том..."
26002-1988 = "сколько любви нужно добавлять в блюдо?"
26002-1989 = "...Сколько?"
26002-1990 = "Совсем чуть-чуть, как секретный ингредиент?"
26002-1991 = "Или столько, чтобы было явно заметно?"
26002-1992 = "А может, лучше добавить побольше...?"
26002-1993 = "Я не могу уснуть по ночам, так мне интересно!"
26002-1994 = "Ну, это..."
26002-1995 = "Я хочу найти ответ, не поможете ли вы мне?"
26002-1996 = "Да, конечно..."
26002-1997 = "Сенсей... меня опять отчитали..."
26002-1998 = "Джури, тебя поругали? За что?"
26002-1999 = "Опять...?"
26002-2000 = "Я готовила, и у меня случился взрыв..."
26002-2001 = "За такое, наверное, и правда ругают..."
26002-2002 = "Что именно случилось...?"
26002-2003 = "Ну..."
26002-2004 = "Я смешивала уксус, сахар, соль и майонез... и бабах!"
26002-2005 = "Почему это вообще взрывается!?"
26002-2006 = "Разве в этих ингредиентах есть что-то взрывоопасное?"
26002-2007 = "А? Странно..."
26002-2008 = "Разве взрывы — это не обычное дело в готовке?"
26002-2009 = "Жалко, тот соус должен был быть очень вкусным...!"
26002-2010 = "Этот соус макать в хлеб — сейчас тренд!"
26002-2011 = "...В будущем!"
26002-2012 = "Что-то я не слышал о таком «обычном деле»..."
26002-2013 = "Правда..."
26002-2014 = "Что же делать..."
26002-2015 = "Где я ошиблась..."
26002-2016 = "В таких вещах одной трудно разобраться..."
26002-2017 = "А может, ты покажешь мне, как готовишь?"
26002-2018 = "О, спасибо! Вы согласны?"
26002-2019 = "Если вы посмотрите, возможно, мы найдём причину...!"
26002-2020 = "Тогда, пожалуйста!"
26002-2021 = "Сенсей, спасибо за ваш совет сегодня."
26002-2022 = "Вы очень помогли."
26002-2023 = "Благодаря вам я поняла, что этот способ опасен,"
26002-2024 = "так что в следующий раз я попробую что-то другое!"
26002-2025 = "Может, попробовать готовить по рецепту...?"
26002-2026 = "Путь кулинарии бесконечен!"
26002-2027 = "Исследовать его — одно из удовольствий готовки!"
26002-2028 = "Понимаю, удовольствие — это важно. Хм..."
26002-2029 = "Меня опять отчитали..."
26002-2030 = "Что случилось на этот раз?"
26002-2031 = "Сегодня в обед моя солёная скумбрия на гриле сбежала..."
26002-2032 = "Подожди, кто сбежал...?"
26002-2033 = "Ну, скумбрия на гриле..."
26002-2034 = "Разве зажаренная рыба может физически сбежать?"
26002-2035 = "Ну, да..."
26002-2036 = "Мне стыдно..."
26002-2037 = "Понимаете..."
26002-2038 = "Это случается примерно раз в неделю..."
26002-2039 = "Стыдно, даже не знаю..."
26002-2040 = "Так регулярно сбегает, да."
26002-2041 = "Почему, когда я готовлю, всё время происходит что-то такое?"
26002-2042 = "Как вы думаете, Сенсей...?"
26002-2043 = "Тогда давай проведём эксперимент?"
26002-2044 = "Эксперимент...?"
26002-2045 = "Почему твои блюда получаются такими"
26002-2046 = "можно проверить, меняя условия и выясняя причины."
26002-2047 = "Понимаю..."
26002-2048 = "Если знать причину, можно решить проблему..."
26002-2049 = "Действительно, может быть, так и есть!"
26002-2050 = "Спасибо, я буду очень рада!"
26002-2051 = "Тогда сегодня не могли бы вы зайти в столовую? Пожалуйста!"
26002-260020010 = "Сенсей, ну..."
26002-260020020 = "Что случилось?"
26002-260020030 = "Опять кто-то наругал?"
26002-260020040 = "Ах, нет, на этот раз меня никто не ругал!"
26002-260020050 = "Наоборот, я бы хотела похвастаться!"
26002-260020060 = "Ведь сегодня у меня ещё не взрывалась кастрюля!"
26002-260020070 = "Ну, это здорово...?"
26002-260020080 = "Да, я тоже расту с каждым днём!"
26002-260020090 = "Ах, да, по делу."
26002-260020100 = "Если вам удобно,"
26002-260020110 = "не найдёте ли вы время на этих выходных?"
26002-260020120 = "В тот день я как раз буду в школе по делам столовой."
26002-260020130 = "Мне бы хотелось кое-что вам показать."
26002-260020140 = "Хорошо, договорились."
26002-260020150 = "Спасибо!"
26002-260020160 = "Тогда буду ждать вас в столовой!"
26002-260020170 = "Извините, что причинила вам неудобства сегодня..."
26002-260020180 = "Не переживай. Ты хорошо себя чувствуешь? Из-за солнца, наверное?"
26002-260020190 = "С телом всё в порядке!"
26002-260020200 = "Похоже, возможно, слышала, что..."
26002-260020210 = "?"
26002-260020220 = "Нет, ничего! Не обращайте внимания...!"
26002-260020230 = "Но, в следующий раз я была бы рада, если бы вы снова помогли!"
26002-260020240 = "На этот раз, может, выбрать день, когда солнце не слишком яркое, для лучших условий..."
26002-260020250 = "В общем, продолжайте, пожалуйста!"