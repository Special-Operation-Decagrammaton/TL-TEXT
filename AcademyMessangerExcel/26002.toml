[translation]
26002-1972 = "Sensei, qual você acha que é o tempero mais importante na culinária?"
26002-1973 = "Açúcar?"
26002-1974 = "Sal?"
26002-1975 = "Pois é, esses também são muito importantes, claro, mas..."
26002-1976 = "Mas...?"
26002-1977 = "O tempero verdadeiramente essencial..."
26002-1978 = "Não é nada comum como açúcar ou sal."
26002-1979 = "A resposta certa é..."
26002-1980 = "O amor!"
26002-1981 = "Amor...?"
26002-1982 = "Faz sentido..."
26002-1983 = "Não é?"
26002-1984 = "Só que eu tenho uma dúvida."
26002-1985 = "Dúvida?"
26002-1986 = "Não há dúvidas de que o melhor tempero para um prato é o amor."
26002-1987 = "Até aí tudo bem, mas..."
26002-1988 = "Qual será a medida certa de amor para colocar na comida?"
26002-1989 = "...Medida certa?"
26002-1990 = "Será que é só uma pitadinha, como um toque secreto?"
26002-1991 = "Ou em uma quantidade que dê para notar claramente?"
26002-1992 = "Ou quem sabe colocar de montão faça mais efeito...?"
26002-1993 = "Estou tão encafifada com isso que não consigo nem dormir à noite!"
26002-1994 = "Hum, bom..."
26002-1995 = "Estou pensando em buscar essa resposta. Será que você poderia me ajudar?"
26002-1996 = "Sim, tudo bem, mas..."
26002-1997 = "Sensei... Levei bronca de novo..."
26002-1998 = "Você levou bronca, Juri? Por quê?"
26002-1999 = "Como assim 'de novo'...?"
26002-2000 = "Eu estava cozinhando e acabei causando uma explosão..."
26002-2001 = "É, aí acho que dá pra entender a bronca..."
26002-2002 = "O que aconteceu...?"
26002-2003 = "Hum..."
26002-2004 = "Eu estava misturando vinagre, açúcar, sal e maionese, e aí... BUM!"
26002-2005 = "Como é que isso explode?!"
26002-2006 = "Onde é que tinha elemento explosivo nesses ingredientes?!"
26002-2007 = "Hã? Ué?"
26002-2008 = "Explosões não são super comuns na cozinha?"
26002-2009 = "Aquele molho especial com certeza ia ficar uma delícia, que desperdício...!"
26002-2010 = "Chuchar o pão naquele molho é a maior tendência!"
26002-2011 = "...No futuro!"
26002-2012 = "Olha, para mim isso não tem nada de comum..."
26002-2013 = "Puxa..."
26002-2014 = "Humm, que problema..."
26002-2015 = "Onde será que eu errei...?"
26002-2016 = "É difícil perceber esse tipo de coisa sozinha, né...?"
26002-2017 = "Nesse caso, que tal me mostrar como você cozinha, Juri?"
26002-2018 = "Ah, muito obrigada! Posso te pedir isso mesmo?"
26002-2019 = "Se você observar, Sensei, talvez consiga descobrir a causa...!"
26002-2020 = "Então conto com você!"
26002-2021 = "Sensei, muito obrigada pelas suas opiniões hoje."
26002-2022 = "Ajudou demais!"
26002-2023 = "Graças a você entendi que o método de hoje é perigoso,"
26002-2024 = "então da próxima vez vou tentar um método diferente!"
26002-2025 = "E que tal tentar seguir a receita direitinho...?"
26002-2026 = "Os caminhos da culinária são infinitos!"
26002-2027 = "E acho que explorar esses caminhos é justamente um dos prazeres de cozinhar!"
26002-2028 = "Entendo, se divertir é importante mesmo. É..."
26002-2029 = "Levei bronca de novo..."
26002-2030 = "O que aconteceu desta vez?"
26002-2031 = "Hoje no almoço, o peixe sanma grelhado no sal que eu preparei acabou fugindo..."
26002-2032 = "Espera aí, o que foi que fugiu...?"
26002-2033 = "Hum, o sanma grelhado no sal..."
26002-2034 = "Como é que um peixe grelhado foge fisicamente?"
26002-2035 = "Hum, pois é..."
26002-2036 = "Para ser sincera, morro de vergonha de admitir, mas..."
26002-2037 = "Sabe..."
26002-2038 = "Acontece mais ou menos uma vez por semana..."
26002-2039 = "É meio constrangedor, não sei nem explicar..."
26002-2040 = "Então eles fogem com uma frequência bem regular, né?"
26002-2041 = "Por que será que sempre acontecem coisas assim quando eu cozinho?"
26002-2042 = "O que você acha, Sensei...?"
26002-2043 = "Que tal fazermos um experimento?"
26002-2044 = "Um experimento...?"
26002-2045 = "Para descobrir por que os pratos que a Juri faz ficam daquele jeito."
26002-2046 = "Controlamos as condições, fazemos testes e investigamos a causa."
26002-2047 = "Entendi..."
26002-2048 = "Se descobrirmos a causa, poderemos resolver o problema..."
26002-2049 = "Realmente, faz todo o sentido!"
26002-2050 = "Muito obrigada, conto com a sua ajuda!"
26002-2051 = "Poderia vir ao refeitório estudantil hoje? Muito obrigada!"
26002-260020010 = "Sensei, hum..."
26002-260020020 = "O que foi?"
26002-260020030 = "Levou bronca por alguma coisa de novo...?"
26002-260020040 = "Ah, não, desta vez não levei bronca nenhuma!"
26002-260020050 = "Pelo contrário, hoje eu mereço até elogios!"
26002-260020060 = "Afinal, hoje nenhuma panela explodiu ainda!"
26002-260020070 = "Isso... é ótimo, né...?"
26002-260020080 = "Sim, eu também estou evoluindo dia após dia!"
26002-260020090 = "Ah, e quanto ao motivo do contato..."
26002-260020100 = "Se não for incômodo, hum..."
26002-260020110 = "Você teria um tempinho neste fim de semana?"
26002-260020120 = "Vou à escola nesse dia para resolver coisas do Clube de Merenda Escolar,"
26002-260020130 = "e tem uma coisa que eu queria muito te mostrar, Sensei."
26002-260020140 = "Beleza, combinado."
26002-260020150 = "Muito obrigada!"
26002-260020160 = "Então estarei te esperando no refeitório!"
26002-260020170 = "Me desculpe pelo transtorno de hoje..."
26002-260020180 = "Imagina, não esquenta. Você está se sentindo bem? Será que foi por causa do sol forte?"
26002-260020190 = "Fisicamente eu estou ótima!"
26002-260020200 = "É que provavelmente, hum, pelo que ouvi dizer, talvez..."
26002-260020210 = "?"
26002-260020220 = "N-não, não é nada! Não se preocupe...!"
26002-260020230 = "E-eu ficaria muito feliz se você pudesse me ajudar de novo qualquer dia desses!"
26002-260020240 = "Da próxima vez, hum, um dia sem sol muito forte seria melhor para as condições..."
26002-260020250 = "Enfim, continuo contando com você!"
