[translation]
26011-260110010 = "Сенсей"
26011-260110020 = "Сенсей!"
26011-260110030 = "Здесь действительно здорово!"
26011-260110040 = "Сатен?"
26011-260110050 = "Ты что-то нашла?"
26011-260110060 = "Ах"
26011-260110070 = "Простите за внезапность!"
26011-260110080 = "Можете подойти сюда на минуту?"
26011-260110090 = "Хм-м"
26011-260110100 = "Странно."
26011-260110110 = "Я так долго искала, а..."
26011-260110120 = "Разве не рано сдаваться?"
26011-260110130 = "Если бы это было так легко найти, это не было бы «легендой»."
26011-260110140 = "Действительно..."
26011-260110150 = "Я не могу сдаться на полпути!"
26011-260110160 = "Тогда я напишу вам, если что-то найду!"
26011-260110170 = "Сенсей"
26011-260110180 = "Послушайте!"
26011-260110190 = "Я кое-что поняла!"
26011-260110200 = "Сатен...?"
26011-260110210 = "Что ты поняла?"
26011-260110220 = "Если можно,"
26011-260110230 = "мы не могли бы встретиться сейчас?"
26011-260110240 = "Хм-м"
26011-260110250 = "Всё-таки хотелось бы ещё немного поиграть."
26011-260110260 = "Чего-то не хватает..."
26011-260110270 = "Ты ведь увлеклась."
26011-260110280 = "Но игра уже закончилась..."
26011-260110290 = "А?"
26011-260110300 = "Правда?"
26011-260110310 = "Хм-м..."
26011-260110320 = "Ну, тогда... наверное, ладно."
26011-260110330 = "Сенсей"
26011-260110340 = "Я искала место, где можно отдохнуть,"
26011-260110350 = "и нашла отличное место."
26011-260110360 = "Хотите пойти со мной?"
26011-260110370 = "Конечно."
26011-260110380 = "Ты нашла что-то интересное?"
26011-260110390 = "Хе-хе"
26011-260110400 = "Ну вот..."
26011-260110410 = "Ух!"
26011-260110420 = "Отлично!"
26011-260110430 = "Мне нужно попробовать всё самой, иначе я не успокоюсь."
26011-260110440 = "Честно говоря, я удивлён."
26011-260110450 = "Может, ты была бейсболисткой?"
26011-260110460 = "Ну..."
26011-260110470 = "Не совсем..."
26011-260110480 = "Хм-м, если объяснять, выйдет долго."
26011-260110490 = "А, знаю..."
26011-260110500 = "Хе-хе"
26011-260110510 = "Скажем так, мы с битой друзья!"
26011-260110520 = "Всё-таки"
26011-260110530 = "не всегда получается, как хочешь."
26011-260110540 = "Но, впрочем,"
26011-260110550 = "я так и думала!"
26011-260110560 = "Что-то случилось?"
26011-260110570 = "...Сатен?"
26011-260110580 = "Ах"
26011-260110590 = "Ну..."
26011-260110600 = "Всё-таки"
26011-260110610 = "это не важно!"
26011-260110620 = "Ух!"
26011-260110630 = "Было весело!"
26011-260110640 = "Вы не думаете, что я стала лучше, чем в начале?"
26011-260110650 = "Во второй половине я уже лучше прицеливалась, почувствовала ритм!"
26011-260110660 = "Наверное, ты много тренировалась в отбивании."
26011-260110670 = "Упорство — это тоже талант."
26011-260110680 = "Ну что вы..."
26011-260110690 = "Говорите, как Сенсей."
26011-260110700 = "А, точно,"
26011-260110710 = "вы же Сенсей!"
26011-260110720 = "Аха-ха!"
26011-260110730 = "Спасибо вам, Сенсей!!"