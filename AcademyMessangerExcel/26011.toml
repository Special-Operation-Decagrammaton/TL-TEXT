[translation]
26011-260110010 = "Сенсей."
26011-260110020 = "Сенсей!"
26011-260110030 = "Потрясающе! Это место потрясающее!"
26011-260110040 = "Сатэн?"
26011-260110050 = "В смысле?"
26011-260110060 = "А..."
26011-260110070 = "Прости! Кажется, я немного перевозбудилась."
26011-260110080 = "Расскажу, что я имею в виду, когда ты придёшь!"
26011-260110090 = "Хм..."
26011-260110100 = "Как странно."
26011-260110110 = "Может, нам стоит сменить стратегию."
26011-260110120 = "Сдаваться ещё слишком рано."
26011-260110130 = "Если бы их было легко найти, они бы не стали легендами."
26011-260110140 = "Ну..."
26011-260110150 = "Да! Логично!"
26011-260110160 = "Хорошо! Я снова свяжусь с тобой, если что-нибудь найду!!"
26011-260110170 = "Хм..."
26011-260110180 = "Хорошо."
26011-260110190 = "Это слишком странно."
26011-260110200 = "Что именно?"
26011-260110210 = "Сатэн?"
26011-260110220 = "Сенсей..."
26011-260110230 = "Сейчас удобно встретиться?"
26011-260110240 = "Хм..."
26011-260110250 = "Не даёт мне покоя."
26011-260110260 = "Я только и думаю о том, как пройти ту игру..."
26011-260110270 = "Ты забыла о своей первоначальной цели..."
26011-260110280 = "По-моему, ты уже победила в той игре."
26011-260110290 = "А..."
26011-260110300 = "Правда?"
26011-260110310 = "Хм..."
26011-260110320 = "Теперь, когда ты сказал, наверное..."
26011-260110330 = "Пожалуй, да."
26011-260110340 = "Думаю, мне пора хорошенько отдохнуть."
26011-260110350 = "Я нашла идеальное место."
26011-260110360 = "Если ты не против, встретишься со мной там, Сенсей?"
26011-260110370 = "Конечно. Где оно?"
26011-260110380 = "Нашла какое-то интересное место?"
26011-260110390 = "А..."
26011-260110400 = "Ну, вообще-то..."
26011-260110410 = "Фух!"
26011-260110420 = "Как освежает! Хорошо, что я попробовала!"
26011-260110430 = "Я не могу выбросить подобные вещи из головы, пока сама не попробую."
26011-260110440 = "Я, если честно, удивлён."
26011-260110450 = "Ничего себе. Ты спортсменка?"
26011-260110460 = "Хи-хи!"
26011-260110470 = "Да ничего подобного."
26011-260110480 = "Вообще-то, это долгая история..."
26011-260110490 = "Хм."
26011-260110500 = "Можно сказать,"
26011-260110510 = "у меня было полно возможностей потренировать замах! Да, пусть будет так!"
26011-260110520 = "Неудивительно."
26011-260110530 = "Я надеялась, что у меня будет к этому талант..."
26011-260110540 = "Хотя..."
26011-260110550 = "В глубине души я знала, что так и будет!"
26011-260110560 = "А? Что-то не так?"
26011-260110570 = "...Сатэн?"
26011-260110580 = "А..."
26011-260110590 = "Я просто..."
26011-260110600 = "Эм..."
26011-260110610 = "Ничего страшного!"
26011-260110620 = "М-м!"
26011-260110630 = "Неплохо!"
26011-260110640 = "Разве я не стала лучше с прошлого раза?"
26011-260110650 = "Последние несколько ударов ведь были довольно чистыми, да?"
26011-260110660 = "Если подумать, это очень похоже на бейсбол."
26011-260110670 = "Говорят, талант зависит от настроя."
26011-260110680 = "Ещё раз!"
26011-260110690 = "Ты прямо как учитель говоришь."
26011-260110700 = "О..."
26011-260110710 = "Ты и есть учитель."
26011-260110720 = "Ха-ха!"
26011-260110730 = "Спасибо, Сенсей!!"
