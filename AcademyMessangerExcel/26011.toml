[translation]
26011-260110010 = "Sensei"
26011-260110020 = "Sensei!"
26011-260110030 = "Este lugar é mesmo incrível!"
26011-260110040 = "Saten?"
26011-260110050 = "Encontrou alguma coisa?"
26011-260110060 = "Ah"
26011-260110070 = "Desculpa mandar mensagem assim do nada!"
26011-260110080 = "Por enquanto, será que você pode vir até aqui?"
26011-260110090 = "Humm"
26011-260110100 = "Que estranho..."
26011-260110110 = "Depois de a gente procurar tanto..."
26011-260110120 = "Não é meio cedo para desistir?"
26011-260110130 = "Se fosse fácil de achar, não seria uma 'lenda', né?"
26011-260110140 = "Faz sentido..."
26011-260110150 = "Não posso desistir logo agora!"
26011-260110160 = "Bom, se eu encontrar alguma pista, entro em contato de novo!"
26011-260110170 = "Sensei"
26011-260110180 = "Escuta só!"
26011-260110190 = "Descobri uma coisa!"
26011-260110200 = "Saten...?"
26011-260110210 = "O que você descobriu?"
26011-260110220 = "Se você estiver livre,"
26011-260110230 = "podemos nos encontrar agora?"
26011-260110240 = "Humm~"
26011-260110250 = "Quer saber? Eu queria ter rebatido mais um pouco."
26011-260110260 = "Fiquei com gostinho de quero mais..."
26011-260110270 = "Você estava super empolgada mesmo, né?"
26011-260110280 = "Acho que a partida já estava mais do que decidida..."
26011-260110290 = "Ué"
26011-260110300 = "Você acha?"
26011-260110310 = "Humm..."
26011-260110320 = "Nesse caso... acho que posso me dar por satisfeita!"
26011-260110330 = "Sensei"
26011-260110340 = "Eu estava procurando algo para espairecer"
26011-260110350 = "e acabei encontrando o lugar perfeito!"
26011-260110360 = "Que tal ir lá comigo?"
26011-260110370 = "Claro, vamos sim."
26011-260110380 = "Encontrou alguma coisa interessante?"
26011-260110390 = "Hehe"
26011-260110400 = "Acontece que..."
26011-260110410 = "Ufa!"
26011-260110420 = "Deu pra lavar a alma!"
26011-260110430 = "Eu sou do tipo que não sossega enquanto não testa tudo na prática!"
26011-260110440 = "Para ser sincero, fiquei impressionado."
26011-260110450 = "Por acaso você era jogadora de beisebol?"
26011-260110460 = "Hum..."
26011-260110470 = "Não é bem isso, mas..."
26011-260110480 = "Puxa, se eu for explicar vai dar uma longa história..."
26011-260110490 = "Já sei..."
26011-260110500 = "Hehe"
26011-260110510 = "Digamos que eu tenho uma ótima amizade com tacos de beisebol!"
26011-260110520 = "É..."
26011-260110530 = "As coisas não saem como a gente espera, né?"
26011-260110540 = "Mas tudo bem,"
26011-260110550 = "eu já imaginava que fosse ser assim!"
26011-260110560 = "Aconteceu alguma coisa?"
26011-260110570 = "...Saten?"
26011-260110580 = "Ah~"
26011-260110590 = "Hum..."
26011-260110600 = "Deixa pra lá,"
26011-260110610 = "não é nada demais!"
26011-260110620 = "Ufa~!"
26011-260110630 = "Foi muito divertido~!"
26011-260110640 = "Você não acha que eu melhorei bastante em comparação ao começo?"
26011-260110650 = "Na segunda metade o agrupamento dos tiros ficou bem melhor, peguei o jeito da coisa!"
26011-260110660 = "Nas rebatidas você também deve ter se esforçado bastante para chegar àquele nível."
26011-260110670 = "A persistência também é um talento."
26011-260110680 = "Olha só~"
26011-260110690 = "Falando igualzinho a um professor..."
26011-260110700 = "Quer dizer,"
26011-260110710 = "você é mesmo um professor, né!"
26011-260110720 = "Ahaha!"
26011-260110730 = "Muito obrigada, Sensei!!"
