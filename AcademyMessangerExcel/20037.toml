[translation]
20037-200370010 = "Инспектор! Инспектор!"
20037-200370020 = "Вы где сейчас? Заняты?"
20037-200370030 = "Инспектор...?"
20037-200370040 = "Я сейчас просто отдыхаю."
20037-200370050 = "Не думайте о мелочах!"
20037-200370060 = "Немедленно приходите на фуд-корт, пожалуйста!"
20037-200370070 = "Это срочно. На кону безопасность людей! Пожалуйста, быстрее!"
20037-200370080 = "...?"
20037-200370090 = "Сегодня у меня лучшие обязанности."
20037-200370100 = "Я патрулирую весь парк."
20037-200370110 = "Разве ты не ненавидишь много ходить, Фубуки?"
20037-200370120 = "О чём вы? Патрулирование — краеугольный камень обязанностей спасателя."
20037-200370130 = "Конечно я в восторге — ведь я спасатель, который следит за безопасностью людей."
20037-200370140 = "Что-то тут подозрительно."
20037-200370150 = "Эй! Не будьте таким злым!"
20037-200370160 = "Я буду старательно патрулировать парк, кружить и кружить."
20037-200370170 = "Кружить... и кружить?"
20037-200370180 = "Вы такой злой, Сенсей..."
20037-200370190 = "Заставляете меня патрулировать... пешком!"
20037-200370200 = "Вообще-то именно так ты и должна была делать с самого начала..."
20037-200370210 = "Вы так говорите, будто это я заставила вас делать лишнюю работу!"
20037-200370220 = "Вы знаете, что солнечный свет может сделать с таким нежным студентом, как я?"
20037-200370230 = "Наверное, вкусное мороженое, которое вы потом мне купили, всё компенсирует."
20037-200370240 = "..."
20037-200370250 = "Да... пожалуй, время от времени я могу выдержать честное патрулирование, если оно с вами, Сенсей."
20037-200370260 = "Я наконец-то нашла рай!"
20037-200370270 = "Место, где можно отдохнуть и никто не будет мешать..."
20037-200370280 = "Наконец-то смогу расслабиться, и никто не нарушит мой покой!"
20037-200370290 = "Ты нашла место, где можно спрятаться?"
20037-200370300 = "Похоже, ты нашла место, где можно побездельничать."
20037-200370310 = "Хотите зайти, Сенсей?"
20037-200370320 = "Но в воду нельзя."
20037-200370330 = "Не хочу следить ещё за одним гостем."
20037-200370340 = "Запрещать мне лезть в воду в аквапарке..."
