[translation]
20037-200370010 = "Инспектор!"
20037-200370020 = "Где вы сейчас? Заняты?"
20037-200370030 = "Инспектор...?"
20037-200370040 = "Отдыхаю."
20037-200370050 = "Неважно!"
20037-200370060 = "Срочно приходите в фуд-корт в парке."
20037-200370070 = "Это касается безопасности граждан! Быстрее!"
20037-200370080 = "...?"
20037-200370090 = "Сегодняшнее задание — патрулирование парка."
20037-200370100 = "Звучит довольно весело, правда?"
20037-200370110 = "Ты же не любишь работать, Фубуки...?"
20037-200370120 = "Что вы говорите, Сенсей."
20037-200370130 = "Мы же должны защищать людей, так что я с радостью этим занимаюсь."
20037-200370140 = "Что-то подозрительно..."
20037-200370150 = "Всё в порядке, я буду серьёзной."
20037-200370160 = "И буду ходить кругами по парку."
20037-200370170 = "Кругами...?"
20037-200370180 = "Как жестоко, Сенсей..."
20037-200370190 = "Вы заставляете меня ходить пешком."
20037-200370200 = "Ты преувеличиваешь."
20037-200370210 = "Это же твоя работа?"
20037-200370220 = "Летнее солнце — мой главный враг!"
20037-200370230 = "Но мороженое, которым вы угостили, было вкусным."
20037-200370240 = "Если я с вами,"
20037-200370250 = "то иногда можно и серьёзно патрулировать."
20037-200370260 = "Я нашла свой собственный рай."
20037-200370270 = "Место, где меня никто не побеспокоит..."
20037-200370280 = "Теперь я могу спокойно отдыхать."
20037-200370290 = "Ты что, устроила тайник?"
20037-200370300 = "Нашла место для прогулов."
20037-200370310 = "Хотите посмотреть, Сенсей?"
20037-200370320 = "Но не заходите в бассейн, ладно?"
20037-200370330 = "Больше объектов для наблюдения — больше хлопот."
20037-200370340 = "Хотя это же водный парк...?"