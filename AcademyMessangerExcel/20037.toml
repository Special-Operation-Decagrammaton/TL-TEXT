[translation]
20037-200370010 = "Inspetor!"
20037-200370020 = "Onde você tá agora? Tá ocupado?"
20037-200370030 = "Inspetor...?"
20037-200370040 = "Tô de bobeira aqui"
20037-200370050 = "Deixa os detalhes pra lá!"
20037-200370060 = "Vem urgente pra praça de alimentação do parque"
20037-200370070 = "É uma questão de segurança pública! Vem rápido!"
20037-200370080 = "...?"
20037-200370090 = "Disseram que a missão de hoje é patrulhar o parque"
20037-200370100 = "Não parece bem divertido?"
20037-200370110 = "Mas você não detestava trabalhar, Fubuki...?"
20037-200370120 = "Que isso, Sensei, do que você tá falando?"
20037-200370130 = "É pra proteger a segurança das pessoas, claro que eu faço com o maior prazer"
20037-200370140 = "Sei não, tem caroço nesse angu..."
20037-200370150 = "Relaxa, relaxa, vou trabalhar direitinho, juro"
20037-200370160 = "Enquanto dou umas voltas boiando pelo parque"
20037-200370170 = "Dando voltas boiando...?"
20037-200370180 = "Que maldade, Sensei..."
20037-200370190 = "Me fazer patrulhar a pé de verdade..."
20037-200370200 = "Que exagero"
20037-200370210 = "Esse já não era o seu trabalho desde o começo?"
20037-200370220 = "Mas o sol de verão é meu maior inimigo!"
20037-200370230 = "Bom, pelo menos o sorvete que você me pagou tava uma delícia"
20037-200370240 = "E se for junto com você, Sensei"
20037-200370250 = "Talvez patrulhar a sério de vez em quando não seja tão ruim assim"
20037-200370260 = "Encontrei o meu próprio paraíso particular"
20037-200370270 = "Um refúgio de paz, onde ninguém vai me incomodar..."
20037-200370280 = "Agora finalmente vou poder ficar de boa do meu jeito"
20037-200370290 = "Montou um esconderijo?"
20037-200370300 = "Achou um cantinho pra matar serviço, né?"
20037-200370310 = "Quer vir ver também, Sensei?"
20037-200370320 = "Ah, mas não entra na piscina, tá?"
20037-200370330 = "Porque se tiver mais gente pra eu vigiar, vai dar mó trabalho"
20037-200370340 = "Em pleno parque aquático...?"
