[translation]
20046-200460010 = "Здравствуйте."
20046-200460020 = "Желаю вам дальнейшего процветания."
20046-200460030 = "Благодарю за ваше неизменное внимание."
20046-200460040 = "Что-то я растерялся от такой реакции."
20046-200460050 = "Ния потеряла память...!?"
20046-200460060 = "Ня-ха-ха! Может, я немного переборщила с шалостью?"
20046-200460070 = "Ня-ха-ха! Как и ожидалось от Сенсея, отличная реакция♪"
20046-200460080 = "Я подумала, что хотя бы формально нужно поздороваться."
20046-200460090 = "Я так и знал!"
20046-200460100 = "Кстати, Сенсей"
20046-200460110 = "Симпатичная-пресимпатичная ученица в беде..."
20046-200460120 = "Не хотите её спасти?"
20046-200460130 = "Что случилось?"
20046-200460140 = "Нехорошее предчувствие..."
20046-200460150 = "Ня-ха~"
20046-200460160 = "Понимаете, случилась небольшая неприятность..."
20046-200460170 = "Меня кто-то преследует."
20046-200460180 = "Ня-ха~"
20046-200460190 = "Благодаря вам сегодня я избежала наказания~"
20046-200460200 = "Как и ожидалось от надёжного взрослого♪"
20046-200460210 = "Если есть вы, Сенсей, всё уладится."
20046-200460220 = "Не стоит слишком часто прогуливать."
20046-200460230 = "Не заставляй своих младших волноваться."
20046-200460240 = "Ня-ха♪"
20046-200460250 = "Ния?"
20046-200460260 = "Ня-ха-ха-ха~"
20046-200460270 = "Эм~ Сенсей~?"
20046-200460280 = "Мне очень неловко говорить это, но..."
20046-200460290 = "На самом деле... опять случилась ужасная неприятность~"
20046-200460300 = "Не могли бы вы прийти в клубную комнату?"
20046-200460310 = "Я дважды не попадусь на одну и ту же уловку."
20046-200460320 = "Использовать тот же метод – смело..."
20046-200460330 = "Ой-ой... Вот как..."
20046-200460340 = "Значит, вы тоже больше не верите мне..."
20046-200460350 = "Но если никто не поможет, это, в конце концов, моя собственная вина..."
20046-200460360 = "Прошу прощения, до свидания."
20046-200460370 = "Подожди, это правда!?"
20046-200460380 = "Я сейчас приду!!"
20046-200460390 = "И всё же"
20046-200460400 = "Я же делаю то, что должна, правда?"
20046-200460410 = "Врёшь"
20046-200460420 = "Правда?"
20046-200460430 = "А Кахо..."
20046-200460440 = "Я так и знала!"
20046-200460450 = "Какой бы ни был процесс, если работа сделана, это одно и то же."
20046-200460460 = "Мне правда везёт~ Ня-ха-ха-ха~!"
20046-200460470 = "На помощь~"
20046-200460480 = "Опять произошло нечто ужасное..."
20046-200460490 = "Так как объяснить в письме сложно,"
20046-200460500 = "я бы хотела, чтобы вы пришли в клубную комнату."
20046-200460510 = "Я тоже умею учиться."
20046-200460520 = "Говорят, что если случилось дважды, случится и в третий раз."
20046-200460530 = "Я не попадусь на одну уловку трижды."
20046-200460540 = "Ния?"
20046-200460550 = "Э, правда...?"
20046-200460560 = "Ну~"
20046-200460570 = "Всё-таки Сенсей, когда нужно, вы действуете."
20046-200460580 = "Ты как следует осознала свою ошибку?"
20046-200460590 = "Да~"
20046-200460600 = "Более чем."
20046-200460610 = "...Вам нужно ещё раз меня отчитать?"
20046-200460620 = "Хия"
20046-200460630 = "...Нет, то есть, Хяккияко всегда ждёт вашего визита, Сенсей♪"
20046-200460640 = "Эм~"
20046-200460650 = "Вы действительно придёте~?"
20046-200460660 = "Да."
20046-200460670 = "Именно так."
20046-200460680 = "Я слышала, вы в последнее время очень заняты~"
20046-200460690 = "Может, вам лучше сосредоточиться на работе?"
20046-200460700 = "Это тоже работа Сенсея."
20046-200460710 = "Выбор между нотацией и поглаживанием..."
20046-200460720 = "Ваши инь и ян такие крайние."
20046-200460730 = "Почему ты не сказала честно?"
20046-200460740 = "Я мог бы помочь."
20046-200460750 = "Ну-ну, что вы говорите."
20046-200460760 = "Повторяю, я ничего не делала~?"
20046-200460770 = "Вы инициировали официальное заявление о создании клуба «Внештатные»," 
20046-200460780 = "познакомили торговую ассоциацию с клубом оригами,"
20046-200460790 = "и выделили клубу «Внештатные» помещение в городе, верно?"
20046-200460800 = "Ня?"
20046-200460810 = "Ня-ха~ вот это сюрприз."
20046-200460820 = "Вы могли бы стать писателем, Сенсей."
20046-200460830 = "В час встречи с демонами. Молодая луна висит на краю замковой башни, но народ глуп и не боится демонов."
20046-200460840 = "Это предвещает упадок Небесной воли, зловещий знак."
20046-200460850 = "Ния?"
20046-200460860 = "Это древняя легенда. Предание, а не история, вымысел, а не правда."
20046-200460870 = "Однако, разве можно бояться произнести имя демона?"
20046-200460880 = "Что это значит...?"
20046-200460890 = "Всё просто, Сенсей."
20046-200460900 = "Почему демонов боятся. Почему мы носим имя «Процессия демонов»."
20046-200460910 = "Я решила напомнить об этом Кивотосу."
20046-200460920 = "Ночь только начинается."
20046-200460930 = "Тот план по завоеванию Кивотоса, о котором я сказала, что это шутка,"
20046-200460940 = "он на самом деле настоящий~"
20046-200460950 = "?"
20046-200460960 = "Может, это такая «неожиданная развязка», когда ложь оказалась правдой?"
20046-200460970 = "Даже сейчас по моему слову армия Хяккияко может двинуться~"
20046-200460980 = "А может, и нет~?"
20046-200460990 = "Это уж точно ложь!"
20046-200461000 = "Ведь это шутка...?"
20046-200461010 = "Ня-ха-ха♪"
20046-200461020 = "Всё-таки вы интересный человек, Сенсей."
20046-200461030 = "Сенсей - не игрушка."
20046-200461040 = "Не стоит играть с Сенсеем."
20046-200461050 = "Ня-ха-ха!"
20046-200461060 = "Как вы меня оцениваете,"
20046-200461070 = "это уже ваше дело, не так ли?"
20046-200461080 = "Я, как всегда, плыву по течению."
20046-200461090 = "Опять меня внезапно позовут..."
20046-200461100 = "Чувствуется приближение хлопот..."
20046-200461110 = "В этом и состоит обычность♪"
20046-200461120 = "Ня-ха♪"