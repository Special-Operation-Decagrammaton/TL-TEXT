[translation]
20046-200460010 = "Я всегда у вас в долгу, Сенсей из Шале."
20046-200460020 = "Это Амачи Ния, президент Клуба Инь-Ян."
20046-200460030 = "Пусть у меня много недостатков, надеюсь на наше сотрудничество."
20046-200460040 = "Что здесь происходит...?"
20046-200460050 = "Ты память потеряла?!?!"
20046-200460060 = "Ньяхаха! Просто немного пошалила!"
20046-200460070 = "Ньяхаха! Как всегда, у вас лучшие реакции!"
20046-200460080 = "Первое приветствие должно звучать официально, знаете ли! Поэтому в этот раз я постаралась!"
20046-200460090 = "Я так и знал, что ты издеваешься!"
20046-200460100 = "В любом случае, Сенсей из Шале,"
20046-200460110 = "вы ведь широко известны тем, что не можете игнорировать"
20046-200460120 = "своих милых и очаровательных студентов, верно?"
20046-200460130 = "Что-то случилось?"
20046-200460140 = "Зловещее вступление..."
20046-200460150 = "Ньяха! Дело в том..."
20046-200460160 = "у меня есть небольшая проблема."
20046-200460170 = "Меня преследуют!!"
20046-200460180 = "Ньяха..."
20046-200460190 = "Спасибо, что помогли мне избежать того разноса!"
20046-200460200 = "Как и ожидалось от надёжного взрослого!"
20046-200460210 = "Когда вы рядом, всё всегда решается!"
20046-200460220 = "Не пытайся сейчас это провернуть..."
20046-200460230 = "Перестань постоянно заставлять младших волноваться."
20046-200460240 = "Ньяхаха..."
20046-200460250 = "И это твой ответ...?"
20046-200460260 = "Ньяхаха..."
20046-200460270 = "Эм, Сенсей."
20046-200460280 = "Я прекрасно понимаю, что с прошлого кризиса прошло совсем немного времени..."
20046-200460290 = "Я оказалась в затруднении."
20046-200460300 = "Но сможете прийти в клубную комнату Клуба Инь-Ян?"
20046-200460310 = "Во второй раз я на это не куплюсь."
20046-200460320 = "Взять и применить точно тот же приём..."
20046-200460330 = "Понятно. Я понимаю."
20046-200460340 = "Если даже вы мне не доверяете..."
20046-200460350 = "Значит, проблема явно во мне и моём поведении. Наверное, это и есть карма..."
20046-200460360 = "Прошу прощения."
20046-200460370 = "Подожди, ты серьёзно?!"
20046-200460380 = "Сейчас буду!"
20046-200460390 = "Сенсей."
20046-200460400 = "Как бы это ни выглядело, всё, что нужно сделать, всегда делается."
20046-200460410 = "Э."
20046-200460420 = "Правда?"
20046-200460430 = "Кахо."
20046-200460440 = "Так это не ты!"
20046-200460450 = "Какая разница кто, если всё сделано...?"
20046-200460460 = "Ага. Мне везёт! Ньяхаха!"
20046-200460470 = "Сенсей...?"
20046-200460480 = "Ну... у меня настоящая проблема."
20046-200460490 = "По сообщениям подробности рассказать не могу."
20046-200460500 = "Просто встретьтесь со мной по этому адресу."
20046-200460510 = "К сожалению, у людей есть такая штука, как «способность учиться»."
20046-200460520 = "В третий раз я не попадусь!!"
20046-200460530 = "Серьёзно."
20046-200460540 = "Ния?"
20046-200460550 = "Уже иду!"
20046-200460560 = "Ого..."
20046-200460570 = "Когда вы кого-то отчитываете, вы и правда страшный."
20046-200460580 = "Ты осознала свои поступки?"
20046-200460590 = "Да-да!"
20046-200460600 = "На 1000000% да."
20046-200460610 = "...Я снова тебя отругаю."
20046-200460620 = "Ак"
20046-200460630 = "...Мы в Хяккияко всегда с нетерпением ждём визитов уважаемого Сенсея из Шале."
20046-200460640 = "Эм..."
20046-200460650 = "Вы правда сюда приедете...?"
20046-200460660 = "Да."
20046-200460670 = "Именно."
20046-200460680 = "Разве вы не завалены работой по уши?"
20046-200460690 = "Вам стоит меньше проводить времени со мной и сосредоточиться на ней..."
20046-200460700 = "Ты и есть моя работа."
20046-200460710 = "Ах, какая тирания..."
20046-200460720 = "Приходится выбирать между тем, чтобы ругать или хвалить..."
20046-200460730 = "Почему ты просто не можешь быть со мной честной?"
20046-200460740 = "Я бы помог, если бы ты сказала."
20046-200460750 = "Хм, что именно вы имеете в виду?"
20046-200460760 = "Мне не нравятся эти обвинения, особенно когда я ничего не сделала!"
20046-200460770 = "Ты предупредила Моурё об официальной заявке на создание клуба,"
20046-200460780 = "познакомила гильдию торговцев с искусством оригами"
20046-200460790 = "и выделила Клубу статистов клубную комнату в центре города, верно?"
20046-200460800 = "Нья"
20046-200460810 = "Ньяхаха... Какую историю вы рассказываете!"
20046-200460820 = "Знаете, я удивлена."
20046-200460830 = "Когда сумерки воцаряются безраздельно,"
20046-200460840 = "над хребтами Тэнсюкаку висит молодая луна. Глупы люди, предающиеся страху перед призраками. Тёмное знамение, предвещающее упадок небесного мандата."
20046-200460850 = "Ния?"
20046-200460860 = "Старая история. Скорее фольклор, чем история. Прошлое превращается в вымысел."
20046-200460870 = "Да, когда люди пытаются говорить о призраках, язык словно тяжелеет."
20046-200460880 = "Я вообще не понимаю, о чём ты."
20046-200460890 = "Всё просто, Сенсей."
20046-200460900 = "Причина, по которой люди боятся призраков, причина, по которой Хяккияко называют «Парадом призраков»."
20046-200460910 = "Я решила напомнить Кивотосу о давно забытых воспоминаниях."
20046-200460920 = "Ночь только началась."
20046-200460930 = "Сенсей, я солгала насчёт планов захватить Кивотос."
20046-200460940 = "Или... всё это правда! Хи-хи"
20046-200460950 = "?"
20046-200460960 = "Величайший сюжетный поворот: ложь оказалась ложью."
20046-200460970 = "Даже сейчас силы Хяккияко могут выступить по одному моему приказу."
20046-200460980 = "А может, и нет!"
20046-200460990 = "Нет, вот это уже ложь!"
20046-200461000 = "Зачем ты меня разыгрываешь...?"
20046-200461010 = "Ну...?"
20046-200461020 = "Потому что весело?"
20046-200461030 = "Ты меня до сердечного приступа доведёшь!"
20046-200461040 = "Я тебе не игрушка!"
20046-200461050 = "Ньяхаха, ага, вы правы."
20046-200461060 = "Что касается того, как вы относитесь к этому своему проблемному студенту,"
20046-200461070 = "я оставлю это вам,"
20046-200461080 = "а сама, как обычно, просто поплыву по течению."
20046-200461090 = "Твоё «как обычно» не внушает уверенности..."
20046-200461100 = "Ты опять полезешь не в своё дело!"
20046-200461110 = "Ньяхаха!"
20046-200461120 = "Я просто буду делать то же, что делала всегда."
