[translation]
20046-200460010 = "Prezado Senhor,"
20046-200460020 = "Faço votos de que esta mensagem o encontre em plena saúde e prosperidade."
20046-200460030 = "Agradeço imensamente pela vossa contínua e inestimável consideração..."
20046-200460040 = "Assim você me deixa sem saber como responder"
20046-200460050 = "A Niya perdeu a memória...?!"
20046-200460060 = "Nyahaha! Será que exagerei um pouquinho na brincadeira?"
20046-200460070 = "Nyahaha! Como esperado de você, Sensei, ótima reação♪"
20046-200460080 = "Pensei em mandar pelo menos um cumprimento formal, só por educação"
20046-200460090 = "Eu sabia que tinha coisa aí!"
20046-200460100 = "Por falar nisso, Sensei..."
20046-200460110 = "Uma aluna fofa, mas muuuuito fofa mesmo, está em apuros..."
20046-200460120 = "Não está com vontade de vir salvá-la?"
20046-200460130 = "Aconteceu alguma coisa?"
20046-200460140 = "Estou com um mau pressentimento..."
20046-200460150 = "Nyaha~"
20046-200460160 = "Na verdade, me meti numa situação um pouquiiinho complicada..."
20046-200460170 = "Tem alguém me perseguindo neste exato momento, sabe?"
20046-200460180 = "Nyaha~"
20046-200460190 = "Graças a você, hoje me livrei de levar sermão~"
20046-200460200 = "Isso que é um adulto de confiança♪"
20046-200460210 = "Quando o Sensei está por perto, tudo se resolve na maior paz, né?"
20046-200460220 = "Vê se maneira na hora de matar trabalho"
20046-200460230 = "Não deixe as suas calouras tão preocupadas assim"
20046-200460240 = "Nyaha♪"
20046-200460250 = "Niya?"
20046-200460260 = "Nyahahaha~"
20046-200460270 = "Hum~ Sensei~?"
20046-200460280 = "É meio difícil de dizer isso, mas..."
20046-200460290 = "Na verdade... eu acabei me metendo numa encrenca beeem grande de novo~"
20046-200460300 = "Você poderia vir até a sala do clube?"
20046-200460310 = "Não vou cair no mesmo truque duas vezes"
20046-200460320 = "Tentar aplicar o mesmo golpe seguido é muita audácia..."
20046-200460330 = "Ora, ora... Entendo..."
20046-200460340 = "Então nem você acredita mais em mim, Sensei..."
20046-200460350 = "Mas acho que ficar sem a ajuda de ninguém é só eu colhendo o que plantei..."
20046-200460360 = "Perdoe o incômodo. Adeus"
20046-200460370 = "Espera, era verdade mesmo?!"
20046-200460380 = "Tô indo pra aí agora!!"
20046-200460390 = "Mesmo parecendo assim,"
20046-200460400 = "eu faço o meu trabalho direitinho quando precisa, viu?"
20046-200460410 = "Mentira sua"
20046-200460420 = "Jura mesmo?"
20046-200460430 = "Quer dizer, a Kaho faz"
20046-200460440 = "Eu sabia!"
20046-200460450 = "Não importa o processo, se o trabalho fica pronto no final dá na mesma, não acha?"
20046-200460460 = "Eu sou mesmo uma garota de muita sorte~ Nyahahaha~!"
20046-200460470 = "Socorrooo~"
20046-200460480 = "Acabei me metendo em outra situação terrível..."
20046-200460490 = "É meio difícil explicar por mensagem,"
20046-200460500 = "então se pudesse vir até a sala do clube..."
20046-200460510 = "Eu também aprendo com os meus erros, sabia?"
20046-200460520 = "Dizem que o que acontece duas vezes acontece três, né..."
20046-200460530 = "Não vou cair na mesma conversa três vezes seguidas"
20046-200460540 = "Niya?"
20046-200460550 = "Espera, é sério mesmo...?"
20046-200460560 = "Puxa vida~"
20046-200460570 = "Realmente, quando você resolve agir, não brinca em serviço, né, Sensei?"
20046-200460580 = "Refletiu direitinho sobre o que fez?"
20046-200460590 = "Siiim~"
20046-200460600 = "E como refleti, de sobra"
20046-200460610 = "...Ou será que ainda preciso de mais um sermão?"
20046-200460620 = "Hya!"
20046-200460630 = "...Quer dizer, Hyakkiyako está sempre de portas abertas esperando a sua visita, Sensei♪"
20046-200460640 = "Hum~"
20046-200460650 = "Você vem mesmo me ver~?"
20046-200460660 = "Uhum"
20046-200460670 = "Isso mesmo"
20046-200460680 = "Ouvi dizer que você anda bem ocupado ultimamente~"
20046-200460690 = "Não seria melhor focar mais no seu trabalho~?"
20046-200460700 = "Mas isso também faz parte do trabalho do Sensei"
20046-200460710 = "Me dar só duas opções, entre levar sermão ou ganhar cafuné..."
20046-200460720 = "O seu Yin e Yang são bem extremos, hein, Sensei?"
20046-200460730 = "Por que não me contou a verdade desde o começo?"
20046-200460740 = "Eu poderia ter ajudado"
20046-200460750 = "Ora, ora, do que será que você está falando?"
20046-200460760 = "Já disse várias vezes que eu não fiz nadinha~!"
20046-200460770 = "Você incentivou o Clube de Figurantes a fazer o registro oficial de clube,"
20046-200460780 = "apresentou o Clube de Origami para a Associação de Comerciantes,"
20046-200460790 = "e alocou a sala do Clube de Figurantes bem no meio da cidade, não foi?"
20046-200460800 = "Nyap@[;:"
20046-200460810 = "Nyaha~ Essa me pegou de surpresa"
20046-200460820 = "Com uma imaginação dessas, você já pode até virar escritor de romances, Sensei"
20046-200460830 = "É a hora do crepúsculo. A lua nova paira na ponta da torre do castelo, mas o povo tolo já não teme os Oni"
20046-200460840 = "Isto nada mais é que o presságio nefasto do declínio do mandato divino"
20046-200460850 = "Niya?"
20046-200460860 = "É um conto ancestral. Mais lenda que história, mais ficção que verdade"
20046-200460870 = "Contudo, como ousariam não hesitar ao invocar o nome dos Oni?"
20046-200460880 = "O que isso quer dizer...?"
20046-200460890 = "É muito simples, Sensei"
20046-200460900 = "Por que os Oni são temidos? E por que carregamos o nome da 'Procissão Noturna dos Cem Demônios'?"
20046-200460910 = "Pensei em fazer toda Kivotos se lembrar disso mais uma vez"
20046-200460920 = "A noite apenas começou"
20046-200460930 = "Sabe aquele plano de conquista de Kivotos que eu disse antes que era mentira?"
20046-200460940 = "Na verdade, era tudo verdade, viu~"
20046-200460950 = "?"
20046-200460960 = "Tipo uma reviravolta na trama, onde a parte de dizer que era mentira é que era a mentira?"
20046-200460970 = "Basta uma palavra minha agora mesmo para que todas as forças de Hyakkiyako entrem em marcha~"
20046-200460980 = "...Ou talvez não~?"
20046-200460990 = "Isso sim é mentira com certeza!"
20046-200461000 = "É mentira, né...?"
20046-200461010 = "Nyahaha♪"
20046-200461020 = "Você é mesmo muito divertido, Sensei"
20046-200461030 = "O Sensei não é brinquedo"
20046-200461040 = "Pare de tirar onda com o Sensei"
20046-200461050 = "Nyahaha!"
20046-200461060 = "Como você decide me avaliar"
20046-200461070 = "depende inteiramente de você, não é, Sensei?"
20046-200461080 = "Eu só sigo o fluxo, como sempre faço"
20046-200461090 = "Lá vem você me chamar do nada de novo..."
20046-200461100 = "Sinto cheiro de problema vindo aí..."
20046-200461110 = "Incluindo essa parte, está tudo como sempre♪"
20046-200461120 = "Nyaha♪"
