[translation]
10064-100640010 = "Я тут подумала... Наверное, пора купить новое кимоно."
10064-100640020 = "То, что я ношу, уже слишком износилось."
10064-100640030 = "У тебя есть своё кимоно, Каёко?"
10064-100640040 = "Да. Конечно, не какое-то роскошное."
10064-100640050 = "Но до того, как я вступила в Решатели проблем, мне приходилось посещать много официальных мероприятий."
10064-100640060 = "Так что было логично иметь своё."
10064-100640070 = "Что это были за мероприятия, для которых тебе требовалось кимоно...?"
10064-100640080 = "Хи-хи."
10064-100640090 = "Расскажу позже, если дойдут руки."
10064-100640100 = "Сенсей, что ты обычно делаешь в канун Нового года?"
10064-100640110 = "Ем новогоднюю лапшу."
10064-100640120 = "Смотрю новогодние спецвыпуски."
10064-100640130 = "Наверное, звучит не так уж плохо, ха-ха."
10064-100640140 = "Я всегда хожу в храм слушать новогодний звон колоколов."
10064-100640150 = "Мне нравится, потому что его можно услышать только раз в году."
10064-100640160 = "Поэтому он особенный. В этом есть что-то... романтичное."
10064-100640170 = "Так что я хочу спросить, Сенсей."
10064-100640180 = "Хочешь в этом году послушать новогодний звон вместе со мной?"
10064-100640190 = "Я нашла отличное место. Оно не очень известное, но говорят, колокола там очень красивые."
10064-100640200 = "Звучит хорошо. Пойдём!"
10064-100640210 = "ОК. Встретимся вечером перед станцией."
10064-100640220 = "Новый год..."
10064-100640230 = "Я собираюсь в ближайший храм за амулетами для остальных членов Решателей проблем."
10064-100640240 = "Можно взять один и для тебя, Сенсей?"
10064-100640250 = "Какой амулет тебе нужен?"
10064-100640260 = "На удачу в гаче!"
10064-100640270 = "На увеличение крит. урона!"
10064-100640280 = "Эм..."
10064-100640290 = "Не уверен, что такие продаются..."
10064-100640300 = "Шучу!"
10064-100640310 = "Вообще-то я сама хотела посмотреть амулеты."
10064-100640320 = "Не хочешь встретиться и пройтись по магазинам вместе?"
10064-100640330 = "Конечно."
10064-100640340 = "Тогда завтра утром встретимся перед храмом."
10064-100640350 = "Сенсей, я видела, как ты раньше бегал по городу. Ты выглядел напряжённым."
10064-100640360 = "Что-то случилось?"
10064-100640370 = "Много всего произошло..."
10064-100640380 = "Накопилась куча проблем..."
10064-100640390 = "Серьёзно? Сразу после Нового года?"
10064-100640400 = "Ты и правда постоянно занят."
10064-100640410 = "Если думаешь, что поможет,"
10064-100640420 = "я могу одолжить тебе музыку для расслабления."
10064-100640430 = "Спасибо! В следующий раз воспользуюсь предложением."
