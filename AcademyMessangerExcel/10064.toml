[translation]
10064-100640010 = "Acho que já está na hora de comprar um quimono novo."
10064-100640020 = "Faz um bom tempo que não troco o meu."
10064-100640030 = "Não sabia que você tinha um quimono próprio, Kayoko."
10064-100640040 = "Sim, não é nada muito caro, mas..."
10064-100640050 = "Antes de entrar para o Faz-Tudo, eu costumava ir bastante a lugares mais formais..."
10064-100640060 = "Então pelo menos um quimono de visita eu tinha."
10064-100640070 = "Que lugares formais seriam esses...?"
10064-100640080 = "Hehe."
10064-100640090 = "Se surgir a oportunidade, eu te conto."
10064-100640100 = "O que você costuma fazer na virada de ano, Sensei?"
10064-100640110 = "Acho que fico comendo sobá da virada."
10064-100640120 = "Costumo ficar assistindo aos especiais de fim de ano na TV."
10064-100640130 = "Hehe, nada mal também."
10064-100640140 = "Eu costumo ir ao templo ouvir os sinos da virada de ano."
10064-100640150 = "Gosto do fato de que só dá para ouvi-los nesse dia."
10064-100640160 = "Tem um certo charme, né?"
10064-100640170 = "Falando nisso, Sensei..."
10064-100640180 = "Não quer passar a virada deste ano comigo ouvindo os sinos do templo?"
10064-100640190 = "Ouvi dizer que tem um lugarzinho secreto que é ótimo para isso."
10064-100640200 = "Boa ideia, vamos sim."
10064-100640210 = "Combinado. No dia, nos encontramos em frente à estação."
10064-100640220 = "Como o ano acabou de começar,"
10064-100640230 = "estou pensando em comprar amuletos de Ano Novo para o pessoal do Faz-Tudo em um templo aqui perto."
10064-100640240 = "Vou comprar um para você também, Sensei."
10064-100640250 = "Que tipo de amuleto você quer?"
10064-100640260 = "Um amuleto para tirar SSR no gacha!"
10064-100640270 = "Um amuleto que aumente meu Dano Crítico!"
10064-100640280 = "Huum..."
10064-100640290 = "Será que vendem um amuleto desses...?"
10064-100640300 = "Brincadeira."
10064-100640310 = "Eu também queria escolher um para você, Kayoko."
10064-100640320 = "Se quiser, vamos comprar juntos."
10064-100640330 = "Combinado."
10064-100640340 = "Então, amanhã de manhã, na frente do templo."
10064-100640350 = "Eu vi você correndo todo atarefado logo no Ano Novo, Sensei..."
10064-100640360 = "Aconteceu alguma coisa?"
10064-100640370 = "O ano mal começou e já teve um monte de confusão..."
10064-100640380 = "Surgiu um incidente logo no feriado de Ano Novo..."
10064-100640390 = "Ter que trabalhar pesado até numa época dessas..."
10064-100640400 = "Sua rotina continua puxada como sempre, hein, Sensei."
10064-100640410 = "Se você quiser,"
10064-100640420 = "na próxima vez te empresto um CD ótimo para relaxar."
10064-100640430 = "Obrigado, vou aceitar sim."
