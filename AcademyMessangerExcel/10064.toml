[translation]
10064-100640010 = "Наверное, пора обновить кимоно."
10064-100640020 = "Давно не покупала новое."
10064-100640030 = "У тебя есть своё кимоно, Кайоко?"
10064-100640040 = "Да, не очень дорогое, но есть."
10064-100640050 = "До того как я вступила в контору, я часто бывала в официальных местах..."
10064-100640060 = "Так что у меня было хотя бы одно выходное кимоно."
10064-100640070 = "В официальных местах — это где же..."
10064-100640080 = "Фуфу."
10064-100640090 = "Если будет возможность, расскажу."
10064-100640100 = "Сенсей, как вы обычно проводите Новый год?"
10064-100640110 = "Наверное, ем новогоднюю лапшу."
10064-100640120 = "Или смотрю праздничные передачи."
10064-100640130 = "Фуфу, это тоже неплохо."
10064-100640140 = "А я слушаю новогодние колокола в храме."
10064-100640150 = "Мне нравится, что их можно услышать только в этот день."
10064-100640160 = "В этом есть что-то романтичное."
10064-100640170 = "И вот, Сенсей."
10064-100640180 = "Не хотите ли встретить Новый год вместе со мной, слушая колокола?"
10064-100640190 = "Говорят, есть одно малоизвестное хорошее место."
10064-100640200 = "Отличная идея, пойдём."
10064-100640210 = "Тогда встречаемся в день праздника у вокзала."
10064-100640220 = "Новый год уже начался."
10064-100640230 = "Я хочу купить обереги для всех в конторе в ближайшем храме."
10064-100640240 = "Принесу и вам, Сенсей."
10064-100640250 = "Какой оберег хотите?"
10064-100640260 = "Оберег, чтобы выпадала SSR в гаче!"
10064-100640270 = "Оберег, повышающий критический урон!"
10064-100640280 = "Хм-м..."
10064-100640290 = "Продаются ли такие обереги..."
10064-100640300 = "Шучу."
10064-100640310 = "Я бы хотела выбрать оберег вместе с тобой, Кайоко."
10064-100640320 = "Если хочешь, давай сходим вместе."
10064-100640330 = "Хорошо."
10064-100640340 = "Тогда завтра утром у храма."
10064-100640350 = "Я видела вас, Сенсей, бегающим с самого Нового года..."
10064-100640360 = "Что-то случилось?"
10064-100640370 = "Сразу после Нового года столько суеты..."
10064-100640380 = "Случилось происшествие..."
10064-100640390 = "Даже в такое время вы заняты..."
10064-100640400 = "Как всегда, у вас много дел, Сенсей."
10064-100640410 = "Если хотите,"
10064-100640420 = "я могу одолжить вам диск с расслабляющей музыкой."
10064-100640430 = "Спасибо, я, наверное, попрошу."
