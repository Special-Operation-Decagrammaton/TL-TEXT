[translation]
20018-200180010 = "Quanto tempo, Sensei."
20018-200180020 = "Ouvi dizer que você estava me procurando..."
20018-200180030 = "O que rolou?"
20018-200180040 = "Olá, Moe."
20018-200180050 = "Desculpa incomodar, mas queria pedir uma ajudinha sua. Você está livre agora?"
20018-200180060 = "Ajudar você, Sensei? Por mim tudo bem, mas..."
20018-200180070 = "Que coisa rara você me pedir ajuda."
20018-200180080 = "Ah, não estou reclamando, não. Só estou sentindo o cheirinho de algum incidente bem divertido... Kuhihi."
20018-200180090 = "Bom, vou me preparando aqui, então."
20018-200180100 = "Sensei, fiquei sabendo de um boato..."
20018-200180110 = "É verdade que todos os dados do computador de trabalho da Schale foram apagados?"
20018-200180120 = "Kuhihi... É verdade, sim..."
20018-200180130 = "Sim, agora está tudo acabado... Kuhihi..."
20018-200180140 = "Eita... Você está rindo igualzinho a mim, Sensei."
20018-200180150 = "Parece que a coisa foi feia mesmo."
20018-200180160 = "Bom, quando você chegar aqui vai entender..."
20018-200180170 = "Beleza, então passo aí na Schale logo depois do almoço."
20018-200180180 = "Sensei, sabia dessa?"
20018-200180190 = "Sabe aquelas tampas de proteção que colocam em cima de interruptores e botões?\nO nome daquilo é \"Molly-guard\"."
20018-200180200 = "E sabe por que recebeu esse nome?"
20018-200180210 = "Dizem que foi inventada porque uma garotinha chamada Molly vivia tentando apertar o botão de emergência sem parar."
20018-200180220 = "Não diga."
20018-200180230 = "Que curiosidade interessante."
20018-200180240 = "Toda vez que ouço essa história, fico meio chateada, sabe?"
20018-200180250 = "Se eu tivesse nascido antes da Molly..."
20018-200180260 = "Será que hoje em dia a tampa de segurança se chamaria \"Moe-guard\"...?"
20018-200180270 = "Olha, não acho que seja uma homenagem das mais honrosas..."
20018-200180280 = "Huum, foi mal, Sensei..."
20018-200180290 = "Você pode dar um pulinho aqui no Parque Kousagi?"
20018-200180300 = "Posso sim, mas..."
20018-200180310 = "O que aconteceu assim do nada?"
20018-200180320 = "Os suprimentos extras que encomendei outro dia acabaram de chegar aqui no parque."
20018-200180330 = "Mas as outras meninas saíram todas em missão, então sobrou pra eu organizar tudo sozinha..."
20018-200180340 = "Carregar um monte de caixas pesadas já é um saco... mas deixando isso de lado..."
20018-200180350 = "O problema é que tem um monte de bombas altamente inflamáveis e perigosas no meio..."
20018-200180360 = "Tô indo praí agora mesmo."
20018-200180370 = "Sensei, você estava no parque de Shiratori ontem?"
20018-200180380 = "Tive a impressão de ter visto você correndo por lá..."
20018-200180390 = "Você também estava lá, Moe?"
20018-200180400 = "Devia ter me chamado!"
20018-200180410 = "Achei que você estivesse em horário de trabalho, por isso nem chamei..."
20018-200180420 = "Então não tinha problema falar com você?"
20018-200180430 = "Claro que não. Comecei a correr recentemente."
20018-200180440 = "Ficar sentado o dia inteiro faz mal para a saúde, afinal."
20018-200180450 = "Aaah, te entendo."
20018-200180460 = "Ficar sentada direto deixa a gente corcunda e dá uma dor nos ombros, né?"
20018-200180470 = "Eu sei que manter a postura correta é importante, mas..."
20018-200180480 = "Se quiser, que tal fazer exercício comigo também, Moe?"
20018-200180490 = "Sensei, você não esqueceu que eu sou uma agente de forças especiais, né?"
20018-200180500 = "Por mais que não pareça, eu sou da SRT, tá? Eu treino todos os dias."
20018-200180510 = "Bom, perto da Saki e da Miyako eu não faço quase nada, mas..."
20018-200180520 = "Correr junto com você, Sensei... Parece meio destrutivo, que tal?"
