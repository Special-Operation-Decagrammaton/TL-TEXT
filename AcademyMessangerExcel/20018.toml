[translation]
20018-200180010 = "Давно не виделись, Сенсей."
20018-200180020 = "Некоторые члены отряда сказали, что ты меня искал..."
20018-200180030 = "Что происходит?"
20018-200180040 = "Привет, Моэ."
20018-200180050 = "Извини, можешь помочь?"
20018-200180060 = "Конечно могу, но..."
20018-200180070 = "никогда бы не подумал, что тебе понадобится моя помощь."
20018-200180080 = "Да ничего серьёзного. Просто чувствую, что может произойти что-нибудь интересное."
20018-200180090 = "Тогда подготовлюсь."
20018-200180100 = "Сенсей, я слышала от другого студента..."
20018-200180110 = "Правда, что рабочий компьютер в Шале потерял все данные?"
20018-200180120 = "Хи-хи-хи... Ага..."
20018-200180130 = "Всё кончено... Хи-хи-хи..."
20018-200180140 = "Ого, Сенсей смеётся прямо как я."
20018-200180150 = "Наверное, проблема действительно серьёзная."
20018-200180160 = "Поймёшь, когда придёшь..."
20018-200180170 = "Хорошо. Во второй половине дня буду в Шале."
20018-200180180 = "Знаешь что, Сенсей?"
20018-200180190 = "Защитную крышку над переключателем или кнопкой часто называют «Molly-guard»."
20018-200180200 = "У этого названия есть своя история."
20018-200180210 = "Её придумали потому, что девочка по имени Молли постоянно пыталась нажать аварийный выключатель."
20018-200180220 = "Понятно."
20018-200180230 = "Интересно."
20018-200180240 = "Если подумать, немного обидно."
20018-200180250 = "Если бы я родилась раньше Молли,"
20018-200180260 = "весь мир называл бы защитную крышку «Moe-guard»."
20018-200180270 = "Не уверен, что это было бы почётным титулом..."
20018-200180280 = "Хм, прости, Сенсей..."
20018-200180290 = "Можешь прийти в парк Коусаги?"
20018-200180300 = "Я не против, но..."
20018-200180310 = "Что случилось?"
20018-200180320 = "Дополнительные припасы, которые я заказывала, прибыли в парк."
20018-200180330 = "Остальные члены отряда сейчас на операции, поэтому мне придётся разбирать всё самой..."
20018-200180340 = "Там много тяжёлых вещей, их трудно двигать."
20018-200180350 = "Но что важнее, там много взрывчатки..."
20018-200180360 = "Я уже иду."
20018-200180370 = "Сенсей, ты ведь был прошлой ночью в парке района Ширатори?"
20018-200180380 = "Кажется, я видела, как ты бежал, когда гуляла."
20018-200180390 = "А! Ты меня там видела?!"
20018-200180400 = "Попался..."
20018-200180410 = "Почему ты так смущаешься?"
20018-200180420 = "Я думала, ты просто был там по работе. Хи-хи, это было что-то личное?"
20018-200180430 = "В последнее время я бегаю по вечерам."
20018-200180440 = "От работы тело затекло, вот я и решил размяться."
20018-200180450 = "А-а-а-а, понимаю."
20018-200180460 = "От печати на клавиатуре шея и плечи реально забиваются. Даже лечь нормально не хочется."
20018-200180470 = "Да. Хорошую осанку поддерживать трудно..."
20018-200180480 = "Хм, хочешь присоединиться ко мне на тренировках?"
20018-200180490 = "Хи-хи, за кого ты меня принимаешь?"
20018-200180500 = "Я понимаю, что только что говорила, но я всё-таки член SRT."
20018-200180510 = "Я тоже тренируюсь! Просто не так, как Саки и Мияко..."
20018-200180520 = "Но всё равно бегать вместе с Сенсеем звучит довольно опасно."
