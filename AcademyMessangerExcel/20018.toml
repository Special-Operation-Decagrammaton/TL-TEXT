[translation]
20018-200180010 = "Сенсей, давно не виделись."
20018-200180020 = "Я слышала, что вы меня искали..."
20018-200180030 = "Что случилось?"
20018-200180040 = "Здравствуй, Моэ."
20018-200180050 = "Извини, мне нужна твоя помощь, ты сейчас свободна?"
20018-200180060 = "Помочь вам? В принципе, можно..."
20018-200180070 = "Но это редкость, Сенсей просит о помощи."
20018-200180080 = "А, ничего серьёзного. Просто чувствую, что будет что-то интересное... Ку-хи-хи."
20018-200180090 = "Тогда я подготовлюсь."
20018-200180100 = "Сенсей, я кое-что слышала..."
20018-200180110 = "Правда, что все данные на рабочем компьютере Шале стёрты?"
20018-200180120 = "Ку-хи-хи... так и есть..."
20018-200180130 = "Да, теперь всё кончено... Ку-хи-хи..."
20018-200180140 = "Ух... Сенсей смеётся как я."
20018-200180150 = "Это, похоже, довольно серьёзно."
20018-200180160 = "Ну, когда придёшь, поймёшь..."
20018-200180170 = "Хорошо, тогда я зайду в Шале около полудня."
20018-200180180 = "Сенсей, знаете?"
20018-200180190 = "Есть такие защитные крышки, которые ставят на выключатели и кнопки.\nОни называются «Защита Молли»."
20018-200180200 = "А знаете, почему у них такое название?"
20018-200180210 = "Потому что одна девочка по имени Молли постоянно пыталась нажать аварийную кнопку, и для неё придумали эту защиту."
20018-200180220 = "Вот как."
20018-200180230 = "Интересная история."
20018-200180240 = "Каждый раз, когда я слышу эту историю, мне становится немного обидно."
20018-200180250 = "Если бы я родилась раньше Молли,"
20018-200180260 = "то сейчас защита называлась бы «Защита Моэ»..."
20018-200180270 = "Но это ведь не очень почётное название..."
20018-200180280 = "Хм, прости, Сенсей..."
20018-200180290 = "Не могла бы ты прийти в Парк кроликов?"
20018-200180300 = "Могу, но..."
20018-200180310 = "Что случилось?"
20018-200180320 = "Недавно заказанные припасы доставили в парк."
20018-200180330 = "Но все сейчас на задании, и мне одной нужно всё разобрать..."
20018-200180340 = "Ну, двигать тяжёлые коробки одной не очень, но это ладно."
20018-200180350 = "Там много опасных, легковоспламеняющихся бомб..."
20018-200180360 = "Я сейчас приду."
20018-200180370 = "Сенсей, вы вчера были в парке Сиратори?"
20018-200180380 = "Мне показалось, я видел вас бегущим..."
20018-200180390 = "И Моэ тоже была там."
20018-200180400 = "Могла бы подойти и поздороваться."
20018-200180410 = "Я подумал, что вы заняты, и не стал вас отвлекать..."
20018-200180420 = "А можно было подойти?"
20018-200180430 = "Конечно. Я недавно начал бегать по утрам."
20018-200180440 = "Сидячий образ жизни вреден."
20018-200180450 = "А, понимаю."
20018-200180460 = "Если долго сидеть, начинаешь сутулиться, и плечи болят."
20018-200180470 = "Я знаю, что правильная осанка важна, но..."
20018-200180480 = "Моэ, если хочешь, присоединяйся к тренировкам?"
20018-200180490 = "Сенсей, вы забыли, что я специальный боец?"
20018-200180500 = "Я же член SRT. Я тренируюсь каждый день."
20018-200180510 = "Но по сравнению с Саки и Мияко я, конечно, не дотягиваю."
20018-200180520 = "Но бегать вместе с вами... это, наверное, будет катастрофа?"