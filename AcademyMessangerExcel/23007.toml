[translation]
23007-230070010 = "Сенсей. Это Ханако."
23007-230070020 = "Кажется, я впервые пишу вам вот так."
23007-230070030 = "Спасибо, что нашли время."
23007-230070040 = "Насчёт дополнительных занятий..."
23007-230070050 = "я хочу кое-что спросить."
23007-230070060 = "У вас есть минутка?"
23007-230070070 = "Конечно."
23007-230070080 = "Какой?"
23007-230070090 = "Хи-хи."
23007-230070100 = "Спасибо."
23007-230070110 = "Хи-хи."
23007-230070120 = "Эм... Я спрошу, когда вы придёте."
23007-230070130 = "Я буду ждать вас, Сенсей."
23007-230070140 = "Огромное спасибо за сегодня, Сенсей."
23007-230070150 = "Благодаря вам у меня был прекрасный день."
23007-230070160 = "Это был всего лишь дополнительный урок..."
23007-230070170 = "Хи-хи."
23007-230070180 = "..."
23007-230070190 = "Понятно."
23007-230070200 = "Вы сейчас свободны, Сенсей?"
23007-230070210 = "Я оказалась в небольшой передряге и подумала, что вы могли бы помочь."
23007-230070220 = "Что такое?"
23007-230070230 = "Что-то случилось?"
23007-230070240 = "Хм."
23007-230070250 = "Наверное. Я заперта в спортзале..."
23007-230070260 = "Дверь открывается снаружи, так что вам просто нужно прийти и выпустить меня."
23007-230070270 = "Это не проблема?"
23007-230070280 = "Я уже иду."
23007-230070290 = "Не волнуйся. Сейчас буду."
23007-230070300 = "...Хи-хи."
23007-230070310 = "Спасибо. Я буду ждать."
23007-230070320 = "Сенсей."
23007-230070330 = "Где вы, Сенсей?"
23007-230070340 = "Вы слушаете? Огромное спасибо за сегодня. Мне стало гораздо легче."
23007-230070350 = "Не знаю, как вы к этому отнесётесь, но..."
23007-230070360 = "..."
23007-230070370 = "Я говорю искренне."
23007-230070380 = "Сенсей? Это Ханако."
23007-230070390 = "После занятий я собираюсь купить вещи, нужные"
23007-230070400 = "Клубу дополнительных занятий."
23007-230070410 = "Пойдёте со мной?"
23007-230070420 = "Тебе нужно что-то купить?"
23007-230070430 = "Да."
23007-230070440 = "Ты пойдёшь в обычной одежде?"
23007-230070450 = "Да, верно."
23007-230070460 = "Хорошо. Тогда я пойду с тобой."
23007-230070470 = "Спасибо."
23007-230070480 = "Я буду ждать вас у ворот №5 после занятий."
23007-230070490 = "Сенсей."
23007-230070500 = "Можно отправить новые носки к вам в офис?"
23007-230070510 = "Не надо!"
23007-230070520 = "Сенсей?"
23007-230070530 = "Сегодня"
23007-230070540 = "..."
23007-230070550 = "...?"
23007-230070560 = "Ханако?"
23007-230070570 = "Хи-хи."
23007-230070580 = "..."
23007-230070590 = "Неважно."
23007-230070600 = "Вообще-то..."
23007-230070610 = "Не переживай."
23007-230070620 = "О, Сенсей."
23007-230070630 = "До меня дошли кое-какие слухи."
23007-230070640 = "Правда, что вы скоро посетите Тринити?"
23007-230070650 = "Да, но..."
23007-230070660 = "От кого ты это услышала?"
23007-230070670 = "Хи-хи."
23007-230070680 = "Если мне повезёт,"
23007-230070690 = "я смогу увидеть вас во время визита."
23007-230070700 = "О, я не собираюсь ничего навязывать."
23007-230070710 = "Но если немного повезёт,"
23007-230070720 = "наши пути, надеюсь, пересекутся."
23007-230070730 = "Сенсей, вы нормально вернулись?"
23007-230070740 = "Надеюсь, в следующий ваш визит"
23007-230070750 = "у нас будет больше времени вместе."
23007-230070760 = "Так что"
23007-230070770 = "как всегда..."
23007-230070780 = "я буду ждать."
