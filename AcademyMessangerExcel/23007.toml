[translation]
23007-230070010 = "Здравствуйте, Сенсей."
23007-230070020 = "Это Ханако. Мы впервые общаемся в сообщениях."
23007-230070030 = "Буду рада сотрудничеству и впредь."
23007-230070040 = "Итак, по делу."
23007-230070050 = "Я хотела бы попросить о дополнительных занятиях, вернее, у меня есть вопрос."
23007-230070060 = "Можно попросить вас уделить мне немного времени?"
23007-230070070 = "Конечно, всё в порядке."
23007-230070080 = "Какой вопрос?"
23007-230070090 = "Хе-хе"
23007-230070100 = "Спасибо вам."
23007-230070110 = "Хе-хе"
23007-230070120 = "Это... я скажу, когда мы встретимся."
23007-230070130 = "Тогда я буду ждать вас, Сенсей."
23007-230070140 = "Большое спасибо за сегодня, Сенсей."
23007-230070150 = "Благодаря вам мне было весело."
23007-230070160 = "Дополнительные занятия были весёлыми...?"
23007-230070170 = "Хе-хе"
23007-230070180 = "...Да, конечно."
23007-230070190 = "Это были весёлые дополнительные занятия...♡"
23007-230070200 = "Сенсей, у вас сейчас есть время?"
23007-230070210 = "У меня возникла небольшая проблема, и мне нужна ваша помощь..."
23007-230070220 = "Проблема?"
23007-230070230 = "Что случилось?"
23007-230070240 = "Как бы сказать..."
23007-230070250 = "Я не могу выбраться из спортзала..."
23007-230070260 = "Дверь открывается только снаружи, так что если вы сможете прийти, я буду очень признательна."
23007-230070270 = "Вы сможете помочь...?"
23007-230070280 = "Я сейчас приду."
23007-230070290 = "Хорошо, я иду, постарайся успокоиться."
23007-230070300 = "...Хе-хе, хорошо."
23007-230070310 = "Спасибо вам, я буду ждать."
23007-230070320 = "Сенсей"
23007-230070330 = "Куда же вы ушли после того, как открыли дверь...?"
23007-230070340 = "В любом случае, большое спасибо за сегодня."
23007-230070350 = "Я не знаю, что вы думаете, но..."
23007-230070360 = "..."
23007-230070370 = "Это сказано от всего сердца."
23007-230070380 = "Сенсей, это Ханако."
23007-230070390 = "Сегодня после уроков"
23007-230070400 = "я собираюсь купить кое-что для клуба дополнительных занятий."
23007-230070410 = "Не хотите пойти со мной?"
23007-230070420 = "Это что-то обычное?"
23007-230070430 = "Да, обычное."
23007-230070440 = "И мы пойдём в обычной одежде?"
23007-230070450 = "Да, в обычной."
23007-230070460 = "Тогда с удовольствием."
23007-230070470 = "Спасибо вам."
23007-230070480 = "Тогда после уроков у пятой калитки."
23007-230070490 = "Сенсей"
23007-230070500 = "Носки лучше отправить в Шале?"
23007-230070510 = "Не нужно!!"
23007-230070520 = "Сенсей?"
23007-230070530 = "Сегодня"
23007-230070540 = "ну..."
23007-230070550 = "...?"
23007-230070560 = "Ханако?"
23007-230070570 = "..."
23007-230070580 = "Хе-хе"
23007-230070590 = "Прошу прощения."
23007-230070600 = "Ничего, не обращайте внимания."
23007-230070610 = "Пожалуйста, не беспокойтесь."
23007-230070620 = "Хе-хе, Сенсей"
23007-230070630 = "Я слышала разговор."
23007-230070640 = "Говорят, у вас дела в Тринити?"
23007-230070650 = "Ну, да..."
23007-230070660 = "...Откуда ты узнала?"
23007-230070670 = "Хе-хе, откуда же♡"
23007-230070680 = "В любом случае, если повезёт,"
23007-230070690 = "мы могли бы встретиться."
23007-230070700 = "Но это не обещание?"
23007-230070710 = "Случайность."
23007-230070720 = "Я имею в виду, что хотела бы увидеться, если представится возможность."
23007-230070730 = "Сенсей, вы благополучно добрались?"
23007-230070740 = "Когда вы в следующий раз придёте,"
23007-230070750 = "было бы хорошо, если бы у вас было больше времени."
23007-230070760 = "Тогда..."
23007-230070770 = "как обычно,"
23007-230070780 = "буду рада♡"