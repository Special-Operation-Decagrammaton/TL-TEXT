[translation]
23007-230070010 = "Olá, Sensei."
23007-230070020 = "Aqui é a Hanako. É a primeira vez que trocamos mensagens assim, não é?"
23007-230070030 = "Mais uma vez, espero que possamos nos dar muito bem daqui para frente."
23007-230070040 = "Bom, quanto ao assunto..."
23007-230070050 = "Digamos que eu gostaria de pedir uma aula de recuperação, ou melhor, tenho uma dúvida."
23007-230070060 = "Será que você poderia me ceder um tempinho?"
23007-230070070 = "Claro, sem problemas."
23007-230070080 = "Que tipo de dúvida?"
23007-230070090 = "Hehe"
23007-230070100 = "Muito obrigada."
23007-230070110 = "Hehe"
23007-230070120 = "Isso... eu te conto quando nos encontrarmos."
23007-230070130 = "Então estarei te esperando, Sensei."
23007-230070140 = "Muito obrigada mesmo por hoje, Sensei."
23007-230070150 = "Graças a você, eu me diverti muito."
23007-230070160 = "Você se divertiu... na aula de recuperação...?"
23007-230070170 = "Hehe"
23007-230070180 = "...Mas é claro."
23007-230070190 = "Foi uma aula de recuperação... muito divertida♡"
23007-230070200 = "Sensei, você tem um tempinho agora?"
23007-230070210 = "Acabei ficando em uma situação meio complicada e gostaria da sua ajuda..."
23007-230070220 = "Situação complicada?"
23007-230070230 = "O que aconteceu?"
23007-230070240 = "Como posso explicar..."
23007-230070250 = "Digamos que eu acabei ficando presa dentro do depósito do ginásio..."
23007-230070260 = "Como a porta é daquelas que só abrem pelo lado de fora, eu agradeceria muito se você pudesse vir aqui."
23007-230070270 = "Poderia me fazer esse favor...?"
23007-230070280 = "Estou indo agora mesmo."
23007-230070290 = "Entendi, vou correndo pra aí, então mantenha a calma e me espere."
23007-230070300 = "...Hehe, está bem."
23007-230070310 = "Muito obrigada, estarei te esperando."
23007-230070320 = "Sensei"
23007-230070330 = "Até onde você foi correndo depois daquilo...?"
23007-230070340 = "De todo modo, muito obrigada mesmo por hoje."
23007-230070350 = "Não sei o que você deve estar pensando, Sensei, mas..."
23007-230070360 = "..."
23007-230070370 = "Essas palavras vêm do fundo do meu coração, viu?"
23007-230070380 = "Sensei, é a Hanako."
23007-230070390 = "Hoje depois da aula,"
23007-230070400 = "vou sair para comprar algumas coisas necessárias para as atividades do Clube de Aulas de Recuperação."
23007-230070410 = "Gostaria de ir comigo?"
23007-230070420 = "São coisas normais, né?"
23007-230070430 = "Sim, coisas perfeitamente normais."
23007-230070440 = "E você vai vestida normalmente, né?"
23007-230070450 = "Sim, vestida normalmente."
23007-230070460 = "Nesse caso, vou com prazer."
23007-230070470 = "Muito obrigada."
23007-230070480 = "Então estarei te esperando em frente ao portão 5 depois da aula."
23007-230070490 = "Sensei"
23007-230070500 = "Prefere que eu envie as meias para a Schale?"
23007-230070510 = "Não precisa!!"
23007-230070520 = "Sensei?"
23007-230070530 = "Hoje"
23007-230070540 = "Hum"
23007-230070550 = "...?"
23007-230070560 = "Hanako?"
23007-230070570 = "..."
23007-230070580 = "Hehe"
23007-230070590 = "Me desculpe."
23007-230070600 = "Não é nada, perdoe o incômodo."
23007-230070610 = "Por favor, não se preocupe."
23007-230070620 = "Hehe, Sensei."
23007-230070630 = "Fiquei sabendo da novidade."
23007-230070640 = "Soube que você tem assuntos a tratar na Trinity, não é?"
23007-230070650 = "Bom, tenho sim, mas..."
23007-230070660 = "...Onde você ouviu isso?"
23007-230070670 = "Hehe, onde será?♡"
23007-230070680 = "De qualquer forma, se tivermos sorte,"
23007-230070690 = "seria ótimo se pudéssemos nos encontrar."
23007-230070700 = "Ah, mas isso não é uma promessa, viu?"
23007-230070710 = "É só que, se por acaso"
23007-230070720 = "surgir a oportunidade, eu adoraria te ver."
23007-230070730 = "Sensei, conseguiu voltar em segurança?"
23007-230070740 = "Da próxima vez que vier nos visitar,"
23007-230070750 = "seria bom se tivéssemos um pouquinho mais de tempo livre, né?"
23007-230070760 = "E quando esse dia chegar..."
23007-230070770 = "Vamos fazer como sempre."
23007-230070780 = "Conto com você♡"
