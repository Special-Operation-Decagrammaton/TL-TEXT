[translation]
23004-1582 = "Sensei, vi que você estava lendo um catálogo de papelaria super concentrado agora há pouco..."
23004-1583 = "Está precisando de alguma coisa?"
23004-1584 = "Estava pensando em encomendar um porta-canetas novo."
23004-1585 = "Se for um formato simples assim, acho mais rápido a gente fabricar no clube. Que tal?"
23004-1586 = "Dá pra fazer tão fácil assim?"
23004-1587 = "Claro. E ainda por cima mais leve e resistente do que os vendidos por aí."
23004-1588 = "Como temos o material bem aqui, quer que eu faça um pra você?"
23004-1589 = "Sim, acho que vou aceitar a oferta."
23004-1590 = "Certo, então passa na oficina do Clube de Engenharia daqui a mais ou menos 1 hora."
23004-1591 = "Sensei, parece que a luz do banheiro da Schale queimou."
23004-1592 = "Apertei o interruptor, mas a lâmpada não acendeu."
23004-1593 = "Ah, é mesmo? Obrigado por avisar. Preciso chamar um eletricista..."
23004-1594 = "Tranquilo, parece que foi só um fio que se rompeu, então deve ser fácil de consertar."
23004-1595 = "Onde fica o alicate de crimpagem? Eu mesma conserto."
23004-1596 = "Não temos ferramentas tão específicas assim aqui na Schale..."
23004-1597 = "...Não tem? Nem umzinho?"
23004-1598 = "...Entendo."
23004-1599 = "Sensei, conforme o combinado, hoje à tarde irei à Schale para o meu plantão."
23004-1600 = "Desculpa, surgiu um imprevisto e talvez eu não esteja na Schale à tarde."
23004-1601 = "Ah, é? Bom, fazer o quê, acontece."
23004-1602 = "Tem alguma coisa que você queira que eu deixe pronta enquanto estiver fora?"
23004-1603 = "Talvez chegue uma encomenda à tarde, pode receber pra mim?"
23004-1604 = "Encomenda? O que é?"
23004-1605 = "Encomendei um cão-robô."
23004-1606 = "Hoh, um cão-robô, é...?"
23004-1607 = "...Só por precaução, não vá dissecar ele, hein?"
23004-1608 = "...Utaha?"
23004-1609 = "Sensei, já terminei o conserto daquela bicicleta que você me pediu outro dia."
23004-1610 = "Na próxima vez que vier à Millennium, pode passar no Clube de Engenharia para buscá-la?"
23004-1611 = "Uau, que rápido!"
23004-1612 = "Não esperava menos de uma Meister da Millennium!"
23004-1613 = "Bom, mesmo que não fosse eu, um reparo desse nível não tem nada de complicado."
23004-1614 = "Se você tentar consertar sozinho da próxima vez, Sensei, com certeza vai ver como é."
23004-1615 = "Na verdade, eu preferia ficar do seu lado vendo você consertar, Utaha."
23004-1616 = "Não sei se é uma boa ideia... Tem muitas coisas perigosas na oficina."
23004-1617 = "Além disso, consertar é só repetição de trabalho braçal. Não acho que seja muito interessante de assistir."
23004-1618 = "Eu prometo que fico quietinho~"
23004-1619 = "Falando assim feito criança..."
23004-1620 = "De qualquer forma, não tenho nada para consertar agora... então fica para uma próxima oportunidade."
23004-1621 = "Por sinal, agorinha mesmo lá no bicicletário, o Rai-chan estava se mexendo de um jeito estranho sozinho."
23004-1622 = "O quê?! O Rai-chan?!?!"
23004-1623 = "Parece que a marca 'Serval' vai lançar um novo modelo de luvas de trabalho em breve."
23004-1624 = "As da 'Manaslu' que comprei antes eram um pouco grossas demais, então veio em boa hora."
23004-1625 = "Pensando bem, Utaha, você usa luvas o tempo todo até dentro de lugares fechados, né?"
23004-1626 = "Existe algum motivo especial de Meister para isso?"
23004-1627 = "Não é nada tão grandioso, é só que meus dedos não são muito apresentáveis para os outros."
23004-1628 = "Por mexer com óleo e metal desde sempre, estão longe de ser bonitos."
23004-1629 = "É só por isso mesmo."
23004-230040010 = "Sensei"
23004-230040020 = "Tem um tempinho hoje?"
23004-230040030 = "Tenho sim. Aconteceu alguma coisa?"
23004-230040040 = "Estou pensando em renovar algumas ferramentas."
23004-230040050 = "Tem uma loja especializada em ferramentas da qual sou cliente fiel."
23004-230040060 = "Se você quiser, pensei em te apresentar o lugar."
23004-230040070 = "Com todo o prazer!"
