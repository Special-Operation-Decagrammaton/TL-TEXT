[translation]
23004-1582 = "Я видела, как вы раньше листали каталог оптового магазина канцтоваров..."
23004-1583 = "Тебе что-нибудь нужно?"
23004-1584 = "Я хочу заказать новые подставки для карандашей."
23004-1585 = "Если это всего лишь подставка, разве не быстрее напечатать её на 3D-принтере в клубной комнате?"
23004-1586 = "На 3D-принтере можно сделать подставку для карандашей?"
23004-1587 = "Конечно! И она будет легче и прочнее большинства магазинных."
23004-1588 = "У меня даже материалы есть. Сделать вам одну?"
23004-1589 = "Было бы здорово."
23004-1590 = "Хорошо! Приходите в мастерскую Инженерного отдела примерно через час."
23004-1591 = "Кажется, в туалете офиса Шале перегорела лампочка, Сенсей."
23004-1592 = "Я щёлкнула выключателем, но ничего не произошло."
23004-1593 = "Правда? Нужно вызвать мастера."
23004-1594 = "Всё нормально. Просто провода отсоединились, это легко исправить."
23004-1595 = "Где у вас соединительные гильзы для проводов? Я починю."
23004-1596 = "В Шале ничего такого нет..."
23004-1597 = "В Шале нет ни одной соединительной гильзы?"
23004-1598 = "Правда?"
23004-1599 = "Сенсей, я рассчитываю на вас при составлении расписания активности студентов сегодня после обеда."
23004-1600 = "Прости, мне нужно уехать из города, так что сегодня после обеда меня в Шале не будет."
23004-1601 = "Правда? Ну, значит, ничего не поделаешь."
23004-1602 = "Есть что-нибудь, что мне сделать, пока вас не будет?"
23004-1603 = "Сегодня после обеда должна прийти посылка. Можешь забрать её за меня."
23004-1604 = "Что за посылка?"
23004-1605 = "Я заказал игрушечную собаку для игровой комнаты Шале."
23004-1606 = "Хи-хи. Игрушечную собаку..."
23004-1607 = "Эм... Наверное, вы и так не станете, но, пожалуйста, не открывайте посылку, ладно?"
23004-1608 = "Утаха?"
23004-1609 = "Сенсей, колесо велосипеда полностью починено."
23004-1610 = "В следующий раз, когда будете в Миллениуме, зайдите в Инженерный отдел."
23004-1611 = "Быстрее, чем я ожидал."
23004-1612 = "Иного от мастера Миллениума и не ждёшь!"
23004-1613 = "Для любого в Миллениуме это пустяк."
23004-1614 = "Увидите, когда сами попробуете."
23004-1615 = "Я хочу посмотреть, как ты работаешь..."
23004-1616 = "Не могу позволить. В мастерской Инженерного отдела полно опасных предметов."
23004-1617 = "К тому же такой простой ремонт — сплошное повторение одних действий, смотреть будет скучно."
23004-1618 = "Я просто побуду здесь..."
23004-1619 = "Вы не маленький ребёнок. Не давите на жалость."
23004-1620 = "Сейчас чинить особо нечего... В следующий раз сообщу."
23004-1621 = "Я проходила мимо велопарковки и увидела, что «Громобой» лежит на боку."
23004-1622 = "Что? «Громобой»?!"
23004-1623 = "Похоже, Serval скоро выпустит новые рабочие перчатки."
23004-1624 = "Перчатки, которые я купила у Manaslu, слишком толстые, а я как раз искала новые. Как удачно."
23004-1625 = "Я заметил, ты всегда носишь рабочие перчатки, даже в помещении, Утаха."
23004-1626 = "Можно спросить почему?"
23004-1627 = "Особой причины нет... Просто мои пальцы не очень красивые."
23004-1628 = "Я с детства возилась со смазкой и металлом, поэтому пальцы все в порезах и мозолях."
23004-1629 = "Поэтому я всегда в перчатках."
23004-230040010 = "Сенсей."
23004-230040020 = "Ты случайно сегодня не свободна?"
23004-230040030 = "Конечно. Что такое?"
23004-230040040 = "Мне просто нужно купить инструменты."
23004-230040050 = "Есть один маленький секретный магазин инструментов, куда я хожу."
23004-230040060 = "Я подумала, может, вы захотите пойти со мной."
23004-230040070 = "С удовольствием!"
