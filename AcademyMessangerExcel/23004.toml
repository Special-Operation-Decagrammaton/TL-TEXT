[translation]
23004-1582 = "Сенсей, я только что видела, как вы внимательно изучали каталог канцтоваров..."
23004-1583 = "Вам что-то нужно?"
23004-1584 = "Я хотел заказать новый подставку для ручек."
23004-1585 = "Если форма простая, я могу сделать быстрее. Как вам?"
23004-1586 = "Разве это так просто сделать?"
23004-1587 = "Конечно. И к тому же легче и прочнее покупных."
23004-1588 = "У меня как раз есть материалы, так что мне сделать?"
23004-1589 = "Да, было бы здорово."
23004-1590 = "Тогда приходите в мастерскую инженерного клуба примерно через час."
23004-1591 = "Сенсей, похоже, в туалете Шале перегорела лампочка."
23004-1592 = "Я нажал выключатель, но свет не загорелся."
23004-1593 = "А, правда? Спасибо. Придётся вызывать мастера..."
23004-1594 = "Всё в порядке, похоже, просто оборвался провод, должно быть легко починить."
23004-1595 = "Где у вас инструмент для обжима? Я починю."
23004-1596 = "В Шале нет таких специальных инструментов..."
23004-1597 = "...Нет? Совсем?"
23004-1598 = "...Понятно."
23004-1599 = "Сенсей, сегодня днём я зайду в Шале как дежурная по расписанию."
23004-1600 = "Прости, у меня внезапно появились дела, и, возможно, меня не будет в Шале."
23004-1601 = "Вот как. Что ж, ничего не поделаешь."
23004-1602 = "Есть что-то, что нужно сделать, пока вас нет?"
23004-1603 = "Может, придёт посылка, не могла бы ты её принять?"
23004-1604 = "Посылка? Что в ней?"
23004-1605 = "Я заказал робота-собаку."
23004-1606 = "Ого, робот-собака..."
23004-1607 = "...На всякий случай, не вскрывай его?"
23004-1608 = "...Утаха?"
23004-1609 = "Сенсей, ремонт велосипеда, который вы просили, закончен."
23004-1610 = "Когда будете в Миллениуме, зайдите в инженерный клуб и заберите."
23004-1611 = "Здорово, как быстро."
23004-1612 = "Как и ожидалось от мастера из Миллениума!"
23004-1613 = "Ну, даже без меня такой ремонт не считается сложным."
23004-1614 = "Если вы сами попробуете отремонтировать в следующий раз, то поймёте."
23004-1615 = "Я лучше постою рядом и посмотрю, как ремонтируешь ты, Утаха."
23004-1616 = "Хм, не знаю... в мастерской много опасных вещей."
23004-1617 = "К тому же, ремонт — это однообразная работа. Вряд ли это интересно."
23004-1618 = "Я буду вести себя хорошо~"
23004-1619 = "Как ребёнок..."
23004-1620 = "В любом случае, сейчас нечего чинить... в другой раз."
23004-1621 = "Кстати, я только что видел, как Рай-тян на велосипедной парковке странно двигалась сама по себе."
23004-1622 = "Ч-что, Рай-тян!?!?"
23004-1623 = "Говорят, скоро выйдут новые рабочие перчатки от «Сервала»."
23004-1624 = "Те, что от «Манаслу», были слишком толстыми, так что это хорошая возможность."
23004-1625 = "Кстати, Утаха, ты всё время носишь перчатки, даже в помещении."
23004-1626 = "Есть какая-то особая причина, как у мастера?"
23004-1627 = "Ничего особенного, просто мои пальцы не самые красивые."
23004-1628 = "Они не такие уж и чистые, потому что всю жизнь работают с маслом и металлом."
23004-1629 = "Поэтому, да."
23004-230040010 = "Сенсей"
23004-230040020 = "У вас сегодня есть время?"
23004-230040030 = "Да, конечно. Что-то случилось?"
23004-230040040 = "Я хочу купить новые инструменты."
23004-230040050 = "Знаю один хороший магазин инструментов."
23004-230040060 = "Если хотите, могу показать."
23004-230040070 = "С удовольствием!"