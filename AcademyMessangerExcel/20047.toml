[translation]
20047-200470010 = "Сенсей, вы действительно отдыхаете?"
20047-200470020 = "К-конечно, отдыхаю!"
20047-200470030 = "Кондиционер в офисе — это великолепно!"
20047-200470040 = "..."
20047-200470050 = "Я так и знала."
20047-200470060 = "Вы, наверное, работаете без перерыва?"
20047-200470070 = "А ты как, Кикьё?"
20047-200470080 = "Думаешь, в моём плане есть изъяны?"
20047-200470090 = "Ч-что ты задумала...!?"
20047-200470100 = "Не скажу."
20047-200470110 = "Если интересно... приходи и узнай?"
20047-200470120 = "Сейчас здесь никого нет, кроме меня."
20047-200470130 = "Я сейчас приду!"
20047-200470140 = "Да, вот переписанное расписание."
20047-200470150 = "Я отправила, проверьте."
20047-200470160 = "Я с нетерпением жду!"
20047-200470170 = "Естественно."
20047-200470180 = "Я столько думала, что план безупречен."
20047-200470190 = "Тогда"
20047-200470200 = "А, да, кстати."
20047-200470210 = "Никому не говори, ладно?"
20047-200470220 = "Ни за что."
20047-200470230 = "Понял?"
20047-200470240 = "Ты помнишь, какой завтра день?"
20047-200470250 = "Твой день рождения, Кикьё?"
20047-200470260 = "..."
20047-200470270 = "Да, действительно."
20047-200470280 = "Мой день рождения летом, но"
20047-200470290 = "хватит шутить непонятно."
20047-200470300 = "Ну, может, Сенсей, который общается с множеством учениц,"
20047-200470310 = "иногда и путается?"
20047-200470320 = "Я пошутил!"
20047-200470330 = "Это же день поездки на море!"
20047-200470340 = "..."
20047-200470350 = "Ну вот."
20047-200470360 = "Значит, ты помнишь."
20047-200470370 = "Мы едем на море."
20047-200470380 = "Ты ждала этого, да?"
20047-200470390 = "...Что ты имеешь в виду?"
20047-200470400 = "В общем, завтра приходи вовремя."
20047-200470410 = "Если опоздаешь... готовься."
20047-200470420 = "Ну... сегодня было весело."
20047-200470430 = "Побыть в воде оказалось не так уж плохо."
20047-200470440 = "Это мой первый раз."
20047-200470450 = "Мне тоже было весело!"
20047-200470460 = "Давай ещё раз!"
20047-200470470 = "Ещё?"
20047-200470480 = "...Вдвоём?"
20047-200470490 = "Конечно!"
20047-200470500 = "..."
20047-200470510 = "Хорошо."
20047-200470520 = "Тогда скажи мне, когда ты свободен."
20047-200470530 = "Я подстроюсь."
20047-200470540 = "И ещё..."
20047-200470550 = "Я хочу попробовать то, что мы не успели сделать сегодня."
20047-200470560 = "А что именно..."
20047-200470570 = "будет сюрпризом в тот день."
20047-200470580 = "На всякий случай."
20047-200470590 = "Ты ведь знаешь, какой завтра день?"
20047-200470600 = "День, который ты ждёшь, Кикьё!"
20047-200470610 = "..."
20047-200470620 = "О чём ты говоришь?"
20047-200470630 = "Это и тебя касается."
20047-200470640 = "Берег будет другой, чем в прошлый раз."
20047-200470650 = "Так что не перепутай."
20047-200470660 = "Ну как?"
20047-200470670 = "Ты отдохнул?"
20047-200470680 = "Чувствую, что тело стало легче!"
20047-200470690 = "Похоже, я действительно освежился!"
20047-200470700 = "Я тоже отдохнула."
20047-200470710 = "...Сенсей."
20047-200470720 = "Есть ещё кое-что, что я хотела бы сделать на море..."
20047-200470730 = "Можно я приглашу тебя снова?"
20047-200470740 = "Всегда зови!"
20047-200470750 = "Хе-хе"
20047-200470760 = "Тогда я напишу ещё."
20047-200470770 = "Эм"
20047-200470780 = "Я буду ждать."
20047-200470790 = "Насчёт завтра..."
20047-200470800 = "У меня есть кое-какие дела."
20047-200470810 = "Я пойду вперёд."
20047-200470820 = "Давай встретимся на месте."
20047-200470830 = "Может, помочь тебе?"
20047-200470840 = "Спасибо за заботу."
20047-200470850 = "Но всё в порядке."
20047-200470860 = "Тебе, Сенсей, достаточно просто прийти вовремя."
20047-200470870 = "...Если опоздаешь, я тебя не прощу."
20047-200470880 = "Сенсей"
20047-200470890 = "Ты благополучно добрался?"
20047-200470900 = "Ну... то, что было сегодня..."
20047-200470910 = "это секрет от всех."
20047-200470920 = "Значит, это наш с тобой секрет!"
20047-200470930 = "Что?"
20047-200470940 = "Ну, да."
20047-200470950 = "Кстати, Кикьё."
20047-200470960 = "Ммм?"
20047-200470970 = "Что?"
20047-200470980 = "Я пришлю тебе видео с котом, который качается в гамаке."
20047-200470990 = "Зачем?"
20047-200471000 = "Мне это не очень интересно, но..."
20047-200471010 = "*вздох* Ну ладно. До встречи."