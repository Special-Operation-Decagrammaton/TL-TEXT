[translation]
20047-200470010 = "Sensei, você tem tirado folga direitinho?"
20047-200470020 = "C-Claro que sim, ué?"
20047-200470030 = "O ar-condicionado do escritório é uma maravilha!"
20047-200470040 = "..."
20047-200470050 = "Sabia"
20047-200470060 = "Está trabalhando sem parar de novo, né?"
20047-200470070 = "E quanto a você, Kikyou?"
20047-200470080 = "Por acaso acha que haveria alguma brecha nos meus planos?"
20047-200470090 = "O-O que você está planejando...?!"
20047-200470100 = "Não vou contar"
20047-200470110 = "Se ficou curioso... por que não vem ver pessoalmente?"
20047-200470120 = "Agora não tem mais ninguém aqui além de mim"
20047-200470130 = "Estou indo imediatamente!"
20047-200470140 = "Pronto, passei o cronograma a limpo"
20047-200470150 = "Acabei de te mandar, então dá uma conferida depois"
20047-200470160 = "Mal posso esperar!"
20047-200470170 = "Claro"
20047-200470180 = "Depois de tudo o que eu planejei, o roteiro está perfeito"
20047-200470190 = "Bom, até mais"
20047-200470200 = "Ah, é mesmo"
20047-200470210 = "Isso é segredo das outras meninas, viu?"
20047-200470220 = "Segredo absoluto"
20047-200470230 = "Entendeu?"
20047-200470240 = "Você se lembra do que tem amanhã?"
20047-200470250 = "O aniversário da Kikyou?"
20047-200470260 = "..."
20047-200470270 = "É verdade que"
20047-200470280 = "o meu aniversário é no verão, mas"
20047-200470290 = "pare de fazer piadas difíceis de entender"
20047-200470300 = "Quer dizer, para um Sensei que conversa com tantas alunas,"
20047-200470310 = "deve ser normal confundir os compromissos, né?"
20047-200470320 = "Tô brincando!"
20047-200470330 = "É o dia de irmos à praia, claro!"
20047-200470340 = "..."
20047-200470350 = "Ah, bom"
20047-200470360 = "Então você lembrava direitinho"
20047-200470370 = "De ir à praia..."
20047-200470380 = "Vejo que estava mesmo ansioso por isso"
20047-200470390 = "...Como assim?"
20047-200470400 = "Enfim, amanhã compareça no horário combinado"
20047-200470410 = "Se você se atrasar... já pode ir se preparando"
20047-200470420 = "Hum... Hoje foi muito divertido"
20047-200470430 = "Entrar na água até que não é tão ruim assim"
20047-200470440 = "Foi a primeira vez que me senti assim"
20047-200470450 = "Eu também me diverti muito!"
20047-200470460 = "Vamos de novo qualquer dia!"
20047-200470470 = "De novo?"
20047-200470480 = "...Só nós dois?"
20047-200470490 = "Claro!"
20047-200470500 = "........."
20047-200470510 = "Entendi"
20047-200470520 = "Então me avise quais dias você tem livres, Sensei"
20047-200470530 = "Eu ajusto a minha agenda à sua"
20047-200470540 = "E também..."
20047-200470550 = "Quero tentar fazer as coisas que não conseguimos fazer hoje"
20047-200470560 = "Quanto ao que vamos fazer..."
20047-200470570 = "Vai ficar de surpresa para o dia"
20047-200470580 = "Só por precaução:"
20047-200470590 = "você sabe que dia é amanhã, né?"
20047-200470600 = "O dia que a Kikyou tanto estava esperando!"
20047-200470610 = "..."
20047-200470620 = "Do que você está falando?"
20047-200470630 = "Você também estava esperando, não estava?"
20047-200470640 = "Vai ser numa praia diferente da última vez,"
20047-200470650 = "então cuidado para não errar o caminho"
20047-200470660 = "E aí?"
20047-200470670 = "Deu pra descansar?"
20047-200470680 = "Sinto que meu corpo ficou até mais leve!"
20047-200470690 = "Consegui recarregar as energias de verdade!"
20047-200470700 = "Eu também me sinto renovada"
20047-200470710 = "...Sensei"
20047-200470720 = "Ainda tem outras coisas que eu quero fazer na praia..."
20047-200470730 = "Posso te convidar de novo?"
20047-200470740 = "Pode chamar a qualquer hora!"
20047-200470750 = "Fufu"
20047-200470760 = "Então entro em contato de novo depois"
20047-200470770 = "Hum..."
20047-200470780 = "Vou ficar esperando ansiosa"
20047-200470790 = "Sobre amanhã,"
20047-200470800 = "tenho umas coisinhas pra resolver antes,"
20047-200470810 = "então vou indo na frente"
20047-200470820 = "A gente se encontra direto lá"
20047-200470830 = "Quer ajuda com alguma coisa?"
20047-200470840 = "Agradeço a preocupação"
20047-200470850 = "Mas pode deixar"
20047-200470860 = "Basta que você venha com calma e chegue no horário, Sensei"
20047-200470870 = "...Se atrasar, eu não te perdoo"
20047-200470880 = "Sensei"
20047-200470890 = "Chegou bem em casa?"
20047-200470900 = "Hum... sobre o que aconteceu hoje,"
20047-200470910 = "não conte para ninguém"
20047-200470920 = "É um segredo só nosso!"
20047-200470930 = "Ah..."
20047-200470940 = "Bom, sim"
20047-200470950 = "Falando nisso, Kikyou"
20047-200470960 = "Hum?"
20047-200470970 = "O quê?"
20047-200470980 = "Vou te mandar um vídeo de um gatinho brincando numa rede"
20047-200470990 = "Por quê?"
20047-200471000 = "Não é como se eu tivesse interesse nisso..."
20047-200471010 = "Suspiro... Bom, tanto faz. Até mais"
