[translation]
20047-200470010 = "Вы нормально отдыхаете, Сенсей?"
20047-200470020 = "Конечно!"
20047-200470030 = "Обожаю кондиционер в офисе!"
20047-200470040 = "..."
20047-200470050 = "Как я и подозревала."
20047-200470060 = "В офисе невозможно нормально отдохнуть."
20047-200470070 = "А ты, Кикё? Ты отдыхаешь?"
20047-200470080 = "Вы обвиняете меня в составлении ошибочного плана?"
20047-200470090 = "Что это вообще значит...?"
20047-200470100 = "Не скажу."
20047-200470110 = "Если хотите узнать... можете прийти и увидеть своими глазами."
20047-200470120 = "Сейчас в клубной комнате только я."
20047-200470130 = "Уже иду!"
20047-200470140 = "После вашего ухода я закончила план отпуска."
20047-200470150 = "Я отправлю его вам. Пожалуйста, ознакомьтесь."
20047-200470160 = "Фуфу, жду с нетерпением!"
20047-200470170 = "Разумеется."
20047-200470180 = "Это идеальный план, который мы придумали вместе."
20047-200470190 = "До следующего раза."
20047-200470200 = "Ах. Только хочу сказать."
20047-200470210 = "Ни в коем случае не рассказывайте об этом остальным."
20047-200470220 = "Никогда."
20047-200470230 = "Понятно?"
20047-200470240 = "Сенсей. Вы помните, что завтра?"
20047-200470250 = "Эм... День рождения Кикё?"
20047-200470260 = "..."
20047-200470270 = "Ну..."
20047-200470280 = "Мой день рождения действительно летом."
20047-200470290 = "Однако прошу отказаться от подобных сбивающих с толку шуток."
20047-200470300 = "Или, возможно, вы перепутали,"
20047-200470310 = "потому что общаетесь с очень большим количеством студентов?"
20047-200470320 = "Я пошутил! Просто пошутил! Я знаю!"
20047-200470330 = "Мы едем на пляж!"
20047-200470340 = "..."
20047-200470350 = "А?"
20047-200470360 = "Значит, всё-таки помнили."
20047-200470370 = "Похоже, вы действительно очень ждали этот день!"
20047-200470380 = "Ты рада, что мы едем на пляж?"
20047-200470390 = "Я не стану удостаивать эту глупость ответом."
20047-200470400 = "Тогда увидимся завтра."
20047-200470410 = "Я буду весьма рассержена, если вы посмеете опоздать."
20047-200470420 = "Эм... Сегодня мне понравилось."
20047-200470430 = "Я не ожидала, что заходить в воду будет... весело."
20047-200470440 = "Для меня это был новый опыт."
20047-200470450 = "Мне тоже было весело!"
20047-200470460 = "Давай как-нибудь ещё раз!"
20047-200470470 = "Ещё раз?"
20047-200470480 = "...Снова только вдвоём?"
20047-200470490 = "Ага! Только вдвоём!"
20047-200470500 = "..."
20047-200470510 = "Поняла."
20047-200470520 = "Сообщите, когда будете свободны."
20047-200470530 = "Я подстрою своё расписание под ваше."
20047-200470540 = "И..."
20047-200470550 = "В следующий раз мы попробуем что-нибудь другое."
20047-200470560 = "Тогда и узнаете."
20047-200470570 = "Просто... пока ждите."
20047-200470580 = "Наверняка мне даже не нужно уточнять..."
20047-200470590 = "Вы ведь знаете, какой завтра день?"
20047-200470600 = "Тот самый день, которого вы ждали!"
20047-200470610 = "..."
20047-200470620 = "О чём ты говоришь?"
20047-200470630 = "Очевидно, это вы полны предвкушения."
20047-200470640 = "Место — другой пляж."
20047-200470650 = "Не заблудитесь."
20047-200470660 = "Фуфу..."
20047-200470670 = "После сегодня ты расслабилась?"
20047-200470680 = "Тело больше не болит!"
20047-200470690 = "Усталость прошла!"
20047-200470700 = "Да. Песчаная ванна мне тоже понравилась."
20047-200470710 = "...Сенсей."
20047-200470720 = "Есть ещё кое-что, что я хочу сделать на пляже."
20047-200470730 = "У вас есть время, верно?"
20047-200470740 = "Когда угодно!"
20047-200470750 = "Фуфу, хорошо."
20047-200470760 = "Я свяжусь с вами."
20047-200470770 = "Мм."
20047-200470780 = "Нашу следующую встречу... буду ждать."
20047-200470790 = "Насчёт завтра."
20047-200470800 = "У меня есть кое-какие дела,"
20047-200470810 = "поэтому я буду в этом районе заранее."
20047-200470820 = "Приходите к нашему месту встречи."
20047-200470830 = "Я могу помочь тебе с делами?"
20047-200470840 = "Ценю ваше желание."
20047-200470850 = "Но я справлюсь."
20047-200470860 = "Можете приходить не спеша."
20047-200470870 = "...Но если опоздаете, я вас не прощу."
20047-200470880 = "Сенсей."
20047-200470890 = "Ты благополучно вернулась?"
20047-200470900 = "Насчёт сегодняшнего..."
20047-200470910 = "Это должно остаться между вами и мной, ясно?"
20047-200470920 = "Значит, это наш особый секрет!"
20047-200470930 = "А."
20047-200470940 = "Полагаю, да."
20047-200470950 = "Кстати, Кикё!"
20047-200470960 = "Хм?"
20047-200470970 = "Что такое?"
20047-200470980 = "Я пришлю тебе видео кота, который играет в гамаке!"
20047-200470990 = "Что?"
20047-200471000 = "Особой необходимости в этом я не вижу..."
20047-200471010 = "Угх. Ладно. Поговорим позже."
