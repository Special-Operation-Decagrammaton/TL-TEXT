[translation]
20009-200090010 = "В конце года в академии царит суета и беготня."
20009-200090020 = "Даже у меня, при моей выносливости, накапливается усталость от постоянной напряжённой работы."
20009-200090030 = "Поэтому на этих выходных я решила забыть о работе и насладиться зимними каникулами!"
20009-200090040 = "Если хорошо отдохнуть на курорте, то и работа пойдёт эффективнее."
20009-200090050 = "А разве ты не отдыхаешь постоянно...?"
20009-200090060 = "Ты наивен, товарищ."
20009-200090070 = "Отдых во время работы и полноценный отпуск — это совершенно разные вещи, понимаешь?"
20009-200090080 = "Мой обычный дневной сон — лишь временная мера, а настоящее утомление накапливается отдельно."
20009-200090090 = "И вот, чтобы насладиться отдыхом, я на этот раз арендовала целый горячий источник!"
20009-200090100 = "Если ты тоже устал, товарищ, не хочешь ли провести зимние каникулы вместе со мной?"
20009-200090110 = "Почему так..."
20009-200090120 = "Мой план отдыха был безупречен..."
20009-200090130 = "Всё тело будто свинцом налито..."
20009-200090140 = "Ну, если ты обычно мало двигаешься, а тут вдруг столько нагрузки..."
20009-200090150 = "Похоже, это крепатура."
20009-200090160 = "Что за напасть..."
20009-200090170 = "Было весело, но я не смогла достать тот лучший маття-пудинг, да ещё и крепатура..."
20009-200090180 = "Зимние каникулы, какие же вы ужасные..."
20009-200090190 = "Товарищ, ты когда-нибудь пробовал «онсэн-тамаго»?"
20009-200090200 = "Говорят, это деликатес, созданный из обычных яиц и воды горячего источника..."
20009-200090210 = "Я, хоть и не особо разбираюсь в источниках, но в это трудно поверить."
20009-200090220 = "Онсэн-тамаго?"
20009-200090230 = "Да, они мягкие, как пудинг, и очень вкусные."
20009-200090240 = "Пудинг!?"
20009-200090250 = "Ты только что сказала «пудинг»!?"
20009-200090260 = "Для приготовления пудинга нужно столько ингредиентов,"
20009-200090270 = "а тут вода из источника и яйца — и получается десерт как пудинг...!?"
20009-200090280 = "Товарищ, нам нельзя терять время."
20009-200090290 = "Идём готовить онсэн-тамаго!"
20009-200090300 = "Товарищ, слышал ли ты такую историю?"
20009-200090310 = "Белый лебедь, который грациозно плывёт по воде, под водой отчаянно работает лапами, чтобы не утонуть..."
20009-200090320 = "Это значит, что чтобы казаться величественным и прекрасным, нужно скрыто прилагать усилия."
20009-200090330 = "Хорошо бы, если бы студенты академии тоже так относились к делу и работали в выходные."
20009-200090340 = "Это, безусловно, хорошая история в некотором смысле, но..."
20009-200090350 = "Хм? Что такое, товарищ? Хочешь что-то сказать?"
20009-200090360 = "Я недавно узнал, что на самом деле лебеди не тонут,"
20009-200090370 = "потому что их перья смазаны жиром."
20009-200090380 = "..."
20009-200090390 = "..."
20009-200090400 = "Черино?"
20009-200090410 = "Не называй меня Черино сейчас, товарищ..."
20009-200090420 = "Я, лишённая авторитета бороды, не могу называться великой вождицей Черино..."
20009-200090430 = "Я всего лишь одна из студентов Красной Зимы..."
20009-200090440 = "Та борода всё ещё в стирке?"
20009-200090450 = "Томоэ сказала, что она слишком пропиталась жиром, и лучше купить новую."
20009-200090460 = "Но даже если я закажу новую бороду, неизвестно, когда она придёт..."
20009-200090470 = "Кто бы мог подумать, что отсутствие авторитета будет таким унылым и гнетущим..."
20009-200090480 = "Может, сходишь куда-нибудь на горячий источник, чтобы развеяться?"
20009-200090490 = "Сейчас у меня нет настроения..."
20009-200090500 = "И зачем всем так нравится мыться в горячей воде..."
20009-200090510 = "Когда выйдешь из воды, я куплю тебе фруктовое молоко."
20009-200090520 = "Хорошо, идём скорее, товарищ."
20009-200090530 = "Товарищ"
20009-200090540 = "Товарищ!?"
20009-200090550 = "Черино? Что-то случилось?"
20009-200090560 = "О, вот ты где. Хм, с чего бы начать..."
20009-200090570 = "Из-за ошибки вычислительного отдела возникла небольшая неприятность."
20009-200090580 = "По правилам, я должна была всех казнить,"
20009-200090590 = "но в итоге это пошло на пользу бюджету Красной Зимы."
20009-200090600 = "По совету Томоэ я решила на этот раз отменить наказание."
20009-200090610 = "Я не совсем понимаю, о чём речь..."
20009-200090620 = "М-м"
20009-200090630 = "В общем, приезжай на мой горячий источник!"
20009-200090640 = "Лучше один раз увидеть, чем сто раз услышать!"