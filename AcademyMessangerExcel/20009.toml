[translation]
20009-200090010 = "В конце года в академии настоящий хаос."
20009-200090020 = "Даже я, обладающая сверхчеловеческой выносливостью, чувствую, как из-за бесконечной тяжёлой работы накапливается усталость."
20009-200090030 = "Поэтому я решила на выходных отдохнуть от работы и насладиться долгожданными зимними каникулами!"
20009-200090040 = "После хорошего отдыха на роскошном курорте я полностью восстановлюсь."
20009-200090050 = "Разве ты и так не достаточно отдыхаешь каждый день?"
20009-200090060 = "О чём ты, товарищ?"
20009-200090070 = "Есть разница между отпуском и хорошим отдыхом во время работы."
20009-200090080 = "Короткие дневные сны в Секретариате не снимают мою усталость полностью!"
20009-200090090 = "Так вот, на этот раз я арендовала целый роскошный курорт с горячими источниками, чтобы насладиться отпуском по полной."
20009-200090100 = "Если ты тоже устал, как насчёт провести зимние каникулы со мной, товарищ?"
20009-200090110 = "Уф... Уф..."
20009-200090120 = "Почему это происходит? Мой план отпуска был идеальным..."
20009-200090130 = "Всё тело тяжёлое, будто на меня повесили гири..."
20009-200090140 = "Потому что ты занималась упражнениями, которых никогда раньше не делала."
20009-200090150 = "Может, мышцы болят?"
20009-200090160 = "Я всего лишь хотела хорошо отдохнуть..."
20009-200090170 = "Мало того что у меня забрали мой лучший пудинг, так ещё и мышцы болят..."
20009-200090180 = "Зимние каникулы... Какое ужасное время..."
20009-200090190 = "Ты когда-нибудь пробовал яйца, сваренные в горячем источнике, товарищ?"
20009-200090200 = "Не могу поверить, что такое лакомство делают всего из обычных яиц и воды горячего источника..."
20009-200090210 = "Даже если я ничего не знаю о горячих источниках, в это всё равно трудно поверить."
20009-200090220 = "Яйцо, сваренное в горячем источнике..."
20009-200090230 = "Оно наверняка такое же мягкое и вкусное, как пудинг."
20009-200090240 = "П-П-Пудинг?!"
20009-200090250 = "Ты только что сказал «пудинг»?"
20009-200090260 = "Для пудинга нужно много ингредиентов."
20009-200090270 = "И всё же можно сделать десерт, похожий на пудинг, только из воды горячего источника и яйца?"
20009-200090280 = "Товарищ, нельзя терять время."
20009-200090290 = "Пойдём прямо сейчас готовить яйца в горячем источнике!"
20009-200090300 = "Товарищ, ты знал?"
20009-200090310 = "Лебедь, который так безмятежно и изящно плывёт, на самом деле изо всех сил работает лапами под водой, чтобы держаться на плаву."
20009-200090320 = "Чтобы стать похожим на это благородное создание, нужно усердно работать, даже когда никто не видит."
20009-200090330 = "Хотела бы я, чтобы студенты Красной Зимы брали пример с лебедей и трудились даже на перерывах..."
20009-200090340 = "Черина."
20009-200090350 = "Да? Что такое, товарищ?"
20009-200090360 = "Лебеди держатся на воде"
20009-200090370 = "благодаря жиру на перьях."
20009-200090380 = "..."
20009-200090390 = "..."
20009-200090400 = "Черина?"
20009-200090410 = "Нет, товарищ, я не Черина."
20009-200090420 = "Без власти усов я не могу быть Чериной, Великим Лидером и президентом Студенческого совета."
20009-200090430 = "Я просто обычный студент Красной Зимы..."
20009-200090440 = "Ты всё ещё отмываешь усы?"
20009-200090450 = "Нет, я пыталась отмыть их, но Томоэ сказала, что жир слишком глубоко впитался, и лучше просто купить новые."
20009-200090460 = "Но даже если купить новые усы, неизвестно, когда они придут..."
20009-200090470 = "Без власти всё бессмысленно и уныло."
20009-200090480 = "Может, ванна поднимет тебе настроение."
20009-200090490 = "Моему телу ванна не нужна."
20009-200090500 = "Серьёзно, не понимаю, почему все так любят лежать в горячей воде..."
20009-200090510 = "После ванны куплю тебе фруктовое молоко."
20009-200090520 = "Я мигом буду там, товарищ."
20009-200090530 = "Товарищ."
20009-200090540 = "Товарищ!"
20009-200090550 = "Что случилось, Черина?"
20009-200090560 = "Хм. Как бы это сказать..."
20009-200090570 = "Произошло, так сказать, небольшое осложнение из-за ошибки Бюро информатики..."
20009-200090580 = "По правилам, конечно, всех его членов следовало бы подвергнуть чистке."
20009-200090590 = "Однако, учитывая некоторые замечания Томоэ и то, что эта проблема в итоге принесла Академии Красная Зима финансовую выгоду..."
20009-200090600 = "было решено сделать исключение и вместо этого оставить их на испытательном сроке."
20009-200090610 = "Теперь я вообще не понимаю, о чём ты..."
20009-200090620 = "Хм..."
20009-200090630 = "Просто приезжай ко мне на курорт с горячими источниками."
20009-200090640 = "Наверное, тебе будет проще увидеть всё самому, раз объяснения не помогают."
