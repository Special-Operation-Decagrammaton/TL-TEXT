[translation]
20009-200090010 = "A academia fica extremamente agitada e atarefada no fim de ano."
20009-200090020 = "Até mesmo eu, com todo o meu vigor físico superior, estou acumulando cansaço por conta dessa rotina exaustiva de trabalho."
20009-200090030 = "Por isso, neste fim de semana, decidi esquecer o trabalho e curtir as férias de inverno!"
20009-200090040 = "Se eu descansar bastante num resort, a minha eficiência no trabalho depois certamente vai aumentar."
20009-200090050 = "Mas você já não tira bastante tempo de descanso normalmente...?"
20009-200090060 = "Quanta ingenuidade, Camarada."
20009-200090070 = "Pausas durante o expediente e férias de verdade são coisas completamente diferentes, sabia?"
20009-200090080 = "Os meus cochilos diários são apenas uma medida emergencial, mas a fadiga profunda continua se acumulando mesmo assim."
20009-200090090 = "Sendo assim, para aproveitar as férias em grande estilo, desta vez eu reservei uma fonte termal inteira só para mim!"
20009-200090100 = "Se você também estiver cansado, Camarada, que tal curtir as férias de inverno comigo?"
20009-200090110 = "Como isso foi acontecer..."
20009-200090120 = "O meu plano de férias deveria ter sido perfeito..."
20009-200090130 = "Meu corpo inteiro está pesado como chumbo..."
20009-200090140 = "É o que dá fazer tanto exercício de repente quando não se tem o costume de se mexer..."
20009-200090150 = "Provavelmente é só dor muscular."
20009-200090160 = "Que absurdo..."
20009-200090170 = "Tudo bem que foi divertido, mas além de não conseguir colocar as mãos no pudim de matcha supremo, ainda fiquei com dor muscular..."
20009-200090180 = "Férias de inverno... que coisa mais temível..."
20009-200090190 = "Camarada, você já comeu \"ovos de fontes termais\"?"
20009-200090200 = "Ouvi dizer que é uma iguaria criada apenas com ovos comuns e água termal, mas..."
20009-200090210 = "Mesmo que eu não seja especialista em fontes termais, é uma história difícil de engolir."
20009-200090220 = "Ovos termais?"
20009-200090230 = "Eles ficam macios que nem pudim mesmo, e são uma delícia."
20009-200090240 = "Pudim?!"
20009-200090250 = "Você acabou de dizer pudim?!"
20009-200090260 = "São necessários tantos ingredientes para fazer um pudim..."
20009-200090270 = "E você está me dizendo que dá para criar uma sobremesa parecida com pudim usando apenas água termal e ovos...?!"
20009-200090280 = "Camarada, não temos tempo a perder!"
20009-200090290 = "Vamos fazer ovos termais agora mesmo!"
20009-200090300 = "Camarada, você conhece aquele ditado?"
20009-200090310 = "Até o cisne que desliza elegantemente pela lagoa está batendo as patas desesperadamente debaixo d'água para não afundar..."
20009-200090320 = "Ou seja, para ser uma presença sublime e imponente, é preciso fazer um esforço secreto nos bastidores."
20009-200090330 = "Bem que as alunas da academia poderiam adotar essa mesma mentalidade e trabalhar nos dias de folga também."
20009-200090340 = "De fato, até que é uma bela metáfora, mas..."
20009-200090350 = "Hm? O que foi, Camarada? Tem alguma coisa a declarar?"
20009-200090360 = "Descobri outro dia que o verdadeiro motivo de os cisnes não afundarem na água..."
20009-200090370 = "É porque eles passam um óleo natural nas penas."
20009-200090380 = "..."
20009-200090390 = "..."
20009-200090400 = "Cherino?"
20009-200090410 = "Não me chame de Cherino no meu estado atual, Camarada..."
20009-200090420 = "Sem a autoridade do meu bigode, não posso me chamar de Cherino, a grande líder..."
20009-200090430 = "Não passo de uma reles aluna qualquer na Academia Federal Red Winter..."
20009-200090440 = "Aquele bigode ainda está lavando?"
20009-200090450 = "O problema é que, segundo a Tomoe, o óleo impregnou tanto que seria melhor comprar um novo."
20009-200090460 = "Mas, mesmo que eu encomende um bigode novo, não faço ideia de quando vai chegar..."
20009-200090470 = "Nunca imaginei que ficar sem a minha autoridade fosse algo tão vazio e melancólico..."
20009-200090480 = "Que tal ir a alguma fonte termal para espairecer um pouco?"
20009-200090490 = "Não estou no clima para isso agora..."
20009-200090500 = "Francamente, não entendo por que todo mundo gosta tanto de se lavar na água quente..."
20009-200090510 = "Se você for, eu compro leite com frutas pra você depois do banho."
20009-200090520 = "Muito bem, vamos imediatamente, Camarada."
20009-200090530 = "Camarada."
20009-200090540 = "Camarada?!"
20009-200090550 = "Cherino? O que houve?"
20009-200090560 = "Oh, você está aí. Hum, por onde eu começo a explicar..."
20009-200090570 = "Por culpa de um erro do Departamento de Computação, acabamos com um probleminha meio chato nas mãos."
20009-200090580 = "Pelas regras, eu deveria expurgar todas as envolvidas imediatamente, mas..."
20009-200090590 = "No fim das contas, isso acabou ajudando as finanças de Red Winter."
20009-200090600 = "Então, seguindo também o conselho da Tomoe, decidi perdoá-las da punição só desta vez."
20009-200090610 = "Ainda não entendi muito bem o que aconteceu..."
20009-200090620 = "Hmph."
20009-200090630 = "Por enquanto, apenas venha até a minha estância termal!"
20009-200090640 = "Uma imagem vale mais que mil palavras!"
