[translation]
13009-1115 = "Сенсей..."
13009-1116 = "Продолжаете усердно работать?"
13009-1117 = "Тренировка ни с того ни с сего?"
13009-1118 = "Конечно."
13009-1119 = "Это обязательная тренировка для любого советника Клуба внутренней дисциплины..."
13009-1120 = "Сплю."
13009-1121 = "Вы вечно недосыпаете, потому что слишком заняты."
13009-1122 = "Да?"
13009-1123 = "Хм, подозрительно..."
13009-1124 = "Ладно... Почему бы и нет..."
13009-1125 = "Покажу, как проходит эта тренировка."
13009-1126 = "Увидимся в месте встречи, Сенсей!"
13009-1127 = "Сенсей..."
13009-1128 = "Цубаки? Что происходит?"
13009-1129 = "Совсем износилось..."
13009-1130 = "Что мне делать..."
13009-1131 = "А-А? Что износилось?"
13009-1132 = "В смысле?"
13009-1133 = "Мой любимый тренировочный инструмент..."
13009-1134 = "Т-Тренировочный инструмент?"
13009-1135 = "Помогите мне, Сенсей..."
13009-1136 = "Подожди, Цубаки. Я уже иду!"
13009-1137 = "Спасибо, что сегодня выбирали со мной подушку, Сенсей."
13009-1138 = "В следующий раз давайте тренироваться вместе."
13009-1139 = "Сенсей, не забудьте."
13009-1140 = "Сегодня мы должны тренироваться вместе."
13009-1141 = "Для меня это новость!"
13009-1142 = "О, правда?"
13009-1143 = "Эм, я была уверена, что мы уже договорились."
13009-1144 = "Хм, может, это было во сне?"
13009-1145 = "Ну ладно!"
13009-1146 = "Вот и хорошо. Ждите меня в Шале, Сенсей."
13009-1147 = "Я приду в Шале, Сенсей."
13009-1148 = "Сенсей, я нашла хорошее место для тренировок."
13009-1149 = "Под тренировкой ты имеешь в виду сон?"
13009-1150 = "Да, вы правы!"
13009-1151 = "Никому, кроме вас, не скажу, где оно."
13009-1152 = "Но где вообще хорошо спать?"
13009-1153 = "Вообще-то."
13009-1154 = "Это место... такое..."
13009-1155 = "Такое...?"
13009-1156 = "Такое... О, кролик."
13009-1157 = "Простите, Цубаки?"
13009-1158 = "Какой кролик? О чём ты?"
