[translation]
13009-1115 = "E aí, Sensei, como vão as coisas...?"
13009-1116 = "Continua se dedicando ao treino espiritual como sempre?"
13009-1117 = "Que treino espiritual?"
13009-1118 = "Claro que sim"
13009-1119 = "Como você também é o conselheiro do nosso Clube de Treino Espiritual, Sensei, há um treino que jamais pode faltar. Isso mesmo..."
13009-1120 = "Dormir, é claro"
13009-1121 = "Principalmente você, Sensei, que anda sempre tão ocupado que mal tem conseguido dormir, não é?"
13009-1122 = "Tem certeza~?"
13009-1123 = "Huum, sei não, parece suspeito..."
13009-1124 = "Huum... Já que chegamos a esse ponto, decidido"
13009-1125 = "Vou aproveitar a oportunidade para te mostrar pessoalmente como se faz um verdadeiro treino espiritual"
13009-1126 = "Então nos vemos no lugar combinado~, Sensei"
13009-1127 = "Sensei..."
13009-1128 = "Tsubaki? O que houve?"
13009-1129 = "Ficou todo acabado..."
13009-1130 = "O que eu faço agora...?"
13009-1131 = "Hã, quê? Todo acabado? O quê...?"
13009-1132 = "Como assim...?"
13009-1133 = "O meu equipamento de treino que eu guardava com tanto carinho..."
13009-1134 = "E-Equipamento de treino?"
13009-1135 = "Me ajuda, Sensei..."
13009-1136 = "Espere aí, Tsubaki, estou indo agora mesmo!"
13009-1137 = "Obrigada por procurar um travesseiro novo comigo hoje, Sensei"
13009-1138 = "Vamos fazer nosso treino juntos de novo na próxima"
13009-1139 = "Sensei, você se lembra, né?"
13009-1140 = "Hoje é o dia de treinarmos juntos"
13009-1141 = "Acho que é a primeira vez que ouço falar disso...?"
13009-1142 = "Ah, era hoje?"
13009-1143 = "Ué, não era? Eu jurava que a gente tinha combinado..."
13009-1144 = "Huum, será que eu fiz essa promessa dentro de um sonho?"
13009-1145 = "Bom, tanto faz, né?"
13009-1146 = "Sim, isso mesmo. Me espera aí na Schale, tá, Sensei?"
13009-1147 = "Eu mesma vou até a Schale, então pode ficar me esperando aí, Sensei"
13009-1148 = "Encontrei o lugar perfeito para o nosso treino, Sensei"
13009-1149 = "Por \"treino\", você quer dizer dormir, né?"
13009-1150 = "Sim, isso mesmo~"
13009-1151 = "Vou contar onde fica esse lugar para você antes de todo mundo, Sensei"
13009-1152 = "Obrigado. Mas que lugar perfeito para dormir seria esse...?"
13009-1153 = "É que, na verdade,"
13009-1154 = "esse lugar é muito..."
13009-1155 = "Muito...?"
13009-1156 = "Muuuuito... Ah, um coelho"
13009-1157 = "Hum, Tsubaki?"
13009-1158 = "Ei, o que tem o coelho? Tsubaki? Tsubaki?!"
