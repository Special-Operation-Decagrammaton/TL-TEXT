[translation]
13009-1115 = "Сенсей, как дела...?"
13009-1116 = "Ты как обычно усердно тренируешься?"
13009-1117 = "Тренируешься?"
13009-1118 = "Конечно."
13009-1119 = "Вы ведь тоже наставник нашего клуба тренировок, так что тренировки — это обязательно. Да..."
13009-1120 = "Сон."
13009-1121 = "Вы ведь, Сенсей, обычно слишком заняты и мало спите, правда?"
13009-1122 = "Правда~?"
13009-1123 = "М-м, подозрительно..."
13009-1124 = "М-м... раз уж так, воспользуемся случаем."
13009-1125 = "Я лично покажу вам пример тренировки."
13009-1126 = "Тогда встретимся в условленном месте~, Сенсей."
13009-1127 = "Сенсей..."
13009-1128 = "Цубаки? Что случилось?"
13009-1129 = "Оно развалилось..."
13009-1130 = "Что же делать..."
13009-1131 = "А? Что развалилось...?"
13009-1132 = "В смысле...?"
13009-1133 = "Мой любимый тренировочный инвентарь..."
13009-1134 = "Т-тренировочный инвентарь?"
13009-1135 = "Помогите, Сенсей..."
13009-1136 = "Держись, Цубаки, я сейчас приду!"
13009-1137 = "Спасибо, что помогли мне сегодня искать подушку, Сенсей."
13009-1138 = "В следующий раз потренируемся вместе."
13009-1139 = "Сенсей, вы ведь помните?"
13009-1140 = "Сегодня день нашей тренировки."
13009-1141 = "Кажется, я слышу об этом впервые...?"
13009-1142 = "А, правда?"
13009-1143 = "А, нет? Я думала, мы договорились..."
13009-1144 = "М-м, может, это был сон?"
13009-1145 = "Ну, в любом случае, неважно?"
13009-1146 = "Да, верно. Ждите меня в Шале, Сенсей."
13009-1147 = "Я сама приду в Шале, так что ждите меня, Сенсей."
13009-1148 = "Я нашла идеальное место для тренировок, Сенсей."
13009-1149 = "Тренировка — это ведь сон?"
13009-1150 = "Ага, да~"
13009-1151 = "Я расскажу вам об этом месте в первую очередь."
13009-1152 = "Спасибо. Но место, идеальное для сна..."
13009-1153 = "Знаете,"
13009-1154 = "здесь очень..."
13009-1155 = "Очень...?"
13009-1156 = "Очень... а, кролик."
13009-1157 = "Эй, Цубаки?"
13009-1158 = "Что с кроликом? Цубаки? Цубаки!?"