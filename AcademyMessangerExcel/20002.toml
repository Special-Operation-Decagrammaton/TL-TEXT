[translation]
20002-1383 = "Sensei, você pode dar um pulinho aqui no laboratório da Grande Saya?"
20002-1384 = "Por que isso de repente?"
20002-1385 = "É um assunto super importante relacionado à pesquisa da Grande Saya!"
20002-1386 = "E ainda por cima é um problema especial que só você pode resolver, Sensei......!"
20002-1387 = "Então vou ficar te esperando aqui no laboratório!"
20002-1388 = "......?"
20002-1389 = "Aquela purpurina toda já passou?"
20002-1390 = "Meu rosto ainda tá brilhando tanto que toda vez que olho no espelho meus olhos doem......"
20002-1391 = "Reluzir a ponto de não conseguir encarar o espelho é algo magnífico, sabia?"
20002-1392 = "Magnífico nada, não tem graça nenhuma!!"
20002-1393 = "Aliás, se não se importar, pode me dar só uma lasquinha da folha de ouro que descascou da sua pele?"
20002-1394 = "Quero analisar os componentes para usar na minha próxima pesquisa!"
20002-1395 = "Recuso"
20002-1396 = "Uuu! Mas por quê?!"
20002-1397 = "Isso é essencial para o avanço da alquimia!"
20002-1398 = "Sensei, pode vir ao meu laboratório mais uma vez?"
20002-1399 = "Isso tá me cheirando a cilada......"
20002-1400 = "Não precisa ter medo! Dessa vez eu finalmente concluí o verdadeiro Elixir da Imortalidade!"
20002-1401 = "Se você duvida, venha até o laboratório da Grande Saya conferir com os próprios olhos!"
20002-1402 = "Não acredito que a Grande Saya cometeu um erro daqueles...... Foi mal, Sensei"
20002-1403 = "Até a Grande Saya ficou chocada com o que aconteceu"
20002-1404 = "Para compensar,"
20002-1405 = "Na próxima vez que a gente se encontrar, vou pagar um lámen delicioso pra você lá na Associação Comercial Genbu"
20002-1406 = "......Ah, e se não for pedir muito...... pode me dar um tufinho daquele pelo cinza super brilhante?"
20002-1407 = "Recuso"
20002-1408 = "Uuu...... o futuro da imortalidade e da alquimia......"
20002-1409 = "Desculpa mesmo pelo que rolou outro dia, Sensei"
20002-1410 = "Para pedir desculpas direito, vou te pagar um lámen caprichado, então me espera na frente da Associação Comercial Genbu!"
20002-1411 = "Um lámen caprichado......?"
20002-1412 = "Isso, tem um restaurante que a Grande Saya adora frequentar"
20002-1413 = "É bom demais, tenho certeza de que você vai adorar assim que provar, Sensei!"
20002-1414 = "Aquele lámen que comemos juntos outro dia estava uma delícia mesmo"
20002-1415 = "Vamos dar um passeio juntos na Associação Comercial Genbu de novo outra hora!"
20002-1416 = "Vamos sim. Por falar nisso, o que aconteceu com aquelas meninas da Gangue do Capacete que tomaram o seu remédio?"
20002-1417 = "Hm......? Ah é, tinha aquelas garotas também, né......"
20002-1418 = "Sei lá, devem estar lambendo açúcar em algum canto por aí!"
20002-1419 = "Sensei, você anda bem à toa ultimamente, né?"
20002-1420 = "Tô atolado de trabalho o tempo todo......"
20002-1421 = "Aaaah, deixa de ser desmancha-prazeres! Eu consegui um jogo de tabuleiro super interessante"
20002-1422 = "Quero muito testar, mas como é para dois jogadores, preciso achar um oponente"
20002-1423 = "Se ficar curioso também, Sensei, vem brincar aqui no laboratório!"
20002-1424 = "Assim que terminar o trabalho eu passo aí"
20002-1425 = "Uuu, como é que a Grande Saya foi perder num jogo tão simples...... Que raiva!"
20002-1426 = "Na próxima eu não perco de jeito nenhum! Pode ir se preparando, Sensei!"
20002-1427 = "Mais do que estratégia no jogo, acho que você nunca vai ganhar enquanto não superar essa obsessão por queijo......"
20002-1428 = "Sensei...... hoje eu tenho um assunto muito sério para tratar com você"
20002-1429 = "Assunto sério? O que houve?"
20002-1430 = "É que...... não, não posso falar por mensagem......!"
20002-1431 = "Hum, como é uma coisa muito importante mesmo......"
20002-1432 = "Quando terminar o expediente na Schale hoje, você pode vir direto para o laboratório?"
20002-1433 = "Vou ficar te esperando, Sensei"
20002-1434 = "Sensei, tirei uma soneca agora há pouco e tive um sonho maravilhoso!"
20002-1435 = "Quando dei por mim, havia um pedaço gigantesco de queijo bem na frente da Grande Saya......"
20002-1436 = "Foi a primeira vez, até mesmo em sonho, que comi tanto queijo até cansar!"
20002-1437 = "......"
20002-1438 = "Por falar nisso, por que o seu braço estava todo cheio de arranhões e mordidas, Sensei?"
20002-1439 = "Saiu no tapa com algum animal selvagem?"
20002-1440 = "......"
20002-1441 = "Sensei, Sensei! Socorro! É um caso gravíssimo!"
20002-1442 = "Assim que vir esta mensagem, corra para o laboratório!"
20002-1443 = "Obrigada por me ajudar a procurar o Nezusuke, Sensei. Continue contando comigo daqui pra frente!"
20002-1444 = "Que bom que achamos o Nezusuke"
20002-1445 = "Imagina, não fiz nada demais"
20002-1446 = "Parando para pensar, até hoje eu peguei pesado demais tanto com o Nezusuke quanto com você, Sensei......"
20002-1447 = "Prometo não pregar mais peças tão pesadas daqui em diante...... então continue sendo meu parceiro!"
20002-1448 = "Combinado. Conto com você também, Saya"
