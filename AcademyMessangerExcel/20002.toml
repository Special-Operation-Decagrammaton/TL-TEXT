[translation]
20002-1383 = "Можете ненадолго зайти в мою лабораторию?"
20002-1384 = "Зачем?"
20002-1385 = "У нас в лаборатории серьёзная проблема!"
20002-1386 = "Очень особенная проблема, которую можете решить только вы!"
20002-1387 = "Буду ждать вас там!"
20002-1388 = "...?"
20002-1389 = "Вам уже лучше, Сенсей?"
20002-1390 = "Лицо всё ещё светится. Я едва могу смотреть в зеркало."
20002-1391 = "Ого, если даже в зеркало смотреть не можете, сияние должно быть впечатляющим."
20002-1392 = "Ничего впечатляющего!"
20002-1393 = "В любом случае можно мне один кусочек золота, который осыпался с вашей кожи?"
20002-1394 = "Хочу исследовать эти компоненты для следующего проекта."
20002-1395 = "Нет."
20002-1396 = "Уф! Почему?"
20002-1397 = "Мне это нужно, чтобы продвинуть искусство алхимии!"
20002-1398 = "Можете ещё раз прийти в лабораторию, Сенсей?"
20002-1399 = "У меня плохое предчувствие..."
20002-1400 = "Нет, я сделала эликсир бессмертия! На этот раз настоящий!"
20002-1401 = "Если не верите, приходите в лабораторию и убедитесь сами!"
20002-1402 = "Не могу поверить, что допустила такую ошибку... Простите, Сенсей."
20002-1403 = "Я и не думала, что такая маленькая ошибка станет такой большой проблемой."
20002-1404 = "Понимаю, это немного, но..."
20002-1405 = "В следующий раз куплю вам вкусной лапши на Променаде."
20002-1406 = "Можно мне немного того серого меха...?"
20002-1407 = "Нет."
20002-1408 = "Уф... От этого зависит будущее алхимии..."
20002-1409 = "Мне так жаль из-за прошлого раза, Сенсей."
20002-1410 = "Я куплю вам вкусной лапши в знак извинения. Встретимся на Променаде Чёрной Черепахи!"
20002-1411 = "Вкусной лапши...?"
20002-1412 = "Да, я знаю отличное место на Променаде."
20002-1413 = "Когда придёте, откроете для себя совершенно новый мир лапши!"
20002-1414 = "Разве лапша в прошлый раз не была отличной?"
20002-1415 = "В следующий раз давайте снова сходим на Променад Чёрной Черепахи!"
20002-1416 = "Интересно, где сейчас Банда Шлемов? Те, кому ты дала таблетки для похудения..."
20002-1417 = "А? О, вы про тех ребят..."
20002-1418 = "Не знаю. Наверное, где-то объедаются сахаром."
20002-1419 = "Вам в последнее время не скучно, Сенсей?"
20002-1420 = "Я занят работой."
20002-1421 = "Ой, да ладно. Я достала занятную настольную игру, которую можно попробовать."
20002-1422 = "Хотела сыграть сразу, но найти партнёра непросто..."
20002-1423 = "Приходите в лабораторию, если интересно!"
20002-1424 = "Как-нибудь загляну."
20002-1425 = "Не могу поверить, что проиграла в такой простой игре... Уф!"
20002-1426 = "В следующий раз я не проиграю! Вот увидите, Сенсей!"
20002-1427 = "Думаю, сначала тебе стоит что-то сделать с этой одержимостью сыром..."
20002-1428 = "Мне нужно сказать кое-что важное, Сенсей."
20002-1429 = "Что-то важное? Что именно?"
20002-1430 = "Это... ну... Я не могу сказать в сообщении!"
20002-1431 = "Это очень важно..."
20002-1432 = "Приходите в лабораторию сразу после работы в Шале."
20002-1433 = "Буду ждать."
20002-1434 = "Сегодня во время дневного сна мне приснился потрясающий сон, Сенсей!"
20002-1435 = "А когда я проснулась, прямо передо мной лежал огромный кусок сыра."
20002-1436 = "Кажется, столько сыра я не ела ни разу в жизни. Даже во сне!"
20002-1437 = "..."
20002-1438 = "Кстати, почему у вас вся рука в порезах?"
20002-1439 = "Вы что, подрались с диким животным?"
20002-1440 = "..."
20002-1441 = "С-Сенсей! У нас проблема! Большая проблема!"
20002-1442 = "Приходите в лабораторию, как только увидите это!"
20002-1443 = "Спасибо, что помогли найти Нэдзусукэ, Сенсей."
20002-1444 = "Я рада, что Нэдзусукэ в безопасности."
20002-1445 = "Пустяки."
20002-1446 = "Кажется, я была слишком строга с Нэдзусукэ и даже с вами, Сенсей..."
20002-1447 = "Я запомню этот урок... Обещаю больше не устраивать вам обоим жестоких розыгрышей!"
20002-1448 = "Спасибо, Сая."
