[translation]
20002-1383 = "Сенсей, не могли бы вы зайти в мою лабораторию?"
20002-1384 = "Что-то случилось?"
20002-1385 = "Это очень важное дело, связанное с моими исследованиями!"
20002-1386 = "И притом особая проблема, решить которую можете только вы...!"
20002-1387 = "Так что я жду вас в лаборатории!"
20002-1388 = "...?"
20002-1389 = "То сияние уже прошло?"
20002-1390 = "Моё лицо всё ещё блестит, и каждый раз, когда я смотрю в зеркало, глаза..."
20002-1391 = "Сиять так, что невозможно смотреть в зеркало, – это же замечательно."
20002-1392 = "Ничего замечательного!?"
20002-1393 = "Кстати, если не сложно, не дадите мне кусочек золотой фольги, которая отслоилась от кожи?"
20002-1394 = "Я хочу изучить её состав и использовать в следующем исследовании."
20002-1395 = "Нет."
20002-1396 = "У-у-у! Почему!?"
20002-1397 = "Ведь это нужно для развития алхимии!"
20002-1398 = "Сенсей, не могли бы вы снова прийти в лабораторию?"
20002-1399 = "Подозрительно..."
20002-1400 = "Не волнуйтесь, на этот раз я действительно создала эликсир бессмертия!"
20002-1401 = "Если не верите, приходите в лабораторию и убедитесь сами!"
20002-1402 = "Что я могла допустить такую ошибку... Простите, Сенсей."
20002-1403 = "Я сама в шоке от того, что так вышло."
20002-1404 = "Вместо извинений,"
20002-1405 = "в следующий раз я угощу вас вкусным раменом в Торговом квартале Генбу."
20002-1406 = "...И ещё, если можно... не могли бы вы дать мне немного тех блестящих серых волосков?"
20002-1407 = "Нет."
20002-1408 = "У-у... Будущее алхимии бессмертия..."
20002-1409 = "Простите меня за прошлый раз, Сенсей."
20002-1410 = "В качестве извинения я угощу вас вкусным раменом, так что ждите меня у Торгового квартала Генбу!"
20002-1411 = "Вкусный рамен...?"
20002-1412 = "Да, я знаю одно отличное место."
20002-1413 = "Там очень вкусно, уверена, вам тоже понравится!"
20002-1414 = "Тот рамен, что мы ели вместе в прошлый раз, был действительно вкусным."
20002-1415 = "Давайте как-нибудь снова сходим в Торговый квартал Генбу!"
20002-1416 = "Да, обязательно. Кстати, что стало с той бандой шлемов, которой я передала то зелье?"
20002-1417 = "Хм...? Ах да, были такие..."
20002-1418 = "Ну, наверное, где-нибудь лижут сахар, небось."
20002-1419 = "Сенсей, вы же недавно свободны?"
20002-1420 = "Вечно занят работой..."
20002-1421 = "Эй, не будьте таким серьёзным. Я раздобыла одну интересную настольную игру."
20002-1422 = "Хочу попробовать, но она для двоих, так что нужен партнёр."
20002-1423 = "Если вам интересно, заходите в лабораторию!"
20002-1424 = "Я зайду, когда закончу работу."
20002-1425 = "У-у, проиграть в такой простой игре... Как обидно!"
20002-1426 = "В следующий раз я не проиграю! Готовьтесь, Сенсей!"
20002-1427 = "Разве не нужно сначала избавиться от одержимости сыром, а не от игры...?"
20002-1428 = "Сенсей... Сегодня у меня есть к вам важный разговор."
20002-1429 = "Важный? О чём?"
20002-1430 = "Это... нет, я не могу сказать вот так...!"
20002-1431 = "Это очень серьёзный разговор, так что..."
20002-1432 = "сегодня, когда закончите работу в Шале, сразу приходите в лабораторию, хорошо?"
20002-1433 = "Я буду ждать вас."
20002-1434 = "Сенсей, я недавно вздремнула и увидела замечательный сон."
20002-1435 = "Очнулась, а передо мной огромный кусок сыра..."
20002-1436 = "Я впервые во сне ела столько сыра!"
20002-1437 = "..."
20002-1438 = "Кстати, почему у вас на руках столько царапин?"
20002-1439 = "Дрались с дикими животными?"
20002-1440 = "..."
20002-1441 = "Сенсей, сенсей! Беда! ЧП!"
20002-1442 = "Как увидите это сообщение, сразу бегите в лабораторию!"
20002-1443 = "Спасибо, что помогли мне найти Незусуке. Будем дружить и дальше!"
20002-1444 = "Хорошо, что Незусуке нашёлся."
20002-1445 = "Я ничего особенного не сделал."
20002-1446 = "Если подумать, я слишком много плохого сделала и Незусуке, и вам..."
20002-1447 = "Я больше не буду зло шутить... Так что давайте дружить и дальше!"
20002-1448 = "Хорошо. Будем дружить и дальше, Сайя."