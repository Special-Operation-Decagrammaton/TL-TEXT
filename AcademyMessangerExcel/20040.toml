[translation]
20040-200400010 = "Сенсей, вы сейчас свободны?"
20040-200400020 = "Как сотрудник Пандемониума,"
20040-200400030 = "не поможете мне снова?"
20040-200400040 = "А, Сацуки...?"
20040-200400050 = "Что случилось?"
20040-200400060 = "Хм... думаю, лучше поговорить лично."
20040-200400070 = "У меня есть и другие дела."
20040-200400080 = "Я сейчас приду в Шале."
20040-200400090 = "Эй!?"
20040-200400100 = "Здравствуйте, Сенсей."
20040-200400110 = "В прошлый раз всё было ужасно,"
20040-200400120 = "но в этот раз я попробую другой способ."
20040-200400130 = "Вы ведь в Шале?"
20040-200400140 = "Хм...?"
20040-200400150 = "Да, я здесь...?"
20040-200400160 = "Тогда оставайтесь на месте."
20040-200400170 = "Я уже иду!"
20040-200400180 = "Сацуки...?"
20040-200400190 = "Эй!?"
20040-200400200 = "Радуйтесь, Сенсей."
20040-200400210 = "Ура!"
20040-200400220 = "У-хе-хе"
20040-200400230 = "Вы так радуетесь ещё до того, как я что-то сказала."
20040-200400240 = "Вам интересно, что случилось?"
20040-200400250 = "Что-то мне не нравится этот тон..."
20040-200400260 = "Я хочу провести эксперимент на вас..."
20040-200400270 = "Нет, лучше встретиться и поговорить."
20040-200400280 = "Я сейчас приду!"
20040-200400290 = "Сацуки...?"
20040-200400300 = "Я выполнила приказ и вернулась отдохнуть."
20040-200400310 = "Похоже, гипноз уже снят,"
20040-200400320 = "но нельзя быть беспечной."
20040-200400330 = "Хорошо, что ты благополучно вернулась."
20040-200400340 = "И ещё,"
20040-200400350 = "о моей настоящей цели"
20040-200400360 = "ни слова, хорошо?"
20040-200400370 = "Такой грандиозный заговор"
20040-200400380 = "нельзя раскрывать."
20040-200400390 = "Да, не волнуйся, я никому не скажу."
20040-200400400 = "Ну тогда"
20040-200400410 = "до встречи."
20040-200400420 = "Сенсей, всё серьёзно."
20040-200400430 = "Если так продолжится, информационный отдел,"
20040-200400440 = "нет, возможно,"
20040-200400450 = "весь Пандемониум рухнет."
20040-200400460 = "Что ты имеешь в виду?"
20040-200400470 = "Сацуки? Ты в порядке?"
20040-200400480 = "Чёрт"
20040-200400490 = "Опасность близко."
20040-200400500 = "Но я не сдамся."
20040-200400510 = "Сацуки, где ты сейчас?"
20040-200400520 = "Это место..."
20040-200400530 = "Сенсей"
20040-200400540 = "Ты хорошо держался, раз выдержал такое."
20040-200400550 = "Видимо, этому миру действительно нужен NK Ultra Project."
20040-200400560 = "Я создам мир, в котором не нужны прививки."
20040-200400570 = "Чтобы никто больше не страдал так."
20040-200400580 = "Но ведь тогда пострадают ещё больше людей..."
20040-200400590 = "В любом случае,"
20040-200400600 = "сегодня ты меня спас."
20040-200400610 = "Здравствуйте, Сенсей."
20040-200400620 = "Сегодня я дежурная."
20040-200400630 = "Будь осторожна, Сацуки."
20040-200400640 = "Как запасной сотрудник Пандемониума"
20040-200400650 = "и как соперник,"
20040-200400660 = "я могу хорошенько понаблюдать за вами."
20040-200400670 = "Отличная возможность."
20040-200400680 = "Разве такие вещи говорят не про себя...?"
20040-200400690 = "Ждите меня."
20040-200400700 = "Я уже иду!"