[translation]
20040-200400010 = "Sensei? Tem um minutinho?"
20040-200400020 = "Como colaborador da Sociedade Pandemonium,"
20040-200400030 = "poderia me ajudar desta vez também?"
20040-200400040 = "Ué, Satsuki...?"
20040-200400050 = "Aconteceu alguma coisa?"
20040-200400060 = "Hum... Acho melhor conversarmos pessoalmente sobre isso"
20040-200400070 = "Também tenho outros assuntos a tratar,"
20040-200400080 = "então estou indo para a Schale agora mesmo"
20040-200400090 = "Espera aí?!"
20040-200400100 = "Olá, Sensei"
20040-200400110 = "Da última vez foi um desastre, mas"
20040-200400120 = "desta vez pretendo testar outro método"
20040-200400130 = "Você está na Schale agora, não está?"
20040-200400140 = "Sim...?"
20040-200400150 = "Estou sim...?"
20040-200400160 = "Então fique aí mesmo me esperando"
20040-200400170 = "Estou indo para aí!"
20040-200400180 = "Satsuki...?"
20040-200400190 = "Calma aí?!"
20040-200400200 = "Alegre-se, Sensei"
20040-200400210 = "Aêêê!"
20040-200400220 = "Ufufu"
20040-200400230 = "Ficar tão feliz assim antes mesmo de eu contar..."
20040-200400240 = "Deve estar curioso para saber o que aconteceu, não é?"
20040-200400250 = "Estou com um mau pressentimento..."
20040-200400260 = "Usando o Sensei como cobaia..."
20040-200400270 = "Quer dizer, acho melhor falarmos pessoalmente mesmo"
20040-200400280 = "Estou indo para aí agora!"
20040-200400290 = "Satsuki...?"
20040-200400300 = "Conforme ordenado, voltei para casa e descansei bastante"
20040-200400310 = "Parece que a hipnose já foi desfeita, mas"
20040-200400320 = "realmente não posso baixar a guarda"
20040-200400330 = "Que bom que conseguiu voltar em segurança"
20040-200400340 = "Ah, e"
20040-200400350 = "sobre o meu verdadeiro objetivo,"
20040-200400360 = "mantenha em segredo, viu?"
20040-200400370 = "Uma conspiração gigantesca dessas"
20040-200400380 = "jamais pode vir a público"
20040-200400390 = "Pode deixar, vou guardar segredo, não se preocupe"
20040-200400400 = "Bom,"
20040-200400410 = "até mais"
20040-200400420 = "Sensei, temos um problemão"
20040-200400430 = "Desse jeito, o Departamento de Inteligência..."
20040-200400440 = "Não, quem sabe"
20040-200400450 = "toda a Sociedade Pandemonium entre em colapso!"
20040-200400460 = "Como assim?"
20040-200400470 = "Satsuki? Tudo bem com você?"
20040-200400480 = "Argh..."
20040-200400490 = "O perigo está bem diante dos meus olhos"
20040-200400500 = "Mas eu não vou desistir"
20040-200400510 = "Satsuki, onde você está agora?"
20040-200400520 = "Aqui é..."
20040-200400530 = "Sensei"
20040-200400540 = "Admiro que tenha conseguido aguentar aquilo"
20040-200400550 = "Realmente, este mundo precisa do Projeto NK Ultra"
20040-200400560 = "Vou criar um mundo onde vacinas não sejam necessárias"
20040-200400570 = "Para que ninguém mais precise sofrer desse jeito"
20040-200400580 = "Mas isso não acabaria causando um sofrimento ainda maior...?"
20040-200400590 = "De qualquer forma,"
20040-200400600 = "você me salvou hoje"
20040-200400610 = "Olá, Sensei"
20040-200400620 = "Hoje é o meu dia de plantão"
20040-200400630 = "Venha com cuidado, Satsuki"
20040-200400640 = "É a oportunidade perfeita"
20040-200400650 = "para observar bem de pertinho o Sensei,"
20040-200400660 = "que é tanto um colaborador reserva da Sociedade Pandemonium"
20040-200400670 = "quanto o meu rival"
20040-200400680 = "Normalmente as pessoas não pensam esse tipo de coisa só consigo mesmas...?"
20040-200400690 = "Espere por mim"
20040-200400700 = "Estou indo para aí agora!"
