[translation]
20040-200400010 = "Сенсей!"
20040-200400020 = "Как партнёр Общества Пандемониума,"
20040-200400030 = "пожалуйста, сотрудничайте со мной снова."
20040-200400040 = "Сацуки...?"
20040-200400050 = "Что это значит?"
20040-200400060 = "Лучше объяснить это лично."
20040-200400070 = "И есть ещё один вопрос, о котором я хотела вам сообщить."
20040-200400080 = "Я прямо сейчас направляюсь в Шале!"
20040-200400090 = "Простите?!"
20040-200400100 = "Сенсей"
20040-200400110 = "Сегодня я собираюсь испытать"
20040-200400120 = "другой метод"
20040-200400130 = "Вы ведь в Шале?"
20040-200400140 = "А...?"
20040-200400150 = "Да, но..."
20040-200400160 = "Тогда оставайтесь там."
20040-200400170 = "Скоро буду!"
20040-200400180 = "Сацуки...?"
20040-200400190 = "Что?!"
20040-200400200 = "Радуйтесь, Сенсей!"
20040-200400210 = "Ва-ха-ха!"
20040-200400220 = "Фуфу, вы так рады,"
20040-200400230 = "хотя ещё даже не слышали подробностей."
20040-200400240 = "Вам любопытно, верно?"
20040-200400250 = "У меня плохое предчувствие..."
20040-200400260 = "Вы будете целью"
20040-200400270 = "Эм, вообще-то, думаю, лучше объяснить лично"
20040-200400280 = "Скоро буду!"
20040-200400290 = "Сацуки...?"
20040-200400300 = "Я долго отдыхала, как вы и велели."
20040-200400310 = "Похоже, страшная сила гипноза наконец рассеялась."
20040-200400320 = "Мне действительно нельзя терять бдительность"
20040-200400330 = "Рад, что ты благополучно вернулась."
20040-200400340 = "И ещё"
20040-200400350 = "насчёт моей истинной цели"
20040-200400360 = "пожалуйста, держите её в тайне"
20040-200400370 = "Такой подробный план"
20040-200400380 = "нужно осуществлять скрытно."
20040-200400390 = "Я сохраню это в секрете. Не волнуйся."
20040-200400400 = "Хорошо"
20040-200400410 = "До встречи!"
20040-200400420 = "Сенсей, у нас проблема огромного масштаба."
20040-200400430 = "Такими темпами Разведывательный комитет"
20040-200400440 = "нет, ещё хуже..."
20040-200400450 = "само Общество Пандемониум рухнет!!!"
20040-200400460 = "Что это значит?"
20040-200400470 = "Сацуки? Ты в порядке?"
20040-200400480 = "Ц"
20040-200400490 = "Кризис уже у нашего порога!"
20040-200400500 = "Но я буду сражаться до конца!"
20040-200400510 = "Сацуки, ты где?"
20040-200400520 = "Где я..."
20040-200400530 = "Сенсей"
20040-200400540 = "Ты правда выдержала этот укол"
20040-200400550 = "Этому миру отчаянно нужен проект NK Ultra"
20040-200400560 = "Я создам мир, где не существует никаких вакцин"
20040-200400570 = "Чтобы никто больше так не страдал"
20040-200400580 = "Но тогда люди будут страдать ещё больше..."
20040-200400590 = "В любом случае"
20040-200400600 = "Сегодня это помогло"
20040-200400610 = "Здравствуйте, Сенсей"
20040-200400620 = "Сегодня я буду представителем студентов."
20040-200400630 = "Будь осторожна по дороге сюда, Сацуки."
20040-200400640 = "Это хороший шанс"
20040-200400650 = "внимательно понаблюдать за Сенсеем,"
20040-200400660 = "будущим партнёром Общества Пандемониума"
20040-200400670 = "и соперником"
20040-200400680 = "Может, лучше не говорить это вслух?"
20040-200400690 = "Ждите там"
20040-200400700 = "Скоро буду!"
