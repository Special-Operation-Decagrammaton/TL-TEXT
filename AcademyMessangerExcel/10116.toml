[translation]
10116-101160010 = "Sensei, você está ocupado agora?"
10116-101160020 = "Nadica de nada!"
10116-101160030 = "Estava justamente à toa!"
10116-101160040 = "A-Ah, entendo."
10116-101160050 = "Há um assunto sobre o qual gostaria de pedir o seu conselho pessoalmente, Sensei."
10116-101160060 = "Desculpe o incômodo, mas posso ir até a Schale?"
10116-101160070 = "Claro!"
10116-101160080 = "Você é bem-vinda a qualquer hora!"
10116-101160090 = "...Ciente."
10116-101160100 = "Já estou a caminho."
10116-101160110 = "Sensei, sou eu."
10116-101160120 = "Graças a todas aquelas tentativas que fizemos,"
10116-101160130 = "sinto que estou começando a entender como fazer poses naturais."
10116-101160140 = "...Obrigada."
10116-101160150 = "Algum dia retribuirei esta dívida sem falta."
10116-101160160 = "Se eu puder tirar fotos suas, Saori, já está mais do que pago..."
10116-101160170 = "De jeito nenhum!"
10116-101160180 = "Sensei, você tem um momento agora?"
10116-101160190 = "Claro! O que houve?"
10116-101160200 = "Bem... tenho um favor para pedir."
10116-101160210 = "Desculpe, mas não tenho mais ninguém além de você a quem recorrer, Sensei."
10116-101160220 = "Assim você me deixa cheio de expectativa!"
10116-101160230 = "Do que se trata?"
10116-101160240 = "É sobre aquele trabalho de modelo do outro dia."
10116-101160250 = "Desta vez, parece que querem tirar fotos minhas dançando com um vestido."
10116-101160260 = "Porém, não tenho experiência alguma com isso."
10116-101160270 = "Se for possível, gostaria que você me ensinasse a dançar."
10116-101160280 = "Às suas ordens!"
10116-101160290 = "Então peço que venha ao endereço que vou enviar agora."
10116-101160300 = "Desculpe pelo trabalho."
10116-101160310 = "Sensei, chegou bem de volta?"
10116-101160320 = "Sei que é repentino, mas"
10116-101160330 = "a equipe de fotografia acabou de entrar em contato comigo."
10116-101160340 = "Disseram que a cena de dança foi cancelada."
10116-101160350 = "Por \"questões internas\", segundo eles,"
10116-101160360 = "o projeto acabou sofrendo alterações."
10116-101160370 = "Sinto muito, depois de você ter aberto espaço na sua agenda por minha causa."
10116-101160380 = "Não esquenta, foi super divertido!"
10116-101160390 = "O nosso treino de dança virou uma lembrança especial só nossa!"
10116-101160400 = "É-É verdade..."
10116-101160410 = "De todo modo, aprendi bastante desta vez também."
10116-101160420 = "Tenho certeza de que isso ainda será útil para alguma coisa no futuro."
10116-101160430 = "Sendo assim,"
10116-101160440 = "continuo contando com você daqui para frente, Sensei."
10116-101160450 = "Sensei."
10116-101160460 = "Você tem algum tempo livre hoje?"
10116-101160470 = "Com certeza!"
10116-101160480 = "Para você, Saori, tenho todo o tempo do mundo!"
10116-101160490 = "Entendo."
10116-101160500 = "O pagamento pelo meu bico de modelo caiu na conta,"
10116-101160510 = "então quero agradecer por tudo o que você tem feito por mim."
10116-101160520 = "Ouvi dizer que, nessas ocasiões, o costume é pagar uma refeição de alta gastronomia."
10116-101160530 = "Eu prefiro um restaurante mais simples e normal mesmo."
10116-101160540 = "É mesmo? Mas..."
10116-101160550 = "O que vale é a intenção!"
10116-101160560 = "Entendo... Compreendido."
10116-101160570 = "Nesse caso, diga-me uma rua gastronômica que você costume frequentar, Sensei."
10116-101160580 = "Estarei esperando lá."
10116-101160590 = "Sensei."
10116-101160600 = "Bem... hoje foi muito divertido."
10116-101160610 = "A comida também estava excelente."
10116-101160620 = "Eu queria agradecer a você,"
10116-101160630 = "mas no fim acabei ficando em dívida novamente."
10116-101160640 = "Eu que agradeço! Não se preocupe com isso!"
10116-101160650 = "Na próxima vez, deixe que eu retribua sem falta."
10116-101160660 = "Ah, e só por garantia:"
10116-101160670 = "Não mostre a foto de hoje para mais ninguém, em hipótese alguma."
10116-101160680 = "Em hipótese alguma, entendeu?"
