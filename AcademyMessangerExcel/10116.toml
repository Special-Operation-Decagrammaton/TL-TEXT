[translation]
10116-101160010 = "Сенсей, вы сейчас заняты?"
10116-101160020 = "Вовсе нет!"
10116-101160030 = "Как раз было свободное время!"
10116-101160040 = "П-понятно."
10116-101160050 = "Мне нужно получить от вас совет лично."
10116-101160060 = "Прошу прощения, могу я прийти в Шале?"
10116-101160070 = "Конечно!"
10116-101160080 = "Всегда рад!"
10116-101160090 = "... Поняла."
10116-101160100 = "Сейчас приду."
10116-101160110 = "Сенсей, это я."
10116-101160120 = "Благодаря тому, что я много пробовала,"
10116-101160130 = "кажется, я начала понимать естественные позы."
10116-101160140 = "... Спасибо."
10116-101160150 = "Этот долг я когда-нибудь обязательно верну."
10116-101160160 = "Если я смогу сфотографировать Саори, то..."
10116-101160170 = "Нет!"
10116-101160180 = "Сенсей, вы сейчас свободны?"
10116-101160190 = "Конечно! Что случилось?"
10116-101160200 = "Ну... у меня есть просьба."
10116-101160210 = "Прошу прощения, кроме вас мне не на кого положиться."
10116-101160220 = "Звучит заманчиво!"
10116-101160230 = "Что за дело?"
10116-101160240 = "Это по поводу той съёмки модели, что была недавно."
10116-101160250 = "На этот раз, похоже, хотят сфотографировать меня в платье танцующей."
10116-101160260 = "Но у меня нет опыта."
10116-101160270 = "Если возможно, я хочу, чтобы вы научили меня танцевать."
10116-101160280 = "Как скажете!"
10116-101160290 = "Тогда приходите по адресу, который я сейчас отправлю."
10116-101160300 = "Простите за беспокойство."
10116-101160310 = "Сенсей, вы благополучно добрались?"
10116-101160320 = "Внезапно"
10116-101160330 = "только что пришло сообщение от съёмочной группы."
10116-101160340 = "Говорят, сцена с танцем отменяется."
10116-101160350 = "По каким-то взрослым причинам."
10116-101160360 = "Похоже, планы изменились."
10116-101160370 = "Прошу прощения, что зря потратила ваше время."
10116-101160380 = "Было весело, так что всё в порядке!"
10116-101160390 = "Танцевальная тренировка стала нашим общим воспоминанием!"
10116-101160400 = "Д-да, наверное..."
10116-101160410 = "В любом случае, и сегодняшний день был поучительным."
10116-101160420 = "Это, наверное, ещё пригодится."
10116-101160430 = "Ну что ж,"
10116-101160440 = "буду и дальше рассчитывать на вас, Сенсей."
10116-101160450 = "Сенсей,"
10116-101160460 = "У вас есть время сегодня?"
10116-101160470 = "Конечно!"
10116-101160480 = "Для Саори у меня всегда найдётся время!"
10116-101160490 = "Вот как."
10116-101160500 = "Я получила деньги за модельскую работу,"
10116-101160510 = "и хочу отблагодарить вас за всё, что вы для меня сделали."
10116-101160520 = "Говорят, в таких случаях угощают дорогим ужином."
10116-101160530 = "А я люблю обычные места."
10116-101160540 = "Правда? Но..."
10116-101160550 = "Главное — это чувства!"
10116-101160560 = "Понятно... Хорошо."
10116-101160570 = "Тогда покажите мне, где вы обычно питаетесь."
10116-101160580 = "Я буду ждать там."
10116-101160590 = "Сенсей,"
10116-101160600 = "Ну... сегодня было очень весело."
10116-101160610 = "Еда была великолепна."
10116-101160620 = "Я хотела отблагодарить вас, но"
10116-101160630 = "опять получилось, что вы меня угостили."
10116-101160640 = "Ну что вы, не переживайте!"
10116-101160650 = "В следующий раз точно позвольте мне отблагодарить вас."
10116-101160660 = "И ещё, на всякий случай скажу:"
10116-101160670 = "Вы ни в коем случае не должны показывать сегодняшние фотографии другим."
10116-101160680 = "Ни за что."