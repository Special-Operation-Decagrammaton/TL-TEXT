[translation]
10116-101160010 = "Сенсей. Вы сейчас заняты?"
10116-101160020 = "Нет! Совсем нет!"
10116-101160030 = "Я как раз совершенно свободен!"
10116-101160040 = "...Понятно."
10116-101160050 = "Мне нужен ваш совет."
10116-101160060 = "Заранее прошу прощения за неудобство, но могу я зайти к вам в Шале?"
10116-101160070 = "Конечно!"
10116-101160080 = "С консультациями всегда пожалуйста!"
10116-101160090 = "...Поняла."
10116-101160100 = "Тогда скоро буду."
10116-101160110 = "Сенсей. Это я."
10116-101160120 = "Всё было очень сумбурно..."
10116-101160130 = "Благодаря вашим урокам я лучше поняла, как принимать естественные позы."
10116-101160140 = "Я пытаюсь сказать... спасибо."
10116-101160150 = "Я отплачу вам."
10116-101160160 = "Достаточно вашей фотографии."
10116-101160170 = "Ни за что!"
10116-101160180 = "Сенсей. У вас есть минутка?"
10116-101160190 = "Всегда! Что случилось?"
10116-101160200 = "Ну... У меня ещё одна просьба."
10116-101160210 = "Простите. Кроме вас мне не к кому обратиться."
10116-101160220 = "А теперь я уже по-настоящему загорелся!"
10116-101160230 = "Для чего?"
10116-101160240 = "Это связано с работой моделью. С прошлым разом."
10116-101160250 = "Меня попросили сфотографироваться в платье во время танца."
10116-101160260 = "Но я не умею танцевать."
10116-101160270 = "Похоже, мне нужен учитель танцев."
10116-101160280 = "Я! Я могу! Прямо сейчас!"
10116-101160290 = "...В таком случае простите, что заставляю вас ехать так далеко,"
10116-101160300 = "но не могли бы вы встретиться со мной по адресу, который я отправила?"
10116-101160310 = "Сенсей. Вы благополучно вернулись?"
10116-101160320 = "Всё произошло немного внезапно,"
10116-101160330 = "но со мной только что связалась съёмочная группа."
10116-101160340 = "...Оказывается, съёмку танца отменили."
10116-101160350 = "У них внезапно изменились планы."
10116-101160360 = "У взрослых возникли личные обстоятельства."
10116-101160370 = "Простите. После того как вы столько времени мне помогали..."
10116-101160380 = "Нет-нет! Мне было очень весело!"
10116-101160390 = "Теперь реверанс Саори принадлежит только мне!"
10116-101160400 = "Н-Неужели?"
10116-101160410 = "Ну, для меня это тоже был новый опыт."
10116-101160420 = "Думаю, он пригодится мне в будущем."
10116-101160430 = "Что ж, тогда."
10116-101160440 = "И дальше буду рассчитывать на вас, Сенсей."
10116-101160450 = "Сенсей."
10116-101160460 = "У вас сегодня есть время?"
10116-101160470 = "Конечно!"
10116-101160480 = "Для тебя моё расписание всегда свободно!"
10116-101160490 = "Понятно."
10116-101160500 = "Я получила зарплату за подработку моделью."
10116-101160510 = "Я надеялась потратить её, чтобы отплатить вам за всё."
10116-101160520 = "Я слышала, что в таких ситуациях нужно угостить вас дорогой едой в дорогом ресторане."
10116-101160530 = "Простая еда — лучшая!"
10116-101160540 = "Хм, вот как? Но..."
10116-101160550 = "Главное — внимание!!"
10116-101160560 = "...Поняла."
10116-101160570 = "Тогда встретимся на той улице с едой, куда вы часто ходите, Сенсей."
10116-101160580 = "Скоро увидимся."
10116-101160590 = "Сенсей."
10116-101160600 = "Мне... мне сегодня было хорошо."
10116-101160610 = "И ваше блюдо было очень вкусным."
10116-101160620 = "Я надеялась сегодня угостить вас,"
10116-101160630 = "но почему-то в итоге больше получила сама."
10116-101160640 = "Вовсе нет. Мне понравилось."
10116-101160650 = "В следующий раз я угощу вас как следует."
10116-101160660 = "Ах... И хочу особо подчеркнуть: вы НИКОГДА не должны"
10116-101160670 = "показывать кому-либо сегодняшнюю фотографию."
10116-101160680 = "Никогда."
