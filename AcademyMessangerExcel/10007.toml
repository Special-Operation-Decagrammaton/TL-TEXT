[translation]
10007-577 = "Sensei, foi mal... você tem um tempinho agora?"
10007-578 = "Tenho sim."
10007-579 = "O que houve?"
10007-580 = "É que... você pode vir me buscar?"
10007-581 = "Parece que precisam de um responsável pra me liberar, e é meio ruim de ligar pro conselho estudantil..."
10007-582 = "O lugar é, hum... o posto policial."
10007-583 = "O posto policial?!"
10007-584 = "Valeu por ter vindo hoje, Sensei."
10007-585 = "Se eu tivesse chamado o conselho estudantil, ia levar uma chuva de sermão em dobro."
10007-586 = "Vê se toma mais cuidado daqui pra frente."
10007-587 = "Tá bom... Vou evitar fazer grafite em espaços públicos..."
10007-588 = "Como prometemos hoje, da próxima vez vamos pintar juntos numa tela bem grandona!"
10007-589 = "É promessa, hein!"
10007-590 = "Sim, prometido."
10007-591 = "Bom trabalho hoje também, Sensei. Cuidado no caminho de volta~!"
10007-592 = "Bom trabalho pra você também, Maki."
10007-593 = "Sensei, você tem alguma coisa pra fazer hoje depois da aula?"
10007-594 = "Eu vou dar um pulo no Merca—"
10007-595 = "Digo, tenho umas coisas pra resolver lá na Zona Sul, então vou indo na frente~"
10007-596 = "...Mercado Negro?"
10007-597 = "Que desperdício... Era a chance perfeita de mostrar o charme de BOOM pra um montão de gente."
10007-598 = "Eu já disse que não pode fazer as coisas causando transtorno pros outros..."
10007-599 = "Uuu, se o Sensei diz que não pode, fazer o quê..."
10007-600 = "Por falar nisso, Sensei, você já jogou BOOM alguma vez?"
10007-601 = "Não, nunca joguei."
10007-602 = "Depois vou baixar pra você, aí a gente faz um \"speedrun\" juntos!"
10007-603 = "Vou ficar do seu lado te ajudando até você conseguir zerar em menos de 3 minutos!"
10007-604 = "Por esse seu tom, quebrar a barreira dos 3 minutos deve ser difícil pra caramba, né...?"
10007-605 = "Sensei, você já ouviu alguém comentar sobre a provinha surpresa de hoje?"
10007-606 = "Estava absurdamente difícil!"
10007-607 = "Tem que estudar e revisar a matéria direitinho no dia a dia, viu?"
10007-608 = "Por acaso caiu questão que não tava na matéria da prova?"
10007-609 = "Urgh, contra fatos não há argumentos..."
10007-610 = "Não, não foi bem isso, mas..."
10007-611 = "Enfim! Desse jeito vou acabar indo parar nas aulas de recuperação~!"
10007-612 = "Me salva, Sensei~!"
10007-613 = "Valeu por me ajudar nos estudos, Sensei!"
10007-614 = "Pra corresponder às suas expectativas, vou tirar nota máxima na próxima prova!"
10007-615 = "Boa, vou ficar na torcida."
10007-616 = "Ah, só mais uma perguntinha:"
10007-617 = "Aquela explicação sobre direito de arrependimento no final do caderno cai nas provas de todas as matérias?"
10007-618 = "Maki-chan, vamos respirar fundo um pouquinho."
10007-619 = "Sensei! Tirei nota máxima naquela prova!"
10007-620 = "Hehe, tudo graças ao reforço que você me deu outro dia!"
10007-621 = "Parabéns! Você também se esforçou bastante nos estudos, Maki."
10007-622 = "Mandei bem, né? Pode me elogiar mais~!"
10007-623 = "Então, como prêmio pelo esforço da Maki, acho que vou pagar um sorvete pra você no centro."
10007-624 = "Sério?! Promessa é dívida, hein, Sensei!"
10007-625 = "Já até tirei print da tela, então nem vem fingir que esqueceu depois!"
10007-626 = "Valeu por me ajudar a recolher o lixo, Sensei."
10007-627 = "E obrigada também por fazer vista grossa pra mim."
10007-628 = "Desta vez você fez com boa intenção, né?"
10007-629 = "Sim! Ah... mas e se a polícia descobrir e me der uma bronca...?"
10007-630 = "Se isso acontecer, você explica que foi um mal-entendido, tá, Sensei?! Promete!"
10007-631 = "Sensei, boas notícias!"
10007-632 = "Assim que vir esta mensagem, pode vir até aquele muro onde fizemos grafite outro dia?"
10007-633 = "O que houve?"
10007-634 = "Quando chegar aqui você vai ver!"
10007-635 = "Ah, e venha com uma roupa que possa sujar!"
10007-636 = "...?"
10007-637 = "Hehe, fazer grafite junto com você foi super divertido, Sensei!"
10007-638 = "Eu também me diverti bastante."
10007-639 = "Mas e se o meu desenho tiver ficado tão ruim que o dono do muro não goste...?"
10007-640 = "Ahaha, ainda tava encanado com isso?"
10007-641 = "Não precisa se preocupar! O grafite é uma arte que expressa a personalidade de cada um."
10007-642 = "E o desenho que você fez transmitiu super bem a sua personalidade, Sensei."
10007-643 = "Tomara que a gente tenha outra oportunidade dessas algum dia!"
