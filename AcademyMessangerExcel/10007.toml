[translation]
10007-577 = "Сенсей, извините... у вас есть минутка?"
10007-578 = "Да, конечно."
10007-579 = "Что случилось?"
10007-580 = "Ну... вы не могли бы прийти и забрать меня?"
10007-581 = "Похоже, нужен поручитель, а связываться со студсоветом неудобно..."
10007-582 = "Место, ну, это... э-э... полицейский участок."
10007-583 = "Полицейский участок!?"
10007-584 = "Спасибо, что пришли сегодня, Сенсей."
10007-585 = "Если бы я связалась со студсоветом, меня бы засыпали нотациями с двух сторон."
10007-586 = "В следующий раз будь осторожнее."
10007-587 = "Ага. В общественных местах я не буду рисовать граффити..."
10007-588 = "Но как мы и договаривались сегодня, в следующий раз будем рисовать вместе на большом холсте!"
10007-589 = "Обещаешь!"
10007-590 = "Да, обещаю."
10007-591 = "Сегодня тоже отлично поработали, Сенсей. Берегите себя по дороге домой~!"
10007-592 = "Маки, ты тоже молодец."
10007-593 = "Сенсей, у вас есть дела после уроков сегодня?"
10007-594 = "Я на Чёрный ры..."
10007-595 = "То есть, у меня дела в южном районе, так что я пойду первая~"
10007-596 = "...На Чёрный рынок?"
10007-597 = "Жалко... ведь был шанс показать прелести BOOM множеству людей."
10007-598 = "Нельзя создавать проблемы другим..."
10007-599 = "Уу, раз Сенсей говорит нельзя, значит, ничего не поделать..."
10007-600 = "Кстати, Сенсей, вы играли в BOOM?"
10007-601 = "Нет, не играл."
10007-602 = "Тогда я скачаю вам, и мы вместе пройдём «Спидран»!"
10007-603 = "Я буду рядом и помогу, пока вы не научитесь проходить за 3 минуты!"
10007-604 = "Судя по твоим словам, пройти за 3 минуты, наверное, очень сложно...?"
10007-605 = "Сенсей, вы слышали о сегодняшнем тесте от кого-то ещё?"
10007-606 = "Это было невероятно сложно!"
10007-607 = "Нужно регулярно готовиться и повторять материал."
10007-608 = "Или, может, были вопросы не по программе?"
10007-609 = "Уф, справедливо..."
10007-610 = "Нет, не то..."
10007-611 = "Короче! Если так пойдёт дальше, я попаду на дополнительные занятия~!"
10007-612 = "Сенсей, помогите~!"
10007-613 = "Спасибо, что помогли с учёбой, Сенсей."
10007-614 = "Чтобы оправдать ваши ожидания, на следующем тесте я получу полный балл!"
10007-615 = "Хорошо, буду ждать."
10007-616 = "Ах, ещё один вопрос:"
10007-617 = "будет ли объяснение про «период охлаждения» в конце тетради на всех предметах?"
10007-618 = "Маки, давай успокоимся."
10007-619 = "Сенсей! Я получила полный балл на прошлом тесте!"
10007-620 = "Хе-хе, спасибо, что вы позанимались со мной!"
10007-621 = "Поздравляю, Маки. Ты тоже хорошо постаралась."
10007-622 = "Круто, правда? Хвалите меня больше~!"
10007-623 = "Тогда за старания я куплю тебе мороженое в городе."
10007-624 = "Правда!? Обещаете, Сенсей!"
10007-625 = "Я уже сделала скриншот, так что не пытайтесь потом сделать вид, что не знаете!"
10007-626 = "Спасибо, что помогли убрать мусор, Сенсей."
10007-627 = "И за то, что не стали наказывать. Спасибо."
10007-628 = "То, что случилось сегодня, было ведь добрым намерением, да?"
10007-629 = "Да! А... но что, если полицейский заметит и рассердится..."
10007-630 = "Тогда вы скажете: «Это не так»! Обещаете!"
10007-631 = "Сенсей, хорошие новости!"
10007-632 = "Когда увидите это сообщение, приходите к той стене, где мы рисовали граффити."
10007-633 = "Что случилось?"
10007-634 = "Придёте — узнаете!"
10007-635 = "Ах, наденьте одежду, которую не жалко испачкать!"
10007-636 = "...?"
10007-637 = "Хе-хе, было весело рисовать граффити вместе с вами, Сенсей!"
10007-638 = "Мне тоже было весело."
10007-639 = "А что, если владельцу стены не понравится, потому что я плохо рисую..."
10007-640 = "Аха-ха, ты всё ещё переживаешь?"
10007-641 = "Не волнуйся, граффити — это искусство, выражающее индивидуальность."
10007-642 = "В твоём рисунке тоже было достаточно твоей индивидуальности."
10007-643 = "Хорошо бы, когда-нибудь ещё был такой случай."
