[translation]
10007-577 = "Сенсей, простите... у вас есть минутка?"
10007-578 = "Конечно."
10007-579 = "Что случилось?"
10007-580 = "Эм, можете меня забрать?"
10007-581 = "Сказали, что для освобождения нужен поручитель, но я не хочу связываться со студсоветом."
10007-582 = "Сейчас я... в полицейском участке."
10007-583 = "В полицейском участке?!"
10007-584 = "Спасибо за помощь сегодня, Сенсей."
10007-585 = "Я думала, меня потащат в студсовет Миллениума."
10007-586 = "Больше не устраивай неприятностей в городе."
10007-587 = "Хорошо. Больше не буду рисовать теги в общественных местах..."
10007-588 = "В следующий раз будем рисовать на холсте. Вместе!"
10007-589 = "Пообещайте! Обещаете?"
10007-590 = "Хорошо, обещаю."
10007-591 = "Сегодня вы хорошо потрудились, Сенсей. До свидания!"
10007-592 = "Сегодня ты многое сделала."
10007-593 = "Сенсей, у вас есть планы после уроков?"
10007-594 = "Я собиралась после школы на Чёрный рынок..."
10007-595 = "Нет, то есть, мне нужно кое-что сделать в Южном районе, так что я пошла!"
10007-596 = "На Чёрный рынок?"
10007-597 = "Эх, жаль... Была отличная возможность показать людям всю прелесть BOOM."
10007-598 = "Это было бы настоящим неудобством... для всех остальных."
10007-599 = "Ладно, раз вы так говорите..."
10007-600 = "Кстати, Сенсей. Вы когда-нибудь играли в BOOM?"
10007-601 = "Нет, не играл."
10007-602 = "Тогда установлю её на ваш телефон. Давайте вместе пройдём на скорость!"
10007-603 = "Я помогу вам пройти меньше чем за три минуты!"
10007-604 = "А есть какая-то особая причина для этого испытания?"
10007-605 = "Сенсей, вы видели тот тест?"
10007-606 = "Он был ужасно сложным!"
10007-607 = "Значит, нужно было лучше учиться и тщательнее готовиться."
10007-608 = "Вопросы были не такими, как ты ожидала?"
10007-609 = "Уф, вы меня подловили, но..."
10007-610 = "То есть нет, но..."
10007-611 = "Такими темпами мне придётся ходить на дополнительные занятия!"
10007-612 = "Пожалуйста, помогите мне, Сенсей!"
10007-613 = "Спасибо, что помогли мне подготовиться, Сенсей."
10007-614 = "На следующем тесте я точно получу высший балл! Я оправдаю ваши ожидания!"
10007-615 = "Жду этого с нетерпением."
10007-616 = "...Кстати, Сенсей."
10007-617 = "Объяснение про период охлаждения на обороте конспекта... Для какого это экзамена?"
10007-618 = "Маки, давай сначала ещё раз проверим темы экзамена."
10007-619 = "Сенсей! Я получила высший балл на пересдаче!"
10007-620 = "Хи-хи. Без вашего особого урока я бы не справилась."
10007-621 = "Поздравляю. Ты очень старалась."
10007-622 = "Я ведь здорово справилась? Скажите, что я молодец! Ну же!"
10007-623 = "Раз ты так старалась ради экзамена, свожу тебя в город за мороженым."
10007-624 = "Правда? Обещаете, Сенсей?"
10007-625 = "Я сделала скриншот этого сообщения, так что отменить уже не получится!"
10007-626 = "Спасибо, что помогли убрать мусор, Сенсей."
10007-627 = "...И спасибо, что сделали вид, будто ничего не знаете о граффити."
10007-628 = "На этот раз ты пыталась сделать хорошее дело."
10007-629 = "Уф... Но что, если тот полицейский узнает и у меня будут проблемы?"
10007-630 = "Если так случится, поговорите с полицейским за меня, ладно?"
10007-631 = "Сенсей, у меня хорошие новости!"
10007-632 = "Когда увидите это сообщение, приходите к стене, на которой я раньше рисовала."
10007-633 = "Что случилось?"
10007-634 = "Когда придёте, поймёте!"
10007-635 = "А, и обязательно наденьте одежду, которую не жалко испачкать!"
10007-636 = "...?"
10007-637 = "Хи-хи, сегодня было так весело рисовать с вами граффити, Сенсей."
10007-638 = "Мне тоже было очень весело."
10007-639 = "Как думаете, владельцу стены не понравится мой рисунок? Он ведь не слишком неряшливый?"
10007-640 = "Ха-ха, что? Ты всё ещё об этом переживаешь?"
10007-641 = "Не волнуйся. Граффити - это искусство, выражающее индивидуальность."
10007-642 = "По-моему, твой рисунок отлично передаёт твою личность."
10007-643 = "Надеюсь, скоро снова представится такая возможность!"
