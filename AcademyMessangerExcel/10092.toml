[translation]
10092-100920010 = "Сенсей!"
10092-100920020 = "Я только что поняла. Нам нужна форма для группы."
10092-100920030 = "Я вроде как наш дизайнер..."
10092-100920040 = "Значит, форму должна придумать я, да?"
10092-100920050 = "Похоже на то."
10092-100920060 = "Тебя что-то беспокоит?"
10092-100920070 = "Ну..."
10092-100920080 = "Не знаю, справлюсь ли со всем этим одна."
10092-100920090 = "Это ты вообще-то записал меня на это, Сенсей."
10092-100920100 = "Так что обязан помочь!"
10092-100920110 = "Ты зовёшь меня на свидание?"
10092-100920120 = "Хм. Очень ловко, Ёшими."
10092-100920130 = "?"
10092-100920140 = "А."
10092-100920150 = "ㅡㅡ;;;"
10092-100920160 = "Можешь перестать прикалываться?"
10092-100920170 = "Я отправляю место. Увидимся там!"
10092-100920180 = "Так что, эм..."
10092-100920190 = "Эм..."
10092-100920200 = "В итоге это оказалась огромная просьба."
10092-100920210 = "Клянусь, я не думала, что всё будет так..."
10092-100920220 = "Не парься. Мне понравилось."
10092-100920230 = "Вся эта милота была моей оплатой."
10092-100920240 = "..."
10092-100920250 = "Я не знаю, как реагировать, когда ты такой добрый..."
10092-100920260 = "В любом случае"
10092-100920270 = "Я правда благодарна."
10092-100920280 = "Так что спасибо, Сенсей. Я обязательно тебе отплачу!"
10092-100920290 = "А."
10092-100920300 = "У меня никак не получается... но, может, это не так уж важно."
10092-100920310 = "...?"
10092-100920320 = "Что?"
10092-100920330 = "Не-а."
10092-100920340 = "Я пыталась кое-что нарисовать... Но никак не выходит так, как я хочу."
10092-100920350 = "Ты рисуешь?"
10092-100920360 = "Это дизайн для группы?"
10092-100920370 = "Сенсей!"
10092-100920380 = "Не против... посмотреть?"
10092-100920390 = "Что такое?"
10092-100920400 = "Ты что, заболела?"
10092-100920410 = "Нельзя просто забить на это на день?"
10092-100920420 = "Это синдром, от которого умрёшь, если проигнорировать?"
10092-100920430 = "Ха-ха. Ладно. Хорошее оправдание."
10092-100920440 = "Хорошо, пусть будет так!"
10092-100920450 = "А."
10092-100920460 = "Ахахаха"
10092-100920470 = "Я тааак бешусь"
10092-100920480 = "Ахахахахаха"
10092-100920490 = "Да сдохни ты!"
10092-100920500 = "Сенсей!"
10092-100920510 = "Это важно, ясно?"
10092-100920520 = "Вы заняты?"
10092-100920530 = "Что-то важное?"
10092-100920540 = "Звучит очень серьёзно."
10092-100920550 = "А."
10092-100920560 = "Эм, ну, да..."
10092-100920570 = "Если у тебя есть время, можешь прийти ко мне?"
10092-100920580 = "Я отправлю место."
10092-100920590 = "Я буду."
10092-100920600 = "Фух"
10092-100920610 = "Я труп."
10092-100920620 = "Не могу поверить, что сделала это! Я не думала, что смогу."
10092-100920630 = "Ты была потрясающей."
10092-100920640 = "Тебе стоит играть чаще! Ты была отлична."
10092-100920650 = "Хм."
10092-100920660 = "Иногда ты умеешь быть милым. Ничего себе."
10092-100920670 = "Хи-хи."
10092-100920680 = "Сенсей!"
10092-100920690 = "Спасибо, что был моим зрителем."
10092-100920700 = "Насчёт той первой песни... Ха-ха."
10092-100920710 = "Спорим, я смогу найти первую песню! Ха-ха."
10092-100920720 = "А."
10092-100920730 = "ㅡㅡ;"
10092-100920740 = "Ты раздражаешь."
10092-100920750 = "Иногда я тебя ненавижу!"
