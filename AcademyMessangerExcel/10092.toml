[translation]
10092-100920010 = "Por falar nisso, Sensei,"
10092-100920020 = "eu fiquei responsável pelo visual da banda, né?"
10092-100920030 = "Mas \"visual\" inclui as roupas também, não inclui?"
10092-100920040 = "Ou seja, eu posso escolher as roupas também, né?"
10092-100920050 = "Isso mesmo."
10092-100920060 = "Alguma coisa te preocupa?"
10092-100920070 = "Huum, é que..."
10092-100920080 = "Decidir tudo sozinha dá um pouco de nervoso, sabe?"
10092-100920090 = "E pra começo de conversa, a culpa disso tudo é sua mesmo, Sensei,"
10092-100920100 = "então pensei em fazer você vir comigo."
10092-100920110 = "Ou seja, um encontro...!?"
10092-100920120 = "Fico feliz pelo convite."
10092-100920130 = "?"
10092-100920140 = "Hã?"
10092-100920150 = "― ―;;;"
10092-100920160 = "Para de graça!"
10092-100920170 = "Vou te mandar o endereço, nos vemos mais tarde."
10092-100920180 = "Como eu posso dizer, hum..."
10092-100920190 = "Obrigada."
10092-100920200 = "Me ajudou muito."
10092-100920210 = "Não era bem essa a minha intenção, mas..."
10092-100920220 = "Não esquenta, faço porque gosto."
10092-100920230 = "Foi um agradecimento por você ter me deixado ver você escolhendo roupas."
10092-100920240 = "A-Ah, é...?"
10092-100920250 = "Se você manda uma resposta sincera dessas do nada, me deixa sem jeito..."
10092-100920260 = "Bom, tanto faz!"
10092-100920270 = "O fato é que você me ajudou mesmo."
10092-100920280 = "Obrigada, Sensei. Te retribuo na próxima!"
10092-100920290 = "Huum..."
10092-100920300 = "Já não sei mais o que fazer."
10092-100920310 = "...?"
10092-100920320 = "O que houve?"
10092-100920330 = "Ah, nada, é que..."
10092-100920340 = "Eu tentei desenhar umas coisas aqui."
10092-100920350 = "Se você está desenhando..."
10092-100920360 = "É o design da logo?"
10092-100920370 = "Uhum, isso mesmo."
10092-100920380 = "Você pode dar uma olhadinha?"
10092-100920390 = "Qual é o seu problema, sério?!"
10092-100920400 = "Por que você faz uma coisa daquelas?"
10092-100920410 = "Será que dá pra parar?!"
10092-100920420 = "Vê se não faz mais isso daqui pra frente, tá me ouvindo?!"
10092-100920430 = "Desculpa."
10092-100920440 = "Vou tomar mais cuidado da próxima vez."
10092-100920450 = "Aah..."
10092-100920460 = "Francamente."
10092-100920470 = "Que raiva que me dá!"
10092-100920480 = "...Dessa vez passa, mas..."
10092-100920490 = "Não vai ter uma próxima, viu?!"
10092-100920500 = "Ei, Sensei,"
10092-100920510 = "quero conversar sobre uma coisa."
10092-100920520 = "Você tem tempo?"
10092-100920530 = "Conversar?"
10092-100920540 = "Parece ser um assunto sério, hein?"
10092-100920550 = "Aah..."
10092-100920560 = "Bom, mais ou menos isso."
10092-100920570 = "Por isso quero que você venha."
10092-100920580 = "Vou te mandar o local depois."
10092-100920590 = "Vê se vem sem falta, hein!"
10092-100920600 = "Aah..."
10092-100920610 = "Tô meio aérea até agora."
10092-100920620 = "E no fim acabei tocando tudo..."
10092-100920630 = "Sem exagero nenhum, foi incrível."
10092-100920640 = "Foi demais, toca pra mim ouvir de novo qualquer dia."
10092-100920650 = "...Que foi?"
10092-100920660 = "Até que você sabe elogiar direito quando quer, né?"
10092-100920670 = "Sensei,"
10092-100920680 = "obrigada"
10092-100920690 = "por ter me escutado com tanta atenção."
10092-100920700 = "A primeira música, em especial, foi muito boa."
10092-100920710 = "Como eu faço pra pesquisar ela?"
10092-100920720 = "Hã?! Para com isso já!"
10092-100920730 = "― ―;"
10092-100920740 = "Que raiva que você me dá!"
10092-100920750 = "É por essas e outras que você, Sensei..."
