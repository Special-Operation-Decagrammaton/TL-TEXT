[translation]
10092-100920010 = "Кстати, Сенсей."
10092-100920020 = "Я стала отвечать за визуальное оформление."
10092-100920030 = "Визуал же включает и одежду, верно?"
10092-100920040 = "Значит, я могу выбирать и одежду?"
10092-100920050 = "Да, наверное."
10092-100920060 = "Что-то вас беспокоит?"
10092-100920070 = "Ну, знаете..."
10092-100920080 = "Как-то тяжело решать всё одной."
10092-100920090 = "И вообще, это ведь из-за вас всё, Сенсей."
10092-100920100 = "Вот я и подумала, пусть вы составите мне компанию."
10092-100920110 = "То есть свидание...!?"
10092-100920120 = "Я рад, что вы пригласили."
10092-100920130 = "?"
10092-100920140 = "Ха."
10092-100920150 = "— — ;;;"
10092-100920160 = "Не шутите."
10092-100920170 = "Скину адрес, увидимся позже."
10092-100920180 = "Ну, как бы это сказать..."
10092-100920190 = "Спасибо."
10092-100920200 = "Вы очень помогли."
10092-100920210 = "Я не этого ожидала."
10092-100920220 = "Не обращайте внимания, я делаю это с удовольствием."
10092-100920230 = "Это благодарность за то, что вы показали мне, как выбирать одежду."
10092-100920240 = "П-понятно..."
10092-100920250 = "Но такой серьёзный ответ сбивает с толку..."
10092-100920260 = "Впрочем, ладно."
10092-100920270 = "То, что вы помогли, — факт."
10092-100920280 = "Спасибо, Сенсей. Отблагодарю вас в следующий раз!"
10092-100920290 = "Хм."
10092-100920300 = "Что-то я запуталась."
10092-100920310 = "...?"
10092-100920320 = "Что случилось?"
10092-100920330 = "А, нет."
10092-100920340 = "Я тут попробовала кое-что набросать."
10092-100920350 = "Набросать... значит,"
10092-100920360 = "дизайн логотипа?"
10092-100920370 = "Ага, верно."
10092-100920380 = "Можете взглянуть?"
10092-100920390 = "Что же это такое."
10092-100920400 = "Зачем вы так поступаете?"
10092-100920410 = "Я бы хотела, чтобы вы перестали."
10092-100920420 = "В следующий раз правда не делайте так."
10092-100920430 = "Простите."
10092-100920440 = "Впредь буду осторожнее."
10092-100920450 = "А-ах..."
10092-100920460 = "Ну и ну."
10092-100920470 = "Ужасно бесит."
10092-100920480 = "...В этот раз я прощу."
10092-100920490 = "Но больше так не делайте."
10092-100920500 = "Сенсей, послушайте."
10092-100920510 = "У меня есть разговор."
10092-100920520 = "У вас есть время?"
10092-100920530 = "Разговор?"
10092-100920540 = "Похоже на что-то серьёзное?"
10092-100920550 = "Ну... да."
10092-100920560 = "Вроде того."
10092-100920570 = "Поэтому я хочу, чтобы вы пришли."
10092-100920580 = "Адрес скину позже."
10092-100920590 = "Вы обязательно придёте, ладно?"
10092-100920600 = "А-ах..."
10092-100920610 = "Чувствую себя опустошённой."
10092-100920620 = "В итоге я сыграла всё."
10092-100920630 = "Это было правда великолепно, без лести."
10092-100920640 = "Было здорово, дайте послушать ещё."
10092-100920650 = "...Ну и ну."
10092-100920660 = "А вы умеете быть искренним."
10092-100920670 = "Сенсей."
10092-100920680 = "Спасибо."
10092-100920690 = "Что вы меня действительно слушали."
10092-100920700 = "Первая песня была особенно хороша."
10092-100920710 = "Как её найти в поиске?"
10092-100920720 = "Что? Не смейте!"
10092-100920730 = "— — ;"
10092-100920740 = "Бесит просто невероятно."
10092-100920750 = "Вот почему вы такой, Сенсей..."