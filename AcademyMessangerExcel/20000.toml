[translation]
20000-1298 = "Bom dia, Sensei. Você não me respondeu desde a última vez que mandei mensagem......"
20000-1299 = "Aconteceu alguma coisa? Quer que eu dê um pulo aí na Schale?"
20000-1300 = "Desculpa, meu celular estava com defeito e não consegui responder"
20000-1301 = "Achei que tinha voltado ao normal, mas o sinal ainda está meio instável......"
20000-1302 = "Ah, era isso então"
20000-1303 = "......Timing perfeito. Que ótimo"
20000-1304 = "Hã? Acho que isso não tem nada de ótimo......"
20000-1305 = "Não, digo em outro sentido. Você já vai entender o porquê"
20000-1306 = "Que tal instalarmos uma função de autodestruição em todos os aparelhos eletrônicos da sua sala, Sensei?"
20000-1307 = "Na TV, na geladeira, no notebook,"
20000-1308 = "No micro-ondas, no aspirador de pó, no secador de cabelo,"
20000-1309 = "Consigo fazer qualquer um deles explodir quando precisar"
20000-1310 = "......É brincadeira"
20000-1311 = "Recebi um pedido para construir uma máquina de lançar fogos de artifício"
20000-1312 = "Se tiver um tempinho, você poderia vir até a Millennium me ajudar?"
20000-1313 = "Fogos de artifício?"
20000-1314 = "Será que eu consigo ajudar em alguma coisa?"
20000-1315 = "Sim"
20000-1316 = "Vou ficar muito feliz se você vier"
20000-1317 = "Ainda bem que ninguém saiu ferido"
20000-1318 = "Realmente, quando estou com você, Sensei...... acontecem muitas coisas emocionantes"
20000-1319 = "E para você, Sensei...... como foi hoje?"
20000-1320 = "Foi bem divertido"
20000-1321 = "Achei que eu fosse morrer......"
20000-1322 = "Hoje saiu tudo do controle, mas um dia vou fazer fogos de artifício incríveis de verdade......"
20000-1323 = "Aliás, vou te mostrar algo ainda mais incrível da próxima vez, pode esperar"
20000-1324 = "Todo mundo acha surpreendente, mas a Millennium também tem um clube de beisebol, sabia?"
20000-1325 = "Eles são bem conhecidos em certos círculos pelo beisebol baseado em dados e treinamento científico"
20000-1326 = "......Não são um time tão forte assim, mas eu queria ajudá-las"
20000-1327 = "Vai virar líder de torcida?!"
20000-1328 = "Vai ser assistente do time?"
20000-1329 = "Líder de torcida, é...... Confesso que tenho um pouquinho de curiosidade de experimentar aquela roupa, mas"
20000-1330 = "Que pena, minha ideia vai para outro lado"
20000-1331 = "Estou pensando em construir um equipamento útil para o beisebol"
20000-1332 = "É um pouco diferente de ser assistente, mas se há um jeito de eu ajudar alguém......"
20000-1333 = "Acho que é usando as minhas habilidades de engenharia"
20000-1334 = "Por isso...... queria te fazer um pedido"
20000-1335 = "......Você me ajuda nessa também, Sensei?"
20000-1336 = "Ver algo que a gente construiu sendo útil para outra pessoa......"
20000-1337 = "É uma sensação maravilhosa, né?"
20000-1338 = "Hoje eu acabei tirando um cochilo rápido......"
20000-1339 = "E sonhei com você, Sensei"
20000-1340 = "Como foi o sonho?"
20000-1341 = "Hehe, é segredo"
20000-1342 = "Mas......"
20000-1343 = "Me deu uma vontade enorme de te ver agora mesmo, Sensei"
20000-1344 = "Sensei, temos um problema"
20000-1345 = "A situação tomou proporções inimagináveis. O Cano de Ferro Desmaiador está vendendo igual água"
20000-1346 = "Ai, meu Deus......"
20000-1347 = "Quem diria que tantas alunas assim sofriam de insônia......"
20000-1348 = "Estou realmente surpresa"
20000-1349 = "Parece que até saiu nas revistas de moda"
20000-1350 = "Como o gadget digital mais queridinho entre as colegiais deste ano"
20000-1351 = "E várias marcas famosas já começaram a lançar suas próprias linhas do Cano de Ferro Desmaiador"
20000-1352 = "......Nem eu imaginava que chegaria a esse ponto"
20000-1353 = "Se você começar a ver todas as alunas da Millennium andando por aí com um cano de ferro na mão......"
20000-1354 = "Não estranhe, tá bom?"
20000-1355 = "De vez em quando, até eu tenho os meus dias sentimentais"
20000-1356 = "Especialmente em dias de chuva como hoje"
20000-1357 = "É mesmo? Dessa eu não esperava"
20000-1358 = "A chuva tem mesmo um jeito especial de mexer com a nossa sensibilidade, né?"
20000-1359 = "Essa reação foi meio indelicada, sabia......?"
20000-1360 = "Em momentos assim, acho que......"
20000-1361 = "Sim"
20000-1362 = "Pois é"
20000-1363 = "Dá uma sensação de que não consigo controlar direito o meu próprio coração"
20000-1364 = "Em um dia assim, em vez de ficar trancada trabalhando na oficina......"
20000-1365 = "Talvez seja bom ir a algum lugar diferente para passar o tempo de forma mais significativa"
20000-1366 = "Acho que hoje vou dar uma passada na biblioteca"
20000-1367 = "Sensei. Eu vi que o seu ombro ficou todo molhado"
20000-1368 = "Muito obrigada...... por ter se preocupado em não me deixar molhar"
20000-1369 = "Se tivéssemos dois guarda-chuvas, era um sentimento que eu jamais teria descoberto...... A psicologia é mesmo fascinante"
20000-1370 = "Tenho certeza de que as suas atitudes estão exercendo influência sobre o meu coração, Sensei"
20000-1371 = "Sensei, emergência"
20000-1372 = "O que houve?"
20000-1373 = "Calma, respira fundo primeiro"
20000-1374 = "O que eu faço?"
20000-1375 = "É difícil explicar por mensagem de texto, mas......"
20000-1376 = "Preciso da sua ajuda"
20000-1377 = "Estou indo para aí agora mesmo"
20000-1378 = "Devo ir para a Millennium?"
20000-1379 = "Sim, por favor......!"
20000-1380 = "A vista noturna de hoje se tornou...... uma lembrança muito preciosa para mim"
20000-1381 = "Continue cuidando de mim daqui para frente também"
20000-1382 = "......Sensei"
20000-2000010 = "Sensei, terminei de consertar a bicicleta que você pediu"
20000-2000020 = "Pode vir buscar depois"
20000-2000030 = "Já? Mandou muito bem!"
20000-2000040 = "Estou indo aí agora"
20000-2000050 = "Vou estar trabalhando em outro projeto,"
20000-2000060 = "Então me avisa quando chegar"
