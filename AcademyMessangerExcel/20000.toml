[translation]
20000-1298 = "Доброе утро, Сенсей. Я писала вам недавно, но ответа не было..."
20000-1299 = "Что-то случилось? Мне зайти в Шале?"
20000-1300 = "Прости, у меня телефон сломался, не мог ответить."
20000-1301 = "Вроде починил, но связь всё ещё нестабильна..."
20000-1302 = "Вот как."
20000-1303 = "...В самый раз. Хорошо."
20000-1304 = "Что? Не вижу ничего хорошего..."
20000-1305 = "Нет, я о другом. Скоро поймёшь."
20000-1306 = "Как насчёт того, чтобы установить самоуничтожение на все электронные устройства в вашей комнате?"
20000-1307 = "Телевизор, холодильник, ноутбук,"
20000-1308 = "микроволновка, пылесос, фен —"
20000-1309 = "можно сделать так, чтобы всё взрывалось."
20000-1310 = "...Шучу."
20000-1311 = "Меня попросили сделать механизм для запуска фейерверков."
20000-1312 = "Если хотите, приходите в Миллениум, поможете?"
20000-1313 = "Фейерверки?"
20000-1314 = "Чем я могу помочь?"
20000-1315 = "Ага."
20000-1316 = "Буду рада, если вы придёте."
20000-1317 = "Хорошо, что никто не пострадал."
20000-1318 = "Всё-таки рядом с вами... часто случаются волнующие вещи."
20000-1319 = "А как ваш сегодняшний день?"
20000-1320 = "Было весело."
20000-1321 = "Я думал, умру..."
20000-1322 = "Сегодняшний день был сумасшедшим, но когда-нибудь я покажу вам настоящий великолепный фейерверк..."
20000-1323 = "Нет, я покажу вам нечто более грандиозное, так что ждите."
20000-1324 = "Многие удивляются, но в Миллениуме есть бейсбольный клуб."
20000-1325 = "Они довольно известны в определённых кругах благодаря аналитике и научным тренировкам."
20000-1326 = "...Не то чтобы они были сильной командой, но я хочу помочь."
20000-1327 = "Ты станешь чирлидером!?"
20000-1328 = "Или менеджером?"
20000-1329 = "Чирлидер... В принципе, я бы хотела примерить ту форму, но"
20000-1330 = "Увы, всё иначе."
20000-1331 = "Я подумала создать кое-что полезное для бейсбола."
20000-1332 = "Это не совсем менеджер, но если я могу кому-то помочь..."
20000-1333 = "то, наверное, только с помощью своих навыков."
20000-1334 = "И вот... у меня есть просьба."
20000-1335 = "...Вы тоже поможете?"
20000-1336 = "Когда то, что я делаю, приносит пользу кому-то..."
20000-1337 = "Это прекрасно."
20000-1338 = "Сегодня я немного вздремнула..."
20000-1339 = "И мне приснились вы."
20000-1340 = "Какой сон?"
20000-1341 = "Хе-хе, секрет."
20000-1342 = "Но..."
20000-1343 = "Почему-то мне захотелось увидеть вас прямо сейчас."
20000-1344 = "Сенсей, беда."
20000-1345 = "Ситуация хуже, чем я думала. Трубы-вырубалки расходятся как горячие пирожки."
20000-1346 = "Что за напасть..."
20000-1347 = "И столько студентов страдают от бессонницы..."
20000-1348 = "Я правда удивлена."
20000-1349 = "Говорят, их даже включили в список популярных гаджетов среди старшеклассниц в этом году,"
20000-1350 = "в модных журналах."
20000-1351 = "Известные бренды тоже начали одну за другой выпускать новые модели обморочных труб."
20000-1352 = "...Я и сама не ожидала такого."
20000-1353 = "Все студенты Миллениума ходят с трубами..."
20000-1354 = "Возможно, скоро мы увидим такую картину, но... не обращай внимания."
20000-1355 = "Иногда у меня бывают сентиментальные дни."
20000-1356 = "Особенно когда идёт дождь."
20000-1357 = "Вот как? Неожиданно."
20000-1358 = "В дожде есть что-то, что затрагивает чувства."
20000-1359 = "Невежливо так реагировать..."
20000-1360 = "В такие моменты, наверное..."
20000-1361 = "Да"
20000-1362 = "Наверное, так."
20000-1363 = "Чувствуешь, что не можешь контролировать свои эмоции."
20000-1364 = "В такие дни, вместо работы, лучше..."
20000-1365 = "пойти в место, где можно провести время иначе, чем обычно."
20000-1366 = "Сегодня, пожалуй, схожу в библиотеку."
20000-1367 = "Сенсей. Я видела, что ваше плечо намокло."
20000-1368 = "Вы заботились, чтобы я не промокла... спасибо."
20000-1369 = "Если бы у нас были зонты, психология была бы другой... как интересно."
20000-1370 = "Ваши поступки наверняка влияют на мою душу."
20000-1371 = "Сенсей, чрезвычайная ситуация."
20000-1372 = "Что случилось?"
20000-1373 = "Сначала успокойся."
20000-1374 = "Что же делать?"
20000-1375 = "В сообщении трудно объяснить..."
20000-1376 = "Нужна ваша помощь."
20000-1377 = "Я сейчас приду."
20000-1378 = "Мне направиться в Миллениум?"
20000-1379 = "Да, пожалуйста...!"
20000-1380 = "Сегодняшний ночной вид стал для меня... действительно важным воспоминанием."
20000-1381 = "Будем и дальше дружить."
20000-1382 = "...Сенсей."
20000-2000010 = "Сенсей, я починила велосипед, как вы просили."
20000-2000020 = "Зайдите за ним позже."
20000-2000030 = "Уже? Как всегда, быстро."
20000-2000040 = "Я сейчас приду."
20000-2000050 = "Я буду заниматься другими делами."
20000-2000060 = "Напишите, когда будете на месте."