[translation]
20000-1298 = "Эй, Сенсей. После прошлого звонка вы мне так и не ответили."
20000-1299 = "Что случилось? Мне прийти в Шале?"
20000-1300 = "Я не мог ответить, потому что телефон сломался."
20000-1301 = "Связь и сейчас довольно плохая."
20000-1302 = "...Что?"
20000-1303 = "...Отлично."
20000-1304 = "А? Разве это не плохо?"
20000-1305 = "Скоро поймёте."
20000-1306 = "Как вы относитесь к установке устройства самоуничтожения во всю вашу электронику?"
20000-1307 = "Например, в телевизор, холодильник, ноутбук..."
20000-1308 = "Можно ещё в микроволновку, пылесос, фен..."
20000-1309 = "Если хотите, я могу заставить их все самоуничтожиться."
20000-1310 = "...Я шучу."
20000-1311 = "Меня попросили сделать установку для фейерверков."
20000-1312 = "Если вы не против, можете прийти в Миллениум и помочь мне?"
20000-1313 = "Фейерверки?"
20000-1314 = "Думаешь, я буду полезен?"
20000-1315 = "Да."
20000-1316 = "Я буду очень рада, если вы придёте со мной."
20000-1317 = "Я так рада, что никто не пострадал."
20000-1318 = "Когда я с вами, моя жизнь всегда кажется такой захватывающей..."
20000-1319 = "Как вам сегодняшний день, Сенсей?"
20000-1320 = "Было весело."
20000-1321 = "Я думал, что умру."
20000-1322 = "Сегодня всё превратилось в полный хаос, но в следующий раз..."
20000-1323 = "Я покажу вам кое-что ещё более потрясающее. Вот увидите."
20000-1324 = "Все удивляются, когда узнают, но в Миллениуме есть бейсбольный клуб."
20000-1325 = "Они известны бейсболом, основанным на данных и научном подходе к тренировкам..."
20000-1326 = "Может, это не самая сильная команда, но я хочу им помочь."
20000-1327 = "Ты будешь чирлидершей?"
20000-1328 = "Ты будешь их менеджером?"
20000-1329 = "Чирлидершей? Ну, я всегда хотела надеть такую форму."
20000-1330 = "Но, к сожалению, нет."
20000-1331 = "Я хочу улучшить их тренировочное оборудование."
20000-1332 = "Хм... Единственный способ, которым я могу кому-то помочь..."
20000-1333 = "— это технологии."
20000-1334 = "Так что у меня есть просьба."
20000-1335 = "Можете пойти со мной, Сенсей?"
20000-1336 = "Если я смогу помочь кому-то тем, что сделала..."
20000-1337 = "я буду очень счастлива."
20000-1338 = "Сегодня я неожиданно задремала..."
20000-1339 = "И мне приснились вы."
20000-1340 = "Что за сон?"
20000-1341 = "Хи-хи. Секрет."
20000-1342 = "Но..."
20000-1343 = "После него я почему-то соскучилась по вам."
20000-1344 = "У меня проблема, Сенсей."
20000-1345 = "«Нокаут-трубы» разлетаются как горячие пирожки."
20000-1346 = "Да ладно."
20000-1347 = "Неужели так много студентов страдают бессонницей?"
20000-1348 = "Да!"
20000-1349 = "Его выбрали обязательной вещью года для старшеклассниц"
20000-1350 = "в каком-то модном журнале."
20000-1351 = "и теперь все известные бренды начали выпускать собственные «Нокаут-трубы»."
20000-1352 = "Для меня это было полным шоком..."
20000-1353 = "Так что если увидите студентов Миллениума со стальными трубами,"
20000-1354 = "не удивляйтесь слишком сильно."
20000-1355 = "Иногда я становлюсь эмоциональной."
20000-1356 = "Особенно в дождливые дни."
20000-1357 = "Не ожидал."
20000-1358 = "Дождь словно задевает какие-то струны в человеческом сердце."
20000-1359 = "Ну и грубость."
20000-1360 = "В любом случае сейчас идеальное время для..."
20000-1361 = "Да."
20000-1362 = "Верно."
20000-1363 = "Похоже, я не могу контролировать эмоции."
20000-1364 = "В такие дни вместо мастерской"
20000-1365 = "я иду куда-нибудь провести время более осмысленно."
20000-1366 = "Может, сегодня сходить в библиотеку?"
20000-1367 = "У вас всё плечо промокло, Сенсей."
20000-1368 = "Спасибо, что заботились обо мне..."
20000-1369 = "Если бы мы взяли два зонта, этого бы не случилось... Разве психология не интересна?"
20000-1370 = "Ваше поведение определённо влияет на моё сердце."
20000-1371 = "У нас чрезвычайная ситуация, Сенсей."
20000-1372 = "Что происходит?"
20000-1373 = "Постарайтесь сохранять спокойствие."
20000-1374 = "Что мне делать?"
20000-1375 = "Я не могу толком объяснить это в сообщении..."
20000-1376 = "Поможешь мне?"
20000-1377 = "Я уже иду."
20000-1378 = "Мне приехать в Миллениум?"
20000-1379 = "Да, пожалуйста!"
20000-1380 = "Вид, который мы увидели... я запомню надолго."
20000-1381 = "Огромное спасибо."
20000-1382 = "...Сенсей."
20000-2000010 = "Я закончила ремонт вашего велосипеда, Сенсей."
20000-2000020 = "Если свободны, приходите забрать."
20000-2000030 = "Уже? Ты и правда быстро работаешь."
20000-2000040 = "Уже иду."
20000-2000050 = "Хорошо. А пока займусь другим проектом."
20000-2000060 = "Сообщите, когда будете здесь."
