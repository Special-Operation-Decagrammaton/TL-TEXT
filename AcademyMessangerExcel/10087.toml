[translation]
10087-100870010 = "Sensei"
10087-100870020 = "Isto é guerra!"
10087-100870030 = "Lá vem você com papo perigoso de novo..."
10087-100870040 = "Se querem comprar briga de forma tão descarada assim..."
10087-100870050 = "Eu aceito o desafio, como Administradora do Comitê Disciplinar!"
10087-100870060 = "Na verdade, isso até calha bem. Se aproveitarmos a ocasião para esmagá-las completamente..."
10087-100870070 = "...O que foi que aconteceu?"
10087-100870080 = "Vamos fazê-las rastejar no chão e aprender o seu devido lugar!"
10087-100870090 = "..."
10087-100870100 = "Aaah, que raiva!"
10087-100870110 = "Sempre, sempre a mesma coisa!"
10087-100870120 = "O que diabos aconteceu...?"
10087-100870130 = "Enfim, Sensei, até mais tarde!"
10087-100870140 = "Não se atrase, pois isto é uma guerra!"
10087-100870150 = "...Er, Ako?"
10087-100870160 = "Sensei, imagino que você já tenha voltado para a Schale a esta hora?"
10087-100870170 = "Muito obrigada por me acompanhar hoje."
10087-100870180 = "Já se acalmou?"
10087-100870190 = "Como?"
10087-100870200 = "O que quer dizer com isso?"
10087-100870210 = "Está insinuando que eu havia perdido a compostura?"
10087-100870220 = "Eu estava perfeitamente normal, como sempre."
10087-100870230 = "Mudando de assunto, já decidi qual vestido vou levar."
10087-100870240 = "Qual você escolheu?"
10087-100870250 = "Fiquei com aquele que você escolheu, Sensei. Entrei em contato com a loja que trabalha com esse vestido e..."
10087-100870260 = "Espera, aquele era..."
10087-100870270 = "Felizmente, disseram que podiam deixar reservado para mim."
10087-100870280 = "Ainda bem que encontramos um que me agradou."
10087-100870290 = "Amanhã iremos buscar o vestido, então peço que não se atrase, por favor."
10087-100870300 = "Hã...?"
10087-100870310 = "Você não esqueceu o nosso compromisso, né?"
10087-100870320 = "Vamos buscar o vestido."
10087-100870330 = "A gente tinha combinado isso...?"
10087-100870340 = "Francamente..."
10087-100870350 = "Pare de reclamar e venha logo, você é um adulto, não é?"
10087-100870360 = "Poxa..."
10087-100870370 = "Como é?"
10087-100870380 = "E-Estou indo agora mesmo..."
10087-100870390 = "Fico no aguardo."
10087-100870400 = "Sensei... Vejo que você mandou entregar o vestido para mim."
10087-100870410 = "Eu mesma deveria tê-lo retirado, desculpe pelo incômodo."
10087-100870420 = "Muito obrigada."
10087-100870430 = "Deixe-me agradecer devidamente na próxima vez."
10087-100870440 = "...Hum?"
10087-100870450 = "O que é isto aqui?"
10087-100870460 = "Tem uma coisa parecida com... um cordão aqui dentro..."
10087-100870470 = "A-Ako, tem uma explicação pra isso!"
10087-100870480 = "Roupa íntima...? Não, por qualquer ângulo que se olhe, isto é só um cordão."
10087-100870490 = "Foi você quem comprou isto, Sensei?"
10087-100870500 = "B-Bom, fui eu que comprei, sim, mas..."
10087-100870510 = "E você quer que eu vista uma coisa vergonhosa dessas?"
10087-100870520 = "Só porque eu tive uma atitude um pouco atrevida,"
10087-100870530 = "você quer obrigar uma aluna a se vestir desse jeito?"
10087-100870540 = "Não foi essa a minha intenção!?"
10087-100870550 = "E você achou mesmo que eu diria \"sim, entendido\" para uma coisa dessas!?"
10087-100870560 = "Inadmissível!!"
10087-100870570 = "Eu vou devolver isto! Vou devolver! Devolver!!"
10087-100870580 = "S-Sim, senhora..."
10087-100870590 = "Faltam poucos dias para a festa."
10087-100870600 = "Hehe, os preparativos estão concluídos."
10087-100870610 = "A minha vitória nesta guerra já está praticamente garantida."
10087-100870620 = "Você parecia especialmente ocupada ultimamente, né?"
10087-100870630 = "Sim."
10087-100870640 = "Contudo, ainda é cedo para baixar a guarda."
10087-100870650 = "Não podemos permitir a menor brecha sequer."
10087-100870660 = "Portanto, faremos um ensaio geral."
10087-100870670 = "Um ensaio geral?"
10087-100870680 = "Sensei, venha imediatamente para o salão de festas."
10087-100870690 = "É hora de um treinamento especial!"
10087-100870700 = "Como assim...?"
10087-100870710 = "Sensei..."
10087-100870720 = "Obrigada pelo seu trabalho duro hoje."
10087-100870730 = "Bom trabalho pra você também, Ako."
10087-100870740 = "Hum, Sensei..."
10087-100870750 = "...Vou guardar isso com muito carinho, viu?"
10087-100870760 = "Hã?"
10087-100870770 = "Só queria deixar isso dito."
