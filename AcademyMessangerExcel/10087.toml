[translation]
10087-100870010 = "Сенсей. Это Амау Ако."
10087-100870020 = "Война началась!"
10087-100870030 = "Ако, ты в порядке?"
10087-100870040 = "Да! Мне всё равно, какие причины были у этих мелких бесов."
10087-100870050 = "Если им нужна драка, я, Старший Администратор Команды Префектов, с радостью её предоставлю!"
10087-100870060 = "Может, это скрытое благословение? Отличная возможность поставить их на место!"
10087-100870070 = "А-Ако?"
10087-100870080 = "Это будет для них хорошим уроком. Они будут смотреть на меня с пола и наконец поймут, как всё должно быть!"
10087-100870090 = "..."
10087-100870100 = "Ух, это так бесит! Одна мысль об этом"
10087-100870110 = "сводит с ума!"
10087-100870120 = "Ако, что вообще происходит?"
10087-100870130 = "Скоро увидимся, Сенсей!!"
10087-100870140 = "Не опаздывай! Всё-таки это война!"
10087-100870150 = "Алло?"
10087-100870160 = "Сенсей. Ты нормально добрался?"
10087-100870170 = "Спасибо, что провели сегодня время со мной."
10087-100870180 = "Ты успокоился после того, что было раньше?"
10087-100870190 = "Хм?"
10087-100870200 = "Что это значит?"
10087-100870210 = "Когда ты так говоришь, звучит так, будто я была не в себе."
10087-100870220 = "Ничего подобного! Я всё это время была совершенно спокойна!"
10087-100870230 = "В любом случае... Я решила, какое платье хочу."
10087-100870240 = "Ого. Какое выбрала?"
10087-100870250 = "То, которое ты предложил. Его продают только в одном месте, так что я связалась с ними."
10087-100870260 = "Подожди... Ако. Это..."
10087-100870270 = "К счастью, они всё ещё принимают индивидуальные заказы."
10087-100870280 = "Я так рада, что нашла то, которое мне действительно нравится."
10087-100870290 = "Ах да. Завтра мы ОБЯЗАТЕЛЬНО должны купить платье. Так что не опаздывай!"
10087-100870300 = "Прости?"
10087-100870310 = "Сенсей, ты обещал."
10087-100870320 = "Сегодня день покупки платья."
10087-100870330 = "Не помню, чтобы я это обещал."
10087-100870340 = "Серьёзно..."
10087-100870350 = "Ты разве не взрослый?! Хватит жаловаться, пошли."
10087-100870360 = "Это кошмар..."
10087-100870370 = "Хм?"
10087-100870380 = "Н-ничего. Я приду."
10087-100870390 = "Очень хорошо, Сенсей. Буду ждать."
10087-100870400 = "Сенсей, я получила платье."
10087-100870410 = "Прости. Я могла бы просто сходить туда сама."
10087-100870420 = "Я не хотела тебя беспокоить."
10087-100870430 = "Столько долгов..."
10087-100870440 = "Хм?"
10087-100870450 = "Что это?"
10087-100870460 = "Что это за верёвочка? Лента?"
10087-100870470 = "О, это..."
10087-100870480 = "Это то, о чём я думаю? Н-нижнее бельё?"
10087-100870490 = "Сенсей, ты это купил?"
10087-100870500 = "Д-да. Технически, купил...!"
10087-100870510 = "Ты предлагаешь мне это надеть, Сенсей?"
10087-100870520 = "Ты пытаешься отомстить мне за дерзость?"
10087-100870530 = "Сенсей, не могу поверить..."
10087-100870540 = "Нет! Ако, продавщица..."
10087-100870550 = "Я должна просто поверить какой-то случайной продавщице?!"
10087-100870560 = "Что за бред... Есть же границы, Сенсей! Я это верну!"
10087-100870570 = "Ты меня слышишь?! Я сказала, что верну это!"
10087-100870580 = "*вздох*"
10087-100870590 = "В любом случае, вечеринка уже скоро."
10087-100870600 = "Все приготовления завершены."
10087-100870610 = "Хи-хи. Эта война точно закончится в мою пользу."
10087-100870620 = "Кто-то сегодня в хорошем настроении..."
10087-100870630 = "Разве?"
10087-100870640 = "Хм, может, перед такой важной битвой мне нужно ещё немного «практики»."
10087-100870650 = "Я не могу позволить себе никаких ошибок."
10087-100870660 = "Говорят же, повторение — мать учения."
10087-100870670 = "Практика?"
10087-100870680 = "Постарайся прийти вовремя, Сенсей."
10087-100870690 = "У нас будет особая «практика» вдвоём!"
10087-100870700 = "Прости?"
10087-100870710 = "Сенсей..."
10087-100870720 = "Спасибо за всю сегодняшнюю помощь."
10087-100870730 = "Ты тоже отлично справилась, Ако."
10087-100870740 = "О, и ещё... Сенсей..."
10087-100870750 = "Та продавщица и правда была права."
10087-100870760 = "Ч-что?"
10087-100870770 = "Не обращай внимания!"
