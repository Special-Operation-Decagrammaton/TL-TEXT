[translation]
10087-100870010 = "Сенсей."
10087-100870020 = "Это война!"
10087-100870030 = "Опять что-то опасное..."
10087-100870040 = "Раз они так открыто бросают нам вызов..."
10087-100870050 = "Я принимаю его как администратор Дисциплинарного комитета!"
10087-100870060 = "Даже к лучшему. Уж раз подвернулся случай, можно будет их раздавить..."
10087-100870070 = "...Что случилось?"
10087-100870080 = "Пусть поползают на коленях, чтобы знали своё место."
10087-100870090 = "..."
10087-100870100 = "Ах, ну всё!"
10087-100870110 = "Опять, опять!"
10087-100870120 = "Что вообще произошло...?"
10087-100870130 = "В таком случае, Сенсей, до встречи!"
10087-100870140 = "Не опаздывайте, это война!"
10087-100870150 = "...Э-э, Ако?"
10087-100870160 = "Сенсей, вы уже, наверное, вернулись в Шале?"
10087-100870170 = "Благодарю вас за сегодняшний день."
10087-100870180 = "Успокоилась?"
10087-100870190 = "Прошу прощения?"
10087-100870200 = "Что вы имеете в виду?"
10087-100870210 = "Разве я выглядела взволнованной?"
10087-100870220 = "Вы были как обычно."
10087-100870230 = "Как бы то ни было, я выбрала платье."
10087-100870240 = "Какое выбрала?"
10087-100870250 = "То, которое посоветовали вы. Я связалась с магазином, где оно продаётся."
10087-100870260 = "Эм, это же..."
10087-100870270 = "К счастью, его можно отложить."
10087-100870280 = "Я очень рада, что нашла то, что понравилось."
10087-100870290 = "Завтра я поеду забирать платье, так что, пожалуйста, не опаздывайте."
10087-100870300 = "Э-э...?"
10087-100870310 = "Вы не забыли о нашем уговоре?"
10087-100870320 = "Поедем забирать платье."
10087-100870330 = "Разве мы договаривались..."
10087-100870340 = "Ну что за..."
10087-100870350 = "Не спорьте и приходите, вы же взрослый человек?"
10087-100870360 = "Ну..."
10087-100870370 = "Что?"
10087-100870380 = "Я-я уже выезжаю..."
10087-100870390 = "Жду вас."
10087-100870400 = "Сенсей... вы привезли мне платье."
10087-100870410 = "Мне нужно было забрать его самой, а вы потрудились ради меня."
10087-100870420 = "Большое спасибо."
10087-100870430 = "Позвольте мне как следует отблагодарить вас позже."
10087-100870440 = "...Сенсей."
10087-100870450 = "Что это?"
10087-100870460 = "Здесь какие-то верёвочки..."
10087-100870470 = "А, Ако, этому есть объяснение."
10087-100870480 = "Бельё...? Нет, это же просто верёвки."
10087-100870490 = "Это вы купили?"
10087-100870500 = "Н-ну да, купил я, но..."
10087-100870510 = "Вы хотите, чтобы я надела такое?"
10087-100870520 = "Из-за того, что я была дерзкой?"
10087-100870530 = "Вы заставляете студента так одеваться?"
10087-100870540 = "Я вовсе не это имел в виду!"
10087-100870550 = "И вы думаете, я скажу: «Хорошо, я поняла»?!"
10087-100870560 = "Это невозможно!!"
10087-100870570 = "Я это верну! Верну! Верну!!"
10087-100870580 = "Д-да, конечно..."
10087-100870590 = "Через несколько дней наступит день вечеринки."
10087-100870600 = "Хе-хе, всё готово."
10087-100870610 = "В этой войне моя победа уже предрешена."
10087-100870620 = "В последнее время ты была особенно занята."
10087-100870630 = "Да."
10087-100870640 = "Но расслабляться ещё рано."
10087-100870650 = "Нельзя допускать ни малейшей оплошности."
10087-100870660 = "Поэтому я проведу генеральную репетицию."
10087-100870670 = "Что за репетиция?"
10087-100870680 = "Сенсей, срочно приезжайте на место проведения вечеринки."
10087-100870690 = "Это тренировка!"
10087-100870700 = "В каком смысле...?"
10087-100870710 = "Сенсей..."
10087-100870720 = "Спасибо вам за сегодня."
10087-100870730 = "Ты тоже молодец, Ако."
10087-100870740 = "Сенсей..."
10087-100870750 = "...Я буду беречь его."
10087-100870760 = "Что?"
10087-100870770 = "Я просто хотела вам это сказать."