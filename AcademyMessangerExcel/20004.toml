[translation]
20004-20004010 = "Сенсей, у вас найдётся время сегодня днём составить мне компанию?"
20004-20004020 = "Я собираюсь купить новый купальник для предстоящей тренировки. Не могли бы вы дать совет?"
20004-20004030 = "Эм, я бы очень хотел составить компанию, но..."
20004-20004040 = "Вам нужен именно я, а не подруга? Вы уверены?"
20004-20004050 = "Да, я бы хотела попросить именно вас. Понимаете, у меня есть купальник, который я носила до средней школы, но он стал немного тесен..."
20004-20004060 = "Раз уж так, я хочу приобрести более подобающий купальник для Комитета по достижению справедливости."
20004-20004070 = "В-вот как..."
20004-20004080 = "Да, поэтому мне и нужна ваша помощь."
20004-20004090 = "Тогда я буду ждать вас."
20004-20004100 = "Сенсей, вы не могли бы сейчас прийти на побережье?"
20004-20004110 = "Я хочу кое-что вам показать."
20004-20004120 = "Да, сейчас буду."
20004-20004130 = "Тот купальник, что я купила недавно, всё ещё не было случая надеть, но раз уж мы у моря..."
20004-20004140 = "В конце концов, такие вещи можно носить только в таких местах."
20004-20004150 = "Вы про купальник, который недавно купили?"
20004-20004160 = "А, если можно, приходите пораньше, так было бы удобнее."
20004-20004170 = "Ждать вас в этом... ну, немного неловко..."
20004-20004180 = "Что, разве это не купальник!? А что на вас надето!?"
20004-20004190 = "Сенсей, я уже поправилась, так что, как мы и говорили, собираюсь немного поплавать."
20004-20004200 = "Тогда я тоже подойду к вам."
20004-20004210 = "Эм, я рада, что вы придёте, но..."
20004-20004220 = "Сегодня ведь просто плавание, не стоит так беспокоиться, правда...?"
20004-20004230 = "Разве что лёгкая разминка на пляже перед заплывом..."
20004-20004240 = "Бережёного бог бережёт. Я тоже пойду с вами."
20004-20004250 = "К тому же мне хочется посмотреть, как Маширо плавает."
20004-20004260 = "П-понятно... Вот оно что."
20004-20004270 = "Тогда я буду ждать вас."
20004-20004280 = "Спасибо за вчерашний день, Сенсей."
20004-20004290 = "И тебе спасибо. Маширо, сегодня опять тренировки?"
20004-20004300 = "Нет, сегодня не тренировки, я планирую заняться волонтёрской деятельностью."
20004-20004310 = "Волонтёрской?"
20004-20004320 = "Да, я слышала, что нужна всяческая помощь."
20004-20004330 = "На побережье много происшествий: сбор мусора, поиск потерявшихся детей и так далее."
20004-20004340 = "Маширо, ты молодец."
20004-20004350 = "Ну что вы, ничего особенного."
20004-20004360 = "Ведь это тоже часть достижения справедливости!"