[translation]
20004-20004010 = "Сенсей, не могли бы вы сегодня днём сходить со мной в центр города?"
20004-20004020 = "Я хочу купить новый купальник для летних тренировок."
20004-20004030 = "Я не против, но..."
20004-20004040 = "разве ты не предпочла бы пойти с подругами?"
20004-20004050 = "У меня ещё есть купальник из средней школы, но теперь он, кажется, мне мал."
20004-20004060 = "Думаю, мне нужен новый, достойный члена Комитета справедливости."
20004-20004070 = "Надеюсь, ты найдёшь хороший."
20004-20004080 = "Да, и мне понадобится ваша помощь, Сенсей."
20004-20004090 = "Я буду ждать вас в магазине."
20004-20004100 = "Сенсей, не могли бы вы встретиться со мной на пляже?"
20004-20004110 = "Я хочу кое-что вам показать."
20004-20004120 = "О, это купальник?"
20004-20004130 = "Я впервые примеряю его с тех пор, как мы приехали на летнюю тренировку."
20004-20004140 = "Я не смогла заставить себя надеть его где-либо, кроме пляжа."
20004-20004150 = "Твой купальник, да...?"
20004-20004160 = "Можете прийти как можно скорее?"
20004-20004170 = "Мне неловко одной ждать посреди пляжа в таком виде..."
20004-20004180 = "Мы ведь говорим о купальнике, да?"
20004-20004190 = "Я хотела бы продолжить уроки плавания сегодня днём, Сенсей."
20004-20004200 = "Я хочу пойти вместе, потому что беспокоюсь о вас."
20004-20004210 = "Если пойдёте со мной, я не против..."
20004-20004220 = "В этот раз я не должна получить тепловой удар, ведь тренировка будет в воде."
20004-20004230 = "Перед этим я планирую размяться на пляже. Это ведь нормально?"
20004-20004240 = "Конечно."
20004-20004250 = "Перед плаванием действительно важно размяться."
20004-20004260 = "Спасибо за понимание."
20004-20004270 = "Тогда увидимся на пляже!"
20004-20004280 = "Спасибо за вчерашнее, Сенсей."
20004-20004290 = "Ты и сегодня собираешься тренироваться, Маширо?"
20004-20004300 = "Нет, вместо тренировки я планирую заняться волонтёрством на пляже."
20004-20004310 = "Волонтёрством?"
20004-20004320 = "Верно. На пляже тоже есть много способов помогать людям."
20004-20004330 = "Например, собирать мусор или помогать потерявшимся детям."
20004-20004340 = "Даже на отдыхе у тебя полно дел."
20004-20004350 = "Не совсем. Ничего такого, с чем я не справлюсь."
20004-20004360 = "Это ради справедливости!"
