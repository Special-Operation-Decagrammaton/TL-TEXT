[translation]
20004-20004010 = "Sensei. Você poderia me fazer companhia por um tempinho hoje à tarde?"
20004-20004020 = "Na verdade, estou pensando em comprar um biquíni novo para usar no próximo treinamento e queria pedir a sua opinião."
20004-20004030 = "Bom, vontade de ir com você não me falta, mas..."
20004-20004040 = "Tem certeza de que prefere ir comigo em vez de chamar alguma amiga?"
20004-20004050 = "Sim, eu gostaria muito de pedir isso a você, Sensei. É que, na verdade, eu ainda tenho o maiô que usava na época do fundamental, mas ele acabou ficando um pouco apertado..."
20004-20004060 = "Já que vou comprar outro, queria escolher um traje de banho mais digno de um membro do Comitê de Realização da Justiça."
20004-20004070 = "E-Entendi..."
20004-20004080 = "Sim, e é justamente para isso que gostaria de contar com a sua ajuda, Sensei."
20004-20004090 = "Bom, estarei esperando por você."
20004-20004100 = "Sensei, você poderia vir até a praia agora?"
20004-20004110 = "Tem uma coisa que eu gostaria de te mostrar."
20004-20004120 = "Claro, já estou indo praí."
20004-20004130 = "Eu não tive oportunidade de vestir desde que comprei outro dia, então pensei em aproveitar que estamos na praia."
20004-20004140 = "Até porque só dá para usar esse tipo de roupa num lugar assim mesmo."
20004-20004150 = "Está falando do biquíni que compramos outro dia?"
20004-20004160 = "Ah, se puder vir um pouquinho mais rápido, eu agradeceria."
20004-20004170 = "Ficar esperando vestida assim é, digamos, um tanto..."
20004-20004180 = "Ué, não é o biquíni?! O que diabos você está vestindo?!"
20004-20004190 = "Sensei. Como já me recuperei, pensei em começar nadando um pouco, como tínhamos conversado antes."
20004-20004200 = "Então eu também vou para aí."
20004-20004210 = "Hum, eu fico feliz que você venha, mas..."
20004-20004220 = "Dessa vez eu só vou nadar normalmente, então não precisa se preocupar tanto assim, viu...?"
20004-20004230 = "Só vou fazer um aquecimento básico na areia antes de entrar na água..."
20004-20004240 = "Seguro morreu de velho. Eu vou acompanhar você."
20004-20004250 = "E além do mais, eu quero ver você nadando, Mashiro."
20004-20004260 = "E-Entendo... Então era por isso."
20004-20004270 = "Nesse caso, estarei esperando."
20004-20004280 = "Bom trabalho ontem, Sensei."
20004-20004290 = "Bom trabalho pra você também. Vai treinar hoje de novo, Mashiro?"
20004-20004300 = "Não, hoje não tenho treino, pretendo fazer trabalho voluntário."
20004-20004310 = "Trabalho voluntário?"
20004-20004320 = "Sim, ouvi dizer que estão precisando de bastante ajuda."
20004-20004330 = "Recolher lixo, ajudar crianças perdidas... Sempre acontecem muitos problemas na praia."
20004-20004340 = "Que orgulho de você, Mashiro."
20004-20004350 = "Imagina, não é nada demais."
20004-20004360 = "Afinal, isso também faz parte de agir em nome da justiça!"
