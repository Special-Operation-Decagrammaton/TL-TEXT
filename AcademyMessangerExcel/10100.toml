[translation]
10100-101000010 = "Тест."
10100-101000020 = "А."
10100-101000030 = "А-а-а-а..."
10100-101000040 = "Это сообщение видно?"
10100-101000050 = "Отлично видно, Широко."
10100-101000060 = "Хм."
10100-101000070 = "Хорошо."
10100-101000080 = "Тогда я свяжусь позже."
10100-101000090 = "Подожди, где ты сейчас?"
10100-101000100 = "Я?"
10100-101000110 = "В автономном районе Абидос."
10100-101000120 = "Не могли бы вы встретиться со мной?"
10100-101000130 = "...Хм."
10100-101000140 = "Поняла."
10100-101000150 = "Я жду."
10100-101000160 = "Я сейчас приду!"
10100-101000170 = "Яйца, молоко, моющее средство, полотенца, салфетки."
10100-101000180 = "И ещё гель для душа."
10100-101000190 = "...О чём это вы?"
10100-101000200 = "Широко?"
10100-101000210 = "А."
10100-101000220 = "Извините, ошиблась."
10100-101000230 = "Сенсей."
10100-101000240 = "Мне пришла в голову отличная идея."
10100-101000250 = "Вы можете прийти?"
10100-101000260 = "В общем, я сейчас приду!"
10100-101000270 = "А."
10100-101000280 = "...Хм."
10100-101000290 = "Я объясню при встрече."
10100-101000300 = "Сенсей, беда."
10100-101000310 = "Я попробовала надеть старый велосипедный джерси,"
10100-101000320 = "и молния..."
10100-101000330 = "Неужели...!?"
10100-101000340 = "А."
10100-101000350 = "На всякий случай скажу:"
10100-101000360 = "Я не потолстела."
10100-101000370 = "Д-да, конечно..."
10100-101000380 = "Хм."
10100-101000390 = "Спокойной ночи, Сенсей."
10100-101000400 = "Сенсей."
10100-101000410 = "Если у вас есть время,"
10100-101000420 = "можем встретиться сейчас?"
10100-101000430 = "Что-то случилось?"
10100-101000440 = "Хм."
10100-101000450 = "У меня проблема..."
10100-101000460 = "Понял, я сейчас приду!"
10100-101000470 = "Хм, спасибо."
10100-101000480 = "Итог соревнования подведён."
10100-101000490 = "Вы соревновались!?"
10100-101000500 = "Хм."
10100-101000510 = "Так сложилось."
10100-101000520 = "Пришлось участвовать в велогонке."
10100-101000530 = "В велогонке!?"
10100-101000540 = "Кто победил!?"
10100-101000550 = "Хм..."
10100-101000560 = "4 победы, 7 поражений, 1 ничья."
10100-101000570 = "Я проиграла."
10100-101000580 = "Действующие гонщики сильнее, оказывается..."
10100-101000590 = "Но ничего, в этот раз так и быть."
10100-101000600 = "Соперник был в велоформе."
10100-101000610 = "Когда я буду готова,"
10100-101000620 = "планирую взять реванш."
10100-101000630 = "Приходите посмотреть, Сенсей."
10100-101000640 = "Да, конечно. Обязательно приду."
10100-101000650 = "За кого будете болеть, Сенсей?"
10100-101000660 = "Секрет."
10100-101000670 = "Я болею за вас обеих."
10100-101000680 = "Хм."
10100-101000690 = "Я знала, что вы так скажете."
10100-101000700 = "Спасибо, Сенсей."
10100-101000710 = "Свяжусь с вами позже."