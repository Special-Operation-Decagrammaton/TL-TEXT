[translation]
10100-101000010 = "Это тестовое сообщение."
10100-101000020 = "Кхм"
10100-101000030 = "КХМММ"
10100-101000040 = "Видишь? Работает?"
10100-101000050 = "Да, Широко, похоже, всё работает нормально"
10100-101000060 = "Эм..."
10100-101000070 = "Хорошо. Я рада."
10100-101000080 = "Поговорим позже."
10100-101000090 = "Эй, Широко, подожди. Ты сейчас где?"
10100-101000100 = "Я?"
10100-101000110 = "Я в районе Абидоса"
10100-101000120 = "Давай погуляем!!"
10100-101000130 = "...Хорошо."
10100-101000140 = "Я смогу"
10100-101000150 = "Буду ждать"
10100-101000160 = "Я быстро!"
10100-101000170 = "Моющее средство, 500 миллилитров молока, полдюжины яиц, салфетки, полотенце"
10100-101000180 = "Гель для душа < ОБЯЗАТЕЛЬНО"
10100-101000190 = "...А?"
10100-101000200 = "Широко?"
10100-101000210 = "А."
10100-101000220 = "Прости, Сенсей, не хотела отправлять это тебе."
10100-101000230 = "Эй, Сенсей."
10100-101000240 = "У меня потрясающая идея."
10100-101000250 = "Приходи сюда прямо сейчас."
10100-101000260 = "Не знаю, чего ожидать, но ладно!"
10100-101000270 = "Так, значит..."
10100-101000280 = "Так что..."
10100-101000290 = "Объясню лично."
10100-101000300 = "Сенсей, это катастрофа..."
10100-101000310 = "Я на всякий случай примерила мотокостюм..."
10100-101000320 = "Но молния..."
10100-101000330 = "Ой..."
10100-101000340 = "Ох,"
10100-101000350 = "чтобы не было недопонимания"
10100-101000360 = "Я НЕ поправилась."
10100-101000370 = "Эм, конечно нет..."
10100-101000380 = "..."
10100-101000390 = "Спокойной ночи, Сенсей."
10100-101000400 = "Эй, Сенсей"
10100-101000410 = "Можем погулять"
10100-101000420 = "Если ты не против?"
10100-101000430 = "Что случилось, Широко?"
10100-101000440 = "Эм"
10100-101000450 = "Мне нужен совет..."
10100-101000460 = "Хорошо!"
10100-101000470 = "Хорошо, спасибо."
10100-101000480 = "Дуэль..."
10100-101000490 = "Дуэль...?"
10100-101000500 = "А."
10100-101000510 = "Да."
10100-101000520 = "Каким-то образом всё закончилось уличной гонкой..."
10100-101000530 = "Уличной гонкой?!"
10100-101000540 = "Кто победил?!"
10100-101000550 = "Ну, если хочешь узнать результаты..."
10100-101000560 = "4 победы, 7 поражений, 1 ничья. Мы гонялись 12 раз."
10100-101000570 = "Я проиграла"
10100-101000580 = "Я знала, что они будут сильными..."
10100-101000590 = "Но ничего страшного."
10100-101000600 = "У них даже были мотокостюмы"
10100-101000610 = "В следующий раз я отыграюсь."
10100-101000620 = "Когда закончу свой байк"
10100-101000630 = "Приходи посмотреть, Сенсей."
10100-101000640 = "А, конечно. Буду."
10100-101000650 = "За кого будешь болеть?"
10100-101000660 = "Секрет."
10100-101000670 = "Не скажу."
10100-101000680 = "Хорошо."
10100-101000690 = "Я так и думала"
10100-101000700 = "Спасибо, Сенсей"
10100-101000710 = "До следующего раза."
