[translation]
10100-101000010 = "Teste"
10100-101000020 = "Ah"
10100-101000030 = "Alô, alô"
10100-101000040 = "Consegue ver essa mensagem?"
10100-101000050 = "Consigo ver direitinho, Shiroko."
10100-101000060 = "Hum."
10100-101000070 = "Que bom."
10100-101000080 = "Bom, depois entro em contato de novo."
10100-101000090 = "Espera, onde você está agora?"
10100-101000100 = "Eu?"
10100-101000110 = "No Distrito Autônomo de Abydos."
10100-101000120 = "Podemos nos encontrar um pouquinho agora?"
10100-101000130 = "...Hum."
10100-101000140 = "Tá bom."
10100-101000150 = "Vou ficar esperando."
10100-101000160 = "Já estou indo!"
10100-101000170 = "Ovos, leite, sabão em pó, toalha, lenço de papel."
10100-101000180 = "Ah, e sabonete líquido também."
10100-101000190 = "...Do que você tá falando?"
10100-101000200 = "Shiroko?"
10100-101000210 = "Ah"
10100-101000220 = "Desculpa, mandei no lugar errado."
10100-101000230 = "Sensei"
10100-101000240 = "Acabei de ter uma ideia muito boa."
10100-101000250 = "Você pode vir aqui um pouquinho?"
10100-101000260 = "Bom, de qualquer forma, já estou indo!"
10100-101000270 = "Ah"
10100-101000280 = "...Hum."
10100-101000290 = "Explico pessoalmente."
10100-101000300 = "Sensei, deu ruim."
10100-101000310 = "Fui experimentar a minha camisa de ciclismo antiga,"
10100-101000320 = "e o zíper..."
10100-101000330 = "Não me diga que...!?"
10100-101000340 = "Ah"
10100-101000350 = "Só pra deixar claro,"
10100-101000360 = "não é que eu tenha engordado."
10100-101000370 = "A-Ah, claro..."
10100-101000380 = "Hum."
10100-101000390 = "Boa noite, Sensei."
10100-101000400 = "Sensei"
10100-101000410 = "Se tiver um tempinho,"
10100-101000420 = "podemos nos ver agora?"
10100-101000430 = "Aconteceu alguma coisa?"
10100-101000440 = "Hum."
10100-101000450 = "Estou com uma preocupação..."
10100-101000460 = "Entendi, já estou indo praí!"
10100-101000470 = "Hum, obrigada."
10100-101000480 = "A disputa foi decidida."
10100-101000490 = "Vocês disputaram mesmo!?"
10100-101000500 = "Hum."
10100-101000510 = "Uma coisa levou à outra,"
10100-101000520 = "e acabamos apostando uma corrida de bicicleta."
10100-101000530 = "Uma corrida de bicicleta!?"
10100-101000540 = "E quem ganhou!?"
10100-101000550 = "Hum..."
10100-101000560 = "4 vitórias, 7 derrotas e 1 empate."
10100-101000570 = "Eu perdi."
10100-101000580 = "Pelo visto, quem está na ativa levou a melhor..."
10100-101000590 = "Mas dessa vez não teve jeito."
10100-101000600 = "A minha oponente estava usando camisa de ciclismo."
10100-101000610 = "Quando eu estiver devidamente preparada,"
10100-101000620 = "pretendo ter uma revanche."
10100-101000630 = "Quando o dia chegar, venha assistir, Sensei."
10100-101000640 = "Claro, pode deixar. Vou sem falta."
10100-101000650 = "E para quem você vai torcer, Sensei?"
10100-101000660 = "Isso é segredo."
10100-101000670 = "Vou torcer pelas duas."
10100-101000680 = "Hum."
10100-101000690 = "Imaginei que você diria isso."
10100-101000700 = "Obrigada, Sensei."
10100-101000710 = "Depois te mando mensagem de novo."
