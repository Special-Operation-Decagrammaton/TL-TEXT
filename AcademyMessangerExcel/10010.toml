[translation]
10010-720 = "Яичница, 500 мл молока, 3 ломтика помидора <- Завтрак"
10010-721 = "После завтрашней утренней пробежки зайти на рынок и купить нужное."
10010-722 = "А?"
10010-723 = "Широко?"
10010-724 = "А."
10010-725 = "Я хотела отправить эту заметку себе. Простите, Сенсей."
10010-726 = "Это вроде напоминания?"
10010-727 = "Странно использовать MomoTalk как напоминалку..."
10010-728 = "А... Правда?"
10010-729 = "Я просто пользуюсь им, потому что удобно..."
10010-730 = "А, кстати..."
10010-731 = "Я завтра утром собиралась на рынок за покупками."
10010-732 = "Эм, если вы не против, может, пойдём вместе?"
10010-733 = "На рынок? Хорошо."
10010-734 = "Конечно. Я тоже кое-что куплю."
10010-735 = "Хорошо. Тогда увидимся."
10010-736 = "Мне сказали, что пятнадцать километров - это не лёгкая пробежка..."
10010-737 = "Эм... Простите. В следующий раз учту."
10010-738 = "Сенсей."
10010-739 = "Сегодня по дороге в школу я видела фенека."
10010-740 = "Фенека? Интересно."
10010-741 = "Дикого?"
10010-742 = "Да. В последнее время часто его вижу."
10010-743 = "Вчера утром я видела что-то вроде метеоритного дождя."
10010-744 = "Во время пробежек я вижу много разного."
10010-745 = "Мне это очень нравится."
10010-746 = "Я за тобой не угонюсь, но буду болеть за тебя."
10010-747 = "...Хорошо."
10010-748 = "Я не привыкла, чтобы за меня кто-то болел."
10010-749 = "Так что..."
10010-750 = "Спасибо, Сенсей."
10010-751 = "Сенсей, насчёт сегодняшнего..."
10010-752 = "Простите. Я упустила детали."
10010-753 = "Мне стоило быть внимательнее. Простите."
10010-754 = "О..."
10010-755 = "Х-Хорошо..."
10010-756 = "Не нужно извиняться. Это мне стоит просить прощения."
10010-757 = "Хм..."
10010-758 = "Спасибо. До следующего раза."
10010-759 = "Сенсей."
10010-760 = "Вам нравятся велосипеды?"
10010-761 = "Теперь велосипеды?!"
10010-762 = "Хм... Не знаю..."
10010-763 = "Хм."
10010-764 = "Мне нравятся."
10010-765 = "Я слышала, в соседнем городе открылся новый веломагазин. Хотите сходить со мной посмотреть?"
10010-766 = "Эм, сегодня было весело, Сенсей."
10010-767 = "Я посмотрела на беспроводную трансмиссию и новую карбоновую раму."
10010-768 = "И купила новую бутылку для велосипеда..."
10010-769 = "Эм, можно в следующий раз снова пойти вместе?"
10010-770 = "Да. Мне теперь тоже немного интересны велосипеды."
10010-771 = "Я мало о них знал, но было весело."
10010-772 = "В D.U., где находится Шале, есть метро, верно?"
10010-773 = "Хм, наверное, вы часто им пользуетесь."
10010-774 = "Да. Я часто езжу на нём, когда бываю рядом с Шале."
10010-775 = "Метро - лучший способ ездить на работу и обратно."
10010-776 = "Хм. Спасибо, буду иметь в виду."
10010-777 = "А?"
10010-778 = "Снаряжение: бинокль, расположение камер наблюдения и глушилки GPS-трекеров."
10010-779 = "Проверить маршрут. Требуется обзор на 360 градусов."
10010-780 = "...?!"
10010-781 = "Простите... Широко?"
10010-782 = "А."
10010-783 = "Простите, Сенсей. Это сообщение было не вам."
10010-784 = "Я снова так сделала. Наверное, потому что закрепила вас вверху мессенджера."
10010-785 = "Эм, не обращайте внимания на то сообщение."
10010-786 = "Сенсей, я думала об этом с тех пор, как вернулась домой. Что, если ограбить другую академию?"
10010-787 = "Хм."
10010-788 = "...Простите. Я понимаю, что это бред."
10010-789 = "Сенсей."
10010-790 = "Сегодня."
10010-791 = "Мне нужно кое-что сказать тебе, Широко."
10010-792 = "Хорошо. Мне тоже нужно кое-что вам сказать."
10010-793 = "...А?"
10010-794 = "Мне?"
10010-795 = "Правда, Сенсей?"
10010-796 = "Это важно."
10010-797 = "Мне нужно увидеться с тобой наедине."
10010-798 = "А."
10010-799 = "Ну... Хорошо."
10010-800 = "После уроков буду в классе."
10010-801 = "Сенсей."
10010-802 = "Это прозвучит странно."
10010-803 = "Если в будущем мне снова понадобится наставление,"
10010-804 = "пожалуйста, поправляйте меня."
10010-805 = "Иметь рядом взрослого, которому не всё равно..."
10010-806 = "Это..."
10010-807 = "...довольно приятно."
10010-100100010 = "Сенсей."
10010-100100020 = "Вы всё ещё пользуетесь общественным транспортом?"
10010-100100030 = "Да. Особого выбора нет..."
10010-100100040 = "Я уже слишком стар, чтобы везде ездить на велосипеде..."
10010-100100050 = "Хм."
10010-100100060 = "Поняла."
10010-100100070 = "До встречи."
10010-100100080 = "Широко...?"
