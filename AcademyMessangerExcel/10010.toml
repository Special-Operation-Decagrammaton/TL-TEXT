[translation]
10010-720 = "Ovos mexidos, 500 ml de leite, 3 fatias de tomate → café da manhã"
10010-721 = "Amanhã de manhã, passar no supermercado depois da corrida"
10010-722 = "...?"
10010-723 = "Shiroko?"
10010-724 = "Ah."
10010-725 = "Era um lembrete pra mim mesma e mandei errado. Desculpa, Sensei."
10010-726 = "Usando o chat como bloco de notas?"
10010-727 = "Não sabia que dava pra usar o MomoTalk desse jeito também."
10010-728 = "Hum... como eu uso o tempo todo, é prático."
10010-729 = "Mas acho que nunca vi muita gente usando assim."
10010-730 = "Ah, aproveitando o que acabei de mandar sem querer:"
10010-731 = "Como escrevi ali, tô pensando em passar no supermercado amanhã de manhã pra fazer compras."
10010-732 = "Se quiser, que tal ir comigo?"
10010-733 = "Claro, com prazer."
10010-734 = "Eu também tava precisando comprar umas coisas."
10010-735 = "Então nos vemos naquele lugar."
10010-736 = "15 km é uma distância puxada dependendo da pessoa, né?"
10010-737 = "Desculpa... da próxima vez vou pegar mais leve."
10010-738 = "Sensei."
10010-739 = "Hoje eu vi uma raposa-do-deserto no caminho da escola."
10010-740 = "Uma raposa-do-deserto? Que raro!"
10010-741 = "Será que é selvagem?"
10010-742 = "Sim. Parece que ultimamente ela aparece por aqueles lados de vez em quando."
10010-743 = "Ah, e ontem à noite eu também vi uma chuva de meteoros."
10010-744 = "Quando saio pra correr, acabo vendo todo tipo de coisa."
10010-745 = "Não é só correr que é bom; essas descobertas também são divertidas."
10010-746 = "Que legal. Não consigo acompanhar o seu ritmo correndo, mas tô na torcida."
10010-747 = "...Hum."
10010-748 = "Desculpa. Não tô muito acostumada a ouvir palavras tão gentis assim."
10010-749 = "Hum..."
10010-750 = "Obrigada, Sensei."
10010-751 = "Sensei, sobre o que aconteceu hoje..."
10010-752 = "Me desculpa mesmo, faltou sensibilidade da minha parte..."
10010-753 = "Eu devia ter percebido antes. Foi mal."
10010-754 = "Ah..."
10010-755 = "Hum, digo..."
10010-756 = "Imagina, eu que peço desculpas..."
10010-757 = "Bom, então vamos encerrar o assunto por aqui..."
10010-758 = "Obrigada por hoje. Até mais."
10010-759 = "Sensei."
10010-760 = "Você gosta de bicicleta?"
10010-761 = "Gosto sim, mas que pergunta repentina!"
10010-762 = "Bicicleta, é...? Bom, gosto na medida do possível..."
10010-763 = "Hum, entendi."
10010-764 = "Eu gosto bastante."
10010-765 = "Parece que abriu uma loja de bicicletas nova recentemente. Quer ir lá comigo?"
10010-766 = "Hum, hoje foi bem divertido."
10010-767 = "Deu pra ver o câmbio eletrônico sem fio e os quadros novos,"
10010-768 = "e também comprei uma caramanhola nova de ciclismo, mas..."
10010-769 = "Hum, Sensei. Você iria comigo de novo numa próxima vez?"
10010-770 = "Claro. Acho que até eu comecei a pegar gosto pela coisa."
10010-771 = "Eu também me diverti, então vamos com certeza."
10010-772 = "A D.U., onde fica a Schale, tem várias linhas de metrô passando, né?"
10010-773 = "Você também usa bastante, Sensei?"
10010-774 = "Sim, quando saio da Schale costumo pegar bastante o metrô."
10010-775 = "Sim, metrô faz parte da rotina de qualquer trabalhador."
10010-776 = "Faz sentido, obrigada. ...Vou anotar isso para referência."
10010-777 = "...Para referência?"
10010-778 = "Itens para preparar: binóculos, dados de localização das câmeras de segurança, bloqueador de sinal de rastreamento GPS"
10010-779 = "Checar rotas de fuga. Necessário garantir visão de 360 graus."
10010-780 = "?!"
10010-781 = "Hum, senhorita Shiroko?"
10010-782 = "Ah."
10010-783 = "Desculpa, Sensei, mandei no chat errado de novo."
10010-784 = "Deve ser porque o seu chat tá fixado no topo dos meus favoritos."
10010-785 = "Pode ignorar a mensagem de agora há pouco."
10010-786 = "Sensei, pensei melhor quando cheguei em casa: que tal a gente assaltar outra academia?"
10010-787 = "...Hum..."
10010-788 = "...Foi mal, esquece o que eu acabei de dizer."
10010-789 = "Sensei."
10010-790 = "Hoje, sabe, hum..."
10010-791 = "Ah, que boa hora."
10010-792 = "Eu também tinha uma coisa pra conversar com você, Shiroko."
10010-793 = "...Hum?"
10010-794 = "Comigo?"
10010-795 = "Você, Sensei?"
10010-796 = "Sim, é um assunto importante."
10010-797 = "Queria conversar a sós com você."
10010-798 = "...Hum."
10010-799 = "Entendi."
10010-800 = "Então vou estar te esperando na sala de aula depois das aulas."
10010-801 = "Sensei."
10010-802 = "Talvez o que eu vá dizer soe estranho, mas..."
10010-803 = "Daqui pra frente também, se achar que estou prestes a fazer algo errado,"
10010-804 = "quero que você me dê uma bronca."
10010-805 = "Ter um adulto que se preocupa comigo desse jeito..."
10010-806 = "Hum, como posso explicar..."
10010-807 = "Me deixa muito feliz."
10010-100100010 = "Sensei."
10010-100100020 = "Você ainda tem pego o metrô de sempre ultimamente?"
10010-100100030 = "É que fora o metrô não tenho muitas outras opções..."
10010-100100040 = "Não tenho fôlego pra ir de bike de estrada que nem você..."
10010-100100050 = "Hum."
10010-100100060 = "Entendi."
10010-100100070 = "Então até mais."
10010-100100080 = "Shiroko...?"
