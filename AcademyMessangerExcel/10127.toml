[translation]
10127-101270010 = "Здравствуйте, Сенсей. Это Сакураи Миё."
10127-101270020 = "Кажется, завтра моя очередь дежурить представителем студентов..."
10127-101270030 = "но я отменю, если это доставит вам неудобства."
10127-101270040 = "Буду ждать вашего ответа."
10127-101270050 = "...Да, поняла."
10127-101270060 = "Принято. Тогда увидимся в другой раз, Сенсей."
10127-101270070 = "Нет! Не отменяй!"
10127-101270080 = "Я правда хочу тебя увидеть, Миё!"
10127-101270090 = "Э-э-э...!"
10127-101270100 = "Простите, что убежала сама по себе, Сенсей."
10127-101270110 = "Всё нормально, когда пишешь, всякое случается."
10127-101270120 = "Спасибо за понимание..."
10127-101270130 = "Но эти двое в итоге побеждают?"
10127-101270140 = "А-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а-а!"
10127-101270150 = "Я сверилась с расписанием,"
10127-101270160 = "и думаю, что лучше всего будет в 14:00."
10127-101270170 = "А...?"
10127-101270180 = "А."
10127-101270190 = "Не тому человеку."
10127-101270200 = "Прошу прощения. Пожалуйста, не обращайте внимания."
10127-101270210 = "Сенсей"
10127-101270220 = "У вас есть минутка?"
10127-101270230 = "Я найду время! Как-нибудь!"
10127-101270240 = "Пожалуйста, пощадите!"
10127-101270250 = "...Вот как вы меня воспринимаете?"
10127-101270260 = "Простите, Сенсей..."
10127-101270270 = "Такое чувство, будто я весь день таскала вас за собой..."
10127-101270280 = "Не извиняйся, мне тоже было весело."
10127-101270290 = "Спасибо."
10127-101270300 = "Тогда, эм..."
10127-101270310 = "в следующий раз тоже..."
10127-101270320 = "Здравствуйте, Сенсей."
10127-101270330 = "Я слышала, вы в последнее время часто бываете в Вайлдханте."
10127-101270340 = "Ага, накопилось много бумажной работы."
10127-101270350 = "Я занимаюсь вопросами торговли и таможни для произведений искусства."
10127-101270360 = "Хм..."
10127-101270370 = "Хм?"
10127-101270380 = "До здания, куда вы сегодня ходили,"
10127-101270390 = "можно быстрее добраться, если повернуть налево"
10127-101270400 = "перед фиолетовой статуей."
10127-101270410 = "А, понятно... Спасибо, Миё."
10127-101270420 = "Откуда ты это знаешь?"
10127-101270430 = "Ты... знаешь всё моё расписание?"
10127-101270440 = "Эм, Миё? Миё...?"
