[translation]
10127-101270010 = "Sensei, aqui é a Sakurai Miyo."
10127-101270020 = "Sobre o meu plantão de amanhã..."
10127-101270030 = "Se a minha presença for causar algum incômodo, posso deixar para uma próxima ocasião."
10127-101270040 = "Aguardo o seu retorno."
10127-101270050 = "Não precisa se preocupar com isso...?"
10127-101270060 = "Compreendido, então desta vez deixarei para..."
10127-101270070 = "Não, espera! Não deixe para depois!"
10127-101270080 = "Estou super ansioso para te ver, Miyo!!"
10127-101270090 = "Hyauu..."
10127-101270100 = "Desculpe por ter ido embora do nada mesmo estando de plantão..."
10127-101270110 = "Todo mundo tem dias em que precisa sair para tomar um ar."
10127-101270120 = "Muito obrigada..."
10127-101270130 = "Mas e aí, aqueles dois vão conseguir vencer a divisão de tanques?"
10127-101270140 = "Uaaaaaaaaaaaah!"
10127-101270150 = "Perfeitamente."
10127-101270160 = "Nesse caso, que tal a partir das 14h?"
10127-101270170 = "Hã...?"
10127-101270180 = "Ah!"
10127-101270190 = "Me desculpe."
10127-101270200 = "Mandei para a pessoa errada. Por favor, esqueça isso."
10127-101270210 = "Sensei,"
10127-101270220 = "você teria um tempinho agora?"
10127-101270230 = "Ah, eu arranjo tempo...!"
10127-101270240 = "Deixo a minha agenda livre na hora...!"
10127-101270250 = "...O-O que deu em você?"
10127-101270260 = "Me desculpe, Sensei..."
10127-101270270 = "Acabei te arrastando de um lado para o outro..."
10127-101270280 = "Que nada, foi muito divertido."
10127-101270290 = "Muito obrigada."
10127-101270300 = "Então, hum..."
10127-101270310 = "Se puder me acompanhar na próxima vez também..."
10127-101270320 = "Sensei,"
10127-101270330 = "ouvi dizer que você tem vindo bastante à Wild Hunt ultimamente."
10127-101270340 = "Sim, por causa do trabalho envolvendo comércio de obras de arte e trâmites alfandegários."
10127-101270350 = "Tinha muita papelada para resolver."
10127-101270360 = "Entendo..."
10127-101270370 = "Miyo?"
10127-101270380 = "Sobre aquele prédio que você visitou hoje..."
10127-101270390 = "Se você virar à esquerda na estátua esculpida em roxo,"
10127-101270400 = "tem um ótimo atalho."
10127-101270410 = "Ah, beleza. Obrigado, Miyo."
10127-101270420 = "...Aliás, como é que você sabe"
10127-101270430 = "todo o trajeto que eu fiz hoje?"
10127-101270440 = "...Miyo?"
