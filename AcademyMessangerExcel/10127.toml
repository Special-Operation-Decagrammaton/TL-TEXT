[translation]
10127-101270010 = "Сенсей, это Сакураи Миё."
10127-101270020 = "Я должна завтра дежурить, но..."
10127-101270030 = "если я могу вам помешать, я могла бы отказаться."
10127-101270040 = "Жду вашего ответа."
10127-101270050 = "Можно не обращать внимания...?"
10127-101270060 = "Поняла, тогда в этот раз я..."
10127-101270070 = "Нет-нет, не отказывайся!"
10127-101270080 = "Я с нетерпением жду встречи с тобой!!"
10127-101270090 = "Ай-яй..."
10127-101270100 = "Простите, я ушла без спроса, хотя должна была дежурить..."
10127-101270110 = "Иногда хочется выйти и проветриться."
10127-101270120 = "Спасибо..."
10127-101270130 = "И всё же, смогут те двое победить танковый отряд?"
10127-101270140 = "Ааааааааааааа!"
10127-101270150 = "Поняла."
10127-101270160 = "Тогда как насчёт 14:00?"
10127-101270170 = "Что...?"
10127-101270180 = "Ах"
10127-101270190 = "Прошу прощения."
10127-101270200 = "Я ошиблась. Забудьте."
10127-101270210 = "Сенсей,"
10127-101270220 = "у вас есть немного времени?"
10127-101270230 = "А, я освобожу...!"
10127-101270240 = "Я обязательно освобожу...!"
10127-101270250 = "... Ч-что случилось?"
10127-101270260 = "Простите, Сенсей..."
10127-101270270 = "я вас заставляла бегать туда-сюда..."
10127-101270280 = "Нет, мне было весело."
10127-101270290 = "Спасибо."
10127-101270300 = "Тогда, эм..."
10127-101270310 = "в следующий раз тоже..."
10127-101270320 = "Сенсей,"
10127-101270330 = "я слышала, вы в последнее время часто бываете в Дикой Охоте."
10127-101270340 = "Да, по делам, связанным с торговлей произведениями искусства и таможней."
10127-101270350 = "Было много всяких процедур."
10127-101270360 = "Хм..."
10127-101270370 = "Миё?"
10127-101270380 = "В том здании, где вы сегодня были,"
10127-101270390 = "если свернуть налево у фиолетовой скульптуры,"
10127-101270400 = "там будет короткий путь."
10127-101270410 = "А, да. Спасибо, Миё."
10127-101270420 = "... Кстати, мой маршрут передвижения"
10127-101270430 = "ты вообще откуда знаешь?"
10127-101270440 = "... Миё?"