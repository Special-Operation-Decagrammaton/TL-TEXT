[translation]
10088-100880010 = "Ну что сказать..."
10088-100880020 = "Я ожидала этого, но... такая толпа может утомить."
10088-100880030 = "Основные дела на сегодня закончены."
10088-100880040 = "Может, немного отдохну."
10088-100880050 = "Каёко тоже отдыхает?"
10088-100880060 = "Знаешь какое-нибудь хорошее место?"
10088-100880070 = "Хе-хе."
10088-100880080 = "Сенсей тоже устал."
10088-100880090 = "...Да, наверное."
10088-100880100 = "Как раз есть одно хорошее место."
10088-100880110 = "Сенсей."
10088-100880120 = "Кстати, на всякий случай..."
10088-100880130 = "Если снова понадобится, всегда зовите."
10088-100880140 = "Не волнуйся, я никому не расскажу."
10088-100880150 = "Ага."
10088-100880160 = "Спасибо."
10088-100880170 = "Сенсей."
10088-100880180 = "Вы сегодня говорили, что зайдёте в офис."
10088-100880190 = "Да. Какие-то срочные дела появились?"
10088-100880200 = "Нет."
10088-100880210 = "Просто в это время там, наверное, никого нет."
10088-100880220 = "Я открою офис."
10088-100880230 = "Тогда я буду ждать."
10088-100880240 = "Сенсей."
10088-100880250 = "У вас будет время попозже?"
10088-100880260 = "Кайоко?"
10088-100880270 = "Что случилось?"
10088-100880280 = "Да нет."
10088-100880290 = "Ничего серьёзного."
10088-100880300 = "Просто хочу отблагодарить вас за прошлый раз."
10088-100880310 = "Короче, скажите, когда вам удобно."
10088-100880320 = "Я подстроюсь."
10088-100880330 = "А."
10088-100880340 = "Я забыла кое-что сказать."
10088-100880350 = "М-м."
10088-100880360 = "...Кайоко?"
10088-100880370 = "Что ты забыла сказать?"
10088-100880380 = "М-м."
10088-100880390 = "Наверное."
10088-100880400 = "Пока не буду."
10088-100880410 = "Потом."
10088-100880420 = "Поговорим в другой раз."
10088-100880430 = "Ну,"
10088-100880440 = "До встречи, Сенсей."