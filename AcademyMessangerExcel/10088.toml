[translation]
10088-100880010 = "Como posso dizer..."
10088-100880020 = "Eu já esperava por isso, mas... essa multidão cansa um pouco."
10088-100880030 = "O trabalho imediato já acabou mesmo,"
10088-100880040 = "acho que vou descansar um pouco."
10088-100880050 = "Você também vai fazer uma pausa, Kayoko?"
10088-100880060 = "Conhece algum lugar bom por perto?"
10088-100880070 = "Hehe"
10088-100880080 = "Então você também cansou, Sensei."
10088-100880090 = "...Pois é."
10088-100880100 = "Conheço um lugar perfeito."
10088-100880110 = "Sensei"
10088-100880120 = "Só pra deixar avisado..."
10088-100880130 = "Se precisar de mim de novo, pode chamar a qualquer hora."
10088-100880140 = "Relaxa, vou manter segredo do pessoal."
10088-100880150 = "Tá bom."
10088-100880160 = "Obrigado."
10088-100880170 = "Sensei"
10088-100880180 = "Você disse que viria ao escritório hoje, né?"
10088-100880190 = "Sim. Surgiu algum trabalho urgente?"
10088-100880200 = "Não."
10088-100880210 = "É só que, nesse horário, acho que ainda não vai ter ninguém lá."
10088-100880220 = "Então vou deixar o escritório aberto pra você."
10088-100880230 = "Bom, vou estar te esperando."
10088-100880240 = "Sensei"
10088-100880250 = "Você tem um tempinho mais tarde?"
10088-100880260 = "Kayoko?"
10088-100880270 = "O que houve?"
10088-100880280 = "Nada demais."
10088-100880290 = "Não é grande coisa, mas..."
10088-100880300 = "Eu queria meio que retribuir pelo que você fez outro dia."
10088-100880310 = "Enfim, pode ser quando for melhor pra você, é só me avisar."
10088-100880320 = "Eu me ajusto ao seu horário."
10088-100880330 = "Ah"
10088-100880340 = "Acabei esquecendo de falar uma coisa..."
10088-100880350 = "Huum..."
10088-100880360 = "...Kayoko?"
10088-100880370 = "O que você esqueceu de falar?"
10088-100880380 = "Huum..."
10088-100880390 = "Quer saber..."
10088-100880400 = "Melhor deixar pra lá por enquanto."
10088-100880410 = "Mais tarde"
10088-100880420 = "eu falo com você direito."
10088-100880430 = "Então,"
10088-100880440 = "até mais, Sensei."
