[translation]
10088-100880010 = "Ну..."
10088-100880020 = "Я знала, что толпы людей утомляют. И была права."
10088-100880030 = "На сегодня с меня хватит."
10088-100880040 = "Мне нужен отдых."
10088-100880050 = "Переводишь дух?"
10088-100880060 = "Где собираешься отдохнуть?"
10088-100880070 = "Хи-хи."
10088-100880080 = "Даже такие, как ты, тоже устают."
10088-100880090 = "Ну..."
10088-100880100 = "Может, оно и к лучшему."
10088-100880110 = "Сенсей."
10088-100880120 = "Наверное, можно и не говорить, но..."
10088-100880130 = "Если тебе понадобится что-то ещё, скажи."
10088-100880140 = "Не переживай. Я унесу это с собой в могилу."
10088-100880150 = "Отлично,"
10088-100880160 = "спасибо."
10088-100880170 = "Сенсей."
10088-100880180 = "Я слышала, у тебя были дела в нашем офисе."
10088-100880190 = "Ага. Что-то не так?"
10088-100880200 = "Нет."
10088-100880210 = "Я думала, к этому времени офис уже опустеет."
10088-100880220 = "Похоже, встречать тебя выпало мне."
10088-100880230 = "До скорого, Сенсей."
10088-100880240 = "Сенсей."
10088-100880250 = "Есть шанс, что позже ты будешь свободен?"
10088-100880260 = "О, Каёко."
10088-100880270 = "Что такое?"
10088-100880280 = "Ну,"
10088-100880290 = "ничего серьёзного..."
10088-100880300 = "Просто хочу сказать спасибо за то, что было раньше."
10088-100880310 = "В любом случае, дай знать, когда освободишься."
10088-100880320 = "Остальное я возьму на себя."
10088-100880330 = "О."
10088-100880340 = "есть кое-что, что я забыла тебе сказать."
10088-100880350 = "Эм"
10088-100880360 = "...Каёко?"
10088-100880370 = "Что ты забыла? Нужно помочь найти?"
10088-100880380 = "Эм"
10088-100880390 = "Нет."
10088-100880400 = "Всё нормально."
10088-100880410 = "Поговорим позже..."
10088-100880420 = "Тогда и расскажу."
10088-100880430 = "Ну тогда"
10088-100880440 = "осторожнее по дороге назад, Сенсей."
