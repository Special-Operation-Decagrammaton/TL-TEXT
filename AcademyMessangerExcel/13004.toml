[translation]
13004-992 = "Сегодня день, который обещает быть удачным."
13004-993 = "А как у вас, Сенсей? Хорошо проводите время?"
13004-994 = "Пусть ваш день будет хорошим. Я буду за вас болеть!"
13004-995 = "Спасибо, Нономи."
13004-996 = "Пусть и у тебя всё будет хорошо."
13004-997 = "А..."
13004-998 = "Ух ты...!"
13004-999 = "Я и не думала, что вы ответите, как приятно~☆"
13004-1000 = "Я получила ответ от Сенсея!"
13004-1001 = "Я уже счастлива до конца дня!"
13004-1002 = "Это было моё первое особенное приветствие, но я ещё буду иногда вам писать☆"
13004-1003 = "♡♡"
13004-1004 = "Это я пригласила, так что я хотела угостить вас, Сенсей..."
13004-1005 = "Но в следующий раз, когда мы куда-то пойдём, позвольте мне заплатить, хорошо?"
13004-1006 = "Обязательно?"
13004-1007 = "Сегодня я планирую устроить большую уборку в классе комитета!"
13004-1008 = "К тому времени, как вы придёте, Сенсей, там будет гораздо чище, чем раньше☆"
13004-1009 = "Когда закончите, обязательно зайдите посмотреть, хорошо?"
13004-1010 = "Ага, как только закончу работу, сразу приду."
13004-1011 = "Хорошо, я буду ждать."
13004-1012 = "Спасибо за сегодня!"
13004-1013 = "Я ещё не отблагодарила вас за прошлый раз, что же мне делать...?"
13004-1014 = "Вы так много для меня делаете, Сенсей."
13004-1015 = "Сенсей~☆"
13004-1016 = "В следующие выходные, если у вас будет время, не хотите сходить за покупками вместе?"
13004-1017 = "Покупки? Звучит весело."
13004-1018 = "Давай обязательно сходим вместе!"
13004-1019 = "Ух ты! Спасибо~!"
13004-1020 = "Это свидание с Сенсеем вдвоём!"
13004-1021 = "А, нет, покупки, конечно, покупки, мы идём за покупками~☆"
13004-1022 = "Тогда я буду ждать вас в торговом центре~☆"
13004-1023 = "Вы благополучно добрались до дома? Уши не болят?"
13004-1024 = "Мне сегодня было очень весело."
13004-1025 = "И, к тому же, не так много людей знают, что у вас внутри ушей...☆"
13004-1026 = "Ну, до встречи, и пусть завтрашний день будет счастливым~♡"
13004-1027 = "На днях мы все вместе играли в реверси... и я не выиграла ни разу."
13004-1028 = "Все играют так хорошо... особенно Хошино, она была очень сильна!"
13004-1029 = "Так нельзя, мне нужно тренироваться!"
13004-1030 = "Тренировки! Звучит серьёзно! Давай!"
13004-1031 = "Понятно, удачи. Я поддерживаю тебя."
13004-1032 = "Да! Я постараюсь!"
13004-1033 = "Вы уже добрались до дома, Сенсей?"
13004-1034 = "Спасибо за сегодня. Мне было очень весело."
13004-1035 = "Хотелось бы в следующий раз поиграть с вами в разные игры☆"
13004-1036 = "Сенсей, вам не нужна гантель?"
13004-1037 = "Я купила несколько штук в подарок Сироко-тян, и остались лишние."
13004-1038 = "Они лежат на поле Абидоса, так что если хотите, заберите."
13004-130040010 = "124. Вечеринка в честь годовщины открытия школы в классе."
13004-130040020 = "125. Мини-спортивный праздник на поле."
13004-130040030 = "Нономи?"
13004-130040040 = "А?"
13004-130040050 = "Сенсей?"
13004-130040060 = "Кажется, в календаре не было таких планов...?"
13004-130040070 = "Ну..."
13004-130040080 = "Э-это я случайно отправила вам заметки для себя."
13004-130040090 = "Простите!"
13004-130040100 = "Не обращайте внимания!"
13004-130040110 = "Ну, если так, то ладно..."