[translation]
13004-992 = "Sinto que hoje vai ser um dia cheio de coisas boas"
13004-993 = "Como você está agora, Sensei? Está se divertindo?"
13004-994 = "Espero que o seu dia seja maravilhoso. Estou sempre torcendo por você, Sensei!"
13004-995 = "Obrigado, Nonomi"
13004-996 = "Espero que aconteçam muitas coisas boas com você também, Nonomi"
13004-997 = "Ah..."
13004-998 = "Uaaau...!"
13004-999 = "Não achei que você fosse conseguir responder agora, que alegria~☆"
13004-1000 = "Receber uma resposta sua, Sensei!"
13004-1001 = "Só isso já é mais do que suficiente para me deixar super feliz pelo resto do dia!"
13004-1002 = "Esse foi só o meu primeiro cumprimento especial, mas vou continuar mandando mensagens de vez em quando, viu?☆"
13004-1003 = "♡♡"
13004-1004 = "Como fui eu quem convidou, queria que deixasse eu pagar a conta para você, Sensei..."
13004-1005 = "Da próxima vez que sairmos para algum lugar, deixe por minha conta, tá bom?"
13004-1006 = "Promete mesmo?"
13004-1007 = "Hoje estou pensando em fazer uma grande faxina na sala do Comitê de Contramedidas!"
13004-1008 = "Quando você vier nos visitar, Sensei, vai estar muito mais limpinha do que antes☆"
13004-1009 = "Quando eu terminar, venha dar uma olhada, tá bom?"
13004-1010 = "Combinado, assim que eu terminar o trabalho aqui já vou para aí"
13004-1011 = "Bom trabalho, mal posso esperar para ver"
13004-1012 = "Muito obrigada pelo seu esforço hoje!"
13004-1013 = "Ainda nem consegui retribuir o favor da outra vez, o que eu faço...?"
13004-1014 = "Você está sempre fazendo tanta coisa por mim, Sensei"
13004-1015 = "Sensei~☆"
13004-1016 = "Na próxima folga, se você tiver um tempinho, que tal irmos fazer compras juntos?"
13004-1017 = "Fazer compras, é? Parece divertido"
13004-1018 = "Com certeza, vamos juntos sim!"
13004-1019 = "Oba! Muito obrigada~!"
13004-1020 = "Um encontro a sós com o Sensei!"
13004-1021 = "Ah, quer dizer, compras! Só compras, fazendo compras com o Sensei~☆"
13004-1022 = "Então vou ficar te esperando lá no shopping, tá bom?~☆"
13004-1023 = "Chegou bem em casa? A sua orelha não está doendo nem nada?"
13004-1024 = "Eu me diverti tantooo no dia de hoje"
13004-1025 = "Além do mais, não deve ter quase ninguém que conheça o interior da orelha do Sensei como eu...☆"
13004-1026 = "Então até mais, que amanhã também seja um dia cheio de felicidade~♡"
13004-1027 = "Outro dia jogamos Othello juntas no clube... mas eu não consegui ganhar nenhuma vez"
13004-1028 = "Todo mundo manda muito bem... Principalmente a Hoshino-senpai, ela é forte demais!"
13004-1029 = "Não posso deixar as coisas assim, preciso fazer um treinamento especial!"
13004-1030 = "Treinamento especial! Gostei da empolgação! Vai com tudo!!"
13004-1031 = "Entendi, dê o seu melhor. Estou na torcida"
13004-1032 = "Sim! Vou me esforçar!"
13004-1033 = "Já chegou em casa, Sensei?"
13004-1034 = "Muito obrigada por hoje. Eu me diverti demais"
13004-1035 = "Na próxima vez, quero jogar vários outros jogos junto com você, Sensei☆"
13004-1036 = "Sensei, por acaso você não gostaria de uns halteres?"
13004-1037 = "Comprei um conjunto para dar de presente para a Shiroko-chan, mas acabaram sobrando alguns"
13004-1038 = "Eles estão lá no pátio de Abydos, então se quiser pode levar para você"
13004-130040010 = "124. Festa de aniversário de fundação da escola na sala de aula"
13004-130040020 = "125. Mini gincana esportiva no pátio"
13004-130040030 = "Nonomi?"
13004-130040040 = "Hã"
13004-130040050 = "Sensei?"
13004-130040060 = "Acho que não tinha nada disso marcado no calendário...?"
13004-130040070 = "Bem"
13004-130040080 = "Err... Acabei mandando minhas anotações pessoais para você sem querer, Sensei"
13004-130040090 = "Me desculpe!"
13004-130040100 = "Por favor, ignore isso!"
13004-130040110 = "Bom, se era só isso tudo bem, mas..."
