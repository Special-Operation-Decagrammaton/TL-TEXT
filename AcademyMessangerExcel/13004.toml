[translation]
13004-992 = "Да. У меня чувство, что сегодня будет весело."
13004-993 = "Как проходит ваш день? Хорошо проводите время?"
13004-994 = "Хорошего дня, Сенсей! Я буду болеть за вас!"
13004-995 = "Спасибо, Нономи."
13004-996 = "И тебе хорошего дня, Нономи!"
13004-997 = "А?"
13004-998 = "Ого!"
13004-999 = "Не думала, что вы ответите. Я так рада! ☆"
13004-1000 = "Сенсей мне ответил!"
13004-1001 = "Ага-ага! Вы сделали мой день!"
13004-1002 = "О, я просто поздоровалась. Буду иногда вам писать. ☆"
13004-1003 = "♥♥"
13004-1004 = "Эм... Я очень хотела отплатить вам за сегодня..."
13004-1005 = "Так что в следующий раз обязательно позвольте!"
13004-1006 = "Ага-ага, обязательно."
13004-1007 = "Сегодня мы убираемся в комнате Комитета по противодействию закрытию!"
13004-1008 = "В следующий раз, когда придёте, вас будет ждать чистая клубная комната! ☆"
13004-1009 = "Ага-ага, так что обязательно снова заглядывайте!"
13004-1010 = "Хорошо, обязательно зайду."
13004-1011 = "Не переусердствуй."
13004-1012 = "Спасибо за вашу тяжёлую работу сегодня!"
13004-1013 = "Я всё ещё не отплатила вам за прошлый раз... Что мне делать?"
13004-1014 = "Я всё больше и больше вам должна."
13004-1015 = "Сенсей! ☆"
13004-1016 = "Если у вас есть время на этих выходных, сходим со мной за покупками?"
13004-1017 = "За покупками? Звучит весело."
13004-1018 = "Хорошо. Пойдём вместе!"
13004-1019 = "Ого!"
13004-1020 = "Это свидание!"
13004-1021 = "Нет, просто покупки. Покупки! ☆"
13004-1022 = "Буду ждать вас."
13004-1023 = "Вы благополучно добрались домой? Как ваши уши?"
13004-1024 = "Сегодня было очень весело."
13004-1025 = "Готова поспорить, я единственная, кто заглядывал вам в ухо!"
13004-1026 = "Ха-ха. Хорошего дня! ♥"
13004-1027 = "Хм... Мы играли в реверси, которое я купила в прошлый раз, но я одна ни разу не победила."
13004-1028 = "Все были такие сильные... особенно Хошино! Вот уж сложный соперник!"
13004-1029 = "Мне понадобятся особые тренировки!"
13004-1030 = "Особые тренировки? Да, вперёд!"
13004-1031 = "Держись."
13004-1032 = "Хорошо, Сенсей, я постараюсь!"
13004-1033 = "Вы благополучно добрались домой, Сенсей?"
13004-1034 = "Сегодня было очень весело."
13004-1035 = "Надеюсь, скоро снова сыграем в реверси! ☆"
13004-1036 = "Сенсей, вам не нужны гантели?"
13004-1037 = "Я купила их в подарок Широко, но осталось несколько лишних."
13004-1038 = "Можете забрать, если хотите."
13004-130040010 = "124. Устроить вечеринку в честь открытия в зале заседаний"
13004-130040020 = "125. Устроить мини-спартакиаду на поле"
13004-130040030 = "Нономи?"
13004-130040040 = "А."
13004-130040050 = "Сенсей?"
13004-130040060 = "Что это за вечеринка и мини-спартакиада?"
13004-130040070 = "Ну..."
13004-130040080 = "Я делала заметки и случайно отправила их вам, Сенсей."
13004-130040090 = "Простите за путаницу."
13004-130040100 = "Пожалуйста, не обращайте внимания на эти сообщения!"
13004-130040110 = "Раз ты так говоришь..."
