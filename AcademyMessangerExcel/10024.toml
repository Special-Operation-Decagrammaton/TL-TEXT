[translation]
10024-100240010 = "Я планирую на время уехать подальше."
10024-100240020 = "Всем я уже отправила сообщения,"
10024-100240030 = "но решила сказать и тебе, Сенсей."
10024-100240040 = "...Уехать подальше?"
10024-100240050 = "Так внезапно...?"
10024-100240060 = "Всё в порядке, ничего серьёзного."
10024-100240070 = "Тогда до встречи, Сенсей."
10024-100240080 = "Сенсей."
10024-100240090 = "Как раз был перерыв, вот и решила написать."
10024-100240100 = "Кажется, прошло всего несколько минут...?"
10024-100240110 = "Может, ты уже далеко уехала...?"
10024-100240120 = "Мм?"
10024-100240130 = "Нет, я ещё недалеко от того места, где мы были."
10024-100240140 = "Как раз остановилась на светофоре, поэтому и написала."
10024-100240150 = "...А?"
10024-100240160 = "Может, это и значит «каждый раз, когда останавливаюсь»?"
10024-100240170 = "...Прости, я неправильно поняла."
10024-100240180 = "Тогда, ну... буду писать каждый раз, когда слезаю с велосипеда на отдыхе."
10024-100240190 = "Сенсей."
10024-100240200 = "Я только что полностью покинула Абидос, скоро буду на прибрежной дороге."
10024-100240210 = "Быстро...!?"
10024-100240220 = "Скорость как у профессионала... Всё идёт хорошо?"
10024-100240230 = "Ага."
10024-100240240 = "Ах, кстати..."
10024-100240250 = "Что такое?"
10024-100240260 = "А, нет."
10024-100240270 = "Прости, ничего."
10024-100240280 = "Спасибо."
10024-100240290 = "Я собираюсь ехать вдоль прибрежной дороги."
10024-100240300 = "Тогда я ещё напишу, Сенсей."
10024-100240310 = "Спасибо, Сенсей. Ты мне очень помог."
10024-100240320 = "Если положить напиток в сумку, он становится тёплым."
10024-100240330 = "А тот напиток, что ты принёс, был очень холодным, я была рада."
10024-100240340 = "Полотенце тоже."
10024-100240350 = "Ах."
10024-100240360 = "Кстати, то полотенце, что я тебе дала, если ты не против..."
10024-100240370 = "Я его постирал и аккуратно храню. Как-нибудь верну."
10024-100240380 = "Ну..."
10024-100240390 = "Да, наверное, так и надо..."
10024-100240400 = "Нет, спасибо."
10024-100240410 = "Так."
10024-100240420 = "Тогда"
10024-100240430 = "я ещё напишу, Сенсей."
10024-100240440 = "Кстати,"
10024-100240450 = "ты ведь просил меня сообщать о моих планах, Сенсей."
10024-100240460 = "Тебе это пригодится?"
10024-100240470 = "Думал, может, принесу ещё припасы или что-то."
10024-100240480 = "Как поддержка, чтобы помочь."
10024-100240490 = "А..."
10024-100240500 = "Ага, понятно."
10024-100240510 = "Но ты уверен? Ты ведь и так занят работой..."
10024-100240520 = "Нет, то есть"
10024-100240530 = "я не против."
10024-100240540 = "Я очень рада, но..."
10024-100240550 = "Тогда, только если тебе не в тягость."
10024-100240560 = "Я буду ждать, когда ты приедешь в следующую точку."
10024-100240570 = "Сенсей, я скоро буду."
10024-100240580 = "Можешь уже выходить."
10024-100240590 = "Выходить...?"
10024-100240600 = "Эм, куда ты приехала?"
10024-100240610 = "Ну..."
10024-100240620 = "Короче, когда выйдешь — поймёшь."
10024-100240630 = "Я буду ждать."
10024-100240640 = "Кстати."
10024-100240650 = "Раз я смогла пересечь Кивотос вдоль,"
10024-100240660 = "в следующий раз, наверное, попробую пересечь его поперёк."
10024-100240670 = "Конечно, это не совсем по-настоящему, но примерно так."
10024-100240680 = "Если ты не против, может, как-нибудь пробежим вместе..."
10024-100240690 = "Участвовать лично... вряд ли. Но я буду болеть."
10024-100240700 = "Как поддержка, я сделаю всё возможное."
10024-100240710 = "Хм-м..."
10024-100240720 = "Понятно, жаль."
10024-100240730 = "Тогда... и впредь, как поддержка,"
10024-100240740 = "рассчитываю на тебя, Сенсей."
