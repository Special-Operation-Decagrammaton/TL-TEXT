[translation]
10024-100240010 = "Estou planejando fazer uma viagem longa por um tempinho."
10024-100240020 = "Já mandei mensagem avisando as meninas,"
10024-100240030 = "mas achei bom avisar você também, Sensei."
10024-100240040 = "...Uma viagem longa?"
10024-100240050 = "Como assim, assim do nada...?"
10024-100240060 = "Fica tranquilo, não é nada de mais."
10024-100240070 = "Bom, até mais, Sensei."
10024-100240080 = "Sensei."
10024-100240090 = "Aproveitei que parei um instante para mandar mensagem."
10024-100240100 = "Ué, mas acho que só se passaram alguns minutos desde que você saiu...?"
10024-100240110 = "Não me diga que você já pedalou pra longe em tão pouco tempo...?"
10024-100240120 = "Hum?"
10024-100240130 = "Não, ainda estou bem perto de onde eu estava com você agorinha."
10024-100240140 = "É que parei no sinal fechado e aproveitei para mandar mensagem."
10024-100240150 = "...Ué?"
10024-100240160 = "Quando você pediu para te avisar \"sempre que eu parasse\", não era nesse sentido?"
10024-100240170 = "...Desculpa, entendi errado."
10024-100240180 = "Então, hum... sempre que eu descer da bicicleta para descansar, eu te mando mensagem."
10024-100240190 = "Sensei."
10024-100240200 = "Acabei de sair completamente do território de Abydos e já estou quase chegando à rodovia costeira."
10024-100240210 = "Que rápida...?!"
10024-100240220 = "Isso é ritmo de ciclista profissional... Tudo tranquilo até agora?"
10024-100240230 = "Sim."
10024-100240240 = "Ah, por falar nisso..."
10024-100240250 = "O que foi?"
10024-100240260 = "Ah, não."
10024-100240270 = "Desculpa, deixa pra lá."
10024-100240280 = "Obrigada."
10024-100240290 = "Agora pretendo seguir pedalando direto pela rodovia costeira."
10024-100240300 = "Depois mando mensagem de novo, Sensei."
10024-100240310 = "Obrigada, Sensei. Você me salvou de várias formas."
10024-100240320 = "Guardando na mochila, a bebida acaba esquentando rápido,"
10024-100240330 = "então o isotônico bem geladinho que você trouxe me deixou super feliz."
10024-100240340 = "E a toalha também."
10024-100240350 = "Ah."
10024-100240360 = "Por falar nisso, aquela toalha que te devolvi agora há pouco, se você quiser..."
10024-100240370 = "Já lavei e guardei direitinho. Na próxima vez te entrego."
10024-100240380 = "Hum..."
10024-100240390 = "É, claro, faz sentido..."
10024-100240400 = "Não é nada, obrigada."
10024-100240410 = "Hum..."
10024-100240420 = "Bom,"
10024-100240430 = "entro em contato de novo mais tarde, Sensei."
10024-100240440 = "Por falar nisso,"
10024-100240450 = "outro dia você pediu para eu te passar o meu roteiro de paradas com antecedência, Sensei."
10024-100240460 = "Essa informação tem alguma utilidade pra você?"
10024-100240470 = "É que pensei em levar suprimentos pra você de novo."
10024-100240480 = "Achei que poderia te ajudar de várias formas atuando como sua equipe de apoio."
10024-100240490 = "Ah..."
10024-100240500 = "Hum, entendi."
10024-100240510 = "Mas tem certeza? Você já anda tão ocupado com o trabalho..."
10024-100240520 = "Quer dizer, hum,"
10024-100240530 = "claro que eu não tô reclamando."
10024-100240540 = "Na verdade, isso me deixa muito feliz, mas..."
10024-100240550 = "Então só me prometa que não vai se sobrecarregar."
10024-100240560 = "Agora fiquei ainda mais ansiosa para chegar ao próximo ponto de parada."
10024-100240570 = "Sensei, estou quase chegando."
10024-100240580 = "Já pode sair."
10024-100240590 = "Já posso sair...?"
10024-100240600 = "Espera, onde exatamente você chegou?"
10024-100240610 = "Hum..."
10024-100240620 = "Quando você sair aqui fora vai entender."
10024-100240630 = "Estou te esperando."
10024-100240640 = "Aliás,"
10024-100240650 = "como desta vez consegui cruzar Kivotos de norte a sul,"
10024-100240660 = "na próxima vez estou pensando em cruzar Kivotos de leste a oeste."
10024-100240670 = "Claro que também não vai ser uma travessia literal, só um roteiro parecido,"
10024-100240680 = "mas, se você quiser, Sensei, quem sabe a gente não pedala lado a lado..."
10024-100240690 = "Pedalar junto já é demais pro meu preparo físico... mas vou ficar na torcida!"
10024-100240700 = "Vou continuar dando o meu máximo na equipe de apoio..."
10024-100240710 = "Humm..."
10024-100240720 = "Entendi, que pena."
10024-100240730 = "Então... conto com você daqui pra frente também como meu suporte,"
10024-100240740 = "tá bom, Sensei?"
