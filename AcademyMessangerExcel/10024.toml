[translation]
10024-100240010 = "Меня некоторое время не будет."
10024-100240020 = "Я сообщила всем."
10024-100240030 = "Решила, что вам тоже стоит сказать."
10024-100240040 = "Широко?"
10024-100240050 = "С чего вдруг?"
10024-100240060 = "Эм. Ни с чего."
10024-100240070 = "Поговорим позже."
10024-100240080 = "Сенсей."
10024-100240090 = "У меня перерыв, вот я и написала."
10024-100240100 = "Быстро."
10024-100240110 = "Ты уже далеко?"
10024-100240120 = "Хм?"
10024-100240130 = "Нет, я только у светофора перед зданием."
10024-100240140 = "Эм..."
10024-100240150 = "Я написала, потому что вы просили сообщать каждый раз, когда останавливаюсь."
10024-100240160 = "...Возможно, я неправильно поняла вашу просьбу."
10024-100240170 = "..."
10024-100240180 = "Тогда пиши мне во время перерывов."
10024-100240190 = "Как вы, Сенсей?"
10024-100240200 = "Сейчас я за пределами Абидоса. Скоро должна добраться до прибрежной дороги."
10024-100240210 = "Уже так далеко? Впечатляет."
10024-100240220 = "Прямо как профессионал."
10024-100240230 = "Э-э-э..."
10024-100240240 = "Эм..."
10024-100240250 = "Широко?"
10024-100240260 = "Нет."
10024-100240270 = "Да."
10024-100240280 = "Спасибо."
10024-100240290 = "Тогда я направлюсь прямо к прибрежной дороге."
10024-100240300 = "Напишу вам оттуда, Сенсей."
10024-100240310 = "Благодаря вам я смогла продолжать путь."
10024-100240320 = "Вещи в сумке со временем нагреваются."
10024-100240330 = "Поэтому напиток, который вы только что дали, гораздо прохладнее."
10024-100240340 = "А полотенца"
10024-100240350 = "А."
10024-100240360 = "Что стало с полотенцем, которое я тебе дал раньше?"
10024-100240370 = "Я постирала его и убрала."
10024-100240380 = "А."
10024-100240390 = "Да..."
10024-100240400 = "Понятно. Спасибо."
10024-100240410 = "В любом случае"
10024-100240420 = "Поговорим в следующий раз, Сенсей."
10024-100240430 = "до следующей встречи."
10024-100240440 = "А, точно. Сенсей."
10024-100240450 = "Раньше вы просили меня поделиться расписанием поездки и картой."
10024-100240460 = "Зачем они вам?"
10024-100240470 = "Чтобы встречать тебя там, где ты делаешь перерыв."
10024-100240480 = "Я хотел быть хорошим болельщиком."
10024-100240490 = "О..."
10024-100240500 = "Эм..."
10024-100240510 = "Всё будет нормально? Вы ведь, наверное, заняты работой..."
10024-100240520 = "То есть,"
10024-100240530 = "я не против. Правда."
10024-100240540 = "Если тебя всё устраивает, то и меня тоже."
10024-100240550 = "Да."
10024-100240560 = "Тогда увидимся в следующей точке."
10024-100240570 = "Я приехала, Сенсей."
10024-100240580 = "Можете выходить."
10024-100240590 = "Выходить? Куда?"
10024-100240600 = "Что значит «приехала»?"
10024-100240610 = "Хм."
10024-100240620 = "Поймёте, когда выйдете."
10024-100240630 = "Буду ждать."
10024-100240640 = "Если подумать,"
10024-100240650 = "мы уже проехали Кивотос с севера на юг."
10024-100240660 = "В следующий раз я планирую пересечь Кивотос с востока на запад."
10024-100240670 = "К тому же важнее сам путь, а не пункт назначения."
10024-100240680 = "Если вы не против, Сенсей, я хотела бы, чтобы в следующий раз вы поехали со мной."
10024-100240690 = "Не уверен, что выдержу такое..."
10024-100240700 = "Можно я снова просто буду твоим болельщиком?"
10024-100240710 = "Хм. Вы уверены?"
10024-100240720 = "Ну ладно."
10024-100240730 = "Тогда в следующий раз можете снова поддерживать меня."
10024-100240740 = "Буду ждать этого, Сенсей."
