[translation]
13012-130120010 = "Sensei, está na hora da patrulha!"
13012-130120020 = "Como ontem fizemos a ronda no Distrito Norte, que tal patrulharmos o Distrito Central hoje?"
13012-130120030 = "Mas hoje é dia de folga..."
13012-130120040 = "Que tal tirarmos pelo menos o dia de hoje para descansar...?"
13012-130120050 = "Nada disso! Os crimes não acontecem na sala de reuniões, acontecem em campo!"
13012-130120060 = "Enquanto estamos aproveitando aquele segundo cochilo gostoso de manhã..."
13012-130120070 = "Um crime de grandes proporções, que os cidadãos comuns jamais conseguiriam resolver, pode estar prestes a acontecer em algum lugar!"
13012-130120080 = "Colocando desse jeito, aí é que me dá menos vontade ainda de ir..."
13012-130120090 = "Sensei, temos uma ocorrência!"
13012-130120100 = "Parece que alunas delinquentes fizeram reféns e se trancaram em uma joalheria lá em Shiba Town!"
13012-130120110 = "E, pelo visto, a chegada da equipe de negociação está atrasada por causa do trânsito..."
13012-130120120 = "..."
13012-130120130 = "Se esta oficial aproveitar a oportunidade para ir na frente e conduzir a negociação com sucesso..."
13012-130120140 = "Será que o alto escalão da Valkyrie finalmente reconhecerá a minha capacidade?"
13012-130120150 = "Não é melhor esperar os negociadores profissionais chegarem...?"
13012-130120160 = "...Não, está decidido. Neste exato momento os reféns devem estar tremendo de pavor"
13012-130120170 = "Mesmo que eu ainda não seja uma policial formada de fato, não posso ficar parada de braços cruzados"
13012-130120180 = "Oficial Kirino, entrando em ação!"
13012-130120190 = "Uuu, Sensei... (T_T)"
13012-130120200 = "Acabei levando uma advertência formal do alto escalão por causa daquele caso dos reféns do outro dia..."
13012-130120210 = "Se ao menos a minha pontaria com a arma fosse um pouquinho melhor..."
13012-130120220 = "Sensei, o que eu posso fazer para melhorar a minha mira?"
13012-130120230 = "Bom, perguntar sobre tiro para mim é meio complicado..."
13012-130120240 = "Tem razão... Então, pelo menos, você poderia ficar ao lado desta oficial observando meu treino de tiro na próxima vez?"
13012-130120250 = "Ouvi dizer que para aumentar a precisão dos disparos é fundamental corrigir vícios de postura na hora de atirar!"
13012-130120260 = "Sim, se for isso eu ajudo com prazer"
13012-130120270 = "Muito obrigada, Sensei!"
13012-130120280 = "Estarei aguardando por você no estande de tiro da escola!"
13012-130120290 = "Sensei, estou começando a ficar super nervosa..."
13012-130120300 = "O que houve? Vai ter alguma prova daqui a pouco?"
13012-130120310 = "Hoje à tarde, as crianças de um jardim de infância aqui perto vêm fazer uma visita guiada à Escola de Polícia Valkyrie..."
13012-130120320 = "E esta oficial ficou encarregada de guiá-las pela escola"
13012-130120330 = "Só de pensar no que fazer se eu cometer algum erro, já me bate uma ansiedade..."
13012-130120340 = "Se não tiver problema eu ir, quer que eu fique ao seu lado dando um apoio?"
13012-130120350 = "Hã, você faria isso?"
13012-130120360 = "Assim fico muito mais tranquila! Muito obrigada, Sensei!"
13012-130120370 = "Vejo que você está super dedicada, então no que eu puder ajudar, estou à disposição"
13012-130120380 = "Será de grande ajuda. Pois é, já que temos essa oportunidade, quero muito mostrar às crianças o lado admirável da polícia"
13012-130120390 = "Afinal, quando eu era pequenininha, também participei de uma visita dessas e foi lá que decidi me tornar policial..."
13012-130120400 = "Preciso mostrar uma postura incrível, igualzinha à das policiais que vi naquela época...!"
13012-130120410 = "Kirino, só um detalhe"
13012-130120420 = "Sim, o que seria?"
13012-130120430 = "Não saque a sua arma em hipótese alguma, viu? Seria perigoso se acertasse alguma criança"
13012-130120440 = "I-Isso é...! C-Confesso que fere um pouco o meu orgulho ouvir isso, mas... sim, você tem razão..."
