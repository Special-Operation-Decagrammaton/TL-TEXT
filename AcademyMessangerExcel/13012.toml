[translation]
13012-130120010 = "Сенсей, пора на патруль!"
13012-130120020 = "В прошлый раз мы патрулировали северный район, а сегодня пойдём в центральный!"
13012-130120030 = "Но сегодня вроде выходной..."
13012-130120040 = "Почему бы нам не отдохнуть?"
13012-130120050 = "Нет! Преступления совершаются на улицах, а не в офисе."
13012-130120060 = "Даже прямо сейчас..."
13012-130120070 = "где-то происходит преступление, и мирным жителям нужна наша помощь!"
13012-130120080 = "Если это должно было меня убедить, не сработало."
13012-130120090 = "У нас дело, Сенсей!"
13012-130120100 = "По отчёту, преступник взял заложника у ювелирного магазина в городе Шиба."
13012-130120110 = "Но, похоже, переговорщик застрял в пробке."
13012-130120120 = "Эм..."
13012-130120130 = "Если я доберусь туда первой и успешно проведу переговоры..."
13012-130120140 = "разве начальство Валькирии не оценит мои способности?"
13012-130120150 = "Не лучше ли дождаться профессионального переговорщика?"
13012-130120160 = "Не думаю. Представьте, что сейчас чувствует заложник."
13012-130120170 = "Пусть я ещё не полноценный офицер, но не могу позволить переговорам задерживаться!"
13012-130120180 = "Кирино к вашим услугам!"
13012-130120190 = "Уф, Сенсей... (T_T)"
13012-130120200 = "Начальство сделало мне предупреждение из-за прошлого дела с заложником."
13012-130120210 = "Если бы только я стреляла точнее."
13012-130120220 = "Как мне научиться лучше стрелять, Сенсей?"
13012-130120230 = "Тут я вряд ли смогу помочь..."
13012-130120240 = "Тогда хотя бы посмотрите, как я тренируюсь?"
13012-130120250 = "Если исправить плохие привычки или стойку, меткость тоже может улучшиться."
13012-130120260 = "Вот с этим я помогу."
13012-130120270 = "Спасибо, Сенсей!"
13012-130120280 = "Тогда встретимся на стрельбище!"
13012-130120290 = "Ух. Я так нервничаю..."
13012-130120300 = "Что случилось?"
13012-130120310 = "Сегодня днём студенты детского сада придут на экскурсию в Валькирию..."
13012-130120320 = "А я буду их экскурсоводом."
13012-130120330 = "Боюсь, что перенервничаю и начну ошибаться..."
13012-130120340 = "Тогда я тебе помогу."
13012-130120350 = "Вы придёте помочь лично?"
13012-130120360 = "Какое облегчение. Спасибо, Сенсей!"
13012-130120370 = "Похоже, ты серьёзно к этому относишься."
13012-130120380 = "Конечно. Это лучшая возможность показать маленьким студентам хорошую сторону полиции."
13012-130120390 = "Когда-то именно такая экскурсия вдохновила меня."
13012-130120400 = "Я хочу выглядеть такой же крутой, как те офицеры тогда."
13012-130120410 = "Кирино."
13012-130120420 = "А?"
13012-130120430 = "Что бы ни случилось, не доставай оружие. Даже если запаникуешь."
13012-130120440 = "Я-Я знаю! Имейте ко мне хоть немного доверия!"
