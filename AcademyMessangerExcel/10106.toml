[translation]
10106-101060010 = "Отличные новости, Сенсей."
10106-101060020 = "Весь мой труд до этого момента"
10106-101060030 = "наконец окупился."
10106-101060040 = "...?"
10106-101060050 = "Окупился?"
10106-101060060 = "Ты опять что-то устроила, Сакурако?"
10106-101060070 = "Хи-хи."
10106-101060080 = "Я уже иду к вам"
10106-101060090 = "Эм..."
10106-101060100 = "Прости, Сенсей."
10106-101060110 = "По вашей просьбе я провела общее собрание."
10106-101060120 = "Но идею моего нового костюма приняли плохо..."
10106-101060130 = "...Я мог бы сказать тебе это заранее."
10106-101060140 = "Думаю, иногда это допустимо, если вы одобряете."
10106-101060150 = "Да."
10106-101060160 = "И ещё..."
10106-101060170 = "Я получила несколько просьб"
10106-101060180 = "воздерживаться от его ношения в рабочее время."
10106-101060190 = "Это... сложно"
10106-101060200 = "Были и те, кому идея понравилась. Я уверена."
10106-101060210 = "Всё хорошо в меру."
10106-101060220 = "Трудно когда-либо прийти к полному согласию."
10106-101060230 = "Вот как"
10106-101060240 = "Это понятно."
10106-101060250 = "Тогда благословенного вам дня."
10106-101060260 = "Сенсей"
10106-101060270 = "Сенсей, вы здесь?"
10106-101060280 = "Мне нужно обсудить с вами нечто важное."
10106-101060290 = "...? Сакурако?"
10106-101060300 = "Всё в порядке?"
10106-101060310 = "Эм..."
10106-101060320 = "В каком-то смысле... да... в другом..."
10106-101060330 = "Если у вас есть время..."
10106-101060340 = "Можете уделить мне минуту...?"
10106-101060350 = "Большое спасибо, Сенсей."
10106-101060360 = "Честно говоря, сначала я относилась к этому довольно скептически."
10106-101060370 = "Но в итоге благодаря вам получила нечто драгоценное."
10106-101060380 = "Рад, что всё прошло хорошо."
10106-101060390 = "Я знал, что так и будет."
10106-101060400 = "Хи-хи."
10106-101060420 = "Это фото сделал работник на подработке."
10106-101060430 = "Он пообещал прийти на концерт."
10106-101060440 = "...Ах."
10106-101060450 = "Теперь, когда я подумала, я пыталась сказать Сёстрам, что они могут называть меня «Сакура»,"
10106-101060460 = "но они настояли, что это неуместно."
10106-101060470 = "Это... ну..."
10106-101060480 = "Снова слишком официальная обстановка, Сакурако."
10106-101060490 = "Да. К сожалению,"
10106-101060500 = "всё так и вышло."
10106-101060510 = "В обязанностях айдола оказалось куда больше, чем я ожидала."
10106-101060520 = "Разумеется, я понимаю, что профессиональная жизнь айдола невероятно насыщенная."
10106-101060530 = "Но я не ожидала, что временное мероприятие на кампусе потребует столько сил."
10106-101060540 = "Ты не слишком себя загоняешь?"
10106-101060550 = "У тебя сегодня много дел?"
10106-101060560 = "Нет. Сегодня у меня есть передышка."
10106-101060570 = "Но поддаться усталости хотя бы на мгновение..."
10106-101060580 = "Мне ещё далеко до совершенства."
10106-101060590 = "Я должна отплатить всем за их поддержку."
10106-101060600 = "Тогда позволь мне помочь."
10106-101060610 = "Можем встретиться сегодня?"
10106-101060620 = "А?"
10106-101060630 = "Сенсей?"
10106-101060640 = "Моя глубочайшая благодарность за сегодняшний день, Сенсей."
10106-101060650 = "Это был поистине незабываемый опыт."
10106-101060660 = "Рад, что тебе понравилось, Сакурако."
10106-101060670 = "Уверен, все будут рады."
10106-101060680 = "Да."
10106-101060690 = "Честно говоря, я думала..."
10106-101060700 = "Поскольку это драгоценный подарок, который сделали все вместе, мне очень хочется забрать его"
10106-101060710 = "и выставить на стене собора..."
10106-101060720 = "Так вот о чём ты думала."
10106-101060730 = "Я так и понял, чего ты хочешь."
10106-101060740 = "..."
10106-101060750 = "Вы меня раскусили."
10106-101060760 = "К сожалению, похоже, это невозможно...."
10106-101060770 = "Скоро поговорим."
10106-101060790 = "Сенсей ♡"
10106-101060800 = "Вы заааняты, Сенсееей?"
10106-101060810 = "Потому что сегодня айдол Сакува украдёт время Сенсея!"
10106-101060820 = "Доки-доки Кюююн ♡"
10106-101060830 = "Где... ты вообще этому научилась?"
10106-101060840 = "Что это такое, Сакурако...?"
10106-101060850 = "Хи-хи...! Удивляться ещё рано!"
10106-101060860 = "Хмф, хмф! Не Сакурако, а Сакува!"
10106-101060870 = "Всё хорошо, Сенсей!"
10106-101060880 = "Сейчас я — айдол Сенсея!"
10106-101060890 = "..."
10106-101060900 = "Сёстры определённо"
10106-101060910 = "сказали что-то в таком духе..."
10106-101060920 = "А-а... понятно..."
10106-101060930 = "Да... кажется, я понимаю."
10106-101060940 = "Ага, ага!"
10106-101060950 = "Так что я буду ждать! Сенсей ♡"
10106-101060960 = "Сенсей"
10106-101060970 = "Прошу прощения, но..."
10106-101060980 = "У меня был ещё один вопрос..."
10106-101060990 = "Эм..."
10106-101061000 = "Вам правда понравилось?"
10106-101061010 = "Я даже не могу выразить, насколько счастлив был, Сакурако."
10106-101061020 = "Спасибо, Сакурако. Это драгоценное воспоминание."
10106-101061030 = "А."
10106-101061040 = "Да."
10106-101061050 = "Спасибо, Сенсей."
10106-101061060 = "Буду ждать нашей следующей беседы."
