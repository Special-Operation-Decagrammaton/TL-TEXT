[translation]
10106-101060010 = "Сенсей, у меня хорошие новости."
10106-101060020 = "Мои прежние усилия"
10106-101060030 = "наконец... принесли плоды. Хе-хе"
10106-101060040 = "... Сакурако?"
10106-101060050 = "Что случилось?"
10106-101060060 = "И что же ты на этот раз натворила?"
10106-101060070 = "Хе-хе"
10106-101060080 = "Сейчас я к вам приду."
10106-101060090 = "Эм..."
10106-101060100 = "Прошу прощения, Сенсей."
10106-101060110 = "Мы провели повторное собрание, но..."
10106-101060120 = "как и ожидалось, подготовить костюмы для всех оказалось сложно..."
10106-101060130 = "... Да, ты права."
10106-101060140 = "Может, просто ты будешь иногда надевать его?"
10106-101060150 = "Да."
10106-101060160 = "Но"
10106-101060170 = "они попросили не надевать его во время сестринской деятельности."
10106-101060180 = "Мне поступило такое мнение..."
10106-101060190 = "Хотя положительных отзывов тоже много,"
10106-101060200 = "это непросто."
10106-101060210 = "Во всём нужна мера..."
10106-101060220 = "Ведь не все думают одинаково..."
10106-101060230 = "Понимаю..."
10106-101060240 = "Хорошо."
10106-101060250 = "Что ж, пусть сегодняшний день тоже пройдёт мирно."
10106-101060260 = "Сенсей."
10106-101060270 = "У вас есть время сейчас?"
10106-101060280 = "У меня есть к вам разговор."
10106-101060290 = "... Сакурако?"
10106-101060300 = "Что-то случилось?"
10106-101060310 = "Ну..."
10106-101060320 = "В сообщении сложно объяснить..."
10106-101060330 = "Если можно,"
10106-101060340 = "я хотела бы встретиться лично."
10106-101060350 = "Спасибо, Сенсей."
10106-101060360 = "Честно говоря, я очень переживала, но"
10106-101060370 = "благодаря вам я обрела дорогого друга."
10106-101060380 = "Как здорово!"
10106-101060390 = "Поздравляю!"
10106-101060400 = "Хе-хе"
10106-101060420 = "Нас сфотографировали в магазине."
10106-101060430 = "Говорят, все придут и на выступление."
10106-101060440 = "И ещё"
10106-101060450 = "я сказала, что хочу, чтобы меня и дальше называли «Сакура-тян», но"
10106-101060460 = "меня остановили сестры из Сестринства..."
10106-101060470 = "Вот как..."
10106-101060480 = "Говорить такое при всех всё же..."
10106-101060490 = "Да."
10106-101060500 = "Немного обидно, но хорошо, что всё сложилось."
10106-101060510 = "Идольская деятельность, оказывается, такая трудная."
10106-101060520 = "Будь то профессионалы,"
10106-101060530 = "но даже как часть школьного мероприятия, это настолько хлопотно."
10106-101060540 = "Ты в порядке?"
10106-101060550 = "Не переутомляешься?"
10106-101060560 = "Спасибо за беспокойство."
10106-101060570 = "Я просто немного пала духом."
10106-101060580 = "Чтобы оправдать поддержку всех,"
10106-101060590 = "нельзя позволять себе отдыхать."
10106-101060600 = "... Может, я чем-то помогу?"
10106-101060610 = "Может, встретимся сейчас?"
10106-101060620 = "А?"
10106-101060630 = "Я не против, но..."
10106-101060640 = "Спасибо вам большое за сегодня, Сенсей."
10106-101060650 = "Похоже, это станет незабываемым воспоминанием."
10106-101060660 = "Рад, что тебе понравилось."
10106-101060670 = "Думаю, все тоже рады."
10106-101060680 = "Да."
10106-101060690 = "Ведь это важный подарок от всех."
10106-101060700 = "Позже"
10106-101060710 = "я сказала, что хочу повесить это в соборе, но..."
10106-101060720 = "Опять ты всех озадачила?"
10106-101060730 = "Я знала, что Сакурако так скажет..."
10106-101060740 = "..."
10106-101060750 = "К сожалению,"
10106-101060760 = "меня остановили."
10106-101060770 = "Пока что я буду бережно хранить его."
10106-101060790 = "Сенсей ♡"
10106-101060800 = "Я идол ☆ Сакурако!"
10106-101060810 = "Я забираю ваше время!"
10106-101060820 = "Доки-доки-доккюн ♡"
10106-101060830 = "Что на этот раз!?"
10106-101060840 = "Что же случилось с Сакурако..."
10106-101060850 = "Хе-хе, не торопитесь удивляться!"
10106-101060860 = "Не Сакурако-сан, а Сакурако-тян!"
10106-101060870 = "Но не волнуйтесь!"
10106-101060880 = "Ведь сейчас я идол только для вас, Сенсей ☆"
10106-101060890 = "..."
10106-101060900 = "Я получила совет"
10106-101060910 = "от сестёр..."
10106-101060920 = "А, понятно..."
10106-101060930 = "Я примерно всё понял."
10106-101060940 = "Как хорошо."
10106-101060950 = "Я жду вас, Сенсей ♡"
10106-101060960 = "Сенсей"
10106-101060970 = "Эм, прошу прощения."
10106-101060980 = "Всё же я не могла перестать об этом думать..."
10106-101060990 = "Э-э..."
10106-101061000 = "Вам и правда понравилось...?"
10106-101061010 = "Да, очень."
10106-101061020 = "Спасибо, Сакурако. Это было хорошее воспоминание."
10106-101061030 = "... Как хорошо."
10106-101061040 = "Спасибо, что нашли время"
10106-101061050 = "и сегодня."
10106-101061060 = "Буду рассчитывать на вас и впредь."