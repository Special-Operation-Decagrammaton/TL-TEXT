[translation]
10106-101060010 = "Sensei, tenho uma ótima notícia."
10106-101060020 = "Todos os meus esforços até agora"
10106-101060030 = "finalmente... deram frutos. Hehe."
10106-101060040 = "...Senhorita Sakurako?"
10106-101060050 = "O que houve?"
10106-101060060 = "O que foi que você aprontou dessa vez?"
10106-101060070 = "Hehe."
10106-101060080 = "Estou indo para aí agora mesmo."
10106-101060090 = "Hum..."
10106-101060100 = "Peço perdão, Sensei."
10106-101060110 = "Realizamos uma nova reunião, mas"
10106-101060120 = "infelizmente seria difícil providenciar figurinos para todas as integrantes..."
10106-101060130 = "...Faz sentido."
10106-101060140 = "Não basta só você vestir o seu de vez em quando, Sakurako?"
10106-101060150 = "Sim."
10106-101060160 = "Contudo,"
10106-101060170 = "pediram-me para evitar usá-lo durante as atividades regulares como Irmã..."
10106-101060180 = "Recebi várias observações a respeito..."
10106-101060190 = "Embora também haja muitas opiniões favoráveis,"
10106-101060200 = "parece que as coisas não serão tão simples assim."
10106-101060210 = "Tudo tem limite, né..."
10106-101060220 = "Afinal, nem todo mundo pensa da mesma forma..."
10106-101060230 = "Entendo..."
10106-101060240 = "Compreendo perfeitamente."
10106-101060250 = "Bom, que o seu dia hoje também seja abençoado com paz."
10106-101060260 = "Sensei."
10106-101060270 = "Você teria um momento agora?"
10106-101060280 = "Gostaria de pedir um conselho."
10106-101060290 = "...Sakurako?"
10106-101060300 = "Aconteceu alguma coisa?"
10106-101060310 = "Hum..."
10106-101060320 = "É um pouco difícil de explicar por mensagem..."
10106-101060330 = "Se não for incômodo,"
10106-101060340 = "eu gostaria de encontrar você pessoalmente."
10106-101060350 = "Muito obrigada, Sensei."
10106-101060360 = "Para ser sincera, eu estava muito insegura, mas"
10106-101060370 = "graças a você, Sensei, fiz amigas muito especiais."
10106-101060380 = "Que maravilha!"
10106-101060390 = "Parabéns!"
10106-101060400 = "Hehe."
10106-101060420 = "Pedimos para um funcionário da loja tirar esta foto."
10106-101060430 = "Todas disseram que virão assistir ao nosso show também."
10106-101060440 = "Além disso,"
10106-101060450 = "eu disse que gostaria que continuassem me chamando de \"Sakura-chan\" daqui para frente, mas"
10106-101060460 = "as integrantes da Irmandade me impediram..."
10106-101060470 = "Ah, entendi..."
10106-101060480 = "Chamar assim na frente de todo mundo realmente seria meio..."
10106-101060490 = "Sim."
10106-101060500 = "É uma pena, mas fico feliz que tenha dado tudo certo."
10106-101060510 = "Não imaginava que as atividades de uma idol fossem tão exigentes assim."
10106-101060520 = "Para uma profissional até seria compreensível,"
10106-101060530 = "mas mesmo sendo parte de um evento escolar, a rotina é muito corrida."
10106-101060540 = "Você está bem?"
10106-101060550 = "Não está se forçando demais?"
10106-101060560 = "Muito obrigada pela preocupação."
10106-101060570 = "Apenas deixei escapar um momento de fraqueza."
10106-101060580 = "Para corresponder ao apoio e à torcida de todos,"
10106-101060590 = "não posso me dar ao luxo de descansar agora."
10106-101060600 = "...Quer ajuda com alguma coisa?"
10106-101060610 = "Podemos nos encontrar agora?"
10106-101060620 = "Hã?"
10106-101060630 = "Por mim tudo bem, mas..."
10106-101060640 = "Muito obrigada mesmo por hoje, Sensei."
10106-101060650 = "Tenho certeza de que esta será uma lembrança inesquecível."
10106-101060660 = "Fico feliz que tenha gostado."
10106-101060670 = "Acho que todo mundo ficou muito feliz também."
10106-101060680 = "Sim."
10106-101060690 = "Como é um presente muito precioso que recebi de todas,"
10106-101060700 = "mais tarde"
10106-101060710 = "eu disse que gostaria de deixá-lo exposto na Catedral, mas..."
10106-101060720 = "Deixou todo mundo sem jeito de novo?"
10106-101060730 = "Bem que eu imaginei que você diria uma coisa dessas, Sakurako..."
10106-101060740 = "..."
10106-101060750 = "Infelizmente,"
10106-101060760 = "elas me impediram."
10106-101060770 = "Por ora, vou guardá-lo com muito carinho."
10106-101060790 = "Sensei♡"
10106-101060800 = "Aqui é a Idol☆Sakurako!"
10106-101060810 = "Vim roubar um pouquinho do seu tempo, Sensei!"
10106-101060820 = "Doki-doki dokkyu~n♡"
10106-101060830 = "O que deu em você agora!?"
10106-101060840 = "O que diabos aconteceu com a senhorita Sakurako...?"
10106-101060850 = "Hehe, ainda é cedo para se surpreender~!"
10106-101060860 = "E não é senhorita Sakurako, é Sakurako-chan!"
10106-101060870 = "Mas pode ficar tranquilo!"
10106-101060880 = "Porque agora eu sou uma idol exclusiva para você, Sensei☆"
10106-101060890 = "..."
10106-101060900 = "As Irmãs"
10106-101060910 = "me deram alguns conselhos..."
10106-101060920 = "Ah, entendi..."
10106-101060930 = "Já saquei mais ou menos o que rolou."
10106-101060940 = "Que alívio."
10106-101060950 = "Tô te esperando, viu, Sensei♡"
10106-101060960 = "Sensei"
10106-101060970 = "Hum, peço mil desculpas."
10106-101060980 = "Acabei ficando preocupada com uma coisa..."
10106-101060990 = "Bem..."
10106-101061000 = "Você realmente se divertiu hoje...?"
10106-101061010 = "Sim, muito."
10106-101061020 = "Obrigado, Sakurako. Foi uma ótima lembrança."
10106-101061030 = "...Que alívio."
10106-101061040 = "Mesmo estando tão ocupado,"
10106-101061050 = "muito obrigada pelo seu tempo hoje também."
10106-101061060 = "Conto com você daqui para frente também."
