[translation]
10022-100220010 = "Сейчас лето, Сенсей."
10022-100220020 = "Да, лето!"
10022-100220030 = "А когда думаешь о лете, думаешь о пляжах!"
10022-100220040 = "Ага. Лето. Пляжи."
10022-100220050 = "Сенсей."
10022-100220060 = "Вы вообще слушаете?"
10022-100220070 = "Конечно!"
10022-100220080 = "Я всегда тебя слушаю."
10022-100220090 = "*вздох*"
10022-100220100 = "Я знаю, что сейчас лето..."
10022-100220110 = "Но если начнёте расслабляться, это скажется на всех."
10022-100220120 = "Работа остаётся работой всегда."
10022-100220130 = "Даже сейчас."
10022-100220140 = "Аморальные преступники никуда не исчезнут."
10022-100220150 = "Поэтому мне нужна ваша помощь, Сенсей."
10022-100220160 = "Ты такая прилежная даже в купальнике, Хина!"
10022-100220170 = "Старший префект в купальнике ещё лучше!"
10022-100220180 = "Может, тогда мне арестовать одного аморального Сенсея."
10022-100220190 = "Прости. Что тебе нужно?"
10022-100220200 = "*вздох* Ну правда..."
10022-100220210 = "Приходите в место, о котором я говорила раньше. Я буду ждать."
10022-100220220 = "Спасибо, что помогли с сегодняшним заданием, Сенсей."
10022-100220230 = "Тогда теперь уже по-настоящему насчёт летнего лагеря..."
10022-100220240 = "..."
10022-100220250 = "Н-неважно."
10022-100220260 = "Да, надеюсь, мы сможем провести время вместе."
10022-100220270 = "..."
10022-100220280 = "Да."
10022-100220290 = "Насчёт сегодняшнего ужина, Сенсей."
10022-100220300 = "Можно немного его отложить?"
10022-100220310 = "Я всё ещё завалена работой."
10022-100220320 = "Конечно. Погоди, а мы вообще...?"
10022-100220330 = "Правда? Ну, ничего не поделаешь."
10022-100220340 = "Погодите. Разве это не было запланировано на сегодня?"
10022-100220350 = "Наверное, я неправильно запомнила. Пожалуйста, забудьте мои слова."
10022-100220360 = "Спасибо за понимание."
10022-100220370 = "В последнее время я очень занята."
10022-100220380 = "То есть ты в стрессе?"
10022-100220390 = "Нет, ничего слишком серьёзного."
10022-100220400 = "Просто приходится перестраивать расписание."
10022-100220410 = "Сегодня вместо патрулирования я займусь бумагами."
10022-100220420 = "Но это и ЕСТЬ серьёзно!"
10022-100220430 = "Ну, для меня это не такая уж редкость."
10022-100220440 = "В любом случае, после разговора с вами мне стало лучше, Сенсей."
10022-100220450 = "Мне нужно вернуться к работе."
10022-100220460 = "Поговорим позже."
10022-100220470 = "Я чувствую себя отдохнувшей. Спасибо за помощь, Сенсей."
10022-100220480 = "Не за что."
10022-100220490 = "Но я не могу и дальше так вас обременять..."
10022-100220500 = "Я закончу работу немного быстрее."
10022-100220510 = "А потом я..."
10022-100220520 = "Раз уж мы уже здесь..."
10022-100220530 = "Ты права. Сейчас самое время отдохнуть."
10022-100220540 = "Надеюсь, когда придёт время, вы будете рядом со мной, как сегодня."
10022-100220550 = "Сегодня я начала работать раньше обычного, Сенсей."
10022-100220560 = "Должна закончить ближе к концу утра."
10022-100220570 = "Так что не хотите ли вы..."
10022-100220580 = "Да! Я согласен!"
10022-100220590 = "Но... Я даже не успела закончить вопрос."
10022-100220600 = "Ну вы даёте. В любом случае, вы ведь говорили раньше..."
10022-100220610 = "Было бы жаль не повеселиться во время отпуска."
10022-100220620 = "Верно, раз уж мы на пляже."
10022-100220630 = "Лично я этого не понимаю."
10022-100220640 = "Но если вы настаиваете, Сенсей..."
10022-100220650 = "Хорошо. Проведёте со мной вторую половину дня?"
10022-100220660 = "Может быть, просто погулять по берегу"
10022-100220670 = "это... то, что я смогу сделать."
10022-100220680 = "Конечно!"
10022-100220690 = "Хорошо, тогда... Увидимся около обеда, Сенсей."
10022-100220700 = "Сегодня было весело."
10022-100220710 = "Иногда неплохо просто насладиться пляжем."
10022-100220720 = "До следующего раза."
10022-100220730 = "Дальше можешь не говорить!"
10022-100220740 = "Вы снова не дали мне договорить."
10022-100220750 = "Хи-хи. Вы такой странный."
10022-100220760 = "Хорошо. Тогда я буду ждать этого, Сенсей."
10022-100220770 = "Сенсей..."
10022-100220780 = "Вы случайно... сегодня свободны?"
10022-100220790 = "Да, конечно!"
10022-100220800 = "Для тебя, Хина, я нашёл бы время, даже если бы его не было!"
10022-100220810 = "О, правда? Какое облегчение."
10022-100220820 = "Что? Эм, Сенсей, я правда не понимаю, что это значит..."
10022-100220830 = "Так что тебе нужно?"
10022-100220840 = "А, просто..."
10022-100220850 = "Ну, если вы не против, Сенсей, я хотела научиться плавать."
10022-100220860 = "Но всё нормально, если вам нужно время, чтобы..."
10022-100220870 = "В таком случае с радостью! Уже иду!"
10022-100220880 = "Что? Сенсей? Я не закончила объяснять."
10022-100220890 = "Алло? Сенсей?"
