[translation]
10022-100220010 = "...Уже лето, да."
10022-100220020 = "Лето!"
10022-100220030 = "А раз лето, значит, море!"
10022-100220040 = "Да, море."
10022-100220050 = "Сенсей."
10022-100220060 = "...Сенсей? Ты там?"
10022-100220070 = "Конечно!"
10022-100220080 = "Я внимательно читаю Момоток!"
10022-100220090 = "Фу-ух..."
10022-100220100 = "Я понимаю, что летом у всех голова идёт кругом, но..."
10022-100220110 = "если даже ты в таком настроении, то у меня прибавится работы."
10022-100220120 = "Работа всегда растёт."
10022-100220130 = "Это время года не исключение."
10022-100220140 = "Ученицы, нарушающие порядок, всегда и везде есть. А летом тем более."
10022-100220150 = "...Так что мне нужна твоя помощь."
10022-100220160 = "Как всегда, Хина серьёзна, даже летом!"
10022-100220170 = "Летняя председатель дисциплинарного комитета тоже не даёт слабины!"
10022-100220180 = "...Может, мне сначала разобраться с тобой, раз ты нарушаешь порядок?"
10022-100220190 = "Прошу прощения."
10022-100220200 = "Вздох, ну и ну..."
10022-100220210 = "Тогда я пришлю место позже. Жду."
10022-100220220 = "Спасибо за сегодня, Сенсей. Это было полезно для сборов."
10022-100220230 = "Ну, может, на летних сборах, если у тебя будет время, мы сможем..."
10022-100220240 = "Нет."
10022-100220250 = "Ничего."
10022-100220260 = "Хорошо бы найти время и погулять вместе."
10022-100220270 = "..."
10022-100220280 = "Да."
10022-100220290 = "...Сенсей, насчёт сегодняшней встречи."
10022-100220300 = "Ты не против перенести на другой день?"
10022-100220310 = "Похоже, я не успеваю закончить работу."
10022-100220320 = "Ах, прости, это ведь было сегодня...?"
10022-100220330 = "Всё в порядке, не переживай."
10022-100220340 = "...Может, это не сегодня, а завтра?"
10022-100220350 = "Я, наверное, перепутала, забудь."
10022-100220360 = "...Да, спасибо."
10022-100220370 = "В последнее время я постоянно в бегах..."
10022-100220380 = "Ты выглядишь ещё более занятой, чем обычно...?"
10022-100220390 = "Ничего серьёзного."
10022-100220400 = "Ну, просто пришлось немного сдвинуть расписание..."
10022-100220410 = "Сегодня я вообще не выходила на улицу, весь день ушёл на бумажную работу."
10022-100220420 = "Ты в порядке!? Отдохни!?"
10022-100220430 = "Ну, такое случается."
10022-100220440 = "Но даже просто поговорить с тобой уже стало легче."
10022-100220450 = "Ладно, мне нужно разобраться с делами."
10022-100220460 = "Увидимся позже."
10022-100220470 = "Спасибо за помощь сегодня, Сенсей."
10022-100220480 = "Это мелочи, пожалуйста."
10022-100220490 = "Ты очень помог. Но я не могу постоянно тебя обременять."
10022-100220500 = "В следующий раз я постараюсь закончить работу пораньше."
10022-100220510 = "И тогда, ну..."
10022-100220520 = "Раз уж мы зашли так далеко..."
10022-100220530 = "можно будет немного и погулять... как думаешь?"
10022-100220540 = "Тогда можно будет попросить тебя проводить меня, как сегодня?"
10022-100220550 = "Сенсей."
10022-100220560 = "Возможно, сегодня я освобожусь к полудню."
10022-100220570 = "Так что, ну..."
10022-100220580 = "С радостью!"
10022-100220590 = "...Не отвечай, пока я не закончу. Ты вообще понимаешь, о чём речь...?"
10022-100220600 = "Ну и ну... короче."
10022-100220610 = "Ты же говорила, что будет жалко не насладиться курортом."
10022-100220620 = "Именно! Мы же приехали на море!"
10022-100220630 = "...Я всё ещё сомневаюсь, правильно ли это."
10022-100220640 = "Но раз ты так настаиваешь..."
10022-100220650 = "Ты не против пойти со мной сегодня днём?"
10022-100220660 = "Ну, наверное."
10022-100220670 = "Должно хватить времени, чтобы сходить к морю."
10022-100220680 = "Конечно! С нетерпением жду!"
10022-100220690 = "Да, тогда... увидимся около полудня."
10022-100220700 = "Сегодня было весело."
10022-100220710 = "Иногда и просто смотреть на море неплохо."
10022-100220720 = "В следующий раз,"
10022-100220730 = "Конечно!"
10022-100220740 = "...Так что не читай мои мысли раньше времени."
10022-100220750 = "Хе-хе, ты правда странный."
10022-100220760 = "Да, тогда в следующий раз тоже рассчитываю на тебя. Сенсей."
10022-100220770 = "Сенсей."
10022-100220780 = "Ну, у тебя есть время?"
10022-100220790 = "Да, конечно!"
10022-100220800 = "Если пишешь ты, Хина, то я найду время даже если его нет!"
10022-100220810 = "Правда? Хорошо..."
10022-100220820 = "? Сенсей, в смысле...?"
10022-100220830 = "Что-то случилось?"
10022-100220840 = "А, ну... ничего серьёзного, но..."
10022-100220850 = "Если ты не против..."
10022-100220860 = "я бы хотела, чтобы ты научил меня плавать..."
10022-100220870 = "Конечно. Я скоро приду."
10022-100220880 = "Сенсей? Подожди, я ещё не объяснила..."
10022-100220890 = "Э-э...? Сенсей?"
