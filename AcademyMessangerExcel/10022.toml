[translation]
10022-100220010 = "...Então o verão já chegou, né."
10022-100220020 = "É verão!"
10022-100220030 = "E falou em verão, falou em praia!"
10022-100220040 = "É, praia..."
10022-100220050 = "Sensei."
10022-100220060 = "...Sensei? Você tá prestando atenção?"
10022-100220070 = "Claro que sim!"
10022-100220080 = "Tô de olho no MomoTalk com força total!"
10022-100220090 = "Ai, ai..."
10022-100220100 = "Eu entendo que o clima de verão deixa todo mundo mais empolgado, mas..."
10022-100220110 = "Se até você ficar nessa agitação, Sensei, já sinto que vai sobrar mais trabalho pra mim."
10022-100220120 = "O trabalho nunca para de aumentar."
10022-100220130 = "E esta época do ano não é exceção."
10022-100220140 = "Alunas que perturbam a disciplina existem em qualquer lugar e a qualquer hora. No verão, então, nem se fala."
10022-100220150 = "...Por isso, queria pedir uma ajudinha sua."
10022-100220160 = "Como esperado, a Hina-chan continua levando tudo a sério mesmo no verão!"
10022-100220170 = "A presidente do Comitê Disciplinar não baixa a guarda nem no verão!"
10022-100220180 = "...Será que eu deveria começar cuidando de um certo Sensei que parece prestes a perturbar a ordem?"
10022-100220190 = "Peço humildes desculpas."
10022-100220200 = "Ai, ai, francamente..."
10022-100220210 = "Bom, vou te mandar o local já, já. Tô esperando."
10022-100220220 = "Obrigada por hoje, Sensei. Ajudou bastante nos preparativos do acampamento de verão."
10022-100220230 = "Hum, durante o acampamento de verão, se sobrar um tempinho, quem sabe a gente..."
10022-100220240 = "Não,"
10022-100220250 = "deixa pra lá."
10022-100220260 = "Tomara que a gente consiga achar um tempinho para se divertir juntos lá!"
10022-100220270 = "......"
10022-100220280 = "Sim."
10022-100220290 = "...Sensei, sobre o nosso compromisso de hoje à noite,"
10022-100220300 = "tudo bem se a gente remarcar para outro dia?"
10022-100220310 = "É que pelo jeito o trabalho por aqui não vai terminar a tempo."
10022-100220320 = "Ué, desculpa, mas era hoje mesmo...?"
10022-100220330 = "Sem problemas, não esquenta com isso."
10022-100220340 = "...Espera, por acaso não era hoje, e sim amanhã?"
10022-100220350 = "Deve ter sido confusão minha, esquece o que eu disse."
10022-100220360 = "...Hum, obrigada."
10022-100220370 = "Ando numa correria sem fim ultimamente..."
10022-100220380 = "Parece que você tá ainda mais atarefada do que de costume, né...?"
10022-100220390 = "Não é nada de mais."
10022-100220400 = "Só tive que reajustar vários cronogramas de última hora..."
10022-100220410 = "O único problema é que hoje não consegui dar um passo pra fora e o dia vai acabar só em papelada."
10022-100220420 = "Você tá bem?! Tira uma pausa pra descansar!!"
10022-100220430 = "Bom, já estou acostumada com isso."
10022-100220440 = "De qualquer forma, só de trocar essas mensagens com você já me deu um alívio, Sensei."
10022-100220450 = "Vou voltar aqui pra terminar logo essa papelada."
10022-100220460 = "Até mais tarde."
10022-100220470 = "Obrigada pela ajuda de hoje, Sensei."
10022-100220480 = "Não foi nada, imagina."
10022-100220490 = "Ajudou demais. Mas não posso ficar te dando trabalho assim toda vez."
10022-100220500 = "Da próxima vez, vou dar um jeito de terminar o serviço mais cedo."
10022-100220510 = "E aí, hum..."
10022-100220520 = "Já que viemos até aqui..."
10022-100220530 = "Quem sabe não seria bom darmos uma voltinha lá fora juntos..."
10022-100220540 = "Quando esse dia chegar, posso pedir para você me escoltar igual hoje?"
10022-100220550 = "Sensei."
10022-100220560 = "Hoje parece que vou conseguir liquidar todo o trabalho ainda pela manhã."
10022-100220570 = "Então, hum..."
10022-100220580 = "Com o maior prazer!"
10022-100220590 = "...Não responda antes de eu terminar de falar. Você sabe mesmo o que eu ia pedir...?"
10022-100220600 = "Francamente... enfim:"
10022-100220610 = "Outro dia você disse que seria um desperdício vir até um resort de praia e não aproveitar nada, lembra?"
10022-100220620 = "Isso mesmo! Já que viemos até a praia, tem que aproveitar!"
10022-100220630 = "...Uma parte de mim ainda se pergunta se tudo bem mesmo eu fazer isso,"
10022-100220640 = "mas já que você insiste tanto, Sensei..."
10022-100220650 = "Você me faz companhia hoje à tarde?"
10022-100220660 = "Acho que, hum,"
10022-100220670 = "consigo tirar um tempinho pra gente ir brincar no mar juntos."
10022-100220680 = "Com certeza! Mal posso esperar!"
10022-100220690 = "Tá bom, então... nos vemos por volta do meio-dia."
10022-100220700 = "Hoje foi muito bom."
10022-100220710 = "Ficar olhando o mar sem pressa daquele jeito de vez em quando não é nada mal."
10022-100220720 = "Da próxima vez,"
10022-100220730 = "Pode contar comigo!"
10022-100220740 = "...Eu já disse pra não responder antes de eu terminar a frase."
10022-100220750 = "Fufu, você é mesmo uma pessoa estranha."
10022-100220760 = "Tá bom, então conto com você na próxima vez também, Sensei."
10022-100220770 = "Sensei."
10022-100220780 = "Hum, você tem um tempinho agora?"
10022-100220790 = "Sim, claro!"
10022-100220800 = "Se é mensagem da Hina, mesmo que eu não tenha tempo, eu arrumo na hora!"
10022-100220810 = "É? Que bom..."
10022-100220820 = "? Sensei, espera... você tá livre ou não tá...?"
10022-100220830 = "Aconteceu alguma coisa?"
10022-100220840 = "Ah, hum... não é nada de mais, mas..."
10022-100220850 = "Se você não se importar..."
10022-100220860 = "Eu queria que você me ensinasse a nadar..."
10022-100220870 = "Claro, com todo o prazer! Tô indo praí agora mesmo."
10022-100220880 = "Sensei? Espera, eu ainda nem expliquei os detalhes..."
10022-100220890 = "Alô...? Sensei?"
