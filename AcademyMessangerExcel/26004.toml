[translation]
26004-1786 = "Здравствуйте, Сенсей! Это Шимико!"
26004-1787 = "Я хотела бы как следует поздороваться с вами, если можно, не могли бы мы встретиться?"
26004-1788 = "Вскоре меня отправят в публичную библиотеку по работе,"
26004-1789 = "и, кажется, это как раз недалеко от вас!"
26004-1790 = "Приходите в любое удобное для вас время!"
26004-1791 = "Хорошо, тогда я зайду."
26004-1792 = "(・∀・*) Да! Буду ждать!"
26004-1793 = "Спасибо вам за сегодня, Сенсей."
26004-1794 = "Какое-то время я буду в этой библиотеке,"
26004-1795 = "так что приходите в любое время!"
26004-1796 = "В следующий раз я постараюсь быть более спокойной и сдержанной..."
26004-1797 = "Н-нет, забудьте!"
26004-1798 = "В общем, я всегда буду ждать вас! (・∀・*)"
26004-1799 = "Кстати, Сенсей, вы тоже засиживаетесь до ночи за чтением?"
26004-1800 = "А, в вашем случае не книги, а..."
26004-1801 = "рабочие документы, наверное?"
26004-1802 = "Взрослая жизнь..."
26004-1803 = "Шимико, оказывается, ты сова."
26004-1804 = "Хе-хе"
26004-1805 = "Да, наверное."
26004-1806 = "Я часто сижу допоздна и читаю."
26004-1807 = "Похоже, наши активные часы совпадают (・∀・*)"
26004-1808 = "Даже поздно ночью я не против, так что всегда заходите, когда есть свободное время!"
26004-1809 = "Если вы придёте, я буду открыта 24 часа в сутки!"
26004-1810 = "Вы благополучно добрались до Шале?"
26004-1811 = "То, что было сегодня, останется между нами."
26004-1812 = "А то могут пойти слухи..."
26004-1813 = "Я тоже сохраню это в тайне! (・∀・*)"
26004-1814 = "Сенсей, вы сейчас заняты?"
26004-1815 = "У меня есть к вам просьба."
26004-1816 = "Если не трудно, не могли бы вы уделить мне время?"
26004-1817 = "Что случилось?"
26004-1818 = "Это приглашение на свидание?"
26004-1819 = "Хе-хе, это секрет."
26004-1820 = "Если придёте, сразу всё узнаете."
26004-1821 = "Подсказка: это вроде «поиска сокровищ»! (・∀・*)"
26004-1822 = "Сегодня правда было замечательно, Сенсей!"
26004-1823 = "Я правильно сделала, что позвала вас, было весело!"
26004-1824 = "Как сказать... ну,"
26004-1825 = "с вами всегда так весело, и кажется, всегда случается что-то хорошее."
26004-1826 = "Буду рада и дальше работать с вами! Сенсей! (・∀・*)"
26004-1827 = "..."
26004-1828 = "...Возврату не подлежит, учтите?"
26004-260040010 = "Сенсей, вы в последнее время читаете? Если что, всегда обращайтесь!"
26004-260040020 = "А, как раз вовремя."
26004-260040030 = "Спасибо, я как раз ищу кое-что."
26004-260040040 = "?"
26004-260040050 = "Э"
26004-260040060 = "Правда?"
26004-260040070 = "Да, правда."
26004-260040080 = "Можно мне сейчас прийти в библиотеку?"
26004-260040090 = "Ах"
26004-260040100 = "Да."
26004-260040110 = "Да! Буду ждать!!:D"
26004-260040120 = "Вы и книги благополучно вернулись?"
26004-260040130 = "Благодаря вам, Сенсей, мне было очень весело."
26004-260040140 = "А, не забудьте вернуть книги в срок."
26004-260040150 = "И ещё"
26004-260040160 = "если захотите,"
26004-260040170 = "обязательно возьмите новые книги. Я порекомендую вам что-нибудь."
26004-260040180 = "Тогда"
26004-260040190 = "ну..."
26004-260040200 = "..."
26004-260040210 = "...вы ведь снова придёте?"