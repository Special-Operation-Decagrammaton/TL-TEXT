[translation]
26004-1786 = "Olá, Sensei! Aqui é a Shimiko!"
26004-1787 = "Eu queria te cumprimentar direitinho pelo menos uma vez. Podemos nos encontrar qualquer dia desses?"
26004-1788 = "Em breve vou trabalhar como enviada na biblioteca pública,"
26004-1789 = "e parece que fica bem pertinho de onde você está, Sensei!"
26004-1790 = "Quando for um bom horário para você, apareça por lá a qualquer momento!"
26004-1791 = "Beleza, vou dar uma passada lá então."
26004-1792 = "(・∀・*) Certo! Fico te esperando!"
26004-1793 = "Muito obrigada por hoje, Sensei."
26004-1794 = "Como vou ficar nesta biblioteca por um tempinho,"
26004-1795 = "venha me visitar sempre que quiser!"
26004-1796 = "Da próxima vez, vou tentar agir de um jeito mais calmo, ou melhor, mais recatado..."
26004-1797 = "N-não, esquece o que eu acabei de dizer!"
26004-1798 = "Enfim, estarei sempre te esperando! (・∀・*)"
26004-1799 = "Aliás, Sensei, você também costuma ficar acordado até tarde da noite lendo livros?"
26004-1800 = "Ah, no seu caso não devem ser livros..."
26004-1801 = "Seriam documentos de trabalho?"
26004-1802 = "Vida de adulto trabalhador, né..."
26004-1803 = "Você é bem noturna, né, Shimiko?"
26004-1804 = "Haha"
26004-1805 = "Pois é."
26004-1806 = "Costumo ficar acordada até bem tarde lendo livros na maioria dos dias."
26004-1807 = "Parece que os nossos horários de atividade são bem parecidos (・∀・*)"
26004-1808 = "Não tem problema nenhum mesmo se for de madrugada, então venha fazer uma visita sempre que tiver um tempinho livre!"
26004-1809 = "Se for para receber você, Sensei, deixo aberto 24 horas por dia!"
26004-1810 = "Chegou bem na Schale?"
26004-1811 = "O que aconteceu hoje é segredo, viu?"
26004-1812 = "É que pode acabar virando boato..."
26004-1813 = "Eu também vou guardar segredo! (・∀・*)"
26004-1814 = "Sensei, está ocupado agora?"
26004-1815 = "Tem um favorzinho que eu gostaria de te pedir."
26004-1816 = "Se não se importar, poderia me fazer companhia?"
26004-1817 = "O que houve?"
26004-1818 = "Seria um convite para um encontro?"
26004-1819 = "Hehe, isso é segredo."
26004-1820 = "Você vai descobrir assim que chegar aqui."
26004-1821 = "Para dar uma dica, é quase como uma 'caça ao tesouro'! (・∀・*)"
26004-1822 = "Muito obrigada mesmo por hoje, Sensei!"
26004-1823 = "Fiz muito bem em te chamar, foi super divertido!"
26004-1824 = "Como posso dizer, hum..."
26004-1825 = "Estar com você é sempre tão divertido, tenho a sensação de que coisas boas sempre acontecem."
26004-1826 = "Conto com você daqui para frente também, Sensei! (・∀・*)"
26004-1827 = "..."
26004-1828 = "...Não aceitamos devolução, ouviu bem?"
26004-260040010 = "Sensei, você tem lido livros ultimamente? Se precisar de qualquer coisa, pode me consultar a qualquer hora!"
26004-260040020 = "Ah, que timing perfeito."
26004-260040030 = "Obrigado, tem justamente um livro que estou procurando."
26004-260040040 = "?"
26004-260040050 = "Hã"
26004-260040060 = "Sério mesmo?"
26004-260040070 = "Sim, sério."
26004-260040080 = "Posso ir para a biblioteca agora?"
26004-260040090 = "Ah"
26004-260040100 = "Sim"
26004-260040110 = "Sim! Estou te esperando!! :D"
26004-260040120 = "Tanto o livro quanto o Sensei chegaram bem em casa?"
26004-260040130 = "Foi muito divertido graças à sua visita, Sensei."
26004-260040140 = "Ah, por favor devolva o livro dentro do prazo, viu?"
26004-260040150 = "E também..."
26004-260040160 = "Quando vier devolver, se quiser,"
26004-260040170 = "não deixe de pegar um livro novo emprestado. Vou preparar várias recomendações para você."
26004-260040180 = "Porque assim..."
26004-260040190 = "Hum..."
26004-260040200 = "..."
26004-260040210 = "...Você vem me ver de novo, não vem?"
26004-260040220 = "Sensei, é a Shimiko!"
26004-260040230 = "Desculpe perguntar assim de repente, mas você tem descansado direito?"
26004-260040240 = "Bom dia!"
26004-260040250 = "Claro, estou cheio de energia!"
26004-260040260 = "(・A・) "
26004-260040270 = "Por precaução, vou perguntar mais uma vez."
26004-260040280 = "Você está mesmo descansando direito?"
26004-260040290 = "Me desculpe... É mentira..."
26004-260040300 = "Eu queria descansar lendo um bom livro..."
26004-260040310 = "Eu sabia...!"
26004-260040320 = "Nesse caso, venha para a sala de descanso da biblioteca!"
26004-260040330 = "Conseguiu tirar o cansaço?"
26004-260040340 = "Como está se sentindo?"
26004-260040350 = "Deu para descansar bastante!"
26004-260040360 = "Obrigado (・∀・*)"
26004-260040370 = "Ehehe! (・∀・*)"
26004-260040380 = "Ainda bem que me esforcei!"
26004-260040390 = "Daqui para frente, venha sem cerimônia sempre que precisar."
26004-260040400 = "A bibliotecária estará sempre esperando por você!"
