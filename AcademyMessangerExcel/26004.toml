[translation]
26004-1786 = "Здравствуйте, Сенсей! Это Шимико!"
26004-1787 = "Можно мне как-нибудь к вам зайти?"
26004-1788 = "Меня отправили в публичную библиотеку,"
26004-1789 = "а она как раз рядом с вами!"
26004-1790 = "Она совсем близко, так что заглядывайте, когда будет время!"
26004-1791 = "Конечно!"
26004-1792 = "Отлично! Буду ждать!"
26004-1793 = "Сегодня было так весело, Сенсей."
26004-1794 = "Я ещё какое-то время буду в библиотеке."
26004-1795 = "Так что заходите когда угодно!"
26004-1796 = "Может, в следующий раз будете немного потише..."
26004-1797 = "В общем..."
26004-1798 = "Буду ждать!"
26004-1799 = "Вы случайно не читаете по ночам?"
26004-1800 = "А, в вашем случае это не книги..."
26004-1801 = "Рабочие документы, да?"
26004-1802 = "Я не только работаю..."
26004-1803 = "О? Вы тоже?"
26004-1804 = "Хи-хи-хи."
26004-1805 = "Понятно."
26004-1806 = "Похоже..."
26004-1807 = "У нас очень похожий образ жизни!"
26004-1808 = "Если станет скучно, когда все спят, приходите ко мне!"
26004-1809 = "Это место открыто для вас круглосуточно!"
26004-1810 = "Вы благополучно добрались домой?"
26004-1811 = "Давайте сохраним сегодняшний день в секрете."
26004-1812 = "Люди могут начать сплетничать."
26004-1813 = "Я никому ни слова!"
26004-1814 = "Вы заняты, Сенсей?"
26004-1815 = "Сегодня у меня к вам особая просьба."
26004-1816 = "Можете немного побыть со мной?"
26004-1817 = "Что происходит?"
26004-1818 = "Мы идём на свидание?"
26004-1819 = "Хи-хи-хи."
26004-1820 = "Секрет. Увидите, когда придёте."
26004-1821 = "Это будет как охота за сокровищами!"
26004-1822 = "Огромное спасибо за сегодня, Сенсей!"
26004-1823 = "Без вас это было бы невозможно!"
26004-1824 = "Почему-то..."
26004-1825 = "мне кажется, рядом с вами всегда происходят хорошие вещи."
26004-1826 = "Так что надеюсь скоро снова вас увидеть, Сенсей!"
26004-1827 = "..."
26004-1828 = "Отказать нельзя!"
26004-260040010 = "Пожалуйста, сообщите, если вам когда-нибудь понадобится книга!"
26004-260040020 = "Кстати о книгах..."
26004-260040030 = "Я кое-что ищу."
26004-260040040 = "...?"
26004-260040050 = "Мм."
26004-260040060 = "Правда?"
26004-260040070 = "Ага."
26004-260040080 = "Я пойду."
26004-260040090 = "А."
26004-260040100 = "Хорошо."
26004-260040110 = "Да!! Буду ждать!!!"
26004-260040120 = "Вы благополучно добрались домой, Сенсей?"
26004-260040130 = "Благодаря вам сегодня библиотека была ещё веселее обычного."
26004-260040140 = "Пожалуйста, не забудьте вовремя вернуть взятую книгу!"
26004-260040150 = "И..."
26004-260040160 = "Если вы не против..."
26004-260040170 = "надеюсь, потом возьмёте новую."
26004-260040180 = "Тогда..."
26004-260040190 = "Эм..."
26004-260040200 = "вы..."
26004-260040210 = "снова придёте, хотя бы чтобы вернуть книгу."
26004-260040220 = "先生、シミコです！"
26004-260040230 = "いきなりですが、ちゃんと休みを取れていますか？"
26004-260040240 = "おはよう！"
26004-260040250 = "もちろん元気だよ！"
26004-260040260 = "(・A・) "
26004-260040270 = "念のため、もう一度お聞きします"
26004-260040280 = "本当に、ちゃんと休まれていますか？"
26004-260040290 = "ごめんなさい……嘘です……"
26004-260040300 = "本を読みながら休みたいです……"
26004-260040310 = "やはり……！"
26004-260040320 = "それでしたら図書館の休憩室へいらしてください！"
26004-260040330 = "疲れは取れましたか？"
26004-260040340 = "体調はいかがでしょうか"
26004-260040350 = "ゆっくり休めたよ！"
26004-260040360 = "ありがとう(・∀・*)"
26004-260040370 = "えへへ！(・∀・*)"
26004-260040380 = "頑張って良かったです！"
26004-260040390 = "これからも、ご遠慮なくいらしてください"
26004-260040400 = "司書はいつも待っていますので！"
