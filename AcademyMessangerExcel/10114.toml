[translation]
10114-101140010 = "Olá, Sensei."
10114-101140020 = "Eu comecei um trabalho de meio período!"
10114-101140030 = "Trabalhando com o quê?"
10114-101140040 = "Fiquei responsável pelo atendimento no salão de um café aqui perto."
10114-101140050 = "Hum... Sensei,"
10114-101140060 = "se você não se importar..."
10114-101140070 = "Eu estava mesmo querendo dar uma distraída."
10114-101140080 = "Acho que vou dar uma passada aí mais tarde."
10114-101140090 = "...!?"
10114-101140100 = "Muito obrigada, Sensei!"
10114-101140110 = "Estarei esperando por você!"
10114-101140120 = "Sensei"
10114-101140130 = "Senseeei..."
10114-101140140 = "Tudo bem, Juri?"
10114-101140150 = "Ontem também não consegui dormir direito..."
10114-101140160 = "Só de pensar que finalmente chegou o dia do Torneio Seletivo de Garçonetes..."
10114-101140170 = "Fico tão nervosa..."
10114-101140180 = "E se eu cometer algum erro... o que eu faço?"
10114-101140190 = "Por enquanto, tente não pensar no resultado."
10114-101140200 = "Mesmo que algo dê errado, o importante é dar o seu melhor para não se arrepender depois."
10114-101140210 = "Sim... Vou fazer o possível."
10114-101140220 = "Hum, se eu ficar nervosa demais na hora..."
10114-101140230 = "Você poderia segurar a minha mão...?"
10114-101140240 = "Sensei! Você está ocupado agora?"
10114-101140250 = "Estou só abrindo a caixa de um brinquedo que comprei pela internet."
10114-101140260 = "A-Ah, entendi."
10114-101140270 = "Parece ocupado..."
10114-101140280 = "Imagina, na verdade estou bem livre."
10114-101140290 = "Que alívio!"
10114-101140300 = "Hum,"
10114-101140310 = "Sensei,"
10114-101140320 = "se não for pedir demais..."
10114-101140330 = "Por favor, me dê esconderijo aí!"
10114-101140340 = "...Hã?"
