[translation]
10114-101140010 = "Здравствуйте, Сенсей."
10114-101140020 = "Я начала подрабатывать!"
10114-101140030 = "Кем?"
10114-101140040 = "Я стала работать в кафе неподалёку официантом."
10114-101140050 = "Эм... Сенсей..."
10114-101140060 = "Если вам не трудно..."
10114-101140070 = "Я как раз хотел сменить обстановку."
10114-101140080 = "Может, зайду к вам позже."
10114-101140090 = "...!?"
10114-101140100 = "Спасибо, Сенсей!"
10114-101140110 = "Я буду вас ждать."
10114-101140120 = "Сенсей..."
10114-101140130 = "Сенсе-ей..."
10114-101140140 = "Джури, ты в порядке?"
10114-101140150 = "Вчера я тоже плохо спала..."
10114-101140160 = "Когда думаю, что скоро конкурс официанток..."
10114-101140170 = "я так волнуюсь..."
10114-101140180 = "А если я ошибусь... что же делать?"
10114-101140190 = "Не переживай о результате сейчас."
10114-101140200 = "Даже если что-то пойдёт не так, старайся не жалеть."
10114-101140210 = "Да... я постараюсь."
10114-101140220 = "Эм, если что..."
10114-101140230 = "не могли бы вы взять меня за руку...?"
10114-101140240 = "Сенсей! Вы сейчас заняты?"
10114-101140250 = "Я как раз распаковываю игрушку, которую купил по интернету."
10114-101140260 = "А-а, вот как..."
10114-101140270 = "Вы, наверное, заняты..."
10114-101140280 = "Нет, наоборот, есть время."
10114-101140290 = "Вот как!"
10114-101140300 = "Ну..."
10114-101140310 = "Сенсей..."
10114-101140320 = "Если вам не трудно..."
10114-101140330 = "Я хочу, чтобы вы меня спрятали!"
10114-101140340 = "... Что?"