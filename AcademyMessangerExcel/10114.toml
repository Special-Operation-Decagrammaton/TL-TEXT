[translation]
10114-101140010 = "Здравствуйте, Сенсей."
10114-101140020 = "Я устроилась на подработку!"
10114-101140030 = "Подработку? Где?"
10114-101140040 = "Я решила попробовать поработать официанткой в кафе неподалёку."
10114-101140050 = "Эм, Сенсей?"
10114-101140060 = "Если вы не против..."
10114-101140070 = "Какое совпадение. Мне нравится это кафе!"
10114-101140080 = "Мне вдруг... захотелось в кафе!"
10114-101140090 = "Что? Это значит..."
10114-101140100 = "Спасибо, Сенсей."
10114-101140110 = "Буду ждать."
10114-101140120 = "Сенсей."
10114-101140130 = "Сенсееей..."
10114-101140140 = "Джури? Ты в порядке?"
10114-101140150 = "Я не выспалась..."
10114-101140160 = "Когда вспомнила, что сегодня конкурс официанток,"
10114-101140170 = "я слишком разнервничалась..."
10114-101140180 = "А что, если... у меня ничего не получится?"
10114-101140190 = "Давай не будем слишком переживать из-за результата..."
10114-101140200 = "Даже если не получится — ничего страшного, постарайся изо всех сил и не будешь жалеть."
10114-101140210 = "Да... Я постараюсь."
10114-101140220 = "Но если всё-таки не получится..."
10114-101140230 = "Тогда, пожалуйста, подержи меня за руку..."
10114-101140240 = "Сенсей! Ты сейчас занят?"
10114-101140250 = "Я как раз распаковывал игрушку."
10114-101140260 = "Н-Неужели?"
10114-101140270 = "Тогда вы, в некотором смысле, очень заняты..."
10114-101140280 = "Это значит, что я совершенно свободен."
10114-101140290 = "Понятно!"
10114-101140300 = "..."
10114-101140310 = "Эм, Сенсей..."
10114-101140320 = "Если вы не против..."
10114-101140330 = "Пожалуйста, спрячьте меня где-нибудь!"
10114-101140340 = "...Что?"
