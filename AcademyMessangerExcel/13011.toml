[translation]
13011-130110010 = "О, храбрый герой..."
13011-130110020 = "Пожалуйста, приходите в клубную комнату Клуба разработки игр, как только получите это сообщение..."
13011-130110030 = "Хорошо, сейчас приду."
13011-130110040 = "Э-э-э..."
13011-130110050 = "Вы просто согласились вот так, ни секунды не раздумывая!"
13011-130110060 = "Вот это наш Сенсей!"
13011-130110070 = "Эй, что за вялая реакция? Я такого не ожидала!"
13011-130110080 = "Нет-нет... Судя по сценарию, такая сюжетная ветка должна быть вполне нормальной..."
13011-130110090 = "...А может, и нет."
13011-130110100 = "Вы обещали сегодня встретиться со мной в клубной комнате!"
13011-130110110 = "Точно... наверное?"
13011-130110120 = "Я буду ждать вас в клубной комнате Клуба разработки игр!"
13011-130110130 = "Так что скорее!"
13011-130110140 = "Сенсей..."
13011-130110150 = "Как думаете, что нужно для идеального сюжета в ретро-игре?"
13011-130110160 = "Идеальный игровой сюжет...?"
13011-130110170 = "...В чём проблема?"
13011-130110180 = "Ни в чём..."
13011-130110190 = "Вот дурни!"
13011-130110200 = "Только и делают, что болтают!"
13011-130110210 = "Сюжет скучный, механики кривые... Бла-бла-бла..."
13011-130110220 = "Не могу это терпеть. Встретьтесь со мной в клубной комнате Клуба разработки игр, Сенсей!"
13011-130110230 = "А?"
13011-130110231 = "Что мне делать, Сенсей?!"
13011-130110232 = "Все мои идеи такие банальные..."
13011-130110233 = "Больше ничего придумать не могу! Пожалуйста, помогите!"
13011-130110234 = "Уааа!"
13011-130110240 = "Мир ретро-игр безграничен, Сенсей!"
13011-130110250 = "Но даже среди ретро-игр самые насыщенные сюжетом"
13011-130110260 = "это симуляторы свиданий! Да!"
13011-130110270 = "Симуляторы свиданий...?"
13011-130110280 = "Сегодня..."
13011-130110290 = "я собираюсь «симулировать» симулятор свиданий!"
13011-130110300 = "Увидимся на улице, Сенсей!"
13011-130110310 = "Симуляция... симулятора...?"
13011-130110320 = "Сегодня было весело, Сенсей..."
13011-130110330 = "Мне тоже было весело."
13011-130110340 = "Рада это слышать..."
13011-130110350 = "Никому нельзя рассказывать, что мы сегодня делали!"
13011-130110360 = "Особенно Мидори!"
13011-130110370 = "А? Но почему..."
13011-130110380 = "Потому что это стыдно! Это секрет!"
13011-130110390 = "Сенсей, Сенсей!"
13011-130110400 = "Да! Момои, Момои!"
13011-130110410 = "Что такое?"
13011-130110420 = "Я слышала, в Хару Хабаре проходит большое событие!"
13011-130110430 = "Там идёт ралли с печатями в честь сорокалетия Ultra Marine Sisters!"
13011-130110440 = "...Ралли с печатями?"
13011-130110450 = "Если собрать все печати, можно получить особые предметы!"
13011-130110460 = "Мы не можем такое пропустить!"
13011-130110470 = "Хорошо, Сенсей?"
13011-130110480 = "Охотник!"
13011-130110490 = "Вы помните?!"
13011-130110500 = "Конечно, партнёр."
13011-130110510 = "И теперь начинается наша охота..."
13011-130110520 = "Да! Вот это настрой!"
13011-130110530 = "Сегодня пройдём всё целиком!"
