[translation]
13011-130110010 = "Ó Herói..."
13011-130110020 = "Assim que ler este MomoTalk, dirija-se imediatamente à sala do Clube de Desenvolvimento de Jogos..."
13011-130110030 = "Beleza, estou indo para aí agora então"
13011-130110040 = "Eeeh..."
13011-130110050 = "Aceitou a quest sem nem piscar!"
13011-130110060 = "Mandou muito bem, Sensei!"
13011-130110070 = "Guh, escolheu logo essa opção de diálogo?! Essa eu não tinha previsto...!"
13011-130110080 = "Não, espera, dependendo do roteiro uma ramificação dessas até que funciona..."
13011-130110090 = "...Quer dizer, foco!"
13011-130110100 = "Você prometeu que viria na sala do clube hoje, lembra?!"
13011-130110110 = "...Eu prometi?"
13011-130110120 = "Enfim, estou te esperando aqui na sala do Clube de Desenvolvimento de Jogos!"
13011-130110130 = "Vem logo!"
13011-130110140 = "Senseeei"
13011-130110150 = "Qual você acha que é o requisito principal para criar o melhor roteiro de jogo de todos?"
13011-130110160 = "O melhor roteiro de jogo...?"
13011-130110170 = "Por que essa pergunta do nada?"
13011-130110180 = "É que..."
13011-130110190 = "Aaah, só de lembrar já fico irritada de novo!"
13011-130110200 = "Aquelas meninas falaram o que bem entenderam do meu texto!"
13011-130110210 = "Disseram que a ideia é batida, que o ritmo da história fica arrastado no meio..."
13011-130110220 = "Não dá mais! Sensei, vem pra sala do Clube de Desenvolvimento de Jogos agora mesmo!"
13011-130110230 = "...?"
13011-130110231 = "O que eu faço, Sensei?!"
13011-130110232 = "A ideia genial que eu tive está cheia de furos de roteiro,"
13011-130110233 = "e não consigo pensar em nenhuma ideia nova para resolver essa contradição! Socoooorro!!"
13011-130110234 = "Buááááááá!!!"
13011-130110240 = "Sensei, o universo dos jogos retrô é gigantesco!"
13011-130110250 = "Mas entre os jogos retrô em que o roteiro tem um peso super importante,"
13011-130110260 = "os simuladores de romance com certeza não podem ficar de fora!"
13011-130110270 = "Simuladores de romance...?"
13011-130110280 = "Por isso, hoje,"
13011-130110290 = "estou pensando em simular um simulador de romance na prática!"
13011-130110300 = "Depois te mando a localização, então a gente se encontra lá, tá bom, Sensei?!"
13011-130110310 = "Simular um simulador...?"
13011-130110320 = "Sensei, hum... Foi muito divertido hoje. Valeu"
13011-130110330 = "Sim, eu também me diverti bastante"
13011-130110340 = "Q-Que bom então"
13011-130110350 = "Mas olha, o que aconteceu hoje é segredo absoluto, não conta pra ninguém!"
13011-130110360 = "Principalmente pra Midori, não fala pra ela de jeito nenhum!"
13011-130110370 = "Por que tanto mistério? Não era para a pesquisa do Clube de Desenvolvimento de Jogos...?"
13011-130110380 = "Não pode! É segredo absoluto e pronto!!"
13011-130110390 = "Sensei, Sensei!"
13011-130110400 = "Uma Momoi selvagem apareceu!"
13011-130110410 = "O que houve?"
13011-130110420 = "Fiquei sabendo que vai rolar um evento gigantesco em Haruhabara!"
13011-130110430 = "É o Rally de Carimbos de 40º Aniversário das Ultramarine Sisters!"
13011-130110440 = "Rally de carimbos?"
13011-130110450 = "Parece que se a gente juntar todos os carimbos, ganha um brinde de edição limitada"
13011-130110460 = "Isso é imperdível...!"
13011-130110470 = "Vamos juntos, Sensei!!"
13011-130110480 = "Ainda se lembra da promessa,"
13011-130110490 = "ó Caçador?!"
13011-130110500 = "Mas é claro, parceira..."
13011-130110510 = "Chegou a hora da caçada...!"
13011-130110520 = "Avante!"
13011-130110530 = "Confio a minha retaguarda a você!"
