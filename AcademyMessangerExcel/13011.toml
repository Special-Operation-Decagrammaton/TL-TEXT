[translation]
13011-130110010 = "О, герой..."
13011-130110020 = "Как только увидишь это сообщение в Момотолке, сразу приходи в Департаменте разработки игр..."
13011-130110030 = "Да, тогда я сейчас приду."
13011-130110040 = "Э-э..."
13011-130110050 = "Мгновенно принял квест!"
13011-130110060 = "Как и ожидалось от Сенсея!"
13011-130110070 = "Уф, такой выбор здесь!? Этого я не ожидала...!"
13011-130110080 = "Нет, но в некоторых сценариях такие развилки тоже возможны..."
13011-130110090 = "...Не о том!"
13011-130110100 = "Мы же договаривались! Встретиться сегодня в Департаменте разработки игр!"
13011-130110110 = "...Разве?"
13011-130110120 = "В любом случае, я жду в Департаменте разработки игр!"
13011-130110130 = "Приходите скорее!"
13011-130110140 = "Сенсей~"
13011-130110150 = "Как ты думаешь, каковы условия для лучшего игрового сценария?"
13011-130110160 = "Лучший игровой сценарий...?"
13011-130110170 = "Что вдруг?"
13011-130110180 = "Это..."
13011-130110190 = "Ах, как только вспомнила, снова злюсь!"
13011-130110200 = "Эти ребята говорят всё, что хотят!"
13011-130110210 = "Что идеи устарели, что сюжет провисает..."
13011-130110220 = "Всё, не могу! Сенсей, сейчас же придите в Департамент разработки игр!"
13011-130110230 = "...?"
13011-130110231 = "Что делать, Сенсей!?"
13011-130110232 = "Идея, которую я с трудом придумала, полна противоречий,"
13011-130110233 = "и я никак не могу придумать следующую, чтобы это исправить! Помогите~!"
13011-130110234 = "Уаааааааааа!!"
13011-130110240 = "Сенсей, мир ретро-игр очень широк!"
13011-130110250 = "Но среди этих ретро-игр, как игры с большим акцентом на сценарий,"
13011-130110260 = "конечно же, нельзя обойти стороной симуляторы свиданий!"
13011-130110270 = "Симуляторы свиданий...?"
13011-130110280 = "Поэтому сегодня"
13011-130110290 = "я хочу попробовать симулировать симулятор свиданий!"
13011-130110300 = "Тогда я позже пришлю место, встретимся там! Сенсей!"
13011-130110310 = "Симулировать симулятор...?"
13011-130110320 = "Сенсей, эм... сегодня было весело. Спасибо."
13011-130110330 = "Да, мне тоже было весело."
13011-130110340 = "Э-это хорошо."
13011-130110350 = "Но сегодняшнее... держите в секрете от остальных!"
13011-130110360 = "Особенно не говорите Мидори!"
13011-130110370 = "Почему такая секретность? Ведь сначала мы были в Департаменте разработки игр..."
13011-130110380 = "Нет! Это абсолютный секрет!!"
13011-130110390 = "Сенсей, Сенсей!"
13011-130110400 = "Момои появилась!"
13011-130110410 = "Что случилось?"
13011-130110420 = "Говорят, в Акихабаре скоро будет огромное событие!"
13011-130110430 = "А именно, сбор штампов в честь 40-летия Ультрамариновых сестёр!"
13011-130110440 = "Сбор штампов?"
13011-130110450 = "Похоже, если собрать все штампы, можно получить эксклюзивный подарок."
13011-130110460 = "Это нельзя упустить...!"
13011-130110470 = "Пойдёмте вместе, Сенсей!!"
13011-130110480 = "Охотник!"
13011-130110490 = "Помнишь ли ты?!"
13011-130110500 = "Конечно, напарник."
13011-130110510 = "Настало время охоты...!"
13011-130110520 = "Вперёд!"
13011-130110530 = "Я доверяю тебе свою спину!"