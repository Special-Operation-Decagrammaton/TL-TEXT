[translation]
20054-200540010 = "Как бы ни был занят Сенсей,"
20054-200540020 = "в такое время вы наверняка спите."
20054-200540030 = "Если вдруг не спите, ложитесь скорее."
20054-200540040 = "Кстати, это сообщение отправлено с задержкой."
20054-200540050 = "Ну что ж, Сенсей,"
20054-200540060 = "Ждите завтрашнего утра с нетерпением."
20054-200540070 = "Просыпайтесь как следует."
20054-200540080 = "Ау-у-у"
20054-200540090 = "Может, вы вздремнули?"
20054-200540100 = "Просыпайтесь, Сенсей."
20054-200540110 = "Скоро обеденный перерыв закончится."
20054-200540120 = "У-у-у..."
20054-200540130 = "Только что проснулся..."
20054-200540140 = "Хорошо."
20054-200540150 = "Надеюсь, вы освежились."
20054-200540160 = "Давайте постараемся и во второй половине дня."
20054-200540170 = "Я тоже приду помочь."
20054-200540180 = "Смеркается."
20054-200540190 = "Уже вечер."
20054-200540200 = "Хе-хе"
20054-200540210 = "Наконец-то."
20054-200540220 = "Истинный потенциал уличной инвалидной коляски"
20054-200540230 = "Настало время показать вам."
20054-200540240 = "Я готов...!"
20054-200540250 = "Полный энтузиазма ответ."
20054-200540260 = "Благодарю."
20054-200540270 = "Я подарю вам незабываемые воспоминания."
20054-200540280 = "Сегодняшний день"
20054-200540290 = "Спасибо за работу."
20054-200540300 = "Казался долгим, но пролетел быстро..."
20054-200540310 = "Хе-хе"
20054-200540320 = "Я тоже так чувствовала."
20054-200540330 = "Скоро начнётся новый день."
20054-200540340 = "Завтра взойдёт своё солнце."
20054-200540350 = "Отдыхайте спокойно."
20054-200540360 = "И ты, Химари, спокойной ночи."
20054-200540370 = "А завтра"
20054-200540380 = "Блестящие успехи гениальной, болезненной, красивой девушки-лайфстаффера"
20054-200540390 = "Ждите с нетерпением."
20054-200540400 = "В этом ты непоколебима..."
20054-200540410 = "Как я могла!"
20054-200540420 = "Сенсей, я сейчас приду."
20054-200540430 = "А, доброе утро, Химари."
20054-200540440 = "Редко когда Химари просыпает."
20054-200540450 = "Не может быть..."
20054-200540460 = "Я, безупречный гениальный болезненный хакер-красавица,"
20054-200540470 = "допустила такую оплошность...!"
20054-200540480 = "Я принесу тебе еду."
20054-200540490 = "Доброе утро."
20054-200540500 = "Вы уже проснулись?"
20054-200540510 = "Незаметно оказался в своей комнате..."
20054-200540520 = "Эм"
20054-200540530 = "Дело в том,"
20054-200540540 = "Эйми пришла меня разбудить,"
20054-200540550 = "и тогда же проводила вас до комнаты."
20054-200540560 = "Вот оно что... передай ей спасибо."
20054-200540570 = "Да, она обрадуется."
20054-200540580 = "Тогда начнём заново, Сенсей!"
20054-200540590 = "Я снова бодро"
20054-200540600 = "стану вашим личным лайфстаффером, хорошо?"