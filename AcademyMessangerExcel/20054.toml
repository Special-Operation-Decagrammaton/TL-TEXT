[translation]
20054-200540010 = "Por mais que seja você, Sensei,"
20054-200540020 = "imagino que já esteja dormindo a uma hora dessas"
20054-200540030 = "Mas, caso ainda esteja acordado, trate de ir dormir logo"
20054-200540040 = "Aliás, esta é uma mensagem programada"
20054-200540050 = "Sendo assim, Sensei,"
20054-200540060 = "aguarde ansiosamente pela manhã de amanhã"
20054-200540070 = "E vê se acorda no horário direitinho, viu?"
20054-200540080 = "Alôôô"
20054-200540090 = "Por acaso você está tirando um cochilo depois do almoço?"
20054-200540100 = "Acorde, por favor, Sensei"
20054-200540110 = "O horário de almoço já está quase acabando"
20054-200540120 = "Uuuu..."
20054-200540130 = "Acabei de acordar..."
20054-200540140 = "Que bom"
20054-200540150 = "Espero que tenha dado para descansar um pouco"
20054-200540160 = "Vamos dar o nosso melhor no expediente da tarde também"
20054-200540170 = "Eu também irei aí para ajudá-lo"
20054-200540180 = "Já começou a escurecer, não é?"
20054-200540190 = "Pois é, já é noite"
20054-200540200 = "Fufu"
20054-200540210 = "Chegou o grande momento"
20054-200540220 = "A hora de mostrar a você, Sensei,"
20054-200540230 = "o verdadeiro potencial da minha cadeira de rodas para terrenos externos"
20054-200540240 = "Estou preparado para o que der e vier...!"
20054-200540250 = "Uma resposta cheia de entusiasmo,"
20054-200540260 = "muito obrigada"
20054-200540270 = "Vou presenteá-lo com memórias inesquecíveis"
20054-200540280 = "Obrigada pelo seu esforço"
20054-200540290 = "em mais um dia de trabalho"
20054-200540300 = "Foi um dia que pareceu longo e curto ao mesmo tempo..."
20054-200540310 = "Fufu"
20054-200540320 = "Eu também estava sentindo exatamente isso"
20054-200540330 = "Logo um novo dia chegará"
20054-200540340 = "E com o amanhã, nascerá o sol de um novo dia"
20054-200540350 = "Descanse bem, por favor"
20054-200540360 = "Boa noite para você também, Himari"
20054-200540370 = "E pode aguardar ansiosamente"
20054-200540380 = "pela atuação de amanhã da sua bela assistente de suporte de vida, supergenial e de saúde frágil"
20054-200540390 = "Não perca por esperar, viu?"
20054-200540400 = "Vejo que disso você não abre mão mesmo..."
20054-200540410 = "Logo eu, cometer um deslize desses!"
20054-200540420 = "Sensei, estou indo para aí imediatamente"
20054-200540430 = "Ah, bom dia, Himari"
20054-200540440 = "Que raro ver você perder a hora, Himari"
20054-200540450 = "Quem diria que eu,"
20054-200540460 = "a bela hacker supergenial, impecável e de saúde frágil,"
20054-200540470 = "cometeria uma gafe dessas...!"
20054-200540480 = "Vou levar o café da manhã aí pra você"
20054-200540490 = "Bom dia"
20054-200540500 = "Já está acordado?"
20054-200540510 = "Quando dei por mim, já estava de volta no meu quarto..."
20054-200540520 = "Hum..."
20054-200540530 = "Sobre isso,"
20054-200540540 = "a Eimi veio me acordar"
20054-200540550 = "e aproveitou para levá-lo de volta até o seu quarto, Sensei"
20054-200540560 = "Ah, foi isso... Vou agradecer a ela depois"
20054-200540570 = "Sim, tenho certeza de que ela ficará feliz"
20054-200540580 = "Bom, vamos recomeçar do zero, Sensei!"
20054-200540590 = "Já estou cheia de energia novamente"
20054-200540600 = "para voltar a ser a sua assistente exclusiva de suporte de vida, viu?"
