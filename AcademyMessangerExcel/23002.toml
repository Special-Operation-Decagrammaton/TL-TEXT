[translation]
23002-1502 = "Вы тоже боитесь уколов, Сенсей?"
23002-1503 = "У меня нет проблем с уколами."
23002-1504 = "Ненавижу уколы! Ненавижу иглы!"
23002-1505 = "Ого, а вы взрослый!"
23002-1506 = "Большинство студентов боятся острых игл."
23002-1507 = "...Наверное, даже взрослые боятся уколов."
23002-1508 = "Эти иглы всегда вызывают у меня плохое предчувствие."
23002-1509 = "Старшие студенты говорили, что хорошие медсёстры умеют делать уколы без боли."
23002-1510 = "Если бы уколы действительно не болели, больше людей спокойно относились бы к больнице..."
23002-1511 = "Интересно, как они делают уколы безболезненными?"
23002-1512 = "Вы хорошо спите, Сенсей?"
23002-1513 = "Круги под глазами выглядят плохо, да и кожа стала какой-то грубой..."
23002-1514 = "Бессонница стала совсем сильной..."
23002-1515 = "Я просто не могу уснуть ночью."
23002-1516 = "Нужно каждый день спать в правильное время!"
23002-1517 = "Переутомление — хуже всего! Недосып разрушит здоровье и приведёт к болезни!"
23002-1518 = "Так не пойдёт. Я приготовлю что-нибудь, что поможет вам лучше спать ночью."
23002-1519 = "Приходите завтра в обед в медпункт!"
23002-1520 = "Травяной чай слишком долго усыпляет."
23002-1521 = "Поищу в интернете чай, от которого вы уснёте моментально."
23002-1522 = "Хм... А как насчёт чая из корня аконита?"
23002-1523 = "Ты меня убить пытаешься?!"
23002-1524 = "Где вы обычно делаете утреннюю зарядку, Сенсей?"
23002-1525 = "В парке? В школе? В офисе?"
23002-1526 = "Вообще-то я никогда не видела, чтобы вы делали утреннюю зарядку."
23002-1527 = "Кажется, я не делал её со времён начальной школы..."
23002-1528 = "Что? Вы не делаете утреннюю зарядку?"
23002-1529 = "Как вы вообще переживаете день?"
23002-1530 = "Вам нужно прийти со мной в парк и размяться!"
23002-1531 = "Нет."
23002-1532 = "Мне лень."
23002-1533 = "Отказ не принимается. Людям вроде вас, которые весь день сидят перед компьютером, обязательно нужно разминаться!"
23002-1534 = "Сенсей!"
23002-1535 = "Ну как после утренней зарядки, Сенсей?"
23002-1536 = "Разве не чувствуете себя намного бодрее?"
23002-1537 = "Вообще-то да."
23002-1538 = "Вот видите? Утренняя зарядка помогает снять напряжение с мышц, которые обычно почти не используются, поэтому она очень полезна!"
23002-1539 = "Вам стоит каждый день приходить в парк на утреннюю зарядку!"
23002-1540 = "Если не придёте, я сама заберу вас из Шале!"
23002-1541 = "Можно мне хотя бы в выходные отдохнуть...?"
23002-1542 = "Несколько дней назад я нашла в библиотеке Тринити старую медицинскую книгу, полную методов лечения, о которых никогда не слышала."
23002-1543 = "Интересно, это запретные техники, которые не дошли до современности?"
23002-1544 = "Или альтернативные методы, которыми пользовались люди без медицинского образования?"
23002-1545 = "Не знаю..."
23002-1546 = "Ну, когда в следующий раз поранитесь, я испытаю на вас один из этих методов."
23002-1547 = "Я так жду!"
23002-1548 = "Не думаю, что тебе стоит радоваться тому, что я получу травму..."
23002-1549 = "В административном кабинете Шале как-то мрачновато."
23002-1550 = "Красивая ваза с цветами могла бы оживить помещение..."
23002-1551 = "Какие цветы вам нравятся, Сенсей?"
23002-1552 = "Мне нравятся любые цветы."
23002-1553 = "Цветы без пыльцы."
23002-1554 = "Тогда я найду несколько цветов, которые нравятся мне."
23002-1555 = "А какие цветы нравятся тебе, Ханаэ?"
23002-1556 = "Эм... Мне нравятся почти все цветы, но особенно ипомея."
23002-1557 = "Когда она распускается утром, мне кажется, будто маленькие ангелы трубят в трубы, объявляя наступление утра."
