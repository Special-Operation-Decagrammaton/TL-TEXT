[translation]
23002-1502 = "Sensei, você tem medo de injeção?"
23002-1503 = "Não, tranquilo."
23002-1504 = "Injeção não dá! Morri de medo de agulha!"
23002-1505 = "Ah, entendi! Como esperado de um adulto!"
23002-1506 = "É que quase todas as alunas têm medo da agulha da injeção..."
23002-1507 = "Então até mesmo os adultos têm medo de injeção, né..."
23002-1508 = "Talvez sentir calafrios ao ver uma agulha de injeção não tenha nada a ver com ser adulto ou criança."
23002-1509 = "Mas, segundo as veteranas, a injeção de uma enfermeira experiente não dói nadinha!"
23002-1510 = "Se a injeção não doesse, acho que menos pessoas teriam medo de hospital..."
23002-1511 = "O que será que eu posso fazer para não doer?"
23002-1512 = "Sensei, você tem dormido direito ultimamente?"
23002-1513 = "Suas olheiras estavam bem fundas e você parecia muito cansado."
23002-1514 = "Ando meio com insônia ultimamente..."
23002-1515 = "Por algum motivo não tenho conseguido dormir à noite..."
23002-1516 = "Sabia que era isso!"
23002-1517 = "O cansaço é a raiz de todas as doenças! Se não dormir direito, você pode acabar ficando doente."
23002-1518 = "Vou procurar algum método bom para ajudar você a dormir profundamente."
23002-1519 = "Amanhã na hora do almoço, passe na enfermaria, por favor!"
23002-1520 = "O chá de ervas foi bom, mas ainda demora um pouquinho até fazer efeito e dar sono, né?"
23002-1521 = "Por isso, pesquisei na internet e encontrei algo muito mais eficaz!"
23002-1522 = "Parece que um chá feito com algo chamado... raiz de acônito...? Deve funcionar super bem!"
23002-1523 = "Tá querendo me matar?!"
23002-1524 = "Sensei, onde você costuma fazer ginástica matinal?"
23002-1525 = "No parque? Na escola? Ou na Schale?"
23002-1526 = "Parando pra pensar, nunca vi você fazendo ginástica matinal, Sensei."
23002-1527 = "Não faço ginástica matinal desde a época do fundamental..."
23002-1528 = "Hã?! Você não faz ginástica matinal?!"
23002-1529 = "Mas assim você não vai ganhar o carimbo na cartela!"
23002-1530 = "Venha comigo ao parque onde eu sempre vou para fazermos ginástica matinal juntos, Sensei!"
23002-1531 = "Não quero."
23002-1532 = "De manhã eu tenho sono."
23002-1533 = "Adultos que passam o dia inteiro sentados como você são justamente os que mais precisam exercitar o corpo!"
23002-1534 = "Vamos lá!"
23002-1535 = "O que achou de fazer ginástica matinal depois de tanto tempo, Sensei?"
23002-1536 = "Acordar cedo e se alongar não dá uma sensação revigorante?"
23002-1537 = "Confesso que me sinto mais disposto do que o normal."
23002-1538 = "Não é?! A ginástica matinal solta até os músculos que não usamos no dia a dia, então faz muito bem pra saúde!"
23002-1539 = "Por isso, de agora em diante, participe da ginástica matinal todos os dias você também, Sensei!"
23002-1540 = "Se você não aparecer, eu vou até a Schale te buscar!"
23002-1541 = "Pelo menos nos fins de semana me dá uma folga..."
23002-1542 = "Encontrei um livro de medicina antigo na biblioteca cheio de tratamentos que eu não conhecia!"
23002-1543 = "Será que... são técnicas médicas proibidas que foram ocultadas na era moderna?!"
23002-1544 = "Não seriam só remédios caseiros antigos?"
23002-1545 = "Ah, então era isso..."
23002-1546 = "Mas tudo na vida vale a tentativa! Quando você se machucar da próxima vez, Sensei, vamos testar!"
23002-1547 = "Pode esperar ansioso!"
23002-1548 = "Esperar ansioso pra me machucar já é um pouco..."
23002-1549 = "Acho que o escritório da Schale é meio sem graça."
23002-1550 = "Não ficaria lindo se colocássemos um vaso de flores?"
23002-1551 = "De que tipo de flor você gosta, Sensei?"
23002-1552 = "Gosto de quase todo tipo de flor."
23002-1553 = "Qualquer uma que não solte pólen que dê alergia."
23002-1554 = "Então vou escolher algumas das flores de que eu mais gosto!"
23002-1555 = "Qual é a sua flor favorita, Hanae?"
23002-1556 = "Humm... Eu também gosto de qualquer flor, mas a minha favorita é a ipomeia, a gloria-da-manhã."
23002-1557 = "Quando desabrocha, ela parece até um anjo anunciando a manhã com um trompete."
