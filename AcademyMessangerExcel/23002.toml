[translation]
23002-1502 = "Сенсей, вы боитесь уколов?"
23002-1503 = "Нет, я спокоен."
23002-1504 = "Терпеть не могу уколы! Ненавижу иголки!"
23002-1505 = "Вот как, как и ожидалось от взрослого!"
23002-1506 = "Студенты почти все боятся иголок..."
23002-1507 = "Всё-таки даже взрослые боятся уколов..."
23002-1508 = "Наверное, боязнь иголок не зависит от возраста."
23002-1509 = "Но старшие говорят, что у опытных медсестёр уколы совсем не болят."
23002-1510 = "Если бы уколы были безболезненными, возможно, меньше людей боялись бы больниц..."
23002-1511 = "Как сделать их безболезненными?"
23002-1512 = "Сенсей, вы в последнее время хорошо спите?"
23002-1513 = "У вас были синяки под глазами, и выглядели вы очень уставшим."
23002-1514 = "В последнее время у меня немного бессонница..."
23002-1515 = "Ночью не могу уснуть..."
23002-1516 = "Я так и думала."
23002-1517 = "Усталость — мать всех болезней! Без полноценного сна можно заболеть."
23002-1518 = "Я поищу что-нибудь, что поможет вам крепко уснуть."
23002-1519 = "Завтра в обед приходите в медпункт!"
23002-1520 = "Травяной чай был хорош, но засыпать после него долго."
23002-1521 = "Поэтому я нашла в интернете кое-что более эффективное!"
23002-1522 = "Чай из корня аконита, похоже, очень помогает!"
23002-1523 = "Ты хочешь меня отравить!?"
23002-1524 = "Сенсей, где вы обычно делаете утреннюю гимнастику?"
23002-1525 = "В парке? В школе? Или в Шале?"
23002-1526 = "Кстати, я никогда не видела, как вы делаете гимнастику."
23002-1527 = "Я не делал её с начальной школы..."
23002-1528 = "Что, вы не делаете утреннюю гимнастику?"
23002-1529 = "Но тогда вы не получите заветный штамп!"
23002-1530 = "Давайте вместе пойдём в мой обычный парк и сделаем гимнастику!"
23002-1531 = "Не хочу."
23002-1532 = "Утром хочется спать."
23002-1533 = "Таким взрослым, как вы, которые весь день сидят, обязательно нужно двигаться!"
23002-1534 = "Итак, пошли!"
23002-1535 = "Как вам гимнастика после долгого перерыва, Сенсей?"
23002-1536 = "Разве не приятно встать пораньше и размяться?"
23002-1537 = "Да, чувствую себя бодрее, чем обычно."
23002-1538 = "Правда? Гимнастика помогает размять мышцы, которые мы редко используем, так что это полезно!"
23002-1539 = "Поэтому с сегодняшнего дня вы тоже будете ходить на утреннюю гимнастику каждый день!"
23002-1540 = "Если не придёте, я приду за вами в Шале!"
23002-1541 = "Хотя бы по выходным дайте мне поспать..."
23002-1542 = "Я нашла в библиотеке старую медицинскую книгу, там были методы лечения, о которых я никогда не слышала!"
23002-1543 = "Может быть... это запрещённые знания, скрытые от современной медицины!?"
23002-1544 = "Наверное, это просто народные методы?"
23002-1545 = "Вот оно что..."
23002-1546 = "Но всему нужно давать шанс. Если вы поранитесь, я попробую их на вас!"
23002-1547 = "Ждите с нетерпением!"
23002-1548 = "Ждать травмы, как-то странно..."
23002-1549 = "Ваш кабинет в Шале кажется немного пустым."
23002-1550 = "Может быть, если поставить вазу с цветами, станет уютнее?"
23002-1551 = "Какие цветы вы любите, Сенсей?"
23002-1552 = "Я люблю любые цветы."
23002-1553 = "Лишь бы пыльца не была вредной."
23002-1554 = "Тогда я выберу несколько моих любимых цветов!"
23002-1555 = "А какой цветок тебе нравится больше всего, Ханаэ?"
23002-1556 = "Хм... я люблю любые цветы, но больше всего — утреннюю славу."
23002-1557 = "Цветущая утренняя слава похожа на ангела, который трубным гласом возвещает наступление утра."