[translation]
10052-100520010 = "Здравствуйте, Сенсей."
10052-100520020 = "В этот раз я назначена дежурным по Шале. Меня зовут Ушио Ноа."
10052-100520030 = "Поскольку это моё первое дежурство, позвольте представиться."
10052-100520040 = "Взаимно, добро пожаловать!"
10052-100520050 = "Это моё первое дежурство в Шале, так что..."
10052-100520060 = "Есть ли что-то, что нужно подготовить заранее?"
10052-100520070 = "Особенно ничего."
10052-100520080 = "Относитесь к этому как к приходу в гости, приходите без напряжения."
10052-100520090 = "Как в гости..."
10052-100520100 = "Поняла."
10052-100520110 = "Тогда в день дежурства буду рассчитывать на вас."
10052-100520120 = "Сенсей, во время вчерашнего дежурства..."
10052-100520130 = "вы ведь были в новых туфлях?"
10052-100520140 = "Откуда вы знаете?"
10052-100520150 = "Те же бренд и модель, что и раньше..."
10052-100520160 = "Хе-хе, я так и знала."
10052-100520170 = "На носках не было тех царапин, что обычно."
10052-100520180 = "Туфли были довольно старые, к тому же заводские, поэтому купить новые — хороший выбор, чем отдавать в ремонт."
10052-100520190 = "Вы как детектив."
10052-100520200 = "Наверное..."
10052-100520210 = "Если подумать, работа детектива и секретаря во многом схожи."
10052-100520220 = "Я во время дежурства тоже слежу за вами, как детектив за преступником."
10052-100520230 = "Страшно...!"
10052-100520240 = "Когда я смотрю на изобретения студентов Миллениума, я часто поражаюсь."
10052-100520250 = "Они предлагают такие новые технологии и идеи, которые мне бы и в голову не пришли."
10052-100520260 = "Каждый раз я спрашиваю себя, способствую ли я ценности Миллениума."
10052-100520270 = "Я думаю, вы, Ной, и так стараетесь."
10052-100520280 = "Но, если говорить жестоко, старания и превосходство — это разные вещи."
10052-100520290 = "У меня нет озарений и творческих способностей, как у других гениев, нет и ловкого мастерства."
10052-100520300 = "Из того, что можно назвать моим достоинством..."
10052-100520310 = "...разве что я могу запомнить целые чертежи, необходимые для создания механизмов."
10052-100520320 = "Это уже достаточно впечатляющий навык..."
10052-100520330 = "Сенсей, у меня плохие новости."
10052-100520340 = "Та заявка на патент на «устройство для сбора данных о вашем поведении и предсказания вашего местоположения», о котором я говорила..."
10052-100520350 = "к сожалению, была отклонена из-за возражений со стороны Федерального студенческого совета."
10052-100520360 = "Естественно!"
10052-100520370 = "Такой патент нельзя было допускать."
10052-100520380 = "Но патент можно подать повторно, изменив цель."
10052-100520390 = "Если менять форму и подавать снова и снова..."
10052-100520400 = "может, однажды его действительно зарегистрируют...?"
10052-100520410 = "Пожалуйста, прекратите!"
10052-100520420 = "Сенсей, регулярная встреча, запланированная на сегодняшний день после обеда, отменена."
10052-100520430 = "Во время проверки монорельса из-за внезапного дождя повредилась часть рельсов."
10052-100520440 = "Поэтому некоторые члены застряли в академии."
10052-100520450 = "Чтобы вы не пришли зря, я сообщаю заранее."
