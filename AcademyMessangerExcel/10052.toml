[translation]
10052-100520010 = "Olá, Sensei."
10052-100520020 = "Sou Ushio Noa, e fui encarregada de assumir o plantão na Schale desta vez."
10052-100520030 = "Como será o meu primeiro plantão, resolvi mandar mensagem para cumprimentá-lo."
10052-100520040 = "Eu é que agradeço, conto com você!"
10052-100520050 = "Como é a minha primeira vez de plantão na Schale..."
10052-100520060 = "há alguma coisa que eu deva preparar com antecedência?"
10052-100520070 = "Nada em especial."
10052-100520080 = "Pode vir tranquila, como se estivesse vindo passear."
10052-100520090 = "Como se estivesse indo passear..."
10052-100520100 = "Compreendo."
10052-100520110 = "Bem, conto com você no dia, então."
10052-100520120 = "Sensei, durante o plantão de ontem..."
10052-100520130 = "você estava usando sapatos novinhos em folha, não estava?"
10052-100520140 = "Como você percebeu?"
10052-100520150 = "Eram da mesma marca e do mesmo modelo que o anterior..."
10052-100520160 = "Fufu, então era isso mesmo."
10052-100520170 = "É que não tinham aquele arranhão de sempre na ponta."
10052-100520180 = "Os antigos já estavam bem gastos e, como são sapatos fabricados em série, acho uma ótima escolha\ncomprar um par novo em vez de mandar para o conserto."
10052-100520190 = "Você parece até uma detetive."
10052-100520200 = "De fato..."
10052-100520210 = "Parando para pensar, o trabalho de um detetive e o de uma secretária podem ter pontos em comum."
10052-100520220 = "Afinal, durante o plantão, eu também observo cada detalhe seu bem de perto, Sensei, igualzinho a um detetive vigiando um suspeito."
10052-100520230 = "Que medo...!"
10052-100520240 = "Observando as invenções criadas pelas alunas da Millennium, muitas vezes fico impressionada."
10052-100520250 = "Elas apresentam tecnologias e ideias inovadoras que jamais passariam pela minha cabeça."
10052-100520260 = "Toda vez que vejo isso, me pego refletindo se estou mesmo conseguindo contribuir para o valor da Millennium."
10052-100520270 = "Eu acho que você já faz um trabalho incrível, Noa."
10052-100520280 = "Pode soar cruel, mas esforçar-se e ser excelente são coisas diferentes."
10052-100520290 = "Eu não tenho a inspiração genial, a criatividade nem a habilidade artesanal das outras."
10052-100520300 = "Em comparação, a única qualidade da qual posso me gabar..."
10052-100520310 = "...é conseguir memorizar inteirinhos os projetos necessários para a fabricação de máquinas... e olhe lá."
10052-100520320 = "Mas essa já é uma habilidade absurda de incrível..."
10052-100520330 = "Sensei, trago más notícias."
10052-100520340 = "Lembra daquele pedido de patente que comentei outro dia, do \"dispositivo que coleta os padrões de comportamento do Sensei para prever sua localização atual\"...?"
10052-100520350 = "Infelizmente, foi barrado e devolvido devido a uma objeção do Conselho Estudantil Geral."
10052-100520360 = "Mas é claro!"
10052-100520370 = "Uma patente dessas jamais poderia ser aprovada!"
10052-100520380 = "Contudo, quando se trata de patentes, é possível alterar a finalidade declarada e submeter o mesmo projeto novamente."
10052-100520390 = "Se eu continuar alterando o formulário e submetendo o pedido repetidas vezes..."
10052-100520400 = "quem sabe um dia eu não consiga registrar a patente de verdade...?"
10052-100520410 = "Por favor, desiste disso logo...!"
10052-100520420 = "Sensei, a reunião periódica que estava agendada para hoje à tarde foi adiada."
10052-100520430 = "Parece que, durante a inspeção do monotrilho, uma pancada de chuva repentina acabou danificando parte dos trilhos..."
10052-100520440 = "Por conta disso, algumas integrantes ficaram retidas na academia."
10052-100520450 = "Seria chato fazer você dar viagem perdida, então resolvi avisar com antecedência."
