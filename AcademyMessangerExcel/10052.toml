[translation]
10052-100520010 = "Здравствуйте, Сенсей."
10052-100520020 = "Меня зовут Усио Ноа, я из Миллениума. Меня назначили помогать тебе."
10052-100520030 = "Я хотела представиться до начала своих обязанностей."
10052-100520040 = "Надеюсь на плодотворную работу!"
10052-100520050 = "Для меня это будет впервые..."
10052-100520060 = "Нужно ли мне заранее что-нибудь подготовить?"
10052-100520070 = "Не нужно утруждать себя подготовкой."
10052-100520080 = "Сначала приходи, а дальше разберёшься по ходу. Главное — настройся получить удовольствие."
10052-100520090 = "Получить удовольствие..."
10052-100520100 = "Поняла."
10052-100520110 = "Тогда увидимся по расписанию."
10052-100520120 = "Сенсей, вчера во время работы..."
10052-100520130 = "На тебе были новые туфли?"
10052-100520140 = "Как ты вообще это заметила?"
10052-100520150 = "Они точно такие же, как те, что я всегда ношу, просто новые..."
10052-100520160 = "А, значит, я была права."
10052-100520170 = "На носках не было ни одной потёртости. Правда была прямо перед глазами."
10052-100520180 = "Твои прежние туфли были старыми и изношенными, и заменить их гораздо эффективнее, чем восстанавливать."
10052-100520190 = "Ты секретарь или детектив?"
10052-100520200 = "Ну..."
10052-100520210 = "Если подумать логически, и детективы, и секретари полагаются на неизменную преданность вниманию к деталям."
10052-100520220 = "Например, я всегда очень внимательно наблюдаю за тобой... словно детектив, идущий по следу преступника."
10052-100520230 = "Почему преступника?!"
10052-100520240 = "Изобретательность студентов Миллениума не перестаёт меня впечатлять."
10052-100520250 = "Технологии и идеи, которые они создают, превосходят воображение."
10052-100520260 = "Я невольно начинаю задумываться и даже сомневаться в собственном вкладе в Миллениум."
10052-100520270 = "Но ты ведь так усердно работаешь!"
10052-100520280 = "Жестокая реальность в том, что усердный работник и продуктивный работник — не одно и то же."
10052-100520290 = "В Миллениуме полно продуктивных людей, переполненных искрящейся креативностью и потрясающими талантами."
10052-100520300 = "А что есть у меня? Только бесполезные навыки..."
10052-100520310 = "...Например, способность идеально запомнить целый инженерный чертёж, взглянув на него один раз."
10052-100520320 = "...Если ты собираешься выбросить этот навык, можно мне?"
10052-100520330 = "Сенсей, у меня плохие новости."
10052-100520340 = "Патентная заявка на «Устройство для поиска Сенсея, отслеживающее каждое его движение и мысль»..."
10052-100520350 = "к сожалению, была отклонена из-за возражений Генерального студенческого совета."
10052-100520360 = "Естественно!"
10052-100520370 = "Кто вообще одобрит такой патент?!"
10052-100520380 = "Узнаем, когда они подадут заявку снова, изменив цель патента."
10052-100520390 = "Если продолжать её менять, можно подавать снова и снова..."
10052-100520400 = "И, возможно, в более удачный день, перед более открытым советом патент примут?"
10052-100520410 = "Удачный для кого?!"
10052-100520420 = "Сенсей, сегодняшнее плановое собрание во второй половине дня отменено."
10052-100520430 = "Похоже, внезапный дождь во время обслуживания монорельса привёл к повреждениям."
10052-100520440 = "Из-за этого многие застряли в академии."
10052-100520450 = "Сообщаю заранее, чтобы ты не пришёл зря."
