[translation]
20028-200280010 = "Sensei."
20028-200280020 = "Você teria um tempinho agora?"
20028-200280030 = "Hum, é que... tem uma coisa me deixando preocupada..."
20028-200280040 = "Não é nada tão grave assim, mas..."
20028-200280050 = "É um assunto bem pessoal..."
20028-200280060 = "Entendi, já estou indo praí."
20028-200280070 = "Ah."
20028-200280080 = "Muito obrigada."
20028-200280090 = "Estarei esperando por você, então!"
20028-200280100 = "Sensei..."
20028-200280110 = "Peço mil desculpas..."
20028-200280120 = "Fui eu quem chamou você, e mesmo assim acabei pegando no sono sozinha..."
20028-200280130 = "Eu nem sei como pedir desculpas por isso..."
20028-200280140 = "Se deu para você descansar um pouco, Hinata, já fico feliz."
20028-200280150 = "Para falar a verdade, eu também acabei cochilando um pouquinho."
20028-200280160 = "S-Sério mesmo...?"
20028-200280170 = "Hum..."
20028-200280180 = "Muito obrigada, Sensei."
20028-200280190 = "Sensei."
20028-200280200 = "Tem mais alguma bagagem que você trouxe?"
20028-200280210 = "Estou juntando as coisas aqui perto da base."
20028-200280220 = "Se tiver mais alguma coisa, pode deixar que eu levo tudo junto."
20028-200280230 = "Não posso deixar você carregando tudo sozinha, Hinata..."
20028-200280240 = "Eu te ajudo."
20028-200280250 = "Ah."
20028-200280260 = "Não, imagina, está tudo bem!"
20028-200280270 = "Não falei com essa intenção..."
20028-200280280 = "E-Então não tem mais nenhuma bagagem, certo?!"
20028-200280290 = "Com licença, já vou indo!"
20028-200280300 = "Hum..."
20028-200280310 = "Sensei."
20028-200280320 = "Se não for incomodar..."
20028-200280330 = "Eu tenho..."
20028-200280340 = "Um favor para te pedir..."
20028-200280350 = "O que houve?"
20028-200280360 = "Que tipo de favor...?"
20028-200280370 = "Bom..."
20028-200280380 = "É que..."
20028-200280390 = "Explicar por mensagem assim dá um pouco de vergonha, então..."
20028-200280400 = "Podemos nos encontrar a sós?"
20028-200280410 = "Hum..."
20028-200280420 = "Sensei."
20028-200280430 = "Sinto muito mesmo pelo que aconteceu hoje..."
20028-200280440 = "Não se preocupe, vamos praticando aos poucos."
20028-200280450 = "Na próxima vez vai dar tudo certo, com certeza!"
20028-200280460 = "Sim..."
20028-200280470 = "Tomara que sim."
20028-200280480 = "Então, aceitando a sua gentileza..."
20028-200280490 = "Sensei."
20028-200280500 = "Conto com a sua ajuda na próxima vez também!"
