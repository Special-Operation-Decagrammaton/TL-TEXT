[translation]
20024-200240010 = "Давно не виделись, Сенсей."
20024-200240020 = "Надеюсь, это сообщение застанет тебя в добром здравии."
20024-200240030 = "Давно не общались, Нагиса."
20024-200240040 = "Сегодня я пишу тебе по одной причине."
20024-200240050 = "Я хотела бы обсудить с тобой вопрос, касающийся студентов Тринити."
20024-200240060 = "Ничего слишком серьёзного. Пожалуйста, не переживай. Может, заодно насладимся чаем и едой во время разговора?"
20024-200240070 = "Да, конечно."
20024-200240080 = "Хорошо. Я выберу подходящий чёрный чай."
20024-200240090 = "Сегодня очень жарко. Пожалуйста, будь осторожен и избегай солнца."
20024-200240100 = "Надеюсь, ты простишь мой внезапный уход, Сенсей."
20024-200240110 = "Боюсь, мне внезапно стало плохо."
20024-200240120 = "Не переживай."
20024-200240130 = "Прости. Может, дело в том чёрном чае, который я выбрала?"
20024-200240140 = "Мне очень жаль..."
20024-200240150 = "Не стоит. Это был уникальный опыт."
20024-200240160 = "Но в следующий раз я буду осторожнее с количеством."
20024-200240170 = "Снова здравствуй, Сенсей."
20024-200240180 = "Надеюсь, это сообщение застанет тебя в добром здравии."
20024-200240190 = "Как вы себя чувствуете?"
20024-200240200 = "О, ты всё ещё переживаешь из-за прошлого раза?"
20024-200240210 = "Пожалуйста, не надо. Всё было не так уж плохо."
20024-200240220 = "Кстати о другом: не мог бы ты заглянуть в комнату Чайной партии, когда будет свободная минутка?"
20024-200240230 = "В прошлый раз я не успела рассказать конец истории. Хотела бы продолжить."
20024-200240240 = "На этот раз у меня есть особенно прекрасная смесь чёрного чая, которую я хотела бы заварить для тебя."
20024-200240250 = "Звучит хорошо. Я тоже принесу свой любимый чёрный чай!"
20024-200240260 = "Разумеется. Только не в пластиковой бутылке."
20024-200240270 = "Я... надеюсь, это сообщение застанет тебя в добром здравии."
20024-200240280 = "Эм..."
20024-200240290 = "Насчёт нашего прошлого разговора... Я должна извиниться. Я потеряла самообладание."
20024-200240300 = "Не переживай! Ничего страшного."
20024-200240310 = "Спасибо. Однако как одна из лидеров Тринити я должна требовать от себя большего."
20024-200240320 = "Если позволишь, дай мне возможность исправить ошибки."
20024-200240330 = "Как раз должны доставить новые чайные листья, которые я заказала."
20024-200240340 = "Не хочешь попробовать их вместе?"
20024-200240350 = "Конечно."
20024-200240360 = "Я буду ждать на обычном месте."
20024-200240370 = "Доброе утро, Сенсей."
20024-200240380 = "Ты позавтракал перед работой?"
20024-200240390 = "Да. А ты, Нагиса?"
20024-200240400 = "Да. Недавно я ела мисо-суп."
20024-200240410 = "...Не ожидал."
20024-200240420 = "Я думал, студенты Чайной партии едят выпечку три раза в день."
20024-200240430 = "Это просто невозможно."
20024-200240440 = "Нам нравятся сладости на собраниях, но есть только их было бы вредно."
20024-200240450 = "Я уж точно не питаюсь одними тортами и печеньем."
