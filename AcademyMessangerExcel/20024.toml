[translation]
20024-200240010 = "Давно не виделись."
20024-200240020 = "Как ваши дела, Сенсей?"
20024-200240030 = "Нагиса, давно не виделись."
20024-200240040 = "Да, действительно давно."
20024-200240050 = "На самом деле, я хотела бы посоветоваться с вами по поводу студентов Тринити."
20024-200240060 = "Это не слишком серьёзно, так что мы могли бы обсудить это за чаем. Как вам?"
20024-200240070 = "А, звучит хорошо. С удовольствием."
20024-200240080 = "Хе-хе"
20024-200240090 = "Тогда я приготовлю хороший чай и буду ждать вас."
20024-200240100 = "Прошу прощения, что мне пришлось уйти, Сенсей."
20024-200240110 = "Мне вдруг стало плохо... Простите, я не слежу за своим здоровьем."
20024-200240120 = "Всё в порядке, не переживай."
20024-200240130 = "Чай в бутылке, наверное, не очень понравился?"
20024-200240140 = "Извини, что заставил тебя пить."
20024-200240150 = "Нет, это был очень интересный опыт. Спасибо вам..."
20024-200240160 = "Но, возможно, в следующий раз мне стоит лучше контролировать количество выпитого..."
20024-200240170 = "...Прошу прощения за прошлый раз."
20024-200240180 = "Как ваши дела в последнее время?"
20024-200240190 = "Тогда ты в порядке?"
20024-200240200 = "А, о прошлом разе..."
20024-200240210 = "Всё в порядке. Я не так уж серьёзно заболела."
20024-200240220 = "Кстати, я не успела кое-что сказать в прошлый раз. Если можно, не могли бы вы уделить мне время?"
20024-200240230 = "Можете прийти на террасу, когда будет удобно."
20024-200240240 = "И я снова приготовлю чай."
20024-200240250 = "Хорошо, договорились. А мне взять с собой тот прошлый чай?"
20024-200240260 = "Эм, не нужно. Я уже достаточно насладилась им в прошлый раз..."
20024-200240270 = "...Как ваши дела?"
20024-200240280 = "В прошлый раз я показалась вам в неприглядном виде..."
20024-200240290 = "Но хочу заверить, что обычно я так себя не веду..."
20024-200240300 = "Не переживай."
20024-200240310 = "Даже если вы так говорите... как организатор чаепития, я не могу оставить свою оплошность без внимания."
20024-200240320 = "...Если можно, позвольте мне пригласить вас снова в качестве извинения?"
20024-200240330 = "Как раз скоро прибудет новый заказ чая."
20024-200240340 = "Позвольте угостить вас, если вам будет удобно."
20024-200240350 = "Тогда я с удовольствием составлю тебе компанию."
20024-200240360 = "Спасибо. Тогда буду ждать вас на террасе."
20024-200240370 = "Доброе утро, Сенсей."
20024-200240380 = "Говорят, день начинается с завтрака... Вы уже поели?"
20024-200240390 = "Да, только что. А ты?"
20024-200240400 = "Я только что выпила мисо-суп."
20024-200240410 = "...Это немного неожиданно."
20024-200240420 = "У меня всегда было представление, что на чаепитиях едят только сладости..."
20024-200240430 = "Что вы говорите..."
20024-200240440 = "Нельзя же питаться одними сладостями, это нарушит баланс."
20024-200240450 = "Мы не едим только торты и печенье."