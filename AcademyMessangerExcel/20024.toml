[translation]
20024-200240010 = "Há quanto tempo não nos falamos."
20024-200240020 = "Como tem passado, Sensei?"
20024-200240030 = "Nagisa, quanto tempo."
20024-200240040 = "Sim, já faz um bom tempo mesmo."
20024-200240050 = "Na verdade, há um assunto sobre as alunas da Trinity que eu gostaria de consultar com você."
20024-200240060 = "Como não é nada muito grave, pensei que poderíamos conversar enquanto tomamos um chá da tarde juntos. O que acha?"
20024-200240070 = "Ah, parece ótimo. Adoraria."
20024-200240080 = "Hehe."
20024-200240090 = "Então deixarei excelentes folhas de chá preparadas à sua espera."
20024-200240100 = "Peço mil desculpas por ter me retirado mais cedo hoje, Sensei."
20024-200240110 = "Acabei passando mal de repente... Sinto muito por não ter cuidado melhor da minha saúde."
20024-200240120 = "Está tudo bem, não se preocupe com isso."
20024-200240130 = "Será que aquele chá preto de garrafinha não caiu bem?"
20024-200240140 = "Desculpe por ter insistido para você experimentar..."
20024-200240150 = "Imagina, foi uma experiência deveras interessante. Muito obrigada..."
20024-200240160 = "Contudo, da próxima vez acho que será melhor eu moderar um pouco na quantidade..."
20024-200240170 = "...Peço desculpas pelo ocorrido no outro dia."
20024-200240180 = "Como você tem passado ultimamente?"
20024-200240190 = "Você está se sentindo melhor desde aquele dia?"
20024-200240200 = "Ah, se está falando daquilo..."
20024-200240210 = "Estou bem, sim. Não chegou a ser nenhum problema grave de saúde."
20024-200240220 = "Por sinal, acabou ficando um assunto pendente da nossa última conversa. Se possível, você poderia me conceder um pouco do seu tempo?"
20024-200240230 = "Pode ser quando estiver livre. Ficaria feliz se pudesse vir até o terraço."
20024-200240240 = "Deixarei o chá preparado novamente."
20024-200240250 = "Claro, combinado. Quer que eu leve aquele chá do outro dia também?"
20024-200240260 = "Hum, não será necessário, obrigada. Já pude apreciá-lo suficientemente da última vez..."
20024-200240270 = "...Como tem passado, Sensei?"
20024-200240280 = "No outro dia, acabei mostrando um lado bastante lamentável meu..."
20024-200240290 = "Gostaria de reiterar que, hum, eu jamais costumo agir ou falar daquela maneira normalmente..."
20024-200240300 = "Não esquenta com isso."
20024-200240310 = "Mesmo que você diga isso... Como membro da Tea Party, não posso simplesmente ignorar tamanho deslize."
20024-200240320 = "...Se não for incomodar, como forma de pedir desculpas, você poderia me conceder mais um pouco do seu tempo?"
20024-200240330 = "As novas folhas de chá que encomendei estão prestes a chegar."
20024-200240340 = "Permita-me servi-las a você. Se a sua agenda permitir, é claro."
20024-200240350 = "Nesse caso, vou aceitar o convite com prazer."
20024-200240360 = "Muito obrigada. Estarei esperando por você no terraço, então."
20024-200240370 = "Bom dia, Sensei."
20024-200240380 = "Dizem que um bom dia começa pelo café da manhã... Você já tomou o seu hoje, Sensei?"
20024-200240390 = "Sim, acabei de comer. E você, Nagisa?"
20024-200240400 = "Eu tomei uma sopa de missô agora há pouco."
20024-200240410 = "...Confesso que estou um pouco surpreso."
20024-200240420 = "Eu tinha a impressão de que o pessoal da Tea Party só comia doces..."
20024-200240430 = "Mas o que você está dizendo...?"
20024-200240440 = "Por mais que gostemos de doces, comer apenas açúcar o tempo todo faria muito mal ao equilíbrio nutricional."
20024-200240450 = "Nem mesmo nós vivemos apenas à base de bolos e confeitaria todos os dias."
