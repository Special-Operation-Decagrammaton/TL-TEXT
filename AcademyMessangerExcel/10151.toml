[translation]
10151-101510010 = "Olá, Sensei"
10151-101510020 = "Aqui é a Niki Anna, representante de turma da Classe Especial Nº 183"
10151-101510030 = "Você se lembra de mim?"
10151-101510040 = "Membro ativa titular da Academia e Inventora Honorária da Federação..."
10151-101510050 = "Olá, Anna!"
10151-101510060 = "Claro que eu lembro!"
10151-101510070 = "Muito obrigada!"
10151-101510080 = "Na verdade, encontrei um artigo científico muito interessante"
10151-101510090 = "Dizem que os filhotes de cachorro aprendem sobre a dor"
10151-101510100 = "enquanto brincam de dar mordidinhas leves uns nos outros"
10151-101510110 = "E parece que se não fizerem isso, acabam se tornando agressivos!"
10151-101510120 = "Ou seja, é um processo importante de socialização"
10151-101510130 = "Realmente, bem interessante!"
10151-101510140 = "Também tem várias fotos de filhotinhos, é uma fofura só"
10151-101510150 = "Quer ler comigo?"
10151-101510160 = "Sensei, muito obrigada pela sua cooperação!"
10151-101510170 = "Graças a você, consegui reunir dados de pesquisa suficientes"
10151-101510180 = "Sinto que finalmente comecei a entender como dosar a minha força"
10151-101510190 = "Agradeço por tirar um tempinho para mim mesmo estando tão ocupado"
10151-101510200 = "Que orgulho de ver você se esforçando pelas amigas, Anna!"
10151-101510210 = "É o meu dever como Sensei!"
10151-101510220 = "N-Não é pelas amigas!"
10151-101510230 = "É só porque se eu machucar alguém, vai ser uma violação das regras..."
10151-101510240 = "Mas..."
10151-101510250 = "Muito obrigada pelas palavras gentis"
10151-101510260 = "Até mais!"
10151-101510270 = "Olá, aqui é a Niki Anna"
10151-101510280 = "Sensei, você está sozinho agora?"
10151-101510290 = "Olá! Sim, estou sozinho"
10151-101510300 = "Então, por favor, continue lendo isto sozinho"
10151-101510310 = "Na verdade, acabei fazendo uma invenção gigantesca e inacreditável..."
10151-101510320 = "Posso pedir para você fazer uma revisão por pares?"
10151-101510330 = "Se eu puder ser útil em algo, é claro!"
10151-101510340 = "Você me salva! Então te espero na Classe Nº 183"
10151-101510350 = "Não conte para absolutamente ninguém, viu?!"
10151-101510360 = "Sensei..."
10151-101510370 = "Conseguiu se acalmar um pouco?"
10151-101510380 = "Sim... muito obrigada"
10151-101510390 = "Eu não tenho claustrofobia nem nada, mas"
10151-101510400 = "Só de pensar que talvez nunca mais pudesse te ver, Sensei, fiquei com tanto medo..."
10151-101510410 = "Mas foi uma baita invenção!"
10151-101510420 = "Não, na verdade, conforme continuei fazendo testes..."
10151-101510430 = "Descobri que ele não derrete, mas acaba quebrando quando a umidade está baixa"
10151-101510440 = "Por isso, não vai dar para usar na ampliação da enfermaria..."
10151-101510450 = "É uma pena, mas acho que vou pensar em outra coisa"
10151-101510460 = "Anima esse rosto! Eu também vou te ajudar!"
10151-101510470 = "É admirável que você não desista de tentar ajudar as pessoas!"
10151-101510480 = "Muito obrigada, Sensei!"
10151-101510490 = "Para construir estruturas temporárias não há problema nenhum, então"
10151-101510500 = "Acho que o Annacreto ainda vai poder ser útil em algum lugar"
10151-101510510 = "Ehehe!"
10151-101510520 = "Sensei, aqui é a Niki Anna"
10151-101510530 = "É um assunto que não tem relação com o trabalho, mas..."
10151-101510540 = "Você já fez uma festa de churrasco alguma vez?"
10151-101510550 = "Sim!"
10151-101510560 = "Não, nunca fiz!"
10151-101510570 = "Na verdade, me deu muita vontade de fazer um churrasco"
10151-101510580 = "Gostaria de participar comigo?"
10151-101510590 = "Com certeza, vamos sim!"
10151-101510600 = "Que bom! Então nos vemos na Nº 183"
10151-101510610 = "Sensei, sobre aquilo de antes..."
10151-101510620 = "Por favor, não entenda de um jeito estranho!"
10151-101510630 = "É só que quando você me elogia, eu acabo ficando mal-acostumada..."
10151-101510640 = "E corro o risco de ficar mimada, só isso!"
10151-101510650 = "É capaz de eu acabar dependendo de você para tudo, Sensei!"
10151-101510660 = "E não pode ser assim, né?"
10151-101510670 = "Eu não tinha pensado nada de estranho, mas..."
10151-101510680 = "Minhas alunas podem depender de mim o quanto quiserem"
10151-101510690 = "Anna? "
10151-101510700 = "Sensei, gostaria de lhe fazer uma pergunta"
10151-101510710 = "Eu queria solicitar a cooperação da Schale para uma tarefa, mas"
10151-101510720 = "não sei a qual setor devo recorrer..."
10151-101510730 = "Para começo de conversa, será que eu posso mesmo fazer essa solicitação?"
10151-101510740 = "E mesmo que eu possa, com quem eu deveria..."
10151-101510750 = "Ah..."
10151-101510760 = "Anna?"
10151-101510770 = "Me desculpe, Sensei. Ainda não estou acostumada a fazer comunicados formais..."
10151-101510780 = "Acho que acabei ficando nervosa demais"
10151-101510790 = "Eu gostaria de pedir a sua colaboração, Sensei, mas"
10151-101510800 = "sobre onde eu deveria pedir isso para o Sensei,"
10151-101510810 = "será que tudo bem eu perguntar diretamente ao Sensei?"
10151-101510820 = "Uaaaah... que desastre..."
10151-101510830 = "Comunicação formal é difícil mesmo, né"
10151-101510840 = "Não se preocupe. Eu ajudo no que precisar!"
10151-101510850 = "Muito obrigada..."
10151-101510860 = "Muito obrigada por me ajudar a arrumar os materiais!"
10151-101510870 = "Graças a você, ficou tudo super organizado"
10151-101510880 = "...De verdade, em vários sentidos"
10151-101510890 = "Ficou tão limpo que nem parece o mesmo lugar, dá até dó de colocar materiais novos"
10151-101510900 = "Vamos continuar trazendo cada vez mais coisas novas!"
10151-101510910 = "Tenho certeza de que todas vão ser muito divertidas!"
10151-101510920 = "Ah"
10151-101510930 = "Sim!"
10151-101510940 = "Você tem toda razão!"
10151-101510950 = "Conto com você daqui para frente também, Sensei!"
