[translation]
10151-101510010 = "Здравствуйте, Сенсей."
10151-101510020 = "Я Анна Ники, староста класса № 183."
10151-101510030 = "Вы меня помните?"
10151-101510040 = "Главный активист Академии и федеральный почётный изобретатель..."
10151-101510050 = "Здравствуйте, Анна!"
10151-101510060 = "Конечно, я вас помню!"
10151-101510070 = "Спасибо!"
10151-101510080 = "На самом деле, у меня есть интересная статья, которой я хочу поделиться."
10151-101510090 = "Щенки играют, игриво покусывая друг друга",
10151-101510100 = "и, по-видимому, так они учатся понимать, что такое боль",
10151-101510110 = "иначе они стали бы агрессивными!"
10151-101510120 = "так что это процесс ранней социализации"
10151-101510130 = "это, безусловно, интересно!"
10151-101510140 = "там также много милых фотографий щенков"
10151-101510150 = "Почему бы вам не почитать это вместе?"
10151-101510160 = "Спасибо за сотрудничество, Сенсей!"
10151-101510170 = "Благодаря вам у нас достаточно данных для исследований"
10151-101510180 = "Мне кажется, я начинаю понимать, сколько сил нужно приложить."
10151-101510190 = "Спасибо, что нашли время в плотном графике."
10151-101510200 = "Анна, ты потрясающая, что делаешь это для своего друга!"
10151-101510210 = "Это вполне естественно для Сенсея!"
10151-101510220 = "Это не только для моего друга!"
10151-101510230 = "Если я причиню им боль, это будет против правил..."
10151-101510240 = "Но..."
10151-101510250 = "Спасибо за ваши добрые слова."
10151-101510260 = "До скорой встречи!"
10151-101510270 = "Здравствуйте, это Анна Ники."
10151-101510280 = "Вы сейчас одни, Сенсей?"
10151-101510290 = "Здравствуйте! Да, я один."
10151-101510300 = "Сегодня, пожалуйста, продолжайте читать самостоятельно."
10151-101510310 = "На самом деле, я сделал невероятное изобретение..."
10151-101510320 = "Могу я попросить вас провести рецензирование?"
10151-101510330 = "Конечно, если я могу чем-то помочь!"
10151-101510340 = "Это было бы очень полезно! Увидимся в 183-м классе."
10151-101510350 = "Конечно! Никому не говорите!"
10151-101510360 = "Сенсей..."
10151-101510370 = "Вам так немного спокойнее?"
10151-101510380 = "Да... спасибо."
10151-101510390 = "У меня нет клаустрофобии, но..."
10151-101510400 = "Я боялся, что больше не смогу тебя видеть..."
10151-101510410 = "Но это было великолепное изобретение!"
10151-101510420 = "Нет, на самом деле, продолжая исследование..."
10151-101510430 = "Я ручаюсь, что он не плавится, а при низкой влажности — застывает."
10151-101510440 = "Значит, его нельзя использовать для пристройки помещения..."
10151-101510450 = "К сожалению, придётся думать о другом."
10151-101510460 = "Не унывай! Я ведь тоже помог!"
10151-101510470 = "Здорово, что ты, не сдаваясь, пытаешься поддерживать людей!"
10151-101510480 = "Спасибо, Сенсей!"
10151-101510490 = "Нет проблем со строительством временных сооружений."
10151-101510500 = "Думаю, Аннакрит может пригодиться где-нибудь."
10151-101510510 = "Хе-хе!"
10151-101510520 = "Сенсей, это Анна Ники."
10151-101510530 = "Это не имеет отношения к работе, но..."
10151-101510540 = "Вы когда-нибудь устраивали вечеринку с барбекю?"
10151-101510550 = "Да!"
10151-101510560 = "Нет, никогда!"
10151-101510570 = "На самом деле, я давно хотел устроить вечеринку с барбекю."
10151-101510580 = "Хотите присоединиться?"
10151-101510590 = "Конечно!"
10151-101510600 = "Отлично! Увидимся в 183-м классе."
10151-101510610 = "Сенсей, примерно в это время..."
10151-101510620 = "Пожалуйста, не поймите меня неправильно!"
10151-101510630 = "Когда меня хвалят, я могу увлечься..."
10151-101510640 = "Я могу стать избалованным!"
10151-101510650 = "Я могу стать полностью зависимым от Сенсея!"
10151-101510660 = "Это нехорошо, правда?"
10151-101510670 = "Я не думал, что в этом есть что-то странное, но..."
10151-101510680 = "Это нормально быть избалованным, если ты ученик."
10151-101510690 = "Анна?"
10151-101510700 = "Сенсей, я хотел бы кое-что спросить."
10151-101510710 = "Я хотел бы узнать, может ли Шале помочь мне с заданием."
10151-101510720 = "Что-то не так...?"
10151-101510730 = "Во-первых, можно ли вообще обратиться за помощью?"
10151-101510740 = "Кроме того, даже если я обращусь, куда мне обратиться...?"
10151-101510750 = "Ах..."
10151-101510760 = "Анна?"
10151-101510770 = "Прошу прощения, Сенсей. Я всё ещё не привык к деловому общению..."
10151-101510780 = "Кажется, я нервничаю."
10151-101510790 = "Я хотел бы попросить вас, Сенсей."
10151-101510800 = "Куда мне обратиться с этой просьбой, Сенсей?"
10151-101510810 = "Могу ли я задать вопрос вам, Сенсей?"
10151-101510820 = "Ах... Не подходит..."
10151-101510830 = "Деловое общение — это сложно, не так ли?"
10151-101510840 = "Не волнуйтесь. Я помогу вам во всём!"
10151-101510850 = "Спасибо..."
10151-101510860 = "Спасибо за помощь в организации документов!"
10151-101510870 = "Благодаря вам я смог всё аккуратно организовать."
10151-101510880 = "...Действительно, во многих отношениях."
10151-101510890 = "Теперь всё намного чище, я даже боюсь записывать ещё документы."
10151-101510900 = "Давайте продолжать добавлять что-нибудь новое!"
10151-101510910 = "Уверен, всё это будет весело!"
10151-101510920 = "О!"
10151-101510930 = "Да!"
10151-101510940 = "Это правда, вы правы!"
10151-101510950 = "С нетерпением жду возможности поработать с вами в будущем, Сенсей!"