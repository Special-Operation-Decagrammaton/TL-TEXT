[translation]
13008-234 = "Сенсей!"
13008-235 = "Сенсей!!!!"
13008-236 = "У вас есть время? Есть же?? Отлично!"
13008-237 = "А? Что?"
13008-238 = "Вы же всё равно свободны? Тогда работайте со мной!"
13008-239 = "Просто помогайте мне, ОК?"
13008-240 = "Тогда до встречи!"
13008-241 = "Эм... Что...?"
13008-242 = "Серика...?"
13008-243 = "Сенсей, у меня появилась ещё одна подработка, так что встретимся в том же месте!"
13008-244 = "На этот раз работа немного особенная!"
13008-245 = "Особенная...?"
13008-246 = "Я нашла следующую работу! Вы ведь тоже придёте?"
13008-247 = "Приходите в парк утром в следующие выходные!"
13008-248 = "Ла-а-дно."
13008-249 = "Уу, спина болит..."
13008-250 = "Сенсей, вы в порядке?"
13008-251 = "Я думала, что горячая ванна немного поможет, сейчас..."
13008-252 = "!@#%%#^*"
13008-253 = "@##"
13008-255 = "Опасно, чуть не уронила телефон в ванну...!!"
13008-256 = "Наверное, не стоит брать телефон в ванну..."
13008-257 = "Я положу его снаружи и зайду в ванну, так что до встречи позже."
13008-258 = "Эм..."
13008-259 = "Серика, фото..."
13008-260 = "Фото?"
13008-261 = "Уааааа?! Почему это сфотографировалось!?"
13008-262 = "Н-не смотрите! Не смотрите!"
13008-263 = "Если посмотрите — убью!!!!!!!!"
13008-264 = "Вы же не сохранили!? Удаляйте!! Поняли!?"
13008-265 = "Я потом проверю, точно ли вы удалили!!"
13008-266 = "Я не смотрел..."
13008-267 = "Я удалил, да."
13008-268 = "Я слышала от Аяне, что в комитет поступило анонимное пожертвование."
13008-269 = "Сумма не очень большая, но говорят, хватит на один рабочий день."
13008-270 = "Может, от горожан, которые заботятся о нас? Хе-хе."
13008-271 = "А, в следующий раз встретимся в том же месте, Сенсей!"
13008-272 = "Снова днём!"
13008-273 = "Сенсей, теперь подработка на ночном рынке!"
13008-274 = "Говорят, будем работать до полуночи, так что готовьтесь!"
13008-275 = "Понял, Серика!"
13008-276 = "Может, придётся не спать, понял."
13008-277 = "Я объелась, кажется, переела."
13008-278 = "Городок был маленький, но там было много интересного."
13008-279 = "Ну, хотя он и маленький, но всё же больше нашего..."
13008-280 = "В итоге я потратила почти половину зарплаты, но иногда и это хорошо, правда?"
13008-281 = "Тогда до завтра, Сенсей. Спасибо за работу."
13008-282 = "Может, не стоит сразу ложиться, отдохни как следует."
13008-283 = "Да, спасибо за работу. До встречи."
13008-284 = "Сенсей. Готовьтесь к подработке в следующие выходные."
13008-285 = "Похоже, там будет очень тяжёлый физический труд..."
13008-286 = "Дрожь предвкушения..."
13008-287 = "ОК, я готов."
13008-130080300 = "Сенсей, вы ведь сегодня придёте в Абидос?"
13008-130080310 = "Да, верно."
13008-130080320 = "По пути можно пораниться, так что я думала встретить вас..."
13008-130080330 = "Можно ведь?"
13008-130080340 = "А, я понимаю «всё в порядке» как «можно прийти»."
13008-130080350 = "Значит, у меня нет права голоса..."
13008-130080360 = "Но я рад, спасибо."
13008-130080370 = "Нет, я говорю это потому, что вы действительно можете ввязаться в неприятности."
13008-130080380 = "В последнее время в нашем районе... появились шумные типы..."
13008-130080390 = "Ну, вот так, так что будьте осторожны."
13008-130080400 = "Если что, прячьтесь за мной."