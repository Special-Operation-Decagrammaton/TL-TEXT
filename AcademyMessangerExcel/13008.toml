[translation]
13008-234 = "Sensei!"
13008-235 = "Sensei!!!!"
13008-236 = "Tem tempo agora? Tem, né?? Beleza!"
13008-237 = "Hã, quê?"
13008-238 = "Você está à toa mesmo, não está? Então vem fazer um bico comigo!"
13008-239 = "Só precisa me dar uma mãozinha lá, OK?"
13008-240 = "Então até daqui a pouco!"
13008-241 = "Err... Hãaa...?"
13008-242 = "Senhorita Serika...?"
13008-243 = "Sensei, apareceu outro trabalho de meio período, então nos encontramos no mesmo lugar de antes!"
13008-244 = "Dessa vez é um bico um pouquinho especial!"
13008-245 = "Especial...?"
13008-246 = "Já consegui o próximo bico! Você vem também, né, Sensei?"
13008-247 = "Me encontra no parque na manhã da sua próxima folga!"
13008-248 = "Entendiiiido"
13008-249 = "Uuu, minhas costas estão me matando..."
13008-250 = "Você está inteiro aí, Sensei?"
13008-251 = "Pensei que entrar na banheira quentinha ajudaria a aliviar um pouco, então agora estou"
13008-252 = "!@#%%#^*"
13008-253 = "@##"
13008-255 = "Por pouco! Quase deixei o celular cair dentro da banheira...!!"
13008-256 = "É, acho que mexer no celular na hora do banho não é uma boa ideia..."
13008-257 = "Vou deixar ele lá fora primeiro e tomar meu banho, depois a gente se fala"
13008-258 = "Hum..."
13008-259 = "Serika, você mandou uma foto..."
13008-260 = "Foto?"
13008-261 = "UAAAAAAAH?! Como foi que tirou uma foto dessas?!"
13008-262 = "N-Não olha! Não olhaaa!"
13008-263 = "Se olhar eu te mato!!!!!!!!!!"
13008-264 = "Não me diga que você salvou isso?! Apaga agora!! Ouviu bem?!"
13008-265 = "Depois eu vou conferir pessoalmente se você apagou mesmo!!"
13008-266 = "Não vi nadinha..."
13008-267 = "Já apaguei, sim senhora"
13008-268 = "Ouvi da Ayane-chan que o Comitê de Contramedidas recebeu uma doação anônima"
13008-269 = "O valor não é tão alto assim, mas parece que equivale a um dia inteiro de trabalho de meio período"
13008-270 = "Será que veio de algum cidadão que acompanha o nosso esforço? Ehehe"
13008-271 = "Ah, vamos nos encontrar naquele lugar de sempre dessa vez também, Sensei!"
13008-272 = "Até mais tarde!"
13008-273 = "Sensei, dessa vez o trabalho de meio período é no mercado noturno!"
13008-274 = "Parece que vai até de madrugada, então já vai se preparando!"
13008-275 = "Compreendido perfeitamente, senhorita Serika!"
13008-276 = "Parece que vamos virar a noite, entendido"
13008-277 = "Ufa, tô de barriga cheia! Acho que comi demais"
13008-278 = "Era um bairro pequeno, mas tinha um monte de coisas interessantes, né"
13008-279 = "Quer dizer, pequeno em termos, porque ainda era bem mais movimentado que o nosso distrito..."
13008-280 = "Acabei gastando quase metade do que ganhei no bico, mas de vez em quando não faz mal, né?"
13008-281 = "Bom, até amanhã, Sensei. Obrigada pelo trabalho hoje"
13008-282 = "Melhor não se deitar logo depois de comer, viu? Bom descanso"
13008-283 = "Sim, bom trabalho hoje. Até mais"
13008-284 = "Sensei. Prepare o espírito para o trabalho da próxima folga"
13008-285 = "Porque parece que vai ser um trabalho braçal super pesado..."
13008-286 = "Estou até tremendo de empolgação..."
13008-287 = "OK, vou me preparar"
13008-130080300 = "Sensei, é hoje que você vem para Abydos?"
13008-130080310 = "Sim, isso mesmo"
13008-130080320 = "Seria perigoso se você se machucasse no caminho, então estou pensando em ir te buscar..."
13008-130080330 = "Tudo bem por você, né?"
13008-130080340 = "Ah, vou entender o seu \"tudo bem\" como \"pode vir me buscar\", viu?"
13008-130080350 = "Vejo que não tenho direito de recusar..."
13008-130080360 = "Mas fico muito feliz, obrigado"
13008-130080370 = "Não, estou falando sério, é porque você pode acabar se envolvendo em alguma confusão no caminho, Sensei"
13008-130080380 = "Ultimamente tem aparecido uma galerinha bem barulhenta aqui no nosso distrito autônomo..."
13008-130080390 = "Bom, é por isso, então toma cuidado"
13008-130080400 = "Se acontecer qualquer coisa, se esconda atrás de mim"
