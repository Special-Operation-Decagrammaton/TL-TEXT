[translation]
13008-234 = "Сенсей!"
13008-235 = "Сенсеееей!"
13008-236 = "У вас есть время? Есть же, да?"
13008-237 = "Эм... А?"
13008-238 = "Вы ведь не особо заняты, да? Тогда поработайте со мной на подработке!"
13008-239 = "Мне просто нужен помощник. Вы не против?"
13008-240 = "Тогда скоро увидимся!"
13008-241 = "А? Простите?"
13008-242 = "Серика?"
13008-243 = "Сенсей, у меня снова подработка. Увидимся там?"
13008-244 = "На этот раз она немного особенная!"
13008-245 = "А? Что-то особенное..."
13008-246 = "Ещё одна подработка подтверждена! Вы придёте, Сенсей?"
13008-247 = "Увидимся в парке утром в ваш следующий выходной!"
13008-248 = "Уф. Ладно."
13008-249 = "Я весь день нагибалась. Кажется, спина сейчас сломается..."
13008-250 = "Как ваша спина, Сенсей?"
13008-251 = "Я подумала, что ванна может помочь."
13008-252 = "Так что, ewiks.xc,z"
13008-253 = "ААААААА"
13008-255 = "Я чуть не уронила телефон в ванну!"
13008-256 = "Наверное, брать телефон в ванну было плохой идеей..."
13008-257 = "Увидимся позже, Сенсей."
13008-258 = "О. Эм..."
13008-259 = "Серика. Я, э..."
13008-260 = "А?"
13008-261 = "Ааааа! Откуда у вас эта фотография?"
13008-262 = "Н-Не смотрите! Не смотрите!"
13008-263 = "Я вас убью! Потом проверю ваш телефон!"
13008-264 = "Удалите её! Ясно?"
13008-265 = "Я потом проверю!"
13008-266 = "Я ничего не видел."
13008-267 = "Я не видел. Удалил. Всё нормально."
13008-268 = "Аяне сказала, что в последнее время Комитет Контрмер получает анонимные пожертвования."
13008-269 = "Немного, примерно столько можно заработать за день на подработке."
13008-270 = "Может, это житель, который ценит наши достижения. Хи-хи-хи."
13008-271 = "Увидимся на обычном месте, Сенсей!"
13008-272 = "Сегодня днём, в центре города!"
13008-273 = "На этот раз, Сенсей, это работа помощником на ночном рынке!"
13008-274 = "Обязательно подготовьтесь!"
13008-275 = "Есть!"
13008-276 = "Буду рассчитывать, что работаем всю ночь."
13008-277 = "Я так объелась. Сегодня съела столько всего."
13008-278 = "Городок был маленький, но там было полно всего интересного."
13008-279 = "Хотя, наверное, он всё-таки больше нашего..."
13008-280 = "Сегодня я потратила половину зарплаты на еду... Ну, думаю, иногда можно себе такое позволить. Хи-хи."
13008-281 = "До завтра, Сенсей."
13008-282 = "Надеюсь, у тебя не заболит живот."
13008-283 = "Спи крепко."
13008-284 = "Сенсей, я нашла нам подработку на выходные. Готовьтесь."
13008-285 = "Будет тяжёлая физическая работа..."
13008-286 = "Меня аж трясёт!"
13008-287 = "Но я готов!"
13008-130080300 = "Я слышала, вы собираетесь посетить Абидос, Сенсей."
13008-130080310 = "Таков план."
13008-130080320 = "Лучше я встречу вас, когда приедете. Ради вашей безопасности."
13008-130080330 = "Вы ведь не против?"
13008-130080340 = "Даже если против, я всё равно это сделаю."
13008-130080350 = "Похоже, выбора у меня нет, да?"
13008-130080360 = "Ну, я благодарен. Спасибо."
13008-130080370 = "Это исключительно вопрос вашей безопасности."
13008-130080380 = "В последнее время в нашем районе появились... нарушители спокойствия..."
13008-130080390 = "Нужно быть осторожнее."
13008-130080400 = "Если что-то случится, просто спрячьтесь за мной."
