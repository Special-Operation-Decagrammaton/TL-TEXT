[translation]
20006-200060010 = "Sensei, você tá livre neste fim de semana?"
20006-200060020 = "Qual é o experimento da vez?"
20006-200060030 = "Vê se me poupa daqueles seus remédios estranhos..."
20006-200060040 = "Não, não! Não tem nada a ver com isso!"
20006-200060050 = "Eu só fiquei sabendo que aquele restaurante chinês que você comentou outro dia vai lançar um cardápio novo e quis te avisar!"
20006-200060060 = "É uma baita injustiça você achar que tudo o que eu falo é pra algum experimento!"
20006-200060070 = "Foi mal, foi mal. Bom, pra compensar..."
20006-200060080 = "Eu pago a conta, vamos lá juntos."
20006-200060090 = "Sério mesmo?! Agora não vale mais voltar atrás, hein?!"
20006-200060100 = "Então combinado! A gente se encontra na frente do restaurante neste fim de semana!"
20006-200060110 = "A vida de um gênio é tão solitária..."
20006-200060120 = "Por mais que eu explique, ninguém consegue me entender..."
20006-200060130 = "Aconteceu alguma coisa?"
20006-200060140 = "Ah, é mesmo, Sensei."
20006-200060150 = "N-Não, não é nada, não!"
20006-200060160 = "É um problema que a Grande Saya aqui consegue resolver sozinha tranquilamente!"
20006-200060170 = "Afinal, não existe nada impossível para mim, a maior gênia de toda Shanhaijing! Uahahaha!"
20006-200060180 = "...?"
20006-200060190 = "Sensei, valeu mesmo por aquele bolo do outro dia!"
20006-200060200 = "Em troca, dessa vez a Grande Saya aqui vai pagar alguma coisa bem gostosa pra você lá na Associação Comercial Genbu!"
20006-200060210 = "Tem alguma coisa que você tá com vontade de comer, Sensei?"
20006-200060220 = "Tô no clima de arroz frito!"
20006-200060230 = "Tô no clima de yakisoba!"
20006-200060240 = "Ah, agora que lembrei, essa semana é a \"Semana do Lámen\", em que os restaurantes da Associação Comercial Genbu lançam um lámen novo atrás do outro!"
20006-200060250 = "Sensei! Eu conheço um restaurante perfeito pra recomendar, então vamos nele!"
20006-200060260 = "Então pra que você perguntou a minha opinião...?"
20006-200060270 = "Agora complicou tudo..."
20006-200060280 = "O que houve?"
20006-200060290 = "Aquele molho superapimentado especial que desenvolvi outro dia tá fazendo muito mais sucesso do que eu esperava..."
20006-200060300 = "Isso tá tomando todo o meu tempo e não consigo focar nas minhas pesquisas!"
20006-200060310 = "Francamente..."
20006-200060320 = "O objetivo da Sociedade de Estudo de Alquimia é \"criar o elixir da imortalidade\", e não ficar fabricando molho de pimenta!"
20006-200060330 = "Tô precisando de toda ajuda possível, até das patinhas do Nezusuke..."
20006-200060340 = "Já sei! Tive uma ideia genial!"
20006-200060350 = "Melhor deixar quieto."
20006-200060360 = "Mas eu ainda nem falei nada?!"
20006-200060370 = "É que já estou com um mau pressentimento..."
20006-200060380 = "Grr, fazer o quê... Vou ficar quietinha preparando o molho mesmo..."
20006-200060390 = "Hehehe!"
20006-200060400 = "Que maravilha!"
20006-200060410 = "Finalmente apareceu alguém"
20006-200060420 = "que reconhece o talento da Grande Saya!"
20006-200060430 = "O que aconteceu?"
20006-200060440 = "Recebeu alguma encomenda ou pedido?"
20006-200060450 = "Isso mesmo!"
20006-200060460 = "E já que a ocasião é especial, quero que você venha junto, Sensei!"
20006-200060470 = "Venha ver a minha grande invenção de pertinho comigo!"
20006-200060480 = "Uugh..."
20006-200060490 = "Pensando bem, eu devia ter colocado uma máscara de gás."
20006-200060500 = "Onde já se viu eu baixar a guarda achando que era só um perfume comum..."
20006-200060510 = "Ou será que a minha invenção foi simplesmente poderosa demais...?"
20006-200060520 = "Todo mundo adorou, viu?"
20006-200060530 = "Graças a você, Saya, o evento foi um baita sucesso."
20006-200060540 = "Hehehe!"
20006-200060550 = "Mas isso era óbvio!"
20006-200060560 = "Afinal, estamos falando da Grande Saya!"
20006-200060570 = "Ah, é mesmo."
20006-200060580 = "Sensei..."
20006-200060590 = "Você me salvou hoje, obrigada!"
20006-200060600 = "Pode esperar ansiosamente pela minha próxima invenção também!"
