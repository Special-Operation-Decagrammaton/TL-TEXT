[translation]
20006-200060010 = "Сенсей, у вас есть время на этих выходных?"
20006-200060020 = "На этот раз какой эксперимент?"
20006-200060030 = "Странные лекарства уже надоели..."
20006-200060040 = "Нет-нет, не то!"
20006-200060050 = "Я просто услышал, что в той китайской ресторане, про которую вы говорили, появилось новое меню, и хотел вам сказать!"
20006-200060060 = "Обидно, что все мои дела считают экспериментами!"
20006-200060070 = "Прости-прости, тогда в качестве извинения..."
20006-200060080 = "я угощаю, пойдём вместе."
20006-200060090 = "Правда? Уже не откажешься!?"
20006-200060100 = "Тогда встречаемся в эти выходные у ресторана!"
20006-200060110 = "Гении одиноки..."
20006-200060120 = "Сколько ни объясняй, никто не понимает..."
20006-200060130 = "Что-то случилось?"
20006-200060140 = "А, точно, Сенсей."
20006-200060150 = "Н-нет, ничего!"
20006-200060160 = "Я и сам могу решить эту проблему!"
20006-200060170 = "Для меня, величайшего гения Шаньхайцзина, нет ничего невозможного! У-ха-ха-ха!"
20006-200060180 = "...?"
20006-200060190 = "Сенсей, спасибо за тот торт."
20006-200060200 = "В ответ я угощу вас чем-нибудь вкусным в Торговом квартале Генбу!"
20006-200060210 = "Есть что-то, что вы хотите съесть?"
20006-200060220 = "Настроение на жареный рис!"
20006-200060230 = "Настроение на якисобу!"
20006-200060240 = "А, кстати, на этой неделе в Торговом квартале Генбу «Неделя рамена» — все магазины по очереди выпускают новые рамены!"
20006-200060250 = "Сенсей! Как раз есть одно место, которое я рекомендую, пойдём туда!"
20006-200060260 = "А какой смысл был спрашивать моё мнение...?"
20006-200060270 = "Попался..."
20006-200060280 = "Что случилось?"
20006-200060290 = "Тот специальный острый соус, который я недавно разработал, оказался неожиданно популярным..."
20006-200060300 = "Из-за этого я отвлекаюсь на него и не могу заниматься исследованиями."
20006-200060310 = "Вот чёрт..."
20006-200060320 = "Кружок алхимии — это место для создания «эликсира бессмертия», а не для изготовления соусов!"
20006-200060330 = "Хоть бы Нэдзускэ помог..."
20006-200060340 = "Придумал!"
20006-200060350 = "Не надо."
20006-200060360 = "Я же ещё ничего не сказал!?"
20006-200060370 = "Чувствуется что-то недоброе..."
20006-200060380 = "Гх, ничего не поделаешь... буду послушно делать соус..."
20006-200060390 = "Хе-хе-хе!"
20006-200060400 = "Замечательно."
20006-200060410 = "Наконец-то появился кто-то, кто"
20006-200060420 = "признал мой талант!"
20006-200060430 = "Что случилось?"
20006-200060440 = "Кто-то сделал заказ?"
20006-200060450 = "Именно!"
20006-200060460 = "Раз уж так, я хочу, чтобы вы тоже пришли!"
20006-200060470 = "Давайте вместе посмотрим на моё изобретение!"
20006-200060480 = "У-у..."
20006-200060490 = "Если подумать, надо было надеть противогаз."
20006-200060500 = "Подумал, что это просто духи, и расслабился..."
20006-200060510 = "Нет, моё изобретение было слишком крутым...?"
20006-200060520 = "Все были в восторге."
20006-200060530 = "Благодаря Сае мероприятие прошло с большим успехом."
20006-200060540 = "Хе-хе-хе"
20006-200060550 = "Это же очевидно!"
20006-200060560 = "Ведь это я!"
20006-200060570 = "Кстати,"
20006-200060580 = "Сенсей,"
20006-200060590 = "сегодня вы мне очень помогли, спасибо!"
20006-200060600 = "Надеюсь, вы будете ждать следующего изобретения!"