[translation]
20006-200060010 = "Вы свободны на выходных, Сенсей?"
20006-200060020 = "Мне снова придётся быть лабораторной крысой?"
20006-200060030 = "Пожалуйста, больше никаких экспериментов..."
20006-200060040 = "Всё не так!"
20006-200060050 = "Я просто хотела сказать, что восточный ресторан, который вы любите, запускает новое меню на выходных!"
20006-200060060 = "Я пытаюсь быть доброй, а вы мне вот так отвечаете?"
20006-200060070 = "Прости. На выходных я свободен."
20006-200060080 = "Позволь загладить вину и оплатить счёт."
20006-200060090 = "Правда? Только не забудьте!"
20006-200060100 = "Тогда увидимся там позже!"
20006-200060110 = "Фух... Жизнь гения бывает довольно одинокой."
20006-200060120 = "Обычные люди всё равно не поймут, сколько ни объясняй..."
20006-200060130 = "Что-то не так?"
20006-200060140 = "Эм, то есть..."
20006-200060150 = "Н-Ничего!"
20006-200060160 = "Я сама справлюсь!"
20006-200060170 = "Я гений Шаньхайцзина! Для меня нет ничего невозможного! Ха-ха-ха!"
20006-200060180 = "Ну да, СОВСЕМ не подозрительно."
20006-200060190 = "Спасибо, что угостили меня в прошлый раз, Сенсей."
20006-200060200 = "В ответ я куплю вам что-нибудь вкусное на Променаде Чёрной Черепахи."
20006-200060210 = "Что хотите, Сенсей?"
20006-200060220 = "Давай жареный рис."
20006-200060230 = "Хочу якисобу!"
20006-200060240 = "А, но на Чёрной Черепахе на этой неделе запускают новое рамэн-меню."
20006-200060250 = "Сенсей, давайте в выходные поедим рамэн на Чёрной Черепахе!"
20006-200060260 = "Зачем тогда вообще спрашивать, чего я хочу?"
20006-200060270 = "Уф... Ух, уф..."
20006-200060280 = "Что-то не так?"
20006-200060290 = "Мой особый острый соус, который я сделала на прошлой неделе, оказался намного популярнее, чем ожидалось."
20006-200060300 = "Я уже дошла до того, что из-за постоянной готовки соуса совсем нет времени на исследования."
20006-200060310 = "Они вообще знают, чем занимается Общество восточной алхимии?"
20006-200060320 = "Мы должны создавать эликсиры вечной жизни и молодости, а не особые соусы!"
20006-200060330 = "Я так занята, что, возможно, придётся попросить Нэдзусукэ о помощи..."
20006-200060340 = "Погодите, если использовать тот метод..."
20006-200060350 = "Нет."
20006-200060360 = "А? Я ведь ещё ничего не сказал."
20006-200060370 = "Не знаю, что ты собираешься предложить, но нет."
20006-200060380 = "Ц. Будто вы мысли читаете..."
20006-200060390 = "Кхм!"
20006-200060400 = "Хорошие новости."
20006-200060410 = "Наконец-то"
20006-200060420 = "мой гений признали!"
20006-200060430 = "О? Что случилось?"
20006-200060440 = "Ты получила заказ?"
20006-200060450 = "Именно!"
20006-200060460 = "Раз уж случай особенный, даже вы будете там!"
20006-200060470 = "Вы сможете своими глазами увидеть моё новейшее изобретение!"
20006-200060480 = "Уф."
20006-200060490 = "Если оглянуться назад, стоило надеть противогаз."
20006-200060500 = "Я недооценила состав, отнесясь к нему как к обычным духам."
20006-200060510 = "Чтобы кто-то вроде меня допустил такую ошибку..."
20006-200060520 = "Но благодаря этому все отлично повеселились."
20006-200060530 = "Я бы сказал, мероприятие прошло с огромным успехом."
20006-200060540 = "Хех."
20006-200060550 = "А разве могли быть сомнения?"
20006-200060560 = "Хм."
20006-200060570 = "И всё же"
20006-200060580 = "Сенсей."
20006-200060590 = "Спасибо."
20006-200060600 = "в следующий раз я вас по-настоящему удивлю!"
