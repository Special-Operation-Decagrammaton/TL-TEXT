[translation]
10140-101400010 = "Сенсей, я слышала вы меня искали."
10140-101400020 = "Что-то случилось?"
10140-101400030 = "Может, вляпались в опасное дело?"
10140-101400040 = "А, Куруми! Я как раз тебя искал!"
10140-101400050 = "Я хотел поделиться с тобой фруктовым молоком, которое получил в подарок!"
10140-101400060 = "Слышал, что ты любишь сладкое молоко."
10140-101400070 = "Эй!"
10140-101400080 = "Откуда ты знаешь, что я люблю?"
10140-101400090 = "И вообще,"
10140-101400100 = "меня такими вещами не купить!"
10140-101400110 = "Я же боец СРТ!"
10140-101400120 = "Тоооочно не хочешь?"
10140-101400130 = "Тут же кусочки фруктов."
10140-101400140 = "..."
10140-101400150 = "…………"
10140-101400160 = "Клубничное есть?"
10140-101400170 = "Конечно. Ещё банановое и дынное."
10140-101400180 = "Тогда я зайду за ним позже."
10140-101400190 = "Но имей в виду!"
10140-101400200 = "Я не из-за молока согласилась!"
10140-101400210 = "Спать хочется..."
10140-101400220 = "У тебя была операция прошлой ночью?"
10140-101400230 = "Нет."
10140-101400240 = "Просто смотрела короткие видео."
10140-101400250 = "И засиделась до утра..."
10140-101400260 = "Да, когда смотришь, время летит незаметно."
10140-101400270 = "Короткие видео более затягивают, чем длинные ролики."
10140-101400280 = "Вот именно."
10140-101400290 = "В последнее время я смотрю видео с лайфхаками."
10140-101400300 = "Но там, где обещают советы, сплошь какие-то странные приспособления."
10140-101400310 = "Впрочем, говорить о неэффективности в коротких видео тоже странно."
10140-101400320 = "Но вот думать о том, как обычными инструментами преодолевать трудности, — это увлекательно."
10140-101400330 = "Вроде как использовать «мешок мудрости»."
10140-101400340 = "«Мешок мудрости»? Что это?"
10140-101400350 = "М-м... объяснять долго."
10140-101400360 = "Это как синоним лайфхаков."
10140-101400370 = "?"
10140-101400380 = "Взрослые иногда используют странные словечки."
10140-101400390 = "Здесь поблизости"
10140-101400400 = "есть место, где можно сделать фото на документы?"
10140-101400410 = "Кажется, рядом нет фотоателье..."
10140-101400420 = "А зачем тебе вдруг?"
10140-101400430 = "Мне нужно обновить удостоверение для операции."
10140-101400440 = "И нужно свежее фото..."
10140-101400450 = "Старое было сделано, когда я была ещё в СРТ."
10140-101400460 = "Может, воспользуешься фотоавтоматом?"
10140-101400470 = "Фотоавтоматом?"
10140-101400480 = "Ага. Обычно они есть у вокзалов."
10140-101400490 = "Работают круглосуточно. Попробуй."
10140-101400500 = "Фотоавтомат..."
10140-101400510 = "..."
10140-101400520 = "Ладно, делать нечего."
10140-101400530 = "Поняла. Спасибо."
10140-101400540 = "Я играю в недавно вышедшую мобильную RPG."
10140-101400550 = "В этой игре, мне кажется, танк слишком слабый."
10140-101400560 = "И разве нормально, что его урон меньше, чем у монаха?"
10140-101400570 = "Разве это не игровой баланс?"
10140-101400580 = "Щит ведь ассоциируется с защитой."
10140-101400590 = "Но"
10140-101400600 = "щит можно использовать и не только для защиты."
10140-101400610 = "В некоторых случаях он может быть страшнее оружия."
10140-101400620 = "Щит как оружие...?"
10140-101400630 = "В конце концов, это же кусок железа."
10140-101400640 = "Тот, что у меня, весит килограмм двадцать."
10140-101400650 = "И ты всё это время носила его одной рукой!?"
10140-101400660 = "?"
10140-101400670 = "Конечно. Ещё ведь и оружие нужно носить."
10140-101400680 = "Действительно, танк — это сила..."
10140-101400690 = "Сенсей, слышал тот слух?"
10140-101400700 = "Говорят, в городе появился грабитель."
10140-101400710 = "Он следит за людьми в безлюдных местах."
10140-101400720 = "И ворует кошельки."
10140-101400730 = "Тревожные слухи..."
10140-101400740 = "Преступника ещё не поймали?"
10140-101400750 = "Валькирия ведёт расследование, так что скоро поймают, но..."
10140-101400760 = "Ты тоже будь осторожен."
10140-101400770 = "Ты и так слабее нас, а ещё часто ходишь ночью один."
10140-101400780 = "Так что"
10140-101400790 = "я могу за тобой прийти."
10140-101400800 = "Если Куруми придёт за мной, мне станет неловко."
10140-101400810 = "Ты придёшь в фартуке?"
10140-101400820 = "Замолчи!"
10140-101400830 = "Я не в том смысле!"