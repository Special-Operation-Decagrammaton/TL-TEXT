[translation]
10140-101400010 = "Сенсей, я слышала, вы меня искали."
10140-101400020 = "Что такое?"
10140-101400030 = "Вам нужна моя сила, чтобы вытащить вас из опасной ситуации?"
10140-101400040 = "А, Куруми! Вот ты где!"
10140-101400050 = "Я хотел поделиться с тобой фруктовым молоком, которое получил в подарок!"
10140-101400060 = "Ты ведь любишь сладкое молоко, да?"
10140-101400070 = "Погодите."
10140-101400080 = "Откуда ты это знаешь?"
10140-101400090 = "Погоди."
10140-101400100 = "Я вам что, ребёнок, который прибежит при первом упоминании сладостей?!"
10140-101400110 = "Я спецагент SRT! Не связывайтесь со мной из-за такого!"
10140-101400120 = "Ты уве-е-ерена?"
10140-101400130 = "Это очень дорогое фруктовое молоко из настоящих фруктов."
10140-101400140 = "Ну..."
10140-101400150 = "Мм."
10140-101400160 = "Клубничное есть?"
10140-101400170 = "И банановое, и дынное. Всё ждёт тебя."
10140-101400180 = "...Приду, когда сдам этот отчёт."
10140-101400190 = "И ещё раз:"
10140-101400200 = "я иду НЕ только потому, что хочу сладкого, ЯСНО?!"
10140-101400210 = "Я устала..."
10140-101400220 = "У тебя была ночная операция?"
10140-101400230 = "Нет."
10140-101400240 = "Перед сном я смотрела короткие ролики в соцсетях."
10140-101400250 = "Потеряла счёт времени и в итоге засиделась допоздна."
10140-101400260 = "Эти короткие видео затягивают!"
10140-101400270 = "Почему-то они даже сильнее вызывают зависимость, чем длинные..."
10140-101400280 = "Это правда."
10140-101400290 = "Я смотрела ролики с «лайфхаками», где показывают маленькие полезные хитрости на каждый день."
10140-101400300 = "Но во многих говорят, что это простой совет, а сами используют какие-то редкие инструменты для элементарнейших задач?"
10140-101400310 = "Наверное, мне не стоит ворчать про неэффективность, если я сама всю ночь думскроллила."
10140-101400320 = "Зато забавно смотреть, как люди придумывают решения из обычных предметов!"
10140-101400330 = "Звучит как MacXver..."
10140-101400340 = "MacXver? Что это?"
10140-101400350 = "Эм... Это долгая история."
10140-101400360 = "Если коротко, это практически само определение лайфхака."
10140-101400370 = "?"
10140-101400380 = "У вас, взрослых, самый странный сленг."
10140-101400390 = "Сенсей"
10140-101400400 = "Знаете место, где можно сделать фото на удостоверение?"
10140-101400410 = "Так сразу не припомню..."
10140-101400420 = "А зачем тебе фото на удостоверение?"
10140-101400430 = "Для задания мне нужно получить одну сертификацию,"
10140-101400440 = "но к заявлению требуется приложить недавнюю фотографию."
10140-101400450 = "Последний раз я фотографировалась ещё в SRT."
10140-101400460 = "А как насчёт фотокабинки самообслуживания?"
10140-101400470 = "Фотокабинки самообслуживания?"
10140-101400480 = "Сейчас они есть почти на каждой станции."
10140-101400490 = "Они работают круглосуточно, так что можно прийти когда угодно!"
10140-101400500 = "Фотокабинки самообслуживания немного..."
10140-101400510 = "Мм."
10140-101400520 = "Наверное, другого варианта у меня нет."
10140-101400530 = "Хорошо, спасибо, Сенсей."
10140-101400540 = "Я играю в новую мобильную RPG."
10140-101400550 = "И баланс характеристик у танков со щитами просто ужасный."
10140-101400560 = "Я могу смириться почти со всем, но почему у нас атака ниже, чем у МОНАХА?"
10140-101400570 = "Разве они не компенсируют высокий DEF?"
10140-101400580 = "Просто люди ДУМАЮТ, что щиты нужны только для защиты."
10140-101400590 = "Но"
10140-101400600 = "Щит — это не просто часть брони."
10140-101400610 = "Если правильно им пользоваться, он смертоноснее большинства оружия."
10140-101400620 = "Правда...?"
10140-101400630 = "Это огромный кусок металла!"
10140-101400640 = "Мой щит весит не один десяток килограммов, между прочим."
10140-101400650 = "Погоди! Ты ведь носишь его одной рукой?!"
10140-101400660 = "?"
10140-101400670 = "Ну да? В другой у меня оружие."
10140-101400680 = "Ого... Танки сильные..."
10140-101400690 = "Сенсей! Вы слышали?"
10140-101400700 = "В районе объявился грабитель, который прячется в переулках и отбирает у людей ценности."
10140-101400710 = "Он выслеживает жертву до безлюдного места,"
10140-101400720 = "а потом нападает из засады и забирает всё, что есть!"
10140-101400730 = "Зловеще..."
10140-101400740 = "Подозреваемый есть?"
10140-101400750 = "Бюро безопасности Валькирии начало масштабное расследование, так что, думаю, его скоро поймают..."
10140-101400760 = "Но всё равно будьте осторожны, Сенсей."
10140-101400770 = "Вы слабее нас, но постоянно бродите по ночам."
10140-101400780 = "Знаете,"
10140-101400790 = "я могу сопровождать вас, если позовёте меня где-нибудь рядом с Шале."
10140-101400800 = "О-о, мне нравится идея, что ты выйдешь меня встречать."
10140-101400810 = "Может, ещё фартук наденешь?"
10140-101400820 = "Замолчите!"
10140-101400830 = "Вы вообще не поняли сути!"
