[translation]
10140-101400010 = "Você estava me procurando agora há pouco, não estava?"
10140-101400020 = "Aconteceu alguma coisa?"
10140-101400030 = "Não me diga que se meteu em algum caso perigoso?"
10140-101400040 = "Ah, eu estava te procurando mesmo."
10140-101400050 = "Ganhei leite com frutas no centro comercial aqui perto e queria dividir com você."
10140-101400060 = "Ouvi dizer que você adora leite docinho, Kurumi."
10140-101400070 = "Ei, espera aí!"
10140-101400080 = "Como é que você sabe do que eu gosto?!"
10140-101400090 = "E outra,"
10140-101400100 = "acha mesmo que vai me fisgar com uma coisa dessas?!"
10140-101400110 = "Eu sou uma agente de elite da SRT, sabia?"
10140-101400120 = "Tem certeza de que não quer?"
10140-101400130 = "É daqueles cheios de pedacinhos de fruta..."
10140-101400140 = "..."
10140-101400150 = "............"
10140-101400160 = "Tem leite de morango também?"
10140-101400170 = "Claro. E também tem sabor banana e melão."
10140-101400180 = "Tá, então mais tarde eu passo aí para pegar."
10140-101400190 = "Mas já vou avisando!"
10140-101400200 = "Não pense que você me ganhou pelo estômago com esse leite!"
10140-101400210 = "Que sono..."
10140-101400220 = "Teve operação ontem à noite?"
10140-101400230 = "Não..."
10140-101400240 = "Comecei a assistir uns vídeos curtos interessantes no celular"
10140-101400250 = "e acabei ficando acordada até tarde..."
10140-101400260 = "Quando a gente começa a ver, o tempo voa mesmo."
10140-101400270 = "Parece que vicia ainda mais do que vídeo longo."
10140-101400280 = "Pois é."
10140-101400290 = "Ultimamente tenho assistido vários vídeos de \"lifehacks\" e truques práticos,"
10140-101400300 = "mas, apesar de prometerem dicas úteis, a maioria só usa umas ferramentas super esquisitas."
10140-101400310 = "Tá certo que reclamar de falta de eficiência em vídeo curto também é besteira minha."
10140-101400320 = "Mas é bem legal pensar em como usar objetos comuns com criatividade para superar dificuldades."
10140-101400330 = "É como colocar em prática um verdadeiro \"almanaque de sabedoria\"."
10140-101400340 = "\"Almanaque de sabedoria\"? Que isso?"
10140-101400350 = "Huum... Explicar tudo levaria tempo, mas"
10140-101400360 = "é basicamente como chamavam os lifehacks antigamente."
10140-101400370 = "?"
10140-101400380 = "Os adultos usam umas gírias tão estranhas às vezes, né."
10140-101400390 = "Por acaso tem algum lugar aqui por perto"
10140-101400400 = "onde dê para tirar foto 3x4 para documento?"
10140-101400410 = "Acho que não tem nenhum estúdio fotográfico aqui perto..."
10140-101400420 = "Por que precisa disso de repente?"
10140-101400430 = "Vou precisar emitir uma credencial nova para uma operação,"
10140-101400440 = "e exigiram uma foto recente..."
10140-101400450 = "Não deixaram usar a minha foto antiga."
10140-101400460 = "Por que não usa uma cabine de fotos automáticas?"
10140-101400470 = "Cabine de fotos automáticas?"
10140-101400480 = "Sim. Quase sempre tem uma em frente à estação,"
10140-101400490 = "e funciona a qualquer hora. Que tal dar um pulo lá?"
10140-101400500 = "É que aquelas cabines automáticas são meio..."
10140-101400510 = "..."
10140-101400520 = "Bom, fazer o quê, né."
10140-101400530 = "Entendi. Obrigada."
10140-101400540 = "Comecei a jogar um RPG de celular que lançou recentemente,"
10140-101400550 = "mas sinto que os atributos da classe Tank nesse jogo são baixos demais."
10140-101400560 = "E não é absurdo o DPS dele ser menor até que o do Monge?"
10140-101400570 = "Não é pelo balanceamento do jogo?"
10140-101400580 = "Afinal, escudo passa a imagem de ser focado em defesa."
10140-101400590 = "Mesmo assim,"
10140-101400600 = "um escudo serve para muito mais do que só defender, viu?"
10140-101400610 = "Dependendo da situação, pode ser mais assustador do que uma arma de fogo."
10140-101400620 = "Um escudo virar arma...?"
10140-101400630 = "Claro, é um baita bloco de aço maciço, afinal."
10140-101400640 = "Só o escudo tático que eu uso pesa dezenas de quilos."
10140-101400650 = "E você carrega isso tudo com uma mão só o tempo todo?!"
10140-101400660 = "?"
10140-101400670 = "Lógico, né. Eu preciso segurar a arma com a outra mão."
10140-101400680 = "Pensando bem, os Tanks são mesmo assustadoramente fortes..."
10140-101400690 = "Sensei, você ouviu aquele boato?"
10140-101400700 = "Dizem que tem um assaltante agindo aqui pelo bairro ultimamente."
10140-101400710 = "Parece que ele segue as pessoas em ruas desertas"
10140-101400720 = "para roubar carteiras e pertences."
10140-101400730 = "Que notícia preocupante..."
10140-101400740 = "Ainda não prenderam o culpado?"
10140-101400750 = "A Valkyrie já está investigando o caso, então devem prendê-lo logo, mas..."
10140-101400760 = "Mesmo assim, tome cuidado você também, Sensei."
10140-101400770 = "Você já é bem mais frágil que todas nós e ainda vive andando sozinho por aí à noite, né?"
10140-101400780 = "Se precisar,"
10140-101400790 = "eu vou buscar você."
10140-101400800 = "Fico até sem jeito com a Kurumi vindo me buscar."
10140-101400810 = "Vai vir me receber usando um avental também?"
10140-101400820 = "Cala a boca!"
10140-101400830 = "Não foi nesse sentido que eu falei!"
