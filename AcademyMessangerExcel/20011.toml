[translation]
20011-200110010 = "Сенсей, вы случайно разбираетесь в синтоистских жрицах?"
20011-200110020 = "Не уверен, что можно назвать это глубокими знаниями... А что?"
20011-200110030 = "Конечно. Меня называют мастером синтоистских жриц."
20011-200110040 = "Ах, на самом деле..."
20011-200110050 = "Понимаете, мне случайно предложили одну хорошо оплачиваемую подработку."
20011-200110060 = "Похоже, это работа в качестве синтоистской жрицы на мероприятии..."
20011-200110070 = "Мастер синтоистских жриц...?"
20011-200110080 = "...Сенсей, у вас всё в порядке с головой?"
20011-200110090 = "Или майстер синтоистских жриц."
20011-200110100 = "Это ещё более бессмысленно!?"
20011-200110110 = "Вздох... В общем, я нашла подработку синтоистской жрицей с довольно хорошей почасовой оплатой и подумала попробовать."
20011-200110120 = "Но когда задумалась, поняла, что мало что знаю о синтоистских жрицах..."
20011-200110130 = "Поэтому, если вы знаете, я бы хотела, чтобы вы мне рассказали."
20011-200110140 = "Не знаю, насколько смогу помочь, но положись на меня!"
20011-200110150 = "Спасибо. Тогда я пришлю место встречи позже."
20011-200110160 = "Эм, Сенсей"
20011-200110170 = "В общем, спасибо, что выслушали меня сегодня."
20011-200110180 = "Не за что. Когда начнётся работа, я зайду к тебе, хочется выпить сладкого сакэ."
20011-200110190 = "...Приходить можно, но не смей меня дразнить!"
20011-200110200 = "Ещё раз с новым годом, Сенсей."
20011-200110210 = "С новым годом. Буду рад сотрудничеству и в этом году."
20011-200110220 = "Кстати, Серика, как продвигается подготовка к подработке?"
20011-200110230 = "А, да. Вроде неплохо."
20011-200110240 = "Я ещё не привыкла, так что есть кое-какие сомнения, но..."
20011-200110250 = "Весело, и в целом проблем нет."
20011-200110260 = "Тогда я сейчас приду!"
20011-200110270 = "Что, сейчас!? Я же не говорила, что хочу, чтобы ты пришёл!?"
20011-200110280 = "Тебе будет неудобно, если я приду?"
20011-200110290 = "Нет, дело не в этом, но..."
20011-200110300 = "Скорее, если бы ты пришёл..."
20011-200110310 = "Ах, я отправила не дописав! Забудь это! Считай, что не видела!"
20011-200110320 = "Так что можешь и не приходить!"
20011-200110330 = "Сенсей, у вас есть время сейчас?"
20011-200110340 = "Да, я свободен."
20011-200110350 = "Время могу найти, а что?"
20011-200110360 = "А, правда...?"
20011-200110370 = "Дело в том, что сегодня подработка, похоже, закончится немного раньше."
20011-200110380 = "Будет свободное время, поэтому..."
20011-200110390 = "Я подумала, не купить ли сувениры в новогоднем стиле для всех из Абидоса."
20011-200110400 = "Не поможешь мне выбрать?"
20011-200110410 = "Я сейчас приду!"
20011-200110420 = "Спасибо. Жду."
20011-200110430 = "Эм... Сенсей"
20011-200110440 = "Когда вы пришли сегодня, вы так тяжело дышали..."
20011-200110450 = "Ну..."
20011-200110460 = "Всё в порядке, не обращай внимания."
20011-200110470 = "Х-хорошо..."
20011-200110480 = "Просто если бы ты мог предупредить, моим коленям было бы легче, вот и всё."
20011-200110490 = "...Хорошо, понял."
20011-200110500 = "Прости, что заставила волноваться."
20011-200110510 = "Спасибо тебе всегда, Сенсей♡"
20011-200110520 = "Сердечко...!"
20011-200110530 = "Н-нет! Это просто автозамена поставила...!"
20011-200110540 = "Это не то, совсем не то!"