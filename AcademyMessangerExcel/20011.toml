[translation]
20011-200110010 = "Вы что-нибудь знаете о мико, Сенсей?"
20011-200110020 = "А? Почему ты вдруг спрашиваешь о мико?"
20011-200110030 = "Конечно! Можешь звать меня мастером мико!"
20011-200110040 = "Ну, ничего такого. Просто..."
20011-200110050 = "я, эм, случайно услышала о хорошо оплачиваемой подработке."
20011-200110060 = "Подработка — изображать мико на... мероприятии."
20011-200110070 = "М-Мастер мико...?"
20011-200110080 = "Эм, Сенсей. Я понятия не имею, что вы имеете в виду."
20011-200110090 = "Если не нравится, как насчёт «мейстер мико»?!"
20011-200110100 = "Теперь я ВООБЩЕ не понимаю, о чём вы!!"
20011-200110110 = "*вздох* ...В общем, почасовая оплата довольно высокая, и я хотела бы взять эту подработку, если получится."
20011-200110120 = "Но я понятия не имею, что должна делать подрабатывающая мико."
20011-200110130 = "Если вы не против, я хотела бы попросить вашей помощи."
20011-200110140 = "Хорошо, я совсем не против помочь!"
20011-200110150 = "Правда...? Тогда увидимся в месте встречи, Сенсей!"
20011-200110160 = "В любом случае, Сенсей..."
20011-200110170 = "Спасибо, что сегодня посоветовались со мной."
20011-200110180 = "Я зайду к тебе, когда начнёшь подрабатывать. Хочу тоже выпить гамджу."
20011-200110190 = "...М-Можете прийти, но гамджу — единственное, чем я смогу вас угостить!"
20011-200110200 = "С Новым годом, Сенсей."
20011-200110210 = "С Новым годом, Серика."
20011-200110220 = "Как подготовка к подработке? Всё хорошо?"
20011-200110230 = "О, вообще-то всё идёт очень хорошо."
20011-200110240 = "Немного волнуюсь, потому что к некоторым вещам ещё не привыкла, но..."
20011-200110250 = "Да, думаю, проблем не будет."
20011-200110260 = "Понятно. Хорошо. Тогда я прямо сейчас приду!"
20011-200110270 = "Ч-Что? Я н-не пыталась намекнуть, чтобы вы пришли!"
20011-200110280 = "Серика, если я приду тебя увидеть, тебе это помешает?"
20011-200110290 = "А-А? Ну, не особо."
20011-200110300 = "Наоборот, если бы вы пришли..."
20011-200110310 = "Ой! Когда я это отправила?! Забудьте последнее сообщение! Сделайте вид, что не видели!"
20011-200110320 = "Можете вообще не приходить!"
20011-200110330 = "Эм, Сенсей? Вы свободны?"
20011-200110340 = "Я очень, очень свободен."
20011-200110350 = "Я не свободен, но для тебя, Серика, освобожусь!"
20011-200110360 = "Д-Да? Ну, дело в том,"
20011-200110370 = "кажется, сегодня я закончу подработку раньше."
20011-200110380 = "Так что появится свободное время..."
20011-200110390 = "Я хочу выбрать новогодние подарки для всех в Абидосе."
20011-200110400 = "Пойдёте со мной?"
20011-200110410 = "Сейчас буду!"
20011-200110420 = "Хорошо, скоро увидимся."
20011-200110430 = "Сегодня, эм... Насчёт того, что сегодня произошло..."
20011-200110440 = "Вы так меня искали с таким выражением лица."
20011-200110450 = "Так что, дело в том..."
20011-200110460 = "Не переживай."
20011-200110470 = "О, д-да?"
20011-200110480 = "Если снова случится что-нибудь похожее, было бы здорово, если бы вы заранее мне сообщили."
20011-200110490 = "Д-Да, х-хорошо."
20011-200110500 = "Я, эм, постараюсь больше вас не тревожить."
20011-200110510 = "Спасибо, как всегда, Сенсей ♥"
20011-200110520 = "О, сердечко."
20011-200110530 = "Э, нет! Это автодополнение добавило!"
20011-200110540 = "Н-Не подумайте ничего такого!"
