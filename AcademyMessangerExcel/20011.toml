[translation]
20011-200110010 = "Sensei, por acaso você entende bastante sobre sacerdotisas de santuário?"
20011-200110020 = "Não sei se diria que entendo bastante, mas... por quê?"
20011-200110030 = "Claro. As pessoas me chamam de Mestre das Sacerdotisas."
20011-200110040 = "Ah, é que na verdade..."
20011-200110050 = "Bom, surgiu por acaso uma oportunidade de bico que paga super bem."
20011-200110060 = "E parece que o trabalho é atuar como sacerdotisa num local de evento..."
20011-200110070 = "Mestre das Sacerdotisas...?"
20011-200110080 = "...Sensei, você bateu a cabeça?"
20011-200110090 = "Ou quem sabe Especialista Supremo em Sacerdotisas."
20011-200110100 = "Isso faz menos sentido ainda?!"
20011-200110110 = "Haah... Enfim, apareceu uma vaga de meio período como sacerdotisa que paga super bem por hora, então estava pensando em tentar."
20011-200110120 = "Mas, parando para pensar, eu não sei quase nada sobre o que uma sacerdotisa faz..."
20011-200110130 = "Então pensei que, se você soubesse de alguma coisa, poderia me ensinar."
20011-200110140 = "Não sei até onde consigo ajudar, mas pode deixar comigo!"
20011-200110150 = "Obrigada. Depois te mando o lugar pra gente se encontrar."
20011-200110160 = "Hum, Sensei..."
20011-200110170 = "No fim das contas, você me ajudou bastante me ouvindo hoje. Obrigada."
20011-200110180 = "Imagina. Quando o trabalho começar eu passo lá pra te ver, faz tempo que quero tomar um amazake também."
20011-200110190 = "...Pode até vir, mas eu não vou gaguejar nem errar nada, viu!"
20011-200110200 = "Sei que já nos falamos, mas... Feliz Ano Novo, Sensei."
20011-200110210 = "Feliz Ano Novo! Conto com você neste ano também."
20011-200110220 = "Por sinal, Serika, como estão os preparativos pro trabalho?"
20011-200110230 = "Ah, estão indo muito bem."
20011-200110240 = "Como ainda não estou acostumada, fico meio insegura com várias coisas, mas..."
20011-200110250 = "Está sendo divertido, então no geral está tudo ótimo."
20011-200110260 = "Então estou indo praí agora mesmo!"
20011-200110270 = "Quê, agora?! E-Eu não pedi pra você vir aqui, tá bom?!"
20011-200110280 = "Vai te atrapalhar se eu for?"
20011-200110290 = "Não, não é bem isso..."
20011-200110300 = "Na verdade, se você vier eu vou ficar"
20011-200110310 = "Aaah, mandei a mensagem sem terminar! Esquece o que eu disse! Finge que não viu!"
20011-200110320 = "Enfim, não precisa vir, tá bom?!"
20011-200110330 = "Sensei, você tem um tempinho agora?"
20011-200110340 = "Tenho sim, estou livre."
20011-200110350 = "Consigo abrir um espaço na agenda, sim. O que houve?"
20011-200110360 = "Ah, é mesmo...?"
20011-200110370 = "Na verdade, parece que o meu turno no trabalho vai terminar um pouco mais cedo hoje."
20011-200110380 = "Como vai sobrar um tempinho livre, bom..."
20011-200110390 = "Estava pensando em comprar algumas lembrancinhas de Ano Novo para o pessoal de Abydos."
20011-200110400 = "Você não quer vir comigo para me ajudar a escolher?"
20011-200110410 = "Tô indo agora mesmo!"
20011-200110420 = "Obrigada. Vou ficar te esperando."
20011-200110430 = "Hum... Sensei."
20011-200110440 = "Quando você chegou hoje, estava super sem fôlego..."
20011-200110450 = "É que..."
20011-200110460 = "Está tudo bem, não se preocupe."
20011-200110470 = "T-Tá bom..."
20011-200110480 = "Se puder me avisar com um pouquinho de antecedência na próxima, meus joelhos agradecem."
20011-200110490 = "...Tá bom, combinado."
20011-200110500 = "Desculpa te deixar preocupada."
20011-200110510 = "Obrigada por tudo sempre, Sensei♡"
20011-200110520 = "Um coraçãozinho...!"
20011-200110530 = "N-Não é isso! Isso aí entrou sozinho por causa do corretor automático...!"
20011-200110540 = "Não tem nada a ver, juro que foi sem querer!"
