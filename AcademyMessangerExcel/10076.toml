[translation]
10076-100760010 = "Сенсей!"
10076-100760020 = "Как у вас сейчас с временем?"
10076-100760030 = "Я свободен."
10076-100760040 = "Что случилось?"
10076-100760050 = "О!"
10076-100760060 = "Если вам не трудно,"
10076-100760070 = "у меня есть одно предложение!"
10076-100760080 = "Н-нет, я не хочу ничего объяснять!"
10076-100760090 = "Не объяснять...?"
10076-100760100 = "Хорошо, приходи в любое время."
10076-100760110 = "А"
10076-100760120 = "Э-э!"
10076-100760130 = "Ах"
10076-100760140 = "Да!!"
10076-100760150 = "Я сейчас приду!"
10076-100760160 = "Сенсей."
10076-100760170 = "Я пришла, надеясь помочь вам,"
10076-100760180 = "а в итоге вы помогли мне."
10076-100760190 = "Спасибо вам."
10076-100760200 = "Благодаря тебе, Котори, я отдохнул."
10076-100760210 = "Сам бы я не додумался."
10076-100760220 = "П-правда?"
10076-100760230 = "Это"
10076-100760240 = "замечательно!!"
10076-100760250 = "Спасибо!!"
10076-100760260 = "Наверное, из-за большого скопления людей"
10076-100760270 = "работы тоже много."
10076-100760280 = "Как и ожидалось от Большого спортивного праздника!"
10076-100760290 = "Сенсей, наверное, сейчас"
10076-100760300 = "очень заняты!"
10076-100760310 = "Ведь это работа по управлению мероприятием."
10076-100760320 = "Собрались разные академии."
10076-100760330 = "Я так и знала!"
10076-100760340 = "М-м."
10076-100760350 = "Тогда позвольте мне помочь с сортировкой документов!"
10076-100760360 = "Мою работу я уже закончила!"
10076-100760370 = "Ждите!"
10076-100760380 = "Я сейчас приду!"
10076-100760390 = "С возвращением!"
10076-100760400 = "Я до сих пор не совсем понимаю ту причину,"
10076-100760410 = "но, похоже, я действительно смогла вам помочь."
10076-100760420 = "Я очень рада!"
10076-100760430 = "...Это ведь не ошибка?"
10076-100760440 = "Я подумал, что ты мой спаситель."
10076-100760450 = "Супер-Котори, ура!"
10076-100760460 = "...!!"
10076-100760470 = "Хе-хе."
10076-100760480 = "Спасибо, Сенсей!"
10076-100760490 = "Всегда зовите меня!!"
10076-100760500 = "У-у."
10076-100760510 = "Я так и знала,"
10076-100760520 = "но физическая активность оказалась тяжелее, чем я думала."
10076-100760530 = "Надо было заниматься спортом чаще."
10076-100760540 = "Я сделала выводы..."
10076-100760550 = "Ты, наверное, устала. Где ты сейчас?"
10076-100760560 = "Я приду проведать тебя."
10076-100760570 = "Ах."
10076-100760580 = "Нет, я не в том смысле."
10076-100760590 = "Но"
10076-100760600 = "если я могу увидеть вас..."
10076-100760610 = "Да."
10076-100760620 = "Я буду ждать."
10076-100760630 = "Ой-ой-ой!!"
10076-100760640 = "Если подумать о том, что я сделала,"
10076-100760650 = "это было ужасно неловко!?"
10076-100760660 = "Я показалась вам в таком беззащитном виде!!"
10076-100760670 = "Всё в порядке."
10076-100760680 = "Наблюдать за вами — тоже часть работы учителя."
10076-100760690 = "Да?"
10076-100760700 = "Правда?"
10076-100760710 = "М-м."
10076-100760720 = "Если вы так говорите...?"
10076-100760730 = "В любом случае спасибо! Благодаря вам я полностью восстановилась!!"
10076-100760740 = "Тогда я пойду!!"
10076-100760750 = "Уже так поздно."
10076-100760760 = "Большой спортивный праздник незаметно подходит к концу."
10076-100760770 = "Мне как-то"
10076-100760780 = "это"
10076-100760790 = "странно."
10076-100760800 = "Не хочешь, чтобы он заканчивался?"
10076-100760810 = "Это значит, что ты старалась изо всех сил."
10076-100760820 = "Думаете?"
10076-100760830 = "Ну,"
10076-100760840 = "я ещё подумаю над этим."
10076-100760850 = "мне нужно"
10076-100760860 = "ещё немного подумать."
