[translation]
10076-100760010 = "Сенсей!"
10076-100760020 = "Ты сейчас занят?"
10076-100760030 = "Не сейчас."
10076-100760040 = "Что случилось?"
10076-100760050 = "О!"
10076-100760060 = "Отлично!"
10076-100760070 = "Я хочу кое-что тебе показать! Если ты не против!"
10076-100760080 = "Это, эм, не совсем то, что можно объяснить!"
10076-100760090 = "Что ты имеешь в виду...?"
10076-100760100 = "Что бы это ни было, приходи в любое время."
10076-100760110 = "..."
10076-100760120 = "В общем!"
10076-100760130 = "А."
10076-100760140 = "Да!!"
10076-100760150 = "Я прямо сейчас приду!"
10076-100760160 = "Сенсей."
10076-100760170 = "Я пришла, потому что хотела помочь тебе,"
10076-100760180 = "но в итоге ты помог мне."
10076-100760190 = "Огромное спасибо!"
10076-100760200 = "Нет, ты мне очень помогла."
10076-100760210 = "Без тебя я бы поленился делать это, Котори."
10076-100760220 = "Эм"
10076-100760230 = "Правда?"
10076-100760240 = "Ну тогда"
10076-100760250 = "я рада!"
10076-100760260 = "Спасибо!!"
10076-100760270 = "Ого."
10076-100760280 = "Столько людей нужно организовать, столько всего сделать..."
10076-100760290 = "Это и правда грандиозный спортивный праздник!"
10076-100760300 = "Конечно,"
10076-100760310 = "у тебя тоже наверняка куча дел!"
10076-100760320 = "Столько всего организовывать..."
10076-100760330 = "Столько школ собралось..."
10076-100760340 = "Точно!"
10076-100760350 = "Хм."
10076-100760360 = "Может, я помогу тебе с документами!"
10076-100760370 = "У меня есть свободное время,"
10076-100760380 = "так что жди меня!"
10076-100760390 = "Скоро буду!"
10076-100760400 = "Хм!"
10076-100760410 = "Не уверена,"
10076-100760420 = "но мне кажется, что я была полезна."
10076-100760430 = "Какое прекрасное чувство!"
10076-100760440 = "Мне ведь не кажется?"
10076-100760450 = "Нет, ты буквально спасла меня."
10076-100760460 = "Ты была настоящей звездой!"
10076-100760470 = "...!"
10076-100760480 = "Хи!"
10076-100760490 = "Хи-хи!"
10076-100760500 = "Зови меня в любое время, Сенсей!"
10076-100760510 = "Эм-м-м"
10076-100760520 = "Наверное, мне не стоило удивляться,"
10076-100760530 = "но физический труд ужасно выматывает."
10076-100760540 = "Мне стоит больше тренироваться."
10076-100760550 = "Я немного запустила себя..."
10076-100760560 = "Похоже, ты усердно работаешь. Где ты?"
10076-100760570 = "Мне нужно это увидеть."
10076-100760580 = "О."
10076-100760590 = "Я не хотела, чтобы ты..."
10076-100760600 = "Хм."
10076-100760610 = "Ну, я буду рада тебя увидеть, Сенсей."
10076-100760620 = "Хорошо."
10076-100760630 = "Буду ждать вас."
10076-100760640 = "А-а-а!"
10076-100760650 = "Раньше мне не приходило это в голову,"
10076-100760660 = "но это ужасно неловко!"
10076-100760670 = "Ты увидел меня всю потную и растрёпанную!"
10076-100760680 = "Всё нормально."
10076-100760690 = "Это часть работы."
10076-100760700 = "А?"
10076-100760710 = "Ты уверен?"
10076-100760720 = "Хм."
10076-100760730 = "Раз ты так говоришь, Сенсей..."
10076-100760740 = "В любом случае, ты помог мне почувствовать себя лучше."
10076-100760750 = "Увидимся!"
10076-100760760 = "Уже поздно."
10076-100760770 = "Все запланированные мероприятия закончились."
10076-100760780 = "И всё же"
10076-100760790 = "я чувствую"
10076-100760800 = "что-то странное."
10076-100760810 = "Может, тебе грустно, потому что всё закончилось."
10076-100760820 = "Ты много работала над этим. Понимаю, почему так чувствуешь."
10076-100760830 = "Вот что это такое?"
10076-100760840 = "Хм."
10076-100760850 = "Думаю..."
10076-100760860 = "мне нужно об этом подумать."
