[translation]
10076-100760010 = "Sensei!"
10076-100760020 = "Como está de tempo agora?"
10076-100760030 = "Estou livre."
10076-100760040 = "O que houve?"
10076-100760050 = "Oh!"
10076-100760060 = "Se você não se importar,"
10076-100760070 = "eu tenho uma pequena sugestão para fazer!"
10076-100760080 = "N-não é que eu esteja querendo dar uma explicação longa sobre alguma coisa, viu?!"
10076-100760090 = "Não é uma explicação...?"
10076-100760100 = "Tudo bem, pode vir quando quiser."
10076-100760110 = "Hã?"
10076-100760120 = "Huum!"
10076-100760130 = "Ah,"
10076-100760140 = "sim!!"
10076-100760150 = "Estou indo para aí agora mesmo!"
10076-100760160 = "Sensei."
10076-100760170 = "Eu fui até aí pensando em ajudar você,"
10076-100760180 = "mas no fim quem acabou sendo ajudada fui eu."
10076-100760190 = "Hum, muito obrigada mesmo."
10076-100760200 = "Graças a você consegui dar uma boa refrescada na cabeça, Kotori."
10076-100760210 = "Sozinho acho que eu não teria feito uma pausa."
10076-100760220 = "É"
10076-100760230 = "É mesmo?"
10076-100760240 = "Ah, então"
10076-100760250 = "que maravilha!!"
10076-100760260 = "Muito obrigada!!"
10076-100760270 = "Não sei se é por causa da quantidade enorme de gente,"
10076-100760280 = "mas o trabalho está acumulando sem parar, né?"
10076-100760290 = "Não se esperava menos do Grande Festival Esportivo!"
10076-100760300 = "Aposto que agora você também deve estar"
10076-100760310 = "tão ocupado a ponto de ficar tonto, né, Sensei?!"
10076-100760320 = "É trabalho de gestão e organização do evento, afinal."
10076-100760330 = "Tem várias academias diferentes reunidas num lugar só."
10076-100760340 = "Sabia!"
10076-100760350 = "Huum..."
10076-100760360 = "Nesse caso, deixe-me ajudar a organizar a papelada!"
10076-100760370 = "As minhas tarefas por aqui já deram uma trégua mesmo!"
10076-100760380 = "Me espere aí!"
10076-100760390 = "Já estou indo!"
10076-100760400 = "Bom trabalho hoje!"
10076-100760410 = "Eu ainda não entendi muito bem o motivo daquilo agora há pouco,"
10076-100760420 = "mas parece que consegui ser útil para você, Sensei,"
10076-100760430 = "então estou super feliz!"
10076-100760440 = "...Não é impressão minha, né?"
10076-100760450 = "Achei que você fosse a minha salvadora."
10076-100760460 = "Viva a Super Kotori!"
10076-100760470 = "...!!"
10076-100760480 = "Ehehe."
10076-100760490 = "Muito obrigada, Sensei!"
10076-100760500 = "Pode me chamar sempre que precisar de novo!!"
10076-100760510 = "Uuu..."
10076-100760520 = "Eu já imaginava, mas..."
10076-100760530 = "Mexer o corpo é bem mais cansativo do que parece, né?"
10076-100760540 = "Eu devia ter criado o hábito de me exercitar no dia a dia."
10076-100760550 = "Fica o aprendizado..."
10076-100760560 = "Você deve estar exausta. Onde você está agora?"
10076-100760570 = "Vou aí ver como você está."
10076-100760580 = "Ah"
10076-100760590 = "Não foi com essa intenção que eu..."
10076-100760600 = "Mas..."
10076-100760610 = "Se vou poder ver você, Sensei..."
10076-100760620 = "Sim!"
10076-100760630 = "Fico te esperando."
10076-100760640 = "Uaaaaah!!"
10076-100760650 = "Parando para pensar no que aconteceu agora há pouco,"
10076-100760660 = "eu passei uma vergonha gigantesca, não foi?!"
10076-100760670 = "Não acredito que deixei você me ver tão indefesa daquele jeito!!"
10076-100760680 = "Não tem problema nenhum."
10076-100760690 = "Zelar pelo descanso das alunas também faz parte do trabalho de um Sensei."
10076-100760700 = "Hã?"
10076-100760710 = "É mesmo?"
10076-100760720 = "Huum..."
10076-100760730 = "Bom, se você está dizendo, Sensei...?"
10076-100760740 = "De todo modo, muito obrigada! Graças a você já estou 100% recuperada, Sensei!!"
10076-100760750 = "Com licença, até mais!!"
10076-100760760 = "Nossa, já é tão tarde assim?"
10076-100760770 = "Num piscar de olhos, o Grande Festival Esportivo já está chegando ao fim."
10076-100760780 = "De algum jeito,"
10076-100760790 = "hum,"
10076-100760800 = "dá uma sensação meio estranha."
10076-100760810 = "Não queria que acabasse?"
10076-100760820 = "Isso é prova de que você deu o seu melhor."
10076-100760830 = "Será que é isso?"
10076-100760840 = "Huum..."
10076-100760850 = "Acho que vou"
10076-100760860 = "refletir mais um pouquinho sobre esse sentimento."
