[translation]
20019-200190010 = "Доброе утро, Хозяин."
20019-200190020 = "Горничная — это та, чья работа — служение."
20019-200190030 = "Та, кто служит Хозяину, носит форму горничной..."
20019-200190040 = "Хм... да, наверное?"
20019-200190050 = "Но я так думала до недавнего времени,"
20019-200190060 = "а недавно я осознала кое-что новое."
20019-200190070 = "Ждите с нетерпением."
20019-200190080 = "У... угу?"
20019-200190090 = "Будем ждать с нетерпением?"
20019-200190100 = "Если у вас будет время, не зайдёте ли ко мне в комнату?"
20019-200190110 = "Буду ждать."
20019-200190120 = "Мой Хозяин."
20019-200190130 = "Прошу прощения за то, что было на днях."
20019-200190140 = "Я слишком увлеклась и допустила грубость."
20019-200190150 = "Мне очень жаль."
20019-200190160 = "Нет... это я должен извиниться."
20019-200190170 = "Наоборот, я вам очень благодарна!"
20019-200190180 = "Разрешите мне снова вам послужить?"
20019-200190190 = "Успокоимся и проведём время вдвоём..."
20019-200190200 = "Т-ты ведь не имеешь ничего дурного в виду?"
20019-200190210 = "Пожалуйста, обязательно!"
20019-200190220 = "Эм... а что это значит?"
20019-200190230 = "Я успокоилась... буду ждать вас."
20019-200190240 = "Вы хорошо выспались, Хозяин?"
20019-200190250 = "Благодаря тебе я крепко спал."
20019-200190260 = "Как хорошо."
20019-200190270 = "На самом деле, в тех чайных листьях..."
20019-200190280 = "говорят, есть расслабляющий эффект, улучшающий качество сна..."
20019-200190290 = "Если хоть немного сняло вашу усталость, значит, я заварила не зря."
20019-200190300 = "Вот оно что. Спасибо."
20019-200190310 = "Приятно слышать."
20019-200190320 = "Ведь счастье Хозяина — это моё счастье."
20019-200190330 = "Кстати, у тебя, Акане, было какое-то дело в Шале?"
20019-200190340 = "Или ты пришла убираться?"
20019-200190350 = "Как знать?"
20019-200190360 = "Я только скажу, что мне повезло"
20019-200190370 = "увидеть лицо спящего Хозяина."
20019-200190380 = "Прыг-прыг."
20019-200190390 = "Как у вас продвигаются дела, Хозяин?"
20019-200190400 = "У меня сегодня выходной."
20019-200190410 = "Давно у меня не было свободного времени."
20019-200190420 = "Что ты обычно делаешь в выходные, Акане?"
20019-200190430 = "Ну,"
20019-200190440 = "хочется многого, но..."
20019-200190450 = "желание лишь одно."
20019-200190460 = "Случайно... по-настоящему случайно,"
20019-200190470 = "было бы приятно встретить Хозяина..."
20019-200190480 = "Я думала об этом."
20019-200190490 = "Добрый вечер. Вы снова возвращаетесь поздно?"
20019-200190500 = "Я беспокоюсь о вашем здоровье..."
20019-200190510 = "Ура, работа... Я так люблю работу..."
20019-200190520 = "Кто же придумал эти бумаги на свете..."
20019-200190530 = "Хозяин!? Придите в себя!!"