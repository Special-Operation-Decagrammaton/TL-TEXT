[translation]
20019-200190010 = "Здравствуйте, Мастер."
20019-200190020 = "Предназначение горничной — служить."
20019-200190030 = "Поэтому в своей основе форма горничной — это одежда для служения."
20019-200190040 = "Эм... Да? Наверное?"
20019-200190050 = "Да! Я рада, что ты понимаешь, Сенсей."
20019-200190060 = "И... недавно меня осенило."
20019-200190070 = "Ну-ну. Не слишком возбуждайся."
20019-200190080 = "Возбуждаться... из-за чего именно?"
20019-200190090 = "Ну, не знаю, о чём ты, но я уже жду с нетерпением!"
20019-200190100 = "Можешь заглянуть ко мне в комнату, когда освободишься?"
20019-200190110 = "Я буду ждать."
20019-200190120 = "Мастер!"
20019-200190130 = "Раньше я немного нагрубила..."
20019-200190140 = "Я слишком увлеклась..."
20019-200190150 = "Хочу извиниться."
20019-200190160 = "Нет-нет. Ты ничего плохого не сделала."
20019-200190170 = "Если уж на то пошло, это я должен тебя благодарить!"
20019-200190180 = "...Позволишь мне снова тебе послужить?"
20019-200190190 = "Я окажу особую, персональную услугу. Без ограничений."
20019-200190200 = "У тебя ведь нет никаких скрытых мотивов?!"
20019-200190210 = "Вообще-то это стоило спросить первым делом!"
20019-200190220 = "Хм? О чём ты вообще можешь говорить?"
20019-200190230 = "Ну... Мне уже немного лучше. Буду ждать тебя!"
20019-200190240 = "Ты хорошо спал, Мастер?"
20019-200190250 = "Как младенец, благодаря тебе."
20019-200190260 = "Какое облегчение."
20019-200190270 = "Чай, который я для тебя приготовила..."
20019-200190280 = "Он должен помогать расслабиться и хорошо спать."
20019-200190290 = "Я рада, что сработало!"
20019-200190300 = "Теперь понятно, почему меня так клонило в сон! Спасибо."
20019-200190310 = "Разумеется, Сенсей."
20019-200190320 = "Я счастлива, что смогла быть полезна."
20019-200190330 = "Кстати, что привело тебя в Шале? Дела?"
20019-200190340 = "Уборка?"
20019-200190350 = "Ну..."
20019-200190360 = "Скажем так..."
20019-200190370 = "Мне очень повезло застать тебя спящим."
20019-200190380 = "Прыг-прыг."
20019-200190390 = "Как работа, Мастер?"
20019-200190400 = "Я? У меня первый выходной за очень долгое время."
20019-200190410 = "Даже не помню, когда в последний раз у меня было время на себя."
20019-200190420 = "Что будешь делать в редкое свободное время, Аканэ?"
20019-200190430 = "Хм..."
20019-200190440 = "У меня довольно длинный список того, чем хотелось бы заняться."
20019-200190450 = "Но есть одна вещь на са-а-амом верху..."
20019-200190460 = "Может быть... случайно... я могла бы..."
20019-200190470 = "...провести это время с тобой, Мастер?"
20019-200190480 = "Это пункт номер один в моём списке."
20019-200190490 = "Ты сегодня тоже работаешь допоздна?"
20019-200190500 = "Это плохо для здоровья..."
20019-200190510 = "Хи-хи... хи... Я люблю... работу... Бесконечные стопки..."
20019-200190520 = "Кто, чёрт возьми, придумал документы..."
20019-200190530 = "Мастер? Проснись, Мастер!"
