[translation]
20019-200190010 = "Bom dia, meu Mestre."
20019-200190020 = "Uma maid é aquela cujo dever é servir."
20019-200190030 = "E quem serve ao seu Mestre veste um uniforme de maid..."
20019-200190040 = "Hum... Acho que sim?"
20019-200190050 = "Era o que eu sempre pensei, mas..."
20019-200190060 = "Recentemente, cheguei a uma nova descoberta."
20019-200190070 = "Por favor, aguarde ansiosamente para ver."
20019-200190080 = "H-Hã?"
20019-200190090 = "Pode deixar que vou aguardar...?"
20019-200190100 = "Quando tiver um tempinho livre, você poderia dar uma passada no meu quarto?"
20019-200190110 = "Estarei esperando por você."
20019-200190120 = "Meu querido Mestre..."
20019-200190130 = "Peço mil desculpas pelo que aconteceu no outro dia."
20019-200190140 = "Na minha empolgação, acabei cometendo uma grande indelicadeza."
20019-200190150 = "Sinto muito mesmo."
20019-200190160 = "Imagina... Eu é que peço desculpas."
20019-200190170 = "Pelo contrário, meu coração está transbordando de gratidão!"
20019-200190180 = "Você me permitiria servi-lo mais uma vez?"
20019-200190190 = "Desta vez, com os ânimos mais calmos... em um momento só nosso."
20019-200190200 = "N-Não há segundas intenções nisso, né?"
20019-200190210 = "Com todo prazer!"
20019-200190220 = "Hum... O que exatamente você quer dizer com isso?"
20019-200190230 = "Que alívio... Estarei esperando por você, então."
20019-200190240 = "Conseguiu dormir bem, meu Mestre?"
20019-200190250 = "Graças a você, dormi como uma pedra."
20019-200190260 = "Que maravilha."
20019-200190270 = "Na verdade, aquelas folhas de chá..."
20019-200190280 = "Têm propriedades relaxantes que ajudam a melhorar a qualidade do sono..."
20019-200190290 = "Se ajudou a aliviar nem que seja um pouquinho do seu cansaço, já valeu a pena ter preparado."
20019-200190300 = "Então era por isso. Muito obrigado."
20019-200190310 = "Suas palavras me deixam muito feliz."
20019-200190320 = "Afinal, a felicidade do meu Mestre é a minha felicidade."
20019-200190330 = "Por sinal, Akane, você tinha vindo até a Schale para resolver algum assunto?"
20019-200190340 = "Ou veio para fazer faxina?"
20019-200190350 = "Quem sabe?"
20019-200190360 = "Direi apenas que tive muita sorte"
20019-200190370 = "por ter conseguido ver o rosto do meu Mestre dormindo."
20019-200190380 = "Pyon, pyon."
20019-200190390 = "Como está indo o trabalho, meu Mestre?"
20019-200190400 = "Hoje eu ganhei o dia de folga."
20019-200190410 = "Faz bastante tempo que não fico com o dia livre assim."
20019-200190420 = "E o que você costuma fazer nos seus dias de folga, Akane?"
20019-200190430 = "Vejamos..."
20019-200190440 = "Há muitas coisas que eu gostaria de fazer, mas..."
20019-200190450 = "O que eu mais desejo no momento é apenas uma coisa."
20019-200190460 = "Por acaso... pode ser totalmente por acaso mesmo..."
20019-200190470 = "Eu ficaria tão feliz se pudesse encontrar o meu Mestre..."
20019-200190480 = "Era nisso que eu estava pensando."
20019-200190490 = "Boa noite. Vai voltar tarde hoje também?"
20019-200190500 = "Fico preocupada com a sua saúde, meu Mestre..."
20019-200190510 = "Ebaaa, trabalho... Eu amo trabalhar..."
20019-200190520 = "Quem foi o infeliz que inventou a papelada neste mundo..."
20019-200190530 = "Meu Mestre?! Mantenha a sanidade, por favor!!"
