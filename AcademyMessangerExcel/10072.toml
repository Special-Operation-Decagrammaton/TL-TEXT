[translation]
10072-100720010 = "Сенсей, чем заняты?"
10072-100720020 = "Отдыхаю."
10072-100720030 = "Ну, дышу..."
10072-100720040 = "?"
10072-100720050 = "Что это значит?"
10072-100720060 = "То есть просто ничего не делаете?"
10072-100720070 = "Раз уж приехали к морю,"
10072-100720080 = "надо делать то, что можно только на море, иначе жалко."
10072-100720090 = "То, что можно только на море..."
10072-100720100 = "Плавать?"
10072-100720110 = "Если только плавать, для этого и бассейн подойдёт?"
10072-100720120 = "В общем..."
10072-100720130 = "пойдём ловить морепродукты!"
10072-100720140 = "Сенсей, можно на минуту?"
10072-100720150 = "Я нашла кое-что интересное."
10072-100720160 = "С этим я точно смогу наловить рыбы!"
10072-100720170 = "Ты нашёл сеть на складе?"
10072-100720180 = "Хе-хе."
10072-100720190 = "Если думаешь, что это просто сеть, ошибаешься."
10072-100720200 = "Лучше покажу наглядно."
10072-100720210 = "Приходи на тот пирс."
10072-100720220 = "В этот раз я угощу тебя лучшим сашими!"
10072-100720230 = "Сенсей."
10072-100720240 = "Я потом заглянул на пирс посмотреть,"
10072-100720250 = "и на поверхности воды плавала пара мелких рыбёшек."
10072-100720260 = "Наверное, от взрывной волны они потеряли сознание."
10072-100720270 = "Говорят, мелкая рыба чувствительна к ударам."
10072-100720280 = "Значит..."
10072-100720290 = "если пропустить высокое напряжение, можно оглушить их всех разом..."
10072-100720300 = "Этого нельзя делать!"
10072-100720310 = "Сенсей, говорят, с западной стороны деревни есть илистая отмель."
10072-100720320 = "Местные сказали, что два раза в день вода уходит,"
10072-100720330 = "и обнажается отмель."
10072-100720340 = "Удивительное явление."
10072-100720350 = "Когда вода уходит, можно легко собирать моллюсков и рыбу."
10072-100720360 = "...На самом деле, когда я получил разрешение на ловлю,"
10072-100720370 = "мне сказали, что на отмель тоже можно заходить."
10072-100720380 = "Так что если есть время, не хочешь сходить вместе?"
10072-100720390 = "Под водой я опозорился, но здесь надо просто подбирать рыбу, которую выбросило. Я не повторю прошлых ошибок..."
10072-100720400 = "В этот раз я точно угощу тебя лучшими морепродуктами!"
10072-100720410 = "В итоге план угостить Сенсея вкуснятиной провалился."
10072-100720420 = "Я думала, поймаю дорогую рыбу и отблагодарю за всё..."
10072-100720430 = "Вы ведь меня много чем угощали?"
10072-100720440 = "Суп из морских водорослей..."
10072-100720450 = "И морских червей...?"
10072-100720460 = "Было вкусно, но..."
10072-100720470 = "всё это можно купить на рынке..."
10072-100720480 = "Вы столько времени со мной провели, а я..."
10072-100720490 = "Еда, которую я ем с Саки, — самая вкусная."
10072-100720500 = "Ах...!"
10072-100720510 = "Не говорите так, трудно понять, шутите вы или серьёзно..."
