[translation]
10072-100720010 = "Сенсей, что вы сейчас делаете?"
10072-100720020 = "Дышать..."
10072-100720030 = "Расслабляться."
10072-100720040 = "...?"
10072-100720050 = "Что это за ответ."
10072-100720060 = "Звучит так, будто ты вообще ничего не делаешь."
10072-100720070 = "Мы приехали к морю. Ты собираешься потратить всю поездку впустую?"
10072-100720080 = "Раз уж мы на пляже, нужно заниматься пляжными делами."
10072-100720090 = "Пляжными делами, значит..."
10072-100720100 = "Например, плаванием?"
10072-100720110 = "Нет, я не про игры и безделье."
10072-100720120 = "То есть..."
10072-100720130 = "Ловить морепродукты!"
10072-100720140 = "Сенсей, вы сейчас заняты?"
10072-100720150 = "Я случайно наткнулась на потрясающую штуку!"
10072-100720160 = "С ней я смогу поймать даже самую большую рыбу!"
10072-100720170 = "Ты нашла рыболовную сеть?"
10072-100720180 = "Сеть?"
10072-100720190 = "Ничего настолько банального, как сеть."
10072-100720200 = "Здесь не объяснить. Ты должен увидеть сам."
10072-100720210 = "Можешь прямо сейчас прийти к пристани?"
10072-100720220 = "После этого я угощу тебя лучшими сашими!"
10072-100720230 = "Сенсей."
10072-100720240 = "Позже я вернулась к пристани и обнаружила"
10072-100720250 = "маленьких рыбок, плавающих на поверхности."
10072-100720260 = "Наверное, их оглушило взрывом, который я устроила раньше."
10072-100720270 = "Похоже, мелкая рыба уязвима к внешним ударам."
10072-100720280 = "Значит..."
10072-100720290 = "можно подключить автомобильный аккумулятор и пропустить ток через воду, чтобы оглушить рыбу!"
10072-100720300 = "Так нельзя!"
10072-100720310 = "Сенсей, ты знал, что к западу от города есть ваттовая отмель?"
10072-100720320 = "По словам местных, дважды в день вода у западного берега отступает"
10072-100720330 = "и открывает илистую отмель!"
10072-100720340 = "Потрясающе."
10072-100720350 = "Много рыбы остаётся в лужах после отлива, и её легко ловить."
10072-100720360 = "В прошлый раз, когда я спросила, можно ли рыбачить у их берега,"
10072-100720370 = "они ещё сказали, что я могу пользоваться отмелью."
10072-100720380 = "Если есть время, встретимся на западном берегу города?"
10072-100720390 = "В этот раз мне не придётся заходить в воду, так что старые ошибки точно не повторятся..."
10072-100720400 = "На этот раз я правда поймаю для тебя что-нибудь особенное!"
10072-100720410 = "В итоге я так и не поймала для тебя ничего хорошего..."
10072-100720420 = "Я думала, что точно смогу угостить тебя роскошным блюдом из морепродуктов..."
10072-100720430 = "Благодаря тебе я попробовал много вкусных морепродуктов!"
10072-100720440 = "Попробовал жирного морского червя..."
10072-100720450 = "И суп из водорослей..."
10072-100720460 = "Они были вкусными, но..."
10072-100720470 = "ничего такого, чего нельзя было бы купить на рынке."
10072-100720480 = "После всего времени, которое ты потратил со мной, ты заслуживал чего-то получше..."
10072-100720490 = "Саки, от осознания того, как усердно ты старалась, всё было ещё вкуснее."
10072-100720500 = "Иногда ты говоришь такие вещи, Сенсей..."
10072-100720510 = "И я не могу понять, ты добрый или дразнишь меня..."
