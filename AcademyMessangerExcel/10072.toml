[translation]
10072-100720010 = "Sensei, o que está fazendo agora?"
10072-100720020 = "Estou fazendo uma pausa."
10072-100720030 = "Respirando, eu acho..."
10072-100720040 = "?"
10072-100720050 = "Que resposta é essa?"
10072-100720060 = "Quer dizer que está à toa?"
10072-100720070 = "Já que viemos até a praia,"
10072-100720080 = "seria um desperdício não fazer coisas que só dão para fazer no mar."
10072-100720090 = "Coisas que só dão para fazer no mar..."
10072-100720100 = "Tipo nadar?"
10072-100720110 = "Se for só para nadar, uma piscina já resolve, não acha?"
10072-100720120 = "O que eu quero dizer é..."
10072-100720130 = "Vamos caçar frutos do mar!"
10072-100720140 = "Sensei, tem um minutinho?"
10072-100720150 = "Acabei de achar uma coisa bem interessante."
10072-100720160 = "Com isso aqui, dessa vez sim vou conseguir pescar peixes para você, Sensei!"
10072-100720170 = "Achou uma rede no depósito ou algo assim?"
10072-100720180 = "Heheh."
10072-100720190 = "Se acha que é só uma rede comum, está muito enganado."
10072-100720200 = "É melhor eu te mostrar pessoalmente."
10072-100720210 = "Venha até aquele quebra-mar de antes."
10072-100720220 = "Dessa vez eu juro que vou fazer você comer um sashimi de primeira, Sensei!"
10072-100720230 = "Sensei."
10072-100720240 = "Depois daquilo, voltei ao quebra-mar para dar uma olhada"
10072-100720250 = "e tinha alguns peixinhos boiando na superfície da água."
10072-100720260 = "Provavelmente desmaiaram com a onda de choque da explosão."
10072-100720270 = "Dizem mesmo que peixes pequenos são bem sensíveis a ondas de choque."
10072-100720280 = "Espera, então isso quer dizer que..."
10072-100720290 = "Se a gente jogar uma corrente de alta tensão na água, dá para apagar um cardume inteiro de uma vez..."
10072-100720300 = "Nem pensar! Isso é totalmente proibido!"
10072-100720310 = "Sensei, parece que tem uma planície de maré no lado oeste da vila."
10072-100720320 = "Perguntei aos moradores e disseram que a maré baixa duas vezes por dia,"
10072-100720330 = "revelando um grande banco de lama e areia."
10072-100720340 = "É um fenômeno curioso da natureza, né?"
10072-100720350 = "Quando a maré baixa, dá para catar mariscos e peixes com a maior facilidade."
10072-100720360 = "...Na verdade, quando conseguimos a permissão para coletar frutos do mar,"
10072-100720370 = "disseram que a gente também podia entrar nessa área de maré baixa."
10072-100720380 = "Então, se tiver um tempo livre, não quer ir lá comigo?"
10072-100720390 = "Debaixo d'água eu dei vexame, mas agora é só catar os peixes que ficam presos na lama. Não vou repetir o mesmo erro..."
10072-100720400 = "Desta vez sim, vou fazer você provar frutos do mar da mais alta qualidade, Sensei!"
10072-100720410 = "No fim das contas, a operação para fazer o Sensei comer frutos do mar deliciosos falhou."
10072-100720420 = "Eu queria tanto pescar um peixe nobre para agradecer por tudo o que você faz por nós..."
10072-100720430 = "Mas você preparou várias coisas boas para mim, não foi?"
10072-100720440 = "Tipo aquela sopa de algas..."
10072-100720450 = "E aquele verme-colher...?"
10072-100720460 = "Estava gostoso sim, mas..."
10072-100720470 = "São todos ingredientes simples que dá para comprar em qualquer mercado..."
10072-100720480 = "E olha que você me acompanhou o dia inteiro, Sensei..."
10072-100720490 = "Qualquer refeição ao seu lado já é a mais deliciosa de todas, Saki."
10072-100720500 = "Guh...!"
10072-100720510 = "Para com isso, fica difícil saber se você está falando sério ou só tirando sarro da minha cara..."
