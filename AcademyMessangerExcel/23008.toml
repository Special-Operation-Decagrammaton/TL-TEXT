[translation]
23008-230080010 = "Que a paz e a serenidade estejam com todos vocês hoje também."
23008-230080020 = "Se tiverem qualquer preocupação ou aflição, por favor, venham nos procurar a qualquer momento."
23008-230080030 = "Para aqueles que não puderem vir até nós, iremos até onde estiverem. Por favor, sintam-se à vontade para nos chamar."
23008-230080040 = "Ah"
23008-230080050 = "M-me desculpe..."
23008-230080060 = "Acabei enviando para você por engano, Sensei."
23008-230080070 = "Será que eu também posso ir?"
23008-230080080 = "Mesmo não sendo aluno, tudo bem se eu for?"
23008-230080090 = "Ah, sim."
23008-230080100 = "É claro."
23008-230080110 = "Sendo assim, estarei te esperando com muita alegria."
23008-230080120 = "Sensei, está tudo bem com você desde aquele incidente?"
23008-230080130 = "Um enfeite despencar daquele jeito do nada... Que susto, não é?"
23008-230080140 = "Se sentir dor em algum lugar, por favor, me avise a qualquer momento. Ou melhor, talvez seja bom irmos ao hospital juntos agora mesmo..."
23008-230080150 = "Estou bem, desculpa te preocupar. Acho que você cuida mesmo muito bem de mim."
23008-230080160 = "Mesmo assim, não posso desistir..."
23008-230080170 = "..."
23008-230080180 = "?"
23008-230080190 = "Hum...?"
23008-230080200 = "Sensei, como você tem passado?"
23008-230080210 = "Aquele machucado do outro dia já sarou...?"
23008-230080220 = "Obrigado. Não precisa se cobrar tanto assim, estou bem."
23008-230080230 = "Sim, estou ótimo. Não se preocupe."
23008-230080240 = "Não, não posso deixar isso de lado."
23008-230080250 = "Como alguém que almeja se tornar uma Irmã, não posso simplesmente ignorar algo assim."
23008-230080260 = "Preciso rezar para que nada parecido volte a acontecer daqui para frente..."
23008-230080270 = "Aliás,"
23008-230080280 = "hoje por acaso é um dia sem nenhum compromisso na Catedral."
23008-230080290 = "Se você quiser, Sensei..."
23008-230080300 = "Chegou bem em casa, Sensei?"
23008-230080310 = "Graças à sua visita hoje, meu coração também ficou em paz."
23008-230080320 = "No fim das contas, embora eu dissesse que era por você, parece que acabou sendo para o meu próprio bem também."
23008-230080330 = "...Isso me deixa um pouco preocupada. Pensando assim, tenho receio de que pensar em você acabe se tornando uma motivação impura..."
23008-230080340 = "Acho que não tem problema nenhum nisso, né...?"
23008-230080350 = "Mas graças a você eu também me senti muito mais calmo hoje. Obrigado."
23008-230080360 = "Hehe, se foi assim, fico muito aliviada."
23008-230080370 = "Fico muito feliz em ouvir você dizer isso."
23008-230080380 = "Então, Sensei,"
23008-230080390 = "nos vemos em uma próxima vez."
23008-230080400 = "Que a paz e a serenidade estejam com todos vocês hoje também."
23008-230080410 = "Se tiverem qualquer preocupação ou aflição, por favor, venham nos procurar a qualquer momento."
23008-230080420 = "Contudo, hoje eu não estarei na Catedral..."
23008-230080430 = "Mari, você vai sair para algum lugar hoje?"
23008-230080440 = "Parece que o dia está corrido aí, bom trabalho."
23008-230080450 = "Ah, não, não é que eu tenha algum compromisso em especial, mas..."
23008-230080460 = "É que acabei ficando um pouquinho indisposta..."
23008-230080470 = "Você está bem?!"
23008-230080480 = "Pegou um resfriado?!"
23008-230080490 = "M-me desculpe."
23008-230080500 = "Acabei deixando você preocupado à toa..."
23008-230080510 = "Não são sintomas graves, então acho que vou melhorar logo se descansar um pouco."
23008-230080520 = "Me desculpe, acabei pegando no sono sem perceber..."
23008-230080530 = "Não consegui te dizer na hora, mas muito obrigada mesmo."
23008-230080540 = "Não sei se isso serve como forma de retribuir o favor, mas..."
23008-230080550 = "E embora seja algo que eu já faça sempre,"
23008-230080560 = "vou rezar por você novamente, Sensei."
23008-230080570 = "Bom dia, Sensei."
23008-230080580 = "Hum, você teria um tempinho agora...?"
23008-230080590 = "Sim, o que houve?"
23008-230080600 = "Tenho sim, pode falar."
23008-230080610 = "Muito obrigada."
23008-230080620 = "Hum, este..."
23008-230080630 = "Desculpe, não sei bem como dizer... Não estou muito acostumada com esse tipo de coisa..."
23008-230080640 = "Se não for incômodo, poderíamos nos encontrar em algum lugar para conversar?"
23008-230080650 = "Ah, hum, não aconteceu nenhum incidente nem é nenhuma preocupação grave, só para deixar claro..."
23008-230080660 = "Bom, vou te mandar o horário e os detalhes daqui a pouco."
23008-230080670 = "Conto com você."
23008-230080680 = "Sensei, muito obrigada por hoje."
23008-230080690 = "Eu fiquei realmente muito feliz."
23008-230080700 = "Talvez eu entre em contato de vez em quando daqui para frente também..."
23008-230080710 = "Espero não incomodar. Então, até mais."
23008-230080720 = "Sensei"
23008-230080730 = "...Só quis te chamar mesmo."
23008-230080740 = "Bom dia, Sensei."
23008-230080750 = "Hum... Se você tiver um tempinho livre..."
23008-230080760 = "Tenho sim. O que houve?"
23008-230080770 = "Se houver algo em que eu possa ajudar, é só dizer."
23008-230080780 = "Muito obrigada...!"
23008-230080790 = "Vou sair para comprar alguns suprimentos da Irmandade,"
23008-230080800 = "mas acho que não vou dar conta de carregar tudo sozinha..."
23008-230080810 = "Se estiver tudo bem para você, será que poderia me acompanhar...?"
23008-230080820 = "Claro, deixa comigo."
23008-230080830 = "Para onde devo ir?"
23008-230080840 = "Muito obrigada! Vou te mandar a localização agora mesmo."
23008-230080850 = "Muito obrigada mesmo por hoje."
23008-230080860 = "Depois da refeição, você ainda me acompanhou até a academia..."
23008-230080870 = "Tem certeza de que não precisava comprar o acessório?"
23008-230080880 = "Hehe, já está tudo bem."
23008-230080890 = "Graças à nossa conversa de hoje, Sensei,"
23008-230080900 = "decidi cuidar com ainda mais carinho do meu corsage."
23008-230080910 = "...Por enquanto, isso já é mais do que suficiente para mim."
