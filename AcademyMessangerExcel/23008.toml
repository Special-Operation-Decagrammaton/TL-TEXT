[translation]
23008-230080010 = "Пусть сегодня с вами будут мир и счастье."
23008-230080020 = "Если вас что-то тревожит, пожалуйста, обратитесь к сестре, пока не стало слишком поздно."
23008-230080030 = "Если вам трудно прийти к нам, сообщите, и мы придём к вам."
23008-230080040 = "..."
23008-230080050 = "О."
23008-230080060 = "Простите. Я отправила вам не то сообщение."
23008-230080070 = "Можно я приду к тебе?"
23008-230080080 = "Неважно, что я не студент?"
23008-230080090 = "О."
23008-230080100 = "Да, конечно."
23008-230080110 = "Я с радостью буду вас ждать."
23008-230080120 = "Вы в порядке, Сенсей?"
23008-230080130 = "Я испугалась, когда украшение внезапно упало..."
23008-230080140 = "Если где-нибудь болит, скажите. Я пойду с вами в больницу..."
23008-230080150 = "Я в порядке. Это была божественная кара."
23008-230080160 = "Не думайте, что я так просто сдамся."
23008-230080170 = "..."
23008-230080180 = "...?"
23008-230080190 = "Простите...?"
23008-230080200 = "Сегодня у вас был хороший день, Сенсей?"
23008-230080210 = "Меня всё ещё тревожит то, что произошло в прошлый раз..."
23008-230080220 = "Тебе не о чем беспокоиться."
23008-230080230 = "То, что произошло в прошлый раз...? Когда упало украшение?"
23008-230080240 = "Нет."
23008-230080250 = "Как будущая сестра, я не могу просто оставить это."
23008-230080260 = "Отныне я буду молиться за вашу безопасность, Сенсей."
23008-230080270 = "Ох..."
23008-230080280 = "Если подумать, сегодня в соборе ничего не запланировано."
23008-230080290 = "Так что, если вы не против..."
23008-230080300 = "Вы благополучно добрались домой, Сенсей?"
23008-230080310 = "После того как вы сегодня пришли, мне стало гораздо спокойнее."
23008-230080320 = "На самом деле я говорила, что молюсь за вас, но, возможно, эта молитва была больше для меня самой."
23008-230080330 = "Если так, надеюсь, вы не сочли мои мотивы неуважительными."
23008-230080340 = "Не думаю."
23008-230080350 = "Спасибо. Благодаря вам мне стало легче."
23008-230080360 = "Правда?"
23008-230080370 = "Отлично, я очень рада."
23008-230080380 = "Ну тогда..."
23008-230080390 = "До следующего раза, Сенсей."
23008-230080400 = "Пусть сегодня с вами будут мир и счастье."
23008-230080410 = "Если у вас есть какие-то трудности, я молюсь, чтобы они разрешились как можно скорее."
23008-230080420 = "Сегодня я не смогу встретиться с вами в соборе. Прошу вашего понимания."
23008-230080430 = "Мари, тебя сегодня нет в соборе?"
23008-230080440 = "Наверное, ты сегодня занята."
23008-230080450 = "Нет, Сенсей, дело не в этом. Ничего серьёзного."
23008-230080460 = "Просто я не очень хорошо себя чувствую..."
23008-230080470 = "Тебе плохо?!"
23008-230080480 = "Ты заболела? Простыла?"
23008-230080490 = "О, прости."
23008-230080500 = "Наверное, мне не стоило говорить. Правда, ничего страшного."
23008-230080510 = "Я просто немного сонная, но после отдыха мне станет лучше."
23008-230080520 = "Я уснула и забыла вам сообщить."
23008-230080530 = "Большое спасибо, что пришли сегодня, Сенсей."
23008-230080540 = "Мне почти нечем отплатить,"
23008-230080550 = "поэтому вместо этого я всегда буду молиться за вас."
23008-230080560 = "Как и делала до сих пор."
23008-230080570 = "Здравствуйте, Сенсей."
23008-230080580 = "Вы... сейчас свободны? Я не мешаю?"
23008-230080590 = "Совсем нет. Что случилось?"
23008-230080600 = "Конечно, ты не мешаешь."
23008-230080610 = "Рада это слышать."
23008-230080620 = "Эм..."
23008-230080630 = "Простите, я не привыкла к таким вещам..."
23008-230080640 = "Если вы не против, я хотела спросить, можем ли мы назначить день для встречи."
23008-230080650 = "О, ничего плохого не случилось, если вы вдруг начали волноваться..."
23008-230080660 = "Я рада, что вы не против. И спасибо."
23008-230080670 = "Тогда увидимся, Сенсей."
23008-230080680 = "Сенсей. Огромное спасибо за сегодня."
23008-230080690 = "Не знаю, как вы, но я очень счастлива."
23008-230080700 = "Возможно, отныне я буду чаще просить вас о помощи."
23008-230080710 = "Если будешь — рассчитывай на меня. В любом случае, поговорим позже."
23008-230080720 = "Сенсей"
23008-230080730 = "Простите, я просто хотела ещё раз вас окликнуть."
23008-230080740 = "Здравствуйте, Сенсей."
23008-230080750 = "Если у вас сегодня случайно есть время,"
23008-230080760 = "Конечно помню."
23008-230080770 = "Где я нужен?"
23008-230080780 = "К-Какой быстрый ответ..."
23008-230080790 = "Сегодня я отвечаю за закупку припасов для Сестринства."
23008-230080800 = "Я подумала, что мне одной будет слишком тяжело всё нести."
23008-230080810 = "Простите за неудобство, я просто надеялась..."
23008-230080820 = "Это как раз моя специализация!"
23008-230080830 = "Где встретимся?"
23008-230080840 = "Как всегда, спасибо, Сенсей..."
23008-230080850 = "Спасибо за всё сегодня, Сенсей."
23008-230080860 = "За то, что пошли со мной, и даже угостили."
23008-230080870 = "Хотя я тоже хотела купить вам аксессуары."
23008-230080880 = "Хи-хи, я совсем так не думаю."
23008-230080890 = "Благодаря вашему одобрению"
23008-230080900 = "чувства, которые несёт этот корсаж, навсегда останутся для меня драгоценными."
23008-230080910 = "Этого... достаточно."
