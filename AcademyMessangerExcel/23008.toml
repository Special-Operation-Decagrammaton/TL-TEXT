[translation]
23008-230080010 = "Пусть мир и покой будут с вами сегодня."
23008-230080020 = "Если у вас есть какие-либо заботы, вы всегда можете обратиться к нам."
23008-230080030 = "Если вы не можете прийти сами, мы навестим вас. Пожалуйста, не стесняйтесь."
23008-230080040 = "Ах"
23008-230080050 = "П-простите..."
23008-230080060 = "Я случайно отправила это вам."
23008-230080070 = "Я могу прийти, даже если я не студент?"
23008-230080080 = "Можно прийти, даже если я не студент?"
23008-230080090 = "А, да"
23008-230080100 = "Конечно."
23008-230080110 = "В таком случае, я с нетерпением буду ждать."
23008-230080120 = "Сенсей, как вы себя чувствуете после того случая?"
23008-230080130 = "Как же страшно, когда украшения падают так внезапно..."
23008-230080140 = "Если у вас что-то болит, пожалуйста, скажите мне. Или мы можем прямо сейчас поехать в больницу..."
23008-230080150 = "Всё в порядке, прости, что заставил тебя волноваться. Наверное, ты действительно за мной наблюдаешь."
23008-230080160 = "Но я не могу сдаться..."
23008-230080170 = "..."
23008-230080180 = "?"
23008-230080190 = "Эм...?"
23008-230080200 = "Сенсей, как вы поживаете?"
23008-230080210 = "Та травма уже прошла...?"
23008-230080220 = "Спасибо. Не нужно так переживать, всё хорошо."
23008-230080230 = "Да, я в полном порядке. Не беспокойся."
23008-230080240 = "Нет, так нельзя."
23008-230080250 = "Я собираюсь стать сестрой, и не могу просто игнорировать подобные вещи."
23008-230080260 = "Чтобы это не повторилось, я должна молиться..."
23008-230080270 = "Кстати,"
23008-230080280 = "сегодня в соборе нет никаких дел."
23008-230080290 = "Если вы не против..."
23008-230080300 = "Вы благополучно добрались, Сенсей?"
23008-230080310 = "Благодаря вашему приходу сегодня, моя душа обрела покой."
23008-230080320 = "Похоже, когда я говорю, что это для вас, на самом деле я это делаю и для себя."
23008-230080330 = "...Мне почему-то тревожно. Если так подумать, забота о вас может показаться нечистым мотивом."
23008-230080340 = "Наверное, всё в порядке...?"
23008-230080350 = "Но благодаря тебе я сегодня чувствую себя спокойнее. Спасибо."
23008-230080360 = "Хе-хе, если так, то это замечательно."
23008-230080370 = "Приятно слышать."
23008-230080380 = "Тогда, Сенсей,"
23008-230080390 = "увидимся в следующий раз."
23008-230080400 = "Пусть мир и покой будут с вами сегодня."
23008-230080410 = "Если у вас есть какие-либо заботы, вы всегда можете обратиться к нам."
23008-230080420 = "Однако сегодня меня не будет в соборе..."
23008-230080430 = "Мари, ты сегодня куда-то уходишь?"
23008-230080440 = "Ты выглядишь очень занятой, молодец."
23008-230080450 = "А, нет, никаких особых дел нет..."
23008-230080460 = "Просто я немного приболела..."
23008-230080470 = "Ты в порядке!?"
23008-230080480 = "Простуда!?"
23008-230080490 = "П-простите"
23008-230080500 = "Я вас напрасно встревожила..."
23008-230080510 = "Симптомы незначительные, так что после отдыха должно пройти."
23008-230080520 = "Извините, я случайно уснула..."
23008-230080530 = "Я не успела сказать вам раньше, но большое спасибо."
23008-230080540 = "Не знаю, можно ли это назвать благодарностью, но..."
23008-230080550 = "Как обычно,"
23008-230080560 = "я помолюсь за вас."
23008-230080570 = "Доброе утро, Сенсей."
23008-230080580 = "Эм, у вас есть сейчас время...?"
23008-230080590 = "Да, конечно. Что случилось?"
23008-230080600 = "Всё в порядке."
23008-230080610 = "Спасибо вам."
23008-230080620 = "Ну, понимаете..."
23008-230080630 = "Простите, я не знаю, как сказать... я не привыкла к таким вещам..."
23008-230080640 = "Если можно, не могли бы мы встретиться где-нибудь и поговорить?"
23008-230080650 = "А, нет, это не какое-то происшествие или грустная проблема. Просто на всякий случай..."
23008-230080660 = "Тогда я отправлю вам время позже."
23008-230080670 = "Буду благодарна."
23008-230080680 = "Сенсей, спасибо за сегодня."
23008-230080690 = "Мне правда было очень приятно."
23008-230080700 = "Возможно, я буду иногда писать вам, но..."
23008-230080710 = "Пожалуйста, относитесь ко мне хорошо. До встречи."
23008-230080720 = "Сенсей"
23008-230080730 = "...Я просто позвала."
23008-230080740 = "Доброе утро, Сенсей."
23008-230080750 = "Ну... если у вас есть время..."
23008-230080760 = "Всё в порядке. Что случилось?"
23008-230080770 = "Если я могу помочь, скажите."
23008-230080780 = "Спасибо вам...!"
23008-230080790 = "Я собираюсь купить принадлежности для Сестринства,"
23008-230080800 = "но одной мне будет сложно..."
23008-230080810 = "Если вы не против, не могли бы вы пойти со мной...?"
23008-230080820 = "Да, конечно. Можешь рассчитывать на меня."
23008-230080830 = "Куда мне идти?"
23008-230080840 = "Спасибо! Я сейчас пришлю вам адрес."
23008-230080850 = "Сегодня правда было очень приятно."
23008-230080860 = "Вы проводили меня до академии после обеда..."
23008-230080870 = "Ты уверена, что не хочешь купить украшения?"
23008-230080880 = "Хе-хе, всё в порядке."
23008-230080890 = "После того как мы сегодня поговорили,"
23008-230080900 = "я решила ещё больше дорожить своей брошью."
23008-230080910 = "...Пока мне этого достаточно."