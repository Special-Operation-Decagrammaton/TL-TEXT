[translation]
20015-200150010 = "Аргх! Опять, Сенсей!"
20015-200150020 = "Что значит «опять»?"
20015-200150030 = "Люди снова называют Клуб внутренней дисциплины «каким-то странным»!"
20015-200150040 = "Что? Как грубо!"
20015-200150050 = "Вот именно?! Рада, что вы согласны, Сенсей."
20015-200150060 = "Я просто тренировала свои коронные фразы на площадке. Почему они так говорят? Какие злые!"
20015-200150070 = "...А? Погоди, Каэдэ."
20015-200150080 = "...Что за коронные фразы?"
20015-200150090 = "А? Коронные фразы — это коронные фразы!"
20015-200150100 = "Это фразы, которые Клуб внутренней дисциплины произносит после победы над плохими студентами!"
20015-200150110 = "Я много тренируюсь, чтобы не забыть свою."
20015-200150120 = "Моя звучит так: «Во имя багряных осенних листьев я никогда тебя не прощу!»"
20015-200150130 = "Она очень популярна, так что можете тоже пользоваться, Сенсей!"
20015-200150140 = "А поза вот такая. Хияп! О, я покажу вам видео. Секунду."
20015-200150150 = "П-Понятно. Я-я тебя поддерживаю."
20015-200150160 = "Спасибо за поддержку, Сенсей!"
20015-200150170 = "В ответ отправлю вам милый стикер!"
20015-200150180 = "О, с-спасибо."
20015-200150190 = "В любом случае! Нужно что-то делать! Может, пора принять особые меры?"
20015-200150200 = "Так что у меня просьба!"
20015-200150210 = "Сенсей, как всегда, я буду усердно работать, чтобы стать настоящей леди!"
20015-200150220 = "Хорошо, старайся как всегда."
20015-200150230 = "Но путь настоящей леди такой трудный..."
20015-200150240 = "Позвольте рассказать, насколько он трудный..."
20015-200150250 = "Это может быть даже сложнее, чем ходить на каждую утреннюю зарядку во время летних каникул!"
20015-200150260 = "Это... и правда было бы трудно!"
20015-200150270 = "Правда? Поэтому я очень-очень долго думала!"
20015-200150280 = "И нашла кое-что великолепное!"
20015-200150290 = "Это может быть величайшим открытием века! Расскажу лично!"
20015-200150300 = "Увидимся в клубной комнате, Сенсей!"
20015-200150310 = "Ура! Сенсей, Сенсей!"
20015-200150320 = "Что вы делаете? Можем куда-нибудь сходить... То есть..."
20015-200150330 = "Поможете мне с тренировкой настоящей леди?"
20015-200150340 = "Прости, Каэдэ. Сегодня я немного занят..."
20015-200150350 = "О, правда? Вы всегда работаете!"
20015-200150360 = "Почему вы так любите работать?"
20015-200150370 = "Э-Эм... Не знаю..."
20015-200150380 = "Честно говоря, бумажную работу я не очень люблю..."
20015-200150390 = "Хм, тогда... О, точно! Я однажды слышала такое!"
20015-200150400 = "Иногда взрослым приходится делать вещи, которые им не нравятся..."
20015-200150410 = "Ого, быть взрослым трудно!"
20015-200150420 = "Но... мне кажется, у вас это не «иногда»... Вы делаете так постоянно."
20015-200150430 = "Уф! Ты права. Грустно, но правда."
20015-200150440 = "Не знаю, чем могу помочь..."
20015-200150450 = "...О! Есть идея!"
20015-200150460 = "А? Каэдэ?"
20015-200150470 = "Хи-хи-хи, хорошо! Подождите немного, Сенсей!"
20015-200150480 = "Сегодня я буду особенно хорошей. Вместо того чтобы отвлекать, помогу вам!"
20015-200150490 = "Тогда увидимся позже!"
20015-200150500 = "А? Каэдэ?"
20015-200150510 = "Сенсей! Сенсей! Помогите!!"
20015-200150520 = "Это абсолютное оружие Маскированного Водителя! Аварийный Драйв-Кик!"
20015-200150530 = "А-Аварийный... что?"
20015-200150540 = "Что происходит, Каэдэ? Ты в беде?"
20015-200150550 = "А? В беде...?"
20015-200150560 = "О! Да, точно! Как вы сказали... возможно, у меня большие неприятности!"
20015-200150570 = "Каэдэ, ты ранена?!"
20015-200150580 = "А? Я в порядке. Вообще-то отлично! Я даже сегодня утром позавтракала быстрее всех!"
20015-200150590 = "В любом случае, это не главное, Сенсей!"
20015-200150600 = "Ты только что сказала, что у тебя чрезвычайная ситуация, Каэдэ..."
20015-200150610 = "О! Под чрезвычайной ситуацией я имела в виду..."
20015-200150620 = "О! Нет-нет! Я не могу сообщить такие огромные новости через MomoTalk!"
20015-200150630 = "А вдруг кто-то тайно читает нашу переписку?"
20015-200150640 = "Этого не происходит. Обещаю."
20015-200150650 = "В любом случае, нужно поговорить лично!"
20015-200150660 = "Я буду ждать на площадке. Скорее, Сенсей!"
20015-200150670 = "СенсейСенсейСенсей!"
20015-200150680 = "Наконец-то, наконец-то открывается!"
20015-200150690 = "Мы должны пойти вместе!"
20015-200150700 = "Мне нужен контекст, Каэдэ! Что открывается?"
20015-200150710 = "Эм... А...?"
20015-200150720 = "А! Вы правы! Наверное, вы за таким не следите, Сенсей!"
20015-200150730 = "Открывается временный магазин Mushiqueen!"
20015-200150740 = "А. Я должен был догадаться."
20015-200150750 = "Это прозвучало совершенно без энтузиазма!"
20015-200150760 = "Хи-хи-хи... Но следующая новость, думаю,"
20015-200150770 = "даже вас расшевелит, Сенсей!"
20015-200150780 = "Понимаете... именно в этом временном магазине..."
20015-200150790 = "есть тот самый, единственный... лимитированный протектор для карт Mushiqueen!"
20015-200150800 = "О? В-Вау...?"
20015-200150810 = "Я знала! Вы так взволнованы, что даже не знаете, как это выразить!"
20015-200150820 = "Не волнуйтесь! Просто оставьте всё мне!"
20015-200150830 = "Хорошо, Сенсей! Увидимся в торговом центре!"
20015-200150840 = "Я отправлю место!"
20015-200150850 = "Сенсей?"
20015-200150860 = "Ты нормально добралась домой?"
20015-200150870 = "А ты, Каэдэ? Благополучно дома?"
20015-200150880 = "Конечно!"
20015-200150890 = "Не могу поверить, что протектор для карт теперь и правда мой!"
20015-200150900 = "Как здорово иметь что-то,"
20015-200150910 = "что защищает твои карты, Каэдэ."
20015-200150920 = "А? О чём вы вообще говорите, Сенсей?"
20015-200150930 = "Сам протектор для карт — расходник!"
20015-200150940 = "Если много им пользоваться, он поцарапается."
20015-200150950 = "Очевидно, мне нужно надеть протектор на этот протектор для карт,"
20015-200150960 = "чтобы сохранить его в безопасности даже во время игры!"
20015-200150970 = "Ты надеваешь протектор... на протектор?"
20015-200150980 = "Разве это не здравый смысл?"
20015-200150990 = "Мир баттлеров... сложен..."
20015-200151000 = "А? Почему?"
