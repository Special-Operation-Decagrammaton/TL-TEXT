[translation]
20015-200150010 = "Сенсей! Опять! Опять так же!"
20015-200150020 = "Опять?"
20015-200150030 = "Мне опять сказали, что наш клуб «немного странный»!"
20015-200150040 = "Как грубо с их стороны."
20015-200150050 = "Правда? Вы тоже так считаете, Сенсей?"
20015-200150060 = "Я же просто тренировалась произносить коронную фразу в парке!"
20015-200150070 = "...Что?"
20015-200150080 = "Коронную фразу...?"
20015-200150090 = "А что с коронной фразой?"
20015-200150100 = "Ну конечно! Это фраза, которую мы, клуб воспитания, произносим, когда побеждаем нарушителей порядка!"
20015-200150110 = "Я усердно тренируюсь, чтобы в нужный момент сказать её круто."
20015-200150120 = "Кстати, моя фраза — «Вперёд, от имени Клёна!»"
20015-200150130 = "Если хотите, я позволю вам её использовать, Сенсей!"
20015-200150140 = "А позу надо... ой, нужно снять на видео, подождите."
20015-200150150 = "Л-ладно. В общем, я поддерживаю тебя."
20015-200150160 = "Ага, спасибо, Сенсей!"
20015-200150170 = "За это я дарю вам вот этот милый стикер!"
20015-200150180 = "А, спасибо."
20015-200150190 = "Короче, я должна придумать, как прекратить это «странно»."
20015-200150200 = "Поэтому, Сенсей, у меня к вам просьба!"
20015-200150210 = "Сенсей, сегодня я снова буду стараться стать «прекрасной леди»!"
20015-200150220 = "Да, старайся как обычно."
20015-200150230 = "Но путь к прекрасной леди очень труден..."
20015-200150240 = "Насколько труден? Ну, примерно..."
20015-200150250 = "Как получить штамп каждый день без пропусков на летней карточке зарядки!"
20015-200150260 = "Это правда трудно!"
20015-200150270 = "Вот именно, я ломала голову, как быть, но..."
20015-200150280 = "Мне пришла в голову блестящая идея!"
20015-200150290 = "Можно сказать, это «открытие века»!"
20015-200150300 = "Я расскажу, так что быстро приходите в клубную комнату!"
20015-200150310 = "Привет, Сенсей!"
20015-200150320 = "Сегодня я хочу прийти в Шале, чтобы тренироваться, ну, не в гости,"
20015-200150330 = "а ради самосовершенствования, чтобы стать прекрасной леди. Можно?"
20015-200150340 = "Прости, Каеде, сегодня я немного занят работой..."
20015-200150350 = "Эй, Сенсей, вечно ты работаешь."
20015-200150360 = "Вы так любите работать?"
20015-200150370 = "Ну, как сказать..."
20015-200150380 = "Работать с бумагами я не очень люблю, но..."
20015-200150390 = "Хм... Ах, да, я вспомнила, ты говорил раньше."
20015-200150400 = "Взрослые иногда делают то, что не хотят..."
20015-200150410 = "Взрослым тяжело, да?"
20015-200150420 = "Глядя на вас, я думаю, что у вас это «иногда» бывает слишком часто."
20015-200150430 = "Уф, нечего сказать..."
20015-200150440 = "Ну ладно, в общем,"
20015-200150450 = "Ах, придумала!"
20015-200150460 = "Что придумала?"
20015-200150470 = "Подождите, Сенсей!"
20015-200150480 = "Сегодня я в режиме «серьёзной помощи»!"
20015-200150490 = "Тогда до встречи позже!"
20015-200150500 = "???"
20015-200150510 = "Сенсей! Чрезвычайная ситуация!!"
20015-200150520 = "Чрезвычайная ситуация — это фирменный приём Райдера в маске «Эмердженси Драйв Кик»!"
20015-200150530 = "...Это что?"
20015-200150540 = "Случилось что-то серьёзное?"
20015-200150550 = "Ну, с чего бы начать..."
20015-200150560 = "В общем, случилось нечто ужасное!"
20015-200150570 = "Ты в порядке? Ранений нет?"
20015-200150580 = "Я в полном порядке! Я даже добавки попросила за завтраком!"
20015-200150590 = "Но дело не в этом!"
20015-200150600 = "...?"
20015-200150610 = "В общем, это ЧП!"
20015-200150620 = "Это настолько серьёзно, что я не могу объяснить по MomoTalk!"
20015-200150630 = "Вдруг кто-то подсматривает за нашим чатом!"
20015-200150640 = "Думаю, всё в порядке... наверное."
20015-200150650 = "Короче, я скажу всё при встрече!"
20015-200150660 = "Жду в парке!"
20015-200150670 = "Сенсей, Сенсей!"
20015-200150680 = "Вышло то самое!"
20015-200150690 = "Пошли вместе!!"
20015-200150700 = "То самое?"
20015-200150710 = "Да-да."
20015-200150720 = "Как я и говорила раньше,"
20015-200150730 = "открывается поп-ап магазин Жукокоролевы!"
20015-200150740 = "Ах, да, ты упоминала."
20015-200150750 = "Вот-вот, именно!"
20015-200150760 = "Но это не та Жукокоролева, о которой вы думаете."
20015-200150770 = "Как только услышите, вам обязательно захочется пойти со мной!"
20015-200150780 = "Дело в том, что в этом поп-ап магазине..."
20015-200150790 = "будут продавать лимитированные карты Жукокоролевы!"
20015-200150800 = "О-о!"
20015-200150810 = "Хе-хе, круто, да?"
20015-200150820 = "Я просто обязана их достать...!"
20015-200150830 = "Так что встречаемся у поп-ап магазина!"
20015-200150840 = "Время скину позже!"
20015-200150850 = "Сенсей!"
20015-200150860 = "Вы добрались?"
20015-200150870 = "Да, я добрался. А как ты?"
20015-200150880 = "Отлично! Я тоже в порядке!"
20015-200150890 = "Хорошо, что мы успели купить карты, спасибо!"
20015-200150900 = "Теперь с этими картами"
20015-200150910 = "ты сможешь участвовать в турнирах."
20015-200150920 = "Хм? Я не буду их использовать."
20015-200150930 = "Карты — расходный материал."
20015-200150940 = "Если их использовать, они изнашиваются..."
20015-200150950 = "Если я буду их использовать, то сначала надену поверх прозрачные протекторы,"
20015-200150960 = "сделаю двойную, а то и тройную защиту!"
20015-200150970 = "Тройную защиту...!?"
20015-200150980 = "Ага! Это элементарно для коллекционеров!"
20015-200150990 = "Мир коллекционеров глубок..."
20015-200151000 = "Правда?"