[translation]
20015-200150010 = "Senseeei! Aconteceu de novooo!!"
20015-200150020 = "De novo?"
20015-200150030 = "Falaram de novo que \"o Clube de Treino Espiritual é meio esquisito\"!"
20015-200150040 = "Como assim? Que falta de educação."
20015-200150050 = "Não é?! Você também acha, né, Sensei?"
20015-200150060 = "E eu só estava treinando a minha frase de efeito no parque!"
20015-200150070 = "...Hm?"
20015-200150080 = "Frase de efeito...?"
20015-200150090 = "O que tem a minha frase de efeito?"
20015-200150100 = "Ah, claro que é a frase que nós do Clube de Treino Espiritual falamos na hora de derrotar as encrenqueiras!"
20015-200150110 = "Estou treinando com todo o afinco para conseguir falar de um jeito bem maneiro na hora H!"
20015-200150120 = "Por sinal, a minha frase é: \"Em nome das folhas de outono, avançar\"!"
20015-200150130 = "Como é você, Sensei, eu deixo você usar também como exceção especial, viu?"
20015-200150140 = "Ah, e a pose é assim, ó~ Ué, só gravando em vídeo pra mostrar... Espera só um pouquinho!"
20015-200150150 = "N-Não precisa. Enfim, estou na torcida por você!"
20015-200150160 = "Eba, brigadão, Sensei!"
20015-200150170 = "Para agradecer, vou te dar esta figurinha super fofa de presente!"
20015-200150180 = "O-Obrigado."
20015-200150190 = "Enfim, preciso bolar algum plano para pararem de chamar a gente de \"esquisitas\"!"
20015-200150200 = "Por isso, Sensei, tenho um favor para te pedir!"
20015-200150210 = "Sensei, hoje eu vou continuar dando o meu melhor para me tornar uma \"dama encantadora\"!"
20015-200150220 = "Isso aí, continue firme como sempre."
20015-200150230 = "Mas o caminho para se tornar uma dama encantadora é bem árduo..."
20015-200150240 = "Se eu fosse comparar o quão difícil é..."
20015-200150250 = "É tão difícil quanto conseguir todos os carimbos diários do cartão de ginástica matinal nas férias de verão sem faltar nenhum dia!"
20015-200150260 = "Isso é difícil mesmo!"
20015-200150270 = "Pois é! Eu estava aqui quebrando a cabeça para descobrir o que fazer, mas..."
20015-200150280 = "Acabei de ter uma ideia genial!"
20015-200150290 = "Dá até para chamar de \"a maior descoberta do século\"!"
20015-200150300 = "Vou te contar tudinho, então venha rápido para a sala do Clube de Treino Espiritual!"
20015-200150310 = "Oie, Sensei!"
20015-200150320 = "Hoje eu posso ir aí na Schale para brincar..."
20015-200150330 = "Quer dizer, para fazer o meu treinamento de como me tornar uma dama encantadora?"
20015-200150340 = "Desculpa, Kaede, hoje estou meio enrolado com o trabalho..."
20015-200150350 = "Aaaah, mas você só trabalha o tempo todo, Sensei!"
20015-200150360 = "Você gosta tanto assim de trabalhar?"
20015-200150370 = "B-Bom, sei lá..."
20015-200150380 = "Não posso dizer que sou fã de preencher papelada..."
20015-200150390 = "Huum...? Ah, mas acho que você já me disse uma coisa parecida antes."
20015-200150400 = "Que os adultos, às vezes, precisam fazer coisas que não querem..."
20015-200150410 = "Puxa, ser adulto é difícil, né?"
20015-200150420 = "Olhando para você, Sensei, não me parece que é só \"às vezes\", não..."
20015-200150430 = "Guh, não tenho nem como rebater isso...!"
20015-200150440 = "Bom, de qualquer forma~"
20015-200150450 = "Ah, tive uma ótima ideia!"
20015-200150460 = "Uma ótima ideia?"
20015-200150470 = "Me espere aí, Sensei!"
20015-200150480 = "Porque hoje eu estou no \"modo ajudante super dedicada\"!"
20015-200150490 = "Até daqui a pouco!"
20015-200150500 = "???"
20015-200150510 = "Sensei! Emergência!!"
20015-200150520 = "E falando em emergência, tem o golpe especial do Kamen Driver, o \"Emergency Drive Kick\"!"
20015-200150530 = "...Que isso?"
20015-200150540 = "Aconteceu alguma coisa grave?"
20015-200150550 = "Hum, por onde eu começo a explicar..."
20015-200150560 = "Só sei que aconteceu uma coisa super hiper grave!"
20015-200150570 = "Você está bem? Não se machucou?"
20015-200150580 = "Eu estou ótima! Acabei até de repetir o café da manhã!"
20015-200150590 = "Quer dizer, não é disso que eu estou falando!"
20015-200150600 = "...?"
20015-200150610 = "Enfim, é uma emergência!"
20015-200150620 = "E uma emergência desse nível não dá para contar pelo MomoTalk!"
20015-200150630 = "Vai que tem alguém espionando as nossas mensagens no MomoTalk agora mesmo!"
20015-200150640 = "Acho que quanto a isso não precisa se preocupar... provavelmente."
20015-200150650 = "De qualquer jeito, te conto os detalhes pessoalmente!"
20015-200150660 = "Estou te esperando no parque!"
20015-200150670 = "Sensei, Sensei!"
20015-200150680 = "Finalmente lançaram aquela coisa!"
20015-200150690 = "Vamos lá juntos!!"
20015-200150700 = "Aquela coisa?!"
20015-200150710 = "Isso mesmo!"
20015-200150720 = "Lembra que eu tinha comentado antes?"
20015-200150730 = "Vai abrir uma loja pop-up de Mushiqueen!"
20015-200150740 = "Ah, é verdade, você tinha falado mesmo."
20015-200150750 = "Sim, sim, isso mesmo!"
20015-200150760 = "Mas olha, não é só uma coisinha comum de Mushiqueen como você está pensando!"
20015-200150770 = "Quando você ouvir o que é, com certeza vai querer ir comigo na hora!"
20015-200150780 = "Na verdade, nessa loja pop-up..."
20015-200150790 = "Eles vão vender protetores de cartas de edição limitada de Mushiqueen!"
20015-200150800 = "Opa!"
20015-200150810 = "Hehe, incrível, né?!"
20015-200150820 = "Não dá para perder esses sleeves de edição limitada por nada...!"
20015-200150830 = "Então combinado, a gente se encontra na frente da loja pop-up!"
20015-200150840 = "Depois te mando o horário!"
20015-200150850 = "Sensei!"
20015-200150860 = "Conseguiu chegar bem em casa?"
20015-200150870 = "Cheguei certinho sim, e você, Kaede?"
20015-200150880 = "Que bom! Eu também cheguei bem!"
20015-200150890 = "Ainda bem que conseguimos comprar os sleeves, muito obrigada!"
20015-200150900 = "Agora você já pode usar esses sleeves"
20015-200150910 = "para participar dos torneios, né?"
20015-200150920 = "Hm? Mas eu não vou usar!"
20015-200150930 = "Protetores de carta são itens consumíveis."
20015-200150940 = "Se eu usar, eles vão acabar arranhando e estragando..."
20015-200150950 = "Se for para usar, preciso colocar outro protetor transparente por cima"
20015-200150960 = "para fazer proteção dupla ou tripla!"
20015-200150970 = "Proteção... tripla?!"
20015-200150980 = "Sim! Isso é o básico do básico entre os Battlers, sabia?"
20015-200150990 = "O mundo dos Battlers é mesmo profundo..."
20015-200151000 = "Você acha?"
