[translation]
26017-260170010 = "The signal seems to be really bad."
26017-260170020 = "Sensei"
26017-260170030 = "Sensei"
26017-260170040 = "Sensei"
26017-260170050 = "Good morning, Rana!"
26017-260170060 = "Good morning, Rana!!"
26017-260170070 = "Good morning, Rana!!!"
26017-260170080 = "You have a habit of leaving the exact same message multiple times, Sensei."
26017-260170090 = "It's a good thing. Transferring identical data helps with backups."
26017-260170100 = "There is something I would like to ask you."
26017-260170110 = "Do you think I should switch to a different modem?"
26017-260170120 = "Are you the type of person who uses a utility knife when opening packages?"
26017-260170130 = "Sensei"
26017-260170140 = "300bps still seems too slow."
26017-260170150 = "I probably wouldn't use one if it said 'No Blades Allowed'."
26017-260170160 = "I messed up a bit with that before..."
26017-260170170 = "Ah... I see."
26017-260170180 = "I suppose experience is important."
26017-260170190 = "Sensei, it's Furuhata Rana."
26017-260170200 = "Thank you, that was helpful."
26017-260170210 = "Thank you for your time today, Sensei."
26017-260170220 = "I apologize for not even bringing a souvenir."
26017-260170230 = "Having you come visit is souvenir enough for me, Rana."
26017-260170240 = "Thank you very much."
26017-260170250 = "...There is something that's been bothering me."
26017-260170260 = "Sensei, could you come to the post office in front of Schale?"
26017-260170270 = "Sure, but is something wrong?"
26017-260170280 = "I compared the cost of train fare with the postage rates,"
26017-260170290 = "and since postage was cheaper,"
26017-260170300 = "I thought I'd try utilizing that cardboard box from earlier."
26017-260170310 = "...Huh?"
26017-260170320 = "The postal worker was muttering to themselves about not having enough stamps,"
26017-260170330 = "so when I stepped out of the box to put a stamp on, it turned into a whole situation."
26017-260170340 = "They're asking me to call my guardian."
26017-260170350 = "I'm heading over right now!!!"
26017-260170360 = "There's no need to rush."
26017-260170370 = "They say they still have a lot to talk about."
26017-260170380 = "Ending transmission."
26017-260170390 = "Sen—"
26017-260170400 = "Good morning, Rana! What's wrong?"
26017-260170410 = "Rana?"
26017-260170420 = "Are you okay?? Rana??"
26017-260170430 = "Thank you for coming today."
26017-260170440 = "And thank you for helping me build the charger, it was a big help."
26017-260170450 = "I was so surprised that thing was a charger!"
26017-260170460 = "With this, there's no need to worry about the battery dying."
26017-260170470 = "Unless a blizzard hits, our communications should be fine."
26017-260170480 = "By the way, what were you trying to say on Momotalk just now?"
26017-260170490 = "Hmm."
26017-260170500 = "It's nothing major."
26017-260170510 = "'Sensei, I want to see you.'"
26017-260170520 = "That's what I was about to send."
26017-260170530 = "Ending transmission."
26017-260170540 = "Bugs and patches are such a hassle."
26017-260170550 = "Ah, I forgot to greet you."
26017-260170560 = "Good morning, Sensei. It's Rana."
26017-260170570 = "Good morning, Rana! It's Sensei!"
26017-260170580 = "When things don't go according to plan, it's such a pain."
26017-260170590 = "Received."
26017-260170600 = "While bugs and patches themselves are fun,"
26017-260170610 = "I'm running out of space, so I'm having trouble."
26017-260170620 = "I hope there's a way to resolve this."
26017-260170630 = "Thank you for the external HDD."
26017-260170640 = "I'm already used to the usage instructions you gave me."
26017-260170650 = "It was a huge help."
26017-260170660 = "Glad I could help!"
26017-260170670 = "You could call this a revolutionary advance."
26017-260170680 = "I've saved all the photos we took together, too."
26017-260170690 = "Bug reports, punch cards... I took pictures of them and backed everything up."
26017-260170700 = "What they call computerization."
26017-260170710 = "Thank you very much."
26017-260170720 = "You took pictures and backed them up...?"
26017-260170730 = "Yes. It's paperless."
26017-260170740 = "Thank you very much."
26017-260170750 = "I-I'm glad you're happy with it, Rana!"
26017-260170760 = "Ending transmission."
26017-260170770 = "See you later, Rana!"
26017-260170780 = "ACK"
26017-260170790 = "Good morning, Sensei. It's Rana."
26017-260170800 = "Were you perhaps busy? I've tried contacting you multiple times."
26017-260170810 = "If I was being too clingy, I apologize."
26017-260170820 = "Not at all! I think I just missed it!"
26017-260170830 = "I don't have a record of receiving anything, though. Did you send something?"
26017-260170840 = "Received. I'm glad."
26017-260170850 = "It seems the transmission probably failed."
26017-260170860 = "I sent it via IPoAC, so it looks like packet loss occurred."
26017-260170870 = "Now, onto the main topic."
26017-260170880 = "Sensei, do you like knitting and rock climbing?"
26017-260170890 = "Huh? Not really..."
26017-260170900 = "Yeah! I love them!"
26017-260170910 = "I see."
26017-260170920 = "I'll take that into consideration."
26017-260170930 = "???"
26017-260170940 = "Sensei, how are the gloves?"
26017-260170950 = "Do they fit?"
26017-260170960 = "They fit like a glove and they're super warm!"
26017-260170970 = "Thank you, Rana!"
26017-260170980 = "Received. I'm glad."
26017-260170990 = "I made them based on the memory of when we held hands in the snowfield."
26017-260171000 = "I'm glad they fit."
26017-260171010 = "I'll make you another pair when these wear out."
26017-260171020 = "Until next time."
26017-260171030 = "Ending transmission."
26017-260171040 = "Yeah! See you!"
26017-260171050 = "ACK"
26017-260171060 = "Sensei, sorry for the sudden message."
26017-260171070 = "Do you have a moment?"
26017-260171080 = "Of course! What's up?"
26017-260171090 = "I forgot to greet you."
26017-260171100 = "Good morning, Sensei. It's Rana."
26017-260171110 = "There's someone who says they want to talk to you, Sensei."
26017-260171120 = "Um... err..."
26017-260171130 = "What are they talking about...?"
26017-260171140 = "Since I am not the one who wants to talk to you,"
26017-260171150 = "I don't know either."
26017-260171160 = "I think you'll understand if you come down to the first-floor entrance."
26017-260171170 = "I'm curious as well, so I'd appreciate it if you hurried."
26017-260171180 = "?????????"
26017-260171190 = "Ending transmission."
26017-260171200 = "Arrived safely."
26017-260171210 = "Thanks to you, Sensei. Thank you."
26017-260171220 = "Did you make it back safely as well, Sensei?"
26017-260171230 = "Yeah! I'm glad you made it back safely too, Rana!"
26017-260171240 = "Since you've gone home, Sensei, I will stop waving now."
26017-260171250 = "How can I ever repay you for this kindness?"
26017-260171260 = "I've been gathering gold from discarded circuit boards,"
26017-260171270 = "so if that's acceptable, I'll bring some next time."
26017-260171280 = "Your feelings are more than enough!"
26017-260171290 = "We had a lot of fun today!"
26017-260171300 = "Yes, I had a wonderful time."
26017-260171310 = "Both at the shopping mall and the amusement park."
26017-260171320 = "I'm so glad to hear that!"
26017-260171330 = "What was your favorite part?"
26017-260171340 = "You, Sensei."
