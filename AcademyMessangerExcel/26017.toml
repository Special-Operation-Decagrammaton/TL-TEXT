[translation]
26017-260170010 = "Parece que o sinal está bem ruim por aqui."
26017-260170020 = "Sensei."
26017-260170030 = "Sensei."
26017-260170040 = "Sensei."
26017-260170050 = "Bom dia, Rana!"
26017-260170060 = "Bom dia, Rana!!"
26017-260170070 = "Bom dia, Rana!!!"
26017-260170080 = "Vejo que o Sensei tem o hábito de registrar a mesma informação várias vezes."
26017-260170090 = "Isso é ótimo. A transferência de dados idênticos é muito útil para redundância de backup."
26017-260170100 = "Há uma coisa que eu gostaria de lhe perguntar."
26017-260170110 = "Será que eu deveria trocar para outro modem?"
26017-260170120 = "Quando você abre uma encomenda, costuma usar estilete?"
26017-260170130 = "Sensei."
26017-260170140 = "300 bps realmente parece ser lento demais."
26017-260170150 = "Se estiver escrito \"Proibido usar objetos cortantes\" na caixa, eu não uso."
26017-260170160 = "Já fiz besteira com isso uma vez..."
26017-260170170 = "Humm... entendo."
26017-260170180 = "Acho que a experiência prática é muito importante."
26017-260170190 = "Sensei, aqui é Furuhata Rana."
26017-260170200 = "Muito obrigada, serviu de ótima referência."
26017-260170210 = "Sensei, muito obrigada por hoje."
26017-260170220 = "Peço desculpas por ter ido de mãos abanando, sem nenhuma lembrancinha."
26017-260170230 = "A sua visita já foi o melhor presente pra mim, Rana."
26017-260170240 = "Muito obrigada."
26017-260170250 = "...Surgiu uma questão que me deixou muito intrigada."
26017-260170260 = "Sensei, você poderia vir até a agência dos correios em frente à Schale?"
26017-260170270 = "Posso sim, mas o que aconteceu?"
26017-260170280 = "Comparei o valor da passagem de trem com a tarifa postal,"
26017-260170290 = "e como a tarifa postal saía mais barata,"
26017-260170300 = "resolvi fazer um teste reaproveitando aquela caixa de papelão de agora há pouco."
26017-260170310 = "...Hã?"
26017-260170320 = "Como o funcionário dos correios resmungou sozinho que faltavam selos na caixa,"
26017-260170330 = "saí de dentro da caixa para colar mais selos e acabou dando confusão."
26017-260170340 = "Estão exigindo a presença de um responsável."
26017-260170350 = "TÔ INDO PRAÍ AGORA MESMO!!!"
26017-260170360 = "Pode vir sem pressa."
26017-260170370 = "Disseram que ainda têm uma longa conversa para ter comigo."
26017-260170380 = "Encerrando transmissão."
26017-260170390 = "Sen"
26017-260170400 = "Bom dia, Rana! O que houve?"
26017-260170410 = "Rana?"
26017-260170420 = "Tudo bem aí?? Rana??"
26017-260170430 = "Muito obrigada por ter vindo até aqui hoje."
26017-260170440 = "Sua ajuda na construção do carregador também foi de grande valia."
26017-260170450 = "Fiquei de queixo caído que aquilo tudo era um carregador!"
26017-260170460 = "Agora não há mais risco de a bateria acabar."
26017-260170470 = "A menos que caia uma nevasca pesada, a comunicação deverá funcionar sem problemas."
26017-260170480 = "Aliás, o que você ia me dizer no MomoTalk aquela hora?"
26017-260170490 = "Humm."
26017-260170500 = "Não era nada de mais."
26017-260170510 = "\"Sensei, estou com saudade de você.\""
26017-260170520 = "Era isso o que eu estava tentando enviar."
26017-260170530 = "Encerrando transmissão."
26017-260170540 = "Bugs e patches dão um trabalho danado."
26017-260170550 = "Peço desculpas, esqueci de cumprimentá-lo antes."
26017-260170560 = "Bom dia, Sensei. Aqui é a Rana."
26017-260170570 = "Bom dia, senhorita Rana. Aqui é o Sensei!"
26017-260170580 = "Quando as coisas não saem como planejado dá uma canseira mesmo, né?"
26017-260170590 = "Mensagem recebida."
26017-260170600 = "Lidar com bugs e patches em si é bem divertido,"
26017-260170610 = "mas estou com um problema sério de falta de espaço de armazenamento."
26017-260170620 = "Seria ótimo se houvesse alguma solução."
26017-260170630 = "Muito obrigada pelo HD externo."
26017-260170640 = "Já me acostumei completamente com o modo de uso que o senhor me ensinou."
26017-260170650 = "Ajudou imensamente."
26017-260170660 = "Fico feliz em ter ajudado!"
26017-260170670 = "Pode-se dizer que foi um avanço revolucionário."
26017-260170680 = "Já salvei todas as fotos que tiramos juntos nele."
26017-260170690 = "Os relatórios de bugs e os cartões perfurados também... Tirei foto de cada um e fiz o backup completo."
26017-260170700 = "É o que chamam de informatização."
26017-260170710 = "Muito obrigada."
26017-260170720 = "Backup tirando foto dos cartões perfurados...?"
26017-260170730 = "Sim. Cultura paperless."
26017-260170740 = "Muito obrigada."
26017-260170750 = "Q-Que bom que você gostou, Rana!"
26017-260170760 = "Encerrando transmissão."
26017-260170770 = "Até mais, Rana!"
26017-260170780 = "ACK"
26017-260170790 = "Bom dia, Sensei. Aqui é a Rana."
26017-260170800 = "Por acaso o senhor estava muito ocupado? Tentei entrar em contato várias vezes."
26017-260170810 = "Se eu estiver abusando da sua atenção, peço desculpas."
26017-260170820 = "Imagina! Devo ter deixado passar sem ver!"
26017-260170830 = "Mas não tem nada no meu histórico de chamadas... você mandou por onde?"
26017-260170840 = "Mensagem recebida. Que alívio."
26017-260170850 = "Provavelmente houve uma falha na transmissão."
26017-260170860 = "Enviei os pacotes via IPoAC (IP por Pombos-Correio), mas parece que ocorreu perda de pacotes no caminho."
26017-260170870 = "Pois bem, indo direto ao assunto:"
26017-260170880 = "Sensei, você gosta de tricô e de escalada em rocha?"
26017-260170890 = "Hã? Não muito, pra falar a verdade..."
26017-260170900 = "Sim! Gosto bastante!"
26017-260170910 = "Compreendo."
26017-260170920 = "Registrarei para referência futura."
26017-260170930 = "???"
26017-260170940 = "Sensei, o que achou das luvas?"
26017-260170950 = "O tamanho ficou bom?"
26017-260170960 = "Serviram como uma luva e são super quentinhas!"
26017-260170970 = "Muito obrigado, Rana!"
26017-260170980 = "Mensagem recebida. Fico feliz."
26017-260170990 = "Confeccionei-as com base nos dados de memória de quando você segurou a minha mão no campo de neve."
26017-260171000 = "Que bom que o tamanho ficou exato."
26017-260171010 = "Quando ficarem gastas, farei um par novo para você."
26017-260171020 = "Até breve."
26017-260171030 = "Encerrando transmissão."
26017-260171040 = "Valeu! Até breve!"
26017-260171050 = "ACK"
26017-260171060 = "Sensei, desculpe o contato repentino."
26017-260171070 = "Você teria um minutinho?"
26017-260171080 = "Claro! O que houve?"
26017-260171090 = "Esqueci de cumprimentá-lo antes."
26017-260171100 = "Bom dia, Sensei. Aqui é a Rana."
26017-260171110 = "Dizem que têm um assunto para tratar com você, Sensei."
26017-260171120 = "Hum... peraí..."
26017-260171130 = "Que assunto seria esse...?"
26017-260171140 = "Como não sou eu quem tem algo a tratar,"
26017-260171150 = "eu também não sei dizer."
26017-260171160 = "Acho que você descobrirá assim que vier até a entrada do 1º andar."
26017-260171170 = "Como eu também estou curiosa, agradeceria se pudesse vir depressa."
26017-260171180 = "??????"
26017-260171190 = "Encerrando transmissão."
26017-260171200 = "Cheguei em segurança."
26017-260171210 = "Tudo graças a você, Sensei. Muito obrigada."
26017-260171220 = "O senhor também chegou bem em casa?"
26017-260171230 = "Sim! Que bom que você também chegou direitinho, Rana!"
26017-260171240 = "Como você já chegou em casa, vou parar de acenar agora."
26017-260171250 = "Como eu poderia retribuir toda a sua bondade?"
26017-260171260 = "Venho extraindo ouro de placas de circuito descartadas até hoje;"
26017-260171270 = "se isso servir como retribuição, levarei para você na próxima vez."
26017-260171280 = "Só a sua intenção já vale mais que ouro!"
26017-260171290 = "Hoje foi muito divertido, né?!"
26017-260171300 = "Sim, foi muito divertido."
26017-260171310 = "Tanto o shopping quanto o parque de diversões."
26017-260171320 = "Fico muito feliz em ouvir isso!"
26017-260171330 = "E do que você mais gostou?"
26017-260171340 = "De você, Sensei."
