[translation]
20057-200570010 = "O que está achando da Millennium, Mestre?"
20057-200570020 = "Como você já veio aqui várias vezes, talvez já seja um lugar familiar, mas..."
20057-200570030 = "É verdade que já estou me acostumando, mas..."
20057-200570040 = "Sempre que venho aqui, sinto um ar de novidade"
20057-200570050 = "Ora, então é assim que se sente"
20057-200570060 = "A Millennium é a academia da tecnologia. De fato, é um lugar que evolui a passos largos todos os dias"
20057-200570070 = "Pensando bem... Que tal, de vez em quando, vir fora do horário de trabalho"
20057-200570080 = "para conhecer um pouco do nosso dia a dia?"
20057-200570090 = "Sensei"
20057-200570100 = "Eu gostaria de tentar dar um passo à frente"
20057-200570110 = "Boa, vamos dar o nosso melhor"
20057-200570120 = "Conto com você"
20057-200570130 = "Então vamos virar a noite agora mesmo...!"
20057-200570140 = "E começar a escrever o roteiro da operação 'Vamos Fazer Amizade'!"
20057-200570150 = "Sim, Sensei."
20057-200570160 = "Nós quase viramos a noite juntos"
20057-200570170 = "fazendo simulações"
20057-200570180 = "para criar o 'roteiro', mas..."
20057-200570190 = "Será que vai dar tudo certo mesmo?"
20057-200570200 = "Eu também não sei qual é a resposta certa, mas..."
20057-200570210 = "Vamos tentar primeiro e pensar depois!"
20057-200570220 = "Tem razão... Tudo na vida é tentativa e erro, não é mesmo?"
20057-200570230 = "Olá, Sensei"
20057-200570240 = "Graças a você, sinto que estou conseguindo"
20057-200570250 = "me dar um pouco melhor com as colegas de classe"
20057-200570260 = "Que notícia ótima!"
20057-200570270 = "Eu sabia que você ia se sair bem, Akane"
20057-200570280 = "Muito obrigada"
20057-200570290 = "Hum... Se não for incômodo para você, Sensei..."
20057-200570300 = "Eu gostaria de lhe mostrar como estou agora..."
20057-200570310 = "O que acha?"
20057-200570320 = "— Só nós dois, a sós"
20057-200570330 = "Akane...?"
20057-200570340 = "Hum, Sensei"
20057-200570350 = "Muito obrigada pelo dia de hoje"
20057-200570360 = "Ir embora antes assim..."
20057-200570370 = "Me deixou meio solitário"
20057-200570380 = "Peço mil desculpas..."
20057-200570390 = "Mas é que... hum..."
20057-200570400 = "Foi muito mais..."
20057-200570410 = "embaraçoso do que eu imaginava"
20057-200570420 = "Estive pensando recentemente que"
20057-200570430 = "o meu padrão na hora de fazer a limpeza"
20057-200570440 = "tem ficado um tanto monótono"
20057-200570450 = "Acha que eu deveria buscar abordagens mais criativas?"
20057-200570460 = "Acho que não existem tantas maneiras diferentes assim de fazer faxina..."
20057-200570470 = "Ah, hum..."
20057-200570480 = "Não estou falando desse tipo de limpeza,"
20057-200570490 = "e sim do outro tipo de 'limpeza'..."
20057-200570500 = "Não me diga que..."
20057-200570510 = "...Está falando de explosivos?"
20057-200570520 = "Sim"
20057-200570530 = "É um dilema bastante complexo..."
20057-200570540 = "Muito obrigada pelo seu trabalho até tão tarde hoje..."
20057-200570550 = "E você, Akane, está tudo bem?"
20057-200570560 = "Sim"
20057-200570570 = "Já terminei a revisão e os estudos prévios,"
20057-200570580 = "e os preparativos para amanhã estão impecáveis"
20057-200570590 = "Tudo isso é fruto da sua orientação, Sensei"
20057-200570600 = "Ahaha... Isso quase me faz querer repensar os meus métodos pedagógicos"
20057-200570610 = "Fufu"
20057-200570620 = "Não há nada mais reconfortante"
20057-200570630 = "do que as palavras de alguém que está sempre disposto a refletir sobre si mesmo"
20057-200570640 = "Continuo contando com você daqui para frente,"
20057-200570650 = "...meu Mestre"
