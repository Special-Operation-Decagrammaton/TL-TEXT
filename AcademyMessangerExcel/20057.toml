[translation]
20057-200570010 = "Как вам Миллениум, Хозяин?"
20057-200570020 = "Вы бываете здесь так часто, что, возможно, уже привыкли, но..."
20057-200570030 = "Да, я уже привыкаю, но..."
20057-200570040 = "Каждый раз, когда прихожу, чувствую что-то новое."
20057-200570050 = "О, вот как."
20057-200570060 = "Миллениум — академия технологий. Действительно, место, которое постоянно меняется день ото дня."
20057-200570070 = "Да... иногда, помимо работы,"
20057-200570080 = "не хотите ли взглянуть на нашу повседневную жизнь?"
20057-200570090 = "Сенсей"
20057-200570100 = "Я хочу сделать шаг вперёд."
20057-200570110 = "Хорошо, давай постараемся."
20057-200570120 = "Буду рада."
20057-200570130 = "Сейчас начнём работать всю ночь...!"
20057-200570140 = "Давай начнём писать сценарий для операции «Давай подружимся»!"
20057-200570150 = "Да, Сенсей."
20057-200570160 = "Мы с вами почти всю ночь"
20057-200570170 = "проводили симуляцию"
20057-200570180 = "и создали «сценарий», но..."
20057-200570190 = "Действительно ли всё будет хорошо?"
20057-200570200 = "Я тоже не знаю правильного ответа, но..."
20057-200570210 = "Давай попробуем, а потом подумаем!"
20057-200570220 = "Да... метод проб и ошибок, верно?"
20057-200570230 = "Здравствуйте, Сенсей."
20057-200570240 = "Благодаря вам, с одноклассницами"
20057-200570250 = "мне кажется, у меня стало получаться лучше."
20057-200570260 = "Это отлично!"
20057-200570270 = "Я знал, что у тебя всё получится, Акане."
20057-200570280 = "Спасибо вам."
20057-200570290 = "Ну... если вы не против..."
20057-200570300 = "Я хотела бы показать вам себя сегодняшнюю..."
20057-200570310 = "Как вам?"
20057-200570320 = "– наедине."
20057-200570330 = "Акане...?"
20057-200570340 = "Эм, Сенсей"
20057-200570350 = "Спасибо за сегодня."
20057-200570360 = "Уйти, не попрощавшись..."
20057-200570370 = "Грустно."
20057-200570380 = "Прошу прощения..."
20057-200570390 = "Но... эм..."
20057-200570400 = "это было более..."
20057-200570410 = "стыдно, чем я думала."
20057-200570420 = "В последнее время я думала,"
20057-200570430 = "что мои шаблоны уборки"
20057-200570440 = "не стали ли слишком однообразными?"
20057-200570450 = "Стоит ли их разнообразить?"
20057-200570460 = "Думаю, способов уборки не так много..."
20057-200570470 = "Ах, ну..."
20057-200570480 = "Я имела в виду не ту уборку,"
20057-200570490 = "а другую «уборку»..."
20057-200570500 = "Неужели..."
20057-200570510 = "...про бомбы?"
20057-200570520 = "Да."
20057-200570530 = "Это очень сложный вопрос..."
20057-200570540 = "Спасибо, что работали допоздна..."
20057-200570550 = "Ты в порядке, Акане?"
20057-200570560 = "Да."
20057-200570570 = "Я закончила подготовку и повторение,"
20057-200570580 = "и подготовка к завтрашнему дню идеальна."
20057-200570590 = "Всё это благодаря вашим наставлениям."
20057-200570600 = "Аха-ха... Мне самому захотелось пересмотреть свои методы воспитания."
20057-200570610 = "Хе-хе"
20057-200570620 = "Нет ничего обнадёживающего, чем слова того, кто сам пересматривает себя."
20057-200570630 = "Это придаёт сил."
20057-200570640 = "Буду рада и впредь работать с вами."
20057-200570650 = "...мой Хозяин."