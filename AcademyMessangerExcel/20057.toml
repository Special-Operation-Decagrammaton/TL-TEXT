[translation]
20057-200570010 = "Что вы думаете о Миллениуме, Мастер?"
20057-200570020 = "Хотя этот вопрос, возможно, немного запоздал."
20057-200570030 = "Не думаю, что когда-нибудь ПОЛНОСТЬЮ пойму Миллениум."
20057-200570040 = "Я здесь уже какое-то время, но каждый день в Миллениуме ощущается новым."
20057-200570050 = "Ох."
20057-200570060 = "Мне жаль, что вы так это воспринимаете."
20057-200570070 = "В таком случае,"
20057-200570080 = "не хотели бы вы увидеть, как выглядит наша повседневная жизнь?"
20057-200570090 = "Сенсей."
20057-200570100 = "Хорошо. Я готов."
20057-200570110 = "Идеально. Приступим."
20057-200570120 = "Да."
20057-200570130 = "Мы даже можем не спать всю ночь, чтобы написать это!"
20057-200570140 = "Начинаем операцию по написанию сценария «Стать ближе»!"
20057-200570150 = "Да, Сенсей."
20057-200570160 = "Здорово, что мы почти всю ночь не спали,"
20057-200570170 = "проводя симуляции"
20057-200570180 = "и работая над этим сценарием"
20057-200570190 = "...Но это правда сработает?"
20057-200570200 = "Честно говоря, не знаю..."
20057-200570210 = "У нас нет другого выбора, кроме как попробовать..."
20057-200570220 = "Ты права."
20057-200570230 = "Здравствуйте, Сенсей."
20057-200570240 = "Благодаря вам"
20057-200570250 = "кажется, я стала лучше ладить с одноклассницами."
20057-200570260 = "Это здорово!"
20057-200570270 = "Я знал, что у тебя получится, Аканэ!"
20057-200570280 = "Да."
20057-200570290 = "Именно поэтому."
20057-200570300 = "Если ты не против,"
20057-200570310 = "Мне хотелось бы показать вам и эту новую сторону себя."
20057-200570320 = "Только вдвоём."
20057-200570330 = "Аканэ...?"
20057-200570340 = "Эм, Сенсей..."
20057-200570350 = "Спасибо, что сегодня были моим одноклассником."
20057-200570360 = "Не могу поверить, что вы бросили свою одноклассницу..."
20057-200570370 = "Я буду дуться..."
20057-200570380 = "Прости..."
20057-200570390 = "Но..."
20057-200570400 = "Это было куда"
20057-200570410 = "неловче, чем я ожидала..."
20057-200570420 = "Меня кое-что беспокоит..."
20057-200570430 = "Когда я занимаюсь уборкой,"
20057-200570440 = "возможно, я слишком привыкла к своим обычным методам."
20057-200570450 = "В последнее время меня это тревожит."
20057-200570460 = "Способов убираться в комнате ведь не так уж много, да?"
20057-200570470 = "Нет. Эм, я о другом..."
20057-200570480 = "Я говорю о другой «уборке»,"
20057-200570490 = "не о той, где убирают комнату..."
20057-200570500 = "А, то есть..."
20057-200570510 = "...Бомбы?"
20057-200570520 = "Да."
20057-200570530 = "Это действительно проблема..."
20057-200570540 = "Огромное спасибо, что работали допоздна..."
20057-200570550 = "Ты в порядке, Аканэ...?"
20057-200570560 = "Да."
20057-200570570 = "Пусть и поздновато, но я закончила домашнее задание."
20057-200570580 = "И готова к завтрашним занятиям."
20057-200570590 = "И всё благодаря вашему наставлению."
20057-200570600 = "В такие моменты я начинаю переосмысливать свои педагогические методы..."
20057-200570610 = "Фу-фу."
20057-200570620 = "Думаю, нет ничего надёжнее"
20057-200570630 = "слов человека, способного к самоанализу."
20057-200570640 = "И впредь рассчитываю на вашу помощь,"
20057-200570650 = "Мастер."
