[translation]
20021-200210010 = "Сенсей, у меня на самом деле есть проблема."
20021-200210020 = "Понимаю... Это тот случай, который я могу услышать?"
20021-200210030 = "Да, если это вы, Сенсей!"
20021-200210040 = "Но я боюсь, что это вас побеспокоит..."
20021-200210050 = "Ведь слушать проблемы студентов — тоже часть работы Сенсея."
20021-200210060 = "Тогда можно мне попросить?"
20021-200210070 = "Я сейчас приду к вам!"
20021-200210080 = "Переживать тяжело, но я думаю, это и хорошо!"
20021-200210090 = "Когда преодолеваешь, это укрепляет уверенность!"
20021-200210100 = "Возможно, ты права."
20021-200210110 = "Кстати, почему вдруг разговор о «проблемах»...?"
20021-200210120 = "Я пришла к своему выводу по поводу того, что долго меня беспокоило."
20021-200210130 = "Я покажу и вам, так что ждите с нетерпением!"
20021-200210140 = "Сенсей!"
20021-200210150 = "Вам не кажется, что вязание — это весело?"
20021-200210160 = "Вязание... носков?"
20021-200210170 = "Да, я готовлюсь."
20021-200210180 = "Каждый год в это время я делаю что-то."
20021-200210190 = "Понятно...?"
20021-200210200 = "А, да!"
20021-200210210 = "Сенсей, не могли бы вы прийти в мою комнату?"
20021-200210220 = "Давайте станем соучастниками!"
20021-200210230 = "Соучастниками!?"
20021-200210240 = "Сенсей, Сенсей!"
20021-200210250 = "Посмотрите! Это подарок от Санты!"
20021-200210260 = "И он съел всё молоко и печенье!"
20021-200210270 = "Хотя жаль, что я не увидела Санту..."
20021-200210280 = "Но мне приятно, что я смогла поблагодарить за подарок. Хе-хе!"
20021-200210290 = "Да, хорошо."
20021-200210300 = "Кстати, если мне подарили антисептик..."
20021-200210310 = "Это значит, что я должна усерднее заниматься дезинфекцией для лечения пациентов?"
20021-200210320 = "Ампутация сложна, так что в таком случае лучше использовать огонь..."
20021-200210330 = "Я не думаю, что это имелось в виду!?"
20021-200210340 = "Эм, Сенсей..."
20021-200210350 = "У меня есть небольшое важное дело."
20021-200210360 = "Я хотела бы попросить вас о помощи."
20021-200210370 = "Вам сейчас удобно...?"
20021-200210380 = "Конечно, что случилось?"
20021-200210390 = "Понимаете..."
20021-200210400 = "Хм, я не уверена, что смогу объяснить в сообщении."
20021-200210410 = "Но..."
20021-200210420 = "Это ведь важное дело, да?"
20021-200210430 = "Да..."
20021-200210440 = "Очень важное."
20021-200210450 = "Но, хотя оно и важное..."
20021-200210460 = "Тогда давай встретимся и поговорим."