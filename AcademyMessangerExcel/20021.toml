[translation]
20021-200210010 = "Сенсей, у меня проблема!"
20021-200210020 = "Иногда полезно проговорить свои проблемы."
20021-200210030 = "О... Ты прав! Особенно если с тобой..."
20021-200210040 = "Но... я ещё и не хочу тебя беспокоить."
20021-200210050 = "Моя работа — выслушивать проблемы студентов. Какими бы маленькими они ни были."
20021-200210060 = "Тогда... Да, пожалуйста!"
20021-200210070 = "Я приду к тебе поговорить, хорошо?"
20021-200210080 = "Решать проблемы сложно! Но всем становится лучше, когда их решаешь!"
20021-200210090 = "И, возможно, мой способ решения не всегда лучший, но мне всё равно становится хорошо!"
20021-200210100 = "Рад это слышать."
20021-200210110 = "Тебя беспокоит что-то ещё?"
20021-200210120 = "Есть кое-что, что давно меня беспокоило, но, кажется, я разобралась!"
20021-200210130 = "Подробности расскажу позже!"
20021-200210140 = "Здравствуйте, Сенсей."
20021-200210150 = "Знаешь, я обожаю вязать носки!"
20021-200210160 = "Вязаные... носки?"
20021-200210170 = "Ага! Для меня это вроде ритуала."
20021-200210180 = "Я всегда вяжу их примерно в это время года."
20021-200210190 = "Х-хорошо... Молодец?"
20021-200210200 = "О! О! Придумала!"
20021-200210210 = "Можешь прийти ко мне в комнату, Сенсей?!"
20021-200210220 = "Мы станем сообщниками!"
20021-200210230 = "Ты собираешься совершить преступление?!"
20021-200210240 = "Сенсей, Сенсей!"
20021-200210250 = "Смотри! Я получила подарок от Санты!"
20021-200210260 = "Он даже выпил всё молоко и съел печенье!"
20021-200210270 = "Жаль, что я с ним не встретилась..."
20021-200210280 = "Но зато теперь я знаю, что тоже подарила ему подарок! Хи-хи!"
20021-200210290 = "Это здорово, Ханаэ."
20021-200210300 = "Хм... А мой подарок — дезинфицирующее средство!"
20021-200210310 = "О! Может, это знак, что мне нужно тщательнее дезинфицировать раны!"
20021-200210320 = "Но... я ненавижу удалять заражённые части... Это так утомительно... Может, вместо этого подойдёт паяльная лампа..."
20021-200210330 = "Нет?! Ханаэ, это вообще не сработает!!"
20021-200210340 = "Эм, Сенсей?"
20021-200210350 = "Кажется, у меня есть кро-о-ошечная проблемка."
20021-200210360 = "Я даже не уверена, стоит ли тебе рассказывать..."
20021-200210370 = "Наверное, ничего страшного, да?"
20021-200210380 = "Ты в порядке, Ханаэ?"
20021-200210390 = "А? Да. Конечно. Всё хорошо."
20021-200210400 = "Со мной всё отлично!"
20021-200210410 = "Но..."
20021-200210420 = "Тебя это правда беспокоит, Ханаэ?"
20021-200210430 = "Хм?"
20021-200210440 = "Да."
20021-200210450 = "Я знаю, что для меня это важно, но..."
20021-200210460 = "Хорошо. Давай встретимся и поговорим."
