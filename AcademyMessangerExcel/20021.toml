[translation]
20021-200210010 = "Sensei, na verdade tem uma coisa me deixando preocupada."
20021-200210020 = "Entendo... E é algo que você pode me contar?"
20021-200210030 = "Sim, para você eu posso contar, Sensei!"
20021-200210040 = "Mas fico receosa de acabar te incomodando..."
20021-200210050 = "Ouvir as preocupações das alunas também faz parte do dever de um Sensei."
20021-200210060 = "Então, posso mesmo pedir a sua ajuda?"
20021-200210070 = "Estou indo encontrar você agora mesmo!"
20021-200210080 = "Ficar cheia de dúvidas é difícil, mas acho que também tem o seu lado bom!"
20021-200210090 = "Porque quando a gente supera, isso nos dá muito mais confiança!"
20021-200210100 = "Pode ser verdade mesmo."
20021-200210110 = "Mas por que resolveu falar sobre isso assim de repente...?"
20021-200210120 = "É que finalmente consegui chegar à minha própria conclusão sobre aquilo que estava me preocupando tanto."
20021-200210130 = "Vou mostrar para você também, Sensei, então pode esperar ansiosamente!"
20021-200210140 = "Sensei!"
20021-200210150 = "Você não acha super divertido fazer tricô?"
20021-200210160 = "Tricô... Tipo tricotar meias?"
20021-200210170 = "Sim, já estou fazendo os preparativos!"
20021-200210180 = "Todo ano, quando chega essa época, eu faço algumas."
20021-200210190 = "Entendi...?"
20021-200210200 = "Ah, já sei!"
20021-200210210 = "Sensei, você poderia vir até o meu quarto?"
20021-200210220 = "Vamos nos tornar cúmplices!"
20021-200210230 = "Cúmplices?!"
20021-200210240 = "Sensei, Sensei!"
20021-200210250 = "Olhe só! Ganhei um presente do Papai Noel!"
20021-200210260 = "E ele também tomou todo o leite e comeu todos os biscoitos que deixei!"
20021-200210270 = "Foi uma pena eu não ter conseguido encontrar o Papai Noel pessoalmente, mas..."
20021-200210280 = "Mesmo assim, fico muito feliz de ter conseguido agradecer pelo presente. Ehehe!"
20021-200210290 = "Que ótimo, fico feliz por você."
20021-200210300 = "Por sinal, o fato de ele ter me dado antisséptico de presente..."
20021-200210310 = "Significa que ele quer que eu me dedique ainda mais à desinfecção no tratamento dos pacientes daqui pra frente, não é?"
20021-200210320 = "Amputar a área afetada dá muito trabalho, então o jeito vai ser usar fogo mesmo para cauterizar"
20021-200210330 = "Tenho certeza absoluta de que não foi isso que ele quis dizer?!"
20021-200210340 = "Hum, Sensei..."
20021-200210350 = "Surgiu um assunto meio importante..."
20021-200210360 = "E eu queria muito pedir a sua ajuda."
20021-200210370 = "Você está livre agora...?"
20021-200210380 = "Claro que sim, o que aconteceu?"
20021-200210390 = "É que..."
20021-200210400 = "Huum, não sei se vou conseguir explicar direito por mensagem..."
20021-200210410 = "Mas..."
20021-200210420 = "É um assunto importante, não é?"
20021-200210430 = "Sim..."
20021-200210440 = "É um assunto super importante."
20021-200210450 = "Quer dizer, é importante, só que..."
20021-200210460 = "Então vamos nos encontrar para conversar pessoalmente."
