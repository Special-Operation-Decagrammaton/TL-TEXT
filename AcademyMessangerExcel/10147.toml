[translation]
10147-101470010 = "Сенсей, можно вас на минутку?"
10147-101470020 = "Конечно. Что случилось?"
10147-101470030 = "Вы…"
10147-101470040 = "хорошо понимаете, насколько море опасное место?"
10147-101470050 = "Честно говоря, не очень..."
10147-101470060 = "...Похоже, лучше объяснить лично."
10147-101470070 = "Я сейчас приду, так что ждите."
10147-101470080 = "А-ага. Я подожду..."
10147-101470090 = "Вы помните все правила безопасности на море, которые я вам рассказывала?"
10147-101470100 = "Надеюсь, не забыли?"
10147-101470110 = "Всё в порядке, я помню!"
10147-101470120 = "Услышав это, я успокоилась."
10147-101470130 = "Но я всё равно немного волнуюсь, так что..."
10147-101470140 = "я буду присматривать за вами и дальше."
10147-101470150 = "Я рад это слышать."
10147-101470160 = "Хе-хе, правда?"
10147-101470170 = "Тогда до встречи."
10147-101470180 = "Море — это очень страшное место."
10147-101470190 = "Ты начинаешь сразу с этого."
10147-101470200 = "Что-то случилось?"
10147-101470210 = "Под водой невозможно дышать,"
10147-101470220 = "и двигаться свободно тоже не получается."
10147-101470230 = "Если подумать, что тебя унесёт волной –"
10147-101470240 = "Да, если так подумать, становится страшно..."
10147-101470250 = "Держаться подальше от опасностей –"
10147-101470260 = "это самый правильный подход."
10147-101470270 = "Море…"
10147-101470280 = "оказывается, может быть довольно весёлым местом."
10147-101470290 = "Спасибо, что научила меня этому."
10147-101470300 = "Вот видишь?"
10147-101470310 = "Но терять бдительность нельзя."
10147-101470320 = "Вы, Сенсей, вроде бы привыкли,"
10147-101470330 = "но всегда нужно быть начеку."
10147-101470340 = "Да, я буду осторожен."
10147-101470350 = "Хе-хе, хороший ответ."
10147-101470360 = "Море — очень страшное место, правда?"
10147-101470370 = "Вы тоже так думаете, Сенсей?"
10147-101470380 = "У меня дежавю."
10147-101470390 = "Сацуки, ты уже справилась с этим?"
10147-101470400 = "В самой глубине моря –"
10147-101470410 = "мне кажется, там скрывается что-то ужасное."
10147-101470420 = "Возможно, там действительно что-то есть."
10147-101470430 = "На мелководье, наверное, безопаснее."
10147-101470440 = "Ведь вы же меня защитите, Сенсей?"
10147-101470450 = "Слушайте, Сенсей."
10147-101470460 = "Вы знаете?"
10147-101470470 = "Наверное, нет?"
10147-101470480 = "Говорят, что медузы"
10147-101470490 = "не чувствуют яда друг друга."
10147-101470500 = "Вот как! Это круто!"
10147-101470510 = "То есть…"
10147-101470520 = "как мы с вами."
10147-101470530 = "Я не совсем понимаю, но…"
10147-101470540 = "если ты так говоришь, Сацуки, то, наверное, так и есть."
10147-101470550 = "Хе-хе, именно."
10147-101470560 = "Слушайте, я хочу вас кое о чём спросить."
10147-101470570 = "Конечно. О чём?"
10147-101470580 = "Вы защищаетесь от ультрафиолета?"
10147-101470590 = "Конечно!"
10147-101470600 = "А от медуз?"
10147-101470610 = "Всё в порядке!"
10147-101470620 = "Хм… хорошо."
10147-101470630 = "Тогда выдвигаемся!"
10147-101470640 = "Куда?"
10147-101470650 = "Ах да, кстати."
10147-101470660 = "Вы знаете, Сенсей?"
10147-101470670 = "Наверное…?"
10147-101470680 = "О? Вы поняли мои чувства?"
10147-101470690 = "Как и ожидалось от Сенсея."
10147-101470700 = "В-вот как, значит, речь об этом?"
10147-101470710 = "Вроде понимаю, но вроде и нет…"
10147-101470720 = "Честно говоря, я и сама не совсем понимаю."
10147-101470730 = "Это чувство… как бы его назвать?"
10147-101470740 = "Мне как-то не по себе."
10147-101470750 = "Я могу чем-то помочь?"
10147-101470760 = "Хм…"
10147-101470770 = "Ну…"
10147-101470780 = "…покажите мне своё лицо."
10147-101470790 = "Хорошо, ты где сейчас?"
10147-101470800 = "Сенсей, послушайте."
10147-101470810 = "Говорят, что люди"
10147-101470820 = "со временем начинают воспринимать привычное как «само собой разумеющееся»."
10147-101470830 = "Вот как, возможно, так и есть."
10147-101470840 = "Поэтому я скажу заранее."
10147-101470850 = "Что именно?"
10147-101470860 = "Я всегда буду рядом."
10147-101470870 = "Ты хочешь, чтобы я привык?"
10147-101470880 = "Да."
10147-101470890 = "Если так продолжится,"
10147-101470900 = "когда-нибудь это станет обычным, не так ли?"
10147-101470910 = "Да, наверное."
10147-101470920 = "Вот именно. Хе-хе."
10147-101470930 = "Сенсей, можно вас на минутку?"
10147-101470940 = "Конечно."
10147-101470950 = "Я тоже так думаю."