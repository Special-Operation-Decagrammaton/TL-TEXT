[translation]
10147-101470010 = "Sensei, do you have a moment?"
10147-101470020 = "Sure. What's wrong?"
10147-101470030 = "Sensei..."
10147-101470040 = "Do you truly understand"
10147-101470050 = "just how dangerous the ocean can be?"
10147-101470060 = "No, not really..."
10147-101470070 = "...It seems I should explain this to you directly."
10147-101470080 = "I'm heading over now, so please wait for me."
10147-101470090 = "O-oh, okay. I'll be waiting..."
10147-101470100 = "The ocean safety measures I taught you..."
10147-101470110 = "Do you remember them properly?"
10147-101470120 = "You haven't forgotten, have you?"
10147-101470130 = "Don't worry, I remember!"
10147-101470140 = "I'm relieved to hear that."
10147-101470150 = "But I'm still a little worried, so..."
10147-101470160 = "I'll keep looking after you from now on."
10147-101470170 = "I'd be happy with that."
10147-101470180 = "Hehe, wouldn't you?"
10147-101470190 = "Well then, see you later."
10147-101470200 = "The ocean is a very terrifying place."
10147-101470210 = "W-wow, that was sudden."
10147-101470220 = "Did something happen?"
10147-101470230 = "You can't breathe underwater,"
10147-101470240 = "and you can't move freely."
10147-101470250 = "Just thinking about being swept away by a wave—"
10147-101470260 = "You're right, that is scary when you put it that way..."
10147-101470270 = "Keeping your distance from dangerous things,"
10147-101470280 = "that's the best approach, isn't it?"
10147-101470290 = "The ocean..."
10147-101470300 = "might actually be a fun place after all."
10147-101470310 = "Thank you for teaching me."
10147-101470320 = "Don't you think so?"
10147-101470330 = "But you must never let your guard down."
10147-101470340 = "Even though you seem used to it, Sensei,"
10147-101470350 = "you must always remain vigilant."
10147-101470360 = "Yeah, I'll be careful."
10147-101470370 = "Hehe, that's a good answer."
10147-101470380 = "The ocean is such a terrifying place, isn't it?"
10147-101470390 = "You think so too, right, Sensei?"
10147-101470400 = "Déjà vu."
10147-101470410 = "Aren't you over that already, Satsuki?"
10147-101470420 = "Deep, deep down in the ocean—"
10147-101470430 = "I feel like something terrifying is lurking there."
10147-101470440 = "I suppose that's possible."
10147-101470450 = "It might be fine in the shallows, though."
10147-101470460 = "After all, you'll protect me, won't you, Sensei?"
10147-101470470 = "Hey, Sensei."
10147-101470480 = "Did you know?"
10147-101470490 = "Maybe you don't?"
10147-101470500 = "Jellyfish,"
10147-101470510 = "they're apparently immune to each other's venom."
10147-101470520 = "Is that so? That's amazing!"
10147-101470530 = "In other words..."
10147-101470540 = "it's like the relationship between you and me."
10147-101470550 = "I don't quite get it, but..."
10147-101470560 = "if you say so, Satsuki, then maybe it is."
10147-101470570 = "Hehe, exactly."
10147-101470580 = "Hey, I have something I want to ask you, Sensei."
10147-101470590 = "Sure. What is it?"
10147-101470600 = "Are you taking precautions against UV rays?"
10147-101470610 = "Of course!"
10147-101470620 = "And precautions against jellyfish?"
10147-101470630 = "I'm all set!"
10147-101470640 = "Hmm... very well."
10147-101470650 = "Then, let's head out!"
10147-101470660 = "Where to?"
10147-101470670 = "Oh, come to think of it,"
10147-101470680 = "do you know what I'm thinking, Sensei?"
10147-101470690 = "Maybe...?"
10147-101470700 = "Oh? You figured out how I feel?"
10147-101470710 = "As expected of you, Sensei."
10147-101470720 = "W-was that what we were talking about?"
10147-101470730 = "I feel like I understand, but then again, I don't..."
10147-101470740 = "Actually, I don't really understand it myself."
10147-101470750 = "This feeling... what should I call it?"
10147-101470760 = "I feel a bit restless."
10147-101470770 = "Is there anything I can do to help?"
10147-101470780 = "Hmm."
10147-101470790 = "Let's see..."
10147-101470800 = "...Let me see your face, Sensei."
10147-101470810 = "Got it. Where are you right now?"
10147-101470820 = "Sensei, listen."
10147-101470830 = "People tend to take things they see every day"
10147-101470840 = "for granted before they even realize it."
10147-101470850 = "I see, that might be true."
10147-101470860 = "That's why I'm telling you now."
10147-101470870 = "Telling me what?"
10147-101470880 = "That from now on,"
10147-101470890 = "I'll always be by your side."
10147-101470900 = "So you're going to make me get used to it?"
10147-101470910 = "Yes."
10147-101470920 = "If I do that,"
10147-101470930 = "someday, it'll become the norm, won't it?"
10147-101470940 = "Yeah, I suppose so."
10147-101470950 = "Exactly. Hehe."