[translation]
10147-101470010 = "Сенсей!"
10147-101470020 = "Сацуки!"
10147-101470030 = "Фу-фу."
10147-101470040 = "Вы же знаете,"
10147-101470050 = "насколько опасен океан, верно?"
10147-101470060 = "Знаю... наверное?"
10147-101470070 = "Лучше объяснить это лично."
10147-101470080 = "Скоро буду!"
10147-101470090 = "Кажется, это уже было..."
10147-101470100 = "Сенсей!"
10147-101470110 = "Не забывайте о мерах безопасности"
10147-101470120 = "сегодня, хорошо?!"
10147-101470130 = "Конечно."
10147-101470140 = "На всякий случай"
10147-101470150 = "я всё равно"
10147-101470160 = "буду за вами приглядывать."
10147-101470170 = "Спасибо."
10147-101470180 = "Фу-фу."
10147-101470190 = "Хорошо."
10147-101470200 = "Море ведь очень страшное место, правда?"
10147-101470210 = "Почему ты так говоришь?"
10147-101470220 = "Что-то случилось?"
10147-101470230 = "Под водой ведь нельзя дышать"
10147-101470240 = "и свободно двигаться."
10147-101470250 = "А если вас ещё и волной унесёт..."
10147-101470260 = "Да, от одной мысли страшно."
10147-101470270 = "Разумнее всего"
10147-101470280 = "держаться подальше от того, что угрожает вашей безопасности."
10147-101470290 = "Пляж..."
10147-101470300 = "Вообще-то там бывает весело."
10147-101470310 = "Спасибо, что показали мне это."
10147-101470320 = "Рад, что тебе понравилось!"
10147-101470330 = "Но всё равно не теряйте бдительности."
10147-101470340 = "Вы умеете принимать разумные решения,"
10147-101470350 = "но осторожность никогда не помешает."
10147-101470360 = "Обязательно, Сацуки."
10147-101470370 = "Хорошо."
10147-101470380 = "Сенсей."
10147-101470390 = "Море ведь очень страшное место, правда?"
10147-101470400 = "Кажется, мы уже об этом говорили..."
10147-101470410 = "Я думал, тебе там понравилось."
10147-101470420 = "У меня такое чувство..."
10147-101470430 = "будто в морских глубинах скрывается нечто ужасное."
10147-101470440 = "Ну, технически я не могу это опровергнуть..."
10147-101470450 = "На мелководье должно быть безопасно."
10147-101470460 = "Ведь вы будете рядом и защитите меня."
10147-101470470 = "Сенсей"
10147-101470480 = "...А вы знали?"
10147-101470490 = "Наверняка нет!"
10147-101470500 = "Медузы"
10147-101470510 = "невосприимчивы к яду друг друга."
10147-101470520 = "Ого! Интересный факт."
10147-101470530 = "Иначе говоря..."
10147-101470540 = "Они совсем как мы с вами, Сенсей."
10147-101470550 = "Теперь я окончательно запутался..."
10147-101470560 = "Просто улыбнусь и кивну."
10147-101470570 = "Хорошо."
10147-101470580 = "Сенсей!"
10147-101470590 = "Сацуки!"
10147-101470600 = "Вы достаточно защитились от ультрафиолета?"
10147-101470610 = "Конечно!"
10147-101470620 = "А от нападения медуз тоже защитились?"
10147-101470630 = "Да-да, конечно!"
10147-101470640 = "Хорошо."
10147-101470650 = "Тогда отправляемся!"
10147-101470660 = "Куда именно...?"
10147-101470670 = "Сенсей."
10147-101470680 = "Вы знаете...?"
10147-101470690 = "Наверное!"
10147-101470700 = "Вы знаете, что я чувствую?!"
10147-101470710 = "Вы и правда настоящий Сенсей."
10147-101470720 = "А... Так вот ты о чём."
10147-101470730 = "Может, знаю, а может, и нет..."
10147-101470740 = "Я даже не знаю, знаю ли."
10147-101470750 = "Я не знаю, как выразить это словами."
10147-101470760 = "В общем, странное чувство."
10147-101470770 = "Я могу чем-нибудь помочь?"
10147-101470780 = "Хм..."
10147-101470790 = "Почему-то..."
10147-101470800 = "Мне хочется вас увидеть."
10147-101470810 = "Могу к тебе прийти."
10147-101470820 = "Сенсей."
10147-101470830 = "Говорят, люди склонны превращать в привычку"
10147-101470840 = "то, что им хорошо знакомо."
10147-101470850 = "Это известная истина."
10147-101470860 = "Поэтому я хочу вам кое-что сказать."
10147-101470870 = "Да?"
10147-101470880 = "Я буду"
10147-101470890 = "рядом с вами."
10147-101470900 = "Чтобы мы привыкли друг к другу?"
10147-101470910 = "Ага"
10147-101470920 = "Тогда..."
10147-101470930 = "Я тоже стану вашей привычкой, верно?"
10147-101470940 = "Верно."
10147-101470950 = "Хорошо."
