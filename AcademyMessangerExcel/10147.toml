[translation]
10147-101470010 = "Sensei, tem um minutinho?"
10147-101470020 = "Claro. O que houve?"
10147-101470030 = "Sensei..."
10147-101470040 = "Será que você entende direitinho"
10147-101470050 = "o quão perigoso é o mar?"
10147-101470060 = "Bom, pra falar a verdade, não muito..."
10147-101470070 = "...Acho melhor eu explicar isso pessoalmente"
10147-101470080 = "Estou indo para aí agora, então me espere, sim?"
10147-101470090 = "T-Tá bom. Vou ficar esperando..."
10147-101470100 = "Aquelas medidas de segurança no mar que eu te ensinei..."
10147-101470110 = "Será que você ainda lembra direitinho?"
10147-101470120 = "Não pode esquecer, viu?"
10147-101470130 = "Fica tranquila, eu lembro sim!"
10147-101470140 = "Fico mais aliviada em ouvir isso"
10147-101470150 = "Mas como ainda estou um pouquinho preocupada..."
10147-101470160 = "De agora em diante, vou cuidar de você bem de pertinho para sempre"
10147-101470170 = "Eu ficaria muito feliz com isso"
10147-101470180 = "Fufu, não é?"
10147-101470190 = "Bom, até mais então"
10147-101470200 = "O mar é um lugar terrivelmente assustador."
10147-101470210 = "N-Nossa, que repentino."
10147-101470220 = "Aconteceu alguma coisa?"
10147-101470230 = "Debaixo d'água não dá nem para respirar"
10147-101470240 = "E também não conseguimos nos mover livremente"
10147-101470250 = "Só de pensar no que aconteceria se uma onda me levasse..."
10147-101470260 = "Realmente, pensando assim dá medo mesmo..."
10147-101470270 = "Manter distância do que é perigoso"
10147-101470280 = "é sempre o melhor a fazer, não acha?"
10147-101470290 = "O mar..."
10147-101470300 = "Pode ser um lugar surpreendentemente divertido, afinal"
10147-101470310 = "Agradeço por ter me mostrado isso"
10147-101470320 = "Viu só?"
10147-101470330 = "Mas nada de baixar a guarda"
10147-101470340 = "Você parece já estar acostumado, Sensei, mas"
10147-101470350 = "jamais deve descuidar da vigilância"
10147-101470360 = "Sim, vou tomar cuidado"
10147-101470370 = "Fufu, ótima resposta"
10147-101470380 = "O mar é um lugar muito assustador, não é?"
10147-101470390 = "Você também não acha, Sensei?"
10147-101470400 = "Que déjà vu"
10147-101470410 = "Você já não tinha superado isso, Satsuki?"
10147-101470420 = "Lá nas profundezas do mar..."
10147-101470430 = "Sinto que há algo terrível à espreita"
10147-101470440 = "Bem, pode ser que exista mesmo"
10147-101470450 = "No rasinho acho que tudo bem"
10147-101470460 = "Afinal, você vai me proteger, Sensei"
10147-101470470 = "Ei, Sensei"
10147-101470480 = "Você sabia?"
10147-101470490 = "Acho que não?"
10147-101470500 = "Dizem que entre águas-vivas"
10147-101470510 = "o veneno de uma não funciona na outra"
10147-101470520 = "Sério?! Que incrível!"
10147-101470530 = "Ou seja..."
10147-101470540 = "É exatamente como a relação entre você e eu, Sensei"
10147-101470550 = "Não entendi muito bem, mas..."
10147-101470560 = "Se você está dizendo, Satsuki, então deve ser"
10147-101470570 = "Fufu, isso mesmo"
10147-101470580 = "Ei, tem uma coisa que quero te perguntar, Sensei"
10147-101470590 = "Pode falar. O que foi?"
10147-101470600 = "Está se protegendo contra os raios UV?"
10147-101470610 = "Claro!"
10147-101470620 = "E contra águas-vivas?"
10147-101470630 = "Tudo certo!"
10147-101470640 = "Hum... muito bem"
10147-101470650 = "Então vamos partir!"
10147-101470660 = "Para onde?"
10147-101470670 = "Ah, por falar nisso"
10147-101470680 = "Será que você sabe, Sensei?"
10147-101470690 = "Talvez...?"
10147-101470700 = "Ora? Você entendeu o que estou sentindo?"
10147-101470710 = "Não esperava menos de você, Sensei"
10147-101470720 = "E-Era disso que você estava falando?"
10147-101470730 = "Eu meio que entendo, mas ao mesmo tempo não entendo..."
10147-101470740 = "Na verdade, nem eu mesma estou entendendo direito"
10147-101470750 = "Esse sentimento... como será que posso chamá-lo?"
10147-101470760 = "Sinto uma inquietação estranha"
10147-101470770 = "Tem alguma coisa em que eu possa ajudar?"
10147-101470780 = "Huum"
10147-101470790 = "Vejamos..."
10147-101470800 = "...Deixe-me ver o seu rosto, Sensei"
10147-101470810 = "Combinado, onde você está agora?"
10147-101470820 = "Sensei, escute só"
10147-101470830 = "Dizem que as pessoas, sem perceber,"
10147-101470840 = "passam a achar que aquilo que estão acostumadas a ver é \"natural\""
10147-101470850 = "Entendi, faz sentido mesmo"
10147-101470860 = "Por isso já vou avisando de antemão"
10147-101470870 = "Avisando o quê?"
10147-101470880 = "Que daqui para frente"
10147-101470890 = "vou continuar sempre ao seu lado"
10147-101470900 = "Quer dizer que vai me fazer acostumar com isso?"
10147-101470910 = "Sim"
10147-101470920 = "Se eu fizer isso"
10147-101470930 = "um dia isso vai se tornar algo natural para você, não acha?"
10147-101470940 = "Sim, você tem razão"
10147-101470950 = "Isso mesmo. Fufu"
