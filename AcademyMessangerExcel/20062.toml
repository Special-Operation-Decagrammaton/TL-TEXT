[translation]
20062-200620010 = "Senseeei, oiii!"
20062-200620020 = "Quem será que eu sou?"
20062-200620030 = "Você é a Futaki Erina!"
20062-200620040 = "Descobri sua verdadeira identidade!"
20062-200620050 = "C-como você descobriu?! Eu até mudei meu jeito de falar!"
20062-200620060 = "Não me diga que você salvou aquilo?"
20062-200620070 = "Hã, como é mesmo o nome..."
20062-200620080 = "Aquilo, sabe! Aquilo!"
20062-200620090 = "O contato?"
20062-200620100 = "Isso, isso mesmo! É que deu um branco aqui..."
20062-200620110 = "Então foi por isso que soube que era eu, né?"
20062-200620120 = "Aliás, será que você poderia me ajudar na minha pesquisa hoje?"
20062-200620130 = "Claro, sem problemas!"
20062-200620140 = "Aêêê~!"
20062-200620150 = "Então te vejo na Nº 183!"
20062-200620160 = "Graças a você, consegui coletar um montão de dados de pesquisa, Sensei!"
20062-200620170 = "Iêêêi! Aêêê~!"
20062-200620180 = "No fim das contas, cozinhar é pura química, né?!"
20062-200620190 = "Estava uma delícia mesmo!"
20062-200620200 = "Só não imaginava que você ia sintetizar os temperos na hora!"
20062-200620210 = "Aquilo ali é fichinha! Iêi, iêi♪"
20062-200620220 = "Ainda bem que deixei o shoyu pronto ontem~!"
20062-200620230 = "Vou preparar mais alguma coisa outra hora, então passa aqui pra me ver, tá?"
20062-200620240 = "O maior defeito dos estudos"
20062-200620250 = "É que... eles nunca têm fim."
20062-200620260 = "Não sei se é um defeito, mas nisso você tem razão."
20062-200620270 = "Não quero estudar! E não quero saber de livros!"
20062-200620280 = "Queria absorver só o conhecimento sem precisar estudar~!"
20062-200620290 = "Você também não acha, Sensei?"
20062-200620300 = "Como professor, vou exercer meu direito de permanecer em silêncio."
20062-200620310 = "Buuu! Buuu!"
20062-200620320 = "O professor deveria ficar do lado das alunas!"
20062-200620330 = "Ultimamente, andei pensando que talvez eu precise de conhecimento para convencer os outros..."
20062-200620340 = "Aí eu tava estudando, mas não consegui me concentrar e acabei te mandando mensagem, ehehe!"
20062-200620350 = "Dito isso, vou voltar pros estudos~"
20062-200620360 = "Sensei, você ficou bem depois daquilo?"
20062-200620370 = "Não se machucou, né? Parecia que você não estava conseguindo ficar de pé direito..."
20062-200620380 = "Tô vivo, então tá tudo certo!"
20062-200620390 = "Realmente, quando a gente começa a estudar alguma coisa, precisa ir até o fim, né?"
20062-200620400 = "Por pouco não acabamos tendo que viver em um único corpo para sempre."
20062-200620410 = "Isso também faz parte do desafio! Não se preocupe!"
20062-200620420 = "Muito obrigada..."
20062-200620430 = "A permissão de saída veiooooo!!"
20062-200620440 = "Sensei, manda uma reação gigante, por favor!"
20062-200620450 = "Uooooou! Incrível!!"
20062-200620460 = "Incrível, mas como você conseguiu?"
20062-200620470 = "Hehehe"
20062-200620480 = "Com a famosa desculpa de 'fins de pesquisa'."
20062-200620490 = "Venha você também, Sensei! Garanto que não vai se arrepender!"
20062-200620500 = "Já tô indo!"
20062-200620510 = "Aêêê!!"
20062-200620520 = "Estou estudando ética em pesquisa agora,"
20062-200620530 = "aí lembrei de você e resolvi mandar mensagem, Sensei."
20062-200620540 = "É um estudo muito importante, parabéns pelo esforço!"
20062-200620550 = "O relatório foi aprovado direitinho?"
20062-200620560 = "Não."
20062-200620570 = "Ficaram marcas de lápis... e acabaram descobrindo."
20062-200620580 = "Agora estou vestindo uma blusa ultraescorregadia, uma calça de formigas-de-fogo e um casaco biodegradável"
20062-200620590 = "enquanto leio de cabo a rabo o livro de ética em pesquisa."
20062-200620600 = "Já caí da cama 3 vezes, tá frio e pinicando tudo."
20062-200620610 = "Me salva, Sensei"
20062-200620620 = "Por favooor!!!"
20062-200620630 = "Sensei~, tem uma coisinha que eu queria te perguntar~"
20062-200620640 = "Ah, como é mesmo que se chama isso?"
20062-200620650 = "Dar alguma coisa a alguém com carinho ou gratidão..."
20062-200620660 = "Um presente?"
20062-200620670 = "Ah, isso mesmo! É que a palavra me fugiu da cabeça."
20062-200620680 = "Então, tem alguma coisa que você queira ganhar, Sensei?"
20062-200620690 = "Por que isso assim do nada?"
20062-200620700 = "Ah, sei lá, de repente me deu vontade de te dar alguma coisa."
20062-200620710 = "Mas eu não sabia o que dar..."
20062-200620720 = "Hmm"
20062-200620730 = "Já sei! Vou fazer AQUILO!"
20062-200620740 = "Beleza~! Vou começar a fazer agora mesmo! Preciso ligar o alto-forno."
20062-200620750 = "Alto-forno?!"
