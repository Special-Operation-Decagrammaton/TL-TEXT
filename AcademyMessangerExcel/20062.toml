[translation]
20062-200620010 = "Эй, Сенсей!"
20062-200620020 = "Кто я?"
20062-200620030 = "Ты Эрина Футаги!"
20062-200620040 = "Я вижу твою истинную личность!"
20062-200620050 = "К-как вы узнали?! Я изменила свою манеру говорить!"
20062-200620060 = "Ты это не сохранил, правда?"
20062-200620070 = "Э-э, что это было..."
20062-200620080 = "Эта штука, эта штука!"
20062-200620090 = "Контактная информация?"
20062-200620100 = "Да, именно! Я просто не могла вспомнить..."
20062-200620110 = "Так вот как вы узнали, что это я."
20062-200620120 = "Кстати, не могли бы вы помочь мне сегодня с моим исследованием?"
20062-200620130 = "Конечно!"
20062-200620140 = "Ура!"
20062-200620150 = "Тогда жду вас в 183-м!"
20062-200620160 = "Благодаря вам, Сенсей, мы собрали много исследовательских данных!"
20062-200620170 = "Ура! Ура!"
20062-200620180 = "Готовка — это определённо химия, не так ли!"
20062-200620190 = "Это было очень вкусно!"
20062-200620200 = "Я никогда не думал, что нам придётся готовить приправы прямо на месте!"
20062-200620210 = "Это было проще простого! Ура-ура♪"
20062-200620220 = "Я рада, что вчера приготовила соевый соус!"
20062-200620230 = "Я ещё что-нибудь приготовлю, так что, пожалуйста, приходите в гости!"
20062-200620240 = "Самый большой недостаток учёбы"
20062-200620250 = "То есть... ей нет конца."
20062-200620260 = "Неважно, недостаток это или нет, это, безусловно, правда."
20062-200620270 = "Я ненавижу учёбу! И книги тоже ненавижу!"
20062-200620280 = "Я хочу усваивать знания без учёбы!"
20062-200620290 = "Вы тоже так думаете, Сенсей?"
20062-200620300 = "Как Сенсей, я использую своё право хранить молчание."
20062-200620310 = "Бу! Бу!"
20062-200620320 = "Сенсей должен вставать на сторону студентов!"
20062-200620330 = "В последнее время я думаю, что знания могут быть необходимы, чтобы убеждать других..."
20062-200620340 = "Я училась, но не могла сосредоточиться, поэтому связалась с вами, хе-хе!"
20062-200620350 = "Так что я возвращаюсь к учёбе."
20062-200620360 = "Сенсей, вы в порядке после этого?"
20062-200620370 = "Вы не пострадали, правда? Вы выглядели так, будто не могли нормально стоять..."
20062-200620380 = "Я жив, так что всё в порядке!"
20062-200620390 = "Наверное, начав учиться, нужно довести дело до конца."
20062-200620400 = "Я чуть не прожила вечно в одном теле."
20062-200620410 = "Это всё часть испытания! Не волнуйтесь!"
20062-200620420 = "Спасибо..."
20062-200620430 = "Мне разрешили выйти!!"
20062-200620440 = "Сенсей, пожалуйста, покажите бурную реакцию!"
20062-200620450 = "Ух ты! Потрясающе!!"
20062-200620460 = "Это потрясающе, но как ты это получила?"
20062-200620470 = "Хе-хе-хе"
20062-200620480 = "Это для исследовательских целей."
20062-200620490 = "Сенсей, вам тоже стоит прийти! Вы не пожалеете!"
20062-200620500 = "Я сейчас же приду!"
20062-200620510 = "Ура!!"
20062-200620520 = "Я изучаю этику исследований."
20062-200620530 = "Я вспомнила вас, Сенсей, и решила связаться с вами."
20062-200620540 = "Это очень важная учёба, молодец!"
20062-200620550 = "Ваш отчёт одобрен?"
20062-200620560 = "Нет."
20062-200620570 = "Были следы карандашного почерка... Меня поймали."
20062-200620580 = "Сейчас на мне гладкая блузка, штаны с огненными муравьями и разбираемое пальто."
20062-200620590 = "Я внимательно читаю книгу по этике научных исследований."
20062-200620600 = "Я трижды падала с кровати, мне холодно и колется."
20062-200620610 = "Пожалуйста, помогите мне, Сенсей."
20062-200620620 = "Пожалуйста!!!"
20062-200620630 = "Сенсей, я хотела бы кое-что спросить."
20062-200620640 = "О, как это называется?"
20062-200620650 = "Дарить что-либо в знак привязанности или благодарности..."
20062-200620660 = "Подарок?"
20062-200620670 = "О, да! Просто слово сложное."
20062-200620680 = "Итак, Сенсей, вам что-нибудь нужно?"
20062-200620690 = "Почему так внезапно?"
20062-200620700 = "Ну, мне вдруг захотелось что-нибудь подарить."
20062-200620710 = "Но я не знала, что подарить..."
20062-200620720 = "Хм..."
20062-200620730 = "Вот оно! Я это сделаю!"
20062-200620740 = "Хорошо! Попробую сделать сейчас! Мне нужно зажечь доменную печь."
20062-200620750 = "Доменная печь!?"