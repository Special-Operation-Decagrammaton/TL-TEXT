[translation]
26005-1699 = "Эм, Сенсей? Вы сейчас свободны? Свободны ведь, да?"
26005-1700 = "У меня маленькая просьба. Ничего особо важного!"
26005-1701 = "Так что если вы заняты — ничего страшного. Ничего особенного."
26005-1702 = "Вообще-то я немного занят."
26005-1703 = "Конечно свободен. Я же всего лишь запасной игрок."
26005-1704 = "Я так и думала..."
26005-1705 = "Хорошо. Не буду мешать. Простите."
26005-1706 = "Что? Я не это имел в виду!"
26005-1707 = "Вы знаете, что я имела в виду!"
26005-1708 = "Я просто шучу."
26005-1709 = "Вы опять надо мной издеваетесь."
26005-1710 = "Когда-нибудь вы за это заплатите..."
26005-1711 = "В общем, вы ведь можете мне помочь, да? Вам ещё нужно загладить вину за то, что только что меня дразнили."
26005-1712 = "Встретимся в кафе «Мильфёй»."
26005-1713 = "И никому об этом не говорите."
26005-1714 = "Я позже снова позвоню. На этот раз угощаю я!"
26005-1715 = "Вы сейчас свободны, Сенсей?"
26005-1716 = "Вы ведь помните, что мы обещали встретиться? В этот раз угощаю я."
26005-1717 = "Сразу предупреждаю: у вас нет выбора, кроме как согласиться."
26005-1718 = "...Хм, это прозвучало очень неловко."
26005-1719 = "Я хочу сказать, что должна вернуть долг! Расплатиться с вами! Ничего больше!"
26005-1720 = "Я бы не возражал и против чего-то другого."
26005-1721 = "Знаю. Обещание есть обещание."
26005-1722 = "Можете перестать говорить такие вещи? У меня от них сердце колотится."
26005-1723 = "Хорошо. Я буду ждать, так что не опаздывайте!"
26005-1724 = "Никому не говорите!"
26005-1725 = "Совершенно никому!"
26005-1726 = "И никаких «НО»!"
26005-1727 = "Одно слово — и вы труп!"
26005-1728 = "У вас есть свободное время, Сенсей?"
26005-1729 = "Ничего серьёзного, просто нужна небольшая помощь."
26005-1730 = "Что мы будем есть на этот раз?"
26005-1731 = "Я что, похожа на свинью?"
26005-1732 = "Вы думаете, я целыми днями только и делаю, что ем?"
26005-1733 = "Нет, совсем нет! Мне просто нужна ваша помощь!"
26005-1734 = "Я прошу вас, потому что вы мой учитель."
26005-1735 = "Я шучу. Где встретимся?"
26005-1736 = "..."
26005-1737 = "Нельзя просто такое говорить, а потом отшучиваться..."
26005-1738 = "В любом случае спасибо. Я скажу, где встретимся."
26005-1739 = "Огромное спасибо за сегодня."
26005-1740 = "Я ещё позову вас, Сенсей!"
26005-260050010 = "Я сегодня вообще не хочу идти на уроки..."
26005-260050020 = "Есть какой-нибудь способ от этого отвертеться, Сенсей?"
26005-260050030 = "Сегодня...? Что-то случилось?"
26005-260050040 = "К тому же ты спрашиваешь об этом меня, своего учителя? Ха-ха."
26005-260050050 = "Знаю, знаю. Мне не стоит говорить вам такие вещи, Сенсей."
26005-260050060 = "Просто сегодня кафе «Мильфёй» должно представить новое блюдо..."
26005-260050070 = "Презентация будет во время уроков, но ничего страшного. Не переживайте."
26005-260050080 = "Давай пока просто сосредоточимся на занятиях."
26005-260050090 = "О, понятно. Я вас поняла."
26005-260050100 = "Да, простите. Вы правы..."
26005-260050110 = "...?"
26005-260050120 = "Не переживайте, это моя обычная ерунда... В общем, поняла."
26005-260050130 = "Поговорим позже! //(￣︶￣*))"
26005-260050140 = "Это было лучшее!"
26005-260050150 = "«Мильфёй» никогда не подводит!"
26005-260050160 = "Как вам, Сенсей? Понравилось? Я про «Солнечный мусс»."
26005-260050170 = "О..."
26005-260050180 = "Неважно."
26005-260050190 = "Стоп, ничего не говорите. Ни слова."
26005-260050200 = "Вы наверняка снова скажете что-нибудь странное и испортите момент."
26005-260050210 = "..."
26005-260050220 = "Хи-хи."
26005-260050230 = "До встречи, Сенсей!"
26005-260050240 = "А."
26005-260050250 = "Кстати, Сенсей. Я тут подумала..."
26005-260050260 = "Есть кафе, куда вы хотели бы сходить?"
26005-260050270 = "Нашла хорошее кафе?"
26005-260050280 = "?"
26005-260050290 = "Я ведь ещё даже ничего не сказала."
26005-260050300 = "То есть это И ПРАВДА кафе, но..."
26005-260050310 = "Ха-ха."
26005-260050320 = "Ну, наверное, наши разговоры всегда такие."
26005-260050330 = "А."
26005-260050340 = "ААА!!!"
26005-260050350 = "Я злюсь!"
26005-260050360 = "Как же меня бесит!!"
26005-260050370 = "Ха-ха."
26005-260050380 = "Ха-ха-ха."
26005-260050390 = "Ха-ха-ха-ха-ха-ха-ха!"
26005-260050400 = "Сделать вид, что угощаете меня... а потом съесть самому..."
26005-260050410 = "Как вы могли?! Дьявол!!"
26005-260050420 = "Не хочу это слышать."
26005-260050430 = "Ты сама напросилась."
26005-260050440 = "И..."
26005-260050450 = "Хи-хи."
26005-260050460 = "Я ещё раз вас угощу."
26005-260050470 = "В следующий раз постарайтесь всё-таки получить свою порцию, Сенсей."
26005-260050480 = "Поняли?"
