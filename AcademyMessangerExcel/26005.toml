[translation]
26005-1699 = "Sensei, tá livre? Tá à toa aí, né?"
26005-1700 = "Não é nada demais, mas tenho um favor pra te pedir."
26005-1701 = "Se estiver ocupado deixa quieto, não é nada importante mesmo."
26005-1702 = "Agora eu tô meio ocupado..."
26005-1703 = "Claro que tô livre, sou um desocupado mesmo."
26005-1704 = "...Imaginei."
26005-1705 = "Tá, entendi. Desculpa atrapalhar."
26005-1706 = "Ei, eu também não disse isso!"
26005-1707 = "É sério! Não foi nesse sentido que eu quis dizer!"
26005-1708 = "Mentira, tô brincando."
26005-1709 = "Tirando onda com a minha cara de novo!!!!"
26005-1710 = "Juro que dessa vez não te perdoo..."
26005-1711 = "...Enfim, você tem tempo livre, né? Como castigo por ter zombado de mim, vai ter que me acompanhar direitinho."
26005-1712 = "Vem pro 'Café Mille-Feuille'."
26005-1713 = "E é segredo das outras meninas, viu?"
26005-1714 = "Na próxima vez sou eu que pago sem falta! Depois te mando mensagem!"
26005-1715 = "Sensei, tem um tempinho agora?"
26005-1716 = "Nem vem dizer que esqueceu a promessa do outro dia. Eu ainda tô te devendo uma."
26005-1717 = "E já vou avisando que você não tem direito de recusar. Vai vir comigo, né?"
26005-1718 = "...Escrevendo assim ficou parecendo meio estranho, mas..."
26005-1719 = "Quis dizer retribuir o favor! Só isso!"
26005-1720 = "Por mim, se tivesse outro sentido, seria super bem-vindo também."
26005-1721 = "Eu lembro direitinho. Beleza, combinado."
26005-1722 = "Dá pra parar com essas piadas que fazem mal pro coração...?"
26005-1723 = "Bom, tô te esperando, vê se não atrasa!"
26005-1724 = "Não fala mais nada."
26005-1725 = "Esquece."
26005-1726 = "Apaga tudo da sua memória."
26005-1727 = "Se você tocar no assunto da minha bunda, eu te mato de verdade."
26005-1728 = "Sensei, tá livre agora?"
26005-1729 = "Não é nada demais, só queria uma ajudinha sua."
26005-1730 = "O que nós vamos comer dessa vez?"
26005-1731 = "Por que você já parte do princípio de que a gente vai comer?!"
26005-1732 = "Tá achando que eu sou uma porca ou o quê?! Que toda vez que abro a boca é atrás de comida?!"
26005-1733 = "Não tem nada a ver! É outro pedido!"
26005-1734 = "...É uma coisa séria, que eu quero pedir justamente porque é você, Sensei."
26005-1735 = "Tô brincando, pra onde eu vou?"
26005-1736 = "..."
26005-1737 = "Fazendo isso comigo de novo..."
26005-1738 = "...Obrigada. O lugar é..."
26005-1739 = "Obrigada por hoje."
26005-1740 = "...Hum, conto com você daqui pra frente também, Sensei."
26005-260050010 = "Não quero ir pra aula..."
26005-260050020 = "Ei, Sensei, não conhece nenhum jeito esperto de matar aula sem ser pega?"
26005-260050030 = "Hum..."
26005-260050040 = "Você tá perguntando isso logo pra mim, que sou professor?!"
26005-260050050 = "Eu sei, eu sei muito bem que é bizarro perguntar isso pra um professor."
26005-260050060 = "É só que hoje é o dia de lançamento do doce novo do 'Café Mille-Feuille'..."
26005-260050070 = "E a loja abre bem no horário da aula... É só por isso. Não é nada demais, deixa pra lá."
26005-260050080 = "Eu entendo como se sente, mas por enquanto é melhor priorizar a aula."
26005-260050090 = "OK, deixa comigo."
26005-260050100 = "Ugh, bom, claro que você diria isso..."
26005-260050110 = "...?"
26005-260050120 = "Você entendeu o contexto da conversa...? Bom, tanto faz. Vou assistir à aula direitinho."
26005-260050130 = "Depois, se me der na telha, eu te mando mensagem de novo (￣︶￣*)"
26005-260050140 = "Aah, tava uma delícia!"
26005-260050150 = "Os doces de lá nunca decepcionam mesmo! Aquela textura que derrete na boca e o gostinho agridoce...!"
26005-260050160 = "Você também gosta desse tipo de coisa, Sensei?"
26005-260050170 = "Ah"
26005-260050180 = "Não"
26005-260050190 = "Esquece, cancela o que eu disse, não fala nada."
26005-260050200 = "Isso não pegou bem, não foi isso que eu quis dizer."
26005-260050210 = "..."
26005-260050220 = "Hehe, se não entendeu, melhor assim."
26005-260050230 = "Até mais então, Sensei."
26005-260050240 = "Aliás,"
26005-260050250 = "Sensei."
26005-260050260 = "Em qual cafeteria vamos?"
26005-260050270 = "Encontrou algum lugar legal?"
26005-260050280 = "Hã? O quê?"
26005-260050290 = "Eu ainda nem falei nada..."
26005-260050300 = "Quer dizer, eu tô numa cafeteria sim, mas..."
26005-260050310 = "Toda vez que você me manda mensagem você tá numa cafeteria."
26005-260050320 = "Aí achei que dessa vez fosse a mesma coisa."
26005-260050330 = "Bom, até que é verdade, mas..."
26005-260050340 = "Sei lá, mesmo assim..."
26005-260050350 = "Acho meio chato você já sair tirando conclusão assim."
26005-260050360 = "Tanto faz, vou te mandar o endereço já já, então vem logo."
26005-260050370 = "Hehe"
26005-260050380 = "Ai, chega!"
26005-260050390 = "Isso foi muito bizarro!"
26005-260050400 = "E a Yoshimi tinha comprado pra mim com tanto carinho..."
26005-260050410 = "Tomar de volta algo que já tinha dado é coisa de ogro! De demônio!!"
26005-260050420 = "Cala a boca."
26005-260050430 = "Você que procurou por isso, né?"
26005-260050440 = "Haa..."
26005-260050450 = "Não tem jeito mesmo."
26005-260050460 = "Eu vou lá comprar outro."
26005-260050470 = "Dessa vez vê se cuida direito, ouviu bem?"
26005-260050480 = "Sensei♪"
