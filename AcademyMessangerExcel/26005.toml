[translation]
26005-1699 = "Сенсей, вы свободны? Ну конечно же свободны, да?"
26005-1700 = "Ничего серьёзного, но есть просьба."
26005-1701 = "Если заняты — ничего страшного, это неважно."
26005-1702 = "Сейчас я немного занят..."
26005-1703 = "Конечно, я свободен, я же бездельник."
26005-1704 = "...Ну да, конечно."
26005-1705 = "Ладно, поняла. Прости, что побеспокоила."
26005-1706 = "Нет, я не это имел в виду!"
26005-1707 = "Правда! Я не хотел сказать что-то плохое!"
26005-1708 = "Вру, шучу."
26005-1709 = "Опять ты меня дразнишь!!!!"
26005-1710 = "Вот теперь я тебя точно не прощу..."
26005-1711 = "...В общем, раз ты свободен, а в наказание за подколы придётся составить мне компанию."
26005-1712 = "Приходи в «Кафе Мильфёй»."
26005-1713 = "Только никому не говори."
26005-1714 = "В следующий раз угощаю я! Напишу позже!"
26005-1715 = "Сенсей, у вас есть время сейчас?"
26005-1716 = "Не говорите, что забыли о прошлом обещании. У вас ещё остался долг."
26005-1717 = "Сразу предупреждаю: права отказа нет. Вы ведь составите мне компанию?"
26005-1718 = "...Когда пишу, звучит как-то странно."
26005-1719 = "Я имела в виду вернуть долг! Только и всего!"
26005-1720 = "А я бы и на другой смысл согласился."
26005-1721 = "Я помню. Всё в порядке, договорились."
26005-1722 = "Перестань шутить так, у меня сердце не железное...?"
26005-1723 = "Тогда я жду, не опаздывай!"
26005-1724 = "Ничего не говори."
26005-1725 = "Забудь."
26005-1726 = "Сотри всё из памяти."
26005-1727 = "Если хоть слово про задницу — убью всерьёз."
26005-1728 = "Сенсей, у вас есть время сейчас?"
26005-1729 = "Ничего серьёзного, просто нужна помощь."
26005-1730 = "На этот раз куда идём есть?"
26005-1731 = "Почему ты думаешь, что это про еду?"
26005-1732 = "Ты считаешь меня свиньёй? Думаешь, если я рот открываю, то только чтобы пожрать?"
26005-1733 = "Нет! Это другое!"
26005-1734 = "...Серьёзное дело, которое я могу доверить только тебе."
26005-1735 = "Шучу. Куда мне идти?"
26005-1736 = "..."
26005-1737 = "Опять ты так..."
26005-1738 = "...Спасибо. Место встречи..."
26005-1739 = "Спасибо за сегодня."
26005-1740 = "...В общем, будем дружить, Сенсей."
26005-260050010 = "Не хочу на занятия..."
26005-260050020 = "Слушай, Сенсей, есть какой-нибудь хороший способ прогулять?"
26005-260050030 = "Ну..."
26005-260050040 = "Ты спрашиваешь об этом у своего учителя!?"
26005-260050050 = "Понимаю, я сама понимаю, что глупо спрашивать об этом учителя."
26005-260050060 = "Просто сегодня выходит новинка в «Кафе Мильфёй»..."
26005-260050070 = "А открываются они как раз во время занятий... Причина только в этом. Ничего серьёзного, не обращай внимания."
26005-260050080 = "Я понимаю, но всё же лучше сначала занятия."
26005-260050090 = "Окей, договорились."
26005-260050100 = "Уф, ну да, конечно..."
26005-260050110 = "...?"
26005-260050120 = "Ты понял контекст?... Ну ладно, ничего не поделаешь. Я пойду на занятия."
26005-260050130 = "Тогда напишу, когда настроение будет (￣︶￣*)"
26005-260050140 = "Ах, как вкусно!"
26005-260050150 = "Их десерты никогда не подводят! Эта тающая текстура и кисло-сладкий вкус...!"
26005-260050160 = "Тебе такое тоже нравится, Сенсей?"
26005-260050170 = "Ах"
26005-260050180 = "Нет"
26005-260050190 = "Нет, забудь, не говори ничего."
26005-260050200 = "Так нельзя, не так."
26005-260050210 = "..."
26005-260050220 = "Хе-хе, если не понимаешь, неважно."
26005-260050230 = "Тогда до встречи, Сенсей."
26005-260050240 = "Кстати,"
26005-260050250 = "Сенсей,"
26005-260050260 = "в какое кафе пойдём?"
26005-260050270 = "Нашёл что-то хорошее?"
26005-260050280 = "Что?"
26005-260050290 = "Я ещё ничего не говорила..."
26005-260050300 = "Нет, ну, кафе, в общем-то, да."
26005-260050310 = "Ты всегда зовёшь в кафе,"
26005-260050320 = "вот я и подумал, что и сейчас так."
26005-260050330 = "Ну, вообще да."
26005-260050340 = "Но, знаешь..."
26005-260050350 = "не люблю, когда за меня решают."
26005-260050360 = "Ладно, скину адрес позже, приходи."
26005-260050370 = "Хе-хе"
26005-260050380 = "Ах, ну всё."
26005-260050390 = "Странно."
26005-260050400 = "Йошими купила мне, а ты..."
26005-260050410 = "Отнять то, что тебе подарили — это жестоко! Ты демон!!"
26005-260050420 = "Заткнись."
26005-260050430 = "Сама виновата."
26005-260050440 = "Вздох..."
26005-260050450 = "Ничего не поделаешь."
26005-260050460 = "Я куплю тебе ещё."
26005-260050470 = "В следующий раз цени, понял?"
26005-260050480 = "Сенсей♪"