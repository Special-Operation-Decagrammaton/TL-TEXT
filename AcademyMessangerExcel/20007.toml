[translation]
20007-200070010 = "...Вы тот самый Сенсей из Шале?"
20007-200070020 = "Кто это?"
20007-200070030 = "Не думаю, что ты студент..."
20007-200070040 = "Тсс."
20007-200070050 = "Сейчас я не могу вам сказать."
20007-200070060 = "У меня просьба к вам, решателю проблем Кивотоса и Сенсею, которому студенты доверяют и на которого полагаются."
20007-200070070 = "После заката приходите в указанное мной место."
20007-200070080 = "Никому больше об этом не говорите!"
20007-200070090 = "Сенсей, это Мику. Я связывалась с вами раньше."
20007-200070100 = "Как идут приготовления к выступлению?"
20007-200070110 = "Довольно хорошо."
20007-200070120 = "...За исключением того, что голос не выходит."
20007-200070130 = "Ты выяснила, как вернуть голос?"
20007-200070140 = "Ну, я кое-что изучила."
20007-200070150 = "Я знала, что на тебя можно рассчитывать!"
20007-200070160 = "Тогда могу я увидеться с вами после дневной репетиции?"
20007-200070170 = "Я буду ждать вас в гримёрной Live House."
20007-200070180 = "До выступления уже всего неделя..."
20007-200070190 = "Ты всё ещё не можешь петь?"
20007-200070200 = "Да. Как ни стараюсь, голос не возвращается..."
20007-200070210 = "Похоже, придётся отменить выступление."
20007-200070220 = "Жаль."
20007-200070230 = "Я тоже ждал твоего выступления, Мику."
20007-200070240 = "Эм, Сенсей?"
20007-200070250 = "Если вы не против, можем ненадолго встретиться в переулке за городом?"
20007-200070260 = "Я хочу кое-что вам сказать."
20007-200070270 = "Сенсей, я закончила песню, о которой вы говорили в прошлый раз."
20007-200070280 = "Она ещё не идеальна, но я уверена, с этой песней..."
20007-200070290 = "я смогу передать публике свои чувства."
20007-200070300 = "Отличная работа."
20007-200070310 = "Уверен, всем понравится."
20007-200070320 = "Вы правда думаете, что всё будет хорошо?"
20007-200070330 = "В Live House, где добавляют песни для выступлений, всё наверняка строго контролируется,"
20007-200070340 = "так что разве сейчас не будет сложно заменить песню на новую?"
20007-200070350 = "Об этом не волнуйся."
20007-200070360 = "В Шале много студентов, которые отлично разбираются во взломе и инженерии."
20007-200070370 = "Эм, мне немного странно спрашивать об этом только сейчас, но..."
20007-200070380 = "Что вообще за организация Шале?"
