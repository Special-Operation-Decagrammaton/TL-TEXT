[translation]
20007-200070010 = "Hum, este é o contato do Sensei da Schale... certo?"
20007-200070020 = "Quem fala...?"
20007-200070030 = "A gente já se encontrou em algum lugar...?"
20007-200070040 = "Hehe."
20007-200070050 = "Eu adoraria explicar tudo agora, mas... deixo isso para daqui a pouco."
20007-200070060 = "Eu tenho um pedido para fazer a você, Sensei, alguém em quem tantas alunas confiam e que é conhecido como a pessoa que resolve qualquer problema em toda Kivotos."
20007-200070070 = "Ao anoitecer, você poderia vir até o local que vou te enviar em seguida?"
20007-200070080 = "Ah, e por favor, mantenha isso em segredo das outras pessoas, tá bom?!"
20007-200070090 = "Olá, Sensei!"
20007-200070100 = "Como estão as coisas desde então?"
20007-200070110 = "Ah, bom... Por aqui estou dando um jeito."
20007-200070120 = "Mas a minha voz ainda não sai..."
20007-200070130 = "E você, conseguiu descobrir alguma coisa depois daquilo?"
20007-200070140 = "Sim. Pelo que pesquisei, encontrei alguns métodos que parecem promissores."
20007-200070150 = "Sério mesmo?! Não esperava menos de você, Sensei!"
20007-200070160 = "Então, será que podemos nos encontrar rapidinho depois que o meu ensaio da tarde terminar?"
20007-200070170 = "Vou estar esperando no camarim da casa de shows."
20007-200070180 = "Agora falta só uma semana para o show..."
20007-200070190 = "A sua garganta continua na mesma?"
20007-200070200 = "Sim..."
20007-200070210 = "Será que não é melhor eu tentar perguntar mais uma vez se não dá mesmo para cancelar?"
20007-200070220 = "Ainda deve haver algum jeito..."
20007-200070230 = "Eu também quero muito ver o seu show, Miku... Vamos dar um jeito de encontrar uma solução..."
20007-200070240 = "Hum, Sensei..."
20007-200070250 = "Se você estiver livre, podemos nos encontrar agora?"
20007-200070260 = "Tem uma coisinha que eu queria conversar com você. Estarei esperando no beco."
20007-200070270 = "Sensei, a música ficou pronta...!"
20007-200070280 = "Ainda parece faltar um pouco de polimento em várias partes, mas..."
20007-200070290 = "Eu coloquei todo o meu coração nela."
20007-200070300 = "Ótimo trabalho!"
20007-200070310 = "Vai dar tudo certo, todo mundo vai adorar."
20007-200070320 = "Mas será que vai dar tudo certo mesmo...?"
20007-200070330 = "Pedir permissão pelos meios normais parece que vai ser difícil..."
20007-200070340 = "E mesmo se tentarmos fazer escondido, a segurança de lá é bem reforçada..."
20007-200070350 = "Deixa comigo."
20007-200070360 = "Na Schale, temos muitas alunas que são especialistas em hacking e engenharia."
20007-200070370 = "Hum, sei que é meio tarde para perguntar isso, mas..."
20007-200070380 = "Que tipo de organização é a Schale, afinal...?"
