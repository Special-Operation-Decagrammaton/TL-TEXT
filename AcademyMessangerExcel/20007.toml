[translation]
20007-200070010 = "Эм, это Сенсей из Шале...?"
20007-200070020 = "А вы кто...?"
20007-200070030 = "Мы где-то встречались...?"
20007-200070040 = "Хе-хе"
20007-200070050 = "Я бы хотела объяснить, но... это позже."
20007-200070060 = "К вам, Сенсей, который завоевал доверие многих студентов и считается надёжным человеком... а также фиксером всего Кивотоса, у меня есть просьба."
20007-200070070 = "Не могли бы вы прийти в место, которое я укажу, после заката?"
20007-200070080 = "А, и пожалуйста, никому не говорите!"
20007-200070090 = "Сенсей, здравствуйте!"
20007-200070100 = "Как дела после того раза?"
20007-200070110 = "А, да. Там всё более-менее."
20007-200070120 = "Голос пока ещё не вернулся, но..."
20007-200070130 = "Вы что-нибудь нашли после того случая?"
20007-200070140 = "Да. Похоже, есть несколько хороших способов."
20007-200070150 = "Правда!? Как и ожидалось от Сенсея!"
20007-200070160 = "Тогда можем встретиться после дневной репетиции?"
20007-200070170 = "Я буду ждать в гримёрке концертного зала."
20007-200070180 = "До концерта осталась всего неделя..."
20007-200070190 = "Состояние голоса не изменилось?"
20007-200070200 = "Да..."
20007-200070210 = "Может, стоит ещё раз попросить об отмене?"
20007-200070220 = "Есть ли ещё какой-нибудь способ..."
20007-200070230 = "Я тоже хочу увидеть выступление Мику... нужно найти хорошее решение..."
20007-200070240 = "Эм, Сенсей"
20007-200070250 = "Если можно, не могли бы мы встретиться сейчас?"
20007-200070260 = "Я хочу кое-что обсудить. Буду ждать в переулке."
20007-200070270 = "Сенсей, песня готова...!"
20007-200070280 = "Хотя в ней ещё много несовершенств..."
20007-200070290 = "Я вложила в неё всю душу."
20007-200070300 = "Ты молодец!"
20007-200070310 = "Всё будет хорошо, всем понравится."
20007-200070320 = "Но действительно ли всё будет хорошо...?"
20007-200070330 = "Даже если попросить по-хорошему, будет сложно..."
20007-200070340 = "Да и чтобы сделать тайно, охрана слишком серьёзная..."
20007-200070350 = "Не переживай."
20007-200070360 = "В Шале много студентов, которые разбираются в хакинге и инженерии."
20007-200070370 = "Ну, я уже спрашивала, но..."
20007-200070380 = "Шале — это вообще какая организация...?"