[translation]
10047-100470010 = "Сенсей, каникулы."
10047-100470020 = "А? Каникулы...? Что случилось, Чисэ?"
10047-100470030 = "Ага, у меня летние каникулы."
10047-100470040 = "Я усердно работаю для Клуба Инь-Ян."
10047-100470050 = "Поэтому мне дали немного отдохнуть."
10047-100470060 = "А, вот что ты имела в виду. Здорово."
10047-100470070 = "У тебя есть планы?"
10047-100470080 = "Ага. Есть планы."
10047-100470090 = "О... какие...?"
10047-100470100 = "Сенсей, давай пойдём искать."
10047-100470110 = "А-а? Искать что?"
10047-100470120 = "Сигнал сбора."
10047-100470130 = "Буду ждать тебя на пляже."
10047-100470140 = "А? Сигнал сбора?"
10047-100470150 = "Тогда... увидимся там?"
10047-100470160 = "Сенсей, я искала блёстки и..."
10047-100470170 = "нашла на пляже кое-что невероятное."
10047-100470180 = "Раз уж даже ты считаешь это невероятным, должно быть, это что-то особенное."
10047-100470190 = "Ага, хочу тебе показать."
10047-100470200 = "О, как раз вовремя."
10047-100470210 = "Пойдём посмотрим, Сенсей!"
10047-100470220 = "Буду ждать!"
10047-100470230 = "Сенсей."
10047-100470240 = "О, Чисэ. Что такое?"
10047-100470250 = "Ты чистишь зубы?"
10047-100470260 = "Д-да...?"
10047-100470270 = "Почему спрашиваешь...?"
10047-100470280 = "Это хорошо. Да."
10047-100470290 = "Сенсей, отныне"
10047-100470300 = "что бы ни случилось,"
10047-100470310 = "чисти зубы три раза в день, хорошо?"
10047-100470320 = "Д-да?"
10047-100470330 = "Хорошо, пока."
10047-100470340 = "Сенсей."
10047-100470350 = "Чисэ..? Эм, Чисэ?"
10047-100470360 = "Сенсей, на пляже так весело играть."
10047-100470370 = "Рад, что тебе нравится."
10047-100470380 = "Ага, но"
10047-100470390 = "веселиться одной одиноко."
10047-100470400 = "Понимаю."
10047-100470410 = "С кем-то играть веселее."
10047-100470420 = "О, придумала."
10047-100470430 = "Для всех, кто не может приехать на пляж..."
10047-100470440 = "Эм... да?"
10047-100470450 = "Я отнесу пляж к ним ♪"
10047-100470460 = "Ага, просто отнесу им пляж."
10047-100470470 = "Эм, Чисэ? И как ты собираешься это сделать?"
10047-100470480 = "Начнём."
10047-100470490 = "Подожди, Чисэ! Я скоро буду, просто подожди немного!"
