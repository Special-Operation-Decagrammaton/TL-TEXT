[translation]
10047-100470010 = "Sensei, bora curtir as férias~"
10047-100470020 = "Férias...?"
10047-100470030 = "Uhum, eu ganhei. Férias de verão."
10047-100470040 = "Como eu sempre me esforço nas atividades do Clube Yin-Yang,"
10047-100470050 = "me disseram pra ir descansar bastante."
10047-100470060 = "Entendi. Que notícia boa!"
10047-100470070 = "E você tem algum plano para as férias de verão?"
10047-100470080 = "Uhum, claro que tenho~"
10047-100470090 = "Posso perguntar quais são os seus planos?"
10047-100470100 = "Vamos sair pra procurar, Sensei."
10047-100470110 = "Procurar o quê?"
10047-100470120 = "Então tá marcado."
10047-100470130 = "Te espero na praia, viu?"
10047-100470140 = "H-hum, Chise...?"
10047-100470150 = "Bom, acho que é só eu ir para a praia, né...?"
10047-100470160 = "Sensei. Outro dia, quando estávamos procurando coisas brilhantes,"
10047-100470170 = "eu encontrei uma coisa incrível na beira da praia."
10047-100470180 = "Agora fiquei curioso...!"
10047-100470190 = "Uhum, eu também quero muito te mostrar, Sensei."
10047-100470200 = "Já que estamos aqui,"
10047-100470210 = "vamos lá ver juntos, Sensei."
10047-100470220 = "Vou ficar te esperando~"
10047-100470230 = "Sensei"
10047-100470240 = "Ah, oi, Chise. O que foi?"
10047-100470250 = "Você tem escovado os dentes direitinho?"
10047-100470260 = "S-sim."
10047-100470270 = "Mas por que essa pergunta tão de repente...?"
10047-100470280 = "Que bom."
10047-100470290 = "Então, Sensei,"
10047-100470300 = "daqui pra frente também, três vezes ao dia,"
10047-100470310 = "não se esqueça de escovar os dentes, tá bom?"
10047-100470320 = "C-certo. Entendido."
10047-100470330 = "Então tá..."
10047-100470340 = "Se cuida, viu, Sensei?"
10047-100470350 = "...Chise?"
10047-100470360 = "Sensei, brincar na praia é tão divertido~"
10047-100470370 = "Fico muito feliz em ver que você está se divertindo, Chise."
10047-100470380 = "Uhum, mas..."
10047-100470390 = "Mesmo assim, é um desperdício me divertir sozinha~"
10047-100470400 = "Acho que entendo como você se sente."
10047-100470410 = "Quando estamos com mais gente, fica ainda mais divertido, né?"
10047-100470420 = "Ah, tive uma ótima ideia."
10047-100470430 = "Se todo mundo não pode vir até a praia..."
10047-100470440 = "Se não podem vir...?"
10047-100470450 = "É só eu fazer o contrário e levar a praia até todo mundo~"
10047-100470460 = "Beleza~ Agora que decidi, mãos à obra~"
10047-100470470 = "...Hã? Chise? Como assim levar a praia...?"
10047-100470480 = "Começaaando~"
10047-100470490 = "E-espera um pouco! Já estou indo para aí!"
