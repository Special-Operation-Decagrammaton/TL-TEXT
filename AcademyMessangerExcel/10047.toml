[translation]
10047-100470010 = "Сенсей, летс вакация."
10047-100470020 = "Вакация...?"
10047-100470030 = "Да, я получила летние каникулы."
10047-100470040 = "За то, что всегда усердно работаю в Отделе инь-ян."
10047-100470050 = "Мне сказали: «Отдохни как следует»."
10047-100470060 = "Понятно. Это замечательно."
10047-100470070 = "У тебя есть какие-то планы на летние каникулы?"
10047-100470080 = "Да, конечно."
10047-100470090 = "Можно узнать, что за планы?"
10047-100470100 = "Пойдём искать, Сенсей."
10047-100470110 = "Искать — что?"
10047-100470120 = "Тогда встречаемся."
10047-100470130 = "Я буду ждать на море."
10047-100470140 = "Э-э, Чисе...?"
10047-100470150 = "Наверное, мне просто нужно прийти на море...?"
10047-100470160 = "Сенсей, когда я искала блестяшки в прошлый раз,"
10047-100470170 = "я нашла на берегу кое-что удивительное."
10047-100470180 = "Интересно...!"
10047-100470190 = "Да, я хочу показать это вам."
10047-100470200 = "Раз уж такой случай,"
10047-100470210 = "давайте пойдём посмотрим вместе, Сенсей."
10047-100470220 = "Тогда я буду ждать вас~"
10047-100470230 = "Сенсей."
10047-100470240 = "А, Чисе. Что случилось?"
10047-100470250 = "Вы чистите зубы как следует?"
10047-100470260 = "Д-да."
10047-100470270 = "С чего вдруг такой вопрос...?"
10047-100470280 = "Это хорошо."
10047-100470290 = "Тогда, Сенсей,"
10047-100470300 = "и впредь, три раза в день"
10047-100470310 = "не забывайте чистить зубы, хорошо?"
10047-100470320 = "Д-да, конечно. Понял."
10047-100470330 = "Тогда..."
10047-100470340 = "Будьте здоровы, Сенсей."
10047-100470350 = "...Чисе?"
10047-100470360 = "Сенсей, играть на пляже весело~"
10047-100470370 = "Я рад, что тебе, Чисе, весело."
10047-100470380 = "Да, но..."
10047-100470390 = "всё-таки веселиться в одиночку — как-то жалко~"
10047-100470400 = "Понимаю, что ты имеешь в виду."
10047-100470410 = "С кем-то вместе всегда веселее."
10047-100470420 = "А, придумала!"
10047-100470430 = "Раз нельзя прийти на море всем вместе..."
10047-100470440 = "Если нельзя...?"
10047-100470450 = "Тогда я просто принесу море с собой~"
10047-100470460 = "Так, решено, тогда сейчас же~"
10047-100470470 = "...А? Чисе? Принести море...?"
10047-100470480 = "Вперёд~!"
10047-100470490 = "П-подожди! Я сейчас приду!"
