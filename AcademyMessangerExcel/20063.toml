20063-200630180 = "Thanks"
20063-200630190 = "For teaching me what it means to be normal."
20063-200630200 = "Penguin, out."
20063-200630210 = "Sensei, are you available?"
20063-200630220 = "I want to buy something."
20063-200630230 = "I require expert support."
20063-200630240 = "Did someone call for the shopping expert?"
20063-200630250 = "Leave it to me!"
20063-200630260 = "Then we'll regroup at the parking lot."
20063-200630270 = "Outdoor parking lot No.1, spot A113."
20063-200630280 = "Penguin, out."
20063-200630290 = "I knew I could count on you."
20063-200630300 = "Thanks to your help, Skullman isn't lonely anymore, and the smell isn't so bad."
20063-200630310 = "Meanwhile, all I could think of was applying toothpaste."
20063-200630320 = "And you're not feeling lonely anymore either, right?"
20063-200630330 = "Of course."
20063-200630340 = "...All because of you."
20063-200630350 = "Thanks. Penguin, out."
20063-200630360 = "Do you know what a Delta Tango is?"
20063-200630370 = "I'll be headed there soon"
20063-200630380 = "Is it some kind of dance?"
20063-200630390 = "There'll be more details at the location."
20063-200630400 = "It'll be a difficult mission."
20063-200630410 = "Requesting for backup."
20063-200630420 = "Roger that...?"
20063-200630430 = "I don't know what'll be waiting there."
20063-200630440 = "I'll bring the tank just in case."
20063-200630450 = "Transmitting the rendezvous point to you now."
20063-200630460 = "Penguin, out."
20063-200630470 = "What do I do, Sensei?"
20063-200630480 = "I want to go through a Delta Tango again."
20063-200630490 = "We promised to go again together next time."
20063-200630500 = "When are you available to go again?"
20063-200630510 = "Just call me over and I'll be right there!"
20063-200630520 = "Good, then let's head over right away."
20063-200630530 = "I'll handle ordering again."
20063-200630540 = "Penguin, out."
20063-200630550 = "Sensei, it's me."
20063-200630560 = "Hello Squirrel!"
20063-200630570 = "Hm? Ah."
20063-200630580 = "If I'm Squirrel, then you'll be Acorn."
20063-200630590 = "Acorn, I require your support."
20063-200630600 = "As part of an SSE, I require IMINT for a PSR."
20063-200630610 = "This isn't standard procedure though, so I don't feel confident handling it alone."
20063-200630620 = "You need a what... for a what?"
20063-200630630 = "I'd like to hurry the SV. I'll explain the details on-site."
20063-200630640 = "Squirrel, out."
20063-200630650 = "Sensei."
20063-200630660 = "I'm fine now."
20063-200630670 = "Thanks for staying by my side."
20063-200630680 = "Not just today, but all this time..."
20063-200630690 = "I'll always be by your side, Azusa!"
20063-200630700 = "By the way, is it fine to not use a callsign?"
20063-200630710 = "A callsign?"
20063-200630720 = "There are times where you don't need them in plain language."
20063-200630730 = "Besides"
20063-200630740 = "I don't think they're used normally."
20063-200630750 = "So it's fine to just call me Azusa."
20063-200630760 = "See you again, Sensei."