[translation]
20063-200630010 = "Aqui é Pinguim."
20063-200630020 = "Pato, responda."
20063-200630030 = "Quero me encontrar com você."
20063-200630040 = "Aqui é Pato, copiado."
20063-200630050 = "Solicito as coordenadas."
20063-200630060 = "Pinguim na escuta, sinal forte e claro."
20063-200630070 = "No Estacionamento Nº 2 da pousada."
20063-200630080 = "Ué, não vai passar em coordenadas...?!"
20063-200630090 = "Quando o ponto de referência é óbvio, coordenadas são desnecessárias."
20063-200630100 = "Nos encontramos no local."
20063-200630110 = "Da parte de Pinguim, é tudo."
20063-200630120 = "Aqui é Pinguim. Pato, responda."
20063-200630130 = "Olá, Pinguim!"
20063-200630140 = "Pinguim, olá!"
20063-200630150 = "Muito bem, conexão sem anormalidades."
20063-200630160 = "Você me salvou hoje."
20063-200630170 = "E além disso..."
20063-200630180 = "Obrigada"
20063-200630190 = "por me ensinar como é o \"normal\"."
20063-200630200 = "Da parte de Pinguim, é tudo."
20063-200630210 = "Sensei, você tem tempo agora?"
20063-200630220 = "Quero sair para comprar suprimentos."
20063-200630230 = "Preciso do suporte de um especialista."
20063-200630240 = "Chamou o especialista em compras?"
20063-200630250 = "Deixa comigo!"
20063-200630260 = "Então vamos nos reunir no estacionamento."
20063-200630270 = "Vaga A113 do Estacionamento Externo Nº 1."
20063-200630280 = "Câmbio e desligo."
20063-200630290 = "Como esperado de você, Sensei."
20063-200630300 = "Graças a você, o Skullman não se sente mais sozinho e o cheiro forte suavizou."
20063-200630310 = "Eu só tinha pensado na ideia de passar pasta de dente."
20063-200630320 = "E você, Azusa, também não está se sentindo sozinha?"
20063-200630330 = "Claro que não."
20063-200630340 = "...Graças a você, Sensei."
20063-200630350 = "Obrigada. Da parte de Pinguim, é tudo."
20063-200630360 = "Sensei, você sabe o que é \"Delta Tango\"?"
20063-200630370 = "Estou prestes a me dirigir até lá."
20063-200630380 = "É algum estilo de dança?"
20063-200630390 = "Verificarei os detalhes no local."
20063-200630400 = "Deve ser uma missão árdua."
20063-200630410 = "Solicito reforços."
20063-200630420 = "Copiado...?"
20063-200630430 = "Não sabemos o que nos aguarda."
20063-200630440 = "Por precaução, vamos de tanque."
20063-200630450 = "Enviarei o ponto de encontro."
20063-200630460 = "Fim da transmissão."
20063-200630470 = "Sensei, o que eu faço?"
20063-200630480 = "Já estou com vontade de ir ao Delta Tango de novo."
20063-200630490 = "Lembro que tínhamos combinado de ir juntos da próxima vez."
20063-200630500 = "Quando podemos ir de novo?"
20063-200630510 = "Basta me chamar que eu vou a qualquer hora!"
20063-200630520 = "Ótimo, então vamos agora mesmo."
20063-200630530 = "Pode deixar o pedido na fila por minha conta desta vez também."
20063-200630540 = "Fim da transmissão."
20063-200630550 = "Sensei, sou eu."
20063-200630560 = "Olá, Esquilo!"
20063-200630570 = "Hum? Ah."
20063-200630580 = "Se eu sou Esquilo, então você será Noz, Sensei."
20063-200630590 = "Pois bem, Noz, solicito apoio."
20063-200630600 = "Como parte do SSE, precisamos de IMINT para o PSR."
20063-200630610 = "Por não ser um procedimento padrão, fico insegura de realizar a operação sozinha."
20063-200630620 = "O que... precisa do quê?"
20063-200630630 = "Quero apressar o SV. Explicarei os detalhes no local."
20063-200630640 = "Da parte de Esquilo, é tudo."
20063-200630650 = "Sensei."
20063-200630660 = "Já está tudo bem."
20063-200630670 = "Obrigada por ficar ao meu lado."
20063-200630680 = "Não só hoje, mas desde sempre..."
20063-200630690 = "Eu estarei sempre ao seu lado, Azusa!"
20063-200630700 = "Aliás, tudo bem não usar codinome agora?"
20063-200630710 = "Codinome, é..."
20063-200630720 = "Em texto aberto comum, há casos em que não é necessário."
20063-200630730 = "Além do mais,"
20063-200630740 = "acho que \"normalmente\" não se usa."
20063-200630750 = "Por isso, Azusa já basta."
20063-200630760 = "Até breve, Sensei."
