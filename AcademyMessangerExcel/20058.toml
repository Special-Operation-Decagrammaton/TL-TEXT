[translation]
20058-200580010 = "Привет, Сенсей."
20058-200580020 = "Это Эрика, верно?"
20058-200580030 = "Здравствуйте."
20058-200580040 = "А, хорошо."
20058-200580050 = "Вы меня добавили."
20058-200580060 = "Что-то приятно, ха-ха."
20058-200580070 = "Извините за сегодня."
20058-200580080 = "Хотя вам это вряд ли интересно,"
20058-200580090 = "я, возможно, затаскала вас по магазинам..."
20058-200580100 = "Вовсе нет. Было весело!"
20058-200580110 = "Мы ведь искали то, что нравится тебе, Эрика."
20058-200580120 = "Вау"
20058-200580130 = "Неожиданно, что вы так говорите."
20058-200580140 = "Было весело! Спасибо."
20058-200580150 = "Я купила то, о чём говорила раньше!"
20058-200580160 = "О, здорово!"
20058-200580170 = "Хе-хе. Я так этого хотела,"
20058-200580180 = "что обошла все магазины в Д.У.!"
20058-200580190 = "До такого позднего времени?"
20058-200580200 = "Ага, так и есть. Увлеклась, и вот уже так поздно, ха-ха."
20058-200580210 = "Даже времени на ужин не было~"
20058-200580220 = "Я тоже!"
20058-200580230 = "О, Сенсей, где вы сейчас?"
20058-200580240 = "Если хотите, может, поужинаем вместе?"
20058-200580250 = "Сенсей, спасибо и за сегодня."
20058-200580260 = "Мало того, что вы меня угостили, так ещё и проводили..."
20058-200580270 = "Не слишком ли вы добры?"
20058-200580280 = "Время уже позднее."
20058-200580290 = "Ну, наверное, да."
20058-200580300 = "Спасибо."
20058-200580310 = "В следующий раз я угощаю!"
20058-200580320 = "В следующий раз дашь мне помидор?"
20058-200580330 = "Ты всё ещё про это, ха-ха?"
20058-200580340 = "Хм, как знать?"
20058-200580350 = "Горячо. Просто ужас, да?"
20058-200580360 = "Да, сегодня жара."
20058-200580370 = "Это точно, ха-ха."
20058-200580380 = "Когда выходишь на улицу,"
20058-200580390 = "не забывай пить воду~!"
20058-200580400 = "А, да, кстати."
20058-200580410 = "Когда моешь руки, не забывай менять пластырь."
20058-200580420 = "А то бактерии размножатся."
20058-200580430 = "Этот же милый."
20058-200580440 = "Плохо, заживает медленнее."
20058-200580450 = "Кстати, он тебе понравился?"
20058-200580460 = "Где его продают?"
20058-200580470 = "Не скажу."
20058-200580480 = "Смотри, не травмируйся снова?"
20058-200580490 = "У тебя есть свободное время?"
20058-200580500 = "Было бы здорово встретиться."
20058-200580510 = "Что-то случилось?"
20058-200580520 = "Ну..."
20058-200580530 = "Есть кое-что, о чём хочу посоветоваться."
20058-200580540 = "Хотела бы поговорить."
20058-200580550 = "Как насчёт сейчас?"
20058-200580560 = "Прямо сейчас!?"
20058-200580570 = "Может, спрошу у друзей?"
20058-200580580 = "Иногда нужно и время для себя."
20058-200580590 = "Хм, но как-то"
20058-200580600 = "не в моём характере."
20058-200580610 = "Так у тебя был придуманный образ, Эрика?"
20058-200580620 = "..."
20058-200580630 = "Что, правда!?"
20058-200580640 = "Злой человек."
20058-200580650 = "Сенсей, вы видели сегодня небо?"
20058-200580660 = "Нет, не видел, а что?"
20058-200580670 = "Я сейчас в метро,"
20058-200580680 = "оно очень красивое."
20058-200580690 = "Когда выйдете, посмотрите."
20058-200580700 = "Я уверена, вы будете впечатлены."
20058-200580710 = "Ладно, поверю."
20058-200580720 = "Да нет, ха-ха."
20058-200580730 = "Я не стану врать по таким мелочам!"
20058-200580740 = "Я сейчас еду в Гэхенну."
20058-200580750 = "Что!?"
20058-200580760 = "Сегодня был спокойный день."
20058-200580770 = "Да, верно."
20058-200580780 = "А вот я после того"
20058-200580790 = "что-то не могу успокоиться."
20058-200580800 = "Ну да ладно."
20058-200580810 = "Хорошо, что вы остались довольны."
20058-200580820 = "Небо с Эрикой было очень красивым."
20058-200580830 = "Давай ещё раз сходим вместе."
20058-200580840 = "Уф"
20058-200580850 = "Ааа"
20058-200580860 = "Ну вот опять"
20058-200580870 = "ты опять так..."
20058-200580880 = "..."
20058-200580890 = "Да"
20058-200580900 = "Давай ещё раз сходим вместе."