[translation]
20058-200580010 = "Opa, Sensei"
20058-200580020 = "É a Erika, né?"
20058-200580030 = "Olá!"
20058-200580040 = "Ah, que bom"
20058-200580050 = "Você já tinha salvado meu contato"
20058-200580060 = "Fiquei até feliz agora haha"
20058-200580070 = "Desculpa por hoje, viu?"
20058-200580080 = "Mesmo sabendo que você não tem tanto interesse nisso,"
20058-200580090 = "acabei te arrastando pra todo canto..."
20058-200580100 = "Que nada, foi superdivertido!"
20058-200580110 = "Foi uma busca pelas coisas que a Erika gosta"
20058-200580120 = "Uau"
20058-200580130 = "Não esperava que você fosse dizer uma coisa tão fofa assim"
20058-200580140 = "Eu me diverti muito! Valeu mesmo"
20058-200580150 = "Consegui comprar aquilo que eu tinha falado antes!"
20058-200580160 = "Opa, que maravilha!"
20058-200580170 = "Ehehe. Eu queria tanto aquilo"
20058-200580180 = "que rodei tooodas as lojas do D.U. procurando!"
20058-200580190 = "Até uma hora dessas?"
20058-200580200 = "Pois é! Fiquei tão empolgada procurando que nem vi a hora passar haha"
20058-200580210 = "Não tive tempo nem de jantar~"
20058-200580220 = "Nem eu!"
20058-200580230 = "Opa, onde você tá agora, Sensei?"
20058-200580240 = "Topa sair pra comer alguma coisa juntos?"
20058-200580250 = "Sensei, obrigada por hoje de novo"
20058-200580260 = "Além de pagar o jantar, ainda me acompanhou até em casa..."
20058-200580270 = "Você não é gentil até demais, não?"
20058-200580280 = "É que já estava bem tarde"
20058-200580290 = "Bom, isso é verdade"
20058-200580300 = "Valeu mesmo"
20058-200580310 = "Da próxima vez eu que pago!"
20058-200580320 = "E da próxima vez você me dá os seus tomates?"
20058-200580330 = "Ainda tá lembrando disso? hahaha"
20058-200580340 = "Hmm~ Vou pensar no seu caso!"
20058-200580350 = "Que caloooor. Tá surreal hoje, não tá?"
20058-200580360 = "Nossa, hoje tá pesado mesmo"
20058-200580370 = "Demais hahaha"
20058-200580380 = "Quando for sair na rua,"
20058-200580390 = "vê se bebe bastante água, viu~!"
20058-200580400 = "Ah, é mesmo"
20058-200580410 = "Quando lavar as mãos, lembra de trocar o curativo direitinho"
20058-200580420 = "Senão pode juntar bactéria"
20058-200580430 = "Mas esse curativo é tão fofinho..."
20058-200580440 = "Não pode, senão o machucado demora pra cicatrizar"
20058-200580450 = "Aliás, você gostou tanto assim dele?"
20058-200580460 = "Onde vende desse?"
20058-200580470 = "Não vou contaaar"
20058-200580480 = "E vê se não se machuca de novo, hein?"
20058-200580490 = "Tá com um tempinho livre?"
20058-200580500 = "Ia ser ótimo se a gente pudesse se ver"
20058-200580510 = "Aconteceu alguma coisa?"
20058-200580520 = "Hmm..."
20058-200580530 = "Queria pedir um conselho seu sobre uma coisa"
20058-200580540 = "Aí pensei se dava pra gente conversar"
20058-200580550 = "Que tal agora?"
20058-200580560 = "Agora?!"
20058-200580570 = "Será que eu devia falar pras minhas amigas também?"
20058-200580580 = "Que às vezes é bom ter um tempinho sozinha..."
20058-200580590 = "Hmm, mas sei lá,"
20058-200580600 = "acho que não combina muito com a minha personagem"
20058-200580610 = "Ué, você estava fazendo um personagem, Erika?"
20058-200580620 = "..."
20058-200580630 = "Não sabia disso?!"
20058-200580640 = "Seu malvado"
20058-200580650 = "Sensei, você viu o céu hoje?"
20058-200580660 = "Ainda não consegui ver, por quê?"
20058-200580670 = "Tô no metrô agora,"
20058-200580680 = "e lá fora tá lindo demais"
20058-200580690 = "Quando sair, dá uma olhada pro alto"
20058-200580700 = "Certeza que você vai se emocionar"
20058-200580710 = "Vou confiar em você, hein?"
20058-200580720 = "Qual é haha"
20058-200580730 = "Eu não ia mentir com uma coisa dessas!"
20058-200580740 = "Tô indo pra Gehenna neste exato momento"
20058-200580750 = "Hã?!"
20058-200580760 = "Hoje foi um dia bem tranquilo, né?"
20058-200580770 = "Foi sim"
20058-200580780 = "Quer dizer, depois daquilo,"
20058-200580790 = "meu coração ficou meio acelerado, sabe?"
20058-200580800 = "Mas deixa pra lá"
20058-200580810 = "Se você gostou, Sensei, pra mim já valeu a pena"
20058-200580820 = "O céu que eu vi com você estava lindo demais, Erika"
20058-200580830 = "Vamos juntos de novo qualquer dia"
20058-200580840 = "Uuu..."
20058-200580850 = "Aaaah"
20058-200580860 = "Sério mesmo..."
20058-200580870 = "Lá vem você falando essas coisas do nadaaa..."
20058-200580880 = "..."
20058-200580890 = "Sim"
20058-200580900 = "Vamos juntos de novo"
