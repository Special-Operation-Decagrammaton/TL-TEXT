[translation]
20058-200580010 = "Йо, Сенсей."
20058-200580020 = "Это Эрика?"
20058-200580030 = "Привет, Эрика!"
20058-200580040 = "А."
20058-200580050 = "Вы сохранили мой номер"
20058-200580060 = "Спасибо лол"
20058-200580070 = "Насчёт сегодняшних покупок..."
20058-200580080 = "Надеюсь, я не слишком долго таскала вас за собой..."
20058-200580090 = "Особенно если вам всё это было не особо интересно"
20058-200580100 = "Мне тоже было очень весело!"
20058-200580110 = "Мне понравилось узнавать больше о твоих вкусах!"
20058-200580120 = "Ого."
20058-200580130 = "Спасибо, что сказали."
20058-200580140 = "Ну, мне тоже было весело."
20058-200580150 = "И я купила ту вещь, о которой рассказывала."
20058-200580160 = "Поздравляю!"
20058-200580170 = "Я буквально объездила весь"
20058-200580180 = "D.U., чтобы её достать."
20058-200580190 = "Прямо до сих пор?"
20058-200580200 = "Ага. Я даже не заметила, сколько времени прошло."
20058-200580210 = "Даже ужин пропустила лолол"
20058-200580220 = "Я тоже ещё не ел!"
20058-200580230 = "О? Где вы сейчас, Сенсей?"
20058-200580240 = "Хотите перекусить вместе?"
20058-200580250 = "Сегодня было круто, Сенсей."
20058-200580260 = "Вы и угостили меня, И проводили домой."
20058-200580270 = "Даже слишком по-рыцарски."
20058-200580280 = "Так поздно ночью ходить одной опасно."
20058-200580290 = "Э. Справедливо."
20058-200580300 = "Ну, спасибо."
20058-200580310 = "В следующий раз плачу я, ладно?"
20058-200580320 = "Ты собираешься угостить меня помидорами?"
20058-200580330 = "А лол"
20058-200580340 = "Узнаете, когда придёт время!"
20058-200580350 = "Сегодня так жарко."
20058-200580360 = "Серьёзно."
20058-200580370 = "лол"
20058-200580380 = "Будьте осторожны, если сегодня выйдете!"
20058-200580390 = "И обязательно пейте достаточно воды!"
20058-200580400 = "А, и на всякий случай:"
20058-200580410 = "если будете мыть руки, обязательно замените его."
20058-200580420 = "Пластырь"
20058-200580430 = "Но он такой милый!!"
20058-200580440 = "Ага, но нельзя, чтобы под ним скапливалась влага."
20058-200580450 = "Так вам нравятся такие штуки, да?"
20058-200580460 = "Где мне взять такой же??"
20058-200580470 = "М-м-м... Не скажу."
20058-200580480 = "Так что не пораньтесь!!"
20058-200580490 = "Сенсей..."
20058-200580500 = "Когда вы в следующий раз свободны?"
20058-200580510 = "А что? Тебе что-то нужно?"
20058-200580520 = "Эм"
20058-200580530 = "Ну, вообще-то..."
20058-200580540 = "Я давно хотела попросить у вас совета кое о чём."
20058-200580550 = "Тогда я свободен прямо сейчас."
20058-200580560 = "Прямо сейчас?!"
20058-200580570 = "Может, и друзьям сказать?"
20058-200580580 = "Что мне просто иногда нужно немного времени «для себя»?"
20058-200580590 = "Просто мне почему-то кажется,"
20058-200580600 = "что они воспринимают меня не так. Как человека."
20058-200580610 = "Эрика, ты работаешь над улучшением своего публичного образа?"
20058-200580620 = "..."
20058-200580630 = "Это значит «да», Эрика?"
20058-200580640 = "Вы такой злой."
20058-200580650 = "Сенсей, вы сегодня видели небо?"
20058-200580660 = "Нет, а что?"
20058-200580670 = "Я сейчас в метро."
20058-200580680 = "Оно о-о-очень красивое."
20058-200580690 = "Потом обязательно посмотрите!"
20058-200580700 = "Уверена, вам понравится."
20058-200580710 = "Может, просто поверю тебе на слово..."
20058-200580720 = "лол"
20058-200580730 = "Я вообще-то НЕ ВРУ про НЕБО, ясно?!"
20058-200580740 = "На самом деле я сейчас еду в Геенну."
20058-200580750 = "О??"
20058-200580760 = "Сегодня было так спокойно и приятно, правда?"
20058-200580770 = "И правда."
20058-200580780 = "Хотя я уже не знаю,"
20058-200580790 = "можно ли теперь назвать это спокойствием..."
20058-200580800 = "В любом случае"
20058-200580810 = "Если у вас всё хорошо, то и у меня всё хорошо, Сенсей."
20058-200580820 = "Мне очень понравилось небо Эрики."
20058-200580830 = "Давай как-нибудь сходим снова."
20058-200580840 = "А"
20058-200580850 = "А."
20058-200580860 = "Серьёзно"
20058-200580870 = "Вот так вот..."
20058-200580880 = "..."
20058-200580890 = "Ага"
20058-200580900 = "В следующий раз тоже пойдём вместе."
