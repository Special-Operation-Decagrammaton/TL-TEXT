[translation]
10019-100190010 = "Não podemos descartar a possibilidade de que esta transmissão também esteja sendo monitorada."
10019-100190020 = "Portanto, irei direto ao assunto:"
10019-100190030 = "Amanhã às 18h00, nestas coordenadas MGRS:"
10019-100190040 = "TN 58XX.XXXX, 17XX.XX"
10019-100190050 = "Contudo, compareça sozinho."
10019-100190060 = "Uma vez memorizado, responda apenas com \"Sim\"."
10019-100190070 = "...Azusa?"
10019-100190080 = "Idiota!"
10019-100190090 = "O uso de códigos é o básico de qualquer comunicação!"
10019-100190100 = "Se escrever o meu nome, minha identidade será descoberta!"
10019-100190110 = "Mas precisa mesmo usar código num aplicativo de mensagens onde já aparece a sua foto...?"
10019-100190120 = "É claro que precisa!! Segurança rigorosa é o básico!"
10019-100190130 = "E a resposta?"
10019-100190140 = "Sim..."
10019-100190150 = "Francamente, você dá trabalho."
10019-100190160 = "Pois bem."
10019-100190170 = "Darei os detalhes amanhã,"
10019-100190180 = "no local combinado."
10019-100190190 = "Câmbio e desligo."
10019-100190200 = "Aqui é Pinguim."
10019-100190210 = "Pato, responda."
10019-100190220 = "Aqui é Pato."
10019-100190230 = "Estava aguardando seu contato, Pinguim."
10019-100190240 = "Muito bem."
10019-100190250 = "A missão transmitida hoje é ultrassecreta. Tome extremo cuidado para manter o sigilo."
10019-100190260 = "Da parte de Pinguim, é tudo."
10019-100190270 = "Câmbio e desligo."
10019-100190280 = "Aqui é Esquilo."
10019-100190290 = "Esquilo-Voador, responda."
10019-100190300 = "Estou a caminho do ninho do Esquilo-Voador neste momento."
10019-100190310 = "Esquilo-Voador, você se encontra no ninho agora?"
10019-100190320 = "Ué, você não era o Pinguim, Azusa...?"
10019-100190330 = "E eu tenho quase certeza de que era o Pato..."
10019-100190340 = "Sense—"
10019-100190350 = "Digo, Esquilo-Voador."
10019-100190360 = "Certos tipos de codinomes mudam diariamente."
10019-100190370 = "É uma questão de segurança operacional."
10019-100190380 = "Confirmei que você está na sua mesa. Chegarei em 15 minutos."
10019-100190390 = "Informarei o assunto pessoalmente ao chegar."
10019-100190400 = "Da parte de Pinguim, é tudo."
10019-100190410 = "......"
10019-100190420 = "Retificando:"
10019-100190430 = "Da parte de Esquilo, é tudo. Câmbio e desligo."
10019-100190440 = "Como você estava dormindo tão profundamente, retirei-me em silêncio."
10019-100190450 = "A segurança é importante, mas você deveria cuidar um pouco melhor da própria saúde também."
10019-100190460 = "Uma vez memorizado, responda apenas com \"Sim\"."
10019-100190470 = "Sim."
10019-100190480 = "Muito bem. Até breve."
10019-100190490 = "Da parte de Esquilo, é tudo. Câmbio e desligo."
10019-100190500 = "De Corgi para Retriever."
10019-100190510 = "Hoje é o Dia D."
10019-100190520 = "Imagino que não tenha se esquecido, certo?"
10019-100190530 = "Se estiver lembrado, responda apenas com \"Sim\"."
10019-100190540 = "Dia D? Do que você tá falando...?"
10019-100190550 = "Sim."
10019-100190560 = "......"
10019-100190570 = "Eu já havia avisado outro dia."
10019-100190580 = "Muito bem, vamos começar imediatamente."
10019-100190590 = "Trata-se do treinamento de adaptação à vida cotidiana daqui."
10019-100190600 = "Corgi já está pronta; espero que Retriever também esteja."
10019-100190610 = "Retriever,"
10019-100190620 = "aqui é Corgi."
10019-100190630 = "O que houve?"
10019-100190640 = "Aconteceu alguma coisa?"
10019-100190650 = "Não."
10019-100190660 = "É que..."
10019-100190670 = "Só quis testar te chamar mesmo."
10019-100190680 = "10.0 10.1 9.7 9.3. 10.2 10.1"
10019-100190690 = "8.9 10.4 10.3 10.0 10.2 10.7"
10019-100190700 = "Azusa, o que são esses números...?"
10019-100190710 = "...Azusa?"
10019-100190720 = "?"
10019-100190730 = "Ah."
10019-100190740 = "Enviei por engano, por favor desconsidere."
10019-100190750 = "Era uma anotação que eu deveria ter enviado para mim mesma, mas acabei mandando para Pombo por engano."
10019-100190760 = "E outra coisa: você escreveu o meu nome."
10019-100190770 = "Ah, foi mal."
10019-100190780 = "Por enquanto, que tal te chamar de Pardal?"
10019-100190790 = "Pardal..."
10019-100190800 = "Sim."
10019-100190810 = "Não é ruim. Vamos usar esse."
10019-100190820 = "...Ficou curioso sobre aqueles números?"
10019-100190830 = "Nesse caso..."
