[translation]
10110-101100010 = "Sensei."
10110-101100020 = "Pode ser quando tiver um momento livre,"
10110-101100030 = "mas você poderia vir até a Trinity?"
10110-101100040 = "Claro que posso, mas... o que houve?"
10110-101100050 = "Aconteceu alguma coisa?"
10110-101100060 = "...Perdoe-me, mas"
10110-101100070 = "não é um assunto apropriado para se tratar pelo MomoTalk."
10110-101100080 = "Se possível, peço que mantenha sigilo."
10110-101100090 = "Estarei esperando."
10110-101100100 = "Imagino que já tenha chegado em segurança."
10110-101100110 = "Chamei você até aqui e sequer pude oferecer uma recepção adequada."
10110-101100120 = "Peço desculpas."
10110-101100130 = "Não se preocupe com isso."
10110-101100140 = "Graças a você, eu também consegui dormir profundamente depois de muito tempo."
10110-101100150 = "Entendo."
10110-101100160 = "Até a próxima, então."
10110-101100170 = "Da próxima vez, prepararei um pretexto diferente."
10110-101100180 = "Sensei, poderia me emprestar a sua ajuda?"
10110-101100190 = "Gostaria que viesse me fazer uma visita de enfermo..."
10110-101100200 = "Era só ter me dito direto que não estava se sentindo bem."
10110-101100210 = "Por acaso tem a ver com \"aquele assunto\"...?"
10110-101100220 = "Não acertou em cheio, mas tampouco passou longe..."
10110-101100230 = "É que hesito um pouco em expor abertamente o que me vai no peito..."
10110-101100240 = "Não tive a intenção de mentir."
10110-101100250 = "Mas, se eu usasse palavras diretas demais, você se preocuparia além do necessário."
10110-101100260 = "A ponto de ser capaz de vir correndo para cá no mesmo instante."
10110-101100270 = "Não que me desagrade ser alvo de tamanha preocupação, contudo..."
10110-101100280 = "De todo modo, agora que você descobriu, não há o que fazer."
10110-101100290 = "Sensei,"
10110-101100300 = "quando tiver um tempo livre, você viria me ver?"
10110-101100310 = "Os doces foram do seu agrado?"
10110-101100320 = "Espero que tenham agradado ao seu paladar."
10110-101100330 = "Estavam simplesmente divinos!"
10110-101100340 = "O ápice da confeitaria da Trinity não tem esse nome à toa!"
10110-101100350 = "Eu provei os seus depois que você foi embora,"
10110-101100360 = "e os doces que você trouxe também eram indiscutivelmente maravilhosos, Sensei."
10110-101100370 = "Não há motivo para duvidar."
10110-101100380 = "Afinal, ninguém menos que eu está garantindo isso."
10110-101100390 = "A nossa percepção do tempo costuma ser deveras relativa, mas..."
10110-101100400 = "Veja só, já é fim de tarde."
10110-101100410 = "O dia foi corrido?"
10110-101100420 = "Teve muito trabalho pesado hoje?"
10110-101100430 = "Não, hoje passei o dia lendo."
10110-101100440 = "Se fosse trabalho, certamente o dia teria parecido muito mais longo."
10110-101100450 = "Quando me perco na leitura..."
10110-101100460 = "Sinto que mesmo se o dia tivesse 48 horas ainda não seria o bastante."
10110-101100470 = "Obrigada pela ajuda hoje novamente."
10110-101100480 = "Sinto que as minhas leituras daqui para frente serão ainda mais prazerosas."
10110-101100490 = "Eu também me diverti."
10110-101100500 = "Pode me chamar sempre que quiser."
10110-101100510 = "Obrigada."
10110-101100520 = "Em breve, certamente o farei."
10110-101100530 = "Sensei."
10110-101100540 = "Soube que você virá à Tea Party em breve."
10110-101100550 = "Sim, tenho uma reunião marcada."
10110-101100560 = "Vou dar uma passada aí a trabalho."
10110-101100570 = "Compreendo."
10110-101100580 = "Fico ciente."
10110-101100590 = "À noite, acabo ficando sentimental sem perceber."
10110-101100600 = "Sinto que me deixei levar pelo clima e passei um pouco dos limites, mas..."
10110-101100610 = "Será que consegui corresponder às suas expectativas?"
10110-101100620 = "Fiquei muito feliz por você ter deixado eu ouvir."
10110-101100630 = "Foi tão lindo que dá vontade de ouvir de novo e de novo."
10110-101100640 = "Lá vem você dizendo essas coisas outra vez."
10110-101100650 = "Espero que algum dia..."
10110-101100660 = "eu possa cantar uma canção ainda mais livre"
10110-101100670 = "para você ouvir quantas vezes desejar."
