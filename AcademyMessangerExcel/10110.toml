[translation]
10110-101100010 = "Эй, Сенсей"
10110-101100020 = "Если вы не против, не могли бы вы скоро приехать в Тринити?"
10110-101100030 = "Когда будете не заняты... Пожалуйста."
10110-101100040 = "Конечно могу... но что случилось?"
10110-101100050 = "Сейя? Что-то произошло?"
10110-101100060 = "...Простите меня."
10110-101100070 = "Сейчас я не могу вам сказать."
10110-101100080 = "И, пожалуйста, сохраните это в тайне от остальных."
10110-101100090 = "Тогда я буду ждать вас."
10110-101100100 = "Когда я проснулась, увидела, что вы уже ушли."
10110-101100110 = "Я не смогла встретить вас, когда вы пришли,"
10110-101100120 = "а потом спала, когда вы уходили. Простите."
10110-101100130 = "Зато я наконец нормально выспалась."
10110-101100140 = "Кровать очень удобная."
10110-101100150 = "Понятно."
10110-101100160 = "Поэтому в следующий раз я найду другую отговорку,"
10110-101100170 = "чтобы увидеться с вами, Сенсей."
10110-101100180 = "Сенсей, у вас позже будет минутка?"
10110-101100190 = "Думаю, мне понадобятся ваши медицинские навыки."
10110-101100200 = "Дай угадаю, ты «заболела»?"
10110-101100210 = "На этот раз такая отговорка?"
10110-101100220 = "Ну, да."
10110-101100230 = "Пожалуй, я не могу по-настоящему сказать, что больна."
10110-101100240 = "Я не умею лгать, к тому же"
10110-101100250 = "вы будете слишком сильно волноваться, если я так скажу."
10110-101100260 = "Я хочу, чтобы вы волновались СОВСЕМ НЕМНОГО и чуть-чуть сомневались."
10110-101100270 = "Примерно на таком уровне."
10110-101100280 = "Но вы слишком быстро меня раскусили. Ну что ж."
10110-101100290 = "Сенсей."
10110-101100300 = "Загляните ко мне, когда освободитесь."
10110-101100310 = "Тебе понравились десерты?"
10110-101100320 = "Их приготовили лучшие кондитеры из лучших ингредиентов."
10110-101100330 = "Они были лучшими. А мои — не очень."
10110-101100340 = "Те, что я принесла, эм..."
10110-101100350 = "О, пожалуйста, не говори так."
10110-101100360 = "Те, что ты купила, тоже были лучшими, без сомнения."
10110-101100370 = "Понятно."
10110-101100380 = "По крайней мере, именно это сейчас говорит мой язык."
10110-101100390 = "Уже вечер"
10110-101100400 = "Сегодня время пролетело незаметно."
10110-101100410 = "У тебя было много работы?"
10110-101100420 = "День был занятой?"
10110-101100430 = "Нет, ничего такого."
10110-101100440 = "На самом деле время пролетело быстрее, чем когда я работала."
10110-101100450 = "Когда я читаю книги..."
10110-101100460 = "дни проходят в два-три раза быстрее."
10110-101100470 = "Огромное спасибо за сегодня, Сенсей."
10110-101100480 = "Книга мне и так нравилась, поэтому я была вдвойне счастлива."
10110-101100490 = "Мне тоже понравилось."
10110-101100500 = "Сообщай, если я понадоблюсь."
10110-101100510 = "Понятно."
10110-101100520 = "Обязательно."
10110-101100530 = "Эй, Сенсей"
10110-101100540 = "Я слышала, вы скоро посетите Чайную партию."
10110-101100550 = "Да. Нужно кое-что обсудить."
10110-101100560 = "По работе, но да."
10110-101100570 = "Понятно."
10110-101100580 = "Поняла."
10110-101100590 = "Поздно ночью люди становятся сентиментальнее."
10110-101100600 = "Думаю, я немного увлеклась и зашла слишком далеко."
10110-101100610 = "Если я перешла границу, хочу извиниться."
10110-101100620 = "Вовсе нет. Всё было прекрасно."
10110-101100630 = "Я бы с удовольствием послушал ещё, если бы представился шанс."
10110-101100640 = "Вы опять за своё."
10110-101100650 = "Но"
10110-101100660 = "Понятно."
10110-101100670 = "я чувствую то же самое. Когда вы рядом, мне хочется чаще быть такой."
