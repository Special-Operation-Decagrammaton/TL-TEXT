[translation]
10110-101100010 = "Сенсей."
10110-101100020 = "Когда у вас будет время,"
10110-101100030 = "не могли бы вы зайти в Тринити?"
10110-101100040 = "Конечно, я могу, но... что случилось?"
10110-101100050 = "Что-то произошло?"
10110-101100060 = "... Прошу прощения,"
10110-101100070 = "но это не та тема, которую можно обсуждать в Момотолке."
10110-101100080 = "Если можно, я бы хотел поговорить конфиденциально."
10110-101100090 = "Я жду вас."
10110-101100100 = "Наверное, вы уже благополучно вернулись."
10110-101100110 = "Я вызвал вас, а сам даже не смог как следует принять,"
10110-101100120 = "прошу прощения."
10110-101100130 = "Не беспокойтесь."
10110-101100140 = "Благодаря вам я впервые за долгое время хорошо выспался."
10110-101100150 = "Вот как."
10110-101100160 = "Тогда до встречи."
10110-101100170 = "В следующий раз придумаю другой предлог."
10110-101100180 = "Сенсей, не могли бы вы мне помочь?"
10110-101100190 = "Я хотел бы, чтобы вы пришли меня навестить..."
10110-101100200 = "Могли бы просто сказать, что плохо себя чувствуете."
10110-101100210 = "Может быть, это опять «то самое дело»...?"
10110-101100220 = "Не в точку, но близко..."
10110-101100230 = "Мне не хотелось раскрывать все свои мысли..."
10110-101100240 = "Я не собирался врать."
10110-101100250 = "Если бы я выбрал более прямые слова, вы бы беспокоились больше, чем нужно."
10110-101100260 = "И даже могли бы сразу примчаться."
10110-101100270 = "Мне не противно, что вы так переживаете, но..."
10110-101100280 = "В любом случае, раз меня раскрыли, ничего не поделаешь."
10110-101100290 = "Сенсей,"
10110-101100300 = "зайдите, когда будет свободное время, хорошо?"
10110-101100310 = "Вам понравились угощения?"
10110-101100320 = "Надеюсь, пришлись по вкусу."
10110-101100330 = "Они были просто великолепны!"
10110-101100340 = "Не зря Тринити считается лучшей!"
10110-101100350 = "Те, что я попробовал потом,"
10110-101100360 = "ваши угощения, тоже были безупречны."
10110-101100370 = "Можете не волноваться,"
10110-101100380 = "я ручаюсь за это."
10110-101100390 = "Обычно время течёт по-разному, но..."
10110-101100400 = "уже вечер."
10110-101100410 = "Вы были заняты?"
10110-101100420 = "Работы было много, тяжело?"
10110-101100430 = "Нет, сегодня я читал книгу."
10110-101100440 = "Если бы я работал, время тянулось бы дольше."
10110-101100450 = "Когда увлекаешься чтением..."
10110-101100460 = "даже 48 часов в сутках кажутся недостаточными."
10110-101100470 = "Сегодня я тоже многим вам обязан."
10110-101100480 = "Теперь чтение будет ещё приятнее."
10110-101100490 = "Мне тоже было приятно."
10110-101100500 = "Зовите меня в любое время."
10110-101100510 = "Спасибо."
10110-101100520 = "Обязательно, в ближайшее время."
10110-101100530 = "Сенсей,"
10110-101100540 = "говорят, вы скоро придёте на чаепитие."
10110-101100550 = "У меня там встреча."
10110-101100560 = "Я зайду по работе."
10110-101100570 = "Понятно."
10110-101100580 = "Хорошо."
10110-101100590 = "Ночью почему-то становится сентиментально."
10110-101100600 = "Кажется, я поддался атмосфере и перестарался, но..."
10110-101100610 = "Оправдал ли я ваши ожидания?"
10110-101100620 = "Мне было приятно, что вы поделились."
10110-101100630 = "Я готов слушать это снова и снова."
10110-101100640 = "Опять вы за своё."
10110-101100650 = "Наверное, когда-нибудь..."
10110-101100660 = "Я надеюсь, что смогу спеть для вас более свободную песню."
10110-101100670 = "Сколько угодно раз."