[translation]
16018-160180010 = "Прошу прощения за внезапное сообщение."
16018-160180020 = "Это правильный контакт Сенсея из Шале?"
16018-160180030 = "Да, это так..."
16018-160180040 = "Рабу?"
16018-160180050 = "О, правильно. Хорошо."
16018-160180060 = "Вежливая Рабу — это что-то новенькое."
16018-160180070 = "Надо скриншот сделать!"
16018-160180080 = "Что?"
16018-160180090 = "Меня считают такой грубой?"
16018-160180100 = "У меня есть элементарные манеры."
16018-160180110 = "Ну ладно."
16018-160180120 = "Когда я проходила мимо Шале,"
16018-160180130 = "вспомнила, что мы обменивались Момотолками."
16018-160180140 = "Но вы, наверное, заняты и можете быть не в Шале."
16018-160180150 = "Ну, пока."
16018-160180160 = "Постойте... это ведь не вы, Сенсей?"
16018-160180170 = "По..."
16018-160180180 = "Я впервые была в Шале, странное ощущение."
16018-160180190 = "Мне показали кое-что интересное."
16018-160180200 = "Рад, что тебе понравилось."
16018-160180210 = "...Не думала, что мы сблизимся."
16018-160180220 = "..."
16018-160180230 = "Сблизились — это слишком громко."
16018-160180240 = "В любом случае, было весело."
16018-160180250 = "Я бы хотел, чтобы ты приходила каждый день."
16018-160180260 = "Всегда рады!"
16018-160180270 = "Ты такой льстец."
16018-160180280 = "..."
16018-160180290 = "Ты сказал это?"
16018-160180300 = "Сенсей, вы сейчас свободны?"
16018-160180310 = "А, если заняты, не обращайте внимания."
16018-160180320 = "Привет, Рабу."
16018-160180330 = "Что случилось?"
16018-160180340 = "Ты сегодня какая-то спокойная."
16018-160180350 = "Я видела вас недавно,"
16018-160180360 = "Вы выглядели уставшим. Высыпайтесь."
16018-160180370 = "Эти шаги... ты опять прибежала!?"
16018-160180380 = "Сенсей,"
16018-160180390 = "вы всегда говорите такие вещи?"
16018-160180400 = "Без шуток?"
16018-160180410 = "Конечно!"
16018-160180420 = "Я всегда так думаю!"
16018-160180430 = "Вздох, ну всё."
16018-160180440 = "Но не говори так при моих ребятах, ладно?"
16018-160180450 = "Конечно."
16018-160180460 = "И при других тоже. Если скажешь,"
16018-160180470 = "А, это значит"
16018-160180480 = "не в том смысле, что не говори так другим!"
16018-160180490 = "Да чтоб тебя! Ничего!"
16018-160180500 = "Сенсей, это я."
16018-160180510 = "Неважно, где ты сейчас, главное, что не бежишь, да?"
16018-160180520 = "Я уже добежал до холла..."
16018-160180530 = "Может, вы глуповаты?"
16018-160180540 = "Ладно. На днях нашла кое-что хорошее на чёрном рынке."
16018-160180550 = "А, не опасное, полезное."
16018-160180560 = "Может, пригодится вам."
16018-160180570 = "?"
16018-160180580 = "Опять бежишь?"
16018-160180590 = "Эй,"
16018-160180600 = "Сенсей?"
16018-160180610 = "Сенсей."
16018-160180620 = "Тот автомат странный."
16018-160180630 = "Я выбрала яблочный сок,"
16018-160180640 = "а на вкус как ананасовый."
16018-160180650 = "Может, испортился? У вас всё нормально?"
16018-160180660 = "Живот не болит?"
16018-160180670 = "А мой ананасовый сок пахнет яблоком."
16018-160180680 = "Правда? Странно..."
16018-160180690 = "Эй, постой!?"
16018-160180700 = "Сенсей, вы сейчас свободны?"
16018-160180710 = "Даже если заняты — идите сюда!"
16018-160180720 = "Что, что-то случилось?"
16018-160180730 = "Нет, просто приглашаю на прогулку."
16018-160180740 = "Проходила мимо, решила проверить, чем вы заняты."
16018-160180750 = "А, может, вы заняты?"
16018-160180760 = "Тогда ничего страшного... то, что я сказала — шутка."
16018-160180770 = "Я как раз освободился."
16018-160180780 = "Съел все сегодняшние бумаги."
16018-160180790 = "Ты правда взрослый!?"
16018-160180800 = "То есть ты можешь прийти?"
16018-160180810 = "Жду внизу."
16018-160180820 = "Иди пешком, не беги!?"
16018-160180830 = "Ах... опоздала."
16018-160180840 = "Я проверила!"
16018-160180850 = "То был не коллектор, а ливневая канализация!"
16018-160180860 = "Просто дождевая вода!!"
16018-160180870 = "Это не грязная вода!!"
16018-160180880 = "Нет, я ничего..."
16018-160180890 = "Я же сделала хорошее дело, а ты!"
16018-160180900 = "Добрая Рабу — это действительно круто!"
16018-160180910 = "Если хочешь, я тоже могу поплескаться в канализации!"
16018-160180920 = "Не используй священное слово «плескаться» в таком контексте!!"
16018-160180930 = "И это не канализация, я же сказала!"
16018-160180940 = "Я рада, что ты хвалишь, но!"
16018-160180950 = "..."
16018-160180960 = "И ещё, что ты сегодня видел, не рассказывай моим ребятам, хорошо?"
16018-160180970 = "Понял!?"