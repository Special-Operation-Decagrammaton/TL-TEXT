[translation]
16018-160180010 = "Прошу прощения."
16018-160180020 = "Это Сенсей из Шале?"
16018-160180030 = "Да, это я..."
16018-160180040 = "Это Рабу?"
16018-160180050 = "О, всё-таки номер правильный. Я просто хотела убедиться."
16018-160180060 = "Вежливая Рабу... Это что-то новенькое!"
16018-160180070 = "Я сделаю скриншот!"
16018-160180080 = "А??"
16018-160180090 = "Я правда кажусь настолько грубой?!"
16018-160180100 = "Я знаю элементарные правила приличия!"
16018-160180110 = "В общем..."
16018-160180120 = "Я просто проходила мимо Шале и вспомнила, что сохранила ваш контакт."
16018-160180130 = "Вот и решила поздороваться."
16018-160180140 = "Наверное, вас там даже нет, но я всё равно захотела написать."
16018-160180150 = "Увидимся потом"
16018-160180160 = "Эм, Сенсей? Это вы сейчас выбегаете из двери и несётесь ко мне?"
16018-160180170 = "Погоди, сто"
16018-160180180 = "Я впервые побывала внутри Шале. Было круто."
16018-160180190 = "Мне понравилось."
16018-160180200 = "Я так рад!"
16018-160180210 = "Странно, я совсем не ожидала, что мы с вами сблизимся, Сенсей."
16018-160180220 = "..."
16018-160180230 = "Э, «сблизимся» — это, может, слишком громко сказано."
16018-160180240 = "В любом случае, сегодня было весело."
16018-160180250 = "Надеюсь, ты будешь заходить каждый день, Рабу!"
16018-160180260 = "Заходи когда захочешь!"
16018-160180270 = "Говорите так, будто это просто."
16018-160180280 = "Ну..."
16018-160180290 = "Вы ведь серьёзно, да?"
16018-160180300 = "Сенсей, у вас есть секундочка?"
16018-160180310 = "А, не беспокойтесь, если заняты."
16018-160180320 = "Привет, Рабу."
16018-160180330 = "Что происходит?"
16018-160180340 = "Сегодня ты гораздо спокойнее."
16018-160180350 = "Ничего. Просто увидела вас, пока была снаружи"
16018-160180360 = "Вы выглядели уставшим, вы вообще достаточно"
16018-160180370 = "Вы опять бежите ко мне?!?!"
16018-160180380 = "Сенсей."
16018-160180390 = "Вы всегда такой?"
16018-160180400 = "Вы ведь не шутите?"
16018-160180410 = "Я не шучу!"
16018-160180420 = "Я такой и есть!"
16018-160180430 = "Забудьте."
16018-160180440 = "Только не говорите такое перед моей бандой, ладно?!"
16018-160180450 = "А."
16018-160180460 = "И вообще ни перед кем больше!"
16018-160180470 = "То есть, я хочу сказать..."
16018-160180480 = "Больше никогда так не говорите!"
16018-160180490 = "Забудьте!!"
16018-160180500 = "Сенсей. Это Рабу."
16018-160180510 = "Вы ведь снова не выскочите внезапно откуда-нибудь на полной скорости?"
16018-160180520 = "Уже иду."
16018-160180530 = "Вы правда идиот?"
16018-160180540 = "В общем, я раздобыла кое-что хорошее на Чёрном рынке."
16018-160180550 = "Ничего опасного. Это очень полезная вещь."
16018-160180560 = "И я подумала, что вам может понравиться."
16018-160180570 = "?"
16018-160180580 = "Вы опять бежите?"
16018-160180590 = "Нет же, да?"
16018-160180600 = "Сенсей???"
16018-160180610 = "Сенсей."
16018-160180620 = "Этот торговый автомат странный."
16018-160180630 = "Я уверена, что взяла яблочный сок,"
16018-160180640 = "но на вкус он был как ананасовый..."
16018-160180650 = "Может, просроченный? А у вас как, Сенсей?"
16018-160180660 = "Вы ведь не отравились?"
16018-160180670 = "Хм, а мой ананасовый сок был со вкусом яблок."
16018-160180680 = "Вот как? Странно."
16018-160180690 = "А."
16018-160180700 = "Сенсей, вы сейчас свободны?"
16018-160180710 = "Даже если нет, всё равно выходите!"
16018-160180720 = "А? Зачем?"
16018-160180730 = "Нужна причина? Просто пойдём прогуляемся."
16018-160180740 = "Я сейчас неподалёку."
16018-160180750 = "А, вы заняты?"
16018-160180760 = "Я раньше шутила. Если заняты, не обязательно."
16018-160180770 = "Вся моя работа только что исчезла."
16018-160180780 = "Я съел все сегодняшние бумаги."
16018-160180790 = "Вы точно взрослый, Сенсей?!"
16018-160180800 = "Но значит ли это, что теперь вы можете выйти?"
16018-160180810 = "Эм... Тогда я подожду внизу!"
16018-160180820 = "И не бегите!! Идите пешком!!"
16018-160180830 = "И вы опять бежите."
16018-160180840 = "Я только что поискала!"
16018-160180850 = "Это ливневый сток, а не канализация!"
16018-160180860 = "Дождевая вода! Это была дождевая вода!!"
16018-160180870 = "Не грязная вода!!!"
16018-160180880 = "Я правда ничего не говорил..."
16018-160180890 = "Уф! Ну и разочарование!"
16018-160180900 = "По-моему, ты выглядела очень круто, Рабу!"
16018-160180910 = "Если тебя это так беспокоит, я тоже плеснусь прямо в канализацию!"
16018-160180920 = "Не используйте слово «плеснусь» в таком контексте!!"
16018-160180930 = "И вообще, это была не канализация!"
16018-160180940 = "Спасибо, что сказали, что это было круто, но всё же!"
16018-160180950 = "..."
16018-160180960 = "И НИКОМУ не рассказывайте о сегодняшнем!"
16018-160180970 = "Хорошо?!"
