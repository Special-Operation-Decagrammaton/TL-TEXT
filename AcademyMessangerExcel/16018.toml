[translation]
16018-160180010 = "Desculpe entrar em contato assim de repente"
16018-160180020 = "Poderia me confirmar se este é mesmo o contato do Sensei da Schale?"
16018-160180030 = "É sim, mas......"
16018-160180040 = "Rabu?"
16018-160180050 = "Ah, então tá certo mesmo. Que bom"
16018-160180060 = "Ver a Rabu falando toda educada assim é novidade"
16018-160180070 = "Tenho que tirar um print disso!"
16018-160180080 = "Hã?"
16018-160180090 = "Por acaso você achava que eu era uma mal-educada?"
16018-160180100 = "Eu tenho pelo menos o mínimo de boas maneiras, tá?"
16018-160180110 = "Bom, deixa pra lá"
16018-160180120 = "Quando passei na frente da Schale agora há pouco,"
16018-160180130 = "Lembrei que a gente tinha trocado contato no MomoTalk"
16018-160180140 = "Sei que você deve estar ocupado e talvez nem esteja na Schale agora, mas"
16018-160180150 = "Enfim, até mais"
16018-160180160 = "Espera aí...... aquele ali não é você não, né, Sensei?"
16018-160180170 = "Ei, pera"
16018-160180180 = "Foi a primeira vez que entrei na Schale, que sensação diferente"
16018-160180190 = "Você me mostrou coisas bem legais"
16018-160180200 = "Fico muito feliz que tenha gostado"
16018-160180210 = "......Quem diria que a gente acabaria fazendo amizade, hein"
16018-160180220 = "......"
16018-160180230 = "Tá, dizer que \"fizemos amizade\" talvez seja exagero"
16018-160180240 = "De qualquer forma, foi divertido"
16018-160180250 = "Por mim você viria aqui passear todo dia"
16018-160180260 = "A porta está sempre aberta!"
16018-160180270 = "Você fala cada coisa da boca pra fora, viu"
16018-160180280 = "......"
16018-160180290 = "Falou, tá falado, hein?"
16018-160180300 = "Sensei, você tá livre agora?"
16018-160180310 = "Ah, se estiver ocupado nem esquenta"
16018-160180320 = "Olá, Rabu"
16018-160180330 = "O que houve?"
16018-160180340 = "Ué, você tá estranhamente calmo hoje"
16018-160180350 = "É que eu te vi de longe agora há pouco,"
16018-160180360 = "E você parecia bem cansado. Vê se dorm"
16018-160180370 = "Esses passos...... Você tá vindo pra cá correndo de novo?!"
16018-160180380 = "Sensei,"
16018-160180390 = "Você costuma falar aquele tipo de coisa sempre?"
16018-160180400 = "Sem brincadeira?"
16018-160180410 = "Claro!"
16018-160180420 = "Porque é o que eu sempre penso de verdade!"
16018-160180430 = "Aff, tá bom, desisto"
16018-160180440 = "Mas não vai falar aquilo na frente das minhas meninas, hein?"
16018-160180450 = "Claro que não"
16018-160180460 = "Nem na frente de outras garotas. Se você falar..."
16018-160180470 = "Ah, espera, não é"
16018-160180480 = "Não tô dizendo isso pra você não falar aquilo pra outras garotas!"
16018-160180490 = "Aaah, quer saber?! Esquece, não é nada!!"
16018-160180500 = "Sensei, sou eu"
16018-160180510 = "Não importa onde você esteja agora, você não tá correndo de novo, né?"
16018-160180520 = "Por via das dúvidas eu já corri até o saguão......"
16018-160180530 = "Por acaso você é meio bobo, Sensei?"
16018-160180540 = "Bom, tanto faz. Outro dia eu achei uma coisa bem legal lá no Mercado Negro"
16018-160180550 = "Ah, não é nada perigoso, é um negócio útil mesmo"
16018-160180560 = "Pensei que talvez pudesse servir pra você, Sensei"
16018-160180570 = "?"
16018-160180580 = "Tá correndo de novo?"
16018-160180590 = "Ei"
16018-160180600 = "Sensei?"
16018-160180610 = "Sensei"
16018-160180620 = "Aquela máquina de vendas tá com defeito"
16018-160180630 = "Eu escolhi suco de maçã,"
16018-160180640 = "Mas tá com gosto de abacaxi"
16018-160180650 = "Será que estragou? E o seu, Sensei, tá normal?"
16018-160180660 = "Não te deu dor de barriga nem nada?"
16018-160180670 = "O meu suco de abacaxi tá com gosto de maçã"
16018-160180680 = "Sério? Que estranho......"
16018-160180690 = "Peraí, quê?!"
16018-160180700 = "Sensei, tá livre agora?"
16018-160180710 = "Mesmo se não estiver, vem cá rapidinho!"
16018-160180720 = "Ué, aconteceu alguma coisa?!"
16018-160180730 = "Não, é só um convite pra dar uma volta mesmo"
16018-160180740 = "Estava passando aqui por perto e fiquei curiosa pra saber o que você tava fazendo"
16018-160180750 = "Ah, você tá ocupado agora?"
16018-160180760 = "Se estiver, tudo bem...... o que eu falei antes era brincadeira"
16018-160180770 = "Acabei de ficar sem trabalho nenhum"
16018-160180780 = "Comi toda a papelada de hoje"
16018-160180790 = "Tem certeza de que você é mesmo um adulto?!"
16018-160180800 = "Então quer dizer que você pode vir, né?"
16018-160180810 = "Tô te esperando aqui embaixo, viu?"
16018-160180820 = "E vê se vem andando, sem correr!!"
16018-160180830 = "Aff...... já tá tarde, mas ouve essa"
16018-160180840 = "Eu fui pesquisar, tá bom?!"
16018-160180850 = "Aquilo lá não era esgoto, era só uma canaleta de escoamento de água da chuva!"
16018-160180860 = "Era só água da chuva, tá me ouvindo?!"
16018-160180870 = "Não era água suja de jeito nenhum!!"
16018-160180880 = "Calma, eu não disse nada......"
16018-160180890 = "Poxa, logo quando eu fiz uma boa ação!"
16018-160180900 = "A Rabu mostrando esse lado gentil foi incrível mesmo!"
16018-160180910 = "Se você ainda estiver encanada com isso, eu também vou lá dar um tchibum na valeta!"
16018-160180920 = "Não ouse usar o sagrado nome do Tchibum pra uma coisa dessas!!"
16018-160180930 = "E já falei que não era valeta de esgoto!"
16018-160180940 = "Quer dizer, fico feliz pelo elogio, mas!"
16018-160180950 = "......"
16018-160180960 = "Ah, e não conta pras minhas meninas sobre o que você viu hoje, hein?"
16018-160180970 = "Estamos entendidos?!"
