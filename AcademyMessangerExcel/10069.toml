[translation]
10069-100690010 = "Здравствуйте, Сенсей."
10069-100690020 = "Ты сегодня свободен, правда?"
10069-100690030 = "Прости. Я хотела выделить для тебя время раньше."
10069-100690040 = "Ха-ха-ха."
10069-100690050 = "Конечно, Шале держит тебя занятым. Что поделать?"
10069-100690060 = "Тогда я буду считать, что ты свободен, и сегодня приду к тебе."
10069-100690070 = "Я должна прибыть вскоре после обеда. Это нормально?"
10069-100690080 = "Буду ждать."
10069-100690090 = "Хорошо, тогда увидимся."
10069-100690100 = "Сенсей."
10069-100690110 = "У тебя сейчас есть время?"
10069-100690120 = "Ты ведь не скажешь, что опять завален работой?"
10069-100690130 = "Если это ради студента, я найду время."
10069-100690140 = "...Правда? Ты уверен?"
10069-100690150 = "Хм."
10069-100690160 = "Хорошо."
10069-100690170 = "Я в Променаде Чёрной Черепахи..."
10069-100690180 = "и работаю над новым блюдом..."
10069-100690190 = "Сможешь прийти попробовать?"
10069-100690200 = "Новый рецепт от Руми?"
10069-100690210 = "Можно и так сказать."
10069-100690220 = "Ну, если будет возможность, я бы очень хотела, чтобы ты пришёл встретиться со мной в Променаде Чёрной Черепахи."
10069-100690230 = "Я всегда буду ждать тебя, Сенсей!"
10069-100690240 = "Как вы, Сенсей?"
10069-100690250 = "Ты ведь снова не пропускаешь еду?"
10069-100690260 = "Я больше так не делаю..."
10069-100690270 = "Я собираюсь заглянуть в Шаньхайцзин."
10069-100690280 = "О, правда?"
10069-100690290 = "Если будет возможность, загляни и в Променад Чёрной Черепахи."
10069-100690300 = "Я с удовольствием о тебе позабочусь, Сенсей."
10069-100690310 = "Ты, наверное, не знаешь, но..."
10069-100690320 = "в Променаде Чёрной Черепахи у нас сейчас акция."
10069-100690330 = "Что такое?"
10069-100690340 = "Как понятно из названия, определённое блюдо"
10069-100690350 = "на этой неделе будет продаваться со скидкой."
10069-100690360 = "И блюдо, акция на которое начинается сегодня, — это..."
10069-100690370 = "Пельмени!"
10069-100690380 = "Пельмени... Здорово!"
10069-100690390 = "Ага, так что всё оставшееся утро я буду"
10069-100690400 = "готовить пельмени на пару!"
10069-100690410 = "Можно прийти посмотреть?"
10069-100690420 = "О, Сенсей придёт в гости!"
10069-100690430 = "Я не возражаю."
10069-100690440 = "Если у тебя есть время, конечно."
10069-100690450 = "Удивительно, но сегодня утром я свободна."
10069-100690460 = "Вот как?"
10069-100690470 = "Буду рада, если ты придёшь."
10069-100690480 = "Буду ждать."
