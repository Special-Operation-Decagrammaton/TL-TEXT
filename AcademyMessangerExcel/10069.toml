[translation]
10069-100690010 = "С возвращением, Сенсей."
10069-100690020 = "Эм, встреча сегодня, да?"
10069-100690030 = "Прости, что заставил ждать. Сегодня подходит."
10069-100690040 = "Аха-ха!"
10069-100690050 = "Я знаю, что ты занят в Шале, ничего страшного."
10069-100690060 = "Это я тебя позвала."
10069-100690070 = "Так что я буду после полудня, договорились?"
10069-100690080 = "Хорошо, буду ждать."
10069-100690090 = "Хорошо, увидимся позже."
10069-100690100 = "Сенсей."
10069-100690110 = "Можно попросить тебя кое о чём?"
10069-100690120 = "Ты занят работой?"
10069-100690130 = "Если просишь ты, Руми, я всегда рад."
10069-100690140 = "...Фуфу, правда."
10069-100690150 = "Ты серьёзно?"
10069-100690160 = "Тогда..."
10069-100690170 = "В ресторане «Чёрная черепаха»,"
10069-100690180 = "это моё новое блюдо."
10069-100690190 = "Не хочешь попробовать?"
10069-100690200 = "Новое блюдо Руми!"
10069-100690210 = "Пока только пробная версия."
10069-100690220 = "Когда тебе удобно, зайди в ресторан «Чёрная черепаха»."
10069-100690230 = "Буду ждать."
10069-100690240 = "Сенсей, как дела?"
10069-100690250 = "Ты ведь не пропускаешь приёмы пищи?"
10069-100690260 = "Нет, я ем как следует..."
10069-100690270 = "Сейчас я по делам в Шаньхайцзин."
10069-100690280 = "О, правда?"
10069-100690290 = "Если будет время, загляни в ресторан «Чёрная черепаха»."
10069-100690300 = "Я сделаю для тебя особое предложение."
10069-100690310 = "Ты, наверное, не знаешь..."
10069-100690320 = "В ресторане «Чёрная черепаха» есть «блюдо недели»."
10069-100690330 = "Блюдо недели...?"
10069-100690340 = "Да. Каждую неделю выбирают другое блюдо."
10069-100690350 = "И предлагают по специальной сниженной цене."
10069-100690360 = "И вот..."
10069-100690370 = "На этой неделе блюдо недели — пельмени."
10069-100690380 = "Пельмени... вкусно..."
10069-100690390 = "Так что сегодня утром,"
10069-100690400 = "придётся всё утро готовить пельмени на пару."
10069-100690410 = "Можно мне прийти посмотреть?"
10069-100690420 = "О, интересно?"
10069-100690430 = "Заходи в любое время."
10069-100690440 = "Если у тебя, конечно, есть время."
10069-100690450 = "Сегодня как раз утром я свободен."
10069-100690460 = "Понятно."
10069-100690470 = "Хорошо."
10069-100690480 = "Тогда я буду ждать в ресторане «Чёрная черепаха»."
