[translation]
10069-100690010 = "Bom trabalho, Sensei."
10069-100690020 = "Ei, a nossa reunião era hoje mesmo, né?"
10069-100690030 = "Desculpa te deixar esperando. Pode ser hoje mesmo."
10069-100690040 = "Ahaha!"
10069-100690050 = "Eu sei como o trabalho na Schale é corrido, não tem jeito."
10069-100690060 = "E, afinal de contas, fui eu que pedi."
10069-100690070 = "Bom, devo chegar aí logo depois do almoço, então até lá."
10069-100690080 = "Beleza, fico te esperando."
10069-100690090 = "Combinado, até mais tarde."
10069-100690100 = "Sensei"
10069-100690110 = "Queria te pedir um favorzinho..."
10069-100690120 = "Tá muito ocupado com o trabalho?"
10069-100690130 = "Para um pedido da Rumi, tenho tempo a qualquer hora."
10069-100690140 = "...Hehe, é mesmo?"
10069-100690150 = "De verdade?"
10069-100690160 = "Nesse caso..."
10069-100690170 = "A Associação Comercial Genbu... quer dizer,"
10069-100690180 = "pra ser exata, é uma receita nova que eu mesma estou testando por conta própria,"
10069-100690190 = "mas será que você poderia vir provar?"
10069-100690200 = "Um prato novo da Rumi!"
10069-100690210 = "Ainda está em fase de testes, viu?"
10069-100690220 = "Quando for um bom horário pra você, dá um pulo aqui na Associação Comercial Genbu, tá?"
10069-100690230 = "Tô te esperando."
10069-100690240 = "Sensei, como estão as coisas?"
10069-100690250 = "Está fazendo todas as refeições direitinho, sem pular nenhuma, né?"
10069-100690260 = "Estou comendo direitinho, sim..."
10069-100690270 = "Tenho umas coisas para resolver em Shanhaijing e estou indo para aí agora mesmo."
10069-100690280 = "Opa, é mesmo?"
10069-100690290 = "Se sobrar um tempinho, passa aqui na Associação Comercial Genbu."
10069-100690300 = "Faço um agrado especial pra você."
10069-100690310 = "Talvez você não saiba, Sensei, mas..."
10069-100690320 = "Aqui na Associação Comercial Genbu, nós temos o \"Prato da Semana\"."
10069-100690330 = "Prato da Semana...?"
10069-100690340 = "Isso. Toda semana a gente escolhe um prato diferente"
10069-100690350 = "e serve por um preço especial, mais baratinho que o normal."
10069-100690360 = "E aí..."
10069-100690370 = "O \"Prato da Semana\" desta vez é guioza."
10069-100690380 = "Guioza... Parece uma delícia..."
10069-100690390 = "Por isso, hoje de manhã"
10069-100690400 = "eu vou passar o tempo todo cozinhando guioza no vapor."
10069-100690410 = "Posso ir aí ver?"
10069-100690420 = "Opa, ficou curioso?"
10069-100690430 = "Pode vir a qualquer hora."
10069-100690440 = "Bom, se a sua agenda estiver livre, claro..."
10069-100690450 = "Por coincidência, hoje estou com a manhã livre."
10069-100690460 = "Ah, que ótimo!"
10069-100690470 = "Combinado, então."
10069-100690480 = "Fico te esperando aqui na Associação Comercial Genbu."
