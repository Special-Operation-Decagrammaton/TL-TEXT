[translation]
10103-101030010 = "Сенсей...?"
10103-101030020 = "Привет, Марина. Что случилось?"
10103-101030030 = "Я в месте под названием Променад Чёрной Черепахи в Шаньхайцзине."
10103-101030040 = "Я оказалась в... затруднительном положении."
10103-101030050 = "Мне довольно стыдно, но мне нужна ваша помощь."
10103-101030060 = "Сейчас буду!"
10103-101030070 = "Возможно, я слишком много съела, но..."
10103-101030080 = "...у меня болит живот."
10103-101030090 = "...Ты в порядке?"
10103-101030100 = "Одно я усвоила точно."
10103-101030110 = "Внешний вид еды не обязательно связан с её вкусом."
10103-101030120 = "Знаешь, эти шашлычки из насекомых продают только туристам."
10103-101030130 = "Почему ты говоришь об этом только СЕЙЧАС?!"
10103-101030140 = "Где вы?"
10103-101030150 = "Я прибыла."
10103-101030160 = "Прости, Марина! Я немного опаздываю! Всего пять минут!"
10103-101030170 = "Столько я могу подождать."
10103-101030180 = "Буду ждать вас на площади."
10103-101030190 = "...Какой хлопотный опыт."
10103-101030200 = "Но ты отлично выглядела!"
10103-101030210 = "Даже если это пустые слова, не стоит так говорить."
10103-101030220 = "...А если это были не пустые слова, ваше нарушение ещё серьёзнее."
10103-101030230 = "Мне уже пишут из разных мест, что им понравился фотоальбом..."
10103-101030240 = "На всякий случай уточню: вы ведь его не покупали?"
10103-101030250 = "..."
10103-101030260 = "Подожди. Что значит это «троеточие»?!"
10103-101030270 = "Сенсей?"
10103-101030280 = "Сенсей?!?!"
10103-101030290 = "Как называется чайный домик, в который мы сегодня собираемся?"
10103-101030300 = "Кажется, «Персиковый источник»."
10103-101030310 = "Верно."
10103-101030320 = "Мне интересно, насколько вкусен чай Шаньхайцзина на самом деле."
10103-101030330 = "Хм. Жду с нетерпением."
