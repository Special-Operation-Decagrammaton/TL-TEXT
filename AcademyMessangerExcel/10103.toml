[translation]
10103-101030010 = "Сенсей."
10103-101030020 = "Марина, что случилось?"
10103-101030030 = "Я пришла в ресторан «Чёрная черепаха» в Шанхайцзине,"
10103-101030040 = "и у меня небольшая проблема."
10103-101030050 = "Если не сложно, не могли бы вы помочь?"
10103-101030060 = "Я сейчас приду."
10103-101030070 = "Наверное, я переела,"
10103-101030080 = "и живот немного..."
10103-101030090 = "...Ты в порядке?"
10103-101030100 = "Ага, я кое-что усвоила."
10103-101030110 = "Вкус еды и её внешний вид не всегда совпадают."
10103-101030120 = "На самом деле, те жареные насекомые — это для туристов..."
10103-101030130 = "Надо было сразу сказать!"
10103-101030140 = "Я пришла, Сенсей."
10103-101030150 = "Где вы?"
10103-101030160 = "Простите, я опаздываю минут на пять!"
10103-101030170 = "Ничего страшного, приходите осторожно."
10103-101030180 = "Я жду на площади."
10103-101030190 = "...Было тяжело."
10103-101030200 = "Но было очень красиво."
10103-101030210 = "Х-хватит комплиментов."
10103-101030220 = "...Если вы не шутите, то это ещё хуже."
10103-101030230 = "Ох, приходит много отзывов о фотоальбоме."
10103-101030240 = "На всякий случай спрошу: вы ведь не покупали его?"
10103-101030250 = "..."
10103-101030260 = "Стойте, почему вы молчите?"
10103-101030270 = "Сенсей?"
10103-101030280 = "Сенсей!?"
10103-101030290 = "Я никак не могу вспомнить название кафе, куда мы идём..."
10103-101030300 = "Я думаю это было «Весеннее цветение персика»"
10103-101030310 = "А, точно."
10103-101030320 = "Интересно, какой же чай подают в Шанхайцзине."
10103-101030330 = "Я с нетерпением жду."