[translation]
10103-101030010 = "Sensei."
10103-101030020 = "O que houve, Marina?"
10103-101030030 = "Vim até um lugar chamado Associação Comercial Genbu, em Shanhaijing,"
10103-101030040 = "mas estou com um pequeno problema."
10103-101030050 = "Se puder, você poderia me ajudar?"
10103-101030060 = "Já estou indo."
10103-101030070 = "Não sei se foi porque comi demais,"
10103-101030080 = "mas a minha barriga está meio..."
10103-101030090 = "...Você tá bem?"
10103-101030100 = "Sim, e tirei um aprendizado valioso disso tudo:"
10103-101030110 = "O sabor e a aparência de uma comida nem sempre coincidem."
10103-101030120 = "Na verdade, aqueles espetinhos de inseto são feitos só pra pegar turista..."
10103-101030130 = "Devia ter me avisado isso antes!"
10103-101030140 = "Já cheguei, Sensei."
10103-101030150 = "Onde você está?"
10103-101030160 = "Foi mal, acho que vou atrasar uns 5 minutos!"
10103-101030170 = "Sem problemas, venha com cuidado."
10103-101030180 = "Estou esperando na praça."
10103-101030190 = "...Deu trabalho."
10103-101030200 = "Mas você estava linda."
10103-101030210 = "P-Pare de bajulação."
10103-101030220 = "...E se não for bajulação, aí é que me deixa ainda mais sem jeito."
10103-101030230 = "Haah, estou recebendo comentários sobre o álbum de fotos de tudo quanto é gente."
10103-101030240 = "Só por garantia, você não comprou um, né, Sensei?"
10103-101030250 = "..."
10103-101030260 = "Espere, por que não diz nada?"
10103-101030270 = "Sensei?"
10103-101030280 = "Sensei!?"
10103-101030290 = "Não estou conseguindo lembrar o nome da casa de chá onde vamos agora..."
10103-101030300 = "Chama-se \"Tougenkyou\"."
10103-101030310 = "Ah, isso mesmo."
10103-101030320 = "Qual será o sabor do chá de Shanhaijing?"
10103-101030330 = "Estou bastante curiosa."
