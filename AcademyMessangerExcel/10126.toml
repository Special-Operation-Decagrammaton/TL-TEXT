[translation]
10126-101260010 = "Ei, Sensei..."
10126-101260020 = "Tem uma coisinha em que eu queria a sua ajuda..."
10126-101260030 = "O que houve?"
10126-101260040 = "Ainda é segredo..."
10126-101260050 = "Mas acho que... vai ser muito bom para você também, Sensei."
10126-101260060 = "E aí? Ficou curioso?"
10126-101260070 = "Então vai ter que vir conferir pessoalmente, né?"
10126-101260080 = "Quando chegar aqui, eu te conto."
10126-101260090 = "Ihihi..."
10126-101260100 = "H-Hum?"
10126-101260110 = "Senhorita Kanoe?"
10126-101260120 = "Sensei, conseguiu voltar para casa direitinho?"
10126-101260130 = "Será que as memórias da sua vida passada já começaram a despertar?"
10126-101260140 = "Senti como se tivesse voltado à infância."
10126-101260150 = "Entendi..."
10126-101260160 = "Tudo bem."
10126-101260170 = "Ainda existem outros métodos."
10126-101260180 = "Bom... fica para a próxima, então."
10126-101260190 = "Quando esse dia chegar, vou te mostrar quem eu sou de verdade."
10126-101260200 = "Sensei... você é do tipo que sabe dizer \"não\" com firmeza?"
10126-101260210 = "Ou é do tipo... que não consegue recusar um pedido?"
10126-101260220 = "Por que essa pergunta do nada?"
10126-101260230 = "Ihi, por nada não."
10126-101260240 = "Não precisa se preocupar."
10126-101260250 = "Ihi..."
10126-101260260 = "Ihihihi..."
10126-101260270 = "Você está ouvindo direitinho... aquele ASMR que eu te dei?"
10126-101260280 = "Sim. Por mais que eu ouça, sempre me surpreendo."
10126-101260290 = "Esta noite... durma ouvindo ele de novo, tá?"
10126-101260300 = "Pensando em mim... o tempo todo."
10126-101260310 = "Se quiser ouvir outros tipos de voz, é só pedir..."
10126-101260320 = "Que eu gravo na hora e mando para você."
10126-101260330 = "T-Tá bom! Mas acho que por enquanto esse já é mais que suficiente!"
10126-101260340 = "Entendi... Então, boa noite..."
10126-101260350 = "Até amanhã."
10126-101260360 = "Ihihi..."
10126-101260370 = "Sensei, você tem tempo hoje?"
10126-101260380 = "Aliás, mesmo se não tiver, dê um jeito de abrir um espaço na agenda."
10126-101260390 = "O que aconteceu assim de repente?"
10126-101260400 = "Preciso urgente de um assistente de gravação."
10126-101260410 = "A pessoa da equipe que sempre me ajuda teve um imprevisto e não pôde vir..."
10126-101260420 = "Aí pensei que você poderia quebrar esse galho para mim, Sensei..."
10126-101260430 = "E aí?"
10126-101260440 = "Vai me ajudar?"
10126-101260450 = "Claro, deixa comigo!"
10126-101260460 = "Ihihi"
10126-101260470 = "Então vou ficar te esperando."
10126-101260480 = "Sensei..."
10126-101260490 = "Hoje eu recuei obedientemente, mas"
10126-101260500 = "na próxima vez você não vai escapar tão fácil."
10126-101260510 = "P-Pegue leve comigo..."
10126-101260520 = "Bom, hoje também..."
10126-101260530 = "Durma bem gostoso ouvindo o meu ASMR, viu?"
10126-101260540 = "Estarei te esperando... nos seus sonhos..."
10126-101260550 = "Ihihi..."
10126-101260560 = "Sensei, tenho um pedido para te fazer."
10126-101260570 = "Uma promessa que você precisa cumprir custe o que custar."
10126-101260580 = "Pode me dizer do que se trata primeiro?"
10126-101260590 = "Se você me vir hoje na rua, me ignore completamente."
10126-101260600 = "Não fale comigo, nem cruze o olhar com o meu."
10126-101260610 = "Entendeu...?"
10126-101260620 = "Eu estava planejando ir para a Wild Hunt hoje,"
10126-101260630 = "vou ter que te ignorar lá também?"
10126-101260640 = "O lugar não importa."
10126-101260650 = "Apenas faça o que estou dizendo."
10126-101260660 = "Caso contrário... você correrá perigo, Sensei."
10126-101260670 = "Estou falando muito sério."
10126-101260680 = "Entendido...?"
10126-101260690 = "T-Tá bom... entendi."
10126-101260700 = "Promete mesmo, viu?"
10126-101260710 = "Quando estiver seguro de novo, eu entro em contato..."
