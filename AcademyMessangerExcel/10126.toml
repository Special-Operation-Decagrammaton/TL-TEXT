[translation]
10126-101260010 = "Слушайте, Сенсей."
10126-101260020 = "Есть кое-что, в чём мне нужна ваша помощь..."
10126-101260030 = "Что случилось?"
10126-101260040 = "Пока секрет..."
10126-101260050 = "Но я думаю, что это будет... хорошо и для вас."
10126-101260060 = "Ну что, заинтересовало?"
10126-101260070 = "Тогда вам придётся проверить это лично, так ведь?"
10126-101260080 = "Если подойдёте ко мне, я всё расскажу."
10126-101260090 = "И-хи-хи..."
10126-101260100 = "А-а, э-э?"
10126-101260110 = "Каное?"
10126-101260120 = "Сенсей, вы благополучно добрались?"
10126-101260130 = "Воспоминания из прошлой жизни уже начали возвращаться?"
10126-101260140 = "Я чувствовала себя так, будто вернулась в детство."
10126-101260150 = "Понятно."
10126-101260160 = "Хорошо."
10126-101260170 = "У меня ещё есть способы."
10126-101260180 = "Тогда... до следующего раза."
10126-101260190 = "В тот раз я покажу вам настоящую себя."
10126-101260200 = "Сенсей... вы из тех, кто может твёрдо отказать?"
10126-101260210 = "Или... из тех, кто не может?"
10126-101260220 = "С чего вдруг?"
10126-101260230 = "И-хи, ничего."
10126-101260240 = "Не обращайте внимания."
10126-101260250 = "И-хи..."
10126-101260260 = "И-хи-хи-хи..."
10126-101260270 = "Вы слушаете тот АСМР, который я вам дала?"
10126-101260280 = "Да. Каждый раз удивляюсь, сколько бы ни слушал."
10126-101260290 = "Сегодня вечером... слушайте это и засыпайте."
10126-101260300 = "Думая обо мне... ладно?"
10126-101260310 = "Если захотите послушать другой голос, скажите..."
10126-101260320 = "Я сразу запишу и отправлю вам."
10126-101260330 = "А-ага! Но сейчас мне пока хватит этого!"
10126-101260340 = "Вот как... ну, тогда спокойной ночи..."
10126-101260350 = "Увидимся завтра."
10126-101260360 = "И-хи-хи..."
10126-101260370 = "Сенсей, у вас есть время сегодня?"
10126-101260380 = "Даже если нет, освободите его."
10126-101260390 = "Что случилось вдруг?"
10126-101260400 = "Срочно понадобился помощник для записи."
10126-101260410 = "Обычный сотрудник внезапно не смог прийти..."
10126-101260420 = "Я подумала, не согласитесь ли вы помочь, Сенсей."
10126-101260430 = "Ну как?"
10126-101260440 = "Сделаете это?"
10126-101260450 = "Да, положись на меня!"
10126-101260460 = "И-хи-хи"
10126-101260470 = "Тогда я жду."
10126-101260480 = "Сенсей..."
10126-101260490 = "Сегодня я спокойно отступила,"
10126-101260500 = "но в следующий раз так легко не отделаешься."
10126-101260510 = "П-пожалуйста, помягче..."
10126-101260520 = "Ну что ж, сегодня тоже..."
10126-101260530 = "слушайте мой АСМР и крепко спите."
10126-101260540 = "Я буду ждать вас во сне..."
10126-101260550 = "И-хи-хи..."
10126-101260560 = "Сенсей, у меня к вам просьба."
10126-101260570 = "Обещание, которое вы должны обязательно исполнить."
10126-101260580 = "Можешь рассказать, что за обещание?"
10126-101260590 = "Если увидите меня сегодня, ни в коем случае не обращайте внимания."
10126-101260600 = "Не заговаривайте со мной и не смотрите в глаза."
10126-101260610 = "Хорошо...?"
10126-101260620 = "Я сегодня планирую пойти в Дикую Охоту."
10126-101260630 = "Там тоже нужно игнорировать тебя?"
10126-101260640 = "Место не имеет значения."
10126-101260650 = "Делайте, как я сказала."
10126-101260660 = "Иначе... вы окажетесь в опасности."
10126-101260670 = "Я говорю это совершенно серьёзно."
10126-101260680 = "Вы поняли...?"
10126-101260690 = "А-ага... понял."
10126-101260700 = "Обязательно, слышите."
10126-101260710 = "Когда станет безопасно, я снова свяжусь с вами..."