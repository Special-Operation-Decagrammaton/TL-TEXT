[translation]
10126-101260010 = "Эм, Сенсей."
10126-101260020 = "Не мог бы ты... помочь мне кое с чем?"
10126-101260030 = "Хм? Что именно?"
10126-101260040 = "Это... секрет."
10126-101260050 = "Но... тебе тоже понравится, Сенсей."
10126-101260060 = "Разве тебе не любопытно?"
10126-101260070 = "Не хочешь увидеть?"
10126-101260080 = "Расскажу, когда придёшь."
10126-101260090 = "Э-хе-хе..."
10126-101260100 = "А-Алло?"
10126-101260110 = "Каноэ?"
10126-101260120 = "Сенсей. Ты благополучно вернулся?"
10126-101260130 = "Воспоминания о прошлой жизни понемногу возвращаются к тебе?"
10126-101260140 = "Будто я заново пережил детство..."
10126-101260150 = "Значит, вот как ты решил играть."
10126-101260160 = "Хорошо."
10126-101260170 = "У меня тоже есть свои способы."
10126-101260180 = "Что ж... До следующего раза."
10126-101260190 = "При следующей встрече я покажу тебе свою истинную форму."
10126-101260200 = "Сенсей... Ты умеешь говорить «нет»?"
10126-101260210 = "Или тебе это тяжело даётся?"
10126-101260220 = "К чему ты клонишь?"
10126-101260230 = "Хи-хи. Просто любопытство."
10126-101260240 = "Тебе не о чем беспокоиться."
10126-101260250 = "Хи-хи..."
10126-101260260 = "Эхе-хе-хе..."
10126-101260270 = "Ты слушаешь ту ASMR-запись?"
10126-101260280 = "Ага! Никак не надоест!"
10126-101260290 = "Послушай её сегодня перед сном."
10126-101260300 = "И думай обо мне."
10126-101260310 = "Если захочешь услышать другие голоса, просто скажи."
10126-101260320 = "Я сразу запишу и отправлю тебе."
10126-101260330 = "Этой мне более чем достаточно!"
10126-101260340 = "Раз ты так говоришь. Тогда сладких снов."
10126-101260350 = "И до следующего раза."
10126-101260360 = "Хи-хи-хи..."
10126-101260370 = "Сенсей. У тебя сегодня есть время?"
10126-101260380 = "Даже если нет, просто скажи «да»."
10126-101260390 = "Эм? Думаю, да?"
10126-101260400 = "Мой помощник по записи отменил всё в последний момент."
10126-101260410 = "Так что мне нужен новый. Прямо сейчас."
10126-101260420 = "Я подумала, что ты быстро во всём разберёшься."
10126-101260430 = "Ну как?"
10126-101260440 = "Не хочешь... стать моим помощником по записи?"
10126-101260450 = "Конечно! Буду там, где понадоблюсь!"
10126-101260460 = "Хи-хи, ладно. Тогда приходи сейчас."
10126-101260470 = "Буду ждать."
10126-101260480 = "Сенсей..."
10126-101260490 = "Сегодня я позволила тебе победить,"
10126-101260500 = "но не жди, что в следующий раз всё будет по-твоему."
10126-101260510 = "П-Пожалуйста, будь со мной помягче."
10126-101260520 = "Хмф. Тогда..."
10126-101260530 = "Снова послушай мой ASMR перед сном."
10126-101260540 = "И увидимся... в твоих снах."
10126-101260550 = "Э-хе-хе..."
10126-101260560 = "Сенсей. У меня есть просьба."
10126-101260570 = "И я очень надеюсь, что ты на неё согласишься."
10126-101260580 = "Эм... Какая?"
10126-101260590 = "Притворись, что меня не существует! Даже если сегодня увидишь меня!"
10126-101260600 = "Даже не смотри на меня. И уж тем более не разговаривай."
10126-101260610 = "Понятно?"
10126-101260620 = "Но я ведь буду в Вайлдхант..."
10126-101260630 = "Как мне притвориться, что я тебя не знаю?"
10126-101260640 = "Неважно."
10126-101260650 = "Делай, как я сказала."
10126-101260660 = "Иначе... тебе будет грозить опасность, Сенсей."
10126-101260670 = "Я серьёзно."
10126-101260680 = "Понял...?"
10126-101260690 = "Эм... Понял..."
10126-101260700 = "Тогда договор скреплён."
10126-101260710 = "Я свяжусь с тобой, когда будет безопасно..."
