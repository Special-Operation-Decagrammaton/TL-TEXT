[translation]
10012-872 = "Bom dia, Treinador."
10012-873 = "Você tem um tempinho livre hoje?"
10012-874 = "Tenho sim, o que houve?"
10012-875 = "Não tô ocupado hoje, pode falar."
10012-876 = "Ótimo! Na verdade,"
10012-877 = "terminei de montar aquela planilha de treinos que tínhamos conversado outro dia."
10012-878 = "Se puder, gostaria que desse uma olhada. Poderia vir até a academia?"
10012-879 = "Estarei esperando!"
10012-880 = "Treinador, você estará ocupado neste fim de semana?"
10012-881 = "Se estiver livre, gostaria de ir ao shopping comigo?"
10012-882 = "Claro, vamos sim!"
10012-883 = "O que você vai comprar?"
10012-884 = "Muito obrigada!"
10012-885 = "Quero comprar whey protein e gostaria de pedir algumas recomendações suas, Treinador."
10012-886 = "Estarei esperando por você no shopping!"
10012-887 = "Treinador. Hoje preparei algo especial para o nosso treino."
10012-888 = "Nos vemos hoje à tarde na academia!"
10012-889 = "Excelente treino hoje, Treinador!"
10012-890 = "Como está se sentindo fisicamente?"
10012-891 = "É, sobrevivendo..."
10012-892 = "Meus músculos estão gritando de dor..."
10012-893 = "Como esperado do meu Treinador, parece que ainda tem gás de sobra!"
10012-894 = "Talvez a intensidade tenha sido um pouquinho alta demais..."
10012-895 = "Na próxima vez que nos encontrarmos, vou ajudá-lo a fazer um bom alongamento."
10012-896 = "Ah, por sinal, o whey protein que enviei"
10012-897 = "já deve estar chegando aí no seu escritório, Treinador."
10012-899 = "Não se esqueça de tomar 4 vezes ao dia, viu?"
10012-900 = "Olá, Treinador."
10012-901 = "Se estiver livre, podemos nos encontrar rapidinho neste fim de semana?"
10012-902 = "É que... a dor muscular ainda não passou...!"
10012-903 = "Eu tô me exercitando direitinho! Não tô matando treino!"
10012-904 = "Ah, não, hum..."
10012-905 = "Não é sobre exercícios desta vez..."
10012-906 = "Ah, então pode mandar!"
10012-907 = "Muito obrigada!"
10012-908 = "Até mais tarde, então!"
10012-10012010 = "Treinador, você já chegou a conhecer o parque novo que inaugurou perto da Schale?"
10012-10012020 = "Ainda não fui lá."
10012-10012030 = "Entendi."
10012-10012040 = "Outro dia dei uma passadinha lá na volta do meu plantão,"
10012-10012050 = "e a pista de corrida está super bem cuidada, perfeita para uma corrida matinal."
10012-10012060 = "Por isso, se você topar,"
10012-10012070 = "que tal fazermos uma corridinha leve nesse parque amanhã de manhã?"
10012-10012080 = "Se for uma corridinha leve..."
10012-10012090 = "Muito obrigada!"
10012-10012100 = "Então nos vemos amanhã de manhã!"
