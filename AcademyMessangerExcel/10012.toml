[translation]
10012-872 = "Доброе утро, тренер."
10012-873 = "У вас будет время сегодня?"
10012-874 = "Да, а что?"
10012-875 = "Я не особенно занят, так что всё в порядке."
10012-876 = "Да, на самом деле,"
10012-877 = "Я составила ту тренировочную программу, о которой мы говорили."
10012-878 = "Если вы не против, не могли бы вы прийти в спортзал, чтобы проверить её?"
10012-879 = "Я буду ждать вас!"
10012-880 = "Тренер, вы заняты в эти выходные?"
10012-881 = "Если хотите, не сходить ли нам вместе в торговый центр?"
10012-882 = "С удовольствием!"
10012-883 = "Что ты собираешься покупать?"
10012-884 = "Спасибо!"
10012-885 = "Я хочу купить протеин, и мне бы хотелось получить совет от тренера."
10012-886 = "Тогда я буду ждать вас в торговом центре."
10012-887 = "Тренер. Сегодня я подготовил кое-что особенное для тренировки."
10012-888 = "Встретимся сегодня днём в спортзале."
10012-889 = "Вы хорошо поработали, тренер."
10012-890 = "Как ваше самочувствие?"
10012-891 = "Ага, более-менее."
10012-892 = "Мышцы просто кричат..."
10012-893 = "Как и ожидалось от тренера, вы ещё можете продолжать."
10012-894 = "Возможно, интенсивность была слишком высокой..."
10012-895 = "В следующий раз я помогу вам с растяжкой."
10012-896 = "Кстати, уже, наверное, в ваш офис доставили"
10012-897 = "тот протеин, который я отправил."
10012-899 = "Не забывайте пить по 4 раза в день."
10012-900 = "Тренер, здравствуйте."
10012-901 = "Если можно, не могли бы мы встретиться в эти выходные?"
10012-902 = "Ну, у меня всё ещё болят мышцы...!"
10012-903 = "Я занимаюсь! Не ленюсь!"
10012-904 = "А, нет, то есть..."
10012-905 = "Это не про тренировки..."
10012-906 = "Тогда я за любое дело!"
10012-907 = "Спасибо!"
10012-908 = "Тогда до встречи!"
10012-10012010 = "Тренер, вы уже были в новом парке рядом с Шале?"
10012-10012020 = "Ещё нет."
10012-10012030 = "Понятно."
10012-10012040 = "Я как-то зашла туда по дороге с дежурства."
10012-10012050 = "Дорожки там хорошие, похоже, подходит для утренней пробежки."
10012-10012060 = "Так что, если вы не против,"
10012-10012070 = "не хотели бы вы завтра утром устроить лёгкую пробежку в том парке?"
10012-10012080 = "Если это лёгкая пробежка, то..."
10012-10012090 = "Спасибо."
10012-10012100 = "Тогда встретимся завтра утром!"
