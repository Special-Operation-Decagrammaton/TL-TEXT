[translation]
10012-872 = "Здравствуйте, Тренер."
10012-873 = "У вас есть сегодня немного времени?"
10012-874 = "Да, что случилось?"
10012-875 = "Я не слишком занят."
10012-876 = "Хорошо, я просто хотела сообщить..."
10012-877 = "Я подготовила график тренировок, о котором говорила раньше."
10012-878 = "Если возможно, хотела бы, чтобы вы посмотрели его сегодня. Можете прийти в спортзал?"
10012-879 = "Буду ждать вас."
10012-880 = "Тренер, вы заняты на этих выходных?"
10012-881 = "Не могли бы вы сходить со мной в торговый центр?"
10012-882 = "Ничего подобного."
10012-883 = "Что собираешься купить?"
10012-884 = "Спасибо, Тренер."
10012-885 = "Мне нужны протеиновые добавки, и я хотела узнать ваше мнение."
10012-886 = "Тогда буду ждать вас в торговом центре."
10012-887 = "Тренер, сегодня я подготовила для вас кое-что особенное."
10012-888 = "Увидимся в спортзале сегодня после обеда."
10012-889 = "Тренер."
10012-890 = "Как вы себя чувствуете?"
10012-891 = "Я в порядке."
10012-892 = "Уф, мои мышцы..."
10012-893 = "Как и ожидалось, вы довольно сильны, Тренер."
10012-894 = "Наверное, тренировка была немного слишком тяжёлой."
10012-895 = "В следующий раз помогу вам растянуться."
10012-896 = "А, кстати, протеиновые добавки, которые я вам отправила,"
10012-897 = "к этому времени уже должны были прибыть в ваш кабинет."
10012-899 = "Пожалуйста, не забывайте принимать их четыре раза в день."
10012-900 = "Тренер."
10012-901 = "Если вы не против, можем немного увидеться на этих выходных?"
10012-902 = "Ик! Но мои мышцы всё ещё..."
10012-903 = "Я очень усердно тренировался!"
10012-904 = "О... Дело не в этом, Тренер."
10012-905 = "Это не связано с тренировками."
10012-906 = "Тогда хорошо!"
10012-907 = "Поняла."
10012-908 = "Увидимся."
10012-10012010 = "Вы уже бывали в новом парке рядом с Шале, Тренер?"
10012-10012020 = "Нет, ещё нет."
10012-10012030 = "О, ясно."
10012-10012040 = "У меня были дела неподалёку, поэтому я туда заглянула."
10012-10012050 = "Это хорошее место для утренней пробежки. Дорожка отлично ухожена."
10012-10012060 = "Если хотите,"
10012-10012070 = "можем завтра утром пробежаться там вместе?"
10012-10012080 = "Только если это будет ЛЁГКАЯ пробежка..."
10012-10012090 = "Обещаю, Тренер."
10012-10012100 = "Тогда увидимся завтра."
