[translation]
10066-100660010 = "Уф... Ай..."
10066-100660020 = "Алиса? Что случилось? Что-то не так?"
10066-100660030 = "Ай-ай-ай... Мне требуется помощь..."
10066-100660040 = "Я совсем не могу двигаться. Запас выносливости равен нулю..."
10066-100660050 = "Уже иду!"
10066-100660060 = "Сенсей."
10066-100660070 = "Я сделала открытие."
10066-100660080 = "Открытие?"
10066-100660090 = "Да. Я нашла способ повысить свой уровень горничной."
10066-100660100 = "У меня аж мурашки..."
10066-100660110 = "Сегодня всё будет иначе. Сегодня я буду другой!"
10066-100660120 = "Я полна решимости, Сенсей. Я буду учиться."
10066-100660130 = "И узнаю... Что такое горничная? Каковы обязанности горничной?"
10066-100660140 = "Видишь ли, я нашла великое сокровище. Целую сокровищницу учебных материалов для горничных!"
10066-100660150 = "Учебных... материалов для горничных?!"
10066-100660160 = "Сенсей."
10066-100660170 = "У меня важные новости."
10066-100660180 = "Если это говоришь ты, Алиса..."
10066-100660190 = "значит, должно произойти что-то невероятное."
10066-100660200 = "Я же сказала, это чрезвычайно важно."
10066-100660210 = "Поэтому я прошу тебя присутствовать, Сенсей."
10066-100660220 = "Я... в беде...?"
10066-100660230 = "Сенсей."
10066-100660240 = "У тебя сегодня есть квесты?"
10066-100660250 = "Не припоминаю."
10066-100660260 = "Понятно!"
10066-100660270 = "День без квестов..."
10066-100660280 = "Я слышала, это хороший день для уборки!"
10066-100660290 = "Уборки?!"
10066-100660300 = "Не волнуйся, Сенсей!"
10066-100660310 = "Горничный-студент героя Алиса поможет тебе!"
10066-100660320 = "Горничная-герой никогда не бросит того, кому нужна помощь!"
