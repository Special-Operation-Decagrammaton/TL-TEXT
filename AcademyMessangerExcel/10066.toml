[translation]
10066-100660010 = "Uuu... Sensei..."
10066-100660020 = "Aris, o que aconteceu?"
10066-100660030 = "Salve... a Aris, por favor."
10066-100660040 = "Ah, não, pensando bem não é nada!"
10066-100660050 = "Estou indo para aí agora!"
10066-100660060 = "Sensei!"
10066-100660070 = "A Aris acabou de fazer uma descoberta!"
10066-100660080 = "O que você descobriu...?"
10066-100660090 = "Um novo método para subir o nível de Maid!"
10066-100660100 = "E como seria esse método...?"
10066-100660110 = "Direto ao ponto:"
10066-100660120 = "O que é uma Maid?! Qual é a verdadeira essência de seu trabalho?!"
10066-100660130 = "O segredo é estudar tudo sobre isso!!"
10066-100660140 = "E a Aris já até encontrou o material de estudo perfeito!"
10066-100660150 = "Material de estudo... de Maid...?"
10066-100660160 = "Sensei."
10066-100660170 = "Tenho um assunto muito importante para tratar."
10066-100660180 = "Um assunto importante da Aris..."
10066-100660190 = "Sinto que vem alguma confusão das grandes por aí..."
10066-100660200 = "É um assunto super importante mesmo!"
10066-100660210 = "Por isso, quero muito que você venha até aqui."
10066-100660220 = "...Tá bom, já estou indo."
10066-100660230 = "Olá, Sensei!"
10066-100660240 = "Você está ocupado hoje?"
10066-100660250 = "Não tenho nada planejado em especial."
10066-100660260 = "Entendo... Então hoje você está livre!"
10066-100660270 = "A Aris ouviu dizer que dias assim"
10066-100660280 = "são perfeitos para fazer faxina!"
