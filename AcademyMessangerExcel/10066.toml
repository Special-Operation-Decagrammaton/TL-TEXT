[translation]
10066-100660010 = "У-у-у... Сенсей..."
10066-100660020 = "Алиса, что случилось?"
10066-100660030 = "Помогите... Алисе."
10066-100660040 = "Ах, нет, ничего!"
10066-100660050 = "Я сейчас приду!"
10066-100660060 = "Сенсей."
10066-100660070 = "Алиса кое-что нашла."
10066-100660080 = "Что именно...?"
10066-100660090 = "Новый способ повысить уровень горничной."
10066-100660100 = "И что это за способ...?"
10066-100660110 = "Короче:"
10066-100660120 = "Что такое горничная! Какова реальность её работы!?"
10066-100660130 = "Нужно это изучить!!"
10066-100660140 = "Я даже нашла подходящие материалы."
10066-100660150 = "Материалы... о горничных...?"
10066-100660160 = "Сенсей."
10066-100660170 = "У меня важный разговор."
10066-100660180 = "Важный разговор для Алисы..."
10066-100660190 = "Чувствую, случится что-то невероятное..."
10066-100660200 = "Это очень важный разговор."
10066-100660210 = "Поэтому я хочу, чтобы вы пришли."
10066-100660220 = "...Хорошо, я сейчас приду."
10066-100660230 = "Здравствуйте, Сенсей."
10066-100660240 = "Вы сегодня заняты?"
10066-100660250 = "Особых планов нет."
10066-100660260 = "Понятно... значит, сегодня вы свободны!"
10066-100660270 = "Алиса слышала, что в такие дни лучше всего убираться!"
10066-100660280 = "Убираться?"
10066-100660290 = "Да!!"
10066-100660300 = "Алиса, студент-горничная, поможет вам!"
10066-100660310 = "Уборка — тоже навык героини-горничной!"
10066-100660320 = "Поэтому доверьтесь Алисе!"
