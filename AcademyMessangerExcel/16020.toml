[translation]
16020-160200010 = "Olá. Poderia me confirmar se este é o número do Sensei da Schale?"
16020-160200020 = "É sim, mas......"
16020-160200030 = "Já faz um tempo que eu queria me encontrar a sós com você"
16020-160200040 = "Você poderia vir até a Rua 4 da Lost Highway hoje à noite?"
16020-160200050 = "Se puder ser depois das oito......"
16020-160200060 = "Consigo abrir um horário, sim"
16020-160200070 = "Ei, pera lá!"
16020-160200080 = "Como assim você vai aceitando tão fácil?!"
16020-160200090 = "Quando receber mensagem de um desconhecido, você tem que desconfiar primeiro"
16020-160200100 = "Vai que é alguém mal-intencionado atrás de informações da Schale?"
16020-160200110 = "......Hm?"
16020-160200120 = "Ou será que você achou que era de alguma garota fofinha?"
16020-160200130 = "Que peninha! Era só a Otogi~"
16020-160200140 = "Não, eu já sabia desde o começo"
16020-160200150 = "Seu nome aparece aqui na tela, Otogi"
16020-160200160 = "Ah"
16020-160200170 = "Este aqui não era o celular de operações"
16020-160200180 = "Aff, dei mole"
16020-160200190 = "Quando é mensagem de uma aluna, é sempre bem-vinda"
16020-160200200 = "Você não se importa de receber contato de números desconhecidos, Sensei?"
16020-160200210 = "O normal seria ignorar, né?"
16020-160200220 = "A maioria dos números desconhecidos é spam mesmo, mas......"
16020-160200230 = "Vai que é uma emergência?"
16020-160200240 = "Bom, nisso você tem um ponto"
16020-160200250 = "Mas, pensando na possibilidade de dar ruim,"
16020-160200260 = "É bom você ter um pouquinho mais de senso de perigo"
16020-160200270 = "Não faltam alunas por aí de olho num adulto frágil que não aguenta nem um tirinho"
16020-160200280 = "......Vou guardar bem esse conselho"
16020-160200290 = "Sensei, a Bravo Charlie chegou"
16020-160200300 = "Se tiver alguma coisa aí que não pode ser vista de jeito nenhum, é melhor esconder logo"
16020-160200310 = "Bravo Charlie......?"
16020-160200320 = "......Como assim?"
16020-160200330 = "Ah"
16020-160200340 = "Foi mal, foi mal"
16020-160200350 = "Usei código fonético sem querer"
16020-160200360 = "Bravo significa B e Charlie significa C,"
16020-160200370 = "É o código que a gente usa entre nós pra chamar uma \"Bean Counter\""
16020-160200380 = "Contadora de feijões?"
16020-160200390 = "É uma gíria pra alguém do financeiro que controla cada centavo na linha"
16020-160200400 = "Hummm"
16020-160200410 = "Ou seja......"
16020-160200420 = "A Diretora Financeira do Comitê Administrativo acabou de chegar aí"
16020-160200430 = "Começa por aí, poxa!"
16020-160200440 = "Desculpa mandar mensagem tão tarde"
16020-160200450 = "Ué, Sensei"
16020-160200460 = "Por acaso já tá dormindo?"
16020-160200470 = "Humm"
16020-160200480 = "Pelo visto tá mesmo. Foi mal, foi mal"
16020-160200490 = "Não era nada demais, nem esquenta. Boa noite!"
16020-160200500 = "Desculpa, acabei não vendo a mensagem na hora"
16020-160200510 = "O que houve?"
16020-160200520 = "Aconteceu alguma coisa? Tudo bem?"
16020-160200530 = "Otogi......?"
16020-160200540 = "Estou indo para aí agora mesmo!"
16020-160200550 = "Sensei, você tem tempo livre neste fim de semana?"
16020-160200560 = "Tenho sim, claro"
16020-160200570 = "Algum plano?"
16020-160200580 = "É que eu tô sem roupa de camuflagem pra próxima operação"
16020-160200590 = "Daí pensei em dar um pulo em Corgi Town pra comprar uma nova"
16020-160200600 = "Se estiver a fim, que tal ir comigo?"
16020-160200610 = "Claro, vamos sim"
16020-160200620 = "Dá pra comprar roupa de camuflagem num shopping?"
16020-160200630 = "Ora, mas é claro"
16020-160200640 = "Tendo dinheiro na mão, você encontra desde a mistura do jantar até ferramentas de hacking!"
16020-160200650 = "......Esse não era o slogan de outra loja?"
16020-160200660 = "Quando você vê aqueles tubos de concreto num terreno baldio ou aquele cantinho embaixo de uma ponte,"
16020-160200670 = "Não dá vontade de transformar numa base secreta só sua?"
16020-160200680 = "Antigamente eu pensava bastante nisso"
16020-160200690 = "Até hoje às vezes dá vontade de me cobrir com o edredom e ficar no meu próprio mundinho"
16020-160200700 = "......Isso já não é meio preocupante?"
16020-160200710 = "Bom, deixa quieto"
16020-160200720 = "No fim das contas todo mundo pensa parecido, né~"
16020-160200730 = "Quando eu era pequena, também vivia procurando bases secretas pra esconder meus jogos e mangás,"
16020-160200740 = "Só não imaginava que continuaria fazendo isso até no ensino médio"
16020-160200750 = "Você ainda monta bases secretas hoje em dia?"
16020-160200760 = "O seu quarto individual é muito pequeno?"
16020-160200770 = "Ah, não é bem por isso......"
16020-160200780 = "Nas nossas operações, é muito comum termos missões que viram a noite ou exigem mais de 24 horas de tocaia"
16020-160200790 = "Nessas horas, ter essas \"bases secretas\""
16020-160200800 = "Ajuda muito pra guardar munição e pertences pessoais"
16020-160200810 = "Tem todo aquele charme das aventuras de infância, achei bem legal"
16020-160200820 = "E tem algum lugar especial que você esteja de olho ultimamente?"
16020-160200830 = "Humm, acho que embaixo da sua mesa, Sensei~"
16020-160200840 = "Hã?"
16020-160200850 = "Que reação é essa?"
16020-160200860 = "Escuta aqui,"
16020-160200870 = "Tá pensando besteira, por acaso?\nO importante é o fato de ser embaixo de uma mesa!"
16020-160200880 = "Vai dizer que nunca entrou embaixo de uma mesa pra fazer de base secreta?"
16020-160200890 = "Aaah, era nesse sentido"
16020-160200900 = "Se for assim, pode usar de vez em quando"
16020-160200910 = "Humm, agradeço a generosidade, Sensei, mas"
16020-160200920 = "Já tem tanta aluna de olho naquele lugar que eu achei melhor desistir"
16020-160200930 = "Espera um segundo"
16020-160200940 = "Como assim?!"
