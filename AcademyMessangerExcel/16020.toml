[translation]
16020-160200010 = "Здравствуйте. Это Сенсей? Из Шале?"
16020-160200020 = "Да? Это я?"
16020-160200030 = "Я всегда хотела провести с вами немного времени наедине, Сенсей."
16020-160200040 = "Можете встретиться со мной сегодня вечером у дома 4 в переулке Лоствэй?"
16020-160200050 = "Если после восьми вас устроит..."
16020-160200060 = "Я найду время!"
16020-160200070 = "Нет-нет-нет!"
16020-160200080 = "Ну же, Сенсей. Это было подозрительно до ужаса."
16020-160200090 = "Хотя бы НЕМНОГО осторожности, когда незнакомец обращается к вам со странной просьбой."
16020-160200100 = "А если бы кто-то пытался выведать информацию о Сенсее из Шале?"
16020-160200110 = "...И что теперь?"
16020-160200120 = "А. Вы подумали, что милая девушка зовёт вас на свидание?"
16020-160200130 = "К сожалению, это была не кто иная, как я, Отоги!"
16020-160200140 = "Нет, я вообще так не думал."
16020-160200150 = "У меня сохранён твой контакт..."
16020-160200160 = "А."
16020-160200170 = "Упс. Я думала, это наш одноразовый телефон."
16020-160200180 = "Простите. Мне просто было скучно, и захотелось вас подколоть. Правда, исполнение вышло так себе."
16020-160200190 = "Не извиняйся! Я рад услышать одну из своих дорогих студентов!"
16020-160200200 = "Вас совсем не смущает разговаривать с незнакомцами?"
16020-160200210 = "Обычно неизвестные номера просто игнорируют."
16020-160200220 = "Это может быть рекламщик..."
16020-160200230 = "А может быть студент, которому нужна помощь."
16020-160200240 = "Понимаю вашу логику."
16020-160200250 = "Иногда приходится рискнуть, невзирая на последствия."
16020-160200260 = "Но всё же. Вам правда стоит быть осторожнее."
16020-160200270 = "В конце концов, не один человек охотится за слабым, хрупким взрослым, который не выдержит даже одной пули."
16020-160200280 = "...Я постараюсь."
16020-160200290 = "Сенсей, Браво Чарли на месте."
16020-160200300 = "Советую спрятать всё, что вы не хотите показывать властям."
16020-160200310 = "Браво Чарли...?"
16020-160200320 = "...Что ты имеешь в виду?"
16020-160200330 = "А."
16020-160200340 = "Прошу прощения."
16020-160200350 = "Я машинально перешла на кодовые обозначения."
16020-160200360 = "«Браво» и «Чарли» означают B и C в фонетическом алфавите."
16020-160200370 = "А мы используем их для обозначения Счётовода?"
16020-160200380 = "Счётовода?"
16020-160200390 = "Ага, так насмешливо называют финансистов."
16020-160200400 = "Так что..."
16020-160200410 = "Эм"
16020-160200420 = "Глава финансов Административного совета уже здесь."
16020-160200430 = "ТАК С ЭТОГО И НАДО БЫЛО НАЧИНАТЬ!"
16020-160200440 = "Сенсей"
16020-160200450 = "Простите, что пишу так поздно"
16020-160200460 = "Ты уснул?"
16020-160200470 = "Эм"
16020-160200480 = "Наверное, вы уже спите. Простите."
16020-160200490 = "Ничего важного, так что не переживайте. Спокойной ночи!"
16020-160200500 = "Прости, я не увидел твоё сообщение."
16020-160200510 = "Что происходит?"
16020-160200520 = "Уже так поздно. Что-то случилось?"
16020-160200530 = "Отоги...?"
16020-160200540 = "Уже иду!"
16020-160200550 = "Сенсей, вы свободны на этих выходных?"
16020-160200560 = "Да. На 100%."
16020-160200570 = "Тебе с чем-то помочь?"
16020-160200580 = "Эм, мне нужно раздобыть новый камуфляж для нашего следующего оружия."
16020-160200590 = "Поэтому я думала сходить за покупками в Корги-таун."
16020-160200600 = "Хотите со мной?"
16020-160200610 = "Уже иду."
16020-160200620 = "Но разве камуфляжную форму можно купить... в торговом центре?"
16020-160200630 = "Эм, а где ещё?"
16020-160200640 = "От сегодняшнего ужина до инструментов для взлома — в Корги-тауне найдётся всё. Были бы деньги!"
16020-160200650 = "...Разве это не слоган другого магазина?"
16020-160200660 = "Вы когда-нибудь видели трубу в парке или тень под мостом"
16020-160200670 = "и думали: «Вот идеальное тайное убежище!»?"
16020-160200680 = "М-м. Ага. В детстве часто."
16020-160200690 = "Иногда мне просто хочется спрятаться под одеялом."
16020-160200700 = "...Разве это не немного опасно?"
16020-160200710 = "В любом случае"
16020-160200720 = "люди и правда много всего придумывают."
16020-160200730 = "Раньше я постоянно находила новые тайники для приставок и манги."
16020-160200740 = "Но не думала, что эта привычка сохранится до старшей школы."
16020-160200750 = "А зачем тебе тайник сейчас?"
16020-160200760 = "Тебе не хватает личного пространства?"
16020-160200770 = "Нет, дело не в этом..."
16020-160200780 = "Иногда наблюдение во время заданий SRT длится весь день или даже всю ночь."
16020-160200790 = "В такие моменты мои тайные базы бывают очень полезны."
16020-160200800 = "Мне нужно держать в разных местах боеприпасы и личные вещи."
16020-160200810 = "Круто видеть, как твоя детская мечта становится реальностью."
16020-160200820 = "Есть новое место, которое ты присмотрела под базу?"
16020-160200830 = "Хм. Под вашим столом?"
16020-160200840 = "Э"
16020-160200850 = "Что это за реакция?"
16020-160200860 = "Нет."
16020-160200870 = "Только не думайте ничего странного. Главное, что это стол!"
16020-160200880 = "Знаете, как дети заворачиваются в одеяло, залезают под стол и объявляют это своей тайной базой?"
16020-160200890 = "А, так ты об этом."
16020-160200900 = "Для таких целей могу одолжить."
16020-160200910 = "Эм, спасибо,"
16020-160200920 = "но я уже давно отказалась от этой идеи. Слишком много других студентов на него претендовали."
16020-160200930 = "Погодите."
16020-160200940 = "Что ты имеешь в виду?!"
