[translation]
16020-160200010 = "Здравствуйте. Это правильный номер Сенсея из Шале?"
16020-160200020 = "Да, это так..."
16020-160200030 = "Я давно хотела встретиться с вами лично."
16020-160200040 = "Сегодня вечером вы не могли бы прийти на Четвёртую улицу Лост-Хайвея?"
16020-160200050 = "Если вам удобно после восьми..."
16020-160200060 = "Я смогу найти время."
16020-160200070 = "Эй, эй!"
16020-160200080 = "Чего ты так легко соглашаешься!"
16020-160200090 = "Надо с подозрением относиться к сообщениям от незнакомцев."
16020-160200100 = "Может, это плохой человек, который хочет заполучить информацию Шале?"
16020-160200110 = "...Хм?"
16020-160200120 = "Может, ты подумал, что это от милой девочки?"
16020-160200130 = "Увы! Это О-то-ги!"
16020-160200140 = "Нет, я с самого начала знал."
16020-160200150 = "У тебя же отображается имя О-то-ги."
16020-160200160 = "Ах"
16020-160200170 = "Это ведь не операционный телефон."
16020-160200180 = "Ой-ой, ошиблась."
16020-160200190 = "Сообщения от студентов всегда приветствуются."
16020-160200200 = "Сенсей, вы отвечаете на сообщения от незнакомцев?"
16020-160200210 = "Обычно все игнорируют."
16020-160200220 = "Большинство номеров — спам, но..."
16020-160200230 = "А вдруг это чрезвычайная ситуация?"
16020-160200240 = "Ну, наверное, тоже верно."
16020-160200250 = "Но на всякий случай"
16020-160200260 = "вам стоит быть более бдительным."
16020-160200270 = "Полно студентов, которые готовы воспользоваться слабым взрослым, который даже пули не выдержит."
16020-160200280 = "...Приму к сведению."
16020-160200290 = "Сенсей, пришёл Браво-Чарли."
16020-160200300 = "Лучше уберите то, что не должны видеть."
16020-160200310 = "Браво-Чарли...?"
16020-160200320 = "...Что это значит?"
16020-160200330 = "Ах"
16020-160200340 = "Прости-прости."
16020-160200350 = "Я случайно использовала голосовой код."
16020-160200360 = "Браво — это B, Чарли — это C."
16020-160200370 = "Среди нас так называют Bean Counter."
16020-160200380 = "Счетчик бобов?"
16020-160200390 = "В смысле, строгий финансовый контролёр."
16020-160200400 = "В общем, короче"
16020-160200410 = "то есть..."
16020-160200420 = "Пришёл начальник финансового отдела административного комитета."
16020-160200430 = "Ты бы предупредила заранее!"
16020-160200440 = "Прости за поздний час."
16020-160200450 = "Ой, Сенсей"
16020-160200460 = "Вы что, спите?"
16020-160200470 = "Хм-м"
16020-160200480 = "Наверное, да. Извини-извини."
16020-160200490 = "Ничего важного, не обращайте внимания. Спокойной ночи!"
16020-160200500 = "Простите. Я не смогла проверить."
16020-160200510 = "Что случилось?"
16020-160200520 = "Что-то произошло? Всё в порядке?"
16020-160200530 = "О-то-ги...?"
16020-160200540 = "Я сейчас приду!"
16020-160200550 = "Сенсей, у вас есть время на этих выходных?"
16020-160200560 = "Да, конечно."
16020-160200570 = "А что?"
16020-160200580 = "У меня нет камуфляжа для следующей операции."
16020-160200590 = "Подумала сходить в город Корги за новым."
16020-160200600 = "Если хотите, пойдёмте вместе?"
16020-160200610 = "Хорошо."
16020-160200620 = "Разве в торговом центре продают камуфляж?"
16020-160200630 = "Конечно."
16020-160200640 = "Были бы деньги — можно купить всё, от ужина до хакерских инструментов!"
16020-160200650 = "...Это же слоган другого магазина, нет?"
16020-160200660 = "Когда видишь трубу на пустыре или тень под мостом,"
16020-160200670 = "разве не хочется сделать там тайную базу?"
16020-160200680 = "В детстве я тоже такое думал."
16020-160200690 = "И сейчас, наверное, хочется залезть под одеяло и создать свой уголок."
16020-160200700 = "...Это не странно?"
16020-160200710 = "Ну ладно."
16020-160200720 = "Все об этом думают."
16020-160200730 = "В детстве я искала тайные места, чтобы спрятать игры и комиксы,"
16020-160200740 = "но чтобы в старшей школе до сих пор этим заниматься..."
16020-160200750 = "Ты сейчас тоже такие делаешь?"
16020-160200760 = "В личной комнате тесно?"
16020-160200770 = "А, нет, не в этом смысле..."
16020-160200780 = "В операциях часто приходится скрываться сутки и больше или работать всю ночь."
16020-160200790 = "В таких случаях такие «тайные базы»"
16020-160200800 = "помогают хранить боеприпасы и личные вещи."
16020-160200810 = "Как-то это похоже на детскую романтику, круто."
16020-160200820 = "Есть у тебя на примете особенное место?"
16020-160200830 = "Хм-м, может, под вашим столом?"
16020-160200840 = "Что?"
16020-160200850 = "Что за реакция?"
16020-160200860 = "Слушайте,"
16020-160200870 = "не думаете ли вы о чём-то пошлом?\nСтол — это важно!"
16020-160200880 = "Вы ведь прятались под столом, чтобы сделать там свою базу?"
16020-160200890 = "А, вот ты о чём."
16020-160200900 = "Тогда иногда можно."
16020-160200910 = "Хм-м, спасибо за доброту, но"
16020-160200920 = "там много студентов целится, так что я отказалась."
16020-160200930 = "Постой."
16020-160200940 = "Это что значит!?"