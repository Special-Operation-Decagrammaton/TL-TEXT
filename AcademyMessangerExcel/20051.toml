[translation]
20051-200510010 = "Сенсей, это Рейса!"
20051-200510020 = "Как лучше распорядиться карманными деньгами?"
20051-200510030 = "Хорошо устанавливать бюджет и тратить в рамках."
20051-200510040 = "Расставляйте приоритеты, чтобы избежать ненужных трат."
20051-200510050 = "Понятно!"
20051-200510060 = "То есть покупать только нужное!"
20051-200510070 = "Рейса, ты быстро схватываешь."
20051-200510080 = "Хе-хе"
20051-200510090 = "Тогда это ведь нужная вещь, правда?"
20051-200510100 = "«Магориба Термит Пинк Friendship Fusion Costume»"
20051-200510110 = "Продавалась за полцены!"
20051-200510120 = "За полцены!?!?!?"
20051-200510130 = "Фактически даром!! Это же выгодно!!!!"
20051-200510140 = "Да, правда! Хорошо, что я спросила у вас!"
20051-200510150 = "Магически умно~!"
20051-200510160 = "Сенсей, это Рейса."
20051-200510170 = "Ты добралась до дома?"
20051-200510180 = "Да, благодаря вам!"
20051-200510190 = "Я постираю куртку и верну!"
20051-200510200 = "Не торопись, можешь не спешить."
20051-200510210 = "Вы всегда так добры ко мне!"
20051-200510220 = "Спасибо, что сняли проклятие превращения!"
20051-200510230 = "Хе-хе-хе"
20051-200510240 = "66307366979"
20051-200510250 = "Рейса?"
20051-200510260 = "Ах"
20051-200510270 = "Ой"
20051-200510280 = "Простите! Я ошиблась!"
20051-200510290 = "Я отправила вам по Момотолку!"
20051-200510300 = "Номер брони на мероприятие в выходные"
20051-200510310 = "я хотела отправить себе..."
20051-200510320 = "О! Какое мероприятие?"
20051-200510330 = "Только для поклонников магических девочек."
20051-200510340 = "Там фанаты магических девочек собираются, продают товары, косплеят."
20051-200510350 = "Вот такое мероприятие!"
20051-200510360 = "Как член отряда самообороны, я должна пойти на патруль!"
20051-200510370 = "Я тоже хочу пойти!"
20051-200510380 = "Я ещё успею?"
20051-200510390 = "!!"
20051-200510400 = "Конечно!"
20051-200510410 = "Вы тоже идёте!"
20051-200510420 = "Не просто «иду»."
20051-200510430 = "Скажем так: я «вступаю в бой»!"
20051-200510440 = "Круто!!"
20051-200510450 = "Отлично!!"
20051-200510460 = "Я тоже приду с полным вооружением!!"
20051-200510470 = "Сенсей!"
20051-200510480 = "Сегодня было очень весело!"
20051-200510490 = "Благодаря тому, что вы меня поддержали,"
20051-200510500 = "я тоже смогла набраться смелости!"
20051-200510510 = "Ради тебя, Рейса, я готов на всё!"
20051-200510520 = "Хе-хе"
20051-200510530 = "Увидимся снова!"
20051-200510540 = "Сенсей"
20051-200510550 = "Что такое «дресс-код»?"
20051-200510560 = "Это, наверное, одеваться соответственно времени и месту."
20051-200510570 = "Значит,"
20051-200510580 = "одежда, которую носят для определённой цели,"
20051-200510590 = "тоже соответствует дресс-коду?"
20051-200510600 = "Наверное, да."
20051-200510610 = "Понятно."
20051-200510620 = "Я поняла..."
20051-200510630 = "?"
20051-200510640 = "Всё было идеально!"
20051-200510650 = "А в конце всё испортила!"
20051-200510660 = "Ничего страшного!"
20051-200510670 = "Ты была очень крута!"
20051-200510680 = "Но я хотела выступить безупречно."
20051-200510690 = "В следующий раз!"
20051-200510700 = "Я покажу супербезупречное выступление!"
20051-200510710 = "Сенсей, это Рейса."
20051-200510720 = "У вас остались те материалы, которые вы использовали, когда чинили молнию в прошлый раз?"
20051-200510730 = "Они ещё есть?"
20051-200510740 = "Конечно! А что?"
20051-200510750 = "Я снова совершила ту же ошибку."
20051-200510760 = "Наверное, я дура..."
20051-200510770 = "Неужели...?"
20051-200510780 = "Опять молния...?"
20051-200510790 = "..."
20051-200510800 = "Я приду в Шале..."
20051-200510810 = "Сенсей!"
20051-200510820 = "Благодаря вам опасность миновала!"
20051-200510830 = "Теперь молния больше не сломается!"
20051-200510840 = "Я непобедима!"
20051-200510850 = "О! Как ты это сделала?"
20051-200510860 = "Хе-хе, это просто."
20051-200510870 = "Я сняла молнию и заменила всё на пуговицы!"
20051-200510880 = "Но тогда ты не сможешь сама одеваться..."
20051-200510890 = "Э..."
20051-200510900 = "Что?"