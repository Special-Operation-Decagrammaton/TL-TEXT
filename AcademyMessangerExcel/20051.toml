[translation]
20051-200510010 = "Сенсей, это Рейса!"
20051-200510020 = "Как мне разумно тратить карманные деньги?"
20051-200510030 = "Тебе нужен план бюджета!"
20051-200510040 = "Определи свои приоритеты!"
20051-200510050 = "Понятно!"
20051-200510060 = "Тогда мне стоит покупать только то, что действительно нужно!"
20051-200510070 = "Быстро схватываешь, Рейса!"
20051-200510080 = "Муахаха!"
20051-200510090 = "Тогда это считается тем, что мне нужно?"
20051-200510100 = "«Костюм слияния дружбы Magicaliber Thermite Pink»"
20051-200510110 = "Есть объявление, где его продают за полцены!"
20051-200510120 = "За полцены?!"
20051-200510130 = "Разве это не невероятно выгодно?!"
20051-200510140 = "Я так рада, что спросила у вас совета!"
20051-200510150 = "Магически! Разумная трата!!"
20051-200510160 = "Сенсей, это Рейса."
20051-200510170 = "Ты нормально добралась домой?"
20051-200510180 = "Ага, я уже дома и переоделась!"
20051-200510190 = "Я постираю вашу куртку и верну её!"
20051-200510200 = "Не спеши!"
20051-200510210 = "Вы всегда такой добрый, Сенсей!"
20051-200510220 = "Спасибо, что развеяли моё проклятие трансформации!"
20051-200510230 = "Хи-хи-хи"
20051-200510240 = "66307366979"
20051-200510250 = "Что это?"
20051-200510260 = "А."
20051-200510270 = "А."
20051-200510280 = "Я не знала, что это наш чат с вами!"
20051-200510290 = "Я думала, что отправила это самой себе!!"
20051-200510300 = "На этих выходных будет мероприятие,"
20051-200510310 = "и я пыталась отправить себе номер бронирования."
20051-200510320 = "О, а что за мероприятие?"
20051-200510330 = "Ничего безумного! Это Конвент волшебниц."
20051-200510340 = "Мероприятие, посвящённое"
20051-200510350 = "волшебницам: мерч, косплей и всё такое!"
20051-200510360 = "Я подумала, что Отряду вигилантов стоит помочь с охраной!"
20051-200510370 = "О! Я тоже хочу пойти!"
20051-200510380 = "Билеты ещё остались?"
20051-200510390 = "!!"
20051-200510400 = "Конечно!"
20051-200510410 = "Ого! Вы правда тоже придёте?"
20051-200510420 = "Но важнее другое..."
20051-200510430 = "Я... нисхожу..."
20051-200510440 = "Ого."
20051-200510450 = "Звучит идеально!!"
20051-200510460 = "Я тоже выложусь на полную и наряжусь!"
20051-200510470 = "Сенсей!"
20051-200510480 = "Сегодня мне было так весело!"
20051-200510490 = "Спасибо, что поддержали меня"
20051-200510500 = "и подтолкнули попробовать новое!"
20051-200510510 = "Главное, чтобы ты была счастлива, Рейса!"
20051-200510520 = "Хи-хи."
20051-200510530 = "Тогда до следующего раза!"
20051-200510540 = "Сенсей."
20051-200510550 = "Как вы определяете «дресс-код»?"
20051-200510560 = "Наверное, это одежда, подходящая времени и месту?"
20051-200510570 = "Значит ли это,"
20051-200510580 = "что одежда, выполняющая определённую функцию,"
20051-200510590 = "тоже соответствует дресс-коду?"
20051-200510600 = "Наверное?"
20051-200510610 = "Понятно."
20051-200510620 = "Понятно..."
20051-200510630 = "?"
20051-200510640 = "Всё было идеально!!"
20051-200510650 = "Но в конце я облажалась!!"
20051-200510660 = "Совсем чуть-чуть!"
20051-200510670 = "Ты всё равно была крутой!"
20051-200510680 = "Я должна была быть идеальной!"
20051-200510690 = "В следующий раз точно!"
20051-200510700 = "Я обязательно буду суперидеальной!"
20051-200510710 = "Сенсей, это Рейса."
20051-200510720 = "У вас случайно ещё"
20051-200510730 = "остался инструмент, которым вы пользовались в прошлый раз?"
20051-200510740 = "Конечно. Что случилось?"
20051-200510750 = "Один раз обманули — стыд тому, кто обманул,"
20051-200510760 = "дважды — стыд уже мне..."
20051-200510770 = "Это... дежавю?"
20051-200510780 = "Молния сломалась?"
20051-200510790 = "..."
20051-200510800 = "Я приду в Шале..."
20051-200510810 = "Сенсей!"
20051-200510820 = "Я больше никогда не окажусь запертой в костюме!"
20051-200510830 = "Потому что молния больше не сломается!"
20051-200510840 = "Я непобедима!"
20051-200510850 = "О? И как ты это исправила?"
20051-200510860 = "Фуфу, всё просто."
20051-200510870 = "Я убрала молнию и заменила её пуговицами!"
20051-200510880 = "Но тогда ты не сможешь надеть его сама, разве нет?"
20051-200510890 = "Эм..."
20051-200510900 = "О??"
