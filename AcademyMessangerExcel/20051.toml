[translation]
20051-200510010 = "Sensei, aqui é a Reisa!"
20051-200510020 = "O que eu devo fazer para usar a minha mesada com sabedoria?"
20051-200510030 = "É bom definir um orçamento antes de gastar"
20051-200510040 = "Defina prioridades para evitar gastos desnecessários"
20051-200510050 = "Entendi!"
20051-200510060 = "Significa comprar apenas o que é realmente necessário, né?!"
20051-200510070 = "Você pega as coisas rápido, Reisa"
20051-200510080 = "Ehehe"
20051-200510090 = "Então isto aqui conta como algo essencial, não conta?"
20051-200510100 = "'Fantasia Fusão da Amizade da Thermite Pink de MahoRevo'"
20051-200510110 = "Apareceu à venda pela metade do preço de mercado!"
20051-200510120 = "Metade do preço de mercado?!?!?!"
20051-200510130 = "Tá praticamente de graça!! Compra logo!!!!"
20051-200510140 = "Não é?! Ainda bem que eu pedi o seu conselho, Sensei!"
20051-200510150 = "Isso foi Magicamente Inteligente~!"
20051-200510160 = "Sensei, aqui é a Reisa"
20051-200510170 = "Chegou em casa?"
20051-200510180 = "Sim, graças a você!"
20051-200510190 = "Vou lavar o seu casaco antes de devolver!"
20051-200510200 = "Não precisa ter pressa, viu?"
20051-200510210 = "Você é sempre tão gentil, Sensei!"
20051-200510220 = "Muito obrigada por quebrar a maldição da transformação!"
20051-200510230 = "Hehehe"
20051-200510240 = "66307366979"
20051-200510250 = "Reisa?"
20051-200510260 = "Hã?!"
20051-200510270 = "Ah!"
20051-200510280 = "Desculpe! Mandei errado!"
20051-200510290 = "Acabei enviando para o MomoTalk do Sensei!"
20051-200510300 = "Era o número de reserva do evento deste fim de semana,"
20051-200510310 = "eu ia mandar para mim mesma..."
20051-200510320 = "Opa! Que evento é esse?"
20051-200510330 = "É um evento exclusivo de Garotas Mágicas!"
20051-200510340 = "Os fãs de histórias de garotas mágicas se reúnem para vender produtos e fazer cosplay..."
20051-200510350 = "É um evento desse tipo!"
20051-200510360 = "Como membro do Corpo de Vigilantes, pensei que era meu dever ir até lá patrulhar!"
20051-200510370 = "Eu também quero ir!"
20051-200510380 = "Será que ainda dá tempo de conseguir ingresso?"
20051-200510390 = "!!"
20051-200510400 = "Claro que dá!"
20051-200510410 = "Você também vai, Sensei?!"
20051-200510420 = "Não vamos apenas 'ir'."
20051-200510430 = "Vamos 'entrar em campo de batalha'!"
20051-200510440 = "Que demais!!"
20051-200510450 = "Adorei!!"
20051-200510460 = "Eu também irei com equipamento completo de combate!!"
20051-200510470 = "Sensei!"
20051-200510480 = "Hoje foi muito divertido!"
20051-200510490 = "Graças ao seu incentivo, Sensei,"
20051-200510500 = "eu também consegui criar coragem!"
20051-200510510 = "Pela Reisa, eu faço qualquer coisa!"
20051-200510520 = "Ehehe"
20051-200510530 = "Até a próxima!"
20051-200510540 = "Sensei"
20051-200510550 = "O que exatamente é um 'dress code'?"
20051-200510560 = "É vestir roupas adequadas para a ocasião e o lugar, eu acho"
20051-200510570 = "Então isso quer dizer que"
20051-200510580 = "uma roupa vestida para cumprir um propósito específico"
20051-200510590 = "também está seguindo o dress code?"
20051-200510600 = "Acho que sim"
20051-200510610 = "Entendo"
20051-200510620 = "Compreendi..."
20051-200510630 = "?"
20051-200510640 = "Estava indo tudo tão perfeito!"
20051-200510650 = "Mas estraguei tudo bem no finalzinho!"
20051-200510660 = "Aquilo não foi nada, fica tranquila!"
20051-200510670 = "Você mandou superbem!"
20051-200510680 = "Mas eu queria ter tido uma atuação perfeita!"
20051-200510690 = "Da próxima vez, sim!"
20051-200510700 = "Vou mostrar uma atuação superperfeita!"
20051-200510710 = "Sensei, aqui é a Reisa"
20051-200510720 = "Aquele kit de costura que você usou para consertar o meu zíper outro dia..."
20051-200510730 = "Você ainda tem aí?"
20051-200510740 = "Claro! O que aconteceu?"
20051-200510750 = "Repetir exatamente o mesmo erro de antes..."
20051-200510760 = "Eu sou mesmo uma boba, né..."
20051-200510770 = "Não me diga que...?"
20051-200510780 = "O zíper emperrou de novo...?"
20051-200510790 = "..."
20051-200510800 = "Estou indo até a Schale..."
20051-200510810 = "Sensei!"
20051-200510820 = "Graças a você, a crise foi superada!"
20051-200510830 = "Agora o zíper nunca mais vai quebrar!"
20051-200510840 = "Eu sou invencível!"
20051-200510850 = "Opa! Como você resolveu?"
20051-200510860 = "Fufu, foi muito simples"
20051-200510870 = "Tirei o zíper fora e troquei tudo por botões!"
20051-200510880 = "Mas desse jeito você não vai conseguir vestir sozinha..."
20051-200510890 = "Hã..."
20051-200510900 = "Quê?"
