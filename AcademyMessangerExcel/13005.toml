[translation]
13005-1039 = "Сенсей, вы когда-нибудь переживали из-за своей внешности?"
13005-1040 = "С чего вдруг?"
13005-1041 = "...Как вы знаете, меня часто называют страшной с первого взгляда."
13005-1042 = "И часто пристают разные подозрительные типы."
13005-1043 = "И выгоды от этого... почти никакой."
13005-1044 = "Сенсей, я наконец достала то, что вы просили найти."
13005-1045 = "Ура, спасибо!"
13005-1046 = "По такой реакции видно, что вы очень искали. Хорошо, что помогла."
13005-1047 = "Если у вас будет время сегодня днём, зайдите в офис Бенрии и заберите."
13005-1048 = "Как только закончу дела в Шале, сразу приду."
13005-1049 = "Сенсей, у вас есть любимый жанр музыки?"
13005-1050 = "Наверное, поп."
13005-1051 = "Наверное, классика."
13005-1052 = "Понятно, ну, вам идёт."
13005-1053 = "А Кайоко что любит?"
13005-1054 = "Я... ну, обычное. Наверное, у нас вкусы близки."
13005-1055 = "Вы дослушали тот второй альбом?"
13005-1056 = "Black Death Poison, разве не круто?"
13005-1057 = "...По ощущениям — как удар по мозгам!"
13005-1058 = "...Очень авангардно."
13005-1059 = "Как и ожидалось, я знал, что Сенсей поймёт."
13005-1060 = "Второй альбом по сравнению с первым стал более понятным по тексту, но"
13005-1061 = "звук стал ещё более жёстким, так что многим нравится именно он."
13005-1062 = "Если понравится, в следующий раз дам послушать третий."
13005-1063 = "Я подумаю..."
13005-1064 = "По прогнозу погоды, сегодня днём будет дождь."
13005-1065 = "Не забудьте зонт."
13005-1066 = "Говорят, в Тринити есть огромная библиотека, где собраны все книги мира..."
13005-1067 = "Интересно, есть ли где-нибудь магазин пластинок, где собраны все записи мира?"
13005-1068 = "Как насчёт The Record Building в торговом квартале?"
13005-1069 = "Они, конечно, не со всего мира, но... ассортимент у них неплохой."
13005-1070 = "Там собраны пластинки разных жанров."
13005-1071 = "Я часто туда захожу в выходные."