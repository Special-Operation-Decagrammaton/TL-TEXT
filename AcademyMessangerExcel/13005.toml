[translation]
13005-1039 = "Вы когда-нибудь переживали о том, какое впечатление производите на других?"
13005-1040 = "С чего вдруг такой вопрос?"
13005-1041 = "Ну... Наверняка вы заметили, что я выгляжу немного пугающе."
13005-1042 = "Думаю, поэтому я постоянно ввязываюсь в драки."
13005-1043 = "Плохое первое впечатление редко приводит к чему-то хорошему."
13005-1044 = "Сенсей. Заказанный вами товар только что прибыл."
13005-1045 = "О, наконец-то!"
13005-1046 = "Хи-хи! По вашей реакции видно, что вы очень его ждали."
13005-1047 = "Если сегодня после обеда будет время, зайдите в офис «Решателей проблем 68» и заберите."
13005-1048 = "Приду, как только закончу дела в Шале."
13005-1049 = "Есть какой-то музыкальный жанр, который вы предпочитаете?"
13005-1050 = "Наверное, поп."
13005-1051 = "Может, классику?"
13005-1052 = "Понятно. Хороший выбор."
13005-1053 = "А какую музыку любишь ты, Каёко?"
13005-1054 = "Ну... Я слушаю обычную музыку, так что, думаю, вкусы у нас примерно одинаковые."
13005-1055 = "Сенсей, вы дослушали второй альбом, который я советовала?"
13005-1056 = "Как вам? Разве Black Death Poison не лучшие?"
13005-1057 = "Было довольно... впечатляюще."
13005-1058 = "Было довольно... авангардно."
13005-1059 = "Рада, что вы понимаете ценность их музыки."
13005-1060 = "Тексты во втором альбоме гораздо спокойнее, чем в первом,"
13005-1061 = "но звук очень тяжёлый, поэтому металлисты обычно предпочитают второй альбом."
13005-1062 = "Если вам понравился второй альбом Black Death Poison, могу одолжить третий."
13005-1063 = "Думаю, пока с меня хватит тяжёлого металла..."
13005-1064 = "Сенсей, говорят, сегодня после обеда будет дождь."
13005-1065 = "Не забудьте зонт, когда будете выходить."
13005-1066 = "Я слышала, в Тринити есть огромная библиотека, где хранятся все книги мира..."
13005-1067 = "А есть музыкальный магазин, где есть все альбомы мира?"
13005-1068 = "А как насчёт Дома пластинок в Кивотосе? Того, что в торговом районе?"
13005-1069 = "Не знаю, есть ли там все альбомы мира, но их очень много."
13005-1070 = "Там есть альбомы самых разных жанров."
13005-1071 = "По выходным я часто хожу туда слушать музыку."
