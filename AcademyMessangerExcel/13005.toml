[translation]
13005-1039 = "Sensei, você já teve alguma insegurança com a sua própria aparência?"
13005-1040 = "Por que essa pergunta do nada?"
13005-1041 = "...Como você já sabe, Sensei, vivem dizendo que eu passo uma primeira impressão assustadora"
13005-1042 = "Por causa disso, muita gente estranha acaba vindo puxar briga comigo"
13005-1043 = "E não é como se essa cara tivesse me trazido alguma vantagem... quase nunca, na verdade"
13005-1044 = "Sensei, finalmente consegui colocar as mãos naquilo que você tinha me pedido para procurar"
13005-1045 = "Boa, muito obrigado!"
13005-1046 = "Pela sua reação, estava procurando isso há um bom tempo, né. Que bom então"
13005-1047 = "Hoje à tarde, se tiver um tempinho, passa aqui no escritório do Faz-Tudo para buscar"
13005-1048 = "Assim que eu terminar o trabalho na Schale, corro para aí"
13005-1049 = "Sensei, você tem algum estilo de música favorito?"
13005-1050 = "Acho que pop"
13005-1051 = "Acho que música clássica"
13005-1052 = "Entendi, bom, acho que combina com você"
13005-1053 = "E você, Kayoko, que tipo de música curte?"
13005-1054 = "Eu...? Ah, coisas normais. Acho que meu gosto é bem parecido com o seu, Sensei"
13005-1055 = "E aí, já terminou de ouvir aquele 2º álbum?"
13005-1056 = "Black Death Poison não é simplesmente demais?"
13005-1057 = "...Foi como levar uma pancada direto no cérebro!"
13005-1058 = "...Achei uma pegada bem vanguardista"
13005-1059 = "Sabia que você ia entender, Sensei"
13005-1060 = "No 2º álbum as letras ficaram mais fáceis de entender em comparação ao 1º,"
13005-1061 = "mas o som ficou ainda mais pesado e agressivo, então muita gente prefere esse aqui"
13005-1062 = "Se você curtiu, na próxima te empresto o 3º álbum"
13005-1063 = "Vou pensar com carinho..."
13005-1064 = "A previsão do tempo disse que vai chover hoje à tarde"
13005-1065 = "Não esquece de levar o guarda-chuva, hein"
13005-1066 = "Dizem que lá na Trinity existe uma biblioteca gigantesca que reúne todos os livros do mundo..."
13005-1067 = "Será que não existe em algum lugar uma loja de discos que reúna todos os vinis do mundo?"
13005-1068 = "E aquele prédio \"The Record Building\" lá no distrito comercial?"
13005-1069 = "Lá também não tem discos do mundo inteiro... mas o acervo deles realmente não é nada mau"
13005-1070 = "Como eles reúnem discos de tudo quanto é gênero,"
13005-1071 = "costumo passar bastante lá nos meus dias de folga"
