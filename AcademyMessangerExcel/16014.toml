[translation]
16014-160140010 = "СенсЕй"
16014-160140020 = "Сенсей."
16014-160140030 = "ПрИВеТ"
16014-160140040 = "Это Ибуки!!"
16014-160140050 = "Привет, Ибуки. Как дела?"
16014-160140060 = "У Ибуки всё отЛИчно!"
16014-160140070 = "Как вы, Сенсей?"
16014-160140080 = "У меня тоже всё отлично."
16014-160140090 = "Это здорово!"
16014-160140100 = "Можно Ибуки прийти?"
16014-160140110 = "Конечно."
16014-160140120 = "Моим студентам я всегда рад, Ибуки."
16014-160140130 = "СенсейСенсей"
16014-160140140 = "Это Ибукии"
16014-160140150 = "Это Ибуки!"
16014-160140160 = "Можно Ибуки прийти поиграть в Шале?"
16014-160140170 = "Сегодня Ибуки не представительница учеников, но Ибуки хочет снова поиграть!"
16014-160140180 = "Конечно. Я буду ждать."
16014-160140190 = "Только не беги по коридорам по пути сюда, хорошо?"
16014-160140200 = "Ага! Спасибо! Скоро увидимся, СенСей!"
16014-160140210 = "Сенсей."
16014-160140220 = "Сегодня было так весело!"
16014-160140230 = "Ибуки играла в салки и прЯтки с Сенсеем в парке Шале..."
16014-160140240 = "Ты не устала от всей этой беготни, Ибуки?"
16014-160140250 = "Нет, совсем нет!"
16014-160140260 = "А почему? Ты устал, Сенсей?"
16014-160140270 = "К-конечно нет."
16014-160140280 = "Тогда Ибуки не может дождаться, когда снова поиграет в парке Шале!"
16014-160140290 = "Давай скоро снова поиграем, Сенсей!"
16014-160140300 = "СенсЕй"
16014-160140310 = "Сенсей"
16014-160140320 = "Ибуки интересно!"
16014-160140330 = "Что такое, Ибуки?"
16014-160140340 = "Ты ведь всегда работаешь, когда Ибуки приходит в Шале, да?"
16014-160140350 = "Работа правда настолько весёлая?"
16014-160140360 = "Н-наверное, со стороны так и выглядит..."
16014-160140370 = "Она... весёлая... В большинстве случаев..."
16014-160140380 = "Но что именно в моей работе тебя так заинтересовало?"
16014-160140390 = "Ну..."
16014-160140400 = "Ибуки не очень хорошо печатает,"
16014-160140410 = "поэтому Ибуки расскажет лично!"
16014-160140420 = "Сенсей!!"
16014-160140430 = "Ты сейчас занят?"
16014-160140440 = "Нет, сейчас нет."
16014-160140450 = "У меня только что освободилось расписание."
16014-160140460 = "Это здорово!"
16014-160140470 = "Ибуки никак не может перестать думать обо всех работах, которые мы попробовали, Сенсей."
16014-160140480 = "Чем Ибуки хочет заниматься..."
16014-160140490 = "Что Ибуки любит больше всего..."
16014-160140500 = "Поэтому"
16014-160140510 = "Ибуки решила вручить тебе приглашение!"
16014-160140520 = "Приглашение?"
16014-160140530 = "Ага!"
16014-160140540 = "Прямо сейчас приходи в комнату отдыха Общества Пандемониума!"
