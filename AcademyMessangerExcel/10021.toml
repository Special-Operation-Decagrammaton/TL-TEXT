[translation]
10021-10021010 = "Sensei, preciso confirmar uma coisa com urgência."
10021-10021020 = "Onde você está agora?"
10021-10021030 = "O que houve?"
10021-10021040 = "Aconteceu alguma coisa?"
10021-10021050 = "Não, não houve nenhum problema em especial."
10021-10021060 = "Porém, pensando melhor, esta região também não é totalmente segura."
10021-10021070 = "Eu preciso proteger você, Sensei."
10021-10021080 = "Afinal, você é o meu alvo de escolta."
10021-10021090 = "Assim me sinto muito mais seguro..."
10021-10021100 = "Será que é tão perigoso assim...?"
10021-10021110 = "...Ufa."
10021-10021120 = "Então, onde você está agora?"
10021-10021130 = "Esqueça o que eu disse agora há pouco..."
10021-10021140 = "...Mas"
10021-10021150 = "de fato, talvez seja bom eu relaxar um pouco mais."
10021-10021160 = "Graças a você, acho que vou conseguir aproveitar um pouco."
10021-10021170 = "Bom, entro em contato novamente mais tarde."
10021-10021180 = "Sensei."
10021-10021190 = "Você tem um tempinho agora?"
10021-10021200 = "Não sei bem como explicar, mas..."
10021-10021210 = "Na verdade,"
10021-10021220 = "preciso da sua ajuda, Sensei."
10021-10021230 = "Uma emergência daquelas?!"
10021-10021240 = "Tô indo agora mesmo! Onde você tá?"
10021-10021250 = "Vou enviar a minha localização em seguida."
10021-10021260 = "Agradeceria se pudesse vir o quanto antes."
10021-10021270 = "Ah, mas não precisa correr riscos no caminho."
10021-10021280 = "Chego aí rapidinho, me espera."
10021-10021290 = "Obrigada pelo lanche de agora há pouco, Sensei."
10021-10021300 = "Como eu disse antes, não vou deixar isso ficar só nas palavras."
10021-10021310 = "Um dia retribuirei essa dívida sem falta."
10021-10021320 = "Combinado, vou esperar ansioso."
10021-10021330 = "Falando assim até parece promessa de vingança..."
10021-10021340 = "Corresponderei às suas expectativas."
10021-10021350 = "......"
10021-10021360 = "Não é nada disso... Você tem cuidado tão bem de mim."
10021-10021370 = "Até mais, Sensei."
10021-10021380 = "Sensei."
10021-10021390 = "...Sinto que está faltando alguma coisa."
10021-10021400 = "Minha intuição tática está me dizendo isso."
10021-10021410 = "Que certamente ainda há algo para fazermos neste verão."
10021-10021420 = "Intuição tática...?"
10021-10021430 = "Quer dizer que ficou faltando curtir alguma coisa?"
10021-10021440 = "Precisamos de uma reunião estratégica sobre o assunto."
10021-10021450 = "Não nos resta muito tempo."
10021-10021460 = "A diferença entre \"tática\" e \"estratégia\" é sempre meio confusa, né..."
10021-10021470 = "De todo modo, estou indo até você agora mesmo."
10021-10021480 = "Onde você está?"
10021-10021490 = "Sensei, esqueci de avisar uma coisa:"
10021-10021500 = "Tudo o que aconteceu hoje, bem como o que eu disse hoje,"
10021-10021510 = "é informação estritamente confidencial. Não conte a ninguém."
10021-10021520 = "Entendido?"
10021-10021530 = "É mesmo...? Bom, entendido."
10021-10021540 = "Não se esqueça."
10021-10021550 = "Se esse segredo vazar, o culpado será, sem sombra de dúvida, você, Sensei."
10021-10021560 = "......"
10021-10021570 = "Seria um problema se qualquer outra pessoa além de você soubesse."
10021-10021580 = "Sensei."
10021-10021590 = "Você tem tempo agora?"
10021-10021600 = "Tenho sim, o que houve?"
10021-10021610 = "Precisa que eu vá aí te ajudar?"
10021-10021620 = "Não."
10021-10021630 = "Não é nada grave."
10021-10021640 = "Se estiver ocupado, não precisa se forçar a vir."
10021-10021650 = "Imagina, tô indo praí agora."
10021-10021660 = "Já que a Azusa me chamou, vou com o maior prazer."
10021-10021670 = "......"
10021-10021680 = "Obrigada, Sensei."
10021-10021690 = "Então estarei esperando."
10021-10021700 = "Desculpe por tê-lo chamado tão tarde da noite, e obrigada por ter vindo."
10021-10021710 = "Sou de hábitos noturnos, então tá tranquilo."
10021-10021720 = "Imagina, pode me chamar a qualquer hora."
10021-10021730 = "...Entendo."
10021-10021740 = "Então até mais."
10021-10021750 = "Obrigada, Sensei."
10021-10021760 = "Hum, não apenas pelo que fez hoje... mas por tudo."
