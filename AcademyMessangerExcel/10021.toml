[translation]
10021-10021010 = "Я хочу кое-что проверить, Сенсей."
10021-10021020 = "Где вы сейчас находитесь?"
10021-10021030 = "Где я? Зачем?"
10021-10021040 = "Есть проблема?"
10021-10021050 = "Ничего особенно тревожного."
10021-10021060 = "После дополнительной оценки я решила, что этот пляж тоже небезопасен."
10021-10021070 = "Лучше всего, если я буду охранять вас лично."
10021-10021080 = "В конце концов, вы приоритетный объект."
10021-10021090 = "Мне нужна защита?"
10021-10021100 = "Не думаю, что тебе ОБЯЗАТЕЛЬНО это делать..."
10021-10021110 = "..."
10021-10021120 = "Где вы сейчас?"
10021-10021130 = "Забудьте о том, что только что произошло."
10021-10021140 = "По крайней мере, по сравнению с тем, чего я ожидала..."
10021-10021150 = "это место может быть действительно безопасным."
10021-10021160 = "Тогда мы сможем оставаться здесь без особых опасений."
10021-10021170 = "Поговорим в следующий раз, Сенсей."
10021-10021180 = "Хм."
10021-10021190 = "Вы сейчас свободны, Сенсей?"
10021-10021200 = "Мне бы сейчас"
10021-10021210 = "не помешала"
10021-10021220 = "поддержка."
10021-10021230 = "Тебе нужна поддержка? Ты в бою?!"
10021-10021240 = "Ты в порядке? Где ты?!"
10021-10021250 = "Да."
10021-10021260 = "Я отправлю подробности."
10021-10021270 = "Чем раньше, тем лучше, но не спешите."
10021-10021280 = "Уже иду."
10021-10021290 = "Спасибо за угощение, Сенсей."
10021-10021300 = "И, как я говорила, я не благодарю людей без причины."
10021-10021310 = "Когда-нибудь я отплачу вам."
10021-10021320 = "Хорошо, буду ждать."
10021-10021330 = "Когда ты так говоришь, звучит так, будто ты задумала месть."
10021-10021340 = "Да. Хорошо."
10021-10021350 = "..."
10021-10021360 = "Всё не так."
10021-10021370 = "Поговорим позже, Сенсей."
10021-10021380 = "Сенсей."
10021-10021390 = "Если подумать, этого недостаточно."
10021-10021400 = "Моя тактическая интуиция подсказывает,"
10021-10021410 = "что здесь есть что-то ещё."
10021-10021420 = "Тактическая интуиция? С чего вдруг?"
10021-10021430 = "Похоже, ты всё ещё не удовлетворена, да?"
10021-10021440 = "Да."
10021-10021450 = "Мне нужно с кем-то обсудить стратегию."
10021-10021460 = "Разве ты только что не сказала «тактическая»?"
10021-10021470 = "Куда мне прийти?"
10021-10021480 = "Я приду туда, где вы."
10021-10021490 = "Я забыла кое-что вам сказать, Сенсей."
10021-10021500 = "Всё, что сегодня произошло, всё, что я сказала..."
10021-10021510 = "вы должны держать в секрете от остальных."
10021-10021520 = "Понятно?"
10021-10021530 = "Теперь это что-то секретное?"
10021-10021540 = "Разумеется."
10021-10021550 = "Совершенно секретно. Если это всплывёт, я буду знать, что это вы."
10021-10021560 = "..."
10021-10021570 = "Это было только для вас, Сенсей."
10021-10021580 = "Сенсей."
10021-10021590 = "Можете уделить немного времени?"
10021-10021600 = "Уделить время? Что-то случилось?"
10021-10021610 = "Тебе снова нужна поддержка?"
10021-10021620 = "Нет."
10021-10021630 = "Нет."
10021-10021640 = "Если вы заняты, можете не приходить."
10021-10021650 = "Всё нормально. Я свободен."
10021-10021660 = "Если я тебе нужна, Азуса, я приду."
10021-10021670 = "..."
10021-10021680 = "Спасибо, Сенсей."
10021-10021690 = "Буду ждать."
10021-10021700 = "Прошу прощения, если я слишком поздно пишу."
10021-10021710 = "Всё нормально. Я всё равно сова."
10021-10021720 = "Не переживай."
10021-10021730 = "А."
10021-10021740 = "Тогда я перестану об этом беспокоиться."
10021-10021750 = "Спасибо, Сенсей."
10021-10021760 = "За всё."
