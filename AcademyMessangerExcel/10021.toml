[translation]
10021-10021010 = "Сенсей, мне срочно нужно кое-что уточнить."
10021-10021020 = "Где ты сейчас?"
10021-10021030 = "Что случилось?"
10021-10021040 = "Что-то произошло?"
10021-10021050 = "Нет, ничего особенного не случилось."
10021-10021060 = "Просто если подумать, здесь тоже не так уж безопасно."
10021-10021070 = "Я должна защищать тебя."
10021-10021080 = "Ведь ты — мой объект охраны."
10021-10021090 = "Обнадёживает..."
10021-10021100 = "Неужели так опасно...?"
10021-10021110 = "...Фу-ух."
10021-10021120 = "Так где ты сейчас?"
10021-10021130 = "Забудь, что я сказала..."
10021-10021140 = "...Но всё же."
10021-10021150 = "Наверное, я действительно могу немного расслабиться."
10021-10021160 = "Благодаря тебе, я, кажется, смогу немного повеселиться."
10021-10021170 = "Тогда я свяжусь позже."
10021-10021180 = "Сенсей."
10021-10021190 = "У тебя есть время сейчас?"
10021-10021200 = "Как бы сказать..."
10021-10021210 = "На самом деле..."
10021-10021220 = "мне нужна твоя помощь."
10021-10021230 = "Неужели чрезвычайная ситуация!?"
10021-10021240 = "Я сейчас приду, где ты?"
10021-10021250 = "Я скину координаты позже."
10021-10021260 = "Буду рада, если ты сможешь прийти как можно скорее."
10021-10021270 = "А, но не переусердствуй."
10021-10021280 = "Я поспешу, жди."
10021-10021290 = "Спасибо за угощение, Сенсей."
10021-10021300 = "Как я и сказала, я не отделываюсь одними словами."
10021-10021310 = "Я обязательно отплачу тебе когда-нибудь."
10021-10021320 = "Ага, буду ждать."
10021-10021330 = "Звучит так, будто ты собираешься мстить..."
10021-10021340 = "Я оправдаю твои ожидания."
10021-10021350 = "..."
10021-10021360 = "Не в этом дело... Ты столько для меня делаешь."
10021-10021370 = "Тогда до встречи, Сенсей."
10021-10021380 = "Сенсей."
10021-10021390 = "...Мне кажется, чего-то не хватает."
10021-10021400 = "Моя тактическая интуиция подсказывает мне это."
10021-10021410 = "Я уверена, что этим летом ещё что-то произойдёт."
10021-10021420 = "Тактическая интуиция...?"
10021-10021430 = "То есть что-то ещё осталось недоделанным?"
10021-10021440 = "Нужно стратегическое обсуждение этого вопроса."
10021-10021450 = "У нас мало времени."
10021-10021460 = "Слова «тактика» и «стратегия» — они же такие запутанные..."
10021-10021470 = "Короче, я сейчас приду к тебе."
10021-10021480 = "Где ты?"
10021-10021490 = "Сенсей, я забыла кое-что сказать."
10021-10021500 = "То, что произошло сегодня, и всё, что я сказала,"
10021-10021510 = "— это секретная информация, никому не рассказывай."
10021-10021520 = "Понял?"
10021-10021530 = "Правда...? Ну, я понял."
10021-10021540 = "Не забывай."
10021-10021550 = "Если секрет раскроется, виноват будешь точно ты."
10021-10021560 = "..."
10021-10021570 = "Если узнает кто-то кроме тебя, будут проблемы."
10021-10021580 = "Сенсей."
10021-10021590 = "У тебя есть время?"
10021-10021600 = "Да, всё в порядке. Что случилось?"
10021-10021610 = "Мне нужно прийти на помощь?"
10021-10021620 = "Нет."
10021-10021630 = "Ничего серьёзного."
10021-10021640 = "Если ты занят, не обязательно приходить."
10021-10021650 = "Нет, я сейчас приду."
10021-10021660 = "Раз Азуса позвала, я с радостью."
10021-10021670 = "..."
10021-10021680 = "Спасибо, Сенсей."
10021-10021690 = "Тогда я буду ждать."
10021-10021700 = "Прости, что позвала так поздно. Спасибо, что пришёл."
10021-10021710 = "Я сова, так что всё в порядке."
10021-10021720 = "Я всегда рад тебя видеть."
10021-10021730 = "...Понятно."
10021-10021740 = "Тогда до встречи."
10021-10021750 = "Спасибо, Сенсей."
10021-10021760 = "За сегодня... и за всё остальное тоже."
