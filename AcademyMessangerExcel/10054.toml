[translation]
10054-100540010 = "Здравствуйте, Сенсей, это Мари."
10054-100540020 = "Простите за внезапность, но у меня есть дело, о котором хотела бы посоветоваться..."
10054-100540030 = "Одной мне трудно справиться..."
10054-100540040 = "Конечно, что случилось?"
10054-100540050 = "Что-то произошло?"
10054-100540060 = "Ах... ну..."
10054-100540070 = "Это не настолько серьёзно..."
10054-100540080 = "То есть... это не то чтобы связано с опасностью..."
10054-100540090 = "Но мне очень приятна ваша забота. Спасибо."
10054-100540100 = "Тогда, сразу... могу я попросить вас уделить время завтра утром?"
10054-100540110 = "Я буду ждать в соборе."
10054-100540120 = "Я знаю, вы, наверное, очень заняты, но..."
10054-100540130 = "Я молюсь, чтобы мы встретились и в день Праздника Света."
10054-100540140 = "Желаю вам прекрасного дня."
10054-100540150 = "Сенсей..."
10054-100540160 = "Как вы сегодня себя чувствуете?"
10054-100540170 = "Я написала, чтобы хотя бы поздороваться..."
10054-100540180 = "Я молюсь, чтобы вы были счастливы."
10054-100540190 = "???"
10054-100540200 = "Мари, что случилось?"
10054-100540210 = "...Мари?"
10054-100540220 = "..."
10054-100540230 = "Сенсей...?"
10054-100540240 = "Ну, ничего не случилось? Когда вы уходили, мне показалось, я услышала какой-то глухой звук..."
10054-100540250 = "Наверное, показалось?"
10054-100540260 = "Я примерно так и думала, так что всё в порядке, не обращайте внимания."
10054-100540270 = "???"
10054-100540280 = "...П-понятно."
10054-100540290 = "Я ещё напишу."
10054-100540300 = "Сенсей... может, я могу что-то для вас сделать?"
10054-100540310 = "Благодаря вам я смогла вырасти во время Праздника Света."
10054-100540320 = "Я хотела отблагодарить, но не знала как..."
10054-100540330 = "Спасибо не нужно. Если ты здорова, этого достаточно."
10054-100540340 = "Я рад, что видел тебя счастливой."
10054-100540350 = "Аха-ха..."
10054-100540360 = "Как всегда, вы непобедимы, Сенсей."
10054-100540370 = "...Поняла."
10054-100540380 = "Буду ждать, когда смогу вам помочь."
10054-100540390 = "Но пока... сегодня..."
10054-100540400 = "Я молюсь, чтобы ваш день был мирным."
10054-100540410 = "Э-э, Сенсей."
10054-100540420 = "Если вы не против..."
10054-100540430 = "я бы хотела, чтобы в следующий раз вы пришли в спортивной одежде."
10054-100540440 = "В парке прохладно и приятно, и это отличное место для занятий спортом..."
10054-100540450 = "Так что, если вам будет удобно,"
10054-100540460 = "ну..."
10054-100540470 = "я буду рада, если мы сможем заняться спортом вместе..."
10054-100540480 = "Тогда... до встречи."
