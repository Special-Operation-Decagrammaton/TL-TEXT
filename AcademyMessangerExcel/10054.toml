[translation]
10054-100540010 = "Здравствуйте, Сенсей! Это Мари."
10054-100540020 = "Если не затруднит, могу я попросить тебя о консультации?"
10054-100540030 = "Есть кое-что, о чём я хотела бы спросить совета."
10054-100540040 = "Конечно. Что тебя беспокоит?"
10054-100540050 = "Надеюсь, ничего серьёзного?"
10054-100540060 = "О!"
10054-100540070 = "Нет, ничего плохого."
10054-100540080 = "Ничего серьёзного, правда. Пожалуйста, не беспокойся обо мне."
10054-100540090 = "И всё же должна признать... Меня тронула твоя забота. Большое спасибо."
10054-100540100 = "В любом случае, скоро увидимся."
10054-100540110 = "Ещё раз спасибо, Сенсей."
10054-100540120 = "Я знаю, что ты, скорее всего, очень занят, Сенсей..."
10054-100540130 = "Но если найдёшь минутку, я хотела бы увидеть тебя во время спортивного праздника."
10054-100540140 = "В любом случае... благословенного тебе дня, Сенсей!"
10054-100540150 = "Сенсей..."
10054-100540160 = "Как твой день? Надеюсь, всё хорошо."
10054-100540170 = "Мне просто пришло в голову заранее поздороваться. Не хочу потом о чём-нибудь жалеть."
10054-100540180 = "Надеюсь, оставшееся время принесёт тебе радость."
10054-100540190 = "?????"
10054-100540200 = "Что? Мари, что происходит?"
10054-100540210 = "...Мари?"
10054-100540220 = "..."
10054-100540230 = "Сенсей?"
10054-100540240 = "Ты в порядке? Кажется, я услышал громкий удар..."
10054-100540250 = "Не переживай. Я в порядке."
10054-100540260 = "Да. Волноваться не о чем. Я увидела это заранее и успела приготовиться."
10054-100540270 = "????"
10054-100540280 = "...Понятно."
10054-100540290 = "Да..."
10054-100540300 = "Сенсей, я должна тебя кое за что поблагодарить."
10054-100540310 = "Этот спортивный праздник дал мне очень многое, и всё благодаря твоим советам и поддержке."
10054-100540320 = "Я хотела бы отплатить тебе, но не знаю как..."
10054-100540330 = "Не переживай! Я помогал не ради того, чтобы ты мне отплатила."
10054-100540340 = "Я просто рад слышать, что тебе было весело."
10054-100540350 = "А?"
10054-100540360 = "Каждый раз, когда я пытаюсь тебя поблагодарить, ты вот так меняешь тему."
10054-100540370 = "Кажется, я понимаю."
10054-100540380 = "И уверена, когда-нибудь у меня появится шанс."
10054-100540390 = "Это совсем не то же самое, но..."
10054-100540400 = "я помолюсь, чтобы сегодня у тебя был спокойный день."
10054-100540410 = "О, Сенсей. Ещё кое-что."
10054-100540420 = "Если вы не против..."
10054-100540430 = "Может, как-нибудь зайдёшь в собор в спортивной форме."
10054-100540440 = "Здесь тенисто и тихо. Оказывается, это очень освежающее место для упражнений."
10054-100540450 = "Так что, Сенсей, если тебе идея подходит..."
10054-100540460 = "Эм..."
10054-100540470 = "надеюсь, у нас будет шанс позаниматься вместе."
10054-100540480 = "До следующей встречи, Сенсей."
