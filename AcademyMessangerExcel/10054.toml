[translation]
10054-100540010 = "Olá, Sensei. Aqui é a Mari."
10054-100540020 = "Desculpe mandar mensagem assim de repente, mas há algo sobre o qual eu gostaria de pedir o seu conselho..."
10054-100540030 = "Sozinha, está sendo muito difícil para mim..."
10054-100540040 = "Claro, o que houve?"
10054-100540050 = "Aconteceu alguma coisa?"
10054-100540060 = "Ah... hum..."
10054-100540070 = "Não é nada tão grave assim..."
10054-100540080 = "Quer dizer... não é como se eu tivesse me metido em algo perigoso nem nada do tipo..."
10054-100540090 = "Mas fico muito feliz com a sua preocupação. Muito obrigada."
10054-100540100 = "Então, indo direto ao assunto... você poderia me ceder um tempinho amanhã de manhã?"
10054-100540110 = "Estarei esperando por você na Catedral."
10054-100540120 = "Conhecendo você, Sensei, tenho certeza de que deve estar muito ocupado, mas..."
10054-100540130 = "Rezo para que possamos nos encontrar no dia do Festival Halo também."
10054-100540140 = "Que o seu dia hoje também seja maravilhoso, Sensei."
10054-100540150 = "Sensei..."
10054-100540160 = "Está tudo bem com você hoje?"
10054-100540170 = "Entrei em contato porque queria ao menos te mandar um cumprimento..."
10054-100540180 = "Estarei rezando para que você tenha dias cheios de felicidade, Sensei."
10054-100540190 = "???"
10054-100540200 = "Mari, o que houve?"
10054-100540210 = "...Mari?"
10054-100540220 = "..."
10054-100540230 = "Sensei...?"
10054-100540240 = "Hum, não aconteceu nada mesmo?\nQuando eu estava saindo, tive a impressão de ter ouvido um barulho surdo..."
10054-100540250 = "Deve ter sido impressão sua, não?"
10054-100540260 = "Eu já imaginava que isso ia acontecer, então está tudo bem, não se preocupe."
10054-100540270 = "???"
10054-100540280 = "...A-ah, entendo."
10054-100540290 = "Entrarei em contato novamente depois."
10054-100540300 = "Sensei... hum, há alguma coisa que eu possa fazer por você?"
10054-100540310 = "Graças a você, Sensei, sinto que pude crescer muito durante o Festival Halo."
10054-100540320 = "Por isso eu queria agradecer de alguma forma... mas não sabia bem o que fazer..."
10054-100540330 = "Não precisa agradecer. Se você estiver bem, Mari, para mim já basta."
10054-100540340 = "Só de ver você se divertindo, Mari, já fiquei feliz."
10054-100540350 = "Ahaha..."
10054-100540360 = "Realmente, não sou páreo para você, Sensei."
10054-100540370 = "...Está bem, entendi."
10054-100540380 = "Vou esperar até o dia em que eu possa retribuir e te ajudar em algo."
10054-100540390 = "Pode não ser muita coisa em troca, mas hoje..."
10054-100540400 = "Rezarei para que você tenha um dia tranquilo e em paz, Sensei."
10054-100540410 = "Hum, Sensei..."
10054-100540420 = "Se você não se importar..."
10054-100540430 = "Pensei que seria ótimo se da próxima vez você pudesse vir com roupa de ginástica."
10054-100540440 = "O parque é fresquinho e agradável, perfeito para fazer exercícios..."
10054-100540450 = "Então, dependendo da sua disponibilidade, Sensei..."
10054-100540460 = "Hum..."
10054-100540470 = "Eu ficaria muito feliz... se pudéssemos nos exercitar juntos da próxima vez."
10054-100540480 = "Bom... até mais."
