[translation]
10078-100780010 = "Huum!"
10078-100780020 = "Huum, huum!!"
10078-100780030 = "Huuuuuum~!!"
10078-100780040 = "...Kasumi?"
10078-100780050 = "O que houve?"
10078-100780060 = "Oh, Sensei!"
10078-100780070 = "Eu sabia que você me responderia na mesma hora!"
10078-100780080 = "Estou com um pequeno dilema em mãos!"
10078-100780090 = "E não é algo que dê para resolver tão facilmente..."
10078-100780100 = "Sensei, se não se importar, poderia me dar uma força?"
10078-100780110 = "Sensei!"
10078-100780120 = "Trago notícias profundamente lamentáveis."
10078-100780130 = "Para o nosso azar, o Comitê Disciplinar estava fazendo ronda bem na hora."
10078-100780140 = "Metade de nós conseguiu escapar... mas a outra metade acabou sendo capturada."
10078-100780150 = "Aaah, que desperdício! E pensar que já tínhamos chegado na parte de plantar os explosivos!"
10078-100780160 = "É-é mesmo? Que pena, hein..."
10078-100780170 = "Hahahahaha!!"
10078-100780180 = "Não esquente a cabeça!"
10078-100780190 = "Contratempos assim são o nosso pão de cada dia."
10078-100780200 = "Aliás, se não fosse assim, nem teria graça!"
10078-100780210 = "Pois bem!"
10078-100780220 = "Nos vemos em breve, Sensei!"
10078-100780230 = "Sensei~?"
10078-100780240 = "Por acaso você tem um tempinho livre agora?"
10078-100780250 = "Acabei de ter uma ideia simplesmente genial."
10078-100780260 = "Agora! Neste exato instante!"
10078-100780270 = "Não me diga que é outro plano de demolição..."
10078-100780280 = "Por acaso é uma \"reunião\"?"
10078-100780290 = "Não esperava menos de você, Sensei! Nossas mentes estão em perfeita sintonia, não?!"
10078-100780300 = "Exatamente isso!"
10078-100780310 = "Porém..."
10078-100780320 = "Saiba que hoje será diferente da última vez, viu?"
10078-100780330 = "...Sua determinação é mesmo inabalável."
10078-100780340 = "Você não desiste nunca, né?"
10078-100780350 = "Hahahahaha!!"
10078-100780360 = "Não adianta me bajular tanto assim, não vai ganhar nada com isso!"
10078-100780370 = "Vamos, venha logo para cá! Vou te mandar a localização!"
10078-100780380 = "Sensei!"
10078-100780390 = "Chamar você até lá e acabar pegando no sono antes..."
10078-100780400 = "Foi mal mesmo, peço desculpas."
10078-100780410 = "Tudo bem, não esquenta."
10078-100780420 = "E o que achou do ponto?"
10078-100780430 = "Olhando de novo, é realmente um ponto impecável!"
10078-100780440 = "Muuuito bem!"
10078-100780450 = "Preciso reunir todo o pessoal imediatamente!!"
10078-100780460 = "Por hoje eu me despeço aqui!"
10078-100780470 = "Huum."
10078-100780480 = "Sensei, se você tiver um tempinho,"
10078-100780490 = "poderia me ajudar a encontrar um bom lugar para estudar?"
10078-100780500 = "Por uma série de motivos,"
10078-100780510 = "está meio complicado para mim dar as caras em cafeterias ou bibliotecas."
10078-100780520 = "Estudar...?"
10078-100780530 = "Não é uma daquelas suas \"reuniões\" de sempre?"
10078-100780540 = "Sim, isso mesmo."
10078-100780550 = "Hoje não se trata de uma \"reunião\"!"
10078-100780560 = "Mas escute:"
10078-100780570 = "Uma aluna está dizendo que quer \"estudar\", então é claro que você vai ajudar, não é?"
10078-100780580 = "Afinal de contas, você é o Sensei!"
10078-100780590 = "Foi um tempo muito produtivo. Até a próxima, Sensei."
10078-100780600 = "Eu também me diverti."
10078-100780610 = "Então é assim que você planeja as escavações de fontes termais."
10078-100780620 = "Hã?"
10078-100780630 = "Ah."
10078-100780640 = "Bom, considerando o meu histórico, não me admira que pareça isso."
10078-100780650 = "Mas sabe,"
10078-100780660 = "quando eu finjo que ajo por impulso sem pensar em nada, fica muito mais fácil me movimentar nos bastidores."
10078-100780670 = "As pessoas soltam muito mais a língua quando acham que você não tem segundas intenções."
10078-100780680 = "É só por isso que mantenho essa fachada..."
10078-100780690 = "Pois é..."
10078-100780700 = "Mas isso é um segredo só entre mim e você, viu, Sensei?"
10078-100780710 = "Huum, que enrascada."
10078-100780720 = "Não tem jeito, vou ter que pedir socorro."
10078-100780730 = "Sensei! Foi mal incomodar, mas você tem um tempinho agora?"
10078-100780740 = "Tenho sim... Aconteceu alguma coisa?"
10078-100780750 = "Precisa de ajuda?"
10078-100780760 = "Sim."
10078-100780770 = "Não é nada de outro mundo."
10078-100780780 = "É só que a tira da minha sandália arrebentou,"
10078-100780790 = "e como eu também torci o pé de leve, acho que não vou conseguir andar."
10078-100780800 = "O quê?!"
10078-100780810 = "Onde você está?!"
10078-100780820 = "Não precisa vir nessa correria toda."
10078-100780830 = "Vou te mandar a minha localização primeiro."
10078-100780840 = "Deixa eu ver, esse lugar fica..."
10078-100780850 = "Sensei!"
10078-100780860 = "Pensando bem, acabamos nos despedindo agora há pouco sem que eu agradecesse direito."
10078-100780870 = "Mais uma vez, você me salvou mesmo! Minha sincera gratidão!!"
10078-100780880 = "Vou cuidar dessas sandálias que ganhei com todo o carinho, pensando nelas como se fossem você, Sensei!"
10078-100780890 = "Hã?"
10078-100780900 = "Espera, isso não significa que você vai ficar pisando em mim?"
10078-100780910 = "Hahahahaha!!"
10078-100780920 = "Ora, tudo depende do ponto de vista..."
10078-100780930 = "Significa que estaremos juntos aonde quer que eu vá!"
10078-100780940 = "Até a próxima, Sensei!!"
