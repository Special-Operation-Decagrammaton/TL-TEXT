[translation]
10078-100780010 = "Ммм!"
10078-100780020 = "Мммм!!"
10078-100780030 = "Ммммммм~!!"
10078-100780040 = "...Касуми?"
10078-100780050 = "Что случилось?"
10078-100780060 = "О, Сенсей!"
10078-100780070 = "Я знала, что вы сразу ответите!"
10078-100780080 = "У меня есть кое-какие заботы."
10078-100780090 = "И они не из тех, что легко решаются..."
10078-100780100 = "Сенсей, если вам не трудно, не поможете ли вы мне?"
10078-100780110 = "Сенсей!"
10078-100780120 = "У меня очень плохие новости."
10078-100780130 = "В неудачный момент патрулировала дисциплинарный комитет."
10078-100780140 = "Половина сбежала, но... другую половину поймали."
10078-100780150 = "Ах~! Жаль! Я уже почти заложила взрывчатку!"
10078-100780160 = "П-понятно. Жаль."
10078-100780170 = "Ха-ха-ха-ха!!"
10078-100780180 = "Не переживайте!"
10078-100780190 = "Это обычное дело."
10078-100780200 = "Наоборот, без этого было бы скучно!"
10078-100780210 = "Ну!"
10078-100780220 = "Увидимся, Сенсей!"
10078-100780230 = "Сенсей~?"
10078-100780240 = "У вас сейчас есть время?"
10078-100780250 = "Мне пришла в голову гениальная идея."
10078-100780260 = "Прямо сейчас! Именно сейчас!"
10078-100780270 = "Неужели опять план взрыва...?"
10078-100780280 = "Может, собрание?"
10078-100780290 = "Как и ожидалось от Сенсея, мы понимаем друг друга без слов!"
10078-100780300 = "Именно так!"
10078-100780310 = "Но..."
10078-100780320 = "Сегодня всё будет иначе, чем в прошлый раз?"
10078-100780330 = "...У тебя несгибаемая воля."
10078-100780340 = "Ты никогда не сдаёшься."
10078-100780350 = "Ха-ха-ха-ха!!"
10078-100780360 = "Сколько ни хвалите, я ничего не дам!"
10078-100780370 = "Давайте, просто придите! Я пришлю место!"
10078-100780380 = "Сенсей!"
10078-100780390 = "Позвать вас и уснуть первым — это..."
10078-100780400 = "Простите, приношу извинения."
10078-100780410 = "Всё в порядке, не волнуйтесь."
10078-100780420 = "Как вам то место?"
10078-100780430 = "Подумать только, это действительно идеальное место!"
10078-100780440 = "Ну всё~~~!"
10078-100780450 = "Надо срочно собрать всех!!"
10078-100780460 = "На сегодня всё!"
10078-100780470 = "Ммм."
10078-100780480 = "Сенсей, если у вас будет время,"
10078-100780490 = "не могли бы вы найти место, где можно позаниматься?"
10078-100780500 = "По разным причинам"
10078-100780510 = "мне трудно ходить в кафе или библиотеку."
10078-100780520 = "Позаниматься...?"
10078-100780530 = "А не обычное «собрание»?"
10078-100780540 = "Да, именно так."
10078-100780550 = "Сегодня это не «собрание»!"
10078-100780560 = "Но"
10078-100780570 = "вы же поможете студенту, который хочет «заниматься»?"
10078-100780580 = "Ведь вы Сенсей!"
10078-100780590 = "Это было полезное время, до встречи, Сенсей."
10078-100780600 = "Мне тоже было весело."
10078-100780610 = "Ты всегда так копаешь горячие источники?"
10078-100780620 = "А?"
10078-100780630 = "Ах, да."
10078-100780640 = "Судя по моим прошлым поступкам, так и выглядит."
10078-100780650 = "Ну,"
10078-100780660 = "когда я кажусь беззаботным, мне легче действовать."
10078-100780670 = "Если я не выгляжу как человек с умыслом, другие охотнее делятся информацией."
10078-100780680 = "Поэтому я так и делаю, но..."
10078-100780690 = "Ну,"
10078-100780700 = "это будет нашим с вами секретом, хорошо?"
10078-100780710 = "М-м, неприятно."
10078-100780720 = "Похоже, нужно просить помощи."
10078-100780730 = "Сенсей, извините, не могли бы вы уделить мне время сейчас?"
10078-100780740 = "Конечно, что случилось?"
10078-100780750 = "Вам нужна помощь?"
10078-100780760 = "Да."
10078-100780770 = "Ничего серьёзного."
10078-100780780 = "Просто у меня сломались сандалии."
10078-100780790 = "И я немного подвернул ногу, так что идти не могу."
10078-100780800 = "Что!?"
10078-100780810 = "Где вы!?"
10078-100780820 = "Не нужно так спешить."
10078-100780830 = "Я пока пришлю место."
10078-100780840 = "А, это..."
10078-100780850 = "Сенсей!"
10078-100780860 = "Кстати, я так и не поблагодарила вас как следует."
10078-100780870 = "Ещё раз спасибо, вы очень помогли!!"
10078-100780880 = "Те сандалии, что вы мне подарили, я буду носить с мыслью о вас!"
10078-100780890 = "А?"
10078-100780900 = "То есть вы будете ходить по мне?"
10078-100780910 = "Ха-ха-ха-ха!!"
10078-100780920 = "Ну, как говорится, всё зависит от точки зрения..."
10078-100780930 = "Это значит, что мы всегда вместе, где бы я ни была!"
10078-100780940 = "Тогда до встречи, Сенсей!!"
