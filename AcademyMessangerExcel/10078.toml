[translation]
10078-100780010 = "М-м!"
10078-100780020 = "М-м-м!"
10078-100780030 = "М-м-м-м-м!!"
10078-100780040 = "Касуми?"
10078-100780050 = "Усердно думаешь над проблемой?"
10078-100780060 = "А! Сенсей!"
10078-100780070 = "Я знала! Знала, что ты ответишь!"
10078-100780080 = "У меня действительно есть проблема."
10078-100780090 = "Очень большая проблема."
10078-100780100 = "Ты ведь поможешь, Сенсей?"
10078-100780110 = "Сенсей!"
10078-100780120 = "Какая жалость!"
10078-100780130 = "Какое ужасное совпадение — Команда Префектов как раз проходила мимо."
10078-100780140 = "Половина моих людей сбежала, а другую половину арестовали!"
10078-100780150 = "До слёз обидно! Взрывчатка уже была взведена и готова!"
10078-100780160 = "Понятно... Не унывай?"
10078-100780170 = "Ва-ха-ха!"
10078-100780180 = "Не нужно переживать!"
10078-100780190 = "Такое постоянно случается."
10078-100780200 = "Было бы скучно без небольшого риска!"
10078-100780210 = "Ладно, пока!"
10078-100780220 = "Увидимся позже, Сенсей!"
10078-100780230 = "Сенсей!"
10078-100780240 = "Сейчас удобно встретиться?"
10078-100780250 = "Мне пришла потрясающая идея."
10078-100780260 = "Прямо сейчас!"
10078-100780270 = "Планируешь ещё один подрыв?"
10078-100780280 = "Уже пора на собрание?"
10078-100780290 = "Ты не разочаровываешь, Сенсей! Сразу понял."
10078-100780300 = "Всё именно так, как звучит!"
10078-100780310 = "Но..."
10078-100780320 = "На этот раз всё будет иначе, чем в прошлый, понимаешь?"
10078-100780330 = "Какая несгибаемая сила воли."
10078-100780340 = "Ты не сдаёшься."
10078-100780350 = "Ва-ха-ха!!"
10078-100780360 = "Ты заставляешь меня краснеть!"
10078-100780370 = "Ну же. Я пришлю местоположение!"
10078-100780380 = "А! Сенсей!"
10078-100780390 = "Вот же. Позвать тебя сюда и потом уснуть..."
10078-100780400 = "Какой позор. Прости."
10078-100780410 = "Всё нормально. Не переживай."
10078-100780420 = "Тебя устраивает место, которое мы выбрали?"
10078-100780430 = "М-м!!"
10078-100780440 = "Как ни посмотри, это действительно идеальное место."
10078-100780450 = "Кстати, я собираюсь собрать всех!"
10078-100780460 = "Похоже, я буду очень занята, так что увидимся позже!"
10078-100780470 = "Мм..."
10078-100780480 = "Сенсей, если ты не против..."
10078-100780490 = "Можешь помочь мне найти уединённое место для учёбы?"
10078-100780500 = "Просто..."
10078-100780510 = "Я не могу вот так сидеть на публике."
10078-100780520 = "Ты хочешь учиться...?"
10078-100780530 = "Это не для одного из наших обычных собраний?"
10078-100780540 = "Бинго."
10078-100780550 = "Ты сразу догадался, Сенсей!"
10078-100780560 = "Если подумать..."
10078-100780570 = "раз учиться — обязанность студента, ты обязан мне помочь, правда?"
10078-100780580 = "Ты ведь мой учитель!"
10078-100780590 = "Было хорошо. Ещё увидимся, Сенсей."
10078-100780600 = "Мне тоже показалось освежающим."
10078-100780610 = "Но я не могу отделаться от ощущения, что ты всё это время высматривала места для горячих источников."
10078-100780620 = "Хм?"
10078-100780630 = "А-а-а..."
10078-100780640 = "От моей репутации мне уже не избавиться, да?"
10078-100780650 = "Понимаешь..."
10078-100780660 = "Просто так удобнее. Я имею в виду изображать дурочку или сумасшедшую."
10078-100780670 = "Никто не спорит. Все просто позволяют тебе вести разговор."
10078-100780680 = "Это всё."
10078-100780690 = "Но..."
10078-100780700 = "Пожалуйста, никому не говори, что я это сказала."
10078-100780710 = "Хм. Какая морока."
10078-100780720 = "У меня нет выбора, придётся попросить твоей помощи."
10078-100780730 = "Сенсей! У тебя есть минутка?"
10078-100780740 = "Конечно... Но что случилось?"
10078-100780750 = "Тебе нужна моя помощь?"
10078-100780760 = "Ах."
10078-100780770 = "Ничего серьёзного."
10078-100780780 = "Просто у меня порвалась сандалия."
10078-100780790 = "И, похоже, я повредила лодыжку, потому что мне трудно ходить."
10078-100780800 = "Что?!"
10078-100780810 = "Где вы?"
10078-100780820 = "Эй-эй. Не нужно так спешить."
10078-100780830 = "Я пришлю тебе своё местоположение!"
10078-100780840 = "Я нахожусь..."
10078-100780850 = "Сенсей!"
10078-100780860 = "Я так и не успела как следует поблагодарить тебя раньше."
10078-100780870 = "Буду должна!"
10078-100780880 = "Я буду беречь эти тапочки, будто это сам Сенсей, и хранить их вечно!!"
10078-100780890 = "То есть ты благодаришь меня И одновременно наступаешь на меня?"
10078-100780900 = "Я... тапочек?"
10078-100780910 = "Ва-ха-ха!!"
10078-100780920 = "Ну..."
10078-100780930 = "Считай, что так мы всегда будем вместе, куда бы я ни пошла. Ну, что-то вроде того!"
10078-100780940 = "До встречи, Сенсей!!"
