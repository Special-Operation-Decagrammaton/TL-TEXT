[translation]
10089-100890010 = "Huum..."
10089-100890020 = "Que dilema..."
10089-100890030 = "Sensei, você tem um tempinho agora?"
10089-100890040 = "Não, deixa pra lá, não é nada."
10089-100890050 = "...Aconteceu alguma coisa?"
10089-100890060 = "Pode me contar?"
10089-100890070 = "É que..."
10089-100890080 = "Uugh..."
10089-100890090 = "Pensando bem, está tudo bem."
10089-100890100 = "Quando surgir uma oportunidade, eu te conto."
10089-100890110 = "Sensei"
10089-100890120 = "É meio repentino, mas acabou de entrar um serviço."
10089-100890130 = "Podemos conversar sobre aquilo em breve?"
10089-100890140 = "Hehe."
10089-100890150 = "Como você disse, Sensei, fiz muito bem em não vender o vestido."
10089-100890160 = "Então nos vemos depois, Sensei."
10089-100890170 = "Sensei"
10089-100890180 = "O significado daquelas palavras que você me disse outro dia..."
10089-100890190 = "Eu finalmente entendi."
10089-100890200 = "As palavras que eu disse?"
10089-100890210 = "Sobre o vestido?"
10089-100890220 = "Hehe."
10089-100890230 = "Então, se não se importar, eu gostaria de pedir um tempinho seu..."
10089-100890240 = "Posso entrar em contato de novo assim que eu decidir o horário e o local?"
10089-100890250 = "Até mais tarde, Sensei."
10089-100890260 = "Sensei"
10089-100890270 = "É que..."
10089-100890280 = "Me desculpe."
10089-100890290 = "Eu acabei falando sozinha o tempo todo, né?"
10089-100890300 = "Imagina, tudo bem, Aru."
10089-100890310 = "Foi uma \"festa de comemoração\" bem divertida."
10089-100890320 = "Hehe."
10089-100890330 = "Eu sabia que você diria isso, Sensei."
10089-100890340 = "Mas muito obrigada mesmo."
10089-100890350 = "E além disso..."
10089-100890360 = "Eu também me diverti muito."
10089-100890370 = "Quando surgir outra oportunidade, vamos comemorar de novo."
10089-100890380 = "Sensei, você teria um tempinho para mim?"
10089-100890390 = "Gostaria de pedir um conselho sobre um serviço que aceitei recentemente..."
10089-100890400 = "Claro."
10089-100890410 = "Pode ser a qualquer hora."
10089-100890420 = "Hehe, quem diria que eu encontraria você hoje também, Sensei."
10089-100890430 = "N-Não, espera, isso que eu disse agora..."
10089-100890440 = "Quis dizer que fico feliz por você ouvir a minha consulta!"
10089-100890450 = "Assim que eu decidir a hora e o lugar, entro em contato de novo."
10089-100890460 = "Você conferiu o dinheiro que eu transferi?"
10089-100890470 = "Você me salvou mesmo naquela hora, Sensei."
10089-100890480 = "Aliás, sobre o vestido..."
10089-100890490 = "Por que você precisava dele com tanta urgência?"
10089-100890500 = "Hã?"
10089-100890510 = "Er..."
10089-100890520 = "I-Isso é..."
10089-100890530 = "Bom..."
10089-100890540 = "Qualquer dia desses eu te conto, Sensei."
