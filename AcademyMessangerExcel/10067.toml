10067-100670090 = "Sensei, você está na Schale hoje também, certo?"
10067-100670100 = "Sendo assim, farei uma visita hoje novamente."
10067-100670110 = "Tudo bem para você?"
10067-100670120 = "Não tenho nenhum motivo..."
10067-100670130 = "para recusar a visita de uma aluna, né..."
10067-100670140 = "Hehe."
10067-100670150 = "Fica tão feliz assim em me ver?"
