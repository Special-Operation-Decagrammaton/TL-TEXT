[translation]
10067-100670010 = "Сенсей."
10067-100670020 = "Алло? Сенсей?"
10067-100670030 = "О, Токи."
10067-100670040 = "Верно. Это Токи."
10067-100670050 = "Я хотела бы обратиться к тебе с просьбой. Ты не против?"
10067-100670060 = "Конечно! Я с радостью помогу тебе с чем угодно."
10067-100670070 = "С чем угодно... Я это запомню."
10067-100670080 = "Стой-стой! Мне нужно переформулировать!"
10067-100670090 = "Сенсей."
10067-100670100 = "Я хотела бы прийти сегодня."
10067-100670110 = "Это допустимо, верно?"
10067-100670120 = "Не могу придумать причину отказать..."
10067-100670130 = "Я бы не стал запрещать студенту навещать меня..."
10067-100670140 = "Хм."
10067-100670150 = "Значит, ты говоришь, что это не проблема."
10067-100670160 = "Я запомню, Сенсей."
10067-100670170 = "Подготовка завершена."
10067-100670180 = "Ожидаю приказа на начало."
10067-100670190 = "Токи...?"
10067-100670200 = "Начинаю операцию."
10067-100670210 = "Перехожу в режим молчания."
10067-100670220 = "Токи?!"
