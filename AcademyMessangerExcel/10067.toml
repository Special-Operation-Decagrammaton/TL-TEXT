[translation]
10067-100670010 = "Сенсей."
10067-100670020 = "Вы на месте?"
10067-100670030 = "А, Токи? Что случилось?"
10067-100670040 = "Да, это я."
10067-100670050 = "У меня к вам серьёзная просьба, можно?"
10067-100670060 = "Если просишь ты, Токи, я готов выслушать."
10067-100670070 = "Не вздумайте забыть эти слова."
10067-100670080 = "Подождите! Дайте сначала услышать, о чём речь, а потом я подумаю...?"
10067-100670090 = "Сенсей, вы сегодня будете в Шале, верно?"
10067-100670100 = "Тогда я сегодня тоже зайду."
10067-100670110 = "Хорошо?"
10067-100670120 = "Причин отказывать ученице в визите..."
10067-100670130 = "у меня нет..."
10067-100670140 = "Хе-хе."
10067-100670150 = "Вы так рады?"
10067-100670160 = "Тогда я потороплюсь. Увидимся позже."
10067-100670170 = "Готова к входу."
10067-100670180 = "Жду команды."
10067-100670190 = "Токи...?"
10067-100670200 = "Начинаю бой."
10067-100670210 = "Прерываю связь."
10067-100670220 = "Токи!?"
