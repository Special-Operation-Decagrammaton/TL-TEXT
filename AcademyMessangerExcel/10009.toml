[translation]
10009-700 = "Sensei!"
10009-701 = "Ontem eu li um livro incrível!"
10009-702 = "Um livro incrível?"
10009-703 = "Sim! Era a autobiografia de um atleta..."
10009-704 = "E lá ensinava um método para deixar a comida muuuuito mais gostosa!"
10009-705 = "Um método pra deixar a comida muito mais gostosa?"
10009-706 = "Por que teria uma coisa dessas na autobiografia de um atleta...?"
10009-707 = "Como integrante da Sociedade de Pesquisa Gourmet, não posso deixar de testar isso!"
10009-708 = "Não vamos perder tempo, Sensei!"
10009-709 = "Sensei! Sensei!"
10009-710 = "A partir de hoje vai rolar um festival cheio de barraquinhas de comida lá na Praça Central!"
10009-711 = "Olha só! Você parece super animada, Izumi."
10009-712 = "Sim! Eu tava esperando por esse dia há um tempão!"
10009-713 = "Especialmente hoje, porque aquela loja famosíssima pelos pudins vai participar...!"
10009-714 = "Eu preciso provar aquilo de qualquer jeito!"
10009-715 = "Sensei! Fiquei sabendo que abriu uma casa de lámen nova na rua comercial de Gehenna!"
10009-716 = "Vamos lá juntos!"
10009-717 = "Pra fazer uma visita prévia e um reconhecimento do local!"
10009-718 = "Mas essas duas coisas não significam a mesma coisa?"
10009-719 = "Ué, sério?"
10009-100090010 = "Ei, Sensei!"
10009-100090020 = "Tem uma coisa que eu quero que você experimente..."
10009-100090030 = "Quer dizer, que eu quero te mostrar!"
10009-100090040 = "Me mostrar?"
10009-100090050 = "Isso!"
10009-100090060 = "Então, Sensei, você pode vir aqui rapidinho?"
10009-100090070 = "Combinado. Tô indo."
10009-100090080 = "Ebaaa!"
10009-100090090 = "Então vou ficar te esperando, viu!"
