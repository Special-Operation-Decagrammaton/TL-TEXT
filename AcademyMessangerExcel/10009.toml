[translation]
10009-700 = "Сенсей!"
10009-701 = "Вчера я прочитала потрясающую книгу!"
10009-702 = "Потрясающую книгу?"
10009-703 = "Да! Это была автобиография одного спортсмена..."
10009-704 = "И там был написан способ, как сделать еду супер-вкусной!"
10009-705 = "Способ сделать супер-вкусной?"
10009-706 = "Почему в автобиографии спортсмена такое..."
10009-707 = "Как члену Клуба гурманов, я просто обязана это попробовать."
10009-708 = "Кто рано встаёт, того удача ждёт, Сенсей!"
10009-709 = "Сенсей! Сенсей!"
10009-710 = "Сегодня на Центральной площади начинается фестиваль с множеством киосков!"
10009-711 = "Правда? Идзуми, ты выглядишь очень радостной."
10009-712 = "Да! Я ждала этого дня!"
10009-713 = "Сегодня особенно — в этом фестивале участвует та знаменитая лавка с пудингом...!"
10009-714 = "Я просто обязана это попробовать!"
10009-715 = "Сенсей! Говорят, в торговом районе Геенны открылся новый рамэн-домик!"
10009-716 = "Пойдём вместе!"
10009-717 = "На разведку и досмотр!"
10009-718 = "Разве это не одно и то же?"
10009-719 = "А? Правда?"
10009-100090010 = "Слушайте, Сенсей!"
10009-100090020 = "Я хочу, чтобы вы попробовали кое-что..."
10009-100090030 = "Нет, я хочу вам показать!"
10009-100090040 = "Показать?"
10009-100090050 = "Да!"
10009-100090060 = "Так что, Сенсей, вы не могли бы подойти?"
10009-100090070 = "Хорошо. Иду."
10009-100090080 = "Ура!"
10009-100090090 = "Тогда я жду!"
