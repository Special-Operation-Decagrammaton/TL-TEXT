[translation]
10009-700 = "Сенсей!"
10009-701 = "Вчера я прочитала кое-что невероятное."
10009-702 = "Что-то невероятное?"
10009-703 = "Да! Я читала автобиографию одного спортсмена..."
10009-704 = "И там был рецепт, как сделать обычную еду вкуснее!"
10009-705 = "Сделать обычную еду вкуснее?"
10009-706 = "Почему это вообще было в автобиографии спортсмена...?"
10009-707 = "Как член Общества исследования гурманства, я обязана это проверить."
10009-708 = "Давайте испытаем, Сенсей!"
10009-709 = "Сенсей! Сенсей!"
10009-710 = "С сегодняшнего дня на Центральной площади Геенны проходит фестиваль уличной еды!"
10009-711 = "Изуми, ты такая возбуждённая."
10009-712 = "Ещё бы! Я так долго ждала этого дня!"
10009-713 = "Сегодня там будет знаменитая лавка пудингов!"
10009-714 = "Я обязана попробовать!"
10009-715 = "Сенсей! В торговом районе Геенны открылся новый рамэн-ресторан!"
10009-716 = "Давайте сходим вместе!"
10009-717 = "Осмотримся и проведём разведку!"
10009-718 = "Разве это не одно и то же...?"
10009-719 = "А, правда?"
10009-100090010 = "Угадайте что, Сенсей!"
10009-100090020 = "Я хочу кое-что вам показать!"
10009-100090030 = "То есть кое-что дать попробовать!"
10009-100090040 = "О, значит, хочешь встретиться, Изуми?"
10009-100090050 = "Да!"
10009-100090060 = "Сегодня вам подходит, да?"
10009-100090070 = "Конечно, для тебя у меня всегда найдётся время, Изуми."
10009-100090080 = "Ура-а!"
10009-100090090 = "Буду ждать!"
