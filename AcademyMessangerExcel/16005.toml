[translation]
16005-16005010 = "Sensei. Você teria um tempinho agora?"
16005-16005020 = "Estou em uma situação um tanto complicada"
16005-16005030 = "Se possível, gostaria muito de pedir a sua ajuda, Sensei"
16005-16005040 = "Tudo bem com você? Já estou indo"
16005-16005050 = "Claro, onde você está agora?"
16005-16005060 = "Muito obrigada, Sensei"
16005-16005070 = "Estarei aguardando naquela praia, então"
16005-16005080 = "Hum"
16005-16005090 = "Peço mil desculpas, Sensei"
16005-16005100 = "Eu mesma te chamei e acabei agindo daquele jeito......"
16005-16005110 = "Imagina, não esquenta com isso"
16005-16005120 = "Pode me chamar sem cerimônia sempre que quiser"
16005-16005130 = "Hã"
16005-16005140 = "Tem certeza mesmo......?"
16005-16005150 = "......"
16005-16005160 = "Muito obrigada. Entrarei em contato novamente"
16005-16005170 = "Sensei"
16005-16005180 = "Peço sinceras desculpas pelo que aconteceu antes. Sinto muito mesmo"
16005-16005190 = "Está tudo bem, não se preocupe"
16005-16005200 = "Já se acalmou?"
16005-16005210 = "Sim. Muito obrigada"
16005-16005220 = "No fim das contas, não consegui capturar o fantasma......"
16005-16005230 = "E como a situação é a mesma em qualquer outro lugar que eu vá, não sei bem o que fazer"
16005-16005240 = "Então estou indo para aí agora mesmo"
16005-16005250 = "Pode me esperar um pouquinho?"
16005-16005260 = "Sim"
16005-16005270 = "......"
16005-16005280 = "Hã?"
16005-16005290 = "Sensei?"
16005-16005300 = "Muito obrigada mesmo por hoje, Sensei"
16005-16005310 = "Graças a você, sinto que pela primeira vez consegui aproveitar a praia exatamente como eu sonhava"
16005-16005320 = "E pensar que foi junto com você, Sensei"
16005-16005330 = "Perdão, por favor esqueça o que acabei de dizer"
16005-16005340 = "Kuhi"
16005-16005350 = "Kuhihihihikehehehehe"
16005-16005360 = "Kihi"
16005-16005370 = "......"
16005-16005380 = "Ah"
16005-16005390 = "Me desculpe"
16005-16005400 = "Digitação por voz?"
16005-16005410 = "Tsurugi? Aconteceu alguma coisa?"
16005-16005420 = "Me desculpe"
16005-16005430 = "Não foi nada, perdoe a indelicadeza"
16005-16005440 = "Atenciosamente, Tsurugi"
16005-16005450 = "Sensei, aqui é a Tsurugi"
16005-16005460 = "Graças a você, estou me sentindo muito mais leve"
16005-16005470 = "Se me perguntarem quando eu voltar se me diverti, acho que poderei responder que sim sem hesitar"
16005-16005480 = "Mais uma vez, muito obrigada de coração"
16005-16005490 = "Hum"
16005-16005500 = "Se houver outra oportunidade, e se você não se importar, Sensei. Gostaria de ir junto com você de novo"
16005-16005510 = "Não. Quer dizer, enfim......"
16005-16005520 = "Conto com você daqui para frente também"
16005-16005530 = "Atenciosamente, Tsurugi"
