[translation]
16005-16005010 = "Сенсей. У вас есть сейчас время?"
16005-16005020 = "У меня небольшая проблема."
16005-16005030 = "Если вы не против, я хотела бы попросить вашей помощи."
16005-16005040 = "Всё в порядке? Я сейчас приду."
16005-16005050 = "Конечно, ты где?"
