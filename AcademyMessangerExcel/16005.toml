[translation]
16005-16005010 = "Сенсей, вы сейчас свободны?"
16005-16005020 = "Я оказалась в затруднении."
16005-16005030 = "Можно попросить вас о помощи?"
16005-16005040 = "А? О помощи?"
16005-16005050 = "Конечно. Где ты?"
16005-16005060 = "Большое спасибо, Сенсей."
16005-16005070 = "Тогда я буду ждать на пляже."
16005-16005080 = "Эм..."
16005-16005090 = "Мне так жаль, Сенсей."
16005-16005100 = "Мне нечем оправдаться, особенно после того, как я сама попросила."
16005-16005110 = "Не волнуйся. Такое бывает."
16005-16005120 = "Можешь снова позвать меня позже."
16005-16005130 = "О..."
16005-16005140 = "Правда можно?"
16005-16005150 = "..."
16005-16005160 = "Хорошо. Спасибо."
16005-16005170 = "Сенсей."
16005-16005180 = "Мне правда жаль за прошлый раз. Я была такой невнимательной."
16005-16005190 = "Не переживай."
16005-16005200 = "Как ты себя сейчас чувствуешь? Как обстановка?"
16005-16005210 = "Ну, ситуация..."
16005-16005220 = "на самом деле почти не изменилась."
16005-16005230 = "Я всё ещё ищу решение."
16005-16005240 = "Хорошо. Сейчас буду."
16005-16005250 = "Тебе понадобится моя помощь."
16005-16005260 = "Неужели...? Спасибо."
16005-16005270 = "..."
16005-16005280 = "А?"
16005-16005290 = "Сенсей?"
16005-16005300 = "Огромное спасибо, Сенсей."
16005-16005310 = "Мне кажется, я действительно хорошо провела время."
16005-16005320 = "Наверное, благодаря вам, Сенсей."
16005-16005330 = "Поговорим позже."
16005-16005340 = "Ке-хи."
16005-16005350 = "Кихя-я-я-я-як!"
16005-16005360 = "Кехк..."
16005-16005370 = "..."
16005-16005380 = "...?"
16005-16005390 = "Простите."
16005-16005400 = "Есть проблема?"
16005-16005410 = "Цуруги?"
16005-16005420 = "О..."
16005-16005430 = "Ничего. Я в порядке. Простите."
16005-16005440 = "С уважением, Цуруги."
16005-16005450 = "Сенсей, это Цуруги."
16005-16005460 = "В прошлый раз вы помогли мне успокоиться."
16005-16005470 = "Если спросить, хорошо ли у меня дела, думаю, ответ будет «да»."
16005-16005480 = "Так что ещё раз большое спасибо."
16005-16005490 = "Эм..."
16005-16005500 = "..."
16005-16005510 = "Если у вас будет время, я была бы не против снова сделать что-нибудь подобное."
16005-16005520 = "Буду ждать нашего следующего разговора."
16005-16005530 = "С уважением, Цуруги."
