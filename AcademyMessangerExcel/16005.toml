16005-16005070 = "Тогда я буду ждать вас на том берегу."
16005-16005080 = "Эм..."
16005-16005090 = "Простите, Сенсей."
16005-16005100 = "Я сама вас позвала, а потом так..."
16005-16005110 = "Не переживай."
16005-16005120 = "Всегда зови, если нужно."
16005-16005130 = "Э..."
16005-16005140 = "Правда можно...?"
16005-16005150 = "..."
16005-16005160 = "Спасибо. Я ещё свяжусь с вами."
16005-16005170 = "Сенсей."
16005-16005180 = "Прошу прощения за тот случай. Мне очень жаль."
16005-16005190 = "Всё в порядке, не переживай."
16005-16005200 = "Ты успокоилась?"
16005-16005210 = "Да. Спасибо."
16005-16005220 = "В итоге призрака так и не поймали..."
16005-16005230 = "В других местах та же ситуация, так что я не знаю, что делать."
16005-16005240 = "Тогда я сейчас приду к тебе."
16005-16005250 = "Подождёшь меня?"
16005-16005260 = "Да."
16005-16005270 = "..."
16005-16005280 = "Да?"
16005-16005290 = "Сенсей?"
16005-16005300 = "Большое спасибо, Сенсей."
16005-16005310 = "Благодаря вам я, кажется, впервые смогла насладиться морем так, как представляла."
16005-16005320 = "И притом вместе с вами."
16005-16005330 = "Простите, забудьте это."
16005-16005340 = "Ку-хи."
16005-16005350 = "Ку-хи-хи-хи-хе-хе-хе-хе."
16005-16005360 = "Ки-хи."
16005-16005370 = "..."
16005-16005380 = "А."
16005-16005390 = "Извините."
16005-16005400 = "Голосовой ввод?"
16005-16005410 = "Цуруги? Что случилось?"
16005-16005420 = "Простите."
16005-16005430 = "Ничего, извините."
16005-16005440 = "Цуруги, с уважением."
16005-16005450 = "Сенсей, это Цуруги."
16005-16005460 = "Благодаря вам я пришла в себя."
16005-16005470 = "Думаю, если меня спросят, было ли весело, я отвечу не задумываясь."
16005-16005480 = "Ещё раз огромное спасибо."
16005-16005490 = "Эм..."
16005-16005500 = "Если будет ещё возможность, и если вы не против... снова, вместе..."
16005-16005510 = "Нет, то есть... в общем..."
16005-16005520 = "Надеюсь на вашу поддержку и впредь."
16005-16005530 = "Цуруги, с уважением."