[translation]
10129-101290010 = "Olá, Sensei. Aqui é a Suzumi."
10129-101290020 = "Espero que esteja tudo bem com você."
10129-101290030 = "Suzumi! Tudo bem por aí?"
10129-101290040 = "Sim, tudo ótimo, graças a você."
10129-101290050 = "Gostaria de tirar uma dúvida..."
10129-101290060 = "Até que horas as instalações de descanso da SCHALE ficam abertas?"
10129-101290070 = "Não tem um horário limite definido."
10129-101290080 = "Pode ficar o tempo que quiser."
10129-101290090 = "Compreendido."
10129-101290100 = "Há alguma regra ou recomendação para o uso do espaço?"
10129-101290110 = "Só apagar as luzes quando for embora, basicamente."
10129-101290120 = "Compreendido."
10129-101290130 = "Muito obrigada."
10129-101290140 = "Sensei, hum..."
10129-101290150 = "Sei que estou sendo repetitiva, mas..."
10129-101290160 = "Aquela roupa não tem absolutamente nada a ver com o meu gosto pessoal!"
10129-101290170 = "Pois eu gostei bastante daquele visual!"
10129-101290180 = "Efs#'8k6avb$"
10129-101290190 = "Perdão."
10129-101290200 = "Deixei o celular cair."
10129-101290210 = "Aquilo foi estritamente uma extensão de uma missão do Corpo de Vigilantes!"
10129-101290220 = "Por favor, não entenda errado!"
10129-101290230 = "Entendido!"
10129-101290240 = "...E também..."
10129-101290250 = "Muito obrigada pelos elogios."
10129-101290260 = "Até a próxima..."
10129-101290270 = "Sensei, aqui é a Suzumi."
10129-101290280 = "Gostaria de lhe pedir uma indicação..."
10129-101290290 = "A minha roupa acabou rasgando um pouquinho,"
10129-101290300 = "então queria saber se você conhece alguma boa loja de consertos e costura para me recomendar."
10129-101290310 = "Tem uma loja ótima aqui pertinho da SCHALE!"
10129-101290320 = "Conheço um ateliê de confiança que sempre me salva!"
10129-101290330 = "Muito obrigada."
10129-101290340 = "Se é recomendação sua, Sensei, certamente posso confiar."
10129-101290350 = "Adoraria encontrar com você novamente em breve."
10129-101290360 = "Sensei."
10129-101290370 = "Sobre aquele vídeo de agora há pouco..."
10129-101290380 = "Você ainda o tem salvo?"
10129-101290390 = "Eu estava prestes a apagar."
10129-101290400 = "Quer que eu deixe salvo?"
10129-101290410 = "Não! Não é isso!"
10129-101290420 = "É claro que eu quero que você apague, mas..."
10129-101290430 = "É que... para identificar os defeitos da roupa,"
10129-101290440 = "pensei que seria mais fácil analisar pelo vídeo."
10129-101290450 = "Mesmo os detalhes que não percebi enquanto estava vestindo"
10129-101290460 = "ficam fáceis de notar nas imagens."
10129-101290470 = "É única e exclusivamente por esse motivo,"
10129-101290480 = "então você poderia enviar o vídeo para mim antes?"
10129-101290490 = "E depois de me mandar, apague do seu aparelho, por favor!"
10129-101290500 = "Sem falta!"
10129-101290510 = "Sensei, aqui é a Suzumi."
10129-101290520 = "Por acaso você sabe o que é uma \"convenção de doujin\"?"
10129-101290530 = "É a minha área de especialidade."
10129-101290540 = "É o meu ponto forte."
10129-101290550 = "Hum, quer dizer que"
10129-101290560 = "você entende bem do assunto, então."
10129-101290570 = "O Corpo de Vigilantes recebeu uma denúncia"
10129-101290580 = "de que há delinquentes causando tumulto em uma convenção de doujin."
10129-101290590 = "Por isso, pensei em pedir alguns conselhos a você."
10129-101290600 = "Nesse caso, o ideal é tentar não chamar atenção."
10129-101290610 = "Acho que o segredo é usar uma roupa que combine com o evento."
10129-101290620 = "Compreendo."
10129-101290630 = "Foi de grande ajuda."
10129-101290640 = "Eu vou junto com você!"
10129-101290650 = "Você vai me acompanhar, Sensei?"
10129-101290660 = "Fico muito mais tranquila assim."
10129-101290670 = "Até daqui a pouco, então."
10129-101290680 = "Desculpe a pergunta repentina, mas..."
10129-101290690 = "Por acaso eu tenho uma expressão assustadora?"
10129-101290700 = "Quando contive a confusão agora há pouco,"
10129-101290710 = "tive a impressão de que as pessoas ao redor ficaram apavoradas comigo..."
10129-101290720 = "Você mandou super bem lá, Suzumi!"
10129-101290730 = "O pessoal só ficou um pouco surpreso, só isso."
10129-101290740 = "Entendo..."
10129-101290750 = "Naquela hora, não consegui pensar em nenhuma outra alternativa..."
10129-101290760 = "Não dava para só colocar o pino de segurança da granada de volta?"
10129-101290770 = "Ah."
10129-101290780 = "Realmente."
10129-101290790 = "Levarei isso em conta na próxima vez."
10129-101290800 = "Sensei, aqui é a Suzumi."
10129-101290810 = "Posso perguntar se você tem algum compromisso para este fim de semana?"
10129-101290820 = "Nada em especial."
10129-101290830 = "Entendo."
10129-101290840 = "Se não for incômodo, gostaria de ir"
10129-101290850 = "ao parque de diversões comigo?"
10129-101290860 = "Com todo o prazer!"
10129-101290870 = "Fico muito feliz em ouvir isso."
10129-101290880 = "Muito obrigada por aceitar sempre com tanta gentileza."
10129-101290890 = "Mandarei os detalhes do local de encontro mais tarde."
10129-101290900 = "Sensei, aqui é a Suzumi."
10129-101290910 = "Mais uma vez, muito obrigada por todas as palavras calorosas que você sempre me diz."
10129-101290920 = "Elas me deram muita força."
10129-101290930 = "..."
10129-101290940 = "Espero poder continuar contando com você daqui em diante."
10129-101290950 = "Eu que digo, Suzumi!"
10129-101290960 = "Vai continuar me protegendo também, Thermite White?"
10129-101290970 = "S-Sensei! Eu só falei aquilo porque fazia parte da missão...!"
10129-101290980 = "..."
10129-101290990 = "É claro que, a qualquer hora e em qualquer lugar,"
10129-101291000 = "eu sempre protegerei você, Sensei."
10129-101291010 = "...Até breve."
