[translation]
10129-101290010 = "Здравствуйте, Сенсей. Это Сузуми."
10129-101290020 = "Как вы поживаете?"
10129-101290030 = "Привет, Сузуми. Как дела?"
10129-101290040 = "Всё идёт хорошо, благодаря вам."
10129-101290050 = "Я пишу, потому что у меня есть вопрос."
10129-101290060 = "До скольких открыта комната отдыха в Шале?"
10129-101290070 = "У неё нет установленного графика работы."
10129-101290080 = "Она открыта, когда бы тебе ни понадобилась!"
10129-101290090 = "Понятно."
10129-101290100 = "Есть ли что-то, что мне следует знать, если я буду ею пользоваться?"
10129-101290110 = "Хм... Выключай свет, когда уходишь!"
10129-101290120 = "Принято."
10129-101290130 = "Спасибо, Сенсей."
10129-101290140 = "Сенсей, эм-м."
10129-101290150 = "Я просто скажу это ещё раз..."
10129-101290160 = "Но то, что вы видели, совершенно никак не связано с моими личными предпочтениями!"
10129-101290170 = "А мне понравилось!"
10129-101290180 = "asdjkhdkast"
10129-101290190 = "Прошу прощения."
10129-101290200 = "Я уронила телефон."
10129-101290210 = "Это всего лишь продолжение заданий Отряда вигилантов!"
10129-101290220 = "Пожалуйста, не поймите неправильно!"
10129-101290230 = "Поняла!"
10129-101290240 = "...И это уже другая тема,"
10129-101290250 = "но спасибо за ваши комплименты."
10129-101290260 = "До следующего раза."
10129-101290270 = "Это Сузуми, Сенсей."
10129-101290280 = "У меня есть вопрос."
10129-101290290 = "На моей одежде порвался шов."
10129-101290300 = "Я хотела спросить, не знаете ли вы хорошего портного."
10129-101290310 = "Рядом с Шале есть один."
10129-101290320 = "Я постоянный клиент одной мастерской неподалёку!"
10129-101290330 = "Спасибо."
10129-101290340 = "Мне хотелось найти ателье, которому я могла бы доверять."
10129-101290350 = "Буду ждать встречи."
10129-101290360 = "Сенсей."
10129-101290370 = "Видео, которое вы сняли раньше..."
10129-101290380 = "оно всё ещё у вас?"
10129-101290390 = "Я как раз собирался его удалить. А что?"
10129-101290400 = "Не удалять его?"
10129-101290410 = "Нет, дело не в этом!"
10129-101290420 = "Конечно же, вы должны его удалить!!"
10129-101290430 = "Но, эм..."
10129-101290440 = "На костюме есть какие-нибудь... разрывы или дефекты?"
10129-101290450 = "Я подумала, что на видео это будет легче увидеть."
10129-101290460 = "Потому что смогу рассмотреть его с разных ракурсов."
10129-101290470 = "Только поэтому."
10129-101290480 = "Так что, если вы могли бы отправить мне снятое видео..."
10129-101290490 = "Но после отправки всё равно удалите его!"
10129-101290500 = "Обещай!"
10129-101290510 = "Здравствуйте, Сенсей, это Сузуми."
10129-101290520 = "Вы знаете, что такое «фан-конвенты»?"
10129-101290530 = "У меня по ним докторская степень."
10129-101290540 = "У меня по ним магистратура."
10129-101290550 = "Что?"
10129-101290560 = "Тогда вы наверняка хорошо разбираетесь."
10129-101290570 = "В Отряд вигилантов поступило сообщение."
10129-101290580 = "На одном фан-конвенте хулиганы устроили переполох."
10129-101290590 = "Поэтому я хотела попросить у вас совета."
10129-101290600 = "Лучше не выделяться."
10129-101290610 = "Оденься так, чтобы слиться с толпой!"
10129-101290620 = "Понятно."
10129-101290630 = "Принято."
10129-101290640 = "Мне тоже интересно побывать на этом «фан-конвенте»."
10129-101290650 = "Не хотите пойти со мной, Сенсей?"
10129-101290660 = "Уверена, вы сможете помочь."
10129-101290670 = "Спасибо. Скоро увидимся."
10129-101290680 = "Эм, это не какой-то важный вопрос."
10129-101290690 = "Но я кажусь страшной или пугающей?"
10129-101290700 = "Когда я раньше разбиралась с нарушителями,"
10129-101290710 = "выражения лиц людей вокруг были немного..."
10129-101290720 = "По-моему, это выглядело круто!"
10129-101290730 = "Может, они просто удивились."
10129-101290740 = "Вот как..."
10129-101290750 = "К сожалению, тогда мне не пришло в голову ничего лучше."
10129-101290760 = "Может, снова вставить английскую булавку?"
10129-101290770 = "А."
10129-101290780 = "Так тоже можно было."
10129-101290790 = "Запомню на следующий раз."
10129-101290800 = "Это Сузуми, Сенсей."
10129-101290810 = "Вы случайно не заняты на этих выходных?"
10129-101290820 = "У меня ничего не запланировано!"
10129-101290830 = "Понятно."
10129-101290840 = "В таком случае, не хотите"
10129-101290850 = "сходить со мной в парк развлечений на этих выходных?"
10129-101290860 = "О-о, звучит здорово!"
10129-101290870 = "Спасибо."
10129-101290880 = "Спасибо, что всегда выполняете"
10129-101290890 = "мои внезапные просьбы."
10129-101290900 = "Это Сузуми, Сенсей."
10129-101290910 = "Спасибо, что всегда меня поддерживаете."
10129-101290920 = "Особенно в последнее время."
10129-101290930 = "..."
10129-101290940 = "Надеюсь и дальше работать с вами."
10129-101290950 = "Это мне в радость, Сузуми!"
10129-101290960 = "Ты и дальше будешь защищать меня, Термит Уайт?"
10129-101290970 = "Тогда у меня просто не было выбора, кроме как подыграть!"
10129-101290980 = "..."
10129-101290990 = "Конечно, где бы и когда бы это ни было,"
10129-101291000 = "я защищу вас, Сенсей."
10129-101291010 = "...До тех пор, Сенсей."
