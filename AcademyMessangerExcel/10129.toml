[translation]
10129-101290010 = "Здравствуйте, Сенсей. Это Сузуми."
10129-101290020 = "Как у вас дела?"
10129-101290030 = "Сузуми! Как ты?"
10129-101290040 = "Хорошо, спасибо."
10129-101290050 = "Я хотела кое-что спросить..."
10129-101290060 = "До которого часа можно пользоваться комнатой отдыха в Шале?"
10129-101290070 = "Особого ограничения нет."
10129-101290080 = "Можешь оставаться сколько хочешь."
10129-101290090 = "Поняла."
10129-101290100 = "Есть какие-то правила пользования?"
10129-101290110 = "Ну, разве что выключать свет, когда уходишь."
10129-101290120 = "Поняла."
10129-101290130 = "Спасибо."
10129-101290140 = "Сенсей, эм..."
10129-101290150 = "Повторюсь, но..."
10129-101290160 = "тот наряд не имеет отношения к моим личным предпочтениям!"
10129-101290170 = "А мне он нравится!"
10129-101290180 = "еfs#'8k6avb$"
10129-101290190 = "Прошу прощения."
10129-101290200 = "Я уронила телефон."
10129-101290210 = "Это всего лишь продолжение моего задания в отряде самообороны!"
10129-101290220 = "Пожалуйста, не поймите меня превратно!"
10129-101290230 = "Я понял!"
10129-101290240 = "... И ещё"
10129-101290250 = "спасибо, что похвалили."
10129-101290260 = "Тогда, до встречи..."
10129-101290270 = "Сенсей, это Сузуми."
10129-101290280 = "Мне нужно кое-что спросить..."
10129-101290290 = "У меня немного порвалась одежда."
10129-101290300 = "Не подскажете ли вы хорошую мастерскую по ремонту, куда вы обычно обращаетесь?"
10129-101290310 = "Есть хорошая мастерская рядом с Шале!"
10129-101290320 = "Есть одна, куда я часто хожу!"
10129-101290330 = "Спасибо."
10129-101290340 = "Если вы рекомендуете, значит, там точно хорошо."
10129-101290350 = "Буду рада, если мы ещё увидимся."
10129-101290360 = "Сенсей,"
10129-101290370 = "то видео, что было недавно,"
10129-101290380 = "оно ещё у вас?"
10129-101290390 = "Я как раз собирался его удалить."
10129-101290400 = "Оставить?"
10129-101290410 = "Нет! Не надо!"
10129-101290420 = "Разумеется, я хочу, чтобы вы его удалили!"
10129-101290430 = "Но... Дефекты одежды"
10129-101290440 = "на видео видны лучше."
10129-101290450 = "То, что не заметила при примерке,"
10129-101290460 = "видно сразу."
10129-101290470 = "Вот и всё."
10129-101290480 = "Не могли бы вы отправить мне то видео?"
10129-101290490 = "А после отправки — удалите его!"
10129-101290500 = "Обязательно!"
10129-101290510 = "Сенсей, это Сузуми."
10129-101290520 = "Вы знаете, что такое «додзин-ивент»?"
10129-101290530 = "Это моя стихия."
10129-101290540 = "Моя специализация."
10129-101290550 = "Ну, то есть"
10129-101290560 = "вы в этом разбираетесь."
10129-101290570 = "В отряд самообороны поступило сообщение,"
10129-101290580 = "что хулиганы мешают проведению додзин-ивента."
10129-101290590 = "И я хотела попросить у вас совета."
10129-101290600 = "Тогда лучше не привлекать внимания."
10129-101290610 = "Нужно одеться соответственно месту."
10129-101290620 = "Понятно."
10129-101290630 = "Это было полезно."
10129-101290640 = "Я тоже пойду!"
10129-101290650 = "Вы тоже пойдёте?"
10129-101290660 = "С вами я чувствую себя увереннее."
10129-101290670 = "Тогда увидимся позже."
10129-101290680 = "Можно задать странный вопрос..."
10129-101290690 = "У меня действительно страшное лицо?"
10129-101290700 = "Во время недавнего подавления"
10129-101290710 = "мне показалось, что люди вокруг испугались..."
10129-101290720 = "Ты была крута, Сузуми!"
10129-101290730 = "Они просто немного удивились."
10129-101290740 = "Понятно."
10129-101290750 = "Тогда мне просто не пришло в голову другого способа..."
10129-101290760 = "Может, лучше было поправить булавку?"
10129-101290770 = "А"
10129-101290780 = "Точно."
10129-101290790 = "В следующий раз учту."
10129-101290800 = "Сенсей, это Сузуми."
10129-101290810 = "Можно узнать ваши планы на эти выходные?"
10129-101290820 = "Особых планов нет."
10129-101290830 = "Вот как."
10129-101290840 = "Если вы не против, не хотите ли"
10129-101290850 = "пойти со мной в парк аттракционов?"
10129-101290860 = "С удовольствием!"
10129-101290870 = "Я рада, что вы согласились."
10129-101290880 = "Спасибо, что всегда находите для меня время."
10129-101290890 = "Тогда место встречи я сообщу позже."
10129-101290900 = "Сенсей, это Сузуми."
10129-101290910 = "Ещё раз, спасибо вам большое за ваши тёплые слова."
10129-101290920 = "Они меня очень вдохновляют."
10129-101290930 = "..."
10129-101290940 = "Буду и дальше рассчитывать на вас."
10129-101290950 = "И я на тебя, Сузуми!"
10129-101290960 = "Ты и дальше будешь меня защищать? Термит Уайт!"
10129-101290970 = "С-Сенсей! Я говорю это только по долгу службы...!"
10129-101290980 = "..."
10129-101290990 = "Конечно, в любое время и в любом месте"
10129-101291000 = "я буду защищать вас, Сенсей, но..."
10129-101291010 = "... до новой встречи."