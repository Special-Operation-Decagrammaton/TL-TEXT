[translation]
10014-2506 = "В последнее время я не могу спать от беспокойства."
10014-2507 = "Что тебя беспокоит?"
10014-2508 = "Я постараюсь помочь."
10014-2509 = "Я знала, что на тебя можно рассчитывать!"
10014-2510 = "Вы всегда рядом, когда нужны!"
10014-2511 = "Но всё нормально."
10014-2512 = "Я уже обо всём позаботилась!"
10014-2513 = "Правда?"
10014-2514 = "Да!"
10014-2515 = "Моя цель — стать ниндзя."
10014-2516 = "Так что действовать важнее, чем спать!"
10014-2517 = "С сегодняшнего дня буду вести себя как ниндзя!"
10014-2518 = "Я справлюсь! Нин-нин!"
10014-2519 = "Только не поранься."
10014-2520 = "Хи-хи-хи. Хорошо!"
10014-2521 = "Я приняла ваш совет близко к сердцу, господин."
10014-2522 = "Какой совет?"
10014-2523 = "То, что вы сказали мне в прошлый раз..."
10014-2524 = "Что следовать за людьми — плохо!"
10014-2525 = "Я такое говорил?"
10014-2526 = "Да, наверное, я и правда это говорил..."
10014-2527 = "Так что отныне"
10014-2528 = "я, Изуна, перестану тайно сопровождать вас, господин!"
10014-2529 = "Хорошо..."
10014-2530 = "Вместо этого я начну сопровождать вас открыто!"
10014-2531 = "До встречи, господин!"
10014-2532 = "А?"
10014-2533 = "Господин! Господин!"
10014-2534 = "Срочные новости! Это невероятно!"
10014-2535 = "Что происходит?"
10014-2536 = "Мне удалось достать историческую драму про ниндзя! Одну из моих любимых!"
10014-2537 = "Историческую драму?"
10014-2538 = "Да!"
10014-2539 = "Её было очень трудно достать!"
10014-2540 = "Посмотрите её вместе с Изуной! Пожалуйста?"
10014-2541 = "Я устрою просмотр у себя дома!"
10014-2542 = "Хорошо, конечно."
10014-2543 = "Правда?!"
10014-2544 = "Хи-хи! Я буду ждать!"
10014-2545 = "Я так рада, что смогла узнать больше о вас и ниндзя!"
10014-2546 = "Я буду становиться всё лучшим ниндзя с каждым днём!"
10014-2547 = "Х-Хорошо..."
10014-2548 = "Самое важное для ниндзя..."
10014-2549 = "Я, Изуна, думаю, что это постоянные и усердные тренировки, господин!"
10014-2550 = "Да, тренировки очень важны."
10014-2551 = "В здоровом теле — здоровый дух."
10014-2552 = "Да, именно как вы и говорили!"
10014-2553 = "Так что, чтобы стать настоящим ниндзя..."
10014-2554 = "Когда я ем или гуляю..."
10014-2555 = "Даже когда сплю, я буду исследовать окружающий мир!"
10014-2556 = "Звучит немного сурово!"
10014-2557 = "Но иначе никак!"
10014-2558 = "Так что, господин..."
10014-2559 = "Не присоединитесь ли вы ко мне в исследовании мира ниндзя?"
10014-2560 = "Ну... ладно."
10014-2561 = "Ура! Получилось!"
10014-2562 = "Спасибо, что присоединились к сегодняшней миссии, господин!"
10014-2563 = "Сегодня это была не совсем миссия, Изуна..."
10014-2564 = "О! По телевизору идёт новая историческая драма!"
10014-2565 = "До скорого!"
10014-2566 = "Нин-нин!"
10014-2567 = "Хм..."
