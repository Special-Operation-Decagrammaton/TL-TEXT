[translation]
10014-2506 = "Господин. Изуна в последнее время не может уснуть из-за переживаний..."
10014-2507 = "Переживаний?"
10014-2508 = "Если я могу помочь, я выслушаю."
10014-2509 = "Вот это да, как и ожидалось от Господина...!"
10014-2510 = "Когда Изуна страдает, вы сразу же откликаетесь!"
10014-2511 = "...Спасибо вам!"
10014-2512 = "Мои переживания разрешились!"
10014-2513 = "Уже разрешились!?"
10014-2514 = "Да!"
10014-2515 = "Ведь Изуна стремится стать ниндзя."
10014-2516 = "Поэтому, как и Господин, нужно действовать быстро — сначала действовать, а не переживать!"
10014-2517 = "Так что с сегодняшнего дня я буду ещё больше похожа на ниндзя!"
10014-2518 = "Прежде всего, я начну с практики! Нин-нин!"
10014-2519 = "Только не делай ничего опасного, чтобы не пораниться."
10014-2520 = "Хе-хе, да!"
10014-2521 = "Изуна глубоко запечатлела в сердце ваше недавнее предостережение."
10014-2522 = "Предостережение? О чём ты?"
10014-2523 = "В прошлый раз вы говорили..."
10014-2524 = "что следить без разрешения — нехорошо!"
10014-2525 = "Извини, я, возможно, не помню..."
10014-2526 = "Ах, да, было такое..."
10014-2527 = "Я переосмыслила ваши слова, сказанные тогда."
10014-2528 = "Изуна больше не будет тайно охранять вас!"
10014-2529 = "А, ну, хорошо..."
10014-2530 = "Вместо этого с сегодняшнего дня я буду охранять вас открыто!"
10014-2531 = "Тогда до встречи!"
10014-2532 = "Что...?"
10014-2533 = "Господин! Господин!"
10014-2534 = "Срочные новости! Особые новости! Чрезвычайное происшествие!"
10014-2535 = "Ты так взволнована, что случилось?"
10014-2536 = "Я наконец-то заполучила любимую серию исторических драм про ниндзя!"
10014-2537 = "Историческая драма — это старые фильмы?"
10014-2538 = "Да!"
10014-2539 = "Это редкая классика, которую трудно достать!"
10014-2540 = "Вы ведь посмотрите её вместе со мной, да? Господин!"
10014-2541 = "Давайте устроим просмотр у Изуны дома!"
10014-2542 = "Хорошо, тогда я зайду."
10014-2543 = "Благодарю вас!"
10014-2544 = "Хе-хе! Я буду ждать!"
10014-2545 = "Я была рада узнать больше о ниндзя вместе с Господином!"
10014-2546 = "В следующий раз я встречусь с вами ещё более совершенным ниндзя, Господин!"
10014-2547 = "Д-да, наверное...?"
10014-2548 = "Самое важное для ниндзя..."
10014-2549 = "Я думаю, это постоянно быть в боевой готовности и тренироваться без отдыха!"
10014-2550 = "Тренировки действительно важны."
10014-2551 = "Говорят, в здоровом теле здоровый дух."
10014-2552 = "Да, вы правы!"
10014-2553 = "Чтобы стать настоящим ниндзя..."
10014-2554 = "Даже когда идёшь, ешь"
10014-2555 = "или крепко спишь, нужно сохранять настрой и дух тренировки!"
10014-2556 = "Даже во сне!?"
10014-2557 = "Да! Именно так! Круглые сутки!"
10014-2558 = "Поэтому, Господин...!"
10014-2559 = "Чтобы ещё глубже постичь путь ниндзя, не поможете ли вы Изуне в тренировках!"
10014-2560 = "Хорошо. Хотя я не совсем понимаю, но согласен."
10014-2561 = "Ура! Спасибо!"
10014-2562 = "Спасибо, что помогли с тренировкой сегодня! Господин!"
10014-2563 = "Пожалуйста. Кстати, сегодняшнее — это вообще-то тренировка или..."
10014-2564 = "Ах, историческая драма начинается!"
10014-2565 = "Тогда увидимся позже!"
10014-2566 = "Нин-нин!"
10014-2567 = "А, да. До встречи..."
