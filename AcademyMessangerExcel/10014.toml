[translation]
10014-2506 = "Mestre. Ultimamente a Izuna está com uma preocupação que não a deixa dormir à noite..."
10014-2507 = "Uma preocupação?"
10014-2508 = "Se quiser desabafar comigo, estou todo ouvidos."
10014-2509 = "C-Como esperado do meu Mestre...!"
10014-2510 = "Basta a Izuna estar em apuros que o senhor responde na mesma hora!"
10014-2511 = "...Muito obrigada!"
10014-2512 = "Minha preocupação já foi resolvida!"
10014-2513 = "Já resolveu assim do nada?!"
10014-2514 = "Sim!"
10014-2515 = "Afinal, a Izuna almeja se tornar uma grande ninja."
10014-2516 = "Portanto, devo agir com rapidez igual ao Sensei: menos preocupação e mais ação!"
10014-2517 = "Sendo assim, a partir de hoje serei ainda mais ninja!"
10014-2518 = "Vou partir direto para a prática, nin-nin!"
10014-2519 = "Só toma cuidado pra não fazer nada perigoso e se machucar, viu?"
10014-2520 = "Ehehe, pode deixar!"
10014-2521 = "A Izuna gravou fundo no coração o conselho que o Mestre lhe deu outro dia."
10014-2522 = "Conselho? Do que mesmo a gente tava falando...?"
10014-2523 = "Sobre o que o Mestre me disse daquela vez..."
10014-2524 = "Que seguir as pessoas escondida sem permissão não é certo!"
10014-2525 = "Foi mal, acho que não tô lembrado disso...?"
10014-2526 = "Ah, bem que rolou isso mesmo..."
10014-2527 = "Refleti profundamente sobre as sábias palavras que recebi do Mestre naquela ocasião."
10014-2528 = "De hoje em diante, a Izuna não vai mais escoltar o Mestre às escondidas!"
10014-2529 = "Ah, que bom..."
10014-2530 = "Em vez disso, a partir de hoje vou escoltá-lo bem na sua frente!"
10014-2531 = "Até já!"
10014-2532 = "Hã...?"
10014-2533 = "Mestre! Mestre!"
10014-2534 = "Plantão urgente! Notícia bombástica! É um caso gravíssimo!"
10014-2535 = "Por que toda essa empolgação? O que houve?"
10014-2536 = "Finalmente consegui a coleção completa da minha série histórica de ninjas favorita!"
10014-2537 = "Série histórica? Aquelas novelas de época?"
10014-2538 = "Isso mesmo!"
10014-2539 = "É uma obra-prima super rara de encontrar!"
10014-2540 = "O senhor vai assistir comigo, não vai, Mestre?!"
10014-2541 = "Vamos fazer uma maratona lá na casa da Izuna!"
10014-2542 = "Beleza, então vou aceitar o convite."
10014-2543 = "M-Muito obrigada!"
10014-2544 = "Ehehe! Estarei esperando ansiosamente!"
10014-2545 = "Fiquei tão feliz de poder aprender ainda mais sobre os ninjas ao lado do meu Mestre!"
10014-2546 = "Na próxima vez que nos virmos, a Izuna será uma ninja ainda mais perfeita, Mestre!"
10014-2547 = "É-É mesmo, né...?"
10014-2548 = "A coisa mais importante para um ninja..."
10014-2549 = "É continuar treinando sem descanso no dia a dia, mantendo sempre o espírito de prontidão para o combate!"
10014-2550 = "É verdade, treinar com constância é fundamental."
10014-2551 = "Dizem que mente sã habita em corpo são, né?"
10014-2552 = "Sim, exatamente isso!"
10014-2553 = "Para me tornar uma verdadeira ninja..."
10014-2554 = "Seja caminhando no dia a dia, seja na hora das refeições,"
10014-2555 = "ou até mesmo dormindo profundamente, jamais devo perder a postura e o espírito de treinamento!"
10014-2556 = "Até dormindo?!"
10014-2557 = "Sim! Exatamente! São 24 horas por dia!"
10014-2558 = "Por isso mesmo, Mestre...!"
10014-2559 = "Para que eu possa avançar ainda mais no caminho ninja, o senhor me acompanharia no meu treinamento?!"
10014-2560 = "Tá bom. Ainda não entendi muito bem como vai ser, mas topo sim."
10014-2561 = "Ebaaa! Muito obrigada!"
10014-2562 = "Muito obrigada por me acompanhar no treinamento de hoje, Mestre!"
10014-2563 = "Por nada. Aliás, aquilo que a gente fez hoje era mesmo um treino...?"
10014-2564 = "Ah, o episódio da série de ninjas já vai começar!"
10014-2565 = "Nos falamos mais tarde!"
10014-2566 = "Nin-nin!"
10014-2567 = "T-Tá bom. Até mais tarde..."
