[translation]
20012-200120010 = "Клуб экстренной медицинской помощи, район Геенны 122-6: ущерб в результате перестрелки между нарушителями. Пострадавшим и другим студентам, посещающим район, следует обратиться в Клуб экстренной медицинской помощи. Остальным рекомендуется избегать этого района. 14:16"
20012-200120020 = "...?"
20012-200120030 = "А? Сэна?"
20012-200120040 = "А."
20012-200120050 = "Простите. Это групповое сообщение. Но, пожалуйста, не беспокойтесь."
20012-200120060 = "Сенсей, это Химуро Сэна из Клуба экстренной медицинской помощи."
20012-200120070 = "Меня проинформировали о ситуации. Вы посещаете Геенну по важному делу."
20012-200120080 = "Да, но я плохо себя чувствую..."
20012-200120090 = "Так что, возможно, приду пораньше и сразу с этим разберусь."
20012-200120100 = "Понимаю."
20012-200120110 = "Буду иметь в виду."
20012-200120120 = "Сенсей, это Сэна. Вы отдыхаете, поэтому буду краткой."
20012-200120130 = "Вы сильно вспотели, так что пейте достаточно воды. Пожалуйста, примите лекарство, которое я оставила на столе. Одеяло и полотенце, которыми я вас накрыла, влажные. Обязательно сразу постирайте их. Позже я зайду забрать их. До встречи."
20012-200120140 = "Сенсей, это Химуро Сэна из Клуба экстренной медицинской помощи."
20012-200120150 = "Я хотела бы зайти в Шале и забрать одеяло и полотенце. Сообщите, когда будете свободны. Спасибо."
20012-200120160 = "Я хочу как-то отплатить вам."
20012-200120170 = "Почему бы нам не встретиться где-нибудь вне клуба?"
20012-200120180 = "...?"
20012-200120190 = "Хм."
20012-200120200 = "Поняла."
20012-200120210 = "Хорошо."
20012-200120220 = "Клуб экстренной медицинской помощи, район Геенны 32-1: студенты, игравшие с огнетушителем, устроили аварию. Виновницы и некоторые пострадавшие принудительно доставлены в ближайший медпункт. 18:47"
20012-200120230 = "Клуб экстренной медицинской помощи: экстренная бригада в ожидании, ситуация не разрешена. Просим посетителей выбрать обходной путь или перенести визит. 18:47"
20012-200120240 = "Ты усердно работаешь."
20012-200120250 = "Ты всегда занята."
20012-200120260 = "А."
20012-200120270 = "Такая уж работа, Сенсей. Не нужно об этом переживать."
20012-200120280 = "Что ж. До следующей встречи."
