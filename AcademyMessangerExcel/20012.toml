[translation]
20012-200120010 = "Do Clube de Medicina de Emergência para todas as alunas de Gehenna: Conflito generalizado entre delinquentes em andamento na Rua 122-6 do Distrito Autônomo de Gehenna. Feridas devem se dirigir ao Clube de Medicina de Emergência. Recomendamos a quem planejava visitar a área que reagende seu compromisso. PM 02:16"
20012-200120020 = "...?"
20012-200120030 = "Sena?"
20012-200120040 = "Ah."
20012-200120050 = "Desculpe. Era um comunicado geral, não precisa se preocupar."
20012-200120060 = "Sensei. Aqui é Himuro Sena, do Clube de Medicina de Emergência."
20012-200120070 = "Fiquei sabendo que você virá a Gehenna mais tarde."
20012-200120080 = "Sim, mas não estou me sentindo muito bem hoje..."
20012-200120090 = "Capaz de eu precisar dar uma passada aí com você antes mesmo de resolver os meus compromissos..."
20012-200120100 = "Compreendido."
20012-200120110 = "Estarei aguardando."
20012-200120120 = "Sensei, aqui é Himuro Sena, do Clube de Medicina de Emergência. Estou indo embora, mas deixarei esta mensagem."
20012-200120130 = "Como você suou bastante, hidrate-se bem assim que acordar e tome o remédio que deixei sobre a mesa. Há toalhas limpas logo ao lado. Voltarei em breve para recolher tudo e lavar. Com licença."
20012-200120140 = "Sensei, aqui é Himuro Sena, do Clube de Medicina de Emergência."
20012-200120150 = "Pretendo passar na Schale hoje para recolher as toalhas e os outros itens do outro dia. Por favor, informe-me quando tiver um horário livre. Agradeço desde já."
20012-200120160 = "Muito obrigado pela ajuda no outro dia."
20012-200120170 = "Queria aproveitar para agradecer direito. Podemos nos encontrar lá fora?"
20012-200120180 = "Ah."
20012-200120190 = "Sim."
20012-200120200 = "Compreendido."
20012-200120210 = "Faremos assim, então."
20012-200120220 = "Do Clube de Medicina de Emergência para todas as alunas de Gehenna: Acidente com explosão de extintor de incêndio causado por trote na Rua 32-1 do Distrito Autônomo de Gehenna. A responsável pelo incidente e parte das alunas feridas foram encaminhadas à enfermaria mais próxima. PM 06:47"
20012-200120230 = "Do Clube de Medicina de Emergência para todas as alunas de Gehenna: Como a situação ainda não foi controlada, nossa equipe permanece de prontidão nas imediações. Recomendamos a quem planejava visitar a área que reagende seu compromisso. PM 06:47"
20012-200120240 = "Que correria, hein."
20012-200120250 = "Bom trabalho hoje também."
20012-200120260 = "Ah."
20012-200120270 = "Não se preocupe, não chega a ser uma ocorrência tão grave."
20012-200120280 = "Até mais, então."
