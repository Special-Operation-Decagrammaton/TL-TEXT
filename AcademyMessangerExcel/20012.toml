[translation]
20012-200120010 = "От Медицинского отделения всем ученицам Геенны: В районе 122-6 Геенны произошла массовая стычка недисциплинированных учениц. Раненых направляйте в Медицинское отделение. Тем, кто планирует посетить этот район, рекомендуем перенести визит. 14:16"
20012-200120020 = "...?"
20012-200120030 = "Сена?"
20012-200120040 = "Ах"
20012-200120050 = "Прошу прощения. Это сообщение для всех, не обращайте внимания."
20012-200120060 = "Сенсей. Я Химуро Сена из Медицинского отделения."
20012-200120070 = "Я слышала, что вы собираетесь прийти в Гэхенну позже."
20012-200120080 = "Да, но я чувствую себя неважно..."
20012-200120090 = "Возможно, мне придётся обратиться к вам раньше, чем по основному делу..."
20012-200120100 = "Поняла."
20012-200120110 = "Тогда я буду ждать."
20012-200120120 = "Сенсей, это Химуро Сена из Медицинского отделения. Я оставлю сообщение и уйду."
20012-200120130 = "Вы сильно вспотели, поэтому когда проснётесь, обязательно выпейте воды и примите лекарство на столе. Запасное полотенце рядом. Скоро я приду забрать всё и постираю. До свидания."
20012-200120140 = "Сенсей, это Химуро Сена из Медицинского отделения."
20012-200120150 = "Сегодня я планирую зайти в Шале, чтобы забрать те вещи. Сообщите, когда вам будет удобно. Спасибо."
20012-200120160 = "Спасибо за прошлый раз."
20012-200120170 = "Раз уж так, я хотела бы вас отблагодарить. Можем встретиться?"
20012-200120180 = "Ах"
20012-200120190 = "Да."
20012-200120200 = "Договорились."
20012-200120210 = "Тогда так и сделаем."
20012-200120220 = "От Медицинского отделения всем ученицам Геенны: В районе 32-1 Геенны из-за шалости произошло самопроизвольное срабатывание огнетушителей. Организаторы и часть пострадавших учениц доставлены в ближайший медпункт. 18:47"
20012-200120230 = "От Медицинского отделения всем ученицам Геенны: Ситуация пока не успокоилась, персонал находится поблизости в режиме ожидания. Тем, кто планирует посетить этот район, рекомендуем перенести визит. 18:47"
20012-200120240 = "Тяжело вам, наверное."
20012-200120250 = "Спасибо за сегодня."
20012-200120260 = "Ах"
20012-200120270 = "Всё в порядке, это не настолько серьёзное происшествие."
20012-200120280 = "Тогда до встречи."