[translation]
10048-100480010 = "Сенсей."
10048-100480020 = "Саори!?"
10048-100480030 = "Ты написала мне...!"
10048-100480040 = "Чего так удивляться..."
10048-100480050 = "Я и сама не планировала писать,"
10048-100480060 = "но возникла небольшая проблема."
10048-100480070 = "Проблема?"
10048-100480080 = "Проблема, которую не решить без вас..."
10048-100480090 = "Понимаю, что нагло с моей стороны. Но"
10048-100480100 = "Хорошо, я сейчас приду!"
10048-100480110 = "...Понятно."
10048-100480120 = "Тогда я буду ждать."
10048-100480130 = "...Сегодня хорошая погода."
10048-100480140 = "!?"
10048-100480150 = "Что такое, Сенсей?"
10048-100480160 = "Саори говорит о погоде..."
10048-100480170 = "Я удивлён!"
10048-100480180 = "...Я тоже иногда могу поболтать о пустяках."
10048-100480190 = "На днях благодаря вам мне удалось открыть счёт."
10048-100480200 = "Я стала принимать разные заказы и просто подумала, что стоит рассказать вам о своих делах."
10048-100480210 = "Если вас это раздражает, я больше не буду."
10048-100480220 = "Нет, вовсе нет! Мне интересно узнать, как у тебя дела! Что было в последнее время!?"
10048-100480230 = "Ты слишком громко говоришь... В последнее время я выполняю заказы, которые нахожу через Чёрный рынок."
10048-100480240 = "Отлично!"
10048-100480250 = "Хорошо ли... не знаю."
10048-100480260 = "Но, возможно, это хорошо."
10048-100480270 = "Если что-то ещё случится, я напишу."
10048-100480280 = "Ах..."
10048-100480290 = "Я учла прошлую ошибку."
10048-100480300 = "На этот раз по заказу"
10048-100480310 = "у меня есть правильно оформленный контракт."
10048-100480320 = "Это замечательно!"
10048-100480330 = "И что за заказ на этот раз?"
10048-100480340 = "Задание оказалось проще, чем я думала."
10048-100480350 = "Просто прекратить разборки на Чёрном рынке."
10048-100480360 = "!?"
10048-100480370 = "Сенсей, если вы знаете кого-то,"
10048-100480380 = "не могли бы вы посоветовать хорошего мастера по ремонту?"
10048-100480390 = "Снаряжение сломалось."
10048-100480400 = "Какого типа снаряжение?"
10048-100480410 = "Это..."
10048-100480420 = "...Сложно объяснить словами."
10048-100480430 = "Будет быстрее, если я покажу."
10048-100480440 = "Я направляюсь в Шале."
