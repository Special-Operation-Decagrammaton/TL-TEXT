[translation]
10048-100480010 = "Сенсей."
10048-100480020 = "О, Саори? Саори?!"
10048-100480030 = "Не ожидал от тебя сообщения!"
10048-100480040 = "...Не обязательно так шуметь."
10048-100480050 = "Я не собиралась тебе писать, но..."
10048-100480060 = "кажется, возникла небольшая проблема."
10048-100480070 = "Проблема?"
10048-100480080 = "Я не знаю больше никого, кто мог бы помочь."
10048-100480090 = "Знаю, что это бесстыдно с моей стороны, но..."
10048-100480100 = "Хорошо. Сейчас буду."
10048-100480110 = "О... ладно."
10048-100480120 = "Тогда буду ждать."
10048-100480130 = "Эм, Сенсей, сегодня хороший день."
10048-100480140 = "А...?!"
10048-100480150 = "Что случилось, Сенсей?"
10048-100480160 = "Не могу поверить, что ты только что заговорила о погоде."
10048-100480170 = "Я в шоке!"
10048-100480180 = "Ничего особенного..."
10048-100480190 = "Благодаря твоей прошлой помощи я открыла счёт."
10048-100480200 = "Я ещё и начала работать, так что просто хотела немного рассказать, как у меня дела."
10048-100480210 = "Если тебе неинтересно, перестану."
10048-100480220 = "Нет, да! Я хочу услышать! Что нового?!"
10048-100480230 = "Ты слишком воодушевлён... Эм, я работаю на задании, которое получила на Чёрном рынке."
10048-100480240 = "Это хорошо!"
10048-100480250 = "Не знаю, хорошо ли..."
10048-100480260 = "Хотя, наверное, хорошо."
10048-100480270 = "Может, поговорим ещё раз позже, Сенсей."
10048-100480280 = "О, а...?"
10048-100480290 = "Сенсей, я учла прошлую ошибку."
10048-100480300 = "Для работы, которую получила на Чёрном рынке,"
10048-100480310 = "я обязательно подписала контракт."
10048-100480320 = "Да? Отлично!"
10048-100480330 = "И что это за работа?"
10048-100480340 = "Довольно простое задание."
10048-100480350 = "Нужно положить конец одной проблеме, с которой давно мучается Чёрный рынок."
10048-100480360 = "С-С-Саори?!"
10048-100480370 = "Сенсей. Возможно, это маловероятно, но у меня есть вопрос."
10048-100480380 = "Ты случайно не знаешь хорошего мастера по ремонту?"
10048-100480390 = "Есть оборудование, которое я очень хочу починить..."
10048-100480400 = "Хм? Что именно?"
10048-100480410 = "Это..."
10048-100480420 = "В MomoTalk объяснять немного сложно."
10048-100480430 = "Я приду туда, где ты находишься,"
10048-100480440 = "и поговорим лично."
