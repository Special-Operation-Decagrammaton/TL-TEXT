[translation]
10048-100480010 = "Sensei"
10048-100480020 = "Saori!?"
10048-100480030 = "Você me mandando mensagem, Saori...!"
10048-100480040 = "É motivo para tanto espanto assim...?"
10048-100480050 = "Eu também não tinha intenção de entrar em contato, mas"
10048-100480060 = "surgiu um pequeno problema."
10048-100480070 = "Um problema?"
10048-100480080 = "É um problema que só você pode resolver, Sensei..."
10048-100480090 = "Sei muito bem que é abuso da minha parte. Contudo..."
10048-100480100 = "Entendi, já estou indo!"
10048-100480110 = "...Certo."
10048-100480120 = "Estarei esperando, então."
10048-100480130 = "...O tempo está bom hoje."
10048-100480140 = "!?"
10048-100480150 = "O que foi, Sensei?"
10048-100480160 = "A Saori puxando assunto sobre o tempo..."
10048-100480170 = "Que surpresa!"
10048-100480180 = "...Até eu sinto vontade de jogar conversa fora às vezes."
10048-100480190 = "Outro dia, graças a você, consegui abrir uma conta bancária."
10048-100480200 = "Como também passei a aceitar vários serviços, pensei em pelo menos dar notícias de como andam as coisas."
10048-100480210 = "Se isso te incomoda, vou evitar daqui para frente."
10048-100480220 = "Claro que não incomoda! Quero muito saber como você está, Saori! O que tem acontecido ultimamente!?"
10048-100480230 = "Que exagero... Ultimamente tenho cumprido serviços indicados pelo Mercado Negro."
10048-100480240 = "Que ótimo!"
10048-100480250 = "Se é ótimo ou não, eu já não sei, mas..."
10048-100480260 = "Bom, pode ser. Talvez seja algo bom mesmo."
10048-100480270 = "Se surgir mais alguma novidade, entro em contato."
10048-100480280 = "Ah..."
10048-100480290 = "Refleti sobre o que aconteceu outro dia."
10048-100480300 = "Quanto ao serviço desta vez,"
10048-100480310 = "já assinei um contrato formal direitinho."
10048-100480320 = "Que maravilha!"
10048-100480330 = "E que tipo de serviço é dessa vez?"
10048-100480340 = "Foi uma missão mais simples do que eu esperava."
10048-100480350 = "Basta pôr fim a uma guerra de facções no Mercado Negro."
10048-100480360 = "!?"
10048-100480370 = "Sensei, só caso você conheça alguém,"
10048-100480380 = "sabe de algum mecânico habilidoso para consertos?"
10048-100480390 = "Meu equipamento acabou quebrando."
10048-100480400 = "Que tipo de equipamento?"
10048-100480410 = "Bem..."
10048-100480420 = "...É meio difícil de explicar por aqui."
10048-100480430 = "Pessoalmente é mais rápido."
10048-100480440 = "Estou indo para a Schale."
