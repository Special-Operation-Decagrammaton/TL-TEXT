[translation]
23006-2449 = "«～Хякуядо × Клубничный рай Кивотоса～ Специальная коллаборация!»"
23006-2450 = "«Клубничный дайфуку, клубничный дораяки, клубничные мандзю, клубничные яцухаси! И даже клубничный анмицу!»"
23006-2451 = "«Насладитесь коллаборацией «Клубничного рая Кивотоса», где собрана клубника со всего Кивотоса, и традиционного кафе «Хякуядо»!»"
23006-2452 = "«Мероприятие продлится неделю, начиная с сегодняшнего дня, обязательно заходите!»"
23006-2453 = "«При предъявлении этого сообщения при посещении вы получите скидку 10%!»"
23006-2454 = "«Тогда ждём вас в Хякуядо! Нян-нян!»"
23006-2455 = "Эм...?"
23006-2456 = "Нян-нян...?"
23006-2457 = "Хе-хе-хе, Сенсей!"
23006-2458 = "Как я и говорила, в Хякуядо сейчас проходит мероприятие!"
23006-2459 = "Раз уж так, я хотела бы как следует принять вас в этот раз."
23006-2460 = "Вы ведь придёте?"
23006-2461 = "Дай-ка проверю расписание..."
23006-2462 = "Вы ведь придёте?"
23006-2463 = "Если просишь ты, Шизуко!"
23006-2464 = "Хе-хе-хе! Спасибо вам!"
23006-2465 = "Буду ждать!"
23006-2466 = "В этот раз я многое испортила, но"
23006-2467 = "в следующий раз я обязательно вас покорю!"
23006-2468 = "Силой своей неуклюжести!"
23006-2469 = "Если ты это говоришь заранее, то это уже не «неуклюжесть», разве нет...?"
23006-2470 = "Готовьтесь!"
23006-2471 = "Эм, да..."
23006-2472 = "Сенсей..."
23006-2473 = "Я, я..."
23006-2474 = "Шизуко, я больше не могу терпеть..."
23006-2475 = "Тогда лучше сходи пораньше."
23006-2476 = "После не забудь помыть руки."
23006-2477 = "Что вы говорите такой популярной хозяйке!?"
23006-2478 = "И вообще, вы думаете, я стала бы такое обсуждать в Момотолке!?"
23006-2479 = "Ах, ну вот, всё..."
23006-2480 = "Эм, так вот, Сенсей. Шизуко, она..."
23006-2481 = "Ты хочешь продолжить эту тему?"
23006-2482 = "...У-у, хватит..."
23006-2483 = "Как председатель организационного комитета фестиваля, я хочу попросить вас об одном одолжении."
23006-2484 = "Помогите мне с подготовкой к завтрашнему фестивалю!"
23006-2485 = "Это не проблема, но... что насчёт того, что ты говорила?"
23006-2486 = "Так что же ты не могла терпеть?"
23006-2487 = "Хватит об этом!"
23006-2488 = "Да, тема закрыта! Не поднимайте её снова!!"
23006-2489 = "Сенсей. Сегодня, ну..."
23006-2490 = "Что случилось?"
23006-2491 = "Н-нет, ничего."
23006-2492 = "Вы сегодня весь день заняты работой."
23006-2493 = "Давайте постараемся."
23006-2494 = "Хе-хе-хе..."
23006-2495 = "Хе-хе?"
23006-2496 = "Хе-хе...?"
23006-2497 = "Я никогда так пошло не смеялась!?"
23006-2498 = "Там же выше было написано «Хе-хе-хе»!"
23006-2499 = "Что случилось вдруг?"
23006-2500 = "Сенсей, вы сами говорили."
23006-2501 = "Что когда устал, нужно отдыхать, а когда хочется спать, нужно спать."
23006-2502 = "Сегодня я думаю попросить вас ответить за свои слова."
23006-2503 = "Я буду ждать вас в Хякуядо."
23006-2504 = "P.S. Пожалуйста, заходите не через главный вход, а с задней стороны."
23006-2505 = "...?"
23006-23006010 = "Сенсей, Сенсей!"
23006-23006020 = "Сегодня начинается ограниченное по времени мероприятие в Хякуядо!"
23006-23006030 = "На этот раз «Яблочный фестиваль»!!"
23006-23006040 = "У нас есть освежающий яблочный чай и множество десертов из яблок!"
23006-23006050 = "Тогда обязательно нужно пойти!"
23006-23006060 = "Хе-хе-хе"
23006-23006070 = "Будем ждать вас!"
23006-23006080 = "Обещаем вам великолепный приём!!"