[translation]
23006-2449 = "“~Campanha Collab Momoyodou × Paraíso do Morango de Kivotos~!”"
23006-2450 = "“Daifuku de morango, dorayaki de morango, manju de morango, yatsuhashi de morango! E até anmitsu de morango!”"
23006-2451 = "“Venha saborear a parceria entre o 'Paraíso do Morango de Kivotos', que reúne morangos de todas as regiões, e a tradicional casa de doces 'Momoyodou'!”"
23006-2452 = "“O evento começa hoje e vai durar uma semana, então não deixe de vir!”"
23006-2453 = "“Apresente esta mensagem na visita e ganhe 10% de desconto na conta!”"
23006-2454 = "“Esperamos por você na Momoyodou! Nyan-nyan!”"
23006-2455 = "Hum...?"
23006-2456 = "Nyan-nyan...?"
23006-2457 = "Ehehe, Sensei!"
23006-2458 = "Na verdade, como mandei na mensagem, estamos realizando um evento na Momoyodou!"
23006-2459 = "Aproveitando a ocasião, pensei em receber você de novo com toda a hospitalidade que merece, Sensei!"
23006-2460 = "Você vem, não vem?"
23006-2461 = "Deixa eu dar uma olhada na minha agenda primeiro..."
23006-2462 = "V o c ê   v e m ,   n ã o   v e m ?"
23006-2463 = "Se é um pedido da Shizuko, eu vou!"
23006-2464 = "Ehehe! Muito obrigada!"
23006-2465 = "Fico te esperando, viu!"
23006-2466 = "Desta vez várias coisas deram errado, mas"
23006-2467 = "na próxima eu vou conquistar você sem falta, Sensei!"
23006-2468 = "Com o meu poder de garota atrapalhada!"
23006-2469 = "Se você avisa antes,\nnão deixa de ser 'atrapalhada'...?"
23006-2470 = "Pode ir se preparando!"
23006-2471 = "Hã, tá bom..."
23006-2472 = "Sensei..."
23006-2473 = "Eu, eu..."
23006-2474 = "A Shizuko aqui não consegue mais segurar..."
23006-2475 = "Então é melhor ir ao banheiro logo."
23006-2476 = "E não esquece de lavar as mãos quando terminar."
23006-2477 = "O que você está dizendo para a garota-propaganda mais badalada do momento?!"
23006-2478 = "Aliás, acha mesmo que eu falaria de uma coisa dessas pelo MomoTalk?!"
23006-2479 = "Ai, francamente..."
23006-2480 = "Hum, então, Sensei. Acontece que a Shizuko aqui~"
23006-2481 = "Esse papo ainda vai longe?"
23006-2482 = "...Uugh, deixa pra lá..."
23006-2483 = "Como presidente do Comitê de Gestão de Festivais, tenho um pedido para lhe fazer, Sensei."
23006-2484 = "Me acompanhe nos preparativos do festival amanhã, por favor!"
23006-2485 = "Por mim tudo bem, mas... e a conversa de agora há pouco?"
23006-2486 = "No fim das contas, o que era que você não conseguia mais segurar?"
23006-2487 = "Esquece isso de uma vez!"
23006-2488 = "Pronto, assunto encerrado! É proibido desenterrar essa conversa!!"
23006-2489 = "Sensei. Hoje, hum..."
23006-2490 = "O que foi?"
23006-2491 = "N-não, pensando bem, não é nada."
23006-2492 = "Você deve estar super ocupado com o trabalho hoje também, né?"
23006-2493 = "Vamos dar o nosso melhor hoje!"
23006-2494 = "Fufufu..."
23006-2495 = "Guhehe?"
23006-2496 = "Fufufu...?"
23006-2497 = "Eu nunca dei uma risada vulgar feito 'guhehe' na minha vida, tá bom?!"
23006-2498 = "Está escrito 'fufufu' bem ali em cima, não está vendo?!"
23006-2499 = "O que deu em você de repente?"
23006-2500 = "Sensei, foi você mesmo quem disse, não foi?"
23006-2501 = "Que quando estamos cansados é bom descansar, e quando temos sono é bom dormir."
23006-2502 = "Hoje eu decidi fazer você assumir a responsabilidade por essas palavras."
23006-2503 = "Estou te esperando na Momoyodou."
23006-2504 = "P.S.: Não entre pela porta da frente, venha pelos fundos, por favor."
23006-2505 = "...?"
23006-23006010 = "Sensei! Sensei!"
23006-23006020 = "O evento por tempo limitado da Momoyodou começa hoje!"
23006-23006030 = "Desta vez é o 'Festival da Maçã'!!"
23006-23006040 = "Preparamos um chá de maçã super refrescante e várias sobremesas feitas com maçã!"
23006-23006050 = "Esse eu não posso perder!"
23006-23006060 = "Fufufu"
23006-23006070 = "Fico te esperando!"
23006-23006080 = "Prometo a melhor hospitalidade de todas!!"
