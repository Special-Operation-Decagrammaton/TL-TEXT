[translation]
23006-2449 = "«Павильон Момоёдо x Клубничный рай Кивотоса — кампания начинается!»"
23006-2450 = "«Клубничные моти! Клубничный хлеб! Клубничная выпечка! Клубничные яцухаси! И клубничный анмицу!»"
23006-2451 = "«Попробуйте традиционные десерты Момоёдо с клубникой со всего Кивотоса!»"
23006-2452 = "«Через неделю! Приходите пировать на Клубничном фестивале!»"
23006-2453 = "«Покажите это сообщение и получите скидку 10%!»"
23006-2454 = "«Будем ждать вас в Момоёдо! Нян!»"
23006-2455 = "А?"
23006-2456 = "Нян...?"
23006-2457 = "Хи-хи-хи! Сенсей!"
23006-2458 = "В Момоёдо проходит мероприятие!"
23006-2459 = "Я угощу вас самым лучшим!"
23006-2460 = "Можете прийти ко мне?"
23006-2461 = "После того как проверю расписание..."
23006-2462 = "Вы ведь придёте, да?"
23006-2463 = "Ну, раз ты этого хочешь, Шизуко."
23006-2464 = "Хи-хи-хи. Ура!"
23006-2465 = "Буду ждать!"
23006-2466 = "В этот раз не получилось."
23006-2467 = "Но я попробую снова!"
23006-2468 = "С моим очарованием растяпы!"
23006-2469 = "Рассеянность — это очаровательно?"
23006-2470 = "Вот увидите!"
23006-2471 = "Эм... Хорошо..."
23006-2472 = "Сенсей..."
23006-2473 = "Я... Я..."
23006-2474 = "Я больше не могу терпеть..."
23006-2475 = "Тогда лучше иди, пока не поздно."
23006-2476 = "Не забудь помыть руки после."
23006-2477 = "Что? Как вы можете такое говорить талисману Момоёдо?!"
23006-2478 = "Почему такой разговор вообще происходит в MomoTalk?"
23006-2479 = "А? О, нет..."
23006-2480 = "Хм... Сенсей... Я..."
23006-2481 = "Хочешь начать сначала?"
23006-2482 = "Уф... Ладно."
23006-2483 = "Как президент Отдела проведения фестивалей, я хотела бы обратиться с просьбой!"
23006-2484 = "Пожалуйста, помогите нам подготовиться к фестивалю!"
23006-2485 = "Хорошо, но... Что ты говорила до этого?"
23006-2486 = "Тогда почему ты сказала, что больше не можешь терпеть?"
23006-2487 = "Разговор окончен!"
23006-2488 = "Это слишком неловко! Давайте о другом!"
23006-2489 = "Сенсей..."
23006-2490 = "Что такое?"
23006-2491 = "О, неважно. Ничего."
23006-2492 = "Наверняка вы сегодня заняты."
23006-2493 = "Хи-хи. Да, давайте сегодня хорошо поработаем!"
23006-2494 = "Хи-хи-хи!"
23006-2495 = "Ба-ха-ха?"
23006-2496 = "Хи-хи...?"
23006-2497 = "Я никогда так не смеюсь! Я не старик!"
23006-2498 = "Там же прямо написано! Я написала «Хи-хи-хи»!"
23006-2499 = "Так что случилось?"
23006-2500 = "В прошлый раз вы сказали..."
23006-2501 = "сообщать, когда мне тяжело."
23006-2502 = "Так что сегодня мне нужно, чтобы вы кое-что сделали."
23006-2503 = "Буду ждать вас в Момоёдо."
23006-2504 = "P.S. Пожалуйста, приходите через заднюю дверь. Не через переднюю."
23006-2505 = "Хм?"
23006-23006010 = "Сенсей! Сенсей!"
23006-23006020 = "Начинается особое сезонное событие Момоёдо!"
23006-23006030 = "Яблочная ярмарка!"
23006-23006040 = "Пир из свежего яблочного чая и других сладких десертов!"
23006-23006050 = "Я не могу это пропустить!"
23006-23006060 = "Фу-фу-фу-фу."
23006-23006070 = "Обязательно приходите!"
23006-23006080 = "И, конечно, вас ждёт лучшее обслуживание!"
