[translation]
3590297102-Localize = "Начнём с [c][007eff]системы карточек навыков[-][/c]."
1187715485-Localize = "У каждого студента, участвующего в бою, есть [c][007eff]карточки EX-навыков[-][/c]."
609033854-Localize = "Три карточки навыков будут вытянуты в случайном порядке."
