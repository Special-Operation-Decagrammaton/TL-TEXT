1583841037-Localize = "Здесь можно проверить тип местности текущего поля боя."
4215813659-Localize = "Некоторые студенты становятся сильнее на определённых типах местности. Не забывайте об этом!"
2904762616-Localize = "Это основные сведения о сражениях."
