1455196932-Localize = "Нажмите на клетку, куда хотите переместить отряд."
555619172-Localize = "Перейдём на клетку с врагом, чтобы начать бой!"
2354882728-Localize = "Союзный отряд, который только что переместился, нельзя передвинуть снова."
2763385595-Localize = "Нажмите кнопку «Завершить фазу», чтобы закончить свой ход."
1379607331-Localize = "Снова наш ход!"
743560781-Localize = "Остался только босс!"
