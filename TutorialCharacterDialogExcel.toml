949017678-Localize = "Скорость восстановления стоимости увеличивается каждый раз, когда студенты назначаются в штурмовой отряд или отряд поддержки."
3931485746-Localize = "Поэтому старайтесь задействовать как можно больше студентов!"
3793542894-Localize = "Отличная работа, Сенсей! Это лобби «Шале»."
