280669824-Localize = "Однако помните, что некоторые студенты не могут использовать укрытия. Кроме того, укрытия могут быть разрушены атаками противника."
3004656566-Localize = "Впереди группа врагов."
3083858370-Localize = "Навык [c][007eff]Судзуми[-][/c] эффективен против [c][007eff]групп врагов[-][/c]. Попробуйте его использовать."
1772103690-Localize = "Нажмите на карточку навыка и выберите группу врагов."
1077379718-Localize = "Теперь попробуем использовать навык Юки."
2764250063-Localize = "Навык [c][007eff]Юки[-][/c] [c][007eff]усиливает её саму[-][/c], поэтому после нажатия на карточку навыка нажмите на Юку."
2561015670-Localize = "Против нас танк «Крестоносец»!"
3405530868-Localize = "Танки «Крестоносец» имеют [c][007eff]тяжёлый тип брони[-][/c], поэтому получают дополнительный урон от [c][007eff]пробивающих навыков[-][/c]."
4264091547-Localize = "Помните, что навык [c][007eff]Хасуми[-][/c] имеет [c][007eff]пробивающий[-][/c] тип."
