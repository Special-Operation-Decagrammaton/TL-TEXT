[translation]
16007-100 = "Добро пожаловать в Секретариат Академии Красной Зимы, Сенсей."
16007-110 = "Ты нашёл особую матрёшку Черино на территории академии?"
16007-120 = "Обменивай здесь сколько хочешь!"
16007-130 = "Тебе нравится фестиваль?"
16007-140 = "Сразу скажи мне, если найдёшь матрёшку президента!"
16007-150 = "Эх, до конца фестиваля осталось совсем немного времени."
16007-160 = "Какая жалость..."
16007-170 = "Сегодня последний день фестиваля Ивана Купалы."
16007-180 = "Хорошенько осмотрись в Академии Красной Зимы, чтобы ничего не забыть!"
16007-190 = "Фестиваль закончился, но оставшиеся матрёшки..."
16007-200 = "Здесь можно обменять сколько угодно!"
16007-210 = "Эту матрёшку в форме президента придумала я."
16007-220 = "Хи-хи. Милая, правда?"
16007-230 = "Когда я вижу маленькие матрёшки внутри больших..."
16007-240 = "Мне становится немного грустно..."
16007-250 = "Ты выиграл приз! Поздравляю!"
16007-260 = "О, ты выиграл! Тебе тоже везёт, Сенсей!"
16007-270 = "Хи-хи. Тебе попалась действительно хорошая вещь. Береги её!"
16007-280 = "Какой очаровательный подарок. Прямо как великий вождь Черино!"
