[translation]
10129-10 = "Я-Я нервничаю, когда ты так пристально на меня смотришь..."
10129-20 = "Всё это ради проникновения."
10129-30 = "Хотя, признаю, наряд довольно милый..."
10129-40 = "Кажется, толпа становится всё больше..."
10129-50 = "Все довольны."
10129-60 = "Как бы то ни было, я рада, что смогла помочь."
10129-70 = "Я смогла стать увереннее в себе."
10129-80 = "Спасибо, Сенсей."
10129-90 = "Проникновение окончено, но патруль продолжается."
10129-100 = "Хотела бы я видеть тебя почаще."
10129-110 = "Пожалуйста, не тяни! Это не украшение!"
10129-120 = "Магия шестинарезной правой закрутки, эм... и..."
10129-130 = "Я плохо знаю реплики, поэтому их трудно запомнить."
10129-140 = "Кья-а-а! А-Ай!! А-Ах...! Щекотно...!"
10129-150 = "Я боюсь щекотки...!"
10129-160 = "Мне нравится атмосфера парка развлечений."
10129-170 = "Здесь так... спокойно."
10129-380 = "Д-добро пожаловать. Сенсей..."
10129-390 = "Тебе что-нибудь нужно...?"
10129-400 = "Это был запоминающийся патруль. Спасибо."
10129-410 = "Надеюсь, ты найдёшь то, что нужно."
10129-420 = "Напоминает мне то, что случилось в магазине у дома."
10129-430 = "Да, сюда."
10129-440 = "Вот оно."
10129-450 = "Спасибо, что всегда нам помогаешь."
10129-460 = "Я рада, что это пригодилось Сенсею."
10129-560 = "Это старая машина. Не уверена, работает ли она ещё..."
10129-570 = "Наверное, запускается, если вставить медаль."
10129-580 = "Я рада, что Рейса веселится."
10129-590 = "Надеюсь, тебе выпадет та самая карта... Кажется, она называется «редкой»?"
10129-600 = "Скоро закрытие. Проверь, не осталось ли у тебя медалей."
10129-610 = "Уже некоторое время чувствую чей-то взгляд..."
10129-620 = "Давай быстро, пока не привлекли ещё больше внимания."
10129-630 = "Радужная. Это... хорошо?"
10129-640 = "Она... розовая."
10129-650 = "Она золотая."
10129-660 = "Она небесно-голубая. Как освежает."
10129-670 = "Чёрная... Немного зловеще."
