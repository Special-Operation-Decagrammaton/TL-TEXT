[translation]
20022-210 = "Здравствуйте, Сенсей! Ты уже решил, какое желание загадать на Новый год?"
20022-220 = "Вот, я помолюсь рядом с тобой!"
20022-230 = "Тебе холодно? Хочешь горячей еды?"
20022-240 = "Да, Сенсей? Что случилось?"
20022-250 = "Этот скутер так выручает."
20022-260 = "Если я и его потеряю, что же буду делать...?"
20022-270 = "Я хочу попробовать приготовить и другие новогодние блюда, не только осэти."
20022-280 = "О, но... если всё это съесть, я точно наберу вес."
20022-290 = "Не знаю, можно ли назвать это новогодним желанием, но..."
20022-300 = "Надеюсь, в этом году столовая будет в безопасности..."
20022-340 = "Здравствуйте, Сенсей! Ты уже решил, какое желание загадать на Новый год?"
20022-350 = "Вот, я помолюсь рядом с тобой!"
20022-360 = "Тебе холодно? Хочешь горячей еды?"
20022-370 = "Да, Сенсей? Что случилось?"
20022-380 = "Этот скутер так выручает."
20022-390 = "Если я и его потеряю, что же буду делать...?"
20022-400 = "Я хочу попробовать приготовить и другие новогодние блюда, не только осэти."
20022-410 = "О, но... если всё это съесть, я точно наберу вес."
20022-420 = "Не знаю, можно ли назвать это новогодним желанием, но..."
20022-430 = "Надеюсь, в этом году столовая будет в безопасности..."
20022-440 = "Да... Пришло время показать мои кулинарные навыки!"
20022-450 = "Я постараюсь... Было бы приятно, если бы ты поддержал меня."
20022-460 = "Пусть всё и разрослось до таких масштабов, это не меняет того, что я должна делать."
20022-470 = "Всё, что я могу — постараться изо всех сил."
20022-480 = "К тому же... рядом с тобой мне спокойнее!"
20022-490 = "Я рада, что всё хорошо закончилось."
20022-500 = "Так что... Сенсей? Тебе понравилась моя еда?"
20022-510 = "Сенсей, добро пожаловать. Владельцы рынка подготовили самые разные товары."
20022-520 = "Я впервые управляю магазином. Хи-хи-хи."
20022-530 = "Всё нормально. Не переживай."
20022-540 = "Уверена, что справлюсь с учётом запасов."
20022-550 = "А? Особое блюдо Клуба школьных обедов, говоришь?"
20022-560 = "Если хочешь... я могу что-нибудь приготовить."
20022-570 = "Хорошо, дай мне минутку."
20022-580 = "Это моя главная рекомендация!"
20022-590 = "О... Да. Ты про это, верно?"
20022-600 = "Понравилось? Приходи ещё!"
20022-610 = "И фестиваль, и кулинарные соревнования закончились."
20022-620 = "Мне нужно готовиться к завтрашнему дню... но ты не спеши и осмотрись."
