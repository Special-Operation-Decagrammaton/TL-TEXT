[translation]
20062-180 = "An outsider!?[n]Wh-what, really...[wa:1000]!?"
20062-190 = "Come on in, come on in![n]You're super welcome!"
20062-200 = "Do you happen to have[n]a recent newspaper on you?"
20062-210 = "If it's from within the last month,[n]I'd be super happy!"
20062-220 = "Hello hello, Sensei~![n]It's really cold today too, huh~"
20062-230 = "Make sure you don't catch a cold..."
20062-240 = "A-Achoo!!"
20062-250 = "Ah! Make sure you close[n]the window properly, okay![n]The wind's blowing in..."
20062-260 = "Worst case, a bear might show up!"
20062-270 = "Wueeeeeh[wa:1000]!!![n]It's all thanks to you, Sensei~~!!"
20062-280 = "Ugh...[n]Uuuuugh...!"
20062-290 = "...Nnnnaaah~!"
20062-300 = "My sneeze[n]went away!!"
20062-310 = "Eek![n]You scared me...!"
20062-320 = "I thought you were[n]a reindeer again!"
20062-330 = "Hm? Are you hungry?"
20062-340 = "Then I'll make something![n]I'm in charge of meals!"
20062-350 = "It's, it's freezing..."
20062-360 = "Even my scalp[n]is gonna freeze..."
20062-500 = "Shopping!![n]That's my specialty!!"
20062-510 = "What should I buy~♪"
20062-520 = "Ugh...[n]Shopping is cancelled[n]for a while."
20062-530 = "Were you eyeing this too, Sensei?[n]Let's buy it, let's buy it!"
20062-540 = "When you're struggling to decide,[n]you just try buying[n]the whole lot!"
20062-550 = "Whoa~![n]Sensei, you're so cool![n]An adult's financial power! Awesome!"
20062-560 = "Ahem ahem![n]Testing, testing![n]Having this sure would make me happy~"
20062-570 = "If someone would just go ahead[n]and buy it for me,[n]that'd be great~"
20062-580 = "By the way...[n]Do you happen to have[n]an outing permit?"
20062-590 = "Total... one,[n]two... um..."
20062-600 = "Well, something like that!"
20062-690 = "Who would actually do homework?!"
20062-700 = "Homework, no no no no no~~!"
20062-710 = "Poking at me isn't going[n]to finish your homework, you know?"
20062-720 = "What is it? Huh?[n]Are you seriously[n]putting it off? Yay!"
20062-730 = "I hate homework, but I love[n]rewards![n]Hehehe♪"
20062-740 = "Oh~ That sounds nice~!"
20062-750 = "It would've been even better[n]if the newspaper was the latest issue!"
