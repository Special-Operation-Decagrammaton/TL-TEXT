[translation]
20062-862-180-1 = "Someone from the outside!?\nWait, for real...!?"
20062-862-200-1 = "Do you happen to have\na recent newspaper?"
20062-862-220-1 = "Hey there, Sensei!\nIt's cold today, isn't it?"
20062-862-240-1 = "A-choo!!"
20062-862-250-1 = "Ah! Please make sure to\nclose the window!\nThe wind is coming in and..."
20062-862-260-1 = "And worst of all, a bear might come in!"
20062-862-270-1 = "Waaaaah!!!\nIt's all thanks to you, Sensei!!"
20062-862-280-1 = "Ugh...\nUuuuugh...!"
20062-862-290-1 = "...Nghhh!"
20062-862-300-1 = "My sneeze\nwent away!!"
20062-862-310-1 = "Eek!\nYou scared me...!"
20062-862-320-1 = "I thought you were a reindeer\nagain!"
20062-862-340-1 = "Alright, I'll make something!\nI'm in charge of meals, after all!"
20062-862-350-1 = "I-it's freezing..."
20062-862-360-1 = "Even my scalp\nis gonna freeze over..."
20062-862-730-1 = "I hate homework, but I love\nrewards! Hehehe♪"
20062-862-740-1 = "Oh, that sounds great!"
20062-864-1060-1 = "Ugh... homework even in\na place like this..."
20062-864-1070-1 = "Do I really have to\nfinish it...?"
20062-864-1080-1 = "Eek!?\nWas there something on my clothes?"
20062-864-1090-1 = "You can't just touch things without asking!?\nWhat if it was a corrosive substance!"
20062-864-1100-1 = "Let's finish this quickly\nand go play!\nHurry, hurry!"
20062-864-1110-1 = "Mmm! \nRewards really are so sweet!"
20062-864-1120-1 = "Yahoo! \nThis is the one, right!"
