[translation]
10062-10320 = "Я ждала тебя, Сенсей."
10062-10330 = "На любой местности и при любой погоде..."
10062-10340 = "...Я обеспечу тебе безупречную поддержку."
10062-10350 = "Не беспокойся и оставь всё мне."
10062-10360 = "...Иначе мне будет грустно."
10062-10370 = "Ты заставил меня ждать, Сенсей. Но я тебя прощаю."
10062-10380 = "Я не дуюсь. И уж точно я совсем не думала..."
10062-10390 = "...что, когда ты вернёшься, я больше никогда-никогда не отпущу тебя от себя."
10062-10400 = "Так что не волнуйся."
10062-10410 = "Есть небо, есть земля, а ещё есть Асума Токи."
10062-10420 = "...Никакого смысла в этом нет. Просто сказала, потому что могла."
10062-10430 = "Меня часто спрашивают, не холодно ли мне."
10062-10440 = "Я отвечаю, что всё в порядке, но на самом деле мне холодно."
10062-10450 = "Так что согрей меня, пожалуйста, Сенсей."
10062-10460 = "Моя директива — обслуживание и охрана базы."
10062-10470 = "Другими словами — всегда оставаться рядом с тобой."
10062-10480 = "...Моя логика странная? Тебе ещё многому предстоит научиться, Сенсей."
10062-10490 = "Перейду прямо к делу."
10062-10500 = "Сейчас тебе следует сосредоточиться на мне."
10062-10510 = "Потому что здесь только мы вдвоём."
10062-10520 = "Дай мне свои руки, Сенсей. Я их согрею."
10062-10530 = "...! ...Твои руки... совсем не холодные...?!"
10062-10540 = "Цк... Надо было всё-таки спрятать твои перчатки."
10062-10990 = "Ты вернулся. Положи собранные образцы сюда, пожалуйста."
10062-11000 = "Для анализа нужно много материалов. То есть сейчас твой звёздный час."
10062-11010 = "Сенсей, хочешь чашку чая?"
10062-11020 = "Он заварен на воде из ледника."
10062-11030 = "...В его вкусе, возможно, чувствуются... нотки древности."
10062-11040 = "Раньше Рио проводила похожий эксперимент..."
10062-11050 = "Эта миссия вызывает у меня лёгкую ностальгию."
10062-11060 = "Ты украл у меня нечто очень ценное... А именно... моё сердце."
10062-11070 = "...Не паникуй так. Я просто сказала это, потому что могла. Ага."
10062-11080 = "...Ты хочешь, чтобы я сделала «это»? Правда? Ты уверен, что всё будет нормально...?"
10062-11090 = "Хорошо... Оп."
10062-11100 = "Образец сейчас анализируется. То есть я сейчас совершенно свободна."
10062-11110 = "...Сенсей, ты ведь знаешь, что делать, да?"
10062-11120 = "Я защищу Сенсея, что бы ни случилось."
10062-11130 = "Это единственная причина, по которой я здесь."
10062-11140 = "Хороший выбор."
10062-11150 = "Я тоже считаю, что это хороший вариант."
10062-11160 = "Если это тебе поможет, тогда держи. Распоряжайся как хочешь."
10062-11170 = "Раз это выбрал Сенсей, в его ценности не может быть сомнений."
10062-11180 = "Хотя до меня ему далеко."
10062-11190 = "Я немедленно подготовлю. Подожди немного, пожалуйста."
10062-12320 = "Президент Химари внесла в это место «некоторые изменения»."
10062-12330 = "Случайность или гарантия... Что выберешь, Сенсей?"
10062-12340 = "Можешь испытать свою удачу."
10062-12350 = "Я оттяну от тебя неудачу, чтобы удача смогла найти тебя, Сенсей."
10062-12360 = "Тебе бы больше понравилось наоборот...? Вот как?"
10062-12370 = "Я начинаю понимать разницу между президентом Химари и госпожой Рио."
10062-12380 = "Я всё ещё не уверена, кто из них прав..."
10062-12390 = "Но когда думаю о них обеих, почему-то... начинаю чувствовать эмоции, которые невозможно описать словами."
10062-12400 = "Я слышала, как кто-то говорил..."
10062-12410 = "...что в жизни нужно немного удачи."
10062-12420 = "Иначе весь путь будет состоять из ухабов и колючек."
10062-12430 = "Каким бы ни был результат, я буду на твоей стороне, Сенсей."
10062-12440 = "Так что надеюсь, ты тоже будешь на моей."
10062-12450 = "Когда я закончу эту миссию... я буду жить с тобой счастливой жизнью, Сенсей."
10062-12460 = "...Что ты имеешь в виду под «клише»?"
10062-12470 = "Выбирай то, что тебе нравится, Сенсей. Это и есть ответ."
10062-12480 = "Вау. *вежливые аплодисменты*"
10062-12490 = "...Это я изо всех сил пыталась тебя поздравить."
10062-12500 = "Ну как? Тебя хоть немного тронуло?"
10062-12510 = "Невероятно, Сенсей. Как насчёт сохранить темп и пойти ещё на один круг?"
10062-12520 = "Поздравляю со вторым местом."
10062-12530 = "Какой первый приз? Купон на мою поддержку в течение целого дня."
10062-12540 = "Этот несгибаемый дух... Я тоже его хочу."
10062-12550 = "...Студент, излучающий искреннее восхищение..."
10062-12560 = "Разве это не невероятно?"
10062-12570 = "Пожалуйста, скорее похвали меня."
