[translation]
20053-10 = "Что лучше для проникновения: онигири или хёроган...?"
20053-20 = "Хм? Ты здесь, почтенный Сенсей!"
20053-30 = "Красивый наряд, почтенный Сенсей."
20053-40 = "Непривычно видеть тебя в таком..."
20053-50 = "А-а-а...! Какого чёрта на площадке МОДНОГО ПОКАЗА происходит драка?!"
20053-60 = "...М-м, я скучаю по ней. Цукуё."
20053-70 = "Интересно, у неё всё хорошо... Она нормально ест рамен?"
20053-80 = "Да...! Теперь Клуб исследования ниндзюцу снова в строю!"
20053-90 = "Сюда! Почтенный Сенсей, сюда! Скорее!"
20053-100 = "Мне скучно..."
20053-110 = "Хм? Каждый раз, когда я это говорю, обязательно что-то случается?"
20053-120 = "Ух... Кажется, это платье немного тесновато..."
20053-130 = "Почему люди вообще такое носят?!"
20053-140 = "Что делает ниндзя... ниндзя...?"
20053-150 = "Похоже, дело... не в одежде."
20053-160 = "Я покажу тебе...! Что мой путь ниндзя..."
20053-170 = "...не остановить какой-то одеждой!"
20053-330 = "О, ты здесь, почтенный Сенсей! Не спеши, осмотрись."
20053-340 = "Насчёт этого товара..."
20053-350 = "У нас есть всё, кроме того, чего нет! Нья-ха-ха!"
20053-360 = "Фу-фу, давай закроемся на сегодня и пойдём пробовать новое блюдо ниндзя, почтенный Сенсей!"
20053-370 = "Выбирай тщательно, покупай смело...!"
20053-380 = "Это техника покупки мерча...!"
20053-390 = "Однажды здесь будут продаваться товары по «Мичиручи: Девичий свиток ниндзя»...!"
20053-400 = "Хорошо. Хороший выбор."
20053-410 = "Ага, это правильный выбор для ниндзя!"
20053-420 = "Здесь или с собой—"
20053-430 = "А, не туда."
20053-440 = "О-о-о...! Да! Это фирменный товар нашего магазина!"
20053-450 = "Вообще-то, здесь всё фирменное!"
20053-460 = "Фу-фу, добро пожаловать, почтенный Сенсей."
20053-470 = "Я тоже как раз выбираю рамен."
20053-480 = "Хм. Приятный запах..."
20053-490 = "...и, похоже, это ещё не всё, что у них есть! Пойдём!"
20053-500 = "Спасибо за еду... Я объелась..."
20053-510 = "Лапша и бульон... Это как ниндзя и ниндзюцу..."
20053-520 = "Какой рамен тебе нравится больше всего, почтенный Сенсей?"
20053-530 = "Я чувствую это...!"
20053-540 = "Такой вкус способен вдохновить на новое ниндзюцу!"
20053-550 = "А-а-а-а...?! Э-этот вкус...!"
20053-560 = "Ух, неплохо, да...?"
20053-570 = "Неплохо. Но только и всего! Просто «неплохо»...!"
20053-580 = "Ух, э-это вообще рамен...?"
