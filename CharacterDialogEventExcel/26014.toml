[translation]
26014-510 = "А, здравствуй, Сенсей."
26014-520 = "...Неловко приветствовать тебя не так, как обычно."
26014-530 = "Может, стоит выбрать более милое приветствие..."
26014-540 = "Я-я просто разговаривала сама с собой!"
26014-550 = "Какое суматошное мероприятие..."
26014-560 = "Ещё немного, и всё закончится. Давай постараемся, Сенсей."
26014-570 = "Неужели уже всё..."
26014-580 = "Ощущается... немного обидно."
26014-590 = "А-а? Ч-что случилось? Тебе нужно, чтобы я что-то сделала?"
26014-600 = "Э-это просто стандартная школьная форма Миллениума..."
26014-610 = "В ней что-то странное?"
26014-620 = "Эм... Сенсей?"
26014-630 = "Раз уж мы здесь..."
26014-640 = "...не хочешь...?"
26014-650 = "...Н-неважно. Ничего. Прости."
