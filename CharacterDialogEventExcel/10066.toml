10066-500 = "Добро пожаловать, Сенсей!"
10066-510 = "Горничная-герой может работать даже продавцом!"
10066-520 = "У нас в наличии много мощных предметов!"
10066-530 = "Но раз это ты, Сенсей... думаю, можешь взять всё, что захочешь!"
