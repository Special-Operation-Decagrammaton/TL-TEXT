[translation]
20047-320 = "Водный фестиваль Хяккияко..."
20047-330 = "Как я вообще здесь оказалась?"
20047-340 = "Раз уж я участвую, буду играть без сожалений."
20047-350 = "И вот фестиваль подходит к концу. Я испытала столько нового."
20047-360 = "В конце остаётся лёгкая горечь."
20047-370 = "Раньше я ненавидела море."
20047-380 = "Я не жалею об этом матче. Спасибо, что смотрел, Сенсей."
20047-390 = "Тебе нужна моя тактика?"
20047-400 = "Как бы я ни старалась, моё тело просто тонет."
20047-410 = "Возможно, я прилагаю слишком много силы..."
20047-420 = "Х-Хм? Давно ты здесь, Сенсей?"
20047-430 = "Не волнуйся. Плавание для меня — детская забава."
20047-440 = "Щекотно."
20047-450 = "...Но это не значит, что тебе нужно уходить."
20047-720 = "Это список заданий, который я лично составила. Ты ведь благодарен?"
20047-730 = "Итак, начинаем операцию."
20047-740 = "...Что ты делаешь? Нам нужно быть ближе, чтобы смотреть вместе, верно?"
20047-750 = "Когда останемся наедине, я буду разговаривать с тобой сколько захочешь."
20047-760 = "А пока, пожалуйста, сосредоточься на задании."
20047-770 = "Тебе нужна мудрость оперативного офицера? Спрашивай."
20047-780 = "Другого я и не ожидала.\nСоюзник мой должен быть как минимум настолько компетентен."
20047-790 = "Глядя, как ты работаешь, я тоже заряжаюсь энергией. Наверное, естественное следствие того, что мы товарищи по команде?"
