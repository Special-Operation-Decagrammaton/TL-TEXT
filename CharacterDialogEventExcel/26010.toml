[translation]
26010-270 = "И-и... Это прямо как рыбацкая деревня из с-страшной истории..."
26010-280 = "Я-я просто х-хочу вернуться в ш-школу..."
26010-290 = "О, п-погоди... У меня ведь нет школы, к-которой можно вернуться..."
26010-300 = "Жители здесь такие с-страшные...! Я-я разговаривала с ними ради расследования..."
26010-310 = "Я-я просто хочу убежать..."
26010-320 = "К-капитан недавно дал мне тёплый кофе."
26010-330 = "Может, он не такой страшный, как я думала..."
26010-340 = "Кажется, я начинаю п-привязываться к этому городу."
26010-350 = "Но всё же безопаснее всего я чувствую себя в парке Коусаги."
26010-360 = "В-вы случайно меня звали...?"
26010-370 = "(Как мы вообще оказались в такой глухой деревне...?)"
26010-380 = "Мияко заплела мне волосы п-перед этой миссией."
26010-390 = "Хи-хи... Это может быть мило..."
26010-400 = "Воробьи, ласки, чайки..."
26010-410 = "П-почему ко мне постоянно п-приходят дикие животные...?"
26010-420 = "Если... вдруг найдёшь к-красивые камушки или ракушки, п-пожалуйста, принеси мне."
26010-430 = "Сенсей, ты будешь с-собирать камушки? ...Вместе с-мной?"
26010-440 = "Нам уже п-пора возвращаться, но..."
26010-450 = "М-можем снова вместе п-пособирать камушки?"
26010-460 = "Эм, то есть получается..."
26010-470 = "Я-я совершенно ускользаю от внимания всех... прямо как к-камушки..."
26010-480 = "Даже если вот так меня трогать... я-я не стану заметнее..."
26010-490 = "Этот камушек очень красивый...!"
26010-500 = "Прости... Это всё, что я могу тебе дать..."
26010-510 = "Он белый... и блестит..."
26010-520 = "Это мелочь, но... т-ты примешь...?"
