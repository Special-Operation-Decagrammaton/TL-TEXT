[translation]
10103-10 = "На этой встрече по обмену на кону престиж Красной Зимы и Шаньхайцзин..."
10103-20 = "Она должна пройти успешно, чего бы это ни стоило!"
10103-30 = "Хочешь знать, что я здесь делаю?"
10103-40 = "Как видишь, я сопровождаю великого вождя ради её безопасности."
10103-50 = "А-а? Великий вождь Черино?! Куда она делась?"
10103-60 = "Что вообще думают в Шаньхайцзин, обращаясь с нами так..."
10103-70 = "Не думай, что я позволю им так просто уйти от ответственности!"
10103-80 = "Допустить государственный переворот перед чужаками..."
10103-90 = "Эти ребята из Шаньхайцзин серьёзно опозорились."
10103-100 = "Если бы речь шла о Федеральной академии Красной Зимы..."
10103-110 = "...Кхм! Государственный переворот — сущая мелочь."
10103-120 = "*вздох* Я вымоталась..."
10103-130 = "Никогда не думала, что начну скучать по снежным полям Красной Зимы."
10103-140 = "Улицы Шаньхайцзин слишком запутанные..."
10103-150 = "Они совсем не подходят для атаки в лоб."
10103-160 = "Испугаться одного клуба..."
10103-170 = "Члены Генрюмона, похоже, мягче, чем выглядят."
10103-180 = "Ради авторитета студенческого совета..."
10103-190 = "...мы не можем закрыть на всё глаза, как бы противники ни пытались нас уговорить..."
10103-200 = "Хм? Что у меня в руках?"
10103-210 = "...Просто пельмени, которые мне бесплатно дали на Променаде Чёрной Черепахи."
10103-220 = "Телохранитель президента дала мне солнцезащитные очки..."
10103-230 = "Её наряд, её присутствие... Она была не обычным человеком."
10103-240 = "Я слышала, что под ципао нельзя надевать нижнюю сорочку."
10103-250 = "Это правда?"
10103-260 = "Не хочу оскорблять традиции других академий, но..."
10103-270 = "...для атаки в лоб этот наряд совсем не подходит..."
10103-520 = "Что ты здесь делаешь? Я просто разбираю всё необходимое для встречи по обмену..."
10103-530 = "Не мог бы ты пожертвовать немного припасов?"
10103-540 = "Думаю, эта встреча по обмену будет масштабнее, чем ожидалось."
10103-550 = "Встреча закончилась, но пожертвования припасов всегда приветствуются."
10103-560 = "Мы все в одной лодке, так что можем помочь другим академиям."
10103-570 = "(Эта маска пекинской оперы... если долго смотреть, немного пугает...)"
10103-580 = "О, это хорошая вещь."
10103-590 = "У нас достаточно, чтобы провести успешную встречу по обмену."
10103-600 = "Эм... Сенсей. Я не обвиняю, но... откуда у тебя все эти припасы...?"
10103-610 = "Превосходно! Имя Сенсея будут славить в обеих школах!"
