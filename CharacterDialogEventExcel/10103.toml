[translation]
10103-900839-10-1 = "This exchange meeting is a matter of prestige for both Red Winter and Shanhaijing..."
10103-900839-20-1 = "We must make it a success, no matter what!"
10103-900839-30-1 = "What am I doing here, you ask?"
10103-900839-40-1 = "As you can see, I'm acting as a bodyguard to protect the President—"
10103-900839-50-1 = "...W-where did she go!? President Cherino!? Where are you!?"
10103-900839-60-1 = "The city of Shanhaijing is like a maze..."
10103-900839-70-1 = "It's not suited for a frontal assault."
10103-900839-80-1 = "Hah! To think we'd struggle against a single club."
10103-900839-90-1 = "The Genryumon isn't all that impressive, after all."
10103-900839-100-1 = "In order to raise the authority of our office,"
10103-900839-110-1 = "no matter what tricks they use, we must remain firm and never be swayed—"
10103-900839-120-1 = "...Hm? This?"
10103-900839-130-1 = "It's a steamed bun I got from the Genbu Mercantile."
10103-900839-140-1 = "I got these sunglasses from the Gatekeeper."
10103-900839-150-1 = "The way they look, their presence... they're no ordinary person..."
10103-900839-160-1 = "I heard that wearing innerwear under a qipao is against the rules, but..."
10103-900839-170-1 = "Is this really the right way to do it?"
10103-900839-180-1 = "We should respect the customs of other schools, but..."
10103-900839-190-1 = "This doesn't seem like clothing suited for a charge..."
