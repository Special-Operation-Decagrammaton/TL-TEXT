[translation]
20020-10010 = "Пора Отряду по исследованию сверхъестественных явлений приступать к миссии."
20020-10020 = "Хи-хи. Я ждала тебя, Сенсей."
20020-10030 = "Сейчас мы анализируем данные, так что подожди ещё совсем немного."
20020-10040 = "Хм-м... Интересно."
20020-10050 = "Значит, нужно сделать вот так... Хм-м..."
20020-10060 = "Декаграмматон и правда непростой противник."
20020-10070 = "Это может быть опасно."
20020-10080 = "Хи-хи. Но от этого становится только интереснее."
20020-10090 = "Я получила новые данные."
20020-10100 = "Ну что, посмотрим, что в них содержится."
20020-10110 = "Похоже, следующая цель уже определена."
20020-10120 = "Пора переходить к следующему этапу."
20020-10510 = "Новая миссия, новая обстановка..."
20020-10520 = "...Тогда. Начнём, Сенсей."
20020-10530 = "Не мог бы ты помочь, Сенсей?"
20020-10540 = "Ох, даже такой супергениальной, элегантной и утончённой красавице, как я..."
20020-10550 = "...иногда нужна помощь, знаешь ли."
20020-10560 = "Ты пришёл, Сенсей."
20020-10570 = "Это наша новая база."
20020-10580 = "Подтверждаю: требования возросли."
20020-10590 = "Посмотрим, сколько переменных мы сможем контролировать... Действуем осторожно."
20020-10600 = "Чем больше информации, тем лучше..."
20020-10610 = "...но избыток данных сам по себе создаёт проблемы."
20020-10620 = "Я немного устала..."
20020-10630 = "Вот бы в такие моменты один определённый учитель немного меня побаловал."
20020-10640 = "Для лучшего хакера в мире и цветущей красавицы вроде меня..."
20020-10650 = "...остаться без идеального напарника..."
20020-10660 = "Это вопрос высокого приоритета. Поэтому, Сенсей, ты должен..."
20020-10670 = "Неважно... Забудь, что я только что сказала."
20020-10680 = "Мы вступили в новую фазу... Думаю, можно сказать и так."
20020-11550 = "Здесь мы анализируем..."
20020-11560 = "...собранные тобой материалы."
20020-11570 = "Добро пожаловать, Сенсей. *вздох*... Я устала ждать."
20020-11580 = "Ты собрал образцы? Положи их сюда, пожалуйста."
20020-11590 = "Спасибо за сотрудничество, как всегда, Сенсей."
20020-11600 = "Понятно. Интересно, какую информацию нам удастся извлечь."
20020-11610 = "Благодаря тебе расследование идёт гладко. И всё же это явление... Очень интересно."
20020-11620 = "*вздох* Анализ даже не успевает за темпом..."
20020-11630 = "Какие роскошные условия."
20020-11640 = "Проводить новые исследования всегда интересно."
20020-11650 = "А когда вдобавок ты рядом... тем более."
20020-11660 = "Анализ завершён. Можешь забрать, Сенсей."
20020-11670 = "Тебе понравились результаты анализа? Хи-хи, приходи ещё."
20020-11680 = "Я очень старалась провести анализ для тебя. Да, пожалуйста, забирай."
20020-11690 = "...Я-я, конечно же, знаю, когда нужно вести себя профессионально, а когда нет."
20020-11700 = "Сенсей собирает образцы..."
20020-11710 = "...а мы их анализируем и передаём тебе."
20020-11720 = "Сделка завершена."
20020-11730 = "Как всегда, спасибо. ...Ну как?"
20020-11740 = "Однодневное обслуживание в киоске от супергения и элегантной, утончённой красавицы."
20020-12200 = "Я попробовала изменить наш подход к анализу данных."
20020-12210 = "Случайность и неизбежность, абсолютизм и относительность..."
20020-12220 = "Интригующая тема. Ты ведь тоже так считаешь, Сенсей?"
20020-12230 = "Хочешь тоже испытать удачу?"
20020-12240 = "Согласно астрологии, сегодняшний счастливый цвет — это..."
20020-12250 = "...А? Ты в порядке...?"
20020-12260 = "Большинство вещей определяется вероятностью и статистикой."
20020-12270 = "Конечно, астрология тоже. Гача... не исключение."
20020-12280 = "Я не согласна... с теми, кто говорит, что всё необходимо контролировать."
20020-12290 = "Потому что я считаю, что ценность есть в..."
20020-12300 = "...встречах с мирами, которые нам ещё не доводилось познать."
20020-12310 = "Область неизведанного... притягивает людей."
20020-12320 = "Наука раскрыла множество тайн."
20020-12330 = "Но в этом мире всё ещё остаётся много неизвестного."
20020-12340 = "...Иначе было бы слишком скучно."
20020-12350 = "В конце концов мы достигнем финишной черты..."
20020-12360 = "...и увидим рождение ещё более высокой цели."
20020-12370 = "Поздравляю, Сенсей. Можно сказать, что результат был ожидаем..."
20020-12380 = "...но всё равно ведь можно отпраздновать, когда он действительно достигнут, не так ли?"
20020-12390 = "Ох, это тот самый «выигрышный приз», верно?"
20020-12400 = "Хотя со статистической точки зрения он ожидаем..."
20020-12410 = "...испытывать радость от победы — это уже наша свободная воля."
20020-12420 = "Отличная работа, Сенсей! Я очень рада."
20020-12430 = "Именно потому, что существует обычное, существуют и особенные моменты."
20020-12440 = "Так что цени и «обычное», Сенсей."
20020-12450 = "...И заодно цени супергения, изящную и хрупкую красавицу, которая так старается."
