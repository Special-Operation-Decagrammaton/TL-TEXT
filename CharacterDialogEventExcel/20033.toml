[translation]
20033-520 = "Этот магазин специально открыли в честь вечеринки Геенны."
20033-530 = "Осматривайся сколько хочешь. Кихехе."
20033-540 = "...А я всё думала, кто это. Ты уже выбрал покупку, Сенсей?"
20033-550 = "Кехе. Жаль, но временный магазин закрывается."
20033-560 = "Ой, не делай такое унылое лицо."
20033-570 = "Следующий сделаем ещё больше и роскошнее! Кихехе!"
20033-580 = "Все товары здесь подготовлены Обществом Пандемониума."
20033-590 = "Ах, всё это стало возможным благодаря нашей огромной финансовой мощи."
20033-600 = "Мы только начали! Пока не удивляйся. Кихехе."
20033-610 = "Хм? Что я сделала с товарами?"
20033-620 = "Кихехе. Ты замышляешь занять место рядом со мной?"
20033-630 = "У тебя нет никакой особой цели? Вот как...?"
20033-640 = "О-хо, подумать только, что ты выберешь этот путь. Аплодирую твоей оценке."
20033-650 = "Я как раз собиралась посоветовать тебе взять это."
20033-660 = "Кихехе. Отличный выбор."
20033-670 = "Кихехе. Сегодня я в хорошем настроении."
20033-680 = "Добавлю небольшой бонус! Вот предложение о сотрудничестве от Общества Пандемониума!"
20033-690 = "...А? Тебе не нужно?"
20033-700 = "Так вот чего ты хотел, Сенсей? Кихехехе. Ты странный."
