[translation]
10140-120 = "Операция «Охота за легендами»... Наконец-то время пришло."
10140-130 = "Я сделаю всё возможное, чтобы не посрамить имя SRT!"
10140-140 = "Пока не появилось ещё больше жертв..."
10140-150 = "Нам нужно спешить, Сенсей."
10140-160 = "Инари-дзуси во время задания... настоящее лакомство..."
10140-170 = "Н-Но я радуюсь заданиям вовсе не поэтому!"
10140-180 = "Будь то призрак или человек... Я не потерплю, чтобы кто-либо бесчинствовал как ему вздумается."
10140-190 = "Погоди! Почему ты тыкаешь меня в живот?!"
10140-400 = "Что же делать...?"
10140-410 = "А, Сенсей. Как раз вовремя."
10140-420 = "Я разбирала найденные нами подсказки. Не поможешь?"
10140-430 = "Ты здесь, Сенсей. Давай начнём разгадывать эту тайну!"
10140-440 = "Из этой подсказки можно заключить..."
10140-450 = "А, не трогай! Я всё очень точно разложила, чтобы было легко читать!"
10140-460 = "Я где-то уже видела эти данные..."
10140-470 = "Потрясающе! Это было идеальное умозаключение!"
10140-480 = "Идеально! На этом всё!"
