[translation]
10140-863-120-1 = "The \"Roa Tracking Operation\"\n...It's finally time."
10140-863-130-1 = "I'm going all out—\nI won't let anyone\ntarnish the SRT name!"
10140-863-140-1 = "Before the damage spreads..."
10140-863-150-1 = "We need to hurry, Sensei."
10140-863-160-1 = "Eating inari sushi\nduring an operation...\nIt's the best."
10140-863-170-1 = "O-of course,\nI'll still do the operation\nproperly without it!"
10140-863-180-1 = "Whether it's a ghost\nor whatever else,\nI won't let them have their way!"
10140-863-190-1 = "Hey!\nDon't just go touching\npeople's stomachs like that!?"
10140-863-400-1 = "What should I do..."
10140-863-410-1 = "Oh, Sensei!\nYou came at the\nperfect time!"
10140-863-420-1 = "I'm organizing the clues\nwe've gathered, but\ncould you help me\nout a little?"
10140-863-430-1 = "You're here, Sensei.\nLet's start the deduction!"
10140-863-440-1 = "Based on the current\ninformation..."
10140-863-450-1 = "Hey! Don't touch that!\nI'm trying to\narrange them properly!"
10140-863-460-1 = "I feel like I've seen\nthis document somewhere before..."
10140-863-470-1 = "That's amazing!\nYour deduction was perfect!"
10140-863-480-1 = "Alright!\nProof complete!"
