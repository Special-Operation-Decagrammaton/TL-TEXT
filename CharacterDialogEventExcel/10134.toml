[translation]
10134-1550 = "Сенсей! Задание! Это задание!"
10134-1560 = "Что мне нужно сделать сегодня?"
10134-1570 = "А, я должна была всё организовать..."
10134-1580 = "Приветствую тебя удалённо, Сенсей! Алиса на связи!"
10134-1590 = "Ситуация стала непростой..."
10134-1600 = "Но давай преодолеем её вместе!"
10134-1610 = "Ху. Ху. Ху..."
10134-1620 = "Ну как, Сенсей? Это моя новая броня!"
10134-1630 = "Даже без брони..."
10134-1640 = "На самом деле, даже если я потеряю Меч Света..."
10134-1650 = "Что бы ни случилось, я всё равно Алиса."
10134-1660 = "Пока я со всеми!"
10134-1670 = "И пока я с Сенсеем!"
10134-1680 = "Малкут..."
10134-1690 = "Она наверняка финальный босс!"
10134-1700 = "Кстати... скрытого босса ведь не будет, да...?"
10134-1710 = "Если мы благополучно вернёмся..."
10134-1720 = "Я хочу познакомить Кэй со всеми!"
10134-1730 = "Бум-бум-бум!"
10134-1740 = "Сенсей заслужил награду!"
10134-1750 = "Ты очень крутой, Сенсей!"
10134-1760 = "Будем делать по одному!"
10134-1770 = "Бу-у... Я тоже хочу праздновать рядом с Сенсеем!"
10134-1780 = "Да! Я очень люблю Сенсея, потому что ты никогда не меняешься!"
