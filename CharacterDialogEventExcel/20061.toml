[translation]
20061-1480 = "Какой чудесный пляж."
20061-1490 = "Здесь получится превосходный горячий источник!"
20061-1510 = "О! Сенсей! Неужели это вы, Сенсей?!"
20061-1520 = "Что же делать? Горячий источник ещё не открылся."
20061-1530 = "Ай... Ичика, ну зачем так грубо?"
20061-1550 = "Мы ведь уже почти у цели, дай мне поблажку!"
20061-1560 = "Всего одна искра."
20061-1570 = "Обычно всё начинается с крошечной искры, знаете ли."
20061-1580 = "Что же случится? Вам разве не любопытно?"
20061-1590 = "Ай! Вот это меня приложили! Ва-ха-ха!"
20061-1610 = "...Хм, даже не знаю."
20061-1630 = "Хмф! Частный пляж. Вот до чего дошли эти буржуи..."
20061-1640 = "Вот бы они умели быть щедрыми, как наш Отдел горячих источников, знаете ли?"
20061-1650 = "так и не раскрыли свою истинную ценность."
20061-1660 = "мы сюда и пришли."
20061-1670 = "Так это и есть знаменитое Чайное общество..."
20061-1680 = "Я ничего не делаю, знаете ли."
20061-1690 = "А-ха! А-ха-ха! Что вы делаете, Сенсей?! Щекотно!"
