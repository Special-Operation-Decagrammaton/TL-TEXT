[translation]
20061-1480 = "Ah!\nWhat a beautiful beach!"
20061-1490 = "A hot spring overlooking the sea\ncould be built right here!"
20061-1510 = "Oh, Sensei?\nIf it isn't Sensei!"
20061-1520 = "Unfortunately, the hot spring\nisn't ready yet, you see."
20061-1530 = "Ow... Honestly, I wish\nIchika-chan would pull her\npunches a little bit."
20061-1550 = "And considering how close\nwe are... You'd agree\nwith me, right, Sensei?"
20061-1560 = "—Just a single spark."
20061-1570 = "Everything starts from\njust the tiniest spark."
20061-1580 = "How will it all turn out...\nAren't you curious?"
20061-1590 = "Man~\nThey really got one over on us!\nHa-ha-ha-ha-ha!"
20061-1610 = "...Is that how\nit looks to you?"
20061-1630 = "A private beach, huh.\nThe height of bourgeois luxury."
20061-1640 = "How about embracing\na philosophy like ours?"
20061-1650 = "It still remains\nburied out there."
20061-1660 = "That's why we came."
20061-1670 = "Hmm... So that's\nthe Tea Party, huh."
20061-1680 = "We aren't doing anything in particular."
20061-1690 = "Hm? What is it, Sensei!\nThat tickles!\nHaha! Stop that!"
