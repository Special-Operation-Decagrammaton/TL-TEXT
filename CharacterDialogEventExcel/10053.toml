[translation]
10053-10 = "Добро пожаловать на Фестиваль ореолов Кивотоса! В подготовку к этому дню вложено огромное количество труда!"
10053-20 = "Хотя я в Исполнительном комитете, я тоже планирую участвовать в нескольких соревнованиях."
10053-30 = "Ты ведь будешь болеть за меня, Сенсей?"
10053-40 = "Физическое состояние? Проверено. Снаряжение? Проверено."
10053-50 = "Мои планы на Фестиваль ореолов Кивотоса... безупречны!"
10053-60 = "Та группа студентов выглядит немного подозрительно..."
10053-70 = "Хм? Звёздочка у меня на щеке?"
10053-80 = "Её нарисовала Маки!"
10053-90 = "Всё-таки фестиваль. Поэтому она предложила немного разрисовать лицо."
10053-100 = "Хм-м... Не слишком...?"
