[translation]
16013-240 = "Нельзя терять время, Сенсей! Пойдём!"
16013-250 = "Пока я здесь, халтурить не получится!"
16013-260 = "Ха! Всё прошло гладко!"
16013-270 = "Ну же! Осталось совсем немного!"
16013-280 = "Может, проверим в последний раз, просто на всякий случай."
16013-290 = "И-и! Ты меня напугал! Не пугай так, Сенсей!"
16013-300 = "Почему ты продолжаешь так делать...? Оставь меня в покое."
16013-310 = "Да серьёзно! Если тебе что-нибудь нужно, просто скажи!"
16013-320 = "Хм? Что такое?"
