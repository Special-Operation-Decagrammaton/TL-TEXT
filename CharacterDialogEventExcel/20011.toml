[translation]
20011-390 = "О, это ты. Ты загадал новогоднее желание? Какое?!"
20011-400 = "С-С-Сенсей?! ...Что значит, ты пришёл ради меня?!"
20011-410 = "О... Прости. Просто забудь."
20011-420 = "Новый год, а вокруг всё равно полный хаос!"
20011-430 = "Хотя, думаю, хорошо, что здесь так оживлённо."
20011-440 = "*вздох* Банда Курокамэ, Кайтенджеры... Почему всё происходит одно за другим?"
20011-450 = "Мне хоть заплатят за подработку без проблем?"
20011-460 = "С самого начала года мы носились как угорелые, но, похоже, всё успокаивается."
20011-470 = "Хорошая работа, Сенсей. Может, пойдём обратно вместе и поедим осэти?"
20011-480 = "Сколько раз мне повторять?! Это не косплей!"
20011-490 = "Я ношу это из-за подработки!"
20011-500 = "Ч-что, Сенсей? Ты как-то странно на меня смотришь..."
20011-510 = "Я-я знаю, как это выглядит, но я правда усердно работаю!"
20011-520 = "Когда смена закончится, хочу сходить поесть чего-нибудь горячего с Аяне и остальными..."
20011-530 = "А? Ты хочешь, чтобы я сказала это ещё раз? Снова?"
20011-540 = "Ух... Ладно! Но это последний раз, ясно?!"
20011-550 = "...З-злые духи, прочь! Вот! Теперь доволен?"
20011-860 = "О, Сенсей. Пришёл вытянуть омикудзи? Они здесь."
20011-870 = "Как насчёт вытянуть омикудзи?"
20011-880 = "...Разве можно так активно рекламировать омикудзи?"
20011-890 = "О, новогоднее событие закончилось, но омикудзи всё ещё можно вытянуть."
20011-900 = "Вот, Сенсей!"
20011-910 = "И-испытай удачу, Сенсей!"
20011-920 = "Почему-то сердце начало колотиться...!"
20011-930 = "Даже если выпадет плохой результат, всё нормально. Я мико!"
20011-940 = "Н-не смейся так! Я просто хотела поддержать!"
20011-950 = "О, тебе выпало великое благословение!! Потрясающе, Сенсей!"
20011-960 = "За великое благословение полагается особый приз! Вот!"
20011-970 = "Тебе выпало благословение, Сенсей! Поздравляю!"
20011-980 = "И в честь этого — приз от счастливой мико!"
20011-990 = "Скромное благословение? Это ведь неплохо, да?"
20011-1000 = "Вот, это Сенсею за его скромное благословение!"
20011-1010 = "А? Малое благословение?"
20011-1020 = "Не расстраивайся, Сенсей. Вот, я дам тебе это!"
20011-1030 = "Будущее благословение... Пожалуй, тебе подходит..."
20011-1040 = "О, я не имела в виду ничего плохого. В любом случае, возьми. Это приз за будущее благословение."
20011-1050 = "П-проклятие?! А, ха-ха-ха... В-всё... всё н-нормально!"
20011-1060 = "Вот, я дам тебе это, так что не переживай, ладно?"
