[translation]
10026-10 = "Хорошо! За работу, Сенсей!"
10026-20 = "Нельзя медлить! Приступаем!"
10026-30 = "Что-нибудь ещё, Сенсей?"
10026-40 = "Ха-ха-ха! Неплохо!"
10026-50 = "Нельзя терять время."
10026-60 = "К-какого чёрта ты на меня смотришь? Работай!"
10026-70 = "Ха-ха-ха! Неплохо!"
10026-80 = "Нельзя терять время."
10026-90 = "П-почему ты всё время на меня смотришь? Давай лучше работать."
10026-550 = "Хорошо! Начнём уборку?"
10026-560 = "Давай поторопимся."
10026-570 = "Ты за меня болеешь? Ха! К этому можно привыкнуть."
10026-580 = "Для меня это проще простого!"
10026-590 = "Хех, похоже, у меня есть талант к таким вещам."
10026-600 = "Если дело касается работы, я довожу её до конца."
