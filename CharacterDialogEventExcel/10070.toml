[translation]
10070-100 = "Сенсей? Скорее приезжай в Шаньхайцзин."
10070-110 = "О, и советую держаться подальше от Променада Чёрной Черепахи."
10070-120 = "Хех. Не засматривайся по сторонам слишком сильно. Не хотелось бы, чтобы ты заблудился."
10070-130 = "Сенсей? Скорее приезжай в Шаньхайцзин."
10070-140 = "О, и советую держаться подальше от Променада Чёрной Черепахи."
10070-150 = "Это Шаньхайцзин."
10070-160 = "Хех. Не засматривайся по сторонам слишком сильно. Не хотелось бы, чтобы ты заблудился."
10070-170 = "О? Хочешь что-то сказать? Говори."
10070-180 = "Бывают дни, когда мне просто хочется сказать людям, что я на самом деле думаю."
10070-190 = "Почему?"
10070-200 = "У нас ещё осталось дело."
10070-210 = "И даже если дело грязное... кто-то должен его сделать."
10070-220 = "Круто прозвучало, да?"
10070-230 = "В Шаньхайцзин шумнее обычного."
10070-240 = "Может, потому что ты здесь...?"
10070-250 = "Если где-то намечается движуха, мы будем первыми."
10070-260 = "Так что пошли."
10070-380 = "Не переживай. Будем разбираться по одной задаче."
10070-390 = "Когда миссий несколько, я сначала выполняю простые. Так всё идёт гладче."
10070-400 = "Я всегда буду на твоей стороне, Сенсей."
10070-410 = "Даже для члена Генрюмона это было бы сложно... Я удивлена, Сенсей."
10070-420 = "Ты правда справился, Сенсей! Я знала, что не ошиблась в тебе."
10070-430 = "Н-но...! Любой член Генрюмона может так!"
