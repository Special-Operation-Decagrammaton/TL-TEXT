[translation]
20044-10 = "Хотя я не знаю всех правил бейсбола..."
20044-20 = "...от этой атмосферы моё сердце бьётся быстрее."
20044-30 = "Какое невероятное зрелище, Тренер."
20044-40 = "Не забывай пить воду."
20044-50 = "Похоже, происходит что-то очень неспортивное."
20044-60 = "Нужно что-то сделать, Тренер!"
20044-70 = "Стремиться к победе важно."
20044-80 = "Но если зайти слишком далеко, это создаст свои проблемы."
20044-90 = "Я узнала что-то новое."
20044-100 = "Похоже, всё закончилось хорошо."
20044-110 = "Отпразднуем тренировкой?"
20044-120 = "Я надела это, чтобы не выделяться... но с практической точки зрения тоже неплохо."
20044-130 = "Тренер? Ты меня звал?"
20044-140 = "Что такое, Тренер? Хочешь проверить мои икры?"
20044-150 = "Если да, можешь трогать сколько хочешь. Фуфу."
20044-160 = "Сколько весит это оборудование для напитков?"
20044-170 = "Около 25 килограммов?"
20044-180 = "Идеально для длительной тренировки с малым весом и большим числом повторений."
20044-400 = "Ты здесь, Тренер."
20044-410 = "Есть что-нибудь, что тебе нравится?"
20044-420 = "Я занимаюсь нашими тренировочными припасами..."
20044-430 = "...так что к этой роли привыкла быстро и легко."
20044-440 = "Пожалуйста, проверь ещё раз, ничего ли не забыл."
20044-450 = "Определять количество и быстро выдавать нужное..."
20044-460 = "...думаю, это может помочь тренировке ловкости."
20044-470 = "Даже во время работы я сознательно слежу за осанкой."
20044-480 = "Всё-таки я президент Клуба спортивной подготовки."
20044-490 = "Да. Я здесь."
20044-500 = "Тебе нужно что-нибудь ещё, Тренер?"
20044-510 = "Поняла. Дай минутку."
20044-520 = "Хочешь бесплатный напиток?"
