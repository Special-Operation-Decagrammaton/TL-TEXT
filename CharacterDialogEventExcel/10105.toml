[translation]
10105-10 = "Здравствуйте, Сенсей."
10105-20 = "Если не возражаешь... Пожалуйста, смотри на меня... на сцене!"
10105-30 = "Ты готов, Сенсей?"
10105-40 = "Концерт скоро начнётся!"
10105-50 = "Пусть концерт продолжается!"
10105-60 = "Давай постараемся во второй половине концерта!"
10105-70 = "Фух! Как освежает!"
10105-80 = "Что ты почувствовал, Сенсей?"
10105-90 = "Ох, Сенсей. Что такое?"
10105-100 = "П-погоди!"
10105-110 = "П-прямо сейчас я, эм... вспотела..."
10105-120 = "Автограф...?"
10105-130 = "Я-я никогда о таком не думала..."
10105-140 = "Я выступлю так, чтобы потом ни о чём не жалеть!"
10105-440 = "Что ты ищешь?"
10105-450 = "Пожалуйста, выбирай что нравится! Я рекомендую..."
10105-460 = "Проверь, пожалуйста, ничего ли не забыл!"
10105-470 = "С-Сенсей...?!"
10105-480 = "Т-туда... Не на меня..."
10105-490 = "А-ха-ха!"
10105-500 = "Значит, ты выбрал это. Думаю, очень круто!"
10105-510 = "Да, я тоже смотрела на это."
10105-520 = "Хочешь остановиться на этом? Хорошо, держи."
10105-530 = "Вот это. Хорошо, держи."
