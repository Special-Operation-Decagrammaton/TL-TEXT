[translation]
10073-10 = "Сюда, Сенсей. Всё для расследования подготовлено."
10073-20 = "Летом так жарко... Даже просто стоять здесь утомительно..."
10073-30 = "Мы примерно на середине...?"
10073-40 = "Наше расследование здесь скоро закончится."
10073-50 = "Давай на всякий случай проверим..."
10073-60 = "С-Сенсей? Ч-что такое?"
10073-70 = "У меня что-то на лице...?"
10073-80 = "Даже если ты внезапно вот так меня позовёшь..."
10073-90 = "Если тебе что-нибудь нужно, просто скажи..."
10073-100 = "Хоть я и не люблю бывать на улице..."
10073-110 = "...всё было не так плохо, потому что я смогла побыть с тобой наедине."
10073-530 = "А теперь подведём итоги расследования."
10073-540 = "Мы многое узнали."
10073-550 = "Хм-м... Есть ещё что расследовать?"
10073-560 = "Больше нечего выяснять, даже если расследовать меня...!"
10073-570 = "Это... может оказаться очень значимым."
10073-580 = "Я знала, что на тебя можно рассчитывать, Сенсей."
