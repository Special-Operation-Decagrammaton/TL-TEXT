[translation]
10087-170 = "Добро пожаловать, Сенсей."
10087-180 = "Ты готов?"
10087-190 = "Подготовься. Держись."
10087-200 = "Все необходимые приготовления выполнены."
10087-210 = "Как Старший Администратор Команды Префектов Геенны..."
10087-220 = "...сейчас самое время выступить."
10087-230 = "Что касается вечеринки..."
10087-240 = "Интересно, чем всё это закончится?"
10087-250 = "Ну, неважно..."
10087-260 = "Что бы ни случилось, Команда Префектов..."
10087-270 = "Нет, я сама буду там и всё решу!"
10087-280 = "Сейчас я просто шпионка, поддерживающая Старшего Префекта Хину."
10087-290 = "Я всё это время сдерживалась. Может, пора показать свои настоящие навыки."
10087-300 = "Хи-хи. Жди с нетерпением."
10087-310 = "А я-то думала, в этом году будет тихо..."
10087-320 = "Но, наверное, для Геенны это слишком многого хотеть. Фух."
10087-330 = "Ну, я не могу просто сдаться."
10087-340 = "Серьёзно! Какой же ты настойчивый!"
10087-350 = "Фух, да, хорошо!"
10087-360 = "Теперь я готова сражаться до самого конца!"
10087-370 = "А теперь, пожалуйста, Сенсей! Пойдём!"
10087-380 = "Наконец-то всё закончилось..."
10087-390 = "Ого. Сегодня и правда столько всего произошло..."
10087-400 = "Кажется, всё напряжение полностью ушло."
10087-410 = "...Не хочешь вернуться и выпить чашку кофе, Сенсей?"
10087-420 = "Что касается вечеринки..."
10087-430 = "Интересно, чем всё это закончится?"
10087-440 = "Ну, неважно..."
10087-450 = "Что бы ни случилось, Команда Префектов..."
10087-460 = "Нет, я сама буду там и всё решу!"
10087-470 = "Сейчас я просто шпионка, поддерживающая Старшего Префекта Хину."
10087-480 = "Я всё это время сдерживалась. Может, пора показать свои настоящие навыки."
10087-490 = "Хи-хи. Жди с нетерпением."
10087-500 = "А я-то думала, в этом году будет тихо..."
10087-510 = "Но, наверное, для Геенны это слишком многого хотеть. Фух."
10087-820 = "Добро пожаловать, Сенсей."
10087-830 = "У меня есть кое-что, с чем я хотела бы попросить тебя разобраться."
10087-840 = "Поможешь мне?"
10087-850 = "Хи-хи. Теперь не убегай! Особенно после того, как зашёл так далеко."
10087-860 = "Ага, твой список дел забит до отказа. ♪"
10087-870 = "Именно. Если думаешь отлынивать, лучше передумай."
10087-880 = "Я буду прямо рядом. Внимательно наблюдать... то есть помогать тебе."
10087-890 = "Я понимаю желание заняться чем угодно, лишь бы не задачей прямо перед тобой."
10087-900 = "Но всё остальное может подождать, пока работа не будет закончена."
10087-910 = "Понял?"
10087-920 = "Хм-м... Неплохо."
10087-930 = "Хорошая награда за хорошую работу. Всё естественно."
10087-940 = "Ох... Ты решил это с первой попытки?"
10087-950 = "Ого... Я впечатлена. Правда. Как и ожидалось от тебя, Сенсей."
