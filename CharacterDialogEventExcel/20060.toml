[translation]
20060-610 = "Знаете, Ибуки так радовалась своей первой поездке на пляж."
20060-620 = "Ибуки очень рада быть здесь вместе с Сенсеем!"
20060-630 = "Ироха выглядит такой занятой."
20060-640 = "Ибуки тоже хочет помогать!"
20060-650 = "Пожалуйста, не ссорьтесь... Ссориться плохо..."
20060-660 = "У-у... Это из-за Ибуки? Ибуки плохо себя вела?"
20060-670 = "Так точно, капитан! Йо-хо-хо!"
20060-680 = "Знаете, знаете! Ибуки было так весело на море!"
20060-690 = "В следующий раз... Хр-р..."
20060-700 = "Что такое, Сенсей?"
20060-710 = "Вы будете играть с Ибуки?"
20060-720 = "А вы знали? Чиаки делает о-о-очень много фотографий Ибуки!"
20060-730 = "Поэтому у Ибуки столько фотографий!"
20060-740 = "Сенсей! Отсюда и до-о-о самого..."
20060-750 = "...горизонта! Везде море!"
20060-760 = "Интересно, Ибуки встретит говорящую рыбку?"
20060-770 = "Ибуки видела такую в фильме!"
20060-1060 = "Добро пожаловать, Сенсей! Здесь главная Ибуки!"
20060-1070 = "Ведь Ибуки настоящий член Общества Пандемониума!"
20060-1080 = "Столько всего сложного...!"
20060-1090 = "Вы знаете, что это такое, Сенсей?"
20060-1100 = "Молодец! Хи-хи! А ещё Ибуки научилась вот так ставить печать!"
20060-1110 = "Сенсей, вы заняты? Ибуки тоже хочет вам помочь!"
20060-1120 = "Кхм! Сейчас Ибуки усердно работает!"
20060-1130 = "Играть будем после работы!"
20060-1140 = "Ибуки справится сама."
20060-1150 = "Но Ибуки нравится работать вместе с Сенсеем!"
