[translation]
20040-330 = "Добро пожаловать, Сенсей. Не спеши, осматривайся."
20040-340 = "Общество Пандемониума очень старалось ради этого события..."
20040-350 = "...так что уверена, тебе понравится."
20040-360 = "Хм? Ты продолжаешь меня донимать..."
20040-370 = "Чего-то хочешь?"
20040-380 = "Сенсей, чего ты желаешь?"
20040-390 = "Хи-хи, Сенсей... Попробуй меня загипнотизировать."
20040-400 = "Конечно, на мне это не сработает..."
20040-410 = "А? Всё нормально?"
20040-420 = "Хи-хи, не говори так... Вот."
20040-430 = "Сенсей, если будешь стоять без дела, можешь оказаться втянут в планы Макото."
20040-440 = "Идите сюда."
