[translation]
16017-330 = "Сенсей... Спасибо, что пришёл..."
16017-340 = "К-Когда рядом взрослый, как-то спокойнее..."
16017-350 = "Х-Хайлендер не всегда такой...! Просто в этот раз всё..."
16017-360 = "Н-ну, вообще-то обычно всё примерно так и бывает..."
16017-370 = "Н-Но не всегда полный бардак. Наверное... Я не уверена."
16017-380 = "Ух... К-Кажется, эта ситуация становится очень хлопотной..."
16017-390 = "Не знаю, можно ли доверять офицерам... Эм..."
16017-400 = "Фух... Н-Но, похоже, всё заканчивается нормально..."
16017-410 = "В-Всё закончилось... как-то..."
16017-420 = "С-Спасибо за т-тяжёлую работу, Сенсей..."
16017-430 = "Ч-что случилось?.."
16017-440 = "Э... Я-Я что-то сделала не так...?"
16017-450 = "У-У меня плохое предчувствие..."
16017-460 = "Всё ведь будет хорошо, да...?"
16017-470 = "Ну почему все наши офицеры такие?.."
16017-480 = "Они не могут понять боли сотрудников низшего звена..."
16017-490 = "...П-Почему ты это делаешь...?"
16017-500 = "Щекотно... Это моё слабое место..."
16017-720 = "К-Кажется, ещё так много осталось..."
16017-730 = "С-Сенсей... Я рада, что ты здесь."
16017-740 = "Наверное, мне спокойнее... или, скорее, я чувствую облегчение..."
16017-750 = "Хи-хи."
16017-760 = "Д-Даже если ты будешь так меня тыкать... м-меню помощи не откроется..."
16017-770 = "М-Мне нужно что-то сделать... У-у-ух..."
16017-780 = "В-Вау..."
16017-790 = "З-Задача была непростой..."
