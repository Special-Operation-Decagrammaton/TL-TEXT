[translation]
10118-160 = "Пахяхя! Готов?"
10118-170 = "Тогда ОТПРАВЛЯЕМСЯ!"
10118-180 = "Всё получилось в последний момент, так что спасибо, что пришёл!"
10118-190 = "Ситуация, как бы это сказать, «срочная». Так что оставляю всё тебе, Сенсей!"
10118-200 = "Так нормально, да?"
10118-210 = "Ну, пока тормоза не сломаются!"
10118-220 = "А-а-а! Скоро всё закончится! Я это чувствую!"
10118-230 = "Хья-а-а! Наконец-то всё!"
10118-240 = "Всё получилось, правда? Пахяхя!"
10118-250 = "А? Что такое?"
10118-260 = "Ничего? Ну блин. Я ведь тоже могу тебя потыкать!"
10118-270 = "*вздох* Как всё вообще до такого дошло?"
10118-280 = "Эх, как-нибудь да получится, пра-а-авда?"
10118-290 = "Тут есть что-нибудь весёлое?"
10118-300 = "Что-нибудь, чтобы успокоить нервы!"
10118-310 = "Хотя у меня и нервов-то нет! Пахяхяхя!"
10118-320 = "Продолжайтесь пользоваться Железными Дорогами Хайлендера! Удачи, Сенсей."
10118-610 = "Осматривайся сколько хочешь."
10118-620 = "Если не найдёшь то, что хочешь, просто скажи!"
10118-630 = "То есть не то чтобы я знала, где оно! Пахьяхья!"
10118-640 = "Работа закончилась, но заглядывайте если что-то будет нужно."
10118-650 = "Ага! А как же я?"
10118-660 = "...Хочешь, чтобы я выбрала за тебя?"
10118-670 = "Ни за что! Ты должен выбрать сам, иначе в этом нет смысла!"
10118-680 = "О, вот это! Отлично!"
10118-690 = "Хороший выбор! Пахяхя!"
10118-700 = "Я тоже это хочу."
10118-710 = "У тебя хороший вкус, правда?"
