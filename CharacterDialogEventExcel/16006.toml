[translation]
16006-280 = "О, это Сенсей! Добро пожаловать в пляжную лавку!"
16006-290 = "Добро пожаловать, Сенсей! Я тебя ждала!"
16006-300 = "Мы почти на середине дня! Наслаждайся, пока можешь!"
16006-310 = "Конец уже близко! Не сбавляй темп!"
16006-320 = "Сенсей! Сегодня последний день работы магазина. Ты взял всё, что хотел?"
16006-330 = "Мы закрываемся! Спасибо всем!"
16006-340 = "Думал, всё? Хи-хи. Не переживай. Время ещё есть!"
16006-350 = "Не забудь в последний раз проверить, ничего ли не упустил!"
16006-360 = "Да! Полюбуйся! Столько вкусностей!"
16006-370 = "Эй, Сенсей! Вот это... А?"
16006-380 = "Да не смотри на меня! Лучше осмотрись в магазине!"
16006-390 = "Эм! Б-бесплатно ничего не дам, сколько бы ты меня ни тыкал!"
16006-400 = "Ого! Я так и знала, Сенсей!"
16006-410 = "Ты выбрал это? Хм-м... Хороший выбор!"
