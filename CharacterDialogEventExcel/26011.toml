[translation]
26011-200 = "Вот ты где, Сенсей! Пойдём!"
26011-210 = "Я тебя ждала, Сенсей!"
26011-220 = "Мы уже на середине! Давай закончим!"
26011-230 = "Почти всё. Ну же...!"
26011-240 = "Готово! Может, ещё раз посмотрим?"
26011-250 = "Хм? Сенсей? Что такое?"
26011-260 = "Эм, я могу чем-нибудь помочь?"
26011-270 = "Эм, Сенсей, сейчас не время играть."
26011-280 = "Сенсей! Сосредоточься! Сосредоточься!"
26011-290 = "Та-дам! Я приготовила кучу всего!"
26011-300 = "Вот, Сенсей! Выбирай любимое!"
26011-310 = "Что-нибудь ещё осталось сделать? Проверка, проверка, проверка!"
26011-320 = "Что? Что ты ищешь?"
26011-330 = "То, что ты ищешь, вон там, а не здесь..."
26011-340 = "О, это? Отлично!"
26011-350 = "Хм-м-м! Какой ты наблюдательный! ...Вот так!"
26011-360 = "Ты нашёл! Я беру!"
26011-370 = "О, да! Мне тоже казалось, что это хорошо!"
