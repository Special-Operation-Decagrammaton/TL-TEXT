[translation]
10124-520 = "Не думала, что вот так окажусь на пляже."
10124-530 = "Хм? Я выгляжу взволнованной?"
10124-540 = "Фу-фу, возможно."
10124-550 = "Задание не изменилось, но новая обстановка придаёт ему свежести."
10124-560 = "Так что я с нетерпением жду ближайших дней."
10124-570 = "А, Сенсей. Ты случайно не видел Ичику и Мику?"
10124-580 = "От них ни слуху ни духу."
10124-590 = "Неужели... с ними что-то случилось?"
10124-600 = "Вы говорите не волноваться и просто отдыхать, но..."
10124-610 = "Что ж, я поверю тебе, Сенсей."
10124-620 = "Не могу поверить, что всё это произошло прямо у меня под носом."
10124-630 = "Мне немного стыдно. Я так увлеклась отдыхом, что забыла об обязанностях."
10124-640 = "Ты рад, что мне было весело?"
10124-650 = "Только ты мог бы сказать мне такое, Сенсей."
10124-660 = "Пусть всё пошло не совсем по плану, закончилось всё хорошо."
10124-670 = "И ты сыграл в этом ключевую роль, Сенсей."
10124-680 = "Как представитель Оперативной группы правосудия я хочу ещё раз поблагодарить тебя."
10124-690 = "Наша Ичика тоже немного повзрослела."
10124-700 = "И лично я тоже хочу поблагодарить тебя за это."
10124-710 = "Из-за наших внутренних дел мы у тебя в долгу."
10124-720 = "Даже если вы говорите не беспокоиться об этом..."
10124-730 = "Что ж, наверное, именно такого ответа я от тебя и ожидала."
10124-740 = "Но мне хотелось хотя бы выразить свои чувства."
10124-750 = "Спасибо. Правда."
10124-760 = "Это событие многое значило для всей Оперативной группы правосудия."
10124-770 = "Потому что однажды ей придётся исполнять эту роль самостоятельно."
10124-780 = "Как ты уже знаешь, общественные дела — не сильная сторона Цуруги."
10124-790 = "Из-за этого мне пришлось..."
10124-800 = "...стать основным связующим звеном с Чайной партией."
10124-810 = "...Если подумать, я уже довольно давно служу этим троим."
10124-820 = "Если честно, я уже смирилась с тем, что никогда не попаду на пляж."
10124-830 = "Мне действительно стоит поблагодарить Мику за это."
