[translation]
26017-864-240-1 = "Vroom,\nvroom-vroom-vroom-vroom\nvroom-vroom-vroom-vroom!"
26017-864-250-1 = "That was the sound of a\ndiesel engine on a\ncold morning."
26017-864-260-1 = "What do you think?\nDid it sound like one?"
26017-864-270-1 = "Seeing all these different tanks\nreally gets me\nexcited."
26017-864-280-1 = "What will be the fate of\nSpecial Class 183—"
26017-864-290-1 = "…That was an imitation\nof a voice from the heavens."
26017-864-300-1 = "There are so many\nsmiling people here…."
26017-864-310-1 = "It makes me want to\nsmile too."
26017-864-320-1 = "The Gehenna Cup is over.\nLet's hurry home before\nthe parking lot gets crowded."
26017-864-330-1 = "It's very crowded here.\nPlease be careful not to\nlet any children get lost."
26017-864-340-1 = "Holding hands is a good way\nto prevent getting lost."
26017-864-350-1 = "It's a theory proven by\nexperiment, so there is\nno mistake."
26017-864-360-1 = "Head pats are fine, but\ndon't forget to\nhold hands as well."
26017-864-370-1 = "That place looks fun.\nI would be happy if you\ncould take me there."
26017-864-470-1 = "Hmm, equivalent exchange, is it?"
26017-864-480-1 = "When shopping, I think it's best\nto set priorities."
26017-864-490-1 = "I had heard that things called\n'closing sales' existed….\nI suppose they aren't doing that here."
26017-864-500-1 = "I am not for sale.\nBesides, Sensei, I don't think\nyou need to buy anything."
26017-864-510-1 = "Thank you for the\nhead pats.\nIs there anything you want?"
26017-864-520-1 = "I would say that is the optimal choice."
26017-864-530-1 = "Do you use this too, Sensei?"
26017-864-540-1 = "Sensei, have you ever tried saying,\n'Keep the change'?"
26017-864-550-1 = "Without a shopping list…\nYou remembered everything.\nThat's cool."
26017-864-640-1 = "A challenge, then.\nI accept."
26017-864-650-1 = "It's work. I considered\nfinishing it for you,"
26017-864-660-1 = "but I shouldn't deprive you\nof the fun, Sensei."
26017-864-670-1 = "Meow."
26017-864-680-1 = "My nose… is something the matter?\nWas it contaminated?\nDid it change shape?"
26017-864-690-1 = "I want to keep watching\nyour success, Sensei."
26017-864-700-1 = "You did it. That's wonderful."
26017-864-710-1 = "I don't know the details, but"
26017-864-720-1 = "knowing you, Sensei,\nyou must have accomplished\nsomething truly amazing."
26017-864-900-1 = "Welcome to the\nTank Racing mission."
26017-864-910-1 = "Usually, I understand racing missions\nto mean 'don't cause an accident'\nor 'win the race'."
26017-864-920-1 = "Meow."
26017-864-930-1 = "You really like my cheeks,\ndon't you, Sensei?\nIt makes me happy."
26017-864-940-1 = "I am not a start button.\nI prefer head pats."
26017-864-950-1 = "Effort is usually accompanied by rewards…\nbut does the reward also require effort?"
26017-864-960-1 = "Reward collection route identified.\nIt's very simple."
