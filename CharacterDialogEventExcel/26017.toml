[translation]
26017-240 = "Vrum,\nvrum-vrum-vrum-vrum!\nVrum-vrum-vrum-vrum!"
26017-250 = "That was the sound of a diesel engine starting up on a cold morning."
26017-260 = "How was that? Did it sound similar?"
26017-270 = "Seeing all these different tanks really gets my spirits up."
26017-280 = "And what will be the fate of Special Class 183—"
26017-290 = "...That was me imitating a voice from the heavens."
26017-300 = "There are so many smiling people here..."
26017-310 = "It makes me want to smile, too."
26017-320 = "The Gehenna Cup is over.\nLet's head back quickly before the parking lot gets crowded."
26017-330 = "It's very crowded.\nPlease be careful not to let any children get lost."
26017-340 = "Holding hands is a good way to prevent getting lost."
26017-350 = "It's a theory proven by experimentation, so there is no doubt about it."
26017-360 = "Headpats are fine, but don't forget to hold hands, too."
26017-370 = "That looks fun over there.\nI'd be happy if you could take me."
26017-470 = "Hmm, equivalent exchange, is it?"
26017-480 = "When shopping, I think it's best to establish priorities."
26017-490 = "I had heard that things called 'going-out-of-business sales' existed...\nI suppose they aren't holding one here."
26017-500 = "I am not for sale.\nBesides, as for you, Sensei, I don't think you need to bother purchasing anything."
26017-510 = "Thank you for the headpats.\nIs there anything you want?"
26017-520 = "I'd say this is the optimal choice."
26017-530 = "Do you use this too, Sensei?"
26017-540 = "Sensei. Have you ever tried saying, 'Keep the change'?"
26017-550 = "Without even a shopping list...\nYou managed to remember everything.\nThat's cool."
26017-640 = "An assignment, then.\nI accept the challenge."
26017-650 = "It's work. I did consider finishing it in your place,"
26017-660 = "but I wouldn't want to rob you of your fun."
26017-670 = "Meow."
26017-680 = "My nose... is something the matter?\nWas it contaminated?\nDid it deform?"
26017-690 = "I want to watch your success forever, Sensei."
26017-700 = "You did it. How wonderful."
26017-710 = "I don't know the details, but..."
26017-720 = "Knowing you, Sensei,\nI'm sure you've accomplished something wonderful."
26017-900 = "Welcome to the tank racing mission."
26017-910 = "Normally, I understand racing missions to be about 'avoiding accidents' and 'winning the championship'."
26017-920 = "Mew."
26017-930 = "You really like my cheeks, don't you, Sensei?\nI'm happy about that."
26017-940 = "I am not a start button.\nI prefer headpats."
26017-950 = "Effort is always accompanied by rewards, but...\nAre rewards also accompanied by effort?"
26017-960 = "Reward claim route acquired.\nThat was very simple."
