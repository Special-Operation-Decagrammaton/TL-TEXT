[перевод]
26017-240 = "Бум, врум-врум-врум-врум врум-врум-врум-врум!"
26017-250 = "Это был звук работающего дизельного двигателя холодным утром."
26017-260 = "Как думаете, он звучал похоже?"
26017-270 = "Вид всех этих танков меня очень радует."
26017-280 = "Итак, какова будет судьба танка спецкласса №183..."
26017-290 = "...Это было имитацией голоса с небес."
26017-300 = "Так много улыбающихся людей..."
26017-310 = "Это тоже заставляет меня улыбаться."
26017-320 = "Кубок Геенны закончился. Давайте поскорее домой, пока парковка не заполнилась."
26017-330 = "Здесь многолюдно. Пожалуйста, будьте осторожны, чтобы ваши дети не потерялись."
26017-340 = "Держаться за руки не даст детям заблудиться."
26017-350 = "Это теория, доказанная экспериментами, так что она определённо верна."
26017-360 = "Гладить — это хорошо, но не забывайте держаться за руки."
26017-370 = "Это место выглядит забавно. Было бы здорово, если бы вы меня туда отвели."
26017-470 = "Хм, эквивалентный обмен, да?"
26017-480 = "Когда делаешь покупки, я думаю, что лучше расставить приоритеты."
26017-490 = "Я слышал, что бывают «распродажи перед закрытием»... Но здесь их нет, правда?"
26017-500 = "Я не продаюсь. К тому же, если вы Сенсей, я думаю, вам не нужно меня покупать."
26017-510 = "Спасибо за ласку. Есть что-нибудь, что вам нужно?"
26017-520 = "Я бы сказал, это идеальная вещь."
26017-530 = "Вы тоже этим пользуетесь, Сенсей?"
26017-540 = "Сенсей, вы когда-нибудь говорили: «Оставьте сдачу себе»?"
26017-550 = "Без списка покупок... Вы всё запомнили. Это здорово."
26017-640 = "Это вызов. Я принимаю вызов."
26017-650 = "Это работа. Я подумывал закончить её, но..."
26017-660 = "Я не должен лишать вас удовольствия, Сенсей."
26017-670 = "Мяу."
26017-680 = "Что не так с моим носом...? Он был заражён? Он был деформирован?"
26017-690 = "Я хочу продолжать наблюдать за вашими достижениями, Сенсей."
26017-700 = "Вы справились. Это замечательно."
26017-710 = "Я не знаю подробностей, но..."
26017-720 = "Зная вас, Сенсей... я уверен, что вы совершили что-то замечательное."
26017-900 = "Добро пожаловать в миссию танковых гонок."
26017-910 = "Обычно я понимаю, что миссия гонок состоит в том, чтобы «избегать аварий» и «выиграть гонку»."
26017-920 = "Мяу."
26017-930 = "Сенсей, вам нравятся мои щёчки, не так ли? Я этому рад."
26017-940 = "Я не кнопка запуска. Я предпочитаю, когда меня гладят."
26017-950 = "Усилия вознаграждаются, но... требует ли награда усилий?"
26017-960 = "Понять, как получить награду. Это очень просто."