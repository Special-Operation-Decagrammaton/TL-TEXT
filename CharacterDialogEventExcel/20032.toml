[translation]
20032-10190 = "Привет, Сенсей. Как тебе новая база?"
20032-10200 = "Дел здесь много..."
20032-10210 = "Будем разбираться шаг за шагом."
20032-10220 = "Добро пожаловать, Сенсей. Можешь рассказать мне всё, что захочешь."
20032-10230 = "Президент Химари, похоже, занята."
20032-10240 = "...Но, судя по всему, ей ещё и весело, так что проблемы я не вижу."
20032-10250 = "Иди сюда, если тебе холодно, Сенсей."
20032-10260 = "Так ведь будет эффективнее, разве нет?"
20032-10270 = "Температура и производительность тесно связаны."
20032-10280 = "И здесь приятно находиться, так что мне нравится."
20032-10290 = "Хорошая работа, Сенсей. Что у тебя там?"
20032-10300 = "Когда ты рядом, вероятность успеха любой операции повышается."
20032-10310 = "...И моя эффективность тоже."
20032-10750 = "Здесь мы анализируем то, что ты собрал... Наверное."
20032-10760 = "Чем больше образцов, тем лучше. Оставляю это тебе."
20032-10770 = "Идеально вовремя. Ты тоже осознал важность эффективности?"
20032-10780 = "Хм? Что такое?"
20032-10790 = "...Ты просто позвал меня? Зачем...?"
20032-10800 = "Ну, если тебе именно этого хотелось..."
20032-10810 = "Если взять это, а потом сделать вот так, то из этого что-то получится."
20032-10820 = "Я не очень понимаю..."
20032-10830 = "Но так сказала президент."
20032-10840 = "Во время анализа особо нечем заняться."
20032-10850 = "...Сенсей, можно я сяду к тебе на колени?"
20032-10860 = "Моя температура — мешающая переменная,"
20032-10870 = "Так что мне велели не подходить близко во время анализа..."
20032-10880 = "Я понимаю, но всё равно неприятно это слышать."
20032-10890 = "Это место... мне нравится."
20032-10900 = "Разве нельзя взять часть клубной комнаты и перенести её сюда?"
20032-10910 = "Хорошо, держи."
20032-10920 = "...Это называется «бартером»?"
20032-10930 = "Результаты готовы. Что выберешь?"
20032-10940 = "Ага, выглядит неплохо."
20032-10950 = "Было бы лучше, если бы результаты были разнообразнее."
20032-10960 = "...Этого достаточно? Понятно."
20032-10970 = "Я не очень понимаю..."
20032-10980 = "...но надеюсь, это тебе поможет, Сенсей."
20032-12100 = "С этого момента немного изменим методы анализа образцов."
20032-12110 = "Похоже, это место для проверки удачи..."
20032-12120 = "Разве будущее и без того недостаточно неопределённо?"
20032-12130 = "Поставить на твою удачу, Сенсей?"
20032-12140 = "Тогда сделай всё возможное и ради моей."
20032-12150 = "Похоже, президент кое-что изменила..."
20032-12160 = "Лично я считаю, что можно было сделать лучше."
20032-12170 = "Я предпочитаю гарантированные результаты."
20032-12180 = "Токи говорит, что ей нравится этот метод."
20032-12190 = "По её лицу этого не скажешь..."
20032-12200 = "...Но у неё всё же есть определённый запал."
20032-12210 = "Я мало знаю о методологии,"
20032-12220 = "но понимаю, что что-то изменилось."
20032-12230 = "Сенсей, если тебе выпадет промах, я, возможно, оставлю тебя здесь."
20032-12240 = "...Это была шутка. Повезёт тебе или нет, я всё равно останусь рядом, Сенсей."
20032-12250 = "Если результат тебя не устроит, скажи мне."
20032-12260 = "Я буду здесь, чтобы тебя утешить."
20032-12270 = "Ты выиграл! Поздравляю, Сенсей."
20032-12280 = "Так «джекпот» действительно существовал..."
20032-12290 = "Я удивлена... Тебе и правда везёт, Сенсей."
20032-12300 = "Это результат наших совместных усилий."
20032-12310 = "Поздравляю, Сенсей. За нас!"
