[translation]
10145-10 = "Ну что ж, лето настало. Как и наш отпуск."
10145-20 = "Хотя я не могу притвориться, что читаю Ваши мысли..."
10145-30 = "Разве Вы не знаете, насколько я взволнована?"
10145-40 = "Прекрасная долина."
10145-50 = "Особенно её пейзажи."
10145-60 = "Перед лицом природы..."
10145-70 = "...люди так малы и незначительны."
10145-80 = "Сенсей! С Вами Кики пойдёт хоть на край света!"
10145-90 = "...Собираетесь просто смотреть?"
10145-100 = "Сезоны неопытности естественны для всех нас."
10145-110 = "Как бы то ни было, всегда нужно оставаться студентом..."
10145-120 = "...изучающим интриги этого мира."
10145-130 = "Всё закончилось без сучка и задоринки.."
10145-140 = "Однако наш отпуск..."
10145-150 = "...всё ещё не окончен, не так ли?"
10145-160 = "Хм? В чём дело, Сенсей?"
10145-170 = "Фуфу, ну тогда. Наслаждайтесь от души."
10145-180 = "Мягкой кожей... Вашей Мадам?"
10145-190 = "Я будто в сладком сне, ведь я могу быть здесь, рядом с Вами."
10145-200 = "Фуфу... Никаких скрытых намёков."
10145-210 = "Это не значит, что здоровье меня подводит."
10145-220 = "Поэтому, пожалуйста, воспринимайте мои слова такими, какими они есть."
10145-230 = "В Шаньхайцзине синяя бабочка порой символизирует бессмертие."
10145-240 = "Другими словами..."
10145-250 = "...синяя бабочка так легко не сдаётся."
10145-260 = "Фуфу. Не сочтите это за шутку, пожалуйста."
10145-270 = "Спасибо."
10145-280 = "За то, что побаловали меня, Сенсей."
10145-290 = "И заранее приношу свои извинения."
10145-300 = "Ведь с этого момента я собираюсь становиться только хуже."
10145-790 = "Сенсей, приветики! Это Кики!"
10145-800 = "Кики присматривает за магазином!"
10145-810 = "Чего? \"Кисаки\"? Кто это? Кики без понятия!"
10145-820 = "Добро пожаловать, Сенсей!"
10145-830 = "Кики очень старается приглядывать за магазином! Похвалите Кики, пожалуйста!"
10145-840 = "Ура! Сенсей пришёл!"
10145-850 = "Убедитесь, что ничего не пропустите, ладненько?"
10145-860 = "Моё любимое? Хмм, Кики нравится..."
10145-870 = "Кики нравится всё, что нравится Сенсею!"
10145-880 = "Кики попробовала надеть купальник..."
10145-890 = "Ну как он Вам? Нравится? Правда Кики милашка?"
10145-900 = "Но правда в том, что... Кики не умеет плавать."
10145-910 = "Ого, Кики это тоже нравится!"
10145-920 = "Это... Вот так, да? Кики тоже знает!"
10145-930 = "Огромное спасибо!"
10145-940 = "Ура! Кики тоже! Кики тоже хочет увидеть!"
10145-950 = "Вот, держите! Кики хорошо постаралась?"
