[translation]
10108-10 = "Добро пожаловать, Сенсей."
10108-20 = "Не думала, что ты придёшь."
10108-30 = "Здравствуйте, Сенсей."
10108-40 = "Мы собирались устроить пижамную вечеринку в честь конца года, но..."
10108-50 = "...возникла небольшая проблема."
10108-60 = "КО! Ю! КИ!!!"
10108-70 = "На этот раз я ей так просто не спущу! Серьёзно!"
10108-80 = "Так что, пожалуйста, не пытайся меня остановить!"
10108-90 = "Как-то всё разрешилось..."
10108-100 = "В каком-то смысле это и благодаря тебе, Сенсей."
10108-110 = "Ты про Коюки?"
10108-120 = "...Я отпущу это. Только в этот раз."
10108-130 = "А, ты здесь, Сенсей. Не хочешь немного отдохнуть перед уходом? Только если хочешь..."
10108-140 = "Что? Эта моя сторона кажется тебе необычной?"
10108-150 = "С-спасибо."
10108-160 = "Услышать такое от тебя, Сенсей..."
10108-170 = "...делает меня очень счастливой."
10108-180 = "Ты только сейчас понял, что я старшеклассница?"
10108-190 = "А кем я была для тебя раньше?!"
10108-200 = "Настольные игры довольно реалистичны: играть весело, но управляться со всеми фишками, похоже, немного сложно."
10108-210 = "Особенно если вспомнить некоторых студентов Миллениума, которые ужасно организуют вещи и убираются."
10108-220 = "Эм, Сенсей? Пожалуйста, перестань тыкать меня в талию..."
10108-230 = "...Я всерьёз разозлюсь, если ты попытаешься намекнуть, что я набрала вес."
10108-410 = "Тебе что-нибудь нужно?"
10108-420 = "Поскольку конец года приближается, я разбираю припасы. Бери всё, что нужно."
10108-430 = "Я собираю припасы для пижамной вечеринки."
10108-440 = "Если тебе что-нибудь нужно, просто скажи."
10108-450 = "Здравствуйте, Сенсей."
10108-460 = "Убедись, что ничего не пропустил! Проверь внимательно!"
10108-470 = "Подготовка к этой вечеринке ощущается как продолжение моей бухгалтерской работы..."
10108-480 = "Кстати, в магазине у Шале..."
10108-490 = "...работает милая девочка, которая им управляет."
10108-500 = "Она всегда там. Интересно, ей вообще дают нормально отдыхать."
10108-510 = "Хочешь взять это?"
10108-520 = "Выглядит разумным выбором."
10108-530 = "Я сохраню чек..."
10108-540 = "Позже внесу его в бухгалтерскую книгу Шале."
10108-550 = "Хи-хи. Так я смогу анализировать твои покупательские привычки, Сенсей."
