[translation]
10148-400 = "Серьёзно, какая глупость."
10148-410 = "Как такое вообще могло произойти? Как?!"
10148-420 = "Почему никто, кроме меня, не понимает, насколько всё серьёзно?"
10148-430 = "Хоть Сенсей здесь, и то хорошо."
10148-440 = "Зачем я вообще остаюсь в Обществе Пандемониума..."
10148-450 = "А, Сенсей. Ничего страшного."
10148-460 = "Уф, да что ж такое!"
10148-470 = "Почему в итоге краснею только я?!"
10148-480 = "В их-то возрасте играть в пиратов..."
10148-490 = "...Наконец-то всё закончилось."
10148-500 = "А, пока ко мне не подходите. И не разговаривайте со мной."
10148-510 = "На первом курсе я считала, что Общество Пандемониума состоит из настоящей элиты."
10148-520 = "...Как же хочется вправить мозги себе прежней."
10148-530 = "Сенсей."
10148-540 = "Вы сейчас хотели сказать что-нибудь вроде «Давайте постараемся!», верно?"
10148-550 = "У вас всё на лице написано."
10148-560 = "Достоинства Макото? Вы серьёзно спрашиваете об этом сейчас?"
10148-570 = "Ну, эм..."
10148-580 = "...Она неплохо выглядит, пока молчит."
10148-590 = "Приятно, когда есть с кем поговорить по делу."
10148-600 = "Когда вернёмся, пожалуй, буду чуть добрее к Чиаки."
10148-920 = "*вздыхает* Какая морока."
10148-930 = "Простите, не могли бы вы помочь?"
10148-940 = "Принесите мне что угодно, а я попробую разобраться."
10148-950 = "...Почему во всём Обществе Пандемониума этим занимаюсь только я?"
10148-960 = "Пора распрощаться с этим хламом."
10148-970 = "А, можете забрать остатки. Хотя не знаю, зачем они вам."
10148-980 = "...Вы специально?"
10148-990 = "Нет, ничего."
10148-1000 = "Сенсей, эм..."
10148-1010 = "Вы же меня трогаете, знаете?"
10148-1020 = "А, спасибо. Избавили меня от лишней мороки."
10148-1030 = "О... Так вот как это делается."
10148-1040 = "Вам нужно ИМЕННО это? Хм..."
10148-1050 = "А, как раз это и было нужно. Спасибо."
