[translation]
10148-400 = "Seriously, I've had enough..."
10148-410 = "How on earth did things\nend up like this?"
10148-420 = "Why can't anyone else see\nhow serious this is?"
10148-430 = "Haa... I'm so glad\nyou're here, Sensei."
10148-440 = "Why... why am I\nstill in Pandemonium...?"
10148-450 = "Oh, Sensei.\nNo, it's nothing.\nPlease, don't worry about it."
10148-460 = "Honestly,\nwhat is wrong with them!"
10148-470 = "Why am I the only one\nwho has to be embarrassed!?"
10148-480 = "Playing pirates...?\nThey really need to act\ntheir age..."
10148-490 = "...It's taken care of."
10148-500 = "Please just leave me\nalone for now."
10148-510 = "When I was a first-year,\nI thought Pandemonium\nwas a group of honor students."
10148-520 = "...I want to go back and\nslap some sense into my past self."
10148-530 = "Sensei."
10148-540 = "Are you about to say\n'let's all do our best'?"
10148-550 = "It's written all over your face."
10148-560 = "Makoto-senpai's good points?\nAre you asking that seriously?"
10148-570 = "Hmmmmmmm..."
10148-580 = "Her face isn't bad.\n...As long as she stays quiet."
10148-590 = "I never realized how grateful I'd be\njust to have someone who listens."
10148-600 = "Maybe I should be a little\nnicer to Chiaki."
10148-920 = "Haa... I want to slack off..."
10148-930 = "If you don't mind,\ncould you lend me a hand?"
10148-940 = "Just bring it here,\nand I'll figure something out."
10148-950 = "I mean, why is it that\nno one else can do this...?"
10148-960 = "Time to say goodbye to this junk."
10148-970 = "Take the rest of it.\nI don't care what you\nplan to do with it."
10148-980 = "...Are you doing that on purpose?"
10148-990 = "No, it's nothing."
10148-1000 = "Um, Sensei..."
10148-1010 = "You're touching it..."
10148-1020 = "Thank you.\nThat's one less headache\nfor me to deal with."
10148-1030 = "Ah... so it goes like this."
10148-1040 = "Is that sort of thing necessary?\nHuh..."
10148-1050 = "I was just looking for this.\nThank you."