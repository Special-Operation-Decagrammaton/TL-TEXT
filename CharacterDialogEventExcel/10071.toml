[translation]
10071-10 = "Сегодняшняя миссия — проникновение и разведка... Надеюсь, проблем не возникнет."
10071-20 = "RABBIT 1, подготовка завершена. Сенсей, ваши приказы."
10071-30 = "Боюсь, я расстроила местных жителей..."
10071-40 = "Что мне делать?"
10071-50 = "Хи-хи... Мы и правда провели это лето по-эсэртэшному, да? Во многих смыслах было веселее, чем обычный пляжный отпуск."
10071-60 = "Отличная работа, Сенсей."
10071-70 = "Я знаю, мы здесь по заданию, но всё-таки мы на пляже..."
10071-80 = "...у тебя найдётся немного времени для нас?"
10071-90 = "Когда я в последний раз ела сэндвич с креветками...?"
10071-100 = "(Не стоит выглядеть слишком взволнованной...)"
10071-110 = "Я договорилась на время нашего отсутствия."
10071-120 = "Студенты Бюро общественной безопасности Валькирии будут присматривать за Бун-Бун, пока нас нет."
10071-130 = "Признаюсь, иногда я немного ревную..."
10071-140 = "Просто... иногда кажется, что Бун-Бун любит студентов Бюро общественной безопасности больше, чем нас."
10071-530 = "Добро пожаловать, Сенсей. Я составила список вещей, которые понадобятся для расследования."
10071-540 = "...Вот цель сегодняшней операции под прикрытием."
10071-550 = "Да. Ч-чем я могу помочь?"
10071-560 = "Эм... Ткань этого купальника немного тонкая..."
10071-570 = "Е-если ты будешь так на меня смотреть... я не знаю, что сказать..."
10071-580 = "Как и ожидалось от Сенсея. Я в тебя верила."
10071-590 = "Спасибо за помощь. Ты очень выручил."
