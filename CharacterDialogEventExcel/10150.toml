[translation]
10150-150 = "Odyssey\nMarine High School—"
10150-160 = "That's not it..."
10150-170 = "Welcome to the Diving Club,\nSensei."
10150-180 = "I've been waiting for you, Sensei."
10150-190 = "I'll show you around."
10150-200 = "Sigh...\nLooks like those girls\ncaused some trouble again."
10150-210 = "(12 nautical miles...)"
10150-220 = "(Right outside of Trident's\npatrol range...)"
10150-230 = "(...Suspicious, maybe.)"
10150-240 = "Cleaning barnacles is\na lot of work, but..."
10150-250 = "It can't be helped."
10150-260 = "It's something only\nwe can do, after all..."
10150-270 = "Gotta take it\none step at a time, you know."
10150-280 = "Sensei... you're staring\na bit too much."
10150-290 = "Even I can notice."
10150-300 = "Ice cream?\nI don't hate it, but..."
10150-310 = "...The calories\nare a bit high."
10150-320 = "I do care about that, you know."
10150-330 = "Sensei, does anyone ever tell you\nyou have a nice voice?"
10150-340 = "...I'd love to hear you read\n'Twenty Thousand Leagues Under the Sea'."
10150-350 = "Everyone in the Diving Club\nis a second-year..."
10150-360 = "Is something wrong with that?"
10150-370 = "Don't tell me...\nDid I look like a third-year?"
10150-380 = "Donations are always welcome."
10150-390 = "If it's diving gear...\nI'd be happy."
10150-400 = "Want to trade for something we found in the ocean?"
10150-410 = "I'm going to pack it up soon,"
10150-420 = "so if there's anything you want to trade,\ndo it now."
10150-430 = "Looks like we can save a bit on club funds this month.\nAll thanks to you, Sensei."
10150-440 = "While cleaning the ocean,\nI sometimes find rare things."
10150-450 = "It's one of my few joys, maybe."
10150-460 = "This...\nlooks like it's still usable."
10150-470 = "Thanks for helping out,\nSensei."
10150-480 = "Going with that?\nI think it's fine."
10150-490 = "Eh...\nDo you really need that?"
