[translation]
10150-150 = "Добро пожаловать в «Одиссею»..."
10150-160 = "Нет..."
10150-170 = "Добро пожаловать в Клуб дайвинга, Сенсей."
10150-180 = "Я вас ждала, Сенсей."
10150-190 = "А теперь позвольте провести для вас экскурсию."
10150-200 = "...Похоже, члены нашего клуба допустили ошибку."
10150-210 = "(12 морских миль...)"
10150-220 = "(Ровно столько нужно, чтобы выйти из зоны патрулирования «Трезубца»...)"
10150-230 = "(...Подозрительно.)"
10150-240 = "Счищать ракушки — тяжёлая работа..."
10150-250 = "Но ничего не поделаешь."
10150-260 = "Этим можем заниматься только мы..."
10150-270 = "Нужно двигаться шаг за шагом, начиная с таких вещей."
10150-280 = "Сенсей... Кажется, вы слишком пристально на меня смотрите."
10150-290 = "Я это чувствую даже без очков."
10150-300 = "...Мороженое? Не то чтобы я его не любила..."
10150-310 = "Но в нём много калорий, поэтому я"
10150-320 = "немного беспокоюсь..."
10150-330 = "Сенсей, вам кто-нибудь говорил, что у вас приятный голос?"
10150-340 = "Хотела бы послушать, как вы читаете «Двадцать тысяч лье под водой», Сенсей."
10150-350 = "Да. Все в Клубе дайвинга учатся на втором курсе."
10150-360 = "Почему?"
10150-370 = "Неужели... вы считаете, что я выгляжу старой?"
10150-380 = "Мы всегда рады пожертвованиям любых вещей,"
10150-390 = "связанных с дайвингом."
10150-400 = "Не хотите обменять это на что-нибудь, что я нашла под водой?"
10150-410 = "Мы скоро заканчиваем."
10150-420 = "Так что, если хотите обменять что-то ещё, покажите сейчас."
10150-430 = "Благодаря вам в этом месяце мы немного сэкономим на клубных расходах."
10150-440 = "Иногда, убирая мусор в море, я нахожу редкие вещи."
10150-450 = "Один из немногих приятных моментов такой работы."
10150-460 = "Это... должно пригодиться."
10150-470 = "Спасибо за помощь, Сенсей."
10150-480 = "Вы выбираете это? Думаю, хороший выбор."
10150-490 = "Эм... Вам это действительно нужно?"
