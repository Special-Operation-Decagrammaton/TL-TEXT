[translation]
10114-290 = "Добро пожаловать в академию Геенна, Сенсей!"
10114-300 = "Надеюсь, твоё пребывание будет весёлым и БЕЗОПАСНЫМ!"
10114-310 = "Ура! Сенсей пришёл!"
10114-320 = "Ч-что думаешь? Эта одежда... мне идёт?"
10114-330 = "Уа-а... Уа-а-а..."
10114-340 = "Пан-Пан... Это моя вина... Я должна что-нибудь сделать...!"
10114-350 = "Но всё-таки академия Геенна — и моя школа тоже!"
10114-360 = "Я не буду просто сидеть и ничего не делать!"
10114-370 = "Я переживала, чем всё закончится..."
10114-380 = "Спасибо, Сенсей. Когда ты рядом, кажется, всё будет хорошо!"
10114-390 = "Я устроилась на подработку в кафе, поэтому попробовала надеть подходящий наряд."
10114-400 = "Если не против, может... немного отдохнём?"
10114-410 = "Подработка в кафе — тоже свежий и интересный опыт."
10114-420 = "Но всё же, когда дело доходит до практики готовки,"
10114-430 = "...работа Клуба школьных обедов кажется важнее."
10114-440 = "Ахаха! Серьёзно, Сенсей! Щекотно!"
10114-450 = "...Фух, спасибо."
10114-460 = "Это помогло мне немного расслабиться."
10114-470 = "Я тебя ждала, Сенсей! Ну же, сюда!"
10114-480 = "Что-нибудь ищете, клиент? Желаете посмотреть меню?"
10114-490 = "Хи-хи, Сенсей."
10114-500 = "Осматривайся сколько душе угодно и сколько захочешь!"
10114-510 = "Мне часто хвалят скорость."
10114-520 = "Похоже, опыт в Клубе школьных обедов пригодился!"
10114-530 = "Да, Сенсей? Ты меня звал?"
10114-540 = "Даже если позвал без причины или если тебе что-то нужно..."
10114-550 = "...я в любом случае рада!"
10114-560 = "А, значит, ты хочешь это! Подожди минутку."
10114-570 = "Хороший выбор! Сейчас принесу."
10114-580 = "Припасов у нас полно. Не переживай!"
10114-590 = "Если чего-то не хватает, обращайся в любое время!"
10114-780 = "Подготовка ингредиентов, конечно, важна и в кафе! В этом есть сходство с Клубом школьных обедов."
10114-790 = "Мне нравится выполнять порученные задачи. Почему-то это вызывает гордость."
10114-800 = "Принимать заказы, приносить блюда..."
10114-810 = "Возможно, сейчас это мои «миссии», понимаешь?"
10114-820 = "Ты меня звал, Сенсей? Я могу чем-нибудь помочь?"
10114-830 = "Это невероятно, Сенсей! Вот, возьми!"
10114-840 = "Получать награду за всю тяжёлую работу... это правда здорово!"
