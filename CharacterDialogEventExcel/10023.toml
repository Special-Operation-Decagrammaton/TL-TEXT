[translation]
10023-140 = "Ты здесь, Сенсей. Мы подготовили всё, что может понадобиться в летнем лагере."
10023-150 = "Моё расписание всегда намного свободнее, чем у президента."
10023-160 = "Хм. Неплохо."
10023-170 = "Неплохо, Сенсей."
10023-180 = "Здесь можно обменять ящики снабжения Геенны."
10023-190 = "Мы уже на середине лагеря. Если тебе что-нибудь нужно, поторопись."
10023-200 = "До конца летнего лагеря осталось немного дней. Если что-нибудь нужно, обязательно скажи скорее."
10023-210 = "Сегодня уже последний день? Насыщенные каникулы получились."
10023-220 = "Ну и летний лагерь."
10023-230 = "Летние тренировки закончились. Проверь, ничего ли не осталось."
10023-240 = "Чего ты так смотришь?"
10023-250 = "Бесплатного ничего нет. Точка."
10023-260 = "Хм, там и правда такое валялось? Тебе повезло, Сенсей."
