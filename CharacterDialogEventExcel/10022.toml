[translation]
10022-10 = "Добро пожаловать, Сенсей. Мы готовы к летнему лагерю. Если что-нибудь понадобится, скажи."
10022-20 = "О, ты здесь, Сенсей. Уже посмотрел расписание летнего лагеря?"
10022-30 = "Сегодня так жарко... Не забывай пить воду."
10022-40 = "Лето. Жара и влажность делают меня вялой..."
10022-50 = "...но всё это часть тренировки."
10022-60 = "На пляже всегда таятся опасности."
10022-70 = "Никогда не знаешь, когда и где случится несчастный случай. Будь осторожен."
10022-80 = "Эм... Можешь позвать меня, если понадоблюсь."
10022-90 = "Никогда не думала, что буду тренироваться с тобой в летнем лагере."
10022-100 = "Это... довольно непривычно и освежает."
10022-110 = "Этот наряд подходит для летних тренировок."
10022-120 = "Нет смысла выбрасывать то, что ещё годится."
10022-130 = "Я просто подумала, что так будет эффективно. Вот и всё."
10022-330 = "Летний тренировочный лагерь начинается."
10022-340 = "Раздражает, но это часть тренировки."
10022-350 = "Жарко и бесит..."
10022-360 = "Тренировочный лагерь действительно даёт результат."
