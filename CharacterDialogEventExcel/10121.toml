[translation]
10121-10 = "Смотри, Сенсей! Море! Это море!"
10121-20 = "Хи-хи! Синяя вода тянется до самого горизонта! ♪"
10121-30 = "Это пляж!"
10121-40 = "Не ожидала, что однажды мне придётся вот так соревноваться со старшими..."
10121-50 = "Н-Но как многообещающая элита и восходящая надежда Хяккарёрана..."
10121-60 = "...я не собираюсь так просто отступать!"
10121-70 = "Вот он — долгожданный финал!"
10121-80 = "Что мне делать, Сенсей? У меня руки дрожат от волнения!"
10121-90 = "Как быстро изменилась атмосфера среди моих старших..."
10121-100 = "Но от этого они засияли только ещё ярче!"
10121-110 = "...Кикё и Рэнгэ давно знают друг друга."
10121-120 = "Они друзья детства."
10121-130 = "Без сомнения, у них двоих..."
10121-140 = "...много общих историй, в которых меня не было."
10121-150 = "От этой мысли мне становится немного одиноко..."
10121-160 = "Сенсей? Почему ты так на меня смотришь?"
10121-170 = "Вместо того чтобы сидеть без дела, давай отправимся навстречу веселью!"
10121-180 = "Фу-фу. Я серьёзно, Сенсей."
10121-190 = "Если ты предпочитаешь просто сидеть и смотреть, я присоединюсь."
10121-200 = "Похоже, все здесь хорошо привыкли к морю."
10121-210 = "Неужели я единственная новичок в море?! Вот оно что?!"
10121-460 = "Ого! Тут! Там! Всё такое новое!"
10121-470 = "Сенсей, что посмотрим первым?!"
10121-480 = "Сердце трепещет! Всё так сверкает, что куда ни глянь — везде новое развлечение!"
10121-490 = "А-а-а. Весёлое время и правда пролетает в мгновение ока!"
10121-500 = "Обязательно оставим здесь все сожаления, прежде чем вернёмся!"
10121-510 = "Я знаю, что это! Да-да, это называется «витринный шопинг», верно?"
10121-520 = "Хи-хи, не волнуйся. Я всегда буду рядом!"
10121-530 = "Ого! Я тоже хочу посмотреть поближе!"
10121-540 = "Хе-хе, значит, вот что тебе нравится, Сенсей?"
10121-550 = "Почётный гость, у вас хороший вкус! ♪"
10121-560 = "Хм-м! Что же выбрать...? ♪"
