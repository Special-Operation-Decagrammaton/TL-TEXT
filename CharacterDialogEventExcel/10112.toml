[translation]
10112-390 = "А! Сенсей! Сюда!"
10112-400 = "Мастер... Нет, то есть..."
10112-410 = "Сенсей! Я так этого ждала!"
10112-420 = "Я-ху! Тебе весело, Сенсей?"
10112-430 = "Давай веселиться до самого конца, Мас— то есть, Сенсей!"
10112-440 = "Ого, уже всё. Время и правда летит."
10112-450 = "Но мне было о-о-очень весело!"
10112-460 = "Сенсей, есть место, куда ты хочешь сходить? Я проведу."
10112-470 = "Хм? Что? Ты хотел о чём-то спросить?"
10112-480 = "Ахаха! Щекотно!"
10112-490 = "Ты хотел поиграть, Сенсей?"
10112-500 = "Хи-хи, тогда я тоже тебя пощекочу, Сенсей! Иди сюда!"
