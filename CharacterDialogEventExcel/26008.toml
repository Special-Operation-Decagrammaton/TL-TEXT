26008-70 = "Но ничего, ведь это весело!"
26008-80 = "О? Сенсей! Я не продаюсь!"
26008-90 = "К тому же сейчас рабочее время..."
26008-100 = "Нашёл то, что искал?"
26008-110 = "Момоёдо постоянно развивается благодаря нашей тяжёлой работе!"
26008-120 = "Управлять несколькими магазинами одновременно непросто..."
26008-130 = "Но ничего, ведь это весело!"
