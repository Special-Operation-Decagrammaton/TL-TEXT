[translation]
26008-10 = "Здравствуйте, Сенсей! Добро пожаловать в пляжную версию Момоёдо!"
26008-20 = "А, Сенсей? Мы ещё не готовы...?!"
26008-30 = "П-пока проходи сюда!"
26008-40 = "Нашёл то, что искал?"
26008-50 = "Момоёдо постоянно развивается благодаря нашей тяжёлой работе!"
