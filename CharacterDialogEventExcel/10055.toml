[translation]
10055-450 = "О, Сенсей! Поможешь нам немного на курорте горячих источников?"
10055-460 = "Есть минутка? Перед тем как заходить в воду, давай немного разогреемся."
10055-470 = "Нодока так старается!"
10055-480 = "Хи-хи. В этот раз морс получился идеально."
10055-490 = "О? Хочешь сказать, ты хочешь принять ванну вместе со мной?"
10055-500 = "Я пошутила. Не нужно было так реагировать."
10055-510 = "Хорошая работа. Хочешь глоток морса?"
10055-520 = "Теперь я понимаю... почему ты так популярен у всех, Сенсей."
