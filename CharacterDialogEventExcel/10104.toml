[translation]
10104-10 = "Добро пожаловать, Сенсей. Фестиваль лунного света скоро начнётся."
10104-20 = "Спасибо, что пришёл."
10104-30 = "Наслаждайся Фестивалем лунного света Шаньхайцзин."
10104-40 = "Мы не ожидали такой ситуации, но..."
10104-50 = "Ради Генрюмона, Променада Чёрной Черепахи и Шаньхайцзин..."
10104-60 = "...твоё присутствие очень ободряет, Сенсей."
10104-70 = "Фестиваль лунного света прошёл успешно."
10104-80 = "...А беспорядки пока просто проигнорируем."
10104-90 = "Как тебе фестиваль?"
10104-100 = "Шаньхайцзин и Променад Чёрной Черепахи всегда ждут твоего визита, Сенсей."
10104-110 = "Фестиваль лунного света — идеальное время показать мастерство Променада Чёрной Черепахи."
10104-120 = "Тебе стоит отдохнуть, Сенсей."
10104-130 = "...На розыгрыши я отвечаю физически."
10104-140 = "Шучу, Сенсей. Розыгрыши допустимы."
10104-150 = "Проблема будет только если они станут слишком частыми, так что, пожалуйста, контролируй себя."
10104-160 = "Что случилось, Сенсей?"
10104-170 = "...Что? Ты просто хотел поговорить?"
10104-180 = "...Если продолжишь так шутить, однажды тебе никто не поверит."
10104-190 = "Но я всегда буду верить тебе, Сенсей."
10104-200 = "Я-я вообще не боюсь щекотки."
10104-210 = "П-правда. Пробовать нет смысла. Так что прекрати...!"
10104-220 = "А-ха-ха-ха!"
10104-230 = "...Пожалуйста, прекрати."
10104-450 = "Защищать магазин важно."
10104-460 = "Так что... что сегодня ищешь?"
10104-470 = "Если попросишь, Променад Чёрной Черепахи отправится куда угодно."
10104-480 = "...Когда-нибудь даже на край Кивотоса!"
10104-490 = "Ты ничего не забыл?"
10104-500 = "Не хочу, чтобы ты потом жалел, так что осмотрись внимательно."
10104-510 = "Секретный товар Променада Чёрной Черепахи? Скрытое меню...?"
10104-520 = "Эм... Такого нет..."
10104-530 = "Даже если будешь так на меня смотреть..."
10104-540 = "Если чего-то не хватает, пожалуйста, не стесняйся сказать."
10104-550 = "...Но если товар распродан, ничего не поделать."
10104-560 = "Да, этот товар я рекомендую."
10104-570 = "Будешь использовать дома или подаришь кому-нибудь?"
10104-580 = "Огромное спасибо!"
10104-590 = "Люди постоянно так говорят, но когда говорю это тебе, Сенсей... звучит непривычно."
10104-600 = "Президент когда-то говорила кое-что."
10104-610 = "Если тебе что-то дают бесплатно, товаром становишься ты."
10104-620 = "Но если товар — это ты, Сенсей..."
10104-630 = "Н-неважно. Ничего."
