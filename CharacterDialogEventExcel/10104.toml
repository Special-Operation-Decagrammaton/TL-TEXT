[translation]
10104-900840-10-1 = "Welcome, Sensei.\nThe Moonlit Festival will be\nstarting soon."
10104-900840-20-1 = "Thank you for\ncoming."
10104-900840-30-1 = "Please enjoy the Moonlit Festival,\nthe pride of Shanhaijing."
10104-900840-40-1 = "The Moonlit Festival is the\nperfect chance for the\nGenbu Mercantile to show its worth."
10104-900840-50-1 = "Please, make yourself\nat home, Sensei."
10104-900840-60-1 = "…If you try any pranks,\nI'll have to respond with\nphysical force."
10104-900840-70-1 = "I'm joking, Sensei.\nIf it's just a prank,\nI don't mind at all."
10104-900840-80-1 = "…Though it would be a problem\nif you did it too often.\nKeep it in moderation."
10104-900840-90-1 = "Is something the matter, Sensei?"
10104-900840-100-1 = "…Huh?\nYou just wanted to call my name…?"
10104-900840-110-1 = "…If you keep trying to get my attention\nlike that, eventually, no one will\nbelieve you anymore, you know?"
10104-900840-120-1 = "…Though I will always\nbelieve in you, Sensei."
10104-900840-130-1 = "I-I'm the type of person who\ndoesn't get ticklish."
10104-900840-140-1 = "I-It's true.\nIt's pointless to try, so,\nplease, stop…!"
10104-900840-150-1 = "Ah, hahahahaha!"
10104-900840-160-1 = "…Seriously, please\nstop that."
