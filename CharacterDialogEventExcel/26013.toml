[translation]
26013-120 = "Фестиваль у моря... Я никогда не испытывала ничего подобного."
26013-130 = "Тебе весело, Сенсей?"
26013-140 = "Я могу трогать песок и идти за волнами..."
26013-150 = "Море — радостное место."
26013-160 = "Думаю... уличная сцена будет интересной."
26013-170 = "Давай посмотрим вместе, Сенсей."
26013-180 = "Я рада, что все здесь."
26013-190 = "Конечно, ты тоже входишь в «все»."
26013-200 = "Спасибо, что привёл меня на фестиваль."
26013-210 = "Надеюсь, тебе тоже весело."
26013-220 = "Говорят, где есть начало, там есть и конец..."
26013-230 = "Но всё равно немного грустно."
26013-240 = "Фестиваль... закончился..."
26013-250 = "И всё же всё хорошо. Море по-прежнему красивое."
26013-260 = "Я могу трогать песок и идти за волнами..."
26013-270 = "Море — радостное место."
26013-280 = "Думаю... уличная сцена будет интересной."
26013-290 = "Давай посмотрим вместе, Сенсей."
26013-300 = "Я рада, что все здесь."
26013-310 = "Конечно, ты тоже входишь в «все»."
26013-320 = "Спасибо, что привёл меня на фестиваль."
26013-330 = "Надеюсь, тебе тоже весело."
26013-670 = "Привет, Сенсей."
26013-680 = "Вот. Это список дел."
26013-690 = "...Список длинный. Давай разбираться по одному пункту."
26013-700 = "Ты меня звал?"
26013-710 = "Хи-хи. Смотри не на меня, а рядом с собой."
26013-720 = "Отличная работа, Сенсей."
26013-730 = "Ты такой старательный. Я тоже начинаю заражаться энтузиазмом."
