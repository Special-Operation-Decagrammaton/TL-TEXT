[translation]
10056-10 = "Сенсей! Рождество!"
10056-20 = "Сердце колотится. Я так взволнована."
10056-30 = "Надеюсь подарить всем счастье."
10056-40 = "У тебя есть планы на Рождество?"
10056-50 = "Если ты... не против... может, мы вдвоём..."
10056-60 = "О-ой, забудь. Ничего!"
10056-70 = "Да! Это Санта-Сэрина!"
10056-80 = "Я могу чем-нибудь помочь?"
10056-90 = "На Рождество зови меня Сантой Сериной!"
10056-100 = "Сенсей? Что случилось?"
10056-260 = "Сюда, на рождественскую благотворительную акцию!"
10056-270 = "Пожалуйста, подумайте о пожертвовании нуждающимся!"
10056-280 = "Рождественская благотворительная акция завершена."
10056-290 = "Пожалуйста, проверь, ничего ли не забыл!"
10056-300 = "Сенсей, позволь мне помочь."
10056-310 = "Надеюсь, с Ханаэ всё в порядке..."
10056-320 = "Спасибо. Это тебе."
10056-330 = "С Рождеством! Чудесного дня!"
10056-340 = "Это такая ценная вещь... Ты уверен, что хочешь пожертвовать её?"
