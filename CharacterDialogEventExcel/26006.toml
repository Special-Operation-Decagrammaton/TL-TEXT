[translation]
26006-290 = "О, Сенсей? Ты принёс что-нибудь поесть?"
26006-300 = "Огромное спасибо за припасы!"
26006-310 = "Мы как-нибудь тебе отплатим!"
26006-320 = "Фестиваль уже прошёл половину."
26006-330 = "Ну, нас это всё равно не касается..."
26006-340 = "Похоже, Иван Купала тоже скоро закончится."
26006-350 = "Если найдёшь ещё что-нибудь вкусное или полезное..."
26006-360 = "Пожалуйста, принеси нам!"
26006-370 = "Сегодня последний день фестиваля, Сенсей. Ничего не забыл?"
26006-380 = "Фестиваль закончился, но нам всё ещё нужны любые припасы!"
26006-390 = "Особый отряд №227 всегда страдает от нехватки сладостей..."
26006-400 = "Как думаешь, когда мы сможем вернуться в главный корпус...?"
26006-410 = "Ого! Выглядит очень вкусно!"
26006-420 = "Нам правда можно это съесть?"
