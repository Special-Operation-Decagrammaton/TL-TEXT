[translation]
26015-840 = "А. У меня уже плохое предчувствие."
26015-850 = "Но раз ты здесь..."
26015-860 = "...уверена, всё как-нибудь образуется."
26015-870 = "Пляж... Не ожидала, что окажусь на пляже вот так."
26015-880 = "Иногда жизнь просто такая!"
26015-890 = "Мика..."
26015-900 = "Она совсем не такая, как я ожидала."
26015-910 = "А! Я имею в виду в хорошем смысле."
26015-920 = "Что я думаю о пляже?"
26015-930 = "Хм-м... Как бы это сказать?"
26015-940 = "Если вспомнить последние несколько дней, впечатления у меня были не самые лучшие. Ха-ха!"
26015-950 = "Уже пора возвращаться."
26015-960 = "Это горько-сладкое чувство..."
26015-970 = "...я совсем его не чувствую."
26015-980 = "Я наконец-то иду домой! Работа закончилась! Вот что я сейчас чувствую! Ха-ха!"
26015-990 = "Шум разбивающихся волн, крики чаек и запах соли..."
26015-1000 = "Это и правда пляж."
26015-1010 = "Ох, все так возбуждены."
26015-1020 = "Хотела бы я чувствовать то же самое."
26015-1030 = "А, Сенсей. Сейчас тут ничего особенного не происходит."
26015-1040 = "Даже на пляже я была бы счастливее всего, если бы всё было спокойно."
26015-1050 = "Эм, Сенсей? Ты ведь понимаешь, что со мной будет не очень весело?"
26015-1060 = "Хотя мне и не неприятно... быть вместе."
26015-1330 = "А, Сенсей! Ты пришёл помочь?"
26015-1340 = "Ох, я немного переживала, что одна не справлюсь. Спасибо!"
26015-1350 = "Ха-ха, ну и беспорядок."
26015-1360 = "А, Сенсей. Привет."
26015-1370 = "Извини, что сразу налетаю, но можешь помочь?"
26015-1380 = "Ты буквально спасёшь мне жизнь!"
26015-1390 = "Ха-ха... Дел так много..."
26015-1400 = "Наверное, если разбираться со всем по очереди, пойдёт быстрее, чем кажется!"
26015-1410 = "...Я о-о-очень хорошо знаю это чувство."
26015-1420 = "Когда работы наваливается слишком много, хочется просто всё игнорировать."
26015-1430 = "Ещё одна проблема решена! Отличная работа!"
26015-1440 = "О-о, а ты довольно умелый, правда?"
26015-1450 = "А... Я не издевалась! Я правда впечатлена."
