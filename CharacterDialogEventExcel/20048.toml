[translation]
20048-200 = "Сенсей, ты пришёл. Пожалуйста, садись."
20048-210 = "В умении бездельничать тоже есть своё искусство."
20048-220 = "Фу-фу... Я тебя научу."
20048-230 = "Не могу перестать думать о работе дома."
20048-240 = "Без меня всё идёт нормально?"
20048-250 = "Похоже, вокруг то и дело что-то происходит."
20048-260 = "Мне ведь просто кажется, да?"
20048-270 = "Пора возвращаться."
20048-280 = "До следующего раза..."
20048-290 = "Что происходит, Сенсей?"
20048-300 = "Жарко..."
20048-310 = "Нам понадобятся холодные напитки."
20048-320 = "Эм, кроме чая со льдом."
20048-330 = "Сенсей, тебе тоже интересна эта книга?"
20048-340 = "Сенсей, солнце жарит, правда?"
20048-350 = "Иди под мой зонтик."
20048-1070 = "Не торопись."
20048-1080 = "Мы подготовили много товаров."
20048-1090 = "Я впервые обслуживаю покупателей."
20048-1100 = "Так что... пожалуйста, будь терпелив со мной, Сенсей."
20048-1110 = "Ты уже накупился вдоволь?"
20048-1120 = "А теперь давай вернёмся вместе, Сенсей."
20048-1130 = "Гостеприимство — тоже разновидность дипломатии...?"
20048-1140 = "Понятно. Если смотреть на это так, мне становится спокойнее."
20048-1150 = "Запасы, расчёты, первым пришёл — первым ушёл..."
20048-1160 = "Сегодня эти привычные слова звучат странно непривычно."
20048-1170 = "У тебя острый глаз, Сенсей."
20048-1180 = "Подожди минутку. Я это упакую."
20048-1190 = "А? Выбрать что-нибудь для себя?!"
20048-1200 = "Фу-фу, я ценю заботу, но всё хорошо."
20048-1210 = "Фу-фу, у меня уже получается немного лучше?"
