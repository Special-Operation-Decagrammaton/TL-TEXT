[translation]
16012-120 = "О, ты здесь, Сенсей! Снаружи шумно. Пойдём посмотрим?"
16012-130 = "В Новый год особенно много вкусной еды..."
16012-140 = "Я всегда в итоге трачу слишком много денег..."
16012-150 = "О, что такое, Сенсей? О... Ты случайно не хотел со мной поговорить...?"
16012-160 = "Серьёзно, не тыкай меня так! Ты мне кимоно испортишь."
16012-170 = "Почистить его — не проблема!"
16012-180 = "Хакама лучше... В них намного проще двигаться."
16012-190 = "Мне ещё и волосы заплетать?!"
16012-200 = "Я не справлюсь! Никак..."
16012-210 = "Я всегда в итоге трачу слишком много денег..."
16012-220 = "О, что такое, Сенсей? О... Ты случайно не хотел со мной поговорить...?"
16012-230 = "Серьёзно, не тыкай меня так! Ты мне кимоно испортишь."
16012-240 = "Почистить его — не проблема!"
16012-250 = "Хакама лучше... В них намного проще двигаться."
16012-260 = "Мне ещё и волосы заплетать?!"
16012-270 = "Я не справлюсь! Никак..."
16012-280 = "Чувствую, это будет ужасно раздражать..."
16012-290 = "Когда дело касается невезения... моя интуиция безошибочна..."
16012-300 = "Я чувствовала, что всё так и закончится..."
16012-310 = "Но раз ты со мной, Сенсей, уверена, как-нибудь справимся."
16012-320 = "Ух, я так устала. Хорошо, что всё получилось."
16012-330 = "Осэти было вкусным! Я столько съела!"
16012-840 = "Всё это для тебя, Сенсей? Впереди куча работы..."
16012-850 = "Ну, скажи, если понадобится помощь."
16012-860 = "Сейчас не время расслабляться! Удачи, Сенсей."
16012-870 = "А? Ты звал? Купишь мне что-нибудь?"
16012-880 = "Хи-хи. Шучу."
16012-890 = "Не то чтобы я не любила шумные места. Если бы не любила, я бы не ужилась с Обществом гурманов."
16012-900 = "Видишь? Ты тоже можешь."
16012-910 = "Хи-хи. Я всегда хотела это сказать."
16012-920 = "Если честно, не думаю, что сама бы справилась... Вот она, сила взрослого..."
16012-930 = "Неплохо."
16012-940 = "На сегодня закончили?"
16012-950 = "Тогда пойдём съедим что-нибудь вкусное!"
