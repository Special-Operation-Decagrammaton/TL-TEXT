[translation]
16008-10 = "Как всегда, ты занят, Сенсей."
16008-20 = "Я купила шоколадные пончики. Хочешь один?"
16008-30 = "Не хочу идти в патруль..."
16008-40 = "Ах, как спокойно."
16008-50 = "Мне так нравится оживлённая атмосфера Дня святого Валентина."
16008-60 = "Когда вся суматоха закончится..."
16008-70 = "...оставшиеся шоколадные пончики будут продавать со скидкой!"
16008-80 = "Если не случится ничего серьёзного..."
16008-90 = "...Бюро общественной безопасности вмешиваться не придётся."
16008-100 = "Например..."
16008-110 = "Допустим, Лисица бедствий угнала бы бронированный танк."
16008-120 = "Ха-ха. Шучу! Просто шутка! Не может же такое случиться настолько легко."
16008-130 = "...Бюро общественной безопасности вмешиваться не придётся."
16008-140 = "Например..."
16008-150 = "Допустим, Лисица бедствий угнала бы бронированный танк."
16008-160 = "Ха-ха. Шучу! Просто шутка! Не может же такое случиться настолько легко."
