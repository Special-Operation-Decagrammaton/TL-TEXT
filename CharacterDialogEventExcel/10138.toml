[translation]
10138-120 = "Сенсей, сюда."
10138-130 = "Давай вместе разоблачим эти беспочвенные слухи."
10138-140 = "Старшие дали мне амулет. Куда я его положила...?"
10138-150 = "Я ищу его ТОЛЬКО потому, что это был ПОДАРОК!"
10138-160 = "Я-Я никогда, ни за что не сдамся!"
10138-170 = "Я докажу, что всё это ложь!"
10138-180 = "Шья-а-а! Мошенник! Подделка! Ну давай!"
10138-190 = "До ночи я их всех повяжу!"
10138-200 = "Случилось столько невероятно подозрительных вещей..."
10138-210 = "Эх, мне было весело, так что, думаю, всё нормально!"
10138-220 = "Хмпф! Всё равно это один большой обман!"
10138-230 = "...Н-Наверное."
10138-240 = "В-Вдруг всё стало таким жутким..."
10138-250 = "Н-Наверное, это ветер... Да?"
10138-260 = "*вздох* Что значит «цучиноко»?"
10138-270 = "Наверняка это была просто ящерица!"
10138-280 = "А-А-А-А-А?!"
10138-290 = "...А, это всего лишь Сенсей— погоди, только не тыкай меня вот так внезапно!"
10138-300 = "Т-Тут целая куча подозрительных вещей..."
10138-310 = "Вдруг там найдётся что-то полезное. Хочешь сначала проверить?"
10138-320 = "Сенсей, ты знаешь, что это?"
10138-330 = "Здесь столько всего..."
10138-340 = "Ну, если оглянуться назад... Может, у меня остались хорошие воспоминания. Хи-хи."
10138-350 = "З-Здесь ведь безопасно, да?"
10138-360 = "П-Призрак ведь не выскочит на нас, правда?"
10138-370 = "Н-Не смотри на меня просто так! ПОМОГИ МНЕ!"
10138-380 = "Разбираться со всем этим в одиночку страшно — то есть УТОМИТЕЛЬНО!"
10138-390 = "А? Разве это не довольно полезная штука?"
10138-400 = "Погоди, это было в той куче хлама? Вот это?"
10138-410 = "Надеюсь, тебе это пригодится..."
10138-420 = "Вот, бери. Я это принесла, так что будь благодарен, ладно?"
10138-520 = "Хм-м, попробуем собрать воедино все найденные подсказки?"
10138-530 = "Давай вместе разберём это дело."
10138-540 = "Хмпф, я так и знала, что это беспочвенный слух."
10138-550 = "Не сбавляем темп и переходим к следующему слуху!"
10138-560 = "Е-Если честно, этот шаткий мост пугает меня больше призраков..."
10138-570 = "Шья-а-а! Хватит валять дурака! Сосредоточься на расследовании!"
