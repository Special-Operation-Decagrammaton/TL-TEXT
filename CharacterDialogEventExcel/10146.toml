[translation]
10146-10 = "……Ow."
10146-20 = "……What on earth is\ngoing on!?"
10146-30 = "I, I am not\npanicking at all."
10146-40 = "Everything is proceeding\nexactly according to plan!"
10146-50 = "That Iroha……\nOver something like that,\nhow long is she going to……"
10146-60 = "Ah~! Welcome to the\nMan of Pandemonium!\nYo-ho-ho!"
10146-70 = "Ah, Sensei.\nAre you enjoying the voyage?"
10146-80 = "Kiki-ki!\nEverything went just as expected!"
10146-90 = "Everything worked out\nperfectly, didn't it!"
10146-100 = "Se, Sensei.\nI'm sorry, but please\ndon't touch me."
10146-110 = "I, I'm terribly seasick\n……Ugh."
10146-120 = "Ugh……\nThat's why I didn't want\nto come to the sea."
10146-130 = "The one who planned this was……\nMakoto-sama, but……ugh."
10146-140 = "But, the way Ibuki was\nso delighted by that\nfish movie!"
10146-150 = "I wanted to show it\nto you too, Sensei!"
10146-160 = "Why do you keep\ntouching me……?"
10146-170 = "I see, so that's it!"
10146-180 = "By putting yourself in\nan extreme situation,\nyou realized your true feelings,\ndidn't you?"
10146-190 = "But wait……\nI'm not mentally prepared\nfor this yet."
10146-200 = "That Iroha……\nTo think she was\nusing social media."
10146-210 = "But why hasn't she\nfollowed the Pandemonium\naccount?"
10146-1170 = "Righteous deeds deserve rewards."
10146-1180 = "That is the natural way of thinking\nfor one who stands at the top."
10146-1190 = "I'm glad you came, Sensei!\nThere is much to be done!"
10146-1200 = "Help me with them\none by one!"
10146-1210 = "I am well aware that\nMakoto-sama is charming."
10146-1220 = "However,\nnow is the time to focus\non the mission."
10146-1230 = "A moderate amount of physical contact\nis important, but—"
10146-1240 = "—I have a sense of shame\nas well, you know."
10146-1250 = "……Suddenly,\na thought crosses my mind."
10146-1260 = "Could it be that this is all\njust a midsummer night's dream?"
10146-1270 = "Well,\nthat's not the case, though!"
10146-1280 = "Kiki-ki!"
10146-1290 = "Truly excellent work."
10146-1300 = "The more I get to know you, Sensei,\nthe more I want to keep you by my side."