[translation]
10146-10 = "...Как."
10146-20 = "...Как такое вообще могло случиться?!"
10146-30 = "Я-я совсем не растерялась."
10146-40 = "Всё идёт точно по моему плану, хм!"
10146-50 = "Ироха... Сколько она собирается это тянуть?"
10146-60 = "Ар-р-р! Добро пожаловать на борт «Грозы Пандемониума»! Йо-хо-хо!"
10146-70 = "А, Сенсей, вам нравится путешествие?"
10146-80 = "Ки-хе-хе! Как я и ожидала!"
10146-90 = "В конце концов, всё обошлось!"
10146-100 = "С-сенсей. Простите, но оставьте меня одну."
10146-110 = "М-морская болезнь... Мне сейчас так..."
10146-120 = "Тц, вот поэтому я и не хотела выходить в море."
10146-130 = "Да, я сама организовала эту поездку, но..."
10146-140 = "А! Зато как обрадовалась Ибуки, увидев тот мультик про рыбок..."
10146-150 = "Вам бы тоже стоило посмотреть!"
10146-160 = "Зачем вы всё время меня тычете...?"
10146-170 = "А! Неужели?!"
10146-180 = "Вы наконец осознали свои истинные чувства, когда оказались на пределе?!"
10146-190 = "П-погодите! Я ещё морально не готова!"
10146-200 = "Ироха... Не могу поверить, что она сидит в соцсетях."
10146-210 = "Тогда почему она не подписана на мой аккаунт Общества Пандемониума?"
10146-1170 = "Любое достижение заслуживает награды."
10146-1180 = "На этом держится воинское искусство."
10146-1190 = "Добро пожаловать, Сенсей! У нас полно работы!"
10146-1200 = "Не могли бы вы помочь, Сенсей?"
10146-1210 = "Я понимаю, что необычайно привлекательна."
10146-1220 = "Но сейчас нужно сосредоточиться на задании и наградах."
10146-1230 = "Говорят, уместные прикосновения помогают людям сблизиться..."
10146-1240 = "...Но даже мне знакомо чувство стыда."
10146-1250 = "...Иногда я задумываюсь."
10146-1260 = "А вдруг всё это лишь сон в летнюю ночь?"
10146-1270 = "Хотя нет, быть такого не может!"
10146-1280 = "Ки-хе-хе!"
10146-1290 = "Вы просто потрясающе справляетесь с работой, Сенсей."
10146-1300 = "Чем больше я узнаю вас, тем сильнее хочу, чтобы вы были рядом."
