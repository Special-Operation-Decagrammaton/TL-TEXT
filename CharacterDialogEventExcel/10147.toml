[translation]
10147-220 = "*вздыхает* Не верится, что всё так обернулось..."
10147-230 = "Но не переживайте, Сенсей. Как-нибудь справимся."
10147-240 = "Я впервые оказалась в дрейфе посреди моря..."
10147-250 = "Но будем делать всё, что в наших силах."
10147-260 = "К-корабль-призрак... Вы серьёзно? Сенсей, сделайте что-нибудь...!"
10147-270 = "Похоже, Макото совсем увлеклась..."
10147-280 = "Ну, наверное, ничего страшного."
10147-290 = "В любом случае, раз всё обошлось... пожалуй, всё в порядке?"
10147-300 = "Хм? Что такое?"
10147-310 = "...«Не переживать»?"
10147-320 = "Фу-фу, Сенсей. Вы пытаетесь меня утешить?"
10147-330 = "Всё немного не так, как я ожидала..."
10147-340 = "Море само по себе опасно. Так что ничего удивительного."
10147-350 = "Этот купальник?"
10147-360 = "А. Даже если открыто много кожи, у меня есть солнцезащитный крем. Так что всё хорошо."
10147-370 = "Нельзя же отказываться от фасона, который мне идёт."
10147-380 = "Мм. Какие же у Сенсея тёплые руки."
10147-390 = "Когда держу вас за руку, мне спокойнее."
