[translation]
10147-220 = "Sigh... I never imagined things would end up like this..."
10147-230 = "It's alright, Sensei. We'll manage somehow."
10147-240 = "To think we'd end up drifting at sea..."
10147-250 = "Let's just start with what we can do."
10147-260 = "A-a ghost ship...? Do you think it's real? Sensei, do something about it...!"
10147-270 = "Makoto-chan is really getting into character, isn't she..."
10147-280 = "Well, I believe we'll be fine."
10147-290 = "Is everything resolved now...? Case closed, I suppose."
10147-300 = "Hm? What is it?"
10147-310 = "...Are you worried about me? I'm fine, really."
10147-320 = "Hehe, Sensei. Are you trying to comfort me?"
10147-330 = "It's a bit different from what I expected, but..."
10147-340 = "Well, the ocean is a dangerous place by nature. It can't be helped."
10147-350 = "This swimsuit?"
10147-360 = "Oh, it's fine. I made sure to put on plenty of sunscreen."
10147-370 = "After all, you have to wear something you actually like."
10147-380 = "...Yeah. Your hands are warm, Sensei."
10147-390 = "Holding them makes me feel at ease."