[translation]
20016-140 = "Серьёзно, проблем так много."
20016-150 = "*вздох*... Я больше не могу."
20016-160 = "Встреча по обмену каким-то образом превратилась в бардак."
20016-170 = "*вздох* ...Почему никто не думает о том, кому потом всё это разгребать?"
20016-180 = "Почему я всё ещё застряла, исправляя чужие проблемы в другом районе?"
20016-190 = "Наверное, такова боль среднего руководителя."
20016-210 = "Серьёзно, проблем так много."
20016-220 = "*вздох*... Я больше не могу."
20016-230 = "Что-то долго. Думаешь, успеем?"
20016-240 = "Продвигается... но не теряй бдительности до самого конца."
20016-250 = "Ненавижу всякую раздражающую мороку."
20016-260 = "Похоже, суматоха закончилась. Отличная работа, Сенсей."
20016-270 = "Встреча по обмену каким-то образом превратилась в бардак."
20016-280 = "*вздох* ...Почему никто не думает о том, кому потом всё это разгребать?"
20016-290 = "Почему я до сих пор навожу порядок, да ещё и в другом районе?"
20016-300 = "Наверное, такова боль среднего руководителя."
20016-850 = "Вот проблемы, которые нужно решить."
20016-860 = "Пожалуйста, проверь список, Сенсей."
20016-870 = "Это раздражает, но я рада, что ты со мной, Сенсей."
20016-880 = "Это так сложно!"
