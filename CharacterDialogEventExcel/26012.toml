[translation]
26012-170 = "Welcome back! Sensei, do you\nprefer the water slide or the\nwave pool?"
26012-180 = "Nakatsukasa Kirino,\nserving as a lifeguard\nthis time!"
26012-190 = "I held off on my foodie tours\nfor a while so I could fit into\nmy swimsuit, but..."
26012-200 = "Before I knew it, I ended up\ngoing on a food court tour\ninstead..."
26012-210 = "How about the water slide?"
26012-220 = "I personally recommend\nthe most thrilling slide\nof all!"
26012-230 = "Seeing the children play\nis so cute!"
26012-240 = "Huh? Is there work that\nrequires my attention?\nPlease, tell me anything!"
