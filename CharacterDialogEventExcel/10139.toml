[translation]
10139-863-10-1 = "We will now begin the operation to track Roa."
10139-863-20-1 = "I've been waiting for you, Sensei."
10139-863-30-1 = "We'll start the briefing immediately. This way."
10139-863-40-1 = "Welcome to the FOX Platoon's operation headquarters."
10139-863-50-1 = "I wonder where the people who disappeared... could have gone."
10139-863-60-1 = "It's been a while since we've taken on a mission as SRT."
10139-863-70-1 = "We will give it our all. If this..."
10139-863-80-1 = "...is enough to clear our names..."
10139-863-90-1 = "A joint operation with Schale..."
10139-863-100-1 = "I'm looking forward to it. Hehe."
10139-863-110-1 = "Sensei, would you like to grab a bite to eat before the operation?"
10139-863-290-1 = "Oh, Sensei."
10139-863-300-1 = "If you don't mind, could you help me tidy up these supplies?"
10139-863-310-1 = "The ammunition left over from the previous operation is..."
10139-863-320-1 = "Ah, Sensei. Hello."
10139-863-330-1 = "Is there anything you need?"
10139-863-340-1 = "Eek!?"
10139-863-350-1 = "M-my ears are sensitive... You shouldn't touch them..."
10139-863-360-1 = "I think that's a good choice."
10139-863-370-1 = "Thank you very much."
10139-863-380-1 = "I'm always available if you need to exchange supplies."
10139-863-390-1 = "Thank you for your continued support... of Schale."
