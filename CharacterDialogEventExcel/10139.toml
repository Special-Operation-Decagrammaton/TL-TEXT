[translation]
10139-10 = "Операция «Охота за легендами» начинается!"
10139-20 = "Мы ждали тебя, Сенсей."
10139-30 = "Сейчас начнём инструктаж. Сюда!"
10139-40 = "Добро пожаловать в оперативный штаб отряда FOX."
10139-50 = "Где могут быть пропавшие люди?"
10139-60 = "Давно я не бралась за задание как член SRT..."
10139-70 = "Если это поможет нам снова восстановить репутацию..."
10139-80 = "Я сделаю всё, что смогу."
10139-90 = "Совместная операция с Шале..."
10139-100 = "Я жду её с нетерпением сразу по нескольким причинам. Фу-фу."
10139-110 = "Хочешь немного перекусить перед началом задания?"
10139-290 = "А, Сенсей."
10139-300 = "Если не против, поможешь разобрать эти припасы?"
10139-310 = "Оставшиеся патроны с прошлого задания..."
10139-320 = "А, добро пожаловать, Сенсей."
10139-330 = "Я могу чем-нибудь помочь?"
10139-340 = "А-Ай!"
10139-350 = "М-Мои уши чувствительные... Пожалуйста, не трогай их..."
10139-360 = "Отличный выбор."
10139-370 = "Спасибо."
10139-380 = "Зови меня в любое время, когда понадобится обменять припасы."
10139-390 = "Поддержка Шале всегда очень помогает."
