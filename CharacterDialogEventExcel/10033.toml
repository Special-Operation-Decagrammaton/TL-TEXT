[translation]
10033-10 = "Я, Вакамо, пришла поймать тебя."
10033-20 = "Как бы ты ни старался, от меня не убежишь."
10033-30 = "Сегодня я заставлю тебя это понять."
10033-40 = "Ах-х... Я чувствую твоё присутствие... где бы ни находилась!"
10033-50 = "Хи-хи. Думал, так просто от меня избавиться?"
10033-60 = "Ах, какой же ты милый. ♥"
10033-70 = "О, Сенсей. Где ты?"
10033-80 = "Тебе не скрыться за дымом взрывов и пороха..."
10033-90 = "Именно. Я, Вакамо, никогда тебя не отпущу. ♥"
10033-100 = "Это то, что люди называют..."
10033-110 = "...прятками?"
10033-120 = "Хи-хи. Я не против такого развлечения."
10033-130 = "Мне ведь нужно гнаться за тобой и поймать, да?"
10033-140 = "Жду этого с нетерпением."
10033-150 = "Готов ты или нет, я иду искать. ♥"
