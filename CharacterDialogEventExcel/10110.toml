[translation]
10110-10 = "Добро пожаловать, Сенсей."
10110-20 = "Ты выглядишь занятым."
10110-30 = "О, Сенсей."
10110-40 = "Ты как раз вовремя."
10110-50 = "Наш прогресс..."
10110-60 = "Н-неважно."
10110-70 = "Почти всё."
10110-80 = "...Расскажу позже."
10110-90 = "Столько всего произошло."
10110-100 = "Спасибо за помощь."
10110-110 = "Ты меня звал?"
10110-120 = "Что происходит?"
10110-130 = "Я никуда не уйду."
10110-140 = "Иногда приятно делать что-нибудь такое."
10110-150 = "Может, потому что я далеко от Тринити?"
10110-160 = "Щекотно..."
10110-170 = "Но я не против."
10110-660 = "Я кое-что подготовила."
10110-670 = "Пожалуйста, осмотрись."
10110-680 = "Тебе что-нибудь нужно?"
10110-690 = "Скажи в любой момент."
10110-700 = "На всякий случай..."
10110-710 = "...попробуй поискать ещё раз, Сенсей."
10110-720 = "...Меня?"
10110-730 = "Хи-хи, я не продаюсь."
10110-740 = "Забавно."
10110-750 = "Теперь моя очередь тебя тыкать?"
10110-760 = "Хорошо."
10110-770 = "Неплохой выбор."
10110-780 = "А, значит, тебе нужно было это."
10110-790 = "Да. Держи."
10110-900 = "Пожалуйста, проверь всё внимательно."
10110-910 = "Я думала, что увижу тебя здесь, Сенсей."
10110-920 = "Хи-хи, назовём это предчувствием."
10110-930 = "...Пожалуйста, не заставляй меня менять мнение о тебе."
10110-940 = "...Хи-хи, ты как всегда, Сенсей."
10110-950 = "Хорошая работа."
10110-960 = "Отлично."
