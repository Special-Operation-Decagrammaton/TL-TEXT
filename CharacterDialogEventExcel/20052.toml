[translation]
20052-10 = "Без риска нет прибыли."
20052-20 = "Ну что, приступим к делу...?"
20052-30 = "Сейчас покажу тебе."
20052-40 = "Навыки Издательского отдела, пережившего суровую Красную Зиму!"
20052-50 = "Ну..."
20052-60 = "Наверное, это скорее «инстинкт выживания»."
20052-70 = "Вот оно... Пошёл импульс!"
20052-80 = "Я не смогу называть себя главой Издательского отдела, если упущу это!"
20052-90 = "...Как всё дошло до этого...?"
20052-100 = "То есть... в целом я понимаю, из-за чего всё началось..."
20052-110 = "Но я пока не могу сдаться..."
20052-120 = "Ого... В какой-то момент я правда сильно переживала!"
20052-130 = "Что? Ты рад, что всё закончилось хорошо, но мне стоит задуматься над собой?"
20052-140 = "Эм... Можно отложить это на потом...?"
20052-150 = "Творцы..."
20052-160 = "...хорошо умеют создавать вещи..."
20052-170 = "...но, как ни странно, почти не интересуются..."
20052-180 = "...способами распространения своих работ..."
20052-190 = "Причина, по которой книги... почему текст важен..."
20052-200 = "...в том, что это продукт с «потенциалом» обеспечить..."
20052-210 = "...максимальный результат при минимальных затратах!"
20052-220 = "Способность что-то создавать — это невероятно."
20052-230 = "То же касается таланта, позволяющего воплотить это в жизнь."
20052-240 = "..."
20052-250 = "Иметь такой талант — прекрасно."
20052-260 = "Я действительно... так считаю."
20052-270 = "Я благодарна студентам Тринити."
20052-280 = "А? Почему ты так на меня смотришь?"
20052-290 = "Я серьёзно."
20052-620 = "Как ты думаешь, что лежит в основе бизнеса, Сенсей? Конечно же, обмен... Торговля..."
20052-630 = "И деньги, разумеется!"
20052-640 = "Добро пожаловать!"
20052-650 = "В самое сердце бизнеса, где деньги и товары текут свободно!"
20052-660 = "Хе-хе-хе. Осмотрись вокруг!"
20052-670 = "В глубине полок могут ждать спрятанные сокровища."
20052-680 = "Не теряй бдительности до самого конца, Сенсей."
20052-690 = "А, конечно, можешь не сводить глаз и с меня, знаешь?"
20052-700 = "Цена не снизится, даже если будешь со мной разговаривать, ясно?"
20052-710 = "Для скидки потребовались бы серьёзные коммерческие расчёты..."
20052-720 = "...и даже закрытые политические переговоры."
20052-730 = "Никогда не думала, что однажды буду вести дела с тобой, Сенсей."
20052-740 = "Да, серьёзно, жизнь полна сюрпризов."
20052-750 = "Отлично, отлично!"
20052-760 = "Тебе нужно что-нибудь ещё?"
20052-770 = "Я скажу это только тебе..."
20052-780 = "Так волнительно видеть результаты собственными глазами!"
20052-790 = "Культура — это деньги. Такова реальность."
20052-800 = "В этом смысле то, что ты только что купил..."
20052-810 = "...можно в некотором роде считать культурой, знаешь?"
20052-820 = "Я гарантирую качество, ясно?"
