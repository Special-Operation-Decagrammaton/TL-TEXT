[translation]
10122-10 = "Я-ху! Тебе весело, Сенсей?"
10122-20 = "Хм-м. Что бы сделал Сенсей...?"
10122-30 = "Всё идёт не совсем так, как я ожидала..."
10122-40 = "Уверена, как-нибудь всё образуется!"
10122-50 = "Мне нельзя терять бдительность."
10122-60 = "Никогда не знаешь, что случится дальше."
10122-70 = "Фух! Как-то всё закончилось!"
10122-80 = "Интересно, как бы всё прошло, если бы тебя здесь не было, Сенсей."
10122-90 = "Даже думать об этом не хочу..."
10122-100 = "Я рада, что ты был со мной."
10122-110 = "Наверняка ты и так это знаешь..."
10122-120 = "...но я иногда бываю немного неуклюжей."
10122-130 = "Хм? Что-то случилось?"
10122-140 = "Что-то, с чем может понадобиться моя помощь?"
10122-150 = "А-ха-ха, щ-щекотно, Сенсей!"
10122-160 = "Ты уверен? Я ведь могу ответить тем же!"
10122-170 = "Сенсей...? Мне уже начинает хотеться... чтобы ты остановился."
10122-180 = "А, мне не неприятно! Совсем нет!"
10122-190 = "Но... я могу неправильно понять."
10122-1220 = "Ого, сколько всего нужно сделать..."
10122-1230 = "Ты работаешь... на пляже...?"
10122-1240 = "Какая морока..."
10122-1250 = "Меня можно убедить... наградой!"
10122-1260 = "Фу-фу, Сенсей..."
10122-1270 = "Что скажешь насчёт прогулять работу?"
10122-1280 = "Ого! Другого я от тебя и не ожидала, Сенсей!"
10122-1290 = "Хорошо, отлично! Набираем темп!"
