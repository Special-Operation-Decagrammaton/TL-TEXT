[translation]
16018-810 = "Сенсей, ты знаешь, что это?"
16018-820 = "...Похоже на торговый автомат..."
16018-830 = "Кажется, он принимает только специальные медали."
16018-840 = "Значит, использовать его можно только здесь... Давай попробуем."
16018-850 = "О, уже время закрываться. Давай потратим все медали и уйдём."
16018-860 = "Та картинка... Разве это не их костюмы?"
16018-870 = "Они ведь не выпрыгнут из рамки или что-то такое, правда...?"
16018-880 = "Ого, блестит... Это то, что называют суперредким?"
16018-890 = "Такую трудно найти. Она редкая?"
16018-900 = "Золотая, значит, наверное, хорошая! Давай вытянем ещё много!"
16018-910 = "Ух, я вообще не понимаю... что здесь хорошее, а что нет."
16018-920 = "А? Чёрная? Это мой любимый цвет!"
16018-930 = "*пыхтит* *пыхтит* ...Да что с ними такое?!"
16018-940 = "Волшебницы? У них ведь нет настоящей магии, да?!"
16018-950 = "Ч-Что ты делаешь?! Иди уже работай!"
16018-960 = "(Сенсей, ты слишком добрый человек.)"
16018-970 = "Я говорю это, потому что, кажется, ты не знаешь."
16018-980 = "Но когда кто-то гладит мой шлем, внутри очень громко."
16018-990 = "..."
16018-1000 = "Тогда только чуть-чуть. ...Серьёзно."
16018-1010 = "Да, вот так лучше!"
16018-1020 = "Отлично! Вот оно!"
16018-1030 = "На сегодня всё! Проще простого!"
16018-1040 = "Пустячная работа!"
