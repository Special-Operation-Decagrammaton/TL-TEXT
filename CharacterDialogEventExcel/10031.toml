[translation]
10031-10 = "Добро пожаловать, Сенсей. Я тебя ждала."
10031-20 = "Новый год — новый бизнес."
10031-30 = "Хи-хи. Я могу нанять тебя на временную работу, Сенсей."
10031-40 = "У тебя руки ледяные, Сенсей!"
10031-50 = "Когда занят, полноценный отдых ещё важнее."
10031-60 = "Не ожидала, что суматоха станет настолько шумной. *вздох* Вот уж неожиданность..."
10031-70 = "...Но раз уж зашло так далеко, мне даже хочется продолжить."
10031-80 = "Раз уж всё так, Решалы 68 останутся до конца!"
10031-90 = "Сенсей, ты тоже будешь сотрудничать, правда?"
10031-100 = "В итоге получился KAITEN FX Mk.1! Какого чёрта?!"
10031-110 = "Это настолько нелепо, что я даже не знаю, что сказать..."
10031-120 = "*вздох* Ну, что сделано, то сделано..."
10031-130 = "Сенсей, я устала. Может, в следующий раз сходим поесть?"
10031-140 = "Я пришла загадать в новом году процветание для Решал 68."
10031-150 = "Как так получилось...?"
10031-160 = "Новый год — новые Решалы 68!"
10031-170 = "Сенсей! Сделаем этот год лучшим!"
10031-180 = "Не переживайте, Сенсей. Пока Решалы 68 вместе..."
10031-190 = "...мы преодолеем любое препятствие."
10031-200 = "А? П-п-планы?! Нет... Н-ничего особенного я не планировала..."
10031-210 = "*вздох* Всё превратилось в полный хаос."
10031-220 = "Если бы кто-то из наших сотрудников пострадал..."
10031-560 = "Добро пожаловать, Сенсей. Подготовка к работе завершена."
10031-570 = "Решалы 68 многое подготовили к Новому году."
10031-580 = "Не торопись, выбирай."
10031-590 = "*вздох* Наконец-то хаос утих."
10031-600 = "Хи-хи. Но мы всё ещё открыты."
10031-610 = "Так что не спеши и осмотрись, Сенсей. ♪"
10031-620 = "Хи-хи, ну как? Разве не броские и крутые вещи?"
10031-630 = "Это всё скрытая мощь Решал 68! ♪"
10031-640 = "Сенсей, что-нибудь привлекло твоё внимание?"
10031-650 = "...Фото всех из Решал 68 в кимоно?"
10031-660 = "Т-такого у нас нет!!"
10031-670 = "Как и ожидалось, у тебя хороший вкус. Отлично, Сенсей."
10031-680 = "Ого, хороший выбор! Я так и знала."
10031-690 = "Это действительно хорошая вещь, так что пользуйся бережно."
10031-700 = "Не могу поверить, что ты выбрал это. Неплохо. Ты достоин быть моим деловым партнёром, Сенсей."
10031-710 = "О, эта штука крутая, да? Я сама хотела купить такую в офис..."
10031-720 = "Н-нет! Я не говорю, что ты обязан купить её мне!"
