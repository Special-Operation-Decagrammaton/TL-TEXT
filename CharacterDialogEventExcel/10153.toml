[translation]
10153-10 = "Наконец-то главное соревнование! Сенсей!"
10153-20 = "Я сделаю всё возможное, чтобы финишировать!"
10153-30 = "Надеюсь, все смогут хорошо провести время, не беспокоясь о результатах..."
10153-40 = "Надеюсь, все смогут улыбнуться!"
10153-50 = "Надеюсь, это соревнование станет для всех драгоценным воспоминанием о юности."
10153-60 = "Я буду рада, если этот наряд станет драгоценным воспоминанием о вашей юности."
10153-70 = "Этот наряд? Это официальная форма!"
10153-80 = "О, вы тоже это заметили, Сенсей?"
10153-90 = "Он сделан из действительно хорошего материала!"
10153-100 = "Столько уникальных танков...!"
10153-110 = "Сенсей, не хотите ли посмотреть на них вместе?"
10153-120 = "Сенсей, вам тоже нравятся танки?"
10153-130 = "Хе-хе, мы одинаковые! Я тоже их люблю!"
10153-380 = "Пожалуйста, скажите, если вам что-нибудь нужно!"
10153-390 = "Вы что-нибудь ищете? Я вам помогу!"
10153-400 = "Вы что-нибудь забыли? Я буду с вами до конца!"
10153-410 = "Товары Пероро-сама? Я проведу вас в торговую зону!"
10153-420 = "А? Я вам нужна...? Если я достаточно хороша, пожалуйста, расскажите мне что угодно!"
10153-430 = "Это действительно здорово, правда! Я знаю!"
10153-440 = "Важно копить, пока есть возможность это купить."
10153-450 = "Шопинг — это весело, правда!"
10153-460 = "Давайте посмотрим что-нибудь ещё?"
10153-740 = "Сенсей, давайте сегодня снова вместе постараемся!"
10153-750 = "Достижение результатов важно, но безопасность превыше всего!"
10153-760 = "Ой."
10153-770 = "...Что-то было у меня на щеке?"
10153-780 = "Отлично, подождите... А? Вы со мной разговариваете? Я ещё ничего не сделала!?"
10153-790 = "Столько...! Я так счастлива! Мы сделали это, Сенсей!"
10153-800 = "Хе-хе, всё благодаря вам, Сенсей!"
