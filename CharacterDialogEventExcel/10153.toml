[translation]
10153-10 = "The main tournament is finally here!\nSensei!"
10153-20 = "I'll do my best\nto finish the race!"
10153-30 = "I hope everyone can just enjoy it without worrying about the results..."
10153-40 = "I hope everyone keeps smiling!"
10153-50 = "I hope this tournament becomes—"
10153-60 = "a precious memory of youth for everyone."
10153-70 = "This outfit? It's the official uniform!"
10153-80 = "Ah, you can tell, Sensei?"
10153-90 = "It's made with really, really good materials!"
10153-100 = "So many unique tanks...!"
10153-110 = "Sensei, would you like to go watch together?"
10153-120 = "Do you like tanks too, Sensei?"
10153-130 = "Ehehe, we're the same!\nI love them too!"
10153-380 = "Please let me know if there's anything you want!"
10153-390 = "Is there something you're looking for?\nI can help!"
10153-400 = "Did you forget anything?\nI'll keep you company until the very end!"
10153-410 = "Peroro-sama's merchandise?\nI'll guide you to the sales area!"
10153-420 = "Eh? You need... me?\nIf I'll do, please tell me anything!"
10153-430 = "That's super nice, isn't it? I totally get it!"
10153-440 = "It's important to save up while you can."
10153-450 = "Shopping is so much fun, isn't it?"
10153-460 = "Would you like to go look at other things?"
10153-740 = "Let's do our best together today too, Sensei!"
10153-750 = "Getting results is important, but safety first!"
10153-760 = "Au."
10153-770 = "...Was there something on my cheek?"
10153-780 = "\"Good job,\" you say...? Huh?\nAre you talking to me?\nI haven't done anything yet!?"
10153-790 = "Such a huge amount...! I'm so happy!\nWe did it, Sensei!"
10153-800 = "Ehehe, it's thanks to you, Sensei!"
