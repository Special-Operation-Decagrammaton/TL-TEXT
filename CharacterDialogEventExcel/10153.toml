[translation]
10153-864-10-1 = "It's finally the main event!\nSensei!"
10153-864-20-1 = "I'll do my best\nto finish the race!"
10153-864-30-1 = "I hope everyone can enjoy it\nwithout worrying about\nthe results..."
10153-864-40-1 = "I hope everyone\ncan keep smiling!"
10153-864-50-1 = "I hope this tournament\nwill be, for everyone—"
10153-864-60-1 = "a precious memory of their youth,\nand that would make me\nvery happy."
10153-864-70-1 = "This outfit? It's the\nofficial uniform!"
10153-864-80-1 = "Oh, you can tell too,\nSensei?"
10153-864-90-1 = "It's made of\nreally high-quality\nmaterial!"
10153-864-100-1 = "So many unique\ntanks...!"
10153-864-110-1 = "Sensei, would you like to\ngo watch them with me?"
10153-864-120-1 = "Do you like tanks\ntoo, Sensei?"
10153-864-130-1 = "Hehe, we're the same!\nI love them too!"
10153-864-380-1 = "Please let me know if there's\nanything you want!"
10153-864-390-1 = "Are you looking for something?\nI'll help you!"
10153-864-400-1 = "Did you forget to buy anything?\nI'll stay with you until the end!"
10153-864-410-1 = "Peroro-sama merchandise?\nI'll guide you to the shop!"
10153-864-420-1 = "Huh? You need me...? \nIf I'm enough, please tell me\nanything you need!"
10153-864-430-1 = "That's really great, isn't it?\nI totally get it!"
10153-864-440-1 = "It's important to save up\nwhen you can."
10153-864-450-1 = "Shopping is so much fun, isn't it!"
10153-864-460-1 = "Would you like to look at\nother things too?"
10153-864-740-1 = "Sensei, let's do our best\ntogether again today!"
10153-864-750-1 = "Getting results is important,\nbut safety comes first!"
10153-864-760-1 = "Ouch."
10153-864-770-1 = "...Was there something\non my cheek?"
10153-864-780-1 = "Saying I did a good job...? Wait, are you\ntalking to me?\nI haven't done anything yet!?"
10153-864-790-1 = "So many of them...! \nI'm so happy!\nWe did it, Sensei!"
10153-864-800-1 = "Hehe, it's all thanks to you, Sensei!"
