[translation]
20004-80 = "Сегодня тоже довольно жарко. Берегись теплового удара!"
20004-90 = "А теперь начнём специальную летнюю тренировку!"
20004-100 = "Я волнуюсь. Впервые оказалась на пляже с другими студентами Тринити..."
20004-110 = "Мудрые любят воду..."
20004-120 = "(Может, стоило выбрать купальник не чёрного цвета...)"
20004-130 = "Кажется, только что я услышала отчаянный стон Цуруги."
20004-420 = "Будь то долг или развлечение, я никогда не упущу хорошую возможность."
20004-430 = "Неужели студенты станут устраивать переполох в таком месте..."
20004-440 = "Никогда не теряй бдительности, даже на отдыхе."
