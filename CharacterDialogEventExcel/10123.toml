[translation]
10123-360 = "Сегодня снова прохладный день."
10123-370 = "...Как можно было бы сказать."
10123-380 = "Позволь мне сегодня тебя сопровождать."
10123-390 = "Вот она, юность."
10123-400 = "Разве не так?"
10123-410 = "Я не отпущу педаль до самого конца."
10123-420 = "Так освежает..."
10123-430 = "...и одновременно немного горько-сладко."
10123-440 = "Скажи вслух. Скажи."
10123-450 = "Чего ты так смущаешься?"
10123-460 = "Ты меня щекочешь?"
10123-470 = "Фу-фу. В любое время."
10123-480 = "Другая твоя сторона..."
10123-490 = "Я бы тоже хотела её увидеть."
10123-500 = "Я оделась полегче..."
10123-510 = "...потому что лето."
