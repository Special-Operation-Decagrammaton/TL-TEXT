[translation]
10131-300 = "Я впервые в Тринити..."
10131-310 = "Я-Я постараюсь не доставить никому проблем."
10131-320 = "Место под названием Тринити и истории, рождающиеся там..."
10131-330 = "Хе-хе. Мне нравится и то и другое."
10131-340 = "Всё идёт хорошо..."
10131-350 = "...и это немного тревожит."
10131-360 = "Если бы это было частью истории..."
10131-370 = "...конфликт уже с радостью ворвался бы в эти сцены."
10131-380 = "У меня было чувство, что так и случится..."
10131-390 = "Да... Мне нужно сохранять спокойствие..."
10131-400 = "Какое облегчение... Правда, я очень рада."
10131-410 = "Огромное спасибо, Сенсей."
10131-420 = "И... прости, Сенсей."
10131-430 = "Я была рада, что все отнеслись к нам хорошо."
10131-440 = "...Но всё же в конечном счёте я обычный студент..."
10131-450 = "Ты звал меня, Сенсей?"
10131-460 = "Что? «Тот смех»?"
10131-470 = "Я не буду так смеяться! По крайней мере, не здесь!"
10131-480 = "...Хотя если бы мы были только вдвоём — другое дело..."
10131-490 = "Пожалуйста, перестань так меня дразнить."
10131-500 = "Иначе...!"
10131-510 = "Я запишу каждое твоё действие..."
10131-520 = "...и подвергну критике, ясно?"
10131-530 = "«Сегодня Сенсей снова разыгрывал Миёси Таканэ...»"
10131-540 = "«Я решила объявить об этом всему Кивотосу.»"
10131-550 = "Фу-фу. Вот видишь? Рада, что ты понял."
10131-560 = "Расширять кругозор — значит расширять свой взгляд на мир."
10131-570 = "В другом смысле это означает расширять собственный мир."
10131-580 = "И... пока я об этом думала..."
10131-590 = "...мне стало кое-что любопытно."
10131-600 = "Какой мир..."
10131-610 = "...есть у тебя?"
10131-830 = "Даже находясь в Тринити, я не должна забывать о долге."
10131-840 = "...Иначе могу закончить как наш председатель..."
10131-850 = "...которая намеренно забывает о приличиях."
10131-860 = "Я составила контрольный список, Сенсей."
10131-870 = "Ничего особенного."
10131-880 = "Это похоже на составление структуры рецензии."
10131-890 = "История — это собрание небольших глав."
10131-900 = "Хотя процесс написания..."
10131-910 = "...не обязательно идёт именно в таком порядке."
10131-920 = "Но в том смысле, что в итоге и то и другое упорядочивается и обретает форму..."
10131-930 = "...а затем выражается..."
10131-940 = "...к обеим задачам нужно подходить усердно."
10131-950 = "Повторяющиеся вещи легко начать игнорировать."
10131-960 = "Ведь они изначально скучные, знаешь...?"
10131-970 = "Но если пренебрегать мелкими задачами..."
10131-980 = "...в конце концов они обязательно тебя настигнут."
10131-990 = "Похоже на мягкую нотацию?"
10131-1000 = "Д-Да... Я знаю, что часто ворчу."
10131-1010 = "В конце концов, критики по сути придирчивые ворчуны."
10131-1020 = "5 из 5! Невероятно!"
10131-1030 = "Того, кто так усердно..."
10131-1040 = "...выполняет домашнее задание, следует наградить."
10131-1050 = "Вот. Я приготовила это для тебя."
