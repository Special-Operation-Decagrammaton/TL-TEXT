[translation]
20005-140 = "М-м-м... Какой свежий запах океана!"
20005-150 = "Надеюсь, каникулы будут весёлыми!"
20005-160 = "Я готова! Даже взяла круг для плавания с Пероро!"
20005-170 = "О? Я точно клала ключи от раздевалок сюда..."
20005-180 = "Н-не смотри на меня! Мне неловко!"
20005-190 = "Мы наконец-то здесь! Смотри, океан!"
