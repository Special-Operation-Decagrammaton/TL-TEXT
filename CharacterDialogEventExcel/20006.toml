[translation]
20006-70 = "Сенсей, добро пожаловать в Шаньхайцзин!"
20006-80 = "Хи-хи. Ты ведь не забыл о сегодняшних планах, правда, Сенсей?"
20006-90 = "Ты не видел Шун?"
20006-100 = "Хи-хи. Скоро эликсир бессмертия будет готов!"
20006-110 = "Странно. В эликсире омоложения не должно было быть других ингредиентов..."
20006-120 = "Погоди, пока я работала..."
20006-130 = "Неужели сюда попала шерсть Нэдзускэ?"
20006-140 = "Добро пожаловать, Сенсей, в мою новую выездную лабораторию!"
20006-150 = "Я куплю любые хорошие алхимические материалы!"
20006-160 = "Выездная лаборатория будет открыта недолго."
20006-170 = "Не забудь обменять все хорошие материалы, которые найдёшь!"
20006-180 = "На променаде какая-то странная атмосфера."
20006-190 = "Нужно поскорее закрыть выездную лабораторию."
20006-200 = "Сегодня последний день работы выездной лаборатории."
20006-210 = "Бери всё необходимое, пока можешь!"
20006-220 = "Выездная лаборатория закрыта."
20006-230 = "Но если что-нибудь осталось, пожалуйста, покажи мне."
20006-240 = "Силой высшей алхимии можно создать что угодно!"
20006-250 = "Хм-м. Тот синий камень, о котором ты говорил. Я тоже с ним не знакома..."
20006-260 = "Неплохой выбор."
20006-270 = "Хи-хи. Спасибо, что собрал столько хорошего."
20006-280 = "О, превосходный выбор!"
