[translation]
10137-10 = "Цучинооко-о-о! Ты где-е-е?!"
10137-20 = "*вздох* Если я тебя поймаю, тебе и правда конец..."
10137-30 = "Ух... Страшно..."
10137-40 = "Н-не то чтобы кто-то стал ко мне приставать— И-и-и?! К-кто там...?"
10137-50 = "Призрак ты или нет, наручники на тебя всё равно должны...!"
10137-60 = "Я выбралась целой! Ну давай, судьба!! ХА-ХА-ХА!!!"
10137-70 = "П-Погоди!! Я-Я беру слова назад! Прости!"
10137-80 = "А-Ай?! ...Блин, ты меня напугал!!"
10137-90 = "Фух... Но воздух здесь и правда приятный."
10137-100 = "Цучиноко! Если я тебя поймаю, больше никогда не отпущу!"
10137-110 = "С-Спокойно... Спокойно..."
10137-430 = "Погнали!! Сделаем это с боевым духом!!"
10137-440 = "Гороскоп сегодня хороший?! Я рассчитываю на тебя, Сенсей!"
10137-450 = "Время уборки! Постараемся до самого конца!"
10137-460 = "Ты поделишься со мной удачей? Да!!"
10137-470 = "Уверена, всё как-нибудь получится! Ведь ты со мной, Сенсей!"
10137-480 = "Ага! Вот оно!"
10137-490 = "Твоя удача невероятна!! Сенсей, ты не шутишь!"
10137-500 = "Хотела бы я, чтобы так было всегда!"
10137-510 = "А пока будем искать, пока искать уже станет невозможно!"
