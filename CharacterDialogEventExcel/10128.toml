[translation]
10128-150 = "Здравствуйте! Я Вакаса Фую, менеджер по продажам Картеля свободной торговли!"
10128-160 = "Если тебе что-нибудь понадобится, пожалуйста, обращайся."
10128-170 = "Фу, фу-фу, фу..."
10128-180 = "Я-я без труда справлюсь с чем-то подобным, ясно?"
10128-190 = "(Как всё дошло до такого? Что я сделала не так?)"
10128-200 = "(Всё обречено, да? Да? Правда ведь?!)"
10128-210 = "Фу... Фу-фу... Мне стоит какое-то время избегать таких заказов..."
10128-220 = "Да, ты прав. Я — лицо нашего клуба."
10128-230 = "Ходить на встречи, принимать заказы, работать с клиентами..."
10128-240 = "Да, это моя роль."
10128-250 = "Конечно, без поддержки Миё и Рицу..."
10128-260 = "...я была бы всего лишь обычной студенткой-художницей."
10128-270 = "...Искусство и правда совсем не простое."
10128-500 = "Мы всё ещё открыты, и товара много. Не спеши."
10128-510 = "Ты что-то ищешь?"
10128-520 = "Магазин ещё какое-то время будет открыт. Не спеши."
10128-530 = "Ты ищешь что-то конкретное?"
10128-540 = "...Нам стоит поговорить об этом вон там."
10128-550 = "Пф! Д-Даже если будешь меня тыкать, скидку не получишь!"
10128-560 = "У тебя изысканный взгляд."
10128-570 = "Я тоже положила глаз на этот товар."
10128-580 = "Возврат и обмен будут затруднительны, знаешь?"
10128-590 = "Отличный выбор. Может, завернуть?"
