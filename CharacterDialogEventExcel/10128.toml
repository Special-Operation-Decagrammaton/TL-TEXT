[translation]
10128-10850-150-1 = "I'm the Sales Manager of the Special Trade Department!\nI'm Fuyu Wakasa!"
10128-10850-160-1 = "If there is anything you need,\nplease feel free to\nconsult with me."
10128-10850-170-1 = "Heh, hehe..."
10128-10850-180-1 = "Business as usual.\nNo problems here."
10128-10850-190-1 = "(Why...? Where did I\ngo wrong...?)"
10128-10850-200-1 = "(Is it over already?\nThat's right, isn't it?\nIt's definitely over, right!?)"
10128-10850-210-1 = "Heh... hehe...\nI think I'll stay away from\nrequests like this for a while..."
10128-10850-220-1 = "Yes, I am the point of contact\nfor the Special Trade Department."
10128-10850-230-1 = "Making contact, securing requests,\nand providing satisfaction\nto our customers..."
10128-10850-240-1 = "That is my role."
10128-10850-250-1 = "If it weren't for the support\nfrom Miyo and Ricchan,"
10128-10850-260-1 = "I would be nothing more than\nan ordinary art student."
10128-10850-270-1 = "...Art is\nreally difficult, isn't it?"
10128-10850-500-1 = "We have plenty of stock.\nPlease, take your time\nand look around."
10128-10850-510-1 = "Did you find\nwhat you were looking for?"
10128-10850-520-1 = "We're good for a while yet.\nPlease, take your time."
10128-10850-530-1 = "You want something\nthat isn't here...?"
10128-10850-540-1 = "...Shall we discuss that\nover there?"
10128-10850-550-1 = "Haha! Poking at it\nwon't make it any cheaper, you know?"
10128-10850-560-1 = "As expected of Sensei.\nYou have a sharp eye."
10128-10850-570-1 = "That is my\ntop recommendation."
10128-10850-580-1 = "Please note that\nreturns and exchanges\nare not accepted."
10128-10850-590-1 = "Nice choice.\nWould you like me to wrap this up for you?"
