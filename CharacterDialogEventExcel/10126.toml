[translation]
10126-10849-160-1 = "Welcome to the\nOccult Research Club... Sensei."
10126-10849-170-1 = "The academy's secrets\nare waiting for you."
10126-10849-180-1 = "There are so many... \nsecrets just sleeping away, you know?"
10126-10849-190-1 = "WARNING, WARNING!\nTHE EVENT WILL END\nSHORTLY!"
10126-10849-200-1 = "...That's what it says."
10126-10849-210-1 = "Good work, Sensei."
10126-10849-220-1 = "I'll take these memories... \nwith me to my next life.\nHeh."
10126-10849-230-1 = "Sensei's hands... \nare so warm."
10126-10849-240-1 = "That crow... \nI don't recognize that one."
10126-10849-250-1 = "Do you... \nlike me?"
10126-10849-260-1 = "Can you... \nsay it out loud?\nHeh..."
10126-10849-270-1 = "Go ahead and pet me as much as you want... \njust like in our past life."
10126-10849-400-1 = "I've compiled the academy's secrets... \njust for you, Sensei."
10126-10849-410-1 = "Come on... let's unravel them together."
10126-10849-420-1 = "To think you could\nsolve this secret..."
10126-10849-430-1 = "You're amazing, Sensei."
10126-10849-440-1 = "Good work... \neveryone will be so happy.\nHeh."
10126-10849-450-1 = "Wild Hunt still has... \nso many unknown secrets\nleft to discover."
10126-10849-460-1 = "You... \nactually like me?"
10126-10849-470-1 = "I'm so happy... \nHehehe!"
