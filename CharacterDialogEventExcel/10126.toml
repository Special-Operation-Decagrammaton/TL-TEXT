[translation]
10126-160 = "Добро пожаловать в Общество оккультизма... Сенсей."
10126-170 = "...Тайны академии ждут тебя."
10126-180 = "Под землёй спит множество тайн... знаешь?"
10126-190 = "Внимание. Внимание. Событие скоро закончится."
10126-200 = "...По всей видимости."
10126-210 = "Хорошая работа, Сенсей."
10126-220 = "Это воспоминание... я заберу с собой в следующую жизнь. Хи-хи."
10126-230 = "Рука Сенсея... тёплая."
10126-240 = "Хм? Там ворона? Я её не знаю..."
10126-250 = "Я... тебе нравлюсь?"
10126-260 = "Скажи как следует. Хи-хи..."
10126-270 = "Можешь гладить меня сколько хочешь... Как и в прошлой жизни."
10126-400 = "Я собрала тайны академии... для тебя."
10126-410 = "А теперь... давай вместе раскроем тайны академии."
10126-420 = "Подумать только, ты раскрыл эту тайну..."
10126-430 = "Я знала, что у тебя получится, Сенсей!"
10126-440 = "Хорошая работа... Все будут рады. Хи-хи."
10126-450 = "Здесь, в Вайлдханте... всё ещё остаётся множество нераскрытых тайн."
10126-460 = "Я ведь тебе... правда нравлюсь...?"
10126-470 = "Я так счастлива... Э-хе-хе!"
