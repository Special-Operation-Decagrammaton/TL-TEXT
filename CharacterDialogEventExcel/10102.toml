[translation]
10102-220 = "Хи-хи. Здесь полно радостных людей..."
10102-230 = "Море... Фестиваль..."
10102-240 = "Возможно, это лучший момент моей жизни..."
10102-250 = "И-и! Т-тебе нужно, чтобы я что-то сделала?"
10102-260 = "Ты позвал меня без причины? Почему...?"
10102-270 = "А-А-Ацуко и Мисаки хорошо выглядят в купальниках..."
10102-280 = "Что? Я тоже? Спасибо..."
10102-290 = "Я подобрала водоросли, которые выбросило на пляж..."
10102-300 = "Мы ведь не можем это съесть...?"
10102-310 = "Я счастлива из-за моря и фестиваля..."
10102-320 = "Но мне будет так грустно, когда придётся вернуться к обычной жизни..."
10102-340 = "Хи-хи. Здесь полно радостных людей..."
10102-350 = "Море... Фестиваль..."
10102-360 = "Возможно, это лучший момент моей жизни..."
10102-370 = "Для меня всё это впервые..."
10102-380 = "Пляжные фестивали всегда такие...?"
10102-390 = "Е-если я не буду наслаждаться до самого конца,"
10102-400 = "...я потом не смогу уснуть...!"
10102-410 = "Всё... закончилось..."
10102-420 = "У меня ведь больше никогда не будет такого дня, да?"
10102-430 = "Что? Ты снова приведёшь меня к океану?"
10102-440 = "Хи-хи. Спасибо."
10102-450 = "Может, в следующий раз поедем на курорт...?"
10102-460 = "И-и! Т-тебе нужно, чтобы я что-то сделала?"
10102-470 = "Ты позвал меня без причины? Почему...?"
10102-480 = "А-А-Ацуко и Мисаки хорошо выглядят в купальниках..."
10102-490 = "Что? Я тоже? Спасибо..."
10102-500 = "Я подобрала водоросли, которые выбросило на пляж..."
10102-510 = "Мы ведь не можем это съесть...?"
10102-520 = "Я счастлива из-за моря и фестиваля..."
10102-530 = "Но мне будет так грустно, когда придётся вернуться к обычной жизни..."
10102-540 = "Хи-хи. Здесь продают столько разных вещей."
10102-550 = "Если купишь мне что-нибудь, я не откажусь. Хи-хи-хи."
10102-560 = "Столько красивых вещей..."
10102-570 = "Магазин закрыт."
10102-580 = "Я ничего не купила, но даже просто смотреть было весело."
10102-590 = "Я-я не знаю, что здесь хорошее..."
10102-600 = "Так что, думаю, выбирать стоит тебе..."
10102-610 = "И-и-и!!"
10102-620 = "Т-тут даже такое продают...!"
10102-630 = "Ты можешь вот так запросто покупать такие дорогие вещи... Взрослые потрясающие..."
10102-640 = "Может, это подарок для меня...?"
10102-650 = "Если так, спасибо. Хи-хи..."
10102-660 = "О, это. Я как раз на него смотрела. Хи-хи."
