[translation]
20043-440 = "Хорошо, Сенсей! Новый год!"
20043-450 = "Начинаем гастрономическое приключение!"
20043-460 = "Есть что-то конкретное, чего тебе хочется?"
20043-470 = "Выбор огромный!"
20043-480 = "И знаешь, даже если я просто сижу и смотрю, как ты ешь..."
20043-490 = "...это делает меня счастливой!"
20043-500 = "Каждый момент с тобой ощущается как новый опыт."
20043-510 = "Как когда я открываю новый вкус."
20043-520 = "Я где-то слышала, что хорошо отправляться в приключения вместе."
20043-530 = "Так что в гастрономическое приключение я отправлюсь вместе с тобой, Сенсей!"
20043-540 = "Я тоже состою в Обществе гурманов!"
20043-550 = "Поиск новых вкусов никогда не заканчивается!"
20043-560 = "Таков мой путь гастрономии!"
