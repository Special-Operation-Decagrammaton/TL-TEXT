[translation]
16016-320 = "Здравствуйте, Сенсей."
16016-330 = "Ты пришёл посмотреть на меня— То есть, на сцену, правда?"
16016-340 = "Я ждала тебя, Сенсей."
16016-350 = "Это место только для тебя. Располагайся."
16016-360 = "Шоу ещё продолжается. Пожалуйста, сосредоточься!"
16016-370 = "Пожалуйста, слушай до самого конца."
16016-380 = "Хи-хи, отличное было шоу."
16016-390 = "Сенсей... что-то не так?"
16016-400 = "Это тоже... часть фан-сервиса?"
16016-410 = "Если тебе понравилось, этого достаточно."
16016-420 = "А, а, а."
16016-430 = "...Я разогревала голос, чтобы быть готовой спеть в любой момент."
