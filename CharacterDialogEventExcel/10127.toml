[translation]
10127-10850-10-1 = "Welcome, Sensei.\nI just finished writing\nthe plot."
10127-10850-20-1 = "I'm so relieved to\nsee you, Sensei."
10127-10850-30-1 = "When I first enrolled\nin Wildhunt,"
10127-10850-40-1 = "I never imagined I'd end up\nhaving to do something\nlike this."
10127-10850-50-1 = "The situation has become\nquite complicated, hasn't it...?"
10127-10850-60-1 = "...I can't just give up."
10127-10850-70-1 = "A story is only complete\nwhen it's finished."
10127-10850-80-1 = "I'm glad it ended\nsafely."
10127-10850-90-1 = "...*Sigh*. I've had enough\nof requests like this."
10127-10850-100-1 = "Oh... was my typing\ntoo loud?"
10127-10850-110-1 = "How did I end up getting\ndragged into all of\nthis...?"
10127-10850-120-1 = "Y-you're staring at me\nso intently..."
10127-10850-130-1 = "Hehe. I'm happy."
10127-10850-140-1 = "After work, please come\nvisit our dormitory."
10127-10850-410-1 = "Welcome, Sensei.\nRight this way."
10127-10850-420-1 = "Take my hand.\n...Shall we draw a card\ntogether?"
10127-10850-430-1 = "Please stay until the very\nend of the story... so you\nhave no regrets."
10127-10850-440-1 = "Was there some kind\nof problem?"
10127-10850-450-1 = "Is there a specific card\nyou're looking for?"
10127-10850-460-1 = "That's amazing!\nEven I've never seen that\ncard with my own eyes!"
10127-10850-470-1 = "You're so lucky, Sensei!\nLet's keep this momentum\ngoing for the next one...!"
10127-10850-480-1 = "There is such a thing\nas the aesthetics of\nthe ordinary."
10127-10850-490-1 = "Don't be discouraged,\nSensei. Misfortune is just\na sign of coming luck."
