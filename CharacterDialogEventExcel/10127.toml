[translation]
10127-10 = "Добро пожаловать, Сенсей. Я только что закончила писать сюжет."
10127-20 = "Когда я вижу тебя, мне становится спокойнее."
10127-30 = "Когда я только поступила в Вайлдхант..."
10127-40 = "...Никогда не думала, что буду заниматься чем-то подобным."
10127-50 = "Всё стало довольно запутанно."
10127-60 = "...Но я всё равно не могу сдаться."
10127-70 = "История должна быть закончена."
10127-80 = "К счастью, всё закончилось хорошо."
10127-90 = "...Но всё же, не думаю, что снова соглашусь на такой заказ. Ух..."
10127-100 = "Хм? Моя печатная машинка слишком громкая...?"
10127-110 = "Интересно, как я вообще во всё это ввязалась..."
10127-120 = "Если ты продолжишь так на меня смотреть..."
10127-130 = "Как приятно, фу-фу."
10127-140 = "Загляни в наше общежитие, когда закончишь с работой."
10127-410 = "Добро пожаловать, Сенсей. Проходи сюда."
10127-420 = "Дай мне руку, Сенсей. Давай вместе вытянем карту."
10127-430 = "Концовки важны. Давай без сожалений посмотрим на финал этого места."
10127-440 = "Хм? С картой что-то не так?"
10127-450 = "Есть карта, которую ты ищешь?"
10127-460 = "Это...! Я тоже видела эту карту только в книгах...!"
10127-470 = "Тебе везёт, Сенсей! Продолжим в том же темпе...!"
10127-480 = "Обычность — тоже своя эстетика."
10127-490 = "Не унывай, Сенсей. Несчастье может быть предвестником будущей удачи."
