10085-280 = "Тяжёлая работа никогда не заканчивается, да, Сенсей? Даже после такого непростого года ты всё ещё позволяешь нам таскать тебя за собой..."
10085-290 = "...А? В смысле, тебе весело?"
10085-300 = "...Наверное, ты не просто так настолько популярен."
10085-310 = "Вице-президент тоже заставила тебя пойти с нами, Сенсей?"
