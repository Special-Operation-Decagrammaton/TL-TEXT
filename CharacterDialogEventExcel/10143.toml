[translation]
10143-310 = "Мы в окружении прекрасной природы. Фуфу, ну как Вам, Сенсей?"
10143-320 = "Что я думаю? Это весело и освежающе."
10143-330 = "Могу я позже занять немного Вашено времени?"
10143-340 = "Фуфу. Ничего особенного."
10143-350 = "Я просто хотела..."
10143-360 = "...прогуляться с Вами."
10143-370 = "Отправиться в такую поездку с Вами и остальными... Это действительно приятно."
10143-380 = "Я этого не забуду."
10143-390 = "Дети чисты душой."
10143-400 = "Они впитывают в себя всё окружающее сильнее, чем мы думаем."
10143-410 = "А потому мы должны подавать им хороший пример."
10143-420 = "Наверное, так Вы себя и чувствуете..."
10143-430 = "...когда смотрите на нас."
10143-440 = "Хорошая работа, Сенсей. Правда."
10143-450 = "А давайте отправимся в летний отпуск..."
10143-460 = "...чтобы по-настоящему насладиться временем, проведённым вместе?"
10143-470 = "Искали меня, Сенсей? Вы уже размялись?"
10143-480 = "Когда заходите в воду..."
10143-490 = "Делать это нужно медленно, начиная с ног."
10143-500 = "Да. Я здесь."
10143-510 = "Если Вам холодно... Я Вас согрею."
10143-520 = "Уваа! Сенсей, только не там!.."
10143-530 = "Ухх..."
10143-540 = "Ну ладно, но только чуть-чуть..."
10143-550 = "Ну правда, Сенсей!.. Нельзя, фу!"
10143-560 = "Давайте оставим это на потом, когда останемся вдвоём."
10143-570 = "Приветики, Сенсей! Добро пожаловать!"
10143-580 = "Это Ваша Шунлинь!"
10143-590 = "Ура! Сенсей пришёл!"
10143-600 = "Нормально ли я выгляжу в этом?"
10143-610 = "Фуфу, я всегда такая, значит?"
10143-611 = "Ах, Сенсей! Хихи. Я ждала Вас!"
10143-612 = "Когда вы закончите со всеей своей работой... Сходим повеселимся вместе?"
10143-613 = "Только в двоём... Конечно же!"
10143-620 = "Э-хе-хе, \nну как Вам? \nНравится?"
10143-630 = "Хм? Что-то не так?"
10143-640 = "Неужели Вы..."
10143-650 = "...не хотите играть... с \"Шунлинь\"?"
10143-660 = "Когда я нахожусь с Вами, Сенсей..."
10143-670 = "...я чувствую себя Самой счастлитвой!"
10143-680 = "Ведь..."
10143-690 = "...я могу быть честна со своими чувствами."
10143-700 = "Быть ребёнком — просто супер!"
10143-710 = "Это потрясающе, Сенсей! Вы победили!"
10143-720 = "Жители торгового района приготовили для Вас приз!"
10143-730 = "Вау! Невероятно! Сенсей, я тоже хочу посмотреть! Можно?.."
10143-740 = "Что там что там? Уверена, это что-то невероятное!"
10143-750 = "Что там что там? Уверена, это что-то невероятное!"
10143-960 = "Хотя мы называли это отпуском... Изначально это должен был быть аудит."
10143-970 = "Посмотрим, что сегодня в расписании?"
10143-980 = "Этот отпуск... Кхм, аудит..."
10143-990 = "Подумать только, что это будет в долине... Это может быть плодотворный опыт."
10143-1000 = "Не хотите ли свежих фруктов, Сенсей?"
10143-1010 = "Используйте эту возможность, чтобы отдохнуть. Вот так."
10143-1020 = "Хорошая работа."
10143-1030 = "У них тут много разного."
10143-1040 = "Естественно, ваше время принадлежит вам."
10143-1050 = "Но временами, я тоже хочу..."
10143-1060 = "...занять немного этого времени."
10143-1070 = "Сенсей, Вы знали? Некоторые считают моё поведение странным."
10143-1080 = "Но иногда это может пригодиться."
10143-1090 = "Например, так мне гораздо проще..."
10143-1100 = "...найти время для того, чтобы быть с Вами, Сенсей."
