[translation]
20039-170 = "山海経へ\nよくぞ参った、先生。"
20039-180 = "月影祭を心ゆくまで\n楽しんでいくと良い。"
20039-190 = "行き先に悩んだ時には\n妾に申し付けよ。"
20039-200 = "すぐに人を手配しよう。"
20039-210 = "月影祭では数多の\n物語が交差する。"
20039-220 = "ふふ、興味があるのなら\nこれを機に調べて\nみてはどうじゃ？"
20039-230 = "玄武商会は月影祭に\n乗じて外部と交流を\n深めようとしておる。"
20039-240 = "Добро пожаловать в Шаньхайцзин, Сенсей."
20039-250 = "Надеюсь, ты насладишься Фестивалем лунного света по полной."
20039-260 = "Если не будешь знать, куда идти, скажи."
20039-270 = "Я сразу пришлю кого-нибудь помочь."
20039-280 = "Я не знала, что всё обернётся так..."
20039-290 = "Я доставляю тебе неприятности, Сенсей."
20039-300 = "Ты... останешься рядом со мной, правда?"
20039-310 = "Всё совершит круг и вернётся к тебе..."
20039-320 = "А теперь пойдём вернём наш Шаньхайцзин."
20039-330 = "Отличная работа, Сенсей."
20039-340 = "Как президент Генрюмона и как студент..."
20039-350 = "...я искренне уважаю тебя и благодарна."
20039-360 = "Во время Фестиваля лунного света пересекается множество историй."
20039-370 = "Фуфу. Если интересно, почему бы не расследовать?"
20039-380 = "Променад Чёрной Черепахи использует Фестиваль лунного света как возможность наладить связи с внешним миром."
20039-390 = "Хотя как президент я не делала никаких специальных заявлений..."
20039-400 = "Генрюмон и Променад Чёрной Черепахи. На чьей стороне корень проблемы...?"
20039-410 = "Прости, Сенсей. Даже будучи президентом, я не всё знаю."
20039-420 = "Пока я президент, я гарантирую безопасность Шаньхайцзин."
20039-430 = "Кто бы ни был противником."
20039-440 = "И тебя это тоже касается, Сенсей."
20039-640 = "Ты здесь. Прямо сейчас..."
20039-650 = "Понятно. Ну, теперь пора освежиться. Фуфу."
20039-660 = "Мы подготовили для тебя развлечения."
20039-670 = "Пожалуйста, наслаждайтесь."
20039-680 = "...Но, пожалуйста, не переешь."
20039-690 = "Время ещё есть."
20039-700 = "Давай останемся вместе до самого конца."
20039-710 = "Что такое, Сенсей?"
20039-720 = "А? Хочешь, чтобы я попробовала первой?"
20039-730 = "Ты понимаешь, что это означает? Фуфу."
20039-740 = "А если меня это не смущает?"
20039-750 = "Хочешь кусочек, Сенсей?"
20039-760 = "Я уже попробовала. Не переживай. Хи-хи."
20039-770 = "Снеки — одна из особенностей Фестиваля лунного света."
20039-780 = "Поищем их вместе?"
20039-790 = "Узнавать новое — хорошо."
20039-800 = "Не согласен?"
20039-810 = "Ты любишь сладкое, Сенсей?"
20039-820 = "Для меня оно... так себе."
20039-830 = "О... Это интересно."
20039-840 = "Можно и мне попробовать?"
20039-850 = "Ты справился, Сенсей."
20039-860 = "Но ты ведь не станешь почивать на лаврах. Верно?"
20039-870 = "Работа, говоришь? ...Тебе интересно, почему я здесь?"
20039-880 = "Потому что это тоже обязанность президента."
20039-890 = "Каждый день — новый день."
20039-900 = "А значит, каждый день нужно становиться лучше."
20039-910 = "Если когда-нибудь понадобится помощь, я всегда протяну руку."
20039-920 = "Что такое, Сенсей? Хочешь меня пощекотать?"
20039-930 = "Фуфу. Это немного невежливо."
20039-940 = "Но даже это я прощу."
20039-950 = "Ты разыгрываешь меня?"
20039-960 = "Хорошо. Разрешаю. Только между нами, Сенсей."
20039-970 = "...Но, пожалуйста, не делай этого при других."
20039-980 = "Да. Это сделал ты. Не отказывайся, просто возьми."
20039-990 = "Ты очень предан, Сенсей."
20039-1000 = "Если бы могла, я хотела бы навсегда оставить тебя рядом..."
20039-1010 = "Нет-нет. Забудь."
