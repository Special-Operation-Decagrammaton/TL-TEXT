[translation]
20039-900840-170-1 = "Welcome to Shanhaijing,\nSensei."
20039-900840-180-1 = "Please enjoy the\nMoonlight Festival to your heart's content."
20039-900840-190-1 = "If you are unsure where to go,\njust let me know."
20039-900840-200-1 = "I will arrange for someone immediately."
20039-900840-210-1 = "Many stories intersect\nat the Moonlight Festival."
20039-900840-220-1 = "Heh, if you are interested,\nwhy not take this opportunity\nto look into them?"
20039-900840-230-1 = "The Genbu Mercantile is taking advantage\nof the Moonlight Festival to deepen\nits ties with outsiders."
20039-900840-240-1 = "As the sect leader,\nI have not taken a\nparticular stance, but..."
20039-900840-250-1 = "Between the Genryumon and the Genbu Mercantile,\nwho is at fault... hmm."
20039-900840-260-1 = "My apologies, Sensei.\nEven as the sect leader,\nI cannot foresee everything..."
20039-900840-270-1 = "As long as I am the sect leader,\nI will guarantee your safety\nhere in Shanhaijing."
20039-900840-280-1 = "No matter who the opponent may be."
20039-900840-290-1 = "Of course, that includes you,\nSensei."
