[translation]
20015-10 = "Добро пожаловать в кинодеревню Хяккияко! Я буду твоим гидом, Сенсей!"
20015-20 = "О, Сенсей! Что происходит? Будешь развлекаться в кинодеревне?"
20015-30 = "Я тоже хочу поиграть с тобой!"
20015-40 = "О, но сейчас я не могу этого сделать..."
20015-50 = "Клуб внутренней дисциплины должен помогать с мероприятием в этот раз..."
20015-60 = "Ух... Я просто хочу поиграть!"
20015-70 = "А? Что? Это вроде игры в тыканье?"
20015-80 = "Я не проиграю! Хи-и-я! Ха-я!"
20015-90 = "Я знаю, что такая помощь — часть моей тренировки, но..."
20015-100 = "...всё равно так скучно!"
20015-110 = "Хм-м... Хочу выйти и повеселиться..."
20015-120 = "Хм-м... Нет. Сидеть без движения просто невыносимо скучно!"
20015-130 = "...Ах, после крика стало легче."
20015-140 = "А? Что? Это вроде игры в тыканье?"
20015-150 = "Я не проиграю! Хи-и-я! Ха-я!"
20015-160 = "Я знаю, что такая помощь — часть моей тренировки, но..."
20015-170 = "...всё равно так скучно!"
20015-180 = "Хм-м... Хочу выйти и повеселиться..."
20015-190 = "Хм-м... Нет. Сидеть без движения просто невыносимо скучно!"
20015-200 = "...Ах, после крика стало легче."
20015-720 = "Теперь можно выбрать карту! Почему бы не попробовать, Сенсей?"
20015-730 = "Хорошо, выбирай одну! Твой ход. Тяни!"
20015-740 = "Можно уж тогда выбрать их все!"
20015-750 = "Может, попадётся редкая карта!"
20015-760 = "Тук-тук, тук-тук! Что же будет?"
20015-770 = "Надеюсь, редкая карта!"
20015-780 = "Она блестит и такая красивая. Как волнительно!"
20015-790 = "Ого, это невероятно редкая карта!"
20015-800 = "Сенсей! Потрясающе! Это наверняка судьба!"
20015-810 = "О, хорошая карта! Это должно быть... сила взрослого..."
20015-820 = "О, эту я часто вижу. Но, думаю, она всё равно довольно редкая!"
20015-830 = "Ну, эм... Н-не расстраивайся, Сенсей!"
20015-840 = "В следующий раз тебе точно выпадет что-нибудь хорошее! Наверное."
