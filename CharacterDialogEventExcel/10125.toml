[translation]
10125-10 = "Тот, кого ведёт Аркан. Сюда."
10125-20 = "Итак, давай раскроем тайну, скрытую под Вайлдхантом..."
10125-30 = "Ты и я. Вместе."
10125-40 = "Эм, нельзя, чтобы Совет Префектов узнал о моём плане..."
10125-50 = "Ещё совсем немного! Встретим финал без сожалений!"
10125-60 = "И в следующий раз..."
10125-70 = "Я хочу создать вместе с тобой невероятное произведение искусства, Мастер!"
10125-80 = "Ню-ху-ху, тебе интересна магия?"
10125-90 = "Мастер, хочешь, я погадаю тебе?"
10125-100 = "Конечно, бесплатно."
10125-110 = "Просто скажи!"
10125-120 = "П-Пожалуйста, не трогай мою шляпу."
10125-130 = "Это символ мага, она ни в коем случае не должна сниматься!"
10125-140 = "А, я оставила там магическую гравировку...!"
10125-150 = "Если продолжишь её трогать... она может взорваться. Ню-ху-ху."
10125-280 = "Итак, давай завладеем магическими инструментами!"
10125-290 = "О-о, эти предметы... Я чувствую их магическую силу одним взглядом...!"
10125-300 = "Я больше не смогу получать отсюда магические инструменты..."
10125-310 = "...но ничего!"
10125-320 = "Будь то воспоминания с тобой или магические инструменты..."
10125-330 = "...в будущем их у меня будет всё больше и больше!"
10125-340 = "Тебе что-нибудь приглянулось?"
10125-350 = "С нетерпением жду, какой стиль ты выберешь, Мастер!"
10125-360 = "Ох, этот предмет переполнен магической силой!"
10125-370 = "Другого я и не ожидала! У тебя хороший вкус!"
10125-380 = "Давай проверим его прямо сейчас!"
10125-390 = "А, мне тоже показалось, что это хороший вариант!"
