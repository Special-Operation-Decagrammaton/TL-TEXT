[translation]
10125-10849-10-1 = "Those guided by the\nArcana... come here."
10125-10849-20-1 = "Come now, let us uncover\nthe secrets sleeping within..."
10125-10849-30-1 = "the Wild Hunt."
10125-10849-40-1 = "Ugh... I hope the dorm\nsupervisors don't catch me..."
10125-10849-50-1 = "Just a little more!\nLet's reach a finale\nwith no regrets!"
10125-10849-60-1 = "Master! Let's do this\ntogether again..."
10125-10849-70-1 = "Let's create some\nwonderful art!"
10125-10849-80-1 = "Nyu-fufu, are you\ninterested in magic?"
10125-10849-90-1 = "Master, would you like me\nto tell your fortune?"
10125-10849-100-1 = "Of course, there's\nno charge."
10125-10849-110-1 = "Please feel free to\nask me anytime!"
10125-10849-120-1 = "N-no, you can't touch\nmy hat."
10125-10849-130-1 = "T-this is a symbol of\nbeing a mage, so...\nI can't take it off!"
10125-10849-140-1 = "Ah, there's a\nmagic crest there...!"
10125-10849-150-1 = "If you keep poking it...\nit might go off.\nNyu-fufu."
10125-10849-280-1 = "Come, let's get our hands\non some magic tools!"
10125-10849-290-1 = "Oh, this selection...\nJust looking at it fills me with mana...!"
10125-10849-300-1 = "We can't collect any more\nmagic tools here, but..."
10125-10849-310-1 = "That's fine!"
10125-10849-320-1 = "Memories with you, Master,\nand magic tools alike,"
10125-10849-330-1 = "we'll find plenty more\nof them from here on out!"
10125-10849-340-1 = "Did you find anything\nthat caught your eye?"
10125-10849-350-1 = "I have high expectations\nfor your aesthetic sense, Master!"
10125-10849-360-1 = "I can feel a strong\nmagical aura from this...!"
10125-10849-370-1 = "As expected of you, Master!\nYou have a keen eye!"
10125-10849-380-1 = "Shall we try it out\nright away?"
10125-10849-390-1 = "Ah, that's exactly what\nI was hoping for too!"
