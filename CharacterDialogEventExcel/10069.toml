[translation]
10069-10 = "О, вот ты где, Сенсей. Как тебе Шаньхайцзин?"
10069-20 = "Рада, что ты не заблудился."
10069-30 = "Улицы Шаньхайцзин запутанные."
10069-40 = "В последнее время плечи совсем затекли... Нужен массаж."
10069-50 = "Может, от тебя, Сенсей...? *глоток*"
10069-60 = "Ха-ха! Щекоткой правду из меня не вытащить!"
10069-70 = "Я могу предложить тебе одно из блюд, которое всё ещё изучаю, но..."
10069-80 = "Я всегда подаю гостям еду высшего качества!"
10069-90 = "Ну и... если я всё ещё изучаю блюдо, возможно, оно пока не дотягивает до такого уровня."
10069-100 = "Сенсей, ты очень важен для меня."
10069-110 = "Ты клиент, коллега и... эм..."
10069-120 = "Прости, я сказала лишнее..."
10069-200 = "Управление товарами можешь оставить нам."
10069-210 = "Но подача и расположение товаров тоже имеют значение. Не спеши и осмотрись внимательно."
10069-220 = "Важно всегда доводить работу до конца."
10069-230 = "Хм. Что такое? Тебя что-то беспокоит?"
10069-240 = "...В следующий раз я куплю правильную вещь."
10069-250 = "Как всегда, спасибо! Давно я не видела магазин. Ха-ха."
10069-260 = "Хочешь это? Хороший выбор. Качество гарантировано!"
10069-270 = "Покупай, пока не распродали. Нет ничего хуже, чем ждать следующую поставку."
10069-280 = "...это значит лишь то, что товаром стал ты сам, даже не заметив этого!"
10069-290 = "Ну что, Сенсей. Пора испытать удачу."
10069-300 = "Выбирай. Интересно, что выпадет."
10069-310 = "Потрать всё здесь, иначе потом пожалеешь."
10069-320 = "Это лишь одно из множества предприятий, которыми занимается Променад."
10069-330 = "Как и во всём, удача важна."
10069-340 = "Потрясающе! Вот это сюрприз! Поздравляю, Сенсей."
10069-350 = "Я очень за тебя рада."
10069-360 = "Посмотрим... Результат...? Ну, всё ещё неплохо..."
10069-370 = "Ох... Ну-ну... Не расстраивайся слишком сильно, Сенсей. Всегда будет следующий раз."
