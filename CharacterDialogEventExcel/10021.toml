[translation]
10021-10 = "Океан... Лето..."
10021-20 = "Эй? На что ты смотришь?"
10021-30 = "Добро пожаловать, Сенсей. Дел много."
10021-40 = "Этот купальник очень милый... Хи... хи..."
10021-50 = "С-Сенсей? Ты на меня смотрел?"
10021-60 = "Н-не смотри так... Я совсем к такому не привыкла."
10021-70 = "Я-я в порядке... Не обращай внимания."
