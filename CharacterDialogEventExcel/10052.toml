[translation]
10052-160 = "Хм-м. Согласно моему расписанию, сейчас мы должны готовиться к Фестивалю ореолов Кивотоса."
10052-170 = "Надо поторопиться. Не хочется пропустить церемонию открытия!"
10052-180 = "Во время фестиваля все взгляды будут прикованы к нам..."
10052-190 = "...поэтому нужно постараться и показать истинную ценность Миллениума!"
10052-200 = "Я не особо спортивная..."
10052-210 = "Но в конце концов это ещё одна обязанность Семинара."
10052-220 = "(...Полагаю, не все так уж рады фестивалю...)"
10052-230 = "Я абсолютно, на сто процентов уверена: Юка без всяких сомнений прожужжит мне все уши."
10052-240 = "Хе-хе... Уже представляю растерянное лицо Юки."
10052-250 = "Спасибо за тяжёлую работу, Сенсей. Все действительно выложились..."
10052-260 = "Уверена, Фестиваль ореолов Кивотоса в этом году будет потрясающим."
10052-270 = "Во время фестиваля все взгляды будут прикованы к нам..."
10052-280 = "...поэтому нужно постараться и показать истинную ценность Миллениума!"
10052-290 = "Я не особо спортивная..."
10052-300 = "Но в конце концов это ещё одна обязанность Семинара."
10052-310 = "(...Полагаю, не все так уж рады фестивалю...)"
10052-320 = "Я абсолютно, на сто процентов уверена: Юка без всяких сомнений прожужжит мне все уши."
10052-330 = "Хе-хе... Уже представляю растерянное лицо Юки."
10052-560 = "Вот список задач, которые необходимо выполнить при подготовке к Фестивалю ореолов Кивотоса."
10052-570 = "Как раз вовремя, Сенсей. Я хотела попросить тебя о помощи."
10052-580 = "О? Почему я не могу сделать это сама?"
10052-590 = "Ха-ха. О, Сенсей. Конечно, я уже занята. Я могла бы сделать это позже, но..."
10052-600 = "Я многому научилась. Всё-таки ты учитель."
10052-610 = "На тебя можно положиться. Я удивлена."
