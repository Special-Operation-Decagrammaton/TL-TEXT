[translation]
10001-10130 = "Ты вернулся, Сенсей. Рада снова тебя видеть."
10001-10140 = "Угх... Спать хочется..."
10001-10150 = "Я в этом наряде выгляжу так, будто мне холодно?"
10001-10160 = "Ну, мне он нравится, потому что в нём прохладно."
10001-10170 = "Наряд классный, но гильзы всё время внутрь залетают..."
10001-10180 = "Вот морока."
10001-10190 = "Это было... быстрее, чем я ожидала."
10001-10200 = "Одобрено."
