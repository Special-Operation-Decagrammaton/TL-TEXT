[translation]
0-10 = "Добро пожаловать, Сенсей. Как видишь, восстановление города Сиратори в D.U. идёт полным ходом."
0-20 = "Это город Сиратори в D.U."
0-30 = "Куда ни посмотри — ситуация одна и та же. Но именно поэтому восстановление здесь нужно ускорить."
0-40 = "Восстановление идёт хорошо."
0-50 = "Такими темпами улицы скоро вернутся в норму."
0-60 = "Мы приближаемся к завершению восстановительных работ."
0-70 = "Спасибо за всю тяжёлую работу, Сенсей."
0-80 = "Восстановление города Сиратори завершено."
0-90 = "Не составишь мне компанию и не посмотришь на место работ?"
0-100 = "Ты звал, Сенсей? Чем могу помочь?"
0-110 = "Поскольку столько студентов помогают, восстановление идёт гладко."
0-120 = "Я очень рада, что попросила помощи у Шале."
0-130 = "Похоже, тебе стало лучше."
0-140 = "...Я рада это видеть."
0-150 = "В конце концов, разрушенные здания можно восстановить..."
0-160 = "Но если потеряешь здоровье, исправить это куда сложнее."
0-170 = "Поэтому, пожалуйста, не перенапрягайся."
0-180 = "О, Сенсей. Добро пожаловать."
0-190 = "Я схожу за оставшимися материалами."
0-200 = "*хрум* *ням* *ням*"
0-210 = "О! Сенсей?"
0-220 = "Хи-хи. Ты тоже отлыниваешь?"
0-230 = "*вздох* Восстановление города так раздражает..."
0-240 = "Вот бы в каждом здании D.U. продавались снеки."
0-250 = "Тогда я могла бы есть икру минтая когда захочу...!"
0-260 = "Я никогда в жизни не была настолько занята..."
0-270 = "Но, наверное, я у тебя в долгу, да и иногда быть активной мне не повредит..."
0-280 = "О, тебе это нужно?"
0-290 = "Конечно. Бери сколько хочешь."
0-300 = "О, я тоже присматривалась к этому!"
0-310 = "Хорошо-хорошо. Можешь забрать. Приходи ещё."
0-320 = "Можешь взять любые нужные припасы."
0-330 = "О, не забудь сделать запись в журнале."
0-340 = "О, здравствуй, Сенсей."
0-350 = "Давай, как всегда, постараемся."
0-360 = "Надеюсь, восстановление пройдёт гладко."
0-370 = "Раз ты здесь, я не слишком переживаю."
0-380 = "Ах, припасы разбросаны повсюду..."
0-390 = "Смотри под ноги, Сенсей."
0-400 = "Мне кажется, Рин в последнее время слишком много работает."
0-410 = "Я немного за неё переживаю."
0-420 = "Ого! Ты уже закончил? Потрясающе, Сенсей!"
0-430 = "Отличная работа, Сенсей! Это мелочь, но, пожалуйста, прими знак благодарности от Генерального студенческого совета."
0-431 = "...Всё закончилось? Тогда я принесу следующий список."
0-440 = "А? Что такое?"
0-450 = "Если тебя что-то беспокоит, можешь поговорить со мной об этом."
0-460 = "Я здесь, чтобы помочь тебе, Сенсей."
0-470 = "Можешь, пожалуйста, сосредоточиться?"
0-480 = "Нет, не на мне... На работе."
0-490 = "Не будь таким отстранённым."
0-500 = "...Мне тоже бывает больно."
0-510 = "Эй... Я в порядке."
0-520 = "Тебе стоит проверить вон там."
0-530 = "Эм... Я в порядке."
0-540 = "Не могу поверить, что ты выбрал именно это... Потрясающе, Сенсей!"
0-550 = "Эх... Неплохо."
0-560 = "Вроде нормально?"
