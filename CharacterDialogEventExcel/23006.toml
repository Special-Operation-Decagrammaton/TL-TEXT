[translation]
23006-170 = "Добро пожаловать в магазин Момоёдо! Итак, Мастер, что вам сегодня нужно?"
23006-180 = "О, Сенсей. Добро пожаловать."
23006-190 = "Выбирай что нравится!"
23006-200 = "Фестиваль закончился, но мы всё ещё открыты."
23006-210 = "Я лично благословлю оставшиеся товары. Осмотрись, Сенсей!"
23006-220 = "Момоёдо не остановить, даже если фестиваля нет!"
23006-230 = "Ну, мы всё-таки Отдел организации фестивалей. Хи-хи."
23006-240 = "Отлично. Здесь это... Моэ-моэ... кюн!"
23006-250 = "А? Это выглядит старым? С чего бы?!"
23006-260 = "О, это! Нет-нет. Не то чтобы я думала забрать остатки!"
23006-270 = "Твой выбор... Я знала, что у тебя хороший вкус, Сенсей!"
23006-280 = "Как всегда, спасибо, Мастер!"
23006-290 = "Хорошая вещь, правда? Хи-хи."
