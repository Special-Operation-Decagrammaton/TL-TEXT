[translation]
10093-280 = "Какая весёлая экскурсия! Готов, Учитель?"
10093-290 = "Ёдзакура Кирара готова веселиться!"
10093-300 = "Чего я жду больше всего?"
10093-310 = "Новых мест, новой еды и самое главное... новых друзей!"
10093-320 = "Я нашла идеальное место для фото. Что скажешь?"
10093-330 = "Вон то огромное дерево!"
10093-340 = "А? Что такое? Увидел что-то интересное?"
10093-350 = "Ха-ха! Какое совпадение! Я тоже на тебя смотрела, Учитель!"
10093-400 = "Какая весёлая экскурсия! Готов, Учитель?"
10093-410 = "Ёдзакура Кирара готова веселиться!"
10093-420 = "Тебе нравится поездка, Учитель?"
10093-430 = "Отлично! Я тоже прекрасно провожу время!"
10093-440 = "Грустно, что наша экскурсия подходит к концу..."
10093-450 = "Не переживай! Впереди ещё куча хороших моментов!"
10093-460 = "Ого! Сплошные впечатления от начала до конца! Это было невероятно весело!"
10093-470 = "Чего я жду больше всего?"
10093-480 = "Новых мест, новой еды и самое главное... новых друзей!"
10093-490 = "Я нашла идеальное место для фото. Что скажешь?"
10093-500 = "Вон то огромное дерево!"
10093-510 = "А? Что такое? Увидел что-то интересное?"
10093-520 = "Ха-ха! Какое совпадение! Я тоже на тебя смотрела, Учитель!"
10093-700 = "Добро пожаловать, Учитель! Готов?"
10093-710 = "Интересно, что будет! Разве не волнительно?"
10093-720 = "Держись до самого конца, Учитель!"
10093-730 = "Интересно, какой будет главный приз!"
10093-740 = "Давай вытянем прямо сейчас! Пока не попробуем — не узнаем!"
10093-750 = "Ого! Редкая карта! Потрясающе, Учитель!"
10093-760 = "Хорошая карта! Поздравляю!"
10093-770 = "Хоть изображение и знакомое... разве рисунок не очаровательный?"
10093-780 = "Ой. Я-я такого не ожидала..."
10093-790 = "Не расстраивайся, Учитель! Всегда будет следующий раз!"
