[translation]
10149-10 = "Welcome to the Diving Club,\nSensei!"
10149-20 = "Kombu-cha...\nPlease, help yourself..."
10149-30 = "D-Did we mess up\nagain...?"
10149-40 = "Ugh...\nI don't want to not be\nable to dive..."
10149-50 = "A treasure map..."
10149-60 = "I wonder if there really\nis treasure..."
10149-70 = "...I suppose there's no\nother way."
10149-80 = "Phew...\nTime to clean off these\nbarnacles..."
10149-90 = "Um...\nDid you need something?"
10149-100 = "An \"Aquaseal\"\nice cream..."
10149-110 = "It gets my body so cold,\nso I try not to eat\nthings that are\ntoo chilly..."
10149-120 = "Air tank refills...\nand replacing the\nregulator..."
10149-130 = "Ugh...\nIt's gonna be tight\nthis month too..."
10149-140 = "Ah, ahaha! Th-That\ntickles...!"
10149-500 = "You're my buddy\ntoday, Sensei."
10149-510 = "Now, let's go."
10149-520 = "To the underwater world."
10149-530 = "Just to be sure...\nLet's double-check\nfor anything we missed."
10149-540 = "Good work, Sensei."
10149-550 = "I was just cleaning up."
10149-560 = "Th-That hand signal..."
10149-570 = "You're going to make\nme misunderstand..."
10149-580 = "Ah!\nWh-What's behind me...?"
10149-590 = "D-Don't say scary things\nlike that!"
10149-600 = "Sharks aside, I'm...\nI-I'm no good with scary\nthings...!"
10149-610 = "Inside here...\nLooks like there's\nsomething."
10149-620 = "Ah...\nIt just moved!"
10149-630 = "Found it!"
10149-640 = "Wow...!\nSo this is what was\nhiding!"
10149-650 = "Let's head for the\nnext point."
10149-660 = "Let's begin the\nbriefing!"
10149-670 = "I'm going to go over the\nwork plan, so please\npay attention...!"
10149-680 = "When working underwater,\nyou have to set clear\ngoals."
10149-690 = "Wh-What's wrong?"
10149-700 = "...Did I miss\na spot?"
10149-710 = "Is it already done?\nSensei, that's amazing...!"
10149-720 = "Ah, yes! That's fine!\nThat was fast..."
