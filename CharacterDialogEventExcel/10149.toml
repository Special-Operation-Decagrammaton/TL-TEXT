[translation]
10149-10 = "Д-добро пожаловать в Клуб дайвинга, Сенсей!"
10149-20 = "Н-не хотите... чашечку чая из ламинарии?"
10149-30 = "Н-наш Клуб дайвинга опять что-то напутал?"
10149-40 = "Уф... Как же не хочется лишиться возможности нырять..."
10149-50 = "Карта сокровищ..."
10149-60 = "Сомневаюсь, что у нас найдётся настоящая карта сокровищ..."
10149-70 = "...Но, похоже, выбора у нас нет."
10149-80 = "Вот мы и провели какое-то время, счищая ракушки с корпусов..."
10149-90 = "Вам что-нибудь от меня нужно?"
10149-100 = "Мороженое из «Аква Сил»..."
10149-110 = "Не люблю, когда от чего-то пробирает холодом, так что никогда его не пробовала."
10149-120 = "Если прибавить стоимость заправки баллона... к цене замены старого регулятора..."
10149-130 = "Уф, и в этом месяце придётся туго..."
10149-140 = "А-ха, а-ха-ха! Щ-щекотно...!"
10149-500 = "Сенсей, побудьте сегодня моим напарником."
10149-510 = "Ну что, погрузимся в мир,"
10149-520 = "скрытый под водой?"
10149-530 = "Давайте... ещё раз проверим, ничего ли мы не забыли."
10149-540 = "А, добро пожаловать."
10149-550 = "Я как раз прибиралась."
10149-560 = "Е-если вы подаёте такие сигналы руками..."
10149-570 = "Я ведь могу неправильно понять..."
10149-580 = "Что? У меня что-то за спиной...?"
10149-590 = "Н-не говорите таких страшных вещей!"
10149-600 = "Я ещё могу справиться с акулой, но всякую мистику терпеть не могу!"
10149-610 = "Кажется... здесь что-то есть."
10149-620 = "А...! Оно только что шевельнулось!"
10149-630 = "Нашла!"
10149-640 = "Ого... Не ожидала, что здесь может прятаться такое..."
10149-650 = "Переходим к следующей точке."
10149-660 = "Начнём предварительный инструктаж!"
10149-670 = "С-сейчас объясню план работы, поэтому, пожалуйста, слушайте внимательно...!"
10149-680 = "Перед подводной операцией важно поставить чёткие цели."
10149-690 = "Ч-что это?"
10149-700 = "...Я пропустила какой-то пункт?"
10149-710 = "В-вы уже закончили? Невероятно."
10149-720 = "Д-да! Именно так... Быстро же вы."
