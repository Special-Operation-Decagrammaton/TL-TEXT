[translation]
10075-10 = "Сенсей здесь. Время Фронта освобождения знаний!"
10075-20 = "Добро пожаловать, Сенсей. Похоже, снаружи многое происходит. Пойдём!"
10075-30 = "Надеюсь, мы найдём что-нибудь, что вдохновит меня на следующую книгу!"
10075-40 = "Никогда не думала, что всё обернётся так..."
10075-50 = "Не могу поверить, как развернулась эта история..."
10075-60 = "Никогда не знаешь, куда заведёт жизнь..."
10075-70 = "Мы многое пережили, но теперь всё успокоилось..."
10075-80 = "И мы собрали много всего, так что в итоге это был успех."
10075-90 = "Ты меня звал?"
10075-100 = "Я? Я занята, но... одновременно совсем не занята."
10075-110 = "Момидзи — коллега и младшекурсница, которой я могу доверить спину!"
10075-120 = "У каждого свои предпочтения, да?"
10075-130 = "Почему? Сенсей... У тебя слишком много свободного времени?"
10075-140 = "Ну ладно, немного с тобой поиграю."
10075-150 = "Щ-щекотно! Прекрати! Хватит!"
10075-580 = "Миссия!"
10075-590 = "Закончить каждую рукопись — моя миссия!"
10075-600 = "Я справлюсь со всем, что мне поручат! Таково обещание Фронта освобождения знаний!"
10075-610 = "Да? Сенсей? ...Ты просто хотел произнести моё имя?"
10075-620 = "Ого. Когда ты выдаёшь такую реплику, я даже не знаю, что ответить."
10075-630 = "Давай поговорим, Сенсей! Ты говори что-нибудь, а я найду вдохновение в твоих словах!"
10075-640 = "Ого, это потрясающе. Правда потрясающе. Я не просто так говорю. Серьёзно!"
10075-650 = "Только посмотри, насколько искренни мои глаза!"
10075-660 = "Миссия выполнена! Забирай награду!"
10075-670 = "Как тебе моя продавщицкая улыбка?"
