[translation]
20064-865-150-1 = "Welcome to the Council, Sensei."
20064-865-160-1 = "Let us face this crisis\ntogether."
20064-865-170-1 = "If I had my way,\nI would rather not\nask for their help..."
20064-865-180-1 = "Let us walk this path together\nuntil the curtain falls."
20064-865-190-1 = "The incident has been resolved, but...\nit seems the true crisis\nis yet to come."
20064-865-200-1 = "If you need anything,\nplease do not hesitate\nto ask."
20064-865-210-1 = "Ah, though...\nthere are some things\nI cannot do."
20064-865-220-1 = "Beautiful roses\nhave thorns..."
20064-865-230-1 = "If you reach out carelessly,\nyou will get hurt, you know?"
20064-865-240-1 = "Hehe... perhaps that is\nnone of my business,\nthough."
20064-865-250-1 = "To not need words, but simply\nfeel each other's breath\nwhile standing side by side..."
20064-865-260-1 = "That is the kind of relationship\nI prefer."
20064-865-270-1 = "Sensei... do you have\nsomeone like that?"
20064-865-280-1 = "Everyone wears a persona...\nso,"
20064-865-290-1 = "I am not one to\ntrust people easily,\nbut..."
20064-865-300-1 = "For you, Sensei... I feel\nI could entrust myself\nto you."
20064-865-310-1 = "I have a variety of items\navailable for you."
20064-865-320-1 = "Is there anything you need?"
20064-865-330-1 = "This stage has\nlowered its curtain, but—"
20064-865-340-1 = "I truly wish to be\nof help to you, Sensei."
20064-865-350-1 = "Please stay with me for\nthe curtain call."
20064-865-360-1 = "Unfortunately, as these are\nManami-sama's orders,\nthey are not free."
20064-865-370-1 = "Can you smell the roses...?"
20064-865-380-1 = "Here it is."
20064-865-390-1 = "It has a lovely scent."
20064-865-400-1 = "I am glad it is to your liking."
20064-865-410-1 = "Yes, here you go."
