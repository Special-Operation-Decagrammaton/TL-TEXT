[translation]
10088-90 = "Я тебя ждала, Сенсей. Что мне делать?"
10088-100 = "...А, я как раз тебя искала, Сенсей."
10088-110 = "...А? Ты меня звал?"
10088-120 = "Сенсей... Сейчас не время дурачиться."
10088-130 = "*вздох* Поиграем после работы."
10088-140 = "Меня не задевают твои подколы, но..."
10088-150 = "...я была бы благодарна, если бы ты прекратил."
10088-160 = "Я начну уборку."
10088-170 = "...А? Ты меня звал?"
10088-180 = "Сенсей... Сейчас не время дурачиться."
10088-190 = "*вздох* Поиграем после работы."
10088-200 = "Меня не задевают твои подколы, но..."
10088-210 = "...я была бы благодарна, если бы ты прекратил."
10088-220 = "Нужны припасы? Они здесь."
10088-230 = "Если захочешь что-нибудь ещё, просто скажи. Я принесу."
10088-240 = "Работа закончилась, но... ты ничего не забыл?"
10088-250 = "Если забыл, просто скажи. Я найду."
10088-260 = "Эй, щекотно."
