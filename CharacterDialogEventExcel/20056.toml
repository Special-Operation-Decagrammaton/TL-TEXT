[translation]
20056-790 = "К-Кто это?!"
20056-800 = "...А, это Сенсей!!"
20056-810 = "Ты здесь, Сенсей!!"
20056-820 = "Я подготовила игровое поле,"
20056-830 = "так что садись!"
20056-840 = "Ты пришёл!"
20056-850 = "Ты ведь не будешь сдерживаться, да? ДА?!"
20056-860 = "Фу-фу, просто доверься мне."
20056-870 = "В конце концов, побеги — специализация Куросаки Коюки!"
20056-880 = "Кажется, столько всего произошло..."
20056-890 = "Ну, а пока..."
20056-900 = "давай веселить..."
20056-910 = "...ся всю... но...чь..."
20056-920 = "Хр-р-р..."
20056-930 = "Приятная на ощупь, правда? Эта пижама очень мягкая!"
20056-940 = "О, ты пришёл меня спасать, Сенсей!"
20056-950 = "Погоди, тебя тоже поймали?!"
20056-960 = "С этой настольной игрой что-то не так!"
20056-970 = "Она всегда взрывается, когда наступает мой ход!!"
20056-980 = "Шумная Комната самоанализа..."
20056-990 = "Ну, не так уж и плохо... Наверное?"
