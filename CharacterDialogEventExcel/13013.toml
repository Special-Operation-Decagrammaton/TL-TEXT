[translation]
13013-160 = "Добро пожаловать, Сенсей!"
13013-170 = "Хи-хи. Я ждала!"
13013-180 = "Привет, Сенсей!"
13013-190 = "Если я могу чем-нибудь помочь, просто скажи."
13013-200 = "Похоже, всё нарастает как снежный ком..."
13013-210 = "Но всё ведь будет хорошо, правда, Сенсей...?"
13013-220 = "Теперь уже поздно отступать."
13013-230 = "Фронт освобождения знаний идёт вперёд!"
13013-240 = "Как-то всё наконец закончилось... Я просто рада, что все целы."
13013-250 = "Да? Ты меня звал, Сенсей?"
13013-260 = "Интересно, что сейчас делает Мэру..."
13013-270 = "Надеюсь, она там нигде не сходит с ума..."
13013-280 = "Мне нравится читать не меньше, чем рассматривать картинки."
13013-290 = "Манга может многому нас научить."
13013-300 = "С-Сенсей? Если ты так на меня смотришь... мне становится неловко..."
13013-310 = "Что-то ищешь, Сенсей? Не спеши."
13013-320 = "Я привыкла расставлять и выкладывать вещи. Оставь это мне!"
13013-330 = "Осматривайся сколько хочешь."
13013-340 = "Не хотелось бы, чтобы ты взял не то."
13013-350 = "Управлять магазином...?"
13013-360 = "Это ничто по сравнению с управлением библиотекой."
13013-370 = "А что, если где-то здесь затесалось первое издание, давно снятое с печати...? Что же делать...?"
13013-380 = "О! Я-я не говорю, что забрала бы его себе...!"
13013-390 = "О, значит, ты выбрал это."
13013-400 = "Подожди минутку... Да, вот!"
13013-410 = "И... какая там реплика...?"
13013-420 = "«О! У вас отличный вкус!»"
13013-430 = "Огромное спасибо!"
13013-440 = "Я сейчас была такая профессиональная? Хи-хи..."
13013-450 = "Добро пожаловать, Сенсей. Что желаешь?"
13013-460 = "Пришёл испытать удачу?"
13013-470 = "Можно я посмотрю со стороны? Хи-хи."
13013-480 = "Что-то не так?"
13013-490 = "Да, Сенсей? Что случилось?"
13013-500 = "Немного удачи, только для тебя..."
13013-510 = "Я всегда хотела сказать что-нибудь такое!"
13013-520 = "Ого, ты выиграл! Потрясающе, Сенсей!"
13013-530 = "Сенсей, тебе действительно очень везёт! Это так здорово!"
13013-540 = "Можно посмотреть?"
13013-550 = "Хм-м... Это довольно хорошо!"
13013-560 = "А-а..."
13013-570 = "Н-не расстраивайся так. По крайней мере, у тебя есть я, Сенсей!"
