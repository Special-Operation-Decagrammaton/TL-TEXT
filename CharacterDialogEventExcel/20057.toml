[translation]
20057-980 = "Я ждала тебя, Сенсей."
20057-990 = "Позволь мне провести тебя по Миллениуму."
20057-1000 = "Если захочешь куда-нибудь сходить, просто скажи."
20057-1010 = "Хотя в Миллениуме всегда многолюдно..."
20057-1020 = "...сегодня всё вышло на совершенно новый уровень."
20057-1030 = "Хотя хорошо, что здесь так оживлённо."
20057-1040 = "Наконец-то всё закончилось."
20057-1050 = "И выставка, и вся эта суматоха."
20057-1060 = "Тебе понравилась выставка Миллениума?"
20057-1070 = "Для меня было честью провести с тобой время, Сенсей."
20057-1080 = "...Да, правда."
20057-1090 = "Вот так проводить с тобой время..."
20057-1100 = "...мне довольно нравится."
20057-1110 = "Скажи, если проголодаешься."
20057-1120 = "Я знаю хорошую столовую."
20057-1130 = "Если бы я была горничной, конечно, просто приготовила бы тебе еду..."
20057-1140 = "Но сейчас я всего лишь студент."
20057-1150 = "Ты произнёс моё имя, Сенсей?"
20057-1160 = "Позвал меня без особой причины?"
20057-1170 = "Фу-фу. Ох."
20057-1180 = "Фу-фу."
20057-1190 = "Я не особо боюсь щекотки."
20057-1200 = "Сенсей... А ты?"
