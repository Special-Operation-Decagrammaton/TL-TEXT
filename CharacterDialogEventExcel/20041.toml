[translation]
20041-280 = "Ты как раз вовремя."
20041-290 = "Верно. Я как раз ожидала, что ты придёшь примерно сейчас."
20041-300 = "Всё идёт хорошо, но расслабляться пока рано."
20041-310 = "Мы почти пришли."
20041-320 = "Скоро смогу рассказать."
20041-330 = "Всё хорошо, что хорошо кончается."
20041-340 = "...И я серьёзно."
20041-350 = "Хм? Что такое? Чего ты меня тыкаешь..."
20041-360 = "Трудно понять, если не сказать словами."
20041-370 = "Эм, ну... Эм..."
20041-380 = "Тебе что-нибудь нужно или... что-то такое?"
20041-800 = "Я упорядочила твой список дел."
20041-810 = "Добро пожаловать, Сенсей. Вот твой список дел на сегодня."
20041-820 = "Если ты продолжишь молча меня тыкать..."
20041-830 = "Для меня это совершенно бессмысленно."
20041-840 = "Ты случайно не хотел, чтобы я..."
20041-850 = "...сделала то же самое?"
20041-860 = "Поняла. Отмечу как выполненное."
20041-870 = "Я обновлю список «выполнено»."
20041-11460 = "Я была с тобой лишь часть пути..."
20041-11470 = "Но я надеюсь и дальше работать с тобой, Сенсей."
20041-11480 = "Ты пришёл как раз вовремя, Сенсей."
20041-11490 = "Какой рациональный выбор."
20041-11500 = "Так это база Химари..."
20041-11510 = "То есть НАША база."
20041-11520 = "До сих пор не могу в это поверить."
20041-11530 = "Я выполняю ту же миссию, что и ты."
20041-11540 = "Странно слышать такое от меня."
20041-11550 = "Но все относятся ко мне так непринуждённо..."
20041-11560 = "Не то чтобы мне это не нравилось..."
20041-11570 = "Кроме инженерии..."
20041-11580 = "Прости. Похоже, я пока мало в этом разбираюсь."
20041-11590 = "Ты звал, Сенсей? Просто хотел узнать, чем я занимаюсь?"
20041-11600 = "Постарайся поменьше совершать такие нерациональные поступки."
20041-11610 = "Эм... Не то чтобы мне это не нравилось..."
20041-11620 = "Когда-то я считала, что обязана знать всё."
20041-11630 = "Теперь... я понимаю, что мне ещё многому нужно научиться."
20041-11640 = "Как странно. Возможно, в каком-то смысле это тоже благодаря тебе."
20041-11650 = "Химари ввела меня в курс дела."
20041-11660 = "Если говорить проще, мы обнаружили загадочные вещества..."
20041-11670 = "...порождённые силой Безымянных богов."
20041-11680 = "И нам нужны образцы. Мы также считаем, что с их помощью можно пополнять запасы."
20041-11690 = "Ты здесь, Сенсей. Сколько образцов ты принёс?"
20041-11700 = "Спасибо за сотрудничество."
20041-11710 = "Я анализирую загадочные вещества. Скоро будут результаты."
20041-11720 = "В любом случае это устройство выделяет невероятное количество тепла..."
20041-11730 = "Эйми рядом с ним пришлось бы нелегко."
20041-11740 = "К тому, как работает это устройство, у меня претензий нет."
20041-11750 = "Неожиданно? Фу-фу. Даже я знаю, когда стоит пойти на компромисс."
20041-11760 = "Просто... если бы дизайн был немного..."
20041-11770 = "Ничего не изменится, даже если ты будешь говорить со мной."
20041-11780 = "А? Ты заметил, что выражение моего лица изменилось?"
20041-11790 = "...Понятно. Вот почему люди говорят, что иногда ты бываешь жесток..."
20041-11800 = "Вот результат этого анализа."
20041-11810 = "Добро пожаловать. Что бы ты хотел?"
20041-11820 = "Я просто пыталась подражать... Забудь, что только что произошло."
20041-11830 = "Говорят, раньше люди вот так обменивались вещами."
20041-11840 = "В каком-то смысле кажется, будто мы вернулись в прошлое."
20041-11850 = "Похоже на рациональный результат. Хороший выбор."
20041-11860 = "Результаты готовы. Я позволю тебе самому выбрать, Сенсей."
20041-11870 = "Здесь мы использовали немного другой метод анализа."
20041-11880 = "Если говорить проще, это извлечение, основанное на случайности."
20041-11890 = "С точки зрения статистики крайне вероятно, что что-то вроде лотереи закончится проигрышем."
20041-11900 = "...Однако, похоже, другого выбора у нас здесь нет."
20041-11910 = "Похоже, Химари всё ещё любит такие вещи."
20041-11920 = "Что ж... Наверное, хорошо иметь разные подходы."
20041-11930 = "То, что результаты анализа невозможно точно предсказать..."
20041-11940 = "...как член Семинара, я нахожу это немного прискорбным."
20041-11950 = "Если результат тебя не устроит..."
20041-11960 = "Прости, Сенсей. С этим я тоже ничего не могу поделать."
20041-11970 = "Хотя это и оказалось неверным..."
20041-11980 = "...в словах о том, что боги не играют в кости,"
20041-11990 = "есть нечто, что я могу понять."
20041-12000 = "Квантовая механика — не та область, которую можно просто «понять»."
20041-12010 = "Сначала ты... заучиваешь вещи, а уже потом идёшь дальше."
20041-12020 = "Мир — это нечто, лежащее за пределами нашего понимания."
20041-12030 = "...Верно. Как и этот анализ, полагающийся на удачу."
20041-12040 = "Это... правда сработало?"
20041-12050 = "Полагаю, это закон больших чисел."
20041-12060 = "Если не сорвал джекпот, продолжай, пока не сорвёшь..."
20041-12070 = "Нельзя сказать, что это совсем неверно, но..."
20041-12080 = "Говорят, большинство вещей в мире подчиняется нормальному распределению."
20041-12090 = "Поздравляю, Сенсей. Отличная работа."
