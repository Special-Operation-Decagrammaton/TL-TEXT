[translation]
10115-190 = "Ты любишь бейсбол, Сенсей?"
10115-200 = "Я? Обожаю!"
10115-210 = "Сегодняшний матч важен!"
10115-220 = "Хотя каждый матч важен!"
10115-230 = "Игра идёт не очень..."
10115-240 = "Мы ещё можем отыграться!"
10115-250 = "Говорят, настоящий бейсбол начинается в девятом иннинге при двух аутах!"
10115-260 = "Нужно быть готовым ухватиться за шанс, когда он появится!"
10115-270 = "До сих пор не могу в это поверить."
10115-280 = "Я выбила хоум-ран... Этот удар, эта траектория..."
10115-290 = "Бейсбол правда потрясающий!"
10115-300 = "Что такое, Сенсей? Есть вопросы по правилам бейсбола?"
10115-310 = "Я смотрела записи игр."
10115-320 = "Сейчас это легко, потому что всё собрано в интернете."
10115-330 = "Но раньше людям приходилось добывать ресурсы по одному."
10115-340 = "Н-не тыкай меня в бока..."
10115-350 = "Сенсей! И не в подмышки...!"
10115-360 = "Раз уж мы на матче и вокруг много людей..."
10115-370 = "...может, закажем что-нибудь поесть?"
10115-380 = "Еда на бейсбольном стадионе — настоящий деликатес!"
10115-390 = "Хотя цены... немного... Не будем об этом думать. Ага."
10115-530 = "На стадионе проводят розыгрыш!"
10115-540 = "Не знаю, как меня вообще втянули помогать им..."
10115-550 = "Добро пожаловать!"
10115-560 = "Хочешь испытать удачу?"
10115-570 = "Ну как, Сенсей? Я звучала профессионально?"
10115-580 = "Здравствуйте, Сенсей. Если у тебя остались лотерейные билеты, обязательно используй их все перед уходом!"
10115-590 = "Я помогаю только сегодня, но мне сказали, что заплатят за подработку!"
10115-600 = "Думаю, сначала поменяю перчатку."
10115-610 = "В бейсболе важны навыки, но удача тоже имеет значение."
10115-620 = "...Может, мне просто нужно больше удачи, чтобы выбить хоум-ран?"
10115-630 = "Первое место! Приз за первое место, Сенсей! Ого, потрясающе!"
10115-640 = "А это приз за второе место! Жаль, что не первое, но всё равно невероятно!"
10115-650 = "Счастливый приз."
10115-660 = "В каком-то смысле именно такой приз и есть суть розыгрыша, правда?"
10115-670 = "Поощрительный приз..."
10115-680 = "Ну и ладно. Это всё равно хорошо, да?"
10115-690 = "Приз за участие..."
10115-700 = "Не переживай, Сенсей! Говорят, главное — участие! Ага!"
10115-710 = "...Ладно, ничего не случилось! ...Правда ведь, Сенсей?"
10115-720 = "В таких ситуациях самое главное — стабильно выполнять свою работу!"
10115-730 = "Прямо как на тренировках!"
10115-740 = "Однообразная работа и правда довольно скучная..."
10115-750 = "...но и из неё можно многому научиться!"
10115-760 = "Говорят, великие спортсмены едят одно и то же, ложатся спать в одно и то же время..."
10115-770 = "...и каждый день придерживаются одних и тех же строгих требований к тренировкам..."
10115-780 = "Я... не уверена, что у меня хватило бы на это сил..."
10115-790 = "Ты снова заставляешь меня понять, насколько ты потрясающий."
10115-800 = "Каждый день отмечаться на работе... и тонуть в делах..."
10115-810 = "Что? Разве я сама не хожу в школу каждый день?"
10115-820 = "Но я слышала, что работа намного тяжелее школы, разве нет?"
10115-830 = "Это словно... плоды тренировок!"
10115-840 = "Поздравляю, Сенсей!"
10115-850 = "У тебя получилось, Сенсей!"
10115-860 = "Я тоже буду стараться. Пожалуйста, смотри за мной!"
10115-870 = "На сегодня всё по расписанию!"
10115-880 = "Ну-у-у, у тебя после этого будет немного свободного времени?"
