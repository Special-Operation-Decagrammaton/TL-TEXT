[translation]
26016-780 = "Man, this is\nreally tough!"
26016-790 = "Haha... it really is\ntough, isn't it..."
26016-800 = "I think experience is\nimportant for a reporter,\nbut still..."
26016-810 = "This is a bit much...!"
26016-820 = "There's nothing good\nthat comes from\nfighting, after all..."
26016-830 = "Ugh..."
26016-840 = "Oh! Captain Makoto,\nyou look so cool!\nYo-ho-ho!"
26016-850 = "The next issue of the\nWeekly Pandemonium\nis going to be thick!\nAhaha!"
26016-860 = "I'm a secretary, not\na novelist, but..."
26016-870 = "In the end, it just has\nto be a happy ending!"
26016-880 = "Well, we've managed to\nmake it work so far..."
26016-890 = "I want to take a photo\nof everyone smiling..."
26016-900 = "As the secretary, I'm\nrecording every bit of it!"
26016-910 = "Whether or not to believe\nthis story is up to\nthe readers!"