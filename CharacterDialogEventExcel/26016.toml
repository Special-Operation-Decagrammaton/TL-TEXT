[translation]
26016-780 = "Ого... Это полная катастрофа!"
26016-790 = "Ха-ха! Ха... Это действительно... полная катастрофа..."
26016-800 = "Репортёру нужен опыт, но..."
26016-810 = "Это уже слишком...!"
26016-820 = "Ничего хорошего в драках нет..."
26016-830 = "Ухх..."
26016-840 = "О...! Капитан Макото, как же круто вы выглядите! Йо-хо-хо!"
26016-850 = "Следующий «Еженедельник Пандемониума» будет очень, очень, очень толстым! А-ха-ха!"
26016-860 = "Я секретарь, а не писатель..."
26016-870 = "Но в конце концов главное, чтобы всё хорошо закончилось!"
26016-880 = "Ну, пока нам как-то удавалось выпутываться..."
26016-890 = "Хочу сфотографировать всех улыбающимися..."
26016-900 = "Я, как и положено секретарю, всё записываю!"
26016-910 = "А верить этому или нет, пусть решают читатели!"
