[translation]
10132-180 = "С-Сенсей...?! Э-Этот наряд странный, да...?"
10132-190 = "Т-Ты здесь, Сенсей..."
10132-200 = "Э-этот наряд, эм..."
10132-210 = "Ч-Что это...? Что сейчас вообще происходит...?"
10132-220 = "На сцене как-то странно."
10132-230 = "Уверена, внимания ко мне сейчас больше, чем когда-либо..."
10132-240 = "Но, как ни странно, немного одиноко..."
10132-250 = "Все...! Я вернулась...!"
10132-260 = "Я правда достойна такого наряда...?"
10132-270 = "Я-Я слишком выделяюсь, правда, Сенсей?"
10132-280 = "Ух, ниндзя не должна быть такой..."
10132-290 = "Я-Я-Я-Я красивая...?!"
10132-300 = "У-у-у..."
10132-310 = "Е-если считать..."
10132-320 = "...этот наряд разновидностью маскировки... Тогда, может, сработает..."
10132-590 = "Я-Я составила список заданий, которые нам нужно выполнить..."
10132-600 = "Эти задания непростые..."
10132-610 = "Но ты справишься, Сенсей!"
10132-620 = "Ч-что-то не так с тем, что я приготовила?"
10132-630 = "Что? Т-Таких заданий ведь не было..."
10132-640 = "Я-Я так и знала...!"
10132-650 = "Я знала, что у тебя получится, Сенсей!"
10132-660 = "Невероятно! Я так и знала! У тебя тоже есть талант ниндзя, Сенсей!"
10132-670 = "Х-Хорошая работа...! Это был невероятный финал!"
