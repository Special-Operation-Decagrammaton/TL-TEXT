[translation]
10106-150 = "А-а. А-а. А-а-а."
10106-160 = "А... С-Сенсей?!"
10106-170 = "Спасибо, что пришёл, Сенсей."
10106-180 = "С-Сакурако очень счастлива!"
10106-190 = "Мы уже на середине. М-м..."
10106-200 = "Говорят, весёлое время пролетает в мгновение ока..."
10106-210 = "Но и правда кажется, что всё закончилось слишком быстро."
10106-220 = "Хи-хи, у тебя остались сожаления?"
10106-230 = "Какое совпадение. ...Я чувствую то же самое."
10106-240 = "Хм? Что случилось?"
10106-250 = "Ах... Рукопожатие?"
10106-260 = "По сравнению с формой Сестёр, этот костюм, кажется, помог мне стать ближе ко всем."
10106-270 = "Хи-хи, хороший костюм."
10106-280 = "Эм... У тебя ко мне дело?"
10106-290 = "Если будешь звать меня снова и снова... я не знаю, как реагировать."
10106-300 = "Я тренировала свой коронный танцевальный приём."
10106-310 = "Х-хочешь посмотреть?"
10106-540 = "Я упорядочила твои задачи."
10106-550 = "Ты пришёл куда надо, Сенсей."
10106-560 = "Если подумать, Сенсей... Сейчас мы только вдвоём."
10106-570 = "А? Н-нет... Я просто про нынешнюю ситуацию..."
10106-580 = "Никакого более глубокого смысла... нет..."
10106-590 = "Мне идёт эта одежда...? Хи-хи, спасибо."
10106-600 = "Да, подтверждено."
10106-610 = "Отлично."
