[translation]
10089-10 = "Пора за работу, Сенсей."
10089-20 = "Как раз вовремя. Я хочу кое-что показать."
10089-30 = "А? Сенсей? Что случилось?"
10089-40 = "Т-тсс! Тише!"
10089-50 = "Они раскроют проникновение!"
10089-60 = "И-и?!"
10089-70 = "О... это всего лишь ты, Сенсей."
10089-80 = "Здесь слишком опасно... Давай поговорим снаружи."
10089-90 = "И-и?!"
10089-100 = "О... это всего лишь ты, Сенсей."
10089-110 = "Здесь слишком опасно... Давай поговорим снаружи."
10089-310 = "Ну что, соберём улики?"
10089-320 = "Сенсей, давай разберём документы."
10089-330 = "Не мог бы ты помочь?"
10089-340 = "Мне нужно узнать больше о цели."
10089-350 = "С-сосредоточься, Сенсей. Нет, не на мне! На документах!"
10089-360 = "А-а? Хочешь что-то сказать?"
10089-370 = "О. Так вот в чём дело."
10089-380 = "Я всё прекрасно понимаю."
10089-390 = "Как и ожидалось от делового партнёра, которого я присматриваю."
10089-400 = "Нужные сведения у нас есть... но давай копнём немного глубже. На всякий случай."
