[translation]
10032-230 = "Нашла тебя, Сенсей! Новый год, а ты ВСЁ ЕЩЁ работаешь?! Ха-ха-ха!"
10032-240 = "Ого, ого, ого! Я встречаю Сенсея прямо в начале нового года?!"
10032-250 = "Дай пять!"
10032-260 = "Ну что, Сенсей, с какой игрушкой сегодня поиграем?"
10032-270 = "Ханэцуки? Фукуварай? Дарума-отоси! Хи-хи-хи! ♪"
10032-280 = "Хм-м, мне уже немного надоели игрушки. Лучше поиграю с Сенсеем!"
10032-290 = "Ну как? Отличная идея, правда?"
10032-300 = "Хи-хи. Было весело! Тебе ведь тоже понравилось?"
10032-310 = "Надеюсь, весь этот год будет таким же весёлым!"
10032-320 = "Пора снова вытаскивать Ару из неприятностей! Хи-хи. Моё любимое занятие."
10032-330 = "Ни с того ни с сего появился вор пожертвований! Обожаю этот новогодний хаос!"
10032-340 = "Уф! Ненавижу ничего не делать. Мне ску-у-учно. Давай найдём себе развлечение, Сенсей!"
10032-350 = "Похоже, впереди ещё один хаотичный год!"
10032-360 = "Ару, Каёко и Харука все на тебя рассчитывают, Сенсей! Так что постарайся! ♪"
10032-370 = "А? Я? Ну, а ты как думаешь?"
10032-380 = "Хм-м-м? Скажи!"
10032-730 = "Добро пожаловать в специальный обменный центр Муцуки!"
10032-740 = "Привет, Сенсей! У тебя есть счастливый мешочек, да? Давай откроем!"
10032-750 = "Сенсей! Привет! Новогоднее событие закончилось, но..."
10032-760 = "Этого всё равно мало! Если остались счастливые мешочки, надо открыть их все!"
10032-770 = "Интересно, что внутри! *тук-тук* *тук-тук*"
10032-780 = "А? Почему я так на него смотрю?"
10032-790 = "Ну, потому что открывать счастливые мешочки всегда весело!"
10032-800 = "Ого! Не могу поверить, что это было внутри! Я в шоке! Завидую!"
10032-810 = "Я тоже такое хочу!"
10032-820 = "Да! Хорошая вещь, Сенсей!"
10032-830 = "Может, это всё благодаря мне! Можешь быть благодарен. Хи-хи-хи!"
10032-840 = "О, похоже, ты что-то выиграл! Хи-хи-хи. Ну, всё-таки это я выбрала для тебя."
10032-850 = "Считай это частичкой меня и береги, хорошо?"
