[translation]
20012-170 = "Ты пришёл, Сенсей."
20012-180 = "Если что-нибудь понадобится, пожалуйста, скажи."
20012-190 = "Какая суматоха. На всякий случай стоит подготовиться."
20012-200 = "Я осталась, потому что, похоже, потребуются последующие меры."
20012-210 = "Если что-нибудь понадобится, пожалуйста, скажи."
20012-220 = "На всякий случай уточню: я не являюсь наградой..."
20012-230 = "Прости, но правила есть правила. Я не могу просто взять и отдать саму себя."
20012-240 = "Неплохая мысль."
20012-250 = "Я согласна с этим решением."
20012-260 = "Сейчас подготовлюсь."
20012-270 = "Хорошо, подожди немного."
20012-280 = "Здравствуйте, Сенсей. Вот список задач. Удачи."
20012-290 = "Вот текущий прогресс работы. Пожалуйста, проверь."
20012-300 = "...Сенсей? Пожалуйста, сосредоточься на задаче."
20012-310 = "Прости, но я не могу сделать работу за тебя."
20012-320 = "Да, я проверила."
20012-330 = "Обработано."
