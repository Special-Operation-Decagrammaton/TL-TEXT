[translation]
10151-10 = "Red Winter's proud\nclass of scientists—"
10151-20 = "Welcome to\nClass 183 Special!"
10151-30 = "And I am Niki Anna,\nthe commissioner of\nClass 183 Special."
10151-40 = "Build a tank?\nThat's a piece\nof cake."
10151-50 = "Progress? P-Phew!\nOf course it's\ngoing smoothly!"
10151-60 = "Ugh..."
10151-70 = "Confidence?\nO-Of course\nI have it..."
10151-80 = "Yeah... Ahaha..."
10151-90 = "Sob... Sob..."
10151-100 = "Thank you... very much...!"
10151-110 = "Yes, I am that genius."
10151-120 = "The genuine article,\nright here."
10151-130 = "I-It's just...\nj-just a cold...!"
10151-140 = "Headpats...? Isn't\nit usually a handshake?"
10151-150 = "Most inventions in\nRed Winter were made\nby us."
10151-160 = "Well... Though\nthat wasn't my intent."
10151-170 = "Gradu... No, completing\nSpecial Class is drawing near."
10151-370 = "Shopping, huh. Since you usually buy things for me, it's been a while since I came out myself."
10151-380 = "Shopping...\nH-How do you do it again?"
10151-390 = "Isn't there a\n\"Going Out of Business Sale\"...?\nThe newspaper said there would be..."
10151-400 = "No way..."
10151-410 = "Um... There's something\nI want to buy, too..."
10151-420 = "I'd be happy if you\nhelped me look for it."
10151-430 = "Umm... About 100kg\nof GOST 5632..."
10151-440 = "Let me know if you find it."
10151-450 = "W-What's wrong?\nIt's not like I can\nbuy it for you, you know?"
10151-460 = "We don't even need a procurement contract. That's a huge help."
10151-470 = "If I work hard here...\nWould I get a pardon or something? Probably not."
10151-480 = "Brilliant judgment.\nJust like my own achievements."
10151-490 = "The calculations are flawless, too."
10151-610 = "Such a long list...\nThis really shows off my managerial skills."
10151-620 = "\"Reviewing the list\""
10151-630 = "Yes, it was written\non my to-do list, too."
10151-640 = "Let's finish the quota first. I'll sign later."
10151-650 = "Let's finish up quickly\nand take a break, Sensei."
10151-660 = "You can never have\ntoo much praise and reward."
10151-670 = "Sensei needs a reward, too.\nYes, naturally."
