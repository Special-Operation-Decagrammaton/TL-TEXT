[translation]
10151-862-10-1 = "The class of scientists that Red Winter prides itself on—"
10151-862-30-1 = "And I am Anna Niki, the committee chair of the 183rd Special Class."
10151-862-50-1 = "Progress? Y-yes! Of course, it's going smoothly!"
10151-862-60-1 = "Yes..."
10151-862-70-1 = "Confidence? O-of course I have it..."
10151-862-80-1 = "Yes... ahaha..."
10151-862-90-1 = "Ugh... ugh..."
10151-862-100-1 = "Thank you... so much...!"
10151-862-150-1 = "Most of the inventions in Red Winter were made by us."
10151-862-370-1 = "Shopping, yes. Since I usually have things bought for me, it's been a while since I've come myself."
10151-862-400-1 = "Ehh..."
10151-862-420-1 = "I would be happy if you could help me look for it."
10151-862-430-1 = "Um... about 100kg of GOST5632..."
10151-862-440-1 = "Please let me know if you find it."
10151-862-660-1 = "I don't mind having as much praise and reward as possible."
10151-862-670-1 = "Sensei needs a reward too. Yes, naturally."
10151-864-980-1 = "If I accomplish all of this... will you praise me?"
10151-864-990-1 = "Is there... something simple I can be praised for?"
10151-864-1000-1 = "Kyaa!?"
10151-864-1010-1 = "I-I'm not nervous!"
10151-864-1020-1 = "Were my shoulders stiff...? Perhaps it's because of the tension."
10151-864-1030-1 = "Let's accept it! Yes, it is a reward, after all."
10151-864-1040-1 = "Is there... no such thing as a certificate of receipt for the reward?"
