[translation]
10151-10 = "レッドウィンターが誇る\n科学者の学級――"
10151-20 = "Добро пожаловать в Спецотряд № 183!"
10151-30 = "そして、私が183号\n特別クラスの委員長、\n仁木アンナです。"
10151-40 = "Построить танк? Проще простого."
10151-50 = "進捗？え、ええ！\nもちろん、\n順調ですよ！"
10151-60 = "ええ……。"
10151-70 = "自信？\nも、もちろん\nありますとも……"
10151-80 = "ええ……あはは……。"
10151-90 = "うっ……うっ……"
10151-100 = "ありがとう……\nございました……っ！"
10151-110 = "Да, я и есть тот самый гений."
10151-120 = "А не подставное лицо в маске."
10151-130 = "Честно-честно... Я ПРАВДА это я...!"
10151-140 = "Погладить по голове...? А-а разве не нужно пожать руку?"
10151-150 = "レッドウィンターに\nおける発明のほとんどは\n私たちが行ったものです。"
10151-160 = "Ну... Не то чтобы по собственному желанию..."
10151-170 = "Кажется, скоро мы сбежи... то есть выпустимся из Спецотряда."
10151-370 = "ショッピング、ですね。\nいつも買ってきてもらっているので、\n自分で来たのは久しぶりです。"
10151-380 = "Покупки... К-как же это делается...?"
10151-390 = "А здесь бывает «распродажа перед закрытием»...? Я читала о таком в газете..."
10151-400 = "ええっ……。"
10151-410 = "Эм... Я тоже хочу кое-что купить..."
10151-420 = "一緒に探してくださると、\n嬉しいです。"
10151-430 = "えっと……GOST5632を\n100kgほど……"
10151-440 = "見つけたら、教えて下さいね。"
10151-450 = "Ч-что такое? Я ничего не могу вам купить..."
10151-460 = "Договор на закупку не нужен, спасибо."
10151-470 = "Если я буду здесь усердно работать, может, меня помилуют... Хотя вряд ли."
10151-480 = "Прекрасный выбор. Такой же прекрасный, как мои достижения."
10151-490 = "И расчёты безупречны."
10151-610 = "Столько списков... Пора показать, на что способен настоящий руководитель."
10151-620 = "«Проверь список»."
10151-630 = "Да, в списке это есть."
10151-640 = "Сначала выполним задачи. Автографы потом."
10151-650 = "Давайте закончим с этим, чтобы можно было отдохнуть, Сенсей."
10151-660 = "称賛と褒賞は、\nいくらあっても構いません。"
10151-670 = "先生にも報酬が必要です。\nええ、当然。"
10151-980 = "これ、全部達成したら……\n褒めていただけますか？"
10151-990 = "一番簡単で、褒められるもの……\nないでしょうか？"
10151-1000 = "きゃあっ！？"
10151-1010 = "き、緊張なんてしていません！"
10151-1020 = "肩凝っていましたか……？\n緊張のせいでしょうか。"
10151-1030 = "いただいてしまいましょう！\nええ、報酬ですもの。"
10151-1040 = "報酬の受け取り証明書的な\nものは……\nないのでしょうか？"
