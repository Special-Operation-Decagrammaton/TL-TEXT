[translation]
20028-120 = "А, я тебя ждала, Сенсей!"
20028-130 = "П-подготовка завершена."
20028-140 = "Скажи, если что-нибудь понадобится!"
20028-150 = "Ещё совсем немного! Держись!"
20028-160 = "Не сдавайся до самого конца...!"
20028-170 = "Уборку оставь мне. Хи-хи."
20028-180 = "Жарко... И солнце такое сильное..."
20028-190 = "Е-если хочешь, можешь взять мою шляпу."
20028-200 = "О? Сенсей? Что такое?"
20028-210 = "Э, эм... Сенсей? Если... тебе что-нибудь нужно, просто скажи..."
20028-220 = "Хи-хи! С-Сенсей! Щ-щекотно!"
20028-230 = "Хи! Ахаха!!"
20028-440 = "Ты ищешь какой-то конкретный предмет?"
20028-450 = "Осмотрись."
20028-460 = "Время ещё есть, может, посмотрим вместе?"
20028-470 = "С-Сенсей... Ха-ха! Я-я в порядке... Ха-ха-ха!"
20028-480 = "О? Ты хотел что-то сказать...?"
20028-490 = "Э-это здорово! Мне тоже нравится."
20028-500 = "Да! Вот!"
20028-510 = "Это... Думаю, это очень хорошо! Как и ожидалось, Сенсей!"
20028-520 = "Я рада, что ты нашёл то, что искал!"
