[translation]
10084-10 = "Уф. Мне всё ещё холодно даже под всеми этими слоями одежды."
10084-20 = "Я даже не заметила, что дрожу."
10084-30 = "Люди, которые выходят на улицу в такую погоду встречать Новый год, — образец неэффективности."
10084-40 = "Если я чего и не выношу, так это абсолютной тишины."
10084-50 = "Но с другой стороны, когда тихо..."
10084-60 = "Ну, чем тише, тем лучше я слышу голос Сенсея."
10084-70 = "Ветер... Будто плачет."
10084-80 = "Я отслеживаю связь на всех частотах в радиусе трёх километров..."
10084-90 = "...Хм. Ничего."
10084-100 = "Если я чего и не выношу, так это абсолютной тишины."
10084-110 = "Но с другой стороны, когда тихо..."
10084-120 = "Ну, чем тише, тем лучше я слышу голос Сенсея."
10084-130 = "Ветер... Будто плачет."
10084-140 = "Я отслеживаю связь на всех частотах в радиусе трёх километров..."
10084-150 = "...Хм. Ничего."
10084-590 = "С-Сенсей! Ты занят?"
10084-600 = "Поможешь мне разбить лагерь, пожалуйста?"
10084-610 = "Здравствуйте, Сенсей. Вице-президент дала мне очень точные инструкции по установке лагерного снаряжения. Я правда стараюсь..."
10084-620 = "Мне сказали, что этим лагерным снаряжением легко пользоваться..."
10084-630 = "Но установить его совсем не просто."
10084-640 = "Ты хотел что-то сказать...?"
10084-650 = "Подожди здесь. Я принесу записывающие устройства."
10084-660 = "Понятно. Я запомню."
10084-670 = "Можешь ещё раз показать, как ты это сделал?"
10084-680 = "Пожалуйста, объясни словами пошагово."
10084-690 = "С этим сегодня спать будет намного удобнее."
