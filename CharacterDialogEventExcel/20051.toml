[translation]
20051-180 = "Сенсей! Сюда, сюда!"
20051-190 = "Фу-фу, похоже, ты не смог угнаться за моей скоростью?"
20051-200 = "Супермагическая воительница отряда линчевателей!"
20051-210 = "Термит Пинк здесь!"
20051-220 = "Ого! Сколько гостей!"
20051-230 = "Фу-фу-фу... Кажется, пока никто не заметил..."
20051-240 = "...что такая обычная девочка, как я, на самом деле суперас отряда линчевателей..."
20051-250 = "...и волшебница!"
20051-260 = "Превращение закончилось..."
20051-270 = "...но магия — нет! Э-хе-хе!"
20051-280 = "Да! Термит Пинк на связи! Также известная как Удзава Рейса!"
20051-290 = "Фу-фу, я покажу тебе свою позу превращения..."
20051-300 = "Я тренировалась! Для начала..."
20051-310 = "Кья-а-а?!"
20051-320 = "К-Кажется, я только что встретилась взглядом с кем-то знакомым..."
20051-330 = "Это? Волшебная палочка Термит Пинк!"
20051-340 = "Официальная палочка немного дороговата..."
20051-350 = "Так что я украсила её тем, что нашлось дома!"
20051-360 = "Термит Пинк! Превращение!"
20051-370 = "А теперь! Идём защищать мир!"
20051-470 = "Вжух! Бам-бам!! Сверк!"
20051-480 = "Добро пожаловать в магазин магии!"
20051-490 = "Никаких наклеек «-50%», ясно?! Это не супермаркет!"
20051-500 = "Этот наряд не продаётся! Запасного у меня нет!"
20051-510 = "Мне нравится. Прямо как сувенирный магазин!"
20051-520 = "Обмен... Иными словами, заключение контракта!"
20051-530 = "Так вот оно какое, богатство взрослого...! Прямо как у героя!"
20051-540 = "Почему-то это похоже на магический предмет!"
20051-550 = "Значит, это магический шопинг!"
20051-680 = "Ого! Это же...! Та штука, которой вытягивают карты! Сто лет такую не видела!"
20051-690 = "Вставляешь медаль вот так! И дзынь! Клац! Готово!"
20051-700 = "У них всё ещё стоят такие автоматы!"
20051-710 = "Ну что, Сенсей! Давай крутанём!"
20051-720 = "Вставим все оставшиеся медали и крутанём!"
20051-730 = "Интересно, что выпадет! Я так взволнована!"
20051-740 = "Это место невероятное! Хотела бы я тут жить...!"
20051-750 = "А-а!! Разве это не ультраредкая?!"
20051-760 = "За всю жизнь мне такая выпадала лишь однажды. Это суперредкая карта!"
20051-770 = "О-о! Суперредкая карта! Такие трудно найти!"
20051-780 = "Золотая! Здорово! Блестит!"
20051-790 = "А, а..."
20051-800 = "Это пустышка! Я и сама такую впервые вижу!"
