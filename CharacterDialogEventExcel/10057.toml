[translation]
10057-10 = "Добро пожаловать, Сенсей. Ох... Ты работаешь даже в первый день Нового года? Не забывай иногда отдыхать."
10057-20 = "Ну что же, давай вместе выпьем чаю."
10057-30 = "Хи-хи. Рада видеть тебя в первый день Нового года."
10057-40 = "Разве ты не знаешь? Я всегда готова."
10057-50 = "Хи-хи-хи. Ты меня звал, Сенсей?"
10057-60 = "Пожалуйста, не щекочи меня так."
10057-70 = "Не знала, что ты любишь так дурачиться, Сенсей."
10057-80 = "Фурисодэ, конечно, может быть немного неудобным."
10057-90 = "Но для изысканной трапезы требуется соответствующий наряд."
10057-100 = "Чтобы создать совершенный вкус, нужна непоколебимая решимость."
10057-110 = "...Никто не сможет нас остановить. Хи-хи-хи."
10057-120 = "Обстоятельства немного сложные, но..."
10057-130 = "...мою страсть к изысканной кухне такое не остановит."
10057-140 = "Надеюсь, мы все постараемся."
10057-150 = "Я пробую еду, вкладывая всю свою страсть и искренность."
10057-160 = "Время идёт... а воспоминания тускнеют."
10057-170 = "Но пока мы с тобой помним... всё будет хорошо."
10057-180 = "Да, я уверена."
10057-630 = "Сенсей, ты тоже пришёл вытянуть омикудзи? Сюда."
10057-640 = "Хи-хи-хи. Не нужно так напрягаться."
10057-650 = "Хи-хи-хи... Я впервые делаю что-то подобное."
10057-660 = "Это даже весело."
10057-670 = "Нашёл то, что искал?"
10057-680 = "Хи-хи-хи... Возможно, всё ближе, чем тебе кажется."
10057-690 = "Иногда важно не спешить."
10057-700 = "Как небольшая гранита между блюдами полного курса."
10057-710 = "О, тебе выпало великое благословение! Тебе очень везёт, Сенсей! Как и ожидалось."
10057-720 = "Я подготовила особый подарок за великое благословение, Сенсей."
10057-730 = "Тебе выпало благословение. Значит, скоро придёт удача."
10057-740 = "Желаю тебе счастливого Нового года."
10057-750 = "...Тебе выпало скромное благословение. Вот твой приз."
10057-760 = "Малое благословение... Это не так уж плохо."
10057-770 = "Говорят, чтобы пришла большая удача, сначала нужно заняться мелочами."
10057-780 = "Будущее благословение означает, что удача, скорее всего, ждёт тебя впереди..."
10057-790 = "Это хороший знак. Ну что же, сюда."
10057-800 = "Всё нормально. Результат омикудзи показывает лишь твою нынешнюю удачу."
10057-810 = "Позже всё может обернуться к лучшему..."
10057-820 = "А? Ты одновременно рад и грустен, потому что я тебя утешила? Я-я не понимаю..."
10057-830 = "Сенсей, омикудзи всё ещё выдают. Не забудь вытянуть одно."
