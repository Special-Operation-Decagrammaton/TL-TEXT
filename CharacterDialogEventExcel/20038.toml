[translation]
20038-200 = "大規模交流会は、\nレッドウィンター\n事務局としても\n初の試みです。"
20038-210 = "私もとっても楽しみです。"
20038-220 = "先生、チーパオ姿の\nチェリノちゃんには\nもう会いました？"
20038-230 = "ふふっ、とっても\n可愛いと思いませんか？"
20038-240 = "あ…私も似合ってる、\nですか？"
20038-250 = "…それは、ありがとう\nございます。"
20038-260 = "山海経の公園は\n広くてきれいですね。"
20038-270 = "街頭演説に\nぴったりです。"
20038-280 = "Даже для Офиса Красной Зимы встреча такого масштаба — впервые."
20038-290 = "Я тоже взволнована."
20038-300 = "Сенсей, ты видел Черино в ципао?"
20038-310 = "Хе-хе, разве она не очаровательна?"
20038-320 = "О... Я тоже хорошо выгляжу?"
20038-330 = "...Спасибо."
20038-340 = "(Тёмный монарх Шаньхайцзин... Она гораздо сильнее, чем я думала.)"
20038-350 = "(Нельзя просто думать, что она милая, хе-хе.)"
20038-360 = "Я думала, что уже привыкла к государственным переворотам..."
20038-370 = "Но столкнуться с ним в другой академии..."
20038-380 = "...странное ощущение."
20038-390 = "Это была замечательная встреча по обмену."
20038-400 = "В следующий раз нужно принять их в Красной Зиме! Хи-хи."
20038-410 = "Парки в Шаньхайцзин такие большие и чистые."
20038-420 = "Идеальны для уличных речей!"
20038-430 = "Если здесь восхвалять величие президента Черино..."
20038-440 = "...это может превратиться в дипломатический инцидент, да?"
20038-450 = "То, что меняется, и то, что не меняется..."
20038-460 = "Трудно выбрать."
20038-470 = "Но то, что Академия Красной Зимы меняется каждый день, — уже проблема."
20038-480 = "Президент Руми дала мне чайные листья для сна."
20038-490 = "Сегодня вечером я сделаю из них молочный чай для Черино."
20038-500 = "Какое-то Общество восточной алхимии работает над лекарством, которое омолаживает?"
20038-510 = "Это... нужно записать."
20038-620 = "В честь встречи по обмену мы проводим событие с обменными билетами!"
20038-630 = "Если у тебя есть кукла Мадам, здесь её можно обменять на приз!"
20038-640 = "Обменное событие всё ещё продолжается."
20038-650 = "Не забудь обменять вещи до его окончания."
20038-660 = "Эту куклу придумала я."
20038-670 = "Весь мой опыт изготовления кукол президента Черино пригодился."
20038-680 = "Их сделали для обменных билетов, но..."
20038-690 = "...столько студентов захотели оставить их себе. Нам было трудно вернуть их."
20038-700 = "Думаешь, проблема была в призах?"
20038-710 = "Поздравляю! Ты победил!"
20038-720 = "Ты победил! Тебе везёт, Сенсей."
20038-730 = "Это... первое место! Конечно же, ты выиграл, Сенсей."
20038-740 = "Ох, так много..."
20038-750 = "Я сразу принесу. Подожди минутку, пожалуйста."
20038-760 = "Добро пожаловать, Сенсей. Я как раз разбирала расписание встречи по обмену."
20038-770 = "Нужно многое учесть, ведь здесь будут студенты обеих школ."
20038-780 = "Да. Чем могу помочь?"
20038-790 = "Нет. Пока сосредоточься на работе, пожалуйста."
20038-800 = "Потрясающая работа. Будь это Красная Зима, я бы вручила тебе медаль..."
20038-810 = "Спасибо за сотрудничество."
