20038-900839-200-1 = "This large-scale exchange event is a first for the Red Winter administration office as well."
20038-900839-210-1 = "I'm very much looking forward to it, too."
20038-900839-220-1 = "Sensei, have you met Cherino-chan in her qipao yet?"
20038-900839-230-1 = "Hehe, don't you think she looks absolutely adorable?"
20038-900839-240-1 = "Oh... you think it suits me, too?"
20038-900839-250-1 = "...Well, thank you very much."
20038-900839-260-1 = "The park in Shanhaijing is so spacious and beautiful."
20038-900839-270-1 = "It's perfect for street speeches."
20038-900839-280-1 = "Though, talking about President Cherino's greatness here..."
20038-900839-290-1 = "Would probably turn into a diplomatic incident, wouldn't it...?"
20038-900839-300-1 = "Things that change, and things that remain the same."
20038-900839-310-1 = "...It's difficult to choose between them."
20038-900839-320-1 = "...Though Red Winter Federal Academy seems to be nothing but change."
20038-900839-330-1 = "A little while ago, President Lumi gave me some tea leaves with sleep-inducing properties."
20038-900839-340-1 = "I'm thinking of brewing some milk tea for Cherino-chan with them tonight."
