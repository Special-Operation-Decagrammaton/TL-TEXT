[translation]
10142-810 = "Сенсей, продолжишь наблюдать за нами, пока мы стараемся изо всех сил?"
10142-820 = "Фу-фу, я покажу всем, на что способна моя правая рука."
10142-830 = "Наше время ещё не вышло. Нужно взять себя в руки и двигаться дальше."
10142-840 = "Наше последнее усилие."
10142-850 = "Выложитесь по полной, все."
10142-860 = "Сенсей, спасибо тебе за всё, что ты сделал."
10142-870 = "Давай повторим это в следующий раз."
10142-880 = "Так вот что называют «фестивальной лихорадкой»?"
10142-890 = "Моё сердце колотится."
10142-900 = "Солнце палит нещадно... Нужно как следует защититься от ультрафиолета."
10142-910 = "Загар — это просто обожжённая кожа."
10142-920 = "Я... у тебя на уме?"
10142-930 = "Прошу прощения. Я слишком выделяюсь."
10142-940 = "Куриные шашлычки с фестивалей — особенные."
10142-950 = "Ты ведь тоже так думаешь, Сенсей?"
