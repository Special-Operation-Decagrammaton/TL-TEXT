[translation]
10152-500 = "Welcome. To a wonderland\nof dreams and hopes."
10152-510 = "Heh, I am honored to be\nthe one to guide you, Sensei."
10152-520 = "May everyone's hard work\nbear fruit."
10152-530 = "It is almost time...\nfor the ending."
10152-540 = "The feast is\nprepared."
10152-550 = "I hope it was a melody\nthat will remain in your soul,\nSensei."
10152-560 = "Would you like to try\ncorpse paint as well,\nSensei?"
10152-570 = "Leave it to me.\nI'll make you look\nwonderful, won't I?"
10152-580 = "...Perhaps I should have\nwelcomed you in a\nbunny girl outfit instead?"
10152-590 = "My guitar\nsings of peace."
10152-600 = "……Yes,\nI am not lying."
10152-610 = "Heh.\nThe resonance of souls felt\nduring a session is wonderful, but..."
10152-620 = "I would like to cherish\nthe touch of our fingertips\nas well."
