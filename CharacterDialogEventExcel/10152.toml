[translation]
10152-500 = "Добро пожаловать. В страну чудес мечт и надежд."
10152-510 = "Хе-хе, для меня большая честь, что вы мой Сенсей."
10152-520 = "Пусть ваши старания принесут плоды."
10152-530 = "Скоро настанет время... финала."
10152-540 = "Пир готов."
10152-550 = "Я рада, если эта мелодия запомнилась вам, Сенсей."
10152-560 = "Почему бы вам не попробовать делать наброски, Сенсей?"
10152-570 = "Оставь это мне. Я сделаю так, чтобы это выглядело великолепно."
10152-580 = "...Может, мне стоило поприветствовать вас в костюме девочки-зайки?"
10152-590 = "Моя гитара поёт о мире."
10152-600 = "...Да, я не лгу."
10152-610 = "Хе-хе. Резонанс душ, который мы чувствуем во время игры, прекрасен, но..."
10152-620 = "Я хочу также ценить прикосновение наших кончиков пальцев."
