[translation]
10152-849-500-1 = "Welcome. To a wonderland\nof dreams and hopes."
10152-849-510-1 = "Heh, it is an honor to be\nthe one to guide you, Sensei."
10152-849-520-1 = "May everyone's hard work\nbear fruit."
10152-849-530-1 = "It is almost time...\nfor the ending."
10152-849-540-1 = "The feast is\nprepared."
10152-849-550-1 = "I hope this melody\nremains in your soul,\nSensei."
10152-849-560-1 = "Would you like to try\ncorpse paint as well,\nSensei?"
10152-849-570-1 = "Leave it to me.\nI'll make you look\nwonderful."
10152-849-580-1 = "...Perhaps I should have\nwelcomed you in a\nbunny girl outfit instead?"
10152-849-590-1 = "My guitar sings\nof peace."
10152-849-600-1 = "……Yes,\nI am not lying."
10152-849-610-1 = "Heh.\nThe resonance of souls felt\nduring a session is wonderful, but..."
10152-849-620-1 = "I would like to cherish\nthe touch of our\nfingertips as well."
