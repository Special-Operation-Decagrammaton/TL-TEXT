[translation]
20063-140 = "Добро пожаловать на Кубок Геенны, Сенсей."
20063-150 = "Я хочу создать драгоценные воспоминания. Для этого безопасность превыше всего."
20063-160 = "Мне нужно следовать примеру всех."
20063-170 = "В воздухе витает запах бензина и пороха... Это захватывающе."
20063-180 = "Все стараются изо всех сил, а потом мы возвращаемся к нашей повседневной жизни."
20063-190 = "Мне нравится такое."
20063-200 = "Жарко? Поделимся зонтиком?"
20063-210 = "Мне нравится, когда меня гладят, но... здесь сейчас много людей, так что, может быть, позже..."
20063-220 = "Надеюсь, у нас будет много разных впечатлений вместе."
20063-230 = "Интересно, смогу ли я завести много друзей."
20063-560 = "Начало миссии."
20063-570 = "Давайте сначала займёмся самым важным."
20063-580 = "Что случилось, Сенсей? Может быть, вы хотите сфотографироваться вместе?"
20063-590 = "Кажется, этого не было в списке миссий."
20063-600 = "Сенсей, ваши инструкции и цели ясны, поэтому с вами очень легко работать."
20063-610 = "Это заслуженная награда. Свидетельство вашей усердной работы, Сенсей."
20063-620 = "Да, удовлетворительный результат."
20063-820 = "Мне всегда в радость практические тренировки."
20063-830 = "Помимо завоевания и победы есть множество других целей."
20063-840 = "Достойный соперник. С нетерпением жду."
20063-850 = "Мне кажется, мышечная масса немного уменьшилась. Нужно больше тренироваться."
20063-860 = "Хм, что случилось? Если вам что-нибудь понадобится, просто позвоните мне по рации в любое время."
20063-870 = "Приятно, что удалось помочь."
20063-880 = "Интересно? Смогу ли я вообще отплатить своему Сенсею?"