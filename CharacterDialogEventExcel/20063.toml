[translation]
20063-864-140-1 = "Welcome to the Gehenna Cup, Sensei."
20063-864-150-1 = "I want to make precious memories. To do that, safety comes first."
20063-864-160-1 = "I need to follow everyone's example, too."
20063-864-170-1 = "The smell of gasoline and gunpowder is filling the air... It's exciting."
20063-864-180-1 = "Everyone is giving their best, and then returning to their daily lives."
20063-864-190-1 = "I like things like this."
20063-864-200-1 = "Are you hot? Do you want to share this parasol?"
20063-864-210-1 = "I like being petted, but... there are too many people around right now, so maybe later..."
20063-864-220-1 = "I hope I can have all sorts of experiences with everyone."
20063-864-230-1 = "I wonder if I'll be able to make a lot of friends."
20063-864-560-1 = "Mission start."
20063-864-570-1 = "Let's clear the highest priority items first."
20063-864-580-1 = "What's wrong, Sensei? By any chance, do you want to take a picture together?"
20063-864-590-1 = "I don't think that was on the mission list."
20063-864-600-1 = "Sensei, your instructions and goals are clear, so it's very easy to work with you."
20063-864-610-1 = "It's a well-deserved reward. It's the fruit of your hard work, Sensei."
20063-864-620-1 = "Yes, I'm satisfied with the results."
20063-864-820-1 = "I always welcome practical training."
20063-864-830-1 = "Aside from suppression and winning, there's a mountain of other goals, isn't there?"
20063-864-840-1 = "They're a worthy opponent. I'm looking forward to it."
20063-864-850-1 = "I feel like I've lost a bit of muscle lately. I need to train more."
20063-864-860-1 = "Hm, what is it? If you need something, you can just call me on the radio anytime."
20063-864-870-1 = "I'm happy to be of help, too."
20063-864-880-1 = "What do you think? Have I been able to give back to you at least a little, Sensei?"
