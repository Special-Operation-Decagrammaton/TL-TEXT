[translation]
20063-140 = "Welcome to the\nGehenna Cup, Sensei."
20063-150 = "I want to make precious\nmemories. For that reason,\nsafety comes first."
20063-160 = "I need to follow\neveryone's example, too."
20063-170 = "The air is filled with the\nsmell of gasoline and\ngunpowder... I'm getting\nso excited."
20063-180 = "Everyone gives it their all,\nthen goes back to\ntheir daily lives."
20063-190 = "I really like that kind of thing."
20063-200 = "Are you hot?\nDo you want to share my parasol?"
20063-210 = "I do like being\nheadpats... but there are\ntoo many people right now,\nso maybe later..."
20063-220 = "I hope I can have\nall sorts of experiences\nwith everyone."
20063-230 = "I wonder if I'll be able\nto make lots of friends."
20063-560 = "Mission start."
20063-570 = "Let's clear out the highest priority items first."
20063-580 = "What's wrong, Sensei?\nCould it be that you want\nto take a picture together?"
20063-590 = "I don't think that was\non the mission list, though."
20063-600 = "Sensei, your instructions and goals are so clear, it makes things very easy."
20063-610 = "A well-deserved reward.\nIt's the fruit of Sensei's hard work."
20063-620 = "Yeah, I'm satisfied with this result."
20063-820 = "Practical training\nis always welcome."
20063-830 = "Aside from suppression and winning, there's a mountain of other goals to tackle."
20063-840 = "More than a match for us.\nI'm looking forward to this."
20063-850 = "Lately, I feel like I've lost\na bit of muscle.\nI need to train more."
20063-860 = "Hm, what is it?\nIf you need something, you can\njust call me on the radio anytime."
20063-870 = "I'm glad I could be of help, too."
20063-880 = "How is that?\nHave I paid Sensei back even just a little?"
