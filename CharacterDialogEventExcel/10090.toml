[translation]
10090-130 = "(Н-не паникуй. Не паникуй!)"
10090-140 = "Сенсей! Все! Добро пожаловать в Хяккияко!"
10090-150 = "Пусть вы уедете из Хяккияко с множеством дорогих воспоминаний!"
10090-160 = "Сатохама Умика на связи. Я выложусь по полной!"
10090-170 = "Я ведь неплохо справилась, да?"
10090-180 = "Ну как я? Хорошо справилась?"
10090-190 = "Ого... Спасибо за это. Я правда очень благодарна..."
10090-200 = "Конечно... Если превратить всё в фестиваль—!"
10090-210 = "А? Я сейчас прозвучала как какая-то фестивальная маньячка? С чего?"
10090-220 = "О, погоди. Фестивальная маньячка... Можно использовать как вдохновение..."
10090-230 = "Если работать вместе, нам нечего бояться!"
10090-240 = "По крайней мере, так говорят. А когда речь о подготовке, ВСЕ обязаны работать вместе."
10090-250 = "Только так мы успеем закончить до срока."
10090-260 = "Пожалуйста, приезжай ещё... в Хяккияко."
10090-270 = "В следующий раз я покажу тебе по-настоящему грандиозный фестиваль!"
10090-280 = "О, Сенсей! Огромное спасибо, что остался с нами до конца."
10090-290 = "Я так благодарна, что ты здесь!"
10090-300 = "Ну как я? Хорошо справилась?"
10090-310 = "Ого... Спасибо за это. Я правда очень благодарна..."
10090-320 = "Конечно... Если превратить всё в фестиваль—!"
10090-330 = "А? Я сейчас прозвучала как какая-то фестивальная маньячка? С чего?"
10090-340 = "О, погоди. Фестивальная маньячка... Можно использовать как вдохновение..."
10090-350 = "Если работать вместе, нам нечего бояться!"
10090-360 = "По крайней мере, так говорят. А когда речь о подготовке, ВСЕ обязаны работать вместе."
10090-370 = "Только так мы успеем закончить до срока."
10090-380 = "Пожалуйста, приезжай ещё... в Хяккияко."
10090-390 = "В следующий раз я покажу тебе по-настоящему грандиозный фестиваль!"
10090-530 = "А, Сенсей!"
10090-540 = "Хи-хи-хи. Верно. Это специальный магазин экскурсии."
10090-550 = "Осматривайся сколько хочешь!"
10090-560 = "Что-нибудь приглянулось?"
10090-570 = "Или тебе что-то нужно?"
10090-580 = "Что бы ни было, просто скажи!"
10090-590 = "Магазин экскурсии теперь закрыт..."
10090-600 = "Но фестиваль Хяккияко только начинается!"
10090-610 = "А? Да, всё нормально. Распределение, учёт, продажи — со всем справлюсь."
10090-620 = "Видишь ли, я управляла Момоёдо вместе с боссом."
10090-630 = "Так что эти навыки как-то сами пришли."
10090-640 = "Работа несложная. Я уже привыкла."
10090-650 = "В любом случае, очень приятно, что ты здесь, Сенсей. Хи-хи-хи."
10090-660 = "Хочешь это? Спасибо!"
10090-670 = "Да, отличный выбор!"
10090-680 = "Ого! Я тоже это хотела!"
10090-690 = "Спасибо за покупку. Хи-хи-хи."
