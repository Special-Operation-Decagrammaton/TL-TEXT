[translation]
10097-10 = "Сегодняшняя миссия — проникновение и разведка... Надеюсь, проблем не возникнет."
10097-20 = "RABBIT 1, подготовка завершена. Сенсей, ваши приказы."
10097-30 = "Когда я в последний раз ела сэндвич с креветками...?"
10097-40 = "(Не стоит выглядеть слишком взволнованной...)"
10097-50 = "Я договорилась на время нашего отсутствия."
10097-60 = "Студенты Бюро общественной безопасности Валькирии будут присматривать за Бун-Бун, пока нас нет."
10097-70 = "Признаюсь, иногда я немного ревную..."
10097-80 = "Просто... иногда кажется, что Бун-Бун любит студентов Бюро общественной безопасности больше, чем нас."
10097-90 = "Первая выездная миссия отряда RABBIT... Я начинаю волноваться."
10097-100 = "Это шанс SRT показать, на что мы способны!"
10097-110 = "RABBIT 2, подготовка завершена! Можем входить в любой момент!"
10097-120 = "Ну, я попыталась одеться как обычный турист..."
10097-130 = "Я ведь не выгляжу подозрительно... правда?"
10097-140 = "Эй... Сенсей, у меня что-то на животе?"
10097-150 = "Я лично не очень люблю морепродукты. Их слишком сложно хранить."
10097-160 = "А вот сушёные морепродукты люблю, например сушёного кальмара!"
10097-170 = "И-и... Это прямо как рыбацкая деревня из с-страшной истории..."
10097-180 = "Я-я просто х-хочу вернуться в ш-школу..."
10097-190 = "О, п-погоди... У меня ведь нет школы, к-которой можно вернуться..."
10097-200 = "В-вы случайно меня звали...?"
10097-210 = "(Как мы вообще оказались в такой глухой деревне...?)"
10097-220 = "Мияко заплела мне волосы п-перед этой миссией."
10097-230 = "Хи-хи... Это может быть мило..."
10097-240 = "Воробьи, ласки, чайки..."
10097-250 = "П-почему ко мне постоянно п-приходят дикие животные...?"
10097-260 = "Это деревня Ятоура, известная как родина креветок..."
10097-270 = "Я впервые здесь лично."
10097-280 = "Что именно происходит в этой деревне?"
10097-290 = "Это из-за тумана...?"
10097-300 = "Хоть сейчас и лето, здесь немного прохладно..."
10097-310 = "Хм, сто процентов. Откуда-то пахнет гибелью..."
10097-320 = "Хоть это и операция SRT..."
10097-330 = "...приятно и свежо находиться летом у моря."
10097-340 = "Думаешь, этот круг выглядит подозрительно?"
10097-350 = "Ну, это не обычный круг для игр в воде. Хи-хи..."
