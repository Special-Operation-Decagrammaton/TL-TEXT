[translation]
10109-240 = "Здравствуйте, Сенсей. Не ожидала встретить тебя так поздно ночью."
10109-250 = "Ты слишком давно не появлялся в Миллениуме."
10109-260 = "Добрый вечер, Сенсей. Фуфу, этот наряд?"
10109-270 = "Я готовилась к пижамной вечеринке с другими членами Семинара."
10109-280 = "Ты что-то скрываешь, Сенсей?"
10109-290 = "(смо-о-отрит)"
10109-300 = "Хи-хи, всё идёт веселее, чем я ожидала."
10109-310 = "Отличная работа, Сенсей."
10109-320 = "Если ты ещё не слишком устал, не мог бы провести с нами ещё немного времени?"
10109-330 = "...Зимние ночи бывают очень длинными."
10109-340 = "Бродить по кампусу в пижамах поздней ночью..."
10109-350 = "...заставляет сердце колотиться, будто я делаю что-то плохое."
10109-360 = "Я знаю большинство правил настольных игр, но..."
10109-370 = "...самого опыта игры у меня не так уж много."
10109-380 = "Что бы она ни говорила, Юка выглядит очень взволнованной."
10109-390 = "Давно не видела Юку настолько увлечённой."
10109-400 = "(Было бы здорово, если бы президент Рио тоже пришла на вечеринку...)"
10109-560 = "А, Сенсей. Я как раз разбирала настольные игры для вечеринки."
10109-570 = "Поможешь мне разложить настольные игры?"
10109-580 = "...Бардак больше, чем я ожидала."
10109-590 = "Вечеринка закончилась, но..."
10109-600 = "...если какая-нибудь настольная игра тебя заинтересует, скажи."
10109-610 = "Уже поздновато, но..."
10109-620 = "...если хочешь, я могу остаться и поиграть ещё немного."
10109-630 = "Здесь довольно много разных настольных игр."
10109-640 = "Серьёзно... Я же сказала всем убрать за собой."
10109-650 = "А, так оно было там."
10109-660 = "Неужели этот дизайн...?"
10109-670 = "Ох, какая интересная настольная игра."
10109-680 = "Интересно, как в неё играть."
10109-690 = "Да, продолжаем уборку."
10109-700 = "О, Сенсей. Если не возражаешь..."
10109-710 = "...не мог бы помочь с подготовкой к вечеринке?"
10109-720 = "Мы распределяли, кто какую роль возьмёт на пижамной вечеринке."
10109-730 = "Да, пожалуйста, расскажи."
10109-740 = "С собранными волосами удобнее, но затылку немного прохладно..."
10109-750 = "...Это было три раза. Ты ведь смотрел?"
10109-760 = "Хи-хи, хорошая идея."
10109-770 = "Как и ожидалось от тебя. Я это запишу."
