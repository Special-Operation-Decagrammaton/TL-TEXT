[translation]
10027-70 = "Подготовка завершена. Выдвигаемся, Сенсей."
10027-80 = "Пора на задание?"
10027-90 = "Не беспокойся. Я всегда наготове."
10027-100 = "Хм? У тебя был вопрос по заданию?"
10027-110 = "Операция скоро начнётся. Обсудим потом."
10027-120 = "Я готова в любой момент."
10027-130 = "...Хм? Ты звал меня, Сенсей?"
10027-140 = "Конец приближается."
10027-150 = "С моей стороны всё готово. Оставь это мне."
10027-160 = "Нужно хорошо закончить."
10027-170 = "Я помогу, Сенсей."
10027-180 = "А? Что такое? Это связано с миссией?"
10027-190 = "Уже пора выдвигаться, так что поговорим об этом позже."
10027-200 = "Дай знать, когда будем готовы идти. Я могу выдвинуться сразу."
10027-210 = "...А? Ты звал меня, Сенсей?"
10027-340 = "Вот результаты задания."
10027-350 = "Проверим содержимое?"
10027-360 = "Здесь нужна эффективность. Вот бы я хорошо разбиралась в математике..."
10027-370 = "Смотри, Сенсей. Мы ещё не опоздали."
10027-380 = "Погоди, ты хочешь, чтобы я это посчитала?"
10027-390 = "Н-но я же говорила, что плохо знаю математику!"
10027-400 = "Я-я не могу решить такое..."
10027-410 = "Отличный выбор."
10027-420 = "Значит, ты выбираешь это. Теперь понятно."
10027-430 = "Да, согласна."
10027-440 = "Я знала, что на тебя можно рассчитывать."
