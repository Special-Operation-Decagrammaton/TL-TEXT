[translation]
10113-10 = "Добро пожаловать в Геенну, Сенсей."
10113-20 = "Надеюсь, твоё пребывание здесь будет безопасным."
10113-30 = "..."
10113-40 = "Я серьёзно."
10113-50 = "Ты пришёл, Сенсей."
10113-60 = "Сегодня я не на дежурстве,"
10113-70 = "но бдительности не потеряю."
10113-80 = "Какой интересный труп..."
10113-90 = "Прошу прощения."
10113-100 = "Нелепо, но очень интересно..."
10113-110 = "И за это прошу прощения."
10113-120 = "...Похоже, СРОЧНЫЙ СЛУЧАЙ."
10113-130 = "Если рассуждать рационально, я должна надеяться, что всё поскорее уляжется."
10113-140 = "..."
10113-150 = "Но прежде мне хотелось бы ещё немного это понаблюдать."
10113-160 = "Это была шутка. Правда."
10113-170 = "Экстренная ситуация завершена."
10113-180 = "Хорошая работа, Сенсей."
10113-190 = "Даже в выходной у Клуба экстренной медицинской помощи обязанности не меняются."
10113-200 = "Это моя академия, место, где постоянно что-то происходит."
10113-210 = "...В целом мне здесь довольно приятно."
10113-220 = "Мне идёт эта одежда?"
10113-230 = "Хм? Не привык слышать от меня такое?"
10113-240 = "Я просто прочитала это в журнале, который мне кто-то посоветовал."
10113-250 = "Но если я заставила тебя что-то почувствовать, я рада."
10113-260 = "Если в следующий выходной собираешься посетить Геенну,"
10113-270 = "...буду благодарна, если сначала свяжешься со мной."
10113-280 = "Так будет безопаснее всего."
10113-600 = "Здравствуйте, Сенсей. Это Химуро Сэна."
10113-610 = "Если говорить о непредсказуемости,"
10113-620 = "здесь почти чрезвычайное положение."
10113-630 = "Добро пожаловать, Сенсей."
10113-640 = "Надеюсь, удача и здоровье всегда будут с тобой."
10113-650 = "Что-нибудь ещё?"
10113-660 = "Я буду поддерживать тебя до конца."
10113-670 = "Ты любишь совпадения, Сенсей?"
10113-680 = "Мне они скорее нравятся."
10113-690 = "Говорят, лучше подготовиться к неудаче, чем надеяться на удачу."
10113-700 = "Профилактика важна и в экстренной медицине."
10113-710 = "Предоставьте это мне."
10113-720 = "Поздравляю, Сенсей."
10113-730 = "Выглядит интересно."
10113-740 = "Понятно, значит, вот приз."
10113-750 = "Можно посмотреть? Мне любопытно."
10113-760 = "Невероятно, Сенсей."
10113-770 = "Спасибо за всю твою тяжёлую работу."
