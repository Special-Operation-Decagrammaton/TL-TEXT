[translation]
16020-200 = "Значит, задание наконец начинается..."
16020-210 = "Я уже завелась!"
16020-220 = "Я ждала тебя. Без тебя мы не можем начать задание, Сенсей."
16020-230 = "Операция «Охота за легендами»..."
16020-240 = "А «легенду» вообще можно выследить?"
16020-250 = "Хм? Ты меня звал?"
16020-260 = "Инари-дзуси Нико всегда такие вкусные."
16020-270 = "Я переживаю за Юкино..."
16020-280 = "Интересно, она всё ещё цепляется за свои сожаления..."
16020-400 = "А, Сенсей. Как раз вовремя."
16020-410 = "У меня есть список происшествий, о которых я хотела тебя спросить."
