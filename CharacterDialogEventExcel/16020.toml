[translation]
16020-863-200-1 = "So, the operation is finally starting..."
16020-863-210-1 = "Let's get pumped up!"
16020-863-220-1 = "I've been waiting. It wouldn't start without you, Sensei."
16020-863-230-1 = "The 'Roa Tracking Operation,' huh..."
16020-863-240-1 = "To begin with, is a Roa even something you can track with your eyes?"
16020-863-250-1 = "Hm? What's wrong?"
16020-863-260-1 = "Niko's inari sushi is exquisite, isn't it? It's delicious every time I eat it."
16020-863-270-1 = "I wonder if Yukino is doing okay..."
16020-863-280-1 = "She still seems a bit hung up on what happened before."
16020-863-490-1 = "Oh, Sensei. You're just in time."
16020-863-500-1 = "There's something I wanted to ask you about the incident."
16020-863-510-1 = "Hey, do you have a moment?"
16020-863-520-1 = "There are a few things I'd like to ask of you."
16020-863-530-1 = "Hm? You're staring at my hair, what's up?"
16020-863-540-1 = "Is there something bothering you about it?"
16020-863-550-1 = "Ah... I'd be in trouble if it got caught on something in a tight space."
16020-863-560-1 = "That's why I have it braided like this."
16020-863-570-1 = "I did think about just cutting it off, though."
16020-863-580-1 = "But I've put so much effort into growing it out, it felt like a waste."
16020-863-590-1 = "Whoa! Don't poke at it!"
16020-863-600-1 = "...I'm not really a fan of people standing behind me."
16020-863-610-1 = "Huh... I see."
16020-863-620-1 = "I suppose there's a reason for the rumors, then."
16020-863-630-1 = "You're already done? ...That was fast. That's amazing."
16020-863-640-1 = "Should I be calling you 'Commander' instead?"
