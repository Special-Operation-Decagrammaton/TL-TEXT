16020-430 = "Я хочу кое о чём тебя спросить."
16020-440 = "Хм? Почему ты смотришь на мои волосы?"
16020-450 = "О чём ты думаешь?"
16020-460 = "А-а, в тесных местах мои волосы могут за что-нибудь цепляться."
16020-470 = "Поэтому я каждый день заплетаю их."
16020-480 = "Это хлопотно, и я думала их обрезать..."
16020-490 = "Но стало жалко после того, как я уже отрастила их такими длинными."
16020-500 = "Ч-Что?! Можешь НЕ тыкать меня?!"
16020-510 = "...Я не люблю неожиданные засады."
16020-520 = "Хм-м... Понятно."
16020-530 = "Значит, всем этим слухам нашлось объяснение."
16020-540 = "Ты уже закончил? Ого... Быстро."
16020-550 = "С такими навыками, может, мне стоит начать называть тебя Командиром."
