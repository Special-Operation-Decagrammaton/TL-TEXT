[translation]
13014-220 = "Синее море! Синее небо! Белые облака! Лучшие звуки!"
13014-230 = "Фу-фу, победа будет нашей! Ты ведь будешь за меня болеть, Сенсей?"
13014-240 = "Времени осталось немного! Давай выложимся на полную!"
13014-250 = "Нельзя терять бдительность до самого-самого конца!"
13014-260 = "Фестиваль закончился... но наша юность будет жить вечно!"
13014-270 = "Лимитированные летние приключения юности! Наставник, я так взволнована!"
13014-280 = "Наставник, хочешь поплавать со мной?"
13014-290 = "Хорошо! Посмотрим, кто быстрее!"
13014-300 = "Никогда не теряй бдительности. Будь начеку."
13014-310 = "Буду ждать твоих комментариев, Наставник!"
13014-570 = "Наставник! Это пляжная охота за сокровищами! Интересно, что там спрятано!"
13014-580 = "Охота за сокровищами — настоящее занятие юности! Давай искать вместе!"
13014-590 = "Ах, было весело. В следующий раз давай ещё раз."
13014-600 = "У меня появилось ещё одно драгоценное воспоминание. Спасибо, Наставник."
13014-610 = "Я вижу много отличных сокровищ..."
13014-620 = "Хм? Какое сокровище для меня самое ценное?"
13014-630 = "Э-Это..."
13014-640 = "Это секрет! Секрет! Совершенно секретно!"
13014-650 = "Юность, о которой я когда-то мечтала, снова ожила..."
13014-660 = "Большое спасибо. Наставник..."
13014-670 = "О! Разве это не сокровище?!"
13014-680 = "Наставник! Я нашла подсказку!"
13014-690 = "Сокровище добыто! Ну-ка, посмотрим, что там...!"
13014-700 = "Как и ожидалось от Наставника! Твои навыки потрясающие!"
13014-710 = "Пойдём искать следующее сокровище!"
