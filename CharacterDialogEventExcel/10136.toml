[translation]
10136-3070 = "Я-хо! Приём, Сенсей?"
10136-3080 = "Раз у нас чрезвычайная ситуация, приходится держать связь."
10136-3090 = "Даже через линию связи приятно тебя видеть."
10136-3100 = "Свежий воздух обеспечен..."
10136-3110 = "Но всё равно жарко. Может, снять ещё немного одежды...?"
10136-3120 = "Хм? Не стоит? Вот как..."
10136-3130 = "Ну, раз ты так говоришь, Сенсей..."
10136-3140 = "Сейчас я скорее стрелок, чем снайпер."
10136-3150 = "Поэтому мне нужно двигаться вместе с командой."
10136-3160 = "...Я рада, что мы переместились туда, где прохладнее."
10136-3170 = "Сенсей, с тобой и правда весело разговаривать."
10136-3180 = "Вот. Хорошая работа."
