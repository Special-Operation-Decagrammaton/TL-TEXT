[translation]
10111-180 = "Йо! Сенсей! Сюда, сюда!"
10111-190 = "Сенсей! Чего так долго?"
10111-200 = "Ну-ну! Сосредоточься!"
10111-210 = "Потерпи ещё немного..."
10111-220 = "Я поиграю с тобой, когда закончу!"
10111-230 = "Ха! Было весело, правда?"
10111-240 = "А? Ты звал? Если звал, скажи хоть что-нибудь."
10111-250 = "Э-э-э? Ты просто ткнул меня ради самого тычка? Что это вообще...?"
10111-260 = "*вздох* Как по-детски."
10111-270 = "Я это запомню. В следующий раз тыкать буду я, так что готовься."
