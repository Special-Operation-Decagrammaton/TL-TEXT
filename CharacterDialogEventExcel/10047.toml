[translation]
10047-210 = "О, я тебя ждала, Сенсей."
10047-220 = "...А? Почему ждала?"
10047-230 = "Добро пожаловать в пляжную лавку!"
10047-240 = "...Ну как?"
10047-250 = "Все остальные заняты... Может, поиграем?"
10047-260 = "Кстати, Кахо сказала мне, что когда я в опасности..."
10047-270 = "...нужно просто бросить гранату."
10047-280 = "Я принесла тебе кое-что для профилактики теплового удара..."
10047-290 = "Вот. Матча-рамунэ."
10047-300 = "Попробуешь?"
10047-310 = "Сенсей, ты звал? Я как раз сама собиралась тебя позвать."
10047-320 = "Какое совпадение!"
10047-330 = "О, я тебя ждала, Сенсей."
10047-340 = "...А? Почему ждала?"
10047-350 = "Добро пожаловать в пляжную лавку!"
10047-360 = "...Ну как?"
10047-370 = "Все кажутся счастливыми. Нет ничего важнее счастья и здоровья."
10047-380 = "Все усердно работают. Мне тоже стоит стараться больше."
10047-390 = "А? Уже всё? Тогда, Сенсей, давай вместе поиграем в воде."
10047-400 = "Все остальные заняты... Может, поиграем?"
10047-410 = "Кстати, Кахо сказала мне, что когда я в опасности..."
10047-420 = "...нужно просто бросить гранату."
10047-430 = "Я принесла тебе кое-что для профилактики теплового удара..."
10047-440 = "Вот. Матча-рамунэ."
10047-450 = "Попробуешь?"
10047-460 = "Сенсей, ты звал? Я как раз сама собиралась тебя позвать."
10047-470 = "Какое совпадение!"
10047-580 = "Столько всего нужно сделать. Голова кругом, да?"
10047-590 = "О, Сенсей. Мне дали какую-то... ведомость задач. Хочешь?"
10047-600 = "Тыкать людей входит в список задач? Тогда и я тебя ткну, Сенсей."
10047-610 = "Президент Ния говорит, что мне нельзя бездельничать."
10047-620 = "Ого, потрясающе..."
10047-630 = "Сенсей, отличная работа. Ты хорошо справился."
