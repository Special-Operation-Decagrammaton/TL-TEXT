[translation]
20050-280 = "Добро пожаловать, Сенсей! Сюда!!"
20050-290 = "Похоже, тут происходит что-то сложное..."
20050-300 = "Но, ну... думаю, я всё-таки встречусь с этим лицом к лицу!"
20050-310 = "Я впервые принимаю такой заказ..."
20050-320 = "Ну, думаю, Миё придумает потрясающий план, да?"
20050-330 = "Похоже, мы приняли странный, но интересный заказ...?"
20050-340 = "Всё кончено!"
20050-350 = "Хм? Почему все выглядят такими уставшими?"
20050-360 = "Что такое, Сенсей? У меня на лице каменная пыль или что-то ещё?"
20050-370 = "Если будешь продолжать меня тыкать, я тоже тебя ткну, хорошо?"
20050-380 = "Д-Думаю, всем можно немного расслабиться..."
20050-390 = "Не волнуйся! Картель свободной торговли..."
20050-400 = "...всегда найдёт выход!"
20050-600 = "Мы приготовили для тебя о-о-очень много весёлых вещей, Сенсей!"
20050-610 = "Нет ничего невозможного! Хотя будет сложно!"
20050-620 = "Как и ожидалось, Сенсей! Ты потрясающий!"
20050-630 = "Ты забрал награды? Не забудь взять их с собой!"
20050-640 = "Хм? Хочешь что-то узнать?"
20050-650 = "Было трудно, но весело? Хи-хи, я чувствую то же самое, Сенсей."
