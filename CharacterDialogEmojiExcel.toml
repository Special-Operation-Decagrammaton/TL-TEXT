85412670713-0-Talk-1 = "Реальная жизнь — отстойная игра..."
85412680714-0-Talk-1 = "...Всё хорошо. Сенсей здесь."
85413350801-0-Talk-1 = "Эти бледные соплячки, серьёзно...!"
85413340802-0-Talk-1 = "Момои и Мидори обе ушли отдыхать в свои комнаты."
85413370706-0-Talk-1 = "Почему-то мне хочется пойти на кухню."
85413370715-0-Talk-1 = "В этом мире есть вещи эффективные, но не рациональные."
85413330807-0-Talk-1 = "Разведывательная миссия? Готова к приказам."
