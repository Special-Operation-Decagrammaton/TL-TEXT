85413320809-0-Talk-1 = "Я рада... что все в безопасности."
85413350810-0-Talk-1 = "...Я старше, так что мне стоит сдержаться. Да, именно так."
85413340811-0-Talk-1 = "Надеюсь... все будут в безопасности."
85413340811-0-Talk-2 = "Это всё."
85413370806-0-Talk-1 = "Хочешь чего-нибудь прохладного, Сенсей?"
85413370815-0-Talk-1 = "Не могу привести мысли в порядок..."
85413370815-0-Talk-2 = "Если тело не горячее, а голова..."
85413370815-0-Talk-3 = "Что мне делать..."
85413330816-0-Talk-1 = "Я верно исполняю свой долг ради всех остальных."
85413330816-0-Talk-2 = "...И ради похвалы."
85413310817-0-Think-1 = "(Как разговаривать с людьми...)"
85413310817-0-Think-2 = "(Надо посоветоваться с Сенсеем...)"
85413320818-0-Talk-1 = "Не волнуйся. Я всё ещё в порядке."
85412670904-0-Talk-1 = "Может, теперь я могу это сказать... Я пришла! Я увидела!"
85412670904-0-Talk-2 = "Я — пока ещё не победила..."
85412670913-0-Talk-1 = "Мы победим, правда, Сенсей? Я верю в Сенсея!"
85412689905-0-Talk-1 = "До сих пор не верится..."
85412689905-0-Talk-2 = "..как мы вообще здесь оказались."
85412689914-0-Talk-1 = "Я буду стараться до самого конца."
85412689914-0-Talk-2 = "Ох, этот последний вызов прозвучал очень зловеще."
85413329909-0-Talk-1 = "Это долгое путешествие наконец достигает своей вершины."
85413329918-0-Talk-1 = "Знаешь, Сенсей? В астрологии нет «конца»."
85413329918-0-Talk-2 = "Всё движется по кругу."
