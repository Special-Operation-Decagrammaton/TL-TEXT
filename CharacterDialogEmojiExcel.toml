85412680305-0-Talk-1 = "О-оно было огромным..."
85413360412-0-Talk-1 = "Сенсей... Ты ведь будешь сражаться рядом со мной...?"
85413330307-0-Talk-1 = "Я хочу, чтобы меня признал только Сенсей. И больше никто."
85413350310-0-Talk-1 = "Есть ли смысл вообще вставлять монеты в этот автомат?"
