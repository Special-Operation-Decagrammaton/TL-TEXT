85413350501-0-Talk-1 = "Хорошая работа, все."
85413340502-0-Talk-1 = "Все были такими впечатляющими! Я так ими горжусь!"
85413360803-0-Talk-1 = "Президент Рио и Химари... Они обе невероятные..."
85412670504-0-Talk-1 = "Серьёзно... Я серьёзно... сомневалась, что всё получится..."
85412680505-0-Talk-1 = "Я думала, нам конец..."
85413360812-0-Talk-1 = "Я многому учусь..."
