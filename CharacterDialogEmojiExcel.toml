8430006010-1-Talk-1 = "Сюда, Сейя."
8430006010-0-Talk-1 = "Рио."
8430006010-1-Talk-2 = "Я подключила коммуникатор к робопсу."
8430006010-1-Talk-3 = "Ты можешь сохранять данные, собранные по пути."
8430006020-0-Think-1 = "(...Не думаю, что смогу перебраться сама.)"
8430006020-0-Think-2 = "(Нужно позвонить Рио.)"
8430006030-1-Talk-1 = "Я прокладывала тебе путь."
