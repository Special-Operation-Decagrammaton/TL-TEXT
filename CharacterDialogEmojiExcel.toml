8430001040-0-Think-1 = "(Ещё остались дела.)"
8430001050-0-Think-1 = "(Давай немного подождём.)"
8430003000-0-Think-1 = "(По пути должно быть устройство с данными, верно?)"
8430003000-0-Think-2 = "(Я бы с радостью уничтожила всё на пути, если бы могла...)"
8430003000-0-Think-3 = "(...Серьёзно, скрытное проникновение вообще не в моём стиле.)"
