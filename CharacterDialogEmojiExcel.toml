8430003010-0-Think-1 = "(Ещё остались дела.)"
8430006000-0-Think-1 = "(Дроны... как и ожидалось от Миллениума. Совсем не то, что в Тринити.)"
8430006000-0-Think-2 = "(В конце этого коридора... должна быть дверь.)"
