85413330216-0-Talk-1 = "Как идеальная горничная и лучший агент..."
85413330216-0-Talk-2 = "...я помогу тебе с чем угодно. Просто попроси."
85413310217-0-Talk-1 = "Пока я за этим наблюдаю..."
85413320218-0-Talk-1 = "...возможно, мы сможем прочитать наше будущее по звёздам."
85413350301-0-Talk-1 = "Интересно, что все захотят выпить..."
85413340302-0-Talk-1 = "Я принесла игровой автомат!"
85413340302-0-Talk-2 = "Что скажешь, Сенсей?"
