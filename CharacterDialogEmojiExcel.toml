85413340402-0-Talk-1 = "Это было невероятно!"
85413360603-0-Talk-1 = "Так вот с чем Сенсей всё это время сражался..."
85413360612-0-Talk-1 = "Почему-то рядом с Сенсеем мне не страшно. Э-хе-хе..."
85413330407-0-Talk-1 = "Мне скучно. Поиграй со мной."
