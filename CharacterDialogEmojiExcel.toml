85413320509-0-Talk-2 = "...и приготовим что-нибудь тёплое?"
85413350510-0-Talk-1 = "Эйми и Токи регулярно обслуживают корабль."
85413340511-0-Talk-1 = "Храбрость... Вот истинная сила!"
85413370206-0-Talk-1 = "Здесь уютно и эффективно, но..."
85412670513-0-Talk-1 = "Но я старалась изо всех сил! Кхм!"
85412680514-0-Talk-1 = "Но если мы помогли всем..."
85413370215-0-Talk-1 = "Можно включить кондиционер? Президент не будет против?"
85413310517-0-Think-1 = "(Так было и раньше, но Отдел разработки игр...)"
85413310517-0-Think-2 = "(...я никогда не знаю, что они выкинут дальше.)"
85413320518-0-Talk-1 = "Говорят, будущее можно увидеть даже по кофейной гуще."
85413350601-0-Talk-1 = "Алиса ушла поспать."
85413370306-0-Talk-1 = "Боевые пайки эффективны..."
85412670604-0-Talk-1 = "Я прошла все игры, которые взяла с собой..."
85412680605-0-Talk-1 = "Эйми? Она сказала, что ей слишком жарко, и вышла наружу."
85413370315-0-Talk-1 = "Будет эффективнее, если все будут есть вместе?"
85413330607-0-Talk-1 = "Недавно у меня появилось то, что можно назвать хобби."
85413310608-0-Think-1 = "(На всякий случай я сделала кухню.)"
85413310608-0-Think-2 = "(Возможно, это было нерационально.)"
85413350610-0-Talk-1 = "Не забывай отдыхать, когда есть возможность, Сенсей."
85413350610-0-Talk-2 = "И чистить зубы!"
85412670613-0-Talk-1 = "Сенсей. У тебя нет лишних жёстких дисков?"
85412680614-0-Talk-1 = "Такое чувство, будто я только что играла не на той сложности..."
85413330616-0-Talk-1 = "Хочешь посмотреть вместе со мной..."
85413330616-0-Talk-2 = "...записанную мной трансляцию?"
85413310617-0-Talk-1 = "...Если честно..."
85413310617-0-Talk-2 = "Иногда я умудряюсь испортить даже еду для микроволновки."
85413350701-0-Talk-1 = "Кажется, теперь я понимаю, что такое передышка..."
85413340702-0-Talk-1 = "Я ещё могу продолжать! Сенсей!"
85412670704-0-Talk-1 = "Может, всё это было сном?"
85412670704-0-Talk-2 = "И я сейчас проснусь обратно в клубной комнате!"
85412680705-0-Talk-1 = "Никогда не думала, что мы окажемся в таком месте."
85412680705-0-Talk-2 = "Мы ведь всего лишь Клуб разработки игр..."
85413350710-0-Talk-1 = "Ты нигде не ранен, правда? Отлично. Какое облегчение."
85413340711-0-Talk-1 = "Чтобы восстановить силы..."
