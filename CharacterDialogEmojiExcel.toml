8431999016-0-Think-1 = "(Собранные данные сохранены.)"
8431999017-0-Think-1 = "(Собранные данные сохранены.)"
8431999018-0-Think-1 = "(Мне нужны данные от Неру.)"
8431999019-0-Think-1 = "(Мне нужны данные от Сейи.)"
