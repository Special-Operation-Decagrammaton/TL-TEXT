8430006040-0-Think-1 = "(Это... щиток...?)"
8430006050-0-Think-1 = "(Теперь я смогу забраться в вентиляцию.)"
8430006050-0-Think-2 = "(Поторопимся.)"
8431001000-0-Think-1 = "(Это...?)"
8431001000-0-Think-2 = "(Так и здесь есть такой. Хорошо.)"
8431001010-0-Think-1 = "(Пожалуй, можно использовать это здесь...)"
8431001011-0-Think-1 = "(Вот оно как. И правда полезная штука.)"
8431002000-0-Think-1 = "(Ну, раз я уже зашла так далеко...)"
8431002000-0-Think-2 = "(Может, стоит пройти ещё немного дальше.)"
8431002010-0-Think-1 = "(Будет трудно подобраться ближе, не попавшись.)"
8431002010-0-Think-2 = "(...Рио ведь дала мне наколенники.)"
8431002010-0-Think-3 = "(Как раз вовремя.)"
8431002020-1-Talk-1 = "После этого давай устроим хороший ужин в честь успеха!"
8431002020-2-Talk-1 = "О-о, по такому случаю можно даже взять добавку!"
8431002020-3-Talk-1 = "Я хочу тэппанъяки!"
8431002030-0-Think-1 = "(Если издам звук, они могут сбежать...)"
8431002030-0-Bulb-1 = "[전구]"
8431002030-0-Think-2 = "(...Точно, наколенники.)"
8431002030-0-Think-3 = "(Серьёзно, она предусмотрела вообще всё.)"
8431003000-0-Think-1 = "(М-м... Проблема.)"
8431003000-0-Think-2 = "(...Точно, я могу связаться с Нэру по рации.)"
8431003000-0-Think-3 = "(Попробуем.)"
8431003010-0-Talk-1 = "Ага. Я примерно поняла ситуацию. Попробую что-нибудь сделать со своей стороны."
8431003010-0-Talk-2 = "...Щиток? Хорошо. Поищу."
8431004000-0-Think-1 = "(А Сейя...)"
8431004000-0-Think-2 = "(...Она не ребёнок, уверена, справится.)"
8431004010-0-Think-1 = "(...Мне нужно, чтобы с другой стороны что-нибудь произошло.)"
8431005000-0-Think-1 = "(...Я не совсем понимаю, что происходит, но мне нужно выбраться отсюда.)"
8431005000-0-Think-2 = "(Чутьё подсказывает: если меня поймают, всё кончено!)"
8431006000-0-Think-1 = "...Что-то не так."
8431006000-0-Think-2 = "(Обычно охрана должна становиться строже.)"
8431006000-0-Dot-1 = "[…]"
8431006000-0-Exclaim-1 = "[!]"
8431006000-0-Talk-1 = "Ловушка! Так вот чего они добивались с самого начала!"
8431006000-0-Talk-2 = "Мне нужна помощь Нэру!"
8431006010-0-Exclaim-1 = "[!]"
8431006010-0-Think-1 = "На этот раз Нэру в опасности!"
8431006020-0-Think-1 = "Мне понадобится Сейя, чтобы открыть это."
8431007000-0-Think-1 = "(Так меня поймают...)"
8431007000-0-Think-2 = "(Нужно что-нибудь... чтобы им помешать...!)"
7-0-Talk-1 = "Я забронировала место на курорте."
7-0-Talk-2 = "Почему бы тебе не провести день в полном покое?"
8-0-Talk-1 = "Здесь происходит что-нибудь весёлое? Я, Куросаки Коюки, прибыла! Я-ха-ха-ха!"
9-0-Talk-1 = "Вау, здесь столько всего интересного!"
10-0-Talk-1 = "Э-это безопасная зона, да?! Здесь меня никто не достанет, правда?!"
11-0-Talk-1 = "Случайно... шумным людям сюда нельзя?"
12-0-Talk-1 = "*ах* Я голодна."
13-0-Talk-1 = "Ты пришёл, Сенсей!"
13-0-Talk-2 = "Я так долго тебя ждала!"
14-0-Talk-1 = "Я-ха-ха-ха, Сенсей!"
14-0-Talk-2 = "...А? Нет, я ничего не трогала."
14-0-Talk-3 = "Может быть...?"
15-0-Talk-1 = "Не бойся! Что бы ни случилось..."
15-0-Talk-2 = "Я, Узава Рейса, буду рядом с тобой, Сенсей!"
16-0-Talk-1 = "А, ты уже здесь?"
16-0-Talk-2 = "Я ждала! Пахьяхья!"
17-0-Talk-1 = "Щекотно-о. Щекотно."
17-0-Talk-2 = "Бу-у. Хикари отомсти-и-ит."
85413320101-0-Talk-1 = "Сначала нужно оценить ситуацию и провести анализ..."
85413320101-0-Talk-2 = "...но сказать легче, чем сделать."
85413320102-0-Talk-1 = "Стальной Континент... Это сверхъестественное явление во всех смыслах."
85413320102-0-Talk-2 = "Хотя это совсем не то, что я изначально представляла."
85413320103-0-Talk-1 = "Мы наконец прибыли."
85413320104-0-Talk-1 = "Мы найдём способ."
85433320105-0-Talk-1 = "Сенсей. Пожалуйста, нанеси последний удар."
85433320106-0-Talk-1 = "Мне нужно понять, что я могу здесь сделать."
85433320107-0-Think-1 = "(Сенсей сказал мне вернуться на транспортный корабль...)"
85433320107-0-Think-2 = "(Наверняка на то есть причина.)"
85433320108-0-Think-1 = "(Сенсей сказал... Если что-то пойдёт не так...)"
85433320108-0-Think-2 = "(Это значит...)"
85433320109-0-Talk-1 = "Пожалуйста... Пусть со всеми всё будет хорошо."
85433320110-0-Talk-1 = "Пора положить всему этому конец."
85433320110-0-Talk-2 = "Мы тоже сделаем всё возможное."
85412670111-0-Talk-1 = "Одно я знаю точно!"
85412670111-0-Talk-2 = "Я точно знаю, что вообще ничего не знаю!"
85412670112-0-Talk-1 = "Хочешь тоже попробовать, Сенсей? А, нет? Ла-а-адно..."
85412670113-0-Talk-1 = "А пока просто попробую делать так, как меня учили!"
85412670114-0-Talk-1 = "Ого... Сколько тут случайных кнопок..."
85412670115-0-Talk-1 = "Последний рывок, Сенсей! Вперёд!"
85432670116-0-Talk-1 = "Хорошо, что Химари притащила меня обратно, но..."
85432670117-0-Think-1 = "(Сенсей... Ты в безопасности, да? С тобой всё хорошо, правда...?)"
85432670118-0-Talk-1 = "Алиса... Кей... Эйми... Токи... Президент... Сенсей..."
85432670119-0-Talk-1 = "Хотя бы... Хотя бы улыбаться я могу!"
85432670120-0-Talk-1 = "Давай покончим с этим, Сенсей. Ради тех троих!"
85412680121-0-Talk-1 = "Просто... Что это такое..."
85412680122-0-Talk-1 = "Добро пожаловать, Сенсей."
85412680122-0-Talk-2 = "Это... ангар, кажется?"
85412680123-0-Talk-1 = "Что-то там про использование Ядра Пророка для чего-то... Просто..."
85412680124-0-Talk-1 = "Кей и президент мне всё объяснили... Прости..."
85442680125-0-Talk-1 = "Доступно новое улучшение!"
85432680126-0-Talk-1 = "Сенсей... Все...!"
85432680127-0-Think-1 = "(Нужно сосредоточиться. Не поскользнуться...!)"
85432680128-0-Talk-1 = "Президент... Куда вы ушли...?"
85432680129-0-Talk-1 = "Пожалуйста... Пожалуйста, будьте все в безопасности...!"
85413310130-0-Talk-1 = "Как мне истолковать этот результат...?"
85413310131-0-Talk-1 = "Это ангар, но..."
85413310131-0-Talk-2 = "Он понемногу превращается в общую техническую комнату..."
85413310133-0-Talk-1 = "Чтобы улучшить текущую ситуацию..."
85413310134-0-Talk-1 = "Я начну анализировать Ядра Пророков здесь."
85413310135-0-Talk-1 = "Подготовка к улучшению завершена."
85413350201-0-Talk-1 = "Первый шаг к нашей первой цели."
85413340202-0-Talk-1 = "Это... волнительно... Почему-то!"
85413360203-0-Talk-1 = "Есть где-нибудь место... где можно спрятаться...?"
85412670204-0-Talk-1 = "Ого... Я здесь впервые, но почему-то всё кажется таким знакомым!"
85412670204-0-Talk-2 = "Как интересно!"
85412680205-0-Talk-1 = "Момои... Отнесись к этому серьёзно."
85413360212-0-Talk-1 = "Снаружи шкафа опасно..."
85413330207-0-Talk-1 = "Вот ромашковый чай."
85413330207-0-Talk-2 = "Говорят, он помогает успокоиться."
85413310208-0-Think-1 = "(То, что я здесь...)"
85413310208-0-Think-2 = "(...рационально?)"
85413320209-0-Talk-1 = "Перед важным событием важно сохранять спокойствие."
85413350210-0-Talk-1 = "Будь то Алиса или остальные, я никому не позволю пострадать."
85413340211-0-Talk-1 = "...Это первый шаг к спасению мира."
85413340211-0-Talk-2 = "Я сделаю всё возможное!"
85413360303-0-Talk-1 = "Здесь даже игровой автомат есть..."
85412670213-0-Talk-1 = "Если бы я знала, что всё будет так, взяла бы больше игр!"
85412680214-0-Talk-1 = "М-мы все точно сможем вернуться?"
