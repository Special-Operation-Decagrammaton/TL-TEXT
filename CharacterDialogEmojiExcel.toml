85413310408-0-Think-2 = "(...?)"
85413320409-0-Talk-1 = "Сладости помогают уменьшить стресс."
85413350410-0-Talk-1 = "Эти соплячки. В инженерии они кое-что умеют, это я признаю."
85413340411-0-Talk-1 = "Как же приятно быть свободной!"
85413330416-0-Talk-1 = "Надо было взять больше манги."
85413310417-0-Talk-1 = "Аркадный автомат... Всего лишь простая машина и программа, но..."
