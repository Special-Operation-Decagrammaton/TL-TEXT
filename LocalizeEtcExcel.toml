3959435880-DescriptionJp = "Protect Manami from the enemies.\nWhen Manami uses her EX Skill, the allies' cost recovery speed will significantly increase for a certain period."
2533846277-NameJp = "Event Challenge Stage 2 Hint"
2533846277-DescriptionJp = "Form a team with students whose attack types match the enemies' defense types to proceed through the battle."
2417127269-NameJp = "Event Challenge Stage 3 Hint"
2417127269-DescriptionJp = "The Money-Grubbing Broker's damage taken is significantly reduced, and damage taken from special effects is significantly increased.\nEvery time the Money-Grubbing Broker takes a large amount of damage at once, the damage they take increases. (Stacks up to 5 times)\nWhen the Money-Grubbing Broker fires their gun wildly with their EX Skill, the damage of the first EX Skill attack they receive is significantly increased. Try to time your EX Skill attacks accordingly."
1853524328-NameJp = "Event Challenge Stage 4 Hint"
1853524328-DescriptionJp = "The enemy's EX Skill applies a Focus Fire effect to the target, and the more stacks of this effect there are, the more lethal the damage dealt.\nWhen an Attacker student uses their EX Skill, the Focus Fire effect on other students is removed, and they become the target of Focus Fire themselves.\nUse the EX Skills of multiple Attackers alternately to defeat the boss."
