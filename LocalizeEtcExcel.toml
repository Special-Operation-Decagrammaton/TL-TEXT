248297985-NameJp = "Event Challenge Stage 3 Hint"
248297985-DescriptionJp = "Tactical Support vehicles' attack power is greatly increased and ignores enemy defense.\nWhen using the vehicle's EX Skill, powerful artillery strikes rain down on the enemies.\n\nMake active use of the vehicle's EX Skill to progress through the battle."
3789220072-NameJp = "Event Challenge Stage 4 Hint"
3789220072-DescriptionJp = "Escort Cherino (Hot Spring).\nTake down the enemies with Elastic Armor so that Cherino (Hot Spring) can defeat the Light Armor enemies."
