1510400840-NameJp = "When Scarecrow is Healed, Increase Enemies' Special Effectiveness Damage Taken"
1510400840-DescriptionJp = "When healing the scarecrow, increases all enemies' special effectiveness damage taken for a certain period of time."
4080738873-NameJp = "When Receiving Damage or Debuffs from Allies, Increase All Allies' Attack Power"
4080738873-DescriptionJp = "When receiving damage or debuffs from allies, increases the attack power of all allies for a certain period of time."
3800944945-NameJp = "Odysseus Cruise Series"
3800944945-DescriptionJp = "Allows you to craft Cafe furniture (Odysseus Cruise Series)."
2643347554-NameJp = "Odysseus Cruise Series Draw Box"
2643347554-DescriptionJp = "A draw box that allows you to obtain one of the Odysseus Cruise Series furniture items at equal probability upon use."
2774825491-NameJp = "Odysseus Cruise Series Select Box"
2774825491-DescriptionJp = "A select box that allows you to choose and exchange any piece of furniture from the Odysseus Cruise Series."
1143289879-NameJp = "When Enemies Take Damage 20 Times, Recover Limit Break Gauge"
1143289879-DescriptionJp = "Every time enemies take damage 20 times, their stability decreases.\nEvery time the same enemy takes damage 20 times, the Limit Break gauge is recovered."
664136517-NameJp = "When Allies Receive Healing 4 Times, Recover Limit Break Gauge"
664136517-DescriptionJp = "Applies Electrocution over-time damage to ally Striker students.\nEvery time the same ally Striker student receives healing 4 times, the Limit Break gauge is recovered."
4222987326-NameJp = "When Enemy CC Duration Accumulates, Recover Limit Break Gauge"
4222987326-DescriptionJp = "In difficulty A/B/C, when the cumulative duration of enemy CC states reaches 1/2/3 seconds respectively, the Limit Break gauge is recovered (max 1 time)."
4214467446-NameJp = "When Allies Remove Debuffs, Recover Limit Break Gauge"
4214467446-DescriptionJp = "At the start of combat and every time 4 enemies are defeated, applies a healing received reduction effect to the Striker student with the highest max HP (max 2 stacks).\nWhen an ally removes a debuff, the Limit Break gauge is recovered (debuffs applied by enemy skills are not removed)."
690886613-NameJp = "Virtual Aptitude Test Season 0 Freight Station Hint"
690886613-DescriptionJp = "Elastic Armor and Heavy Armor enemies appear alternately. If 5/6/7 or more students of the same attack type participate in combat within a single squad, damage dealt increases by 100%/300%/500%. If students retreat and the number decreases, the enhanced damage bonus is reduced.\nThe Limit Break gauge is recovered when enemies take damage 20 times.\nForm your squad taking into account the enemy defense types and special rules."
1878667440-NameJp = "Virtual Aptitude Test Season 0 Beach Hint"
1878667440-DescriptionJp = "Light Armor and Special Armor enemies appear alternately. If 5/6/7 or more students of the same attack type participate in combat within a single squad, damage dealt increases by 100%/300%/500%. If students retreat and the number decreases, the enhanced damage bonus is reduced.\nThe Limit Break gauge is recovered when allies receive healing 4 times.\nForm your squad taking into account the enemy defense types and special rules."
1302067208-NameJp = "Virtual Aptitude Test Season 0 Cruise Ship Hint"
1302067208-DescriptionJp = "Heavy Armor and Light Armor enemies appear alternately. If 5/6/7 or more students of the same attack type participate in combat within a single squad, damage dealt increases by 100%/300%/500%. If students retreat and the number decreases, the enhanced damage bonus is reduced.\nThe Limit Break gauge is recovered when the cumulative duration of CC states inflicted on enemies reaches a threshold.\nForm your squad taking into account the enemy defense types and special rules."
968453207-NameJp = "Virtual Aptitude Test Season 0 Wildhunt Street Hint"
968453207-DescriptionJp = "Special Armor and Heavy Armor enemies appear alternately. If 5/6/7 or more students of the same attack type participate in combat within a single squad, damage dealt increases by 100%/300%/500%. If students retreat and the number decreases, the enhanced damage bonus is reduced.\nThe Limit Break gauge is recovered when allies remove debuffs.\nForm your squad taking into account the enemy defense types and special rules."
3249156518-NameJp = "Racer Pass"
3249156518-DescriptionJp = "A racer's ID pass. Lending it to others is prohibited."
425789147-NameJp = "Gehenna Cup Ticket"
425789147-DescriptionJp = "An admission ticket for the Gehenna Cup tank race. Since they are scattered all over the place, they are easy to obtain."
660970339-NameJp = "Cheer Flag"
660970339-DescriptionJp = "A small flag waved for the team you are supporting. If you wave it too close to the front, the racers might mistake it for a signal and jump the start."
3647519975-NameJp = "Tank Debris"
3647519975-DescriptionJp = "A piece of tank debris that broke off and flew into the spectator stands. Popular as a souvenir."
3922632819-NameJp = "Modification Parts"
3922632819-DescriptionJp = "Gehenna Cup-approved modification parts. It's completely unclear what is actually forbidden, but official approval seems to be required nonetheless."
2586473675-NameJp = "Computer Workbench"
2586473675-DescriptionJp = "A laid-back engineer's workbench.\nThey seem to really like computers."
3819214430-NameJp = "Racing Arcade Machine"
3819214430-DescriptionJp = "An arcade game that lets you enjoy racing indoors.\nIt brilliantly reproduces the feel and recoil of actual tank races. Both popularity and injuries are a constant occurrence."
2196667415-NameJp = "Grand Salon Carpet"
2196667415-DescriptionJp = "A fluffy and clean carpet featuring patterns unique to Odysseus. Because it takes the brunt of the sea breeze, it is washed frequently."
391160836-NameJp = "Promenade Deck"
391160836-DescriptionJp = "A wooden deck where passengers can take a stroll while feeling the sea breeze. Daily maintenance is essential to keep it looking pristine."
2630067491-NameJp = "Cruise Operations Sunbed"
2630067491-DescriptionJp = "A sunbed perfect for soaking up the sea breeze and sunlight on the deck. A so-called lazy bed."
1991329827-NameJp = "Anchor Pedestal"
1991329827-DescriptionJp = "A pedestal displaying an anchor, symbolizing the sailors' fighting spirit."
2839153854-NameJp = "Ship's Wheel Pedestal"
2839153854-DescriptionJp = "A pedestal displaying the ship's wheel used to steer the vessel."
3420080737-NameJp = "Diving Helmet Pedestal"
3420080737-DescriptionJp = "A pedestal adorned with an old-type diving helmet. Do not wear it."
2479617279-NameJp = "Sailing Ship Pedestal"
2479617279-DescriptionJp = "A pedestal adorned with a model sailing ship."
471918546-NameJp = "Promenade Curved Handrail"
471918546-DescriptionJp = "A handrail curving around the corner of the deck. Only the upper part where hands touch is made of wood."
143677388-NameJp = "Promenade Straight Handrail"
143677388-DescriptionJp = "A long handrail running along the deck. Leaning against this to gaze at the horizon is said to be the essence of sailing."
249386597-NameJp = "Deck Ring Toss Set"
249386597-DescriptionJp = "A game of tossing rope rings into a circle drawn on the deck. The rules are simple, but when the waves cause the ship to rock, the difficulty skyrockets."
2171916302-NameJp = "Marine Structural Steel Stanchion"
2171916302-DescriptionJp = "An iron pillar supporting the deck. It looks like a decoration, but without it, the upper floor would collapse."
2646148878-NameJp = "Odysseus Foliage Plant"
2646148878-DescriptionJp = "A foliage plant with leaves trailing down to the bottom. Resistant to sea breezes and grows well even on the deck."
525549154-NameJp = "First-Class Dining Table (for 2)"
525549154-DescriptionJp = "A dining table sized just right for sitting face-to-face. The tablecloth is replaced with a fresh one every meal."
474480199-NameJp = "First-Class Dining Table (for 4)"
474480199-DescriptionJp = "A dining table that seats four. Disputes occasionally break out over the window seats."
3012134982-NameJp = "Coastal Indicator Organism"
3012134982-DescriptionJp = "Creatures commonly known as seagulls. They let you know that land is nearby."
4161361000-NameJp = "Coral Specimen Type A"
4161361000-DescriptionJp = "Coral preserved for display purposes. It doesn't lose its color even without water."
504183923-NameJp = "Coral Specimen Type B"
504183923-DescriptionJp = "Coral preserved for display purposes. The shape varies drastically depending on the sea area where it was collected."
1884323780-NameJp = "Promenade Handrail with Life Ring"
1884323780-DescriptionJp = "A handrail with a rescue life ring hung on it. By regulation, they must be installed at regular intervals."
4239723236-NameJp = "Shuffleboard Set"
4239723236-DescriptionJp = "A game of pushing disks with long poles into scoring areas. The tilt of the ship and the tilt of your score are inextricably linked."
2471047511-NameJp = "Grand Salon Partition Type 1"
2471047511-DescriptionJp = "A partition with thin cloth draped between pillars. Closer to a decorative showpiece than something meant for hiding."
1020329049-NameJp = "Grand Salon Partition Type 2"
1020329049-DescriptionJp = "A partition with thin cloth draped between pillars. The fabric flutters every time the wind blows through."
3796567498-NameJp = "Grand Salon Observation Bulkhead"
3796567498-DescriptionJp = "A large window separating the indoor area from the deck. You can view the ocean even on bad weather days."
3100697710-NameJp = "Grand Salon Aisle Bulkhead"
3100697710-DescriptionJp = "A doorway without a door. It's kept constantly open because, they say, there isn't even time to open a door in an emergency."
769620258-NameJp = "Standard Odysseus Ship's Bell"
769620258-DescriptionJp = "A bell used to announce port entry or boarding. Pulling the rope causes the bell's chime to ring throughout every corner of the ship."
1700735363-NameJp = "Odysseus Potted Citrus Tree"
1700735363-DescriptionJp = "A potted plant with a lemon tree. Apparently a relic of carrying them to prevent scurvy on long voyages."
1812683190-NameJp = "First-Class Dinner Table (for 2)"
1812683190-DescriptionJp = "A dining table for two for formal meals. Don't get so absorbed in counting the forks that you miss your meal."
4294062051-NameJp = "Horizon Sky"
4294062051-DescriptionJp = "A scenery where nothing but the horizon is visible no matter where you look. To the students of Odysseus, it's nothing more than the view outside the window."
1179017087-NameJp = "Navigator's Cradle"
1179017087-DescriptionJp = "A deep, peaceful sea. It can nurture sailors, but it can also swallow them whole."
2262849435-NameJp = "Odysseus Background"
2262849435-DescriptionJp = "Odysseus background."
286429242-NameJp = "Grand Salon Bar Counter"
286429242-DescriptionJp = "A counter notable for its neatly arranged rows of round bottles. Most of the contents are apparently fruit juice."
3341971350-NameJp = "Davits-type Lifeboat"
3341971350-DescriptionJp = "A wooden lifeboat suspended from curved supports. Normally protected by a waterproof tarp, though inspections are never skipped."
4292047238-NameJp = "Water Wall Fountain"
4292047238-DescriptionJp = "A fountain where water flows down smoothly like a wall. Apparently made to replicate the sound of waves."
4290415943-NameJp = "First-Class Dinner Table (for 4)"
4290415943-DescriptionJp = "A dining table for four for formal meals. If you're lucky, you might share a table with the captain."
2119672140-NameJp = "Jellyfish Aquarium"
2119672140-DescriptionJp = "An aquarium breeding jellyfish. Staring at it makes you lose track of time."
2867144763-NameJp = "Entrance with Display"
2867144763-DescriptionJp = "A salon entrance equipped with an electronic display board. Originally meant for broadcasting navigation info, but now primarily used for meal schedule displays."
1969861051-NameJp = "Entrance with Searchlight A"
1969861051-DescriptionJp = "An entrance connecting the deck to the ship's interior. The searchlight on the upper floor illuminates the ocean all night long."
322964567-NameJp = "Entrance with Searchlight B"
322964567-DescriptionJp = "An entrance connecting the deck to the ship's interior. Thanks to the searchlight's glare, it's as bright as broad daylight right here."
1714961259-NameJp = "New Friend"
1714961259-DescriptionJp = "A curious ocean friend. Surprisingly talkative."
3786379984-NameJp = "Odysseus Cruise Series"
3786379984-DescriptionJp = "A cruise set from the Odysseus Cruise Operations Department."
