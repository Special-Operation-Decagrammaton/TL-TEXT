20027-ProfileIntroductionJp = "A linha de frente do Comitê de Contramedidas de Abydos, que chegou a um resort em uma ilha deserta em pleno verão.\n\nEla toma a iniciativa na reconstrução do resort e na coleta de alimentos. Na verdade, parece até empolgada com a experiência de sobrevivência e, mesmo vestindo roupa de banho, seu jeito de agir no próprio ritmo não muda."
20027-CharacterSSRNewJp = "...Não estou empolgada.\nSó estou fazendo o que precisa ser feito."
