13007-ProfileIntroductionJp = "Главная обжора Общества гурманов Гехенны.\n\nПо сравнению с другими участницами Общества гурманов, способными объедаться до отвала и поглощать самые безумные блюда, Джунко кажется относительно обычной ценительницей еды. Но стоит перед ней появиться по-настоящему аппетитному деликатесу — и она теряет всякую сдержанность."
