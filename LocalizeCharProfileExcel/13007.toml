13007-WeaponDescJp = "Os dois fuzis de assalto usados pela Junko.\n\nPossuem uma poderosa cadência de tiro que, no caso da Junko, também é proporcional ao tamanho da sua fome — quanto mais faminta ela está, mais rápido neutraliza o inimigo."
13007-ProfileIntroductionJp = "Uma comilona de pose refinada da Sociedade de Pesquisa Gourmet, da Academia Gehenna.\n\nDiferente das outras integrantes da Sociedade de Pesquisa Gourmet, que comem comidas bizarras ou se empanturram sem parar, ela aprecia a gastronomia com certo bom senso, mas às vezes perde completamente a razão diante de um prato delicioso."
