10024-WeaponDescJp = "O fuzil de assalto favorito da Shiroko.\n\nPassou por uma manutenção minuciosa e diversas modificações para suportar deslocamentos de longa distância ao ar livre."
10024-ProfileIntroductionJp = "Aluna do Colégio Abydos e comandante de linha de frente do Comitê de Contramedidas de Abydos, agora vestida a caráter para o ciclismo.\n\nDepois de tirar o uniforme habitual e vestir sua camisa de ciclismo cheia de disposição, seu semblante parece ainda mais radiante do que de costume. Embora tenha anunciado a meta absurda de \"cruzar Kivotos de ponta a ponta\", talvez por contar com um parceiro de confiança, ela mesma não demonstra a menor preocupação ou receio."
10024-CharacterSSRNewJp = "Então tá, Sensei. Assim que eu chegar, te aviso na hora."
