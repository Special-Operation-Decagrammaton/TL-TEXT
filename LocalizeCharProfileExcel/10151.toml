10151-ProfileIntroductionJp = "A student belonging to Redwinter Federal Academy, currently serving a disciplinary suspension in the old school building's Class 183 Special Class. She serves as the class representative within Class 183.\n\nShe was once a promising elite researcher, but an accident caused by her reckless research sent her to Class 183. Her specialty is mechanical engineering, and she serves as its head. She loves to be recognized and praised by others, and still proudly wears a medal she was once awarded. Deep down, she is hoping someone will ask her how she earned it."
