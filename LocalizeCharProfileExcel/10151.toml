10151-WeaponDescJp = "Criado com o que há de melhor nas habilidades de engenharia mecânica da Anna.\n\nÉ usado no lugar de uma furadeira com o objetivo de abrir buracos no alvo."
10151-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter que sofreu uma punição disciplinar e atualmente cumpre suspensão na Classe Especial Nº 183, no prédio antigo da escola. Dentro da Classe Especial Nº 183, ela atua como representante de turma.\n\nEra uma pesquisadora de elite com um futuro promissor, mas acabou causando um acidente devido às suas pesquisas imprudentes e foi mandada para a Classe Especial Nº 183. Sua especialidade é engenharia mecânica, área da qual é encarregada-chefe. Ela adora ser reconhecida e elogiada pelos outros, e até hoje usa com orgulho uma medalha que recebeu no passado. No fundo, ela morre de vontade de que lhe perguntem a história por trás dessa medalha."
10151-CharacterSSRNewJp = "Chegou a vez da gênia entrar em ação!"
