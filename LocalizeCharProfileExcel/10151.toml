10151-ProfileIntroductionJp = "Студент, приписанный к Федеральной академии Красной Зимы, но из-за дисциплинарного взыскания сейчас отбывает наказание в спецклассе №183 в старом корпусе. Внутри спецкласса № 183 исполняет обязанности старосты класса.\n\nПодающая надежды элитная исследовательница, но из-за аварии, вызванной напористым подходом к исследованиям, попала в спецкласс № 183. Её специализация — машиностроение, где она отвечает за основное направление. Любит, когда её признают и хвалят; до сих пор бережно носит медаль, вручённую когда-то. В глубине души надеется, что кто-нибудь спросит о происхождении этой медали."
