20060-WeaponDescJp = "Оружие, которым Ибуки очень дорожит.\n\nЭто подарок старших товарищей из Общества Пандемониума, поэтому перед поездкой она особенно тщательно защитила его от воды. Теперь оно, похоже, без труда выдержит даже погружение в море."
20060-ProfileIntroductionJp = "Одарённый ребёнок, который учится в начальной школе академии Геенна и при этом состоит в Обществе Пандемониума, высшем органе управления академии.\n\nИбуки впервые отправилась на пляж и просто не может сдержать восторга. Эта поездка стала подарком от старших товарищей, организованным специально для неё. И хотя все вокруг постоянно балуют её вниманием, Ибуки не капризничает, а каждый день прилежно учится, чтобы тоже приносить пользу."
20060-CharacterSSRNewJp = "Смотрите! Вода до самого горизонта!"
