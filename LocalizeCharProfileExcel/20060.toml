20060-WeaponDescJp = "A gun that Ibuki treasures.\n\nA precious gift she received from her seniors in the Pandemonium Society. She has taken great care to waterproof it, worried that it might break if it gets wet. Because of this, it's said that it's perfectly fine even if it gets a little soaked in seawater."
20060-ProfileIntroductionJp = "A brilliant young girl who serves as a member of the Pandemonium Society, the central organization of Gehenna Academy.\n\nThis is her first time at the beach, and she is bursting with excitement. This trip is a gift prepared for her by everyone in the Pandemonium Society. Although she is doted on by her seniors, she doesn't take it for granted and continues to work hard at her studies today to fulfill her duties."
20060-CharacterSSRNewJp = "Is all of this... just water from here to there!?"