20060-WeaponDescJp = "A arma que a Ibuki guarda com tanto carinho.\n\nÉ um tesouro precioso que ganhou de suas veteranas da Sociedade Pandemonium. Preocupada que fosse um grande problema se molhasse e quebrasse, ela preparou uma impermeabilização caprichada. Por isso, dizem que não há problema algum mesmo se entrar um pouco na água do mar."
20060-ProfileIntroductionJp = "Uma garota prodígio que atua como membro da \"Sociedade Pandemonium\", o órgão central da Academia Gehenna.\n\nÉ a primeira vez que ela vem à praia, e seu coração está saltando de expectativa. Esta viagem também é um presente preparado por todas da Sociedade Pandemonium especialmente para a Ibuki. Embora seja muito mimada pelas veteranas, ela não se acomoda com isso e continua se dedicando aos estudos hoje também para cumprir bem o seu papel."
20060-CharacterSSRNewJp = "Daqui até lá é tuuudo água?!"
