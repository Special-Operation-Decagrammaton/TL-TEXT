10023-ProfileIntroductionJp = "Хладнокровная специалистка Команды Префектов Геенны, участвующая в летнем тренировочном лагере.\n\nВместе с другими участницами Команды Префектов, она внимательно следит, чтобы нарушительницы порядка Геенны не распоясались на пляже. Иори ужасно расстроена тем, что летний лагерь испортили постоянные происшествия, хотя изо всех сил старается этого не показывать."
