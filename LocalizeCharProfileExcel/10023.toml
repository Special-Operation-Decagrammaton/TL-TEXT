10023-WeaponDescJp = "O fuzil de precisão que a Iori usa para lidar com infratores das regras.\n\nEstá carregado com munições de visual refrescante que lembram refrigerante, mas cujo poder de fogo jamais deve ser subestimado."
10023-ProfileIntroductionJp = "Aluna da Academia Gehenna e especialista implacável do Comitê Disciplinar participando do acampamento de treinamento de verão.\n\nPara impedir que as alunas encrenqueiras se empolguem demais só porque é verão, realiza rondas principalmente pela orla ao lado das demais integrantes do Comitê Disciplinar. Embora não demonstre por fora, no fundo parece insatisfeita por passar o tempo todo lutando mesmo tendo vindo até a praia, já que as encrenqueiras não dão trégua."
10023-CharacterSSRNewJp = "Espero que não tenha nenhuma idiota empolgada com o verão querendo quebrar as regras, hein?"
