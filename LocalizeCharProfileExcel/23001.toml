23001-WeaponDescJp = "A submetralhadora que a Fuuka carrega sempre consigo.\n\nÀs vezes ela tenta usá-la para conter as alunas problemáticas que causam tumulto no refeitório, mas como na maioria das vezes elas se acalmam antes mesmo de precisar atirar, a arma acaba não entrando muito em ação."
23001-ProfileIntroductionJp = "Aluna da Academia Gehenna e membro do Clube de Merenda Escolar, responsável por administrar o refeitório estudantil.\n\nUma aluna gentil e dedicada — algo raro na Gehenna — que prepara todas as manhãs uma quantidade imensa de refeições para todas na academia. Suas habilidades culinárias são muito boas, mas como o refeitório quase sempre sofre com a falta de pessoal, seu verdadeiro talento costuma ser subestimado. Ainda assim, ela não desanima e continua se esforçando dia após dia para servir refeições cada vez mais saborosas."
