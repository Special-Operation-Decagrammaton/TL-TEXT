23001-ProfileIntroductionJp = "Участница Клуба школьных обедов, управляющего столовой академии Гехенны.\n\nДобрая и серьёзный студент, что для Гехенны само по себе редкость. Каждое утро она готовит и подаёт сотни порций еды. Фуука хорошо готовит, но из-за вечной нехватки работников её мастерство остаётся недооценённым. И всё же она не сдаётся и постоянно ищет способы улучшить меню."
