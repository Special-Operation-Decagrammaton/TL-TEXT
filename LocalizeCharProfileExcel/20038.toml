20038-ProfileIntroductionJp = "Tomoe, chefe do gabinete de secretariado da Academia Federal Red Winter, vestindo um qipao para o intercâmbio com Shanhaijing.\n\nEmbora um pouco surpresa com o ambiente tão diferente de Red Winter, ela parece estar aproveitando o encontro. Também vestiu o traje novo com bastante curiosidade e interesse.\nNeste evento de intercâmbio, sua lábia habilidosa e sua perspicácia continuam afiadas como sempre."
