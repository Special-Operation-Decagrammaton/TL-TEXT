10004-WeaponDescJp = "Многоцелевой пулемёт, которым Хина владеет так же естественно, как собственной рукой.\n\nЕго беспощадная разрушительная мощь сметает нарушителей школьных правил и прочих негодяев."
10004-ProfileIntroductionJp = "Старший Префект Академии Геенна.\n\nХина несколько отстранённа и почти всё считает надоедливой рутиной, однако когда речь заходит о правилах и порядке, она во всём остаётся настоящим старшим префектом Команды Префектов.\nНа большинство вещей её обычная реакция — «Уф, как же надоело», но на поле боя она беспощадна и решительна.\nВраги Геенны одновременно боятся и уважают её."
10004-CharacterSSRNewJp = "Как же надоело... но надо разобраться.\nЭто моя работа."
