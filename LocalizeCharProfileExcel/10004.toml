10004-WeaponDescJp = "Uma metralhadora que a Hina manuseia como se fosse uma extensão do próprio corpo.\n\nQualquer um que viole o regulamento escolar ou perturbe a ordem acaba sendo varrido do mapa pelo seu poder de destruição implacável."
10004-ProfileIntroductionJp = "Aluna da Academia Gehenna e a temida presidente do Comitê Disciplinar.\n\nNo fundo é bem preguiçosa e acha tudo um saco, mas basta o assunto ser o regulamento escolar para ficar rigorosa na mesma hora. Mesmo reclamando que \"dá trabalho\", no campo de batalha toma decisões frias e rápidas sem hesitar. Seu poder de combate é assombroso e, por isso, as organizações hostis à Gehenna temem a sua aparição acima de qualquer coisa."
10004-CharacterSSRNewJp = "Que saco... mas o que tem que ser feito, tem que ser feito.\nPorque esse é o meu dever."
