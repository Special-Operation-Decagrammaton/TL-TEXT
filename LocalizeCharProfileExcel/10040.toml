10040-WeaponDescJp = "A submetralhadora que a Tsukuyo guarda com tanto carinho.\n\nComo a Tsukuyo não leva muito jeito com armas de fogo, a Michiru e a Izuna fizeram várias decorações e modificações especiais para ela. Para a Tsukuyo, é um tesouro insubstituível e, nos momentos decisivos, ela aperta o corpo da arma com ainda mais ternura."
10040-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e integrante do Clube de Pesquisa de Ninjutsu.\n\nPor ter crescido muito rápido desde pequena, costumava sofrer provocações por causa da sua estatura, o que acabou moldando sua atual personalidade retraída. Embora seja naturalmente medrosa e tenha dificuldade para conversar com os outros, quando toma uma decisão, possui a coragem de se lançar em qualquer situação. Mesmo ainda não entendendo muito sobre ninjas, atualmente se dedica com alegria às atividades do Clube de Pesquisa de Ninjutsu ao lado da Michiru, a quem tanto admira, e da Izuna."
10040-CharacterSSRNewJp = "Mesmo alguém grandalhona e desajeitada como eu...\nvai dar o máximo para ser útil a você, Sensei...!"
