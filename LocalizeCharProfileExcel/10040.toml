10040-WeaponDescJp = "Пистолет-пулемёт, которым дорожит Цукуё.\n\nОна плохо разбирается в оружии, поэтому Мичиру и Изуна понемногу помогали его модифицировать. Благодаря их стараниям теперь Цукуё считает его незаменимым сокровищем."
10040-ProfileIntroductionJp = "Участница Клуба исследования ниндзюцу Хяккияко.\n\nЦукуё комплексует из-за очень высокого роста: в детстве её без конца дразнили. Она робкая и ей трудно говорить вслух о своих мыслях, но если уж принимает решение, то упорно следует цели. О ниндзя Цукуё знает не так много, однако изо всех сил старается ради Мичиру и Идзуны, чтобы их не подвести."
10040-CharacterSSRNewJp = "Я-я всего лишь высокая и бесполезная... Но хочу изо всех сил помогать, Сенсей!"
