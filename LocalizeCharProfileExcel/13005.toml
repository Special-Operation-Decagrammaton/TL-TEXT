13005-WeaponDescJp = "A pistola que a Kayoko costuma carregar consigo.\n\nComo faz jus ao nome e produz um estrondo enorme a cada disparo quando usada normalmente, ela quase sempre a mantém equipada com um silenciador."
13005-ProfileIntroductionJp = "Chefe de seção do Faz-Tudo 68, da Academia Gehenna.\n\nDiferente das outras integrantes do Faz-Tudo 68, ela não tem más intenções, mas é uma garota que acaba sendo confundida com uma delinquente apenas por ter nascido com um olhar intimidador. A própria Kayoko prefere manter o silêncio diante desses mal-entendidos, mas isso só cria um círculo vicioso que reforça ainda mais sua imagem de pessoa assustadora."
