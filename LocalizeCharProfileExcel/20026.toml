20026-WeaponDescJp = "O resistente fuzil de assalto favorito da Minori.\n\nDe estrutura simples, este fuzil de assalto faz jus ao seu nome, iluminando silenciosamente o caminho de luta trilhado pela Minori."
20026-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter e presidente do Departamento de Obras Públicas.\n\nSeja em grandes obras de engenharia civil ou na construção, onde quer que seja necessária mão de obra, ela envia sua equipe e comanda o canteiro de obras. Sua competência no trabalho é indiscutível, mas ela tem má fama entre os contratantes por organizar greves e manifestações pelos motivos mais banais."
