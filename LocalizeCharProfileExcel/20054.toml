20054-WeaponDescJp = "A pistola pertencente à Himari.\n\nAgora que ela passou a andar em uma cadeira de rodas — ou melhor, em uma moto —, talvez seja possível vê-la usando sua arma com mais frequência do que de costume."
20054-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium, ex-presidente do grupo hacker \"Veritas\" e atual presidente da Força-Tarefa de Fenômenos Paranormais.\n\nPara lidar com uma crise sem precedentes, ela vestiu um traje especial. Além disso, graças à sua nova \"cadeira de rodas\", parece ter se tornado capaz de correr livremente para todos os lados.\n\nEla própria insiste que é uma cadeira de rodas, mas, não importa como se olhe, é uma moto."
20054-CharacterSSRNewJp = "O que uma beldade pura, frágil e supergenial tem a fazer não muda.\nVamos lidar com tudo com elegância e calma, um passo de cada vez."
