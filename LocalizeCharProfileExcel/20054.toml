20054-WeaponDescJp = "Простой и красивый пистолет Химари.\n\nБлагодаря модификациям её мотоцикла... НЕТ, инвалидного кресла, теперь вы можете видеть это оружие в деле чаще."
20054-ProfileIntroductionJp = "Бывший президент Veritas и нынешний президент Отряда исследования сверхъестественных явлений.\n\nХимари облачилась в специальный костюм для боёв на Стальном континенте. Но одним костюмом она не ограничилась и вооружилась тем, что настойчиво называет... «тактическим инвалидным креслом». Оно создано для передовой и обладает впечатляющей огневой мощью и мобильностью.\n\nНо как ни посмотри — это мотоцикл."
20054-CharacterSSRNewJp = "Ситуация, возможно, обострилась, но наша работа осталась прежней. Разберёмся с ней элегантно?"
