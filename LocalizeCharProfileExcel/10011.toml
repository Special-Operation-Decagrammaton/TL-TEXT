10011-WeaponDescJp = "O fuzil de precisão usado pela Shun.\n\nNão importa o quão levada seja a criança-problema, basta a Shun sacar esta arma para que ela vire um anjinho na mesma hora. Claro que ela jamais a apontaria para as crianças da creche."
10011-ProfileIntroductionJp = "Aluna do Colégio Sênior Shanhaijing e instrutora do departamento de apoio educacional \"Jardim da Flor de Ameixeira\".\n\n\"Jardim da Flor de Ameixeira\" é tanto o nome da creche quanto o nome do clube. Dona de uma personalidade gentil e generosa, conta com a confiança não apenas das crianças da creche, mas também das demais alunas de Shanhaijing. Por trabalhar como instrutora há bastante tempo, raramente se irrita com as travessuras dos pequenos, mas reage de forma bem sensível sempre que alguém menciona a sua idade."
10011-CharacterSSRNewJp = "Esperou direitinho por mim?\nQue criança boazinha~"
