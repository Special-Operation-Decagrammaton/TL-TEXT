10033-WeaponDescJp = "O fuzil favorito da Wakamo.\n\nApesar da aparência tradicional, exala constantemente o cheiro de chamas e pólvora. Atualmente, costuma ser disparado contra qualquer \"estorvo\" que se aproxime do Sensei."
10033-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako que, após ser suspensa, foi enviada ao Departamento Correcional e escapou de lá, sendo uma das \"Sete Prisioneiras\".\n\nUma garota temida e chamada de \"Raposa da Calamidade\" por seus atos de destruição indiscriminados e em larga escala. Tanto seus motivos quanto seus objetivos são cercados de mistério. Correm boatos incessantes de que o rosto escondido sob sua máscara é assustador como o de um oni ou horrendo como o de um demônio, mas o desconhecido quase sempre inspira medo."
10033-CharacterSSRNewJp = "Ah... Finalmente nos encontramos, meu querido♡"
