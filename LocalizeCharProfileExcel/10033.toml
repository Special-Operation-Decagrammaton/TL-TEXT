10033-WeaponDescJp = "Любимая винтовка Вакамо.\n\nНесмотря на старинный дизайн, это ужасающее оружие, от которого постоянно пахнет дымом и порохом. В основном оно используется для устранения препятствий, угрожающих безопасности Сэнсэя."
10033-ProfileIntroductionJp = "Одна из Семи заключённых, сбежавших из Исправительного бюро после отстранения от Объединённой академии Хяккияко.\n\nИз-за разрушительных выходок её боятся как Лису бедствия. Мотивы Вакамо остаются загадкой, как и лицо под маской. Ходят слухи, что под ней скрывается чудовищный демон, но пока это лишь слухи."
