10110-WeaponDescJp = "Любимый пистолет Сэйи.\n\nКак и подобает участнице Tea Party, у него элегантный и надёжный дизайн. Он всегда заряжен — прямо как Сейя, которая при необходимости без колебаний выдаёт резкие слова."
10110-ProfileIntroductionJp = "Участница Tea Party старшей школы Тринити и глава Санктус.\n\nОкружающие считают её педантичной и непредсказуемой. Она несколько капризна и импульсивна — почти как настоящая аристократка. После восстановления от покушения всё чаще показывает упрямую и по-детски непосредственную сторону."
