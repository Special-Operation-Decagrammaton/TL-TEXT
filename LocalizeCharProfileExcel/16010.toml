16010-ProfileIntroductionJp = "Участница Инженерного отдела, надевающая форму чирлидерши на время соревнований.\n\nБлагодаря любви к косплею Хибики отлично шьёт, поэтому именно она разрабатывает и делает специальные костюмы для участниц Инженерного отдела. Эту форму чирлидерши она сшила довольно давно, поэтому кое-где она стала немного тесновата."
