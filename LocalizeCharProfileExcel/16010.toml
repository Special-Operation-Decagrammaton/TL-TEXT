16010-ProfileIntroductionJp = "Membro do Clube de Engenharia, da Escola de Ciências Millennium, vestida com um uniforme de líder de torcida para o Grande Festival Esportivo.\n\nAproveitando as habilidades de costura que desenvolveu com seu hobby de fazer cosplay, ela mesma confeccionou os uniformes usados pelas integrantes do Clube de Engenharia. No entanto, talvez por ter reformado uma roupa de líder de torcida que fez há muito tempo, ela parece um pouco incomodada com o comprimento da saia."
