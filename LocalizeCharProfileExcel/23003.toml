23003-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e engenheira do grupo hacker \"Veritas\".\n\nUma das maiores prodígios da Millennium, destacando-se até mesmo em uma escola famosa por reunir mentes brilhantes. A grande maioria dos equipamentos de ponta criados na Millennium é desenvolvida pelas mãos dela. Contudo, apesar de toda a sua capacidade e conquistas, ela nunca se gaba nem age com arrogância, sendo uma garota gentil que interage bem com as outras alunas e sabe ouvir com atenção."
