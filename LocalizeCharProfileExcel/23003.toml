23003-ProfileIntroductionJp = "Инженер Veritas — хакерской группы научной школы Миллениум.\n\nНевероятный гений даже по меркам Миллениума, где талантливых умов и без того хватает. Значительная часть самых передовых технологий школы создана при её участии. Несмотря на достижения, Харэ остаётся скромной, дружелюбной и внимательной к товарищам."
