26009-WeaponDescJp = "Гранатомёт Юзу.\n\nЕго пришлось спроектировать так, чтобы он мог стрелять гранатами в любых обстоятельствах — учитывая привычку Юзу сражаться из безопасной коробки."
26009-ProfileIntroductionJp = "Президент Отдела разработки игр Миллениума. Она начала носить форму горничной после того, как её приняли за участницу C&C.\n\nНовый наряд не превратил Юзу в общительного экстраверта, зато придал ей достаточно уверенности, чтобы выйти из комнаты. Среди пугающих и непривычных событий Юзу изо всех сил преодолевает одно препятствие за другим при поддержке Отдела разработки игр."
