26009-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e presidente do Clube de Desenvolvimento de Jogos, que acabou vestindo um uniforme de empregada após uma série de acontecimentos.\n\nMesmo com uma roupa diferente do habitual, a Yuzu continua sendo a mesma Yuzu, embora pareça ter ampliado um pouquinho o leque de coisas que consegue fazer. Ao lado das amigas do Clube de Desenvolvimento de Jogos, ela enfrentará as mais diversas dificuldades."
