10109-WeaponDescJp = "A pistola com kit de conversão usada pela Noa.\n\nCom a coronha retraída, fica do tamanho ideal para servir de peso de papel. Ela adora usá-la como companhia para suas leituras antes de dormir."
10109-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e secretária do Seminário, que vestiu um pijama para desfrutar de um descanso sereno.\n\nNoa observa em silêncio enquanto sua adorável caloura e sua colega de classe bondosa acumulam mal-entendidos sobre mal-entendidos e acabam causando incidentes. Claro, sem jamais deixar de sorrir e registrar tudo."
