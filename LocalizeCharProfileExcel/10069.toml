10069-ProfileIntroductionJp = "Президент Променада Чёрной Черепахи — гастрономического района академии Шаньхайцзин.\n\nБлагодаря выдающимся организаторским навыкам Руми превратила обычную улицу с едой в одно из самых популярных гастрономических мест Кивотоса. Из-за этого она стала занозой для Студенческого совета Шаньхайцзина, опасающегося роста независимых фракций. Руми всё отрицает и утверждает, что её не интересует ничего, кроме готовки и развития променада."
