10069-WeaponDescJp = "A submetralhadora favorita da Rumi.\n\nO nome significa \"estudar o passado para compreender o novo\", mas parece que os olhos dela estão sempre voltados mais para as \"novidades\"."
10069-ProfileIntroductionJp = "Estudante do Colégio Sênior Shanhaijing e presidente do distrito gastronômico da \"Associação Comercial Genbu\".\n\nDona de uma capacidade administrativa extraordinária, transformou a Associação Comercial Genbu, que antes era apenas uma rua comercial comum, em um dos principais polos gastronômicos de Kivotos. Embora seja vista como inimiga pelo conselho estudantil de Shanhaijing, que desconfia do crescimento de uma facção independente, a própria Rumi não parece ter interesse em nada além de expandir os negócios da associação."
