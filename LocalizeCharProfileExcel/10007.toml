10007-WeaponDescJp = "Многоцелевой пулемёт Маки, который она часто использует при рисовании граффити.\n\nПосле модификации технологиями Миллениума он способен стрелять как боевыми патронами, так и пейнтбольными шарами."
10007-ProfileIntroductionJp = "Участница Veritas — хакерской группы научной школы Миллениум.\n\nОзорный студент, любящий рисовать граффити; именно она придумала эмблему Veritas. Маки легкомысленна и редко относится к чему-либо серьёзно, из-за чего часто конфликтует с другими клубами."
