20052-ProfileIntroductionJp = "Президент Издательского отдела — издательского клуба академии Красная Зима.\n\nТакже занимает должность главного редактора журнала «Красный медведь». Если Якумо что-то решила, остановить её невозможно: ради прибыли Издательского отдела эта непобедимая президентка пойдёт на всё. Но под хитрой внешностью, похоже, скрывается удивительно чистое сердце..."
