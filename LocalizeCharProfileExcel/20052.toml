20052-WeaponDescJp = "A pistola que a Yakumo traz sempre consigo.\n\nA Yakumo tem o hábito de dizer que \"uma arma tem diversas utilidades\". Dizem que uma dessas utilidades é \"fazer escritores preguiçosos cumprirem os prazos\"."
20052-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter e presidente do Departamento de Publicação.\n\nEla também atua como editora-chefe da revista \"Red Bear\". Tem um lado teimoso e irredutível quando toma uma decisão, não medindo esforços pelo bem do Departamento de Publicação e demonstrando uma iniciativa imbatível. Contudo, parece que até mesmo ela tem um lado sincero e dedicado...?"
