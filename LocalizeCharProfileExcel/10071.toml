10071-ProfileIntroductionJp = "Líder do Pelotão RABBIT, pertencente à Academia Especial SRT, que visitou uma vila de pescadores para uma missão de infiltração.\n\nPara investigar o motivo pelo qual o camarão sumiu das marmitas da loja de conveniência, ela decidiu colocar um traje de banho. Embora a vila de pescadores onde se infiltraram fosse um lugar suspeito e bem longe de ser um ponto turístico, parece que ela não abre mão de usar um biquíni fofo."
