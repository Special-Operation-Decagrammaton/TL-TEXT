10071-ProfileIntroductionJp = "Лидер Отряда RABBIT, прибывшая в отдалённую рыбацкую деревню для операции под прикрытием.\n\nОна приехала в приморский городок под видом туристки, чтобы расследовать происхождение бэнто, поставляемых в магазины.\nВраждебность местных жителей и рыбный запах по всему городу делают это место далеко не курортом мечты. И всё же Мияко не может отказаться от возможности надеть милый купальник!"
10071-CharacterSSRNewJp = "Это RABBIT 1. Мы только что прибыли к морю."
