16017-ProfileIntroductionJp = "Инженер Отдела грузовой логистики Железнодорожной академии Highlander.\n\nОна очень застенчивая и замкнутая, но неожиданно остра на язык. Правда, злые замечания легко пропустить, потому что Аоба обычно бормочет их себе под нос. Из-за постоянной перегрузки работой и несправедливого обращения список её жалоб никогда не заканчивается."
