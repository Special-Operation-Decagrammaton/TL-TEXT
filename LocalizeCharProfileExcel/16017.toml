16017-ProfileIntroductionJp = "Aluna da Academia Ferroviária Highlander e engenheira do Departamento de Gestão de Transporte de Cargas.\n\nTem uma personalidade tímida e medrosa, mas também possui um lado que solta comentários venenosos de forma casual. Talvez por falar em voz baixa, é um pouco difícil distinguir se o que ela diz é um insulto ou não. Está sempre sobrecarregada de trabalho pesado e passa por muitas situações injustas, guardando uma forte insatisfação com o mundo."
