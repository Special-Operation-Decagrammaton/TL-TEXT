10132-ProfileIntroductionJp = "Участница Клуба исследования ниндзюцу Объединённой академии Хяккияко.\n\nОна начала как охранник по контракту на модном показе, но каким-то образом в итоге дебютировала как модель. Цукуё всегда комплексовала из-за роста, но в модельной индустрии он оказался преимуществом. Теперь она разрывается между модельной работой и клубной деятельностью."
