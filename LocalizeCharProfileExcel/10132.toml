10132-WeaponDescJp = "A submetralhadora que a Tsukuyo guarda com tanto carinho.\n\nMesmo quando a leva para a passarela, ela não adiciona nenhuma decoração especial. Provavelmente porque, para a Tsukuyo, o visual que a Michiru e a Izuna decoraram para ela antes já é o estado mais perfeito possível."
10132-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e integrante do Clube de Pesquisa de Ninjutsu.\n\nEmbora tenha sido contratada como segurança de um desfile de moda, acabou estreando como modelo. Sua altura, que antes era um complexo para ela, tornou-se um grande ponto forte no mundo da moda. Ela mesma, porém, parece preocupada em como conciliar o trabalho de modelo com as atividades do clube."
10132-CharacterSSRNewJp = "E-Eu... trabalhando mesmo como modelo...?"
