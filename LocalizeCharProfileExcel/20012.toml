20012-WeaponDescJp = "O lança-granadas de cano curto usado pela Sena.\n\nUma ferramenta para remover rapidamente obstáculos durante chamados de emergência. Entre os obstáculos, incluem-se também aqueles que atrapalham o seu trabalho."
20012-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente do Clube de Medicina de Emergência.\n\nEm meio aos incidentes e acidentes que acontecem diariamente em Gehenna, ela transporta os feridos sempre com uma expressão impassível, sem jamais reclamar, não importa a situação. Embora tenha um histórico de ter salvado inúmeros feridos, sua mania de chamá-los por engano de \"cadáveres\" e seu jeito brusco de atendê-los fazem com que algumas alunas mantenham certa distância."
20012-CharacterSSRNewJp = "Onde estão os cadáveres... digo, os feridos?"
