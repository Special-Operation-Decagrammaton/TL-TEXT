10153-WeaponDescJp = "O fuzil de assalto que a Hifumi carrega consigo. Tem um tamanho compacto para não atrapalhar na hora de entrar e sair do tanque.\n\nComo sua dona é pacifista, parece que quase não chega a ser usado."
10153-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota sensível do Clube de Aulas de Recuperação. Desta vez, está participando de uma corrida de tanques ao lado de suas queridas amigas.\n\nAcabou entrando na Copa Gehenna para conseguir a dispensa da prova de recuperação. Embora a própria Hifumi sempre tenha se considerado alguém calma e que não chama atenção, por algum motivo os olhares da plateia voltados para ela estão cheios de fervor...?"
10153-CharacterSSRNewJp = "A meta é cruzar a linha de chegada — e com segurança!"
