10153-ProfileIntroductionJp = "Студент Объединённой академии Тринити, впечатлительная девушка из Клуба дополнительных занятий. На этот раз она участвует в танковой гонке вместе со своими дорогими друзьями.\n\nЧтобы получить освобождение от пересдачи, ей пришлось принять участие в Кубке Геенны. Хифуми всегда считала себя спокойной и незаметной, но взгляды зрителей, устремлённые на неё, почему-то горячи...?"
