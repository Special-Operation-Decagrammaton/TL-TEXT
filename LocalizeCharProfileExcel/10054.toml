10054-WeaponDescJp = "Пистолет Мари.\n\nОбычно он используется в мирных целях — например, чтобы подать сигнал к началу матча. Правда, иногда Мари невольно направляет его на студентов, которые устраивают неприятности."
10054-ProfileIntroductionJp = "Студент Сестринства в спортивной форме для участия в Фестивале Halo Кивотоса.\n\nОна добровольно вошла в Исполнительный комитет, искренне веря в смысл фестиваля — пожелание мира всему Кивотосу. Но мероприятие постоянно сопровождают проблемы и конфликты, и из-за своей ответственности Мари тоже оказывается втянута в них."
