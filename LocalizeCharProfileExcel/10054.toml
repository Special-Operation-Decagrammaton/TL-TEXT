10054-WeaponDescJp = "A pistola pertencente à Mari.\n\nNormalmente tem usos pacíficos, como disparar sinalizadores para anunciar o início das partidas... mas, às vezes, seu cano acaba apontado sem querer para alunas delinquentes."
10054-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e freira da Irmandade, vestida com seu uniforme de educação física para participar do Festival Halo.\n\nAo ouvir que seria um festival para celebrar a paz em Kivotos, ela se voluntariou para trabalhar no comitê executivo, mas, quando o evento começou, disputas e confusões não pararam de surgir. Somado à sua natureza gentil que não consegue ignorar quem precisa de ajuda, parece que Mari continua se envolvendo em todo tipo de problema."
10054-CharacterSSRNewJp = "Espero que todos possam se divertir\ncom um sorriso no rosto nesta Grande Gincana Esportiva..."
