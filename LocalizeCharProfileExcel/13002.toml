13002-ProfileIntroductionJp = "Участница Общества гурманов Гехенны.\n\nНе позволяйте милой внешности себя обмануть. Акари обладает огромным аппетитом и является действующей чемпионкой множества соревнований по скоростному поеданию еды по всему Кивотосу. Обычно она спокойная и добрая, но шалить умеет ничуть не хуже любого другого студента Гехенны."
