13002-WeaponDescJp = "O fuzil de assalto favorito da Akari.\n\nComo era de se esperar de alguém com um apetite tão voraz, a arma conta com diversos mecanismos acoplados."
13002-ProfileIntroductionJp = "Membro da Sociedade de Pesquisa Gourmet, da Academia Gehenna.\n\nÀ primeira vista parece uma garota calma, mas na verdade é uma competidora voraz que mantém sempre o título de campeã nos torneios de comilança de Kivotos. Embora tenha uma personalidade basicamente tranquila e bondosa, como uma típica aluna da Academia Gehenna, ela também tem um lado que não hesita em fazer os outros passarem por maus bocados de vez em quando."
