10070-WeaponDescJp = "As pistolas duplas favoritas da Mina.\n\nNa mão direita, o Tigre Branco; na esquerda, o Dragão Negro. Ela afirma que estes são seus melhores companheiros de armas... Talvez haja momentos em que o estilo importe mais do que a razão."
10070-ProfileIntroductionJp = "Estudante do Colégio Sênior Shanhaijing, diretora executiva do conselho estudantil \"Genryumon\" e guarda-costas da presidente.\n\nApesar da aparência fria e implacável, na verdade é uma grande fã de filmes noir antigos, admirando situações e falas estilosas dignas do cinema. Vive passando vergonha ao tentar bancar a durona repetindo frases de efeito dos filmes, mas parece que os membros do \"Genryumon\" fazem o possível para fingir que não notam."
10070-CharacterSSRNewJp = "Deixe que eu encare as faíscas sozinha.\n— Afinal, essa é a melhor estratégia."
