10070-WeaponDescJp = "Любимые парные пистолеты Мины.\n\nБелый Тигр в правой руке и Мудрый Дракон в левой — эти двое для неё настоящие боевые товарищи. Возможно, эмоции и разум иногда действительно способны действовать вместе."
10070-ProfileIntroductionJp = "Исполнительный офицер Генрюмона — Студенческого совета Шаньхайцзина — и личный телохранитель президента.\n\nНесмотря на спокойный и собранный вид, Мина — фанатка классических нуарных фильмов до мозга костей. Она любит цитировать сцены и реплики, хотя нередко делает это неправильно. Попытки выглядеть круто в неподходящий момент постоянно приводят к неприятностям, а участницы Генрюмона стараются минимизировать ущерб."
10070-CharacterSSRNewJp = "Каждый должен вести собственные битвы.\nНичего хорошего из втягивания других не выходит."
