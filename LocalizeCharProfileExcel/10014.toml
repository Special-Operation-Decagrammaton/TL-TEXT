10014-WeaponDescJp = "A submetralhadora favorita da Izuna.\n\nUma ferramenta ninja de última geração que, combinada às artes ninja do Estilo Izuna, tem utilidades infinitas: desde alvejar bombas de fumaça arremessadas no ar até massagear os ombros do seu Mestre."
10014-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e integrante do Clube de Pesquisa de Ninjutsu.\n\nUma garota alegre e cheia de energia, mas que, por perseguir um sonho pouco compreendido pelos outros, acabou vivendo sozinha até hoje. Esse sonho é \"se tornar a maior ninja de Kivotos\". Para se tornar uma ninja exemplar, hoje mais uma vez ela chama o Sensei de \"Mestre!\" enquanto o escolta (ou melhor, corre atrás dele por toda parte) e se dedica de corpo e alma a diversas atividades."
10014-CharacterSSRNewJp = "Se for pelo meu Mestre, faço qualquer coisa!"
