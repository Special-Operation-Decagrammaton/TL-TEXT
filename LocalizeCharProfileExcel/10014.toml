10014-ProfileIntroductionJp = "Участница Клуба исследования ниндзюцу академии Хяккияко.\n\nЯркая и жизнерадостная девушка, но преданность странной мечте заставила её большую часть жизни провести одиночкой. Каждый день она посвящает себя тому, чтобы стать лучшим ниндзя. В том числе следует за Сэнсэем и называет его «господином»."
