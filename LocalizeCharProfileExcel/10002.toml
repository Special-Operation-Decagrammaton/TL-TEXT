10002-WeaponDescJp = "O fuzil de precisão manuseado pela Haruna.\n\nSegundo ela, além da mira de sua luneta está o caminho que leva à gastronomia suprema."
10002-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente da Sociedade de Pesquisa Gourmet.\n\nÀ primeira vista, passa a impressão de uma dama da alta sociedade, distante e refinada, mas quando o assunto envolve comida, perde totalmente o bom senso como uma gourmet fervorosa. Apesar de toda essa obsessão por comida, tem pouco apetite e não consegue comer em grandes quantidades. Seus pratos favoritos são comidas gordurosas, como motsunabe e miúdos grelhados."
10002-CharacterSSRNewJp = "Vamos partir juntos em uma jornada pelo mundo da alta gastronomia?"
