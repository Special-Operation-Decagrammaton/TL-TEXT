10002-ProfileIntroductionJp = "Президент Общества гурманов Гехенны.\n\nНа первый взгляд Харуна обладает изящной харизмой утончённой леди. Но стоит разговору зайти о еде, как она мгновенно превращается в безумную фанатичку. При всей своей неудержимой страсти к гастрономии она на самом деле не способна съесть слишком много за один раз. Больше всего Харуна любит жирные блюда вроде моцунабэ и хорумонъяки."
