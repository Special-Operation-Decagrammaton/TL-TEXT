10150-WeaponDescJp = "Um fuzil subaquático que a Kotone usa com carinho desde que entrou na escola.\n\nPor utilizar munição flechette subaquática, permite mirar nos alvos com estabilidade mesmo sob a forte resistência da água. Em terra firme, tem a desvantagem de possuir um alcance muito menor em comparação a outros fuzis, mas a Kotone não parece se importar muito com isso."
10150-ProfileIntroductionJp = "Vice-presidente do Clube de Mergulho do Colégio Marítimo Odyssey.\n\nEla tem a visão fraca e costuma usar óculos de grau alto. Em compensação pela visão muito baixa, sua audição e intuição são extraordinárias. Quando a visibilidade debaixo d'água está ruim, ela assume o papel de guiar as integrantes do clube confiando na própria audição.\n\nSeu hobby é se comunicar com o continente por rádio amador. Graças a isso, ela também mantém contato com alunas de terra firme."
10150-CharacterSSRNewJp = "Como a minha visão não é muito boa...\nTalvez eu demore um tempinho para gravar o seu rosto."
