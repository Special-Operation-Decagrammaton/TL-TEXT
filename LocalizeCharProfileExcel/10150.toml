10150-WeaponDescJp = "An underwater rifle that Kotone has cherished since her enrollment.\n\nBecause it uses underwater flechette rounds, it can reliably target enemies even in water with high resistance. While it has the drawback of a significantly shorter range on land compared to other rifles, Kotone doesn't seem to mind much."
10150-ProfileIntroductionJp = "The vice president of the Diving Club at Odyssey Maritime High School.\n\nShe has poor eyesight and usually wears strong prescription glasses. In place of her very low visual acuity, her hearing and intuition are exceptional. When underwater visibility is poor, she takes on the role of guiding club members by relying on her hearing.\n\nHer hobby is communicating with the land via amateur radio. Thanks to this, she maintains connections with students on the mainland."
10150-CharacterSSRNewJp = "My eyesight isn't very good, so...\nIt might take me a little while to remember your face."
