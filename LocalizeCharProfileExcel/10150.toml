10150-WeaponDescJp = "Подводная винтовка, которой Котонэ пользуется с момента поступления в «Одиссею».\n\nОна стреляет специальными стреловидными боеприпасами, которые позволяют уверенно поражать цели даже в плотной водной среде. На суше её дальность стрельбы значительно меньше, чем у обычных винтовок, но Котонэ, похоже, это не особенно волнует."
10150-ProfileIntroductionJp = "Заместитель председателя Клуба дайвинга Морской академии «Одиссея».\n\nУ неё очень слабое зрение, поэтому обычно она носит очки с сильными линзами. Зато слух и интуиция Котонэ необычайно остры. При плохой видимости под водой она часто ведёт других членов клуба, полагаясь на слух.\n\nЕё увлечение — радиолюбительская связь с материком, благодаря которой она подружилась со многими студентами по всему Кивотосу."
10150-CharacterSSRNewJp = "Я плохо вижу, поэтому...\nМне понадобится время, чтобы запомнить ваше лицо."
