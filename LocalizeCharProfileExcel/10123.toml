10123-WeaponDescJp = "A pistola favorita da Seia.\n\nEmbora suas roupas estejam mais leves, nem seu modo peculiar de falar nem seu poder de fogo diminuíram um só instante. Assim como seu novo traje feito sob medida, ela manuseia sua arma com ousadia."
10123-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e líder da \"Sanctus\", uma das facções estudantis que compõem a Trinity, aproveitando as férias de verão com total tranquilidade.\n\nEntrou em modo de férias e está mais do que pronta para curtir o verão. Embora já tivesse o hábito de agir no próprio ritmo, agora parece deixar transparecer um lado ainda mais livre e descontraído."
10123-CharacterSSRNewJp = "Todas as coisas estão em constante mudança... e isso não se limita apenas à aparência."
