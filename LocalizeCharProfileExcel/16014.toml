16014-WeaponDescJp = "Любимое оружие Ибуки.\n\nИзначально это была просто церемониальная винтовка, подаренная ей Обществом Пандемония, но Ибуки быстро сделала её своей, украсив любимыми наклейками и аксессуарами. Это одна из её самых дорогих вещей."
16014-ProfileIntroductionJp = "Участница Общества Пандемония и своего рода его талисман.\n\nХотя Ибуки ещё учится в начальной школе Гехенны, её способности и сообразительность оценили настолько высоко, что пригласили в престижное Общество Пандемония. Она самая младшая участница и старшие постоянно её балуют. В ответ Ибуки старается не быть обузой для клуба и изо всех сил следует указаниям."
