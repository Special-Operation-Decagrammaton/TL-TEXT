16014-WeaponDescJp = "A arma que a Ibuki guarda com tanto carinho.\n\nÉ um fuzil padrão herdado de suas veteranas da \"Sociedade Pandemonium\", no qual a Ibuki colou seus adesivos favoritos e pendurou acessórios. Dizem que, para a Ibuki, é um tesouro precioso e insubstituível."
16014-ProfileIntroductionJp = "Membro da \"Sociedade Pandemonium\" da Academia Gehenna e uma garota que é como a mascote do grupo.\n\nOriginalmente ela pertencia à divisão primária da Academia Gehenna, mas teve suas habilidades reconhecidas e ingressou na \"Sociedade Pandemonium\", onde apenas as alunas mais excelentes de Gehenna podem entrar. É a mais nova do \"Pandemonium\", mas é amada por todas graças à sua fofura e dedicação. Por isso mesmo, essa garota supercomportada dá o seu melhor todos os dias para não dar trabalho às veteranas."
