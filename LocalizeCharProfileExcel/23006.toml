23006-WeaponDescJp = "Помповый дробовик Шизуко.\n\nПо словам Шизуко: «Это единственное в своём роде оружие с лёгким ароматом анмицу — фирменного блюда Момоёдо»."
23006-ProfileIntroductionJp = "Президент Отдела организации фестиваля академии Хяккияко.\n\nТалисман Момоёдо — традиционного чайного дома Хяккияко. Шизуко изображает неуклюжесть лишь потому, что это помогает её айдол-образу. На самом деле она умеет мастерски очаровывать людей и готова на всё ради успеха фестивалей и Момоёдо. При этом она плохо скрывает эмоции, поэтому друзья и Сэнсэй легко её читают."
