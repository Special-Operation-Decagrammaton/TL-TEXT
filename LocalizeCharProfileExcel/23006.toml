23006-WeaponDescJp = "A escopeta pump-action usada pela Shizuko.\n\nSegundo a própria Shizuko, trata-se de \"uma peça única no mundo, que exala até o suave aroma do anmitsu, a especialidade da Momoyodou\"."
23006-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e presidente do Comitê de Gestão de Festivais.\n\nAo mesmo tempo, é também a garota-propaganda e proprietária da tradicional casa de chá \"Momoyodou\". Normalmente ela age como \"uma garçonete atrapalhada que trabalha na Momoyodou\", mas essa é apenas uma fachada de garota-propaganda. Na realidade, é uma garota com espírito altamente profissional, capaz de fazer qualquer coisa pelo sucesso dos festivais e pelo faturamento da Momoyodou. No entanto, quando baixa a guarda, suas verdadeiras emoções transparecem na hora, de modo que não só suas amigas próximas, mas também o Sensei já descobriram tudo."
