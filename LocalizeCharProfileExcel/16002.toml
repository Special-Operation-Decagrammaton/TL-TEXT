16002-ProfileIntroductionJp = "Участница Инженерного отдела научной школы Миллениум.\n\nБолтушка, обожающая обсуждать физику, механику и всё подобное. Стоит в Миллениуме случиться проблеме с техникой, как Котори обычно первой появляется на месте и начинает объяснять, что именно происходит."
