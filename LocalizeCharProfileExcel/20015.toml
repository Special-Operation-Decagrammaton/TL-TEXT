20015-WeaponDescJp = "A pistola que a Kaede sempre carrega consigo.\n\nNa verdade, trata-se de uma pistola sinalizadora, usada quando ela encontra alguma aluna causando problemas ou quando descobre uma carta rara de Mushi Queen."
20015-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e uma integrante cheia de energia do Clube de Treino Espiritual.\n\nOriginalmente era uma garota levada que morava em uma região bem interiorana de Hyakkiyako, mas, após conhecer a Tsubaki e a Mimori por acaso, decidiu entrar para o Clube de Treino Espiritual pensando: \"Eu quero me tornar uma dama incrível como elas!\". Ela se dedica diariamente aos treinos para se aproximar de seu ideal, mas, por algum motivo, a maior parte deles acaba terminando em confusão."
20015-CharacterSSRNewJp = "Para me tornar uma dama incrível!\nVamos lá, Sensei, com tudo hoje também!"
