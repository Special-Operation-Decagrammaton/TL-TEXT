20015-WeaponDescJp = "Сигнальный пистолет, который Каэдэ всегда носит с собой.\nВ буквальном смысле это оружие для подачи сигнала при обнаружении чего-либо. Каэдэ в основном использует его, когда встречает плохого студента или редкую карту Mushiqueen."
20015-ProfileIntroductionJp = "Энергичная участница Клуба внутренней дисциплины академии Хяккияко.\n\nРаньше Каэдэ была печально известна шалостями по всему городу, но после случайной встречи с Цубаки и Мимори вдохновилась их образом настоящих леди и вступила в клуб. Каэдэ никогда не пропускает тренировки на пути к идеалу, но всё равно постоянно умудряется создавать неприятности."
20015-CharacterSSRNewJp = "Как всегда, я буду стараться изо всех сил, чтобы стать настоящей леди!"
