10029-ProfileIntroductionJp = "Участница Клуба сладостей после уроков Тринити, главная нарушительница спокойствия и самопровозглашённая романтичная натура.\n\nНацу имеет привычку неожиданно философствовать и сравнивать буквально всё с десертами, заставляя окружающих чувствовать себя неловко. Она утверждает, что всего лишь хочет поделиться со всеми своей романтикой. Впрочем, нельзя исключать, что Нацу просто разыгрывает окружающих, ведь её определение «романтики» постоянно меняется."
