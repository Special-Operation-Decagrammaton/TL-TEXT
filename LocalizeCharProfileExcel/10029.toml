10029-ProfileIntroductionJp = "Aluna da Academia Geral Trinity, principal causadora de confusões do Clube de Doces Depois da Aula e autointitulada romântica.\n\nUma garota que do nada solta reflexões estranhamente filosóficas e tem mania de comparar tudo com doces. Embora viva dizendo coisas mirabolantes e arrastando todo mundo junto, no fundo tudo nasce do seu desejo genuíno de \"compartilhar o romance com todas\". Porém, como a definição desse \"romance\" muda o tempo todo, para quem está do outro lado é impossível não sentir que está sendo enrolado por ela."
10029-CharacterSSRNewJp = "...Sensei, você já parou para refletir profundamente sobre um shortcake?"
