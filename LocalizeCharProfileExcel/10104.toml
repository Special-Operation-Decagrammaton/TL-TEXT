10104-WeaponDescJp = "Автоматическая винтовка Рэйдзё.\n\nОна модифицировала оружие ради идеальной гармонии пуль и кулаков. Бесконечные тренировки даже... немного улучшили её меткость."
10104-ProfileIntroductionJp = "Управляющая главным рестораном Променада Чёрной Черепахи — торгового объединения Шаньхайцзина — и личный телохранитель президента променада.\n\nБудучи огромной поклонницей кунг-фу, Рэйдзё при любой возможности копирует движения и фразы знаменитых мастеров боевых искусств. Вопреки прохладной и собранной внешности, внутри она действует с по-настоящему огненной страстью."
