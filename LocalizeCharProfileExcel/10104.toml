10104-WeaponDescJp = "O fuzil de assalto usado pela Reijo.\n\nRecebeu modificações próprias para harmonizar armas de fogo e artes marciais. Quanto à sua pontaria... dizem que melhorou um pouco graças ao treinamento incessante."
10104-ProfileIntroductionJp = "Aluna do Colégio Sênior Shanhaijing, gerente da matriz da \"Associação Comercial Genbu\", além de assistente da Rumi e guarda de segurança.\n\nUma verdadeira fanática por kung fu, ela tem o hábito de tentar imitar as frases e os movimentos de uma certa artista marcial famosa em qualquer lugar. Apesar da aparência fria e serena, às vezes demonstra uma paixão ardente."
