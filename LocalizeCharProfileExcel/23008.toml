23008-ProfileIntroductionJp = "Искренняя и доброжелательная участница Сестринства.\n\nМари всегда приветствует студентов Тринити тёплой улыбкой. Несмотря на милую внешность, многие приходят к ней за советом благодаря спокойной и расслабляющей атмосфере рядом с ней. Она строга к себе и постоянно считает, что ей чего-то не хватает, но мечтает стать такой же великой Сестрой, как её старшие."
