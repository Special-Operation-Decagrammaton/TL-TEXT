23008-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota devota e sincera da Irmandade.\n\nÀ primeira vista, causa uma impressão adorável, mas é sobretudo sua aura serena e o sorriso suave que nunca sai de seu rosto que atraem inúmeras alunas em busca de conselhos. Ela ainda se considera inexperiente e deseja se tornar o quanto antes uma irmã exemplar como suas veteranas."
