10065-WeaponDescJp = "Кахо почти никогда не расстаётся со своей винтовкой.\n\nЕё создали специально ради одной цели — продвигать уникальный стиль и культуру Хяккияко. Пусть оружие и предназначено для рекламы, оно всё равно отлично ставит нарушителей на место."
10065-ProfileIntroductionJp = "Вице-президент академии Хяккияко и главный стратег Группы поддержки по связям с общественностью, туризму и культуре.\n\nКак участница клуба Инь-Ян она отвечает за рекламу и продвижение Хяккияко. Поэтому Кахо, естественно, большая поклонница всего, что связано с академией, и искренне заботится о студентах, которые вместе создают любимую ею культуру. Некоторые даже шепчутся, что Кахо ощущается большим президентом, чем настоящий президент. Среди эксцентричных участниц клуба Инь-Ян она единственная обладает здоровой долей здравого смысла, и уже одно это делает её незаменимой."
10065-CharacterSSRNewJp = "Позвольте показать вам безупречное очарование Хяккияко, Сенсей."
