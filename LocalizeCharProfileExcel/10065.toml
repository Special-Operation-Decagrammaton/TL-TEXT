10065-WeaponDescJp = "O fuzil usado habitualmente pela Kaho.\n\nFeito sob encomenda por ela mesma com o intuito de transmitir as maravilhas de Hyakkiyako. Além de ser útil para relações públicas, seu poder de fogo é mais do que suficiente para acalmar as alunas problemáticas da academia."
10065-ProfileIntroductionJp = "Vice-presidente do Clube Yin-Yang da Academia Aliada Hyakkiyako e líder estratégica do Departamento de Apoio à Divulgação da Indústria Cultural e Turística.\n\nUma garota que ama a cultura de Hyakkiyako mais do que ninguém e preza profundamente pelas alunas que a constroem. Por conta dessa postura, algumas estudantes de Hyakkiyako chegam a chamá-la de \"Kaho-san, que parece mais presidente do que a própria presidente\". Aliás, dizem que dentro do Clube Yin-Yang ela ocupa a rara e valiosa posição de pessoa com bom senso."
10065-CharacterSSRNewJp = "Transmitirei ao Sensei também\nos diversos encantos de Hyakkiyako."
