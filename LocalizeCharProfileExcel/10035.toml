10035-WeaponDescJp = "O fuzil de precisão que a Ui utiliza quando o barulho ao redor começa a passar dos limites.\n\nComo o próprio nome indica, é capaz de fazer o alvo ficar em silêncio rapidinho."
10035-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e presidente do Comitê de Biblioteca.\n\nUma garota que ama livros acima de tudo e que — sem saber o que veio primeiro, o ovo ou a galinha — também tem bastante aversão a pessoas. Entre todos os livros, tem predileção especial por obras antigas, passando os dias trancada em um lugar chamado \"Biblioteca Antiga\", onde decifra e cuida de tomos raros. Sua curiosidade intelectual, bem como seu conhecimento e técnica com livros antigos, são de primeira linha, a ponto de ser conhecida ao redor pelo título de \"Maga da Biblioteca Antiga\"."
10035-CharacterSSRNewJp = "H-Hum, por favor, façam um pouco mais de silêncio..."
