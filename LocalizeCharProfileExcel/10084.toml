10084-WeaponDescJp = "A pistola que a Kotama sempre carrega consigo.\n\nCom o ruído dos disparos suprimido ao extremo, esta arma permite cumprir missões até mesmo no silêncio das montanhas sem alertar os animais selvagens."
10084-ProfileIntroductionJp = "Integrante da Veritas, vestida com roupas bem quentinhas para encarar o frio do inverno.\n\nEmbora não tivesse a menor vontade de sair de casa, decidiu encarar a situação pelo lado positivo, vendo-a como uma oportunidade para gravar sons da natureza que normalmente são difíceis de captar. Ela adora todo tipo de som que pode ser gravado em ambientes naturais, mas dizem que seu som favorito continua sendo, sem dúvida, a voz do Sensei."
10084-CharacterSSRNewJp = "Eu estava esperando ouvir os passos do Sensei se aproximando."
