10084-ProfileIntroductionJp = "Специалист Veritas по наблюдению, одетая для холодной погоды.\n\nСначала Котама сопротивлялась требованиям Чихиро выбраться на природу, но возможность записать множество природных звуков её заинтересовала. Ей действительно нравятся разные звуковые пейзажи этой поездки, хотя голос Сэнсэя всё равно остаётся любимым."
