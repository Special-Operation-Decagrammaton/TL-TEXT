10022-WeaponDescJp = "Многоцелевой пулемёт, которым Хина владеет так же естественно, как собственной рукой.\n\nДаже когда хозяйка отдыхает от дел Гехенны на пляже, беспощадность оружия никуда не исчезает."
10022-ProfileIntroductionJp = "Старший префект Академии Геенна, приехавшая на пляж ради летнего тренировочного лагеря.\n\nОбычно Хина ко многому относится без энтузиазма, но её всё же уговорили приехать на море ради тренировок. На пляже она бывает редко, поэтому купальник и круг у неё немного старомодные. Её слегка смущает, что они всё ещё подходят по размеру. Однако даже летом и перед бушующим морем Хина не перестаёт следить за дисциплиной."
10022-CharacterSSRNewJp = "Мои обязанности не меняются только потому, что наступило лето."
