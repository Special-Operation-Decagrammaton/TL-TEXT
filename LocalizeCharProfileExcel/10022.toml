10022-WeaponDescJp = "Uma metralhadora que a Hina manuseia como se fosse uma extensão do próprio corpo.\n\nMesmo diante do mar, o rigor do seu poder de fogo continua inalterado."
10022-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente do Comitê Disciplinar, que veio à praia para o acampamento de treinamento de verão.\n\nEmbora ache tudo um saco por natureza, desta vez veio até a praia resignada por se tratar de um treinamento. Como quase nunca brincou no mar, parece ter trazido tanto o maiô quanto a boia que usava antigamente. Ela diz que é \"para não desperdiçar\", mas no fundo se incomoda um pouquinho com o fato de aquele maiô antigo ainda servir. Porém, não importa a roupa, que seja verão ou que esteja na praia: seu rigor com a disciplina continua exatamente o mesmo."
10022-CharacterSSRNewJp = "Não é porque é verão que o meu trabalho muda."
