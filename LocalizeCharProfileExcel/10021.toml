10021-WeaponDescJp = "O fuzil de assalto empunhado pela Azusa.\n\nAo contrário de sua dona, cujo coração está secretamente acelerado ao ver o mar, a arma mantém o mesmo brilho sereno de sempre."
10021-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e a \"Bruxa do Gelo\" do Clube de Aulas de Recuperação em sua primeira viagem à praia.\n\nPara não dar trabalho a ninguém, ela havia decidido \"manter a calma habitual\", mas pelo visto as amigas que vieram junto conhecer o mar não vão deixá-la ficar parada num canto. Somando o fato de ser sua primeira vez na praia com os olhares ao redor e um leve nervosismo com tudo isso, ela está bem mais inquieta do que de costume."
10021-CharacterSSRNewJp = "...Primeiro, preciso me acostumar com o mar."
