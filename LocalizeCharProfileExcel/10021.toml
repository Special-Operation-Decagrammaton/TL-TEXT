10021-WeaponDescJp = "Штурмовая винтовка Адзусы.\n\nОна непрерывно сияет ярким светом — совсем не так, как её застенчивая хозяйка, пытающаяся скрыть восторг от пляжа."
10021-ProfileIntroductionJp = "Ледяная королева Клуба дополнительных занятий впервые приезжает на пляж.\n\nАзуса старается, как обычно, сохранять спокойствие, чтобы не доставлять другим проблем, однако подруги хотят, чтобы она по-настоящему насладилась первой поездкой к морю. Из-за этого Азуса переживает, что о ней подумают окружающие, хотя для друзей она всё та же привычная Азуса."
10021-CharacterSSRNewJp = "Пляж... Я всё ещё к нему не привыкла."
