10046-WeaponDescJp = "Любимый пистолет-пулемёт Идзуны. Самый современный инструмент ниндзя! Он полностью водонепроницаемый, поэтому им можно пользоваться даже в море. Изуна даже умеет делать им массаж плеч своему господину."
10046-ProfileIntroductionJp = "Участница Клуба исследования ниндзюцу академии Хяккияко, отправившаяся на пляж ради летней тренировки.\n\nИзуна — ниндзя, которая всегда полна энергии. В последнее время её энергии будто стало на 200% больше обычного — вероятно, она просто обожает летнее солнце. Чтобы стать ниндзя, способной выдерживать жару, Изуна «тренируется» со своим господином Сэнсэем, хотя на деле в основном просто наслаждается летом."
10046-CharacterSSRNewJp = "Этим летом я буду усердно тренироваться с господином!"
