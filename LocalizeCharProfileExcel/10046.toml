10046-WeaponDescJp = "A submetralhadora favorita da Izuna.\n\nPor ser literalmente uma ferramenta ninja de última geração, conta com impermeabilização completa! Ou seja, pode ser usada até debaixo d'água. Não há brechas nas ferramentas ninjas dedicadas ao seu Mestre."
10046-ProfileIntroductionJp = "Estudante da Academia Aliada Hyakkiyako e membro do Clube de Pesquisa de Ninjutsu, que visitou a praia para treinar.\n\nIzuna já é normalmente cheia de vida, mas talvez por estar absorvendo a energia do verão, desta vez ela nos recebe com 200% de disposição. Para se tornar uma ninja ainda mais digna da estação, Izuna aproveita ao máximo mais um dia de verão — que ela chama de treino — ao lado de seu Mestre."
10046-CharacterSSRNewJp = "Neste verão também! Esta humilde Izuna\nvai treinar com todas as forças ao lado do Mestre!"
