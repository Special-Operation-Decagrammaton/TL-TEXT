26000-ProfileIntroductionJp = "Aluna da Academia Gehenna e encarregada de socorro médico do Comitê Disciplinar.\n\nUma das poucas pessoas com bom senso no Comitê Disciplinar, ela preza por normas, disciplina e procedimentos, servindo como um freio quando outras integrantes, como a Ako e a Iori, passam dos limites. Seu modo formal de falar costuma passar uma impressão fria, de \"típica membro do Comitê Disciplinar\", mas na verdade é uma garota gentil que se derrete toda diante de bichinhos fofos."
