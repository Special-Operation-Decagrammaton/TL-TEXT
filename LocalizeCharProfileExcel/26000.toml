26000-ProfileIntroductionJp = "Отвечает за медицинскую помощь в Команде Префектов Академии Геенна.\n\nЧинацу — одна из немногих здравомыслящих участниц фанатично принципиальной Команды Префектов. Обычно именно она удерживает Ако и Иори от очередного безумства. Её резкая манера речи может казаться такой же холодной, как у остальных членов Команды Префектов, но на самом деле Чинацу — добрая девушка, которая мгновенно тает при виде милых животных."
