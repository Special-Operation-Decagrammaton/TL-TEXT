10077-WeaponDescJp = "O fuzil de assalto da Ichika, que já enfrentou todo tipo de dificuldade ao seu lado.\n\nApesar da aparência cuidadosamente conservada, seu interior é feroz e está sempre ajustado para dar conta de qualquer situação."
10077-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e integrante do Comitê de Realização da Justiça, quase sempre vista com uma expressão serena.\n\nDentro do Comitê de Realização da Justiça, que reúne os mais variados perfis de alunas, ela é a principal responsável pela mediação, mantendo também uma relação relativamente boa com outras academias. Dizem que sua personalidade afável e simpática não é algo natural de nascença, mas sim fruto de muito esforço próprio."
10077-CharacterSSRNewJp = "Ué? Ainda não deu a hora combinada, né?\nAcabei fazendo você esperar?"
