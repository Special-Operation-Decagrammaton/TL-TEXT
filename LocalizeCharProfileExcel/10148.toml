10148-ProfileIntroductionJp = "Командир танка и член Общества Пандемониума академии Геенна.\n\nРуководитель среднего звена, которой постоянно приходится расхлёбывать последствия выходок Макото. Каникулы не стали исключением: Ироха снова оказалась втянута в очередной переполох. Обычно она лишь вздыхает и мирится с происходящим, но на этот раз неразбериха затянулась так сильно, что Ироха начала задумываться, зачем вообще остаётся в Обществе Пандемониума..."
