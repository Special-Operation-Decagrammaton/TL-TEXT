10148-ProfileIntroductionJp = "Membro da \"Sociedade Pandemonium\" da Academia Gehenna e comandante de tanque.\n\nUma gerente intermediária que vive sendo arrastada pelas confusões causadas pela Makoto. Nesta viagem, como de costume, ela acabou virando vítima mais uma vez. Normalmente ela deixaria passar apenas com um suspiro, mas em meio a uma confusão sem fim, começa a se perguntar por que ainda continua no Pandemonium..."
