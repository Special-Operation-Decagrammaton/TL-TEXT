16000-ProfileIntroductionJp = "Старшая участница Problem Solver 68.\n\nИз-за мрачного характера Харука с детства становилась мишенью для издевательств. Лишь недавно Ару помогла ей положить этому конец. С тех пор Харука стала самой молодой старшей участницей Problem Solver 68. Она робкая и обладает болезненно низкой самооценкой, но одни лишь её идеи порой делают её самой пугающей участницей клуба."
