16000-ProfileIntroductionJp = "Funcionária comum do Faz-Tudo 68, da Academia Gehenna.\n\nPor ter uma personalidade sombria e retraída, sofreu bullying desde pequena, mas conseguiu escapar disso graças à Aru. Desde então, atua no Faz-Tudo 68 ocupando o papel de caçula do grupo. É tímida e tem baixa autoestima, mas não é exagero dizer que suas ideias extremas são as mais assustadoras de todo o Faz-Tudo."
