10140-WeaponDescJp = "Пистолет-пулемёт, полученный Куруми в академии SRT.\n\nНебольшой вес и высокая устойчивость делают его удобным в паре со щитом. Он также тише большинства ПП, поэтому полезен для скрытного устранения часовых."
10140-ProfileIntroductionJp = "Передовой боец Отряда FOX академии SRT. Позывной — «FOX 3».\n\nЕё сильные стороны — выдающиеся физические способности и быстрое мышление в кризисных ситуациях, поэтому Куруми специализируется на реактивном бою. Настроение у неё скачет от крайности к крайности, а характер довольно простой, но опасные ситуации она неизменно преодолевает очень быстро.\n\nОна делает вид, что ей всё равно, но маленький рост всё же стал источником небольшого комплекса."
10140-CharacterSSRNewJp = "Если не хочешь ослепнуть,\nне смотри на мой щит."
