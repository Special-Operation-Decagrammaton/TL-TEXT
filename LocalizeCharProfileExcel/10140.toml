10140-WeaponDescJp = "Uma submetralhadora padrão fornecida pela Academia Especial SRT.\n\nLeve e altamente estável, pode ser usada em conjunto com um escudo.\nComo possui um isolamento acústico superior ao de outras submetralhadoras, também é ideal para eliminar inimigos furtivamente."
10140-ProfileIntroductionJp = "Pointman do Pelotão FOX da Academia Especial SRT. Codinome: \"FOX 3\".\n\nDotada de excelentes habilidades físicas e grande capacidade de adaptação em campo, é uma pointman especializada em combate. Tem emoções intensas e uma personalidade direta, mas graças a isso já conseguiu superar inúmeras operações difíceis.\n\nEmbora não fale muito sobre o assunto, ela tem complexo com o próprio porte físico."
