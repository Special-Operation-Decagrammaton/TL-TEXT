10053-WeaponDescJp = "As duas submetralhadoras usadas pela Yuuka.\n\nMesmo neste Festival Halo, a Lógica & Razão falam em nome dos julgamentos racionais e lógicos da Yuuka."
10053-ProfileIntroductionJp = "Estudante da Escola de Ciências Millennium e tesoureira do Seminário, vestida com seu uniforme de educação física para participar do Festival Halo.\n\nEmbora estivesse sobrecarregada com os preparativos do grande evento sediado pela Millennium, graças à consideração de outras alunas ela conseguiu dormir profundamente na véspera da abertura, chegando na melhor condição possível. Como membro do conselho estudantil da escola anfitriã e do comitê executivo, Yuuka tentava encarar o torneio de forma racional, mas a paixão pela vitória das escolas vizinhas parece estar despertando seu espírito competitivo."
10053-CharacterSSRNewJp = "Os preparativos para o Festival Halo também estão perfeitos!"
