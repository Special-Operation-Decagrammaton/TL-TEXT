10053-WeaponDescJp = "Пара пулемётов Юки.\n\nЮука никогда не расстаётся ни с логикой, ни с разумом. Будем надеяться, на фестивале они не станут для неё лишним грузом..."
10053-ProfileIntroductionJp = "Казначей Семинара, переодевшаяся в спортивную форму ради участия в Фестивале Halo Кивотоса.\n\nХотя подготовка к большому событию уже изрядно её вымотала, одной хорошей ночи сна хватило, чтобы полностью восстановиться. Как участница Семинара, Юука хочет оставаться спокойной и рассудительной представительницей совета и Миллениума, но дух соперничества других студентов оказывается заразительнее, чем она готова признать."
10053-CharacterSSRNewJp = "К Фестивалю Halo Кивотоса в этом году готова идеально!"
