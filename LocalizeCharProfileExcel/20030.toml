20030-WeaponDescJp = "O fuzil de precisão da Haruna.\n\nPara explorar o caminho da alta gastronomia, ela mantém seu olhar sempre atento e afiado."
20030-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente da Sociedade de Pesquisa Gourmet, vestida com uniforme esportivo para o Grande Festival Halo.\n\nA qualquer hora e em qualquer lugar, sua busca pela alta gastronomia continua, e ela vaga pelo evento procurando iguarias que só podem ser degustadas no Grande Festival Halo, a maior gincana esportiva de Kivotos. Talvez contagiada pela atmosfera vibrante do local, ela parece estar se divertindo um pouco mais do que de costume."
20030-CharacterSSRNewJp = "Depois de tanto exercício, imagino que tenha aberto o apetite.\nVenha, vamos embarcar juntos em uma jornada gastronômica."
