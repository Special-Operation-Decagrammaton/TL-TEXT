13003-WeaponDescJp = "O fuzil de precisão favorito da Hasumi.\n\nSeu visual esguio com um charme clássico e, em contraste, seu poder de fogo devastador se parecem muito com a própria dona."
13003-ProfileIntroductionJp = "A número 2 do Comitê de Realização da Justiça, da Academia Geral Trinity.\n\nNo lugar da presidente Tsurugi, que é o próprio símbolo do frenesi, ela também assume o papel de comandante tática do Comitê de Realização da Justiça. Por isso, à primeira vista, parece uma aluna exemplar, calma e inteligente — a própria definição de uma estudante da Trinity —, mas é uma legítima integrante do Comitê de Realização da Justiça. Mais fria e calculista do que qualquer um, às vezes também toma atitudes bem extremas."
