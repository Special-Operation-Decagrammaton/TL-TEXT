13003-ProfileIntroductionJp = "Заместитель главы Комитета правосудия Тринити.\n\nХасуми также выполняет обязанности тактического командира вместо необузданной и свирепой главы клуба Цуруги. На первый взгляд она может показаться обычным студентом Тринити, но не стоит заблуждаться — Хасуми до мозга костей участница Комитета правосудия. Иногда она с абсолютным спокойствием совершает невероятно безрассудные поступки."
