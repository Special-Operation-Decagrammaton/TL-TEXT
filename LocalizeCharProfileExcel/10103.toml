10103-ProfileIntroductionJp = "Марина надела ципао для обменного мероприятия с Шаньхайцзином.\n\nОна вовсю наслаждается обменом: умиляется пандам, признаёт гостеприимство Шаньхайцзина и так далее.\nСовершенно непривычный по сравнению с одеждой Красной Зимы стиль немного смущает Марину, зато окружающим явно нравится."
