10048-ProfileIntroductionJp = "Лидер Отряда Ариус — элитного подразделения спецназа академии Ариус.\n\nУ неё есть холодная сторона: ради цели она готова использовать любые необходимые средства и методы. При этом Саори страстная и честно выражает свои эмоции. В партизанской тактике ей нет равных, зато в повседневной жизни ей сильно не хватает здравого смысла. Говорят, что боевая мощь Отряда Ариус — результат полного прохождения тренировочной программы Саори."
