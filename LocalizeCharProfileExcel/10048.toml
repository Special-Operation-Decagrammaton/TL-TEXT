10048-WeaponDescJp = "O fuzil de assalto usado pela Saori.\n\nPersonalizado de forma exclusiva por ela em busca da eficiência absoluta. Uma vez que trava na presa, jamais deixa o alvo escapar até abatê-lo."
10048-ProfileIntroductionJp = "Estudante da Escola Filial Arius e líder do Esquadrão Arius, conhecido dentro da academia como uma tropa de elite especial.\n\nUma garota em quem coexistem uma postura fria, que não mede esforços nem métodos para alcançar seus objetivos, e momentos em que deixa transparecer intensas emoções. Embora seja uma especialista inigualável em táticas de guerrilha, às vezes mostra um lado um tanto ingênuo e alheio ao mundo no dia a dia. Dizem que a força de combate do Esquadrão Arius é fruto direto dos treinamentos supervisionados por ela."
10048-CharacterSSRNewJp = "Ainda estou perdida no meio do caminho...\nMesmo assim, algum dia..."
