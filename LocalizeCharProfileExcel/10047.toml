10047-WeaponDescJp = "O precioso lança-granadas da Chise.\n\nDesta vez, seguindo uma ideia do Sensei, haicais sobre o verão escritos pela própria Chise foram gravados nas munições. É um item único e muito querido por ela, que não está à venda."
10047-ProfileIntroductionJp = "Estudante da Academia Aliada Hyakkiyako e a garota avoada do Clube Yin-Yang, que continua distraída como sempre mesmo sob o sol de verão.\n\nTalvez seu carisma de idol (?) tenha aumentado ao colocar o traje de banho, pois dizem que os gritos dos fãs que a observavam tinham um fervor que não perdia em nada para o sol escaldante. Porém, ela mesma não demonstra se importar nem um pouco. Hoje também, Chise passa um verão gratificante procurando coisas brilhantes ao lado do Sensei."
10047-CharacterSSRNewJp = "O mar está cheio de coisas misteriosas, né~?"
