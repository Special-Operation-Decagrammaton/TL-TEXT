16001-ProfileIntroductionJp = "Агент C&C — секретной организации Миллениума.\n\nОбладая звериным чутьём и интуицией, Асуна — опытный ветеран, успешно преодолевший бесчисленные испытания под позывным Zero-One. При этом она совершенно непредсказуема: может раскрыть личность на секретном задании или без раздумий разнести всё подозрительное. И всё же в конце она неизменно добивается отличного результата."
