16001-WeaponDescJp = "O fuzil de assalto usado pela Asuna.\n\nTem um nome bem animado e divertido, mas ao que tudo indica, ela acabou esquecendo a origem dele."
16001-ProfileIntroductionJp = "Agente da organização secreta \"C&C\", da Escola de Ciências Millennium.\n\nSeu codinome é \"Zero Um\", uma veterana que já superou inúmeros obstáculos graças aos seus sentidos aguçados e à sua intuição quase animal. Durante as missões, ela costuma tomar várias atitudes difíceis de entender — como confiar nos outros do nada e revelar sua identidade, ou destruir tudo o que parece suspeito —, mas no fim sempre entrega ótimos resultados."
