10039-ProfileIntroductionJp = "Aluna da Academia Especial SRT e atiradora de elite do Pelotão RABBIT.\n\nIngressou na Academia Especial SRT após ter seu talento como sniper reconhecido, mas a academia foi fechada repentinamente. Atualmente, vive acampada em um parque junto com as demais integrantes de seu pelotão. Sua presença é tão apagada que, embora isso seja muito útil em missões de tocaia, faz com que seja esquecida com frequência não só pelos inimigos, mas até pelas próprias aliadas. Seu codinome é \"RABBIT 4\"."
