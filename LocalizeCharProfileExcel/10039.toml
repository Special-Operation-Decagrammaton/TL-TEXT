10039-ProfileIntroductionJp = "Снайпер Отряда RABBIT академии SRT. Позывной — «RABBIT 4».\n\nМию приняли в SRT благодаря врождённому снайперскому таланту, но робость и застенчивость постоянно мешали ей. Едва она почувствовала, что нашла своё место, академию закрыли, и Мию вместе с отрядом стала жить лагерем в парке. Её почти незаметное присутствие делает её отличным снайпером, но порой даже союзницы забывают, что она рядом."
