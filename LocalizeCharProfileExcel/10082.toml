10082-WeaponDescJp = "O fuzil favorito da Renge.\n\nTrata-se de um fuzil padrão da Hyakkaryouran modificado pela própria Renge, sendo seu parceiro de confiança na hora de avançar para o ataque. A arte de tiro da Hyakkaryouran utilizando esta arma é simplesmente inigualável."
10082-ProfileIntroductionJp = "Estudante da Academia Aliada Hyakkiyako e comandante de vanguarda do Comitê de Mediação de Conflitos Hyakkaryouran.\n\nDona de um forte senso de justiça e de um coração caloroso, ela cuida muito bem de suas calouras, mas, por não pegar leve nos treinamentos da Hyakkaryouran, às vezes acaba virando uma instrutora linha-dura. Embora não se arrependa de ter entrado para o comitê, carrega a insegurança de talvez não estar aproveitando sua juventude como deveria. Talvez por isso mesmo, viva em busca de uma juventude digna dos mangás e romances. Mais um dia começa para essa garota sonhadora, que se dedica aos treinos com o coração cheio de expectativa por um encontro do destino."
10082-CharacterSSRNewJp = "A história da minha juventude começa agora!"
