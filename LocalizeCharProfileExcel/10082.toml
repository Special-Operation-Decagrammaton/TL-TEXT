10082-WeaponDescJp = "Любимая винтовка Рэнгэ.\n\nЦеремониальная винтовка Хяккарёран, модифицированная под её уникальный стиль. Надёжный спутник, который ни разу её не подвёл. В сочетании с отличной меткостью Рэнгэ это смертельно опасное оружие."
10082-ProfileIntroductionJp = "Капитан штурмового отряда Совета урегулирования Хяккарёран академии Хяккияко.\n\nУ Рэнгэ сильное чувство справедливости и долга. За строгие методы обучения её часто называют Дисциплинатором Хяккарёран. При этом она мягкосердечна и искренне заботится о младших. Рэнгэ всегда гордилась обязанностями в Хяккарёран и ценила каждую минуту в клубе, но иногда жалеет, что юность проходит мимо, пока она погружена в работу. Она любит тренировки и стрельбу, но в душе идеалистка, мечтающая о жизни как в манге и кино."
10082-CharacterSSRNewJp = "Мы сами пишем историю моей юности, Сенсей!"
