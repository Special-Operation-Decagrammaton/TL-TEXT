10016-WeaponDescJp = "O fuzil de precisão usado pela Midori.\n\nTraz pendurado um acessório que ganhou de sua querida irmã mais velha; dizem que, quando está em apuros, ficar mexendo nele faz a inspiração surgir."
10016-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e ilustradora do Clube de Desenvolvimento de Jogos.\n\nUma garota que, ao lado de sua irmã gêmea mais velha, Momoi, literalmente desenvolve jogos no Clube de Desenvolvimento de Jogos. Por ser tímida e reservada, no começo não combinava muito bem com o jeito extrovertido da irmã, mas a paixão em comum pelos jogos uniu as duas e hoje são inseparáveis."
