10016-WeaponDescJp = "Снайперская винтовка Мидори.\n\nНа ней закреплён аксессуар от старшей сестры. В трудную минуту Мидори машинально трогает его, и это будто помогает ей найти новую идею."
10016-ProfileIntroductionJp = "Художница Отдела разработки игр Миллениума.\n\nМидори вместе со своей сестрой-близнецом Момои занимается разработкой игр.\nРаньше её замкнутый характер часто сталкивался с общительностью старшей сестры, но теперь благодаря общей любви к видеоиграм они практически неразлучны."
