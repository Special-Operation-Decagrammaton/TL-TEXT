10036-ProfileIntroductionJp = "Трудолюбивая и добросердечная участница Сестринства.\n\nХината заботится о соборе Тринити, выполняет множество обязанностей и неизменно остаётся вежливой. Но из-за неловкости и неуверенности часто допускает ошибки. В сумке она всегда носит устанавливаемый автоматический гранатомёт и, похоже, совершенно не замечает его веса."
