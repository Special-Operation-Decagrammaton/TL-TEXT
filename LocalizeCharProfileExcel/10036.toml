10036-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota séria e dedicada da Irmandade.\n\nNa Irmandade, é responsável pela \"gestão de suprimentos da catedral e arredores\", cumprindo seu trabalho com sinceridade todos os dias. No entanto, por ser um tanto desastrada, frequentemente acumula pequenos erros e acaba perdendo a autoconfiança. Na enorme mala que carrega diariamente há lança-granadas e vários equipamentos pesados, mas ela transporta tudo aquilo com a maior leveza."
