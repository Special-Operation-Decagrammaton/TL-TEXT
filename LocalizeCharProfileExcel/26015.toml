26015-WeaponDescJp = "Ичика и эта штурмовая винтовка вместе прошли огонь и воду.\n\nС виду оружие неприметное, но грубое обращение оставило на нём немало вмятин."
26015-ProfileIntroductionJp = "Участница Комитета правосудия, которая даже на море старается сохранять расслабленный настрой.\n\nИчика известна добротой и лёгким характером, но встреча с худшим врагом серьёзно испытывает её терпение. Она не собирается этого делать, однако стресс заставляет её честнее показывать настоящие чувства."
