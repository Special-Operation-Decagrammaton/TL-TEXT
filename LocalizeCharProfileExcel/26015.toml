26015-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e integrante do Comitê de Realização da Justiça, que se esforça para manter a compostura mesmo na praia.\n\nConhecida como uma integrante exemplar, sempre sorridente e gentil do Comitê de Realização da Justiça, ela está tendo sua paciência testada como nunca após reencontrar a pior inimiga natural de sua vida. Embora não perceba, suas emoções estão transparecendo no rosto com mais facilidade do que de costume."
