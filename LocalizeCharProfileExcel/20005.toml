20005-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota sensível do Clube de Aulas de Recuperação que foi à praia com suas amigas.\n\nPela Azusa, que nunca havia visto o mar, ela tomou a atitude absurda de roubar (ou \"pegar emprestado\", segundo ela mesma) às escondidas um tanque Crusader da Trinity. Porém, como era de se esperar, foi descoberta pelo Comitê de Realização da Justiça e acabou se envolvendo em uma grande confusão a partir disso. Mesmo pilotando um tanque, seu jeito atrapalhado continua o mesmo e, por conta do poder de fogo do veículo, ela acaba contribuindo para tornar o tumulto ainda maior."
20005-CharacterSSRNewJp = "Hum... É um maiô normal, viu?"
