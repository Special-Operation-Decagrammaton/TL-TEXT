20005-ProfileIntroductionJp = "Дружелюбная участница Клуба дополнительных занятий Тринити, приехавшая на пляж вместе с подругой.\n\nОна тайком одолжила танк Crusader ради подруги, которая никогда раньше не была на море. К несчастью, Комитет правосудия всё выяснил, и Хифуми серьёзно влипла. Но это не мешает ей счастливо кататься на одолженном танке — всё так же немного неуклюже."
