10075-ProfileIntroductionJp = "Участница Фронта освобождения знаний — книжного клуба академии Красная Зима.\n\nВ отличие от своей одноклубницы Момидзи она не только читает фанатские книги, но и сама их создаёт. Под псевдонимом «Мэрури» она черпает вдохновение в драме между другими студентами. Даже вражда между Тринити и Гехенной уже попадала на её страницы, благодаря чему Мэру стала известна и за пределами Красной Зимы."
