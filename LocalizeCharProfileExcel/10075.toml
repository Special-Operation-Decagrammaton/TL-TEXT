10075-WeaponDescJp = "Uma pistola de fabricação especial exclusiva da Meru.\n\nUma arma que personifica as angústias de sua dona. Dizem que recebeu esse nome simplesmente porque ela não conseguiu pensar em nenhum outro melhor."
10075-ProfileIntroductionJp = "Estudante da Academia Federal Red Winter e integrante do comitê de biblioteca \"Frente de Libertação do Conhecimento\".\n\nDiferente da Momiji, sua colega na Frente de Libertação do Conhecimento, ela não apenas aprecia obras derivadas de fãs como também cria as suas próprias, usando o pseudônimo \"Merory\". Costuma se inspirar nas relações entre alunas que parecem se dar muito bem — ou muito mal —, produzindo doujinshis baseados em pessoas reais. Como até as estudantes da Trinity e da Gehenna, que são rivais históricas, servem de \"material criativo\" e são frequentemente desenhadas por ela, a infâmia de Meru já ecoa muito além dos muros de sua academia."
10075-CharacterSSRNewJp = "Preciso... ficar acordada...\nTenho que... terminar o manuscrito..."
