10108-ProfileIntroductionJp = "Бухгалтер Семинара в пижаме, решившая наконец спокойно отдохнуть. Юука всегда выполняет обязанности идеально и вовремя, но постоянные школьные проблемы вместе с хронической бессонницей мешают нормально спать. Она вооружилась пушистой подушкой и мягкой удобной пижамой ради идеального отдыха, однако озорные участницы Миллениума, совершенно не различающие день и ночь, явно намерены лишить её покоя."
