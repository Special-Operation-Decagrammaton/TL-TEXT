10080-ProfileIntroductionJp = "Энергичный студент средней школы Токивадай.\n\nКак одна из семи эсперов 5-го уровня Академгорода, она возглавляет крупнейшую фракцию школы Токивадай. Её способность Mental Out позволяет управлять разумом окружающих, хотя после попадания в Кивотос использовать её стало сложнее. С Мисакой Микото, тоже эспером 5-го уровня и к тому же невосприимчивой к её влиянию, у неё своеобразное соперничество."
