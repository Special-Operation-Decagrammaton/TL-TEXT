10080-ProfileIntroductionJp = "Uma estudante elegante do ensino fundamental pertencente ao Colégio Tokiwadai.\n\nLíder da maior facção dentro do prestigiado Colégio Tokiwadai, ela é uma das apenas sete \"Nível 5\" da Cidade Acadêmica. Seu poder consiste em controlar a mente alheia, habilidade conhecida como \"Domínio Mental (Mental Out)\". Contudo, desde que foi transportada para Kivotos, parece não estar conseguindo usar suas habilidades como gostaria. No fundo, não se dá muito bem com Misaka Mikoto, outra \"Nível 5\" contra quem seus poderes não funcionam."
