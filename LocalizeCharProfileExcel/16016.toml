16016-ProfileIntroductionJp = "Aluna da Academia Geral Trinity, capitã das Cavaleiras Hospitalárias e integrante do grupo de idols \"Antique Seraphim\".\n\nCom o desejo de se tornar uma \"capitã das Cavaleiras Hospitalárias mais acessível\", ela se voluntariou para o evento de idols. Mesmo vestindo um traje de idol, sua personalidade séria e teimosa não muda, mas parece que ela ficou um pouquinho mais sincera consigo mesma sobre seu gosto por coisas fofas."
