16016-ProfileIntroductionJp = "Участница айдол-группы Тринити Antique Seraphim.\n\nОна добровольно вызвалась ради того, чтобы как капитан Рыцарей исправительного курса стать более располагающей к себе. Её своеобразное чувство справедливости никуда не делось, зато Минэ честно осознала кое-что о себе: она любит милые вещи."
