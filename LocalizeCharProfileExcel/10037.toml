10037-WeaponDescJp = "A submetralhadora com carregador de tambor favorita da Marina.\n\nSua cadência de tiro assombrosa cai sem piedade sobre qualquer um que ouse questionar a autoridade de Red Winter."
10037-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter e presidente do Comitê de Segurança, responsável pela manutenção da ordem pública.\n\nPor aplicar punições implacáveis e sem conversa a quem infringe as regras escolares, tem fama de ser uma tirana fria e sem coração... ou pelo menos é o que dizem, pois na prática é do tipo impulsiva que, quando põe algo na cabeça, segue em linha reta cumprindo fielmente as ordens da Presidente Cherino. Adora a palavra \"avançar\" e resolve tudo no grito de carga. Como é sempre a primeira a sair correndo quando surge algum problema em Red Winter, pode-se dizer que é fiel ao dever — embora muitas vezes acabe se perdendo no caminho depois de avançar."
10037-CharacterSSRNewJp = "Eu não fujo nem me escondo!"
