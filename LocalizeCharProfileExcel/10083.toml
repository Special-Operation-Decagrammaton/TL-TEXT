10083-WeaponDescJp = "Винтовка, с которой Кикё почти не расстаётся.\n\nКак оперативный офицер Хяккарёран она редко бывает на передовой. Но когда всё же выходит туда, ум и это надёжное оружие неизменно приводят её к победе."
10083-ProfileIntroductionJp = "Оперативный офицер Совета урегулирования Хяккарёран академии Хяккияко.\n\nКикё превыше всего ценит логику и разум. В сочетании с глубокой преданностью Хяккарёран это делает её грозным противником. Хотя она стоит за большей частью стратегии и операций совета, Кикё никогда не пожертвует безопасностью союзника ради победы. Для неё существуют только враги и союзники. Беспощадность пугает противников, а доброта заставляет одноклубниц ценить её ещё сильнее."
10083-CharacterSSRNewJp = "Ты не пожалеешь, что встал рядом со мной.\nЯ докажу свою ценность."
