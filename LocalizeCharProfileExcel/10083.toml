10083-WeaponDescJp = "O fuzil do qual a Kikyou nunca se separa.\n\nPor atuar como estrategista de operações, é raro que ela precise usá-lo diretamente. Porém, como não hesita em servir de isca pessoalmente para garantir uma vitória perfeita, dizem que esta arma já a salvou em diversas ocasiões."
10083-ProfileIntroductionJp = "Estudante da Academia Aliada Hyakkiyako e estrategista de operações do Comitê de Mediação de Conflitos Hyakkaryouran.\n\nUma garota que preza pelo bom senso, pela lógica e pela razão. Como estrategista, dá grande importância à vitória, mas o que ela mais valoriza acima de tudo é a segurança de suas aliadas. Apesar de parecer fria à primeira vista, tem um coração gentil."
10083-CharacterSSRNewJp = "Prove para mim que a sua decisão não estava errada."
