10020-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e integrante do Clube de Aulas de Recuperação.\n\nOriginalmente pertencia ao Comitê de Realização da Justiça, mas suas notas despencaram e, correndo o risco de repetir de ano, foi transferida à força para o Clube de Aulas de Recuperação. Ela própria se considera uma aluna de elite, mas na realidade vai tão mal nos estudos que não consegue acompanhar as aulas da escola. Tem o hobby secreto (?) de colecionar revistas picantes e vive deixando a imaginação voar com coisas banais do dia a dia, morrendo de vergonha sozinha logo em seguida."
10020-CharacterSSRNewJp = "Tudo que é pervertido vai para a incineração! Incineração!"
