10020-ProfileIntroductionJp = "Участница Клуба дополнительных занятий Тринити.\n\nРаньше Кохару состояла в Комитете правосудия, но из-за плохих оценок и угрозы провала её перевели в Клуб дополнительных занятий. Она плохо успевает, хотя считает себя элитным студентом. В свободное время Кохару читает пикантную литературу и умудряется видеть непристойный подтекст в самых безобидных вещах, после чего сама же страшно смущается."
