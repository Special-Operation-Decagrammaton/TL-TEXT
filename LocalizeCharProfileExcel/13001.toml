13001-WeaponDescJp = "Многозарядный гранатомёт Чисэ.\n\nНа каждом снаряде написано хайку, которое Чисэ старательно сочинила сама.\nСейчас их можно купить в клубе Инь-Ян."
13001-ProfileIntroductionJp = "Мечтательная участница клуба Инь-Ян академии Хяккияко.\n\nЧисэ обожает традиционные занятия вроде сочинения хайку, поэтому и вступила в клуб Инь-Ян. Её необычная внешность и манера держаться вызывают зависть у многих студентов Хяккияко, но сама Чисэ, похоже, совершенно этого не замечает."
