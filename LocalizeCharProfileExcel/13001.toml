13001-ProfileIntroductionJp = "Uma garota avoada e excêntrica do Clube Yin-Yang, da Academia Aliada Hyakkiyako.\n\nEla entrou para o Clube Yin-Yang por gostar da cultura tradicional, como os haicais. Sua aparência e seus gestos exalam uma aura mística que a torna alvo de admiração entre as alunas de Hyakkiyako, mas ela mesma mal tem consciência disso."
