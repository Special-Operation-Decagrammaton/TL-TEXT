10119-WeaponDescJp = "Старая винтовка, от которой исходит ощущение силы.\n\nЭто доказательство президентской власти, передаваемое от Великого пророка Кудзунохи. Владеть Сотней лотосов может только законный преемник Хяккарёран."
10119-ProfileIntroductionJp = "Участница Совета урегулирования Хяккарёран, окружённая загадочной аурой.\n\nХотя Нагуса была лишь вице-президентом, после исчезновения бывшей президентки Аямэ именно она получила символ власти — Сотню лотосов. Нагуса нерешительна, полна страхов и неуверенности, но ради дорогих ей людей всё равно продолжает делать шаг за шагом вперёд."
