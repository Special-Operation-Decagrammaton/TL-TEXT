10119-WeaponDescJp = "Um fuzil antigo que exala uma aura misteriosa.\n\nPassada de geração em geração desde a Grande Profetisa Kuzunoha, a capacidade de empunhar a Hyakuren é a prova da sucessora legítima do Hyakkaryouran. Suas inúmeras marcas de danos e reparos contam a história e os sentimentos tecidos ao longo do tempo."
10119-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e integrante do Comitê de Mediação de Conflitos Hyakkaryouran.\n\nOriginalmente vice-presidente do Hyakkaryouran, herdou a Hyakuren após o desaparecimento da presidente anterior, Ayame. Embora seja medrosa, indecisa e tenha baixa autoestima, guarda dentro de si a força para superar o medo e seguir em frente por aqueles que lhe são importantes."
10119-CharacterSSRNewJp = "Aguardando ansiosamente pelo instante em que cem flores desabrocharão em sua plenitude."
