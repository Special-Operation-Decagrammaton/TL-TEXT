16008-WeaponDescJp = "Стандартная винтовка, полученная Фубуки в Полицейской школе Валькирии.\n\nОна довольно мощная, но из-за того, что Фубуки ленится ухаживать за оружием, работает не слишком исправно."
16008-ProfileIntroductionJp = "Беззаботная административная советница Полицейской школы Валькирии.\n\nОна поступила в Валькирию, мечтая о спокойной и ленивой жизни госслужащей. Даже когда Бюро общественной безопасности получает новое дело, Фубуки остаётся небрежной и наслаждается жизнью, не гонясь ни за деньгами, ни за славой. Больше всего она любит есть пончики под радио."
