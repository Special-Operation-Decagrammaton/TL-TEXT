16008-WeaponDescJp = "O fuzil padrão fornecido à Fubuki pela Escola de Polícia Valkyrie.\n\nPossui um alto poder de fogo próprio, mas como a Fubuki vive negligenciando a manutenção, ele não consegue atingir seu verdadeiro desempenho."
16008-ProfileIntroductionJp = "Uma aluna preguiçosa do Departamento de Segurança Comunitária, da Escola de Polícia Valkyrie.\n\nEla entrou na Escola de Polícia Valkyrie sonhando com uma vida tranquila de funcionária pública. Mesmo quando chegam reclamações ao Departamento de Segurança Comunitária, ela basicamente resolve tudo com total má vontade, curtindo uma rotina sossegada de encostada, sem ligar para dinheiro ou prestígio. O que ela mais gosta de fazer é ouvir rádio enquanto come rosquinhas."
