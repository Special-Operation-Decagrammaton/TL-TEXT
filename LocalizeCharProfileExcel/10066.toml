10066-WeaponDescJp = "Рельсотрон Арис.\n\nБлагодаря колоссальной мощности и огневой силе она поражает издалека любого врага, вставшего на пути. В голове у Арис лишь одна миссия: полностью сокрушить цель!"
10066-ProfileIntroductionJp = "Участница Отдела разработки игр Миллениума. Она носит форму горничной после того, как её приняли за участницу C&C.\n\nФорма немного отличается от привычной одежды Арис, но она полна решимости привыкнуть. Весёлая и жизнерадостная почётная горничная Арис отдаёт все силы выполнению порученных миссий."
