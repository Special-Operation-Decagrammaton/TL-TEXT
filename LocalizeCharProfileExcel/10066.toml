10066-WeaponDescJp = "O canhão elétrico (railgun) da Aris.\n\nAproveitando sua potência e poder de fogo, desta vez passou a ser utilizado para tiros de precisão. Fazer disparos de precisão com uma railgun é difícil? Bem, desde que pulverize o alvo, pode-se chamar de tiro de precisão."
10066-ProfileIntroductionJp = "Estudante da Escola de Ciências Millennium e membro do Clube de Desenvolvimento de Jogos que, após uma série de acontecimentos, acabou vestindo um uniforme de maid.\n\nEmbora ainda não esteja muito acostumada com a roupa de maid, parece estar treinando todos os dias para superar isso e se tornar uma verdadeira Herói Maid completa."
