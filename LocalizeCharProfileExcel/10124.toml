10124-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e vice-presidente do Comitê de Realização da Justiça, que veio à praia como escolta da Tea Party.\n\nPara separar bem o trabalho da vida pessoal, ela tenta não demonstrar no rosto, mas está sinceramente feliz por ter vindo ao mar. Talvez ela seja quem mais está aproveitando estas férias. Graças aos frutos de seu esforço incansável, não há nada com que se preocupar mesmo de biquíni... teoricamente."
