20039-ProfileIntroductionJp = "Президент Генрюмона — Студенческого совета, контролирующего всё происходящее в академии Шаньхайцзин.\n\nЕё элегантная, но устрашающая манера речи и загадочная атмосфера делают Кисаки трудной для сближения. Похоже, она даже намеренно использует это впечатление в работе. Её «замаскированные поездки под прикрытием», которые большинство людей вообще не замечает, для знающих становятся настоящим зрелищем."
