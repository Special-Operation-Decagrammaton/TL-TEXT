20039-ProfileIntroductionJp = "Aluna do Colégio Sênior Shanhaijing e líder do conselho estudantil \"Genryumon\".\n\nSeu modo de falar arcaico e imponente, somado a uma aura quase mística, faz com que ela transmita a impressão de ser alguém inacessível. Na verdade, dizem que ela mesma tira proveito dessa imagem no exercício de suas funções. Poucos percebem quando ela ocasionalmente sai disfarçada pelas ruas da cidade, mas aqueles que conhecem sua verdadeira natureza a observam com carinho."
