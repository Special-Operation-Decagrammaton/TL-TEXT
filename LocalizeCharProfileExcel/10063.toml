10063-ProfileIntroductionJp = "Estudante da Escola de Ciências Millennium e a garota prodígio encrenqueira do conselho estudantil, o \"Seminário\".\n\nPossui um talento nato para decifrar códigos matemáticos, embora ela mesma não tenha a menor consciência disso. Além disso, adora elementos que envolvem a sorte fora de seu controle, testando a própria sorte das mais variadas formas. Mesmo diante das dificuldades, ela nunca desiste."
