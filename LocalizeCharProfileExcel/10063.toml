10063-WeaponDescJp = "Пулемёт, который вместе с Коюки пережил немало испытаний.\n\nОднажды его целиком затопило морской водой, а во время ремонта изменился цвет. В остальном он по-прежнему такой же крепкий, как Коюки, которую подобные мелочи вообще не волнуют."
10063-ProfileIntroductionJp = "Гениальная, но крайне проблемная участница Семинара Миллениума.\n\nОна совершенно не осознаёт свой непревзойдённый талант к математической дешифровке. Коюки постоянно отправляется испытывать удачу и не останавливается даже тогда, когда заходит слишком далеко и снова попадает в неприятности."
