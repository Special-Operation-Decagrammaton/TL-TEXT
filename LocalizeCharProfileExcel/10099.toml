10099-ProfileIntroductionJp = "Вице-президент Студенческого совета Абидоса и президент Отряда по взысканию долгов.\n\nВ этой форме Хошино оснащена военным снаряжением, которое долго держала в резерве, и полностью готова к серьёзному бою. Это всё та же Хошино, но теперь наружу вышла её серьёзная сторона."
