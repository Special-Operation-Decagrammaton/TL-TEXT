10099-WeaponDescJp = "A combinação da escopeta favorita da Hoshino com uma pistola que ela guardava com muito cuidado.\n\nSeu trunfo especial, usado quando ela muda completamente seu estilo habitual de luta e parte para a ofensiva."
10099-ProfileIntroductionJp = "Aluna do Colégio Abydos, ex-vice-presidente do Conselho Estudantil de Abydos e a preguiçosa presidente do Comitê de Contramedidas.\n\nEquipou o armamento que mantinha guardado, adotando um estilo mais voltado para o combate. Tirando isso, continua sendo a Hoshino de sempre, mas estar totalmente armada deixa transparecer um olhar sério."
10099-CharacterSSRNewJp = "Esta velhinha aqui vai pegar um pouquinho mais pesado.\nUé~, dá até um pouco de vergonha dizer isso."
