26005-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e integrante do Clube de Doces Depois da Aula.\n\nUma garota complexada com sua altura e tipo físico, que vive na defensiva feito um bichinho pequeno. Ela quer sempre parecer mais madura, mas como tudo o que pensa fica estampado na cara, todos ao redor continuam tratando-a com mimo. É apenas quando está praticando seu hobby de visitar cafeterias e saboreando doces de edição limitada que ela abre um sorriso mais radiante do que o de qualquer um."
