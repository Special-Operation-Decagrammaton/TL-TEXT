26005-ProfileIntroductionJp = "Участница Клуба сладостей после уроков Тринити.\n\nКомплекс из-за роста заставляет её напоминать маленького сердитого зверька. Она постоянно старается казаться взрослее, но привычка открыто показывать эмоции нередко загоняет её в неловкие ситуации. Зато в десертных кафе с новыми лимитированными сладостями Ёшими просто не может скрыть широченную улыбку."
