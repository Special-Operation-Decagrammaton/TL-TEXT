20007-WeaponDescJp = "Um canhão gigante usado pela Hatsune Miku para distribuir camisetas e outros brindes durante seus shows.\n\nSua superfície é equipada com LEDs que emitem luzes belíssimas no ritmo da música da apresentação."
20007-ProfileIntroductionJp = "Uma cantora virtual sempre alegre e que ama cantar.\n\nOriginalmente uma existência digital sem um corpo físico real, ela conseguiu obter uma forma física e chegar a este mundo graças à tecnologia de Kivotos. Por sua natureza como cantora virtual capaz de levar sua música além do tempo e do espaço, parece que ela também tem muitos fãs secretos aqui em Kivotos, e está super animada para o show que realizará neste mundo."
20007-CharacterSSRNewJp = "Ouçam a minha música, por favor!"
