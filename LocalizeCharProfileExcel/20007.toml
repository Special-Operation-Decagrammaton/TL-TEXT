20007-WeaponDescJp = "Огромная пушка для футболок, которой Мику запускает мерч в толпу на концертах.\n\nВ её корпус встроены диоды и другие элементы, красиво сверкающие в такт музыке."
20007-ProfileIntroductionJp = "Жизнерадостный виртуальный айдол, который обожает петь.\n\nИзначально Мику существовала только виртуально в сети и не имела физического тела, но благодаря технологиям Кивотоса смогла появиться в реальном мире как раз к своему живому выступлению. В Кивотосе у неё немало тайных поклонников благодаря способности петь сквозь время и пространство."
20007-CharacterSSRNewJp = "Пожалуйста, послушай мою песню!"
