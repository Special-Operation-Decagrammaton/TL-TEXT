16003-ProfileIntroductionJp = "Участница Отряда дружинников, защищающего студентов Тринити.\n\nЧтобы противостоять участившимся нападениям на студентов Тринити со стороны других академий, Сузуми добровольно начала патрулировать улицы и пресекать нападения. Из-за сильного чувства справедливости её часто ошибочно считают холодной и бесчувственной, хотя на самом деле у неё есть и дружелюбная сторона."
