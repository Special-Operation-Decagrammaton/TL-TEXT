16003-ProfileIntroductionJp = "Membro do Corpo de Vigilantes da Trinity, da Academia Geral Trinity, que protege a segurança das alunas.\n\nComo incidentes em que alunas da Trinity eram atacadas por outras academias começaram a ocorrer com frequência, ela passou a patrulhar as ruas para impedi-los. Por causa de seu senso de justiça ardente, costuma ser mal-interpretada como alguém fria, mas na verdade é uma garota muito gentil."
