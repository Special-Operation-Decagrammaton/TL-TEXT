26001-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e hacker do grupo \"Veritas\".\n\nUma garota um tanto peculiar cuja especialidade é a escuta clandestina e que adora ouvir conversas secretas alheias. Ela tem dificuldade em lidar com pessoas e é do tipo que acaba falando com formalidade até mesmo com calouras do 1º ano mais novas que ela. Na vida real, é tímida e de poucas palavras, mas na internet fala pelos cotovelos."
