26001-ProfileIntroductionJp = "Хакер Veritas — печально известной хакерской группы научной школы Миллениум.\n\nЕё специализация — прослушка, и Котама получает огромное удовольствие от подслушивания чужих личных разговоров. В общении она неловка и даже к младшим обращается подчёркнуто вежливо. В реальной жизни Котама тихая и застенчивая, зато в сети неожиданно красноречива."
