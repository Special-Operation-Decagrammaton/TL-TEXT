10139-WeaponDescJp = "Uma escopeta padrão fornecida pela Academia Especial SRT.\n\nDe ação por bombeamento (pump-action), apresenta um excelente desempenho até mesmo em invasões táticas."
10139-ProfileIntroductionJp = "Vice-líder do Pelotão FOX da Academia Especial SRT. Codinome: \"FOX 2\".\n\nCom sua personalidade gentil e serena, ela faz amizade facilmente com qualquer pessoa. Por isso, na Academia SRT, muitas veteranas e calouras de outros pelotões também recorrem a ela. Especialista em infiltração e sabotagem disfarçada, ela também acumula a função de gerenciar e administrar o pelotão.\n\nSua especialidade é preparar inarizushi. Ela costuma fazer para as marmitas das colegas de pelotão e, como o sabor é excelente, faz muito sucesso em toda a Academia SRT."
10139-CharacterSSRNewJp = "FOX 2, os suprimentos estão prontos."
