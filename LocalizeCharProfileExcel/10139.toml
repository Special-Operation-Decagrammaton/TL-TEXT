10139-ProfileIntroductionJp = "Заместитель лидера Отряда FOX академии SRT. Позывной — «FOX 2».\n\nУ Нико добрый и непритязательный характер, поэтому она легко заводит друзей. Благодаря этому многие младшие студенты SRT полагаются на неё независимо от своего отряда. Её характер помогает добиваться отличных результатов в операциях по проникновению и под прикрытием, а ещё Нико ведёт административные и оперативные дела отряда.\n\nЕё фирменное блюдо — инаридзуси; иногда она собирает бэнто с инаридзуси для участниц отряда. Готовит она настолько хорошо, что в SRT её инаридзуси получили высочайшие оценки."
