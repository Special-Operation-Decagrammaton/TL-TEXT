10055-WeaponDescJp = "O lança-granadas que a Shigure costuma carregar por aí.\n\nQualquer um atingido em cheio por suas granadas fica completamente tonto, fazendo jus ao nome da arma."
10055-ProfileIntroductionJp = "Estudante da Academia Federal Red Winter que, após receber uma suspensão, cumpre detenção na Classe Especial Nº 227, no prédio antigo da escola.\n\nO motivo da suspensão foi ter misturado álcool secretamente no \"Kompot de distribuição\". Ela é amiga de infância da Nodoka, também da Classe Especial Nº 227, e há boatos de que teria causado o incidente de propósito depois que Nodoka foi enviada para lá como punição disciplinar. Independentemente da verdade por trás do caso, ela adora o Kompot que ela mesma prepara e vive carregando a bebida em um cantil de bolso."
10055-CharacterSSRNewJp = "Precisa de algo para esquentar o corpo?\nHehe... deixa comigo."
