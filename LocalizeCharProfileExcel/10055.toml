10055-WeaponDescJp = "Многозарядный гранатомёт, с которым Шигурэ почти не расстаётся.\n\nЛюбого, кого заденет его граната, хорошенько оглушит."
10055-ProfileIntroductionJp = "Студент академии Красная Зима, отстранённая от занятий и находящаяся на испытательном сроке в Старом институте № 227.\n\nЕё отстранили за то, что она подмешала алкоголь в школьный компот. С Нодокой из Спецотряда № 227 она знакома давно. Ходят слухи, что Шигурэ специально устроила неприятности после ссылки Нодоки в Старый институт, чтобы отправиться туда вместе с ней. Правда это или нет, Шигурэ обожает домашний компот и всегда носит фляжку в кармане."
10055-CharacterSSRNewJp = "Нужно место, где можно согреться? Хи-хи... Только скажи."
