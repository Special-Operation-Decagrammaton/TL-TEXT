10057-WeaponDescJp = "O fuzil de precisão manuseado pela Haruna.\n\nMesmo que o ano mude, não há parceiro mais digno para sua busca gastronômica do que esta arma."
10057-ProfileIntroductionJp = "Estudante da Academia Gehenna e presidente da Sociedade de Pesquisa Gourmet, vestida com um quimono para celebrar o Ano-Novo.\n\nGuiada pela convicção de que vestir-se de acordo com a estação também faz parte da busca pela alta gastronomia, ela trilha seu caminho gourmet usando um traje de gala tradicional. Pela aparência, não passa de uma dama incrivelmente elegante, mas... rezemos para que sejam servidos pratos à altura do seu paladar."
10057-CharacterSSRNewJp = "Os pratos desta época do ano são todos tão encantadores...\nFalando em Ano-Novo, temos osechi, ozouni, oshiruko...\nAh... já estou ficando com fome."
