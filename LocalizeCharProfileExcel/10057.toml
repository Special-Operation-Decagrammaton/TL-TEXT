10057-ProfileIntroductionJp = "Президент Общества гурманов, нарядившаяся в кимоно на Новый год.\n\nОна считает, что для гурмана важна каждая деталь: не только время и место трапезы, но и подходящий наряд. Поэтому путь высокой кухни в Новый год она проходит именно в кимоно. Харуна выглядит элегантной и утончённой, но... если подать ей блюдо, не соответствующее стандартам, лучше держаться подальше."
