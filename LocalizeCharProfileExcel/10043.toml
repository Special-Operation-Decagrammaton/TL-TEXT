10043-WeaponDescJp = "O fuzil favorito da Wakamo.\n\nAssim como o humor eufórico da Wakamo com a chegada do verão, o cano de sua arma dispara fagulhas carmesins ardentes como o sol contra qualquer um que se meta no seu caminho."
10043-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako, uma das \"Sete Prisioneiras\" e uma garota que desabrochou ainda mais deslumbrante com a chegada do verão.\n\nO único motivo para ela ter vindo à praia de biquíni foi mostrar seu visual ao Sensei. O único motivo para ela conseguir sorrir é ter conhecido o Sensei. Debaixo do sol escaldante de verão, ela avança sobre o Sensei com uma paixão ainda mais intensa que o calor. A versão de verão da garota que continua se entregando de corpo e alma ao amor mais do que qualquer outra."
10043-CharacterSSRNewJp = "Fufufu... Por favor, não desvie os olhos desta Wakamo\nnem por um único segundo.\nMeu・que・ri・do♡"
