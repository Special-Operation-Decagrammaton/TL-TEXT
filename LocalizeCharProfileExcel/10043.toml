10043-ProfileIntroductionJp = "Одна из Семи заключённых. Девушка, распускающаяся летом словно яркий цветок.\n\nОна пришла на пляж в купальнике, чтобы показать его Сэнсэю, и расплылась в широкой улыбке, потому что встретила Сэнсэя как раз вовремя. Её страсть к Сэнсэю так же сильна, как летнее солнце. Она всегда изо всех сил старается стать ближе."
