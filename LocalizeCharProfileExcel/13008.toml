13008-WeaponDescJp = "O fuzil de assalto que a Serika carrega até quando vai para o trabalho de meio período.\n\nEstá sempre com a manutenção impecável, refletindo o lado meticuloso e sincero da Serika."
13008-ProfileIntroductionJp = "A tesoureira rabugenta do Comitê de Contramedidas do Colégio Abydos.\n\nReclamona, ela é do tipo que não hesita em demonstrar o que sente. Vive repetindo da boca para fora: \"Uma escola dessas bem que podia falir de uma vez!\", mas na verdade ama tanto o colégio que trabalha meio período escondida das outras para ajudar a pagar a dívida da escola."
