13008-WeaponDescJp = "Штурмовая винтовка, которую Сэрика всегда носит с собой на подработки.\n\nОна неизменно тщательно ухожена, что выдаёт аккуратность и искренность Сэрики."
13008-ProfileIntroductionJp = "Добросовестная казначей Отряда по взысканию долгов Абидоса.\n\nСэрика любит ворчать и никогда не стесняется высказывать своё мнение. Хотя она постоянно ругает академию и говорит: «Да к чёрту эту школу!», втайне она очень к ней привязана и даже подрабатывает, чтобы помочь выплачивать долги академии."
