20040-WeaponDescJp = "A pistola favorita da Satsuki.\n\nAo contrário do que sugere o nome pomposo, seu poder de fogo não é tão alto e o foco está na facilidade de manuseio, bem ao estilo da Satsuki, que detesta sentir dor."
20040-ProfileIntroductionJp = "Aluna da Academia Gehenna, integrante da \"Sociedade Pandemonium\" e diretora do departamento de inteligência.\n\nEmbora tenha aprendido diversas técnicas de hipnose para um certo plano, os casos em que obteve sucesso podem ser contados nos dedos. Mesmo acumulando fracassos, é uma garota persistente que segue em frente sem desistir. Tem uma personalidade tranquila e age no próprio ritmo. Morre de medo de insetos e de coisas assustadoras."
