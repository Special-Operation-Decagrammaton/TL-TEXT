20040-WeaponDescJp = "Любимый пистолет Сацуки.\n\nНесмотря на громкое название, в нём важнее компактность, чем мощность. Это идеально подходит Сацуки, которая всеми силами избегает боли."
20040-ProfileIntroductionJp = "Участница Общества Пандемония и директор Комитета разведки.\n\nОна невероятно мотивирована найти способ контролировать окружающих и ради этого исследует разнообразные методы гипноза. Успеха удалось добиться лишь считанные разы. Несмотря на бесконечные провалы, Сацуки не сдаётся и уверенно продолжает работу. Обычно она держится очень спокойно — пока не увидит насекомое или что-нибудь хотя бы немного страшное."
20040-CharacterSSRNewJp = "Ну-ну.\nТы ведь хочешь поклясться в верности Обществу Пандемония!"
