26002-WeaponDescJp = "A escopeta pertencente à Juri.\n\nEmbora tenha sido entregue a ela para conter as alunas problemáticas que causam tumulto no refeitório, por algum motivo ela costuma usá-la com frequência como utensílio de cozinha."
26002-ProfileIntroductionJp = "Aluna da Academia Gehenna e membro do Clube de Merenda Escolar, responsável por administrar o refeitório estudantil.\n\nAssim como a Fuuka, é uma garota que se esforça para preparar refeições para as alunas, mas suas habilidades culinárias vão muito além de ruins — são catastróficas —, de modo que ela não ajuda muito no preparo da merenda. Contudo, com o incentivo e a orientação da Fuuka, ela continua se dedicando hoje também para conseguir preparar pratos melhores."
