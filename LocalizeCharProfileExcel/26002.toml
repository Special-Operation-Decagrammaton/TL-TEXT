26002-WeaponDescJp = "Дробовик Джури.\n\nИзначально он предназначался для усмирения нарушителей порядка в столовой,\nно по какой-то причине Джури использует его как кухонный инструмент."
26002-ProfileIntroductionJp = "Участница Клуба школьных обедов, управляющего столовой академии Гехенны.\n\nКак и Фуука, Джури усердно работает и вкладывает всю душу в готовку для других студентов. Вот только готовит она настолько плохо, что результат порой выглядит чудовищно, поэтому все усилия пропадают зря. Но при поддержке и наставничестве Фуки Джури продолжает стараться и надеется однажды стать лучше."
