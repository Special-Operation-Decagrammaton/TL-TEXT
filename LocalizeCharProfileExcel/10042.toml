10042-WeaponDescJp = "A submetralhadora usada pela Atsuko.\n\nApesar do cano curto, possui um poder de fogo intenso, sendo especialmente indicada para combates a curta distância."
10042-ProfileIntroductionJp = "Aluna da Escola Filial Arius e uma garota de ar misterioso do Esquadrão Arius que está sempre usando uma máscara de gás, tornando impossível ver sua expressão.\n\nEmbora não esteja tentando esconder o rosto de propósito, passa quase o tempo todo de máscara, exceto nas horas de comer ou dormir. A líder do esquadrão, Saori, a chama de \"Princesa\", mas ela própria é uma figura enigmática que fala muito pouco sobre si."
