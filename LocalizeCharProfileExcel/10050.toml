10050-ProfileIntroductionJp = "Estudante do 1º ano do Colégio Sênior Shanhaijing que atua como instrutora do departamento de apoio educacional \"Jardim da Flor de Ameixeira\".\n\nEmbora tenha idade para estar no ensino fundamental, sua excelente capacidade de aprendizado foi reconhecida a ponto de lhe concederem autoridade de instrutora. As crianças do jardim a chamam carinhosamente de \"Kokona-chan\", mas ela não fica muito feliz com esse apelido."
10050-CharacterSSRNewJp = "Sou a Kokona, do departamento de apoio educacional \"Jardim da Flor de Ameixeira\"!\nN-Não é nada disso! Apesar da aparência, sou uma instrutora de verdade, tá bom?!"
