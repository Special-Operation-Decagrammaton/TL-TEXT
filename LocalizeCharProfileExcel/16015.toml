16015-ProfileIntroductionJp = "Membro do Clube de Doces Depois da Aula, da Academia Geral Trinity, e líder da banda formada às pressas, \"Sugar Rush\".\n\nCom o desejo de mudar seu jeito sem graça de ser, ela lidera as amigas para participar do evento de bandas. Na verdade, ela é a figura central que mantém o clube unido, mas parece que ela é a única que ainda não percebeu isso."
