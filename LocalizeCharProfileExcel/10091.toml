10091-ProfileIntroductionJp = "Участница Клуба сладостей после уроков, а также ведущая вокалистка и басистка наскоро собранной группы Sugar Rush.\n\nОна случайно стала солисткой из-за небрежно брошенной реплики, а потом уже не позволила себе отступить. Похоже, к хаосу музыкальной сцены Казуса теперь привыкла и принимает его совершенно спокойно."
