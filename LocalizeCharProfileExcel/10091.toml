10091-ProfileIntroductionJp = "Estudante da Academia Geral Trinity, integrante do Clube de Doces Depois da Aula e agora vocalista principal e baixista da banda formada às pressas, \"Sugar Rush\".\n\nPor ter deixado escapar um comentário sem pensar, acabou ficando encarregada do vocal principal. Contudo, devido à sua personalidade, fugir não é uma opção. Hoje em dia já está totalmente acostumada com as confusões barulhentas que vive ao lado das amigas, aceitando a ideia da banda com total naturalidade."
