13011-WeaponDescJp = "Штурмовая винтовка Момои.\n\nНа ней закреплён аксессуар — подарок младшей сестры. В трудной ситуации Момои вертит его в руках, и это будто помогает ей придумать новую идею."
13011-ProfileIntroductionJp = "Сценаристка Отдела разработки игр Миллениума.\n\nМомои вместе со своей сестрой-близнецом Мидори занимается разработкой игр. Раньше её беззаботный и жизнерадостный характер часто сталкивался с более замкнутым характером младшей сестры, но теперь благодаря общей любви к видеоиграм они практически неразлучны."
