13011-WeaponDescJp = "O fuzil de assalto usado pela Momoi.\n\nTem um acessório que ela ganhou de sua querida irmã mais nova e, segundo ela, mexer nele quando está sem saída faz as ideias surgirem num estalo."
13011-ProfileIntroductionJp = "Roteirista do Clube de Desenvolvimento de Jogos, da Escola de Ciências Millennium.\n\nUma garota que, junto de sua irmã gêmea mais nova, Midori, literalmente desenvolve jogos no Clube de Desenvolvimento de Jogos. Por ter uma personalidade extrovertida, no começo ela não combinava muito bem com a irmã tímida, mas a paixão compartilhada pelos jogos aproximou as duas, e hoje elas são inseparáveis."
