26006-WeaponDescJp = "Пистолет-пулемёт, который Нодока часто берёт на астрономические наблюдения.\n\nНа нём закреплён фонарик, освещающий дорогу тёмными ночами."
26006-ProfileIntroductionJp = "Студент, отстранённый от занятий в академии Красная Зима и проходящая испытательный срок в Старом институте № 227.\n\nЕё отстранили за то, что она постоянно наблюдала за Сэнсэем через телескоп. Нодока хочет видеть красоту мира и рассматривает Сэнсэя как часть этой красоты. Жизнь в Спецотряде № 227 научила её бережно обращаться с теми небольшими деньгами, которые у неё есть."
