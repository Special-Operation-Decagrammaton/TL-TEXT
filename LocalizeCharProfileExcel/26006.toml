26006-WeaponDescJp = "A submetralhadora que a Nodoka carrega consigo até quando sai para observar os astros.\n\nVem equipada com uma lanterna acoplada, iluminando bem mesmo os caminhos escuros à noite."
26006-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter que, após sofrer uma suspensão, cumpre punição atualmente na Classe Especial Nº 227, no antigo prédio escolar.\n\nDizem que o motivo da suspensão foi \"prática de stalking utilizando telescópios e afins\". Ela tem um forte desejo de observar com os próprios olhos as coisas belas do mundo, e o Sensei é um de seus alvos. Por ter passado por muitas dificuldades durante tanto tempo na Classe Especial Nº 227, acabou desenvolvendo uma mania crônica de economizar tudo."
