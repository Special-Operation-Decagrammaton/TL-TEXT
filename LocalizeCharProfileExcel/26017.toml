26017-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter que, após sofrer uma punição disciplinar, cumpre suspensão na Classe Especial Nº 183 do prédio antigo. Dentro da Classe Especial Nº 183, ocupa o cargo de sub-vice-representante de turma.\n\nAcabou indo parar na Classe Especial Nº 183 por ter inserido sua nota diretamente no gabarito do exame de admissão. É responsável pela gestão de processamento de dados e, por agir movida pela pura curiosidade, vira e mexe apronta alguma das suas. Preza suas amigas e o Sensei acima de qualquer coisa."
