26017-WeaponDescJp = "Дробовик, которым Лана пользуется постоянно. Хорошо служит во время судейства.\n\nПохоже, его же используют и когда избавляются от перфокарт."
26017-ProfileIntroductionJp = "Студент, приписанный к Федеральной академии Красной Зимы, но из-за дисциплинарного взыскания сейчас отбывает наказание в спецклассе №183 в старом корпусе. Внутри спецкласса № 183 исполняет обязанности заместителя заместителя председателя.\n\nИз-за того, что на вступительном экзамене она вписала баллы прямо в бланк с вариантами ответов, её и отправили в спецкласс № 183. Отвечает за компьютерный учёт, и в результате действий из чистого любопытства порой попадает в разные переделки. Друзей и Сенсея она ценит превыше всего."
