10097-WeaponDescJp = "Служебный пистолет Моэ из академии SRT.\n\nРама сделана из прочного молибденового сплава, поэтому оружие способно быстро стрелять даже в жарких и влажных прибрежных условиях."
10097-ProfileIntroductionJp = "Оператор Отряда RABBIT, прибывшая в отдалённую рыбацкую деревню для операции по проникновению.\n\nОна... очень хочет испытать разнообразное оружие в новой и незнакомой среде. В отличие от остальных участниц отряда Моэ носит довольно вызывающий купальник и уверяет, что он повышает разрушительность операции."
