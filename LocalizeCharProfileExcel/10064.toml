10064-WeaponDescJp = "A pistola que a Kayoko costuma carregar consigo.\n\nEmitindo um estrondo considerável a cada disparo, esta arma é eficaz não apenas para espantar clientes mal-educados, mas também para afastar os maus espíritos no Ano-Novo."
10064-ProfileIntroductionJp = "Estudante da Academia Gehenna e chefe de seção da Faz-Tudo 68, celebrando a chegada do Ano-Novo.\n\nEmbora tenha se produzido para o Ano-Novo como as outras integrantes, seu porte imponente faz parecer que ela usa esse traje todos os dias. Mesmo achando toda a confusão um incômodo, está sempre disposta a emprestar sua sabedoria pelo bem da Faz-Tudo 68."
10064-CharacterSSRNewJp = "Tomara que este ano\ntraga muitas coisas boas."
