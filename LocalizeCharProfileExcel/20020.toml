20020-WeaponNameJp = "Flor Inalcançável"
20020-WeaponDescJp = "A pistola que a Himari possui.\n\nUma arma de acabamento simples e belo. No dia a dia, é difícil ver a Himari usando-a. \"Originalmente, uma flor inalcançável não é algo que se possa contemplar com facilidade... Exatamente como eu, não acha?\", diz a própria Himari."
20020-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium, ex-presidente do grupo hacker \"Veritas\" e atual presidente da Força-Tarefa de Fenômenos Paranormais.\n\nAutoproclamada a bela hacker supergenial de saúde frágil, dizem que ela detém o título acadêmico de \"Onisciência\", o qual apenas três pessoas em toda a história da Millennium tiveram permissão para ostentar... porém, se isso é verdade ou se tal título sequer existe, tudo está envolto em mistério. Segundo a Himari, uma garota cheia de segredos é ainda mais bela... Além disso, ela é uma hacker genial de habilidade ímpar e, ao mesmo tempo, uma garota com um gosto peculiar e fascínio pelo ocultismo."
20020-CharacterSSRNewJp = "Fufu, isso quer dizer que chegou a vez da bela hacker supergenial,\npura e de saúde frágil da Millennium entrar em cena, não é?"
