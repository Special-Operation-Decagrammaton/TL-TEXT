20020-WeaponDescJp = "Пистолет Химари.\n\nОружие с простым и элегантным дизайном. Химари пользуется им редко. «Цветок, распустившийся на скалистом утёсе, — зрелище необычайное. Как и этот цветок, я тоже расцвела». — Химари"
20020-ProfileIntroductionJp = "Бывший президент Veritas, хакерского клуба Миллениума, и нынешний президент Отряда исследования сверхъестественных явлений.\n\nОна называет себя супергениальной хакершей и утверждает, что обладает степенью Всеведения, которую за всю историю Миллениума получили лишь три человека. Правда, существование такой степени никто так и не смог подтвердить. Химари это только радует: по её мнению, тайны делают девушку красивее. Но никто не спорит, что она действительно выдающийся хакер с необычной любовью к оккультизму."
20020-CharacterSSRNewJp = "Ха-ха! Неужели наконец пришло время сиять супергениальной хакерше Миллениума?"
