10015-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e integrante do Clube de Desenvolvimento de Jogos.\n\nUma garota misteriosa encontrada em ruínas, cujas informações — incluindo a própria idade — são totalmente desconhecidas. Atualmente, diverte-se jogando ao lado da Momoi, da Midori e da Yuzu, tendo se tornado uma verdadeira fanática por jogos. Seu jeito de falar às vezes soa um pouco hesitante ou artificial porque a maior parte das suas falas é composta por citações de jogos retrô."
10015-CharacterSSRNewJp = "...Estive esperando todo esse tempo pelo momento em que essa voz me invocaria."
