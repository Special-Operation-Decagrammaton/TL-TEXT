20018-WeaponDescJp = "A pistola padrão fornecida à Moe pela Academia Especial SRT.\n\nApesar de ser uma pistola, possui uma altíssima cadência de tiro, permitindo esvaziar o carregador em um instante."
20018-ProfileIntroductionJp = "Aluna da Academia Especial SRT e operadora do Pelotão RABBIT. Seu codinome é \"RABBIT 3\".\n\nIngressou na Academia Especial SRT fascinada pelo imenso poder de fogo de seu armamento, mas a academia foi fechada repentinamente e hoje ela acampa ao relento em um parque junto com as outras integrantes do pelotão. Tem o gosto peculiar de sentir prazer em explodir e destruir coisas, mas sua habilidade como operadora é indiscutível. É completamente viciada em doces e está sempre com um pirulito na boca."
20018-CharacterSSRNewJp = "Aqui é a RABBIT 3. Qual é o próximo alvo de bombardeio?"
