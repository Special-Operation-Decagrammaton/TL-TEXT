20018-ProfileIntroductionJp = "Оператор Отряда RABBIT академии SRT. Позывной — RABBIT 3.\nОна поступила в SRT, восхищаясь огромной огневой мощью академии, но та внезапно закрылась. Сейчас Моэ живёт в парке вместе с участницами своего взвода. Она странноватая и получает удовольствие от взрывов и разрушений, зато её способности оператора действительно впечатляют. Моэ обожает сахар и почти всегда держит во рту леденец."
