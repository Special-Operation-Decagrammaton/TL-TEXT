16007-WeaponDescJp = "O fuzil de precisão usado pela Tomoe.\n\nEquipado com uma mira de alta precisão, permite localizar a uma grande distância qualquer elemento rebelde que ouse questionar a autoridade da Presidente Cherino."
16007-ProfileIntroductionJp = "Chefe do gabinete de secretariado da Secretaria de Red Winter e principal assessora da Cherino na Academia Federal Red Winter.\n\nMestra da oratória, capaz de fazer qualquer coisa soar plausível quando sai de sua boca, ela frequentemente discursa em vários lugares para inspirar lealdade à Presidente Cherino. A própria Cherino acredita que \"Tomoe é leal por ter sido inspirada pelo meu carisma\", mas a verdade é que a Tomoe apenas a mima cegamente."
