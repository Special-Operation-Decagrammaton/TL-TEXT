16007-WeaponDescJp = "Длинная снайперская винтовка Томоэ.\n\nОснащена высокоточным оптическим прицелом, позволяющим замечать цели издалека и устранять любого непокорного, кто сомневается в авторитете президента Черино."
16007-ProfileIntroductionJp = "Главный секретарь Секретариата Красной Зимы и ближайшая помощница президента Черино.\n\nТомоэ — мастер речей, способная оформить и донести практически любое послание. Она регулярно выступает в академии, укрепляя преданность президенту Черино. Сама Черино уверена, что Томоэ верна ей из-за её харизмы, но на самом деле Томоэ просто считает Черино очаровательной."
