20035-WeaponDescJp = "A submetralhadora da Tsubaki.\n\nPor ser uma arma compacta que não atrapalha seu treinamento diário, parece ser bastante útil também em sua função como guia turística."
20035-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e presidente do Clube de Treino Espiritual, que nunca interrompe seu treinamento do sono a qualquer hora ou lugar.\n\nPor ocasião da excursão escolar, ela assumiu o papel de guia para apresentar Hyakkiyako, mas sem abrir mão de seu treino de dormir. Ora cochilando em pé, ora indo direto ao ponto com observações afiadas, ela dá conta das duas coisas com naturalidade."
