10049-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e membro do \"Clube de Doces Depois da Aula\", dona de uma personalidade calma e tranquila.\n\nComo não gosta de chamar muita atenção para si, costuma apenas seguir as outras integrantes em silêncio. Vive tendo trabalho por acabar envolvida nas excentricidades alheias ao seu redor, mas, por outro lado, também valoriza muito esses momentos."
