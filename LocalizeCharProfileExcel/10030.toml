10030-WeaponDescJp = "A pistola favorita da Chinatsu.\n\nCompacta e fácil de portar, é perfeita até para missões de infiltração em estâncias termais."
10030-ProfileIntroductionJp = "Aluna da Academia Gehenna e encarregada de socorro médico do Comitê Disciplinar de Gehenna, que por acaso visitava a estância termal de Red Winter a trabalho.\n\nDesde o pedido de novos suprimentos médicos até lidar com o Clube de Desenvolvimento de Fontes Termais de Gehenna, mesmo em uma estância termal os problemas que lhe dão dor de cabeça se acumulam aos montes. Ainda assim, talvez pela bela paisagem e pelo clima relaxante das termas, sua expressão está mais suave do que de costume."
