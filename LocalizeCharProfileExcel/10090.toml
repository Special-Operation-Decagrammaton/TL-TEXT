10090-WeaponDescJp = "O fuzil de assalto favorito da Umika.\n\nSeja para anunciar o início de uma celebração ou para resolver pequenos imprevistos que surgem durante o evento, ela afirma que esta arma é o artigo de festival perfeito para qualquer ocasião."
10090-ProfileIntroductionJp = "Estudante do 1º ano da Academia Aliada Hyakkiyako e integrante do Comitê de Gestão de Festivais.\n\nVinda do interior, conta que desde pequena sempre teve uma enorme curiosidade pelos festivais realizados na cidade grande. É uma verdadeira especialista no assunto, a ponto de saber de cor todos os festivais que acontecem por toda Kivotos. Basta abrir a boca para começar a falar sem parar e bem rápido sobre festivais pouco conhecidos, razão pela qual costumam dizer que ela é uma beldade... quando fica calada."
10090-CharacterSSRNewJp = "Ouvi dizer que ia ter um festival e vim correndo!\nUé... não vai ter?"
