10038-ProfileIntroductionJp = "Командир Отряда RABBIT академии SRT. Позывной — «RABBIT 1».\n\nМияко поступила в SRT из глубокого восхищения тем, насколько строго академия придерживалась справедливости. После внезапного закрытия школы она осталась без дома и вместе с другими участницами RABBIT разбила лагерь в парке. Мияко говорит прямо и редко показывает, что думает, поэтому может показаться холодной, но на деле у неё самое доброе сердце в отряде."
10038-CharacterSSRNewJp = "RABBIT 1. Начинаю операцию."
