10038-WeaponDescJp = "A submetralhadora padrão fornecida à Miyako pela Academia Especial SRT.\n\nUma arma de altíssima confiabilidade, capaz de repelir inimigos com eficácia mesmo sob condições extremas."
10038-ProfileIntroductionJp = "Aluna da Academia Especial SRT e líder do Pelotão RABBIT.\n\nIngressou na Academia Especial SRT admirando os feitos de suas veteranas, mas a academia foi fechada repentinamente. Atualmente, vive acampada em um parque junto com as demais integrantes de seu pelotão. Como quase não muda de expressão e raramente demonstra emoções, costuma ser vista pelos outros como alguém fria ou antipática. Porém, por dentro, tem um coração gentil que está sempre preocupado com suas companheiras de equipe. Seu codinome é \"RABBIT 1\"."
10038-CharacterSSRNewJp = "Aqui é a RABBIT 1. Iniciando a operação agora."
