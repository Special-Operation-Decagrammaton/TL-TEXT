10078-ProfileIntroductionJp = "Президент Клуба горячих источников Гехенны.\n\nСмысл её жизни — разрабатывать горячие источники везде, где есть геотермальная активность, и её совершенно не волнует, что стоит на пути. Участницы клуба единодушно поддерживают Касуми, а вот за его пределами она числится разыскиваемой преступницей."
