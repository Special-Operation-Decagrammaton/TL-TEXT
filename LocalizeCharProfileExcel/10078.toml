10078-WeaponDescJp = "A pistola que a Kasumi carrega consigo.\n\nNormalmente, ela costuma dispará-la para o alto a fim de animar o ambiente. Apesar do visual pequeno e gracioso, seu poder de fogo real é impecável."
10078-ProfileIntroductionJp = "Estudante da Academia Gehenna e presidente do Clube de Desenvolvimento de Fontes Termais.\n\nDefende que toda terra por onde corre uma nascente deve ser transformada em fonte termal e, uma vez tomada a decisão, explode qualquer lugar sem medir esforços nem métodos. Embora conte com o apoio irrestrito dos membros do clube, suas palavras e atitudes na prática são as de uma criminosa procurada."
