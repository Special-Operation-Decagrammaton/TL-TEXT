20024-WeaponDescJp = "Любимый маленький пистолет Нагисы.\n\nКлассический дизайн прекрасно подходит хозяйке элегантных чаепитий. А ещё он незаменим, когда нужно прогнать незваных гостей, унижающих достоинство чайной церемонии."
20024-ProfileIntroductionJp = "Глава Филиус — одной из союзных фракций, составляющих старшую школу Тринити, и хозяйка Tea Party.\n\nНесмотря на мягкие и дружелюбные манеры, Нагиса редко показывает истинные чувства, поэтому сблизиться с ней непросто. Её хобби — готовить чай и угощения для чаепитий. Многие студенты Тринити мечтают попасть на её встречи."
20024-CharacterSSRNewJp = "Как поживаете? Приветствую вас от имени Тринити."
