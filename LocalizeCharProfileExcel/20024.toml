20024-WeaponDescJp = "A pistola favorita da Nagisa.\n\nCom seu design clássico, harmoniza perfeitamente com uma festa do chá sem chamar atenção. Costuma ser usada para enxotar convidados indesejados que rebaixem a elegância da ocasião."
20024-ProfileIntroductionJp = "Aluna da Academia Geral Trinity, líder da facção estudantil \"Filius\" — uma das que compõem a Trinity — e anfitriã do conselho estudantil, a \"Tea Party\".\n\nEmbora fale de maneira serena e gentil, quase nunca revela suas verdadeiras intenções, sendo descrita como uma figura difícil de lidar e cheia de mistérios. Seu hobby é preparar folhas de chá e doces para suas recepções. Muitas alunas da Trinity sonham com o dia em que serão convidadas para o chá da tarde dela."
20024-CharacterSSRNewJp = "...Bom dia.\nApresento minhas saudações em nome da Trinity."
