20036-WeaponDescJp = "Штурмовая винтовка Сэрики, которую она взяла на курорт в отпуск.\n\nДаже вне службы она остаётся настороже. Более того, поддерживает идеальную физическую форму, чтобы посвящать отдыху все 100% сил."
20036-ProfileIntroductionJp = "Казначей Отряда по взысканию долгов, приехавшая на курорт в поисках идеального отпуска.\n\nНесмотря на многочисленные трудности, Сэрика не сдаётся и бесстрашно справляется с неудачами, подходя к отпуску с той же старательностью, что и к подработкам. Со стороны может показаться, что она постоянно напряжена, но на самом деле ей очень нравится проводить время со всеми... даже если сама она этого не осознаёт."
20036-CharacterSSRNewJp = "Выжму из этого всё! Лучший отпуск в жизни!"
