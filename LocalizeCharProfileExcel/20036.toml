20036-WeaponDescJp = "O fuzil de assalto da Serika, que ela não deixa de carregar nem mesmo no resort aonde foi passar as férias.\n\nMesmo durante o descanso, ela não baixa a guarda. Pelo contrário: mantém a arma em perfeitas condições para garantir que aproveitará as férias mais completas possíveis."
20036-ProfileIntroductionJp = "Aluna do Colégio Abydos e tesoureira do Comitê de Contramedidas de Abydos, que visitou um resort decidida a aproveitar as melhores férias de todas.\n\nSem se abater diante de repetidos contratempos, ela encara as férias com a mesma seriedade que dedica aos seus trabalhos de meio período. À primeira vista, parece até estar correndo contra o tempo, mas está se divertindo muito ao lado de todas do Comitê de Contramedidas."
20036-CharacterSSRNewJp = "Estas férias! Eu vou aproveitar custe o que custar!"
