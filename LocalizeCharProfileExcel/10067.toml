10067-WeaponDescJp = "O fuzil de assalto exclusivo da Toki.\n\nEla afirma que a arma é adequada não apenas para missões convencionais, mas também para operações secretas — e prova com as próprias mãos que está certa."
10067-ProfileIntroductionJp = "Agente da organização secreta \"C&C\", da Escola de Ciências Millennium, que acredita piamente que uma roupa de coelhinha é o traje óbvio para missões de infiltração.\n\nTalvez por sempre ter ocupado uma posição especial e raramente ter tido contato com missões de infiltração, ela parece estar um pouco mais animada do que de costume com a tarefa recebida. No fundo, demonstra felicidade por poder realizar o mesmo tipo de missão que suas veteranas da C&C, embora finja total serenidade."
10067-CharacterSSRNewJp = "Preparativos para a execução da operação concluídos. Pronta para partir a qualquer momento.\nEsta roupa...? Algum problema?"
