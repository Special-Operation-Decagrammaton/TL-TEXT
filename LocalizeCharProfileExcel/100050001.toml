100050001-WeaponDescJp = "Любимый дробовик Хошино с простым дизайном.\n\nОбычно ленивая Хошино никогда не халтурит, когда дело касается ухода за оружием."
100050001-ProfileIntroductionJp = "Президент Студенческого совета Абидоса и Отряда по взысканию долгов.\n\nВедёт себя скорее как усталый старичок и предпочитает разыгрывать окружающих, а не работать. Из-за этого часто получает от других участниц отряда, но на миссиях сражается на передовой усерднее всех, защищая друзей.\nПосле вступления в должность президента Студсовета Хошино стала заметно веселее. Возможно, именно такой она была на самом деле."
100050001-CharacterSSRNewJp = "Уже давно пора спать,\nно если хочешь — помогу."
