100050001-WeaponDescJp = "Uma escopeta de design simples que a Hoshino adora usar.\n\nApesar de ser naturalmente preguiçosa, a manutenção da sua arma é a única coisa que ela jamais deixa de lado."
100050001-ProfileIntroductionJp = "Aluna do Colégio Abydos, presidente do Conselho Estudantil de Abydos e a garota preguiçosa que atua como presidente do Comitê de Contramedidas.\n\nConhecida pelo jeito de falar igual ao de um tiozão folgado, prefere brincar a trabalhar. Por conta disso, vive levando bronca das outras integrantes do comitê no dia a dia, mas quando a missão começa, luta bravamente na linha de frente para proteger todas as companheiras.\nDesde que aceitou o título de presidente do conselho estudantil, vem ficando mais alegre aos poucos. Talvez essa seja a verdadeira Hoshino."
100050001-CharacterSSRNewJp = "Não consegui cochilar nadinha, mas...\né, fazer o quê, né?"
