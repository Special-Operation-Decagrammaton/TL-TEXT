10130-WeaponDescJp = "Штурмовая винтовка Субару.\n\nОна тщательно модифицировала её ради функциональности и символического смысла. Со стороны оружие может казаться непримечательным, но для Субару это воплощение её решимости."
10130-ProfileIntroductionJp = "Лидер оставшихся студентов Спутниковой школы Ариус.\n\nЛюди безоговорочно доверяют и её лидерству, и характеру. Её «дети» считают Субару доброй и заботливой наставницей, важной фигурой в их жизни. Но если ей кажется, что их безопасности что-то угрожает, она мгновенно переключается в совершенно другой режим."
