26004-ProfileIntroductionJp = "Библиотекарь Библиотечного комитета Тринити.\n\nКнижный червь и настоящая библиофилка, одна из немногих студентов, прочитавших буквально каждый том в библиотеке Тринити. Она любит не только читать, но и рекомендовать книги, поэтому нередко советует что-нибудь едва знакомым людям, ориентируясь на их вкусы."
