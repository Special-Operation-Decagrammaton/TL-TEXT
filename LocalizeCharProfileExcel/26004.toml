26004-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e bibliotecária do Comitê de Biblioteca.\n\nUma verdadeira aficionada por leitura que ama livros e é uma das poucas alunas que já leram todo o imenso acervo da biblioteca da Trinity. Ela gosta tanto de recomendar livros quanto de lê-los e, sempre que conhece alguém, a primeira coisa em que pensa é: \"Qual livro combinaria com o gosto desta pessoa?\"."
