16019-ProfileIntroductionJp = "Агент C&C и полевой оперативник Отряда исследования сверхъестественных явлений в новом разведывательном боевом костюме.\n\nПо словам самой Токи, это «Асума Токи, мобильная версия». Она отказалась от тяжёлой брони в пользу более лёгкого снаряжения. Теперь Токи быстрее, сильнее и, что важнее всего, похоже, нашла себе... несколько новых увлечений? Пусть даже временных, уже одно это повод для радости."
