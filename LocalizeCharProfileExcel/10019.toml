10019-WeaponDescJp = "O fuzil que a Azusa segura sempre com firmeza.\n\nNo corpo da arma estão gravadas as palavras: \"Tudo é vaidade. Não importa aonde se vá, tudo não passa de pura vaidade\"."
10019-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e a \"Bruxa do Gelo\" do Clube de Aulas de Recuperação.\n\nOriginalmente havia abandonado outra escola, mas por uma série de circunstâncias passou a frequentar a Trinity e retomou os estudos. No fundo é uma garota solitária, mas por medo de causar problemas aos outros acaba mantendo distância por conta própria, o que deixa suas colegas do Clube de Aulas de Recuperação preocupadas."
10019-CharacterSSRNewJp = "Tudo é vão, e a vida não tem sentido.\nMas... dá vontade de acreditar nas suas palavras."
