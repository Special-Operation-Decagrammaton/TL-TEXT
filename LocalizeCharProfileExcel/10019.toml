10019-ProfileIntroductionJp = "Ледяная королева Клуба дополнительных занятий Тринити.\n\nПосле того как Азуса бросила прежнюю школу, она оказалась в Тринити и вновь начала учиться. Хотя ей одиноко, она держится на расстоянии от окружающих, чтобы не причинять им неприятностей, и это беспокоит остальных участниц клуба."
