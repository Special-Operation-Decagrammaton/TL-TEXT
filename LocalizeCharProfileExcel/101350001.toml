101350001-ProfileIntroductionJp = "Kei, que definiu a si mesma como quem realmente é.\n\nDe uma inteligência artificial para uma unidade AMAS, e de um sacrifício defeituoso para seu corpo atual. Após muitas reviravoltas, ela chegou até aqui.\n\nComo a Escola de Ciências Millennium permite participar de mais de um clube, embora pertença à Força-Tarefa de Fenômenos Paranormais, ela passa boa parte do tempo no Clube de Desenvolvimento de Jogos.\n\nNa prática, atua como a nova produtora do Clube de Desenvolvimento de Jogos... mas ela mesma parece negar isso."
