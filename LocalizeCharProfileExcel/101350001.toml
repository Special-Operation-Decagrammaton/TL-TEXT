101350001-ProfileIntroductionJp = "Кей, наконец нашедшая собственный путь.\n\nОт искусственного интеллекта до AMAS, от ошибочной жертвы до нынешнего дня — путь Кей был долгим и тяжёлым. Теперь она официально состоит в Отряде исследования сверхъестественных явлений, но Миллениум разрешает ей участвовать сразу в нескольких клубах. Поэтому, несмотря на яростные отрицания, она также стала новым продюсером Отдела разработки игр, где проводит большую часть времени."
