20011-WeaponDescJp = "O fuzil de assalto que a Serika leva consigo mesmo quando vai trabalhar em seus bicos.\n\nSeu trabalho temporário como miko não é exceção, e parece que a arma também está sendo usada para acalmar encrenqueiras que incomodam os outros usando o Ano-Novo como desculpa."
20011-ProfileIntroductionJp = "Integrante do Comitê de Contramedidas de Abydos e a responsável (?) tesoureira do grupo, agora vestida de miko.\n\nPara ajudar o Comitê de Contramedidas nem que seja um pouquinho, a Serika sempre se esforçou a sério fazendo vários trabalhos de meio período. Com a chegada do Ano-Novo, o bico que ela escolheu foi o de miko no santuário. Embora não tenha um interesse especial ou conhecimento profundo sobre o ofício de miko, como é da sua natureza dar o melhor de si em qualquer tarefa que lhe seja confiada, desta vez ela também está se dedicando com tudo (e, ao que parece, há também o detalhe de que o pagamento por hora aumenta se ela agir como uma miko de verdade)."
20011-CharacterSSRNewJp = "N-não é nada demais... Se for pelo Sensei, eu faço quantas orações precisar..."
