20011-WeaponDescJp = "Штурмовая винтовка, которую Сэрика всегда носит с собой на подработки.\n\nОна берёт её и на новогоднюю подработку мико, используя против нарушителей, которые устраивают шум на празднике."
20011-ProfileIntroductionJp = "Сообразительная казначей Отряда по взысканию долгов Абидоса.\n\nСэрика усердно трудится на нескольких подработках ради отряда, а на Новый год устроилась мико. Узнав, что за убедительную игру роли ей заплатят больше, она, как всегда, старается изо всех сил."
20011-CharacterSSRNewJp = "Ну... если это ради Сэнсэя, могу и помолиться разок-другой."
