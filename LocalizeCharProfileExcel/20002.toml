20002-ProfileIntroductionJp = "Uma inventora genial do Colégio Sênior Shanhaijing.\n\nÉ um prodígio que já havia conquistado seis diplomas quando ainda estava no ensino fundamental, mas, mais do que como um gênio, é conhecida como uma encrenqueira que vive pregando peças nos outros e causando confusão. O ratinho Nezusuke, que está sempre com ela, é seu grande amigo desde a infância e alguém tão precioso quanto a própria família para a Saya."
