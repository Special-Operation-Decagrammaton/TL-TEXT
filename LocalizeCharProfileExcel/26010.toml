26010-ProfileIntroductionJp = "Снайпер Отряда RABBIT, приехавшая в отдалённую рыбацкую деревню для операции под прикрытием.\n\nЧтобы не выделяться, она взяла рыболовные снасти и проводит большую часть времени в доках. Иногда Мию неожиданно ловит крупную рыбу и привлекает внимание других рыбаков, но... даже в этой странной деревне её природная незаметность никуда не делась."
