26010-WeaponDescJp = "O fuzil de precisão padrão fornecido à Miyu pela Academia Especial SRT.\n\nGraças à estrutura simples e robusta característica do mecanismo de ferrolho, ela consegue alvejar os inimigos sem sofrer panes, mesmo sob a forte brisa do mar."
26010-ProfileIntroductionJp = "Atiradora de elite do Pelotão RABBIT, da Academia Especial SRT, que visitou uma vila de pescadores para uma operação de infiltração.\n\nTendo trazido seu próprio equipamento de pesca, ela passa o tempo pescando tranquilamente no píer. De vez em quando fisga um peixe enorme e atrai a atenção de todos ao redor, mas... sua falta de presença natural parece continuar firme e forte mesmo nesta vila misteriosa."
