20061-ProfileIntroductionJp = "Председатель Отдела горячих источников Геенны.\n\nНи лето, ни близость моря не способны умерить её одержимость освоением новых мест. Другие могут считать Касуми совершенно безумной, но даже эту репутацию она умудряется обращать себе на пользу."
