20061-WeaponDescJp = "A pistola que a Kasumi carrega consigo.\n\nCostuma ficar abafada pelo barulho das brocas e das explosões, mas as obras do Clube de Desenvolvimento de Fontes Termais sempre começam ao sinal do disparo desta arma."
20061-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente do Clube de Desenvolvimento de Fontes Termais.\n\nSua filosofia de colocar a escavação acima de tudo, independentemente da estação ou do lugar, segue firme e forte. Embora seja vista pelos outros como uma pessoa completamente fora da casinha, ela usa até mesmo essa própria reputação como arma para alcançar seus objetivos."
