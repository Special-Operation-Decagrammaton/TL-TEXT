20013-ProfileIntroductionJp = "Вице-президент Veritas — хакерской группы научной школы Миллениум.\n\nГениальная программистка с выдающимися навыками взлома. Если работа требует, Чихиро не боится испачкать руки — будь то задание под прикрытием или выезд в поле. В отличие от большинства бесовских участниц Veritas, у неё действительно есть здравый смысл. Она постоянно напоминает остальным о правильной хакерской этике."
