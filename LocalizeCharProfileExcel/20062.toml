20062-ProfileIntroductionJp = "Студент, приписанный к Федеральной академии Красной Зимы, но из-за дисциплинарного взыскания сейчас отбывает наказание в спецклассе № 183 в старом корпусе. Внутри спецкласса № 183 исполняет обязанности заместителя председателя.\n\nПо натуре ленива; из-за аварии во время исследования попала в спецкласс № 183. Настолько способна, что отвечает за химию, но при этом терпеть не может учёбу — лентяйка и возмутительница спокойствия. Поскольку 183-й находится в глуши, она не может свободно выходить наружу, и её дни полны досады. Поэтому она ждёт не дождётся дня, когда с неё снимут взыскание."
