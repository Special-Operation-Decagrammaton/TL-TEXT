20062-ProfileIntroductionJp = "A student belonging to Redwinter Federal Academy, currently serving a disciplinary suspension in the old school building's Class 183 Special Class. She serves as the vice-president of Class 183.\n\nShe has a sloppy personality and ended up in Class 183 due to an accident during her research. While capable enough to serve as the head of chemistry, she is a lazy troublemaker who utterly hates studying. Unable to freely leave the remote Class 183, she spends her days feeling frustrated. Because of this, she eagerly awaits the day her suspension is lifted."
