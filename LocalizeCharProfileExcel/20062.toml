20062-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter que, após sofrer uma punição disciplinar, cumpre suspensão atualmente na Classe Especial Nº 183, no antigo prédio escolar. Dentro da Classe Especial Nº 183, ela atua como vice-representante.\n\nDe natureza desleixada, foi parar na Classe Especial Nº 183 por causa de um acidente durante uma pesquisa. Embora seja talentosa o bastante para atuar como chefe de química, é uma encrenqueira preguiçosa que odeia estudar. Sem poder sair livremente da remota Classe Nº 183, ela passa os dias frustrada, aguardando ansiosamente pelo momento em que sua suspensão será revogada."
20062-CharacterSSRNewJp = "Se não for pra estudar, é super bem-vindo~!"
