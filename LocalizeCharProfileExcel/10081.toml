10081-WeaponDescJp = "O fuzil padrão da Hyakkaryouran utilizado pela Yukari.\n\nSímbolo de sua antiga admiração, é a prova da determinação que ela conquistou ao correr atrás de seus ideais com muito esforço. O sentimento depositado nesta arma jamais poderá ser quebrado por ninguém."
10081-ProfileIntroductionJp = "Estudante do 1º ano da Academia Aliada Hyakkiyako e integrante do Comitê de Mediação de Conflitos Hyakkaryouran.\n\nHerdeira da tradicional e prestigiada família Kadenokouji, escolheu ingressar na tão sonhada Hyakkaryouran em vez de assumir os negócios da família. Tem enorme orgulho de fazer parte do comitê e é cheia de iniciativa. Embora às vezes desanime diante dos tropeços, possui uma força interior que a faz se reerguer rapidamente. Respeita muito suas veteranas, tendo uma admiração especial pela Nagusa."
10081-CharacterSSRNewJp = "É o avanço triunfal da Yukari~!"
