10081-WeaponDescJp = "Стандартная винтовка Хяккарёран, выданная Юкари.\n\nЕщё в средней школе такие винтовки были для неё предметом восхищения. То, что теперь одна из них принадлежит ей, доказывает, сколько сил Юкари вложила в осуществление мечты. Её решимость не знает границ."
10081-ProfileIntroductionJp = "Первокурсница Совета урегулирования Хяккарёран академии Хяккияко.\n\nНесмотря на происхождение из старинного рода Кадэнокодзи, Юкари восхищалась Хяккарёран и вступила в совет вместо того, чтобы следовать семейным обязанностям. Она очень гордится своей принадлежностью к нему и готова на всё ради службы. Путь непростой, но Юкари сильна и легко справляется с трудностями. Она глубоко уважает старших участниц Хяккарёран, особенно Нагусу."
