16020-WeaponDescJp = "O fuzil de precisão padrão fornecido pela Academia Especial SRT.\n\nCom seu alto poder de penetração, é capaz de atingir alvos escondidos atrás de coberturas. Além disso, aproveitando a alta velocidade do projétil, também permite disparos de ultralonga distância. Porém, tem a desvantagem de ser extremamente pesado, e dizem que a Otogi anda sofrendo com dores nos ombros por causa disso."
16020-ProfileIntroductionJp = "Aluna da Academia Especial SRT e atiradora de elite do Pelotão FOX. Seu codinome é \"FOX 4\".\n\nEntre os atiradores de elite, que costumam ser lobos solitários, ela é uma rara exceção que faz amizade rapidamente logo no primeiro encontro. No pelotão, ocupa a posição de animadora do grupo.\nNo campo de batalha, também cumpre o papel de abalar a moral do inimigo.\n\nTem facilidade em lidar com aparelhos eletrônicos e dizem que consegue até consertar equipamentos comuns."
