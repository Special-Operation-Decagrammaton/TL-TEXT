16020-WeaponDescJp = "Стандартная снайперская винтовка, полученная Отоги в академии SRT.\n\n\nОна позволяет поражать врагов за укрытиями и цели на большой дистанции. Но оружие очень тяжёлое, поэтому Отоги страдает от хронической боли в плечах..."
16020-ProfileIntroductionJp = "Снайпер Отряда FOX академии SRT. Позывной — «FOX 4».\n\nВ отличие от стереотипных снайперов-одиночек, Отоги легко сходится с людьми и любит шутить. Благодаря характеру она поднимает настроение всему отряду. На поле боя её естественная заметность, наоборот, помогает деморализовать противника.\n\nОна также хорошо разбирается в электронике и способна починить почти любую технику."
