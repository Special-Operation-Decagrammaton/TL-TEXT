13006-ProfileIntroductionJp = "Главная заводила и начальница штаба Problem Solver 68.\n\nВ отличие от Ару, у которой всё-таки есть некое подобие совести, Муцуки — дьявольская нарушительница спокойствия, искренне наслаждающаяся хаосом. Будучи одной из старейших подруг Ару, она лучше всех понимает её показную крутость, хотя далеко не всегда ей подыгрывает."
