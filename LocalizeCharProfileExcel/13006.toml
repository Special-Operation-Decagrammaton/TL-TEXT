13006-ProfileIntroductionJp = "A linha de frente do Faz-Tudo 68, da Academia Gehenna.\n\nDiferente da Aru, que acaba sentindo peso na consciência facilmente, ela é uma garota travessa como uma diabinha que comete malfeitorias sem hesitar e adora uma confusão. Por ser amiga de infância da Aru, entende os blefes dela melhor do que ninguém, mas nem por isso pega leve com ela."
