20004-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma integrante íntegra do Comitê de Realização da Justiça que veio à praia acompanhando a presidente Tsurugi.\n\nUm mar radiante e uma praia cintilante. Mesmo indo para um cenário onde qualquer um ficaria empolgado, a primeira coisa em que a Mashiro pensa é na justiça e no treinamento. Afinal, essa é a justiça na qual ela acredita."
