26003-ProfileIntroductionJp = "Добросердечная участница Рыцарей исправительного курса Тринити.\n\nОна любит благотворительность и настолько беспокоится о здоровье окружающих, что заслужила репутацию заботливой мамочки. Хотя Сэрина немного робкая и старается избегать ссор и конфликтов, она всегда готова встать против врагов, угрожающих миру."
