26003-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota gentil e dedicada das Cavaleiras Hospitalárias.\n\nDona de um bom coração e sempre disposta ao trabalho voluntário, ela se preocupa até demais quando o assunto é saúde, razão pela qual as alunas ao redor costumam dizer que ela \"parece uma mãe\". Embora deteste conflitos, enfrenta com firmeza qualquer inimigo que ameace a paz."
