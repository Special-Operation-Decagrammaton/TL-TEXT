10072-WeaponDescJp = "A metralhadora padrão fornecida à Saki pela Academia Especial SRT.\n\nPor ser sensível à umidade e à maresia, apresenta falhas frequentes na praia, mas para alguém dedicada como a Saki isso não chega a ser um grande problema."
10072-ProfileIntroductionJp = "Pointman do Pelotão RABBIT, pertencente à Academia Especial SRT, que visitou uma vila de pescadores para uma missão de infiltração.\n\nFiel ao seu hábito de seguir o manual à risca, Saki trouxe na bolsa todos os equipamentos necessários para combate mesmo em uma operação de infiltração. Pelo visto, sua seriedade continua a mesma até de traje de banho."
