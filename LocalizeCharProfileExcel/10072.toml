10072-WeaponDescJp = "Стандартный пулемёт, выданный Саки в академии SRT.\n\nВо влажной среде вроде пляжа он часто даёт сбои из-за склонности к ржавчине. Для Саки это не проблема: после каждого использования она тщательно чистит оружие."
