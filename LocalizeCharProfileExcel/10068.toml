10068-WeaponDescJp = "A preciosa escopeta da Reisa. Com um cano cuidadosamente personalizado, qualquer um que olhe sabe na hora que a arma pertence a ela.\n\nDiferente de sua aparência fofa, é possível notar as marcas das inúmeras batalhas pelas quais já passou."
10068-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e integrante do Corpo de Vigilantes da Trinity, que surge por toda parte mantendo a ordem pública.\n\nComo costuma dizer coisas meio desconexas, às vezes acham que seus chamados não passam de trotes, mas dizem que ela leva as atividades do Corpo de Vigilantes mais a sério do que ninguém. Parece que seu discurso de apresentação muda um pouquinho a cada vez."
10068-CharacterSSRNewJp = "Onde houver alguém clamando por justiça... lá estarei eu... Sim, eu mesma, a Superstar!\nUzawa Reisa, na área!"
