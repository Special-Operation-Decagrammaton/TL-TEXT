10068-WeaponDescJp = "Драгоценный дробовик Рэйсы.\n\nПо тщательно модифицированному стволу сразу ясно, кому принадлежит это оружие. Рейса маленькая и милая, но опыт защиты справедливости в Тринити делает её не менее грозной!"
