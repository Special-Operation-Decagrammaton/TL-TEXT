20042-WeaponDescJp = "Многоцелевой пулемёт Маки, который она часто использует для граффити.\n\nДля походов и прочих занятий на природе он тяжеловат, но пылающую страсть Маки к искусству никакая местность не ограничит."
20042-ProfileIntroductionJp = "Участница Veritas, тепло одевшаяся для борьбы с зимним холодом.\n\nЕй немного грустно покидать тёплое помещение ради внезапной вылазки на природу, но непривычные виды дарят новое вдохновение и помогают держаться. Жаль только, что нельзя зайти в онлайн-сообщества и поделиться этим уникальным вдохновением."
