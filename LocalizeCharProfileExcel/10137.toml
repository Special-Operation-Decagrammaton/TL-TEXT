10137-ProfileIntroductionJp = "Vice-diretora do Departamento de Segurança Pública da Escola de Polícia Valkyrie.\n\nApesar de às vezes ser confundida com uma suspeita por causa da aparência, é uma policial supercompetente. Ela consegue rastrear a psicologia e o comportamento dos criminosos melhor do que qualquer um no Departamento de Segurança Pública, embora não pareça fazer isso de forma consciente.\n\nDizem que ela também é a aluna que mais vezes foi promovida e rebaixada no Departamento de Segurança Pública."
