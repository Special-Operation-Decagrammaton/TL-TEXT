10137-ProfileIntroductionJp = "студент-полицейский, работающий заместителем директора Бюро общественного порядка Валькирии.\n\nИз-за беззаботной манеры поведения её часто принимают за подозреваемую, однако Конока неожиданно компетентный офицер и, кажется, идеально понимает психологию закоренелого преступника, даже не осознавая этого. Несмотря на это — или именно благодаря этому — она одна из самых способных сотрудниц Бюро общественного порядка.\n\nСейчас Конока держит рекорд отдела и по числу повышений, и по числу понижений."
