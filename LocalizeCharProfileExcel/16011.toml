16011-ProfileIntroductionJp = "Вице-президент Комитета правосудия в спортивной форме для участия в Фестивале Halo Кивотоса.\n\nОна вошла в Исполнительный комитет вместо Цуруги, которой непривычна административная работа. Хасуми старается сохранять спокойствие и делать всё как следует, несмотря на восторг президента, но проблемные студенты и запах сладостей от уличных торговцев постоянно отвлекают."
