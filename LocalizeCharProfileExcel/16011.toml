16011-ProfileIntroductionJp = "A vice-presidente do Comitê de Realização da Justiça, da Academia Geral Trinity, que vestiu seu uniforme esportivo para participar dos Jogos Halo.\n\nNo lugar da Tsurugi, que não leva muito jeito para relações externas, ela assumiu o cargo de membro do Comitê Executivo. Mesmo em meio ao clima festivo do evento, a Hasumi tenta cumprir seus deveres no comitê com calma... mas as alunas delinquentes que surgem sem dar trégua e a doce tentação que vem das barraquinhas estão fazendo-a sofrer."
