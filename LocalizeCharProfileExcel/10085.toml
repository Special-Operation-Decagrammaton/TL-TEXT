10085-ProfileIntroductionJp = "Участница Veritas, закутавшаяся потеплее против зимнего холода.\n\nХарэ уже не помнит, когда в последний раз надолго отходила от своего стола, и лагерь без Wi-Fi поневоле заставляет её нервничать. Она смирилась с потерей большинства привычных удобств, но отсутствие банок Frenzy MAX — уже за гранью."
