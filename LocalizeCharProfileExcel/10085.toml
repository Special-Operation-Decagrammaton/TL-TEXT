10085-WeaponDescJp = "O fuzil de assalto estilo bullpup utilizado pela Hare.\n\nConta com uma função de ignição que facilita acender fogo ao ar livre, além de vir equipado com um sistema de mira automática para dar suporte caso animais ferozes apareçam. Porém, dizem que quando um urso apareceu de verdade, Hare entrou em pânico e nunca conseguiu usar essa função direito."
10085-ProfileIntroductionJp = "Integrante da Veritas, vestida com roupas bem quentinhas para encarar o frio do inverno.\n\nAlém de ter que sair de casa depois de tanto tempo, ela acabou indo parar em um acampamento onde quase não há sinal de rede, o que deixou seu ânimo bem mais baixo que o normal. Embora consiga tolerar a maioria dos perrengues ao ar livre, parece que a única coisa da qual ela não abre mão é de tomar seus energéticos."
10085-CharacterSSRNewJp = "Não importa o frio que faça, um Youkai MAX morno é a única coisa que eu não consigo aceitar."
