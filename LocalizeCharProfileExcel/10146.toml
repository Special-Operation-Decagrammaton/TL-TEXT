10146-WeaponDescJp = "Снайперская винтовка Макото.\n\nОбычно она носит её лишь для солидности, но на этот раз обстоятельства заставили пустить оружие в ход. Пожалуй, за всё это время она ещё ни разу не стреляла так много."
10146-ProfileIntroductionJp = "Председатель Общества Пандемониума, студенческого совета академии Геенна.\n\nМакото никогда не берётся за дело вполсилы. Благодаря невероятному напору она либо добивается ошеломительного успеха, либо терпит столь же грандиозный провал. Из-за её беспечности чаще происходит второе, и летние каникулы не стали исключением."
