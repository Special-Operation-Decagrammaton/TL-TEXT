10146-ProfileIntroductionJp = "A presidente da \"Sociedade Pandemonium\", da Academia Gehenna.\n\nEla nunca deixa nada pela metade. O destino final de sua iniciativa avassaladora é sempre um grande sucesso ou um fracasso colossal. Somado à sua natureza distraída de nascença, quase sempre acaba sendo a segunda opção. E parece que estas férias de verão não serão exceção."
