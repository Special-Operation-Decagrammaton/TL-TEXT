13013-ProfileIntroductionJp = "Любительница литературы, сражающаяся за сохранение знаний в библиотеке академии Красная Зима.\n\nБольшинство её сверстниц борются за хлеб и закуски, а Момидзи — за книги. К несчастью, она серьёзная отаку, поэтому Секретариат отклоняет большинство просьб о закупке новой манги... Но сдаётся ли Момидзи? Никогда!"
