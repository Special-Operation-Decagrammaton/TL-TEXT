13013-ProfileIntroductionJp = "Uma garota apaixonada por literatura da \"Frente de Libertação do Conhecimento\", da Academia Federal Red Winter.\n\nDiferente das outras alunas de Red Winter, que lutam por pão e lanches, ela luta para colocar mais livros no acervo da biblioteca. Ela é bem otaku, e a maioria dos pedidos de compra de livros que envia para a Secretaria tem motivos puramente pessoais. Por isso, quase todas as solicitações são recusadas, mas a Momiji não desiste e continua enviando novos pedidos."
