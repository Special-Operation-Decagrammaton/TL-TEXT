26011-ProfileIntroductionJp = "Жизнерадостный студент средней школы Сакугава.\n\nСо старшеклассницей Мисакой Микото из Токивадай её познакомила близкая подруга и одноклассница Уихару Кадзари. Хотя Руико — 0-го уровня и не обладает способностями, у неё хорошая интуиция и талант находить зацепки. Больше всего она любит городские легенды и десерты, а в свободное время обязательно пробует новые сладости."
