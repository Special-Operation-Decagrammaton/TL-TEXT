26011-ProfileIntroductionJp = "Uma alegre estudante do Colégio Sakugawa.\n\nMelhor amiga de sua colega de classe Uiharu Kazari, por meio de quem foi apresentada à veterana do Colégio Tokiwadai, Misaka Mikoto. Embora seja uma Nível 0 sem poderes, tem uma ótima intuição e costuma encontrar pistas decisivas. Suas coisas favoritas são lendas urbanas e doces. Dizem que, nos dias de folga, ela costuma sair para investigar novas sobremesas."
