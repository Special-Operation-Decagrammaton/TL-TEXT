23007-ProfileIntroductionJp = "Дружелюбная участница Клуба дополнительных занятий.\n\nНа первый взгляд Ханако кажется тихой и изящной барышней, но стоит ей открыть рот, как наружу льётся поток непристойных и двусмысленных замечаний. Каждая участница клуба начинает нервничать, едва Ханако собирается что-нибудь сказать."
