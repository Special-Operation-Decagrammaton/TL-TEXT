23007-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma garota de grande sensibilidade do Clube de Aulas de Recuperação.\n\nÀ primeira vista, parece uma dama recatada e elegante... mas, na verdade, é uma aluna problemática que não para de soltar comentários picantes assim que abre a boca. Sabendo disso, as outras integrantes do Clube de Aulas de Recuperação ficam com o coração na mão toda vez que a Hanako ameaça dizer alguma coisa."
