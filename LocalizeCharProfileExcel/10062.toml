10062-WeaponDescJp = "O fuzil de assalto exclusivo da Toki.\n\nPossui um desempenho à altura de seu visual, eliminando qualquer alvo que atrapalhe a missão. Dizem que não foi ela mesma quem escolheu o nome da arma, mas sim outra pessoa."
10062-ProfileIntroductionJp = "Estudante da Escola de Ciências Millennium e a quinta agente da organização secreta \"C&C\".\n\nEmbora pertença à C&C, como até então atuava exclusivamente como maid pessoal e guarda-costas da Rio, quase ninguém conhece seu rosto. É uma agente excepcional que luta utilizando armamentos e tecnologias de ponta. Até agora costumava agir sozinha na maior parte do tempo, mas na verdade esconde um lado um tanto solitário."
10062-CharacterSSRNewJp = "Ordene o que desejar.\nAfinal, sou uma agente e maid perfeita."
