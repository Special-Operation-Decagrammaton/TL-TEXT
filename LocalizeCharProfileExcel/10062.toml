10062-WeaponDescJp = "Уникальная штурмовая винтовка Токи.\n\nЕё характеристики столь же выдающиеся, как и внешний вид: оружие способно сокрушить любое препятствие и выполнить любую миссию. Название придумала не сама Токи, а кто именно — неизвестно."
10062-ProfileIntroductionJp = "Таинственный пятый агент секретной шпионской организации Миллениума — C&C.\n\nХотя формально Токи состоит в C&C, уже долгое время она служит личной горничной и телохранителем Рио, поэтому о ней мало кто знает. Токи — превосходный секретный агент, уверенно обращающийся с высокотехнологичным оружием и техникой, но постоянная работа в одиночку, похоже, делает её немного одинокой."
10062-CharacterSSRNewJp = "Предоставьте это мне. Я и идеальный агент, и идеальная горничная."
