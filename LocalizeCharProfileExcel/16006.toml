16006-WeaponDescJp = "A metralhadora pesada usada pela Izumi.\n\nPela gastronomia de verão, ela enfrenta o fogo e a água! E a proteção à prova d'água também está impecável."
16006-ProfileIntroductionJp = "Uma garota gulosa da Sociedade de Pesquisa Gourmet, da Academia Gehenna, que mantém o apetite voraz mesmo no verão abafado.\n\nCom uma melancia na mão direita e uma caixa térmica na esquerda, ela veio até a praia em busca de ainda mais iguarias de verão. Enguia grelhada sabor chocolate, raspadinha ultrapicante, melancia com cobertura de chocomenta... quando chega o verão, não faltam pratos bizarros típicos da estação. Sua paixão por experimentar todo e qualquer tipo de comida, incluindo essas excentricidades, arde tão forte quanto o calor do verão."
