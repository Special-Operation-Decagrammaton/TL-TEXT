16006-ProfileIntroductionJp = "Участница Общества гурманов Гехенны с ненасытным аппетитом даже летом.\n\nОна приезжает на пляж с арбузом в одной руке и переносным холодильником в другой, разыскивая знаменитые летние деликатесы: угря на гриле со вкусом шоколада, острую стружку льда, арбуз с мятным шоколадом и многое другое. В погоне за необычной едой по всему Кивотосу Изуми нет равных, и даже жаркий пляж не способен остановить её странные гастрономические экспедиции."
