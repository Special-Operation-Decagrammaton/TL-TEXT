16009-WeaponDescJp = "A escopeta favorita da Michiru.\n\nPara ser usada nos ninjutsus criados por ela mesma, recebeu diversas modificações e peças extras que permitem disparar munições especiais. Embora pareça ter ficado ainda mais difícil de manusear, segundo a Michiru: \"É isso que dá todo o charme!\""
16009-ProfileIntroductionJp = "Presidente do Clube de Pesquisa de Ninjutsu, da Academia Aliada Hyakkiyako, que está quase sempre transbordando uma autoconfiança sem fundamento.\n\nUma verdadeira otaku de ninjas que consome filmes, animes e produtos temáticos. Sua paixão foi tão longe que ela fundou o \"Clube de Pesquisa de Ninjutsu\" e criou o canal de vídeos \"Crônicas Ninja da Michirocchi\", onde passou a postar vídeos. Para espalhar o charme dos ninjas por toda Kivotos, hoje ela mais uma vez corre de um lado para o outro ao lado das integrantes do Clube de Pesquisa de Ninjutsu."
