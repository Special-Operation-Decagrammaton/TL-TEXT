16009-WeaponDescJp = "Любимый дробовик Мичиру.\n\nЕго модифицировали множеством способов — например, под ствол добавили ещё один дробовик для использования особых ниндзюцу-пуль собственного производства. Мичиру называет всё это воплощением своих стремлений."
16009-ProfileIntroductionJp = "Президент Клуба исследования ниндзюцу академии Хяккияко и администратор видеоканала Michiruchi — «Девичий свиток ниндзя».\n\nМичиру действует с совершенно необоснованной, но абсолютной уверенностью. Будучи фанаткой ниндзя, она вместе с другими участницами неустанно трудится, чтобы сделать ниндзя популярными по всему Кивотосу. Её мечты — добиться официального признания клуба и набрать 100 подписчиков на канале."
