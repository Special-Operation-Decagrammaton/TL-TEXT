20023-WeaponDescJp = "A pistola padrão fornecida pela Escola de Polícia Valkyrie.\n\nTem um design simples, mas por ser leve e de fácil manuseio, a Kanna — que lida mais com papelada do que com operações em campo — adora usar esta pistola."
20023-ProfileIntroductionJp = "Aluna da Escola de Polícia Valkyrie e diretora do Departamento de Segurança Pública.\n\nQuando assume um caso criminal, desconhece a palavra \"desistir\", interrogando e investigando com tanta obstinação até revelar a verdade que ficou conhecida publicamente pelo apelido de \"Cão Louco\". Por causa de sua postura rígida e do apelido, costuma ser mal-interpretada como alguém explosiva, mas na realidade é sempre fria, calma e possui uma visão bastante realista das coisas."
20023-CharacterSSRNewJp = "Servirei aos cidadãos com total dedicação."
