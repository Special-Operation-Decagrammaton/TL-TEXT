20023-WeaponDescJp = "Стандартный пистолет, полученный Канной в Полицейской школе Валькирии.\n\nНесмотря на суровый вид, он лёгкий и простой в обращении. Канна предпочитает его, потому что проводит больше времени за бумагами, чем в полевых операциях."
20023-ProfileIntroductionJp = "студент-полицейский, возглавляющий Бюро общественного порядка Полицейской школы Валькирии.\n\nГораздо лучше она известна под прозвищем «Дикая гончая»: взявшись за преступление, Канна никогда не отступает и будет упрямо расследовать дело, пока не докопается до истины. Из-за суровой внешности и прозвища её часто считают вспыльчивой, хотя на деле Канна спокойная и приземлённая."
20023-CharacterSSRNewJp = "Я буду верно служить гражданам."
