10149-WeaponDescJp = "Специальная амфибийная винтовка, которой Кокоро пользуется с момента поступления в «Одиссею».\n\nОна стреляет как обычными винтовочными патронами, так и подводными стрелами, поэтому подходит для самых разных боевых условий. Два вида боеприпасов усложняют обслуживание и обращение с оружием, но для педантичной Кокоро это не проблема."
10149-ProfileIntroductionJp = "Председатель Клуба дайвинга Морской академии «Одиссея».\n\nОна великолепно плавает и ныряет, полностью оправдывая свой титул. Когда под водой возникает проблема, например нужно достать потерянную вещь или починить кабель, студенты «Одиссеи» неизменно обращаются к ней. Однако Кокоро склонна тревожиться и не любит рисковать, поэтому не спешит нырять, пока не убедится, что всё снаряжение готово.\n\nОна обожает петь, но совершенно не попадает в ноты и ритм. Поэтому, стоит ей запеть, как все члены клуба разбегаются."
10149-CharacterSSRNewJp = "Всё, что под водой... доверьте мне."
