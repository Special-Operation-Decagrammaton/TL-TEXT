10149-WeaponDescJp = "A uniquely shaped amphibious rifle that Kokoro has cherished since her enrollment.\n\nCapable of firing both standard rifle rounds and underwater flechette rounds from a single platform, it allows her to adapt to any situation. While using two different types of ammunition complicates maintenance and operation, it's no trouble at all for the meticulous Kokoro."
10149-ProfileIntroductionJp = "The president of the Diving Club at Odyssey Marine High School.\n\nTrue to her title as club president, she is highly skilled in diving. Because of this, whenever trouble strikes underwater—whether it's retrieving lost items or repairing cables—Odyssey students always turn to Kokoro for help. However, she is exceptionally cautious, and refuses to dive into the water until she has fully prepared her equipment.\n\nShe loves to sing, but she is completely tone-deaf. The moment she starts, all her club members run for the hills."
10149-CharacterSSRNewJp = "Leave everything underwater to me."
