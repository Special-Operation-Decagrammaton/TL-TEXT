10149-WeaponNameJp = "Fuzil Anfíbio Tipo 91"
10149-WeaponDescJp = "Um fuzil anfíbio de formato especial que a Kokoro usa com carinho desde que entrou na escola.\n\nCom uma única arma, é possível disparar tanto munição comum de fuzil quanto munição flechette subaquática, permitindo reagir conforme a situação. O uso de dois tipos de munição torna o gerenciamento e a operação complexos, mas para alguém metódica como a Kokoro, isso não é um grande problema."
10149-ProfileIntroductionJp = "Presidente do Clube de Mergulho do Colégio Marítimo Odyssey.\n\nFazendo jus ao título de presidente, ela possui excelentes habilidades de mergulho. Por isso, sempre que ocorre algum problema debaixo d'água, como recuperar objetos perdidos ou consertar cabos, as alunas da Odyssey recorrem à Kokoro sem falta. No entanto, por ser extremamente precavida, ela se recusa a pular na água até estar com todo o equipamento perfeitamente preparado.\n\nEla adora cantar, mas é terrivelmente desafinada. Quando começa a cantar, todas as integrantes do clube fogem."
10149-CharacterSSRNewJp = "Quando o assunto for debaixo d'água, pode deixar comigo."
