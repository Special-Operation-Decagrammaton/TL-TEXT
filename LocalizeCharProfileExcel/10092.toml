10092-WeaponDescJp = "O fuzil de assalto que a Yoshimi sempre carrega consigo.\n\nNormalmente usado como arma para vencer disputas por doces, produz disparos com um som tão vibrante e ritmado quanto os acordes da guitarra que ela toca."
10092-ProfileIntroductionJp = "Estudante da Academia Geral Trinity, integrante do Clube de Doces Depois da Aula e guitarrista da banda formada às pressas, \"Sugar Rush\".\n\nEmbora tenha acabado entrando na onda do momento para formar a banda, tem a mentalidade de que \"se é para fazer, que seja bem-feito\". Também é a responsável pela parte visual do grupo, incluindo o ícone, o símbolo e os figurinos da banda."
10092-CharacterSSRNewJp = "Presta bastante atenção em mim, viu!\nPorque não vai ter bis!"
