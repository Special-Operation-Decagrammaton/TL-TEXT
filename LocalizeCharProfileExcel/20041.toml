20041-ProfileIntroductionJp = "Президент Семинара — Студенческого совета школы Миллениум.\n\nЖелание мира для Миллениума и всего мира заставляет её делать всё, что она считает необходимым. Благодаря этому Рио стала известна как «старшая сестра» для всех. Её вкусы в стиле и эстетике довольно необычны. Корпус роботов Avant Guard, о котором знают лишь немногие студенты, прекрасно это демонстрирует."
