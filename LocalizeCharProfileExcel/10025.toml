10025-ProfileIntroductionJp = "Aluna do Colégio Sênior Shanhaijing e instrutora do departamento de apoio educacional \"Jardim da Flor de Ameixeira\", que acabou voltando ao corpo de criança após tomar um remédio da Saya.\n\nComo apenas o seu corpo encolheu, era de se esperar que ela agisse como sempre... mas não é bem assim: puxada pelo corpo infantil, sua mente parece acabar se deixando guiar pelos próprios instintos."
