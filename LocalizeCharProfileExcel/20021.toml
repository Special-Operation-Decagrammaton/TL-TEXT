20021-ProfileIntroductionJp = "Участница Рыцарей исправительного курса Тринити в костюме Санты для празднования Рождества.\n\nИз-за очень активного характера Ханаэ нужен костюм Санты, который не сковывает движений. Для девушки, которую радует буквально всё, Рождество — не меньше чем целый месяц фестиваля. Она повсюду таскает охапки подарков и звонит в колокольчик, наполняя всех праздничным настроением."
