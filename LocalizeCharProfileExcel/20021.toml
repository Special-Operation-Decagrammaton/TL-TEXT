20021-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e integrante das Cavaleiras Hospitalárias que se vestiu de Mamãe Noel para celebrar o Natal.\n\nFiel ao seu jeito sempre cheio de energia, a Hanae escolheu uma roupa natalina que facilita os movimentos. Para alguém que se diverte com tudo como ela, o Natal é uma verdadeira festa. Carregando pacotes de presentes e tocando seu sino, ela participa de trabalhos voluntários para espalhar felicidade a todos."
