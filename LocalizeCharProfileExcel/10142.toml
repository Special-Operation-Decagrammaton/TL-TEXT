10142-ProfileIntroductionJp = "A presidente do Comitê de Mediação de Conflitos Hyakkaryouran, da Academia Aliada Hyakkiyako, que vestiu seu traje de banho com a chegada do verão.\n\nPara fortalecer a união de todas, ela participa do Festival Aquático de Hyakuya. Sua liderança, como uma flor que desabrocha graciosamente, simboliza o renascimento do Hyakkaryouran."
