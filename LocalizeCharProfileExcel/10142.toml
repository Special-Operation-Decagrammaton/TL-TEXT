10142-ProfileIntroductionJp = "Президент Совета урегулирования Хяккарёран в летнем купальнике.\n\nОна участвует в Фестивале воды Хяккияко в знак солидарности с участницами клуба. Словно прекрасный распустившийся цветок, Нагуса демонстрирует выдающееся лидерство во всех состязаниях и возвещает возрождение Хяккарёран."
