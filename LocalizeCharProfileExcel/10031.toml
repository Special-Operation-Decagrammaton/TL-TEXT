10031-WeaponDescJp = "Um fuzil de precisão de design clássico que a Aru cuida com o maior carinho no dia a dia.\n\nSegundo ela, com a chegada do Ano-Novo a arma ganhou ainda mais bagagem e, tal qual sua dona, ficou ainda mais hardboiled..."
10031-ProfileIntroductionJp = "Aluna da Academia Gehenna e a autointitulada presidente do Faz-Tudo 68 celebrando o Ano-Novo.\n\nPara desejar a prosperidade do Faz-Tudo no ano que se inicia, resolveu começar pelas aparências: gastou uma nota para arrumar o cabelo, alugou até um quimono e já começou o ano cheia de gás. Por conta do traje, está ainda mais tensa e empolgada do que de costume. Ela mesma se esforça para caminhar com elegância e falar pausadamente, interpretando o papel de uma presidente refinada (mas, por dentro, continua a mesmíssima Aru de sempre)."
10031-CharacterSSRNewJp = "Entendo, o primeiro serviço do ano, né? Pode olhar, vou resolver isso com brilhantismo!"
