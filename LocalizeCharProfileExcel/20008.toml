20008-WeaponDescJp = "A pistola que a Ako carrega consigo.\n\nUm item precioso que lhe foi entregue quando assumiu o cargo de oficial administrativa após um esforço incansável. Ela a leva para todos os lados e cuida dela com enorme zelo."
20008-ProfileIntroductionJp = "Aluna da Academia Gehenna, oficial administrativa do Comitê Disciplinar e uma espécie de secretária para a presidente Hina.\n\nÀ primeira vista, passa a impressão de ser gentil e bondosa, mas é implacável com alunas que violam as regras. Está sempre ao lado de Hina, a presidente do Comitê Disciplinar, auxiliando-a em tudo. Por conta disso, algumas alunas de Gehenna chegam a chamá-la de \"bichinho de estimação da Hina\", mas ela mesma não parece se importar muito com isso."
20008-CharacterSSRNewJp = "Já que eu vou cooperar, não vou tolerar nenhuma falha, entendeu?"
