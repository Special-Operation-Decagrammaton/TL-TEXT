20008-ProfileIntroductionJp = "Старший администратор Команды Префектов Геенны и секретарь Старшего Префекта Хины.\n\nАко всегда рядом с Хиной и помогает ей. На первый взгляд она кажется доброй и мягкой, но нарушителей правил подавляет беспощадно и без малейшей жалости. Студенты Геенны часто называют её «питомцем Хины», но, похоже, Ако это не особенно задевает."
