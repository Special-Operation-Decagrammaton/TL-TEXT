10034-WeaponDescJp = "A pistola automática que a Mimori carrega no dia a dia.\n\nComprou-a quando sonhou pela primeira vez em se tornar uma dama admirável e cuida de sua manutenção com todo o carinho diariamente."
10034-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e a gentil vice-presidente do Clube de Treino Espiritual.\n\nSempre com um sorriso radiante e modos serenos, é imensamente querida e respeitada por todas. Influenciada por mangás shoujo que leu na infância, passou a sonhar em se tornar uma verdadeira \"Yamato Nadeshiko\" (dama tradicional ideal) e ingressou no Clube de Treino Espiritual. Ao lado de sua amiga de infância e presidente do clube, Tsubaki, dedica-se diariamente ao aperfeiçoamento na culinária, na limpeza e em outras artes."
10034-CharacterSSRNewJp = "Ainda tenho muito a aprender, mas...\npermita-me mostrar os frutos do meu treinamento."
