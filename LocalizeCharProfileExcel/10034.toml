10034-WeaponDescJp = "Автоматический пистолет, который Мимори обычно носит с собой.\n\nОна купила его, когда впервые мечтала стать изящной леди. С тех пор очень дорожит им и всегда держит рядом."
10034-ProfileIntroductionJp = "Добрая вице-президент Клуба внутренней дисциплины академии Хяккияко.\n\nПопулярная девушка, которая всегда улыбается и по-доброму относится ко всем. С детства дружит с президентом клуба Цубаки. Мимори вступила в клуб, чтобы исполнить мечту стать элегантной леди, как героини сёдзё-манги, которую она читала в детстве. Ради этой мечты она усердно тренируется, в том числе готовит и занимается уборкой."
10034-CharacterSSRNewJp = "Мне ещё далеко до цели...\nно я покажу тебе результаты своих тренировок."
