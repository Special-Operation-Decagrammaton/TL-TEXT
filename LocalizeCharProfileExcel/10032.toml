10032-WeaponDescJp = "A metralhadora que a Mutsuki carrega sempre consigo.\n\nEmbora tenha se produzido toda para o Ano-Novo, sua arma continua devidamente guardada dentro da bolsa. Segundo a Mutsuki, ela pode sacá-la num piscar de olhos se for preciso, sem atrapalhar em nada as suas travessuras."
10032-ProfileIntroductionJp = "Aluna da Academia Gehenna e chefe de operações e de assalto do Faz-Tudo 68.\n\nPara ir fazer a primeira visita do ano ao santuário (ou melhor, passear) com a Aru e as outras, renovou o visual. Mesmo toda produzida para o Ano-Novo, por dentro continua exatamente igual: provocando travessuras e confusões para assistir a tudo dando risada. Neste novo ano, segue acompanhando de camarote a Aru se meter em enrascadas como sempre. Fora isso, é uma garota diabinha que curte o Ano-Novo no seu próprio ritmo."
10032-CharacterSSRNewJp = "Kufufu♪ Vamos brincar muito juntos neste ano também, Sensei!"
