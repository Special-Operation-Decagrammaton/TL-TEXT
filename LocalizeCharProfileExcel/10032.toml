10032-WeaponDescJp = "Многоцелевой пулемёт, который Муцуки всегда носит с собой.\n\nНа новогоднем празднике он тихо лежит у неё в сумке. Но, как Муцуки всегда говорит с улыбкой: «Я всегда не против устроить одну-две шалости...»"
10032-ProfileIntroductionJp = "Главная заводила и начальница штаба Problem Solver 68.\n\nМуцуки отправляется вместе с Ару праздновать наступление Нового года. Ради праздника она постаралась нарядиться особенно красиво, но это совсем не изменило её привычку смеяться и искренне наслаждаться проблемами, которые сама же создаёт. Эта нарушительница спокойствия встречает Новый год вместе с Ару, которая, как обычно, каким-то образом постоянно оказывается в неприятностях."
