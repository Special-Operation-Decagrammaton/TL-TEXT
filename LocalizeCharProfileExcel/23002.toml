23002-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma caloura alegre e cheia de energia das Cavaleiras Hospitalárias.\n\nÉ uma garota otimista e vibrante em tudo o que faz, mas quando encontra um paciente, às vezes faz tanto alarde que acaba piorando a situação. Embora seja um pouco avoada, dizem que, misteriosamente, os pacientes cuidados por ela se curam num instante de qualquer doença."
