23002-ProfileIntroductionJp = "Весёлая и энергичная первокурсница Рыцарей исправительного курса Тринити.\n\nХанаэ жизнерадостна и всегда смотрит на жизнь позитивно, но при виде пациента порой слишком увлекается лечением и в итоге делает только хуже. Иногда она ведёт себя весьма странно, однако пациенты под её присмотром почему-то выздоравливают быстрее независимо от болезни."
