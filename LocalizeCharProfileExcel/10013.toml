10013-ProfileIntroductionJp = "Aluna da Academia Geral Trinity, presidente do Comitê de Realização da Justiça e a arma estratégica da Trinity.\n\nDe natureza beligerante e violenta, é do tipo que primeiro destrói o que não lhe agrada para só depois pensar. Graças à vice-presidente Hasumi, o Comitê de Realização da Justiça consegue manter o controle por um triz. Apesar de ser um cão louco incontrolável, diante do Sensei a Tsurugi revela um lado de garota tímida que mal consegue esconder a vergonha."
