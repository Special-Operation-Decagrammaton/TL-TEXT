10017-WeaponDescJp = "Uma pistola usada pela Cherino quando vai expurgar alguém.\n\nEm Red Winter, nem é preciso puxar o gatilho: basta ela apontar o cano e gritar \"Expurgo!\" para que o alvo seja imediatamente condenado ao expurgo."
10017-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter e sua presidente estudantil tirânica e infantil.\n\nPossui um apego e uma sede de poder imensos; embora seja deposta por revoluções quase toda semana, sempre dá um jeito de retornar à cadeira de presidente do conselho estudantil. Segundo a própria Cherino, seu bigode postiço é um \"símbolo de autoridade\", pois \"a verdadeira autoridade emana do bigode\"."
10017-CharacterSSRNewJp = "Sinta-se honrado por ter conhecido a mim, a autoridade suprema!"
