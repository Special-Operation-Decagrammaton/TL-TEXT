20003-ProfileIntroductionJp = "Преданная участница Комитета правосудия Тринити.\n\nВооружённая огромной снайперской винтовкой почти с неё ростом, Маширо невозмутимо обеспечивает огневую поддержку. Она немногословна, но вовсе не застенчива и не неловка в общении — стоит заговорить о справедливости, и её уже трудно остановить."
