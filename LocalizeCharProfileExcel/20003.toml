20003-WeaponDescJp = "O fuzil de precisão usado pela Mashiro durante suas atividades no Comitê de Realização da Justiça.\n\nEmbora seu tamanho seja originalmente inadequado para o transporte a pé, segundo a própria Mashiro, esse tipo de detalhe é irrelevante diante da justiça."
20003-ProfileIntroductionJp = "Aluna da Academia Geral Trinity e uma integrante íntegra do Comitê de Realização da Justiça.\n\nUma garota que carrega um fuzil de precisão desproporcionalmente grande, quase da sua própria altura, e cumpre silenciosamente suas missões de suporte de fogo. Embora costume falar pouco, não é por timidez ou dificuldade de lidar com outras pessoas; inclusive, quando o assunto é justiça, ela de repente se torna bastante falante."
20003-CharacterSSRNewJp = "Onde quer que a justiça seja necessária, eu irei."
