16004-WeaponDescJp = "A metralhadora que pertence à Pina.\n\nO entusiasmo com que a Pina manuseia essa arma, quase como se estivesse dançando, é impressionante, e ela mesma diz que isso faz seu coração ferver de emoção."
16004-ProfileIntroductionJp = "Uma garota da Academia Aliada Hyakkiyako que admira o código de honra yakuza (ninkyo).\n\nSempre alegre e cheia de vida, é o tipo de garota que sente alegria em ajudar o próximo. Como todo o seu conhecimento sobre cavalheirismo yakuza veio dos filmes, há várias coisas meio estranhas no jeito dela... mas ela segue firme e sincera no caminho de honra com que tanto sonha."
