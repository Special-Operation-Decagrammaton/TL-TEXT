16004-ProfileIntroductionJp = "Преданная поклонница дружинников, обучающаяся в академии Хяккияко.\n\nПина — жизнерадостная и энергичная девушка, которая любит помогать другим. Всё, что она знает о дружинниках, почерпнуто из фильмов, поэтому точность её знаний порой вызывает сомнения. Тем не менее она упорно стремится однажды сама стать дружинницей."
