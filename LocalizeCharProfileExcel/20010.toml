20010-ProfileIntroductionJp = "Хозяйка Курорта горячих источников № 227, управляющая огромным комплексом вместе с участницами Спецотряда.\n\nНодока всё ещё отстранена от занятий в Красной Зиме, но неожиданно богатеет, когда на территории Старого института внезапно бьёт горячий источник. Правда, проблемы не заканчиваются: студенты федеральной академии Красная Зима с яркими характерами постоянно мешают бизнесу по самым разным причинам."
