20010-WeaponDescJp = "A submetralhadora que a Nodoka sempre carrega consigo.\n\nAo que parece, era usada principalmente para guiar hóspedes pelas estradas escuras ao redor da estância termal à noite, mas dizem que também servia para convidar clientes inconvenientes a se retirarem."
20010-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter que cumpria suspensão na Classe Especial Nº 227 do prédio antigo, mas que, por um acaso do destino, acabou se tornando a anfitriã da \"Estância Termal Nº 227\".\n\nGraças à fonte termal que brotou repentinamente no prédio antigo, ela estava prestes a ficar rica da noite para o dia. Contudo, como alunas excêntricas de Red Winter e de outros lugares não param de aparecer ou de sabotar o negócio pelos mais variados motivos, suas dores de cabeça continuam não tendo fim."
20010-CharacterSSRNewJp = "Receberei os nossos hóspedes de todo o coração!"
