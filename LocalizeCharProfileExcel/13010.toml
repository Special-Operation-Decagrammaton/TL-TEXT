13010-ProfileIntroductionJp = "Казначей Семинара — студенческого совета научной школы Миллениум.\n\nМатематические способности Юки выделяются даже среди многочисленных технарей Миллениума. Она контролирует весь бюджет школы. Особый талант Юки — счёты, и когда её одолевают эмоциональные или внутренние противоречия, она по привычке перебирает костяшки."
