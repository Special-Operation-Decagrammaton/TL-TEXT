13010-ProfileIntroductionJp = "Tesoureira do \"Seminário\", o conselho estudantil da Escola de Ciências Millennium.\n\nMesmo na Millennium, onde a proporção de alunas de exatas é altíssima, ela se destaca como um prodígio da matemática e supervisiona toda a gestão orçamentária da escola. Sua especialidade é o ábaco, e ela tem o hábito de mover as contas do ábaco para se acalmar quando está preocupada com problemas complexos ou em meio a um dilema."
