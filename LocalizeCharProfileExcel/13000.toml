13000-ProfileIntroductionJp = "Agente da organização secreta \"C&C\", da Escola de Ciências Millennium.\n\nSeu codinome é \"Zero Três\" e ela é uma operativa especializada em \"limpeza\". Usando sua aparência gentil como arma, ela se infiltra no território inimigo e limpa tudo perfeitamente com explosivos, sendo conhecida pelo apelido de \"Profissional da Limpeza\"."
