20014-WeaponDescJp = "A metralhadora padrão fornecida à Saki pela Academia Especial SRT.\n\nSua desvantagem é a manutenção difícil devido a questões estruturais, mas, em compensação, ostenta um poder de fogo imenso quando bem cuidada."
20014-ProfileIntroductionJp = "Aluna da Academia Especial SRT e batedora de vanguarda do Pelotão RABBIT.\n\nIngressou na Academia Especial SRT buscando uma vida pautada por regras rígidas, mas a academia foi fechada repentinamente. Atualmente, vive acampada em um parque com suas companheiras de pelotão. Carrega sempre consigo o manual tático da SRT e é do tipo que preza por agir estritamente conforme os protocolos. Tem como hobby colher plantas silvestres e juntar sucatas, o que parece estar sendo muito útil na atual vida no parque, onde os recursos são escassos. Seu codinome é \"RABBIT 2\"."
20014-CharacterSSRNewJp = "Aqui é a RABBIT 2, na escuta, câmbio."
