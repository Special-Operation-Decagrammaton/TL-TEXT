20014-ProfileIntroductionJp = "Передовая боец Отряда RABBIT академии SRT. Позывной — «RABBIT 2».\n\nСаки поступила в SRT ради дисциплинированной жизни, о которой всегда мечтала. Когда академию закрыли, она вместе с отрядом отказалась бросать школу и устроила протестный лагерь в парке. Отличница до сих пор носит с собой учебники и руководства SRT. Любит собирать дикорастущую зелень и искать в мусоре вещи, которые можно превратить в полезные припасы."
