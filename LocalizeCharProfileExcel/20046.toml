20046-ProfileIntroductionJp = "Aluna da Academia Aliada Hyakkiyako e presidente do Clube Yin-Yang.\n\nPara quem é de fora, ela é conhecida como a presidente do conselho estudantil, mas devido à própria estrutura da Academia Aliada, está sujeita a circunstâncias mais complexas. Por isso, ela dá a desculpa de ser vista como uma \"presidente que não trabalha\"... mas sua aversão ao trabalho é algo puramente natural. Embora pareça sempre causar incidentes por mera curiosidade, por trás disso ela parece esconder suas verdadeiras intenções de todos."
20046-CharacterSSRNewJp = "Nyaha, não tem jeito mesmo, eu vou ter que fazer, né~?\nTá bom, tá bom, já vou trabalhar~"
