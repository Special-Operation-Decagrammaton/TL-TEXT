20046-ProfileIntroductionJp = "Президент клуба Инь-Ян Объединённой академии Хяккияко.\n\nДля посторонних она вроде бы президент Студенческого совета, но сложная структура объединённой академии делает её роль куда запутаннее. Ния давно известна как президентка, избегающая ответственности... впрочем, такая уж она есть. На первый взгляд её многочисленные интриги выглядят исключительно корыстными, однако за кулисами всё гораздо сложнее."
20046-CharacterSSRNewJp = "А, мне правда придётся это делать, да?\nЛадно, ладно. Приступаю к работе."
