10136-ProfileIntroductionJp = "Тактический специалист Отряда исследования сверхъестественных явлений, вооружённая и готовая поддерживать миссию в новой роли — назначенного полевого снайпера.\n\nКостюм создавался с учётом её роли тыловой поддержки, но Эйми не выдержала жары под маскировочным плащом и теперь носит его завязанным на талии.\n\nКак и Токи, главным оружием она сделала энергетическую систему. Однако снайперский визор требует много энергии, поэтому её силовой блок получился заметно крупнее и тяжелее, чем у Токи."
