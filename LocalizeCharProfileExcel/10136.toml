10136-WeaponDescJp = "O fuzil de energia recém-fabricado da Eimi.\n\nUma arma para especialistas, preparada especialmente para o suporte na retaguarda."
10136-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e especialista da Força-Tarefa de Fenômenos Paranormais.\n\nTrocou de traje para prestar suporte na retaguarda como atiradora de elite. Embora tenha pensado que cobrir mais a pele seria mais adequado para o suporte... parece que não aguentou o calor e acabou tirando a capa e amarrando-a na cintura.\n\nAssim como a Toki, mudou sua arma principal para um fuzil de energia. Como utiliza um visor de auxílio de tiro de precisão, dizem que sua mochila também é muito maior do que a da Toki."
