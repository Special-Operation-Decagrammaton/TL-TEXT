10060-WeaponDescJp = "O lança-chamas exclusivo da Megu, que nas obras pode ser considerado parte do próprio corpo dela.\n\nComo libera um calor absurdo, mais ninguém consegue controlá-lo. Seu nome peculiar veio de um trocadilho dito por outra pessoa, do qual ela gostou tanto que resolveu adotar."
10060-ProfileIntroductionJp = "Estudante da Academia Gehenna, coração do Clube de Desenvolvimento de Fontes Termais e chefe da equipe de obras em campo.\n\nAcredita do fundo do coração que todos os problemas podem ser resolvidos \"demolindo\" o que estiver na frente. Com sua personalidade expansiva e direta, além de uma capacidade de demolição imbatível, ela goza da total confiança dos membros do clube."
