13009-WeaponDescJp = "A submetralhadora usada pela Tsubaki.\n\nAo que parece, ela escolheu um modelo compacto para não atrapalhar seu treinamento diário. A propósito, o \"I\" é o travesseiro guardado dentro do escudo dela."
13009-ProfileIntroductionJp = "Presidente do Clube de Treino Espiritual, da Academia Aliada Hyakkiyako.\n\nEla está sempre treinando em busca de um \"sono mais tranquilo e perfeito\". Sua maestria é tanta que ela consegue dormir sentada, em pé e até mesmo enquanto come, o que lhe rendeu o apelido de \"Bela Adormecida\". Está sempre cochilando, mas quando cai a noite, age em segredo nas sombras para proteger a cidade."
