13009-WeaponDescJp = "Пистолет-пулемёт Цубаки.\n\nЦубаки выбрала компактную модель, чтобы оружие не мешало ежедневным тренировкам.\nДля справки: «Спящий спутник I» — это подушка внутри её щита."
13009-ProfileIntroductionJp = "Президент Клуба внутренней дисциплины академии Хяккияко.\n\nОна регулярно тренируется ради одной цели — добиться «ещё более комфортного и спокойного сна». Благодаря упорным тренировкам Цубаки умеет спать сидя, стоя и даже во время еды. За это мастерство она получила прозвище «Спящая красавица». Хотя кажется, будто она постоянно вот-вот задремлет, по ночам Цубаки выходит патрулировать улицы и поддерживать порядок."
