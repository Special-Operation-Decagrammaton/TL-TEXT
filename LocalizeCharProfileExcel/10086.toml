10086-WeaponDescJp = "Многоцелевой пулемёт, которым Хина владеет так естественно, будто это часть её тела.\n\nБезжалостное оружие, созданное для наказания нарушителей. Но на этот раз Хина обращается с ним сдержанно и мягко — ради кое-кого другого."
10086-ProfileIntroductionJp = "Старший Префект Академии Геенна в прекрасном платье для предстоящей вечеринки.\n\nОбычно подобное мероприятие она сочла бы утомительным, но обещание присутствия Сенсея на вечеринке Геенны пробудило её интерес. Возможно, Хина и сама не замечает, насколько сильно воодушевлена, пока усердно репетирует сольную партию на пианино."
10086-CharacterSSRNewJp = "Все мои старания — для тебя."
