10086-WeaponDescJp = "A metralhadora que a Hina manuseia como se fosse uma extensão do próprio corpo.\n\nNormalmente é uma arma implacável contra quem infringe as regras escolares ou perturba a ordem, mas, excepcionalmente desta vez, está sendo cuidada e manuseada com todo o carinho por causa de alguém especial."
10086-ProfileIntroductionJp = "Estudante da Academia Gehenna e presidente do Comitê Disciplinar, usando um vestido de gala para participar da festa.\n\nEmbora normalmente ache tudo trabalhoso demais, ao ouvir que o Sensei estava ansioso pela festa de Gehenna, ela ficou um pouco mais empolgada que de costume. Dizem que, desde o dia em que ficou decidido que se apresentaria diante do Sensei, ela tem se esforçado mais do que nunca nos treinos de piano, instrumento com o qual não tem muita afinidade."
10086-CharacterSSRNewJp = "Vou dar o meu melhor... por você."
