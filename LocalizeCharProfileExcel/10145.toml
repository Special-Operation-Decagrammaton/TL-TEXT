10145-ProfileIntroductionJp = "A líder do \"Genryumon\", o conselho estudantil do Colégio Sênior Shanhaijing, que vestiu um traje de banho para receber o verão.\n\nCom a ajuda das pessoas ao seu redor, ela decidiu sair em férias de verão. Sentindo-se melhor de saúde do que de costume, parece desfrutar de uma sensação ainda maior de liberdade. Como momentos livres assim são raros, ela pretende \"aproveitar de várias formas\"."
