26012-ProfileIntroductionJp = "Uma entusiasmada aluna do Departamento de Segurança Comunitária, da Escola de Polícia Valkyrie, destacada para atuar como salva-vidas.\n\nSua motivação é impecável, mas, infelizmente, a habilidade prática ainda não acompanha tanta vontade. Mesmo assim, sem desanimar, ela se dedica de corpo e alma à sua missão de salva-vidas."
