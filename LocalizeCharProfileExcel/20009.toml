20009-ProfileIntroductionJp = "Президент федеральной академии Красная Зима, приехавшая отдохнуть на Курорт горячих источников № 227.\n\nСначала Черино собиралась снести курорт, который Спецотряд построил без её разрешения, но гостеприимство Нодоки и остальных настолько её устроило, что она решила продлить пребывание на неопределённый срок. При этом сами горячие источники ей нравятся куда меньше, чем отдых и еда на курорте."
