20009-WeaponDescJp = "A pistola que a Cherino usa quando decide expurgar alguém.\n\nParece que a Tomoe fez modificações nela para que não enferruje mesmo em ambientes quentes e úmidos como a estância termal."
20009-ProfileIntroductionJp = "Aluna da Academia Federal Red Winter e presidente do conselho estudantil, curtindo a Estância Termal Nº 227 com toda a folga.\n\nNo início, irritada com o fato de a estância termal ter sido construída sem a sua permissão, a Cherino foi até lá pensando em demolir tudo e promover um expurgo. No entanto, logo que chegou, foi conquistada pelos mimos da Nodoka e das outras, mudando completamente de ideia e passando a aproveitar o local ao máximo. Embora esteja satisfeita com o resort e com a comida, parece que não gosta tanto assim de entrar nas águas termais em si."
