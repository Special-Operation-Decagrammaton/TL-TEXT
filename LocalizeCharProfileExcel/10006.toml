10006-WeaponDescJp = "Um fuzil de precisão que a Iori usa para lidar com os problemas causados por infratores das regras.\n\nTem um formato simples e sequer possui luneta, mas, segundo a Iori, \"uma especialista não escolhe suas ferramentas\"."
10006-ProfileIntroductionJp = "Aluna da Academia Gehenna e especialista implacável do Comitê Disciplinar.\n\nComo comandante de linha de frente do Comitê Disciplinar, pune imediatamente com força esmagadora qualquer aluna que seja flagrada quebrando as regras. Tem raciocínio rápido, é competente no trabalho e possui um ótimo instinto de combate, mas como também tem um lado imprudente que a faz perder a noção do redor ao avistar um inimigo, acaba caindo com bastante facilidade até nas armadilhas mais simples."
10006-CharacterSSRNewJp = "Não vou perdoar ninguém que quebre o regulamento escolar!"
