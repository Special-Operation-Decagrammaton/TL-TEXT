20033-WeaponDescJp = "O fuzil de precisão usado pela Makoto.\n\nPara demonstrar sua autoridade, ela encomendou esta legítima obra-prima diretamente a um famoso artesão de Gehenna. Contudo, como a própria Makoto prefere dar ordens da retaguarda em vez de ir para a linha de frente, parece que ela raramente chega a usá-lo de fato."
20033-ProfileIntroductionJp = "Aluna da Academia Gehenna e presidente da \"Sociedade Pandemonium\".\n\nUma ambiciosa e conspiradora fiel aos próprios desejos, que não mede artimanhas para conseguir o que quer. Às vezes, por causa dessa atitude, acaba se dando mal e desanimando com frequência, mas é uma garota de fibra que se recupera num instante. Ela mima a Ibuki como se fosse uma irmãzinha mais nova e, da mesma forma, explora o trabalho da Iroha como se também fosse sua irmã mais nova."
20033-CharacterSSRNewJp = "Vamos, Sensei!\nChegou a hora de marchar em frente ao lado da nossa \"Sociedade Pandemonium\"!"
