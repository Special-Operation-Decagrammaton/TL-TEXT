20033-WeaponDescJp = "Снайперская винтовка Макото.\n\nОна заказала этот шедевр у знаменитого мастера как символ своей власти. Правда, сама Макото редко выходит на поле боя, поэтому оружие почти не используется."
20033-ProfileIntroductionJp = "Председатель Общества Пандемония.\n\nАмбициозный лидер, чьи замыслы не знают границ. Её непродуманные планы часто втягивают общество в неприятности, но Макото легко отмахивается, будто вовсе ни при чём. К Ибуки относится как к младшей сестре, которую хочется баловать, а Ироху воспринимает как младшую, которой можно командовать."
20033-CharacterSSRNewJp = "Время пришло, Сенсей!\nТы вступишь в Общество Пандемония!"
