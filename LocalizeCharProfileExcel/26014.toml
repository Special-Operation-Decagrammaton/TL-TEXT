26014-ProfileIntroductionJp = "Агент C&C, направленная работать гидом на выставке Миллениума.\n\nПомимо обычных обязанностей экскурсовода, при необходимости она становится телохранителем студентов. Карин втайне нравится обычная школьная форма, которую она носит на мероприятии, ведь ей почти никогда не выпадает шанс надеть такую. Благодаря доброму и своеобразному характеру даже студенты, которые раньше её боялись, начинают узнавать Карин лучше и проникаться симпатией."
