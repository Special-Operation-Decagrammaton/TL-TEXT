26014-ProfileIntroductionJp = "Aluna da Escola de Ciências Millennium e agente da \"C&C\" designada para atuar como guia na Millennium EXPO.\n\nPara acumular as funções de guia do evento e escolta de autoridades, ela vestiu o uniforme escolar. Como normalmente usa roupa de empregada devido à natureza do seu clube, não consegue esconder a empolgação com esta rara oportunidade. Por ser calma e simpática, parece estar conquistando a confiança de todos também como guia."
