10079-WeaponDescJp = "Uma arma de fogo exclusiva criada pelo Clube de Engenharia especialmente para Misaka Mikoto.\n\nTambém vem equipada com funções \"especiais\" voltadas para usuários de poderes elétricos."
10079-ProfileIntroductionJp = "Estudante do ensino fundamental pertencente ao Colégio Tokiwadai.\n\nÉ uma das apenas sete \"Nível 5\", a elite máxima entre os inúmeros médiuns (espers) da \"Cidade Acadêmica\". Seu poder consiste em manipular livremente correntes elétricas poderosas, sendo conhecida como \"Mestra da Eletricidade (Electromaster)\". Contudo, desde que foi transportada para Kivotos, parece não estar conseguindo usar suas habilidades como gostaria. Por tratar a todos de maneira franca e ter um coração gentil, conquistou rapidamente a simpatia das outras alunas. É grande fã do personagem de sapinho \"Gekota\"."
10079-CharacterSSRNewJp = "Francamente... Parece que mesmo aqui as coisas continuam agitadas como sempre, né?"
