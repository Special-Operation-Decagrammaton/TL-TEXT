10079-ProfileIntroductionJp = "Студент средней школы Токивадай.\n\nМисака — одна из семи эсперов 5-го уровня Академгорода, где живут студенты со сверхъестественными способностями. Как Электромастер она умеет управлять мощными электрическими токами, но после попадания в Кивотос пользоваться силой стало сложнее. Мисака общительная и добрая, поэтому легко сходится с окружающими. А ещё она фанатка мультяшной лягушки из своего мира по имени Гэкота."
