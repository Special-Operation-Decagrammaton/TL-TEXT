10058-ProfileIntroductionJp = "Капитан Рыцарей исправительного курса Тринити. Настоящий рыцарь в сияющих доспехах: честная и решительная, хотя порой склонна к радикальным методам.\n\nВ Тринити о ней шутят: Минэ всё ломает, а её рыцари потом собирают по кусочкам. В свободное время она ухаживает за снаряжением и готовит закуски и напитки для встреч с друзьями. Некоторые говорят, что в чёрном чае она разбирается не хуже Хасуми из Комитета правосудия."
10058-CharacterSSRNewJp = "Я Аомори Минэ, капитан Рыцарей исправительного курса. Кому-нибудь нужна медицинская помощь?"
