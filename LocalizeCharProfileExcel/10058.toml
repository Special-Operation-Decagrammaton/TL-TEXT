10058-WeaponDescJp = "A escopeta da Mine.\n\nEla afirma que o socorro médico às vezes possui duas faces. Talvez esta arma seja justamente o argumento que sustenta sua afirmação..."
10058-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e capitã das Cavaleiras Hospitalárias. Uma guerreira de jaleco branco com personalidade íntegra e determinada, mas que também possui um lado extremo.\n\nDizem que o boato sobre as Cavaleiras Hospitalárias — \"a Mine destrói e as Cavaleiras tratam\" — ecoa por toda a Trinity. Apesar disso, ela também tem um lado tranquilo, relaxando a mente ao fazer a manutenção de seu equipamento ou ao convidar conhecidos para um chá. Além disso, seu profundo conhecimento sobre chá preto rivaliza com o da Hasumi, do Comitê de Realização da Justiça."
10058-CharacterSSRNewJp = "Sou Aomori Mine, capitã das Cavaleiras Hospitalárias.\nOnde está quem precisa de socorro?"
