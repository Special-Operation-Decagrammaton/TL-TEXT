20016-WeaponDescJp = "Пистолет, который Ироха носит с собой.\nПоскольку Ироха — командир танка Общества Пандемония, она постоянно жалуется, что таскать оружие, которым не пользуешься, ужасно неудобно. Но при этом идеально за ним ухаживает — типичное поведение Ирохи."
20016-ProfileIntroductionJp = "Участница Общества Пандемония.\n\nБольше всего Ироха ненавидит, когда её беспокоят. Значительную часть времени она придумывает, как бы избавиться от лишней компании. Даже постоянно носит с собой книгу, чтобы люди оставляли её в покое, но Общество Пандемония — точнее, Макото — всё равно всегда мешает. Ироха нехотя исполняет обязанности руководительницы общества, находя утешение лишь в их талисмане Ибуки."
20016-CharacterSSRNewJp = "Я нужна? Эх... ладно, хорошо."
