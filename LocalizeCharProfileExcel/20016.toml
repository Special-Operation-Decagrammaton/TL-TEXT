20016-WeaponDescJp = "A pistola que a Iroha carrega consigo.\n\nComo comandante de tanque da Sociedade Pandemonium, ela raramente tem ocasião de usá-la e vive reclamando que até mesmo uma arma desse tamanho dá preguiça de carregar; ainda assim, o fato de mantê-la impecavelmente limpa todos os dias revela bem o jeito de ser da Iroha."
20016-ProfileIntroductionJp = "Aluna da Academia Gehenna e uma das integrantes da \"Sociedade Pandemonium\".\n\nPor natureza, ela é bem preguiçosa, mas o cotidiano em Gehenna é repleto de problemas, e o conselho estudantil \"Sociedade Pandemonium\" (mais precisamente, a Makoto) obviamente não a deixa descansar. Mesmo repetindo \"que saco\" e \"não tem jeito\", ela atua como uma gerente intermediária que resolve com naturalidade a pilha infinita de problemas e tarefas. Encontrando conforto na Ibuki, a mascote da Sociedade Pandemonium, ela segue cumprindo seu expediente hoje também entre um suspiro e outro."
20016-CharacterSSRNewJp = "...Precisa de mim?\nFrancamente, não tem jeito mesmo."
