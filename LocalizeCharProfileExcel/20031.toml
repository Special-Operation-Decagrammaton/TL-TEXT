20031-ProfileIntroductionJp = "Студент Спецотряда, помогающая управлять Курортом горячих источников № 227.\n\nКогда в Старом институте внезапно забил горячий источник, она вместе с Нодокой открыла огромный курорт. В отличие от Нодоки, Шигурэ не слишком интересуют расширение бизнеса и прибыль. Зато возможность готовить для клиентов самые разные напитки и угощения приводит её в восторг."
