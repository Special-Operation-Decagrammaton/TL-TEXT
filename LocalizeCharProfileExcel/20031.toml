20031-WeaponDescJp = "O lança-granadas que a Shigure sempre carrega consigo.\n\nA cena da Shigure recarregando granadas com maestria, como se agitasse uma coqueteleira, tornou-se uma das atrações da Estância Termal Nº 227 e faz muito sucesso entre os hóspedes."
20031-ProfileIntroductionJp = "Aluna suspensa da Classe Especial Nº 227 da Academia Federal Red Winter, que administra a Estância Termal Nº 227 junto com suas colegas de classe.\n\nDepois que uma fonte termal brotou repentinamente no prédio antigo, ela acabou assumindo a gestão de uma enorme estância termal ao lado da Nodoka. Diferente da Nodoka, ela não parece muito interessada em fazer o negócio prosperar, mas está satisfeita por ter um ambiente onde pode preparar várias bebidas e doces à vontade."
20031-CharacterSSRNewJp = "Depois de aquecer o corpo nas águas termais, agora é a vez de aquecer o coração."
