10059-WeaponDescJp = "Любимый пистолет-пулемёт Мики.\n\nКогда-то это был обычный пистолет-пулемёт производства Тринити, пока Мика не украсила его с любовью. Теперь он сияет, словно звезда в ночном небе. Можно не сомневаться: он сопровождал Мику во всех её делах."
10059-ProfileIntroductionJp = "Бывшая глава Патер — одной из союзных фракций, составляющих старшую школу Тринити.\n\nБывшая участница Tea Party и подруга детства Нагисы, другой участницы Tea Party. Когда их политические взгляды сталкиваются, Мика чётко отделяет публичные разногласия от личной дружбы.\nОна кажется живой, весёлой и почти всегда улыбается. Но за этой манерой скрываются переживания, которыми она не может поделиться, поэтому понять её бывает непросто."
