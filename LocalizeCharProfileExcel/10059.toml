10059-WeaponDescJp = "A submetralhadora favorita da Mika.\n\nEra apenas uma submetralhadora comum fabricada na Trinity, mas foi decorada com todo o carinho pela Mika. Agora, possui um visual especial que brilha como as estrelas mesmo na escuridão, estando sempre pronta para entrar em ação por ela a qualquer hora e em qualquer lugar."
10059-ProfileIntroductionJp = "Estudante da Academia Geral Trinity e ex-líder da \"Pater\", uma das facções estudantis que compõem a Trinity.\n\nEx-integrante do Tea Party, ela também é amiga de infância da atual líder, Nagisa. Contudo, por estarem em posições políticas opostas, sabe separar muito bem os assuntos pessoais dos oficiais. Embora esteja sempre rindo alegremente e demonstrando um jeito inocente, parece guardar no peito preocupações que não pode contar a ninguém."
10059-CharacterSSRNewJp = "Prontinho, desculpa a demora!\nDe agora em diante, pode deixar tudo comigo☆"
