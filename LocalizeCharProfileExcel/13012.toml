13012-WeaponDescJp = "A pistola padrão fornecida à Kirino pela Escola de Polícia Valkyrie.\n\nA Kirino suspeita que a culpa pela sua mira desastrosa seja desta arma, mas não há absolutamente nada de errado com ela."
13012-ProfileIntroductionJp = "Uma aluna entusiasmada do Departamento de Segurança Comunitária, da Escola de Polícia Valkyrie.\n\nEla ingressou na Escola de Polícia Valkyrie por admirar as policiais que mantêm a ordem na Cidade Acadêmica, mas como sua pontaria era catastrófica, acabou sendo designada para o Departamento de Segurança Comunitária. Mesmo assim, ela não desiste do sonho de se tornar uma policial capaz de deter criminosos de forma brilhante e continua se esforçando todos os dias."
