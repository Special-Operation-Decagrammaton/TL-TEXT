13012-ProfileIntroductionJp = "Увлечённая курсантка Бюро общественной безопасности Полицейской школы Валькирии.\n\nОна поступила в Валькирию, восхищаясь старшекурсницами, но из-за плохой стрельбы её перевели в Бюро общественной безопасности. Несмотря на это, Кирино продолжает усердно работать и мечтает стать офицером, который эффектно обезвреживает преступников."
