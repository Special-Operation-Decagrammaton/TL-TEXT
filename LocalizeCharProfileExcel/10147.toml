10147-WeaponDescJp = "Любимый пистолет Сацуки.\n\nКомпактный и надёжный, он сопровождает её даже на пляже. Сацуки редко стреляет из него, зато тщательно следит за его состоянием."
10147-ProfileIntroductionJp = "Глава Комитета разведки и член Общества Пандемониума.\n\nУслышав, что её ждёт роскошный круиз, Сацуки подобрала наряд по случаю, но реальность оказалась... совсем иной. Как бы то ни было, в опасных морских водах она вовсю применяет навыки руководителя разведки."
