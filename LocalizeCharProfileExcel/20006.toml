20006-ProfileIntroductionJp = "Uma inventora genial do Colégio Sênior Shanhaijing que escapou da rotina agitada para curtir um dia de folga depois de muito tempo.\n\nDiferente de seu jeito habitual de ficar trancada no laboratório imersa na pesquisa de novos medicamentos, a Saya em seu dia de folga mostra um lado bem ativo, andando de skate por toda a cidade. Ainda assim, mesmo descansando, sua curiosidade intelectual que busca incessantemente por novidades continua inalterada."
20006-CharacterSSRNewJp = "Hehehe... Por mais genial que eu seja, até um gênio precisa de descanso!"
