20006-ProfileIntroductionJp = "Гениальная изобретательница Шаньхайцзина в свой выходной.\n\nВ обычные дни Сая запирается в лаборатории и полностью посвящает себя новым эликсирам, зато во время отдыха она настолько активна, что катается на скейтборде и бродит по улицам. Но её неуёмное любопытство и желание исследовать новое никуда не исчезают даже на отдыхе."
