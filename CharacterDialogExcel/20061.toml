[translation]
20061-10-1 = "Hmm! Blue Archive!"
20061-20-1 = "...Can you hear it? The sound of gunpowder exploding.\nYou cannot stop a lit bomb—\nthat is what romance is all about."
20061-30-1 = "Aesthetics are something\nto be cherished, after all."
20061-40-1 = "Wonderful!\nTo think there is such a\ncollection of books here..."
20061-50-1 = "I felt like I was being\nwatched just now...\nMust be my imagination."
20061-60-1 = "It would be difficult to...\nuse this for hot spring decor."
20061-70-1 = "Hmm, this design...\nIt gives me some ideas."
20061-80-1 = "Oh, Sensei.\nI've taken the liberty of arriving early."
20061-90-1 = "I'm being chased, you see..."
20061-100-1 = "Would you mind hiding me\nfor a while?"
20061-110-1 = "To think I'd be on duty at a time like this...\nWell, well."
20061-120-1 = "Well, I don't mind.\nAs long as I'm here, I doubt\nanyone will come after me.\nHa-ha-ha-ha!"
20061-130-1 = "Schale duty is the best!"
20061-140-1 = "Because there's no one\nchasing me here!"
20061-150-1 = "Though, I must say...\nI'm a bit worried about the journey here."
20061-160-1 = "Schale is in a\ngood location...\nHowever..."
20061-170-1 = "It's a shame there's no hot spring..."
20061-180-1 = "Oh, don't look at me\nlike that."
20061-190-1 = "A fuse burning down, bit by bit..."
20061-200-1 = "Watching that makes\nmy blood boil."
20061-210-1 = "...I'm talking about fireworks, of course.\nHa-ha-ha-ha-ha!"
20061-220-1 = "Hm?\nJust because I'm wearing a swimsuit\ndoesn't mean I'm going to swim."
20061-230-1 = "...Swimming in a bathtub is\nagainst etiquette, after all.\nIt's a shame I can't show you."
20061-240-1 = "Reading? Ah, it's just a way to kill time."
20061-250-1 = "Well, I suppose you could call it a hobby."
20061-260-1 = "They say time is money, don't they?\nTime is finite, after all.\nIt would be a waste to spend it just playing around."
20061-270-1 = "Indeed! It is a truly auspicious day!\nDon't be shy, Sensei."
20061-280-1 = "Shall we get the\nparty started?"
20061-290-1 = "Ah, today is\nmy birthday, after all!\nI came here to be celebrated!"
20061-300-1 = "My, my... even though it's my birthday,\nI can't seem to settle down!"
20061-310-1 = "Happy New Year,\nSensei!"
20061-320-1 = "Why the sudden surprise?\nSeasonal greetings are important, aren't they?"
20061-330-1 = "Especially in these parts."
20061-340-1 = "It's cold during the\nChristmas season, after all!\nYou need something to warm you up!"
20061-350-1 = "That's where we, the Hot Spring Development Department,\ncome in!"
20061-360-1 = "Don't make that face, Sensei."
20061-370-1 = "There isn't another club that contributes\nas much to Kivotos\nas we do, is there?"
20061-380-1 = "Hmm-hmm-hmm-hmm~"
20061-390-1 = "Today is a delightful day, Sensei!\nIndeed!"
20061-400-1 = "Ah... I suppose I'll make it\nthat kind of day."
20061-420-1 = "You know, don't you?\nSecurity around here\nis quite poor."
20061-430-1 = "If one person were to disappear,\nno one would even notice."
20061-440-1 = "Your planning is sloppy, Sensei."
20061-450-1 = "You know the first step,\nbut not the second."
20061-460-1 = "The more you try to\nhelp me, Sensei..."
20061-470-1 = "The more useful a pawn\nyou become to me."
20061-480-1 = "And—\nthe more you are like that,"
20061-490-1 = "the more one desires to\npossess you. That is human nature."
20061-500-1 = "You said you wanted to know\nmy true nature, didn't you...?\nWhat are your thoughts?"
20061-510-1 = "Even if you say you want to turn back—\nit's already too late."
20061-520-1 = "...Surprise!"
20061-530-1 = "That was convincing, wasn't it?\nDon't look so scared.\nI'm just joking."
20061-2600-1 = "So, I can assume you're staying with me, fully aware of the risks?\nIn that case, how wonderful—I'll have you accompany me on this one-way ticket to hell until the very end.\nHa-ha-ha-ha-ha!"
