[translation]
20061-10 = "Indeed! Blue Archive!"
20061-20 = "Can you hear it... the sound of gunpowder exploding.\nThere's no stopping a lit bomb—\nNow that is what I call romance."
20061-30 = "Aesthetic beauty is something\nthat must be cherished."
20061-40 = "Magnificent!\nTo think there's this many\nbooks..."
20061-50 = "I felt a gaze on me\njust now... \nOr was it just my imagination?"
20061-60 = "Using this for hot spring decor...\nThat might be difficult."
20061-70 = "Hmm,\nthis design...\nQuite the reference."
20061-80 = "Oh, Sensei.\nI've gone ahead and made myself at home."
20061-90 = "I'm being chased, you see..."
20061-100 = "Would you mind hiding me\nfor a little while?"
20061-110 = "To think I'd be on duty at a time like this...\nOh my."
20061-120 = "Well, I suppose it matters not.\nAs long as I'm here, I doubt\nanyone will come chasing me.\nHa ha ha ha!"
20061-130 = "Schale duty is the best!"
20061-140 = "After all, there are no\npursuers around!"
20061-150 = "Well, however...\nI do worry about the journey here."
20061-160 = "Schale has\na great location...\nHowever..."
20061-170 = "It's just a shame there's no hot spring..."
20061-180 = "Oh, don't look at me\nlike that."
20061-190 = "A core burning away, piece by piece..."
20061-200 = "Watching that\nstirs my blood."
20061-210 = "...I'm talking about fireworks, of course.\nHa ha ha ha ha!"
20061-220 = "Hm?\nJust because I'm wearing a swimsuit\ndoesn't mean I'm going to swim."
20061-230 = "...Swimming in a bathtub\nis a breach of manners, after all.\nIt's a shame I can't show off my skills."
20061-240 = "Reading?\nAh, just a way to pass the time."
20061-250 = "Well, I suppose you could call it a hobby."
20061-260 = "They say time is money, right?\nTime is finite, after all.\nIt's a waste to just play around."
20061-270 = "Indeed! Truly a joyous day!\nNo need to hold back, Sensei."
20061-280 = "Shall we begin\nthe party?"
20061-290 = "Ah, today\nis my birthday, after all!\nI came to be celebrated!"
20061-300 = "My, my~ even though it's my birthday,\nit's been so restless!"
20061-310 = "Happy New Year,\nSensei!"
20061-320 = "What's with the sudden look?\nSeasonal greetings are important, aren't they?"
20061-330 = "Especially in our line of work."
20061-340 = "The Christmas season\nis cold, after all!\nYou need something to warm you up!"
20061-350 = "Which means it's time for us,\nthe Hot Spring Development Department, to shine!"
20061-360 = "Don't make that face, Sensei."
20061-370 = "Is there any other club in Kivotos\nthat contributes as much as we do?"
20061-380 = "Mm-hm-hm-hm~"
20061-390 = "Today is a delightful day, Sensei!\nIndeed!"
20061-400 = "Ah... \nThough we're going to make it one."
20061-420 = "You know this, right?\nThe security around here\nis terrible."
20061-430 = "If a single person were to vanish,\nno one would even notice."
20061-440 = "Your planning is sloppy, Sensei."
20061-450 = "Knowing one, but\nnot the two."
20061-460 = "The more Sensei tries\nto help me..."
20061-470 = "The better of a pawn\nyou become to me."
20061-480 = "And――\nthe more something is like that,"
20061-490 = "the more human nature compels you to want to obtain it."
20061-500 = "You said you wanted to know\nmy true nature...?\nWhat are your thoughts?"
20061-510 = "Even if you say you want to turn back――\nIt's already too late."
20061-520 = "...Surprise!"
20061-530 = "Was that convincing?\nDon't make such a scared face.\nIt was a joke."
20061-2600 = "I can take it that you are staying with me, fully aware of the risks, correct? If so, that is wonderful—shall we go all the way together on a one-way ticket to hell? Ha ha ha ha ha!"
