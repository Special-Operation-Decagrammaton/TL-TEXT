[translation]
10149-10 = "Blue Archive!"
10149-20 = "I'm Toumi Kokoro,\ncaptain of the Odyssey Marine High School diving club...\nIf you ever drop something in the ocean, just let me know."
10149-30 = "Such a nice day for diving.\nI feel like I can dive deeper than usual today."
10149-40 = "Schale has...\na place like this..."
10149-50 = "Could that person be...\nNo, I must be seeing things."
10149-60 = "Amazing...\nWhere on earth did such a pretty fragment come from?"
10149-70 = "Ugh, it's so cold...\nI want to drink some warm miso soup..."
10149-80 = "Welcome back, Sensei.\n...I've been waiting for you."
10149-90 = "Ah... did you call for me?"
10149-100 = "Um, Sensei...\nOnce you're done with work, would you like to take a walk along the nearby beach?"
10149-110 = "Eh... the sun will have set by then...?"
10149-120 = "It's fine...!\nThe beach at night is, well... pretty, too."
10149-130 = "When it comes to diving,\nthe health check before entering the water is the most important thing."
10149-140 = "Sensei, are you managing your health properly...?"
10149-150 = "I want a dive computer...\nBut my budget... ugh."
10149-160 = "When I go diving,\nKotone acts as my buddy."
10149-170 = "Kotone's eyesight isn't great, but her sense is outstanding...\nI'm a little bit envious."
10149-180 = "I wonder when I'll hear back from my upperclassman..."
10149-190 = "S-Sensei!\nUm, happy birthday...!"
10149-200 = "It's not really... much of a celebration, but..."
10149-210 = "I put lots of your favorite ingredients in today's miso soup."
10149-220 = "Please, go ahead and eat...!"
10149-230 = "I learned recently that...\ntoday is apparently the birthday of a legendary diver."
10149-240 = "Sharing a birthday with a legendary diver makes me feel a strange sense of destiny."
10149-250 = "...Maybe that's exaggerating."
10149-260 = "Happy New Year, Sensei."
10149-270 = "It's a little cold, but...\nWould you like to go on our first dive of the year together?"
10149-280 = "Eggs are precious out on the ocean,\nso I've always gone without cake."
10149-290 = "But today, I went ahead and ordered a whole cake.\nFinally, we can all eat cake together."
10149-300 = "Um... if you'd like, would you join us, Sensei?"
10149-310 = "Apparently, there's a mysterious jellyfish in the deep sea that glows white..."
10149-320 = "I was thinking of trying to go look for it next Halloween...\nWould you like to come with me, Sensei?"
10149-340 = "Haa... so warming..."
10149-350 = "That first drink after coming back up to the surface is... exceptional."
10149-360 = "Ah... was it to your liking, Sensei?"
10149-370 = "Was the flavor too strong,\nor too weak...?"
10149-380 = "I'm glad...\n...A secret ingredient, you ask?"
10149-390 = "Nothing special...\nI just made it following a recipe I found online."
10149-400 = "De-sanding the littleneck clams...\nSkimming off the scum..."
10149-410 = "Ah, but... I suppose..."
10149-420 = "Thinking of the person who would drink it, I might have made it a little more carefully than usual—"
10149-430 = "Ah... j-just kidding."
10149-440 = "Eh? You want to drink the miso soup I make every morning...?"
10149-450 = "S-Sensei... what does that mean..."
10149-460 = "Ah, no... i-it's not that I'm troubled by it..."
10149-470 = "...Yes.\nIf that's what you wish, Sensei...\nI don't mind at all."
10149-2600 = "Thank you, Sensei.\nWith this equipment, I should be able to work steadily even underwater.\n...Fufu, it's cute."
