[translation]
10149-10-1 = "Blue! Archive!"
10149-20-1 = "I'm Kokoro Tokai, the club president of the Odyssey Marine School's diving club... If you ever drop something in the ocean, please let me know."
10149-30-1 = "A perfect day for diving. I feel like I can dive deeper than usual today."
10149-40-1 = "Schale has... a place like this?"
10149-50-1 = "Could that person be... No, I must have seen wrong."
10149-60-1 = "Amazing... I wonder where such a beautiful fragment came from?"
10149-70-1 = "Ugh, it's cold... I'd love to have some warm miso soup..."
10149-80-1 = "Welcome back, Sensei. ...I've been waiting for you."
10149-90-1 = "Oh... did you call for me?"
10149-100-1 = "Um, Sensei... once you're done with work, would you like to take a walk on the nearby beach?"
10149-110-1 = "Oh... it'll be dark by then, won't it...?"
10149-120-1 = "It's okay...! The beach at night is... well, it's beautiful, too."
10149-130-1 = "When it comes to diving, a health check before entering the water is the most important thing."
10149-140-1 = "Sensei, are you taking proper care of your health...?"
10149-150-1 = "I really want a dive computer... but the budget... ugh."
10149-160-1 = "When I go diving, Kotone is my buddy."
10149-170-1 = "Kotone doesn't have the best eyesight, but she has a great sense for things... I'm a little jealous, honestly."
10149-180-1 = "I wonder when I'll hear back from my senior..."
10149-190-1 = "S-Sensei! Um, happy birthday...!"
10149-200-1 = "It's not much of a celebration, but..."
10149-210-1 = "I put plenty of your favorite ingredients in today's miso soup."
10149-220-1 = "Please, go ahead and eat...!"
10149-230-1 = "I recently learned that... today is the birthday of a legendary diver."
10149-240-1 = "Sharing a birthday with a legendary diver... I feel like it's fate."
10149-250-1 = "That might be an exaggeration, though."
10149-260-1 = "Happy New Year, Sensei."
10149-270-1 = "It's a bit cold, but... would you like to go for our first dive of the year together?"
10149-280-1 = "Eggs are precious on the sea, so I've spent a long time without cake."
10149-290-1 = "But today, I ordered a whole cake. Since we can finally all eat cake together."
10149-300-1 = "If... if you'd like, Sensei, would you like to join us?"
10149-310-1 = "They say there are mysterious, glowing white jellyfish in the deep sea..."
10149-320-1 = "I was thinking of going to look for them next Halloween... would you like to come with me, Sensei?"
10149-340-1 = "Ah... so warming..."
10149-350-1 = "A cup after coming up from the water is... exceptional."
10149-360-1 = "Oh... was it to your liking, Sensei?"
10149-370-1 = "Was the flavor too strong, or perhaps too weak...?"
10149-380-1 = "I'm glad... The secret ingredient, you ask?"
10149-390-1 = "There's nothing special... I just followed a recipe I saw online."
10149-400-1 = "I sand the clams... skim the scum..."
10149-410-1 = "Oh, but... I suppose."
10149-420-1 = "Thinking of the person who would be drinking it, I did make it a bit more carefully than usual—"
10149-430-1 = "Ah... j-just kidding."
10149-440-1 = "Eh? You want to drink the miso soup I make... every morning?"
10149-450-1 = "S-Sensei... that is..."
10149-460-1 = "Oh, no... I'm not... bothered by it or anything..."
10149-470-1 = "...Yes. If that is what you wish, Sensei... I don't mind at all."
10149-2600-1 = "Thank you, Sensei. With this equipment, I should be able to work steadily even underwater. ...Hehe, it's cute."
