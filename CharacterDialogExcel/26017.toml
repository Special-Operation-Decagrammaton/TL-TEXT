[translation]
26017-10-1 = "Blue Archive."
26017-20-1 = "I am Lana Furuhata from Special Class 183. \nHmm... have you tried restarting it?"
26017-30-1 = "Sensei, \ndid you find the avocados? \nIf you found them, \nwe must buy six cartons of milk."
26017-40-1 = "It's lively here. \nI hope I can get along \nwith everyone."
26017-50-1 = "I have been \nbehaving properly. \nThere is no need to worry."
26017-60-1 = "The world is vast. \nThere are so many different people, \nwhich makes it worth \nstudying."
26017-70-1 = "The atmosphere here is \nsomewhat different from Class 183. \nIt's quite interesting."
26017-80-1 = "Thank you for your continued support. \nI am Lana Furuhata."
26017-90-1 = "I wanted to see you today as well."
26017-100-1 = "Yes, this is Lana Furuhata."
26017-110-1 = "Please call me 'Lana' \nfor short."
26017-120-1 = "It's warm here. \nThat's one of the good things about Schale."
26017-130-1 = "Though the biggest advantage \nis that you are here, Sensei."
26017-140-1 = "The new password for the \nwireless LAN is... \n'Please pet me'."
26017-150-1 = "Oh... thank you \nfor petting me."
26017-160-1 = "The password is \n'Please pet me'."
26017-170-1 = "Did you know? \nIt is possible to input \n'drop table' into the \nSchale duty roster."
26017-180-1 = "I haven't executed it. \nIt would cause trouble \nfor you, Sensei."
26017-190-1 = "There are things in this world \nthat you can execute, \nbut shouldn't..."
26017-200-1 = "...What a \ndifficult problem that is."
26017-210-1 = "Yes... I am saved by the fact \nthat a wise and kind person \nlike you stops me."
26017-220-1 = "Happy birthday, \nSensei."
26017-230-1 = "You have updated your record \nfor continuous operation \nof a single piece of hardware."
26017-240-1 = "Today is my birthday. \nThank you for being \nmy present."
26017-250-1 = "Fortunately, the year problem \ndid not occur this year either."
26017-260-1 = "Happy New Year."
26017-270-1 = "Merry Christmas."
26017-280-1 = "I was working on the year problem. \nWould you like to see the progress, Sensei?"
26017-290-1 = "Sensei, this is sudden, \nbut do you happen to have \nany snacks or candy?"
26017-300-1 = "A passerby in strange clothing \njust said 'Trick or Treat' \nto me."
26017-310-1 = "Since I didn't have any candy, \nI played a trick on them, \nbut..."
26017-320-1 = "They didn't seem \nvery happy about it."
26017-340-1 = "...Thank you for your continued support, \nSensei."
26017-350-1 = "A familiar ceiling... I see."
26017-360-1 = "I'm glad I managed \nto see you."
26017-370-1 = "Hmm? Why am I inside \nthe delivery package...? \n'Because I fit'."
26017-380-1 = "After I bought the train ticket, \nI couldn't afford to buy \nany souvenirs..."
26017-390-1 = "And then, I saw a box at Schale \naddressed to you, Sensei."
26017-400-1 = "So, \nI decided to become the souvenir."
26017-410-1 = "It's no problem. \nI'm good at killing time—"
26017-420-1 = "The packing material was fluffy, \nand you were careful when opening it, \nso I'm perfectly fine."
26017-430-1 = "Hehe..."
26017-440-1 = "I'm happy to be able to \nsee your face like this."
26017-450-1 = "I really, \nreally wanted to see you, Sensei."
26017-460-1 = "Umm..."
26017-470-1 = "Yawn..."
26017-480-1 = "Well then, good night."
26017-490-1 = "Zzz..."
26017-2600-1 = "Hmm, it's nice that I can make \nplenty of punch cards. \nThis should make the judging process \ngo much smoother."
