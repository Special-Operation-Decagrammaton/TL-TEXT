[translation]
26017-10 = "Blue Archive."
26017-20 = "District 183 Special Class, Furuhata Rana. \nHmm... Have you tried restarting it?"
26017-30 = "Sensei,\nDid you get any avocados?\nIf you got avocados,\nWe need to buy 6 cartons of milk,\nYou see."
26017-40 = "It's lively.\nI hope everyone gets along well."
26017-50 = "I've been well-behaved.\nThere's no need to worry."
26017-60 = "The world is vast.\nThere are all sorts of people, \nmaking it well worth observing."
26017-70 = "The atmosphere is somewhat different from District 183.\nIt's quite interesting."
26017-80 = "Thank you for your continued support.\nI am Furuhata Rana."
26017-90 = "I wanted to see you today, too."
26017-100 = "Yes, this is Furuhata Rana."
26017-110 = "Please call me \"Rana\"\nfor short."
26017-120 = "It's warm.\nThat's a nice thing about Schale."
26017-130 = "The greatest advantage, however, is that you are here, Sensei."
26017-140 = "The new Wi-Fi password...\nIs \"please pat me\"."
26017-150 = "Ah... Thank you for petting me."
26017-160 = "The password is\n\"please pat me\"."
26017-170 = "Did you know?\nOn Schale's duty roster,\nit's possible to input a drop table."
26017-180 = "I haven't executed it.\nBecause that would cause trouble for you, Sensei."
26017-190 = "There are things in this world that can be executed,\nbut must not be..."
26017-200 = "...What a difficult dilemma."
26017-210 = "Yes... I am saved by having a smart and kind\nSensei stop me."
26017-220 = "Happy birthday,\nSensei."
26017-230 = "You've broken the record for continuous single-hardware operation, haven't you?"
26017-240 = "Today is my birthday.\nThank you for becoming my present."
26017-250 = "Fortunately, no year-problem occurred this year either."
26017-260 = "Happy New Year."
26017-270 = "Merry Christmas."
26017-280 = "I was dealing with the year-problem.\nWould you like to see the progress, Sensei?"
26017-290 = "Sensei, quite suddenly,\nDo you happen to have any snacks or candy?"
26017-300 = "Earlier, a passerby in unusual attire\nsaid to me, \"Trick or treat.\""
26017-310 = "I didn't have any candy on me,\nso I played a trick on them instead, but..."
26017-320 = "They didn't seem very happy about it."
26017-340 = "...Thank you for your continued support,\nSensei."
26017-350 = "A familiar ceiling... I see."
26017-360 = "I'm glad I managed to see you."
26017-370 = "Hm? The reason I'm in the delivery package...?\n\"Because I fit in it.\""
26017-380 = "Once I bought my train ticket,\nI couldn't afford to buy any souvenirs..."
26017-390 = "And then, wouldn't you know it, there was a cardboard box addressed to Sensei right here in Schale."
26017-400 = "So, I decided to become the souvenir myself."
26017-410 = "There's no problem.\nI'm good at killing time—"
26017-420 = "The packing material was nice and fluffy, and you were careful when opening it, Sensei, so I'm safe."
26017-430 = "Fufu..."
26017-440 = "I'm so glad to see your face like this."
26017-450 = "I really, really wanted to see you, Sensei."
26017-460 = "Uun..."
26017-470 = "Phew..."
26017-480 = "Well then, good night."
26017-490 = "Zzz..."
26017-2600 = "Hmm, it looks like I could make plenty of punch cards. This should help speed up the judging process."
