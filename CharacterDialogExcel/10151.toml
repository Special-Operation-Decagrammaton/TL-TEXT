[translation]
10151-10 = "Blue Archive!"
10151-20 = "I'm Niki Anna, class rep of Special Class 183.\nSorry, but autographs will have to wait."
10151-30 = "(Time to get\nthe marker ready.)"
10151-40 = "This chair is\nwonderful.\nYou can sit on it, and since it's light,\nit's easy to swing around..."
10151-50 = "Such a lovely design...\nI am deeply impressed."
10151-60 = "Ah... So you've\nfigured it out.\nYes, that's right.\nI am Niki Anna."
10151-70 = "(I can feel the psychic waves\nof wrestling talent emanating\nfrom this room...)"
10151-80 = "Hello, Sensei.\nHow can I help you\ntoday?"
10151-90 = "Fine weather..."
10151-100 = "A day befitting the award of a medal.\nDon't you think?"
10151-110 = "Ah, this here is\nmy personal favorite medal."
10151-120 = "Would you like to touch it?\nIt's gold-plated, so\nit feels very solid."
10151-130 = "Schale is warm.\nMuch warmer than\nSpecial Class 183..."
10151-140 = "Almost a bit too warm.\nI like it."
10151-150 = "So much paperwork...\nI never expected Sensei to be\na manager like me...!"
10151-160 = "Is Schale also run on\na collective responsibility system?\nWe certainly have it tough..."
10151-170 = "There is only one rule\nin engineering."
10151-180 = "What should move, moves.\nEverything else stays still.\nThat is all."
10151-190 = "I feel like there are way\ntoo few tools in here..."
10151-200 = "At this rate, we can't\nbuild anything more than a helicopter."
10151-210 = "Would it be alright if I\nmade some spare parts?"
10151-220 = "Sensei, happy\nbirthday."
10151-230 = "Yes... Truly, a historic\nmoment indeed."
10151-240 = "This is a very\ntrivial matter, but..."
10151-250 = "Do you happen to know\nwhat date it is today?"
10151-260 = "Ah, no... \nJust curious."
10151-270 = "Happy New Year,\nSensei."
10151-280 = "May this year be\nanother wonderful one filled with inspiration."
10151-290 = "Will Comrade Santa\ncome visit us again this year?"
10151-300 = "I've made all sorts of preparations\nso they can easily fit down the chimney..."
10151-310 = "I've heard that Halloween is a day\nwhere you get treats if you get scared..."
10151-320 = "Well... Just now, I heard the sound\nof a bit snapping on the running CNC machine..."
10151-330 = "It scared me so much...\nDoes that mean I get a treat?"
10151-350 = "I really went ahead and\ndisplayed it..."
10151-360 = "...I never thought I had\nthat kind of courage."
10151-370 = "Sensei, you..."
10151-380 = "...Hehe,\nthat's a first-time\ncommendation speech for me."
10151-390 = "Thank you so much.\nI am truly honored\nto receive such an award."
10151-400 = "...I had expected\nmore bragging or tales\nof hardship."
10151-410 = "Right now, I'm just\nso overwhelmed...\nI don't even know what to say."
10151-420 = "Thank you,\nSensei."
10151-430 = "I truly never thought\na day like this would come..."
10151-440 = "It feels as though...\nall my dreams have come\ntrue at once."
10151-450 = "From now on, forever..."
10151-460 = "Yes! Forever..."
10151-470 = "Hehe...!"
10151-2600 = "Thank you, Sensei. This gift you gave me has just as many uses as a power tool... It's a huge help."
