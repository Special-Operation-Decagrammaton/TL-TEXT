[translation]
10151-10-1 = "Blue Archive!"
10151-20-1 = "I'm Anna Niki, class representative of the 183rd Special Class.\nSorry, but I'll have to sign autographs another time."
10151-30-1 = "(Marker pen ready,\ngood.)"
10151-40-1 = "This chair,\nit's wonderful.\nYou can sit on it, and it's light enough\nto swing around easily..."
10151-50-1 = "A lovely design...\nI'm impressed."
10151-60-1 = "Ah... so you've\nfigured it out.\nYes, that's right.\nI am Anna Niki."
10151-70-1 = "(I can feel the aura of\nwrestling talent\ncoming from this room...)"
10151-80-1 = "Hello, Sensei.\nWhat shall I help you with\ntoday?"
10151-90-1 = "Nice weather..."
10151-100-1 = "It's a day worthy of awarding a medal.\nDon't you think so?"
10151-110-1 = "Ah, this is\nmy favorite medal."
10151-120-1 = "Would you like to touch it?\nIt's gold-plated,\nso it's very sturdy."
10151-130-1 = "Schale is warm, isn't it?\nMuch warmer than the\n183rd Special Class..."
10151-140-1 = "A little too warm, even.\nI like it."
10151-150-1 = "So much paperwork...\nTo think that you, Sensei,\nare in management just like me...!"
10151-160-1 = "Is Schale also\nrun on collective responsibility?\nWe both have it tough, don't we..."
10151-170-1 = "There is only one thing\nthat must be protected by engineering."
10151-180-1 = "Things that should move, move,\nand everything else remains still.\nThat is all."
10151-190-1 = "I feel like there are\ntoo few tools here..."
10151-200-1 = "With this, we could\nonly build a helicopter."
10151-210-1 = "May I make some\nspare parts?"
10151-220-1 = "Happy birthday,\nSensei."
10151-230-1 = "Yes... it can truly be called\na historic moment."
10151-240-1 = "It's a very trivial\nthing, but..."
10151-250-1 = "Do you know\nwhat day it is today?"
10151-260-1 = "Oh, no...\nJust curious."
10151-270-1 = "Happy New Year,\nSensei."
10151-280-1 = "May this year be another\nwonderful one filled with\nflashes of inspiration."
10151-290-1 = "Will Comrade Santa\nbe coming again this year?"
10151-300-1 = "I've prepared various things\nso that the chimney is easy\nto pass through, but..."
10151-310-1 = "I thought Halloween was a day\nwhere you get candy if you\nget surprised..."
10151-320-1 = "Yes... earlier, I heard the sound of a bit\nbreaking on the CNC machine\nwhile it was running..."
10151-330-1 = "I was so surprised...\nCould I get some candy?"
10151-350-1 = "I really, actually,\ndisplayed it..."
10151-360-1 = "...I didn't think I had\nthe courage to do that."
10151-370-1 = "Sensei, you..."
10151-380-1 = "...Heh,\nI've never heard an award\ncomment like that before."
10151-390-1 = "Thank you.\nI am truly honored\nto receive such an award."
10151-400-1 = "...I thought you would\ntalk more about your\nboasts or hardships."
10151-410-1 = "Right now, I'm just\nso overwhelmed...\nI don't know what to say."
10151-420-1 = "Thank you,\nSensei."
10151-430-1 = "I never really thought\na day like this would come..."
10151-440-1 = "It feels as if all my dreams\nhave come true at once..."
10151-450-1 = "From now on, forever..."
10151-460-1 = "Yes! Forever..."
10151-470-1 = "Heh...!"
10151-2600-1 = "Thank you, Sensei.\nThis gift has as many uses as\na power tool...\nIt's truly helpful."
