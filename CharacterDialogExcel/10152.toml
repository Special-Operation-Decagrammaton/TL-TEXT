[translation]
10152-10-1 = "Blue Archive, and Peace."
10152-20-1 = "I am Shiina Tsumugi from the Occult Research Club at Wildhunt Art Academy. Yes, I do have a guitar—after all, 'Love and Peace' is... quite important."
10152-30-1 = "Hehe, I'd love to hold a live performance here."
10152-40-1 = "That decoration... it looks like it could be used as a percussion instrument."
10152-50-1 = "I could probably build a 'gingerbread house' around here."
10152-60-1 = "If I were to play some background music... death metal would be perfect."
10152-70-1 = "This is a place where everyone's memories reside... perhaps that is true for me as well."
10152-80-1 = "Hello, Sensei. Please join me in my art again today."
10152-90-1 = "Hehe, it feels like it's going to be an exciting day."
10152-100-1 = "...Don't you think so too, Sensei?"
10152-110-1 = "Music is the universal language of the soul... or so they say."
10152-120-1 = "Because even without exchanging words, we can touch each other's hearts."
10152-130-1 = "Now then, would you like to hear a song?"
10152-140-1 = "The Little Mermaid gave up her own voice for the sake of the one she loved."
10152-150-1 = "Yes, it is a truly noble—and beautiful decision."
10152-160-1 = "Hehe... I wonder if someone will ever appear for whom I could feel that deeply?"
10152-170-1 = "Surprisingly, many original fairy tales are quite cruel stories."
10152-180-1 = "Perhaps that is because they weren't originally spun for children back then."
10152-190-1 = "That is the nature of art... it changes its form depending on the currents of the era."
10152-200-1 = "What does death metal mean to you, Sensei?"
10152-210-1 = "For me, it is—"
10152-220-1 = "—'Life,' I suppose."
10152-230-1 = "Ever since I encountered death metal, my story has become much more colorful."
10152-240-1 = "In a good way, of course! Hehe."
10152-250-1 = "What got me started with death metal... you ask?"
10152-260-1 = "Hehe, that's a secret."
10152-270-1 = "Everyone has one or two of those, don't they?"
10152-280-1 = "—A mystery hidden within their own 'sanctuary'."
10152-290-1 = "Happy birthday, Sensei."
10152-300-1 = "A birthday song for you, Sensei."
10152-310-1 = "—Yes, it shouldn't be anything ordinary."
10152-320-1 = "I've arranged it myself... would you like to hear it?"
10152-330-1 = "I often sing for my friends on their birthdays..."
10152-340-1 = "How do you usually celebrate, Sensei?"
10152-350-1 = "If you don't mind... would you sing for me?"
10152-360-1 = "It's like a day that's a completely blank musical score, isn't it?"
10152-370-1 = "Happy New Year, Sensei."
10152-380-1 = "Let's carve new notes into this score together."
10152-390-1 = "The movement of this year is drawing to a close, isn't it?"
10152-400-1 = "What kind of melody was your year, Sensei?"
10152-410-1 = "If it was a bright one... then I am happy too."
10152-420-1 = "I don't think there's a day more fitting for death metal than today."
10152-430-1 = "Shall we begin? A requiem dedicated to the souls that have returned."
10152-450-1 = "Darkness exists in everyone's heart."
10152-460-1 = "We all carry our own worries, lost—as we walk our paths."
10152-470-1 = "—I am the same."
10152-480-1 = "There are times when I worry if I am on the right path."
10152-490-1 = "But you told me, didn't you, Sensei?"
10152-500-1 = "That you would support me so that I could live my days freely—without regrets."
10152-510-1 = "That is why, Sensei..."
10152-520-1 = "—You were 'the light that illuminates my darkness'."
10152-530-1 = "To you, my light, I dedicate this song."
10152-540-1 = "Please listen... to this melody filled with my gratitude."
10152-2600-1 = "Thank you, Sensei. With this, I can hold a concert anywhere. A melody from purgatory—that leads to peace."
