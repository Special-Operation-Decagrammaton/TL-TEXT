[translation]
10152-10 = "Blue Archive, and Peace."
10152-20 = "I'm Shiina Tsumugi from the Wildhunt School of Arts' Occult Research Club. Yes, I do have a guitar—'Love and Peace.' ...It's very important, after all."
10152-30 = "Hehe, I'd love to hold a live performance here."
10152-40 = "That decoration... it looks like it could be used as a percussion instrument."
10152-50 = "I think I could build a 'gingerbread house' around here."
10152-60 = "If I were to play some background music... death metal would be perfect."
10152-70 = "This place is where everyone's memories reside... Perhaps that's true for me as well."
10152-80 = "Hello, Sensei. Please join me in my art again today."
10152-90 = "Hehe, it feels like it's going to be an exciting day."
10152-100 = "...Don't you think so too, Sensei?"
10152-110 = "Music is the universal language of the soul... or so they say."
10152-120 = "Because even without exchanging words, we can touch each other's hearts."
10152-130 = "So, would you like to hear a song?"
10152-140 = "The Little Mermaid gave up her own voice for the sake of the one she loved."
10152-150 = "Yes, it is a very noble—and beautiful decision."
10152-160 = "Hehe... I wonder if someone will appear for me one day, someone I could feel that strongly about?"
10152-170 = "Surprisingly, many original fairy tales are quite cruel stories."
10152-180 = "Perhaps that's because they weren't originally spun for children back then."
10152-190 = "That is the nature of art... it changes its form however it likes, depending on the tides of the era."
10152-200 = "What does death metal mean to you, Sensei?"
10152-210 = "For me, it is—"
10152-220 = "—'Life,' I suppose."
10152-230 = "Ever since I encountered death metal, my story has become much more colorful."
10152-240 = "In a good way, of course! Hehe."
10152-250 = "What got me started with death metal... you ask?"
10152-260 = "Hehe, that's a secret."
10152-270 = "Everyone has one or two, don't they?"
10152-280 = "—A mystery hidden away in their 'sanctuary'."
10152-290 = "Happy birthday, Sensei."
10152-300 = "A birthday song for Sensei."
10152-310 = "—Yes, it shouldn't be anything ordinary."
10152-320 = "I've arranged it myself... would you like to hear it?"
10152-330 = "I often sing songs for my friends' birthdays, but..."
10152-340 = "How do you usually celebrate, Sensei?"
10152-350 = "If you don't mind... would you sing for me?"
10152-360 = "It's a day like a score with nothing written on it yet, isn't it?"
10152-370 = "Happy New Year, Sensei."
10152-380 = "Let's carve some new notes into this score together."
10152-390 = "The movement of this year is nearing its end, isn't it?"
10152-400 = "What kind of melody was your year, Sensei?"
10152-410 = "If it was a bright one... then I am happy too."
10152-420 = "I don't think there's a day more fitting for death metal than today."
10152-430 = "Shall we begin? A requiem, dedicated to the souls that have returned."
10152-450 = "Darkness exists in everyone's heart."
10152-460 = "Everyone carries their own worries, lost—walking their own path."
10152-470 = "—I am the same."
10152-480 = "There are times when I worry if I'm on the right path."
10152-490 = "But you told me, Sensei."
10152-500 = "That you would support me so that I could live my days freely—without regrets."
10152-510 = "That is why, Sensei, you are..."
10152-520 = "—'The light that illuminates my darkness'."
10152-530 = "To you, my light, I dedicate this song."
10152-540 = "Please listen... to this melody filled with my gratitude."
10152-2600 = "Thank you, Sensei. With this, I can hold a concert anywhere. A melody of purgatory—leading toward peace."
