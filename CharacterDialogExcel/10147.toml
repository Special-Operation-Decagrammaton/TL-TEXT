[translation]
10147-10 = "Blue Archive"
10147-20 = "Oh, did you call for me, Sensei? Shall we promise to cooperate for the next few millennia?"
10147-30 = "I wonder... do we not need sunscreen here?"
10147-40 = "Round and round... round and round... I wonder if that's enough practice for now."
10147-50 = "The population density is rising... The danger level is going up, isn't it?"
10147-60 = "I wonder where Sensei is. I want us to watch each other's backs."
10147-70 = "That... gives off a rather dangerous vibe."
10147-80 = "I've been waiting for you, Sensei."
10147-90 = "I've taken every possible safety precaution here. You can rest easy."
10147-100 = "Hehe, I've been waiting forever, you know?"
10147-110 = "Today's work is all gathered right there."
10147-120 = "Oh, is something the matter? Did you lose your focus?"
10147-130 = "Hehe, I suppose I have no choice."
10147-140 = "I'll hypnotize you to help you focus."
10147-150 = "Eek! Something hit my leg... A-an unknown threat!?"
10147-160 = "Oh, it was just Sensei's leg. You startled me..."
10147-170 = "Haa... I can't let my guard down, can I?"
10147-180 = "50 minutes of work, 10 minutes of rest."
10147-190 = "This is the most efficient way to get things done."
10147-200 = "Take care of your health, Sensei. Your well-being is more important than anything else."
10147-210 = "I feel strangely calm when I'm with you, Sensei."
10147-220 = "Perhaps it's because I don't have to worry about what you're up to."
10147-230 = "Are you finished with your work?"
10147-240 = "Then, sit down in front of me."
10147-250 = "Yes, that's right..."
10147-260 = "For the rest of the time, I want you to look only at me."
10147-270 = "Hehe, today is your birthday, isn't it, Sensei?"
10147-280 = "Of course, I'm well aware of that."
10147-290 = "Come now, tell me what you want. Anything at all, really."
10147-300 = "Today is a special day—you know that, don't you?"
10147-310 = "Hehe, as for a gift..."
10147-320 = "I don't need one. Because, Sensei..."
10147-330 = "You are right here in front of me."
10147-340 = "Happy New Year, Sensei."
10147-350 = "Let's keep increasing our survival rate by staying by each other's side this year too, shall we?"
10147-360 = "Christmas... everyone gets so carried away, don't they?"
10147-370 = "Me?"
10147-380 = "...I suppose. I'm feeling a little carried away myself."
10147-390 = "After all, I'm here with you."
10147-400 = "Trick or treat!"
10147-410 = "Hypnosis or a prank—which would you prefer, Sensei?"
10147-420 = "Come on... make your choice."
10147-440 = "Looking back, it was always like this."
10147-450 = "Sensei walked right beside me."
10147-460 = "No matter how selfish I was—"
10147-470 = "Even when I tried to interrogate you or put you under hypnosis."
10147-480 = "You went along with everything without a single complaint."
10147-490 = "...Thank you for saying you would protect me."
10147-500 = "Thank you for holding my hand when I was scared."
10147-510 = "Thank you for always coming to my rescue."
10147-520 = "So—"
10147-530 = "I'm counting on you... from here on out, Sensei."
10147-2600 = "Oh, did you prepare this for me? Thank you, Sensei. But there's no reward for you... How about the right to do whatever you want with me?"