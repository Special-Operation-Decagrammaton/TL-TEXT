[translation]
10153-10-1 = "Blue Archive!"
10153-20-1 = "Huh? This outfit? It's the standard-issue uniform. Ehehe... I'm counting on you!"
10153-30-1 = "Phew... It's very comfortable here. I really need to fix Crusader-chan's air conditioner soon..."
10153-40-1 = "Everyone is so unique... I'm a little envious."
10153-50-1 = "Wow, that's so cute!"
10153-60-1 = "(That's a... bold look...)"
10153-70-1 = "(I guess I really am just... ordinary...)"
10153-80-1 = "Let's do our best today, Sensei! I'll be right by your side to help!"
10153-90-1 = "Welcome back, Sensei! Everything is ready!"
10153-100-1 = "It's a perfect day for a drive, Sensei!"
10153-110-1 = "Hm? The weather doesn't matter."
10153-120-1 = "It's always a perfect day for a drive!"
10153-130-1 = "Did I... close the tank hatch?"
10153-140-1 = "Auu! I'll go check real quick!"
10153-150-1 = "Yes? You think this outfit suits me?"
10153-160-1 = "E-ehehe... Geez, why so sudden..."
10153-170-1 = "Sensei, aren't you tired? Would you like... a lap pillow?"
10153-180-1 = "Do you have any plans to go out? I can take you in the tank!"
10153-190-1 = "Happy Birthday, Sensei!"
10153-200-1 = "Spending this 'special' day together... Ehehe, I'm so happy!"
10153-210-1 = "Thank you for celebrating my birthday!"
10153-220-1 = "Is there anything I want? Hmm..."
10153-230-1 = "Nothing comes to mind... I already have everything I want. My friends, and you, Sensei!"
10153-240-1 = "Happy New Year, Sensei!"
10153-250-1 = "Huh? Am I not cold?"
10153-260-1 = "Yes, I'm fine. Crusader-chan's heater is very warm!"
10153-270-1 = "It's Christmas today! A busy day for Santa Claus!"
10153-280-1 = "I wonder how much horsepower Santa's reindeer have? Are they faster than horses...?"
10153-290-1 = "Halloween is the day when scary things appear."
10153-300-1 = "The receipt from when I refueled Crusader-chan today... it was truly terrifying..."
10153-320-1 = "Ahhh... the tank is so cool and refreshing..."
10153-330-1 = "It really is cooler in the shade..."
10153-340-1 = "What do you think about using the tank as a secret base, Sensei?"
10153-350-1 = "...It's very quiet, isn't it?"
10153-360-1 = "When the engine is off, the armor absorbs all the surrounding noise."
10153-370-1 = "It's so quiet that I can even hear my own breathing and heartbeat..."
10153-380-1 = "I love this space."
10153-390-1 = "It feels like it's just the two of us in the whole world—"
10153-400-1 = "Ah, ahaha! It might not be very interesting to be with an ordinary student like me, though..."
10153-410-1 = "Eh? Ah, w-wait, um...!"
10153-420-1 = "Ahaha... I'm always the one getting energy from you, Sensei."
10153-430-1 = "O-oh? It's suddenly gotten quite hot in here! I-I hope the paint dries quickly...!"
10153-440-1 = "(M-my heartbeat... what if Sensei can hear it?)"
10153-450-1 = "(I should have played some music or turned on the engine...!)"
10153-460-1 = "(Auu... how embarrassing...)"
10153-2600-1 = "Thank you! This gun is very maneuverable, so it's easy to handle even inside the tank."
