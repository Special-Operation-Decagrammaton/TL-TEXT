[translation]
10153-10 = "Blue Archive!"
10153-20 = "Eh? This outfit? \nIt's a standard-issue uniform, you know? \nEhehe... Looking forward to working with you!"
10153-30 = "Phew... It's very pleasant here. I need to fix Crusader-chan's AC soon..."
10153-40 = "Everyone is so unique, \nI'm a little \njealous..."
10153-50 = "Wow, \nit's so cute!"
10153-60 = "(Th-That's a daring \noutfit...)"
10153-70 = "(As expected, I'm just \nthe ordinary type...)"
10153-80 = "Let's do our best today too, Sensei! \nI'll help you right by your side!"
10153-90 = "Welcome back, Sensei! \nPreparation is complete!"
10153-100 = "It's a great day for a drive, Sensei!"
10153-110 = "Hm? The weather doesn't matter."
10153-120 = "It's always a good day for a drive!"
10153-130 = "Did I close the tank hatch...?"
10153-140 = "Auu! \nLet me go check real quick!"
10153-150 = "Yes? Does this outfit look good on me?"
10153-160 = "E, Ehehe... \nGeez, what's this all of a sudden...?"
10153-170 = "Sensei, aren't you tired? \nWould you like a lap pillow...?"
10153-180 = "Do you have plans to go out? \nI'll give you a ride in the tank!"
10153-190 = "Happy birthday, \nSensei!"
10153-200 = "Being able to spend this \"special\" day \ntogether... \nEhehe, I'm so happy!"
10153-210 = "Thank you so much \nfor celebrating my birthday!"
10153-220 = "Something I want? \nUmm..."
10153-230 = "I can't really think of anything... \nBecause I already have \neverything I want. \nFriends, and Sensei too!"
10153-240 = "Happy \nNew Year, \nSensei!"
10153-250 = "Eh, am I cold?"
10153-260 = "Yes, I'm fine. \nCrusader-chan's heater is \nsuper warm!"
10153-270 = "Today is Christmas! \nIt's the day Santa \ngets really busy!"
10153-280 = "I wonder how many horsepower \nSanta's reindeer have? \nAre they faster than horses...?"
10153-290 = "Halloween is the day \nwhen sca-ary things appear."
10153-300 = "The receipt from when I refueled \nCrusader-chan today... \nwas truly terrifying..."
10153-320 = "Haah~ The tank is \ncool and feels great..."
10153-330 = "As expected, the shade is \nnice and cool..."
10153-340 = "How about a secret base \nusing a tank, Sensei?"
10153-350 = "...It's very quiet, isn't it?"
10153-360 = "When the engine is off, \nthe armor absorbs \nall the surrounding sounds."
10153-370 = "It's so quiet you can even hear \nyour breathing and heartbeat..."
10153-380 = "I just love this space."
10153-390 = "It feels like it's just the two of us \nin the entire world--"
10153-400 = "Ah, ahaha! Even if you spend time with an ordinary student \nlike me, it might not be very interesting, but..."
10153-410 = "Eh? Ah, y-yeah, \numm, well...!"
10153-420 = "Ahaha... I always end up \ngetting my energy from you, Sensei."
10153-430 = "Ah, oh? \nSomehow it's gotten hot! \nI-I hope the paint \ndries quickly...!"
10153-440 = "(W-What should I do \nif Sensei hears \nmy heartbeat?)"
10153-450 = "(I should have played some music \nor kept the \nengine running...!)"
10153-460 = "(Auu... How embarrassing...)"
10153-2600 = "Thank you! \nThis gun is easy to handle, \nso it's easy to use even inside a tank."
