[translation]
10150-10 = "Blue Archive~"
10150-20 = "Fuchigami Kotone, \nOdyssey Marine High School Diving Club Vice President.\nUm... Sensei from Schale, right?\nMy eyesight is bad, so I can't see very well."
10150-30 = "(Is there... something weird here?\n...Did my eyesight get worse again?)"
10150-40 = "Is this... trending on land...?"
10150-50 = "Nice weather...\nI need to dry my marine suit this afternoon."
10150-60 = "This author's...\nnew book is out."
10150-70 = "(A place where I can sit leisurely...\nIs there one somewhere?)"
10150-80 = "Welcome, Sensei.\nFufu, I knew it was you by your footsteps."
10150-90 = "Sensei, have you read\n'Koi yo Koi' sensei's new work?"
10150-100 = "The story was great, but...\nI was a bit bothered by the depiction of the ocean."
10150-110 = "Doesn't look like they're from Odyssey."
10150-120 = "Lately, there have been more poke salad specialty shops in D.U., but...\nThey don't put any fish in it."
10150-130 = "I guess that just makes it a regular salad...?"
10150-140 = "(Why are there so many wiretaps here...?\n)"
10150-150 = "Sensei, try not to make Kokoro angry."
10150-160 = "She's really scary when she's mad...\nSeriously."
10150-170 = "I feel more at ease in the sea than anywhere on land, but...\nI suppose the day will come when I return to land."
10150-180 = "Happy birthday, Sensei."
10150-190 = "They say in Odyssey\nthat finding a dolphin\nmeans something good will happen."
10150-200 = "So... today, for the whole day,\nI'll stay with you, Sensei."
10150-210 = "What do I want for my birthday?\nLet's see—"
10150-220 = "If I said I wanted you...\nWould that put you in a tough spot? Fufu."
10150-230 = "Happy New Year, Sensei."
10150-240 = "Hm? Am I cold?\nIt's a little chilly, but...\nI'm fine."
10150-250 = "After this, I'm going to the indoor pool with everyone."
10150-260 = "If you'd like, do you want to come too, Sensei?"
10150-270 = "The illuminations are so pretty.\nIt's like looking up at the sky\nfrom the night ocean."
10150-280 = "Trick or treat, Sensei."
10150-290 = "But I already took the candies from the desk, so..."
10150-300 = "Sensei doesn't have any sweets right now."
10150-310 = "Now then...\nWhat kind of mischief should I do?"
10150-320 = "Probably... Sensei, right?"
10150-330 = "Ah, Sensei. You came."
10150-340 = "Sorry. I was in the water, so I didn't notice..."
10150-350 = "Hm? Ah... this book?"
10150-360 = "It's waterproof, so it's fine."
10150-370 = "That's not what you mean...? \nSleeping on top of the water is dangerous?"
10150-380 = "Don't worry, I'm used to it.\nBesides... it feels amazing here."
10150-390 = "I can listen to the sounds of underwater\nwhile sunbathing..."
10150-400 = "In a way, reading and diving\nmight be a little similar."
10150-410 = "Because both listen to the voices of sinking things."
10150-420 = "Here, why don't you try it with me, Sensei?"
10150-430 = "I'll tell you... lots of stories about the world at the bottom of the water."
10150-440 = "They say in Odyssey\nthat finding a dolphin\nmeans something good will happen."
10150-450 = "So... today, for the whole day,\nI'll stay with you, Sensei."
10150-460 = "What do I want for my birthday?\nLet's see—"
10150-470 = "If I said I wanted you...\nWould that put you in a tough spot? Fufu."
10150-480 = "Happy New Year, Sensei."
10150-490 = "Hm? Am I cold?\nIt's a little chilly, but...\nI'm fine."
10150-500 = "After this, I'm going to the indoor pool with everyone."
10150-510 = "If you'd like, do you want to come too, Sensei?"
10150-520 = "The illuminations are so pretty.\nIt's like looking up at the sky\nfrom the night ocean."
10150-530 = "Trick or treat, Sensei."
10150-540 = "But I already took the candies from the desk, so..."
10150-550 = "Sensei doesn't have any sweets right now."
10150-560 = "Now then...\nWhat kind of mischief should I do?"
10150-2600 = "I'm not very good at darts, but... if I use this, I feel like I could hit a bullseye even underwater. Thank you, Sensei."
