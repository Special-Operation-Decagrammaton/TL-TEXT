10150-520-1 = "The illuminations are beautiful.\nIt's like looking up at the sky\nfrom the bottom of the sea at night."
10150-530-1 = "Trick or treat,\nSensei."
10150-540-1 = "But since I've already taken\nthe candy on your desk..."
10150-550-1 = "You don't have any\nsweets right now, Sensei."
10150-560-1 = "Now then...\nwhat kind of prank should I play?"
10150-580-1 = "Oh, Sensei. You came to see me."
10150-590-1 = "Sorry. I was in the water, so\nI didn't notice..."
10150-600-1 = "Hm? Oh... this book?"
10150-610-1 = "It's waterproof, so\nit's fine."
10150-620-1 = "That's not it...? Is it dangerous\nto sleep on the water?"
10150-630-1 = "Don't worry, I'm used to it.\nBesides... it feels\nreally good here."
10150-640-1 = "I can listen to the sounds\nunderwater while\nbasking in the sun..."
10150-650-1 = "In that sense, reading and diving\nmight be a bit similar."
10150-660-1 = "Because both involve listening\nto the voices of things that sink."
10150-670-1 = "Here, why don't you try it\ntoo, Sensei?"
10150-680-1 = "I'll tell you... lots of stories\nabout the world at the bottom of the sea."
10150-2600-1 = "I'm not very good at darts... but if I use this, I feel like I could hit a bullseye even underwater. Thank you, Sensei."
