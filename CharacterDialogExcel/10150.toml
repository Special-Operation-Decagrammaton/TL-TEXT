[translation]
10150-10-1 = "Blue Archive~"
10150-20-1 = "Odyssey Marine School Diving Club Vice President, Fuchigami Kotone.\nUm... Sensei from Schale, right?\nMy eyesight is bad, so I can't see very well."
10150-30-1 = "(There seems to be something\nstrange here...\n...Did my eyesight\nget worse again?)"
10150-40-1 = "Is this popular\non land...?"
10150-50-1 = "What nice weather...\nI need to dry my marine suit\nthis afternoon."
10150-60-1 = "Oh, this author's\nnew book... it's out."
10150-70-1 = "(I wonder if there's\nsomewhere I can\nsit down and relax...)"
10150-80-1 = "Welcome, Sensei.\nHehe, I knew it was you by your footsteps."
10150-90-1 = "Sensei, have you read the new work\nby Koi yo Koi?"
10150-100-1 = "The story was great, but...\nI was a little bothered by\nthe description of the sea."
10150-110-1 = "Doesn't look like they're\nfrom Odyssey."
10150-120-1 = "Lately, there are more and more\npoke salad specialty shops in D.U....\nbut they don't have any fish in them."
10150-130-1 = "I mean, isn't that\njust a salad...?"
10150-140-1 = "(There seem to be an awful lot\nof wiretaps here...)"
10150-150-1 = "Sensei, make sure not to\nmake Kokoro angry."
10150-160-1 = "She's really scary when she's mad...\nI'm serious."
10150-170-1 = "I feel more at home in the sea\nthan anywhere on land...\nbut I suppose the day will come\nwhen I have to return to land."
10150-180-1 = "Happy birthday, Sensei."
10150-190-1 = "At Odyssey, they say\nthat finding a dolphin\nbrings you good luck."
10150-200-1 = "So... I'll spend the whole day\ntoday with you, Sensei."
10150-210-1 = "What do I want for my birthday?\nLet's see—"
10150-220-1 = "If I said I wanted you, Sensei...\nwould that trouble you? Hehe."
10150-230-1 = "Happy New Year, Sensei."
10150-240-1 = "Hm? Am I not cold, you ask?\nIt's a little cold, but...\nI'm fine."
10150-250-1 = "I'm going to the heated pool\nwith everyone later."
10150-260-1 = "Would you like to come, Sensei?"
10150-270-1 = "The illuminations are beautiful.\nIt's like looking up at the sky\nfrom the bottom of the sea at night."
10150-280-1 = "Trick or treat,\nSensei."
10150-290-1 = "But since I've already taken\nthe candy on your desk..."
10150-300-1 = "You don't have any\nsweets right now, Sensei."
10150-310-1 = "Now then...\nwhat kind of prank should I play?"
10150-320-1 = "I assume... that's you, Sensei?"
10150-330-1 = "Sorry.\nI had my glasses off...\nI knew it was you by your footsteps, though."
10150-340-1 = "Sensei, have you read the new work\nby Koi yo Koi?"
10150-350-1 = "The story was great, but...\nI was a little bothered by\nthe description of the sea."
