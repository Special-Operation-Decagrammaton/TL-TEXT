[translation]
10148-10 = "Blue Archive."
10148-20 = "I can't believe we're doing this even while on vacation... Well, since it's come to this, let's both do our best."
10148-30 = "This is exactly why I hate standing out..."
10148-40 = "Somewhere with as few Gehenna students as possible..."
10148-50 = "I wish Senior Makoto and the others would learn from this."
10148-60 = "It's actually quite comfortable here."
10148-70 = "Did you set all of this up, Sensei?"
10148-80 = "Sensei."
10148-90 = "Aren't you pushing yourself a little too hard?"
10148-100 = "They say resting is part of the job, don't they?"
10148-110 = "Right?"
10148-120 = "Ah, welcome back."
10148-130 = "Preparing for work...? Wait... do we really have to do this?"
10148-140 = "I'm joking. I've already gathered everything, so let's finish it quickly and get some rest."
10148-150 = "Is this... all the work for today? Are you serious?"
10148-160 = "No, well..."
10148-170 = "It can't be helped. I'll help you."
10148-180 = "Travel plans? I don't have any..."
10148-190 = "Because going on long trips is such a hassle. And it costs money, too."
10148-200 = "Hmm?"
10148-210 = "No, it's nothing."
10148-220 = "Yes... that I noticed you were looking at me? That's not true at all."
10148-230 = "...My swimsuit. I wonder if it was worth choosing so carefully."
10148-240 = "Ah, the stickers on my suitcase?"
10148-250 = "No, I was planning on using it as is, but..."
10148-260 = "Ibuki wanted to put them on, so I let her do as she pleased."
10148-270 = "Thanks to that, I've actually grown quite fond of it."
10148-280 = "Ugh, what a pain..."
10148-290 = "Oh, no, I'm sorry."
10148-300 = "I wasn't talking to you, Sensei. It was a message from the Pandemonium Society..."
10148-310 = "Looks like more trouble."
10148-320 = "I really don't want to go home today..."
10148-330 = "Ah, Sensei. It's your birthday today, isn't it? Happy birthday."
10148-340 = "Eh, even if you look at me with such a lonely face..."
10148-350 = "Sigh... Are words not enough for you?"
10148-360 = "Then... I'll grant you one request. Anything."
10148-370 = "It's better to keep birthdays a secret."
10148-380 = "If I receive a gift, returning the favor is such a hassle."
10148-390 = "And I absolutely hate the fuss of being celebrated."
10148-400 = "But... you know about it, don't you, Sensei?"
10148-410 = "So... well, I'm looking forward to it."
10148-420 = "Ah, Happy New Year."
10148-430 = "The entire Pandemonium Society is getting carried away just because it's the New Year..."
10148-440 = "Well, thanks to that, I was able to sneak away."
10148-450 = "Please hide me until the heat dies down."
10148-460 = "Welcome back."
10148-470 = "...Are you perhaps hoping for a 'Merry Christmas!' or something?"
10148-480 = "I don't dislike the atmosphere, but..."
10148-490 = "It's just such a hassle to go through the trouble of preparing for it."
10148-500 = "On a day like this, don't you want to just relax in a comfortable place?"
10148-510 = "Come on, Sensei. Make your choice."
10148-520 = "Give me a treat, or get pranked."
10148-530 = "...There's also an option for 'both', you know?"
10148-550 = "Fufu. You're making a good face."
10148-560 = "Don't be angry. It's just a cute little prank, isn't it?"
10148-570 = "The sand is warm, isn't it?"
10148-580 = "It still holds the heat from the day..."
10148-590 = "...Today was fun."
10148-600 = "You too, Sensei? ...I see."
10148-610 = "In that case, why don't we... stop going home?"
10148-620 = "Just like this, heading somewhere far away... or something like that."
10148-2600 = "'Work harder,' or 'Make an effort.' Things like that are usually such a pain, aren't they? But if that's what you expect of me, Sensei... then it's not so bad."