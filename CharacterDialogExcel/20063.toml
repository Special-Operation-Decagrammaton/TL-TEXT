[translation]
20063-10 = "Blue Archive."
20063-20 = "Shirasu Azusa,\njoined the Make-Up Work Club team.\nLet me know if you find a target."
20063-30 = "There are so many\nstrange things here...\nIt feels fresh every time\nI come."
20063-40 = "It's fun here with\nso many different people gathering."
20063-50 = "It feels kind of like\nI'm being stared at\nconstantly..."
20063-60 = "I want to put\nthis parasol somewhere."
20063-70 = "Is there somewhere\nwe can rest...?"
20063-80 = "Welcome back, Sensei.\nI'm all set on my end."
20063-90 = "Are you staying hydrated?\nManaging your health is important.\nWait here a second."
20063-100 = "How is it? Does it look cool?\nApparently it's an athlete's uniform."
20063-110 = "The skirt is a bit short,\nbut it makes it easier to move around."
20063-120 = "I want to be of help to you, Sensei.\nIs there anything I can help with?"
20063-130 = "A parasol...\nThis is very good equipment."
20063-140 = "It can hide me from\noverhead infrared cameras."
20063-150 = "I like everyone in the Make-Up Work Club,\nand I like you, Sensei.\nThat's why I look forward to every day."
20063-160 = "When it's just the two of us,\nyou don't have to use mycodename."
20063-170 = "Happy birthday, Sensei.\nI'm glad you let me celebrate with you."
20063-180 = "It's not that I think\nit's such a special day."
20063-190 = "...Because happy days\naren't just limited to birthdays."
20063-200 = "Happy New Year.\nI hope we can stay like this...\nfor a long time to come."
20063-210 = "I got a present.\nI honestly didn't think\nI'd actually receive one..."
20063-220 = "I'm so happy."
20063-230 = "Sensei, Schale is in danger!\nA bunch of suspicious people\nin weird outfits have broken in!"
20063-240 = "I knocked everyone out for now.\nLet's hurry and escape while we can!\nFollow behind me!"
20063-260 = "Ah... Sensei.\nI'm sorry."
20063-270 = "The sunlight was stronger than expected...\nI let my guard down."
20063-280 = "Just a little...\nRest..."
20063-290 = "...Yeah, I'm fine.\nI'll recover in a moment."
20063-300 = "Lately, I must have gotten\nquite slack.\nI really feel my lack of training."
20063-310 = "I'll make sure not to disappoint you\nfrom now on, Sensei.\n...I'm truly sorry."
20063-320 = "...Ah."
20063-330 = "It's not something I need to apologize for...?\nI see."
20063-340 = "Back in the past...\nI would have been severely scolded for this,\nso it's just force of habit."
20063-350 = "...The wind\nis blowing."
20063-360 = "Back then, I used to check the wind direction,\nhow it would affect the trajectory...\nand worry about all sorts of things."
20063-370 = "But it's different now."
20063-380 = "It's just cool...\nand comfortable—"
20063-390 = "Being able to feel this\ntogether with you, Sensei...\nmakes me happy."
20063-2600 = "Thank you as always, Sensei.\nI want to be your strength.\nSomeday... I want you to let me shoulder your resolve as well."
