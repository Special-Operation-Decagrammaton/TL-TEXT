[translation]
20063-10-1 = "Blue Archive."
20063-20-1 = "Azusa Shirasu, joining the Supplementary Lessons Department team. Let me know if you find the target."
20063-30-1 = "There are so many mysterious things here... It feels fresh every time I come."
20063-40-1 = "It's fun here with so many different people gathered."
20063-50-1 = "I feel like... I'm being stared at."
20063-60-1 = "I want to put this parasol somewhere."
20063-70-1 = "Is there somewhere I can take a break...?"
20063-80-1 = "Welcome back, Sensei. I'm all prepared."
20063-90-1 = "Have you been staying hydrated? Managing your health is important. Wait just a moment."
20063-100-1 = "What do you think? Do I look cool? Apparently, it's an athlete's uniform."
20063-110-1 = "The skirt is a bit short, but it makes it easier to move around."
20063-120-1 = "I want to be of help to you, Sensei. Is there anything I can do for you?"
20063-130-1 = "A parasol... This is excellent equipment."
20063-140-1 = "It can hide me from infrared cameras in the sky."
20063-150-1 = "I love the members of the Supplementary Lessons Department, and I love you, Sensei. That's why I look forward to every day."
20063-160-1 = "When it's just the two of us, you don't have to use my codename."
20063-170-1 = "Happy birthday, Sensei. I'm happy you let me celebrate it with you."
20063-180-1 = "I don't really think of it as such a special day."
20063-190-1 = "...Because happy days aren't just limited to birthdays."
20063-200-1 = "Happy New Year. I hope we'll continue to be together... for a long, long time."
20063-210-1 = "I received a gift. I never thought I'd actually get one..."
20063-220-1 = "I'm so happy."
20063-230-1 = "Sensei, Schale is in danger! A bunch of suspicious people in strange outfits have broken in!"
20063-240-1 = "I've knocked them all out for now. Let's get out of here quickly! Follow me!"
20063-260-1 = "Ah... Sensei. I'm sorry."
20063-270-1 = "The sun was stronger than I anticipated... I let my guard down."
20063-280-1 = "Just... a short... break..."
20063-290-1 = "...Yeah, I'm fine. I'll recover soon."
20063-300-1 = "I must have been slacking off lately. I really feel my lack of training."
20063-310-1 = "I'll make sure not to disappoint you from now on. ...I'm truly sorry."
20063-320-1 = "...Oh."
20063-330-1 = "It's not something I need to apologize for...? I see."
20063-340-1 = "In the past... I would have been scolded severely for this. It's just a habit."
20063-350-1 = "...The wind is blowing."
20063-360-1 = "Back then, I used to check the wind direction, worry about its effect on the trajectory... and all sorts of things."
20063-370-1 = "But it's different now."
20063-380-1 = "It's just cool... and pleasant—"
20063-390-1 = "And being able to feel this with you, Sensei... makes me happy."
20063-2600-1 = "Thank you for everything, Sensei. I want to be your strength. Someday... I want you to let me share the burden of your resolve as well."
