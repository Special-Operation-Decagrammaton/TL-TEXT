20060-140 = "Everything feels so fun when I'm wearing a swimsuit!"
20060-150 = "So cool... Ehehe!"
20060-160 = "If I work hard, do you think I can be as cool as the upperclassmen?"
20060-170 = "I have a present for you today, Sensei!"
