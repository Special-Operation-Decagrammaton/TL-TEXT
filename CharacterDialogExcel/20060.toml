[translation]
20060-10 = "Blue Archive, here we go!"
20060-20 = "Ibuki is going to the beach with everyone too! Let's set sail, Sensei!"
20060-30 = "Once we're out of the water, we have to brush off the sand and dry ourselves off..."
20060-40 = "If I drink some coffee, do you think I'll be able to play for longer?"
