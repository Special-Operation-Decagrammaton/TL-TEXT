20060-80 = "Sensei! Hurry, hurry! Finish your work so we can go to the beach together!"
20060-90 = "Sensei! I'm all done getting ready for work!"
20060-100 = "I did it all by myself! Ehehe, am I a good girl?"
20060-110 = "Sensei, you should wear a swimsuit too! It's so cool and comfy! Ehehe!"
20060-120 = "Whoa! This chair is cold! That's strange... is it because I'm sitting on it in my swimsuit?"
