[translation]
16020-10 = "Blue Archive!"
16020-20 = "Hey! How have you been?\nI guess this is our first time properly introducing ourselves.\nI'm Otogi Tenjinyama, the sniper of FOX Platoon.\nI'll be counting on you, Sensei."
16020-30 = "(So sleepy... I wonder if there's any coffee...)"
16020-40 = "Alright! Maybe I'll do some muscle training while I'm at it."
16020-50 = "Oh... I'm feeling really pumped up now..."
16020-60 = "(Have I seen this at the Correction Bureau before...?)"
16020-70 = "Oh, is this new merchandise for \"Full Jelly\"? I should take a picture."
16020-80 = "Hey, welcome back, Sensei. So... what should I do today?"
16020-90 = "Shh, Sensei. Be quiet. There's a butterfly over there."
16020-100 = "I'm a sniper, after all. I'm trained to notice the little details."
16020-110 = "Like, for example—"
16020-120 = "Ah... Sensei.\nI hate to be the one to tell you this, but..."
16020-130 = "Your fly is wide open."
16020-140 = "Ugh, my shoulders are so stiff... Sensei, could you give them a rub?"
16020-150 = "It really hurts, you know~"
16020-160 = "Please!"
16020-170 = "Before I joined SRT, I was planning on just moving up to the academy in my district and maybe becoming a member of the Disciplinary Committee."
16020-180 = "It was a strange academy, though~"
16020-190 = "They had this weird local rule where you had to win a duel to become the club president."
16020-200 = "FOX3... Kurumi is the point man, but she worries way too much about everything."
16020-210 = "...Even though I've always got her back."
16020-220 = "Every once in a while, I find myself missing the bread rolls we had at the Correction Bureau."
16020-230 = "I wonder if I can order them from somewhere."
16020-240 = "Happy birthday, Sensei."
16020-250 = "We'll do our best to make sure this wonderful day remains peaceful and safe. Leave it to us."
16020-260 = "My birthday? You really didn't have to celebrate it for me..."
16020-270 = "Well... I'm happy, though. Thanks."
16020-280 = "Happy New Year, Sensei."
16020-290 = "I really hope the academy gets restored this year."
16020-300 = "I don't really have many good memories of Christmas..."
16020-310 = "Back in the day, I ate a cookie that was sitting on the table, but it had sleeping pills in it..."
16020-320 = "Man, I was so sleepy for the entire holiday break."
16020-330 = "I've had enough of that, thank you very much~"
16020-340 = "Halloween, huh... There seem to be more people wearing costumes lately."
16020-350 = "I wear all sorts of outfits for my infiltration missions, so..."
16020-360 = "Well, if you really want me to, I guess I could wear one for you."
16020-370 = "What do you like?"
16020-390 = "Ugh... bitter..."
16020-400 = "Why do old beans have to taste so bad?"
16020-410 = "Romance, huh... ...I suppose so."
16020-420 = "If I didn't have any romance in my life, I probably wouldn't have made it this far."
16020-430 = "When you were little, didn't you ever dream of having a secret base?"
16020-440 = "But when you actually build one, it's nothing like what you imagined..."
16020-450 = "It's cramped, and there's not much you can actually do in there."
16020-460 = "It felt like... being confronted with the difference between dreams and reality."
16020-470 = "The ideal adult, and life at SRT."
16020-480 = "But, maybe that's exactly why."
16020-490 = "I've come to think that no matter what form reality takes, it has its own unique flavor."
16020-500 = "Sensei, what do you think about old coffee filled with romance?"
16020-510 = "Hehe... Once again, welcome to my world."
16020-2600 = "I've received the FOX-82 sniper rifle.\nIt's perfect for ultra-long-range sniping and destroying obstacles...\nThough, firing it repeatedly really makes my shoulders ache."