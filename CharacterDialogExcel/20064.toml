[translation]
20064-10-1 = "This is Blue Archive."
20064-20-1 = "Greetings, Sensei. I am Urara Unryuin, Vice President of the Art Council at Wildhunt School of the Arts. I hope this meeting will be as beautiful and memorable as a flower in full bloom."
20064-30-1 = "It would be nice to\ndecorate with flowers."
20064-40-1 = "This place has a very\npleasant scent."
20064-50-1 = "Is there some kind of...\nsecret here, too?"
20064-60-1 = "Hmm, is there somewhere\nI can relax...?"
20064-70-1 = "It seems we should keep\na close eye on that person."
20064-80-1 = "Greetings, Sensei."
20064-90-1 = "Which task shall I help you with today?"
20064-100-1 = "Oh, you were here."
20064-110-1 = "Everything is prepared."
20064-120-1 = "I enjoy helping people."
20064-130-1 = "However, that is quite different\nfrom performing a good deed..."
20064-140-1 = "I suppose,"
20064-150-1 = "it might just be self-satisfaction."
20064-160-1 = "Hehe... please, don't ask any more about it."
20064-170-1 = "I am truly not good at\nthe act of fighting with others."
20064-180-1 = "Therefore, I strive not to get angry\nunless it is absolutely necessary."
20064-190-1 = "That said, it is not as if I do not\nfeel the emotion of anger."
20064-200-1 = "I simply try not to\nlet it show."
20064-210-1 = "If possible, I would prefer not to\nshow it in front of you, Sensei."
20064-220-1 = "Everyone wears their own mask..."
20064-230-1 = "a persona, as they go about their lives."
20064-240-1 = "For someone like me who throws themselves into acting,"
20064-250-1 = "a persona is indispensable."
20064-260-1 = "...I wonder, how many personas\ndo I actually have?"
20064-270-1 = "Hehe... just idle talk."
20064-280-1 = "Please, do not misunderstand."
20064-290-1 = "Acting is becoming someone else."
20064-300-1 = "Therefore, there are moments when one loses oneself,"
20064-310-1 = "and gets swallowed up by the role."
20064-320-1 = "To prevent that, an actor must always\nkeep a distance from their role."
20064-330-1 = "I am careful about that every day, you know?"
20064-340-1 = "So that I am not swallowed up by the role of...\n'Urara Unryuin'."
20064-350-1 = "Sensei. Um..."
20064-360-1 = "Can you smell roses on me?"
20064-370-1 = "I see... as I thought."
20064-380-1 = "For some reason,\nmany people tell me that."
20064-390-1 = "That I smell like roses."
20064-400-1 = "I don't want to stand out, but"
20064-410-1 = "because of that, I am always noticed..."
20064-420-1 = "...I am seriously troubled by it, really."
20064-430-1 = "Happy birthday, Sensei."
20064-440-1 = "I have prepared this basket as a gift."
20064-450-1 = "I hope you like it."
20064-460-1 = "Hehe, thank you for celebrating with me, Sensei."
20064-470-1 = "...Memories are flowers that bloom in the heart."
20064-480-1 = "Therefore, they are things that blossom later on."
20064-490-1 = "How this blessing I received from you will sprout and bloom..."
20064-500-1 = "I am looking forward to it."
20064-510-1 = "Sensei. Happy New Year."
20064-520-1 = "In a few months, the long winter will end,"
20064-530-1 = "and the season for buds to open will arrive. I am very much looking forward to it."
20064-540-1 = "When this time of year comes, the sound of bells rings through the city."
20064-550-1 = "Since we have the chance, why don't we go out into the city and participate in volunteer work?"
20064-560-1 = "Today is the day when even mischief is forgiven... isn't it?"
20064-570-1 = "In that case, for just one day..."
20064-580-1 = "would it be alright if I played the part of a bad girl?"
20064-600-1 = "It is a strange thing. In this garden where outsiders are forbidden—"
20064-610-1 = "to be here, looking at a script for a play that was forbidden until just recently."
20064-620-1 = "It is not a violation of school rules."
20064-630-1 = "But somehow... it feels like I am doing something wrong."
20064-640-1 = "This pounding in my chest... is this a sense of immorality?"
20064-650-1 = "Hehe... perhaps I have become a bad girl."
20064-660-1 = "...Yes. From the start, I have never been a good girl."
20064-670-1 = "Just as beautiful roses have thorns..."
20064-680-1 = "I, too, have thorns."
20064-690-1 = "Um... what you just heard—"
20064-700-1 = "is a secret between you and me... alright?"
20064-710-1 = "Words exchanged in a secret garden, after all."
20064-2600-1 = "It is not my intention to hurt anyone, but... I suppose there are times when it is necessary. Justice without power is nothing more than a fantasy. Thank you, Sensei."
