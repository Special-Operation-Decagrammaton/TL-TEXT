[translation]
10146-10 = "Hehehe... Blue Archive, is it."
10146-20 = "Sigh... It seems those who are too talented are not even allowed a moment of rest. I, the great Makoto, shall lend you a hand, Sensei."
10146-30 = "We should place the same thing in Pandemonium as well."
10146-40 = "Hmph. It seems you are overwhelmed by the aura of the great Makoto."
10146-50 = "I suppose this is just something I was born with."
10146-60 = "Sensei, why do you prefer such a cramped place...?"
10146-70 = "I could build a branch of Pandemonium by the seaside."
10146-80 = "Ah, I've been waiting."
10146-90 = "You are about the only one who can keep the great Makoto waiting."
10146-100 = "...Do be aware that you hold that much power."
10146-110 = "Heh! You've come, Sensei!"
10146-120 = "Surprised? Well—today isn't actually my scheduled day for duty."
10146-130 = "Why did I come? That is—"
10146-140 = "Why worry about such trivial things? Come now, let's begin today's work!"
10146-150 = "You probably can't even imagine, Sensei."
10146-160 = "How much I had to spend just to get someone to swap Schale duty with me."
10146-170 = "Hm? You ask why I would go that far?"
10146-180 = "That is, well..."
10146-190 = "Well, you know... it's just like that."
10146-200 = "A talented leader is always thinking about the stability of their organization, no matter where they are."
10146-210 = "There is no time to be giddy just because it's summer!"
10146-220 = "I am always thinking one step ahead for the next plan!"
10146-230 = "It just goes to show that my capacity is different from Hina Sorasaki, who is always overwhelmed by what's right in front of her! Hehehe!"
10146-240 = "Hm? You want me to pay attention to the Schale duty right in front of me too?"
10146-250 = "...Come to think of it, that's true."
10146-260 = "An influencer's swimsuit look draws a lot of attention."
10146-270 = "Just by changing clothes, one becomes the center of attention."
10146-280 = "There's nothing more cost-effective than that, right? Heh!"
10146-290 = "It was a blind spot... Why hadn't I paid attention to the sea until now?"
10146-300 = "Vast territory, infinite resources... Isn't this truly a 'treasure sea' for Gehenna!"
10146-310 = "To think that even I, the great Makoto, hadn't thought of such a thing...!"
10146-320 = "Hm? Won't I get seasick?"
10146-330 = "...The execution of this grand plan will require a bit more consideration."
10146-340 = "Oh? Are you interested in this swimsuit?"
10146-350 = "Isn't it magnificent?"
10146-360 = "I had to persuade those difficult designers to get it custom-made."
10146-370 = "But it was well worth the effort. Enjoy it to your heart's content! Hehehe!"
10146-380 = "...Don't stare too much."
10146-390 = "Hehehe... Sensei. You're getting a constant stream of messages, aren't you?"
10146-400 = "Ah, yes! I, the great Makoto, gave strict instructions!"
10146-410 = "By now, broadcasts celebrating your birthday should be playing all across Gehenna!"
10146-420 = "Well, given our relationship, there's no need to go out of your way to thank me. Heh!"
10146-430 = "Ah, that's right. Come to think of it, I've never told you this personally..."
10146-440 = "That... Happy birthday, Sensei."
10146-450 = "Ah, Sensei. I just declared today a school holiday."
10146-460 = "In Gehenna, there is no holiday more important than the birthday of the great Makoto."
10146-470 = "In other words, it means I am unusually free today."
10146-480 = "...Finally, we can spend some time together in peace without anyone bothering us."
10146-490 = "No, don't worry about it! So, what shall we do?"
10146-500 = "Hehehe... It's the New Year. Come, let's go."
10146-510 = "Hm? We're going to see the sunrise. I've already made the arrangements."
10146-520 = "You just need to follow me, Sensei."
10146-530 = "It's just a formality, but for people of our stature, it's necessary to value such events."
10146-540 = "Heh! It seems you understand, Sensei."
10146-550 = "That's right—Santa Claus does not exist."
10146-560 = "...But such a boring fact is irrelevant."
10146-570 = "I plan to distribute presents at the Gehenna plaza now!"
10146-580 = "That way, they will come to praise the great Makoto instead of a non-existent Santa Claus!"
10146-590 = "...Of course, I'll be changing into a costume."
10146-600 = "Hehehe. Are you having fun?"
10146-610 = "I'm looking forward to seeing what kind of prank you're planning to surprise me with, Sensei."
10146-620 = "Hm? Are you waiting for a prank from me, Sensei?"
10146-640 = "I have always stood as the representative of Pandemonium and Gehenna."
10146-650 = "That is likely why I haven't been able to face my own desires and emotions."
10146-660 = "But, Sensei of Schale. This proposal is not as the President of Pandemonium, but as a personal one."
10146-670 = "I will admit it. You may have become... a somewhat special existence to me, Sensei."
10146-680 = "Even if I have to pay a price—you have become an object that I must obtain."
10146-690 = "No, secure...? Capture...?"
10146-700 = "...I don't know how I should express this emotion."
10146-710 = "I see. If I had to say—"
10146-720 = "—Become mine."
10146-2600 = "Sensei... I have always obtained everything I desired. In the dictionary of the great Makoto, there are no words for defeat or impossibility. I will be satisfied with this for now, but... someday, I will definitely..."