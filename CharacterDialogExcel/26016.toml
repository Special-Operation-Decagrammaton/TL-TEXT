[translation]
26016-10 = "Blue Archive!"
26016-20 = "Blue skies, vast seas, and the dazzling midsummer sun... A midsummer dream is right here! Wherever there's a scoop, you'll find me!"
26016-30 = "Chiaki Radar, on! Now then, what could they be talking about?"
26016-40 = "Whoa! This is a sight you don't even see often in Gehenna...!"
26016-50 = "It's Motomiya! Sorry to bother you! Mind if I get an interview?"
26016-60 = "That club... I'm curious about it... Do you think I could try joining for a day?"
26016-70 = "(I wonder what kind of relationship they have, anyway...?)"
26016-80 = "Welcome back, Sensei!"
26016-90 = "Did anything interesting happen?"
26016-100 = "The Daily Chiaki is here for you!"
26016-110 = "Here you go!"
26016-120 = "I kept your seat warm for you!"
26016-130 = "Come on, come on, have a seat!"
26016-140 = "I'll go ahead and change the trash bag for you."
26016-150 = "Don't worry about it! This is all part of the reporting process!"
26016-160 = "I'm just not feeling motivated for some reason..."
26016-170 = "I wonder if there are any interesting stories lying around somewhere?"
26016-180 = "How about we trade some top-secret scoops?"
26016-190 = "Let's share our secrets... What do you say?"
26016-200 = "I'm going to take a peek at Sensei's desk!"
26016-210 = "Today is Sensei's birthday!"
26016-220 = "Congratulations! *Clap clap clap!*"
26016-230 = "How is it? Spending your birthday with me? Are you having fun?"
26016-240 = "Yes, smile! Ehehe!"
26016-250 = "What do you mean, 'what day is it today'?"
26016-260 = "Hmm, was there something special?"
26016-270 = "Gasp! Don't tell me, is it a manuscript deadline!?"
26016-280 = "Oh, it was my birthday. Thank goodness..."
26016-290 = "Of course I remember!"
26016-300 = "That's why I'm here, isn't it? Hehe."
26016-310 = "Happy New Year!"
26016-320 = "I'm looking forward to all sorts of scoops this year, too!"
26016-330 = "I'm here for an exclusive report to see if you've been a good kid!"
26016-340 = "Happy Halloween!"
26016-350 = "I wonder what kind of stories will be born today!"
26016-360 = "Off to the Halloween scene we go!"
26016-380 = "Hehe! Found an opening! Perfect photo op!"
26016-390 = "Aha! Sensei, you're all curled up into a little ball..."
26016-400 = "This composition is perfect for a cover page!"
26016-410 = "Hmph-hmm! If there's no scoop, I'll just make one!"
26016-420 = "Tsk, tsk, tsk! You're too naive!"
26016-430 = "I dropped the cap to this!"
26016-440 = "Literally, we got a delicious scene without spending a single cent!"
26016-450 = "Sensei, if you're not being interesting, I'll have to sentence you to 'confinement under the table'!"
26016-460 = "If you tell me a more interesting story, I might just let you out, you know?"
26016-470 = "Hey, what's wrong? You're looking away..."
26016-480 = "We're still in the middle of an interview! Please look at me properly!"
26016-490 = "Why won't you look at me?"
26016-500 = "Wait, this is...!"
26016-510 = "Kyaaaaah!"
26016-520 = "Hey! You can't look at that!"
26016-530 = "And don't come out either! Just stay right there!"
26016-2600 = "The pen is mightier than the sword! ...Well, this is an exception, though!"