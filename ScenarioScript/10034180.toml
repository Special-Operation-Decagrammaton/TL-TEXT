[translation]
10034180-1 = "2 дня назад: Вторжение"
10034180-10 = "Кёяма Казуса-а-а!!"
10034180-11 = "Казуса, к тебе подруга пришла. Иди поздоровайся."
10034180-12 = "Полегче, Ёшими. Она НАША подруга."
10034180-13 = "А-ха-ха. Рейса. Заходи, садись сюда."
10034180-14 = "...? Хм? А куда Казуса делась? Я её не вижу."
10034180-15 = "Хм? Странно. Она же только что была здесь..."
10034180-16 = "...Что, её нет? Кёямы Казусы?"
10034180-17 = ""
10034180-19 = ""
10034180-20 = "Э-э, эм... Эм... Э-э..."
10034180-21 = "Простите..."
10034180-23 = "Ты о чём? Извиняться не за что. Просто садись и отдыхай."
10034180-24 = "Ага, наверное, пошла купить сладостей или чего-то такого. Можешь подождать её здесь."
10034180-26 = "П-Правда? Спасибо за добрые слова... Н-Но я ведь не из Клуба сладкоежек после школы..."
10034180-27 = "«Банда сладкоежек после школы». Именно. Та самая печально известная шайка..."
10034180-28 = "Не обращай внимания на этот бред сзади."
10034180-29 = "В общем, да. Как она сказала, не переживай. Люди важнее клубов, а не наоборот."
10034180-31 = "*ахает*"
10034180-32 = "Ага! Так что скажу прямо: заходи когда захочешь, даже если Казусы здесь нет!"
10034180-33 = "Работа в Отряде дружинников, конечно, важна, но тебе же иногда нужно где-то отдыхать, верно?"
10034180-34 = ""
10034180-36 = ""
10034180-37 = "..."
10034180-38 = "...Верно!!"
10034180-39 = ""
10034180-41 = ""
10034180-43 = "Я вернулась. Принесла мороженое из..."
10034180-44 = ""
10034180-46 = ""
10034180-47 = "...О, ты тоже здесь."
10034180-49 = "...*вздыхает* У меня было странное предчувствие, поэтому я купила одно лишнее. Похоже, не зря."
