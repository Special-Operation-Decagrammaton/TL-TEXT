[translation]
1004605-1 = "Спасаемся из кризиса вместе с Изуной!"
1004605-4 = "Господин! Вы пришли!"
1004605-5 = "[s] «Привет, Изуна. Сегодня, кажется, жарче обычного.»"
1004605-6 = "Хм, да!"
1004605-7 = "По прогнозу сегодня будет особенно жарко..."
1004605-8 = "Во время ниндзя-тренировок всегда нужно учитывать окружающую среду!"
1004605-9 = "Хм... Чем займёмся сегодня?"
1004605-10 = "[s] «Хорошо, сегодня действительно идеальный день, чтобы попл...»"
1004605-11 = "(Шок)"
1004605-12 = "П-П-П-Плавать...?"
1004605-13 = "Ой... Эм... Э-э..."
1004605-14 = "О, точно!"
1004605-15 = "Я-я знаю идеальную тренировку для такого жаркого дня, господин!"
1004605-16 = "В прошлый раз мы только строили песчаные замки, но..."
1004605-17 = "О...! Строить песчаные замки так весело! Хочу ещё!"
1004605-18 = "[s] «О, так... ты хочешь и сегодня поиграть в песке?»"
1004605-19 = "Вы правда согласитесь, господин? Хи-хи!"
1004605-20 = "...Стоп, ой!"
1004605-21 = "Н-Н-Нет, господин! Сегодня мы должны тренироваться!"
1004605-22 = "Да, я здесь ради ниндзя-тренировки, а не плавания!"
1004605-23 = "Т-Так можно, господин?"
1004605-24 = "[s1] «Если ты этого хочешь, конечно...»\n[s2] «Какую тренировку ты хочешь провести?»"
1004605-27 = "Хорошо! Это особая тренировка, которую я только что придумала!"
1004605-28 = "Сегодня я хочу тренироваться выбираться из горячего песка. Она называется..."
1004605-29 = "Ниндзюцу-тренировка побега из песчаного погребения!"
1004605-30 = "[s] «Звучит очень опасно.»"
1004605-32 = "Недавно я смотрела исторический фильм про ниндзя!"
1004605-33 = "Когда враги ворвались в замок, господин и ниндзя убежали через тайный проход..."
1004605-34 = ""
1004605-37 = "Там была сцена, где после того, как господин прошёл, ниндзя взорвал проход бомбой!"
1004605-38 = ""
1004605-43 = "Земля обрушилась, и враги запаниковали!"
1004605-44 = "Ниндзя использовал себя как приманку, чтобы спасти господина, и оказался погребён вместе с врагами в проходе!"
1004605-45 = "Я переживала, что ниндзя конец, но потом...!"
1004605-47 = "Та-дам! Ниндзя выбрался сквозь землю! Это было гениально!"
1004605-48 = "[s] «И когда ты это увидела, ты...»"
1004605-49 = "Да! Я захотела попробовать сама!"
1004605-50 = "Ниндзя должен быть готов к самым экстремальным ситуациям..."
1004605-51 = "В такой жаркий день мы можем провести тренировку, которая действительно мне в этом поможет!"
1004605-52 = "...Так что, господин!"
1004605-53 = "Можете закопать меня в песок?"
1004605-54 = "А потом я изо всех сил постараюсь выбраться!"
1004605-55 = "[s] «(Хм, не уверен, что это вообще можно назвать тренировкой...)»"
1004605-56 = ""
1004605-59 = "[ns] «Хорошо, но давай сделаем это в тени. Иначе можешь получить тепловой удар.»"
1004605-60 = "Хи-хи-хи. Да, господин!"
1004605-61 = ""
1004605-65 = "Мы отправились в тенистое место проводить Ниндзюцу-тренировку побега из песчаного погребения."
1004605-66 = "[ns] «Если станет слишком тяжело, обязательно скажи, хорошо? Я начинаю.»"
1004605-67 = "Хорошо! Я готова!"
1004605-68 = ""
1004605-70 = ""
1004605-75 = "[ns] «Ну что, Изуна. Как так?»"
1004605-76 = "Эм, если я двигаюсь вот так..."
1004605-77 = "Господин! Кажется, можно добавить ещё песка!"
1004605-78 = "Тренировка будет полезнее, если насыпать столько, чтобы руки и ноги были прижаты!"
1004605-79 = "[s] «Ну, если ты так говоришь...»"
1004605-80 = ""
1004605-82 = ""
1004605-84 = "[ns] «А теперь?»"
1004605-85 = "Хм... Всё ещё немного не хватает..."
1004605-86 = "Господин! Ещё совсем чуть-чуть... Да! Ещё немного!"
1004605-87 = "[s] «...Х-Хорошо!»"
1004605-89 = ""
1004605-92 = "[ns] «Так. Ну как теперь...?»"
1004605-93 = "Нет...! Господин! Нужно ещё больше песка, чтобы ситуация стала по-настоящему драматичной!"
1004605-94 = "Пожалуйста, добавьте ещё!"
1004605-95 = ""
1004605-98 = "[s] «Разве это уже не становится опасным?!»"
1004605-99 = "Всё хорошо, господин! Ещё немного!"
1004605-100 = "[ns] «Ого! А где вообще предел Изуны?!»"
1004605-101 = ""
1004605-105 = "По просьбе Изуны я продолжал насыпать на неё песок."
1004605-106 = ""
1004605-109 = "Я снова и снова спрашивал, всё ли в порядке, пока наваливал песок, но она настаивала, что всё хорошо..."
1004605-110 = "[ns] «Э-Это уже слишком экстремально...»"
1004605-114 = "Я насыпал столько песка, что Изуну стало совсем не видно."
1004605-115 = ""
1004605-118 = "[ns] «...Изуна, мы закончили?»"
1004605-120 = "[ns] «Эм, Изуна...?»"
1004605-122 = "[ns] «О нет, нет! Я закопал её живьём! Изуна, ты в порядке?!»"
1004605-123 = ""
1004605-132 = ""
1004605-133 = ""
1004605-134 = "[ns] «Изуна?! Пожалуйста, не умирай!»"
1004605-135 = "М-м... Господин."
1004605-136 = "[s] «...А?»"
1004605-137 = "Хи-хи-хи... Давайте ещё поиграем, господин..."
1004605-138 = "Лето... и я хочу... быть с вами..."
1004605-139 = "Хр-р..."
1004605-140 = "[s] «Похоже, она просто устала.»"
1004605-141 = ""
1004605-144 = "[ns] «Конечно, давай ещё поиграем.»"
1004605-147 = "Пока Изуна спала,"
1004605-148 = ""
1004605-152 = "я раскрыл зонтик и читал книгу, наслаждаясь спокойным летним днём."
