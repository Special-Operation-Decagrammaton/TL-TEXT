[translation]
1007805-1 = "Выглядит умно"
1007805-2 = "Гостиная Шале"
1007805-3 = "Я пригласил Касуми в Шале."
1007805-4 = "Хм! Конечно. Понятно."
1007805-5 = "Тихое, чистое место для учёбы... и уединённое."
1007805-6 = "Гостиная Шале защитит меня от преследователей. Отлично!"
1007805-7 = "Но я должна спросить..."
1007805-8 = "Сенсей, вы уверены? Мы ведь говорим обо мне."
1007805-9 = "Обо мне! О той, кто сказала вам, что Шале — одно из идеальных мест для моего подрыва..."
1007805-10 = "Вы не волнуетесь? Разве не стоило бы держать меня как можно дальше отсюда?"
1007805-11 = "[s1] «Ты всё ещё студент и тебе нужна помощь.»\n[s2] «Мой долг — помогать любому студенту, которому нужно учиться.»"
1007805-14 = "...!"
1007805-15 = "Уахаха! Вот же вы великодушный — почти до смешного."
1007805-16 = "...Ладно. Дарёному коню в зубы не смотрят."
1007805-17 = "Это редкая возможность. Нужно ей воспользоваться."
1007805-18 = "Оп!"
1007805-19 = ""
1007805-21 = ""
1007805-22 = "[ns3] «Книг-то сколько.»\n[ns4] «Что это всё такое...?»"
1007805-25 = "Здесь у меня лучшие материалы по гражданскому строительству, географии, архитектуре..."
1007805-26 = "Всё это исследовательские материалы или научные статьи известных учёных!"
1007805-27 = "...Хм? Что такое? Опять этот взгляд. Рядом со мной у вас часто глаза становятся размером с блюдца."
1007805-28 = "...Хаха."
1007805-29 = "Шучу. Я знаю, почему вы так смотрите."
1007805-30 = "Вы такого не ожидали."
1007805-31 = "Наверное, странно видеть именно меня сидящей и учащейся как примерный студент."
1007805-32 = "Но вы должны знать: Отдел горячих источников не просто взрывает всё подряд и объявляет результат горячим источником."
1007805-33 = "Нет. Мы делаем всё ПРАВИЛЬНО. Мы строго следуем надлежащим методам гражданского строительства и строительным нормам."
1007805-34 = "Я знаю, со стороны мы выглядим как кучка хулиганов с бомбами, и люди нас за это осуждают."
1007805-35 = "И кто может их винить? Каждый имеет право на свой взгляд. А мы не обязаны ничего им объяснять."
1007805-36 = "В этом мире у нас ограниченное время, и нельзя тратить его на попытки угодить всем вокруг. Понимаете?"
1007805-37 = "Ну а в таком духе давайте начинать. Сегодня мне нужно охватить много материала."
1007805-38 = "Сенсей..."
1007805-39 = "...Я хорошо воспользуюсь этим местом."
1007805-41 = "Касуми часами сидела в полной тишине, погрузившись в книги."
1007805-42 = "У меня тоже была работа для Шале, поэтому я тихо работал рядом с ней."
1007805-44 = "..."
1007805-45 = ""
1007805-47 = ""
1007805-48 = "...А, понятно."
1007805-49 = "..."
1007805-50 = "Оп-па!"
1007805-51 = ""
1007805-54 = "[ns5] «Касуми?»\n[ns6] «Ты встаёшь?»"
1007805-57 = "Не обращайте на меня внимания, Сенсей. Продолжайте работать, а я просто..."
1007805-58 = ""
1007805-61 = "...М-м. Вот это хорошо."
1007805-62 = ""
1007805-65 = ""
1007805-66 = "Вот, Сенсей, выпейте кофе."
1007805-67 = "Я заметила, что ваша чашка пуста, поэтому во время последнего перерыва сварила целый кофейник. Может, и вам стоит отдохнуть?"
1007805-68 = "Мы часами работали бок о бок и не сказали ни слова. Наверное, какой-то рекорд!"
1007805-69 = "Не поймите неправильно. Мне это не не понравилось. Наоборот, я даже получила удовольствие."
1007805-70 = "Вы, возможно, не знаете, но найти человека, с которым приятно вот так молча учиться, непросто..."
1007805-71 = "...особенно среди тех, с кем я обычно общаюсь."
1007805-72 = "Исследования всегда были для меня скорее одиночным занятием. Поэтому это было..."
1007805-73 = ""
1007805-75 = ""
1007805-77 = "Кхм! Ну, наверное, потому что это были вы. С кем ещё заниматься исследованиями, как не с Сенсеем?"
1007805-78 = "Ваша работа как педагога — и заниматься студентами, и разбираться с бумагами, верно?"
1007805-79 = "Может, вы единственный человек во всём мире, способный меня понять..."
1007805-80 = ""
1007805-82 = ""
1007805-83 = "...Да ну! Кого я обманываю? Мы полные противоположности!"
1007805-84 = ""
1007805-86 = ""
1007805-87 = "Но я не лгала, когда сказала, что мне было весело."
1007805-88 = "Если бы могла, я бы училась здесь бесконечно."
1007805-89 = "...Хм? Правда можно?"
1007805-90 = "Вы бы... предпочли, чтобы я каждый день приходила сюда учиться..."
1007805-91 = "...Уахаха!"
1007805-92 = "Хорошая шутка, Сенсей! Очень смешно. Но вы же знаете, меня нельзя вот так привязать к одному месту. Как говорится, я свободная душа!"
1007805-93 = "Я ещё не готова к таким обязательствам. Звучит заманчиво, но вынуждена отказаться."
1007805-94 = "Однако если мне понадобится сменить обстановку..."
1007805-95 = "я воспользуюсь вашим предложением."
1007805-96 = "Когда-нибудь в будущем."
