22240-149 = "Как кто-то вообще может говорить, что ты повелитель демонов или что тебе нужно исчезнуть? Это всё чушь!"
22240-150 = "Я с этим не смирюсь!"
22240-151 = "Никогда."
22240-152 = "Это никогда не будет «Game Over». Мы будем каждый раз приходить и воскрешать тебя. Вместе вернёмся к последней точке сохранения."
22240-153 = "Почему... Почему вы делаете всё это, все...?"
22240-154 = "Я... повелитель демонов..."
22240-155 = "Вы пострадали из-за меня..."
22240-156 = "Почему вы меня не боитесь? Почему не ненавидите...?"
22240-157 = "Почему...?"
22240-158 = "Потому что ты..."
22240-159 = "Наша подруга! Участник нашей группы!"
22240-160 = "...!"
22240-161 = "Ты уже говорила это раньше."
22240-162 = "Final Fantasia, Dragon Crest, Tails of Destiny, Chrono Digger, The Fable of Heroes, Pyre Emblem и... Tales Saga Chronicle..."
22240-163 = "Какую игру ни возьми..."
22240-164 = "[s] «Герои никогда, никогда не бросают друзей.»"
22240-165 = "Даже если ты повелитель демонов, мне всё равно...!"
22240-166 = "Считай это классом!"
22240-167 = "В жизни ты сама выбираешь, кем хочешь быть!"
22240-168 = "Неважно, какой класс тебе навязывают другие. Выбираешь ты!"
22240-169 = "Солдат, рыцарь, маг, жрец... Кем угодно, Алиса."
22240-170 = "Неважно кем. Ты даже можешь выбрать..."
22240-171 = "...героя."
22240-172 = "[ns] «Так что, Алиса, скажи нам, кем ты сама хочешь быть.»"
22240-174 = "Я... повелитель демонов..."
22240-175 = "Повелитель демонов... который принесёт миру разрушение..."
22240-176 = "Даже если..."
22240-178 = "Даже если это правда..."
22240-179 = "Я действительно... могу сама выбрать свой класс?"
22240-182 = "Могу продолжать отправляться в приключения со всеми..."
22240-183 = "И продолжать выполнять квесты?"
22240-186 = "Даже если я такая...? Правда...?"
22240-187 = "[ns] «Да. Можешь.»"
22240-189 = "[ns] «Само собой, Алиса.»"
22240-191 = ""
22240-193 = "Тогда... я хочу этого! Я хочу сама выбрать свой класс!"
22240-196 = "Я хочу быть героем! И состоять в группе вместе со всеми..."
22240-199 = "И продолжать приключения с Момои, Мидори, Юзу и Сенсеем...!"
22240-201 = "Если... вы не против, что я повелитель демонов!"
