22240-204 = "Даже повелитель демонов может быть героем."
22240-205 = "В наши дни такой сюжет стал бы хитом!"
22240-206 = "А если такой истории ещё нет, мы просто напишем её сами!"
22240-208 = "Мы вчетвером можем сделать всё, что задумаем!"
22240-209 = "Мы можем создать что угодно..."
22240-211 = "Потому что мы — Отдел разработки игр!"
