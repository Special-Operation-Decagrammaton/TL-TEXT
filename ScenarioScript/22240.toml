[translation]
22240-1 = "Episódio 24;O Que Eu Quero Ser"
22240-10 = "Então este lugar é..."
22240-11 = "...o coração da Aris?"
22240-12 = "Ei, mana! Yuzu!"
22240-13 = "Ali...!"
22240-18 = "Aris!!"
22240-22 = "...Quem?"
22240-23 = "Somos nós!"
22240-24 = "Aris-chan! Nós estamos aqui!"
22240-25 = "Aris-chan!"
22240-26 = "[s] \"Aris, você está bem?\""
22240-27 = "Momoi, Midori... Yuzu...? Até o Sensei...?"
22240-28 = "Por que vocês estão aqui...?"
22240-29 = "Ora, viemos buscar a Aris que fugiu de casa!"
22240-30 = "Aris-chan, vamos sair logo daqui!"
22240-31 = "Vamos voltar pra casa, Aris-chan."
22240-32 = "Ah..."
22240-33 = "A Aris... a Aris..."
22240-34 = "Princesa, já se esqueceu das cenas que testemunhou?"
22240-35 = "Quem é?!"
22240-42 = "[ns] \"...<Key>.\""
22240-44 = "Então aquela é...!"
22240-45 = "Aquela pessoa com o mesmo rosto da Aris-chan...?"
22240-46 = "É a culpada por prender a Aris-chan aqui dentro...?"
22240-47 = "[ns] \"O que você quer dizer com 'as cenas que a Aris testemunhou'?\""
22240-49 = "Exatamente o que eu disse."
22240-50 = "Todas as cenas que a \"Princesa\" viu e ouviu dentro deste espaço."
22240-73 = "[ns] \"Isso é...\""
22240-74 = "Somos nós... lutando...?"
22240-75 = "Por que mostrar uma coisa dessas...?"
22240-79 = "Imagens captadas pela rede de vigilância de Eridu."
22240-80 = "Todas elas são cenas de vocês lutando, correndo,#ncaindo e se ferindo até conseguirem chegar aqui."
22240-81 = "Por que tais coisas acontecem...?"
22240-82 = "A \"Princesa\" já sabe a resposta para isso, não sabe?"
22240-86 = "...A Aris..."
22240-90 = "A Aris não pode voltar."
22240-91 = "[s] \"Aris...?\""
22240-92 = "Se a Aris ficar perto de vocês..."
22240-93 = "vocês só vão acabar se machucando ainda mais."
22240-94 = "Não, Aris-chan! Não é nada disso!"
22240-95 = "A Midori tem razão, Aris-chan. Nós nunca pensaríamos..."
22240-97 = "Midori... Yuzu...#nMas todo mundo se machucou por culpa da Aris..."
22240-98 = "A Momoi..."
22240-102 = "A Midori, a Yuzu..."
22240-110 = "E até a Neru... senpai..."
22240-114 = "Porque a Aris... não é uma Heroína, é um Rei Demônio."
22240-115 = "Um dia, o mundo..."
22240-116 = "Porque nasci como um Rei Demônio que pode destruir Kivotos..."
22240-117 = "Porque a Aris existe... porque a Aris deseja estar lá com vocês..."
22240-118 = "Um Rei Demônio... assim... não tem o direito de ficar ao lado de vocês."
22240-119 = "Se as pessoas que eu mais amo... vão sofrer e se machucar..."
22240-120 = "Então, é melhor..."
22240-121 = "A Aris..."
22240-123 = "O certo é a Aris desaparecer assim mesmo."
22240-125 = "\"Tales Saga Chronicle 2\"...!"
22240-126 = "O jogo que nós fizemos juntas!!#nGanhou o Prêmio Especial!!!"
22240-132 = "[ns] \"M-Momoi?\""
22240-133 = "O fim de Kivotos? Do que é que você tá falando?"
22240-134 = "Que todo mundo se machuca só porque a Aris existe?"
22240-135 = "Quem foi que inventou uma besteira dessas?!"
22240-139 = "Foi por termos conhecido a Aris..."
22240-140 = "Foi porque a Aris estava lá...!"
22240-141 = "Que nós conseguimos fazer o nosso jogo!#nGanhamos um prêmio no Prêmio Millennium e salvamos o nosso clube!"
22240-142 = "Sim, é verdade."
22240-143 = "...Sim!"
22240-144 = "[ns] \"É verdade. Só conseguimos fazer tudo isso porque a Aris estava lá.\""
22240-145 = "Momoi...?"
22240-146 = "Salvar o clube... fazer um jogo e jogar juntas!"
22240-147 = "Até ficar próxima da Neru-senpai, que antes só dava medo, a ponto de jogar videogame com ela!"
22240-148 = "Tudo! Tudinho mesmo!#nFoi porque a Aris estava lá com a gente!"
22240-149 = "E mesmo assim, dizer que a Aris é um Rei Demônio, ou que nasceu pra isso...#nE que por isso tem que desaparecer?! Isso não faz o menor sentido!!"
22240-150 = "Eu nunca vou aceitar uma coisa dessas!"
22240-151 = "Sim, jamais."
22240-152 = "Eu não posso... simplesmente deixar... você desaparecer..."
22240-153 = "...P-P-Por quê?#nPessoal... por quê...?"
22240-154 = "A Aris... é um Rei Demônio..."
22240-155 = "Todo mundo se machucou... por culpa da Aris..."
22240-156 = "Por que vocês... não têm medo da Aris... nem me odeiam...?"
22240-157 = "Por que agem assim...?"
22240-158 = "Porque! A Aris-chan é..."
22240-159 = "a nossa companheira...!"
22240-160 = "...!"
22240-161 = "Outro dia... você mesma disse isso pra gente, não foi, Aris-chan?"
22240-162 = "\"Final Fantasia\", \"Dragon Test\", \"Tolls of Fate\",#n\"Tradição dos Cavaleiros Dragão\", \"Mito dos Heróis\", \"Eyes Eternal\"...#nE — \"Tales Saga Chronicle\"..."
22240-163 = "Em qualquer jogo, os protagonistas..."
22240-164 = "[s] \"Nunca desistem dos seus companheiros.\""
22240-165 = "Mesmo que a Aris seja um Rei Demônio, isso não importa nem um pouco...!"
22240-166 = "Isso é só uma classe como qualquer outra!"
22240-167 = "Quem decide quem você é, é você mesma!"
22240-168 = "A Aris só precisa escolher a classe que quer e mudar de profissão!"
22240-169 = "Guerreira, Cavaleira, Maga, Clériga — pode ser o que você quiser, Aris-chan."
22240-170 = "Claro, qualquer outra classe também."
22240-171 = "Bem... também existe a classe de... Heroína."
22240-172 = "[ns] \"Então, me diga o que você realmente sente, Aris.\""
22240-174 = "Mesmo a Aris... sendo um Rei Demônio..."
22240-175 = "Mesmo podendo... destruir o mundo..."
22240-176 = "...Mesmo assim..."
22240-178 = "...Ainda assim... a Aris..."
22240-179 = "Tudo bem mesmo assim?"
22240-182 = "Viver aventuras... junto com todo mundo..."
22240-183 = "Eu posso... continuar essa missão...?"
22240-186 = "Mesmo sendo uma Aris como eu...?#nDe verdade...?"
22240-187 = "[ns] \"Sim.\""
22240-189 = "[ns] \"Com certeza.\""
22240-193 = "Então... a Aris também... quer..."
22240-196 = "A Aris também! Quer virar uma Heroína...!#nE com todo mundo..."
22240-199 = "Com a Momoi, a Midori, a Yuzu.#nE com o Sensei... eu quero continuar nossa aventura...!"
22240-201 = "Se um Rei Demônio... como a Aris... tiver permissão para isso...!"
22240-203 = "Sim! Se é isso que a Aris quer, já é mais do que suficiente!"
22240-204 = "Até um Rei Demônio pode virar Heroína."
22240-205 = "Na verdade, histórias assim estão fazendo o maior sucesso hoje em dia!"
22240-206 = "E mesmo que... isso não estivesse na moda...#nnós podemos fazer esse ser o nosso próximo jogo..."
22240-208 = "Afinal, nós quatro conseguimos dar forma a qualquer imaginação...!"
22240-209 = "Nós podemos criar qualquer coisa...!"
22240-211 = "Porque somos o \"Clube de Desenvolvimento de Jogos\"!"
22240-216 = "— Então, a Aris quer ser uma Heroína."
22240-217 = "[ns] \"Sim. Você pode ser uma Heroína.\""
22240-219 = "A Aris... quer ser a Aris...!"
22240-220 = "[ns] \"Quem você quer ser é uma escolha só sua — Aris.\""
22240-223 = "Isto é...!"
22240-224 = "A Espada da Heroína... Aris! Olha!"
22240-225 = "A Espada da Heroína...!"
22240-226 = "Puxe a espada, Aris-chan!"
22240-227 = "...!"
22240-231 = "...Sim!"
22240-238 = "Isso é...! \"Princesa\"... esse seu poder...!"
22240-239 = "Esse seu poder existe para destruir o mundo, e ainda assim...!"
22240-240 = "Errado! Esta é a arma da Heroína!"
22240-241 = "Porque foi isso que a Aris decidiu!"
22240-242 = "Agora a Aris é uma Heroína do atributo Luz...!"
22240-246 = "LUZ—!!!!"
22240-252 = "Princesa... você..."
22240-253 = "A classe da Aris não é \"Princesa\"!"
22240-254 = "A Aris é..."
22240-255 = "Uma \"Heroína\"!!"
22240-256 = "In...compreensível..."
22240-257 = "..."
22240-266 = "...Que algo assim seja realmente possível..."
22240-267 = "[s] \"Sim, é possível.\""
22240-268 = "Mas, nos meus cálculos... isso..."
22240-269 = "Como...? Isso é absurdo..."
22240-270 = "[s] \"Não existe impossível para aquelas garotas.\""
22240-274 = "[ns] \"Afinal, não importa o que ninguém diga...\""
22240-276 = "Hã?! Cadê a Aris?!"
22240-277 = "Aris-chan! Você acordou?!"
22240-278 = "...Aris-chan!"
22240-287 = "[ns] \"Porque elas são a Heroína e as companheiras do seu grupo.\""
22240-292 = "Próximo;Escola de Ciências Millennium"
