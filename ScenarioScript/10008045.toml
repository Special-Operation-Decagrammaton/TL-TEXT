10008045-34 = "Эти негодяи!"
10008045-35 = "В том сейфе была годовая прибыль."
10008045-36 = "К-Кхм! То есть в этом ящике хранятся драгоценные желания множества посетителей."
10008045-37 = "Это трагедия. Настоящий позор! Новый год не должен начинаться так."
10008045-38 = "Мы просто не можем позволить им уйти безнаказанными."
10008045-39 = "Нам важно лишь поймать преступников."
10008045-40 = "То есть тот, кто восстановит справедливость, сможет забрать себе все деньги из ящика!"
10008045-41 = ""
10008045-45 = "Вы это слышали? Погоня на Новый год! Гонка за наличкой, народ!"
10008045-46 = "Это ваш шанс использовать деньги, чтобы исполнить ЛЮБОЕ желание!"
10008045-47 = "Насколько это морально? Ждёт ли божественная кара того, кто получит деньги? Узнать можно только одним способом!"
10008045-48 = "И уж поверьте, Школа журналистики «Кронос» всегда докапывается до сути и раскрывает правду!"
10008045-49 = ""
10008045-51 = ""
