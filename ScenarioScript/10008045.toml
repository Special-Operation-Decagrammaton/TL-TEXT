10008045-25 = "Адьос!"
10008045-26 = ""
10008045-28 = ""
10008045-30 = "То, что вы только что увидели, — реальные кадры кражи ящика для пожертвований с новогоднего мероприятия Дайкичидэна!"
10008045-31 = "Печально известные Кайтенджеры сейчас в бегах! Кто же сумеет вернуть ящик?"
