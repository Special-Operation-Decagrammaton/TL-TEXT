10008045-53 = "Не пропустите продолжение!"
10008045-54 = "Что же станет с ящиком для пожертвований?!"
10008045-55 = "Подписывайтесь на официальный канал Школы журналистики «Кронос», чтобы узнать!"
10008045-56 = "И не забудьте нажать на колокольчик, чтобы сразу получать уведомления о новых раскрытых истинах!"
10008045-59 = "О чём они вообще думали?!"
10008045-60 = "Теперь понятно, почему сюда слетелось столько вредителей."
10008045-61 = "Ха-ха-ха!"
10008045-62 = "Похоже, работы у нас будет полно."
10008045-64 = "Хм. Всё приняло странный оборот, но раз уж ввязались — идём до конца."
10008045-65 = ""
10008045-67 = ""
