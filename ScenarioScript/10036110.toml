[translation]
10036110-1 = "Эпилог"
10036110-2 = ""
10036110-3 = "Фух."
10036110-4 = "На этом уборка закончена. Здесь больше ничего не осталось, кроме песка."
10036110-5 = ""
10036110-10 = ""
10036110-11 = ""
10036110-12 = ""
10036110-13 = "[ns] «Доброе утро, Саори.»"
10036110-15 = "Привет, Сенсей. Привет всем."
10036110-16 = "Гуляете?"
10036110-17 = "Ч-Что-то вроде того. Я просто хотела ещё раз увидеть место фестиваля перед отъездом."
10036110-18 = "Этот жар, это возбуждение... Я до сих пор не могу поверить, что вот так стояла на сцене."
10036110-19 = "Надеюсь, я не выглядела посмешищем."
10036110-20 = "[s1] «Нет. На тебя было очень весело смотреть.»\n[s2] «Я чуть судороги не заработал от того, как сильно веселился.»"
10036110-21 = ""
10036110-22 = ""
10036110-24 = ""
10036110-25 = ""
10036110-26 = "Ага, ОЧЕНЬ весело. Прямо как пляжные вечеринки, о которых я читала в журналах."
10036110-27 = "Наверное, было не так уж плохо..."
10036110-28 = "Мне тоже понравилось. Особенно увидеть скрытый талант Сао-Сао."
10036110-30 = "Талант... К-Кхм! Давайте все вместе прогуляемся."
10036110-36 = "Теперь здесь так тихо. Будто всей этой суматохи и не было."
10036110-37 = "Без фестивальной площадки здесь выглядит ещё пустыннее."
10036110-38 = "Ага, без всех этих Бандитов в Шлемах это вообще совсем другое место."
10036110-39 = ""
10036110-42 = "..."
10036110-47 = ""
10036110-48 = ""
10036110-49 = "Разбивающиеся волны, сияющий солнечный свет..."
10036110-50 = "Пустой пляж. Такое ощущение... новое."
10036110-51 = "Я всё ещё хочу спать, но ради этого стоило проснуться."
10036110-52 = "Ну что, лидер, ты разобралась с тем, что тебя тревожило?"
10036110-53 = "Ч-что?!"
10036110-54 = "Вот же..."
10036110-55 = "Когда ты нервничаешь, у тебя есть привычка бесцельно слоняться."
10036110-56 = "Даже я это знаю."
10036110-57 = "*кашляет*"
10036110-58 = "Хи-хи. Она милая, когда паникует, правда?"
10036110-59 = ""
10036110-61 = ""
10036110-62 = ""
10036110-63 = "...Ты ведь снова уйдёшь, да?"
10036110-64 = "Опять отправишься искать себя?"
10036110-66 = "...Ага."
10036110-67 = "Но думаю, теперь всё будет иначе."
10036110-68 = "Раньше мне казалось, будто я бегу в темноте. Я не знала, где нахожусь и насколько быстро двигаюсь..."
10036110-69 = "Но теперь я увидела немного света."
10036110-70 = "Так что я буду ориентироваться на этот свет, пока снова брожу и обо что-то спотыкаюсь. Ещё немного."
10036110-71 = "И простите. Простите меня за—"
10036110-72 = ""
10036110-74 = ""
10036110-75 = "Тебе больше не нужно извиняться."
10036110-76 = "И правда. Мы всегда будем болеть за тебя, Сао-Сао. Не переживай о нас."
10036110-77 = "П-Постарайся звонить, если сможешь. Может, если окажемся где-нибудь рядом, снова все вместе погуляем."
10036110-78 = ""
10036110-80 = ""
10036110-82 = ""
10036110-83 = "...Спасибо вам всем."
10036110-84 = "И, Сенсей..."
10036110-85 = "[s3] «Я тоже буду за тебя болеть.»\n[s4] «Дай знать, если тебе понадобится помощь.»"
10036110-88 = "Спасибо."
10036110-89 = "Тогда, полагаю, пока наши пути здесь расходятся."
10036110-91 = "...Наверное. На этот раз вы идите первыми. Я вас провожу."
10036110-93 = "Б-Береги себя, Саори..."
10036110-94 = ""
10036110-96 = ""
10036110-97 = ""
10036110-98 = ""
10036110-99 = "...Не поранься."
10036110-100 = ""
10036110-102 = ""
10036110-103 = ""
10036110-104 = ""
10036110-105 = "До новой встречи. Пока, Сао-Сао."
10036110-106 = ""
10036110-108 = ""
10036110-109 = ""
10036110-111 = ""
10036110-113 = ""
10036110-114 = "..."
10036110-115 = "[s] «Не унывай, Саори. Иногда прощание — это шанс снова сказать «привет».»"
10036110-116 = "Они уже ушли?"
10036110-117 = "[s] «...А?»"
10036110-118 = "Есть кое-что, чего я им не сказала."
10036110-119 = "Мне не заплатили."
10036110-120 = "[s] «Что?!»"
10036110-121 = "Не стоило доверять Бандитам в Шлемах и недооценивать их. Не просто так они смогли так быстро разрастись."
10036110-122 = "Контракты священны. Ты сам меня этому научил, Сенсей."
10036110-123 = "Обстоятельства меняются, и люди могут пойти друг другу навстречу..."
10036110-124 = "...но кинуть подрядчика на деньги — непростительный поступок!"
10036110-125 = "Так что, учитывая это, Сенсей..."
10036110-126 = "[s] «А, если дело в этом, я помогу тебе чем смогу.»"
10036110-127 = "Отлично. Тогда решено."
10036110-128 = ""
10036110-130 = ""
10036110-131 = ""
10036110-132 = "За этими Бандитами в Шлемах!"
10036110-134 = "Похоже, лето ещё не совсем закончилось..."
10036110-135 = "Снаружи у Шейсайд"
