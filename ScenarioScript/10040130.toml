[translation]
10040130-1 = "Послесловие;Когда все уснули"
10040130-2 = "Эм..."
10040130-3 = "Я больше не могу пить..."
10040130-4 = "Фуфу... В следующем году... я раскрашу мир ещё ярче..."
10040130-5 = ""
10040130-8 = ""
10040130-9 = ""
10040130-10 = "О? Ты не спишь?"
10040130-11 = "Не хочешь поспать ещё? Ты ведь две ночи подряд работала без сна."
10040130-12 = "Я немного отдохнула, но теперь никак не могу снова уснуть."
10040130-13 = "И мне очень хочется исправить уязвимости в безопасности сервера."
10040130-14 = "Ещё нужно установить меры защиты, чтобы Коюки больше не могла так легко выдавать себе доступ..."
10040130-15 = "Фуфу. Ты и правда очень старательная."
10040130-16 = ""
10040130-18 = ""
10040130-19 = "Можно задать тебе один вопрос?"
10040130-20 = "Что такое?"
10040130-21 = "Почему ты не вступила в Семинар?"
10040130-22 = "Почему ты спрашиваешь об этом именно сейчас?"
10040130-23 = "Я задумалась об этом, пока сегодня проводила время со всеми. Веритас — клуб, созданный, чтобы противостоять контролю и продвигать свободу информации для всех, верно?"
10040130-24 = "При этом ты совсем не похожа на остальных беззаботных и игривых участниц Веритас. И ещё ты занимаешься серверами Миллениум и кибербезопасностью."
10040130-26 = "Разве эти две вещи противоречат друг другу? Свобода не означает вседозволенность. Свободная жизнь полна ответственности."
10040130-27 = "Скорее... для меня попытка контролировать выбор других и брать на себя ответственность за него уменьшает изначальную ценность истины."
10040130-28 = "Как президент Рио?"
10040130-29 = "Если приводить пример."
10040130-30 = "Сейчас нас трудно назвать лучшими подругами, но было время, когда наши ценности совпадали."
10040130-31 = "Это было тогда, когда мы втроём, включая Химари, вместе решали различные проблемы Миллениум."
10040130-32 = "Рио и Химари? Они работали вместе?"
10040130-33 = "Я сказала, что они работали вместе, а не что они ладили."
10040130-34 = ""
10040130-36 = ""
10040130-37 = "Ну... пожалуй, их отношения на самом деле были не такими уж плохими."
10040130-38 = "Рио бывает немного замкнутой, когда речь заходит о её чувствах."
10040130-39 = "И Химари такая же."
10040130-40 = "Возможно, Химари даже втайне надеется помириться с Рио."
10040130-41 = "А. Только не говори ей, что я это сказала. Она устроит скандал."
10040130-42 = "Фуфу, можешь не переживать. Уж на это мне здравого смысла хватит."
10040130-44 = "*зевает* Который час..."
10040130-45 = "Обслуживание сервера более-менее закончено. Пойдём обратно?"
10040130-46 = "Спасибо тебе за всю сегодняшнюю работу."
10040130-47 = "Какую ещё работу? Обычное дело."
10040130-48 = "Завтра, послезавтра, в следующем году... Будут ли такие дни продолжаться всегда?"
10040130-49 = "...Никто не может сказать наверняка. Но я в это верю."
10040130-50 = "Как секретарь, которая записывает каждую мелочь и каждое изменение в жизни, я не могу придумать ничего, чего хотела бы сильнее, чем продолжение этих мирных дней."
10040130-52 = "Спасибо тебе за всё, Чихиро."
10040130-53 = "И в этом году надеюсь на твою поддержку."
