[translation]
3003-1 = "Тень консервов, часть 3"
3003-3 = ""
3003-4 = "Они обычно... так раздуваются?"
3003-5 = "Ну, она уже довольно долго лежит."
3003-6 = "Ты ведь не собираешься... это есть?"
3003-7 = "Не думаю, что это нормально! Совсем не думаю!"
3003-9 = "Э-Это вообще не нормально! В-Внутри, наверное, запечатаны ч-части какого-нибудь существа...!"
3003-10 = "Н-Например щупальца к-кракена... или х-хвост гигантской м-м-морской змеи..."
3003-11 = "Или ещё какого-нибудь у-ужасного существа, о котором мы не знаем!"
3003-12 = "Это серийные армейские пайки с фабрики. Сильно сомневаюсь, что там консервируют мифических существ."
3003-13 = "Д-Давайте посмотрим состав."
3003-14 = ""
3003-16 = ""
3003-17 = "«Наша смесь морепродуктов в соусе изготовлена из свежих цельных морепродуктов, чтобы подчеркнуть их вкус и текстуру»."
3003-18 = "«Содержит сельдь, сардины, осьминога и прочее. Отдельная пастеризация не проводилась, чтобы сохранить уникальный вкус морепродуктов»."
3003-19 = "Короче говоря, морепродукты внутри этой банки, скорее всего, сгнили или перебродили до пугающей степени."
3003-20 = "Фу. Гадость."
3003-21 = "То есть банка так раздулась из-за рыбного газа?"
3003-22 = "Значит, если быть неосторожными, она может взорваться. Рыбная газовая бомба."
3003-24 = "...Пожалуйста, не называй её так."
3003-25 = "Давайте просто отнесём её подальше и выбросим."
3003-26 = ""
3003-28 = ""
3003-30 = "Нет, стой!"
3003-31 = ""
3003-34 = ""
3003-36 = "Если Саки права, эта банка со смесью морепродуктов — взрывное устройство, которое при малейшем воздействии выпускает биохимические газы."
3003-37 = "Если безответственно её выбросить, уборщик или случайный прохожий может серьёзно пострадать."
3003-38 = "Н-Ну и что ты предлагаешь? Съесть её?!"
3003-39 = "Задачи по обезвреживанию боеприпасов, включая неразорвавшиеся снаряды и СВУ, тоже входят в обязанности SRT."
3003-40 = "Мы не можем позволить этой отвратительной биобомбе попасть в чужие руки."
3003-42 = "Мияко, ты что..."
3003-43 = "Ты сейчас серьёзно?!"
3003-44 = "Наш долг — правильно обезвредить эту банку морепродуктов!"
3003-46 = "С этого момента начинаем операцию «Тухлая селёдка»! Цель — безопасно утилизировать банку со смесью морепродуктов."
3003-47 = "Нужно привести взрывное устройство в нерабочее состояние, не вызвав детонацию."
3003-48 = "Поскольку большая часть пахучих компонентов рыбы растворяется в воде, начнём с медленного выпуска газа из банки под водой."
3003-49 = "Ага, удачи. Делайте что хотите."
3003-50 = "Верно, Саки. Рассчитываю на тебя."
3003-51 = ""
3003-53 = ""
3003-54 = "С какого хрена ты решила, что это буду делать я?"
3003-55 = "Из нас только ты прошла подготовку по обезвреживанию взрывных устройств, Саки."
3003-56 = "Неправда. Моэ тоже проходила."
3003-57 = "Ну да, но... Моэ и взрывчатка..."
3003-59 = ""
3003-61 = "Хи-хи-хи. Ага, именно. Почему бы не поручить это мне, Саки?"
3003-63 = "...Справедливое замечание."
3003-64 = "Прости. Другого выхода просто нет."
3003-65 = "Но не волнуйся! Мы поддержим тебя всем, чем сможем."
3003-67 = "М-Мы все в э-этом вместе!"
3003-68 = "Мы правда устраиваем такой спектакль из-за одной банки морепродуктов?"
3003-69 = ""
3003-71 = ""
3003-72 = "Ну... Вообще-то я тоже немного нервничаю."
3003-73 = "Сначала проделай совсем маленькое отверстие в дне банки, чтобы газ начал медленно выходить."
3003-74 = "А-А если она взорвётся?"
3003-76 = "Быть облитой токсичной жидкостью...! *тяжело дышит* *тяжело дышит*"
3003-77 = "Эм..."
3003-78 = "Стой, Саки. В раздутой банке отверстие нужно делать у самого толстого края дна, чтобы давление не разорвало корпус."
3003-79 = "Я-Я не могу смотреть. У меня п-плохое предчувствие...!"
3003-81 = "На этом этапе почему бы просто не дать ей взорваться?! *тяжело дышит* *тяжело дышит*"
3003-82 = "Заткнись, извращенка! Я не могу сосредоточиться!"
3003-83 = ""
3003-86 = "Ой."
3003-87 = ""
3003-91 = "Банка с морепродуктами взорвалась и вызвала огромную биологическую катастрофу в парке Косаги."
3003-93 = "Обломки удалось убрать, но ещё долго после этого от членов отряда RABBIT несло тухлым соусом из морепродуктов..."
3003-94 = "Тень консервов"
