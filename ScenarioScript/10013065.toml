10013065-37 = ""
10013065-38 = "Нет-нет-нет! Как нас вообще так оттеснили?!"
10013065-39 = "Я уже не та, что в прошлый раз!"
10013065-40 = "Я усилила нас бойцами Банды Курокамэ и даже наняла наёмников из ЧВК Кайзер на всякий случай... Как это вообще произошло?!"
10013065-41 = "[s] «(Из ЧВК Кайзер...?)»"
10013065-42 = "Э-Насчёт этого, босс! Среди гостей, которые приходили вчера вечером... была одна в лисьей маске..."
10013065-43 = "Я попыталась взять с неё плату за стул, а она на меня напала..."
10013065-44 = "И победила половину бойцов ЧВК Кайзер..."
10013065-45 = "Почему ты мне не сказала?! Ты не знаешь, что в таких ситуациях важно докладывать и принимать меры?!"
10013065-46 = "[s1] «Кажется, я уже видел что-то похожее...»\n[s2] «Кстати... кто была та гостья в лисьей маске?»"
10013065-50 = "Хорошо, вот и всё, Датэ Мяуру!"
10013065-51 = "Да! Справедливость и ниндзя всегда побеждают! Нин-нин!"
10013065-52 = "У-Угх! Гр-р...! Ладно, тогда..."
10013065-53 = ""
10013065-55 = ""
