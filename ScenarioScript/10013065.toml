10013065-70 = ""
10013065-71 = "Слышала, ты расширяешь франшизы курорта «Потерянный рай» по всему архипелагу..."
10013065-72 = "Какая наглость! Мне нравится твой подход! Как насчёт заключить франчайзинговый контракт?"
10013065-73 = ""
10013065-75 = ""
10013065-76 = "Тебе ведь нужны деньги, верно?"
10013065-77 = "У меня есть бойцы Банды Курокамэ. Сможешь использовать их и вести бизнес эффективнее!"
10013065-78 = ""
10013065-80 = ""
