[translation]
1002203-1 = "Бумажная работа со старостой"
1002203-2 = "После переписки с Хиной в MomoTalk я нашёл номер отеля, где она остановилась."
1002203-7 = "Комната Хины"
1002203-8 = ""
1002203-9 = ""
1002203-10 = "А? Сенсей?"
1002203-11 = "Что привело тебя сюда так внезапно?"
1002203-12 = "[s1] «Я пришёл помочь тебе с этим загруженным днём.»\n[s2] «Приехать на пляж только ради работы — пустая трата времени.»"
1002203-13 = "Тебе не стоило проделывать весь этот путь только ради этого."
1002203-14 = "Тебе не стоило проделывать весь этот путь только ради этого."
1002203-15 = "Я ценю этот жест, но так ты только всё усложняешь, Сенсей. Мы здесь не для развлечений, даже если это место отдыха."
1002203-16 = "Может, я и взяла перерыв от работы в Дисциплинарном комитете, но задачи, которые нужно выполнить, продолжают накапливаться."
1002203-17 = "Пока мы их не закончим, ничего другого сделать не получится."
1002203-18 = "И к тому же я не понимаю, что ты имеешь в виду под «пустой тратой». Я просто..."
1002203-19 = "[s] «Но мы же в купальниках! Вот что зря пропадает!»"
1002203-20 = "А-А?"
1002203-21 = "Мы просто одеты по случаю. Это не значит, что была какая-то особая причина обязательно надевать купальник."
1002203-22 = "[s3] «Тогда я тебе помогу!»\n[s4] «Вместе закончим быстрее! А потом пойдём веселиться!»"
1002203-23 = "Ты поможешь мне, Сенсей?"
1002203-24 = "Ты поможешь мне, Сенсей?"
1002203-25 = "Ты и правда странный."
1002203-26 = "Не понимаю, что тебя к этому побуждает, но ладно."
1002203-27 = "Если для тебя это настолько важно, я с благодарностью приму твою помощь."
1002203-28 = ""
1002203-29 = ""
1002203-31 = ""
1002203-32 = ""
1002203-33 = "[ns] «Эм... Хина? Это...?»"
1002203-34 = "Хм? Это наша работа на сегодня."
1002203-35 = "Планы управления Дисциплинарного комитета на вторую половину года, третий этап отчёта по проекту обслуживания дорог Геенны, отчёт о деятельности клубов, протоколы совещаний... И вот это."
1002203-36 = "Можешь для начала разделить всё на документы, требующие утверждения, и те, которым оно не нужно?"
1002203-37 = "О, не волнуйся, Сенсей. Там ещё очень много."
1002203-38 = "Сегодня я как следует познакомлю тебя со своей работой, как ты и хотел."
1002203-41 = "Стоило закончить один документ, как появлялся другой. Разобравшись с ним, я получал следующий. Я отчаянно боролся с нескончаемым потоком бумаг."
1002203-42 = "И примерно через пять часов..."
1002203-45 = "Так, это должен быть последний."
1002203-46 = "[s] «Я наконец СВОБОДЕН от бумажного ада!»"
1002203-47 = "А, да. Ты прав."
1002203-48 = "Хорошая работа, Сенсей. Благодаря тебе я закончила быстрее, чем ожидала."
1002203-49 = "К счастью, мы даже успеем поужинать вовремя."
1002203-50 = "[s] «А теперь можно идти веселиться!»"
1002203-51 = "Ты всё ещё об этом? Ты ведь не шутишь?"
1002203-52 = "Но уже так поздно."
1002203-53 = "И что важнее, с кем-то вроде меня всё равно не получится нормально повеселиться..."
1002203-54 = "[s5] «Уверен, получится. Мы же на пляже!»\n[s6] «Я так ждал возможности побывать с тобой на пляже!»"
1002203-55 = "Ты так говоришь, но..."
1002203-56 = "Ты так говоришь, но..."
1002203-57 = "Необязательно так суетиться..."
1002203-58 = "(Мне и того достаточно, что мы смогли вот так вместе закончить работу...)"
1002203-59 = "[s] «Хинатюрка?»"
1002203-60 = "Хватит так коверкать моё имя. Ты только усложняешь всё."
1002203-61 = "Ну и всё равно уже слишком поздно. Забудь о пляже."
1002203-62 = "Это, конечно, слабая замена, но у нас ещё есть время посидеть в гостиной."
1002203-63 = "Итак, Сенсей... Что будем делать с ужином?"
1002203-64 = "[s] «Тогда позволь мне тебя сопровождать!»"
1002203-65 = "Ты опять слишком громкий..."
1002203-66 = ""
1002203-67 = ""
1002203-68 = ""
1002203-69 = "...но ладно. Я доверюсь тебе, Сенсей."
