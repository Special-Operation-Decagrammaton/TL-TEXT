[translation]
1000005-1 = "Настоящий лидер"
1000005-2 = "Перед кинотеатром №8"
1000005-3 = ""
1000005-4 = "Я пришёл на двадцать минут раньше, но Ару уже была здесь."
1000005-5 = "Хе-хе. Сенсей точно впечатлится, если я как сопровождающая приду первой..."
1000005-6 = ""
1000005-7 = ""
1000005-8 = "[s] «Давно ты здесь, Ару?»"
1000005-9 = "А! Н-Не пугай меня так!"
1000005-10 = "А-А, это всего лишь ты, Сенсей. Ты так внезапно появился, я испугалась."
1000005-11 = "[s] «Ты пришла ещё раньше меня.»"
1000005-12 = "Хе. Я начальник. Какой пример я подам сотрудникам, если буду лениться?"
1000005-13 = "Настоящий лидер первым подаёт хороший пример."
1000005-14 = "[s] «Мне нравится, насколько ты серьёзно к этому относишься, Ару.»"
1000005-15 = "Да ладно, н-не обязательно говорить это вот так...!"
1000005-16 = "В конце концов, это я пригласила тебя посмотреть фильм."
1000005-18 = "[s] «“Война верности 3: Мафия против якудза — спортивный день”?»"
1000005-19 = "Это новейший фильм серии «Война верности». Она реалистично показывает преступный мир."
1000005-20 = "По сюжету главный герой побеждает героев прошлого фильма во время спортивного дня и становится настоящим лидером."
1000005-21 = "Думаю, этот фильм поможет нам больше узнать о лидерстве."
1000005-22 = "[s1] «Думаешь?»\n[s2] «Ты уверена, что ты не просто поклонница?»"
1000005-23 = "Хмф. Мог бы хотя бы скрыть свой восторг."
1000005-24 = "Хмф. Мог бы хотя бы скрыть свой восторг."
1000005-25 = "Посмотрим, что скажешь после фильма."
1000005-26 = "Пойдём, Сенсей. Заходим."
1000005-29 = "Сюжет фильма был полон напряжения и неожиданных поворотов."
1000005-36 = "Экшен, напряжение, эмоции и печаль заставили меня буквально вспотеть от волнения. Я настолько втянулся, что потерял счёт времени."
1000005-38 = "Сенсей! Сенсей! Фильм был невероятный, правда?"
1000005-39 = "Тонкость актёрской игры была потрясающей, а сюжет — идеальным!"
1000005-40 = "Даже я удивилась выбору героя в конце."
1000005-41 = "[s3] «Ты о том моменте, когда нужно было сбрызнуть лимонным соком? Да...»\n[s4] «Я совсем этого не ожидал!»"
1000005-42 = "А когда карааге взорвалось, у меня сердце бешено колотилось. Я вообще не понимала, ЧТО будет дальше! ♪"
1000005-43 = "А когда карааге взорвалось, у меня сердце бешено колотилось. Я вообще не понимала, ЧТО будет дальше! ♪"
1000005-44 = "Хе. Он оставался верен себе и шёл вперёд, что бы ни случилось."
1000005-45 = "Вот о чём я."
1000005-46 = "Быть лидером и настоящим преступником — не такие уж разные вещи."
1000005-47 = "[s] «Не забывай о командной работе. Он до конца остался со своими товарищами.»"
1000005-48 = "Да. Преступники могут нарушать правила, но никогда не бросят друга или товарища, с которым связаны клятвой."
1000005-49 = "У каждого своё представление о том, что нужно лидеру."
1000005-50 = "По-моему, настоящее лидерство требует упорства и убеждённости."
1000005-51 = "Вот каким лидером я хочу стать."
1000005-52 = "[s] «Я верю в тебя, Ару.»"
1000005-53 = "А?!"
1000005-54 = "[s] «По-моему, ты уже такой лидер.»"
1000005-55 = "Серьёзно, Сенсей... Как ты вообще говоришь такое с невозмутимым лицом?"
1000005-56 = "Ну, я пока не уверена, что согласна..."
1000005-57 = "...но странно. Стоит услышать это от тебя, и мне кажется, что я действительно смогу."
1000005-58 = "Хе-хе, мне ещё далеко до цели, но я могу воплотить эту мечту."
1000005-59 = "И сделаю это с твоей помощью, Сенсей!"
