[translation]
90001190-1 = "Эпизод 19;Стальной континент"
90001190-2 = ""
90001190-3 = ""
90001190-4 = "Ну-ну-ну. Мне стало так любопытно, чем занимаются наши друзья, а вы всё ещё здесь."
90001190-5 = "[s] «...!»"
90001190-6 = ""
90001190-7 = ""
90001190-8 = ""
90001190-9 = "Принцесса. Нет, Алиса. Иди сюда..."
90001190-10 = "Что-то случилось, Кей?"
90001190-11 = "Инстинкт подсказывает мне, что показываться этим детям будет опасно."
90001190-12 = ""
90001190-14 = ""
90001190-15 = ""
90001190-16 = "З-З-З-Здравствуйте! И будьте осторожны! М-Мы сейчас собираемся..."
90001190-17 = "...с-с-сделать с вами кое-что о-очень страшное!"
90001190-18 = "Хотя у меня всё ещё есть серьёзные сомнения в необходимости этого сообщения, Соф настояла."
90001190-19 = "Ага! Так что прямо сейчас мы..."
90001190-20 = ""
90001190-22 = ""
90001190-24 = "...объявляем вам войну! Всем вам!"
90001190-25 = ""
90001190-26 = ""
90001190-27 = "Объявление..."
90001190-28 = "...войны?"
90001190-29 = ""
90001190-30 = "Давайте их выслушаем. Но прежде, похоже, вы наконец завершили Нецаха?"
90001190-31 = ""
90001190-34 = ""
90001190-35 = "Н-Нет! Нецах, наш дорогой Нецах, был завершён уже давным-давно!"
90001190-36 = "Ага! Мы просто немного прятали Нецаха, чтобы он смог стать Стальным континентом!"
90001190-37 = "Ах, конечно, вам не дано осознать, каким несравненно выдающимся достижением это было."
90001190-38 = "Для людей вашего ничтожного уровня это просто образ жизни, но какая жалость, какая жалость. Мне вас почти жаль."
90001190-39 = ""
90001190-40 = "Стальной континент...?"
90001190-41 = "О-хо? Даже Цукацуки Рио не догадалась? Что ж, опять же, это вполне закономерно."
90001190-42 = "Отличная работа, Эйн! Как и ожидалось! Только посмотрите на неё — совершает невозможное так, будто это обычный день! Вот что значит быть нами!"
90001190-43 = "Э-Эхехе. Спасибо, Соф. Я продолжу стараться...!"
90001190-44 = "Стальной континент! Да!"
90001190-45 = "Это эволюционировавшая форма Н-Нецаха..."
90001190-46 = "И континент из металла, способный бесконечно расширяться, используя свою Запретную силу, чтобы преобразовывать любую материю, которой коснётся!"
90001190-47 = "[s] «Металлический континент, который может расширяться...?»"
90001190-48 = "Позвольте объяснить так, чтобы даже такой простак, как вы, смог понять."
90001190-49 = "Если описывать Стальной континент вашим ограниченным словарным запасом, то это сила Безымянных богов."
90001190-50 = "И-и одна из главных особенностей этой силы... в том, что она способна фундаментально изменять состав материи..."
90001190-51 = "А теперь вопрос на засыпку! Что произойдёт, если структура, созданная этой силой, соприкоснётся с окружающей материей?"
90001190-53 = "Невозможно...!"
90001190-54 = "Она может... изменять сам состав того, с чем соприкасается?!"
90001190-56 = "Отлично! Правильно. Всё, что касается Стального континента, становится частью Стального континента!"
90001190-57 = "Это непобедимый континент с ненасытным аппетитом, способный расширяться сколько ему угодно!"
90001190-58 = "Да-да! А если ступить на Стальной континент без подготовки..."
90001190-59 = "...в-вы мгновенно сольётесь со Стальным континентом! Навсегда!"
90001190-60 = "Эйн? Соф? Ор? Вам нужна моя помощь?"
90001190-61 = "С-Старшая сестра?! Нет, всё хорошо! Не беспокойтесь об этом! Мы сами со всем справимся!"
90001190-62 = "Разве вам не любопытно, насколько далеко сможет распространиться Стальной континент? Вот вам то, что вы называете «сюжетным поворотом»! Нам тоже любопытно!"
90001190-63 = "П-Потому что мы не знаем пределов Нецаха... пределов Стального континента...!"
90001190-64 = "Именно! Не терпится увидеть, насколько огромным он сможет стать!"
90001190-65 = "Наш Нецах... Стальной континент поглотит всё на своём пути и будет расти, расти и расти!"
90001190-66 = "И совсем скоро Кивотос разделит ту же судьбу!"
90001190-67 = "Разве не чудесно? Разве не невероятно? Вы настолько потрясены, что даже слов не находите?!"
90001190-68 = "[s] «...Я хочу спросить кое-что.»"
90001190-69 = "Что именно? Раз уж мы объявляем войну, в качестве особой услуги ответим на ваш вопрос."
90001190-70 = "[s1] «Какова ваша цель — зачем превращать Кивотос в Стальной континент?»\n[s2] «Вы пытаетесь воскресить Декаграмматона?»"
90001190-73 = "Т-Ты... взрослый! Как ты смеешь произносить имя владыки? Не оскверняй бога десяти божественных букв! Ты недостоин!"
90001190-74 = "...Невероятно. Поистине невероятно. Вы снова и снова подтверждаете свою репутацию, Сенсей из Шале."
90001190-75 = "П-Просто подождите... Вот увидите...! Когда придёт время, никто больше не посмеет так легкомысленно говорить о воле владыки...!"
90001190-76 = "Да! Мы превратим ваше «я не верю» в «я не хочу в это верить»!"
90001190-77 = "Мы не проявим ни капли милосердия, как бы вы ни умоляли! Потому что через три дня..."
90001190-78 = "...Кивотоса больше не станет! Стальной континент поглотит всё!"
90001190-79 = ""
90001190-81 = ""
90001190-82 = ""
90001190-85 = "[ns] «Через три дня...?»"
90001190-86 = ""
90001190-87 = "...Если бы подобное сказал кто-то другой, я бы просто списала это на бред."
90001190-88 = "Но когда это говорят инженеры Декаграмматона, мы не можем относиться к этому легкомысленно."
90001190-89 = "Что нам делать? Если мы без подготовки войдём на Стальной континент..."
90001190-90 = "Да. Они сказали, что мы станем частью Стального континента и уже никогда не вернёмся."
90001190-91 = ""
90001190-93 = ""
90001190-94 = ""
90001190-95 = "Вероятность этого практически нулевая. Скорее всего, Стальной континент способен преобразовывать только неорганическую материю."
90001190-96 = "[s] «Кей!»"
90001190-97 = "Точно. Почему вы с Алисой спрятались, когда появилась эта троица?"
90001190-98 = "...Мне показалось, что если мы сейчас встретимся с этими тремя, случится что-нибудь хлопотное."
90001190-99 = "В любом случае, я слышала весь разговор, и мой вывод..."
90001190-100 = "...Это нелепая шутка."
90001190-101 = "П-Правда, Кей?"
90001190-102 = "Да, Принцесса... Алиса. Это всего лишь деградировавшее применение силы Безымянных богов."
90001190-103 = "Ого! На тебя можно положиться! Так вот как ощущается, когда баланс меняют для врага, ставшего союзником!"
90001190-104 = "Нет. Обычно в таких случаях они, наоборот, становятся слабее..."
90001190-105 = "А, так ты тоже... знаешь такие игровые клише, Кей-Кей... Я так рада..."
90001190-106 = "...? А-Ай!"
90001190-108 = "Как уже сказал Сенсей, одна из характерных сил Безымянных богов — реконструкция материи."
90001190-109 = "Да. Протокол ATRAHASIS работал по схожему принципу."
90001190-110 = "Да, верно. В любом случае, сила Безымянных богов способна фундаментально менять саму взаимосвязь между волнами и материей."
90001190-111 = "Я интерпретировала это как «сбор» и «преобразование» данных..."
90001190-112 = "Принципиальной разницы нет. В конечном счёте материя — это энергия, а энергия имеет значение."
90001190-113 = "Стальной континент и Нецах, провозглашённый седьмым пророком... В них нет ничего особенно примечательного."
90001190-114 = "Даже по сравнению с протоколом ATRAHASIS это довольно примитивно. Однако..."
90001190-115 = "[s] «Что это?»"
90001190-116 = "Полагаю, реконструкцию материи в таком огромном масштабе всё же нельзя просто отмахнуть."
90001190-117 = "И ещё тот факт, что у нас нет способа нанести ответный удар по Стальному континенту."
90001190-118 = "...Тц."
90001190-120 = ""
90001190-121 = "Каков наш план действий?"
90001190-122 = "Даже если предположить, что теория Кей верна и Стальной континент воздействует только на неорганическую материю, проблем всё равно остаётся множество."
90001190-123 = "Верно. Для начала полагаю, что мои AMAS, а значит и Кей, не смогут к нему приблизиться."
90001190-124 = "Мой Аби-Эшух тоже окажется бесполезен."
90001190-125 = ""
90001190-126 = ""
90001190-127 = "Эм, случайно это не означает ещё и то, что мы не сможем использовать никакое оборудование... или носить одежду?"
90001190-128 = "И-и-и?! То есть нам всем придётся идти туда ГОЛЫМИ?!"
90001190-129 = "А?! Е-Если так подумать...!"
90001190-131 = "А в чём проблема? Я её не вижу."
90001190-132 = "Эйми, нет. Ты здесь единственная, кто так думает."
90001190-134 = "Э-Э-Э-Это уже слишком для меня!"
90001190-135 = ""
90001190-137 = ""
90001190-138 = ""
90001190-140 = ""
90001190-141 = "Прекрасная возможность продемонстрировать моё идеальное тело горничной. Что думаете, Сенсей?"
90001190-142 = ""
90001190-145 = "[ns] «Я-Я?!»"
90001190-146 = "А. Однако я не хочу демонстрировать себя никому, кроме Сенсея. Поэтому меняю позицию. Это абсолютно точно проблема."
90001190-147 = "Т-Токи...?"
90001190-148 = "Если немного отойти назад, разве под всем этим не скрывается куда более фундаментальная проблема?"
90001190-149 = "Разумеется, подвергать тело этой хрупкой красавицы экстремальным условиям — колоссальная проблема."
90001190-150 = "Однако, думаю, куда более насущная проблема — Многомерный барьер, защищающий Стальной континент. Сейчас мы даже не можем попасть в эту область."
90001190-151 = "Важное замечание. Спасибо, Химари."
90001190-153 = "Ч-Что нам делать? В видеоигре мы могли бы найти лазейку или маршрут, обходящий препятствие..."
90001190-154 = "(Лазейка...? Обходной путь...?)"
90001190-155 = "...!!"
90001190-156 = ""
90001190-159 = "Эм, т-тогда... разве не должен быть какой-нибудь чёрный ход?"
90001190-160 = "Чёрный ход, говоришь? Возможно, но обычно такое хакер ищет в коде..."
90001190-161 = "Д-Да. Но если есть физический чёрный ход..."
90001190-163 = "Как ты пришла к такому выводу?"
90001190-165 = ""
90001190-166 = "Д-Д-Дело в том...! Они говорили, эм... что собирают огромное количество ресурсов, да...? Так что, может быть...!"
90001190-167 = "Ах!"
90001190-168 = "Верно... Ресурсы, собранные в тундре, отправляли в район Нецаха."
90001190-169 = "Точно. Они даже построили железные дороги и объекты для перевозки и переработки ресурсов, верно?"
90001190-170 = "Да. И оставили охрану защищать эти железные дороги."
90001190-172 = "Если Нецах способен превращать любую неорганическую материю в часть Стального континента, то ему незачем было бы очищать и перерабатывать ресурсы таким образом."
90001190-173 = "Именно. Им бы даже не пришлось изначально собирать ресурсы. Если всё работает так, как они говорят, ему достаточно было бы поглощать окружение и расти."
90001190-174 = "Значит, они собирали, очищали и перерабатывали ресурсы, чтобы... возможно, выражение не совсем верное, но чтобы эволюционировать Нецаха."
90001190-175 = "Можно вполне обоснованно предположить, что всё это делалось ради эволюции Нецаха в Стальной континент."
90001190-176 = "И наконец, если предположить, что переработанные ресурсы использовались для эволюции Нецаха..."
90001190-177 = "Тогда где-то должен быть обходной маршрут... на который не действует реконструкция материи."
90001190-179 = "Ого! Юзу, ты потрясающая. Это буквально режим UZQueen!"
90001190-180 = ""
90001190-181 = "По сути, раз для эволюции Нецаха требовалось ввозить ресурсы, логично исследовать способ, которым их доставляли."
90001190-182 = "Эм... Если говорить игровыми терминами... То есть... ты предлагаешь найти короткий путь, да?"
90001190-183 = "Именно, Момой. Возможно, теперь мне следует называть тебя «Мудрая Момой»."
90001190-184 = "А? Я-я не совсем поняла... но ты меня хвалишь, да? Эхе! Ну конечно! Вот какая я, когда становлюсь серьёзной!"
90001190-185 = "Поправлюсь. Запишу тебя как «Момой-Которая-Казалась-Мудрой-Но-В-Итоге-Начала-Хвастаться»."
90001190-186 = ""
90001190-188 = ""
90001190-189 = "Это название не стало слишком длинным и слишком обидным?! Я теперь часть какой-то странной системы титулов?!"
90001190-191 = ""
90001190-192 = "Похоже, с дальнейшим планом действий мы в основном определились."
90001190-193 = "Мы вернёмся в тундру и сосредоточимся на поиске обходного маршрута, которым они пользовались для доставки ресурсов."
90001190-194 = "Госпожа Рио, у меня вопрос. А что насчёт связи с Миллениумом или другими местами, чтобы запросить поддержку?"
90001190-196 = ""
90001190-197 = "...Я об этом думала, но времени нет."
90001190-198 = "Судя по их объявлению войны, у нас около трёх дней до того, как Стальной континент поглотит весь Кивотос."
90001190-199 = "Если учесть время на звонки, подбор людей, административные процедуры с сохранением секретности, а также их физическую доставку сюда..."
90001190-200 = "А, точно. Нам ведь только на дорогу сюда понадобилось почти три дня...?"
90001190-201 = "Да. Если смотреть реалистично, что бы мы ни делали, времени нет."
90001190-203 = "Вам нужен особый отряд, который гибок и всегда доступен, независимо от условий и процедур."
90001190-204 = "Похоже, примерно так до сих пор и выглядела моя жизнь."
90001190-206 = "Эм, Рио? Тогда что же нам делать...?"
90001190-207 = "Да, если воспользоваться выражением, которое тебе подойдёт..."
90001190-208 = "...на этот раз мы будем спасать мир."
90001190-209 = "Вместе с тобой, Рио?"
90001190-210 = ""
90001190-212 = ""
90001190-213 = ""
90001190-214 = ""
90001190-215 = "(Как вообще принято реагировать в такой ситуации...?)"
90001190-216 = "(...)"
90001190-217 = ""
90001190-219 = ""
90001190-220 = ""
90001190-221 = "Да. Буду благодарна, если ты будешь считать это именно так."
90001190-222 = ""
90001190-224 = ""
90001190-225 = "Та-дам! Теперь Рио официально стала спутницей Арис! Лимит группы расширен!"
90001190-226 = "(Какое облегчение. Похоже, это была приемлемая реакция.)"
90001190-227 = ""
90001190-229 = ""
90001190-230 = ""
90001190-231 = "Президент, что думаете?"
90001190-232 = "Дам ей 70 из 100. Для неё это было очень впечатляюще."
90001190-233 = ""
90001190-235 = ""
90001190-236 = ""
90001190-237 = "[ns3] «Тогда выдвигаемся?»\n[ns4] «Все собрались? Проверьте, ничего не забыли!»"
90001190-240 = "Сенсей? Мы ведь не на беззаботный пикник собрались..."
90001190-241 = "Ох-ох. Оставь их. В конце концов, чрезмерное напряжение может снизить шансы на успех."
90001190-242 = "Пока мы не теряем из виду цель, немного снять напряжение — совсем не плохая идея."
90001190-243 = "Госпожа Рио, я согласна с президентом Химари. Когда всё станет серьёзно, поводов нервничать будет достаточно."
90001190-244 = "В-Вот как? Обычно всё именно так и происходит?"
90001190-245 = "Да. Я уверена, что лучшее ощущение — спасать мир с тем же настроем, с каким выходишь на утреннюю прогулку."
90001190-247 = "Точно! Большинство групп, спасающих мир, начинают с простых заданий — например, выполоть сорняки или убраться в комнате!"
90001190-248 = "...Может, тебе стоит иногда применять такой подход и к уборке клубной комнаты."
90001190-249 = "А-А?! В этот раз я вообще-то вынесла мусор!"
90001190-250 = "А посуду помыла? Пропылесосила?"
90001190-251 = "Буэ."
90001190-253 = "Всё хорошо, Момой! Арис пропылесосила!"
90001190-254 = "Арис, ничего не хорошо. Она становится только хуже именно потому, что ты её постоянно балуешь и всё ей позволяешь."
90001190-255 = "Я-я сделала что-то не так...?"
90001190-257 = "Абсолютно нет. На самом деле здесь неправы все остальные, кроме тебя."
90001190-258 = "Я-я тоже...?"
90001190-259 = "...Тебя прощаю."
90001190-260 = "С-Спасибо, Кей-Кей... Хи-хи."
90001190-261 = "Мне кажется или звать меня «Кей-Кей» уже становится нормой?"
90001190-262 = "[s] «Ну потому что ты же Кей-Кей!»"
90001190-263 = "А вы, Сенсей, вообще помолчите!"
90001190-265 = ""
90001190-267 = "Мы можем воспользоваться моим транспортным кораблём. Он не очень большой... но и маленьким его не назовёшь."
90001190-268 = "П-По-моему, он более чем большой, госпожа Рио..."
90001190-269 = "Однако с практической точки зрения лучше иметь возможность взять с собой как можно больше разных припасов."
