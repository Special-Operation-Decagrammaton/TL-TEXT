[translation]
1001906-1 = "Стрельба"
1001906-2 = "Сюда, Сенсей. Хорошо, что ты пришёл."
1001906-3 = "[s] «Что это за место?»"
1001906-4 = "Разве не очевидно? Стрельбище."
1001906-5 = "А цифры, которые я отправила тебе раньше..."
1001906-6 = ""
1001906-8 = ""
1001906-9 = ""
1001906-10 = ""
1001906-11 = "Азуса достала несколько листов бумаги и показала их мне."
1001906-12 = "На листах были напечатаны мишени, усеянные пулевыми отверстиями."
1001906-13 = "[s1] «Ты прислала мне свои результаты.»\n[s2] «Ты довольно хороша.»"
1001906-14 = "Хех."
1001906-15 = "Хех."
1001906-16 = "Не спеши с похвалой. Сегодня у меня результат ниже среднего."
1001906-17 = "Почему я пришла на стрельбище одна?"
1001906-18 = "Глупый вопрос, Сенсей. Я обещала приспособиться к жизни здесь, но это совсем другое."
1001906-19 = "Мир не длится вечно, поэтому всегда нужно быть готовой. От этого я никогда не откажусь."
1001906-20 = "Кроме того..."
1001906-21 = "Здесь... очень хорошие тренировочные условия."
1001906-22 = "Хех. Раньше мне приходилось тренироваться в стрельбе под стальным мостом на окраине."
1001906-23 = "В любом случае, похоже, здесь тренируется не так уж много людей. Почти никого нет."
1001906-24 = "Беспечные. Все до единого."
1001906-25 = "Хватит болтать. Я закончу подход, так что дай мне ещё несколько минут."
1001906-26 = ""
1001906-28 = ""
1001906-30 = "Она сразу перешла к следующей мишени и остановилась перед ней."
1001906-32 = "Азуса подошла к огневому рубежу, глубоко вдохнула и нажала на спуск."
1001906-33 = ""
1001906-41 = "(...)"
1001906-42 = ""
1001906-44 = ""
1001906-45 = "Готово."
1001906-46 = "На этом мой подход закончен. Пойдём обратно, Сенсей."
1001906-47 = "[s3] «Прямо сейчас?»\n[s4] «Если хочешь, можем остаться ещё немного.»"
1001906-48 = "А?"
1001906-49 = "А?"
1001906-50 = "О чём ты говоришь? Зачем мне оставаться дольше?"
1001906-51 = "В смысле, мне здесь нравится."
1001906-52 = "Но теперь..."
1001906-53 = "...теперь это уже не единственное место, которое мне нравится."
1001906-54 = "Мне было куда веселее во всех тех местах, куда ты водил меня в прошлый раз."
1001906-55 = "Ну..."
1001906-56 = "...Да. Вот и всё, что я хотела сказать."
1001906-57 = "Пойдём, Сенсей."
1001906-59 = "Мы с Азусой покинули стрельбище и зашли в ближайшее кафе Momo Friends."
