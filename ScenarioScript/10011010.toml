[translation]
10011010-1 = "Эпизод 1;Начало встречи по обмену"
10011010-4 = "[ns] «Место встречи должно быть где-то здесь.»"
10011010-5 = "Президент, президент! Я нашла нашего господина!"
10011010-6 = ""
10011010-9 = "Вы прибыли, достопочтенный Сенсей."
10011010-10 = "Эм, з-здравствуйте..."
10011010-11 = "[s] «Всем привет. Готовы?»"
10011010-12 = "Я родилась готовой!"
10011010-13 = "Я очень усердно готовилась! Особенно морально!"
10011010-14 = "Ну... я-я утром перед выходом выпила успокоительное, так что..."
10011010-15 = "Ва-ха-ха, Цукуё! Ты вечно такая нервная!"
10011010-16 = "[s] «Ого, Мичиру. Твоему энтузиазму нет предела, да?»"
10011010-17 = "А? Можно и так сказать."
10011010-18 = "Просто наконец появился шанс стать официальным клубом всего лишь за помощь с этой встречей обмена..."
10011010-19 = "Ха-ха! Вы правы, я очень взволнована! Давайте покажем класс!"
10011010-20 = "Я... эм... тоже взволнована... Всё-таки встреча обмена между Хяккияко и академией Генна..."
10011010-21 = "Такие события редкость...! Я прямо чувствую, как колотится сердце."
10011010-22 = "[s] «Знаю. Никогда бы такого не ожидал.»"
10011010-23 = ""
10011010-26 = "(Неделю назад, во время визита в клуб Инь-Ян вместе с Кахо.)"
10011010-30 = "[ns] «Что ж, впечатляет.»"
10011010-31 = "Не теряйте бдительность, достопочтенный Сенсей! Мы ведь говорим о президенте клуба Инь-Ян!"
10011010-32 = "Я слышала слухи... Говорят, президент — чудовищный дракон, который одним словом лишит вас дара речи...!"
10011010-33 = "Изуна защитит вас до последнего вздоха, господин!"
10011010-34 = "Боже. Похоже, тут произошло вопиющее недоразумение."
10011010-35 = ""
10011010-37 = ""
10011010-38 = "О, гости?"
10011010-39 = ""
10011010-42 = ""
10011010-43 = "Привет, Чисэ."
10011010-44 = "А?"
10011010-45 = ""
10011010-47 = ""
10011010-48 = "[ns] «...Чисэ?»"
10011010-49 = ""
10011010-51 = ""
10011010-52 = "(Она безучастно смотрит.)"
10011010-53 = "Внезапная встреча"
10011010-54 = "Поистине приятный сюрприз"
10011010-55 = "Хе-хе, привет, друзья!"
10011010-56 = "[s] «О, эм, привет, Чисэ.»"
10011010-57 = "Боже мой. Это было хайку? Написанное самой Чисэ?"
10011010-58 = "Чисэ... Какая утончённая... Какая очаровательно рассеянная!"
10011010-59 = "[s] «Не знал, что ты настолько популярна, Чисэ.»"
10011010-60 = "Кхм. Сейчас не время."
10011010-61 = "Ния. У нас гости."
10011010-62 = ""
10011010-64 = ""
10011010-69 = ""
10011010-70 = "О-о-о-о."
10011010-71 = ""
10011010-73 = ""
10011010-76 = ""
10011010-77 = "Ага-а-а."
10011010-78 = ""
10011010-80 = ""
10011010-81 = ""
10011010-82 = ""
10011010-83 = ""
10011010-84 = ""
10011010-85 = "Угу. Хорошо."
10011010-86 = "Хотя лицо у вас ничего... Поставила бы зачёт."
10011010-87 = ""
10011010-88 = "Не великолепно, но есть странное очарование."
10011010-89 = "[s] «Простите?»"
10011010-90 = "Ния, прошу. Давайте воздержимся от такого грубого поведения."
10011010-91 = "Хе-хе! Вечно скучная, вечно строгая Кахо."
10011010-92 = "Кхм."
10011010-93 = ""
10011010-95 = ""
10011010-96 = ""
10011010-97 = "Меня зовут Амачи Ния. Я вполне заслуженный, а некоторые даже скажут чрезмерно квалифицированный..."
10011010-98 = "Президент клуба Инь-Ян. Рада знакомству, Сенсей из Шале! ♪"
10011010-99 = "[s] «Мне тоже приятно познакомиться»."
10011010-100 = "Ха-ха-ха! Вы такой же скучный и строгий, как Кахо. Фу."
10011010-101 = "Итак... Тот самый знаменитый Сенсей из Шале."
10011010-102 = "Кто не слышал этих историй? Вы в одиночку удерживаете Кивотос от развала с тех пор, как президент Генерального студсовета взяла и «пуф»."
10011010-103 = "[s] «Это немного преувеличено...»"
10011010-104 = "Ха-ха. Идеально!"
10011010-105 = "Прежде чем перейти к делу, Сенсей, вы знаете, какую роль выполняет клуб Инь-Ян в Хяккияко?"
10011010-106 = "[s1] «Вы вроде студсовета академии Хяккияко.»\n[s2] «Вы занимаетесь административными делами академии Хяккияко.»"
10011010-109 = "Зачёт. Но это довольно поверхностное понимание того, чем мы на самом деле занимаемся."
10011010-110 = "Объединённая академия Хяккияко состоит из множества союзов и объединений."
10011010-111 = "Проще говоря, в Хяккияко нет так называемого студсовета, который держит учеников за горло."
10011010-112 = "[s] «Значит, клуб Инь-Ян...»"
10011010-113 = "Мы не давим ученикам на шею. Мы убрали ногу с подобных обязанностей и вместо этого трудимся над сохранением истории и традиций Хяккияко."
10011010-114 = ""
10011010-116 = ""
10011010-119 = "Или, говоря прямо, выполняем крайне необходимую функцию для такой большой организации: служим её лицом."
10011010-120 = "[s] «Лицом...»"
10011010-121 = "В некотором смысле мы немного похожи на поп-идолов. Устраиваем выступления, выставки, транслируем ежедневные гороскопы клуба Инь-Ян..."
10011010-122 = "А популярность нашей дорогой Чисэ растёт с каждым мероприятием! Правда ведь, Чисэ?"
10011010-123 = "Правда...!"
10011010-124 = "...Правда?"
10011010-125 = "Ния, умоляю. Мы здесь по делу."
10011010-126 = "Маленькая Кахо р-е-в-н-у-е-т? Ничего, у тебя тоже полно тихих поклонников! Обещаю!"
10011010-127 = "Ния, пожалуйста!"
10011010-128 = "Бу-ха-ха! Ладно-ладно."
10011010-129 = "Перейду к делу."
10011010-131 = "Через неделю академии Хяккияко и Генна проведут совместную встречу обмена."
10011010-132 = "[s] «...Генна и Хяккияко?»"
10011010-134 = "Знаю, неожиданно."
10011010-135 = ""
10011010-136 = "Это знаменательное событие стало возможным только благодаря сотрудничеству с одной из главных организаций академии Генна — Обществом Пандемония."
10011010-138 = "В день события мы пригласили студентов Генны в Кинодеревню Водоворота, одну из величайших гордостей Хяккияко..."
10011010-139 = "А чтобы сделать предложение ещё заманчивее, Хяккияко готовит для академии Генна кое-что очень особенное. ♪"
10011010-140 = "И это — принцесса Вараку, из клуба Инь-Ян..."
10011010-141 = "[s] «Кто такая принцесса Вараку?»"
10011010-143 = "Достопочтенный Сенсей, хотите сказать, вы никогда не слышали о принцессе Вараку?!"
10011010-144 = "Среди множества аттракционов и специальных показов Кинодеревни Водоворота принцесса Вараку — едва ли не лучший!"
10011010-145 = "Тем более что главную роль исполняет никто иная, как главная знаменитость Хяккияко — Чисэ! Очарование и миловидность Чисэ способны изменить жизнь!"
10011010-146 = "...?"
10011010-147 = "Мичиру, я ценю энтузиазм, но, пожалуйста, умерьте его."
10011010-148 = "О? Не знала, что вы знакомы с нашей работой. Спасибо, что вы поклонница нашего шоу!"
10011010-149 = "Как вас там звали... Митти Руд?"
10011010-150 = "Меня зовут МИЧИРУ!"
10011010-151 = ""
10011010-153 = ""
10011010-154 = "(Вот я и влипла!)"
10011010-155 = "(Я только что накричала прямо в лицо президенту клуба Инь-Ян!)"
10011010-157 = "Хм. Ладно. В общем, на всё мероприятие у нас запланировано особенно амбициозное представление принцессы Вараку."
10011010-158 = "Но есть небольшие опасения..."
10011010-159 = "[s] «Опасения?»"
10011010-161 = ""
10011010-163 = ""
10011010-164 = "Как вы знаете, студенты Генны довольно свободолюбивы, а некоторые скажут — легкомысленны и вспыльчивы..."
10011010-165 = ""
10011010-167 = ""
10011010-168 = ""
10011010-171 = "Поэтому в очень-очень маловероятном случае, если во время выступления произойдёт инцидент из-за этих... темпераментов..."
10011010-172 = "Хе-хе. Какая интересная мысль. Эм, то есть..."
10011010-173 = "Это было бы ужасно!"
10011010-175 = "Суть в том, что мы просим поддержки Шале, чтобы всё прошло гладко."
10011010-176 = "[s] «Конечно. Если дело в этом, я помогу.»"
10011010-177 = "Что?! Достопочтенный Сенсей?"
10011010-178 = "[s] «Но я хочу кое-что взамен.»"
10011010-179 = "О?"
10011010-180 = "[s3] «Я собираюсь привлечь Исследовательский клуб ниндзюцу к помощи с представлением.»\n[s4] «Я хочу, чтобы вы признали заслуги и усилия Исследовательского клуба ниндзюцу.»"
10011010-183 = "...Исследовательский клуб ниндзюцу?"
10011010-184 = "Достопочтенный Сенсей, прошу подождать! Нельзя вот так запросто требовать подобного!"
10011010-185 = "Сенсей, для таких просьб существуют установленные процедуры."
10011010-186 = ""
10011010-187 = "[ns] «Вот моё предложение. Хотите — принимайте, хотите — нет.»"
10011010-188 = ""
10011010-190 = ""
10011010-191 = "Исследовательский клуб ниндзюцу? Что-то не припоминаю. Что это?"
10011010-192 = "Ха-ха-ха! Клуб изучения ниндзя? И его ещё не признали официально?"
10011010-193 = "Интересно, почему."
10011010-194 = "Исследовательский клуб ниндзюцу никогда не подавал официальную заявку на регистрацию клуба."
10011010-195 = ""
10011010-197 = ""
10011010-198 = "Заявка требует подробной документации: отчёт о результатах работы клуба и три гарантийных письма от других клубов, подтверждающих отсутствие фальсификаций в деятельности клуба."
10011010-199 = ""
10011010-201 = ""
10011010-202 = "В случае Исследовательского клуба ниндзюцу первое требование выполнено благодаря ведению видеоканала «Мичиручи: свиток девушки-ниндзя» и самостоятельно созданной книге по ниндзюцу, отправленной в Комисэн."
10011010-204 = "Ты всё это помнишь, Кахо?"
10011010-205 = "А вот что касается гарантийных писем от других клубов..."
10011010-206 = "Без них заявку отклонят."
10011010-207 = "[s] «Мичиру, это правда?»"
10011010-208 = "Ну... Знаете... Большинство людей всё ещё не понимают ниндзя..."
10011010-209 = "Кивотос просто слишком отстал, чтобы оценить культуру ниндзя!"
10011010-210 = "К-К тому же у меня есть личные обстоятельства... которые..."
10011010-211 = "..."
10011010-212 = "Бу-ха-ха! Как забавно. Ладно, почему бы и нет. Я, Ния, настоящим признаю Исследовательский клуб ниндзюцу официальным клубом."
10011010-213 = "Опять, Ния! Ваше вопиющее пренебрежение процедурами и правилами...!"
10011010-214 = "В-Вы серьёзно?!"
10011010-215 = "Кахо, разве я не говорила, что ты слишком зажатая?"
10011010-216 = "Пока встреча пройдёт без проблем, такая мелкая услуга..."
10011010-217 = "Будет мне только в удовольствие."
10011010-218 = "[s] «Спасибо.»"
10011010-219 = "Договорились. Члены Исследовательского клуба ниндзюцу, рассчитываю на вашу помощь с представлением! ♪"
10011010-220 = "Президент!"
10011010-221 = "П-председатель...!"
10011010-222 = "Ой, эм..."
10011010-224 = ""
10011010-226 = ""
10011010-228 = "Да! Да, конечно! Мы сделаем всё возможное, чтобы всё удалось! Положитесь на нас."
10011010-229 = "...О, боже."
10011010-230 = "♪"
10011010-231 = "Бу-ха-ха! Как интересно!"
10011010-233 = "Ладно, класс, отправляемся на экскурсию к сцене выступления!"
10011010-234 = ""
10011010-236 = ""
10011010-237 = ""
10011010-238 = "Да!"
10011010-239 = "[s] «Это делает меня сопровождающим?»"
10011010-240 = ""
