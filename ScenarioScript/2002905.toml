[translation]
2002905-1 = "Летние воспоминания"
2002905-2 = "Пляж"
2002905-5 = "Ну что, Сенсей. Начнём?"
2002905-6 = "Раз. Два... Три!"
2002905-7 = ""
2002905-14 = "[ns] «Ях!»"
2002905-16 = "Отлично! Продолжим..!"
2002905-17 = ""
2002905-19 = ""
2002905-25 = "[ns] «Хия!»"
2002905-27 = "В итоге на пляже мы с Мимори занялись... пляжным волейболом."
2002905-28 = "Посреди длинного обмена ударами..."
2002905-29 = ""
2002905-31 = "Кья?"
2002905-32 = ""
2002905-34 = ""
2002905-39 = "[ns] «Ты в порядке?!»"
2002905-40 = "Да. Всё хорошо! Просто нога поскользнулась."
2002905-41 = "Ох. Похоже, на этот раз я проиграла."
2002905-42 = "В обычной перепасовке в волейболе нет победителей и проигравших?"
2002905-43 = "Можно посмотреть и так... Хе-хе-хе. Интересно, почему я всё равно не согласна."
2002905-44 = "Сегодня во мне проснулась непривычная соревновательность!"
2002905-45 = "Может, сделаем перерыв?"
2002905-46 = "Раскроем зонт и откроем... Да! Вот, холодный ананасовый сок."
2002905-47 = ""
2002905-49 = ""
2002905-51 = ""
2002905-52 = ""
2002905-53 = "Вы наверняка хотите пить, но не спешите. Ещё подавитесь."
2002905-54 = "Хм... По вашему выражению лица вижу: вы голодны, но не знаете, что съесть!"
2002905-55 = "Принести вам якисобу из пляжного кафе, Сенсей?"
2002905-56 = "[s1] «Нет, я не хочу, чтобы ты уходила.»\n[s2] «Только если я пойду с тобой.»"
2002905-59 = "..."
2002905-60 = "П-Правда, вы всегда такой..."
2002905-61 = "Ох, нет, вы ничего плохого не сделали, просто я, я..."
2002905-62 = "Не знаю! Я просто отдохну вместе с вами!"
2002905-64 = ""
2002905-66 = "Мимори выглядела смущённой, пока мы смотрели на разбивающиеся волны, поэтому я дал ей немного времени."
2002905-67 = ""
2002905-70 = ""
2002905-71 = "..."
2002905-72 = "[ns] «...»"
2002905-73 = "Ну, так приятно."
2002905-74 = "[s] «Тебе нравится океан?»"
2002905-75 = "А? Н-Ну, да, но...!"
2002905-76 = "Мне нравится время, которое мы проводим вместе. Правда нравится."
2002905-77 = "...Вы правда вредный."
2002905-78 = "[s] «Что я такого делаю?!»"
2002905-79 = "*вздыхает*"
2002905-80 = "Раз уж всё так вышло... Сенсей?"
2002905-81 = "[s] «Х-Хм?»"
2002905-82 = "П-Попробуйте меня поймать!"
2002905-84 = ""
2002905-87 = "Внезапно Мимори вскочила и побежала!"
2002905-90 = "[ns] «Мимори? Ну хорошо! Уже бегу!»"
2002905-91 = "Уааа! Страшно!"
2002905-93 = ""
2002905-97 = "Мы с Мимори побежали по песку."
2002905-98 = ""
2002905-102 = "В этот радостный момент погони друг за другом..."
2002905-104 = ""
2002905-106 = "[ns] «Ого!»"
2002905-108 = "Я споткнулся о песок и эффектно растянулся."
2002905-109 = "Сенсей?!"
2002905-110 = ""
2002905-113 = "Вы в порядке? Простите меня!"
2002905-114 = "Не говорите, что это не моя вина! Если бы не я..."
2002905-115 = "Простите... Простите, Сенсей..."
2002905-116 = "[s3] «Я правда не так уж сильно упал.»\n[s4] «Давно я так хорошо не бегал.»"
2002905-119 = "Ты уверена...?"
2002905-120 = "Вы точно уверены?"
2002905-121 = "Раз вы упали, давайте немного отдохнём от этого."
2002905-122 = "Ах! Можно просто поплавать на поверхности океана — это будет приятно и спокойно."
2002905-123 = "...Как это делается? Хи-хи. Позвольте показать вам, Сенсей!"
2002905-125 = ""
2002905-128 = "Да, идеально! Немного расслабьте тело, смотрите на небо..."
2002905-129 = "Глубоко вдохните, затем медленно выдохните..."
2002905-130 = "Это как лежать на водяном матрасе! Только прямо на воде!"
2002905-131 = "Сенсей, попробуйте!"
2002905-132 = "Следуя указаниям Мимори, я расслабился и стал медленно дышать."
2002905-133 = ""
2002905-137 = "Что думаете, Сенсей?"
2002905-138 = "Что? Нет, Сенсей! Здесь нельзя засыпать!"
2002905-139 = "Будьте осторожны! Вас может унести в море!"
2002905-140 = "Хотя, как настоящая леди, я, конечно же, спасу вас, если такое случится."
2002905-141 = "Это было... очень приятно."
2002905-142 = "Наверное, всё благодаря тому, что сегодня вы были рядом."
2002905-144 = ""
2002905-147 = ""
2002905-148 = "А вы, Сенсей? Как прошёл ваш день?"
2002905-149 = "...Какое облегчение. Я рада, что вам понравилось."
2002905-150 = "..."
2002905-151 = "[s] «Мимори?»"
2002905-152 = "Полагаю, закат означает, что день подходит к концу."
2002905-153 = "...Всё когда-нибудь заканчивается, правда?"
2002905-154 = "[s] «Наверное... да?»"
2002905-155 = "У меня есть просьба, Сенсей."
2002905-156 = "Можно сделать так, чтобы этот день продлился ещё немного?"
2002905-157 = "Совсем чуть-чуть."
2002905-158 = "[s] «Я не против, но почему вдруг?»"
2002905-159 = "Простите, Сенсей."
2002905-160 = "Наверное, это прозвучит немного глупо..."
2002905-161 = "Но сегодня мне было так весело."
2002905-162 = "Я была так счастлива провести целый день только с Сенсеем и ни о чём не переживать."
2002905-163 = "[s5] «Нет ничего плохого в том, чтобы наслаждаться океаном.»\n[s6] «Мне тоже было приятно провести время с тобой, Мимори.»"
2002905-166 = "Хи-хи. Да..."
2002905-167 = "Это время вместе было... очень приятным."
2002905-168 = "[s] «Ты собираешься ещё поплавать?»"
2002905-169 = ""
2002905-171 = ""
2002905-172 = "Нет. Просто... я хочу прогуляться вдоль берега."
2002905-174 = ""
2002905-179 = "― [log=미모리 수영복ND]Если бы только[/log][wa:2130]"
2002905-181 = "― [log=미모리 수영복ND]наше время здесь могло длиться вечно.[/log][wa:1360]"
2002905-184 = "― [log=미모리 수영복ND]Если бы его можно было сохранить, как фотографию или рисунок...[/log][wa:3490]"
2002905-186 = "― [log=미모리 수영복 ND]Если бы это было возможно...[/log][wa:10]"
2002905-189 = "[ns7] «Значит, день удался. У нас обоих.»\n[ns8] «И правда жаль, когда хороший день заканчивается.»"
2002905-190 = "― [log=미모리 수영복 ND]Значит, вы чувствуете то же самое, Сенсей?[/log][wa:2420]"
2002905-191 = "― [log=미모리 수영복 ND]Значит, вы чувствуете то же самое, Сенсей?[/log][wa:2420]"
2002905-193 = "― [log=미모리 수영복ND]Это... Почему-то мне... немного неловко.[/log][wa:1910]"
2002905-196 = "― [log=미모리 수영복ND]Сегодня...[/log][wa:1360]"
2002905-198 = "― [log=미모리 수영복ND]Я чуть не забыла, что должна быть настоящей леди, потому что... я была так счастлива.[/log][wa:10]"
2002905-201 = "― [log=미모리 수영복ND]Эм, Сенсей.[/log].[wa:3300]"
2002905-204 = "―[log=미모리 수영복ND] Может быть, когда-нибудь...[/log][wa:780]"
2002905-206 = "― [log=미모리 수영복ND]Мы сможем снова провести время вместе? Только вдвоём?[/log][wa:10]"
2002905-209 = ""
2002905-210 = "Солнце почти село, скоро будет видно луну."
2002905-211 = "Я бы хотела её увидеть, можно?"
2002905-212 = "[s] «Да... Давай.»"
2002905-213 = "Спасибо."
2002905-214 = "Сегодня я очень на вас полагалась."
2002905-215 = "Так что в качестве последней просьбы... можно мне опереться на ваше плечо?"
2002905-217 = ""
2002905-220 = "Мимори положила голову мне на плечо, и мы вместе смотрели, как восходит луна."
