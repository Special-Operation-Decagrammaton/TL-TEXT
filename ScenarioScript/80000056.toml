80000056-14 = "[s1] «Книга?»\n[s2] «„Книга шоколада“?»"
80000056-15 = "Нет же, глупенький! Это шоколад. На День святого Валентина."
80000056-16 = "Нет же, глупенький! Это шоколад. На День святого Валентина."
80000056-17 = "Вы всегда мне помогаете, поэтому я очень хотела что-нибудь вам подарить."
80000056-18 = "Знаю, выглядит немного странно, но обещаю — шоколад очень вкусный!#nЯ уже пробовала такой."
80000056-19 = "Хм? Что такое, Сенсей?"
80000056-20 = "Вы спрашиваете, всё ли в порядке? А что именно?"
80000056-21 = "А-а-а."
80000056-22 = "Точно! В библиотеке нельзя есть.#nМы же не хотим испортить книги."
80000056-23 = "Вы всегда так внимательны, Сенсей. Хи-хи."
80000056-24 = "Но не переживайте — всё нормально."
80000056-25 = "У такого драже специальное покрытие, поэтому шоколад не тает в руках."
80000056-26 = "Мы, члены Библиотечного комитета, часто его едим. А эта валентиновская версия — специально для вас!"
80000056-27 = "Сенсей..."
80000056-28 = "Если вы не возражаете..."
80000056-29 = "[s3] «Хочешь, я побуду ещё немного?»\n[s4] «Составлю тебе компанию до конца смены.»"
