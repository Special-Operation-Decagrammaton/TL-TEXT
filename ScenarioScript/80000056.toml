80000056-4 = "Привет, Сенсей! Спасибо, что заглянули так поздно!"
80000056-5 = "И-и нет, я позвала вас не из-за просроченной книги."
80000056-6 = "Неужели вы обо мне только так и думаете? Хотя винить вас сложно..."
80000056-7 = "Расслабьтесь, сегодня я не собираюсь вас донимать!"
80000056-8 = "Я попросила вас прийти вот из-за этого."
80000056-9 = ""
