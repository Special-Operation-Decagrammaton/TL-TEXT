80000056-36 = ""
80000056-37 = "Хи-хи! Вы прочитали мои мысли!"
80000056-39 = "Оставшуюся часть смены мы с Шимико провели вместе, работая и делясь шоколадом."
80000056-40 = "Когда шоколад почти закончился, Шимико уснула. Я накрыл её пледом и вернулся в Шале."
