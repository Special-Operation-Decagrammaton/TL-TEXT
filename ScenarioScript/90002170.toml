[translation]
90002170-1 = "Эпизод 17;Человеческий ответ, человеческий ответ"
90002170-3 = "[ns] «Нет. Неправильный ответ.»"
90002170-4 = "...На каком основании, Сенсей?"
90002170-5 = "[s] «Этот ответ слишком человеческий. А я думал, ты бог.»"
90002170-6 = ""
90002170-9 = "[ns] «Это не может быть подтверждением твоего существования.»"
90002170-10 = "...!"
90002170-11 = "[ns] «Кто дал тебе право отнимать нашу боль?»"
90002170-13 = "[ns1] «Что сделано, то уже сделано.»\n[ns2] «В реальной жизни нельзя просто 'начать заново'.»"
90002170-16 = "Именно это я и исправляю. Я создам совершенство в этом мире."
90002170-17 = "[s] «Нет. Не сможешь.»"
90002170-18 = "И по какому праву ты можешь мне это запрещать?"
90002170-19 = "[s3] «Потому что эта печаль, эта боль — ОНИ МОИ.»\n[s4] «...Наши грехи и борьба — это то, что связывает нас.»"
90002170-22 = "Ты...!"
90002170-23 = "[ns5] «И я не могу просто убежать.»\n[ns6] «Как после этого я смогу смотреть своим ученикам в глаза?»"
90002170-27 = ""
90002170-28 = "...!"
90002170-29 = "Хах. Понятно... Значит, вот как..."
90002170-30 = "..."
90002170-31 = "...Э-хе-хе."
90002170-32 = "Я. Я завидую."
90002170-33 = "Хм...? Почему?"
90002170-34 = "Потому что вот такой у тебя учитель. Хи-хи."
90002170-35 = "Фуфу. Ты права. За исключением одного."
90002170-36 = "Что... именно ты имеешь в виду?"
90002170-37 = ""
90002170-39 = ""
90002170-40 = ""
90002170-41 = "Сенсей — и твой учитель тоже. Считай, что это НАШ Сенсей."
90002170-42 = "Да. Считай это церемонией посвящения."
90002170-43 = "...!"
90002170-44 = ""
90002170-45 = "...Даже сейчас ученики для тебя всегда на первом месте. Глупец."
90002170-46 = "[s] «Скорее всего.»"
90002170-47 = "Я ожидал от тебя величия."
90002170-48 = "[s] «От такого ничтожества, как я?»"
90002170-49 = "Тебе нет нужды что-либо изображать. Здесь только мы. Обнажи свою истинную сущность."
90002170-50 = "Никто не станет свидетелем, если хотя бы в этот единственный миг ты отречёшься от своих принципов."
90002170-51 = ""
90002170-54 = "[ns] «Это ты так видишь ситуацию.»"
90002170-56 = "Но Сенсей, я ваш союзник. А вы — мой союзник."
90002170-57 = ""
90002170-58 = "Помогать ученикам, может, и долг учителя, но желание ученика — помогать своему учителю."
90002170-59 = ""
90002170-60 = "Думаю, нам нужно довериться Момои и Мидори."
90002170-61 = ""
90002170-62 = "И где-то между этими крайностями они будут спотыкаться и снова вставать, раз за разом..."
90002170-63 = "Они, и мы, найдём путь."
90002170-76 = ""
90002170-77 = "[ns] «Но не я. Я не смог.»"
90002170-79 = "[ns7] «В конце концов, каждому ученику...»\n[ns8] «...нужен учитель, верно?»"
90002170-82 = "Даже если никто не станет свидетелем твоего греха?"
90002170-85 = "[ns9] «...Это не совсем так.»\n[ns10] «Важно то, стану ли я сам свидетелем собственных грехов.»"
90002170-88 = ""
90002170-89 = ""
90002170-90 = "..."
90002170-91 = "Понятно."
90002170-92 = "Как тот, кто достиг божественного, я уважаю твоё решение."
90002170-93 = "Однако знай: этим ты встаёшь по другую сторону поля боя."
90002170-94 = "Тогда возвращайся к своим ученикам, в свой прежний мир. Выбор за тобой."
90002170-95 = ""
90002170-98 = "[ns] «...?»"
90002170-99 = "Я позволю тебе всё."
90002170-100 = "Ящик Шиттим, кредитную карту. Даже твоих драгоценных учеников."
90002170-101 = "Но запомни это."
90002170-102 = "Я позволю всё это потому, что если ты и твои ученики действительно пожелаете восстать против бога, то окажетесь лицом к лицу с абсолютным уничтожением."
90002170-103 = "Внемлите моим словам, те, кто слушает."
90002170-104 = "Кто имеет уши — услышьте мои слова, ибо это мой гнев и моё провозглашение."
90002170-105 = ""
90002170-108 = ""
90002170-109 = ""
90002170-110 = ""
90002170-111 = "А?! Н-нас поймали!"
90002170-112 = "Но важнее другое— А?!"
90002170-113 = "Смотрите! Там наверху! Сенсей спускается!"
90002170-116 = "Я медленно начал опускаться на землю."
90002170-117 = "Возможно, это была лишь краткая передышка — явление, рождённое милосердием или благодатью."
90002170-118 = "Потому что перед лицом того, что нас ожидало, мы больше не получили бы ни того, ни другого."
90002170-121 = ""
90002170-122 = "Сенсей!"
90002170-123 = "Сенсей, вы в порядке?"
90002170-124 = "[s] «Я в порядке! Важнее другое...»"
90002170-125 = ""
90002170-127 = ""
90002170-128 = ""
90002170-129 = "Эм..."
90002170-130 = "А..."
90002170-131 = "З-здравствуйте... Мы... снова встретились."
90002170-132 = "Сенсей [USERNAME]."
90002170-133 = "[s] «Давно не виделись, да? Как вы поживали?»"
90002170-134 = "Д-Да..."
90002170-135 = "Но важнее... Что произошло?"
90002170-136 = "[s] «Точно. Сначала нужно рассказать об этом.»"
90002170-138 = "Я быстро объяснил всем ситуацию."
90002170-140 = "Понятно. Если так..."
90002170-141 = "Ах. Как сказала бы ненадёжная, но отважная Момои..."
90002170-142 = "Теперь мы вступаем в бой с финальным боссом — злым владыкой демонов."
90002170-143 = ""
90002170-145 = ""
90002170-146 = ""
90002170-147 = "А-а-а... Если бы это была видеоигра, у-у нас было бы больше времени на прокачку."
90002170-148 = "Мы зашли уже слишком далеко. Теперь у нас остался только один путь — вперёд."
90002170-149 = "Мы уже готовы, Сенсей. Не волнуйтесь."
90002170-150 = "Хм? Откуда мы знали? А-а..."
90002170-151 = "Э-эм! Может, нам лучше... эм...! Сменить тему!"
90002170-152 = "Почему?"
90002170-153 = ""
90002170-155 = ""
90002170-156 = "Н-ну, в человеческом мире это ваше «подслушивание» разве не считается серьёзным нарушением приличий?"
90002170-157 = "Ничего необычного. У нас есть студент, чей жизненная миссия — устанавливать прослушку в кабинете Сенсея в Шале."
90002170-158 = ""
90002170-160 = ""
90002170-161 = ""
90002170-162 = ""
90002170-163 = "...Вы точно уверены, что с этим местом... всё нормально?"
90002170-165 = "Ч-чем мы можем помочь?"
90002170-166 = "[s] «Отдохнуть.»"
90002170-167 = "Н-Но..."
90002170-168 = "Они правы. Сейчас это не ваша битва."
90002170-169 = "С нетерпением буду ждать вашего, уверен, блестящего выступления, когда вы понадобитесь нам в следующий раз."
90002170-170 = ""
90002170-172 = ""
90002170-173 = "...Прошу прощения, что так быстро отказываюсь от своих слов, но..."
90002170-174 = "Ч-что...? Что случилось?"
90002170-175 = "Вообще-то я хотела бы, чтобы вы трое пока спрятались, если вас это не слишком затруднит."
90002170-176 = "Что...?"
90002170-178 = "Ваш социопатичный бог соизволил явиться в этот бренный мир."
90002170-179 = ""
90002170-183 = ""
90002170-184 = ""
90002170-185 = ""
90002170-186 = "А-Ах...!"
90002170-187 = ""
90002170-189 = ""
90002170-190 = "А теперь скорее."
90002170-191 = "Х-Хорошо...!"
90002170-192 = ""
90002170-194 = ""
90002170-195 = ""
90002170-196 = "Я рядом с вами, Сенсей!"
90002170-197 = "Нет-нет. Пожалуйста, не извиняйтесь."
90002170-198 = "Мне кажется... от того момента, когда я получила своё имя, и до самого сегодняшнего дня... всё было ради этого мгновения."
90002170-199 = ""
90002170-201 = ""
90002170-202 = "Поэтому, пожалуйста, прикройте мне спину, а я прикрою вашу, Сенсей! И сделаем это с улыбкой!"
90002170-203 = ""
90002170-204 = "Мы тоже здесь, Сенсей! Мы готовы ко всему."
90002170-205 = "Оптимизация процессов Ящика Шиттим завершена. Пожалуйста, отдавайте приказы."
90002170-208 = "[ns] «Да. Сделаем это, все вместе!»"
90002170-209 = ""
90002170-210 = ""
90002170-211 = ""
90002170-212 = ""
90002170-213 = ""
90002170-214 = ""
90002170-215 = ""
90002170-216 = ""
90002170-218 = "Да!!"
90002170-220 = "Следующий эпизод;История для тебя"
