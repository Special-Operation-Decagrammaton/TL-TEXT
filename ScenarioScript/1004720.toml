[translation]
1004720-1 = "Сундук с воспоминаниями"
1004720-2 = "Меня не покидало смутное чувство тревоги, поэтому я поспешил на пляж искать Чисэ."
1004720-3 = ""
1004720-9 = "[ns] «Чисэ должна быть где-то здесь...»"
1004720-11 = "Я ходил по пляжу туда-сюда, разыскивая Чисэ."
1004720-12 = ""
1004720-23 = "[ns] «А? Что это за звук...?»"
1004720-24 = ""
1004720-27 = ""
1004720-28 = ""
1004720-30 = "Хия."
1004720-31 = ""
1004720-33 = ""
1004720-34 = ""
1004720-35 = ""
1004720-36 = ""
1004720-38 = ""
1004720-39 = ""
1004720-40 = "Я пошёл на странный звук и обнаружил Чисэ, которая энергично набивала сумку песком."
1004720-41 = "[ns] «Т-Чисэ?!»"
1004720-42 = ""
1004720-44 = ""
1004720-45 = ""
1004720-47 = "Хм? О. Сенсей. Здравствуйте."
1004720-48 = "[s1] «Привет! Стоп. Сначала — что происходит?»\n[s2] «Что... ты делаешь...?»"
1004720-51 = "Я?"
1004720-52 = "Всё просто."
1004720-53 = "Я забираю пляж с собой."
1004720-54 = "[s] «Забираешь... пляж? И как именно...?»"
1004720-56 = "Песок. Я складываю его в сумку."
1004720-57 = "Если я принесу этот песок обратно в комнату Клуба Инь-Ян, то смогу рассыпать его по всему полу."
1004720-58 = ""
1004720-60 = ""
1004720-62 = "Тогда остальные участницы смогут насладиться пляжем, не покидая Хяккияко."
1004720-63 = "[s5] «Теперь понятно. Ты хочешь поделиться этими воспоминаниями.»\n[s6] «Так вот что ты хотела сделать, Чисэ...»"
1004720-66 = "Хм? Да. А что ещё я могла иметь в виду?"
1004720-67 = "[s7] «Ну, ты часто сворачиваешь с проторенной дорожки.»\n[s8] «Если кто и способен внезапно выдать сюжетный поворот, то это ты.»"
1004720-70 = ""
1004720-72 = ""
1004720-73 = "...?"
1004720-75 = "[s] «Не бери в голову. Значит, ты просто хотела принести домой пляж для всех?»"
1004720-76 = "Да. И я забираю домой не только пляж."
1004720-77 = "Я собрала много вещей, которыми хочу поделиться с остальными."
1004720-78 = "Чтобы создать атмосферу, я подумала, что понадобятся и другие вещи, похожие на пляжные."
1004720-80 = ""
1004720-81 = ""
1004720-82 = ""
1004720-83 = ""
1004720-85 = "Можно я вам покажу?"
1004720-86 = "С этими словами Чисэ начала вытаскивать вещи из сумки."
1004720-88 = ""
1004720-89 = ""
1004720-91 = ""
1004720-92 = ""
1004720-93 = ""
1004720-94 = "Эту ракушку я нашла в углу пляжа."
1004720-95 = "О, а этот камень лежал вон там, на отмели."
1004720-96 = "Эту открывашку мне подарили в пляжном кафе."
1004720-97 = "О, и ещё..."
1004720-99 = ""
1004720-100 = ""
1004720-102 = ""
1004720-104 = "Вот это, Сенсей..."
1004720-106 = ""
1004720-107 = ""
1004720-108 = ""
1004720-109 = ""
1004720-111 = "Сенсей!"
1004720-113 = ""
1004720-114 = ""
1004720-115 = ""
1004720-116 = ""
1004720-117 = ""
1004720-118 = ""
1004720-120 = ""
1004720-121 = ""
1004720-122 = ""
1004720-125 = "Сумка Чисэ была набита самыми разными предметами, а не только песком, как я сначала подумал."
1004720-126 = "Там было всё: от ракушек и камешков до открывашек."
1004720-127 = "Она даже положила туда порванные сети и куски мусора, которые убирала с пляжа."
1004720-128 = "Несмотря на случайность этой коллекции, все предметы казались странно знакомыми."
1004720-129 = ""
1004720-130 = "[ns] «Чисэ, это всё...»"
1004720-132 = "Да, Сенсей. Всё это осталось со времени, когда мы вместе искали сияние."
1004720-133 = "Этот пляж — очень важное для меня место. Здесь у меня появилось много воспоминаний с вами."
1004720-134 = "Поэтому я решила забрать воспоминания с собой и поделиться ими со всеми."
1004720-135 = "Я хочу рассказать им истории, стоящие за каждым из этих кусочков океана."
1004720-136 = "А ещё у меня есть много идей для хайку, которые я хочу им прочитать."
1004720-138 = ""
1004720-139 = ""
1004720-140 = "...Как думаете, им понравится?"
1004720-141 = "[ns] «Показ и рассказ от самой Чисэ?»"
1004720-143 = "[ns] «Гарантирую, им понравится каждая минута.»"
1004720-144 = "Серьёзно?"
1004720-145 = "Я очень рада."
1004720-146 = "Хорошо. Теперь нужно всё снова сложить."
1004720-147 = ""
1004720-149 = ""
1004720-150 = ""
1004720-151 = ""
1004720-152 = ""
1004720-154 = ""
1004720-155 = ""
1004720-157 = "Пока Чисэ аккуратно складывала все «сияния» обратно в сумку, я невольно думал обо всех драгоценных воспоминаниях и сокровищах, которые они для неё олицетворяли."
1004720-158 = "В каком-то смысле эта сумка..."
1004720-159 = ""
1004720-160 = "[ns] «Эта сумка — сундук сокровищ Чисэ!»"
1004720-161 = "Сундук сокровищ...?"
1004720-162 = "[s9] «То, где хранятся твои драгоценные вещи!»\n[s10] «Сундук, полный того, чем хочется похвастаться перед другими!»"
1004720-165 = "Драгоценное... похвастаться..."
1004720-166 = "Сокровища, которыми я хочу поделиться с другими людьми...?"
1004720-167 = "Ах."
1004720-168 = "Сокровище."
1004720-170 = ""
1004720-171 = ""
1004720-172 = "Да. Я хочу забрать свои сокровища с собой."
1004720-174 = ""
1004720-175 = ""
1004720-177 = ""
1004720-178 = ""
1004720-179 = "[ns] «А...? Чисэ...? Эм, почему—»"
1004720-180 = ""
1004720-182 = "[ns] «Т-Чисэ! Перестань идти на меня! Чего ты хочешь?!»"
1004720-183 = "Вы — моё сокровище, Сенсей. Это сундук сокровищ. Значит, я положу вас сюда и отнесу обратно в Клуб Инь-Ян, чтобы поделиться."
1004720-184 = "[s] «Подожди, нет! Я не это имел в виду! У меня теперь рот полон песка!»"
1004720-186 = ""
1004720-187 = ""
1004720-190 = "[ns] «Чисэ! Я просто пойду с тобой! Не нужно запихивать меня в сумку!»"
1004720-192 = "Наконец она перестала пытаться затолкать меня в сумку и вместо этого начала тащить меня с пляжа."
1004720-193 = "Вместе мы прошлись по пляжу, наполненному нашими воспоминаниями, и спокойно провели остаток дня."
