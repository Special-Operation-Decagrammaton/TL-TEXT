[translation]
10039080-1 = "Эпилог;Карнавал Тринити"
10039080-7 = ""
10039080-8 = ""
10039080-15 = "...Вот вы где, Сенсей."
10039080-16 = ""
10039080-18 = ""
10039080-19 = "[ns] «...Мари?»"
10039080-20 = "Хи-хи. Вы сразу узнали меня под маской. Хотя, наверное, по костюму... и по голосу..."
10039080-21 = "В общем, раз здесь только вы..."
10039080-22 = "...не против, если я ненадолго сниму маску?"
10039080-23 = ""
10039080-25 = ""
10039080-26 = ""
10039080-27 = ""
10039080-28 = "[ns1] «Так можно?»\n[ns2] «Правила этого не запрещают?»"
10039080-31 = "Хи-хи. Не волнуйтесь. Нам не обязательно носить их постоянно. И я не против немного отдохнуть."
10039080-32 = "Кроме того..."
10039080-33 = "...если я буду благодарить вас из-за маски, это будет уже не то."
10039080-34 = "Поэтому я и вышла сюда."
10039080-35 = "...Сенсей?"
10039080-36 = "Вы знали с самого начала? Ещё когда мы разговаривали с другими идол-группами?"
10039080-37 = "Или..."
10039080-38 = ""
10039080-41 = "...Хм?"
10039080-42 = "О, вы заметили это, пока гуляли со мной. Тогда, наверное, остальные тоже заметили."
10039080-43 = "Хм..."
10039080-44 = "Неужели всё было настолько очевидно?"
10039080-45 = "[s3] «Радость трудно удержать внутри.»\n[s4] «В этом нечего стесняться. Не переживай.»"
10039080-48 = "Ха, хи-хи... Наверное, вы правы."
10039080-49 = "Хотя мне всё ещё немного неловко. Часть меня хочет пойти куда-нибудь спрятаться."
10039080-50 = "То есть выступление прошло нормально, но, эм..."
10039080-51 = ""
10039080-53 = ""
10039080-54 = "...Хи-хи."
10039080-55 = "Неважно. Я пришла не об этом говорить."
10039080-56 = "Благодаря вам у меня была чудесная неделя. Я даже не знала, что МОГУ так себя чувствовать."
10039080-57 = "Если бы не вы и остальные, я просто позволила бы этим чувствам пройти мимо. И никогда бы не испытала ту радость, которую чувствую сейчас."
10039080-58 = "Поэтому я хочу выразить благодарность. Большое спасибо, Сенсей."
10039080-59 = "За это и... за всё остальное."
10039080-60 = "Когда я рядом с вами, кажется, я узнаю о себе всё больше. Даже если не сразу это замечаю."
10039080-61 = "И, если честно, иногда это немного тревожит..."
10039080-62 = "[s5] «Тревожит?»\n[s6] «Тебя что-то беспокоит?»"
10039080-65 = "Нет, дело не в вас. Просто мои собственные мысли."
10039080-66 = "Наверное, мне кажется, что я слишком расслабляюсь... Словно начинаю слишком себя баловать..."
10039080-67 = "Если я продолжу хотеть всё больше..."
10039080-68 = "...я не могу позволить себе зайти так далеко. Всё-таки я Сестра."
10039080-69 = "...Хм?"
10039080-70 = "Можно... иногда немного себя баловать...?"
10039080-71 = ""
10039080-73 = ""
10039080-74 = "Хи-хи..."
10039080-75 = "...Хи-хи."
10039080-76 = "[ns7] «Мари?»\n[ns8] «Чего ты смеёшься...?»"
10039080-79 = "Ах, простите. Я не специально."
10039080-80 = "Просто почему-то я ожидала, что вы именно это и скажете."
10039080-81 = "Я стала наблюдательнее? Или... может, хитрее?"
10039080-82 = "Вот в чём проблема. Я начинаю слишком хорошо о себе думать. Может, даже СЛИШКОМ."
10039080-83 = "Хи-хи..."
10039080-84 = "Какая же я проблемная."
10039080-85 = "Но всё же..."
10039080-86 = "...Ага."
10039080-87 = ""
10039080-89 = ""
10039080-90 = ""
10039080-91 = "И уж перед вами-то мне особенно нужно быть осторожной..."
10039080-92 = "О, вот вы где. Оба."
10039080-93 = "Отлично, я как раз вас искала."
10039080-97 = ""
10039080-98 = "[ns9] «Сакурако, Минэ?»\n[ns10] «Почему вы в этих масках?!»"
10039080-101 = "Хи-хи. Они выглядят довольно... круто, разве нет?"
10039080-102 = "Рыцари скорой помощи и Сестринство сделали их для нас. Мы не ожидали, но подарки отличные."
10039080-103 = "Даже если в каком-то смысле это были... шуточные подарки."
10039080-104 = "С другой стороны, это лишь значит, что они чувствуют себя с нами достаточно близко, чтобы шутить. Разве это не прекрасно, капитан?"
10039080-105 = "...Хи-хи. Справедливо."
10039080-106 = "Конечно, ничего из этого не произошло бы без..."
10039080-107 = "...Без вас двоих. Мы пришли сюда поблагодарить вас."
10039080-108 = ""
10039080-110 = ""
10039080-111 = ""
10039080-112 = ""
10039080-113 = "От имени Сестринства выражаю благодарность вам обоим..."
10039080-114 = "...и от имени Рыцарей скорой помощи мы официально выражаем свою признательность."
10039080-116 = "Сакурако... капитан Минэ..."
10039080-117 = "[ns11] «Вы обе тоже очень старались.»\n[ns12] «Это было действительно прекрасное выступление.»"
10039080-120 = "Хех, ну, нам достаётся лишь малая часть заслуги."
10039080-121 = "О, кстати..."
10039080-122 = "Хм?"
10039080-123 = "Мари, я хотела бы попросить у тебя разрешения на кое-что."
10039080-124 = ""
10039080-126 = ""
10039080-130 = "Мы сделали несколько фотографий..."
10039080-131 = "[ns13] «Есть фотографии идола Мари?!»\n[ns14] «О-о, о-о! Покажите, покажите!»"
10039080-134 = "Хех, я думала, вы попросите, поэтому сделала много копий."
10039080-135 = "Мы считаем, что если поделиться ими с публикой, это принесёт людям радость."
10039080-136 = ""
10039080-138 = ""
10039080-139 = ""
10039080-140 = ""
10039080-141 = "Хм? ...Мари?"
10039080-142 = "О, ты хочешь сама их просмотреть?"
10039080-143 = "Выбирай лучшие, какие захочешь. Мы полностью открыты к предложениям."
10039080-144 = "..."
10039080-145 = ""
10039080-147 = ""
10039080-148 = ""
10039080-150 = "...!"
10039080-151 = "*ахает*"
10039080-152 = "[ns15] «Ты порвала фотографии?!»\n[ns16] «Ма-Мари...?!»"
10039080-155 = "...Это ВСЕ фотографии?"
10039080-156 = "А-А?! Нет. Ещё несколько копий лежат в ящике моего стола..."
10039080-157 = "Ну..."
10039080-158 = "Сакурако..."
10039080-159 = ""
10039080-161 = ""
10039080-163 = "...пожалуйста, уничтожь их все. Не оставляй ни одной."
10039080-164 = "Н-Но..."
10039080-165 = "Но почему?! Они такие драгоценные, такие красивые!"
10039080-166 = "Сакурако, послушай меня."
10039080-167 = "Пожалуйста, сделай, как она просит..."
10039080-169 = "Я серьёзно."
10039080-170 = "Уничтожь их все."
10039080-171 = "Считай это одолжением."
10039080-172 = ""
10039080-174 = ""
10039080-175 = ""
10039080-176 = "Сделай это ради меня."
10039080-177 = "И-и-и?!"
10039080-178 = "Ладно, ладно! Я немедленно от них избавлюсь...!"
10039080-179 = ""
10039080-181 = ""
10039080-182 = ""
10039080-183 = ""
10039080-184 = ""
10039080-185 = "Да, в конце концов, сегодня вечером мы всё ещё идол-группа..."
10039080-186 = "Просто считай это приказом лидера группы. С этим ведь проблем быть не должно."
10039080-187 = "Кхм, прошу прощения. Теперь, когда я как следует поблагодарила вас обоих, я пойду."
10039080-188 = ""
10039080-190 = ""
10039080-191 = ""
10039080-192 = "...Ещё раз огромное спасибо вам обоим за всю вашу работу."
10039080-193 = ""
10039080-195 = ""
10039080-196 = ""
10039080-197 = "[ns17] «Ну, жаль.»\n[ns18] «Фотографии были очень красивые.»"
10039080-200 = "Пожалуйста, не начинайте, Сенсей."
10039080-201 = "Это мероприятие было отдельной маленькой историей."
10039080-202 = "Начиная с завтрашнего дня я снова просто Сестра."
10039080-203 = "Если эти фотографии продолжат где-то ходить, они будут звать меня, отвлекать."
10039080-204 = "Не то чтобы я о чём-то сожалела, но..."
10039080-205 = "...ну, назовём это упрямством."
10039080-206 = ""
10039080-208 = ""
10039080-209 = "Возможно, это не слишком утешит, но..."
10039080-210 = ""
10039080-212 = ""
10039080-213 = ""
10039080-214 = ""
10039080-215 = "[ns19] «О, это...?»\n[ns20] «Ты оставила одну фотографию целой?»"
10039080-218 = "Хм... Как бы это сказать?"
10039080-219 = "...Считайте это небольшим фан-сервисом от меня лично для вас."
10039080-220 = "Вы всегда так много для нас делаете."
10039080-221 = ""
10039080-223 = ""
10039080-224 = "Так что, пока всё не вернулось в норму, возьмите это как сувенир..."
10039080-225 = ""
10039080-228 = ""
10039080-229 = ""
10039080-230 = ""
10039080-231 = ""
10039080-233 = "...и как маленький секрет между нами."
10039080-234 = "Серенада на Променаде"
