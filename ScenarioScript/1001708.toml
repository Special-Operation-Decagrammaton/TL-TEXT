[translation]
1001708-1 = "Кошмар"
1001708-2 = "Хех! Один пудинг сюда, два пудинга туда..."
1001708-3 = "Что?!"
1001708-4 = ""
1001708-7 = "Секретариат академии Красная Зима"
1001708-8 = "Похоже, я задремала за работой."
1001708-9 = "Наверное, я вымоталась от всей работы в последнее время. Похоже, надо чаще спать днём."
1001708-10 = "Сколько я вообще проспала? Так, который час..."
1001708-11 = ""
1001708-12 = ""
1001708-13 = "...Пять вечера? Время полдника давно прошло!"
1001708-14 = "Как они смеют наслаждаться полдником без меня, даже если я спала! Непростительно!"
1001708-15 = "Государственная гвардия! Где моя Государственная гвардия?!"
1001708-17 = ""
1001708-18 = "Угх, как шумно! Кто нарушает тишину Секретариата?"
1001708-19 = "Ч-что?! Шумно? Как ты смеешь разговаривать со мной таким тоном?!"
1001708-20 = "Приговариваю тебя к месяцу уборки туалетов!"
1001708-21 = "...Что это за ребёнок?"
1001708-22 = "Р-ребёнок?!"
1001708-23 = "Ты... Ты не знаешь, кто я?!"
1001708-24 = "Я Черино... Великий лидер, уважаемый президент студсовета, Благоустроитель земель и Главный санитарный инспектор академии Красная Зима!"
1001708-25 = "Что? Не может такой маленький ребёнок быть президентом академии Красная Зима."
1001708-26 = "Что тут невозможного? Просто посмотри на мой портрет на стене..."
1001708-27 = ""
1001708-29 = ""
1001708-30 = "Е-его нет!"
1001708-31 = "Мой портрет исчез!"
1001708-33 = "Статуи, выставленные в коридоре..."
1001708-36 = "Даже пропаганда, восхваляющая мои подвиги... Всё исчезло без следа!"
1001708-38 = "Что происходит? Пока я спала, случилась революция?"
1001708-39 = "(...)"
1001708-40 = ""
1001708-41 = "Товарищ! Ваше появление как нельзя кстати!"
1001708-42 = "В-вы ведь не забыли, кто я, правда? Вы не забыли меня, Великого лидера и президента студсовета академии Красная Зима, верно?"
1001708-43 = "(...)"
1001708-44 = "П-почему вы смотрите на меня так, будто видите впервые? Вы и правда забыли, кто я?!"
1001708-45 = "Вспомните! Вспомните меня!"
1001708-46 = "(...)"
1001708-48 = "Вспомните... Вспомните меня..."
1001708-49 = ""
1001708-50 = "[s] «...Черино?»"
1001708-51 = "*ахает*"
1001708-52 = "Г-где я?"
1001708-53 = "[s] «Что ты там говорила во сне?»"
1001708-54 = "Э-это был сон? Фух, какое облегчение..."
1001708-55 = "Э-это был ужасный сон. Государственная гвардия не помнила, кто я... Даже вы меня забыли..."
1001708-56 = "Даже такая бесстрашная, как я, в такой ситуации была совершенно ошеломлена."
1001708-57 = "[s] «Хорошо, что это был всего лишь сон.»"
1001708-58 = "...Нет, совсем не хорошо!"
1001708-59 = "Пусть никто другой не знал, но как вы вообще могли забыть меня, Товарищ?!"
1001708-60 = "[s] «Но это же было только в твоём сне, верно?»"
1001708-61 = "Даже если это был сон, вы всё равно были собой!"
1001708-62 = "В качестве извинения за то, что вы сделали во сне, требую принести мне лучший пудинг!"
1001708-63 = "[s] «Это как-то совсем несправедливо...»"
1001708-65 = "...После этого мне ещё некоторое время пришлось успокаивать Черино."
