[translation]
32175-2 = "Вот теперь понятно, почему в последнее время все только и говорят о Шале. Взрослые такие назойливые."
32175-3 = "Какой неожиданный поворот, но ничего."
32175-4 = "Теперь, когда Сэя и Наги устранены, я наконец смогу делать всё по-своему. Буду очень признательна, если ты больше не станешь вмешиваться."
32175-5 = "...!"
32175-6 = "Скоро придёт ещё подкрепление! Ты всё ещё хочешь продолжать?"
32175-7 = "Мика! Это была ты? Ты стояла за нападением на Сэю?"
32175-8 = "А?"
32175-9 = "Не обязательно смотреть на меня с таким презрением."
32175-10 = "Но-о-о... да, ты права. Нападение на Сэю организовала я. А какой у меня был выбор? Сэя каждый день несла какую-то чепуху про «рай» и тому подобное."
32175-11 = "Но разрушать её нимб в план не входило. Имей обо мне хоть немного хорошего мнения — я не убийца."
32175-12 = "Я всего лишь собиралась держать её под замком до выпуска, но рейдовая группа, те ещё проказники, позволила ситуации выйти из-под контроля и зашла слишком далеко."
32175-13 = ""
32175-15 = ""
32175-17 = "..."
32175-18 = "Разве не так, Азуса? Ты ведь была в рейдовой группе, которая убила Сэю, верно? Не хочешь прояснить это недоразумение?"
32175-19 = "Именно из-за той маленькой ошибки всё так вышло из-под контроля."
32175-20 = "Понимаешь? Теперь я не могу повернуть назад из-за этого — из-за тебя."
32175-21 = ""
32175-24 = ""
32175-27 = ""
32175-28 = "Я..."
32175-29 = "Азуса...? Она же не серьёзно, правда?"
32175-30 = "Н-Нет, всё не так..."
32175-31 = ""
32175-34 = "А?"
32175-35 = "Группа студентов прорывается снаружи!"
32175-36 = "Невозможно. В кампусе не должно было остаться студентов, которые осмелились бы выступить против приказов Чаепития."
32175-37 = "Я могу назвать одну организацию. Независимую — ту, что не склоняется ни перед Чаепитием, ни перед кем другим."
32175-38 = "Доклад обстановки. Они идут со стороны собора!"
32175-42 = "Это Сестринство!"
