[translation]
32175-2 = "...Entendi, entendi~. Então é por isso que todo mundo vive falando \"Schale\", \"Schale\". Como os \"adultos\" dão trabalho, viu."
32175-3 = "Foi inesperado, mas... aham, bom, acho que não tem problema. Só parece que vai levar um pouquinho mais de tempo."
32175-4 = "A Seia-chan e a Nagi-chan vão sair de cena, e agora que eu finalmente vou poder começar, bem que vocês podiam não ficar me atrapalhando à toa, né~."
32175-5 = "...!"
32175-6 = "Bom, parece que ainda vão chegar muitos outros reforços, então vamos continuar?"
32175-7 = "Mika-san, deixe-me perguntar uma coisa! O ataque à Seia-chan também foi sob suas ordens!?"
32175-8 = "...?"
32175-9 = "Aha, então a Hanako também sabe fazer esse tipo de olhar, né?"
32175-10 = "Aham, foi ordem minha. É que a Seia-chan vivia falando umas coisas esquisitas o tempo todo. Sobre Paraíso, isso e aquilo, só coisa complicada."
32175-11 = "Mas eu nunca mandei destruírem a auréola dela, viu? Eu não sou uma assassina."
32175-12 = "Eu só achei que seria melhor deixá-la trancada numa jaula até a formatura. Mas as coisas acabaram ficando daquele jeito naturalmente."
32175-17 = "..."
32175-18 = "Mais do que isso, não seria mais rápido perguntar para a própria envolvida? ...Ei, Shirasu Azusa. Parece que tem um pequeno mal-entendido aqui, então será que você poderia explicar no meu lugar?"
32175-19 = "O que aconteceu com a Seia-chan foi o estopim para a situação chegar a essa proporção, sabia?"
32175-20 = "Foi a partir dali que várias coisas saíram completamente do controle... Ei, o que você acha disso tudo?"
32175-28 = "I-Isso é..."
32175-29 = "Azusa-chan...? Do que exatamente ela está falando...?"
32175-30 = "N-Não é isso... Aquilo foi..."
32175-34 = "Hmm?"
32175-35 = "Algumas alunas de Trinity estão vindo em nossa direção!"
32175-36 = "...? Por quê? As pessoas que desafiariam a lei marcial da Tea Party já deveriam..."
32175-37 = "...Existe, sim. Um grupo independente ao qual nem mesmo a Tea Party pode dar ordens."
32175-38 = "Confirmado, elas vêm da Grande Catedral! O que significa que..."
32175-42 = "...A Irmandade!?"
32175-49 = "Próximo;Mesmo um Mundo Assim (2)"
