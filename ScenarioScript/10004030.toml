[translation]
10004030-1 = "Эпизод 3;Мелкая месть"
10004030-2 = "Небольшой парк рядом с Садом сливового цветка"
10004030-3 = "Мы пришли!"
10004030-4 = "[s1] «Разве это место не...?»\n[s2] «Что мы делаем в парке?»"
10004030-5 = "Это небольшой парк в районе Шаньхайцзина."
10004030-6 = "Это небольшой парк в районе Шаньхайцзина."
10004030-7 = "Он рядом с Садом сливового цветка, и сюда почти никто не приходит, так что это хорошее место побыть одной."
10004030-8 = "Я часто прихожу сюда в выходные..."
10004030-9 = "То есть, я часто видела, как Шун приходит сюда отдыхать!"
10004030-10 = ""
10004030-11 = "В этом парке много хороших мест для отдыха, но это моё самое любимое!"
10004030-12 = "Смотрите! Стулья и стол сделаны из пней!"
10004030-13 = "Высота стола идеально подходит, чтобы поддерживать меня, когда я сижу на этом стуле."
10004030-14 = "Поэтому я могу отдыхать, и спина не болит!"
10004030-15 = "[s3] «Поддерживать тебя?»\n[s4] «Болит спина?»"
10004030-18 = "Ой. Э-Эм, ну..."
10004030-19 = "Я имею в виду, когда стану старше, моя фигура... кто знает..."
10004030-20 = "У-У меня большой потенциал, знаете ли!"
10004030-21 = "[s5] «П-Понятно.»\n[s6] «Это вообще-то фраза другого студента.»"
10004030-22 = "В-В любом случае!"
10004030-23 = "В-В любом случае!"
10004030-24 = "Раз уж мы пришли в парк, давайте поиграем вместе!"
10004030-25 = ""
10004030-26 = "Думаю, на тех качелях-балансирах будет весело, и вон та пружинная лошадка тоже выглядит забавно."
10004030-27 = "О, там есть качели!"
10004030-28 = "Я всегда хотела, чтобы кто-нибудь меня покачал. Давайте, Сенсей!"
10004030-29 = "[s] «Как я и сказал, сначала нужно найти Шун.»"
10004030-30 = "Но..."
10004030-31 = ""
10004030-34 = ""
10004030-35 = "А? Не ожидала увидеть вас здесь, Сенсей."
10004030-36 = "К-Кокона? Что ты здесь делаешь?"
10004030-37 = "О, а кто эта маленькая девочка?"
10004030-38 = ""
10004030-40 = ""
10004030-41 = ""
10004030-42 = ""
10004030-43 = "Ты новый студент Сада сливового цветка? Я тебя раньше не видела..."
10004030-44 = "Д-Да! Меня зовут Шунлинь, я совсем недавно сюда перевелась!"
10004030-45 = "(Ч-Что? Даже Кокона меня не узнаёт?!)"
10004030-46 = "(Какое облегчение. Было бы неловко, если бы она увидела, как по-детски я веду себя перед Сенсеем в этом теле.)"
10004030-47 = "(Но всё равно обидно. Я её старшая сестра. Как она может не узнать меня только потому, что я выгляжу немного моложе...?)"
10004030-48 = "Ты выглядишь странно знакомой... Ты одна из студентов Шун?"
10004030-49 = "Но куда она могла уйти? Я думала, найду её здесь."
10004030-50 = "[s] «Ты тоже ищешь Шун?»"
10004030-51 = "Да. Уже какое-то время не могу с ней связаться."
10004030-52 = "Сегодня она исчезла, ничего не сказав, и мне пришлось вместо неё готовить перекус для студентов."
10004030-53 = "(Стой! Это ведь Кокона должна была готовить перекус для класса Подсолнуха!)"
10004030-54 = "Кстати, в последнее время она какая-то странная..."
10004030-55 = "Ну, уверена, она опять зациклилась на какой-нибудь глупости."
10004030-56 = "Переживает из-за возраста, сухой кожи... Не понимаю, зачем беспокоиться о таких глупостях."
10004030-57 = "(Э-Это не глупости! Для меня это очень важно!)"
10004030-58 = "Ещё она каждый день говорит, что боится набрать вес, но при этом не может перестать есть сладкое. Как ребёнок."
10004030-59 = "Может, она где-нибудь потерялась, объедаясь танхулу."
10004030-60 = "(Не говори такое перед Сенсеем [USERNAME]...)"
10004030-61 = "(Я тебе это припомню, Кокона!)"
10004030-62 = "Но у тебя, Кокона, тоже детские вкусы. Ты говоришь, что морковь горькая и противная, поэтому всегда прячешь её вместо того, чтобы есть!"
10004030-63 = "А-А? Откуда ты это знаешь?"
10004030-64 = "Мне всё рассказала Шун. Инструктор Кокона всегда жалуется, прямо как капризный ребёнок."
10004030-65 = "Уф. Зачем она рассказывает студентам обо мне такое?"
10004030-66 = "Кхм. Ты, наверное, не понимаешь, потому что слишком маленькая, но я зрелая леди."
10004030-67 = "А у леди есть свои вкусы, и я просто не люблю морковь."
10004030-68 = "Настоящая леди хотя бы попробовала бы съесть то, что ей не очень нравится."
10004030-69 = "К тому же, будь она действительно взрослой, она бы каждое утро не делала растяжку банзай, чтобы стать выше!"
10004030-70 = "О-Откуда ты...? Я же специально выходила очень рано, чтобы никто не увидел!"
10004030-71 = "Эти упражнения всё равно почти не влияют на рост. Президент Кисаки из Генрюмон очень старалась делать их, но даже она говорит, что в итоге ничего не помогло."
10004030-72 = ""
10004030-74 = ""
10004030-76 = "Слушай, Кокона, если будешь есть только то, что нравится, и плохо говорить о старшей сестре, никогда не перестанешь быть маленьким ребёнком!"
10004030-78 = ""
10004030-80 = ""
10004030-81 = "Ух... У-у-ух!"
10004030-82 = "Ты! Я запомню твоё лицо! Ты за это заплатишь!"
10004030-83 = ""
10004030-85 = ""
10004030-87 = "Те, кто так говорит, только лают, а не кусаются. Хмф!"
10004030-88 = ""
10004030-90 = "(Я и не знала, насколько приятно просто высказать человеку всё вот так!)"
10004030-91 = "(Мне столько всего сходит с рук. Это лучшее!)"
10004030-92 = "[s] «Шунлинь...»"
10004030-93 = "О-Ой. Кажется, я зашла слишком далеко..."
10004030-94 = "[s] «Невежливо смеяться над девушкой старше тебя.»"
10004030-95 = "Вообще-то старше здесь я..."
10004030-96 = "...но ладно. Наверное, я и правда была слишком злой. Простите."
10004030-97 = "[s] «В следующий раз обязательно извинись перед Коконой.»"
10004030-98 = "Хорошо! Обязательно, Сенсей!"
10004030-99 = "Эм..."
10004030-100 = "Похоже, Шун здесь тоже нет. Пойдём дальше?"
10004030-101 = ""
10004030-103 = ""
10004030-104 = "[ns] «П-Подожди, Шунлинь!»"
