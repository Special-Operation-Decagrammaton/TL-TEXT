[translation]
2005506-1 = "Мир, спасение и геймеры"
2005506-2 = "Клубная комната Отдела разработки игр"
2005506-3 = "Н-Не стоит."
2005506-4 = "..."
2005506-5 = "Б-Большое спасибо всем. Для меня это была честь, правда."
2005506-6 = "[ns] «Юзу?»"
2005506-7 = "А? Этот голос...?"
2005506-8 = ""
2005506-10 = ""
2005506-11 = ""
2005506-12 = "С-Сенсей? Давно вы здесь?!"
2005506-13 = "Ух...!"
2005506-14 = "[s1] «Вижу, ты была посреди VR-игры.»\n[s2] «С кем ты разговаривала?»"
2005506-17 = "А? Н-Ну..."
2005506-18 = "...Меня благодарили люди внутри игры. Там была церемония. Я знаю, это всего лишь NPC, но..."
2005506-19 = "...Они благодарили меня за спасение их мира."
2005506-20 = "[s] «Значит, ты спасительница мира!»"
2005506-21 = "Ч-Что значит спасительница...?!"
2005506-22 = "И всё же впервые за долгое время я почувствовала гордость."
2005506-23 = "Единственное, в чём я правда хороша, — игры. В реальной жизни я не спасла ни одного человека..."
2005506-24 = "Но в играх даже такая, как я, может спасти целый мир."
2005506-25 = "Конечно, это всего лишь сюжет игры и ничего больше..."
2005506-26 = "Так что большого значения в этом нет..."
2005506-27 = "[s] «Но нет причины, по которой игра не может быть реальностью.»"
2005506-28 = "Разве «реальность» не находится в каждом прожитом нами мгновении?"
2005506-29 = "Разве «реальность» не находится в каждом прожитом нами мгновении?"
2005506-30 = "..."
2005506-31 = "Если подумать, даже если мир внутри игры виртуальный..."
2005506-32 = "Радость, гордость и чувство достижения, которые я там испытала..."
2005506-33 = "По крайней мере эти вещи точно были настоящими."
2005506-34 = "[s3] «И игры, которые создаёшь ты...»\n[s4] «Эти миры тоже будут что-то значить для других людей.»"
2005506-37 = "Мои миры... могут иметь такое значение... для кого-то..."
2005506-38 = "..."
2005506-39 = "Эм, тогда, Сенсей."
2005506-40 = "Мир, который я спасла... Хотите посмотреть на него вместе со мной?"
2005506-42 = "Причин отказываться не было."
2005506-43 = "Юзу протянула мне ещё один VR-шлем. Мы вместе вошли в игру."
2005506-47 = "― [log=유즈 결전]Осмотритесь, Сенсей.[/log][wa:4230]"
2005506-49 = "― [log=유즈 결전]Это мир, который я защитила.[/log][wa:510]"
2005506-52 = "― [log=유즈 결전]...Разумеется, я понимаю.[/log][wa:2170]"
2005506-54 = "― [log=유즈 결전]Я знаю, что не только я видела этот пейзаж.[/log][wa:2270]"
2005506-57 = "― [log=유즈 결전]На том игровом турнире вы ведь сказали что-то вроде этого?[/log][wa:1760]"
2005506-59 = "― [log=유즈 결전]Что этот момент, эта игра — наша реальность.[/log][wa:5550]"
2005506-62 = "― [log=유즈 결전]Поэтому, даже если у этого мира заранее определён конец,[/log][wa:4050]"
2005506-64 = "― [log=유즈 결전]даже если все в этом мире следуют одному и тому же сценарию,[/log][wa:1020]"
2005506-67 = "― [log=유즈 결전]решения, которые принимаю я, эти эмоции...[/log][wa:3300]"
2005506-69 = "― [log=유즈 결전]Без сомнения, всё это настоящее.[/log][wa:1830]"
2005506-71 = ""
2005506-72 = "[ns] «Кстати, Юзу, похоже, этот костюм тебе теперь нравится.»"
2005506-73 = "А? Костюм...?"
2005506-74 = "...Ах."
2005506-75 = "Э-Э-Это...! Просто...!"
2005506-76 = "П-Просто эта одежда лучше всего подходит для этой игры...!"
2005506-77 = "В-Вот и всё, правда!"
2005506-78 = "Нельзя слишком привередничать с одеждой, когда спасаешь мир, верно...?"
2005506-79 = "[ns] Удовлетворённо улыбнуться."
2005506-80 = "Н-Не смейтесь...!"
2005506-82 = "После этого мы с Юзу ещё долго осматривали её теперь уже мирный мир."
