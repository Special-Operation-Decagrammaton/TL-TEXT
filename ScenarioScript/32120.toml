32120-48 = "До последнего, третьего экзамена неделя. У нас остался последний шанс."
32120-49 = "Да, но мы знаем, как далеко она готова зайти, лишь бы не дать нам его сдать. Шансы не в нашу пользу."
32120-50 = "Я-Я до сих пор не верю, что она приказала уничтожить место экзамена..."
32120-51 = "Почему всё это вообще происходит?! За что ей так приспичило исключить именно НАС?!"
32120-52 = "И я должна поверить, что кто-то из нас предаст Тринити?! Это же нелепо!"
