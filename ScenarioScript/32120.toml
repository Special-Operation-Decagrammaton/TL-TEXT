32120-43 = "Пристройка"
32120-44 = "Снова дома, милый дом."
32120-45 = "Мы думали, что наше время здесь подошло к концу, но вот мы всё ещё тут. Жизнь непредсказуема."
32120-46 = "Хватит мямлить! Надо придумать план!"
