32120-36 = "[s] «Я попробую, Хифуми, но ничего не обещаю.»"
32120-37 = "Спасибо, Сенсей."
32120-38 = "Такими темпами нас всех исключат..."
32120-40 = "После этого я попытался договориться о встрече с Нагисой, но так и не выяснил, где она."
