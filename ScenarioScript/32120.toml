32120-26 = ""
32120-27 = ""
32120-29 = "Нет, отпусти меня! Спасите, Сенсей! Простите! Простите...!"
32120-30 = "Прости, что сорвалась на тебя, Ханако! Пожалуйста, отпусти меня!"
32120-31 = "Занятно. Я ещё не видела настолько эффективного приёма удержания в ближнем бою. Это может оказаться весьма полезным."
