[translation]
32120-1 = "Episódio 12;De Volta à Estaca Zero"
32120-2 = "(Depois disso...)"
32120-4 = "Não aguento mais!!"
32120-5 = "Não dá pra continuar fazendo isso! Eu não entendo! É chato! É um saco!!"
32120-7 = "Ah, hum, bem... nós estamos reunidas aqui justamente para evitar a expulsão..."
32120-8 = "Por enquanto, hum, todas nós precisamos juntar nossas cabeças e procurar um bom jeito de resolver isso..."
32120-9 = "Se não fizermos isso, daqui a uma semana todas nós vamos acabar sendo expulsas juntinhas..."
32120-10 = "\"Juntar nossas cabeças\"... Entendo. Não é ruim, mas falta um certo impacto, não acha? Que tal algo um pouco mais..."
32120-11 = "Por exemplo, vejamos... que tal se a gente \"juntasse nossas partes mais fracas e sensíveis\"?"
32120-16 = "O-O que você tá falando assim do nada?! Baixaria não pode! É proibido! Pena de morte!! E o que quer dizer com \"partes sensíveis\", o que você tá querendo juntar e como?!"
32120-17 = "Ah, ficou um pouco difícil de entender? Então, que tal eu demonstrar na prática? Se puder abrir um pouquinho mais as pernas, assim..."
32120-21 = "... Hã? Quê?!"
32120-24 = "P-Para! Não chega perto! Eu não sei de nada, não quero saber e ainda é cedo demais pra isso!!"
32120-25 = "Te peguei♡"
32120-29 = "P-Para...! Paraaa! S-Socorro, Sensei...!"
32120-30 = "F-Foi mal, a culpa foi minha, me desculpa por falar sem respeito com uma veterana! Me perdoa, para com isso, isso aí ainda nãããooo!!!!"
32120-31 = "Entendo, então existe esse tipo de técnica de imobilização também. Parece útil em combate corpo a corpo... Aprendi algo novo."
32120-32 = "Porém, sinto que há muitos movimentos desnecessários. Se fosse eu, teria travado a articulação dois tempos antes."
32120-34 = "..."
32120-35 = "S-Senseeei..."
32120-36 = "[s] \"... É, eu também vou dar o meu melhor.\""
32120-37 = "C-Conto com você..."
32120-38 = "Se continuar assim, nós realmente... todas nós vamos acabar expulsas..."
32120-40 = "(Depois disso, tentei me encontrar com a Nagisa, mas não consegui achá-la.)"
32120-41 = "(Da mesma forma, tentei entrar em contato de algum jeito com a Mika, mas não fazia ideia nem de onde ela estava.)"
32120-43 = "Alojamento"
32120-44 = "No fim das contas, acabamos voltando para cá, né?"
32120-45 = "Saímos achando que já era uma despedida, e logo em seguida acontece isso. A vida realmente é imprevisível."
32120-46 = "Não é hora de ficar sentimental, né?! O que a gente vai fazer agora?!"
32120-47 = "Aliás, se as figuronas da Tea Party realmente estão tentando expulsar a gente, não tem o que fazer! Mesmo se juntarmos nossas cabeças, qualquer coisa que a gente faça vai ser inútil, não vai?!"
32120-48 = "Em teoria, o 3º Exame Especial de Proficiência Acadêmica daqui a uma semana ainda é a nossa última chance, mas..."
32120-49 = "Sendo sabotadas de todas as formas possíveis até agora, realmente pode ser bem difícil."
32120-50 = "Auu..."
32120-51 = "P-Pra começo de conversa, por que as coisas ficaram assim?! Por que a gente tem que ser expulsa?!"
32120-52 = "Essa história de \"traidora da Trinity\" não faz o menor sentido! Por que é que estão suspeitando da gente?!"
32120-53 = "Se eu for mesmo expulsa... nunca mais vou poder voltar para o Comitê de Justiça..."
32120-54 = "Koharu-chan..."
32120-55 = "..."
32120-59 = "[ns] \"... Desculpem. Foi porque eu disse aquilo para a Nagisa...\""
32120-60 = "... Não. Pelo que ouvimos da história, você disse aquilo por nossa causa, não foi, Sensei? Pelo contrário, nós é que devemos agradecer."
32120-61 = "Se eu estivesse lá naquela hora, talvez tivesse feito algo ainda pior com aquela gatinha."
32120-62 = "..."
32120-63 = "Conseguir tirar mais de 90 pontos em apenas uma semana..."
32120-64 = "Pois é... Além disso, precisamos ficar de olho para que a Nagisa-san não tente mais nenhuma tramóia..."
32120-68 = "Snif... É impossível, totalmente impossível... Eu já me esforcei tanto até aqui, fazer mais do que isso..."
32120-69 = "Eu me esforcei de verdade... Mas mais do que isso já não dá pra mim... Eu sou burra... Não tem como... Uuu..."
32120-70 = "Koharu..."
32120-71 = "Koharu-chan..."
32120-73 = "P-Por enquanto, que tal descansarmos por hoje?"
32120-74 = "Eu acho que com certeza deve haver algum jeito... Não, tem que haver. Vou dar o meu melhor para encontrar. E o Sensei também vai nos ajudar..."
32120-75 = "Hifumi-chan, é melhor você descansar direitinho também, viu...? Você vem se forçando demais esse tempo todo..."
32120-76 = "M-Mas se eu não me esforçar agora..."
32120-77 = "Eu também vou pensar junto com você. Vou ajudar tanto nos estudos da Koharu-chan quanto com você, Hifumi-chan."
32120-78 = "... De qualquer forma, vamos descansar por hoje."
32120-79 = "É... você tem razão. Tudo bem."
32120-83 = "Bom, vamos encerrar por aqui hoje. Bom trabalho a todos."
32120-86 = "Faltam 6 dias para o último Exame Especial de Proficiência Acadêmica"
32120-90 = "..."
32120-95 = "..."
32120-98 = "Próximo;Mesmo Assim"
