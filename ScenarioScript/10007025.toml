[translation]
10007025-1 = "Эпизод 2;Добро пожаловать на курорт горячих источников №227!"
10007025-5 = "Вход на курорт горячих источников"
10007025-7 = ""
10007025-8 = "Ч-Ч-Ч..."
10007025-9 = "Что это за чудовище?!"
10007025-10 = "[s] «Довольно впечатляющий курорт. Они отлично постарались.»"
10007025-11 = "Как ты смеешь восхищаться незаконной деятельностью, товарищ!"
10007025-12 = "Студенты спецотряда должны были жить так, как я задумала: в нищете, без единой веточки для костра. А не купаться в роскоши на курорте..."
10007025-13 = ""
10007025-16 = ""
10007025-17 = ""
10007025-19 = "*вздыхает* Какая потрясающая ванна."
10007025-20 = "Ты пробовала бутылочный чай с молоком из магазина? Он такой вкусный!"
10007025-21 = "Давай снова приедем следующей зимой."
10007025-22 = ""
10007025-26 = "Честно говоря, я многого не ожидала, но действительно удивлена."
10007025-27 = "На фоне этих снежных пейзажей местные источники, возможно, даже лучше гехеннских."
10007025-28 = ""
10007025-30 = ""
10007025-31 = "Это студенты из других школ?!"
10007025-32 = "Ты хочешь сказать, незаконное сооружение, не санкционированное Секретариатом, о существовании которого я узнала только сегодня..."
10007025-33 = ""
10007025-34 = "...стало туристической достопримечательностью популярнее моего тематического парка «Белые усы»?"
10007025-35 = "Даже мои усы чувствуют мою ярость! Я вычищу до последнего студента, причастного к этому безобразию!"
10007025-36 = ""
10007025-39 = ""
10007025-40 = "Кто шумит перед нашим заведением?"
10007025-41 = "Даже если вы гости, если вы мешаете нашей работе, нам ничего не остаётся, кроме как..."
10007025-42 = ""
10007025-44 = ""
10007025-45 = "Президент Черино? И Сенсей тоже?!"
10007025-46 = "Ч-Ч-Что привело вас сюда?"
10007025-47 = "[s1] «Привет, Нодока. Мне нравится твоё кимоно.»\n[s2] «Я хотел искупаться.»"
10007025-48 = "Вообще-то вопросы здесь задаю я!"
10007025-49 = "Вообще-то вопросы здесь задаю я!"
10007025-50 = "Если не хотите быть вычищенными в ближайшие 7,34 секунды, немедленно объясните себя и свою незаконную деятельность!"
10007025-51 = "Э-э, ну... М-м-м..."
10007025-52 = ""
10007025-54 = ""
10007025-55 = ""
10007025-56 = "Здравствуйте и добро пожаловать на курорт горячих источников №227, о Великий Вождь!"
10007025-57 = "Мы готовы исполнить любую вашу прихоть, чтобы вы вернулись домой посвежевшей, расслабленной и готовой встретить новый день!"
10007025-58 = "Не пытайся меня задобрить. И как ты посмела сменить название клуба без моего разрешения?! Курорт горячих источников №227? Какая нелепость!"
10007025-59 = "Спецотряд №227 всё равно никогда не был настоящим клубом, это была просто твоя прихоть! Так что мы будем называться как хотим!"
10007025-60 = "Мы, участницы спецотряда, уже не те, что раньше!"
10007025-61 = "Горячие источники превратили нас из разочарованных отстранённых студентов без надежды на будущее вот в это!"
10007025-62 = "Нищета осталась в прошлом, как только мы стали популярны по всему Кивотосу."
10007025-63 = "Помнишь? Ты оставила нас буквально с двумя палками для костра и чёрствым хлебом."
10007025-64 = "Но угадай что? Теперь я ем целых два пудинга! С каждым приёмом пищи!"
10007025-65 = "Она сказала два пудинга?"
10007025-66 = "[s] «Два — это вроде не так уж много...»"
10007025-67 = "Ну, раньше во всей академии Красной Зимы только один человек мог позволить себе по два пудинга за каждый приём пищи."
10007025-68 = "А теперь у меня два пудинга и новые линзы для телескопа, с которыми я могу приближать с огромного расстояния!"
10007025-69 = "Хм... посмотрим... Что ещё изменилось..."
10007025-70 = "Если честно, теперь мы настолько неприлично богаты, что я не успеваю тратить деньги."
10007025-72 = ""
10007025-74 = ""
10007025-75 = "Я этого не потерплю."
10007025-76 = "Я отправила вас сюда в наказание. Вы должны были обдумывать своё бунтарское поведение, а вместо этого живёте как королевы и едите пудинг, когда захотите."
10007025-77 = "Подготовить «Чистильщик №1»! Я заставлю вас смотреть, как вычищу ваш драгоценный курорт, а потом вычищу и вас!"
10007025-78 = "Т-Ты с ума сошла?! Пожалуйста, пожалуйста, остановись!"
10007025-79 = "Я столько лет страдала, плакала и боролась. А теперь ты хочешь отнять у меня даже это крошечное счастье, которое я нашла в своём маленьком уголке жизни?"
10007025-80 = "И вообще, мы ведь не доставляем никаких проблем ни президенту Черино, ни Секретариату, верно?"
10007025-81 = "Н-Наверное, нет, но..."
10007025-82 = "Нет! Я не позволю! Ваша роскошная жизнь угрожает моему авторитету Великого Вождя. Если другие студенты это увидят, они поднимут мятеж во главе с вами."
10007025-83 = "Хмф. Ты не оставляешь мне выбора."
10007025-84 = ""
10007025-86 = ""
10007025-87 = ""
10007025-88 = "Шигурэ, выноси!"
10007025-90 = "Что ты такое говоришь? Томоэ, она мне угрожает!"
10007025-91 = ""
10007025-94 = ""
10007025-95 = ""
10007025-96 = "Здравствуйте, президент Черино. Пожалуйста, не пугайтесь, это всего лишь мандзю «Усы горячих источников», которое я приготовила специально для вас."
10007025-97 = "Взятка, говоришь?"
10007025-98 = "Возможно, ты думаешь, что сможешь склонить меня на свою сторону рисунком усов, но ты сильно меня недооцениваешь, если считаешь, что меня тронет какое-то второсортное мандзю, сделанное вами, изгоями."
10007025-99 = "Почему бы просто не попробовать?"
10007025-100 = "Ты что-то слишком уверена в этой скучной старой сладости из мерзкого старого источника."
10007025-101 = ""
10007025-103 = ""
10007025-105 = ""
10007025-106 = ""
10007025-107 = ""
10007025-108 = "Сладко?!"
10007025-109 = "Какое идеальное, успокаивающее сочетание. Мягкое, упругое тесто и нежная начинка соединяются в совершенно неотразимый вкус."
10007025-110 = "Правда ведь? Прибыль от курорта позволяет нам покупать только самые качественные ингредиенты — специально для президента."
10007025-111 = "Я даже заручилась одобрением гурманов со всего Кивотоса, прежде чем осмелилась подать это нашему Великому Вождю."
10007025-112 = "Что скажете, президент Черино?"
10007025-113 = "Если вы признаете наш курорт, наше фирменное мандзю будет всегда к вашим услугам, как и бесплатные билеты в любое время."
10007025-114 = "Хмф, разумеется, я не могу просто проигнорировать столь искренние и серьёзные просьбы."
10007025-115 = "И это совершенно не связано с восхитительным мандзю «Усы горячих источников»!"
10007025-117 = "При всём уважении к мнению президента Черино, я просто не могу это пропустить. Это по-прежнему незаконный курорт, построенный без разрешения Секретариата."
10007025-118 = "Я согласна. Такое сооружение угрожает авторитету Секретариата и самой академии Красной Зимы."
10007025-119 = ""
10007025-121 = ""
10007025-122 = ""
10007025-123 = "Томоэ, прекрасная, дорогая Томоэ. Ты знала, что на этом курорте есть настолько большая купальня, что в ней можно мыться всем вместе?"
10007025-124 = "Только представь: ты, президент Черино, общая купальня. Такая близость с Великим Вождём Черино, о которой ты и мечтать не могла."
10007025-125 = "Купальня...? С президентом Черино?"
10007025-126 = "Я тут внезапно вспомнила: буквально вчера в открытой купальне я встретила огромного медведя, наслаждавшегося отдыхом."
10007025-127 = "Снежный пейзаж, тёплая вода, пушистая шерсть медведя... Это было по-настоящему невероятно."
10007025-128 = "Купаться с пушистым медведем?"
10007025-129 = "Поразмыслив ещё раз, я считаю, что существование курорта горячих источников действительно может принести академии Красной Зимы пользу."
10007025-130 = "Подобные купальни можно считать необходимыми для здоровья и чистоты членов Секретариата."
10007025-131 = "Как и пушистых медведей, хотя меня это совершенно не касается."
10007025-132 = "Я полностью согласна с вашими наблюдениями, мудрые члены Секретариата! Пожалуйста, позвольте проводить вас внутрь."
10007025-133 = "Раздевалка в эту сторону!"
10007025-134 = ""
10007025-136 = ""
10007025-137 = "Фух, наконец-то этот бред закончился."
10007025-138 = "Я-Я-Я вовсе не хотела сказать, что ты мешаешь или что-то такое, Сенсей!"
10007025-139 = "На самом деле я очень рада, что ты пришёл."
10007025-140 = "[s3] «Ты отлично здесь справляешься.»\n[s4] «Я рад, что теперь в бывшем институте ты выглядишь немного счастливее.»"
10007025-141 = "Да, из-за курорта я стала занята ещё больше, чем раньше, но... зато смогла сделать столько вещей, которые всегда хотела!"
10007025-142 = "Да, из-за курорта я стала занята ещё больше, чем раньше, но... зато смогла сделать столько вещей, которые всегда хотела!"
10007025-143 = "Представляешь, я наконец-то купила новые линзы для телескопа? И ты видел лицо Черино, когда я сказала, что ем по два пудинга за каждый приём пищи?"
10007025-144 = "И под предлогом обслуживания купален наблюдать, как купаются студенты из других школ..."
10007025-145 = "...А!"
10007025-146 = "П-Притворись, что не слышал эту часть! Пуф! Сотри её из памяти!"
10007025-147 = "[s] «...Теперь мне внезапно стало тревожно.»"
10007025-148 = "Н-Не о чем тревожиться, Сенсей! На курорте горячих источников №227 комфорт гостей для нас всегда на первом месте."
10007025-149 = ""
10007025-151 = ""
10007025-152 = ""
10007025-153 = ""
10007025-155 = ""
10007025-157 = "Пожалуйста, возьмите этот халат!"
10007025-158 = "Позволь мне лично, как управляющей, провести для тебя отдельную экскурсию."
10007025-159 = "Я даже отведу тебя в отдельную купальню — только для Сенсея."
10007025-160 = "*тяжело дышит* *тяжело дышит*"
10007025-161 = ""
10007025-167 = "Под пронзительным взглядом Нодоки я направился к открытой купальне..."
