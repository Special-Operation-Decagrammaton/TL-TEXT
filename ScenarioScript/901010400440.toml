[translation]
901010400440-6 = "Perguntei para os trabalhadores do porto sobre o \"Caranguejo de Tambor de Óleo\"."
901010400440-7 = "A reação quase unânime foi de espanto: ninguém nunca viu caranguejo em tambor e acharam uma tolice sem tamanho."
901010400440-8 = "Caranguejo vivo precisa respirar; num tambor sufocaria logo. Por isso sempre usam caixas de madeira forradas com serragem úmida."
901010400440-9 = "Além disso, tambor de óleo metálico é bem mais caro que caixote de madeira, ninguém usa isso com bicho vivo."
901010400440-10 = "Ou seja, a menos que quisessem queimar dinheiro à toa, não há razão prática para colocar caranguejos num tambor."
901010400440-12 = "Mas o boato não diz que o tambor tava lotado até a boca de caranguejos?"
901010400440-13 = "...Tipo um pote de vidro socado de insetos rastejantes."
901010400440-14 = ""
901010400440-16 = ""
901010400440-17 = "Eca! Não usa uma imagem nojenta dessas, me deu até calafrio!"
901010400440-18 = ""
901010400440-20 = ""
901010400440-22 = "Pensando bem... talvez esse fosse o objetivo exato."
901010400440-23 = "Quando alguém enfatiza um elemento tão visual e aberrante, sempre há uma intenção por trás."
901010400440-24 = "O motivo do caranguejo da lenda estar trancafiado num tambor de óleo é provavelmente—"
901010400440-25 = ""
901010400440-27 = ""
901010400440-28 = ""
901010400440-31 = ""
901010400440-32 = "O motivo do caranguejo da lenda estar trancafiado num tambor de óleo é provavelmente—\n[as1] Por ser um método de estocagem realista.\n[as2] Para fazer propaganda de tambores de óleo.\n[as3] Para incitar o terror psicológico."
901010400440-33 = ""
901010400440-35 = ""
901010400440-36 = "...Ué? A Niko acabou de dizer que caranguejo morre sufocado em tambor e que ninguém usa isso no transporte."
901010400440-37 = "Se fosse pra ensinar método de estocagem, usariam caixote de madeira, não?"
901010400440-38 = "Você tava ouvindo a conversa? Tenta de novo, Sensei."
901010400440-39 = ""
901010400440-41 = ""
901010400440-42 = ""
901010400440-43 = ""
901010400440-46 = ""
901010400440-48 = ""
901010400440-49 = "Duvido muito que a história faça uma propaganda positiva de tambores de óleo..."
901010400440-50 = "E pra que fazer propaganda de tambor industrial pra dona de casa?"
901010400440-51 = "...Acho que não foi bem por aí."
901010400440-52 = ""
901010400440-54 = ""
901010400440-55 = ""
901010400440-56 = ""
901010400440-59 = ""
901010400440-61 = ""
901010400440-62 = "...Instigar o terror, exatamente."
901010400440-63 = "A visão de dezenas de pinças se debatendo num tonel escuro gera um pavor psicológico primário imediato."
901010400440-64 = "A imagem de uma massa viva fervilhando num espaço confinado ativa nosso instinto básico de aversão e fuga."
901010400440-65 = "A maioria dos animais peçonhentos e perigosos desencadeia padrões visuais parecidos na nossa mente..."
901010400440-66 = "Ah, tipo aquele bicho cascudo rastejando no cantinho escuro da cozinha—"
901010400440-67 = "Nem termine essa frase, por favor."
901010400440-68 = "Então tem alguém querendo espalhar asco e pânico de propósito?"
901010400440-69 = "Mas se isso não dá um tostão no bolso, por que se dar ao trabalho...?"
901010400440-70 = "Não subestime a maldade humana, FOX3."
901010400440-71 = "Dá uma olhada na internet. Você acha que quem posta fotos grotescas e lendas macabras precisa de motivo?"
901010400440-72 = "Se fosse só uma pegadinha de mau gosto como a FOX4 sugeriu, vá lá... mas há desaparecimentos reais no meio."
901010400440-73 = "Como o caso do novato do pesqueiro."
901010400440-74 = "Será que... assim como o Kunekune, não temos uma anomalia de Lore agindo nas sombras?"
901010400440-75 = "Um monstro manifestado a partir do medo de caranguejos comedores de gente... Só de imaginar já dá arrepio."
901010400440-77 = "Tirar conclusões precipitadas é perigoso. #nOs sumiços e a lenda urbana podem ser incidentes totalmente desconexos."
