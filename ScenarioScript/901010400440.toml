[translation]
901010400440-6 = "Теперь о том, как местные отреагировали на слух о крабах в бочке..."
901010400440-7 = "Почти никто в порту никогда даже не видел «бочку с крабами». Они были озадачены завязкой истории."
901010400440-8 = "Большинство видов живых крабов погибнут, если запечатать их в герметичной ёмкости вроде бочки, поэтому их обычно перевозят в деревянных ящиках с опилками."
901010400440-9 = "Кроме того, бочки намного дороже деревянных ящиков. Для перевозки живых существ их почти не используют."
901010400440-10 = "Если только кто-то намеренно не хочет выбросить деньги на ветер, причин перевозить крабов в бочке нет."
901010400440-12 = "Но в слухах крабы ведь были набиты внутрь бочки, верно?"
901010400440-13 = "...Как насекомые, ползающие друг по другу, запертые в тесной ловушке."
901010400440-14 = ""
901010400440-16 = ""
901010400440-17 = "Хватит так говорить! От этого мурашки по коже!"
901010400440-18 = ""
901010400440-20 = ""
901010400440-22 = "...Нет. Может, именно в этом и цель."
901010400440-23 = "Если какой-то образ постоянно подчёркивают, значит, на то есть причина. Этот образ должен передать сообщение."
901010400440-24 = "Причина, по которой городская легенда так зациклена на крабах в бочке, вероятно, в том, что..."
901010400440-25 = ""
901010400440-27 = ""
901010400440-28 = ""
901010400440-31 = ""
901010400440-32 = "#Q;유키노;Причина, по которой городская легенда так зациклена на крабах в бочке, вероятно, в том, что...\n[as1] «Это реалистичный способ хранения.»\n[as2] «Они хотят продавать больше бочек.»\n[as3] «Они хотят вызвать страх.»"
901010400440-33 = ""
901010400440-35 = ""
901010400440-36 = "...Хм? Мы ЖЕ ТОЛЬКО ЧТО сказали, что в бочках крабы погибнут. Это непрактично."
901010400440-37 = "Если бы хотели подчеркнуть, что крабов нужно сохранить живыми, в слухах упоминали бы деревянный ящик."
901010400440-38 = "Подумайте ещё раз, Сенсей."
901010400440-39 = ""
901010400440-41 = ""
901010400440-42 = ""
901010400440-43 = ""
901010400440-46 = ""
901010400440-48 = ""
901010400440-49 = "Не думаю, что эта городская легенда выставляет бочки особенно привлекательным товаром."
901010400440-50 = "И зачем вообще рекламировать обычным людям промышленные бочки?"
901010400440-51 = "...Мне кажется, это неправильно."
901010400440-52 = ""
901010400440-54 = ""
901010400440-55 = ""
901010400440-56 = ""
901010400440-59 = ""
901010400440-61 = ""
901010400440-62 = "...Страх."
901010400440-63 = "Вы правы. В самой идее есть что-то тревожное и клаустрофобное. Бесчисленные существа копошатся на дне бочки, скрытые от глаз..."
901010400440-64 = "Люди инстинктивно испытывают отвращение к плотно сбившимся вместе существам."
901010400440-65 = "У многих ядовитых существ в природе встречаются похожие узоры..."
901010400440-66 = "А, поняла! Как те мерзкие ползучие твари, что прячутся в кухонном шкафу. Ну, тара—"
901010400440-67 = "Хватит. Мы поняли. Без подробностей."
901010400440-68 = "То есть кто-то намеренно разжигает страх? Даже истерию?"
901010400440-69 = "Но зачем? Прибыли из этого не получить."
901010400440-70 = "Ты слишком легко относишься к этому миру, FOX 3."
901010400440-71 = "Посиди пару часов в интернете и увидишь кучу людей, которые без всякой причины делятся жуткими фотографиями."
901010400440-72 = "Может быть, но это не просто чей-то больной розыгрыш. Люди действительно пропали."
901010400440-73 = "Например, тот молодой рыбак с краболовного судна."
901010400440-74 = "А если это аномалия Лора, как кунэ-кунэ?"
901010400440-75 = "Аномалия, вдохновлённая крабом-убийцей? От одной мысли уже кошмар..."
901010400440-77 = "Не стоит делать поспешных выводов. Исчезновения людей и городская легенда могут быть вообще не связаны."
