[translation]
90000090-1 = "Эпизод 10;Исследование, Часть 8: Кетер"
90000090-2 = "Клубная комната Отряда Исследования Сверхъестественного"
90000090-5 = "Благодарю за терпение. Вот краткое описание по заданию."
90000090-6 = ""
90000090-9 = ""
90000090-10 = "...Ого!"
90000090-11 = "[s1] «Ого...»\n[s2] *аплодисменты*"
90000090-12 = "...Эм, из-за вас я чувствую себя так, будто собираюсь выступить на школьном фестивале искусств."
90000090-13 = "...Эм, из-за вас я чувствую себя так, будто собираюсь выступить на школьном фестивале искусств."
90000090-14 = "Я всего лишь предлагаю другой маршрут проникновения, исходя из закономерностей поведения Кетера."
90000090-15 = "Да, но никто другой не смог бы проанализировать его поведение и разработать такой маршрут. Так что считайте, мы очень впечатлены."
90000090-16 = "[s] «Впечатляет. Отличная работа!»"
90000090-17 = "...Спасибо."
90000090-18 = "Как бы я ни старалась, скрыть мою гениальность просто невозможно. Всё так же, как и с моей исключительной красотой: она столь очевидна, что её невозможно не заметить."
90000090-19 = "Хаха... Неплохо, Эйми. Молодец, что заметила мой выдающийся интеллект! Хи-хи-хи."
90000090-20 = "...Ага, да. Его и правда совершенно невозможно не заметить... Он прямо подавляет..."
90000090-21 = "Хи-хи. Да-да, конечно."
90000090-22 = "[s] «(Ох, Эйми такая заботливая...)»"
90000090-25 = "Прежде всего, я проанализировала координаты, где появлялся Кетер, чтобы очертить территорию его защиты."
90000090-26 = ""
90000090-30 = "Он сосредоточен у самого края Района Затопленных Руин. Там много исследовательских объектов и лабораторий..."
90000090-31 = "Для удобства будем называть его «Район Исследований.»"
90000090-33 = "Район Исследований... Значит, это наша цель."
90000090-34 = "Верно. Если точнее, наша конечная цель — место, где был обнаружен сигнал Декаграмматона."
90000090-35 = "И чтобы туда попасть, нам придётся избежать пророка Кетера..."
90000090-36 = "И даже если нам удастся от него уйти, всё равно придётся найти источник обнаруженного сигнала и исследовать район..."
90000090-37 = "Кетер всё это время будет следовать за нами по пятам, из-за чего задача становится почти невыполнимой."
90000090-38 = "Поэтому я пришла к выводу, что нейтрализовать Кетера абсолютно необходимо."
90000090-39 = "Значит, наша новая цель — победить Кетера?"
90000090-40 = "Верно. И начиная с этого момента наша задача — собрать всю возможную информацию, которая поможет нам достичь этой цели!"
90000090-41 = "Если до сих пор мы играли в тактические прятки, то теперь это тактические салки!"
90000090-42 = "То есть Кетер теперь водит?.. Или нет, погодите..."
90000090-43 = "[s] «Да. Теперь водим мы.»"
90000090-44 = "Именно. Наша операция по сбору данных для атаки на Кетера начинается прямо сейчас!"
