[translation]
10031040-1 = "Эпизод 4;Философия председателя"
10031040-2 = "На второй день подготовки вечеринки Геенны Общества Пандемониума мне позвонила Макото."
10031040-6 = ""
10031040-7 = "Приветствую, Сенсей. Похоже, подготовка к нашей вечеринке идёт гладко."
10031040-8 = "Интересно, усердно ли глава Дисциплинарной комиссии, которой досталась ОЧЕНЬ важная роль на этой вечеринке, упражняется на пианино. Кихехе."
10031040-9 = "Не терпится увидеть, как у неё всё получится."
10031040-10 = "[s] «Уверен, Хина выкладывается изо всех сил.»"
10031040-11 = "Вот как?"
10031040-12 = "Хмпф... Ну, я с нетерпением жду того цирка, которым наверняка станет её выступление..."
10031040-13 = "Кихехе. Но это всё в сторону. На мне лежит огромная ответственность — убедиться, что подготовка к Особой вечеринке Геенны идеальна!"
10031040-14 = "Сенсей, кроме музыки, выступлений и развлечений, что, по-твоему, важнее всего на вечеринке?"
10031040-15 = "[s1] «Ну... надо помнить, зачем вообще устраиваешь вечеринку.»\n[s2] «Хм... Хорошая еда. Без хорошей еды нельзя.»"
10031040-16 = "Хм... Понятно. В этом есть смысл, Сенсей."
10031040-17 = "Устраивая вечеринку, хороший лидер должен учитывать её смысл и последствия... А не только порядок программы."
10031040-18 = "Именно это ты пытался сказать, да?"
10031040-19 = "[s3] «Нет. Я бы не заходил так далеко...»"
10031040-20 = "Не беспокойся. У этой вечеринки есть благородная цель — показать всем величие моего правления."
10031040-21 = "И продемонстрировать достижения Общества Пандемониума! Кекеке!"
10031040-22 = "Кроме того, вкусная еда на такой вечеринке обязательна!"
10031040-23 = "Кекекеке! Именно так, Сенсей!"
10031040-24 = "Помимо развлечений, о которых я говорила, нужна хорошая еда, чтобы привлечь внимание гостей."
10031040-25 = "Поэтому для этого события я заказала кейтеринг у Клуба школьного питания."
10031040-26 = "Позже сегодня я назначила дегустацию, чтобы проверить их еду. Убедимся, что она соответствует нашим стандартам. Геенна не станет довольствоваться помоями."
10031040-27 = "Если у тебя есть время, хочу попросить твоей помощи, Сенсей. Что скажешь?"
10031040-28 = "[s] «Хорошо. Понял. Скоро буду.»"
10031040-29 = "Кихехе. Буду ждать."
10031040-30 = ""
10031040-32 = ""
10031040-41 = "Я прибыл на место вечеринки Геенны, чтобы выполнить обещание Макото."
10031040-42 = "[ns] «Похоже, всё начинает складываться.»"
10031040-43 = "Я осматривал ярко украшенную площадку, пытаясь найти Макото."
10031040-44 = ""
10031040-47 = ""
10031040-48 = "*вздыхает* Что здесь вообще происходит?"
10031040-49 = "Дай угадаю... Сацуки опять что-то натворила?"
10031040-50 = "Н-Нет! Я невиновна! Я-я в этот раз ничего не делала!"
10031040-51 = "Ну, думаю, всё будет нормально? Посмотрите на эту страсть! На этот накал!"
10031040-52 = "Это завораживает. Тем более что обычно мы не видим Макото с этой стороны. Как секретаря, это зажигает во мне настоящий огонь!"
10031040-53 = "А! Отличный заголовок для газеты Общества Пандемониума! Наверняка продадим кучу экземпляров!"
10031040-54 = "Правда, Ироха?!"
10031040-55 = ""
10031040-57 = ""
10031040-58 = ""
10031040-59 = ""
10031040-60 = ""
10031040-62 = "...Такие выходки продают газеты?"
10031040-63 = "Чиаки. Немного настоящего совета: если ты не шутила, советую выработать вкус получше."
10031040-64 = "Жестоко!"
10031040-65 = "[s] «Извините... Что здесь происходит?»"
10031040-66 = "А! Это же Сенсей!"
10031040-67 = "Сенсей! Вон то! Там, там! Макото вон там!"
10031040-68 = "[s] «Макото?»"
10031040-70 = ""
10031040-71 = "..."
10031040-72 = "Почему мы..."
10031040-73 = "[s] «Мы...?»"
10031040-74 = "Почему наша жизнь так изматывает?"
10031040-75 = "Причина проста! Всё из-за борьбы за счастье!"
10031040-76 = "Счастье — смысл жизни. Конечная цель!"
10031040-77 = "Следовательно, жизнь можно определить как бесконечную борьбу и стремление достичь этой цели!"
10031040-78 = "И тогда я, Великая Макото, осознала! Что нужно человеку для достижения этого счастья? Что нужно, чтобы продолжать идти вперёд?"
10031040-79 = "Я размышляла над этим вопросом. Думала бесконечно, пока... Да! Вот оно! Это сама МЫСЛЬ!"
10031040-80 = "Я мыслю, следовательно, существую!!"
10031040-81 = "Я существую!!"
10031040-82 = "Я существую!"
10031040-83 = ""
