10031040-92 = ""
10031040-93 = "[ns] «Э-Эм... Что здесь происходит? Почему Макото—?»"
10031040-94 = "Макото ведёт себя странно."
10031040-95 = "Это слишком мягко сказано. Будто она стала совершенно другим человеком."
10031040-96 = "...Правда? Может, у неё случилось какое-то духовное пробуждение."
10031040-97 = "[s] «...А?»"
10031040-98 = "Как ни крути, это всё равно ненормально."
10031040-99 = "Мне снились такие кошмары. Но увидеть это прямо перед глазами..."
10031040-100 = "Кто-нибудь ущипните меня, пожалуйста."
10031040-101 = "Ага. Это точно кошмар."
10031040-102 = "[s] «Вы двое безжалостны...»"
10031040-103 = "С каких пор Макото вообще волнует смысл жизни?"
10031040-104 = "Погодите. Макото сегодня не ела ничего странного?"
10031040-105 = ""
10031040-107 = ""
10031040-109 = ""
10031040-110 = "О, если подумать..."
10031040-111 = "Разве председатель не пробовала еду Клуба школьного питания?"
10031040-113 = "...Еду Клуба школьного питания?"
10031040-115 = "Ага. Я слышала, что президент Клуба школьного питания сейчас отсутствует..."
10031040-116 = ""
10031040-117 = "Поэтому её младшие товарищи приготовили образцы еды для вечеринки вместо неё..."
10031040-118 = ""
10031040-119 = ""
10031040-121 = "[ns] «...А.»"
