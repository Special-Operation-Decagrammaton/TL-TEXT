[translation]
104100-1 = "Эпизод 10; Эпилог 2"
104100-3 = "Удачи всем!"
104100-4 = "Ух... Я-я не знаю ни одного ответа... Ни одного..."
104100-5 = "Хи-хи... Все были настолько заняты, что времени готовиться к экзамену почти не осталось."
104100-6 = "Да. Я не знаю ответа ни на один из этих вопросов. Но постараюсь изо всех сил."
104100-7 = "Какая разница, как сильно ты постараешься! Тут даже угадать нельзя! Все вопросы с развёрнутым ответом!"
104100-8 = "...Ага."
104100-9 = "Хи-хи. Похоже на то... Видимо, нас ждут новые дополнительные занятия."
104100-10 = "*вздыхает*"
104100-12 = "Береги себя, Саори."
104100-13 = "Н-Но..."
104100-14 = "Хватит говорить глупости. Нельзя ставить на себе крест."
104100-15 = "Хи-хи-хи... Верно. Не стоит сдаваться."
104100-16 = "..."
104100-17 = "Всё хорошо. У тебя ещё много дел и много всего, что ты хочешь увидеть, Саори."
104100-18 = ""
104100-20 = ""
104100-21 = "Саори, мы больше не дети, о которых тебе нужно заботиться, так что иди."
104100-22 = "...Ладно."
104100-23 = ""
104100-25 = ""
104100-26 = ""
104100-27 = ""
104100-28 = "*бип-бип* Босс. Это я."
104100-29 = "Бандиты в шлемах! Всем немедленно собраться здесь!"
104100-30 = "Мы на них нападём! Они прокололи нам шины, так что теперь будут бесплатно работать на нас пятьдесят шесть часов!"
104100-31 = "Что?! Пятьдесят шесть часов...?!"
104100-32 = "Да! Это они! Агентство Решатели проблем 68 идёт... А-а-а!"
104100-33 = "Ч-Что это?! Быстро сюда! Если разберёшься с ними, я подумаю о том, чтобы платить тебе минималку!"
104100-34 = "Если хочешь и дальше получать от меня работу, поспеши! А-а!"
104100-35 = "...Хорошо. Уже иду."
104100-36 = ""
104100-38 = ""
104100-39 = "Ладно, все."
104100-40 = "...Такая занятая. Завидую."
104100-41 = "Звони нам хоть иногда, Лидер..."
104100-42 = "Счастливого пути, Саори."
104100-43 = "Да."
104100-45 = "..."
104100-46 = ""
104100-48 = ""
104100-49 = "...Береги себя, Лидер."
104100-51 = "Эй, Серика. Дай мне ещё одну миску."
104100-52 = "Что? Ещё одну?"
104100-53 = "И Широко тоже! Она так старалась, ей нужно хорошо поесть."
104100-54 = "Но я уже сыта..."
104100-56 = "Широко, нет! Ешь ещё! Мне кажется, даже я похудела. Ты работала куда больше, значит, должна есть ещё больше!"
104100-57 = "Х-Ха-ха... Похоже на то."
104100-58 = "Это всё хорошо, но... у вас есть деньги заплатить за этот рамэн? И нет! Картой Нономи пользоваться нельзя!"
104100-59 = "Денег у меня нет, но можно просто вычесть из зарплаты Серики!"
104100-60 = "Что?! Ты вообще о чём?!"
104100-61 = "Ну-ну, ещё одну миску, хозяин."
104100-62 = ""
104100-64 = ""
104100-65 = ""
104100-66 = "Раз уж все так старались, сегодня угощаю я."
104100-67 = "Всем по миске фирменного гигантского рамэна!"
104100-68 = "Что? Х-Хозяин, мы же уйдём в минус за день!"
104100-69 = "Эй! Хозяин, вы невероятно щедры!"
104100-70 = "Ух ты, спасибо! Но я заплачу!"
104100-72 = "Нет, не переживай. Иногда, особенно после такого, всем нужно хорошо поесть."
104100-73 = ""
104100-75 = ""
104100-76 = "А, хорошо... Спасибо."
104100-77 = "Х-Хм..."
104100-78 = "Серика, садись с нами и тоже поешь. Мне одиноко, когда тебя нет рядом."
104100-79 = "Ты вообще о чём?! Я сейчас на работе!"
104100-80 = "Всё нормально, Серика. Сегодня всё равно тихо."
104100-81 = "Ну... Может, и правда? Разок можно..."
104100-82 = "Да, Серика, садись."
104100-83 = "Рядом со мной свободно!"
104100-84 = ""
104100-86 = ""
104100-87 = "Ха! Серика, куда сядешь? Рядом с Широко или Нономи?"
104100-88 = "Знаешь, это может стать судьбоносным моментом в твоей жизни. Выбирай осторожно!"
104100-89 = ""
104100-91 = ""
104100-93 = "Эй! Сесть ко мне на колени — не один из вариантов!"
104100-94 = "Ой, молчи. Единственно правильный выбор — тот, от которого Хошино будет страдать!"
104100-95 = "Ох. Ух... Ты бы хоть мою больную спину пожалела..."
104100-96 = "Ха-ха... Тогда сяду рядом с Хошино..."
104100-97 = "Ура! ☆ Тогда и я подсяду поближе к Хошино."
104100-98 = "А я сяду сзади."
104100-99 = "Спереди?! Сзади?! Что это такое? Меня окружили страшные младшие..."
104100-100 = "Такими темпами... А-а-а...!"
104100-103 = "Ура! Я вернулась, Плана."
104100-104 = "Плана, вот дом, в котором ты теперь будешь жить!"
104100-105 = "Эм, м-м. Хорошо."
104100-106 = "...Спасибо, Арона."
104100-107 = "Нет, Плана! Мы же это обсуждали! Скажи эту фразу!"
104100-108 = "...Фразу?"
104100-109 = "Да! Ну ты знаешь! Сейчас идеальный момент!"
104100-110 = "...Мне правда обязательно это говорить?"
104100-111 = "(пристальный взгляд)"
104100-112 = "...Да."
104100-113 = ""
104100-115 = ""
104100-117 = ""
104100-118 = "Ну же, Плана! Пожалуйста?"
104100-119 = ""
104100-121 = ""
104100-122 = ""
104100-123 = "...Я дома, Арона."
104100-128 = "Хорошая работа... Рин."
104100-129 = "Хорошая работа, начальник штаба."
104100-130 = "...Да, т-так..."
104100-131 = "...Нет, Аюму. Пока голосование о недоверии мне не завершено... я буду держаться в тени. Я не могу снова подвергать вас опасности."
104100-132 = "Что ты... Снова? Ты же не..."
104100-134 = "Ты вообще невозможная, Рин! Мы ведь даже вместе в космос летали!"
104100-135 = "...Момока."
104100-136 = "Ну, я снова хотела сбежать, но... раз уж всё так вышло, похоже, выбора нет — придётся прикрывать Рин."
104100-137 = "Ха-ха. До самых краёв Вселенной, да?"
104100-138 = "...Аюму, Момока. Теперь, когда думаю об этом, я так вам и не сказала."
104100-139 = ""
104100-141 = ""
104100-142 = ""
104100-143 = "...Спасибо, что оставались рядом со мной."
104100-144 = "Р-Рин?"
104100-145 = "Ого... Наша Рин лично сказала нам спасибо?!"
104100-146 = "Плохой знак... Наверняка что-то случилось... Сейчас на нас обрушится катастрофа..."
104100-147 = "М-Момока..."
104100-148 = ""
104100-149 = "...Похоже, я и дальше буду полагаться на вашу поддержку. Рассчитываю на вас."
104100-150 = "Да! Я тоже!"
104100-151 = "А, ну! Раз уж придётся... Хе-хе."
104100-153 = "О! Рин, тебе пришло письмо."
104100-154 = "...Письмо?"
104100-155 = "Да, я положила его на твой стол."
104100-156 = "Обратного адреса не было, поэтому ради безопасности я его проверила. Но это обычное письмо. О! Я ничего не читала, честно."
104100-157 = "Спасибо. Я посмотрю."
104100-159 = "Ха-ха-ха. Давно не виделись, Сенсей."
104100-160 = "[s] «Ния!»"
104100-161 = "Работа Шале меня потрясла. Зрелище было до слёз впечатляющим. Правда невероятно!"
104100-162 = "[s] «Спасибо. Ты тоже хорошо постаралась, Ния.»"
104100-163 = "Итак... Сенсей..."
104100-164 = "Это... кое-что очень забавное... то есть важное для меня."
104100-165 = "[s] «А? Что такое?»"
104100-166 = "...Это правда, что вы голышом бегали по полю...?"
104100-167 = ""
104100-169 = ""
104100-170 = "[ns1] «...»\n[ns2] «Нет, это неправда. Правда, это недоразумение!»"
104100-173 = "...Я слышала от нескольких свидетелей, что вы, покрытый пылью и пеплом, голышом бежали к людям с планшетом в руках и улыбкой на лице."
104100-174 = "[s] «...»"
104100-175 = "...Хм, пожалуй, ради репутации Сенсея лучше не углубляться. Ня-ха-ха."
104100-176 = "[s] «...Ты связалась со мной только ради этого?»"
104100-177 = "Нет, вообще-то из-за новостей от Клуба исследования ниндзюцу."
104100-178 = "Ах, к слову, все они благополучно вернулись."
104100-179 = "И подтвердили, что встретили вице-президента Хяккарёран... Правда, существование Кузунохи подтвердить не смогли..."
104100-180 = "Но они принесли письмо от кого-то, кто представился Кузунохой."
104100-181 = "Якобы оно адресовано Сенсею из Шале. Может быть правдой, а может — уловкой."
104100-182 = "Я ещё не читала его, но отправлю вам."
104100-183 = "[s] «Спасибо, Ния.»"
104100-184 = "Ня-ха-ха. Разумеется. Надеюсь, пригодится."
104100-185 = "В следующий раз обязательно загляните в район Хяккияко. Мы планируем весёлый фестиваль."
104100-186 = ""
104100-188 = ""
104100-191 = "[ns] Прочитать текст письма, присланного Нией."
104100-194 = "Вы искали меня, Сенсей [USERNAME]? Хотя точнее будет сказать — собирались меня искать."
104100-195 = "В общем, если сразу к делу..."
104100-196 = "Вернуть сущность, обращённую Chroma, в исходное состояние невозможно."
104100-197 = "Это естественный закон этого мира, как и невозможность вернуть мёртвых к жизни."
104100-198 = "Но... если вы всё же хотите кого-то спасти..."
104100-199 = ""
104100-201 = ""
104100-202 = ""
104100-203 = "...приходите ко мне, Сенсей."
104100-208 = "Это то письмо?"
104100-210 = "Обратного адреса и правда нет."
104100-211 = "Так, посмотрим..."
104100-212 = ""
104100-215 = "«Ринни»."
104100-216 = "...Э-Это."
104100-217 = "Этот почерк..."
104100-218 = "..."
104100-219 = ""
104100-222 = "Президент Генерального ученического совета...?"
