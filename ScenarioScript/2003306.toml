[translation]
2003306-1 = "Повседневная деятельность Великого председателя"
2003306-3 = "Кихехех. Во время прошлой экскурсии я показала вам наши финансовые операции, Сенсей."
2003306-4 = "Эксклюзивная типография Общества Пандемониума... Монументальная Башня Макото, которую вот-вот построят... Мерч с Великой Макото, наш курорт..."
2003306-5 = "Множество дорог ведут к одной цели: расширить влияние Общества Пандемониума на Кивотос и увеличить известность Великой Макото!"
2003306-6 = "Прошло уже достаточно времени, чтобы результаты этих проектов начали проявляться."
2003306-7 = "Кихехехех! Шедевр Великой Ханумы Макото скоро развернётся прямо перед вашими глазами!"
2003306-8 = "Я вся на иголках в ожидании результатов! Разве вы не взволнованы, Сенсей?"
2003306-9 = "[s] «...Будет интересно посмотреть, чем закончатся твои планы, Макото.»"
2003306-10 = "Кихехехех! Я знала, что вы втянетесь, Сенсей! Можете сколько угодно изображать безразличие — в конце концов я вас покорю!"
2003306-11 = "Это неизбежно!"
2003306-12 = "Вы проявили достойную восхищения решимость, отказавшись от моего великодушного предложения даже после экскурсии по нашим операциям, Сенсей! Но даже вы не сможете отрицать результаты, которые сейчас развернутся перед нами..."
2003306-13 = "Вас охватит непреодолимое желание пасть к моим ногам и закричать: «Надо было объединиться с Обществом Пандемониума давным-давно! Прости, Макото — я потерял столько времени!»"
2003306-14 = "[s] «...Я бы не заходил так далеко.»"
2003306-15 = "Не бойтесь, Сенсей! У Великой Макото сострадательное сердце!"
2003306-16 = "Как бы сильно вы ни сожалели о своей ошибке, я никогда не позволю вам униженно молить у моих ног, Сенсей! Я всегда вас приму!"
2003306-17 = "[s] «С-Спасибо...»"
2003306-18 = "Нельзя терять время! Вернёмся к операциям и..."
2003306-19 = ""
2003306-25 = ""
2003306-26 = "П-Председатель! У нас большая проблема!"
2003306-27 = "Хм? Что случилось?"
2003306-29 = "Н-Ну... Только что позвонили из Типографии Пандемониума... Они не смогут сегодня выпустить вашу биографию!"
2003306-30 = "[s] «...Биографию?»"
2003306-32 = "Что за проблема? Я лично спланировала и одобрила каждый аспект производства!"
2003306-33 = "Н-Ну, председатель..."
2003306-34 = "Говорите уже!"
2003306-35 = "Я наполнила эту книгу драмой и борьбой бесчисленных конфликтов, которые преодолела, товариществом в сражениях бок о бок с клубом и мудрыми советами, которые наверняка тронут сердца студентов по всему Кивотосу─"
2003306-36 = "Моя биография гарантированно станет бестселлером года!"
2003306-37 = "[s] «Ого, Макото! Звучит невероятно!»"
2003306-38 = "П-Проблема в том, что..."
2003306-39 = "Они всё посчитали... и при такой себестоимости ваша запланированная цена просто невозможна, председатель!"
2003306-40 = "...Себестоимость?"
2003306-41 = "Вскоре сотрудник типографии прибыл лично доложить о ситуации."
2003306-42 = "Вы приказали сделать вашу биографию идеальной во всех отношениях, поэтому мы вложили огромное количество времени и сил в дизайн и издание..."
2003306-43 = "Мы заказали обложку у знаменитого художника и переплели каждую книгу в лучшую кожу, какую смогли купить..."
2003306-44 = "Один только прототип съел большую часть бюджета... а при таком подходе расходы на печать вырастут до астрономических значений. Печальная правда в том, что каждая проданная книга будет уводить нас всё глубже в минус."
2003306-45 = "На этом этапе само издание биографии может оказаться невозможным."
2003306-46 = "Ч-что?!"
2003306-47 = "Я всего лишь хотела сделать величайшую книгу, какую только можно... Это исторический выпуск моей первой биографии!"
2003306-48 = "[s] «То есть ты просто понеслась вперёд, не подумав...»"
2003306-49 = "Полагаю, проект придётся полностью переработать от начала до конца."
2003306-50 = "Ц...! Проклятье!"
2003306-51 = "...Ну, если бы каждый проект мгновенно становился огромным успехом, сотрудники могли бы не выдержать нагрузки, так что хорошо, что другим начинаниям ещё есть куда расти!"
2003306-52 = "Жаль... Но такие проблемы невозможно было предсказать..."
2003306-53 = ""
2003306-58 = "П-Председатель! Чрезвычайная ситуация!"
2003306-59 = "Опять?!"
2003306-60 = "Что на этот раз?!"
2003306-61 = "Нам сообщили, что строительство Башни Макото завершено, но когда мы приехали посмотреть...!"
2003306-63 = "Ч-что?!"
2003306-65 = "Ч-Ч-Ч—"
2003306-66 = "Что это такое?!"
2003306-67 = "Это здание... Башня Макото?!"
2003306-68 = "Что случилось с моим прекрасным небоскрёбом...? Где монумент моей власти, мой маяк для всего Кивотоса...?"
2003306-69 = "[s] «Это больше похоже на склад, чем на монумент...»"
2003306-70 = "Вот... У нас есть письмо от руководителя стройки!"
2003306-71 = "Что? Почему он не явился доложить лично?"
2003306-72 = "Нет, важнее другое — что написано в письме?!"
2003306-73 = "Эм, ну... В письме сказано..."
2003306-74 = ""
2003306-75 = "Председателю Макото, нашему великому харизматичному лидеру и обладателю непревзойдённого инвестиционного чутья."
2003306-76 = "Председатель. Спасибо, что доверили нам проект, столь дорогой вашему сердцу."
2003306-77 = "Как вы и просили, Башня Макото гордо возвышается на впечатляющие 400 дюймов — идеальное воплощение согласованного дизайна."
2003306-78 = "Хотя мы глубоко сожалеем, что не можем лично отпраздновать завершение контракта, непреодолимые обстоятельства вынудили нас уехать. Простите за отсутствие, но знайте: мысленно мы празднуем вместе с вами."
2003306-79 = ""
2003306-81 = ""
2003306-82 = "С нетерпением ждём возможности снова поработать с вами в будущем."
2003306-83 = ""
2003306-84 = "[ns] «Только не говорите... что под 400 дюймами они...»"
2003306-85 = "П-Принесите мне контракт на башню! И чертёж тоже!"
2003306-86 = "Да, председатель!"
2003306-87 = ""
2003306-89 = ""
2003306-90 = ""
2003306-91 = ""
2003306-92 = ""
2003306-93 = "*ахает*"
2003306-94 = "В-В контракте и чертеже единицы измерения и правда указаны в дюймах..."
2003306-95 = "Ургх... Я увидела число 400... и подумала, что наконец воплощу великую мечту... Мелкие детали оставила строительной компании и доверилась им!"
2003306-96 = "[s] «Разве масштаб — не самая важная часть строительства гигантского небоскрёба?»"
2003306-97 = "...Как они посмели предать моё доверие!"
2003306-98 = "Им это с рук не сойдёт!"
2003306-99 = "П-Председатель! У-У нас проблема!"
2003306-100 = "А-А? Ч-Что теперь?!"
2003306-102 = "Нам поступил отчёт: директор компании, производившей мерч с вашим образом, присвоил средства проекта и сбежал из города!"
2003306-103 = ""
2003306-105 = ""
2003306-106 = "И это ещё не всё! Отдел горячих источников напал на Курорт Пандемониума, обнаружив, что он построен прямо над горячим источником! Все попытки отбить здание они отразили!"
2003306-107 = ""
2003306-109 = ""
2003306-110 = "И-и ещё отчёт от команды туристического развития — один из наших пакетных туров по ошибке продали двум клиентам одновременно...! Они требуют выплатить огромный штраф!"
2003306-111 = ""
2003306-113 = ""
2003306-114 = "Угх. Ургх... Ах... Эм..."
2003306-115 = "Ц-ц!!!"
2003306-116 = ""
2003306-118 = ""
2003306-120 = "[ns] «М-Макото... ты в порядке?!»"
2003306-121 = ""
2003306-122 = "П-Председатель!!!"
2003306-124 = ""
2003306-125 = "Просто дышите...!"
2003306-126 = "[s] «М-Макото?»"
2003306-127 = "Если... вы... думали..."
2003306-128 = "Если вы думали, что Великая Макото рухнет от шока из-за таких мелочей, то вы жестоко ошибаетесь!!!"
2003306-129 = ""
2003306-130 = "П-Председатель Макото!!!"
2003306-132 = "*вдох*... Соберите всех членов клуба!"
2003306-133 = "Начнём с руководителя стройки: найдите каждую компанию, посмевшую предать Общество Пандемониума! Мы покажем им всю тяжесть их ошибки!"
2003306-134 = "Пора высвободить мою полную силу..."
2003306-135 = "Они заплатят за то, что насмехались надо мной! Пусть бегут хоть на край света... когда оглянутся, увидят меня прямо за спиной!"
2003306-136 = "...Все! Вы поняли?!"
2003306-137 = ""
2003306-138 = "Да, председатель!!!"
2003306-139 = ""
2003306-141 = ""
2003306-142 = "[ns] «...Ты потрясающая, Макото.»"
2003306-143 = "Хм?"
2003306-144 = "А. Я уже столько раз через такое проходила. Привыкла."
2003306-145 = "Кихехехех! В смысле, что я за лидер, если падаю в обморок раз в неделю?"
2003306-146 = "[s] «Да как часто у тебя вообще происходит такое?!»"
2003306-147 = "Какие-то жалкие неудачи меня не остановят!"
2003306-148 = "Захват Геенны Великой Макото — нет, всего Кивотоса — невозможно остановить!"
2003306-149 = "Я сокрушу любое препятствие на своём пути!"
2003306-150 = "Для начала выкорчу из района все лживые и мошеннические компании!"
2003306-151 = "[s] «...Хех. Звучит как план, Макото. Я помогу.»"
2003306-152 = "Кихехехех! Хорошо! А после этого мы вместе захватим Кивотос!"
2003306-153 = "[s] «...От этого пункта я пока откажусь.»"
2003306-154 = "Кихехехех! Ладно — оставим такие планы на будущее! А сейчас насладимся битвой, которая ждёт нас прямо здесь!"
2003306-155 = "Возвращаемся! Подайте лимузин!!!"
2003306-156 = "Э-Эм, председатель... Простите, но пока мы финансировали все новые проекты, случайно просрочили лизинговые платежи... Автокомпания забрала лимузин обратно."
2003306-157 = "..."
2003306-158 = "Эм, Сенсей... Не могли бы вы одолжить нам немного денег на общественный транспорт..."
2003306-159 = "[s] «К-Конечно, берите сколько нужно...»"
2003306-160 = "Кихехехех! Я знала, что наше партнёрство бесценно! Я у вас в долгу!"
2003306-161 = "Все! Общество Пандемониума выдвигается!"
2003306-162 = ""
2003306-163 = "Да, председатель!!!"
2003306-165 = "После этого я изо всех сил помогал Макото привести её финансы в порядок."
