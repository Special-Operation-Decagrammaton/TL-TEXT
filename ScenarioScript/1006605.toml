[translation]
1006605-1 = "Подготовка к выдвижению завершена!"
1006605-2 = "Я поспешил туда, куда позвала меня Арис."
1006605-3 = "Я осторожно нажал на дверной звонок..."
1006605-4 = ""
1006605-7 = "Это Вы, Сенсей?"
1006605-8 = "[s] «Ага. Я получил твоё сообщение.»"
1006605-9 = "О, Сенсей! Н-не сейчас!"
1006605-10 = "Не входите! Ещё рано..."
1006605-11 = "[s] «Я подумал, что что-то случилось. Всё в порядке?»"
1006605-12 = "Да! Но..."
1006605-13 = "Ик! Я рада, что вы пришли пораньше, но... сейчас немного... неудобно..."
1006605-14 = ""
1006605-19 = "[ns] «Арис, ты в порядке?!»"
1006605-21 = "Заволновавшись за Арис, я ворвался в комнату."
1006605-22 = "А потом..."
1006605-25 = "― С-Сенсей?![wa:820]"
1006605-27 = "― Я всё ещё готовлюсь...[wa:1560]"
1006605-30 = "#st;[-1200,-442];serial;60;― Я хотела показать вам, что преодолела свои страхи#nи успешно сменила класс на горничную...[wa:10]"
1006605-32 = "― Именно такой я хотела предстать перед вами...[wa:100]"
1006605-35 = "― Поэтому, пожалуйста,[wa:1840]"
1006605-37 = "― подождите, пока я буду готова.[wa:900]"
1006605-40 = "[ns] «Ты больше не боишься горничных?»"
1006605-41 = "― Именно! Я больше не боюсь горничных![wa:1460]"
1006605-43 = "― Я смогла этого добиться только потому, что вы были рядом, Сенсей.[wa:840]"
1006605-46 = "― Если я с вами...[wa:720]"
1006605-48 = "― тогда я смогу пройти любое подземелье в мире.[wa:1740]"
1006605-51 = "― Да! Я готова к новому приключению![wa:2560]"
1006605-54 = "Я подождал, пока Арис не почувствовала, что готова выйти."
1006605-58 = ""
1006605-59 = "Я готова, Сенсей! Ну как?"
1006605-60 = "[s] «Ты прекрасно выглядишь!»"
1006605-61 = "Я рада это слышать."
1006605-62 = "Как думаете, я стала настоящей горничной, Сенсей?"
1006605-63 = "[s] «Да, Арис. Ты усердно старалась и стала горничной.»"
1006605-64 = "Та-дам! Сенсей меня одобрил! Теперь я могу прокачиваться ещё дальше!"
1006605-65 = "[s] «Ещё дальше? ...Куда именно?»"
1006605-66 = "Я стану лучшей героиней-горничной!"
1006605-67 = "Я стану лучшей и как горничная, и как герой, а затем превращусь в сильнейшую героиню-горничную, которая спасёт мир!"
1006605-68 = "[s] «Ну... раз ты так говоришь...»"
1006605-69 = "Вы тоже согласны! Теперь я непобедима!"
1006605-70 = ""
1006605-72 = ""
1006605-73 = "Итак, мы готовы выступать! Отправляемся в поле!"
1006605-74 = "В мир EXP и горничных..."
1006605-75 = "Мир ждёт нас, Сенсей!"
1006605-77 = "Арис взяла меня за руку, и мы отправились обратно в Шале навстречу приключениям."
