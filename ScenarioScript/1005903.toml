[translation]
1005903-1 = "Волонтёрская работа"
1005903-2 = ""
1005903-3 = "Ну вот, я и здесь..."
1005903-4 = "[s] «Что случилось, Мика?»"
1005903-5 = ""
1005903-7 = ""
1005903-8 = "Эм, ничего особенного..."
1005903-9 = "Как видишь, просто занимаюсь общественными работами."
1005903-10 = "[s] «Какими ещё общественными работами?»"
1005903-11 = "А, ну, частью моего наказания были 300 часов общественно полезных работ."
1005903-12 = "Вот я и пришла в свой выходной полоть это поле."
1005903-13 = "[s] «Ты делаешь всё одна?»"
1005903-14 = "Ага."
1005903-15 = "Не верится, что они требуют закончить всё это за один день... Тебе не кажется, что это перебор?"
1005903-16 = "Жарко. Я совсем одна. Работа тяжёлая и ужасно скучная. А стоит чуть ошибиться — и моя хорошая одежда вся в грязи."
1005903-17 = "Спина болит. Руки становятся шершавыми... А у меня сейчас денег даже на крем нет, не говоря уже о солнцезащитном!"
1005903-18 = "[s] «Тяжело тебе приходится.»"
1005903-19 = "А, эм... Да не настолько всё плохо, правда..."
1005903-20 = "[s] «Я помогу.»"
1005903-21 = ""
1005903-23 = ""
1005903-24 = "Н-Нет! Не нужно, Сенсей! Я просто ещё не привыкла, вот и всё!"
1005903-25 = "[s] «Я всё равно помогу. Но для начала переоденься в спортивную форму, Мика. В этой одежде работать совсем неудобно.»"
1005903-26 = "В спортивную форму? Серьёзно?"
1005903-27 = "[s] «Да. И ещё возьми полотенце, воду и совок.»"
1005903-28 = "Н-Но эту спортивную форму мне купил ты. Я берегла её для особого случая."
1005903-29 = "[s] «Глупости. Ею нужно пользоваться.»"
1005903-30 = ""
1005903-32 = ""
1005903-33 = "Наверное, формально ты прав..."
1005903-34 = "Ладно."
1005903-35 = ""
1005903-37 = ""
1005903-39 = "Несколько мгновений спустя..."
1005903-44 = ""
1005903-45 = "Так, я переоделась и принесла всё, что ты сказал, Сенсей."
1005903-46 = "Мне немного неловко показываться в этой форме. Она ведь не особо милая..."
1005903-47 = "Не знаю. Как тебе?"
1005903-48 = ""
1005903-51 = "[ns] «Отлично сидит. А теперь за работу.»"
1005903-52 = ""
1005903-53 = "Хорошо."
1005903-58 = "Мы пропалывали сорняки до самого вечера."
1005903-61 = "Тяжело... Спина болит... Везде грязь..."
1005903-62 = "[s] «Но посмотри! Мы уже почти закончили.»"
1005903-63 = "Ага, похоже на то..."
1005903-64 = "Вообще-то это должна была быть моя общественная работа. Надеюсь, помощь Сенсея не создаст проблем... Хотя даже если создаст — мне всё равно. ☆"
1005903-65 = "Хи-хи..."
1005903-66 = "Эй, Сенсей..."
1005903-67 = "[s] «Ого, уже так поздно! Мне пора возвращаться, Мика.»"
1005903-68 = "А? А-Ага..."
1005903-69 = ""
1005903-73 = "Я попрощался с Микой и вернулся в Шале."
