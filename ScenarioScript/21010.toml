[translation]
21010-1 = "Episódio 1;O Início da Aventura"
21010-2 = "..."
21010-4 = "Você consegue ouvir a minha voz..."
21010-6 = "Você está aí? Aquele que salvará este mundo—"
21010-11 = "—Ó, Herói."
21010-12 = "Eu esperei por você por tanto tempo."
21010-13 = "Agora, contarei tudo a você. Em tempos antigos, os celestiais e os demônios..."
21010-14 = "..."
21010-15 = "Corta, corta, coooorta!"
21010-16 = "Não, não, tá clichê demais! Desse jeito, vai flopar assim que lançar!"
21010-17 = "Se eu fosse a jogadora, no instante em que esse texto aparecesse no prólogo eu já ia pensar: \"Ah, quer saber? Vou largar isso\"!"
21010-18 = "Mais uma vez! Humm..."
21010-20 = "...Ó, Herói, eu estava esperando por você."
21010-21 = "Eu sou a Deusa \"Momoria\"."
21010-23 = "Nosso mundo, \"Millenniumland\", enfrenta agora uma crise sem precedentes."
21010-24 = "Você é o único capaz de superar esta crise e salvar o Clube de Desenvolvimento de Jogos da ordem de fechamento do Conselho Estudantil... digo, salvar Millenniumland."
21010-25 = "Pode ser uma jornada árdua... mas, ainda assim, eu imploro pela sua ajuda."
21010-27 = "No horizonte desta aventura que está prestes a começar..."
21010-28 = "Ainda não sabemos quais provações ou adversidades aguardam por você."
21010-29 = "Mas... por favor, não perca a coragem até o fim."
21010-30 = "Pois ao lado do Herói certamente estarão as garotas que compartilharão dessa jornada."
21010-32 = "Nesse novo mundo, você não será chamado por elas de \"Herói\"..."
21010-34 = "Você será chamado por um nome muito mais especial e digno."
21010-36 = "E esse nome é—"
21010-39 = "Sensei!!"
21010-41 = "???"
21010-42 = "..."
21010-43 = "[s1] \"Um teto desconhecido...\"\n[s2] \"Onde... eu estou?\""
21010-44 = "Ah, você acordou?!"
21010-45 = "Ah, você acordou?!"
21010-46 = "Finalmente acordou? Você deu sorte, hein!"
21010-48 = "Para de falar estranho do nada, você está deixando o Sensei confuso."
21010-49 = "Hehe, é que eu fiquei tão feliz que nem me segurei... Sensei, você tá bem? Achei que você não fosse mais acordar!"
21010-50 = "Que alívio, de verdade. Quando o PryStation que a minha irmã jogou pela janela acertou em cheio a sua cabeça, mesmo tendo sido por acidente... eu achei que a gente ia acabar virando suspeita de assassinato."
21010-51 = "Peço desculpas no lugar da minha irmã. Sinto muito, Sensei."
21010-52 = "Humpf! Fala como se fosse santa, Midori, mas quando eu gritei \"Será que acertou o Sensei?!\", a primeira coisa que saiu da sua boca foi \"O PryStation tá inteiro?!\"."
21010-53 = "I-Isso é porque ele é o item número 1 da lista de bens do Clube de Desenvolvimento de Jogos, saiu sem querer..."
21010-54 = "D-De qualquer forma!!"
21010-55 = "Sensei, você veio da Schale, não é?"
21010-56 = "Uau, sério mesmo?! Então você leu a carta que a gente mandou! Mesmo se tivesse lido, eu nunca achei que você viria de verdade!"
21010-57 = "[s] \"Carta? Aquela...\""
21010-59 = "Schale — Escritório"
21010-60 = "Sensei, chegou um pedido da Escola de Ciências Millennium."
21010-61 = "O remetente parece ser... o Clube de Desenvolvimento de Jogos da Millennium? Vou ler em voz alta."
21010-62 = "\"O Clube de Desenvolvimento de Jogos enfrenta agora uma crise existencial. Com a ruína iminente devido à ordem de fechamento do Conselho Estudantil, você é o único a quem podemos pedir socorro. Ó, Herói, por favor, salve-nos!\""
21010-63 = "Entendo. É bem curioso, por assim dizer... mas dá para sentir claramente o quão desesperadas elas estão..."
21010-64 = "Ah, Sensei, você conhece a Escola de Ciências Millennium?"
21010-65 = "[s3] \"Sim, um pouco.\"\n[s4] \"Não muito...\""
21010-66 = "Entendi. Como você já sabe, a Escola de Ciências Millennium—"
21010-67 = "É uma das grandes escolas de Kivotos, formando, junto com Trinity e Gehenna, as Três Grandes Academias."
21010-68 = "Conhecida simplesmente como Millennium, ela valoriza a racionalidade e a tecnologia acima de qualquer outra academia."
21010-69 = "É especializada em pesquisa científica e se destaca por reunir muitas alunas da área de exatas."
21010-70 = "Sua história não é tão longa quanto a das outras duas academias tradicionais, Gehenna e Trinity, mas não fica nada atrás quando o assunto é influência."
21010-71 = "Não é exagero dizer que quase tudo em Kivotos que carrega o rótulo de \"última geração\" ou \"tecnologia de ponta\" nasce na Millennium."
21010-72 = "É esse tipo de escola... mas o que será que aconteceu lá?"
21010-73 = "Então deixe-me explicar. A Escola de Ciências Millennium é uma das grandes escolas de Kivotos, formando, junto com Trinity e Gehenna, as Três Grandes Academias."
21010-74 = "Conhecida simplesmente como Millennium, ela valoriza a racionalidade e a tecnologia acima de qualquer outra academia."
21010-75 = "É especializada em pesquisa científica e se destaca por reunir muitas alunas da área de exatas."
21010-76 = "Sua história não é tão longa quanto a das outras duas academias tradicionais, Gehenna e Trinity, mas não fica nada atrás quando o assunto é influência."
21010-77 = "Não é exagero dizer que quase tudo em Kivotos que carrega o rótulo de \"última geração\" ou \"tecnologia de ponta\" nasce na Millennium."
21010-78 = "O que acha? Vamos até lá dar uma olhada?"
21010-79 = "..."
21010-81 = "Millennium — Clube de Desenvolvimento de Jogos"
21010-82 = "Mais uma vez... bem-vindo ao Clube de Desenvolvimento de Jogos, Sensei!"
21010-83 = "Ficamos muito felizes por você ter vindo, Sensei."
21010-84 = "Eu sou a Momoi, roteirista do Clube de Desenvolvimento de Jogos!"
21010-85 = "Eu sou a Midori. Sou ilustradora e cuido de toda a parte visual dos jogos."
21010-86 = "E também tem a nossa presidente, a Yuzu, que não tá aqui agora, mas cuida do planejamento..."
21010-87 = "Nós somos o Clube de Desenvolvimento de Jogos da Escola de Ciências Millennium!"
21010-88 = "Beleza! Já que o Sensei chegou, bora ir pras \"Ruínas\"!"
21010-89 = "[s5] \"Ruínas...?\"\n[s6] \"Ei, podem me explicar a situação com um pouco mais de detalhes?\""
21010-90 = "Ah, então vou explicar tudo desde o começo, na ordem."
21010-91 = "Ah, tá bom!"
21010-92 = "Então, até agora, nós do Clube de Desenvolvimento de Jogos estávamos vivendo em paz, fazendo nossos jogos de 16 bits e tal."
21010-93 = "Até que um dia... fomos atacadas de repente pelo Conselho Estudantil!"
21010-94 = "Anteontem, a Yuuka, uma dos Quatro Reis Celestiais do Conselho Estudantil, nos deu um ultimato."
21010-95 = "[s] \"Um ultimato?\""
21010-96 = "Quanto a isso, posso explicar eu mesma diretamente?"
21010-97 = "E-Essa voz?!"
21010-99 = "Próximo;Yuuka, a Tesoureira do Seminar"
