[translation]
21010-1 = "Эпизод 1;Приключение начинается"
21010-2 = "..."
21010-4 = "Ты слышишь мой голос?"
21010-6 = "Ты там? Ты герой, который..."
21010-11 = "...спасёт мир."
21010-12 = "Я ждала тебя."
21010-13 = "В начале времён Небожители и Демоны..."
21010-14 = "..."
21010-15 = "Стоп! Стоп!"
21010-16 = "Это слишком клишированно! Уже с первых слов такая скукотища!"
21010-17 = "Если бы я купила игру, которая начинается настолько уныло, вернула бы её ещё до того, как наиграла час!"
21010-18 = "Давай заново! Кхм."
21010-20 = "Я ждала тебя, герой."
21010-21 = "Я богиня по имени Момория."
21010-22 = ""
21010-23 = "Наш мир, Милленнаполис, сейчас стоит на грани беспрецедентного кризиса."
21010-24 = "Только ты способен преодолеть этот кризис и спасти Департамент Разработки Игр... то есть Милленнаполис."
21010-25 = "Возможно, тебе будет трудно принять эту правду, но я умоляю тебя."
21010-27 = "Впереди тебя ждёт тяжёлое приключение."
21010-28 = "Тебе предстоят бесчисленные испытания и трудности..."
21010-29 = "...но, пожалуйста, не теряй мужества."
21010-30 = "Твои девы всегда будут рядом."
21010-32 = "Для юных девушек этого нового мира ты больше, чем просто герой."
21010-34 = "Они будут называть тебя ещё более особым титулом."
21010-36 = "И этот великий титул..."
21010-39 = "Сенсей!"
21010-41 = "???"
21010-42 = "..."
21010-43 = "[s1] «Незнакомый потолок...»\n[s2] «Где я?»"
21010-44 = "Ого! Сенсей открыл глаза!"
21010-45 = "Ого! Сенсей открыл глаза!"
21010-46 = "Вы проснулись? Повезло!"
21010-47 = ""
21010-48 = "Не говори ни с того ни с сего странные вещи. Ты смущаешь Сенсея."
21010-49 = "Я просто рада. Вы в порядке, Сенсей? Я боялась, что Вы вообще не очнётесь."
21010-50 = "Слава богу. Я уже думала, что стану соучастницей убийства после того, как та FlyStation, которую она выбросила из окна, попала Вам в голову."
21010-51 = "Позвольте мне извиниться за неё."
21010-52 = "Пф. Не строй из себя такую важную, Мидори. Когда я сказала: \"Кажется, я попала в Сенсея!\", первое, что ты спросила: \"А FlyStation цела?\""
21010-53 = "Э-Это только потому, что это самый ценный актив Департамента Разработки Игр. Я просто выпалила не подумав."
21010-54 = "Эм, в любом случае!"
21010-55 = "Итак, Сенсей. Вы представляете Шале, да?"
21010-56 = "Правда?! Значит, Вы прочитали наше письмо! Я не думала, что Вы действительно придёте!"
21010-57 = "[s] «Письмо...?»"
21010-59 = "Исполнительный офис Шале"
21010-60 = "Мы получили запрос от Миллениум."
21010-61 = "Отправитель... Департамент Разработки Игр Милленниума? Хм. Сейчас прочитаю."
21010-62 = "\"Департамент Разработки Игр борется за выживание. Студсовет загнал нас в угол, и Вы — наша единственная надежда. Пожалуйста, герой, спасите нас!\""
21010-63 = "Хи-хи. Это одновременно самый срочный и самый смешной запрос, который я когда-либо получала."
21010-64 = "О. Вы знакомы с Научной школой Милленниум, Сенсей?"
21010-65 = "[s3] «Ещё как.»\n[s4] «Ни капли.»"
21010-66 = "Должны быть знакомы."
21010-67 = "Это одна из трёх крупнейших академий Кивотоса наряду с Тринити и Геенной."
21010-68 = "Школа Милленниум. Здесь рациональность и технологии ценят больше, чем в любой другой школе Кивотоса."
21010-69 = "Это место, где студенты, специализирующиеся в науке и инженерии, могут собраться во имя исследований."
21010-70 = "У неё нет такой долгой истории, как у двух более традиционных академий, но влияние на Кивотос ничуть не меньше."
21010-71 = "Именно в Милленниуме обычно рождаются самые новые и передовые технологии Кивотоса."
21010-72 = "Интересно, что могло заставить студентов просить нашей помощи."
21010-73 = "Это одна из трёх крупнейших академий Кивотоса наряду с Тринити и Геенной."
21010-74 = "Школа Милленниум. Здесь рациональность и технологии ценят больше, чем в любой другой школе Кивотоса."
21010-75 = "Это место, где студенты, специализирующиеся в науке и инженерии, могут собраться во имя исследований."
21010-76 = "У неё нет такой долгой истории, как у двух более традиционных академий, но влияние на Кивотос ничуть не меньше."
21010-77 = "Именно в Милленниуме обычно рождаются самые новые и передовые технологии Кивотоса."
21010-78 = "Почему бы не сходить и не посмотреть самостоятельно?"
21010-79 = "..."
21010-80 = ""
21010-81 = "Департамент Разработки Игр Милленниума"
21010-82 = "Добро пожаловать в Департамент Разработки Игр, Сенсей!"
21010-83 = "Мы рады, что Вы пришли."
21010-84 = "Я Момои, сценарист департамента!"
21010-85 = "А я Мидори, иллюстратор и отвечаю за всю визуальную часть игр."
21010-86 = "Ещё есть наша президент Юзу, но сейчас её нет..."
21010-87 = "Вместе мы и есть Департамент Разработки Игр!"
21010-88 = "Теперь, когда Вы здесь, Сенсей, мы наконец сможем исследовать руины."
21010-89 = "[s5] «Руины...?»\n[s6] «Мне понадобится краткое объяснение происходящего.»"
21010-90 = "О, сначала расскажу, что случилось."
21010-91 = "Хорошо!"
21010-92 = "До недавнего времени Департамент Разработки Игр спокойно создавал 16-битную игру."
21010-93 = "А потом в один прекрасный день студсовет пошёл в атаку!"
21010-94 = "Два дня назад Юука, одна из Четырёх божественных зверей студсовета, появилась и выдвинула нам ультиматум."
21010-95 = "[s] «Ультиматум?»"
21010-96 = "Позвольте мне самой всё объяснить."
21010-97 = "Я-Я знаю этот голос!"
21010-99 = "Следующий эпизод;Казначей Семинара Юука"
