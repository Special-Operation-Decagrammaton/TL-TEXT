[translation]
1012005-1 = "Незваные гости, желанные гости"
1012005-7 = "Я поспешил в репетиционную комнату."
1012005-8 = "Но Нацу нигде не было..."
1012005-9 = ""
1012005-12 = "С-Сенсей..."
1012005-15 = "― [log=나츠 밴드]З-Здесь... Сюда, Сенсей...[/log][wa:3150]"
1012005-18 = "[ns] «Что происходит?!»"
1012005-21 = "― [log=나츠 밴드]Уф... Оно в... барабанной установке...[/log][wa:3570]"
1012005-22 = "― [log=나츠 밴드]Чёрное, шуршащее и ползающее... нечто.[/log][wa:2990]"
1012005-25 = "― [log=나츠 밴드]Я перевернула здесь всё вверх дном, но так и не нашла его...[/log][wa:10]"
1012005-28 = "[ns] «Значит, ты всё-таки боишься, Нацу...»"
1012005-31 = "― [log=나츠 밴드]Ч-Что вы такое говорите, Сенсей?![/log][wa:2830]"
1012005-32 = "― [log=나츠 밴드]В Кивотосе нет ни одной старшеклассницы, которая бы не боялась ЭТОГО![/log][wa:1620]"
1012005-35 = "― [log=나츠 밴드]Это гораздо страшнее какой-то там пули![/log][wa:260]"
1012005-38 = "[ns] «Такое чувство, будто оно атакует мой рассудок...»"
1012005-41 = "― [log=나츠 밴드]Уф, такими темпами...[/log][wa:1560]"
1012005-44 = "― [log=나츠 밴드]Лимитированные печенья с макадамией, которые я с таким трудом добыла...[/log][wa:10]"
1012005-45 = "― [log=나츠 밴드]...будут потеряны... [/log][wa:2380]"
1012005-48 = "[ns] «Так вот чего ты на самом деле боялась...!»"
1012005-51 = "― [log=나츠 밴드]Пожалуйста, Сенсей...[/log][wa:1720]"
1012005-52 = "― [log=나츠 밴드]Спасите меня...[/log][wa:1930]"
1012005-55 = "После этого мы с Нацу обыскали каждый угол комнаты."
1012005-56 = ""
1012005-60 = "Это оказалась не змея и даже не таракан... а внушительных размеров комок пыли."
1012005-61 = "Я выбросил его в мусорку и вернулся к Нацу."
1012005-63 = "Пыль? Это был не таракан?"
1012005-64 = "..."
1012005-65 = "И всё же... ничего не изменилось."
1012005-67 = "Понимаете, ЭТО ВСЁ РАВНО могло испортить моё печенье левен с макадамией."
1012005-69 = "Так что спасибо, Сенсей. За то, что спасли жизнь Печеньке."
1012005-70 = "А теперь я могу вернуться к тренировке..."
1012005-71 = ""
1012005-73 = ""
1012005-74 = "...Или нет."
1012005-75 = "[s] «Точно... Барабанная установка вся разобрана...»"
1012005-76 = "Это была необходимая жертва в охоте на виновника... Ничего не поделать. Соберём её обратно?"
1012005-77 = "Хм? Почему я тренировалась здесь одна?"
1012005-78 = "Это элементарная вежливость, Сенсей."
1012005-79 = "Да, у электрогитары или клавишных можно убавить громкость..."
1012005-80 = "Но барабаны тише не сделаешь... Поэтому между общими репетициями я прихожу сюда тренироваться одна."
1012005-81 = "Одиноко ли мне?"
1012005-82 = "Ну... Если назвать это «одиночеством», тогда, полагаю..."
1012005-83 = "...мне стоит быть благодарной, что это одиночество привело вас ко мне."
1012005-84 = "Жизни нужны контрасты — как сладкое и солёное."
1012005-85 = "Ну что ж..."
1012005-86 = "Давайте пошумим!"
1012005-88 = "Я помог Нацу собрать барабанную установку обратно."
1012005-89 = "Огромные печенья с макадамией, которыми мы поделились после, были потрясающими."
