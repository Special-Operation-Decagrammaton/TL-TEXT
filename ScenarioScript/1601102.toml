[translation]
1601102-1 = "Хорошо развито"
1601102-4 = ""
1601102-7 = "Следуя указаниям Хасуми, я пришёл в пустой класс Тринити."
1601102-8 = "Было поздно, и других студентов поблизости не было."
1601102-9 = ""
1601102-12 = "Вы пришли, Сенсей. Сюда."
1601102-13 = "Подождите, мне нужно надеть остальную спортивную форму..."
1601102-14 = ""
1601102-18 = "[ns1] «...Хасуми?»\n[ns2] «...Прости, что?»"
1601102-21 = "Скоро закончу. Почти!"
1601102-22 = ""
1601102-24 = ""
1601102-28 = ""
1601102-30 = ""
1601102-31 = "[ns3] «Х-Хасуми!?»\n[ns4] «Ч-Что...?!»"
1601102-32 = ""
1601102-33 = ""
1601102-35 = "Давно я это не надевала... но я... смогу...!"
1601102-36 = ""
1601102-38 = ""
1601102-41 = "― Эм... Ух... Аргх... Ух![wa:6340]"
1601102-44 = "― Как я и подозревала...[wa:1490]"
1601102-46 = "― Это просто выше моих сил.[wa:10]"
1601102-49 = "― Простите, Сенсей.[wa:920]"
1601102-52 = "― Как видите..."
1601102-54 = "― ситуация довольно...[wa:160]"
1601102-57 = "― Уверена, у вас и так полно забот...[wa:700]"
1601102-60 = "― И теперь мне кажется, что я невольно поставила вас в неловкое положение.[wa:10]"
1601102-62 = "― Мне ужасно жаль."
1601102-65 = "― Раньше я носила это постоянно... вплоть до прошлого года.[wa:220]"
1601102-67 = "― Как за один год могло так многое измениться?[wa:790]"
1601102-70 = "[ns5] «До прошлого года?»\n[ns6] «Что могло случиться всего за год...?»"
1601102-71 = "― О, эм, я хотела сказать... Разница не настолько большая...[wa:1410]"
1601102-72 = "― О, эм, я хотела сказать... Разница не настолько большая...[wa:1410]"
1601102-75 = "― Просто...[wa:1540]"
1601102-77 = "― Мой вес ведь не должен был... так сильно измениться...[wa:1220]"
1601102-80 = "― Не может быть... Правда?[wa:1100]"
1601102-84 = "Возможно... у меня и правда был скачок роста, но неужели настолько сильный?"
1601102-85 = "Или одежда уменьшилась? Хм..."
1601102-86 = ""
1601102-89 = "[ns7] «Я... не думаю, что дело в этом.»\n[ns8] «Да... скачок роста...»"
1601102-92 = "З-Звучит как неловкое оправдание, но..."
1601102-93 = "В любом случае это неважно. Нам пора начинать проверку."
1601102-94 = "Простите за этот беспорядок... Я не собиралась вести себя так..."
1601102-95 = "[s9] «Главное, чтобы ты была в порядке...»\n[s10] «О... Не переживай обо мне. Я в порядке.»"
1601102-98 = "Хи-хи-хи..."
1601102-99 = ""
1601102-101 = ""
1601102-102 = ""
1601102-104 = ""
1601102-105 = "Итак, это руководство для исполнительного комитета."
1601102-106 = ""
1601102-109 = "...Сенсей?"
1601102-110 = ""
1601102-113 = "[ns11] «Д-Да, я смотрю...»\n[ns12] «(Я просто не понимаю, куда именно мне смотреть...)»"
1601102-116 = "...Простите. Наверное, дело в этой одежде..."
1601102-117 = "Я вице-президент Отряда правосудия. Я должна подавать пример. А вместо этого даже не могу нормально одеться..."
1601102-118 = "Стоит купить новую форму? Не знаю, хватит ли времени..."
1601102-119 = "[s13] «Да, времени и правда очень мало.»\n[s14] «Если тебе не неудобно, может, и не нужно...?»"
1601102-122 = "Хм, верно..."
1601102-123 = "...О, мы опять отвлеклись."
1601102-124 = "Давайте сосредоточимся на документах."
1601102-125 = ""
1601102-127 = ""
1601102-128 = "Начнём с..."
1601102-129 = ""
1601102-132 = "[ns] «(...Не могу... сосредоточиться...)»"
1601102-134 = "Я вместе с Хасуми просмотрел документы исполнительного комитета Фестиваля Хало Кивотоса. После этого проводил Хасуми до её комнаты."
1601102-135 = "И всё это время её молния так и не сдвинулась."
