[translation]
10014040-1 = "Эпизод 4; Банда сладкоежек после уроков?"
10014040-2 = "...На следующий день."
10014040-3 = "О, Сенсей... Вы так пунктуальны."
10014040-4 = "Ну что, есть новости?"
10014040-5 = "Вы с тех пор разговаривали с Рейсой или ещё что-нибудь?"
10014040-6 = "Простите, я слишком давлю? Просто мне не терпелось услышать новости."
10014040-7 = "Что?"
10014040-8 = "Вы хотите сначала обсудить это со мной?"
10014040-9 = "То есть, я могу, но..."
10014040-10 = "Почему бы вам не заставить Рейсу поговорить? Почему я?"
10014040-11 = ""
10014040-13 = ""
10014040-14 = "Уф, не обращайте внимания. Раз это говорит взрослый, я вам доверюсь."
10014040-15 = "Давайте найдём место, где можно сесть и поговорить."
10014040-16 = "Эй, милашка!"
10014040-17 = "Скучаешь? Свободна? Хочешь поиграть с нами?"
10014040-18 = "......?!"
10014040-19 = "[ns] «Этот голос кажется знакомым...»"
10014040-24 = "......?!"
10014040-25 = "...???"
10014040-26 = "Ха! Ха! Ха! Ты в шоке, прямо совсем в шоке. Запугивание — моё второе имя."
10014040-27 = "К-Конечно она боится! Мы же плохие, злые люди!"
10014040-28 = "Да неужели? Вы правда думаете, что выглядите устрашающе?"
10014040-30 = ""
10014040-32 = ""
10014040-33 = "...Что это?"
10014040-34 = "[s3] «...???»\n[s4] «(Они оделись как бандиты?!)»"
10014040-35 = "Что вы вообще здесь делаете? И почему вы так одеты?!"
10014040-36 = "Что вы вообще здесь делаете? И почему вы так одеты?!"
10014040-37 = "К-Казуса! Что бы ни случилось, мы поддержим тебя как сможем! Даже вот так!"
10014040-38 = "Я ценю это и всё такое, но не понимаю, чего вы этим добиваетесь."
10014040-39 = "Почему вы одеты как шайка бандитов? И почему Нацу говорит ещё страннее обычного?!"
10014040-40 = "Ха! Ха! Ха! Мы ценим твою заботу, но не отталкивай своих сообщников. Мы здесь!"
10014040-41 = "Наше будущее ведёт нас в мир, прежде нам неведомый..."
10014040-42 = "Ваше будущее... Неизведанный путь??"
10014040-43 = ""
10014040-45 = ""
10014040-46 = "Подождите секунду. Тут что-то не так."
10014040-47 = "[s5] «Да. Всё пошло очень не так.» \n[s6] «Эпичный провал косплея...»"
10014040-48 = "Сегодня начинается новая глава! Наш клуб официально переименовывается в Банду сладкоежек после уроков."
10014040-49 = "Сегодня начинается новая глава! Наш клуб официально переименовывается в Банду сладкоежек после уроков."
10014040-50 = "Да! Так тебе, Казуса, будет с нами уютно и привычно."
10014040-52 = "Б-Банда?! Что? Почему?"
10014040-53 = "Кто-нибудь, пожалуйста, объясните мне, что происходит..."
10014040-54 = "Я так и знала! Она не понимает, ребята! Она упускает суть!"
10014040-55 = "Надо объяснить, зачем мы это делаем."
10014040-56 = "ПОЙМАНА С ПОЛИЧНЫМ!"
10014040-58 = ""
10014040-59 = "[ns] «...О. О нет.»"
10014040-61 = "...?"
10014040-62 = "Этот голос..."
10014040-63 = "Почему у меня сейчас такое дежавю?"
10014040-65 = "Да! Я всё это время знала!"
10014040-66 = "На долю секунды я позволила себе поверить, что ты отказалась от своих злодеяний! Но это всегда было невозможно!"
10014040-67 = "Зверя внутри тебя никогда не укротить!"
10014040-68 = "А теперь ты создала Банду сладкоежек после уроков?! Какой ужас!"
10014040-69 = "Они собираются сожрать всё человечество, словно свой любимый десерт! Это точно так и значит!"
10014040-70 = "Даже Сенсея похитили. Они будут шантажировать школы!"
10014040-71 = "Всё это время ты строила козни за кулисами!"
10014040-72 = "И вот наконец ты создала новую организацию, чтобы совершить своё возрождение, Кёяма Казуса!"
10014040-73 = "Или, лучше сказать..."
10014040-74 = "Кат Палуг!!!"
10014040-75 = ""
10014040-77 = ""
10014040-78 = "Кат... что? Что она имеет в виду?"
10014040-79 = "Возрождение? Новая организация...? Ты про этих бандитов? Они бандиты?!"
10014040-80 = "...Кат Пал... что?"
10014040-81 = "Похитили...?"
10014040-82 = ""
10014040-84 = ""
10014040-85 = "Казуса похитила Сенсея?!"
10014040-86 = "К-Казуса...? Это правда?!"
10014040-87 = "Вы вообще, блин, серьёзно?!"
10014040-88 = "[s9] «Ты серьёзно? Ты меня похитила, Казуса?!»\n[s10] «Слухи — страшная штука.»"
10014040-89 = "Это не смешно, Сенсей!"
10014040-90 = "Не делайте вид, будто ничего особенного не происходит!"
10014040-91 = "Хватит шутить и объясните всем, пока это не вышло из-под контроля!"
10014040-92 = "Ты только что угрожала Сенсею?!"
10014040-94 = "Она даже взрослых заставляет исполнять её волю! Кёяма Казуса, ты безжалостна!"
10014040-95 = "...Чёрт. Уже слишком поздно."
10014040-96 = "Эй! Что ты там говоришь про Казусу?!"
10014040-97 = "Казуса, просто заставь её остановиться! Она же твоя подруга, разве нет?"
10014040-98 = "Она?! Моя подруга?! Ты с ума сошла?"
10014040-99 = ""
10014040-102 = ""
10014040-103 = "Я никогда тебя не прощу! Я защищу эту землю и её учеников от твоей тьмы!"
10014040-104 = "Готовьтесь, Кёяма Казуса и Банда сладкоежек после уроков!"
10014040-105 = "Я наконец одолею тебя и восстановлю справедливость!"
10014040-106 = "Я вызываю тебя!"
10014040-107 = "Ты... издеваешься... надо мной...?"
10014040-108 = ""
10014040-110 = ""
10014040-111 = ""
10014040-112 = "Хи-хи. Мы принимаем вызов."
10014040-113 = "Да, принимаем! Я, может, и не понимаю ситуацию, но мне и не нужно. Ты не смеешь так говорить с Казусой!"
10014040-114 = "Мне достаточно знать, что ты обижаешь мою подругу, и мы тебе этого не спустим."
10014040-116 = "А?!"
10014040-117 = "Вызов принят! Я сокрушу тебя своей справедливостью!"
10014040-118 = "Банда сладкоежек после уроков покажет тебе силу дружбы и романтики!"
10014040-119 = "Вперёд! В атаку!"
10014040-120 = "П-Поехали!"
10014040-121 = "И-и-и-и!"
