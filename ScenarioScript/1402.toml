[translation]
1402-1 = "Оружие и перцы, часть 2"
1402-2 = "Мастерская Инженерного Департамента"
1402-3 = "Готова, Котори?"
1402-4 = "Конечно! Я так ждала этого момента!"
1402-5 = "Тогда позволь мне представить."
1402-6 = ""
1402-7 = "Та-дам! Наконец-то готово. Новейшее изобретение Инженерного отдела:#nпистолет-пулемёт с дозатором острого соуса!"
1402-8 = "Выглядит куда больше как обычный пистолет-пулемёт, чем я ожидала. Он работает?"
1402-9 = "Ещё как! Разница лишь в том, что вместо обычных патронов нужны специальные, с перцем и уксусом."
1402-10 = "Когда вставляешь такой патрон в магазин и нажимаешь на спуск, порох мгновенно запускает ферментацию красного перца."
1402-11 = "*бах*"
1402-12 = "И вот так из ствола выходит острый соус!"
1402-13 = "Посмотрим..."
1402-14 = ""
1402-15 = ""
1402-16 = "Это и правда настоящий острый соус! От соуса из пиццерии вообще не отличить."
1402-17 = "Мы провели множество экспериментов, чтобы воссоздать вкус. Это оружие — вершина новейших инженерных технологий Миллениума!"
1402-18 = "А если переключить на автоматический огонь, оно способно выдавать почти литр острого соуса в секунду."
1402-19 = "*пах* *пах* *пах* *тат*"
1402-20 = "Хе. Теперь с этим оружием мы можем поливать всё острым соусом сколько угодно, когда угодно и где угодно! Больше никогда не придётся переживать, чем приправить пиццу!"
1402-21 = "Просто великолепно. Превзошло все мои ожидания."
1402-22 = "Это оружие такое... такое..."
1402-23 = "...бесполезное."
1402-24 = "Д-Да, верно. Носить с собой пакетики острого соуса было бы гораздо дешевле и удобнее, чем таскать это оружие."
1402-25 = "К тому же при использовании соус пачкает весь ствол, а отмывать его — мучение. Так что ещё и проблема с гигиеной..."
1402-26 = ""
1402-27 = "Ха. И всё же было занятно увидеть его в деле, так что ничего страшного."
1402-28 = "Не каждое изобретение обязано быть практичным. Если тебе нравится сам процесс создания, великие достижения придут следом."
1402-29 = "Вот именно! Благодаря этому эксперименту я смогла проверить наши технологии дозирования жидкостей! Эти данные ещё наверняка пригодятся в будущем."
1402-30 = "Говорят, неудача — предвестник успеха."
1402-31 = ""
1402-33 = "Кстати... Чьё оружие вы переделали?"
1402-34 = "А? Я думала, это твоё оружие, Утаха."
1402-35 = "Нет, для моего оно слишком крупное. Я пользуюсь пистолетом без приклада, стреляющим очередями. А это пистолет-пулемёт."
1402-36 = "Ну, не моё."
1402-37 = "И не моё."
1402-38 = "Погодите. Посмотрите на этот вычурный узор с драконом."
1402-39 = "Единственный человек, который мог нанести на оружие такой дурацкий рисунок, это..."
1402-42 = "Смотрю, наконец закончили ремонт. Обычно вы, чудики из Инженерного отдела, так долго не возитесь."
1402-43 = "Н-Нэру? Ч-Что ты здесь делаешь?"
1402-44 = "А? В смысле? Пришла забрать своё оружие. Какие-то проблемы?"
1402-45 = "А-А, точно! Я-Я совсем забыла. Ха-ха..."
1402-46 = "А? Но оно же прямо здесь стоит. Как можно было забыть? Да плевать. Если закончили, я его забираю."
1402-47 = "П-Погоди. С ним осталась ещё одна маленькая проблема..."
1402-48 = "Какого...? Столько времени прошло, а оно до сих пор не готово? Я ещё снаружи слышала, как вы сказали, что что-то «наконец-то готово»."
1402-49 = "...Только не говорите, что вы что-то сделали с моим оружием! Что вы натворили?!"
1402-50 = "Н-Ничего...! С твоим оружием всё в порядке!"
1402-51 = "Да? Отлично. Тогда забираю."
1402-52 = ""
1402-53 = "Х-Хорошо. Б-Береги себя..."
1402-54 = "Да как хотите. Спасибо, что ли."
1402-55 = ""
1402-56 = "Что теперь делать, Утаха?! Оружие Нэру...!"
1402-57 = "Когда она узнает, что её оружие теперь всего лишь дозатор соуса, нам точно станет жарко."
1402-58 = "Нам конец. Скоро Нэру в ярости ворвётся сюда и засунет нас в бочку с острым соусом!"
1402-59 = "Все успокойтесь. Она пока ничего не знает."
1402-60 = "Если сумеем вернуть оружие Нэру, то сможем всё исправить до того, как она поймёт, что его вообще модифицировали."
1402-61 = "Забрать оружие Нэру так, чтобы она не заметила? Это всё равно что добровольно сунуться в логово льва!"
1402-62 = "Что бы мы ни сделали — нам конец."
1402-63 = "Глупости. Сначала я сделаю муляж, который мы подменим на оружие Нэру. А вы двое тем временем должны не дать ей нажать на спуск."
1402-64 = "Но... что если Нэру заметит неладное раньше?"
1402-65 = "Я предпочитаю даже не думать о такой возможности."
1402-66 = "Будем просто молиться, чтобы она не потеряла терпение."
