[translation]
10035010-1 = "Эпизод 1;Начинаем работать спасателями!"
10035010-2 = "Наконец-то!"
10035010-3 = "Так вот он какой, «Эгир» — крупнейший аквапарк в D.U.!"
10035010-4 = "Он такой огромный, кажется, я здесь потеряюсь!"
10035010-5 = "Мы всё равно весь день будем торчать под солнцем."
10035010-6 = "Это просто патрулирование, только с лишними шагами."
10035010-7 = "Не говори так, Фубуки!"
10035010-8 = "Наша обязанность — защищать людей, верно?"
10035010-9 = "Нельзя позволять какой-то жаре нам мешать!"
10035010-10 = "И я уверена, они оценят нашу тяжёлую работу."
10035010-12 = "Не знаю, как я буду кого-то защищать, если сама засохну как кальмар..."
10035010-13 = "Угх, почему я не намазалась солнцезащитным кремом...?"
10035010-14 = "О, здесь ещё и крытый бассейн есть. Надеюсь, нас поставят туда."
10035010-15 = "Правда, директор?"
10035010-16 = ""
10035010-18 = ""
10035010-19 = "..."
10035010-20 = "Директор, что случилось? Вы плохо выглядите!"
10035010-21 = "Погодите... Усталое выражение лица, слабость в конечностях, тусклый взгляд..."
10035010-22 = "У-У вас тепловой удар?!"
10035010-23 = "Давай, Фубуки! Перенесём директора в тень. Нужно позвать спасателя!"
10035010-24 = "А, погодите. Спасатели ведь мы сами, да?"
10035010-26 = "Спокойно, сотрудница Кирино. Со мной всё в порядке."
10035010-27 = "Просто... мне нужно немного времени, чтобы привыкнуть ко всей этой ситуации."
10035010-28 = "До сих пор? Уже могла бы просто смириться."
10035010-29 = "Легче сказать, чем сделать."
10035010-30 = "Быть здесь, в аквапарке..."
10035010-31 = "...в, скажем так, минимальной рабочей форме..."
10035010-32 = "...и проводить рабочий день у бассейна... скажем так, в моей профессиональной жизни такое впервые."
10035010-34 = "Я, эм, понимаю..."
10035010-35 = "Погодите, но тогда почему имя директора было в списке отправляемых?"
10035010-36 = "Вот именно."
10035010-37 = "Мы обе из Бюро общественной безопасности, так что понятно, почему отправили нас, но зачем отправлять ещё и её?"
10035010-39 = "Ну, эм..."
10035010-46 = ""
10035010-47 = "Заместитель директора! Что происходит?"
10035010-48 = "О, ты здесь!"
10035010-49 = "Дай мне секунду, закончу подтягивания."
10035010-50 = "Хья-а!"
10035010-53 = "А-а, отлично. Так что случилось?"
10035010-54 = "С каких пор нам разрешено тренироваться на работе...?"
10035010-55 = "Забудь. Сейчас неважно."
10035010-56 = "Почему моё имя в списке отправляемых?"
10035010-57 = "Похоже, меня призвали в Бюро общественной безопасности и отправили работать в аквапарк."
10035010-59 = "Ага, вот как?"
10035010-60 = "Не прикидывайся. Я видела подпись заместителя директора на документах об одобрении отправки."
10035010-61 = "Это ты за этим стоишь, Конока."
10035010-62 = "Объяснишься?"
10035010-63 = ""
10035010-65 = ""
10035010-66 = "Ха-ха, я так и думала, что ты вот так ворвёшься сюда."
10035010-67 = "Я бы не сказала, что прямо «стою за всем этим», но..."
10035010-68 = "Да, ты права. Это я вписала твоё имя в список."
10035010-69 = "Моя старшая отсутствовала, список оказался на моём столе, и я воспользовалась случаем."
10035010-70 = "Ты—"
10035010-71 = "РАДИ твоего же блага."
10035010-72 = "Что?"
10035010-73 = "Ты уже несколько недель завалена допросами и бумажной работой. И по выходным тоже."
10035010-74 = "Даже ты не можешь бесконечно работать без отдыха."
10035010-75 = "...И поэтому ты отправляешь меня в аквапарк?"
10035010-76 = "Именно так, да!"
10035010-77 = "Работа спасателя тяжёлая и ответственная. Аквапарк не поручит внешней помощи ничего критически важного, без обид."
10035010-78 = "«Валькирия» будет там скорее для вида — чтобы люди чувствовали себя в безопасности, вот и всё."
10035010-79 = "А ты просто поезжай туда и хорошо проведи время!"
10035010-80 = "Ну что, я лучший заместитель на свете или как?"
10035010-82 = "Немедленно отмени это."
10035010-83 = "Я директор Бюро общественного порядка. Я не могу резвиться в аквапарке. У меня нет на это времени."
10035010-84 = "Посмотри, может Бюро общественной безопасности сможет отправить ещё несколько человек вместо меня."
10035010-85 = ""
10035010-87 = ""
10035010-88 = "Эй-эй, погоди."
10035010-89 = "Точно?"
10035010-90 = "...Почему вы спрашиваете?"
10035010-91 = "Ну, между нами... мне кажется, для тебя это тоже может быть хорошей возможностью."
10035010-92 = "Хм?"
10035010-94 = "Когда ты только поступила в «Валькирию», твоим первым выбором было Бюро общественной безопасности, верно?"
10035010-95 = "Откуда ты знаешь?"
10035010-96 = "Ну, у меня может и нет такого уровня доступа, как у тебя, но как заместитель директора я имею право по своему усмотрению просматривать некоторые документы."
10035010-97 = "...Однажды мне стало скучно, и я заглянула."
10035010-98 = "В любом случае, сейчас ты занята работой директора Бюро общественного порядка..."
10035010-99 = "...но если ты всё ещё чувствуешь то же, что тогда, это может быть твоим шансом."
10035010-100 = "Когда ещё у тебя будет время и возможность поработать непосредственно с гражданами?"
10035010-101 = ""
10035010-103 = ""
10035010-104 = "Хех."
10035010-105 = "Хм?"
10035010-106 = "Тут я тебя остановлю."
10035010-107 = "Почему?"
10035010-108 = "Сначала я действительно собиралась вступить в Бюро общественной безопасности, но давно отказалась от этой идеи."
10035010-109 = "У меня слишком... суровый вид. Лицом к лицу с населением мы бы не поладили."
10035010-110 = "Так что никаких сожалений."
10035010-111 = "Я подам запрос начальству на пересмотр списка отправляемых."
10035010-112 = "И сама туда пойду, просто чтобы ты знала."
10035010-114 = "Даже если пойдёшь..."
10035010-115 = "...уже слишком поздно."
10035010-116 = "Что значит «слишком поздно»?"
10035010-117 = "Одобрение и бюджет уже окончательно утверждены."
10035010-118 = "Более того, официальные документы у меня прямо здесь."
10035010-119 = "Серьёзно...?!"
10035010-120 = ""
10035010-121 = ""
10035010-122 = "...Это секретная информация."
10035010-123 = "Эх, а я думала, ты нам расскажешь."
10035010-125 = "[ns1] «Вот именно! Я тоже очень хотела это услышать.»\n[ns2] «Теперь мне ещё любопытнее.»"
10035010-128 = ""
10035010-129 = "А? Сенсей?"
10035010-130 = "Не ожидала увидеть вас здесь. Здравствуйте!"
10035010-131 = "Ого, вы даже в купальнике."
10035010-132 = "Выглядите так, будто пришли повеселиться, да?"
10035010-133 = "[s] «Привет, Кирино, Фубуки, Канна.»"
10035010-134 = "А? Почему Сенсей [USERNAME] здесь?"
10035010-135 = "Это задание никак не должно быть связано с «Шале»."
10035010-136 = "[s] «Мне пришёл отчёт о некоторых опасениях по поводу выбора спасателей.»"
10035010-137 = "(Конока...!)"
10035010-138 = "[s] «Я не собираюсь никому мешать.»"
10035010-139 = ""
10035010-140 = "[ns] «Считайте меня обычным посетителем.»"
10035010-141 = "Поняла!"
10035010-142 = "Если упадёте в воду, просто позовите меня или напишите в MomoTalk! Я приду на помощь!"
10035010-143 = "[s] «(Переписываться в MomoTalk под водой. Хм...)»"
10035010-144 = "Ну, раз уж мы оба здесь, почему бы вам не присоединиться ко мне на ленивой реке? ...Во время патруля?"
10035010-145 = "На фуд-корте есть пончиковая, так что можем ещё перекусить."
10035010-146 = "Ты просто хочешь пойти валять дурака, Фубуки?"
10035010-147 = ""
10035010-149 = ""
10035010-150 = "..."
10035010-151 = "[s] «Канна, тебя что-то беспокоит?»"
10035010-152 = "Нет, ничего."
10035010-153 = "Я просто не ожидала увидеть вас здесь."
10035010-154 = "Вы меня удивили, вот и всё."
10035010-155 = "[s] «Этот купальник спасателя тебе идёт.»"
10035010-156 = "Спасибо..."
10035010-157 = "...но мне кажется, он мне не подходит."
10035010-158 = "А? Директор, вам дали неправильный размер?"
10035010-159 = "В районе груди и правда выглядит немного тесновато."
10035010-160 = "Н-Не это я имела в виду, сотрудница Фубуки."
10035010-161 = ""
10035010-163 = ""
10035010-164 = "Внимание всем спасателям."
10035010-165 = "Просьба собраться в центре открытой зоны для распределения обязанностей."
10035010-166 = ""
10035010-168 = ""
10035010-169 = ""
10035010-170 = "Ладно, начинаем эту миссию!"
