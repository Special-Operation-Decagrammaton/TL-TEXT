[translation]
33075-2 = "Guh! O que diabos é aquilo...!?"
33075-3 = "..."
33075-8 = "Aquele poder... e essa sensação estranha de que, por mais que a gente lute, nada surte efeito..."
33075-9 = "Aquilo são mesmo \"pessoas\"...? Ou será que..."
33075-10 = "Hasumi-san... Aquilo, aquelas pessoas são..."
33075-11 = "Irmã Hinata...?"
33075-12 = "Eu já vi aquela aparência em um livro... Aquelas são as vestes do \"Conselho dos Santos\"."
33075-13 = "...\"Conselho dos Santos\"?"
33075-16 = "O \"Conselho dos Santos de Justina\"... As \"Guardiãs dos Preceitos\", que deveriam ter desaparecido há centenas de anos... Por que estão aqui agora...!?"
33075-21 = "Próximo;O Dia Tingido de Fogo e Cinzas (2)"
