[translation]
10057050-1 = "Episode 5; Why a Tank?"
10057050-3 = "[log]Tank race qualifiers[/log]"
10057050-5 = "[log]D-3[/log]"
10057050-9 = "The good news is, work on the tank is going great."
10057050-10 = "The bad news is, I've successfully completed my research on that ultra-cheap#npudding!"
10057050-11 = "It looks and feels just like actual pudding, #nbut since I've pushed the water ratio to the max, it completely disintegrates the#nmoment you put it in your mouth."
10057050-12 = "But meh... #nThey were the ones who said to create \"a pudding that melts in your mouth,\" so#nI better not hear any complaints..."
10057050-13 = "Lemme just apologize in advance to everyone who's served this in their lunch!#nSorry!"
10057050-14 = "Anyway... Back on the topic of our tank, I'm surprised how well things have been#ngoing since yesterday!"
10057050-15 = "[s] \"And how's it been accomodating to Anna's ideas?\""
10057050-16 = "I'd say it's been going great too... I think! All thanks to you!"
10057050-17 = "On top of being clever, Anna's pretty competent too. Tank design is her field of#nexpertise, so she's been a huge help."
10057050-18 = "She is a bit pig-headed when we work together though... Ah, that might be a bit#ntoo much..."
10057050-19 = "Like, y'know... uh, what's the word again? #nHow do you describe someone who's stubborn and refuses to listen to the other#nperson?"
10057050-20 = "[s] \"I-I think it's better if you don't remember it!\""
10057050-21 = "There's parts of her that make her unsuited as an engineer... #nOr dare I say, she's not cut out to be one entirely."
10057050-22 = "Buuut, she's also the only one between us who can actually create a working tank, so... I just gotta trust her!"
10057050-23 = "I'm sure she's got a master plan in mind for winning. #nI mean, there's no way she's just putting on airs for the love of it, right!?"
10057050-24 = "Plus, I'm sick of being up on these mountains! #nIt's cold, I'm always getting sick, there's no sweets to eat, and no cute clothes#nto buy!"
10057050-28 = "Ah, don't get me wrong... Those sweets and clothes are strictly as reference for#nresearch purposes... Okay?"
10057050-29 = "Ehehe...!"
10057050-30 = "[s] \"Research is important, yep!\""
10057050-32 = "[ns] \"But why a tank? There's other things you could've done.\""
10057050-33 = "Because tanks are a product of heavy industry that convergences all things#nmechanical, chemical, and electrical! It's the perfect place to put all that painful#nstudying into practice, don't you think?"
10057050-34 = "If you think about it, heat treating steel plates, manufacturing gunpowder, and the#nprocessing of fuels and lubricants—these are all chemistry-related!"
10057050-35 = "More importantly though, tanks are super cool!"
10057050-38 = "So that's what Erina said about me. She could've simply told me it straight."
10057050-39 = "Erina and I often have different opinions on things, that's for sure. #nEven though our goals are the same, the ways we go about accomplishing those#ngoals are what differ. Sigh..."
10057050-40 = "We're different in just about every way, from our specializations to our#nbackgrounds, so this was an inevitability. For example... "
10057050-44 = "Sensei. What do you think happens if you think happens to a tank after you attach external fuel tanks?"
10057050-45 = "Does it becomes more dangerous, or does it become safer?"
10057050-46 = "[s] \"If it's hit by a shell and ignites, it could be dangerous...\""
10057050-47 = "Heheh. Initially, you would think it makes it more dangerous."
10057050-48 = "However, on the contrary, it actually makes it safer. #nThe external fuel tank serves as protection for the tank!"
10057050-49 = "[s] \"Really? How does that work?\""
10057050-50 = "For starters... Because the main body of the tank is made of steel, #nit won't suffer too badly if the external fuel tanks were to catch on fire."
10057050-51 = "Furthermore, the fuel inside helps to dampen the force of incoming shells."
10057050-52 = "In other words, this design can solve both the issue of fuel capacity and defense#nsimultaneously, killing two birds with one stone!"
10057050-53 = "This is especially true in the case of shaped charges... #nThe fuel reduces its penetrating power, producing a result similar to spaced#narmor!"
10057050-54 = "This is a good example of something that may initially seem dangerous, but is#nactually the opposite."
10057050-55 = "However, when I proposed this idea to Erina, she looked at me like I was insane."
10057050-56 = "That girl. She usually acts like she's all nonchalant, but who would've thought#nshe's actually quite timid."
10057050-57 = "[s] \"And has work on the tank been going well?\""
10057050-61 = "...Yeah! The speed we're working at is like night and day compared to how it was#npreviously."
10057050-62 = "Before, we had to make decisions one by one using RWWE, which took a lot of time. #nSometimes, I'd even get so engrossed in wrestling that I'd forget what we were#noriginally fighting over."
10057050-63 = "...I do wonder what would've happened if you hadn't come here to help us."
10057050-64 = "[s] \"But why a tank? There's other things you could've done.\""
10057050-65 = "...Why did we choose to make a tank, you ask?"
10057050-66 = "When President Cherino declared that, \"The Gehenna Cup shall be ours!,\" #na member of the Officer came all the way out here to put up the tournament#nposter."
10057050-67 = "At the time, I jokingly mentioned how nostalgic it is seeing a tank, after which#nErina got all riled up."
10057050-68 = "One thing led to another, and that's how we ended up here."
10057050-69 = "Well, it goes without saying... But they couldn't have built this without me! #nI am, after all, Red Winter's... No, Kivotos' greatest tank architect!"
10057050-70 = "What is a tank... if not a compilation of all things mechanical engineering? Energy,#nstructure, materials, manufacturing— It all begins with a single blueprint and#nunfolds into a magnificent mechanical ecosystem!!"
10057050-71 = "To give up an opportunity like this would be a blasphemy towards engineering."
10057050-72 = "I even created the entire welding instruction for this! #nIf the welds are done in an inappropriate order, then the residual stresses could#ncause the entire hull to warp!"
10057050-73 = "Phew... Seems things aren't easy for a genius sitting at the top of the academy's#nrankings. It seems I'm fated to build a tank, even at a place like this."
10057050-74 = "I guess I should practice my victory speech while I still have the time..."
10057050-76 = "I see. If they've been making progress, then I'm satisfied."
10057050-77 = "Ah, watch your step. I was in the middle of tidying up a rubber hose."
10057050-78 = "Those two are never able to come to a consensus. #nDespite being so similar, there isn't a single thing they can agree on."
10057050-82 = "...What about me? I just reached a good stopping point for my IT work."
10057050-83 = "[s] \"Even though you hacked their systems, they still trust you with IT work...?\""
10057050-84 = "Strictly speaking, it's a little different."
10057050-85 = "President Cherino thinks I stole something. #nShe probably didn't listen to the report properly."
10057050-86 = "Because of that, she ordered me to handle IT work, where there was nothing I#ncould steal."
10057050-87 = "[s] \"I... see.\""
10057050-88 = "Yeah."
10057050-89 = "It's quite questionable why they had me handle IT work when an IT department#nalready existed."
10057050-90 = "I did adjust the number of ducks ordered by the IT department once since they seemed a little low, #nbut the number of ordering mistakes increased after that, so I suppose they needed another#nseparate entity to also handle IT work. "
10057050-91 = "Well, no matter the case, I've been assigned to handle IT work. #n...Ah, come to think of it. I was curious about this \"Special Class 227\" you#nmentioned previously, so I tried investigating into it."
10057050-92 = "Everything about it was buried deep within the server room, so it was considerably#ndifficult to find anything."
10057050-97 = "Here it is."
10057050-98 = "[s] \"What is that? A bubble sheet?\""
10057050-99 = "It's called a punched card. Red Winter uses these for their IT systems."
10057050-100 = "It's a form of data storage that uses holes to record data."
10057050-101 = "Their capacity is incredibly small—just 80 characters per card."
10057050-102 = "[s] \"Why use something so old-fashioned?\""
10057050-103 = "Because \"it still works.\""
10057050-104 = "I don't know the specifics of it, but that's roughly the reason why they still use#nthem."
10057050-105 = "Aside from its leaders, Red Winter tends to not change anything unless that thing has a reason to be changed. That's why our electronics are at this level."
10057050-106 = "Though to be honest, I do like them... They're tangible and highly reliable."
10057050-107 = "Anyway, Special Class 227's roster and management history should be on these#ncards. I'll load the data now."
10057050-108 = "Punched cards read and execute instructions sequentially in the order they're fed, #nso it's important to put the cards in the proper order..."
10057050-113 = "[ns] \"Watch your step!\""
10057050-114 = "Ah."
10057050-119 = "..."
10057050-120 = "[s3] \"Are you alright? Are you hurt anywhere?\"\n[s4] \"Looks like the punched cards have been scattered... everywhere...\""
10057050-123 = "..."
10057050-124 = "There probably wasn't any important data on those anyway. #nIf there is, I'm certain that President Cherino would have it memorized."
10057050-125 = "...Returning to the main topic, it's good to see that the two of them are working#nfaster now."
10057050-126 = "Unlike me, who simply provides assistance, their progress is what determines#nwhen the tank will be completed."
10057050-127 = "[s] \"Do tanks not make you excited?\""
10057050-128 = "Not really. If you're asking whether or not they excite me, then I'll have to lean#nmore towards no."
10057050-129 = "While tanks are cool and technically fascinating... #nBesides being strong and cool, they aren't particularly that big of a deal."
10057050-130 = "[s] \"Not that big of a deal you say, but you still said they were cool twice...\""
10057050-131 = "I'm not all that interested in being released from 183 or receiving an accolade."
10057050-132 = "All I want... #nIs to help my two and only friends accomplish what they want."
10057050-133 = "However, they're the first friends I've ever had, so I'm unsure whether whether#nthis feeling is right or not."
10057050-141 = "Ranaaa! Do we have any materials left?"
10057050-145 = "Ah, so you were here too, Sensei!"
10057050-146 = "Sigh... Who would've thought that things going TOO well would end up being an#nissue..."
10057050-147 = "Huh? Why're there punch cards in the trash?"
10057050-149 = "If there was nothing left in the garage, then we're all out of materials."
10057050-151 = "Uwaah! Right when we were on a roll toooo!!"
10057050-152 = "Well.. If there's out of materials, then it is what it is."
10057050-153 = "[s] \"What happened?\""
10057050-154 = "Usually, it'd take us ages just to make one thing..."
10057050-155 = "However, now that we've suddenly picked up the pace, #nwe've managed to burn through all of the junk and materials we've been#ncollecting."
10057050-156 = "It's not like we could've hoarded either, since we don't have much room here."
10057050-157 = "And because these aren't exactly easy to obtain materials either, throwing money at the problem wouldn't fix it."
10057050-158 = "We need titanium, copper, high-purity tempered glass... Wonder where we could#neven get these?"
10057050-159 = "[s] \"What will you do then?\""
10057050-160 = "We might be able to complete it if I disassembled the stuff that I've made, #nthen repurpose the parts for the tank. However..."
10057050-161 = "If we do that, I'm not sure if we'd finish it on time for the qualifiers."
10057050-170 = "Rana, did you come up with a good idea?"
10057050-172 = "We can get the materials. Look at the slogan."
10057050-173 = "\"Red Winter's facilities are public property for everyone. #nPlease treat them care, as you would your own!\" You mean that slogan?#nWhat about it?"
10057050-174 = "\"As you would your own,\" it says."
10057050-179 = "In other words, we should treat it as if it's ours."
10057050-180 = "Red Winter's facilities are ours?"
10057050-181 = "Public property for everyone... which meaaans."
10057050-182 = "Yeah."
10057050-184 = "We're going to raid the academy."