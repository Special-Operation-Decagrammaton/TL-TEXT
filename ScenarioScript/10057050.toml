[translation]
10057050-1 = "Episode 5;Why a Tank?"
10057050-3 = "[log]Until the Tank Race Preliminaries[/log]"
10057050-5 = "[log]D-3[/log]"
10057050-9 = "The good news is that tank production is going smoothly..."
10057050-10 = "The bad news is that research on that super low-cost pudding has succeeded!"
10057050-11 = "It looks and feels like pudding, but...#nBecause we increased the water ratio to the absolute limit, it disappears the moment it enters your mouth!"
10057050-12 = "Well...#nWe made it \"melt in your mouth\" just like you asked, so nobody can complain..."
10057050-13 = "To everyone eating this for school lunch, let me apologize in advance! Sorry!"
10057050-14 = "Anyway... as for the tank, things have been going surprisingly well since yesterday!"
10057050-15 = "[s] \"Is coordinating opinions with Anna going well too?\""
10057050-16 = "That is going well... I think! Thanks to you, Sensei!"
10057050-17 = "Anna is smart and capable. Tank design is her specialty, so she is very reliable."
10057050-18 = "Though when we have to cooperate, she can be a bit unreasonable... Ah, maybe that is saying too much..."
10057050-19 = "You know, what is it called?#nSomeone who is \"stubborn and refuses to listen to others.\""
10057050-20 = "[s] \"Y-You probably do not need to remember that word!\""
10057050-21 = "It is like there are parts of her that are not quite suited to being an engineer...#nActually, maybe she is not suited for it at all."
10057050-22 = "But among us, Anna is the only one who can build a functioning tank, so...#nWe just have to trust her!"
10057050-23 = "I am sure she has some secret strategy to win.#nShe cannot just be acting all boastful for no reason!"
10057050-24 = "Besides, I hate being up on the mountain!#nIt is cold and I catch a cold right away, and they do not sell sweet desserts or cute clothes up here!"
10057050-28 = "Ah, of course... The desserts and clothes are strictly for research reference... you know?"
10057050-29 = "Ehehe...!"
10057050-30 = "[s] \"Research is important, right!\""
10057050-32 = "[ns] \"There are so many other things, why a tank?\""
10057050-33 = "Because a tank is heavy industry combining machinery, chemistry, and electronics!#nDon't you think it is the perfect way to put everything we studied so hard into practice?"
10057050-34 = "Steel plate heat treatment, explosive formulation, and the synthesis of fuel and lubricants are all chemistry!"
10057050-35 = "Plus, it is super cool!"
10057050-38 = "Erina, so you were having that kind of conversation. It would be nice if you said those things in front of me, too."
10057050-39 = "It is true that Erina and I often disagree. #nOur goals are the same, but our methods are completely different. Sigh..."
10057050-40 = "It cannot be helped since everything from our majors to our backgrounds is different. For example..."
10057050-44 = "Sensei, what do you think happens when you run a tank with an additional fuel tank attached to its side?"
10057050-45 = "Is it dangerous, or is it safe?"
10057050-46 = "[s] \"It seems dangerous if an artillery shell hits it and it catches fire...\""
10057050-47 = "Heh, it certainly looks dangerous at a glance."
10057050-48 = "But actually, it even improves safety.#nBecause the fuel tank protects the tank body!"
10057050-49 = "[s] \"Really? How so?\""
10057050-50 = "First of all... even if the external fuel tank catches fire, #n since the hull is made of steel, it does not cause any major issues."
10057050-51 = "Besides, the fuel absorbs and reduces the impact of shells."
10057050-52 = "In other words, by using this design, #nwe can solve the problems of fuel tank volume and defensive power at the same time, hitting two birds with one stone!"
10057050-53 = "Especially in the case of shaped charge shells... #nthe fuel reduces penetration power, so it even plays the role of spaced armor!"
10057050-54 = "It is a great example of something looking dangerous at first glance, but actually not being dangerous at all."
10057050-55 = "Yet whenever I propose this to Erina, she makes a terrible face."
10057050-56 = "She acts cool most of the time, but she is surprisingly timid, that girl."
10057050-57 = "[s] \"Is tank production going well?\""
10057050-61 = "...Yes! It is progressing at a speed incomparable to before."
10057050-62 = "Before, we used to decide things one by one through RWWE, which took forever.#nWe would get so absorbed in wrestling that we would sometimes forget what we were even fighting about."
10057050-63 = "...God knows what would have happened if you hadn't helped us, Sensei."
10057050-64 = "[s] \"There are so many other things, why a tank?\""
10057050-65 = "...The reason we chose a tank, you ask?"
10057050-66 = "When President Cherino said, \"We are going to win the Gehenna Cup!\", #na student council worker came all the way here to put up tournament posters."
10057050-67 = "When I casually said, \"It has been a while since we built a tank,\" Erina got all excited."
10057050-68 = "And before we knew it, we just went along with it."
10057050-69 = "Well, it goes without saying... we couldn't build it without me!#nI am Red Winter's... no, Kivotos's greatest tank designer!"
10057050-70 = "A tank... you could call it the culmination of mechanical engineering. Power, structure, materials, processing—#nit all starts from a single blueprint, forming a magnificent mechanical ecosystem!"
10057050-71 = "For me not to participate in such an opportunity would be nothing short of blasphemy against engineering."
10057050-72 = "I even created all the welding procedures myself!#nBecause if the welding sequence is sloppy, residual stress will warp the hull!"
10057050-73 = "Sigh... It is not easy being the academy's top genius.#nTo be destined to build a tank in a place like this."
10057050-74 = "I should start thinking of my victory speech now just in case..."
10057050-76 = "I see, I am glad to hear there has been progress."
10057050-77 = "Ah, please watch your step. I was just organizing the rubber hoses."
10057050-78 = "Those two not getting along is nothing new.#nThey are so similar, yet they have not a single thing in common."
10057050-82 = "...Me? I just finished up with my main job of computer management."
10057050-83 = "[s] \"You hacked the system, yet they still put you in charge of computers...\""
10057050-84 = "Strictly speaking, it is a bit different."
10057050-85 = "President Cherino thinks I stole things.#nShe probably didn't listen to the report properly."
10057050-86 = "So, she ordered me to handle computer systems where there is nothing to steal."
10057050-87 = "[s] \"Is that... so.\""
10057050-88 = "That is right."
10057050-89 = "It is puzzling that she made me take on separate computer duties even though the computer department already exists."
10057050-90 = "Before, there were times when the computer department ordered too few ducks, so I helped adjust things...#nAfter that, there were a lot of ordering mistakes, so I assume they needed a separate computer division."
10057050-91 = "Well, regardless of the circumstances, I am in charge of computer management.#n...Ah, that reminds me.#nOut of curiosity, I looked into the \"Class 227 Special Class\" you mentioned, Sensei."
10057050-92 = "It was buried deep in the server room, and it was quite a struggle to find."
10057050-97 = "Here it is."
10057050-98 = "[s] \"What is this? A scantron sheet?\""
10057050-99 = "It is called a \"punch card,\" used for Red Winter's computer management."
10057050-100 = "It is a type of recording medium where data is recorded by punching holes in it."
10057050-101 = "Its capacity is extremely small, holding only 80 characters per sheet."
10057050-102 = "[s] \"Why are you still using those?\""
10057050-103 = "\"Because it works for now.\""
10057050-104 = "I do not know the details, but that is probably reason enough."
10057050-105 = "Aside from their leader, Red Winter doesn't change things unless there is a specific reason to.#nTheir electronic technology is at that level."
10057050-106 = "Though it is high reliability you can actually see and touch, so it is to my liking."
10057050-107 = "Anyway.#nIt should contain the roster and administrative history for Class 227, so I will load it up."
10057050-108 = "Punch cards execute in the exact order they are loaded, #nso I need to be careful with the card sequence..."
10057050-113 = "[ns] \"Watch your step!\""
10057050-114 = "Ah."
10057050-119 = "..."
10057050-120 = "[s3] \"Are you okay? Any injuries?\"\n[s4] \"The cards are all scattered everywhere...\""
10057050-123 = "..."
10057050-124 = "I doubt there was much useful information anyway.#nIf it were important, President Cherino would remember it."
10057050-125 = "...To get back on topic, it is good that those two have picked up their working speed."
10057050-126 = "Unlike me, who is just assisting, their progress dictates when the tank will be finished."
10057050-127 = "[s] \"Are you not interested in the tank, Rana?\""
10057050-128 = "Yeah. If you ask whether I am \"interested or not,\" I would say no."
10057050-129 = "Tanks are cool, technologically interesting...#nand other than being strong and cool, they are not a big deal."
10057050-130 = "[s] \"For something that is 'not a big deal,' you used the word 'cool' twice...\""
10057050-131 = "I am not interested in Room 183 getting a pardon or winning an award."
10057050-132 = "It is just...#nI want to help the only two friends I have do what they want to do."
10057050-133 = "This is my first time making friends, so I do not know if how I feel right now is right."
10057050-141 = "Rana! Are there any materials left?"
10057050-145 = "Ah, Sensei is here too!"
10057050-146 = "Sigh... Who knew things going too well could also cause problems..."
10057050-147 = "Huh? Why are there punch cards in the trash can?"
10057050-149 = "If there are no materials in the garage, then there are none left."
10057050-151 = "Uwah~! And we were making such great progress too!!"
10057050-152 = "Well... if we don't have them, it can't be helped."
10057050-153 = "[s] \"What is the matter?\""
10057050-154 = "Normally, it takes us forever to make even one part..."
10057050-155 = "But because our speed suddenly increased, #nwe burned through all the scrap and materials we had collected up until now."
10057050-156 = "And this place isn't big enough to stockpile a bunch of materials."
10057050-157 = "They aren't things you can just easily acquire, so we can't solve this with money either."
10057050-158 = "Titanium, copper, high-purity tempered glass... where are we supposed to get all that?!"
10057050-159 = "[s] \"What should we do?\""
10057050-160 = "We could dismantle what we've built so far and rebuild while conserving materials, but..."
10057050-161 = "If we do that, we might not make it in time for the preliminaries."
10057050-170 = "Rana, did you think of a good way?"
10057050-172 = "We have materials. Look at that slogan over there."
10057050-173 = "\"Red Winter facilities are everyone's public property. Treat them with care like your own things!\" That one? What about it?"
10057050-174 = "It says, \"Your own things.\""
10057050-179 = "In other words, \"our things.\""
10057050-180 = "Red Winter facilities are \"our things\"?"
10057050-181 = "\"Everyone's public property\"... huh?"
10057050-182 = "Yeah."
10057050-184 = "We are going to raid the academy."
