[translation]
10057050-1 = "Episode 5;Why a Tank?"
10057050-3 = "[log]Until the Tank Race Qualifiers[/log]"
10057050-5 = "[log]D-3[/log]"
10057050-9 = "The good news is that the tank construction is going smoothly—"
10057050-10 = "The bad news is that the research into that ultra-low-cost pudding was a success!"
10057050-11 = "It looks and feels like pudding, but...#nBecause I increased the water ratio to the limit, it disappears the moment you put it in your mouth!"
10057050-12 = "Well...#nI made it \"melt in your mouth\" just like the instructions said, so I shouldn't get any complaints..."
10057050-13 = "To everyone who will be eating this for school lunch, let me apologize in advance! I'm so sorry!"
10057050-14 = "Anyway... the tank has been going surprisingly well since yesterday!"
10057050-15 = "[s] \"Is coordinating with Anna going well too?\""
10057050-16 = "That's going well too... I think! Thanks to you, Sensei!"
10057050-17 = "Anna is smart and capable. She's an expert in tank design, so she's very reliable."
10057050-18 = "But when we work together, she can be a bit unreasonable... Ah, maybe that's saying too much..."
10057050-19 = "You know, that... what do you call it?#nSomeone who is \"stubborn and won't listen to what others say.\""
10057050-20 = "[s] \"Y-you probably don't need to remember that word!\""
10057050-21 = "It's like there are parts of her that aren't suited to be an engineer...#nActually, maybe she's not suited for it at all."
10057050-22 = "But among us, Anna is the only one who can build a tank that actually moves...#nSo I have no choice but to trust her!"
10057050-23 = "I think she has some secret strategy to win.#nShe wouldn't just be acting arrogant for no reason, right!"
10057050-24 = "Besides, I don't want to be on the mountain anymore!#nIt's cold and I catch a cold easily, and they don't sell sweet desserts or cute clothes there!"
10057050-28 = "Oh, of course... the desserts and clothes are just for research reference... you know?"
10057050-29 = "Hehehe...!"
10057050-30 = "[s] \"Research is important, right!\""
10057050-32 = "[ns] \"There are so many other things, so why a tank?\""
10057050-33 = "Because a tank is heavy industry that brings together mechanics, chemistry, and electronics!#nDon't you think it's perfect for putting what we've studied so hard into practice?"
10057050-34 = "Heat treatment of steel plates, mixing gunpowder, synthesizing fuel and lubricants—it's all chemistry!"
10057050-35 = "Plus, it's super cool!"
10057050-38 = "Erina, so that's what you were talking about. I wish you'd say that in front of me too."
10057050-39 = "It's true that Erina and I often don't see eye to eye.#nEven though our goals are the same, our methods are completely different. Phew..."
10057050-40 = "It can't be helped since everything from our majors to our backgrounds is different. For example..."
10057050-44 = "Sensei, what do you think happens if you attach an extra fuel tank to the side of a tank and drive it?"
10057050-45 = "Is it dangerous, or is it safe?"
10057050-46 = "[s] \"It seems dangerous if it gets hit by a shell and catches fire...\""
10057050-47 = "Fufu, it certainly looks dangerous, doesn't it?"
10057050-48 = "But in reality, it actually improves safety.#nBecause the fuel tank protects the tank!"
10057050-49 = "[s] \"Is that so? How?\""
10057050-50 = "In the first place... even if the external fuel tank catches fire,#nthe hull is made of steel, so it won't have a major impact."
10057050-51 = "Also, the fuel reduces the power of the shells."
10057050-52 = "In other words, by using this design,#nyou can solve the problems of fuel tank volume and defensive power at the same time—killing two birds with one stone!"
10057050-53 = "Especially in the case of shaped charge shells...#nthe fuel reduces the penetration power, so it also acts as spaced armor!"
10057050-54 = "It's a good example of something that looks dangerous at first glance but actually isn't."
10057050-55 = "But when I suggest this to Erina, she makes such a face."
10057050-56 = "She pretends to be cool, but she's surprisingly timid, that one."
10057050-57 = "[s] \"Is the tank construction going well?\""
10057050-61 = "...Yes! It's progressing at a speed that can't be compared to before."
10057050-62 = "Before, we used to decide things one by one with \"RWWE,\" so it took a long time.#nWe were so focused on wrestling that we sometimes forgot what we were even fighting about."
10057050-63 = "...I don't know what would have happened if you hadn't helped us, Sensei."
10057050-64 = "[s] \"There are so many other things, so why a tank?\""
10057050-65 = "...The reason we chose a tank, you ask?"
10057050-66 = "When President Cherino said, \"We will win the Gehenna Cup!\",#nthe administrative staff came all the way here to put up the tournament posters."
10057050-67 = "When I casually said, \"It's been a while since I've seen a tank,\" Erina got all excited."
10057050-68 = "And so it just ended up happening."
10057050-69 = "Well, it goes without saying... but it couldn't be built without me!#nI am Red Winter's... no, Kivotos's best tank designer!"
10057050-70 = "A tank... it can be called the culmination of mechanical engineering. Power, structure, materials, processing—#neverything starts from a single blueprint and forms a wonderful mechanical ecosystem!"
10057050-71 = "For me not to participate in such an opportunity would be a blasphemy against engineering."
10057050-72 = "I even created all the welding procedures!#nIf the welding sequence is sloppy, the residual stress will twist the hull!"
10057050-73 = "Phew... being the genius valedictorian isn't easy.#nTo think I'm fated to build a tank even in a place like this."
10057050-74 = "I should start thinking about my victory speech now..."
10057050-76 = "I see, I'm glad there's been progress."
10057050-77 = "Oh, please watch your step. I was organizing the rubber hoses."
10057050-78 = "It's normal for the two of them to disagree.#nEven though they're similar, they don't have a single thing in common."
10057050-82 = "...Me? I've just finished a phase of my main job, computer management."
10057050-83 = "[s] \"You're in charge of computing even though you hacked it...\""
10057050-84 = "Strictly speaking, that's a bit different."
10057050-85 = "President Cherino thinks I stole something.#nShe probably didn't listen to the report properly."
10057050-86 = "So, she ordered me to do computing, where there's nothing for me to steal."
10057050-87 = "[s] \"I see...\""
10057050-88 = "That's right."
10057050-89 = "It's questionable that she would intentionally assign separate computing tasks even though there is already a Computing Bureau."
10057050-90 = "Previously, I adjusted the order numbers for ducks at the Computing Bureau because they were low...#nbut since there were many ordering errors after that, I suspect they needed a separate computing department."
10057050-91 = "Well, regardless of the circumstances, I've been entrusted with managing the computing.#n...Oh, by the way.#nI was curious, so I looked into the \"227th Special Class\" you mentioned, Sensei."
10057050-92 = "It was buried deep in the server room, so it was hard to find."
10057050-97 = "Here it is."
10057050-98 = "[s] \"What is this? A mark sheet?\""
10057050-99 = "It's called a \"punch card,\" and it's used for Red Winter's computer management."
10057050-100 = "It's a type of recording medium that records data by punching holes in it."
10057050-101 = "The capacity is very small, and you can only fit 80 characters on one card."
10057050-102 = "[s] \"Why are you still using that?\""
10057050-103 = "Because \"it works for now.\""
10057050-104 = "I don't know the details, but that's probably the only reason they haven't changed it."
10057050-105 = "Except for the leader, Red Winter doesn't change things that don't have a particular reason to be changed.#nThe electronic technology here is at that level."
10057050-106 = "It's something you can actually see and touch... so it's highly reliable, which is to my liking."
10057050-107 = "Anyway.#nI think the roster and management history of the 227th Special Class are on here, so I'll load it."
10057050-108 = "Punch cards are executed in the order they are loaded, so#nbe careful with the order of the cards..."
10057050-113 = "[ns] \"Watch your step!\""
10057050-114 = "Ah."
10057050-119 = "..."
10057050-120 = "[s3] \"Are you okay? Are you hurt?\"\n[s4] \"The cards are all scattered...\""
10057050-123 = "..."
10057050-124 = "I don't think there was any major information.#nIf it were important, President Cherino would probably remember it."
10057050-125 = "...To get back to the topic, it's a good thing that those two's work speed has increased."
10057050-126 = "Unlike me, who is just assisting, their progress determines when the tank will be completed."
10057050-127 = "[s] \"Are you not interested in the tank, Rana?\""
10057050-128 = "Yes. If you ask me if I'm \"interested or not,\" I'd say I'm not."
10057050-129 = "Tanks are cool and technically interesting...#nbut other than being strong and cool, they're not a big deal."
10057050-130 = "[s] \"You say it's not a big deal, but you said 'cool' twice...\""
10057050-131 = "I'm not interested in 183 receiving a pardon or winning an award."
10057050-132 = "It's just that...#nI just want to help with what my only two friends want to do."
10057050-133 = "This is the first time I've made friends, so I don't know if these feelings are right."
10057050-141 = "Rana! Do we have any materials left?"
10057050-145 = "Oh, Sensei, you're here too!"
10057050-146 = "Phew... to think that things going too well would become a problem..."
10057050-147 = "Huh? Why is a punch card in the trash can?"
10057050-149 = "If the materials aren't in the garage, we're out."
10057050-151 = "Ugh~! And we were doing so well too~!!"
10057050-152 = "Well... if we don't have them, it can't be helped."
10057050-153 = "[s] \"What's wrong?\""
10057050-154 = "Usually, it takes a really long time to make one thing..."
10057050-155 = "But since the speed suddenly increased,#nwe've used up all the scrap and materials we'd collected."
10057050-156 = "This place isn't big enough to store a lot of materials."
10057050-157 = "And they aren't easy to get, so we can't just solve it with money."
10057050-158 = "Titanium, copper, high-purity tempered glass... where am I supposed to get these~?"
10057050-159 = "[s] \"What should we do?\""
10057050-160 = "We might be able to finish it if we dismantle what we've already made#nand rebuild it while saving materials, but..."
10057050-161 = "If we do that, we might not make it in time for the qualifiers."
10057050-170 = "Rana, did you think of a good way?"
10057050-172 = "We have materials. Look at that slogan."
10057050-173 = "\"Red Winter's facilities are everyone's public property.#nLet's cherish them like our own!\" That one? What about it?"
10057050-174 = "It says \"our own.\""
10057050-179 = "In other words, \"our property.\""
10057050-180 = "Red Winter's facilities are \"our property\"?"
10057050-181 = "\"Everyone's public property\"... huh?"
10057050-182 = "Yeah."
10057050-184 = "We'll raid the academy."