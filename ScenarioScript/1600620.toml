[translation]
1600620-1 = "Лучшие(?) летние каникулы"
1600620-3 = "Буду... есть лучшую еду... на пляже... с Сенсеем... Даже если слишком жарко..."
1600620-4 = "[s] «Пляж с... Изуми...»"
1600620-5 = "Нет... Ещё немного... Нельзя... тратить время вот так..."
1600620-6 = "Аах..."
1600620-7 = ""
1600620-9 = ""
1600620-11 = "[ns1] «О нет... Изуми перегревается...»\n[ns2] «Всё, втыкайте в меня вилку. Я готов...»"
1600620-14 = "О нет... Сенсей тоже перегревается..."
1600620-15 = "[s] «Ничего не поделаешь...»"
1600620-16 = "Ты прав... Ничего не поделаешь..."
1600620-17 = "Потому что... тут слишком... чертовски..."
1600620-18 = "Жааааарко!"
1600620-20 = "Мы добрались до тени. Слава богу."
1600620-21 = "Но так жарко, что все рестораны закрылись."
1600620-22 = "Мой план попробовать вместе с Сенсеем все деликатесы на пляже разрушен. Разрушен!"
1600620-23 = "[s] «Пожалуйста... Просто дай мне чего-нибудь холодного поесть...»"
1600620-24 = "Точно... холодное, холодное — это хорошо..."
1600620-25 = "Погоди, Сенсей! У меня отличная идея!"
1600620-26 = "Что же это? Смотри! Та-дам!"
1600620-27 = ""
1600620-29 = ""
1600620-31 = "Ага! Именно! Мой холодильник со льдом! Посмотри, сколько здесь фруктов и сока!"
1600620-32 = "Я могу сделать тебе ледяной фруктовый пунш!"
1600620-33 = "[s] «Фруктовый пунш Изуми?»"
1600620-34 = "Начнём с целого арбуза, потом добавим ананас, чернику, вишню..."
1600620-35 = "О! Я забыла сок! Нальём туда апельсиновый сок и газировку, а ещё..."
1600620-36 = "В тени ветерок приятно касался моей кожи."
1600620-37 = "Немного каламанси, немного маракуйи, айвы, авокадо..."
1600620-40 = "Волны разбивались о песок, а над нашими головами кричали чайки."
1600620-42 = "Натереть дуриан, размять мармело, нарезать пепино, солёный кивано и нони..."
1600620-43 = "Потом смешать всё с дополнительным соком кислой вишни, соком хвои и рутбиром!"
1600620-44 = "[ns3] «П-Подожди, Изуми!»\n[ns4] «Ты уверена, что всё это вообще безопасно добавлять во фруктовый пунш?!»"
1600620-47 = "Хм? О чём ты, Сенсей? Мой фруктовый пунш сделан только из самых свежих фруктов и соков из этого холодильника."
1600620-48 = "А, поняла. Ты боишься, что он будет недостаточно холодным? Не переживай! Льда у меня полно!"
1600620-49 = "Хи-хи. И напоследок посыпем моей суперсекретной приправой!"
1600620-50 = "Всё перемешиваем и...!"
1600620-51 = "Готово! Пробуй, Сенсей!"
1600620-52 = "Хм? Что такое?"
1600620-53 = "А, понимаю. Создатель должен попробовать первым, да?"
1600620-54 = "Очень щедро с твоей стороны, Сенсей! Ну, до дна!"
1600620-55 = ""
1600620-56 = "Изуми одним махом выпила своё варево. Ни секунды сомнений..."
1600620-57 = "Сенсей! Это ОЧЕНЬ вкусно!"
1600620-58 = "Фрукты так хорошо сочетаются, но при этом вкус каждого всё равно чувствуется!"
1600620-59 = "[s] «Поистине напиток, достойный Изуми! А-ага...»"
1600620-60 = "Да! Мне очень нравится этот фруктовый пунш!"
1600620-61 = "Знаю, что сама его приготовила, но, может быть, это самый запоминающийся напиток, который я когда-либо пробовала!"
1600620-62 = "А теперь твоя очередь, Сенсей!"
1600620-63 = "Или... ты не хочешь пробовать мой напиток?"
1600620-64 = "[s] «Изуми использует свой козырь!»"
1600620-65 = "Хм? Что ты имеешь в виду, Сенсей? Чего-то не хватает?"
1600620-66 = "А, поняла! Сейчас принесу тебе миску побольше. Попробуй, Сенсей!"
1600620-67 = "Увидев сияющее, полное надежды лицо Изуми, я сдался и сделал большой глоток."
1600620-68 = ""
1600620-80 = "—эй. Сенсей!"
1600620-81 = "Просыпайся, Сенсей! *всхлип*"
1600620-82 = "[s] «Незнакомый потолок— Стоп, это небо.»"
1600620-83 = "Ты в порядке, Сенсей?!"
1600620-84 = "Говоришь, всё нормально? Но ты потерял сознание после моего напитка!"
1600620-85 = "[s] «Это всё просто сон в летнюю ночь...»"
1600620-86 = "А? Не понимаю. Хотя ты иногда говоришь странные вещи, Сенсей."
1600620-87 = "*вздох* И что теперь делать? Уже ночь. Мы пропустили все вкусные рестораны."
1600620-88 = "[s5] «Зато мы хотя бы пережили жару.»\n[s6] «Теперь уже не жарко, значит, миссия выполнена?»"
1600620-91 = ""
1600620-93 = ""
1600620-94 = "Вот... как?"
1600620-95 = "Хорошо! Как скажешь, Сенсей!"
