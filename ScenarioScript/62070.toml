[translation]
62070-1 = "Эпизод 7;Porta Pacis 1"
62070-3 = "[ns] «Что... это такое?»"
62070-4 = "Н-Ну... Вообще-то я и сама толком не знаю. Это здание здесь, в Ариусе."
62070-5 = "Кажется, оно очень, очень старое. Но это почти всё, что я знаю. Возможно, Отряд знает больше."
62070-7 = "Я знаю лишь, что название означает «Врата мира»..."
62070-8 = "...и что его двери никогда нельзя открывать."
62070-10 = "Да. За долгую историю гражданских войн в Ариусе правители сменяли друг друга один за другим."
62070-11 = "И всё же каждая фракция соблюдала закон, запрещавший приближаться к Porta Pacis."
62070-12 = "...Теперь, когда я об этом думаю... интересно, что там вообще может быть спрятано."
62070-13 = "Все эти люди ненавидели друг друга, но хотя бы в одном вопросе сумели договориться."
62070-14 = "Тогда мы были слишком заняты выживанием, чтобы задумываться о таких вещах..."
62070-15 = "Нам, первокурсницам, всегда говорили, что это не наше дело и нечего совать нос куда не просят."
62070-16 = "..."
62070-17 = "Я слышала только слухи."
62070-18 = "Один из них гласит, что там похоронены тайны прошлого Ариуса, о которых никому не положено знать."
62070-19 = "[s] «О прошлом Ариуса?»"
62070-20 = ""
62070-22 = ""
62070-23 = "Но я ведь всё слышала об истории Ариуса от старших..."
62070-24 = "Да, но ты слышала записи Тринити. Потому что публично известно только это."
62070-25 = "...У нас никогда не было возможности самим их проверить, но мы росли, зная, что всё написанное в открытых записях Тринити — чепуха."
62070-26 = "Н-Например, будто отлучение стало неизбежным после того, как Ариус прибегла к насилию на Совете..."
62070-27 = "Будто в нашем изгнании Ариусу некого винить, кроме самих себя. И так далее."
62070-28 = "Говорят, историю пишут победители... и здесь это особенно верно."
62070-29 = ""
62070-31 = ""
62070-33 = "..."
62070-34 = "[s] «Ацуко?»"
62070-35 = "Хм? Да, Сенсей?"
62070-36 = "Я что-то хотела сказать?"
62070-37 = "..."
62070-38 = "Если позволите спросить, Сенсей..."
62070-39 = "Вы знаете кого-нибудь из студентов, хорошо разбирающихся в тёмных страницах истории отношений Тринити и Ариуса?"
62070-40 = "...Это невозможно, Ацуко. Откуда им знать больше?"
62070-41 = "Нет, возможно всегда. Ведь куда ни посмотри, всегда найдутся те, кто ищет и сохраняет истину."
62070-42 = "Может быть, Библиотечный комитет Тринити?"
62070-43 = "[s] «С каких пор ты знаешь о Библиотечном комитете?»"
62070-44 = "Я мало знаю о самих студентах, но хотя бы слышала о них."
62070-45 = "А ещё слышала, что у их президента весьма... впечатляющий характер, помимо прочего."
62070-46 = "[s] «(...Она ведь... не ошибается...)»"
62070-47 = "К-Как? Мы никогда не получали таких разведданных..."
62070-48 = "Фуфу. Кто знает."
62070-49 = "Возможно, это просто... привилегия моей королевской родословной?"
62070-50 = "Вот она, наша Химэ."
62070-51 = "Т-Точно...! О-Обычно кому-то вроде меня нельзя даже смотреть на принцессу..."
62070-52 = "Ну-ну. Это уже не я. Теперь я просто Ацуко."
62070-53 = ""
62070-55 = ""
62070-56 = "Ч-Что?! Н-Н-Н-Но...!"
62070-57 = "Мы обе первокурсницы, разве нет, Майя?"
62070-58 = "Э-Это правда! Но всё же...!"
62070-59 = "Давай потренируемся. А-цу-ко!"
62070-60 = ""
62070-62 = ""
62070-63 = "А-Ацуко..."
62070-64 = "Да. Молодец. Вот, пожмём руки."
62070-65 = "И-ик..."
62070-66 = ""
62070-68 = ""
62070-70 = "...У Ацуко были собственные секреты, которые ей приходилось хранить."
62070-71 = "Это неизбежное следствие её положения и статуса. По праву рождения ей был доступен более высокий уровень разведданных."
62070-72 = "Так вот почему... ты нам... о них не рассказывала..."
62070-73 = "Да, прошу прощения. В то время, если бы я сказала лишнее..."
62070-74 = "Мы рисковали бы своими жизнями."
62070-75 = "И-И-и..."
62070-76 = "А после того, как мы покинули Ариус, какой в этом уже был смысл?"
62070-77 = "Да. Но теперь это имеет значение."
62070-78 = "[s] «Я понимаю, Ацуко»."
62070-79 = ""
62070-81 = ""
62070-82 = "[ns] «Попробую связаться с Уи»."
62070-83 = "«Уи». Значит, её так зовут."
62070-84 = ""
62070-86 = ""
62070-87 = ""
62070-88 = "Тогда оставляю это вам, Сенсей."
62070-95 = ""
62070-96 = ""
62070-97 = "Я что вам, карманная энциклопедия?!?!"
62070-98 = ""
62070-101 = ""
62070-102 = "И-Ик...! Она страшная... такая страшная...!"
62070-103 = "У-Уаааа... Она страшная... такая страшная...!"
62070-104 = "Т-Тебе тоже страшно, Хиёри? Я думала, членов Отряда вообще ничем не напугаешь."
62070-105 = "Н-Но в мире столько всего страшного..."
62070-106 = ""
62070-108 = ""
62070-110 = ""
62070-111 = "[ns1] «Простите, мне правда очень жаль...»\n[ns2] «Как насчёт двадцати купонов на американо? Для „White & Mason“!»"
62070-112 = ""
62070-113 = ""
62070-117 = "Президент, не соглашайтесь! Это возможность отплатить Сенсею за всё, что он для нас сделал, а не выклянчивать у него кофеин!"
62070-119 = "Н-Но..."
62070-120 = "Если ты хотя бы подумаешь об этом, я потащу тебя в «командировку» прямиком к Сенсею!"
62070-121 = "Ааа?!"
62070-122 = ""
62070-124 = ""
62070-126 = ""
62070-127 = "Она действительно полностью соответствует своей репутации."
62070-128 = "[s] «Прости. Уи всегда такая»."
62070-129 = "Здравствуйте, Уи, Шимико. Я Хакари Ацуко из школы-сателлита Ариус. Рада знакомству."
62070-130 = "Джомаэ Саори."
62070-131 = "...Имашино Мисаки."
62070-132 = "Я Цучинага Хиёри... Хи-хи... Эм, я слышала, старая библиотека Тринити — одна из самых известных библиотек Кивотоса..."
62070-133 = "У вас ведь есть... например, старые выпуски журналов?"
62070-134 = "Да, Хиёри. Для архива мы храним электронные копии журналов. Хочешь, я передам тебе несколько через Сенсея?"
62070-135 = ""
62070-137 = ""
62070-138 = "П-Правда?! С-Спасибо! Н-Но мне нечего дать взамен..."
62070-139 = "Всё в порядке. Любой, кто понимает непреходящую ценность печатного слова, — наш союзник."
62070-140 = "Уаааа! Как же хорошо, что я жива...!"
62070-141 = "Прошу прощения за запоздалое представление. Я Эндо Шимико."
62070-142 = ""
62070-145 = ""
62070-146 = "Что? М-Мне тоже надо представиться?! А! Эм, ну... Я Татиги Майя... Рада знакомству..."
62070-147 = ""
62070-149 = ""
62070-151 = "..."
62070-152 = "Президент?"
62070-153 = ""
62070-155 = ""
62070-156 = "Н-Ну... *вздыхает* Я Козэки Уи... Перейдём к делу..."
62070-157 = "[s] «Ты прочитала о нашей ситуации в MomoTalk, верно?»"
62070-158 = "Да. Мы проверили все доступные нам источники, и, думаю, нам удалось найти то, что вам нужно, Сенсей."
62070-159 = "Вы нашли?! Но..."
62070-160 = "...Разумеется, в Тринити эти материалы относятся к запрещённым книгам..."
62070-161 = "Я понимаю, почему часть этих материалов нельзя открывать широкой публике, но..."
62070-162 = "Всё из-за упрямства Чаепития и Сестринства... Они так вопиюще обходятся с этим вопросом, что сами начинают выглядеть подозрительно."
62070-163 = "...Но мы всё-таки Библиотечный комитет Тринити, к тому же хранители старой библиотеки. Мы смогли найти большую часть того, что вам требовалось."
62070-164 = "Конечно, сведения о других академиях могут быть не совсем точными..."
62070-165 = "...но даже это — лишь очередное проявление прошлого Тринити."
62070-166 = "Эти властные мерзавцы вечно хотят перекроить историю в свою пользу..."
62070-167 = "Вот и лгут, заметают следы, а потом прикрывают одну ложь другой!"
62070-168 = "...Но в данном случае..."
62070-169 = "Можешь рассказать нам, что тебе известно, Уи?"
62070-170 = "Я спрашиваю как та, кого когда-то называли королевской кровью Ариуса."
62070-171 = ""
62070-173 = ""
62070-174 = "«Королевская кровь»? Ты?"
62070-175 = "[s] «Да. Она говорит правду»."
62070-176 = ""
62070-178 = ""
62070-179 = "..."
62070-180 = "Я всё равно собиралась рассказать вам всё, что знаю, просто чтобы вы понимали."
62070-181 = "Но раз за вас ещё и Сенсей поручился, скрывать что-либо тем более нет смысла."
62070-182 = ""
62070-184 = ""
62070-185 = "Изначально Porta Pacis действительно должна была использоваться именно так, как следует из её названия."
62070-186 = "Да. Она должна была стать Вратами мира."
62070-187 = "...Её построили, когда школа-сателлит Ариус только отделилась от Объединённой школы Тринити."
62070-188 = "Как ни странно, тогда... и в Тринити, и в Ариусе считали, что этот конфликт... удастся разрешить мирно..."
62070-189 = "...Но всё вышло совсем не так, верно?"
62070-190 = "...Да."
62070-191 = "Что ж, даже наши записи о том периоде истории довольно туманны."
62070-192 = "...Есть выражение: настоящий ужас власти заключается не в том, что она записывает, а в том, что она вовсе ничего не записывает."
62070-193 = "Поэтому насчёт этой части мы не были уверены..."
62070-194 = "...Для общей картины это не так уж важно, но я кратко подведу итог."
62070-195 = "Бесконечная гражданская война в Ариусе началась со спора вокруг завершения Porta Pacis."
62070-196 = ""
62070-198 = ""
62070-199 = "Но разве это не Врата МИРА? Получается полная противоположность тому, что они должны символизировать!"
62070-200 = "А-А мне вообще можно сейчас здесь находиться?"
62070-202 = "Ты удивишься, как часто подобные памятники становятся символами раскола."
62070-203 = "У самого понятия символа есть свои ограничения. Люди склонны бунтовать, когда чувствуют, что им что-то навязывают."
62070-204 = "Да. Одни считали Врата мира фарсом."
62070-205 = "Но другие говорили, что неважно, принесли ли они мир на деле. Они символизировали веру в то, что когда-нибудь мир всё же наступит."
62070-206 = "В основе позиции одной стороны лежало убеждение, что любые переговоры с Тринити невозможны..."
62070-207 = "...а другой — что переговоры являются единственным путём вперёд."
62070-209 = "И началась гражданская война."
62070-210 = "Да. Гнев, прежде направленный наружу, обратился внутрь."
62070-211 = "Думаю, этого достаточно, чтобы понять главное."
62070-212 = "Это произошло слишком давно и в слишком жестокое время, чтобы у самого Ариуса сохранились надлежащие записи."
62070-213 = "Но посеянное тогда зерно гнева... передавалось из поколения в поколение."
62070-214 = "Кипящая ненависть к Тринити и ещё более сильная ненависть к самим себе."
62070-215 = "...Сегодня это просто история из наших учебников."
62070-216 = "...В конце концов, люди способны к сопереживанию..."
62070-217 = "По мере развития мы достигли точки, когда способны сопереживать другим."
62070-218 = "И ту же способность мы применяем, изучая историю."
62070-219 = "Мы всё ещё способны понять эмоции и взгляды людей, живших тогда."
62070-220 = "Да. Именно так гнев, разъедавший Ариус, и продолжал передаваться дальше."
62070-221 = "В долгой войне первой победила фракция, выступавшая против Porta Pacis как символа мира."
62070-222 = "Они решили создать огромный подземный архив, где должны были храниться сведения и устанавливаться принципы для Ариуса."
62070-223 = "Под Porta Pacis был архив?!"
62070-224 = "Да. И в этом архиве... записано всё, что когда-либо происходило в Ариусе."
62070-225 = "...Прямо как библиотека Тринити."
62070-226 = "Оставлять записи для тех, кто однажды придёт после нас... будто заложено в природе человечества... словно всеобщее стремление..."
62070-228 = "Да. Поэтому архив Porta Pacis служил Ариусу одновременно библиотекой и хранилищем записей."
62070-229 = "Однако, если мои сведения верны, партия, державшая власть в Ариусе около 150 лет назад..."
62070-230 = "...объявила Porta Pacis и её архив закрытой зоной."
62070-231 = "[s] «Почему?»"
62070-232 = "Никто не знает. У меня есть лишь собственные предположения."
62070-233 = "Возможно, они просто больше не могли это выносить."
62070-234 = "Все истории, которые продолжали накапливаться, и связанные с ними мрачные чувства."
62070-235 = "[s3] «...Понятно.»\n[s4] «Кажется, я немного это понимаю...»"
62070-238 = "...Значит, информационная блокада... В Тринити такое тоже случается."
62070-239 = "Серьёзно, эти власть имущие вечно..."
62070-240 = "С точки зрения управления разжигать в подданных некоторую степень гнева иногда бывает полезно, но избыток легко оборачивается против самой власти."
62070-241 = "...История снова и снова показывает одно и то же: кто-то мобилизует группу агитаторов, чтобы захватить власть, а получив желаемое — избавляется от них."
62070-243 = "Н-Неужели внешний мир правда так устроен...? Мне страшно, Хиёри... страшно..."
62070-244 = "М-Мне тоже... Сил жить всё меньше. Уааа..."
62070-245 = "Но Шимико обещала прислать нам копии журналов, так что я ещё немного попробую не терять надежду..."
62070-247 = "То есть... в Ариусе ведь произошло примерно то же самое..."
62070-248 = "Понятно. Значит, после этого историю Ариуса передавали устно."
62070-249 = "Да. Однако власть в Ариусе постоянно переходила из рук в руки, пока Мадам... пока Беатриса не взяла всё под контроль."
62070-250 = "Поэтому каждый новый правитель ограничивал доступ к Porta Pacis."
62070-251 = "...Ты наконец произнесла её имя."
62070-252 = "Да. Думаю, уже пора."
62070-253 = "Но у устной передачи истории определённо были побочные последствия."
62070-254 = "...Проще говоря, у всех истории немного различались."
62070-256 = "Без письменных источников обычно так и бывает."
62070-257 = "Что-то преувеличивается, что-то теряется, что-то искажают эмоции..."
62070-258 = "История Ариуса, которой учили нас, скорее всего, очень сильно искажена по сравнению с истиной."
62070-259 = "Да. И я не думаю, что публикация записей из Porta Pacis внезапно откроет какую-то невероятную сенсацию."
62070-260 = "Наоборот, изучение этих записей может стать первым шагом к возвращению Ариуса к нормальной жизни."
62070-261 = "Но тогда... что Субару хочет найти там?"
62070-262 = "Субару, вероятно, знала «что-то»."
62070-263 = "Я не могу точно сказать, как это произошло, но после исчезновения Беатрисы Ариус исказился и превратился... в место, где сами законы реальности будто перекрутились. Возможно стало всё что угодно."
62070-264 = "Э-Это... правда... Поэтому, пока Субару не навела порядок... это место было..."
62070-265 = "*всхлипывает*"
62070-266 = "Ну-ну. Не плачь. Прости. Сейчас я расскажу вам кое-что, известное только мне."
62070-267 = "Хотя, полагаю, теперь об этом, вероятно, знает и Субару."
62070-268 = ""
62070-271 = ""
62070-272 = "Что... именно?"
62070-273 = ""
62070-275 = ""
62070-276 = ""
62070-277 = "Тайна Ариуса, скрытая в Porta Pacis."
62070-281 = "Следующий Эпизод;Porta Pacis 2"
