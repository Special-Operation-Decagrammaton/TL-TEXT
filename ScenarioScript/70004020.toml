[translation]
70004020-1 = "Потерянный подарок 2"
70004020-2 = "...Следующим утром."
70004020-3 = ""
70004020-7 = ""
70004020-8 = "Д-Добро пожаловать в Ангел 24!"
70004020-9 = "Доброе утро."
70004020-10 = ""
70004020-12 = ""
70004020-13 = ""
70004020-15 = "(Этот студент — Сорасаки Хина, главный префект Геенна. Её репутация действительно идёт впереди неё...)"
70004020-16 = "(Главный префект Хина мало говорит, и выражение лица у неё почти не меняется, поэтому трудно представить, что она купила кому-то личный подарок...)"
70004020-17 = "(Но обязанности Префектурной команды часто сталкивают её с Сенсеем, так что подарок вполне мог быть от неё!)"
70004020-18 = ""
70004020-20 = ""
70004020-22 = "Эм... Вы главный префект Сорасаки Хина из академии Геенна, верно?"
70004020-23 = "Да. Что-то нужно...?"
70004020-24 = "Н-Нет! Мне ничего не интересно и меня вообще ничего конкретного не беспокоит!"
70004020-25 = "Ну... Эм... Т-Так..."
70004020-26 = "У-У вас есть планы на Рождество?"
70004020-27 = "На Рождество...?"
70004020-28 = "Да. Даже если обязанности главного префекта держат вас занятой, я подумала, вдруг у вас появится шанс... немного отдохнуть на Рождество..."
70004020-29 = "Например, сходить на особую вечеринку или подарить кому-то подарок..."
70004020-30 = "Не знаю..."
70004020-31 = "Почему тебя так интересуют мои планы?"
70004020-32 = "(О-О нет! Она начинает подозревать...!)"
70004020-33 = "Эм... Ну, понимаете..."
70004020-35 = "Вообще-то я студент средней школы! До старшей мне осталось всего несколько лет."
70004020-36 = "Я ещё решаю, к какой школе стремиться, и просто случайно подумала, что было бы интересно узнать, как студенты Геенна проводят праздники!"
70004020-37 = "Выбираешь школу? Но Геенна...?"
70004020-38 = "И-Именно! Э-Это странно...?"
70004020-39 = "Нет. Я бы не сказала «странно»..."
70004020-40 = "Просто студенты средней школы обычно не мечтают поступить в Геенна. Возможно, ты первая."
70004020-41 = "Ты кажешься мне достаточно прилежным студентом... Может, втайне мечтаешь о более свободной среде, чем здесь?"
70004020-42 = "А? Вы всё это время наблюдали за мной?"
70004020-43 = "Не специально. Просто так вышло, потому что я вижу тебя каждый раз, когда прихожу в Шале."
70004020-44 = "Ты добросовестно охраняешь магазин Шале и не жалуешься."
70004020-45 = "Студенту средней школы было бы легко находить оправдания и лениться в таком месте, но ты всегда старательно выполняешь обязанности. Когда ты работаешь, полки никогда не пустуют. Я это уважаю."
70004020-46 = "В списках Геенна полно студентов, которые делают что хотят и когда хотят. Поэтому ты совершенно не соответствуешь моему представлению о школе. Но, конечно, выбор за тобой."
70004020-47 = "Разумеется, как главному префекту мне будет только на пользу, если такой прилежный студент станет моей младшей."
70004020-48 = "С-Спасибо..."
70004020-49 = "Вернёмся к теме. Это Рождество я собираюсь провести в офисе Префектурной команды вместе с остальными."
70004020-50 = "Ако... то есть старший администратор Префектурной команды, хотела провести это Рождество вместе, поэтому что-то запланировала."
70004020-51 = "Я всё равно занята работой, так что изначально и не собиралась уходить из офиса."
70004020-52 = "Понятно... Тогда этот подарок принесла кто-то другой?"
70004020-53 = "Подарок...?"
70004020-54 = "Н-Неважно!"
70004020-55 = ""
70004020-57 = ""
70004020-58 = "Сора, я дам тебе свой номер. Если что-нибудь понадобится, можешь связаться со мной."
70004020-59 = "Если появятся вопросы о Геенна или какие-то проблемы... Я помогу."
70004020-60 = "Спасибо. Если на магазин когда-нибудь нападут, обязательно вам позвоню!"
70004020-61 = "...Надеюсь, до этого не дойдёт."
70004020-65 = ""
70004020-66 = "Д-Добро пожаловать в Ангел 24!"
70004020-67 = "Эм. У вас есть новая... булочка с мятным шоколадом...? Или как она там называется."
70004020-68 = "И если есть другие вкусы, я бы взяла по одной каждого."
70004020-69 = "Хорошо! Сейчас принесу!"
70004020-70 = ""
70004020-72 = ""
70004020-73 = ""
70004020-75 = "(Она из Общей школы Тринити...)"
70004020-76 = "(...Выглядит немного страшно, но очень часто покупает мягкие сладкие десерты.)"
70004020-77 = "(Даже в обычные дни она часто берёт десерты, которые дарят другим. Может, она купила сладкий подарок Сенсею?)"
70004020-78 = ""
70004020-80 = ""
70004020-82 = "Эм, мисс? Вы уже заказали рождественский торт на этот сезон?"
70004020-83 = "...А? Торт, так внезапно? Почему?"
70004020-84 = "А. Это реклама рождественских тортов Ангел 24?"
70004020-85 = "Н-Нет! Не от магазина... Это личный вопрос..."
70004020-86 = "Мне просто интересно, какие торты любят есть студенты Тринити на Рождество."
70004020-87 = "Что...?"
70004020-88 = "...?"
70004020-89 = "T-Тринити? Я говорила тебе, что я из Тринити?"
70004020-90 = "...? Н-Нет, не говорили..."
70004020-91 = "Н-Не говорила, да? Но ты сама просто решила, что я похожа на студента Тринити? Эхехехе..."
70004020-92 = "(П-Почему она так радуется...? На её куртке же видно символ Тринити...)"
70004020-93 = "Теперь насчёт Тринити и тортов... Наверное, в интернете ходят слухи, что студенты Тринити едят только суперроскошные десерты. Поэтому спрашиваешь?"
70004020-94 = "Ну, за всех студентов Тринити не скажу, но принадлежность к Тринити не означает, что можно ценить только дорогие вещи."
70004020-95 = "Вкусная еда — это вкусная еда, правда? Например, на это Рождество я заказала особый торт «рождественское полено» в любимом магазине в D.U...."
70004020-96 = "Хотя это лимитированный товар по предварительной записи, кто успел — тот и получил, так что пример, наверное, не лучший. Прости."
70004020-97 = "В-Всё нормально! Мне просто было интересно."
70004020-98 = "А с кем вы собираетесь разделить этот торт?"
70004020-100 = "С друзьями из того же клуба? С другой компанией? Или, может быть, с [USERNAME] Сенсеем...?"
70004020-101 = "Н-Ни за что!!"
70004020-102 = "П-Простите!"
70004020-103 = "...Ах."
70004020-104 = "Упс, опять сорвалась... *вздох*."
70004020-105 = "Прости. Я повышаю голос, когда удивляюсь."
70004020-106 = "Ты точно ни в чём не виновата. Это другие люди сделали меня такой. Надеюсь, ты понимаешь."
70004020-107 = "Н-Нет, всё нормально. Не переживайте."
70004020-108 = "...Спасибо. Ты взрослее, чем выглядишь."
70004020-109 = "Чтобы ответить на твой вопрос... Ну, не могу сказать... Я никогда не делила десерт с Сенсеем."
70004020-110 = "Но в это Рождество буду есть торт с членами своего клуба и помогать Сестринству."
70004020-111 = "После Рождества Сестринство будет раздавать домашний панеттоне. Говорят, в нём ничего особенного, но хорошая вещь остаётся хорошей."
70004020-112 = "П-Понятно... Тогда этот подарок подготовил другой студент."
70004020-113 = "...?"
70004020-114 = ""
70004020-116 = ""
70004020-117 = "Эй, Сора, кажется? А ты? Что делаешь на Рождество?"
70004020-118 = "У меня здесь смена, так что просто буду работать."
70004020-119 = "А? Работаешь на Рождество? Именно в этот день тебе бы отдохнуть, разве нет?"
70004020-120 = "Ха... хаха... Было бы неплохо, но я коплю на вещь, которую очень хочу купить."
70004020-121 = "Ага... Наверное, это держит тебя очень занятой."
70004020-122 = "...Вот, возьми."
70004020-123 = "Ч-Что это?!"
70004020-124 = "Лимитированные макаруны из Тринити. Я купила их, чтобы поделиться с друзьями, но всё равно взяла слишком много."
70004020-125 = "Иногда во время работы хочется сладкого, правда? Оставь на такой момент — сразу взбодришься."
70004020-126 = "С-Спасибо...!"
70004020-127 = "Да не парься. Считай это извинением за то, что я раньше крикнула."
70004020-128 = "Я пойду. Хорошего дня, Сора!"
70004020-129 = ""
70004020-131 = ""
70004020-132 = "Эй, в этом магазине есть портативные аккумуляторы для телефонов?"
70004020-133 = "Да. В правом углу стойки, нижний ряд."
70004020-134 = "Слава богу! Я жду срочного звонка и запаниковала, когда поняла, что заряд почти закончился."
70004020-135 = "По моим расчётам, его должно было хватить ровно до возвращения в школу... Где я ошиблась?"
70004020-136 = ""
70004020-138 = ""
70004020-139 = ""
70004020-141 = "(Кажется, это Юука, казначей школы Миллениум.)"
70004020-142 = "(Я видела её с Сенсеем лишь иногда — во время годовых расчётов и когда она разбирала отчёты о расходах Шале...)"
70004020-143 = "(Она постоянно ругает Сенсея и выглядит немного страшно, но, может, тайком купила ей подарок?)"
70004020-144 = ""
70004020-146 = ""
70004020-148 = "Эм, простите..."
70004020-149 = "Хм? Что такое? Я недоплатила?"
70004020-150 = "Нет, с оплатой всё нормально. У меня личный вопрос."
70004020-151 = "Личный вопрос? Учитывая, что мы раньше обменивались лишь формальностями, мне стало любопытно."
70004020-152 = "Спрашивай что угодно. Отвечу, если смогу."
70004020-154 = "Эм, вы знаете, какие у [USERNAME] Сенсея планы на Рождество в этом году?"
70004020-155 = "П-П-Почему ты спрашиваешь меня?!"
70004020-157 = "А-А...? П-Потому что вы знаете всё о сверхурочной работе Сенсея и её расходах..."
70004020-158 = "И-и кажется, вы знаете Сенсея дольше всех студентов, поэтому я подумала, что вы можете знать расписания друг друга."
70004020-159 = ""
70004020-161 = ""
70004020-162 = "П-Простите! Я сделала несколько предположений и всё неправильно поняла!"
70004020-163 = "...Кхм! Разумеется, я надлежащим образом консультирую Сенсея и слежу за ней, чтобы она не тратила средства на ненужные вещи."
70004020-164 = "Но мы всё ещё учитель и студент, поэтому я не связываюсь с ней по праздникам, если нет срочной проблемы."
70004020-165 = "К тому же Сенсей почти всегда занята работой даже по праздникам."
70004020-166 = "О-О, понятно. Значит, на это Рождество у вас нет планов с Сенсеем?"
70004020-167 = "Нет. Думаю, это Рождество я проведу с членами Семинар."
70004020-168 = "Похоже, моя проблемная младшая что-то задумала."
70004020-169 = "Так что надеюсь присмотреть за нашими членами в течение спокойных праздников."
70004020-170 = "...В любом случае, судя по твоим вопросам, кто-то другой всё же сумел договориться о планах с Сенсеем на это Рождество?"
70004020-171 = "Н-Нет! Я не это имела в виду!"
70004020-172 = "Хм... Ну, мне в любом случае всё равно."
70004020-173 = "Ладно, не переусердствуй, Сора. И не бойся спрашивать, если появятся вопросы."
70004020-174 = "О-Огромное спасибо...!"
70004020-175 = ""
70004020-177 = ""
70004020-178 = "...Ч-Чуть не поймала меня. Я была права. Спрашивать так прямо опасно."
70004020-179 = "В любом случае, похоже, я спросила большинство студентов, которые вчера приходили в Шале, но никто ничего не знает об этом подарке."
70004020-180 = "Может... он вообще был для кого-то другого?"
70004020-181 = "Нет, нельзя терять бдительность до самого конца. Я должна проверить каждого, кого только смогу!"
70004020-182 = ""
70004020-185 = ""
70004020-186 = "Д-Добро пожаловать в Ангел 24!"
70004020-188 = "Остаток дня Сора продолжала расспрашивать других студентов о подарке..."
70004020-189 = "...но так и не нашла никаких убедительных зацепок."
