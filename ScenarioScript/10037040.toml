[translation]
10037040-1 = "Эпизод 4;Обойти мир и взглянуть на реку"
10037040-3 = "Хм, понятно. Еда Променада Чёрной Черепахи известна и по всему Кивотосу."
10037040-4 = "...По крайней мере, именно это я хотела сказать."
10037040-5 = ""
10037040-7 = ""
10037040-9 = ""
10037040-10 = ""
10037040-11 = "Вот и ещё! Ещё порция каши с морским ушком! Она тщательно сварена с сушёным морским огурцом, морским ушком и рапаном!"
10037040-12 = ""
10037040-14 = ""
10037040-15 = ""
10037040-16 = "Разве это не слишком много?! Какой это уже по счёту курс?!"
10037040-17 = "[s1] «Если угадывать...»\n[s2] «Думаю, вы примерно на половине.»"
10037040-20 = "Что?! Но я столько не съем!"
10037040-21 = "То есть всё очень вкусно. Я бы съела, если бы могла, но...!"
10037040-22 = ""
10037040-25 = ""
10037040-26 = "Ну-ну. Великий Вождь Красной Зимы должна хорошо есть, чтобы подрасти ещё на несколько сантиметров!"
10037040-27 = "Я Акэширо Руми. Президент Променада Чёрной Черепахи, но прежде всего я повар."
10037040-28 = "П-Президент?! Вы здесь?"
10037040-29 = "Конечно! Всё-таки к нам прибыли важные гости издалека. Не могла же я просто сидеть на кухне."
10037040-30 = ""
10037040-32 = ""
10037040-33 = "Хм? Президент Шаньхайцзина... Разве это не госпожа Кисаки?"
10037040-34 = "О, ну технически речь о разных организациях."
10037040-35 = "Моя официальная должность — президент Торговой Гильдии, но все для краткости зовут меня Президентом."
10037040-36 = "Исполняющую обязанности президента студенческого совета Шаньхайцзина, то есть Генрюмона, Кисаки... то есть президента, всегда называют «госпожой», так что путаницы не возникает."
10037040-37 = "...По крайней мере внутри Шаньхайцзина."
10037040-39 = "Понятно. Но постойте...?"
10037040-40 = "(Мы ведь называем нашу Великим Вождём и Президентом, верно? Может быть...)"
10037040-41 = "(Может, всё потому, что Великий Вождь Черино одновременно президент студенческого совета, Главный инспектор по благоустройству, Главный секретарь, Начальник санитарной службы, Капитан спортивного клуба, Глава всех старост, Начальник санитарной службы, Знаток столового питания... и всё остальное?!)"
10037040-42 = "Следующим будет фирменное блюдо из утиных крылышек, но... вот тут я действительно задумалась."
10037040-43 = "Есть десятки способов приготовить утку, но если выбирать два лучших..."
10037040-44 = "Один — запечь до золотистой корочки, другой — приготовить на пару после хорошей натирки специями."
10037040-45 = "Я не могла решить, какой вариант лучше подойдёт нашим почётным гостям."
10037040-46 = ""
10037040-48 = ""
10037040-49 = "В итоге решила приготовить оба! Приятного аппетита!"
10037040-50 = "Хех! Нельзя назвать обслуживание настоящим, если приготовленная еда не набила гостям животы до отказа. В Шаньхайцзине иначе и быть не может!"
10037040-51 = "[s] «Я так и думал!»"
10037040-52 = "Ха-ха-ха! Вы тоже ешьте досыта, Сенсей. Если хоть один гость Променада Чёрной Черепахи уйдёт не с полным желудком, для нас это будет позором!"
10037040-53 = ""
10037040-55 = ""
10037040-56 = ""
10037040-58 = "Товарищ! Спаси меня!"
10037040-59 = "[s] «Черино.»"
10037040-60 = ""
10037040-62 = ""
10037040-63 = "Д-Да?"
10037040-64 = "[s] «Вот где ты должна стоять до конца, как Великий Вождь!»"
10037040-65 = "...!"
10037040-66 = "Понятно... Так вот как."
10037040-67 = ""
10037040-69 = ""
10037040-70 = "Хорошо. Я принимаю ваш вызов, Променад Чёрной Черепахи! Красная Зима не так легко согнётся перед вашей волей!"
10037040-71 = "Вы столь же смелы, как я и ожидала, Великий Вождь Красной Зимы!"
10037040-73 = "...Прошло совсем немного времени, прежде чем Черино отчаянно понадобился антацид, чтобы успокоить разбушевавшийся желудок..."
10037040-76 = ""
10037040-77 = ""
10037040-78 = ""
10037040-79 = ""
10037040-84 = ""
10037040-86 = "..."
10037040-87 = "Так это те самые студенты Красной Зимы, которые прибыли на встречу по обмену...?"
10037040-88 = "Похоже на то."
10037040-89 = "Хм..."
10037040-91 = "Добро пожаловать в Сад Сливового Цвета — Отдел дисциплинарной поддержки Шаньхайцзина, Великий Вождь Черино, Главный секретарь Томоэ, председатель Марина."
10037040-92 = "Сад Сливового Цвета — образовательное учреждение для обучения младших студентов Шаньхайцзина."
10037040-93 = "Студентов, которые хорошо проявляют себя в Академии Шаньхайцзин, выбирают инструкторами. А затем им поручают обучать маленьких студентов в Саду Сливового Цвета."
10037040-94 = "То есть пока они находятся в Шаньхайцзине, эти дети продолжают учиться от самого детства и до старшей школы?"
10037040-95 = "Да. Конечно, некоторые студенты переводятся к нам позже."
10037040-96 = ""
10037040-98 = ""
10037040-99 = "Понятно... Н-Но сначала! Перестаньте меня донимать, сорванцы!"
10037040-100 = ""
10037040-104 = "Вау! Посмотрите на эту бело-красную одежду! Круто!"
10037040-105 = "А это что? Усы? Хм... Они снимаются. Я тоже такие хочу!"
10037040-106 = ""
10037040-109 = ""
10037040-110 = "Н-Нет! Э-Эти усы... Томоэ!"
10037040-111 = "Ну-ну. Великий Вождь Черино, рекомендую воспользоваться запасными усами..."
10037040-112 = "Нет, подожди...! Нужно что-то надёжнее! Иначе дети и эти усы стащат, и я снова окажусь в той же ситуации."
10037040-113 = ""
10037040-116 = ""
10037040-117 = "Дети! Это почётные гости из далёких краёв! Ведите себя прилично!"
10037040-118 = "Бу-у, Кокона. Ты опять скучная..."
10037040-119 = ""
10037040-121 = ""
10037040-122 = "О! Кокона, отдай мне усы! Я тоже хочу примерить!"
10037040-123 = "Нельзя просто называть меня Кокона. Я Инструктор Кокона!"
10037040-124 = ""
10037040-126 = ""
10037040-127 = ""
10037040-128 = "Все?"
10037040-129 = ""
10037040-131 = ""
10037040-132 = "Достаточно."
10037040-133 = ""
10037040-136 = "Х-Хиии! П-Простите, Инструктор Шун!"
10037040-137 = "Простите... Мы будем хорошо себя вести..."
10037040-138 = "С детьми иногда бывает непросто... Вот, Великий Вождь Черино."
10037040-139 = "Хм... Меня всегда впечатляло, как Инструктор Шун умеет управляться со студентами здесь."
10037040-140 = ""
10037040-144 = "К-Кхм. Вы Инструктор Кокона, верно?"
10037040-145 = "Да! Спасибо, что обратились ко мне по правильному титулу!"
10037040-146 = "То есть в Саду Сливового Цвета... один ребёнок командует другими детьми...?"
10037040-147 = ""
10037040-149 = ""
10037040-150 = "Я-Я не ребёнок! Я инструктор Сада Сливового Цвета, младшая сестра Шун, и я...!"
10037040-152 = "Хи-хи! Как ты верно заметила, Кокона вообще-то должна была бы учиться в начальной школе вместе с детьми своего возраста..."
10037040-153 = "Но её способности позволили ей поступить в старшую ступень и занять должность инструктора. Я очень горжусь своей младшей сестрой."
10037040-155 = "С-Шун...? Ты меня смущаешь. Перестань..."
10037040-156 = "[s] «Она права! Очаровательная Инструктор Кокона — гордость Сада Сливового Цвета!»"
10037040-157 = "Только не вы тоже, Сенсей! Зачем вы добавили «очаровательная»?!"
10037040-163 = ""
10037040-164 = "Что...? Студенты Красной Зимы уже ушли из Сада Сливового Цвета."
10037040-165 = "Правда? Но Сад Сливового Цвета — одно из важнейших мест Шаньхайцзина..."
10037040-166 = "Знаю. Даже Генрюмон не может вмешиваться в то, что происходит в Саду Сливового Цвета."
10037040-167 = "О чём думает президент...?"
10037040-170 = "О, так это здесь ставили Пекинскую оперу!"
10037040-171 = "Парк Белого Тигра — один из самых известных парков Шаньхайцзина..."
10037040-172 = "Большинство крупных мероприятий и представлений проходят именно здесь. Хех."
10037040-174 = "Он и правда очень большой..."
10037040-175 = ""
10037040-177 = ""
10037040-178 = ""
10037040-179 = "Но мне кажется, Площадь Революции Красных Усов в Красной Зиме ещё больше!"
10037040-180 = "...Простите?"
10037040-181 = "Вы принижаете культурную святыню, которой является Парк Белого Тигра, сводя всё к его размеру?!"
10037040-182 = "Нет, вовсе нет! Благодаря этой встрече по обмену мы прекрасно поняли, насколько Шаньхайцзин гордится своими древними традициями."
10037040-183 = "Однако! Мы не меньше гордимся боевым духом и силой воли Красной Зимы, ведь нам приходится выдерживать морозы ниже нуля и бескрайние снежные поля!"
10037040-184 = "...Федеральная Академия Красной Зимы и правда настолько холодная и огромная?"
10037040-185 = "Да... Там легко заблудиться, если свернуть не туда, а некоторые по дороге даже встречают медведей..."
10037040-186 = "Медведей? У нас вот есть свои панды..."
10037040-187 = "Панды милые!"
10037040-188 = "Нет, постой. Если подумать, медведи тоже могут быть милыми... Например, Медвези... Хотя панды ведь тоже относятся к медведям, да?"
10037040-189 = "Угх! Ваш план состоял в том, чтобы меня запутать, Исполнительный Офицер Мина!"
10037040-190 = "Но я не сказала ничего необычного..."
10037040-191 = "[s3] «Если можно вставить свои пять копеек...»\n[s4] «Марина просто по-своему восхищается Шаньхайцзином.»"
10037040-194 = "С-Сенсей?!"
10037040-195 = "Понятно... Тогда я должна вас поблагодарить, председатель Марина."
10037040-196 = "Н-Ну...! Главное, что вы поняли. Шаньхайцзин тоже довольно впечатляющий! Ха-ха-ха!"
10037040-197 = "Хех. Вижу, у вас хороший вкус..."
10037040-198 = ""
10037040-200 = ""
10037040-202 = ""
10037040-203 = "...Мне кажется или эти двое на удивление хорошо ладят?"
10037040-204 = "Согласна, Черино — то есть, Великий Вождь Черино. Интересно почему?"
10037040-205 = "[s] «Я бы не сказал, что они прямо-таки ладят.»"
10037040-206 = "Тогда зачем?"
10037040-207 = "[s] «Скорее... два сапога пара...»"
10037040-208 = "Будто они на одной волне, да? Это ведь хорошо, правда?"
10037040-209 = "Если так, почему у тебя такое озадаченное выражение лица, товарищ?"
10037040-211 = "Кажется, я начинаю понимать... Правда, Сенсей?"
10037040-212 = "Всё хорошо, что хорошо кончается. В этом и есть цель встречи по обмену, разве нет? Хи-хи-хи!"
10037040-213 = ""
10037040-215 = ""
10037040-217 = ""
10037040-218 = "Посмотрите туда! Снова гости из Красной Зимы."
10037040-219 = "Исполнительный Офицер Мина вовсю работает... Постойте — а кто охраняет президента?"
10037040-220 = "Раз президент остаётся в Генрюмоне, дополнительная охрана ей ведь не нужна, да?"
10037040-221 = "Я не это имею в виду. Уже сам факт, что президент выделила Исполнительного Офицера Мину, показывает, насколько она уважает гостей."
10037040-222 = "Логично, ведь именно Шаньхайцзин их пригласил, да...?"
10037040-223 = "...Она даже устроила для них большое представление под открытым небом в Парке Белого Тигра..."
10037040-224 = ""
10037040-226 = ""
10037040-227 = "Думаете, это правильно...?"
10037040-228 = "Гости из Красной Зимы вообще понимают, насколько большое уважение им оказывают...?"
10037040-229 = "...Сначала Сенсей из Шале. Теперь ещё и внешняя академия..."
10037040-230 = "Мы точно идём по правильному пути?"
10037040-231 = "Решение примет президент..."
10037040-232 = "Ты говоришь не слишком уверенно."
10037040-234 = "...Мы все так или иначе тревожимся."
10037040-235 = ""
10037040-238 = "Ага..."
