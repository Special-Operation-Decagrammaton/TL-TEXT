[translation]
10031020-1 = "Эпизод 2;Первые шаги"
10031020-2 = "После того как я согласился помочь, в первый день подготовки Особой вечеринки Геенны мне позвонила Макото."
10031020-6 = ""
10031020-7 = "Кихехе. Как я уже говорила, Общество Пандемониума строит новый зал собраний специально для нашей Особой вечеринки Геенны."
10031020-8 = "Поэтому я хочу пригласить тебя на церемонию перерезания ленты у нового зала. Окажешь нам честь своим присутствием?"
10031020-9 = "[s] «Конечно. Я буду.»"
10031020-10 = "Кихехе. Буду ждать."
10031020-11 = ""
10031020-13 = ""
10031020-16 = ""
10031020-17 = "Кихехе..."
10031020-18 = "Кекекекекекекекеке!!!"
10031020-19 = "Итак, теперь у меня есть сотрудничество [USERNAME] Сенсея."
10031020-20 = "И не только помощь с подготовкой вечеринки... Я попрошу Чиаки записать, как Сенсей помогает нам на месте. Потом мы используем эти кадры для пропагандистского документального фильма Общества Пандемониума."
10031020-21 = "Кихехе. Если транслировать наше видео по всему Кивотосу, Общество Пандемониума заставит весь мир поверить, что мы в союзе со Шале!"
10031020-22 = "Если это получится, мы сможем бесконечно расширять влияние Общества Пандемониума!"
10031020-23 = ""
10031020-25 = ""
10031020-27 = "[ns] «Эм, Макото. Мы всё ещё на звонке.»"
10031020-28 = "А..."
10031020-29 = "Э-Это... Нет. Сенсей, это было просто—"
10031020-30 = "[s] «Я вежливо откажусь от съёмки.»"
10031020-31 = "М-Мои планы!"
10031020-32 = "Уф! Я-я-я, похоже, ничего не поделаешь."
10031020-33 = "Я-я буду ждать тебя на стройплощадке!"
10031020-34 = ""
10031020-36 = ""
10031020-37 = ""
10031020-43 = ""
10031020-44 = ""
10031020-46 = ""
10031020-47 = ""
10031020-48 = ""
10031020-50 = ""
10031020-51 = ""
10031020-52 = ""
10031020-53 = ""
10031020-54 = "[ns] «Похоже, все очень заняты.»"
10031020-56 = ""
10031020-57 = "Кихехе. Потому что эта вечеринка имеет важное значение."
10031020-58 = "[s] «О, Макото.»"
10031020-59 = "Добро пожаловать в Общество Пандемониума, Сенсей."
10031020-60 = "Хотя ты и обещал прийти, я всё равно удивлена, что ты действительно явился. Поэтому хочу ещё раз поблагодарить. Кихи."
10031020-61 = "[s1] «Да, я обещал.»\n[s2] «Но я всё равно не дам тебе меня снимать.»"
10031020-64 = "Уф! Э-Это—"
10031020-65 = "В-В любом случае, важно будущее, а не прошлое!"
10031020-66 = "Разве не лучше говорить о светлом и широком будущем впереди, вместо того чтобы цепляться за прошлое? Я не права, Сенсей?!"
10031020-67 = "[s] «(Она опять меняет тему.)»"
10031020-68 = ""
10031020-71 = "[ns] «Ладно, церемония перерезания ленты означает, что зал собраний уже закончен, верно?»"
10031020-72 = "Да. По мере завершения подготовки к Особой вечеринке Геенны..."
10031020-73 = "Мы решили заодно расширить необходимые помещения."
10031020-74 = "В конце концов, именно здесь будет проходить вечеринка. Кихехе..."
10031020-75 = "[s] «Понятно. Теперь ясно, почему церемонию проводят именно сейчас...»"
10031020-76 = "Конечно, здание будет использоваться не только для этого!"
10031020-77 = "Там ещё будут интернет-кафе, прачечная самообслуживания, библиотека, магазин и аркадный зал...! Столько всего, что Дисциплинарная комиссия позеленеет от зависти!"
10031020-78 = "Новый зал собраний Общества Пандемониума станет главной жемчужиной культурного пространства Геенны — сейчас и навсегда!"
10031020-79 = "[s] «Разве это уже не торговый центр, а не зал собраний?»"
10031020-80 = "Кекеке! Лично я больше всего рекомендую объект, который обошёлся нам дороже всех остальных..."
10031020-81 = "...новый горячий источник! Я заказала его строительство за залом собраний, чтобы все ученики Геенны могли наслаждаться им и воспевать Общество Пандемониума!"
10031020-82 = "[s] «Одним словом „масштабно“ это уже не описать.»"
10031020-83 = "Кихехехе! Именно! Я, Великая Макото, вместе со всем Обществом Пандемониума поставила всё на кон ради завершения нашего нового зала собраний!"
10031020-84 = "Я уже представляю, как у Дисциплинарной комиссии челюсти отвиснут, когда они увидят, что мы создали! Кихехехе!!!"
10031020-85 = "[s] «Эм, маленький вопрос. Кому ты поручила строить горячий источник?»"
10031020-86 = "А? Очевидно же..."
10031020-87 = "Отделу горячих источников Геенны. Очевидно."
10031020-88 = ""
10031020-91 = "[ns] «...О.»"
10031020-92 = ""
10031020-93 = ""
10031020-94 = "Ч-что происходит?!"
10031020-95 = ""
10031020-97 = ""
10031020-98 = "П-Председатель! Чрезвычайная ситуация! Это..."
10031020-99 = "Из-за того горячего источника они—!"
10031020-100 = "Они что?"
10031020-101 = ""
10031020-104 = ""
10031020-105 = ""
10031020-106 = ""
10031020-107 = "А?!"
10031020-109 = ""
10031020-110 = ""
10031020-111 = ""
10031020-116 = ""
10031020-118 = ""
10031020-119 = "Т-Ты...!"
10031020-120 = ""
10031020-121 = "Всем привет-привет! Отдел горячих источников прибыл!"
10031020-122 = "О? Я думала, вижу знакомое лицо. Даже Сенсей здесь."
10031020-123 = "Сенсей и председатель Общества Пандемониума вместе? Ох, горячее сочетание."
10031020-124 = "[s] «Эм... Привет, Мэгу и Касуми.»"
10031020-125 = "Ага-ага! Привет! Сенсей!"
10031020-126 = "Нет ничего лучше дружеского приветствия после неожиданной встречи."
10031020-127 = "Кстати, клиент, который заказал нам разработку горячего источника... Это была ты, верно, Макото?"
10031020-129 = "Верно... И почему вы устраиваете переполох перед залом собраний?! Здесь должна проходить церемония перерезания ленты! Разве вы не должны копать горячий источник?"
10031020-130 = "Это вообще не то место, где вы должны копать! Объяснитесь, Отдел горячих источников!"
10031020-131 = "А, насчёт этого."
10031020-132 = "Изначальный заказ был построить комплекс горячих источников за новым залом собраний..."
10031020-133 = "Но... я обнаружила гора-а-а-здо более мощную жилу горячего источника!"
10031020-134 = "Не за залом, а прямо перед ним! На парковке Общества Пандемониума!"
10031020-135 = "[s] «Эм... И на чём основан этот вывод?»"
10031020-136 = "Зачем ты спрашиваешь такое, Сенсей?"
10031020-137 = "На моей интуиции!"
10031020-138 = ""
10031020-139 = "Я ещё и провела длинное, содержательное обсуждение этой идеи с президентом и остальными членами клуба. А ВОТ И НЕТ!"
10031020-140 = "Вместо того чтобы следовать заказанному плану, нужно разрабатывать именно это место!"
10031020-141 = "Стойте! Мы сейчас должны проводить церемонию перерезания ленты!"
10031020-142 = "О. Правда?"
10031020-143 = "А нам какое дело? Вы заплатили нам за разработку потрясающего горячего источника."
10031020-144 = "Разве не естественно превзойти ожидания и сделать лучший горячий источник?"
10031020-145 = "Ну да, ОФИЦИАЛЬНО вы не просили нас перекапывать парковку. Ха-ха, не переживайте!"
10031020-146 = "Вахахаха! Когда всё будет готово, председатель Макото наверняка полюбит его. Поверь мне! Я эксперт по горячим источникам!"
10031020-147 = "[s] «...Я знал, что что-нибудь такое случится.»"
10031020-148 = "Так, все! В атаку! Ломать, копать и снова копать! Пора строить горячий источник!"
10031020-150 = ""
10031020-153 = ""
10031020-154 = "За президентом Касуми! Вперёд!"
10031020-155 = ""
10031020-157 = ""
10031020-159 = ""
10031020-160 = "Уф! Д-Даже не думайте, что я позволю вам испортить мою церемонию перерезания ленты! Не позволю!"
10031020-161 = "Все! Остановите их!"
10031020-162 = ""
10031020-164 = ""
10031020-165 = ""
10031020-166 = ""
10031020-169 = ""
10031020-179 = "[ns] «П-Погодите! Все, давайте успокоимся и—»"
10031020-184 = ""
10031020-185 = "Все будут спокойными и расслабленными после того, как мы выкопаем горячий источник!"
10031020-186 = "Именно! Горячие источники такие мирные и расслабляющие! Отличное место, чтобы, эм... упокоиться с миром!"
10031020-187 = ""
10031020-191 = "У-Ургх!! Как такое могло случиться?! Где я ошиблась?!"
10031020-192 = "[s] «...Наверное, когда отправила заказ Отделу горячих источников?»"
10031020-193 = ""
10031020-197 = ""
10031020-198 = "Вахахахахаха!!! Разрабатывать! Взрывать! Смести всё, чтобы в Геенне был горячий источник для каждого ученика!"
10031020-199 = ""
10031020-202 = ""
10031020-203 = "..."
10031020-204 = ""
10031020-207 = ""
10031020-208 = ""
10031020-211 = "[ns] «Ч-Что это сейчас было?!»"
10031020-212 = ""
10031020-215 = ""
10031020-217 = "Мы прибыли после сообщения о беспорядках у Общества Пандемониума."
10031020-218 = "Что здесь вообще происходит?"
10031020-219 = "[s] «Хина?! Ако?!»"
10031020-220 = "Сенсей?"
10031020-221 = "А?! Что Сенсей здесь делает?"
10031020-222 = ""
10031020-223 = "Уф! Хина, сегодня церемония перерезания ленты в зале собраний Общества Пандемониума!"
10031020-224 = "И ты разыскиваешь меня именно в такой день... Ты тоже пришла мне мешать?"
10031020-225 = "[s] «Нет! Разве не очевидно? Она пришла помочь...?»"
10031020-226 = "Уф! Мне не нужна помощь главы Дисциплинарной комиссии!"
10031020-227 = "Я лучше соглашусь на горячий источник на своей парковке, чем буду зависеть от неё!"
10031020-228 = "Г-Горячий и-источник..."
10031020-229 = "Нет... Этого я тоже не могу допустить, но...!"
10031020-230 = "[s] «Так даже у тебя есть границы, которые ты не переступишь...»"
10031020-231 = ""
10031020-233 = ""
10031020-234 = ""
10031020-235 = "Мы здесь не потому, что ХОТИМ помогать Обществу Пандемониума!"
10031020-236 = "Наш долг — разобраться с сообщением о том, что Отдел горячих источников устроил очередной погром."
10031020-237 = ""
10031020-239 = ""
10031020-240 = ""
10031020-241 = ""
10031020-242 = "Это часть наших повседневных проблем... Мне неприятно помогать Обществу Пандемониума, однако..."
10031020-243 = "Мы разберёмся с ситуацией. Возражения есть, Сенсей?"
10031020-244 = "[s] «Никаких, глава Дисциплинарной комиссии.»"
10031020-245 = "Хорошо."
10031020-246 = ""
10031020-248 = ""
10031020-249 = "Дисциплинарная комиссия! Приготовиться!"
10031020-251 = ""
10031020-252 = "Есть, госпожа!"
10031020-253 = ""
10031020-256 = ""
10031020-257 = "Дисциплинарная комиссия заняла боевые позиции! И глава тоже!"
10031020-259 = "Ого! Всё очень плохо!"
10031020-260 = ""
10031020-262 = ""
10031020-263 = "Э-Э-Эээээй!!!"
10031020-264 = ""
10031020-266 = ""
10031020-267 = ""
10031020-268 = "А! Президент Касуми запаниковала!"
10031020-269 = "Потому что она до смерти боится главы Дисциплинарной комиссии!"
10031020-270 = "Тревога! Тревога! Всем силам дать отпор!"
