[translation]
10053060-1 = "Эпизод 6;Телефонная будка из ада"
10053060-2 = "На следующий день..."
10053060-3 = ""
10053060-5 = ""
10053060-6 = ""
10053060-7 = "Так не пойдёт! Этот метод дурацкий!"
10053060-8 = ""
10053060-10 = ""
10053060-11 = ""
10053060-12 = "А? Ты только сейчас это поняла?"
10053060-13 = ""
10053060-15 = ""
10053060-16 = ""
10053060-17 = "С меня ХВАТИТ! Мы уже два часа переворачиваем камни!"
10053060-18 = "Но, Рэна... Змеи любят тенистые и влажные места..."
10053060-19 = "А что вообще такое Цучиноко? Ты уверена, что это вообще змея? У него есть хоть какие-нибудь особенности, кроме того, что оно толстое?"
10053060-20 = "О... Это острый вопрос. Во-первых, это не просто «толстая змея». Так говорить довольно грубо, да ещё и невежливо."
10053060-21 = "В народе его так называют, потому что эту форму легко представить. Я бы сказала, Цучиноко скорее... ромбовидный."
10053060-22 = "О, вот как? А что ещё ты знаешь?"
10053060-23 = "Хотя показания свидетелей различаются, большинство сходятся в том, что, почувствовав угрозу, Цучиноко издаёт звук «шьяаах!»."
10053060-24 = "То есть... как кошка?"
10053060-25 = "Ещё удивительнее то, что они умеют резко подпрыгивать! Примерно на целый метр — прямо на тебя!"
10053060-26 = "ЭТО КОШКА."
10053060-27 = "Хм, интересная теория... Неужели Цучиноко на самом деле кошка?!"
10053060-28 = "Почему ты сама себя убеждаешь?!"
10053060-29 = "У тебя нет какой-нибудь более полезной информации?"
10053060-30 = "Хм... Не могу сказать, что есть. Но у меня есть один инструмент, который может пригодиться."
10053060-31 = "Нам нужно придумать название команды."
10053060-32 = "...?"
10053060-33 = "Объясни. КАК это поможет?"
10053060-34 = ""
10053060-36 = ""
10053060-37 = ""
10053060-38 = "Название задаёт намерение. Если назовём себя исследовательской группой, с этого момента нашей целью станет исследование. Это бессознательно поможет сосредоточиться на цели и укрепит командный дух."
10053060-39 = "А ещё некоторые исследователи верят в «закон притяжения». Говорят, поток Вселенной перестраивается в соответствии с мыслями и желаниями человека."
10053060-40 = "Не начинай с правдоподобной теории о рабочем настрое, чтобы потом резко свернуть в псевдонаучный бред!"
10053060-41 = ""
10053060-43 = ""
10053060-44 = ""
10053060-45 = "Я с ней согласна. Нам не помешало бы название покруче. Или ВООБЩЕ хоть какое-нибудь."
10053060-46 = "Что думаете, Сенсей?"
10053060-47 = "[s1] «Я согласен.»\n[s2] «Да, например...»"
10053060-48 = ""
10053060-50 = ""
10053060-53 = "[ns] «Раз мы „исследуем“ „оккультное“, можно назвать нас Оккуль─!»"
10053060-55 = "Только попробуй! Я ТЕБЯ УБЬЮ!!"
10053060-56 = ""
10053060-58 = ""
10053060-59 = ""
10053060-60 = "...? А мне казалось, неплохо звучит."
10053060-61 = "Тогда, может, просто придерживаться изначальной цели и назваться «Группой исследования Цучиноко»?"
10053060-62 = "...Не особо бодрит, знаешь ли. Нельзя добавить немного огонька?"
10053060-63 = ""
10053060-65 = ""
10053060-66 = ""
10053060-67 = "Ч-Что? Чего вы на меня смотрите?!"
10053060-68 = "Эй, это ты зарубила название с «оккультизмом». Если уж так критикуешь, придумай что-нибудь сама."
10053060-69 = "...Эм, «Группа исследования Цучиноко» — это... нормально..."
10053060-70 = "[s3] «Для великого дизайнера одежды ты как-то скучновата...»\n[s4] «Покажи нам свою креативность, Рэна!»"
10053060-73 = "Подождите, это вообще не имеет отношения к дизайну одежды...!"
10053060-74 = "Ух...!"
10053060-75 = "Так ты всё-таки считаешь, что творческий подход тут пересекается?"
10053060-76 = "Ага! Соберись, Вайлдхант! Покажи, на что способна!"
10053060-77 = "...X."
10053060-78 = "Хм?"
10053060-79 = "Как насчёт «Экспедиционной группы X»?"
10053060-80 = "..."
10053060-81 = "..."
10053060-82 = "Н-Нет! Забудьте! Лучше—"
10053060-83 = "А мне нравится! Экспедиционная группа X!!"
10053060-84 = "Звучит так, будто мы тайные агенты..."
10053060-85 = "Я занимаюсь работой с молодёжью, и мелкие всегда выбирают для команд хилые названия вроде «Надежда» или «Счастье». Радует, что у Вайлдханта есть зубы!"
10053060-86 = "П-Правда? Это нормально...?"
10053060-87 = "Х-Хмпф. Конечно нормально. Поэтому я и предложила."
10053060-88 = "Теперь, когда у нас есть название, поиски наверняка станут результативнее."
10053060-90 = "Ладно, Экспедиционная группа X! Давайте соберёмся и найдём этого Цучиноко!"
10053060-95 = ""
10053060-96 = ""
10053060-97 = "Так не работает! Это каким-то образом стало ЕЩЁ ТУПЕЕ!"
10053060-98 = ""
10053060-100 = ""
10053060-101 = ""
10053060-102 = "Хм? Что-то случилось?"
10053060-103 = "Ну, мы просто пропустили главное: стратегию-то мы вообще не поменяли!"
10053060-104 = "Мы перевернули столько камней, что я уже начинаю узнавать некоторых жуков!"
10053060-105 = "А-а, понятно. Не волнуйся. Закон притяжения уже приближает нас к Цучиноко."
10053060-106 = "Но будь осторожна. Избегай негативных формулировок и по возможности используй прошедшее время. Например, говори «Я НАШЛА Цучиноко» вместо «Я ХОЧУ найти Цучиноко». Понятно?"
10053060-108 = "Какая чушь! Сплошная псевдонаука!!"
10053060-110 = "Хм? Подождите, который час?"
10053060-111 = ""
10053060-113 = ""
10053060-114 = "...А."
10053060-115 = "В смысле? Нам пора идти на автобусную остановку?"
10053060-116 = "Эм, нет... Просто, понимаете..."
10053060-118 = "...автобус уже уехал."
10053060-119 = ""
10053060-121 = ""
10053060-122 = ""
10053060-123 = ""
10053060-124 = "Ой, ничего страшного. Знаете что? Вызовем такси. Без проблем."
10053060-125 = ""
10053060-127 = ""
10053060-128 = ""
10053060-129 = ""
10053060-130 = ""
10053060-131 = ""
10053060-132 = ""
10053060-133 = "Ого, серьёзно? Линия, эм... не работает."
10053060-134 = "В Кивотосе до сих пор есть мёртвые зоны связи?"
10053060-135 = "У меня тоже ни одной палки. Здесь вообще нет сигнала..."
10053060-136 = "Может, просто пойдём пешком?"
10053060-137 = "...А. Подождите."
10053060-138 = "Кажется, я видела неподалёку телефонную будку."
10053060-139 = "Да. Я тоже это видела."
10053060-140 = "Отлично! Тогда я вызову нам такси. Мигом вернусь!"
10053060-141 = ""
10053060-143 = ""
10053060-144 = "Подожди! Уже темнеет. Опасно—"
10053060-145 = "И её уже нет..."
10053060-146 = ""
10053060-147 = "[ns5] «Я пойду с ней.»\n[ns6] «Вы двое ждите здесь.»"
10053060-153 = ""
10053060-154 = "Твой ход, урод."
10053060-155 = "...А? Сенсей?"
10053060-156 = "Простите. Я знала, что за мной следят. Подумала, вы можете быть моей «заключённой,» ха."
10053060-157 = "Так что случилось? Вы что-то забыли?"
10053060-158 = "...А? Вы пошли за мной, потому что «волновались»? Обо мне?"
10053060-159 = ""
10053060-161 = ""
10053060-162 = ""
10053060-163 = ""
10053060-164 = "Ого, прямо королевское обращение. В Бюро меня ТАК не балуют."
10053060-165 = "Наоборот, именно меня тащат в поле каждый раз, когда что-то случается, ха-ха-ха!"
10053060-166 = "Так что я очень ценю вашу заботу, но со мной всё в порядке. Как видите, я даже сама нашла телефон!"
10053060-167 = "А теперь минутку. Мне нужно сделать всего один быыыстрый звонок."
10053060-168 = ""
10053060-170 = ""
10053060-172 = "...Ах."
10053060-173 = "Сенсей, простите, но у вас есть... мелочь?"
10053060-174 = "[s7] «Я так и думал, что это случится...»\n[s8] «Хорошо, что я пошёл с тобой...»"
10053060-179 = "О, вы тоже хотите зайти в будку?"
10053060-181 = ""
10053060-182 = "Тут не тесновато? Может, мне выйти? ...Ладно, как скажете."
10053060-183 = "Давайте покончим с этим."
10053060-184 = ""
10053060-186 = ""
10053060-187 = ""
10053060-188 = "...А, алло? Это «Киво-Такси»?"
10053060-189 = "Отлично. Нам нужна машина. Мы находимся—"
10053060-190 = "Эм... Да, насчёт этого."
10053060-191 = "...Точно не знаю, но где-то на горе Ширакава..."
10053060-192 = "А! Сенсей! Нужно бросить ещё одну монету! Быстро!"
10053060-193 = ""
10053060-195 = ""
10053060-196 = "...Итак, на чём я остановилась?"
10053060-197 = "А, точно-точно. Мы возле автобусной остановки у горы Ширакава. Да, можем встретиться там."
10053060-198 = "Нас четверо. Может, в компактной машине Сенсею будет тесновато?"
10053060-199 = "Нет, забудьте. Если дадим Сенсею дробовик, а мы трое сядем сзади... а тощая девочка посередине..."
10053060-200 = "Опять отключается! Что это за телефон-автомат такой?!"
10053060-201 = ""
10053060-203 = ""
10053060-204 = "Эм, да. Компактная подойдёт, если она ближе всего."
10053060-205 = "Мы будем ждать, так что приезжайте прямо туда."
10053060-206 = "Да, большое спасибо. Хорошего вечера."
10053060-207 = ""
10053060-209 = ""
10053060-210 = "Ещё одна проблема решена, Сенсей! А теперь заберём девочек и пойдём к остановке."
10053060-211 = ""
10053060-213 = ""
10053060-214 = ""
10053060-215 = "Эй! Что такое, заклинило? Ржавая рухлядь—"
10053060-216 = ""
10053060-218 = ""
10053060-219 = ""
10053060-220 = "А? Ах ты наглая мелкая зараза. Сенсей, отойдите на минутку. Сейчас я с ней аккуратно разберусь..."
10053060-221 = ""
10053060-223 = ""
10053060-224 = ""
10053060-225 = ""
10053060-226 = ""
10053060-227 = ""
10053060-228 = "Сенсей...? Эм..."
10053060-229 = "У вас ещё монеты остались? Кажется, придётся звать на помощь."
10053060-230 = "[ns9] «Больше нет...»\n[ns10] «Мы потратили всё.»"
10053060-233 = ""
10053060-234 = "Беда не приходит одна, да...?"
10053060-235 = "*вздох* Простите. Это моя вина."
10053060-236 = "[s11] «Ты тут ни при чём.»\n[s12] «Дверь старая. Она просто сломалась.»"
10053060-239 = "Нет, это потому, что я проклята. Моё невезение заражает всех вокруг."
10053060-240 = "Вот почему я прячусь, когда чувствую, что всё идёт наперекосяк. Лучше переждать это в одиночку."
10053060-241 = "[s13] «Ты и правда веришь во всё это.»\n[s14] «В удачу и суеверия.»"
10053060-244 = "Это не «вера». Это реальность, разве нет?"
10053060-245 = "Подумайте сами. Застрять в телефонной будке? Такое почти не случается. Раз в жизни, если вообще случается."
10053060-246 = "А чтобы это произошло сейчас, после ВСЕГО остального... Просто у меня началась полоса невезения."
10053060-247 = "Ну... Если станет слишком поздно, уверена, те двое заметят и вызовут помощь. И хотя бы служба такси уже знает о нас."
10053060-248 = ""
10053060-250 = ""
10053060-251 = "...Но здесь реально тесно."
10053060-252 = "[s15] «И не говори...»\n[s16] «И становится жарко...»"
10053060-255 = "Это точно."
10053060-256 = "Наверное, поэтому в будке и должен находиться только один человек, да?"
10053060-257 = ""
10053060-259 = ""
10053060-260 = "А, простите. Я не хотела вас задеть, просто—"
10053060-261 = "Ах... Что я вообще делаю?"
10053060-262 = ""
10053060-264 = ""
10053060-265 = ""
10053060-266 = "Он... звонит?"
10053060-267 = "Не-не-не-не. Разве вообще можно ПОЗВОНИТЬ в телефонную будку?"
10053060-268 = "[s17] «Технически да...»\n[s18] «Но это ведь не особо распространено...?»"
10053060-271 = "Что делать? Мне снять трубку?"
10053060-272 = ""
10053060-274 = ""
10053060-275 = "...Наверное, стоит. В смысле... как я могу не ответить?"
10053060-276 = ""
10053060-278 = ""
10053060-279 = ""
10053060-280 = ""
10053060-281 = "Алло?"
10053060-282 = ""
10053060-284 = ""
10053060-285 = ""
10053060-286 = "Из трубки донеслись ревущее пламя и адские крики."
10053060-287 = "Ты тоже будешь гореть здесь. Гореть, пока не умрёшь."
10053060-288 = ""
10053060-290 = ""
10053060-291 = "С-С-Сенсей?!"
10053060-292 = "В-Вы тоже это слышали? Это было по-настоящему?"
10053060-293 = "[s19] «У-Успокойся, Коноха!»\n[s20] «Наверное, это... сбой! Или розыгрыш!»"
10053060-296 = "Невозможно!"
10053060-297 = "Кто вообще стал бы звонить ИМЕННО на ЭТОТ телефон-автомат, ИМЕННО сейчас, пока МЫ здесь заперты?"
10053060-298 = "Они сказали, что мы сгорим заживо! И вы же видите, здесь становится жарче!"
10053060-299 = "Нет, нет, мне не кажется! Пол и правда горячий!! Обжигает!"
10053060-300 = "[s21] «И правда...!»\n[s22] «Но... давай спокойно подышим и дождёмся спасения.»"
10053060-304 = "Прошло десять минут. Помощь так и не пришла."
10053060-306 = ""
10053060-307 = "*тяжело дышит* *тяжело дышит*"
10053060-308 = "Сенсей, вы в порядке? Вы весь в поту. Прямо... запотеваете всё вокруг."
10053060-309 = "[s23] «Ты тоже, Коноха.»\n[s24] «Наверное, тут и правда немного некомфортно.»"
10053060-312 = "..."
10053060-313 = "Похоже, выбора нет."
10053060-314 = "Сенсей. Подойдите чуть ближе."
10053060-318 = "Прямо ко мне. Да, так должно сработать."
10053060-319 = "Итак..."
10053060-320 = ""
10053060-322 = ""
10053060-323 = "В атаку!!"
10053060-325 = ""
10053060-330 = ""
10053060-331 = ""
10053060-332 = ""
10053060-333 = "Ах, как освежает! Надо было с самого начала её опрокинуть!"
10053060-334 = "Сенсей, вы не пострадали?"
10053060-335 = "[ns25] «Нет. Благодаря тебе.»\n[ns26] «Подумать только, ты швырнула будку...»"
10053060-338 = "Ой, это пустяки! Даже разминкой не назовёшь, ха-ха-ха!"
10053060-339 = ""
10053060-340 = "*помехи*"
10053060-341 = "...Подождите... это не... че..."
10053060-342 = ""
10053060-344 = ""
10053060-349 = ""
10053060-350 = "Покойся по кусочкам, урод! *фух* Хорошо, что всё закончилось. Как думаете, она и правда была проклята?"
10053060-351 = "Стойте, забудьте! Скорее назад!"
10053060-353 = "В итоге мы так и не узнали, кто нам звонил."
