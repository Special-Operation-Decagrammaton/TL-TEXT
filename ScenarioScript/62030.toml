[translation]
62030-1 = "Эпизод 3;Там, где нужна помощь"
62030-2 = "Аргх!"
62030-3 = "А-а-а?!"
62030-4 = "Ацуко! Назад!"
62030-5 = ""
62030-8 = "Угх?!"
62030-10 = "М-Мисаки?!"
62030-11 = ""
62030-15 = ""
62030-17 = "Ух...?!"
62030-18 = "Осторожно!"
62030-19 = ""
62030-22 = ""
62030-24 = ""
62030-26 = "Мине?!"
62030-27 = "Тц...?!"
62030-28 = ""
62030-32 = ""
62030-34 = ""
62030-39 = ""
62030-40 = ""
62030-41 = "(Что... это?)"
62030-42 = "(Вокруг темно... Я... тону?)"
62030-43 = ""
62030-47 = "—!!"
62030-48 = ""
62030-54 = "Всё зависело от точки зрения."
62030-55 = "В каком-то смысле всё было просто."
62030-56 = "В каком-то смысле всё было пустяком."
62030-59 = "Были те, кто считал, будто лишь они держат перо, которым пишется «истина»."
62030-60 = "Человечество инстинктивно стремится доказать себя перед богом."
62030-61 = "Объявить себя единственно истинной ортодоксией — значит по самой своей сути заявить, что все несогласные с тобой неправы."
62030-64 = "И посему совет постановляет..."
62030-65 = ""
62030-71 = "...навсегда и без права отмены отлучить Ариус."
62030-72 = "Во имя святых родителей, святых детей и святого духа."
62030-73 = ""
62030-79 = "[log]И так началась[/log]"
62030-81 = "[log]долгая история наших гонений.[/log]"
62030-84 = "(Это... история Ариуса...)"
62030-85 = ""
62030-91 = "Пути вперёд не было. Окровавленными руками и с израненными душами мы проложили свой собственный."
62030-92 = "Свет исчез из нашей жизни, а нас принесли в жертву теням. Нас бросили гнить среди нечистот и отчаяния — существовать не лучше крыс, снующих у них под ногами."
62030-93 = "Тринити жаждала нашего полного уничтожения."
62030-94 = "От высочайших небес до глубочайших ям этой земли — они хотели стереть само наше существование из реальности."
62030-97 = "В таких обстоятельствах само выживание стало высшей формой сопротивления. Единственной, что у нас была."
62030-98 = "Нас разъедала ненависть, за которую мы были слишком слабы отомстить, и потому она обратилась внутрь."
62030-104 = "Так много людей погибло."
62030-105 = "Бессмысленные потери вскоре вплелись в ритм нашей повседневной жизни."
62030-106 = "Ненависть растекалась по нам, словно яд."
62030-107 = ""
62030-111 = "[log]И потому.[/log]"
62030-113 = "[log]Vanitas vanitatum. Всё суета.[/log]"
62030-116 = "...!"
62030-119 = "Тринити — те, кто возомнил себя судьями, — объявила наше отлучение неизбежным."
62030-120 = "Тринити — те, кто возомнил себя судьями, — объявила его следствием наших собственных грехов."
62030-121 = "Тринити — те, кто возомнил себя судьями, — объявила страдание нашей епитимьей и судьбой."
62030-123 = "И здесь мы возражаем."
62030-124 = "«Судьба» — лишь выдумка. Ничто в этом мире не предопределено."
62030-127 = "Если бы не их собственные деяния в прошлом, где бы мы стояли сейчас? Пусть ответят нам."
62030-128 = "Если бы не история, которую они определили за нас, о каком «завтра» мы мечтали бы? Пусть ответят нам."
62030-129 = "Если бы не ненависть, которую они посеяли, какие плоды любви мы собирали бы сегодня? Пусть ответят нам."
62030-130 = ""
62030-134 = "П-Пожалуйста, простите меня... Я была неправа... Простите..."
62030-135 = "Простите... простите... мне так жаль... Я больше никогда..."
62030-136 = "...!"
62030-137 = ""
62030-141 = "Есть мир, где для ребёнка надеяться — грех."
62030-142 = "Есть мир, где для ребёнка молиться о счастье — грех."
62030-143 = "Я откажусь от всякой надежды... Я не буду сопротивляться."
62030-144 = "Я никогда не стану молиться о счастье... Никогда... Простите..."
62030-146 = "В таком мире даже слово «милосердие» теряет смысл."
62030-147 = "Помилуйте... пожалуйста..."
62030-148 = "Милость..."
62030-151 = "Ответьте нам."
62030-152 = "Какая святость может быть в истине, отнявшей у нас наших детей?"
62030-153 = "Что такое «праведность» перед слезами голодного ребёнка, добывающего себе еду воровством? Чьи руки не знают иного тепла, кроме собственного дыхания?"
62030-154 = "Кто осмелится говорить о «справедливости» перед ребёнком, чья жизнь не знала ничего, кроме бессмысленных страданий?"
62030-155 = "Это..."
62030-156 = "ОТВЕЧАЙТЕ!"
62030-157 = "Это ваш долг! Ваша обязанность!"
62030-158 = "Настоящее воздвигнуто на фундаменте его мрачного прошлого!"
62030-160 = "Всё было лишь вопросом точки зрения! Толкования! Чем-то настолько простым, настолько ничтожным."
62030-161 = "И всё же именно из этого источника хлынули ярость и обида, ненависть и отчаяние."
62030-162 = "Дети этой земли издавна шли бок о бок со смертью, ближе к ней, чем кто-либо ещё в Кивотосе."
62030-163 = "Так скажи мне: по какому праву, с какой дерзостью ты смеешь продолжать жить?"
62030-164 = "Ответь."
62030-165 = ""
62030-169 = "Я... не могу."
62030-170 = "Ибо у меня нет ответа на твой вопрос."
62030-171 = "Проблема заключена в самом вопросе... ведь никакого оправдания этому нельзя и не должно давать."
62030-172 = "*всхлипывает*"
62030-173 = "*всхлипывает*"
62030-174 = ""
62030-183 = "[log]Даже звёзды и луна на небе[/log]"
62030-185 = "[log]не вынесли вида собственных грехов и скрыли свой свет.[/log]"
62030-188 = "[log]Куда идёшь, Господи?[/log]"
62030-201 = "[log]Как ваш студент...[/log]"
62030-203 = "[log]Я хочу кое о чём вас спросить.[/log]"
62030-207 = "[log]...Когда человек оказывается на самом дне...[/log]"
62030-209 = "[log]Что заставляет его[/log]"
62030-211 = "[log]оставаться на ногах...?[/log]"
62030-215 = "(Это...?)"
62030-216 = "(Понятно. Воспоминание о том, как я задала Сенсею этот вопрос.)"
62030-217 = "(И Сенсей ответил...)"
62030-220 = "«...То, во что этот человек верит»."
62030-221 = "«Некоторые вещи устроены не так»."
62030-222 = "«Человеком движут его чувства и убеждения»."
62030-223 = ""
62030-226 = "«Будь то вера во что-то великое...»"
62030-227 = "«...или доверие к чему-то внутри самого себя»."
62030-228 = "(Сенсей...)"
62030-229 = "(Тогда во что должна верить я?)"
62030-230 = "(Пожалуйста, направьте меня, Сенсей.)"
62030-231 = "(Как Тринити может искупить... всю причинённую нами боль и трагедии?)"
62030-232 = ""
62030-236 = "[log]Делай то, во что веришь.[/log]"
62030-240 = "(Не припомню, чтобы Сенсей говорил нечто подобное...)"
62030-243 = "То, во что верила ты."
62030-244 = "То, что помогало тебе продолжать идти в самые тёмные минуты."
62030-246 = "(Нет, постой. Это...)"
62030-247 = "(Я знаю. Я уверена, это совет Сенсея.)"
62030-250 = "Мы не можем изменить прошлое."
62030-251 = "Но это не значит, что мы не можем продолжать жить в настоящем."
62030-254 = "Поэтому, если путь, которым ты шла до сих пор, не был ошибочным."
62030-255 = "Продолжай быть верна этому пути и докажи себя."
62030-256 = "(Путь, которым я шла.)"
62030-257 = "(Это...)"
62030-258 = ""
62030-262 = "[log]Если ты останешься глуха[/log]"
62030-264 = "[log]к голосам, зовущим на помощь,[/log]"
62030-266 = "[log]кем ты будешь считать себя?[/log]"
62030-270 = "...!!"
62030-271 = "(...Понятно. Вот что имел в виду Сенсей...!)"
62030-272 = ""
62030-274 = ""
62030-275 = "..."
62030-276 = "У меня есть ответ."
62030-277 = "Возможно, он покажется неудовлетворительным."
62030-278 = "И всё же здесь и сейчас я заявляю о своём праве продолжать жить, несмотря на наши грехи."
62030-280 = "Ты права. Этот мир переполнен скорбью, и боль часто становится краеугольным камнем нашего существования."
62030-281 = "Настоящее не могло бы существовать без жертв, высеченных в фундаменте прошлого."
62030-284 = "И всё же, несмотря на эти неоспоримые истины, я продолжу свои ничтожные, неприметные труды."
62030-285 = "И если этими трудами мне удастся вычерпать хотя бы одну ложку из моря скорби..."
62030-286 = "...мне больше ничего не нужно."
62030-287 = ""
62030-291 = ""
62030-292 = "В этом мире есть вещи, которые я обязана защищать."
62030-293 = "Я делаю это не ради благодарности в ответ."
62030-294 = "С каких пор моя гордыня породила во мне столь постыдное чувство, будто мне что-то должны?"
62030-295 = "Ибо следовать своему пути праведности — одновременно мой долг и моя гордость."
62030-296 = ""
62030-298 = ""
62030-299 = "Идите вперёд с верой и честью в сердце."
62030-302 = "Оглядываясь назад, я понимаю: вокруг меня повсюду звучали просьбы о помощи."
62030-303 = "Если бы я только могла вернуться назад и откликнуться на каждую из них."
62030-304 = "Почему пределы нашего тела так жестоко ограничивают наши стремления?"
62030-306 = "Как бы то ни было, путь вперёд ясен."
62030-307 = "Я больше никогда не позволю этим голосам остаться неуслышанными."
62030-309 = "Пока эти слабые руки способны дотянуться, я буду протягивать их."
62030-310 = "Я наивно надеюсь, что эти, казалось бы, крошечные решения будут накапливаться — шаг за шагом, усилие за усилием."
62030-311 = "И однажды каждый из этих невинных детей..."
62030-312 = ""
62030-316 = "...сможет увидеть лучшее будущее в лучшие времена."
62030-317 = ""
62030-319 = "Ибо медицина не знает границ."
62030-320 = ""
62030-326 = "Все! За мою спину!"
62030-327 = ""
62030-330 = ""
62030-331 = "Капитан?!"
62030-332 = "Капитан?!"
62030-333 = ""
62030-336 = ""
62030-337 = "Рыцари исправительного курса защитят вас!"
