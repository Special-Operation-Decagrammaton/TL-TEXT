[translation]
90001260-1 = "Эпизод 26;То, что было скрыто"
90001260-2 = "[ns] «Похоже... это была последняя комната?»"
90001260-3 = "К-Кому-нибудь ещё кажется... что здесь как-то странно?"
90001260-4 = "Это стоячая вода? И ещё смотрите. Поверх мха растут лозы."
90001260-5 = "При таком уровне разрушений это хранилище семян должно было быть заброшено очень давно."
90001260-6 = "Смотрите, Рио, Химари! Этот шкаф занимает всю стену!"
90001260-8 = "Любопытно. Давайте посмотрим."
90001260-9 = ""
90001260-11 = "Как неожиданно. На самом деле они сохранились невероятно хорошо."
90001260-12 = "Я знаю, госпожа Рио сказала, что здесь всё сильно повреждено, но разве это не выглядит именно так, как и представляешь хранилище семян? Всё такое зелёное!"
90001260-13 = "Ага. Прямо как в старых произведениях... тайное убежище, где живёт антропоморфный бог леса."
90001260-14 = "Похоже, этот объект сохранился благодаря тройной системе герметизации."
90001260-16 = "Да. Само здание и складские помещения могли разрушиться, но истинное назначение объекта — убежище для сохранения семян — свою задачу выполнило."
90001260-17 = "Понятно. Это пример превосходного технологического уровня Миллениума."
90001260-18 = "Но, похоже, это ещё не всё."
90001260-20 = "Что ты имеешь в виду, Рио?"
90001260-21 = "Судя по данным, ИИ, превращённые в пророков, склонны вести себя иначе, чем предусматривал исходный алгоритм."
90001260-22 = "В конце концов, Ход изначально был коммуникационной ИИ-сетью Миллениума. Очевидно, он эволюционировал далеко за эти рамки."
90001260-23 = "Как и Хокма. Теперь его едва ли можно назвать «просто кораблём»."
90001260-24 = "ИИ этого хранилища семян, вероятно, и есть то, что они теперь называют «Тиферет»."
90001260-25 = "И всё же, похоже, у него есть какая-то... воля продолжать свою миссию по сохранению семян."
90001260-26 = "Иначе этот объект не оставался бы в рабочем состоянии."
90001260-27 = "Если предположить, что это правда, возникает другой вопрос."
90001260-28 = "Кто хотел сохранить семена? Тиферет? Или те три ребёнка?"
90001260-29 = "И что это значит, если это была Тиферет?"
90001260-30 = "Это означало бы... что пророки всё ещё сохраняют какое-то... сознание."
90001260-31 = "А если продолжить эту мысль—"
90001260-32 = ""
90001260-36 = ""
90001260-37 = "...?!"
90001260-38 = "Разве это не...?!"
90001260-39 = ""
90001260-41 = ""
90001260-42 = ""
90001260-43 = ""
90001260-45 = ""
90001260-46 = "Р-Рио?! Химари?!"
90001260-47 = "Момой тоже? Мидори? Все...? Ч-Что происходит?!"
90001260-48 = "Что... это за странный запах? Он действует на меня... как дебафф... Мне нехорошо."
90001260-49 = "Сенсей? Вы в порядке, Сенсей? Сенсей?!"
90001260-50 = ""
90001260-52 = ""
90001260-54 = ""
90001260-57 = "В глазах начало темнеть."
90001260-58 = "У меня кружилась голова и, как ни странно, я начал чувствовать себя очень... очень... сонным."
90001260-59 = ""
90001260-64 = "Просыпайтесь, Сенсей!!"
90001260-65 = "[ns1] «Арона...? Плана...?»\n[ns2] «Разбудите меня утром... Ммм...»"
90001260-68 = "Арона, это..."
90001260-69 = "Всё хорошо, Плана! Я разберусь!"
90001260-70 = "Оставляю это тебе, Арона. Я не знакома с подобными ситуациями..."
90001260-71 = "Не могу точно определить, что это, но похоже на какой-то... газ! Пока что я заблокировала дальнейшее попадание в организм Сенсея!"
90001260-72 = "Анализ: бесцветный, без запаха. Относительно слабое вещество, воздействующее на нервную систему."
90001260-73 = "С остальными студентами тоже всё будет хорошо! Они просто выспятся как следует."
90001260-74 = "Предупреждение. Длительное воздействие может быть вредным. Любое такое вещество содержит определённый уровень токсичных компонентов."
90001260-75 = "Хи-хи-хи. Но разговоры о сне заставляют меня самой захотеть хорошенько и долго вздремнуть."
90001260-76 = "Арона. Если мы сделаем это прямо сейчас..."
90001260-77 = "Я-я пошутила, Плана! Я ни за что на самом деле не усну!"
90001260-78 = "Пока соглашусь. В подобных ситуациях Ароне можно доверять. В определённой степени."
90001260-79 = "Ахаха. Что значит «в определённой степени», Плана...?"
90001260-80 = "А, Сенсей! Кей идёт сюда!"
90001260-81 = ""
90001260-82 = "[ns] «Кей?»"
90001260-83 = "А, вы в безопасности. Какое облегчение."
90001260-84 = "Но... почему вы в безопасности? Понятно, почему мы, но Сенсей — единственный человек, на которого это, похоже, не действует."
90001260-85 = "Уааа! Я рада, что с Сенсеем всё хорошо, но остальные...!"
90001260-86 = "Хмм, разница между Сенсеем и остальными..."
90001260-88 = "(Постойте, неужели...?)"
90001260-90 = "Уааа! Это событие с дебаффом статуса? Может, я ослабла, потому что не смогла защитить союзников!"
90001260-91 = "Сейчас я не могу выдавать 100% своей мощности!"
90001260-92 = ""
90001260-93 = "[ns] «Все остальные... спят?»"
90001260-94 = "Да. Спят. Но жизненные показатели стабильны."
90001260-95 = "В любом случае ситуация далека от идеальной. У нас едва ли есть время бездельничать здесь внизу."
90001260-96 = "Такова текущая ситуация, Сенсей. Я обнаружила в центре хранилища семян нечто вроде сенсорной панели."
90001260-98 = "Мне не удалось её активировать. Поэтому я попросила Арис попробовать..."
90001260-99 = "...Но экран вспыхнул лишь на мгновение и снова погас! Неужели я тоже потеряла уровни? Уааа!"
90001260-101 = "И всё же то же самое произошло со спящими людьми..."
90001260-102 = "Потому что они переживают тот же ивент понижения уровня! Я чувствую потерю..."
90001260-103 = "...Не могу понять, говорит Арис буквально или образно, но, возможно, вы сможете помочь, Сенсей."
90001260-104 = "Почему-то... из всех нас именно на вас это подействовало слабее всего."
90001260-105 = "[s3] «Хорошо. Но... сначала у меня вопрос.»\n[s4] «Ты ПРИТАЩИЛА их всех сюда, чтобы приложить их руки к панели?»"
90001260-108 = "Да? А почему вы спрашиваете? Это естественный метод для любого научного эксперимента."
90001260-109 = "Я-я хотела остановить её, но... УААА!"
90001260-110 = "Извинимся за наши действия потом, хорошо? В смысле, Рио, вероятно, признала бы, что это был самый логичный ход."
90001260-111 = ""
90001260-112 = "[ns] «Тут не поспоришь...»"
90001260-114 = "Как и попросила Кей, я приложил руку к сенсорной панели."
90001260-115 = "И вдруг...!"
90001260-116 = ""
90001260-122 = "[ns] «А...?!»"
90001260-123 = "Разве это не эмблема Федеральной академии Красная Зима?! Почему она здесь...?"
90001260-124 = ""
90001260-127 = "Стоило Кей это сказать, как заиграла величественная, но при этом бодрая мелодия."
90001260-128 = "Следом раздался вежливый роботизированный голос."
90001260-130 = "[56cd7b][log=모니터]Добро пожаловать, товарищ. [wa:500]Или человек, который товарищем не является.[/log]"
90001260-132 = "[56cd7b][log=모니터]Добро пожаловать в хранилище семян Красной Зимы.[/log]"
90001260-134 = "[ns] «...Что это такое?»"
90001260-135 = "[56cd7b]Добро пожаловать, товарищ. Или человек, который товарищем не является."
90001260-136 = "[56cd7b]Добро пожаловать в хранилище семян Красной Зимы."
90001260-137 = "...Похоже, часть её схем поджарилась, но, судя по всему, это система управления хранилищем."
90001260-139 = "[56cd7b][log=모니터]Этот объект — колыбель жизни, подготовка к разрушению, которое однажды[/log]"
90001260-141 = "[56cd7b][log=모니터]настигнет всех нас, последний уголёк некогда ярко пылавшей цивилизации.[/log]"
90001260-144 = "[56cd7b][log=모니터]Для разнообразия я бы с радостью поприветствовала вас своей любимой песней.[/log]"
90001260-146 = "[56cd7b][log=모니터]К сожалению, два дня назад я эту песню запретила, так что эту часть придётся пропустить.[/log]"
90001260-148 = "[ns] «...Очень в духе Красной Зимы...»"
90001260-149 = "[56cd7b][log=모니터]Это хранилище семян построено не только для вас из будущего, но и для нас «прямо сейчас».[/log]"
90001260-152 = "[56cd7b][log=모니터]Мы рекламировали его как способ для человечества начать всё заново, если миру придёт конец,[/log]"
90001260-154 = "[56cd7b][log=모니터]и тем самым смогли успокоить народ.[/log]"
90001260-157 = "[56cd7b][log=모니터]Благодаря этому мы могли двигаться дальше без перемен и страха.[/log]"
90001260-159 = "[56cd7b][log=모니터]Конечно, нельзя отрицать вероятность того, что наши революционные действия[/log]"
90001260-161 = "[56cd7b][log=모니터]пошли не так и привели как раз к тому разрушению, которого мы боялись.[/log]"
90001260-164 = "[56cd7b][log=모니터]Но в итоге благодаря этому мы всё-таки встретились. Судьба — занятная штука.[/log]"
90001260-166 = "Я-я совсем запуталась. Это типа... местный NPC?"
90001260-168 = "[56cd7b][log=모니터]Строительство этого объекта было ужасно утомительным делом.[/log]"
90001260-170 = "[56cd7b][log=모니터]Мне даже пришлось разбавлять пудинги водой, чтобы накопить на строительство.[/log]"
90001260-173 = "[56cd7b][log=모니터]Надеюсь, моим преемникам не придётся заходить так далеко.[/log]"
90001260-176 = "[56cd7b][log=모니터]В любом случае, похоже, разрушение всё-таки наступило. Значит, наши усилия окупились.[/log]"
90001260-178 = "Они как-то слишком легко относятся к концу света. Раздражает..."
90001260-180 = "[56cd7b][log=모니터]Как я уже говорила, этот объект — последнее хранилище семян.[/log]"
90001260-183 = "[56cd7b][log=모니터]Мы запрограммировали объект безопасно хранить семена — последнюю линию жизни[/log]"
90001260-185 = "[56cd7b][log=모니터]на случай полного уничтожения. И даже не провели ни одного тестового запуска. Очень логично.[/log]"
90001260-188 = "[56cd7b][log=모니터]Иными словами, всё, к чему вы прикасались, прикасаетесь и ещё прикоснётесь,[/log]"
90001260-190 = "[56cd7b][log=모니터]— это вещи, к которым даже мы ещё не прикасались.[/log]"
90001260-192 = "[56cd7b][log=모니터]Понятно? Так что не трогайте всё подряд без разбора.[/log]"
90001260-194 = "[ns5] «Вы вообще не проводили тестовых запусков...»\n[ns6] «...чтобы убедиться, что всё работает?»"
90001260-197 = "[56cd7b]Иными словами, всё, к чему вы прикасались, прикасаетесь и ещё прикоснётесь,"
90001260-198 = "[56cd7b]— это вещи, к которым даже мы ещё не прикасались."
90001260-199 = "[56cd7b]Понятно? Так что не трогайте всё подряд без разбора."
90001260-200 = "У этих людей вообще мозги были?!"
90001260-202 = "[56cd7b][log=모니터]Вам разрешён доступ до зоны 3 — управляющего объекта. Однако для входа во второе[/log]"
90001260-204 = "[56cd7b][log=모니터]хранилище семян необходимо пройти стандартные процедуры консультативного комитета.[/log]"
90001260-207 = "[56cd7b][log=모니터]Ведь этот крайне важный объект отвечает за хранение 70%[/log]"
90001260-209 = "[56cd7b][log=모니터]всех семян. Если вы попытаетесь повредить его или прорваться внутрь силой...[/log]"
90001260-211 = "[56cd7b][log=모니터]даже если ради этого придётся пожертвовать остальными объектами, мейнфрейм...[/log]"
90001260-214 = "[56cd7b][log=모니터]Кофе у меня закончился ещё несколько месяцев назад, так что мысль совсем не идёт.[/log]"
90001260-217 = "[56cd7b][log=모니터]Просто придумайте сами что-нибудь ужасающее. [/log]"
90001260-219 = "[56cd7b][log=모니터]Что-нибудь такое, чего вы точно не хотите испытать на себе.[/log]"
90001260-221 = "Э-Эм... Тогда... удаление сохранений?"
90001260-223 = "[56cd7b][log=모니터]Да. Вот это. Мы сделаем с вами именно это.[/log]"
90001260-225 = "[56cd7b][log=모니터]Как бы там ни звучало выражение, спасибо за помощь.[/log]"
90001260-227 = "[56cd7b][log=모니터]Поэтому, пожалуйста, не трогайте второе хранилище.[/log]"
90001260-230 = "[56cd7b][log=모니터]Хотя признаю, жаль, что вы не увидите его изнутри.[/log]"
90001260-232 = "[56cd7b][log=모니터]В отличие от зоны 3, там гораздо чище и всё построено как следует.[/log]"
90001260-235 = "[56cd7b][log=모니터]Мы не хотели превращать эту зону в склад, но... такова жизнь, верно?[/log]"
90001260-237 = "[56cd7b][log=모니터]Ничего не идёт по плану, как и первая партия блинов, которая всегда получается комом.[/log]"
90001260-240 = "[56cd7b][log=모니터]Так что забудем прошлое и в следующий конец света справимся лучше![/log]"
90001260-242 = "Следующий... конец света?"
90001260-243 = "Я вообще не понимаю, что говорит этот человек. Уааа..."
90001260-245 = "[56cd7b][log=모니터]На этом инструктаж по безопасности и предупреждениям завершён.[/log]"
90001260-247 = "[56cd7b][log=모니터]Надеемся, конец света оказался не слишком болезненным.[/log]"
90001260-250 = "[56cd7b][log=모니터]И ещё.[/log]"
90001260-253 = "[56cd7b]И ещё."
90001260-256 = "[56cd7b]И ещё..."
90001260-260 = "[FF6666][log=모니터]«Эй, память уже заполнена?»[/log]"
90001260-262 = "[FF6666][log=모니터]«Дело в том...»[/log]"
