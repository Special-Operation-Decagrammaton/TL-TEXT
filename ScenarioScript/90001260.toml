90001260-327 = "...Влетело и вылетело, словно ураган."
90001260-328 = "[ns7] «Каждая вторая их фраза звучала тревожно...»\n[ns8] «...но туда ведь сказали не ходить, верно?»"
90001260-331 = "Хм? Да. Даже если ради этого придётся пожертвовать остальными объектами..."
90001260-332 = "...они подвергнут нас худшему, что мы только можем себе представить, если мы всё-таки пойдём."
90001260-333 = "Нет... Только не сохранения..."
90001260-334 = "(...Когда-нибудь мне нужно серьёзно поговорить с Арис о том, сколько времени она проводит за играми...)"
90001260-335 = ""
90001260-338 = ""
90001260-340 = "Э-Электричество отключилось...?"
90001260-341 = "...И что на этот раз?"
90001260-342 = "З-Здесь совсем темно! Я ничего не вижу...!"
90001260-343 = "Держись рядом со мной, Арис!"
90001260-344 = "...? Какой-то сигнал...?"
90001260-345 = "...!"
90001260-346 = ""
90001260-348 = ""
