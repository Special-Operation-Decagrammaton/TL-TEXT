[translation]
1012802-1 = "Осколки и воображение"
1012802-2 = "На следующий день я вернулся в Шале после деловой поездки."
1012802-3 = ""
1012802-9 = "[ns] «Хм?!»"
1012802-11 = "[ns] «Что происходит?!»"
1012802-12 = ""
1012802-13 = "Хм... Какой захватывающий финал."
1012802-14 = "Довольно глубоко. Она умеет сказать так много без единого слова."
1012802-15 = "Не понимаю. Что вообще происходит? На нас напали?"
1012802-16 = "Это перформанс! Это культура!"
1012802-17 = ""
1012802-18 = "[ns] «Перформанс...?»"
1012802-20 = "И когда я подошёл ближе..."
1012802-21 = "...я увидел разбросанные вокруг разбитые телевизоры, мониторы, радиоприёмники и камеры."
1012802-22 = "А в центре этого беспорядка была..."
1012802-23 = ""
1012802-24 = "О, кого я вижу! Рада встрече, Сенсей!"
1012802-25 = "[s] «Фую, что это за бардак?»"
1012802-26 = "Бардак... или тщательно выстроенные обломки?"
1012802-27 = "Если коротко..."
1012802-28 = "Подвешенные предметы, танец, поэзия, музыка..."
1012802-29 = "...всё это по-своему искусство. И всё же простому определению они не поддаются."
1012802-30 = "Так что я исследовала неоднозначность и воплощение личного через политическое, тела через машину..."
1012802-31 = "[s] «...Можешь сказать это чуть понятнее?»"
1012802-32 = "Это медиа-арт, Сенсей. Это перформанс, и все мы — его часть."
1012802-33 = "[s] «Можно было сразу так и сказать...!»"
1012802-34 = ""
1012802-36 = ""
1012802-37 = "[ns] «Значит, когда ты говорила, что выходишь наружу, это было ради...»"
1012802-38 = "Да. Мне выдали разрешение на выход ради этого выступления."
1012802-39 = "...Конечно, заодно я синергично совмещаю это с «подработкой»."
1012802-40 = "Если ты не заметил, такое искусство обходится недёшево. Я не могу, как Миё, просто печатать где-нибудь в тёмном углу."
1012802-41 = "Мне нужен постоянный доход, чтобы покупать электронику, инструменты и всё подобное..."
1012802-42 = "[s] «Поэтому ты и состоишь в Картеле свободной торговли.»"
1012802-43 = "Деньги помогают, но есть и другие причины."
1012802-44 = "В любом случае, какая жалость. Ты пришёл ровно к концу. Пропустил всё повествование, всю борьбу!"
1012802-45 = "Я очень многое продумала. Ты даже не представляешь, сколько планирования это требует."
1012802-46 = "Хм? О чём был этот перформанс?"
1012802-47 = "Фу-фу, если просто РАССКАЗАТЬ, будет неинтересно."
1012802-48 = "Перформанс — это ПОКАЗ, выражение того, что невозможно передать одними словами."
1012802-49 = "А если я объясню тебе смысл, впечатление станет слабее."
1012802-50 = "[s] «Наверное...?»"
1012802-51 = "У меня идея. Попробуй представить сам."
1012802-52 = "Посмотри на обломки. Каждый предмет лежит в определённом месте — его поставили туда намеренно или это случайность? Представь, что чувствовала публика после конца, внезапную тишину, рассеивающийся дым..."
1012802-53 = "Собери всё это вместе и представь, о чём был мой перформанс."
1012802-54 = "Может быть, ты даже узнаешь что-нибудь о себе, Сенсей!"
1012802-55 = "[s] «Мир искусства и правда не так прост...»"
1012802-56 = "Но всё же лучше всего было бы, если бы ты..."
1012802-57 = "...смотрел всё из первого ряда. Фу-фу."
1012802-58 = "А ещё лучше — в следующий раз можешь выйти на сцену вместе со мной."
1012802-59 = "[s] «В следующий раз я обязательно приду посмотреть!»"
1012802-60 = "Ха-ха! Поняла! Давить не буду."
1012802-61 = "Я уважаю твой выбор. Но услышала то, что хотела..."
1012802-62 = "...Что в следующий раз ты будешь здесь."
1012802-63 = "Ты обещал! А теперь, пожалуй, мне пора двигаться."
1012802-64 = "Мне нужно всё подмести и упаковать, так что тебе лучше возвращаться к работе, Сенсей!"
1012802-65 = "...Что? Ты хочешь помочь с уборкой?"
1012802-66 = "Тебе ПРАВДА не нужно... Я вовсе не на это намекала."
1012802-67 = "[s1] «Буду использовать воображение, подбирая каждый кусочек.»\n[s2] «Может, это поможет мне понять художественный замысел автора.»"
1012802-70 = "Сенсей..."
1012802-71 = "[s] «Н-Не то чтобы я п-пытался тебе помочь или что-то такое!»"
1012802-72 = "Пф-ф! Ха!"
1012802-73 = "...Хорошо. Давай уберём всё вместе."
1012802-74 = "Спасибо, Сенсей."
1012802-76 = "Я помог Фую убрать место проведения перформанса."
