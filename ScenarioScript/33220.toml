[translation]
33220-1 = "Episódio 22;O Nome do Paraíso (3)"
33220-3 = "Líder..."
33220-4 = "Saori-san..."
33220-5 = "O Conselho das Santas de Justina já não está mais funcionando direito. A partir do momento em que passaram a existir duas ETOs, os preceitos começaram a perder o sentido..."
33220-6 = "Tanto o que restou do Conselho das Santas quanto o Ambrosius já estão..."
33220-7 = "Não temos mais cartas na manga... Nós perdemos."
33220-12 = "Saori... Desista de uma vez."
33220-13 = "Não brinque comigo!!"
33220-14 = "Por que... Por que só você...?!!"
33220-15 = "Nós sofremos juntas e nos desesperamos juntas! Neste mundo cinzento!"
33220-16 = "Neste mundo onde tudo é em vão, por acaso só você tem algum significado?!"
33220-17 = "Só você vai ficar sob um céu tão azul assim?!"
33220-18 = "Eu vou negar tudo! Tudo o que você aprendeu em Trinity, o que vivenciou, o que percebeu! Tudo, absolutamente tudo!!"
33220-19 = "Porque tudo é em vão!"
33220-20 = "Não, isso você não pode fazer."
33220-21 = "O fato de termos passado nas provas e todo o esforço que fizemos até chegarmos lá jamais serão apagados!"
33220-25 = "...Mesmo que tudo seja em vão, eu vou continuar lutando a partir daí."
33220-29 = "Saori... Eu não vou mais perder."
