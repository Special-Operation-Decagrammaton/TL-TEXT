[translation]
33220-1 = "Эпизод 22;Имя рая, часть 3"
33220-2 = ""
33220-3 = "Лидер..."
33220-4 = "Саори...?"
33220-5 = "Совет уже едва способен сохранять воплощение. Из-за существования двух ОЭД заповеди теряют силу."
33220-6 = "Это происходит со всем Советом — даже с Амвросием."
33220-7 = "Без них у нас нет надежды на победу. Всё кончено."
33220-8 = ""
33220-10 = ""
33220-11 = ""
33220-12 = "Саори. Пожалуйста, сдавайся."
33220-13 = "Молчать!"
33220-14 = "Почему?! Чем ты так отличаешься?!"
33220-15 = "Мы сделаны из одного теста. Мы страдали вместе! Вместе отчаивались в этой пустыне!"
33220-16 = "Как получилось, что только ты одна смогла найти смысл в мире, где всё тщетно?!"
33220-17 = "Что делает тебя такой особенной?!"
33220-18 = "Я отказываюсь это принимать. Я отвергаю найденный тобой смысл — каждую вещь, которую ты пережила в Тринити! Да пошло оно всё!"
33220-19 = "Всё тщетно — абсолютно всё!"
33220-20 = "Нет, не тщетно!"
33220-21 = "Тяжёлый труд, который мы вложили, чтобы сдать экзамены, всегда будет иметь смысл!"
33220-22 = ""
33220-24 = ""
33220-25 = "Даже если каждый наш вдох в конечном счёте тщетен, смысл всё равно есть. Бороться — значит жить."
33220-26 = ""
33220-28 = ""
33220-29 = "Я покажу тебе, Саори. Я не паду здесь."
