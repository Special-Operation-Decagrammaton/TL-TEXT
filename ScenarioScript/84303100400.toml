[translation]
84303100400-5 = ""
84303100400-6 = "Закончила разговор?"
84303100400-7 = "А, отлично, ты вернулась! Я уже думала, ты где-нибудь спрячешься и отправишь нам MomoTalk с просьбой тебя найти!"
84303100400-8 = "...Она не пытается тебя задеть. Она буквально думала, что именно это и происходит."
84303100400-10 = "Я понимаю. Наверное, я уже порядком доставила вам обеим головную боль. В следующий раз придумаю, как вас отблагодарить."
84303100400-11 = "Нет, мы делаем это не ради награды... да и вообще, если ты нам что-то подаришь, это, скорее всего, только создаст новые проблемы."
84303100400-12 = "В любом случае, где ты собираешься осмотреться дальше? Если планов нет, можем начать отсюда."
84303100400-13 = "Или присоединимся к остальным студентам Тринити. Так будет проще. И, наверное, безопаснее."
84303100400-14 = "Спасибо за предложение, но есть ещё одно место, куда мне хотелось бы сходить."
84303100400-15 = "Вы случайно не знаете, где находится Отдел разработки игр?"
84303100400-16 = "Отдел разработки игр? А-а. Это место..."
84303100400-17 = "Да! Конечно знаю!"
84303100400-18 = "Но зачем ты туда хочешь? И ты имеешь в виду клубную комнату Отдела разработки игр или выставочный зал?"
84303100400-19 = "А? Клубная комната? Выставочный зал...? Хм..."
84303100400-21 = "Сейчас Экспо. Конечно же, она спрашивает про выставочный зал."
84303100400-22 = ""
84303100400-24 = ""
84303100400-25 = ""
84303100400-26 = "(Ах... надо было подробнее расспросить Рио.)"
84303100400-27 = "(В контексте выставочный зал звучит логичнее всего, но...)"
84303100400-28 = "...Для начала я бы хотела заглянуть в клубную комнату. Мне нужно лично поговорить с членами клуба."
84303100400-29 = ""
84303100400-31 = ""
84303100400-32 = "...А? В клубную комнату? Ты правда хочешь туда?"
84303100400-33 = "А, это слишком большая просьба?"
84303100400-34 = "Нет, дело не в этом... Ладно, наверное, неважно. Если это личный визит, нам, пожалуй, не стоит толпиться рядом."
84303100400-35 = "Я объясню дорогу. На самом деле это совсем недалеко."
84303100400-36 = "Спасибо. Я скоро вернусь."
84303100400-38 = "Да! За нас не переживай. Мы просто будем тут болтаться!"
84303100400-39 = "Если что-нибудь случится, сообщи нам."
