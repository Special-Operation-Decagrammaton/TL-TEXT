[translation]
10026010-1 = "Эпизод 1;Мнение обычного гражданина"
10026010-2 = "Ранее в Blue Archive"
10026010-6 = ""
10026010-7 = "Недавно специалисты обнаружили этот необычный фрагмент писания на раскопках Тринити."
10026010-8 = "Я хранил его в защитном—"
10026010-9 = ""
10026010-12 = ""
10026010-13 = "А? Это как?"
10026010-14 = ""
10026010-16 = ""
10026010-18 = "Что за писание? Насколько старое?"
10026010-19 = ""
10026010-23 = ""
10026010-24 = "ЧТООО?!"
10026010-25 = ""
10026010-28 = ""
10026010-29 = "Мне нужен клей из сфагнума и священный тоник! Немедленно!"
10026010-30 = "Они абсолютно необходимы, если я должна восстановить текст. Вы обязаны принести их мне. Идите!"
10026010-31 = ""
10026010-35 = ""
10026010-36 = "Потребовалось немало усилий и осторожности, но я сумела восстановить писание, как вы просили."
10026010-37 = "Буду благодарна, если Сенсей доставит его нужным людям."
10026010-38 = ""
10026010-42 = ""
10026010-43 = "Сенсей уже должен был вернуться в Шале..."
10026010-44 = "Да. Сейчас или никогда."
10026010-45 = ""
10026010-47 = ""
10026010-49 = "Вы только посмотрите! Идеальная копия! И ни одна душа об этом не знает, кроме меня!"
10026010-50 = "Пора приоткрыть завесу тайны, окружающую Сестринство."
10026010-52 = "И я первой смогу это прочитать!"
10026010-53 = ""
10026010-57 = ""
10026010-58 = "Возвращение в настоящее"
10026010-61 = "Давай пропустим ту часть, где ты строишь из себя дурочку, и перейдём к делу. Скажи, зачем ты это сделала. Поговори со мной."
10026010-62 = ""
10026010-64 = ""
10026010-65 = "Поговорить с тобой?"
10026010-66 = "Ты думаешь, после того как вы меня похитили, я захочу с тобой разговаривать?"
10026010-67 = ""
10026010-69 = ""
10026010-70 = "Похитили? Нет-нет, ты неправильно поняла..."
10026010-71 = "Никто никого не похищал, Уи. Мы лишь сопроводили тебя в более уединённое место, чтобы поговорить."
10026010-72 = "Ко мне из ниоткуда заявилась толпа женщин и против воли куда-то утащила. Это называется похищением."
10026010-73 = "Честная организация так бы не поступила. Тоже мне, Сестринство..."
10026010-74 = ""
10026010-76 = ""
10026010-77 = "Мне и без того прекрасно известно, что общественность думает о Сестринстве."
10026010-78 = "Что бы ни говорили, мы не обманываем студентов и не плетём злодейских заговоров."
10026010-79 = "Если честно, вся эта банальщина до слёз мне надоела."
10026010-80 = "Беспочвенные обвинения лишь вносят разлад между нами и обществом."
10026010-81 = "А те немногие секреты, которые у нас действительно есть, совершенно не связаны с этими нелепыми теориями заговора."
10026010-82 = "Именно так и сказал бы преступник..."
10026010-83 = "...Угу."
10026010-84 = "Зачем вы меня сюда привели?"
10026010-85 = "И... что именно вы собираетесь со мной сделать...?"
10026010-86 = "Вы окружили меня, и вас тут куда больше. Даже если бы я захотела, отсюда мне не прорваться."
10026010-87 = "Я всё это время одно и то же тебе говорю. Я просто хочу поговорить."
10026010-88 = "Ну, знаешь, предупредить тебя, чтобы ты держала рот на замке."
10026010-89 = "Мы знаем о копии писания Совета, которую ты сделала."
10026010-90 = "...!!"
10026010-91 = "Как?! Я замела все следы. Нет ни единого намёка на то, что копию сделала я."
10026010-92 = "Но даже если бы и был, чтение там оказалось не особо захватывающим."
10026010-93 = "Согласна, в писании были лишь простые исторические факты. Узнает о них общественность или нет — меня не волнует."
10026010-94 = "Как бы то ни было, для нас это драгоценная реликвия. Сделать копию без нашего разрешения — это... возмутительно."
10026010-95 = "Ух... Я должна была понимать, что ничего не смогу скрыть от Сестринства, но—"
10026010-96 = ""
10026010-98 = ""
10026010-99 = "...А!"
10026010-100 = "Хината жива? Что вы сделали с Хинатой?!"
10026010-101 = "...А?"
10026010-102 = "Не стройте из себя дурочку! Я всё знаю о вашей организации! Даже то, что происходит потом..."
10026010-103 = "В-Вы ведь собираетесь от неё избавиться, да? И от меня тоже! Всё ради защиты вашего секрета!"
10026010-104 = "Ох, Хината... Прости, что втянула тебя в это..."
10026010-106 = "...Простите?"
10026010-107 = "Прости меня, Хината... Ох! Это всё моя вина..."
10026010-108 = "Эм... Уи? П-Подожди. Просто успокойся на минутку. С Хинатой всё в порядке!"
10026010-109 = "Конечно, в порядке! Просто отдыхает, да? ВЕЧНЫМ сном! Теперь моя очередь, да?! Вы будете меня пытать, а потом, потом—"
10026010-110 = "Уи! Уи! Пожалуйста, послушай меня..."
10026010-111 = "Делайте что хотите, но правду это не изменит!"
10026010-112 = "Ничто не изменит!"
10026010-113 = "Да о чём ты вообще?! Я же всё время говорю, что у меня к тебе всего одна простая просьба!"
10026010-114 = "Я просто хочу, чтобы ты перестала распускать слухи и обращаться с нами как с преступниками!"
10026010-115 = ""
10026010-117 = "Хи-хи..."
10026010-118 = "Вы все такие забавные, знаете?"
10026010-119 = "Сакурако... Уи..."
10026010-120 = "...?!"
10026010-121 = "Хм?! К-Кто здесь?"
10026010-122 = "Как вы сюда попали?"
10026010-123 = ""
10026010-125 = ""
10026010-128 = ""
10026010-129 = "Та-дам! Я никто... просто обычная гражданка, проходившая мимо."
10026010-131 = "*вздыхает* Подождите. Вы же..."
10026010-132 = "...Сирена в Купальнике, Урава Ханако! Почему вы вообще всегда в купальнике?!"
10026010-133 = "Да кому есть дело до купальника?! Как ты нашла тайный вход, о котором даже я не знала?"
10026010-134 = "Потому что у любого такого места есть тайный вход, если достаточно хорошо поискать."
10026010-135 = ""
10026010-137 = ""
10026010-138 = "В-Вы двое знакомы?! Так вот оно что!"
10026010-139 = "Сотрудничество с такой сумасшедшей как раз и доказывает, что Сестринство замышляет что-то недоброе!"
10026010-140 = "Уи, нет! Это одно большое недоразумение! Она тут вообще ни при чём!"
10026010-141 = "Как вы можете говорить это с таким серьёзным лицом и ожидать, что я поверю?!"
10026010-142 = "Потому что это правда! Пожалуйста—"
10026010-143 = "Отпустите Хинату! Вы злая, руководите злой организацией, и я не доверяю вам ни капли!"
10026010-144 = "Я же сказала, что Хината в безопасности! Почему ты меня не слушаешь?!"
10026010-145 = "Э-Эм..."
10026010-147 = "Х-Хината?! Ты в порядке?"
10026010-148 = "П-Прости... Я не хотела з-заставлять тебя волноваться..."
10026010-149 = "Хината, что...?"
10026010-151 = "Хи-хи. Ну вы двое даёте."
10026010-152 = "Если позволите высказать мнение объективному стороннему наблюдателю, ну, обычной гражданке..."
10026010-153 = "Обычной?! Никто из обычных людей не гуляет посреди ночи в купальнике."
10026010-154 = "Здесь Уи явно виновата. Копировать то писание без разрешения — как минимум нарушение этических норм..."
10026010-155 = "Ургх!!"
10026010-156 = "А что касается теорий заговора Уи... Сестринство и правда не особо производит впечатление невинной организации."
10026010-157 = "Просто оглянитесь. Это место подозрительнее недельного бутерброда с тунцом."
10026010-158 = "Да и манера речи Сакурако оставляет слишком много пространства для неверного толкования."
10026010-159 = "Уи явно до смерти напугана, а Хината так переживала, что попросила меня вмешаться."
10026010-160 = "Если здесь кто-то и выглядит подозрительно, так это ты, Ханако!"
10026010-161 = "И я вовсе не собиралась никого пугать!"
10026010-162 = "Я лишь хотела обсудить вопрос в уединённом месте, подальше от любопытных глаз."
10026010-163 = "Ты только подтверждаешь мои слова."
10026010-164 = "А теперь, если вы готовы выслушать совет обычной гражданки, у меня есть предложение."
10026010-165 = "Когда Хината попала в беду, Уи без раздумий ей помогла. Она помогла и МНЕ, когда я разыскала её посреди ночи."
10026010-166 = "И кто забудет тот случай, когда она помогла ТЕБЕ, не дав случайно прочитать Камасутру у всех на глазах?"
10026010-167 = "Кама-что?!"
10026010-168 = "Она права. Если бы я только не повредила писание—"
10026010-169 = "Я к тому, что каждая из нас по той или иной причине в долгу перед Уи."
10026010-170 = "Я предлагаю Сестринству дать ей второй шанс."
10026010-171 = "Второй шанс...?"
10026010-172 = "Да. Забудьте всю эту историю с писанием и позвольте Уи в качестве компенсации применить свои ценные навыки, чтобы помочь Сестринству."
10026010-173 = "Ну как? Обе стороны получат желаемое. Всё хорошо, что хорошо кончается, правда?"
10026010-174 = "Ценные навыки...? Для Сестринства...?"
10026010-175 = "Я бы никогда не обратилась с такой просьбой!"
10026010-176 = "Хи-хи... Сакурако, мы обе знаем, что у Сестринства полно проблем, с которыми Уи могла бы помочь. ♡"
10026010-177 = "Вообще-то, кажется, я слышала, как ты что-то бормотала о руинах..."
10026010-178 = "Руинах...?"
10026010-179 = "Руинах...?"
10026010-180 = "К-Как ты—"
10026010-181 = "Хи-хи... Похоже, мы договорились. ♡"
10026010-182 = "Мы решим вашу маленькую проблему, а вы простите Уи."
10026010-183 = "А дальше..."
10026010-185 = "...этим займусь я. ♡"
10026010-189 = ""
10026010-191 = ""
10026010-193 = ""
10026010-195 = ""
10026010-197 = ""
10026010-199 = "Мы готовы, Сенсей! Нажимайте!"
10026010-200 = "[ns] Нажмите кнопку затвора."
10026010-204 = ""
10026010-205 = ""
10026010-206 = "...??"
