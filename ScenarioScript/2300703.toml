[translation]
2300703-1 = "Необыкновенная девушка"
2300703-2 = "По дороге к месту, о котором сказала Ханако, я увидел плотно запертую кладовую спортзала."
2300703-3 = "Понятия не имею, как она вообще умудрилась застрять в таком месте..."
2300703-4 = "(...?)"
2300703-5 = "Погодите, дверь была не заперта?"
2300703-6 = "[s] Открыть дверь."
2300703-8 = "*клац* *скрип*"
2300703-10 = "Кладовая спортзала"
2300703-11 = "...?"
2300703-12 = "О, вот и ты. Сюда, Сенсей."
2300703-13 = "[s] «...Ханако?»"
2300703-15 = ""
2300703-16 = "Здравствуй, Сенсей. Какое совпадение, что мы встретились вот так!"
2300703-17 = "[s] «...»"
2300703-19 = "[s] «...?»"
2300703-20 = "Благодаря тебе теперь я могу безопасно выбраться."
2300703-21 = "[s] «...???»"
2300703-23 = "[s] «...?!?!»"
2300703-24 = "Хи-хи. Что это за лицо? Глаза чуть из орбит не вылезли."
2300703-25 = "Ты выглядишь потрясённым... и весь напрягся!"
2300703-26 = "...Хи-хи."
2300703-27 = "Интересно, о чём ты сейчас думаешь..."
2300703-28 = "[s1] «Ч-Что с купальником?»\n[s2] «Почему ты в этом...»"
2300703-29 = "...А?"
2300703-30 = "...А?"
2300703-31 = "Почему? Тебя что-то не устраивает?"
2300703-32 = "Разве это не школьный спортзал Тринити?"
2300703-33 = "А то, что на мне..."
2300703-34 = "Администрация считает это «спортивной одеждой». Я не права?"
2300703-35 = "Я просто зашла сюда кое-что забрать, а дверь захлопнулась за мной."
2300703-36 = "Не знаю, о чём ты думаешь, но... надеюсь, не о том, о чём думаю я."
2300703-37 = "Хм... Нет?"
2300703-38 = "Хи-хи... Или всё-таки да?"
2300703-39 = "Похоже, я никогда не узнаю."
2300703-40 = "Хотя могу узнать, если просто спрошу тебя."
2300703-41 = "Так скажешь, о чём ты сейчас думал?"
2300703-42 = "[s] «...Немедленно переоденься обратно в форму.»"
2300703-43 = "Ох. Правда? Ты заставляешь меня переодеваться? Прямо здесь?"
2300703-44 = "Сенсей... Не думала, что ты такой. Ты куда смелее, чем я считала."
2300703-45 = "Не уверена, что мне комфортно, когда ты наблюдаешь за мной в таком тёмном месте..."
2300703-46 = "Но если выбирать мне..."
2300703-47 = "Ну а теперь..."
2300703-48 = "[s3] Быстро попытаться выйти из кладовой.\n[s4] «Пожалуйста, не шути так...»"
2300703-49 = "Хи-хи. Хорошо. Прости. Тебя просто слишком весело дразнить."
2300703-50 = "Хи-хи. Хорошо. Прости. Тебя просто слишком весело дразнить."
2300703-51 = "Я прекращу. А теперь можешь отвернуться на минутку, пока я переоденусь?"
2300703-52 = "[s5] Отвернуться и ждать.\n[s6] Отвернуться, закрыть глаза и ждать."
2300703-53 = ""
2300703-55 = ""
2300703-57 = "Ла-ла-ла... Ла-ла-ла..."
2300703-58 = "М-м... Он теснее, чем я думала. Не могу снять. Поможешь мне, Сенсей?"
2300703-59 = "[s7] (Не отвечать.)"
2300703-60 = "Хи-хи... Ладно. Я почти закончила."
2300703-62 = "Готово. Можешь поворачиваться."
2300703-63 = "...Сенсей?"
2300703-65 = ""
2300703-66 = "Видишь? Я полностью оделась!"
2300703-68 = "Ла-ла-ла... Ла-ла-ла..."
2300703-69 = "М-м... Он теснее, чем я думала. Не могу снять. Поможешь мне, Сенсей?"
2300703-70 = "[s8] (Не отвечать.)"
2300703-71 = "Хи-хи... Ладно. Я почти закончила."
2300703-73 = "Готово. Можешь поворачиваться."
2300703-74 = "...Сенсей?"
2300703-76 = "Видишь? Я полностью оделась!"
2300703-77 = "Хи-хи. Сегодня с тобой было довольно весело. Пойдём?"
2300703-78 = "[s9] «Это опять шутка?»\n[s10] «Не стоит так меня дразнить.»"
2300703-79 = "Ладно, ладно. Прости, Сенсей. Но я не врала, когда сказала, что ты мне помог."
2300703-80 = "Ладно, ладно. Прости, Сенсей. Но я не врала, когда сказала, что ты мне помог."
2300703-81 = "Ты можешь этого не осознавать, но..."
2300703-82 = "...такие развлечения для меня важны."
2300703-83 = "...Что?"
2300703-84 = "Что я имею в виду?"
2300703-85 = "Хи-хи. Это секрет. А леди не раскрывают своих секретов."
2300703-86 = "Ну а теперь..."
2300703-87 = "А?"
2300703-88 = "*уууууууу*"
2300703-89 = ""
2300703-90 = "Эй, вы двое! Что вы там делаете? Сюда нельзя!"
2300703-91 = "Спортзалом можно пользоваться только во время занятий или с разрешения студсовета!"
2300703-92 = "И ты там!"
2300703-93 = "Эм... Что это у тебя в руке?"
2300703-94 = "...А? О, это?"
2300703-95 = "Хи-хи. Именно. Это..."
2300703-96 = "Совершенно новый купальник, который я только что сняла."
2300703-97 = "..."
2300703-98 = "...?"
2300703-100 = "[s] «...?»"
2300703-101 = ""
2300703-103 = "...!!!"
2300703-105 = "(Я рванул оттуда со всех ног.)"
2300703-106 = "(На то, чтобы разобраться с недоразумением, ушло немало времени.)"
