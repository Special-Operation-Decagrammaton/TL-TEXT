[translation]
2003203-1 = "Мода, готовая к полевым условиям"
2003203-2 = ""
2003203-3 = "Сенсей. Я здесь."
2003203-4 = "Готовы отправиться за самыми свежими модными новинками?"
2003203-5 = "[s] «Купальники — это одежда... Да...»"
2003203-7 = "Магазин купальников"
2003203-8 = ""
2003203-9 = ""
2003203-10 = ""
2003203-11 = ""
2003203-12 = "Эм."
2003203-13 = "Не могу выбрать. Сенсей, я примерю несколько, а вы скажете, какой самый модный."
2003203-14 = ""
2003203-16 = ""
2003203-17 = ""
2003203-18 = "Что? В этот раз не переодеваться снаружи примерочной?"
2003203-19 = "Но там слишком тесно."
2003203-20 = "С точки зрения эффективности разумнее всего примерять одежду прямо у стойки. Тогда не придётся ходить туда-сюда между ней и примерочной."
2003203-21 = "[s1] «Ни в коем случае!!»\n[s2] «Если захочешь другой вариант, я сам тебе его принесу!»"
2003203-25 = "После того как мне удалось не дать Эйми шокировать сотрудников и посетителей, мы наконец по-настоящему занялись выбором купальника."
2003203-26 = ""
2003203-29 = "Сенсей, сосредоточьтесь. Мне нужно ваше мнение как стилиста."
2003203-30 = "Как выглядит этот?"
2003203-32 = "А этот? ...Я в нём простужусь?"
2003203-33 = "Какое это имеет отношение к моде? Хотя, может, этот выглядит лучше."
2003203-34 = "Хм? Чем меньше показываешь, тем больше эффект?"
2003203-36 = "Странно, я не помню, чтобы выбирала этот."
2003203-37 = "Коровий принт? С чего вообще это считается высокой модой?"
2003203-39 = "Наконец, примерив множество купальников..."
2003203-40 = "Мы выбрали победителя и закончили покупки."
2003203-41 = ""
2003203-42 = "Спасибо, что выбрали такой стильный купальник, Сенсей."
2003203-43 = "Теперь я буду самым модно одетым ныряльщиком в Ледяном море."
2003203-44 = "Я буду одновременно модной и готовой к следующей крупной операции."
2003203-45 = ""
2003203-48 = "[ns3] «Операции? Ледяное море?!»\n[ns4] «Эйми, нельзя плавать в ледяной воде в одном купальнике!»"
2003203-51 = "Что ты имеешь в виду?"
2003203-52 = "Разве Ледяное море технически всё ещё не море? А купальник разве не одежда, созданная для моря?"
2003203-53 = "[s] «Вот как?»"
2003203-54 = "Именно, Сенсей. Вам тоже стоит приготовить подходящий купальник."
2003203-55 = ""
2003203-58 = "[ns] «Чтобы плавать в ледяной воде, нужно куда больше, чем купальник, Эйми!»"
2003203-59 = "Сенсей?"
2003203-60 = "...Ох, вы не можете меня отпустить? Не бойтесь, Сенсей. Я и не собиралась оставлять вас позади."
2003203-61 = "А?"
2003203-63 = "Почему мы идём в магазин спортивных товаров?"
2003203-64 = "[s5] «Я сейчас вернусь.»\n[s6] Купить Эйми настоящую зимнюю одежду."
2003203-67 = ""
2003203-72 = "Сенсей... Мне жарко..."
2003203-73 = "Куртка, шарф, эта толстая шапка и перчатки. Мне правда нужно всё это носить?"
2003203-74 = "Это вроде мило... но мне не станет слишком жарко во всём этом?"
2003203-75 = "[s7] «Ты что такое говоришь? Нужно быть готовой к минусовой температуре!»\n[s8] «Без этого снаряжения никак!»"
2003203-78 = "Эм..."
2003203-79 = "Просто примерить и проверить размер? Хорошо..."
2003203-80 = ""
2003203-83 = "Ладно. Переоденусь в примерочной."
2003203-85 = "Сенсей, я закончила переодеваться. Тогда отправляюсь."
2003203-86 = ""
2003203-87 = ""
2003203-88 = ""
2003203-89 = ""
2003203-90 = ""
2003203-93 = "[ns] «Эйми. Тебе не кажется, что чего-то не хватает?»"
2003203-94 = "О. Точно. Если надеть одежду поверх купальника, это уже будет не купальник, Сенсей."
2003203-95 = "[s9] «Что это вообще за логика?!»\n[s10] «Я сдаюсь...»"
2003203-98 = "Хех."
2003203-99 = "Спасибо, что купили мне одежду, Сенсей."
2003203-101 = "После покупок мы с Эйми немного поболтали в кафе, а затем я вернулся в Шале."
