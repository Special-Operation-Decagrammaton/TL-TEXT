[translation]
2300006-1 = "Маленькое свидание"
2300006-2 = "Исполнительный офис Шале"
2300006-4 = "На моём столе лежала гора бумаг, которые я всё откладывал."
2300006-5 = "Надо бы наконец за них взяться..."
2300006-6 = "*дзынь*"
2300006-7 = "[ns] «Кто там?»"
2300006-11 = "[ns] «Нет. Пока нужно сосредоточиться на работе»."
2300006-15 = "Пришло ещё несколько уведомлений MomoTalk, но я изо всех сил старался их игнорировать и работать."
2300006-17 = "На следующий день..."
2300006-18 = "К обеду я наконец закончил разбирать документы."
2300006-22 = "Я думал вздремнуть, но выпил слишком много кофе."
2300006-23 = "Немного подумав, я решил выйти на короткую прогулку."
2300006-26 = "Гуляя по тропинке возле «Шале», я заметил знакомое лицо."
2300006-27 = ""
2300006-28 = "[s] «Айри?»"
2300006-29 = "Сенсей?"
2300006-30 = "О, Сенсей! Давно не виделись!"
2300006-31 = "Куда вы направляетесь?"
2300006-32 = "А, просто гуляете?"
2300006-33 = "Значит, вы наконец свободны?"
2300006-34 = "Ура! Я скучала по вам, Сенсей! Хи-хи."
2300006-35 = "[s1] «Как ты?»\n[s2] «Прости, если заставил волноваться.»"
2300006-36 = "Это так на вас похоже, Сенсей."
2300006-37 = "У меня всё отлично, как обычно."
2300006-38 = "О-ой, нет. Не переживайте."
2300006-39 = "Наверное, я просто очень обрадовалась снова вас увидеть."
2300006-40 = "Я знаю, насколько вы были заняты, так что надеюсь, с вами всё хорошо."
2300006-41 = "Я сама была по уши в подготовке к экзаменам, поэтому даже не могла зайти к вам."
2300006-42 = "А? Тогда что я здесь делаю?"
2300006-43 = "Как я сказала, я БЫЛА занята. Теперь всё закончено."
2300006-44 = "Наконец могу прогуляться, как давно хотела."
2300006-45 = "..."
2300006-46 = "Если бы я знала, что встречу вас..."
2300006-47 = "А?"
2300006-48 = "О, нет. Просто я совсем не ожидала увидеть вас сегодня."
2300006-49 = "Поэтому я не приготовила никаких десертов..."
2300006-50 = "И поблизости даже нет кафе..."
2300006-51 = "Я говорю Айри, что всё нормально, но она всё равно выглядит обеспокоенной."
2300006-52 = "[s] «А? Вон там разве не фургон с мороженым?»"
2300006-53 = "Что? Фургон с мороженым?"
2300006-54 = "Ого, давно таких не видела."
2300006-55 = "Когда я была маленькой, постоянно покупала у них мороженое."
2300006-56 = "А? Сенсей?"
2300006-57 = ""
2300006-58 = ""
2300006-59 = "Ч-Что...?"
2300006-63 = "Я беру Айри за руку, и мы идём к фургону с мороженым."
2300006-64 = "Вот ваше мороженое."
2300006-66 = "Мы с Айри решили сделать перерыв у дорожки вдоль реки и съесть мороженое."
2300006-69 = "― Ой. Спасибо за угощение, Сенсей.[wa:6920]"
2300006-70 = "― Оно такое... сладкое![wa:280]"
2300006-73 = "― Я так давно не ела мороженое не из кафе.[wa:7260]"
2300006-74 = "― А вместе с вами оно ещё вкуснее.[wa:4080]"
2300006-77 = "[ns3] «Прости, что это такая мелочь, Айри.»\n[ns4] «Хотелось подарить тебе что-нибудь получше.»"
2300006-80 = "― Н-нет, правда, всё хорошо.[wa:4800]"
2300006-81 = "― Я бы даже сказала, так веселее![wa:1120]"
2300006-84 = "― Мне так хорошо, потому что...[wa:6780]"
2300006-85 = "― Ну, понимаете. Здесь только мы вдвоём...[wa:5160]"
2300006-87 = "― Сердце будто сейчас выпрыгнет из груди.[wa:5260]"
2300006-89 = "― Я-я ничего не сказала![wa:4560]"
2300006-90 = "― Вы ничего не слышали![wa:3420]"
2300006-92 = "― Ха-ха, ха-ха-ха...[wa:840]"
2300006-95 = "― Спасибо, Сенсей.[wa:6020]"
2300006-96 = "― Думаю, благодаря вам сегодняшний день будет хорошим.[wa:3060]"
2300006-99 = "Мы с Айри продолжили приятную беседу на дорожке у реки и проговорили до самого заката."
