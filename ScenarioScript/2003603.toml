[translation]
2003603-1 = "Принцесса на лодке"
2003603-4 = ""
2003603-5 = ""
2003603-6 = ""
2003603-7 = "...А, Сенсей. Сюда."
2003603-8 = "Пока вы шли, у меня было немного времени, так что я кое-что подготовила."
2003603-9 = "Посмотрите туда."
2003603-10 = "[s1] «...Банан?!»\n[s2] «Ого, вот это ты подготовилась!»"
2003603-13 = "Да ладно вам, ничего особенного!"
2003603-14 = "Кроме того, я знаю, что где-то внутри вас..."
2003603-15 = "...где-то внутри этого большого и ответственного взрослого прячется ребёнок, который любит новые игрушки."
2003603-16 = "...А?"
2003603-17 = "...Погодите, вы думаете, я хочу сделать это только ради себя?"
2003603-18 = "Ч-Что вы такое говорите? Конечно нет! Я просто..."
2003603-19 = "Ну, просто... то есть..."
2003603-20 = ""
2003603-22 = ""
2003603-23 = "А, да, я хочу его проверить! Это инспекция!"
2003603-24 = "Снаружи всё может выглядеть нормально, но вдруг он с дефектом."
2003603-25 = "Давайте сразу проверим. Нужно убедиться, что он нормально держится на воде и никаких проблем нет!"
2003603-26 = "Это НЕ развлечение! Я позвала вас не для этого!"
2003603-27 = "...А?"
2003603-28 = "Вы хотите, чтобы я села на него...? И будете тянуть меня, Сенсей?"
2003603-29 = "П-Прямо сейчас, вот так сразу...?"
2003603-30 = "[s3] «Ну, буксировщика у нас нет, так что...»\n[s4] «Это всего лишь проверка. Останемся на мелководье.»"
2003603-33 = "Я-я… Ну… Видишь ли…"
2003603-34 = ""
2003603-36 = ""
2003603-37 = ""
2003603-38 = "Ладно. Всё равно тут вода только по пояс... Думаю, всё будет нормально."
2003603-39 = "Хорошо... И-и раз!"
2003603-40 = ""
2003603-42 = ""
2003603-43 = ""
2003603-44 = "Ого, он очень неустойчивый. Так и должно быть...?"
2003603-45 = "Сенсей?"
2003603-46 = "Эй, это же ПРОСТО проверка. Не тяните слишком быстро!"
2003603-47 = ""
2003603-51 = "[ns5] «Поехали.»\n[ns6] Начать тянуть банан."
2003603-55 = "Погодите, погодите...! Сенсей...?! Помедленнее!"
2003603-56 = "Я ещё не готова...!!"
2003603-57 = "Ииик...!!"
2003603-58 = "А-а-а...!"
2003603-59 = ""
2003603-61 = ""
2003603-64 = "После этого я ещё некоторое время катал Серику вдоль побережья."
2003603-65 = "Лодку безумно раскачивало, но, похоже, проверку Серики она прошла."
2003603-68 = "― [log=세리카 수영복]Думаю, этого достаточно.[/log][wa:330]"
2003603-69 = "― [log=세리카 수영복]Дайте я только слезу с этой штуки...[/log][wa:980]"
2003603-72 = "― [log=세리카 수영복]Не то чтобы я хотела[/log]"
2003603-73 = "― [log=세리카 수영복]прекратить или что-то такое, но...[/log][wa:1130]"
2003603-76 = "― [log=세리카 수영복]П-Подождите!![/log][wa:260]"
2003603-77 = "― [log=세리카 수영복]Что вы делаете, Сенсей?! Вы её раскачиваете![/log][wa:950]"
2003603-80 = "― [log=세리카 수영복]О-Она же перевернётся![/log][wa:210]"
2003603-81 = "― [log=세리카 수영복]Прекратите![/log][wa:940]"
2003603-84 = "― [log=세리카 수영복]Что значит, «так будет веселее»?! [/log][wa:1340]"
2003603-85 = "― [log=세리카 수영복]Сенсей, хватит надо мной издеваться![/log][wa:3100]"
2003603-88 = "― [log=세리카 수영복]...А... Неважно.[/log][wa:970]"
2003603-89 = "― [log=세리카 수영복]Это так на вас похоже.[/log][wa:720]"
2003603-92 = "― [log=세리카 수영복]Надо было ожидать...[/log][wa:1130]"
2003603-95 = "[ns7] «Хм? Серика?»\n[ns8] «Ты как-то иначе заговорила...»"
2003603-99 = "― [log=세리카 수영복]Да ничего.[/log][wa:620]"
2003603-100 = "― [log=세리카 수영복]Просто мне пришла в голову одна идея...[/log][wa:1755]"
2003603-103 = "― [log=세리카 수영복]Ладно, Сенсей! Теперь ваша очередь![/log][wa:505]"
2003603-104 = "― [log=세리카 수영복]Ваша очередь, Сенсей! Забирайтесь! [/log][wa:1320]"
2003603-109 = "[ns9] «С-Серика...?»\n[ns10] «Думаю, мы уже достаточно всё проверили...»"
2003603-112 = ""
2003603-113 = "О, нет уж. Даже не надейтесь."
2003603-114 = "Теперь я поняла. Тянуть эту штуку гораздо веселее, чем кататься на ней!"
2003603-115 = "ВЫ катали МЕНЯ. Теперь моя очередь!"
2003603-116 = ""
2003603-119 = "...Хм?"
2003603-120 = "Постойте...! Сенсей! Вернитесь!"
2003603-121 = "Стойте! А ну стойте! Уф, эти взрослые!"
2003603-122 = "Погодите, я не могу бросить лодку, но и догнать вас, пока тащу её, не могу..."
2003603-123 = ""
2003603-125 = ""
2003603-126 = "Вы... А-а-а!!"
