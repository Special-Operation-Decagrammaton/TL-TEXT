[translation]
1013708-1 = "Время заботы о себе детектива"
1013708-2 = "Коно́ка простудилась, поэтому я отправился её навестить."
1013708-3 = ""
1013708-6 = "[ns] «Есть кто-нибудь?»"
1013708-7 = "У-Ух... Я чуть не уснула... *вздох*"
1013708-8 = "Я уже говорила, У МЕНЯ НЕТ ТЕЛЕВИЗОРА!!"
1013708-9 = "Я разбила его, когда мы проиграли тот бейсбольный матч..."
1013708-10 = "Я *кашель* говорила, что тоже тебя арестую, *кашель* если ещё раз увижу твою рожу!"
1013708-11 = "[s1] «К-Конока, успокойся!»\n[s2] «Это я!»"
1013708-14 = "Э-Э?!"
1013708-15 = "Какого—?! Это Сенсей?! Входите! Дверь открыта!"
1013708-19 = "[ns] «Ты двери не запираешь?!»"
1013708-20 = "*кашель* Если вор откроет дверь, его поймают с поличным, разве нет?"
1013708-21 = "Будто я приманиваю преступников для ареста? Ну да, примерно."
1013708-22 = "[s] «Люди воруют даже из общежитий Валькирии?»"
1013708-23 = "Воры так не думают. Они просто хотят взять то, что им нужно."
1013708-24 = "Но важнее другое, зачем вы— *кашель*"
1013708-25 = "[s] «Я услышал, что ты простудилась, и пришёл навестить!»"
1013708-26 = "Откуда вы узнали?! За мной кто-то следил?!"
1013708-27 = "[s3] «Ты сама написала мне в MomoTalk...»\n[s4] «Сказала, что простудилась из-за дождя...»"
1013708-30 = "*кашель* Э-Э...?"
1013708-31 = ""
1013708-32 = "О. *кашель* Наверное, из-за температуры я немного бредила."
1013708-33 = "Думала, что пишу своей команде, а оказалось, вам."
1013708-34 = "А теперь вы ещё и пришли меня навестить... Хм. Даже не знаю, что сказать."
1013708-35 = "[s] «Ты сказала, что болеешь, конечно я пришёл!»"
1013708-36 = "Ау-у-у, спасибо. Но мне сейчас... правда очень плохо..."
1013708-37 = "Меня ещё никто никогда не навещал, когда я болела. И что теперь делать?"
1013708-38 = "[s5] «Для начала поедим!»\n[s6] «Хочешь кашу?»"
1013708-41 = "Кашу, говорите...? Если подумать, я ведь только спала."
1013708-42 = "Тогда... *кашель* мне тонкоцу, побольше чеснока, без овощей, много масла и чуть-чуть острое."
1013708-43 = "[s] «Это не раменная!»"
1013708-44 = "А?"
1013708-46 = ""
1013708-47 = "Фух, спасибо за еду."
1013708-48 = "Было приятно и мягко, будто рамен без лапши. Правда, чеснока можно было и побольше!"
1013708-49 = "[s] «Главное, чтобы пациент был доволен...!»"
1013708-50 = "Хаха. *кашель* Вы называете меня пациентом? Слишком мягкий подход."
1013708-51 = "Да это просто насморк! Пару подтягиваний — и я всё выпотею!"
1013708-52 = ""
1013708-54 = ""
1013708-55 = ""
1013708-56 = "[ns] Положить руку Коно́ке на лоб."
1013708-58 = "!!!"
1013708-59 = "Эм..."
1013708-60 = ""
1013708-62 = ""
1013708-63 = "*кашляет*"
1013708-64 = "...А...?"
1013708-65 = "[s] «Пойдём ляжем и немного отдохнём!»"
1013708-66 = "Ах..."
1013708-67 = "Ага..."
1013708-70 = ""
1013708-71 = "[ns] «Как себя чувствуешь?»"
1013708-72 = "А, эм...!"
1013708-73 = "Э-Эм... Теперь, когда легла, чувствую себя немного... больной."
1013708-74 = "*кашель* *кашель* Ай."
1013708-75 = "[s] «Я останусь, пока ты не уснёшь.»"
1013708-76 = "П-Правда..."
1013708-77 = "А, тогда... Пожалуйста, заперите дверь."
1013708-78 = "Потому что я болею и не смогу вас защитить... если кто-нибудь войдёт."
1013708-79 = "[s] «Конечно! Хочешь, прочитаю тебе сегодняшний гороскоп?»"
1013708-80 = "Э-Эм, не нужно."
1013708-81 = "Сегодня и так обязан быть лучшим днём на свете. Даже сомнений нет, что звезда дня — я."
1013708-83 = "Я некоторое время посидел с Коно́кой, пока она наконец не уснула."
