[translation]
1008102-1 = "Я всё пробую впервые!"
1008102-4 = ""
1008102-5 = "Не бойся, Сенсей! Я, Юкари, прибыла!"
1008102-6 = "[s] Привет, Юкари. Ты пришла раньше, чем я ожидал."
1008102-7 = "Да! Благодаря тебе, Сенсей. Ты предложил нам всем немного «перевести дух»."
1008102-8 = "Я, Юкари, пожелала узнать больше об этой задаче, которую ты нам поручил."
1008102-9 = "И вот я здесь!"
1008102-10 = "[s] Вот это энтузиазм Юкари!"
1008102-11 = "Разумеется! Энтузиазм — лишь одно из множества моих достоинств!"
1008102-12 = "Итак... где нам найти этот «перевод духа», Сенсей?"
1008102-13 = "Я, Юкари, непременно его заполучу!"
1008102-14 = "[s1] Кажется, ты немного не так поняла, но настрой мне нравится.\n[s2] Понятно..."
1008102-15 = ""
1008102-16 = ""
1008102-19 = "[ns] Может, переведём дух вместе?"
1008102-20 = "Конечно! Я пойду подготовлю припасы для нашей миссии!"
1008102-21 = ""
1008102-24 = "Хи-хи."
1008102-30 = ""
1008102-31 = "Хи-хи-хи."
1008102-34 = ""
1008102-35 = "Хэ?"
1008102-36 = "[s] Ты выглядишь растерянной, Юкари."
1008102-37 = ""
1008102-39 = ""
1008102-40 = "Эм, Сенсей... а что значит «перевести дух»?"
1008102-41 = ""
1008102-44 = "[ns] «А?»"
1008102-45 = "?"
1008102-46 = ""
1008102-47 = "А-а! Наверное, я выгляжу полной дурочкой!"
1008102-48 = "Я думала, «перевести дух» — это жаргонное название какой-то секретной миссии!"
1008102-49 = "[s] Нет... Это просто означает немного отдохнуть."
1008102-50 = "Правда? А я была уверена, что здесь скрыт более глубокий смысл."
1008102-51 = "Прости меня, Сенсей! Я доставила тебе неприятности своей самонадеянностью."
1008102-52 = "Простите!"
1008102-53 = "[s3] Тебе не за что извиняться.\n[s4] За такую мысленную гимнастику тебе золотая медаль положена, Юкари."
1008102-56 = "Значит, перевести дух — это отдохнуть..."
1008102-57 = "Но ещё это может означать провести время с другими, чтобы освежить голову."
1008102-58 = "Интересно. Теперь я понимаю мудрость этих слов, Сенсей."
1008102-59 = "Но где мне перевести дух?"
1008102-60 = ""
1008102-63 = "Хм? Это должно быть место, куда я хочу сходить? Или что-то, что давно хотела попробовать?"
1008102-64 = "Дай мне подумать..."
1008102-65 = "Хмммм!"
1008102-66 = "Прости, Сенсей. Ничего не приходит в голову. Само понятие беззаботного досуга для меня совсем новое."
1008102-67 = "[s] Ну тогда. Если ты не знаешь, чем хочешь заняться..."
1008102-68 = "А?"
1008102-71 = "Я отвёл Юкари в игровой зал неподалёку от Шале."
1008102-72 = ""
1008102-75 = ""
1008102-76 = ""
1008102-77 = "Сенсей, что это всё такое?!"
1008102-78 = "[s] Это игровой зал."
1008102-79 = ""
1008102-82 = "[ns] Здесь много всего. Я подумал, что ты наверняка найдёшь что-нибудь весёлое."
1008102-83 = "Игровой зал... Странное название для странного места."
1008102-84 = "Здесь так шумно и ярко."
1008102-85 = "А! Смотри, Сенсей! Люди на экране все кричат и корчатся! Что с ними случилось?"
1008102-86 = "Им нужна медицинская помощь?!"
1008102-87 = "[s] О, я знаю эту игру. Здесь нужно стрелять из оружия по зомби. Хочешь попробовать?"
1008102-88 = "Это одна из тех видеоигр, которые сейчас популярны? Мне просто нужно стрелять в этих существ, чтобы победить, верно?"
1008102-89 = "Ладно! Вперёд!"
1008102-90 = ""
1008102-92 = ""
1008102-93 = ""
1008102-94 = ""
1008102-95 = ""
1008102-96 = ""
1008102-98 = "Ха-ха! Точно в цель! Следующий!"
1008102-99 = "Ещё больные граждане?! Погоди... нет! Это, должно быть, босс! Выглядит грозно!"
1008102-100 = "Как жаль. Я, Юкари, не проиграю!"
1008102-101 = ""
1008102-103 = ""
1008102-104 = ""
1008102-111 = ""
1008102-112 = "Фух! Мы победили!"
1008102-113 = "Какая увлекательная игра!"
1008102-114 = "О."
1008102-115 = "Сенсей, а это что такое?!"
1008102-116 = "[s] Это называется автомат-хватайка."
1008102-117 = "То есть ты становишься пилотом НЛО и похищаешь невинных плюшевых существ?"
1008102-118 = "Как загадочно!"
1008102-119 = "О-о, давай теперь попробуем вот это!"
1008102-125 = "Мы с Юкари провели весь день, играя во множество разных игр."
1008102-126 = ""
1008102-127 = "Фух! Эта игра тоже была весёлой!"
1008102-128 = "И стрелялка, и та игра, где нужно было двигаться вправо и побеждать врагов, и та, где надо было наступать в такт музыке... Мне даже гонка на мотоциклах понравилась!"
1008102-129 = "Кто бы мог подумать, что существует столько разных чудесных игр!"
1008102-130 = "[s] Тебе понравилось?"
1008102-131 = "Конечно!"
1008102-132 = "Обычно мне не удаётся вот так развлекаться. Большую часть свободного времени я провожу дома или с Хяккарёран."
1008102-133 = "Значит, вот что ты имел в виду под «перевести дух»."
1008102-134 = "Я, Юкари, получила огромное удовольствие!"
1008102-135 = "[s] Я рад, что тебе удалось немного расслабиться."
1008102-136 = "И мне!"
1008102-137 = "К-Конечно! Я смогла расслабиться только потому, что..."
1008102-138 = "Дело было не только в играх, Сенсей. Ещё..."
1008102-139 = "[s] «Хм?»"
1008102-140 = "Ой, ничего!"
1008102-141 = "Хватит болтать! Переходим к следующей игре!"
1008102-143 = "Остаток дня мы с Юкари провели за разными играми."
