[translation]
51250-1 = "Episódio 25;Agora, Para Você"
51250-13 = "Urgh...!"
51250-14 = "...Ela fugiu."
51250-15 = "O que foi aquilo agora há pouco...?#nEla rasgou o livro e, do nada...!"
51250-17 = "Com um estrondo daqueles, eu levei um susto terrível...!"
51250-18 = "[s] \"Talvez aquilo também fosse uma das Hyakumonogatari...\""
51250-19 = "Hmm... Parece que não vai dar para ir atrás dela."
51250-20 = "Qual é a daquela maluca sem noção?!#nAliás, quem diabos é esse Clube Beleza da Natureza?!"
51250-21 = "[s1] \"Por enquanto, vamos cuidar dos ferimentos!\"\n[s2] \"Vocês estão bem? Alguém se machucou?\""
51250-26 = "Ah, por aqui tá tudo certo. E você, Yukari?"
51250-27 = "Eu também estou perfeitamente bem!"
51250-28 = "[s] \"E a Kikyou e a Nagusa...\""
51250-34 = "..."
51250-35 = "..."
51250-37 = "Er..."
51250-43 = "Nagusa-senpai... sobre o que você disse agora há pouco..."
51250-47 = "...Sim."
51250-51 = "...Não, deixa pra lá."
51250-52 = "...Entendi."
51250-57 = "..."
51250-58 = "[s] \"...\""
51250-62 = "(Sussurrando) Sensei, meio estranho eu dizer isso, mas..."
51250-63 = "(Sussurrando) Aquelas duas... não estão com um climão pesado demais?"
51250-64 = "[s] \"(Sussurrando) Você vai mesmo dizer isso?!\""
51250-65 = "M-Mas, olha só...!"
51250-66 = "A gente meio que derrotou a culpada... quer dizer, não derrotou, mas ela fugiu!"
51250-67 = "Mesmo que não seja bem um 'final feliz!', já não devia estar na hora de irmos embora...?"
51250-68 = "A gente não pode ficar aqui pra sempre... Sensei, dá um jeito nisso aí, vai?"
51250-69 = "[s] \"Hmm, mesmo que você peça isso...\""
51250-75 = "Aham."
51250-76 = "Nagusa-senpai, Kikyou-senpai, Renge-senpai.#nE... Sensei."
51250-82 = "[ns] \"Yukari?\""
51250-87 = "Ao longo deste dia, aconteceram de fato incontáveis eventos."
51250-88 = "Por conta disso, acabei causando transtornos a muitas pessoas... e foi graças à ajuda de todos que consegui chegar até aqui."
51250-89 = "Considero-me verdadeiramente afortunada por poder ficar frente a frente com todos vocês assim."
51250-90 = "De todo o coração... muito obrigada."
51250-95 = "Não... na verdade..."
51250-96 = "Somos nós que devíamos agradecer a você, Yukari, por não ter desistido até o fim..."
51250-97 = "Yukari... eu é que... devo agradecer..."
51250-98 = "[s] \"Foi resultado do esforço de todas vocês.\""
51250-103 = "Sim! Além disso, já que conseguimos nos reunir novamente assim..."
51250-104 = "Há algo que eu gostaria de declarar à Nagusa-senpai diante de todos vocês!"
51250-112 = "Eu, Yukari Kadenokouji, desafio a Nagusa-senpai para um Torneio de Sucessão!!"
51250-116 = "[ns] \"...Hã?\""
51250-121 = "Quê, agora...?!"
51250-122 = "Sim! Pois trata-se de algo muito importante!"
51250-123 = "Renge-senpai e Kikyou-senpai se lembram, não é?#nAfinal de contas, o motivo original pelo qual vim até aqui foi justamente para desafiar a Nagusa-senpai para o Torneio de Sucessão!"
51250-124 = "Bem, isso é verdade, mas..."
51250-125 = "[s] \"Mas fazer um Torneio de Sucessão agora, a Nagusa também...\""
51250-131 = "Certo, tudo bem."
51250-133 = "Sério mesmo?!"
51250-134 = "...Senpai?"
51250-136 = "Se esse era o objetivo original, temos que fazer direito, né?"
51250-140 = "Como Presidente Interina do Comitê de Mediação de Conflitos Hyakkaryouran, Nagusa Goryou..."
51250-141 = "Aceito o desafio de Yukari Kadenokouji."
51250-145 = "...Sim!"
51250-155 = "[ns] \"Então... comecem!\""
51250-172 = "Kyaaaah?!"
51250-177 = "[ns] \"Ah, er... Vencedora, Nagusa Goryou!\""
51250-179 = "Uau, acabou num piscar de olhos!"
51250-180 = "Eu já imaginava, mas... a oponente era a Nagusa-senpai,#n...então, bem, era o resultado esperado."
51250-185 = "Será que eu... não li o clima direito...?"
51250-186 = "[s3] \"Não, o mundo das disputas é rigoroso mesmo.\"\n[s4] \"Então não fique tão desanimada, Yukari—\""
51250-194 = "Yukari! De volta à ativa!!"
51250-195 = "[s] \"Você não ficou NEM UM POUCO desanimada, né?!\""
51250-196 = "Desanimada...?"
51250-197 = "Hihi, ora, Sensei."
51250-198 = "Eu enfrentei esta batalha com toda a minha força e fui derrotada."
51250-199 = "Foi, de fato, um duelo perfeito. Não há razão alguma para eu não aceitar este resultado."
51250-200 = "Sim! Foi um resultado mais do que natural!"
51250-201 = "Por meio desta batalha, eu apenas desejava confirmar mais uma vez que a Nagusa-senpai é aquela que eu tanto admiro!!"
51250-202 = "E-Entendi..."
51250-203 = "Sim!!"
51250-206 = "Se você diz, então tudo bem... é, como posso dizer..."
51250-207 = "Isso é bem a cara da Yukari mesmo."
51250-208 = "[s] \"...É verdade.\""
51250-210 = "Ehehe... Pois bem, pessoal! Vamos voltar logo!"
51250-217 = "Para o Hyakkaryouran..."
51250-218 = "Para a nossa casa—!"
51250-229 = "Próximo;Com um Desejo no Coração"
