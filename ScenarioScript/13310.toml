[translation]
13310-1 = "Episódio 31;A Única Verdade (1)"
13310-3 = "(...Meu corpo não se mexe)"
13310-5 = "Fique deitada aí.#nVocê perdeu."
13310-6 = "(Isso é realmente o fim...?)"
13310-13 = "Por quê?"
13310-14 = "Por que você foi se meter nos assuntos de Abydos...?"
13310-15 = "Porque o Sensei me pediu.#nDisse que queria que eu parasse a Hoshino Takanashi."
13310-16 = "...Além disso, eu também tenho ligação com isso."
13310-17 = "..."
13310-18 = "Porque eu preciso destruir até o último resquício do legado da Imperatriz do Trovão."
13310-19 = "A tirana de Gehenna... a Imperatriz do Trovão?"
13310-20 = "O legado que ela deixou já colocou Kivotos em perigo várias vezes."
13310-21 = "...Só não imaginei que existisse algo assim em Abydos também."
13310-22 = "Entendi... então a Chefe do Comitê Disciplinar-chan também está atrás do Canhão Ferroviário."
13310-23 = "Mas aquilo está com a Kaiser—"
13310-24 = "Tudo vai se resolver, contanto que o Sensei esteja lá."
13310-25 = "Até você sabe disso, não sabe?"
13310-27 = "..."
13310-28 = "Não me diga que não sabia!"
13310-29 = "\"Com certeza, tudo vai dar certo.\""
13310-33 = "Tanto o Sensei quanto as garotas de Abydos devem ter dito isso."
13310-34 = "Assim como aconteceu comigo..."
13310-35 = "..."
13310-36 = "Mesmo assim, você não parou... não, você não conseguiu parar."
13310-38 = "Por causa da Yume Kuchinashi."
13310-39 = "..."
13310-40 = "Você quis proteger a vontade dela, não é?#nPresumiu que ela estava tentando recuperar os direitos da ferrovia para destruir o Canhão Ferroviário."
13310-41 = "Mas isso não é verdade."
13310-42 = "Para começo de conversa, ela nem devia saber que isso existia.#nNem eu nem a Makoto, que já rastreávamos o legado da Imperatriz do Trovão desde aquela época, sabíamos."
13310-43 = "..."
13310-44 = "A \"Ferrovia Transdesértica\" era a prova de que o Conselho Estudantil de Abydos e a Nephthys#ntentaram reconstruir o Distrito Autônomo juntos. Ela só queria preservar isso."
13310-45 = "Dizendo que isso também fazia parte de Abydos.#nSem nem se importar se daria lucro ou não."
13310-47 = "E então, no caminho pelo deserto até o banco nos arredores do Distrito Autônomo para pagar o valor restante...#nela sofreu um acidente inesperado."
13310-52 = "O vendedor \"Saint Nephthys\" e o comprador \"Conselho Estudantil de Abydos\"...#nnegociam os direitos de uso das instalações da Ferrovia Transdesértica por 1 milhão de ienes...#ne o comprador compromete-se a pagar imediatamente 10 mil ienes como parte do sinal do contrato."
13310-54 = "Sim. Confirmamos o pagamento do sinal do contrato,#nmas o saldo restante ainda não foi quitado."
13310-56 = "Como você sabe disso?"
13310-60 = "...Porque a morte da Presidente do Conselho Estudantil de Abydos foi um incidente grande demais."
13310-61 = "Grande o suficiente para até o Departamento de Inteligência de Gehenna se movimentar."
13310-63 = "Aquilo foi um acidente, Hoshino Takanashi."
13310-64 = "Não foi culpa de ninguém.#nSe tiver que culpar algo, culpe uma catástrofe natural."
13310-65 = "Por isso, você não precisa sentir que a responsabilidade é sua."
13310-66 = "...O que você sabe sobre mim?"
13310-67 = "Além disso, a Yume-senpai, como presidente..."
13310-68 = "..."
13310-69 = "Eu sei de muita coisa.#nAfinal, fui eu quem investigou a morte da Yume Kuchinashi."
13310-70 = "Você...?"
13310-71 = "Desde aquela época, você já era mais forte do que qualquer um."
13310-72 = "Não é de se estranhar que o Departamento de Inteligência estivesse de olho em você, né?"
13310-74 = "Mas, justamente por isso, você não conseguiu pedir ajuda."
13310-75 = "Quase não existe ninguém mais forte do que você."
13310-76 = "\"Eu tenho que proteger tudo sozinha\"..."
13310-77 = "Claro, não estou dizendo que pensar assim seja errado."
13310-79 = "Até o fim, você não fugiu e permaneceu em Abydos."
13310-80 = "...No fim das contas, você é mesmo mais forte do que eu."
13310-81 = "Isso só prova o quanto existem coisas que você quer proteger."
13310-82 = "...Coisas que eu quero proteger."
13310-84 = "Ah, mas o que você está fazendo!"
13310-87 = "Estava à sua espera, Hórus do Alvorec..."
13310-88 = "Não, era Hoshino-san, não é? Peço perdão pela indelicadeza."
13310-90 = "...Ei, cara de terno preto, o que você quer agora?"
13310-91 = "...Kukuku, é verdade."
13310-92 = "Eu ainda não havia decidido como me chamariam em Kivotos."
13310-94 = "\"Terno Preto\", é? ...Muito bem.#nDe agora em diante, atenderei por esse nome."
13310-95 = "...?"
13310-98 = "Ouvi sobre a situação."
13310-99 = "Agora que a Presidente do Conselho Estudantil se foi, você, como vice-presidente, assumirá o pagamento das dívidas, correto? Hoshino Takanashi-san?"
13310-100 = "Ou então... aceitaria a minha proposta?"
13310-101 = "Não tenho interesse."
13310-102 = "...Por quê?#nVocê não deveria ter nenhum motivo para permanecer em Abydos."
13310-105 = "Abandonar o Colégio Abydos e se juntar à nossa corporação... se aceitar essas condições,#nnós assumiremos quase metade da dívida que Abydos carrega hoje."
13310-106 = "Kuku, kukukuku... Vamos, deixe-me ouvir sua resposta.#nSe for sim, basta assinar aqui."
13310-108 = "...Eu já disse várias vezes que eu recuso."
13310-109 = "...Por quê?"
13310-110 = "Poderia me dizer o motivo?"
13310-112 = "...Para que exatamente eu..."
13310-113 = "Mesmo assim, não podemos deixar o Canhão Ferroviário solto..."
13310-114 = "O Sensei e os outros vão dar um jeito de parar o Canhão Ferroviário."
13310-120 = "Uoooooooooh!"
13310-121 = "Uoooh."
13310-125 = "Falta pouco para alcançarmos o Canhão Ferroviário!"
13310-126 = "...Espera aí, aquilo ali não é perigoso demais, não?"
13310-127 = "Justamente por isso precisamos pará-lo!#nShiroko-chan, Ayane-chan, Serika-chan, preparem-se para saltar!"
13310-128 = "Nn, entendido."
13310-129 = "M-Mas não está rápido demais?!"
13310-131 = "Sensei, detectei uma quantidade absurda de energia vindo do Canhão Ferroviário!"
13310-132 = "Detectado. O Morador do Subterrâneo está se aproximando da Hoshino-san."
13310-133 = "Estou tentando interferir, mas como estamos em coexistência de estados, não consigo fazer mais do que isso...!"
13310-134 = "[s1] \"Entendido!\"\n[s2] \"Precisamos pará-lo de qualquer jeito...!\""
13310-139 = "5 segundos para o impacto!"
13310-140 = "Lá vamos nós!#nProntas?"
13310-141 = "Que pena do Canhão Ferroviário~."
13310-146 = "Vamos lá!"
13310-148 = "Nn!"
13310-150 = "Uwaaaah!"
13310-158 = "Próximo;A Única Verdade (2)"
