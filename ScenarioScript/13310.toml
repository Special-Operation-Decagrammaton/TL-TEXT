[translation]
13310-1 = "Эпизод 31;Одна истина 1"
13310-3 = "(...Тело не двигается.)"
13310-5 = "Всё кончено, Таканаши Хошино. Просто лежи."
13310-6 = "(Кончено...? Почему...?)"
13310-7 = ""
13310-9 = ""
13310-10 = ""
13310-13 = "...Почему ты меня остановила?"
13310-14 = "Не понимаю. Почему...? Ты... вообще к этому не относишься..."
13310-15 = "Одолжение. Для Сенсея. Он попросил меня остановить тебя."
13310-16 = "И меня это тоже не совсем обходит стороной."
13310-17 = "..."
13310-18 = "Эта Железнодорожная пушка... наследие Тирана-Императора Геенны. Я должна уничтожить её полностью, без следа."
13310-19 = "Тирана-Императора... Геенны...?"
13310-20 = "Наследие Тирана-Императора всегда приносило Кивотосу катастрофы, когда его находили."
13310-21 = "Я и представить не могла, что остатки сохранились в Абидосе."
13310-22 = "Геенна... Значит... ты тоже охотишься за Железнодорожной пушкой..."
13310-23 = "И как ты собираешься...? Права Кайзер..."
13310-24 = "Это едва ли неразрешимая проблема."
13310-25 = "Ты ведь знаешь это не хуже меня?"
13310-27 = "..."
13310-28 = "Ты с самого начала это знала, Таканаши Хошино!"
13310-29 = "Что выход существует!"
13310-30 = ""
13310-32 = ""
13310-33 = "Сенсей и все остальные кричали тебе об этом. Что выход всегда есть. Тот Сенсей, которого ты знаешь, так или иначе нашёл бы решение."
13310-34 = "Ты сама не раз испытывала это явление на себе, Хошино."
13310-35 = "..."
13310-36 = "Но несмотря на это, ты ни разу не остановилась. Нет... Полагаю, остановиться ты не могла."
13310-38 = "Из-за Кучинаши Юмэ."
13310-39 = "..."
13310-40 = "Ты верила, что исполняешь волю Кучинаши Юмэ. Что она оставила тебе договор купли-продажи как способ уничтожить Железнодорожную пушку."
13310-41 = "Ты ошибалась."
13310-42 = "Юмэ не знала о существовании Железнодорожной пушки, не говоря уже о том, что она находилась вдоль Транс-пустынной железной дороги. В то время мы с Макото тщательно отслеживали каждую частицу наследия Тирана-Императора, и даже мы ничего не знали."
13310-43 = "..."
13310-44 = "Председатель студсовета просто считала Транс-пустынную железную дорогу важным остатком усилий студсовета Абидоса и Нефтис по возрождению района. Она лишь пыталась её сохранить."
13310-45 = "Наверное, она считала, что даже эта нелепая Транс-пустынная железная дорога — часть истории Абидоса, которую нельзя просто похоронить."
13310-47 = "Юмэ направлялась в банк на окраине района. Она спешила через пустыню, чтобы внести первоначальный платёж по договору в размере 10 000 йен... когда произошёл несчастный случай."
13310-48 = ""
13310-50 = ""
13310-52 = "Договор купли-продажи... Студсовет Абидоса соглашается приобрести у Нефтис права на... объекты Транс-пустынной железной дороги... за один миллион йен... При подписании договора покупатель уплачивает договорный сбор в размере 10 000 йен..."
13310-54 = "Да. Именно так. Договор подписан и нотариально заверен, но сама оплата спустя два года так и не поступила."
13310-56 = "Юмэ это сделала...? Как... Откуда ты... всё это знаешь...?"
13310-57 = ""
13310-59 = ""
13310-60 = "...Тогда все пытались замять дело, но в Кивотосе смерть студенты — чрезвычайно серьёзное событие."
13310-61 = "Естественно, Разведывательному комитету Геенны пришлось провести расследование."
13310-63 = "Это был несчастный случай, Таканаши Хошино."
13310-64 = "Никто не виноват. Просто непредсказуемое стихийное бедствие."
13310-65 = "...Это не твой грех, который нужно нести."
13310-66 = "Я...?"
13310-67 = "Что ты обо мне знаешь...?"
13310-68 = "..."
13310-69 = "Я знаю тебя... Именно я собирала разведданные о смерти Юмэ."
13310-70 = "Ты...?"
13310-71 = "Я знаю тебя ещё с тех времён, когда состояла в Разведывательном комитете."
13310-72 = "Я знаю тебя."
13310-74 = "Ты была сильнейшей, поэтому не могла понять саму идею обратиться за помощью к другим."
13310-75 = "Совсем одна, ты никому не доверяла. Рядом не было никого, на кого можно было бы положиться."
13310-76 = "Поэтому ты решила, что обязана защищать всё сама."
13310-77 = "И это превратилось в клинок, которым ты била всех вокруг, какими бы ни были твои настоящие чувства."
13310-79 = "Несмотря на всё это, ты осталась в Абидосе. Ты не сбежала."
13310-80 = "Ты сильнее меня."
13310-81 = "Потому что, несмотря ни на что, ты осталась. Потому что у тебя было то, что ты хотела защитить."
13310-82 = "То, что я хотела защитить..."
13310-84 = "Что ты наделала?!"
13310-85 = ""
13310-87 = "Я ждал тебя. Хорус Рассвета, Абидоса... Нет, Великая Тайна Кивотоса."
13310-88 = "У меня есть для тебя предложение."
13310-90 = "А? Меня зовут Таканаши Хошино, Чёрный Костюм."
13310-91 = "...Ха-ха-ха, понятно. Значит, так тебя называют в Кивотосе?"
13310-92 = "Понятно, понятно. Возможно, и мне нужно имя для Кивотоса."
13310-94 = "Чёрный Костюм... Мне нравится. Возьму его себе."
13310-95 = "...?"
13310-96 = ""
13310-98 = "Я слышал новости."
13310-99 = "Теперь, когда председатель студсовета исчезла, ты примешь на себя долг, вице-президент Таканаши Хошино?"
13310-100 = "Или... предпочтёшь выслушать моё предложение?"
13310-101 = "...Нет. Не нужно."
13310-102 = "По какой причине...? У тебя нет причин оставаться в школе."
13310-103 = ""
13310-105 = "Половина долга Абидоса будет немедленно списана, если ты бросишь школу и вступишь в корпорацию, которой я управляю."
13310-106 = "Хе-хе-хе. Ну что, договорились? Да? Тогда подпиши здесь."
13310-108 = "Нет. Мой ответ не изменится. Я этого не сделаю."
13310-109 = "...Почему?"
13310-110 = "Ради чего ты остаёшься там?"
13310-112 = "Ради... чего... я...?"
13310-113 = "Но Железнодорожная пушка... если просто оставить её..."
13310-114 = "Сенсей и Комитет по выплате долга уже преследуют Железнодорожную пушку."
13310-115 = ""
13310-117 = ""
13310-120 = "А-А-А!"
13310-121 = "Ух ты-ы-ы!"
13310-122 = ""
13310-124 = ""
13310-125 = "Мы почти догнали Железнодорожную пушку."
13310-126 = "Я вам безумно благодарна, что вы спасли нас от Кайзер и всё такое, но эта штука выглядит максимально опасной! Вы точно уверены?"
13310-127 = "Именно поэтому мы обязаны её остановить! Как только столкнёмся с Железнодорожной пушкой, перепрыгиваем на неё! Широко! Сэрика!"
13310-128 = "Да, хорошо."
13310-129 = "Н-Но мы не слишком быстро едем?"
13310-131 = "Сенсей! Нужно спешить! Я фиксирую мощнейший всплеск энергии в главном орудии! Оно готовится к выстрелу!"
13310-132 = "Продолжаю отслеживать местоположение Подземного жителя... Сенсей, он приближается к Хошино!"
13310-133 = "Я пытаюсь его сдержать, но позиция Подземного жителя всё ещё находится в пространственном наложении...!"
13310-134 = "[s1] «Понял! Спасибо!»\n[s2] «Мы как-нибудь остановим их обоих! И Железнодорожную пушку, и Хошино!»"
13310-135 = ""
13310-136 = ""
13310-139 = "Столкновение через пять секунд!"
13310-140 = "Начинается! Приготовьтесь!!"
13310-141 = "Железнодорожная пушка... Хикари уничтожит её. Своими руками... Как грустно."
13310-142 = ""
13310-144 = ""
13310-146 = "Пошли!"
13310-148 = "Да!"
13310-150 = "Уа-а-а!"
13310-151 = ""
13310-158 = "Следующий эпизод;Одна истина 2"
