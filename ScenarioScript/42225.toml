[translation]
42225-6 = "Угх..."
42225-7 = ""
42225-9 = ""
42225-10 = "(Ударная волна... детонатор...)"
42225-11 = ""
42225-16 = "[ns1] «Есть! Детонатор!»\n[ns2] «Детонатор у меня!»"
42225-19 = "Отличная работа, Сенсей!"
42225-20 = "Не теряй концентрацию на поле боя, Цукиюки!"
42225-22 = "Я здесь!"
42225-23 = ""
42225-37 = "А-а-а!"
42225-38 = ""
42225-40 = ""
42225-41 = "Ты всегда оставляешь слишком много открытых мест. Если бы я ставила оценку, это был бы провал."
42225-42 = ""
42225-44 = ""
42225-45 = "К счастью, в реальной жизни ты меня не экзаменуешь..."
42225-46 = "Именно ты научила меня, насколько реальность отличается от учебников!"
42225-47 = "И я поняла: в реальности правосудие победит, если у тебя есть решимость за него бороться."
42225-48 = "Правосудие победит? Решимость?"
42225-49 = "Иногда кажется, будто ты сознательно отказываешься взрослеть. Если бы «реальность» играла по твоим маленьким идеалистичным правилам, мы бы вообще здесь не оказались."
42225-50 = "Тогда позволь преподать тебе следующий урок. Реальность имеет привычку разрушать мечты людей."
42225-51 = ""
42225-55 = "Фокстрот."
42225-56 = ""
42225-59 = ""
42225-60 = "(Похоже на светошумовую гранату...)"
42225-62 = "...Попалась!"
42225-63 = ""
42225-65 = ""
42225-70 = ""
42225-71 = "В одном ты была права."
42225-72 = "Ударив головой вместо того, чтобы использовать руки, я сократила время реакции на полсекунды."
42225-73 = ""
42225-75 = ""
42225-76 = "Сдавайся, FOX 1."
42225-77 = "*вздыхает*"
42225-78 = "Для человека, который обычно безупречно выполняет приказы, почему ты вдруг перестала меня слушать?"
42225-79 = "Что ты имеешь в виду?"
42225-80 = ""
42225-82 = ""
42225-84 = ""
42225-85 = "Я сказала, что активирую боеголовку, если вы войдёте в операционную."
42225-86 = "Я не блефовала."
42225-87 = "Я была полностью готова отдать жизнь за эту миссию."
42225-88 = "Так почему... Почему ты продолжила идти вперёд, даже не задумавшись?"
42225-89 = ""
42225-92 = ""
42225-93 = "Мне даже в голову не пришло, что ты правда рискнёшь жизнями всех нас вот так."
42225-94 = "Раньше ты говорила мне, что всё это — преступления, страдания — ради будущих студентов SRT."
42225-95 = "Тот, кто настолько вкладывается в завтрашний день..."
42225-96 = "...просто не похож на человека, который позволит умереть тем, кто больше всех на него равняется."
42225-97 = ""
42225-100 = ""
42225-101 = "...Я показала тебе суровую правду мира."
42225-102 = "Я вбивала в тебя, что лучше играть грязно и выиграть, чем честно и проиграть."
42225-103 = "И всё равно ты мне доверяешь?"
42225-104 = "Когда-то ты сказала ещё кое-что."
42225-107 = "Что бы ни вставало на пути, правосудие SRT никогда не дрогнет."
42225-108 = "Даже если оно начнёт меркнуть во тьме мира, в конце всё равно засияет."
42225-111 = "Именно твои убеждения дали мне силы отстаивать собственные."
42225-112 = "Мы мечтали стать похожими на отряд FOX."
42225-115 = "Зачем бы мы вообще шли по такому опасному пути, если бы не верили в будущее, к которому он ведёт?"
42225-117 = "Так что не бросай нас сейчас."
42225-118 = ""
42225-121 = ""
42225-122 = "...Мы сбились с пути."
42225-123 = "Нам дали огромную силу, но не дали направления."
42225-124 = "После исчезновения президента Генерального студенческого совета мы искали ориентир. Кого-то ещё, кто мог бы принять на себя нашу ответственность."
42225-125 = "Но такого человека мы не нашли. Вместо того чтобы отказаться от власти, как следовало бы, мы в отчаянии вцепились в неё."
42225-126 = "И теперь, в конце пути, передо мной призрак прошлого. Какая ирония."
42225-127 = ""
42225-129 = ""
42225-130 = "Командир отряда Цукиюки, эта боеголовка должна взорваться."
42225-131 = "Пора закрыть эту главу и ответить за свои поступки."
42225-132 = "Так что, пожалуйста. Просто... уходи отсюда."
42225-134 = "Юкино...!"
42225-135 = ""
42225-139 = "[ns] «Нести ответственность тяжело. Я могу это понять.»"
42225-141 = "[ns] «Но то, что ты делаешь сейчас, — это бегство от неё. Я не могу тебе позволить.»"
42225-144 = "...[USERNAME] Сенсей."
42225-145 = "Возможно, вам трудно это понять."
42225-146 = "Вы всегда так хорошо сохраняли баланс между властью и ответственностью."
42225-147 = "Но будь вы на нашем месте..."
42225-148 = "Что бы вы сделали?"
42225-149 = ""
42225-152 = "[ns] «...Я бы пошёл спать. А потом наступило бы завтра.»"
42225-153 = "...Завтра?"
42225-154 = "И что это изменит?"
42225-155 = "История просто повторится."
42225-156 = "Устаревшее оружие нужно утилизировать, а не сохранять до следующего дня."
42225-157 = "[ns3] «Но ты не инструмент. И никогда им не была.»\n[ns4] «Люди хороши тем, что в следующий раз всегда могут поступить лучше.»"
42225-160 = "В следующий раз...?"
42225-161 = "После всего, что мы сделали... Неужели вообще существует хоть малейшая возможность второго шанса?"
42225-162 = "[s] «Всегда.»"
42225-163 = ""
42225-165 = ""
42225-167 = "[ns5] «Если чего-то не знаешь — учишься...»\n[ns6] «Если застрял — просишь помочь выбраться...»\n[ns7] «Если тяжело — опираешься на окружающих...»"
42225-171 = "[ns8] «Пока не станешь взрослым и не сможешь полностью отвечать за себя...»\n[ns9] «Люди вокруг помогут разделить эту ответственность.»"
42225-175 = "Пока я не..."
42225-176 = ""
42225-178 = ""
42225-179 = "...Нам ещё долго взрослеть, да?"
42225-180 = ""
42225-182 = ""
42225-186 = ""
42225-187 = "Угх, Саки снова меня подстрелила! Это точно было специально!"
42225-188 = "Вот поэтому я и говорила тебе добавить ещё один слой баллистических пластин на грудь."
42225-189 = "Но с дополнительным слоем тяжело дышать, особенно в бою..."
42225-190 = "...Да и защищать там особо нечего."
42225-191 = "З-Заткнись!"
42225-192 = ""
42225-194 = ""
42225-196 = "...Значит, ты проиграла, FOX 1."
42225-197 = "Да."
42225-198 = "Сенсей и правда такой странный, как говорят?"
42225-199 = "Страннее некуда."
42225-200 = ""
42225-202 = ""
42225-203 = ""
42225-205 = "Но думаю, пока рядом есть такой взрослый, как Сенсей, с нами всё будет хорошо."
42225-206 = ""
42225-213 = "Это наше поражение, командир отряда Цукиюки."
42225-214 = "Отряд FOX официально поднимает белый флаг."
42225-215 = "Мы доверяем вам..."
42225-217 = "Докажите, что мы не ошиблись, выбрав завтрашний день."
42225-219 = "Следующий эпизод; Неудавшийся переворот"
