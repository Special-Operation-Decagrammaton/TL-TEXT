[translation]
42225-6 = "Ugh..."
42225-10 = "(Com o impacto da explosão, o detonador...)"
42225-16 = "[ns1] \"...Peguei.\"\n[ns2] \"Eu recuperei o detonador!\""
42225-19 = "Entendido!"
42225-20 = "Para onde está olhando, Líder Tsukiyuki?"
42225-22 = "Sua oponente está aqui!"
42225-37 = "Ah...!"
42225-41 = "Cheia de brechas como sempre.#nSe fosse um exame da SRT, isso já teria custado pontos."
42225-45 = "...Se fosse um exame, talvez sim."
42225-46 = "Mas aqui não é uma sala de exames — é a realidade..."
42225-47 = "E na realidade... não importa a situação, a justiça sempre vence!"
42225-48 = "Na realidade, a justiça sempre vence...?"
42225-49 = "Se a lógica deste mundo fosse tão simples assim, o problema jamais teria chegado a este ponto."
42225-50 = "A realidade sempre... trai as nossas expectativas."
42225-55 = "FOXTROT..."
42225-60 = "(Esse som... não pode ser, uma granada de luz—)"
42225-62 = "...Haaah!"
42225-71 = "...Você tinha razão, senpai."
42225-72 = "Empurrar com a cabeça antes de recuar a mão realmente aumentou minha velocidade de reação em 0,5 segundo."
42225-76 = "Por favor, largue suas armas, FOX 1."
42225-77 = "Haa..."
42225-78 = "Você sempre foi uma caloura tão boa... por que resolveu não acreditar nas minhas palavras justamente desta vez?"
42225-79 = "...Como assim?"
42225-85 = "A ameaça de detonar a ogiva caso entrassem na sala de operações."
42225-86 = "Não era um simples blefe."
42225-87 = "Eu realmente fiquei aqui preparada para jogar minha vida fora, e mesmo assim..."
42225-88 = "O que diabos você estava pensando quando forçou essa operação?"
42225-93 = "Eu acreditei que você jamais escolheria nos abandonar, senpai."
42225-94 = "Você mesma disse antes, senpai — que estava disposta a sujar as próprias mãos para reviver a Academia Especial SRT pelo bem das suas calouras."
42225-95 = "Alguém que, mesmo resignada diante da realidade, aposta tudo no futuro — a ponto de abrir mão da própria vida..."
42225-96 = "Jamais abandonaria as calouras que carregam o amanhã da SRT."
42225-101 = "...Eu despertei vocês dos seus sonhos ingênuos e mostrei a escuridão da sociedade."
42225-102 = "Repeti inúmeras vezes que uma vitória suja é melhor do que uma derrota honrosa."
42225-103 = "E, mesmo assim... você ainda acredita em mim?"
42225-104 = "Você disse uma vez, senpai..."
42225-107 = "Que a justiça da SRT nunca se abala, não importa a situação—"
42225-108 = "Mesmo que fique coberta pela poeira de uma realidade sombria e perca a luz que um dia irradiou..."
42225-111 = "O verdadeiro valor e o significado que a justiça carrega jamais desbotarão."
42225-112 = "Vocês eram o nosso sonho — e o nosso futuro."
42225-115 = "Se eu não pudesse acreditar no futuro... jamais teria escolhido este caminho."
42225-117 = "Por isso... não fuja e continue caminhando à nossa frente.#n— Yukino-senpai."
42225-122 = "Eu... dei voltas demais para chegar até aqui."
42225-123 = "Desde o início, fomos uma organização projetada para empunhar um poder maior do que a responsabilidade que podíamos carregar."
42225-124 = "Desde que a Presidente do Conselho Estudantil Geral desapareceu, ficamos procurando alguém capaz de assumir a responsabilidade por esse poder."
42225-125 = "Bastaria abrir mão de tudo para que se resolvesse... mas nos apegamos ao nome da autoridade herdada de outros e fomos incapazes de soltar esse poder."
42225-126 = "E no fim das contas, acabamos frente a frente com a sombra do nosso passado... O destino é mesmo irônico."
42225-130 = "Líder Tsukiyuki. Infelizmente... esta ogiva precisa ser detonada aqui."
42225-131 = "Para enterrar a responsabilidade do passado junto com a antiga SRT.#nNeste abismo—"
42225-132 = "Por isso... por favor, saiam daqui."
42225-134 = "Senpai...!"
42225-139 = "[ns] \"...Mesmo os adultos têm momentos em que é difícil aceitar a responsabilidade.\""
42225-141 = "[ns] \"Mas não podemos fugir da responsabilidade.\""
42225-144 = "...Sensei [USERNAME]."
42225-145 = "O Sensei não conseguiria entender o que passamos."
42225-146 = "Afinal, o Sensei é um adulto capaz de carregar tanto o próprio poder quanto a própria responsabilidade."
42225-147 = "Se o Sensei enfrentasse uma responsabilidade grande demais para carregar, como nós enfrentamos..."
42225-148 = "Nesse caso, qual escolha você faria?"
42225-152 = "[ns] \"...Eu esperaria pelo amanhã.\""
42225-153 = "...Pelo amanhã?"
42225-154 = "E mesmo que o amanhã chegue... o que exatamente isso mudaria?"
42225-155 = "Os erros se repetem e o resultado continua o mesmo."
42225-156 = "Uma arma que perdeu sua utilidade só tem um destino natural: ser descartada."
42225-157 = "[ns3] \"Mas vocês não são armas, são alunas.\"\n[ns4] \"Por isso, da próxima vez vocês vão se sair melhor.\""
42225-160 = "Próxima vez...?"
42225-161 = "O Sensei realmente acha que existe uma próxima vez para nós?"
42225-162 = "[s] \"É claro.\""
42225-167 = "[ns5] \"Se não souberem algo, basta aprender...\"\n[ns6] \"Se estiverem em apuros, estendam a mão...\"\n[ns7] \"Quando for difícil, apoiem umas às outras...\""
42225-171 = "[ns8] \"E quando crescerem assim e se tornarem adultas...\"\n[ns9] \"Aí sim, poderão assumir a responsabilidade.\""
42225-175 = "Quando nos tornarmos... adultas..."
42225-179 = "...Nós... não éramos adultas, afinal."
42225-187 = "Ai, ai... Aquela Saki atirou na minha barriga de novo!#nDessa vez foi de propósito, com certeza! Que saco!"
42225-188 = "Eu não disse para você colocar pelo menos uma placa balística no peito?"
42225-189 = "Mas se eu usar placa balística durante a operação, aperta o peito e fica difícil de respirar..."
42225-190 = "...Nem é grande coisa assim."
42225-191 = "Cala a boca!"
42225-196 = "...Acabamos falhando, né, FOX 1."
42225-197 = "...É, falhamos."
42225-198 = "...Era mesmo um adulto estranho, exatamente como nos boatos."
42225-199 = "Pois é. Um adulto realmente estranho..."
42225-205 = "...Mas, se existe um adulto assim...#nAcho que posso encerrar o \"hoje\" em paz."
42225-213 = "A derrota é nossa, Líder Tsukiyuki."
42225-214 = "O Esquadrão FOX se rende."
42225-215 = "...Que nós, ontem, não fizemos a escolha errada—"
42225-217 = "—Por favor, provem isso com as próprias mãos."
42225-219 = "Próximo;Golpe de Estado Fracassado"
