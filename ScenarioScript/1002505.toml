[translation]
1002505-1 = "Проверка безопасности игровой площадки"
1002505-2 = "Центр Кивотоса, крытая игровая площадка"
1002505-3 = "Это новая крытая детская площадка, которая недавно открылась..."
1002505-4 = "Похоже, слухи были правдой. Здесь много интересного оборудования."
1002505-5 = "Есть батут с милыми персонажами и даже огромный сухой бассейн с шариками."
1002505-6 = "Уверена, детям из Сада цветущей сливы здесь будет очень весело."
1002505-7 = "Ну что, Сенсей, что проверим первым?"
1002505-8 = "[s] «Ты собираешься сама всё это пробовать?»"
1002505-9 = "К-Конечно! Просто посмотреть и испытать всё на себе — совершенно разные вещи!"
1002505-10 = "Мне нужно понять, как ощущается оборудование, чтобы проверить, не возникнут ли проблемы с безопасностью, когда дети придут сюда играть."
1002505-11 = ""
1002505-12 = "Я совершенно точно делаю это не потому, что сама хочу повеселиться!"
1002505-13 = "[s1] «Ну-ну, Шун.»\n[s2] «Развлекайся сколько хочешь. Я не против.»"
1002505-14 = "(По твоему лицу видно, что ты мне не веришь.)"
1002505-15 = "(По твоему лицу видно, что ты мне не веришь.)"
1002505-16 = "Начнём с того батута."
1002505-18 = "С батутами всё просто. Пружины подбрасывают человека в воздух за счёт упругости, но на них также легко получить травму."
1002505-19 = "Можно пострадать, если пружина сломается из-за низкой прочности или если упругость окажется настолько сильной, что человека выбросит за пределы полотна."
1002505-20 = "Для начала проверю прочность."
1002505-21 = ""
1002505-23 = ""
1002505-24 = ""
1002505-25 = ""
1002505-26 = "Хм. Кажется, всё нормально. Думаю, ни одна пружина не сломается, даже если несколько детей будут прыгать и играть одновременно."
1002505-27 = "Теперь заберёмся на полотно и проверим упругость пружин."
1002505-28 = ""
1002505-30 = ""
1002505-31 = ""
1002505-32 = ""
1002505-33 = ""
1002505-34 = "У-Ух ты! Он так высоко меня подбрасывает!"
1002505-35 = ""
1002505-36 = ""
1002505-37 = "Упругость этого батута лучше, чем я ожидала."
1002505-38 = "Мне показалось, будто я лечу! Ха-ха-ха!"
1002505-39 = "[s3] «Шун?»\n[s4] «Ты уверена, что не просто играешь?»"
1002505-40 = "Эй!"
1002505-41 = "Эй!"
1002505-42 = "Я-Я не играю! Я просто проверяю его, потому что сейчас сама чувствую себя ребёнком!"
1002505-43 = ""
1002505-45 = ""
1002505-46 = ""
1002505-47 = "Хм. Хмм. С упругостью всё в порядке."
1002505-48 = "Единственная проблема, которую я вижу, — батут может оказаться настолько весёлым, что дети не захотят играть больше ни во что."
1002505-49 = "[s] «Главное, что тебе весело.»"
1002505-50 = "Я-Я здесь не ради игр, так что всё нормально!"
1002505-51 = "Хм. Дальше — большой сухой бассейн с шариками!"
1002505-53 = "Этот сухой бассейн — самая большая игровая зона на всей площадке."
1002505-54 = "Здесь разбросано столько мягких шариков разных цветов. Как красиво..."
1002505-55 = "А?"
1002505-56 = ""
1002505-57 = "С-Сенсей, посмотри туда! Огромная горка прямо в бассейн с шариками!"
1002505-58 = "Не могу поверить, что они сделали извилистую горку почти от самого потолка!"
1002505-59 = "Уверена, это будет очень весело!"
1002505-60 = "[s] «Хочешь с неё съехать?»"
1002505-61 = "Конечно хочу. Когда я была выше, на детских горках я не помещалась..."
1002505-62 = "Эм, то есть! Как наставница детей из Сада цветущей сливы я должна лично проверить её первой!"
1002505-63 = "[s] «Снаружи она выглядит довольно прочной...»"
1002505-64 = "Нет. Как и у батута, у горки много факторов риска, которые можно проверить только прокатившись лично."
1002505-65 = "Если наклон слишком крутой, можно разогнаться слишком сильно. А если на поверхности есть острые трещины, это вообще очень опасно!"
1002505-66 = "Так что я вернусь после проверки безопасности!"
1002505-67 = ""
1002505-69 = ""
1002505-71 = "Шун поднялась по лестнице, чтобы скатиться с горки в бассейн с шариками."
1002505-73 = "Ахаха! Так весело!"
1002505-74 = "Наклон и изгиб как раз подходящие, поэтому скорость сохраняется до самого низа!"
1002505-75 = "Думаю, нам стоит проехать с горки ещё один—"
1002505-76 = "[s] «Ты ещё не закончила проверку безопасности?»"
1002505-77 = ""
1002505-78 = "О, эм... Я не успела полностью проверить состояние внутренней поверхности."
1002505-79 = "Невозможно идеально проверить все аспекты безопасности всего за один спуск, знаешь ли!"
1002505-80 = "К тому же я не знаю, когда снова смогу здесь покататься, так что уходить сейчас было бы жалко..."
1002505-81 = "[s] «А я думал, ты здесь не ради игр.»"
1002505-82 = "Э-э..."
1002505-83 = "Хватит меня дразнить!"
1002505-85 = "Шун надулась, а затем ушла кататься с горки ещё пять раз."
