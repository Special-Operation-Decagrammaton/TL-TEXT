[translation]
901010600420-7 = "[ns] «Привет всем!»"
901010600420-8 = ""
901010600420-9 = "Добро пожаловать, Сенсей!"
901010600420-10 = "Спасибо, что пришли точно вовремя, несмотря на плотный график."
901010600420-11 = "[s1] «Конечно! Я всё-таки куратор отряда FOX!»\n[s2] «Мне ужасно интересно узнать про крабов-монстров!»"
901010600420-12 = "...Спасибо. На вас всегда можно положиться."
901010600420-13 = "И нам тоже. Это превратило бы дело во что-то куда серьёзнее обычного исчезновения человека."
901010600420-15 = "Думаете, сегодня мы сможем сделать более содержательные выводы?"
901010600420-16 = "Есть только один способ узнать."
901010600420-19 = "Раз все собрались, начнём."
901010600420-20 = "Приступим к докладам по миссии."
