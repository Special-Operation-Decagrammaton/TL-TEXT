[translation]
901010600420-7 = "[ns] \"Meninas, bom trabalho pelo dia de hoje!\""
901010600420-8 = ""
901010600420-9 = "Seja muito bem-vindo, Sensei!"
901010600420-10 = "Muito obrigada por vir até aqui mesmo com sua agenda tão atarefada."
901010600420-11 = "[s1] \"Sou o orientador do Esquadrão FOX, é minha obrigação estar aqui.\"\n[s2] \"Estava curioso pra saber se esse tal caranguejo monstro realmente existe.\""
901010600420-12 = "...Muito obrigada, Sensei. Sua presença é sempre reconfortante."
901010600420-13 = "Sim. Se uma aberração daquelas realmente habitar as docas, será uma crise muito pior que simples sumiços."
901010600420-15 = "Tomara que consigamos chegar a uma conclusão produtiva hoje."
901010600420-16 = "Só saberemos depois de cruzar todos os relatórios."
901010600420-19 = "Pois bem, vamos dar início."
901010600420-20 = "Apresentem seus relatórios das diligências de hoje."
