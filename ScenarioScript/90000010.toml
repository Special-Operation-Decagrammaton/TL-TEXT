[translation]
90000010-1 = "Эпизод 2;Исследование, Часть 1: Пустыня"
90000010-2 = "Прежде всего нужно начать собирать как можно больше данных о Декаграмматоне."
90000010-3 = "Наша первая цель — Пустыня Абидос, одно из известных мест, где проявлялось влияние Декаграмматона."
90000010-4 = "Найти его пророка Бину может быть трудно, но низших последователей Декаграмматона обнаружить должно быть гораздо проще."
90000010-5 = "Соберём необходимые данные, победив их."
