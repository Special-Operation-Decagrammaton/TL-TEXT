[translation]
10039120-1 = "Послесловие;Общий фестиваль, общественная безопасность"
10039120-7 = ""
10039120-8 = ""
10039120-9 = ""
10039120-10 = "Кирино, ты слышала?"
10039120-11 = ""
10039120-13 = ""
10039120-14 = "Что именно? Если ты о поправках к Закону о дорожном движении из-за установки двусторонних камер наблюдения, я уже в курсе."
10039120-15 = "Поправки? Какие ещё? Впервые слышу."
10039120-16 = "В общем, я не об этом."
10039120-17 = "В Тринити проводят большой фестиваль."
10039120-18 = ""
10039120-21 = ""
10039120-22 = "Точно, Карнавал Тринити!"
10039120-23 = "Хех, будто МЫ там будем развлекаться. Когда проходит крупное мероприятие, Бюро общественной безопасности всегда отправляет дополнительных сотрудников для охраны."
10039120-24 = "И да, я проверила — нас это тоже касается."
10039120-25 = "Ну, где гражданам нужна защита, там и наше место!"
10039120-26 = "Тебе обязательно всё время быть такой радостной? Одна мысль обо всём этом веселье прямо перед носом, до которого я не могу дотянуться... аж слёзы наворачиваются."
10039120-27 = "Ну... может, просто не думай об этом так."
10039120-28 = "Я бы предпочла вообще об этом не думать."
10039120-29 = ""
10039120-33 = ""
10039120-34 = ""
10039120-36 = "Эй, вы там! Поднимите руку, у кого назначение на Карнавал Тринити."
10039120-37 = "У нас!"
10039120-38 = "Отлично. Тогда оставлю эти костюмы вам."
10039120-39 = "А? Костюмы?"
10039120-40 = "Не знаю. Мне просто сказали их раздать."
10039120-41 = ""
10039120-43 = ""
10039120-44 = "Ну, пока. Удачи!"
10039120-45 = ""
10039120-47 = ""
10039120-48 = ""
10039120-49 = "...Так, на упаковке есть записка..."
10039120-50 = ""
10039120-52 = ""
10039120-53 = ""
10039120-54 = "«Костюмы для назначенных на фестиваль сотрудников.»"
10039120-55 = "Странно, что у них вообще такое есть. Посмотрим..."
10039120-58 = "Некоторое время спустя..."
10039120-61 = ""
10039120-63 = "Так, вы серьёзно?!"
10039120-64 = "И как ЭТО поможет нам выполнять работу?! Нельзя просто пойти в форме?"
10039120-65 = "Я-Я понятия не имею..."
10039120-66 = ""
10039120-68 = ""
10039120-69 = "Может, где-то произошла канцелярская ошибка? В «Валькирии» такого хватает..."
10039120-70 = "Дай-ка я уточню у кого-нибудь повыше и удостоверюсь..."
10039120-71 = "Под «кем-нибудь повыше» ты имеешь в виду...?"
10039120-75 = ""
10039120-76 = "Бюро общественного порядка, кабинет директора. Чем могу помочь?"
10039120-77 = ""
10039120-79 = ""
10039120-80 = "О, это Бюро общественной безопасности?"
10039120-81 = "Директор! Мне... нужно понять, что здесь вообще происходит."
10039120-82 = ""
10039120-84 = ""
10039120-85 = "Это насчёт костюмов?"
10039120-86 = "Их просто свалили мне на стол. Это что, официальная форма Карнавала Тринити или типа того?"
10039120-87 = "А? Ты о чём вообще?"
10039120-88 = ""
10039120-90 = ""
10039120-91 = ""
10039120-92 = "Ах."
10039120-93 = "А-а... Так вот что это было..."
10039120-94 = "Что такое?! Вы что-то знаете, директор?"
10039120-96 = "Мы ПРАВДА должны это носить?"
10039120-97 = ""
10039120-99 = ""
10039120-100 = ""
10039120-101 = "...Послушай, офицер. Это часть задания Бюро общественной безопасности по поддержке мероприятия."
10039120-102 = ""
10039120-105 = ""
10039120-106 = "А? О чём вы...?"
10039120-108 = "В обмен на всю помощь, припасы и сладости от частных компаний сотрудники, направленные на Карнавал Тринити, обязаны носить специальные костюмы."
10039120-109 = "Так что да, это именно они."
10039120-110 = ""
10039120-113 = ""
10039120-115 = "Мы сделаем... шаткий публичный образ «Валькирии» более дружелюбным. Заодно прорекламируем частные компании."
10039120-117 = "То есть ответственность за имидж «Валькирии» лежит на НАШИХ плечах?"
10039120-118 = "Даже если забыть про костюмы, разве это не СЛИШКОМ большая ответственность всего для нас двоих?"
10039120-119 = "Думаете, мы изменим весь наш образ, просто один раз нарядившись в розовое?"
10039120-121 = "Но они ведь вам вроде идут... не думаете?"
10039120-122 = "Ну... да, идут..."
10039120-123 = "В любом случае, решение принято. Начальство сказало своё слово, и я ничего не могу с этим поделать. Простите."
10039120-124 = "Легко вам говорить. ВАМ-то наряжаться не придётся!"
10039120-125 = ""
10039120-127 = ""
10039120-128 = "Прости, связь пропадает... *тррр* Не... слышу..."
10039120-129 = ""
10039120-131 = ""
10039120-132 = ""
10039120-133 = "Алло? Алло??"
10039120-134 = ""
10039120-136 = ""
10039120-137 = "Она отключилась. Вот же невежа!"
10039120-138 = "...Ну, похоже, нам и правда придётся это надеть."
10039120-139 = "Само по себе назначение уже не радует. А выходить в ЭТОМ — вообще какой-то бред."
10039120-140 = "Серьёзно, если мы и дальше будем делать всё, что нам говорят, получится «прощай свобода, прощай комфорт.» Нам пора бастовать!"
10039120-144 = "(В день фестиваля...)"
10039120-145 = ""
10039120-157 = ""
10039120-158 = "..."
10039120-159 = "..."
10039120-160 = ""
10039120-162 = ""
10039120-164 = "Извините, где здесь туалет?"
10039120-165 = ""
10039120-168 = ""
10039120-169 = "В конце коридора, слева."
10039120-171 = "А, спасибо!"
10039120-172 = ""
10039120-174 = ""
10039120-177 = ""
10039120-178 = "Здравствуйте, я ищу комнаты ожидания участников второго раунда."
10039120-179 = "Вам нужны комнаты с 204-й по 212-ю! Там поверните направо, а потом поднимитесь наверх."
10039120-180 = "Отлично, спасибо за помощь."
10039120-181 = "Не за что. Удачи!"
10039120-182 = ""
10039120-184 = ""
10039120-186 = "Почему ты ведёшь себя как экскурсовод? Нам туда же. МЫ участницы. ...Технически."
10039120-187 = ""
10039120-190 = ""
10039120-191 = "Привычка. Я просто очень привыкла указывать людям дорогу."
10039120-192 = "Та девушка пришла на конкурс поп-айдолов в кимоно. Интересный выбор."
10039120-193 = "А мы тем временем нарядились талисманами магазина пончиков."
10039120-194 = "Ну, раз уж мы ЗДЕСЬ, давай хотя бы постараемся мыслить позитивно."
10039120-195 = "Как? И в чём тут светлая сторона?"
10039120-196 = "Ну, помнишь, спонсоры дают нам бесконечно много сладостей, пока мы на задании."
10039120-197 = "И сказали, что новые вкусы мы сможем пробовать первыми."
10039120-198 = "Это определённо не МИНУС, но..."
10039120-199 = "Ну... да. Всё-таки речь о Master Donut. Им я отказать не могу."
10039120-200 = "Вот это настрой! Давайте представлять их с гордостью! Ради порядка и общественной безопасности! И ради наших служебных оценок!"
10039120-201 = "Ага, как скажешь..."
10039120-202 = ""
10039120-204 = ""
10039120-207 = ""
10039120-208 = "Та-ак, следующие... «Сладкая полиция» здесь?"
10039120-209 = ""
10039120-212 = ""
10039120-213 = "О, это мы."
10039120-214 = "Я всё ещё не привыкла к этому названию."
10039120-215 = "...Ладно, просто выйдем на сцену, прочитаем наше маленькое объявление по безопасности и закончим с этим."
10039120-216 = "Это немного больше, чем просто «объявление по безопасности.» Мы учим правилам безопасности через песни и танцы. Это важно!"
10039120-217 = "Не волнуйся, ты готова. Мы столько тренировались!"
10039120-218 = "От этого мне не менее стыдно. Не могу поверить, что нас заставляют этим заниматься..."
10039120-219 = ""
10039120-223 = ""
10039120-224 = "Угх, кажется, меня сейчас затошнит..."
10039120-225 = "Ой. Вот, сделай глубокий вдох..."
10039120-226 = ""
10039120-228 = ""
10039120-230 = "Дайте сверю ваши имена. Накацукаса Кирино?"
10039120-231 = ""
10039120-233 = ""
10039120-234 = "Да! Это я!"
10039120-236 = "Нэмугаки Фубуки?"
10039120-238 = "Ладно, ладно..."
10039120-239 = ""
10039120-243 = "П-Пожалуйста, помогите..."
10039120-245 = "А...?"
10039120-246 = ""
10039120-248 = ""
10039120-249 = ""
10039120-254 = "Чёрт, кажется, между ними кого-то зажало!"
10039120-255 = "Эй! Ты в порядке?!"
10039120-259 = ""
10039120-262 = ""
10039120-264 = ""
10039120-265 = "Ах... С-Спасибо!"
10039120-266 = "Без проблем. Что с тобой случилось?"
10039120-267 = "Ну, эм... я немного испугалась сцены..."
10039120-268 = "...Поэтому спряталась за талисманом, просто чтобы перевести дух, потом уронила телефон, наклонилась его поднять, а дальше сама не поняла как — и оказалась зажатой, как вы и увидели..."
10039120-269 = "Ух, хорошо хоть удалось избежать беды."
10039120-270 = "И правда. Спасибо вам. Я очень благодарна."
10039120-271 = "Вы двое тоже участвуете в конкурсе?"
10039120-272 = ""
10039120-275 = ""
10039120-276 = "...Вроде того."
10039120-277 = "Всё сложно..."
10039120-278 = "...вот так нас сюда и втянули."
10039120-280 = "П-Понятно... И правда безумный мир, да?"
10039120-281 = "Будем надеяться, сегодня хотя бы будет немного спокойствия..."
10039120-282 = ""
10039120-284 = ""
10039120-286 = "У вас хорошо получается его поддерживать."
10039120-287 = "Да, вы были потрясающими!"
10039120-289 = "Хи-хи, ну... Спасибо, что всегда так усердно защищаете безопасность Кивотоса."
10039120-290 = "Уверена, у вас будет прекрасное выступление. Надеюсь, ещё увидимся!"
10039120-291 = "Мы постараемся. Береги себя!"
10039120-292 = ""
10039120-294 = ""
10039120-295 = ""
10039120-297 = "Какой милый образ для Сестры."
10039120-298 = "Правда же? Интересно, они тоже хотят изменить свой имидж."
10039120-299 = "Костюмы поп-айдолов, чтобы избавиться от слишком строгого образа. Мир тесен."
10039120-300 = "Ну, я не знаю, насколько это связано с НАШИМ имиджем. Мы сейчас вообще-то представляем магазин пончиков."
10039120-301 = "Ха-ха, и то верно..."
10039120-302 = ""
10039120-304 = ""
10039120-305 = "Фубуки, тебе стало немного лучше?"
10039120-306 = ""
10039120-308 = ""
10039120-309 = "...Теперь, когда ты сказала, да, кажется, стало."
10039120-310 = "Наверное, разговор с Сестрой помог мне расслабиться."
10039120-311 = "Ну, Сёстры ведь выслушивают исповеди, так что из них, видимо, неплохие советчики."
10039120-312 = ""
10039120-316 = "...Полиция!"
10039120-317 = "Сладкая полиция! Вы готовы или нет? Выходите, а то мы вас пропустим!"
10039120-318 = ""
10039120-320 = ""
10039120-321 = "Ай! Мы здесь! Мы готовы!"
10039120-322 = "Ладно, Фубуки, пришло наше время блистать!"
10039120-323 = "Ха-а... Час настал..."
10039120-324 = "Эй, давай, не садись сейчас! Нам пора выходить!"
10039120-325 = "Ладно, ладно..."
10039120-326 = ""
10039120-328 = ""
10039120-336 = ""
10039120-337 = "После рекламного объявления девушек из Бюро общественной безопасности продажи магазина пончиков удвоились."
