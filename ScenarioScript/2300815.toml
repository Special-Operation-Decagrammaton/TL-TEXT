[translation]
2300815-1 = "Искренние чувства"
2300815-2 = "Я встретился с Мари в торговом центре, чтобы помочь ей купить всё необходимое для Сестринства."
2300815-4 = "Ого. Список немаленький."
2300815-5 = "Всё для благотворительной ярмарки, помощи нуждающимся и просветительских мероприятий... а ещё сладости на этот месяц."
2300815-6 = "[s] «Ага. Хорошо, что мы пришли вместе.»"
2300815-7 = "Безусловно. Без вашей помощи было бы довольно трудно."
2300815-8 = "Как всегда, я вам благодарна."
2300815-9 = "[s] «Мари, тебе всегда приходится выполнять такие поручения?»"
2300815-10 = "Ах, нет! Совсем нет. У нас есть очередь."
2300815-11 = "Но я довольно часто вызываюсь сама, потому что у всех очень плотный график."
2300815-12 = "Обычно я не одна, но сегодня больше никто не был свободен."
2300815-13 = "[s] «Ты действительно очень трудолюбивая, Мари.»"
2300815-14 = "Хи-хи. Я всегда рада, когда могу помочь, каким бы маленьким ни было поручение."
2300815-15 = "В таких больших торговых центрах всегда есть на что посмотреть, так что это даже довольно весело!"
2300815-16 = "Например, вон там. Посмотрите на этих очаровательных кукол, Сенсей!"
2300815-17 = "А в том магазине красивая одежда."
2300815-18 = "И эти аксессуары тоже очень милые."
2300815-19 = "[ns] «(Я ещё никогда не видел Мари такой.)»"
2300815-20 = "Эй, вы двое! Отлично проводите время вместе, правда?"
2300815-21 = "Э-Э?! В-В-Вы к нам обращаетесь?"
2300815-22 = "А вы видите здесь кого-то ещё? Хо-хо-хо!"
2300815-23 = "Подходите, посмотрите наши аксессуары! Все девушки их обожают!"
2300815-24 = "А-Аксессуары..."
2300815-25 = "Сейчас это последний писк моды! Ну же! Я даже скидку вам сделаю!"
2300815-26 = "[ns] «Почему бы тебе что-нибудь не выбрать?»"
2300815-28 = "А?! М-Мне? Аксессуар?!"
2300815-29 = "[s1] «Я хочу что-нибудь тебе подарить за то, как усердно ты всегда работаешь.»\n[s2] «Просто выбери то, что тебе нравится!»"
2300815-32 = "А-Ах..."
2300815-33 = ""
2300815-35 = ""
2300815-36 = ""
2300815-37 = ""
2300815-38 = "Я-Я не могу."
2300815-39 = ""
2300815-42 = "Э-Эм... Я правда очень ценю ваши мысли и чувства, но..."
2300815-43 = "Как сестра, я не могу позволять себе ненужную расточительность и роскошь..."
2300815-44 = "К-Конечно, аксессуары здесь очень красивые, и должна признать, мне бы хотелось один, но..."
2300815-45 = "[s] «А как же корсаж, который ты носишь?»"
2300815-46 = "Ах... В-Вы имеете в виду... этот?"
2300815-47 = ""
2300815-49 = ""
2300815-50 = "Этот корсаж..."
2300815-51 = "Я купила его как напоминание никогда не забывать обеты Сестринства."
2300815-52 = "Я хотела заключить чувства, которые испытывала, когда вступила на этот путь, в этот белый цветок, который никогда не увянет."
2300815-53 = "[s] «Понятно...»"
2300815-54 = ""
2300815-56 = ""
2300815-57 = ""
2300815-58 = "...Сенсей... Можно мне говорить откровенно?"
2300815-59 = "[s] «Со мной — всегда.»"
2300815-60 = ""
2300815-62 = ""
2300815-63 = "Пусть это и не исповедальня, но я всё равно чувствую, что должна быть честной."
2300815-64 = "Этот корсаж..."
2300815-65 = "Я-Я... действительно купила его потому, что он показался мне красивым."
2300815-66 = "[s] «Хм?»"
2300815-67 = "Его главное назначение — напоминать мне оставаться верной своему сердцу!"
2300815-68 = "Но мне ещё и понравилось, как он выглядит..."
2300815-69 = ""
2300815-72 = "Как я уже говорила, добродетели сестры — бережливость и самоотверженность..."
2300815-73 = "Но мне всё равно интересны аксессуары и подобные вещи. Иногда мне даже хочется наряжаться, как другим студентам."
2300815-74 = "В-Вот почему мне нравится носить этот корсаж."
2300815-75 = "*вздыхает* Я не только поддаюсь мирским желаниям, но ещё и придумываю им оправдания..."
2300815-76 = "Меня следовало бы заставить отречься от обетов."
2300815-77 = "..."
2300815-78 = "Хотя... рассказав вам свой секрет, я действительно почувствовала себя немного спокойнее."
2300815-79 = "[s] «Значит, для тебя этот корсаж — настоящая роскошь.»"
2300815-80 = "Есть..."
2300815-81 = "П-Пожалуйста, скажите, о чём думаете, Сенсей. Вы... разочарованы во мне?"
2300815-82 = "[s] «Ух. Какая же ты милая...»"
2300815-83 = "П-Простите?!"
2300815-84 = "[s3] «Я думаю, это совершенно нормально.»\n[s4] «Я уже говорил тебе. Ты и сестра, И студент.»"
2300815-87 = "П-Правда? Это... нормально?"
2300815-88 = "[s5] «Ты всё ещё молода, Мари.»\n[s6] «Нет ничего плохого в том, чтобы наряжаться или любить милые вещи.»"
2300815-91 = "Я... понимаю."
2300815-92 = "Мне так спокойно от того, что вы это сказали."
2300815-93 = "Что допустимо, а что нет..."
2300815-94 = "...похоже, мне ещё только предстоит это понять. Хи-хи."
2300815-95 = "Пока что мне остаётся просто принять ваши слова и быть за них благодарной."
2300815-96 = "Одного этого корсажа мне будет достаточно."
2300815-97 = "[s] «Тогда, может, я лучше угощу тебя чем-нибудь вкусным?»"
2300815-98 = "Правда... Вы всё никак не перестанете отдавать, даже после всего, что я уже от вас получила."
2300815-99 = "..."
2300815-100 = ""
2300815-102 = ""
2300815-104 = ""
2300815-105 = ""
2300815-106 = "В таком случае... да. Пожалуйста."
2300815-108 = "Мы с Мари вместе вкусно поели, после чего я вернулся домой."
