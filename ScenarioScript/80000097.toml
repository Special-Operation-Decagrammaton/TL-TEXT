80000097-8 = ""
80000097-10 = ""
80000097-11 = ""
80000097-12 = ""
80000097-13 = "Я позвала вас сюда... из-за этого..."
80000097-14 = "[s1] «...Шоколад?»\n[s2] «А-а. Теперь понятно...»"
80000097-17 = "Да, знаю. Я опоздала на несколько дней."
