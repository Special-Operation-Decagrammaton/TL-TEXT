80000097-20 = "...решила хотя бы раз не переосмысливать всё до бесконечности. Просто последую сердцу."
80000097-21 = "Простите, если всё это лишнее... Но я надеялась, что вы поймёте."
80000097-22 = "[s3] «Конечно. Спасибо.»\n[s4] «Я знаю, что ты занята, Сакурако. Поэтому спасибо, что нашла время.»"
80000097-25 = "П-Понятно... Я правда рада это слышать."
80000097-26 = "Е-Есть.... ещё кое-что..."
80000097-27 = "[s5] «...Хм? А это что?»\n[s6] «Что такое? Тебя что-то тревожит?»"
80000097-30 = "Ну... Видите ли... Я..."
80000097-31 = "В этот раз я не обращалась ни к кому за советом и не перелопачивала интернет."
80000097-32 = "Я специально избегала популярных трендов вроде Очков Пришельца или Танца Choco Time..."
80000097-33 = "[s7] «(Очки пришельца? Какое ещё „Шоко-время“?)»\n[s8] «(...Что это вообще такое?)»"
80000097-36 = "Ну..."
80000097-37 = "То, что я вам дала, возможно, совсем не модное..."
80000097-38 = "Скорее наоборот, если честно..."
80000097-39 = "...Мне правда очень жаль."
80000097-40 = ""
80000097-43 = "[ns] «Сакурако.»"
80000097-45 = "[ns9] «Идеально! Именно так и нужно мыслить!»\n[ns10] «Не делай то, что велят другие! Верь своим чувствам!»"
80000097-48 = "А-А? Эм... Сенсей?"
