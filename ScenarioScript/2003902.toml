[translation]
2003902-1 = "Прятки в Старом дворце"
2003902-2 = "Главный зал Генрюмона"
2003902-4 = "Меня здесь заточили!"
2003902-5 = "[s1] «Вот так внезапно, ни с того ни с сего?!»\n[s2] «Но почему?!»"
2003902-8 = "Хм. Это связано с внутренними делами Гэнрюмон... сложными политическими вопросами. Объяснить вам всё целиком было бы непросто."
2003902-9 = "Здесь замешаны такие фракции, как Променад Чёрной Черепахи, а также достоинство Шаньхайцзина как академии Кивотоса."
2003902-10 = "Кроме того, свою роль сыграли постоянный рост процентных ставок и налогов, отсутствие восстановления доходов населения, а также крах государственного образования. Целый зверинец проблем, обрушивающихся одна на другую."
2003902-11 = "Мы добрались до самой глубины этого конфликта, и выхода пока не видно."
2003902-12 = "[s] «Я вообще ничего не понимаю.»"
2003902-13 = "Хм. Как и ожидалось."
2003902-14 = "[s] «Даже этот ответ. Всё равно не понимаю.»"
2003902-15 = "Порой действие важнее понимания. Вы согласны?"
2003902-16 = "Мы должны устремить взгляд к небу и подняться по ступеням высокой горы."
2003902-17 = "Проще говоря, вы, как педагог, должны исполнить свой долг и помочь мне преодолеть эти обстоятельства. Сенсей!"
2003902-18 = "[s] «Короче говоря, ты хочешь, чтобы я вытащил тебя отсюда...?»"
2003902-19 = "Хм. Какое счастье иметь друга, способного так быстро понять мои нужды."
2003902-20 = "Однако тайно сбежать из Риккагаку, самой штаб-квартиры Гэнрюмон, было бы безрассудством. По крайней мере без плана."
2003902-21 = "Поэтому, разумеется, я его подготовила."
2003902-22 = ""
2003902-25 = "[ns] «Это что...?!»"
2003902-26 = "Да. Вот он."
2003902-27 = ""
2003902-29 = ""
2003902-33 = ""
2003902-34 = "Итак, покинем это место тихо."
2003902-37 = "Нам удалось успешно выбраться из главного зала."
2003902-38 = "Но эта зона выглядит ещё опаснее?"
2003902-39 = "Хотя критика и неприятна, вы правы, Сенсей. Это самый центр Риккагаку."
2003902-40 = "Патрули здесь действуют по очень строгим графикам и ротациям."
2003902-41 = ""
2003902-44 = ""
2003902-45 = "А...? Сейчас ведь дежурю только я."
2003902-46 = "Что происходит? Я неправильно прочитала расписание?"
2003902-47 = "Нет... Член Гэнрюмон, которому доверена охрана, никогда бы не допустил такой новичковой ошибки!"
2003902-48 = "Я могу не знать всех подробностей о каждом участнике, но вас я не узнаю! Это тайная операция Променада Чёрной Черепахи?!"
2003902-49 = "Э-эм...!"
2003902-50 = "[ns] «(Кисаки... в опасности!)»"
2003902-52 = "[ns3] «А! Вы познакомились с моей охранницей! С-с моим проводником!»\n[ns4] «Да! Именно так!»"
2003902-55 = "О, Сенсей? Вы тоже здесь..."
2003902-56 = "П-простите! Прошу, не обижайтесь, что я вас не узнала! Я так зациклилась на возможной ошибке в ротации патруля!"
2003902-57 = "...Но если подумать, это немного странно. Зачем вам защита Гэнрюмон в самом сердце Риккагаку, Сенсей?"
2003902-58 = "[s] «Это... Это потому что...!»"
2003902-59 = "Это дополнительная мера безопасности под видом охраны."
2003902-60 = "Мера безопасности...? О!"
2003902-61 = "То есть это секретный приказ непосредственно от президента...?"
2003902-62 = "Именно так."
2003902-63 = "П-простите, Сенсей!"
2003902-64 = "Уверена, вы уже освоились, но, пожалуйста, насладитесь всем, что может предложить Гэнрюмон, сполна!"
2003902-65 = ""
2003902-67 = ""
2003902-68 = "Вы помогли нам преодолеть первое препятствие. Фу-фу."
2003902-69 = "Отличная работа, Сенсей. Если нам удастся избежать обнаружения и покинуть Риккагаку..."
2003902-70 = "...это будет для нас весьма впечатляющей победой."
2003902-72 = "Побег Кисаки из заточения(?) продолжился в том же духе..."
2003902-74 = ""
2003902-75 = "[ns] «Сюда направляется начальник охраны!»"
2003902-76 = "Новость о том, что вас сопровождает член Гэнрюмон, уже должна была разойтись по всему Риккагаку, Сенсей..."
2003902-77 = "А значит, этому самому члену Гэнрюмон будет почти невозможно покинуть территорию."
2003902-78 = "В этом случае нам придётся прибегнуть к другому методу."
2003902-79 = ""
2003902-81 = ""
2003902-85 = ""
2003902-87 = ""
2003902-88 = "Что?! Что здесь делает член Променада Чёрной Черепахи?!"
2003902-89 = "Немедленно убирайся отсюда!"
2003902-90 = "Фу-фу. Как и ожидалось. Побежим?"
2003902-91 = ""
2003902-93 = ""
2003902-94 = ""
2003902-96 = "Каким-то образом нам удалось выбраться из самого сердца Риккагаку."
2003902-97 = "Но член Променада Чёрной Черепахи, разгуливающий по улицам Риккагаку, вызовет немало подозрений."
2003902-98 = "Мне нужно стать кем-то, чьё присутствие рядом с вами не вызовет ни единого лишнего взгляда, Сенсей."
2003902-99 = "[s] «Это вообще возможно?!»"
2003902-100 = "Фу-фу. Конечно. Это..."
2003902-101 = ""
2003902-103 = ""
2003902-107 = ""
2003902-108 = "Здравствуйте, Сенсей! Я Кики! Сегодня мы гуляем за пределами Сада Цветущей Сливы, правда, Сенсей?"
2003902-109 = "[s5] «...»\n[s6] «Ладно... Пусть будет так...»"
2003902-112 = "Ура! Кики больше всех любит Сенсея!"
2003902-113 = ""
2003902-119 = "Эм, Сенсей? Почему вы здесь...? А, понятно. Вы играете с детьми из Сада Цветущей Сливы."
2003902-120 = "Спасибо за ваши труды. А ты — не доставляй Сенсею хлопот!"
2003902-121 = "Не волнуйтесь! Инструктор Шун уже сказала мне то же самое!"
2003902-122 = "[s7] «...»\n[s8] «Не... переживай об этом...»"
2003902-125 = "Хорошо, спасибо."
2003902-126 = "(...А? Но...)"
2003902-127 = "(Почему у меня только что мороз пробежал по коже...?)"
2003902-129 = ""
2003902-130 = "[ns] «Ну что... мы понемногу приближаемся к цели?»"
2003902-131 = "Хм."
2003902-132 = ""
2003902-134 = ""
2003902-136 = ""
2003902-137 = "Фу-фу. Отличная работа, Сенсей."
2003902-138 = "Я искренне благодарна вам за помощь в моей игре в побег— Кхм! То есть в побеге из заточения."
2003902-139 = "А? Меня правда держали взаперти?"
2003902-140 = "..."
2003902-141 = "Почему вы задаёте такой вопрос, Сенсей?"
2003902-142 = "Не похоже, чтобы члены Гэнрюмон действительно искали меня в Риккагаку или на соседних улицах...?"
2003902-143 = ""
2003902-145 = ""
2003902-146 = "Полагаю, пытаться скрыть от вас правду бесполезно, Сенсей."
2003902-147 = "Всё это было частью моей большой игры."
2003902-148 = "Но уже давно я не развлекалась настолько хорошо."
2003902-149 = "[s9] «То есть...?!»\n[s10] «Ты меня обманула, Кисаки! Обманула!»"
2003902-152 = "Фу-фу. Да, похоже на то."
2003902-153 = "Но, Сенсей. Президент Гэнрюмон... вернее, президенты студсоветов каждой академии..."
2003902-154 = "...разве не находятся каждый в своего рода заточении?"
2003902-155 = "Если следовать этой логике, время от времени таким президентам требуется наставление, скажем так, «педагогического» характера."
2003902-156 = "[s] «Нельзя просто вставить слово 'педагогический' и сделать всё приемлемым!»"
2003902-157 = "Фу-фу. Полагаю, можно считать это манипуляцией ради моих интересов."
2003902-158 = "Не беспокойтесь. Я обязательно отплачу вам за доброту—"
2003902-159 = "[s] «Нет. Мне тоже было весело.»"
2003902-160 = "В-вот как...?"
2003902-161 = "Порой вы говорите вещи, на которые я не могу подобрать достойного ответа."
2003902-162 = "Тогда, Сенсей..."
2003902-163 = "Только на сегодняшний день... можем мы продолжить этот наш спектакль?"
2003902-165 = "Президент! Президент! Где вы?! Президент!"
2003902-166 = ""
2003902-168 = ""
2003902-169 = "Ах. Похоже, отсутствие президента Гэнрюмон быстро заметили."
2003902-170 = "Впрочем, я предполагала, что так и будет..."
2003902-171 = ""
2003902-173 = ""
2003902-174 = ""
2003902-175 = "Ну что же, Сенсей. Пойдём?"
2003902-176 = "[s] «А? Куда мы идём?»"
2003902-177 = "Разумеется, обратно в Гэнрюмон."
2003902-178 = "Фу-фу. Разве это отменяет мою просьбу продолжить наш спектакль?"
2003902-179 = "Конечно... если вы откажете мне и вернётесь, Сенсей, у меня не будет ни возможности, ни причины вас останавливать."
2003902-180 = "[s] «Ты играешь нечестно, Кисаки!»"
2003902-181 = "Фу-фу. Я знаю. Но я должна пользоваться президентскими привилегиями, когда обстоятельства это позволяют."
2003902-182 = "Ну что же."
2003902-183 = "Оставшееся нам время... надеюсь на плодотворное сотрудничество, Сенсей."
2003902-185 = "Вот так я оказался в заточении(?) в Гэнрюмон вместе с Кисаки..."
