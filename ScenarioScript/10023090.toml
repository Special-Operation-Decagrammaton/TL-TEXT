10023090-21 = ""
10023090-22 = "...У меня до сих пор руки дрожат. О боже."
10023090-24 = "Ты потрясающая, Юзу! Ни один охранник тебя не заметил!"
10023090-25 = "Удалось разведать путь впереди? Как там всё выглядит?"
10023090-27 = "Да. Поначалу охрана была довольно слабой."
10023090-28 = "Но потом я добралась до главной двери..."
10023090-29 = "...Я заглянула внутрь, когда кто-то выходил, и там повсюду были охранники."
10023090-30 = "В итоге другого выбора у нас нет, верно, Сенсей?"
10023090-31 = "[s1] «Приводим в действие план отвлекающей атаки!»\n[s2] «Благородная Воровка займёт позицию и подаст сигнал.»\n[s3] «Через пять минут — наша очередь!»"
10023090-35 = "Пока их внимание будет разделено, мы сможем выполнить свою миссию!"
10023090-36 = "Нам остаётся только идти вперёд! План отвлекающей атаки — начать!"
10023090-42 = "Казалось, время растянулось в ночи на целую вечность..."
10023090-46 = ""
10023090-47 = "Наконец за особняком мы увидели нечто похожее на пламя, взметнувшееся в небо."
10023090-49 = "А? Мэйтаро что-нибудь говорил о фейерверке сегодня ночью?"
10023090-50 = "Я ничего такого не слышала..."
10023090-51 = ""
10023090-56 = "Пламя превратилось в фейерверк и взорвалось ослепительным посланием в ночном небе."
10023090-57 = "Там было написано: «Благородная Воровка»!"
10023090-58 = ""
10023090-60 = ""
10023090-61 = "Это она! Воровка!"
10023090-62 = "Всем собраться! Схватить Благородную Воровку!"
10023090-63 = ""
10023090-65 = ""
10023090-68 = "Это был... сигнал. Сенсей..."
10023090-69 = "[s] «У меня нет слов. По крайней мере, получилось эффектно.»"
10023090-71 = "Она ведь сказала, что мы его точно не пропустим."
10023090-72 = "Готовимся выдвигаться."
10023090-73 = "Арис, ты готова?"
10023090-75 = "Герои всегда готовы!"
10023090-76 = "Я пройду эти события вместе с членами отряда, получу много опыта... и повышу уровень!"
10023090-80 = "Вы что-то слышали? Эй! Кто там?"
10023090-81 = "Что такое? У нас и без того дел по горло."
10023090-83 = ""
10023090-84 = "Слепящий Свет!"
10023090-85 = ""
10023090-88 = ""
10023090-89 = "!!"
10023090-93 = ""
10023090-94 = ""
10023090-97 = "Начинаем нашу часть плана!"
10023090-98 = ""
10023090-101 = ""
10023090-102 = "Нам нужно двигаться быстро."
