90001140-528 = "Рио. Я..."
90001140-529 = ""
90001140-531 = ""
90001140-532 = ""
90001140-533 = "Угх, я...!"
90001140-535 = "Кья! Как странно! Мне трудно произносить слова, которые я хочу сказать! На мой навык речи наложили дебафф?!"
90001140-537 = "Всё хорошо, всё хорошо. Такие вещи... всем трудно говорить."
90001140-538 = "Фуфу... Какая хорошая атмосфера. Вы не согласны, Сенсей?"
90001140-539 = "[s3] «Давно я не видел настолько трогательной сцены.»\n[s4] «Хотя, если подумать, в этот раз прошло не так уж и много времени.»"
