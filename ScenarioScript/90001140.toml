90001140-504 = ""
90001140-506 = ""
90001140-507 = ""
90001140-508 = "Я очень рада, что ты стала так заботиться об остальных."
90001140-509 = "Но мне очень грустно слышать, что себя ты в этот список не включаешь."
90001140-510 = "Поэтому я..."
90001140-511 = ""
90001140-513 = ""
90001140-515 = "Я хочу, чтобы ты дала шанс и самой себе, Рио!"
90001140-516 = ""
90001140-518 = ""
90001140-520 = "Потому что какой бы сложной ни была игра, во втором прохождении всегда можно сыграть лучше!"
90001140-521 = ""
90001140-523 = ""
90001140-525 = "Верно. Хороший пример, Алиса."
