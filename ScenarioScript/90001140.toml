[translation]
90001140-1 = "Эпизод 14;Союзники"
90001140-3 = ""
90001140-4 = "А? Сенсей? Что-то случилось?"
90001140-5 = "[s] «Рио уже должна скоро прибыть.»"
90001140-6 = "До назначенного времени ещё пять минут."
90001140-7 = ""
90001140-9 = ""
90001140-10 = "Пожалуй, этого уже достаточно, чтобы начать ждать её появления?"
90001140-11 = "Хм. Однако, если речь о Рио, полагаю, она прибудет ровно вовремя. Ни на секунду позже."
90001140-12 = "А в крайне редких случаях — на минуту раньше."
90001140-13 = "[s] «Химари? Тебе не холодно?»"
90001140-14 = ""
90001140-16 = ""
90001140-17 = "Да. Холодно. Невыносимо, если точнее. Я замёрзла сильнее, чем изящный цветок на утёсе, прямо попавший под утренний иней!"
90001140-18 = "...Может, тебе лучше остаться внутри? Хотя предложение вполне разумное, для этого особого случая я сделаю исключение."
90001140-19 = "Она не только свалила на меня эту работу, но ещё и решила исчезнуть по собственной воле!"
90001140-20 = "Если меня не будет здесь, чтобы встретить президента, которая наконец-то соизволила показаться..."
90001140-21 = ""
90001140-23 = ""
90001140-24 = "...раздражение и злость не дадут мне уснуть всю ночь!"
90001140-26 = "...Было бы проще, если бы ты просто честно призналась, что рада увидеть её после столь долгого времени."
90001140-27 = "Это неправда! Ты ошибаешься! Ты совершенно меня не понимаешь!"
90001140-28 = "Не могу поверить, что мы столько времени провели вместе, а ты всё ещё не понимаешь, что я за человек, Эйми!"
90001140-29 = "(Вообще-то я сказала это как раз потому, что слишком хорошо тебя знаю...)"
90001140-30 = "Как бы то ни было, произошло многое."
90001140-31 = "И хотя я присоединилась уже на полпути..."
90001140-32 = "...я с уверенностью могу сказать, что моя связь с президентом Химари и Эйми ничуть не слабее, чем у остальных."
90001140-33 = "[s] «Ого, сколько уверенности.»"
90001140-34 = "Конечно, Сенсей. Однажды мне сказали, что при достаточной страсти и грубой силе такие вещи как-нибудь да складываются."
90001140-35 = "Кто сказал?"
90001140-36 = "Момои."
90001140-37 = ""
90001140-39 = ""
90001140-40 = "А. Да. Тогда понятно."
90001140-42 = "Если оглянуться назад, именно Рио создала Отряда Исследования Сверхъестественного."
90001140-43 = "Декаграмматон..."
90001140-46 = "«Целью было исследовать божество, доказать его существование и, если возможно, проанализировать его устройство. Если такое возможно, значит, его можно воспроизвести. Так можно создать нового бога.»"
90001140-47 = "На основе этой гипотезы была создана Система Автономного Анализа Абсолютного Существа."
90001140-48 = "Иными словами, это искусственный интеллект, ищущий божественность."
90001140-49 = ""
90001140-51 = "Изначально здесь были только я и президент."
90001140-52 = "Потом Эйми привела Сенсея."
90001140-53 = "Мы побывали в пустыне, на фабрике, в руинах... и наконец здесь."
90001140-55 = "Мне нечего особенного добавить, поэтому я просто вмешиваюсь в разговор. Иначе пришлось бы без дела сидеть в стороне, а это скучно."
90001140-56 = "[s] «...Иди сюда, Токи. Я подержу тебя за руку.»"
90001140-57 = "Спасибо."
90001140-58 = ""
90001140-60 = ""
90001140-62 = ""
90001140-63 = "Почему-то это кажется нечестным. Я тоже, я тоже."
90001140-64 = "Вы двое что, питомцы Сенсея?"
90001140-65 = "В любом случае, я отказываюсь предаваться скучной ностальгии и болтать о том, как «столько всего произошло», или что «время так быстро пролетело»."
90001140-66 = "Это совершенно не подходит образу хрупкой, но прекрасной гениальной хакерши вроде меня. И портит атмосферу."
90001140-67 = "Как и эффективный взлом, всё в жизни нужно делать быстро и чисто, не оставляя последствий."
90001140-68 = ""
90001140-72 = ""
90001140-73 = "Похоже, она прибыла, пока мы разговаривали."
90001140-75 = "...?"
90001140-76 = ""
90001140-85 = ""
90001140-86 = "..."
90001140-87 = "..."
90001140-88 = "..."
90001140-89 = "?"
90001140-90 = ""
90001140-92 = ""
90001140-93 = "Ты прибыла на довольно показном транспорте, не находишь?"
90001140-94 = "Мой транспортный корабль? Ничего особенного. Говорят, большое может выполнить задачу малого."
90001140-95 = "Здесь всё ещё есть что улучшать. У меня не было времени как следует оснастить корабль всем, что может понадобиться для этой миссии."
90001140-96 = "Да-да. Будем считать, что ты сделала всё, что могла."
90001140-97 = "[s] «Добро пожаловать, Рио. Мы тебя ждали.»"
90001140-98 = ""
90001140-100 = ""
90001140-101 = "Сенсей..."
90001140-102 = "Эм, я..."
90001140-104 = "Добро пожаловать, госпожа Рио. Мы ждали ровно пять минут."
90001140-106 = "Токи..."
90001140-107 = ""
90001140-109 = ""
90001140-110 = ""
90001140-111 = "...ты нашла своё предназначение?"
90001140-112 = "Моё предназначение...?"
90001140-113 = "Я..."
90001140-114 = "Нет, всё в порядке. Не нужно отвечать, если это слишком трудно."
90001140-115 = "Достаточно увидеть тебя сейчас, чтобы я уже знала ответ."
90001140-116 = ""
90001140-118 = ""
90001140-119 = "Вот как?"
90001140-120 = "Да... Я уже говорила это раньше, но позвольте мне повторить ещё раз."
90001140-121 = ""
90001140-123 = ""
90001140-124 = "Прости, Токи. Я полностью беру на себя ответственность за всё, что произошло."
90001140-125 = ""
90001140-128 = ""
90001140-130 = ""
90001140-132 = ""
90001140-133 = "Что...?"
90001140-135 = "Вы повзрослели, госпожа Рио."
90001140-136 = "[s] «Давно я не видел настолько трогательной сцены.»"
90001140-138 = "...Не дразните меня слишком сильно, Сенсей."
90001140-139 = "Вы не дразните меня...? Р-Разве так не ещё хуже...?"
90001140-140 = "Хм? Вы хотите сказать мне что-то ещё? Что именно?"
90001140-141 = "[s] «Послушай, Рио. Приготовься к тому, что я сейчас скажу.»"
90001140-142 = "Что? Завтра конец света? А я не получила уведомление?"
90001140-143 = "[s] «Не настолько всё серьёзно.»"
90001140-145 = "[ns] «Алиса и Отдел разработки игр уже направляются сюда.»"
90001140-146 = ""
90001140-148 = ""
90001140-149 = "...?"
90001140-150 = ""
90001140-152 = ""
90001140-153 = "...!"
90001140-154 = "Я бы предпочла, чтобы завтра наступил конец света!"
90001140-155 = ""
90001140-157 = ""
90001140-159 = ""
90001140-160 = "Эйми! Токи!"
90001140-161 = "Поняла!"
90001140-162 = ""
90001140-166 = "Приступаю."
90001140-167 = ""
90001140-171 = ""
90001140-175 = "Отпустите меня! Я ухожу!"
90001140-176 = "Токи! Кто угодно, но только не ты! Ты не можешь так со мной поступать!"
90001140-177 = "Простите, госпожа Рио. Сейчас я хочу поступить именно так."
90001140-178 = "Я не это имела в виду!"
90001140-179 = "Вы сказали, они будут здесь завтра! Завтра! Мы не об этом договаривались!"
90001140-180 = ""
90001140-184 = "Успокойся, Рио. Придут они сегодня или завтра — разве это действительно что-то меняет?"
90001140-185 = "Да! Ещё как! Я морально не готова к сегодняшнему дню! Мне нужно спланировать, что я скажу! И, прежде всего, совершенно нелогично менять утверждённое расписание без предварительного уведомления!"
90001140-186 = "Так уж сложились обстоятельства. И, что важнее, согласно астрологии, именно сегодня и именно в это время встреча будет наиболее благоприятной."
90001140-187 = "Ты всё ещё веришь в это бессмысленное гадание по созвездиям?!"
90001140-188 = "Как я всегда говорю, астрология — это огромная наука, объединяющая множество разных дисциплин..."
90001140-189 = "...включая небесную статистику и события, философию изменчивости судьбы, математику и физику!"
90001140-190 = ""
90001140-194 = "Сейчас это совершенно не имеет отношения к делу!"
90001140-195 = ""
90001140-202 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
90001140-203 = "[s] «...Ты в порядке, Рио?»"
90001140-204 = "...Я совсем не в порядке, Сенсей..."
90001140-205 = "К-Конечно, я... натворила дел... и должна... за них расплачиваться... но..."
90001140-206 = "...я просто не ожидала, что всё произойдёт так."
90001140-207 = ""
90001140-210 = "Рио посмотрела на меня с обидой в глазах."
90001140-211 = "Я понимал, почему она так себя чувствует, но всё равно это казалось немного несправедливым..."
90001140-212 = ""
90001140-215 = ""
90001140-217 = "Ах."
90001140-218 = "О."
90001140-220 = "Похоже, они как раз вовремя. Наши очаровательные младшекурсницы."
90001140-221 = "...!!!"
90001140-222 = ""
90001140-227 = "Прибыл вертолёт."
90001140-231 = "И первой из него выбежала..."
90001140-232 = ""
90001140-235 = "Сенсей!"
90001140-236 = ""
90001140-238 = ""
90001140-241 = "[ns] «Алиса!»"
90001140-242 = "Алиса со всей силы бросилась мне в объятия!"
90001140-243 = "Сенсей чуть не упал!"
90001140-246 = "Вы и правда здесь, Сенсей! Я ужасно по вам скучала!"
90001140-247 = "Добро пожаловать, очаровательная Алиса."
90001140-248 = "А, Токи! Привет!"
90001140-250 = "Привет, Алиса."
90001140-251 = ""
90001140-253 = ""
90001140-254 = "Эм... Эйми, тебе не холодно? Даже мне холодно, хотя я так тепло укутана!"
90001140-255 = "Совсем нет. На самом деле мне нравится такая прохлада."
90001140-256 = "Р-Рада это слышать..."
90001140-257 = ""
90001140-259 = ""
90001140-261 = "Добро пожаловать, Алиса и все из Отдела разработки игр."
90001140-262 = ""
90001140-264 = ""
90001140-265 = "Химари! Как вы поживали? Ваш жёлтый пиджак очень красивый!"
90001140-266 = "О боже. Спасибо. Ты и правда просто прелесть, Алиса."
90001140-268 = "Ура-а-а! Мы приехали, Сенсей!"
90001140-269 = "И... эм... все остальные. Давно не виделись..."
90001140-270 = "Привет, Сенсей... Добраться сюда было... так тяжело..."
90001140-271 = "Сначала я думала, что мы просто весело прокатимся на поезде. Но потом пришлось пересаживаться на кучу разного транспорта, пока мы не оказались в вертолёте... а ещё было так холодно..."
90001140-272 = "И хуже всего — дорога заняла целых три дня..."
90001140-274 = "Фуфу... Это было похоже на долгое путешествие в видеоигре..."
90001140-275 = ""
90001140-277 = ""
90001140-278 = "А-А-А! Что...? Почему?"
90001140-279 = "[s] «Ты в порядке?»"
90001140-280 = "Да, я в порядке... Уааа, вы не шутили, когда говорили, что здесь холодно."
90001140-281 = "[s] «Но посмотрите на себя — какие вы милые во всей этой зимней одежде!»"
90001140-282 = "Спасибо, Сенсей! Мидори выбрала нам одежду! Дизайн очень похож на экипировку из игры, которую мы разрабатываем!"
90001140-283 = "Да! Это приключенческая экшен-головоломка-пошаговый-шутер, действие которой происходит в Ледниковом море!"
90001140-284 = "[s] «...И игра... хорошая?»"
90001140-285 = ""
90001140-287 = ""
90001140-288 = "К-К-Конечно! За кого вы меня принимаете, Сенсей?!"
90001140-289 = "*вздыхает*"
90001140-291 = "Так-так. Нам пора двигаться, но осталось представить ещё одного..."
90001140-292 = ""
90001140-294 = ""
90001140-295 = "...участника?"
90001140-296 = ""
90001140-298 = ""
90001140-301 = ""
90001140-302 = "Здравствуйте. Я — ИИ-помощник оперативной поддержки этой базы в Ледниковом море. Благодарю вас, участницы Отдела разработки игр, за то, что проделали весь этот путь."
90001140-303 = ""
90001140-306 = ""
90001140-307 = "..."
90001140-308 = "..."
90001140-309 = ""
90001140-312 = ""
90001140-313 = "Я больше не могу..."
90001140-315 = "И-ИИ? Дрон? А, это! Как тот босс, который в видеоиграх всегда пытается уничтожить человечество?!"
90001140-316 = "Сестрёнка, это уже немного..."
90001140-317 = "Но я же абсолютно права, разве нет? Ради этого мы сюда и приехали!"
90001140-318 = "Мы должны сразиться с каким-то загадочным ИИ, который создал гигантского робота, чтобы драться с нами и исполнить свои ещё более загадочные цели!"
90001140-320 = "Т-теперь, когда вы сказали..."
90001140-321 = "Нет, девочки. Всё не так. Видите ли... Как бы это объяснить?"
90001140-323 = "Не беспокойтесь. Я была создана, чтобы помогать вам, и исполню свою роль. Поэтому—"
90001140-324 = ""
90001140-326 = ""
90001140-327 = "Рио! Это Рио!"
90001140-328 = ""
90001140-330 = ""
90001140-332 = ""
90001140-333 = "Что? Как в прошлый раз?!"
90001140-334 = "Рио, ты...?"
90001140-336 = "Это... что... какая-то шутка?"
90001140-338 = "Я-Я не Цукацуки Рио, но..."
90001140-339 = "Я очень рада снова тебя видеть, Рио! Как ты поживала?"
90001140-340 = "..."
90001140-341 = "Пусть даже только по видеосвязи, я хотела бы увидеть твоё лицо! Как в прошлый раз! Сегодня это невозможно?"
90001140-342 = "Это..."
90001140-343 = "Всё хорошо! Я знаю, что у тебя всегда много обязанностей, поэтому наверняка что-то очень важное мешает тебе сейчас поздороваться."
90001140-344 = "...!!!"
90001140-345 = "И всё же... немного грустно. Когда я услышала, что Сенсей и все остальные будут здесь, я очень надеялась увидеть и тебя!"
90001140-346 = "Ух...!"
90001140-347 = ""
90001140-349 = ""
90001140-351 = "[ns] «Подожди здесь секундочку!»"
90001140-352 = ""
90001140-354 = ""
90001140-355 = "Что...?"
90001140-356 = ""
90001140-363 = ""
90001140-364 = "С-Сенсей..."
90001140-365 = ""
90001140-367 = ""
90001140-369 = ""
90001140-370 = "[ns] «Пойдём, Рио.»"
90001140-371 = "Но... но...!"
90001140-372 = "[s1] «Всё хорошо. Я буду рядом.»\n[s2] «Сейчас самое время набраться смелости.»"
90001140-375 = "...!"
90001140-376 = ""
90001140-378 = ""
90001140-379 = "Х-Хорошо...!"
90001140-381 = "Я взял Рио за руку и пошёл обратно наружу."
90001140-382 = "Я с облегчением заметил, что она пошла за мной."
90001140-386 = ""
90001140-388 = ""
90001140-389 = "А! Это госпожа Рио!"
90001140-390 = "Эм... Значит, в таких ситуациях я должна..."
90001140-391 = "Здравствуйте, госпожа Рио. Давно не виделись... во многих смыслах."
90001140-392 = "А-а... Эм... Э-э... З-Здравствуйте, госпожа Рио...?"
90001140-393 = ""
90001140-396 = ""
90001140-397 = ""
90001140-399 = "Рио!"
90001140-400 = ""
90001140-403 = ""
90001140-404 = "А...?!"
90001140-405 = ""
90001140-407 = ""
90001140-409 = "Понятно. С очаровательной Алисой такое часто случается."
90001140-410 = "К тому же у неё очень удобный рост для поглаживаний по голове. Возможно, это поможет тебе успокоиться, Рио."
90001140-411 = ""
90001140-413 = "В-вот как...?"
90001140-415 = "Эй! Почему из нас всех только Алису вы называете очаровательной?"
90001140-416 = "Понятно. Тогда отныне я буду называть тебя «Шумомои»."
90001140-417 = "Ладно. Забудь."
90001140-420 = ""
90001140-421 = "Госпожа Рио. У меня много вопросов, но есть один действительно важный."
90001140-422 = ""
90001140-424 = ""
90001140-425 = ""
90001140-426 = "Если бы мы снова оказались в похожей ситуации и мир можно было бы спасти, пожертвовав одним человеком, вы бы снова так поступили?"
90001140-427 = ""
90001140-429 = ""
90001140-430 = "..."
90001140-432 = "С-Сестрёнка...?"
90001140-433 = "Момои..."
90001140-435 = "Эм... Я всё это время была без сознания и знаю всё только с чужих слов, но разве госпожа Рио не говорила именно так?"
90001140-436 = ""
90001140-438 = ""
90001140-440 = ""
90001140-442 = "Ч-Что?! Почему вы все так на меня смотрите? В играх такое постоянно всплывает как раз тогда, когда уже успеваешь забыть, так что я просто опираюсь на прошлый опыт, ясно?!"
90001140-443 = "Я к тому, что не знаю, чем госпожа Рио занималась всё это время и что она собирается делать с Сенсеем!"
90001140-444 = "Но если её ценности остались такими же, как тогда, что будет, если мы столкнёмся с похожей проблемой? Она ведь придёт к похожему решению!"
90001140-445 = "..."
90001140-447 = "С-Сестрёнка. Это уже немного—"
90001140-448 = "Подожди, Мидори! Я имею право высказаться! Когда всё это происходило, я была в отключке!"
90001140-449 = ""
90001140-451 = ""
90001140-452 = "Вообще-то, если подумать, разве не Алиса тогда на меня напала?"
90001140-453 = "А если подумать ещё чуть-чуть... там ведь была и Кей, да? Подождите... Тогда как это вообще считать...?"
90001140-454 = ""
90001140-457 = ""
90001140-458 = "А-а! Мне очень жаль, Момои! Это была полностью моя вина!"
90001140-459 = "В-Всё нормально...! Это уже в прошлом, а главное — сейчас мы все снова вместе!"
90001140-460 = ""
90001140-462 = ""
90001140-464 = ""
90001140-465 = "..."
90001140-467 = "К-Короче! Как я и сказала, в играх такое происходит постоянно!"
90001140-468 = "Знаете, люди любят говорить, что меньшинством нужно пожертвовать ради общего блага, а потом поджимают хвост и убегают, если жертвой вдруг оказываются сами!"
90001140-469 = "Но вы были совсем не такой, госпожа Рио. Это я признаю."
90001140-472 = ""
90001140-473 = "Сам город исказится, преобразуясь в новую концепцию под названием Ковчег. А затем Кивотос..."
90001140-474 = "Это моя вина..."
90001140-475 = "Если бы я не поддалась собственной гордыне... Если бы не создала этот город... Я... Это я всё сделала..."
90001140-476 = "Значит, я должна это остановить..."
90001140-478 = "Ч-Что ты имеешь в виду?"
90001140-479 = "Я перегружу систему, чтобы остановить процесс."
90001140-480 = "Моя жизнь ничего не значит перед выживанием всего мира! Я обязана!"
90001140-481 = ""
90001140-483 = "Тогда..."
90001140-484 = "Поэтому я считаю, что мы заслуживаем знать, готовы ли вы и сейчас принять такое решение."
90001140-485 = "Просто в такой ситуации мы оказались."
90001140-486 = "Естественно, если моей жизнью можно остановить это разрушение, я не стану колебаться. Но..."
90001140-487 = "Если опасность будет грозить Алисе или Токи... или вообще кому угодно другому..."
90001140-488 = "...я до самого последнего мгновения буду искать другой способ. Правда, до самого-самого конца."
90001140-489 = "..."
90001140-490 = "Я всегда была склонна приходить к одному выводу и затем слепо следовать ему. Я считала это самым рациональным подходом."
90001140-491 = "Но теперь я знаю, что это не так. Если существует хотя бы малейшая возможность другого исхода, я должна попытаться за неё ухватиться."
90001140-492 = "...Потому что некоторые вещи уже невозможно обратить вспять."
90001140-493 = ""
90001140-495 = ""
90001140-497 = ""
90001140-498 = "Нет. Так нельзя, Рио."
