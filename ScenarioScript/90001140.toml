90001140-551 = "А продолжать мёртвый разговор неэффективно."
90001140-552 = "Согласна. Сложные темы вроде этой — слабое место госпожи Рио. Прошу простить её от моего имени."
90001140-553 = ""
90001140-556 = ""
90001140-557 = "Токи, я понимаю, что ты не хотела ничего плохого, но говорить такое при всех присутствующих... положение Рио становится немного..."
90001140-558 = ""
