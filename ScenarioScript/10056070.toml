[translation]
10056070-1 = "Episode 7;Blue Hole"
10056070-2 = "(Pushing through the waves, the boat kept moving forward.)"
10056070-6 = "Sensei, we are here."
10056070-7 = "This is the spot marked on the map."
10056070-13 = "(The boat stopped, so I went outside to take a look.)"
10056070-14 = "(In the middle of the vast ocean, that specific spot was dyed a deep blue, as if someone had dropped a different ink into the water.)"
10056070-15 = "[ns] \"...How mystical.\""
10056070-18 = "Yes... To look at, at least."
10056070-19 = "Blue holes are formed when caves and limestone caverns are submerged, #nso if you venture too deep inside, you might not be able to find your way back out."
10056070-20 = "That is precisely why it is worth the challenge, but you could also say it is just as dangerous."
10056070-21 = "That is why we need to prepare even more thoroughly than usual...!"
10056070-22 = "You are already so meticulous, how can you do even more than that?"
10056070-23 = "O-Of course!"
10056070-24 = "If we usually check twice, we just do it three times, and if three, then four times--"
10056070-25 = "At that rate, the sun will set..."
10056070-26 = "Let us decide who is going to dive first."
10056070-27 = "Yes! Yes, yes, yes! #nMe and Sayuri will go first!"
10056070-28 = "Makina?"
10056070-29 = "Yeah."
10056070-30 = "Part of this is my responsibility anyway..."
10056070-31 = "B-But we do not even know what kind of dangers are down there, so if anyone goes first, as the club president, I should..."
10056070-32 = "It is dangerous no matter who goes, right?"
10056070-33 = "Do not worry, it is fine. If it gets dangerous, we will come right back up."
10056070-37 = "Sayuri is fast~"
10056070-38 = "S-Take your time when surfacing, okay!?"
10056070-40 = "(Afterwards, amidst Kokoro's desperate pleas, Makina and Sayuri went into the sea.)"
10056070-44 = "(About an hour later)"
10056070-47 = "Phew..."
10056070-52 = "Welcome back. You returned sooner than I expected."
10056070-53 = "W-Was there some kind of problem?"
10056070-54 = "Nope, the diving went fine."
10056070-55 = "There were whales~"
10056070-56 = "[s] \"Whales?\""
10056070-57 = "A pod of humpback whales came swarming in, so we could not dive any deeper. #nAbout 60 meters down, I guess."
10056070-58 = "I have never seen anything like that anywhere else before... I wonder what happened?"
10056070-59 = "Maybe there is some predatory creature in even deeper waters. #nJust like that time we found a shark before."
10056070-60 = "It does not look like there are any dangerous creatures around, though."
10056070-61 = "It is Ruska...!"
10056070-62 = "I keep telling you that is an UMA."
10056070-67 = "Could it be... that the treasure we heard about back then..."
10056070-68 = "...President?"
10056070-72 = "N-It is nothing."
10056070-73 = "Anyway, good work. Next up is me and Kotone."
10056070-74 = "Got it."
10056070-80 = "Ah, a black-tailed gull."
10056070-81 = "...Yeah."
10056070-86 = "This time it is a flying fish~"
10056070-87 = "...True."
10056070-91 = "..."
10056070-92 = "[s] \"Is there something you want to say?\""
10056070-93 = "Eh? Ah, no."
10056070-94 = "Just waiting around like this makes me feel a bit restless."
10056070-99 = "...Hey."
10056070-100 = "Schale's Sensei has extra-judicial authority, right?"
10056070-101 = "Can you freely give orders and instructions to students?"
10056070-102 = "[s1] \"I... guess?\"\n[s2] \"Maybe institutionally speaking?\""
10056070-105 = "Then can you get whatever you want?"
10056070-106 = "Like forcefully taking 100,000 yen from a student."
10056070-107 = "[s3] \"There is no way I would do that...\"\n[s4] \"Even if I could, I would not want to...\""
10056070-110 = "Why do you have that kind of authority, yet you just listen to what students have to say?"
10056070-111 = "[s] \"For example?\""
10056070-112 = "Well, this whole situation could be resolved in a single word, right?"
10056070-113 = "You could just order us to stop diving and it would be over."
10056070-114 = "[s] \"Does Makina want to stop diving?\""
10056070-115 = "No way!"
10056070-116 = "But Island is having trouble because of us."
10056070-117 = "To Sensei, they are 'students' too, right?"
10056070-118 = "[s] \"That is right.\""
10056070-119 = "Even though you say it is for the students, I feel like you are just waiting for the students to solve it themselves."
10056070-120 = "Just watching students who are stuck and keep struggling--"
10056070-121 = "Does not that frustrate you?"
10056070-122 = "[s] \"There are times like that.\""
10056070-123 = "Is it bad for Sensei to come to a conclusion instead?"
10056070-124 = "[s5] \"It is bad.\"\n[s6] \"I do not have that kind of authority.\""
10056070-130 = "Why? You have the authority to command and instruct all students, right?"
10056070-131 = "[s7] \"That is merely the ability to 'instruct'.\"\n[s8] \"Because it is the students themselves who choose to accept those instructions.\""
10056070-134 = "Hmm...?#nIt feels like I am being given the runaround..."
10056070-135 = "I smell something fishy about this adult..."
10056070-136 = "Makina, Makina."
10056070-137 = "What is it? Did the president and the others come back up?"
10056070-138 = "No. Someone is coming this way from the horizon."
10056070-139 = "This is not a shipping lane, though?#nAnd it is way too far offshore to be a Trident patrol..."
10056070-140 = "...I know that flag."
10056070-144 = "That is--"
10056070-145 = "The Jiaolong of the Tidal Waters!?"
10056070-146 = "[s] \"If I recall, they are problematic students, right?\""
10056070-147 = "That is putting it mildly!"
10056070-148 = "The Jiaolong of the Tidal Waters is... no, they are the leaders of the most fierce pirate syndicate in Kivotos!"
10056070-149 = "Sensei, run--"
10056070-150 = "Actually, there is nowhere to run from this."
10056070-151 = "Let us hide for now!#nSayuri, contact the president and tell her pirates have appeared!"
10056070-152 = "Mayday, mayday!"
10056070-159 = "...[USERNAME] Sensei!"
10056070-160 = "Tch, when did they..."
10056070-161 = "They have already gotten quite close. It will be hard to go back by boat."
10056070-162 = "President, what should we do?"
10056070-163 = "Let us start with a buddy check. Any problems?"
10056070-164 = "No problems."
10056070-165 = "Sayuri. Makina said they were the Jiaolong of the Tidal Waters, right?"
10056070-166 = "Yeah. Sayuri saw the flag too."
10056070-167 = "I do not know when they managed to secure a fleet like that, but...#ntheir draft is shallow, so I doubt they are carrying heavy equipment."
10056070-168 = "Let us dive again to find our position--"
10056070-169 = "Instead of trying foolish tricks, giving up is much wiser for your own good."
10056070-170 = "Your partners and [USERNAME] Sensei are already in my hands."
10056070-174 = "Since when..."
10056070-177 = "I am sorry, President..."
10056070-178 = "I was trying to buy time until you guys came back up, but..."
10056070-179 = "I could not protect Sensei..."
10056070-180 = "[s9] \"Sorry, I let my guard down...\"\n[s10] \"They are not the type of people you can reason with...\""
10056070-183 = "I heard we were welcoming new subordinates, but I never expected it to include Schale's Sensei as well."
10056070-184 = "I feel like someone who opened an ordinary clam only to unexpectedly find a pearl inside."
10056070-190 = "Would you care to have a proper discussion with me first?"
10056070-191 = "Toumi Kokoro."
