[translation]
1012605-1 = "Неожиданное приглашение"
1012605-2 = "Спустя некоторое время я пришёл в студию звукозаписи. Каноэ уже ждала меня там."
1012605-3 = ""
1012605-6 = "Ты пришёл, Сенсей."
1012605-7 = "Садись. Я научу тебя пользоваться оборудованием."
1012605-8 = "Но сначала давай просто переведём дух и насладимся этим мгновением вместе. Только мы вдвоём. Хи-хи..."
1012605-9 = "[s] «М-Мы ведь просто будем записывать, да?»"
1012605-10 = "О, ты хотел заняться чем-то большим?"
1012605-11 = "...Понятно."
1012605-12 = "Не волнуйся, Сенсей. Я хорошо подготовлена к таким вещам..."
1012605-13 = "Ты можешь согреть холод внутри моего тела."
1012605-14 = "[ns1] «(Меня бросило в холодный пот...)»\n[ns2] «(Мне нужно отсюда выбраться...)»"
1012605-17 = ""
1012605-22 = "Э-хе-хе, боюсь, сбежать не получится."
1012605-23 = "[s] «К-Когда ты успела...?!»"
1012605-24 = "О, о ЧЁМ же ты сейчас можешь думать?"
1012605-25 = "Поделись со мной. Давай наслаждаться этим вместе."
1012605-26 = "Хи-хи. Э-хе-хе-хе...!"
1012605-27 = "[s3] «Н-Не обращай внимания!»\n[s4] «Просто покажи, как помочь тебе с записью!»"
1012605-31 = "Я внимательно делал заметки, пока Каноэ объясняла мне, как пользоваться оборудованием."
1012605-32 = "Благодаря этому мне удалось помочь ей закончить запись."
1012605-36 = ""
1012605-37 = "Похоже, всё готово. Тогда начнём?"
1012605-38 = "В благодарность за помощь... я покажу тебе самую настоящую себя."
1012605-39 = ""
1012605-43 = "― [log=카노에]Сенсей. Эм, прежде чем мы начнём запись...[/log][wa:3440]"
1012605-45 = "― [log=카노에]...я хочу, чтобы ты кое-что узнал.[/log]"
1012605-48 = "― [log=카노에]Д-Дело в том...[/log][wa:270]"
1012605-50 = "― [log=카노에]Я кое-что от тебя скрывала...[/log][wa:140]"
1012605-53 = "― [log=카노에]Я-Я... очень стеснительная,[/log][wa:2050]"
1012605-55 = "― [log=카노에]и разговаривать с людьми у меня тоже плохо получается.[/log]"
1012605-58 = "― [log=카노에]И чтобы это скрыть,[/log][wa:10]"
1012605-60 = "― [log=카노에]я притворялась такой мрачной.[/log]"
1012605-63 = "― [log=카노에]А оккультизмом я занялась...[/log]"
1012605-65 = "― [log=카노에]потому что хотела изменить себя.[/log]"
1012605-68 = "― [log=카노에]Единственный человек, который знает настоящую меня... это ты, Сенсей.[/log][wa:1630]"
1012605-70 = "― [log=카노에]Так что... пожалуйста, сохрани это в тайне.[/log][wa:420]"
1012605-73 = "― [log=카노에]Я-Я доверяю тебе, Сенсей, поэтому...[/log][wa:3890]"
1012605-76 = "[ns] «Так вот какая ты на самом деле, Каноэ?»"
1012605-77 = "― [log=카노에]...Хи-хи, э-хе-хе.[/log][wa:810]"
1012605-79 = "― [log=카노에]Ты правда на это купился, Сенсей?[/log][wa:190]"
1012605-82 = "― [log=카노에]...Сенсей, тебе ведь нравятся милые вещи, да? [/log][wa:800]"
1012605-85 = "― [log=카노에]Значит, тебе... и я тоже нравлюсь, верно?[/log][wa:4770]"
1012605-87 = "― [log=카노에]Э-хе...![/log]"
1012605-90 = "[ns] «Ну хватит. Ты меня обманула!»"
1012605-92 = "...После этого я продолжил помогать Каноэ с записью."
1012605-93 = "На этот раз она записывала диск для страстной спортивной драмы."
1012605-95 = "И-и-и... кажется, всё!"
1012605-96 = "Спасибо за помощь, Сенсей. Я знала, что могу на тебя рассчитывать."
1012605-97 = "[s] «У тебя действительно огромный актёрский диапазон, Каноэ.»"
1012605-98 = "Возможно, но мне всё равно нужно стараться ещё больше..."
1012605-99 = "В наши дни в этой индустрии мой нынешний диапазон — лишь необходимый минимум."
1012605-100 = "«Вундеркинд» я или нет... расслабляться нельзя."
1012605-101 = "[s] «Ты идёшь за своей мечтой.»"
1012605-102 = ""
1012605-104 = ""
1012605-105 = "Верно. У меня действительно есть мечта."
1012605-106 = "Угадаешь какая?"
1012605-107 = "[s] «Эм, стать знаменитой актрисой озвучки?»"
1012605-108 = "И это тоже... но есть кое-что ещё."
1012605-109 = "Я хочу найти..."
1012605-110 = ""
1012605-112 = ""
1012605-113 = ""
1012605-114 = ""
1012605-115 = ""
1012605-116 = ""
1012605-117 = ""
1012605-118 = ""
1012605-119 = ""
1012605-120 = ""
1012605-121 = ""
1012605-122 = "...свои связи из прошлой жизни."
1012605-123 = "Хи-хи, Сенсей. Ты всё ещё не вспомнил?"
1012605-124 = ""
1012605-128 = "Таинственная женщина с холодными руками и тёплым сердцем..."
1012605-129 = ""
1012605-131 = ""
1012605-132 = "Женщина, за которой следуют вороны и чёрные кошки, пока она изучает оккультизм..."
1012605-133 = ""
1012605-135 = ""
1012605-136 = ""
1012605-137 = ""
1012605-138 = "Это я...!"
1012605-139 = "[s] «Я-Я понимаю, но всё-таки...»"
1012605-141 = "Чтобы Каноэ немного расслабилась, я отвёл её в ближайшее кафе с десертами."
1012605-143 = ""
1012605-144 = ""
1012605-146 = "После напряжённой записи она вдоволь наелась сладостей."
