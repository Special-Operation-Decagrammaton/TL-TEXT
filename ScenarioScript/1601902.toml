[translation]
1601902-1 = "Экстренная горничная"
1601902-2 = "Здравствуйте, Сенсей."
1601902-3 = "Теперь, когда приветствия закончены, приступлю к сегодняшним обязанностям."
1601902-10 = "Всё в порядке. Не нужно постоянно меня благодарить."
1601902-11 = "Я лишь исполняю возложенные на меня обязанности."
1601902-12 = "Вот, держите. Кофе."
1601902-13 = "Я приготовила 1,5 унции экстракции Full City roast Bourbon Pointu, профильтрованной через фланель в демитассе, предварительно нагретую ровно до 90℃."
1601902-14 = "Так лучше всего раскрываются характерные аромат и вкус этого кофе."
1601902-15 = "Отдайте мне пальто. И сообщите, если есть ещё бельё, которое вы готовы сдать."
1601902-16 = "Я составила список сегодняшних дел. Расставила их по приоритету, но будет лучше, если вы сами всё просмотрете и примете окончательные решения."
1601902-17 = "Я также приготовила кусочек торта «Чёрный лес». Он поможет снять стресс и восполнить сахар."
1601902-18 = "Не беспокойтесь. Я использовала безалкогольный вишнёвый ликёр. Он хорошо сочетается с кофе. Съешьте."
1601902-19 = ""
1601902-22 = "[ns] «...Токи?»"
1601902-23 = "Что такое, Сенсей?"
1601902-24 = "[s] «Ты... всегда была настолько умелой...?»"
1601902-25 = "Разумеется. Я идеальная горничная."
1601902-26 = "На самом деле из-за нынешних обстоятельств я выполняю лишь самый необходимый минимум."
1601902-27 = "Когда я обслуживала госпожу Рио, я работала в режиме «гиперидеальной горничной», который на ступень выше моего нынешнего протокола «идеальной горничной»."
1601902-28 = "[s] «...Но почему ты делаешь всё это для меня?»"
1601902-29 = "Я понимаю, что вы вполне способны справляться самостоятельно, Сенсей."
1601902-30 = "[s] «Так в чём настоящая причина?!»"
1601902-31 = "Сенсей. Вообще-то я тоже человек. Когда я отдыхаю, мне необходимо отдыхать как следует. Иначе я неизбежно сломаюсь."
1601902-32 = "Кроме того, чтобы нормально функционировать, мне нужны задачи и обязанности. Когда мне «скучно» или я «ничем не увлечена», я начинаю ломаться."
1601902-33 = "Если хотите меня отблагодарить, позже можете меня развлечь. Понятно?"
1601902-34 = "А прямо сейчас... я не бездельничаю и не скучаю. Поэтому не нужно сразу волноваться."
1601902-35 = "На самом деле это почти идеальное состояние. Мне нравится лёгкое чувство напряжения."
1601902-36 = "[s] «То есть тебе НУЖНО заботиться обо мне...?»"
1601902-37 = "Не обязательно. Я умею действовать в зависимости от времени, места и обстоятельств."
1601902-38 = "В конце концов, сейчас у нас чрезвычайная ситуация."
1601902-39 = "В такие моменты мы должны поддерживать друг друга и одновременно выполнять назначенные обязанности."
1601902-40 = "Иначе можем потерять надежду на более мирное и счастливое завтра."
1601902-41 = "[s] «Рад, что ты всё-таки твёрдо стоишь на земле...»"
1601902-42 = "Ничего особенного. Мир, мир."
1601902-43 = "Что? Вам всё ещё кажется что-то странным?"
1601902-44 = "Вы думаете, я «каждый день хорошо заботилась о Рио», а не только в критических обстоятельствах?"
1601902-45 = "..."
1601902-46 = "Сенсей."
1601902-47 = ""
1601902-49 = ""
1601902-50 = "Для госпожи Рио каждый день был чрезвычайной ситуацией."
1601902-51 = "[s] «...Наверное, тебе приходилось несладко, Токи...»"
1601902-52 = "Спасибо, что признаёте это."
1601902-53 = "В любом случае, такова реальность. Иной быть не может."
1601902-54 = "В обычных обстоятельствах я обслуживала бы вас в костюме горничной — идеальной броне для такой совершенной горничной, как я."
1601902-55 = "Но прошу проявить понимание и терпение. Я осознаю, что мой нынешний наряд может не полностью соответствовать вашим ожиданиям от обслуживания."
1601902-56 = "[s1] «Одно твоё присутствие уже помогает.»\n[s2] «Спасибо. На тебя можно положиться.»"
1601902-59 = "И всё же у меня есть эти пистолеты. Хотите, я обеспечу круглосуточную личную охрану?"
1601902-60 = "[s] «А...?»"
1601902-61 = "Круглосуточно. Я заметила вашу ловкость. Могу помогать вам в наших маленьких душевых. Могу мыть вам спину."
1601902-62 = "Кроме того, существует, возможно, необоснованное мнение, что людям приятнее всего температура человеческого тела."
1601902-63 = "Поэтому я также могу согревать своим телом вашу маленькую кровать. Это поможет вам заснуть, а хороший сон — сосредоточиться."
1601902-64 = "[s] «Погоди, погоди!»"
1601902-65 = "Нет. Это было необдуманно с моей стороны."
1601902-66 = "В конце концов, температура окружающей среды здесь явно ниже средней."
1601902-67 = "Думаю, я могу согреть вас теплом своего тела прямо сейчас. Приготовьтесь."
1601902-68 = "[s] «Это очень мило, но со мной всё нормально!»"
1601902-69 = "Не нужно быть таким скромным."
1601902-70 = "Вы самый важный человек на этом корабле. Служить вам и помогать — совершенно естественно."
1601902-72 = "Мне пришлось уворачиваться от Токи, которая всё пыталась приблизиться."
1601902-73 = "По крайней мере, скучающей она больше не выглядела. Кажется, я заметил на её лице лёгкую довольную улыбку."
