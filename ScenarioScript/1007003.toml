[translation]
1007003-129 = "#st;[0,0];instant;1;"

1007003-1 = "Блокфлейта"
1007003-3 = ""
1007003-4 = ""
1007003-5 = "*шорох*"
1007003-7 = ""
1007003-8 = ""
1007003-9 = ""
1007003-11 = ""
1007003-12 = "Бежать больше некуда! А теперь тихо идите с нами!"
1007003-13 = "Цок...!"
1007003-14 = ""
1007003-17 = "[ns1] «Мина, сейчас!»\n[ns2] «Мы загнали их куда нужно!»"
1007003-20 = "В этот момент воздух пронзил звук блокфлейты."
1007003-21 = "Это было худшее исполнение, которое я слышал в жизни, и я ещё стараюсь выразиться помягче."
1007003-22 = "Какого—?"
1007003-23 = ""
1007003-25 = ""
1007003-26 = ""
1007003-28 = "[ns] «Эм... Мина? Что это за блокфлейта?»"
1007003-29 = "... *фьюить-фьюить-фьюить*"
1007003-31 = "Что она пытается сделать? Пытать нас? ...Ну, получается..."
1007003-33 = "... *фьюить-фьюить-фьюить*"
1007003-34 = ""
1007003-36 = ""
1007003-37 = ""
1007003-38 = ""
1007003-39 = ""
1007003-40 = ""
1007003-41 = ""
1007003-42 = ""
1007003-43 = "Хватит... Просто хватит! У меня уши кровоточат!"
1007003-45 = "..."
1007003-46 = "Разумеется, у такого отброса, как ты, нет никакого понимания искусства!"
1007003-48 = "Единственная музыка, которую ты заслуживаешь услышать, — похоронный марш!"
1007003-50 = ""
1007003-55 = "Мина, впав в странную ярость, быстро расправилась с противником."
1007003-57 = "*вздох* Горько-сладкая победа... Поднимем же тост за павших."
1007003-58 = ""
1007003-60 = ""
1007003-61 = ""
1007003-62 = "[ns] «Ты вообще-то пьёшь сок из коробочки...»"
1007003-63 = "Хех."
1007003-64 = "[s3] «Мина, насчёт этой музыки...»\n[s4] «Что это за блокфлейта?»"
1007003-67 = "О, эта старая штука?"
1007003-68 = "Я так и знала, что вы заметите."
1007003-69 = "Я увидела это в одном фильме, понимаете?"
1007003-70 = "Идут вступительные титры... Звенят бокалы... Герой одним глотком осушает коктейль... а затем играет на кларнете."
1007003-71 = "Так они делают всякий раз, когда погибает дорогой товарищ. Выпивают за него и играют на кларнете в память..."
1007003-72 = "И поэтому я решила..."
1007003-73 = "Отныне, прежде чем прикончить противника, я буду играть ему похоронную мелодию."
1007003-74 = "[s] «Ты ведь понимаешь, что у тебя блокфлейта, а не кларнет, да...?»"
1007003-75 = "..."
1007003-76 = "Запомните, Сенсей."
1007003-77 = "Кларнет... сложный инструмент."
1007003-78 = "[s] «Поэтому ты взяла школьную блокфлейту?»"
1007003-79 = "Хех."
1007003-80 = "[s] «...»"
1007003-81 = "Ну, о чём вы думаете?"
1007003-82 = "[s] «Можно честно?»"
1007003-83 = "Конечно."
1007003-84 = "[s] «Это было не то чтобы... устрашающе.»"
1007003-85 = "А... Вот как?"
1007003-86 = "Неважно, как это звучит сейчас. Важно будущее."
1007003-87 = "Мои нынешние старания откроют путь к этому будущему."
1007003-88 = "[s] «То есть ты продолжишь тренироваться?»"
1007003-89 = "Хех."
1007003-90 = "Я знала, что вы поймёте."
1007003-92 = "Мина продолжала играть на блокфлейте ещё несколько недель."
1007003-93 = ""
1007003-95 = ""
1007003-97 = ""
1007003-98 = "А? Это что... блокфлейта?"
1007003-99 = "Ух! Как будто куча мелких детей репетирует музыку, только ещё хуже!"
1007003-100 = ""
1007003-102 = ""
1007003-105 = ""
1007003-106 = "Хех."
1007003-107 = ""
1007003-110 = ""
1007003-112 = ""
1007003-116 = ""
1007003-118 = ""
1007003-119 = "Блокфлейта... Я слышу блокфлейту!"
1007003-120 = "Этот звук... Я не могу пошевелиться...!"
1007003-121 = ""
1007003-124 = ""
1007003-125 = ""
1007003-127 = ""
1007003-128 = "Хех."
1007003-130 = ""
1007003-133 = "В последнее время у Генрюмона всё идёт отлично, Сенсей."
1007003-134 = "Правонарушений стало меньше. Безопасности — больше."
1007003-135 = "*вздох* Есть что-то приятное в том, чтобы исправно выполнять свои обязанности."
1007003-136 = "[s5] «Я слышал интересный слух об одном члене Генрюмона...»\n[s6] «Говорят, улицы преследует звук блокфлейты.»"
1007003-139 = "О, я тоже это слышала."
1007003-140 = "Я бы сказала, это доказательство того, что мои навыки постепенно улучшаются."
1007003-141 = "Кажется, все мои старания наконец окупаются."
1007003-142 = "[s] «Главное, чтобы ты была счастлива, Мина...»"
1007003-144 = "Слухи о демонической блокфлейте разошлись по всему Шаньхайцзину."
1007003-145 = "Но эти слухи помогали поддерживать порядок, так что всё хорошо, что хорошо кончается...?"