[translation]
2001302-1 = "Ежедневная проверка безопасности"
2001302-2 = "Исполнительный офис Шале"
2001302-3 = ""
2001302-4 = "Я вернулся в офис из командировки и увидел Чихиро, ожидавшую перед компьютером."
2001302-5 = "[ns1] «Я вернулся, Чихиро. Полагаю, всё готово?»\n[ns2] «Закончила проверку безопасности, о которой говорила?»"
2001302-6 = "Сама проверка безопасности особой сложности не представляла."
2001302-7 = "Сама проверка безопасности особой сложности не представляла."
2001302-8 = "Мне нужно было лишь тщательно изучить журналы и очистить кэш."
2001302-9 = "К счастью, я не нашла никаких следов взлома сервера Шале или оставленного вредоносного ПО."
2001302-10 = "Однако с этим компьютером всё ещё есть проблема."
2001302-11 = "[s] «Какая проблема?»"
2001302-12 = "Это..."
2001302-13 = "...ваши привычки в области безопасности, Сенсей!"
2001302-14 = "Зачем вы записали пароль там, где его любой может увидеть?"
2001302-15 = "[s] «Потому что он очень сложный и его трудно запомнить...»"
2001302-16 = "Это не оправдание тому, что вы оставляете пароль на виду!"
2001302-17 = "Если он попадёт к кому-то со злым умыслом, у вас будет настоящая чрезвычайная ситуация. Все данные, связанные с Шале и студентами, могут утечь."
2001302-18 = "Внеюрисдикционные полномочия Шале делают организацию ещё более привлекательной целью.#nЗначит, нужно быть ещё осторожнее."
2001302-19 = "К информации, которая проходит через этот офис, нельзя относиться легкомысленно."
2001302-20 = "[s] «Прости...»"
2001302-21 = "На этот раз я закрою глаза, раз никакого вреда не произошло."
2001302-22 = "Пожалуйста, впредь будьте осторожнее."
2001302-23 = ""
2001302-25 = ""
2001302-26 = ""
2001302-27 = ""
2001302-29 = ""
2001302-31 = "Я хочу, чтобы вы записали здесь новый пароль, Сенсей.#nТакой, который легко запомнить."
2001302-32 = "[s3] Написать «12345».\n[s4] Написать «qwerty»."
2001302-33 = "Что вы творите?!"
2001302-34 = "Что вы творите?!"
2001302-35 = "Такое не может быть вашим паролем!"
2001302-36 = "[s] «Но ты же сказала придумать что-нибудь легко запоминающееся.»"
2001302-37 = "Это не значит, что можно писать настолько очевидное, что его угадает кто угодно!"
2001302-38 = "Нужно использовать комбинацию букв и цифр, которую вы сможете помнить, но другие не смогут угадать."
2001302-39 = "[s] «Тогда возьму дату рождения.»"
2001302-40 = "Так тоже нельзя! Любой хакер, нацелившийся на вас, очевидно будет знать вашу дату рождения."
2001302-41 = "Такие советы по безопасности вообще-то должны быть общеизвестными."
2001302-42 = "А для важных учётных записей хорошо использовать хотя бы один специальный символ или заглавную букву."
2001302-43 = "Иначе аккаунт можно взломать простым макросом."
2001302-44 = "[s5] «Правда?»\n[s6] «Звучит страшновато...»"
2001302-45 = "Да, правда. Пароль от компьютера — как ключ от входной двери."
2001302-46 = "Именно. Пароль от компьютера — как ключ от входной двери."
2001302-47 = "Ненадёжный пароль — всё равно что оставить запасной ключ в почтовом ящике, потому что иначе вы забудете, куда его положили."
2001302-48 = "[s] «И это тоже, да...»"
2001302-49 = "Сенсей? Вы держите запасной ключ в почтовом ящике?"
2001302-50 = "*вздох* Стоило догадаться, что это касается и вашей безопасности вне сети."
2001302-51 = "Пора разобрать важность безопасности с самых основ.#nСлушайте внимательно!"
2001302-53 = "Чихиро больше часа читала мне лекцию о безопасности..."
