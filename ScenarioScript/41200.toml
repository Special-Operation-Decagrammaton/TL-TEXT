[translation]
41200-1 = "Эпизод 20;Лиса в норе"
41200-2 = "Перед главным входом Полицейской школы Валькирии"
41200-4 = "Добро пожаловать! Как видите, за моей спиной Полицейская школа Валькирии. Некогда уважаемая школа переживает не лучшие времена после обвинений в незаконном сговоре с Кайзер Group!"
41200-5 = "Согласно анонимной информации, переданной Школе журналистики «Кронос»..."
41200-6 = "Студенты Бюро общественного порядка использовали государственные полномочия в интересах Кайзер Group в обмен на деньги и товары!"
41200-7 = "Весь мир потрясён тем, что полицейская школа, призванная защищать общество, опустилась до уровня жалкой наёмной группы ради личной выгоды!"
41200-8 = "Я сама до сих пор в шоке! И, как будто этого мало, очевидцы утверждают, что недавно Валькирия проиграла группе грабителей, которые разрушили часть школы!"
41200-9 = "Организация, которая должна защищать граждан, не смогла защитить даже собственную базу!"
41200-10 = "И теперь главный вопрос: безопасен ли Кивотос в руках Полицейской школы Валькирии?"
41200-11 = "По мере того как сомнения множатся, среди горожан нарастает тревога!"
41200-12 = ""
41200-14 = ""
41200-17 = ""
41200-18 = "Какого чёрта вы здесь делаете?"
41200-19 = "Невероятно! Сама директор Бюро общественного порядка — ключевая подозреваемая в расследовании!"
41200-20 = "Директор Канна, расскажите нам! Почему вы заключили незаконный контракт с Кайзер Group?"
41200-21 = "Что? Откуда вы это узнали?"
41200-22 = "Нет, стоп! Это охраняемая зона! У вас нет разрешения снимать здесь!"
41200-23 = "Бешеная гончая Валькирии теперь в ярости угрожает СМИ!"
41200-24 = ""
41200-26 = ""
41200-28 = "УБИРАЙТЕСЬ! Я ваши камеры пополам сломаю!"
41200-30 = "Парк Коусаги"
41200-31 = "...Ситуация очень быстро выходит из-под контроля."
41200-32 = "О-Об этом только и говорят в н-новостях..."
41200-33 = "Ч-Что если Бюро общественного порядка захочет о-отомстить?"
41200-35 = "Ты слишком много переживаешь, Мию. Мы сделали то, что считали правильным. Это главное."
41200-36 = "Да и кому мстить, когда тебя осаждает толпа бешеных журналистов?"
41200-37 = "Есть одна вещь, которая не даёт мне покоя..."
41200-38 = "Что такое?"
41200-39 = "Как сказать... Всё произошло слишком быстро. Корпоративные скандалы обычно развиваются медленнее и куда тише."
41200-40 = "Все стороны были такими... сговорчивыми? Генеральный студенческий совет бросился расследовать всё как стая восторженных кроликов, а даже Кайзер Group склонила голову и отказалась от проекта в Коусаги, будто до этого не вложила туда миллионы."
41200-41 = "Если уж на что-то указывать... Сенсей, вы угрожали Генеральному студенческому совету?"
41200-42 = "[s1] «Ты сама сказала разобраться как взрослый.»\n[s2] «Я бы предпочёл сказать, что мы достигли взрослого взаимопонимания.»"
41200-43 = ""
41200-44 = ""
41200-46 = ""
41200-48 = "Ну, как бы там ни было, я рада, что всё закончилось."
41200-49 = "Раз проект развития отменён, им незачем тратить время и деньги на выселение местных бездомных."
41200-50 = "А мы сохраняем свой дом."
41200-52 = "Хм... К-Кхм!"
41200-53 = ""
41200-55 = ""
41200-56 = ""
41200-59 = ""
41200-61 = "А. Нарушитель."
41200-62 = "Ой-ой. У меня как раз руки чешутся что-нибудь взорвать."
41200-63 = "Саки, будь другом, подкинь мне одного из моих малышей."
41200-64 = "С-Стойте! Я не нарушитель! Я пришёл отдать вам честь!"
41200-65 = "...Отдать честь?"
41200-66 = "Вот теперь говоришь на моём языке. Это когда приветствуешь кого-то порохом и свинцом."
41200-67 = "Вы... Вы необразованные хулиганы!"
41200-68 = "Как ни крути — а поверьте, я пытался, — монаху, стремящемуся к просветлению, приходится возвращать долги."
41200-69 = ""
41200-71 = ""
41200-72 = "...Так что... Ну... Вы оказали мне большую услугу. В каком-то смысле."
41200-74 = "Я знаю, что отряд RABBIT рисковал жизнью, ворвавшись в Валькирию, чтобы достать доказательства их злодеяний и вывести их на чистую воду."
41200-75 = "Мы смогли вернуть своё убежище в городе Коусаги, а Искатели понемногу возвращаются к нам один за другим. Благодаря вам... наверное."
41200-76 = "Я знаю, вы делали это не ради нас, но отрицать вашу помощь невозможно."
41200-77 = "Поэтому я принёс вам одну из наших самых почитаемых трапез. В уплату долга."
41200-78 = ""
41200-80 = ""
41200-82 = ""
41200-83 = "Почитаемую трапезу? Что? Говори немедленно!"
41200-84 = "Если это бенто с ростками маша, я реально разрешу Моэ отправить тебя в небеса."
41200-85 = "Прошу! Мы городские искатели, просветлённые в пути нестяжательства. Естественно, я великодушно принёс вам самое лучшее, что у нас есть."
41200-86 = "Барабанная дробь!"
41200-88 = "Вуаля! Карааге из куриной кости!"
41200-89 = ""
41200-91 = ""
41200-94 = ""
41200-95 = "Карааге...?"
41200-96 = "Именно! И не обычное карааге! Этот деликатес делают из обжаренных во фритюре костей! То есть... их нельзя есть, но..."
41200-97 = "Если жевать и обсасывать кости, почти как будто ешь жареную курицу! И без калорий!"
41200-98 = "А для полноты впечатлений можно открыть свежую банку пива и обсасывать кость, притворяясь, что правда ешь!"
41200-99 = "Только не бросайтесь все благодарить меня одновременно."
41200-100 = ""
41200-102 = ""
41200-104 = ""
41200-105 = "Э-Это не карааге..."
41200-106 = "Это оскорбление всей еды. Хуже бенто с ростками маша."
41200-107 = "Н-Н-Нет! Это жареная курица! Вы что, непросветлённые идиоты, не видите?!"
41200-108 = "Как вы смеете оскорблять шедевр, который я так великодушно предложил?!"
41200-110 = "Не будь злой. Это вовсе не пищевые отходы."
41200-111 = "Согласно правилам утилизации отходов Кивотоса, куриные кости относятся к горючему мусору. То есть ещё хуже."
41200-112 = ""
41200-114 = ""
41200-116 = ""
41200-117 = "Пищевые отходы это, горючий мусор то..."
41200-118 = "Вы явно ничему не научились о нестяжательстве! Вы... прожорливые свиньи не понимаете ценности этого восхитительного блюда!"
41200-119 = "Надо было знать! Искатели никогда не смогут ужиться с жадностью, которая воняет из ваших душ!"
41200-120 = "Думаешь, мы хотим уживаться с лицемерным мусором вроде вас?"
41200-121 = ""
41200-123 = ""
41200-124 = "Моэ, у нас же осталась бронебойная взрывчатка?"
41200-126 = "Объявим войну этим придурочным индюкам!"
41200-127 = ""
41200-137 = ""
41200-138 = "...Они никогда не меняются, да?"
41200-140 = ""
41200-142 = "Офис Главы Оборонного Комитета"
41200-145 = ""
41200-146 = "И вот мы вернулись к началу."
41200-147 = "Этот инцидент посадил Валькирию на очень, очень короткий поводок. И куда ни повернись — эти мошки из «Кроноса» лезут в лицо..."
41200-148 = "Наверное, в прошлой жизни я совершила что-то ужасное, раз заслужила работать с такой некомпетентностью."
41200-149 = "...Опять?"
41200-150 = "Ой, ты же знаешь, я просто жалуюсь. К счастью, скидка, которую корпорация Кайзер любезно предоставила непосредственно нам, осталась незамеченной."
41200-151 = "Директор Канна пусть разгребает последствия, а наш план продолжит работать в фоне."
41200-152 = "У тебя вообще есть время на мелкие игры? Лучше бы искала более надёжных союзников."
41200-153 = "Надёжных союзников, говоришь..."
41200-154 = ""
41200-156 = ""
41200-157 = ""
41200-159 = "...А как насчёт твоих младших? Они довольно сильные."
41200-160 = "Можно вытащить бойца из школы, но бой из бойца не вытащишь. Да, они ещё новички, но всё равно элитные студенты, прошедшие вступительные экзамены SRT."
41200-161 = ""
41200-163 = ""
41200-165 = "Им ещё очень далеко до того, чтобы быть достойными нести знамя SRT."
41200-166 = "Ох, Юкино, как всегда строгая."
41200-167 = "Нет. Это ты мягкая, Нико."
41200-168 = "Тридцать минут? И столько шума? Под моим командованием мы бы вошли и вышли меньше чем за минуту, и никто бы ничего не заметил."
41200-169 = ""
41200-171 = ""
41200-173 = "Можно ли вообще сравнивать кучку первогодок-новичков с такими ветеранами, как вы, Нико?"
41200-174 = "И это возвращает меня к моей мысли."
41200-175 = "Я хочу пригласить отряд RABBIT присоединиться к нашему государственному перевороту."
41200-177 = "Что скажете, печально известный отряд FOX академии SRT?"
41200-180 = "Меня устраивает."
41200-181 = "Даже если они не хотели, я бы с удовольствием лично раздавила их за то, что они испортили карьеру своим старшим."
41200-182 = "Боже. Не хотелось бы пачкать руки таким милым младшим."
41200-183 = "Даже такие дети, как они, понимают: пачкаться — цена за обучение в SRT. Цена нашей справедливости."
41200-185 = "Этот план..."
41200-186 = ""
41200-189 = "...Нет, всё, что мы делаем, — ради возрождения SRT и уничтожения Шале."
41200-192 = "Кролик из Карбанога;Продолжение в главе 2"
