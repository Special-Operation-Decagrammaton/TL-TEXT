[translation]
41200-1 = "Episódio 20;Toca da Raposa"
41200-2 = "Academia de Polícia Valkyrie — Em frente ao Prédio Principal"
41200-4 = "Estou neste momento em frente ao prédio principal da Academia de Polícia Valkyrie, que está no centro de rumores sobre um esquema de conluio com o Grupo Kaiser!"
41200-5 = "Segundo informações de uma fonte que pediu anonimato..."
41200-6 = "Parece que alunas do Departamento de Segurança Interna receberam dinheiro e favores do Grupo Kaiser, e abusaram de sua autoridade em troca!"
41200-7 = "A ideia de que a Valkyrie, que deveria proteger os cidadãos e defender a justiça, estaria de mãos dadas com uma empresa privada é uma revelação chocante!"
41200-8 = "Além disso, recebemos informações de que, há alguns dias, um grupo misterioso invadiu a Academia de Polícia Valkyrie e destruiu parte das instalações."
41200-9 = "Um incidente atrás do outro vem abalando a autoridade da Valkyrie!"
41200-10 = "Qual será a verdade por trás de tudo isso?!"
41200-11 = "Para esclarecer esses acontecimentos, nós..."
41200-18 = "...Que algazarra é essa?"
41200-19 = "Ah, é a Diretora Kanna, do Departamento de Segurança Interna!"
41200-20 = "Desculpe a abordagem repentina, mas poderia nos dar uma palavra sobre o caso dos subornos ilegais?!"
41200-21 = "Espera aí, de onde vocês tiraram essa informação..."
41200-22 = "Para começo de conversa, isso aqui é propriedade restrita. Vocês têm permissão para estar aqui?"
41200-23 = "Opa, será que a imprensa e o poder estão mesmo fadados a entrar em choque?! Mas nós da Kronos jamais—"
41200-28 = "Chega de papo, deem o fora daqui agora!"
41200-30 = "Parque Kousagi"
41200-31 = "...Virou uma notícia enorme, não é?"
41200-32 = "É, é mesmo. Está passando no noticiário desde de manhã..."
41200-33 = "E-E se o Departamento de Segurança Interna resolver atacar a gente por causa disso, o que a gente faz...?"
41200-35 = "Tanto faz. Nós só fizemos o que tinha que ser feito."
41200-36 = "Além disso, elas já devem estar cheias de problemas para resolver agora, incluindo a Kronos. Não devem ter tempo sobrando para vir atrás da gente."
41200-37 = "Até que faz sentido, mas tem alguma coisa me incomodando nisso..."
41200-38 = "Como assim?"
41200-39 = "Sei lá, a reação foi rápida demais."
41200-40 = "O Conselho Estudantil Geral montou uma equipe de investigação na hora, e a Kaiser desistiu da revitalização sem pestanejar, mesmo tendo gastado uma fortuna..."
41200-41 = "...Sensei, por acaso você ameaçou o Conselho Estudantil Geral?"
41200-42 = "[s1] \"Não, nada de ameaças...\"\n[s2] \"...Parece que há uma situação bem complicada por trás disso.\""
41200-48 = "...? De qualquer forma, estou aliviada."
41200-49 = "Se a revitalização foi cancelada, não vão mais expulsar os andarilhos daqui..."
41200-50 = "...E nós também poderemos continuar aqui."
41200-52 = "Ah, bem..."
41200-61 = "Eita, invasor."
41200-62 = "Saki, passa uma granada aí."
41200-63 = "Só uma leve, para aquecer no treino matinal."
41200-64 = "Espera, espera, espera! Não sou invasor, vim cumprimentar vocês!"
41200-65 = "...Cumprimentar?"
41200-66 = "Ah, já li sobre isso num livro antigo. É aquele negócio de gritar \"toma um cumprimentozinho!\" enquanto mete chumbo e explosivo na cara do outro..."
41200-67 = "É por isso que não dá para lidar com foras da lei!!!"
41200-68 = "Ai, ai... Bom, já que nos ajudaram, não dava para simplesmente não dizer nada..."
41200-72 = "...Fomos salvos por vocês."
41200-74 = "Soubemos que arriscaram a própria pele para se infiltrar na Valkyrie e expor a conspiração delas."
41200-75 = "Graças a isso, o nosso santuário... Kousagi Town não corre mais perigo, e os companheiros da \"FeliSem\" já estão voltando."
41200-76 = "Talvez não tenham feito isso por nós. Ainda assim, fingir que não recebemos esse favor seria indigno de um buscador da verdade..."
41200-77 = "Por isso, vim trazer um alimento especial de presente para vocês."
41200-83 = "Um alimento especial?! O que é?!"
41200-84 = "...Não me diga que é um bentô de broto de feijão, né?"
41200-85 = "Não, não, de jeito nenhum. É o item mais precioso que possuímos. Trata-se disto aqui..."
41200-86 = "Ossos de frango fritos..."
41200-88 = "É karaage!"
41200-95 = "...Karaage?"
41200-96 = "Sim. Diferente do karaage comum, este é feito fritando apenas os \"ossos de frango\", então não dá para comer diretamente."
41200-97 = "Porém, o aroma é idêntico ao de um karaage comum. Ao saborear esse cheiro à vontade, você sente todo o prazer da refeição, mas com zero calorias! É um ingrediente verdadeiramente revolucionário."
41200-98 = "Só com um desses, dá para beber 3 latinhas de cerveja! E, claro, combina perfeitamente com arroz."
41200-99 = "Vamos, aproveitem à vontade."
41200-105 = "Q-Quer dizer que isso não é \"karaage\", e sim..."
41200-106 = "...Lixo orgânico?"
41200-107 = "L-Lixo orgânico?! Claro que não, é um karaage legítimo! Só a parte usada que é diferente!"
41200-108 = "Chamar algo que ainda pode ser tão bem aproveitado de \"lixo orgânico\" é o cúmulo da falta de respeito!"
41200-110 = "Bom, pensando bem, não é lixo orgânico mesmo."
41200-111 = "De acordo com as regras de coleta daqui, ossos de frango entram na categoria de \"lixo incinerável\"."
41200-117 = "D-Desde antes ficam falando lixo orgânico pra cá, lixo incinerável pra lá..."
41200-118 = "Que absurdo dizer uma coisa dessas diante de um alimento tão precioso...!"
41200-119 = "Definitivamente, nós da \"FeliSem\" jamais poderemos nos entender com vocês!"
41200-120 = "Quem devia dizer isso somos nós!"
41200-124 = "Moe, traz todas as granadas que a gente tiver!"
41200-126 = "Beleza, vamos fazer uma explosão daquelas!"
41200-138 = "...Acabou nisso de novo."
41200-142 = "Gabinete de Defesa — Escritório"
41200-146 = "...Então acabou nisso mesmo."
41200-147 = "Parece que a Valkyrie não vai poder se mexer por um bom tempo, ainda mais com a Kronos tão insistente..."
41200-148 = "Como sempre, eu não tenho sorte com as pessoas ao meu redor..."
41200-149 = "...Você já disse isso antes."
41200-150 = "Hehe... Bem, de qualquer forma, não parece que descobriram nada sobre o nosso acordo com a Kaiser..."
41200-151 = "O plano não deve sofrer nenhum contratempo."
41200-152 = "Se tem tempo para se preocupar com isso, não deveria usá-lo para encontrar aliados em quem possa confiar?"
41200-153 = "Aliados em quem possa confiar, é...?"
41200-159 = "Falando nisso, aquelas suas calouras... até que parecem bem capazes, não?"
41200-160 = "Como dizem, mesmo enferrujado, ouro ainda é ouro. Falta experiência, é verdade, mas não entraram na SRT à toa."
41200-165 = "Aos meus olhos, ainda são verdes demais para usar o nome da SRT."
41200-166 = "A Yukino-chan é tão rigorosa."
41200-167 = "Você que é mole demais, Niko."
41200-168 = "Se fosse eu, teria escapado em 1 minuto sem disparar nenhum alarme."
41200-173 = "Ora, elas ainda estão no 1º ano. Seria cruel esperar o mesmo desempenho de veteranas como vocês."
41200-174 = "Ainda assim, pensando bem... seria um desperdício não usá-las."
41200-175 = "O que acham de incluí-las no nosso plano de \"golpe de Estado\"?"
41200-177 = "O que dizem como veteranas? Integrantes do \"Esquadrão FOX\" da Academia Especial SRT?"
41200-180 = "Bom, por mim parece ótimo."
41200-181 = "Já que chegou a esse ponto, pelo menos vão ter que compensar o estrago."
41200-182 = "Eu não queria sujar as mãos das nossas calouras fofinhas, mas... não tem jeito, né?"
41200-183 = "...Já que entraram na SRT, deviam estar preparadas para isso desde o início."
41200-185 = "Tudo pela restauração da SRT. E também—"
41200-189 = "Pela abolição da Schale."
41200-192 = "O Coelho de Caerbannog;Continua no Capítulo 2"
