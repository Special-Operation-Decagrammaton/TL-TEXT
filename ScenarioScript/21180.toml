[translation]
21180-1 = "Episódio 18;G.Bible"
21180-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21180-4 = "G.Bible... ativar!"
21180-6 = "[56cd7b]Bem-vindos ao mundo de G.Bible."
21180-8 = "C-Começou!"
21180-9 = "[56cd7b]O que é o melhor jogo de todos... Para essa pergunta,#n[56cd7b]diversas respostas continuam sendo buscadas pelo mundo todo."
21180-11 = "[56cd7b]Qualidade artística, popularidade, vendas, uma história incrível, sensação de euforia, cenas de arrepiar e por aí vai."
21180-13 = "[56cd7b]Muitas vezes essas coisas são citadas como \"condições\" para o melhor jogo,#n[56cd7b]mas todas elas não passam de meros galhos e folhas da \"verdade\"."
21180-16 = "[56cd7b]O segredo para fazer o melhor jogo de todos é apenas um."
21180-18 = "[56cd7b]E nesta G.Bible está guardada essa verdade."
21180-20 = "F-Finalmente!"
21180-21 = "Parece algo incrível..."
21180-22 = "[56cd7b]A única verdade para criar o melhor jogo, o método secreto...#n[56cd7b]Chegou a hora de revelá-lo a vocês."
21180-24 = "Aí vem...!"
21180-25 = "[56cd7b]..."
21180-28 = "[56cd7b]..."
21180-30 = "[56cd7b]A"
21180-32 = "[56cd7b]m"
21180-34 = "[56cd7b]e"
21180-36 = "[56cd7b]os"
21180-38 = "[56cd7b]jo"
21180-40 = "[56cd7b]go"
21180-42 = "[56cd7b]s"
21180-44 = "Uau... parece tipo uma abertura, né? Bem estiloso!"
21180-45 = "S-Será?"
21180-46 = "[56cd7b]Ame os jogos"
21180-48 = "...Não me diga que acaba aqui... n-né?"
21180-49 = "S-Será que bugou alguma coisa?"
21180-50 = "Espera aí!"
21180-51 = "Hã, onde é que muda as configurações..."
21180-52 = "[56cd7b]Ame os jogos"
21180-56 = "[56cd7b]Se você apertou este botão, significa que#n[56cd7b]está suspeitando que o arquivo corrompeu, que houve algum problema,"
21180-58 = "[56cd7b]ou que ocorreu algum tipo de erro... não é mesmo?"
21180-60 = "Ah, eu sabia! Não tinha como acabar assim!"
21180-61 = "[56cd7b]Porém,[wa:500] não é um erro."
21180-63 = "Mentira?!"
21180-64 = "[56cd7b]Sinto muito, mas esta é a conclusão."
21180-66 = "[56cd7b]Ame os jogos!"
21180-69 = "N-Não pode ser! Com certeza tem algum erro...!"
21180-70 = "Não há sinal de arquivo corrompido nem de alteração... Os dados da última transferência, o tamanho do arquivo e a estrutura de dados estão todos normais."
21180-71 = "E-Então, é mesmo..."
21180-72 = "É-É só isso?!"
21180-73 = "...A,"
21180-74 = "Mana... nós estamos tendo algum pesadelo, né..."
21180-76 = "ACABOU TUDooooooo!!!"
21180-78 = "(E agora...)"
21180-79 = "Com licença, Momoi... Você não vai fazer as missões diárias?"
21180-80 = "Você sempre dizia que \"não existe nada mais importante que as missões diárias\"..."
21180-81 = "Aris... meu HP já chegou a zero..."
21180-82 = "Hum..."
21180-83 = "Midori...?"
21180-84 = "Desculpa, Aris-chan... Eu já sabia, mas a realidade sempre foi assim mesmo... Sim, ou seja, este é o final verdadeiro... Um destino diferente do final feliz..."
21180-85 = "..."
21180-86 = "E-E a Yuzu... Onde está a Yuzu?"
21180-87 = "Provavelmente se trancou no armário de novo. Olha bem, o armário está tremendo de vez em quando, viu?"
21180-89 = "Do jeito que todo mundo está agora..."
21180-90 = "Parece até que a sanidade fez logout."
21180-91 = "Uuuuh..."
21180-92 = "Não tem como evitar, era o nosso último recurso! E no fim só tinha uma frase óbvia que todo mundo já sabe! Até pra pegadinha isso é demais!"
21180-93 = "Eu sabia! Eu sabia que não existe no mundo um método mágico que resolve tudo de uma vez! Mas custava deixar a gente ter esperança?! Buaaaaaaah!"
21180-95 = "Haaah..."
21180-96 = "Desculpa, Aris-chan... Nós... sem a G.Bible, não conseguimos fazer um bom jogo..."
21180-97 = "..."
21180-98 = "Não."
21180-99 = "Aris nega isso."
21180-100 = "Toda vez que Aris joga \"Tales Saga Chronicle\", Aris pensa uma coisa."
21180-101 = "Aquele jogo é divertido."
21180-102 = "Hã?"
21180-103 = "Aris consegue sentir."
21180-104 = "O quanto a Momoi, a Midori e a Yuzu..."
21180-105 = "...amam esse jogo."
21180-106 = "Quando Aris viaja por aquele mundo cheio de tantos sentimentos..."
21180-107 = "...o coração de Aris dispara."
21180-108 = "Aquela sensação de explorar um mundo novo junto com os companheiros..."
21180-109 = "Foi ela que ensinou à Aris... o que significa sonhar."
21180-110 = "Por isso, mesmo tendo sofrido tanto, quanto mais perto chegava do tão esperado final, Aris não conseguia evitar pensar..."
21180-111 = "Que pena seria acordar desse sonho..."
21180-112 = "É isso que Aris pensa."
21180-113 = "Aris..."
21180-114 = "..."
21180-115 = "A-Aaah, Yuzu-chan?! Desde quando você tá aí?!"
21180-116 = "Desde que começaram a falar de \"Tales Saga Chronicle\"..."
21180-117 = "Você tava aí desde o começo?!"
21180-118 = "...Vamos fazer."
21180-119 = "Hã?"
21180-120 = "O meu sonho... é que todo mundo diga que o jogo que eu fiz é divertido."
21180-121 = "Mas o protótipo de \"Tales Saga Chronicle\", o primeiro jogo que eu fiz... acabou recebendo mais de mil comentários negativos e só virou motivo de piada..."
21180-122 = "Eu fiquei tão mal com isso que me isolei no Clube de Desenvolvimento de Jogos... e foi aí..."
21180-124 = "...que vocês duas vieram me visitar."
21180-126 = "(6 meses atrás...)"
21180-129 = "[56cd7b]Isso é um jogo?"
21180-131 = "[56cd7b]Pelo contrário, fiquei curioso pra saber o que tem na cabeça de quem fez isso..."
21180-133 = "[56cd7b]Eu ia dizer que é um cérebro... mas duvido muito que tenha um lá dentro."
21180-135 = "[56cd7b]Isso não foi feito por alguém que não entende nada de jogos?"
21180-137 = "[56cd7b]É melhor se pôr no seu lugar."
21180-139 = "[56cd7b]Isso não é um jogo, é só um lixo parecido com um jogo."
21180-141 = "Uuh..."
21180-142 = "Parem... desculpa, desculpa..."
21180-143 = "Por favor, já chega... me perdoem...!"
21180-145 = "(Toc, toc, toc!)"
21180-147 = "Iiik!"
21180-148 = "Q-Quem é...?"
21180-149 = "Hum, aqui é o Clube de Desenvolvimento de Jogos de Millennium, que fez o protótipo de \"Tales Saga Chronicle\", né?"
21180-150 = "O-O quê...? Agora vieram pessoalmente...?"
21180-151 = "D-Desculpa, desculpa...! Eu nunca mais vou fazer um jogo na minha vida, então, por favor, me perdoem...!"
21180-152 = "Quêêê?!"
21180-153 = "Do que você tá falando?! É tão divertido! Como assim vai parar só no protótipo?!"
21180-154 = "Eu tô super curiosa pra ver a continuação, sabia?! Não vale deixar a gente tão empolgada assim e simplesmente desistir!"
21180-155 = "...Hã?"
21180-156 = "\"Tales Saga Chronicle\" foi divertidíssimo!"
21180-157 = "A mana até virou a noite jogando."
21180-158 = "Você também ficou jogando com um sorrisão no rosto, Midori! E olha que você nem se interessava tanto por jogos!"
21180-159 = "Hã, b-bem... É verdade que era em pixel art, mas os personagens eram muito fofos..."
21180-160 = "Enfim, hum! Com licença!"
21180-161 = "(Clack!)"
21180-163 = "...?!"
21180-164 = "Você é a UZ-sama?!"
21180-165 = "Hã... a-ah, s-sim..."
21180-166 = "Eu sou sua fã!!"
21180-167 = "Eu e a Midori! Nós queremos fazer jogos divertidos igual à UZ-sama!"
21180-168 = "...!!"
21180-174 = "..."
21180-177 = "...E foi assim que vocês duas apareceram."
21180-178 = "Nós terminamos \"Tales Saga Chronicle\" juntas... Mesmo que tenha ficado em 1º lugar no ranking de piores jogos do ano..."
21180-179 = "Ugh..."
21180-180 = "..."
21180-181 = "E depois, a Aris-chan apareceu..."
21180-182 = "E disse que era divertido. Com isso, o meu sonho se realizou."
21180-183 = "Fazer um jogo junto com amigas queridas que me entendem, e ouvir que ele é divertido... Aquele sonho que eu sempre guardei sozinha."
21180-184 = "..."
21180-185 = "Talvez seja egoísmo pedir mais do que isso. Mas, se possível... eu queria que esse sonho não acabasse nunca."
21180-186 = "Yuzu-chan..."
21180-187 = "...Certo, beleza!"
21180-188 = "Ei, quanto tempo ainda falta até o Prêmio Millennium?"
21180-190 = "Mana...!"
21180-191 = "Faltam 6 dias, 4 horas e 38 minutos."
21180-192 = "...Isso é mais do que suficiente."
21180-193 = "Vamos lá, pessoal do Clube de Desenvolvimento de Jogos!"
21180-194 = "Vamos começar o desenvolvimento de \"Tales Saga Chronicle 2\"!!"
21180-196 = "Sim!"
21180-198 = "Próximo;Double-O"
