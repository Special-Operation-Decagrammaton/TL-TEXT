[translation]
21180-1 = "Эпизод 18;Г.БИБЛИЯ"
21180-2 = "Департамент Разработки Игр Милленниума"
21180-4 = "Г.БИБЛИЯ... Она включилась!"
21180-6 = "[56cd7b]Добро пожаловать в мир Г.БИБЛИИ."
21180-8 = "Р-Работает!"
21180-9 = "[56cd7b]\"Что делает игру лучшей?\"#n[56cd7b]На такой вопрос существует бесчисленное множество ответов."
21180-11 = "[56cd7b]Качество, популярность, яркий сюжет, влияние, новаторская режиссура..."
21180-13 = "[56cd7b]Всё это — черты лучших игр.#n[56cd7b]Однако всё это лишь побочные следствия более великой истины."
21180-16 = "[56cd7b]За всеми лучшими играми стоит один-единственный секрет..."
21180-18 = "[56cd7b]...и Г.БИБЛИЯ была создана, чтобы хранить этот секрет."
21180-20 = "Н-Наконец-то!"
21180-21 = "Как же круто..."
21180-22 = "[56cd7b]Теперь я открою единственный и главный секрет [56cd7b]создания игр."
21180-24 = "О!"
21180-25 = "[56cd7b]..."
21180-28 = "[56cd7b]ЛЮБИТЕ"
21180-30 = "[56cd7b]…"
21180-32 = "[56cd7b]ВИДЕО"
21180-34 = "[56cd7b]"
21180-36 = "[56cd7b]"
21180-38 = "[56cd7b]"
21180-40 = "[56cd7b]…"
21180-42 = "[56cd7b]ИГРЫ"
21180-44 = "Ого, какое вдохновляющее начало..."
21180-45 = "Т-Ты правда так думаешь?"
21180-46 = "[56cd7b]ЛЮБИТЕ ВИДЕОИГРЫ."
21180-48 = "Стоп... Э-Это ведь не всё, да?"
21180-49 = "М-Может, файл сломан?"
21180-50 = "П-Погодите!"
21180-51 = "Д-Давайте попробуем кнопку настроек..."
21180-52 = "[56cd7b]ЛЮБИТЕ ВИДЕОИГРЫ."
21180-56 = "[56cd7b](Если вы нажали эту кнопку, [56cd7b]то, вероятно, думаете, что файл повреждён..."
21180-58 = "[56cd7b]...или что-то ещё пошло не так.)"
21180-60 = "О! Я знала, что на этом всё не могло закончиться—"
21180-61 = "[56cd7b]Однако[wa:500] это всё, что вам нужно было знать."
21180-63 = "С-Серьёзно?!"
21180-64 = "[56cd7b]Простите!"
21180-66 = "[56cd7b]Просто ЛЮБИТЕ ВИДЕОИГРЫ!"
21180-69 = "Н-Не может быть! Это должна быть ошибка или что-то такое!"
21180-70 = "Файл не повреждён и не изменён... Метаданные, размер и содержимое последней копии совпадают полностью."
21180-71 = "Т-То есть... это правда?"
21180-72 = "И это... всё?!"
21180-73 = "Эм..."
21180-74 = "К-Кажется, нас провели... Сис?"
21180-76 = "ПРОКЛЯТЬЕ!"
21180-78 = "(Обратно в настоящем...)"
21180-79 = "Эм... Момои, а ежедневный квест?"
21180-80 = "Ты же всегда говоришь, что дейлики важнее эндгейма."
21180-81 = "Я... Просто оставь меня в покое, Алис. У меня ХП на нуле..."
21180-82 = "Хмм...?"
21180-83 = "Мидори..."
21180-84 = "Прости, Алиса. Такова реальность. Это истинная концовка..."
21180-85 = "Ах..."
21180-86 = "А-А ты, Юзу...? Стоп, куда она делась?"
21180-87 = "О, шкаф опять трясётся. Наверное, она внутри."
21180-88 = ""
21180-89 = "Как будто..."
21180-90 = "...на всех наложили дебафф духа."
21180-91 = "Эргх..."
21180-92 = "А как мы ещё должны себя чувствовать?! Это был наш последний шанс! Откуда мы могли знать, что получим одну вонючую фразу, которую и так все знают! Нас развели по полной!"
21180-93 = "Я не ждала, что услышу секрет и все проблемы волшебным образом исчезнут! Но, блин, можно было хотя бы немного помочь!"
21180-95 = "*вздыхает*"
21180-96 = "Прости, Алиса. Мы... Мы не справимся без Г.БИБЛИИ. Теперь мы просто безнадёжные неудачницы."
21180-97 = "..."
21180-98 = "Вы ошибаетесь."
21180-99 = "Я не позволю вам так говорить."
21180-100 = "Мне было весело каждый раз, когда я играла в Tales Saga Chronicle."
21180-101 = "По-настоящему весело."
21180-102 = "А?"
21180-103 = "И я чувствую..."
21180-104 = "Я чувствую, сколько любви Момои, Мидори и Юзу..."
21180-105 = "...вложили в эту игру."
21180-106 = "Когда я играю и путешествую по миру, который вы создали..."
21180-107 = "Ну... Моё сердце начинает колотиться."
21180-108 = "Путешествовать по неизвестному миру рядом с товарищами..."
21180-109 = "Вы научили меня мечтать."
21180-110 = "Когда я поняла, что наше приключение подходит к концу, мне в голову пришла одна мысль."
21180-111 = "\"Хочу, чтобы этот сон никогда не заканчивался\"."
21180-112 = "Я не могла думать ни о чём другом."
21180-113 = "Алис..."
21180-114 = "..."
21180-115 = "О, Юзу. Когда ты выбралась из шкафа?"
21180-116 = "Недавно... С тех пор как вы начали говорить о Tales Saga Chronicle."
21180-117 = "То есть всё это время!"
21180-118 = "Мы должны сделать это..."
21180-119 = "А?"
21180-120 = "Я всегда хотела услышать, как люди говорят, что моя игра весёлая..."
21180-121 = "Но первая версия Tales Saga Chronicle получила тысячи негативных комментариев, и люди были беспощадны..."
21180-122 = "Я не выдержала. Поэтому заперлась в Департаменте Разработки Игр."
21180-123 = ""
21180-124 = "Но потом появились вы."
21180-126 = "(Шесть месяцев назад...)"
21180-129 = "[56cd7b]Называть это видеоигрой — уже большая поблажка."
21180-131 = "[56cd7b]Хотелось бы узнать, что творится в голове у того, кто это сделал."
21180-133 = "[56cd7b]Ха. Могу ответить. Очевидно, ничего."
21180-135 = "[56cd7b]Вот почему нормисам не стоит делать игры."
21180-137 = "[56cd7b]Когда они уже поймут, что портят весь вид искусства?"
21180-139 = "[56cd7b]Серьёзно. Это даже не игра. Просто мусор, косящий под игру."
21180-141 = "Угх..."
21180-142 = "Пожалуйста... Простите, только прекратите..."
21180-143 = "Я больше не могу, поэтому, пожалуйста... Пожалуйста... Простите меня!"
21180-145 = "*тук-тук-тук*"
21180-147 = "И-и-и!"
21180-148 = "К-Кто там?!"
21180-149 = "Эй, это же Департамент Разработки Игр Миллениума? Тот, что сделал альфу Tales Saga Chronicle?"
21180-150 = "С-Серьёзно... жаловаться пришли ИРЛ?"
21180-151 = "П-Простите, ладно? Я больше никогда не буду делать игры, только, пожалуйста—"
21180-152 = "Что?!"
21180-153 = "Зачем тебе это?! Нельзя просто бросить весёлую игру на стадии альфы!"
21180-154 = "Я хотела узнать, что будет дальше! Не надо было зря меня так раззадоривать."
21180-155 = "...Что?"
21180-156 = "Я обожаю Tales Saga Chronicle!"
21180-157 = "Правда. Я играла всю ночь!"
21180-158 = "Ага, ты всё время сидела рядом. А ты ведь даже игры не любишь!"
21180-159 = "Ну, персонажи были такими милыми, что я..."
21180-160 = "В общем, извините за вторжение!"
21180-161 = "*щелчок*"
21180-162 = ""
21180-163 = "...?!"
21180-164 = "Ты UZ?"
21180-165 = "Эм... Да, это я."
21180-166 = "Я огромная поклонница твоих работ!"
21180-167 = "Я тоже! Хочу делать такие же весёлые игры, как ты!"
21180-168 = "*ахает*"
21180-169 = ""
21180-170 = ""
21180-171 = ""
21180-172 = ""
21180-173 = ""
21180-174 = "..."
21180-175 = ""
21180-177 = "Так мы и познакомились..."
21180-178 = "Вместе мы закончили Tales Saga Chronicle и удостоились чести получить звание «Худшая игра года»."
21180-179 = "(Акх!)"
21180-180 = "..."
21180-181 = "А потом появилась Алиса..."
21180-182 = "Когда она сказала, что моя игра весёлая, моё сердце переполнилось радостью."
21180-183 = "Создавать игру в окружении замечательных людей и слышать, что другим понравилось то, что мы сделали... Это всегда было моей мечтой."
21180-184 = "..."
21180-185 = "Но я ещё не готова, чтобы этот сон закончился."
21180-186 = "Юзу..."
21180-187 = "Хм..."
21180-188 = "Мидори. Сколько времени осталось до Премии Миллениума?"
21180-190 = "Сестрёнка!"
21180-191 = "Шесть дней, четыре часа и тридцать восемь минут."
21180-192 = "Тогда время ещё есть."
21180-193 = "Департамент Разработки Игр, общий сбор!"
21180-194 = "Начинаем разработку Tales Saga Chronicle 2!"
21180-196 = "Сделаем это!"
21180-198 = "Следующий эпизод;Два Нуля"
