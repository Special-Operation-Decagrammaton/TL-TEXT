[translation]
80000073-1 = "Сосредоточься на разговоре"
80000073-4 = "[ns1] «Я здесь, Уи.»\n[ns2] «Заказ готов! Два американо для Уи?»"
80000073-5 = "О, как раз вовремя, Сенсей. Я только закончила всё готовить."
80000073-6 = "О, как раз вовремя, Сенсей. Я только закончила всё готовить."
80000073-7 = ""
80000073-10 = "Сюда. Я выбрала для нас место."
80000073-11 = "А ещё..."
80000073-12 = ""
80000073-14 = ""
80000073-15 = ""
80000073-17 = "[ns3] «Печенье с шоколадной крошкой... Оно выглядит немного... помятым.»\n[ns4] «Тебе нравится такая текстура печенья, Уи?»"
80000073-18 = "Эм... Я не особо привередлива в еде... Я не придавала этому большого значения."
80000073-19 = "Эм... Я не особо привередлива в еде... Я не придавала этому большого значения."
80000073-20 = "А, книги? Я отодвинула их на безопасное расстояние. Мало ли..."
80000073-21 = "Это печенье мягкое и меньше крошится, но печенье остаётся печеньем. Главное — чтобы крошки не попали на книги."
80000073-22 = "Если собираюсь есть или пить что-то, способное оставить пятно, я всегда убираю книги подальше."
80000073-23 = "Но всё-таки... мы действительно делаем это только потому, что сегодня День святого Валентина...?"
80000073-24 = "А? Мне не особо интересно? Ну, хм... может, немного?"
80000073-25 = "Но разве кто-то правда настолько любит есть шоколад? Думаю, людям просто нравится атмосфера."
80000073-26 = "Например, прямо сейчас... Мы сидим вместе, без моих книг..."
80000073-27 = "Наверное, дело в этом. Да. Мы с вами совсем одни, Сенсей..."
80000073-28 = ""
80000073-30 = ""
80000073-31 = "...?!"
80000073-32 = "[s5] «Уи?»\n[s6] «Почему ты вдруг так напряглась?»"
80000073-33 = "Эм... Ум... Эр..."
80000073-34 = "Эм... Ум... Эр..."
80000073-35 = "...Прошу прощения. Я... необъяснимо нервничаю. Я сказала что-то странное?"
80000073-36 = "Может быть, дело в словах «без моих книг». Не стоило так говорить."
80000073-37 = "До сих пор, когда вы приходили, у меня всегда была книга в руках, поэтому я никогда не думала, что мы остаёмся наедине..."
80000073-38 = "Но на такое мероприятие я ведь не могла взять книгу, правда?"
80000073-39 = "А вы, Сенсей..."
80000073-40 = "Вы, конечно же, совершенно спокойны."
80000073-41 = "Думаю..."
80000073-42 = "[s7] «Думаешь…?»\n[s8] «У тебя лицо застыло...»"
80000073-43 = "Что-то здесь не так. Не должна же я одна нервничать..."
80000073-44 = "Что-то здесь не так. Не должна же я одна нервничать..."
80000073-45 = "..."
80000073-46 = "Хм..."
80000073-47 = ""
80000073-49 = ""
80000073-50 = ""
80000073-51 = "[ns9] «Ты ни с того ни с сего села рядом со мной?!»\n[ns10] «У-Уи! Это, эм, немного близко...»"
80000073-52 = "Фух."
80000073-53 = "Фух."
80000073-54 = "Хорошо. По вашему лицу вижу, теперь мы квиты."
80000073-55 = "Не обращайте внимания. Я просто подумала, что будет лучше, если нервничать будем оба."
80000073-56 = ""
80000073-58 = ""
80000073-59 = "Т-Теперь давайте оба будем чувствовать себя неловко..."
80000073-60 = "И есть печенье с кофе... Я-я начну первой..."
80000073-61 = "[s] «...»"
80000073-63 = "[ns] Взять мягкое шоколадное печенье."
80000073-65 = "Мы с Уи молча пили кофе и ели печенье, которое почти не крошилось."
80000073-66 = "Но неловкость быстро исчезла, когда Уи начала критиковать прохожих, которых заметила."
