[translation]
10045120-1 = "Эпилог;Конец истории"
10045120-2 = ""
10045120-5 = "#st;[-284,566];smooth;140;#n #nWhen the blossoms fall"
10045120-7 = "#st;[-640,455];smooth;140;#n #n #n #nSummer's heat rises and ebbs"
10045120-9 = "#st;[-956,344];smooth;140;#n #n #n #n #n #nThen comes autumn wind"
10045120-12 = "[log=치세 수영복]Когда опадают цветы[/log]"
10045120-13 = "[log=치세 수영복]Летний зной приходит и уходит[/log]"
10045120-14 = "[log=치세 수영복]Затем приходит осенний ветер[/log]"
10045120-15 = "В конце концов стадион с громким грохотом ушёл на дно океана."
10045120-16 = "Все помогали убирать то, что от него осталось."
10045120-18 = "В-Всё нормально! Пусть стадион и развалился, зато об этом фестивале ещё много лет будут рассказывать на уроках истории Хяккияко!"
10045120-19 = "Я согласна! Один захватывающий матч сменял другой!"
10045120-20 = "Прекрасная работа, все! И огромное спасибо за помощь с уборкой!"
10045120-22 = "Мне действительно понравилось. И к тому же среди нас есть победитель."
10045120-24 = "Э-э-э, я ведь была не единственной победительницей!"
10045120-25 = "Да! Мы победили вместе, нин-нин!"
10045120-26 = "Жаль, что мы не смогли закончить из-за взрыва стадиона и всего такого, но матч был очень весёлым!"
10045120-27 = "Изуна тоже так думает. Для Изуны было честью сразиться с вами!"
10045120-29 = "Лично я получила огромное удовольствие от показательного матча! И зрители, несомненно, тоже!"
10045120-30 = "Ага, я тоже."
10045120-31 = "Мне всегда будет интересно, чем бы всё закончилось, если бы не тот взрыв."
10045120-33 = "Кстати, куда делась Кикё? Я её с тех пор не видела."
10045120-34 = "Наверное, сама где-то убирается..."
10045120-35 = "...заодно проводя особую тренировку по плаванию."
10045120-36 = ""
10045120-37 = ""
10045120-38 = "*вдох* *выдох*"
10045120-39 = ""
10045120-41 = ""
10045120-44 = "Раз, два. Раз, два..."
10045120-45 = "(Возможно, это и есть то самое «расслабиться и повеселиться», о чём говорила Рэнгэ.)"
10045120-46 = "(Хорошо. Теперь я почти освоила этот собачий греб— Кхм. Этот способ плавания. Я почти освоила этот способ плавания.)"
10045120-47 = "(А затем, наконец, перейду к следующему стилю...)"
10045120-48 = "[ns1] «Смотри-ка! Ты уже профессионал!»\n[ns2] «Теперь ты настоящая кошка-рыболов, Кикё!»"
10045120-51 = "Сэ— *бульк*... Сенсей?!"
10045120-52 = ""
10045120-55 = "[ns] «Т-Ты в порядке?!»"
10045120-56 = "...!!"
10045120-57 = ""
10045120-60 = ""
10045120-61 = "[ns3] «Ты уже закончила плавать?»\n[ns4] «Прости, я тебя отвлёк?»"
10045120-64 = "Всё в порядке. Я просто воспользовалась возможностью одновременно потренироваться и убрать обломки, но здесь уже закончила."
10045120-65 = "...Почему вы выглядите разочарованным? Хотели и дальше смотреть на мою нелепую технику?"
10045120-66 = "[s5] «Скорее впечатляющую!»\n[s6] «Не каждый способен так быстро преодолеть свой страх.»"
10045120-69 = "...Мой прогресс всё ещё далёк от удовлетворительного."
10045120-70 = "Однако благодаря этому опыту я многому научилась."
10045120-71 = "Я поняла, что гордость — лишь помеха. Я больше не стану скрывать свои слабости от союзников и буду честна, когда у меня что-то не получается."
10045120-72 = "Потому что теперь я знаю: даже если мне чего-то не хватает, рядом всегда будут друзья, готовые поддержать."
10045120-73 = "...Если вы повторите эти слова кому-нибудь ещё, будут последствия."
10045120-74 = "[s] «Есть, мэм! Но только если позволишь мне ещё помогать тебе тренироваться!»"
10045120-75 = "Ч-Что...?"
10045120-76 = ""
10045120-78 = ""
10045120-79 = "...Полагаю, ничего не поделаешь. Вы не оставляете мне выбора."
10045120-80 = ""
10045120-83 = "О? Вы с Сенсеем тренируетесь плавать?"
10045120-84 = "Р-Рэнгэ?"
10045120-86 = "Давайте тренироваться все вместе! Мы на своей стороне уже закончили уборку."
10045120-87 = "Да! Будем наслаждаться летним сиянием вместе с Сенсеем!"
10045120-89 = "Хорошо! Последний, кто коснётся того камня и вернётся на берег, проиграл!"
10045120-90 = "А, точно. Наставник. #nЭто ведь ты писал представления участников, да?"
10045120-91 = "Берегись!"
10045120-92 = "...А. Чуть не забыла."
10045120-93 = "[ns7] «Фуфу, да! Это была я!»\n[ns8] «Но вы ничего не можете с этим поделать!»"
10045120-96 = "[ns] «Такова привилегия ведущего!»"
10045120-97 = "Фуфу. И как долго вы собираетесь сохранять такой настрой, Сенсей?"
10045120-99 = "Тогда на счёт три, все!"
10045120-100 = "Один...!"
10045120-101 = "На двоих!"
10045120-102 = ""
10045120-103 = "[ns] «Три!»"
10045120-104 = ""
10045120-108 = ""
10045120-109 = ""
10045120-110 = ""
10045120-111 = ""
10045120-112 = ""
10045120-114 = "Бесконечно ясное голубое небо. Жар неумолимого солнца.#nЛето пришло!"
10045120-115 = "Это история о дружбе и юности."
10045120-116 = "Цветок распускается среди Сотни: честное водное противостояние"
