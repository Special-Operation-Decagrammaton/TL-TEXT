[translation]
10030040-1 = "Эпизод 4;Танец с медведем"
10030040-3 = "Фух... За всей этой листвой меня никто не увидит."
10030040-4 = ""
10030040-6 = ""
10030040-7 = "Так... Пора достать спрятанное записывающее устройство, которое я пронесла."
10030040-8 = ""
10030040-10 = ""
10030040-11 = "Вице-президент могла тщательно обыскать мои вещи перед выходом, но ей и в голову не пришло, что маленький диктофон можно спрятать в подошве обуви."
10030040-12 = "Гениальность хорошо продуманных записывающих устройств в том, что их можно уменьшать, если компенсировать размер высокочувствительным микрофоном... Хе-хе..."
10030040-13 = "Конечно, качество звука хуже, чем у полноразмерного устройства, но я не могу упустить драгоценное время записи Сенсея..."
10030040-14 = ""
10030040-16 = ""
10030040-21 = "Чувствительность микрофона и шумоподавление настроены..."
10030040-22 = "Хи-хи... Теперь, когда настройки готовы, можно протестировать его, записав фоновый шум."
10030040-23 = ""
10030040-25 = ""
10030040-28 = "Это... немного освежает — слушать звуки природы вживую, а не в ASMR-видео..."
10030040-29 = ""
10030040-31 = ""
10030040-33 = "Шёпот ветра среди деревьев..."
10030040-34 = ""
10030040-36 = ""
10030040-38 = "Музыка птиц, весело играющих и щебечущих..."
10030040-39 = ""
10030040-41 = "Гр-р-р..."
10030040-42 = "Рык свирепого зверя..."
10030040-43 = ""
10030040-45 = ""
10030040-46 = ""
10030040-47 = "...Рык зверя?"
10030040-52 = "Граур!"
10030040-53 = ""
10030040-56 = ""
10030040-58 = "И-Ик?!"
10030040-62 = "[ns] «...Я слышал крик Котамы отсюда!»"
10030040-63 = ""
10030040-64 = ""
10030040-65 = ""
10030040-68 = "Котама, что происходит?! Ты в порядке?"
10030040-69 = "В-Вон там..."
10030040-70 = "Что? За теми деревьями что-то есть?"
10030040-71 = ""
10030040-73 = ""
10030040-75 = "Я слышала рёв свирепого зверя!"
10030040-76 = ""
10030040-79 = ""
10030040-80 = "С... свирепого зверя?"
10030040-81 = ""
10030040-83 = "[ns] «Та тень...!»"
10030040-84 = ""
10030040-86 = ""
10030040-88 = "Граур!"
10030040-89 = ""
10030040-91 = ""
10030040-92 = ""
10030040-94 = "Ещё раз! Громче и свирепее!"
10030040-95 = "Угх..."
10030040-96 = ""
10030040-98 = ""
10030040-100 = "Этого уже точно достаточно громко! Если я так закричу на трибунах, меня услышат даже за пределами стадиона!"
10030040-101 = "Теперь горло болит..."
10030040-102 = "Как крик вообще связан с бейсболом?"
10030040-103 = "Всё дело в основах, Рэй."
10030040-104 = ""
10030040-106 = ""
10030040-107 = "Чтобы громко кричать, нужна хорошая ёмкость лёгких."
10030040-109 = "А кардиореспираторная выносливость важна в любом спорте — бейсбол не исключение!"
10030040-110 = "Давай тренировать выносливость, чтобы в следующем сезоне улучшить спортивные результаты!"
10030040-112 = "Я же постоянно говорю: мне нужна мышечная сила, чтобы чаще выбивать хиты, а не лучшая кардиовыносливость!"
10030040-113 = "Уф... Не стоило верить товарищам по команде, когда они сказали, что я буду чаще выбивать хоум-раны, если вступлю в Клуб спортивных тренировок..."
10030040-114 = "Нам правда обязательно было ехать тренироваться так далеко в горы?"
10030040-115 = "В это время года дикие животные начинают впадать в спячку. Если мой крик призовёт медведя..."
10030040-116 = "Такие мелочи не остановят нашу особую тренировку."
10030040-117 = "Или... на этом заканчивается твоя страсть к бейсболу?"
10030040-118 = "Это вообще никак не связано с моей страстью к бейсболу!"
10030040-119 = "[s] «...Похоже, это другой вид свирепого зверя.»"
10030040-120 = ""
10030040-122 = ""
10030040-123 = "А, Тренер? И ребята из Веритас?"
10030040-125 = "Давно не виделись, Сумирэ."
10030040-126 = "А рядом с тобой... Кажется, мы не знакомы. Ты новая участница Клуба спортивных тренировок?"
10030040-128 = "Пока что на испытательном сроке."
10030040-130 = "А, это Рэй."
10030040-131 = "Какое облегчение... Раньше я слышала только голос Рэй, а не голодного зверя."
10030040-132 = "Неожиданно видеть Веритас здесь."
10030040-133 = "[s] «Вы её знаете?»"
10030040-134 = "Да. Рэй — четвёртый бьющий бейсбольного клуба Миллениума."
10030040-135 = "Все спортивные фанаты Миллениума знают её в лицо. Она популярный игрок и каждый раз вызывает огромный шум, когда выходит к бите."
10030040-136 = "Ага... Немного неловко слышать это так прямо..."
10030040-137 = "Хотя в прошлом сезоне она вызвала совсем другой шум на форумах нашей академии."
10030040-138 = ""
10030040-140 = ""
10030040-141 = "Ну, эм, мой процент отбивания в прошлом сезоне был немного низким, но..."
10030040-142 = "После специальной зимней тренировки я точно стану лидером лиги по хитам!"
10030040-144 = "Тренироваться в такой холод... Вот это самоотдача."
10030040-145 = "Трудно понять спортивных студентов..."
10030040-147 = "Ладно, а что привело Веритас в лес?"
10030040-148 = "Мы редко видим вас за пределами клубной комнаты..."
10030040-150 = "Мы разбили лагерь в Альпах Хигаси, чтобы встретить первый рассвет года..."
10030040-151 = "А у Котамы были какие-то дела в этом лесу."
10030040-152 = "Ты ведь... не занималась здесь чем-нибудь подозрительным?"
10030040-153 = ""
10030040-156 = ""
10030040-157 = "Н-Ничего страшного!"
10030040-158 = "Я-я просто записывала звуки природы, чтобы протестировать устройство записи, которое я—"
10030040-159 = ""
10030040-161 = ""
10030040-162 = "...Ой."
10030040-163 = "...Я так и знала. Подумала, что кто-нибудь из вас попытается пронести электронику не в сумке..."
10030040-164 = ""
10030040-166 = ""
10030040-167 = "Дай сюда диктофон. Мы не для того приехали в поход, чтобы ты вторгалась в личную жизнь Сенсея."
10030040-168 = "Ц... Это был мой шанс сделать новую запись [USERNAME] Сенсея на фоне зимних гор..."
10030040-169 = "[s1] «(НОВУЮ аудиозапись?)»\n[s2] «(Кажется, я слышу что-то пугающее...)»"
10030040-173 = "Ну, закончить год походом и встретить первый рассвет нового года с товарищами по клубу — замечательная идея."
10030040-174 = "Надеюсь, вы все успеете насладиться этой прекрасной природой."
10030040-176 = "Уф... Я и так могу наслаждаться природой, просто посмотрев в окно..."
10030040-177 = "С моими стереодинамиками я услышу всё то же самое, что и в настоящей глуши."
10030040-178 = "Я и так могу посмотреть красивый симулированный рассвет на ПК, так зачем вообще сюда ехать?"
10030040-180 = "Но есть вещи, которыми можно насладиться только на природе!"
10030040-181 = "Например, греться под тёплым солнцем после подъёма на гору в холодном утреннем воздухе..."
10030040-182 = "Мы легко можем воспроизвести это и в помещении."
10030040-183 = "Просто выкрутить кондиционер в клубной комнате, залезть под электроплед и включить документалку о природе! Полное погружение!"
10030040-184 = "И заодно можно съесть горячую лапшу."
10030040-185 = "Это вообще не то, о чём я говорила..."
10030040-186 = ""
10030040-188 = ""
10030040-190 = "Конечно, сейчас благодаря интернету можно смотреть трансляции даже из труднодоступных мест."
10030040-191 = "Можно даже не менять положение в кресле: одним движением пальца смотреть закат снова и снова."
10030040-192 = "...Но я не думаю, что можно понять, каково это — увидеть рассвет с вершины горы, пока не испытаешь лично."
10030040-193 = "Почему нет? Картинка та же, просто смотришь из другого места."
10030040-194 = "Никакое видео, просмотренное в комнате с кондиционером, не передаст путь, который ты прошёл, чтобы добраться до такого места."
10030040-195 = "Это как тренировка. Любая награда или опыт, полученные без усилий, исчезают так же быстро, как приходят."
10030040-196 = "В игре... это как побеждать врагов читами вместо того, чтобы прокачиваться."
10030040-197 = "Ммм... Если так сказать... может, в этом что-то есть."
10030040-198 = "Но я не хочу потеть весь день ради вида на пару минут."
10030040-199 = "Нет смысла терпеть трудности на улице, когда дома полно приятных занятий."
10030040-200 = "Да, дома можно весело провести время и с гораздо меньшими хлопотами..."
10030040-201 = "Но иногда выбор более медленного пути вместо самого удобного помогает тебе вырасти сильнее."
10030040-202 = "Кстати, как насчёт начать полегче — с базового кардио, а не посвящать всю специальную тренировку тяжёлой атлетике, Рэй?"
10030040-203 = "Сумирэ... Твоё кардио вообще ни разу не лёгкое!"
10030040-204 = ""
10030040-206 = ""
10030040-207 = ""
10030040-208 = ""
10030040-209 = ""
10030040-211 = ""
10030040-215 = ""
10030040-216 = "...Я рада, что Клуб спортивных тренировок может заниматься здесь, но вы уверены, что можно так шуметь?"
10030040-217 = "Здесь живёт немало медведей... Если разбудим одного во время спячки—"
10030040-218 = ""
10030040-221 = ""
10030040-225 = ""
10030040-227 = ""
10030040-229 = "...Ах."
10030040-230 = "...Ах."
10030040-231 = ""
10030040-233 = ""
10030040-239 = "ГРА-А-А-АРГХ!"
10030040-240 = ""
10030040-244 = "[ns] «Это медведь!»"
10030040-245 = "Я же говорила, что мы наткнёмся на медведя, если продолжим орать в лесу!"
10030040-246 = "...Какая идеальная возможность."
10030040-247 = ""
10030040-249 = ""
10030040-250 = "Рэй, представь, что этот медведь — игрок на базе! Пора тренироваться воровать базы."
10030040-251 = "Убегай от него как можно быстрее, чтобы он не осалил тебя!"
10030040-253 = "Логично. Если тебя осалит медведь, вылетишь из игры навсегда."
10030040-254 = "Сейчас не время для шуток!"
10030040-255 = ""
10030040-260 = "ГРАААУРРР!"
10030040-261 = "Давай, Рэй! Пора воровать дом! Сосредоточься так, будто от этого зависит жизнь — нет, будто это финальный матч чемпионата!"
10030040-262 = "Но это вообще никак не связано с бейсболом!"
