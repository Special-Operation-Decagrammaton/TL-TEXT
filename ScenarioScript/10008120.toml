[translation]
10008120-1 = "Эпизод 12;Закончим это, Кайтенджеры!"
10008120-2 = "Почему они опять здесь?!"
10008120-3 = "Вы, чудики, украли содержимое ящика?!"
10008120-5 = "Ха-ха! Именно!"
10008120-6 = "Мы забрали всё!"
10008120-7 = "[s] «И что вы собираетесь с этим делать?»"
10008120-8 = "Раздадите бедным, как герои справедливости, которыми себя называете?"
10008120-9 = "Ха! Какой глупый вопрос!"
10008120-10 = "А-А?"
10008120-11 = "С содержимым ящика мы могли сделать только одно!"
10008120-12 = "Наш любимый KAITEN FX MK.0 был безжалостно уничтожен в бою группой злодеев, вставших на пути справедливости. Поэтому..."
10008120-13 = "...мы построили ему преемника!"
10008120-15 = "И имя ему — KAITEN FX MK.1!"
10008120-16 = ""
10008120-18 = ""
10008120-20 = ""
10008120-21 = "Уничтожен группой злодеев...?"
10008120-22 = "Преемник...?"
10008120-23 = "[s1] «Хм. Значит, теперь это канон.»\n[s2] «У меня странное дежавю.»"
10008120-26 = "Ха! Хватит бессмысленной болтовни! Мы уже использовали содержимое ящика, чтобы профинансировать нашу новую машину!"
10008120-27 = "Конвейер жизни вращался без конца..."
10008120-28 = "...к светлому завтра!"
10008120-29 = "Ой, да хватит! Вы просто потратили украденные деньги в собственных интересах!"
10008120-30 = "Не-а! Это было ради осуществления нашей мечты!"
10008120-31 = "[s] «По-моему, это как раз и называется личной выгодой...»"
10008120-32 = ""
10008120-35 = ""
10008120-36 = "Значит, вы потратили всё до последней монеты?"
10008120-37 = "Ару?"
10008120-38 = "В том ящике были и наши мечты. Мечты Решал 68..."
10008120-39 = "Деньги, которые мои товарищи накопили, отказывая себе в увлечениях и вкалывая на тяжёлой физической работе..."
10008120-41 = "И вы потратили их на себя?!"
10008120-42 = "Непростительно."
10008120-43 = "Вы ещё пожалеете, что перешли нам дорогу!"
10008120-45 = "Ха-ха!"
10008120-46 = "Вот это дух! Нападайте изо всех сил!"
