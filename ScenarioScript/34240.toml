[translation]
34240-1 = "Episódio 24;Kyrie para as Garotas (2)"
34240-2 = "..."
34240-3 = "... Por que não vêm...?"
34240-4 = "E a Barbara?#nPor que ninguém ainda..."
34240-9 = "...!!"
34240-14 = "Essa canção..."
34240-15 = "Isso é... Kyrie eleison...?"
34240-16 = "[s] \"Mika...!\""
34240-18 = "Inadmissível!!!"
34240-19 = "Inadmissível! Fazer ecoar uma canção que fala de misericórdia em meu domínio!"
34240-20 = "Que tipo de artifício usaram...?"
34240-21 = "Mesmo depois de eu ter destruído todos os instrumentos e fonógrafos! — Querem que eu acredite que aconteceu um milagre?"
34240-22 = "Inadmissível!!#nAs alunas devem entoar o ódio, o desprezo... e a maldição!"
34240-23 = "Em meio a um inferno onde enganam e ferem umas às outras, elas devem existir apenas para serem exploradas por nós!"
34240-27 = "[ns] \"Cale a boca.\""
34240-29 = "... O quê!?"
34240-30 = "[s] \"Não dirija a palavra às minhas preciosas alunas.\""
34240-31 = "...!!!"
34240-32 = "[s1] \"Com seus falsos ensinamentos, você jogou essas crianças no abismo.\"\n[s2] \"Eu jamais vou perdoar você.\""
34240-33 = "C-Como ousa dirigir a mim tais..."
34240-34 = "C-Como ousa dirigir a mim tais..."
34240-38 = "Palavraaaas—!!"
34240-43 = "E-Ela está começando a se transformar de novo...!?"
34240-45 = "Ah, é isso mesmo, Saori—"
34240-46 = "Vou oferecer você como o novo sacrifício!"
34240-48 = "...!!"
34240-49 = "Já que você arruinou os meus planos, pagará o preço por isso!!"
34240-53 = "— Fique à vontade, Madame."
34240-55 = "L-Líder!?"
34240-56 = "... Que besteira você está dizendo!?"
34240-58 = "Se ainda existe um preço que eu possa pagar... eu deveria até agradecer."
34240-62 = "Vamos, Madame.#nEu estou bem aqui!! Pode levar!"
34240-64 = "Guh, Sensei...! Rápido...!"
34240-66 = "[ns] \"É a batalha final! Vamos, pessoal!\""
34240-67 = "S-Sim!!"
34240-69 = "Guh... Aaah, AAAAAH!"
