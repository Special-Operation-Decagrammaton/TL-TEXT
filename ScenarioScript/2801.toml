[translation]
2801-1 = "Петиция спецотряда, часть 1"
2801-2 = "Руины возле Старого института №227"
2801-5 = "Сегодня так холодно!"
2801-6 = "И снега столько... Я ведь запросто могу превратиться тут в снеговика и умереть!"
2801-7 = "Хи-хи. Хорошо, что у меня есть связка сухих веток и куча фруктов!"
2801-8 = "Ты выглядишь довольной, Нодока. Всё прошло хорошо?"
2801-9 = "Шигурэ!"
2801-10 = "Ещё бы! Только посмотри, сколько я набрала!"
2801-11 = "С таким снегом я думала, что не найду ни одной сухой ветки. Но похоже, меня ждёт уютный пир у костра."
2801-12 = "Рада это слышать."
2801-13 = "Но тебе стоит лучше заботиться о себе. У тебя лицо красное."
2801-14 = "П-Правда? Наверное, я немного увлеклась поиском припасов."
2801-15 = "Давай уйдём с холода. Я разведу огонь."
2801-18 = "*вздох* Огонь согревает меня и снаружи, и изнутри."
2801-19 = "Горячего какао, Нодока?"
2801-20 = "Спасибо, Шигурэ. Не знаю, что бы я без тебя делала."
2801-21 = "Я? Это ты собрала для нас дрова. Я благодарна тебе."
2801-22 = "А твоя милая улыбка даёт мне силы идти дальше."
2801-23 = "Пусть мы и застряли здесь, я рада, что застряла именно с тобой, Нодока."
2801-24 = "С-Шигурэ, я краснею..."
2801-26 = "Нодока..."
2801-28 = "Шигурэ...."
2801-30 = "Стоп, стоп! Сейчас же остановись!"
2801-32 = "Старый институт №227"
2801-33 = "Ч-Что это вообще такое, Мэру?!"
2801-34 = "Почему мы с Шигурэ — главные героини любовного романа?"
2801-35 = "В смысле? Я пишу историю о жизни студентов Старого института#n№227, как ты и просила."
2801-36 = "Может, я немного приукрасила некоторые детали, но всё основано на вашей жизни!#nХи-хи."
2801-37 = "Немного?! Кроме того, что нам холодно и мы голодаем, всё остальное выдумано! Я хочу рассказать о нашей жизни в этих ужасных условиях, а не писать оригинальный рассказ!"
2801-38 = "Сколько бы мы ни жаловались, Секретариат не отвечал... Поэтому мы подумали, что, может, если другие студенты подпишут петицию..."
2801-39 = "Хм. Но никому не интересна просто ваша жизнь."
2801-40 = "Иногда нужен интересный крючок, чтобы заставить читателя продолжить."
2801-41 = "Это петиция! Не рассказ! И твоя версия всё равно отстой!"
2801-42 = "А мне вроде понравилось."
2801-43 = "Особенно сцена у костра... Романтично."
2801-44 = "Шигурэ. Пожалуйста. Думаешь, вся эта работа ради литературного конкурса?"
2801-45 = "Здесь должно быть о том, насколько ужасна и страшна наша жизнь!#nА не о твоём выдуманном подростковом романе."
2801-46 = "Представь, если мы отправим это в Секретариат! Эта тупица Черина скажет: «Они должны быть наказаны, а сами счастливы и влюблены! Отстранить их навсегда!»"
2801-47 = "Мне кажется, ты слишком предвзята. Это может стать новым шедевром в истории Кивотоса."
2801-48 = "Тогда пиши в свободное время! А сейчас нам нужна петиция, которая спасёт нас от неизбежной судьбы — замёрзнуть и умереть от голода в Старом институте!"
2801-49 = "Пожалуйста, перепиши её — и на этот раз без выдумок!"
2801-50 = "Ладно. Перепишу."
2801-52 = "«Дорогая Великая Вождь. Товарищи из спецотряда №227 страдают от острой нехватки припасов. Нам даже приходится делить леденцы пополам!»"
2801-53 = "Да! Да! Идеально."
2801-54 = "Добавь, пожалуйста, несколько примеров, чтобы они поняли наши страдания."
2801-55 = "«Нодока жалобно смаковала с таким трудом добытую конфету...»"
2801-56 = "Ч-Что? Мне не нравится, куда всё идёт!"
2801-57 = "«Шигурэ вошла и увидела свою любимую Нодоку, одиноко поедающую конфету. Она опустилась рядом на колени и нежно провела пальцем по её губам...»"
2801-59 = "Стой, хватит! ХВАТИТ!"
2801-61 = "Зачем ты это делаешь?!"
2801-62 = "Потому что..."
2801-63 = "Это весело?"
2801-64 = "Сейчас нам не до веселья! Ух! Не могу я с этими извращёнными библиотекарями Фронта освобождения знаний!"
2801-65 = "Не стоило мне доверять тебе свои надежды и мечты."
2801-66 = "Пожалуйста, покинь наш дом!"
2801-69 = "Хмф. Сама виновата. Когда мой шедевр станет хитом, обещаю о тебе забыть!"
2801-71 = "Мне плевать на твою тупую лживую историю!"
2801-74 = "Какая жалость. Я хотела узнать, чем всё закончится."
2801-75 = "Я уже говорила: с твоим беззаботным отношением мы никогда не выберемся из этого ужасного места."
2801-76 = "Нам нужна петиция, которая тронет сердца сотрудниц Секретариата и заставит их плакать!"
2801-77 = "Я не позволю им и дальше игнорировать нас и само наше существование!"
2801-78 = "Нужно, чтобы это обращение сработало и мы смогли вернуться к нормальной жизни."
2801-79 = "Но... кто пишет лучше, чем Фронт освобождения знаний?"
2801-80 = "Неважно!"
2801-81 = "Для петиции нужны наши искренние чувства, а не красивые слова."
2801-82 = "Нужно просто найти товарищей, которые сочувствуют нашему положению.#nКачество текста тут вообще ни при чём!"
2801-83 = "Пойдём, Шигурэ! Найдём товарищей, которые нам помогут!"
