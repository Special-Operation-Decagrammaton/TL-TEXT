[translation]
1007706-1 = "Пока что"
1007706-3 = "Я обещал встретиться с Ичикой в парке и направился туда."
1007706-4 = "Эм... Сенсей."
1007706-5 = "Ого. Как у вас получается так идеально выбирать момент?"
1007706-6 = "[s1] «Это... Ичика?»\n[s2] «Почему твой голос доносится сверху?»"
1007706-9 = "Ахаха! Потому что я здесь! Сенсей, наверху!"
1007706-10 = "Секундочку. Я сейчас немного занята..."
1007706-11 = "Мне нужно кое-что достать, и я сразу спущусь."
1007706-13 = "Оп!"
1007706-16 = "― [log=이치카]Хаха! Сенсей! Я здесь! Здесь![/log][wa:2280]"
1007706-18 = "― [log=이치카]Вы меня видите?[/log]"
1007706-21 = "― [log=이치카]А! Это просто шарик...[/log][wa:1200]"
1007706-24 = "― [log=이치카]Но когда я его держу...[/log][wa:1180]"
1007706-26 = "― [log=이치카]я похожа на ребёнка, который веселится в парке аттракционов... Хаха.[/log][wa:1300]"
1007706-29 = "― [log=이치카]О! Но он не мой![/log][wa:10]"
1007706-31 = "― [log=이치카]Просто... одно за другим, и...[/log][wa:1140]"
1007706-34 = "[ns3] «Ты залезла туда, чтобы кому-то помочь...»\n[ns4] «Кому-то снова понадобилась помощь, да?»"
1007706-35 = "― [log=이치카]Ну, эм... Да, именно...[/log][wa:1040]"
1007706-36 = "― [log=이치카]Ну, эм... Да, именно...[/log][wa:1040]"
1007706-38 = "― [log=이치카]Как вы узнали?[/log]"
1007706-41 = "― [log=이치카]А...?[/log][wa:10]"
1007706-43 = "― [log=이치카]Неужели меня и правда так легко читать?[/log][wa:10]"
1007706-46 = "― [log=이치카]А. Ну и ладно...[/log][wa:240]"
1007706-48 = "― [log=이치카]Знаете, я ещё никогда не видела вас с такого ракурса.[/log][wa:600]"
1007706-51 = "― [log=이치카]Совершенно новая перспектива.[/log]"
1007706-53 = "― [log=이치카]Всё выглядит... иначе.[/log][wa:700]"
1007706-56 = "― [log=이치카]Забавно.[/log][wa:1500]"
1007706-58 = "― [log=이치카]Кажется, мне нравится! Хаха![/log][wa:1720]"
1007706-61 = "Ичика внезапно спрыгнула с дерева, махнула мне и убежала."
1007706-62 = "Через несколько минут она вернулась уже без шарика."
1007706-64 = "*тяжело дышит* *тяжело дышит* ...Так, я вернулась!"
1007706-65 = "Фух! Если бы я знала, что вы придёте раньше, сама бы поспешила!"
1007706-66 = "Но всё удачно вышло. Я полезла на дерево за этим шариком, потому что ребёнок его потерял."
1007706-67 = "Я боялась, что он полезет за ним сам и поранится, поэтому посадила его ждать на скамейке, пока достану шарик."
1007706-68 = "...Хм?"
1007706-69 = "Думаете, это было впечатляюще? Почему?"
1007706-70 = "Потому что дерево такое высокое?"
1007706-71 = "Ха! Опять вы преувеличиваете."
1007706-72 = "Ничего особенного. Полно людей умеют лазить по деревьям."
1007706-73 = "Просто я оказалась в нужном месте в нужное время. Ничего такого."
1007706-74 = "[s5] «Я не это имел в виду.»\n[s6] «Нет, дело было не в высоте дерева...»"
1007706-77 = "*вздох* Не нужно постоянно говорить такие вещи только ради меня."
1007706-78 = "...Хм?"
1007706-79 = "Погодите — вы правда думаете, что я сделала хорошее дело?"
1007706-80 = "Ну, всем приятно услышать похвалу, но—"
1007706-81 = "Нет, знаете что? Просто приму ваши слова близко к сердцу. Спасибо, Сенсей!"
1007706-82 = "Хи-хи..."
1007706-83 = "Эм..."
1007706-84 = "В общем, причина, по которой я вам написала..."
1007706-85 = "Вы, возможно, уже знаете, я ведь раньше упоминала."
1007706-86 = "Это насчёт... Эм..."
1007706-87 = "*вздох* Я не очень понимаю, как это объяснить. Я хочу..."
1007706-88 = "[s7] «Чем-нибудь по-настоящему увлечься?»\n[s8] «Найти свою страсть?»"
1007706-91 = ""
1007706-93 = ""
1007706-94 = "...Хаха."
1007706-95 = "Значит, вы уже знали. Похоже, ожидали этого."
1007706-96 = "Наверное, я упоминала об этом раз, два... или много раз..."
1007706-97 = "В общем, всё как вы сказали. И я подумала, что, может, вы сможете что-нибудь посоветовать."
1007706-98 = ""
1007706-99 = ""
1007706-100 = "Я знаю, вы и остальные члены Отряда правосудия считаете, что у меня многое хорошо получается."
1007706-101 = ""
1007706-102 = ""
1007706-103 = ""
1007706-104 = "Но дело в том, что я всегда завидую людям, которые по-настоящему увлечены тем, что делают."
1007706-106 = "Конечно, неплохо быть приличной во всём, за что берусь, но какой в этом толк, если я не могу понять, что действительно люблю? Так я никогда ни в чём не стану выдающейся."
1007706-107 = "Человек, который знает, кто он и чем живёт... Он ведь сияет гораздо ярче, понимаете?"
1007706-108 = "Наверное, звучит глупо. И я боюсь, что люди не поймут или будут смеяться надо мной за такие чувства."
1007706-109 = ""
1007706-111 = ""
1007706-112 = ""
1007706-113 = "Так что... Ну... Вот такая ситуация."
1007706-114 = "И поэтому вы единственный человек, с которым я об этом говорила."
1007706-115 = "Уф. Наверное, вы думаете, что я ужасно надоедливая."
1007706-116 = "Не то чтобы я не могла доверить это другим, но... вы же Сенсей."
1007706-117 = "Если у кого и просить совета, то у вас, правда? Это ведь не странно?"
1007706-118 = "...Конечно. Хаха! Надо было ожидать, что вы так скажете."
1007706-119 = "Ладно, тогда..."
1007706-120 = "Что вы мне посоветуете?"
1007706-121 = "Мы встречались всего несколько раз, но ведь этого достаточно, чтобы у вас сложилось какое-то мнение, да?"
1007706-122 = "Что лучше? Какой из моих талантов, по-вашему, лучше всего отражает меня настоящую?"
1007706-123 = "Или, может, есть что-то, чего я ещё не пробовала, но что, по-вашему, мне понравится?"
1007706-124 = "А, я немного внезапно всё это на вас вывалила, да?"
1007706-125 = "...Хм?"
1007706-126 = "...О, у вас есть идея?! Но вы... не можете мне сказать..."
1007706-127 = "Что?! Почему?"
1007706-128 = "Не понимаю."
1007706-129 = "...А."
1007706-130 = "Что мне нужно сделать сначала?"
1007706-131 = "[s9] «Перестань пытаться выдавить это из себя.»\n[s10] «Доверься своему сердцу.»"
1007706-134 = ""
1007706-136 = ""
1007706-137 = "...А?"
1007706-138 = "Простите. Что вы хотите, чтобы я сделала?"
1007706-139 = "Я не понимаю, что вы имеете в виду."
1007706-140 = "Если только вы просто не знаете, что сказать... Вы же не махнули на меня рукой, правда?"
1007706-141 = "...Правда? Потому что звучит именно так. Я так и знала. Я безнадёжна!"
1007706-142 = "[s11] «Нет, это не так. С тобой всё нормально.»\n[s12] «Мне просто кажется, что ты слишком многого от себя требуешь.»"
1007706-145 = "О. Хм..."
1007706-146 = "Кажется, я понимаю... наверное..."
1007706-147 = "...Хм."
1007706-148 = "...Хи-хи."
1007706-149 = "Простите. Если честно, я всё ещё не уверена, что понимаю."
1007706-150 = "Мне казалось, что я И ТАК доверяю своему сердцу..."
1007706-151 = "Эм... Но..."
1007706-152 = "Вы говорите искренне, Сенсей, и обычно знаете, о чём говорите."
1007706-153 = "Так что я ещё подумаю о том, что значит доверять своему сердцу."
1007706-154 = ""
1007706-156 = ""
1007706-157 = "А пока я доверюсь вам и вашему совету, Сенсей!"
1007706-158 = "[s13] «Ичика...?»\n[s14] «Насчёт того, что было раньше...»"
1007706-161 = "О, точно! Мы теряем световой день!"
1007706-162 = "Нам пора начинать! Время следовать зову сердца!"
1007706-163 = "А до конца дня..."
1007706-164 = "Вы весь мой!"
1007706-166 = "Мы отлично повеселились в парке развлечений, пока Ичика не устала и не отправилась домой."
1007706-167 = "Похоже, она была чрезвычайно довольна тем, как прошёл день."
