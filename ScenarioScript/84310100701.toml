[translation]
84310100701-5 = ""
84310100701-6 = "...Ты точно хочешь услышать историю тех, кто не справился?"
84310100701-7 = "Н-Нет! Я не это имела в виду! На самом деле я хотела узнать, что нужно, чтобы попасть в эти 2%."
84310100701-8 = "...Ну, думаю, Нэру смогла бы этого добиться."
84310100701-10 = "Было бы впритык. В бою я могу двигаться сколько угодно, но непрерывно бегать ради тренировки — совсем другое дело."
84310100701-11 = "...Верно, но если бы тебе показалось, что проигрываешь, ты бы выложилась по полной, чтобы победить."
84310100701-12 = "Это..."
84310100701-13 = "...да, звучит вполне вероятно."
84310100701-14 = "(Значит, это ориентир. От него уже можно примерно прикинуть.)"
