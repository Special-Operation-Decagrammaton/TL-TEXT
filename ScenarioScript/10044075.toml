[translation]
10044075-2 = "Ух! Эти мелкие сильнее, чем я думала..."
10044075-3 = "Если бы мы продвинулись ещё немного... могли бы захватить весь Чёрный рынок..."
10044075-4 = ""
10044075-6 = ""
10044075-8 = "Насколько далеко разошлись эти слухи?"
10044075-9 = "Даже мы не знаем, что тут внутри."
10044075-10 = "Знаешь тех гоблинов, которые охраняют сундуки и всё такое? Пахяхя, теперь я понимаю, что они чувствуют!"
10044075-12 = "*вздыхает*"
10044075-13 = "Ситуация под контролем."
10044075-14 = "[ns1] «Ещё раз спасибо, Иори.»\n[ns2] «Комитет по порядку снова спасает положение.»"
10044075-17 = "Вы на нашей территории. Конечно, мы вмешались."
10044075-18 = "Но это... не значит, что мы просто вас отпустим."
10044075-19 = "..."
10044075-20 = "...Хотя полагаю, у вас всегда есть свои причины, с какими бы учениками вы ни были в этот раз."
10044075-21 = "[s] «То есть ты мне веришь...!»"
10044075-22 = "Я верю в то, что сразу после этого вы придёте в Комитет по порядку и всё объясните."
10044075-23 = "А раз вы уже покидаете наш район, я оставлю вас в покое."
10044075-24 = "Пахяхя, отличная работа! Ты прямо ас Комитета по порядку!"
10044075-25 = "Нет, я не ас."
10044075-26 = "Поезд двигался, а попадание идеальное! Хикари впечатлена!"
10044075-28 = "С-Спасибо, правда... Перед глазами уже вся жизнь пронеслась. Вы нас спасли..."
10044075-29 = "Я-я найду способ отплатить вам, даже если придётся из своего кармана!"
10044075-30 = "...Хм."
10044075-31 = "Ну... берегите себя, друзья из Хайлендер."
10044075-32 = "И вы тоже, Сенсей."
10044075-33 = "[s] «Ага. Ещё раз спасибо, Иори.»"
10044075-34 = ""
10044075-36 = ""
10044075-37 = "Ого, Сенсей, не думала, что по дороге мы встретим ваших друзей!"
10044075-38 = "И правда всё решает то, кого ты знаешь, да? Друзья и связи... как мне, чёрт возьми, выживать в таком мире?"
10044075-39 = "У тебя не-е-ет друзей?"
10044075-40 = "К-КАК, по-твоему, мне слышать такой вопрос?!"
10044075-41 = "Похоже, не-е-ет друзей."
10044075-42 = "*вздох* Форма не делает вас менее избалованными детьми."
10044075-43 = "У Хикари мно-о-ого друзей. Спроси Сенсея."
10044075-44 = "Ты ведь так и будешь меня доставать, да? ...Сенсей останется Сенсеем, как бы ты ни себя вела."
10044075-45 = "А...?"
10044075-46 = "Я хотела сказать: хочешь стать дру-у-жочкой?"
10044075-47 = "П-Почему ты спра—? О. О нет. Посмотрите на груз."
10044075-49 = "Корпус треснул. Наверное, от последнего взрыва."
10044075-51 = "Хмм. К счастью, похоже, это всего лишь небольшая трещина в оболочке..."
10044075-52 = ""
10044075-54 = ""
10044075-55 = "...Хм. Значит, это И ПРАВДА поезд с сокровищами."
10044075-56 = "[ns] «Ух ты...»"
10044075-58 = ""
10044075-59 = "Тц... Я совсем НЕ так всё представляла."
10044075-60 = "Ч-Что теперь делать, Президент?"
10044075-61 = "Полный бардак. Все нападают друг на друга, а потом ещё и Геенна появилась..."
10044075-62 = "Кажется, от остальных мы оторвались, но и поезд потеряли..."
10044075-63 = "..."
10044075-64 = "Нам конец?"
10044075-65 = "Нет. Выход есть всегда."
10044075-66 = "Доставка, пробка, дорожная ярость..."
10044075-67 = "Выход есть всегда. Мы просто ещё его не нашли..."
10044075-68 = ""
10044075-70 = ""
10044075-71 = ""
10044075-72 = "...А! Придумала. Переворачиваем игру."
10044075-73 = "К-Как??"
10044075-74 = "До того как клиент сменил курьера, нам сказали, где будет точка доставки."
10044075-75 = "Приедем туда раньше них, подождём..."
10044075-77 = "...потом наставим на них оружие и заберём груз..."
10044075-79 = "...а затем развернёмся и отдадим его клиенту!"
10044075-81 = "Это... нормально?"
10044075-83 = "Я-я не очень разбираюсь в таких вещах, но это вообще считается «доставкой»?"
10044075-84 = "Конечно считается!"
10044075-85 = "Мы будем «курьером последней мили.» Так это называется. Неважно, как груз попадёт в руки клиента, главное, что попадёт, верно?"
10044075-86 = "Н-Наверное..."
10044075-87 = "Это сделает нас крупным игроком отрасли. А потом мы развернём нашу организацию по всему Кивотос!"
10044075-88 = "Наши мечты наконец сбудутся!"
10044075-89 = "Поехали. Сейчас они впереди, но скорость на нашей стороне!"
10044075-90 = ""
