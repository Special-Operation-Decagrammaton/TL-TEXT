[translation]
10023075-3 = "Аргх! Нет!"
10023075-4 = "Вы достойно сражались, но мы оказались сильнее."
10023075-5 = "А теперь у меня к тебе несколько вопросов, Мэйтаро."
10023075-6 = "Почему и как все эти украденные произведения оказались в этом подвале?"
10023075-7 = "Эм..."
10023075-8 = "Я правда не хотел до этого доводить..."
10023075-9 = ""
10023075-11 = ""
10023075-12 = ""
10023075-14 = "Но я нанял охрану Генрюмон из Шаньхайцзина!"
10023075-16 = "Шаньхайцзин? Генрюмон?"
10023075-17 = "[s1] «В каком-то смысле ты весьма основателен.»\n[s2] «Ты ведь пойдёшь на всё, чтобы добиться своего, правда?»"
10023075-18 = ""
10023075-19 = ""
10023075-22 = ""
10023075-24 = "Резерв, приготовиться к бою!"
10023075-25 = ""
10023075-28 = ""
10023075-29 = ""
10023075-30 = ""
10023075-32 = "Э-эти гости только что..."
10023075-33 = "...превратились в охранников Генрюмон...!"
10023075-34 = ""
10023075-38 = ""
10023075-41 = ""
10023075-43 = "Ч-что нам делать, Сенсей? Их гораздо больше!"
10023075-44 = "Цк. Если бы мой усиленный костюм был здесь..."
10023075-45 = ""
10023075-47 = ""
10023075-48 = ""
10023075-49 = ""
10023075-50 = ""
10023075-51 = ""
10023075-53 = "Что происходит? Я ничего не вижу!"
10023075-54 = ""
10023075-57 = "Сюда. За мной!"
10023075-58 = "[s] «Я узнаю этот голос!»"
10023075-59 = ""
10023075-70 = "Я пошёл на голос сквозь ослепляющий густой дым и едва успел выбраться из особняка."
10023075-74 = "*тяжело дышит* *тяжело дышит*"
10023075-75 = "Я... вымоталась..."
10023075-77 = "Ох... Я больше не могу сделать ни шагу..."
10023075-78 = "Насыщенный выдался вечер."
10023075-79 = "Хотя сейчас уже правильнее сказать — ночь."
10023075-80 = "Никто не ранен? Вы в порядке, Сенсей?"
10023075-81 = "[s3] «Отличная работа, все. И ты тоже.» \n[s4] «Хотя, кажется, у нас гостья.»"
10023075-82 = ""
10023075-83 = ""
10023075-86 = ""
10023075-87 = "О ком вы говорите, Сенсей?"
10023075-88 = ""
10023075-92 = "Совпадение, прихоть, счастливая случайность, непредсказуемость... Всё это понятия, ведущие к великому стремлению к искусству."
10023075-93 = ""
10023075-95 = ""
10023075-96 = "Кто здесь?"
10023075-97 = ""
10023075-99 = ""
10023075-102 = ""
10023075-103 = "Хихи. Это я! Надеюсь, у вас всё хорошо. Кто бы мог подумать, что наша следующая встреча произойдёт при столь волнующих обстоятельствах?"
10023075-104 = ""
10023075-107 = ""
10023075-109 = ""
10023075-111 = "С-С-Сенсей? Что, чёрт возьми, происходит?!"
10023075-112 = "[s5] «Момои, понимаю, всё запутанно! Но этому есть объяснение!» \n[s6] «Момои, мы выбрались только благодаря Благородной Воровке.»"
10023075-113 = ""
10023075-114 = ""
10023075-116 = "Сенсей прав. Я так и думала, но тот дым, должно быть, был..."
10023075-118 = "Здесь ничего... никого нет..."
10023075-119 = ""
10023075-121 = ""
10023075-123 = ""
10023075-124 = "[ns7] «Я и растерян, и благодарен за помощь.»\n[ns8] «Спасибо... но почему ты нам помогла?»"
10023075-127 = "Понимаю. Позвольте мне объяснить и, надеюсь, устранить все недоразумения."
10023075-128 = "Определённым... способом я узнала, что Мэйтаро обманывает вас всех."
10023075-129 = ""
10023075-131 = ""
10023075-132 = "Благородная Воровка, говоря это, бросила на меня быстрый многозначительный взгляд."
10023075-135 = ""
10023075-137 = "Я вспомнил наш тихий разговор через её устройство связи, когда погас свет."
10023075-138 = "Убедившись, что ни C&C, ни вы, Сенсей, не были моими врагами, я сделала свой ход."
10023075-139 = "Вот почему я подталкивала вас разгадать загадку, Сенсей. Чтобы вы нашли подземный аукционный зал и поняли, кто наш настоящий враг."
10023075-140 = "И чтобы помочь нашему кролику из C&C найти дорогу к сокровищу."
10023075-142 = "Информация... перегрузка... Это слишком много, я не успеваю всё осмыслить!"
10023075-143 = "Так... Ты хочешь сказать, что нам не нужно драться?"
10023075-145 = ""
10023075-147 = ""
10023075-148 = "Думала, я не раскушу твои жалкие уловки, Благородная Воровка?"
10023075-149 = "Ох, о чём это ты?"
10023075-151 = "Иногда враг твоего врага может стать союзником. Но не всегда. И не сейчас."
10023075-153 = "М-можно спросить? Если ты Благородная Воровка, то ты и правда одна из Семи Заключённых, да?"
10023075-154 = "Т-тогда это значит..."
10023075-156 = "Хи-хи."
10023075-157 = ""
10023075-159 = ""
10023075-161 = ""
10023075-163 = "Что ты хотела сказать?"
10023075-164 = "Что нельзя разговаривать с опасной преступницей из Семи Заключённых? Что не станешь связываться с какой-то мелкой воровкой?"
10023075-166 = "Э-э..."
10023075-168 = "Факт в том, что ты одна из Семи Заключённых, а твоя цель совпадает с целью C&C: Корона Короля Часов."
10023075-169 = "Так что нет. Мы не можем бездумно доверять преступнице."
10023075-170 = "[s9] «Просто выслушайте меня секунду.» \n[s10] «Эй, стойте! У меня есть предложение!»"
10023075-173 = "Д-да, Сенсей?"
10023075-174 = "О? Мудрые слова от самого Сенсея из Шале?"
10023075-176 = "[ns] «Я хочу, чтобы мы заключили союз.»"
10023075-177 = ""
10023075-179 = ""
10023075-181 = ""
10023075-182 = ""
10023075-184 = "...Когда операция сорвана, иногда разумно заключить временный союз с потенциально полезной стороной против общего врага."
10023075-185 = "Но это не относится к союзу с одной из Семи Заключённых. Мы не можем работать с преступниками."
10023075-186 = "Хи-хи. А я считаю это предложение превосходным! И правда мудрые слова!"
10023075-187 = "Полагаю, люди с таким узким взглядом на мир просто не способны понять."
10023075-188 = "Сенсей! Приступаю к устранению опасной преступницы!"
10023075-189 = "[s11] «Никакого устранения! Давайте успокоимся и поговорим.» \n[s12] «Почему бы не начать с представлений?»"
10023075-192 = "Хорошо. Только ради вас, Сенсей."
10023075-193 = "Вообще-то мы из Отдела разработки игр Научной школы Миллениум."
10023075-194 = "Этот Мэйтаро почему-то принял меня за члена C&C, и прежде чем мы успели опомниться, мы уже защищали особняк от тебя!"
10023075-195 = "Он сказал, что какая-то хитрая воровка прислала визитную карточку и собирается украсть его картину... что-то там с церемонией посвящения в рыцари."
10023075-196 = "А потом... каким-то образом начали открываться стены, появилась тайная лестница, мы нашли аукцион, но он оказался на день раньше, а потом Мэйтаро такой: «Гр-р! C&C!» — и напал на нас..."
10023075-197 = "...Как мы вообще до этого дошли?"
10023075-199 = "Я и подозревала, но вы действительно понятия не имели, во что ввязались."
10023075-200 = "Д-да и что с того?! Откуда нам было знать?! Это не наша вина!"
10023075-201 = "И всё же вы разгадали мою визитную карточку, даже будучи ограничены своим неведением. Браво!"
10023075-202 = "Д-да?!"
10023075-203 = "Ну конечно! Мы из Отдела разработки игр день и ночь без устали тренировались в головоломках и приключенческих играх именно ради этого момента!"
10023075-204 = "Как чудесно."
10023075-207 = "Что ж, я раскрыла свои карты. Подземный аукционный зал с самого начала был моей целью."
10023075-208 = "Его построили специально для тех отвратительных дел, которые вы сами видели: продажи и аукциона украденных произведений искусства."
10023075-209 = "А руководит всем этим владелец особняка — Мэйтаро."
10023075-210 = "Мне придётся проверить эти сведения."
10023075-211 = "Но как бы то ни было, факты очевидны. Все украденные произведения, которые разыскивала C&C, находятся среди лотов этого аукциона."
10023075-212 = "Тогда какого чёрта была нужна выставка наверху?"
10023075-215 = "Празднество наверху скрывает мрачную правду внизу."
10023075-216 = "Я пришла в этот прискорбный подвал в поисках Короны Короля Часов."
10023075-217 = "Корона Короля Часов желанна потому, что она действительно единственная в своём роде. Другой такой нет во всём Кивотосе."
10023075-218 = "Искусство прекрасно! Запирать искусство, копить его, назначать ему столь пошлую цену? Это оскорбляет мои представления о красоте."
10023075-220 = "Ну что, есть вопросы?"
10023075-221 = "Мэйтаро всё это время из-за кулис манипулировал каждым вашим шагом."
10023075-222 = "Он коварен и расчётлив. Такое трудно даже представить людям вроде вас."
10023075-223 = "У меня уже голова болит... Но стой! Я не настолько наивна, чтобы сразу поверить рассказу злодейки!"
10023075-224 = "Хи-хи. Вполне понимаю."
10023075-225 = "Но прошу, уделите мне ещё минутку."
10023075-226 = "Кому вы поверите: тому, кто на вас напал, или той, кто вас спасла?"
10023075-227 = "[s13] «Я давно хотел поблагодарить тебя за спасение Мидори.» \n[s14] «Мне давно интересно, почему ты спасла Мидори...»"
10023075-230 = "Да. Конечно же, я сделала это ради своих идеалов."
10023075-231 = "Это нарушило бы мои стандарты красоты, если бы я позволила пролить невинную кровь перед чем-то действительно ценным."
10023075-232 = "[s] «Стандарты красоты...»"
10023075-233 = "Хи-хи."
10023075-234 = ""
10023075-236 = ""
10023075-238 = ""
10023075-240 = "Вернёмся к чудесной идее Сенсея из Шале. Я бы хотела закрепить наше соглашение. Пожмёте мне руку?"
10023075-241 = ""
10023075-244 = ""
