[translation]
2006103-1 = "Regarding the Proper Temperature"
2006103-3 = "[ns] \"Whew...\""
2006103-5 = "Oh, did it heat up?"
2006103-10 = "Did you enjoy it?"
2006103-11 = "[s1] \"The water temperature was just right.\"\n[s2] \"It was amazing...\""
2006103-14 = "I see, I see. Tell the others as well. I am sure they will be pleased."
2006103-15 = "Even so, building a hot spring here was the right choice. It was worth tearing up the road!"
2006103-16 = "[s] \"...What did you say?\""
2006103-17 = "Ah, do not worry about it. Hot springs, rather than lukewarm ones --"
2006103-23 = "Director, it is bad! The Prefect Team is here!!"
2006103-24 = "Hm? According to my calculations, we should have had about two more hours..."
2006103-25 = "Tch, did their patrol schedule change? How unluckily."
2006103-29 = "...It cannot be helped."
2006103-30 = "Our bodies are nice and relaxed from the hot spring. Shall we make a run for it!"
2006103-31 = "[s] \"Eeeh?!\""
2006103-42 = "Ha-ha-ha-ha-ha! We were caught with surprising ease!"
2006103-43 = "[s3] \"Why am I dragged into this...\"\n[s4] \"Why did it come to this...\""
2006103-46 = "You do not need to worry."
2006103-47 = "Putting aside myself, Sensei's innocence will surely be proven in no time."
2006103-48 = "Not that I intend to stay long, anyway."
2006103-52 = "Even so, to think the day would come when I am thrown in here together with Sensei."
2006103-53 = "Life is full of unexpected things."
2006103-54 = "Well, I suppose this is part of the charm."
2006103-58 = "...Sensei?"
2006103-59 = "You have been quiet for a while now..."
2006103-60 = "...Could you be angry?"
2006103-61 = "This is bad... This time I really have no room for excuses..."
2006103-62 = "If I had to push it, the Prefect Team is also somewhat at fault for dragging us off without properly checking--"
2006103-63 = "[s5] \"Ah, no, that is not it.\"\n[s6] \"It is just that my impression of Kasumi feels different compared to last time.\""
2006103-66 = "What are you talking about?"
2006103-67 = "Different... me?"
2006103-68 = "...Ah, I see. That is slightly off."
2006103-69 = "I have not changed. I am entirely my usual self."
2006103-70 = "A madman who would do anything for a hot spring, utterly devoted to demolition and development."
2006103-71 = "...Right?"
2006103-72 = "[s7] \"Which one is your real self?\"\n[s8] \"What is Kasumi's true intent?\""
2006103-75 = "Whichever is more advantageous!"
2006103-76 = "...Please do not look at me with those eyes. I have no interest in what people think of me.#nWhat matters is what I make them think."
2006103-77 = "When I am with Sensei, playing nice tends to lead to a smoother resolution."
2006103-78 = "Unfortunately, however, in most cases..."
2006103-79 = "So, well... by making you think I was caught quietly --"
2006103-89 = "Cough, cough...!"
2006103-90 = "There is more dust flying around than I expected. Let us use a different method next time."
2006103-95 = "I came to save you!"
2006103-96 = "After we hid for a while, everyone just went away! Just like the Director said!"
2006103-98 = "Well, that is because their main force is not here yet. If we stage a diversion, they will take the bait."
2006103-99 = "...Now, what were we talking about?"
2006103-102 = "Ah, yes.#nHot springs can never be too hot, that is all."
