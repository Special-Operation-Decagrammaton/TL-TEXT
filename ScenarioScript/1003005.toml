[translation]
1003005-1 = "Подарок в знак благодарности"
1003005-2 = "Сувенирный магазин на курорте с горячими источниками"
1003005-3 = "Вот вы где, Сенсей. Я ждала."
1003005-4 = "Спасибо, что нашли время в своём плотном графике."
1003005-5 = "Надеюсь, я не мешаю вашему отдыху."
1003005-6 = "[s1] «Вовсе нет.»\n[s2] «Я был свободен.»"
1003005-7 = "Я рад это слышать."
1003005-8 = "Я рад это слышать."
1003005-9 = "Я попросила вас прийти, потому что... мне нужно купить подарки в знак благодарности."
1003005-10 = "[s] «Подарки в знак благодарности?»"
1003005-11 = "Да. Пусть меня в некотором смысле и заставили, но я всё же отправилась в отпуск."
1003005-12 = "Раз я взяла выходной, пока остальные участницы усердно работали, вернуться с подарками — самое меньшее, что я могу сделать."
1003005-13 = "Но я никогда раньше не отдыхала одна, поэтому понятия не имею, какие подарки им купить..."
1003005-14 = "Поэтому я и прошу совета у такого опытного взрослого, как вы, Сенсей."
1003005-15 = "[s3] «Подарок, который понравится студентам...»\n[s4] «Я тоже не уверен...»"
1003005-16 = "Правда? Вы очень популярны среди студентов, поэтому я думала, что вы знаете, что им нравится... Я немного удивлена."
1003005-17 = "Правда? Вы очень популярны среди студентов, поэтому я думала, что вы знаете, что им нравится... Я немного удивлена."
1003005-18 = "[s] «Ну, а что обычно нравится членам Префекторской команды?»"
1003005-19 = "Что им нравится..."
1003005-20 = "Все студенты Геенны такие разные, что выбрать что-то, что понравится каждой, непросто."
1003005-21 = "Хм..."
1003005-22 = ""
1003005-24 = ""
1003005-25 = "Почему бы не начать с того, что выставлено на витринах?"
1003005-27 = "Здесь столько разных сувениров с горячих источников. Я даже немного удивилась разнообразию."
1003005-28 = "Возьмите хотя бы печенье. Десятки видов в зависимости от вкуса и формы..."
1003005-29 = "Определиться будет нелегко."
1003005-30 = "[s] «Как насчёт мандзю с Пероро?»"
1003005-31 = "Эта птица странной формы встречается повсюду. Не понимаю, почему она так популярна."
1003005-32 = "Но довольно многие участницы команды её терпеть не могут, так что мандзю с Пероро, думаю, не подойдут."
1003005-33 = "Нужно найти что-то с другим дизайном."
1003005-34 = "[s] «Как насчёт этой особой бомбочки для ванны?»"
1003005-35 = "<Особая адская бомбочка для ванны Геенны. Взрывается при контакте с влагой, превращая окружающее пространство в подобие ада. Работает и в холодной воде.>"
1003005-36 = "Интересно, но я немного опасаюсь, что участницы команды используют её для чего-нибудь плохого."
1003005-37 = "Лучше найти что-нибудь менее опасное."
1003005-38 = ""
1003005-41 = "[ns] «Как насчёт ленты с символом горячих источников?»"
1003005-42 = "Это... довольно милый подарок."
1003005-43 = "Ленты нравятся большинству людей, и при этом сразу видно, что она с горячих источников."
1003005-44 = "Но она слишком дорогая. Не думаю, что смогу позволить себе купить по одной всем."
1003005-45 = "К сожалению, придётся поискать другой подарок."
1003005-46 = "Сенсей, давайте посмотрим вон там."
1003005-48 = "После этого мы ещё некоторое время рассматривали множество витрин."
1003005-51 = "Думаю, всем понравится это простое желе из сладкой фасоли со вкусом зелёного чая."
1003005-52 = "Оно не слишком сладкое, но всё же лакомство. Но подходит ли такой обычный подарок?"
1003005-53 = "[s5] «Твоя искренность важнее самого подарка.»\n[s6] «То, что он обычный, даже лучше!»"
1003005-54 = "...Хи-хи, правда?"
1003005-55 = "...Хи-хи, правда?"
1003005-56 = "Мне приятно это слышать, Сенсей."
1003005-57 = "Спасибо за сегодня. Благодаря вам я смогла выбрать подарок."
1003005-58 = "Кстати, раньше я видела, как вы что-то покупали..."
1003005-59 = "У вас тоже есть кто-то, кому вы хотите подарить что-нибудь в знак благодарности?"
1003005-60 = ""
1003005-62 = ""
1003005-63 = ""
1003005-65 = "[ns] «Это для тебя, Чинацу.»"
1003005-66 = "...Что?! Подарок в знак благодарности мне?!"
1003005-68 = "Это та самая лента, на которую я смотрела раньше..."
1003005-69 = "Но это вы только и делали, что помогали мне, Сенсей. Почему же вы дарите подарок мне..."
1003005-70 = "[s7] «За то, что следишь за моим здоровьем.»\n[s8] «За то, что хорошо проводишь со мной время.»"
1003005-71 = ""
1003005-72 = ""
1003005-74 = ""
1003005-75 = "...Вы и правда невероятный человек, Сенсей."
1003005-76 = "Даже когда я ничего вам не говорю, кажется, будто вы способны читать моё сердце..."
1003005-77 = "Ещё раз спасибо, Сенсей."
1003005-78 = "Эту ленту... я буду беречь."
