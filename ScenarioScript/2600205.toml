[translation]
2600205-1 = "Решимость девушки"
2600205-2 = "(Перед встречей в столовой мы с Юри решили, что будем готовить.)"
2600205-3 = "(Сегодня — мисо-суп.)"
2600205-4 = "*вдох* *выдох*"
2600205-5 = "[s] «Нервничаешь?»"
2600205-6 = "Да. После каждой неудачи я пытаюсь понять, что сделала не так."
2600205-7 = "Готовка всегда даётся мне непросто, а уж когда пробую что-то новое — тем более."
2600205-8 = "Но если мы поймём, что именно я всё это время делала неправильно..."
2600205-9 = "...тогда я смогу сосредоточиться на готовке и больше не ошибаться!"
2600205-11 = "Начнём с подготовки ингредиентов."
2600205-12 = "[s] «Стой! Перед началом пообещай мне одну вещь.»"
2600205-13 = "Ты хочешь, чтобы я что-то пообещала?"
2600205-14 = "[s] «Да. Пообещай, что в этот раз...»"
2600205-16 = "[s1] «...ты не будешь использовать приборы, которых нет в рецепте.»\n[s2] «...ты не будешь использовать ингредиенты, которых нет в исходном рецепте.»\n[s3] «...ты не будешь делать НИЧЕГО, чего нет в рецепте.»"
2600205-17 = "О-О. Поняла..."
2600205-18 = "О-О. Поняла..."
2600205-19 = "О-О. Поняла..."
2600205-20 = "То есть ты хочешь сказать, что нужно думать только о готовке, а не об эффективности."
2600205-21 = "[s] «Ты правда всё это делала ради эффективности...?»"
2600205-22 = "Ладно, хорошо! Я поняла."
2600205-23 = "В этот раз буду делать только то, что написано в рецепте!"
2600205-25 = "(Шаг за шагом мы с Юри вместе приготовили мисо-суп.)"
2600205-28 = "Готово, Сенсей!"
2600205-29 = "[s] «Хорошо. Давай попробую.»"
2600205-30 = "*глоть*"
2600205-33 = ""
2600205-34 = ""
2600205-37 = ""
2600205-38 = "[ns] «Э-Этот вкус...!»"
2600205-39 = "Н-Ну как?"
2600205-40 = "[s4] «Кисло, солёно, сладко, остро...»\n[s5] «Это совсем не похоже на мисо-суп!»"
2600205-41 = "Ч-что?!"
2600205-42 = "Ч-что?!"
2600205-43 = "Почему?!"
2600205-44 = "[s] «Тогда... начнём всё с нуля!»"
2600205-45 = "(Мы решили начать заново с новыми ингредиентами, а не теми, что принесла Юри.)"
2600205-46 = "Ты прав. Может, проблема была в ингредиентах."
2600205-47 = "Если использовать те, что принёс ты..."
2600205-48 = "Ладно. Я смогу."
2600205-49 = "Попробую ещё раз по рецепту!"
2600205-52 = "Г-Готово!"
2600205-53 = "[s] «Ну... Вот и ещё одна попытка!»"
2600205-56 = ""
2600205-59 = ""
2600205-60 = "Н-Ну как?!"
2600205-61 = "[s] «Солёное. Сладкое. Острое. Кислое...!»"
2600205-62 = "Что?! Как такое возможно?!"
2600205-63 = "[s] «Ещё раз! Снова с самого начала!»"
2600205-64 = "Что будем делать теперь?!"
2600205-65 = "(В этот раз мы решили приготовить каждый своё блюдо, а на полпути поменяться и закончить блюдо друг друга.)"
2600205-66 = "[s] «Теперь-то точно получится!»"
2600205-70 = "[ns] «Теперь оно просто солёное!»"
2600205-71 = "*шок*"
2600205-72 = "[s] «Тогда...!»"
2600205-73 = "(Мы снова сменили тактику. На этот раз почти всё готовил я, а Юри должна была лишь довести блюдо до кипения.)"
2600205-78 = "[ns] «Вкус вообще не изменился!»"
2600205-80 = "(Мы пробовали снова и снова, но всё, к чему прикасалась Юри, приобретало странный вкус.)"
2600205-81 = "(Вкус супа необъяснимо менялся даже тогда, когда Юри просто опускала половник в блюдо, которое я целиком приготовил по рецепту.)"
2600205-82 = "[s] «Это что, проклятие какое-то?»"
2600205-83 = "..."
2600205-84 = "Что вообще происходит?!"
2600205-85 = "Я..."
2600205-86 = "Я просто хотела хоть раз приготовить блюдо и ничего не испортить!"
2600205-87 = "[s] «Ну...»"
2600205-88 = "У меня всё равно не получилось..."
2600205-89 = "Не получилось даже с тобой рядом."
2600205-90 = "Я уже привыкла к провалам на кухне."
2600205-91 = "Но сегодня, раз ты был со мной..."
2600205-92 = "...я надеялась, что вместе у нас всё получится."
2600205-93 = "И тогда я смогла бы показать тебе, что тоже умею готовить вкусно."
2600205-94 = "*всхлип* Прости, Сенсей... *рыдает*"
2600205-95 = "[s] «Нет.»"
2600205-97 = "[s] «Сдаваться ещё слишком рано.»"
2600205-98 = "Сенсей?"
2600205-99 = "[s] «Давай попробуем ещё раз. Начнём с самого начала, шаг за шагом.»"
2600205-100 = "Что?"
2600205-101 = "[s] «Ничего страшного. Не получилось с первого раза — пробуй снова.»"
2600205-103 = "[s6] «Если этот способ не сработает, попробуем другой.»\n[s7] «Я лучше всех знаю, как сильно ты стараешься.»"
2600205-104 = "Ты знаешь, насколько это для меня важно...?"
2600205-105 = "Ты знаешь, насколько это для меня важно...?"
2600205-106 = "..."
2600205-107 = "О, Сенсей!"
2600205-108 = "[s] «Что-то случилось?»"
2600205-109 = "Нет! Я хотела сказать... ты совершенно прав!"
2600205-110 = "Я... позволила себе пасть духом."
2600205-111 = "Я Ушимаку Юри из Клуба школьного питания, и так просто не сдамся."
2600205-112 = "Я продолжу бороться. Ради тебя, Сенсей!"
2600205-113 = ""
2600205-114 = ""
2600205-115 = "[s] «Юри, ты в порядке?»"
2600205-116 = "Так и знала. Твои руки, Сенсей..."
2600205-117 = "Они тёплые."
2600205-118 = "Сенсей, встань позади меня и направляй мои руки."
2600205-119 = "Начнём с самого начала. Сперва я нарежу ингредиенты."
2600205-120 = "Я не отпущу тебя, пока у меня всё не получится!"
2600205-122 = "(Так мы с Юри и провели остаток дня, готовя вместе.)"
