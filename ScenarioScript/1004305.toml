[translation]
1004305-1 = "Трепещущее сердце у костра"
1004305-3 = "Подготовка завершена."
1004305-4 = "Отличная работа, все!"
1004305-5 = ""
1004305-10 = "[ns] «Фух, наконец закончили...»"
1004305-11 = "Было много суматохи, но в итоге мы смогли подготовиться к фестивалю без серьёзных проблем."
1004305-12 = ""
1004305-15 = "Когда появилось свободное время, я ответил Вакамо в MomoTalk."
1004305-16 = "[s] «Я закончил работу. Ты где?»"
1004305-17 = ""
1004305-20 = "Вакамо некоторое время не отвечала, что было необычно."
1004305-21 = "[s] «Вакамо всё ещё не ответила. Странно...»"
1004305-22 = ""
1004305-25 = "Погода портится."
1004305-26 = "Очень ветрено, значит, волны будут сильными."
1004305-27 = ""
1004305-30 = "Внезапно я занервничал."
1004305-31 = ""
1004305-34 = "[ns] «...Я скоро вернусь.»"
1004305-35 = "Сенсей? Шторм усиливается. Подождите!"
1004305-48 = "Я ещё какое-то время нервно осматривался вокруг."
1004305-52 = "[ns] «*тяжело дышит* Вот ты где...»"
1004305-53 = ""
1004305-54 = ""
1004305-55 = "О, Сенсей! Ты пришёл!"
1004305-58 = "[ns] «...Вакамо, что ты здесь делаешь?»"
1004305-59 = "Серьёзно?"
1004305-60 = "Я, конечно же, ждала вас!"
1004305-61 = "[s] «Ты ждала меня? В такую погоду? Почему?»"
1004305-62 = "Хи-хи-хи. Что за вопрос? Вы такой забавный."
1004305-63 = "Ответ очевиден..."
1004305-64 = "Мы с вами дали обещание."
1004305-65 = "«...Сейчас я занят. Можешь немного подождать?»"
1004305-66 = "Именно это вы сказали, и я послушалась."
1004305-67 = "Неважно, дождь или снег. Я буду ждать вас где угодно."
1004305-68 = "Вот что значит обещание."
1004305-69 = "[s] «Обещание... Ты говорила это и на складе фейерверков.»"
1004305-72 = "Хи-хи-хи! Я обещала сделать сегодняшний день особенным."
1004305-73 = "Эти препятствия постоянно нас прерывали..."
1004305-74 = "Да! Я собираюсь взорвать все фейерверки!"
1004305-77 = "[ns] «Значит, ты пыталась сдержать обещание.»"
1004305-78 = "Да, верно."
1004305-79 = "Эм... Я опять сделала что-то не так?"
1004305-80 = "Я снова ошиблась?"
1004305-81 = "[s1] «Нет, это я был неправ, заставив тебя ждать в таком месте.»\n[s2] «Нет, ошибся я. Нужно было объяснить лучше.»"
1004305-82 = "А?"
1004305-83 = "А?"
1004305-84 = "Нет, я привыкла ждать. Это пустяки..."
1004305-85 = ""
1004305-87 = ""
1004305-88 = ""
1004305-90 = ""
1004305-92 = "*ахает* С-Сенсей?!"
1004305-93 = ""
1004305-95 = "[ns3] «...Ты совсем не в порядке.»\n[ns4] «Ты замёрзла, Вакамо!»"
1004305-96 = "Сенсей..."
1004305-97 = "Сенсей..."
1004305-98 = "Вы... такие..."
1004305-99 = "...тёплые."
1004305-100 = "[s] «Вакамо. Одну секунду!»"
1004305-101 = "О, а-а?"
1004305-108 = "Это... костёр...?"
1004305-109 = "[s5] «Перед тем как вернуться, давай немного согреешься здесь?»\n[s6] «Я посижу с тобой у огня.»"
1004305-110 = ""
1004305-111 = ""
1004305-113 = ""
1004305-114 = "...!"
1004305-115 = "Х-Хорошо..."
1004305-116 = ""
1004305-118 = ""
1004305-119 = ""
1004305-121 = "Т-Тогда... я сяду там."
1004305-124 = "― Хи-хи. Как тепло...[wa:2190]"
1004305-127 = "― Хотя, возможно, меня согревает костёр, но...[wa:750]"
1004305-130 = "― Ваш голос и каждое слово, которое вы говорите...[wa:2690]"
1004305-133 = "― Когда я думаю о том,[wa:740]"
1004305-135 = "― что в этот миг они принадлежат мне и только мне..."
1004305-138 = "― Мне всё равно кажется...[wa:370]"
1004305-140 = "― что я недостаточно хороша для вас.[wa:440]"
1004305-143 = "― Находясь рядом, я причинила вам бесчисленное множество неприятностей.[wa:2180]"
1004305-145 = "― И ещё много-много раз ошибусь.[wa:1740]"
1004305-148 = "― И несмотря на это, вы действительно уверены...[wa:3170]"
1004305-150 = "― что я могу оставаться рядом с вами...?[wa:2220]"
1004305-153 = "[ns] «Да, конечно.»"
1004305-154 = "― Спасибо...[wa:240]"
1004305-156 = "― Вот почему я...[wa:2560]"
1004305-160 = "Мы смотрели на море перед костром, пока Вакамо согревалась."
