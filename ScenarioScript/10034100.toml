[translation]
10034100-1 = "Послесловие 2;Предатели"
10034100-2 = "[ns1] «Эй, теперь, когда я думаю об этом, когда случилась та засада на комитет...»\n[ns2] «...Оперативной группы правосудия ведь сначала там не было, да?»"
10034100-5 = "...Ч-что? С чего вдруг такой вопрос?"
10034100-6 = "Нет, сначала их не было. В лучшем случае там были Патрульные и студенты, которых выбрал комитет."
10034100-7 = "Ну, я слышала, что Оперативная группа правосудия в то время была занята проведением какого-то мероприятия..."
10034100-8 = "Кто бы мог ожидать, что шайка психов устроит засаду на мероприятии, которое проводит само Чаепитие?"
10034100-9 = "...Ты говоришь так, будто это чужая история. Разве не ты Псих А?"
10034100-10 = "Ну, я усвоила урок от Cath Palug..."
10034100-11 = "Пожалуйста, прекрати. Ты уже слишком далеко с этим зашла."
10034100-12 = ""
10034100-14 = ""
10034100-15 = "...«Как драться и побеждать новичку», автор — Кёяма Казуса."
10034100-17 = "Ага. Если в лоб победить не получается, устрой хаос и выбей противников из колеи."
10034100-18 = "И выбило их знатно."
10034100-19 = "Ага, особенно когда ты сняла юбку и побежала прямо на них."
10034100-20 = "Под ней на мне были легинсы! Отлично подготовленная стратегия, если позволите заметить."
10034100-21 = "Просто уточню: я такого никогда не предлагала."
10034100-22 = "Но ход ведь оказался правильным, да? Благодаря этому наш прорыв удался."
10034100-23 = "Эй, дралась там вообще-то я. Чего ты так гордишься?"
10034100-24 = "К тому же, как только появилась Оперативная группа правосудия, нам всем надрали задницы, и мы сбежали."
10034100-25 = "Мы бы их не победили. Если бы попытались, всё стало бы только хуже."
10034100-26 = "В любом случае я рада, что всё закончилось хорошо."
10034100-27 = "И, ну, если выражаться красиво, уже давно мне не удавалось—"
10034100-29 = "Я ВСЁ это слышала! Кёяма Казуса!!"
10034100-30 = "Ты опять устроила что-то масштабное, пока меня не было!!"
10034100-31 = ""
10034100-33 = ""
10034100-34 = "...О."
10034100-35 = "Тц... Значит, ОНА услышала. Сейчас будет неловко..."
10034100-36 = ""
10034100-37 = "[ns] «...»"
10034100-38 = ""
10034100-41 = "[ns3] «Ну тогда я пойду.»\n[ns4] «Всем хорошего дня!»"
10034100-44 = "Хм?! Сенсей?!"
10034100-45 = "Вы уходите?! Сейчас?! Именно сейчас...?!"
10034100-46 = ""
10034100-48 = ""
10034100-49 = ""
10034100-50 = "...А! Теперь, когда я подумала, у меня тоже есть одно дело!"
10034100-51 = ""
10034100-53 = ""
10034100-54 = "Да, и... у меня тоже есть другие обязательства..."
10034100-55 = ""
10034100-57 = ""
10034100-58 = ""
10034100-60 = ""
10034100-61 = ""
10034100-62 = "А-ха-ха-ха..."
10034100-64 = "Вы все меня бросаете? Серьёзно? Вот так и оставите меня? Правда? Нет, вы же шутите, да?!"
10034100-65 = "Так нечестно! Вы тоже участвовали в ограблении, так почему здесь расплачиваюсь только я? А?!"
10034100-66 = "Ты..."
10034100-67 = ""
10034100-69 = ""
10034100-72 = "Предатели!!"
