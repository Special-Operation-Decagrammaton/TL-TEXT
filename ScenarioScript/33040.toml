[translation]
33040-1 = "Эпизод 4;Что дальше"
33040-3 = "Кья-а-а-а-а-а!"
33040-4 = "*бум*"
33040-5 = "Цуруги сегодня в отличной форме."
33040-6 = "А я ещё жаловалась, что немного устала. Если председатель всё ещё настолько заряжена, у меня нет оправданий."
33040-7 = "Возьму с неё пример и буду работать ещё усерднее!"
33040-8 = ""
33040-10 = ""
33040-11 = "Заместитель председателя Хасуми, приём. С территории кампуса угнан танк снабжения."
33040-12 = "Что?! Что ты только что сказала?"
33040-13 = "Сейчас у нас нехватка людей, нужна поддержка... Теперь вор дрифтует на нём в поворотах! Невероятно!"
33040-14 = "Мы... сейчас немного заняты. Думаю, Кохару сможет оказать поддержку."
33040-15 = "Стоп, нет. Я забыла, сегодня она дома с простудой."
33040-16 = "Формально её документы о переводе обратно из Клуба дополнительных занятий ещё не оформлены. Я сама разберусь и вернусь в кампус!"
33040-17 = "Кья-а-а-а! Кья-а-а!"
33040-18 = "Вообще-то, думаю, это можно оставить Цуруги. Я пойду с тобой."
33040-19 = ""
33040-21 = ""
33040-24 = ""
33040-25 = ""
33040-26 = ""
33040-27 = ""
33040-28 = ""
33040-29 = ""
33040-30 = "Х-Ханако. Что ты делаешь?"
33040-31 = ""
33040-33 = ""
33040-34 = "Хм? Что случилось, Хината?"
33040-35 = ""
33040-37 = ""
33040-38 = "П-Почему ты стоишь так близко за мной? Я чувствую твою... у себя на спине..."
33040-40 = "Боже, какое затруднительное положение. ♥"
33040-41 = "У-ух..."
33040-43 = "Ханако? Тебя что-то беспокоит?"
33040-44 = "О, ничего. Просто последние несколько дней на меня свалили бумажную работу Сестринства, хотя я могла бы заниматься другими вещами.#nЭто всего лишь чуточку... р а з д р а ж а е т. ♥"
33040-45 = "Т-Ты сейчас немного пугаешь меня."
33040-49 = "Общество Пандемониум"
33040-50 = "Ха-ха-ха! Так ты тот самый Сенсей из Шале?"
33040-51 = "Ну надо же! Какой приятный сюрприз."
33040-52 = "[s] «Эм... привет. Ты председатель студсовета Геенны?»"
33040-53 = "Именно."
33040-54 = "Ты принял мудрое решение, придя к председателю Общества Пандемониума."
33040-55 = "[s] «Что, прости?»"
33040-56 = "Подумай. Если Общество Пандемониума и Шале объединят силы, Дисциплинарный комитет больше никогда не сможет мешать прогрессу. Вполне логичное решение."
33040-57 = "Если ты уже просчитал всё настолько далеко, что ещё тут обсуждать?!"
33040-58 = "Знаешь... такие разговоры лучше вести после того, как я выйду из комнаты."
33040-59 = "*вздох* Макото. Постарайся не делать этот разговор ещё более неловким."
33040-60 = "Сенсея Шале попросили выступить посредником при подписании Эдемского договора. Он здесь только ради формального приветствия."
33040-61 = "А как же наше партнёрство?"
33040-62 = "Какое партнёрство? Вы только что познакомились. Чего ты ожидала?"
33040-63 = "..."
33040-64 = "Да, вполне логично. Что ж, хорошо."
33040-65 = "Развлечения придётся отложить до следующей встречи, Сенсей."
33040-66 = "Ладно. Пойдём, Ироха."
33040-67 = ""
33040-69 = ""
33040-70 = "Что? Уже?"
33040-72 = "*вздыхает*"
33040-73 = "[s] «Всё в порядке, Ако?»"
33040-74 = "О-О."
33040-75 = "Более-менее."
33040-76 = "Не ожидала, что ты будешь связан с Эдемским договором."
33040-77 = "Значит, официальное приветствие в Тринити ты тоже будешь делать?"
33040-78 = "[s] «Уже сделал.»"
33040-79 = "Ч-Что? Когда успел...?"
33040-80 = "Хочешь сказать, я выпала из информационного потока? Но я старший администратор Дисциплинарного комитета!"
33040-81 = "Я была так занята подготовкой к договору. Не верится, что так небрежно потеряла из виду каждое твоё движение."
33040-82 = "[s] «Просто успокойся.»"
33040-83 = "Хм..."
33040-84 = "Ты прав. В последнее время председатель говорит мне то же самое."
33040-85 = "[s] «Кстати о Хине, где она?»"
33040-86 = "У неё... дела в другом месте. Сейчас её нет в академии."
33040-87 = "Глава Дисциплинарного комитета как всегда невероятно занята. Хотя после подписания Эдемского договора ей, возможно, наконец станет немного легче..."
33040-88 = "..."
33040-89 = "Итак, твои дела здесь закончены, верно? Я провожу."
33040-90 = ""
33040-92 = ""
33040-94 = ""
33040-95 = "Нет. Я сама."
33040-96 = "П-Председатель?"
33040-97 = "Я думала, вы покинули кампус."
33040-98 = "Да, но удалось закончить раньше. У тебя наверняка хватает другой работы, так что Сенсеем займусь я."
33040-99 = "Хорошо. Как скажете."
33040-100 = "Иди за мной, Сенсей."
33040-102 = "Хм..."
33040-103 = "Итак, Сенсей. Как дела в Тринити?"
33040-104 = "[s1] «Работы всё ещё очень много.»\n[s2] «И после подписания договора дел у меня останется немало.»"
33040-105 = "Можно попросить подробностей?"
33040-106 = "Можно попросить подробностей?"
33040-107 = "Я помню всё, что ты рассказал на мосту, но у меня было ощущение, что кое-что ты всё же опустил."
33040-108 = "Я тебя не виню. Если бы речь снова шла об академии вроде Абидоса, я ожидала бы большей открытости, но раз мы говорим о Тринити, уверена, у тебя были причины."
33040-109 = "[s] «Мне казалось, я был открыт. Хочешь больше узнать о симпозиуме в купальниках?»"
33040-110 = "Я-Я не это имела в виду!"
33040-111 = "..."
33040-112 = "Как бы то ни было."
33040-113 = "Истина зависит от точки зрения — и истин может быть несколько. Это были твои слова."
33040-114 = "Сам факт предательства Тринити — лишь истина с одной точки зрения. Возможно, ты не хочешь придерживаться именно её."
33040-115 = "Тогда тебе придётся принять другую точку зрения и ухватиться за другую истину, потому что..."
33040-116 = "..."
33040-117 = ""
33040-119 = ""
33040-120 = "Ты действительно очень доверяешь этим девушкам."
33040-121 = "[s] «Но тебе я доверяю больше всех, Хина.»"
33040-122 = "О-Откуда это вообще взялось?!"
33040-123 = "Ты уже говорил мне это. Одного раза было достаточно."
33040-124 = "Серьёзно."
33040-126 = "Будь осторожен по дороге домой, Сенсей."
33040-127 = "[ns] «Ты рассказала Ако о планах уйти в отставку?»"
33040-128 = ""
33040-129 = "Нет. Прямо — нет."
33040-130 = "Ты единственный, кому я сказала, но не удивлюсь, если Ако о чём-то догадывается."
33040-131 = "Не нужно делать из этого что-то большое. Я просто устала и мне нужно время на отдых. Вот и всё..."
33040-132 = "Оставим это. Повторюсь, это неважно."
33040-133 = "Увидимся на церемонии подписания, Сенсей."
33040-134 = "[s] «Хорошо. Спасибо, Хина.»"
33040-137 = "Так прошёл ещё один день."
33040-138 = "Наконец наступил день подписания Эдемского договора."
33040-143 = "Следующий эпизод;Церемония подписания Эдемского договора, часть 1"
