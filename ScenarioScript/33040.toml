[translation]
33040-1 = "Episódio 4;Depois Disso"
33040-3 = "Kieeehhhhh!!!"
33040-4 = "(CABOOOM!!! ESTRONDOOOOO!!!!)"
33040-5 = "A Tsurugi-senpai está com tudo hoje."
33040-6 = "...Pra ser sincera, eu estava um pouco cansada depois de tantas missões seguidas, mas vendo uma cena dessas na minha frente, não posso reclamar."
33040-7 = "Preciso seguir o exemplo da senpai e me esforçar ainda mais!"
33040-11 = "E aí, Hasumi-senpai! Então, agorinha mesmo alguém acabou de roubar um tanque que era patrimônio da escola..."
33040-12 = "Como é que é...!?"
33040-13 = "A gente tá com pouca gente aqui, então queria pedir pra você dar uma força... Eita, tá mandando um drift insano!? Que habilidade é essa!?"
33040-14 = "Estamos meio atarefadas agora, mas... Hmm, a Koharu ainda deve estar no campus..."
33040-15 = "Não, a Koharu está de folga por causa do resfriado, não é...?"
33040-16 = "Para começo de conversa, a Koharu-san ainda faz parte do Clube de Aulas de Reforço. Sendo assim, senpai, deixa que eu vou!"
33040-17 = "Gyahahahahahahaha!"
33040-18 = "Bom, parece que podemos deixar as coisas por aqui nas mãos da Tsurugi... Eu vou com você!"
33040-30 = "H-Hum, Hanako-san...?"
33040-34 = "Sim? Algum problema, Hinata-san?"
33040-38 = "É que... parece que tem alguma coisa encostando nas minhas costas...?"
33040-40 = "Pois é, que situação complicada, né?♡"
33040-41 = "Auuh..."
33040-43 = "H-Hum, Hanako-san? Aconteceu alguma coisa que te deixou chateada...?"
33040-44 = "Imagina, não aconteceu nada. Só me pediram um favorzinho bem na hora em que eu queria sair, e agora estou há dias presa nessa ajuda \"importantíssima\" de organizar documentos. Bom, pelo menos não estávamos todas juntas... então não há problema nenhum♡"
33040-45 = "Uuh, me desculpa... Você está me dando medo, Hanako-san..."
33040-49 = "Pandemonium Society - Salão da Assembleia"
33040-50 = "Kikikiki! Então você é o Sensei da \"Schale\"!"
33040-51 = "Entendo, essa foi inesperada! Chega a ser até divertido! Kikikikiki!"
33040-52 = "[s] \"Hum... Olá. Você é a presidente do conselho estudantil de Gehenna...?\""
33040-53 = "Kiki, isso mesmo."
33040-54 = "Vir oferecer cooperação a mim, a grande Makoto-sama, presidente da Pandemonium Society, não foi uma má decisão."
33040-55 = "[s] \"...Hã?\""
33040-56 = "Kikikiki... \"Schale\" e \"Pandemonium Society\". Se unirmos forças, destruir aquela gentinha do Comitê Disciplinar de Gehenna será moleza. Diria que é uma decisão extremamente lógica."
33040-57 = "Os cálculos estão concluídos! Vamos, hora de colocar o plano em prática agora mesmo...!"
33040-58 = "...Com licença. Não acha melhor ter esse tipo de conversa quando a outra parte não estiver bem na sua frente?"
33040-59 = "Makoto-senpai... Por favor, não distorça a conversa para um lado estranho."
33040-60 = "O Sensei da \"Schale\" só veio nos visitar por uma questão de formalidade, já que ele também estará presente no Tratado do Éden."
33040-61 = "...E quanto à cooperação conosco?"
33040-62 = "É claro que não vai acontecer. Para começo de conversa, vocês acabaram de se conhecer hoje, sabia?"
33040-63 = "..."
33040-64 = "...Humpf, é mesmo? Entendo."
33040-65 = "Bom, vamos deixar a diversão para depois."
33040-66 = "Muito bem, vamos embora, Iroha."
33040-70 = "Hã? Já terminamos?"
33040-72 = "Haah..."
33040-73 = "[s] \"E você, Ako, como tem passado?\""
33040-74 = "Bom..."
33040-75 = "Mais ou menos, eu diria..."
33040-76 = "Mas foi uma surpresa saber que você vai participar do Tratado do Éden, Sensei."
33040-77 = "Isso quer dizer que, depois daqui, você vai para Trinity...?"
33040-78 = "[s] \"Na verdade, eu passei em Trinity agorinha mesmo antes de vir para cá.\""
33040-79 = "O q— Quando foi que...?"
33040-80 = "Como eu, a administradora do Comitê Disciplinar, deixei passar uma informação tão importante...!?"
33040-81 = "Por mais ocupada que eu estivesse com os preparativos do tratado, não ter conseguido acompanhar os passos do Sensei é..."
33040-82 = "[s] \"Calma, Ako...\""
33040-83 = "...Fuu."
33040-84 = "A Chefe também me disse outro dia que eu precisava me acalmar um pouco..."
33040-85 = "[s] \"A Hina está trabalhando agora?\""
33040-86 = "A Chefe precisou sair de Gehenna a negócios..."
33040-87 = "Como sempre, os dias dela são muito corridos... Espero que, depois que o Tratado do Éden for assinado, o volume de trabalho da Chefe diminua, mas..."
33040-88 = "..."
33040-89 = "Enfim, os seus assuntos por aqui já terminaram, não é, Sensei? A saída fica por ali—"
33040-95 = "...Eu o acompanho."
33040-96 = "C-Chefe?"
33040-97 = "A sua viagem a trabalho não ia até amanhã...?"
33040-98 = "Resolvi tudo mais rápido do que esperava. Bom trabalho hoje também, Ako. Eu vou acompanhá-lo até a saída, então pode ir descansar."
33040-99 = "Ah, sim..."
33040-100 = "Vamos, Sensei."
33040-102 = "Fuu..."
33040-103 = "...E então, Sensei. Aquela situação em Trinity se acalmou?"
33040-104 = "[s1] \"Ainda não, tem uma pilha de coisas que preciso resolver...\"\n[s2] \"Pretendo cuidar de várias coisas depois que o Tratado do Éden terminar...\""
33040-105 = "Entendo... Então quer dizer que você ainda está carregando um monte de problemas que não me contou."
33040-106 = "Entendo... Então quer dizer que você ainda está carregando um monte de problemas que não me contou."
33040-107 = "Se aquilo que você me disse naquela ocasião fosse mesmo tudo, já era para ter acabado, não acha?"
33040-108 = "...Não estou te cobrando nem perguntando por que não me contou tudo. Se fosse em Abydos seria uma coisa, mas estamos falando de Trinity. É tudo complicado demais por lá, e você também deve ter seus próprios motivos e coisas para pensar, Sensei..."
33040-109 = "[s] \"B-Bom... Mas aquela história da festa de maiô foi exatamente como eu expliquei, viu?\""
33040-110 = "E-Essa parte não importa!"
33040-111 = "Ai, francamente..."
33040-112 = "...Bom, de qualquer forma."
33040-113 = "Existem vários pontos de vista, e a verdade pode mudar dependendo de como se olha... Foi o que você me disse naquela vez, Sensei."
33040-114 = "Mesmo que o \"traidor de Trinity\" seja encontrado, essa será apenas a verdade vista de uma perspectiva específica... É difícil julgar tudo com base apenas nisso."
33040-115 = "Em vez de engolir qualquer informação cegamente, devemos buscar outras verdades sob diferentes perspectivas e continuar fazendo tudo o que estiver ao nosso alcance. Porque isso..."
33040-116 = "..."
33040-120 = "...Aquelas garotas têm a sua confiança, não é, Sensei?"
33040-121 = "[s] \"Eu também confio em você, Hina.\""
33040-122 = "—! O que deu em você tão de repente...!?"
33040-123 = "E além do mais, você já me disse isso antes!"
33040-124 = "Francamente..."
33040-126 = "Tome cuidado no caminho de volta."
33040-127 = "[ns] \"...Por acaso você ainda não contou para a Ako sobre a sua aposentadoria?\""
33040-129 = "...É, ainda não."
33040-130 = "Ninguém além de você sabe ainda, Sensei. Embora talvez a Ako já tenha percebido alguma coisa."
33040-131 = "E mesmo chamando de aposentadoria, não é nada tão grandioso assim. Só estou um pouco cansada e quero tirar um tempo para descansar..."
33040-132 = "...Vamos deixar esse assunto pra lá. Não é nada tão importante assim."
33040-133 = "...Então, até a cerimônia de assinatura."
33040-134 = "[s] \"Sim, obrigado, Hina.\""
33040-137 = "Depois disso, mais algum tempo se passou..."
33040-138 = "E finalmente chegou o dia da Cerimônia de Assinatura do Tratado do Éden."
33040-143 = "Próximo;Cerimônia de Assinatura do Tratado do Éden (1)"
