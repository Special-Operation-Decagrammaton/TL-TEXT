[translation]
10036130-1 = "Как Отряд развлекается: игра 1"
10036130-2 = ""
10036130-3 = "Подходите, не стесняйтесь!"
10036130-4 = "Добро пожаловать в «Полный залп!» Остановите этих милых маленьких врагов и выиграйте себе приз!"
10036130-5 = "Какие правила?"
10036130-6 = "Всё просто!"
10036130-7 = "Я буду отправлять мишени к призу, а вы должны их остановить!"
10036130-9 = "С-Саори, смотри, там таблица результатов..."
10036130-10 = "Это новый выпуск журнала «BiBi» среди призов?"
10036130-11 = "Конечно! Ещё есть подарочные сертификаты в рестораны, билеты в фотобудку..."
10036130-12 = "Но сразу предупреждаю: сегодня ещё никто не смог выиграть приз."
10036130-13 = "С-Серьёзно?!"
10036130-15 = "Похоже, это сложнее, чем кажется."
10036130-16 = "Ну, неудивительно..."
10036130-17 = "Ничего не бывает легко."
10036130-18 = "Но я крепче, чем выгляжу."
10036130-19 = "Я многое пережила и немало времени провела, роясь на свалках."
10036130-20 = "И вдобавок..."
10036130-21 = "На этот раз меня поддерживают все!"
10036130-22 = "Сейчас!"
10036130-23 = "Д-Да! Я прошла через холод и голод! Это..."
10036130-24 = ""
10036130-27 = ""
10036130-28 = "...игра. Это просто игра."
10036130-29 = "Ладно, начнём с уровня для новичков!"
10036130-30 = "Ацуко, Хиёри, Мисаки, вперёд!"
10036130-32 = "Д-Да!"
10036130-33 = "Я бы предпочла не участвовать, но если вам правда нужно..."
10036130-34 = "(Хи-хи, похоже, Саори веселится...)"
