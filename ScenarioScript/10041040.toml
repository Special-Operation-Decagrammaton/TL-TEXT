[translation]
10041040-1 = "Эпизод 4;Разъярённый игровой центр"
10041040-3 = ""
10041040-4 = "...Значит, следующая потенциальная горячая точка... фитнес-центр."
10041040-5 = "Понятно. Скоро буду там."
10041040-6 = ""
10041040-8 = ""
10041040-9 = "...Нет, подожди."
10041040-10 = "Я отправлю в фитнес-центр Нэру. Ты займёшься другой задачей."
10041040-11 = ""
10041040-13 = ""
10041040-14 = "...Что?"
10041040-15 = ""
10041040-18 = ""
10041040-19 = "А? Меня? Не её?"
10041040-21 = "Но... разве вы не говорили, что вам двоим нужно действовать тайно?"
10041040-22 = "Я предполагала, что открытые расследования достанутся мне."
10041040-23 = ""
10041040-25 = ""
10041040-26 = "Можно спросить, почему ты хочешь отправить вместо меня Нэру?"
10041040-27 = "Это самый рациональный выбор."
10041040-29 = "...Рио?"
10041040-31 = "Проще говоря, дело в безопасности."
10041040-32 = "В безопасности?"
10041040-33 = ""
10041040-35 = ""
10041040-36 = "Если мои расчёты верны, план цели в фитнес-центре всё ещё находится в процессе выполнения."
10041040-37 = "То есть тот, кто туда пойдёт, может ожидать контакта с противником и, возможно, боя."
10041040-38 = "Отсюда и «вопрос безопасности.» Я не могу отправить туда студента не из Миллениум, особенно студента в твоём особом положении."
10041040-39 = "Если там возникнет проблема, Юризоно Сэя, от тебя будет мало пользы."
10041040-40 = "Более того, будет лучше, если тебя там вообще не окажется."
10041040-41 = ""
10041040-43 = ""
10041040-45 = ""
10041040-46 = "«Лучше, если меня там вообще не окажется»..."
10041040-47 = "Эй, Рио, это уже перебор."
10041040-48 = "«От меня будет мало пользы...» Понятно..."
10041040-49 = "Значит, даже здесь я не могу избежать такого отношения..."
10041040-50 = "(...Что она имеет в виду?)"
10041040-52 = "Знаю, неприятно, но это неприукрашенная правда. Спорить здесь не о чем."
10041040-53 = "Если ты пойдёшь и хоть как-то пострадаешь, это станет проблемой для всего Миллениум."
10041040-54 = "Если хочешь нам помочь, пожалуйста, пойми нашу точку зрения."
10041040-55 = ""
10041040-57 = ""
10041040-59 = "..."
10041040-60 = "Ты просишь меня расследовать всё подозрительное, но одновременно просишь держаться подальше на случай опасности."
10041040-61 = "Ты не видишь здесь противоречия?"
10041040-62 = "«Подозрительное» и «опасное» — разные вещи. Совершенно разные."
10041040-63 = "И я никогда не просила тебя драться или с кем-то сталкиваться, только докладывать."
10041040-64 = "...Ну да, с этим я согласна."
10041040-65 = "Я ценю твою помощь. Но это не твоя работа. По крайней мере, не эта её часть."
10041040-66 = "Я думала, ты уже это поняла. Если не можешь принять, мне жаль, но наше сотрудничество на этом закончится."
10041040-67 = ""
10041040-70 = ""
10041040-71 = "...Нет, я понимаю."
10041040-72 = "Прошу прощения. Я снова перешла границы."
10041040-73 = "Ты права. Мне стоило отнестись с большим пониманием. Я почувствовала, будто у меня отнимают доверенную мне роль, и... сказала лишнее."
10041040-74 = ""
10041040-77 = ""
10041040-78 = "Всё в порядке. А теперь поищи в других местах площадки и сообщи, если найдёшь что-нибудь подозрительное."
10041040-79 = "И просто чтобы ещё раз уточнить условия: сообщай мне обо всём, что найдёшь, и не предпринимай никаких действий вне моих указаний."
10041040-80 = "...Да. Поняла."
10041040-81 = ""
10041040-83 = ""
10041040-85 = ""
10041040-86 = "..."
10041040-88 = "...Тогда я выйду на связь."
10041040-89 = "Хорошо. Я тоже кое-что анализирую здесь, так что если что-нибудь увижу — позвоню."
10041040-90 = "...Хорошо. Спасибо."
10041040-91 = "Если позволишь..."
10041040-92 = ""
10041040-94 = ""
10041040-96 = "..."
10041040-97 = "Теперь надо поскорее с этим закончить."
10041040-98 = ""
10041040-100 = ""
10041040-105 = ""
10041040-106 = "С чем закончить?"
10041040-107 = "Я анализирую чип из Центра данных."
10041040-108 = "Если смогу собрать достаточно информации, возможно, дам ей конкретную цель вместо того, чтобы она бесцельно бродила вокруг."
10041040-109 = "Хм?"
10041040-110 = "А это неожиданно заботливо с твоей стороны."
10041040-111 = "Я бы назвала это скорее практичностью, чем заботой."
10041040-112 = "Научись уже просто принимать комплименты, серьёзно."
10041040-113 = ""
10041040-115 = ""
10041040-116 = "Это был комплимент?"
10041040-117 = "Да господи..."
