[translation]
2003002-1 = "Я могу помочь"
2003002-3 = "Сюда, сюда! У нас участница с признаками солнечного удара!"
2003002-4 = "[s] «Солнечный удар... Если это солнечный удар...!»"
2003002-5 = "Сначала намочите ей ладони холодной водой, а вот полотенце — положите на шею!"
2003002-6 = "[s] «Хорошо!»"
2003002-7 = ""
2003002-10 = ""
2003002-11 = "Вы заняты, Сенсей."
2003002-12 = "[s] «Привет, Харуна.»"
2003002-13 = "Да. Здравствуйте. И чем вы занимаетесь?"
2003002-14 = "[s] «Как видишь, помогаю в медицинской палатке.»"
2003002-15 = "Но вы ведь не медработник, верно?"
2003002-16 = "[s] «Нет, но у них не хватает людей.»"
2003002-17 = ""
2003002-19 = ""
2003002-20 = "..."
2003002-21 = "Понятно. Похоже, сегодня мне придётся сделать своё расписание более гибким."
2003002-22 = ""
2003002-25 = "[ns] «А? Что ты имеешь в виду?»"
2003002-26 = ""
2003002-28 = ""
2003002-30 = "Я помогу вам закончить работу."
2003002-31 = "[s] «...Что-что?»"
2003002-34 = "Уф... У меня проблемы. Живот болит... Я слишком быстро ела..."
2003002-35 = "В таком состоянии я не смогу участвовать в сегодняшней дневной игре..."
2003002-36 = "Говорят, сливы помогают пищеварению."
2003002-37 = ""
2003002-39 = ""
2003002-40 = "Это сливовый чай. Вот, держи. Я заварила его покрепче, так что надеюсь, поможет."
2003002-41 = "С-Спасибо...!"
2003002-42 = ""
2003002-45 = "О!"
2003002-46 = "Уже становится лучше! Скоро я буду готова к игре!"
2003002-48 = "*тяжело дышит* *тяжело дышит*"
2003002-49 = "Последний забег меня порядком вымотал."
2003002-51 = "Вот. Этот спортивный напиток восполнит жидкость быстрее обычной воды."
2003002-52 = "Вместо сахара здесь подсластитель, так что липкого послевкусия не останется."
2003002-53 = "Эм... Спасибо!"
2003002-54 = ""
2003002-57 = "*глоть* *глоть* *глоть*"
2003002-58 = "Фух, освежает! Мне уже намного лучше!"
2003002-60 = "О-о-о... Вдруг голова закружилась...!"
2003002-61 = "Голова болит, мне холодно... Руки дрожат... Кажется, сознание ускользает..."
2003002-62 = ""
2003002-65 = ""
2003002-66 = "Это...! У тебя гипогликемический шок."
2003002-67 = "Если ничего не делать, это может повредить мозг. Нужно действовать быстро!"
2003002-68 = ""
2003002-70 = ""
2003002-71 = ""
2003002-72 = "Так, вот конфета и вода. Держи конфету во рту, пока не станет лучше."
2003002-73 = ""
2003002-77 = "Фух... Хаа... Намного лучше. И рука больше не дрожит."
2003002-78 = ""
2003002-80 = ""
2003002-84 = "[ns1] «Невероятно... Харуна!»\n[ns2] «Не знал, что у тебя есть такой талант, Харуна!»"
2003002-87 = "Я гурман. Здесь нечему удивляться."
2003002-88 = "Полагаю, это были все студенты, которым требовалась неотложная помощь."
2003002-89 = "[s3] «Это все! Ты очень помогла.»\n[s4] «Просили передать тебе спасибо.»"
2003002-92 = "Хи-хи..."
2003002-93 = "Итак, наконец-то мы можем заняться гастрономией этого спортивного дня."
2003002-94 = ""
2003002-97 = "[ns] «Так вот зачем ты мне помогала?»"
2003002-98 = "Да. Я бы так сказала."
2003002-99 = "Но эгоистичные мотивы не меняют самого поступка, правда, Сенсей?"
2003002-100 = "Во всяком случае, мне совершенно не стыдно за своё поведение."
2003002-101 = "[s5] «Ну и ладно. Я не жалуюсь.»\n[s6] «Главное, что из этого вышло что-то хорошее!»"
2003002-104 = "Рада, что вы тоже согласны."
2003002-105 = "[s] «В таком случае что ты хочешь делать?»"
2003002-106 = "Разве это не очевидно?"
2003002-107 = "Я устрою вам гастрономический тур, начиная с уличных палаток."
2003002-108 = "Спортивный день — это гастрономический фестиваль, где в одном месте можно попробовать множество блюд, которых обычно не встретишь!"
2003002-109 = "Сегодня я отдала вам половину своего времени, поэтому заберу половину вашего."
2003002-110 = "Уверена, вы не против такого обмена, Сенсей?"
2003002-111 = ""
2003002-114 = "[ns7] «Если так, я не могу отказаться!»\n[ns8] «Ведите, госпожа гид по гастротуру!»"
2003002-117 = "Я уже распланировала, с чего начать, что пробовать и по какому маршруту идти."
2003002-118 = "На сегодня вы ещё и почётный советник Общества исследования гурманов, Сенсей!"
2003002-119 = "[s] «Рассчитываю на вас, президент.»"
2003002-120 = ""
2003002-122 = ""
2003002-124 = "Мы с Харуной бродили между палатками и пробовали еду, пока не наелись до отвала..."
