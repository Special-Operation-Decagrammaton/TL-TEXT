[translation]
84301400200-5 = "«Хорошо», значит?"
84301400200-6 = "Возможно, это моя вина. Кажется, я сглазила."
84301400200-7 = "Что ж, происшествие вышло ещё то, но благодаря вам двоим со мной всё в порядке."
84301400200-8 = "Рады помочь! Главное, вам понравилось, да? Считайте это внезапным событием!"
84301400200-9 = "Я НЕ буду называть это «внезапным событием»..."
84301400200-11 = "Почему...? Почему Avant Guard...?!"
84301400200-12 = "Подождите-ка, эта закономерность..."
84301400200-13 = ""
84301400200-17 = ""
84301400200-18 = "И это время..."
84301400200-19 = ""
84301400200-21 = ""
84301400200-22 = ""
84301400200-23 = "Что это такое?!"
84301400200-24 = ""
84301400200-26 = ""
84301400200-27 = "Как и ожидалось..."
84301400200-28 = "Инженерный отдел...!! Ну всё, на этот раз вы точно доигрались!"
84301400200-29 = "Я ВСЁ проверила ещё ВЧЕРА, а вы умудрились за один день снова всё запороть?!"
84301400200-30 = "Н-Нет. Мы ничего не делали."
84301400200-31 = "Ничего не делали, но то, что ещё вчера было в порядке, вдруг само взбесилось? И я должна в это поверить?!"
84301400200-32 = "Я понимаю, что в это трудно поверить, но это правда. После проверки никто из нас его не трогал."
84301400200-33 = "Всё тайное, что мы хотели сделать, мы уже сделали."
84301400200-34 = "Что вы сказали...?"
84301400200-35 = "...Ух. Забудь, что я это сказала."
84301400200-37 = "(Она совсем не умеет врать.)"
84301400200-39 = "Но признаю, я и сама в полном недоумении. Простите за этот бардак, но не могли бы вы дать нам немного времени на расследование, чтобы мы сами со всем разобрались?"
84301400200-40 = ""
84301400200-42 = ""
84301400200-43 = "...Вы правда это не планировали?"
84301400200-44 = "*вздох* Ладно, Утаха. Какая бы ты ни была, лгуньей тебя не назовёшь."
84301400200-45 = "Да и я не эксперт, так что вряд ли смогу вынести какой-то вердикт. Вот бы президент была здесь."
84301400200-46 = "Ага. Будь Рио здесь, она бы разобралась на месте. Жаль."
84301400200-48 = "(Рио... В вопросах технологий ей доверяют.)"
84301400200-50 = "Хорошо. Даю вам время разобраться. Но это значит, что вы ОБЯЗАНЫ разобраться, понятно?"
84301400200-51 = "Спасибо."
84301400200-52 = ""
84301400200-54 = ""
84301400200-55 = ""
84301400200-57 = "(Это... выглядит подозрительно.)"
84301400200-58 = "(Стоит расследовать это немного подробнее.)"
