[translation]
2000102-1 = "Если нужна помощь — зовите C&C!"
2000102-2 = "Улица города возле Миллениума"
2000102-4 = "..."
2000102-5 = "Говорит Ноль-Два. Я у здания, где удерживают заложников."
2000102-6 = "Подозреваемые сейчас за компьютерами. Похоже, пытаются подобрать пароль."
2000102-7 = "К счастью, файл пока не отправлен."
2000102-8 = "А. Вижу, где держат заложников."
2000102-9 = "Вероятно, это сотрудники службы безопасности Студсовета, пытавшиеся защитить файл."
2000102-10 = "Сначала спасу студентов Миллениума, затем продолжу... А?"
2000102-11 = "С-Сенсей?"
2000102-12 = "Что здесь делает Сенсей?"
2000102-13 = "Поступило сообщение, что Сенсея взяли в заложники, когда он пытался защитить студентов Миллениума!"
2000102-14 = "Чёрт. Вот идиот!"
2000102-15 = "Красный код! Ноль-Два, начинаю штурм!"
2000102-16 = ""
2000102-17 = "П-Погоди!"
2000102-19 = "Внутри здания"
2000102-20 = "Хе-хе. Мы готовы начать передачу файла."
2000102-21 = "Как только отдадим его заказчику, утонем в деньгах."
2000102-22 = "*грохот*"
2000102-23 = "Ч-что это было?!"
2000102-24 = "Н-На нас напали! Это Клуб горничных!"
2000102-25 = "Чёрт! Как они так быстро нас вычислили?!"
2000102-26 = "Если только успеть отправить файл...!"
2000102-27 = ""
2000102-28 = "*бах*"
2000102-29 = ""
2000102-30 = "Гх!"
2000102-31 = "Такая огневая мощь!"
2000102-32 = "Б-Бежим!"
2000102-33 = ""
2000102-35 = "Сенсей!"
2000102-36 = "Ты в порядке? И что ты вообще здесь делаешь?"
2000102-37 = "i3;;02;Ты пытался спасти студентов Миллениума..."
2000102-38 = "...и в итоге сам попался?"
2000102-39 = "Ты невозможен."
2000102-40 = "Я уважаю твоё лидерство и намерения."
2000102-41 = "Но не могу сказать того же о твоих решениях, особенно учитывая, что ты не переживёшь и одного выстрела."
2000102-42 = "Если бы я не пришла, ты мог бы..."
2000102-43 = "Огонь!"
2000102-45 = "Чёрт! Они ещё остались."
2000102-46 = "Они не знают, когда нужно сдаться."
2000102-47 = "Бвахаха. Сдаться?!"
2000102-48 = "Это тебе надо сдаваться!"
2000102-49 = "Эй, горничная. Твоя задача — спасти заложников и вернуть файл до отправки. Верно?"
2000102-50 = "Иначе ты бы первым делом всадила пулю в того, кто сидит за компьютером."
2000102-51 = "...!"
2000102-52 = "Жаль тебя расстраивать, но расшифровка и передача уже завершены! Ты проиграла!"
2000102-53 = "Что?!"
2000102-54 = "Ха-ха-ха! Когда ты ворвалась, до отправки оставалось всего десять секунд. Сейчас файл уже у нашего заказчика..."
2000102-55 = "А?"
2000102-56 = "Ч-Что за чёрт?!"
2000102-57 = "...?"
2000102-58 = "Передача остановилась, когда оставалась одна секунда! Но как...?"
2000102-59 = "Подождите."
2000102-60 = "Что это у Сенсея в руке?!"
2000102-61 = "[s1] «Отключи-ум: Мир.»\n[s2] «Я вытащил сетевой кабель.»"
2000102-62 = "Отлично, Сенсей! Потрясающая работа!"
2000102-63 = "Отлично, Сенсей! Потрясающая работа!"
2000102-64 = "Гах! Отдай кабель!"
2000102-65 = "[s3] Вернуть кабель.\n[s4] Спросить Карин, что делать."
2000102-66 = "Давай. Забирай кабель."
2000102-67 = "Давай. Забирай кабель."
2000102-68 = "Теперь это уже не имеет значения."
2000102-69 = "*бах*"
2000102-70 = ""
2000102-71 = "*грохот*"
2000102-72 = "А-а-а! Компьютер!"
2000102-73 = "Э-Это ещё не конец!"
2000102-74 = ""
2000102-76 = "Фух..."
2000102-77 = "Миссия выполнена... едва-едва."
2000102-78 = "Погнаться за ними? Не нужно. Я и не знаю, сколько их ещё осталось."
2000102-79 = "Моя задача была не задержать их, а защитить находящихся здесь людей."
2000102-80 = "И тебя тоже, Сенсей."
2000102-81 = "Кстати, я должна кое-что сказать."
2000102-82 = "Спасибо, Сенсей. Благодаря тебе я смогла выполнить миссию."
2000102-83 = "Выдернуть сетевой кабель было... довольно нестандартно. Я бы сама до такого не додумалась."
2000102-84 = "..."
2000102-85 = "Забираю назад слова о том, что ты слабый."
2000102-86 = "«Смелый» подходит тебе куда больше."
2000102-87 = ""
2000102-88 = ""
2000102-89 = "А, только что пришло сообщение. Остальные из Клуба горничных займутся оставшимися бандитами."
2000102-90 = "Мне лучше возвращаться."
2000102-91 = "Эм, Сенсей."
2000102-92 = "Буду рада снова поработать с тобой."
