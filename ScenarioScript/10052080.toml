[translation]
10052080-1 = "Праведность"
10052080-10 = "А, что?"
10052080-11 = "Не может быть, правда...?"
10052080-12 = "...Как старшая сестра, Эйн?"
10052080-13 = "С-старшая сестра...! Ну, ну...! Е-если говорить только о её физическом состоянии, она сможет двигаться почти сразу!"
10052080-15 = "Ор! Не пугай её. Они всего лишь прорвали нашу первую линию обороны."
10052080-16 = "Знаю, Соф. Но мы должны готовиться к любому сценарию. Реальность, знаешь ли, совсем не похожа на... программу."
10052080-17 = "Ч-что нам делать? Д-для начала надо... эм... а?!"
10052080-18 = "Нужно сосредоточиться на укреплении ВТОРОЙ линии обороны. А потом..."
10052080-19 = ""
10052080-21 = ""
10052080-22 = "..."
10052080-23 = "*вздох* Ладно. Стоит попробовать."
10052080-26 = "Мы успешно прорвали первую линию обороны."
10052080-27 = "Мир, мир. Видели, Сенсей? Раздайте всем ободряющую похвалу."
10052080-28 = "[s] «Отличная работа, все!»"
10052080-29 = "Хотелось бы сказать, что надо сразу идти дальше и ударить по второй линии обороны, но..."
10052080-30 = "...думаю, нам стоит подготовиться и перегруппироваться."
10052080-31 = "Почему? У меня ещё полно сил."
10052080-32 = ""
10052080-34 = ""
10052080-35 = "Химари права... Ситуация тяжёлая, но нужно быть осторожными."
10052080-36 = ""
10052080-39 = ""
10052080-40 = "Погодите... Мне... звонят?"
10052080-41 = ""
10052080-45 = ""
10052080-46 = "...Для начала поздравляю. Вы нас достали. Вы ТАКИЕ впечатляющие."
10052080-47 = "От вас одни проблемы... Наши бедные пророки... *шмыг*"
10052080-48 = "Это последнее предупреждение. Поворачивайте назад. Мы не отвечаем за то, что ждёт впереди."
10052080-49 = "О-она права... Пожалуйста, идите... домой. М-мы не... хотим никому причинять вред."
10052080-50 = "Мы тоже не хотим видеть, как вы... пострадаете..."
10052080-51 = ""
10052080-54 = ""
10052080-55 = "...О, ну это смешно. Вы трое вообще понимаете ситуацию? По-вашему, у кого сейчас преимущество?"
10052080-56 = "Не у вас. Насколько помню, вы проиграли нашей дорогой сестре."
10052080-57 = "Она даже не использовала полную силу. Не заблуждайтесь. Вы не представляете угрозы."
10052080-59 = "Ах..."
10052080-60 = ""
10052080-62 = ""
10052080-63 = "Хм, теперь вижу, её тело..."
10052080-64 = "Ч-что с ним? Я его одолжила. Есть проблемы?"
10052080-66 = "Хм. Нет, у НАС проблем нет. Признаю, я удивлена, что ты так долго поддерживала его в рабочем состоянии."
10052080-67 = "Мы немного знаем об этом теле...! М-мы всё ещё получаем часть его данных!"
10052080-69 = "Если говорить по-человечески, ты словно сшила конечности и начала ими управлять, даже не проверив, соединены ли нервы."
10052080-70 = "Сейчас всё работает нормально! Не твоё дело!"
10052080-71 = "Ты напоминаешь мне Тиферет. Почему вы все так отчаянно цепляетесь за жизнь?"
10052080-72 = "Всё было бы намного проще, если бы вы просто приняли конец."
10052080-73 = ""
10052080-75 = ""
10052080-76 = "[ns] «...»"
10052080-81 = ""
10052080-85 = "[log]Само существование — уже проклятие, верно?[/log]"
10052080-87 = "[log]Жизнь неприятна, утомительна,[/log]"
10052080-88 = "[log]уродлива и полна страданий...[/log]"
10052080-90 = "[log]Свобода угнетает вас.[/log]"
10052080-91 = "[log]Сама жизнь недостойна обладать свободой воли.[/log]"
10052080-95 = "[ns1] «Вы всё ещё верите, что жизнь...»\n[ns2] «...это лишь продолжение страданий?»"
10052080-98 = "Разве это не очевидно? Мы по-прежнему считаем, что вы обманываете сами себя."
10052080-99 = "Никто не выбирает рождение. Каждого из вас бросили в мир, где вы ничего не знали. Вы даже не выбирали собственные имена."
10052080-100 = "И всё же вы ведёте себя так, будто в ваших жизнях есть какой-то великий смысл. Вы здесь случайно. Существование вам навязали."
10052080-102 = "А!!"
10052080-103 = "...!"
10052080-105 = "Вы когда-нибудь всерьёз думали о завтрашнем дне? Скорее всего, нет. Иначе сошли бы с ума."
10052080-106 = "Потому что завтра... всегда означает меньше. Оно означает, что у вас что-то отнимут."
10052080-108 = "Давайте посмотрим на вероятности. Вы уже должны видеть закономерность. Впереди у вас куда больше «плохих» завтрашних дней, чем «хороших»."
10052080-109 = "Единственное, что гарантировано: каждый новый день приближает вас к смерти."
10052080-111 = "Т-ты...?!"
10052080-112 = "Что? Вы удивились, что мы прямо произнесли слово «смерть»?"
10052080-113 = "Нам не даровали Мистику."
10052080-115 = "Уверена, Сенсей понимает, о чём мы говорим."
10052080-116 = "[s] «...»"
10052080-117 = "Вы верите в расплывчатую надежду... вместо неизбежного завтра, которое всегда приближается к нам... молча..."
10052080-119 = "«Сочувствие» — это повязка, которой вы закрываете экзистенциальные раны? Как восхитительно высокомерно — думать, что разделённая боль исчезает."
10052080-120 = "Это невероятно высокомерно."
10052080-121 = "Ж-жизнь, отношения, общества..."
10052080-122 = "Ага. Всё это хрупкие конструкции, построенные на силе и недопонимании."
10052080-123 = "И поэтому мы..."
10052080-124 = "Мы..."
10052080-125 = "..."
10052080-126 = "Чёрт..."
10052080-127 = "Просто помните! Мы уже говорили: можем уничтожить вас по прихоти."
10052080-128 = "Можете остановиться сейчас или сдаться своему последнему дню. Наша старшая сестра здесь."
10052080-129 = "[s] «Но мы проделали весь этот путь.»"
10052080-131 = "[ns] «Мы должны сделать всё, что можем, чтобы жить без сожалений.»"
10052080-132 = "..."
10052080-133 = "...Я поражена."
10052080-134 = "Вы и правда безнадёжный идиот, Сенсей [USERNAME]!!"
10052080-135 = "Мы вас предупреждали! Если хотите, растратьте последние часы впустую!"
10052080-136 = ""
10052080-138 = ""
10052080-140 = "..."
10052080-141 = "..."
10052080-142 = "Серьёзно, они позвонили нам, прочитали нотацию и просто бросили трубку?"
10052080-143 = "Это ОНИ позвонили МНЕ!"
10052080-144 = "..."
10052080-145 = "Я едва следила за их речью и вообще не особо слушала. Что делаем дальше?"
10052080-146 = "А, да. Верно. Токи... спасибо, что возвращаешь нас к делу."
10052080-147 = "Вот текущая ситуация. Скорость расширения Стального континента резко снизилась. Это хорошая новость."
10052080-148 = "Ага. Думаю, это подтверждает теорию о том, что все пророки связаны друг с другом."
10052080-149 = "Кроме того, теперь мы должны суметь расширить доступную нам зону действий дальше вглубь."
10052080-150 = "Будем захватывать вражескую территорию и расширять свою. Мне нравится."
10052080-151 = "Всем, кто находится на поле: продолжайте разведку. Только обязательно вернитесь на базу до заката."
10052080-153 = "Сенсей! Мы можем чем-нибудь помочь?"
10052080-154 = ""
10052080-156 = ""
10052080-157 = "«Защищайте корабль». Поняла. Оставьте это нам."
10052080-159 = "Я-я постараюсь..."
10052080-160 = ""
