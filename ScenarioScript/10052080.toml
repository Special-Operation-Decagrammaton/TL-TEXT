10052080-164 = "..."
10052080-165 = "(Арис...?)"
10052080-166 = "Э-эм... Сенсей...?"
10052080-167 = "[s] «Что такое, Арис?»"
10052080-168 = "В общем, дело в том, что..."
10052080-169 = "..."
10052080-170 = "..."
10052080-171 = "..."
10052080-172 = "[s] «...»"
10052080-174 = "[ns] «Всё хорошо, Арис.»"
10052080-175 = ""
10052080-177 = ""
10052080-178 = "Откуда вы...?"
10052080-179 = "Вы не хотите, чтобы я «вытягивала ответ силой»."
10052080-180 = "Вы хотите подождать, пока я сама буду готова поговорить?"
10052080-181 = "..."
10052080-182 = "Поняла. Тогда... так и сделаю."
10052080-183 = "Спасибо, Сенсей. Спасибо, что заботитесь обо мне."
10052080-184 = ""
10052080-186 = ""
10052080-187 = "Все, может, вам уже стоит возвращаться на корабль. Вы довольно далеко ушли, помните?"
10052080-188 = "П-поняла, Химари! Мы прямо сейчас возвращаемся!"
10052080-189 = "Поторопимся. Мы пока захватили всего три области."
10052080-191 = "Поняла. Токи, Сенсей, идём."
10052080-192 = "Да. У меня есть обязанности по обслуживанию. Я должна вернуться первой и всё подготовить."
10052080-194 = "Тогда и нам стоит..."
10052080-195 = ""
10052080-199 = "...?!"
10052080-201 = "Если бы тебе показали путь, способный остановить конфликт, ты бы пошла по нему?"
10052080-202 = "...? Сенсей? Вы... что-то мне сказали?"
10052080-203 = "[s] «А? Я ничего не говорил...»"
10052080-204 = "..."
10052080-205 = "Да. Я ошиблась. Это совсем не было похоже на ваш голос."
10052080-206 = "Но... звучало очень похоже."
10052080-207 = ""
10052080-209 = ""
10052080-210 = ""
10052080-214 = "Важно найти себя."
10052080-215 = "Это относится и к тебе."
10052080-216 = "?!"
10052080-217 = "К-Кей? Ты тоже... ничего не слышала?"
10052080-218 = "..."
10052080-219 = "Нет. Я ничего не слышала, Арис."
10052080-220 = "Ну, пока нет."
10052080-221 = "Пока...?"
10052080-222 = "Нет. Но всё же."
10052080-223 = "Почему-то я понимаю, что ТЫ что-то услышала, Арис."
10052080-224 = "...! Ты что-то почувствовала, Кей?!"
10052080-225 = "Но прежде чем я объясню, помнишь, что сказал тебе этот голос?"
10052080-226 = "Н-ну...! Всё случилось так внезапно и неожиданно, что я почти ничего не помню."
10052080-227 = "Но кажется, я услышала что-то о том... как важно найти себя."
10052080-228 = "..."
10052080-229 = "Понятно. Тогда... думаю, больше мне нечего добавить."
10052080-230 = "Но если услышишь что-нибудь ещё, пожалуйста, постарайся запомнить."
10052080-231 = "И что бы ни случилось, никогда не забывай..."
10052080-232 = "Я здесь, чтобы поддержать тебя. И Сенсей тоже. Мы все."
10052080-233 = ""
10052080-235 = ""
