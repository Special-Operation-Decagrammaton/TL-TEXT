[translation]
1011602-1 = "Новая подработка"
1011602-2 = "Вскоре после нашего разговора Саори пришла в Шале с огромной сумкой."
1011602-3 = ""
1011602-8 = ""
1011602-9 = "Спасибо, что уделишь мне время, Сенсей."
1011602-10 = "Я пришла к тебе, потому что..."
1011602-11 = "...хотя, думаю, проще будет показать."
1011602-12 = "Можешь... оставить меня ненадолго одну, прежде чем мы начнём?"
1011602-13 = "Мне нужно кое-что подготовить."
1011602-14 = "[s1] «Не знаю, что тебе там нужно подготовить, но ладно.»\n[s2] «Жду с нетерпением!»"
1011602-17 = "Спасибо. Я позову, когда буду готова."
1011602-23 = "Цок, теснее, чем я ожидала..."
1011602-24 = ""
1011602-27 = "Разве раньше это не сидело свободнее...?"
1011602-28 = "[ns3] «Эм, Саори?»\n[ns4] «Там всё в порядке?»"
1011602-31 = "Подожди...! Ещё не всё!"
1011602-32 = "Ещё немного!"
1011602-33 = ""
1011602-36 = "Некоторое время спустя..."
1011602-37 = ""
1011602-40 = "...Ладно. Теперь можешь заходить."
1011602-42 = ""
1011602-43 = "..."
1011602-44 = "[ns] «Хм...?»"
1011602-45 = "Сенсей...? Почему ты так на меня смотришь?"
1011602-46 = "Тебе кажется, что это выглядит странно...?"
1011602-47 = "[s5] «Саори... в платье?!»\n[s6] «К-Кто ты такая и что сделала с настоящей Саори?»"
1011602-50 = "Это всё ещё я, Сенсей."
1011602-51 = "Похоже, такой образ мне всё-таки не идёт..."
1011602-52 = "Прости, что отняла твоё время. Просто забудь, что это вообще было..."
1011602-53 = ""
1011602-55 = ""
1011602-56 = "[ns] «П-Прости! Я просто удивился. Тебе очень идёт!»"
1011602-57 = ""
1011602-59 = ""
1011602-60 = "Вот как...? Спасибо."
1011602-61 = "Наверное, стоило сначала всё объяснить."
1011602-62 = "Дело в том, что мне подвернулась хорошо оплачиваемая подработка."
1011602-63 = "Теперь я модель для платьев. Мои фотографии опубликуют в журнале."
1011602-64 = "[s7] «Ого, модель!»\n[s8] «Вот это серьёзная работа!»"
1011602-67 = "...Да. Это очень серьёзное дело. Мне многое нужно подготовить и за многим следить."
1011602-68 = "Только теперь я более-менее привыкла носить платья... благодаря прошлой работе."
1011602-69 = "Но я понятия не имею, что именно должна делать."
1011602-70 = "[s9] «Ты так говоришь, но...»\n[s10] «Выглядит здорово. Будто тебя стилизовал профессионал!»"
1011602-73 = ""
1011602-75 = ""
1011602-76 = "Э-Это совпадение! Просто платье удачно село!"
1011602-77 = "В любом случае я почти ничего не знаю о работе модели. Кроме того, что нужно позировать для фотографий."
1011602-78 = "И всё же, Сенсей. У меня есть вопрос."
1011602-79 = ""
1011602-81 = ""
1011602-82 = "Как вообще... позируют модели? Ты знаешь?"
1011602-83 = "[s11] «Хм, думаю, фотограф тебе подскажет.»\n[s12] «Если ничего не приходит в голову, просто веди себя естественно. Как сейчас.»"
1011602-86 = "Как сейчас? «Естественно»...? Что это значит?"
1011602-87 = "Мне нужно позировать уверенно и строго или... с какой-нибудь близкой людям странностью?"
1011602-88 = "Что для меня будет выглядеть более... «естественно»?"
1011602-89 = "[s13] «Не переживай так сильно.»\n[s14] «Оставайся такой, какая ты обычно.»"
1011602-92 = "«Как обычно»..."
1011602-93 = "...Поняла. То есть не показывать волнение и держаться уверенно, верно?"
1011602-94 = "А «идти как обычно»... Вот так?"
1011602-95 = ""
1011602-97 = ""
1011602-98 = ""
1011602-99 = ""
1011602-100 = ""
1011602-101 = ""
1011602-103 = ""
1011602-104 = ""
1011602-105 = "Хорошо. Я подошла для крупного плана. Теперь я выгляжу уверенно?"
1011602-106 = ""
1011602-108 = ""
1011602-109 = "...Сенсей. По твоему лицу... трудно что-либо понять."
1011602-110 = "Я выгляжу... неприемлемо? Я думала, что—"
1011602-111 = "[ns] «Можно я тебя сфотографирую?»"
1011602-112 = ""
1011602-114 = ""
1011602-115 = "Н-Нет!"
1011602-116 = "[s] «Никому не покажу! Только себе!»"
1011602-117 = "Тогда тем более нет!"
1011602-118 = "Если фотография будет только у тебя, то она должна получиться как следует..."
1011602-119 = "Ах..."
1011602-120 = "[s] «О, вот это выражение лица сейчас было идеальным!»"
1011602-121 = "...Ч-Что в нём было такого хорошего?"
1011602-122 = "Как бы то ни было, я ещё не готова. Мне многому предстоит научиться."
1011602-123 = "Я дам тебе фотографию, когда наберусь опыта."
1011602-124 = "[s15] «О-о, значит, всё-таки дашь мне одну? Я счастлив!»\n[s16] «Тогда придётся ещё усерднее работать над твоими позами!»"
1011602-127 = "Цок, как на тебя похоже, Сенсей..."
1011602-128 = ""
1011602-130 = ""
1011602-131 = ""
1011602-132 = ""
1011602-133 = "Хорошо. Я всему научусь! Начинай, когда будешь готов, Сенсей!"
1011602-134 = "[ns] «Готовься, Саори! Мои занятия будут суровыми!»"
1011602-136 = "После этого я старательно помогал Саори осваивать позы для модельной съёмки в платье."
