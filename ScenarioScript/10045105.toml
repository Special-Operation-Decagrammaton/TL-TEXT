[translation]
10045105-2 = "Ух...! Я... Как это могло...?"
10045105-3 = ""
10045105-5 = ""
10045105-7 = "*вздыхает*"
10045105-8 = "Помехи устранены."
10045105-9 = "Так проведём матч."
10045105-10 = "Сразимся перед Сенсеем и докажем им нашу силу!"
10045105-11 = "П-Погодите! Я вообще этого не планировала!"
10045105-12 = "Я Вакамо, грешница и преступница. Даже мысль о том, что я могу участвовать в таких мероприятиях, для меня лишь туманный сон."
10045105-13 = "Поэтому моё искреннее желание — просто насладиться этим коротким мгновением фестиваля вместе с Сенсеем. Разве это... так неправильно?"
10045105-14 = "Э-Это..."
10045105-15 = "Да ладно! САМА Лисица Бедствия будет играть?"
10045105-16 = "Я буквально умру, если она это сделает!"
10045105-17 = "ПУСТЬ ИГРАЕТ! ПУСТЬ ИГРАЕТ!"
10045105-18 = "Толпа так завелась..."
10045105-19 = "...Пожалуй, не стоит отказываться от подарка судьбы."
10045105-20 = "Тогда нужно дать людям то, чего они хотят! Три громких приветствия нашему неожиданному, но желанному новому гостю! Мы проведём особый матч специально для этого события."
10045105-21 = "У-У-У-У-У!"
10045105-22 = ""
10045105-23 = "[ns] «Тогда... проведём ещё один раунд Нокаута.»"
10045105-25 = "[ns1] «Нет лучшей игры, чтобы определить силу.»\n[ns2] «Вакамо, конечно, тоже придётся соблюдать правила.»"
10045105-29 = "Разумеется."
10045105-30 = "Я, Вакамо, с радостью принимаю."
10045105-31 = "Чтобы получить ваше признание, любовь моя, я готова на всё."
10045105-32 = "[s] «Я рад, что ты счастлива, Вакамо!»"
10045105-33 = "Heeheehee, then who shall be my opponent? I, Wakamo, will beat them, no matter who it is!"
10045105-34 = "В таком случае..."
10045105-35 = ""
10045105-37 = ""
10045105-39 = "Нагуса..."
10045105-40 = "...против Вакамо, Лисицы Бедствия?"
