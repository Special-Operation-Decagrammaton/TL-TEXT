[translation]
1001002-1 = "Беговая машина"
1001002-2 = "Улицы Кивотоса"
1001002-3 = "(Я жду Широко на маршруте её утренней пробежки.)"
1001002-5 = "Хм-м."
1001002-6 = "Долго ждал, Сенсей?"
1001002-7 = "[s] «Нет, я только что пришёл.»"
1001002-8 = "А, хорошо."
1001002-9 = "Встречаться вот так, вдали от школы, совсем непривычно."
1001002-10 = "Немного напоминает нашу первую встречу..."
1001002-11 = "Нет ничего лучше хорошей тренировки."
1001002-12 = "[s] «Ты и правда любишь тренироваться, да?»"
1001002-13 = "А вот и вы."
1001002-14 = "Нет ничего лучше, чем хорошенько вспотеть с самого утра."
1001002-15 = "..."
1001002-16 = "И, разумеется, принять душ, когда доберусь до школы."
1001002-17 = "Хм-м."
1001002-18 = "Как думаете, сможете присоединиться ко мне на утренней пробежке?"
1001002-19 = "[s1] «Не уверен насчёт пробежки с самого утра...»\n[s2] «Честно говоря, не хочется потом весь день быть измотанным.»"
1001002-20 = "Хм. Понимаю. Мне всё равно нужно за покупками, так что, может, в другой раз."
1001002-21 = "Хм. Понимаю. Мне всё равно нужно за покупками, так что, может, в другой раз."
1001002-22 = "Вообще-то рынок, куда я направляюсь, прямо вон там."
1001002-23 = "Он недалеко, так что давайте добежим туда."
1001002-24 = ""
1001002-25 = "[s] Следовать за Широко."
1001002-27 = "(Час спустя...)"
1001002-29 = ""
1001002-30 = ""
1001002-31 = ""
1001002-32 = "..."
1001002-33 = "[s] *пыхтит* ... *пыхтит* ... *пыхтит*..."
1001002-34 = "А вот и вы."
1001002-35 = "Я уже думала, почему вы так долго..."
1001002-36 = "Я слишком быстро бежала? Простите."
1001002-37 = "Мне часто говорят, что когда у меня появляется цель, я перестаю замечать всё вокруг..."
1001002-38 = "[s3] «Я думал, рынок рядом.»\n[s4] «Мы бежим уже час...»"
1001002-39 = "А..."
1001002-40 = "А..."
1001002-41 = "Мы примерно на полпути."
1001002-42 = "[s] «На полпути?!»"
1001002-43 = "Остался всего ещё час бега. Я немного сбавлю темп, а вы сосредоточьтесь на том, чтобы не отставать, Сенсей."
1001002-44 = ""
1001002-45 = "[s] «П-Постойте!»"
1001002-47 = "(Я останавливаю бегущую Широко и прошу идти пешком.)"
1001002-48 = "(После этого мы ещё два часа идём пешком.)"
1001002-50 = "Пришли. Это рынок."
1001002-51 = "А?"
1001002-52 = "Сенсей, вы в порядке? Выглядите не очень..."
1001002-53 = "[s] «Сколько мы прошли, чтобы сюда добраться?»"
1001002-54 = "Хм. Примерно 15 километров?"
1001002-55 = "Как раз подходящее расстояние, чтобы заглянуть сюда по пути назад с утренней пробежки."
1001002-56 = "Я собиралась пойти в магазин подальше, но раз вы со мной, выбрала место поближе."
1001002-57 = "Раз мы шли пешком, всё было не так уж плохо, правда?"
1001002-58 = "Подождите, нельзя ложиться прямо здесь, Сенсей. Нам ещё 15 километров идти обратно..."
1001002-59 = "[s] «Прекрати мои страдания...»"
1001002-60 = "Э-Эм..."
