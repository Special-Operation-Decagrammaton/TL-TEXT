[translation]
1601105-1 = "Забота о себе"
1601105-3 = "Спортивный праздник, перед обедом."
1601105-4 = "Я увидел Хасуми одну на скамейке, когда она доставала коробку с обедом."
1601105-5 = ""
1601105-7 = ""
1601105-8 = "[ns1] «Хасуми?»\n[ns2] «Ты ешь одна?»"
1601105-9 = ""
1601105-10 = ""
1601105-12 = ""
1601105-13 = "А?"
1601105-14 = "О, Сенсей. Не ожидала увидеть вас здесь."
1601105-15 = "Да. Одна из моих обязанностей — направлять студентов во время обеда."
1601105-16 = "Я решила, что потом будет сложно найти время поесть, поэтому использую эту возможность, пока снова не началась суета..."
1601105-17 = ""
1601105-19 = ""
1601105-20 = "...Сенсей? Почему вы так на меня смотрите?"
1601105-21 = "...Хм?"
1601105-22 = "О, вы об этом?"
1601105-23 = ""
1601105-25 = ""
1601105-26 = "Как видите, это простой обед: батат, сваренное вкрутую яйцо и помидор."
1601105-27 = "Хм..."
1601105-28 = "Наверное, вас беспокоит сообщение, которое я отправила в MomoTalk. Простите, что заставила волноваться..."
1601105-29 = "[s3] «Сегодня точно лучший день, чтобы считать калории?»\n[s4] «Ты уверена, что такой еды хватит на весь день?»"
1601105-32 = "Думаю, по калориям всё хорошо."
1601105-33 = "И если честно, разве такой день — не лучшая возможность эффективно похудеть?"
1601105-34 = "Но..."
1601105-35 = "[s] «Но?»"
1601105-36 = ""
1601105-38 = ""
1601105-40 = ""
1601105-42 = "Но я голодная. Обед ведь уже скоро!"
1601105-43 = "Я хочу мяса. Мяса!"
1601105-44 = "Ты и правда настоящая хищница, да?"
1601105-45 = "Очевидный выбор в такой день — парфе!"
1601105-46 = "Парфе? Т-Ты вообще представляешь, сколько калорий даже в одном парфе? Ты наберёшь вес!"
1601105-47 = "Не говори глупостей."
1601105-48 = "Мы весь день будем бегать! Идеальная возможность без последствий съесть что-нибудь такое!"
1601105-49 = "Разве это не значит, что нам нужно больше мяса?"
1601105-50 = "Ни за что! Парфе или ничего!"
1601105-51 = "Мясо не победить!"
1601105-52 = "Парфе!"
1601105-53 = ""
1601105-55 = ""
1601105-56 = "Мясо мясо мясо мясо мясо!"
1601105-57 = "Парфе парфе парфе парфе парфе!"
1601105-58 = ""
1601105-60 = ""
1601105-62 = "..."
1601105-63 = "[s5] «Понятно...»\n[s6] «Вокруг тебя сегодня гораздо больше соблазнов, чем обычно.»"
1601105-66 = "Путь к внутреннему покою лежит через отказ от внешних искушений. Я не поддамся этим сочным, вкусным, аппетитным соблазнам..."
1601105-67 = "Похоже, мне ещё далеко до внутреннего покоя. Как стыдно."
1601105-68 = "...Хм? А что насчёт лимонов в мёду, которые мы готовили?"
1601105-69 = "О, они были для других членов Отряда правосудия. Я не собиралась есть."
1601105-70 = "Всё-таки мёд очень калорийный. Все мои усилия будут бессмысленны, если я съем что-то подобное..."
1601105-71 = "[ns] «...»"
1601105-72 = ""
1601105-74 = ""
1601105-75 = ""
1601105-76 = ""
1601105-78 = "[ns7] Достать свои лимоны в мёду.\n[ns8] «Почему бы нам не съесть немного вместе?»"
1601105-79 = ""
1601105-80 = ""
1601105-82 = ""
1601105-83 = "...?! Ч-Что вы имеете в виду, Сенсей?"
1601105-84 = "А? Мы поделим совсем немного, поэтому с калориями всё будет нормально?"
1601105-85 = "Н-Ну, возможно, это правда, но я ведь подарила их вам..."
1601105-86 = "...И вы уже немного ели!"
1601105-87 = "Не то чтобы мне было противно или что-то такое..."
1601105-88 = "Просто, знаете, в каком-то смысле это будет как..."
1601105-89 = ""
1601105-91 = ""
1601105-92 = "*вздыхает*"
1601105-93 = "Неважно. Ничего. Я снова разволновалась из-за пустяка."
1601105-94 = "Не стоит неправильно воспринимать вашу доброту..."
1601105-95 = "Спасибо. Я попробую."
1601105-96 = "Только один крошечный, незначительный, совсем маленький кусочек..."
1601105-103 = ""
1601105-104 = ""
1601105-105 = "[ns9] «...Хасуми?»\n[ns10] «Твоя реакция...»"
1601105-108 = "...М-м..."
1601105-109 = ""
1601105-111 = ""
1601105-113 = "М-м-м-м-м-м!"
1601105-114 = "Я всё это время ела только сухое и кислое... А теперь во рту наконец что-то настолько сладкое..."
1601105-115 = "Это ощущение... этот вкус... Прошло так много времени... Слишком много!"
1601105-116 = ""
1601105-118 = ""
1601105-119 = ""
1601105-120 = "Я больше не могу себя сдерживать!"
1601105-121 = ""
1601105-128 = "[ns11] «...Х-Хасуми? Ты в порядке?»\n[ns12] «Хасуми, стой! Это слишком много! Ты же...!»"
1601105-129 = ""
1601105-130 = ""
1601105-139 = "А-а-а-а... Так... гораздо... лучше..."
1601105-140 = "Я... Я съела всё до последнего..."
1601105-141 = ""
1601105-143 = ""
1601105-144 = "..."
1601105-145 = "А..."
1601105-146 = "...С-Сенсей? Эм, послушайте..."
1601105-147 = "Дело в том..."
1601105-148 = ""
1601105-150 = ""
1601105-151 = "...Мне очень жаль."
1601105-153 = "Я успокоил Хасуми перед тем, как уйти."
