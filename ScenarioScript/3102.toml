[translation]
3102-1 = "Проверка концепции 2"
3102-3 = ""
3102-4 = "...Все боятся будущего."
3102-5 = "В отличие от неподвижного прошлого, будущее полно неопределённых возможностей."
3102-6 = "Но признать это — значит признать собственное незнание, а незнание лежит в основе любого страха."
3102-7 = "Однако будущее — не более чем последствия настоящего. Любому изменению предшествует то, что находится прямо перед нами сейчас."
3102-8 = "Нам просто не хватает инструментов, чтобы понять собственное настоящее."
3102-9 = "И потому я, прекрасная сверхгениальная хакерша Химари, наблюдающая за всеми данными Кивотоса, кое-что придумала."
3102-10 = "Что, если дать себе такие инструменты? Реальность — не более чем совокупность точек данных. Если бы мы могли достаточно эффективно обработать их все, разве не смогли бы наконец увидеть будущее собственными глазами?"
3102-11 = "Из этой мысли и родился Протокол пророчества."
3102-12 = "Каждая переменная в мире — от движения небесных тел до геномов живых существ — будет разложена до единственного по-настоящему понятного нам вида: данных. А из этих данных станет известно будущее."
3102-13 = "Если кто-то желает решить проблему, которой является будущее..."
3102-14 = ""
3102-16 = ""
3102-17 = "Я приложила проектную спецификацию Протокола пророчества."
3102-19 = ""
3102-20 = "Итак, согласно сноскам в этом манифесте..."
3102-21 = "...это проект устройства, которое предсказывает будущее?"
3102-22 = "Похоже на то. Предсказывать будущее, значит?"
3102-23 = ""
3102-25 = ""
3102-26 = ""
3102-28 = ""
3102-29 = "Удивительно, что это написала президент Химари. Никогда не видела ничего подобного."
3102-30 = "Он не соответствует стандартному формату предложений Миллениум... а множество разрозненных гипотез трудно переварить, и всё же..."
3102-31 = "Проект определённо амбициозный. Назвать его сменой парадигмы — ещё ничего не сказать... Если он заработает."
3102-32 = ""
3102-40 = ""
3102-41 = ""
3102-43 = "Не заработает. Это невозможно. Разложить вообще всё существующее на данные и обработать всё это? Бессмыслица... Правда?"
3102-44 = "Даже если бы сам процесс был возможен, в мире нет устройства с необходимой вычислительной мощностью."
3102-45 = ""
3102-47 = ""
3102-48 = "Но это разработал не кто попало. Проект создала сама президент Веритас Химари..."
3102-49 = "Возможно, нам просто нужно расширить собственное представление о возможном до её уровня..."
3102-50 = "...Но даже если мы растянем понятие возможного, не уверена, что сможем настолько же растянуть бюджет."
3102-51 = ""
3102-53 = ""
3102-54 = "Дорогие преломляющие линзы для наблюдений за глубоким космосом, экспериментальные вычислительные ядра для суперкомпьютеров..."
3102-55 = "На эти деньги можно содержать целый клуб."
3102-56 = "Мне всё ещё трудно поверить, что оно реально предскажет будущее, да и заявку подали неправильно..."
3102-57 = "Тогда отправляем в стопку отклонённых."
3102-58 = ""
3102-60 = ""
3102-61 = "Подождите минутку!"
3102-62 = "Будет расточительством отклонить настолько продвинутый проект, даже не дав ему шанса."
3102-63 = "Но ты только что сказала..."
3102-64 = "У Миллениум недостаточно денег, чтобы финансировать непроверенные технологии..."
3102-65 = "Н-Ну да, но..."
3102-66 = "Но любой прогресс — это риск! Я просто хочу рисковать с расчётом!"
3102-67 = "Если этот Протокол пророчества заработает, разве он не сможет решить семь проблем?"
3102-68 = "Это разработка президента Химари. Даже если она не заработает именно так, как описано, совершенно бесполезной она быть не может..."
3102-70 = "Если убедилась даже ты, я спорить не стану."
3102-71 = "Тогда на чьё имя официально записывать финансирование Протокола пророчества?"
3102-72 = "На Веритас нельзя — они неофициальный клуб..."
3102-73 = "И у нас есть приказ президента Рио не поддерживать президента Химари..."
3102-74 = "Запиши на моё имя."
3102-75 = ""
3102-77 = ""
3102-78 = "На тебя?!"
3102-79 = "Ты уверена? Я слышала, твои недавние инвестиции полностью провалились и тебе пришлось покрывать убытки из своего кармана..."
3102-80 = "Всё нормально! Если Протокол пророчества будет завершён, у меня такое чувство, что о деньгах больше никогда не придётся беспокоиться..."
3102-81 = ""
3102-83 = ""
3102-85 = "Акции... Тренды... Время — деньги во многих смыслах!"
3102-86 = ""
3102-89 = ""
3102-90 = "Ну... По крайней мере, ты настроена решительно, Юука."
3102-91 = "Как преданная подруга Юки... то есть как преданный студент Миллениум, я не упущу такую возможность."
3102-92 = "Конструкция выглядит сложновато, а создать Протокол пророчества нам нужно, не привлекая никого за пределами Семинар."
3102-93 = "Если о такой штуке узнают все чудики Миллениум... Кто знает, что случится?"
3102-94 = ""
3102-96 = ""
3102-98 = "За будущее, где нам никогда больше не придётся переживать о деньгах..."
3102-99 = "То есть... за будущее, доведённое технологиями до совершенства!"
3102-101 = "Я уже вся в предвкушении!"
