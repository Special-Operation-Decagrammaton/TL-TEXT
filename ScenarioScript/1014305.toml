[translation]
1014305-1 = "Overwriting Memories"
1014305-3 = "[ns] \"......\""
1014305-5 = "Sensei? I-is something wrong...?"
1014305-6 = "[s] \"Are you really... going to do the same thing as yesterday?\""
1014305-7 = "A-Am I being a bother after all?"
1014305-8 = "Go back to the exact same place just to overwrite yesterday's memories..."
1014305-9 = "[s1] \"That's not true at all!\"\n[s2] \"Since it's our second time, I was worried you might get bored...\""
1014305-12 = "No. That's not the case."
1014305-13 = "Because what you feel when you are \"young\" and when you are \"grown up\" is#ndifferent."
1014305-14 = "Ah... Even if it's fine for me, it must be boring for you, Sensei...?"
1014305-15 = "[s3] \"I-I'm looking forward to it!\"\n[s4] \"Because I'm with \"Shun\" today!\""
1014305-18 = "..."
1014305-19 = "Thank you for saying that."
1014305-20 = "Well then, I'll be in your care for the rest of the day."
1014305-25 = "Let's begin our fun rafting trip! I will explain the safety precautions now."
1014305-29 = "Then, let's off we go!"
1014305-30 = "We look forward to it."
1014305-34 = "On the right side, there's a rock with a big hole in it, you see?"
1014305-35 = "Um... since it's shaped like a water buffalo, is it called \"Water Buffalo Rock\"?"
1014305-37 = "Ohh~ Sharp! Wait, you already know that? That's great."
1014305-38 = "I envy you for being with such a knowledgeable lady!"
1014305-39 = "E-Eh!? Um, well...!"
1014305-42 = "The waves are rough today, so please hold on tight!"
1014305-44 = "[ns] \"A-Ah!?\""
1014305-45 = "Sensei!?"
1014305-56 = "Until we cross these rapids, please hold on tight to each other!"
1014305-57 = "H-Hold on tight, the guide said."
1014305-58 = "..."
1014305-59 = "Look... please don't hold back, hug me tight."
1014305-60 = "[s] \"Y-Yeah...!\""
1014305-62 = "That concludes today's rafting!"
1014305-66 = "Thank you very much!"
1014305-67 = "..."
1014305-68 = "H-How was it?"
1014305-69 = "Did it become a new experience... different from yesterday?"
1014305-70 = "I... feel that way."
1014305-71 = "[s] \"I-I felt it was a new experience!\""
1014305-72 = "I'm glad..."
1014305-73 = "Well then! Shall we head to the shopping district now?"
1014305-76 = "Since the first thing we ate yesterday was skewers, today we should..."
1014305-77 = "..."
1014305-78 = "Um... Sensei."
1014305-79 = "Today... instead of acting as a guardian, #ncould you walk with me as my travel partner?"
1014305-80 = "[s] \"Hm? Alright, let's do that.\""
1014305-81 = "Thank you, Sensei. Well then..."
1014305-86 = "（Shun suddenly and casually linked her arm with mine...！）"
1014305-87 = "It's fine, right? Since we are partners... today."
1014305-88 = "Hehe..."
1014305-89 = "Thank you once again, Sensei."
1014305-91 = "（I stroll around the town slackly with Shun.）"
1014305-92 = "（Since we got hungry along the way, we had a meal at a restaurant nearby...）"
1014305-99 = "Thank you for spoiling me both yesterday and today."
1014305-100 = "[s] \"The pleasure is mine, thank you too.\""
1014305-101 = "Hehe, I'm honored that you feel that way."
1014305-102 = "..."
1014305-103 = "I had a strange experience today."
1014305-104 = "[s] \"A strange experience?\""
1014305-105 = "Yesterday and today... the situation were almost the same but..."
1014305-106 = "My behavior was a bit different."
1014305-107 = "Though I must say myself that... #nI think I acted more like an \"adult\" compared to yesterday."
1014305-108 = "At the same time, it reminded me of my younger self..."
1014305-109 = "So somehow..."
1014305-110 = "Even though the mountains and rivers remain unchanged, I felt as if I was the only#none who changed."
1014305-111 = "[s] \"Mountains and rivers change slowly too, you know.\""
1014305-112 = "That's true. But that takes an incredibly long time."
1014305-113 = "I’ll have many more experiences from here on and will become an adult someday, but..."
1014305-114 = "I couldn't help but wonder if I could ever become a \"proper adult\" like you, Sensei."
1014305-115 = "Eh? No, I'm not overestimating you."
1014305-116 = "[s] \"They say that adults... have three inner children living inside them.\""
1014305-117 = "T-the fact that the number is so specific actually hits home..."
1014305-118 = "Does everyone, in the end, carry a childish heart forever?"
1014305-119 = "Hehe..."
1014305-120 = "In that case, does that mean there’s a mischievous child hiding inside you too,#nSensei?"
1014305-121 = "[s5] \"Shun-oneechan! Let's play together!\"\n[s6] \"Hai, haiiii~ play with me!\""
1014305-124 = "S-Sensei!?"
1014305-125 = "..."
1014305-126 = "Now, come over here, child. Shall we play together?"
1014305-127 = "[s7] \"Shun-oneechan, thank you!”\n[s8] \"Yay! Shun-oneechan! You're so kind\""
1014305-130 = "Yes. Let's play together a whole lot."
1014305-133 = "(The next moment, everything before my eyes was filled with Shun’s softness…!)"
1014305-137 = "[ns] \"!?!?\""
1014305-139 = "Shh- There there, good child"
1014305-140 = "You don't have to think about anything."
1014305-141 = "Just for now..."
1014305-145 = "[s] \"...\""
1014305-146 = "..."
1014305-147 = "[s] \"...\""
1014305-148 = "..."
1014305-149 = "Se-Sensei...? Please say something...!"
1014305-150 = "..."
1014305-151 = "[s] \"...I-I'm sorry. I got caught up in the atmosphere...\""
1014305-152 = "N-No! It was my fault..."
1014305-153 = "It didn't feel bad at all... In fact, it was rather nice... #nIf I'm being greedy, I wanted to do it even more..."
1014305-154 = "*Cough, cough*!"
1014305-155 = "A summer valley is truly a terrifying!"
1014305-156 = "[s] \"Y-You're right! Truly!\""
1014305-157 = "So, let’s blame everything that just happened on the summer valley!"
1014305-159 = "(I fiercely nod my head in agreement!)"
1014305-164 = "..."
1014305-165 = "Hehehee!"
1014305-166 = "What's the matter, Sensei? Making a face like that."
1014305-167 = "Eh? Do I look different from usual to you too?"
1014305-168 = "..."
1014305-169 = "Hehe, this too... must be the fault of the summer valley."
1014305-171 = "（I laughed together with Shun until the awkwardness faded away.）"
1014305-173 = "By the way, Sensei?"
1014305-174 = "About yesterday and today..."
1014305-175 = "Which do you prefer, the young me or the current me?"
1014305-176 = "[ns] \"……！\""
1014305-178 = "[ns] \"B-Both of them are the same Shun to me...!\""
1014305-179 = "No."
1014305-184 = "I won't accept such a typical \"Sensei-style\" answer this time!"
1014305-186 = "（I somehow managed to dodge Shun's persistent questioning and returned #nto our lodging...）"