103050-15 = "Эм... ну... Добро пожаловать в Абидос..."
103050-17 = "Да, спасибо, что приняли нас."
103050-18 = "Когда Корпорация Кайзер атаковала Sanctum Tower, президент сказал..."
103050-21 = "Мы занимаем башню Санктум."
103050-22 = "Зачем? Недавно мы заполучили древнее оружие, а для его... Ах, неважно. Не стану утомлять вас мелкими подробностями."
103050-23 = "Вам достаточно знать одно: теперь Кивотос находится под контролем Корпорация Кайзер. Город академий теперь наш. Не Гематрия, не Генерального студенческого совета. Наш."
103050-26 = "Тогда происходило слишком много всего, чтобы я мог как следует осмыслить смысл его слов, но это замечание показалось мне странным."
103050-27 = "Древнее оружие? Не то, что я ожидал услышать от президента корпорации."
103050-28 = "При обычных обстоятельствах я, скорее всего, не заметил бы связи между Корпорация Кайзер и этим древним оружием."
103050-29 = "Да... Это и правда неожиданно..."
103050-30 = ""
103050-33 = "Хм. Вот как...? Хмм..."
103050-34 = "Хошино?"
103050-35 = ""
103050-37 = ""
103050-39 = ""
103050-40 = "Значит, Кайзер искали это древнее оружие в пустыне."
103050-43 = "Возле места раскопок в Пустыне Абидос"
103050-44 = "Вот почему Кайзер захватила землю в районе Абидос..."
103050-45 = "Я всегда думала, почему она им так нужна... А теперь, когда узнала ответ, даже как-то разочаровывает."
103050-47 = "Какое-то давно потерянное древнее оружие? Что это вообще за фигня? Звучит так тупо!"
103050-48 = "Не думала, что это буквально окажется поиском сокровищ..."
103050-50 = "Хотя, если подумать, для них это логично. Если есть мощное оружие, которое нельзя купить даже за деньги, они сделают что угодно, лишь бы заполучить его."
103050-51 = "Да. Тогда Корпорация Кайзер атаковала Генеральный студсовет только потому, что заполучила древнее оружие."
103050-52 = "Они не подумали... Нет, они не верили, что будут последствия. Они были уверены, что смогут сразиться со всем Кивотос."
103050-53 = "Наверное, поэтому в последнее время активность ЧВК Кайзер, входящих в пустыню и выходящих из неё, так выросла..."
103050-54 = "Значит, Аяне, нам нужно отправиться к месту раскопок ЧВК и забрать это древнее оружие, верно?"
103050-56 = "Да. Но технически пустыня всё ещё принадлежит Кайзер..."
103050-57 = "Понятно... Тогда, видимо, придётся проникнуть туда в стиле Широко."
103050-58 = ""
103050-60 = ""
103050-62 = "Что?!"
103050-63 = ""
103050-66 = ""
103050-68 = "А?! П-Подождите, я не это имела в виду..."
103050-69 = "Нам просто нужно не попасться. Двигаемся быстро."
103050-70 = "Ага! ☆ Нам нужна эта штука-оружие, чтобы поймать Широко!"
103050-71 = ""
103050-74 = ""
