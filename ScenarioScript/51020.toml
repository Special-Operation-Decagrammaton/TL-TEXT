[translation]
51020-1 = "Episódio 2;Um Encontro Inesperado (1)"
51020-4 = "[ns] \"...O clima parece meio diferente do habitual.\""
51020-5 = "(Ao chegar ao distrito autônomo da Academia Aliada Hyakkiyako, avistei lanternas colorindo toda a cidade)"
51020-10 = "Eu mesma vi com os meus próprios olhos!"
51020-15 = "[ns] \"...Hum?\""
51020-21 = "Já disse que não sei de nada, pô."
51020-22 = "Tem alguma prova de que a gente roubou a carteira?"
51020-25 = "Provas... não tenho...#nMas eu realmente...!"
51020-26 = "Deixe para lá, senhorita."
51020-27 = "Você deve estar ocupada com os preparativos do festival. Sinto muito por fazê-la se preocupar."
51020-28 = "O que está perdido, perdido está. Não há o que fazer."
51020-30 = "Olha aí, até o próprio velho disse que tá tudo bem!#nJá podemos ir, né?"
51020-31 = "Já que veio acusar a gente sem motivo, que tal pedir desculpas pelo menos? Haha!"
51020-32 = "Depois de vir encher o nosso saco até aqui, né?"
51020-37 = "M-Mas isso...!!"
51020-42 = "..."
51020-44 = "...Mesmo assim, não posso simplesmente fazer vista grossa!"
51020-45 = "Mesmo que este senhor diga que está tudo bem, os céus estão vendo tudo!"
51020-47 = "Q-Qual é? Tá querendo briga?"
51020-48 = "Pelo visto só vai aprender na porrada!"
51020-52 = "[ns] \"Com licença, está havendo algum problema?\""
51020-56 = "Tsc! Quem é agora?!"
51020-57 = "Se tentar atrapalhar mais ainda—"
51020-61 = "Baixou a guarda!"
51020-67 = "Uah?!"
51020-74 = "...A carteira! Encontrei!"
51020-75 = "Nossa... Então realmente foram aqueles jovens..."
51020-77 = "E-Ei! Por que deixou cair?!"
51020-78 = "Droga... Ei, pessoal! Venham cá!"
51020-86 = "...Ora?"
51020-89 = "Vamos calar a boca de vocês antes que isso vire um escândalo...!"
51020-94 = "Uau?! De onde surgiram todas essas pessoas?!"
51020-100 = "E o senhor seria...?"
51020-101 = "[s] \"Eu te ajudo.\""
51020-104 = "...!"
51020-105 = "Sim!"
