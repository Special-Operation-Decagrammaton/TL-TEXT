[translation]
41110-1 = "Episódio 11;Alerta de Chuva Forte"
41110-2 = "Escritório da Schale"
41110-4 = "Alguns dias depois, uma chuva forte caiu sobre grande parte de Kivotos."
41110-5 = "Que chuva forte..."
41110-6 = "Espero que não tenha havido estragos nos distritos autônomos..."
41110-7 = "Acho que, deixando nas mãos dos conselhos estudantis e comitês de cada academia, vai ficar tudo bem."
41110-8 = "Ah, mas... e as alunas da SRT que estão no parque agora...?"
41110-9 = "Com essa chuva toda, as barracas também..."
41110-10 = "Fico preocupada que elas peguem um resfriado, e além disso..."
41110-16 = "[ns] Ir ver como está o Esquadrão RABBIT."
41110-22 = "Parque Kousagi"
41110-24 = "A lona rasgou aqui também!"
41110-25 = "Miyu! Faltam lonas impermeáveis!"
41110-26 = "N-Não temos mais nenhuma sobressalente...!"
41110-27 = "Droga, se ao menos tivéssemos mais suprimentos..."
41110-28 = "Moe, vem ajudar aqui!"
41110-29 = "É hora de ficar abraçada com esses equipamentos?!"
41110-31 = "Ei, ei, ei, se o equipamento de comunicação alagar, a gente tá ferrada, né?!"
41110-32 = "Você faz ideia de quanto custa tudo isso junto?"
41110-33 = "E eu lá quero saber?! Dá um jeito nisso!!"
41110-37 = "Droga, até quando essa chuva vai durar...?!"
41110-39 = "Assim que reforçarmos a impermeabilização, vamos cuidar da drenagem!"
41110-40 = "Acho que entupiu com lama e terra, a água está transbordando..."
41110-41 = "Se continuar assim, toda a área ao redor corre o risco de alagar!"
41110-42 = "Eu sei! Mas não estou dando conta de reforçar aqui a tempo!"
41110-43 = "Se eu soltar, isso aqui vai desabar na mesma hora—"
41110-49 = "O que foi isso...?"
41110-50 = "U-Um raio caiu no meio do parque...!"
41110-52 = "Droga,"
41110-56 = "A haste da barraca está caindo...!"
41110-65 = "..."
41110-66 = "A-A barraca..."
41110-67 = "A munição toda já era..."
41110-68 = "Os equipamentos de comunicação também..."
41110-69 = "Acabou tudo, então..."
41110-75 = "Não, ainda é cedo para desistir."
41110-76 = "Se dermos um jeito na drenagem e recuperarmos primeiro os equipamentos menos alagados—"
41110-77 = "Não é só sobre os equipamentos!!"
41110-78 = "É tudo, tudo mesmo...! Nós da SRT já estamos...!!"
41110-79 = "Saki-chan..."
41110-80 = "Ah... Se eu soubesse que ia terminar assim, desde o começo..."
41110-82 = "O-O que vocês estão dizendo...?"
41110-83 = "Não combinamos todas juntas lá no início?"
41110-84 = "Enquanto nós não desistirmos, o nome da SRT—"
41110-86 = "Até você já sabia disso, não sabia, Miyako?"
41110-87 = "Que não dá pra continuar com essa idiotice pra sempre."
41110-88 = "Hoje em dia, em vez de manter a ordem pública, passamos os dias procurando comida..."
41110-89 = "Já nem é mais uma questão de justiça ou de prender criminosos."
41110-90 = "Não consigo acreditar que estamos protegendo o nome da SRT nesse estado...!"
41110-91 = "...Eu já nem sei mais o que estou fazendo."
41110-92 = "É mesmo, o que a gente tá fazendo, hein..."
41110-93 = "Tá tudo encharcado, e eu já tô cansada de acampar ao relento..."
41110-94 = "Miyako-chan... vamos desistir logo..."
41110-95 = "..."
41110-101 = "...Miyako, aonde você vai?"
41110-102 = "Você ainda pretende continuar com essa besteira?!"
41110-103 = "...Sim, pretendo."
41110-104 = "Não posso desistir. Pelo bem da SRT."
41110-115 = "(A pressão da água está forte... já nem sinto mais as minhas mãos...)"
41110-116 = "(Talvez isso realmente não tenha sentido...)"
41110-117 = "(Mas eu... a SRT, o ideal em que acredito...)"
41110-119 = "Eu não posso... desistir...!"
41110-127 = "...Sensei?"
41110-128 = "...O que você veio fazer aqui hoje?"
41110-129 = "Como pode ver, não estamos em situação para brincadeiras."
41110-130 = "Se não resolvermos isso agora mesmo, toda a área ao redor vai..."
41110-134 = "[ns] Pegar uma pá e ir até a vala de drenagem."
41110-135 = "Sensei...?"
41110-136 = "Por quê...?"
41110-137 = "[s] \"É só tirar a terra daqui, né?\""
41110-141 = "Sim, por favor."
41110-147 = "Ah... Você não sabe nem usar uma pá direito? Me dá isso aqui."
41110-152 = "...Sério, o que a gente tá fazendo?"
41110-153 = "...Eu vou ajudar."
41110-155 = "Depois disso, trabalhei duro com as integrantes do Esquadrão RABBIT para desobstruir a drenagem."
41110-159 = "...A chuva finalmente parou."
41110-160 = "[s] \"Bom trabalho, pessoal.\""
41110-164 = "..."
41110-165 = "...Por que você está nos ajudando?"
41110-166 = "Eu já disse várias e várias vezes que nada vai mudar."
41110-167 = "Eu realmente não entendo o que você espera de nós, Sensei."
41110-168 = "[s] \"Não espero nada em troca.\""
41110-170 = "[s] \"Porque eu sou o Sensei.\""
41110-174 = "...Entendo."
41110-175 = "Quase todo o nosso equipamento acabou estragando, mas..."
41110-176 = "Pelo menos conseguimos evitar que o parque inteiro alagasse."
41110-185 = "Francamente, eu ainda tenho um monte de coisas pra falar pra Miyako, mas..."
41110-186 = "Sensei, você não queria que a gente parasse de viver neste parque?"
41110-187 = "Não ganha nada com isso e ainda faz uma coisa dessas... Você é um idiota sem jeito mesmo."
41110-188 = "Bom, que ele era idiota eu já sabia desde o começo. Hihihi..."
41110-189 = "M-Moe-chan... o Sensei nos ajudou com tanto esforço..."
41110-194 = "Eu continuei dizendo que não precisávamos de ajuda... mas é fato que você nos salvou."
41110-195 = "...Muito obrigada, Sensei."
41110-197 = "(Depois disso, voltei todo encharcado para a Schale.)"
41110-198 = "(Acabei pegando um resfriado por causa da chuva, mas fico aliviado que tenha dado tudo certo por enquanto...)"
41110-200 = "Próximo;Fatura Encharcada de Chuva"
