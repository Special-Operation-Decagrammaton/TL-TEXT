[translation]
41110-1 = "Эпизод 11;Предупреждение о сильном дожде"
41110-2 = "Офис Шале"
41110-4 = "Несколько дней спустя. Начало сезона дождей в Кивотосе"
41110-5 = "Божечки, ну и ливень там начался! Надеюсь, Кивотос не превратится в одно большое озеро."
41110-6 = "Нам потом ещё долго придётся разгребать последствия этой непогоды."
41110-7 = "Но я уверена, что все академии приняли необходимые меры, чтобы их студенты оставались в безопасности."
41110-8 = "…Хотя я немного беспокоюсь за девочек из Академии SRT, которые живут в парке Коусаги."
41110-9 = "В парке нет нормальных укрытий и даже зданий, где можно было бы спрятаться от дождя."
41110-10 = "Надеюсь, они не простудятся."
41110-11 = ""
41110-13 = ""
41110-16 = "[ns] Срочно проверить отряд RABBIT."
41110-22 = "Парк Коусаги"
41110-24 = "Весь брезент в дырах!"
41110-25 = "Мию! Нам нужен ещё брезент!"
41110-26 = "Э-это был последний... У нас больше ничего не осталось."
41110-27 = "Чёрт! Мы оказались совершенно не готовы к такому шторму."
41110-28 = "Мое! Ты так и будешь трястись над своим металлическим хламом?"
41110-29 = "Ты чокнутая? Выброси его и помоги нам."
41110-31 = "Только через мой труп! Если хоть что-то из моего оборудования связи пострадает, я покажу тебе, что такое настоящее безумие!"
41110-32 = "Оно стоит дороже, чем вся твоя жизнь!"
41110-33 = "А как же наше оружие?! Снаряжение? По-моему, твоё идиотское железо - это последнее, о чём нам стоит сейчас переживать!"
41110-34 = ""
41110-37 = "Если этот ливень не прекратится, то мы вообще всё потеряем."
41110-39 = "Вы закончили с гидроизоляцией? Водосток за пределами парка нужно расчистить. И как можно скорее."
41110-40 = "Ливнёвки забиты грязью и вот-вот переполнятся."
41110-41 = "Мы должны пробить засор до того, как нас окончательно затопит!"
41110-42 = "Я бы с радостью помогла, но у нас тупо не хватает рук!"
41110-43 = "Если мы сейчас отпустим брезент, всё просто унесёт ветром."
41110-44 = ""
41110-49 = "Даже мне такие взрывы не по душе..."
41110-50 = "Это была молния… Она ударила прямо в парке…"
41110-52 = "Опора, удерживающая командную палатку…"
41110-53 = ""
41110-56 = "Она рушится! И-и-ик!"
41110-57 = ""
41110-65 = "..."
41110-66 = "Командная палатка обвалилась…"
41110-67 = "Всё наше снаряжение под водой."
41110-68 = "Оборудование связи уничтожено."
41110-69 = "Вот и всё. Наш конец."
41110-70 = ""
41110-75 = "Всё в порядке. Не сдавайтесь!"
41110-76 = "Нам просто нужно расчистить водосток, и я уверена, что мы сможем восстановить и починить часть снаряжения."
41110-77 = "Да забудь ты про это идиотское снаряжение!"
41110-78 = "Всё кончено, Мияко! Нас… Академии SRT… Всего этого больше нет!"
41110-79 = "С-Саки..."
41110-80 = "Если бы я знала, чем всё это закончится, я бы даже пытаться не стала."
41110-82 = "Ч-что вы такое говорите?"
41110-83 = "Мы ведь все давали клятву в самом начале!"
41110-84 = "Мы поклялись друг другу, что не сдадимся. Что пока мы продолжаем двигаться вперёд шаг за шагом, мы сможем сами нести знамя Академии SRT. Разве не так?"
41110-86 = "Красивые слова и красивые клятвы, Мияко. Только и всего."
41110-87 = "Мы не сможем продолжать нашу игру в притворяшки вечно."
41110-88 = "Как мы вообще до этого докатились? С каких пор нашими обязанностями стали поиск выброшенной еды и кража пустых бочек, чтобы хоть как-то помыться?!"
41110-89 = "Мы же были способны на большее! Раньше мы спорили о тонкостях правосудия и ловили опасных преступников! А теперь… Теперь мы дерёмся за выброшенные бенто с бездомными."
41110-90 = "Ответь мне, Мияко! Это то, к чему ты стремилась? Вот так ты хотела сохранить имя SRT?!"
41110-91 = "…Это совсем не та SRT, которую я знала."
41110-92 = "Все наши пожитки погрузились под воду."
41110-93 = "Жизнь на улице поначалу казалась весёлой. Но она начинает выматывать."
41110-94 = "М-Мияко… Я хочу д-домой."
41110-95 = "..."
41110-96 = ""
41110-101 = "Ты куда, Мияко?"
41110-102 = "После всего этого? Ты столкнулась с катастрофой и всё равно хочешь продолжать?!"
41110-103 = "...Да."
41110-104 = "Я сохраню правосудие АкадемииSRT живой. Я никогда не сдамся."
41110-105 = ""
41110-115 = "(Течение такое сильное… Я уже сбилась со счёта, сколько часов проработала… Я совсем не чувствую ни рук, ни ног…)"
41110-116 = "(Возможно, они были правы. Возможно, я и правда глупая.)"
41110-117 = "(Но… Правосудие, в которое я верила… Школа, которую я так любила…)"
41110-119 = "Нет! Вы меня не сломите!"
41110-120 = ""
41110-121 = ""
41110-124 = ""
41110-125 = ""
41110-127 = "Сенсей?"
41110-128 = "Вы снова пришли, чтобы попытаться нас уговорить?"
41110-129 = "Только не сегодня. У нас нет времени на Ваши глупые шутки."
41110-130 = "Мне всё равно, что Вы хотите сказать. Мне нужно расчистить водосток, иначе нас действительно затопит."
41110-131 = ""
41110-134 = "[ns] Взять лопату и направиться к водостоку."
41110-135 = "Сенсей?"
41110-136 = "Я… Я не понимаю."
41110-137 = "[s] «Значит, нужно просто расчистить отсюда всю эту грязь?»"
41110-138 = ""
41110-140 = ""
41110-141 = "Да, верно."
41110-144 = ""
41110-146 = ""
41110-147 = "…Ты же держишь лопату неправильно. А ну дай сюда."
41110-148 = ""
41110-150 = ""
41110-152 = "…Дурачьё, до самого конца."
41110-153 = "Я… Я тоже хочу помочь."
41110-155 = "Я вместе с отрядом КРОЛИК часами неустанно работал над восстановлением водостока."
41110-159 = "…Дождь наконец-то прекратился."
41110-160 = "[s] «Вы все отлично справились. Замечательная работа.»"
41110-161 = ""
41110-163 = ""
41110-164 = "...Сенсей."
41110-165 = "Почему Вы продолжаете помогать нам?"
41110-166 = "Мы ведь раз за разом повторяли Вам, что нас не переубедить."
41110-167 = "Я всё это время пыталась понять, но так и не смогла. Какую выгоду Вы надеетесь из этого извлечь?"
41110-168 = "[s] «Я ничего не жду взамен.»"
41110-170 = "[s] «Я просто ваш учитель.»"
41110-171 = ""
41110-173 = ""
41110-174 = "...Вот как."
41110-175 = "Большая часть нашего снаряжения промокло и повреждено настолько, что ремонту уже не подлежит."
41110-176 = "Но нам всё же удалось предотвратить полное затопление парка. Спасибо Вам, Сенсей."
41110-177 = ""
41110-179 = ""
41110-183 = ""
41110-185 = "Я… Ну, полагаю, без Мияко мы бы точно не справились…"
41110-186 = "Но Сенсей, разве Вашей главной целью не было увести нас из этого парка?"
41110-187 = "Какой ещё глупый Сенсей станет так усердно помогать нам, чтобы мы смогли остаться здесь?"
41110-188 = "Мы с самого первого взгляда поняли, что Сенсей - безнадёжный дурачок. Хи-хи."
41110-189 = "Т-тебе не следует так говорить о своём Сенсее, Мое…"
41110-190 = ""
41110-192 = ""
41110-194 = "Мы столько раз отвергали Вашу помощь, а Вы всё равно примчались сегодня, как только подумали, что мы можем в Вас нуждаться."
41110-195 = "Спасибо, Сенсей."
41110-197 = "Позже я, промокший до нитки, вернулся к себе в Шале."
41110-198 = "Возможно, сказывался тяжёлый физический труд под проливным дождём, но в итоге следующие несколько дней я пролежал с ознобом и ломотой во всём теле."
41110-200 = "Следующий эпизод;Промокшие от дождя купюры"
