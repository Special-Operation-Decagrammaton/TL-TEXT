[translation]
2006102-1 = "A kind of mannerism."
2006102-3 = "...You could call it a sort of mannerism."
2006102-4 = "Once people get used to repetition, it is only natural that they start craving new stimuli."
2006102-5 = "Perhaps that is easy to understand if you consider how quickly trends change."
2006102-6 = "[s1] \"To summarize what we were talking about....\"\n[s2] \"You mean the club members want to go to the beach?\""
2006102-9 = "Yes. Lately, they seem quite obsessed with sand baths."
2006102-10 = "Places where you can actually do that are limited. If we want to develop the area, we have to go to the beach."
2006102-11 = "I have no objections myself. After all, we have been accumulating quite a bit of know-how on seaside development."
2006102-12 = "Only, well... we have already developed the beach several times, you see."
2006102-13 = "In short, it lacks any sense of novelty."
2006102-14 = "I am the club president, after all. I would like to prepare some new stimulus for them, but..."
2006102-15 = "[s3] \"So you were having trouble preparing for the trip.\"\n[s4] \"You just want to make the club members happy, right?\""
2006102-18 = "...Sensei, you really are good at framing things in terms of youth."
2006102-19 = "Well, I mean it literally. It is a compliment, yes."
2006102-25 = "So, what is Sensei's answer?"
2006102-26 = "[s5] \"Of course, leave it to me!\"\n[s6] \"I came here to help Kasumi, after all!\""
2006102-29 = "Haha! That is a good response."
2006102-30 = "That settles it, let us begin."
2006102-34 = "Over here!"
2006102-40 = "Starting with food, I suppose?"
2006102-41 = "Considering the hassle of transporting it and keeping it fresh, procuring it locally would be best, but...#nMy club members have quite the appetite."
2006102-42 = "If I bought things at tourist-trap prices, my wallet wouldn't survive."
2006102-43 = "First, meat."
2006102-50 = "Hm? Do you think this is too much?"
2006102-51 = "Actually, that is not quite the case."
2006102-52 = "Everyone loves it so much that if there is too little, they will start fighting over it."
2006102-53 = "Considering nutritional balance as well, we should add some vegetables too--"
2006102-57 = "Come to think of it, someone brought up the idea of a hot pot."
2006102-58 = "In that case..."
2006102-62 = "(Walked around looking at various ingredients with Kasumi)"
2006102-66 = "Ah, just in case, let me mention this."
2006102-67 = "I have no plans to buy a swimsuit. I already have one."
2006102-68 = "If you were expecting that, you can give up."
2006102-69 = "[s7] \"Eh...?\"\n[s8] \"What do you take me for...?\""
2006102-72 = "Oh? That reaction is unexpected."
2006102-73 = "There have been plenty of sightings, you know?#nThat Sensei was choosing swimsuits with a student."
2006102-77 = "...Ha-ha-ha-ha-ha!#nWell, no need to worry. I have no intention of digging into it."
2006102-78 = "Shall we continue our shopping?"
2006102-83 = "Insect repellent, bandages, ointment are necessary as well... and then..."
2006102-88 = "...Hm."
2006102-89 = "Hmmmmm."
2006102-90 = "[s9] \"What is wrong?\"\n[s10] \"Are those... sparklers?\""
2006102-93 = "I think it is good as a playful touch, but I am rather out of touch with these sorts of things."
2006102-94 = "These are explosives too, after all, but their power falls short of everyday dynamite.#nThey would be rather dull for demolition use, wouldn't they?"
2006102-95 = "Is there really any point in preparing them...?"
2006102-99 = "...Hm?#nO, oh I see... completely different, you say. You are quite passionate about this."
2006102-100 = "I see... practical utility and entertainment are two different things, huh."
2006102-104 = "I understand. That makes sense."
2006102-105 = "Indeed, the club members would likely be pleased."
2006102-106 = "While we are at it, shall we get some opinions on other things?"
2006102-107 = "First is the swim ring, but--"
2006102-110 = "(Thus, I helped Kasumi with her shopping)"
2006102-121 = "My, asking Sensei for help was the right choice."
2006102-122 = "If I had prepared by myself, it would have been a mundane training camp."
2006102-123 = "That being said, I ended up taking up your time until this late hour. Are you sure you are alright with this?"
2006102-124 = "[s11] \"Don't worry about it.\"\n[s12] \"I had fun.\""
2006102-127 = "There you go again with those sweet words."
2006102-129 = "Hey-hey, you two over there~!"
2006102-138 = "My-my, wearing such nice clothes and all. S-sorta looks like a nice little mood you got there?"
2006102-139 = "Do you even know where you are?"
2006102-140 = "You must have some real nerve hanging around the Black Market at this hour."
2006102-141 = "Now what's that you're holding in both hands~?"
2006102-142 = "We big sisters are a bit low on cash right now. Mind sharing some?"
2006102-147 = "..."
2006102-148 = "............"
2006102-149 = "[s13] \"Kasumi...?\"\n[s14] \"Wait just a --\""
2006102-152 = "Good grief... with instincts like that, you won't survive around here, you know?"
2006102-157 = "Hm...?"
2006102-159 = "I am a person of this town as well."
2006102-160 = "Aren't we companions? How lonely."
2006102-162 = "That is..."
2006102-167 = "..."
2006102-168 = "Tch. Damn it, and I thought they were easy prey."
2006102-169 = "Ah whatever, I'm done. Let's go."
2006102-176 = "Hey now, what's the big idea. You completely ruined my mood!"
2006102-177 = "What a nuisance. Those kinds of people really do exist in the Black Market."
2006102-178 = "Sensei, as an apology for-- hm?"
2006102-179 = "What is it? Dazing off like that."
2006102-180 = "[s15] \"I just thought it was a bit unexpected.\"\n[s16] \"I figured Kasumi would have...\""
2006102-183 = "Kaboom!"
2006102-184 = "...And you thought I would resolve it with a bomb?"
2006102-185 = "To be perceived in such a way... I am almost sad enough to cry.#nDo I not possess common sense and refinement as well?"
2006102-186 = "...Haha, just kidding."
2006102-187 = "I have acted in ways that led to that impression, after all.#nI simply chose an attitude that would be effective when dealing with Sensei."
2006102-191 = "The old me might have done it, but...#nEither way, it is unnecessary now, right?"
2006102-192 = "No matter what happens, Sensei will rush to my aid anyway."
2006102-193 = "As for those small-timers earlier... well, whatever, they will probably forget by tomorrow."
2006102-194 = "It would be a different story if words didn't reach them, but..."
2006102-195 = "It didn't seem to come to that! Ha-ha-ha-ha!"
2006102-201 = "Now then, let us call it a day."
2006102-202 = "Consider this a token of my thanks."
2006102-204 = "(Received the paper bag and returned to Schale)"
