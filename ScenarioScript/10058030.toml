10058030-60 = "Tsk. It's a guided missile too. #nWe'd be screwed without the smoke. Nice one, Akane."
10058030-61 = "But doesn't this mean we can't hit them with our prism cannon either?"
10058030-62 = "That's right, but all we need right now is time."
10058030-63 = "Let's move! Time to see who dares to mess with C&C."
10058030-64 = "The moment I see them, we're blowing them to bits!"
