[translation]
10058030-1 = "Episode 3;Rules of Engagement?"
10058030-2 = "The Gehenna Cup has kicked off with a bang! #nThe opening salvos have already eliminated 50 of the 80 total teams before they#ncould even leave the starting line!"
10058030-3 = "Once again, today's commentary will be brought to you by Motomiya Chiaki,#nTanga Ibuki, aaaand! Schale's Sensei!"
10058030-4 = "[s] \"Hello everyone!\""
10058030-5 = "That tank shot a BIG round that went BOOM!"
10058030-6 = "Indeed! As Ibuki-chan has pointed out, Trinity General School's Remedial Knights, #nthe dark horse of this tournament, is really putting on a spectacle!"
10058030-7 = "But! Whether its the heavy armor or the massive gun, they're beginning to lose#npace!"
10058030-8 = "Remember, this is a race! It's not just about firepower; it's about speed as well!"
10058030-9 = "Being number one in kills doesn't count towards anything! As it stands, they're#ncurrently dead last!"
10058030-10 = "[s] \"Is it fine to go off of the track?\""
10058030-11 = "Of course! The most important rule of this tournament is to \"shoot all the targets and return to the start!\""
10058030-12 = "In other words... There's no problem with driving off the track and shooting#nthe targets in any order!"
10058030-13 = "Heck, you could even destroy the other tanks if you want!"
10058030-14 = "Wow! That's so Gehenna-y! Sounds like fun!"
10058030-15 = "Now let's present some data from the previous tournaments!"
10058030-16 = "The shortest tournament ever recorded, ended in 53 seconds! #nEvery single tank was destroyed at the starting line, so there were no winners!"
10058030-17 = "By contrast, the longest tournament ever recorded was 455 days and 8 hours long! #nBy the time the tournament finally concluded, the viewership was at a staggering 0%!"
10058030-18 = "Huh? By the way, why isn't Makoto-senpai in the tournament?"
10058030-19 = "Makoto-senpai failed the written portion of her driver's license exam, so she can't participate!"
10058030-20 = "Is the driver's license exam that hard?"
10058030-21 = "It seems like it wasn't a matter of the exam being hard. #nMakoto-senpai answered the multiple choice questions with full sentences, #nwriting things like \"Gehenna always moves forward!\" Anyway, she failed."
10058030-22 = "Is that why...? Well I hope she passes next time!"
10058030-23 = "That's Ibuki-chan for you! So nice! #nAnd to all of you out there preparing for your own exams, I hope you get good#nresults!"
10058030-24 = "Now then, we'll return back onto the field! #nLet's take a look at how Millennium Science School's C&C team is faring!"
10058030-25 = "Stay tuned!"
10058030-33 = "Target hit. Manifold normal."
10058030-34 = "Prism sensor stable. Charging complete."
10058030-35 = "Wow! This tank just shot out a beam of light with a BANG!"
10058030-36 = "You shot this thing without even knowing that!? Sheesh, at least read the#nmanual..."
10058030-37 = "Ahahah! But I think it's faster to just give it a spin and find out then!"
10058030-38 = "This isn't the same as switching phones, y'know?"
10058030-39 = "I gotta say though, it's kinda crazy you still managed to hit it anyways."
10058030-40 = "Don't you just center the target and flip the switch?"
10058030-41 = "Hah! What an Asuna thing to do. #nAlways acting on impulse and winning big time..."
10058030-42 = "Leader, should we keep up the pace?"
10058030-43 = "Yeah, whatever! Let's rush through this and get it done!"
10058030-46 = "STOP!!"
10058030-50 = "Enemy missile, 1 o'clock!"
10058030-51 = "Deploying smoke screen!"
10058030-57 = "Fuck is that!? You can use missiles in a tank race!?"
10058030-58 = "Well, there aren't any weapon restrictions in the rules..."
