[translation]
10058030-1 = "Episode 3;Rules of Engagement?"
10058030-2 = "And now, the Gehenna Cup is underway!#nRight from the start, due to the artillery exchange,#nlooks like 50 out of all 80 teams couldn't even start!"
10058030-3 = "Once again, today's commentary will be brought to you by Chiaki Motomiya and Ibuki Tanka! Along with Sensei from Schale!"
10058030-4 = "[s] \"It's Sensei from Schale!\""
10058030-5 = "There was a tank that went boom and shot a giant bullet!"
10058030-6 = "That's right! Just as Ibuki-chan said, this tournament's dark horse,#nTrinity General School's \"Relief Knight Team,\" is making a huge splash!"
10058030-7 = "However, weighed down by their heavy armor and gigantic turret,#nits speed is dropping rapidly!"
10058030-8 = "This is a race, so speed is just as important as strength~!"
10058030-9 = "Getting first place in kills doesn't mean anything, you know! Their current ranking is dead last!"
10058030-10 = "[s] \"Is it okay to leave the circuit?\""
10058030-11 = "Of course it is! The most important rule of this tournament is#n\"Shoot all the targets and make it back to the starting line\"!"
10058030-12 = "In other words... leaving the circuit and firing from any target is totally fine!"
10058030-13 = "In fact, destroying other tanks isn't a problem either!"
10058030-14 = "Whoa~! That's so Gehenna and sounds fun!"
10058030-15 = "Now, let's introduce some past tournament records!"
10058030-16 = "The shortest tournament completion record is 53 seconds!#nAll the tanks were destroyed at the starting line, so there was no winner!"
10058030-17 = "On the other hand, the longest record is 455 days and 8 hours!#nBy the time a winner was decided, the broadcast's viewership rating was 0%!"
10058030-18 = "Huh? Come to think of it, isn't Makoto-senpai entering the tournament?"
10058030-19 = "Makoto-senpai failed the written driver's license test, so she couldn't enter!"
10058030-20 = "Is the driver's test really that hard?"
10058030-21 = "It didn't seem to be a matter of difficulty, though?#nMakoto-senpai apparently said things like, \"Gehenna always moves forward!\"#nand answered in essays while ignoring the bubble sheet, so maybe that's why."
10058030-22 = "Is that so... Hope she passes next time!"
10058030-23 = "As expected, Ibuki-chan is so kind!#nWe pray that everyone facing various exams will get good results!"
10058030-24 = "Now let's return to the broadcast camera!#nLet's check out Millennium Science School's \"C&C Team\"!"
10058030-25 = "Stay tuned!"
10058030-33 = "Target hit. Manifold operating normally."
10058030-34 = "Prism sensor operating stably. Charging complete."
10058030-35 = "Whoa~! This tank shoots a big flash of light!"
10058030-36 = "You were firing without even knowing that?! Good grief, at least read the manual..."
10058030-37 = "Ahaha! I thought trying it out hands-on was the fastest way to learn!"
10058030-38 = "This ain't switching your smartphone carrier, you know."
10058030-39 = "Still, to actually hit something like that. Not bad at all."
10058030-40 = "You just put the target in the center and press the button, right?"
10058030-41 = "Ha! That's so Asuna.#nShe always goes with the flow and somehow pulls it off..."
10058030-42 = "Director, should we keep moving forward?"
10058030-43 = "Yeah! Let's go all out and wrap this up quickly!"
10058030-46 = "Stop!!!"
10058030-50 = "Enemy missile from the 1 o'clock direction!"
10058030-51 = "Deploying smoke screen!"
10058030-57 = "What is that!? Are you allowed to fire missiles in a tank race!?"
10058030-58 = "Well, there are no weapon restrictions in the rules..."
10058030-59 = "And we shot a beam ourselves..."
10058030-60 = "Tch, and a guided missile at that.#nIt would've been bad if we hadn't deployed smoke. Good job, Akane."
10058030-61 = "But won't this block our prism cannon too?"
10058030-62 = "Well, yeah, but buying time is more than enough."
10058030-63 = "Let's move! Who the hell dared to attack C&C?"
10058030-64 = "I'm gonna blow them to smithereens the moment I find them!"
10058030-65 = "For now, let's move while hiding in the smoke..."
10058030-66 = "Ah! Director, that's the sound of a rocket booster!"
10058030-67 = "It's a bluff! No way they can hit anything firing in this smoke!"
10058030-70 = "What!? That's--"
10058030-71 = "It's coming!!"
10058030-74 = "Ugh..."
10058030-75 = "These guys... they're no ordinary opponents..."
10058030-78 = "Yay, a direct hit! C&C is a breeze after all!"
10058030-79 = "I think Neru-senpai is going to be extremely angry..."
10058030-80 = "All's fair in love and war! I've done nothing to be yelled at for!"
10058030-81 = "Yuzu-chan, what was up with that missile's movement just now?"
10058030-82 = "Well, since this was a manually guided type... it just felt right in my hands."
10058030-83 = "I thought maybe it would hook if I traced along the smoke. So I tried it like a fighting game..."
10058030-84 = "As expected of UZQueen! You're invincible as long as you have a joystick!"
10058030-85 = "Momoi. If you're going to rampage, please walk.#nIt's unreasonable to squeeze five people into a three-seater tank."
10058030-86 = "That's terrible! In that case, Kei should be the one to get off!"
10058030-87 = "No. I don't know what would happen if I left Aris in Momoi and the others' hands."
10058030-88 = "Yuzu, that was amazing!"
10058030-89 = "There's a line we must say at a time like this!"
10058030-90 = "D-Did we defeat them!?"
10058030-94 = "Don't say that lineeee!!!"
10058030-97 = "Y... You bastards...!"
10058030-98 = "Game Development Department!! Runt!! Forehead!! Twins!!"
10058030-99 = "Akane!! Full throttle!!!"
10058030-100 = "Beat 'em to a pulp!!!!"
10058030-104 = "I told you not to say that line~!!"
10058030-105 = "Enemy tank is closing in fast!"
10058030-106 = "Yuzu-chan, keep firing away!!"
10058030-107 = "O-Okay!! Fire!!!"
10058030-113 = "If we can't dodge it, I'll just smash it to pieces!!!"
10058030-114 = "Bring it on!!!"
10058030-118 = "Intercepting missiles with a submachine gun!?"
10058030-119 = "What kind of reflexes do you even have?!"
10058030-120 = "I forgot there was a cancel move..."
10058030-121 = "Yuzu, now's the time to change genres from a fighting game to a shooting game!"
10058030-122 = "I don't care what you do, just hurry up!!! They're coming!!!"
10058030-124 = "You bastards, I'm gonna blow you away!!"
10058030-125 = "Lens system operating normally."
10058030-126 = "Charge complete~!"
10058030-127 = "Fire!!"
10058030-132 = "Ugh!!"
10058030-133 = "Intake system damaged! Not responding!"
10058030-134 = "The engine won't start either!! We're done for!!"
10058030-135 = "Yuzu-chan, are you okay?"
10058030-136 = "I-I'm fine, but... the periscope is broken, so seeing outside is a bit...!"
10058030-137 = "What should we do!?"
10058030-138 = "Aris didn't save yesterday because she was having too much fun and couldn't sleep...!"
10058030-139 = "Yuzu-chan, calm down. Look at me. You can definitely do it."
10058030-140 = "But I have to aim while watching the flying missile..."
10058030-141 = "Just remember last week when we played#n\"Top of Fighters\" with Big Sis."
10058030-142 = "Even though I played while massaging my eyes to let Big Sis win...#nwe still won every match."
10058030-143 = "That was totally cheating!!"
10058030-144 = "This time, we'll be Yuzu-chan's eyes."
10058030-145 = "Midori..."
10058030-146 = "...I'll try!"
10058030-150 = "What's the point of shooting a missile straight up into the sky!?"
10058030-154 = "What the heck? Shooting off to some random-ass place."
10058030-155 = "Wasting a precious missile like that..."
10058030-156 = "!!!!!h"
10058030-161 = "It's coming from above?!"
10058030-167 = "We'll defea--"
10058030-170 = "No!!"
10058030-171 = "Just no, seriously!"
10058030-172 = "Urgh! Ughh!"
10058030-173 = "Impressive. To hit the bullseye just by hearing what's outside."
10058030-174 = "Nah, it got shot down right before impact. If we just fire one more..."
10058030-175 = "Eh? We're out of missiles, you know?"
10058030-176 = "Eh?"
10058030-177 = "What do you mean!?"
10058030-178 = "Yuuka said 5 were enough and wouldn't give us any more budget."
10058030-179 = "Aris has seen this before!#nIt's the stage where you get tricked by a fake boss and run out of bombs!"
10058030-180 = "I wish you had told me that a bit sooner..."
10058030-181 = "I thought defeating C&C would be a greater achievement than winning..."
10058030-184 = "True..."
10058030-185 = "Indeed, it's hard to resist going for the kill line..."
10058030-186 = "Why are you agreeing with her!?"
10058030-193 = "Little maid-sama looks super angry..."
10058030-197 = "They made it all the way up onto this tank?!"
10058030-198 = "It's over..."
10058030-204 = "You've got some nerve, Game Development Department."
10058030-205 = "\"Forehead\" was the one who fired, right? Not bad, kid."
10058030-207 = "Neru-senpai!! This is just a sport, after all!"
10058030-211 = "That's right.#nAnd you bastards casually pumping five missiles into us is also a sport."
10058030-212 = "So, this must be a sport too, then!!!"
10058030-221 = "Uwaaaaah!!!"
10058030-223 = "R-Right now?"
10058030-224 = "Right now! Go go!"
10058030-225 = "Now--"
10058030-228 = "Run away while we have the chance!!!"
