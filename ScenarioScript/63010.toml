[translation]
63010-1 = "Эпизод 1;Наша собственная ненависть"
63010-3 = "Должна признать, я удивлена. Не ожидала, что вы доберётесь до самой Porta Pacis."
63010-4 = "[s] «Мой священный долг — возвращать сбежавших студентов»."
63010-5 = "Я? Сбежавшая? Знаете, некоторым может не понравиться такой намёк."
63010-6 = "Наш дом прямо здесь, в Ариусе. Как я могу быть беглянкой, если никуда не уходила из дома?"
63010-7 = "[s] «...Студент отказывается приходить на занятия. Я должен был прийти»."
63010-8 = "...Мы вообще-то изначально не просили вас нас учить."
63010-9 = "[s1] «Кхм. Кто именно такой „ученик“?»\n[s2] «Тот, кто ходит в школу и учится, верно?»"
63010-10 = ""
63010-11 = ""
63010-14 = "[ns] «Нельзя быть студентом и при этом не учиться!»"
63010-15 = "То есть «не учиться» согласно вашим методам и вашему учению, верно?"
63010-16 = "Ариус будет учиться по методам и учению Ариуса."
63010-17 = "Или вы хотите навязать Ариусу образ жизни и обучения Тринити?"
63010-18 = ""
63010-20 = ""
63010-21 = "Ха-ха. У вас такое возмущённое лицо, будто вы хотите сказать: «Я никогда ничего такого не говорил!»"
63010-22 = "Может, именно такими словами и не говорили. Однако..."
63010-23 = "Теперь я почему-то могу понимать такие вещи."
63010-24 = "По крайней мере, я вижу, что происходит внутри Ариуса и вокруг нас."
63010-25 = "...Для начала мне даже не нравится само название «школа-сателлит Ариус»."
63010-26 = "«Сателлит» подразумевает, что мы являемся придатком другой организации."
63010-27 = "Так что устроим небольшой блиц-опрос, Сенсей. Интересно, какой ответ вы дадите."
63010-29 = "Ответьте мне кое на что..."
63010-30 = ""
63010-39 = "...о том дне, когда Тринити впервые за столетия ступила на землю Ариуса..."
63010-40 = "О дне, когда Мисоно Мика, Беатриса и Отряд по прихоти решили изменить свои судьбы."
63010-41 = "Да. Они изменили свои судьбы ценой свободы воли всех остальных студентов Ариуса."
63010-43 = "Почему вы так тщательно заботились о Мисоно Мике и Отряде..."
63010-44 = "...но забыли о студентах Ариуса, которые остались здесь?"
63010-45 = ""
63010-46 = "[ns] «Это...!»"
63010-48 = "Я тут же вспомнил разговор, который состоялся у меня в тот день."
63010-49 = ""
63010-50 = "Мне жаль это говорить, но..."
63010-51 = "Сенсей, мы официально просим вас отойти от вопроса школы-сателлита Ариус..."
63010-52 = "Да, этот вопрос возник из-за действий Тринити, поэтому и ответственность за него должна лежать на Тринити."
63010-53 = "Именно. Нам глубоко стыдно, что вам пришлось убирать за нами."
63010-54 = "Как временный представитель фракции Патер..."
63010-55 = "И как временный представитель фракции Санктус..."
63010-56 = ""
63010-58 = ""
63010-59 = "Мы хотим искренне извиниться."
63010-60 = "Мика по-прежнему официально представляет фракцию Патер, но, разумеется, ей придётся на неопределённое время отойти от должности."
63010-61 = "Как вы прекрасно знаете, её приостановленное разбирательство должно возобновиться."
63010-62 = "Сейя действительно участвовала в недавней операции в Ариусе..."
63010-63 = "...однако она ещё не до конца восстановилась и некоторое время должна отдыхать."
63010-64 = "Учитывая обстоятельства, на данный момент такова общая позиция фракций Патер и Санктус."
63010-65 = "Фракция Филиус Нагисы может придерживаться другого мнения..."
63010-66 = "...но решения Чаепития принимаются большинством голосов."
63010-67 = "Особенно в вопросах, столь важных для академии, ни одна фракция не может просто проигнорировать мнение большинства остальных."
63010-68 = "Поэтому, пожалуйста, Сенсей, доверьтесь нам и позвольте решить наши собственные проблемы."
63010-69 = "Мы просим лишь дать нам ещё немного времени."
63010-70 = "Конечно, вашему присутствию мы были бы рады."
63010-71 = "С вами весь процесс, несомненно, прошёл бы быстрее, эффективнее и справедливее."
63010-72 = "Но как мы, студенты, научимся взрослеть, если всю трудную работу за нас будут выполнять взрослые?"
63010-73 = ""
63010-74 = "Ага. Понятно."
63010-75 = ""
63010-78 = "[ns] «Что?!?!»"
63010-79 = "Ха-ха-ха. Не удивляйтесь так."
63010-80 = "Вы разве не слушали? Я примерно понимаю всё, что происходит в Ариусе."
63010-81 = "Но вы слишком наивны, Сенсей. Или слишком доверчивы? Вы зря доверились верхушке Тринити."
63010-82 = "Временные представители фракций Санктус и Патер."
63010-83 = "Они мгновенно заполнили вакуум, стоило настоящим лидерам потерять возможность исполнять обязанности."
63010-84 = "Вы правда думаете, что при всей бюрократии Тринити они смогли бы провернуть это так быстро без политической поддержки?"
63010-85 = "Как бы они ни отрицали, верхушка Тринити по-прежнему остаётся настоящим змеиным логовом."
63010-86 = ""
63010-87 = "Ладно. Если всё было именно так, ваша ответственность могла быть минимальной — а возможно, её вообще не было."
63010-88 = "Но это ничего не меняет. С того дня Ариус так и не сделал ни шага из нашей гниющей адской ямы."
63010-89 = "[s] «...»"
63010-90 = "Вам следует быть осторожнее, Сенсей. В вашем нынешнем положении, если студент со злым умыслом действительно захочет вас обмануть..."
63010-91 = "...вам будет почти невозможно выбраться из её ловушки."
63010-92 = "Иногда я думаю вот о чём."
63010-93 = "Когда некоторые студенты Ариуса наконец собирали всю храбрость и выходили в мир, а возвращались ещё более сломленными..."
63010-94 = "Когда они нигде не могли найти себе места или больше не выдерживали осуждающих взглядов... Они впадали в отчаяние и говорили, что вернутся к единственной знакомой им жизни..."
63010-95 = "Когда понимали, что во всём мире больше нет места, где студенты Ариуса могли бы быть своими..."
63010-96 = "...Если бы Ариус не изгнали из Тринити, какой жизнью мы могли бы жить?"
63010-97 = "Вы тоже когда-нибудь думаете об этом, Сенсей?"
63010-98 = "Или вы были слишком заняты другими школами, чтобы хотя бы раз вспомнить об Ариусе?"
63010-99 = "[s] «...»"
63010-100 = "...Настоящее — сооружение, возведённое на фундаменте прошлого. Никакого настоящего в отрыве от того, что было раньше, не существует."
63010-101 = "Некоторые говорят, что эта ненависть не наша и не нам её нести."
63010-102 = "Но я с ними не согласна."
63010-103 = "Сегодняшний Ариус всё ещё расплачивается за последствия своего прошлого. Уже одного этого достаточно, чтобы связать нас с Ариусом всеми возможными способами."
63010-105 = "Вы говорите об «учёбе»."
63010-106 = "Что делает человека студентом? Посещение школы и занятия?"
63010-107 = "Оглянитесь вокруг. Вот мой ответ."
63010-109 = "Porta Pacis и всё, что здесь записано, — именно это нам и следует изучать."
63010-110 = "Учиться — обязанность студента, верно? Тогда можете меня поздравить."
63010-111 = "Я пришла сюда исполнить свой долг."
63010-112 = "И если вы попытаетесь сказать, что это не учёба..."
63010-113 = "...я невольно задумаюсь, стал бы настоящий педагог отвергать и запрещать способы обучения лишь потому, что они им «не одобрены»."
63010-115 = "Грехи одного поколения наследует следующее."
63010-116 = "Это не тема для спора. Это простая истина."
63010-117 = ""
63010-118 = "Как можно пользоваться плодами прошлого, одновременно пытаясь отмахнуться от его грехов?"
63010-119 = "Если вы намерены отвергать грехи своего прошлого, тогда должны отвергнуть и всё остальное, что с этим прошлым связано."
63010-120 = "Знания, мудрость, наследие, материальные богатства, все права и власть, которыми вы пользуетесь сегодня..."
63010-121 = "Присваивать всё, что приносит выгоду, и при этом отрицать грехи, совершённые ради получения этих благ..."
63010-122 = "С точки зрения Ариуса это не что иное, как тошнотворное лицемерие."
63010-123 = ""
63010-124 = ""
63010-125 = "Я понимаю, почему вы воздержались от дальнейшего вмешательства в дела Ариуса. Потому что тогда приняли Тринити и её порядки."
63010-126 = "В этом отношении прощать вас не за что. Я не вижу греха в том, что вы сделали."
63010-127 = "Но тогда позвольте Ариусу жить так, как живём мы."
63010-128 = "У Тринити свой путь, а у Ариуса — свой."
63010-129 = "Разве вы не видите, насколько несправедливо принимать один и отвергать другой?"
63010-130 = "[s] «...»"
63010-131 = "Мы сюда не вписываемся."
63010-132 = "Жизнь снаружи может казаться привлекательной, но в том мире для Ариуса нет места."
63010-133 = "Спросите множество студентов Ариуса, которые вернулись, потому что не смогли к нему приспособиться."
63010-134 = "Я приняла их и показала путь вперёд — путь Ариуса."
63010-135 = "Нам не нужны экзамены и ваша учёба. Мы будем жить так, как жили всегда."
63010-136 = "Так что теперь мне от вас нужна всего одна вещь."
63010-137 = "Уйдите из Ариуса. Тихо. И заберите Отряд с собой."
63010-138 = "Только и всего. И я не позволю никому из вас причинить вред."
63010-139 = "Ангелы Откровения..."
63010-140 = "..."
63010-141 = "Просто оставьте их нам. Можете поверить мне на слово."
63010-142 = "По крайней мере, с Ангелами, трубящими в трубы, я справлюсь."
63010-143 = "[s] «„Ангелы, трубящие в трубы“...?»"
63010-144 = "Быстро же вы подхватили это название, да?"
63010-145 = "Вы действительно оправдываете имя Сенсея. Когда дело касается студентов, вы ничего не упускаете."
63010-146 = "Тогда, полагаю, вы также понимаете, что я имела в виду, говоря, что буду жить по пути Ариуса?"
63010-147 = "[s] «...»"
63010-148 = ""
63010-150 = ""
63010-151 = "Хорошо. Выход в эту сторону."
63010-152 = "Отряд, который всё это время маячит у вас за спиной, тоже может выйти этой дорогой."
63010-153 = ""
63010-155 = ""
63010-156 = "И ещё..."
63010-157 = "Пожалуйста. Никогда больше сюда не возвращайтесь."
63010-158 = "Спасибо вам всем за всё до сегодняшнего дня. Прощайте."
63010-159 = ""
63010-161 = ""
63010-162 = "«Путь Ариуса», говоришь?"
63010-163 = ""
63010-165 = ""
63010-166 = "...Саори."
63010-167 = "Тебе ещё есть что сказать? Я выслушаю."
63010-168 = "Если ты собираешься использовать это как предлог вернуться в Ариус, то только создашь проблемы обеим сторонам."
63010-169 = "Последних слов у меня для тебя не осталось. Только вопрос."
63010-170 = "Об этом «пути Ариуса», о котором ты всё время говоришь."
63010-171 = ""
63010-173 = ""
63010-174 = "Что ждёт в его конце?"
63010-175 = "...!"
63010-177 = "Следующий эпизод;Несмотря ни на что"
