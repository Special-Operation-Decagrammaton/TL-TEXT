[translation]
84303200200-5 = ""
84303200200-6 = "Бам-бам-бам! Обнаружен новый персонаж!"
84303200200-7 = ""
84303200200-9 = ""
84303200200-10 = "«Бам-бам-бам»...? «Обнаружен»...?"
84303200200-11 = "...Здравствуйте, я Юризоно Сэя. Вы из Отдела разработки игр?"
84303200200-12 = "Да, я Алиса! Сегодня я работаю проводником и помогаю прибывшим гостям!"
84303200200-13 = "Вот как..."
84303200200-14 = "Сегодня мой квест — помогать всем, кто нуждается! Спрашивайте что угодно!"
84303200200-15 = "Ч-Что угодно..."
84303200200-16 = ""
84303200200-18 = ""
84303200200-19 = ""
84303200200-21 = "(Ничего подозрительного здесь не видно...)"
84303200200-22 = "(Похоже, всё чисто, так что отправлюсь в выставочный зал...)"
84303200200-23 = ""
84303200200-26 = "Хм?!"
84303200200-27 = "(Ч-Что это сейчас было? Такое чувство, будто кто-то за мной наблюдает...)"
84303200200-28 = ""
84303200200-30 = ""
84303200200-31 = ""
84303200200-32 = "(Мне кажется? ...Нет. Я точно это чувствую. Кто-то наблюдает... и настороже.)"
84303200200-33 = "(Но здесь ведь не должно быть никого, кроме Алисы...!)"
84303200200-34 = ""
84303200200-36 = ""
84303200200-37 = "...Алиса, возможно, вопрос грубый, но в комнате есть кто-нибудь ещё?"
84303200200-38 = "А? Что вы имеете в виду? Кто-то кроме меня и вас...?"
84303200200-39 = "Да. Я чувствую на себе... чей-то взгляд."
84303200200-40 = "...Неважно, забудь. Всё хорошо, Алиса. Я сама осмотрюсь."
84303200200-41 = "Я привыкла доверять... таким предчувствиям."
84303200200-42 = "Здесь должен быть..."
84303200200-43 = "Да! Есть! У вас потрясающее шестое чувство, Сэя!"
84303200200-44 = "Конечно. Кроме меня и вас..."
84303200200-45 = ""
84303200200-47 = ""
84303200200-48 = "...Что?"
84303200200-49 = "Кроме меня и вас, в этой комнате есть ещё один член группы! Вы и правда заметили! Потрясающе!"
84303200200-50 = "Смотри, Юзу! Она почувствовала твоё присутствие! Невероятно. Она наблюдательна, прямо как вор!"
84303200200-51 = "Как вор?"
84303200200-52 = ""
84303200200-55 = "Н-Нет! Простите! Она не это имела в виду!"
84303200200-56 = "Она не называет вас настоящей воровкой. Просто так называется класс в игре..."
84303200200-57 = ""
84303200200-62 = ""
84303200200-64 = ""
84303200200-65 = "Т-Ты пряталась в шкафу...?!"
84303200200-66 = "А... З-Здравствуйте... Я Юзу..."
84303200200-67 = "А-Алиса...?! Кто...?"
84303200200-69 = "Это Юзу, президент Отдела разработки игр, а ещё лучший ГМ и лидер группы!!"
84303200200-70 = "Юзу любит личное пространство, поэтому пользуется шкафом в клубной комнате!"
84303200200-71 = "А... П-Понятно... Значит, ты член клуба."
84303200200-72 = "(Со шкафом мне всё ещё не совсем понятно...)"
84303200200-73 = "Вы разве не Юзу искали? Я думала, поэтому вы и пришли. Вы реагируете не так, как я ожидала."
84303200200-74 = "А, я просто пришла посмотреть игры, которые Отдел разработки игр представил на Экспо..."
84303200200-75 = "А! Понятно. Тогда вы пришли не туда! Вам нужно в выставочный зал!"
84303200200-76 = "Сюда. Я буду вашим информатором. Следуйте за мной!!"
84303200200-77 = "Эм, хорошо. А что насчёт Юзу...?"
84303200200-79 = "Ик! М-Меня? Я-я в порядке..."
84303200200-80 = "Юзу сегодня командир, поэтому на передовую не идёт. Вместо этого она отправила Момои, Мидори и меня!"
84303200200-81 = "...И Сэю!"
84303200200-82 = "А... Понятно. Тогда веди."
84303200200-83 = "...Прошу прощения за вторжение, Юзу."
84303200200-84 = "Н-Нет. Я рада, что мы познакомились..."
84303200200-85 = "А теперь появился новый квест!! Вперёд!!"
