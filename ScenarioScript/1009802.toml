1009802-286 = ""
1009802-288 = ""
1009802-289 = ""
1009802-291 = ""
1009802-295 = ""
1009802-296 = "О-Она по нам стреляет?!"
1009802-297 = "Давайте, ребята! Разберёмся с этой нахалкой!"
1009802-298 = ""
1009802-301 = ""
1009802-303 = "Хех."
1009802-304 = ""
1009802-306 = ""
1009802-308 = "А у тебя характер есть, да?"
1009802-309 = ""
1009802-320 = "Хех."
