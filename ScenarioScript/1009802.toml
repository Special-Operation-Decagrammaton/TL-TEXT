1009802-322 = ""
1009802-324 = ""
1009802-326 = ""
1009802-329 = "Ты одна всех уложила?!"
1009802-330 = "Ц! В-В следующий раз мы тебя достанем!"
1009802-331 = ""
1009802-333 = ""
1009802-336 = "Какое клише. Хотя обычным шпане вроде них как раз подходит."
1009802-337 = "Вы в порядке, Сенсей? Случайная пуля не задела?"
1009802-338 = "[s] «Хошино...»"
1009802-339 = "А? Что это за взгляд?"
1009802-340 = "Я что-то сделала не так...?"
