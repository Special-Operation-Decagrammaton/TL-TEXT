[translation]
1009802-1 = "Рождение героя"
1009802-8 = "По просьбе Хошино я отправился в Абидос."
1009802-9 = ""
1009802-11 = ""
1009802-12 = ""
1009802-13 = "Уф... Значит, этот столбец — прогнозное значение... а этот — целевое?"
1009802-14 = "У меня уже голова болит."
1009802-15 = "[s1] «Ты... занимаешься бумажной работой? Ты?»\n[s2] «Вот это новость.»"
1009802-16 = ""
1009802-17 = ""
1009802-19 = ""
1009802-20 = "А! Сенсей!"
1009802-21 = "Вы и правда быстро пришли. Спасибо."
1009802-22 = "Вы так поспешили сюда! Я тронута!"
1009802-23 = "[s] «Ну, ты сказала, что у тебя проблемы.»"
1009802-24 = "Хе-хе. Я заставила вас волноваться, да? Простите, простите."
1009802-25 = "Так вот, эта самая «проблема» —"
1009802-26 = "[s] «Бумажная работа?»"
1009802-27 = ""
1009802-29 = ""
1009802-30 = "А? Как вы узнали?"
1009802-31 = "...Услышали, как я ворчу, и сложили два и два?"
1009802-32 = "Неужели я настолько выглядела измученной?"
1009802-33 = "Ну, вы меня раскусили. Вы не хуже меня знаете, сколько всего здесь случилось в последнее время."
1009802-34 = "Мы вроде бы со всем разобрались, но из-за этого куча других дел осталась без внимания."
1009802-35 = "Будто я весь семестр откладывала домашку на потом..."
1009802-36 = "[s] «Совсем одна? А где остальные?»"
1009802-37 = "А. Насчёт этого."
1009802-38 = "Эм. Хе-хе. Я вроде как сама вызвалась."
1009802-39 = "Если подумать, именно из-за меня вообще образовалась эта куча дел."
1009802-40 = "И я многим обязана ребятам."
1009802-42 = "«Как ваша старшая, я сделаю это ради вас!» — уверенно заявила я!"
1009802-43 = "Я уже делала такое раньше. Насколько это вообще может быть сложно?"
1009802-44 = "Но..."
1009802-45 = "[s] «Но этого слишком много?»"
1009802-46 = "Хех."
1009802-47 = "После такой бравады я уже не могу приползти обратно и просить их о помощи."
1009802-48 = "Но я начинаю понимать, что вовремя всё это не закончу. По крайней мере, в одиночку."
1009802-49 = "Мне больше не к кому обратиться, Сенсей."
1009802-50 = "Не могли бы вы, ну пожалуйста-препожалуйста, помочь мне? Только в этот раз? Обещаю, я вам отплачу."
1009802-51 = "[s] «Хм... Ладно. Бумажная работа всё равно моя сильная сторона.»"
1009802-52 = "Серьёзно?"
1009802-53 = "Ура! Я знала, что могу на вас рассчитывать, Сенсей!"
1009802-55 = "[ns] «А насчёт того, как ты мне отплатишь...»"
1009802-56 = ""
1009802-58 = ""
1009802-59 = "[ns] «Не думай, что я забуду.»"
1009802-60 = "Э-Это страшное выражение лица, Сенсей. Только в разумных пределах, ладно?!"
1009802-61 = "...От ваших заверений мне почему-то ещё страшнее..."
1009802-62 = "Но... сама я всё это точно не закончу..."
1009802-63 = ""
1009802-65 = ""
1009802-66 = "Угх! Меня загнали в угол! Ладно, ладно!"
1009802-67 = "[s] «С чего мне начать?»"
1009802-68 = ""
1009802-70 = ""
1009802-71 = "Нужно как можно скорее закончить бюджетный отчёт!"
1009802-72 = "Погодите, погодите. Нет, вообще-то раньше всего сдавать отчёт о состоянии оборудования..."
1009802-79 = "Я довольно долго помогал Хошино с бумажной работой."
1009802-85 = "[ns] «Вот. Всё готово.»"
1009802-86 = "..."
1009802-87 = "Вы потрясающий, Сенсей!"
1009802-88 = "В одиночку у меня на это ушло бы целых три дня!"
1009802-89 = "Попросить вас о помощи точно было правильным решением!"
1009802-90 = "[s] «Бумажная работа — моя жизнь.»"
1009802-91 = "Понятно, понятно. Сила взрослых!"
1009802-92 = "Фух, гора с плеч. Спасибо вам, Сенсей. И перед младшими я теперь не опозорюсь."
1009802-93 = "Спасибо, Сенсей."
1009802-94 = "[s] «Не за что.»"
1009802-95 = ""
1009802-97 = ""
1009802-98 = "[ns] «В конце концов, у всего есть цена.»"
1009802-99 = ""
1009802-101 = ""
1009802-102 = "Ува-а-а. А, точно."
1009802-103 = "Полагаю, долги надо возвращать, так что..."
1009802-104 = "Какова ваша цена?"
1009802-105 = "Только ничего слишком постыдного. Ладно?"
1009802-106 = ""
1009802-110 = "[ns3] «Тогда надень спортивную форму!»\n[ns4] «Тогда надень школьный купальник!»"
1009802-113 = "Агх?!"
1009802-114 = "Сенсей..."
1009802-115 = "Вы правда хотите увидеть меня в этом? Серьёзно?"
1009802-116 = "[s] «Думаю, ты будешь просто очаровательной!»"
1009802-117 = "О-Очаровательной? Как вы вообще можете говорить такое с невозмутимым лицом?"
1009802-118 = "В любом случае! Отказано!"
1009802-119 = "...Почему? Это слишком стыдно, Сенсей!"
1009802-120 = "А если нас кто-нибудь увидит? Пока я одета... вот так?!"
1009802-121 = "Они ещё скажут: «Ого. А вкус у тебя хороший.»"
1009802-122 = "Или: «Ого! Хошино, ты такая милая! ☆»"
1009802-123 = "И начнут говорить всякие другие неловкие вещи!"
1009802-124 = "[s] «Но... ты же обещала...»"
1009802-125 = ""
1009802-127 = ""
1009802-128 = "Не смотри так разочарованно! Разве нет чего-нибудь ещё, чего ты хочешь?"
1009802-129 = "Просто... что-нибудь чуть менее стыдное... пожалуйста!"
1009802-130 = "[s] «Тогда... как насчёт твоей боевой формы?»"
1009802-131 = "Хм?"
1009802-132 = "Боевой формы? Той, которую я носила, когда..."
1009802-133 = "Ну, перед тем как убрать, я её всё-таки почистила."
1009802-134 = ""
1009802-138 = "[ns] «Вот её я и хочу! Пожалуйста!»"
1009802-139 = "Ого... Какая настойчивость..."
1009802-140 = "Хотя с этой формой связано много непростых воспоминаний..."
1009802-141 = "[s] «НУ ПОЖА-А-АЛУЙСТА!»"
1009802-142 = ""
1009802-144 = ""
1009802-145 = ""
1009802-146 = "У-Угх! Серьёзно...?"
1009802-147 = "Ладно, это всё-таки лучше, чем спортивный костюм или купальник..."
1009802-148 = ""
1009802-150 = ""
1009802-151 = ""
1009802-160 = ""
1009802-161 = "Хех."
1009802-162 = "Не думала, что когда-нибудь снова это надену..."
1009802-163 = "Вам правда нравится эта форма, Сенсей?"
1009802-164 = "[ns] «Она лучшая! Ты выглядишь невероятно круто!»"
1009802-165 = "П-Правда?"
1009802-166 = "Хм... Всё равно довольно неловко..."
1009802-167 = "Ну, если вас это радует, думаю, я смогу потерпеть."
1009802-168 = "[s] «Да! Потерпи всего одну неделю!»"
1009802-169 = ""
1009802-171 = ""
1009802-172 = "Н-Неделю?!"
1009802-173 = "Я думала скорее об одном дне... Неделя — это слишком долго."
1009802-174 = "[s] «Я хочу наслаждаться Крутой Хошино вечно!»"
1009802-175 = "Выглядеть круто — это вообще не моё..."
1009802-176 = "[s] «Ты лучшая, Хошино!»"
1009802-177 = "Вы правда думаете, что сможете уговорить меня лестью?"
1009802-178 = "[s] «Видеть Крутую Хошино каждый день — это исполнение мечты!»"
1009802-179 = "Угх..."
1009802-180 = ""
1009802-182 = ""
1009802-183 = ""
1009802-184 = "Поняла, поняла! Ладно! Боже!"
1009802-185 = "Только одну неделю, хорошо?"
1009802-186 = "Боже... У вас лицо, будто вы в лотерею выиграли. Хватит меня смущать!"
1009802-187 = "Иногда я вас вообще не понимаю, Сенсей."
1009802-188 = ""
1009802-193 = ""
1009802-194 = "[ns] «Что это за звук?»"
1009802-195 = "...Это сигнал школьной системы безопасности."
1009802-196 = "Она предупреждает нас о любых нарушителях или чрезвычайных ситуациях."
1009802-197 = ""
1009802-199 = ""
1009802-200 = ""
1009802-201 = "...Банда Шлемов?"
1009802-202 = "Похоже, они у края поля, возле большой доски объявлений. Что они там делают?"
1009802-203 = "Что ж, не будем ждать, пока узнаем."
1009802-204 = ""
1009802-206 = ""
1009802-207 = "Пойдём, Сенсей."
1009802-208 = ""
1009802-210 = ""
1009802-216 = "Ты уверена, что у нас не будет проблем из-за этого?"
1009802-217 = "Хватит переживать! Зачем этой развалюхе-школе вообще доска объявлений?"
1009802-218 = "Кому какое дело, если мы её продадим? Им она всё равно НЕ нужна!"
1009802-219 = "Наверное, ты права... Я точно никогда не видел, чтобы ей пользовались."
1009802-220 = "Эй, она даже не сдвинулась! Поднажми и выкопай её оттуда!"
1009802-222 = ""
1009802-223 = "Есть, госпожа!"
1009802-224 = ""
1009802-226 = ""
1009802-231 = ""
1009802-232 = ""
1009802-234 = "Чем это вы тут занимаетесь?"
1009802-235 = ""
1009802-237 = ""
1009802-238 = "Разве не очевидно?! Мы крадём доску объявлений, чтобы сдать её на металлолом—"
1009802-239 = ""
1009802-241 = ""
1009802-245 = ""
1009802-246 = "А?!"
1009802-247 = ""
1009802-249 = ""
1009802-251 = ""
1009802-252 = "Так-так. Может, опустите лопаты?"
1009802-254 = "А? Ты кто такая? Студент этой школы?"
1009802-255 = "А что за снаряжение? На войну собралась?"
1009802-257 = "Есть вполне разумное объяснение тому, почему я так одета..."
1009802-258 = "В любом случае! Эта доска объявлений — собственность школы, так что я очень вежливо предлагаю вам оставить её и уйти."
1009802-259 = "Да не будь занудой. Всё равно вы ей не пользуетесь. На этом этапе это практически мусор."
1009802-260 = "Да ладно. Считай это благотворительным пожертвованием."
1009802-261 = ""
1009802-263 = ""
1009802-264 = "..."
1009802-265 = "Хех. Хех."
1009802-266 = "Я похожа на щедрого человека?"
1009802-267 = "Может, мы ей и не пользуемся, но она всё ещё принадлежит школе."
1009802-268 = "Так что оставьте её в покое, или я заставлю вас это сделать. Выбирайте."
1009802-269 = ""
