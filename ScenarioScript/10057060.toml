[translation]
10057060-1 = "Episode 6;What is Everyone's is Everyone's"
10057060-7 = "Ugh... I feel like this is my first time coming to the central area of Red Winter since receiving my disciplinary punishment..."
10057060-8 = "What are you so scared for? At a time like this, you just gotta stand tall and bold!"
10057060-9 = "Walking down the mountain was tough enough. My feet hurt."
10057060-10 = "Hang in there a little longer! I will let you ride on the cart along the way!"
10057060-15 = "Hiiin... We came all this way, but the Znamya Cafe is closed because it is nighttime..."
10057060-16 = "...More importantly, Sensei, is it really okay for you to be with us?"
10057060-17 = "[s] \"Someone needs to be in charge, right?\""
10057060-19 = "[ns] \"You are going to return them when you are done, right...?\""
10057060-24 = "O-Of course! We are not a band of thieves!"
10057060-25 = "We are just moving things around a little within Red Winter."
10057060-26 = "Let us decide on everyone's assignments."
10057060-27 = "The copper used for the electrical wires..."
10057060-28 = "I will do it."
10057060-29 = "Lana, you will do it?"
10057060-30 = "Yeah. There is something nearby that I had my eye on."
10057060-31 = "Al-right! I am counting on you!"
10057060-32 = "Lana. What are you supposed to do if someone suspects you?"
10057060-33 = "Cry pathetically so I look pitiful."
10057060-34 = "That is right. And what if you still get arrested?"
10057060-35 = "#nList every single person's name outside of District 183 that I can think of, throwing all of Red Winter into chaos and paralyzing the administrative organization."
10057060-36 = "As expected, Lana is the smartest one among us!"
10057060-37 = "Yeah."
10057060-39 = "Elina, how are you going to get the titanium?"
10057060-40 = "There is a way... but it is hard to get it all at once, so let us look around together."
10057060-41 = "Then District 183 Special Class, operation start!"
10057060-43 = "Oh!"
10057060-51 = "Copper... If I cut the wires, everyone will be in trouble. They got mad at me for causing trouble for people."
10057060-52 = "But there are plenty of bronze statues in the plaza... So borrowing just one should be fine, right?"
10057060-56 = "Little Madame, I will be borrowing your left ear for a moment."
10057060-57 = "Filing off too much will stand out, so just enough to use for the wires."
10057060-61 = "Hmm. It is looking a bit uneven."
10057060-62 = "Asymmetry is no good."
10057060-63 = "I will file the right side as well to balance it out."
10057060-69 = "Hmm..."
10057060-70 = "The left and right balance is fine, but now the face looks too big."
10057060-71 = "Madame, I will make you look cute."
10057060-83 = "Why are you scraping paint off the wall? It is already dry!"
10057060-84 = "Procuring materials! We gotta cram in as much as possible."
10057060-89 = "Slip! Ugh, we just got here and I feel like I am catching a cold..."
10057060-90 = "Elina, you are a Red Winter student, yet you are bad with the cold?"
10057060-91 = "S-Shut up! #nSniff. I was fine lately... #nIt is totally absurd that I cannot even make cold medicine because we ran out of methylamine!"
10057060-92 = "Just going outside is a nightmare! Sniffle, ugh!!"
10057060-97 = "Shh, be quiet!! This is a nighttime restricted area, so if we get caught, we are done for!"
10057060-98 = "I-It is not like I can control a runny nose! You cannot fight the autonomic nervous system!"
10057060-99 = "Ugh... Cough cough, hack..."
10057060-100 = "Why did you bother coming all the way to the Office? #nThere are plenty of other places with paint on them."
10057060-101 = "Maybe because \"borrowing\" it from here removes the guilt?"
10057060-102 = "Besides, the Office uses the absolute most expensive paint! #nOther cheap paints have too much chalk and won't work!"
10057060-103 = "If President Cherino ever finds out, we will be stuck in District 183 forever..."
10057060-111 = "Sniffle... What is it?"
10057060-112 = "Shhhhh!!!"
10057060-113 = "I heard a sound on the other side of the hallway. Sounds like they are on patrol! We need to be quiet!"
10057060-127 = "I-It is Marina, the Public Peace Bureau Director!?"
10057060-128 = "If she finds us, we are totally done for! Ugh..."
10057060-132 = "H-Hack. Cough cough!"
10057060-140 = "Is something the matter, Director Marina?"
10057060-141 = "I sensed a human presence over this way."
10057060-142 = "Hmm..."
10057060-144 = "(Shh! Shhhhh!!!)"
10057060-145 = "(Hey! I can't breathe!?) "
10057060-146 = "(If you cough here, we'll get caught! Just hold it in!!) "
10057060-147 = "Ugh...! Ugh...!"
10057060-153 = "Night patrols always feel a bit unnerving."
10057060-154 = "Even if it is just a routine night security check, it has been a while, so my instincts must be rusty."
10057060-155 = "Once I finish patrolling the next floor, I should take a break."
10057060-166 = "Phew... Ha..."
10057060-167 = "A-Are you okay? Have you calmed down a bit?"
10057060-168 = "Holding back a cough is tough, you did your best--"
10057060-173 = "Ahtchoooo!!!!!"
10057060-179 = "Intruder!! Catch them!!!"
10057060-181 = "Hey!? That got right in my eyes!?"
10057060-182 = "Hiiiin!! It is impossible to stop coughing or sneezing~!!!"
10057060-187 = "Do not let them get away!!!"
10057060-192 = "Gwaaaaaah!!!"
