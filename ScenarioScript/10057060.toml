[translation]
10057060-1 = "Episode 6;What's Everyone's is Everyone's"
10057060-7 = "Ugh... I feel like this is my first time coming to the center of Red Winter since I got put on disciplinary probation..."
10057060-8 = "Why are you so scared? In times like this, you just have to stand tall and act confident!"
10057060-9 = "Just coming down the mountain was hard enough. My feet hurt."
10057060-10 = "Hang in there a little longer! I'll let you ride in the cart on the way!"
10057060-15 = "Waaah... We came all this way, but the Znamya Cafe is closed because it's night..."
10057060-16 = "...More importantly, is it really okay for Sensei to be with us?"
10057060-17 = "[s] \"You need someone in charge, right?\""
10057060-19 = "[ns] \"You're going to return it after you use it, right...?\""
10057060-24 = "O-Of course! We aren't a gang of thieves!"
10057060-25 = "We're just moving around a little within Red Winter."
10057060-26 = "Alright, let's decide on everyone's roles."
10057060-27 = "As for the copper for the wires..."
10057060-28 = "I'll do it."
10057060-29 = "You'll do it, Rana?"
10057060-30 = "Yeah. There's something nearby I've had my eye on."
10057060-31 = "Alright! Leave it to you!"
10057060-32 = "Rana. If someone gets suspicious, what are you supposed to do again?"
10057060-33 = "Cry cutely so I look pitiful."
10057060-34 = "Exactly. And if they arrest you anyway, what then?"
10057060-35 = "I'll list every name I can think of that isn't from Class 183, throw the whole Red Winter organization into chaos, and paralyze the administration."
10057060-36 = "I knew it, Rana is the smartest one among us!"
10057060-37 = "Yeah."
10057060-39 = "Erina, how are you going to get the titanium?"
10057060-40 = "I have a way... but it's hard to get it all at once, so let's look for it while we walk around together."
10057060-41 = "Alright then, Class 183, operation start!"
10057060-43 = "Yeah!"
10057060-51 = "Copper... If I cut the wires, everyone will be in trouble. I was scolded and told that making people suffer is bad."
10057060-52 = "But there are lots of bronze statues in the plaza... so it should be fine to borrow just one, right?"
10057060-56 = "Little President, I'll be borrowing your left ear for a moment."
10057060-57 = "If I scrape off too much, it'll be noticeable, so just enough for the wires."
10057060-61 = "Hmm. It's a bit uneven."
10057060-62 = "Asymmetry is no good."
10057060-63 = "I'll scrape the right side too to balance it out."
10057060-69 = "Hmm..."
10057060-70 = "The left and right are balanced now, but now the face looks too big."
10057060-71 = "President, I'll make you look cute."
10057060-83 = "Why are you scraping paint off the wall? It's already dry, isn't it?"
10057060-84 = "Procuring materials! I have to pack a ton of it."
10057060-89 = "Sniff! Ugh, I just got here and I feel like I'm catching a cold..."
10057060-90 = "Erina, you're a Red Winter student, but you're weak to the cold, aren't you?"
10057060-91 = "Sh-shut up! *Sniffle*. I was fine lately... It's unbelievable that I can't even make cold medicine because I'm out of methylamine!"
10057060-92 = "Just going outside is a struggle! *Sniffle*, hmph!!"
10057060-97 = "Shh, be quiet!! This is a restricted area at night, if we get caught, we're finished!"
10057060-98 = "I-I can't control my runny nose! You can't fight the autonomic nervous system!"
10057060-99 = "Ugh... *Cough, cough*..."
10057060-100 = "Why did you go all the way to the administrative office? There are plenty of other places with paint."
10057060-101 = "Maybe because if we 'borrow' it here, we don't feel guilty?"
10057060-102 = "Besides, the administrative office uses the most expensive paint! The other cheap stuff has too much lime in it, it's useless!"
10057060-103 = "If President Cherino finds out, we'll be in Class 183 forever..."
10057060-111 = "*Sniffle*... What's wrong?"
10057060-112 = "SHHHHHHH!!!"
10057060-113 = "I heard a sound on the other side of the hallway. It sounds like a patrol! We have to be quiet!"
10057060-127 = "I-Is that Security Commissioner Marina!?"
10057060-128 = "I-If we get caught, we're done for! Ugh..."
10057060-132 = "C-Cough. *Cough, cough!*"
10057060-140 = "Is something the matter, Commissioner Marina?"
10057060-141 = "I sensed someone over there."
10057060-142 = "Hmm..."
10057060-144 = "(Shh! Shhhhhh!!!)"
10057060-145 = "(Hey! I can't breathe!?)"
10057060-146 = "(If you cough here, we'll get caught! Hold it in!!)"
10057060-147 = "Ugh...! Ugh...!"
10057060-153 = "Night patrols always feel a bit lonely."
10057060-154 = "Even though it's just a routine night security check, it's been a while, so I feel a bit rusty."
10057060-155 = "Once I finish patrolling the next floor, I'll take a break."
10057060-166 = "Phew... hah..."
10057060-167 = "A-Are you okay? Have you calmed down a bit?"
10057060-168 = "It's hard to hold back a cough, you did your best—"
10057060-173 = "ACHOO!!!!!"
10057060-179 = "Intruders!! Catch them!!!"
10057060-181 = "Hey!? That got in my eyes!?"
10057060-182 = "Waaaaah!! I can't stop coughing or sneezing!!!"
10057060-187 = "Don't let them get away!!!"
10057060-192 = "WAAAAAAH!!!"