[translation]
1009203-1 = "Совет по дизайну?"
1009203-4 = "Получив сообщение от Ёшими, я пришёл встретиться с ней в кафе."
1009203-5 = ""
1009203-9 = "А, Сенсей. Я здесь, сюда!"
1009203-10 = ""
1009203-13 = ""
1009203-15 = "Я нашёл Ёшими в углу заведения; на её столе лежали обрывки бумаги и целая гора десертов."
1009203-16 = ""
1009203-18 = ""
1009203-23 = "Вы быстро добрались, да?"
1009203-24 = "Сегодня совсем больше нечем заняться, что ли?"
1009203-25 = ""
1009203-27 = ""
1009203-28 = "...О, правда нечем?"
1009203-29 = "Погодите. А почему вы так быстро ответили?"
1009203-30 = ""
1009203-32 = ""
1009203-33 = "Ну ладно, неважно."
1009203-34 = "С этим дизайном сложно. И в одиночку я могу сделать далеко не всё."
1009203-35 = "Вот я и подумала: «Эй, может, Сенсей поможет.» Вы же не против?"
1009203-36 = ""
1009203-39 = "[ns1] «Я не особо разбираюсь во всяких дизайнерских значках, но...»\n[ns2] «Ты рисуешь эмблему группы?»"
1009203-40 = "А?"
1009203-41 = "«Всякие значки»?"
1009203-42 = "...Эмблему?"
1009203-43 = "...Какую эмблему?"
1009203-44 = "Хм?"
1009203-45 = "Я разве говорила, что работаю над ЛОГОТИПОМ?"
1009203-46 = "Разве я не сказала, что займусь этим позже?"
1009203-47 = ""
1009203-50 = "[ns3] «То есть это не значок группы?»\n[ns4] «Тогда над чем ты работаешь?»"
1009203-51 = ""
1009203-52 = ""
1009203-54 = ""
1009203-55 = "Эм..."
1009203-56 = "Ну, понимаете, это..."
1009203-57 = ""
1009203-59 = ""
1009203-60 = ""
1009203-61 = "[ns] «...»"
1009203-62 = ""
1009203-64 = ""
1009203-65 = "Хм?"
1009203-66 = "[ns5] «Что-то связанное с дизайном?»\n[ns6] «Ты работаешь над своим автографом?»"
1009203-69 = "А? Что за лицо? Есть проблема?"
1009203-70 = "...Что?"
1009203-71 = "Вы серьёзно спрашиваете, ЗАЧЕМ я тренирую автограф?"
1009203-72 = "Ну, это же очевидно. Я ведь не ошибаюсь, да?"
1009203-73 = ""
1009203-75 = ""
1009203-76 = "Послушайте, Сенсей. Мы начинаем группу, верно?"
1009203-77 = "Мы будем открывать праздничный концерт, верно? Значит, на нас будет смотреть куча людей, верно?"
1009203-78 = "Если концерт пройдёт хорошо, мы станем знаменитыми, верно?"
1009203-79 = "И будет ужасно, если я не смогу раздавать автографы, разве нет? Я что, не права?"
1009203-80 = ""
1009203-83 = "Я... Я ведь правда не ошибаюсь, да?"
1009203-84 = "...Да ведь...?"
1009203-85 = "[s7] «Ну, большие мечты — это всегда хорошо, но...»\n[s8] «Давай не будем забегать вперёд.»"
1009203-88 = "Э-Эм...? Вы правда...?"
1009203-89 = ""
1009203-91 = ""
1009203-92 = "Погодите, стоп. А..."
1009203-93 = "Э-Эм... У меня лицо вдруг стало ужасно горячим..."
1009203-94 = "...О, я краснею. Да что...?"
1009203-95 = ""
1009203-97 = ""
1009203-98 = "...Погодите, Сенсей."
1009203-99 = "Ничего не говорите. Просто молчите. Не надо. Не открывайте рот."
1009203-100 = "[s9] «Ха-ха. Это тот самый момент?»\n[s10] «Остальные знают, что ты такая?»"
1009203-103 = "Я сказала не открывать рот!! Замолчите!!"
1009203-104 = "Гр-р, серьёзно!!"
1009203-105 = ""
1009203-107 = ""
1009203-108 = "Стоп, эм... *вздох*..."
1009203-109 = ""
1009203-113 = "[ns] Рассмеяться."
1009203-114 = ""
1009203-116 = ""
1009203-118 = "Хватит смеяться!! Я сказала молчать!! Тихо!!"
1009203-120 = ""
1009203-121 = "Эм... Ммм..."
1009203-122 = "[s11] «Не нужно это скрывать. Было мило.»\n[s12] «Я пошутил. Может, ты и правда проснёшься знаменитой.»"
1009203-125 = "Пф, НУ КОНЕЧНО вы это серьёзно! Пф-ф!"
1009203-126 = "Я всю жизнь всё слишком много обдумываю. Да."
1009203-127 = "Вы-то должны это знать! Вы каждый день это видите! Вся моя жизнь — сплошные выдумки! Я никак не могу выбраться из собственной головы—"
1009203-128 = ""
1009203-130 = ""
1009203-131 = "А? Что вы сказали?"
1009203-132 = "Вы хотите..."
1009203-133 = "...автограф?"
1009203-134 = "...А? Вы что, драки ищете?"
1009203-135 = "[s13] «Ловлю момент.»\n[s14] «В будущем твой автограф может стать редкостью.»"
1009203-138 = "П-Пф, опять вы за своё..."
1009203-139 = "Хватит меня дразнить..."
1009203-140 = "Хотя слова вы и правда подбирать умеете. Думали, мне от этого станет легче?"
1009203-141 = ""
1009203-143 = ""
1009203-144 = "...Потому что немного стало."
1009203-145 = ""
1009203-147 = ""
1009203-148 = "Угххх!! Как же бесит!!"
1009203-149 = "Почему мне стало легче?! Что со мной не так?!"
1009203-150 = "*вздох*. Ладно. Я знаю, что против вас у меня шансов нет. Ничего нового."
1009203-151 = ""
1009203-153 = ""
1009203-154 = "Хорошо. Тогда просто найду автограф, который выглядит более-менее нормально, и..."
1009203-155 = ""
1009203-157 = ""
1009203-158 = ""
1009203-159 = "Простите, мисс. Вот чек за ваши заказы."
1009203-160 = "Не могли бы вы расписаться вот здесь?"
1009203-161 = ""
1009203-163 = ""
1009203-164 = "А. Да. Одну секунду."
1009203-165 = ""
1009203-167 = ""
1009203-168 = "Подпись, подпись..."
1009203-169 = ""
1009203-171 = ""
1009203-172 = ""
1009203-173 = "Хм?"
1009203-174 = ""
1009203-176 = ""
1009203-178 = ""
1009203-179 = "...Ого, смотрите, что я сделала."
1009203-180 = "Что?"
1009203-181 = ""
1009203-183 = ""
1009203-184 = "[ns15] «Я примерно этого и ожидал.»\n[ns16] «Вот это подпись для обычного чека!»"
1009203-188 = "[ns] «Ух ты, у вас очень крутая подпись!»"
1009203-189 = ""
1009203-191 = ""
1009203-192 = "Нет-нет, погодите! Это...!"
1009203-193 = "Стоп! Нет!!"
1009203-194 = "Не надо, не надо. Серьёзно, если я говорю не надо — значит не надо."
1009203-195 = "Я серьёзно. Вы умрёте. Вы за это заплатите! Я серьёзно!!"
1009203-197 = "[ns17] «Отличная работа, будущая знаменитость!»\n[ns18] «Этот чек станет коллекционной вещью!!»"
1009203-200 = "А-а-а-а!!"
1009203-201 = ""
1009203-214 = "Сотрудник сделал нам замечание и попросил не шуметь."
