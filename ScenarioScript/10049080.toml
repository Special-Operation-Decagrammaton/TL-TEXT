[translation]
10049080-1 = "Эпизод 8;Просто спросите у Банды шлемов!"
10049080-2 = "А-а-а-а! Простите!!"
10049080-3 = "П-Пощадите меня!! Я расскажу все слабости нашего капитана!!"
10049080-4 = "У неё слабая хватка, она не может открыть банку с солёными огурцами!"
10049080-5 = "А! Ещё! Она боится спать на верхней койке двухъярусной кровати!"
10049080-6 = "Эй!!"
10049080-7 = ""
10049080-10 = ""
10049080-11 = ""
10049080-12 = ""
10049080-14 = "Ах!"
10049080-15 = "Фух..."
10049080-16 = "Хорошо, что мы нашли этот аккумулятор, да?"
10049080-17 = "Без него мы бы не смогли включить здесь свет."
10049080-18 = "...Так о чём мы говорили?"
10049080-19 = "[s1] «Она боится двухъярусных кроватей.»\n[s2] «Она не может открыть банку с огурцами.»"
10049080-22 = "Уф, серьёзно?! Сенсей!!"
10049080-23 = "Я её понимаю."
10049080-24 = "Но сначала давайте просто повторим всё, что нам известно."
10049080-25 = "Первый вопрос: Шимико, что у тебя за костюм?"
10049080-26 = "Я Эра, злая офицерша из «Волшебницы Тяжёлого Калибра», помнишь?"
10049080-27 = "А, точно..."
10049080-28 = "Но тогда где ты была всё это время?"
10049080-29 = "Ну вы же САМИ попросили меня быть злодейкой, верно?"
10049080-30 = "Да, и...?"
10049080-31 = "Разве не было бы странно, если бы злодейка всё время болталась рядом с героями?"
10049080-33 = "Вообще-то, это очень хороший довод!"
10049080-34 = "[ns] «Да, если подумать, она права!»"
10049080-36 = "..."
10049080-37 = "В любом случае, рада, что засада сработала."
10049080-38 = "Ты появилась идеально вовремя, Шимико."
10049080-39 = ""
10049080-41 = ""
10049080-42 = "Теперь Комаказэ Рабу."
10049080-43 = "Мы весь день пытались с вами поговорить."
10049080-44 = "Есть несколько вопросов."
10049080-45 = "Что вы задумали здесь, в парке развлечений?"
10049080-46 = "А? Ты о чём вообще?"
10049080-48 = "Три дня назад я слышала ваш разговор в глубине старой библиотеки!"
10049080-49 = "Вы сказали, что парк развлечений превратится в полный бардак и люди пострадают!"
10049080-50 = "И вдобавок вы таскали ГРАНАТЫ!"
10049080-52 = "Она это слышала, да?"
10049080-53 = "Я же говорила, надо было пользоваться MomoTalk!"
10049080-55 = "Погоди, вы двое ЧТО сказали?"
10049080-56 = "Вы собирались взорвать парк?!"
10049080-57 = "Я вас этому учила?!"
10049080-59 = "Н-Нет, капитан!! Мы бы никогда!"
10049080-60 = "Если бы у нас была взрывчатка, мы бы пошли подрабатывать на сносе зданий или что-то вроде того!"
10049080-61 = "Ну, если бы еды хватало, чтобы работать на сытый желудок..."
10049080-63 = "Тогда о чём она услышала ваш разговор?"
10049080-65 = "Понятия не имею. ...О, может, она услышала, как мы говорили о сами-знаете-ком."
10049080-66 = "Я имела в виду, если они будут сопротивляться, в парке может начаться драка, и люди могут пострадать."
10049080-68 = "Кто такой «сами-знаете-кто»?"
10049080-69 = "Расскажите всё. По порядку."
10049080-71 = "Если мы расскажем, вы отстанете? А?"
10049080-72 = "Конечно. Если вы не замышляете ничего дурного."
10049080-73 = ""
10049080-74 = "[ns] «Я за это ручаюсь.»"
10049080-75 = "Ц, даже Сенсей..."
10049080-76 = "Ладно, как хотите. *вздыхает*"
10049080-77 = "Сейчас мы на работе. Это... вроде частной охраны."
10049080-78 = "Бандиты в шлемах занимаются охраной? У вас вообще есть разрешение работать здесь?"
10049080-79 = "А почему нельзя? Нам что, нужно разрешение, чтобы делать что-то хорошее?"
10049080-80 = ""
10049080-82 = ""
10049080-83 = "Хорошее есть хорошее. Мы не против быть приличными людьми, если нормально платят."
10049080-84 = "Особенно когда поблизости нет никого из Валькирии, Префектурной команды ИЛИ Отряда справедливости, чтобы мешать нам."
10049080-85 = "В любом случае... здесь кто-то продаёт подделки."
10049080-86 = "Это бьёт по прибыли компании, поэтому за продавца назначили награду."
10049080-87 = "Мы услышали об этом в новостях, вот и пришли заработать."
10049080-89 = "Подделки? Типа пиратского мерча?"
10049080-90 = "Ну, вы же видели те гранаты раньше."
10049080-91 = "Это «германиевые гранаты». Чека треугольная, якобы это «полезно» для здоровья."
10049080-92 = "И другое барахло тоже. В основном бракованное."
10049080-93 = "Шарики с утечкой, ведёрки для попкорна, которые не закрываются..."
10049080-94 = "Мы уже конфисковали кучу такого товара, но продавца пока не нашли."
10049080-95 = "А место огромное, так что, похоже, и не найдём. Тьфу."
10049080-96 = "Шарики с утечкой? Бракованные контейнеры для попкорна...?"
10049080-97 = ""
10049080-98 = "Эх, я только что купила этот шарик, а он уже сдулся!"
10049080-99 = "Крышка от ведёрка с попкорном где-то потерялась! А-а!"
10049080-100 = "А-а-а!"
10049080-101 = "Можно мне ещё один? Пожалуйста?"
10049080-103 = ""
10049080-104 = ""
10049080-105 = ""
10049080-106 = ""
10049080-107 = ""
10049080-108 = ""
10049080-109 = "Вы нас развязываете? Мы свободны или как?"
10049080-110 = "...Сначала я должна кое-что сказать всем троим."
10049080-111 = "Прошу прощения за то, что помешала вам из-за огромного недоразумения с моей стороны."
10049080-113 = "Что? Ха! Думаешь, можно просто сказать: «Ой, ошиблась!» и..."
10049080-114 = ""
10049080-116 = ""
10049080-117 = ""
10049080-118 = "Мне правда, искренне жаль."
10049080-119 = ""
10049080-121 = ""
10049080-122 = "А-А? ...Т-Ты правда извиняешься?"
10049080-123 = "Н-Ну... Наверное, любой может ошибиться, да?"
10049080-124 = "Ладно, думаю, тогда всё хорошо. Давайте просто считать это дело закрытым, ладно?"
10049080-126 = "Я тоже прошу прощения."
10049080-127 = "И я. Как мне вообще загладить—"
10049080-129 = "Я сказала, ВСЁ ХОРОШО!!"
10049080-130 = "Рабу, теперь, когда я поняла ситуацию..."
10049080-131 = "Мы можем как-нибудь помочь вам с работой?"
10049080-132 = "А?! Зачем? Вы что, ловушку нам устраиваете?"
10049080-133 = "Нет-нет. Но я помешала вашей работе и хочу это исправить."
10049080-134 = "Скажи, продавец подделок — или продавцы — по-твоему, поступают несправедливо?"
10049080-135 = "Ну, ХОРОШИМИ людьми я бы их не назвала. Хех, и это говорю я."
10049080-136 = "И они навредили невинным, верно?"
10049080-137 = "По крайней мере их кошелькам. Я бы взбесилась, если бы меня так развели."
10049080-138 = "Конечно."
10049080-139 = "Кажется, я знаю, где они находятся. Недалеко отсюда."
10049080-140 = "И Отряд линчевателей к вашим услугам."
10049080-142 = "...!"
10049080-143 = "Ага, именно!"
10049080-144 = "И Библиотечный комитет тоже поможет, насколько сможет!"
10049080-145 = ""
10049080-146 = "[ns3] «Я тоже.»\n[ns4] «„Бегающий учитель Шале“ наготове!»"
10049080-150 = "Хех. Ладно, было бы глупо отказываться от бесплатной помощи."
10049080-151 = "К тому же мы не знаем, сколько их там."
10049080-152 = ""
10049080-154 = ""
10049080-155 = "Так что да, конечно, нам пригодятся линчеватели. ...И библиотекарь, наверное."
