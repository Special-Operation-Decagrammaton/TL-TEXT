[translation]
1007402-1 = "Сегодня опасности нет"
1007402-2 = "Следуя указаниям Ханако, я оказался глубоко в лесу на острове."
1007402-3 = "Погода была идеальной: солнечно, но дул прохладный ветерок."
1007402-4 = "О, Сенсей? Вы довольно быстро пришли."
1007402-5 = ""
1007402-8 = ""
1007402-9 = "Правда, спешить совсем не было нужды."
1007402-10 = "...А?"
1007402-11 = "Сенсей? Что случилось? Вы выглядите довольно... напряжённо."
1007402-12 = "[s1] «Н-Нет! Ничего такого!»\n[s2] «А-а это всё для чего?»"
1007402-15 = "А, это? Просто фрукты. Несмотря на то что они из совершенно разных климатических зон, все эти виды прекрасно растут здесь."
1007402-16 = "Разве это не удивительно? Бананы, персики, клубника."
1007402-17 = "А смотрите, эти арбузы уже созрели и готовы к еде."
1007402-18 = "...? Сенсей?"
1007402-19 = "[s3] «О-Ох. Хорошо, что это всего лишь фрукты...»\n[s4] «Этот набор фруктов заставил меня немного...»"
1007402-20 = ""
1007402-21 = ""
1007402-23 = ""
1007402-24 = ""
1007402-25 = "...А!"
1007402-26 = "А-ха-ха! Хи-хи. Теперь понятно."
1007402-27 = "Приношу глубочайшие извинения. У нас ведь уже была похожая встреча в прошлом, да?"
1007402-28 = "Можете больше не беспокоиться. На этот раз... вы в безопасности."
1007402-29 = "Более того, считайте себя в безопасности всё время, пока мы здесь."
1007402-30 = "В конце концов, обстоятельства сейчас необычные."
1007402-31 = "...Что?"
1007402-32 = "Ну, естественно, здесь всё будет иначе. Для начала, тут нет всяких любопытных, как в Тринити."
1007402-33 = "Так что никто не устроит сцену, если я немного вас подразню."
1007402-34 = "[s5] «Так ВОТ какие у тебя мотивы!»\n[s6] «По крайней мере, ты понимаешь, что это доставляет неприятности!»"
1007402-37 = "Разве не сам Сенсей виноват, что всегда игнорирует мои предупреждения?"
1007402-38 = "Что бы я ни делала, вы всё равно каждый раз идёте за мной."
1007402-39 = "Не то чтобы я на это жаловалась."
1007402-40 = ""
1007402-42 = ""
1007402-43 = "Хи-хи."
1007402-44 = "[s7] «Ханако...?»\n[s8] «Что ты сказала?»"
1007402-47 = "Хи-хи! В любом случае, с таким вы уж справитесь, правда, Сенсей?"
1007402-48 = "Просто... мне хочется сохранить это чувство удовлетворения как можно дольше."
1007402-49 = "Здесь, в этом лесу, нет ожиданий Сестринства, не нужно переживать о репутации и формулировках."
1007402-50 = "Это полная противоположность Тринити. Политика и игры остаются где-то далеко, и я могу говорить свободно и прямо."
1007402-51 = "Конечно, если бы здесь были Кохару или Уй, мы наверняка вели бы очень увлекательный разговор об этих фруктах."
1007402-52 = "К сожалению — или к счастью — здесь только мы вдвоём. Так что можете немного расслабиться, Сенсей."
1007402-53 = "Ах! Сенсей, неужели всё это время у вас были скрытые мотивы?"
1007402-54 = "Вы пришли сюда, ожидая, что я устрою для вас фирменный «спецвыпуск Ханако». А я всё переосмыслила и попыталась вести с вами приличный разговор..."
1007402-55 = "Я, Ханако, обязательно исполню надежды и мечты Сенсея!"
1007402-56 = "[s9] «Нет! Нет! Так идеально!»\n[s10] «Умоляю, оставайся именно такой.»"
1007402-59 = "Хи-хи."
1007402-60 = "Хорошо. Тогда..."
1007402-61 = ""
1007402-63 = ""
1007402-64 = "Пойдём обратно, Сенсей. Поможете мне нести фрукты."
1007402-65 = ""
1007402-67 = ""
1007402-69 = "Балансируя с целыми грудами фруктов, мы с Ханако отправились обратно в лагерь."
1007402-70 = "Ханако недолго заставила ждать исполнения своего обещания и вскоре начала вести «увлекательные» разговоры о найденных фруктах."
