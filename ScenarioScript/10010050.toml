10010050-9 = "В-В любом случае, нужно обязательно отнести это Уи."
10010050-10 = "Дальше в списке... либо святой тоник, либо клей из сфагнового мха."
10010050-11 = "Что будем добывать первым?"
10010050-12 = "[s3] «Святой тоник?»\n[s4] «А как насчёт клея?»"
