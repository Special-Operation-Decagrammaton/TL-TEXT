10010050-38 = "А вдруг кто-то попал в серьёзную беду? Мы не можем просто проигнорировать это...!"
10010050-39 = "Правда?"
10010050-40 = "[s5] «Нет, конечно.»\n[s6] «Я знал, что ты так скажешь.»"
