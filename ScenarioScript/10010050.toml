10010050-50 = "Сегодня они упрямее обычного."
10010050-52 = "Ха-ха! Ты связалась с Бандой мокриц, девчонка! Сколько нас ни сбивай, мы всегда снова встаём! Отскакиваем обратно — прямо как могучая мокрица!"
10010050-54 = "Мне всё равно, с какого жука вы берёте пример..."
10010050-55 = "И зачем вообще было мне это рассказывать? Вы пришли подраться?"
10010050-56 = "Ещё как пришли. Мы тебя искали."
10010050-57 = "Меня?"
10010050-58 = "И зачем же?"
10010050-59 = "Что значит «зачем»?! Вы сейчас серьёзно?#nВспомните, что вы с нами сделали!"
10010050-60 = "Ты должна была понимать, что сама напросилась!"
10010050-61 = "Ты за всё заплатишь, Бегущая светошумовая граната Тринити!"
10010050-62 = "Это вы сами придумали мне такое прозвище?"
10010050-63 = "И уж простите, но я понятия не имею, о чём вы говорите!#nДля меня все вы, хулиганки, на одно лицо!"
10010050-64 = "Для меня важно лишь поступать правильно."
10010050-66 = "Вот как, значит?! Ну тогда вот как действуем МЫ!"
10010050-67 = "И не думай, что это мы придумали тебе такое прозвище.#nТы что, тупая?"
10010050-68 = "Ты вообще понимаешь, сколько шума поднимаешь? А?"
10010050-70 = "Не совсем понимаю, о чём вы."
10010050-71 = "Ха! Да ты и правда ничего не понимаешь, да?"
10010050-72 = "Ты понятия не имеешь, какая у тебя репутация и какое влияние."
10010050-73 = "У тебя даже фанаты появились — пытаются тебе подражать!"
10010050-74 = "Подражать? Мне?"
10010050-75 = "И зачем кому-то это делать?"
10010050-77 = "По той же причине, по которой сейчас разлетается любая мода: всё подхватили соцсети. Теперь куча народу тебя копирует..."
10010050-78 = "Раз уж ты Светошумовая граната Тринити, эти позёры начали называть себя всяким вроде «Дымовой шашки Тринити» или «Сетевой ловушки Тринити».#nЭто уже выходит из-под контроля!"
10010050-79 = "Поэтому мы и пришли отрубить змее голову и покончить с этим.#nВиновата здесь ты, а не мы!"
10010050-81 = "Если кто здесь и виноват, то уж точно не я..."
10010050-82 = "Хотя спасибо, что объяснили ситуацию. Я редко пользуюсь соцсетями,#nпоэтому не знала, что происходит."
10010050-83 = "Говорят, подражание — самая искренняя форма лести. Я не вижу ничего плохого в том, что люди сами берутся отстаивать справедливость. По-моему, это хорошие новости."
10010050-84 = "Но факт остаётся фактом: ко мне это не имеет никакого отношения.#nЯ никого из них не знаю."
10010050-85 = "Однако если вы настаиваете на драке со мной..."
10010050-86 = ""
10010050-88 = ""
10010050-89 = "...то я принимаю вызов. Давайте покончим с этим!"
10010050-91 = "Ик..."
10010050-92 = "Н-Не позволяй ей тебя запугать! В нашей банде 30 человек!#nКак мы можем проиграть, если нас тридцать против одной?!"
10010050-93 = "Мы Банда мокриц! Мы всегда отскакиваем обратно!"
10010050-94 = "Н-Но в прошлый раз она уже победила нас восемнадцать против одной. То, что мокрица снова сворачивается, не значит, что её нельзя раздавить!"
10010050-95 = "В прошлый раз она вырубила нас прикладом и даже ни разу не выстрелила..."
10010050-96 = "А-а-а! Не напоминай о нашем позоре! Именно поэтому мы и набрали ещё двенадцать человек, разве нет?!"
10010050-98 = "Ну..."
10010050-99 = "...мы будем драться или нет? Может, дать вам ещё немного времени подготовиться?"
10010050-100 = "Заткнись! Хватит строить из себя такую заботливую."
10010050-101 = "На этом всё закончится, Бегущая светошумовая граната Тринити!"
10010050-103 = "С-Сенсей!"
