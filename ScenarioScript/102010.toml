[translation]
102010-1 = "Эпизод 1; Проводник Хромы"
102010-4 = "..."
102010-5 = ""
102010-8 = "Президент, это..."
102010-9 = "..."
102010-11 = "До президента Рио всё ещё не дозвониться?"
102010-12 = "Юука..."
102010-13 = "Ноа, я..."
102010-14 = "Иди первой. Здесь можешь оставить всё на меня."
102010-15 = "Х-хорошо! Будь осторожна!"
102010-17 = "Мне было любопытно, к чему такая срочность, но теперь понятно."
102010-18 = ""
102010-20 = ""
102010-21 = "Ханако."
102010-22 = "..."
102010-23 = "Рада снова тебя видеть, Ханако."
102010-24 = "Уверена, Сэя уже тебе сказала, но нам нужно действовать."
102010-25 = "Мы в Тринити исторически постоянно конфликтовали друг с другом, но если и есть момент, когда нам нужно объединиться, то это сейчас."
102010-27 = "З-Здесь всё чисто!"
102010-28 = "Ага! Но что там творится в небе? Разве это не немного захватывающе?"
102010-29 = ""
102010-31 = ""
102010-33 = "О! С-Сенсей прислал сообщение..."
102010-34 = "Хм? Что там?"
102010-35 = "*вздыхает*"
102010-36 = ""
102010-38 = ""
102010-39 = "...Хм. Похоже, нам пора выдвигаться."
102010-41 = "Срочные новости! В D.U. происходит странное явление! Если вкратце..."
102010-42 = "С неба рухнула огромная башня, одним ударом уничтожив башню Санктум!"
102010-43 = "Беспрецедентная катастрофа парализовала D.U.! Мы не знаем, связано ли это с недавно объявленным военным положением..."
102010-55 = "Крыша здания Шале"
102010-57 = "...Хи-хи-хи."
102010-58 = "[s] «...Чёрный Костюм.»"
102010-59 = "Мне жаль, что всё так обернулось, [USERNAME] Сенсей."
102010-60 = "Но Гематрия уничтожена."
102010-61 = "Хрома наконец добралась до Кивотоса."
102010-62 = "...Нет, это не совсем верно. Следует сказать, что она «вторглась» в Кивотос."
102010-63 = "[s] «Что случилось с Широко?»"
102010-64 = "...Богиня-волчица столкнулась с Хромой."
102010-65 = "Обратившись в царство Ужаса, она стала богиней смерти, которая провожает всех живых в подземный мир..."
102010-66 = "Богиня-волчица — предвестница гибели этого мира. Такова её природа."
102010-67 = "Хрома знала это и прежде всего завладела её Возвышенным."
102010-68 = ""
102010-75 = ""
102010-76 = "Я считал Хрому чем-то непостижимым, лишённым воли, желаний и целей..."
102010-77 = "Но теперь я вижу всё предельно ясно."
102010-78 = "Я был недальновиден. У Хромы есть намерения и желания. И она прокладывает путь к их осуществлению."
102010-79 = "Похоже, она стремится поглотить само Возвышенное. Если ей это удастся, Хрома подчинит себе каждую Мистику и каждый Ужас Кивотоса."
102010-81 = "Шесть башен, появившихся в Кивотосе... похожи на перевёрнутые башни Санктум."
102010-82 = "Это технологии, созданные Безымянными богами... тайны просветления, возникшие ещё до древнейших времён этого мира."
102010-83 = "Они распространят Хрому в этом мире, превращая каждый кошмар и каждую тайну Кивотоса в реальность, наполненную Ужасом."
102010-84 = "То же сделает и богиня-волчица."
102010-85 = "[s] «Тогда мы её остановим.»"
102010-86 = "..."
102010-87 = "Похоже, Хрома напала на Гематрия с помощью бога всех концов, чтобы завладеть секретами Гематрия и результатами её экспериментов."
102010-88 = "Путь Декаграмматона, тайна Мимесиса, Communio Sanctorum, Библиотека знаний, сила Безымянных богов и способности неизвестных стражей..."
102010-89 = "И теперь всем этим владеет Проводник Хромы."
102010-90 = "[s] «Проводник Хромы?»"
102010-91 = "Существо, воплощающее волю Хромы и определяющее все её планы и цели..."
102010-93 = "Тебе придётся столкнуться с Френапатесом."
