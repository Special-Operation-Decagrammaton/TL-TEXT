102010-108 = "По всему Кивотосу наблюдаются перебои со связью!"
102010-109 = "Мы ожидаем возможного приказа об эвакуации, но что это вообще за башни? На этот счёт по-прежнему нет никаких новостей!"
102010-110 = "Ходят слухи, что Генеральный студенческий совет вскоре выступит с экстренным заявлением!"
102010-111 = "А? Похоже, они не собираются реагировать?"
102010-112 = "Общественность требует, чтобы Генеральный студенческий совет действовал — и немедленно!"
102010-114 = "О, о! А тем временем срочные новости! По всему D.U. появляются неопознанные войска!"
102010-115 = "Что ты сказала?!"
102010-116 = "Они без разбора атакуют город...?!"
102010-117 = "Мы знаем, какой организации они подчиняются? Это засада!"
102010-118 = "...Наконец пришло экстренное заявление от Генерального студенческого совета! Нет, поправка! Оно от Шале, а не от Генсовета!"
102010-119 = "Поступило экстренное заявление от Шале!"
102010-120 = "В-Вот сообщение Сенсея!"
102010-122 = "«...Студенты, пожалуйста, эвакуируйтесь как можно скорее и не приближайтесь к башням.»"
102010-124 = "[ns] «Остальное оставьте Шале.»"
102010-126 = "[ns] Достать кредитную карту."
102010-128 = "...Я предупреждаю тебя."
102010-129 = ""
102010-131 = ""
102010-132 = "Если продолжишь пользоваться этой картой, закончишь как мы, Сенсей."
102010-133 = "Хи-хи-хи..."
