[translation]
1300203-1 = "Чесночный фанатизм"
1300203-2 = "Рабочий кабинет Сенсея в Шале"
1300203-3 = ""
1300203-4 = ""
1300203-5 = ""
1300203-6 = "После обеда Акари вернулась в куда более хорошем настроении, чем обычно."
1300203-7 = "Хм-м, хм-м... Хм-м... ♪"
1300203-8 = "Ах, сегодняшний обед был восхитительным. Я попробовала новый ресторан, и настроение сразу поднялось."
1300203-9 = "Ты опять ел хлеб на обед?"
1300203-10 = "Так нельзя. Чтобы сохранять концентрацию весь день, на обед нужно нормально наедаться. Стоит есть что-нибудь питательнее хлеба."
1300203-11 = "Даже если не хочется, лучше сходить в ресторан, а не в магазин. Я знаю несколько хороших мест рядом с Шале!"
1300203-12 = "[s] «Ты была в раменной на обед, Акари?»"
1300203-13 = "А? Откуда ты знаешь?"
1300203-14 = "Да, я ела рамен. Прямо перед зданием Шале недавно открылась новая раменная."
1300203-15 = "В меню написано: десять порций огромного рамена бесплатно, если съесть их за тридцать минут. Я сразу осилила две миски — было отлично!"
1300203-16 = "Настоящий тонкоцу-рамен, густой бульон и куча добавок."
1300203-17 = "...Кстати, Сенсей, откуда ты узнал, что я ела рамен?"
1300203-18 = "Погоди... от меня пахнет чесноком?"
1300203-19 = "Ого... Я так тщательно чистила зубы, но запах чеснока всё равно въелся."
1300203-20 = "Если подумать, в рамене было три целых головки чеснока, и я всё съела... Неудивительно, что от меня пахнет."
1300203-21 = "Не хочу пахнуть чесноком рядом с тобой, но и есть тонкоцу-рамен без чеснока не хочу... Что же делать?"
1300203-22 = "[s] «Мне всё равно, пахнешь ты чесноком или нет.»"
1300203-23 = "No, this is a serious issue with a girl's innocence at stake!"
1300203-24 = "Я люблю всякую вкусную еду, но не хочу, чтобы ты запомнил меня как того студента, от которой пахнет чесноком."
1300203-25 = "Надо придумать решение..."
1300203-27 = "На следующее утро, едва я вошёл в кабинет Шале, в нос ударил резкий запах чеснока..."
1300203-28 = "Добро пожаловать, Сенсей! Я тебя ждала!"
1300203-29 = "[s] «Что это за запах...?»"
1300203-30 = "Вчера я поискала решение в интернете. Оказывается, человеческий нос перестаёт различать запах, если слишком долго подвергать его воздействию."
1300203-31 = "Поэтому мой план такой: я настолько пропитаю тебя запахом чеснока, что рядом со мной ты уже ничего необычного не почувствуешь!"
1300203-32 = "Итак, я приготовила для тебя еду с огромным количеством чеснока, Сенсей."
1300203-33 = "Чесночный хлеб, жареный рис с чесноком, чесночные пельмени, маринованный чеснок..."
1300203-34 = "Если мы вместе наедимся чеснока, его запах перестанет иметь значение!"
1300203-36 = "Еда Акари была вкусной, но после неё кабинет пах чесноком четыре дня подряд..."
