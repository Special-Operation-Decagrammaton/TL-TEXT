10014055-15 = "*тяжело дышит* *тяжело дышит* Вот это засада!"
10014055-16 = "Вы в порядке, Сенсей? Вас не ранили?"
10014055-17 = "[s1] «Я совершенно цел.»\n[s2] «Не волнуйся, я в порядке.»"
10014055-18 = "Какое облегчение. Я тоже не пострадала!"
10014055-19 = "Какое облегчение. Я тоже не пострадала!"
10014055-20 = "Похоже, слух о том, что Казуса пытается создать новую организацию, разлетелся как пожар."
10014055-21 = "Банды, которые выросли в её отсутствие, пойдут на всё, лишь бы не дать ей снова прийти к власти!"
10014055-22 = "Я правда всё испортила на этот раз, да..."
10014055-23 = "[s3] «Ты не отвечаешь за их злодеяния.» \n[s4] «Нет смысла кого-то винить.»"
10014055-24 = "Ха-ха... Спасибо, что сказали это, Сенсей."
10014055-25 = "Ха-ха... Спасибо, что сказали это, Сенсей."
10014055-26 = "Но ничего этого не случилось бы, если бы я не приставала к Казусе."
10014055-27 = "Я не могу закрыть на это глаза."
10014055-28 = "Казуса больше не бандитка Кат Палуг!"
10014055-29 = "Я не позволю снова втянуть её в этот мир!"
10014055-30 = ""
10014055-32 = ""
10014055-33 = "Ч-Чтобы она наконец смогла стереть своё прошлое!"
10014055-34 = "[s5] «...»\n[s6] «Рейса, это...»"
10014055-35 = "Кхм...! Это было лишь начало войны. Впереди ещё долгий путь."
10014055-36 = "Кхм...! Это было лишь начало войны. Впереди ещё долгий путь."
10014055-37 = "Уверена, появится ещё больше бандитов! Целые легионы!"
10014055-38 = "Миссия мстителя — бороться со злом! Это мой долг!"
10014055-39 = "Как член Отряда бдительности, я доведу это до конца. Я защищу обычную Кёяму Казусу!"
10014055-40 = "Итак, Сенсей. Для начала, пожалуйста, возьмите это..."
10014055-41 = ""
10014055-43 = ""
10014055-44 = ""
10014055-45 = "[ns7] «Это зачем?» \n[ns8] «Ты хочешь, чтобы я передал это ей?»"
10014055-46 = "Да, пожалуйста. Так она поймёт, что я больше никогда не брошу ей вызов. Этому жесту она поверит сильнее любых моих слов."
10014055-47 = "Да, пожалуйста. Так она поймёт, что я больше никогда не брошу ей вызов. Этому жесту она поверит сильнее любых моих слов."
10014055-48 = "...Сенсей, теперь я наконец понимаю, зачем вы задавали мне те вопросы."
10014055-49 = "Вы ещё добрее, чем я думала. Спасибо, что помогли мне успокоиться."
10014055-50 = "Я просто... надеялась сказать ей, что чувствую. О! Только ей об этом не говорите."
10014055-51 = "Я была очень удивлена, что снова вас встретила! Пусть всего на несколько дней, но я была очень счастлива."
10014055-52 = "Простите, если я временами слишком возбуждалась или перегибала. Простите за все неудобства, которые доставила."
10014055-53 = "Ну... Эм..."
10014055-54 = "Наверное..."
10014055-55 = ""
10014055-57 = ""
10014055-58 = "Немного грустно быть лишь призраком её прошлого, который она хочет стереть."
10014055-59 = ""
10014055-62 = "[ns] «Рейса, это не...»"
10014055-64 = "...О!"
10014055-65 = "Там ещё злодеи набегают!"
10014055-66 = "Я больше не хочу никому доставлять неприятности."
10014055-67 = "Надеюсь, однажды..."
10014055-68 = "у меня снова появится шанс поговорить с вами. Только вдвоём!"
10014055-69 = "До свидания, Сенсей!"
