[translation]
10036080-1 = "Эпизод 8;Легендарная хулиганка"
10036080-3 = "Студенты Полицейской школы «Валькирия» до сих пор содрогаются, вспоминая тот арест."
10036080-4 = ""
10036080-6 = ""
10036080-8 = "В тот день они потеряли двенадцать полицейских машин, два танка и понесли множество потерь — и всё это против одного-единственного врага."
10036080-9 = ""
10036080-11 = ""
10036080-13 = "Её сила и выносливость не имеют равных."
10036080-14 = ""
10036080-16 = ""
10036080-18 = "Одна из печально известных «Семи заключённых» — «Легендарная хулиганка»..."
10036080-19 = ""
10036080-21 = ""
10036080-22 = ""
10036080-23 = ""
10036080-24 = "Прекрасная ночь, не правда ли?"
10036080-25 = "Ночь, которой я ждала очень долго."
10036080-26 = ""
10036080-27 = ""
10036080-28 = "Курихама Акэми...!"
10036080-30 = "Хорошо, вы помните."
10036080-31 = "Я Акэми. И приветствую вас всех."
10036080-32 = "[s] «(Это же...)»"
10036080-33 = "Давненько не виделись, правда?"
10036080-34 = "Вы даже не представляете, как сильно я по вам всем скучала."
10036080-35 = "А вы?"
10036080-36 = "Вы ведь всё ещё помните нашу последнюю встречу, да?"
10036080-38 = "Wait..."
10036080-40 = "Только не говорите, что забыли."
10036080-41 = "Вы ОБЯЗАНЫ помнить, как сдали меня копам из «Валькирии», чтобы они пришли и забрали меня."
10036080-42 = "С тех пор я сидела за решёткой в Исправительном бюро."
10036080-43 = "И думала... о... вас."
10036080-44 = "Ну что, все готовы?"
10036080-46 = "Г-Готовы? К чему готовы?"
10036080-48 = "О, сейчас покажу."
10036080-50 = "И-Ииик...!"
10036080-51 = "Я-Я так и знала. Это вы приказали устроить ту засаду, да?"
10036080-53 = "Какую засаду? Какой приказ?"
10036080-54 = ""
10036080-55 = ""
10036080-57 = ""
10036080-59 = ""
10036080-60 = "Старшая сестрёнка!!"
10036080-62 = "О боже. А вы что здесь делаете?"
10036080-63 = "Мстим за вас, конечно!"
10036080-64 = "Но я больше не с вами. Теперь я просто беглянка."
10036080-65 = "Нет-нет! Вы всегда будете нашей Старшей сестрёнкой!"
10036080-66 = "Вы ушли от нас, потому что «Валькирия» охотилась за вами. Вы приняли удар на себя ради команды!"
10036080-67 = "А сразу после того, как вы ушли, Банда Шлемов отправила вас за решётку... Угх!"
10036080-68 = "...А, значит, вы всё-таки меня помните. И даже пытались за меня отомстить."
10036080-69 = "Как мило!"
10036080-70 = "Как предусмотрительно со стороны профессорши устроить нам такую чудесную встречу."
10036080-71 = "Вы тоже наняли профессоршу-умницу?"
10036080-72 = "Старшая сестрёнка, должно быть, и есть та «она», о которой говорила профессорша!"
10036080-73 = ""
10036080-75 = ""
10036080-76 = "[ns] «(„Профессорша-умница“. Это же...?)»"
10036080-79 = ""
10036080-80 = ""
10036080-81 = ""
10036080-82 = "Простите, что врываюсь на вашу «милую встречу», но так легко мы не сдадимся!"
10036080-83 = "Ага! Даже если ты «Легендарная хулиганка», ты всё это время гнила в тюрьме!"
10036080-84 = "Эй, только представьте, как взлетит наша уличная репутация, если мы её завалим!"
10036080-85 = ""
10036080-87 = ""
10036080-89 = ""
10036080-90 = "А, вот это настрой."
10036080-91 = "Девочки, я ценю всё, что вы для меня сделали, но, пожалуйста, отойдите."
10036080-92 = "Поймите, для меня это личное."
10036080-93 = "С Элизабет в руках я отомщу всем этим самозванкам."
10036080-94 = "А теперь вы! Приготовьтесь умереть!"
10036080-95 = ""
10036080-97 = "А-А-А-А!"
10036080-98 = "Н-Не бегите! Открыть ответный огонь!"
10036080-99 = ""
10036080-101 = ""
10036080-102 = "А-а-а! Да ну его! Бежим! Бежи-и-им!"
10036080-103 = ""
10036080-109 = ""
10036080-110 = ""
10036080-112 = ""
10036080-113 = ""
10036080-114 = "Химэ, пригнись...!"
10036080-115 = ""
10036080-118 = ""
10036080-119 = ""
10036080-120 = ""
10036080-121 = ""
10036080-122 = ""
10036080-123 = "Угх..."
10036080-124 = "Ииик! Мисаки! Ты в порядке?!"
10036080-125 = ""
10036080-126 = "Мисаки...!"
10036080-127 = "Тц...! Сенсей, мы не можем просто стоять. Дети в опасности."
10036080-128 = "И она ещё и сцену разносит!"
10036080-129 = "[s] Кивнуть."
10036080-130 = "Эй! Незваная гостья!"
10036080-131 = ""
10036080-132 = "Кто, я?"
10036080-133 = ""
10036080-135 = ""
10036080-136 = ""
10036080-137 = "Похоже, у нас появилась новая цель, Элизабет..."
10036080-138 = "[s] «(Так Элизабет — это пушка...)»"
10036080-139 = "Кто это сказал? А ну выходи."
10036080-140 = ""
10036080-141 = "Я. Вот здесь."
10036080-142 = "Люди пришли сюда хорошо провести время, и я не позволю тебе всё испортить. Уходи."
10036080-143 = "Охо, какая же ты милая."
10036080-144 = "С чего ты взяла, что мне нужно твоё разрешение?"
10036080-145 = "Кроме того, я не могу сейчас просто уйти. Не зря же я проделала весь этот путь ради кровавого хаоса?"
10036080-146 = "Но если ты всё ещё думаешь, что сможешь меня остановить..."
10036080-147 = "...тогда я покажу тебе, почему не стоило даже пытаться."
