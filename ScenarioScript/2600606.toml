[translation]
2600606-1 = "Когда загадываешь желание на метеор"
2600606-2 = "Вход в здание Шале, поздняя ночь"
2600606-3 = "Я ждала тебя, Сенсей!"
2600606-4 = "Я так ждала этого дня, что не могла уснуть... и чуть не проспала."
2600606-5 = "Я так рада, что смогла вот так посмотреть на метеорный поток."
2600606-6 = "Ну же, давай скорее на крышу, пока не поздно!"
2600606-8 = "Крыша здания Шале, поздняя ночь"
2600606-9 = "Фух, похоже, ещё не началось."
2600606-10 = "Тебе не холодно, Сенсей?"
2600606-11 = "Поздно ночью довольно прохладно, так что лучше одеться потеплее."
2600606-12 = "Хи-хи. Хочешь чашку чая?"
2600606-13 = "[s] «Спасибо.»"
2600606-14 = ""
2600606-15 = ""
2600606-16 = ""
2600606-17 = ""
2600606-18 = "Почему-то... мне немного неловко вот так оставаться с тобой наедине посреди ночи."
2600606-19 = "Астрономический телескоп, который я принесла, для наблюдения за метеорным потоком нам не понадобится..."
2600606-20 = "О-О чём нам поговорить, пока ждём?"
2600606-21 = "[s] «Нодока, посмотри вверх.»"
2600606-22 = "...Что?"
2600606-26 = "― Ого, падающая звезда! Ох... Вон там! И там тоже![wa:3500]"
2600606-29 = "― Всё небо усыпано падающими звёздами! Метеоры падают словно дождь![wa:3440]"
2600606-31 = "― Не могу поверить, что вижу это собственными глазами... Будто сон.[wa:3060]"
2600606-34 = "― Желание? Нет... На сегодня мне и так достаточно.[wa:5930]"
2600606-37 = "― Мне достаточно просто наслаждаться этим прекрасным видом рядом с дорогим мне человеком...[wa:600]"
2600606-39 = "― Если я пожелаю чего-то ещё, звёзды могут на меня рассердиться...[wa:990]"
2600606-42 = "― Сейчас я совершенно счастлива.[wa:1150]"
2600606-45 = "Интересно, откуда вообще появилась история о желаниях на падающую звезду."
2600606-46 = "Красивая мысль, но ведь это просто небесное явление, никак не связанное с желаниями людей..."
2600606-47 = "Что думаете, Сенсей?"
2600606-48 = "(Я не ответил. Я уже засыпал.)"
2600606-49 = "Эй, здесь нельзя засыпать!"
2600606-50 = "Ну серьёзно! Сенсей!"
2600606-52 = "Я смотрел на ночное небо вместе с Нодокой, пока метеорный поток не закончился."
