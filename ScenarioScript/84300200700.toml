[translation]
84300200700-5 = "...Ты всё это время знала, что я здесь? Тогда смысла прятаться больше нет."
84300200700-6 = ""
84300200700-8 = ""
84300200700-9 = "Студент Тринити, значит?"
84300200700-10 = "И эта одежда... Ты из Чаепития?"
84300200700-11 = "Что такая важная шишка делает в такой захудалой дыре, а?"
84300200700-12 = "Если я настолько важная персона, тебе стоило бы следить за тоном."
84300200700-13 = "Но да, я состою в Чаепитии Тринити. Меня зовут Юризоно Сейя. Я заметила подозрительных людей и проследила за ними."
84300200700-14 = "О, так ты следила за ними?"
84300200700-15 = "Такая малявка?"
84300200700-16 = "...Ну да."
84300200700-17 = "Ха...! Неожиданно. Ты гораздо смелее, чем выглядишь."
84300200700-18 = "Мне нравится. Наше начальство в школе никогда настолько лично в дела не лезет."
84300200700-20 = "Всё не так..."
84300200700-21 = "Да не переживай. Я тебя не осуждаю."
84300200700-22 = "Просто одним полевая работа подходит лучше, чем другим."
84300200700-24 = "...Давайте сменим тему."
84300200700-25 = ""
84300200700-27 = ""
84300200700-28 = "Этот голос... Ты Цукацуки Рио?"
84300200700-29 = "Почему ты...? Я думала, ты ушла из Миллениума."
84300200700-30 = ""
84300200700-32 = ""
84300200700-33 = "Ушла. И официально меня здесь по-прежнему нет."
84300200700-34 = "Но причины приходить у меня есть."
84300200700-35 = "Во-первых, у меня вопрос к тебе, Юризоно Сейя. Что ты здесь делаешь?"
84300200700-36 = "Ты..."
84300200700-37 = ""
84300200700-41 = ""
84300200700-42 = "...Это просто шум техники. Не беспокойтесь."
84300200700-43 = "Почему бы вам обеим не подойти ко мне? Пока вас кто-нибудь не заметил."
84300200700-44 = ""
84300200700-46 = ""
84300200700-47 = "Обеим? Ты хочешь привести ещё и ЭТУ девчонку? Ты серьёзно...?"
84300200700-49 = "(«Эту девчонку»...)"
84300200700-51 = "Она тебя видела, Нэру. Мы не можем просто отправить её обратно одну. Ты ведь уже сама это поняла."
84300200700-52 = "Ну не могла же я просто её проигнорировать..."
84300200700-53 = "Ладно, поняла. Приведу."
84300200700-54 = ""
84300200700-56 = ""
84300200700-58 = "Слышала?"
84300200700-59 = "Иди тихо за мной. И на всякий случай — никаких фокусов, ясно? Мне всё равно, Чаепитие ты или нет."
84300200700-60 = ""
84300200700-62 = ""
84300200700-64 = ""
84300200700-65 = "Цукацуки Рио... Тогда это должна быть... Микамо Нэру."
84300200700-66 = "Что бы здесь ни происходило, это явно не обычное дело."
