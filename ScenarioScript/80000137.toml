[translation]
80000137-1 = "Этому место в музее!"
80000137-2 = "Находясь в Шале, я почувствовал присутствие Рабу."
80000137-3 = "И решил пойти в переулок, где она могла ошиваться."
80000137-5 = "Переулок рядом с Шале"
80000137-6 = ""
80000137-7 = ""
80000137-8 = ""
80000137-9 = ""
80000137-10 = "...Хм, неплохо."
80000137-11 = "А, может, немного поправить чёлку."
80000137-12 = "[ns1] «Ра!»\n[ns2] «Бу!»"
80000137-15 = ""
80000137-17 = ""
80000137-18 = "Ч-Что!!! Ай!!!"
80000137-19 = "Потише! Я подумала, это засада! Чуть не выстрелила!"
80000137-20 = "Погоди, разве ты не должен работать?! Почему не в здании Шале?"
80000137-21 = "[s] «Потому что почувствовал, что ты где-то рядом!»"
80000137-22 = "Как ты вообще... *вздох* Неважно. Серьёзно, ты слишком рад просто тому, что меня увидел..."
80000137-23 = "Но момент удачный. Я всё равно шла в Шале."
80000137-24 = "Я пришла, потому что хотела кое-что тебе дать!"
80000137-25 = "[s3] «Шапка ручной вязки?»\n[s4] «Дневник для пары?»\n[s5] «Твой школьный альбом за среднюю школу?»"
80000137-29 = "Зачем тебе вообще всё это?!"
80000137-30 = "Важнее другое: ты настолько занят, что даже в календарь не смотришь? Это уже тревожно..."
80000137-31 = ""
80000137-33 = ""
80000137-34 = "Вот!"
80000137-35 = "У меня нет ни навыков, ни уверенности, чтобы сделать тебе что-то особенное..."
80000137-36 = "...так что придётся довольствоваться этим. Шоколадом из круглосуточного магазина."
80000137-37 = "Я купила две штуки. Одну тебе, одну себе. Хм, посмотрим... Ням..."
80000137-38 = ""
80000137-40 = ""
80000137-41 = "...Так... куда я его дела..."
80000137-42 = ""
80000137-44 = ""
80000137-45 = ""
80000137-46 = "Хм?"
80000137-47 = "[s6] «Ты ранена?»\n[s7] «Ты больна?»\n[s8] «Ты голодна?»"
80000137-51 = "Ммф! Потише и не отвлекай! Я не могу отвечать с шоколадом во рту!"
80000137-52 = "Я точно купила два и положила в сумку. Но теперь вижу только один."
80000137-53 = "Может, выронила во время той драки..."
80000137-54 = "[s] «Мне более чем достаточно самого жеста!»"
80000137-55 = "Э, нет. Какая жалость, ещё и в праздник..."
80000137-56 = "Угх..."
80000137-57 = ""
80000137-59 = ""
80000137-60 = "Сенсей, я знаю, что уже кусала его, но всё равно хотите кусочек? Я только угол надкусила..."
80000137-61 = ""
80000137-63 = ""
80000137-65 = "Руки сейчас немного грязные, так что можете отломить чистые квадратики."
80000137-66 = "Просто сломать по этой линии, да?"
80000137-67 = ""
80000137-69 = ""
80000137-70 = "[ns] «Положись на меня!»"
80000137-71 = "Эх, какое разочарование. Я специально покупала два."
80000137-72 = "Да, похоже, придётся поделить этот—"
80000137-73 = ""
80000137-75 = ""
80000137-76 = ""
80000137-77 = ""
80000137-78 = "..."
80000137-79 = "Что такое? Работа зовёт?"
80000137-80 = "[s] «Д-Да, так и есть, но...»"
80000137-81 = ""
80000137-83 = ""
80000137-84 = "Иди. Не заставляй их ждать."
80000137-85 = "Кому-то ведь нужна помощь, да?"
80000137-86 = "[s] «Прости, Рабу! В следующий раз обязательно заходи! Повеселимся!»"
80000137-87 = ""
80000137-90 = "Смотри куда бежишь! Скользко и опасно!"
80000137-91 = ""
80000137-93 = ""
80000137-94 = ""
80000137-97 = "Вот же..."
80000137-98 = "...В следующий раз, говоришь?"
80000137-99 = "...Пожалуй, воспользуюсь предложением."
80000137-100 = "Ну а теперь пойду поищу монетки под автоматами..."
80000137-101 = ""
80000137-103 = ""
80000137-104 = ""
80000137-105 = ""
80000137-106 = "Эй! А где шоколад?"
80000137-107 = ""
80000137-109 = ""
80000137-110 = "Тот, что был у меня во рту..."
80000137-111 = "Сенсей убежал со всей плиткой...?!"
