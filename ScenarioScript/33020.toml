[translation]
33020-1 = "Эпизод 2;Разбор последствий, часть 2"
33020-2 = "Вот что сказала Сэя."
33020-3 = "Если давний конфликт между Геенной и Тринити удастся решить с помощью Эдемского договора, возможно, следующим можно будет заняться проблемами Ариуса."
33020-4 = "Она также сказала, что договор — единственный способ решить глубоко укоренившиеся проблемы Тринити..."
33020-5 = "Но Ариус хочет уничтожить нимбы членов Чаепития. Если им это удастся... в Кивотосе начнётся война."
33020-6 = "Сэя спросила, действительно ли я этого хочу."
33020-7 = ""
33020-8 = "Понятно."
33020-9 = "Одно я могу сказать наверняка: наши взгляды расходятся,#nШирасу Азуса."
33020-10 = "Я знакома с пятым коаном. Лучше многих понимаю ошибочность попыток доказать существование рая."
33020-11 = "Однако..."
33020-12 = "...если ты хочешь продолжать борьбу перед лицом катастрофы,#nя помогу."
33020-13 = "Я поделюсь с тобой своей мудростью."
33020-14 = "Хотя не могу обещать, куда она тебя приведёт."
33020-16 = "А потом ты уничтожила комнату?"
33020-17 = "Это было необходимо, чтобы инсценировать смерть Сэи. Ариус тоже нужно было обмануть."
33020-18 = "Сэя лично выбрала капитана Рыцарей спасения для проведения операции по сокрытию. Она сказала, что остальное можно оставить ей."
33020-19 = "После уничтожения комнаты я скрылась. Когда пыль улеглась и сведения об инциденте начали распространяться, отряд решил, что мне всё удалось."
33020-20 = "Это всё, что я знаю о той ночи."
33020-21 = "..."
33020-22 = "С тех пор я ничего не знала. Я понятия не имела, что Сэя всё ещё без сознания."
33020-23 = "По крайней мере её раны зажили. Почему она остаётся в коме — загадка."
33020-24 = "Значит, ты не знала, что план нападения на Сэю изначально придумала Мика?"
33020-25 = "Я..."
33020-26 = "Мика полностью скрыла своё участие. Рядовой исполнитель вроде Азусы никак не мог об этом знать."
33020-27 = "Д-Да! Мы знаем Азусу, и она не убийца! Она даже пыталась спасти жизнь Нагисы после всего, что та нам сделала."
33020-28 = "Да, конечно... но моя работа требует задавать такие вопросы."
33020-29 = "Нет, всё нормально. Я справлюсь."
33020-30 = ""
33020-32 = ""
33020-33 = ""
33020-34 = ""
33020-35 = "Приказ мне отдала Джомаэ Саори, лидер отряда."
33020-37 = "Верно."
33020-38 = "После этого Ширасу Азуса перевелась в Тринити с тайной целью защищать Нагису. Это ясно."
33020-39 = "По пути она вместе с Клубом дополнительных занятий даже сдала оценочный экзамен. Значит, она умеет добиваться результата."
33020-40 = "Лично я не нахожу в ней вины. Поэтому возьму ответственность на себя и подтвержу подлинность её документов."
33020-41 = "Если за неё поручится Сестринство, никто не должен возражать против её зачисления."
33020-42 = "Спасибо, Сакурако!"
33020-43 = ""
33020-45 = ""
33020-46 = ""
33020-47 = "[ns] «Мы у тебя в долгу.»"
33020-48 = "Теперь Ширасу Азуса официально студент Тринити."
33020-49 = "Незавершённые дела всё ещё остаются, особенно всё, что касается Ариуса..."
33020-50 = "...но все срочные пожары пока потушены."
33020-51 = "Отличная работа, все. Особенно ты, Ханако, и вы, Сенсей."
33020-52 = "О, благодарю! ♥"
33020-53 = "У меня есть другие дела, так что я пойду. Идём, Мари."
33020-54 = "Да."
33020-55 = "Эм... вы двое не могли бы снова поговорить со мной, когда всё немного успокоится?"
33020-57 = "С удовольствием."
33020-60 = "Фух. По крайней мере вопрос с зачислением Азусы решён."
33020-61 = "[s] «Ты отлично справилась, Ханако.»"
33020-62 = "Ты тоже, но работы ещё очень много."
33020-63 = "Особенно в том, что касается Нагисы и Мики."
33020-64 = "О, кстати говоря, слышала, Хифуми не так давно встречалась с ней."
33020-65 = "[s] «С Нагисой?»"
33020-66 = "Да, так она мне сказала. Видимо, им нужно было многое между собой прояснить."
33020-68 = "Хифуми."
33020-69 = "П-Привет, Нагиса. В-Вы хорошо выглядите. П-Похудели?"
33020-70 = "Я позвала тебя, чтобы официально извиниться, Хифуми."
33020-71 = ""
33020-73 = ""
33020-74 = "Прости, что сомневалась в тебе."
33020-75 = "О-О. Это."
33020-76 = "Учитывая всё, через что я тебя заставила пройти, я бы едва ли могла винить тебя, если бы ты сейчас взяла чашку чая и вылила мне на голову."
33020-77 = "Подумать только, я считала тебя лидером преступной организации в масках. Это просто не могло быть правдой. Не знаю, почему я поверила этим слухам."
33020-78 = "..."
33020-79 = "Я полностью пойму, если ты решишь меня не прощать. Более того, я этого не ожидаю."
33020-80 = "Н-Нет, дело не в этом."
33020-81 = "Думаю, со мной всё будет нормально. Да, временами было действительно больно... но это всего лишь недоразумение, которое теперь разрешилось."
33020-82 = "Я ведь не думала о том, чтобы ненавидеть тебя или что-то подобное. Больше ничего говорить не нужно. Со мной всё будет хорошо..."
33020-83 = "..."
33020-84 = "Не думаю, что сама смогла бы быть настолько снисходительной. Ты очень интересная девушка, Хифуми."
33020-85 = "Я? Э-Это забавно..."
33020-86 = ""
33020-87 = ""
33020-88 = ""
33020-89 = "(«Забавно», да?)"
33020-90 = ""
33020-91 = "Забавная фантазия — думать, будто мы когда-нибудь действительно были подругами."
33020-92 = "*кашель*! *кашель* *кашель*!"
33020-93 = "Нагиса?"
33020-95 = "*кашель* Я-я в порядке. Просто чай попал не в то горло."
33020-96 = "О-Ой..."
33020-97 = ""
33020-101 = "[ns] «...»"
33020-102 = "Я-Я рада, что их недоразумение прояснилось, но, похоже, моя шутка над Нагисой зашла чуть дальше, чем следовало."
33020-103 = ""
33020-105 = ""
33020-106 = "Нагиса также встречается с другими, чтобы как следует извиниться за всё произошедшее."
33020-108 = ""
33020-109 = ""
33020-110 = ""
33020-111 = ""
33020-112 = ""
33020-113 = ""
33020-115 = "Она даже извинилась передо мной, а я сказала, что мне жаль, что я была такой проблемной."
33020-116 = "..."
33020-117 = "Она больше не тонет в сомнениях и паранойе... но цена оказалась высокой."
33020-118 = "[s] «Я немного за неё переживаю.»"
33020-119 = "Да, я тоже."
33020-120 = "[s] «И за Мику тоже.»"
33020-121 = "Правда...?"
33020-122 = ""
33020-124 = ""
33020-125 = "Вообще-то я как раз хотела спросить, что ты думаешь о её мотивах."
33020-127 = "М? Хотите знать, почему я это делаю, Сенсей?"
33020-128 = "Потому что ненавижу Геенну."
33020-129 = "Я всей душой презираю академию Геенна."
33020-130 = ""
33020-131 = "Со стороны трудно понять, какими на самом деле были их отношения, но Нагиса и Мика должны были быть подругами детства."
33020-132 = "Противоположности притягиваются, как говорится. Нагиса всегда была прилежной и чрезмерно осторожной, а Мика — свободной и спонтанной."
33020-133 = "Может, со временем они отдалились и были не так близки, как казалось..."
33020-134 = "...но меня всё равно потрясло, что Мика предала Нагису лишь из-за ненависти к Геенне."
33020-135 = "Поэтому через Сестринство я договорилась с ней о встрече."
33020-137 = "Но когда я пришла, там уже был кое-кто другой."
33020-139 = "Камера заключения Тринити"
33020-140 = "Ого! Наги! Добро пожаловать!"
33020-141 = "Привет, Мика. Как ты? Устроилась удобно?"
33020-142 = "Не особо, но могло быть хуже. По крайней мере меня не бросили в крошечную подземную камеру. Мне даже телевизор разрешили. В общем, почти всё необходимое есть."
33020-143 = "Не думала, что окажусь здесь — ну, по крайней мере не сейчас. Время выбрано очень неудачно."
33020-144 = "Согласна. Я тоже совсем этого не ожидала."
33020-145 = "Жизнь прекрасна своей непредсказуемостью, правда? По крайней мере я так считаю!"
33020-146 = "..."
33020-147 = "..."
33020-148 = "Я правда не думала, что ты придёшь, Наги."
33020-149 = "..."
33020-150 = ""
33020-152 = ""
33020-154 = "Следующий эпизод;Разбор последствий, часть 3"
