[translation]
33020-1 = "Episódio 2;Post-mortem (2)"
33020-2 = "...A Seia disse o seguinte."
33020-3 = "Que, se os conflitos entre Gehenna e Trinity acabassem por meio do Tratado do Éden, a questão de Arius talvez pudesse ser resolvida em breve."
33020-4 = "E que, pelo menos por ora, o Tratado do Éden seria a única forma de solucionar os problemas profundos entre essas duas escolas..."
33020-5 = "...Mas, ao mesmo tempo, Arius estava tentando destruir as auréolas da Tea Party. Se isso fosse executado, Kivotos certamente se tornaria um verdadeiro campo de batalha."
33020-6 = "Ela me perguntou... se eu queria impedir isso."
33020-8 = "...Entendo."
33020-9 = "...Já vou avisando de antemão, Shirasu Azusa: eu não concordo com o seu modo de pensar."
33020-10 = "Afinal, eu sei melhor do que ninguém que a Quinta Regra Antiga... isto é, a \"Prova do Paraíso\", é algo impossível."
33020-11 = "Contudo..."
33020-12 = "Mesmo que tudo caminhe para a ruína. Se, ainda sabendo disso, você diz que vai continuar lutando..."
33020-13 = "Então emprestarei a minha sabedoria a você."
33020-14 = "Embora eu não possa garantir em nada a que resultado isso vai levar..."
33020-16 = "...E então vocês explodiram o quarto da Seia-san?"
33020-17 = "...Era necessário para forjar que \"a Seia morreu\". Os meios para enganar até mesmo o Esquadrão Arius eram limitados..."
33020-18 = "Para encobrir todo o incidente, a Seia indicou a capitã das Cavaleiras Socorristas como ajudante. Disse para eu confiar tudo a ela dali em diante."
33020-19 = "...Então explodi o quarto e fugi. Somando o tumulto e as informações que circularam em Trinity depois disso, o Esquadrão acreditou que eu havia cumprido a missão."
33020-20 = "...Foi assim que tudo aconteceu."
33020-21 = "..."
33020-22 = "Eu também não sabia do que houve depois. Nem mesmo que ela ainda não havia recuperado a consciência..."
33020-23 = "Dizem que os ferimentos externos da Seia-chan já estão totalmente curados. Parece que o motivo de a consciência da Seia-chan não voltar é outro..."
33020-24 = "Então você está dizendo que não sabia que quem deu a ordem do ataque foi a Mika-sama?"
33020-25 = "Isso..."
33020-26 = "A Mika-san ocultou sua verdadeira identidade o tempo todo. Alguém na posição mais baixa da cadeia de comando, como a Azusa-chan, jamais teria como saber."
33020-27 = "A-A Azusa-chan não é uma assassina...! Mesmo naquela ocasião, a Azusa-chan tentou salvar a Nagisa-sama...!"
33020-28 = "...Peço desculpas. É que o meu trabalho é ouvir os relatos desta forma."
33020-29 = "...Hanako, Hifumi. Eu estou bem."
33020-35 = "Quem de fato me deu as ordens foi a líder do Esquadrão Arius, \"Saori\". É ela quem está no comando do Esquadrão."
33020-37 = "...Pois bem."
33020-38 = "De toda forma, Shirasu Azusa-san... Ela se transferiu para Trinity e, de fato, protegeu a Nagisa-san até o fim. Isso é evidente."
33020-39 = "Embora muitas coisas tenham acontecido no processo, ela também foi aprovada no exame acadêmico especial. Todas do Clube de Aulas de Reforço, incluindo ela, apresentaram resultados claros."
33020-40 = "Não há do que reclamar... Quanto à documentação dela, eu mesma cuidarei de oficializá-la."
33020-41 = "A Irmandade dará a sua garantia. Não permitirei que ninguém faça qualquer objeção."
33020-42 = "...Muito obrigada, Sakurako-san!"
33020-47 = "[ns] \"Muito obrigado mesmo.\""
33020-48 = "...Com isso, Shirasu Azusa-san tornou-se oficialmente uma aluna de Trinity."
33020-49 = "Ainda há uma montanha de problemas e, em especial, nada foi resolvido a respeito da Filial Arius..."
33020-50 = "Mas, por ora, pode-se dizer que ao menos a questão mais imediata se acalmou."
33020-51 = "Obrigada pelo bom trabalho. Hanako-san, e Sensei [USERNAME]."
33020-52 = "Fufu♡"
33020-53 = "Bem, tenho outros assuntos a tratar, então peço licença para me retirar primeiro. Mari, vamos."
33020-54 = "S-Sim."
33020-55 = "Hum, Hanako-san. Sensei também... Quando a situação se acalmar, adoraria conversar com calma depois..."
33020-57 = "Fufu, é verdade. Vou ficar ansiosa por isso, Mari-chan."
33020-60 = "Ufa... Com isso, demos um jeito na documentação da Azusa-chan também."
33020-61 = "[s] \"Bom trabalho, Hanako.\""
33020-62 = "Sim, digo o mesmo a você, Sensei. Mas ainda restam várias coisas para resolver, não é..."
33020-63 = "Tanto sobre a Nagisa-san quanto sobre a Mika-san..."
33020-64 = "Ah, falando nisso, soube que outro dia a Nagisa-san se encontrou com a Hifumi-chan."
33020-65 = "[s] \"A Nagisa...!\""
33020-66 = "Eu também só ouvi da própria Hifumi-chan, mas..."
33020-68 = "...Hifumi-san."
33020-69 = "N-Nagisa-sama, a senhora emagreceu um pouco...? E-Está tudo bem?"
33020-70 = "...Hifumi-san, por favor, deixe-me pedir desculpas como se deve."
33020-74 = "Eu duvidei de você, Hifumi-san."
33020-75 = "Hã? Ah..."
33020-76 = "Pensando nas feridas injustas que você sofreu até agora, Hifumi-san, eu não poderia reclamar nem se você jogasse chá em mim aqui mesmo."
33020-77 = "Imaginar que a Hifumi-san fosse a líder de um bando de criminosas de maiô... Como eu pude pensar uma coisa dessas...?"
33020-78 = "Ér, hum..."
33020-79 = "Não vou pedir que me perdoe... Nem acho que eu mereça ser perdoada. Mas..."
33020-80 = "H-Hum, Nagisa-sama."
33020-81 = "E-Eu estou bem, quer dizer... C-Claro que houve momentos difíceis, mas... antes de mais nada, por favor, deixe-me dizer apenas isto."
33020-82 = "Odiar a senhora, Nagisa-sama... nunca passou pela minha cabeça. Por isso, por favor, não peça mais desculpas..."
33020-83 = "..."
33020-84 = "...Se fosse comigo, tenho certeza de que não conseguiria perdoar. Hifumi-san, por que você..."
33020-85 = "P-Por quê? Mesmo que me pergunte isso, por que será, né...? A-Ahaha..."
33020-89 = "(\"Ahaha...\")"
33020-91 = "Ahaha... Hum, foi até bem divertido. Brincar de amiguinhas com você, Nagisa-sama."
33020-92 = "Cof! Cof, cof, cof!"
33020-93 = "N-Nagisa-sama...!?"
33020-95 = "Cof, cof... ahem. Não, hum, não se preocupe..."
33020-96 = "T-Tem certeza de que está tudo bem...!?"
33020-101 = "[ns] \"(...É, vou visitá-la de novo logo.)\""
33020-102 = "Hum, já desfiz o mal-entendido, mas... parece que acabei exagerando um pouco..."
33020-106 = "Além disso, ao que parece, a Nagisa-san também foi falar com outras pessoas—"
33020-115 = "Ela também pediu desculpas a mim, dizendo que havia feito algo terrível..."
33020-116 = "..."
33020-117 = "Acho que ela está começando a sair da escuridão daquela paranoia toda. Só que, em compensação, a Nagisa-san..."
33020-118 = "[s] \"...Preciso fazer o que estiver ao meu alcance.\""
33020-119 = "..."
33020-120 = "[s] \"E, claro, pela Mika também...\""
33020-121 = "A Mika-san..."
33020-125 = "Sensei... o que você acha sobre a motivação da Mika-san?"
33020-127 = "Hmm? Quer saber? Se é o Sensei pedindo, não tem jeito, né."
33020-128 = "Sabe... é porque eu odeio Gehenna."
33020-129 = "Eu realmente, de coração... odeio Gehenna do fundo do meu coração."
33020-131 = "A Nagisa-san e a Mika-san. A intimidade entre duas pessoas não é algo que se possa julgar de fora, mas... as duas são amigas de infância que passaram muito tempo juntas."
33020-132 = "A Nagisa-san, que é séria até demais e cautelosa ao extremo, e a Mika-san, sempre ativa e cheia de energia..."
33020-133 = "Suas personalidades também são quase opostas e, mesmo olhando de fora, não dava para afirmar facilmente que as duas se davam bem, mas..."
33020-134 = "Mas, ainda assim, eu simplesmente não consigo acreditar que ela tenha causado todo aquele incidente apenas pelo motivo de \"odiar Gehenna\"..."
33020-135 = "...Outro dia, com a ajuda da Irmandade, fui visitar a Mika-san."
33020-137 = "E lá já havia outra visita antes de mim..."
33020-139 = "Trinity - Prisão"
33020-140 = "Uau, se não é a Nagi-chan! Bem-vinda!"
33020-141 = "...Mika-san, como você está se sentindo? Há algum incômodo ou necessidade?"
33020-142 = "Bom, se for falar disso, é cheio de incômodos, né? Mesmo assim, tem até TV, então é bem melhor do que o calabouço subterrâneo."
33020-143 = "Puxa, eu não imaginava que viria parar aqui. Quer dizer, não é que eu não esperasse por isso, mas quem diria que seria justo nesse momento, né?"
33020-144 = "...É... verdade."
33020-145 = "Ora, ora, coisas imprevisíveis acontecerem também faz parte da graça da vida. Vamos deixar por isso mesmo, tá?"
33020-146 = "..."
33020-147 = "..."
33020-148 = "...Eu realmente não achei que você viria me ver, Nagi-chan."
33020-149 = "..."
33020-154 = "Próximo;Post-mortem (3)"
