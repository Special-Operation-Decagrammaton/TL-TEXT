[translation]
10036020-1 = "Эпизод 2;Положение Отряда"
10036020-2 = ""
10036020-3 = "Большое спасибо за помощь, Сенсей. Без вас мы бы сюда не добрались."
10036020-4 = "Пляж беззакония. Кто бы мог подумать, что такое место вообще существует?"
10036020-5 = "Мне редко доводилось так свободно ходить на открытом месте."
10036020-6 = "Да ещё посреди фестиваля. Для меня это словно другой мир."
10036020-8 = "По-моему, слишком хорошо, чтобы быть правдой."
10036020-9 = "А вдруг весь этот фестиваль — операция «Валькирии»?"
10036020-10 = "Они могут заманить нас сюда, а потом схватить всех разом!"
10036020-11 = "Нам конец! Исправительное бюро запрёт меня до самой старости!"
10036020-12 = "То мороженое, которое купил мне Сенсей, станет моей последней трапезой..."
10036020-13 = "[s] «Ну же, Хиёри, не переживай так.»"
10036020-14 = ""
10036020-16 = ""
10036020-17 = "У нас есть надёжная информация, что фестиваль Банды шлемов настоящий."
10036020-18 = "Если точнее, они называют его «Великим слётом союза бандитов в шлемах». И он будет большим. Очень большим. Подготовка идёт повсюду."
10036020-19 = "У «Валькирии» просто не хватит людей, чтобы устроить операцию такого масштаба."
10036020-20 = "П-Правда? Значит... можно расслабиться?"
10036020-21 = "...Ну, пока да."
10036020-23 = "К тому же Сенсей никогда не привёл бы нас туда, где опасно."
10036020-24 = "Правда, Сенсей?"
10036020-25 = "[s] «Конечно, нет.»"
10036020-26 = "Хи-хи! Вот видишь. Мы в надёжных руках."
10036020-27 = "[s1] «Я хочу, чтобы все здесь хорошо провели время.»\n[s2] «Ацуко, Хиёри, Мисаки — веселитесь.»"
10036020-30 = "Спасибо, Сенсей. Давайте все вместе насладимся фестивалем и сделаем множество фотографий."
10036020-31 = "Т-Так, нам нужна якисоба, кукуруза из пляжной лавки, ледяная стружка на десерт... Хи-хи..."
10036020-32 = "Меня не особо интересуют фестивали или вообще большие шумные места..."
10036020-33 = "Но ради Ацуко и Хиёри подыграю."
10036020-34 = "К сведению: здесь есть пляжная лавка, о которой говорила Хиёри, конкурс песчаных замков, выживание с водяными пистолетами и какой-то приглашённый диджей."
10036020-35 = "[s] «Для человека, которому всё равно, ты отлично подготовилась.»"
10036020-36 = "Я временный лидер Отряда. Тщательность — часть моей работы."
10036020-37 = ""
10036020-39 = ""
10036020-40 = "...Так что перестань так улыбаться! И ты тоже, Ацуко!"
10036020-41 = "Хи-хи, ну же, Мисаки, тебе тоже не помешает немного повеселиться."
10036020-42 = "Тц..."
10036020-43 = "[s3] «Может, сначала немного пройдёмся?»\n[s4] «Давайте всё осмотрим.»"
10036020-46 = "Да. Пойдёмте, Сенсей."
10036020-47 = "Хи-хи... Наконец-то фестиваль..."
10036020-48 = "*вздыхает*"
10036020-50 = ""
10036020-51 = "Ресторан под открытым небом. *нюхает* М-м, какой аромат. И сколько вкусной еды."
10036020-52 = "Как думаете, Сенсей? Попробуем?"
10036020-53 = "[s] «Звучит хорошо. Мисаки, Хиёри, вы как?»"
10036020-54 = "М-Мне подходит! Хи-хи, наконец-то нормальная еда..."
10036020-55 = "...Стоп."
10036020-56 = ""
10036020-58 = ""
10036020-59 = "Что такое, Мисаки? Почему ты так глаза трёшь...?"
10036020-60 = "...Это точно она."
10036020-61 = "Ацуко, Хиёри, посмотрите туда. На ту «официантку»..."
10036020-62 = ""
10036020-63 = "Вот ваш заказ. Тост и яичница. Надеюсь, вас устроит."
10036020-64 = "Хм? Я просил жидкий желток. Это же прожарено насквозь!"
10036020-65 = "Слишком сухо. Я это есть не могу! Принеси то, что я заказывал!"
10036020-66 = "О, я-я прошу прощения. Подождите минутку!"
10036020-67 = "«Минутку»? Я уже полчаса жду! Где моя еда? Я с голоду помираю!"
10036020-68 = "С-Сейчас всё принесу!"
10036020-69 = "Кажется, мне дали не тот заказ!"
10036020-70 = "Простите! Уже иду!"
10036020-71 = ""
10036020-73 = ""
10036020-76 = ""
10036020-77 = ""
10036020-79 = ""
10036020-80 = ""
10036020-82 = "Это Сао-Сао..."
10036020-83 = ""
10036020-85 = ""
10036020-86 = ""
10036020-87 = "Почему она здесь...? И... почему так одета?"
10036020-88 = "[s] «Саори...»"
10036020-89 = "..."
10036020-90 = "Что вообще с ней происходит...?"
10036020-91 = "[s] «Эй, Сао—»"
10036020-92 = ""
10036020-94 = ""
10036020-95 = ""
10036020-96 = ""
10036020-97 = "Ммф?!"
10036020-98 = "Тс-с, секундочку. Вы двое, тихо и прячьтесь здесь вместе со мной."
10036020-99 = "И вы, Сенсей."
10036020-100 = ""
10036020-102 = ""
10036020-103 = "[ns5] «Что такое, Ацуко?»\n[ns6] «Н-Нам нельзя, чтобы нас заметили?!»"
10036020-106 = ""
10036020-107 = "...Не думаю, что стоит ей мешать."
10036020-108 = "Это часть её поисков себя."
10036020-110 = "По-моему, она просто носится и всё портит."
10036020-111 = "..."
10036020-113 = "И всё же ошибки — часть того, как мы находим себя."
10036020-114 = "Мы работаем до седьмого пота, серьёзно смотрим внутрь себя."
10036020-115 = "Кроме того, она очень старается и не нуждается в том, чтобы мы её отвлекали."
10036020-117 = "Разве нельзя хотя бы поздороваться? Мы ведь не каждый день вот так случайно её встречаем..."
10036020-119 = "Нет, тогда она будет думать о нас, а не о себе."
10036020-120 = "Давайте пока просто наблюдать издалека, чтобы она могла сосредоточиться на своём пути."
10036020-122 = "Д-Да, ладно, наверное... Она и правда занята."
10036020-123 = "...Ага, ей и так нелегко."
10036020-125 = "Что думаете, Сенсей?"
10036020-126 = "[s] «Если мы все согласны, я тоже останусь незаметным.»"
10036020-127 = "Хи-хи, тогда начинается наша шпионская миссия."
10036020-128 = "Но я всё-таки хотела бы её сфотографировать. Редко увидишь её в таком состоянии. Было бы жаль не оставить память."
10036020-130 = "А что случилось с «наблюдать издалека»?"
10036020-132 = "Мне нужно подойти ВСЕГО чуточку ближе..."
10036020-133 = "[s] «Тебя так поймают...»"
10036020-134 = "Такой драгоценный момент, я обязана его запечатлеть. Хи-хи."
10036020-135 = "Была не была."
10036020-136 = ""
10036020-138 = ""
10036020-140 = "Сы-ы-ыр. Хи-хи. Вид у неё совершенно взвинченный."
10036020-141 = "А если она нас заметит и разозлится?"
10036020-142 = "Ну и разозлится. И что?"
10036020-143 = "Так, как получился снимок...?"
10036020-144 = "О, лицо получилось таким живым."
10036020-145 = "И правда неплохо вышло."
10036020-146 = "Для старой камеры совсем недурно."
10036020-147 = ""
10036020-148 = "Тебе нравится? Как только я услышала, что мы идём на пляж, сама собрала её из деталей. На Чёрном рынке нашлось всё необходимое."
10036020-149 = "И здесь она как раз пригодилась."
10036020-150 = "Ага. Мы создаём воспоминания, а теперь можем ещё и забрать их с собой."
10036020-151 = "Но всё же предлагаю отступить."
10036020-152 = "Если задержимся, она ТОЧНО нас заметит."
10036020-153 = "Точно."
10036020-154 = "Х-Хорошо!"
10036020-155 = ""
10036020-157 = ""
10036020-159 = "...Сенсей?"
10036020-160 = "[s] «Хм?»"
10036020-161 = "Жаль только, что я не могу помочь Саори."
10036020-162 = "Я мало что могу сделать, но хотя бы хотела бы помочь ей хорошо провести время на фестивале."
10036020-163 = "Мы вместе пережили столько трудностей. Она заслуживает тёплого лета."
10036020-164 = "...Хм. Сенсей, у вас в школе была игра «манито»? Тайные друзья, которые незаметно помогали выбранному человеку?"
10036020-165 = "[s] «Ха, давно не слышал этого слова, но да.»"
10036020-166 = "Да, они словно невидимые ангелы-хранители. Я хочу стать таким для Саори."
10036020-167 = "Поможете мне, Сенсей?"
10036020-168 = "[s] «Конечно. Поищем способы ей помочь.»"
10036020-169 = "Спасибо, Сенсей. Я знала, что на вас можно рассчитывать."
10036020-170 = "А теперь пойдём. Мисаки и Хиёри уже достаточно нас ждали."
10036020-172 = "После этого я ходил по фестивалю вместе с Ацуко, Мисаки и Хиёри..."
10036020-173 = "...и понял, что где-то потерял кошелёк."
10036020-176 = "[ns] «Наверное, я уронил его где-то здесь...»"
10036020-186 = "[ns] «Хм-м, нигде не вижу...»"
10036020-188 = "Извините, вы случайно не это ищете?"
10036020-189 = "[s] «Хм?»"
10036020-190 = ""
10036020-191 = "Я нашла этот кошелёк раньше, пока работала... а вы выглядели так, будто что-то ищете."
10036020-192 = "Вот и подумала, что, возможно, вы ищете..."
10036020-193 = ""
10036020-195 = ""
10036020-196 = "[ns] «С-Саори?!»"
10036020-197 = "Сенсей [USERNAME]...! Что вы здесь делаете?"
10036020-198 = "[s] «Ну, это довольно долгая история...»"
10036020-199 = "Понятно. Наверное, вы патрулируете на случай, если кто-то из студентов пострадает на пляже."
10036020-200 = "Такое ведь вполне возможно."
10036020-201 = "В любом случае, рада вас видеть. Как вы?"
10036020-202 = "[s] «Нормально. Похоже, у тебя самой тоже всё неплохо.»"
10036020-203 = "Благодаря вам, Сенсей."
10036020-204 = "В последнее время я беру заказы, как вы меня учили, и более-менее свожу концы с концами."
10036020-205 = "Собственно, поэтому я и оказалась здесь, на Пляже беззакония."
10036020-206 = "В любом случае—"
10036020-207 = ""
10036020-209 = ""
10036020-210 = "*ахает*"
10036020-211 = "Сенсей, сюда!"
10036020-212 = ""
10036020-214 = ""
10036020-219 = ""
10036020-220 = ""
10036020-221 = ""
10036020-222 = ""
10036020-223 = ""
10036020-224 = ""
10036020-225 = ""
10036020-226 = ""
10036020-227 = ""
10036020-228 = ""
10036020-229 = "...Неважно. Они ушли."
10036020-230 = "Простите, что... вот так вас дёрнула, Сенсей."
10036020-231 = "[s7] «(Похоже, Саори тоже их заметила.)»\n[s8] «Ты от них прячешься?»"
10036020-234 = "Давно я не видела их лиц. Ацуко, Мисаки, Хиёри..."
10036020-235 = "Не то чтобы я не хотела их видеть. Наоборот, хочу подойти, поздороваться, узнать, как они."
10036020-236 = "...Но у меня нет права это делать."
10036020-237 = "[s] «...»"
10036020-238 = "Можете ничего не говорить, Сенсей. Наверняка вы скажете, что мне не нужно никакое «право»."
10036020-239 = "Но... думаю, я ещё не готова."
10036020-240 = "У меня не хватает духу встать перед ними. Не тогда, когда я сама не могу держать голову высоко."
10036020-241 = "Даже если они скажут, что примут меня... Я уверена, они будут искренни..."
10036020-242 = "...но просто появиться перед ними, будто ничего не произошло... я не могу себе этого позволить."
10036020-243 = "Так что пока я бы предпочла не показываться."
10036020-244 = "...Это звучит эгоистично?"
10036020-245 = "Иногда я просто не знаю, что о себе сказать."
10036020-246 = "[s] «Саори...»"
10036020-247 = "...Хм. Сенсей? Простите за дерзость, но у меня есть просьба."
10036020-248 = "[s] «Какая?»"
10036020-249 = "Это их первая поездка на пляж."
10036020-250 = "В Академии Ариус мы слышали о таких местах, но... никогда их не видели."
10036020-251 = "Поэтому... я хочу, так сказать, защитить их лето."
10036020-252 = "Хочу, чтобы они вкусно поели, повеселились на улице... а ещё, кажется, здесь есть диджей."
10036020-253 = "Бандиты в шлемах не поскупились. Развлечений здесь хватает на всех."
10036020-254 = "Так что моя просьба: пожалуйста, помогите им троим насладиться этим."
10036020-255 = "Я и так вам многим обязана, но сейчас вы единственный, кого я могу попросить о помощи."
10036020-256 = "И я тоже буду помогать, пока смогу делать это незаметно."
10036020-257 = "Я прослежу, чтобы для них всё было готово. Ничего не упущу. Поэтому..."
10036020-258 = "[s9] «Считай, сделано.»\n[s10] «Я бы никогда не отказал тебе в такой просьбе.»"
10036020-261 = "Спасибо, Сенсей. Я этого не забуду."
10036020-262 = "Эй! Ты где? Перерыв закончился!"
10036020-263 = "Простите, Сенсей. Я бы хотела ещё поговорить, но..."
10036020-264 = "[s] «Ничего. Напишу тебе позже.»"
10036020-265 = "Ещё раз спасибо."
10036020-266 = ""
10036020-268 = ""
10036020-269 = ""
10036020-270 = ""
10036020-271 = ""
10036020-272 = ""
10036020-273 = ""
10036020-274 = "И... надеюсь, вы тоже хорошо проведёте время на фестивале."
