[translation]
2004005-1 = "Сацуки слушает"
2004005-2 = "Вскоре после того, как я получил сообщение от Сацуки..."
2004005-3 = ""
2004005-6 = ""
2004005-7 = "Привет, Сенсей!"
2004005-8 = "[s] «Ты выглядишь довольной, Сацуки...»"
2004005-9 = "Хи-хи, конечно."
2004005-10 = "Я достигла важного рубежа в великом проекте NK Ultra."
2004005-11 = "Так что вы станете первым участником нового этапа."
2004005-12 = ""
2004005-15 = "Хм? Вы хотите иметь право голоса?"
2004005-16 = "Что ж, как будущему партнёру Общества Пандемониума, это будет радостное событие для всех нас. Смотрите на это так."
2004005-17 = "Люди помнят только ПЕРВОГО, кто что-то сделал, понимаете?"
2004005-18 = "Какая честь — стать первым испытуемым нового, улучшенного проекта NK Ultra."
2004005-19 = "[s] «Ты сказала „испытуемым“?»"
2004005-20 = "О, не будем об этом. Лучше поговорим о том, что я уже узнала о вас."
2004005-21 = "Вас нельзя шантажировать. Вас нельзя пытать."
2004005-22 = "Значит, остаётся только один вариант."
2004005-23 = "Начнём с чистого листа и вместе испытаем улучшенный проект NK Ultra."
2004005-27 = "И снова Сацуки усадила меня на стул..."
2004005-29 = "Я по очереди проверю различные методы гипноза."
2004005-30 = "Интересно, как долго вы сможете не закрывать глаза."
2004005-31 = "Для начала..."
2004005-32 = ""
2004005-34 = ""
2004005-35 = ""
2004005-36 = "...смотрите. Сосредоточьтесь на кончике моего пальца."
2004005-37 = "Круг за кругом... Круг за кругом..."
2004005-38 = ""
2004005-41 = "[ns] «Кажется, я уже такое видел.»"
2004005-43 = "[ns] «Разве так не ловят стрекоз...?»"
2004005-44 = "Я сказала сосредоточиться! Это работает, только если оба участника действительно участвуют!"
2004005-45 = "[s] «Тебе это ни о чём не говорит?»"
2004005-46 = "Ну же, ну же. Круг за кругом... Смотрите, как он вращается..."
2004005-48 = "Сацуки какое-то время водила пальцем кругами перед моими глазами, но меня лишь закружило, а не потянуло в сон."
2004005-50 = "Ц. Похоже, этого недостаточно."
2004005-51 = "Но у нас ЕСТЬ ещё методы, гораздо больше. И времени полно..."
2004005-52 = "Сразу перейдём ко второму способу. Не забывайте сосредоточиться, Сенсей."
2004005-53 = "Смотрите на экран телефона."
2004005-54 = "[s] «Это...»"
2004005-55 = "Хи-хи, узнаёте? Фирменное приложение для гипноза Разведывательного комитета Общества Пандемониума. Идеальное слияние психологии и технологий!"
2004005-56 = ""
2004005-59 = ""
2004005-60 = "Не отводите взгляд! Сосредоточьтесь на вращающемся объекте в центре."
2004005-61 = "А теперь позвольте себе погрузиться в него..."
2004005-62 = "Вы будете выполнять мои приказы, Сенсей. Вы будете слушать всё, что я скажу."
2004005-63 = ""
2004005-65 = "..."
2004005-66 = "Вот и всё."
2004005-67 = "Сенсей, встаньте, зажмите нос и сделайте, ну... двести сальто назад."
2004005-68 = "[s] «А может, нет?»"
2004005-69 = "БАХ, значит, и это не сработало."
2004005-70 = "А я была так уверена, что приложение эффективно на сто процентов."
2004005-71 = "Хотя, с другой стороны, вы ведь Сенсей. Ваша сила духа далеко превосходит обычного человека."
2004005-72 = "К вашему несчастью, моя решимость тоже. Приготовьтесь к следующей технике..."
2004005-74 = "Парад гипнотических методов Сацуки продолжался ещё некоторое время."
2004005-75 = "Разумеется, ничего не сработало."
2004005-77 = "..."
2004005-78 = "*вздыхает* Не думала, что даже вы сможете так долго противостоять проекту NK Ultra."
2004005-79 = "[s] «Эй, Сацуки, уже поздно. Может, закончим и—»"
2004005-80 = "Нет! Это закончится только ОДНИМ способом!"
2004005-81 = "...А раз так, пора вернуться к самому началу."
2004005-82 = "[s] «Да ладно тебе. Я устал.»"
2004005-83 = "Ой, не будьте таким слабаком, Сенсей! Вы УЖЕ столько выдержали!"
2004005-84 = ""
2004005-86 = ""
2004005-87 = "Сацуки спереди надавила мне на плечи."
2004005-88 = "Хорошо. Ещё одна попытка на сегодня. Если не сработает, обещаю уйти домой."
2004005-89 = "Но она СРАБОТАЕТ. В этот раз я позабочусь об этом."
2004005-90 = "Смотрите сюда, Сенсей."
2004005-91 = ""
2004005-93 = ""
2004005-95 = "Вы будете подчиняться моим приказам... Вы будете слушать всё, что я скажу..."
2004005-96 = ""
2004005-103 = "...Стойте. Секунду..."
2004005-104 = "В какую сторону я до этого начала раскачивать...?"
2004005-105 = "Влево, вправо или..."
2004005-106 = "[s] «Кажется, вправо...?»"
2004005-107 = "...В вашу правую сторону или в мою? Погодите, тогда получается...?"
2004005-108 = "О-О нет. Я загипнотизировала сама себя!"
2004005-109 = "[s] «Сацуки...?!»"
2004005-112 = "― [log=사츠키]Ух... Что это...?[/log][wa:2450]"
2004005-115 = "― [log=사츠키]С-Странно... Такое чувство, будто я обязана выполнять ваши приказы...[/log][wa:5280]"
2004005-118 = "[ns] «Попробуй сказать: „Я буду поддерживать хорошие отношения с Дисциплинарным комитетом“.»"
2004005-120 = "― [log=사츠키]Э-Э-э... Да... [/log][wa:2480]"
2004005-122 = "― [log=사츠키]...Я буду поддерживать хорошие отношения с Дисциплинарным комитетом...[/log][wa:5350]"
2004005-125 = "― [log=사츠키]...За Макото не ручаюсь, [/log][wa:2070]"
2004005-127 = "― [log=사츠키]но лично я ничего против них не имею. [/log][wa:220]"
2004005-130 = "[ns] «А теперь скажи: „Обещаю не издеваться над Сенсеем“.»"
2004005-132 = "― [log=사츠키]Х-Хм? [/log][wa:1050]"
2004005-135 = "― [log=사츠키]Ц... Я н-не буду... издеваться над Сенсеем...[/log][wa:9010]"
2004005-138 = "― [log=사츠키]Н-Нечестно![/log][wa:1120]"
2004005-140 = "― [log=사츠키]Какой взрослый вообще применяет гипноз на студентке?! [/log][wa:980]"
2004005-143 = "[ns] «Не говори ничего, что люди могут вырвать из контекста.»"
2004005-145 = "[ns] «И разве не именно это ты сама пыталась сделать со мной?»"
2004005-147 = "― [log=사츠키]Хмф, загипнотизировать именно меня... [/log][wa:2430]"
2004005-149 = "― [log=사츠키]Вы просто не перестаёте удивлять, Сенсей.[/log][wa:1380]"
2004005-152 = "― [log=사츠키]Ну что скажете? Хотите присоединиться к моему проекту NK Ultra? [/log][wa:2800]"
2004005-155 = "[ns] «Не особо. Можешь... отойти, пожалуйста?»"
2004005-157 = "― [log=사츠키]Д-Да... Если это приказ...[/log][wa:2600]"
2004005-160 = "...Ц. Ну и позорище."
2004005-161 = "Я даже не знаю, сколько ЕЩЁ буду под гипнозом после всех усилий, которые вложила..."
2004005-162 = "Всё, что скажет Сенсей, мне, возможно, придётся выполнить."
2004005-163 = ""
2004005-166 = "[ns] «Сацуки, хочу кое-что спросить. Почему ты так сильно хочешь контролировать людей?»"
2004005-167 = "А...?"
2004005-168 = "Ну, эм..."
2004005-169 = "Ради мира во всём мире."
2004005-170 = "[s1] «Это... серьёзный ответ.»\n[s2] «Не могла бы ты пояснить?»"
2004005-173 = "Если в мире наступит покой, никто не будет страдать."
2004005-174 = "А я, эм..."
2004005-175 = "Я ненавижу боль!! Правда, ОЧЕНЬ её ненавижу!!"
2004005-176 = "Сильнее, чем пятна на белой одежде или невозможность пропустить рекламу!!"
2004005-177 = "Сильнее, чем когда в тебя стреляют или задевает осколками!!"
2004005-178 = "[s] «Я тоже. Но как гипноз людей приведёт к миру во всём мире?»"
2004005-179 = ""
2004005-181 = "Если я смогу контролировать людей, они не будут драться."
2004005-182 = "Я смогу приказать им никогда не прикасаться к оружию, гранатам и всему подобному."
2004005-183 = "И тогда Ибуки и Макото тоже не будут получать травмы."
2004005-184 = "Фуфу, именно с этой мысли и начался проект NK Ultra."
2004005-185 = "Контролировать людей по своей воле и сделать Кивотос миром без боли!"
2004005-186 = "Вот моя конечная цель!!"
2004005-187 = "[s] «Методы сомнительные, но цель достойная!»"
2004005-188 = "...Вы первый человек, который теперь знает всё это, Сенсей."
2004005-189 = "Я не собиралась никому рассказывать."
2004005-190 = "*вздыхает* Ну и что ещё за позор и унижение вы для меня придумали?"
2004005-191 = "Какой следующий приказ?! Я готова. Только скажите!"
2004005-192 = "[s] «Иди домой и хорошенько выспись.»"
2004005-193 = "Ц, я так и знала, что вы..."
2004005-194 = ""
2004005-196 = ""
2004005-197 = "А...?"
2004005-198 = "...Вы не собираетесь... вытягивать из меня секреты Общества Пандемониума или отдавать какие-то приказы...?"
2004005-199 = "Я ведь только один раз полностью у вас в подчинении... Я и правда могу просто пойти домой и лечь спать, знаете?"
2004005-200 = "О, смотрите, моё тело уже идёт к двери."
2004005-201 = "[s] «Вот и хорошо. Сегодня тебе досталось, Сацуки. Осторожнее по дороге домой.»"
2004005-202 = "..."
2004005-203 = "И снова — как и ожидалось от вас, Сенсей. Даже в такой момент..."
2004005-204 = ""
2004005-206 = ""
2004005-207 = "...вы остаётесь воплощением великодушия. Именно поэтому Общество Пандемониума..."
2004005-208 = ""
2004005-211 = "Она продолжала говорить, уходя, но остального я уже не услышал."
