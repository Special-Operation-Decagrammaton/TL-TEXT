[translation]
1300906-1 = "Лучшее место для тренировок с тобой"
1300906-3 = "Получив сообщение в MomoTalk, я пришёл к месту встречи, но Цубаки там не было."
1300906-4 = "[s] «Хм, интересно, где Цубаки.»"
1300906-5 = "Хр-р... Нет, не туда, Сенсей..."
1300906-6 = "Если пойдёшь за тем кроликом, который всё время говорит, что опаздывает, попадёшь в странное место..."
1300906-7 = "А?"
1300906-8 = "Я услышал голос и заглянул за ближайший куст."
1300906-11 = "― Сенсей. Ты пришёл...[wa:4380]"
1300906-14 = "― Ага. Это тренировка. Я медитировала...[wa:7830]"
1300906-17 = "― Думаешь, я просто задремала...?[wa:2560]"
1300906-20 = "― Вовсе нет. Это всё часть тренировки...[wa:6080]"
1300906-23 = "― Не ожидала найти поблизости такое хорошее место для тренировок.[wa:2640]"
1300906-26 = "― Я так счастлива. Как будто во сне...[wa:4060]"
1300906-29 = "― Это благодаря тебе я так счастлива, Сенсей?[wa:5190]"
1300906-32 = "― М-м! Не стой столбом, Сенсей.[wa:6640]"
1300906-34 = "― Давай ляжем и... поспим вместе.[wa:2080]"
1300906-37 = "Цубаки взяла меня за руку, так что выбора у меня не осталось..."
1300906-38 = "Мне пришлось лечь рядом с Цубаки и спать... то есть тренироваться... весь день."
