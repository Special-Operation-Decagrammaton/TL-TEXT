[translation]
1001105-1 = "Я не старая!"
1001105-2 = "Класс Шаньхайцзина"
1001105-3 = ""
1001105-4 = "*вздох* Как бы я ни старалась об этом не думать, мне постоянно напоминают о возрасте."
1001105-5 = "Надо взять себя в руки..."
1001105-6 = "[s] «Что-то случилось?»"
1001105-7 = "О, это ты, Сенсей."
1001105-8 = "Нет, ничего. ...Просто кое-что не выходит из головы."
1001105-9 = "Я отчитывала Кокону за её питание, а она сказала, что я всё равно не пойму, потому что слишком старая."
1001105-10 = "Я знаю, что она не хотела меня обидеть..."
1001105-11 = "...но нельзя отрицать, что в последнее время мы с Коконой всё чаще спорим."
1001105-12 = "Эм, возможно, это неловкий вопрос... но ты тоже считаешь меня слишком старой?"
1001105-13 = "Наверное, глупо спрашивать такое у взрослого. Просто мне всегда говорили, что я выгляжу и веду себя взрослее других в моём возрасте."
1001105-14 = "Иногда думаю: будь я чуть моложе и непосредственнее... возможно, мне было бы легче понимать Кокону."
1001105-15 = "[s] «По-моему, именно это и делает тебя хорошей сестрой, Шун.»"
1001105-16 = "Правда? Мне кажется, я только раздражаю Кокону своими нравоучениями..."
1001105-17 = "Конечно, я знаю, что Кокона меня не ненавидит и не пытается обидеть, но быть старшей сестрой порой очень трудно."
1001105-18 = "Иногда я думаю, каково было бы быть обычным студентом, а не инструктором Сада цветущей сливы."
1001105-19 = "Проводить время со сверстниками, которых не волнует мой возраст..."
1001105-20 = "[s] «Ты тоже заслуживаешь такой же заботы, как и все студенты.»"
1001105-21 = "З-Заботы... Я никогда не думала о том, чтобы кто-то заботился обо мне..."
1001105-22 = "Но мне приятно слышать это от тебя. Хи-хи..."
1001105-23 = ""
1001105-24 = ""
1001105-25 = "Ох. Как быстро летит время. Дети в Саду цветущей сливы, наверное, уже ждут."
1001105-26 = "Хи-хи. У меня, как и у тебя, тоже есть студенты, о которых нужно заботиться."
1001105-27 = ""
1001105-28 = "...Но когда вернусь, возможно, всё-таки приму твоё предложение."
