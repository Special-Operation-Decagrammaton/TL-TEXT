[translation]
10007105-1 = "Эпизод 10;Неизменная дружба"
10007105-2 = "Уф... Чёрт. Если бы не этот танк...!"
10007105-3 = "Хи-хи. Познала мощь «Чистильщика №1»?"
10007105-4 = "«Чистильщик №1» оснащён не только бульдозерным отвалом, способным прорезать любые препятствия, но и всевозможным противопехотным оборудованием для победы над студентами, бросившими вызов моей власти!"
10007105-5 = "Теперь атаки Рабочей партии меня не достанут!"
10007105-6 = "В следующий раз сначала разберёмся с этим танком..."
10007105-7 = ""
10007105-9 = ""
10007105-11 = "Вот и всё, все диверсанты устранены!"
10007105-13 = "Теперь наконец-то пора снести курорт горячих источников..."
10007105-14 = "Наша последняя надежда на горячие источники..."
10007105-15 = "Уа-а... Уа-а..."
10007105-17 = "УААААА!"
10007105-19 = "П-П-Почему ты вдруг плачешь? Решение о закрытии курорта уже принято!"
10007105-20 = "Даже если будешь плакать, мы не отступим! Это решение принято в общественных интересах академии Красной Зимы!"
10007105-21 = "Верно ведь, все?"
10007105-22 = ""
10007105-24 = ""
10007105-26 = ""
10007105-27 = "Ну, эм..."
10007105-28 = "Ха... ахахаха..."
10007105-30 = "П-Почему все меня избегают?"
10007105-31 = "Из-за этого я выгляжу злодейкой!"
10007105-32 = "Товарищ! Ты тоже думаешь, что я неправа?!"
10007105-33 = "[s1] «Думаю, в этот раз ты немного переборщила, Черино.»\n[s2] «Может, хотя бы само здание курорта оставить?»"
10007105-34 = "Я доверяла тебе, товарищ! Как ты мог!"
10007105-35 = "Я доверяла тебе, товарищ! Как ты мог!"
10007105-36 = "Нет! Я отказываюсь! Курорт горячих источников №227 будет закрыт!"
10007105-37 = "Если оставить хоть какой-то способ восстановить источники, клуб горячих источников однажды может вернуться и снова подвергнуть академию Красной Зимы опасности!"
10007105-38 = "Конечно, само здание курорта я могла бы оставить, но..."
10007105-39 = "Бесполезно — всё кончено! Без горячих источников нам конец!"
10007105-40 = "Заработанные деньги быстро исчезнут, здание останется без присмотра, внутрь начнут проникать дождь и ветер... В конце концов мы снова будем жить так же, как раньше в бывшем институте."
10007105-41 = "Я не хотела отпускать то, что у нас было... Не хочу возвращаться в те тяжёлые времена!"
10007105-42 = "В итоге у нас ничего не осталось!"
10007105-44 = "Это не так, Нодока. У нас всё ещё кое-что есть."
10007105-45 = "Что у нас осталось, Шигурэ?"
10007105-46 = "Ничего! Ничего!"
10007105-47 = "У нас всё ещё есть друзья из спецотряда бывшего института."
10007105-48 = "Наши друзья?"
10007105-49 = ""
10007105-51 = ""
10007105-52 = "Если честно, я никогда не считала жизнь в бывшем институте такой уж плохой."
10007105-53 = "Конечно, еды не хватало, никакого отопления не было, а иногда появлялись медведи..."
10007105-54 = "Но я была счастлива, потому что могла быть рядом с замечательными друзьями, включая Нодоку."
10007105-55 = "Мне всё равно, будет это место великолепным курортом горячих источников или безлюдными руинами, пока мы вместе."
10007105-56 = "К тому же у нас останется хорошее новое здание, которое раньше было курортом, верно? Уже не будет так плохо, как раньше."
10007105-57 = "И в этот раз мы справимся, Нодока. Обещаю."
10007105-58 = "Ох. Шигурэ..."
10007105-59 = ""
10007105-61 = ""
10007105-62 = ""
10007105-63 = "П-Подождите. Я ещё не сказала, что отменяю снос курорта."
10007105-64 = "*шёпотом* Черино, почувствуй атмосферу."
10007105-65 = "А-А? Д-Да?"
10007105-66 = "Цк, ладно. Раз все этого хотят, в этот раз я проявлю снисхождение."
10007105-67 = "Настоящим я отменяю снос!"
10007105-68 = "Я вверяю курорт горячих источников студентам спецотряда №227 — распоряжайтесь им как хотите!"
10007105-70 = "Воистину мудрое решение. Как и ожидалось от нашего президента."
10007105-71 = "Вы проявили великодушие к своим врагам."
10007105-72 = "Я, Марина, тронута!"
10007105-73 = ""
10007105-76 = ""
10007105-77 = "Этот курорт... больше не будет курортом?"
10007105-79 = "Мэгу? Ты всё ещё здесь?"
10007105-80 = "Мы сказали, что можете использовать курорт как хотите..."
10007105-81 = "...но мы всё-таки имели в виду, что вы продолжите использовать его как курорт горячих источников!"
10007105-82 = "Ну, вода всё равно рано или поздно иссякнет..."
10007105-83 = "Если мы не можем спасти источники, разве не выгоднее переделать здание под что-нибудь другое?"
10007105-84 = "Мы пытались взорвать подземную магматическую область, чтобы спасти их, но..."
10007105-85 = "Раз наш план сорвали, нам ничего не остаётся, кроме как выполнить план Б президента Касуми!"
10007105-86 = "[s] «План Б?»"
10007105-87 = "План Б: «Если горячий источник больше не горячий источник, незачем оставлять его как есть!»"
10007105-88 = "Мы знали, что такое может случиться, поэтому ещё при строительстве фундамента заранее заложили взрывчатку!"
10007105-89 = "В-Взрывчатку?"
10007105-90 = "То есть ты хочешь сказать, что мы сейчас стоим прямо над взрывчаткой?"
10007105-91 = "Ага. Наша президент Касуми всегда находит лучшее решение в любой ситуации. ♪"
10007105-92 = "Нам приказали взорвать всё, если администрация Красной Зимы попытается вмешаться!"
10007105-93 = "В мире нет бесполезных горячих источников! Есть только бесполезные здания!"
10007105-95 = ""
10007105-97 = ""
10007105-98 = "Ну что ж. Пора подрывать—"
10007105-99 = "[s] «П-Подожди—»"
10007105-100 = "Огонь!"
10007105-101 = ""
10007105-103 = ""
10007105-107 = "*БУМ*"
