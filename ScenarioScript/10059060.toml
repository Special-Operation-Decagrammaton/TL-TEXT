[translation]
10059060-1 = "Episode 6: The Phantom Thief Lurking in the Academy"
10059060-2 = "Judging by your expression... that overbearing Council President has been making unreasonable demands of you again, hasn't she?"
10059060-3 = "N-no, not at all. Unreasonable demands? Whatever do you mean?"
10059060-4 = "...Though, it is true that the situation is quite difficult."
10059060-5 = "If this continues, it won't just be me in danger—it will put Milia-sama at risk as well."
10059060-6 = "After all, I am the one who has been hiding you... the very person Manami-sama hates most of all."
10059060-7 = "I doubt she would let you off with just an expulsion."
10059060-8 = "Why not take this opportunity to have Manami-san step down from the stage? We should remove her from her position as Council President."
10059060-9 = "If we leverage the accumulated dissatisfaction, I don't think it's impossible—"
10059060-10 = "You have the 'Rose Garden' that you lead yourself, don't you? If you put your mind to it, you should be able to pull it off."
10059060-11 = "That... I cannot do."
10059060-12 = "I truly, sincerely respect her."
10059060-13 = "She reached the position of Council President even after experiencing 'that incident'."
10059060-14 = "If I were placed in the same situation... I could never hope to emulate her."
10059060-15 = "...Indeed. That point is worthy of respect."
10059060-16 = "I understand that our values differ from Manami-sama's."
10059060-17 = "But now is not the time for infighting. We must join hands and stand against our common enemy."
10059060-18 = "We cannot allow ourselves to be used at will by scum who see art only as a tool for making money."
10059060-19 = "I never expected to hear such harsh words from you."
10059060-20 = "No, it just goes to show how serious this problem is."
10059060-24 = "And I feel the same way. I have no intention of letting this matter slide."
10059060-25 = "Especially when the opponent is one of the Seven Prisoners."
10059060-26 = "So, you know... who the mastermind is?"
10059060-27 = "I have been gathering information in my own way as well."
10059060-28 = "The one pulling the strings behind this incident is likely the 'Broker of Greed'."
10059060-29 = "A member of the Seven Prisoners who uses milk distribution as a front to manage various illegal businesses on the black market."
10059060-30 = "If you know that much... surely you have a way to contact them?"
10059060-31 = "Unfortunately, no. Just because we are both Seven Prisoners doesn't mean we know each other well."
10059060-32 = "However, I do know someone who has connections to the Broker."
10059060-33 = "Someone who detests the idea of the Seven Prisoners fighting amongst themselves."
10059060-34 = "If we rely on them, we might find a lead to settle this commotion."
10059060-35 = "...It seems you have connections in the underworld."
10059060-36 = "Then, I will leave that to you."
10059060-40 = "Oh, and one more thing. Please don't forget this."
10059060-41 = "The fact that you are able to continue your academy life while hiding your true identity—it is all thanks to me."
10059060-42 = "Haha... that sounds like I'm holding your weakness over you to use you."
10059060-43 = "I apologize. I didn't mean it that way at all..."
10059060-44 = "Yes, I know. I am always grateful for your goodwill."
10059060-45 = "Ugh... hearing you say that is a relief."
10059060-46 = "Then, I leave the rest to you. I shall take my leave now..."
10059060-52 = "...Even though she is such a gentle person, there is no opening to exploit."
10059060-53 = "I suppose it's true what they say: beautiful roses have thorns."
10059060-55 = "The next day—"
10059060-62 = "Oh, Milia-sama. Are you heading out?"
10059060-63 = "Yes. Even in these circumstances, I cannot afford to neglect investigations outside the academy."
10059060-64 = "I hope I can find some information regarding the incident."
10059060-65 = "After all, we conducted such an extensive inspection inside, yet found nothing."
10059060-66 = "I wish you the best of luck! The future of the academy depends on it!"
10059060-67 = "You two should also do your best at your respective posts."
10059060-69 = "(To think the future of the academy depends on me. What a ridiculous notion.)"
10059060-71 = "An office in the downtown district"
10059060-74 = "It's me."
10059060-75 = "Please, come in."
10059060-81 = "Please forgive my sudden intrusion."
10059060-85 = "Don't worry about it. Come to think of it, it's been a while since we last met."
10059060-86 = "Please, have a seat. I have prepared some delicious tea and sweets for you."
10059060-91 = "I must say, I'm surprised. I never imagined your workplace would be in such a busy district."
10059060-92 = "They say the best place to hide a tree is in a forest, don't they?"
10059060-93 = "It's the same as you hiding yourself within Wildhunt."
10059060-94 = "So, how is academy life? Are you having any trouble?"
10059060-95 = "Actually, I have something to discuss regarding academy life."
10059060-96 = "Wildhunt has recently been caught in the middle of a major incident."
10059060-97 = "Someone is using students' artwork for money laundering."
10059060-98 = "As a student of Wildhunt, and as the Phantom Thief of Benevolence... I simply cannot overlook this."
10059060-99 = "Hmm."
10059060-100 = "The Broker did mention they were starting a new business..."
10059060-101 = "If you know their objective, would you mind explaining it to me?"
10059060-102 = "First, I apologize for the unpleasant experience you've had."
10059060-103 = "I should have been more careful."
10059060-104 = "The Broker likely proceeded without knowing you were at Wildhunt."
10059060-105 = "Only two people know Milia's true identity."
10059060-106 = "Myself—and the Vice President of the Wildhunt Art Council."
10059060-107 = "...Please add Sensei to that list as well."
10059060-108 = "Hmm. That is... How did you see through it?"
10059060-109 = "The moment we met."
10059060-110 = "As expected, you are not to be underestimated."
10059060-111 = "Well, considering what happened between you and that person, they wouldn't go around spreading your secret."
10059060-112 = "That is, at least, a silver lining."
10059060-113 = "Let's return to the subject."
10059060-114 = "If things continue like this, the conflict between you and the Broker will only deepen."
10059060-115 = "It has already exceeded the bounds of what is acceptable."
10059060-116 = "...It seems I have no choice but to intervene before things get out of hand."
10059060-117 = "That said, it's difficult to know how to approach it. I can't exactly tell the Broker about you."
10059060-118 = "If I'm not careful, another person will learn your secret."
10059060-119 = "And yet, my excuse for making them stop the business is a bit weak..."
10059060-120 = "Hmm... is there nothing we can do?"
10059060-124 = "...Ah."
10059060-125 = "Sensei is cooperating with the Council, aren't they?"
10059060-126 = "Yes. Actively."
10059060-127 = "I see."
10059060-128 = "In that case, we might be able to coordinate this effectively."
10059060-129 = "Let's contact them right away."
10059060-137 = "It's you."
10059060-138 = "It's been a while. Have you been well?"
10059060-139 = "Skip the pleasantries. What do you want?"
10059060-140 = "Time is money, right?"
10059060-141 = "I'm relieved to see you haven't changed."
10059060-142 = "Actually, I have something to discuss regarding the business you recently started."
10059060-143 = "I heard something concerning through a little connection of mine."
10059060-144 = "I heard someone's been sniffing around me. Is that what this is about?"
10059060-145 = "Schale is apparently throwing their weight behind the Wildhunt Art Council."
10059060-146 = "Sensei is aware, aren't they?"
10059060-147 = "Ah, that hypocrite."
10059060-148 = "So it was them."
10059060-152 = "I figured we'd clash eventually anyway."
10059060-153 = "Maybe this is a good chance to settle things."
10059060-154 = "Hmm. You're as combative as ever."
10059060-155 = "If possible, I would like you to avoid a conflict with Sensei for now."
10059060-156 = "For the sake of our cause, drawing unnecessary attention here is not a wise move."
10059060-157 = "So? You're telling me to pull out of this business?"
10059060-158 = "Are you mocking me?"
10059060-159 = "I told you before not to meddle in my affairs."
10059060-160 = "Do you want me to stuff you in a milk tank and sink you, too?"
10059060-161 = "I'm not telling you to pull out. I'm just saying we should act cautiously for the sake of our cause."
10059060-162 = "You're looking forward to 'that' thing I'm preparing, aren't you?"
10059060-163 = "...Tch."
10059060-164 = "Well..."
10059060-165 = "Like you said, if Schale is involved, it's going to be a pain."
10059060-166 = "I might even lose extra money..."
10059060-167 = "...Damn it."
10059060-172 = "Fine. I'll do you a favor and change my approach."
10059060-173 = "I'll find a way to settle this quickly without wasting time."
10059060-174 = "I'll send you the time and place, so pass it on to your 'connection'."
10059060-175 = "I'll settle this directly."
10059060-176 = "That is very much like you."
10059060-177 = "Just so you know—"
10059060-178 = "If you try anything funny, I won't let it slide."
10059060-179 = "Neither for you, nor for Sensei."
10059060-180 = "...Yes. I will keep that in mind."
10059060-184 = "Now, the stage is set."
10059060-185 = "The rest... I suppose it depends on the negotiation skills of Sensei and the Council?"
10059060-189 = "No."
10059060-190 = "This is a matter of pride for those of us involved in art."
