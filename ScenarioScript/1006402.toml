[translation]
1006402-1 = "Новое недоразумение"
1006402-2 = "Торговый комплекс с товарами повседневного спроса рядом с D.U."
1006402-3 = ""
1006402-4 = ""
1006402-5 = ""
1006402-6 = "...Прошу прощения."
1006402-7 = "О, простите. Я не заметил, как вы вошли..."
1006402-8 = "Простите, что отвлекаю вас во время перерыва... Я просто хотела купить кимоно."
1006402-9 = "О-о, конечно. Проходите за мной!"
1006402-10 = "Сюда..."
1006402-12 = "(Я занимаюсь кимоно уже десять лет...)"
1006402-13 = "(Этого достаточно, чтобы одним взглядом оценить человека и понять, чем он занимается.)"
1006402-14 = "(В это время года обычно приходят студенты, покупающие своё первое кимоно к церемонии совершеннолетия, но...)"
1006402-15 = "(Эти настороженные глаза, тщательно изучающие материал ткани, и пронзительная сосредоточенность, исходящая из самой души... Эта покупательница наверняка высокопоставленный член подпольной организации!)"
1006402-16 = "(Если я ошибусь и задену чувства клиентки, со мной может случиться что-нибудь ужасное...!)"
1006402-17 = ""
1006402-18 = "Н-не волнуйтесь, положитесь на меня. У нас широкий выбор кимоно для утончённых клиентов вроде вас!"
1006402-19 = "Я обязательно помогу подобрать лучшее кимоно, которое вам подойдёт!"
1006402-20 = "То есть мне не обязательно самое лучшее кимоно..."
1006402-21 = ""
1006402-23 = ""
1006402-24 = ""
1006402-25 = "Для начала как насчёт вот этого?"
1006402-26 = "Сшитое из лучшего шёлка, это привлекательное кимоно наверняка украсит ваш день, и никто не сможет отвести от вас глаз!"
1006402-27 = ""
1006402-29 = ""
1006402-30 = "Разве оно... не слишком открытое?"
1006402-31 = "Д-да... Как глупо с моей стороны было предлагать такое достойной клиентке вроде вас...!"
1006402-32 = "О-одну минутку!"
1006402-33 = ""
1006402-35 = ""
1006402-36 = ""
1006402-37 = "Т-тогда как насчёт этого?"
1006402-38 = "В этом красочном кимоно тигр и дракон, вручную вышитые золотыми нитями, будут устрашать всех вокруг!"
1006402-39 = ""
1006402-41 = ""
1006402-42 = "Разве это не... слишком броско?"
1006402-43 = "Конечно, вашей несокрушимой ауре и не нужны яркие украшения!"
1006402-44 = "Прошу прощения! П-перейдём дальше!"
1006402-45 = ""
1006402-47 = ""
1006402-48 = ""
1006402-49 = "Это доспех Ёрои, самый дорогой предмет одежды в нашем магазине!"
1006402-50 = ""
1006402-52 = ""
1006402-53 = "Это вообще не кимоно..."
1006402-55 = "И-и-и...?!"
1006402-56 = "П-Прости..."
1006402-57 = "Ох, пожалуйста, пощадите мою жизнь...!"
1006402-58 = "Стойте, вы о чём?"
1006402-59 = "[s] «Что здесь происходит?!»"
1006402-60 = "О, Сенсей...?"
1006402-61 = "[s1] «Я проходил мимо и услышал твой голос, Каёко.»\n[s2] «Что-то случилось?»"
1006402-62 = "Ну, видите ли…"
1006402-63 = "Ну, видите ли…"
1006402-65 = "Разобравшись в случившемся, я помог устранить недоразумение с продавцом."
1006402-66 = ""
1006402-67 = "А, понятно, простите. По вашему внешнему виду я решила, что вы член банды Курокамэ или другой высокопоставленной организации..."
1006402-68 = "Я неверно всё истолковала и сделала неправильный вывод... прошу прощения."
1006402-69 = "Не переживайте, я привыкла, что меня принимают за проблемную."
1006402-70 = "Раз теперь мы друг друга поняли, можно посмотреть другое кимоно? ...Желательно что-нибудь обычное."
1006402-71 = "Тогда... как насчёт вот этого?"
1006402-72 = "Думаю, этот элегантный чёрный дизайн хорошо подойдёт к цвету ваших волос. Поскольку модель рассчитана на студентов, приближающихся к церемонии совершеннолетия, цена тоже вполне разумная!"
1006402-73 = "Хм, дизайн мне нравится..."
1006402-74 = "Но чёрное кимоно не будет слишком мрачным? Меня и так постоянно принимают за бандитку."
1006402-75 = "Что думаете, Сенсей?"
1006402-76 = "[s3] «Мне кажется, Каёко оно отлично подойдёт.»\n[s4] «Оно точно удвоит милоту Каёко!»"
1006402-78 = "Ч-что? Что вы такое говорите..."
1006402-79 = "Серьёзно. Не дразните меня так, Сенсей."
1006402-80 = ""
1006402-82 = ""
1006402-83 = "Раз Сенсей его рекомендует, наверное, возьму это...?"
1006402-84 = "Хм? Вы уверены, что не хотите посмотреть другие варианты?"
1006402-85 = "Угу. Оно похоже на то, что я уже носила, и лично мне этот цвет одежды нравится больше всего."
1006402-86 = "...И Сенсей сказал, что ему нравится..."
1006402-87 = "Тогда хорошо, я упакую его для вас!"
1006402-88 = ""
1006402-90 = ""
1006402-91 = ""
1006402-92 = ""
1006402-93 = "В любом случае, я снова вам должна. Такое чувство, что вы постоянно мне помогаете, Сенсей."
1006402-94 = "Это мелочь, но в ответ в следующий раз покажусь вам в этом кимоно."
1006402-95 = "Я бы показала прямо сейчас, но надевать его довольно долго."
1006402-96 = "[s] «Ага, обязательно дай знать!»"
1006402-97 = "Тогда до следующей встречи, Сенсей."
