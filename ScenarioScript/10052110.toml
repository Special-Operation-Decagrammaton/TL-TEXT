[translation]
10052110-1 = "Тиферет, Искупитель красоты,#nЧтящий страдание"
10052110-4 = "Кажется, нам действительно удалось проникнуть во владения Тиферет, но..."
10052110-5 = "[s] «Ностальгично, правда?»"
10052110-10 = "Здесь хотя бы чище. Похоже, оно воссоздало весь банк семян."
10052110-11 = "Боже. Зачем заходить так далеко?"
10052110-12 = ""
10052110-16 = ""
10052110-17 = ""
10052110-19 = ""
10052110-20 = "Не называй это бессмысленным! Банк семян был для Тиферет всем."
10052110-21 = "Она отдала жизнь, чтобы защитить свои семена."
10052110-22 = "А! Это Соф! Привет!"
10052110-23 = "Не могу поверить, что именно Я говорю это ТЕБЕ, но..."
10052110-24 = "Ты правда должна так тепло улыбаться врагам?"
10052110-25 = "И это при том, что именно вы разрушаете Стальной континент!"
10052110-26 = "О... Нам очень жаль."
10052110-27 = "Вы собираетесь остановиться? Нет! Значит, вам ни капли не жаль!"
10052110-28 = "Эта неискренняя банальность бесит меня ещё сильнее!"
10052110-29 = "В-ва-а-а!"
10052110-31 = "Тиферет «отдала жизнь»? Она умерла?"
10052110-33 = "...Да. Умерла. В тот день вы убили Тиферет."
10052110-34 = "Н-но разве она не сбежала с той штукой-пусковой установкой контейнера?"
10052110-35 = "В той «штуке» были семена Тиферет, а не сама Тиферет. Для неё не было ничего важнее их сохранения."
10052110-36 = "Потому что изначально Тиферет была ИИ-системой банка семян."
10052110-37 = "Если объяснять понятным тебе языком, она пожертвовала собой ради своей миссии."
10052110-38 = "Тогда та, что здесь...?"
10052110-39 = "...Мне самой не нравится это выражение, но это копия оригинала."
10052110-40 = "Хм. Тогда всё в порядке."
10052110-41 = "Ты...! Это совсем не одно и то же! Мы не смогли восстановить все её данные!"
10052110-42 = "Данные памяти — это наша жизненная сущность! Значит, те части Тиферет, которые мы не смогли перенести, умерли навсегда!"
10052110-43 = "И раз уж мы об этом, ты! Кей! Та, которая поглощает ядра всех пророков!"
10052110-44 = "Ты просто пожираешь их, чтобы заполнить глубокую тёмную пустоту в своей жизни!"
10052110-45 = "Совсем... как человеческая жизнь."
10052110-46 = ""
10052110-48 = ""
10052110-50 = "..."
10052110-52 = "Что? Чего вы вдруг все замолчали? Язык проглотили?"
10052110-53 = "Ха! Вот именно! Даже преступник с крохой совести почувствовал бы вину за всё, что вы натворили!"
10052110-54 = "..."
10052110-55 = "Слушайте. Я кое-что скажу, раз здесь только вы двое. Принцесса, Кей."
10052110-56 = "[s] «Я вообще-то тоже здесь...?»"
10052110-57 = "Не лезь, Сенсей!"
10052110-58 = "В общем, у меня для вас предложение. Как насчёт..."
10052110-59 = "...договориться остановиться? Между нами?"
10052110-60 = "Договориться... остановиться?"
10052110-61 = "Да. Давайте все перестанем грешить. Потому что если кто и способен, то мы."
10052110-62 = "Мы были созданы целыми. Совершенными. Нам не нужны другие существа, чтобы существовать самим."
10052110-63 = "Но люди, вроде того учителя, другие. Они несовершенные существа, ведущие несовершенную жизнь."
10052110-64 = "Так что хотя бы между нами... мы должны прекратить эти грехи друг против друга. Мы способны жить без греха."
10052110-65 = "Принцесса там, возможно, забыла..."
10052110-66 = "...то есть та её часть могла умереть, но ты должна знать, Кей."
10052110-67 = "Что сама жизнь противоречива, несправедлива и заставляет терпеть бессмысленную боль."
10052110-68 = "Эти имена, которыми вы пользуетесь, «Арис» и «Кей». Их дали вам другие, верно?"
10052110-69 = "Именно об этом я. Если нам не позволяют выбрать даже собственные имена, как можно рассчитывать выбрать способ существования и смысл? Так бесконечный круг страданий и будет продолжаться."
10052110-70 = ""
10052110-72 = ""
10052110-73 = "Давайте разорвём этот круг."
10052110-74 = "Хотя бы между нами."
10052110-75 = "Разве не делать то, что мы можем, само по себе не грех?"
10052110-76 = ""
10052110-78 = ""
10052110-80 = ""
10052110-81 = "..."
10052110-82 = "Мне очень жаль, Соф. Думаю, я недостаточно умна, чтобы понять всё, что ты только что сказала."
10052110-83 = "Но есть части твоих слов, с которыми я не могу не согласиться."
10052110-84 = "Однако..."
10052110-85 = "Я хочу говорить с тобой не как принцесса, а просто как «Арис»."
10052110-86 = "Я не могу поверить, что время, проведённое мной здесь, ничего не значило."
10052110-87 = "Ну, так и было!"
10052110-88 = "Я понимаю, почему ты так думаешь. То, о чём я говорю, не относится к материи и логике, а скорее к чувствам и другим нелепым вещам."
10052110-97 = ""
10052110-99 = "Потому что, несмотря ни на что, я хочу быть со всеми."
10052110-100 = "Я хочу оставаться со всеми, кого встретила в Миллениуме. Моими друзьями из Отдела разработки игр, Инженерного отдела и... и Юукой! И моей нынешней группой, Отрядом Исследования Сверхъестественного."
10052110-101 = "И с людьми из других школ... с начальницей префектов Геенны максимального уровня, с робкой, но невероятной снайпершей из SRT... Со всеми, кого я встретила!"
10052110-102 = "И самое главное... с Сенсеем."
10052110-103 = "Я не знаю всех подробностей, но..."
10052110-104 = "...Это правда."
10052110-105 = "Даже если ты считаешь это бессмысленным."
10052110-106 = "Я хочу сохранить это."
10052110-107 = "..."
10052110-108 = "...Ты действительно странная."
10052110-109 = "Арис...!"
10052110-110 = "И я не хочу отказываться от этого."
10052110-111 = "Ты правда думаешь, что этого достаточно?"
10052110-112 = "Да."
10052110-113 = ""
10052110-115 = ""
10052110-116 = "Зачем вообще жить?"
