[translation]
1302-1 = "Президент всегда права, часть 2"
1302-2 = ""
1302-5 = "Поэтому ты станешь Пероро."
1302-7 = "Что значит «поэтому»?! Тут же гигантская логическая пропасть!"
1302-9 = "Я тут радовалась, что наконец покидаю Старый институт,#nчто моё отстранение наконец закончилось..."
1302-10 = "...а потом выясняется, что выйти отсюда я смогу, только если стану Пероро?#nЧто вообще происходит?!"
1302-11 = "Ты И ПРАВДА наконец отсюда уйдёшь. Если согласишься, будешь комфортно жить в главном корпусе. Даже пудинг получишь."
1302-12 = "Нужно только надеть этот костюм Пероро и заканчивать каждую фразу словом «перо»."
1302-13 = "Насколько отчаявшейся ты меня считаешь?!"
1302-14 = "Попроси кого-нибудь из своих дружков из Совета безопасности! Я не хочу надевать этот тупой костюм!"
1302-15 = "Уже просила. Он на них слишком маленький."
1302-16 = "Успех всей операции зависит от такой мелкой девчонки, как ты. Разве это не приятно?"
1302-17 = "Нет! Мне не приятно, и мне не нравится, что меня называют мелкой девчонкой!"
1302-18 = "И вообще, всё это бессмыслица! Пероро не существует!"
1302-19 = "Мне всё равно, что это приказ президента. Просто скажи ей, что это невозможно!"
1302-20 = "Ну, вообще-то ты права..."
1302-21 = ""
1302-22 = "Погодите. Товарищ Нодока. Вы намекаете, что президент Черина ошибается?"
1302-23 = "Как вы смеете столь нагло нарушать правила прямо перед председателем Совета безопасности!#nЯ подвергну вас чистке!"
1302-25 = "Хмф. Меня уже отстранили, так что твои жалкие угрозы не сработают!"
1302-26 = "Мне всё равно, вернусь я в главный корпус или нет. Я не надену ваш тупой костюм и не буду произносить ваши тупые реплики!"
1302-27 = "*вздыхает*"
1302-28 = "Я правда не хотела до этого доходить, но, похоже, ты не оставляешь мне выбора."
1302-30 = "Совет безопасности, несите сами-знаете-что!"
1302-31 = ""
1302-33 = ""
1302-35 = ""
1302-36 = ""
1302-37 = ""
1302-38 = ""
1302-39 = ""
1302-41 = ""
1302-42 = ""
1302-43 = ""
1302-46 = "Это... премиальный пудинг из L’Oiseau Bleu!"
1302-47 = "Ты пытаешься подкупить меня этим премиальным пудингом за 1000 иен?"
1302-48 = "Н-Не то чтобы я совсем не соблазнилась... но не думай, что меня так легко подкупить.#nТы ошибаешься... наверное!"
1302-50 = "О чём ты вообще?"
1302-51 = "Отстранённые студенты не заслуживают взяток. Я буду пытать тебя и сломаю твой дух!"
1302-53 = "Ты собираешься пытать меня пудингом? К-Как?!"
1302-54 = "*ням*"
1302-56 = "Т-ТЫ его ешь?!"
1302-57 = "Как жестоко. Теперь я всё понимаю. Ты знаешь, что я живу здесь в нищете и уже не помню сладкого вкуса пудинга..."
1302-58 = "...но эти страдания — ничто по сравнению с тем, через что я уже прошла."
1302-59 = "Хмф. Ну и ладно."
1302-60 = ""
1302-63 = "Т-Ты его выбрасываешь?!"
1302-64 = "К-Как ты смеешь?! Ты откусила всего один раз! А потом выбрасываешь, как... как...#nрасточительница!"
1302-65 = "Думаешь, я не подготовилась перед тем, как прийти сюда?"
1302-66 = "Ты уже долго живёшь в Старом институте, а значит, стала экономной. Теперь для тебя нет ничего ужаснее и мучительнее, чем выбрасывать еду."
1302-67 = "Так что, если не хочешь пережить настоящие страдания, советую сотрудничать."
1302-68 = "Ты и правда верная собачка президента Черины. Безжалостная и жестокая, председатель Марина."
1302-69 = "Но за время жизни в Старом институте я закалила волю!#nТы меня не сломаешь И не заставишь надеть этот тупой костюм."
1302-70 = "Как студент Красная Зима, я не могу не восхищаться твоей стойкостью.#nЧто ж, принимаю твой вызов."
1302-72 = "Совет безопасности! Несите следующий предмет!"
1302-74 = "(Пытки Марины продолжались...)"
1302-76 = ""
1302-77 = "Понятно. Значит, это твой любимый телескоп... Действительно, на нём дорогая высококачественная линза."
1302-78 = "Я весь день не мыла руки. Может, просто поводить липкими пальцами по линзе? Ты не против?"
1302-79 = "У-Убери руки от моего телескопа, чудовище!"
1302-81 = ""
1302-82 = "Следующее! Это мягкое перо, которое мне специально доставили по воздуху из Секретариата.#nИнтересно, сколько ты выдержишь моей щекотки?"
1302-84 = "*щекотка-щекотка-щекотка*"
1302-85 = "А-а-а! Х-Ха-ха... ха-ха-ха!"
1302-86 = "Л-Ладно, хорошо! Х-Ха-ха! Я... я сделаю всё, что хочешь! Ха-ха-ха!#nТолько п-перестань меня щекотать!"
1302-87 = "Не похоже! Что-то ты совсем не звучишь как Пероро!"
1302-89 = ""
1302-90 = "Хочешь попробовать жареный ананас с мятно-шоколадным соусом?"
1302-92 = "Пожалуйста, прекрати мои страдания..."
1302-94 = ""
1302-95 = "*вздыхает*"
1302-96 = "Полагаю, этого достаточно."
1302-97 = "Спрошу ещё раз. Как тебя зовут?"
1302-98 = "Нодо... То есть, П-Пероро."
1302-99 = "Не медведь. Не кролик. Пероро. Перо... перо..."
1302-101 = "Отлично, вот это настрой!"
1302-102 = "Теперь я смогу обмануть — то есть... доложить президенту Черине!"
1302-103 = "Я переведу эту фальшивую Пероро, получу особую медаль «Золотой ус»#nи стану ещё на шаг ближе к посту следующего президента!"
1302-105 = "Ну что, Нодока... или лучше сказать, товарищ Пероро? Идём."
1302-106 = "Это крайне важная миссия для академии Красная Зима. Ни одной ошибки не допускается!"
1302-107 = "П-Перо..."
