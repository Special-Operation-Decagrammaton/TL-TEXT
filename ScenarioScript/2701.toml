[translation]
2701-1 = "Вы арестованы! Часть 1"
2701-2 = "Бюро общественной безопасности «Валькирии»"
2701-3 = "В ленивый полдень под тёплым солнцем..."
2701-4 = "*вздох* Как же спокойно. Так спокойно..."
2701-5 = "Сегодня вообще нет ни открытых дел, ни особых поручений. Можно даже вздремнуть прямо на смене. Рай!"
2701-6 = "Вот бы в Кивотосе каждый день было так мирно..."
2701-7 = "Нет, так нельзя!"
2701-8 = "А? Ты что, не любишь мир, Кирино?"
2701-9 = "Ты хочешь сказать, что мечтаешь, чтобы в Кивотосе всегда царил хаос, злодеи каждый день совершали преступления, а студенты постоянно дрались между собой?"
2701-10 = "Иногда ты бываешь такой злой, Кирино..."
2701-11 = "Конечно, я не это имела в виду."
2701-12 = "Но если всегда будет спокойно, нам просто нечего будет делать."
2701-13 = "Мы не сможем доказать свою ценность начальству полицейской школы и так и останемся в Бюро общественной безопасности без всякой надежды на повышение!"
2701-14 = "А мне нравится Бюро общественной безопасности."
2701-15 = "Туда не попадают опасные или хлопотные дела. Всё, что нам нужно делать, — поддерживать порядок."
2701-16 = "Именно это мне в нём нравится МЕНЬШЕ ВСЕГО!"
2701-17 = "Я поступила в Полицейскую школу «Валькирия», потому что хотела ловить преступников, как полицейские, которыми я восхищалась. А занимаюсь только потерявшимися детьми и регулирую движение на переходах."
2701-18 = "Я понимаю, что это важная работа и в ней есть свои плюсы."
2701-19 = "И когда потерявшийся ребёнок тебя благодарит, на душе становится невероятно приятно, но всё равно! Мне этого мало!"
2701-20 = "Кирино, ты и правда вечно суёшь нос во всё подряд."
2701-21 = "Может, это потому что я старею, но после обеда у меня на эту работу совсем не остаётся сил."
2701-22 = "Но ты первокурсница, как и я, Фубуки! Поднимайся и проявляй больше энтузиазма!"
2701-23 = "Не нервничай так. Ты сама сказала: мы первокурсницы, значит, у нас ещё полно времени доказать свою ценность."
2701-24 = "Никогда не знаешь. Может, скоро случится крупное дело, где понадобится наша помощь—"
2701-26 = "Экстренный вызов! Всем сотрудникам Бюро безопасности вооружиться. Немедленно направляйтесь в пончиковую на пересечении 2-й авеню и 3-й улицы! Повторяю! Всем сотрудникам Бюро безопасности вооружиться..."
2701-27 = "Я уже собиралась винить свой длинный язык, но это не к нам."
2701-28 = "А пончиковая на 2-й авеню... Они про Master Donuts? Классика."
2701-29 = "Я позвоню в Бюро безопасности и узнаю, что происходит!"
2701-30 = ""
2701-31 = ""
2701-32 = "Директор, это Кирино из Бюро общественной безопасности!"
2701-33 = "Да, Кирино? Что случилось? Мы заняты подготовкой к выезду."
2701-34 = "Я только что слышала экстренный вызов. Что-то случилось в пончиковой?"
2701-35 = "Ничего особенного. Мелкий грабитель удерживает заведение и требует деньги."
2701-36 = "Вашему отделу не о чем беспоко—"
2701-37 = ""
2701-39 = ""
2701-40 = "Идём, Фубуки! Нужно добраться туда раньше Бюро безопасности и остановить преступника, чтобы доказать нашу ценность!"
2701-41 = "А? Но я не хочу..."
2701-42 = "К тому же мы даже буквально не оснащены для такого. У нас нет нужного оружия, и если что-то пойдёт не так, нас тоже возьмут в заложники."
2701-43 = "Почему бы просто не оставить это им, а самим расслабиться?"
2701-44 = "Прямо сейчас невинных гражданских держат в заложниках! Не время спорить, чья это обязанность — Бюро общественной безопасности или Бюро безопасности!"
2701-45 = "А если мы раскроем дело, начальство может даже наградить нас! Или ещё лучше... дать больше отпускных дней?"
2701-46 = "Отпускных дней? Вот теперь ты говоришь на моём языке."
2701-47 = "Ладно. Но если станет слишком опасно, я оттуда сразу сваливаю."
2701-48 = "Не переживай. Справедливость всегда победит, кто бы ни встал на её пути!"
