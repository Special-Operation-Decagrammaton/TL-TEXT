[translation]
52035-2 = "Guh... E-Elas são fortes...!"
52035-3 = "M-Mas...! Nós sabemos o ponto fraco dela!"
52035-10 = "Pessoal, mirem no braço direito dela!"
52035-21 = "Ei! Que golpe sujo é esse?!"
52035-25 = "Ingênua, Renge.#nQuem não escolhe meios numa luta acaba levando vantagem."
52035-27 = "Nagusa-senpai, agora!"
52035-32 = "...Eu ainda sou imatura a ponto de deixar descobrirem meu ponto fraco tão fácil."
52035-33 = "Mas... eu tenho todas vocês lutando ao meu lado."
52035-35 = "Guh...! Líder, não vamos aguentar mais!"
52035-36 = "Vamos desistir do haikai... e apostar tudo no próximo torneio de senryu!"
52035-38 = "Eu já disse que isso não tem nada a ver?!"
52035-42 = "Uugh... Vocês vão ver só!"
52035-52 = "Ei, ei, esperem aí?!"
52035-56 = "Quem são os insolentes atrapalhando o festival?!"
52035-57 = "Quanto o Clube Yin-Yang pagou de verba publicitária para—"
52035-62 = "P-Presidente! Sair correndo no meio da reunião já é demais...!"
52035-66 = "...Ué? Pessoal da Hyakkaryouran?"
52035-67 = "Hm? Ei, é verdade... Pessoal da Hyakkaryouran, o que fazem aqui?"
52035-68 = "Ouvimos dizer que \"tem gente lutando enquanto recita haikai\"...#nEntão achei que fosse o Clube de Pesquisa Ninjutsu..."
52035-73 = "Não, não, a gente é que entrou no meio pra acabar com a briga!"
52035-74 = "Aliás, o Clube de Pesquisa Ninjutsu faz esse tipo de coisa...?"
52035-75 = "Nós também não sabemos direito, mas acho que é tipo o que a Pina chama de \"cumprimento\"..."
52035-77 = "A Trupe Chimi estava causando problemas, então tentamos entrar para \"mediar\", mas..."
52035-78 = "Se acabamos incomodando, peço desculpas."
52035-79 = "Não, não, de jeito nenhum!"
52035-80 = "Toda vez que tem festival, a Trupe Chimi arruma confusão...#nSinceramente, já estávamos achando que não daríamos conta sozinhas.#nMuito obrigada mesmo."
52035-81 = "Em nome do Comitê e do distrito comercial, deixe-me agradecer."
52035-82 = "Fizemos apenas o nosso dever!#nProteger a justiça e repelir os arruaceiros...#nAfinal, esse é o trabalho de nós da Hyakkaryouran!"
52035-83 = "Sempre que estiverem em apuros, podem contar conosco!"
52035-84 = "...A propósito, tem uma coisinha relacionada à Momoyodou#nque eu gostaria de pedir a vocês..."
52035-86 = "Desculpe, no momento não estamos aceitando pedidos particulares.#nA menos que você esteja correndo algum perigo real."
52035-87 = "O trabalho da Hyakkaryouran é estritamente a mediação dentro da academia—"
52035-88 = "Que pena."
52035-89 = "Eu ia pedir para vocês provarem o nosso \"Dango de Castanha\" feito com creme de castanha especial de Trinity...#nAntes de colocarmos à venda no festival—"
52035-93 = "Mas se estão ocupadas, não tem jeito!#nVou pedir para outra pessoa experimentar..."
52035-94 = "...Eu disse que estamos ocupadas, mas..."
52035-99 = "Aah, que pena!#nA nossa senhorita Estrategista parece estar muito ocupada, então só sobramos nós três pra ir, né?"
52035-104 = "Ei, Renge!"
52035-105 = "Fufu, é brincadeira."
52035-109 = "Então, por aqui, pessoal!"
52035-116 = "Hmm, que doce...!"
52035-117 = "Isso é mesmo o dango que eu conheço?#nCombinado com esse creme macio e levemente adocicado...#nParece até outra sobremesa...!"
52035-118 = "Eu tinha certeza absoluta de que#ncreme ao estilo de Trinity não combinaria com doces tradicionais..."
52035-119 = "Esse aroma tostado que lembra bolinho de castanha,#njunto com a maciez única do creme,#ncombinam perfeitamente com o dango!"
52035-120 = "Yukari, você está com creme no canto da boca."
52035-121 = "Dango gruda nos dentes, então escove bem depois."
52035-125 = "M-Mas é claro!"
52035-127 = "Combinar o dango clássico com creme de castanha#né uma ótima releitura."
52035-128 = "Mas... como os dois são macios, a textura pode ficar um pouco monótona.#n...Que tal colocar um bolinho de frango entre os dangos?"
52035-129 = "Aí deixa de ser sobremesa, né?!"
52035-130 = "Fufu. Fico muito feliz que todas tenham gostado."
52035-131 = "Preparei estes dangos especialmente para vocês, que sempre se esforçam tanto pelo festival.#nPor favor, não façam cerimônia e comam à vontade!"
52035-132 = "Agradeço imensamente pela gentileza!#nPorém, vocês é que se dedicam dia e noite para animar Hyakkiyako..."
52035-133 = "Além disso, no último \"Festival das Lanternas\", acabamos baixando a guarda#ne causamos transtornos a vocês..."
52035-134 = "Que isso! Nós mesmas ficamos desmaiadas durante todo o incidente...!"
52035-135 = "Também deve estar sendo muito difícil para vocês sem a Presidente Ayame—"
52035-143 = "Ah... d-desculpem!"
52035-145 = "...Tudo bem, ela vai voltar."
52035-146 = "Quando isso acontecer, vou contar a ela o quanto todos estavam preocupados."
52035-147 = "...Obrigada. Contamos com você!"
52035-154 = "Com licença, sobre o muro ao redor do local do evento...#nComo choveu ontem à noite, pensei em reforçá-lo com sacos de areia."
52035-155 = "...Poderia me dar uma mãozinha?"
52035-159 = "Ah, o pessoal acabou de sair para buscar os materiais."
52035-160 = "Assim que alguém voltar, mando ajudar na hora—"
52035-164 = "Sendo assim, deixe isso com a Hyakkaryouran!"
52035-166 = "Isso aí, eu tava mesmo querendo mexer o corpo!"
52035-167 = "...Parece um bom exercício depois de comer."
52035-172 = "Ah, então... conto com vocês até o pessoal voltar!"
52035-173 = "Sim!"
52035-181 = "Pronto... Vou deixar aqui, então vão empilhando em ordem."
52035-182 = "Tomem cuidado porque é pesado."
52035-184 = "Relaxa. Já carreguei coisa assim até cansar nos treinos."
52035-189 = "Fufu. Depois de comer tantos dangos deliciosos, estou cheia de energia!"
52035-190 = "Nagusa-senpai, poderia me passar esse saco de areia aí?"
52035-191 = "Sim. Já vou passar—"
52035-198 = "Guh..."
52035-202 = "O que houve?! Que barulhão foi esse?!"
52035-203 = "S-Senpai! Você está bem?!"
52035-209 = "Estou bem. Só dei um mau jeito no pulso."
52035-210 = "Mas você parece estar com muita dor..."
52035-216 = "Nagusa-senpai... pode tirar a atadura do seu braço direito?"
52035-220 = "Não é nada grave..."
52035-225 = "Apenas tire."
52035-236 = "I-Isso é..."
52035-237 = "Dizer que não é nada grave é mentira..."
52035-238 = "Nagusa-senpai, desde quando está assim...?"
52035-240 = "É um ferimento daquela vez na Grande Planície Nevada. Vai sarar logo, não se preocupem."
52035-241 = "Nada disso! E se você perder o movimento do braço?!"
52035-242 = "Vamos pro hospital agora mesmo... não, melhor chamar uma ambulância?!"
52035-243 = "...Vocês estão exagerando."
52035-249 = "Nagusa-senpai, poderia me conceder um momento?"
52035-256 = "Talvez... possamos tratar isso na casa da família Kadenokouji."
52035-258 = "Próximo;A Nobre da Família Kadenokouji"
