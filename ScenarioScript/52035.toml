[translation]
52035-2 = "Ц... Я знала, что легко не будет!"
52035-3 = "Но я знаю постыдную тайну бледной!"
52035-4 = ""
52035-6 = ""
52035-8 = ""
52035-10 = "Все, цельтесь ей вправо! Правая рука — её слабое место!"
52035-11 = ""
52035-16 = ""
52035-18 = ""
52035-19 = ""
52035-21 = "Какая бесстыдность!"
52035-22 = ""
52035-24 = ""
52035-25 = "Ты слишком мягкая, Рэнгэ. В стратегии нет ни добродетели, ни стыда. Важна только победа."
52035-27 = "Нагуса, сейчас!"
52035-28 = ""
52035-31 = ""
52035-32 = "...Верно. Пусть моя слабость всем видна..."
52035-33 = "...у меня всё равно есть друзья, которые полагаются на меня и помогают стоять твёрдо."
52035-35 = "Ух... Босс, мы долго не выдержим!"
52035-36 = "Может, забудем про хайку и победим их на следующем конкурсе сэнрю!"
52035-38 = "Вы можете ПЕРЕСТАТЬ говорить о моём хайку?!"
52035-39 = ""
52035-41 = ""
52035-42 = "Гр-р-р... До следующего раза, Хяккарёран!"
52035-43 = ""
52035-45 = ""
52035-47 = ""
52035-48 = ""
52035-50 = ""
52035-52 = "Стойте. Секунду!"
52035-53 = ""
52035-55 = ""
52035-56 = "Кто пытается испортить наш фестиваль? Куда они делись?"
52035-57 = "Вы вообще представляете, сколько клуб Инь-Ян собрал денег, чтобы оплатить—"
52035-58 = ""
52035-61 = ""
52035-62 = "П-Президент, я понимаю ваше рвение, но нельзя просто уходить со встречи с руководством...!"
52035-63 = ""
52035-65 = ""
52035-66 = "...А? Хяккарёран?"
52035-67 = "Хм? И правда! Почему Хяккарёран..."
52035-68 = "...Когда я услышала про «битву хайку» на улице, подумала, что это Исследовательский клуб ниндзюцу. Но Хяккарёран? Кто бы мог подумать."
52035-69 = ""
52035-72 = ""
52035-73 = "Не говори ерунды! Мы как раз прекращали драку!"
52035-74 = "...И вообще, у Исследовательского клуба ниндзюцу правда бывают «битвы хайку»?"
52035-75 = "Не знаю подробностей. Пина говорит, они часто выкрикивают всякие фразы."
52035-77 = "Некоторые Моурё пытались саботировать эту выставку хайку. Мы пришли с надеждой мирно урегулировать ситуацию."
52035-78 = "Однако конфликт обострился. Приносим извинения за то, что помешали подготовке фестиваля."
52035-79 = "Нет, пожалуйста! Мы благодарны за помощь!"
52035-80 = "Моурё врываются на каждый фестиваль, сколько бы мы ни вкладывали в охрану. Хяккарёран очень помогает!"
52035-81 = "От имени Фестивального отдела и торговой гильдии Хяккияко хочу выразить благодарность."
52035-82 = "Священный долг Хяккарёран — охранять справедливость и обуздывать хаос! Мы желаем вам лишь мирного и процветающего фестиваля!"
52035-83 = "Если понадобится помощь, зовите Хяккарёран в любое время дня и ночи!"
52035-84 = "О, как забавно, что ты это сказала. Раз уж предлагаете, Момоёдо не помешали бы помощники!"
52035-86 = "Прости, но мы не занимаемся выполнением чьих-то личных поручений."
52035-87 = "Долг Хяккарёран — обеспечивать безопасность академии и урегулировать конфликты."
52035-88 = "О? Жаль."
52035-89 = "Мы надеялись, что вы попробуете новые каштановые данго со специальным кремом маррон из Тринити, которые дебютируют на этом фестивале."
52035-90 = ""
52035-92 = ""
52035-93 = "Но если Хяккарёран так занят, найдём кого-нибудь другого."
52035-94 = "П-Подожди. Хотя мы И заняты, возможно..."
52035-95 = ""
52035-98 = ""
52035-99 = "Жаль! Похоже, офицер операций вся связана благородными обязанностями. Значит, придётся есть нам троим..."
52035-100 = ""
52035-103 = ""
52035-104 = "Рэнгэ!"
52035-105 = "Фу-фу, шучу. Хватит на всех."
52035-106 = ""
52035-108 = ""
52035-109 = "Ну же, идите за мной!"
52035-115 = ""
52035-116 = "Так сладко... Просто невероятно!"
52035-117 = "Это правда данго? Внутри такое мягкое и нежное!"
52035-118 = "Потрясающе! Кто бы додумался сочетать крем с вагаси?"
52035-119 = "А насыщенный аромат каштанов напоминает мандзю, но при этом прекрасно оттеняет естественную солоноватость данго!"
52035-120 = "Юкари, у тебя на лице каштановый крем."
52035-121 = "И не забудь сразу потом почистить зубы. Не стоит оставлять липкий десерт между коренными зубами."
52035-122 = ""
52035-124 = ""
52035-125 = "К-Конечно! Я и сама знала!"
52035-127 = "Весьма новаторски. Вы сохранили традиционную привлекательность данго и добавили новизну кремом."
52035-128 = "Однако текстура немного утомляет. Может, положить между шариками данго цукунэ?"
52035-129 = "Тогда это уже не десерт!"
52035-130 = "Хи-хи! Я рада, что всем нравится."
52035-131 = "Мы сделали их специально для Хяккарёран, чтобы поблагодарить вас за тяжёлую работу. Пожалуйста, ешьте сколько хотите!"
52035-132 = "Вы слишком щедры! Именно вы, Фестивальный отдел, оживляете Хяккияко каждый сезон."
52035-133 = "Кроме того, на прошлом Фестивале фонарей мы... довольно сильно разочаровали. Вы нам совершенно ничего не должны."
52035-134 = "Ерунда! В прошлый раз Фестивальный отдел был полностью завален делами. Мы почти совсем не помогли."
52035-135 = "Кроме того, Хяккарёран, наверное, было ужасно тяжело, ведь президент Аямэ как раз исчезла—"
52035-136 = ""
52035-138 = ""
52035-140 = ""
52035-142 = ""
52035-143 = "А-Ах... Простите! Я не хотела—"
52035-145 = "...Всё нормально. Аямэ вернётся."
52035-146 = "Когда вернётся, я передам ей ваши добрые пожелания."
52035-147 = "Спасибо. Тогда я... эм, оставлю вас."
52035-148 = ""
52035-150 = ""
52035-153 = ""
52035-154 = "Эм, простите. Видите ли... мы укрепляем насыпь вокруг центральной площадки. Из-за недавних дождей она просела."
52035-155 = "Мы укрепляем основание мешками с песком, но нам не помешало бы несколько сильных рук."
52035-156 = ""
52035-158 = ""
52035-159 = "Прости, но сейчас я никого не могу выделить. Все ушли за припасами."
52035-160 = "Можете немного подождать? Когда все вернутся, я сама приведу их—"
52035-161 = ""
52035-164 = "Если под угрозой безопасность фестиваля, Хяккарёран придёт на помощь!"
52035-166 = "Конечно. Мне как раз не помешает размяться."
52035-167 = "...Звучит как идеальная тренировка после сладкого."
52035-168 = ""
52035-171 = ""
52035-172 = "Отлично! Тогда оставляю это вам — хотя бы пока остальные не вернутся!"
52035-173 = "Мы не подведём!"
52035-180 = ""
52035-181 = "...Этого должно хватить. Я положу эти мешки сверху насыпи, так что складывайте их по порядку."
52035-182 = "Они тяжёлые, передавайте осторожно."
52035-184 = "Не переживайте! Они не тяжелее моих тренировочных грузов."
52035-185 = ""
52035-187 = ""
52035-189 = "Фу-фу. Может, дело во всех этих данго, но энергии во мне хоть отбавляй!"
52035-190 = "Нагуса, передашь мне тот мешок?"
52035-191 = "Да. Вот—"
52035-192 = ""
52035-194 = ""
52035-195 = ""
52035-198 = "...Ух."
52035-199 = ""
52035-201 = ""
52035-202 = "Что происходит? Что это был за звук?"
52035-203 = "Н-Нагуса! Ты в порядке?"
52035-204 = ""
52035-206 = ""
52035-208 = ""
52035-209 = "Конечно. Просто... растянула запястье."
52035-210 = "Но тебе явно больно..."
52035-211 = ""
52035-213 = ""
52035-215 = ""
52035-216 = "Нагуса, сними бинты и покажи мне правую руку."
52035-217 = ""
52035-219 = ""
52035-220 = "Я же сказала, ничего страшного..."
52035-221 = ""
52035-223 = ""
52035-224 = ""
52035-225 = "Покажи."
52035-226 = ""
52035-228 = ""
52035-229 = ""
52035-235 = ""
52035-236 = "Это..."
52035-237 = "...На растяжение совсем не похоже."
52035-238 = "Нагуса, как давно твоя рука выглядит так?"
52035-240 = "На Великом снежном поле был... небольшой инцидент. Скоро заживёт, так что не переживай."
52035-241 = "«Скоро заживёт»? А если рана загноится и ты вообще потеряешь возможность пользоваться рукой?"
52035-242 = "Тебе нужен врач, прямо сейчас! ...Постой, вызвать скорую?"
52035-243 = "...Не нужно устраивать сцену."
52035-244 = ""
52035-246 = ""
52035-248 = ""
52035-249 = "Нагуса, если позволишь..."
52035-250 = ""
52035-253 = ""
52035-255 = ""
52035-256 = "Думаю... семья Кадэнокодзи может тебе помочь."
52035-258 = "Следующий эпизод;Почётная гостья семьи Кадэнокодзи"
