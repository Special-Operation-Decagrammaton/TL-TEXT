1003502-72 = "Книги, которые брали... Когда их наконец вернули, они были в плохом состоянии."
1003502-73 = "Читатели загибали страницы вместо закладок, а переплёты разошлись, потому что книги слишком сильно прижимали при открывании."
1003502-74 = "*вздыхает*"
1003502-75 = "Это ещё одна причина, почему я не люблю иметь дело с посторонними.#nИ всё же я должна была что-то сказать насчёт выдачи книг..."
1003502-76 = "Прошу прощения. Впредь я буду держать себя в руках."
1003502-77 = "Хм? Дело не в этом?"
1003502-78 = "Вы... хотите, чтобы я чаще рассказывала вам о подобных вещах? Но разве это не будет лишь неудобством для вас?"
1003502-79 = "Вы хотите сказать, что..."
1003502-80 = "...это ваша работа — выслушивать?"
1003502-81 = "Я-Я даже не знаю, как к этому относиться... но хорошо. Спасибо, Сенсей."
1003502-82 = "Хм..."
