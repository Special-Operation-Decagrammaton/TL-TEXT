1003502-57 = "Внутри старой библиотеки"
1003502-58 = "Я последовал за Уи внутрь старой библиотеки. Как и ожидалось, в ней чувствовалось очарование старины."
1003502-59 = "Краем глаза я заметил одежду и разные вещи, которые она явно только что привела в порядок."
