1003502-62 = "Простите... Я бы попросила остальных помочь с уборкой, если бы знала, что вы придёте."
1003502-63 = "В эту библиотеку почти никто не заходит."
1003502-64 = "Большинство студентов берут книги в Центральной библиотеке, если только им не нужно что-то очень старое."
1003502-65 = "В-В любом случае. Что привело вас сюда сегодня?"
1003502-66 = "Вам было нужно что-то особенное? Например, книга, которой нет в каталоге Центральной библиотеки?"
1003502-67 = "То есть... вы пришли НЕ за этим?"
