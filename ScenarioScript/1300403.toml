1300403-10 = ""
1300403-11 = "(Я застал Нономи за уборкой клубной комнаты.)"
1300403-12 = "А? Сенсей?"
1300403-13 = "Ух ты! Вы правда пришли!"
1300403-14 = "Только... вы немного рановато. Я только начала уборку."
1300403-15 = "Если хотите увидеть чистую комнату, придётся подождать несколько часов... Что будем делать?"
1300403-16 = "[s] «Почему ты убираешь всё одна?»"
1300403-17 = "А? Ну, у остальных по выходным подработка в библиотеке. Поэтому уборка достаётся мне."
1300403-18 = "Тяжело одновременно находить время на учёбу и работу ради выплаты долга академии..."
1300403-19 = "Поэтому уборка на мне."
1300403-20 = "Ага! Я не против, и так всё даже удобнее. В конце концов, это наше общее пространство."
1300403-21 = "Чистота в школе создаёт здоровую среду для учёбы!"
1300403-22 = "Так что не могли бы вы вернуться через несколько часов, Сенсей? Обещаю, к тому времени всё будет сиять."
1300403-23 = "[s1] «Позволь и мне помочь.»\n[s2] «Почему бы не убрать вместе?»"
1300403-24 = "Но... это ведь обязанность студента, а не ваша."
1300403-25 = "Но... это ведь обязанность студента, а не ваша."
1300403-26 = ""
1300403-27 = "...Хорошо! Раз вы настаиваете, Сенсей."
1300403-28 = ""
1300403-29 = "Спасибо за помощь. Вот ваша метла!"
1300403-31 = "(После этого мы с Нономи тщательно убрали комнату.)"
1300403-33 = "Ух ты, здесь теперь настолько чисто, что с пола можно есть!"
1300403-34 = "Ага! И вдвоём мы закончили за рекордное время."
1300403-35 = "После уборки я чувствую себя немного иначе, чем обычно. Может, это... гордость?"
1300403-36 = "Наверное, потому что работала вместе с вами."
1300403-38 = "(Мы с Нономи болтали в чистой клубной комнате, пока не начало темнеть."
