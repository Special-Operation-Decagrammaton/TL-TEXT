[translation]
2005805-1 = "Эрика, торговый автомат"
2005805-2 = "Я закончил работу в Геенне и перед уходом решил заглянуть к автомату с напитками."
2005805-4 = "[ns] «Что бы выпить...?»"
2005805-6 = "Как раз когда я собирался выбрать..."
2005805-7 = "Вот это ужасное."
2005805-8 = ""
2005805-11 = ""
2005805-12 = "[ns] «О, Эрика!»"
2005805-13 = "Лучше возьмите соседний."
2005805-14 = "На один слот вправо, да. Вот этот."
2005805-15 = "[s] «Я тебе доверяю.»"
2005805-16 = "Угу. Этот довольно хороший."
2005805-17 = ""
2005805-20 = "[ns] «Я доверяю тебе ВСЁ!!»"
2005805-21 = "Да не настолько всё серьёзно. Просто попробуйте!"
2005805-22 = ""
2005805-25 = "[ns] «О... Вкусно!»"
2005805-26 = "Вот видите? Я знала, что вам понравится."
2005805-27 = "Откуда знала? Вы рассказывали мне... в прошлый раз, когда мы ели вместе."
2005805-28 = "[s1] «Ты запомнила?»\n[s2] «Я так тронут!»"
2005805-31 = "Да, я запомнила, что вы брали его отдельно!"
2005805-32 = "Фуфу, а вы? Помните, что нравится мне?"
2005805-33 = "Попробуйте выбрать напиток для меня!"
2005805-34 = "[s] «Я внезапно начал нервничать...»"
2005805-35 = "Никаких последствий. Не переживайте."
2005805-36 = "..."
2005805-37 = "О... Вот это выберете?"
2005805-38 = "..."
2005805-39 = "А-а-а они поняли намёк! Сенсей движется в другую сторону."
2005805-40 = "[ns] «В-Вот этот!!»"
2005805-42 = "А..."
2005805-43 = "Непло-о-охо."
2005805-44 = "Хороший выбор! Один из моих любимых."
2005805-45 = "Вы ведь просто угадали, да?"
2005805-46 = "А? Просто «чутьё»?"
2005805-47 = "Холодный, без газа, и газировка вместо фруктового сока?"
2005805-48 = "..."
2005805-49 = "Ого. Вы правда довольно тщательно всё обдумали."
2005805-50 = "У вас хороший вкус, Сенсей."
2005805-51 = "А, если не сложно, откроете мне? С длинными ногтями неудобно."
2005805-52 = "[s] «Хе, оставь это мне!»"
2005805-53 = "Ого, как вы гордитесь, что угадали."
2005805-54 = ""
2005805-57 = "[ns] «Ай!»"
2005805-58 = "Ах...! Вы порезались?"
2005805-59 = "О, край острый..."
2005805-60 = "У меня есть пластырь. Давайте заклею."
2005805-61 = ""
2005805-63 = ""
2005805-64 = ""
2005805-65 = "Вот, дайте руку."
2005805-66 = "Ух... Выглядит больно. Простите, что попросила открыть."
2005805-67 = "Нет, это не «ничего страшного». Мне правда неловко."
2005805-68 = "[s] «Я удивлён, что у тебя с собой пластыри.»"
2005805-69 = "Многие девушки здесь довольно неуклюжие и часто получают мелкие травмы."
2005805-70 = "Думаете, я «добрая»? Аха. Я такая же, как все."
2005805-71 = ""
2005805-73 = ""
2005805-74 = "А... Это «слишком мило для взрослого»?"
2005805-75 = "В этом и секрет. Пластырь милый, значит, заживёт в два раза быстрее."
2005805-76 = "[s] «Не думаю, что эти вещи связаны...»"
2005805-77 = ""
2005805-79 = ""
2005805-80 = "Так, готово..."
2005805-81 = "..."
2005805-82 = "О, знаете..."
2005805-83 = "Сенсей, приложите ладонь к моей?"
2005805-84 = "Да. Вот так..."
2005805-85 = ""
2005805-87 = ""
2005805-90 = "А..."
2005805-91 = "Я и раньше замечала, но ваша рука такая тёплая..."
2005805-92 = "[s] «А твоя очень мягкая.»"
2005805-93 = "..."
2005805-94 = "Д-Да? Мягкая — это хорошо, правда? Хаха."
2005805-96 = "..."
2005805-97 = "К-Кхм. Похоже, благодаря этой случайной встрече я ещё и выманила у вас напиток. Большое спасибо."
2005805-98 = "Но вы потратили на меня деньги и ещё порезались... Похоже, в выигрыше осталась только я."
2005805-99 = "[s] «До следующего раза, Эрика.»"
2005805-100 = "..."
2005805-101 = ""
2005805-103 = ""
2005805-104 = "Да! Ещё увидимся, Сенсей."
