[translation]
10027060-1 = "Эпизод 6;Недоделка"
10027060-2 = "Съезд фанфиков"
10027060-3 = ""
10027060-5 = "[ns] «Мэру, нельзя просто написать книгу в мгновение ока...»"
10027060-6 = "Сенсей прав. Нужен план. Как ты собираешься по прихоти написать целую концовку?"
10027060-7 = "Ведь ещё совсем недавно ты даже не знала, что «Луна» существует."
10027060-8 = "Ух. Не напоминай..."
10027060-9 = "Я обязана напомнить. Это проблема..."
10027060-10 = "О... С другой стороны, если ты напишешь фанфик по «Луне» ..."
10027060-11 = "Эм, от этого выражения лица мне становится не по себе."
10027060-12 = "Мне это не нравится. Совсем не нравится."
10027060-13 = "Тебе что именно не нравится? О чём ты?"
10027060-14 = "Ты едва ли вообще фанат «Луны», и вдруг тебя потянуло писать фанфик? Ты этого не заслужила! Я настоящий фанат «Луны»! Я полюбила её первой!"
10027060-15 = "И какая разница?!"
10027060-16 = "[s] «Я понимаю, почему она так думает.»"
10027060-17 = "И вы туда же, Сенсей?!"
10027060-18 = "А-а-а! Это просто потому, что ты держишь на меня обиду, Таканэ!"
10027060-19 = "Как критик и настоящий фанат «Луны», именно я наиболее квалифицирована высказывать мнение по этому вопросу."
10027060-20 = ""
10027060-22 = ""
10027060-23 = "Ну... ладно. В этом есть смысл."
10027060-24 = "И как читатель я ведь тоже не то чтобы совсем не понимаю!"
10027060-25 = "Но... я правда хочу рисовать и создавать!"
10027060-26 = "Хм... Продолжай."
10027060-27 = "Признаю, я была неправа, когда начала критиковать произведение, даже не подумав о мнении Момидзи."
10027060-28 = "Я задела её чувства, разозлила её и запустила весь этот бардак. Во всём виновата я."
10027060-29 = "Я слышу признание ответственности? Ты же никогда не идёшь на компромиссы... Мэру, как же ты выросла!"
10027060-30 = "Расскажи, что же привело к такому моменту личностного роста?"
10027060-31 = "...Фанаты и их работы."
10027060-32 = "За пределами Красной Зимы проходит огромный официальный съезд."
10027060-33 = "И фанаты с радостью создавали истории и приносили их, чтобы поделиться."
10027060-34 = "..."
10027060-35 = "Я изучу всё, что потребуется."
10027060-36 = "Я хочу рисовать. Чувствую, что это правильно. Уверена, именно это мне и нужно сделать."
10027060-37 = "...Как я всегда говорю, желание вдохновляет творчество."
10027060-38 = "Думаю, ты, возможно, права."
10027060-39 = "...Да."
10027060-40 = "Но конечно, как давний фанат «Луны», ты бы никогда это не одобрила..."
10027060-41 = "Знаешь что... Я дам тебе четыре дня, Мэрури."
10027060-42 = "Ты ставишь мне срок?! Но это же так мало!"
10027060-43 = "Если хочешь получить эту возможность, придётся уложиться. Ты ведь сама хотела это сделать, верно?"
10027060-44 = "Почему ты вдруг передумала? И что за срок в четыре дня?"
10027060-45 = "Потому что через четыре дня состоится в этом году «Официальный съезд 22-го тома Луны»."
10027060-46 = "[s] «А? Он отличается от этого мероприятия?»"
10027060-47 = "Да, это лишь преддверие главного события."
10027060-48 = "Всё, что вы сегодня здесь видели, — фанфики, поданные на предыдущие съезды 22-го тома."
10027060-49 = "Цель мероприятия этого года — найти новый выдающийся 22-й том «Луны»."
10027060-50 = "И это произойдёт через четыре дня."
10027060-51 = "Если хочешь нарисовать 22-й том «Луны» и сделать всё как следует, тебе стоит участвовать."
10027060-52 = "Ты сказала, у меня четыре дня...?"
10027060-53 = "Если хочешь участвовать в нашем официальном съезде и представить свою версию 22-го тома «Луны», тогда да."
10027060-54 = "О, и поскольку Момидзи тоже фанат, тебе стоит рассказать ей. Раз вы обе любите «Луну», ты должна гордиться тем, что покажешь ей свою работу."
10027060-55 = "Меня беспокоят только крики и ругань, которые начинаются у тебя перед дедлайном."
10027060-56 = "Если ты думаешь, что это много ругани..."
10027060-57 = "Просто знай: если ты примешь участие в официальном съезде и подашь свой 22-й том..."
10027060-58 = "...будь он мусором или шедевром..."
10027060-59 = "...как лучший критик Красной Зимы и президент клуба «Луны» ..."
10027060-61 = "...я лично его оценю."
10027060-62 = ""
10027060-66 = "[ns] «...»"
10027060-67 = "...Сенсей? Почему вы так на меня смотрите?"
10027060-68 = "[s1] «Я был уверен, что после этих слов ты рассмеёшься.»\n[s2] «Ну знаешь, как следует, от души, после хорошей шутки.»"
10027060-71 = "Не понимаю."
10027060-72 = "Ну, я могла бы сказать: «Да ты слишком много о себе думаешь! Ты не судья! Мне не нужно твоё одобрение!»"
10027060-73 = "И ещё несколько дней назад я именно так на тебя и накричала бы."
10027060-74 = "Но сейчас не хочу. В конце концов, именно благодаря тебе я вообще здесь."
10027060-75 = "Что ты сказала? Прости, я не расслышала. Можешь повторить ГОРАЗДО громче?"
10027060-76 = "Нет! Если не услышала с первого раза, это твоя проблема."
10027060-77 = "В любом случае, может, сложный дедлайн — именно то, что мне нужно. В этот раз я подыграю твоему плану."
10027060-79 = "Так я смогу создать что-то, чем мы с Момидзи обе сможем наслаждаться!"
10027060-80 = "С нетерпением жду, что у тебя получится. Из любезности выражаю тебе полную поддержку. Постарайся."
10027060-82 = ""
10027060-86 = "Библиотека Красной Зимы"
10027060-87 = "Угх... Мы вернулись..."
10027060-88 = "[s] «Такое чувство, будто мы целый день топали по снегу...»"
10027060-89 = "Потому что так и было, глупенький — ещё и с охапкой книг!"
10027060-90 = "[s3] «Но они такие тонкие!»\n[s4] «Как они могут столько весить?»"
10027060-93 = "Хмф! Никогда не недооценивайте фанфики! Каждая книга тонкая и лёгкая."
10027060-94 = "Но когда их много вместе, становится довольно тяжело."
10027060-95 = "Со мной это постоянно случается. Накупишь кучу книг, без которых жить не можешь, а стопка тянет вниз. И ещё у них есть неприятный побочный эффект — кошелёк становится легче."
10027060-96 = "Несёшь всю стопку, пока кажется, что руки вот-вот отвалятся, а люди смотрят на тебя как на двухголовую. Остаётся только уставиться в пол и надеяться, что они когда-нибудь уйдут."
10027060-97 = "Но со мной такого, конечно, никогда не было."
10027060-98 = "[s] «Уж слишком подробное описание—»"
10027060-99 = "Пора начинать исследование!"
10027060-100 = "[s] «Уже?!»"
10027060-101 = "Что значит «уже»? У нас всего четыре дня. Время летит, каждая минута на счету!"
10027060-102 = "Но я хотела кое-что сказать..."
10027060-103 = "Я знаю, что упрямлюсь, Сенсей, и сама всё себе усложнила. Но я выбрала это и намерена сделать всё как следует."
10027060-104 = "Но это не значит, что вам обязательно потакать мне..."
10027060-105 = "[s] «Конечно, буду! Ты с самого начала попросила меня о помощи, и теперь я тебя не брошу!»"
10027060-106 = "Ух! Вы просто ждали момента, чтобы сказать эту клишированную фразу, да? Но почему-то я и так знала, что вы останетесь со мной."
10027060-107 = "...Вы очень добры, Сенсей. Думаю, именно поэтому я так вам доверяю."
10027060-108 = "Кхм! Ну что ж! Я купила кучу фанфиков для вдохновения, так что пора анализировать. К концу дня я должна успеть сделать черновик!"
10027060-110 = "И так начался четырёхдневный марафон Мэру по рисованию..."
10027060-112 = ""
10027060-114 = "Осталось 4 дня"
10027060-116 = ""
10027060-117 = ""
10027060-118 = "...Этим фанфикам нет конца!"
10027060-119 = "[s] «Вес истории, должно быть, велик...»"
10027060-120 = "Ух... Смена планов. Так не пойдёт. Только на чтение всего этого уйдут четыре дня!"
10027060-121 = "Придётся сразу начать работать, а к этим книгам обращаться, когда застряну!"
10027060-122 = "Сенсей, а вы просто продолжайте хорошо работать!"
10027060-124 = ""
10027060-133 = "Осталось 3 дня"
10027060-135 = ""
10027060-136 = ""
10027060-137 = ""
10027060-138 = ""
10027060-139 = ""
10027060-140 = ""
10027060-141 = ""
10027060-142 = ""
10027060-143 = ""
10027060-144 = ""
10027060-146 = "[ns] «Мэру, тебе нужно поспать.»"
10027060-147 = "Нет... Не могу... Сейчас каждая минута драгоценна..."
10027060-148 = "А? Сенсей, куда вы меня ведёте? О, хотите, чтобы я села... здесь...?"
10027060-150 = ""
10027060-156 = "Мэру заснула в ту же секунду, как села."
10027060-157 = "Я не мог оставить её так. Она бы проспала до полудня следующего дня и чувствовала себя ужасно..."
10027060-158 = ""
10027060-162 = "[ns] «Мэру, просыпайся. Сначала нужно почистить зубы и умыться.»"
10027060-163 = "Но... Вы же только что сказали мне сесть... а я так устала... Зачем вы хотите, чтобы я вставала?"
10027060-164 = "[s] «Если всю ночь проспишь в кресле, утром будет ужасно. Давай.»"
10027060-165 = "Не-е-ет... Я хочу спать прямо сейчас... Пожалуйста..."
10027060-166 = "[s] «Ну же. Это несложно. Ты ведь хорошая и ответственная девочка, правда? Иди приведи себя в порядок.»"
10027060-167 = "Я не настолько хорошая девочка..."
10027060-168 = ""
10027060-170 = ""
10027060-171 = ""
10027060-172 = ""
10027060-173 = ""
10027060-175 = ""
10027060-178 = "Осталось 2 дня"
10027060-180 = ""
10027060-181 = "Сенсей... Сколько я проспала?"
10027060-182 = "[s] «Может, чуть меньше трёх часов?»"
10027060-183 = "А сколько часов я работала?"
10027060-184 = ""
10027060-187 = "[ns] «Как минимум тринадцать.»"
10027060-188 = "Хех... Хехех..."
10027060-189 = "Это ад."
10027060-191 = ""
10027060-198 = ""
10027060-199 = ""
10027060-200 = "[ns5] «О, добро пожаловать, Таканэ.»\n[ns6] «Что привело тебя сюда? У Мэру ведь ещё есть время, да?»"
10027060-203 = "Кхм. Я здесь всего лишь ради... проверки."
10027060-204 = "Я ни в коем случае не пришла потому, что беспокоилась о Мэрури."
10027060-205 = "И что же я вижу, придя в библиотеку Фронта освобождения знаний? Сенсей и Мэрури полумёртвые лежат на полу..."
10027060-206 = "А когда я спрашиваю, что случилось, вы способны только показать мне эту книгу?"
10027060-207 = ""
10027060-209 = ""
10027060-210 = ""
10027060-212 = "[ns] «Верно... Таканэ...»"
10027060-213 = "Сенсей, у вас сил хватило только на поднятый большой палец?"
10027060-214 = "Мэрури? Скажи что-нибудь..."
10027060-215 = ""
10027060-218 = ""
10027060-219 = "...Хр-р-р..."
10027060-221 = "Ну, она отключилась. В полном отрубе."
10027060-222 = "Раз уж я здесь, посмотрю. Значит, это дело всей её жизни, да?"
10027060-223 = "Как критик, я должна оставаться объективной... Но могу учесть и личное мнение как президент фан-клуба «Луны»."
10027060-224 = "[s] «Пожалуйста, будь с ней помягче.»"
10027060-225 = "Ну тогда..."
10027060-226 = ""
10027060-228 = ""
10027060-229 = ""
10027060-230 = ""
10027060-231 = ""
10027060-232 = ""
10027060-233 = ""
10027060-234 = "Хмм... Значит, две Луны идут... А? Не может быть! Вот так всё заканчивается?!"
10027060-235 = "Предзнаменование из канона оправдалось... Но с неожиданным поворотом! И более того...!"
10027060-236 = ""
10027060-238 = ""
10027060-239 = ""
10027060-240 = "О... Ага! Хм... Интересно. Но если она так говорит..."
10027060-241 = "Нет! Вернись, Луна! Она не это имела в виду!"
10027060-242 = "Она всё знала с самого начала... Поэтому и сделала такой выбор. Но... если так поступить, они лишь продолжат ранить друг друга..."
10027060-243 = ""
10027060-245 = ""
10027060-246 = ""
10027060-247 = "..."
10027060-249 = "Серьёзно, Мэрури?! Если всё закончится так, я никогда тебя не прощу! Никогда! Даже если сами боги простят — я нет!"
10027060-250 = ""
10027060-252 = ""
10027060-253 = ""
10027060-254 = ""
10027060-255 = "*зевает* Что происходит...? Таканэ? Что ты здесь делаешь?"
10027060-256 = "...Плановая проверка. Больше тебе знать не нужно."
10027060-257 = "Проверка...? Не понимаю... *зевает* И я всё ещё ужасно хочу спать! Может, ещё немного..."
10027060-259 = "Спать будешь после того, как закончишь следующую главу! Быстрее!"
10027060-261 = ""
10027060-268 = ""
10027060-269 = ""
10027060-270 = ""
10027060-271 = "*зевает* Боже... Я не способна с этим разбираться, пока не выпью хотя бы три чашки кофе..."
10027060-272 = "...Ты заставляешь МЕНЯ идти за кофе?! Я этого не забуду!"
10027060-273 = "А чего ты ожидала? Сенсей полумёртв, а мне отчаянно нужен сон. Сейчас только ты можешь сходить за кофе."
10027060-274 = "Ух ты. Не верится, что тебе хватило наглости сказать это мне в лицо."
10027060-275 = "Ещё как хватило. В общем, как тебе?"
10027060-276 = "К-Как мне что?"
10027060-277 = "Первую часть 22-го тома «Луны», конечно! Ты же сказала, что оценишь её с точки зрения фаната. Ну...?"
10027060-278 = ""
10027060-280 = ""
10027060-282 = "...Ты дисквалифицирована."
10027060-283 = "Что?! Почему?!"
10027060-285 = "Потому что она даже не закончена! Что мне вообще оценивать?"
10027060-286 = "22-й том «Луны» ведь так и не вышел именно потому, что был незакончен, да? Ты обрекаешь меня на ту же судьбу!"
10027060-287 = "Ургх!"
10027060-288 = "Ты правда думала, что эта недоделка поможет Момидзи тебя простить? Как можно быть такой беспечной?"
10027060-289 = "Ух...!"
10027060-290 = ""
10027060-292 = ""
10027060-293 = ""
10027060-294 = "(Тысячи слов не хватило бы, чтобы описать, насколько мне сейчас стыдно и насколько я разочарована. Если бы не Момидзи, у меня вообще не было бы этой возможности.)"
10027060-295 = "(Сенсей так старался мне помочь, но без Момидзи я ничто.)"
10027060-296 = "(Я не могу закончить это без Момидзи, но мне нужно закончить это, чтобы помириться с ней... Что мне делать?!)"
10027060-297 = ""
10027060-299 = ""
10027060-301 = "Иногда честность с самими собой — именно то, что нужно, чтобы освободиться."
10027060-302 = "Ты предлагаешь признать, что я не справлюсь, и сдаться?!"
10027060-303 = "Я предлагаю смотреть на вещи реалистично. Нельзя подавать незаконченную работу."
10027060-304 = "И если это лучшее, на что ты способна, тогда... я немного в тебе разочарована."
10027060-305 = "...День Х ещё не наступил."
10027060-306 = "До него два дня, а сегодняшний почти закончился. Если учитывать время на печать, у тебя фактически остаётся всего один день. Ты правда думаешь, что сможешь закончить вторую половину за один день, Мэрури?"
10027060-307 = "Не узнаешь, пока не попробуешь!"
10027060-308 = "Без Момидзи?"
10027060-309 = "Ты ведь не можешь ничего оценить, пока работа не закончена, верно?"
10027060-310 = "Значит, всё равно попробуешь? Хорошо. Я буду ждать."
10027060-311 = "С нетерпением жду твою законченную работу."
10027060-312 = "...Не сдавайся."
