[translation]
10045080-1 = "Эпизод 8;Взаимная гордость"
10045080-2 = ""
10045080-3 = ""
10045080-4 = "Ням, ням..."
10045080-5 = "Почему-то на пляже куриные шашлычки вкуснее."
10045080-6 = "Фуфу! Какой бодрящий матч!"
10045080-7 = "Изуна тоже хотела сыграть в пляжный волейбол..."
10045080-8 = "Почему бы в следующий раз не сыграть всем вместе?"
10045080-9 = "Угу. Я тоже хочу."
10045080-10 = "Правда-правда? Ура! Изуна будет ждать!"
10045080-12 = "Эм... А мне тоже можно сыграть?"
10045080-13 = "Да. Может, в следующий раз будем в одной команде?"
10045080-14 = "Д-Для меня это будет честью, госпожа Нагуса!"
10045080-16 = "Куда делись Кикё и Рэнгэ?"
10045080-17 = "Я не видела их с тех пор, как они выиграли матч."
10045080-18 = "Эти двое..."
10045080-19 = "...проводят специальную тренировку по плаванию."
10045080-20 = ""
10045080-21 = "После ожесточённого матча команда, которая берёт матч-пойнт...!!"
10045080-22 = "Рэнгэ и Кикё!"
10045080-24 = ""
10045080-26 = ""
10045080-27 = "Мы победили... Мы победили!"
10045080-28 = "Именно! А теперь тебе пора исполнить обещание."
10045080-29 = "Обещание? А..."
10045080-30 = "Время уроков плавания!"
10045080-31 = "Прямо сейчас...?"
10045080-32 = ""
10045080-34 = ""
10045080-35 = ""
10045080-36 = "Нельзя терять ни минуты!"
10045080-37 = ""
10045080-39 = ""
10045080-40 = ""
10045080-41 = "Кикё станет отличной пловчихой в мгновение ока!"
10045080-42 = "Да, я уверена."
10045080-43 = "Это же Кикё."
10045080-45 = "*ахает*"
10045080-46 = "Больше работай руками и ногами! И расслабься! Иначе утонешь!"
10045080-47 = "Как именно ты предлагаешь мне одновременно расслабиться И двигать конечностями? Это, по-твоему, логично?!"
10045080-48 = "Разве ты не слышала о парадоксе непреодолимой силы? Нельзя быть неподвижным объектом! Плыви по течению!"
10045080-49 = "Как только начнёшь, быстро привыкнешь."
10045080-50 = "А потом сможем выучить более крутые стили!"
10045080-51 = "Хм? «Более крутые стили»?"
10045080-52 = "Рэнгэ. Как называется этот стиль?"
10045080-53 = "А? А, это..."
10045080-55 = "...по-собачьи!"
10045080-56 = "А. Понятно."
10045080-57 = "...А?"
10045080-58 = "ПО-СОБАЧЬИ?"
10045080-59 = "Я, грозный оперативный офицер Хяккарёран, учусь ПЛАВАТЬ ПО-СОБАЧЬИ?!"
10045080-60 = "Нечего стесняться! Все с чего-то начинают, разве нет?"
10045080-61 = "По-собачьи... Я учусь грести... как собака..."
10045080-62 = ""
10045080-64 = ""
10045080-65 = ""
10045080-66 = "Ах, ах! Все меня слышат? Надеюсь, вы отлично проводите время на Водном фестивале Хяккияко!"
10045080-67 = "Пока не убирайте купальники! Сейчас объявим финальную игру и пары!"
10045080-68 = "Игроки, немедленно явитесь на стадион!"
10045080-69 = "Финал... Молюсь, чтобы там не было плавания."
10045080-70 = "Если будет... мне придётся плавать по-собачьи у всех на глазах?"
10045080-71 = "Пойдём. Нет ничего постыднее опоздания."
10045080-73 = "Немного позже..."
10045080-76 = "Похоже, все здесь! Вам не терпится узнать, кто с кем встретится?!"
10045080-77 = "Но сначала — во что мы играем?"
10045080-78 = "[ns] «Финальная игра Водного фестиваля Хяккияко будет...»"
10045080-81 = "[log]Надувной нокаут![/log]"
10045080-83 = ""
10045080-84 = "Именно! Здесь всё решает последняя оставшаяся на ногах! Под вашими ногами будет только буй, и нужно столкнуть соперницу раньше, чем она столкнёт вас!"
10045080-85 = "Оружия нет, так что это настоящее испытание силы и выносливости!"
10045080-86 = "Никакой стратегии, никаких хитростей — просто два соперника выкладываются на полную!"
10045080-87 = "А. Если упаду, плавания по-собачьи не избежать."
10045080-88 = "(Я буду без оружия и на ненадёжной опоре...)"
10045080-89 = "(Я рада, что это не водный вид спорта, но всё равно оказываюсь в серьёзном невыгодном положении.)"
10045080-90 = "Пары решит удача!"
10045080-91 = "Игроки, пожалуйста, достаньте из коробки по шарику."
10045080-92 = "На каждом шарике написано «1» или «2»! Тот, у кого совпадёт число с вашим, станет вашим соперником."
10045080-94 = "[ns] «Поскольку Изуна финишировала первой, она выбирает первой!»"
10045080-95 = "Да, господин!"
10045080-96 = "Какой номер достанется Изуне...?"
10045080-97 = ""
10045080-99 = ""
10045080-100 = "А! Номер 2!"
10045080-102 = "[ns] «Следующая — Рэнгэ!»"
10045080-103 = "Хм... Вот этот!"
10045080-104 = ""
10045080-106 = ""
10045080-107 = "А? У меня 1."
10045080-109 = "[ns] «Следующая — Чисэ.»"
10045080-110 = "Что будете заказывать?"
10045080-111 = ""
10045080-113 = ""
10045080-114 = "А. 2."
10045080-116 = "[ns] «Тогда, естественно, Кикё...»"
10045080-117 = "...1."
10045080-118 = "Да! Пары определены!"
10045080-119 = "В первом матче Кикё встретится с Рэнгэ!"
10045080-120 = "А во втором — Изуна с Чисэ!"
10045080-121 = "Победители каждого матча встретятся в финальном раунде!"
10045080-122 = "Как неожиданно."
10045080-123 = "Я надеялась увидеть в финале пылающую битву славы!"
10045080-124 = "Да, жаль."
10045080-125 = "Как думаешь, кто победит, Нагуса?"
10045080-126 = "...У Рэнгэ природное преимущество."
10045080-127 = "И даже если Кикё сможет победить её здесь, в финале будет тяжело."
10045080-128 = "Изуна обладает ловкостью ниндзя."
10045080-129 = "А Чисэ победила на прошлогоднем фестивале."
10045080-130 = "Чисэ была...? Я вообще не знала!"
10045080-131 = "Кикё лучше всех знает собственные пределы. Скорее всего, она уже оценила текущую ситуацию."
10045080-132 = "Если приоритет — обеспечить победу Хяккарёран, самой эффективной стратегией будет, чтобы Кикё сдалась и позволила Рэнгэ пройти в финал, не потратив силы."
10045080-133 = "Кикё должна... специально проиграть?"
10045080-134 = "В конце концов, Кикё никогда не колебалась и не будет колебаться, если нужно пожертвовать собой ради тех, кто ей дорог."
10045080-135 = "А... Это правда..."
10045080-136 = "Кроме того, нужно учитывать долгую историю Рэнгэ и Кикё. Неужели ты действительно захочешь поднять оружие на подругу детства?"
10045080-137 = "Я всё же надеюсь, что Кикё решит отдать все силы предстоящему испытанию."
10045080-138 = "Но... сейчас только она знает, о чём думает."
10045080-139 = "Кикё..."
10045080-140 = ""
10045080-141 = "Эй, Кикё. Ты ведь не думаешь о какой-нибудь странной ерунде?"
10045080-142 = "...«Странной ерунде»? Полагаю, это твоя область специализации, а не моя."
10045080-143 = "Наверняка всему виной повседневные романы про наставника и ученика, которыми ты так увлеклась в последнее время."
10045080-144 = "К-Как ты...?!"
10045080-145 = "...Не меняй тему! Ты знаешь, о чём я! Ты ведь не собираешься делать всё спустя рукава?"
10045080-146 = "Это... то, чего ты хочешь?"
10045080-147 = "Просто я ненавижу халтурить."
10045080-149 = "Ты можешь называть это как хочешь, но это простая стратегия. Разве не крайне нелогично тратить слишком много сил на этом этапе игры?"
10045080-150 = "Как минимум один член Хяккарёран гарантированно пройдёт в финал. Этой участнице следует сохранить как можно больше энергии."
10045080-151 = "Раз это установлено, остаётся лишь решить, кто должен пройти дальше."
10045080-152 = "Если оценить вероятность моей итоговой победы и твоей..."
10045080-153 = "Разве ответ не очевиден?"
10045080-154 = "Кикё..."
10045080-155 = "Меня обучали выбирать оптимальный путь к победе Хяккарёран, и именно это я сделала."
10045080-156 = "...А я говорю, что в такой победе нет смысла!"
10045080-157 = "Я тебя хорошо знаю. Достаточно хорошо, чтобы понимать: именно так ты и ответишь.#n...Ты всё равно пойдёшь напролом, да? Тогда приготовься."
10045080-158 = "Эй, погоди! Мы ещё не закончили разговор!"
10045080-160 = "После матча я выслушаю всё, что ты захочешь сказать."
10045080-161 = "Ты ведь всегда стремилась к большим высотам."
10045080-162 = "..."
10045080-164 = "Тем временем в ближайшем магазине..."
10045080-165 = "УГХ! Я злая! Я так зла!"
10045080-166 = "Если бы не этот тупой енот...!"
10045080-167 = "Именно! Это всё моя напарница тянула меня вниз! Будь со мной кто-то другой... Наверняка организаторы фестиваля подстроили пары!"
10045080-168 = "Я им этого не прощу!"
10045080-169 = "Ты. Не удовлетворишь моё любопытство?"
10045080-170 = "Что?! Да пошла ты! Не видишь, я за—"
10045080-171 = "...А?"
10045080-172 = ""
10045080-175 = ""
10045080-176 = "..."
10045080-177 = "Т-Ты Лисица Бедствия! Что ТЫ вообще здесь делаешь?"
10045080-178 = "Меня привлекла эта шумная атмосфера."
10045080-179 = "Вопрос задавала я, разве нет?"
10045080-180 = "Не считаешь довольно грубым отвечать вопросом на вопрос?"
10045080-181 = "Ик! Л-Ладно! Простите!"
10045080-182 = "(Погодите. Я могу использовать это в своих интересах и отомстить всем этим уродам!)"
10045080-183 = "...Они проводят соревнование, чтобы короновать сильнейшего чемпиона Хяккияко."
10045080-184 = "Но всё полностью подстроено, так что я собиралась преподать им урок."
10045080-185 = "Не хочешь прийти и показать им? Ну то есть, как они вообще могли не позвать именно тебя на такое соревнование?"
10045080-186 = "Хм. Мне неинтересны подобные мелочи."
10045080-187 = "Н-Но даже Сенсей из Шале участвует в их дурацких махинациях!"
10045080-188 = "Тебя это вообще не бесит?"
10045080-189 = "Погоди. Ты сказала... Сенсей?"
10045080-190 = "Сенсей здесь?"
10045080-191 = "Д-Да! Сенсей судит всё соревнование!"
10045080-192 = "Соревнование за звание чемпиона Сенсея? Боже мой. С этого и надо было начинать."
10045080-193 = "Хи-хи, хи-хи-хи. ♡"
10045080-194 = "Аххх! Я, Вакамо, уже иду к вам, любовь моя!"
10045080-195 = ""
10045080-197 = ""
10045080-198 = "Стой! Подожди меня!"
10045080-199 = "...Кекеке. Хотя это уже неважно."
10045080-200 = "Её не зря называют Лисицей БЕДСТВИЯ. Она точно сорвёт их планы."
10045080-201 = "Так или иначе, я всё равно выйду победительницей!"
