[translation]
10047060-1 = "Эпизод 6;Мечта каждого"
10047060-9 = "[ns] «...Это чердак.»"
10047060-10 = "Хи-хи. Прямо как Золушка."
10047060-11 = "Мы, конечно, не Золушки и чечевицу из золы не выбираем, но нужно помнить, что..."
10047060-12 = "Ой, да прекрати! Хватит шуток и метафор. Как нам отсюда выбраться?"
10047060-13 = ""
10047060-15 = ""
10047060-16 = "[ns] «Так что это за место?»"
10047060-17 = "Это ужасающая тюрьма, изолирующая студента от внешнего мира и высасывающая его ману."
10047060-18 = "Барьер со зловещей системой защиты..."
10047060-19 = ""
10047060-21 = ""
10047060-22 = "Это просто Комната размышлений. Нас посадили сюда, чтобы мы подумали над своим поведением."
10047060-23 = "[s] «П-Понятно...»"
10047060-24 = "Можно назвать её тюрьмой, хотя контроль здесь куда мягче."
10047060-25 = "Здесь... не так плохо... Тепло... Еду приносят регулярно..."
10047060-26 = "Так что... не волнуйтесь, все..."
10047060-27 = "Нас скоро выпустят."
10047060-28 = "Да! Нужно мыслить позитивно!"
10047060-29 = "*вздох* Я ТАК рада, что вас это не беспокоит. А если это попадёт в ваше постоянное личное дело?"
10047060-30 = "И зачем я осталась с этими чудиками и в итоге оказалась здесь...? *вздох*"
10047060-31 = "Магический круг... Глиф призыва. Последний раз я терплю эту чушь."
10047060-32 = ""
10047060-34 = ""
10047060-35 = "[ns1] «Магический круг...»\n[ns2] «Хм, а как вы все вообще заинтересовались оккультизмом?»"
10047060-38 = "Я специально его не искала."
10047060-39 = "Мне просто нравилось проводить время со всеми."
10047060-40 = "Это как ещё одна группа, с которой можно тусоваться."
10047060-41 = "Хех, разве этого недостаточно?"
10047060-42 = "Хи-хи, да. Главное, что нам весело."
10047060-43 = "Этот мир... полон тьмы..."
10047060-44 = "Если хочешь выжить... лучше взращивать... радость."
10047060-45 = "[s] «А как ты увлеклась всем этим, Каноэ...?»"
10047060-46 = "У меня... тоже нет конкретной причины. Мне просто нравится."
10047060-47 = "Чтобы что-то любить... причина не нужна."
10047060-48 = "А оккультизм... на удивление полезен в учёбе..."
10047060-49 = "Как сказала Эри, искусство и оккультизм невозможно разделить..."
10047060-50 = "И, чтобы вы знали... у меня отличные оценки... Хи-хи..."
10047060-51 = "Эм, это здорово, Каноэ! Уважаю."
10047060-52 = "Мне стоило бы брать с тебя пример, но я всегда так нервничаю, когда дело касается... практических вещей."
10047060-53 = "[s] «Понятно.»"
10047060-54 = "...Вообще-то я заваливаю несколько предметов."
10047060-55 = "До поступления сюда я думала, что очень талантливая. Но потом увидела рисунки остальных. Это были не каракули. Они создавали настоящее искусство."
10047060-56 = "Но сколько бы я ни старалась, улучшить навыки не получалось. Поэтому среди остальных художниц я всё время чувствовала себя неуверенно."
10047060-57 = "Все вокруг такие талантливые и потрясающие. А я... я не создала ни одной хорошей работы."
10047060-58 = "[s] «Поэтому ты так нервничала, когда встретила подруг в галерее.»"
10047060-59 = "Э-хе-хе, поймали. Жалко, правда?"
10047060-60 = "Но... я не хочу оставаться такой. Я стану лучше, клянусь."
10047060-61 = "Именно тогда я и увлеклась оккультизмом — чтобы он помог мне развиваться."
10047060-62 = "Если однажды я создам работу вроде «Портрета Бытия»..."
10047060-63 = "Ну, тогда я наконец смогу стоять с высоко поднятой головой рядом со всеми!"
10047060-64 = ""
10047060-66 = ""
10047060-67 = "Это... странно...?"
10047060-68 = "[ns3] «(Студент так мотивирована достичь своей мечты.)»\n[ns4] «(Тогда учителю сейчас следует...)»"
10047060-69 = ""
10047060-70 = ""
10047060-73 = "[ns] «Нет, это не странно. Это вполне возможно.»"
10047060-74 = "Ню-ху-ху! Правда? Я знала, что Мастер в меня поверит!"
10047060-75 = "Значит, Сенсей тоже принимает эту чушь..."
10047060-76 = "Как я уже МНОГОКРАТНО говорила, я не верю в оккультизм."
10047060-77 = "Глупые городские легенды и выдуманные явления, которые люди постоянно распространяют, можно объяснить."
10047060-78 = "А все эти демоны, судьба, предчувствия, магия... Пока не увижу своими глазами, не поверю."
10047060-79 = "[s] «Да. Логически мыслить полезно.»"
10047060-80 = "Очень полезно. Рэна сказала, что однажды станет величайшим модельером Кивотоса."
10047060-81 = "Л-Лучше мечтать по-крупному, правда? И оценки у меня довольно хорошие!"
10047060-82 = "Именно... А МОЯ мечта — продолжать находить чудеса и надежду в повседневности... Хех."
10047060-83 = "А какая твоя мечта, Каноэ?"
10047060-84 = ""
10047060-86 = ""
10047060-87 = "...Секрет."
10047060-88 = "Ой, да ладно, расскажи! Мы все свои назвали!"
10047060-89 = "Вы правда хотите знать...?"
10047060-90 = "Тогда, пожалуй, расскажу... Моя мечта..."
10047060-91 = ""
10047060-93 = ""
10047060-95 = ""
10047060-97 = "...восстановить связь из моей прошлой жизни..."
10047060-98 = "[ns] «Хм...?»"
10047060-99 = "В прошлой жизни у меня была сильная связь с одним человеком... Недавно я это осознала... Хи-хи."
10047060-100 = ""
10047060-102 = ""
10047060-103 = ""
10047060-104 = ""
10047060-105 = "[ns5] «П-Понятно...!»\n[ns6] «Э-Это хорошо...»"
10047060-108 = "Э-хе-хе..."
10047060-109 = ""
10047060-112 = ""
10047060-113 = "Простите, но, кажется, вы забыли, что сейчас находитесь в Комнате размышлений!"
10047060-114 = "А! П-Простите! Мы будем тихо!"
10047060-115 = "...Ну, вы всё равно не похожи на тех, кому полезно сидеть взаперти."
10047060-116 = ""
10047060-118 = ""
10047060-120 = "А-А?"
10047060-121 = ""
10047060-123 = ""
10047060-125 = ""
10047060-126 = ""
10047060-127 = "Выходите все. На этот раз ограничусь предупреждением."
10047060-128 = "Но если поймаю вас снова, доложу Ассамблее."
10047060-129 = "Хи-хи, спасибо... Ты единственная, кто нас понимает, Мирия."
10047060-130 = "Если разойдётся слух, что мы слишком долго держали Сенсея из Шале под арестом, нам этого никогда не забудут."
10047060-131 = "Так что убирайтесь отсюда, пока я не передумала."
10047060-132 = "С-Спасибо!"
10047060-133 = "Фух, мы свободны!"
10047060-134 = ""
10047060-136 = ""
10047060-137 = ""
10047060-138 = ""
10047060-139 = ""
10047060-140 = ""
10047060-144 = ""
10047060-145 = "[ns] «Она из Совета префектов?»"
10047060-146 = "Да... Это подруга, которой я уже некоторое время обязана..."
10047060-147 = "По крайней мере среди офицеров Совета префектов... она самая снисходительная..."
10047060-148 = ""
10047060-150 = ""
10047060-152 = "[ns] «...Понятно.»"
10047060-153 = "А теперь вернёмся в общежитие. Нужно прибраться."
10047060-154 = "А...! Точно! Там наверняка полный бардак!"
10047060-155 = "Э-хе-хе... Простите, простите..."
10047060-156 = ""
10047060-158 = ""
10047060-159 = "[ns] «Я помогу с уборкой.»"
10047060-160 = "Ты отчасти виноват, потому что не остановил их, так что ТЫ И ДОЛЖЕН помогать."
10047060-161 = "...И именно поэтому я тоже помогу."
10047060-162 = "Ты такая добрая, Рэна... Хи-хи..."
10047060-163 = ""
10047060-165 = ""
10047060-167 = "Л-Лестью ничего не добьёшься!"
10047060-168 = ""
10047060-170 = ""
10047060-171 = ""
10047060-172 = ""
10047060-178 = ""
10047060-179 = ""
10047060-180 = "...Не думала, что встречу вас здесь."
10047060-181 = "Хи-хи... Сенсей [USERNAME]."
