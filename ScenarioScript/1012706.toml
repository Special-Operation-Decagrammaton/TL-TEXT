[translation]
1012706-1 = "В конце мечты"
1012706-2 = "Кампус Вайлдхант"
1012706-3 = "Я вышел после ещё одного долгого дня бумажной работы."
1012706-4 = ""
1012706-7 = "[ns] «Похоже, награда за усердную работу — ещё больше работы...»"
1012706-8 = "Как обычно, решение одной проблемы будто порождало две новых."
1012706-9 = "Я взял документы и направился в Информационный центр искусств Вайлдхант."
1012706-11 = "Информационный центр искусств Вайлдхант"
1012706-12 = "[ns] Сесть за свободный стол."
1012706-15 = "[ns] «Это когда-нибудь закончится...?»"
1012706-16 = "И пока я перебирал бумаги..."
1012706-17 = ""
1012706-22 = "..."
1012706-23 = "[s] «Кто там...?»"
1012706-24 = "Ты жаждешь... силы..."
1012706-25 = "[s] «Что?»"
1012706-26 = "Посмотри на ту вершину...!"
1012706-27 = "Я хочу рамэн."
1012706-28 = "[s] «О чём ты вообще говоришь?!»"
1012706-29 = "Что? Ты смеешь требовать от меня ответов?"
1012706-30 = "Какая дерзость!"
1012706-31 = "[ns] «А-а-а-а...!»"
1012706-33 = "Здравствуйте, Сенсей."
1012706-36 = "― [log=미요]...Что вы делаете в таком месте?[/log][wa:2650]"
1012706-38 = "― [log=미요]Я так долго вас искала...[/log][wa:10]"
1012706-41 = "[ns] «Миё...?»"
1012706-42 = "― [log=미요]А вы тут сидите и стонете себе под нос...[/log][wa:1590]"
1012706-44 = "― [log=미요]Может быть, вы плохо себя чувствуете...?[/log][wa:1010]"
1012706-47 = "[ns] «А... Мне просто приснился странный сон...»"
1012706-48 = "― [log=미요]Хм-м, кошмар.[/log][wa:3810]"
1012706-50 = "― [log=미요]Наверняка это ваше наказание.[/log][wa:440]"
1012706-53 = "[ns] «За что?!»"
1012706-54 = "― [log=미요]Вы так часто бываете в Вайлдхант...[/log][wa:1990]"
1012706-56 = "― [log=미요]И при этом ни разу мне не позвонили.[/log]"
1012706-59 = "[ns] «П-Прости...»"
1012706-60 = "― [log=미요]...Фу-фу, я шучу.[/log][wa:3270]"
1012706-63 = "― [log=미요]Но всё же вот так встретить вас...[/log][wa:710]"
1012706-65 = "― [log=미요]делает меня счастливой, Сенсей.[/log][wa:390]"
1012706-68 = "Информационный центр искусств Вайлдхант"
1012706-69 = ""
1012706-70 = "[ns] «Спасибо, что разбудила меня, Миё.»"
1012706-71 = "Ничего особенного."
1012706-72 = "Кстати, почему вы работали в таком старом и пыльном углу?"
1012706-73 = "Есть библиотека куда приятнее... Она прямо к западу от зданий, которые вы сегодня посещали."
1012706-74 = "М-Может, встанете?"
1012706-75 = "...Давайте выпьем кофе. Должно помочь."
1012706-77 = "Выпив чашку кофе с Миё в школьном кафе, я взбодрился."
1012706-78 = "А когда уходил, меня внезапно осенила одна мысль."
1012706-79 = ""
1012706-82 = "Откуда Миё знала, где именно я сегодня был?"
