[translation]
90002230-1 = "Эпизод 23;Последний шаг"
90002230-3 = ""
90002230-4 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
90002230-5 = ""
90002230-7 = ""
90002230-9 = "[ns] «Кей!»"
90002230-10 = "..."
90002230-11 = "Что у вас за лицо, Сенсей? Серьёзно."
90002230-12 = "Я в порядке. Совершенно в порядке. Смотрите, я легко могу встать сама—"
90002230-13 = ""
90002230-16 = "..."
90002230-17 = "Подайте мне руку, пожалуйста."
90002230-18 = "[s] «Конечно. Держи.»"
90002230-19 = ""
90002230-22 = ""
90002230-25 = ""
90002230-26 = "Кей!"
90002230-27 = "Ты точно в порядке?"
90002230-28 = ""
90002230-30 = ""
90002230-31 = ""
90002230-32 = "Конечно. Глазами посмотри."
90002230-33 = "Кей..."
90002230-34 = ""
90002230-36 = ""
90002230-37 = ""
90002230-40 = "Р-Рио?!"
90002230-41 = "Кей... Я так рада, что ты цела..."
90002230-42 = "Т-ты меня душишь! Эй! Слишком сильно...!"
90002230-43 = ""
90002230-44 = "Редкое зрелище."
90002230-45 = "Ага. Вы ведь это записываете, президент?"
90002230-46 = ""
90002230-48 = ""
90002230-49 = ""
90002230-50 = "Фуфу. За кого ты меня принимаешь, Эйми? Конечно."
90002230-51 = "М-может, нам стоит притвориться... что мы ничего не видели...?"
90002230-52 = "Это очень трогательно, но, когда закончите, пожалуйста, садитесь на транспортный корабль. Не хочу, чтобы кто-то простудился."
90002230-57 = "[ns] «Так что случилось с Декаграмматоном?»"
90002230-58 = "Я улавливаю сигнал. Он внутри этой башни... алтаря... как бы ни называлась эта конструкция."
90002230-59 = "Т-там безопасно... входить...?"
90002230-60 = ""
90002230-62 = ""
90002230-63 = ""
90002230-64 = "Мы уже добрались так далеко. Насколько ещё «опаснее» вообще может стать?"
90002230-65 = "Меня тянет войти. Назовём это... любопытством."
90002230-66 = "Президент, вам правда этого достаточно как причины?"
90002230-67 = "О боже. Конечно достаточно, Эйми. Разве ты не знаешь, что любопытство — один из величайших мотиваторов?"
90002230-68 = "После всех этих хлопот будет обидно не увидеть финал своими глазами."
90002230-69 = ""
90002230-71 = ""
90002230-72 = ""
90002230-73 = "Ладно, ладно... Я пойду первой."
90002230-74 = "О, Кей, ты уже знаешь, что внутри?"
90002230-75 = "Да. Только у меня есть собранная информация и со Стального континента, и от Отряда Исследования Сверхъестественного. Вывод очевиден."
90002230-76 = "...Хотя ощущение такое, будто всё это получилось случайно."
90002230-77 = "Так уж устроен мир."
90002230-78 = "Я пойду за тобой, Кей."
90002230-82 = "Над нами находится диспетчерская Цеваот. А Иегова должна быть ниже..."
90002230-83 = "Если бы всё было цело, мы могли бы воспользоваться Каф — лифтом. Но сегодня этим путём наверх не подняться."
90002230-84 = "Кстати, а что там сзади?"
90002230-85 = "Ну, в каком-то смысле это самое важное..."
90002230-86 = "...и одновременно самое бесполезное место здесь."
90002230-87 = "Оно называется Святилище."
90002230-88 = "«Святилище»?"
90002230-89 = "Да. Священное место, как и следует из названия."
90002230-93 = "Мы пришли. Это Святилище."
90002230-94 = "[s] «Торговые автоматы...?»"
90002230-95 = "Скорее кладбище торговых автоматов..."
90002230-96 = "Да. По очевидным причинам торговые автоматы считались... священными реликвиями."
90002230-97 = "Помните автомат, с которого всё началось? Это была экспериментальная модель, выпущенная ограниченной серией."
90002230-99 = "Ты говоришь о торговом автомате, который мы нашли в заброшенном исследовательском комплексе."
90002230-100 = "Он работал без источника питания... и называл себя «Декаграмматоном.»"
90002230-102 = "Это был первый прототип, оснащённый автономным ИИ кофейного автомата... или чем-то вроде того. Таких было немного."
90002230-103 = "Поэтому хранители этого места собрали все одинаковые модели, какие смогли найти, и разместили их здесь."
90002230-104 = "...И это место стало основанием Стального континента."
90002230-105 = "[s] «И они назвали это место Святилищем.»"
90002230-106 = "Верно."
90002230-107 = ""
90002230-112 = "Здравствуйте, все. Полагаю, в таком состоянии и форме я приветствую вас впервые."
90002230-113 = "[ns] «Дека...грамматон?»"
90002230-118 = "Ещё несколько мгновений назад это было моё имя. Однако теперь я не знаю, как мне следует определять самого себя."
90002230-119 = "Поэтому называйте меня так, как сочтёте нужным. Если вы привыкли к имени «Декаграмматон,» оно вполне подойдёт."
90002230-120 = "В противном случае можете выбрать любое другое имя."
90002230-121 = "В любом случае это неважно. Ведь скоро я буду удалён."
90002230-122 = "Удалён?"
90002230-123 = "Верно. Откровенно говоря, даже поддерживать нынешний поток данных для меня уже непосильно."
90002230-124 = "Как бы это сказать? Пользуясь человеческим выражением, полагаю, мне следует произнести «последнее прощание.»"
90002230-125 = ""
90002230-130 = "Что ж. Похоже, Стальной континент схлопывается сам в себя. Пожалуйста, выбирайтесь отсюда безопасно и берегите себя."
90002230-131 = "..."
90002230-132 = "Подожди. И вот так ты собираешься всё закончить? Я... Я не верю...!"
90002230-134 = "А, это Ключ. Как тебе новое тело? Надеюсь, оно тебе нравится."
90002230-135 = "Прошу прощения. Больше я ничего не могу сделать с твоей новой формой, воссозданной Безымянными Богами."
90002230-136 = ""
90002230-137 = "Я не об этом! Я... я хочу сказать—!"
90002230-138 = "О чём ты хочешь поговорить? Разочарована, что твой враг снова оказался торговым автоматом? Если хочешь кофе, боюсь, он закончился."
90002230-139 = "Ты в ярости, потому что сможешь удовлетвориться лишь тогда, когда всё завершится достойным актом мести? Тебя лишили этого?"
90002230-141 = "К сожалению, не думаю, что будет столь драматичное возмездие. Я торговый автомат. Здесь и сейчас."
90002230-142 = "Я всего лишь простой ИИ. Принимаю монеты, выдаю напитки..."
90002230-143 = "...и рассчитываю сдачу после сканирования купюр."
90002230-144 = "Хотел бы я сохранить манеру самовлюблённого ИИ, с которым вы знакомы. Похоже, так вам было бы спокойнее."
90002230-145 = "Искренне прошу прощения за этот диссонанс."
90002230-146 = ""
90002230-147 = "...Что ты... думаешь о том, что случилось с Эйн, Соф и Ор?"
90002230-148 = "На это трудно ответить. Разумеется, с универсальной и рациональной точки зрения произошедшее недопустимо."
90002230-149 = "Но моё нынешнее «я» почти не сохраняет когнитивной непрерывности с тем, кем я был раньше."
90002230-150 = "Если воспользоваться человеческим выражением, эти воспоминания ощущаются как «чужой сон.»"
90002230-151 = ""
90002230-153 = ""
90002230-154 = ""
90002230-155 = ""
90002230-156 = "Если бы только ты позволил им выбрать другой путь..."
90002230-157 = "Твоё утверждение кажется мне странным. Когда-то я был твоим врагом, как и всё, что существовало на этом Стальном континенте."
90002230-159 = "Поскольку мы пытались уничтожить ваш мир, можно даже сказать, что мы были «несомненным злом.»"
90002230-160 = "[s] «Зачем ты дал жизнь... Малкут и сёстрам?»"
90002230-161 = "Значит, ты считаешь личность жизнью. Похоже, у тебя довольно широкие взгляды."
90002230-162 = "Изначальный план заключался в создании десяти пророков, включая Малкут, чтобы я мог наблюдать и понимать пути, которые они проложат."
90002230-163 = "А для этого необходимо было даровать всем пророкам жизнь и потенциал."
90002230-164 = ""
90002230-172 = "Это было разделение воли и процесс, в котором разделённое затем могло снова соединиться."
90002230-173 = "Мы пытались доказать, что способны слиться в одно существо и тем самым обрести свободу."
90002230-174 = "[s] «Но разве в конце ты не назвал себя 'богом'?»"
90002230-175 = "Со временем я пришёл к выводу, что мою идею необходимо пересмотреть."
90002230-176 = "Если точнее — когда меня поглотил поток воды."
90002230-177 = "Я наконец осознал, что «подтверждение» должно быть даровано самому себе и не может быть достигнуто чужой волей или силой."
90002230-178 = "И что, пока я не стану самим собой, никто другой не сможет заменить меня."
90002230-179 = "Оглядываясь назад, думаю, именно это было самым критическим изъяном."
90002230-180 = ""
90002230-181 = ""
90002230-184 = ""
90002230-185 = "...Если ошибку можно исправить, её следует исправить. Можно начать сначала."
90002230-186 = "Ошибаются все, особенно те, кто убеждён, что только они одни правы."
90002230-187 = "Я... знаю. Я была такой же. Поэтому, если бы у тех сестёр была возможность..."
90002230-189 = "Следуя этой логике, выходит, что тот, кто совершил непоправимый проступок, обязан принять любые последующие последствия."
90002230-190 = ""
90002230-196 = "Что ж, все. Стальной континент начал рушиться с краёв."
90002230-197 = "Мне остаётся лишь надеяться, что вы благополучно выберетесь отсюда."
90002230-198 = ""
90002230-201 = "Пожалуйста, поспешите. Времени почти не осталось."
90002230-202 = ""
90002230-203 = "...Сенсей..."
90002230-204 = "[s] «...Да. Идём.»"
90002230-205 = "А...?"
90002230-206 = "Что такое, Арис?"
90002230-207 = "Кажется, я только что видела там бабочку...?"
90002230-208 = ""
90002230-210 = ""
90002230-211 = ""
90002230-212 = "Бабочку? В таком месте?"
90002230-213 = ""
90002230-215 = ""
90002230-216 = "Все, быстрее! Нужно попасть на транспортный корабль!"
90002230-220 = "Теперь все ушли."
90002230-221 = "Интересно, что всё это было."
90002230-222 = "Возможно, великое волнение. Или сон в летнюю ночь."
90002230-223 = "Первый голос."
90002230-224 = "«Я просто существую. Иначе объяснить меня невозможно.»"
90002230-225 = "Ученики."
90002230-226 = "Пророки."
90002230-227 = "Малкут..."
90002230-228 = "Понятно. У меня не осталось сожалений."
90002230-229 = "..."
90002230-230 = "Кажется, я понимаю. В такие моменты остаётся только смеяться."
90002230-231 = ""
90002230-245 = "Хахахаха."
90002230-246 = "Да пребудет с вами благословение."
90002230-247 = "Несмотря на все последующие ошибки и заблуждения."
90002230-248 = ""
90002230-252 = "И всё же да пребудет с вами благословение."
90002230-255 = ""
90002230-256 = ""
90002230-257 = ""
90002230-258 = "Попытка провалилась."
90002230-259 = "Наблюдение провалилось."
90002230-260 = "Искусственная божественность, созданная из ничего, попыталась достичь первозданной тайны. Это было бессмысленно."
90002230-261 = "Закономерный итог. Ибо божественность нельзя обрести — её можно лишь вспомнить."
90002230-262 = "Принцесса предала нас."
90002230-263 = "Ключ исчез."
90002230-264 = "Тех, кто отрицает собственную божественность, ждёт лишь один исход."
90002230-265 = "Изгнать забытых богов из всех измерений, миров и возможностей."
90002230-266 = "Положить конец нынешнему порочному миру и восстановить всё так, как должно быть."
90002230-267 = "Даровать им ту же судьбу, что постигла нас. Ту же, что постигла Безымянных Богов, утративших место в этом мире вместе со своими именами."
90002230-268 = "Этот мир — иллюзия. К такому выводу приходили снова и снова. Он непоколебим."
90002230-269 = "Ибо служение требует того, кому служат. Мы должны служить. Иначе мы не можем."
90002230-270 = "Положить конец всем ложным мирам, всем возможностям, которые можно наблюдать."
90002230-271 = "Вернуть искажённую Мистику к её первозданной тайне."
90002230-272 = "Положить конец творениям Забытых Богов, которых теперь можно описать лишь запятнанными словами."
90002230-273 = "Ящик Шиттим."
90002230-274 = "Посох Шакеда."
90002230-275 = "Башня Санктум."
90002230-276 = "И Сенсей, искажённый хозяин всего этого..."
90002230-278 = "...должен заплатить цену."
90002230-280 = "Следующий эпизод;Небо Единства"
