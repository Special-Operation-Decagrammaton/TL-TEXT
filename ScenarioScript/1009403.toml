[translation]
1009403-1 = "Готовка горничной!"
1009403-2 = "Добро пожаловать, Сенсей! Я тебя ждала!"
1009403-3 = "Хи-хи-хи... На этот раз я покажу вам настоящий талант горничной Сайбы Момои. Надеюсь, вы готовы!"
1009403-4 = "[ns1] «У меня, возможно, будет несколько вопросов...»\n[ns2] «Это одновременно захватывает и немного пугает.»"
1009403-7 = "Путник, есть такая поговорка..."
1009403-8 = "«Страх и ожидание неизвестного... — цветы приключений!»"
1009403-9 = "А-А? Хотите знать, откуда я это скопировала? Ну, я не совсем... скопировала."
1009403-10 = "В любом случае... как я уже говорила, одна из главных обязанностей горничной — готовить еду!"
1009403-11 = "И конечно, если горничная готовит, нужно идти до конца и делать полноценный комплексный обед!"
1009403-12 = "Вот этим я сегодня для вас и займусь."
1009403-13 = "Итак, первым делом я приготовила... вот это!"
1009403-14 = "[s] «Фиолетовый... сок?»"
1009403-15 = "Именно! Выглядит ровно так, как есть. Этот напиток называется «аперитивным соком»!"
1009403-16 = "Такое бывает в комплексных обедах. Он должен разжечь аппетит."
1009403-17 = "За вкус я... ручаться не могу."
1009403-18 = "Но вроде бы он должен быть сладким."
1009403-19 = "Поэтому я приготовила Виноградный сок ящеролюда!"
1009403-20 = "[s3] «Виноградный сок ведь просто виноградный сок, да...?»\n[s4] «И что делает его именно Соком ящеролюда?»"
1009403-23 = "Хе-хе. Хе... Я знала, что вы спросите."
1009403-24 = "Ну, это не обычный виноградный сок!"
1009403-25 = "Он повышает сопротивление яду и позволяет дышать под водой!"
1009403-26 = "[s] «Серьёзно?!»"
1009403-27 = "...По крайней мере, так было написано в игре."
1009403-28 = "А-А? Вы выглядите... разочарованным и при этом совсем не удивлённым."
1009403-29 = "Но есть книга. «Надёжная горничная-ящеролюд», целиком о жизни ящеролюдей. Настоящий шедевр."
1009403-30 = "...Говорят. Я пока не успела достать экземпляр."
1009403-34 = "Несмотря на пафосное представление Момои, это оказался почти обычный виноградный сок."
1009403-35 = ""
1009403-36 = "Дальше суп! Он запускает пищеварение и даёт желудку сигнал готовиться к следующей еде!"
1009403-37 = "Итак: банка говяжьего супа!"
1009403-38 = "[s] «Звучит здорово, но почему он консервированный?»"
1009403-39 = "А, потому что это не обычная банка говяжьего супа."
1009403-40 = "Из-за долгого срока хранения он считается незаменимой едой путешественников, почти как сгущёнка!"
1009403-41 = "Ещё он, говорят, восстанавливает энергию, правда снижает уровень воды в организме."
1009403-42 = "[s] «Какую ещё энергию, и почему он обезвоживает...?»"
1009403-43 = "Эм, ну, потому что..."
1009403-44 = "Потому что в постапокалиптическом мире, где всё развалилось, именно консервы хранятся дольше всего."
1009403-45 = "...Ну ДА, это из игры, но всё же!"
1009403-46 = "Я ещё не закончила объяснять, насколько потрясающий этот суп. Просто хочу дать правильный контекст."
1009403-47 = "Я уварила его, чтобы убрать как можно больше воды и сделать суп особенно густым!"
1009403-50 = "Я попробовал суп. Он был... густым и обезвоживающим."
1009403-51 = "Он оказался настолько солёным, что мне правда захотелось пить."
1009403-52 = ""
1009403-53 = "А теперь долгожданное главное блюдо!"
1009403-54 = "Только не удивляйтесь, но для него я приготовила..."
1009403-55 = ""
1009403-57 = ""
1009403-58 = "...невероятный оякодон!"
1009403-59 = "Если описывать его игровыми терминами... он повышает максимальное HP и EXP, а ещё удваивает шанс выпадения предметов!"
1009403-60 = "Кроме того, это скрытый рецепт, который открывается после задания по наблюдению за едящими людьми — в парке наблюдений!"
1009403-61 = "Хе-хе-хе. Главное здесь — бафф, удваивающий шанс дропа."
1009403-62 = "Фармить без этого баффа — всё равно что—"
1009403-63 = "[s5] «То есть если съесть это и купить лотерейный билет...»\n[s6] «Шанс выиграть повысится...?»"
1009403-66 = "...Не уверена, но попробовать ведь можно, да?"
1009403-67 = "И НЕТ, если не сработает, винить меня нельзя. Что, хотите обвинить своего студента, Сенсей?"
1009403-70 = "К счастью, оякодон оказался сочным и нежным."
1009403-71 = ""
1009403-72 = "Наконец время десерта!"
1009403-73 = "А на десерт я приготовила... М-м! Вот этим точно можно восхищаться!"
1009403-74 = "Этот десерт действительно незабываем."
1009403-75 = "Встречайте... Искажённый угольный торт из Кривого Пустомира!"
1009403-76 = "[s7] «Ну и название!»\n[s8] «Из какого ещё Кривого чего?»"
1009403-79 = "Я-Я не очень уверена в подробностях..."
1009403-80 = "Но разве он не выглядит необычно?"
1009403-81 = "Особенно этот чёрный, искривлённый вид — название прямо подходит..."
1009403-82 = "[s] «Мне кажется, внешний вид и вкус часто связаны.»"
1009403-83 = "Д-Да, иногда это правда!"
1009403-84 = "Но если просто вкусно, разве этого недостаточно?"
1009403-87 = "Хотя жуткое название немного меня настораживало..."
1009403-88 = "...к удивлению, это оказался обычный тёмный шоколадный торт."
1009403-89 = ""
1009403-90 = "Ну как? Расскажите впечатления!"
1009403-91 = "Не чувствуете, будто получили бафф, стали сильнее или повысили уровень?"
1009403-92 = "А? Вы просто рады видеть, как я применяю свои навыки?"
1009403-93 = "Хи-хи! Вы кое-что понимаете, Сенсей! Людей вы хорошо чувствуете!"
1009403-94 = ""
1009403-97 = "О нет! Пакет упал, и всё внутри..."
1009403-98 = "Что это такое? О-О, это..."
1009403-99 = "...просто еда из магазина. Я купила слишком много, и вот осталось..."
1009403-100 = "Что делать, Сенсей? В Отделе разработки игр нет холодильника..."
1009403-101 = "О, знаете... можно официально запатентовать сегодняшнее меню, получать роялти и на эти деньги купить холодильник!"
1009403-102 = "[s] «Эм... Можно, но отказано.»"
1009403-103 = "Почему?!"
1009403-105 = "После этого мы с Момои решали, что делать с оставшейся магазинной едой."
1009403-106 = "В конце концов нам удалось всё разобрать."
1009403-107 = "Учитывая количество остатков, это было непросто."
