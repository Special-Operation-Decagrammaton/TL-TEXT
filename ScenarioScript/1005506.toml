[translation]
1005506-1 = "Откровенно"
1005506-2 = "Я ждал Шигурэ на кухне Шале, и она пришла точно вовремя."
1005506-3 = ""
1005506-7 = ""
1005506-8 = "Так вот какая кухня в Шале? Оборудование отличное."
1005506-9 = ""
1005506-11 = ""
1005506-12 = ""
1005506-13 = "Я бывала в Шале время от времени, но на кухню заходить никогда не было причины."
1005506-14 = "[s1] «Добро пожаловать, Шигурэ. Что у тебя в руках?» \n[s2] «Эм... Что за мешок у тебя за спиной?»"
1005506-15 = ""
1005506-16 = ""
1005506-18 = ""
1005506-19 = "...А? О, это?"
1005506-20 = "Хи-хи. Я знала, что вам станет любопытно."
1005506-21 = "Моя сегодняшняя миссия — приготовить вам еду."
1005506-22 = "Поэтому я принесла ингредиенты."
1005506-23 = "Не смотрите так встревоженно! Ничего странного."
1005506-24 = "Я обо всём позабочусь, а вы просто отдыхайте."
1005506-25 = "Хорошо. Начнём готовить особое блюдо из дичи спецотряда №227..."
1005506-26 = ""
1005506-28 = ""
1005506-29 = ""
1005506-32 = "[ns3] «П-Подожди—!»\n[ns4] «Что это за гора сырого мяса?!»"
1005506-35 = "А? Что случилось? Удивлены свежести ингредиентов?"
1005506-36 = "Хи-хи. По вашему лицу вижу: такого свежего мяса вы ещё не видели."
1005506-37 = "Что такое дичь? Ну, дичь и есть."
1005506-38 = "Мясо добытых на охоте диких животных... медведя, оленя, кролика и так далее."
1005506-39 = "Обычно я ловлю и разделываю их прямо на месте, но суть блюда из дичи — в свежести."
1005506-40 = ""
1005506-42 = ""
1005506-43 = "Поэтому я принесла всё в Шале вот так, чтобы приготовить вам идеальное блюдо."
1005506-44 = "Обычные продукты? Что вы имеете в виду?"
1005506-45 = "Дичь И ЕСТЬ обычная еда. Мы едим её каждый день."
1005506-46 = "...Ну, по крайней мере хотелось бы. Секретариат выдаёт хлеб и такие продукты, как рис, поэтому дичь скорее считается деликатесом."
1005506-47 = "В прошлый раз вы угостили меня едой, которую можно найти только в центре, поэтому я хотела приготовить особое блюдо, доступное только в спецотряде."
1005506-48 = "Но сюрприз! Я шучу. Хи-хи. Настолько свежее мясо для вас слишком жёсткое, Сенсей."
1005506-49 = "Ваше выражение лица стоило того, чтобы тащить всё это сюда."
1005506-50 = "[s5] «Ты специально так старалась только ради того, чтобы меня поддразнить...»\n[s6] «Ты, конечно, особенная во многих смыслах.»"
1005506-53 = "А как ещё жить, если иногда не подшучивать друг над другом?"
1005506-54 = "Хорошо! Пора готовить."
1005506-57 = "Приправляем мясо солью и специями..."
1005506-58 = ""
1005506-60 = ""
1005506-61 = ""
1005506-63 = "Кладём масло на хорошо разогретую сковороду и жарим до хрустящей корочки..."
1005506-64 = ""
1005506-66 = ""
1005506-67 = "И наконец, сбрызгиваем сверху водкой..."
1005506-68 = ""
1005506-72 = "[ns7] «Стой, прекрати! Что ты делаешь?!»\n[ns8] «Зачем ты льёшь алкоголь на еду?»"
1005506-75 = "А? Сенсей, о чём вы?"
1005506-76 = "Добавление алкоголя не только убирает специфический запах дичи, но и придаёт особый вкус."
1005506-77 = "В ресторане, куда мы ходили, на еду наливали алкоголь и поджигали. Разве это не называлось «фламбе»...?"
1005506-78 = "[s9] «Это работает, только если добавить алкоголь и нагреть.»\n[s10] «Если сделать так, мясо просто будет пахнуть алкоголем.»"
1005506-81 = "О... Правда?"
1005506-82 = "Что же делать...? Если увеличить огонь сейчас, мясо просто сгорит... Но тогда я не смогу прогреть алкоголь."
1005506-83 = "Я не могу подать вам это, Сенсей... Тогда съем сама."
1005506-84 = ""
1005506-87 = "[ns] «Подвинься. Я приготовлю тебе порцию.»"
1005506-88 = ""
1005506-90 = ""
1005506-91 = "С-Сенсей? Вы будете готовить?"
1005506-92 = "Я ценю это, но ведь смысл был в том, чтобы я приготовила еду для вас..."
1005506-93 = "[s] «Теперь твоя очередь отдыхать. Просто подожди там.»"
1005506-94 = ""
1005506-103 = "...Из продуктов Шигурэ я приготовил ужин на двоих."
1005506-108 = ""
1005506-109 = "В итоге я только добавила вам работы..."
1005506-110 = "Хотела отплатить за прошлый поход, а теперь должна вам ещё больше."
1005506-111 = "[s11] «Всё нормально, ничего сложного.»\n[s12] «Я рад, что ты пришла.»"
1005506-112 = ""
1005506-113 = ""
1005506-115 = ""
1005506-116 = "...Хм."
1005506-117 = "Наверное... Мне от этого немного легче."
1005506-118 = "Честно говоря, я немного растерялась, когда вы сказали это так прямо."
1005506-119 = "Хотя это по-своему освежает. Взрослые всегда так разговаривают?"
1005506-120 = "Знаете, если будете продолжать говорить такое, я начну ожидать большего от наших отношений."
1005506-121 = "Следи за языком."
1005506-122 = "Не хочу, чтобы я тебе надоела, если буду постоянно приходить и беспокоить."
1005506-123 = "...Ты не против?"
1005506-124 = "Решил ответить мне тем же?"
1005506-125 = "Ну... Хорошо."
1005506-126 = "Тогда скоро снова приду к тебе."
1005506-127 = "И тебе стоит почаще навещать особый отряд №227."
1005506-128 = "Только не забудь обещание! Скажи мне заранее, чтобы я могла побыть твоим проводником."
