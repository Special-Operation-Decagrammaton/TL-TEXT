[translation]
1004602-1 = "Разбиваем арбузы с Изуной!"
1004602-2 = ""
1004602-5 = "По срочной просьбе Изуны я вышел на летний пляж под палящим солнцем."
1004602-6 = ""
1004602-9 = ""
1004602-10 = "Господин, господин! Сюда, сюда!"
1004602-11 = "[s] «Привет, Изуна.»"
1004602-12 = "Хи-хи. Здравствуйте, господин!"
1004602-13 = "[s1] «Итак, что у нас сегодня по плану?»\n[s2] «Ты ведь говорила, что хочешь заняться летом чем-нибудь ниндзя-подобным?»"
1004602-16 = "Эм, раз уж летом мы на пляже..."
1004602-17 = "я хочу сделать что-то сезонное, чем можно заняться только сейчас!"
1004602-18 = "[s] «Особое летнее занятие... Может, поплаваем?»"
1004602-19 = "(Шок)"
1004602-20 = "[s] «Сегодня очень жарко, можем окунуться вместе...»"
1004602-21 = ""
1004602-23 = ""
1004602-24 = "[ns] «А? Изуна?»"
1004602-25 = "О, эм, господин, насчёт плавания..."
1004602-26 = "Д-Да! Господин! Конечно, это хорошая идея, но...!"
1004602-27 = "Раз я хочу стать ниндзя...!"
1004602-28 = "может, нам стоит заняться особой тренировкой, которую можно провести только на пляже!"
1004602-29 = "Таков был мой план!"
1004602-30 = "[s] «И что это за тренировка...?»"
1004602-31 = "Не волнуйтесь! Я подготовила всё необходимое для тренировки, господин!"
1004602-32 = ""
1004602-34 = ""
1004602-35 = ""
1004602-36 = "[ns] «Арбуз... и деревянный меч? Под тренировкой ты имеешь в виду...»"
1004602-37 = "Да! Это лучший вид физической тренировки летом!"
1004602-38 = "Разбивание арбуза!"
1004602-39 = "[s3] «Это считается физической тренировкой? Ну, по крайней мере, сезонно.»\n[s4] «Но какое это имеет отношение к ниндзя...?»"
1004602-42 = "Хи-хи-хи...!"
1004602-43 = "Конечно, это будет не обычное разбивание арбуза, господин!"
1004602-44 = "Мы проведём Особую ниндзя-тренировку по разбиванию арбуза, которая, говорят, популярна среди знаменитых ниндзя!"
1004602-45 = "[s] «Изуна, откуда ты это узнала?»"
1004602-46 = "А? Я увидела это на видеоканале «Мичирути — свиток девушки-ниндзя»."
1004602-47 = "[s] «Я так и думал.»"
1004602-48 = "На канале сказали, что правила Особого ниндзя-разбивания арбуза просты!"
1004602-49 = "Как только вы, мой уважаемый господин, отдадите приказ, я преданно исполню его как ниндзя!"
1004602-50 = "Я разобью арбуз по вашей команде!"
1004602-51 = "[s] «...Прости, но я не понимаю, чем это отличается от обычного разбивания арбуза.»"
1004602-52 = ""
1004602-55 = "[ns] «Но если ты этого хочешь, я соглашусь.»"
1004602-56 = "Хи-хи! Начинаем тренировку, господин!"
1004602-57 = ""
1004602-59 = ""
1004602-60 = "Тогда вот так..."
1004602-61 = ""
1004602-63 = ""
1004602-64 = ""
1004602-65 = "Поставлю арбуз..."
1004602-66 = ""
1004602-68 = ""
1004602-69 = ""
1004602-70 = ""
1004602-71 = "Хорошо! Подготовка завершена!"
1004602-72 = ""
1004602-74 = ""
1004602-77 = "Теперь я просто закрою глаза..."
1004602-78 = "Господин! Отдавайте команды!"
1004602-79 = "[s] «Хорошо, сначала, Изуна...»"
1004602-80 = "*глоть* *тук-тук тук-тук*"
1004602-81 = "[s5] «С того места сделай три шага вперёд...»\n[s6] «С того места сделай четыре шага назад...»"
1004602-82 = "Да, господин! Иду!"
1004602-83 = ""
1004602-85 = ""
1004602-86 = "Да, господин! Иду!"
1004602-87 = ""
1004602-89 = ""
1004602-90 = "[ns] «П-Подожди, Изуна?!»"
1004602-91 = ""
1004602-97 = ""
1004602-98 = "*кхе* Я ошиблась..."
1004602-99 = "[s] «Т-Ты в порядке?»"
1004602-100 = "Да! Всё хорошо, господин!"
1004602-101 = "Я так торопилась выполнить ваш приказ, что не рассчитала скорость и побежала!"
1004602-102 = "Дважды одну и ту же ошибку я не совершу!"
1004602-103 = "Как ниндзя, я готова к вашим командам на летней тренировке, господин!"
1004602-104 = "[s] «О, хорошо. Тогда на этот раз иди вправо...»"
1004602-105 = "Да! Вправо!"
1004602-106 = "А-а-а!"
1004602-107 = ""
1004602-109 = ""
1004602-111 = "[s] «И-Изуна?!»"
1004602-114 = ""
1004602-115 = "*кхе-кхе* Я снова ошиблась..."
1004602-116 = ""
1004602-118 = ""
1004602-119 = "Я ещё не сдаюсь!"
1004602-120 = "Господин! Ещё раз!"
1004602-121 = "[s] «О, эм, т-тогда теперь налево...?»"
1004602-122 = "Ха-а!"
1004602-123 = ""
1004602-125 = ""
1004602-128 = "Ещё нет, ещё нет!"
1004602-129 = ""
1004602-132 = "Позвольте показать вам ниндзюцу в стиле Изуны! Хия-я!"
1004602-133 = ""
1004602-137 = "Она снова и снова пыталась разбить арбуз, но безуспешно."
1004602-138 = "Вокруг нас клубились облака песка,"
1004602-139 = ""
1004602-142 = "а арбуз оставался нетронутым и идеальным."
1004602-144 = "Ух... Не думала, что арбуз может быть таким крепким..."
1004602-145 = "Я даже не могу поцарапать его броню!"
1004602-146 = "Воистину... эту Особую ниндзя-тренировку по разбиванию арбуза... нельзя недооценивать!"
1004602-147 = "[s7] «Мне кажется, тут есть фундаментальная проблема...»\n[s8] «Тебе стоит пересмотреть эту тренировку...»"
1004602-150 = "П-Проблема?! ...Возможно, вы правы."
1004602-151 = "Д-Да... Я предложила сразу взяться за Особое ниндзя-разбивание арбуза..."
1004602-152 = "а сама совсем не смогла продвинуться!"
1004602-153 = "Так что неудивительно, что тренировка не работает..."
1004602-154 = "Наверное... это просто безнадёжно."
1004602-155 = "П-Простите, господин!"
1004602-156 = "Я заставила вас прийти сюда в такую жару! А сама недостаточно хороша! Я вас разочаровала!"
1004602-157 = "[s] «Нет-нет. Ты ничего плохого не сделала.»"
1004602-158 = "*всхлип* А?"
1004602-159 = "[s9] «Может, попробуем немного замедлиться?»\n[s10] «Необязательно реагировать на приказ мгновенно.»"
1004602-162 = ""
1004602-164 = ""
1004602-165 = "О... То есть не торопиться, выполняя ваши команды?"
1004602-166 = "А! Мне нужно добавить в эту тренировку больше стратегии!"
1004602-167 = "Господин! Ваши наставления, как всегда, невероятно мудры!"
1004602-168 = "Хм!"
1004602-169 = "..."
1004602-170 = "Но... это может быть невозможно, господин."
1004602-171 = "[s] «А? Почему?»"
1004602-172 = "Когда я слышу ваши команды, моё тело автоматически двигается, даже если я сама этого не хочу!"
1004602-173 = "Я ужасно хочу преуспеть в Особом ниндзя-разбивании арбуза..."
1004602-174 = "Но когда я слышу ваш приказ, мне ещё сильнее хочется немедленно выполнить его от всего сердца!"
1004602-175 = "А-а-а! Что мне делать, господин?!"
1004602-176 = "Я не знала, что разбивание арбуза — такая трудная тренировка. Я не была готова!"
1004602-177 = "Но..."
1004602-178 = "Я пока не хочу сдаваться..."
1004602-179 = "Ну... В любом случае, я рада, что смогла тренироваться с вами, господин!"
1004602-180 = "[s11] «Ты отлично справилась!»\n[s12] «Изуна... Я горжусь тобой!»"
1004602-183 = ""
1004602-187 = "Изуна всё ещё была чрезмерно мотивирована..."
1004602-188 = "Я так и не смог заставить себя сказать ей остановиться или успокоиться."
1004602-189 = "И в итоге..."
1004602-190 = "[ns] «Хорошо, Изуна. Давай пробовать, пока не получится!»"
1004602-192 = "...!"
1004602-193 = "Да! Спасибо, господин!"
1004602-194 = "Нин-нин!"
1004602-195 = ""
1004602-200 = "Изуна никак не могла перестать торопиться в каждом движении. Мы весь день тренировались разбивать арбуз."
1004602-201 = ""
1004602-206 = "После тренировки мы съели арбуз как награду за её упорный труд."
