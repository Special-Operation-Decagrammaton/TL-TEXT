[translation]
1009102-1 = "Распевка"
1009102-2 = "...В итоге Казуса затащила меня в караоке."
1009102-3 = "[ns1] «Мне было интересно, что ты имела в виду под „ответственностью“.»\n[ns2] «Оказывается, речь шла о помощи с вокальной практикой.»"
1009102-6 = "Хм? Ну конечно."
1009102-7 = "А что ещё вы подумали? Что я собираюсь сбежать или вроде того?"
1009102-8 = "Кому-то нужно было это сделать. А раз делаю я, надо сделать как следует. Вот и всё."
1009102-9 = "Гордитесь мной? Ха-ха. Спасибо. Приятно слышать ваши похвалы, Сенсей."
1009102-10 = "А?"
1009102-11 = "Есть ли у меня опыт пения? Ну, эм, есть, но... я бы не стала прямо называть себя «вокалисткой.»"
1009102-12 = "Одно дело — петь, когда отдыхаешь с друзьями, и совсем другое — петь на концерте."
1009102-13 = "..."
1009102-14 = "Да-да. Просто помогите мне потренироваться."
1009102-15 = "Как именно? Всё просто."
1009102-16 = "Я немного спою, а вы после этого укажете на все недостатки."
1009102-17 = "Песню для выступления мы ещё не выбрали, поэтому пока я просто тренируюсь в целом. Желательно на жанрах, в которых обычно не пою."
1009102-18 = "А? А остальные?"
1009102-19 = "О нет. Нет-нет. Почему вы вообще об этом подумали?"
1009102-20 = "Если их позвать, они будут смеяться надо мной каждый раз, когда я ошибусь."
1009102-21 = "Единственный, кому я могу здесь доверять, — вы, Сенсей."
1009102-22 = ""
1009102-24 = ""
1009102-25 = ""
1009102-26 = "Хм... Хмм..."
1009102-27 = "А я... точно могу вам доверять?"
1009102-28 = "[s3] «...Ты только сейчас об этом спрашиваешь?!»\n[s4] «Ч-Что? Почему ты так смотришь...?»"
1009102-31 = "Ну, эм, просто пока мы говорили, я вдруг подумала. Вы ведь во многом похожи на остальных членов клуба..."
1009102-32 = "Такое чувство, что если я ошибусь, вы тоже начнёте надо мной смеяться."
1009102-33 = "...Тц. Может, надо было прийти сюда одной."
1009102-34 = "А?"
1009102-35 = "Не будете? Обещаете?"
1009102-36 = "А... Серьёзно? Не ожидала..."
1009102-37 = "[s5] «Для шуток есть время и место.»\n[s6] «Я никогда не стану смеяться над студентом, который старается изо всех сил.»"
1009102-40 = "С-Сенсей...?"
1009102-41 = "П-Почему вы вдруг стали таким серьёзным? Я ведь не была НАСТОЛЬКО серьёзна."
1009102-42 = "Э-Эм..."
1009102-43 = "...Иногда вы вот так застаёте меня врасплох, Сенсей."
1009102-44 = "В любом случае... ладно. Если вы серьёзно, мне так спокойнее."
1009102-45 = "Тогда, наверное... эм... и мне тоже стоит отнестись серьёзно."
1009102-46 = "..."
1009102-47 = "...Р-Рассчитываю на вас!"
1009102-49 = "После этого я послушал, как поёт Казуса, и дал ей несколько советов."
1009102-50 = "Кое-что ещё можно было улучшить, но в целом она справилась отлично."
1009102-51 = ""
1009102-52 = "[ns7] «Ты замечательно поёшь.»\n[ns8] «И ты всё это время переживала?»"
1009102-55 = "А-А? П-Правда? Я нормально спела?"
1009102-56 = "Ну, не знаю, верить ли этому. Кажется, вы просто говорите так, чтобы мне стало легче..."
1009102-57 = "Хм? Не в этом дело? И сейчас тоже не время для такого?"
1009102-58 = "П-Правда. Да. Мы пришли сюда оценить мой уровень. Вы бы не стали приукрашивать. Да."
1009102-59 = ""
1009102-61 = ""
1009102-62 = "Значит, правда всё нормально? Я могу вам доверять?"
1009102-63 = "[s9] «Было бы идеально, если бы звучало чуть естественнее.»\n[s10] «Остальное зависит от настроя. Ты должна чувствовать себя свободно, когда поёшь.»"
1009102-66 = "Хм. Понятно. Вот как?"
1009102-67 = "Чувствовать себя свободно... когда я пою... Хм..."
1009102-68 = "Но я могу продолжать, и это не станет большой проблемой?"
1009102-69 = "...Фух. Ладно. Это успокаивает. Тогда на сегодня закончим практику."
1009102-70 = "А?"
1009102-71 = "Что будем делать теперь?"
1009102-72 = "Хм? Это вопрос? У нас ещё полно времени для караоке."
1009102-73 = ""
1009102-75 = ""
1009102-76 = "Раз уж мы сюда пришли, давайте повеселимся."
1009102-77 = "[s11] «После всего, что мы уже напели?»\n[s12] «И чем это отличается от того, что мы делали до этого?»"
1009102-80 = "Ой, да что вы такое говорите?"
1009102-81 = "Послушайте, это совершенно другое. Совсем."
1009102-82 = "Одно дело — петь для тренировки, и другое — петь ради удовольствия! Как это вообще можно считать одним и тем же?"
1009102-83 = "Вы правда не видите разницы? Пф-ф. Теперь многое понятно про взрослых..."
1009102-84 = ""
1009102-86 = ""
1009102-87 = ""
1009102-88 = ""
1009102-89 = "В общем, раз уж мы здесь, просто подыграйте мне до конца. Вот и всё."
1009102-90 = "И времени у нас ещё полно!"
1009102-91 = "Ладно! Включайте первую песню!"
1009102-92 = ""
1009102-94 = ""
1009102-96 = "Поехали-и-и!!"
1009102-97 = "Оставшееся время Казуса буквально слилась с микрофоном и захватила всё караоке."
1009102-98 = ""
1009102-101 = "...И пела она заметно лучше, чем во время тренировки."
