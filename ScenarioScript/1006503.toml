[translation]
1006503-1 = "Кахо — президентнее президента"
1006503-2 = "По просьбе Кахо я посетил клубную комнату Инь-Ян."
1006503-3 = ""
1006503-5 = ""
1006503-6 = ""
1006503-7 = ""
1006503-8 = "[ns] «Привет, Кахо. Я пришёл.»"
1006503-9 = ""
1006503-11 = ""
1006503-12 = "О, Сенсей. Спасибо, что нашли время."
1006503-13 = "[s] «Ты сейчас занята? Я не мешаю?»"
1006503-14 = "О, не переживайте. Сегодня и у клуба Инь-Ян нерабочий день."
1006503-15 = "Я просто приводила в порядок задачи."
1006503-16 = ""
1006503-18 = ""
1006503-19 = ""
1006503-20 = "...Фух."
1006503-21 = "Готово. Пойдём?"
1006503-22 = "[s] «Хорошо.»"
1006503-25 = "[ns] «Так... Кахо. Что ты имеешь в виду под „сопровождением“?»"
1006503-26 = "В прошлый раз, когда я пришла к вам, я слишком сильно давила, не разобравшись как следует, верно?"
1006503-27 = "Я всё ещё думаю, что... это было..."
1006503-28 = "...довольно..."
1006503-29 = "...стыдно."
1006503-30 = "[s] «Тебе вовсе не обязательно так себя чувствовать...»"
1006503-31 = "Нет, мне действительно стоит этого стыдиться."
1006503-32 = "Поэтому я вернулась в клубную комнату и подумала вот о чём..."
1006503-33 = "Прежде чем предлагать совместную работу, наверное, мне стоило сначала рассказать вам о Хяккияко — например, что это за место."
1006503-34 = "И почему я так сильно хочу его рекламировать."
1006503-35 = "[s] «То есть что-то вроде знакомства с Хяккияко...?»"
1006503-36 = "Да."
1006503-37 = "Конечно, вы уже помогли многим студентам Хяккияко и решили немало наших проблем..."
1006503-38 = "Я прекрасно понимаю, что ко многому вы уже привыкли."
1006503-39 = "Но это совсем другое."
1006503-40 = "Как студент Хяккияко, я поняла, что ни разу не проводила для вас экскурсию."
1006503-41 = "Поэтому я просто не могла сидеть сложа руки — мне захотелось лично сопровождать вас и познакомить с Хяккияко."
1006503-42 = "[s] «А-а, понятно. Вот что ты имела в виду под сопровождением.»"
1006503-44 = "[ns] «Спасибо за такую заботу, Кахо.»"
1006503-45 = ""
1006503-47 = ""
1006503-48 = "А..."
1006503-49 = "Я-я имею в виду... это всего лишь стратегия, которую я придумала... как главный стратег."
1006503-50 = "Или... уловка, которую я придумала..."
1006503-51 = "На самом деле это не более чем план, чтобы произвести на вас хорошее впечатление как член клуба Инь-Ян..."
1006503-52 = "[s] «Ты ведь понимаешь, что говоришь свои мысли вслух?»"
1006503-53 = ""
1006503-55 = ""
1006503-56 = "Кхм, н-ничего."
1006503-57 = ""
1006503-59 = ""
1006503-60 = "У нас нет на это времени. Давайте сразу приступим, если вы..."
1006503-61 = ""
1006503-64 = ""
1006503-65 = "[ns] «Гость?»"
1006503-66 = "Похоже на то... Хотя сегодня у нас выходной, так что посетителей быть не должно..."
1006503-67 = "Приём."
1006503-68 = ""
1006503-73 = "К-Кахо...! Помоги, у нас проблема...!"
1006503-74 = "Но сегодня у клуба Инь-Ян выходной..."
1006503-75 = "П-прости, но если бы ты могла совсем немного помочь с этим..."
1006503-76 = ""
1006503-78 = ""
1006503-79 = "...Конечно. Ради другого студента я могу это сделать."
1006503-80 = "Прошу прощения, Сенсей. Вы не против, если я ненадолго разберусь с этим вопросом?"
1006503-81 = "[s] «Конечно. Не спеши.»"
1006503-82 = "Спасибо. Тогда..."
1006503-85 = "Так Кахо принялась разбираться с неожиданно свалившейся работой..."
1006503-86 = "Но неожиданная работа, разумеется, оказалась..."
1006503-89 = "Кахо!"
1006503-90 = "Пожалуйста, тут возник вопрос, требующий вмешательства клуба Инь-Ян!"
1006503-91 = "Вице-президент! Кто-то заявил права на помещение нашего клуба!"
1006503-92 = "П-почему именно сегодня на нас свалилось столько работы...?!"
1006503-93 = "[s] «Ну... работа она такая...»"
1006503-94 = "Ч-что...? Сенсей...?"
1006503-96 = "Поток работы, казалось, не собирался заканчиваться."
1006503-97 = "Стоило ей подумать, что всё закончено, как тут же наваливалось ещё."
1006503-98 = "Кахо неустанно пробивалась сквозь бесконечные волны работы."
1006503-101 = "Да, покажите этот документ, и они больше не смогут утверждать, что помещение принадлежит им."
1006503-103 = "С-спасибо, Кахо!"
1006503-104 = "Если бы тебя здесь не было, нас бы...!"
1006503-105 = "...Выгнали из помещения клуба, а мы даже ничего не смогли бы сделать!"
1006503-106 = "Я даже не знаю, как тебя отблагодарить...!"
1006503-107 = "Всё в порядке. Если снова возникнет подобная проблема, не стесняйтесь обращаться в клуб Инь-Ян."
1006503-108 = "В конце концов, мы здесь именно для того, чтобы помогать студентам нашей школы, попавшим в беду."
1006503-109 = "Хорошо!"
1006503-110 = ""
1006503-112 = ""
1006503-114 = "Через некоторое время у нас наконец появилась минутка перевести дух."
1006503-116 = ""
1006503-117 = "[ns] «Ты потрясающая, Кахо.»"
1006503-118 = "П-Простите?"
1006503-119 = "[s1] «Я о том, что тебя совсем не испугал такой объём работы.»\n[s2] «Ты со всем справляешься без каких-либо проблем.»"
1006503-122 = "О, это пустяки."
1006503-123 = "Такими вещами клуб Инь-Ян и должен заниматься."
1006503-124 = "[s] «Но я слышал, что изначально клуб Инь-Ян даже не был студсоветом, верно?»"
1006503-125 = "О, да. Кстати говоря..."
1006503-126 = "Как вы и сказали, клуб Инь-Ян — не студенческий совет."
1006503-127 = "Поэтому у нас нет полномочий или власти решать проблемы так, как это делают студсоветы других школ."
1006503-128 = "...На самом деле точнее будет сказать, что мы попросту не можем."
1006503-129 = "[s] «...?»"
1006503-130 = "Если возникает какая-то проблема, мы в клубе Инь-Ян можем лишь выступить арбитрами и посредниками, а не решить её напрямую."
1006503-131 = "Наши возможности часто ограничены, и эти ограничения очевидны..."
1006503-132 = "Но всё, что мы можем, — делать всё, что в наших силах."
1006503-133 = "Это единственный путь, который нам остаётся ради студентов, снова и снова размышлявших над проблемой, которую они не могли решить сами..."
1006503-134 = "...пока наконец не решились постучаться в двери клуба Инь-Ян и попросить помощи."
1006503-135 = "Такова работа клуба Инь-Ян и его ответственность."
1006503-136 = "[s] «Понятно... Это впечатляет.»"
1006503-137 = "Что? Я-я имею в виду... Тут нет ничего настолько выдающегося, чтобы так меня хвалить..."
1006503-138 = "Даже это — пустяк по сравнению с прошлыми временами, когда единство Хяккияко было нестабильным..."
1006503-139 = "Точно, Кахо, ты потрясающая!"
1006503-140 = "А-А?"
1006503-141 = "Благодаря тому, что ты здесь, большинство проблем решается за считанные секунды!"
1006503-142 = "После того как ты стала вице-президентом клуба Инь-Ян, Кахо, в Хяккияко стало гораздо меньше ссор!"
1006503-143 = "Нет... Это не только моя заслуга, а результат усилий всех..."
1006503-144 = "Я ведь даже не президент клуба Инь-Ян..."
1006503-145 = "Так это делает тебя ЕЩЁ более потрясающей!"
1006503-146 = "Ты даже больше похожа на президента, чем сам президент, Кахо!"
1006503-147 = "К-как неловко..."
1006503-149 = "Мы продолжали работать до самого вечера."
1006503-152 = "[ns] «Фух... Все студенты-посетительницы уже ушли. Каким-то образом мы наконец закончили!»"
1006503-153 = "Да, но..."
1006503-154 = ""
1006503-156 = ""
1006503-157 = "Время... уже..."
1006503-158 = "..."
1006503-159 = "Мне очень жаль, Сенсей."
1006503-160 = "[s] «Хм? Кахо?»"
1006503-161 = "Я... хотела сегодня провести для вас экскурсию..."
1006503-162 = "Я хотела показать вам прекрасные стороны Хяккияко и ради этого попросила вас прийти..."
1006503-163 = "Но в итоге... я лишь впустую потратила ваше время..."
1006503-164 = "Получается, это просто..."
1006503-165 = "[s] «Ты думаешь, попытка произвести на меня хорошее впечатление о клубе Инь-Ян полностью провалилась?»"
1006503-166 = ""
1006503-168 = ""
1006503-169 = "Что? Я-я..."
1006503-170 = "[s] «А мне кажется, наоборот, это огромный успех.»"
1006503-171 = "...Что?"
1006503-172 = "[s3] «Ты работала допоздна только потому...»\n[s4] «Что не могла оставить без помощи студентов, которым она была нужна, верно?»"
1006503-175 = "Даже если всё это было ради доброго дела..."
1006503-176 = "Это не отменяет того, что я потратила ваше время."
1006503-177 = "Даже если вы не возражаете..."
1006503-178 = "Это была моя ошибка. Простите меня, [USERNAME] Сенсей."
1006503-179 = "[ns] «Ты и правда слишком строга к себе, Кахо.»"
1006503-181 = "[ns] «Хорошо. Тогда считай, что теперь ты у меня в долгу.»"
1006503-182 = "В долгу...?"
1006503-183 = "То есть вместо того, чтобы просто забыть об этом, превратить это в долг, чтобы в следующий раз я смогла постараться лучше...?"
1006503-184 = "...Вас правда это устроит?"
1006503-185 = "[s] «Разумеется»."
1006503-186 = ""
1006503-188 = ""
1006503-189 = "...Понятно."
1006503-190 = "Поняла."
1006503-191 = "Я извлеку урок из сегодняшней ошибки..."
1006503-192 = "И в следующий раз обязательно устрою для вас самое лучшее сопровождение, на какое способна."
1006503-193 = "[s] «Хорошо. Буду ждать.»"
1006503-194 = "Я тоже..."
1006503-195 = "Я тоже буду ждать этого..."
