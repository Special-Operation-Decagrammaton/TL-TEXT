[translation]
1000905-1 = "Аппетитные лакомства"
1000905-4 = "(Как и обещали, мы встретились с Изуми и отправились в раменную.)"
1000905-5 = "Что бы съесть сегодня?"
1000905-6 = "Клубничный джем подходит ко всему!"
1000905-7 = "Тонкоцу, сёю... И не забудь масло! ♪"
1000905-9 = "Мяу!"
1000905-10 = ""
1000905-11 = "Это кот."
1000905-12 = "Мр-р-р..."
1000905-13 = "Ой... Какой милый!"
1000905-14 = "Хм? Почему он всё время трётся о мою щёку?"
1000905-15 = "[s] «Похоже, он голодный.»"
1000905-16 = "О, ты тоже голодный? Но сейчас мне нечего тебе дать..."
1000905-17 = "[s] «А у меня как раз кое-что есть.»"
1000905-19 = "Лакомство для кошек Purr Purr?"
1000905-20 = "Мяу, мяу, мяу!"
1000905-21 = "[s] «Видишь? Подойди поближе. Кис-кис. Вот, держи.»"
1000905-24 = "Ням-ням-ням-ням."
1000905-27 = "О, он ест. Ого, наверное, очень вкусно."
1000905-28 = "Мяу."
1000905-29 = "Мя-я-яу."
1000905-30 = "И другие коты идут! Как здорово, Сенсей!"
1000905-31 = "[s] «Коты сходят с ума по этому лакомству.»"
1000905-32 = "Ого..."
1000905-33 = "Ням-ням."
1000905-34 = "Ням-ням-ням."
1000905-35 = "Ням-ням-ням-ням!"
1000905-36 = "(пристально смотрит)"
1000905-37 = "[s] «Хм? Изуми, что такое?»"
1000905-38 = "Ням-ням-ням-ням!"
1000905-39 = "...Вкусно."
1000905-40 = "[s] «Эм, Изуми? Погоди. Ты ведь не...»"
1000905-41 = "*глоть*"
1000905-42 = "[s1] «П-постой. Изуми?!»\n[s2] «Ты крадёшь кошачьи лакомства?!»"
1000905-43 = "Э-эм, ну... Понимаешь..."
1000905-44 = "Э-эм, ну... Понимаешь..."
1000905-50 = "― К-Коты...[wa:390]"
1000905-52 = "― так вкусно всё ели! Я-я не смогла удержаться![wa:310]"
1000905-55 = "― Э?! Э-Эй,[wa:1320]"
1000905-57 = "― не царапай меня![wa:10]"
1000905-60 = "― Ч-Что?! На меня напали разъярённые коты![wa:380]"
1000905-63 = "[ns3] «Они вправе злиться! Ты украла их лакомства!»\n[ns4] «Они вообще не для людей!»"
1000905-64 = "― Н-Но они выглядели такими вкусными![wa:1010]"
1000905-65 = "― Н-Но они выглядели такими вкусными![wa:1010]"
1000905-68 = "― К-К тому же! Я член Общества гурманов![wa:1070]"
1000905-70 = "― Я обязана пробовать всё![wa:320]"
1000905-73 = "[ns] «Не знал, что в эту обязанность входит корм для животных...»"
1000905-74 = "― Ну серьёзно! Премиальный вкус тунца...[wa:3250]"
1000905-77 = "― Почему"
1000905-79 = "― вам можно есть такие деликатесы, а мне нет?![wa:10]"
1000905-82 = "―Им надо учиться делиться![wa:600]"
1000905-85 = "― Л-Ладно, простите меня![wa:1340]"
1000905-87 = "― Но уже съеденное не вернуть...[wa:670]"
1000905-90 = "― Ай! Не кусай меня![wa:410]"
1000905-93 = "После этого Изуми ещё некоторое время возилась с уличными котами. К счастью, они простили её после подкупа дополнительной едой."
