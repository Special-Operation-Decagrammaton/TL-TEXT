[translation]
10030050-1 = "Эпизод 5;Подготовка ужина"
10030050-3 = ""
10030050-4 = ""
10030050-5 = ""
10030050-6 = "...Вас не было дольше, чем я ожидала. Сколько времени ушло на поиски?"
10030050-7 = "Ждать одной у палатки было скучно—"
10030050-8 = ""
10030050-10 = ""
10030050-11 = ""
10030050-12 = ""
10030050-16 = ""
10030050-18 = "...Почему вы все так тяжело дышите? Вы что, наперегонки обратно в лагерь бежали?"
10030050-20 = ""
10030050-21 = "Ну, в каком-то смысле да..."
10030050-22 = "...Но подробности прозвучат довольно странно."
10030050-23 = "Мы встретили в лесу Сумирэ. Она приехала сюда на специальную тренировку."
10030050-24 = ""
10030050-27 = ""
10030050-28 = "А-а-а..."
10030050-29 = "[s] «...Этого достаточно, чтобы всё понять?»"
10030050-30 = "А, прости. Я примерно поняла, что произошло, как только услышала имя Сумирэ."
10030050-31 = "Не знаю, что ты там себе представила... но Сумирэ за нами не гналась."
10030050-32 = "Мы просто обсуждали с ней и новой участницей Клуба спортивных тренировок наш поход..."
10030050-34 = "И тут из ниоткуда появился огромный медведь!"
10030050-35 = ""
10030050-38 = ""
10030050-39 = "М-Медведь?!"
10030050-40 = "В-Всё в порядке? А если он нападёт на лагерь..."
10030050-41 = "Не волнуйся. Его уже нет."
10030050-42 = ""
10030050-44 = ""
10030050-46 = "Клуб спортивных тренировок отвлёк его и дал нам сбежать..."
10030050-47 = "Но теперь лучше не сходить с туристической тропы. Можем наткнуться на других зверей."
10030050-48 = "Кстати, похоже, Клуб спортивных тренировок собирался продолжить занятия даже после всего этого."
10030050-49 = "Ну, по крайней мере, пока они убегали, я слышала, как они кричали что-то о переносе тренировки в другое место."
10030050-50 = "Одна из них сказала, что нельзя терять ни секунды, если они хотят раскрыть свой потенциал до следующего сезона."
10030050-51 = "Возможно, Рэй куда сильнее увлечена бейсболом, чем я думала."
10030050-52 = "Может, в следующем году от бейсбольного клуба Миллениума стоит ждать хороших результатов?"
10030050-53 = ""
10030050-56 = "[ns] «Я видела немного другое...»"
10030050-59 = ""
10030050-60 = "Я больше не могу!"
10030050-61 = "Ты обещала научить меня чаще выбивать хоум-раны, а не убегать от медведей! Это вообще не имеет отношения к бейсболу!"
10030050-62 = "Я ухожу!"
10030050-63 = ""
10030050-65 = ""
10030050-67 = ""
10030050-68 = "Если захочешь покинуть Клуб спортивных тренировок после возвращения, я не стану тебя удерживать..."
10030050-69 = "Но раз специальная тренировка уже началась, я не отпущу тебя, пока она не закончится."
10030050-70 = "Если закончить упражнение без заминки, можно получить растяжение мышц и застой крови!"
10030050-71 = "Неважно, вступишь ты в Клуб спортивных тренировок или нет: как ответственная за безопасность Фитнес-центра Миллениума, я не могу позволить тебе тренироваться опасными методами!"
10030050-72 = "Думаешь, сможешь меня остановить?"
10030050-73 = "Если встанешь между мной и домом, я прорвусь силой!"
10030050-74 = "Вот это настрой, Рэй!"
10030050-75 = "Акх!"
10030050-76 = "До сих пор скоростную тренировку для нас вёл тренер Медведь..."
10030050-77 = ""
10030050-79 = ""
10030050-81 = "Так что силовую тренировку возьму на себя я!"
10030050-82 = "Это упражнение не закончится, даже если ты заплачешь!"
10030050-83 = ""
10030050-85 = ""
10030050-87 = ""
10030050-88 = "У-Уа-а..."
10030050-89 = "Ненавижу Клуб спортивных тренировок!"
10030050-92 = "...Ладно, что будем делать теперь? Сейчас только четыре часа дня."
10030050-93 = "Что? Так рано, даже после всего, что произошло?"
10030050-94 = "...На улице время будто течёт медленнее."
10030050-95 = "Ага, в клубной комнате достаточно сыграть два-три раунда, и день уже закончился."
10030050-96 = "...Это и называют специальной теорией относительности?"
10030050-97 = "Нет, здесь эта теория вообще ни при чём."
10030050-98 = ""
10030050-100 = ""
10030050-102 = ""
10030050-103 = "Ну, наш следующий шаг очевиден. Пора начинать готовить ужин."
10030050-104 = ""
10030050-107 = ""
10030050-108 = "Уже?!"
10030050-109 = "После обеда прошло всего три часа..."
10030050-110 = "Вице-президент, только не говорите, что в последнее время начали больше есть—"
10030050-112 = "Я тороплюсь не потому, что голодна!"
10030050-113 = "Готовить на природе не так удобно, как на кухне. Нужно развести огонь, подготовить ингредиенты и убедиться, что пищевые отходы не привлекут животных..."
10030050-114 = "Если хотим поесть до заката, лучше начать прямо сейчас."
10030050-115 = "На самом деле я переживаю, что мы уже начали слишком поздно, учитывая, насколько вы все неуклюжи с кухонными принадлежностями..."
10030050-116 = "Ц, нам ведь просто надо помыть и нарезать овощи, да?"
10030050-117 = "Легкотня! Просто надо подойти к делу серьёзно!"
10030050-119 = ""
10030050-120 = "К тому же мы взяли только обычные овощи вроде картошки и лука..."
10030050-121 = "Если вся группа сосредоточится, мы этого босса мигом победим."
10030050-123 = "Ну хоть энтузиазма вам не занимать."
10030050-124 = "Вот. Помойте эти овощи, затем почистите и нарежьте на кусочки."
10030050-125 = "А я пока разведу огонь на другой стороне лагеря."
10030050-126 = "Предоставь это нам!"
10030050-132 = "Примерно час спустя..."
10030050-135 = "Угх…"
10030050-136 = ""
10030050-138 = ""
10030050-139 = "Уваа!"
10030050-140 = ""
10030050-142 = ""
10030050-144 = "Ты в порядке, Маки? Рука цела?"
10030050-145 = ""
10030050-147 = ""
10030050-148 = "Ага... К счастью, не поранилась..."
10030050-149 = "Но что это за морковь? Я давила изо всех сил, а нож вообще не двигается."
10030050-150 = "Насколько же твёрдая у неё сердцевина, если нож не режет?"
10030050-151 = "[s1] «Походные ножи обычно не такие острые, как кухонные...»\n[s2] «Для разных ножей нужны разные техники.»"
10030050-152 = ""
10030050-153 = ""
10030050-155 = ""
10030050-157 = ""
10030050-158 = "[ns3] «Я нарежу морковь, а ты можешь чистить.»\n[ns4] «Вот, смотри.»"
10030050-159 = ""
10030050-160 = ""
10030050-162 = ""
10030050-163 = "Хорошо, тогда поменяемся, Сенсей..."
10030050-164 = "Как у тебя дела, Котама? Картошку уже почистила?"
10030050-165 = ""
10030050-167 = ""
10030050-169 = ""
10030050-170 = "Нет... Я только что закончила... третью..."
10030050-171 = "Снимать тонкий слой с картошки сложнее, чем я думала..."
10030050-172 = "Запястье уже болит, и я почти не могу давить на нож..."
10030050-173 = "К тому же рядом нет тёплой воды... Мыть овощи в холодном ручье — руки немеют..."
10030050-174 = "Уф, думаешь, если продолжать окунать пальцы в эту воду, я получу обморожение?"
10030050-175 = "Чихиро была права... Это занимает вечность."
10030050-176 = "...Нам правда обязательно проходить через всё это, чтобы приготовить себе ужин?"
10030050-177 = ""
10030050-179 = ""
10030050-182 = ""
10030050-184 = "Вы уже закончили с овощами?"
10030050-185 = ""
10030050-188 = ""
10030050-189 = "Е-Ещё нет..."
10030050-190 = "Но если дать нам ещё немного времени и бюджета..."
10030050-192 = "Бюджета?"
10030050-193 = "Эм, Чихиро."
10030050-194 = "Ты случайно не взяла лапшу быстрого приготовления или готовое карри в пакетах?"
10030050-195 = "Я взяла немного на случай чрезвычайной ситуации... А что?"
10030050-196 = ""
10030050-198 = ""
10030050-199 = "Тогда давайте съедим это!"
10030050-200 = "В лагере нет интернета, еду заказать нельзя, всё такое неудобное... Можно хотя бы с ужином не напрягаться?"
10030050-201 = "Нет."
10030050-202 = "Есть столько еды быстрого приготовления вредно. Зачем вам ещё больше, если мы приехали так далеко?"
10030050-203 = "У-ух..."
10030050-204 = "Мы приехали в поход, чтобы вырваться из привычной клубной рутины и немного пожить здоровее."
10030050-205 = "Так что, даже если хлопотно, сегодня поедим нормальную еду. Я помогу подготовить оставшиеся ингредиенты."
10030050-206 = "Нормальная еда — это хорошо, но разве на природе мы не сильно ограничены в том, что можно приготовить?"
10030050-207 = "Представьте хорошую тарелку карри с рисом... или жареного риса..."
10030050-208 = "Хи-хи-хи... Уверена, когда закончим готовить, вы запоёте по-другому."
10030050-209 = ""
10030050-211 = ""
10030050-212 = ""
10030050-213 = ""
10030050-214 = "Перед выходом я подготовила кое-что особенное. Отметим эту поездку как следует."
10030050-215 = ""
10030050-217 = ""
10030050-219 = ""
10030050-220 = ""
10030050-221 = "Что-то... особенное?"
