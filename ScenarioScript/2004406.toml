[translation]
2004406-1 = "Та самая из новостей"
2004406-3 = "Что случилось, Тренер?"
2004406-4 = "Вы такой серьёзный... Вы заболели?"
2004406-5 = "Вам принести воды? Протеиновый коктейль?"
2004406-6 = "[s1] «Забудь об этом, Сумирэ!»\n[s2] «О тебе все говорят!»"
2004406-9 = "Например... в MomoTalk?"
2004406-10 = "Что ты имеешь в виду?"
2004406-11 = "Я включил телевизор в тренировочном центре и показал ей новости."
2004406-12 = ""
2004406-14 = ""
2004406-16 = "И мы снова с вами в программе «Взгляд на Кивотос»!"
2004406-17 = "Эта подрабатывающая официантка стала настоящей сенсацией на местном стадионе!"
2004406-18 = "Учитывая, что средняя бочка с напитком весит 25 килограммов, многие разносчики..."
2004406-19 = "...естественно выматываются по ходу матча!"
2004406-20 = ""
2004406-22 = ""
2004406-23 = "Конечно, разносчики всегда стараются изо всех сил, но большинство всё равно уступает усталости."
2004406-24 = "...и по мере затягивания матча болельщики остаются измученными жаждой!"
2004406-25 = "Но только посмотрите, как двигается она! До последней подачи она остаётся полной сил и энергии!"
2004406-26 = "И кто сможет отрицать притягательность её улыбки, энергии и внимательного обслуживания? А какая ВПЕЧАТЛЯЮЩАЯ осанка!"
2004406-27 = ""
2004406-29 = ""
2004406-31 = ""
2004406-32 = "Множество фанатов буквально кричат, прося руководство и игроков вернуть её!"
2004406-33 = "Более того, фотографии с этой потрясающей сотрудницей сейчас просто взрывают сеть!"
2004406-34 = "Неужели мы наблюдаем рождение новой звезды?"
2004406-35 = "И наконец, поскольку в Кроносе мы всегда уважаем частную жизнь..."
2004406-36 = "...мы не станем раскрывать личность этой сенсации, но..."
2004406-37 = "...некоторые источники утверждают, что её МОЖНО встретить в Научной школе Миллениума!"
2004406-38 = ""
2004406-40 = ""
2004406-41 = ""
2004406-42 = "Тренер."
2004406-43 = "[s] «Д-да...?»"
2004406-44 = "Это была я. В новостях."
2004406-45 = "[s] «Ага...»"
2004406-46 = "Они даже мой бейджик с именем не размыли..."
2004406-47 = "Что? Вы говорите, у меня уже есть фан-клуб?"
2004406-48 = "..."
2004406-49 = "Нет, всё это недоразумение."
2004406-50 = "Я президент Клуба спортивных тренировок Миллениума. ВОТ моя настоящая страсть!"
2004406-51 = ""
2004406-53 = ""
2004406-54 = ""
2004406-55 = ""
2004406-56 = "Хм? Секунду. Мне пришло сообщение."
2004406-57 = "[s] «Приглашение на встречу... от компании по производству напитков?»"
2004406-58 = "Листаю... листаю... как вежливо. А!"
2004406-59 = "Они просят меня прийти на следующую... дегустацию спортивных напитков?"
2004406-60 = "Вместе с кучей руководителей? И хотят услышать моё мнение?"
2004406-61 = "[s] «Что будешь делать, Сумирэ?!»"
2004406-62 = "..."
2004406-63 = "Что ж, Тренер, они очень вежливо попросили. Как я могу отказать?"
2004406-64 = "И спортивных напитков я за свою жизнь выпила немало."
2004406-65 = "Вообще-то у меня есть несколько идей. Это потрясающая возможность!"
2004406-66 = "[s] «Серьёзно?»"
2004406-67 = "Да, Тренер."
2004406-68 = "Вообще-то, как и предположила эта компания..."
2004406-69 = "...я в каком-то смысле эксперт — «голос народа»!"
2004406-70 = "Это мой священный долг! Так что нечего стоять на месте. По-шли! Вперёд!"
2004406-72 = "Хотя невероятная уверенность Сумирэ меня немного настораживала..."
2004406-73 = "...я решил поддержать её и пойти на встречу вместе."
2004406-74 = ""
2004406-79 = "Позвольте поблагодарить всех, кто любезно присоединился к нам сегодня."
2004406-80 = "На этой встрече присутствуют не только руководители..."
2004406-81 = "Но и Отохана Сумирэ, недавно ставшая вирусной сенсацией. Настоящий голос народа!"
2004406-82 = ""
2004406-84 = ""
2004406-85 = "Вы очень добры. Да, я Сумирэ. Спасибо, что пригласили."
2004406-86 = ""
2004406-89 = ""
2004406-90 = ""
2004406-92 = "Итак, начинаем встречу!"
2004406-94 = "У нас здесь три невероятно потрясающих образца напитков от отдела исследований и разработок..."
2004406-95 = ""
2004406-97 = ""
2004406-98 = "Начнём с этого! В нём полно кофеина!"
2004406-99 = "Кофеин сейчас на пике популярности! Он помогает сжигать калории и даёт спортсменам необходимую энергию!"
2004406-100 = "Да, приём кофеина перед тренировкой может усилить кровообращение и повысить физическую производительность на 3–5 процентов."
2004406-101 = "Кроме того, он помогает расщеплять жир и превращать его в энергию..."
2004406-102 = "Звучит разумно, Тренер."
2004406-103 = "[s] «Точно...»"
2004406-104 = ""
2004406-106 = ""
2004406-107 = "Дальше у нас напиток с соком четырнадцати разных фруктов и овощей!"
2004406-108 = "Полезно! Полно витаминов! Детям понравится!"
2004406-109 = "М-м, само по себе наличие сока ещё не делает что-то «полезным»."
2004406-110 = "Самая полезная часть овощей и фруктов — вообще-то клетчатка. А во фруктах ещё и много природного сахара!"
2004406-111 = "И уж сахар точно не полезен!"
2004406-112 = "Конечно, я полностью за то, чтобы включать ЦЕЛЬНЫЕ фрукты в тренировочный рацион."
2004406-113 = ""
2004406-115 = ""
2004406-116 = ""
2004406-117 = "...Принято к сведению. И наконец, в третьем варианте кукурузный сироп с высоким содержанием фруктозы полностью заменён искусственными подсластителями!"
2004406-118 = "В последнее время общественное мнение стало хуже относиться к такому сиропу, и наши акционеры это заметили."
2004406-119 = "Но с новым вкусом наши поклонники получат всю эту вкусность без скачка сахара!"
2004406-120 = "В умеренных количествах кукурузный сироп с высоким содержанием фруктозы допустим."
2004406-121 = "Но даже так я считаю его довольно проблемным."
2004406-122 = "Понимаете, он вызывает очень быстрый приток сахара!"
2004406-123 = "Регулярное чрезмерное употребление может привести к гипергликемии и проблемам с поджелудочной железой."
2004406-124 = "Если новая формула это смягчит, она может спасать жизни!"
2004406-126 = "Поразительно. Думаю, у всех трёх напитков огромный рыночный потенциал."
2004406-127 = "Третий производить проще всего. Там всего лишь замена одного ингредиента."
2004406-128 = "Но нам ещё нужно освежить образ бренда! Думаю, вариант с соком перспективнее всего. Он разнообразит нашу линейку!"
2004406-129 = "Так-так. Это мы можем обсудить позже. Не будем тратить время нашей особой гостьи."
2004406-130 = "Абсолютно верно! Послушаем героиню дня!"
2004406-131 = "Думаю, мы, старики, уже наговорились. Пожалуйста, Сумирэ, расскажите, что вы думаете!"
2004406-132 = ""
2004406-134 = ""
2004406-135 = "Большое спасибо, что спросили. Идеи очень интересные."
2004406-136 = "Однако, по моему мнению, ответ очевиден..."
2004406-137 = "Нам нужен белок!"
2004406-138 = "[s] «Сумирэ!»"
2004406-139 = "М-мисс Сумирэ?! Мы... производим спортивные напитки."
2004406-140 = "Именно!"
2004406-141 = "А?!"
2004406-142 = "Что такое «спортивный напиток»? Это ведь ДОЛЖЕН быть напиток, который помогает заниматься спортом, верно?"
2004406-143 = "А любой спортсмен знает, насколько трудно каждый день набирать рекомендуемую норму белка!"
2004406-144 = "Вот почему люди давятся порошками и жуют сухие батончики..."
2004406-145 = "Так что вам нужно сделать белок доступнее!"
2004406-146 = "Большинство протеиновых напитков такие густые и меловые. У них ужасная репутация."
2004406-147 = "И именно поэтому ВЫ можете предложить новый подход!"
2004406-148 = "Я знаю, что это сработает!"
2004406-149 = ""
2004406-153 = "П-протеин? Мне бы такое и в голову не пришло..."
2004406-154 = "Не будем горячиться, господа. Нам нужно всё обдумать..."
2004406-155 = "Это так свежо... так необычно. Сумирэ, вы потрясающая!"
2004406-156 = "Погодите, погодите!"
2004406-157 = "Да, мы компания спортивных напитков, но наша главная цель — гидратация. Мы делаем их для болельщиков, а не спортсменов."
2004406-158 = "Болельщикам ведь тоже хочется пить!"
2004406-159 = "Вы мыслите слишком узко!"
2004406-160 = "Ч-что?!"
2004406-161 = "Почему люди вообще становятся спортивными фанатами?"
2004406-162 = "Конечно, из любви к игре, но ещё и потому, что они мечтают стать больше ПОХОЖИМИ на спортсменов!"
2004406-163 = "По крайней мере, я чувствую именно так!"
2004406-164 = "А эти люди, если будут достаточно смотреть спорт, однажды сами захотят тренироваться."
2004406-166 = "У-у вас есть какие-нибудь доказательства...?"
2004406-167 = "Я верю, что это так. Разве этого недостаточно?"
2004406-168 = "И ваш СВЯЩЕННЫЙ долг — помочь этим людям стать лучшей версией себя!"
2004406-169 = ""
2004406-171 = ""
2004406-172 = ""
2004406-173 = "Священный долг..."
2004406-174 = "Это... довольно трогательно."
2004406-175 = "Напоминает мне, почему я вообще когда-то занялся бизнесом напитков для гидратации..."
2004406-176 = "..."
2004406-177 = "(Эта встреча... полный провал!)"
2004406-178 = ""
2004406-180 = ""
2004406-181 = "Итак, вернёмся к делу. Как нам включить протеиновый спортивный напиток в нашу линейку?"
2004406-182 = "Начнём осторожно: шоколад, клубника и банан. Потом посмотрим на реакцию публики."
2004406-183 = "Огромное спасибо за ваше мнение, мисс Сумирэ!"
2004406-184 = "Не за что. Я просто благодарна за такую возможность."
2004406-185 = ""
2004406-188 = "(*вздыхает* Ладно, наверное, внесу это в протокол встречи...)"
2004406-190 = "Новый напиток Сумирэ вышел в продажу."
2004406-191 = "Продажи... технически существовали."
2004406-192 = "А благодаря её поддержке линейку решили не закрывать."
2004406-194 = "Всё хорошо, что хорошо кончается, правда, Тренер?"
2004406-195 = "[s] «Наверное...?»"
