[translation]
42180-1 = "Эпизод 18; Элита против элиты"
42180-4 = "Неблагодарные... Мы дали вам крышу, одежду, еду, а вот ваша благодарность?!"
42180-6 = "Это вы силой напялили форму на людей, которые вообще не искали работу!"
42180-7 = "Вся эта история научила меня одному: я больше никогда не хочу работать!"
42180-8 = "И я буду бороться с любыми формами материальной собственности!"
42180-9 = "Получайте, злодеи!"
42180-10 = "Ты, тощая жердь, Декарту не соперник!"
42180-12 = "Предатель...! Кого это ты жердью назвал?!"
42180-13 = ""
42180-15 = ""
42180-21 = ""
42180-23 = "Угх..."
42180-24 = "К-Кто-нибудь... Помогите!"
42180-25 = ""
42180-28 = "Ай! Это правда больно!"
42180-29 = "Сражаться с элитными силами корпорации «Кайзер» — жестоко!"
42180-30 = "Отступаем...!"
42180-31 = ""
42180-35 = "А ну вернитесь, трусы!"
42180-37 = "Благодаря Искателям нас теперь не меньше, но прорваться всё равно будет непросто."
42180-38 = "«Кайзер» рано или поздно пришлёт подкрепление. Если не прорвёмся раньше, нас окружат."
42180-39 = "Это опасно, поэтому позвольте мне идти первой и..."
42180-40 = ""
42180-42 = ""
42180-43 = ""
42180-44 = "О? Знакомое лицо."
42180-45 = ""
42180-47 = ""
42180-50 = ""
42180-51 = "Это общественный объект для гражданских. Что здесь за беспорядок?"
42180-52 = "Кто-нибудь, немедленно доложите! «Кайзер»?"
42180-53 = "О, слава богу! Директор, пожалуйста, сделайте что-нибудь!"
42180-54 = "Поддерживать порядок — ваша работа, верно? Так поддерживайте его!"
42180-55 = ""
42180-58 = ""
42180-59 = "Э-Это... та самая Бешеная Гончая... из прошлый раз?"
42180-60 = ""
42180-63 = ""
42180-64 = ""
42180-66 = ""
42180-72 = ""
42180-74 = "Что ты делаешь?!"
42180-75 = "Вы понимаете, что значит, когда директор Бюро общественного порядка открывает по нам огонь? Наши полномочия дала нам лично исполняющая обязанности президента!"
42180-77 = "Директор? Кто? Чего?"
42180-78 = "Вообще-то, я сейчас в отпуске. Дисциплинарное взыскание. Мне особо нечего терять, не думаете?"
42180-79 = "То есть ты просто ходишь и устраиваешь проблемы? У тебя здесь вообще нет полномочий?"
42180-80 = "Безопасность этого района — наша юрисдикция, так что вы, шавки из «Валькирии», можете проваливать."
42180-81 = "Ошибаетесь. За безопасность D.U. отвечает ещё одна группа."
42180-82 = "Административный регламент Полицейской школы «Валькирия», статья 32, пункт 1. Студенты Бюро общественной безопасности имеют право арестовывать лиц, препятствующих работе общественного транспорта."
42180-83 = ""
42180-85 = ""
42180-86 = ""
42180-87 = ""
42180-88 = ""
42180-89 = "...Я решила помочь младшим из Бюро общественной безопасности, пока отбываю дисциплинарные общественные работы."
42180-90 = ""
42180-92 = ""
42180-93 = ""
42180-95 = "Бюро общественной безопасности! Бросить оружие и лечь на землю!"
42180-96 = ""
42180-98 = ""
42180-100 = "Ты вообще понимаешь, на кого оружие направляешь?!"
42180-101 = "Мы просто действуем по протоколу! Согласно правилам!"
42180-103 = "И служба безопасности «Кайзера» обязана соблюдать эти правила, как и все остальные."
42180-104 = "В связи с общественными беспорядками у этой железнодорожной станции мы задержим вас и доставим в Полицейскую школу «Валькирия»."
42180-105 = "Если будете сопротивляться, у нас есть полномочия доставить вас силой. Но давайте просто избавим всех от лишней работы."
42180-107 = "...Бюро общественной безопасности... арестовывает... нас...?"
42180-108 = "О, ну это умора... Ха-ха-ха!"
42180-109 = "Т-Это не смешно!"
42180-110 = "А как тут не смеяться? Что Бюро общественной безопасности сделает? Пончиком в нас бросит?"
42180-111 = "Пусть теперь мы называемся иначе, но мы всё ещё SOF — элита PMC. Лучшие из лучших у «Кайзера»."
42180-112 = "Мелкие новички из Бюро общественной безопасности «Валькирии» со своими пукалками собираются нас арестовать? Ха!"
42180-113 = "Неважно, насколько хорошим командиром или кем там ты себя считаешь."
42180-115 = "Никакой позитивный настрой не сократит разницу между нами и кучкой новичков."
42180-117 = "Новички...? Похоже, здесь возникло недопонимание."
42180-118 = "Бюро общественной безопасности — самый желанный отдел «Валькирии» среди поступающих."
42180-119 = "Я даже сама однажды пыталась туда попасть. Мне отказали."
42180-121 = "Ч-Что? Как директор могла..."
42180-122 = "Хотите ещё один любопытный факт?"
42180-123 = "Станцию Коусаги не обслуживали больше десяти лет, поэтому опоры под её вывеской теперь скорее ржавчина, чем металл."
42180-124 = "В Бюро общественной безопасности поступило немало обеспокоенных звонков: люди боялись, что при каждом порыве ветра вывеска просто сорвётся."
42180-125 = "Поэтому ради безопасности мы запланировали заменить её в конце этого месяца."
42180-126 = "Хватит болтать!"
42180-127 = "Какая нетерпеливая."
42180-128 = "Тогда сразу к делу. Держу пари, даже наши маленькие пукалки смогут прямо сейчас сбить эту вывеску."
42180-129 = ""
42180-132 = ""
42180-133 = "Стой, ты же не станешь!"
42180-135 = "Всем пригнуться и укрыться!"
42180-136 = ""
42180-145 = "Ах вы мелкие паршивки! Я этого так не оставлю!"
42180-147 = "Кирино, дымовая граната!"
42180-148 = "Пожалуйста, прикройте нос и рот!"
42180-149 = ""
42180-153 = "А-а! Я ничего не вижу!"
42180-154 = "Перекрыть вход! Не дайте им спрятаться в дыму и проскочить внутрь!"
42180-155 = ""
42180-157 = ""
42180-159 = "Стоило возникнуть проблеме, и они сразу бросились защищать станцию. Притворство быстро закончилось. Внизу точно что-то есть."
42180-160 = "Какой просчёт с их стороны. Такая оживлённая станция метро? Это родная территория Бюро общественной безопасности."
42180-161 = ""
42180-163 = ""
42180-164 = "Кирино, Фубуки."
42180-165 = "Вместе с остальными сотрудниками Бюро общественной безопасности задержите тех, кто устроил этот хаос."
42180-166 = "Я прикрою вход, чтобы больше незваных гостей не появилось."
42180-168 = "Есть, госпожа!"
42180-169 = "Но не забудь: за это ты должна мне лимитированный круллер из Master Donuts!"
42180-171 = "Если справитесь, я куплю тебе целую дюжину."
42180-172 = "Ну вот, SRT."
42180-173 = "Я доверяю вам двоим зачистку."
42180-174 = "Директор Канна, если вы снова ослушаетесь прямого приказа..."
42180-175 = "Не о чем беспокоиться."
42180-176 = "Я уже говорила вам, разве нет? Ответственность за свои решения я должна нести сама."
42180-177 = "Если это ради того, во что я верю, такое — детская забава."
42180-178 = "Директор..."
42180-179 = ""
42180-181 = ""
42180-182 = ""
42180-183 = "Сенсей, присмотрите за этими идиотами."
42180-184 = "[s] «Положитесь на меня!»"
42180-185 = "Ну а теперь..."
42180-186 = ""
42180-188 = ""
42180-189 = ""
42180-190 = ""
42180-191 = "Немного обидно, но, похоже, имя Бешеной Гончей теперь знают все. Я ведь не просила их так меня называть. Позвольте рассказать, как я заслужила это прозвище."
