[translation]
42180-1 = "Episódio 18;Elite e Elite"
42180-4 = "Seus imprestáveis...!#nEsqueceram a gratidão que nos devem por darmos comida e teto a vocês, que não tinham nem emprego nem casa?!"
42180-6 = "Gratidão? Para começo de conversa, não foram vocês que nos arrastaram à força e nos obrigaram a trabalhar?!"
42180-7 = "Depois do que aconteceu, eu tomei uma decisão.#nDe nunca mais trabalhar pelo resto da eternidade —"
42180-8 = "— E de enfrentar toda e qualquer propriedade deste mundo!"
42180-9 = "Podem vir, bando de pirralhos imundos afundados na ganância!"
42180-10 = "Gentalha como vocês não está à altura do grande Descartes!"
42180-12 = "Seu traidor ingrato... Sabe com quem está falando?!"
42180-23 = "A-Argh..."
42180-24 = "C-Camaradas... me ajudem...!"
42180-28 = "Ai! Dói, dói!"
42180-29 = "Não tem como enfrentar soldados regulares da Kaiser mesmo...!"
42180-30 = "F-Fujam...!"
42180-35 = "Seus covardes!! Não fujam!"
42180-37 = "Graças ao pessoal da \"Fecespo\", evitamos ficar em desvantagem numérica, mas...#nAinda nos falta poder de penetração."
42180-38 = "Não sabemos quando chegarão os reforços da Kaiser Security, então se não furarmos o bloqueio rápido, corremos o risco de sermos cercadas..."
42180-39 = "Mesmo sabendo do risco, não tenho escolha senão avançar eu mesma..."
42180-44 = "Hã? Aquela pessoa é..."
42180-51 = "...Que confusão toda é essa?"
42180-52 = "Quero uma explicação — Kaiser Security."
42180-53 = "Diretora do Departamento de Segurança Interna! Chegou na hora certa.#nDê um jeito nesse pessoal!"
42180-54 = "Lidar com esse tipo de desajustado social é o trabalho de vocês, não é?"
42180-59 = "Iiiih...! A-A \"Cão Feroz\" daquela vez...?"
42180-74 = "O-O que está fazendo...?!"
42180-75 = "A Diretora do Departamento de Segurança Interna da Academia de Polícia Valkyrie atirando em nós, que temos autoridade da Chefe do Gabinete de Defesa?!"
42180-77 = "...Diretora de Segurança Interna?"
42180-78 = "Vocês deveriam saber muito bem... o Departamento de Segurança Interna está suspenso por medidas disciplinares no momento."
42180-79 = "Então o que diabos veio fazer aqui?#nSem nenhuma autoridade... Não me diga que veio arrumar briga?"
42180-80 = "A manutenção da ordem aqui é nossa responsabilidade.#nA Valkyrie que dê o fora daqui!"
42180-81 = "Bem, mesmo sem o Departamento de Segurança Interna, ainda existe uma organização capaz de manter a ordem no D.U."
42180-82 = "— Regulamento de Serviço da Academia de Polícia Valkyrie, Artigo 32, Parágrafo 1. Alunas do \"Departamento de Segurança Pública\" podem deter temporariamente cidadãos que obstruam o uso do metrô e do transporte público."
42180-89 = "...Como parte do meu serviço comunitário, pensei em dar uma mão no trabalho do Departamento de Segurança Pública."
42180-95 = "Departamento de Segurança Pública! Larguem as armas e deitem-se no chão!"
42180-100 = "Sua idiota... o lixo parasita da sociedade está logo ali!"
42180-101 = "Nós estamos cumprindo um dever oficial legítimo conforme o regulamento!"
42180-103 = "Mesmo sendo da Kaiser Security, não há exceções!"
42180-104 = "Vocês causaram tumulto em frente à estação, então, por favor, acompanhem-nos sem resistência até a delegacia!"
42180-105 = "Se não quiserem colaborar, a gente também pode conter vocês à força, viu?#n...Antes que isso dê trabalho, venham logo sem reclamar~."
42180-107 = "...O Departamento de Segurança Pública? Vocês vão conter a gente...?"
42180-108 = "Heheh... Hahaha!"
42180-109 = "O-O que tem de tão engraçado?!"
42180-110 = "Não é óbvio? O Departamento de Segurança Pública contendo a gente à força?"
42180-111 = "Hoje atuamos sob outro nome, mas somos um grupo de elite formado pelos melhores membros vindos das SOF da Kaiser PMC."
42180-112 = "Já vocês são o Departamento de Segurança Pública, um bando improvisado com o equipamento mais precário de toda a Academia de Polícia Valkyrie. E acham mesmo que podem nos enfrentar... Só nos seus sonhos mais distantes!"
42180-113 = "Por mais competente que seja o comandante, ralé nenhuma tem chance contra a elite."
42180-115 = "Vocês só vão descobrir que existe um muro intransponível entre a elite e o resto. Desistam logo enquanto é tempo."
42180-117 = "Um bando improvisado...?#nParece que vocês entenderam tudo errado —"
42180-118 = "O Departamento de Segurança Pública é uma unidade especial reservada apenas à mais alta elite da Academia de Polícia Valkyrie."
42180-119 = "...A ponto de até eu, a Diretora do Departamento de Segurança Interna, já ter me candidatado ao Departamento de Segurança Pública e sido reprovada."
42180-121 = "O quê? Como assim...?"
42180-122 = "Ei, vocês sabiam~?"
42180-123 = "Já faz mais de 10 anos desde a última reforma da Estação Kousagi, né...#nOs pilares que sustentam a placa estão bem deteriorados."
42180-124 = "Nos últimos meses a gente tem recebido um mooonte de reclamações dizendo que a placa balança em dias de vento forte e dá medo."
42180-125 = "Por isso, por motivos de segurança, ela vai ser trocada no fim deste mês, mas —"
42180-126 = "E aonde você quer chegar com isso?"
42180-127 = "...Bem que você podia ouvir até o fim, né."
42180-128 = "Bom, resumindo... com um leve impacto, a placa pode acabar caindo."
42180-133 = "Essa garota, não pode ser —"
42180-135 = "Olha a cabeça aí em cima~"
42180-145 = "Malditas tiras, a gente pega leve e vocês já se acham...#nNão vamos ter piedade!"
42180-147 = "Kirino, granada de fumaça!"
42180-148 = "Deixa comigo!"
42180-153 = "Droga, minha visão..."
42180-154 = "Bloqueiem a entrada! Não deixem que entrem na estação!"
42180-159 = "Disseram que era pelo bem dos cidadãos, mas... pelo visto, não querem mesmo que ninguém se aproxime da estação."
42180-160 = "...Só que escolheram o lugar errado para se esconder. Para o Departamento de Segurança Pública, que faz patrulha aqui todo dia, a estação é praticamente o quintal de casa."
42180-164 = "Kirino, Fubuki."
42180-165 = "Junto com as outras alunas, cuidem de conter esses \"passageiros problemáticos\"."
42180-166 = "Vou ficar aqui vigiando a entrada para garantir que não apareçam mais suspeitos."
42180-168 = "Sim!"
42180-169 = "Diretora Kanna~#nVocê vai mesmo comprar aquele cruller edição limitada da Master Donut como prometeu, né?"
42180-171 = "Sim, eu não esqueci. Vou levar para você depois, sem falta."
42180-172 = "...E, SRT."
42180-173 = "O resto é com vocês."
42180-174 = "...Mas, se você desobedecer às ordens agora —"
42180-175 = "— Não precisa se preocupar com isso."
42180-176 = "Como eu já disse antes — decisões e responsabilidades, cada um assume as suas."
42180-177 = "Se for para defender a justiça em que acredito — não me importa o que aconteça comigo."
42180-178 = "Diretora..."
42180-183 = "Então, Sensei.#nCuide bem dessas idiotas."
42180-184 = "[s] \"Sim, obrigado, Kanna. Pode deixar comigo.\""
42180-185 = "Pois bem —"
42180-191 = "— Vocês já devem ter ouvido falar da \"Cão Feroz\" pelo menos uma vez, não?"
