[translation]
80000119-1 = "Странная конкуренция"
80000119-2 = "Я был занят работой до позднего вечера."
80000119-3 = ""
80000119-9 = "[ns] «...?»"
80000119-12 = "[ns1] «...Мм. Похоже, снова кто-то пришёл.»\n[ns2] Навести порядок вокруг."
80000119-15 = "Вы совершенно невозмутимы."
80000119-16 = "Понятно... Такие ситуации для вас уже обычное дело."
80000119-18 = ""
80000119-19 = "[ns3] «...Широко??»\n[ns4] «Вот как. Неожиданно.»"
80000119-22 = "Я надеялась застать вас врасплох, но не получилось."
80000119-23 = "...А?"
80000119-24 = "...Вы спрашиваете, что происходит? Это ваша главная забота?"
80000119-25 = "...Фуфу."
80000119-26 = "Моё внезапное появление вас не удивило, но вы совершенно не понимаете, зачем я здесь."
80000119-27 = "...Это была шутка. Я уже знаю, какой вы человек."
80000119-28 = "В таких вещах вы всегда были совершенно беспомощны... настолько, что даже мне это казалось чересчур."
80000119-29 = ""
80000119-31 = ""
80000119-32 = ""
80000119-33 = "[ns5] «А, это „тот самый шоколад“...»\n[ns6] «...На этот раз ты принесла „целую кучу“.»"
80000119-36 = "...Да. Вы запомнили."
80000119-37 = "Я верила, что запомните, поэтому на этот раз подготовила достаточно, Сенсей."
80000119-38 = "Теперь я могу позволить себе подарить вам что-то подобное, не создавая такой нагрузки. Во многих смыслах."
80000119-39 = "...А?"
80000119-40 = "...Почему я принесла тот же продукт, который подарила вам Широко из этого мира, только больше?"
80000119-41 = "Ммм... Это..."
80000119-42 = ""
80000119-44 = ""
80000119-45 = "[ns7] «...У вас тут какое-то соревнование?»\n[ns8] «Ты... думаешь о ней?»"
80000119-48 = "...Соревнование? Думаю о ней? Нет. Совсем не так."
80000119-49 = "Ни капли. Я прекрасно знаю всё, что сделала бы моя версия из этого мира."
80000119-50 = "Соревнование возможно только между равными соперниками, Сенсей. В моём случае..."
80000119-51 = "...я уже победила."
80000119-52 = "[s9] «Ты определённо очень о ней думаешь!!»\n[s10] «Хватит соревноваться в такой странной вещи!!»"
80000119-55 = "Фу-фу. Как я и предсказывала. Ожидаемая реакция."
80000119-56 = "...Спасибо. За то, что всегда остаётесь собой."
80000119-57 = "В любом случае, моя миссия завершена. Я довольна. Пойду, Сенсей."
80000119-58 = "[s11] «Что? Ты уже уходишь?»\n[s12] «Останься ненадолго!»"
80000119-61 = "Нет. Думаю, лучше не задерживаться. Кроме того, мы всегда можем связаться, когда потребуется."
80000119-62 = "А вы куда лучше меня умеете придумывать предлоги. Фу-фу."
80000119-63 = "Но... всё же..."
80000119-64 = "Я подумала, вам станет немного спокойнее... если время от времени я буду появляться лично."
80000119-65 = "...Да."
80000119-66 = "Если я права, вы просто такой человек. И я делаю это ещё и чтобы вас успокоить."
80000119-67 = "У меня всё хорошо, и так будет и дальше."
80000119-68 = "...Ну как? Я отличный студент, правда?"
80000119-69 = "[s13] «Ты проявляешь ко мне заботу? Потрясающе.»\n[s14] «Ты совсем взрослая. Только на тебя я и могу положиться, Широко.»"
80000119-72 = "...Фу-фу. Вы мне льстите."
80000119-73 = "Хотя часто приходить будет трудновато, учитывая моё положение и положение остальных."
80000119-74 = "Но время от времени я буду заглядывать. Когда вы свободны... например, как сейчас..."
80000119-75 = "...Ещё увидимся, Сенсей."
80000119-77 = "Широко ярко улыбнулась мне и быстро исчезла."
80000119-78 = "Широко подарила мне нелепое количество шоколада, но я съел всё, чтобы восстановить силы после уборки беспорядка в офисе."
