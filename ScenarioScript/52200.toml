[translation]
52200-1 = "Episódio 20;A Verdadeira Forma"
52200-2 = "Ela é... a Grande Profetisa Kuzunoha?"
52200-3 = "Que lugar mais misterioso... E pensar que uma pessoa tão graciosa é a Kuzunoha-sama..."
52200-4 = "Fufu, é natural que se surpreendam."
52200-5 = "Como a primeira Presidente do Hyakkaryouran, também sou versada na arte da estratégia.#nAfinal, alguém que reúna tamanha beleza e intelecto é raridade mesmo na longa história de Hyakkiyako."
52200-6 = "[s1] \"Você é... Kuzunoha?\"\n[s2] \"Você tem uma aura um pouco parecida com a da Nagusa.\""
52200-8 = "Oh? Não me desagrada, mas a ordem das coisas é justamente o inverso."
52200-9 = "Não sou eu quem se parece com Nagusa. É Nagusa quem se parece comigo."
52200-10 = "Apesar da aparência, já vivo há mais de alguns séculos."
52200-14 = "Hmm, então é você o Sensei de Schale."
52200-15 = "Há muito o que conversar, porém..."
52200-16 = "Está atrasado!"
52200-17 = "Faz ideia de quando lhe enviei aquela carta?"
52200-18 = "Ou será que... julga que o tempo corre diferente para uma existência como a minha?"
52200-19 = "[s3] \"E-Eu não me atrasei de propósito!\"\n[s4] \"Aconteceu muita coisa... Desculpe...\""
52200-22 = "Hmm... Pois bem."
52200-23 = "Fui eu mesma quem disse \"se houver alguém que deseja salvar\".#nE bem sei que há muitas alunas aguardando por você."
52200-24 = "Além disso... ao que parece, você encontrou sua resposta, não é mesmo?"
52200-25 = "[s] \"Kuzunoha, eu...\""
52200-29 = "Opaaa, já chega de cumprimentos, táá?"
52200-36 = "Não vão se esquecer de mim, viu? Quem trouxe vocês até aqui fui euuu!"
52200-37 = "Eu quero conversar com a Kuzunoha sobre o Livro Sinistro... Será que vocês podem dar licença?"
52200-38 = "Shuro..."
52200-39 = "O que foi, Nagusa-chan? Não adianta me encarar, eu não tenho medooo!"
52200-40 = "Sem a Hyakuren, você não consegue fazer nadinhaaa."
52200-41 = "Bem, graças a você eu encontrei o Templo do Crepúsculo, né?#nEntão posso até poupar a sua vida—"
52200-46 = "Gyaaah...! O-O que foi isso agora...?"
52200-47 = "Criança, não interrompa a conversa."
52200-48 = "Recue."
52200-53 = "M-Mentira... Anular o Livro Sinistro mesmo sem a Hyakuren...!"
52200-54 = "Ora, ora..."
52200-55 = "Afinal, fui eu quem concebeu a Hyakuren.#nNão haveria razão para eu ser incapaz de fazer o que ela faz."
52200-56 = "Mas que criança mais obtusa."
52200-57 = "Este é o \"Templo do Crepúsculo\", um lugar apartado do mundo mundano. No Crepúsculo, nada do que acontece é impossível... Serviu de boa lição, não?"
52200-67 = "Urgh... Uuuugh..."
52200-68 = "E-Eu vou contar tudo pra Kokuriko-sama!!"
52200-72 = "Fufu, até na hora de ir choramingar, continua sendo uma criança."
52200-76 = "E então, minha sucessora. Por qual motivo veio até aqui?"
52200-77 = "Não veio aqui apenas com o propósito de trazer o Sensei de Schale, veio?"
52200-78 = "..."
52200-79 = "O fato de você, que antes negava a minha existência, ter voltado a este templo... significa que passou a acreditar um pouco?"
52200-80 = "...Sim. Eu não nego mais a sua existência."
52200-81 = "Por você ter me reconhecido como digna de herdar o Hyakkaryouran, eu ganhei o direito de empunhar a Hyakuren..."
52200-82 = "Mas..."
52200-86 = "...Por que não foi a Ayame?"
52200-87 = "Ela era muito mais capaz do que eu e esperou por você o tempo todo... mas a Ayame nunca conseguiu te encontrar."
52200-88 = "Por que você apareceu diante de alguém tão fraca e imatura como eu?"
52200-89 = "Se você tivesse reconhecido ela e concedido a ela o direito de empunhar a Hyakuren..."
52200-91 = "...Nem a Ayame, nem ninguém do Hyakkaryouran teria se machucado."
52200-92 = "...Tudo poderia ter continuado igual."
52200-93 = "— Acredita mesmo que ninguém sairia ferido?"
52200-97 = "Acredita que, se Ayame tivesse me encontrado e dominado a Hyakuren... os dias felizes durariam para sempre?"
52200-98 = "Isso..."
52200-99 = "Parece haver um equívoco. Eu não escolho quem entra no \"Templo do Crepúsculo\"."
52200-100 = "O Templo do Crepúsculo é o resquício de um passado que se esvaiu há muito tempo.#nSeja a minha existência, seja esta paisagem, hoje quase ninguém mais se recorda."
52200-101 = "O passado é algo que se dissolve nas sombras."
52200-102 = "Portanto, quem persegue a luz do passado não consegue enxergar as sombras que ficaram para trás."
52200-103 = "Quem não consegue encarar a própria escuridão não pode se tornar a chama que ilumina os outros."
52200-104 = "Contudo, quem deixa a luz às costas e segue em frente... consegue perseguir a sombra que se projeta diante de seus olhos."
52200-105 = "...Por isso, você se encontrou comigo."
52200-106 = "Mas... eu não posso deixar a Ayame assim."
52200-107 = "Me diga..."
52200-108 = "Como eu posso fazer a Ayame voltar a ser como \"antes\"?"
52200-109 = "...Como antes, é?"
52200-113 = "Como era a \"verdadeira Ayame\" que você imagina?"
52200-114 = "A verdadeira... Ayame..."
52200-115 = "Ela era... sempre calorosa como um raio de sol sereno, nunca recusava nenhum pedido, a Presidente perfeita do Hyakkaryouran..."
52200-116 = "Será mesmo que isso era tudo o que Ayame era?"
52200-117 = "Uma pessoa verdadeiramente transparente, sem nenhuma diferença entre o que mostrava e o que guardava por dentro?"
52200-118 = "Isso..."
52200-121 = "Obrigada de novo por hoje, Nagusa! Foi uma ótima luta."
52200-125 = "Mas, quando a gente acorda de um sonho feliz, precisa encarar a realidade."
52200-129 = "Eu nunca te considerei uma amiga."
52200-134 = "Todos os que vivem neste mundo usam uma máscara."
52200-135 = "Não querer ser odiado, não querer ser abandonado — movidos por esse único desejo, vestem uma máscara com a forma e a cor que os outros esperam."
52200-136 = "Isso é algo natural para se viver."
52200-137 = "Porém... há aqueles cuja máscara aderiu tão firmemente ao rosto que muitos a confundem com sua verdadeira face."
52200-138 = "Quem pode julgar qual das duas faces está usando agora — é apenas a própria pessoa."
52200-139 = "Pergunto mais uma vez. Qual é a forma da verdadeira Ayame que você deseja?"
52200-143 = "A Ayame... que eu desejo..."
52200-151 = "Eu... não sei."
52200-152 = "Porque eu não sou a Ayame..."
52200-153 = "Mas... mesmo que eu não saiba, mesmo que a Ayame não precise de mim—"
52200-154 = "Eu quero ficar ao lado da Ayame."
52200-155 = "O que já aconteceu não pode ser desfeito. É como os mortos, que não retornam à vida. Não existe meio de fazer um ser que mudou voltar à sua forma original."
52200-156 = "A flor um dia murcha e dá frutos... e esses frutos caem ao chão e apodrecem.#nEssa é a lei do mundo... o ciclo de causa e efeito."
52200-157 = "Mas, ainda assim... se diz que há alguém que deseja salvar..."
52200-161 = "...Fufu. Parece que o Sensei [USERNAME] já compreendeu."
52200-164 = "Mas eu já estou bem."
52200-165 = "...Como a Hoshino-senpai conseguiu voltar do estado invertido?"
52200-166 = "Acho que talvez seja porque ainda era um estado incompleto."
52200-167 = "Além disso, a senpai abriu mão de uma parte da própria essência..."
52200-168 = "...Por isso, acho que ela conseguiu seguir em frente."
52200-171 = "Aceitar e reconhecer tanto o outro quanto a si mesmo, sem negar a forma que tiverem."
52200-172 = "Somente assim se pode dar o primeiro passo rumo ao amanhã..."
52200-173 = "Minha sucessora, deseja salvar Ayame?"
52200-174 = "...A qualquer custo."
52200-175 = "Então deixe de se entregar a sonhos efêmeros e encare-a de frente."
52200-176 = "Não desvie o olhar de quem ela é agora... nem de quem você foi até hoje."
52200-177 = "Se assim o fizer, tanto sua amiga que vaga pelo Crepúsculo... quanto essa mão estendida —#nreencontrarão uma à outra ao longo da jornada."
52200-178 = "Pronto, acabouuu! Chega, chegaaa!"
52200-184 = "Eu não vim aqui pra ouvir esse sermão chatooo!"
52200-185 = "Essa história de que dá pra se entender com alguém sendo sincero é uma mentira, uma meeeentira absoluta..."
52200-186 = "Se isso fosse verdade, quem é que ia se importar com boatos?!"
52200-187 = "A gente fica com medo de que todo mundo esteja rindo por baixo da máscara... e tenta provar o quanto é incrível!#nSenão, ninguém nem olha pra gente...!"
52200-188 = "Por isso... eu, que não consigo nem recuperar o Livro Sinistro... naquela hora em que perdi o Inou Mononokeroku, eu já..."
52200-189 = "\"Inou Mononokeroku\"?"
52200-190 = "Que significado teria uma coisa daquelas?#nNão passa de um livro velho e esfarrapado."
52200-191 = "U-Uma coisa daquelas...?"
52200-192 = "Já que se deu ao trabalho de vir até o Templo do Crepúsculo...#nConcederei também a você, criança, uma palavra de sabedoria."
52200-197 = "Um livro não se resume à capa ou à encadernação.#nSeu valor só existe pelo conteúdo que carrega."
52200-198 = "Ainda é difícil demais para uma criança...?#nNo dia em que compreender isso, certamente terá em mãos um livro que seja verdadeiramente seu."
52200-199 = "Isso é puro sofismaaa!!!"
52200-200 = "Sofisma...? Toda história começa justamente quando se tece um sofisma."
52200-201 = "Nesse ritmo, ainda levará muito tempo para se tornar uma boa contadora de histórias."
52200-206 = "Uuuugh..."
52200-207 = "Eu odeio... eu odeio mesmo, do fundo do coração, o Hyakkaryouran!"
52200-209 = "Próximo;O Olhar"
