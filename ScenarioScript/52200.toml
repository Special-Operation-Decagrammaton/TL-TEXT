[translation]
52200-1 = "Эпизод 20;Истинная форма"
52200-2 = "Эта девушка... действительно легендарная Великая Пророчица Кузуноха?"
52200-3 = "Мистическая обстановка подходит, но её хрупкая и милая внешность совсем этому не соответствует."
52200-4 = "Фу-фу. Естественно, ты так думаешь."
52200-5 = "В конце концов, я основатель и первый президент Хяккарёран, обучена искусству войны, красива и талантлива. Во всей долгой истории Хяккияко трудно найти мне равную."
52200-6 = "[s1] «Ты... Кузуноха?»\n[s2] «Манера речи почему-то напоминает Нагусу...»"
52200-8 = "О? Сравнение мне приятно, но, боюсь, ты перепутал временную последовательность."
52200-9 = "Не я похожа на Нагусу. Это Нагуса похожа на меня."
52200-10 = "Потому что я существовала веками до того, как Нагуса вообще появилась в утробе."
52200-11 = ""
52200-13 = ""
52200-14 = "Итак, Сенсей Шале."
52200-15 = "Мне многое нужно с тобой обсудить, но для начала..."
52200-16 = "Вы опоздали!"
52200-17 = "Только сейчас пришёл ко мне, спустя столько лун после того, как Нагуса передала письмо? Отговорка «дела» работает лишь до определённого момента."
52200-18 = "Может, ты решил, что дух лисы вроде меня не подвержен времени и пренебрежению, которое приходит вместе с его течением."
52200-19 = "[s3] «Я-я не специально опоздал!»\n[s4] «Обстоятельства были... но мне правда жаль, что так долго.»"
52200-22 = "Хмм... Ну хорошо."
52200-23 = "Полагаю, в приглашении я и правда сказала: «если есть кто-то, кого ты хочешь спасти». Я знаю, сколько студентов зависят от тебя и ждут."
52200-24 = "И если я хоть что-то понимаю в человеческих лицах, похоже, ты уже нашёл свой ответ."
52200-25 = "[s] «Кузуноха, правда в том, что я...»"
52200-26 = ""
52200-29 = "Хорошо-хорошо. Достаточно."
52200-30 = ""
52200-32 = ""
52200-33 = ""
52200-34 = ""
52200-36 = "Ты не забыл, правда? Вы вообще не оказались бы здесь без меня."
52200-37 = "Так что — вон. Мне нужно обсудить с Кузунохой том."
52200-38 = "Ябуки Сюро..."
52200-39 = "О-о-о, какой страшный взгляд, Нагуса. Чего тебе?"
52200-40 = "Без Сотни Лотосов ты можешь только смотреть! Хмф!"
52200-41 = "Ну, благодаря тебе я всё-таки нашла Сумеречный храм, так что, пожалуй, сохраню тебе жалкую жизнь."
52200-42 = ""
52200-44 = ""
52200-46 = "Ч-Что?! Ты только что... ударила меня?!"
52200-47 = "Детям не следует перебивать взрослых."
52200-48 = "Теперь жди своей очереди."
52200-49 = ""
52200-51 = ""
52200-53 = "О-Она меня ударила... У неё даже Сотни Лотосов нет... Как она нейтрализовала магию тома?"
52200-54 = "*вздох* Ты не только грубиянка, но ещё и дурочка."
52200-55 = "Я сама сущность Полномочия Президента. Ты действительно думала, что я не смогу владеть тем, что сама создала?"
52200-56 = "Твоё невежество впечатляет."
52200-57 = "И ты стоишь на земле Сумеречного храма, во владениях мира духов. Думала, можно доверять течению времени? Реальности в том виде, к которому привыкла?"
52200-58 = ""
52200-60 = ""
52200-61 = ""
52200-67 = "Уа... УА-А-А-А...!"
52200-68 = "Я-я пожалуюсь на тебя Кокурико!"
52200-69 = ""
52200-71 = ""
52200-72 = "Фу-фу, как ребёнок, думающий, что сможет зарезать дракона ножом."
52200-76 = "Итак, моя преемница, зачем ты снова ступила на эту землю?"
52200-77 = "Не только ради того, чтобы сопроводить сюда Сенсея, верно?"
52200-78 = "..."
52200-79 = "Ты отвергла моё существование и покинула храм. И всё же вернулась. Теперь признаёшь, что я — легендарная Кузуноха?"
52200-80 = "Да. Больше я не буду отрицать твоё существование."
52200-81 = "Именно твоё признание позволило мне владеть Сотней Лотосов как законной преемнице Хяккарёран."
52200-82 = "Но..."
52200-83 = ""
52200-85 = ""
52200-86 = "...почему не Аямэ?"
52200-87 = "Аямэ способнее меня во всём. И она ждала тебя снова и снова."
52200-88 = "Так почему? Почему ты появилась перед такой, как я — совершенно некомпетентной и слабой?"
52200-89 = "Если бы ты признала Аямэ, если бы даровала ей Полномочие Сотни Лотосов..."
52200-91 = "...Аямэ и все в Хяккарёран были бы в безопасности."
52200-92 = "...Всё не изменилось бы так, как изменилось."
52200-93 = "Ты правда в это веришь?"
52200-94 = ""
52200-96 = ""
52200-97 = "Если бы Аямэ владела Сотней Лотосов, ты действительно думаешь, что она привела бы всех к счастливому финалу?"
52200-98 = "Это..."
52200-99 = "Позволь исправить несколько твоих заблуждений. Не моя рука и не моё разрешение проводят людей через Сумеречный храм."
52200-100 = "То, что ты видишь здесь, — эхо прошлого. Это место, само моё существование... забытые остатки, которых нет в реальности, откуда ты пришла."
52200-101 = "В этих странных сумерках, где свет пересекается с тьмой, прошлое становится тенью и растворяется во мраке."
52200-102 = "Те, кто гонится за светом своего прошлого, никогда не увидят его теней."
52200-103 = "А те, кто не способен встретиться со своей тенью, никогда не смогут осветить путь другим."
52200-104 = "Лишь тот, кто без страха проливает свет прошлого, способен одолеть тьму собственных теней."
52200-105 = "И ИМЕННО поэтому, в отличие от Аямэ, мы с тобой встретились."
52200-106 = "Но всё же... я не могу оставить Аямэ такой."
52200-107 = "Поэтому прошу. Пожалуйста..."
52200-108 = "Как вернуть Аямэ её истинную форму?"
52200-109 = "...Истинную форму, говоришь."
52200-110 = ""
52200-112 = ""
52200-113 = "Скажи, моя преемница. Какой была настоящая Аямэ? Что это за истинная форма, которую ты ищешь?"
52200-114 = "Настоящая Аямэ..."
52200-115 = "Моя Аямэ... Она была словно полуденное солнце, безупречный президент Хяккарёран, всегда готовая протянуть руку любому, кому нужна помощь."
52200-116 = "И это точное отражение её души?"
52200-117 = "Для тебя, знавшей её лучше всех, именно такой была Аямэ? И внутри, и снаружи?"
52200-118 = "Это..."
52200-120 = ""
52200-121 = "Хороший бой. Спасибо, Нагуса."
52200-124 = ""
52200-125 = "А вот со счастливыми снами... суровый контраст с реальностью, в которую приходится просыпаться."
52200-128 = ""
52200-129 = "Ты никогда не была моей подругой, Горё Нагуса."
52200-131 = ""
52200-132 = ""
52200-133 = ""
52200-134 = "Каждое живое существо носит маску."
52200-135 = "Мы боимся ненависти и покинутости. Поэтому надеваем самую приятную маску и молимся, чтобы нас приняли."
52200-136 = "Такова цена общества."
52200-137 = "И когда маска сидит идеально, для окружающих грань между реальностью и вымыслом размывается."
52200-138 = "Только тот, кто её носит, знает, где проходит эта грань."
52200-139 = "Поэтому я спрошу ещё раз. Кто эта «истинная Аямэ», которую ты желаешь?"
52200-140 = ""
52200-142 = ""
52200-143 = "Аямэ... которую я желаю..."
52200-150 = ""
52200-151 = "Я... не знаю ответа. Я не она."
52200-152 = "Я не могу притворяться, будто знаю, кем Аямэ была под своей маской."
52200-153 = "Но... даже если я не способна это понять, даже если она отталкивает меня..."
52200-154 = "Я всё равно хочу быть рядом с Аямэ."
52200-155 = "Пролитая вода не вернётся в чашу, а мёртвые никогда не воскреснут. Так же невозможно вернуть изменившуюся душу в прежнее состояние."
52200-156 = "Как цветок не может дать плод, пока не увянет, а плод, в свою очередь, упадёт с цветка и сгниёт. Мир незыблем в своих законах, а причина и следствие неизбежны."
52200-157 = "Если, несмотря на всё это, ты всё равно хочешь кого-то спасти..."
52200-158 = ""
52200-160 = ""
52200-161 = "Фу-фу. Что ж, Сенсей [USERNAME] уже знает ответ."
52200-163 = ""
52200-164 = "Но я узнала одну важную вещь."
52200-165 = "Я поняла, как Хошино смогла вернуться в нормальное состояние."
52200-166 = "В отличие от меня, её состояние было неполным, и преобразила её не Хрома."
52200-167 = "И в конце ей пришлось отказаться от части самой себя, части своей природы..."
52200-168 = "Так она смогла двинуться вперёд."
52200-170 = ""
52200-171 = "Если человек способен увидеть себя за собственной маской, перестать отрицать и принять и хорошее, и уродливое..."
52200-172 = "Тогда любой сможет шагнуть в завтра."
52200-173 = "Моя преемница, ты хочешь спасти Аямэ?"
52200-174 = "Да. Я сделаю всё что потребуется."
52200-175 = "Тогда ответ прямо перед тобой. Не отрицай её."
52200-176 = "То, чего не можешь понять, не отвергай. Когда хочется убежать и спрятаться, встреться с ней лицом к лицу и не отступай. Только так найдёшь путь."
52200-177 = "Сделай это — и снова встретишь и подругу, блуждающую в сумерках, и руку, которой когда-то к ней потянулась."
52200-178 = "...Достаточно!"
52200-179 = ""
52200-181 = ""
52200-182 = ""
52200-184 = "Думаете, я проделала весь этот путь ради вашей затхлой старческой лекции?"
52200-185 = "Люди... обычные люди... никогда не смогут понять друг друга!"
52200-186 = "Если бы достаточно было проговорить подобную чушь, чтобы тебя поняли и спасли, кому вообще были бы нужны слухи?!"
52200-187 = "Нужно постоянно гадать, что люди думают за своими масками, и доказывать себя, даже если больно! Иначе никто о тебе даже не вспомнит!"
52200-188 = "Иначе... такой, как я, у которой даже тома больше нет... после потери «Фантомных записей Ино»..."
52200-189 = "«Фантомные записи Ино»...?"
52200-190 = "А, та потрёпанная книжка с историями о призраках? Зачем тебе вообще нужна эта старая вещь?"
52200-191 = "С-Старая вещь...?"
52200-192 = "Раз ты проделала весь путь до Сумеречного храма, я поделюсь с тобой мудростью, дитя."
52200-193 = ""
52200-195 = ""
52200-196 = ""
52200-197 = "Истинная ценность книги заключена в её истории, а не в позолоченной обложке."
52200-198 = "Поймёшь это — и однажды у тебя появится собственный том."
52200-199 = "Ты просто увиливаешь от вопроса и несёшь чушь!"
52200-200 = "Чушь...? Разве ты не знаешь, что все истории начинаются с капельки чуши?"
52200-201 = "Тебе ещё очень далеко до настоящего рассказчика."
52200-203 = ""
52200-206 = "Угх..."
52200-207 = "Вот поэтому я так ненавижу Хяккарёран!"
52200-209 = "Следующий эпизод;Чужой взгляд"
