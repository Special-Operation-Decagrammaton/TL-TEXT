[translation]
90000030-1 = "Эпизод 4;Исследование, Часть 3: Раскопки ЧВК"
90000030-2 = "Окраины Района Миллениума"
90000030-4 = "Добро пожаловать, Сенсей. Мы Вас ждали."
90000030-5 = "Новая клубная комната, наконец, готова."
90000030-6 = "[s] «Новая клубная комната?»"
90000030-7 = "В временной клубной комнате Декаграмматон обнаружил нас из-за недостаточной защиты."
90000030-8 = "Восстанавливать всё уничтоженное оборудование было бы слишком хлопотно."
90000030-9 = "Поэтому Президент Химари решила найти другое место."
90000030-10 = "По словам президента, теперь в Кивотосе нет места безопаснее от Декаграмматона."
90000030-11 = "Она сама расскажет Вам подробности. Пройдёмте."
90000030-12 = ""
90000030-14 = ""
90000030-15 = "Это совершенно секретный объект, так что, пожалуйста, не потеряйтесь."
90000030-16 = "[s] «Веди.»"
90000030-17 = ""
90000030-23 = "Я проследовал за Эйми через лабиринт переулков, лифтов и скрытых дверей, пока мы наконец не добрались."
90000030-24 = ""
90000030-28 = "Клубная комната Отряда Исследования Сверхъестественного"
90000030-30 = "[ns] «Погодите. Разве это не...?»"
90000030-31 = "Я привела Сенсея."
90000030-32 = ""
90000030-34 = ""
90000030-35 = ""
90000030-37 = "Президент?"
90000030-38 = "Вы серьёзно?"
90000030-39 = ""
90000030-41 = ""
90000030-42 = ""
90000030-44 = ""
90000030-45 = ""
90000030-46 = ""
90000030-47 = ""
90000030-48 = ""
90000030-49 = "[ns] «Химари?»"
90000030-50 = "Президент..."
90000030-51 = ""
90000030-53 = ""
90000030-54 = ""
90000030-55 = ""
90000030-56 = ""
90000030-57 = ""
90000030-58 = "Аааааа?!"
90000030-59 = ""
90000030-61 = ""
90000030-62 = "Где я? Кто вы?! О, Эйми."
90000030-63 = "Сенсей прибыл, Президент."
90000030-64 = "[s] «Доброе утро»."
90000030-65 = "О. Кхм."
90000030-66 = "Добро пожаловать, Сенсей. Вы наконец добрались."
90000030-67 = "Позвольте официально приветствовать вас в клубной комнате Отряда Исследования Сверхъестественного."
90000030-68 = "Это место защищено системой брандмауэра, изобретённой мной лично. Разумеется, нет места безопаснее в Кивотосе, чем за крепостью моего гения."
90000030-69 = "О существовании этого места знаем только мы трое."
90000030-70 = "Хи-хи. Разве мы не похожи на секретную организацию? Что? Конечно нет, я не спала ранее."
90000030-71 = "Слюна на уголке Вашего рта говоорит об обратном."
90000030-72 = "..."
90000030-73 = "Не моя вина, что Вы уснули. Вероятно, это из-за того, что Вы установили слишком высокую температуру на термостате."
90000030-74 = "Идеальная температура в помещении около минуса пятидесяти пяти градусов. Холод стимулирует мозг."
90000030-75 = ""
90000030-77 = ""
90000030-80 = "С ума сошла? Для меня комфортная работа возможна только при температуре не ниже восемнадцати градусов минимум."
90000030-81 = ""
90000030-83 = ""
90000030-85 = "А? Я не ослышалась? Наверное, Вы имели в виду восемь градусов."
90000030-86 = ""
90000030-88 = ""
90000030-90 = "Я по-твоему мороженое на палочке? Не хочу работать в морозильнике."
90000030-91 = ""
90000030-93 = ""
90000030-95 = "[ns] «Эм... Девочки...»"
90000030-96 = ""
90000030-98 = ""
90000030-99 = "[ns3] «Слева кондиционер работает на полную...»\n[ns4] «Справа обогреватель работает на полную...»"
90000030-100 = "Всё из-за Президента! Разве Вас не волнует электричество?"
90000030-101 = "Вот видите, Президент? Разве Вас не волнует электричество?"
90000030-102 = "Твои претензии беспочвенны, Эйми. А счета за свет всё равно придут Рио."
90000030-103 = "Вы раскрыли свои карты. Настало время моего последнего средства."
90000030-104 = ""
90000030-106 = ""
90000030-107 = "А? Какого средства?"
90000030-108 = "!.. Нет, ни за что. Не приближайся ко мне ни на шаг. Разве нельзя решить всё цивилизованно?"
90000030-109 = "[s] Изменить температуру."
90000030-110 = ""
90000030-112 = ""
90000030-114 = ""
90000030-115 = "[ns] «Вот это настоящая комнатная температура.»"
90000030-116 = "...Немного тепло, но терпимо."
90000030-117 = "Полагаю, лёгкая прохлада поможет мне не заснуть."
90000030-118 = "[s] «Хороший компромисс, все.»"
90000030-121 = "Президент, каков план?"
90000030-122 = "Наша исходная цель остаётся прежней: раскрыть тайну Декаграмматона."
90000030-123 = "Однако, как мы все прекрасно знаем, Декаграмматон нашёл нас первым."
90000030-124 = "Я всё ещё не оправилась от позора. Подумать только, такое случилось со мной, самой гениальной и прекрасной хакершей Миллениума."
90000030-125 = "(Не думаю, что красота тут имеет значение.)"
90000030-126 = "Он уже знает о нас, а мы всё ещё топчемся на месте. Плохо, когда враг информирован лучше тебя."
90000030-127 = "Знание — сила. Без него нам Декаграмматона не одолеть."
90000030-128 = "Поэтому я разработала новый план. Сначала найдём пророков."
90000030-129 = "Пророков? Почему именно их?"
90000030-130 = "Даже если Декаграмматон — разновидность органической технологии, сама концепция пророков выглядит странно."
90000030-131 = "Они и не клоны, и не бездумные подчинённые Декаграмматона, но фанатичные последователи со свободной волей."
90000030-132 = "И их имена не дают мне покоя..."
90000030-134 = "Мы соберём и проанализируем данные пророков, а через них узнаем больше об этом загадочном ИИ."
90000030-135 = "На данный момент подтверждены три пророка."
90000030-136 = "Бина, Хесед и, возможно... Ход."
90000030-137 = "Судя по их именам и показаниям Сенсея, думаю, они связаны с древним преданием под названием «Древо Жизни»."
90000030-138 = "Какую?"
90000030-142 = "Древо Жизни. Давно утраченная тайна, забытая почти всеми в Кивотосе."
90000030-143 = "Забытая? Тогда откуда Вы о ней знаете, Химари?"
90000030-144 = "Я разве я не сказала «почти»? Эйми, какое у меня прозвище?"
90000030-145 = "Эм... Цветок, плавающий в септике?"
90000030-146 = "Сколько раз повторять? «Септик» предназначен для Рио. Как тебе может настолько не хватать здравого смысла?"
90000030-147 = "Теперь это считается здравым смыслом?"
90000030-148 = "В любом случае, я местный гений Миллениума со степенью по всеведению. Конечно, я знаю тайны Кивотоса."
90000030-149 = "Хм..."
90000030-150 = "Давно хотела спросить... Такая степень вообще существует?"
90000030-151 = "Я слышала странные слухи, но подтвердить их не смогла. Не понимаю. Как вообще можно знать всё?"
90000030-152 = "Хи-хи. Эйми, однажды тебе придётся научиться пользоваться силой народа."
90000030-153 = "...Это вообще ничего не объясняет."
90000030-154 = "[s] «Так, насчёт пророков...»"
90000030-155 = "А, да, конечно."
90000030-156 = "Прошу прощения, Сенсей. Я увлеклась."
90000030-157 = "Нет-нет. Тут, возможно, виновата я."
90000030-158 = "В любом случае..."
90000030-159 = "Вернёмся к Древу Жизни..."
90000030-163 = "В нём есть десять атрибутов, именуемые «Сефирот». Пророки Декаграмматона присвоили себе имена этих Сефирот."
90000030-164 = "Бина, Хесед и Ход..."
90000030-165 = "Значит, есть ещё семь пророков? Это намного больше, чем мы предполагали."
90000030-166 = "Древо Жизни символизирует «путь к Божьему провидению». Иными словами, речь о становлении богом через десять Сефирот... что совпадает с заявлениями Декаграмматона."
90000030-167 = "Я всё ещё собираю данные, но... если их существование подтвердится, мы больше не сможем это игнорировать."
90000030-168 = "Древо Жизни... Сефирот... путь к Божьему провидению... Чтобы понять, как всё связано, нужно получить данные пророков."
90000030-169 = "И как Вы планируете это сделать?"
90000030-170 = ""
90000030-173 = "Первый шаг — одолеть их."
90000030-176 = "Мы точно знаем лишь двух из десяти пророков. Ход всё ещё не подтверждён."
90000030-177 = "Начнём с того, кого можем. Возможно, ответы найдутся по пути."
90000030-178 = "[s] «Звучит логично. За дело, команда!»"
90000030-179 = "Поняла."
90000030-180 = "Раз все согласны, следующая миссия Отряда Исследования Сверхъестественного — найти Бину с Хеседом и получить их данные."
90000030-181 = ""
90000030-183 = ""
90000030-184 = "Миссия Отряда Исследования Сверхъестественного по анализу Декаграмматона начинается вновь."
90000030-188 = "Наша первая цель снова Пустыня Абидос, президент?"
90000030-189 = "При взломе мы потеряли все данные."
90000030-190 = "Да. Но данные не проблема, большую часть я уже восстановила."
90000030-191 = "Меня больше беспокоит другое."
90000030-192 = "Что может быть важнее наших данных?"
90000030-193 = "ЧВК Кайзер."
90000030-194 = "Мы не знаем, что и для чего они раскапывали в Пустыне Абидос."
90000030-195 = "Слишком уж большое совпадение, что это происходило ровно в месте последнего известного появления Бины."
90000030-196 = "Не удивлюсь, если загадочный проект Кайзер связан с Декаграмматоном. Нужно проверить."
90000030-197 = "В этом есть смысл."
90000030-198 = "Вы собираетесь проникнуть в базу данных Кайзера? Президент, это разумно?"
90000030-199 = "За кого ты меня принимаешь, Эйми?"
90000030-200 = "Я Химари, первый президент Веритас, самая изящная и прекрасная девушка Миллениума. Я могу входить и выходить из базы данных любой частной компании когда захочу."
90000030-201 = "...Не упускаете шанса упомянуть красоту."
90000030-202 = "К тому же у данных ЧВК наверняка менее строгая защита. Они не связаны  со штаб-квартирой Кайзера."
90000030-203 = "Попытка не пытка."
90000030-204 = "Поверю Вам на слово, Президент."
90000030-205 = ""
90000030-207 = ""
90000030-208 = "Миссия определена. Цель — украсть данные ЧВК Кайзер."
90000030-209 = "[s] «Хорошо. Приступим.»"
