[translation]
90001060-1 = "Эпизод 6;Пламя"
90001060-4 = ""
90001060-5 = ""
90001060-6 = "..."
90001060-7 = "..."
90001060-8 = ""
90001060-10 = ""
90001060-11 = ""
90001060-12 = "?"
90001060-13 = ""
90001060-15 = ""
90001060-17 = "[ns1] «Мы дошли по следу до самого конца...»\n[ns2] «Вулкан... посреди тундры?»"
90001060-20 = "Тепло!"
90001060-21 = "Слишком жарко!"
90001060-22 = "По-моему, в самый раз."
90001060-23 = ""
90001060-25 = ""
90001060-26 = ""
90001060-27 = "Нет, Эйми. Здесь всё ещё слегка холодно, а ты, как всегда, слегка странная."
90001060-28 = "Люди созданы для жизни при таких— нет, при температурах гораздо теплее этой!"
90001060-29 = "Холод был приятным и освежающим. А здесь слишком жарко."
90001060-30 = ""
90001060-32 = ""
90001060-33 = "Это выше моего порога. Сейчас я сниму одежду, Сенсей."
90001060-34 = "[s] «Нет, Эйми! Сдерживайся!»"
90001060-35 = "Но почему? Люди от природы легче переносят холод, чем жару."
90001060-36 = "При внезапном воздействии жары можно даже получить тепловой удар."
90001060-37 = "Мы не приспособлены переносить тепловой удар. Некоторые симптомы: обморок, судороги, низкое давление, обезвоживание и даже СМЕРТЬ."
90001060-38 = "Что ещё хуже, при смерти от теплового удара бывает трудно определить причину смерти."
90001060-39 = "Подводя итог: продолжать эту операцию и заставлять меня терпеть такую экстремальную жару — бесчеловечно."
90001060-40 = "[s3] «Ты подозрительно хорошо знаешь эти симптомы...»\n[s4] «Но потерпи ещё совсем немного...»"
90001060-43 = "...Прости, что доставляем тебе неприятности, Сенсей."
90001060-44 = "А? Для тебя честь получить от меня извинения?"
90001060-45 = "Само собой. В конце концов, кто ещё способен настолько идеально сопереживать другим..."
90001060-46 = "...и утешать их, кроме меня? Кроме нежной, хрупкой, гениальной хакерши? Доброй и великодушной президента? Всемогущей И всеведущей красавицы?"
90001060-47 = "Эта простая задача даётся мне так же легко, как дыхание. Да, простая задача. Я сказала это дважды, чтобы особенно подчеркнуть, насколько она для меня проста."
90001060-48 = ""
90001060-51 = "[ns] «...Да. Абсолютно. Конечно. Ты права, Химари.»"
90001060-52 = "Твоё выражение лица и слова невероятно противоречат друг другу."
90001060-55 = ""
90001060-56 = "След заканчивается здесь. Я разведаю впереди. Однако..."
90001060-57 = "Ожидаемый рельеф изменился, а значит, изменилась и ситуация."
90001060-58 = "Кроме того..."
90001060-59 = ""
90001060-61 = ""
90001060-65 = ""
90001060-66 = "Сейчас работает множество машин."
90001060-67 = "Да. Копают, бурят, перевозят, сносят... Очень заняты."
90001060-68 = "Это буровая машина, верно?"
90001060-69 = "Бурение... в основном используется для добычи ресурсов, так? Значит, здесь что-то добывают?"
90001060-70 = "В вулканических районах часто образуются различные руды."
90001060-71 = "Например, вулканы образуют медную руду, а рядом с действующим вулканом можно добывать много серы. Но—"
90001060-72 = ""
90001060-74 = ""
90001060-76 = ""
90001060-78 = ""
90001060-80 = ""
90001060-82 = "Президент?!"
90001060-83 = "Помехи связи! Токи?"
90001060-85 = "Да, президент Химари. Я подтвердила мощный сигнал подавления, транслируемый по всему району. Кроме того..."
90001060-86 = ""
90001060-88 = ""
90001060-89 = ""
90001060-90 = "...похоже, Аби-Эшух тоже под его воздействием. Этот сигнал подавления работает, перегружая электронику."
90001060-91 = "Не проблема. По моему опыту, если очень сильно ударить по технике, обычно всё работает."
90001060-93 = "Э-Эйми?!"
90001060-94 = ""
90001060-97 = ""
90001060-98 = ""
90001060-99 = ""
90001060-100 = "...Не сработало."
90001060-101 = "Странно. Может, угол был неправильный?"
90001060-102 = "[s] «Нет. Не думаю, что проблема была в этом...»"
90001060-103 = "Неужели...?"
90001060-104 = "Из-за отсутствия вариантов я снижу мощность до обычного режима."
90001060-105 = "Я могу убрать Аби-Эшух во временный прицеп, который госпожа Рио создала с помощью AMAS."
90001060-106 = "...Отрицательно. Сигнал подавления также нарушил работу прицепа. Единственный оставшийся вариант..."
90001060-107 = "...разобрать Аби-Эшух вручную."
90001060-109 = "Я могу помочь."
90001060-110 = "Спасибо, Эйми."
90001060-111 = ""
90001060-115 = ""
90001060-116 = "Подождите. Любое оборудование, которое всё ещё работает..."
90001060-117 = "Да. Я могу использовать любое активное устройство, чтобы обратить сигнал подавления. Он достаточно сильный, так что это должно быть возможно..."
90001060-118 = "Нашла! Сигнал идёт оттуда!"
90001060-127 = ""
90001060-128 = "Это... радарная база? Какой-то странный объект..."
90001060-129 = "Возможно, он предназначен для передачи этого сигнала подавления."
90001060-130 = "...Что бы это ни было, нужно немедленно решить проблему с помехами."
90001060-131 = "По какой причине?"
90001060-132 = "Потеря Аби-Эшуха как боевого средства — огромный удар по нашим силам."
90001060-133 = "Кроме того, и мне крайне неприятно это признавать..."
90001060-134 = "..."
90001060-135 = "Но без подразделений AMAS Рио и её навигации оставаться здесь, мягко говоря, рискованно."
90001060-136 = "Речь исключительно о полезности доступных нам инструментов. Понятно? Понятно?"
90001060-137 = "(Когда дело касается госпожи Рио, она просто не может быть честной с собой.)"
90001060-138 = "Понятно, Эйми. Ваше выражение лица читается так: «Президент Химари не может быть честной с собой, когда дело касается госпожи Рио.»"
90001060-140 = "?!?!"
90001060-142 = "Ты умеешь читать мысли?"
90001060-143 = "Нет. Я просто сказала это вслух."
90001060-144 = "Я так и думала..."
90001060-145 = "[s] «Для начала пойдём туда.»"
90001060-146 = "Да. Так и поступим, Сенсей. И ситуация, и обстоятельства указывают в том направлении."
90001060-147 = "Следуйте за мной."
90001060-148 = "Будьте осторожны, Сенсей. Президент. Все."
