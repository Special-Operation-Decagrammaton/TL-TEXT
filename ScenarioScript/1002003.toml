[translation]
1002003-1 = "О чём ты говоришь?"
1002003-2 = "(С Кохару было что-то не так, поэтому я отправился в Тринити, чтобы найти её.)"
1002003-3 = "(Долго искать не пришлось. Уроки только что закончились, и она стояла у главных ворот.)"
1002003-4 = "..."
1002003-5 = "(Другие студенты болтают по дороге домой, а Кохару не произносит ни слова.)"
1002003-6 = "[s] «Кохару?»"
1002003-7 = "Ч-что?!"
1002003-8 = "С-Сенсей? Что ты здесь делаешь?"
1002003-9 = "[s1] «Ты совсем не появлялась в MomoTalk.»\n[s2] «Я волновался за тебя.»"
1002003-10 = "Ч-Что?! А, это..."
1002003-11 = "Ч-Что?! А, это..."
1002003-12 = "Ничего серьёзного. Я просто..."
1002003-13 = "Ничего."
1002003-14 = "[s] «Почему ты такая тихая?»"
1002003-15 = "Я-я не специально. Просто... думала о том, что произошло раньше."
1002003-16 = "Я-я поняла, что поспешила с выводами и наговорила лишнего, поэтому хотела извиниться."
1002003-17 = "В-Вот и всё..."
1002003-18 = "...что я хотела сказать."
1002003-19 = "[s] «...?»"
1002003-20 = "..."
1002003-22 = "(Пока мы стояли там, через школьные ворота проходили всё новые студенты.)"
1002003-23 = "(В конце концов у ворот остались только мы с Кохару.)"
1002003-25 = "..."
1002003-26 = "*всхлипывает*"
1002003-27 = "*хнык*"
1002003-28 = "[s] «Ч-Что случилось?!»"
1002003-29 = "Почему?"
1002003-30 = "Зачем ты сюда пришла?"
1002003-31 = "Только потому, что я отправила то сообщение?"
1002003-32 = "Не может быть!"
1002003-33 = "Здесь должно быть что-то ещё!"
1002003-34 = "Я знаю, что у тебя есть какой-то скрытый мотив!"
1002003-35 = "[s] «Ну, по крайней мере ты снова стала собой.»"
1002003-36 = "Я-я ведь почти ничего не написала в том сообщении."
1002003-37 = "Ты правда пришёл сюда только потому, что волновался за меня? И всё? Серьёзно?"
1002003-38 = "...Не может быть."
1002003-39 = "Это неправда. У тебя наверняка есть другая причина..."
1002003-40 = "Когда происходит что-то такое, в конце всегда оказывается какой-нибудь подвох."
1002003-41 = "Может, ты пытаешься усыпить мою бдительность и отвести меня куда-нибудь в безлюдное место..."
1002003-42 = "Например, в пустую кладовую спортзала или..."
1002003-43 = "...А-а-а!"
1002003-44 = "[s] «Что?»"
1002003-45 = "Вот оно, да?!"
1002003-46 = "Я должна была сразу догадаться..."
1002003-47 = "...что всё к этому и идёт!"
1002003-48 = "Ты наверняка с самого начала всё это планировал!"
1002003-49 = "[s3] «Клянусь, это недоразумение.»\n[s4] «Ты где-то про такое прочитала, да?»"
1002003-50 = "Рядом с тобой нельзя терять бдительность!"
1002003-51 = "Рядом с тобой нельзя терять бдительность!"
1002003-52 = "Хорошо, что я знаю все твои уловки. Кто знает, что бы ты сделал с кем-нибудь другим?"
1002003-53 = "Но что, если... ты нацелился именно на меня, потому что я слишком много о тебе знаю?!"
1002003-54 = "Точно. Всё сходится..."
1002003-55 = "[s] «Эм... Кохару, повторишь ещё раз?»"
1002003-56 = "Теперь всё ясно."
1002003-57 = "Это миссия — то, что я обязана сделать как член Отряда справедливости."
1002003-58 = "Я должна защитить студентов от злых замыслов Сенсея!"
1002003-59 = "Только я могу тебя остановить!"
1002003-60 = "*всхлип* Другого выхода нет. Если придётся, я... вытерплю это!"
1002003-61 = "[s5] «Кивотос вызывает Кохару.»\n[s6] Похлопать Кохару по плечу."
1002003-62 = "А-а-а!"
1002003-63 = "А-а-а!"
1002003-64 = "И-и-и!"
1002003-65 = ""
1002003-66 = "(...)"
1002003-67 = "[s] «...»"
1002003-69 = "(Кохару снова впала в панику, а затем опять убежала.)"
