[translation]
10030060-1 = "Эпизод 6;Куриный хот-пот для души"
10030060-3 = ""
10030060-4 = "...Кастрюля уже гремит."
10030060-5 = "У меня слюнки текут..."
10030060-7 = "Чихиро, ты что-то готовила, пока мы занимались овощами?"
10030060-8 = "Только бульон. Бульону всегда нужно время."
10030060-9 = "Дай посмотреть, дай посмотреть—"
10030060-10 = ""
10030060-12 = ""
10030060-13 = ""
10030060-14 = ""
10030060-15 = "А? Там только водоросли и сушёные грибы..."
10030060-16 = "Разве мы не брали ещё курицу?"
10030060-17 = "Подожди ещё немного. Если положить мясо слишком рано, оно просто разварится."
10030060-18 = ""
10030060-20 = ""
10030060-21 = ""
10030060-22 = "Пока бульон доваривается, нарежем курицу на кусочки и насадим на эти шампуры..."
10030060-23 = ""
10030060-25 = ""
10030060-26 = "Потом обжарим её на углях, пока снаружи не появится хрустящая корочка..."
10030060-28 = "Огонь не слишком сильный? Такими темпами мясо сгорит..."
10030060-29 = "Держи шампур вот так. Нам нужно лишь слегка обжарить кожу."
10030060-30 = "Жир из кожи растопится, и мы добавим его в кастрюлю, чтобы бульон стал насыщеннее и жирнее."
10030060-31 = "Когда всё будет готово, некоторое время поварим подготовленные овощи и грибы."
10030060-32 = "[s1] «Мало что может быть лучше общего хот-пота...»\n[s2] «О-о, давно я не ел мизутаки.»"
10030060-35 = "Именно, Сенсей. Я подумала, что мизутаки идеально подойдёт для нашей поездки."
10030060-36 = "Мизутаки...?"
10030060-37 = "Это региональное блюдо в формате хот-пота, обычно с курицей и разными овощами."
10030060-38 = "Впервые я попробовала его, когда ездила к оператору связи в D.U. на консультацию по безопасности. Оказалось вкуснее, чем я ожидала, и теперь время от времени готовлю сама."
10030060-39 = "По-моему, в холодную погоду хот-пот подходит для похода куда лучше, чем карри или рагу."
10030060-40 = "Выглядит как простое блюдо из обычных ингредиентов..."
10030060-42 = "Но пахнет очень вкусно..."
10030060-43 = "Кажется, я нашла уязвимость нулевого дня для собственного желудка..."
10030060-48 = ""
10030060-50 = "Похоже, курица готова... Может, начнём?"
10030060-51 = ""
10030060-54 = ""
10030060-67 = "Сначала попробуйте бульон, а потом немного мяса."
10030060-68 = ""
10030060-71 = "Ах... Так тепло..."
10030060-72 = "Может, дело в холодном воздухе... но бульон кажется особенно насыщенным..."
10030060-73 = "Вкус бульона так хорошо сочетается с курицей... Очень вкусно!"
10030060-74 = "[s] «Этот вкус согревает душу...»"
10030060-75 = "Хи-хи! Я рада, что всем нравится."
10030060-76 = "Я переживала, что получится не очень, потому что впервые готовлю на улице."
10030060-77 = "На вкус даже лучше, чем еда в ресторанах академии."
10030060-78 = "Говорят, голод — лучшая приправа. За день на улице мы отлично нагуляли аппетит."
10030060-81 = ""
10030060-82 = "Теперь попробуем грибы, морковь и тофу..."
10030060-83 = "Аха-ха! Смотрите — Котама, это ты так криво нарезала морковь?"
10030060-84 = "Н-Нет, мои кусочки моркови не кривые..."
10030060-85 = "Я пыталась вырезать из них милые звёздочки..."
10030060-86 = "Странная форма совсем не портит вкус. Прямо чувствуется, как овощи пропитались куриным бульоном."
10030060-87 = "[s] «Кажется, счастье растекается по всему телу...»"
10030060-90 = ""
10030060-91 = "А? Уже всё?"
10030060-92 = "В кастрюле остался только бульон."
10030060-93 = "Я вроде наелась... но будто чего-то не хватает."
10030060-95 = "Не волнуйтесь. У нас остался последний ингредиент."
10030060-96 = ""
10030060-99 = ""
10030060-101 = "Что-то ещё нужно готовить? Разве мы уже не добавили всё мясо и овощи?"
10030060-102 = ""
10030060-104 = ""
10030060-105 = "Когда основные ингредиенты съедены... трапезу обязательно надо завершить удоном!"
10030060-106 = "О, ты приготовишь удон в бульоне от мизутаки!"
10030060-107 = "Именно. Всё-таки сегодня последний день года."
10030060-108 = "Было бы жаль провести вечер без тосикоси-собы, правда?"
10030060-109 = "Одной из причин выбрать хот-пот было то, что в конце мы сможем приготовить новогодний удон."
10030060-111 = "Если подумать, в прошлом году я не ела тосикоси-собу..."
10030060-112 = "С учётом той ужасной ситуации, в которой мы оказались, в прошлом году нам было совсем не до такой готовки..."
10030060-113 = "Ну да, как мы могли что-то готовить, когда вели битву всей жизни на Восточных равнинах?"
10030060-115 = "Наш клуб никогда не меняется..."
10030060-119 = "Удон готов. Давайте есть, пока не размок."
10030060-120 = ""
10030060-122 = ""
10030060-123 = ""
10030060-124 = ""
10030060-125 = ""
10030060-126 = "...Т-Так вкусно!"
10030060-128 = "Никогда бы не подумала, что в глуши можно съесть такой деликатес."
10030060-129 = "Я нашла... то, чего мне не хватало..."
10030060-130 = "[s] «Хот-пот обязательно надо заканчивать удоном!»"
10030060-132 = "А, пожалуйста, не забудьте сразу помыть посуду после удона."
10030060-133 = "Если оставить в лагере пищевые отходы, они могут привлечь диких животных, ищущих еду."
10030060-134 = ""
10030060-137 = "...Похоже, даже после еды расслабиться некогда."
10030060-138 = "Хотелось бы заморозить этот момент во времени..."
10030060-140 = "Ни за что! Тогда мы навечно застрянем в лагере без интернета!"
10030060-141 = ""
10030060-143 = ""
10030060-148 = "Мы с членами Веритас наслаждались послевкусием нашего удона из хот-пота."
10030060-152 = ""
10030060-155 = "Позже, когда я задремал у костра..."
10030060-162 = "Сенсей...?"
10030060-163 = ""
10030060-167 = ""
10030060-168 = "Вижу, вы всё ещё не спите."
10030060-169 = "[s3] «Привет, Харэ. Ты ещё не спишь?»\n[s4] «Я думал, ты уже легла.»"
10030060-172 = "Я думала, что усну сразу после того, как уберу посуду..."
10030060-173 = "Но почему-то не получается."
10030060-174 = "Маки жаловалась, что не сможет уснуть без всех своих подушек, но отключилась сразу, как только легла."
10030060-175 = "Наверное, за день она вымоталась от ходьбы."
10030060-176 = "...Сейчас кто-нибудь ещё не спит?"
10030060-177 = "[s] «Чихиро сказала, что завтра нужно встать до рассвета, но...»"
10030060-178 = ""
10030060-183 = "[ns] «Кажется, прямо сейчас нас кто-то подслушивает.»"
10030060-184 = ""
10030060-186 = ""
10030060-187 = ""
10030060-188 = "...Ой."
10030060-189 = "[s] «Котама, хочешь выйти и поболтать с нами?»"
10030060-190 = ""
10030060-191 = "Ц... Не ожидала, что вы меня заметите."
10030060-192 = ""
10030060-194 = ""
10030060-196 = "...Котама? Давно ты там прячешься?"
10030060-197 = "...Я уже некоторое время не сплю."
10030060-198 = "Я спряталась здесь и решила представить себя записывающим устройством, которое ловит личный разговор Сенсея и Харэ..."
10030060-199 = "Ч-Чего ты вообще ожидала?!"
10030060-200 = ""
10030060-203 = "[ns5] «Для кофе уже поздновато... Хотите какао?»\n[ns6] «Холодно, я сделаю какао, чтобы мы согрелись.»"
10030060-204 = ""
10030060-205 = ""
10030060-207 = ""
10030060-208 = "Звучит неплохо."
10030060-209 = "Большое спасибо."
10030060-213 = "На холоде, подогретое у костра, это какао почему-то казалось слаще обычного."
10030060-214 = "Успокоить уставшее тело сахаром — особое удовольствие."
10030060-215 = "Да. Сегодня столько всего произошло..."
10030060-216 = "[s] «Тебе понравился поход со всеми?»"
10030060-217 = "Хм..."
10030060-218 = "Если бы мне пришлось описать впечатления одним предложением..."
10030060-219 = ""
10030060-221 = ""
10030060-222 = "Среднячок."
10030060-224 = "Неприятно..."
10030060-225 = "[s] «Ну скажи уже, что ты думаешь на самом деле!»"
10030060-227 = "Бороться на природе даже за базовые удобства довольно неприятно."
10030060-228 = "Холодно, у стульев нет подушек, и..."
10030060-229 = "У нас нет интернета и никакой электроники..."
10030060-230 = "И я сегодня не выпила ни одного энергетика..."
10030060-231 = "Но хот-пот на ужин был вкусным."
10030060-232 = "Ага, ты права, но..."
10030060-233 = "Если учитывать всю работу на готовку и уборку, не уверена, что вкусный хот-пот стоит таких мучений..."
10030060-234 = "Веритас стремится к истине, а не к хорошим гастрономическим впечатлениям."
10030060-235 = "[s7] «...Понимаю твою мысль.»\n[s8] «Пожалуй, вкусы у всех разные.»"
10030060-236 = ""
10030060-237 = ""
10030060-239 = ""
10030060-240 = "Но..."
10030060-241 = ""
10030060-243 = ""
10030060-244 = ""
10030060-245 = "Поход оказался не таким плохим, как я думала."
10030060-246 = "Без отвлекающих вещей из клубной комнаты я могу больше сосредоточиться на настоящем моменте, а обычно я так не делаю."
10030060-247 = "Здесь нет фейерверков в честь Нового года и толп, заполнивших улицы, но..."
10030060-248 = "Почти полная тишина этих гор помогает мне взглянуть на прошедший год свежим взглядом..."
10030060-249 = ""
10030060-252 = ""
10030060-253 = "...Почти пора начинать всё заново."
10030060-255 = "Есть что-то спокойное в том, чтобы встретить Новый год без обратного отсчёта и звона колоколов..."
10030060-256 = ""
10030060-258 = ""
10030060-259 = "С Новым годом, Сенсей."
10030060-260 = "Пусть и этот год будет для нас замечательным."
10030060-261 = "[s] «И тебя с Новым годом.»"
10030060-265 = "*зевок*"
10030060-266 = "Нам пора внутрь, Сенсей."
10030060-267 = "Нужно немного поспать, если хотим завтра увидеть рассвет."
10030060-268 = "Спокойной ночи, Сенсей."
10030060-269 = "[s] «Спи хорошо. Увидимся утром.»"
10030060-270 = ""
10030060-272 = ""
10030060-275 = "Оставшуюся часть ночи я дремал у костра и окончательно уснул, когда погасли последние угольки..."
