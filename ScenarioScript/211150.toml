[translation]
211150-1 = "Episode 15;Mayumi"
211150-3 = "(Suddenly, I remembered the activities of the Restoration Committee.)"
211150-7 = "[ns] \"What a sight...\""
211150-8 = "(The Trigger Happy Zone was the physical manifestation of the Gehenna students' destructive instincts.)"
211150-13 = "...Phew."
211150-18 = "[ns] \"That is...\""
211150-22 = "Finally done."
211150-26 = "This oil drum is done for... I'll have to procure some more."
211150-27 = "I need to replace the targets with new ones, too."
211150-31 = "Oh, Sensei?"
211150-32 = "Wow! Welcome! Did you get the urge to go wild too, Sensei?"
211150-33 = "[s1] \"That's not it, but...\"\n[s2] \"Were you cleaning this up all by yourself?\""
211150-36 = "Yep, that's right."
211150-37 = "Pretty impressive, right? The \"Trigger Happy Zone\"!#nIt's become a place where tons of people come every single day."
211150-38 = "Shooting, blowing things up, digging, throwing... it's always a huge ruckus!"
211150-39 = "As expected of us, right? It's super effective! Everyone absolutely loves it!"
211150-40 = "But, you know, it breaks down pretty fast because of that."
211150-41 = "It doesn't even last a day before it's all tattered."
211150-42 = "It's kind of funny, but if it stays broken, everyone's mood just drops."
211150-43 = "[s] \"Even if you replace it, they're just going to break it again, right?\""
211150-44 = "I mean, yeah. But people's hearts are complicated, you know?"
211150-45 = "Like, when you're thinking, \"Time to shoot!\", you don't really want to shoot at something that's already falling apart."
211150-46 = "There's a certain joy in destruction—a thrill—when things look brand new!#nDon't you think so, Sensei?"
211150-47 = "[s3] \"Is that how it works...?\"\n[s4] \"Now that you mention it, I think I get it...\""
211150-50 = "Hehe, right?"
211150-51 = "That's why I always keep it clean."
211150-52 = "If I don't, everyone will stop coming."
211150-53 = "[s] \"Isn't it hard doing it all by yourself?\""
211150-54 = "The other girls help out too. But I think I'm the one who comes here the most!"
211150-55 = "Whenever I think about cleaning up, my feet just start moving on their own.#nI'm confident in my ability to take action, at least!"
211150-56 = "[s] \"I'll help you out, too.\""
211150-57 = "Huh!?"
211150-58 = "Uh... I appreciate it, but this is pretty heavy labor, you know?"
211150-65 = "..."
211150-66 = "Hehehe, oh well! If we do it together, it'll be done in no time!"
211150-67 = "Alright, let's do this!"
211150-73 = "(I continued cleaning and repairing with Mayumi.)"
211150-74 = "(It was harder than I expected, and quite a bit of time had passed by the time we finished.)"
211150-77 = "[ns] \"We're done!\""
211150-79 = "Thanks to you, Sensei, it was super fast! You're a lifesaver!"
211150-80 = "You're really reliable, Sensei!"
211150-81 = "...Well, even if we make it this clean, it'll be tattered again in no time."
211150-82 = "When that happens, we'll just clean it up again!"
211150-83 = "Hehe, I hope everyone has a blast."
211150-87 = "Hmm? You're wondering why I go this far?"
211150-88 = "That's because—"
211150-89 = "It's to make Gehenna great again!!"
211150-90 = "You can feel it too, right, Sensei?#nEverything we've done hasn't been in vain."
211150-91 = "The explosions and shootouts that used to happen every day... incidents and accidents have visibly decreased.#nThere aren't any more claymores going off in the middle of the schoolyard."
211150-92 = "Plus, people are actually able to stand in line now!"
211150-93 = "A school full of problem children and troublemakers, a Gehenna full of chaos...#nit's slowly starting to change."
211150-94 = "It's the result of our hard work! Gehenna is becoming great, step by step!"
211150-95 = "[s] \"You really love Gehenna, don't you, Mayumi?\""
211150-96 = "Of course!"
211150-97 = "I think everyone loves their own school, but still."
211150-98 = "Gehenna is the best! It's an incredibly wonderful school!!"
211150-99 = "...Of course, it was a bit of a mess until now."
211150-100 = "But from here on out, it's definitely going to get better!"
211150-101 = "[s] \"Just like you're doing right now, huh?\""
211150-102 = "Hehe... yeah."
211150-103 = "Sensei, you know... lately, every day has been so much fun."
211150-104 = "I think about the things that were taken for granted until yesterday and ask, \"Why are they taken for granted?\"#nAnd then I make sure they aren't taken for granted starting tomorrow."
211150-105 = "Because none of the choices that made Gehenna what it was until now were \"ours.\""
211150-106 = "But now, our choices are slowly changing Gehenna.#nDon't you think that's amazing?"
211150-107 = "So, I have to work even harder!"
211150-108 = "Especially when you help me out like today, I feel like I can do anything. Yeah! Absolutely!!"
211150-109 = "[s] \"I'm counting on you in the future, too.\""
211150-110 = "You got it! I'm counting on you too, Sensei!"
211150-111 = "Make Gehenna great again!!"
211150-113 = "(Mayumi is always bright and gives it her all.)"
211150-114 = "(I hope this girl's smile lasts forever.)"
211150-121 = "Hehehe! Shoko Igarashi, what do you want today?"
211150-122 = "Is the maintenance of the broadcasting room finished?"
211150-127 = "It is already complete. Also, I have one report that I think Chairman Makoto will be pleased to hear."
211150-128 = "Oh?"
211150-129 = "In addition to inspecting the entire broadcasting system, I have installed the latest audio equipment in every corner of the school,#nensuring there are no places where the broadcast cannot reach."
211150-130 = "Hehehe, magnificent!"
211150-131 = "Expanding the infrastructure without using the Pandemonium Society's budget.#nThat is truly \"reaping where one has not sown.\""
211150-133 = "Isn't that something you shouldn't say in front of the person involved?"
211150-135 = "This thick-skinned nature is exactly the capacity required for someone standing at the pinnacle of Gehenna."
211150-136 = "You understand well!#nIroha, you should actively learn from her!"
211150-138 = "Yeah, yeah."
211150-140 = "Chairman Makoto. I have a proposal."
211150-141 = "The school broadcast will resume shortly.#nDon't you think it would be a waste to just let that momentous occasion pass by?"
211150-145 = "It seems you have an idea. Let's hear it."
211150-146 = "How about a surprise speech by Chairman Makoto to the entire school?"
211150-147 = "There couldn't be a more fitting moment to announce the dawn of a new Gehenna."
211150-152 = "Hehehehe. It's as if this stage was prepared just for me!"
211150-154 = "I, Makoto Hanuma, shall make a legendary speech that will echo throughout Gehenna!"
211150-156 = "She's fired up now."
211150-157 = "No need to worry about the scoop for next week's issue! I'll be sure to cover it thoroughly!"
211150-159 = "Ibuki is looking forward to Senior Makoto's speech too!"
211150-166 = "—Make Gehenna great again."
211150-170 = "Next Episode;An Inevitable Occurrence"