[translation]
211150-1 = "Эпизод 15;Маюми"
211150-3 = "Проходя мимо места недавнего побоища, я невольно задумался о том, как идут дела у Лиги наследия..."
211150-4 = ""
211150-7 = "[ns] «Ну и зрелище...»"
211150-8 = "И как раз когда я размышлял о разрушительных инстинктах студентов Геенны..."
211150-9 = ""
211150-13 = "...*вздох*"
211150-14 = ""
211150-18 = "[ns] «Это...?»"
211150-21 = ""
211150-22 = "С этим ещё можно поработать..."
211150-23 = ""
211150-25 = ""
211150-26 = "А вот эти бочки уже не починить... Придётся достать новые."
211150-27 = "И мишень изодрана в клочья. Так, «новые мишени»... Добавим в список."
211150-28 = ""
211150-30 = ""
211150-31 = "А? Сенсей?"
211150-32 = "Ого! Какими судьбами? Хотели немного выпустить пар... в официально разрешённом порядке?"
211150-33 = "[s1] «Не совсем...»\n[s2] «Маюми, ты тут всё убираешь в одиночку?»"
211150-36 = "А, ага! Вы правы."
211150-37 = "Зона безудержной стрельбы — дело серьёзное! Каждый день сюда приходят десятки студентов."
211150-38 = "Они стреляют, взрывают, копают, бросают всякое, просто всё КРУШАТ без причины... Настоящий хаос!"
211150-39 = "Но мы справились! Ха-ха! Всем нравится место, которое мы построили."
211150-40 = "Вот только оно быстро приходит в негодность."
211150-41 = "Не проходит и дня, чтобы тут не устроили полный разгром..."
211150-42 = "Ирония в том, что студентам не нравится, когда мы оставляем тут всё в беспорядке."
211150-43 = "[s] «Но разве его не специально построили, чтобы всё тут крушить?»"
211150-44 = "Верно, но люди устроены сложно."
211150-45 = "Им не хочется стрелять по тому, что уже разбито."
211150-46 = "Есть особое удовольствие в том, чтобы разбить и разрушить что-то чистенькое и новенькое. Понимаете, о чём я?"
211150-47 = "[s3] «Н-не уверен...?»\n[s4] «Но, возможно, ты права...»"
211150-50 = "Фу-фу, правда же? Это врождённая тяга к разрушению."
211150-51 = "Вот поэтому я здесь. Нужно поддерживать чистоту и порядок."
211150-52 = "Ведь мы хотим, чтобы студенты возвращались сюда снова и снова..."
211150-53 = "[s] «Так вот почему ты убираешь здесь всё сама»."
211150-54 = "Остальные тоже помогают! Но да, чаще всего здесь я."
211150-55 = "Стоит мне подумать: «Надо бы чем-нибудь заняться», как я уже вовсю работаю. Ха, вы ведь знаете, что я не люблю сидеть сложа руки!"
211150-56 = "[s] «Я тоже помогу!»"
211150-57 = "А? Правда?"
211150-58 = "Эм... Я не откажусь от помощи, но работа здесь довольно грязная, знаете ли."
211150-59 = ""
211150-64 = ""
211150-65 = "..."
211150-66 = "Хи-хи, ну ладненько! Вместе мы закончим намного быстрее."
211150-67 = "Спасибо, Сенсей!"
211150-73 = "Мы с Маюми довольно долго приводили площадку в порядок и чинили повреждения."
211150-74 = "Работа оказалась тяжелее, чем я ожидал, так что закончить удалось не сразу."
211150-77 = "[ns] «Наконец-то готово!»"
211150-78 = ""
211150-79 = "Ура! Благодаря вашей помощи мы управились в два счёта!"
211150-80 = "Вы меня правда выручили, Сенсей! От всего сердца!"
211150-81 = "Сейчас здесь чисто и аккуратно, но завтра наверняка снова всё разгромят."
211150-82 = "А мы опять всё уберём!"
211150-83 = "Лишь бы всем здесь было весело! Хи-хи."
211150-84 = ""
211150-86 = ""
211150-87 = "М? Почему я «всем этим занимаюсь»?"
211150-88 = "Ну..."
211150-89 = "Чтобы возродить величие Геенны!"
211150-90 = "Сенсей, вы же понимаете, что мы ДЕЙСТВИТЕЛЬНО многое изменили?"
211150-91 = "Число взрывов, перестрелок и погромов на территории академии заметно сократилось."
211150-92 = "Студенты уже привыкли вставать здесь в очередь, и теперь никто не взрывает противопехотную мину прямо посреди стадиона."
211150-93 = "Академия, известная нарушителями порядка, проказниками и вечным хаосом, уходит в прошлое. Геенна меняется к лучшему!"
211150-94 = "И всё это благодаря нашим усилиям! Геенна становится всё величественнее!"
211150-95 = "[s] «Ты и правда любишь Геенну, Маюми»."
211150-96 = "Ага! Конечно люблю!"
211150-97 = "Наверное, большинству студентов Кивотоса НРАВИТСЯ своя академия..."
211150-98 = "И это нормально, но Геенна просто потрясающая."
211150-99 = "...Разумеется, до недавнего времени мы двигались вперёд не так уж быстро."
211150-100 = "Но я знаю, что в будущем всё станет лучше. Геенна станет ВЕЛИКОЙ."
211150-101 = "[s] «Как и ты сейчас, Маюми»."
211150-102 = "Хи-хи... Ага."
211150-103 = "Сенсей, в последнее время я радуюсь каждому дню."
211150-104 = "Мне так нравится замечать то, на что я раньше не обращала внимания, и работать над тем, чтобы завтра стало лучше."
211150-105 = "Ведь прежде «наши» решения никак не влияли на общую культуру Геенны."
211150-106 = "А теперь наши решения и поступки понемногу меняют саму Геенну. Разве не чудесно?"
211150-107 = "Поэтому мы должны выкладываться на полную!"
211150-108 = "Уверена, с вашей помощью нам всё по плечу. Прямо как сегодня. Да, я совершенно уверена!"
211150-109 = "[s] «Верно. Надеюсь, мы ещё не раз поработаем вместе, Маюми»."
211150-110 = "Хи-хи, да! Я тоже, Сенсей!"
211150-111 = "Слава Геенне!!!"
211150-113 = "Маюми всегда выкладывалась полностью и сохраняла жизнерадостность."
211150-114 = "Я надеялся, что её улыбка никогда не исчезнет."
211150-115 = ""
211150-120 = ""
211150-121 = "Ки-хе-хе... Что на этот раз, Игараши Шоуко?"
211150-122 = "Вы закончили готовить радиорубку?"
211150-123 = ""
211150-125 = ""
211150-127 = "Именно. А ещё у меня есть новости, которые наверняка вас обрадуют, председатель Макото."
211150-128 = "Хм?"
211150-129 = "Мы не только проверили всё оборудование, но и модернизировали школьную систему оповещения. Теперь она полностью соответствует современным требованиям, и наш сигнал достигнет каждого студента."
211150-130 = "Ки-хе-хе, превосходно!"
211150-131 = "Вы обновили инфраструктуру, не потратив ни монеты из бюджета Пандемониума. Вот ЭТО я называю эффективным распределением труда."
211150-133 = "Невежливо говорить такое прямо при них."
211150-135 = "Такая дерзкая прямота свойственна лишь тому, кто стоит на вершине Геенны."
211150-136 = "Ки-хе-хе! Безупречный анализ! Ироха, записывай!"
211150-138 = "Да-да, конечно."
211150-140 = "Раз уж с этим покончено, я хотела бы сказать вам несколько слов, председатель Макото."
211150-141 = "Скоро радиовещание возобновится, и мы ведь не можем оставить такое историческое событие без внимания, правда?"
211150-142 = ""
211150-144 = ""
211150-145 = "Кажется, ты что-то задумала. Продолжай."
211150-146 = "Председатель Макото, как вы смотрите на то, чтобы выступить с речью перед всеми студентами академии?"
211150-147 = "Лучшего повода отпраздновать рождение новой Геенны не найти. Вы сможете обратиться ко всем, поздравив себя с собственными достижениями."
211150-148 = ""
211150-150 = ""
211150-151 = ""
211150-152 = "Ки-хе-хе, прекрасно! Я не упущу такой момент!"
211150-154 = "Я, Ханума Макото, возвещу золотой век Пандемониума исторической, легендарной речью!"
211150-156 = "Макото прямо загорелась."
211150-157 = "Ого! Теперь можно не беспокоиться о выпуске на следующей неделе! У нас сенсация!"
211150-159 = "Ибуки тоже с нетерпением ждёт речи Макото!"
211150-160 = ""
211150-162 = ""
211150-164 = ""
211150-165 = ""
211150-166 = "Да. Слава Геенне."
211150-170 = "Следующий эпизод;Чему суждено случиться, того не миновать"
