#[!][Build: "1"]
#[!][Data: "20/09"]
[translation]
211150-1 = "Episódio 15;Mayumi"
211150-3 = "(De repente, lembrei-me das atividades do Comitê de Restauração)"
211150-4 = ""
211150-7 = "[ns] \"Que cenário impressionante...\""
211150-8 = "(A Zona do Gatilho Fácil havia se tornado a encarnação viva do instinto destrutivo das alunas de Gehenna)"
211150-9 = ""
211150-13 = "...Ufa."
211150-14 = ""
211150-18 = "[ns] \"Aquela ali é...\""
211150-21 = ""
211150-22 = "Finalmente terminei!"
211150-23 = ""
211150-25 = ""
211150-26 = "Esses tambores aqui já viraram sucata imprestável... Preciso encomendar mais um lote com urgência."
211150-27 = "E tenho que fixar alvos novinhos em folha nos suportes também."
211150-28 = ""
211150-30 = ""
211150-31 = "Ué, Sensei?!"
211150-32 = "Aaaaah! Seja bem-vindo! Deu vontade de descarregar a artilharia e tocar o terror também?"
211150-33 = "[s1] \"Não é bem isso, mas...\"\n[s2] \"Você estava limpando e arrumando tudo sozinha?\""
211150-36 = "Aham, tudinho!"
211150-37 = "A 'Zona do Gatilho Fácil' é surreal de incrível, não é?!#nVirou um ponto de encontro lotado de alunas o dia inteiro!"
211150-38 = "É tiro de bazuca, detonação de dinamite, granada voando, buraco no chão... Uma festa apoteótica!"
211150-39 = "A gente mandou muito bem! O resultado foi espetacular, todo mundo amou de paixão!"
211150-40 = "Só que... quanto mais a galera se diverte, mais rápido tudo vai pro chão."
211150-41 = "Não dura um dia inteiro sem ficar tudo esburacado e em pedaços."
211150-42 = "E parece até piada, mas se o lugar fica em ruínas por muito tempo, a animação da galera despenca."
211150-43 = "[s] \"Mas mesmo se você colocar tudo novo, elas vão explodir de novo, não vão?\""
211150-44 = "É verdade, mas a psicologia humana é cheia de firulas, sabe?"
211150-45 = "Na hora em que a pessoa pensa 'vou meter bala com tudo!', ver um monte de entulho já detonado meio que corta o barato."
211150-46 = "Quando tá tudo arrumadinho com cara de novo, o prazer da demolição e o êxtase da destruição batem muito mais gostoso!#nVocê não acha, Sensei?"
211150-47 = "[s3] \"Pensando por esse lado...\"\n[s4] \"Até que faz bastante sentido.\""
211150-50 = "Hihihi, não é?!"
211150-51 = "Por isso eu faço questão de deixar tudo tinindo de limpo e organizado sempre."
211150-52 = "Se eu relaxar nisso, as garotas vão parar de vir pra cá."
211150-53 = "[s] \"Mas dar conta de tudo isso sozinha deve ser exaustivo demais...\""
211150-54 = "As outras meninas ajudam quando podem, mas quem mais bate ponto aqui sou eu mesma!"
211150-55 = "Quando penso 'preciso arrumar a bagunça', minhas pernas já saem correndo sozinhas no automático.#nSe tem uma coisa em que eu me garanto de olhos fechados é iniciativa e disposição física!"
211150-56 = "[s] \"Eu vou te ajudar também.\""
211150-57 = "QUÊÊÊ?!"
211150-58 = "N-Nossa... Eu fico super agradecida, mas é um trabalho pesado pra caramba, viu?"
211150-59 = ""
211150-64 = ""
211150-65 = "......"
211150-66 = "Ehehe, pensando bem... em dois vai ser infinitamente mais rápido! Que maravilha!"
211150-67 = "Bora lá então, mãos à obra!!"
211150-73 = "(Continuei o trabalho de limpeza e reparos ao lado de Mayumi)"
211150-74 = "(Era um serviço bem mais árduo do que parecia, e o tempo voou até terminarmos)"
211150-77 = "[ns] \"Prontinho, terminamos～!\""
211150-78 = ""
211150-79 = "Caraca, com a sua ajuda voou super rápido! Salvou a minha vida, Sensei!"
211150-80 = "Você é um companheiro de ouro mesmo, que orgulho!"
211150-81 = "...Bom, amanhã vai estar tudo estraçalhado de novo, claro."
211150-82 = "Mas aí é só vir e arrumar tudinho outra vez, vida que segue!"
211150-83 = "Ehehe, tomara que a galera aproveite cada segundo amanhã～"
211150-84 = ""
211150-86 = ""
211150-87 = "Hum? Por que eu me mato de trabalhar tanto assim por isso?"
211150-88 = "Porque――"
211150-89 = "É PRA TORNAR GEHENNA GRANDE DE NOVO!!"
211150-90 = "Você também sente isso no peito, não sente, Sensei?#nNada do que nós fizemos até hoje foi em vão."
211150-91 = "Aquele tiroteio desenfreado e as explosões que rolavam a qualquer segundo caíram drasticamente.#nNinguém mais precisa ter medo de pisar numa mina terrestre no meio do pátio."
211150-92 = "E mais: a galera aprendeu a fazer fila civilizada!"
211150-93 = "Uma Gehenna que todo mundo rotulava como esgoto de delinquentes e depósito do caos...#ntá se transformando pouquinho a pouquinho."
211150-94 = "Esse é o fruto do nosso suor diário! Gehenna está crescendo rumo à grandeza a cada passo!"
211150-95 = "[s] \"Você ama Gehenna de corpo e alma mesmo, né, Mayumi.\""
211150-96 = "Mas com toda certeza do universo!"
211150-97 = "Todo mundo gosta da sua própria escola, eu sei."
211150-98 = "Mas Gehenna é simplesmente a número um! É a escola mais espetacular e vibrante de todas!!"
211150-99 = "...Quer dizer, antes a situação era meio deprimente, confesso."
211150-100 = "Mas daqui pra frente tudo vai ser infinitamente mais brilhante!"
211150-101 = "[s] \"Assim como você está brilhando agora, cuidando de tudo.\""
211150-102 = "Ehehe... obrigada."
211150-103 = "Sensei, sabe de uma coisa? Meus dias têm sido tão felizes ultimamente..."
211150-104 = "Parar pra refletir sobre coisas que antes a gente aceitava sem questionar:#n'por que isso era considerado normal?', e mudar isso pra que amanhã não seja mais assim."
211150-105 = "Em tudo o que moldava a Gehenna de antigamente, não tinha uma única escolha que fosse genuinamente 'nossa'."
211150-106 = "Mas hoje, as nossas próprias escolhas estão redesenhando Gehenna aos pouquinhos.#nVocê não acha isso a coisa mais linda e grandiosa do mundo?"
211150-107 = "Por isso eu tenho que dar cada gota de suor pelo comitê!"
211150-108 = "Ainda mais tendo você ao meu lado como hoje... Sinto que a gente pode vencer qualquer desafio! Com certeza absoluta!!"
211150-109 = "[s] \"Vamos continuar marchando juntos daqui em diante.\""
211150-110 = "Siiim! Conto com você sempre, meu querido Sensei!"
211150-111 = "VAMOS TORNAR GEHENNA GRANDE DE NOVO!!"
211150-113 = "(Mayumi irradia luz e dedicação sem limites a cada instante)"
211150-114 = "(Desejei do fundo da alma que o sorriso puro dela continuasse brilhando para sempre)"
211150-115 = ""
211150-120 = ""
211150-121 = "Kishishi! [ruby=Igarashi]Shoko Igarashi[/ruby], a que devo a honra da sua humilde visita hoje?"
211150-122 = "A manutenção do estúdio de radiodifusão foi concluída a contento?"
211150-123 = ""
211150-125 = ""
211150-127 = "Os trabalhos encontram-se integralmente finalizados. E trago um relatório que decerto alegrará a Presidente Makoto."
211150-128 = "Ora? Prossiga."
211150-129 = "Além da revisão exaustiva de todo o circuito de transmissão, instalamos aparelhagem acústica de última geração por todo o campus,#nextinguindo qualquer ponto cego onde a voz de Vossa Magnificência pudesse deixar de ecoar."
211150-130 = "Kishishi! Magnífico! Um trabalho primoroso!"
211150-131 = "Expandir a infraestrutura imperial sem desembolsar um único centavo da verba da Pandemônio...#nIsso sim é o que chamo de colher lucros com esforço alheio!"
211150-133 = "Falar isso descaradamente na cara da responsável é de uma indelicadeza sem tamanho, mas enfim..."
211150-135 = "Essa frieza pragmática constitui, precisamente, o calibre de quem governa do topo de Gehenna."
211150-136 = "Vejo que você compreende perfeitamente a minha estatura!#nIroha, você deveria seguir o exemplo dessa jovem com mais frequência!"
211150-138 = "Sim, sim, claro..."
211150-140 = "Presidente Makoto, trago-lhe uma sugestão de altíssimo valor promocional."
211150-141 = "A reabertura das transmissões escolares ocorrerá em breve.#nPermitir que esse marco histórico transcorra como uma transmissão trivial não seria um desperdício lamentável?"
211150-142 = ""
211150-144 = ""
211150-145 = "Parece que sua mente arquiteta algo grandioso. Diga logo."
211150-146 = "Que tal realizar um pronunciamento relâmpago ao vivo para todo o corpo discente, conduzido pessoalmente pela Presidente Makoto?"
211150-147 = "Como clarinada anunciando a alvorada de uma Nova Gehenna, jamais haverá conjuntura mais triunfal."
211150-148 = ""
211150-150 = ""
211150-151 = ""
211150-152 = "Kikikiki! O palco perfeito talhado e consagrado exclusivamente para mim!!"
211150-154 = "Eu, Hanuma Makoto-sama, farei um discurso retumbante e histórico que estremecerá os alicerces de Gehenna!"
211150-156 = "Pronto, acendeu a fagulha no pavio dela."
211150-157 = "A matéria de capa da próxima edição do jornal tá mais do que garantida! Vou fotografar cada suspiro dela～!"
211150-159 = "O discurso da Makoto-senpai! A Ibuki quer muito ouvir!"
211150-160 = ""
211150-162 = ""
211150-164 = ""
211150-165 = ""
211150-166 = "――Tornar Gehenna grande de novo."
211150-170 = "A Seguir;O Inevitável"