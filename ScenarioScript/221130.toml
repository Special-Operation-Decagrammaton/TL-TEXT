[translation]
221130-1 = "Episódio 13;A Última Viagem"
221130-10 = "Muito bom dia a todos os internautas do Canal Kronos!#nAqui fala a repórter [ruby=Kazamaki]Mai[/ruby], em transmissão especial ao vivo!"
221130-11 = "O sol ainda nem despontou no horizonte, mas já estamos a postos no Porto de Aohama,#nonde a imensa frota da Odisseia encontra-se ancorada!"
221130-12 = "Conforme apuração exclusiva obtida por este canal investigativo,#no conselho estudantil Island iniciou preparativos emergenciais para zarpar em missão solo!"
221130-13 = "E como prova irrefutável, a imponente nau capitânia Olympos já recolheu as passarelas de acesso e [ruby=içou a âncora]içou ferro[/ruby]!"
221130-14 = "Após concluir sua expedição regular, é inédito na história da Odisseia um navio retomar os mares em menos de um mês de descanso!"
221130-15 = "Nas redes sociais, pipocam teorias conspiratórias dos mais diversos calibres sobre a razão dessa partida misteriosa!"
221130-16 = "Teria alguma relação com a visita extraordinária do Sensei da Schale e da Presidente do Conselho Estudantil Federal dias atrás?!"
221130-17 = "Nenhum boletim oficial foi emitido até agora, mas assim que tivermos novas informações――"
221130-18 = ""
221130-21 = "Senpai, notícia urgente na tela!"
221130-22 = ""
221130-24 = ""
221130-25 = "Opa! Acabamos de receber um boletim de última hora!"
221130-26 = "O comando do Olympos acaba de notificar a Autoridade Portuária sobre a justificativa formal da manobra."
221130-27 = "O propósito declarado da expedição é... 'Despedir-se de um velho amigo'――"
221130-28 = ""
221130-30 = ""
221130-31 = "Hã...? Despedir-se de um amigo, como assim?"
221130-32 = "Por acaso tem alguma aluna partindo para os confins do oceano...?"
221130-34 = "Olympos, nau capitânia do Island - Ponte de Comando Principal"
221130-36 = ""
221130-37 = "Cinco minutos para a desatracação!"
221130-38 = ""
221130-40 = ""
221130-42 = ""
221130-43 = "Entrando em procedimentos de partida.#nTransfiram o comando dos alto-falantes do portaló para a ponte."
221130-44 = ""
221130-48 = ""
221130-49 = "Passarelas de embarque totalmente recolhidas!"
221130-50 = "Muito bem. Tripulação, recolher cabos de amarração."
221130-51 = "Recolher cabos de amarração agora!"
221130-52 = ""
221130-56 = "À frente a toda força! Zarpar!"
