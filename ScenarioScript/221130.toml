221130-71 = "......Myaau."
221130-72 = ""
221130-74 = ""
221130-75 = "Consegue enxergar, Sammy?"
221130-76 = "É o mar aberto. O mar bravio de Kivotos que você contemplou durante toda a sua vida."
221130-77 = "Hoje não temos as outras embarcações nos acompanhando, o cenário tá meio solitário, mas..."
221130-78 = "É o melhor presente que eu poderia te oferecer."
221130-79 = ""
221130-83 = "............Myaawn."
221130-84 = "O que foi, garoto? Quer que eu abra as escotilhas laterais?"
221130-85 = "Mas daquele lado não tem nada além d――"
221130-86 = ""
221130-88 = ""
221130-89 = "Ué?! Aquele navio ali é......"
221130-90 = ""
221130-92 = ""
221130-93 = ""
221130-94 = "Capitã! Solicitação de rádio urgente vinda do Golden Elysium, do Clube de Cruzeiros!"
221130-95 = ""
221130-97 = ""
221130-98 = "Abra o canal!"
221130-99 = ""
221130-103 = "......Transmissão autorizada. Conectando ao canal de emergência 6."
221130-104 = ""
221130-106 = ""
221130-108 = ""
221130-109 = "Aqui é a capitânia Golden Elysium!#nPresidente do Clube de Cruzeiros, [ruby=Sengoku]Mitsuki[/ruby] Sengoku, na escuta!"
221130-110 = "Ouvimos seu pronunciamento, Capitã.#nEntão a intenção é oferecer uma despedida digna ao nosso querido Sammy?"
221130-111 = "Pois saiba que nós faremos questão de navegar lado a lado com vocês!"
221130-112 = "Sem o resplendor dourado deste cruzeiro reluzindo ao lado, o Sammy se sentiria abandonado, não acha?"
221130-113 = "Sendo assim... sei que é um pedido tardio, mas solicito autorização de navegação para a flotilha do Clube de Cruzeiros!"
221130-114 = "Mas Mitsuki... o Golden Elysium estava atracado em D.U. operando pacotes turísticos com hóspedes a bordo!"
221130-115 = "Zarpar assim sem confirmar o cronograma com os clientes não causará problemas?"
221130-116 = "É só um breve passeio panorâmico!#nAlém disso, nossos convidados adoram uma boa surpresa marítima não programada!"
221130-117 = "Aposto a verba inteira do meu clube deste mês em como não receberemos uma única reclamação sequer no livro de bordo!"
221130-118 = ""
221130-120 = ""
221130-121 = ""
221130-122 = "......Autorização concedida."
221130-124 = "Capitã, nova chamada no rádio! Desta vez vinda da capitânia Rhodes!"
221130-125 = "......Conectando ao canal 8 do Trident."
221130-126 = ""
221130-128 = ""
221130-130 = ""
221130-131 = "Aqui é a sentinela Rhodes na escuta!#nOperadora de comunicações do Trident, aspirante [ruby=Komori]Sumika[/ruby]!"
221130-132 = "Perdoem a invasão de frequência, mas o Trident tinha uma mensagem inegociável para transmitir à Capitã...!"
221130-133 = "Que tremenda falta de consideração, Capitã! Querer se despedir do Sammy e deixar o Trident chupando o dedo no porto!"
221130-134 = "Nós também somos filhas da Odisseia! Se os uniformes pretos e brancos não estiverem juntos no mar, o Sammy vai sentir nossa falta!"
221130-135 = "A segurança da flotilha durante esta última viagem é nossa responsabilidade de honra!"
221130-136 = "E-Ei, meninas, calma aí, parem de empurrar o microfone!#nA sentinela de serviço hoje sou eu, sabiam?!"
221130-137 = "E-Enfim... Capitã, solicitamos autorização formal de zarpar para as corvetas de patrulha do Trident!"
221130-138 = ""
221130-140 = ""
221130-141 = "Sim... vamos todos juntos."
221130-142 = "......Capitã, despachos de desatracação de dezenas de outros clubes continuam chegando aos montes na central."
221130-143 = "Agora sim... poderemos proporcionar ao Sammy a [ruby=o mar aberto]paisagem cotidiana[/ruby] que ele sempre contemplou."
221130-144 = "Sim... que bom."
221130-145 = ""
221130-147 = ""
221130-148 = "Dá uma olhada, Sammy...#nOlha aí todo mundo que você ama――e todo mundo que ama você de verdade."
221130-149 = ""
221130-150 = "......Myaau."
221130-151 = "O seu assento de honra favorito fica lá fora, não é? Venha, vamos até lá."
221130-155 = ""
221130-158 = "......É a brisa do oceano."
221130-159 = "Sempre que o sol nascia e o dia esquentava, você se deitava exatamente aqui para sentir o vento e velar por toda a academia."
221130-162 = "E então, Sammy? O que achou da nossa Odisseia hoje?"
221130-163 = "............"
221130-164 = ""
221130-167 = "（Refletida em suas pupilas cansadas, estava a silhueta de todas as suas queridas companheiras de bordo）"
221130-168 = "（Em seu cantinho de costume, admirando o mar que conhecia de cor e salteado, cercado pelo calor de suas amigas――）"
221130-169 = ""
221130-176 = "（――Com uma expressão de pura serenidade e plenitude, o velho gato fechou seus olhos suavemente pela última vez）"
221130-181 = "（......E assim, a derradeira viagem de Sammy chegou ao seu porto final.）"
221130-183 = "Próximo Episódio;O Peso de um Lugar Vazio"
