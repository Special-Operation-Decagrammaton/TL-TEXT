[translation]
10009080-1 = "Послесловие;Счастливого Валентина...?"
10009080-2 = ""
10009080-3 = "Здравствуйте! Я представляю Рыцарей Спасения. В честь Дня святого Валентина мы раздаём особый шоколад, так что угощайтесь!"
10009080-4 = "Ну, вообще-то это просто обычный шоколад, но... Пожалуйста, попробуйте! С Днём святого Валентина!"
10009080-5 = "Ах... Мне впервые кто-то подарил шоколад на День святого Валентина..."
10009080-6 = "Спасибо, Рыцари Спасения. Вы всегда так усердно трудитесь."
10009080-8 = "В этом году мы начали новую традицию. В конце концов, приносить счастье одиноким — тоже своего рода исцеление, не так ли?"
10009080-9 = "И с каждой улыбкой, которой с нами делятся, я сама становлюсь всё счастливее."
10009080-10 = ""
10009080-12 = ""
10009080-13 = "Ха-ха... Вообще-то это была идея Ханаэ. Я просто рада, что она до этого додумалась!"
10009080-14 = "Ой, ну что вы! Я просто очень хотела придумать, как сегодня помочь людям!"
10009080-15 = "Это важное напоминание о том, что нужно учитывать все стороны помощи, чтобы охватить как можно больше людей."
10009080-16 = "Сэрина, Ханаэ... Спасибо вам обеим. Без вас я никогда бы не испытала этот момент истинного исцеления."
10009080-17 = "К-конечно! Да ничего особенного. Мы всё равно собирались заниматься волонтёрством, так почему бы не постараться подарить людям немного радости?"
10009080-18 = "А шоколад вкусный в любое время года!"
10009080-20 = "О, спасибо... Я буду по-настоящему дорожить им. Буду есть медленно, по одному кусочку, чтобы помнить этот момент долгие годы... Или, погодите. Может, лучше сохранить его как семейную реликвию..."
10009080-21 = "Мне никогда не отплатить вам, но... у меня есть немного свободного времени! Я займусь волонтёрством в вашу честь!"
10009080-23 = "Эм, да ничего особенного! В-вы правда не обязаны нам отплачивать, но это очень добрая мысль!"
10009080-24 = "Спасибо. Пусть дух исцеления всегда будет с вами."
10009080-25 = "Что же делать? Что же делать? Когда я вижу всех такими..."
10009080-26 = ""
10009080-28 = ""
10009080-29 = "Я так счастлива, что сердце сейчас взорвётся!"
10009080-30 = ""
10009080-35 = "А-а-а! Взрыв?!"
10009080-36 = "О нет! Это всё моя вина! Потому что я сказала, что сердце взорвётся!"
10009080-37 = "Не думаю, что это связано."
10009080-39 = "Срочные новости! Несколько мгновений назад взорвался автомобиль, перевозивший преступницу в Исправительное бюро!"
10009080-40 = "Похоже, местные банды воспользовались возможностью и начали устраивать беспорядки!"
10009080-42 = "Не знаю, что происходит, но выглядит весело."
10009080-43 = "Ага, ага! И псов Валькирии это точно займёт!"
10009080-44 = "Хе-хе-хе. Сегодня же праздник, верно? Тогда давайте веселиться!"
10009080-45 = "Зовите всех и передайте, что пора развлечься."
10009080-46 = ""
10009080-49 = ""
10009080-50 = "Ч-что происходит?"
10009080-51 = "Ах... Раненые, стонущие от боли... Бандиты со всех сторон... Минуту назад я была в раю, а теперь..."
10009080-52 = "Это... это ад?!"
10009080-53 = "П-помогите! Кто-нибудь, помогите!"
10009080-54 = ""
10009080-55 = "О-о нет! Похоже, всё очень серьёзно!"
10009080-56 = "Что делать? Что делать?"
10009080-57 = "Не забывай о нашей цели, Ханаэ! Сначала проверь гражданских и помоги им добраться в безопасное место!"
10009080-58 = "Совершенно верно, Сэрина."
10009080-59 = "К-капитан?"
10009080-60 = "Наша цель — помогать. Помогать — значит улучшать жизнь людей повсюду."
10009080-61 = "А значит, если кто-то сбился с праведного пути... разве вернуть его на этот путь любыми необходимыми средствами — тоже не форма помощи?"
10009080-62 = "Я уверена, что так и есть! Я окажу помощь этим бандитам!"
10009080-63 = "Капитан?!"
10009080-64 = "Вот моё предназначение! Пусть каждый, кому нужно исцеление, получит его!"
10009080-65 = ""
