[translation]
1300706-1 = "Тренировка желудка"
1300706-2 = "Класс академии Геенна"
1300706-3 = ""
1300706-4 = ""
1300706-5 = ""
1300706-6 = "Всё ещё недостаточно..."
1300706-7 = "Нужно стараться сильнее...!"
1300706-8 = "[s] «Что-то случилось за обедом?»"
1300706-9 = "О, Сенсей."
1300706-10 = "Нет. Дело не в том, что мне не понравилась еда. Торт был довольно вкусным, и видов было столько разных..."
1300706-11 = "Настоящая проблема в том... что я не смогла съесть даже близко столько же, сколько мои одноклубницы!"
1300706-12 = "Я наелась уже после третьей порции, а Акари умяла десятки тарелок с тортом!"
1300706-13 = "А если бы это был шведский стол с платным входом? Если я ем намного меньше остальных, значит, получаю меньше еды за свои деньги."
1300706-14 = "[s] «Меня больше беспокоит кошелёк владельца шведского стола...»"
1300706-15 = "Так нечестно! Я хочу есть столько же, сколько остальные!"
1300706-16 = "Что мне делать, Сенсей?"
1300706-17 = "[s] «Тогда придётся тренировать желудок!»"
1300706-18 = "Тренировать желудок? Хм... Вообще-то желудок по природе может растягиваться, чтобы вместить больше еды..."
1300706-19 = "Значит, теоретически, если постоянно переедать, можно натренировать его как мышцу и есть сколько захочется!"
1300706-20 = "Но какая еда лучше всего подойдёт для такой тренировки?"
1300706-21 = "Хм... Знаю! Сушёная ламинария!"
1300706-22 = "Её можно есть бесконечно, и она низкокалорийная, так что за вес можно не переживать!"
1300706-23 = "Начнём с небольшого пробного захода..."
1300706-25 = "Угх..."
1300706-26 = "Я никогда не была настолько набита водорослями. Меня сейчас стошнит. Кажется, желудок вот-вот лопнет."
1300706-27 = "Я не могу, Сенсей..."
1300706-28 = ""
1300706-30 = "Бле-е-е!"
1300706-32 = "После этого я гладил Джунко по спине, пока её не перестало тошнить съеденной ламинарией."
