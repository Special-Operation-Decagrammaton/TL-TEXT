[translation]
22155-12 = "Tem um poder de fogo inimaginável para aquela aparência..."
22155-13 = "Ele é super brega por fora, mas é forte pra caramba?! O que a gente faz?!"
22155-18 = "[ns1] \"Achei que o maior obstáculo seria a Toki, por isso pedi ajuda à C&C...\"\n[ns2] \"Nunca imaginei que haveria uma emboscada escondida bem aqui...\""
22155-19 = "Trazer a Toki logo no começo foi só para confundir nosso julgamento..."
22155-20 = "Trazer a Toki logo no começo foi só para confundir nosso julgamento..."
22155-21 = "Agora que a C&C não está aqui..."
22155-23 = "É a chance da Presidente... de neutralizar o \"Sensei\"..."
22155-28 = "Hein... Então quer dizer que o tempo todo a gente estava na palma da mão da Presidente?!"
22155-29 = "Era uma armadilha planejada desde o começo..."
22155-33 = "Separar a C&C do Sensei —"
22155-34 = "E não pelas minhas mãos, mas pela sua própria decisão."
22155-35 = "Assim, não há nem uma chance em dez mil de o nosso plano vazar."
22155-36 = "Entendo... Pelo visto, a Presidente estava um passo à frente."
22155-37 = "Pois bem, vamos acabar com isso — Avant-Garde."
22155-51 = "Próximo;Xeque-Mate"
