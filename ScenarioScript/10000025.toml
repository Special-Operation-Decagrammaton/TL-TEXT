[translation]
10000025-1 = "Эпизод 2;Нарушители порядка Хяккияко!"
10000025-3 = "Агх?!"
10000025-4 = "[s] «Изуна? Что ты здесь делаешь?»"
10000025-5 = "А?! Сенсей?!"
10000025-6 = "Э-это Изуна должна спросить! Почему ты с врагами?!"
10000025-7 = "*ахает* Сенсей! Ты пытался обмануть Изуну?"
10000025-8 = "У-у тебя были скрытые намерения?!"
10000025-9 = "Ты сказал, что поддерживаешь мечту Изуны, а сам оказался плохим влиянием!"
10000025-10 = "[s1] «Помедленнее. Я не совсем понимаю...»\n[s2] «ВОТ ЭТО и есть твоя мечта?»"
10000025-11 = "Изуна — начинающая ниндзя, а это её задание! Нин-нин!"
10000025-12 = "Изуна — начинающая ниндзя, а это её задание! Нин-нин!"
10000025-14 = "[s] «Задание...?»"
10000025-18 = "Ну как вам такое?! Никогда не недооценивайте отдел организации фестивалей!"
10000025-19 = "Это был последний!"
10000025-20 = "Тц! Почему они такие сильные? По виду и не скажешь!"
10000025-21 = "Их жалкий фестивальный клуб совсем другой, когда тот взрослый отдаёт приказы!"
10000025-22 = "Эй, Изуна! Нужно тактически отступать, и побыстрее!"
10000025-23 = "А? М-мы отступаем...?"
10000025-24 = "Я читала, что великая ниндзя знает: иногда отступление — лучшая часть доблести!#nНу, что-то вроде того!"
10000025-25 = "Правда? Тогда больше ни слова! Нин-нин!"
10000025-26 = "Раньше Сенсей поддерживал мечту Изуны, а теперь мы по разные стороны..."
10000025-27 = "Судьба жестока!"
10000025-28 = "Но Изуна знает, что предательство — обычная часть жизни ниндзя!"
10000025-29 = "Прямо как в сериалах!"
10000025-30 = "[s] «Сериалах?»"
10000025-31 = "Ниндзя обречены быть втянутыми в конфликты!"
10000025-32 = "Вот увидишь, Сенсей! Изуна никогда не сдастся!"
10000025-33 = "При следующей встрече Изуна будет втрое сильнее! Нин-нин!"
10000025-34 = ""
10000025-35 = "Изуна снова исчезла в мгновение ока."
10000025-37 = "Ты можешь в это поверить?! Опять... Опять!"
10000025-38 = "Моурё появились и устроили сцену как раз тогда, когда фестиваль начал набирать обороты!"
10000025-39 = "[s] «Кто они вообще такие?»"
10000025-40 = "Они называют себя Уличными Моурё."
10000025-41 = "Это хулиганы, которые уже давно терроризируют Хяккияко!"
10000025-42 = "Это правда. Они и раньше доставляли проблемы, но раньше не были настолько организованными."
10000025-43 = "Будто они намеренно хотят полностью сорвать Фестиваль цветения сакуры."
10000025-44 = "Вот гады! Я не могу просто стоять и смотреть — моё гангстерское чувство справедливости не позволит!"
10000025-45 = "Я просто не понимаю!"
10000025-46 = "Раньше у нас не было проблем с ними справляться!"
10000025-47 = "Но если так продолжится, они и правда испортят фестиваль..."
10000025-48 = "Если фестиваль придётся отменить, нам конец... Что же делать?!"
10000025-49 = "..."
10000025-50 = "Эм, я имею в виду..."
10000025-51 = "Ой-ой! Что же нам теперь делать? ☆"
10000025-52 = "[s] «Точно...»"
10000025-53 = "Я не понимаю. Почему они хотят сорвать фестиваль?"
10000025-54 = "Наверное, они его не одобряют."
10000025-55 = "О! Вы президент гильдии торговцев!"
10000025-56 = "[s] Посмотри в его сторону."
10000025-57 = "Хмф. Приятно с вами мяу-знакомиться. Я президент гильдии торговцев торгового квартала Хяккияко."
10000025-58 = "Эм... Но почему они могут быть против фестиваля?"
10000025-59 = "По традиции каждый Фестиваль цветения сакуры Хяккияко завершался фейерверком."
10000025-60 = "Но в этот раз всё иначе, верно? Кажется, вы подготовили для праздника что-то новое."
10000025-61 = "Верно. Специально для этого фестиваля мы придумали кое-что новое."
10000025-62 = ""
10000025-63 = ""
10000025-65 = "На столе стоит металлический ящик с механическим видом."
10000025-68 = "Вон там — специальное оборудование, которое мы одолжили у Научной школы Миллениум для грандиозного финала Фестиваля цветения сакуры."
10000025-69 = "О, это! Говорят, устройство умеет создавать голограммы фейерверков!#nОчень особенное! Очень круто!"
10000025-70 = "Наверняка получить его в такие короткие сроки стоило целое состояние...#nМожет, это классический случай тех, кто сопротивляется переменам... агрессивно?"
10000025-71 = "Такое иногда бывает... но неужели они правда станут портить фестиваль только из-за этого?"
10000025-72 = "Просто... Я готовила голографическое шоу, думая, что оно всем понравится."
10000025-73 = "Это была лишь догадка. Я предпочитаю не слишком жить прошлым, но некоторым людям тяжело так просто отпустить традиции."
10000025-74 = "Конечно, но фестиваль всегда менялся! Как иначе ему становиться лучше?"
10000025-75 = "Я президент отдела организации фестивалей. Никто не знает этого лучше меня."
10000025-76 = "Полностью согласна! Каждый фестиваль должен быть лучше предыдущего!"
10000025-77 = "Хм. Вот как? Стремиться к этому похвально, полагаю."
10000025-78 = "Не пытайся отрицать, как сильно тебе не всё равно и как ты любишь за нами присматривать.#nТы ведь тоже переживаешь за фестиваль."
10000025-79 = "Именно! Не нужно стесняться!"
10000025-80 = "Х-хватит нести чепуху...! В любом случае, у вас есть какой-нибудь план, как с этим справиться?"
10000025-81 = "Фестиваль и правда будет сорван, если вы не найдёте способ их остановить."
10000025-82 = "[s] «Есть кто-нибудь, кого можно попросить о помощи?»"
10000025-83 = "Если совсем прижмёт, всегда можно обратиться к другим клубам..."
10000025-84 = "Просто я не уверена, что от них будет хоть какая-то польза."
10000025-85 = "[s] «Серьёзно?»"
10000025-86 = "Ну, если ты настаиваешь..."
10000025-87 = "Ладно. Есть кое-кто на примете..."
10000025-88 = "...но сначала мне понадобится твоя помощь, чтобы их убедить!"
10000025-90 = "Полуразрушенное здание"
10000025-92 = "Значит, вы, Моурё, не справились с заданием? Как так?"
10000025-93 = "В нашем договоре сказано, что вы должны помешать проведению фестиваля и добиться его отмены уже сегодня, разве нет?"
10000025-94 = "Не знала, что трачу столько денег на сборище некомпетентных дур."
10000025-95 = "Н-ну... возникли некоторые неожиданные проблемы."
10000025-96 = "Тот знаменитый Сенсей из Шале появился и вмешался!#nОн оказался очень сильным!"
10000025-97 = "Шале? Сенсей?"
10000025-98 = "Именно! Всё изменилось из-за Сенсея!"
10000025-99 = "Даже ты говоришь то же самое, Изуна? Кто этот человек, о котором вы все говорите?"
10000025-100 = "Всё именно так, как вы сказали."
10000025-101 = "Если Изуна выполнит задание, то однажды станет великой ниндзя!"
10000025-102 = "А потом вы сказали, что Изуна встретит своего единственного господина, предназначенного судьбой!"
10000025-103 = "Да, кажется, я говорила нечто подобное..."
10000025-104 = "И сегодня Изуна встретила его! Сенсей сказал, что будет поддерживать мечту Изуны!"
10000025-105 = "Вот как. Как... интересно. И...?"
10000025-106 = "Почему-то Сенсей был с врагами. Но Изуна не понимает почему!"
10000025-107 = "Неужели...? Нет, невозможно!"
10000025-108 = "Теперь Изуна всё поняла!"
10000025-109 = "Наверняка Сенсеем манипулируют!"
10000025-110 = "Полагаю, это один из вариантов. В любом случае, этого «Сенсея» нельзя недооценивать."
10000025-111 = "На этот раз я закрою глаза на ваши проступки, но надеюсь, вы докажете, что достойны моих вложений."
10000025-112 = "В следующий раз мы точно остановим фестиваль. Не беспокойтесь, босс!"
10000025-113 = "Именно! Изуна победит Сенсея и откроет ему глаза на правду!"
10000025-114 = "Понятно..."
10000025-115 = "Сенсей всё поймёт, как только Изуна победит!"
10000025-116 = "Хм. Хорошо. Надеюсь, ты сдержишь свои слова."
10000025-118 = "Положитесь на Изуну! Нин-нин!"
10000025-119 = ""
10000025-121 = "Надеюсь, мне не придётся об этом пожалеть..."
