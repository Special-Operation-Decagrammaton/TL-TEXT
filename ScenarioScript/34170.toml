[translation]
34170-1 = "Episódio 17;Confronto"
34170-2 = "[ns] \"Mika!! Pare!!\""
34170-4 = "...Desculpa, Sensei.#nEu não posso fazer isso."
34170-5 = "Ei, Saori.#nVocê não está sem tempo? Não precisa se apressar?"
34170-6 = "..."
34170-7 = "Falta uma hora... até o nascer do sol."
34170-8 = "Ah, poxa... Depois de todo o trabalho que tive para separar vocês... Se o Sensei vier para cá,#nnão vai ter mais nada que eu possa fazer."
34170-9 = "Mas quanto tempo será que isso vai levar?"
34170-10 = "— Se você conseguir aguentar até lá, a vitória é sua, Saori."
34170-11 = "..."
34170-12 = "...Que cara é essa?#nAconteceu alguma coisa divertida? Ou será que você já desistiu?"
34170-13 = "...Não, só lembrei de coisas do passado."
34170-17 = "..."
34170-22 = "Não venha!! Sensei!!"
34170-23 = "...!!"
34170-25 = "..."
34170-26 = "!?"
34170-28 = "Não temos tempo... Continue em frente e vá até onde a Atsuko está!"
34170-29 = "...Por favor, cuide da Princesa."
34170-30 = "L-Líder...!"
34170-31 = "[s] \".........!!\""
34170-32 = "...A Líder tem razão."
34170-33 = "Não temos tempo para procurar um caminho que nem sabemos se existe."
34170-34 = "Além disso, mesmo se encontrarmos um caminho — será tarde demais."
34170-35 = "..."
34170-36 = "No estado em que a Líder está agora, ela não tem chance contra a Mika.#nÉ até duvidoso que ela consiga aguentar até chegarmos lá."
34170-37 = "M-Mas..."
34170-38 = "Por isso... o certo é seguirmos em frente para salvar a Princesa.#nLembrem-se do motivo de estarmos aqui."
34170-39 = "[s] \".........\""
34170-40 = "Deixo a decisão final nas suas mãos, Sensei..."
34170-41 = "Além do mais, a Mika parece ter plena consciência do que está fazendo, mas..."
34170-42 = "Você acha que consegue convencer aquela mulher nesse estado, Sensei?"
34170-43 = "[s] \".........Eu vou.\""
34170-46 = "[ns1] Cumprir o objetivo.\n[ns2] Me apressar."
34170-55 = "..."
34170-56 = "Ah... No fim das contas, o Sensei foi embora mesmo."
34170-57 = "Que bom pra você, Saori.#nCom certeza a sua princesinha vai ser salva."
34170-58 = "Mika... Era isso que você realmente desejava?"
34170-59 = "O que eu desejava...?"
34170-60 = "O que será que eu desejava mesmo...?#nAh, é... isso mesmo. Cumprir o meu objetivo, tipo isso?"
34170-61 = "..."
34170-62 = "...Mas não é como se eu estivesse mirando especificamente em você."
34170-63 = "Para falar a verdade, qualquer uma do seu grupo servia."
34170-67 = "Na verdade... eu até cheguei a pensar que seria bom se o Sensei ficasse aqui comigo..."
34170-68 = "...Bem, acho que isso já seria pedir demais, né?"
34170-69 = "..."
34170-70 = "Ué... Dá para não me olhar com essa cara?"
34170-71 = "A Seia-chan vive me dizendo que sou \"impulsiva e não penso em nada\".#nEu mesma tenho consciência disso, mas... não é meio maldade dizer isso na cara da pessoa?"
34170-75 = "...É.#nPensando bem, acho que o que eu mais desejava era isso aqui mesmo."
34170-76 = "— Que você, a pessoa que eu mais odeio, estivesse assim diante de mim."
34170-77 = "..."
34170-78 = "Além disso, para o Sensei... o certo é ir salvar uma aluna.#nNo fim, superar todas as dificuldades para que todo mundo seja feliz — caminhar rumo a esse final feliz."
34170-79 = "Enquanto nós, que acumulamos tantas maldades — encontramos o nosso desfecho aqui."
34170-80 = "..."
34170-81 = "Então — que tal irmos logo de encontro ao nosso desfecho, Saori?"
34170-82 = "Em vez de ficar calada, por que não diz alguma coisa?#nEsta é a cena em que a \"bruxa\" executa o \"cão de caça\", sabia? Não tem nenhuma última palavra para deixar?"
34170-83 = "Não vai dar nenhuma desculpa, tipo \"não posso aceitar isso\" ou \"a sua desgraça é culpa sua\",#nnem nada do tipo?"
34170-84 = "...Não, eu aceito."
34170-94 = "Uma granada!?#nNão... cortina de fumaça...? O que é isso?"
34170-99 = "A-Ai, ai, ai..."
34170-100 = "É uma arma cuja produção hoje é proibida.#nHavia muitas delas descartadas no campo de treinamento de Arius."
34170-101 = "Ah, é mesmo?☆#nNão que eu me importe com isso."
34170-108 = "Guh...!?"
34170-109 = "— Já entendi com o que preciso tomar cuidado ao enfrentar você."
34170-115 = "...Ugh."
34170-116 = "Mika... Eu não nego o seu ódio."
34170-117 = "O fato de nenhum futuro feliz chegar para você, de terem tirado tudo de você, e até de você ter ficado sozinha... a causa de tudo isso sou eu."
34170-118 = "Sendo assim, eu responderei a esse ódio."
34170-126 = "...Interessante, viu."
34170-127 = "Vai apelar para tática de guerrilha?#nBom, levando em conta este terreno, essa deve ser a melhor opção mesmo."
34170-128 = "E além disso... isso aí é uma granada termobárica, né? Ahaha☆#nTrouxe bastante com você? Não pense que vai dar conta de mim com meia dúzia delas, tá?"
34170-129 = "...Com isso, sim."
34170-130 = "Agora vou te enfrentar a sério... então vê se resiste com todas as suas forças, tá?#n— Embora, para você, tudo não passe de vaidade."
34170-131 = "Entendo — então vou me debater até o último instante."
34170-132 = "Huum... Vê se não me deixa entediada, viu?"
34170-149 = "Que espetáculo fascinante. Aprofundarem o inferno uma da outra dessa maneira...#nMika, você é mesmo a minha musa."
34170-150 = "O contato com o outro é o inferno... Ao se odiarem mutuamente, não estão fazendo nada menos que provar a própria existência."
34170-151 = "Comparado a um paraíso que não pode ser provado, isto é infinitamente mais claro.#n— Não concorda, Seia?"
34170-152 = "..."
34170-153 = "Parece que ainda não desistiu."
34170-154 = "...Deseja voltar para Trinity?#nContudo, escapar das frestas do sonho não será nada fácil."
34170-155 = "Afinal, você foi envolvida no \"ritual\".#nÉ o mesmo que ter colocado o rosto para fora de uma janela que dá para o exterior de Kivotos."
34170-156 = "Sim... A sua existência certamente se destacou como uma chama bruxuleante na escuridão."
34170-157 = "...Diante \"daquilo\", é claro."
34170-158 = "Exposto \"àquilo\", o seu Místico foi invertido em Terror — e o princípio do reverso começou a dominá-la."
34170-159 = "É intrigante... O que será que vai acontecer com você daqui em diante?#nNem mesmo nós sabemos de nada."
34170-160 = "Pois, a respeito \"daquilo\", somos completamente ignorantes."
34170-161 = "Uma luz sinistra que não pode ser interpretada, nem compreendida, nem comunicada — que apenas advém.#nUm conceito indecifrável, sem propósito ou possibilidade de diálogo..."
34170-162 = "O maior inimigo mortal de nós, da Gematria..."
34170-164 = "Nós o chamamos de \"Croma\"."
34170-167 = "...Hum. Aquilo também está prestes a ser concluído."
34170-168 = "Sim, você percebeu?#nExato — aquele é o meu trunfo, preparado para enfrentar a \"Schale\"."
34170-173 = "A mais grandiosa santa do Conselho das Santas — Barbara."
34170-174 = "Quando ela for concluída conforme o planejado... deverá ser ainda mais poderosa do que aquela série de anjos artificiais... Fufu."
34170-175 = "Como diz o Maestro, talvez não haja estética neste método, mas..."
34170-176 = "Uma \"arma\" possui a sua própria beleza funcional."
34170-177 = "Que cara será que o Maestro fará quando vir isso...? Ah, embora ele provavelmente não consiga fazer expressão alguma."
34170-178 = "Será que a Schale e o Esquadrão conseguirão superar a \"arma\" e chegar até mim?"
34170-182 = "Fufu — tudo não passa de um destino inevitável, Seia."
34170-183 = "Vamos assistir juntas ao desfecho desta prova de existência do inferno."
34170-188 = "Haa... haa..."
34170-189 = "Eu... não posso desistir, Beatrice.#nEm algum lugar... em algum lugar... deve haver uma maneira de romper esta situação..."
34170-190 = "Preciso encontrar... o quanto antes, uma forma de escapar daqui..."
34170-191 = "Não posso continuar presa neste devaneio para sempre..."
34170-192 = "Ah... Porque ainda me resta... algo que preciso cumprir..."
34170-194 = "Próximo;Um Outro Nós"
