[translation]
34170-1 = "Эпизод 17;Состязание"
34170-2 = "[ns] «Мика! Прекрати!»"
34170-4 = "...Прости, Сенсей. Я должна."
34170-5 = "Ты всё правильно поняла, Саори? У нас немного времени, так что давай быстрее."
34170-6 = "......"
34170-7 = "До рассвета остался час..."
34170-8 = "На твоём месте я бы больше думала о настоящем. Может, будешь в безопасности, когда сюда доберётся Сенсей..."
34170-9 = "Кто знает, сколько им понадобится, чтобы пробраться через обломки? Но я не совсем злодейка. Если продержишься до этого момента — победа твоя."
34170-10 = "Как будто это возможно."
34170-11 = "......"
34170-12 = "Мне не нравится это выражение. Почему ты выглядишь довольной? Совсем окончательно свихнулась?"
34170-13 = "...Просто вспоминала прошлое."
34170-14 = ""
34170-16 = ""
34170-17 = "......"
34170-18 = ""
34170-20 = ""
34170-22 = "Сенсей!! Не идите мне помогать!!"
34170-23 = "...!"
34170-25 = "......"
34170-26 = "...?!"
34170-27 = ""
34170-28 = "Со мной всё будет хорошо! Идите к Ацуко!"
34170-29 = "Времени не осталось. Пожалуйста! Спасите Химэ!"
34170-30 = "Л-Лидер...!"
34170-31 = "[s] «Саори...»"
34170-32 = "Она права. Идём."
34170-33 = "Мы даже не знаем, можно ли вообще добраться до лидера."
34170-34 = "А даже если встретимся с ней, уже будет слишком поздно."
34170-35 = "......"
34170-36 = "Лидер ранена. Она не продержится достаточно долго, чтобы мы её спасли."
34170-37 = "Н-Но..."
34170-38 = "Нужно выбрать. Спасти Химэ или спасти лидера."
34170-39 = "[s] «...»"
34170-40 = "Последнее решение оставляю вам, Сенсей."
34170-41 = "Мика настроена серьёзно... но жизнь Химэ висит на волоске."
34170-42 = "Что будете делать?"
34170-43 = "[s] «Я...»"
34170-44 = ""
34170-45 = ""
34170-46 = "[ns1] «Идём.»\n[ns2] Сделать то, что необходимо."
34170-55 = "......"
34170-56 = "Значит, в итоге Сенсей выбрал Ацуко."
34170-57 = "Разве ты не рада? Ведь именно этого хотела?"
34170-58 = "...А ты сама этого хотела, Мика?"
34170-59 = "Чего я хотела?"
34170-60 = "Что я вообще хотела? Ах... отделить отряд от Сенсея, но..."
34170-61 = "......"
34170-62 = "Если уточнить, я не целилась конкретно в тебя."
34170-63 = "Мне было бы всё равно, кто останется."
34170-64 = ""
34170-66 = ""
34170-67 = "Хотя было бы приятно, если бы со мной оказался Сенсей..."
34170-68 = "Наверное, это уже слишком многого хочу, да?"
34170-69 = "......"
34170-70 = "Не смотри на меня так. Я знаю, что иногда бываю дурочкой."
34170-71 = "Что там всегда говорила Сэя? А, точно! Что я импульсивная и безрассудная. Какая вредина!"
34170-72 = ""
34170-74 = ""
34170-75 = "Ладно, ладно. Может, я немного соврала."
34170-76 = "Я хотела, чтобы это была именно ты. Чтобы объект всей моей ненависти оказался у меня во власти."
34170-77 = "......"
34170-78 = "Сенсей обязан спасать студентов. Он пойдёт хоть на край света, чтобы обеспечить им счастливый конец."
34170-79 = "А злодейки? Злодейки, которые предавали, лгали и причиняли боль, ничего хорошего не получают."
34170-80 = "......"
34170-81 = "Ну что, Саори. Вот мы и у финала. Не хочешь ничего сказать?"
34170-82 = "Это кульминация! Сцена, где ведьма казнит гончую! Я понимаю, тебе это, наверное, не нравится, но неужели совсем нечего сказать?"
34170-83 = "Можешь умолять, если хочешь! Кричать и плакать, как всё несправедливо, как ты не понимаешь, почему я это делаю."
34170-84 = "...Я понимаю."
34170-85 = ""
34170-87 = ""
34170-88 = ""
34170-94 = "Что это было? Граната? Нет, дымовая бомба? Хм..."
34170-95 = ""
34170-99 = "Ай... Б-Больно..."
34170-100 = "Оружие, производство которого запретили. Я нашла его на полигоне Ариуса."
34170-101 = "Ой, как жаль. ★ Но мне вообще всё равно. Неважно, какое у тебя оружие."
34170-102 = ""
34170-104 = ""
34170-108 = "Ух...?!"
34170-109 = "...Это не первый наш бой. Я знаю, как с тобой обращаться."
34170-110 = ""
34170-112 = ""
34170-115 = "...Ух."
34170-116 = "Как я и сказала, я понимаю твою ненависть, Мика."
34170-117 = "Если бы не я, у тебя всё ещё было бы Чаепитие, друзья... будущее, которое тебе предназначалось."
34170-118 = "И я понимаю, что нести эту ненависть — моя ответственность."
34170-119 = ""
34170-121 = ""
34170-125 = ""
34170-126 = "...Как отвратительно забавно."
34170-127 = "Значит, выбрала партизанскую тактику? Учитывая местность, пожалуй, лучший вариант."
34170-128 = "И ты правда принесла термобарическую гранату на перестрелку? Надеюсь, не думала, что этого хватит, чтобы свалить МЕНЯ."
34170-129 = "Не могу сказать, что мне не нравится твоя смелость."
34170-130 = "Но это не значит, что я буду поддаваться. Старайся изо всех сил, но... как вы там всегда говорите? Всё тщетно."
34170-131 = "Я поняла: даже если всё тщетно, причина бороться всё равно есть."
34170-132 = "Уф... Какая упрямая."
34170-133 = ""
34170-134 = ""
34170-135 = ""
34170-149 = "Ах, Мика. Моя муза. Знает ли она свою роль? Как помогла выковать мой ад? А я — её?"
34170-150 = "Ненависть, текущая по нашим телам... подтверждает само наше существование."
34170-151 = "Её куда легче постичь, чем какой-то рай, в существовании которого мы не уверены. Согласна, Сэя?"
34170-152 = "......"
34170-153 = "Как мило. Ты всё ещё не сдалась."
34170-154 = "Трудно найти маленькие трещины в снах, через которые пытаешься выбраться, да?"
34170-155 = "Ты застряла в моей паутине без выхода. Страшно, Сэя? Боишься силы за пределами Кивотоса, от которой не можешь отвести взгляд?"
34170-156 = "Само твоё существование привлекло её, как мотылька к огню."
34170-157 = "...Эта штука."
34170-158 = "Ты сделала шаг слишком далеко к силам, которых не понимала. И теперь они подчинили тебя."
34170-159 = "Интересно... что с тобой будет. Даже я не знаю."
34170-160 = "Мы знаем об этом не больше тебя."
34170-161 = "Зловещий свет, который невозможно истолковать, понять или с которым нельзя общаться. Непостижимая идея, лишённая смысла в человеческих глазах."
34170-162 = "Величайшая угроза Гематрии..."
34170-164 = "Мы называем её Хромой."
34170-167 = "Наконец-то. Мы приближаемся к кульминации."
34170-168 = "Ты тоже это чувствуешь? Ах, это. Да. Мой козырь, который я тщательно готовила специально для Шале. Для вашего Сенсея."
34170-169 = ""
34170-171 = ""
34170-172 = ""
34170-173 = "Святая Совета, Барбара."
34170-174 = "Если завершить её как задумано... она станет ещё сильнее серии искусственных ангелов."
34170-175 = "Маэстро будет ныть о своём глупом искусстве, но..."
34170-176 = "...красота оружия заключается в его функции."
34170-177 = "Не могу дождаться реакции Маэстро... Надеюсь, его это взбесит."
34170-178 = "Сумеют ли Шале и отряд одолеть моё оружие и прервать ритуал? Или провалят миссию, едва начав?"
34170-179 = ""
34170-181 = ""
34170-182 = "Не терпится увидеть, как всё развернётся. Какая капризная судьба."
34170-183 = "А ты, Сэя, будешь молча это терпеть. И после поверишь, что ад существует."
34170-184 = ""
34170-188 = "*тяжело дышит* *тяжело дышит*"
34170-189 = "Беатриче... ошибается... Я не... сдамся... Буду пытаться... снова и снова..."
34170-190 = "Я должна выбраться... найти трещины и проскользнуть наружу..."
34170-191 = "Я не могу вечно оставаться в этом кошмаре..."
34170-192 = "Я не могу... не позволю победить меня здесь... Мне ещё... нужно..."
34170-194 = "Следующий эпизод;Другие мы"
