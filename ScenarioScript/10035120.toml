[translation]
10035120-1 = "Послесловие;Ошибка Инженерного департамента 1"
10035120-5 = "Жарко..."
10035120-7 = "Слишком жарко..."
10035120-8 = "И правда..."
10035120-9 = "С другой стороны, сейчас лето, так что это более-менее ожидаемо..."
10035120-10 = ""
10035120-13 = ""
10035120-14 = "Лето. А кажется, будто сакура цвела только вчера."
10035120-15 = "Вот именно."
10035120-16 = "Именно тогда я начала дорабатывать робота-флориста. Значит, прошло не больше пары дней."
10035120-18 = "Пары дней?! Сейчас середина лета!"
10035120-20 = "Невероятно."
10035120-21 = "Мы что, просто не заметили, как сменились времена года?"
10035120-22 = "Ну, ты меня знаешь. Когда увлекаюсь, перестаю замечать время..."
10035120-23 = "Хм... Жаль, что я, похоже, упустила шанс на летний отпуск. Но зато наш механический флорист скоро будет готов."
10035120-24 = ""
10035120-26 = ""
10035120-28 = ""
10035120-29 = "...О?"
10035120-30 = ""
10035120-32 = ""
10035120-33 = ""
10035120-36 = ""
10035120-37 = "Внимание всем. Мы получили новый заказ."
10035120-38 = ""
10035120-41 = "Что за заказ?"
10035120-42 = "И от кого?"
10035120-44 = "От Клуба исследования морской биологии. Они попросили создать морского развлекательного робота для летнего отдыха."
10035120-45 = ""
10035120-47 = ""
10035120-48 = "Срок... следующая неделя."
10035120-50 = ""
10035120-51 = "Они хотят, чтобы мы за НЕДЕЛЮ выдали целый новый проект?"
10035120-52 = "С программированием точно будут проблемы."
10035120-54 = "И всё же мастер, отказавшийся от заказа, едва ли достоин этого звания."
10035120-55 = ""
10035120-57 = ""
10035120-59 = ""
10035120-60 = "...Ладно, как насчёт такого?"
10035120-61 = "Возьмём робота-флориста за основу для нового."
10035120-62 = "О-о, хорошая идея!"
10035120-63 = "Тогда получится водная игрушка, которая ещё и цветы расставляет."
10035120-65 = "Отлично! Немедленно начинаем разработку нашего комбинированного робота для отдыха и флористики!"
10035120-66 = ""
10035120-69 = ""
10035120-70 = "Я посмотрела в интернете морские развлечения, и вот, похоже, три самых популярных..."
10035120-71 = "Дайвинг, рыбалка и катание на банане."
10035120-72 = "Тогда я всё объясню. При дайвинге надеваешь снаряжение и погружаешься в океан—"
10035120-73 = ""
10035120-75 = ""
10035120-76 = ""
10035120-78 = "Спасибо, Котори, но давай... отложим объяснение."
10035120-79 = "Нашему заказчику нужен аппарат, способный на несколько видов морского отдыха."
10035120-80 = "И, как подобает Клубу исследования морской биологии, они хотят, чтобы внешний вид хорошо вписывался в природную среду."
10035120-82 = "Короче, нам нужно сделать робота, который сможет закреплять точки для дайвинга, помогать с рыбалкой и буксировать лодки."
10035120-83 = "Непростая задача."
10035120-85 = "Кто-нибудь из нас вообще пробовал дайвинг? Или рыбалку? Или... бананы?"
10035120-86 = ""
10035120-89 = ""
10035120-91 = "Я — нет."
10035120-93 = "И всё же..."
10035120-94 = ""
10035120-97 = ""
10035120-98 = "Собираем эту штуку и заставляем работать!"
10035120-106 = "После нескольких дней тяжёлой и упорной работы..."
10035120-110 = "Наконец."
10035120-111 = "Наконец-то."
10035120-113 = "Мы закончили!"
10035120-114 = ""
10035120-116 = ""
10035120-119 = "Воплощение амбиций Инженерного департамента — Развлекательный Мехагатор!"
10035120-121 = "Ага! Ультимативное универсальное оружие: стальные конечности для закрепления точек погружения, огнемёт для повышения температуры воды и приманивания рыбы, и достаточно мощности, чтобы буксировать лодку среднего размера!"
10035120-122 = "Он выглядит прямо как аллигатор, а с правильными поведенческими алгоритмами ещё и будет вести себя как настоящий. В природную среду впишется без проблем!"
10035120-123 = "Было непросто... но ощущение, когда видишь готовый результат? Ни на что не променяю."
10035120-125 = "Хм, корпус определённо готов, но программирование, возможно, ещё требует доработки."
10035120-126 = "Но уже поздно. Тестовый запуск подождёт до завтра."
10035120-127 = "А пока отдохнём. Отличная работа, все!"
10035120-129 = ""
10035120-130 = "Ага, отличная работа!"
