10045100-162 = "(Вся наша тяжёлая работа окупилась. Водный фестиваль Хяккияко в этом году — огромный успех.)"
10045100-163 = "(Теперь Отдел проведения фестивалей навсегда оставит свой след в истории Хяккияко!)"
