10045100-111 = "Хи-хи. Ах, мой Сенсей! Я пришла, чтобы вы меня судили."
10045100-112 = "Где же вы-ы-ы?"
10045100-114 = "Вскоре..."
10045100-117 = "И вот мы наконец здесь, друзья! Долгожданный финальный матч! Вы готовы к битве?!"
