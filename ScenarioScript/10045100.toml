10045100-120 = "Изуне было так весело играть со всеми вами! И она хочет принести эти чувства в финальный матч!"
10045100-121 = "Поэтому Изуна надеется, что всем зрителям будет так же весело, как и ей! Нин-нин!"
10045100-123 = "Вот наша Изуна!"
10045100-124 = "В-Вперё-ё-д..."
10045100-126 = "О? Моя очередь?"
10045100-127 = "Как и со всем в жизни, я здесь только благодаря друзьям и союзникам, которые помогли мне подняться."
10045100-128 = "Так что смотрите внимательно! Я выиграю ради всех вас!"
10045100-129 = "Проиграешь — буду припоминать тебе это до самой нашей смерти."
10045100-130 = "Ты способна на всё, Рэнгэ."
