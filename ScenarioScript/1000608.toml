[translation]
1000608-1 = "Недоразумение Сенсея"
1000608-2 = "Жилой район Кивотоса"
1000608-3 = "Узкий переулок жилого района."
1000608-4 = ""
1000608-5 = "Иори провалилась в глубокую искусственную яму."
1000608-6 = "[s] «...»"
1000608-7 = "..."
1000608-8 = "[s] «Как ты туда попала?»"
1000608-9 = "Разве не очевидно? Я попалась в ловушку!"
1000608-10 = "Я выслеживала членов Банды Шлемов, которые устраивали проблемы в районе Геенны, и они внезапно заманили меня в тупик."
1000608-11 = "А там оказалась яма-ловушка! Бесполезные ублюдки!"
1000608-12 = "Что ты сказал? Ловушка была очевидной...? Я... Тогда она так не выглядела!"
1000608-13 = "Это не моя вина! Когда я на чём-то сосредотачиваюсь, я перестаю замечать всё остальное."
1000608-14 = "Я гордый член Префектурной команды Геенны. Я никогда не упускаю цель!"
1000608-15 = ""
1000608-16 = "В любом случае, ты долго ещё будешь там стоять? Быстрее помоги мне выбраться!"
1000608-17 = "[s] Достать телефон и сфотографировать Иори."
1000608-18 = ""
1000608-19 = "Эй, что это ещё такое? Прекрати!"
1000608-20 = ""
1000608-21 = "Я сказала, хватит! Никаких фотографий!"
1000608-22 = "Кто вообще начинает фотографировать человека, когда ему нужна помощь? Ты ужасен!"
1000608-23 = "[s1] «Ты такая милая, когда застреваешь там.»\n[s2] «Я хотел запомнить этот момент.»"
1000608-24 = "Ты наслаждаешься моими страданиями? Беру свои слова назад — ты садист!"
1000608-25 = "Ты наслаждаешься моими страданиями? Беру свои слова назад — ты садист!"
1000608-26 = ""
1000608-27 = "Ух...!"
1000608-28 = "Агх... Такими темпами я отсюда никогда не выберусь."
1000608-29 = "И лучше бы тебе на это надеяться! Я заставлю тебя пожалеть!"
1000608-31 = "Я ещё немного посмотрел, как Иори пытается выбраться, а затем помог ей."
1000608-34 = "...И как только выбралась, Иори сразу пнула меня по голени."
