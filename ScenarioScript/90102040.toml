[translation]
90102040-1 = "Эпизод 4;Внезапная проверка"
90102040-4 = ""
90102040-5 = "«Приближается поезд, пожалуйста, отойдите за жёлтую линию и подождите.»"
90102040-6 = ""
90102040-8 = "А, пришёл."
90102040-9 = "Сегодня что-то слишком людно, нет? Мы влезем?"
90102040-10 = "Э? Следующий же через 30 минут?"
90102040-11 = "Может, пройдём чуть вперёд?"
90102040-12 = ""
90102040-15 = ""
90102040-16 = ""
90102040-17 = "Так-так. Опасно, поэтому не подходите к путям и не ломайте очередь, пожалуйста."
90102040-18 = "Все обязательно сядете.#nНе ломайте очередь, вставайте по порядку!"
90102040-19 = ""
90102040-22 = "Эй, не толкайтесь!"
90102040-23 = "Сзади тоже давка. Подвиньтесь немного."
90102040-24 = "Поэтому я и говорю: не толкайтесь―"
90102040-25 = ""
90102040-27 = ""
90102040-28 = ""
90102040-31 = ""
90102040-32 = "Я же сказала, встаньте в очередь!"
90102040-33 = ""
90102040-35 = ""
90102040-36 = ""
90102040-39 = "«...Поезд прибывает»"
90102040-40 = ""
90102040-41 = "...Наконец-то тихо."
90102040-42 = "Почему они не слушаются, пока до этого не дойдёт."
90102040-43 = "И без того с этим не справиться,#nа CCC твердит одно: «Персонала достаточно» — и пытается не расширять станции..."
90102040-44 = "Серьёзно, о чём только думают наверху."
90102040-45 = "Эх... жалобами делу не поможешь."
90102040-46 = "Всё равно начальство CCC на местах появляется нечасто―"
90102040-47 = ""
90102040-50 = ""
90102040-51 = ""
90102040-52 = "Неужели на станции так много дел?"
90102040-53 = "Да вы что, послушайте.#nНе то что «много» — дел просто невпроворот."
90102040-54 = "Разбираешься с жалобами, обслуживаешь объекты, проверяешь оборудование безопасности, ещё и маневровые работы...#nСколько бы времени ни было, его всё равно не хватит!"
90102040-55 = "...А вы, собственно, кто?"
90102040-56 = ""
90102040-58 = ""
90102040-59 = "Такую большую станцию держат всего несколько человек — на местах, похоже, очень тяжело."
90102040-60 = "Не волнуйтесь. Когда вернусь, обязательно доложу."
90102040-61 = "Эта повязка... неужели ЦДЦ!?"
90102040-62 = "Ч-что вам нужно на такой отдалённой станции?#nО том, что придёт кто-то из ЦДЦ, даже на утреннем собрании не говорили..."
90102040-63 = "Неужели внезапная проверка..."
90102040-64 = "Не надо так напрягаться. Я просто заглянула по пути во время обхода."
90102040-65 = "Послушать запросы пассажиров напрямую, узнать, как тяжело на местах.#nВерно, Куруми?"
90102040-66 = "Конечно! Обеспечивать безопасную и комфортную среду для движения — обязанность ЦДЦ!"
90102040-67 = "Странно... Обычно мы шлём горы запросов, а их даже не читают и возвращают обратно..."
90102040-68 = "Что за ветер подул, что вы специально приехали на место..."
90102040-69 = "Кхм. В последнее время ходят разговоры, что расписание поездов, проходящих через эту станцию, странное."
90102040-70 = "Хочу проверить последнюю информацию о движении, можно немного времени?"
90102040-71 = "Если об этом, то начальник станции знает лучше меня."
90102040-72 = "В это время он должен быть в станционном кабинете, проводить вас?"
90102040-73 = "Нет-нет, всё в порядке. Раз уж я здесь, сначала немного осмотрюсь."
90102040-74 = "Хочу ещё послушать пассажиров... а, и ещё хочу попробовать бенто, которое продают в киоске!"
90102040-75 = "А? Но..."
90102040-77 = "Я же специально даю тебе шанс. Не понимаешь?"
90102040-78 = "Я пришла внезапно, у вас же не убрано, верно? В станционном кабинете."
90102040-79 = "Я дам тебе время [ruby=・   ・]прибраться[/ruby]. Ну, иди готовься."
90102040-80 = "А... да! Сейчас же сообщу начальнику станции!"
90102040-81 = ""
90102040-83 = ""
90102040-84 = "[ns1] «Неплохо.»\n[ns2] «Станционный работник так легко попался.»"
90102040-87 = "Ну, скрытное проникновение — один из обязательных навыков SRT."
90102040-88 = "Для опытного бойца SRT такое — как семечки!"
90102040-89 = "Да ну, а по-моему, тебя довольно сильно заподозрили?"
90102040-90 = "Ну, как бы подозрительно ни выглядел, мало кто может прямо сказать «вы подозрительны» своему непосредственному начальнику."
90102040-91 = "Всё-таки прикрываться чужим авторитетом эффективно в любой организации."
90102040-92 = ""
90102040-93 = "[ns] «Кстати, что значит \"прибраться\"?»"
90102040-94 = "Всё как есть. В захламлённой комнате ведь нельзя принять гостя?"
90102040-95 = "Прибраться, спрятать то, что не хочется показывать... на уборку нужно время."
90102040-96 = "А мы за это время сможем спокойно осмотреть станцию, не отвлекаясь."
90102040-97 = "[s] «Но ведь за это время могут уничтожить важные улики...»"
90102040-99 = "Не волнуйтесь.#nПо-настоящему опасное и так обычно прячут как следует."
90102040-100 = "К тому же тайники почти всегда одинаковые.#nВ ящике под кроватью, или за энциклопедией на книжной полке, до которой трудно дотянуться."
90102040-101 = "[s] «...Хм?»"
90102040-102 = "О, заметили?"
90102040-103 = "Если есть книги, которые не хотите показывать студентам, лучше спрятать их в другом месте.#nХотя гарантий, что их не найдут, всё равно нет."
90102040-104 = "...Да ничего там такого не было, о чём стоило бы говорить. Так, ерунда."
90102040-105 = "[s3] «П-погоди!..»\n[s4] «Откуда ты столько знаешь!?»"
90102040-108 = "Так, времени мало, давайте начнём опрос!"
90102040-109 = "Пошли, FOX3!"
90102040-110 = "Не командуй самовольно!"
90102040-111 = ""
90102040-112 = "[ns] «Эй, откуда ты столько знаешь!?»"
90102040-114 = "Следующий эпизод;Рядовые и начальство"
