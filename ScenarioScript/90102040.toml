[translation]
90102040-1 = "Episode 4;Spot Check"
90102040-5 = "A train is approaching. Please step behind the yellow line and wait."
90102040-8 = "Ah, it's here."
90102040-9 = "Isn't it super crowded today? Can we even fit on this?"
90102040-10 = "Huh? The next one isn't for another 30 minutes, you know?"
90102040-11 = "Should we head a bit closer to the front?"
90102040-17 = "Excuse me, excuse me. It's dangerous, so please stay away from the tracks and wait in an orderly line."
90102040-18 = "Everyone will be able to ride. #nSo please don't break the line and queue up in order!"
90102040-22 = "Hey, stop shoving!"
90102040-23 = "It's packed tight in the back too. Close up the gaps a bit."
90102040-24 = "That's why I'm asking you all not to push—"
90102040-32 = "I said get in line, damn it!"
90102040-39 = "\"...The train is now arriving.\""
90102040-41 = "...It's finally quiet."
90102040-42 = "Why won't they listen unless we go this far?"
90102040-43 = "We can't even get things under control as it is, #nand yet the CCC keeps insisting that 'staffing is sufficient' while trying to add more stations..."
90102040-44 = "Honestly, what on earth are the higher-ups thinking?"
90102040-45 = "Sigh... Well, complaining isn't going to change anything."
90102040-46 = "The big shots at the CCC aren't going to show up on-site anyway—"
90102040-52 = "Running a station involves that much work?"
90102040-53 = "Please, don't even get me started. #nIt's way beyond 'a lot of work'."
90102040-54 = "Between dealing with complaints, facility maintenance, checking safety equipment, and shunting operations... #nThere are never enough hours in the day for this!"
90102040-55 = "...Wait, who are you guys?"
90102040-59 = "Running such a big station with just a handful of people... working on the ground sounds really tough."
90102040-60 = "Don't worry. We'll make sure to report back properly when we return."
90102040-61 = "Those armbands... Could it be the CCC!?"
90102040-62 = "W-What brings you all the way to a remote station like this? #nWe didn't hear anything about a visit from the CCC during the morning briefing..."
90102040-63 = "Don't tell me, is this a spot check...?"
90102040-64 = "You don't need to be so on edge. We just dropped by while on patrol."
90102040-65 = "We wanted to hear feedback directly from passengers and see the struggles on-site for ourselves. #nRight, Kurumi?"
90102040-66 = "Of course! Ensuring a safe and comfortable operating environment is the CCC's duty!"
90102040-67 = "That's strange... Usually, even if we send mountains of request forms, they just send them back unread..."
90102040-68 = "What on earth possessed you to come all the way down here..."
90102040-69 = "Ahem. We've heard some talk lately that the train schedules passing through this station have been a bit off."
90102040-70 = "We'd like to check the latest operational data. Could you spare a moment?"
90102040-71 = "If that's the case, the Station Master would know much more about it than I do."
90102040-72 = "They should be in the station office at this hour. Shall I guide you there?"
90102040-73 = "No, no, it's fine. Since we're here, we'd like to look around a bit first."
90102040-74 = "I want to hear from the passengers too... Oh, and I want to try a train bento from the kiosk!"
90102040-75 = "Pardon? But..."
90102040-77 = "We're giving you a golden opportunity here. Don't you get it?"
90102040-78 = "Since we showed up out of the blue, the station office is probably a mess, right?"
90102040-79 = "We're giving you time to clean up. Go on, get ready."
90102040-80 = "Ah... Yes! I'll go inform the Station Master right away!"
90102040-84 = "[ns1] \"Smooth.\"\n[ns2] \"That station employee fell for it completely.\""
90102040-87 = "Well, fake infiltration is one of SRT's essential skills."
90102040-88 = "A seasoned SRT operative can pull this off in their sleep!"
90102040-89 = "Geez, for all that talk, weren't you looking pretty suspicious?"
90102040-90 = "Well, no matter how suspicious someone looks, not many people have the guts to tell their direct boss 'You look suspicious' right to their face."
90102040-91 = "I guess riding on authority works wonders in any organization."
90102040-93 = "[ns] \"Come to think of it, what did you mean by 'cleaning up' just now?\""
90102040-94 = "Exactly what it sounds like. You can't receive guests if the room is a mess, right?"
90102040-95 = "Tidying up, hiding things you don't want others to see... Cleaning takes time, you see."
90102040-96 = "While they're doing that, we can investigate the station without any interference."
90102040-97 = "[s] \"But while we're doing this, they might dispose of important evidence...\""
90102040-99 = "Don't worry. #nAnything truly incriminating is probably already well-hidden."
90102040-100 = "Besides, hiding spots are usually pretty predictable. #nLike storage under the bed, or behind the hard-to-reach encyclopedia on the bookshelf."
90102040-101 = "[s] \"...Huh?\""
90102040-102 = "Oh, you just realized?"
90102040-103 = "If you have books you don't want your students to find, you'd better hide them somewhere else. #n Though I can't guarantee they won't still find them."
90102040-104 = "...It's not like the contents were worth making a fuss over anyway. At least not that one."
90102040-105 = "[s3] \"W-Wait a minute...!\"\n[s4] \"Just how much do you know!?\""
90102040-108 = "Well, we don't have much time, let's start questioning!"
90102040-109 = "Let's go, FOX3!"
90102040-110 = "Don't boss me around!"
90102040-112 = "[ns] \"Hey, just how much do you know!?\""
90102040-114 = "Next Episode;The Ranks and the Execs"
