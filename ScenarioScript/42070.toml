[translation]
42070-1 = "Эпизод 7;Государственный переворот"
42070-2 = "Несколькими часами ранее, в конференц-зале Генерального студенческого совета Кивотоса."
42070-4 = ""
42070-5 = "Следующий пункт повестки — определить степень наказания для корпорации Кайзер и её руководителей за использование катастрофы для разжигания гражданской войны и захвата полномочий Генерального студенческого совета."
42070-6 = "В обычной ситуации это стало бы одним из главных приоритетов совета и Административного совета сразу после возобновления работы."
42070-7 = "Однако из-за разрушения множества объектов связи и логистики D.U. во время недавних событий обсуждение отложили, пока первоочередной задачей остаётся восстановление D.U. ради безопасности и благополучия граждан."
42070-8 = ""
42070-10 = ""
42070-11 = "Спасибо за разъяснение."
42070-12 = "Как уже было сказано, корпорация Кайзер возглавила группу частных военных, пытаясь захватить башню Санктум и использовать найденное ими древнее оружие."
42070-13 = "Хотя с помощью Сенсея Шале и членов студсоветов разных районов нам удалось не дать ситуации выйти из-под контроля, важно понимать возможные последствия."
42070-14 = "...Если бы мы их не остановили, рухнул бы не только Генеральный студенческий совет — весь Кивотос оказался бы в смертельной опасности."
42070-15 = "Всё это стало возможным лишь потому, что Корпорация Кайзер — мегакорпорация с влиянием во всех областях, от обороны до логистики."
42070-16 = "Чтобы подобное никогда не повторилось, считаю необходимым применить к Корпорация Кайзер и её руководителям максимально суровое наказание."
42070-17 = ""
42070-20 = "Погодите. Да, Корпорация Кайзер действительно использовала частных военных для силового захвата Генерального студенческого совета..."
42070-21 = "Но нельзя игнорировать тот факт, что односторонний запуск Рин Комитета чрезвычайного реагирования незадолго до инцидента вызвал хаос внутри совета."
42070-23 = "Но в тот день нас не было именно из-за предложения объявить Рин порицание..."
42070-24 = "Кроме того! Есть сообщения, что главного администратора Рин видели внутри одного из древних орудий, найденных корпорацией Кайзер..."
42070-25 = "...Разве невозможно, что главный администратор Рин была каким-то образом связана с Корпорация Кайзер?"
42070-26 = "Это очень серьёзное обвинение..."
42070-27 = "Я понимаю, что вокруг дела могут возникать подозрения, но давайте помнить: существуют установленные процедуры и протоколы для подобных вопросов."
42070-28 = "Если будет принято решение о привлечении к ответственности и начнётся расследование против Корпорация Кайзер, я полностью с ним сотрудничу."
42070-30 = "*шёпотом* Эй, Аой... Сколько часов уже идёт это собрание? Мы уже пропустили обед?"
42070-31 = "С начала прошло 8 часов, 32 минуты и 15 секунд."
42070-32 = "Но в повестке ещё три пункта, так что просто съешь свой онигири."
42070-33 = "Такие марафонские заседания довольно типичны для Административного совета, разве нет?"
42070-35 = "Онигири? Какой онигири? Эй, Аой. Ты мне никакого онигири не дала."
42070-36 = ""
42070-37 = "Разве не Рин изначально дала Сенсею Шале экстерриториальные полномочия?"
42070-38 = "Хотя это было указано в записке председателя Генерального студенческого совета, мы даже не смогли подтвердить подлинность этой записки..."
42070-39 = "Мы уже это проходили. Записка несомненно написана председателем Генерального студенческого совета."
42070-40 = "Если потребуется, можем подтвердить подлинность почерковедческой экспертизой..."
42070-41 = "Главный администратор, дело не в этом! Для всего существуют установленные процедуры!"
42070-42 = "Игнорировать решения Административного совета недопустимо, даже если вы временная председательница Генерального студенческого совета!"
42070-43 = "Я всегда точно следовала правилам и процедурам, как они прописаны, но..."
42070-44 = ""
42070-45 = "*шёпотом* Эй, Сумомо... Ты взяла онигири?"
42070-46 = "*зевает* Я сейчас слишком сонная, чтобы есть..."
42070-47 = "Не для тебя. Я пытаюсь спросить, не ты ли забрала мою порцию онигири."
42070-48 = ""
42070-49 = "Корпорация Кайзер — один из крупнейших игроков Кивотоса, и её крах станет катастрофой хуже инцидента с башнями."
42070-50 = "Если Кайзер Индастриз, Кайзер Construction и Кайзер Convenience обанкротятся одновременно, безработица взлетит."
42070-51 = "Кто возьмёт за это ответственность, главный администратор?"
42070-52 = "Учитывая влияние Корпорация Кайзер, полагаю, будет достаточно штрафа на восстановление и устранение последствий."
42070-53 = ""
42070-54 = "Эй, Момока... Ты голодная?"
42070-55 = "Мои чипсы со вкусом тарако ты не получишь, сколько бы ни просила. Даже не пытайся."
42070-56 = "Иди возьми онигири или что-нибудь. Только чипсы не трогай."
42070-58 = "Нет, я пытаюсь сказать, что мне вообще не дали онигири!"
42070-59 = ""
42070-61 = ""
42070-62 = "Не думаю, что дальнейшее обсуждение сейчас будет продуктивным."
42070-63 = "Главный администратор, думаю, всем полезно немного проветриться. Предлагаю закончить на сегодня и продолжить позже."
42070-64 = "Поняла."
42070-65 = "Уже поздно, так что закрываем заседание и продолжим завтра."
42070-66 = "Спасибо, все."
42070-67 = ""
42070-70 = ""
42070-73 = ""
42070-74 = "Фух..."
42070-75 = "Я думала, что подготовилась к тому, насколько это будет тяжело..."
42070-76 = ""
42070-79 = "Спасибо за работу, главный администратор."
42070-80 = "А, глава обороны."
42070-81 = "Спасибо. И вам тоже."
42070-82 = "Что-то случилось? Как вы себя чувствуете?"
42070-83 = "Просто хотела зайти и сказать: по-моему, вы отлично справились!"
42070-84 = "Вы мне льстите."
42070-85 = "Я уже раньше так думала, но они совершенно переходят границы."
42070-86 = "Практически всё, на что они используют рты, — сплетни о вас или разговоры о себе."
42070-87 = "Быть лидером и принимать решения, учитывая столько разных мнений, непросто."
42070-88 = "Хотя винить их не могу. Я тоже ответственна за нынешнюю ситуацию."
42070-89 = "Мне остаётся быть терпеливой и убеждать их одного за другим."
42070-90 = "Но... обязательно ли?"
42070-91 = "Вы главный администратор Общего управления, но одновременно временная председательница Генерального студенческого совета."
42070-93 = "Вы могли бы сильно облегчить себе жизнь, используя полномочия и заставляя остальных председателей соглашаться."
42070-94 = "Но полномочия..."
42070-95 = "Это обоюдоострый меч, глава обороны."
42070-96 = "Кажется быстрым решением, но чем чаще на него полагаешься, тем меньше оно стоит."
42070-97 = "Я не могу использовать власть, чтобы подавлять чужие голоса только потому, что они со мной не согласны."
42070-98 = "Если честно, я даже в себе не уверена..."
42070-99 = "*вздыхает*"
42070-101 = "...Как я и думала, возможно, должность председателя вам вообще не подходит."
42070-102 = ""
42070-105 = "..."
42070-106 = "Что вы говорите, глава обороны?"
42070-109 = "Рин. По правде говоря, ты мне никогда не нравилась."
42070-110 = "Ты совершенно не похожа на председателя, но она всегда тебе благоволила..."
42070-111 = "И посмотри на себя. Даже после её исчезновения ты всё пытаешься соответствовать её ожиданиям. Ты председательница, но всё равно слушаешь всех вокруг и цепляешься за процедуры..."
42070-112 = "Твой раздражающий центристский подход ничего не исправит."
42070-113 = "Кивотос способен исправить только сверхчеловек."
42070-114 = "Глава Кая. Председатель Генерального студенческого совета пропала, её место пустует."
42070-115 = "Моя обязанность как главного администратора — сохранять и защищать это место в её отсутствие."
42070-117 = "О... Вот как?"
42070-118 = "Забавно, но во время недавнего инцидента я наткнулась на кое-что интересное в подвале Шале."
42070-119 = ""
42070-120 = "Тайное письмо председателя Генерального студенческого совета, которое никогда не публиковалось."
42070-121 = "Тайное письмо...?"
42070-122 = "Согласно письму, в чрезвычайной ситуации председатель хотела, чтобы руководство взяла глава обороны, а не главный администратор."
42070-123 = "Другими словами, временной председательницей на время её отсутствия должна была стать не Нанагами Рин. С самого начала предполагалась Ширануи Кая."
42070-124 = "Что за чушь ты сейчас несёшь?"
42070-125 = "Тогда следующий вопрос: почему письмо с таким важным сообщением тайно спрятали в подвале Шале?"
42070-126 = "Да, спрятали в подвале Шале... в здании, к которому после исчезновения председателя, по удивительному совпадению, доступ имела только главный администратор Нанагами Рин."
42070-127 = "И ещё одно совпадение: разве не вы, главный администратор Рин, получаете больше всего выгоды от сокрытия этого документа?"
42070-128 = "Смешно. Ты думаешь, люди просто поверят в подлинность письма без доказательств?"
42070-129 = "Я закажу почерковедческую экспертизу и анализ подписи. Если письмо действительно написано председателем Генерального студенческого совета, проблем быть не должно."
42070-130 = "Конечно, проверка подлинности документа крайне важна. Как и с запиской, найденной в кабинете председателя."
42070-131 = "Ах. Я бы на вашем месте вспомнила о нынешнем положении в совете. Как думаете, сколько членов вам поверят? Хм?"
42070-132 = "Кая. Ты..."
42070-133 = ""
42070-136 = ""
42070-137 = "Главный администратор Нанагами Рин, вы экстренно арестованы за сокрытие официальных документов и злоупотребление полномочиями."
42070-138 = "В соответствии со статьёй 78 Исполнительного регламента Генерального студенческого совета ваши полномочия временной председательницы автоматически приостанавливаются до завершения расследования."
42070-139 = "А пока, полагаю, нам понадобится новая временная председательница, не так ли?"
42070-140 = "Ты планировала это с самого начала."
42070-141 = "Если председатель вернётся, она тебе этого не простит."
42070-142 = "А если вернётся, с нетерпением посмотрю на её реакцию на ваш абсолютный провал в её отсутствие."
42070-143 = "..."
42070-144 = "А теперь, пожалуйста, уважительно сопроводите главного администратора в общежитие. Круглосуточный домашний арест и наблюдение."
42070-145 = "Есть, госпожа!"
42070-146 = ""
42070-148 = ""
42070-151 = ""
42070-154 = "...Директор отдела кадров. Как обстановка с протестами вокруг здания Генерального студенческого совета?"
42070-155 = "Я как раз собиралась с вами связаться."
42070-156 = "Мы собрали много студентов для протеста против слабой реакции Транспортного отдела и Регуляторного комитета на недавние происшествия с общественной инфраструктурой."
42070-157 = "Думала, придётся их нанимать, но они неожиданно пришли добровольно."
42070-158 = "Возможно, потому что это были наши студенты, но они выглядели очень увлечёнными и говорили что-то о транспортных технологиях."
42070-159 = "Разумеется, ничего из этого не получилось бы без вашей разведывательной информации, глава обороны."
42070-160 = "Там было много данных, которые сложно получить, если не присутствовать лично... Мне даже любопытно, как вы всё это собрали."
42070-161 = "...Эта бессмысленная любознательность хоть как-то поможет вам выполнить задачу?"
42070-162 = "О-О, нет... Я не хотела лезть не в своё дело..."
42070-163 = "В-В любом случае, докладываю! Перед зданием протестуют разъярённые студенты, так что даже для нейтрального члена совета, которому неинтересны фракции, главный администратор Рин будет выглядеть плохо."
42070-164 = "Уверена, большинство поддержит вотум недоверия."
42070-165 = "Отличная работа. Продолжайте внимательно управлять протестующими."
42070-166 = ""
42070-169 = ""
42070-171 = "Хайнэ, что с письмами, которые нужно было отправить спортивным федерациям?"
42070-172 = "Отправила сразу, как вы просили!"
42070-173 = ""
42070-175 = ""
42070-176 = "Ну... Не совсем сразу..."
42070-177 = "После собрания я ужасно проголодалась и зашла на кухню перекусить..."
42070-178 = "...Не обязательно докладывать каждую такую мелочь."
42070-179 = "И? Как реагирует спортивная отрасль?"
42070-180 = "Обычно они очень жёстко относятся к мошенничеству и манипуляциям, так что все сильно разочаровались, узнав, что главный администратор Рин подделывала официальные документы ради собственной выгоды."
42070-181 = "Правда ли, что отряд FOX, недавно напавший на Генеральный студенческий совет, тоже финансировала главный администратор Рин? Тогда и правда казалось, будто они спешили закрыть академию SRT..."
42070-182 = "Разумеется. Если это всё, я отключаюсь—"
42070-183 = "Кстати, эти лисы умеют скручивать, да? Как только я схватила их за плечи, меня сразу взяли на обратный узел! Наверняка в SRT их ещё и болевым учили..."
42070-184 = "..."
42070-185 = "Надо было сдаться тогда... Плечо после последней атаки, кажется, уже никогда не восстановится..."
42070-186 = "...Хайнэ, я кладу трубку."
42070-187 = "Да-да. Стой, но это важно. Мне должны были дать онигири, и я хочу знать, кто—"
42070-188 = ""
42070-191 = "По крайней мере о голосах недоверия можно больше не переживать."
42070-192 = "И напоследок..."
42070-193 = ""
42070-195 = ""
42070-197 = "...Протокольная группа?"
42070-198 = "Да. Нужно немедленно подготовить экстренное заявление."
42070-199 = "Также свяжитесь с каналом «Кронос» и городскими станциями. Установка камер займёт время."
42070-200 = "...Вотум недоверия много времени не займёт. Исход уже определён."
42070-201 = "Да, пожалуйста, помогите не выбиться из графика."
42070-202 = "...Ах, и скоро мы будем принимать очень особого гостя, так что подготовьтесь."
42070-203 = "Имя нашего гостя..."
42070-206 = "Сенсей [USERNAME]."
42070-208 = "Следующий эпизод;Новый заместитель"
