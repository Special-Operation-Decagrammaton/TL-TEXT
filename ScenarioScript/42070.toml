[translation]
42070-1 = "Episódio 7;Golpe de Estado"
42070-2 = "(Algumas horas antes da declaração de emergência... Conselho Estudantil Geral — Sala de Reuniões)"
42070-5 = "...A próxima pauta trata da punição à Kaiser Corporation e à sua diretoria,#npor terem incitado uma insurreição durante a crise para tentar tomar a autoridade do Conselho Estudantil Geral."
42070-6 = "Normalmente, assim que o Comitê Executivo foi normalizado,#nesse assunto deveria ter sido tratado com máxima prioridade, mas..."
42070-7 = "...Como muitas instalações de comunicação e logística do D.U. foram destruídas na crise anterior,#npriorizamos a reconstrução do D.U. pela segurança e conveniência dos cidadãos,#nmantendo a discussão deste caso suspensa até agora."
42070-11 = "...Obrigada."
42070-12 = "Como acabou de ser explicado, durante a crise anterior, a Kaiser Corporation#nliderou soldados em um ataque ao Conselho Estudantil Geral. Eles tomaram o controle da Torre Sanctum#ne tentaram usar esse poder para operar uma superarma ancestral que haviam escavado."
42070-13 = "Felizmente, graças à cooperação do Sensei de Schale e das representantes dos conselhos estudantis de cada distrito,#nconseguimos evitar o agravamento da situação, porém..."
42070-14 = "...Se não os tivéssemos detido, não apenas o Conselho Estudantil Geral,#nmas toda Kivotos poderia ter entrado em colapso."
42070-15 = "Acredita-se que essa situação tenha ocorrido porque a Kaiser Corporation é uma megacorporação#ncapaz de controlar desde a indústria de defesa até a logística."
42070-16 = "Para que algo assim nunca mais aconteça, devemos aplicar a punição máxima#nà Kaiser Corporation e à sua diretoria."
42070-20 = "Espere um momento. É fato que a Kaiser Corporation mobilizou forças privadas para ocupar militarmente o Conselho Estudantil Geral, mas..."
42070-21 = "O fato de terem conseguido invadir a Torre Sanctum tão facilmente não foi também consequência de a Administradora Rin ter convocado unilateralmente um Comitê de Medidas de Emergência, mergulhando o Conselho Estudantil Geral no caos?"
42070-23 = "É-É verdade que a Rin-senpai convocou o Comitê de Medidas de Emergência, mas dizer que isso foi um fator direto..."
42070-24 = "Então como você explica o depoimento de que a Administradora Rin estava a bordo da superarma ancestral escavada pela Kaiser Corporation?"
42070-25 = "...Não existe a possibilidade de que a Administradora Rin estivesse, na verdade, mancomunada com a Kaiser Corporation?"
42070-26 = "Q-Que absurdo é esse..."
42070-27 = "...Compreendo perfeitamente que suspeitem de mim, já que estive diretamente envolvida no incidente."
42070-28 = "Assim que a proposta sobre esta crise for aprovada e a investigação contra a Kaiser Corporation começar, prometo colaborar com total transparência."
42070-30 = "Ei, Aoi-senpai... essa reunião ainda não vai acabar?#nA gente nem almoçou ainda."
42070-31 = "Ainda não. Faltam umas três pautas na agenda, não é?"
42070-32 = "Já se passaram exatamente 8 horas, 32 minutos e 15 segundos desde o início...#nUma maratona de reunião desse nível é rotina no Gabinete de Defesa, não?"
42070-33 = "Para o almoço, se contente com o onigiri de antes."
42070-35 = "A gente recebeu onigiri...?"
42070-37 = "Aliás, não foi a própria Administradora Rin quem concedeu autoridade extrajudicial ao Sensei de Schale?"
42070-38 = "Mesmo que o bilhete deixado pela Presidente do Conselho Estudantil Geral tenha \"aquele\" conteúdo,#nnós sequer pudemos confirmar se ele é verdadeiro."
42070-39 = "...Não há dúvidas de que foi a Presidente do Conselho Estudantil Geral quem deixou o bilhete."
42070-40 = "Se necessário, podemos realizar um exame grafotécnico para comprovar a autenticidade—"
42070-41 = "Administradora-Chefe, existe uma ordem para as coisas!"
42070-42 = "Mesmo sendo a Presidente Interina do Conselho Estudantil Geral,#nnão podemos tolerar atitudes que ignorem as decisões do Comitê Executivo!"
42070-43 = "Eu sempre resolvo os problemas seguindo os procedimentos e as regras, mas..."
42070-45 = "Ei, Sumomo.#nVocê recebeu algum onigiri?"
42070-46 = "Buaaah... Tô com tanto sono que nem consigo comer onigiri..."
42070-47 = "Não, eu não tô falando do seu, tô falando do meu..."
42070-49 = "Além disso, a Kaiser Corporation é uma das maiores empresas de Kivotos."
42070-50 = "Kaiser Industry, Kaiser Construction, Kaiser Convenience...#nSe essas empresas paralisarem as atividades, Kivotos ficará repleta de desempregados."
42070-51 = "Se isso acontecer, uma desordem sem precedentes será inevitável.#nE quem, afinal, assumiria a responsabilidade por isso?"
42070-52 = "...Considerando a influência da Kaiser Corporation,#nresolver a questão apenas com a cobrança de uma multa também..."
42070-54 = "Ei, Momoka..."
42070-55 = "Não adianta me olhar assim, eu não vou te dar estas batatinhas sabor mentaiko."
42070-56 = "Se está com fome, é só comer o onigiri que distribuíram#nmais cedo, ué. (Croc, croc)"
42070-58 = "Mas eu já disse que não recebi onigiri nenhum?!"
42070-62 = "...Pelo visto, vai ser difícil continuar a discussão daqui em diante."
42070-63 = "Administradora-Chefe, que tal encerrarmos por hoje e retomarmos em outra data?#nAfinal, todas devem precisar de um pouco de tempo para refletir."
42070-64 = "...Entendido."
42070-65 = "Vamos encerrar a sessão de hoje por aqui.#nContinuaremos amanhã."
42070-66 = "Obrigada pelo trabalho de todas."
42070-74 = "Uf..."
42070-75 = "Eu já imaginava, mas está mais difícil do que eu pensava..."
42070-79 = "Bom trabalho hoje, Administradora-Chefe."
42070-80 = "Ah, Chefe do Gabinete de Defesa."
42070-81 = "Bom trabalho para você também."
42070-82 = "Se veio até aqui... há algum assunto que queira tratar comigo?"
42070-83 = "Não, apenas jogar conversa fora.#nAinda assim, a reunião de agora há pouco foi realmente desgastante, não foi...?"
42070-84 = "Não, que isso."
42070-85 = "...As demais membras do conselho realmente dão trabalho."
42070-86 = "Era para ser um espaço de debate, mas todas só querem dizer o que bem entendem..."
42070-87 = "Imagino o quanto a Administradora-Chefe deve sofrer#nprecisando levar em conta a opinião de todas."
42070-88 = "Não há o que fazer. Também é responsabilidade minha termos chegado a este ponto."
42070-89 = "Só me resta dedicar tempo e persuadir as membras pouco a pouco."
42070-90 = "...Será mesmo necessário buscar a aprovação das membras?"
42070-91 = "Você é a Administradora-Chefe do Gabinete Geral, mas também é a Presidente Interina do Conselho Estudantil Geral."
42070-93 = "Se usasse a autoridade da Presidência Interina para simplesmente ordenar às membras,#nnão conseguiria realizar o trabalho sem toda essa demora?"
42070-94 = "Autoridade, é...?"
42070-95 = "Isso é como um cálice envenenado, Chefe do Gabinete de Defesa."
42070-96 = "Pode até ser um trunfo conveniente, mas quanto mais se usa, mais destrói a si mesma."
42070-97 = "Não posso usar a autoridade para silenciar os outros só porque discordam de mim."
42070-98 = "Além disso, eu mesma... nem tenho confiança de que estou cumprindo bem o papel de interina..."
42070-99 = "Ah..."
42070-101 = "...Realmente, você não tem qualificação para ser a Presidente Interina do Conselho Estudantil Geral."
42070-105 = "........."
42070-106 = "...Chefe do Gabinete de Defesa, o que significa isso?"
42070-109 = "Rin, faz muito tempo que eu a considero uma pedra no sapato."
42070-110 = "Sem um pingo de competência, mas monopolizando a confiança da Presidente do Conselho Estudantil Geral..."
42070-111 = "E mesmo depois de assumir como Presidente Interina, ainda tenta conduzir as coisas reunindo a opinião de todo mundo..."
42070-112 = "Esse tipo de oclocracia não resolve absolutamente nada."
42070-113 = "Kivotos deve ser comandada por um super-humano."
42070-114 = "...A Presidente do Conselho Estudantil Geral continua desaparecida, Chefe Shiranui."
42070-115 = "E o papel da Administradora-Chefe é proteger o lugar dela."
42070-117 = "Huhu, será mesmo?"
42070-118 = "Na verdade, naquele dia, encontrei algo bem interessante no subsolo de Schale."
42070-120 = "Isto é — uma carta oculta da Presidente do Conselho Estudantil Geral."
42070-121 = "Uma carta... da Presidente do Conselho Estudantil Geral...?"
42070-122 = "Sim. Segundo esta carta, caso algo acontecesse, a Presidente pretendia encarregar#nnão a Administradora, mas a Chefe do Gabinete de Defesa como Presidente Interina."
42070-123 = "Ou seja, quem deveria assumir como Presidente Interina do Conselho Estudantil Geral#nnão é você, e sim eu."
42070-124 = "O que... significa isso...?"
42070-125 = "...A propósito, por que será que uma carta tão importante#nestava escondida no subsolo de Schale?"
42070-126 = "Na época em que a Presidente do Conselho Estudantil Geral desapareceu, a única com permissão para entrar e sair de Schale#nera você, Rin Nanagami."
42070-127 = "E quem mais se beneficiaria escondendo esta carta — também é você."
42070-128 = "...Você tem alguma prova de que isso foi escrito pela Presidente do Conselho Estudantil Geral?"
42070-129 = "Exijo um exame grafotécnico.#nSe a própria Presidente redigiu isso, então a assinatura também—"
42070-130 = "É claro que confirmar a autenticidade é importante.#nAssim como aquele bilhete deixado na sala da Presidente."
42070-131 = "Porém... no Conselho Estudantil Geral de hoje, quantas pessoas ainda restam#ndispostas a acreditar nas suas palavras?"
42070-132 = "...Não pode ser."
42070-137 = "Administradora Rin Nanagami, você está sob prisão emergencial por suspeita de destruição de documento público e abuso de autoridade."
42070-138 = "Com base no Artigo 78 do Regulamento de Membros do Conselho Estudantil Geral,#nsuas funções como Presidente Interina ficam suspensas até a conclusão da investigação."
42070-139 = "Independentemente da autenticidade da carta —#npor ora, precisaremos de uma nova Presidente Interina do Conselho Estudantil Geral."
42070-140 = "...Então tudo isso foi planejado por você."
42070-141 = "Quando a Presidente do Conselho Estudantil Geral retornar, toda a verdade virá à tona."
42070-142 = "Huhu, pelo contrário: quem deveria ser culpada por deixar a situação chegar a este ponto não é você?"
42070-143 = "........."
42070-144 = "Pois bem, escoltem a Administradora-Chefe com toda a cortesia.#nAh, e mantenham a vigilância sobre ela depois, por favor."
42070-145 = "Sim, senhora Chefe do Gabinete de Defesa!"
42070-154 = "Olá... Chefe do Gabinete de Recursos Humanos. Os protestos em frente ao prédio do Conselho Estudantil Geral estão sob controle?"
42070-155 = "Ah, Chefe do Gabinete de Defesa. Ligou na hora certa."
42070-156 = "Por enquanto os protestos estão indo bem. Quando convocamos manifestantes usando os acidentes em instalações públicas e a resposta frouxa dos Gabinetes de Trânsito e de Mediação como motivo, apareceu gente pra caramba."
42070-157 = "No começo eu até ia pagar para contratar o pessoal,#nmas por algum motivo elas se mobilizaram sozinhas dizendo que protesto era com elas mesmo..."
42070-158 = "Hmpf, digno das alunas da minha antiga escola. Têm iniciativa."
42070-159 = "E as informações que você me mandou também foram bem úteis."
42070-160 = "Só que parecia haver um monte de detalhes ali que só quem esteve no local dos acidentes saberia... Como foi que você conseguiu tudo aquilo?"
42070-161 = "...Essa informação é necessária para os protestos?"
42070-162 = "Não... necessária não é, mas..."
42070-163 = "Bem, tanto faz. De qualquer forma, com tantas alunas protestando na frente do prédio, até as membras neutras que não ligam para disputas internas vão ficar com uma má impressão da Administradora Rin."
42070-164 = "Quando sair a moção de desconfiança, muitas delas vão votar a favor sem nem pestanejar..."
42070-165 = "Entendo... Obrigada pelo trabalho.#nPor favor, continue mantendo os protestos sob controle."
42070-171 = "Haine, como ficou o documento oficial que deveria ser enviado à Associação Atlética?"
42070-172 = "Enviei logo que a reunião acabou, como você pediu!"
42070-176 = "Ah... bem, sendo bem sincera, não foi exatamente na hora..."
42070-177 = "Eu estava morrendo de fome, então passei no refeitório para comer depois da reunião..."
42070-178 = "...Não precisa relatar detalhes tão irrelevantes."
42070-179 = "E então, como estão as coisas por lá?"
42070-180 = "Quando souberam que a Administradora Rin falsificou documentos oficiais em benefício próprio,#ntodo mundo ficou bem decepcionado. O pessoal lá é rígido com fraude e manipulação de informações."
42070-181 = "Aliás, é verdade mesmo que o ataque do Esquadrão FOX ao Conselho Estudantil Geral dias atrás#nfoi orquestrado pela Administradora Rin?#nEntão era por isso que ela tinha tanta pressa em fechar a Academia Especial SRT..."
42070-182 = "Exatamente. Bem, era só isso—"
42070-183 = "Aquela raposa não teve piedade nenhuma, sabia?#nQuando tentei resistir, ela me aplicou uma chave de braço chicken wing!#nNa Academia Especial SRT eles ensinam até chave de articulação?"
42070-184 = "........."
42070-185 = "Ai, eu devia ter batido logo naquela hora...#nMeu ombro ainda tá latejando..."
42070-186 = "...Haine, vou desligar."
42070-187 = "Ah, espera, espera! Quem foi que pegou o meu onigiri—"
42070-191 = "...Nesse ritmo, não há risco de a moção de desconfiança ser rejeitada."
42070-192 = "E, por fim..."
42070-197 = "...Protocolo?"
42070-198 = "Sim, certo... Preparem imediatamente a declaração de emergência."
42070-199 = "Avisem o Canal Kronos e as emissoras de cada distrito com antecedência também.#nAfinal, preparar os equipamentos de filmagem leva tempo."
42070-200 = "...A votação de desconfiança vai acabar rápido.#nO resultado já está praticamente decidido."
42070-201 = "Então conto com vocês."
42070-202 = "...Ah, e teremos uma visita muito especial,#nportanto preparem a recepção."
42070-203 = "Sim, o nome é—"
42070-206 = "— Sensei [USERNAME]."
42070-208 = "Próximo;Nova Presidente Interina"
