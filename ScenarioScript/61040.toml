[translation]
61040-1 = "Эпизод 4;Где сливаются реки"
61040-2 = "[ns] «Так... Всё готово...»"
61040-5 = "Набранный вами номер не существует. Оставьте сообщение после сигнала."
61040-6 = "[s] «...Ты стала лучше шутить, Ацуко»."
61040-7 = "Спасибо, что заметили, Сенсей."
61040-8 = "Я научилась так отвечать на звонки с незнакомых номеров."
61040-9 = "Разумеется, ваш номер я узнала сразу."
61040-10 = "А теперь позвольте поприветствовать вас ещё раз. Здравствуйте, Сенсей."
61040-11 = "[s] «Как ты? Приветствия важны, правда?»"
61040-12 = "Да. Я рада, что вы запомнили."
61040-13 = "Что касается первого вопроса... Хм. Можно сказать, достаточно хорошо."
61040-14 = "Я всё ещё скрываюсь и должна следить за окружением."
61040-15 = "Хотя каждый выход требует осторожности, мне нравится, что свободное время я могу проводить как хочу."
61040-16 = "Так что у меня всё хорошо."
61040-17 = "А как вы, Сенсей? Всё в порядке?"
61040-18 = "[s1] «Знаю, вопрос неожиданный.»\n[s2] «Но что вы думаете об экзаменах?»"
61040-21 = "Экзаменах?"
61040-22 = "Фу-фу. Вы прямо как настоящий учитель."
61040-23 = "Нет-нет. Не извиняйтесь. Я сказала это в хорошем смысле. Это было очень... в вашем духе."
61040-24 = "Экзамен... это проверка того, что я изучила, верно?"
61040-25 = "Я знакома с этим только в теории. Почему спрашиваете?"
61040-26 = "[s3] «Повторюсь, вопрос совершенно внезапный.»\n[s4] «Но если бы у вас появилась возможность сдать экзамен, что бы вы сделали?»"
61040-29 = "Хм..."
61040-30 = "Например, экзамен по знаниям о том, как появляются дети?"
61040-31 = "Звучит довольно занимательно."
61040-32 = "[s] «Нет! Не такой!»"
61040-33 = "Прошу прощения. Хи-хи."
61040-34 = "Честно говоря, у меня нет ответа."
61040-35 = "Трудно представить то, чего никогда не испытывала."
61040-36 = "Но сама идея — сначала учиться, а потом получить признание за учёбу..."
61040-37 = "...Да."
61040-38 = "Обычный студент, наверное, может испытать что-то подобное."
61040-39 = "Я бы хотела узнать, что скажут остальные, но в этом определённо есть привлекательность."
61040-40 = "...Есть ведь и вероятность плохо написать?"
61040-41 = "Аха. Полагаю, да. Если так случится, вы проведёте нам дополнительные занятия? По-моему, выгода для всех."
61040-42 = "Но почему?"
61040-43 = "[s] «Я был в Тринити... и встретил переводных студентов из Ариус»."
61040-44 = "О?"
61040-45 = ""
61040-47 = ""
61040-48 = "...Хм. Я понимаю ситуацию."
61040-49 = "[s] «Они переживали за вас...»"
61040-50 = ""
61040-52 = ""
61040-53 = ""
61040-54 = "Спасибо, что рассказали."
61040-55 = "Хм..."
61040-56 = "Вообще-то, Сенсей?"
61040-57 = "Наверное, лучше обсудить это лично."
61040-58 = "[s5] «Ты права.»\n[s6] «Нас могут прослушивать.»"
61040-61 = "Мм."
61040-62 = "Я совсем не это имела в виду."
61040-63 = "[s] «Т-Тогда что?»"
61040-64 = "Как я и сказала."
61040-65 = "Так будет лучше."
61040-66 = "Я хочу видеть вас лицом к лицу, когда мы будем это обсуждать."
61040-67 = "И остальных тоже."
61040-68 = "[s7] «Я найду подходящее место для встречи.»\n[s8] «Полагаю, вместе со мной нас будет четверо.»"
61040-71 = "Вообще-то пятеро."
61040-72 = "[s] «Пятеро...?»"
61040-73 = ""
61040-76 = "[ns9] «Понятно... Я понимаю.»\n[ns10] «Ты уверена?»"
61040-79 = "Конечно."
61040-80 = "Мы ведь не в ссоре с Сао-Сао. Даже иногда встречаемся."
61040-81 = "И, возможно, это немного самонадеянно, но мне кажется, её путешествию в поисках себя пора подойти к концу."
61040-82 = "[s] «А её мнение вообще учитывается?»"
61040-83 = "Фу-фу."
61040-84 = "Мисаки всегда делает такое печальное лицо, когда упоминают Саори."
61040-85 = "Но именно она чаще всех о ней и говорит."
61040-86 = "Правда, Саори может просто снова уйти от нас."
61040-87 = "Но для такого дела я хотела бы, чтобы мы собрались все вместе."
61040-88 = "[s] «Ацуко»."
61040-89 = "Хм?"
61040-90 = "[s] «Ты стала... очень хорошо просить об услугах!»"
61040-91 = "Это... плохо...?"
61040-92 = "Совсем нет? Думаете, если я «отточу этот навык, то расцвету по-настоящему»?"
61040-93 = "Что ж, спасибо, Сенсей."
61040-94 = "Постараюсь не злоупотреблять своей силой."
61040-95 = "В конце концов, беспомощные склонны вызывать раздражение."
61040-96 = "Но с Сао-Сао я могу рассчитывать на вашу помощь, да?"
61040-97 = "[s] «Я никогда не откажу в просьбе своим студентам!»"
61040-98 = "Да. Мир держится на принципе взаимного обмена."
61040-99 = "...Спасибо."
61040-100 = "Я рада, что вы у нас есть, Сенсей."
61040-104 = ""
61040-105 = ""
61040-106 = "...А?"
61040-107 = "Неужели..."
61040-108 = "...гигантский корабль?"
61040-109 = ""
61040-110 = "[ns] «...Похоже на то?»"
61040-111 = "Почему вы выглядите так, будто сами ничего не понимаете, Сенсей?! Что здесь происходит...?"
61040-112 = "Я однажды видела такое в журнале. Кажется, это называется «круизный лайнер»!"
61040-113 = "«Круизный лайнер»?"
61040-114 = "Д-Да... Эм..."
61040-115 = "Их строят не столько для того, чтобы добраться из точки А в точку Б, сколько ради роскоши и развлечений..."
61040-116 = "На борту бывают рестораны и даже аттракционы..."
61040-117 = "А ещё искусственные горячие источники и бассейны, так что во время путешествия можно делать кучу всего..."
61040-118 = "Я, конечно, знаю о них не всё, но говорят, цены на билеты выше самых смелых мечтаний таких простолюдинов, как мы..."
61040-119 = ""
61040-121 = ""
61040-122 = "Бассейн... на корабле... который сам находится на воде? Это... парадоксально сразу в нескольких смыслах."
61040-123 = "Но оставим это. Почему мы вообще здесь?"
61040-124 = "Сенсей! Это ваших рук дело. Объясняйтесь."
61040-125 = "[s] «Я-Я тоже не знаю! Мне сказали, что с нами встретится спонсор!»"
61040-126 = ""
61040-129 = "[ns] «Я оказался здесь ровно при тех же обстоятельствах, что и вы!»"
61040-130 = "Что? С-Спонсор?!"
61040-131 = "Я... знаю, что происходит. Я читала об этом в журнале..."
61040-132 = ""
61040-134 = ""
61040-135 = "Нас похитили для «Игры Осьминога», да?!"
61040-136 = "Нас заставят убивать друг друга... а последняя выжившая получит 4,5 миллиарда иен..."
61040-137 = "А всё это время богатые люди будут смотреть, как мы... убиваем друг друга! Ради развлечения! Нам... конец... полный конец... Простите, что вообще чего-то хотела! Простите, что существую!"
61040-138 = "Это правда, Сенсей?!"
61040-139 = "Все, пожалуйста, успокойтесь. Разве вы не доверяете Сенсею? И если рассуждать логически, Сенсей никогда бы в таком не участвовал, потому что дальше первого раунда всё равно не продержался бы."
61040-140 = "П-Правда? Всё так и есть?!"
61040-141 = ""
61040-143 = ""
61040-144 = ""
61040-146 = ""
61040-147 = "...?!"
61040-149 = "...?!"
61040-150 = "С-Саори?!"
61040-152 = "..."
61040-153 = "Ох ты."
61040-154 = "Так спонсор — ты, лидер?!"
61040-155 = "Н-Нет, я не. Я тоже просто..."
61040-156 = "Верно. Это было бы невозможно."
61040-157 = "...Совершенно невозможно, если подумать. Лидер на такое не способен."
61040-158 = "Ч-Что?! Ты права, но то, как ты это сказала, тоже неприятно."
61040-159 = "Ну, неважно, надолго ли ты здесь. Пока ты с нами, я возвращаю тебе должность лидера!"
61040-160 = "Давайте сначала хотя бы оценим ситуацию и поймём, что происходит!"
61040-162 = "УА-А-А! Н-Но, Саори, когда мы будем умирать, мы же умрём вместе, да? Да?!"
61040-163 = ""
61040-164 = "Начнём с того, почему ты попросил нас всех встретиться здесь, Сенсей."
61040-165 = "Когда всё неясно, лучше сначала перечислить факты."
61040-166 = "[s] «Итак, ситуация такая...»"
61040-167 = ""
61040-168 = "Понятно. Экзамен."
61040-169 = "..."
61040-170 = "Что ты хочешь, чтобы мы сделали, Сенсей?"
61040-171 = "И не хочу слышать никакого шума про «уважение к нашему выбору», ясно?"
61040-172 = "Разобраться с этим бардаком можно только полной откровенностью."
61040-173 = "[ns] «Хорошо, тогда...»"
61040-175 = "[ns] «Я хочу, чтобы вы тоже получили опыт сдачи экзамена»."
61040-176 = ""
61040-177 = ""
61040-178 = "..."
61040-179 = "..."
61040-181 = "Э-Эм...? Почему все внезапно так напряглись...?"
61040-182 = "Ну... У этой истории, наверное, много деталей..."
61040-183 = "...но я бы сначала хотела услышать твои причины."
61040-184 = "Хм... Значит, ты хочешь, чтобы мы почувствовали, что значит быть студентами?"
61040-185 = "Мы... и студенты, оставшиеся в Ариус?"
61040-186 = "«Студенты, оставшиеся в Ариус»? Что это значит, Сенсей?"
61040-188 = "Я рассказал им о встрече с переводными студентами в Тринити."
61040-189 = ""
61040-190 = "..."
61040-191 = "Переход наверняка дался им трудно."
61040-192 = "Как бы хорошо к ним ни относились, оказаться в новом мире страшно."
61040-193 = "Иногда тебе страшно по причинам, которые даже не можешь определить. А иногда привычные способы справляться с проблемами просто не работают."
61040-194 = "[s11] «...Да, это неплохо описывает, какими они были.»\n[s12] «Ты наверняка можешь их понять, Саори.»"
61040-197 = "...В конце концов, наши истории похожи."
61040-198 = "Сенсей, у меня вопрос."
61040-199 = "Я слышала, что учёба — неотъемлемая обязанность каждого студента."
61040-200 = "Но какова её цель?"
61040-201 = "...В каком-то смысле мы с этим сталкивались. Учёба, экзамены."
61040-202 = "Учебная программа в основном была посвящена различным способам убивать и калечить."
61040-203 = "Нас проверяли на готовность нажать на спусковой крючок в любой ситуации, не колеблясь."
61040-204 = "И-И-и..."
61040-205 = "Я-Я правда больше не хочу через такое проходить..."
61040-206 = "Я тоже, Хиёри. Никто из нас не хочет. Верно?"
61040-207 = "Но это всё равно не отвечает на вопрос. Зачем вообще кому-то из нас необходимо учиться?"
61040-208 = "Полагаю, можно сказать, что нужно хорошо учиться, получать высокие оценки и в будущем найти хорошую работу."
61040-209 = "А хорошую работу люди хотят получить, чтобы больше зарабатывать, верно?"
61040-210 = "Но к нам такая мотивация неприменима."
61040-211 = "Ты знала, Сенсей?"
61040-212 = "Если дело только в деньгах, мы можем более чем достаточно заработать благодаря тому, чему научились в Ариусе."
61040-213 = "[s] «Каким именно образом...?»"
61040-215 = "Н-Ну..."
61040-216 = "Не знаю, как люди узнали о нашем прошлом..."
61040-217 = "...но иногда нам поступают заказы на... ну... убийство людей."
61040-218 = "И-И мы всегда сразу отвечаем «нет» и прогоняем их!"
61040-219 = "Выражение «сломать нимб» гораздо чаще используется в переносном смысле."
61040-220 = "Поэтому в Ариусе мы почти его не использовали."
61040-221 = "Оно всплывало только в разговорах о внешнем мире."
61040-222 = "Или иногда, когда мы общались с чужаками."
61040-223 = "Или... чтобы над чем-нибудь пошутить."
61040-225 = "Ага."
61040-226 = "В Ариусе у нас было куда более простое выражение."
61040-227 = ""
61040-229 = ""
61040-230 = "«Убить»."
61040-231 = "Нас удивило, что во внешнем мире люди употребляют его гораздо чаще, чем мы ожидали."
61040-232 = "Хотя... для них оно означало немного другое."
61040-233 = "О-Они говорили так в шутку... потому что сама мысль об этом казалась им невозможной..."
61040-234 = "Но не для нас. Для нас «убить» означало именно «убить». И всё."
61040-235 = "Пожалуй, тот Ариус, который мы знали... был ближе к смерти, чем любое другое место в Кивотосе."
61040-236 = "Поэтому, Сенсей. Скажите нам."
61040-237 = "Зачем студенту учиться?"
61040-238 = "Если ради хорошей работы или большего заработка, существуют и другие способы. Если мы готовы переступить черту, есть бесчисленное множество путей к той же цели."
61040-239 = ""
61040-240 = "[ns] «Потому что...»"
61040-243 = "[ns] «Обязанность студента — научиться противостоять этому миру.»"
61040-244 = ""
61040-245 = "Что...?"
61040-246 = "Я никогда не думала об этом с такой стороны."
61040-247 = "Объясните, пожалуйста, Сенсей."
61040-248 = "[s13] «Учёба — это процесс „познания того, чего я не знаю“.»\n[s14] «А весь мир — одно огромное „то, чего я не знаю“.»"
61040-251 = ""
61040-253 = ""
61040-254 = "Понимаю. Например, если не знать, как устроены договоры, легко стать жертвой обмана."
61040-255 = "...Как проницательно. Мне нечего возразить, Сенсей."
61040-256 = "Если бы я заранее всё как следует проверяла, вероятность остаться без оплаты снизилась бы, а может, и вовсе исчезла."
61040-257 = "Значит, вот как можно бороться с этим миром. С помощью знаний."
61040-258 = "Знаний о том, как сформировалось общество и как в нём действовать..."
61040-259 = "Они помогают понимать противоположные точки зрения. Как мы уже видели, иногда невозможно убедить человека смотреть на вещи так, как хочется тебе."
61040-260 = "...То есть, по-вашему, сначала нужно попытаться понять друг друга и найти компромисс?"
61040-261 = "Расширяя знания и понимание мира, мы можем замечать, оценивать и снижать угрозы со стороны других."
61040-262 = "Знание как оружие для самозащиты."
61040-263 = "Кажется, я начинаю понимать, к чему вы ведёте..."
61040-264 = "Тогда получается..."
61040-265 = "*вздыхает*"
61040-267 = "Н-Нам это понадобится... чтобы выжить здесь..."
61040-268 = "И студентам, оставшимся в Ариусе... это нужно больше всех..."
61040-269 = "[ns15] «Поэтому я решила сделать даже больше...»\n[ns16] «...и пригласила сегодня ещё одного студента.»"
61040-272 = "А?"
61040-273 = "Этот студент... и есть спонсор нашей встречи?"
61040-274 = ""
61040-276 = ""
61040-277 = "А-а. Так вот что произошло, Сенсей."
61040-278 = "Вы... уверены?"
61040-279 = "Если вы это знали, стоило предупредить нас..."
61040-280 = "*вздыхает* Забудьте. Неважно."
61040-281 = "Так кто этот студент?"
61040-282 = "Надеюсь, вы все были в порядке, отряд Ариус."
61040-283 = ""
61040-285 = ""
61040-290 = ""
61040-291 = ""
61040-292 = ""
61040-293 = "Я Кирифуджи Нагиса, хозяйка Чаепития и спонсор этой встречи."
61040-294 = "Что...?!"
61040-295 = ""
61040-297 = ""
61040-298 = "Ох ты."
61040-300 = "Следующий Эпизод;Тайная вечеря(?)"
