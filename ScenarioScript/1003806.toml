[translation]
1003806-1 = "SRT, спуск!"
1003806-2 = ""
1003806-3 = ""
1003806-4 = "Вы уверены, Сенсей? Эта миссия опасная."
1003806-5 = "Вы переживаете, что мы снова ворвёмся не в то здание?"
1003806-6 = "В-В том отчёте не хватало множества подробностей..."
1003806-7 = "И вообще, у вас были странные книги!"
1003806-8 = "Но если серьёзно, вы точно справитесь?"
1003806-9 = "[s] «Со мной всё будет хорошо, ведь ты рядом, Мияко.»"
1003806-10 = "Со мной..."
1003806-11 = "Верно. Моей задачей будет обеспечить вашу безопасность."
1003806-12 = "Тогда начнём?"
1003806-15 = "― Как красиво...[wa:40]"
1003806-18 = "― Ночной вид просто прекрасен."
1003806-20 = "― Я чуть не забыла, что мы на задании.[wa:180]"
1003806-23 = "― Хи-хи,[wa:40]"
1003806-25 = "― нельзя терять бдительность во время миссии.[wa:460]"
1003806-28 = "― Ну, эм...[wa:60]"
1003806-30 = "― Это внезапно, но, Сенсей...[wa:260]"
1003806-33 = "― Эм... Спасибо вам за то, что...[wa:2560]"
1003806-35 = "― вы всегда были рядом.[wa:10]"
1003806-38 = "― Если бы не вы...[wa:420]"
1003806-41 = "― я... и остальные из отряда RABBIT...[wa:10]"
1003806-43 = "― никогда бы не зашли так далеко.[wa:820]"
1003806-46 = "― Поэтому, если вы не против, и дальше... пожалуйста...[wa:1420]"
1003806-49 = "― А? Сообщение...[wa:1280]"
1003806-51 = "― Поняла. Пятьсот метров до цели...[wa:540]"
1003806-54 = "― Да, сигнал к началу штурма получен.[wa:1530]"
1003806-56 = "― Сенсей, пожалуйста, наденьте спусковое кольцо и страховочную систему.[wa:280]"
1003806-59 = "― А? Вы не знаете как?[wa:2600]"
1003806-61 = "― П-Понятно...[wa:820]"
1003806-64 = "― Ничего страшного. Тогда, пожалуйста, подождите здесь.[wa:2540]"
1003806-66 = "― Я быстро закончу и вернусь к вам.[wa:10]"
1003806-69 = "― А когда вернусь..."
1003806-71 = "― давайте посмотрим на этот вид вместе.[wa:10]"
1003806-74 = "Мияко выглядела очень круто, спускаясь по стене здания."
1003806-75 = ""
1003806-78 = "После того как Мияко успешно завершила миссию, мы вернулись в Шале."
