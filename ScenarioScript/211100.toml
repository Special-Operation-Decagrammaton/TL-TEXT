[translation]
211100-1 = "Эпизод 10;Переговоры...?"
211100-2 = "Лига наследия Геенны"
211100-3 = ""
211100-4 = "Следующий вопрос на повестке..."
211100-5 = "Уверена, все помнят, как прошли наши переговоры с Обществом гурманов."
211100-6 = ""
211100-8 = ""
211100-10 = ""
211100-11 = "А, точно... Они вообще не хотели сотрудничать."
211100-12 = "Договориться с ними было невозможно."
211100-14 = "Именно. И они продолжат оставаться источником непредсказуемости в Геенне... если мы не придумаем другой подход."
211100-15 = "И ещё..."
211100-16 = ""
211100-19 = ""
211100-21 = "Есть ещё один нежелательный фактор, который нам предстоит устранить."
211100-22 = ""
211100-25 = ""
211100-26 = "А, кажется, я знаю...!"
211100-27 = "О, я знаю! Отдел горячих источников!"
211100-28 = ""
211100-30 = ""
211100-31 = "А! Опередила! Я как раз хотела это сказать."
211100-33 = "Как бы то ни было, вы обе правы. Отдел горячих источников — одна из двух крупнейших террористических организаций Геенны."
211100-34 = "Обе подрывают основы великой Геенны, которую мы стремимся построить, как в буквальном, так и в переносном смысле."
211100-36 = "Но что мы можем сделать? Мне кажется, они ещё упрямее Общества гурманов."
211100-37 = "Шоуко, у тебя и для них есть план?"
211100-39 = "Отдел горячих источников славится сплочённостью и непоколебимым доверием участников друг к другу. Для организации это весьма похвальные качества."
211100-40 = "Но именно в этом... и скрывается их слабость."
211100-41 = ""
211100-44 = ""
211100-48 = "[ns] «Так вот зачем вы меня позвали»."
211100-49 = "Хорошо, Сенсей."
211100-50 = "Мы пришли к выводу, что без вашего присутствия убедить Отдел горячих источников не получится."
211100-51 = "[s1] «Не уверен, что у меня получится...»\n[s2] «Но давайте попробуем?»"
211100-54 = "Да. Мне сообщили, что Отдел горячих источников недавно закончил проект в этом районе."
211100-63 = ""
211100-66 = "А? Источник ещё даже не открылся! Неужели уже кто-то пришёл?"
211100-67 = ""
211100-70 = ""
211100-72 = ""
211100-73 = "А, Сенсей?"
211100-74 = "Ничего себе! Как вы узнали, что я здесь? Вас привлёк сладковатый серный аромат горячего источника?"
211100-75 = "[s3] «Привет, Мегу».\n[s4] «Ты сегодня работаешь одна?»"
211100-78 = "Ага! Мы уже всё закончили, так что я отпустила остальных отдыхать!"
211100-79 = "А! А председатель Касуми сейчас трудится на другом участке!"
211100-80 = "Да, как мы и предполагали."
211100-81 = "А это кто с вами? Приветики! Я Мегу из Отдела горячих источников, у нас я..."
211100-82 = "...капитан и бывший председатель."
211100-83 = "Ого... Вы и это знали?"
211100-84 = "Рада познакомиться, капитан Мегу. Я Игараши Шоуко, секретарь Лиги наследия Геенны."
211100-85 = "Взаимно, Шоуко!"
211100-86 = "Да. Давайте перейдём к делу."
211100-87 = ""
211100-89 = ""
211100-91 = "Мы с Сенсеем пришли передать Отделу горячих источников совершенно особенный подарок."
211100-92 = ""
211100-94 = ""
211100-95 = "Правда? А какой?"
211100-96 = ""
211100-98 = ""
211100-99 = "Подробную карту геотермического градиента, составленную на основе сопоставления данных о движениях земной коры из геологических архивов Геенны и Шале. На ней отмечены крупнейшие и наиболее активные геотермальные жилы: четырнадцать основных участков и пятьдесят шесть перспективных точек."
211100-100 = "Эм... Что вы сказали...? Кажется, я не всё поняла..."
211100-101 = "Проще говоря, это карта сокровищ с местами, где можно обустроить горячие источники."
211100-102 = ""
211100-104 = ""
211100-109 = ""
211100-110 = "На этой карте отмечены все перспективные геотермальные жилы в районе Геенны."
211100-111 = "Естественно, все отмеченные точки тщательно проверены. Мы выбрали только те, что не затрагивают электросети академии, водопровод и канализацию."
211100-112 = "Поэтому все жилы на карте сосредоточены на окраинах города. Строительство крупного комплекса горячих источников напрямую увеличит доходы района Геенны."
211100-113 = "[s] «Так вот зачем ты просила у меня эти данные»."
211100-114 = "Да. Лучше было бы собрать больше сведений, но пока этого достаточно, чтобы держать Отдел горячих источников под контролем."
211100-115 = "Эту карту НЕОБХОДИМО передать именно Шимокуре Мегу."
211100-116 = ""
211100-119 = "Понимаю, это может показаться странным. Всё-таки председатель Отдела горячих источников — Кинугава Касуми."
211100-120 = "Но она ни за что не поступит так, как мне нужно, даже в вашем присутствии, Сенсей."
211100-121 = "Если бы речь шла о вашей... личной просьбе, реакция могла бы быть другой. Но здесь совершенно иное дело."
211100-122 = "Поэтому мы должны передать карту непосредственно Мегу."
211100-123 = "Потому что Кинугава Касуми действует в соответствии с желаниями Шимокуры Мегу."
211100-124 = "Точнее, она занимает пост председателя Отдела горячих источников только по просьбе Мегу."
211100-125 = "[s] «...Как ты об этом узнала?»"
211100-126 = "Если проявить упорство и чётко знать свою цель, можно узнать очень многое."
211100-127 = "Но мы отвлеклись. Главное — поймать момент, когда Шимокура Мегу будет одна."
211100-130 = "Это точно! С такими данными мы построим кучу потрясающих горячих источников!"
211100-131 = "Разумеется. Мы специально отобрали эти места. Если строить здесь, Префектура не будет вам мешать."
211100-132 = "Здорово! Председатель Касуми о-очень боится главу Префектуры!"
211100-133 = "А! Но знаете что? Мне сначала надо показать карту ей."
211100-134 = "Ведь всем у нас заправляет председатель Касуми. Без неё мы ничего не делаем..."
211100-135 = "Нет."
211100-136 = "Ч-что?"
211100-137 = ""
211100-139 = ""
211100-141 = "Важно лишь то, чего хочешь ты сама. Спроси себя: «Хочу ли я, Шимокура Мегу, этим заниматься... или нет?»"
211100-142 = "П-Правда?"
211100-143 = "Да. Ведь именно ты лучше всех понимаешь, что важно для Отдела горячих источников, верно?"
211100-144 = "Сенсей, не поделитесь своими мудрыми мыслями? Ведь Мегу доверяет вам всем сердцем, всей своей душой..."
211100-145 = "Э-э...?"
211100-147 = "У меня с самого начала было дурное предчувствие..."
211100-148 = "Но... я рассудил, что, если ограничить деятельность Отдела горячих источников определёнными участками, удастся избежать многих разрушений и неприятностей."
211100-149 = ""
211100-150 = "[ns] «...Мегу, тебе ведь нравится обустраивать горячие источники?»"
211100-151 = ""
211100-153 = ""
211100-154 = "Ага! Очень! Даже больше, чем рамен... Да что уж там! Ради горячего источника я готова отказаться от рамена!"
211100-155 = "[s5] «Тогда почему бы тебе не попробовать копать в отмеченных местах?»\n[s6] «Шоуко говорит, что там должны получиться источники высшего качества»."
211100-158 = "Хи-хи! Раз уж вы за них ручаетесь, Сенсей, значит, так оно и есть!"
211100-159 = "Ладненько! Тогда скажу председателю Касуми, что нам стоит попробовать копать в этих местах."
211100-160 = "Разрабатывать источники разрешается только в местах, отмеченных на карте."
211100-161 = ""
211100-163 = ""
211100-164 = "А... Вот как это работает?"
211100-165 = "Да. Мы передаём вам карту при условии, что вы прекратите разработку горячих источников за пределами указанных зон."
211100-166 = "Ну, так и быть! Тут столько отмеченных мест, что работы нам надолго хватит. Всё поняла, ясно как день!"
211100-167 = "Благодарю за понимание. Пожалуйста, передайте это председателю Касуми."
211100-168 = "Хи-хи, это ВАМ спасибо! Шоуко, ты настоящий друг! Мы только познакомились, а ты уже подарила мне целую карту сокровищ!"
211100-169 = "..."
211100-170 = "Сейчас же найду председателя Касуми! Уверена, ей тоже понравится!"
211100-171 = "Пока-пока! Ещё увидимся! И с вами тоже, Сенсей!"
211100-172 = ""
211100-174 = ""
211100-175 = "Удивительно просто."
211100-176 = "Реакция председателя по-прежнему остаётся неизвестной. Но в конечном счёте она не пойдёт против своей закадычной подруги."
211100-177 = "Как я уже говорила, Кинугава Касуми всегда ставит желания Шимокуры Мегу на первое место."
211100-178 = ""
211100-180 = ""
211100-181 = "Кажется, вы не слишком довольны, Сенсей."
211100-182 = "[s] «Почему-то мне не по себе...»"
211100-183 = "..."
211100-184 = "Мы ей не солгали. И не обманули её."
211100-185 = "Мы лишь предоставили определённому человеку тщательно отобранные сведения."
211100-186 = "Если всё пойдёт по плану, ни одна из сторон ничего не потеряет."
211100-187 = "Отдел горячих источников с удовольствием займётся обустройством удачных источников, а Геенна только выиграет от того, что один из самых беспокойных её элементов окажется под контролем и принесёт пользу."
211100-188 = "...Не поймите меня неправильно, Сенсей. Я вовсе не стремлюсь лишить кого-либо из студентов свободы."
211100-191 = "Разумеется, вас это удивляет. И это вполне естественно."
211100-192 = "Желание в кого-нибудь выстрелить, что-нибудь съесть... Всё это лишь необузданные порывы. Не свобода."
211100-193 = "Мы просто не можем позволить студентам Геенны стать рабами собственных низменных инстинктов и желаний."
211100-196 = "А я убеждена, что общественное благо куда важнее личной свободы. Ведь лишь в коллективе свобода обретает своё истинное воплощение."
211100-197 = "[s] «Не все с этим согласятся»."
211100-198 = "Верно. Вполне возможно. Я это прекрасно понимаю."
211100-201 = "Мы с Шоуко спустились с горы."
211100-206 = ""
211100-208 = "Вахахаха! Я так и знала, что вы пойдёте этим путём!"
211100-209 = "[ns] «Этот голос...!»"
211100-210 = ""
211100-213 = ""
211100-214 = "Стойте! Услышала новости и помчалась сюда со всех ног."
211100-215 = ""
211100-217 = ""
211100-219 = "Председатель Отдела горячих источников, Кинугава Касуми."
211100-220 = "Ага, та самая «Касуми», которую вы старательно обходили стороной. Та, от которой так усердно всё скрывали."
211100-221 = "Хех..."
211100-222 = "Хотите, представлюсь?"
211100-223 = "Боже мой, конечно! Давненько никто не вызывал у меня такого глубокого раздражения. Как тут не полюбопытствовать?"
211100-224 = "Я Игараши Шоуко, секретарь Комитета по восстановлению Геенны."
211100-225 = "Понятно. Так ВОТ как тебя зовут... Хм... М-м-м..."
211100-226 = "..."
211100-227 = "А, совсем задумалась и забыла о вежливости! Здравствуйте, Сенсей!"
211100-228 = "[s] «Привет, Касуми...»"
211100-229 = "Да не надо так виновато смотреть! Ха-ха! Вы слишком уступчивы, Сенсей."
211100-230 = "Не переживайте. Я уже давно догадалась, что всю эту затею устроила «Шокирующая» или как её там."
211100-231 = "Игараши Шоуко."
211100-232 = "Точно, «Инаризуши Шокко»! Или «Шакле»? Когда-нибудь запомню. А может, и нет!"
211100-233 = "Значит, ты специально подошла к капитану Мегу и подсунула ей эту карту. А она приняла её за подарок!"
211100-234 = "Но если приглядеться, карта какая-то уж больно искажённая. Ты в курсе?"
211100-235 = "..."
211100-236 = "Пахнет тем, что ты хочешь нами командовать. «Порядок и дисциплина» и всё такое?"
211100-237 = "«Стоять! Непослушные студенты! Любите горячие источники? Вон туда! Апорт!» Примерно так ты собиралась дрессировать своих будущих рабочих собачек?"
211100-238 = "А? Ты решила не усложнять, и я прекрасно тебя поняла. Тут-то мне и захотелось ЛИЧНО с тобой познакомиться."
211100-239 = "И?"
211100-240 = "..."
211100-241 = "А?"
211100-242 = "Так ты отказываешься от предложения?"
211100-243 = "..."
211100-244 = "Ха-ха! Не верю! Давненько я не чувствовала такого... возбуждения!"
211100-245 = "Разумеется, я соглашусь! Перекопаю все места, отмеченные на карте. И знаешь почему?"
211100-246 = "Потому что так захотела Шимокура Мегу."
211100-247 = "Хе-хе... Ага."
211100-248 = "НА ЭТОТ РАЗ я подыграю тебе. Всё, как ты задумала, по твоему хитроумному плану, да?"
211100-249 = ""
211100-251 = ""
211100-252 = ""
211100-254 = "Но запомни одно."
211100-255 = "«Следующего раза» для тебя не будет. Усекла?"
211100-256 = "Меня это устраивает. Если только ты не хочешь немедленно вернуться «туда»."
211100-257 = "...Что?"
211100-258 = ""
211100-260 = ""
211100-262 = ""
211100-263 = "Я сказала то, что сказала."
211100-264 = "[s] («Туда...?»)"
211100-265 = "...Ха-ха. Не пытайся блефовать с опытным игроком, малышка."
211100-266 = "Ты явно не «из наших». С такими разговорами долго не протянешь."
211100-267 = "Ну что ж, раз мы закончили..."
211100-268 = "Береги себя, Касуми."
211100-269 = ""
211100-271 = ""
211100-272 = "..."
211100-273 = "Ха-ха, ахахаха! А ты забавная. Кажется, ты мне нравишься."
211100-274 = "До скорого, сестрёнка! А? Слышишь? Мы ещё ОЧЕНЬ СКОРО встретимся!"
211100-275 = "Ха-ха! И с вами тоже, Сенсей!"
211100-276 = "[s] «Касуми...»"
211100-277 = ""
211100-279 = ""
211100-280 = ""
211100-283 = "Фух..."
211100-284 = "Значит, не зря мы сперва обратились к Шимокуре Мегу."
211100-285 = "Вот и устранён наш главный источник неопределённости. По крайней мере, пока."
211100-286 = "Главное, что теперь мы стали ещё на шаг ближе к великой Геенне."
211100-287 = "Скоро вся Геенна объединится вокруг общей цели и общих ценностей."
211100-288 = "[s] «...»"
211100-289 = "..."
211100-290 = "Сенсей..."
211100-291 = "Вам не нравится мой подход?"
211100-292 = ""
211100-295 = "[ns7] «Не знаю, что правильно, а что нет...»\n[ns8] «Но надеюсь, ты не будешь сама себя ограничивать»."
211100-296 = ""
211100-297 = ""
211100-299 = ""
211100-300 = "«Ограничивать себя»? Неужели я произвожу такое впечатление?"
211100-301 = "[s9] «Будто других вариантов просто не существует».\n[s10] «Такая непреклонность может тебя измотать»."
211100-302 = ""
211100-303 = ""
211100-305 = ""
211100-306 = "..."
211100-307 = "..."
211100-308 = ""
211100-310 = ""
211100-311 = "[ns] «Шоуко?»"
211100-312 = ""
211100-319 = ""
211100-320 = "Я догнал Шоуко, которая стремительно удалялась прочь."
211100-321 = "...Не ожидала. Подумать только, именно такой я... такой я вам показалась."
211100-322 = "Разве я не выглядела сверхчеловеком, который неуклонно движется вперёд, не ведая сомнений?"
211100-323 = "[s] «Эм... Ты выглядела немного пугающе»."
211100-324 = "Неужели...?"
211100-325 = "[s] «Шоуко, неужели ты хочешь стать именно такой?»"
211100-326 = "Наверное, я хочу достичь истинного величия... или хотя бы увидеть того, кто его достиг..."
211100-327 = "Сенсей, вы встречали таких людей? Тех, кто действует без колебаний и идёт вперёд, ни на мгновение не сомневаясь?"
211100-328 = ""
211100-330 = ""
211100-331 = "Вы встречали многих, кто «хотел стать таким»?"
211100-332 = "Даже выдающийся человек «неизбежно впадёт в самодовольство, если перестанет сомневаться в себе»...?"
211100-333 = "..."
211100-334 = "Возможно. Возможно, где-то... есть такой человек."
211100-335 = ""
211100-337 = ""
211100-338 = ""
211100-339 = "Или когда-то был."
211100-341 = "Остаток пути мы с Шоуко прошли молча."
211100-343 = "Следующий эпизод;Непривычное спокойствие"
