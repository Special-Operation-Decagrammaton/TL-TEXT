#[!][Build: "1"]
#[!][Data: "20/09"]
[translation]
211100-1 = "Episódio 10;Negociações......?"
211100-2 = "Comitê de Restauração de Gehenna"
211100-3 = ""
211100-4 = "Passemos, portanto, à próxima pauta deliberativa."
211100-5 = "Todas recordam-se do episódio recente com o Clube de Pesquisa Gourmet, decerto."
211100-6 = ""
211100-8 = ""
211100-10 = ""
211100-11 = "S-Sim... ficou claríssimo que controlar aquelas loucas é missão impossível."
211100-12 = "Parece que a gente fala línguas de planetas diferentes."
211100-14 = "A menos que tracemos um plano alternativo, elas persistirão como uma variável instável em nossos cálculos."
211100-15 = "E resta ainda――"
211100-16 = ""
211100-19 = ""
211100-21 = "Outra variável caótica de igual periculosidade em Gehenna."
211100-22 = ""
211100-25 = ""
211100-26 = "Ah, já até sei de quem você tá falando...!"
211100-27 = "O DEPARTAMENTO DE DESENVOLVIMENTO DE FONTES TERMAIS!!"
211100-28 = ""
211100-30 = ""
211100-31 = "Poxa, você roubou a minha resposta na lata!"
211100-33 = "Precisamente. Uma corporação rotulada, a par com o Clube Gourmet, como uma das 'Duas Grandes Facções Terroristas' da academia."
211100-34 = "Ou seja: uma força capaz de dinamitar os alicerces da 'Grande Gehenna' que pretendemos erguer."
211100-36 = "Pelo visto aquelas lá são ainda mais tapadas pra conversar do que o Clube Gourmet..."
211100-37 = "Você tem alguma estratégia na manga?"
211100-39 = "O plano já foi devidamente articulado.#nA maior fortaleza do Departamento de Fontes Termais repousa na coesão inquebrantável entre seus membros."
211100-40 = "E, simultaneamente, essa lealdade desmedida constitui seu calcanhar de Aquiles."
211100-41 = ""
211100-44 = ""
211100-48 = "[ns] \"Então foi por isso que me chamaram.\""
211100-49 = "Exatamente."
211100-50 = "Julgamos que a cooperação direta do Sensei é elemento indispensável para persuadir a corporação termal."
211100-51 = "[s1] \"Não tenho tanta certeza assim, mas...\"\n[s2] \"Vamos lá ver no que dá.\""
211100-54 = "Consta que logo adiante há uma terma recém-construída por elas."
211100-63 = ""
211100-66 = "Ué? Clientes por aqui?#nFoi mal, pessoal, ainda não inaugurou e――"
211100-67 = ""
211100-70 = ""
211100-72 = ""
211100-73 = "Peraí... Sensei?!"
211100-74 = "Como você descobriu este esconderijo?!#nAh! Já sei! Sentiu o cheirinho gostoso da água termal no ar, né?!"
211100-75 = "[s3] \"Pode-se dizer que sim...\"\n[s4] \"Você está sozinha hoje, Megu?\""
211100-78 = "Aham! As escavações acabaram, então a peãozada ganhou folga!"
211100-79 = "A Diretora Kasumi tá inspecionando outra obra hoje!"
211100-80 = "...Exatamente conforme os prognósticos."
211100-81 = "Ué, e quem é essa garota aí?#nEu sou a Megu! A líder de obras do――"
211100-82 = "Líder de obras operacionais e ex-diretora executiva do Departamento de Fontes Termais."
211100-83 = "Uau, como é que você sabe disso tudo?!"
211100-84 = "É uma honra conhecê-la, líder Megu. Sou [ruby=Igarashi]Shoko Igarashi[/ruby], secretária do Comitê de Restauração de Gehenna."
211100-85 = "Prazerzão!"
211100-86 = "Sem mais delongas, passemos ao cerne da nossa visita."
211100-87 = ""
211100-89 = ""
211100-91 = "Viemos até as suas instalações para entregar-lhe um presente de inestimável valia."
211100-92 = ""
211100-94 = ""
211100-95 = "Eba! Que tipo de presente?!"
211100-96 = ""
211100-98 = ""
211100-99 = "Trata-se do mapeamento geotérmico integral de toda a extensão de Gehenna.#nEstão catalogadas quatorze veias magmáticas ativas de escala massiva,#ne cinquenta e seis pontos menores de altíssimo potencial hidrotermal."
211100-100 = "Huuuuum...? Eu não entendo essas palavras difíceis não..."
211100-101 = "Em termos práticos: é o 'mapa do tesouro' que aponta onde cavar para brotar água termal pura e cristalina."
211100-102 = ""
211100-104 = ""
211100-109 = ""
211100-110 = "Neste mapa constam coordenadas geológicas com elevadíssima probabilidade de afloramento hidrotermal."
211100-111 = "Todavia, o documento abrange uma fração restrita do território.#nFiltrei estritamente coordenadas desprovidas de redes elétricas e encanamentos subterrâneos."
211100-112 = "Por conseguinte, a distribuição geográfica concentra-se nos ermos periféricos do distrito.#nErguer complexos termais nessas zonas desérticas gerará receita substancial aos cofres de Gehenna."
211100-113 = "[s] \"Então era para isso que você queria aqueles dados topográficos...\""
211100-114 = "Exato. Um volume de dados mais abrangente seria o ideal técnico, mas para domesticar a fúria do Departamento de Fontes Termais,#nesta amostragem é mais que suficiente."
211100-115 = "Contudo, há uma diretriz mandatória:#neste mapa deve ser entregue, impreterivelmente, em mãos a [ruby=Shimokura]Megu Shimokura[/ruby]."
211100-116 = ""
211100-119 = "A hesitação do Sensei é plenamente plausível.#n'Por que contornar a diretora titular, [ruby=Kinugawa]Kasumi Kinugawa[/ruby]?'"
211100-120 = "A resposta é categórica: Kasumi jamais agirá sob a tutela de outrem.#nMesmo com a augusta presença do Sensei, ela não cederia um milímetro."
211100-121 = "Salvo em pedidos puramente pessoais do Sensei, ela decifraria a manobra em segundos."
211100-122 = "Logo, nossa chave mestra é Megu Shimokura."
211100-123 = "Pois a temível Kasumi Kinugawa submete-se incondicionalmente à 'vontade' de Megu Shimokura."
211100-124 = "Mais precisamente: ela empunha o título de diretora única e exclusivamente para materializar os sonhos de Megu."
211100-125 = "[s] \"...Como você conseguiu descobrir algo tão íntimo?\""
211100-126 = "Quando se possui clareza de propósito e tenacidade investigativa, as verdades mais ocultas emergem à tona."
211100-127 = "Entretanto, divaguei.#nEm suma: necessitamos de uma conjuntura onde Megu Shimokura esteja desacompanhada."
211100-130 = "Quer dizer que com isso aqui a gente pode cavar fonte termal o quanto quiser?!"
211100-131 = "Com toda certeza. Ademais, são pontos rigorosamente selecionados.#nNão haverá qualquer risco de o Comitê de Disciplina persegui-las com artilharia pesada."
211100-132 = "SÉRIO?! A Diretora Kasumi morre de pavor da Presidente do Comitê de Disciplina, ela vai pular de alegria!"
211100-133 = "Ah! Mas preciso consultar a Diretora Kasumi primeiro."
211100-134 = "O departamento inteiro só marcha conforme o plano mestre dela!"
211100-135 = "Engana-se."
211100-136 = "Hã?"
211100-137 = ""
211100-139 = ""
211100-141 = "O vetor determinante reside na sua vontade. Se Megu Shimokura deseja ou não escavar essas fontes termais."
211100-142 = "É assim que funciona...?"
211100-143 = "Sim. Pois dentro do Departamento de Fontes Termais, sua realização pessoal é a prioridade suprema."
211100-144 = "Sensei, poderia corroborar?#nA chancela do senhor tranquilizará o coração da líder Megu."
211100-145 = "Hum..."
211100-147 = "(Uma ponta de incômodo e culpa aperta o meu peito, mas...)"
211100-148 = "(Se elas escavarem somente os locais deste mapa, o rastro de destruição na cidade será evitado)"
211100-149 = ""
211100-150 = "[ns] \"...Megu, você ama escavar fontes termais, não ama?\""
211100-151 = ""
211100-153 = ""
211100-154 = "Amo! Amo demais! Tanto quanto ramen... não, amo tanto que aguento até ficar sem comer ramen!"
211100-155 = "[s5] \"Então os pontos deste mapa são perfeitos para você.\"\n[s6] \"A qualidade da água mineral é superior a qualquer outra.\""
211100-158 = "Ehehe! Se o Sensei tá dizendo, então é certeza absoluta!"
211100-159 = "Fechado! Vou correndo falar com a Diretora Kasumi!"
211100-160 = "Sob uma condição inegociável: escavem [ruby=apenas]rigorosamente as coordenadas[/ruby] deste mapa."
211100-161 = ""
211100-163 = ""
211100-164 = "Ué? Essa é a regra do trato?"
211100-165 = "Nenhum outro perímetro urbano poderá ser violado. É o pré-requisito para a cessão definitiva do documento."
211100-166 = "Entendi... tá bom... eu repasso a condição pra Diretora Kasumi também!"
211100-167 = "Agradeço. Repasse exatamente nestes termos."
211100-168 = "Muito obrigada por esse mapa incrível! Você é um amor de pessoa, Shoko!"
211100-169 = "......"
211100-170 = "Vou voando contar pra Diretora Kasumi!#nEla vai pirar de felicidade!"
211100-171 = "Tchauzinhooo!"
211100-172 = ""
211100-174 = ""
211100-175 = "...Mais simples do que o previsto."
211100-176 = "A reação de Kasumi Kinugawa permanece incerta, mas no fim ela aquiescerá."
211100-177 = "Seu motor existencial é a felicidade de Megu Shimokura."
211100-178 = ""
211100-180 = ""
211100-181 = "...Sensei. Seu semblante carrega pesadas sombras."
211100-182 = "[s] \"É que... sinto uma pontada de culpa.\""
211100-183 = "......"
211100-184 = "Não proferimos mentiras. Muito menos arquitetamos fraude dolosa."
211100-185 = "Apenas canalizamos informações selecionadas para a destinatária precisa."
211100-186 = "Prosseguindo desta maneira, ninguém amargará prejuízos."
211100-187 = "O departamento conquistará termas exuberantes; Gehenna conterá uma força destrutiva;#ne de quebra, teremos operárias de elite executando obras onde a infraestrutura escolar necessita."
211100-188 = "...Parece haver um equívoco: eu não abomino a liberdade individual."
211100-191 = "Sim, compreendo que estranhe minha assertiva.#nAparenta colidir com os dogmas do nosso comitê."
211100-192 = "A divergência reside na semântica da 'Liberdade'.#n'Quero atirar', 'quero comer'. Isso não é liberdade; são meros impulsos instintivos."
211100-193 = "Até o presente momento, o corpo discente de Gehenna foi escravo de apetites viscerais.#nMas doravante a dinâmica mudará."
211100-196 = "Concebo que a 'participação na comunidade' figura em patamar hierárquico superior à volição individual. Pois a genuína liberdade só se consuma no interior do coletivo unificado."
211100-197 = "[s] \"A forma de pensar não varia de pessoa para pessoa?\""
211100-198 = "Certamente. Estou ciente da pluralidade hermenêutica."
211100-201 = "(Desci a colina acompanhado por Shoko)"
211100-206 = ""
211100-208 = "MWAHAHAHAHAHA! Não falha uma! Eu sabia com certeza absoluta que passariam por esta trilha!"
211100-209 = "[ns] \"Essa risada...!!\""
211100-210 = ""
211100-213 = ""
211100-214 = "Pois é, ouvi todo o relato da boca da Megu agorinha.#nFiquei com tanta coceira nas mãos que vim em disparada conferir de perto!"
211100-215 = ""
211100-217 = ""
211100-219 = "Kasumi Kinugawa."
211100-220 = "Deixar a líder máxima de fora da rodinha de conversa... Que atitude mais traiçoeira e deselegante, não acha?!"
211100-221 = "Humph..."
211100-222 = "Permite que me apresente formalmente?"
211100-223 = "Mas com todo prazer! Fazia uma eternidade que ninguém me provocava uma sensação tão picante na espinha.#nComo eu não iria querer saber o nome da figurinha?!"
211100-224 = "Sou [ruby=Igarashi]Shoko Igarashi[/ruby], secretária do Comitê de Restauração de Gehenna."
211100-225 = "Ora, ora, veja só... Que gracinha, hum?"
211100-226 = "......"
211100-227 = "Opa, que indelicadeza a minha! Quase me esqueci de saudar a ilustre companhia.#nOlá, Sensei! Continua com a saúde nos trinques?"
211100-228 = "[s] \"Graças a vocês...\""
211100-229 = "Ah, não faça essa cara de velório compadecido, Sensei.#nVocê continua o mesmo coração mole de sempre, que fofura."
211100-230 = "Não se aflija: já desvendei a tramóia mirabolante da garotinha do [ruby=shoyu]molho shoyu[/ruby] aí."
211100-231 = "Meu nome é Shoko Igarashi."
211100-232 = "Perdoe-me, memória fraca para nomes miúdos. Era Shock-chan, não era?#nQuem sabe um dia eu decore o seu nome... Mas será que esse dia vai chegar, hein?!"
211100-233 = "Enfim, encerremos as amenidades diplomáticas. Você sabe muito bem o motivo da minha vinda.#nDar um 'presentinho' desses pelas costas diretamente pra Líder Megu..."
211100-234 = "Mas esse seu mapinha me pareceu descaradamente enviesado, sabia?"
211100-235 = "......"
211100-236 = "Dá pra sentir de longe o cheiro azedo de 'controle institucional' escorrendo por cada linha traçada nele.#nQuerem que a gente banque os cachorrinhos amestrados, latindo e cavando onde vocês mandam?"
211100-237 = ""
211100-238 = "Receber uma cartinha de fã com tanta paixão assim... Seria desfeita minha não vir dar as caras pessoalmente."
211100-239 = "E qual é o seu veredito?"
211100-240 = "......"
211100-241 = "Hein?"
211100-242 = "Está sugerindo que declinará da proposta?"
211100-243 = "......"
211100-244 = "MWAHAHAHAHA! Que delícia! Que espetáculo magnífico!"
211100-245 = "É evidente que eu aceito! Vou perfurar cada um dos pontos demarcados neste mapa!#n...Sabe por qual razão?"
211100-246 = "Porque é a vontade de Megu Shimokura."
211100-247 = "...Exatamente isso."
211100-248 = "Desta vez, dançarei conforme a sua música."
211100-249 = ""
211100-251 = ""
211100-252 = ""
211100-254 = "Mas guarde bem estas palavras no fundo do seu peito:#nNÃO HAVERÁ UMA SEGUNDA VEZ."
211100-255 = ""
211100-256 = "Não vejo inconveniente. Se cruzar os limites acordados, providenciaremos seu regresso para 'aquele lugar'."
211100-257 = "...Como?!"
211100-258 = ""
211100-260 = ""
211100-262 = ""
211100-263 = "O sentido é estritamente literal."
211100-264 = "[s] (Aquele lugar...?)"
211100-265 = "Hum... Blefe barato e sem substância para o meu gosto."
211100-266 = "Pelo menos ficou claro que você não é 'do nosso lado'.#nAfinal de contas, quem usava esse linguajar no passado acabou apodrecendo pelo caminho."
211100-267 = "Se as deliberações foram concluídas――"
211100-268 = "Desejo-lhe um retorno seguro à sua sede."
211100-269 = ""
211100-271 = ""
211100-272 = "......"
211100-273 = "Mwahahaha! Gostei de você! Tem tutano!"
211100-274 = "Nos veremos de novo em breve... E pode ter certeza absoluta disso!"
211100-275 = "Até mais, Sensei!"
211100-276 = "[s] \"Kasumi... se cuida...\""
211100-277 = ""
211100-279 = ""
211100-280 = ""
211100-283 = "Ufa..."
211100-284 = "Abordar Megu Shimokura revelou-se, de fato, a decisão estratégica correta."
211100-285 = "Com isso, neutralizamos uma das maiores variáveis entrópicas de Gehenna.#n...Ao menos temporariamente."
211100-286 = "Ainda assim, demos mais um passo colossal rumo à Grande Gehenna."
211100-287 = "A utopia onde todos contemplam o mesmo horizonte soberano.#nA Gehenna unificada por um único pulsar de lealdade não tardará a alvorecer."
211100-288 = "[s] \"......\""
211100-289 = "......"
211100-290 = "Sensei――"
211100-291 = "O senhor avalia que os meus métodos são errôneos?"
211100-292 = ""
211100-295 = "[ns7] \"Não sei definir com precisão o que é certo ou errado, mas...\"\n[ns8] \"Não gostaria de ver você se cobrando e se martirizando tanto assim.\""
211100-296 = ""
211100-297 = ""
211100-299 = ""
211100-300 = "Foi... essa a impressão que causei?"
211100-301 = "[s9] \"Viver sob o peso de 'ter que fazer' ou 'ser obrigada a vencer'...\"\n[s10] \"Acaba destruindo e desgastando a pessoa por dentro antes da hora.\""
211100-302 = ""
211100-303 = ""
211100-305 = ""
211100-306 = "......"
211100-307 = "............"
211100-308 = ""
211100-310 = ""
211100-311 = "[ns] \"Shoko...?\""
211100-312 = ""
211100-319 = ""
211100-320 = "(Apressei o passo para acompanhar Shoko, que se afastava rapidamente)"
211100-321 = "...Fiquei chocada. Jamais imaginei que aparentasse tal fraqueza."
211100-322 = "Julgava estar projetando a figura de uma líder exemplar, que avança movida por vontade diamantina."
211100-323 = "[s] \"Para mim... você parecia um pouco prestes a despencar no abismo.\""
211100-324 = "Compreendo..."
211100-325 = "[s] \"Shoko... você sempre quis se tornar uma pessoa assim?\""
211100-326 = "Querer me tornar... Talvez eu desejasse apenas vislumbrar uma pessoa assim com meus próprios olhos."
211100-327 = "Alguém que emite julgamentos sem hesitar e caminha sem a menor sombra de dúvida... O senhor porventura conhece alguém com tal têmpera?#n"
211100-328 = ""
211100-330 = ""
211100-331 = "...Conhece muitas pessoas que 'gostariam de ser assim', entendo."
211100-332 = "Mesmo a figura mais admirável, se recusar a questionar a si mesma, inevitavelmente decairá na tirania e na soberba...?"
211100-333 = "......"
211100-334 = "Quem sabe. Talvez em algum recanto remoto deste mundo realmente 'exista' alguém dessa estatura."
211100-335 = ""
211100-337 = ""
211100-338 = ""
211100-339 = "...Ou talvez tenha 'existido' no passado."
211100-341 = "(Não trocamos mais nenhuma palavra pelo restante do caminho de volta)"
211100-343 = "A Seguir;Uma Paz Desconhecida"