[translation]
211100-1 = "Episode 10;Negotiation...?"
211100-2 = "Gehenna Restoration Committee"
211100-4 = "Now, let's move on to the next agenda item."
211100-5 = "You remember the incident with the Gourmet Research Society, right?"
211100-11 = "Y-yeah... I'm convinced they're uncontrollable."
211100-12 = "It feels like you can't get through to them."
211100-14 = "Unless we take a different approach, they will continue to remain an uncertain variable."
211100-15 = "And—"
211100-21 = "There is one more uncertain variable in Gehenna."
211100-26 = "Oh, I might know who...!"
211100-27 = "The Hot Spring Development Department!!"
211100-31 = "Ah~! You beat me to it!"
211100-33 = "Correct. Along with the Gourmet Research Society, they are known as one of the 'two major terrorist organizations'."
211100-34 = "Which means they are a force that shakes the foundation of the 'Great Gehenna' we are trying to build."
211100-36 = "They seem even less likely to listen than the Gourmet Research Society, though..."
211100-37 = "Do you have a plan?"
211100-39 = "I have already thought of one. #nThe strength of the Hot Spring Development Department lies in the bond between its members."
211100-40 = "And at the same time, that is also their weakness."
211100-48 = "[ns] \"So that's why you called me.\""
211100-49 = "Yes."
211100-50 = "I determined that your cooperation, Sensei, is essential to persuade the Hot Spring Development Department."
211100-51 = "[s1] \"I'm not very confident, but...\"\n[s2] \"Let's just go and see.\""
211100-54 = "Apparently, there is a hot spring that was recently completed just ahead."
211100-66 = "Huh? Customers? #nSorry, we're not open yet—"
211100-73 = "Wait, Sensei?"
211100-74 = "How did you know we were here? #nOh! Did you sniff out the scent of the hot spring?"
211100-75 = "[s3] \"Something like that.\"\n[s4] \"Are you here alone today?\""
211100-78 = "Yeah! The work is all done, so the other members are off!"
211100-79 = "Oh, and Director Kasumi is at a different site!"
211100-80 = "…As expected."
211100-81 = "Huh? And who is that? #nI'm Meg! From the Hot Spring Development Department—"
211100-82 = "The work foreman, and former director, correct?"
211100-83 = "Whoa, how did you know that?"
211100-84 = "Nice to meet you, Foreman Meg. My name is Shoko Igarashi, secretary of the Gehenna Restoration Committee."
211100-85 = "Nice to meet you too!"
211100-86 = "Now, let's get to the point."
211100-91 = "We visited you today to deliver a special 'gift'."
211100-95 = "Wow! What kind of present!?"
211100-99 = "It is a geothermal gradient map of the entire Gehenna region. #nIt marks 14 large-scale and active geothermal veins in the Gehenna district, #nand 56 if you include the smaller ones."
211100-100 = "Hmm...? I don't really understand that kind of stuff..."
211100-101 = "Simply put, it's a 'treasure map' that shows where you can dig for hot springs."
211100-110 = "This map marks the geothermal veins where hot springs are likely to spring up."
211100-111 = "However, this only shows a small fraction of the total. #nI specifically chose locations where power grids and water/sewage lines do not reach."
211100-112 = "Therefore, they are concentrated on the outskirts of the city. #nIf you develop a large-scale hot spring resort, it will directly contribute to the revenue of the Gehenna district."
211100-113 = "[s] \"So that's why you were asking for data earlier.\""
211100-114 = "Yes. It would have been ideal to have more data, but to control the Hot Spring Development Department, #nthis much should be sufficient."
211100-115 = "However, there is one caveat. #nThis map must be given to Meg Shimokura."
211100-119 = "Your question is valid, Sensei. #nWhy not give it to the director, Kasumi Kinugawa?"
211100-120 = "The answer is that she will never act as we intend. #nEven if you were there, it wouldn't change anything."
211100-121 = "Even if it were a personal request from you, Sensei, she would see right through it."
211100-122 = "That is why it has to be Meg Shimokura."
211100-123 = "Because Kasumi Kinugawa follows the 'will' of Meg Shimokura."
211100-124 = "To be precise, one should say she acts as the director of the Hot Spring Development Department to fulfill Meg Shimokura's wishes."
211100-125 = "[s] \"...How did you find that out?\""
211100-126 = "If you have a sense of purpose and persistence, many things become clear."
211100-127 = "But I digress. #nIn conclusion, we need to find a time when Meg Shimokura is alone."
211100-130 = "Does this mean we can build as many hot springs as we want!?"
211100-131 = "Of course. Furthermore, these are only carefully selected points. #nThere is no need to worry about being chased by the Prefect Team."
211100-132 = "Really!? Director Kasumi is really scared of the Prefect Team leader, so I think she'll be happy!"
211100-133 = "Oh! But I have to consult with Director Kasumi."
211100-134 = "Everything we do is according to Director Kasumi's plans!"
211100-135 = "That is incorrect."
211100-136 = "Huh?"
211100-141 = "What is important is your will. Whether or not you, Meg Shimokura, want to do it."
211100-142 = "Is that so?"
211100-143 = "Yes. In the Hot Spring Development Department, that is given the highest priority."
211100-144 = "Could you say a word as well, Sensei? #nI'm sure Meg would feel more at ease."
211100-145 = "Ugh..."
211100-147 = "(I feel like something is off, but...)"
211100-148 = "(If they only develop the locations on the map, it's true that the damage will be reduced.)"
211100-150 = "[ns] \"...Meg, you love developing hot springs, right?\""
211100-154 = "Yeah! I love it! As much as ramen... no, I love it even more than I could give up ramen!"
211100-155 = "[s5] \"Then the locations on this map are perfect for you.\"\n[s6] \"They're supposed to be better quality than the others, too.\""
211100-158 = "Hehe, if you say so, Sensei, it must be true!"
211100-159 = "Alright! Then I'll go tell Director Kasumi!"
211100-160 = "Please, only develop the locations on the map."
211100-164 = "Huh? Is that the rule?"
211100-165 = "You must not develop any other locations. That is the condition for handing over this map."
211100-166 = "I see... hmm... I'll tell Director Kasumi that too!"
211100-167 = "Yes, please convey it exactly like that."
211100-168 = "Thanks for giving me this map! You're a good person, Shoko!"
211100-169 = "..."
211100-170 = "Okay, I'm going to go see Director Kasumi! #nShe's definitely going to be happy!"
211100-171 = "Bye-bye!"
211100-175 = "...That was easy."
211100-176 = "Kasumi Kinugawa's reaction is an unknown, but in the end, she won't be able to resist."
211100-177 = "Her strongest motivation is to fulfill Meg Shimokura's wishes, after all."
211100-181 = "...Sensei. You don't look very happy."
211100-182 = "[s] \"I just... feel a bit guilty.\""
211100-183 = "..."
211100-184 = "We haven't lied to her. And of course, we haven't deceived her."
211100-185 = "We just gave selected information to a selected recipient."
211100-186 = "If things go well, no one loses."
211100-187 = "The Hot Spring Development Department gets to dig for hot springs. Gehenna gets to suppress an uncertain variable. #nPlus, we get the bonus of being able to deploy skilled construction workers where they are needed."
211100-188 = "...There seems to be a misunderstanding, but I am not denying individual freedom."
211100-191 = "Yes, it's no wonder you're surprised. #nAt first glance, it contradicts our philosophy."
211100-192 = "The definition of 'freedom' is different. #n'I want to shoot,' 'I want to eat.' Those are not freedom; they are merely impulses."
211100-193 = "Until now, Gehenna students have been slaves to their instincts and impulses. #nBut from now on, it will be different."
211100-196 = "And I believe that 'participation in the community' is a value that stands above individual freedom. Because freedom is only completed within a group."
211100-197 = "[s] \"Isn't it up to each person how they think about that?\""
211100-198 = "I suppose so. I am aware of that."
211100-201 = "(I walked down the mountain with Shoko.)"
211100-208 = "Hahaha! I knew you'd be taking this path!"
211100-209 = "[ns] \"This voice...\""
211100-214 = "Well, I heard from Meg earlier. #nI couldn't just sit still, so I rushed over."
211100-219 = "Kasumi Kinugawa."
211100-220 = "To think someone would do something as cruel as leaving me out of the loop?"
211100-221 = "Hmph..."
211100-222 = "May I introduce myself?"
211100-223 = "Of course! It's been a while since I've felt like this. #nI'm naturally curious about your name, aren't I?"
211100-224 = "I am Shoko Igarashi, secretary of the Gehenna Restoration Committee."
211100-225 = "I see, I see. Hmm?"
211100-226 = "..."
211100-227 = "Oh, wait. I failed to greet your companion. #nHello, Sensei. Are you doing well?"
211100-228 = "[s] \"Thanks to you...\""
211100-229 = "Ah, ah, don't make such an apologetic face. #nSensei, you are as kind as ever."
211100-230 = "Don't worry, I understand Shoko-chan's scheme."
211100-231 = "It's Shoko Igarashi."
211100-232 = "Sorry, my memory is poor. Was it Shock-chan? #nI hope there comes a day when I can remember it... but who knows, will that day come?"
211100-233 = "Well, let's leave the greetings at that. You know why I'm here, right? #nSince you went out of your way to give Foreman Meg such a 'gift'."
211100-234 = "But this map looks a bit biased to me."
211100-235 = "..."
211100-236 = "The intention to 'control' us is seeping out, isn't it?"
211100-237 = "Are you telling us to just be good little dogs and dig where you say?"
211100-238 = "I received such an enthusiastic fan letter, after all. #nI felt like I had to show my face."
211100-239 = "And?"
211100-240 = "..."
211100-241 = "Hmm?"
211100-242 = "Does that mean you're refusing?"
211100-243 = "..."
211100-244 = "Hahaha! No, this is truly good! Wonderful!"
211100-245 = "Of course, we'll do it. All of the locations on this map. #n...Why do you think that is?"
211100-246 = "Because Meg Shimokura wants to."
211100-247 = "...Ah, that's right."
211100-248 = "I'll play along this time."
211100-254 = "But... remember this."
211100-255 = "There won't be a 'next time'."
211100-256 = "That is fine. In that case, we will have you return to 'that place'."
211100-257 = "...What?"
211100-263 = "Exactly as I said."
211100-264 = "[s] (That place...?)"
211100-265 = "Hmm... that's a pretty thin bluff."
211100-266 = "At least, it doesn't sound like you're from 'this side'. #nPeople who talk like that never survived."
211100-267 = "Once you are finished—"
211100-268 = "Please take care on your way back."
211100-272 = "..."
211100-273 = "Hahaha! I like it. I like you."
211100-274 = "Let's meet again. ...Definitely."
211100-275 = "You too, Sensei!"
211100-276 = "[s] \"Kasumi...\""
211100-283 = "Phew..."
211100-284 = "As I thought, using Meg Shimokura as a lead was the right decision."
211100-285 = "With this, one of Gehenna's biggest uncertain variables has been eliminated. #n...For the time being, at least."
211100-286 = "Even so, I can say we have taken another step forward toward a Great Gehenna."
211100-287 = "A utopia where everyone looks toward the same place. #nA Gehenna united in one heart is not so far off."
211100-288 = "[s] \"...\""
211100-289 = "..."
211100-290 = "Sensei—"
211100-291 = "Do you think my methods are wrong?"
211100-295 = "[ns7] \"I don't know if they're right, either...\"\n[ns8] \"I just wish you wouldn't push yourself so hard.\""
211100-300 = "So... that's how it looked to you."
211100-301 = "[s9] \"'Must do this,' 'have to do that.'\"\n[s10] \"If you keep thinking like that, you'll wear yourself out first.\""
211100-306 = "..."
211100-307 = "............"
211100-311 = "[ns] \"Shoko?\""
211100-320 = "(I chased after Shoko as she walked away quickly.)"
211100-321 = "...I'm shocked. To think that's how I appeared to you."
211100-322 = "I intended to be a respectable person who pushes forward with a straight will."
211100-323 = "[s] \"You look a little... dangerous.\""
211100-324 = "Is that so..."
211100-325 = "[s] \"Is that the kind of person you wanted to be, Shoko?\""
211100-326 = "Wanted to be... rather than that, perhaps I just wanted to see one."
211100-327 = "Someone who can make decisions without hesitation and keep moving forward without doubt... Do you know anyone like that, Sensei?"
211100-331 = "...So there are many people you want to be like."
211100-332 = "No matter how respectable they are, if they don't doubt themselves, they will eventually become self-righteous...?"
211100-333 = "..."
211100-334 = "Well. Perhaps there really 'is' someone like that somewhere in the world."
211100-339 = "...No. Perhaps there 'was'."
211100-341 = "(There was no conversation on the way back after that.)"
211100-343 = "Next Episode;Unfamiliar Peace"