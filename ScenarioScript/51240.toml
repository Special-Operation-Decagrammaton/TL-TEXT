[translation]
51240-1 = "Episódio 24;Algo Comum"
51240-3 = "Eu só queria ser alguém de quem a Ayame não sentisse vergonha."
51240-4 = "Com medo de que descobrissem quem eu realmente sou, eu... fingia ser alguém à altura da Ayame."
51240-15 = "Quando me dei conta, todos estavam olhando para mim."
51240-16 = "E isso me assustou."
51240-19 = "Eu não sou esse tipo de pessoa, mas todos me superestimavam, me entendiam errado..."
51240-20 = "Diziam que eu não ficava atrás da Ayame. Que eu era talentosa e incrível."
51240-22 = "Eu só queria me tornar alguém que não envergonhasse a Ayame."
51240-23 = "Por isso eu me esforçava desesperadamente para manter as aparências... era só isso."
51240-25 = "[ns] \"E isso já não é o suficiente?\""
51240-26 = "...?!"
51240-33 = "...O que foi que você disse?"
51240-34 = "[ns1] \"Fingir ser alguém que não é...\"\n[ns2] \"O que há de errado em essa versão de si mesma ser aceita?\""
51240-39 = "[ns3] \"Mesmo que seja uma atuação, se você continuar atuando assim,\"\n[ns4] \"uma hora isso se torna realidade.\""
51240-42 = "[ns5] \"Todo mundo...\"\n[ns6] \"tenta manter as aparências.\""
51240-46 = "[ns] \"É algo comum que todo mundo faz.\""
51240-47 = "...?!"
51240-48 = "Hah...! Você acha mesmo que essa desculpa esfarrapada vai colar?"
51240-49 = "Uma mentira é sempre uma mentira, não importa o quanto você a enfeite.#nÉ exatamente por isso que tantas pessoas se machucam e acabam em tragédia."
51240-50 = "[s] \"Mesmo que pareça uma mentira para quem a conta, do ponto de vista dos outros pode ser bem diferente.\""
51240-56 = "(Por exemplo, como quando a Yukari e a Nagusa se conheceram)"
51240-59 = "Você se machucou?"
51240-60 = "Essa sua postura de não recuar nem diante de uma injustiça..."
51240-65 = "Foi muito legal da sua parte."
51240-66 = "...!"
51240-67 = "Pode deixar o resto com a gente. Até mais."
51240-69 = "(Por exemplo, como nos momentos que passaram juntas)"
51240-72 = "A Renge é uma garota talentosa. Muito mais do que alguém inexperiente como eu."
51240-73 = "Eu tenho muito orgulho dela.#nNão é, Yukari? Você também concorda?"
51240-74 = "Sim, com certeza!"
51240-75 = "Yukari, ela acabou de dizer que a Renge é mais talentosa que a Nagusa-senpai."
51240-76 = "Hã...?!"
51240-77 = "Ei! Dá para parar? Estou ficando com vergonha só de ouvir isso!"
51240-78 = "Não consigo ficar feliz de verdade ouvindo isso da Nagusa-senpai, que é muito mais forte que eu!"
51240-83 = "...Hehe."
51240-85 = "(Por exemplo, como quando decidiu deixar o Hyakkaryouran)"
51240-87 = "Kikyou, você é brilhante.#nComo estrategista do Hyakkaryouran, todos confiam em você."
51240-88 = "Não só as outras integrantes... eu também."
51240-91 = "[ns] \"No começo, pode até ter sido uma \"atuação\". Mas, graças a isso, a Nagusa—\""
51240-93 = "[ns7] \"Se tornou a pessoa que conhece...\"\n[ns8] \"melhor do que ninguém vocês três.\""
51240-96 = "[ns] \"Sim... exatamente como aquela pessoa que a Nagusa tanto admirava.\""
51240-97 = "...!!!"
51240-98 = "[s] \"Mesmo que seja atuação, mesmo que seja só para manter as aparências, tudo bem.\""
51240-99 = "Mesmo que o resultado seja vocês se odiarem e atacarem umas às outras?!"
51240-100 = "Mesmo sabendo que vão se ferir, afundar no desespero e se odiar, você ainda diz uma bobagem dessas—"
51240-101 = "[s9] \"É verdade que podemos nos desentender por isso...\"\n[s10] \"e até acabar brigando.\""
51240-104 = "[ns] \"Acho que também podemos ser julgados pelas costas ou sair machucados.\""
51240-107 = "[ns] \"Mas até essas coisas acontecem com todo mundo.\""
51240-109 = "[ns11] \"Se brigarmos, basta nos esforçarmos para fazer as pazes.\"\n[ns12] \"E eu vou dar o meu máximo para ajudar todas vocês com isso.\""
51240-114 = "...O que é isso?"
51240-115 = "Que patético... Ah! Ah! Que idealismo nojento de dar ânsia de vômito..."
51240-116 = "Não tem elegância nenhuma nisso! É a pior história de todas!!"
51240-117 = "Essas desculpas ridículas que insultam o \"Hyakumonogatari\"...#nEu vou destroçar tudinho, tudinho mesmo..."
51240-118 = "Começando por você, Sensei—"
51240-123 = "Não vou permitir que faça isso!"
51240-132 = "[ns] \"Yukari...!\""
51240-137 = "Hã? ...Você acordou? Mesmo depois de ser engolida pela Efígie Sem Rosto?#n...Como?"
51240-139 = "Em meio à escuridão — eu ouvi vozes."
51240-140 = "A voz do Sensei e..."
51240-141 = "A voz da Nagusa-senpai — alto e claro."
51240-145 = "Sim! Eu, Yukari Kadenokouji, estou de volta! Em carne e osso!"
51240-150 = "Hã? Do que você está falando?"
51240-151 = "Já esqueceu? Essas aí te rejeitaram e ainda pisotearam os seus sentimentos."
51240-152 = "Não foi exatamente por isso que a \"Efígie Sem Rosto\" nasceu...?"
51240-153 = "E agora você vem com essa?!"
51240-154 = "Se eu dissesse que não me machuquei nem um pouco, estaria mentindo!"
51240-155 = "[s] \"Yukari...\""
51240-156 = "E é fato que meu peito dói tanto que parece que vai se partir!"
51240-157 = "Mas a voz do Sensei, que ouvi enquanto minha consciência ainda estava turva—"
51240-158 = "Graças a ela...! Mesmo que só agora, finalmente consegui perceber."
51240-160 = "Perceber...? O quê?"
51240-165 = "Que tudo isso — é algo \"comum\"."
51240-171 = "A Nagusa-senpai não foi a única que mentiu."
51240-172 = "Eu fiz exatamente o mesmo."
51240-173 = "E a Renge-senpai... e a Kikyou-senpai também."
51240-179 = "Nossas duas faces... talvez seja para disfarçar o medo, ou pelo bem dos outros —#nou talvez até para enganar a nós mesmas."
51240-180 = "Alguns se machucam com isso, outros nos chamam de hipócritas, e às vezes isso se torna o estopim de uma briga."
51240-184 = "Mas isso não acontece apenas comigo.#nAcontece com todas nós."
51240-185 = "[s] \"...Sim.\""
51240-187 = "Hã...?"
51240-188 = "Se brigarmos, basta fazermos as pazes — se o senhor me diz isso!"
51240-195 = "Então eu escolho aceitar essas palavras!"
51240-196 = "Podemos ter machucado profundamente umas às outras...#nMas eu quero fazer as pazes!"
51240-197 = "Quero fazer as pazes com todas — e voltar a ser o Hyakkaryouran de antes!"
51240-199 = "Como você tem coragem de dizer uma infantilidade dessas...!"
51240-200 = "Shuro Yabuki — não é mesmo?"
51240-201 = "Eu, Yukari, desafio você para um duelo para proteger todas do Hyakkaryouran!"
51240-202 = "Esta é a minha determinação como membro de elite do Hyakkaryouran!"
51240-203 = "Haha... entendi... Então faça como bem entender, não é?"
51240-204 = "Afinal, a Efígie Sem Rosto que nasceu de você ainda está bem aqui...!"
51240-215 = "Com isto, a mentirosa da Nagusa, o Sensei tolo e a garotinha que não sabe o próprio lugar—"
51240-216 = "—Tooodos vocês!"
51240-224 = "...Hã?"
51240-229 = "Toma essaaa!! Chegamos!!!"
51240-230 = "...Yukari, você está bem?!"
51240-235 = "...Ah."
51240-236 = "Aaah!! Renge-senpai, Kikyou-senpai!!!"
51240-238 = "Ufa... ainda bem que chegamos a tempo..."
51240-239 = "[s] \"Como vocês duas chegaram aqui?!\""
51240-240 = "O pessoal lá fora deu uma força.#nAí só nós duas conseguimos vir na frente."
51240-241 = "E pelo visto chegamos bem no meio de uma batalha intensa, né?"
51240-247 = "...Shuro Yabuki, do Clube Beleza da Natureza."
51240-248 = "Como estrategista do Hyakkaryouran, eu te dou um aviso... renda-se sem resistir."
51240-252 = "Hah..."
51240-253 = "Haha—"
51240-254 = "Ahahahaha!"
51240-258 = "Logo agora, vocês vêm transformar tudo numa história tão rasa assim!"
51240-259 = "...Pois bem. Vamos ver até onde vocês conseguem ir!"
51240-260 = "Antes deixar o meu \"Hyakumonogatari\" virar uma bagunça sem sentido dessas..."
51240-261 = "Eu prefiro resetar tudo agora mesmo e começar do zero!"
51240-272 = "Acabe com tudo!"
51240-273 = "Destrua o Hyakkaryouran de uma vez por todas—!!"
51240-275 = "Kikyou... Yukari, Sensei!"
51240-276 = "[s] \"Sim, vamos lá!\""
51240-277 = "Depois de chegar até aqui, não vamos recuar."
51240-278 = "Com força total! Vamos avançar!"
