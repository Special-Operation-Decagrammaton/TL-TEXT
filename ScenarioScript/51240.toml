[translation]
51240-1 = "Эпизод 24;Обычные события"
51240-3 = "Я лишь хотела стать достаточно хорошей, чтобы стоять рядом с Аямэ."
51240-4 = "Я боялась, что она поймёт, насколько я некомпетентна, поэтому притворялась. Притворялась достаточно хорошей."
51240-5 = ""
51240-7 = ""
51240-9 = ""
51240-15 = "Но однажды я оглянулась и поняла, что все смотрят уже на меня."
51240-16 = "Мне стало страшно."
51240-17 = ""
51240-19 = "Потому что я не тот человек, на которого стоит равняться. Они приняли мою игру за реальность."
51240-20 = "Ты потрясающая. Такая впечатляющая. Ты достойна Аямэ."
51240-21 = ""
51240-22 = "Это всё, чего я хотела..."
51240-23 = "Поэтому я боролась изо всех сил, но этого было недоста—"
51240-25 = "[ns] «Этого было достаточно.»"
51240-26 = "...?!"
51240-27 = ""
51240-32 = ""
51240-33 = "...Ч-Что?"
51240-34 = "[ns1] «Что плохого в попытке стать лучше?»\n[ns2] «Почему это не может быть твоей настоящей сутью?»"
51240-35 = ""
51240-36 = ""
51240-39 = "[ns3] «Неважно, если это кажется ложью.»\n[ns4] «Притворяйся, пока это не станет правдой, верно?»"
51240-42 = "[ns5] «Стараться изо всех сил — естественно.»\n[ns6] «Хотеть хорошо выглядеть перед сверстниками — тоже естественно.»"
51240-46 = "[ns] «Всё это обычные события в человеческой жизни.»"
51240-47 = "Это..."
51240-48 = "Что это вообще за оправдание? Вы правда думали, что это сработает?!"
51240-49 = "Лгать плохо! Причинять людям боль плохо! Посмотрите, что произошло из-за их лжи!"
51240-50 = "[s] «Если тебе это кажется ложью, ещё не значит, что это неправда.»"
51240-51 = ""
51240-53 = ""
51240-56 = "Например, когда Юкари и Нагуса впервые встретились..."
51240-59 = "Вы не пострадали?"
51240-60 = "Ваша непоколебимая смелость выступить против несправедливости."
51240-61 = ""
51240-63 = ""
51240-64 = ""
51240-65 = "Это было весьма впечатляюще."
51240-66 = "...!"
51240-67 = "Дальше предоставьте всё Хяккарёран. А теперь..."
51240-69 = "Или когда все члены Хяккарёран были вместе..."
51240-72 = "У Рэнгэ несгибаемое сердце... Для такой колеблющейся души, как моя, она весьма вдохновляет."
51240-73 = "Мы многим обязаны Рэнгэ. Ты ведь тоже так думаешь, Юкари?"
51240-74 = "Да!"
51240-75 = "Смело с твоей стороны говорить Нагусе, что Рэнгэ впечатляет тебя больше, Юкари."
51240-76 = "Что?!"
51240-77 = "Эй, не дразни её только потому, что хочешь смутить меня! Есть вещи, которые слишком неловко слышать, знаешь ли?!"
51240-78 = "...Странно слышать такую искреннюю похвалу от столь утончённого человека."
51240-79 = ""
51240-81 = ""
51240-83 = "Хи-хи."
51240-85 = "Или когда Нагуса пыталась навсегда покинуть Хяккарёран..."
51240-87 = "Всё просто. Твоя работа операционным офицером Хяккарёран принесла тебе и влияние, и уважение."
51240-88 = "Не только среди рядовых членов, но и у меня."
51240-91 = "[ns] «Возможно, поначалу самой Нагусе казалось, что она лишь играет роль.»"
51240-93 = "[ns7] «Но Нагуса много трудилась и выросла.»\n[ns8] «Она стала человеком, на которого эти трое могли равняться.»"
51240-96 = "[ns] «Да, Нагуса стала именно той, кем хотела стать.»"
51240-97 = "...!!"
51240-98 = "[s] «Почему плохо снова и снова пытаться стать лучше?»"
51240-99 = "Они ужасны! Они предадут друг друга и будут сражаться! Их доверие рассыпается как стекло."
51240-100 = "Что бы они ни делали, они будут ранить друг друга! Сама их природа порождает ненависть. Как вы можете говорить, что это нормально?!"
51240-101 = "[s9] «Ты права. Они будут ссориться.»\n[s10] «Иногда они даже могут ненавидеть друг друга.»"
51240-104 = "[ns] «Наверняка они будут капризничать, обвинять и даже причинять друг другу боль.»"
51240-107 = "[ns] «Как я и сказал. Это обычные события. И это нормально.»"
51240-109 = "[ns11] «Им просто придётся научиться говорить „прости“.»\n[ns12] «И им не придётся делать это в одиночку.»"
51240-110 = ""
51240-111 = ""
51240-113 = ""
51240-114 = "Вы шутите."
51240-115 = "Из ваших слов буквально сочится идеализм."
51240-116 = "Ваше решение... отвратительно! В вашей истории нет ни капли утончённости!"
51240-117 = "Вы не помешаете моей истории о призраках!"
51240-118 = "Я уничтожу вас прежде, чем это случится, Сенсей!"
51240-119 = ""
51240-123 = "Я стану щитом против твоих злодеяний!"
51240-124 = ""
51240-127 = ""
51240-128 = ""
51240-131 = ""
51240-132 = "[ns] «Юкари! Ты в порядке?!»"
51240-133 = ""
51240-136 = ""
51240-137 = "Нет! Тебя поглотил Каташиро! Этого не может быть!"
51240-139 = "Я обнаружила себя парящей в бездне... Но до меня донёсся голос..."
51240-140 = "Должно быть, это был голос Сенсея."
51240-141 = "А потом я услышала Нагусу, словно она стояла прямо рядом со мной."
51240-142 = ""
51240-144 = ""
51240-145 = "И потому я, Юкари, воскресла! Я здесь!"
51240-146 = ""
51240-148 = ""
51240-150 = "Что ты вообще сейчас несёшь?"
51240-151 = "Ты настолько глупая, что уже забыла? Мир бросил тебя, растоптал, предавал снова и снова."
51240-152 = "Твоя ненависть была настолько сильной, что породила Каташиро!"
51240-153 = "Такие эмоции и такая враждебность не исчезают просто по ветру!"
51240-154 = "Да, не исчезают! Я всё ещё несу бремя своей боли!"
51240-155 = "[s] «Юкари...»"
51240-156 = "Настолько тяжёлое, что эта боль давит на сердце и перехватывает само дыхание."
51240-157 = "Но слова Сенсея достигли меня в той тьме."
51240-158 = "Мне потребовалось больше времени, чем следовало, но теперь я понимаю слова Сенсея!"
51240-160 = "Ну так расскажи подробнее об этом бреде."
51240-161 = ""
51240-164 = ""
51240-165 = "Всё, что мы сделали, всё, через что страдали... Это лишь ещё одна грань человеческой жизни."
51240-166 = ""
51240-169 = ""
51240-171 = "Нагуса, возможно, лгала, но виновата была далеко не только она."
51240-172 = "Я тоже много о чём лгала."
51240-173 = "Рэнгэ и Кикё тоже."
51240-179 = "Люди лгут по множеству причин: из страха, чтобы ввести в заблуждение или даже чтобы защитить тех, кого любят."
51240-180 = "И ничего хорошего из этого не выходит! Вы лишь причиняете боль и страдаете сами."
51240-181 = ""
51240-183 = ""
51240-184 = "Но жизнь просто такова. Вот что значит быть человеком."
51240-185 = "[s] «...Молодец, Юкари.»"
51240-187 = "Что...?"
51240-188 = "После ссоры всегда остаётся возможность сказать «прости»."
51240-189 = ""
51240-194 = ""
51240-195 = "Я выбираю верить словам Сенсея."
51240-196 = "Мне нет дела до наших конфликтов! Я, Юкари, помирюсь со всеми."
51240-197 = "Я хочу, чтобы мы все простили друг друга и Хяккарёран вернулся к счастливым дням!"
51240-199 = "Твоя незрелая наглость не знает границ."
51240-200 = "Мне! Всё! Равно! Ты, та, кого зовут Ябуки Сюро..."
51240-201 = "Я, Юкари, одолею тебя и спасу Хяккарёран."
51240-202 = "В конце концов, это моя работа как элиты Хяккарёран!"
51240-203 = "Ха. Говори сколько хочешь. Разбрасывайся громкими словами."
51240-204 = "Ничто из этого не важно. Созданный тобой Каташиро всё ещё жив."
51240-205 = ""
51240-207 = ""
51240-209 = ""
51240-210 = ""
51240-211 = ""
51240-213 = ""
51240-215 = "Я навсегда покончу с Нагусой и Сенсеем из Шале! А потом растопчу эту дерзкую мелочь, которая не знает своего места."
51240-216 = "Все вы...!"
51240-217 = ""
51240-220 = ""
51240-221 = ""
51240-223 = ""
51240-224 = "...Что?"
51240-225 = ""
51240-228 = ""
51240-229 = "Ха-ха! Мы добрались!"
51240-230 = "Юкари, ты ранена?"
51240-231 = ""
51240-234 = ""
51240-235 = "...Ах."
51240-236 = "А-А-А! Рэнгэ! Кикё!"
51240-238 = "Я рада, что ты в порядке."
51240-239 = "[s] «Как вы сюда добрались?!»"
51240-240 = "Скажем так, здесь, в Хяккияко, у нас появилось много замечательных друзей."
51240-241 = "Похоже, правда, что мы выпрыгнули из сковороды прямо в огонь."
51240-242 = ""
51240-244 = ""
51240-246 = ""
51240-247 = "...Ябуки Сюро из «Красоты природы»."
51240-248 = "Как операционный офицер Хяккарёран я требую твоей полной и безоговорочной капитуляции."
51240-249 = ""
51240-251 = ""
51240-252 = "Ха."
51240-253 = "Ха-ха."
51240-254 = "Ха-ха-ха!"
51240-255 = ""
51240-257 = ""
51240-258 = "Ты хочешь, чтобы я сдалась сейчас? После всего этого? Такой жалкий финал — и на нём я должна всё бросить?"
51240-259 = "Только попробуй! Заставь меня сдаться!"
51240-260 = "Если вы собираетесь всё разрушить... переписать концовку моей истории о призраках...!"
51240-261 = "Я просто сделаю всё снова! Снова, снова и снова, пока всё не получится как надо!"
51240-262 = ""
51240-264 = ""
51240-265 = ""
51240-267 = ""
51240-268 = ""
51240-269 = ""
51240-271 = ""
51240-272 = "Прикончите их!"
51240-273 = "Уничтожьте Хяккарёран!"
51240-275 = "Кикё, Юкари, Сенсей!"
51240-276 = "[s] «Да.»"
51240-277 = "Отступать некуда."
51240-278 = "Тогда нам остаётся только встретить их в лоб!"
