[translation]
1006308-65 = "……Hm? Behind me?"
1006308-1 = "Потому что так веселее"
1006308-2 = "Я нашёл Коюки, сгорбившуюся посреди травяного поля."
1006308-4 = "Она серьёзно и сосредоточенно вглядывалась в землю."
1006308-5 = "...Хм."
1006308-6 = "Чёрт! Никак не могу найти. Похоже, и здесь тупик."
1006308-8 = "[ns1] «Коюки?»\n[ns2] «Ты в порядке?»"
1006308-11 = "О? Сенсей?"
1006308-12 = ""
1006308-14 = ""
1006308-15 = "Эм... Надеюсь, вы пришли не только из-за моих сообщений. На самом деле ничего такого... Ниха-ха..."
1006308-16 = "Кажется, в последнее время я слишком часто вам пишу."
1006308-17 = "Жутко раздражает, когда кто-то снова и снова лезет на связь. Я... не хочу, чтобы я вам надоела..."
1006308-18 = "Ниха-ха... Говорите, такого никогда не случится? Ну... спасибо."
1006308-19 = "А?"
1006308-20 = "О, хотите знать, что я делала? Эм... Ну..."
1006308-21 = ""
1006308-23 = ""
1006308-24 = "Наверное, вы решите, что это странно."
1006308-25 = "Я вроде как... искала четырёхлистный клевер? Наверное..."
1006308-26 = "Ниха-ха-ха. Очень странно, да? Это слишком аналогово даже для меня."
1006308-27 = "[s3] «Четырёхлистный клевер?»\n[s4] «Вот уж чего от тебя не ожидал.»"
1006308-30 = "П-правда? Я так и знала. Знала, что это странно."
1006308-31 = "И... если я попробую объяснить, наверное, прозвучит ещё страннее, но всё равно расскажу."
1006308-32 = ""
1006308-35 = "Вы же знаете, что мне не везёт в играх? И вообще во всём остальном тоже?"
1006308-36 = "Я думала, как можно улучшить удачу, и это была моя первая идея!"
1006308-37 = "Ведь что первым приходит на ум, когда думаешь об удаче? Четырёхлистный клевер, да? Значит, если я найду такой, удача обязана улучшиться."
1006308-38 = "По крайней мере, я так думала. Но сразу наткнулась на проблему."
1006308-39 = "Раз четырёхлистный клевер — символ удачи, значит, чтобы найти его, уже нужно быть удачливой!"
1006308-40 = ""
1006308-43 = ""
1006308-44 = "Ниха-ха-ха... Глупая идея, да? Если бы удачу можно было повысить так легко, в мире вообще не было бы невезучих людей."
1006308-45 = "Чтобы стать удачливее, нужно уже с самого начала иметь удачу. Несправедливо, правда?"
1006308-46 = "Ниха-ха... Универсальный символ удачи даже не показывается неудачникам."
1006308-47 = "[s5] «Не знал, что ты суеверная.»\n[s6] «Ты веришь в подобные вещи?»"
1006308-50 = "Э-э..."
1006308-51 = "Не знаю, Сенсей. А вы как думаете?"
1006308-52 = "Наверное, я никогда об этом особо не задумывалась, так что даже не знаю, верю ли вообще в удачу."
1006308-53 = "Большинство вещей ведь так не работает, да? Обычно мир — это просто причина и следствие."
1006308-54 = "Если есть проблема, у неё будет решение, и рано или поздно кто-нибудь придёт и разберётся. Никакой удачи."
1006308-55 = "...Но..."
1006308-56 = "Если таких вещей, как удача, правда не существует, тогда мир кажется..."
1006308-57 = "Не знаю... скучным? Так было бы менее весело!"
1006308-58 = "...Так что, наверное, существует она или нет — я всё равно хочу верить, что удача реальна! Ниха-ха-ха-ха!"
1006308-59 = "[s] «...»"
1006308-60 = "Ниха-ха-ха... Вот и вся история. Поэтому я и оказалась здесь, жалуясь."
1006308-61 = "[ns] «...Коюки.»"
1006308-63 = "[ns7] «Посмотри туда.»\n[ns8] Сесть и указать ей за спину."
1006308-66 = "...А? За спиной?"
1006308-67 = ""
1006308-69 = ""
1006308-72 = "Что вы—"
1006308-73 = "А?"
1006308-74 = "Эй, стойте! Это же..."
1006308-75 = ""
1006308-79 = "― Вау, Сенсей! Настоящий четырёхлистный клевер![wa:1480]"
1006308-82 = "― Как так?! Его же секунду назад здесь не было![wa:10]"
1006308-84 = "― Неужели... Он мог просто появиться?[wa:10]"
1006308-87 = "― Нет, это бессмысленно...[wa:940]"
1006308-89 = "― Я его не заметила...? Когда вы его увидели?[wa:1640]"
1006308-92 = "― Как такое возможно...?[wa:2170]"
1006308-94 = "― И время настолько идеальное![wa:720]"
1006308-97 = "[ns9] «Я тоже хотел верить.»\n[ns10] «Так определённо веселее.»"
1006308-98 = "...![wa:530]"
1006308-99 = "...![wa:530]"
1006308-101 = "― Да, да! Понятно![wa:1400]"
1006308-104 = "― Ура! И лучше бы вы тоже так думали, потому что...[wa:3100]"
1006308-106 = "― ...так будет веселее!"
1006308-108 = ""
1006308-109 = ""
1006308-111 = "Мы с Коюки ещё немного поговорили, а затем я вернулся в Шале."