[translation]
1009315-1 = "Усилия, воспоминания и..."
1009315-2 = "Сообщения Кирары в MomoTalk меня обеспокоили, поэтому я отправился в Геенну."
1009315-3 = "Однако..."
1009315-4 = ""
1009315-7 = "Вру-у-ум!"
1009315-8 = "Газ в пол! Нам нельзя опаздывать!!"
1009315-9 = "Нужно обогнать тот мусоровоз!"
1009315-10 = ""
1009315-15 = "[ns] «С какой же скоростью они едут на мотоцикле...?»"
1009315-17 = "[ns] «...Погоди, на заднем сиденье ведь была КИРАРА?!»"
1009315-18 = "И я побежал за мотоциклом."
1009315-20 = "Перед хранилищем макулатуры"
1009315-21 = "Фух... Мы приехали!"
1009315-22 = "Спасибо вам всем!"
1009315-23 = "Да без проблем! Мы всё равно ехали сюда!"
1009315-24 = "И даже если бы не ехали, другу помочь никогда не жалко."
1009315-25 = "Надеюсь, найдёшь то, что ищешь, Кирара!"
1009315-26 = "Хи-хи! Спасибо вам огромное!"
1009315-27 = "Тогда мы поехали!"
1009315-31 = "Эм... Вот я и добралась... Но что теперь?"
1009315-32 = "Хм? Кто там? Мисс Кирара?"
1009315-33 = "А! Господин смотритель склада!"
1009315-34 = "И что студент вроде тебя делает на складе макулатуры?"
1009315-35 = "Ну... Видите ли..."
1009315-36 = "Если коротко: ты оставила коробку со своими книгами у двери, пока убирала комнату, а уборщики по ошибке её забрали?"
1009315-37 = "Именно! Пять с плюсом!"
1009315-38 = "И, понимаете, в той коробке был о-о-очень важный блокнот..."
1009315-39 = "Вот как..."
1009315-40 = "Ну, ничего не поделаешь!"
1009315-41 = ""
1009315-43 = ""
1009315-44 = "Вот!"
1009315-45 = "Я открою тебе склад, так что иди ищи!"
1009315-46 = "Ого...!"
1009315-47 = "Но поторопись! Мусоровоз будет через 20 минут!"
1009315-48 = "Ага-ага! Спасибо огромное, мистер!"
1009315-49 = ""
1009315-51 = ""
1009315-53 = ""
1009315-54 = ""
1009315-55 = ""
1009315-56 = ""
1009315-57 = ""
1009315-58 = ""
1009315-59 = ""
1009315-60 = "Угх..."
1009315-61 = "Где же он может быть...?"
1009315-62 = "[s] «Что ты ищешь?»"
1009315-63 = "Эм... Просто обычный блокнот на спирали. Я использую его для учёбы."
1009315-64 = "А! Стоп! Вообще-то он совсем не обычный. Я снаружи его очень мило украсила!"
1009315-65 = "[s] «М-м, да. Эта обложка прямо кричит „Кирара“.»"
1009315-66 = "Знаю! Погоди— что?"
1009315-67 = ""
1009315-69 = ""
1009315-71 = "О! Да! Вот он!"
1009315-72 = "Спасибо, спасибо огромное, Учитель!!!"
1009315-73 = "..."
1009315-74 = ""
1009315-76 = ""
1009315-77 = ""
1009315-78 = "Погодите, УЧИТЕЛЬ?! Что вы здесь делаете?!"
1009315-79 = "Я заставила вас переживать своими сообщениями в MomoTalk?"
1009315-80 = "Ай...!! Я устроила целую сцену из-за ерунды!"
1009315-81 = "Простите, Учитель!!"
1009315-82 = "[s1] «В любом случае, в этом блокноте что-то...»\n[s2] «Кажется, я уже его где-то видел...»"
1009315-85 = "Да! Видели!"
1009315-86 = "Помните, когда однажды помогали мне готовиться? Это тот самый блокнот, которым я тогда пользовалась!"
1009315-87 = "[s] «А...! Теперь вспомнил!»"
1009315-88 = "Вообще-то я исписала все страницы... так что технически он вроде как больше ни для чего не нужен."
1009315-89 = "Но это также значит, что он весь заполнен воспоминаниями о том, как я миллион раз переписывала формулы, чтобы их запомнить, мучилась с задачами и, и...!"
1009315-90 = "Просто куча воспоминаний! Поэтому мне не хотелось его выбрасывать!"
1009315-91 = "[ns] Полистать блокнот."
1009315-92 = ""
1009315-96 = ""
1009315-97 = "Почти каждая страница была заполнена следами её усердной учёбы."
1009315-98 = "Казалось, старания буквально выпирают со страниц."
1009315-99 = ""
1009315-100 = "[ns] «Ты очень много работала, Кирара.»"
1009315-101 = "Хи-хи, немного неловко слышать это от вас, Учитель."
1009315-102 = "Просто я не какая-то там умница, поэтому должна компенсировать это большим трудом! Очевидно же!"
1009315-103 = "[s] «Но не все думают так же.»"
1009315-104 = "Э... Правда?"
1009315-105 = "Хи-хи! От этого я будто чувствую себя особенной!"
1009315-106 = ""
1009315-107 = "Пока мы разговаривали, я рассеянно листал страницы блокнота Кирары."
1009315-108 = ""
1009315-110 = ""
1009315-113 = ""
1009315-114 = "А потом..."
1009315-115 = ""
1009315-116 = "[ns] «О, рисунки на полях.»"
1009315-117 = "А?!"
1009315-118 = "А-А! Погодите! Видите ли...!"
1009315-119 = "[s3] «Разве научиться хорошо рисовать на полях...»\n[s4] «...не естественный побочный эффект учёбы?»"
1009315-122 = ""
1009315-124 = ""
1009315-125 = "Вот именно, Учитель!"
1009315-126 = "Правда? Правда? Разве у вас тоже не просыпается внутренний художник, когда нужно решать задачи?"
1009315-127 = "Но места для рисунков не так много, ведь ты всё-таки учишься..."
1009315-128 = "[s] «Поэтому в итоге рисуешь кучу крошечных штучек!»"
1009315-129 = "Точно!"
1009315-130 = "Вы прямо как я, Сенсей!"
1009315-131 = "Оказывается, у нас всё это время было что-то общее!"
1009315-132 = "[s] «Ого-о, ты даже портреты рисуешь!»"
1009315-133 = ""
1009315-136 = "[ns] «Хм, а кто это должен быть...?»"
1009315-137 = "Хм? Что вы имеете в виду? Портрет?"
1009315-138 = "..."
1009315-139 = "...Ах."
1009315-140 = "А...!"
1009315-141 = ""
1009315-143 = ""
1009315-145 = "Не объясняя ничего, Кирара бросилась ко мне и выхватила блокнот."
1009315-147 = ""
1009315-149 = ""
1009315-150 = "Н-Ну, в-вы знаете, я, эм..."
1009315-151 = ""
1009315-153 = ""
1009315-154 = "Мне пора! Пока, Учитель!!"
1009315-155 = ""
1009315-157 = ""
1009315-159 = "Я и не знал, что Кирара умеет двигаться настолько быстро, пока она не вылетела из комнаты."
1009315-160 = "Её лицо было ярко-красным..."
