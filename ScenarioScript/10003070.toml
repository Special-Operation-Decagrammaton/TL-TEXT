10003070-176 = "Ако."
10003070-177 = "Э-Эм, да...?"
10003070-178 = "О том, что произошло с нашими тренировками, я спрошу позже."
10003070-179 = ""
10003070-180 = ""
10003070-181 = "Всем приготовиться к бою."
10003070-182 = "Закончим это быстро."
10003070-183 = "Е-Есть!"
10003070-184 = "Да!"
