[translation]
10003070-1 = "Эпизод 7;Ещё не всё?!"
10003070-2 = "Штаб летнего лагеря"
10003070-4 = "Проверка связи, раз, два. Слышите меня? Всем отрядам ответить."
10003070-5 = "Отряд Альфа, наготове."
10003070-6 = "Отряд Бета, на позиции."
10003070-7 = "Отряд Гамма, на позиции. Ждём приказов."
10003070-8 = "Значит, все отряды готовы. Как наши агенты на месте?"
10003070-10 = "Кодовое имя S. Я уже в зоне."
10003070-11 = "Кодовое имя H. Тоже на месте."
10003070-12 = "Слышу вас отлично. Ещё раз повторю план."
10003070-13 = "Летний лагерь должен закончиться сегодня в 16:00, после чего мы сразу отправимся домой."
10003070-14 = "Единственный официальный пункт в расписании президентки — дневная стрелковая тренировка."
10003070-15 = "Однако свободное утро она решила использовать для уроков плавания с Сенсеем."
10003070-16 = "Другими словами... президентка наконец воспринимает это как отпуск!"
10003070-17 = "Наша миссия не изменилась. Мы должны сделать отпуск президентки максимально спокойным и приятным."
10003070-19 = "А именно — убрать все опасные элементы вокруг пляжа и обезопасить территорию. Тогда ничто не помешает главному префекту спокойно отдыхать!"
10003070-20 = "И ради этого мы снова прибегаем к насилию...?"
10003070-21 = "Могло быть хуже. По крайней мере, сегодня не собираются толпы, как вчера."
10003070-22 = "Хватит болтовни! Помните, самая важная роль у вас, Сенсей!"
10003070-23 = "[s] «Да... Я справлюсь.»"
10003070-24 = "Научить президентку плавать — огромная ответственность."
10003070-25 = "Если честно, мне даже немного обидно. Почему она выбрала вас, а не меня?! Проклята моя должность, которая отнимает всё время!"
10003070-26 = "Но если этого хочет главный префект, я стерплю боль. Оставляю её вам, Сенсей."
10003070-27 = ""
10003070-29 = "Однако! Я не приму никаких провалов! Вы научите её как следует, ясно?!"
10003070-30 = "[s] «Т-Так точно, мэм.»"
10003070-31 = "Ако будто одержимая..."
10003070-32 = "К слову, только меня удивляет, что президентка не умеет плавать? Мы ведь говорим о человеке, который выполняет буквально любую поставленную задачу."
10003070-33 = "Думаю, это лишь показывает, сколько времени она тратит на работу и как мало успевает испытать чего-либо другого."
10003070-34 = "Я сказала, хватит болтовни! Сейчас нужно сосредоточиться на миссии!"
10003070-35 = "Президентка только что закончила собираться и вышла из комнаты. Всем занять позиции!"
10003070-39 = "Пляж. Чисто."
10003070-40 = "Окрестности тоже под контролем. Теперь всё в ваших руках, Сенсей."
10003070-41 = "[s] «Хорошо! Я справлюсь!»"
10003070-42 = "Уверена, всё будет хорошо. Не может же у нас возникнуть столько же проблем, сколько вчера."
10003070-43 = "Иори, ты ничему не научилась? Вчера ты сказала то же самое."
10003070-44 = "Да брось! Кто вообще слышал, чтобы молния ТРИ раза ударяла в одно место?"
10003070-45 = ""
10003070-47 = "Эм..."
10003070-48 = "*вздыхает*"
10003070-49 = "Не может быть... Почему именно сейчас?"
10003070-50 = "Что случилось, Ако?"
10003070-51 = "Старший администратор?"
10003070-52 = ""
10003070-53 = "Данные от Разведывательного комитета!"
10003070-54 = "Пляжные хулиганы Фубар и Банда в шлемах «Сплэши» собираются в квартале за отелем!"
10003070-55 = "Примерная численность... больше двух батальонов!"
10003070-56 = "Почему эти двое вдруг объединились?!"
10003070-57 = "Мы только что получили передачу от обеих групп. Подключаю!"
10003070-59 = ""
10003070-60 = "Гадаете, почему мы работаем вместе? Ещё бы!"
10003070-61 = "Ха-ха-ха! Мы заключили временный союз!"
10003070-62 = "А всё потому, что наткнулись на ценную информацию."
10003070-63 = "Хотите знать, что мы выяснили? Да вы и так знаете! Главный префект выбыла из строя!"
10003070-64 = "Это всё меняет! Без своего лидера Дисциплинарный комитет — ничто!"
10003070-65 = "Вы просто стадо овец без пастуха! Мы уничтожим вас за то, что вчера вмешались в нашу битву. Это объявление войны!"
10003070-66 = "Ха-ха-ха! Вы ещё пожалеете, что связались с нами!"
10003070-67 = ""
10003070-70 = "Что?! Как они смеют! Да они же просто... Просто массовка!"
10003070-71 = "(Ако окончательно сорвалась...)"
10003070-72 = "Нам и по отдельности было тяжело с ними справляться. Как мы их остановим, если они объединились?"
10003070-73 = "Мне всё равно, насколько это трудно! Мы их остановим, и точка!"
10003070-74 = "У нас недостаточно людей. Может, сообщить главному пре—"
10003070-75 = "Отрицательно!"
10003070-76 = "Президентка только-только приняла идею отпуска! Мы не можем всё испортить сейчас!"
10003070-77 = "Может, хотя бы вызвать подкрепление из кампуса?"
10003070-78 = "Слишком рискованно! Президентка заметит."
10003070-79 = "Придётся обходиться теми, кто есть."
10003070-80 = "На этом этапе это почти невозможно."
10003070-81 = "Мне всё равно! Тогда сделайте невозможное возможным! Другого выхода нет!"
10003070-82 = "К счастью, время пока на нашей стороне. Нужно лишь придумать стратегию до того, как враги займут позиции."
10003070-83 = "Старший администратор! К отелю приближается небольшая группа противника!"
10003070-84 = "Что?! Кто?!"
10003070-85 = "Похоже, они несут мешки с неизвестным содержимым!"
10003070-86 = "С такого расстояния не разобрать невооружённым глазом, но содержимое кажется цилиндрическим и с бугристой поверхностью."
10003070-87 = "Это могут быть модифицированные гранаты-«ананасы»! Где они вообще достали такую контрабанду?!"
10003070-88 = "Подождите, нет! Визуальный контакт подтверждён! Контрабанда — это... кукуруза!"
10003070-89 = "А?"
10003070-91 = "Время фестиваля! Покупайте вкусную жареную кукурузу! Варёная тоже есть!"
10003070-92 = "Хи-хи. ВОТ теперь это похоже на фестиваль. ☆"
10003070-93 = "Соевый соус и масло тоже хороши, но ничто так не сочетается с кукурузой, как клубничный джем. Правда же?!"
10003070-94 = "Хватит есть и возвращайся к продажам! И даже не думай мазать клубничным джемом кукурузу клиентов!"
10003070-95 = "Ого, сегодня тут намного оживлённее."
10003070-96 = "Как мы и думали. На вкус жареной кукурузы влияет и размер толпы, в которой её едят."
10003070-97 = ""
10003070-99 = "Ну что ж! За шумный фестиваль! Пусть за ним лежит истинное гурманство!"
10003070-100 = "Не знаю, что это значит, но я обеими руками за шумный праздник. ☆"
10003070-102 = "..."
10003070-103 = "..."
10003070-104 = "Слов нет..."
10003070-105 = "Ещё один доклад! В трущобах собирается ещё одна сила!"
10003070-106 = "Как может быть ЕЩЁ кто-то?! Разве уже не все фракции сюда пришли?!"
10003070-107 = "Н-Нет, это совсем другие люди. Сейчас выведу на экран!"
10003070-110 = "Где есть горячий источник — там и мы!"
10003070-111 = "Клуб горячих источников..."
10003070-112 = "К-Клуб горячих источников?!"
10003070-113 = "Президентка услышала, что в тех водах есть подводный вулкан."
10003070-114 = "У неё какие-то грандиозные планы насчёт горячих источников с глубинной морской водой. Я в деталях не разбираюсь!"
10003070-115 = "Сейчас же иду начинать снос!"
10003070-116 = "Сожжём лес, снесём здания и вскипятим океан! Вот истинный дух развития!"
10003070-117 = "О, но не переживайте. Когда всё закончим, дадим вам бесплатные билеты в горячие источники."
10003070-118 = "Вот и вся история. Скоро увидимся! ♪"
10003070-119 = ""
10003070-121 = ""
10003070-122 = "Собирается примерно 200 их членов! Они тяжело вооружены: бульдозеры, экскаваторы и даже танки!"
10003070-123 = "В трущобах тоже собираются дополнительные силы! Оставшиеся бойцы Пляжных хулиганов Фубар и Банды в шлемах «Сплэши» пришли в движение!"
10003070-124 = "И это ещё не всё. Помимо студентов, визуально подтверждены автоматоны, танки и вертолёты!"
10003070-125 = "Что? По какой-то причине подтягиваются даже правонарушители из других районов. Похоже, они здесь как зрители!"
10003070-126 = "Да, но теперь они начали драться за лучшие места для просмотра!"
10003070-127 = "А Общество гурманов поставило прилавок с кукурузой прямо посреди главной дороги!"
10003070-128 = "Клуб горячих источников приближается с тяжёлой техникой! И почему-то теперь они сражаются с Обществом гурманов!"
10003070-129 = "Подтверждаю: хулиганы и гангстеры тоже начали драку на пляже!"
10003070-130 = ""
10003070-138 = ""
10003070-139 = "..."
10003070-140 = "..."
10003070-141 = "Ч-Что нам делать, старший администратор?"
10003070-142 = "Старший администратор Ако?! Пожалуйста, отдайте приказы!"
10003070-143 = "Я..."
10003070-144 = "Ты...?"
10003070-145 = "Я не знаю, что делать! Как я должна справиться со всем этим одна?!"
10003070-146 = "Одно за другим! Тушим один пожар — на его месте возникают два!"
10003070-147 = "Ако, тебе нужно успокоиться..."
10003070-148 = "Как мне успокоиться?!"
10003070-149 = "Нужно разработать стратегию."
10003070-150 = "Стратегию?! Какую ещё стратегию?! Это невозможно!"
10003070-151 = "Я думала, это самый тихий пляж во всей Геенне! Да тут скорее бушующее пекло Геенны! Жарко! Слишком жарко!!!"
10003070-152 = "То есть мы попали из огня да в полымя?"
10003070-153 = "Да, главный префект. Вы понимаете!"
10003070-154 = "Сидеть и жалеть себя ситуацию не исправит. Если бы только мы могли контратаковать..."
10003070-155 = "Каждая фракция многочисленна, но их союз полностью импровизирован. Единого командования нет."
10003070-156 = "Это их слабость. Если прорвём одну линию обороны, они полностью дезорганизуются!"
10003070-157 = "Согласна. Представьте концентрические круги, сходящиеся к нам, с отелем в центре. Достаточно разрушить одно построение, чтобы продвинуться."
10003070-158 = "Блестяще, главный префект! Вы так легко это придумали!"
10003070-159 = "Теперь нам остаётся провести операцию, не..."
10003070-160 = "...испортив ваш..."
10003070-161 = "..."
10003070-162 = "..."
10003070-163 = ""
10003070-164 = ""
10003070-165 = "..."
10003070-166 = ""
10003070-167 = ""
10003070-168 = "...отпуск."
10003070-169 = "..."
10003070-170 = "Г-ГЛАВНЫЙ ПРЕФЕКТ?!"
