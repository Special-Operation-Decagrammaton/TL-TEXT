[translation]
1005303-1 = "Секреты научной кулинарии"
1005303-2 = "Кухня Миллениума"
1005303-3 = ""
1005303-4 = "О-О! Сенсей?"
1005303-5 = "Ч-Что ты здесь делаешь?"
1005303-6 = "[s1] «Я слышал, ты здесь тренируешься готовить...»\n[s2] «Вот и решил тебе помочь.»"
1005303-7 = "...Не ожидала, что ты вообще придёшь..."
1005303-8 = "...Не ожидала, что ты вообще придёшь..."
1005303-9 = "Если бы знала, надела бы что-нибудь получше."
1005303-10 = "[s] «...Я ведь не мешаю?»"
1005303-11 = "Н-Нет! Совсем нет!"
1005303-12 = "Я просто... не хочу, чтобы ты видел, как я ошибаюсь..."
1005303-13 = "К тому же... если бы всё получилось, я хотела устроить тебе сюрприз с домашним обедом."
1005303-14 = "[s] «Домашняя еда от Юки...»"
1005303-15 = "...Что это за лицо?"
1005303-16 = "Ты ведь не представляешь, насколько ужасным получится вкус?"
1005303-17 = "Слушай, может, опыта в готовке у меня и немного, но научная теория, стоящая за ней, мне совершенно понятна."
1005303-18 = "Готовка — это обработка ингредиентов до легко усваиваемой формы, обычно с помощью нагревания или смешивания."
1005303-19 = "А в процессе настоящая готовка запускает множество физических и химических изменений в ингредиентах, вплоть до клеточного уровня."
1005303-20 = "Именно поэтому специалисты говорят, что кулинария — это наука."
1005303-21 = "А как мы все знаем, если идеально понимаешь научную теорию, ошибиться невозможно!"
1005303-22 = "[s3] «Мне кажется, научные эксперименты и готовка немного отличаются...»\n[s4] «И с какими блюдами ты собираешься экспериментировать?»"
1005303-23 = "Согласно популярной кулинарной книге «С этим справится даже новичок! Простые домашние ланчи на каждый день»..."
1005303-24 = "Согласно популярной кулинарной книге «С этим справится даже новичок! Простые домашние ланчи на каждый день»..."
1005303-25 = "Тушёный лопух, сосиски-осьминожки... и яичные рулетики должны подойти."
1005303-26 = "Начнём с лопуха!"
1005303-27 = "Так... Чтобы нейтрализовать горечь лопуха, добавьте столовую ложку уксуса в два литра воды..."
1005303-28 = ""
1005303-30 = ""
1005303-31 = "Хм..."
1005303-32 = "[s] «Что-то не так?»"
1005303-33 = "...Эй, Сенсей."
1005303-34 = "Какой температуры должны быть эти два литра воды?"
1005303-35 = "[s] «Разве это важно?»"
1005303-36 = "Конечно важно! Объём воды меняется в зависимости от температуры!"
1005303-37 = "А если моя вода другой температуры, чем у автора рецепта? Представляешь ошибки из-за разницы плотности!"
1005303-38 = "В зависимости от температуры плотность воды может отличаться до 0,040 грамма на миллилитр, а значит здесь возможна ошибка до 80 граммов..."
1005303-39 = "Если взять воду горячее, чем предполагает рецепт, лопух получится слишком кислым..."
1005303-40 = "[s5] «Не думаю, что это вообще что-то изменит...»\n[s6] «Не переживай так. Просто готовь.»"
1005303-41 = "Но если не переживать, я начинаю тревожиться..."
1005303-42 = "Но если не переживать, я начинаю тревожиться..."
1005303-44 = "И Юука продолжила переживать."
1005303-46 = "С-Сенсей, что делать? В рецепте нужен коричневый сахар, а у нас только белый!"
1005303-47 = "А вдруг белый сахар вступит в реакцию с другими ингредиентами и вызовет химические изменения, которые полностью изменят вкус блюда?"
1005303-49 = "Господи. Тут написано кипятить две минуты при 60 градусах, а температура уже дошла до 50..."
1005303-50 = "Постой, сколько ещё секунд теперь нагревать, чтобы компенсировать? И вообще, сколько тепла вообще считается нагреванием?!"
1005303-52 = "С-Сенсей! Яичные рулетики в порядке? Они точно правильно готовятся?!"
1005303-53 = "П-Перестань смеяться и помоги мне!"
1005303-57 = "Всё... Готово..."
1005303-58 = "Я... закончила! Мой первый домашний ланч!"
1005303-59 = "[s] «Три часа...»"
1005303-60 = "На всё уходит столько времени, сколько нужно, ясно!"
1005303-61 = "Это был мой первый раз, и контролировать температуру оказалось сложнее, чем я думала, и..."
1005303-62 = "...И я не хотела опозориться перед Сенсеем [USERNAME]."
1005303-63 = "[s] «Можешь не переживать, ты не опозорилась.»"
1005303-64 = "Но если приготовление обеда занимает три часа, готовить еду накануне фестиваля будет непрактично."
1005303-65 = "...Может, просто закажу еду или попрошу друзей помочь."
1005303-66 = ""
1005303-68 = ""
1005303-70 = ""
1005303-71 = "А то, что я приготовила сегодня... Угощайся, Сенсей."
1005303-72 = "[s] «Ты уверена? Всё-таки это твой первый домашний ланч.»"
1005303-73 = "Именно поэтому я и хочу, чтобы ты его съел."
1005303-74 = ""
1005303-76 = ""
1005303-77 = "К-Конечно, только как дегустатор! После первой попытки важна обратная связь! Я вовсе не вкладывала в это ничего особенного!"
1005303-78 = ""
1005303-80 = ""
1005303-82 = ""
1005303-83 = "...Так что, эм, потом скажи, понравилось тебе или нет."
1005303-85 = "Я забрал ланч Юки с собой в Шале и съел его на ужин."
1005303-86 = "...Он немного остыл, но всё равно был вкусным."
