[translation]
1012302-1 = "Перемены в отношениях"
1012302-2 = "Вход в Шале"
1012302-3 = "Я ждал, нахмурившись и беспокоясь из-за сообщения Сейи."
1012302-4 = ""
1012302-8 = "Как я и думала... Вы уже ждёте меня, Сенсей."
1012302-9 = "Я думала передумать, но не хотела доставлять вам лишние хлопоты."
1012302-10 = "[s1] «Сейя...?!»\n[s2] «Спортивная машина...?!»"
1012302-13 = ""
1012302-18 = ""
1012302-19 = "[ns3] «...Ку... купальник?»\n[ns4] «Что... происходит?»"
1012302-22 = "Всему своё время."
1012302-23 = "Если вы не против... Не могли бы вы сесть рядом?"
1012302-24 = ""
1012302-26 = ""
1012302-27 = "Ха, какое у вас интересное выражение лица."
1012302-28 = "Не стоит волноваться. Я никогда не подвергла бы вас опасности... намеренно."
1012302-29 = "Для начала покинем центр города? Не хотелось бы, чтобы кто-нибудь нас заметил."
1012302-30 = "...Прошу прощения?"
1012302-31 = "...А, вы об этой машине?"
1012302-32 = "Верно. Наверное, вы впервые её видите."
1012302-33 = "Она вполне сгодится. Хорошо мне служит. Несмотря на моё положение, я довольно часто вожу сама."
1012302-34 = "У меня есть машина, скутер... и даже яхта. Возможно, когда-нибудь я вам их покажу."
1012302-35 = ""
1012302-37 = ""
1012302-38 = ""
1012302-39 = "Так, хватит болтовни. Присаживайтесь."
1012302-40 = "[s5] «Х-хорошо...»\n[s6] Сесть на переднее пассажирское сиденье."
1012302-43 = ""
1012302-49 = "Фу-фу..."
1012302-50 = "Поехали."
1012302-51 = ""
1012302-54 = "Мы выехали из города и направились к окраинам."
1012302-55 = "Всю дорогу Сейя улыбалась, но не произнесла ни слова."
1012302-56 = "Мы почти приехали... быстрее, чем я ожидала."
1012302-57 = "Мм..."
1012302-58 = "...Запах моря. Приятный."
1012302-59 = ""
1012302-63 = ""
1012302-67 = "― [log=세이아 수영복]Ветер здесь такой освежающий[/log][wa:1580]"
1012302-69 = "― [log=세이아 수영복]и прохладный.[/log]"
1012302-72 = "― [log=세이아 수영복]И машин вокруг нет...[/log][wa:10]"
1012302-74 = "― [log=세이아 수영복]Здесь хорошо.[/log]"
1012302-77 = "― [log=세이아 수영복]Как вам поездка? Удивились?[/log][wa:2790]"
1012302-80 = "― [log=세이아 수영복]Наверное, всё вышло внезапно[/log]"
1012302-82 = "[wa:100]"
1012302-85 = "― [log=세이아 수영복]и неожиданно.[/log]"
1012302-87 = "[wa:100]"
1012302-90 = "― [log=세이아 수영복]Судя по вашему выражению лица...[/log][wa:410]"
1012302-92 = "― [log=세이아 수영복]Я рада, что мы сюда приехали.[/log]"
1012302-95 = "― [log=세이아 수영복]Никакого особого смысла в этом нет.[/log][wa:10]"
1012302-97 = "― [log=세이아 수영복]Просто однажды мне захотелось так сделать.[/log][wa:240]"
1012302-100 = "― [log=세이아 수영복]Как это там называется...?[/log][wa:1460]"
1012302-103 = "― [log=세이아 수영복]...Похищение?[/log][wa:90]"
1012302-106 = "― [log=세이아 수영복]Хе-хе... Я просто шучу.[/log][wa:1140]"
1012302-109 = "― [log=세이아 수영복]Но всё же...[/log][wa:730]"
1012302-111 = "― [log=세이아 수영복]Да.[/log]"
1012302-114 = "― [log=세이아 수영복]Пока я не отвезу вас домой,[/log]"
1012302-116 = "― [log=세이아 수영복]будем считать, что я не шучу.[/log][wa:10]"
1012302-119 = "Мы приехали. Давайте немного отдохнём."
1012302-120 = ""
1012302-126 = "Как я уже говорила... Ничего серьёзного не случилось."
1012302-127 = "Я сказала, что дело срочное, но... Как бы это сформулировать?"
1012302-128 = "Мне срочно захотелось привезти вас сюда...? Примерно так."
1012302-129 = "...Вы разочарованы? Потому что надеялись на опасность и острые ощущения?"
1012302-130 = "Или... сердитесь, потому что чувствуете себя обманутым?"
1012302-131 = "[s7] «Ну... пожалуй, я немного удивился!»\n[s8] «Можно было просто сказать мне с самого начала.»"
1012302-134 = "Фу-фу."
1012302-135 = "Фу-фу-фу..."
1012302-136 = "...Ах, простите. Мне просто показалось это немного забавным."
1012302-137 = "Уверена, раньше вы бы сказали что-нибудь скучное вроде «Хорошо, что ничего серьёзного не случилось»."
1012302-138 = "Но теперь, когда мы стали ближе... вы хотя бы не стесняетесь жаловаться, верно?"
1012302-139 = "Что ж, полагаю, очевидно, чего я хочу. Бывали случаи, когда я вас бросала, когда намеренно вам лгала..."
1012302-140 = "Так как же это сказать...?"
1012302-141 = "Мне кажется, то, как вы ко мне относитесь, понемногу меняется."
1012302-142 = "И если я ещё немного надавлю... возможно, однажды вы отругаете меня как обычного студента."
1012302-143 = "...Если повезёт."
1012302-144 = "Сделать что-нибудь ребяческое, получить выговор, неодобрительный взгляд и усталый вздох..."
1012302-145 = "Как это там называется? М-м-м..."
1012302-146 = "[s9] «...Эх.»\n[s10] Посмотреть с неодобрением."
1012302-149 = ""
1012302-151 = ""
1012302-152 = "...!!"
1012302-153 = "Хе-хе, хи-хи..."
1012302-154 = "Понятно. Вот чего мне не хватало."
1012302-155 = "Неплохо. Ощущается лучше, чем я ожидала. Может, войдёт в привычку."
1012302-156 = ""
1012302-158 = ""
1012302-159 = ""
1012302-160 = "...Шучу."
1012302-161 = "Если точнее, я бы с удовольствием... но самоконтроль у меня всё-таки есть."
1012302-162 = "[s11] «Такие шалости вполне допустимы.»\n[s12] «Я не против тебе подыграть.»"
1012302-165 = ""
1012302-167 = ""
1012302-168 = "...Понятно. Значит, вот ваш ответ."
1012302-169 = "Я поняла. Придётся держать себя в руках. Вы доверяете мне в этом, Сенсей?"
1012302-170 = "...Или снова ответите чем-нибудь скучным?"
1012302-171 = "[s13] «Тебе это подходит, Сейя.»\n[s14] «Хм, а я думал, тебе понравится.»"
1012302-174 = "...Фуфу."
1012302-175 = "Пристегнитесь, пожалуйста. Похищение окончено, пора отвезти вас домой."
1012302-176 = ""
1012302-178 = ""
1012302-179 = ""
1012302-180 = "Хотя... насчёт следующего раза ничего не обещаю."
1012302-183 = "Она отвезла меня обратно в Шале."
1012302-184 = "Всю обратную дорогу Сейя молчала и лишь мягко улыбалась."
