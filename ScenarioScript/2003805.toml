[translation]
2003805-1 = "Девушка с рекламного плаката"
2003805-2 = "Вы не только привели меня в новый вкусный ресторан, но ещё и настаиваете, чтобы заплатить..."
2003805-3 = "Боюсь, мой долг перед вами становится слишком большим, Сенсей."
2003805-4 = "[s1] «Настоящая тяжесть появляется, только если считать это долгом.»\n[s2] «Я всё ещё знаю Шаньхайцзин лучше тебя, Томоэ!»"
2003805-7 = "Понятно."
2003805-8 = "В таком случае я с достоинством приму вашу доброту. Спасибо, Сенсей."
2003805-9 = "Извините. Можно меню?"
2003805-10 = ""
2003805-12 = ""
2003805-13 = ""
2003805-14 = "Да... Спасибо. Вот оно."
2003805-15 = "...?"
2003805-16 = ""
2003805-18 = ""
2003805-19 = "(Лицо хозяина... что-то не так.)"
2003805-20 = "(Голос тихий, выражение мрачное.)"
2003805-21 = "(Если присмотреться, ресторан довольно пуст, хотя сейчас самый обеденный час.)"
2003805-22 = ""
2003805-24 = ""
2003805-25 = "[ns] «Что будешь, Томоэ?»"
2003805-26 = ""
2003805-28 = ""
2003805-29 = "О, да. Я бы хотела заказать..."
2003805-33 = ""
2003805-34 = "[ns] «Ух. Я наелся.»"
2003805-35 = "Вы действительно насладились едой, Сенсей."
2003805-36 = "Я ведь тоже не сказала ни слова?"
2003805-37 = "Хи-хи-хи. Полагаю, это означает, что еда была действительно вкусной, да?"
2003805-38 = "[s] «Счёт, пожалуйста. Спасибо за прекрасный обед.»"
2003805-39 = "Вам понравилась еда? Какое облегчение..."
2003805-40 = "С тех пор как мы пришли, я не могу отделаться от одной мысли..."
2003805-41 = "Господин, вас что-то беспокоит?"
2003805-42 = "А? Нет-нет. Ничего. Главное, что вам понравилась еда."
2003805-43 = "Ваши тяжёлые вздохи и подавленное поведение говорят об обратном."
2003805-44 = "..."
2003805-45 = "Ладно, если честно... в последнее время у ресторана много проблем."
2003805-46 = "Почему?"
2003805-47 = "Просто посмотрите на телевизор. Он ответит на ваши вопросы."
2003805-49 = "Снова с вами Канал Здоровья! Скажите, вам знакомо такое чувство?"
2003805-50 = "Вы только что вкусно поели, но вдруг сердце начинает колотиться, тело становится вялым! Желудок горит! Вам... плохо!"
2003805-51 = "Мы на Канале Здоровья подробно разобрались, почему так происходит — специально для вас!"
2003805-52 = "О боже! Исследования показывают, что причиной может быть китайская кухня!"
2003805-53 = "У этого явления даже есть название! «Синдром китайской кухни»!"
2003805-54 = "Этот синдром возникает из-за огромного количества соли, свиного жира, глутамата натрия и специй, используемых при приготовлении китайской еды!"
2003805-55 = "Это лишь гипотеза, но считается, что китайская еда может приводить к накоплению жира в артериях, усталости и боли в мышцах."
2003805-56 = "Более того, она разрушает семьи! Возможно, именно она станет причиной краха самого общества! В такой реальности—"
2003805-57 = ""
2003805-60 = ""
2003805-61 = "...Угх. Я больше не могу это смотреть."
2003805-62 = "Простите. Не стоило показывать вам такую мерзость."
2003805-63 = "В последнее время программы о здоровье выставляют китайскую кухню вредной..."
2003805-64 = "Поэтому клиентов стало меньше, и продажи, полагаю, сильно упали. Наверняка все заведения испытывают трудности."
2003805-65 = "[s] «...Может, выйдем и посмотрим?»"
2003805-66 = ""
2003805-67 = "И правда. На улице почти никого."
2003805-68 = "Рестораны должны быть особенно загружены в часы обеда и ужина."
2003805-69 = "..."
2003805-70 = "Я приняла решение, Сенсей."
2003805-71 = "[s] «Ч-Что ещё?!»"
2003805-72 = "По возможности я не хотела вмешиваться в дела другой академии..."
2003805-73 = "...но пока я была в Шаньхайцзине, меня угощали такой вкусной китайской едой."
2003805-74 = "Я просто не могу это игнорировать. Закрывать глаза на такую важную проблему..."
2003805-75 = "Что я собираюсь делать?"
2003805-76 = "Для начала переместимся на площадь."
2003805-77 = ""
2003805-78 = "[ns3] «Ну, мы на площади.»\n[ns4] «Что именно ты задумала, Томоэ?»"
2003805-81 = "Хи-хи-хи. Ну..."
2003805-82 = "Это наше право на собрания, Сенсей!"
2003805-83 = "[s] «Право на собрания?!»"
2003805-84 = "Да! Я произнесу речь прямо здесь, на площади. Прохожие услышат мою правду!"
2003805-85 = "Всё больше людей станут слушать, и слухи о китайской кухне исчезнут."
2003805-86 = "А теперь позвольте мне начать речь о вкусной китайской кухне!"
2003805-87 = ""
2003805-89 = ""
2003805-92 = "Томоэ начала страстную речь посреди площади."
2003805-93 = ""
2003805-94 = "Добрый день, ученики Шаньхайцзина. Вы сегодня уже ели?"
2003805-95 = "Сегодня я пришла рассказать вам сокрушительную правду! Правду, которую власть пыталась от вас скрыть!"
2003805-96 = "Ходит множество слухов о негативном воздействии китайской кухни."
2003805-97 = "Говорят, она вредна для тела и сердца. Один укус — и вас охватывает вялость. Желудок начинает гореть."
2003805-98 = "Но всё это бессмысленные, ничем не подтверждённые слухи!"
2003805-99 = ""
2003805-101 = ""
2003805-102 = ""
2003805-103 = "Эм... но разве свиной жир не вреден?"
2003805-104 = "Да, говорят, он забивает артерии..."
2003805-106 = "Я знаю, что говорят! Но сейчас я разберу ложь о свином жире по кусочкам!"
2003805-107 = "Для начала, свиной жир — хороший источник витаминов группы B и минералов. Более того, в нём меньше насыщенных жиров, чем в баранине или говядине, что на самом деле делает его полезнее для артерий!"
2003805-108 = "А главное — свиной жир вкусный! Его даже можно использовать вместо масла, и при этом в нём в три раза меньше холестерина!"
2003805-109 = "Ваши любимые лунные пряники ведь тоже делают со свиным жиром? В Красной Зиме мы солим свиной жир и едим его с хлебом. Это отличный источник пищи, чтобы пережить холодную зиму!"
2003805-110 = "Говорить, будто китайская кухня, которая использует качественный свиной жир чаще любой другой, вредна для здоровья, совершенно нелепо! Это клевета, и..."
2003805-112 = "...Томоэ по очереди развенчала множество заблуждений о свином жире и китайской кухне в целом."
2003805-113 = ""
2003805-114 = "...Именно поэтому утверждение, что китайская кухня вредна для здоровья, — заговор Канала Здоровья! Они работают против вас, чтобы оставить всю эту потрясающую кухню себе!"
2003805-115 = "Все, на чьей вы стороне? На стороне правды, со мной? Или на стороне Канала Здоровья, который врёт вам ради собственной выгоды?!"
2003805-116 = ""
2003805-118 = ""
2003805-119 = ""
2003805-120 = "Т-Тогда... получается, китайская кухня не вредна, а наоборот может быть полезной для здоровья?"
2003805-121 = "Похоже на то? Там ведь много свиного жира, а она сказала, что он очень полезен..."
2003805-122 = "К тому же мы всю жизнь едим китайскую еду."
2003805-123 = "Точно! Если бы от неё были проблемы, мы бы уже давно их почувствовали!"
2003805-124 = "Давно не были там. Может, сходим на улицу китайской кухни?"
2003805-125 = "Да! Наедимся от души!"
2003805-126 = ""
2003805-128 = ""
2003805-131 = "[ns5] «Будто единый разум... »\n[ns6] «Они все побежали на улицу китайской кухни...!»"
2003805-134 = ""
2003805-135 = "Хи-хи-хи. Похоже, навыки публичных выступлений я ещё не растеряла."
2003805-136 = "[s] «Но разве говорить, что китайская еда полезна, тоже не немного нечестно?»"
2003805-137 = "Что ж."
2003805-138 = "Прикрывать одну ложь другой — сама основа пропаганды."
2003805-140 = "После этого улица китайской кухни не только вернула потерянную выручку, но и заработала ещё больше..."
2003805-141 = "Новости продолжали распространяться, и в Кивотосе даже начался небольшой бум китайской кухни..."
