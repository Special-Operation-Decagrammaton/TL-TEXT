[translation]
10011040-1 = "Эпизод 4;Первое препятствие: лицо и телохранитель"
10011040-3 = ""
10011040-7 = ""
10011040-8 = "*тяжело дышит* *тяжело дышит* ...Мы... мы правда это сделали."
10011040-9 = "Мы правда... похитили её!"
10011040-10 = "Э-Это ведь довольно серьёзно... да?"
10011040-12 = "Не колебаться! Вы не забыли нашу цель?"
10011040-14 = "Н-Никогда, лидер!"
10011040-15 = "Мы похищаем звезду «Принцессы Вараку», чтобы встреча обмена полностью сорвалась!"
10011040-16 = "И у клуба Инь-Ян не останется выбора, кроме как принять наши требования!"
10011040-17 = "Да, именно. И наш план безупречен."
10011040-18 = "Мы посоветовались с маэстро преступности, известным как «Профессор Самодовольство», на сайте AskKivotos.com."
10011040-19 = "Профессор Самодовольство?"
10011040-20 = "Это не тот печально известный преступник, которого разыскивает даже школа Кронос?!"
10011040-21 = "Тот самый. Значит, наш план идеален."
10011040-22 = "Если мы всё выполним правильно, и Хяккияко, и Генна поймут, что Вольные Морё — сила, с которой нужно считаться."
10011040-24 = "А главное — мы действительно похитили знаменитую принцессу Чисэ!"
10011040-25 = "Знаю, что всё получилось, но сердце всё ещё колотится."
10011040-26 = "Может, один взгляд на её миленькое личико тебя успокоит. Хе-хе."
10011040-28 = ""
10011040-32 = ""
10011040-34 = ""
10011040-35 = ""
10011040-36 = ""
10011040-38 = "Та-дам! Это Ибуки!"
10011040-39 = "Хе-хе! Ироха будет так гордиться! Ибуки не испугалась!"
10011040-40 = "Что дальше?"
10011040-41 = ""
10011040-43 = ""
10011040-45 = ""
10011040-46 = ""
10011040-47 = "Да кто это вообще?!"
10011040-48 = "(Что это за форма?! Мы что, похитили члена Общества Пандемония Генны?)"
10011040-49 = "Я думала, наконец-то смогу получить автограф Чисэ!"
10011040-50 = "Эх, вот отстой."
10011040-51 = "«Отстой»?! И это всё, что ты можешь сказать?"
10011040-53 = "А?"
10011040-54 = ""
10011040-56 = ""
10011040-58 = ""
10011040-59 = "Эй вы! Что вы делаете?!"
10011040-61 = "Как они так быстро нас догнали?!"
10011040-62 = ""
10011040-64 = ""
10011040-67 = ""
10011040-68 = "Мероприятие уже началось! Давайте, роль похитителей тоже очень важна. Отнеситесь к ней серьёзно."
10011040-70 = "П-Президент Отдела организации фестивалей?!"
10011040-71 = "Вы что, не слушали на репетиции? Ваш путь отхода — туда."
10011040-72 = "...Вы поможете нам сбежать?"
10011040-73 = "Погодите, я слышала слухи!"
10011040-74 = "Говорят, президент Отдела организации фестивалей — бессердечная деляга, которая всегда ищет, где урвать прибыль."
10011040-75 = "Неужели Профессор Самодовольство продумал всё настолько далеко?"
10011040-77 = "Н-Наверняка!"
10011040-78 = "Вы что, срочные дублёры? Вас вообще никто не инструктировал?"
10011040-79 = "Ух, неважно! Давайте, сюда!"
10011040-80 = "Х-Хорошо?"
10011040-81 = ""
10011040-83 = ""
10011040-86 = "Знаете, костюмы у них были подозрительно реалистичные."
10011040-87 = "Представьте, если бы это и правда были Морё? Хорошо, что они точно не станут срывать встречу обмена."
10011040-88 = ""
10011040-90 = ""
10011040-91 = "По расписанию мероприятия дальше..."
10011040-92 = ""
10011040-94 = ""
10011040-95 = "Президент! Пина прибыла на службу!"
10011040-96 = "Как раз вовремя, Пина. Наш выход!"
10011040-100 = "Эти придурки Морё наверняка убежали сюда!"
10011040-101 = "Я, Изуна, ни за что не позволю им уйти!"
10011040-102 = "М-Мы идём...!"
10011040-104 = "Хи-хи!"
10011040-105 = ""
10011040-108 = ""
10011040-109 = ""
10011040-111 = ""
10011040-112 = "Стоять!"
10011040-113 = "Дальше не пройдёте!"
10011040-114 = ""
10011040-116 = ""
10011040-118 = "А?"
10011040-119 = "[s] «...Шизуко и Пина?»"
10011040-121 = "Ого! Я знала, что представление будет популярным, но не думала, что даже Сенсей примет участие... И ещё куча девушек-ниндзя..."
10011040-122 = "Какой приятный сюрприз!"
10011040-123 = "И как печально! Наши бывшие товарищи по борьбе со злым повелителем Датэ Мяуру теперь стали врагами!"
10011040-124 = "Путь мстителя так печален! Так жесток!"
10011040-125 = "[s] «Что это за странная история про Мяуру, которая всё время всплывает?!»"
10011040-127 = "Вы же из Момоёдо? Зачем вам мешать нам? Только не говорите... Вы работаете с Морё?"
10011040-128 = "О! Теперь я тебя узнала. Ты та странная лидерша, которая целыми днями играет в ниндзя!"
10011040-129 = "Кого это ты назвала странной?!"
10011040-130 = "[s] «Вообще-то Момоёдо сами довольно странные.»"
10011040-131 = "Мы? Странные?"
10011040-133 = "Я-я-я всё знаю о Момоёдо! Это ужасное место, где вас подвергают м-маниакальному и тревожному обслуживанию... а потом в-в-влепляют астрономический счёт!"
10011040-134 = "Ниндзя не попадётся на тёмную сторону индустрии вроде вашей!"
10011040-135 = "Вы всё неправильно поняли! Где вы вообще это услышали?!"
10011040-136 = "[s] «Обслуживание в Момоёдо и правда довольно маниакальное...»"
10011040-137 = "И ты, Сенсей?!"
10011040-138 = "Я просто отвечаю за первое препятствие!"
10011040-140 = "Препятствие...?"
10011040-141 = "Ты имеешь в виду испытание в представлении?"
10011040-142 = "Да, добро пожаловать на первое испытание!"
10011040-143 = "Это препятствие называется «Лицо и телохранитель»!"
10011040-144 = "А я, звезда и владелица Момоёдо, Кавава Шизуко, — его хранитель!"
10011040-145 = "И я тоже! Я Пина!"
10011040-146 = "Наверняка вам интересно, почему именно меня выбрали хранителем первого препятствия? Хе-хе. Сразу к делу!"
10011040-148 = "Потому что я, Шизуко, как лицо Момоёдо идеально подхожу на роль первого лица, которое приветствует вас в этом приключении!"
10011040-149 = ""
10011040-152 = ""
10011040-154 = ""
10011040-155 = "[ns] «Это должно было быть круто? Смешно? Нам уже смеяться?»"
10011040-157 = "У-а-а-а?!"
10011040-158 = "Забудьте! Мне всё равно не нужен ваш смех из жалости!"
10011040-159 = "И сценарий мне не нужен. Начну заново!"
10011040-160 = "Отважные герои, пришедшие спасти похищенную принцессу, я Шизуко, лицо Момоёдо!"
10011040-161 = "А я её телохранитель, Пина! Победите нас, иначе дальше не пройдёте!"
