[translation]
10010065-1 = "Эпизод 6;Бегущая светошумовая граната Тринити, часть 2"
10010065-5 = "*кашель* *кашель* *задыхается*"
10010065-6 = "Ч-Что произошло?! Как мы опять проиграли?! Ты же сказала, что в этот раз такого не будет!"
10010065-7 = "Откуда мне было знать, что у неё будет подкрепление?!"
10010065-8 = "Серьёзно, да кто это вообще была? Она появилась из ниоткуда!"
10010065-10 = "П-Пожалуйста, прекратите драться! Давайте всё мирно обсудим!"
10010065-11 = "Ты это говоришь ПОСЛЕ того, как тут всё из пулемёта прошила?!"
10010065-12 = "Этот пулемёт... Вот уж действительно сначала стреляет, потом задаёт вопросы..."
10010065-13 = "Я-я просто пыталась не дать ситуации выйти из-под контроля ещё сильнее."
10010065-14 = "Вы пришли мне на помощь. Не знаю, кто вы, но спасибо."
10010065-15 = "И вам, и вашему спутнику."
10010065-16 = "Погодите... Сенсей?"
10010065-17 = "[s1] «Привет, Сузуми.»\n[s2] «Ты ведь не пострадала?»"
10010065-18 = "З-здравствуйте. Не ожидала увидеть вас здесь."
10010065-19 = "Н-Нет, совсем нет. Благодаря вам двоим я в порядке."
10010065-20 = "Что вы здесь делаете, Сенсей?"
10010065-21 = "Вы пошли за чем-то, услышали шум и решили узнать, что происходит?"
10010065-22 = "Это так на вас похоже. Всегда ищете, кому можно помочь."
10010065-23 = "Хотела бы я, чтобы больше людей были такими, как вы, Сенсей. Мне было бы гораздо проще."
10010065-24 = "Что вы ищете? Раз уж вы помогли мне, я тоже хочу помочь вам это найти.#nМожете рассказать всё с самого начала?"
10010065-26 = "Клей из сфагнового мха...?"
10010065-27 = "Хм. Никогда о таком не слышала."
10010065-28 = "Но я знаю, где есть старое заброшенное здание."
10010065-29 = "Если ходить только по главным улицам, такие места не встретишь,#nно в переулках они бывают."
10010065-30 = "Во время патрулей я натыкалась на такие здания.#nОдно должно быть совсем недалеко отсюда."
10010065-31 = ""
10010065-33 = ""
10010065-35 = "...!"
10010065-36 = "Эй! Подождите!"
10010065-37 = "...?"
10010065-38 = "То старое здание, о котором вы только что говорили..."
10010065-39 = "Вы же не про наше убежище, правда?!"
10010065-40 = "Хм? Именно про него. А что?"
10010065-41 = "Вы с ума сошли?! Хотите сказать, что собираетесь снести наше убежище?!#nКуда нам деваться, если вы нас выгоните?!"
10010065-42 = "Я такого не говорила. Не понимаю, почему вы сразу сделали такой вывод..."
10010065-43 = "Сенсею нужен лишь тот клей, который, похоже, можно найти в оконных рамах."
10010065-44 = "Думаете, мы в это поверим?! Вы просто хотите нас уничтожить!"
10010065-45 = "Уничтожить вас? Это уже слишком..."
10010065-46 = "Это вообще ненормально! У нас тоже есть права!"
10010065-47 = "Мы просто пытаемся выжить в этом д-долбаном мире...!#n*всхлип* Уа-а-а-а!"
10010065-48 = "Эм..."
10010065-49 = "Не нужно плакать. Я ведь сказала, что ничего такого не имела в виду..."
10010065-50 = "[s3] «Пусть сначала выплачется, а потом поговорим.»\n[s4] «Нам стоит выслушать их.»"
10010065-51 = "Ну... хорошо. Если вы так считаете, Сенсей."
10010065-52 = "Ну... хорошо. Если вы так считаете, Сенсей."
10010065-54 = "*шмыг* Куда нам идти, если нас выгонят из убежища?"
10010065-55 = "Не то чтобы нам нравилась преступная жизнь, ясно?! Мы просто пытаемся выжить!"
10010065-56 = "А теперь из-за судимостей нас даже на собеседования на подработку не зовут."
10010065-57 = "У нас нет денег на аренду, а в общежития не берут из-за плохих оценок. Оценки плохие, потому что нам негде учиться. Замкнутый круг!"
10010065-58 = "Теперь понимаете? Нормальная жизнь — это привилегия, которой у нас нет!"
10010065-59 = "Хотя нормальным людям вроде вас этого не понять."
10010065-61 = "Но я...!"
10010065-62 = "[s5] «Возможно, я могу что-то—»\n[s6] «Если хотите, я мог бы—»"
10010065-65 = "У меня есть идея."
10010065-67 = ""
10010065-68 = "[ns] «Хината?»"
10010065-69 = "...?"
10010065-71 = "О чём ты?"
10010065-72 = "Думаю, мы могли бы вам помочь... если вы не против поработать при церкви."
10010065-73 = "Церкви? Погодите, вы имеете в виду собор или что-то такое?"
10010065-74 = "Эта одежда... Вы из Сестринства, да?"
10010065-75 = "Да, верно. Она сделана по образцу нашей традиционной одежды."
10010065-76 = "П-Погодите. Тут что-то не сходится."
10010065-77 = "Не может быть, чтобы вы были настоящей Сестрой... Не после того, как вы дра—"
10010065-78 = ""
10010065-80 = ""
10010065-82 = "Конечно она настоящая Сестра! Она просто хотела сказать, что мы приняли вас за... ещё одну фанатку Светошумовой гранаты Тринити! Да, именно!"
10010065-83 = "Сейчас у неё столько подражателей, что мы подумали, будто вы тоже одна из них и нарядились Сестрой для косплея или вроде того... Да..."
10010065-84 = "К-Косплея?"
10010065-85 = "Нет, вовсе нет! Я самая настоящая — прямо из Сестринства!"
10010065-86 = "Я рада, что вы рассказали нам о своей ситуации. Я и не знала, что вам приходится настолько тяжело."
10010065-87 = ""
10010065-89 = ""
10010065-90 = "Позвольте нам, пожалуйста, помочь вам."
10010065-92 = "Если вам нужна работа, при соборе всегда нужны волонтёры."
10010065-94 = "Мы некоммерческая организация, поэтому платить деньгами не сможем, но с радостью предоставим жильё и питание на время волонтёрства."
10010065-95 = "А после первого месяца волонтёрства мы даже сможем написать вам рекомендательные письма, чтобы вы могли искать оплачиваемую работу."
10010065-97 = "Работа может быть тяжёлой, и к ней придётся привыкнуть..."
10010065-98 = "...но мы будем рядом на каждом этапе и поможем."
10010065-99 = ""
10010065-101 = ""
10010065-102 = ""
10010065-104 = ""
10010065-105 = "П-Почему вы так добры к нам?"
10010065-106 = "Вам правда не мешает, что такие, как мы, будут там работать? Вы же ничего от этого не получите.#nЯ не понимаю..."
10010065-107 = "Ничего не получим? Мы вовсе не ради выгоды это делаем.#nМы — Сестринство."
10010065-108 = "Что?"
10010065-109 = ""
10010065-110 = "Цель Сестринства — чтобы каждый не только в Тринити, но и во всём Кивотосе обрёл спокойствие в жизни."
10010065-111 = "Это наша миссия. Если вы обретёте покой, мы будем счастливы."
10010065-112 = "Х-Хватит дурачиться."
10010065-113 = "Думаете, мы купимся на эти сладкие речи?"
10010065-114 = "УА-А-А-А-А! *всхлип*"
10010065-115 = "...?!"
10010065-116 = "...?!"
10010065-117 = "[s7] «Кажется, сработало.»\n[s8] «Ну-ну. Всё будет хорошо.»"
10010065-118 = "Мы правда сможем завязать с преступной жизнью, да? Сможем работать на обычной работе?"
10010065-119 = "Мы правда сможем завязать с преступной жизнью, да? Сможем работать на обычной работе?"
10010065-120 = "Нам больше не придётся бояться, что Комитет правопорядка арестует нас, когда мы идём в кино? Или в кафе? В игровой зал?"
10010065-121 = "Я согласна! Буду волонтёрить где угодно!"
10010065-122 = "Это замечательно. Конечно, присоединяйтесь к нам."
10010065-123 = ""
10010065-125 = ""
10010065-126 = "В нашем Сестринстве мы всё делаем вместе. Вместе принимаем душ..."
10010065-127 = ""
10010065-128 = "Вместе едим... Вместе живём! Вам вообще не о чем переживать."
10010065-130 = "*всхлип* Я так счастлива!"
