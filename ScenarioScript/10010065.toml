10010065-137 = "Ага. Наверное..."
10010065-138 = "Можете делать с нашим старым убежищем что угодно, лишь бы найти этот клей.#nОно нам больше не нужно."
10010065-139 = ""
10010065-141 = ""
10010065-143 = "У меня нет слов. Даже не знаю, как вас отблагодарить за всю помощь.#nТеперь здесь должно стать намного спокойнее."
