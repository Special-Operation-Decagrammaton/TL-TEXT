[translation]
213-1 = "Йесод, Основа чистоты и силы"
213-2 = ""
213-3 = ""
213-4 = "А, Сенсей! Добро пожаловать!"
213-5 = "Я вас ждала, ха-ха-ха!"
213-6 = "Хм? Со стороны выглядело, будто я дремала...?"
213-7 = "Н-Неправда! Я совсем не этим занималась..."
213-8 = "Я... медитировала! Да, точно! Просто медитировала!"
213-9 = "Видите? Я знала, что вы поймёте, Сенсей!"
213-10 = "Хм? Так что случилось? А, точно. Я должна была с вами о чём-то поговорить."
213-11 = ""
213-13 = ""
213-14 = "...О чём?"
213-15 = "Н-Нет! Я не придумываю повод с вами поговорить! То есть с вами весело, но в этот раз действительно было что-то важное! Что-то... очень важное... Это... эм...!"
213-16 = "А! Вспомнила!"
213-17 = "Слушайте, Сенсей. Происходит одна очень интересная... нет, серьёзная вещь."
213-18 = "Говорят, из ниоткуда появилась гигантская структура в форме стены. Прямо в открытом море, где даже нормального фарватера нет!"
213-19 = "Очень странно, правда? Сначала я хотела просто списать это на очередной дурацкий слух."
213-20 = "Но надо было хотя бы проверить, да? Поэтому я отправила туда разведывательный дрон."
213-21 = "И как только он прибыл, прислал мне одну-единственную фотографию — и пуф! Полностью исчез."
213-22 = "Я подумала, что это просто небольшая турбулентность, и отправляла всё новые и новые. Но происходило то же самое."
213-23 = "Зато одну вещь подтвердить удалось."
213-24 = "Та загадочная стена действительно существует!"
213-25 = "И ещё часть стены умеет трансформироваться! Она выглядела как гигант!"
213-26 = "Представляете? Огромная гигантская штука стоит на таинственной морской стене."
213-27 = "Как думаете, насколько она большая? Наверняка ещё и сильная. Хочу побороться с ней на руках!"
213-28 = "Давно не тренировалась, отличный шанс размяться."
213-29 = "А? Просто оставить её в покое? Слишком опасно?"
213-30 = "Что вы такое говорите, Сенсей?! Это... Это же и есть суть спорта и тренировок!"
213-31 = "Если не бросать себе вызов и не преодолевать опасности, как гармонизировать связь тела и разума? Это тренировка! Тренировка!"
213-32 = "Но, увы, у меня столько бумажной работы, что мне даже вставать с этого стула не разрешают."
213-33 = "Ух... Бумажная работа ужасна... Сидишь на месте... времени уходит море..."
213-34 = ""
213-36 = ""
213-37 = "Вот почему я надеялась, что вы сможете вместо Генерального студенческого совета исследовать того металлического гиганта!"
213-38 = "Хм? Как добраться до места далеко в море, куда нет проложенных маршрутов?"
213-39 = "Ха! Вот именно, да? Я подумала то же самое!"
213-40 = "Но какой-то очень добрый, случайный, неизвестный и абсолютно заслуживающий доверия человек предложил помочь!"
213-41 = "Как она это назвала? Транспортный корабль! Она даже дала нам транспортный корабль, чтобы долететь туда!"
213-42 = "Сейчас таких хороших людей почти не встретишь! Чувство общности совсем пропало!"
213-43 = "Я собираюсь пожертвовать своей драгоценной стопкой бумаг и вместо этого пойти помочь ей... потренироваться или что-то такое!"
213-44 = "Точно. Она ещё попросила передать вам вот что."
213-45 = "Имя гиганта — Йесод, Основа чистоты и силы!"
213-46 = "Понятия не имею, что это вообще значит, но она так сказала!"
213-47 = "Оставляю всё вам, Сенсей! Когда вернётесь, давайте пробежимся или типа того!"
213-48 = ""
213-50 = ""
213-51 = "Ах..."
213-52 = "..."
213-53 = "Эм, Сенсей?"
213-54 = "У вас не осталось онигири или чего-нибудь?"
