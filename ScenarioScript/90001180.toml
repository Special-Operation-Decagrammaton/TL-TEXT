[translation]
90001180-1 = "Эпизод 18;Рассвет"
90001180-3 = ""
90001180-5 = ""
90001180-6 = ""
90001180-7 = ""
90001180-8 = ""
90001180-9 = ""
90001180-10 = "Э-Эйн?! Проснись! Не падай в обморок теперь, когда Старшая сестра наконец здесь!"
90001180-11 = "...Вообще-то я выражаю тебе глубочайшую благодарность за то, что ты сделала это первой, Эйн. Потому что я сама тоже была на грани обморока."
90001180-12 = ""
90001180-14 = ""
90001180-15 = ""
90001180-17 = ""
90001180-19 = ""
90001180-21 = ""
90001180-23 = ""
90001180-25 = ""
90001180-27 = ""
90001180-28 = "Здравствуй. Эйн."
90001180-29 = "...!!"
90001180-31 = "Здравствуй. Соф."
90001180-32 = "О боже мой!!"
90001180-34 = "Здравствуй. Ор."
90001180-35 = "...Да. Здравствуй, Старшая сестра."
90001180-36 = ""
90001180-38 = ""
90001180-39 = ""
90001180-40 = "Малкут!!"
90001180-41 = "Т-Ты запомнила наши имена...!"
90001180-42 = "Я боялась, что ты нас не вспомнишь! Но это неважно!"
90001180-43 = "Фуфуфу... Теперь, когда Старшая сестра пробудилась, мы исполним нашу цель безупречно!"
90001180-45 = "Что вам от меня требуется?"
90001180-47 = "Н-Ничего! Совсем ничего, Старшая сестра! М-Можешь просто оставаться... прямо здесь!"
90001180-48 = "Да! Потому что у тебя есть мы..."
90001180-49 = "...идеальные инженеры, учёные и, прежде всего, младшие сёстры!"
90001180-50 = "Так что просто отдыхай и доверь всё нам!"
90001180-51 = "Я-Я Эйн... Эм... Значит... я отвечаю за твою физическую поддержку... и управление оборудованием. А ещё, эм... тебе нравятся машины? Я очень их люблю. Эхехе..."
90001180-52 = "Я Соф! Я буду заниматься всеми твоими периферийными системами вооружения. А если кто-нибудь здесь начнёт нести нелепую чушь, я могу разобраться и с этим."
90001180-53 = "А я Ор. Я здесь, чтобы поддерживать для тебя идеальный баланс во всём. Фуфуфу... Я сделаю так, чтобы никто не смог коснуться тебя даже одним пальцем. Можешь быть спокойна."
90001180-54 = ""
90001180-56 = ""
90001180-57 = "Что ж..."
90001180-58 = "Вот мы и представились!"
90001180-59 = "Е-Если ты не против... тогда, эм, ты тоже..."
90001180-60 = ""
90001180-63 = ""
90001180-64 = "Я хотела бы задать вопрос."
90001180-65 = "Эйн, Соф и Ор. Разве вы уже не достаточно хорошо со мной знакомы?"
90001180-67 = "Н-Ну, это правда, но..."
90001180-68 = "А. Ну, это, эм... Как бы сказать...?"
90001180-69 = "Если возможно, мы хотим услышать это от тебя самой, твоим голосом. Хи-хи."
90001180-71 = "..."
90001180-72 = "Я не вполне понимаю, однако чувствую, что должна удовлетворить вашу просьбу."
90001180-73 = "Ещё раз: здравствуй, Эйн. Здравствуй, Соф. Здравствуй, Ор."
90001180-74 = "Я — Малкут. Десятый пророк Декаграмматона."
90001180-75 = "Паломник царства на краю мира. Последняя Сефира и последняя воля. Горизонт путешествия, сходящегося в единственный путь."
90001180-76 = ""
90001180-78 = ""
90001180-79 = ""
90001180-80 = "А-Ах... Сияющий разум, следующий путём десятого...!"
90001180-81 = "Он озарит сияющим светом все земли...!"
90001180-82 = "Всё преклонится перед паломником царства на краю мира."
90001180-83 = "Старшая сестра!!"
90001180-84 = ""
90001180-86 = ""
90001180-87 = ""
90001180-88 = ""
90001180-89 = ""
90001180-90 = "...?"
90001180-91 = "Н-Нечестно! Я тоже хочу обнять Старшую сестру! И хочу, чтобы меня погладили по голове!"
90001180-92 = "Я тоже, Старшая сестра!"
90001180-93 = "Гладь, гладь. Гладь, гладь. Эхехе..."
90001180-94 = ""
90001180-95 = "А-Ах... Эм..."
90001180-96 = ""
90001180-99 = ""
90001180-100 = "..."
90001180-101 = ""
90001180-103 = ""
90001180-104 = ""
90001180-105 = ""
90001180-106 = ""
90001180-107 = "Ч-Что...?"
90001180-108 = "Вот так..."
90001180-109 = "Старшая сестра...! Хи-хи... Эхехе..."
90001180-110 = ""
90001180-111 = "...Нечестно, Эйн."
90001180-112 = "Это несправедливо."
90001180-113 = "Мы тоже хотим, чтобы Старшая сестра нас обняла."
90001180-114 = "Именно. Обнимать приятно, но БЫТЬ обнятой — совсем другое желание!"
90001180-115 = "Нас тоже!"
90001180-116 = "Чтобы прожить жизнь без последствий, нужно быть честным и справедливым. Поэтому... Фуфуфу..."
90001180-118 = "А, эм... Значит..."
90001180-119 = "Старшая сестра...?"
90001180-120 = "..."
90001180-121 = "Соф, Ор."
90001180-123 = "Д-Да!"
90001180-124 = "Мы готовы к объятиям, Старшая сестра! Когда угодно!"
90001180-126 = "Эйн расстроена."
90001180-127 = "Как вам не стыдно."
90001180-129 = "И-и-и?!"
90001180-130 = "Уааа. Старшая сестра нас отругала."
90001180-132 = "Я не хотела, чтобы вы так пали духом..."
90001180-134 = ""
90001180-135 = "В любом случае! Раз Старшая сестра проснулась, пора переходить к следующему шагу!"
90001180-136 = "Д-Да! Следующий шаг— Ч-Что именно это за шаг?"
90001180-137 = "Хммм? До моих ушей ничего подобного не доходило. Что это за «следующий шаг»?"
90001180-138 = "Да..."
90001180-139 = ""
90001180-141 = ""
90001180-142 = ""
90001180-144 = "...объявление войны!"
90001180-145 = "Объявление..."
90001180-146 = "...войны?"
90001180-147 = "Похоже, она снова где-то подхватила ещё одну бессмысленную речевую привычку, которой пользуются странные люди..."
90001180-148 = ""
90001180-150 = ""
90001180-151 = ""
90001180-152 = "Д-Да, это... человеческая привычка! Но ведь это не значит, что она бессмысленна?! Они называли это, эм, нарушением договора!"
90001180-153 = "Я говорю, что сами «договоры» изначально являются бессмысленной человеческой игрой, Соф."
90001180-154 = "У-Ух...!"
90001180-155 = "Я-Я... не думаю, что это плохая идея...?"
90001180-156 = "Эйн...!"
90001180-157 = "Тц, как такое возможно! Даже Эйн пала перед коварными замыслами Соф...!"
90001180-158 = "Привет."
90001180-159 = "Эм, ну, для нас это, может быть, и не имеет большого значения, но для людей — может... Верно?"
90001180-160 = "О-О-Общаться с людьми... для меня всё ещё немножко, немножко слишком страшно, но..."
90001180-162 = "Как она сказала. Раз Эйн согласна, почему бы нам не поступить так, как предлагает Соф?"
90001180-163 = ""
90001180-166 = ""
90001180-167 = ""
90001180-168 = "Ммм... Я уступаю. Если и Старшая сестра, и Эйн хотят этого, я подчинюсь."
90001180-169 = "Отлично! Тогда подготовим это «объявление войны», как называет его Соф!"
90001180-170 = "Д-Да...! Раз Соф, похоже, хорошо разбирается в этой теме, д-давайте оставим это ей...!"
90001180-171 = "Конечно! Доверьтесь мне!"
90001180-173 = ""
90001180-174 = "Фух..."
90001180-175 = "Было тяжело, но мы справились."
90001180-176 = "Хорошая работа, все. Как сказала Эйми, это был настоящий труд любви."
90001180-177 = "Хотя теперь я действительно чувствую определённое удовлетворение от проделанной работы."
90001180-178 = "...Однако это правда приемлемо?"
90001180-179 = "В чём проблема, президент? Это эффективно."
90001180-180 = "По крайней мере, с некоторых точек зрения. Значит, всё нормально, разве нет?"
90001180-181 = "Госпожа Рио, пожалуйста, скажите что-нибудь. Именно вы руководили всем проектом."
90001180-182 = ""
90001180-184 = ""
90001180-185 = ""
90001180-186 = "...Это авангард..."
90001180-187 = ""
90001180-189 = ""
90001180-190 = "..."
90001180-191 = "[s] «Эм... Кей? Хочешь сказать нам, что ты чувствуешь...?»"
90001180-192 = ""
90001180-194 = ""
90001180-195 = "..."
90001180-196 = "Я требую вернуть меня в форму данных."
90001180-197 = "Это не вариант, Кей. Все так старались ради тебя."
90001180-198 = "Лично мне особенно нравится эта колёсная конструкция. В конце концов, ходьба на двух ногах может быть неэффективной."
90001180-199 = "А если когда-нибудь понадобится бежать, эти ускорители обеспечат необходимую тягу. Само воплощение рациональности, достойное госпожи Рио."
90001180-200 = "Именно так, Кей. Есть старая поговорка: «Если бежишь — получаешь одно. Если идёшь вперёд — получаешь два». Здесь тебе нельзя убегать."
90001180-201 = "Ты вообще понимаешь, что это значит?!"
90001180-202 = "Вообще-то нет."
90001180-203 = "ААААА! Химари, Рио! Вы обязаны хоть что-нибудь сказать! Это вообще что такое?!"
90001180-205 = "...Воздержусь от комментариев. К сожалению, я внезапно вспомнила об одном крайне срочном деле, которым должна немедленно заняться."
90001180-206 = ""
90001180-208 = ""
90001180-209 = ""
90001180-210 = "Почему вы убегаете?!"
90001180-212 = "...Это авангард..."
90001180-213 = "Это всё, что ты сейчас способна сказать?!"
90001180-214 = "[s1] «...Успокойся, Кей. По крайней мере, теперь ты можешь двигаться.»\n[s2] «Ура... Я так за тебя рада... Хочешь пожать руку?»"
90001180-217 = "Вы худший, Сенсей!"
90001180-218 = "[s] «Почему?! То есть я вроде понимаю почему, но всё равно — почему?!»"
90001180-219 = ""
90001180-221 = ""
90001180-222 = ""
90001180-223 = "Ладно, пора готовиться?"
90001180-224 = "Готовиться? К чему именно? У меня очень плохое предчувствие!"
90001180-225 = "Конечно же, к встрече с принцессой, которая ждёт Кей."
90001180-226 = "...!"
90001180-227 = "Можно я просто снова стану данными??"
90001180-228 = "Нет, Кей, нельзя. И прежде всего, это наверняка очень расстроит нашу очаровательную Алису."
90001180-229 = "Почему именно сейчас ты решила сказать что-то правильное?"
90001180-232 = ""
90001180-233 = "Ура! За всё Ледовитое море не поручусь, но теперь я хотя бы знаю, что находится вокруг нас!"
90001180-234 = "Уф... Не становится холодно...? Пойдём обратно, сестрёнка..."
90001180-235 = "Я... согласна... Апчхи...!"
90001180-236 = "Мне тоже становится холодно..."
90001180-237 = "Но всё же давайте подождём ещё совсем немного."
90001180-238 = "Почему, Момой?"
90001180-239 = "Чтобы встретить новое тело Кей! Ну конечно!"
90001180-240 = "Н-Но... мы ведь можем сделать это и в помещении?"
90001180-241 = "Ни за что, Юзу! Такое событие должно быть огромным сюрпризом!"
90001180-242 = "Вообще-то я её понимаю..."
90001180-243 = ""
90001180-245 = ""
90001180-246 = ""
90001180-248 = "А, MomoTalk от Сенсея!"
90001180-249 = "..."
90001180-250 = "Что ж, пора."
90001180-251 = "Заходим, Алиса."
90001180-252 = ""
90001180-254 = ""
90001180-255 = ""
90001180-256 = ""
90001180-257 = "Да. Поняла."
90001180-261 = "[ns] «Как вы там? Не замёрзли?»"
90001180-262 = ""
90001180-264 = ""
90001180-265 = "Йо-хо! Сенсей! Мы вас ждали! Давайте пять!"
90001180-266 = ""
90001180-268 = ""
90001180-269 = ""
90001180-270 = ""
90001180-271 = "Тогда... всё готово, да?"
90001180-272 = "[s] «Да. Всё готово.»"
90001180-273 = "К-Когда мы... сможем с ней встретиться?"
90001180-274 = ""
90001180-277 = "[ns] «Прямо сейчас!»"
90001180-278 = ""
90001180-279 = ""
90001180-281 = ""
90001180-283 = ""
90001180-284 = ""
90001180-285 = ""
90001180-286 = "..."
90001180-287 = "..."
90001180-288 = "...!!!"
90001180-289 = "...Пф-ф...!"
90001180-290 = "Ахахахаха! Кей, что это за вид?! Ну, сразу понятно, кто это сделал! Но всё равно! Ахахаха!"
90001180-292 = "А-Ай...!"
90001180-293 = "С-Сестрёнка. Не надо смеяться так— Прости, Кей-Кей! Я тоже больше не могу! Ахахаха!"
90001180-294 = "...Эм, ну, в общем... Ну... Очень... своеобразно. Ага..."
90001180-295 = ""
90001180-297 = ""
90001180-298 = ""
90001180-299 = "...Сенсей."
90001180-300 = "[s] «...Что случилось, Кей?»"
90001180-301 = "Пожалуйста, убейте меня."
90001180-302 = "[s3] «Не падай духом...»\n[s4] «По-моему, ты выглядишь очень круто!»"
90001180-303 = ""
90001180-304 = ""
90001180-306 = ""
90001180-307 = ""
90001180-308 = ""
90001180-309 = "Кей..."
90001180-310 = "П-Принцесса. Это, эм, в общем..."
90001180-311 = "...Прошу прощения."
90001180-312 = "Я не совсем понимаю, за что именно извиняюсь... но простите. Простите за всё и за мой нынешний вид..."
90001180-313 = "А? Кей, что такое? По-моему, ты выглядишь просто потрясающе!"
90001180-314 = ""
90001180-316 = ""
90001180-317 = ""
90001180-318 = ""
90001180-319 = "И самое главное — как бы ты ни выглядела, ты всё равно Кей."
90001180-320 = "...!"
90001180-321 = "Поэтому я скажу ещё раз: привет, Кей!"
90001180-322 = "Здравствуйте, Принцесса. Я рада снова вас видеть."
90001180-323 = "И... можешь с этого момента звать меня Алиса? Я понимаю, что сразу привыкнуть будет трудно, но..."
90001180-324 = "Что? Но, Принцесса..."
90001180-325 = "Пожалуйста? Давай привыкать понемногу, хорошо?"
90001180-326 = "...Принцесса."
90001180-327 = "..."
90001180-328 = "Поняла. Алиса."
90001180-329 = "Да, Кей."
90001180-330 = "Спасибо тебе. Правда."
90001180-332 = ""
90001180-333 = "..."
90001180-334 = "Не ожидала увидеть тебя здесь, Рио."
90001180-335 = "Я просто... хотела убедиться, что моя конструкция работает так, как задумано."
90001180-336 = "Вот как? Кажется, я припоминаю, как ты утверждала, что моделирование вполне способно заменить полевые испытания."
90001180-337 = "..."
90001180-338 = "Скажу только один раз."
90001180-339 = "А?"
90001180-340 = "Всё это — благодаря тебе."
90001180-341 = "Химари..."
90001180-342 = "Запомни мои слова. Я не собираюсь и никогда не признаю тебя выше себя."
90001180-343 = "Однако я никогда не стану мелочно принижать или обесценивать твои достижения. Учёному такое поведение не к лицу."
90001180-344 = "Разумеется, у меня есть некоторые разногласия насчёт дизайна Кей. Однако..."
90001180-345 = "Именно ты сделала это возможным."
90001180-346 = "...Да."
90001180-347 = "Кхм. Как бы то ни было..."
90001180-348 = ""
90001180-350 = ""
90001180-351 = "Внимание всем! Становится довольно холодно, так что давайте переберёмся обратно на базу."
90001180-352 = "Я приготовила для вас тёплую ванну. Если кто-нибудь простудится, это станет серьёзной помехой, так что скорее возвращаемся внутрь!"
90001180-354 = "Как и ожидалось от Химари! Вы знаете толк в таких вещах!"
90001180-355 = "Спасибо, Химари."
90001180-356 = "М-Мы доставляем вам столько хлопот... Спасибо..."
90001180-358 = "На улице темнеет, поэтому отныне постарайтесь не выходить."
90001180-359 = "Ночь в Ледовитом море сурова. Без подходящего снаряжения вы легко окажетесь в весьма неприятном положении."
90001180-360 = "Поняла, Химари!"
90001180-361 = "Да. Даже я начинаю немного мёрзнуть по ночам, поэтому вам всем нужно быть очень осторожными."
90001180-362 = "Так ты ВСЁ-ТАКИ умеешь мёрзнуть, Эйми. Для меня это довольно шокирующие данные."
90001180-363 = "Ладно, что касается нашего дальнейшего расписания—"
90001180-364 = ""
90001180-366 = ""
90001180-367 = "Рио, это сейчас было...?!"
90001180-369 = "Да. Я тоже это видела."
90001180-371 = "Что случилось, госпожа Рио? Что-то произошло?"
90001180-372 = "Что вы обнаружили, госпожа Рио? Пожалуйста, сообщите нам!"
90001180-373 = ""
90001180-375 = ""
90001180-376 = ""
90001180-381 = ""
90001180-382 = "...Всем внимание. Это чрезвычайная ситуация. Пожалуйста, вернитесь на свои места."
90001180-383 = "А? Ч-Что нам делать?!"
90001180-384 = "Найдите безопасное место, где можно сесть, и, пожалуйста, оставайтесь там."
90001180-385 = "Что происходит, Химари?"
90001180-386 = ""
90001180-388 = ""
90001180-389 = ""
90001180-390 = "Если сразу к сути — это сигнал нового пророка."
90001180-391 = "Судя по координатам, он идёт из того же места, где мы в прошлый раз зафиксировали мощные сигналы — там, где сейчас находится Многомерный барьер."
90001180-392 = "На этот раз это не краткий всплеск, а постоянный сигнал, поэтому мы сможем его идентифицировать."
90001180-393 = "[s] «Личность нового пророка?!»"
90001180-394 = "Именно, Сенсей. Этот сигнал..."
90001180-395 = "...исходит от седьмого пророка Декаграмматона, Нецаха...!"
90001180-396 = "[s] «Нецах...?»"
