[translation]
1010702-1 = "Секретарь Общества Пандемониума"
1010702-3 = "Йохо! Доставка газеты!"
1010702-4 = "[s] «Дверь открыта. Заходи!»"
1010702-5 = ""
1010702-8 = ""
1010702-9 = "Привет! Это Чиаки!"
1010702-10 = "...Я ведь не мешаю вам, когда вы заняты?"
1010702-11 = "[s] «Всё нормально, сейчас я свободен.»"
1010702-12 = "Фух, рада слышать! Тогда не обращайте на меня внимания..."
1010702-13 = ""
1010702-15 = ""
1010702-16 = "...Ого, в Шале и правда здорово! Здесь так просторно! Вы всегда здесь работаете, Сенсей?"
1010702-17 = "И кожа у вас сегодня прямо сияет. Может, потому что воздух такой свежий!"
1010702-18 = "[s] «Это, эм, к чему-то относится?»"
1010702-19 = "Да нет, просто говорю: если хорошо, значит хорошо, правда?"
1010702-20 = "О, точно! У меня для вас большой подарок-сюрприз! Итак, торжественное представление..."
1010702-21 = "...Та-дам! Свежайший выпуск «Еженедельника Общества Пандемониума»!"
1010702-22 = "...Погодите, вы впервые его видите?"
1010702-23 = "То есть вы... не знали, что такое «Еженедельник Общества Пандемониума»?"
1010702-24 = "Хотите сказать... вы не читали ни одного выпуска... самого быстрого, точного и честного еженедельного журнала во всём районе Геенны...?"
1010702-25 = "Это, э-э... Это прямо..."
1010702-26 = "[s] «...Чиаки?»"
1010702-27 = "Это же ЛУЧШЕЕ!!"
1010702-28 = "Вы сможете впервые испытать удовольствие от его чтения!"
1010702-29 = "А я смогу увидеть, как ВЫ впервые его читаете! Будет здорово!"
1010702-30 = "И выпуск на этой неделе прямо набит отличными статьями: «Эксклюзивный репортаж! Экскурсия по комнате отдыха Общества Пандемониума» и «Большой релиз! Записи об играх Ибуки в песке»!"
1010702-31 = "Так что приятного чтения!"
1010702-32 = "[s] «Обязательно. Спасибо.»"
1010702-33 = "Или я могу прочитать его ВАМ, знаете..."
1010702-34 = "Это особая услуга! Чиаки, секретарь Общества Пандемониума и одновременно репортёр, редактор и издатель «Еженедельника Общества Пандемониума», лично читает статьи для вас!"
1010702-35 = "Ну что скажете? Начнём прямо сейчас?"
1010702-36 = "[s1] «Ничего, я прочитаю сам, когда будет время.»\n[s2] «Конечно, давай.»"
1010702-37 = "П-Правда? Вы уверены, что не хотите, чтобы я прочитала?"
1010702-38 = "Такая возможность редко выпадает. Ещё пожалеете."
1010702-39 = ""
1010702-42 = "...А, вы пошутили?"
1010702-43 = "Хи-хи! Я так и знала! Не могли же вы упустить такую возможность, верно?"
1010702-44 = "Отличный выбор!"
1010702-45 = "Оставь мне!"
1010702-46 = "Итак, смотрите на первую страницу! На этой фотографии — офис Общества Пандемониума!"
1010702-47 = "Туда мы с остальными членами ходим каждый день!"
1010702-48 = "Диван там супер-супер-супер-пушистый! Как-нибудь приходите попробовать, Сенсей!"
1010702-49 = "Хм? Я там не работаю?"
1010702-50 = "Ну, поскольку я секретарь, мне нужно просто записывать всё на собраниях..."
1010702-51 = "Но собраний у нас почти НИКОГДА не бывает, так что... как-то всё само получается, наверное?"
1010702-52 = "Так, следующая страница!"
1010702-53 = "А, над этой я долго старалась! Сейчас прочитаю вам...!"
1010702-55 = "Я продолжил читать «Еженедельник Общества Пандемониума» вместе с Чиаки..."
1010702-57 = "...О, это последняя страница!"
1010702-58 = "Ого, время и правда пролетело незаметно, да?"
1010702-59 = "Ну что, впервые прочитали «Еженедельник Общества Пандемониума»! Как вам, Сенсей?"
1010702-60 = "[s] «Было весело.»"
1010702-61 = "Хи-хи, у вас хороший вкус!"
1010702-62 = "Ладно, тогда вернёмся к главному..."
1010702-63 = "Не заинтересованы ли вы в постоянной подписке?"
1010702-64 = "Каждую неделю сможете получать новый выпуск «Еженедельника Общества Пандемониума»!"
1010702-65 = "А если подпишетесь прямо сейчас, получите ещё и кучу подарков!"
1010702-66 = "[s] «Хорошо, я подпишусь.»"
1010702-67 = "А, правда?"
1010702-68 = "Спасибо! Для «Еженедельника Общества Пандемониума» это тоже важная веха. Ещё один шаг за пределы Геенны!"
1010702-69 = "[s] «Сколько стоит подписка?»"
1010702-70 = "Разумеется, бесплатно!"
1010702-71 = "Я делаю это не ради денег. Просто потому что мне нравится!"
1010702-72 = "А расходы на печать и публикацию на сто процентов покрываются из бюджета Общества Пандемониума!"
1010702-73 = "[s] «...Это вообще нормально?»"
1010702-74 = "Ну, Макото ведь говорила, что хочет распространить имя Общества Пандемониума как можно шире..."
1010702-75 = "Так что... да, наверное?"
1010702-76 = "[s] «(Наверное?)»"
1010702-77 = ""
1010702-79 = ""
1010702-80 = "Итак! Просто распишитесь вот здесь, в списке подписчиков, пожалуйста!"
1010702-81 = "Ага, прямо тут!"
1010702-82 = ""
1010702-85 = "Спасибо!"
1010702-86 = "Я так рада, что вы согласились. Хорошо, что я пришла сюда рекламировать!"
1010702-87 = "[s] «Ты всегда лично ходишь и рекламируешь?»"
1010702-88 = "Да нет, обычно через MomoTalk или по телефону... но когда есть время, я и сама хожу!"
1010702-89 = "Весело знакомиться с новыми учениками и разговаривать с ними. И ещё мне хочется своими глазами видеть больше людей, читающих мою газету."
1010702-90 = "А если совсем честно..."
1010702-91 = "...обычно в первую очередь я навещаю тех, о ком хочу рассказать в рубрике «Большое интервью! Я встретила этого человека!»."
1010702-92 = "Так что, раз уж продолжаем честно, я бы очень хотела когда-нибудь взять интервью и у вас, Сенсей."
1010702-93 = "[s] «Я не против в любое время, если только не случится чего-то особенного.»"
1010702-94 = "Правда? Я знала, что на вас можно рассчитывать, Сенсей!"
1010702-95 = "В знак благодарности на следующей неделе пришлю вам ДВА выпуска!"
1010702-96 = "Читайте с удовольствием и рассказывайте другим!"
1010702-97 = ""
1010702-99 = ""
