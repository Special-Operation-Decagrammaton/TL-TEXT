[translation]
21140-1 = "Эпизод 14;Горничные против Мастеров"
21140-2 = "Коридор Милленниума"
21140-4 = "Последние ставни опущены. Теперь перемещаться по этажу студсовета можно только с моим отпечатком! Ещё немного — и доберёмся до склада контрабанды и Зеркала..."
21140-5 = "Момои! Ложись!"
21140-7 = "А?"
21140-8 = "*БА-А-АХ*"
21140-9 = "А-а-а!"
21140-10 = "Ч-что это БЫЛО?! Эта огромная штука едва не прошла над нашими головами! Посмотрите, какая дыра в стене!"
21140-11 = "Снайперский противоматериальный патрон 13,97 миллиметра?! Было близко. Будь ты всего на парочку сантиметров выше, попало бы прямо в голову."
21140-12 = "Слава богу, мы такие мелкие— нет! Что происходит?!"
21140-13 = "Их снайпер уже занял позицию."
21140-14 = "Снайпер C&C — Карин."
21140-15 = "Снова стреляет! Мидори, пригнись!"
21140-16 = "*бах*"
21140-17 = "А-а-а-а!"
21140-19 = "Крыша 3-го института Милленниума"
21140-20 = "Хм? Неплохо."
21140-21 = "По этим коротышкам трудно попасть. Они маленькие и шустрые."
21140-22 = "Но их скорость и движения предсказуемы. На линии огня нет ни ветра, ни препятствий. Даже если прижиматься к стенам и избегать окон, им не спастись."
21140-23 = "Извините, девочки, но теперь бежать некуда..."
21140-24 = "Уверена?"
21140-25 = "...?!"
21140-26 = "Мои расчёты говорят обратное. На самом деле шанс попадания — ноль процентов."
21140-27 = "Кто здесь?"
21140-30 = "*пах* *пах* *тат*"
21140-31 = "А?"
21140-32 = ""
21140-33 = ""
21140-34 = "*бра-та-та-та-та-та*"
21140-36 = "Ого! Ч-Что за чертовщина?!"
21140-37 = "Думаю, пора представиться."
21140-38 = "Встречайте новейшее и величайшее изобретение Инженерного Департамента — двуногий вездеходный боевой стул Громопушка!"
21140-40 = "...Но зачем? Кому нужен ходячий стул?! И почему у него катапульта?!"
21140-41 = "Твоя нехватка воображения удручает. Наверное, надо было раньше понять, что такая тупица не способна оценить очарование Громопушки."
21140-42 = "Ни ты, ни этот \"стул\" не имеют смысла, но остальное начинает складываться."
21140-43 = "Я всё думала, как эта малышня из Департамента Разработки Игр сумела зайти так далеко самостоятельно."
21140-44 = "Это благодаря вашему Сенсею?"
21140-45 = "Готова поспорить, информация Химари тоже была приманкой."
21140-46 = "В таком случае..."
21140-47 = ""
21140-48 = ""
21140-49 = ""
21140-51 = ""
21140-52 = "!!!"
21140-53 = ""
21140-55 = "А-а-а! Громопушка!"
21140-56 = "Крепкая. Пуля не прошла насквозь. Ну и ладно. Вряд ли она сможет что-то сделать будучи перевёрнутой, как черепаха."
21140-57 = "Признаю, идея ходячего стула с пушкой довольно забавная."
21140-58 = "Но если ты правда хотела меня остановить, стоило устроить засаду, а не выходить против меня на этом тупом прославленном инвалидном кресле."
21140-59 = "Твои расчёты были глупыми, Утаха."
21140-60 = "Тебе никогда не победить меня на такой открытой крыше без укрытия."
21140-61 = "..."
21140-62 = "Без укрытия, хм? Да, это верно."
21140-63 = ""
21140-65 = "Но знаешь, чего ещё нет у крыши? Потолка."
21140-67 = "???"
21140-69 = "*вж-ж-ж*"
21140-70 = "Ч-Что это за звук?!"
21140-71 = "*БА-А-АХ*"
21140-73 = "Гах! Миномёт?! Но откуда?"
21140-74 = "Наша дорогая Хибики запускает снаряды с противоположной стороны башни Милленниума."
21140-75 = "Чтобы добраться до Хибики, тебе придётся пробить четыре стены и два потолка. Невыполнимая задача, если только у тебя под этим кружевным платьем горничной тоже не спрятан миномёт."
21140-76 = "Ты издеваешься!"
21140-77 = "Ха-ха. Ты сомневалась в них..."
21140-79 = "...но мои расчёты всегда верны."
21140-81 = "Главный коридор Милленниума"
21140-82 = "Снаружи стало тише."
21140-83 = "Наверняка это дело рук Утахи и Хибики! Нужно двигаться, пока они прижали Карин!"
21140-84 = ""
21140-85 = "*грохот*"
21140-86 = "И-и-и! Э-Это землетрясение?"
21140-87 = "Н-Нет, взрыв. Неужели...?!"
21140-89 = "Окраина института Милленниума"
21140-91 = ""
21140-92 = ""
21140-94 = "Угх. Моя лекция... ещё не закончена!"
21140-95 = "Я думала, нам крышка! Где она, блин, вообще хранит столько бомб?!"
21140-96 = ""
21140-98 = "*вздох* Обычно я не одобряю уничтожение школьного имущества."
21140-99 = "Прошу прощения за разрушенные ставни, Юука. Где сейчас Департамент Разработки Игр?"
21140-100 = "До недавнего момента Карин держала их под огнём, но теперь они исчезли из поля зрения."
21140-101 = "Однако нетрудно догадаться, куда они направляются."
21140-102 = "Должно быть, на склад контрабанды, где хранится Зеркало. Поняла. Поднимусь на лифте и перехвачу их."
21140-103 = "*бип*"
21140-104 = ""
21140-106 = "...?!"
21140-107 = "Ю-Юука?"
21140-108 = "Они отключили электричество?!"
21140-109 = "Они и правда готовы зайти так далеко...?"
21140-111 = "Главный коридор Милленниума"
21140-112 = "Это отключение только что... Думаешь, Утаха и Хибики справились?"
21140-113 = "Наверное? Но тут такая темень. Смотрите под ноги, Сенсей."
21140-114 = "Если пройти сюда, то..."
21140-115 = "Склад контрабанды студсовета! Ха-ха. Получилось!"
21140-116 = "Ого! Наконец-то вы добрались!"
21140-117 = "Хм?"
21140-118 = "А?!"
21140-119 = ""
21140-120 = "Чего так долго?"
21140-121 = "Приветики, Департамент Разработки Игр! И... эм-м-м, вас звали... \"Зензи\"?"
21140-122 = "А, точно! Сенсей!"
21140-123 = "Я всё это время ждала здесь!"
21140-124 = "А-Асуна? Откуда ты знала, что мы придём сюда?!"
21140-125 = "Понятия не имею!"
21140-126 = "Назовём это предчувствием! Мне казалось, если я подожду здесь, то рано или поздно встречу Сенсея. И вас тоже!"
21140-127 = "Женская интуиция, можно сказать."
21140-128 = "Боже. Ты даже не пыталась прийти к этому логически."
21140-129 = "Ну что, начнём?"
21140-130 = "А? Начнём что?"
21140-131 = "Наш бой, конечно, глупышка! Нет ничего лучше хорошей драки!"
21140-132 = "О, точно. Сначала надо представиться!"
21140-133 = "Позывной C&C Ноль-Один, Асуна, прибыла на службу!"
21140-134 = "Готовы или нет — я иду!"
21140-135 = "Вот дерьмо!"
21140-137 = "Следующий эпизод;Распространяющаяся угроза"
