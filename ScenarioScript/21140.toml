[translation]
21140-1 = "Episódio 14;Maid VS Meisters"
21140-2 = "Millennium — Corredor"
21140-4 = "Última comporta destravada! Hehe, agora esse andar exclusivo do conselho estudantil está todinho na palma da minha mão~♪ Bom, falta pouco pro depósito de itens confiscados onde tá o \"Espelho\"..."
21140-5 = "Momoi, abaixa!"
21140-7 = "Hã?"
21140-8 = "(BUMMM!)"
21140-9 = "Uwaaaah!"
21140-10 = "A-Acabou de passar uma bala com um poder absurdo bem em cima da minha cabeça?! Abriu um buraco na parede?!"
21140-11 = "Uma bala antimaterial de 13,97 mm?! Ainda bem, mana... se você fosse 5 cm mais alta, teria acertado bem no meio da sua testa..."
21140-12 = "Ufa, verdade. Ainda bem que eu sou baixi... Ei, pera aí!"
21140-13 = "Então essa área já está no campo de mira."
21140-14 = "...Da atiradora da C&C, Karin-senpai."
21140-15 = "Midori, abaixa! Lá vem outro!"
21140-16 = "(BOOOOOM!)"
21140-17 = "Uwaaah?!"
21140-19 = "Millennium — Terraço do 3º Prédio Escolar"
21140-20 = "...Entendi. Nada mal."
21140-21 = "Elas são pequenas e ágeis, difíceis de acertar..."
21140-22 = "...Mas já peguei a velocidade e o padrão delas. Quase não há vento, e não há nada obstruindo a visão... Talvez elas achem que \"estão seguras de costas para a parede\", mas..."
21140-23 = "Que pena. O próximo vai acertar com 100% de certeza..."
21140-24 = "Será mesmo?"
21140-25 = "?!"
21140-26 = "Meus cálculos dizem outra coisa. A probabilidade da sua bala acertar aquelas meninas é de 0%."
21140-27 = "Quem está aí?!"
21140-30 = "(Zuuuum, clang)"
21140-31 = "...Hã?"
21140-34 = "(Ratatatatata!)"
21140-36 = "M-Mas que coisa é essa?!"
21140-37 = "Deixe-me apresentar."
21140-38 = "A mais nova criação do Clube de Engenharia: uma \"cadeira\" bípede de combate para qualquer clima — o Trono do Trovão."
21140-40 = "Por que diabos fazer uma cadeira andar... E ela ainda tem uma catapulta?!"
21140-41 = "É uma pena que você não consiga apreciar o charme do meu \"Trovão-chan\"..."
21140-42 = "...Não consigo entender, mas já deu para ter uma ideia."
21140-43 = "Eu estava mesmo me perguntando como o Clube de Desenvolvimento de Jogos conseguiu passar pela segurança do conselho estudantil de Millennium e chegar até aqui."
21140-44 = "...Então eram vocês que estavam ajudando aquele \"Sensei\"."
21140-45 = "Então as informações da Himari também eram uma armadilha para nos confundir...?"
21140-46 = "O que significa que..."
21140-52 = "!!"
21140-55 = "Trovão-chan!"
21140-56 = "Entendi. Não foi perfurada por isso, então é bem resistente... Apesar de ter caído e estar esperneando com as perninhas."
21140-57 = "Uma cadeira que atira, interessante..."
21140-58 = "Mas se você realmente pretendia me deter, deveria ter vindo de surpresa. Mesmo com essa \"cadeira\", me desafiar de frente assim..."
21140-59 = "Foi um erro de cálculo, Utaha."
21140-60 = "Achou mesmo que podia me vencer num confronto direto, num terraço aberto desses sem nenhuma cobertura?"
21140-61 = "..."
21140-62 = "Você tem razão, não há nada cobrindo este lugar..."
21140-65 = "Isso mesmo — nem sequer um teto."
21140-67 = "?"
21140-69 = "(Fiuuu—)"
21140-70 = "...Que som é esse?!"
21140-71 = "(BOOOOM!)"
21140-73 = "Não pode ser, um morteiro?! De onde veio isso?!"
21140-74 = "Da nossa Hibiki, lá do outro lado da Torre Millennium."
21140-75 = "Para você acertar a Hibiki, teria que atravessar várias paredes e tetos.#nA menos que você também dê um tiro em arco. E então, comigo bem na sua frente, será que você consegue fazer qualquer uma dessas coisas?"
21140-76 = "Tsc...?!"
21140-77 = "Hehe, quer que eu repita?"
21140-79 = "Tudo conforme o calculado."
21140-81 = "Millennium — Interior do Prédio Escolar"
21140-82 = "...Os disparos pararam."
21140-83 = "Foram a Utaha-senpai e a Hibiki-chan! Vamos nos apressar enquanto elas seguram a Karin-senpai!"
21140-85 = "(Estrondooo—!)"
21140-86 = "Eeeeh?! O-O que é isso, um terremoto?"
21140-87 = "Parece uma explosão... Não me diga que...?!"
21140-89 = "Millennium — Prédio Escolar"
21140-94 = "Ugh... a minha palestra ainda não... acabou...!"
21140-95 = "Aii, achei que ia morrer! Onde diabos ela tava escondendo esse monte de bombas...?!"
21140-98 = "Ufa... Eu realmente não gostaria de danificar muito as instalações da escola, mas..."
21140-99 = "Yuuka, peço desculpas, mas tive que destruir a comporta à força. Qual é a localização atual do Clube de Desenvolvimento de Jogos?"
21140-100 = "A Karin estava segurando elas até agora há pouco, mas acabou perdendo o rastro."
21140-101 = "Mas... eu sei para onde elas estão indo."
21140-102 = "Para o depósito de itens confiscados do conselho estudantil, onde fica o \"Espelho\", certo? Pois bem, vou pegar o elevador para lá imediatamente."
21140-103 = "(Bip-bip—)"
21140-106 = "?!"
21140-107 = "O que houve? Yuuka? Yuuka??"
21140-108 = "Não me diga que cortaram a energia...?!"
21140-109 = "Tsc, chegarem a esse ponto...!!"
21140-111 = "Millennium — Interior do Prédio Escolar"
21140-112 = "Aquele apagão de agora há pouco quer dizer que o plano da Utaha-senpai e da Hibiki deu certo, né?"
21140-113 = "Sim, deve ser isso. Ah, Sensei, o chão está escuro, então tome cuidado onde pisa, tá?"
21140-114 = "Só precisamos passar por aqui..."
21140-115 = "Sim, o depósito de itens confiscados do conselho estudantil já deve ser logo ali. Finalmente...!"
21140-116 = "Opa, finalmente chegaram!"
21140-117 = "?"
21140-118 = "?!"
21140-120 = "Demoraram, hein~ Eu já tava esperando faz um tempão!"
21140-121 = "Sejam bem-vindas, Clube de Desenvolvimento de Jogos! E também, humm... Senpai, né?"
21140-122 = "Ah, não, não, lembrei! É \"Sensei\"!"
21140-123 = "Eu tava super ansiosa pra te conhecer, sabia~?"
21140-124 = "A-Asuna-senpai?! O que você tá fazendo aqui?!"
21140-125 = "Mesmo se você me perguntar por quê~... Sei lá, por intuição?"
21140-126 = "Sabe aqueles pressentimentos ou intuições que dão na gente? Eu pensei: \"Se eu esperar aqui, acho que vou encontrar o Sensei e vocês também!\""
21140-127 = "Tive esse pressentimento!"
21140-128 = "Ela não usou nenhuma palavra difícil, mas eu não entendi absolutamente nada do que ela disse..."
21140-129 = "Beleza, então vamos começar?"
21140-130 = "E-Er, só por precaução... começar o quê...?"
21140-131 = "A luta! Eu adoro lutar!"
21140-132 = "Ah, verdade. Eu ainda não me apresentei, né?"
21140-133 = "C&C, codinome Zero-Um, Asuna!"
21140-134 = "Lá vou eu!"
21140-135 = "Tinha que ser?!"
21140-137 = "Próximo;Uma Crise à Espreita"
