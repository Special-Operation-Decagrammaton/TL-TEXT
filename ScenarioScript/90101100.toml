[translation]
90101100-1 = "Episódio 10;Um Valor Inabalável"
90101100-6 = "Caramba... a carapaça disso é dura demais!"
90101100-7 = "Aqui é a FOX3! Disparos de calibre .45 não tão nem fazendo cosquinha na blindagem do alvo!"
90101100-8 = "Solicito apoio de fogo pesado imediato!"
90101100-9 = ""
90101100-13 = ""
90101100-14 = "Conduzindo o alvo em direção ao Ponto Beta para viabilizar tiro de precisão."
90101100-15 = "FOX4, alterne a munição para Alto-Explosiva (HE) e recarregue. Mantenha a posição atual."
90101100-16 = "Munição perfurante (AP) não seria melhor?"
90101100-17 = "Apenas perfurar a carapaça não surtirá efeito."
90101100-18 = "Tudo indica que o alvo possui capacidade regenerativa ativa."
90101100-19 = "Ataques dispersos só farão a blindagem externa endurecer ainda mais."
90101100-20 = "A tal 'blindagem biológica'? Na teoria é bonita, mas encarar de frente é uma chatice sem tamanho!"
90101100-21 = "FOX2, consegue encaixar um projétil de balote pesado bem no abdômen dele?"
90101100-22 = ""
90101100-23 = "Para surtir efeito total, preciso atirar à queima-roupa... Conseguem segurar a fera por alguns segundos?"
90101100-24 = "Vou chamar a atenção dele usando o guindaste operado por controle remoto."
90101100-25 = ""
90101100-31 = "...Ele aguenta dez segundos no máximo!"
90101100-32 = "Entendido!"
90101100-33 = ""
90101100-38 = "Impacto direto no alvo confirmado!"
90101100-39 = ""
90101100-42 = "FOX4. Consegue efetuar um disparo cirúrgico na fenda aberta pela FOX2?"
90101100-43 = "Aquele é o ponto fraco!"
90101100-44 = "Distância: 700 metros. Vento de norte para sul a 12 nós."
90101100-45 = "Moleza pra mim."
90101100-46 = ""
90101100-49 = "Alvo abatido."
90101100-50 = "Agora, FOX3! Detone as minas Claymore!"
90101100-51 = "Vai pro inferno, crustáceo nojento!"
90101100-52 = ""
90101100-60 = "Ecaaa, que nojo é esse?! #nComeçou a jorrar água podre da boca do caranguejo!"
90101100-61 = "Ugh... que inhaca de maresia podre. Esse fedor vai sair da roupa, né...? Diz que vai!"
90101100-62 = "...Pelo visto vamos ter que bater muita roupa quando voltarmos pra base."
90101100-63 = ""
90101100-64 = "Aaaah... n-não pode ser..."
90101100-65 = "A aberração foi neutralizada. Este perímetro agora está seguro."
90101100-66 = "N-Não é possível... O monstro dos boatos existia de verdade...?"
90101100-67 = "Por causa de um... de um caranguejo idiota desses..."
90101100-68 = ""
90101100-70 = ""
90101100-71 = ""
90101100-72 = "Nossa, ela ficou em choque de verdade, né?"
90101100-73 = "Também, depois de presenciar uma coisa dessas, não tiro a razão dela."
90101100-74 = "Os títulos de dívida da família... as obras de arte contrabandeadas... tudo o que eu protegi com a minha vida..."
90101100-75 = "Foi tudo esmagado junto com o galpão inteiro...!"
90101100-76 = "Como é que eu vou olhar na cara do chefão agora...? Acabou tudo pra mim...!"
90101100-77 = "Ah... a preocupação dela era essa...?"
90101100-78 = "Então era por isso que faziam tanta questão de manter a guarda do porto a todo custo."
90101100-79 = "Bem feito. Colheu o que plantou, não sinto um pingo de pena."
90101100-80 = "Se repassarmos essas provas para o Departamento de Segurança Pública da Valkyrie, elas cuidam do resto rapidinho."
90101100-81 = "Diferente dos boatos de fantasmas, evasão fiscal e contrabando dão motivo de sobra pra Valkyrie agir."
90101100-82 = ""
90101100-84 = ""
90101100-85 = "............"
90101100-86 = "[s] \"Você está bem, Yukino?\""
90101100-87 = "Sim, estou perfeitamente bem. Afinal, fiquei o tempo todo na linha de retaguarda."
90101100-88 = "Quem realmente se expôs ao perigo direto foram a Nico e a Kurumi—"
90101100-89 = "[s] \"Não estou falando do combate.\""
90101100-90 = ""
90101100-93 = "[ns1] \"Fiquei preocupado com a sua reação durante o interrogatório.\"\n[ns2] \"Lembrou de alguma coisa do passado?\""
90101100-96 = "Naquele momento..."
90101100-97 = "Peço desculpas. Acabei perdendo a compostura e me deixando levar pelas emoções."
90101100-98 = "De repente, lembrei de coisas do passado... e fui tomada por uma raiva incontrolável."
90101100-99 = "[s] \"Raiva daquela Capo?\""
90101100-100 = "...Eu não sei."
90101100-101 = "Eu estava furiosa, mas, parando para pensar, nem eu mesma sei direito contra quem era toda aquela ira."
90101100-102 = "Se era contra ela... ou contra a minha própria fraqueza no passado, por ter cometido exatamente os mesmos erros."
90101100-103 = "...Ou se era contra a própria sociedade, que permite que ciclos como esse se repitam sem cessar."
90101100-104 = "Sei que parece uma birra infantil. #nMas a sensação de impotência ao ver as coisas fugirem do controle foi algo que não consegui tolerar."
90101100-105 = "[s3] \"Isso não é um dilema só de crianças.\"\n[s4] \"Quando as coisas fogem do controle, até os adultos sentem raiva.\""
90101100-108 = "Até o Sensei... se sente assim às vezes?"
90101100-109 = "[s5] \"Com certeza.\"\n[s6] \"Aliás, se não sentíssemos nada, seria sinal de que já tínhamos desistido das coisas desde o início.\""
90101100-112 = ""
90101100-114 = ""
90101100-115 = "Como aquela integrante da Família Carpaccio argumentou, as ações deles não violavam formalmente as leis escritas."
90101100-116 = "Eles apenas fabricaram uma lenda urbana para consolidar uma imagem pública e garantir vantagem contratual na licitação."
90101100-118 = "No entanto, como resultado disso, incontáveis pessoas foram submetidas ao pavor, sofrendo danos reais e profundos."
90101100-119 = "Já percebi isso há muito tempo... por mais rigorosas que sejam as leis, elas jamais conseguirão conter integralmente os malfeitores."
90101100-120 = "Aqueles com más intenções são mestres em encontrar as brechas nos regulamentos."
90101100-121 = ""
90101100-122 = "E leis cada vez mais intrincadas apenas impõem entraves aos cidadãos comuns, gerando vítimas inocentes de boa-fé."
90101100-123 = "Será que existe... assim como uma justiça perfeita, algum conjunto de leis sem brechas ou falhas?"
90101100-124 = "[s] \"É mais seguro você assumir que... tal coisa não existe.\""
90101100-125 = "...Imaginei que diria isso."
90101100-126 = "[s] \"Afinal, a maioria das regras não é criada pensando nas pessoas.\""
90101100-127 = ""
90101100-129 = ""
90101100-130 = "...Como disse?"
90101100-131 = "[s7] \"Costuma-se acreditar que as regras foram feitas para servir aos seres humanos—\"\n[s8] \"Mas, na prática, as pessoas é que acabam sendo moldadas para caber dentro das regras.\""
90101100-132 = ""
90101100-133 = ""
90101100-136 = "[ns9] \"Uma vez estabelecida uma regra, não é nada fácil mudá-la.\"\n[ns10] \"...Diferente do coração humano, que oscila e se transforma a todo instante.\""
90101100-139 = "[ns] \"Por isso, as pessoas tendem a se tornar prisioneiras das regras criadas pelo passado.\""
90101100-140 = "Nesse caso... para não ficarmos acorrentadas ao passado—"
90101100-141 = "Em que alicerce nós, seres que vivem em conflito e oscilação, devemos nos apoiar para seguir em frente?"
90101100-142 = "[s] \"Use um valor inabalável como a sua bússola.\""
90101100-143 = "Um valor... inabalável."
90101100-144 = "[ns] \"O seu senso de justiça continua o mesmo de sempre, Yukino?\""
90101100-145 = ""
90101100-147 = ""
90101100-148 = "...Eu quero acreditar que sim."
90101100-149 = "[s] \"Então, tomando essa sua justiça inabalável como eixo, reorganize as regras ao seu redor.\""
90101100-150 = "Sim, Sensei."
90101100-151 = ""
90101100-153 = ""
90101100-154 = ""
90101100-155 = ""
90101100-156 = "Ei, sobre o que vocês dois estão conversando com essa cara tão séria há meia hora?"
90101100-157 = "Não me digam que estão de segredinho pelas nossas costas?!"
90101100-158 = "Não fale tolices. #nEstávamos apenas alinhando como reportaremos os fatos ao Conselho Estudantil Federal após o rescaldo da área."
90101100-159 = ""
90101100-161 = ""
90101100-163 = ""
90101100-164 = "Cheguei de volta, pessoal~!"
90101100-165 = "Bom trabalho, FOX2. #nHavia outros civis pelo perímetro?"
90101100-166 = "Não. Como tínhamos isolado a área de acesso proibido, ninguém foi pego no fogo cruzado. #nTer avisado a administração portuária com antecedência foi a melhor decisão."
90101100-167 = "Ah, e mais uma coisa! Fazendo a varredura onde o caranguejo monstro caiu, eu encontrei isto aqui."
90101100-169 = "[ns] \"Isto é...\""
90101100-170 = "Definitivamente não parece um pedaço da carapaça do crustáceo."
90101100-171 = "Um fragmento de vidro... ou melhor, parece um espelho que reflete outro mundo."
90101100-172 = "Nós já vimos algo idêntico antes, não vimos?"
90101100-173 = "Quando derrotamos o 'Kunekune', um objeto muito parecido caiu no chão."
90101100-174 = "Aquele fragmento refletia uma pradaria ampla onde o Kunekune costumava vagar, mas... #neste aqui parece completamente escuro, não dá pra enxergar nada."
90101100-175 = "É um tom de azul bem profundo... será que é a paisagem do fundo do mar onde a criatura nasceu?"
90101100-176 = "De qualquer forma, o fato de essas anomalias deixarem o mesmo tipo de 'resíduo' quando derrotadas..."
90101100-177 = ""
90101100-178 = "Aumenta drasticamente a probabilidade de que a recente onda de lendas urbanas e desaparecimentos não seja mera coincidência."
90101100-179 = "Ainda que nos faltem evidências concretas para formular uma dedução conclusiva."
90101100-180 = "Sensei. Poderia ficar sob a custódia deste fragmento também?"
90101100-181 = "[s] \"Pode deixar, vou guardá-lo com cuidado.\""
90101100-182 = "Ufaaa... que cansaço dos infernos..."
90101100-183 = "Bora voltar logo pro QG e—"
90101100-184 = ""
90101100-186 = ""
90101100-187 = "Ué...? Olhem lá... não tem um monte de caranguejos pequenininhos andando entre os contêineres?"
90101100-188 = "Você ficou tão traumatizada com aquele monstro que perdeu a noção de escala? #nAqueles ali são caranguejos adultos normais!"
90101100-189 = "Mas de onde brotou tanto bicho de repente?!"
90101100-190 = ""
90101100-192 = ""
90101100-193 = "...Ah, já sei! #nNão são os caranguejos que a Família Carpaccio tinha comprado pra forjar o boato?"
90101100-194 = "Como as paredes do armazém ruíram no combate, eles escaparam das caixas!"
90101100-195 = "Estão todos marchando em direção ao mar."
90101100-196 = ""
90101100-198 = ""
90101100-199 = ""
90101100-200 = "Ver aquele mundaréu de caranguejos marchando pro oceano com o armazém destruído de fundo... dá até um arrepio na espinha."
90101100-201 = "Parece até que cumpriram a missão deles e tão voltando pra casa..."
90101100-202 = "Pelo visto a pesca nesta enseada vai render caranguejo gordo por um bom tempo."
90101100-203 = "E se somarmos a isso os relatos de testemunhas que viram um galpão sendo esmagado por caranguejos..."
90101100-204 = "Desta vez vai nascer uma nova lenda urbana: 'O Caranguejo Titânico Destruidor de Cidades'!"
90101100-205 = "Nem pensar! Encarar um bicho gigante daqueles já foi um sufoco, agora lidar com um exército inteiro?! Tô fora!"
90101100-206 = ""
90101100-208 = ""
90101100-209 = "Portanto, declarar a missão como encerrada ainda é precipitado."
90101100-210 = "Todas as operadoras: mobilização geral para capturar cada caranguejo que vaga pelas docas!"
90101100-211 = ""
90101100-213 = ""
90101100-214 = "C-Capturar todos...?! Nós quatro?!"
90101100-215 = "Tem centenas deles aí! Quando é que a gente vai terminar de catar tudo isso?!"
90101100-216 = "[s11] \"Mas para não deixar pontas soltas por aí...\"\n[s12] \"Eu também vou ajudar vocês!\""
90101100-219 = "Ai, não é possível..."
90101100-221 = "NUNCA MAIS QUERO VER CARANGUEJO NA MINHA FRENTEEE!!"
90101100-223 = "(Para recapturar os caranguejos que fugiram dos galpões, passei a noite inteira correndo pelas docas junto do Pelotão FOX...)"
90101100-225 = "A Seguir;Epílogo"
