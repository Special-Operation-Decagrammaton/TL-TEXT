[translation]
90101100-1 = "Эпизод 10;Неизменная ценность"
90101100-6 = "Ц... Как оно такое крепкое?"
90101100-7 = "Говорит FOX 3. Броня слишком толстая. Даже мои пули .45 калибра её не пробивают."
90101100-8 = "Запрашиваю огневую поддержку!"
90101100-9 = ""
90101100-13 = ""
90101100-14 = "Выманиваю цель в точку Бета для снайперской поддержки."
90101100-15 = "FOX 4, смени боеприпасы на осколочно-фугасные и после перезарядки оставайся на позиции."
90101100-16 = "Не бронебойные?"
90101100-17 = "Пробитие брони ничего не даст."
90101100-18 = "Она регенерирует слишком быстро, мы не успеем воспользоваться пробоиной."
90101100-19 = "Нужен быстрый решающий удар. Иначе панцирь будет становиться всё толще."
90101100-20 = "Угх. Эта биоброня раздражает сильнее, чем я ожидала."
90101100-21 = "FOX 2, сможешь загнать пулю-слизень в брюшную пластину?"
90101100-22 = ""
90101100-23 = "Да, но придётся подойти гораздо ближе. Сможете выиграть мне время?"
90101100-24 = "Этими кранами можно управлять дистанционно. Попробую подключиться."
90101100-25 = ""
90101100-31 = "...Дам тебе десять секунд."
90101100-32 = "Есть!"
90101100-33 = ""
90101100-38 = "Попадание по цели."
90101100-39 = ""
90101100-42 = "FOX 4. Сможешь попасть в шестиугольный участок брюшной пластины, который только что пробила FOX 2?"
90101100-43 = "Там должно быть слабое место."
90101100-44 = "До цели 700 метров. Ветер с севера на юг, 12 узлов."
90101100-45 = "Проще простого."
90101100-46 = ""
90101100-49 = "Цель уничтожена."
90101100-50 = "Теперь, FOX 3. Мины Claymore!"
90101100-51 = "Сдохни, мерзкое ракообразное!"
90101100-52 = ""
90101100-60 = "Уф! Что за фигня? Оно облило меня какой-то мерзкой жидкостью!"
90101100-61 = "Угх. Отстой. От меня пахнет рыбой."
90101100-62 = "Хаха. Похоже, сегодня день стирки."
90101100-63 = ""
90101100-64 = "Ай, ай-ай..."
90101100-65 = "Аномалия уничтожена. Район безопасен."
90101100-66 = "...Н-Не могу поверить. Краб из слухов действительно..."
90101100-67 = "Что за... Что это за краб вообще...?"
90101100-68 = ""
90101100-70 = ""
90101100-71 = ""
90101100-72 = "Ты там в порядке? В шоке?"
90101100-73 = "Это естественная реакция на сверхъестественного монстра, которого не должно существовать."
90101100-74 = "Мы так старались защищать семейные связи и произведения искусства на этом складе."
90101100-75 = "А этот нелепый краб-монстр всё уничтожил!"
90101100-76 = "Босс меня убьёт!"
90101100-77 = "Понятно. Так вот в чём дело?"
90101100-78 = "Неудивительно, что в порту была такая строгая охрана. Теперь всё сходится."
90101100-79 = "Карма настигает всех. Жаловаться тут особо не на что."
90101100-80 = "Дальше оставим всё Бюро общественного порядка Валькирии."
90101100-81 = "На основании этих данных Валькирия сможет действовать. В отличие от слухов о крабах-монстрах, якобы пожирающих людей."
90101100-82 = ""
90101100-84 = ""
90101100-85 = "..."
90101100-86 = "[s] «Ты в порядке?»"
90101100-87 = "Да, всё нормально. Я поддерживала их с тыла."
90101100-88 = "Нико и Куруми были теми, кто—"
90101100-89 = "[s] «Я не о бое.»"
90101100-90 = ""
90101100-93 = "[ns1] «Во время допроса ты выглядела немного эмоциональной.»\n[ns2] «Это напомнило тебе что-то?»"
90101100-96 = "Тогда..."
90101100-97 = "Прошу прощения. На меня не похоже позволять эмоциям брать верх."
90101100-98 = "Это напомнило мне прошлое... и привело в ярость."
90101100-99 = "[s] «На кого ты злилась?»"
90101100-100 = "...Я и сама не до конца уверена."
90101100-101 = "Я почувствовала всплеск гнева, но не понимаю, на кого он был направлен."
90101100-102 = "Я злилась на капо за причинённый вред? Или потому, что будто смотрела в зеркало?"
90101100-103 = "Может, на общество в целом — за то, что такие случаи происходят снова и снова."
90101100-104 = "Это по-детски. Думаю, я злилась из-за того, что вся ситуация двигалась в направлении, которое я не могла контролировать."
90101100-105 = "[s3] «Это не потому, что ты ребёнок.»\n[s4] «Даже взрослые злятся, когда всё идёт не по их плану.»"
90101100-108 = "И вы туда же, Сенсей?"
90101100-109 = "[s5] «Постоянно!»\n[s6] «Если бы ты не злилась, это означало бы, что тебе вообще всё равно.»"
90101100-112 = ""
90101100-114 = ""
90101100-115 = "Всё именно так, как она сказала. С юридической точки зрения семья Карпаччо технически ничего плохого не сделала."
90101100-116 = "Они распространяли городские легенды через общественность, чтобы создать ложную репутацию и повысить шансы выиграть торги. Закона против этого нет."
90101100-118 = "Но последствия всё равно были. Люди жили в страхе, а окружающее сообщество пострадало, пусть и не от их прямых действий."
90101100-119 = "В последнее время я много об этом думаю. Каким бы строгим и хорошо прописанным ни было правило, преступников оно почти не сдерживает."
90101100-120 = "Человек становится преступником, находя и используя лазейки. Это становится частью ремесла."
90101100-121 = ""
90101100-122 = "А мы, наоборот, устанавливаем правила для уже законопослушных людей, лишь усложняя им жизнь и создавая новых жертв."
90101100-123 = "Это как идея идеальной справедливости... Невозможно найти универсальное решение, которое полностью искоренит преступность в обществе."
90101100-124 = "[s] «Если честно, вполне логично, что ты пришла к такому выводу.»"
90101100-125 = "Значит, это правда."
90101100-126 = "[s] «Потому что правила создаются не для людей сегодняшнего дня.»"
90101100-127 = ""
90101100-129 = ""
90101100-130 = "...А?"
90101100-131 = "[s7] «Легко считать, что правила создаются, чтобы помогать людям.»\n[s8] «Но на деле это люди приспосабливаются к правилам.»"
90101100-132 = ""
90101100-133 = ""
90101100-136 = "[ns9] «Человеческое сердце непостоянно — оно колеблется на каждом шагу.»\n[ns10] «Правила противоположны. Они высечены в камне, и изменить их трудно, даже если хочется.»"
90101100-139 = "[ns] «Поэтому мы часто оказываемся связанными правилами, созданными прошлым и для прошлого.»"
90101100-140 = "Тогда как нам избежать оков прошлого?"
90101100-141 = "По каким правилам могут жить в гармонии люди — ограниченные и переменчивые?"
90101100-142 = "[s] «Вместо этого стоит смотреть на жизнь через наши неизменные ценности.»"
90101100-143 = "Неизменные... ценности."
90101100-144 = "[ns] «Юкино, твоё определение 'справедливости' оставалось неизменным?»"
90101100-145 = ""
90101100-147 = ""
90101100-148 = "Хочется верить, что да."
90101100-149 = "[s] «Тогда перестрой правила вокруг своей неизменной справедливости.»"
90101100-150 = "Да."
90101100-151 = ""
90101100-153 = ""
90101100-154 = ""
90101100-155 = ""
90101100-156 = "О чём вы так серьёзно разговариваете?"
90101100-157 = "*вздох* Вы что, планируете встретиться с Сенсеем на выходных? БЕЗ НАС?"
90101100-158 = "Нет, конечно нет. Мы обсуждаем уборку и то, как доложить об этом Генеральному студенческому совету."
90101100-159 = ""
90101100-161 = ""
90101100-163 = ""
90101100-164 = "Мы верну-у-улись!"
90101100-165 = "С возвращением, FOX 2. На месте были другие гражданские?"
90101100-166 = "Неа. Управление порта хорошо перекрыло район после нашей просьбы."
90101100-167 = "Но... я нашла это рядом с крабом."
90101100-169 = "[ns] «Это...»"
90101100-170 = "Похоже, это не часть самого краба."
90101100-171 = "Согласна. Это стекло... словно зеркало, отражающее другой мир."
90101100-172 = "Разве мы не видели нечто подобное раньше?"
90101100-173 = "Ага. Помню, когда мы уничтожили кунэ-кунэ."
90101100-174 = "В том отражалось поле... а это пустое."
90101100-175 = "Не совсем пустое — есть тёмно-синий оттенок. Может, это море, откуда пришёл краб?"
90101100-176 = "Как бы то ни было, разные Лоры, с которыми мы сталкивались, оставляют предметы с похожими свойствами."
90101100-177 = ""
90101100-178 = "Это усиливает теорию, что кто-то за кулисами намеренно провоцирует внезапный рост городских легенд и исчезновений."
90101100-179 = "Хотя доказательств для выводов у нас пока нет."
90101100-180 = "Сенсей, можете сохранить и этот осколок?"
90101100-181 = "[s] «Конечно. Я буду хранить его в безопасности.»"
90101100-182 = "Фух, я вымоталась..."
90101100-183 = "Давайте уже вернёмся—"
90101100-184 = ""
90101100-186 = ""
90101100-187 = "А? Мне кажется или из тех контейнеров действительно высыпается куча маленьких крабов?"
90101100-188 = "После боя с крабом-монстром у тебя сбился масштаб? Это обычные крабы."
90101100-189 = "Да поняла я. Но ОТКУДА они взялись?"
90101100-190 = ""
90101100-192 = ""
90101100-193 = "А, знаю. Наверное, это те, которых семья Карпаччо купила для запугивания людей."
90101100-194 = "Склад рухнул. Они воспользовались шансом и сбежали."
90101100-195 = "Наверное, ты права. Похоже, они направляются к морю."
90101100-196 = ""
90101100-198 = ""
90101100-199 = ""
90101100-200 = "Жуткое зрелище. Не каждый день увидишь, как крабы строем идут от разрушенных зданий."
90101100-201 = "Будто крабы вышли из моря, уничтожили человеческие поселения и теперь возвращаются домой."
90101100-202 = "Краболовы очень удивятся неожиданному росту популяции крабов."
90101100-203 = "И после этого наверняка разойдутся слухи о крабе, достаточно большом, чтобы разрушать здания."
90101100-204 = "Новая городская легенда: бесчисленные крабы-монстры поднимаются из океана, чтобы уничтожить человечество!"
90101100-205 = "ПОЖАЛУЙСТА, даже не произноси это вслух! С одним крабом было тяжело. Как мы справимся с целой армией?"
90101100-206 = ""
90101100-208 = ""
90101100-209 = "Наша миссия ещё не закончена."
90101100-210 = "Отряд, рассредоточиться и собрать всех крабов, бродящих по порту. Немедленно."
90101100-211 = ""
90101100-213 = ""
90101100-214 = "Под отрядом ты имеешь в виду отряд FOX? А под всех — каждого до единого?"
90101100-215 = "Это же займёт вечность!"
90101100-216 = "[s11] «Подумайте о нас будущих...»\n[s12] «Я тоже помогу.»"
90101100-219 = "Серьёзно..."
90101100-221 = "Я больше никогда не хочу видеть краба!"
90101100-223 = "Я провёл всю ночь с отрядом FOX в порту, ловя крабов, сбежавших со склада..."
90101100-225 = "Следующий эпизод;Эпилог"
