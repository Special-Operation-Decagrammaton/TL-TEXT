[translation]
10017010-1 = "Эпизод 1;Тайный сад"
10017010-2 = ""
10017010-3 = ""
10017010-4 = ""
10017010-5 = ""
10017010-6 = ""
10017010-7 = "Звенят колокольчики, звенят колокольчики! Всю дорогу!"
10017010-9 = "Ханаэ уже так воодушевлена."
10017010-10 = ""
10017010-12 = ""
10017010-13 = "Но если не об этом, вам не тяжело, Сенсей?"
10017010-14 = "[s1] «Не так уж тяжело.»\n[s2] «Это всё от тебя и Ханаэ. Я обязан нести!»"
10017010-17 = "Хахаха. Я вам отплачу."
10017010-19 = ""
10017010-21 = ""
10017010-22 = ""
10017010-23 = ""
10017010-24 = ""
10017010-25 = "Нужно спешить, пока не поздно!"
10017010-27 = "О? Это член Боевой группы Правосудия? Куда она так спешит?"
10017010-28 = "Здравствуйте! Счастливого Рождества!"
10017010-29 = "О, Рыцари скорой помощи. Я всегда ценю вашу работу. Счастливого Рождества."
10017010-30 = "О, и Сенсей?! П-простите меня!"
10017010-31 = "[s3] «Не нужно так напрягаться рядом со мной.»\n[s4] «Ты выглядишь занятой. Куда направляешься?»"
10017010-34 = "Куда я иду? Эм, это..."
10017010-35 = "Ну, если это Рыцари скорой помощи и Сенсей, думаю, можно сказать."
10017010-36 = "Сегодня вечером Боевая группа Правосудия устраивает вечеринку в честь конца года для всех своих членов!"
10017010-37 = "О, но будут не все. Кохару останется с Клубом дополнительных занятий."
10017010-38 = "А с прошлой недели Ичика отправлена в академию Хяккияко на их новогоднее мероприятие для укрепления сотрудничества."
10017010-39 = "А, понятно. Жаль, что она не сможет прийти на вечеринку здесь."
10017010-40 = "К счастью, слышала, что новогоднее мероприятие Хяккияко довольно масштабное, так что уверена, она хорошо проводит время."
10017010-41 = "В общем, говорят, они зарезервировали неподалёку кафе White & Mason."
10017010-42 = "White & Mason? Говорят, туда даже обычный столик достать сложно! А арендовать всё заведение — это круто!"
10017010-44 = "Членам Боевой группы Правосудия не помешает отдых..."
10017010-45 = "Вовсе нет. То, что делаем мы, ничто по сравнению с Рыцарями скорой помощи."
10017010-46 = "В любом случае нам ещё нужно кое-что подготовить к вечеринке."
10017010-47 = "О, значит, вы как раз туда и направляетесь. Простите, не буду задерживать."
10017010-48 = "Спасибо. Если будет время, загляните в кафе."
10017010-49 = "Президент и вице-президент будут рады вас видеть."
10017010-51 = "Спасибо! Надеюсь, у нас получится прийти!"
10017010-53 = ""
10017010-56 = "[ns] «Боевая группа Правосудия действительно берёт выходной?»"
10017010-57 = "Это здорово! Они всегда так много работают!"
10017010-58 = "Согласна. Разве Рождество не прекрасно?"
10017010-59 = "[s] «Вы двое и сами немало работаете.»"
10017010-60 = "Правда? Я просто делаю свою работу."
10017010-61 = "К тому же помогать людям так весело!"
10017010-62 = "Мы делаем столько добрых дел..."
10017010-63 = "Значит, в этом году мы точно получим подарки от Санта-Клауса, да?"
10017010-64 = "Хахаха. Да, конечно, я уверена."
10017010-65 = ""
10017010-67 = ""
10017010-69 = "(Я почти забыла, что Ханаэ всё ещё верит в Санту... Надо придумать для неё хороший подарок.)"
10017010-70 = "(Может, потом спрошу у Сенсея...)"
