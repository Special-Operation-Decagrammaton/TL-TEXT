[translation]
2006306-1 = "The Winds That Caressed Her"
2006306-3 = "I'm all set, Sensei."
2006306-4 = "Let's secure the IMINT for the PSR."
2006306-5 = "[s1] \"I heard you say these terms earlier.\"\n[s2] \"What exactly is PSR and IMINT?\""
2006306-8 = "I abbreviated them out of habit. Sorry for not explaining sooner."
2006306-9 = "They stand for [ruby=PSR]post-strike reconnaissance[/ruby] and [ruby=IMINT]imagery intelligence[/ruby], respectively."
2006306-10 = "I really need your help with this."
2006306-11 = "[s] \"What do I have to do?\""
2006306-12 = "To put it simply—photography."
2006306-13 = "I was asked to provide evidence that I'd participated in the tournament. #nIt's an assignment that'll give me credits for the classes I've failed."
2006306-14 = "I can handle writing about the experience, but taking pictures is too hard for me..."
2006306-15 = "[s] \"Well, I'm something of an expert at photographing club activities myself.\""
2006306-16 = "Just as I'd expect from you. That's reassuring to hear."
2006306-17 = "I've done some research, but I'll be relying on your instructions for the finer#ndetails."
2006306-21 = "Let's reposition over there. #nI believe being in a place with good sunlight would be better."
2006306-22 = "The weather's just as nice as was it forecasted."
2006306-23 = "That does mean it's a bit hot, but this much I'm used to. It shouldn't get in the way#nof the photos."
2006306-36 = "Phew... Thanks for giving it your all during the photoshoot, Sensei."
2006306-37 = "I'm a little tired, so I'll take a short break—"
2006306-42 = "Ah, there's that adorable competitor from earlier!"
2006306-46 = "She's together with an adult...! I wonder who they are?"
2006306-52 = "Maybe they're the one from the rumors...?"
2006306-57 = "..."
2006306-58 = "..."
2006306-59 = "[s] \"Azusa's just so cute, isn't she!?\""
2006306-64 = "Like, totally! Could we get a photo with her?"
2006306-67 = "Me too! Me too!"
2006306-68 = "Looks like people at this academy don't have any sense of distance either..."
2006306-69 = "...Ah. #nCome to think of it, I need photos of myself interacting with others as well."
2006306-70 = "Sensei, could you help me out?"
2006306-71 = "[s] \"Leave it to me! Alright everyone, gather around!\""
2006306-79 = "Hnn...gh..."
2006306-80 = "The sun's a lot stronger... than I thought..."
2006306-84 = "Take a picture with me nex―"
2006306-85 = "Hah... haah..."
2006306-86 = "Head's... spinning..."
2006306-90 = "[ns] \"Azusa!?\""
2006306-91 = "Are you alright!?"
2006306-92 = "[s] \"Let's get you into some shade!\""
2006306-93 = "Sen...sei..."
2006306-100 = "[wa:2510]― [log=아즈사 레이싱]Ah...[wa:218] I'm sorry,[wa:1932] Sensei.[/log]"
2006306-103 = "― [log=아즈사 레이싱]The sun was stronger than I expected...[wa:1800] I was careless.[/log]"
2006306-105 = "― [log=아즈사 레이싱]I just need... a little break...[/log]"
2006306-108 = "[ns] \"Looks like you got heatstroke. Are you alright?\""
2006306-109 = "[wa:640]― [log=아즈사 레이싱]...Yeah,[wa:436] I'm fine.[wa:1264] I'll be back up soon.[/log]"
2006306-111 = "― [log=아즈사 레이싱]I feel like I've been growing soft lately.[wa:100] I'm realizing how insufficient[wa:1000] my training has been.[/log]"
2006306-114 = "― [log=아즈사 레이싱]I'll do my best to not[wa:650] disappoint you anymore.[/log]"
2006306-116 = "― [log=아즈사 레이싱]...I'm sorry.[wa:1000] I really am.[/log]"
2006306-119 = "[ns3] \"Your teacher wouldn't be disappointed by something like this.\"\n[ns4] \"You don't have to apologize to your teacher for something like this.\""
2006306-122 = "[wa:730]― [log=아즈사 레이싱]...Ah.[/log]"
2006306-124 = "― [log=아즈사 레이싱]I don't have to apologize...?[wa:3260] I see.[/log]"
2006306-127 = "― [log=아즈사 레이싱]Back then...[wa:800] I would've been severely chastised.[/log]"
2006306-129 = "― [log=아즈사 레이싱]This reaction—[wa:100]it became a habit.[/log]"
2006306-132 = "[wa:3680]― [log=아즈사 레이싱]...The wind is blowing.[/log]"
2006306-135 = "― [log=아즈사 레이싱]In the past, I'd have to consider the wind direction and its effects on ballistics…[/log]"
2006306-137 = "― [log=아즈사 레이싱]And on other things.[/log]"
2006306-140 = "― [log=아즈사 레이싱]But things are different now.[/log]"
2006306-143 = "[wa:2850]― [log=아즈사 레이싱]It's just cool...[wa:1250] and pleasant—[/log]"
2006306-145 = "― [log=아즈사 레이싱]To be able to experience it together with you...[wa:2000] It makes me happy.[/log]"
2006306-149 = "Phew... After taking a short break, I feel better now."
2006306-150 = "I've got enough photos. Let's head back."
2006306-151 = "[s] \"Let's get some water and take a rest somewhere cool.\""
2006306-152 = "Sure. That sounds good."
2006306-153 = "...I feel at ease when I'm with you."
2006306-154 = "So... I'd like it if you could stay with me a bit longer."
2006306-156 = "(After that, I brought Azusa to somewhere with air conditioning.)"
2006306-157 = "(Perhaps due to exhaustion, she fell asleep soon after.)"
2006306-158 = "(I watched over Azusa as she slept, staying by her side until she woke up.)"