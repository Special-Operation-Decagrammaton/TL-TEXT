[translation]
2005803-1 = "Эрика, ночная прогулка"
2005803-2 = ""
2005803-3 = "Сенсей, здравствуйте!"
2005803-4 = "Ого, странно видеть вас так поздно."
2005803-5 = "[s1] «И правда уже поздно.»\n[s2] «Ты голодна?»"
2005803-8 = "Немного?"
2005803-9 = ""
2005803-11 = ""
2005803-12 = "...Или, может, сильно."
2005803-13 = "Внезапно накрыло. Я бы точно что-нибудь съела."
2005803-14 = "[s3] «Я тоже умираю с голоду.»\n[s4] «Чего-нибудь хочется?»"
2005803-17 = "Хм..."
2005803-18 = ""
2005803-20 = "Как насчёт этого?"
2005803-23 = "Вдруг захотелось бургеров! Хаха."
2005803-24 = "Вы их любите, Сенсей? Может, уже надоели."
2005803-25 = "[s5] «Бургеры мне НИКОГДА не надоедят!»\n[s6] «Идеальная еда на поздний вечер.»"
2005803-28 = "Правда? Вы не просто соглашаетесь, потому что я сказала, что хочу?"
2005803-29 = "Хорошо. Фуфу."
2005803-30 = "Несмотря на поздний час, тут полно людей. И все, похоже, отлично проводят время."
2005803-31 = "В ночных фастфудах есть что-то возбуждающее."
2005803-32 = "По идее сейчас мы должны готовиться ко сну, а вместо этого пришли есть калории. Будто освобождаешься от оков общества? И ещё чуть-чуть вины сверху?"
2005803-33 = "[s7] «Чувство, которым наслаждаешься прямо сейчас...»\n[s8] «...не думая о будущем?»"
2005803-36 = "Да, вы понимаете. Такое «ой, ну и ладно» настроение."
2005803-37 = ""
2005803-39 = ""
2005803-40 = "Ого, быстро."
2005803-41 = ""
2005803-47 = "[ns] «Вот ваш заказ!»"
2005803-48 = "Вы ещё и купили, и принесли? Спасибо, Сенсей."
2005803-49 = "Что вы заказали?"
2005803-50 = "[s9] «Комбо с тройным чизбургером!»\n[s10] «Комбо с бургером с креветкой!»"
2005803-53 = "О, давайте поменяемся. Я заказала именно его."
2005803-54 = ""
2005803-56 = ""
2005803-57 = "Комбо с бургером, беконом, томатом и сыром!"
2005803-58 = "[s11] «Томата нет.»\n[s12] «Они перепутали заказ?»"
2005803-61 = "А. Я попросила без томата."
2005803-62 = "Не то чтобы я их не люблю... Просто их неудобно есть."
2005803-63 = "Очень легко случайно вытащить весь ломтик целиком, когда кусаешь."
2005803-64 = "А потом выглядишь глупо с огромным куском помидора, свисающим изо рта."
2005803-65 = "Мы не так часто едим вместе, поэтому мне не хотелось, чтобы вы это увидели."
2005803-66 = "Можно было просто «отдать его вам»?"
2005803-67 = "..."
2005803-68 = "Почему-то это звучит ещё более неловко."
2005803-69 = "Хаха. В следующий раз спрошу."
2005803-70 = ""
2005803-72 = ""
2005803-73 = "Ну а теперь..."
2005803-74 = "Спасибо за еду, Сенсей!"
2005803-76 = "Мы с Эрикой приятно провели поздний ужин за отличным разговором."
