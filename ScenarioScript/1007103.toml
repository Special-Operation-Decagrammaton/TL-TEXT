[translation]
1007103-1 = "SRT, тренируемся!"
1007103-3 = "Во время операции в море нужно учитывать множество разных факторов."
1007103-4 = "На кораблях узкие проходы и крутые лестницы, поэтому они идеально подходят для вражеских засад."
1007103-5 = "К тому же корабль в море постоянно качается, из-за чего в разгар боя сложнее целиться из оружия."
1007103-6 = "Лучший способ преодолеть эти сложности — постоянные тренировки, но..."
1007103-7 = "У отряда RABBIT был слишком короткий период подготовки, и у нас почти не было возможности тренировать морские операции."
1007103-8 = "Поэтому, когда мы приехали сюда, я подумала, что это отличный шанс провести несколько упражнений на настоящем корабле."
1007103-9 = "К счастью, один из местных жителей согласился одолжить нам лодку."
1007103-10 = "[s] «Это здорово!»"
1007103-12 = "[ns1] «Так чем именно тебе нужна была моя помощь?»\n[ns2] «Я вообще-то не умею управлять кораблём...»"
1007103-15 = "Я возьму штурвал на себя."
1007103-16 = "Мне нужно, чтобы в наших учениях вы сыграли роль заложника..."
1007103-17 = ""
1007103-19 = ""
1007103-20 = "Будет быстрее, если я просто покажу."
1007103-21 = "Сенсей, пожалуйста, поднимайтесь на борт. Когда доберёмся до места, я всё объясню."
1007103-22 = "[s] Подняться на борт."
1007103-23 = ""
1007103-28 = "Отчаливаем. Все, пожалуйста, проверьте, что спасательные жилеты надёжно застёгнуты."
1007103-29 = ""
1007103-33 = "Через некоторое время мы остановились... посреди океана..."
1007103-37 = "Мы пришли!"
1007103-38 = "От берега сюда слишком далеко плыть, а вода здесь неспокойная, так что для наших целей место идеально подходит."
1007103-39 = "Сегодня мы моделируем морскую операцию по спасению заложника."
1007103-40 = "Вы играете роль военнопленного. Вам нужно лишь неподвижно стоять в этой комнате."
1007103-41 = "...Хорошо. Сейчас я вас свяжу, Сенсей."
1007103-42 = ""
1007103-47 = "[ns] «Н-Не слишком туго?»"
1007103-48 = "Учения были бы недостаточно реалистичными, если бы вы всё ещё могли свободно двигаться."
1007103-49 = "Если мы хотим чему-то научиться, должны относиться к тренировке максимально серьёзно. Простите за неудобства."
1007103-50 = "Теперь, когда вы готовы, остаётся лишь дождаться начала спасательной операции на палубе..."
1007103-51 = ""
1007103-53 = ""
1007103-54 = "...Ах."
1007103-55 = "[s] «Что-то не так?»"
1007103-56 = "Хм... Я попросила вас сыграть заложника, но забыла назначить кого-нибудь на роль похитителей..."
1007103-57 = "Я так обрадовалась, что у нас наконец есть корабль, что допустила настолько очевидную ошибку..."
1007103-58 = "Даже если мы вас спасём, смысла не будет, если нам не придётся преодолевать сопротивление противника."
1007103-59 = "[s3] «Какая жалость...»\n[s4] «Похоже, придётся на сегодня закончить.»"
1007103-60 = "Ну что ж. Вместо спасательной операции изменим цель тренировки: будем отрабатывать обращение с пленным и его удержание в море."
1007103-61 = "Ну что ж. Вместо спасательной операции изменим цель тренировки: будем отрабатывать обращение с пленным и его удержание в море."
1007103-62 = ""
1007103-65 = "[ns5] «Эм... Мияко?»\n[ns6] «Пожалуйста, развяжи меня...»"
1007103-68 = "Сенсей. Вы наш захваченный пленник, поэтому, пожалуйста, точно следуйте моим указаниям."
1007103-69 = "Как я и сказала..."
1007103-70 = ""
1007103-72 = ""
1007103-73 = ""
1007103-74 = "Я очень серьёзно отношусь к тренировкам."
1007103-76 = "Остаток дня я наслаждался морской прогулкой в роли пленника Мияко."
