[translation]
10038110-1 = "Эпилог;Начнём фестиваль!"
10038110-2 = "Так завершилась вспышка синдрома Тайка, погрузившая Саньхайцзин в хаос."
10038110-6 = ""
10038110-7 = "Фестиваль лунного света наконец начался. Вы проделали потрясающую работу, госпожа президент."
10038110-8 = "Ты и сама была великолепна. Подготовка к фестивалю в этом году была... мягко говоря, незабываемой."
10038110-9 = "...Не уверена, что всё произошедшее технически относится к подготовке фестиваля, но комплимент принимаю."
10038110-10 = "Но вы... вы действительно невероятны, госпожа президент! Вы прекратили весь хаос и вернули всё как было!"
10038110-11 = "Если бы не вы, Саньхайцзин до сих пор мог бы тонуть в хаосе, не видя дороги вперёд."
10038110-12 = "Ох, хватит уже. Я лишь сделала то, что было необходимо."
10038110-13 = "...А теперь скажи, что вы сделали с теми участниками, которые устроили «беспорядки»?"
10038110-14 = "Всех записали на перевоспитание и общественные работы, начав с самого низа."
10038110-15 = "Будь моя воля, я бы исключила каждую из них и проследила, чтобы они больше нигде не смогли вступить ни в какую организацию, но..."
10038110-16 = "Не нужно. Они делали то, что считали правильным."
10038110-17 = ""
10038110-19 = ""
10038110-21 = "А теперь — фестиваль."
10038110-24 = ""
10038110-25 = "...Ах, Сенсей. Вы пришли."
10038110-26 = "Не то чтобы я намекала, будто вы слишком долго шли. В общем..."
10038110-27 = "Позвольте мне сделать то, о чём просили Руми и госпожа Кисаки, и... А?"
10038110-28 = ""
10038110-35 = ""
10038110-36 = "О, вы здесь, Сенсей. Уже поговорили с Рэйдзё?"
10038110-37 = "Ах, понятно. Да, обычно подобными делами занимается Гэнрюмон. Обычно здесь была бы либо исполнительный офицер Мина, либо глава отдела по связям с общественностью, но..."
10038110-38 = "Как вы знаете, мы все очень заняты Фестивалем лунного света."
10038110-39 = "Я думала лично вас сопровождать, но..."
10038110-40 = "Нет, забудьте, я оговорилась. Не обращайте внимания."
10038110-41 = "Рэйдзё, от имени Саньхайцзина прошу хорошо позаботиться о Сенсее."
10038110-42 = ""
10038110-45 = ""
10038110-46 = "И мы можем вызвать вас в любой момент, так что будьте начеку."
10038110-47 = ""
10038110-49 = ""
10038110-51 = ""
10038110-52 = "*вздыхает*"
10038110-53 = ""
10038110-55 = ""
10038110-56 = "Ладно, идём, Сенсей. Фестиваль ждёт."
10038110-59 = "Я боялась, что в этом году мы вообще не сможем его провести. Здорово видеть, что всё вернулось в норму."
10038110-60 = "И, судя по всему, даже Гэнрюмон теперь не станет нам особо мешать."
10038110-61 = "...Если честно, даже если бы захотели, у них сейчас просто не хватает людей."
10038110-62 = ""
10038110-64 = ""
10038110-68 = ""
10038110-69 = ""
10038110-70 = "Ты пришла НА фестиваль в форме?"
10038110-71 = "Мне её посоветовали! ...Практически приказали. В этом году будет много гостей из других школ."
10038110-72 = "Мне сказали: «Можешь идти, но будь в форме и будь готова ко всему.»"
10038110-73 = "Хи-хи, небось ты почти надеешься, что что-нибудь всё-таки случится."
10038110-74 = ""
10038110-76 = ""
10038110-77 = "Нет, совсем нет. Категорически. Особенно в этом году. После ВСЕГО, что УЖЕ произошло, мы все заслужили передышку."
10038110-78 = "Да, справедливо. Хотя было очень смешно, когда ты превратилась в ребёнка."
10038110-79 = "Обхохочешься. С тобой ведь тоже это случилось, помнишь..."
10038110-82 = "Говорят, во время истории с синдромом Тайка сделали кучу фотографий."
10038110-83 = "Судя по всему, в основном для того, чтобы друзья потом друг друга ими дразнили."
10038110-84 = ""
10038110-86 = ""
10038110-87 = "Хм? Спрашиваете, есть ли у меня фото маленькой Руми?"
10038110-88 = "К-Кем вы меня считаете, Сенсей? Я как раз пресекаю распространение этих фотографий!"
10038110-91 = ""
10038110-92 = "...Хотя Руми повесила одну фотографию у главных ворот Променада на память, так что, может, я и не смогу это остановить..."
10038110-93 = ""
10038110-97 = ""
10038110-98 = "О, начинается Пекинская опера."
10038110-99 = ""
10038110-101 = ""
10038110-102 = ""
10038110-104 = ""
10038110-106 = ""
10038110-108 = ""
10038110-111 = "Многие студенты рады, что Клуб пекинской оперы успел вернуться к фестивалю."
10038110-112 = "...Наверное, лучше замять всю эту историю с Кагуей."
10038110-113 = "По крайней мере до конца фестиваля. Президент Кисаки хочет, чтобы всё прошло спокойно."
10038110-114 = "А стабильность поддерживает рынок, так что с точки зрения бизнеса меня всё устраивает. ...Хм?"
10038110-115 = ""
10038110-120 = ""
10038110-121 = "Наслаждаетесь фестивалем, Сенсей? Представление Пекинской оперы под открытым небом должно начаться примерно сейчас."
10038110-122 = "О? Хотите знать, зачем я позвонила?"
10038110-123 = "...Я всегда считала, что для звонка кому-то не обязательно нужна конкретная причина."
10038110-124 = "Уверена, вы это понимаете, Сенсей."
10038110-125 = "Но всё же, как там всё проходит? Теперь, когда Саньхайцзин открыт для остального Кивотоса."
10038110-126 = ""
10038110-130 = "Ах, значит, наши студенты и гости хорошо ладят и знакомятся друг с другом?"
10038110-131 = "И вы видите, как усердно работают члены Гэнрюмона?"
10038110-132 = "......"
10038110-133 = "Что ж, значит, Гэнрюмон выполняет своё предназначение. Благодарю за отзыв, Сенсей."
10038110-134 = "Хорошо, продолжайте наслаждаться фестивалем."
10038110-135 = ""
10038110-137 = ""
10038110-139 = "......"
10038110-140 = "Она могла бы просто сказать, что хотела поговорить..."
10038110-141 = ""
10038110-143 = ""
10038110-144 = "...Неважно. Идём дальше."
10038110-145 = ""
10038110-147 = ""
10038110-151 = ""
10038110-154 = ""
10038110-156 = ""
10038110-157 = ""
10038110-158 = ""
10038110-160 = ""
10038110-161 = ""
10038110-162 = ""
10038110-163 = ""
10038110-165 = ""
10038110-166 = ""
10038110-167 = ""
10038110-169 = ""
10038110-170 = ""
10038110-171 = ""
10038110-173 = ""
10038110-176 = "Что ж, для Променада всё сложилось очень удачно."
10038110-177 = "Не ожидала, что Гэнрюмон примет решение, которое действительно нам поможет."
10038110-178 = "Хотя есть один нюанс... Больше клиентов — больше толпа, а значит, сложнее поддерживать порядок."
10038110-179 = ""
10038110-181 = ""
10038110-182 = "Я знаю, что студенты Геенны и Тринити не ладят, но впервые вижу, как они сталкиваются лицом к лицу."
10038110-183 = "О, и вон там тоже..."
10038110-184 = ""
10038110-186 = ""
10038110-188 = ""
10038110-189 = ""
10038110-190 = ""
10038110-194 = ""
10038110-196 = ""
10038110-198 = ""
10038110-199 = ""
10038110-200 = ""
10038110-202 = "Хм. Хорошо, что Мина оказалась рядом и разобралась."
10038110-203 = "Знаете, мне кажется, наше присутствие здесь может только усугубить ситуацию. Давайте пойдём куда-нибудь ещё."
10038110-206 = "Ну как вам «Источник персикового цветения»?"
10038110-207 = "Похоже, гости из других школ разделились: одним здесь спокойно, а другим просто не нравится чай."
10038110-208 = ""
10038110-210 = ""
10038110-212 = ""
10038110-213 = ""
10038110-215 = ""
10038110-217 = "Хи-хи, персонал выглядит растерянным. Наверное, думают..."
10038110-218 = "...«Зачем вообще покупать чай по 100 иен за грамм, а потом добавлять в него молоко?»"
10038110-219 = "Как представитель Променада Чёрной Черепахи, считаю, что всё сводится к личному вкусу..."
10038110-220 = "...и пока никто не причиняет вреда другим, мы должны уважать выбор друг друга."
10038110-221 = "Но всё же чай по 100 иен за грамм — и для молочного чая..."
10038110-222 = "...Лучше промолчу."
10038110-223 = ""
10038110-225 = ""
10038110-226 = ""
10038110-227 = "(Серьёзно, это как точить нож золотым слитком...)"
10038110-228 = "И всё же даже это идёт Променаду на пользу, хотя бы чисто по цифрам."
10038110-231 = "Теперь у «Источника персикового цветения» появился спрос на молочные продукты."
10038110-232 = "А поставлять товары туда, где есть спрос, Променад умеет лучше всего."
10038110-235 = "Разумеется, в Гэнрюмоне полно фанатиков чая, которые не потерпят такого святотатства."
10038110-236 = "Полагаю, они будут нами не слишком довольны."
10038110-237 = "Но они и раньше нас не любили, так какая разница?"
10038110-238 = ""
10038110-240 = ""
10038110-241 = "О? Думаете, нам всё равно стоит попытаться поладить? Я... была бы РАДА, если бы это было возможно, но..."
10038110-242 = ""
10038110-245 = ""
10038110-246 = "Ах, фейерверк. Давайте сядем у окна, Сенсей."
10038110-247 = ""
10038110-249 = ""
10038110-254 = "Вот теперь всё как надо. НАКОНЕЦ-то настоящий Фестиваль лунного света."
10038110-255 = "...Особенный, потому что вы здесь, Сенсей."
10038110-256 = ""
10038110-260 = ""
10038110-261 = "Что— Она опять звонит?!"
10038110-262 = ""
10038110-264 = ""
10038110-266 = ""
10038110-267 = "Ах, вы, должно быть, в «Источнике персикового цветения», Сенсей."
10038110-268 = "Наслаждаетесь фестивалем? Наверняка атмосфера необычная, со всеми студентами из других школ."
10038110-269 = "Да... Я рада, что вы так думаете."
10038110-270 = "Сенсей, вы... знаете историю, связанную с Фестивалем лунного света? Историю о мудреце?"
10038110-271 = "О, ну, раз знаете, я могу сразу перейти к сути."
10038110-274 = "Как вам известно, мудрец из этой истории отправился на Луну, вернулся, а затем после множества испытаний... снова ушёл на Луну."
10038110-275 = "В Саньхайцзине мудрецов считают непостижимыми, а их истинную природу — непознаваемой."
10038110-276 = "Одни добрые, другие злые. Некоторые и вовсе демонические."
10038110-279 = "И... возможно, мы никогда не узнаем, какой именно мудрец посетил нас."
10038110-280 = "Некоторые считают, что любой мудрец непременно должен быть злым."
10038110-281 = "Уж точно никто не приглашает их в гости."
10038110-282 = "Думаю, смысл в том, чтобы не пугаться заранее, госпожа."
10038110-283 = "У нас и без того хватает забот, если сосредоточиться на том, что происходит здесь и сейчас."
10038110-284 = "Если будем переживать о том, чего ещё даже не случилось, мы вообще ничего не сможем сделать."
10038110-285 = ""
10038110-288 = ""
10038110-289 = "Фуфу, хорошо сказано."
10038110-290 = "К тому же, занимаясь бизнесом, быстро понимаешь: непредсказуемые клиенты — обычное дело."
10038110-291 = "Это тоже верно, но..."
10038110-292 = "Эй, Сенсей, давайте вернёмся наружу. Фестиваль только начинается."
10038110-293 = "В смысле вы думали, что он уже заканчивается? Он длится три дня! Это только первый день!"
10038110-294 = "Сейчас узнаете, что такое настоящее гостеприимство Саньхайцзина!"
10038110-295 = ""
10038110-297 = ""
10038110-299 = "Идём, Сенсей. Сюда!"
10038110-300 = ""
10038110-303 = ""
10038110-305 = ""
10038110-309 = ""
10038110-313 = ""
10038110-315 = ""
10038110-317 = ""
10038110-319 = ""
10038110-328 = "Нисхождение чувств"
