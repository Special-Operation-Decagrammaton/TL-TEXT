[translation]
902-1 = "Хокма, Древний хранитель царства"
902-2 = "Здравствуйте, Сенсей."
902-3 = "Поскольку ситуация чрезвычайная, придётся сразу перейти к сути брифинга."
902-4 = "Возле вулкана в полярном регионе Кивотос появилось загадочное судно."
902-5 = "...Да. Трудно придумать две вещи, которые на первый взгляд были бы меньше связаны между собой, чем вулкан и корабль."
902-6 = "Я тоже усомнилась в отчёте, когда впервые его получила..."
902-7 = "Но прямо сейчас это загадочное судно идёт по лаве вулкана."
902-8 = "И, похоже, чем ближе корабль подходит, тем активнее становится вулкан."
902-9 = "Пока мы не установили, как именно это происходит, но уверены, что судно напрямую влияет на извержения вулкана."
902-10 = "...При анализе ситуации нам помог неизвестный информатор."
902-11 = "Установить его личность не удалось. Несмотря на многочисленные независимые расследования, мы ничего о нём не выяснили."
902-12 = "Кроме того, полученные от него сведения выглядели довольно фантастично."
902-13 = "Он называл себя одной из «десяти непроизносимых священных частей» и говорил о пророках, прокладывающих путь к божественности."
902-14 = "Если оставить странность отчёта в стороне, сам вулкан вполне реален и требует срочных действий."
902-15 = "Изучив предыдущие записи и масштабы вулкана, мы считаем, что полное извержение способно вызвать вулканическую зиму по всему Кивотос."
902-16 = "Поэтому, если возможно, нам нужно, чтобы вы исследовали это загадочное судно... и остановили извержения."
902-17 = "Как бы мы ни рассматривали ситуацию, связь между судном и вулканической активностью невозможно игнорировать."
902-18 = "...Кроме того, по словам информатора, вокруг вулкана предусмотрены некие меры защиты."
902-19 = "Информатор сообщил, что корабль называется Хокма, Древний хранитель царства."
902-20 = "Его значение и смысл... мы всё ещё выясняем."
902-21 = "Что ж, остальное оставляем вам, Сенсей."
