[translation]
10003055-2 = "Надо было догадаться, что с Сенсеем на вашей стороне нам придётся нелегко."
10003055-3 = ""
10003055-4 = ""
10003055-5 = "Все, тактическое отступление!"
10003055-7 = "Преследовать их, Чинацу?"
10003055-8 = "Нет. Если бой станет ещё интенсивнее, президент заметит."
10003055-9 = "[s1] «По крайней мере, всё не слишком вышло из-под контроля.»\n[s2] «Хотя кукуруза и правда выглядела вкусно.»"
10003055-10 = "А если бы мы просто заперли их и выбросили ключ, больше никогда не пришлось бы о них беспокоиться."
10003055-11 = "*вздох* Сенсей."
10003055-12 = "Простите, что заставила ждать. А?"
10003055-13 = "Почему вы все так вымотаны?"
10003055-15 = "Понятно. Значит, Общество гурманов напало. И что это ещё за кукуруза?"
10003055-16 = "Как бы то ни было, скоро у нас запланированная тренировка с президенткой."
10003055-17 = "Пожалуйста, продержитесь ещё немного. Ради Хины."
10003055-18 = "Ага, ага. Мы поняли."
10003055-19 = "Хорошо. Тогда возвращаемся."
10003055-20 = ""
10003055-23 = "После этого пришло время прогулки Хины по пляжу, замаскированной под вечернюю тренировку. Но я так устал за день, что едва сохранял видимость нормальности."
10003055-24 = "Наконец день закончился, и наступила ночь."
