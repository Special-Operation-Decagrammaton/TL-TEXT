[translation]
1015103-1 = "Genius and Verification"
1015103-3 = "(Visited the Class 183 Special Classroom to help Anna)"
1015103-5 = "Class 183 Special Classroom"
1015103-7 = "Sensei, you really have not told anyone, right?"
1015103-8 = "This is a tremendous invention, so if the secret leaks out, it will be a disaster!"
1015103-9 = "[s1] \"Don't worry, I haven't told anyone!\"\n[s2] \"Is it an invention patent-worthy?\""
1015103-12 = "Patents are not relevant here. Inventions from Class 183 belong to the academy..."
1015103-13 = "Even if we tried to get one, the paperwork alone would be a nightmare... Ahaha..."
1015103-14 = "However, there is no doubt that this is a magnificent invention! It will be useful not only in Red Winter, but across all of Kivotos!"
1015103-15 = "Now... Ta-da! Here it is!"
1015103-19 = "[ns3] (...There is something like mud inside the container)\n[ns4] \"W-Whoa! Amazing!\""
1015103-22 = "You think this is amazing...? This is still just raw material, you know?"
1015103-23 = "To be able to tell at a glance... As expected of Sensei, you have such a discerning eye!"
1015103-24 = "This is a new material I developed called Anna-Crete!"
1015103-25 = "It is extremely sturdy, can be molded into any shape... and best of all, it is cheap!"
1015103-26 = "In short, you could call it a budget-friendly concrete."
1015103-27 = "[s] \"Amazing! Tell me more!\""
1015103-28 = "Ahem! Then I shall explain in response to your request!"
1015103-29 = "This is made by finely crushing wood chips and pulp from waste paper, mixing it with water, and freezing it, which makes it extremely hard."
1015103-30 = "Because its thermal conductivity is low, it does not melt easily... and since the melting speed is slower than evaporation, it hardly ever makes a watery mess."
1015103-31 = "If you pour water over it and freeze it again, it regains its strength, so maintenance is a breeze, and--"
1015103-32 = "The pulp inside holds everything firmly together, so its toughness is on a completely different level compared to normal ice! It can even withstand artillery shells, so it can be used for skyscrapers!"
1015103-33 = "It only uses unwanted wood chips, waste paper, and water, so it costs next to nothing! In Red Winter, where it is always cold, you could say it is a semi-permanent material."
1015103-34 = "While I was pondering various things, I suddenly thought of it and ran an experiment, and... surprisingly, it went well!"
1015103-35 = "[s] \"Pondering?\""
1015103-36 = "Uhm... It is about Red Winter's Public Merit Health Hospital... We lack budget and progress has been slow..."
1015103-37 = "The secretariat tried their best to manage the budget, but managing concrete curing in the extreme cold is difficult, and the necessary expansion isn't moving forward... So I was thinking if there was anything I could do to help as a scientist."
1015103-38 = "If we had cheap and sturdy materials... costs and construction time would drop, and a new ward could be built! Then everyone would be happy, I thought! Ehehe."
1015103-39 = "What do you think? Am I a genius?"
1015103-40 = "[s] \"That is amazing! With this, you might even get a pardon!\""
1015103-41 = "Eh?"
1015103-42 = "Actually, that might be true! When I imagined everyone's happy faces, I completely forgot...!"
1015103-43 = "Since it will make everyone happy, I am sure they will recognize my work!"
1015103-44 = "But if that is the case, all the more reason to test it before reporting."
1015103-45 = "It is an incredible invention, so I wanted to test it together with Sensei."
1015103-46 = "Shall we begin, then?"
1015103-47 = "I will go prepare the Puppy!"
1015103-54 = "Sensei! Are you ready?"
1015103-55 = "Has the Anna-Crete spread across the surface of the Puppy completely frozen?"
1015103-56 = "[s] \"Yep, it's frozen solid!\""
1015103-57 = "Then, preparation is complete!"
1015103-58 = "Please press the button nearby to fire the cannon. Be careful, as it will make a loud noise."
1015103-59 = "[s] \"Is this... really safe?\""
1015103-60 = "If you took a Flak 41 shell in the flesh, it might send you to the hospital, but... we are inside a tank, and around 76 millimeters is no problem at all!"
1015103-61 = "Now, let us begin!"
1015103-62 = "Take aim and-- Fire!"
1015103-64 = "[ns5] \"G-Gyaaaah!!\"\n[ns6] (Presses the button cautiously)"
1015103-70 = "[ns] \"A-Anna...!? Are you safe?\""
1015103-73 = "Yes! I am fine!"
1015103-74 = "Did the sound cut out? I was so happy I shouted out loud, so maybe the mic cut off."
1015103-75 = "The Puppy has no abnormalities! Internal damage is zero. The Anna-Crete has not peeled off either."
1015103-76 = "It is over five times stronger than anticipated! A huge success!!"
1015103-77 = "At this thickness, it would take two years to melt at room temperature. In Red Winter's outside temperature, it will never melt!"
1015103-78 = "I know! Let us high-five to celebrate our success! I have always wanted to try it!"
1015103-79 = "I am coming out right now! Heave-ho!"
1015103-85 = "Huh? Was the door always this heavy?"
1015103-90 = "The lock is disengaged, and it is not blocked from the outside..."
1015103-94 = "Ah."
1015103-95 = "[s] \"Did you block it with Anna-Crete!?\""
1015103-96 = "That means... since it takes two years to melt even at room temperature..."
1015103-97 = "Does that mean... I am trapped in here for two whole years...?"
1015103-98 = "Wh-What should I do? W-Waah..."
1015103-99 = "Help me, Sensei!!"
1015103-100 = "[s] \"Calm down! I'll definitely get you out!\""
1015103-101 = "Waah!!"
1015103-103 = "(No matter how many cannon shells hit it, the Anna-Crete did not budge at all)"
1015103-104 = "(Fortunately, Anna regained her composure and managed to escape by cutting a hole in the floor with a mini welding torch)"
1015103-108 = "(For a while, I consoled Anna, who was left in a daze)"
