[translation]
1015103-1 = "Genius and Verification"
1015103-3 = "(I visited Special Class No. 183 to help Anna.)"
1015103-5 = "Special Class No. 183"
1015103-7 = "Sensei, you really haven't told anyone, right?"
1015103-8 = "This is an incredible invention, #nso if the secret gets out, it'll be a disaster!"
1015103-9 = "[s1] \"It's fine, I haven't told anyone!\"\n[s2] \"Is it an invention worthy of getting a patent?\""
1015103-12 = "Patents don't matter. Inventions made in Class 183 belong to the academy, so..."
1015103-13 = "Even if I were to get one, the paperwork alone would be a nightmare... ahaha..."
1015103-14 = "However, there's no doubt that this is a magnificent invention! #nIt should be useful not only in Red Winter, but all across Kivotos!"
1015103-15 = "Now... Ta-da! Here it is!"
1015103-19 = "[ns3] \"(...There's something like mud inside the container.)\"\n[ns4] \"W-Wow! That's amazing!\""
1015103-22 = "This is amazing... to you? It's still just the raw materials, you know?"
1015103-23 = "You get it in a single glance... As expected, you have an excellent eye for these#nthings, Sensei!"
1015103-24 = "This is a new material I developed, \"Annakrete\"!"
1015103-25 = "It is extremely sturdy, can be molded into any shape... and above all, it's cheap!"
1015103-26 = "You could say it's like a budget concrete."
1015103-27 = "[s] \"Amazing! Tell me more!\""
1015103-28 = "Ahem! Then, to answer your request, I shall explain!"
1015103-29 = "This is made by finely crushing pulp obtained from wood chips and waste paper#nand mixing it with water, which becomes incredibly hard when frozen."
1015103-30 = "It has low thermal conductivity so it doesn't melt easily... and because #nthe melting rate is slower than evaporation, it almost never creates puddles."
1015103-31 = "If you pour water on it and freeze it again, its strength returns, making#nmaintenance and repairs easy—"
1015103-32 = "The pulp inside keeps it firmly in place, #nso it's way more durable than regular ice! It can even withstand artillery shells,#nso it's perfect for skyscrapers!"
1015103-33 = "Since it only uses unnecessary wood chips, waste paper, and water, it's practically#nfree! In Red Winter, where it's always cold, you could say it's a semi-permanent#nmaterial."
1015103-34 = "While I was thinking of something, I suddenly thought of it and tested it out... #nand to my surprise, it worked!"
1015103-35 = "[s] \"Thinking about something?\""
1015103-36 = "Well... it's about Red Winter's Public Health Hospital... They lack the budget, so#nprogress has been poor..."
1015103-37 = "The administrative office did their best to secure the budget, but managing concrete#ncuring in the extreme cold is difficult, so the necessary expansion isn't proceeding... #nI was wondering if there was anything I could do to help as a scientist."
1015103-38 = "If we had a cheap and sturdy material... both the cost and construction period#nwould decrease, and a new ward could be built! #nIf that happens, I thought everyone would be happy! Ehehe."
1015103-39 = "How is it? I'm a genius, aren't I?"
1015103-40 = "[s] \"This is awesome! You might even get a pardon for this!\""
1015103-41 = "Eh?"
1015103-42 = "Now that you mention it, that might be true! #nI was so busy imagining everyone's happy faces that I completely forgot...!"
1015103-43 = "Since it will make everyone happy, I'm sure they'll approve of it!"
1015103-44 = "But if that's the case, we absolutely have to test it before reporting it."
1015103-45 = "Because it's an incredible invention, I wanted to test it together with you, Sensei."
1015103-46 = "Then, shall we begin?"
1015103-47 = "I'll get Puppy ready!"
1015103-54 = "Sensei! Are you ready?!"
1015103-55 = "Has the \"Annakrete\" we scattered on the surface of Puppy frozen completely?"
1015103-56 = "[s] \"Yeah, it's frozen solid!\""
1015103-57 = "Then, preparations are complete!"
1015103-58 = "Press the button next to you and fire the artillery. #nIt will make a loud noise, so please be careful."
1015103-59 = "[s] \"Is this... really safe?\""
1015103-60 = "If you took a Flak 41 shell with your body you might end up in the hospital, but... #nyou're inside a tank, so a 76mm shell won't be a problem!"
1015103-61 = "Now, let's go!"
1015103-62 = "Take aim— Fire!"
1015103-64 = "[ns5] \"U-Uwaaaaaah!!\"\n[ns6] \"(Carefully press the button)\""
1015103-70 = "[ns] \"A-Anna...?! Are you okay?\""
1015103-73 = "Yes! I'm fine!"
1015103-74 = "Did the sound cut out? #nI was so happy that I shouted loudly, so the microphone might have cut off."
1015103-75 = "No abnormalities with the Puppy! Zero internal damage. #nThe \"Annakrete\" hasn't peeled off either."
1015103-76 = "It's more than five times stronger than I anticipated! A huge success!!"
1015103-77 = "With this thickness, it would take two years to melt at room temperature. #nAt Red Winter's outside temperatures, it will never melt!"
1015103-78 = "Oh right! Let's high-five to celebrate our success! #nI've always wanted to try doing that!"
1015103-79 = "I'll be right out! Here we go!"
1015103-85 = "Huh? Was the door always this heavy?"
1015103-90 = "The lock is disengaged, and it's not being blocked from the outside either..."
1015103-94 = "Ah."
1015103-95 = "[s] \"Did you seal it shut with \"Annakrete\"!?\""
1015103-96 = "That means... since it takes two years to melt even at room temperature..."
1015103-97 = "Are you saying... I'm going to be trapped in here for two years...?"
1015103-98 = "W-What do I do? W-WAAHHHH..."
1015103-99 = "Save me, Senseeeeei!!"
1015103-100 = "[s] \"Calm down! I'll definitely save you!\""
1015103-101 = "WAAAHHHH!!"
1015103-103 = "(The Annakrete didn't budge no matter how many times it was hit by the artillery.)"
1015103-104 = "(Fortunately, after calming down, Anna was able to escape by #ncutting a hole in the floor with a small welder.)"
1015103-108 = "(I spent some time comforting the shaken Anna.)"