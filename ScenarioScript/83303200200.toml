[translation]
83303200200-5 = ""
83303200200-6 = "Смотрите, это мисс Хина."
83303200200-7 = "Я так и думала, что ты будешь здесь."
83303200200-8 = "...Трудно тебя винить, учитывая обстоятельства."
83303200200-9 = ""
83303200200-11 = ""
83303200200-13 = ""
83303200200-14 = "Мне уже доложили о ситуации. Значит, это одна из статуй Макото?"
83303200200-15 = "Ахахаха! Ага! Даже я офигела, сколько она их понаставила, ахаха!!!"
83303200200-16 = "Здесь уже несколько статуй..."
83303200200-17 = "И не только у здания Префектурной команды."
83303200200-18 = "Я слышала, председатель Общества Пандемониума наняла хулиганов, чтобы расставить их по всей Геенне."
83303200200-19 = "В соцсетях это уже разлетелось просто бешено, ахаха!"
83303200200-20 = "Мы вышли посмотреть на них вживую!"
83303200200-22 = "*вздыхает*"
83303200200-23 = "Хорошо. Теперь я понимаю ситуацию."
83303200200-24 = "...Я уберу весь этот бардак, включая нанятых помощников."
83303200200-25 = "Ахаха! Удачи, мисс Хина!"
