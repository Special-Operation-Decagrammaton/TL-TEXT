[translation]
1300402-1 = "Случайная встреча"
1300402-2 = "Граница Абидоса, пригород"
1300402-3 = "(Я уже почти собирался возвращаться в Шале после завершения дел, когда...)"
1300402-4 = ""
1300402-5 = "*шорох*"
1300402-6 = ""
1300402-7 = "Хоп!"
1300402-8 = "*удивление*"
1300402-9 = "А-ха-ха! Та-дам! Попались? ☆"
1300402-10 = "[s] «Привет, Нономи.»"
1300402-11 = "Привет, Сенсей! Я заметила вас с улицы и так обрадовалась, что сразу прибежала."
1300402-12 = "Хм? Что я здесь делаю? О, мне нужно было кое-что купить."
1300402-13 = "Помните? Многие магазины в Абидосе сейчас закрыты..."
1300402-14 = "Поэтому за необходимыми вещами приходится ездить немного дальше."
1300402-15 = "Но я не против. Оно того стоит, если благодаря этому случаются такие встречи. ☆"
1300402-16 = "Ага! Вот это приятный сюрприз."
1300402-17 = "Хотите вместе сходить за парфе? Я знаю неподалёку знаменитое кафе. ☆"
1300402-18 = "[s] «У меня вроде были другие планы...»"
1300402-19 = "Попались! ☆"
1300402-20 = "Вы ведь уже возвращались, Сенсей?"
1300402-21 = "Откуда я знаю? Это секрет... ♥"
1300402-22 = "Тогда пойдём!"
1300402-24 = "Мы с Нономи отправились в ближайшее кафе с парфе."
1300402-25 = "Каждый из нас объелся огромным парфе."
1300402-26 = "Нономи уже собиралась платить, но я сказал, что угощаю."
