[translation]
1013003-1 = "Первый шаг"
1013003-3 = ""
1013003-4 = "Здравствуйте, Сэн... сэй?"
1013003-5 = ""
1013003-7 = ""
1013003-8 = ""
1013003-9 = "Ч-Что всё это значит?"
1013003-10 = "[ns] «Это в честь того, что ты стала представительницей учеников Шале!»"
1013003-11 = "Это уже слишком. И, если честно, от такого мне очень не по себе... Тебе стоит немного умерить пыл."
1013003-12 = "То, что ты пытаешься меня побаловать, бережёшь мои чувства... Кажется, от этого мне только хуже."
1013003-13 = "Хотя... не могу сказать, что хочу, чтобы ты относилась ко мне холодно."
1013003-14 = "[s] «Сложно-то как...»"
1013003-15 = "Ха-ха. Нет ничего непредсказуемее старшеклассницы. Разве не слышала?"
1013003-16 = "Тогда, хоть я впервые исполняю обязанности представительницы учеников, прошу тебя взять инициативу на себя."
1013003-17 = ""
1013003-30 = ""
1013003-31 = "*вздыхает*"
1013003-32 = "[s1] «Может, немного отдохнём?»\n[s2] «Вот. Это кофе.»"
1013003-35 = "О, спасибо, Сенсей."
1013003-36 = "Кофе... Фу-фу."
1013003-37 = "Ты знала, Сенсей? В Ариусе мы тоже пили что-то вроде кофе или чая. На вкус было совсем иначе, но для нас это был ритуал."
1013003-38 = "[s] «Расскажи подробнее.»"
1013003-39 = "Хорошо. Мы брали красный листовой салат, одуванчики, высушенные корни репы, листья чертополоха и овощные отходы, оставшиеся от столовой."
1013003-40 = "Если всё это как следует обжарить и перемолоть, получится что-то слегка кофейного цвета..."
1013003-41 = "У нас было так называемое «время воды». Лучшему студенту выдавали кружку тёплой воды, из которой можно было сделать... напиток."
1013003-42 = "Смешивать всё приходилось тайком. Нельзя было допустить, чтобы тебя обвинили в расточительности."
1013003-43 = "[s3] «Хочешь чего-нибудь ещё?»\n[s4] «Еду? Напитки? Я угощаю!»"
1013003-46 = "Что я только что сказала? Ты слишком суетишься вокруг меня! Я не могу!"
1013003-48 = "Несмотря на это, Субару понемногу попробовала все напитки и закуски, которые я поставила перед ней."
1013003-49 = "Она сохраняла каменное лицо, но, ПОХОЖЕ, ей всё нравилось."
1013003-50 = ""
1013003-51 = "Эм, Сенсей?"
1013003-52 = "[s] «Хм?»"
1013003-53 = "Ты сказала... что я могу поговорить с тобой о чём угодно, верно?"
1013003-54 = "[s] «Конечно, о чём угодно!»"
1013003-55 = "Умерь пыл!"
1013003-56 = "..."
1013003-57 = "Снаружи всё действительно... по-другому."
1013003-58 = "То есть, это очевидно, правда?"
1013003-59 = "Но, может быть, именно поэтому..."
1013003-60 = "Мне кажется, большую часть времени... я даже не знаю, как это сказать."
1013003-61 = "Мне тревожно? Не по себе? Я киплю от злости? Может, всё это сразу."
1013003-62 = "Хм, причина... Если уж спрашиваешь..."
1013003-63 = "..."
1013003-64 = "Наверное, дело во всём, что я не могу простить. Я не могу оставить это позади."
1013003-65 = "Будь то Тринити или Ариус..."
1013003-66 = "...или я сама..."
1013003-67 = ""
1013003-69 = ""
1013003-70 = "Всё сложно. Да, очень сложно..."
1013003-71 = "Часть меня хочет хоть раз увидеть, как Тринити просто... страдает. Переживает хоть одну настоящую трудность, чтобы всё казалось хоть немного справедливым."
1013003-72 = "...Но с другой стороны, пока Ариус по-настоящему не превзойдёт Тринити..."
1013003-73 = "Я хочу, чтобы Тринити оставалась там — крепкой и непоколебимой, будто ничего не случилось."
1013003-74 = "Ещё хуже, когда я думаю о самих студентах Тринити. Об их именах, лицах, обещаниях..."
1013003-75 = "Я хочу, чтобы все мы, студенты Ариуса, стали лучше них. Так, чтобы это было невозможно отрицать."
1013003-76 = "...Но я больше не хочу... прибегать к нечестным методам. Я стараюсь действовать законно, даже нравственно."
1013003-77 = "А? Это называется «дружеским соперничеством»?"
1013003-78 = "..."
1013003-79 = "Я... не уверена, что мне нравится это слышать."
1013003-80 = "Я знаю, что ты права... или почти права! И от этого мне только хуже."
1013003-81 = "*вздыхает*"
1013003-82 = "[s] «Старшеклассницы и правда непредсказуемы...»"
1013003-83 = "Да, такие уж мы. Ну что, теперь жалеешь? Что решила сблизиться со мной? Что позволила мне вывалить на тебя все эти спутанные мысли?"
1013003-84 = "А? Ты ценишь мою честность? И не против, что я раздражена? Потому что тебе надоело смотреть, как я улыбаюсь другим студентам через силу?"
1013003-85 = "...!"
1013003-86 = "Ты и ПРАВДА худшая, Сенсей..."
1013003-87 = "[s] «Да, я худший человек...»"
1013003-88 = "Ты такой плохой человек..."
1013003-89 = "[ns] «Ты права. Я плохой наставник...»"
1013003-91 = "[ns] «Но человеческое сердце никогда не бывает простым, понимаешь.»"
1013003-92 = "Разве «реальность» не находится в каждом прожитом нами мгновении?"
1013003-93 = "Ты хочешь сказать, что моя нерешительность — не недостаток..."
1013003-94 = "...а просто часть того, что делает меня человеком?"
1013003-95 = "Не можешь просто сказать мне правильный ответ?"
1013003-96 = "[s5] «А что правильным считаешь ты?»\n[s6] «Прислушайся к своему сердцу.»"
1013003-99 = "То есть ты предлагаешь не пытаться разобраться со всем сразу? Разбирать свои чувства понемногу, будто я сортирую ящик с хламом?"
1013003-100 = "...Ты говоришь, что мне самой придётся отвечать за следующий выбор."
1013003-101 = "А если давление станет слишком сильным, мне стоит связаться с тобой. В любое время? Правда?"
1013003-102 = "А-ха-ха, какая глупость... Ты ничего не решила, Сенсей."
1013003-103 = "[s] «Ты права. Но такова жизнь.»"
1013003-104 = "...Правда?"
1013003-105 = "[s] «Да.»"
1013003-106 = "Если честно, жизнь — такой бардак, куда больший, чем я когда-либо представляла..."
1013003-107 = "[s7] «Ага...»\n[s8] «Мы все просто пытаемся пережить один день за другим.»"
1013003-110 = "..."
1013003-111 = "Я думала, что в жизни будет куда больше всего."
1013003-112 = "[s9] «Ты права, ничего особенного.»\n[s10] «И не позволяй никому говорить, что ты живёшь неправильно.»"
1013003-115 = "Что ты такое говоришь? Ты же педагог. Как можно быть настолько безответственной и легкомысленной?"
1013003-116 = "Ты такая странная, Сенсей..."
1013003-117 = ""
1013003-119 = ""
1013003-120 = "Да."
1013003-121 = "Правда."
1013003-122 = "Странная. Чудачка. Фрик."
1013003-123 = "...Хи-хи."
1013003-124 = "[s] «Субару.»"
1013003-125 = "Что?"
1013003-126 = "[s] «Ты так много трудилась.»"
1013003-127 = "Что?"
1013003-128 = "...Ч-Что?"
1013003-130 = "П-Погоди! Не смотри на меня."
1013003-131 = "Что? Я могу взять салфетку... и не торопиться?"
1013003-132 = "Ненавижу тебя, Сенсей!"
