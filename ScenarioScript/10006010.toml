[translation]
10006010-1 = "— Репетиционный эпизод —;Концерт Хацунэ Мику"
10006010-5 = "Всем привет! С вами ваша любимая виртуальная певица Мику!"
10006010-6 = "В Кивотос я приехала впервые, правда?"
10006010-7 = "Я так счастлива выступить для всех вас!"
10006010-8 = "Возможно, вы уже слышали, что мой концерт пройдёт в Кивотосе."
10006010-9 = "Именно поэтому специально для этого шоу мне сделали особое тело из реального мира."
10006010-10 = "Хи-хи. Ну как вам? Милое?"
10006010-11 = "Есть только одна малюсенькая проблема. Похоже, я ещё не совсем привыкла к новому телу, потому что на репетиции новой песни всё время сбиваюсь с ритма."
10006010-12 = "Инженеры говорят, им нужно гораздо больше данных для калибровки, чтобы я смогла привыкнуть к новому телу."
10006010-13 = "Поэтому я проведу особую репетицию прямо перед вами!"
10006010-14 = "Все, пожалуйста, поддержите меня!"
10006010-15 = "О, и надеюсь, вы присоединитесь ко мне и придёте на концерт!"
