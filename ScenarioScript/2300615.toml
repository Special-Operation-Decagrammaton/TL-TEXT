[translation]
2300615-1 = "Антиквариат Момоёдо!"
2300615-2 = "Я отправился в Момоёдо примерно в обед."
2300615-3 = ""
2300615-7 = "[ns] «Здесь... битком набито?!»"
2300615-8 = ""
2300615-9 = "Сэнс— то есть, Господин! Вы пришли!"
2300615-10 = "Простите, вы попали прямо в час пик! А сегодня особенно... пиково!"
2300615-11 = "[s] «Какое успешное мероприятие!»"
2300615-12 = "П-пока что позвольте проводить вас к столику! Сюда, пожалуйста!"
2300615-13 = ""
2300615-15 = ""
2300615-17 = "Каким-то образом Шизуко нашла для меня свободный столик."
2300615-18 = "Что будете заказывать сегодня?"
2300615-19 = "Наш самый популярный напиток — яблочный чай из отборной кожуры, и—"
2300615-20 = "[s] «Вот его!»"
2300615-21 = "Я даже не закончила объяснять!"
2300615-22 = "В-вы даже не хотите об этом думать?!"
2300615-23 = "[s1] «Ну, ты сейчас так занята.»\n[s2] «Пока это готовишь ты, я знаю, что будет вкусно.»"
2300615-26 = "А-а! Такая неприкрытая лесть..."
2300615-27 = "Говорите что хотите, но я всё равно собиралась обслужить вас по высшему разряду!"
2300615-28 = "[s] «О-особое обслуживание...!»"
2300615-29 = "Да! Так что, пожалуйста, подождите здесь!"
2300615-30 = ""
2300615-32 = ""
2300615-34 = "Так, теперь нужно идеально всё подать."
2300615-35 = "Б-босс!"
2300615-36 = "Я же говорила, я президент! Не начальница! Что случилось?"
2300615-37 = "П-президент! Посетителей так много, что у нас закончился чай!"
2300615-38 = "Что?!"
2300615-39 = "Обычно люди заказывают не только чай! Но новый яблочный чай настолько популярен..."
2300615-40 = "Ч-что нам делать? Чтобы достать дополнительные чайные наборы и заварить ещё, понадобится двадцать минут!"
2300615-41 = ""
2300615-43 = "(О-о нет... Надо же было такому случиться именно сегодня...)"
2300615-44 = "(Я не могу заставить Сенсея ждать целых двадцать минут!)"
2300615-45 = "(В Момоёдо мы всегда обеспечиваем самое лучшее обслуживание и выкладываемся по полной!)"
2300615-46 = "(Что же делать...?)"
2300615-47 = "(Придумала!)"
2300615-48 = ""
2300615-50 = "Я займусь этим заказом, а ты, пожалуйста, принеси дополнительный заказ к столику 5. Две порции ханами-данго и одну тягучую яблочную монаку!"
2300615-51 = "Есть! Уже!"
2300615-53 = "Некоторое время спустя..."
2300615-54 = "А вот и ваш премиальный яблочный чай и маленькие ёканы!"
2300615-55 = "[s] «Выглядит восхитительно! И как быстро!»"
2300615-56 = "Ага! С гордостью приготовлено в Момоёдо! Хи-хи."
2300615-57 = ""
2300615-59 = ""
2300615-60 = "[ns] «Но, эм...»"
2300615-62 = "Чайный набор, в котором мне подали заказ, немного отличался от обычных наборов, поэтому я присмотрелся повнимательнее."
2300615-63 = "[ns3] «Это не обычный чайный набор Момоёдо.»\n[ns4] «Он выглядит немного потёртым, но за ним явно хорошо ухаживают.»"
2300615-66 = "Чай, как и бесплатный ёкан, был восхитителен."
2300615-68 = "Фух, посетителей стало меньше."
2300615-69 = "Так, все! Закончите уборку — и можете отдохнуть!"
2300615-70 = "Да, президент!"
2300615-71 = ""
2300615-73 = ""
2300615-74 = "Госпо— Сенсей! Вам всё нравится?"
2300615-75 = "Фух! Сегодня было ещё оживлённее, чем обычно!"
2300615-76 = "Вы видели, какая я была крутая?"
2300615-77 = "[s] «Мне понравилось твоё выступление, когда ты поскользнулась и сделала двойное сальто!»"
2300615-78 = "Н-нет! Это была настоящая случайность! Если бы не невероятные навыки Кававы Шизуко, идола и лица Момоёдо, всё могло закончиться опасно!"
2300615-79 = "Кхм! В любом случае! Теперь, когда час пик позади, я пришла отдохнуть вместе с вами, Сенсей!"
2300615-80 = "[s5] «Ты отлично справилась, Шизуко!»\n[s6] «Но... это какой-то особый чайный набор?»"
2300615-83 = ""
2300615-85 = ""
2300615-86 = "А! Вы заметили раньше, чем я успела рассказать."
2300615-87 = "Раньше возникла небольшая проблема..."
2300615-89 = "Обычно я никогда не допустила бы такого!"
2300615-90 = "Но это моя вина, что я не подготовилась ко всем возможным ситуациям!"
2300615-91 = "И поэтому мне пришлось подать вам чай в моём личном наборе."
2300615-92 = "[s] «Почему...?»"
2300615-93 = "П-потому что... в тот момент это был единственный свободный набор, Сенсей."
2300615-94 = ""
2300615-96 = ""
2300615-98 = "З-знаю! Он совсем не подходит к эстетике этого мероприятия!"
2300615-99 = "Яблочная ярмарка должна была воплощать свежесть, поэтому мы подавали всё в этих супер-милых чайных наборах и посуде! А вам я принесла что-то совершенно не в тему..."
2300615-100 = "*вздох* Момоёдо всегда должен быть на острие трендов, но..."
2300615-101 = "Даже если я сделала это, чтобы вы получили заказ как можно быстрее..."
2300615-102 = "...это неприемлемо. Меня следует сместить с должности хозяйки Момоёдо."
2300615-103 = "[s7] «Нет, именно такое решение и подобает хозяйке Момоёдо.»\n[s8] «Благодаря тебе мне не пришлось ждать, и я получил вкусный чай и десерты.»"
2300615-106 = "...Спасибо за добрые слова."
2300615-107 = "[s] «Но выглядит он и правда довольно поношенным.»"
2300615-108 = "А, да. Это потому что..."
2300615-109 = "...это первый чайный набор, который я когда-либо купила."
2300615-110 = "Я начала проводить чайные церемонии ещё совсем маленькой. И очень много тренировалась."
2300615-111 = "Я столько раз ошибалась! Как вспомню, сколько чайных листьев тогда испортила... Угх..."
2300615-112 = "[s] «Это часть твоей истории.»"
2300615-113 = "Хи-хи. Истории. Наверное, можно сказать и так!"
2300615-114 = "Но со временем он вышел из моды. В оформлении Момоёдо мы всегда стараемся следовать последним тенденциям, знаете ли."
2300615-115 = "С-сейчас он выглядит... безвкусно..."
2300615-116 = "Не могу поверить, что так долго пользовалась чем-то подобным. Я—"
2300615-117 = "[s] «Нет!»"
2300615-118 = "...?"
2300615-119 = "[s9] «Я не эксперт по чаю.»\n[s10] «Но мне очень понравился его глубокий вкус.»"
2300615-122 = "А-А?"
2300615-123 = "[s11] «Этот чайный набор для тебя словно старый друг!»\n[s12] «Мне казалось, будто я отпиваю глоток твоих воспоминаний, Шизуко!»"
2300615-126 = "Агх?!"
2300615-127 = ""
2300615-129 = ""
2300615-131 = "[ns] «С-шизуко? Ты в порядке?!»"
2300615-132 = "Н-нет! Такая реакция была потому, что у меня чуть сердце не остановилось!"
2300615-133 = "Хи-хи. Если бы не мои тренировки идола Момоёдо, это могло бы оказаться смертельно!"
2300615-134 = "...Или, вообще-то, может, это было... немного..."
2300615-135 = "[s] «А-а?»"
2300615-136 = "В-В любом случае!"
2300615-137 = "Фраза хорошая, так что я её забираю!"
2300615-138 = "Как хозяйка Момоёдо, я с гордостью буду хвастаться, что умею заваривать для вас вкус воспоминаний!"
2300615-139 = "..."
2300615-140 = "С-Сенсей..."
2300615-141 = ""
2300615-143 = ""
2300615-145 = ""
2300615-146 = "Ну, раз вы сказали, что вам понравилось, если вы не против... когда-нибудь..."
2300615-147 = "Можно я снова приготовлю вам чай с этим набором?"
2300615-148 = "[s] «Буду ждать с нетерпением.»"
2300615-149 = "Хи-хи... Да!"
2300615-150 = "Отныне этот чайный набор будет хранить воспоминания нас обоих."
