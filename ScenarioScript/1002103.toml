[translation]
1002103-1 = "Атмосфера имеет значение"
1002103-2 = "*гул голосов*"
1002103-3 = "[s] «...?»"
1002103-4 = "Я поспешил туда, но никаких следов стрельбы или драки не было."
1002103-5 = ""
1002103-6 = "Это было прямо перед пляжной закусочной. Там стояла лишь Азуса и растерянно оглядывалась."
1002103-7 = "..."
1002103-8 = "[s] «Об Азусе?»"
1002103-9 = "О, Сенсей."
1002103-10 = "Не ожидала, что ты будешь здесь так быстро."
1002103-11 = "[s] «Разве ты не просила о поддержке?»"
1002103-12 = "Да, всё верно. Сейчас я нахожусь в очень затруднительном положении."
1002103-13 = "Эм..."
1002103-14 = "Азуса молча уставилась на вывеску пляжной закусочной."
1002103-15 = "На вывеске крупными буквами было написано: «Якисоба ограниченное время! Кто первый пришёл — того и порция!»"
1002103-16 = "Судя по количеству людей, уже стоящих в очереди, всё скоро должно было закончиться."
1002103-17 = "Правда в том..."
1002103-18 = "Эм..."
1002103-19 = "[s] «Ты не хочешь вставать в очередь из-за толпы?»"
1002103-20 = "...!"
1002103-21 = "[s1] «Твоё молчание я приму за подтверждение.»\n[s2] «Теперь понятно, зачем тебе понадобилась поддержка.»"
1002103-22 = "Я-Я не то чтобы именно поэтому, но..."
1002103-23 = "Я-Я не то чтобы именно поэтому, но..."
1002103-24 = "А? Ты купишь её для меня? Ты уверен?"
1002103-25 = "[s3] «Конечно. Я всё-таки твой Сенсей.»\n[s4] «Если честно, я и сам этого ждал!»"
1002103-26 = "Хм. Если ты так говоришь, Сенсей."
1002103-27 = "Хм. Если ты так говоришь, Сенсей."
1002103-28 = "Хорошо. Я принимаю. Обязательно отплачу тебе позже."
1002103-29 = "Спасибо, Сенсей."
1002103-31 = "К счастью, мы ещё успели сделать заказ, и я взял две порции якисобы для нас с Азусой."
1002103-32 = "Однако для блюда, которое рекламировали как доступное лишь ограниченное время, вкус был немного..."
1002103-33 = "..."
1002103-34 = "[s] «Ну и как тебе?»"
1002103-35 = "А?"
1002103-36 = "Очень вкусно — даже лучше, чем я ожидала."
1002103-37 = "А тебе? Тебе нравится?"
1002103-38 = "По твоему выражению лица вижу, что ты ожидал чего-то другого."
1002103-39 = "[s5] «Нет, мне тоже нравится.»\n[s6] «Главное, что тебе вкусно.»"
1002103-40 = "Вот как? Хорошо... Хм."
1002103-41 = "Вот как? Хорошо... Хм."
1002103-42 = "Хи-хи."
1002103-43 = "[s] «Об Азусе?»"
1002103-44 = "Ничего."
1002103-45 = "Эта соба была вкуснее всего, что я когда-либо ела."
1002103-46 = ""
1002103-47 = ""
1002103-48 = "Да, правда."
1002103-50 = "Я заказала какигори, потому что одна соба меня немного разочаровала."
1002103-51 = "Не знаю почему, но какигори оказалось очень вкусным."
