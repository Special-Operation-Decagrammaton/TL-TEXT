[translation]
1013305-1 = "Мысленный эксперимент"
1013305-2 = "Я постарался вовремя прийти в ангар на встречу с Рио."
1013305-4 = ""
1013305-5 = ""
1013305-6 = "А. Вы пришли."
1013305-7 = "Сейчас я обновляю все алгоритмы ИИ для своих AMAS."
1013305-8 = "Большая часть данных, собранных здесь, для меня новая..."
1013305-9 = "Поэтому нужно обновить соответствующие процессы, чтобы правильно всё проанализировать."
1013305-10 = ""
1013305-12 = ""
1013305-13 = ""
1013305-14 = "[ns] «О, оно движется.»"
1013305-15 = ""
1013305-16 = "Да. Но работы ещё много."
1013305-17 = "Нужно проверить все результаты и убедиться, что новые данные обрабатываются правильно."
1013305-18 = "Именно здесь проявляются ограничения базового ИИ. Он способен принимать решения только исходя из заданных команд."
1013305-19 = "[s] «Базового ИИ?»"
1013305-20 = "Так называют ИИ, который выполняет определённую работу на основе конкретных правил."
1013305-21 = "У каждого есть своя специализированная область, и в ней они превосходят людей."
1013305-22 = "Но... поскольку они функционируют на основе изученных данных, творчески мыслить так, как люди, они не способны."
1013305-23 = "Существуют другие модели, способные к самостоятельному и творческому рассуждению."
1013305-24 = "Мы называем такие модели «продвинутым ИИ»."
1013305-25 = "Арис... относится именно к этому случаю."
1013305-26 = "...Сейчас я уже так не думаю, но изначально считала, что у ИИ нет собственного эго."
1013305-27 = "Я думала, что они лишь воспроизводят разумное поведение, как в мысленном эксперименте с загадочной языковой комнатой."
1013305-28 = "[s1] «Воспроизводят разумность...»\n[s2] «В чём суть этого эксперимента?»"
1013305-31 = "Представьте комнату, заполненную всеми возможными вопросами и ответами, но написанными на языке, которого вы не знаете."
1013305-32 = "Для вас всё в этой комнате выглядело бы как рисунки. Но вы бы знали, что один конкретный рисунок — вопрос, а за ним следует другой рисунок — ответ."
1013305-33 = "Теперь я перепишу один из вопросов из этой комнаты на бумагу и передам вам."
1013305-34 = "Вы возьмёте мой рисунок — вопрос — и вернёте мне соответствующий рисунок — ответ, который найдёте в комнате."
1013305-35 = "В результате мы сможем вести письменный разговор, хотя языка вы не знаете."
1013305-36 = "Со стороны будет казаться, что вы прекрасно владеете этим языком."
1013305-37 = "Но на деле вы лишь выдавали подходящий рисунок в ответ на предоставленный."
1013305-38 = "То есть вы используете заранее заданные правила, чтобы ответить на вопрос. Смысла собственных действий вы не понимаете."
1013305-39 = "Если развить мысль дальше..."
1013305-40 = "Поскольку продвинутый ИИ следует определённой системе..."
1013305-41 = "как у него может быть эго?"
1013305-42 = "[s] «Сложный вопрос.»"
1013305-43 = "Вот почему... я считала, что его нет."
1013305-44 = "Я верила, что это просто машины, следующие правилам, заданным людьми."
1013305-45 = "И для меня это было рационально."
1013305-46 = ""
1013305-48 = ""
1013305-49 = "...Пока я не встретила Арис."
1013305-50 = "Я её не понимала. Не понимала, как она устроена, как появилась..."
1013305-51 = "Поэтому... думаю, мне было страшно."
1013305-52 = "Страшно перед областью неизвестного."
1013305-53 = "Но... я поняла, что должна принять это. Неизвестность."
1013305-54 = "Как каждый человек уникален, так и мне нужно просто принять, что Арис уникальна по-своему."
1013305-55 = "Логические рассуждения важны, но мне не обязательно всё объяснять рационально."
1013305-56 = "Потому что реальная жизнь — не мысленный эксперимент."
1013305-57 = "[s] «О, Рио! Ты так выросла!»"
1013305-58 = "...Совсем немного."
1013305-59 = "Так что... пожалуйста, продолжайте присматривать за мной."
1013305-60 = "Я собираюсь расти и дальше. А чтобы этого добиться..."
1013305-61 = "мне стоит продолжить планы по производству Домработника Avant Guard."
1013305-62 = "[s] «Я-я буду болеть за тебя...»"
1013305-64 = "Я помогал Рио и болтал с ней, пока она продолжала обновлять AMAS."
1013305-65 = ""
1013305-68 = "Некоторое время спустя..."
1013305-70 = ""
1013305-71 = ""
1013305-72 = ""
1013305-73 = "На сегодня мой список задач выполнен."
1013305-74 = "Всё прошло намного быстрее, чем я ожидала. Спасибо."
1013305-75 = "[s] «Я всего лишь составлял тебе компанию.»"
1013305-76 = "Одно это уже повысило эффективность работы."
1013305-77 = "В любом случае, раз теперь у нас осталось немного свободного времени..."
1013305-78 = "Не хотите вместе попробовать «мысленный эксперимент с загадочной языковой комнатой»?"
1013305-79 = "У самого эксперимента есть свои проблемы, но проводить его интересно."
1013305-80 = "Выделить целую комнату будет трудно, но можно обойтись карточками и листом ответов."
1013305-81 = "И так уж вышло, что у меня уже подготовлен целый набор — можно сразу использовать."
1013305-82 = "[s3] «(Она давно хотела это попробовать, да?)»\n[s4] «Ага. Давай попробуем вместе!»"
1013305-85 = ""
1013305-87 = ""
1013305-88 = "Я дам вам несколько карточек с изображениями, похожими на символы."
1013305-89 = "Вы должны будете, сверяясь с листом ответов, выдавать мне подходящую карточку — словно сопоставляете картинки."
1013305-90 = "Тогда начнём."
1013305-91 = ""
1013305-93 = ""
1013305-95 = "Передо мной лежала колода карточек с разными рисунками(?)... символами(?)..."
1013305-96 = "Затем Рио передала мне сложный лист ответов и карточку с записанным на ней вопросом."
1013305-97 = "Хотя всё было заполнено непонятными мне символами, я посмотрел на лист ответов и передал ей подходящую карточку."
1013305-98 = "Но мне кажется, я выбирал не те..."
1013305-99 = ""
1013305-100 = ""
1013305-101 = "...?! С-Сенсей?! Это значит, что вы..."
1013305-102 = "Н-Нет. В этом и заключался эксперимент."
1013305-103 = ""
1013305-105 = ""
1013305-106 = "А...?"
1013305-107 = "..."
1013305-108 = "...Жаль. Если бы это действительно были настоящие намерения Сенсея..."
1013305-109 = "Хм? А что там было написано?"
1013305-110 = "..."
1013305-111 = "Я-я бы не хотела произносить такое вслух."
1013305-112 = "[s] «П-Пожалуйста, не сердись на меня...»"
1013305-113 = "Я не... сержусь или что-то такое..."
1013305-114 = "...Простите. Эм, продолжим?"
1013305-116 = "Я продолжил «эксперимент», как предложила Рио."
1013305-117 = ""
1013305-122 = ""
1013305-123 = "Фуфу. Да. Согласна."
1013305-124 = ""
1013305-126 = ""
1013305-127 = "Хм-м... Значит, у вас есть и такая сторона, Сенсей. Неожиданная информация."
1013305-128 = ""
1013305-130 = ""
1013305-131 = ""
1013305-132 = "Н-Но всё же, разве это не слишком смело...?"
1013305-133 = ""
1013305-135 = ""
1013305-136 = "...Если Сенсей хочет... я не против, но..."
1013305-138 = "Эксперимент продолжился ещё примерно десятью вопросниками."
1013305-140 = ""
1013305-141 = ""
1013305-142 = ""
1013305-144 = "Рио... реагировала на каждый из них по-разному."
1013305-146 = "Хорошая работа, Сенсей."
1013305-147 = "Хм? О чём были карточки?"
1013305-148 = "..."
1013305-149 = "..."
1013305-150 = ""
1013305-153 = ""
1013305-154 = ""
1013305-155 = "......"
1013305-156 = "Не скажу."
1013305-157 = "[s5] «Почему?!»\n[s6] «Разве они не обо мне?!»"
1013305-160 = "Это так, но..."
1013305-161 = "..."
1013305-162 = "Желание — это то, что хранят в сердце. Пока ваши ответы не воплотятся в реальность..."
1013305-163 = "я бы хотела, по возможности, оставить это при себе."
