[translation]
1501-1 = "Проблемы и следопыты, часть 1"
1501-2 = "Хакерская комната Веритас"
1501-3 = "*вздыхает*..."
1501-4 = "Чего так тяжело вздыхаешь, Маки? Что-то случилось?"
1501-5 = "Я просто думала о сегодняшнем медосмотре."
1501-6 = "Слушай, Харэ. Ты ничего странного на медосмотре не заметила? Ну, например, весы могли врать?"
1501-7 = "Что ты имеешь в виду? Что-то произошло?"
1501-8 = "Почему-то весы показали, что я намного тяжелее, чем должна быть!"
1501-9 = "Это вообще нелогично! Я целую неделю не перекусывала и тренировалась, чтобы подготовиться к медосмотру!"
1501-10 = "Я столько старалась, а вес вообще не уменьшился..."
1501-12 = "Данные не лгут, Маки."
1501-13 = "Если расход не превышает поступление, данные это покажут. Как и весы."
1501-14 = "Я видела, как ты награждала себя за бессонную ночь газировкой и чипсами."
1501-15 = "Акх!"
1501-16 = "А у тебя как, Котама? По сравнению с прошлым годом?"
1501-17 = "М-Мне это совершенно не важно."
1501-18 = "Тело человека всё равно меняется со временем, и пытаться контролировать больше, чем тебе подвластно, — пустая затея. Меня куда больше интересует виртуальный мир."
1501-19 = "Т-Ты меня уже пугаешь. Для человека, которому всё равно, ты звучишь слишком заинтересованно."
1501-20 = "В любом случае я отказываюсь терпеть это... это вторжение в личную жизнь! Какое школе вообще дело до нашего веса?!"
1501-21 = "Согласна с Котамой. Нет смысла об этом переживать.#nВес человека — постоянно меняющаяся величина."
1501-22 = "Если тебя это так беспокоит, просто сократи ночные «награды»."
1501-23 = "Не могу! Как мне вообще жить, зная, что факт того, что я растолстела, навечно высечен в записях Миллениум?!"
1501-24 = "Все будут шептаться у меня за спиной, и это будет преследовать меня всю жизнь."
1501-25 = "Сильно сомневаюсь, что кому-то настолько не всё равно."
1501-26 = "Как бы то ни было, что сделано — то сделано. Запись уже внесена. К чему ты ведёшь?"
1501-27 = "Хе-хе. Ты вообще с кем разговариваешь?"
1501-28 = "Мы Веритас — праведный хакерский клуб, защищающий истину и освобождающий знания!"
1501-29 = "С нашими навыками изменить записи Миллениум — проще простого!"
1501-31 = "С «нашими»?"
1501-32 = "Ты имеешь в виду нас?"
1501-33 = "Да ладно вам. Не делайте вид, будто сами никогда об этом не думали."
1501-34 = "Только представьте, как Сенсей будет гордиться, увидев ваши блестящие результаты медосмотра."
1501-35 = "Полагаю, я подам не лучший пример, если откажу в такой искренней просьбе моей милой младшей."
1501-36 = "И чтобы было ясно: моё согласие вообще никак не связано с тем, что обо мне подумает Сенсей!"
1501-37 = "Моё мнение не изменилось. Мне всё равно."
1501-38 = "Эй, Харэ. Ты ведь только что рассказывала мне о своём новом хакерском дроне?"
1501-39 = "Разве тебе не хочется проверить его по-настоящему? Например... на системе безопасности Миллениум?"
1501-40 = "Это правда, что с момента завершения разработки я ещё не собирала полевые данные..."
1501-41 = "Ладно. Я с вами."
1501-42 = "Отлично! Значит, все согласны. Теперь назад дороги нет!"
1501-43 = ""
1501-45 = ""
1501-46 = "За защиту истины и свободу знаний!"
1501-47 = "Разве не надо говорить: «За подделку наших записей медосмотра»?"
1501-48 = "Я предпочту: «За практические испытания моего новейшего дрона»."
1501-49 = ""
1501-50 = "Веритас, выдвигаемся!"
