[translation]
1014306-1 = "Supervising Water Play"
1014306-4 = "Hello, Sensei. #nThank you for making time for the children today."
1014306-5 = "Everyone? Let's greet Sensei."
1014306-7 = "Nice to meet you, Sensei!"
1014306-9 = "[ns] \"Nice to meet you too!\""
1014306-11 = "（Together with Shun, I began supervising!）"
1014306-18 = "Now, everyone. Let's get into the pool one by one."
1014306-22 = "...Oh, what's the matter? It's your turn next, isn't it?"
1014306-23 = "[ns] \"Are you feeling unwell?\""
1014306-25 = "But... I'm scared of the water. I don't want to get into the pool."
1014306-26 = "Is that so... #nBut... if you can become friends with the water, the pool is a lot of fun, you know?"
1014306-27 = "I will help you, shall we give it a try?"
1014306-29 = "Yeah... Okay..."
1014306-31 = "Take this!"
1014306-32 = "Cold! Geez... Take that back!"
1014306-36 = "Come now... it's shallow here, you'll be fine."
1014306-37 = "I'll hold onto you properly, okay?"
1014306-39 = "Really? You promise...?"
1014306-43 = "（The child grabbed Shun's hand and began to walk slowly into the pool）"
1014306-44 = "（Even so, she is still seemed afraid of the water...）"
1014306-46 = "[ns] \"Hey, could you try holding this kickboard tightly with both hands?\""
1014306-47 = "Sensei...?"
1014306-51 = "Like this?"
1014306-52 = "[ns] \"You're doing it so well! Now, hold it...!\""
1014306-54 = "Se-Sensei?!?!"
1014306-56 = "（I pulled the kickboard, sliding it across the water's surface with momentum）"
1014306-61 = "Waaaaah!?"
1014306-62 = "A-Are you alright?!"
1014306-64 = "Th-This is awesome!"
1014306-65 = "Eh...?"
1014306-66 = "[ns] \"It's fun, right!? Next is like this!\""
1014306-72 = "It's super fun!!!"
1014306-74 = "..."
1014306-75 = "To turn something scary... not only just into something not scary, but also into#nsomething fun..."
1014306-76 = "As expected of you, Sensei. Hehe."
1014306-78 = "We came here because the children said they wanted to go on the water slide... #nbut it seems everyone is too short..."
1014306-82 = "Now, everyone. The water slide is still dangerous for you, so let's play#nat the other attractions."
1014306-85 = "Ehh! We want to do this!"
1014306-86 = "I'm not scared of the water anymore as well!"
1014306-87 = "[ns] \"It's a shame, but it's the rule, so it can't be helped...\""
1014306-88 = "Then, Sensei and Instructor Shun should try it!"
1014306-90 = "Eh!?"
1014306-92 = "Yeah! Sensei and Instructor Shun are allowed, right! We want to see what it's like!"
1014306-94 = "Se-Sensei...?"
1014306-95 = "[ns] \"Sounds good, let's do it!\""
1014306-96 = "Ehh...!?"
1014306-97 = "A-Am I going too...?"
1014306-102 = "Um, going together with Sensei is..."
1014306-104 = "Excuse me, please go one at a time!"
1014306-105 = "Right!"
1014306-107 = "[ns] \"Yeehaw!!!\""
1014306-109 = "（I enjoyed the water slide!）"
1014306-115 = "（It was something that even adults would be fully satisfied with!）"
1014306-117 = "Kyaaaaaaaah!?"
1014306-118 = "[ns] \"Shun!?\""
1014306-120 = "H-Help me!!!"
1014306-126 = "Haa, haa, haaa... Thank you very much, Sensei..."
1014306-127 = "..."
1014306-128 = "Yes. To tell you the truth, I'm not good with these kinds of things..."
1014306-129 = "I-It's true... I should have been honest about it..."
1014306-130 = "But since the children were watching, I couldn't help but..."
1014306-132 = "Wow! Instructor Shun and Sensei are hugging!"
1014306-134 = "[ns] \"?!?!\""
1014306-139 = "That is something like the suspension bridge effect."
1014306-144 = "It's a phenomenon where one mistakes the pounding heart of nervousness for another emotion..."
1014306-145 = "Though in Instructor Shun's case, it wouldn't be surprising if she was taking#nadvantage of it... I guess."
1014306-146 = "!!??"
1014306-148 = "Sometimes I can't understand what you're talking about..."
1014306-149 = "I-I-I'm sorry! Sensei!"
1014306-150 = "[s] \"It's totally fine!\""
1014306-152 = "Everyone, this is the wave pool."
1014306-153 = "Waves come just like a real ocean."
1014306-154 = "Right now it's just small waves, but a very large wave will come later."
1014306-155 = "There will be an announcement when that happens, so please listen carefully."
1014306-159 = "Everyone! We have an emergency!"
1014306-160 = "An extremely large wave is approaching! Please be careful and enjoy yourselves!"
1014306-161 = "The wave height at our water park reaches up to 2.4 meters... so #nplease exercise extreme caution!"
1014306-162 = "They say a huge wave is coming!"
1014306-166 = "Ahahahaha!"
1014306-168 = "Look! I surf the wave!"
1014306-169 = "Everyone, please be very careful!"
1014306-171 = "Sensei! Instructor Shun! I'm hungry!"
1014306-172 = "I want to eat takoyaki! And hot dogs too!"
1014306-173 = "[ns] \"I'll buy them for you one by one!\""
1014306-175 = "Everyone. Let's line up properly and wait like good children, okay?"
1014306-180 = "Instructor Shun, Sensei, thank you so much for your hard work today."
1014306-181 = "I don't even know how to thank you, Sensei, for making time like this..."
1014306-182 = "[s] \"Something like this is no trouble at all.\""
1014306-183 = "No, I'm truly grateful to you, Sensei..."
1014306-184 = "You spent the whole day looking after the children and barely got to#nenjoy yourself, didn't you..."
1014306-185 = "Well then, we will take over supervision from here."
1014306-186 = "Everyone~? It's time to head back to our [ruby=Shanhaijing]adobe~[/ruby]"
1014306-188 = "Ehh... But we want to play more..."
1014306-189 = "You mustn't be selfish. You are all good children who can keep track of time, right?"
1014306-191 = "Yessss."
1014306-194 = "..."
1014306-195 = "The day went by in the blink of an eye, didn't it?"
1014306-196 = "[s] \"Good work, Shun.\""
1014306-197 = "No, this is just a regular occurrence for me."
1014306-198 = "Um, Sensei."
1014306-199 = "Just a moment ago, I had a sudden thought..."
1014306-204 = "Just for a little bit... would you like to... sneak off and play with me?"
1014306-205 = "[ns] \"……！\""
1014306-207 = "[ns] \"Let's play!\""
1014306-208 = "Yes ♡"
1014306-210 = "（And so, I enjoyed myself to the fullest with Shun.）"
1014306-211 = "（I had so much fun that I almost missed the last train...）"