[translation]
21160-1 = "Эпизод 16;Всего один шаг вперёд!"
21160-2 = "Склад контрабанды студсовета Миллениума"
21160-4 = ""
21160-5 = "*задыхается* Мы добрались?!"
21160-6 = "Сенсей? Мидори? Алиса? Все в порядке?"
21160-7 = "Мой запас ОД не критический."
21160-8 = "Я-Я в порядке. Сенсей тоже."
21160-9 = "Слава богу... Так это склад контрабанды? Какой бардак."
21160-10 = "Везде битое стекло... Ящики перевёрнуты..."
21160-11 = "Наверное, здесь что-то взорвалось во время боя. Может, работа Карин?"
21160-12 = "В любом случае Юука наверняка думала, что Алиса заберёт Зеркало и побежит в Департамент Разработки Игр. Хе-хе. Она, наверное, даже не догадывается, что мы сами придём сюда."
21160-13 = "Нам нужно только Зеркало, а с остальным Веритас разберётся."
21160-14 = ""
21160-15 = "Вот оно! Ключевой предмет получен!"
21160-16 = "Хи-хи. Как захватывающе. Возвращаемся..."
21160-17 = "...?"
21160-18 = "Все, пожалуйста, замутьтесь."
21160-19 = "А?"
21160-21 = "Кто-то приближается. Судя по шагам, один человек."
21160-22 = "Если он один, можно проигнорировать его или быстро прорваться. Но что делать, если вернутся Юука и Клуб Горничных?"
21160-23 = "..."
21160-24 = "Пауза."
21160-25 = "Мне пришло сообщение от Харэ."
21160-26 = ""
21160-27 = "(БЕГИТЕ ИЛИ ПРЯЧЬТЕСЬ! ТОЛЬКО НЕ—*бзззт*)"
21160-28 = "А? И что это должно значить?"
21160-29 = "Странно, что Харе так паникует. Может, в клубной комнате Веритас крыса или что-то вроде того?"
21160-30 = "Идентификация приближающейся цели. Поиск в списке студентов Миллениума. Цель подтверждена."
21160-31 = "Рост: 145 см... Парные ПП... Бомбер с узором дракона поверх формы горничной..."
21160-32 = "Ч-Что...?"
21160-33 = "Н-Не может быть!"
21160-35 = "Прячьтесь!"
21160-38 = "Сенсей! Ваша голова спрятана, но задница торчит наружу!"
21160-39 = "Б-Быстрее! Надо двигаться!"
21160-42 = ""
21160-43 = "..."
21160-44 = "Хмм. Ну и свалка."
21160-45 = "(Н-Н-Неру?!)"
21160-46 = "(Н-Но почему?! Что она вообще здесь делает?!)"
21160-47 = "Хэ?"
21160-48 = "Это я там шёпот слышу?"
21160-49 = "*ахает*"
21160-50 = "(И-Икх!)"
21160-51 = "(...)"
21160-52 = "(Эта девушка... Она не такая, как остальные.)"
21160-53 = "(Я ощущаю новую эмоцию. Это... страх?)"
21160-54 = "(Вероятность победы в бою при текущих условиях однозначно... ноль процентов!)"
21160-55 = ""
21160-56 = "Так, посмотрим..."
21160-57 = "Может, под столом?"
21160-58 = ""
21160-59 = "*топ*"
21160-60 = ""
21160-61 = "*топ*"
21160-62 = "(Я-Я сейчас умру от напряжения!)"
21160-63 = "(Нам конец...)"
21160-64 = "(С-Сенсей! Что нам делать?!)"
21160-65 = "(Ей достаточно просто посмотреть вниз, и...!)"
21160-66 = ""
21160-67 = ""
21160-68 = "Э-Эм, простите!"
21160-69 = "Хэ?"
21160-70 = ""
21160-71 = "Н-Неру! Чрезвычайная ситуация!"
21160-72 = "*ахает*"
21160-73 = "(Ю-Юзу?!)"
21160-74 = "А ты...?"
21160-75 = "М-Меня зовут Юзу, я из Семинара."
21160-76 = "Роботы вышли из-под к-контроля! Там катастрофа!"
21160-77 = "Акане и Карин пытаются справиться, но..."
21160-78 = "А? Эти роботы у нас уже давно, не? Разве они не должны быть уже настроены?"
21160-79 = "Я-Я не знаю... Но им нужна была помощь, и я услышала, что т-ты здесь, и я..."
21160-80 = "*вздыхает* Похоже, мне делать всё самой."
21160-81 = "Я-Я останусь и приберусь. У меня нет ни патронов, ни опыта, так что м-мне страшно драться..."
21160-82 = "Меня это, в общем-то, не касается..."
21160-83 = "...но запомни: самое важное в драке — не оружие и не опыт."
21160-84 = "Простите?"
21160-85 = "Это храбрость, мелкая."
21160-86 = "А её у тебя, похоже, хоть отбавляй."
21160-87 = "Не каждый решится вот так подойти и попросить МЕНЯ об одолжении в такой-то ситуации."
21160-88 = "А-А-Аа?! Я, ээ... спасибо."
21160-89 = "Ещё увидимся, мелкая."
21160-90 = ""
21160-91 = "*глоть*"
21160-92 = ""
21160-93 = "*плюх*"
21160-95 = "Я-Я правда думала, что мне конец."
21160-96 = "Юзу-у-у!"
21160-97 = "Это было потрясающе, Юзу! Ты нас спасла!"
21160-98 = "Я рада, что я успела."
21160-99 = "В-В любом случае, в руках у Алисы, должно быть..."
21160-100 = ""
21160-102 = "Верно."
21160-103 = "Представляю предмет нашего задания, способный предотвратить гибель человечества..."
21160-104 = "...легендарное Зеркало."
21160-105 = "...!"
21160-106 = "Праздновать будем потом. Если Неру вернётся, нам всем каюк!"
21160-107 = "Впереди много роботов. Осторожно!"
21160-108 = "Т-Точно! Наша миссия ещё не закончена!"
21160-109 = "Чтобы достичь нашей настоящей цели — Г.БИБЛИИ, нам нужно доставить Зеркало в клубную комнату Веритас!"
21160-110 = "Пора отходить. Я прикрою тыл. Ваши приказы, Сенсей?"
21160-111 = ""
21160-112 = ""
21160-113 = "[ns1] «Направляемся в клубную комнату!»\n[ns2] «Всем приготовиться к бою!»"
21160-116 = "Да!"
21160-117 = "Мы вернёмся, несмотря ни на что!"
21160-118 = "Снаряжение установлено и готово!"
