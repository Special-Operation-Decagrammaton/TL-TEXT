[translation]
21160-1 = "Episódio 16;Só Mais um Passo!"
21160-2 = "Conselho Estudantil de Millennium - Depósito de Itens Confiscados"
21160-5 = "Arf, arf... Conseguimos despistar elas...?!"
21160-6 = "Sensei, Midori, Aris, vocês estão bem?!"
21160-7 = "Meu HP está mais do que suficiente."
21160-8 = "Eu e o Sensei estamos bem também."
21160-9 = "Que alívio... Aliás, aqui é o depósito de itens confiscados? Tá uma bagunça danada."
21160-10 = "Os vidros estão quebrados e as prateleiras estão todas caídas..."
21160-11 = "Será que foi ricochete da Karin-senpai...? Talvez o impacto da luta e das explosões tenha chegado até aqui."
21160-12 = "A Yuuka já deve estar achando que a Aris pegou o \"Espelho\" antes... Então, com certeza ela pensa que a gente fugiu pro clube. Nem nos sonhos dela ela vai imaginar que estamos aqui."
21160-13 = "Por enquanto, se conseguirmos levar o \"Espelho\" daqui, o pessoal da Veritas dá um jeito no resto...!"
21160-15 = "Ah, achei! O \"Espelho\"! Com isso aqui em mãos...!"
21160-16 = "Isso aí! Bora voltar logo—"
21160-17 = "...?"
21160-18 = "...Silêncio, por favor. Modo mudo ativado."
21160-19 = "Hm?"
21160-21 = "...Tem alguém vindo para cá. Pelos passos, provavelmente é só uma pessoa."
21160-22 = "Hmm... Se a gente ficar parada aqui e a Yuuka ou o clube das empregadas voltarem juntas, vamos nos dar mal. Se for só uma pessoa, que tal a gente abrir caminho na marra?"
21160-23 = "..."
21160-24 = "E-Espera um pouco."
21160-25 = "A Hare-senpai mandou mensagem."
21160-27 = "\"Fujam — não, se escondam! Rápido! De qualquer jeito, saiam daí $!#^&!@#\""
21160-28 = "Hã? O que será que aconteceu...?"
21160-29 = "O que deu na Hare-senpai? Ela é sempre tão calma. Será que apareceu um rato?"
21160-30 = "Alvo em aproximação detectado. Pesquisando no registro de alunas de Millennium... Alvo identificado."
21160-31 = "Altura: 146 cm, submetralhadoras duplas, jaqueta sukajan com estampa de dragão por cima do uniforme de empregada..."
21160-32 = "Hã...?"
21160-33 = "N-Não pode ser...?!"
21160-35 = "SE ESCONDAM!!"
21160-38 = "Sensei, seu bumbum está aparecendo!"
21160-39 = "R-Rápido! Depressa!"
21160-43 = "..."
21160-44 = "Hmph, tá tudo uma zona mesmo."
21160-45 = "(É-É-É a Neru-senpai!!)"
21160-46 = "(P-Por quê?! O que ela está fazendo aqui?!)"
21160-47 = "Hm...?"
21160-48 = "Tô com a impressão de que ouvi alguma voz..."
21160-49 = "(?!)"
21160-50 = "(Aiiiii...!)"
21160-51 = "(...)"
21160-52 = "(Essa pessoa... tem algo de diferente...)"
21160-53 = "(Medo... É a primeira vez que sinto essa emoção...)"
21160-54 = "(Probabilidade de sucesso caso uma batalha ocorra nessa situação... quase 0%...!)"
21160-56 = "Hmph..."
21160-57 = "Com certeza tem alguém aqui... Debaixo da mesa?"
21160-59 = "(Passo...)"
21160-61 = "(Passo...)"
21160-62 = "(O-O que a gente faz...?!)"
21160-63 = "(Agora sim acabou tudo...?!)"
21160-64 = "(S-Sensei! O que a gente faz?!)"
21160-65 = "(Ela tá bem na nossa frente... Se ela abaixar pra olhar...!)"
21160-68 = "C-Com licença!"
21160-69 = "Hã?"
21160-71 = "N-Neru-senpai! É uma emergência!"
21160-72 = "(?!)"
21160-73 = "(Y-Yuzu-chan?!)"
21160-74 = "E você é...?"
21160-75 = "E-Eu sou a Yuzuki, do conselho estudantil \"Seminar\"."
21160-76 = "Os robôs de combate saíram de controle e estão destruindo tudo por aí!"
21160-77 = "A Akane-senpai e a Karin-senpai estão tentando conter eles, mas..."
21160-78 = "Que saco, perderam o controle de novo? Faz um tempão que confiscaram aquelas latas-velhas, ainda não terminaram a manutenção?"
21160-79 = "P-Pela situação, achei que precisassem de reforços... e ouvi dizer que a senhora estava aqui, então..."
21160-80 = "Tsc, fazer o quê, né."
21160-81 = "E-Eu vou ficar aqui arrumando as coisas.#nÉ-É que eu tenho medo de lutar... e também não tenho muita experiência..."
21160-82 = "Tanto faz isso aí. Mas ô, garota..."
21160-83 = "Grava bem isso. O mais importante numa luta não é arma nem experiência."
21160-84 = "S-Sim...?"
21160-85 = "É coragem."
21160-86 = "E nesse ponto, não acho que você não tenha jeito pra coisa."
21160-87 = "Eu sei muito bem a fama que eu tenho. E também dá pra ver na cara que você é bem medrosa. Mesmo assim, chegar falando comigo logo de cara sem nem me conhecer exige bastante coragem."
21160-88 = "S-S-Sim! O-Obrigada?!"
21160-89 = "Falou, a gente se esbarra por aí."
21160-91 = "Ueeeh..."
21160-93 = "(Desaba no chão)"
21160-95 = "A-Achei que eu fosse morrer..."
21160-96 = "Yuzuuuuuuu!!"
21160-97 = "Yuzu-chan, você foi incrível! Salvou a nossa pele!"
21160-98 = "Q-Que bom que consegui ajudar..."
21160-99 = "M-Mas deixando isso de lado, o que a Aris-chan está segurando agora é..."
21160-102 = "Sim!"
21160-103 = "Esta é a nossa nova arma que salvará a humanidade e o mundo."
21160-104 = "É o \"Espelho\"!"
21160-105 = "F-Finalmente...!"
21160-106 = "Deixa pra comemorar depois, vamos logo! Se a Neru-senpai voltar, dessa vez é fim de jogo pra gente!"
21160-107 = "Tem um monte de robôs de combate logo à frente... Tomem cuidado!"
21160-108 = "É verdade, a missão ainda não acabou!"
21160-109 = "Nosso objetivo não é o \"Espelho\"... é a \"G.Bible\"! Precisamos correr pra sala do clube da Veritas...!"
21160-110 = "Eu cubro a retaguarda. Sensei, aguardando ordens!"
21160-113 = "[ns1] \"Vamos todos voltar em segurança para a sala do clube!\"\n[ns2] \"Todos, preparem-se para o combate!\""
21160-116 = "Sim!"
21160-117 = "Vamos voltar... em segurança, custe o que custar!"
21160-118 = "Aris, iniciando combate!"
