[translation]
10007010-1 = "Эпизод 1;Несанкционированные горячие источники"
10007010-2 = "Президентский кабинет академии Красная Зима"
10007010-4 = "Хр-р..."
10007010-5 = "Кастелла, клубничное молоко, банан..."
10007010-6 = "Хи-хи... Всё моё..."
10007010-7 = ""
10007010-9 = "[ns1] Разбудить её, потряся.\n[ns2] Ткнуть её в щёку."
10007010-10 = ""
10007010-11 = ""
10007010-13 = "А-А?"
10007010-14 = ""
10007010-16 = ""
10007010-18 = "Какой простолюдин посмел прервать мой санкционированный работой дневной сон?"
10007010-19 = ""
10007010-21 = ""
10007010-22 = "О. Товарищ. Давно не виделись."
10007010-23 = "Разумеется, только у тебя хватило бы наглости прервать мой драгоценный сон!"
10007010-24 = "Властью моих усов я..."
10007010-25 = ""
10007010-27 = ""
10007010-28 = "А? Мои усы?!"
10007010-29 = "Томоэ! Неси запасные усы! Быстро!"
10007010-30 = ""
10007010-32 = ""
10007010-34 = ""
10007010-35 = "Ты ничего не видел. Верно, Томоэ?"
10007010-36 = "А что тут было видеть, Великий Вождь?"
10007010-37 = "Ничего! В любом случае! Осмелиться вторгнуться в Секретариат во время дневного сна..."
10007010-38 = "Товарищ, у тебя совсем нет чувства собственного достоинства и уважения?"
10007010-39 = "Президент, время дневного сна закончилось примерно час назад."
10007010-40 = "К-Какой шок."
10007010-41 = "Кхм! Разумеется, я вовсе не намеренно проспала лишнего!"
10007010-42 = "А даже если и так, виноваты эти мерзкие землетрясения!"
10007010-43 = "[s] «Землетрясения?»"
10007010-44 = "В последнее время академию Красной Зимы терзают необъяснимые землетрясения!"
10007010-45 = "Только прошлой ночью меня грубо разбудило как раз в тот момент, когда я начала засыпать."
10007010-46 = "А после этого я уже ни на минуту не смогла уснуть, боясь, что здание обрушится прямо на меня."
10007010-47 = "[s] «Это ужасно.»"
10007010-48 = "Ещё как! Я рада, что мы с тобой понимаем друг друга, товарищ."
10007010-49 = "Что привело тебя в академию Красной Зимы?"
10007010-50 = "[s3] «Ходит много слухов о новых горячих источниках.»\n[s4] «Я хотел искупаться в горячих источниках.»"
10007010-51 = "...Горячие источники? В академии Красной Зимы?"
10007010-52 = "...Горячие источники? В академии Красной Зимы?"
10007010-53 = "Ахахаха! Товарищ, ты умеешь меня рассмешить!"
10007010-54 = "Мы академия снега и льда, а не пара и горячей воды! Ты не перепутал нас с академией Геенна?"
10007010-55 = "Томоэ, ты слышала нелепую шутку товарища?"
10007010-56 = "Недавно в академии Красной Зимы открылся курорт горячих источников, Великий Вождь."
10007010-57 = "Здесь? В моей школе?! Немедленно сообщи мне, где он находится."
10007010-58 = "Разумеется, Великий Вождь. В бывшем институте, куда вы сослали студентов спецотряда."
10007010-59 = "По всей видимости, там внезапно пробился горячий источник, и они открыли курорт."
10007010-60 = "Ты хочешь сказать, что меня, президента академии Красной Зимы, об этом не проинформировали?"
10007010-61 = "При всём уважении, Великий Вождь, вы уснули во время моего доклада на собрании на прошлой неделе."
10007010-62 = "Уф! Томоэ, очевидно же, это была твоя обязанность — доложить мне всё ещё раз, когда я проснулась!"
10007010-63 = "Я никогда не потерплю такого неповиновения. Разработка? Без моего разрешения?"
10007010-64 = "И ещё в бывшем институте? А как же мой приказ обдумать свои проступки? Я не говорила им наслаждаться горячими источниками!"
10007010-65 = "Это же полная противоположность наказанию."
10007010-66 = "Они по-настоящему познают гнев усов!"
10007010-67 = "Томоэ, докладывай. В каком состоянии мой личный танк «Чистильщик №1»?"
10007010-68 = "Покраска была завершена в точности по вашим указаниям, а на прошлой неделе его доставили в Секретариат."
10007010-69 = "Наконец-то хоть кто-то нормально выполняет мои приказы."
10007010-70 = "Идём, Томоэ. Мы отправимся в бывший институт на «Чистильщике №1» и покажем этим нарушителям правил, что такое настоящий страх!"
10007010-71 = "[s] «Чистильщик №1»?"
10007010-72 = "Заинтересовался? Это мой особый танк, сделанный на заказ."
10007010-73 = "Взгляни! Гигантские усы, которые видно издалека. Бульдозерные отвалы спереди сияют непререкаемой властью и раздавят любого, кто выступит против Секретариата! Моё любимое творение!"
10007010-74 = "На нём я снесу баррикады Рабочей партии и раздавлю незаконные курорты горячих источников!"
10007010-75 = "Одним махом я вычищу и мечты студентов спецотряда, и их неповиновение!"
10007010-77 = "Да начнётся дебют «Чистильщика №1»!"
