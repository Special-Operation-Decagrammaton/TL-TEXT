[translation]
80000124-1 = "Шоколад с ловушкой"
80000124-2 = "Я приехал в Тринити по работе и шёл по коридору."
80000124-3 = ""
80000124-6 = "[ns1] «...? Сейя?»\n[ns2] Проверить телефон."
80000124-9 = "Я слышала, что вы приехали, Сенсей."
80000124-10 = "Пожалуй, я имею право немного расстроиться: вы проделали весь путь сюда и не сочли нужным сообщить мне."
80000124-11 = "Есть только один способ исправить моё разочарование. Я сейчас в своей комнате."
80000124-12 = "Ну что же... буду ждать."
80000124-13 = ""
80000124-16 = ""
80000124-17 = "...К слову, я прекрасно знаю, что все остальные обязанности вы уже выполнили."
80000124-18 = "Оправдания я не приму, так что советую даже не пытаться куда-нибудь улизнуть."
80000124-19 = ""
80000124-23 = "[ns3] «...Страшно.»\n[ns4] Направиться в комнату Сейи."
80000124-27 = "...Вы прибыли."
80000124-28 = "Есть лишь одна причина, почему я так упрямлюсь и веду себя столь невежливо именно сегодня."
80000124-29 = "И поскольку я, разумеется, прекрасно знаю, насколько вы заняты, сразу перейду к делу."
80000124-30 = ""
80000124-32 = ""
80000124-33 = ""
80000124-34 = "Это шоколад от меня вам, Сенсей. Надеюсь... он придётся по вкусу."
80000124-35 = "Если хотите, можете просто забрать его с собой. Но раз уж повод такой, не попробуете немного? Прямо здесь и сейчас?"
80000124-36 = "Он не домашний... и обошёлся мне довольно дорого."
80000124-37 = ""
80000124-39 = ""
80000124-40 = "[ns5] «Здесь что-то вроде квитанции.»\n[ns6] «За шоколадом... есть место для подписи.»"
80000124-43 = "Хм... Чек?"
80000124-44 = "А, да. Я забыла убрать его, пока решала, отправить шоколад доставкой или вручить лично."
80000124-45 = "Прошу прощения. Но, Сенсей, поскольку вы конечный получатель... не могли бы поставить подпись?"
80000124-46 = "Я уже всё оплатила, так что с этой стороны проблем не будет. Считайте это просто подтверждением от получателя... Вот ручка."
80000124-47 = ""
80000124-51 = "[ns7] «Постой, Сейя. Эта квитанция...»\n[ns8] «Разве она не совершенно пустая?»"
80000124-54 = "...Вы меня поймали."
80000124-55 = "Прошу прощения, Сенсей. Я солгала, когда сказала, что купила его. Я приготовила его сама."
80000124-56 = "Про доставку тоже была ложь. Чек с самого начала был пустым."
80000124-57 = "Я просто написала на чеке, во что вам обойдётся принятие этого шоколада..."
80000124-58 = "А потом могла вписать туда всё, что захочу, и считать, что вы это подписали."
80000124-59 = "...Что? Ловушка?"
80000124-60 = "Фу-фу. О чём вы, Сенсей? Разве я не повторяла несколько раз?"
80000124-61 = "Это моя комната. А в моей комнате моё слово — закон."
80000124-62 = "Итак, в итоге это... ваша вина, что пришли в такое опасное место совершенно беззащитным."
80000124-63 = ""
80000124-65 = ""
80000124-66 = "Тогда я с благодарностью заберу... ваше «разрешение»."
80000124-67 = "Цена, возможно, слишком мала, но простите меня в обмен на съеденный вами шоколад."
80000124-68 = "...Ах."
80000124-69 = "Кстати, я также солгала, когда сказала, что не отниму у вас много времени."
80000124-70 = "Ну что ж..."
80000124-71 = ""
80000124-73 = ""
80000124-74 = ""
80000124-75 = "Не доедите ли весь оставшийся шоколад у меня на глазах?"
80000124-77 = "После этого я доел вкусную «ловушку» Сэи прямо перед ней."
80000124-78 = "Провожая меня, Сэя дошла со мной до выхода из комнаты, сказав, что хочет «избежать мести»."
