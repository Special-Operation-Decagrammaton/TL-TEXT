[translation]
10001105-1 = "Эпизод 10; Революционный праздник академии Красная Зима"
10001105-2 = "Секретариат академии Красная Зима"
10001105-3 = "Мы пришли, увидели и победили!"
10001105-4 = "Товарищ, Томоэ, вы это видели? Видели, как блестяще я повела всех к победе?"
10001105-5 = "Разумеется. Вы проявили себя великолепно, президент Черино!"
10001105-6 = "Уверена, история о том, как вы объединили студентов самых разных кругов и разгромили мерзких узурпаторов, долгие годы будет жить в сердцах студентов Красная Зима."
10001105-7 = "Может, попросим художника запечатлеть этот доблестный момент, чтобы и следующее поколение смогло его увидеть?"
10001105-8 = "Хм, превосходная идея, главный секретарь Томоэ! Займись этим!"
10001105-9 = "[s] «Но ты всё время только кричала...»"
10001105-10 = "Это лишь твоё впечатление, товарищ! То были доблестные боевые кличи, поднимавшие мораль студентов!"
10001105-11 = "Если ты слышал лишь визг маленькой девочки, тебе стоит проверить слух!"
10001105-12 = "А-а-а... Как хорошо вернуться в секретариат."
10001105-13 = "Шкаф набит сладостями, кресло такое удобное. Я снова там, где мне и место — в самом главном кабинете!"
10001105-14 = "Остаток дня я проведу в этом кресле, поедая картофельные чипсы и не шевеля ни единым мускулом!"
10001105-15 = ""
10001105-16 = "Но прежде чем отдыхать... послушаем твоё оправдание за этот переворот, «председатель» Марина."
10001105-17 = ""
10001105-19 = "*глоть*"
10001105-21 = "Ты была моим доверенным товарищем, Марина. Как ты посмела воспользоваться моим сном и устроить переворот?!"
10001105-22 = "Ты совершила непростительное преступление!"
10001105-23 = "Мне так стыдно, президент Черино..."
10001105-24 = "Хмф!"
10001105-25 = "Говори. Почему ты меня предала?"
10001105-26 = "...Ты разозлилась из-за того, что я съела твой пудинг?"
10001105-27 = "Или потому, что я обслюнявила твоего любимого плюшевого мишку...?"
10001105-28 = "Пудинг? Слюни? О чём вы вообще...?"
10001105-29 = "Ч-чисто гипотетические варианты, в-вот и всё!"
10001105-30 = "(Фух! Чуть не призналась в том, о чём она даже не знала!)"
10001105-31 = "Кхм!"
10001105-32 = "Раз дело не в этих... гипотетических случаях, тогда зачем ты меня свергла?"
10001105-33 = "Ну, просто... я случайно сломала вашу статую и—"
10001105-34 = "Статую? Какую ещё статую?"
10001105-35 = "Ваш бюст в коридоре нового здания. Статую установили в честь открытия здания в прошлом месяце."
10001105-36 = "(Погоди, правда? Кажется, я что-то такое слышала...)"
10001105-37 = "Я случайно задела статую, и у неё отломились усы... Из-за моей небрежности был запятнан ваш авторитет."
10001105-38 = "Хотя я сделала это не специально, я знала, что вы меня ни за что не простите, поэтому я—"
10001105-39 = "Стой! И это была единственная причина?"
10001105-40 = "А? Это значит...?"
10001105-41 = "Марина, ты уже очень давно моя правая рука на посту председателя Совета безопасности."
10001105-42 = "Какой бы талантливой я ни была, без тебя я бы никогда не достигла нынешнего положения. Потеря каких-то каменных усов ничто по сравнению с потерей тебя."
10001105-43 = "Я слишком милосердна, чтобы наказывать тебя за такую мелочь..."
10001105-44 = "Президент!"
10001105-46 = "...Вот что ты надеялась услышать, ДА?!"
10001105-48 = "Ч-что за...?"
10001105-49 = "Ты хоть представляешь, сколько я из-за тебя натерпелась? Ни сна! Ни сладостей! Все студенты надо мной издевались и называли мелкой соплячкой!"
10001105-50 = "Мне плевать на какие-то жалкие усы, но я никогда не забуду тебе то, что ты затеяла этот переворот!"
10001105-51 = "П-президент Черино! Пожалуйста, простите меня хотя бы в этот раз!"
10001105-52 = "Отказано! Никогда не прощать! Никогда не забывать!"
10001105-53 = "Томоэ! Отведи Марину и её сторонников мыть туалеты на целый месяц!"
10001105-54 = ""
10001105-56 = ""
10001105-57 = "Пусть наказание обрушится на них адским пламенем!"
10001105-59 = "Неделю спустя, в день фестиваля Ивана Купалы..."
10001105-61 = "Главные ворота академии Красная Зима"
10001105-62 = ""
10001105-63 = "Добро пожаловать, Сенсей."
10001105-64 = "Президент Черино ждёт вас внутри."
10001105-65 = "Прошу за мной..."
10001105-68 = "Президентский кабинет академии Красная Зима"
10001105-69 = "Ха-ха-ха! Добро пожаловать, товарищ. С Иваном Купалой!"
10001105-70 = "[s] «С Иваном Купалой, Черино.»"
10001105-71 = "Я так рада провести фестиваль академии Красная Зима вместе с тобой, товарищ."
10001105-72 = "Обычно посторонним нельзя находиться здесь во время фестиваля."
10001105-73 = "Но в свете твоих безупречных заслуг в прошлый раз я даровала тебе особое приглашение. Считай это большой честью, товарищ!"
10001105-74 = "Скажи, что-нибудь в школе кажется тебе другим по сравнению с прошлой неделей?"
10001105-75 = "[s] «Кампус выглядит немного чище.»"
10001105-76 = "А, это? Марина и её приспешники каждый день убирают школу."
10001105-77 = "Я собиралась заставить их мыть только туалеты, но оказалось, что из них выходит отличная уборочная бригада!"
10001105-78 = "Такими темпами мой титул начальника санитарной службы может оказаться под угрозой."
10001105-79 = "Но хватит об этом, я говорила не о школе! Ты заметил что-нибудь другое во мне?"
10001105-80 = "[s] «Ты стала выше?»"
10001105-81 = "П-погоди, правда? Ты сейчас серьёзно, товарищ?"
10001105-82 = "Где моя рулетка?! Мне нужно немедленно проверить!"
10001105-83 = ""
10001105-85 = ""
10001105-86 = "Что это значит? Я вообще не выросла! Ты издеваешься надо мной, товарищ?!"
10001105-87 = "Мне всё равно, что ты из Шале, насмешки я не потерплю!"
10001105-88 = "Кхм! Да, стать выше было бы неплохо."
10001105-89 = "Но я говорила о внутренних переменах."
10001105-90 = "После переворота я стараюсь прислушиваться к проблемам студентов."
10001105-91 = "Главный секретарь Томоэ сказала, что когда я выслушиваю студентов, сочувствую им и обещаю найти решение, я напоминаю ей тебя..."
10001105-92 = "Только подумай! Ты взрослый, поэтому умеешь делать то, на что мы, студенты, пока можем лишь надеяться!"
10001105-93 = "Если я напоминаю Томоэ тебя, значит, я вознеслась на новый уровень величия!"
10001105-94 = "Ну что думаешь, товарищ? Поражён моей новообретённой зрелостью?"
10001105-95 = "[s] «А ты выполнила все обещания, которые дала студентам?»"
10001105-96 = "Эм, что...? О каких обещаниях речь?"
10001105-97 = "А, об этих обещаниях... Эм... Ну, сейчас мы не можем начать наступление на Геенна или Тринити..."
10001105-98 = "К тому же эти студенты Спецотряда продолжали называть меня мелкой соплячкой! Я не могу спустить им это с рук!"
10001105-99 = "Все эти обещания отложены до дальнейшего уведомления! Пока всё останется ровно как было!"
10001105-100 = "Хватит об этом. Сегодня у нас с тобой полно времени, чтобы насладиться фестивалем, товарищ. Почему бы нам—"
10001105-102 = ""
10001105-103 = "Ч-Черино! У нас чрезвычайная ситуация!"
10001105-104 = "Что теперь, главный секретарь Томоэ? Я же сказала не мешать мне с товарищем!"
10001105-105 = "У-студента Спецотряда №227 штурмуют секретариат и требуют, чтобы вы выполнили своё обещание!"
10001105-106 = "Но не только они. С ними ещё Фронт освобождения знаний и Рабочая партия..."
10001105-107 = "Чего-о-о?! Какие же они нетерпеливые! Фестиваль ещё даже не закончился, а у нас уже новый переворот?!"
10001105-108 = "Отправьте председателя Совета безопасности Марину и Государственную гвардию подавить переворот!"
10001105-109 = ""
10001105-110 = "Но председатель Марина измотана после того, как всю ночь мыла туалеты... Она сейчас не в состоянии сражаться."
10001105-111 = "А большинство бойцов Государственной гвардии после прошлого переворота либо уволены, либо находятся на испытательном сроке..."
10001105-113 = "Н-не может быть! Хотите сказать, мне снова придётся бежать? И куда мне идти на этот раз?!"
10001105-114 = "Как же мне надоели эти перевороты!"
10001105-115 = "Революционный Иван Купала"
