[translation]
2001105-1 = "Немного затянувшийся перерыв"
2001105-4 = "Было уже поздно после полудня, и я пришёл в назначенное время."
2001105-5 = "(Но спустя некоторое время Сэрика так и не появилась в месте встречи.)"
2001105-6 = "[s] «Она занята?»"
2001105-8 = "(Прошло около двадцати минут, и я начал волноваться.)"
2001105-10 = "[ns] «Она опять где-нибудь потеряла сознание?»"
2001105-11 = "(В прошлый раз Сэрика потеряла сознание из-за переутомления на подработке. Встревожившись, я отправился искать её.)"
2001105-22 = "[ns] «Сэрика!»"
2001105-34 = "[ns] «Сэрика!»"
2001105-46 = "[ns] «Сэри—!»"
2001105-50 = "Простите... Не могли бы вы отойти с дороги?"
2001105-52 = "Хм. То есть вы отказываетесь?"
2001105-53 = "Но так всё усложняется. Сенсей меня ждёт."
2001105-54 = "[s] (Это голос Сэрики?)"
2001105-55 = "(Пойдя на голос, я завернул за угол площадки.)"
2001105-58 = "[ns] «Сэрика, ты в порядке?!»"
2001105-59 = "А, С-Сенсей? Ч-Что случилось? Почему у вас такое серьёзное лицо?"
2001105-60 = "[s1] «Какое облегчение.»\n[s2] «Что с тобой случилось?»"
2001105-61 = "А, это. Ахаха..."
2001105-62 = "А, это. Ахаха..."
2001105-65 = "― П-Простите, Сенсей.[wa:1940]"
2001105-67 = "― Как видите, какое-то время я никуда не смогу уйти...[wa:70]"
2001105-70 = "[ns3] «Похоже, ему хорошо — вон как мурлычет.»\n[ns4] «Почему-то он напоминает тебя, Сэрика.»"
2001105-71 = "― А? Ч-Что это должно значить?![wa:1380]"
2001105-72 = "― А? Ч-Что это должно значить?![wa:1380]"
2001105-74 = "― Погодите, это был комплимент?[wa:260]"
2001105-77 = "― Ой, только сейчас поняла. Простите, что не смогла сдержать обещание...[wa:3800]"
2001105-79 = "― А? Вы не против просто отдохнуть здесь вместе?[wa:1180]"
2001105-82 = "[ns] «Ты сама сказала, что никуда не уйдёшь, так что...»"
2001105-83 = "― Я действительно очень много работала на подработке,[wa:50]"
2001105-85 = "― поэтому вы, наверное, хотите, чтобы я сейчас немного отдохнула, да?[wa:1300]"
2001105-88 = "― Хаха. Ну что вы![wa:840]"
2001105-90 = "― В вашем духе говорить такие вещи.[wa:1280]"
2001105-93 = "― Но ладно. Только ненадолго.[wa:2820]"
2001105-95 = "― Можем немного отдохнуть здесь вместе, Сенсей.[wa:1390]"
2001105-98 = "Я провёл день с Сэрикой на задней веранде, наслаждаясь нашим беззаботным отдыхом."
