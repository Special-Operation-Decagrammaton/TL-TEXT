[translation]
10024030-1 = "Эпизод 3;Усердная учёба, постоянная практика"
10024030-3 = "Клубная комната Общества восточной алхимии"
10024030-5 = "[ns1] «А, вот что ты задумала.»\n[ns2] «Общество восточной алхимии...?»"
10024030-8 = ""
10024030-9 = "Именно, Сенсей."
10024030-10 = "Я ни разу даже не прикасалась к десятитысячелетнему женьшеню."
10024030-11 = "Но кое-кто в Шаньхайцзине прикасался."
10024030-12 = "Если кто-то и знает о нём, то это исследователи лекарств из Общества восточной алхимии."
10024030-13 = "Я ещё думала спросить учеников-спортсменов — мастеров боевых искусств и танцоров..."
10024030-14 = "Но они просто разжуют женьшень, даже толком не понимая, что это такое."
10024030-15 = "О! То есть... десятитысячелетний женьшень повышает боевую силу...?"
10024030-16 = "Как думаете, моему кунг-фу он поможет?"
10024030-17 = "...Никто не говорил, что он так работает."
10024030-18 = "Но ты же только что сказала, что мастера боевых искусств любят его жевать..."
10024030-19 = "Сосредоточься, Рэйдзё."
10024030-20 = ""
10024030-22 = ""
10024030-24 = ""
10024030-25 = "Я слышала, что что-то случилось, но чтобы сам Променад Чёрной Черепахи да ещё и Сенсей пришли в гости... Что происходит?"
10024030-26 = "[s] «Мы надеялись, что ты сможешь нам кое с чем помочь.»"
10024030-27 = "Нет. Даже не начинайте. Простите, Сенсей, но возвращайтесь туда, откуда пришли."
10024030-28 = "Если бы дело было только в вас, я бы согласилась на что угодно. Но я слышу слухи о ваших друзьях с Променада."
10024030-29 = "Между Променадом Чёрной Черепахи и Генрюмон назревают проблемы, и я хочу держаться от этого подальше!"
10024030-30 = "Общество восточной алхимии и так по уши занято исследованиями Эликсира бессмертия!"
10024030-31 = "Давайте поговорим. Мы все разумные люди."
10024030-32 = "И я принесла жареную лапшу, нарезанную ножом, с обжаренными сырными фрикадельками. Чтобы перекусить. Пока разговариваем."
10024030-33 = ""
10024030-35 = ""
10024030-36 = ""
10024030-37 = ""
10024030-38 = "Ж-жареная лапша, нарезанная ножом...? И сырные фрикадельки...? Я никогда о таком не слышала...!"
10024030-39 = "Сыр внутри фрикаделек поджаривается до хрустящей корочки, придавая им насыщенный хруст. А лапша впитывает соус и становится такой упругой..."
10024030-40 = "...!"
10024030-41 = "Представь гармонию ароматной лапши и пикантного сыра, смешивающихся у тебя на языке..."
10024030-42 = "Это единственный рецепт, переживший ночь интенсивных экспериментов. Мне пригодится твоё экспертное мнение, Сая."
10024030-43 = "Кхм... Ну, раз вам нужна моя экспертиза...!"
10024030-44 = ""
10024030-46 = ""
10024030-47 = ""
10024030-48 = ""
10024030-49 = ""
10024030-50 = ""
10024030-51 = ""
10024030-55 = "[ns] «Так вот зачем нам сначала пришлось заскочить на кухню...»"
10024030-56 = "В бой никогда не идут без достаточного запаса провизии."
10024030-58 = ""
10024030-65 = ""
10024030-66 = "Зачем вам вообще понадобился десятитысячелетний женьшень...? С ним столько мороки..."
10024030-67 = "[s] «Почему?»"
10024030-68 = "Для начала его почти невозможно выращивать."
10024030-69 = "Растение любит прохладу и влажность, поэтому растёт только высоко на склонах горы Куньлунь."
10024030-70 = "И нужно не меньше шести лет — обычно десять — прежде чем оно созреет достаточно, чтобы из него можно было делать лекарство."
10024030-71 = "Хуже того, если растение хоть немного потревожить, оно впадает в спячку. Посадишь 100 семян — повезёт, если за всю жизнь прорастут хотя бы 10."
10024030-72 = "[s] «Капризное растение...»"
10024030-73 = "А вкус! Стоит откусить самый кончик — настолько горько, что язык немеет минут на десять."
10024030-74 = "Нужно быть сумасшедшим, чтобы захотеть с ним готовить..."
10024030-75 = "Ты не преувеличиваешь."
10024030-76 = "Ты уже готовила с ним?!"
10024030-77 = "Я просто попробовала маленький кусочек."
10024030-79 = "Некоторые провалы можно предвидеть и без экспериментов..."
10024030-80 = "Может и так. Но почему-то я никогда не могу удержаться от нового рецепта..."
10024030-82 = "Но, как говорят, лучшие лекарства горькие. И десятитысячелетний женьшень не исключение."
10024030-83 = "Если пройти все этапы обработки — а их ОЧЕНЬ много — у него появляются интересные эффекты."
10024030-84 = "[s] «Например?»"
10024030-85 = "Он временно, но очень сильно повышает способность концентрироваться."
10024030-86 = "Ускоряет обмен веществ, поэтому привлекает тех, кто сидит на диете..."
10024030-87 = "...и действует как стимулятор, полностью убирая чувство усталости."
10024030-88 = "Он даже настолько ускоряет обработку информации мозгом, что ты можешь видеть летящие в тебя пули."
10024030-89 = "[s] «Он позволяет уворачиваться от пуль? Потрясающе!»"
10024030-90 = "Эй, я ничего не говорила про УКЛОНЕНИЕ от пуль!"
10024030-91 = "Ты просто будешь стоять и думать: «О, пуля. Надо бы увернуться». А потом БАХ — и она в тебя попадает."
10024030-92 = ""
10024030-94 = ""
10024030-95 = ""
10024030-96 = ""
10024030-97 = "Улучшенная реакция... Неутомимая энергия и быстрый обмен веществ..."
10024030-98 = "Нет, Рэйдзё."
10024030-99 = "Я-я ещё ничего не сказала..."
10024030-100 = "И не надо. Ты должна становиться сильнее правильным способом. Иначе это не в духе кунг-фу."
10024030-102 = "...!"
10024030-104 = "Конечно...! Как ты всегда говоришь... Бесплатного обеда не бывает..."
10024030-105 = "Поняла, Президент! Тогда вы могли бы..."
10024030-106 = "Нет."
10024030-107 = "Ты даже не услышала, что я хотела спросить."
10024030-108 = "Я слишком занята готовкой и обязанностями президента, чтобы тренироваться с тобой в кунг-фу."
10024030-109 = "[s] «В любом случае, этот женьшень звучит опасно в неправильных руках.»"
10024030-111 = "Полно студентов, которые мечтают заполучить его. Для учёбы, экзаменов и так далее..."
10024030-112 = "А я-то думала, им нужен его уникальный горький вкус."
10024030-113 = "У тебя всё всегда сводится к вкусу, да? По крайней мере, ты последовательна."
10024030-114 = "В любом случае, я не понимаю таких студентов. Просто прочитай учебник перед экзаменом — и бац! Пятёрка!"
10024030-115 = ""
10024030-118 = "[ns] «Для большинства людей всё не так просто...»"
10024030-119 = "Правда? Мне всегда хватало просто повторить материал за день до экзамена."
10024030-120 = "Я всегда получаю максимальный балл. Кроме случаев, когда они подсовывают вопросы с подвохом..."
10024030-121 = "[s3] «Для большинства людей это правда, правда не так просто...»\n[s4] «Ты единственная, кого я знаю, кто так умеет.»"
10024030-124 = "Вот как?"
10024030-125 = "Хм... Тогда я, пожалуй, понимаю, почему некоторые студенты охотятся за этим женьшенем."
10024030-126 = "[s] «Эм, может быть, но это не делает их поступок нормальным.»"
10024030-127 = "Хорошо, вот чего я не понимаю. Даже если эти студенты получат женьшень, у кого есть время его обрабатывать?"
10024030-128 = "Нужно работать с опасными растворителями и высокими температурами, а одна ошибка на любом этапе портит всю партию."
10024030-129 = "Детоксикация. Дистилляция. Нейтрализация. Разделение. Быстрое охлаждение. Экстракция... И это только то, что я вспомнила сразу."
10024030-130 = "Чтобы получить хоть что-то полезное, нужна профессиональная лаборатория."
10024030-131 = "Если бы где-то кроме Общества восточной алхимии была такая установка, я бы об этом слышала."
10024030-132 = "И если бы кто-то распространял всё это оборудование, мои связи сообщили бы мне."
10024030-133 = "[s] «Вы обе отлично разбираетесь в своём деле.»"
10024030-134 = "В Шаньхайцзине нельзя зажечь горелку Бунзена так, чтобы я об этом не узнала!"
10024030-135 = "Хотя все эти знания пока не особо помогают с Эликсиром бессмертия..."
10024030-136 = "[s5] «Ты всё ещё пытаешься создать Эликсир бессмертия, да?»\n[s6] «Почему ты так одержима созданием этого эликсира?»"
10024030-139 = "Меня двигает вперёд то, что это невозможно..."
10024030-140 = "Именно, невозможно! Цель попроще просто не стоила бы испытания!"
10024030-141 = "Любая достойная исследовательница должна целиться как можно выше! Неважно, насколько трудно!"
10024030-142 = "И пока я двигаюсь к этой сложной и невозможной цели, по пути естественным образом сделаю множество отличных открытий."
10024030-143 = "Хм. Это прямо вдохновляет, Сая. У тебя более широкий взгляд, чем я думала."
10024030-144 = "Не пойми неправильно. Эти открытия — приятно, но они не цель."
10024030-145 = "Некоторые учёные отвлекаются на неожиданные результаты и забывают, чего добивались..."
10024030-147 = "Но только не в Обществе восточной алхимии! Я этого не позволю!"
10024030-148 = "[s] «Ты делаешь хорошую работу, Сая.»"
10024030-149 = "Х-х-хвали меня сколько угодно, Сенсей, но я всё равно не полезу в это дело."
10024030-150 = "Я не знаю, кто контрабандой вывозит десятитысячелетний женьшень и для чего его используют..."
10024030-151 = "О... Вообще-то..."
10024030-152 = "[s] «Ты что-то вспомнила?»"
10024030-153 = "Н-нет. Просто мысль. Ничего, что касается вас..."
10024030-154 = ""
10024030-156 = ""
10024030-157 = "(Был ОДИН исследовательский проект, где химическое вещество из десятитысячелетнего женьшеня использовали для стимуляции работы мозга...)"
10024030-158 = "(Но это исследование...)"
10024030-159 = ""
10024030-162 = ""
10024030-164 = "Ты говорила, что десятитысячелетний женьшень растёт только на горе Куньлунь, верно?"
10024030-165 = "Нам стоит самим туда сходить и посмотреть. Спасибо за наводку."
10024030-166 = "...Общество восточной алхимии НЕ ИМЕЕТ НИКАКОГО отношения к вашему расследованию."
10024030-167 = "Обязательно упомяну это Генрюмон, когда увижу их."
