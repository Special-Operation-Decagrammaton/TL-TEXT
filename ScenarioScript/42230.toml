[translation]
42230-1 = "Episódio 23;Golpe de Estado Fracassado"
42230-4 = "Escritório da Presidente Interina do Conselho Estudantil Geral"
42230-6 = "Huhu... O aroma de um café Esmeralda depois de aproveitar um brunch tardio é mesmo incomparável."
42230-7 = "Por serem grãos de café tão raros, deu um pouco de trabalho para consegui-los... mas, como uma xícara para celebrar o dia de hoje, acho que posso me permitir um luxo desses."
42230-11 = "Pois bem. Já deve estar na hora de sair a notícia da explosão na Estação Kousagi..."
42230-18 = "Alô, aqui é Kaya Shiranui, Presidente Interina do Conselho Estudantil Geral."
42230-19 = "Ah, General. Ligou bem na hora."
42230-20 = "A operação na Estação Kousagi foi concluída sem problemas?"
42230-24 = "...Como assim? O Esquadrão FOX falhou na operação...?"
42230-25 = "E ainda por cima, o Esquadrão RABBIT armado está vindo para o Conselho Estudantil Geral junto com o Sensei de Schale...?"
42230-26 = "O-O que isso significa? Por favor, explique de novo."
42230-30 = "Não conseguiram parar agentes da SRT sob o comando do Sensei?#nM-Mas que absurdo você está dizendo..."
42230-37 = "Eu estou pagando a vocês, sabia...?"
42230-39 = "Não deveriam detê-los a qualquer custo?!"
42230-51 = "RABBIT 1, cheguei à linha férrea sentido centro."
42230-52 = "RABBIT 2, varredura da área concluída. Nenhuma outra ameaça detectada."
42230-54 = "RABBIT 3 aqui! Acabei de avisar a Academia Ferroviária Highlander sobre o acidente e mandei interditar a linha que vai pro prédio do Conselho Estudantil Geral."
42230-55 = "Os trens não vão circular na próxima hora, então podem seguir em frente sem preocupação~!"
42230-56 = "Entendido."
42230-57 = "RABBIT 2, RABBIT 4. Há risco de o alvo fugir, então vamos invadir o prédio do Conselho Estudantil Geral imediatamente!"
42230-59 = "E-Entendido...!"
42230-60 = "Deixa comigo!"
42230-66 = "Parece que aquelas raposas da SRT foram derrotadas..."
42230-67 = "Perder para umas pirralhas que nem treinamento decente tiveram... Que vergonha para as forças especiais."
42230-73 = "Ainda bem que deixei a Kaiser SOF de prontidão aqui."
42230-74 = "Originalmente era uma carta na manga contra as raposas, mas contra coelhos vai cumprir seu papel com folga."
42230-76 = "Eu não sou como os idiotas que baixam a guarda e fracassam—"
42230-90 = "Tango abatido!"
42230-95 = "Entendido, vamos continuar avançando."
42230-100 = "D-Desculpa...!"
42230-110 = "[ns] \"Desculpa, vamos passar na frente.\""
42230-114 = "Quem raios são elas..."
42230-115 = "Tem limite para fazer alguém de idiota..."
42230-116 = "...Eu nunca vou perdoar vocês, SRT!"
