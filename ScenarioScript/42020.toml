[translation]
42020-1 = "Episódio 2;O Sonho do Coelho"
42020-4 = "\"A Academia Especial SRT... sob a autorização da Presidente do Conselho Estudantil Geral...\""
42020-6 = "\"Os esquadrões da SRT são compostos por pequenas equipes de elite...\""
42020-8 = "\"...A justiça é o caminho correto guiado pela razão.\""
42020-11 = "\"A justiça da SRT jamais vacilará, seja qual for a situação.\""
42020-15 = "...As veteranas na televisão brilhavam de forma ofuscante."
42020-16 = "Aquelas figuras que personificavam o ideal... eram o próprio objeto da nossa admiração."
42020-18 = "Admirávamos a forte convicção e a disciplina rigorosa que jamais se quebravam, mesmo nas situações mais adversas."
42020-19 = "Admirávamos o poder avassalador capaz de neutralizar qualquer criminoso com um único golpe."
42020-20 = "Admirávamos a coragem destemida que não vacilava nem diante dos inimigos mais terríveis."
42020-22 = "— Admirávamos uma justiça imutável."
42020-23 = "As veteranas eram o nosso sonho e o nosso futuro."
42020-24 = "Corremos seguindo os passos delas —"
42020-26 = "E então, nós..."
42020-30 = "Nos tornamos SRT."
42020-33 = "Hmm..."
42020-34 = "Ah, Miyako-chan. Bom dia."
42020-35 = "...Bom dia, Miyu."
42020-36 = "Já vai levantar? Ainda falta um tempinho para o café da manhã...?"
42020-37 = "Miyako-chan, você ficou até tarde na vigia noturna ontem... podia dormir mais um pouco."
42020-38 = "Está tudo bem, eu já dormi o suficiente."
42020-42 = "O tempo está ótimo hoje, as roupas devem secar bem."
42020-43 = "A propósito, onde estão a Moe e a Saki...?"
42020-44 = "Elas disseram agora há pouco que iam procurar ingredientes para acompanhar a refeição..."
42020-51 = "Ei, olhem só isso!"
42020-52 = "Saindo um pouco da nossa rota de caminhada de sempre, tinha um monte de cogumelos crescendo!#nTrouxe os maiores que achei."
42020-53 = "Com tudo isso, dá para viver só de cogumelos por dois dias!"
42020-58 = "Kuhihihi... vocês podem se surpreender com o que eu trouxe também, sabia?"
42020-59 = "Olha só, um montão de ovos!"
42020-60 = "Ganhei agora há pouco na rua comercial. Disseram que era um agradecimento por acabar com as pragas."
42020-61 = "Eu só testei um pouquinho uma granada de fumaça nova... mas acabei saindo no lucro, né?"
42020-62 = "Uau... tantos ingredientes frescos...!"
42020-66 = "Ainda temos pão enlatado sobrando... parece que o café da manhã de hoje vai ser um banquete."
42020-67 = "Kuhihi, já estou ficando animada.#nEntão, primeiro precisamos acender o fogo. Vou lá juntar uns galhos secos."
42020-68 = "Deixem a frigideira e os legumes comigo!"
42020-69 = "Sendo assim, eu cuido dos temperos e do resto dos preparativos."
42020-73 = "E-Eu também vou ajudar...!"
42020-78 = "Pão, cogumelos refogados e ovos... um café da manhã luxuoso que antes eu nem conseguia imaginar."
42020-79 = "Queria poder comer uma refeição farta assim todos os dias —"
42020-80 = "Pois é. Além disso, hoje está fresquinho e o tempo está ótimo..."
42020-81 = "Se os dias continuarem assim, talvez nem seja ruim ficar aqui para sempre —"
42020-86 = "...Ei. A gente não está se acostumando demais com essa situação?"
42020-87 = "...Verdade. Parece que a missão ficou em segundo plano e a gente só fica feliz ou triste com pequenas melhorias no dia a dia..."
42020-88 = "Tsc... Mesmo sendo a elite da SRT...#nMesmo sendo membros de um esquadrão de uma academia especial com equipamentos sempre de última geração..."
42020-89 = "...Vamos parar com esse assunto.#nVai acabar estragando uma refeição tão gostosa."
42020-90 = "É verdade. Agora vamos focar na comida —"
42020-94 = "[ns] \"Bom dia, pessoal, tudo bem?\""
42020-95 = "Ah, é o Sensei [USERNAME]."
42020-96 = "Ah, achei que era um rosto conhecido e era o Sensei mesmo."
42020-97 = "Bem-vindo, Sensei. Hoje estou de bom humor, então vou te receber bem."
42020-98 = "[s1] \"Ser recebido pela Saki com um sorrisão desses...\"\n[s2] \"Ainda bem que me tornei Sensei...\""
42020-99 = "C-Cala a boca! Não é nenhum sorrisão!"
42020-100 = "C-Cala a boca! Não é nenhum sorrisão!"
42020-107 = "Ah, Sensei. Bom dia."
42020-108 = "O que o traz aqui tão cedo pela manhã?#nNão chegamos a entrar em contato..."
42020-109 = "Por acaso aconteceu algum problema...?"
42020-110 = "[s] \"Não, não é nada disso...\""
42020-112 = "[ns] \"Eu queria agradecer pelo outro dia.\""
42020-113 = "Pelo outro dia..."
42020-114 = "Ah... você está falando daquele incidente?"
42020-119 = "...Uma crise em Kivotos foi uma experiência bem emocionante, né?"
42020-120 = "Até eu, que adoro destruição, senti um calafrio na espinha, kuhihi..."
42020-121 = "O céu ficou todo vermelho e apareceram vários inimigos desconhecidos...#nEu estava com tanto medo que só queria fugir, mas..."
42020-122 = "...Todo mundo estava se esforçando por Kivotos, então..."
42020-123 = "[s] \"Muitas alunas me ajudaram naquele incidente, mas...\""
42020-125 = "Haaaaaaaah —!!!"
42020-126 = "Esquadrão RABBIT. Confirmamos o pedido de resgate do Sensei e chegamos para o apoio."
42020-127 = "[ns3] \"Se vocês do Esquadrão RABBIT não tivessem aparecido naquela hora,\"\n[ns4] \"começar o contra-ataque teria sido um sonho distante.\""
42020-132 = "...Não, não há necessidade de agradecer."
42020-133 = "Como membros da SRT, apenas fizemos o que era nosso dever..."
42020-134 = "Isso mesmo, proteger a justiça é o papel da SRT!"
42020-135 = "Além disso, foi uma chance rara de disparar mísseis direto no prédio da Schale, kuhihi..."
42020-136 = "[s] \"Obrigado. Mas não vou ficar tranquilo se não retribuir de alguma forma.\""
42020-140 = "[ns] \"Eu trouxe um agrado para vocês...\""
42020-141 = "Hmph... A gente já se adaptou completamente a essa vida, sabia?#nNão estamos precisando de comida, mas —"
42020-142 = "Bom, vamos aceitar a intenção, então pode guardar isso aí."
42020-144 = "Poder proteger a segurança dos cidadãos já é a nossa maior alegria.#nNão desejamos nada além disso."
42020-145 = "A propósito, Sensei. Se ainda não tomou café da manhã, que tal comer aqui com a gente?#nPor acaso estamos cheias de ovos e cogumelos."
42020-146 = "É, boa ideia. Esses cogumelos são de uma variedade raríssima por aqui.#nSão famosos pelo ditado \"aroma de matsutake, sabor de shimeji\" —"
42020-151 = "[ns] \"Mas, bem...\""
42020-153 = "[ns] \"É contrafilé bovino de primeira para bife...\""
42020-155 = "E-Err... bem..."
42020-156 = "...C-Claro que a segurança dos cidadãos é a nossa maior alegria, mas..."
42020-157 = "Contrafilé... bovino... de primeira... para bife...!!"
42020-158 = "Uma carne marmorizada assim... nunca comi na vida..."
42020-159 = "[s5] \"Se vocês não querem, não tem jeito...\"\n[s6] \"Tem bastante, então acho que vou jogar num macarrão instantâneo mesmo...\""
42020-162 = "O quê?!"
42020-163 = "Você acabou de dizer que vai colocar contrafilé bovino marmorizado de primeira no macarrão instantâneo?"
42020-164 = "Que decisão é essa?! Quer jogar dinheiro no lixo?!"
42020-168 = "[ns7] \"Mas não consigo pensar em outro jeito bom de comer...\"\n[ns8] \"E tem bastante, então acho que não vou conseguir comer tudo sozinho.\""
42020-169 = "E-Então come aqui com a gente, ué..."
42020-170 = "E-Então come aqui com a gente, ué..."
42020-171 = "Aqui dá para acender fogo e gente para comer não falta..."
42020-175 = "[ns] \"Então vamos comer todos juntos.\""
42020-177 = "Ebaaa!"
42020-178 = "Vou buscar a grelha."
42020-179 = "Vou pegar mais um prato...!"
42020-183 = "O-O que a gente coloca para acompanhar a carne?#nBatatas? Ou será que cebola...?"
42020-184 = "Por enquanto vou guardar esses cogumelos aqui..."
42020-189 = "...Você não tinha dito que esses cogumelos eram raríssimos?"
42020-190 = "Pois é, mas... estamos falando de um contrafilé bovino de primeira que talvez a gente só veja uma vez na vida!#nTem que ter um acompanhamento à altura!"
42020-191 = "Deixa isso para lá! Moe, acende logo esse fogo!#nNum churrasco na brasa, a força do fogo é tudo!"
42020-192 = "Sim, senhora, como quiser~"
42020-198 = "Próximo;Isca"
