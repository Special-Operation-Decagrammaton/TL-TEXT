[translation]
42020-1 = "Эпизод 2;Сон RABBIT"
42020-4 = "Председатель Генерального студенческого совета создала SRT и отряд FOX, чтобы Кивотос мог эффективнее бороться с..."
42020-6 = "SRT состоит из небольших элитных групп..."
42020-8 = "Справедливость - это путь к сохранению истины."
42020-11 = "Каким бы ни было препятствие, справедливость SRT не колеблется."
42020-12 = ""
42020-15 = "Старшие будто сияли прямо сквозь экран телевизора."
42020-16 = "Они воплощали сами идеалы SRT. Мы стремились к установленным ими невозможным стандартам."
42020-18 = "Их железная дисциплина не колебалась ни при каких обстоятельствах."
42020-19 = "Мы смотрели, как преступники один за другим падают перед ними."
42020-20 = "И какой бы страшной ни была миссия, на их лицах будто никогда не появлялось даже тени страха."
42020-22 = "Их непоколебимая справедливость... Ею невозможно было не восхищаться."
42020-23 = "Старшие... Они были нашей мечтой и однажды должны были стать нашим будущим."
42020-24 = "Для нас двигаться вперёд означало лишь идти за их тенями."
42020-26 = "Но однажды солнце исчезло, и больше не осталось тени, за которой можно идти."
42020-30 = "Однажды SRT стали мы."
42020-33 = "Мм..."
42020-34 = "Мияко! Ты проснулась."
42020-35 = "Доброе утро, Мию."
42020-36 = "Ещё рано... Думаю, завтрак пока не готов."
42020-37 = "Ты поздно вернулась с ночного патруля... Может, ещё отдохнёшь?"
42020-38 = "Спасибо, но я уже выспалась."
42020-41 = ""
42020-42 = "Не хочу тратить такой хороший день впустую. Наверняка даже бельё уже высохло."
42020-43 = "Моэ и Саки здесь?"
42020-44 = "Думаю, скоро вернутся... Они рано ушли искать еду..."
42020-45 = ""
42020-47 = ""
42020-51 = "Эй, все! Идите сюда, посмотрите!"
42020-52 = "По дороге обратно я немного разведала окрестности и случайно нашла огромную грибную колонию. Смотрите, какие собрала! Огромные, правда?!"
42020-53 = "С таким количеством... можно устроить грибной пир!"
42020-54 = ""
42020-56 = ""
42020-58 = "Хе-хе. А у меня тоже сюрприз."
42020-59 = "Та-дам! Свежие яйца! Мне их дали в одном магазине на нашем обычном маршруте."
42020-60 = "В благодарность за помощь с вредителями... Хотя, возможно, я просто испытывала новую дымовую бомбу в переулке, который считала пустым."
42020-61 = "Хи-хи-хи. Главное, что помогла гражданину в беде..."
42020-62 = "О-Ого! Столько свежей еды..."
42020-63 = ""
42020-65 = ""
42020-66 = "Отличная работа, вы обе. Похоже, сегодня будет полноценный завтрак. Я ещё достану консервированный хлеб из запасов."
42020-67 = "Хи-хи-хи. На меня всегда можно рассчитывать, когда нужно развести огонь."
42020-68 = "Я начну готовить! Хи-хи... Грибочки, грибочки~"
42020-69 = "Я в палатку с припасами! Скажите, если понадобится помощь."
42020-70 = ""
42020-72 = ""
42020-73 = "Я м-могу помочь с припасами!"
42020-74 = ""
42020-76 = ""
42020-78 = "Завтрак из яиц, хлеба и жареных грибов... Никогда не думала, что снова испытаем такую роскошь."
42020-79 = "Вот бы каждый день так есть..."
42020-80 = "Точно! Идеальная еда для идеального дня. Чувствуете этот ветерок?"
42020-81 = "С такой погодой и вкусной едой кто бы вообще не захотел остаться здесь навсегда, правда?"
42020-82 = ""
42020-85 = ""
42020-86 = "Эм... Вам не кажется, что мы слишком привыкли быть бездомными?"
42020-87 = "Не поспоришь... В последнее время мы больше занимаемся обустройством жизни, чем защитой справедливости."
42020-88 = "SRT должна быть лучшей из лучших! Мы из лучшей академии Кивотоса. Нам не было равных в снаряжении, подготовке... Ну, когда-то..."
42020-89 = "Хватит унывать. У нас столько вкусной еды, сколько можем пожелать. Кто захочет портить аппетит грустными разговорами?"
42020-90 = "П-Правда... Правда! Не будем искать подвох там, где всё хорошо. У нас всё отлично!"
42020-91 = ""
42020-93 = ""
42020-94 = "[ns] «Привет, отряд RABBIT!»"
42020-95 = "А. Сенсей [USERNAME]."
42020-96 = "Кто...? А. Всего лишь вы, Сенсей. Привет."
42020-97 = "А я всё думала, кто этот смутно знакомый человек..."
42020-98 = "[s1] «Рада меня видеть, Саки?»\n[s2] «Ах! Радости учительской жизни!»"
42020-99 = "З-Заткнитесь...! Я не пыталась скрыть радость или что-то такое! Уф!"
42020-100 = "З-Заткнитесь...! Ни один студент не радуется встрече с учителем вне школы!"
42020-101 = ""
42020-103 = ""
42020-105 = ""
42020-106 = ""
42020-107 = "Доброе утро, Сенсей. Не обращайте внимания на шум."
42020-108 = "Вы не предупредили о визите. Что-то срочное?"
42020-109 = "Мы опять навлекли на вас неприятности?"
42020-110 = "[s] «Нет-нет. Совсем наоборот.»"
42020-112 = "[ns] «Я просто хотел поблагодарить вас за помощь в недавних событиях.»"
42020-113 = "Недавних событиях..."
42020-114 = "Ах... Всё ещё кажется, будто это было вчера."
42020-119 = "Тогда я реально думала, что Кивотосу конец."
42020-120 = "Даже мне было страшно! Представляете? Мне — страшно из-за каких-то взрывающихся зданий!"
42020-121 = "Э-Это было куда серьёзнее пары зданий. Я хотела спрятаться сразу, как небо стало красным... н-но враги появлялись повсюду..."
42020-122 = "И самое главное... Все мои д-друзья сражались за Кивотос!"
42020-123 = "[s] «Ты права. Столько студентов объединились, чтобы защитить Кивотос...»"
42020-125 = "Хия-а!!!"
42020-126 = "Отряд RABBIT! Прибыли по запросу Сенсея о поддержке!"
42020-127 = "[ns3] «Кто знает, что бы случилось, если бы вы меня не спасли?»\n[ns4] «Без вас ничего бы не получилось.»"
42020-130 = ""
42020-132 = "Мы не ждём благодарности за выполнение долга."
42020-133 = "SRT с-сражается ради защиты граждан!"
42020-134 = "Пф. Думаете, мы пришли помогать именно вам? Мы бы всё равно там были!"
42020-135 = "Я просто хотела устроить БА-БАХ зданию Шале. Хи-хи-хи."
42020-136 = "[s] «Даже агентам SRT иногда нужна признательность.»"
42020-137 = ""
42020-139 = ""
42020-140 = "[ns] «Поэтому в благодарность я принёс горячую еду.»"
42020-141 = "Хе... Вообще-то мы уже идеально приспособились к новому образу жизни, так что еды у нас более чем достаточно."
42020-142 = "Мы примем ваши добрые намерения как благодарность, а горячую еду можете съесть сами."
42020-144 = "Именно. Наша награда — знать, что граждане в безопасности."
42020-145 = "Вообще, если ещё не завтракали, присоединяйтесь. У нас куча яиц и грибов."
42020-146 = "Сегодня я даже нашла симэдзи, а они здесь довольно редкие. Такие вкусные, что есть поговорка: «Мацутакэ — за аромат, симэдзи — за вкус»."
42020-147 = ""
42020-149 = ""
42020-151 = "[ns] «Ну, раз настаиваете...»"
42020-153 = "[ns] «...тогда, пожалуй, уберу эти стейки из первоклассной говяжьей вырезки...»"
42020-154 = ""
42020-155 = "Кхм...! Я-я вообще-то не закончила..."
42020-156 = "Да-да. Разумеется, нет большей награды, чем служить обществу. Н-Но..."
42020-157 = "Разве это не т-то самое ужасно дорогое мясо?"
42020-158 = "Даже до закрытия SRT я никогда не ела ничего настолько роскошного..."
42020-159 = "[s5] «Если не хотите, наверное, просто сделаю рамен...»\n[s6] «И что мне делать со всем лишним мясом? Может, в рамен?»"
42020-162 = "Ч-Что вы только что сказали?!"
42020-163 = "Вы хотите положить жирный стейк из премиальной вырезки в РАМЕН?"
42020-164 = "Вы идиот? Глупый человек?! У вас столько денег, что можете просто вываривать их в кастрюле?"
42020-165 = ""
42020-167 = ""
42020-168 = "[ns7] «Но его слишком много, чтобы я один всё пожарил и съел!»\n[ns8] «Но в Шале нет места для костра! Я не могу его пожарить!»"
42020-169 = "Н-Ну, если у вас действительно такая проблема..."
42020-170 = "Н-Ну, если у вас действительно такая проблема..."
42020-171 = "У нас есть кострище... и, пожалуй, мы могли бы помочь вам всё это съесть..."
42020-172 = ""
42020-174 = ""
42020-175 = "[ns] «Мои спасительницы! Тогда едим вместе!»"
42020-176 = ""
42020-177 = "Хорошо!"
42020-178 = "Нужна какая-нибудь сетка вместо решётки. Я найду."
42020-179 = "Я-я принесу дополнительные тарелки..."
42020-180 = ""
42020-182 = ""
42020-183 = "Так, к мясу есть гарнир? Может, картошка или лук...?"
42020-184 = "Уберите эти тупые грибы с дороги."
42020-185 = ""
42020-187 = ""
42020-189 = "...А что стало с «симэдзи — редкость, зато какой вкус!»?"
42020-190 = "Какой ещё симэдзи?! У нас первоклассная говяжья вырезка! Такая возможность бывает раз в жизни!"
42020-191 = "Сосредоточься, Моэ! Нужно немедленно разжечь огонь! Идеальная температура жарки — важнейшая часть процесса!"
42020-192 = "Есть, есть."
42020-198 = "Следующий эпизод;Приманка"
