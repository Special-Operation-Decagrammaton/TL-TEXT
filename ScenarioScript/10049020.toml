[translation]
10049020-1 = "Эпизод 2;Сузуми и Рейса вместе с Шимико"
10049020-2 = "Хорошо. Давайте я подведу итог, чтобы убедиться, что мы все понимаем ситуацию одинаково."
10049020-3 = "Эндо Шимико из Библиотечного комитета работала ночью и случайно подслушала разговор двух бандитов в шлемах."
10049020-4 = "Да-да, всё верно."
10049020-5 = "По словам Шимико, Банда шлемов Всплеска под руководством Комаказэ Рабу планирует устроить какой-то инцидент в Парке развлечений Пограничья."
10049020-6 = "О чём она сразу же сообщила Моризуки Сузуми из Отряда линчевателей."
10049020-7 = "Сузуми, полагаю, ты передала тех двоих бандитов в шлемах под стражу Рыцарей скорой помощи?"
10049020-8 = "Как только они придут в сознание, Отряд справедливости их допросит."
10049020-9 = "Ну... нет."
10049020-10 = "«Нет» — то есть ты ещё их не передала? Ты же наверняка не оставила их без присмотра на месте..."
10049020-11 = "«Нет» в смысле я вообще с ними не сталкивалась. Мы сразу пришли сюда доложить."
10049020-12 = "Здесь никто вообще не применял силу. Эти двое даже не знают о нашем существовании."
10049020-13 = "...Вот как?"
10049020-14 = "...Возможно, ТЕБЕ самой не помешал бы вызов Рыцарей скорой помощи, если плохо себя чувствуешь."
10049020-15 = "Нет, физически со мной всё нормально."
10049020-16 = "...Это дело относится к юрисдикции Отряда справедливости, поэтому я пришла доложить. Вот и всё."
10049020-17 = "Что?"
10049020-18 = ""
10049020-20 = ""
10049020-21 = ""
10049020-22 = "...Почему ты смотришь на календарь?"
10049020-23 = "А, ничего. Простите."
10049020-24 = "(Сегодня не первое апреля...)"
10049020-25 = "Понимаю. Однако..."
10049020-26 = "К сожалению, Отряд справедливости не может официально вмешаться в это дело."
10049020-27 = "Что? Почему...?"
10049020-28 = "..."
10049020-29 = "Я ценю вашу помощь и инициативу. Проблема в месте."
10049020-30 = "У Парка развлечений Пограничья... сложная ситуация с юрисдикцией."
10049020-31 = "Но он ведь находится в районе Тринити, разве нет? Это же ваша территория?"
10049020-32 = "Главный вход находится в Тринити, но половина объектов, включая задние ворота, технически расположена в Геенне."
10049020-33 = "Иными словами, сам парк стоит прямо на границе, наполовину там и наполовину здесь."
10049020-34 = "Даже если Отряд справедливости вмешается как исполнительный орган Тринити, мы потеряем любые полномочия, как только подозреваемые перейдут на территорию Геенны."
10049020-35 = "К сожалению, это очень удобный путь для всяких неприятностей."
10049020-36 = "Вы ведь не просто придумываете оправдания, чтобы от нас отмахнуться?"
10049020-37 = "Вовсе нет. Более того, мы уже получили несколько похожих сообщений."
10049020-38 = "Особенно нас беспокоит участие «Комаказэ Рабу». Тринити не может не относиться к ней настороженно."
10049020-39 = "Не ожидала, что Отряд справедливости будет так переживать из-за капитана какой-то мелкой Банды шлемов."
10049020-40 = "Она... крайне непредсказуема, мягко говоря."
10049020-41 = "..."
10049020-43 = "...?"
10049020-44 = "Если подвести итог, нас действительно беспокоит проблема, о которой вы сообщили."
10049020-45 = "И даже если бы нам каким-то образом удалось удержать всё в рамках юрисдикции Тринити..."
10049020-46 = "...сейчас Отряд справедливости испытывает нехватку людей и перегружен работой. Мобилизовать достаточно бойцов для такой задачи будет... мягко говоря, сложно."
10049020-47 = "Поэтому у меня есть предложение."
10049020-48 = "Шимико, как свидетель, ты, полагаю, запомнила внешность и голоса тех бандитов в шлемах."
10049020-49 = "Д-Да!"
10049020-50 = "Хорошо. А Сузуми, я знаю, что ты весьма способна."
10049020-51 = "..."
10049020-53 = "Не могли бы вы вдвоём отправиться туда и понаблюдать за ситуацией?"
10049020-54 = "Что?"
10049020-55 = "Не вступайте с ними в прямой контакт и не пытайтесь задерживать... но, учитывая обстоятельства, пожалуйста, присмотрите за ними. Так будет лучше всего."
10049020-56 = "Как только мы подтвердим ваши наблюдения и определим цель, вмешаемся как можно скорее."
10049020-57 = "...То есть вы не выйдете на передовую, пока мы вас не вызовем?"
10049020-58 = "Верно. Если они увидят нас на патруле, скорее всего, разбегутся."
10049020-59 = "Не говоря уже о возможных конфликтах с Геенной."
10049020-60 = "Поможете нам?"
10049020-61 = "И можете попросить помощи со стороны. В разумных пределах."
10049020-63 = "Ну, теперь вы так говорите, но..."
10049020-64 = "...Хм."
10049020-65 = "Разумеется, я обещаю, что Отряд справедливости будет сотрудничать и поддержит вас настолько, насколько сможет."
10049020-66 = "Помните, ваша задача — только оценить ситуацию. Ради вашей безопасности, пожалуйста, не вмешивайтесь, что бы ни увидели."
10049020-69 = ""
10049020-70 = ""
10049020-71 = "А! Сузуми!"
10049020-72 = ""
10049020-74 = ""
10049020-76 = "И Шимико тоже!"
10049020-77 = "Эй, вы только что вышли из читального зала Отряда справедливости! О чём вы там говорили, а?"
10049020-79 = "..."
10049020-80 = "..."
10049020-82 = "...Ч-Что?"
10049020-88 = "Комната отдыха Библиотечного комитета"
10049020-89 = "Правда?!"
10049020-90 = "Я понимаю их позицию."
10049020-91 = "У Отряда справедливости наверняка сейчас дел по горло."
10049020-92 = "Обычно они не просят о такой большой помощи."
10049020-93 = "Значит, дело действительно важное."
10049020-94 = "А что, если всё перерастёт в большой бой?"
10049020-95 = "Мы с Сузуми можем справиться с КУЧЕЙ бандитов в шлемах, но не со СЛИШКОМ большой кучей, если нас всего двое..."
10049020-97 = "В смысле трое!"
10049020-98 = "Что?"
10049020-99 = "У вас есть я, сертифицированная суперзвезда Отряда линчевателей!"
10049020-100 = "«Сертифицированная», да? Вы теперь официальный клуб?"
10049020-101 = "Нет, мы всё те же старые самопровозглашённые линчеватели. Никаких пафосных штучек Отряда справедливости."
10049020-102 = "Но, Рейса, ты и правда была бы огромной помощью."
10049020-103 = "Если хочешь участвовать, предложение принято."
10049020-104 = "Есть!!"
10049020-105 = "Шимико, у тебя наверняка куча работы в Библиотечном комитете, так что спасибо, что тоже помогаешь."
10049020-106 = "Ой, пожалуйста, не стоит!"
10049020-107 = "Скорее это я должна вас благодарить за то, что вы серьёзно отнеслись к моему сообщению!"
10049020-108 = "Поэтому я помогу всем, чем смогу!"
10049020-109 = "Хорошо! Давайте составим план!"
10049020-111 = "Вот что мы пока знаем..."
10049020-112 = "По данным Отряда справедливости, Банда шлемов Всплеска держится вокруг своего лидера, Комаказэ Рабу. По сравнению с другими их немного."
10049020-113 = "Однако информация Шимико указывает на то, что в Парке развлечений Пограничья соберутся несколько Банд шлемов."
10049020-114 = "Из-за чего их ОБЩЕЕ количество трудно определить."
10049020-115 = "То есть мы не знаем ни сколько их искать, ни откуда они появятся."
10049020-116 = "Верно. И ещё раз: Отряд справедливости просит нас лишь подтвердить разведданные. Прямого столкновения следует по возможности избегать."
10049020-117 = "Конечно, лучше всего для этого подойдёт проникновение..."
10049020-118 = "Но если мы все переоденемся обычными посетителями и растворимся в толпе, будет трудно следить друг за другом."
10049020-120 = "А что, если переодеться сотрудниками?"
10049020-121 = "Может сработать, но другие сотрудники могут заметить, что мы не свои, и начать задавать вопросы."
10049020-122 = "Хм, возможно, придётся придумать что-то ещё. Хотя времени у нас почти нет..."
10049020-123 = "А пока вот брошюра, которую нам дали. На обратной стороне карта, так что давайте все с ней ознакомимся."
10049020-124 = "Спасибо. Так, здесь зоопарк и озеро... Вокруг стены, тут и там ворота."
10049020-125 = "Фуфу, прямо сказочный мир."
10049020-127 = "О-о, о-о!"
10049020-128 = ""
10049020-130 = ""
10049020-131 = "Эм, Рейса? Ты ведь знаешь, что карта с другой стороны?"
10049020-132 = "Я придумала!"
10049020-133 = "Ты придумала..."
10049020-134 = "Что?"
10049020-138 = "Парк развлечений Пограничья, территория Тринити"
10049020-140 = "Эх, я только что купила этот шарик, а он уже сдулся!"
10049020-141 = "Крышка от ведёрка с попкорном где-то потерялась! А-а!"
10049020-142 = "А-а-а-а!"
10049020-143 = "Можно мне ещё один? Пожалуйста?"
10049020-145 = ""
10049020-146 = "Ого!!"
10049020-147 = "Сузуми, посмотри, сколько здесь людей!"
10049020-148 = "Ну же, выходи уже!"
10049020-149 = "Я-я ещё морально не готова..."
10049020-150 = "Если опоздаем, можем их упустить!"
10049020-151 = "Ладно! Выхожу...!"
10049020-152 = ""
10049020-154 = ""
10049020-155 = ""
10049020-156 = ""
10049020-158 = "Ух ты, Сузуми! Не стесняйся! Ты отлично выглядишь!"
10049020-159 = "(Ух...)"
10049020-160 = "(Как до этого дошло...?)"
