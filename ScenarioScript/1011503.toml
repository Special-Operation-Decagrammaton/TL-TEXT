[translation]
1011503-1 = "Особая тренировка 2"
1011503-2 = ""
1011503-3 = "...Вот почему я хочу потренироваться подавать!"
1011503-4 = "[ns1] «Погоди-погоди-погоди.»\n[ns2] «Давай вернёмся на шаг назад...»"
1011503-7 = "Хм? Обычно я играю питчером?"
1011503-8 = "Ну, нет. Есть несколько по-настоящему выдающихся игроков, которые умеют и подавать, и отбивать..."
1011503-9 = "Их называют двусторонними игроками."
1011503-10 = "Но мне до такого уровня ещё очень далеко. По крайней мере пока."
1011503-11 = "Надеюсь, когда-нибудь и я смогу так играть!"
1011503-12 = "Но если я посмотрю на бэттера глазами питчера, возможно, это поможет мне лучше отбивать."
1011503-13 = "И тогда мне будет проще угадывать следующую подачу."
1011503-14 = "А если со временем я научусь предсказывать подачи, то смогу заранее подстраивать под них замах."
1011503-15 = "Это называется «угадывать подачу.»"
1011503-16 = "Тогда, естественно, вырастет и процент попаданий, И процент силовых ударов, а ПОТОМ..."
1011503-17 = "Тогда я смогу выбивать хоум-раны, верно?!"
1011503-18 = "[s] «Теперь, когда ты так сказала... да, звучит логично!»"
1011503-19 = "Вот именно! Значит, так и поступим!"
1011503-20 = "С сегодняшнего дня начинаю тренироваться как питчер!"
1011503-22 = "И вот Рэй снова решительно вышла на поле, но..."
1011503-23 = ""
1011503-24 = ""
1011503-25 = ""
1011503-26 = ""
1011503-27 = ""
1011503-28 = "Попадание мячом! Бэттер, на базу!"
1011503-29 = "Угх...! Ладно, я слишком сосредоточилась на скорости. Слишком сильно зажала плечи."
1011503-30 = "В следующий раз точно получится!"
1011503-32 = ""
1011503-33 = ""
1011503-35 = "Болл! Бэттер получает базу!"
1011503-36 = "Не может быть, я ТОЧНО целилась прямо по центру!"
1011503-37 = ""
1011503-39 = ""
1011503-40 = ""
1011503-41 = "...Нет. Питчер должен сохранять спокойствие... Надо вдохнуть и прийти в себя!"
1011503-43 = ""
1011503-44 = ""
1011503-45 = ""
1011503-47 = ""
1011503-48 = "Чистое попадание! Хоум-ран!"
1011503-49 = "Отлично, сама я хоум-раны выбивать не умею, зато пропускать их — пожалуйста?!"
1011503-50 = "Кажется, мои подачи слишком предсказуемы. Нельзя так затягивать розыгрыш!"
1011503-52 = ""
1011503-53 = ""
1011503-54 = ""
1011503-55 = ""
1011503-56 = ""
1011503-57 = ""
1011503-58 = "Попадание мячом. Левая рука тренировочного робота-бэттера повреждена."
1011503-59 = "Угх..."
1011503-61 = ""
1011503-62 = ""
1011503-63 = ""
1011503-64 = "Попадание мячом. Брюшная часть тренировочного робота-бэттера повреждена."
1011503-65 = "Пожалуйста...!"
1011503-69 = "Попадание мячом. Тренировочный робот-бэттер получил удар в голову. Не волнуйтесь. Повреждена только основная камера."
1011503-70 = ""
1011503-78 = "...Доступных тренировочных роботов-бэттеров больше не осталось. Завершить сегодняшнюю тренировку?"
1011503-79 = "И-и...!"
1011503-80 = ""
1011503-83 = ""
1011503-84 = "Почему у меня не получается?!"
1011503-85 = "[ns] «С-Спокойно, Рэй! Ты ведь вообще не привыкла подавать!»"
1011503-86 = "...*шмыгает носом*"
1011503-87 = "Сенсей? У тебя ведь есть хорошая идея для тренировки, да? Есть же?"
1011503-88 = "Я сама ничего придумать не могу, так что подойдёт всё, что предложишь..."
1011503-89 = "[ns] «Хм... Как думаешь, что прежде всего нужно питчеру?»"
1011503-90 = "Ну, разумеется, контроль мяча."
1011503-91 = "Говорят: «Бросай страйки — домашняя база ведь никуда не двигается.»"
1011503-92 = "Ещё говорят, что к крученым подачам стоит переходить только после того, как научишься точно контролировать фастбол."
1011503-93 = "[s3] «Контроль мяча, контроль мяча...»\n[s4] «Ладно, давай тренировать точность!»"
1011503-96 = "Что?!"
1011503-97 = "Н-Но как...?"
1011503-99 = ""
1011503-100 = ""
1011503-101 = "Мы опять пришли в игровой зал?!"
1011503-102 = "Не думаю, что ещё одна тренировка чувства ритма мне поможет..."
1011503-103 = "А? Тут есть что-то ещё? Например?"
1011503-104 = ""
1011503-106 = ""
1011503-108 = "Это... дротики? Так они называются?"
1011503-109 = "Ага. Значит, это дротики, я бросаю их в мишень и пытаюсь набрать как можно больше очков?"
1011503-110 = "Что ж, это может помочь с концентрацией и, наверное, улучшить контроль руки. Ладно, попробую!"
1011503-111 = ""
1011503-112 = "Хия!"
1011503-113 = "Ещё одно попадание в яблочко! Уже пять подряд! Остался один дротик."
1011503-114 = "Чувствую, что и правда отлично сосредоточилась. Ладно, последний..."
1011503-116 = "Эй, смотрите! Она только что пять раз подряд попала прямо в яблочко!"
1011503-117 = "У неё там вообще ОСТАЛОСЬ место для ещё одного попадания?"
1011503-118 = "*вдох*"
1011503-119 = "Хия!"
1011503-120 = ""
1011503-123 = "Все броски точно в яблочко! Поздравляем! Вы установили сегодняшний рекорд!"
1011503-124 = ""
1011503-126 = ""
1011503-127 = "[ns5] «Вот это да, Рэй!»\n[ns6] «Может, у тебя просто врождённый талант к точным движениям.»"
1011503-130 = "..."
1011503-131 = "Нет, это не то!"
1011503-132 = "[s] «Ч-Что ты имеешь в виду?»"
1011503-133 = "Эти дротики слишком лёгкие по сравнению с бейсбольными мячами!"
1011503-135 = "Для тренировки контроля мяча мне нужно..."
1011503-136 = "...Хм, что-нибудь умеренно тяжёлое, что сложно бросить, но всё-таки возможно..."
1011503-137 = "!"
1011503-138 = "Сенсей, придумала!"
1011503-139 = "[s] «Ага! Что именно?»"
1011503-140 = "Нам нужен фрисби!"
1011503-141 = "[s] «А...?»"
1011503-143 = ""
1011503-144 = "Я брошу его так, чтобы он описал большой круг и вернулся обратно!"
1011503-145 = ""
1011503-147 = ""
1011503-148 = "[ns] «Мы сейчас точно говорим о фрисби, а не о бумеранге?»"
1011503-149 = ""
1011503-150 = ""
1011503-151 = "С фрисби это ТОЖЕ возможно, если достаточно хорошо его контролировать!"
1011503-152 = ""
1011503-153 = "Нужно бросить так, чтобы он правильно подхватил воздух!"
1011503-154 = ""
1011503-156 = ""
1011503-157 = "[ns] «Звучит уже скорее как волшебный мяч из какой-нибудь старой манги...»"
1011503-158 = ""
1011503-159 = "Нет, поверь! При достаточном контроле это возможно!"
1011503-167 = ""
1011503-168 = "Ты тоже сможешь, Сенсей!"
1011503-169 = "А? Спрашиваешь, зачем тебе участвовать? Ну, слушай..."
1011503-170 = "Эта тренировка может открыть перед нами кучу возможностей. Она даже считается тренировкой полевого игрока!"
1011503-171 = "Я уступил напору Рэй и бросил фрисби."
1011503-172 = ""
1011503-175 = "Хорошо! Я поймаю!"
1011503-176 = ""
1011503-178 = ""
1011503-179 = "Хия-я-я!!"
1011503-180 = ""
1011503-182 = ""
1011503-183 = "Поймала, Сенсей! Но нет... Нет, тебе нужно бросать выше!"
1011503-184 = "[s] «То есть над твоей головой?»"
1011503-185 = "Именно так летят верховые мячи! Давай ещё!"
1011503-186 = ""
1011503-190 = "Спасибо! А теперь что...? Хм..."
1011503-191 = ""
1011503-193 = ""
1011503-194 = "Хия!"
1011503-195 = "Видел? Я подпрыгнула и поймала! Ладно, а В ЭТОТ раз..."
1011503-196 = "...брось как можно дальше и немного в сторону!"
1011503-197 = "[s] «Но тогда ты ведь можешь не поймать.»"
1011503-198 = "Мячи не всегда летят туда, куда тебе хочется! Давай!"
1011503-199 = ""
1011503-202 = "Ладно, я готова...!"
1011503-203 = ""
1011503-205 = ""
1011503-206 = "Эй, гляньте туда. Это Сенсей из Шале обращается со студентом как с собакой?"
1011503-207 = "Кидает фрисби, заставляет её ловить, потом бросает в другую сторону и гоняет за ним..."
1011503-208 = "То есть про Сенсея всякое рассказывают, но это... Ничего себе."
1011503-209 = ""
1011503-212 = "[ns] «И как мне теперь исправлять свою репутацию...?»"
1011503-213 = ""
1011503-214 = "Хм? Ты что-то сказал, Сенсей?"
