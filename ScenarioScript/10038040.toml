10038040-1 = "Эпизод 4;Между прошлым и настоящим"
10038040-3 = ""
10038040-4 = ""
10038040-7 = "Какого...?"
10038040-8 = "У меня так кружится голова... Я-я едва могу дышать...!"
10038040-9 = ""
10038040-11 = ""
10038040-12 = "......"
10038040-13 = "Отдохни немного. Этот аромат тебя не убьёт."
10038040-14 = ""
10038040-18 = "Так вот какой у тебя был план возвращения...?!"
10038040-19 = "И пока Саи нет... Ах ты хитрая..."
10038040-20 = ""
10038040-23 = ""
10038040-24 = ""
10038040-25 = ""
10038040-28 = "Горы и реки остались, а людей нигде не видно."
10038040-29 = "Улицы пусты, и не слышно ни единого шёпота."
10038040-30 = "Кех-хех-хех-хех..."
10038040-31 = ""
10038040-34 = ""
10038040-35 = "Всё готово."
10038040-36 = "Шаньхайцзин, Общество Восточной Алхимии..."
10038040-37 = "Наконец-то я вернулась."
10038040-38 = "Прошу простить за столь скромную встречу."
10038040-39 = "Неважно. Идём."
10038040-40 = ""
10038040-42 = ""
10038040-46 = "Как же я скучала по тебе, Общество Восточной Алхимии."
10038040-47 = "Всё изменилось, и всё же осталось прежним."
10038040-48 = "Что дальше? Сразу отправитесь «туда»?"
10038040-49 = "Да, идём. Это всегда было моей единственной целью."
10038040-50 = "Понятно. Я могу отвести вас прямо туда."
10038040-56 = "Ты с самого начала держала всё это в тайне?"
10038040-57 = "Единственной сложностью было не дать Якуши Сае ничего заподозрить."
10038040-58 = "Кех-кех-кех... Надо отдать ей должное, она быстро всё замечает."
10038040-59 = "И всё же тебе удалось скрыть от неё целый этот объект. Хорошая работа."
10038040-60 = "Вы мне льстите."
10038040-61 = "...И вот я здесь. Наконец-то вернулась."
10038040-62 = "Это место действительно воплощает само Общество Восточной Алхимии. Здесь собрано всё, чем я являюсь..."
10038040-64 = "Уверена, вы найдёте ему хорошее применение. Общество Восточной Алхимии снова ваше."
10038040-65 = "Все лекарства и оборудование сохранили в том же виде, в каком они были, когда вы покинули Шаньхайцзин."
10038040-67 = "Превосходно. Тогда приступим?"
10038040-68 = ""
10038040-70 = ""
10038040-71 = "Закончим зелье, которое начали."
10038040-79 = "*тяжело дышит* *тяжело дышит*"
10038040-80 = "Ты уже запыхалась? И называешь себя офицером Генрюмона?"
10038040-81 = "Хотя, кажется, я уже видела, как у тебя раньше заканчивались силы."
10038040-82 = "Н-Не начинай! Меня внезапно вызвали посреди ночи! Тут ничего не поделаешь!"
10038040-83 = "Меня тоже."
10038040-84 = "Угх... О чём только думала президент? Поставить меня в пару именно с НЕЙ?"
10038040-85 = "Я вообще-то тебя слышу... И ещё раз: хочешь быть офицером — выполняй приказы президента."
10038040-86 = "Уж от ТЕБЯ-то я точно не обязана это выслушивать!"
10038040-90 = "Итак, пока мы знаем только то, что на Общество Восточной Алхимии напали. Больше никаких подробностей."
10038040-91 = "Здесь определённо атмосфера совсем не такая, как обычно..."
10038040-92 = ""
10038040-95 = ""
10038040-98 = ""
10038040-100 = "...мягко говоря."
10038040-101 = "Наёмники Чёрного Рынка. Им вообще нельзя находиться рядом с Шаньхайцзином. Что они здесь делают?"
10038040-102 = ""
10038040-104 = ""
10038040-106 = ""
10038040-108 = "Эй, больно!"
10038040-109 = "Знаешь, мне НРАВИТСЯ, когда они начинают именно так. Голова сразу проясняется."
10038040-110 = "...У тебя голова мясом набита."
10038040-111 = "...А у тебя она забита фильмами."
10038040-112 = ""
10038040-115 = "Вот же придурки..."
10038040-116 = ""
10038040-118 = ""
10038040-120 = ""
10038040-121 = "...МЫ ВООБЩЕ-ТО РАЗГОВАРИВАЕМ!"
10038040-122 = ""
10038040-131 = ""
10038040-132 = "Доклад от главных ворот. Нарушители прибыли."
10038040-133 = ""
10038040-135 = ""
10038040-136 = ""
10038040-137 = "Проследи, чтобы эти войска с Чёрного Рынка выиграли нам немного времени."
10038040-138 = "Они уже этим занимаются."
10038040-139 = "(Хотя мне всё же не нравится, что здесь столько чужих бойцов...)"
10038040-140 = "Ты нервничаешь. Кех-хе..."
10038040-141 = ""
10038040-143 = ""
10038040-144 = "Н-нет, я просто...!"
10038040-145 = "Хаос подобен химической реакции. Иногда именно он приводит к прогрессу."
10038040-146 = "Именно этого Шаньхайцзину так не хватало."
10038040-147 = "Стоя на месте, вперёд не двинешься. Иногда нужен толчок в правильном направлении."
10038040-148 = ""
10038040-151 = ""
10038040-152 = "......"
10038040-153 = "Осталось недолго. Первичная формула будет готова через несколько часов."
10038040-154 = "Если ты могла закончить всё так быстро, зачем было так долго ждать?"
10038040-155 = "О, ты не знала? Пожалуй, могу рассказать."
10038040-156 = ""
10038040-158 = ""
10038040-159 = "Потому что это зелье можно приготовить только здесь."
10038040-160 = "Это... связано с каким-то фэншуем?"
10038040-161 = "Нет. Просто именно здесь Общество Восточной Алхимии хранит все свои лекарственные тайны, всю свою историю."
10038040-162 = "И только здесь можно найти десятитысячелетний женьшень в его наиболее естественном виде."
10038040-163 = ""
10038040-165 = ""
10038040-166 = "У Саи его тут было больше, чем она вообще знала, куда девать. Кех-хе..."
10038040-170 = ""
10038040-171 = ""
10038040-174 = "Это хотя бы почти все?"
10038040-175 = ""
10038040-178 = ""
10038040-179 = "...Нет, похоже, это был лишь авангард."
10038040-180 = ""
10038040-182 = ""
10038040-185 = ""
10038040-187 = "...Я ненавижу абсолютно всё в этой ситуации."
10038040-188 = "Как столько чужих бойцов смогли проникнуть в Шаньхайцзин так, что никто не заметил?!"
10038040-189 = "Может, все были заняты другими вещами, например ограничениями на Променаде."
10038040-190 = ""
10038040-192 = ""
10038040-193 = "На НЕСКОЛЬКО ДНЕЙ! Неужели это НАСТОЛЬКО серьёзная проблема?"
10038040-194 = "Поставь себя на наше место! Ты представляешь, сколько продаж мы теряем, если закрываемся хотя бы на ОДИН день?!"
10038040-195 = ""
10038040-198 = ""
10038040-200 = "...Мне нечего на это ответить."
10038040-201 = "Как бы то ни было, сейчас происходящее здесь куда важнее."
10038040-202 = ""
10038040-204 = ""
10038040-205 = "Придётся пойти в лоб и прорваться. Сможешь не отставать?"
10038040-206 = ""
10038040-208 = ""
10038040-209 = "МНЕ не отставать от ТЕБЯ? Неправильно вопрос ставишь."
10038040-210 = ""
10038040-212 = ""
10038040-214 = "Вот это настрой. ПОГНАЛИ!"
