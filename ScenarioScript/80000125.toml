[translation]
80000125-1 = "Подача"
80000125-2 = "Итак, Сенсей. Чем вообще изначально был День святого Валентина?"
80000125-3 = "[s] «Ты спрашиваешь в прошедшем времени... Как глубоко...»"
80000125-4 = "Полагаю, правда, что он начинался как праздник."
80000125-5 = "Этот день возник из сочетания легенд как минимум о трёх религиозных святых."
80000125-6 = "Есть и древняя лирическая поэма, где говорится, что 14 февраля все птицы отправляются искать себе пару."
80000125-7 = "Но в наши дни его смысл выродился в маркетинговые схемы кондитерских компаний."
80000125-8 = "И, кажется, когда-то это был день, когда общество обязывало дарить шоколад не только возлюбленным, но и семье, соседям, друзьям и коллегам. Хитрость для роста продаж."
80000125-9 = "Ведь это естественным образом в разы увеличивало количество шоколада, которое покупал один человек."
80000125-10 = "Со временем его смысл и масштабы в основном оформились в то, что мы видим сегодня."
80000125-11 = "[s] «П-Понятно?»"
80000125-12 = "В любом случае, если рассуждать логически, раньше я не видела причин праздновать настолько намеренно сконструированный праздник."
80000125-13 = "Поскольку это была иррациональность в чистом виде."
80000125-14 = "Да. Крайняя иррациональность."
80000125-15 = "[s] «И?»"
80000125-16 = "И зачем тогда я специально позвала вас в своё убежище, чтобы обсуждать это?"
80000125-17 = "..."
80000125-18 = "В последнее время я пересматриваю вещи, которые раньше отвергала как иррациональные."
80000125-19 = "Я подумала, что, возможно... просто неправильно понимала их логику."
80000125-20 = "В конце концов, если нечто существует, значит, в нём уже есть причина."
80000125-21 = "Поэтому я решила по очереди попробовать то, что раньше отвергала."
80000125-22 = "И ещё подумала, что в некотором смысле именно вы виноваты в том, что я стала так думать."
80000125-23 = "[s] «Значит, сначала проверишь это на мне...»"
80000125-24 = "Именно. Что посеяли, то и пожнёте, Сенсей. Лучше думать об этом так."
80000125-25 = "Продолжу предыдущую тему. Я изучала прошлые примеры празднования Дня святого Валентина."
80000125-26 = "..."
80000125-27 = "И там полный беспорядок. Я не ошибалась, считая его воплощением иррациональности."
80000125-28 = "Никакой последовательности и никакой значимой статистической закономерности."
80000125-29 = "Одни утверждают, что шоколад обязательно должен быть домашним."
80000125-30 = "Другие настаивают, что отдельному человеку не победить пищевые технологии, а значит, правильный ответ — дорогой магазинный продукт."
80000125-31 = "Есть даже те, кто пытается иронично подчеркнуть особенность подарка, выбрав самый обычный шоколад."
80000125-32 = "Я также слышала, что можно покрыть тело шоколадом и обвязаться лентой—"
80000125-33 = "[s] «Последнее категорически нет!!»"
80000125-34 = "Т-Так? Понятно..."
80000125-35 = "В любом случае, из исследования я вывела, что этот праздник — абсолютный хаос без какой-либо стандартизации."
80000125-36 = "Поэтому я попыталась прийти к разумному выводу, который смогла бы принять."
80000125-37 = "Во-первых, я исключила дорогие магазинные изделия. В конце концов, они заранее изготовлены, а значит, компромиссы неизбежны."
80000125-38 = "Но одновременно признаю: отдельному человеку трудно соперничать с результатами промышленной пищевой инженерии."
80000125-39 = "Поэтому я выбрала следующий подход."
80000125-40 = "Шоколад — пищевой продукт, получаемый сочетанием какао-массы, молочных продуктов, сахара и других специй, состав которых компании держат в секрете."
80000125-41 = "Разумеется, главный ингредиент, определяющий качество шоколада, — само какао."
80000125-42 = "Учитывая это, сначала я подготовила какао-бобы сорта Криолло, на который приходится около 5% мирового производства."
80000125-43 = "Посредством ферментации, обжарки, измельчения, прессования, смешивания и застывания... я восстановила рецепт большинства дорогих шоколадов на рынке методом обратной инженерии."
80000125-44 = "Затем завершила процесс, встроив всё это в «Chocolate Avant Guard», который спроектировала и изготовила сама."
80000125-45 = "Форма шоколада — ещё одна вещь, которую я считаю важной..."
80000125-46 = "..."
80000125-47 = "Я подумала, что через неё должна выразить что-то о себе."
80000125-48 = "Что-то, благодаря чему я стала той, кто я есть сейчас..."
80000125-49 = "И в каком-то смысле то, что значит вручить вам нечто, выражающее и описывающее меня."
80000125-50 = "И вот... результат этой работы."
80000125-51 = ""
80000125-53 = ""
80000125-55 = "[ns] «Это же эмблема Миллениум...?»"
80000125-56 = "Верно."
80000125-57 = "Уверена, без научной школы Миллениум я бы не стала той, кто я есть."
80000125-58 = "Я много думала о том, каким человеком была бы, поступи я в другую академию."
80000125-59 = "Геенна, Тринити, Хяккияко, Красная Зима, Шанхайцзин, Хайлендер, Вайлдхант, Odyssey и бесчисленные другие академии..."
80000125-60 = "Уверена, в каждой из них существовала бы своя версия меня как студенты."
80000125-61 = "Но если бы не научная школа Миллениум, нынешней Цукацуки Рио здесь бы не было."
80000125-62 = "Поэтому это... в некотором смысле нынешняя я."
80000125-63 = "Я решила, что если и дарить вам шоколад, то только в такой форме."
80000125-64 = "Это был мой рациональный выбор после логического анализа всех переменных и возможностей."
80000125-65 = "..."
80000125-66 = "Странно..."
80000125-67 = "[s] «Что?»"
80000125-68 = "Я была уверена, что получила логичный результат посредством рациональных решений..."
80000125-69 = "Хотя процесс производства придумала я, выполнение полностью поручила «Chocolate Avant Guard»..."
80000125-70 = "[s] «И?»"
80000125-71 = "Сенсей. Если каждый этап процесса основывался на логике и рациональности... то есть эмоции были полностью исключены..."
80000125-72 = "...тогда для эмоций вообще не должно было остаться места, верно?"
80000125-73 = "[s] «Наверное... можно посмотреть и так?»"
80000125-74 = "Да. Верно. Однако..."
80000125-75 = "..."
80000125-76 = "Почему-то прямо сейчас я..."
80000125-77 = "Мне очень неловко."
80000125-78 = "Разве это не странно, Сенсей?"
80000125-79 = "Сколько бы я ни перепроверяла, процесс был создан так, чтобы не оставлять места этому элементу. Но именно он в итоге занял место конечного продукта."
80000125-80 = "Разве это не... возникновение чего-то из ничего?"
80000125-81 = "Если бы такое произошло внутри ускорителя частиц, я бы поняла."
80000125-82 = "Но приготовление шоколада... как ни посмотри, событие материального мира. Разве нет?"
80000125-83 = "Неужели я снова что-то упустила...?"
80000125-84 = "[s1] «Уверен, всё было не так.»\n[s2] «Как бы то ни было, я благодарен за твои чувства, Рио.»"
80000125-87 = "...!"
80000125-88 = "Что вы со мной сделали, Сенсей?!"
80000125-89 = "От этих слов мне стало в два раза... нет, в десять раз неловче...!"
80000125-90 = "Кем я вообще являюсь для вас?!"
80000125-91 = "[s3] «Ну-ну. Успокойся...»\n[s4] «И ещё раз спасибо, Рио. Я ценю этот шоколад.»"
80000125-94 = "У-Ух...!"
80000125-95 = "..."
80000125-96 = "Х-Хорошо. Если вы так думаете..."
80000125-97 = "..."
80000125-98 = "И вам спасибо, Сенсей."
