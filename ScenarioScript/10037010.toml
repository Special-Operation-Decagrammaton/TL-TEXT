[translation]
10037010-1 = "Эпизод 1;Вымой руки и приведи себя в порядок"
10037010-4 = ""
10037010-6 = ""
10037010-7 = "Президент идёт!"
10037010-8 = "Президент идёт!"
10037010-9 = ""
10037010-11 = ""
10037010-14 = ""
10037010-15 = "Спасибо, что так быстро откликнулись на наш вызов, Сенсей."
10037010-16 = "[s1] «Конечно. Мне редко присылают настолько вежливые и изящно написанные сообщения.»\n[s2] «Что-то подсказывало мне, что это дело лучше не игнорировать.»"
10037010-19 = "Вот как? Я не знала, что наше сообщение чем-то отличается от остальных."
10037010-20 = "Но вернёмся к делу. Я позвала вас сюда, потому что должна попросить об одолжении от имени Генрюмона."
10037010-22 = "..."
10037010-23 = "..."
10037010-25 = "Как вы, возможно, уже догадались, это не личное дело. Это официальный запрос от президента Генрюмона к Сенсею из Шале."
10037010-26 = "В ближайшем будущем Шаньхайцзин проведёт встречу по обмену с Красной Зимой."
10037010-28 = "Значит, она и правда говорила серьёзно..."
10037010-29 = "Уверена, у президента есть свои причины..."
10037010-31 = "...Мы находимся в присутствии президента. Следите за языком."
10037010-32 = ""
10037010-35 = ""
10037010-37 = "..."
10037010-38 = "[s] «(Похоже, здесь нельзя говорить свободно...)»"
10037010-39 = "(Я это предвидела. Другого выбора нет...)"
10037010-40 = ""
10037010-42 = ""
10037010-43 = "Сенсей. Прошу пройти со мной в мой кабинет."
10037010-44 = ""
10037010-47 = ""
10037010-48 = "Г-Госпожа?! Прошу, подумайте ещё раз! Впустить постороннего в Риккагаку — это...!"
10037010-49 = "Да! Такое нарушает сами основы наших традиций и власти... Это может даже поставить под угрозу безопасность и тщательно охраняемые тайны Генрюмона!"
10037010-51 = "Однако в ваших словах я слышу не только беспокойство."
10037010-52 = "Вы хотите сказать, что Сенсей из Шале — совершенно посторонний? Если именно это вы имеете в виду, то на каком основании делаете подобные заявления?"
10037010-54 = "...!"
10037010-55 = "Э-Это...!"
10037010-57 = "Мы уже получали помощь Сенсея во время инцидента с десятитысячелетним женьшенем. Это официально зафиксированный факт."
10037010-58 = "Более того, отплатить добром за добро — одна из давних традиций Шаньхайцзина, разве нет?"
10037010-60 = "П-Прошу простить нашу дерзость!"
10037010-61 = "Мы преклоняемся перед вашей мудростью!"
10037010-62 = ""
10037010-64 = ""
10037010-66 = "Прошу следовать за мной, Сенсей."
10037010-67 = "Да. Насчёт этого..."
10037010-68 = "Я лично провожу Сенсея внутрь. Можешь не беспокоиться, Мина."
10037010-69 = "Госпожа Президент?!"
10037010-71 = "(Они собираются обсуждать что-то, что скрывают даже от Исполнительного Офицера...?! )"
10037010-72 = "(Какая совершенно секретная информация может обсуждаться на этой встрече с Красной Зимой...?! )"
10037010-73 = "Т-Тогда мы удалимся."
10037010-74 = "Никто не пересечёт нашу линию охраны!"
10037010-76 = "Г-Г-Госпожа... Госпожа!"
10037010-77 = ""
10037010-79 = ""
10037010-80 = ""
10037010-82 = ""
10037010-83 = "...пойдём?"
10037010-89 = "Прошу простить за столь неудовлетворительный приём, Сенсей. Мне было бы спокойнее знать, что вы не держите зла."
10037010-90 = "[s] «Всё хорошо, но... что это за аромат в комнате?»"
10037010-91 = "Вы заметили? Фуфу... Общество Восточной Алхимии настояло, чтобы я использовала именно эти благовония."
10037010-92 = "Мне сказали, что это лечебный аромат, который успокаивает нервы и помогает естественному восстановлению организма. Но я не могу ручаться за его эффективность."
10037010-93 = "Если он вам мешает, Сенсей, я с радостью его потушу."
10037010-94 = "[s] «Нет, всё в порядке. Пахнет довольно приятно.»"
10037010-95 = "...Понятно. Тогда я спокойна."
10037010-96 = "Теперь... если вы не против, перейду прямо к делу."
10037010-97 = "Полагаю, вступление было не нужно. Разумеется, вы бы сказали: «Конечно». Фуфу."
10037010-98 = "Как вы знаете, я хотела бы обсудить свои мысли об этой... встрече по обмену с Федеральной Академией Красной Зимы."
10037010-99 = "[s] «Разве нельзя просто... провести встречу по обмену?»"
10037010-100 = "Да, это было бы самым разумным."
10037010-101 = "Но здесь, в Шаньхайцзине, это не так просто принять."
10037010-102 = "Я имею в виду... Позвольте сказать иначе."
10037010-103 = ""
10037010-105 = ""
10037010-106 = "...В прошлом Шаньхайцзин почти не взаимодействовал с другими школами."
10037010-107 = "[s] «Серьёзно?»"
10037010-108 = "Да. То, что это не вызывает особого беспокойства, в основном связано с тем, что через Променад Чёрной Черепахи посторонним разрешён вход."
10037010-109 = "Однако это означает лишь то, что никто активно не препятствует чужакам посещать Шаньхайцзин."
10037010-110 = "Эта встреча по обмену... Что ж, приглашение внешней академии в Шаньхайцзин — событие исторически редкое."
10037010-111 = "[s] «Есть причина, по которой вы избегали контактов с внешним миром?»"
10037010-112 = "Никакой великой причины не было. Мы лишь хотели свести к минимуму любые потрясения для истории и традиций Шаньхайцзина."
10037010-114 = "Томоэ, Томоэ! Чем известен Шаньхайцзин? Что это вообще за место?"
10037010-115 = "Что ж, это загадочное место, о котором у нас больше вопросов, чем ответов..."
10037010-116 = "Но одно известно точно... Еда с Променада Чёрной Черепахи — просто объедение!"
10037010-117 = "Понятно... Понятно! Отлично! Начало уже многообещающее!"
10037010-118 = "Что-нибудь ещё?"
10037010-119 = "Ну, это уже не так точно, как с едой Променада Чёрной Черепахи, но..."
10037010-120 = "Если верить слухам, вы с президентом студенческого совета Шаньхайцзина должны отлично поладить."
10037010-121 = "Правда? Хм...! Интересно, что она за человек! Я уже жду нашей встречи!"
10037010-124 = "В этом вопросе, признаюсь, я согласна с Руми."
10037010-125 = "«Традиция» означает «обычаи, достойные сохранения»."
10037010-126 = "Но слепо цепляться за традиции — не всегда правильный путь."
10037010-127 = "[s] «Но с учётом вашей должности вы ведь не можете просто взять и сказать это вслух, да?»"
10037010-128 = "Какое счастье иметь друга, который так хорошо меня понимает."
10037010-129 = "Прошу, не поймите неправильно. Мина невероятно способна в своей области, и каждый студент Генрюмона делает то, чего от него ожидают."
10037010-130 = "И всё же..."
10037010-131 = "[s3] «Да, я понимаю.»\n[s4] «Все и правда каждый день стараются изо всех сил...»"
10037010-134 = "...Какое счастье иметь друга, который так хорошо меня понимает."
10037010-135 = "Возвращаясь к делу... Я хочу, чтобы Шаньхайцзин понял одну вещь."
10037010-136 = "За пределами нашего мира существует другой — мир, полный вещей, которые мы даже представить не можем."
10037010-137 = "Если мы будем заниматься только сохранением того, что уже имеем... однажды рискуем потерять именно то, что так усердно защищали."
10037010-138 = "[s5] «А. Теперь понятно.»\n[s6] «Вот почему Генрюмон пригласил Красную Зиму на встречу по обмену.»"
10037010-141 = "Фуфу... Возможно, если бы я сделала именно так, всё прошло бы спокойнее."
10037010-142 = "Что я имею в виду...? Вот. Взгляните ещё раз на сообщение."
10037010-143 = ""
10037010-146 = "Да, именно. Оно было подписано не от имени Генрюмона, а лично президентом Генрюмона."
10037010-147 = "Понимаете, какую разницу это создаёт?"
10037010-148 = "[ns7] «...Кажется, да.»\n[ns8] «Прости. Я не понимаю...»"
10037010-149 = "Вот как...? Понятно. Моё уважение, Сенсей."
10037010-150 = "Вы можете этого не понимать, но уже одно ваше присутствие здесь..."
10037010-151 = "оказывает мне огромную помощь. Я хочу, чтобы вы это знали."
10037010-152 = "Фуфу! Понятно. Значит, у меня появилось ещё кое-что, чему можно порадоваться."
10037010-153 = "Всё хорошо. Увидеть ваше выражение лица только что уже стоило всех этих усилий."
10037010-154 = "Вы всегда очень мне помогаете."
10037010-155 = ""
10037010-157 = "В любом случае, сам Генрюмон, если говорить прямо... чувствует себя неуютно из-за этой встречи по обмену."
10037010-158 = "Главная причина — полное отсутствие подобного опыта. Другие могут захотеть сохранить ещё большую отстранённость от всей этой затеи."
10037010-161 = "...Что касается отсутствия опыта, я ничем не отличаюсь от остальных в Генрюмоне."
10037010-162 = "Генрюмон всегда принадлежал только самому себе. То же можно сказать и о его президенте."
10037010-165 = "Как думаешь, в Шаньхайцзине холоднее или теплее, чем в Красной Зиме?"
10037010-167 = "Хи-хи! Думаю, найти академию холоднее Красной Зимы было бы довольно сложно. Черино — то есть, Великий Вождь?"
10037010-168 = "Да, Великий Вождь Черино. Красная Зима — самая сильная и величайшая, совсем как её климат!"
10037010-169 = "После знакомства с нашей погодой ни один студент Шаньхайцзина не посмеет насмехаться над Красной Зимой!"
10037010-171 = "Я так и знала! Хе-хе... Конечно, от академии великой Черино иного и не ждёшь!"
10037010-172 = ""
10037010-174 = ""
10037010-175 = "Ой, подождите, эм... А что, если пока меня не будет, случится государственный переворот...?"
10037010-176 = "Не о чем беспокоиться, Великий Вождь Черино! Государственный переворот невозможен, если нет того, кого можно свергнуть!"
10037010-177 = "Без цели для их гнева переворот просто невозможен!"
10037010-178 = ""
10037010-180 = ""
10037010-181 = "А, конечно! Сегодня ты говоришь очень разумные вещи, председатель Марина!"
10037010-182 = "Продолжай в том же духе, и совсем скоро я прикреплю тебе на грудь Медаль Усатого Труда Первой Степени!"
10037010-183 = ""
10037010-185 = ""
10037010-186 = "Спасибо, президент. Я, Марина, буду изо всех сил стараться быть вам ещё преданнее."
10037010-188 = "(Даже если переворот всё-таки случится, вернуть Черино к власти будет несложно. Опыта у нас предостаточно.)"
10037010-191 = "[ns] «Я понимаю ситуацию, Кисаки.»"
10037010-193 = "[ns] «Значит, моя задача — помочь тебе успешно провести встречу по обмену, верно?»"
10037010-194 = "...Да. Как и во время инцидента с десятитысячелетним женьшенем, мне приходится положиться на вас."
10037010-195 = "Хм? Как педагог, вы считаете, что студентам полезно просить о помощи...?"
10037010-196 = "Фуфу... Свежий взгляд. Я запомню."
10037010-197 = "И, полагаю, это значит, что я могу нагружать вас работой сколько захочу?"
10037010-198 = "[s] «Эм... Ну... Может, хотя бы не слишком жестоко...?»"
10037010-199 = "Не беспокойтесь. Я попрошу лишь о том, что находится в пределах разумного."
10037010-200 = ""
10037010-202 = ""
10037010-203 = ""
10037010-204 = "...Разумеется, я имею в виду разумного по меркам Шаньхайцзина."
10037010-205 = ""
10037010-209 = "[ns] «Пощады!»"
