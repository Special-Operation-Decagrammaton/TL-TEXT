[translation]
32070-1 = "Episódio 7;Uma Nova Perspectiva"
32070-3 = "Ora, Junko-san e Akari-san."
32070-4 = "Ah, Haruna. Você também foi capturada?"
32070-5 = "Fufu, eu me esforcei por uns 10 metros, pelo menos."
32070-6 = "Que pouco..."
32070-7 = "Então quer dizer que apenas a Izumi-san conseguiu escapar em segurança. Que bom, parece que o nosso sacrifício não foi em vão."
32070-8 = "Não, espera... sacrifício? No começo a situação era praticamente o oposto..."
32070-9 = "O Comitê de Justiça... Entendo, como esperado do maior grupo armado de Trinity. Uma capacidade de combate formidável."
32070-10 = "Eu levei um susto! A Akari foi amassada num instante que nem uma latinha de suco... Eu me assustei de verdade..."
32070-11 = "Poxa, eu disse que vir até a base de Trinity era loucura... Por mais que fosse por um atum, por que tínhamos que vir parar num lugar desses...?!"
32070-12 = "Veja bem, Junko-san. Em suma, é o seguinte: se a torneira estiver aberta em uma pia onde não há ninguém—"
32070-13 = "Eu já ouvi essa história antes!!"
32070-17 = "...O que será que vai acontecer com a gente agora?"
32070-18 = "Bem, pensando logicamente, não devemos ser entregues ao Comitê Disciplinar?"
32070-19 = "Que suuusto?! Não levanta assim sem falar nada?! Que bom que você tá bem, Akari?!"
32070-20 = "Fufu, bem, eu não sou derrotada tão facilmente assim★"
32070-21 = "Aliás, é mesmo, o Comitê Disciplinar... Que horror, só de pensar..."
32070-22 = "Estamos em apuros... Se possível, eu gostaria de evitar que o nosso destino fosse entregue às mãos da Hina-san..."
32070-23 = "Bem, acho que exageramos um pouquinho desta vez★ Talvez não tenha jeito."
32070-27 = "(Por que até eu estou aqui...?)"
32070-29 = "Perto da fronteira do Distrito Autônomo de Trinity"
32070-30 = "(Enquanto isso, Izumi...)"
32070-31 = "O-Onde eu tô...? Eu sou a Izumi... Buááá! Poxa, pra onde eu vou?!"
32070-36 = "Muito obrigada pelo esforço, Sensei, e a todas do Clube de Aulas de Reforço. Graças a vocês, conseguimos resolver a situação em segurança."
32070-37 = "A-Ahaha... Do meio pro fim, eu já estava agindo no puro desespero..."
32070-38 = "Poder ver as táticas do Comitê de Justiça bem diante dos meus olhos foi um ótimo aprendizado."
32070-39 = "N-Não sei se eu consegui ser útil ou não, mas...!"
32070-40 = "A propósito, o que vai acontecer com aquelas pessoas agora?"
32070-41 = "Normalmente, nós mesmas decidiríamos o que fazer com elas daqui em diante... Mas, dado o momento delicado, estamos pensando em entregá-las ao Comitê Disciplinar de Gehenna."
32070-42 = "[s] \"Entendo.\""
32070-43 = "Sim. E, sobre isso, eu tenho mais um pedido para lhe fazer, Sensei..."
32070-44 = "[s] \"Certo, o que eu preciso fazer?\""
32070-45 = "Levando em conta o Tratado do Éden, gostaríamos de evitar ao máximo tomar qualquer atitude direta daqui em diante."
32070-46 = "Por isso, a entrega ao Comitê Disciplinar... Será que poderíamos deixar essa parte em suas mãos, Sensei?"
32070-47 = "A \"Schale\" realizando a entrega das alunas... Dessa forma, as preocupações políticas diminuem bastante tanto para nós quanto para o lado de Gehenna."
32070-48 = "[s] \"Entendi, pode deixar comigo.\""
32070-49 = "Sim. Muito obrigada por absolutamente tudo, Sensei. Bem, nós ficaremos aguardando um pouco mais afastadas... Contamos com você."
32070-51 = "Distrito Autônomo de Trinity - Grande Ponte Externa"
32070-52 = "(Enquanto esperava a chegada do veículo do Comitê Disciplinar...)"
32070-60 = "...Desculpe a demora. Onde estão os cadáveres?"
32070-61 = "[s] \"...Hã?\""
32070-62 = "...Perdão. Não são cadáveres, são feridos, não é? Às vezes eu confundo as duas coisas."
32070-63 = "Vejamos... Na lista de entrega estava escrito: três feridos frescos e um refém..."
32070-64 = "[s] \"Frescos...?\""
32070-65 = "...A propósito, quem é você? Não parece ser do Comitê de Justiça..."
32070-66 = "[s] \"Hum...\""
32070-72 = "Esse é o Sensei [USERNAME], da \"Schale\"."
32070-76 = "[ns] \"Hina!\""
32070-77 = "Quanto tempo, Sensei. Faz quanto tempo que não nos vemos? ...A propósito, o que estava fazendo aqui?"
32070-78 = "Vocês se conhecem, Chefe do Comitê Disciplinar?"
32070-79 = "Sim... bem, pode-se dizer que sim."
32070-81 = "Entendo. Para não transformar isso em um problema político para ambos os lados neste momento, você..."
32070-82 = "De fato, nós também não queremos transformar isso em um problema. É justamente por isso que, oficialmente, quem veio hoje não foi o Comitê Disciplinar, e sim o \"Departamento de Emergência Médica\". Eu estou aqui basicamente só como acompanhante."
32070-83 = "...Sou a presidente do Departamento de Emergência Médica, Sena Himuro. É um prazer conhecê-lo, Sensei."
32070-84 = "Se houver cadá... digo, feridos, pode me chamar a qualquer momento. Não cobramos taxa de entrega."
32070-85 = "[s] \"M-Muito prazer...\""
32070-86 = "Mesmo dentro de Gehenna, o \"Departamento de Emergência Médica\" tem uma posição com pouquíssimo envolvimento em questões políticas. Por isso pedi a ajuda delas desta vez."
32070-87 = "Deixo essas brincadeiras de política para a Chefe do Comitê Disciplinar. Não tenho interesse em nada além de cadáveres."
32070-88 = "Você quis dizer \"feridos\", não é? Além do mais, você nunca nem viu um cadáver de verdade."
32070-89 = "Sim, feridos. Mas quanto a isso, você também nunca viu, não é, Chefe do Comitê Disciplinar?"
32070-93 = "Enfim... A Sociedade de Pesquisa Gourmet está aí dentro? Então, pode transferi-las para cá?"
32070-98 = "...Fufu. Hina-san, quanto tempo."
32070-99 = "Haruna, você continua a mesma... Não, deixemos os detalhes para quando voltarmos."
32070-100 = "Ora, então era mesmo o pessoal do \"Departamento de Emergência Médica\"★ O meu braço está dobrado em um ângulo meio impossível, será que você poderia dar uma olhada?"
32070-101 = "Urgh, fiquei enjoada... Acho que vou vomitar..."
32070-102 = "E-Estou salva..."
32070-103 = "Ora, você é do Clube de Merenda Escolar... Pensei que não tinha te visto o dia todo hoje, e você veio parar num lugar desses."
32070-104 = "Agora mesmo, lá na academia, a Juri está... Não, é melhor você me explicar no caminho de volta."
32070-105 = "Tenho a impressão de que está faltando mais uma pessoa da Sociedade de Pesquisa Gourmet... Mas que seja, dá muito trabalho."
32070-107 = "Muito obrigada por toda a sua consideração, Sensei. Da próxima vez que vier a Gehenna, farei questão de recebê-lo com algo bem delicioso."
32070-108 = "Até a próxima~★"
32070-109 = "...Vocês fazem barulho demais. Entrem logo."
32070-110 = "[s] \"Bom, então até mais. Vão com cuidado...\""
32070-114 = "...Carregamento concluído. Também estamos prontas para partir."
32070-115 = "...Espere um pouco."
32070-116 = "..."
32070-117 = "Sensei... O que você está fazendo em Trinity?"
32070-118 = "[s] \"Estou trabalhando como conselheiro de um grupo chamado Clube de Aulas de Reforço...\""
32070-119 = "Disso eu já sei. Várias informações chegam até mim..."
32070-120 = "Não é isso. A Schale deveria ser uma organização neutra. Estar em Trinity justo neste período faz parecer que..."
32070-121 = "[s] \"...\""
32070-122 = "...Esquece o que eu acabei de dizer, não se preocupe com isso. Não tem como você fazer algo desse tipo."
32070-123 = "[s] \"Hina, eu também queria te perguntar uma coisa.\""
32070-124 = "Hum? Perguntar uma coisa...?"
32070-125 = "[s] Perguntar a opinião de Hina sobre o Tratado do Éden."
32070-128 = "(Contei em detalhes para a Hina sobre a situação atual e as perspectivas para o futuro.)"
32070-140 = "Entendo... Você está em uma situação bem complicada, não é, Sensei?"
32070-141 = "...Não, espera. Não teve uma cena meio estranha misturada aí no meio agora há pouco?"
32070-142 = "[s1] \"Acho que é impressão sua.\"\n[s2] \"Com certeza é impressão sua.\""
32070-143 = "..."
32070-144 = "..."
32070-145 = "Bom, de qualquer forma..."
32070-146 = "\"Um traidor em Trinity\"... entendo."
32070-147 = "Uma situação onde tantas palavras se cruzam que não dá para saber quem está dizendo a verdade e quem está mentindo..."
32070-148 = "[s3] \"Pensei que poderia haver vários pontos de vista.\"\n[s4] \"Porque a verdade pode mudar dependendo do ponto de vista.\""
32070-149 = "Eu realmente não sei dizer se você é cauteloso ou otimista..."
32070-150 = "Eu realmente não sei dizer se você é cauteloso ou otimista..."
32070-151 = "...A propósito, tem certeza de que tudo bem me contar algo tão importante assim?"
32070-152 = "[s] \"Sim, porque eu confio em você, Hina.\""
32070-153 = "..."
32070-154 = "...Esse seu jeito é o seu pior defeito, Sensei."
32070-155 = "[s] \"...?\""
32070-156 = "...Só estava falando sozinha."
32070-157 = "O Tratado do Éden como uma aliança militar, é...? Bem, pode até ser um ponto de vista interessante."
32070-158 = "Mas, pelo menos para mim, não é assim. Aquilo é um legítimo tratado de paz, é assim que eu penso."
32070-159 = "[s] \"Entendo...?\""
32070-160 = "A Organização do Tratado do Éden criada pelo acordo... Mesmo que você a enxergue como um grupo armado, não é algo que a Nagisa possa controlar sozinha."
32070-161 = "A Makoto, líder da Pandemonium Society, também terá a mesma autoridade que a Nagisa."
32070-162 = "E não é só isso: uma certa parte da autoridade também será dividida entre os outros membros da Tea Party e da Pandemonium Society. Por isso, é difícil imaginar que a ETO perca seu propósito original e saia do controle pela vontade de uma única pessoa."
32070-163 = "É claro que, se todos eles resolvessem cooperar entre si, teoricamente seria possível, mas..."
32070-164 = "Para começo de conversa, se fossem capazes de fazer algo assim, bastaria unificar as duas academias desde o início."
32070-165 = "Além do mais, a Makoto não é do tipo que consegue cooperar com alguém..."
32070-166 = "[s] \"...Então por que a Makoto está de acordo com o Tratado do Éden?\""
32070-167 = "...Mais do que estar de acordo, acho que ela provavelmente não está pensando em nada. Para começo de conversa, quem promoveu o Tratado do Éden do lado de Gehenna fui eu."
32070-168 = "[s] \"Você, Hina...? Por quê?\""
32070-169 = "...Tem coisa demais dando trabalho, então pensei que me aposentar não seria uma má ideia."
32070-170 = "Quando a ETO for formada, a ordem em Gehenna deve melhorar muito em comparação a agora. E quando isso acontecer, eu já não vou mais precisar ser a Chefe do Comitê Disciplinar, não é?"
32070-171 = "[s] \"Entendo...\""
32070-172 = "Chefe do Comitê Disciplinar, ainda vai demorar?"
32070-173 = "...Não, já estou indo."
32070-174 = "Então, bom trabalho, Sensei. Até..."
32070-181 = "...Você vai proteger o Clube de Aulas de Reforço, não vai, Sensei?"
32070-182 = "[s] \"Sim.\""
32070-183 = "...Entendo."
32070-185 = "...Então, até mais."
32070-194 = "De certa forma, hoje foi um dia e tanto, não é...?"
32070-195 = "Pois é, quem diria que uma caminhada noturna se tornaria tão intensa assim..."
32070-196 = "É, mas foi divertido."
32070-197 = "...Ehehe."
32070-198 = "Koharu-chan, você parece estar tão feliz desde aquela hora. Por acaso é porque você conseguiu ajudar bastante a Hasumi-san e lutar ao lado dela?"
32070-199 = "É isso mesmo, tem algum problema?! Foi a primeira vez que pude lutar junto com a Hasumi-senpai..."
32070-201 = "Estou tão feliz por ter conseguido ser útil...! Ehe, ehehehe...!"
32070-202 = "Ufufu, isso é o mais importante♡ Agora só falta evitar a reprovação, exatamente como a Hasumi-san deseja, não é?"
32070-203 = "E-Eu já sei! Pode ficar tranquila, a-afinal eu sou da elite!"
32070-204 = "Sim... Eu também preciso dar o meu melhor♡"
32070-208 = "Ahaha... Já está tarde, então que tal irmos dormir? Não seria nada bom se isso atrapalhasse os estudos de amanhã..."
32070-209 = "Então, bom trabalho a todos."
32070-210 = "[s] \"Bom trabalho, pessoal. Boa noite.\""
32070-212 = "(E assim, um longo dia chegou ao fim...)"
32070-214 = "Próximo;Um Raio de Esperança"
