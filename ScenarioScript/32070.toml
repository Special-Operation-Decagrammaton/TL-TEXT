[translation]
32070-1 = "Эпизод 7;Новый взгляд"
32070-3 = "Привет, Джунко. Рада видеть тебя, Акари."
32070-4 = "Харуна? Тебя тоже поймали?"
32070-5 = "Боюсь, я и десяти метров не пробежала."
32070-6 = "..."
32070-7 = "Похоже, одной Изуми как-то удалось сбежать... По крайней мере, мы пожертвовали собой не зря."
32070-8 = "С каких пор я собой жертвую ради этой дурочки?"
32070-9 = "Отряд правосудия не зря заслужил свою репутацию. Глупо было их недооценивать."
32070-10 = "Вот именно! Одна из них смяла Акари, словно банку газировки. Я думала, нам конец!"
32070-11 = "Я же говорила, не стоило тащиться сюда из-за какого-то дурацкого тунца!"
32070-12 = "Послушай, Джунко. Если бы ты увидела, как из крана вода льётся в переполненную раковину, а вокруг никого нет, что бы ты сделала?"
32070-13 = "Хватит уже с твоей дурацкой раковиной!"
32070-14 = ""
32070-16 = ""
32070-17 = "Как думаете, что с нами сделают?"
32070-18 = "Наверное, передадут Префектурной команде."
32070-19 = "Акари! Не надо вот так внезапно воскресать!"
32070-20 = "Ой, да ладно. Я просто немного вздремнула. Так просто меня не убить. ★"
32070-21 = "В-В любом случае, разве лучше попасть к Префектурной команде? Можно сразу отвести нас на казнь..."
32070-22 = "Возможно. Я бы предпочла, чтобы наша судьба не оказалась в руках Хины..."
32070-23 = "Вот и поплатились за то, что на этот раз перегнули палку. Ну и ладно."
32070-24 = ""
32070-26 = ""
32070-27 = "(За что меня-то сюда притащили? Я просто хочу домой...)"
32070-29 = "Граница района Тринити"
32070-30 = "Тем временем Изуми..."
32070-31 = "*всхлип* Г-Где я?! Куда мне идти?!"
32070-32 = ""
32070-34 = ""
32070-36 = "Отличная работа. Благодаря вашей помощи нам удалось взять ситуацию под контроль."
32070-37 = "С-Спасибо. Я думала, мы просто увлеклись в пылу момента."
32070-38 = "Было полезно увидеть вблизи, как действует Отряд правосудия."
32070-39 = "Н-Надеюсь, я тоже пригодилась."
32070-40 = "А что будет с теми студентами?"
32070-41 = "Обычно их судьбу решали бы мы. Но в нынешних обстоятельствах придётся передать их Префектурной команде Геенны."
32070-42 = "[s] «Я так и думал.»"
32070-43 = "Вообще-то у меня есть просьба по этому поводу."
32070-44 = "[s] «Ко мне? Какая?»"
32070-45 = "Перед подписанием Эдемского договора я хотела бы по возможности избежать конфликтов."
32070-46 = "Не могли бы вы передать задержанных Префектурной команде, когда та прибудет?"
32070-47 = "Если формально под стражей их будет держать Шале, это снизит политическую напряжённость для обеих сторон."
32070-48 = "[s] «Я могу это сделать.»"
32070-49 = "Спасибо, Сенсей. Тогда я отойду."
32070-51 = "Мост на окраине Тринити"
32070-52 = "Я прибыл на условленное место, чтобы передать Общество гурманов Префектурной команде."
32070-53 = ""
32070-59 = ""
32070-60 = "Я здесь. Где тела?"
32070-61 = "[s] «Тела?»"
32070-62 = "Простите. Я хотела сказать «раненые». Иногда путаю."
32070-63 = "Судя по документам, я приехала за тремя свежераненными и одной заложницей."
32070-64 = "[s] «Это накладная?»"
32070-65 = "Не похоже, чтобы вы были из Отряда правосудия. Кто вы вообще?"
32070-66 = "[s] «А ты не похожа на члена Префектурной команды.»"
32070-67 = ""
32070-69 = ""
32070-72 = "Это Сенсей [USERNAME], советник Шале."
32070-73 = ""
32070-75 = ""
32070-76 = "[ns] «Хина!»"
32070-77 = "Снова встретились, Сенсей. Что вы здесь делаете?"
32070-78 = "Вы знакомы, глава префектов?"
32070-79 = "Можно и так сказать..."
32070-81 = "Так вот в чём дело. Пленных передали Шале, чтобы снизить политическую напряжённость."
32070-82 = "Мы подумали о том же. Поэтому официально задержанных примет Медицинский клуб неотложной помощи. Я здесь лишь наблюдаю."
32070-83 = "Сэна. Химуро Сэна, президент Медицинского клуба неотложной помощи. Приятно познакомиться, Сенсей."
32070-84 = "Если вам когда-нибудь понадобится перевезти тела... то есть раненых, дайте знать. У нас фиксированный тариф."
32070-85 = "[s] «Х-Хорошо.»"
32070-86 = "Медицинский клуб неотложной помощи почти не участвует в политике Геенны, потому я и поручила им это дело."
32070-87 = "Меня интересуют только покойники. Марать руки политикой оставлю вам."
32070-88 = "Повторяю: они всего лишь ранены. Сомневаюсь, что ты вообще видела мертвеца вживую."
32070-89 = "Моя ошибка... но то же относится и к вам, глава префектов."
32070-90 = ""
32070-92 = ""
32070-93 = "Так что, Общество гурманов здесь? Давайте перенесём их в машину скорой помощи."
32070-94 = ""
32070-96 = ""
32070-98 = "Как я рада снова тебя видеть, Хина."
32070-99 = "*вздох* Харуна... Об этом поговорим позже."
32070-100 = "Медицинский клуб неотложной помощи приехал? Кажется, я вывихнула локоть. Не взглянете? ★"
32070-101 = "Уф... Кажется, меня сейчас стошнит."
32070-102 = "Я спасена..."
32070-103 = "Ты... президент Клуба школьных обедов? Я-то гадала, куда ты пропала."
32070-104 = "Пока тебя не было, Джури... Впрочем, расскажу по дороге."
32070-105 = "Похоже, они поймали лишь троих из четырёх членов Общества гурманов. С этим я разберусь позже."
32070-107 = "Спасибо за гостеприимство, Сенсей. Когда в следующий раз заглянете в Геенну, я непременно угощу вас изысканным блюдом."
32070-108 = "До встречи. ★"
32070-109 = "Заткнись и залезай."
32070-110 = "[s] «Берегите себя...»"
32070-114 = "Тела погружены. Можно отправляться."
32070-115 = "Подожди минуту."
32070-116 = "..."
32070-117 = "Сенсей. Что вы делаете в Тринити?"
32070-118 = "[s] «Я вроде как наставник Клуба дополнительных занятий.»"
32070-119 = "Я слышала. От нас мало что ускользает."
32070-120 = "Меня больше волнует, почему именно сейчас вы проводите в Тринити столько дней подряд. Шале должно сохранять нейтралитет. Неужели вы?.."
32070-121 = "[s] «...»"
32070-122 = "Забудьте. Не могу себе такого представить."
32070-123 = "[s] «Я тоже хочу кое о чём спросить.»"
32070-124 = "М? О чём?"
32070-125 = "[s] Спросить Хину, что она думает об Эдемском договоре."
32070-128 = "Я подробно объяснил Хине ситуацию."
32070-129 = ""
32070-131 = ""
32070-133 = ""
32070-135 = ""
32070-137 = ""
32070-140 = "Вы оказались в очень непростом положении, Сенсей."
32070-141 = "Но что это было про симпозиум в купальниках?"
32070-142 = "[s1] «Не обращай внимания.»\n[s2] «Симпозиум в купальниках? Я ничего такого не говорил...»"
32070-143 = "..."
32070-144 = "..."
32070-145 = "Продолжим..."
32070-146 = "История с предателем в Тринити довольно запутанная."
32070-147 = "Невозможно понять, кто говорит вам правду, а кто кормит ложью."
32070-148 = "[s3] «Правда зависит от точки зрения.»\n[s4] «Правда может быть не одна.»"
32070-149 = "Даже не знаю, назвать вас осторожным или оптимистом."
32070-150 = "Даже не знаю, назвать вас осторожным или оптимистом."
32070-151 = "Вы уверены, что можете рассказывать мне всё это?"
32070-152 = "[s] «Конечно. Я доверяю тебе больше всех.»"
32070-153 = "..."
32070-154 = "Опять эта ваша дурная привычка."
32070-155 = "[s] «...?»"
32070-156 = "Ничего. Я просто пробормотала себе под нос."
32070-157 = "Интересный взгляд — считать Эдемский договор прикрытием для военного союза..."
32070-158 = "...но я так не думаю. Насколько я понимаю, это действительно мирный договор."
32070-159 = "[s] «Правда?»"
32070-160 = "Одного подписания договора недостаточно, чтобы Нагиса получила полный контроль над ЭДО."
32070-161 = "Макото, председатель Общества Пандемониума, получит такие же полномочия."
32070-162 = "Кроме того, полномочия распределят между другими членами Чайной партии и Общества Пандемониума, чтобы никто не мог использовать ЭДО по своей прихоти или увести её от первоначальной цели."
32070-163 = "Теоретически последнее всё ещё возможно, если они все вступят в сговор."
32070-164 = "Хотя, если бы им было так легко договориться, в самом договоре не было бы нужды. Они бы просто объединили две академии."
32070-165 = "Да и не верится мне, что Макото способна с кем-то поладить."
32070-166 = "[s] «Тогда почему она поддерживает договор?»"
32070-167 = "Думаю, она вовсе его не поддерживает... Это я настояла, чтобы Геенна согласилась на Эдемский договор."
32070-168 = "[s] «Ты? Но почему?»"
32070-169 = "Хороший вопрос. Возможно, я увидела в этом возможность уйти на покой."
32070-170 = "При ЭДО в Геенне будет куда больше порядка. Мне больше не придётся продолжать в том же духе."
32070-171 = "[s] «...»"
32070-172 = "Мы всё ещё ждём, глава префектов. Вы сказали всё, что хотели?"
32070-173 = "Да. Уже иду."
32070-174 = "Удачи вам, Сенсей."
32070-175 = ""
32070-177 = ""
32070-178 = ""
32070-179 = ""
32070-181 = "Вы ведь защитите Клуб дополнительных занятий?"
32070-182 = "[s] «Да. Во что бы то ни стало.»"
32070-183 = "Хорошо."
32070-185 = "До новой встречи."
32070-186 = ""
32070-188 = ""
32070-194 = "Фух. Ну и денёк."
32070-195 = "И не говори. Никогда бы не подумала, что наша невинная прогулка обернётся таким приключением."
32070-196 = "Хотя было весело."
32070-197 = "Хи-хи."
32070-198 = "Ты выглядишь гораздо счастливее, Кохару. Рада, что удалось сражаться рядом с Хасуми?"
32070-199 = "К-Конечно рада! Это было впервые."
32070-201 = "Как будто мечта сбылась!"
32070-202 = "Как здорово. Теперь осталось сдать экзамен, как тебе велела Хасуми."
32070-203 = "Знаю я! Следующий точно сдам на отлично. Как подобает элите!"
32070-204 = "Уверена, так и будет. А мне придётся заниматься усерднее, чтобы не отстать от тебя."
32070-205 = ""
32070-207 = ""
32070-208 = "Уже поздно. Пора спать, иначе завтра будет трудно заниматься."
32070-209 = "Всем спокойной ночи. И вам тоже, Сенсей."
32070-210 = "[s] «Спокойной ночи. Вы сегодня отлично поработали.»"
32070-212 = "На этот раз день наконец подошёл к концу."
32070-214 = "Следующий Эпизод;Проблеск надежды"
