[translation]
1301403-1 = "Купальники и необитаемый остров"
1301403-2 = "В назначенный день мы с Рэнгэ приехали на пляж."
1301403-5 = ""
1301403-6 = "Мы прибыли в «то самое место»?"
1301403-7 = "Да. Здесь вам никто не помешает. Скорее всего."
1301403-8 = ""
1301403-10 = ""
1301403-13 = "Просто позовите меня, когда закончите."
1301403-14 = ""
1301403-20 = "[ns1] «Эм, Рэнгэ? Где именно мы?»\n[ns2] «Это не похоже на обычный остров...»"
1301403-21 = ""
1301403-22 = ""
1301403-24 = ""
1301403-25 = "Ой, я разве не сказала?"
1301403-26 = "Это необитаемый остров!"
1301403-27 = "[s] «Н-Необитаемый остров?!»"
1301403-28 = "Именно! Я записала нас на «Однодневный опыт выживания на необитаемом острове»!"
1301403-29 = "По краям мелко, опасных животных нет. Остров забронирован за нами на день, но уйти можем когда захотим."
1301403-30 = "Разве это не идеальное место для тренировки?"
1301403-31 = "[s3] «...Личный пляж только для нас!»\n[s4] «Ничего более юношеского и представить нельзя!»"
1301403-34 = "Фуфу. Я знала, что вы одобрите, Наставник!"
1301403-35 = "Итак, нельзя терять ни минуты!"
1301403-36 = ""
1301403-38 = ""
1301403-43 = ""
1301403-44 = "[ns] «Ты снова надела „это“ под одежду, да?»"
1301403-45 = "Конечно. А вы?"
1301403-46 = "[s] «Фуфу! Конечно!»"
1301403-54 = "Отлично! Для начала..."
1301403-55 = "...нам нужно добыть еду!"
1301403-56 = "[s] «...Нужно? Я думал, мы приехали отдыхать.»"
1301403-57 = "...Сенсей. Это необитаемый остров."
1301403-58 = "Прямо сейчас мы тренируемся выживать в экстремальных условиях!"
1301403-59 = "Это ведь то, что каждый должен испытать в юности, верно?"
1301403-60 = "[s] «Знаешь, у нас могут быть очень разные определения „юности“!»"
1301403-61 = "Фуфу! Тогда с этого момента это будет юность Рэнгэ!"
1301403-62 = ""
1301403-64 = ""
1301403-65 = "Вперёд! У меня есть сеть и огромное желание поймать рыбу!"
1301403-66 = ""
1301403-70 = ""
1301403-71 = "Туда, Наставник! Рыба уплывает!"
1301403-72 = "[s] «Я займусь! Сейчас...!»"
1301403-73 = ""
1301403-80 = "Ха-ха. Ничего не поймали!"
1301403-81 = "Давайте покажу, как надо. Просто повторяйте за мной!"
1301403-82 = ""
1301403-84 = ""
1301403-85 = ""
1301403-91 = ""
1301403-94 = "[ns5] «Как ты это сделала?!»\n[ns6] «Рыба с неба падает?!»"
1301403-97 = ""
1301403-98 = "Вот, я помогу. Попробуйте ещё раз."
1301403-99 = "Начнём с стойки. Направьте тело туда, куда хотите бросить, и кидайте!"
1301403-100 = ""
1301403-102 = ""
1301403-106 = ""
1301403-107 = "Эм... Я помогу вам сзади. Просто держите руки вот так..."
1301403-108 = ""
1301403-110 = ""
1301403-112 = ""
1301403-113 = "Продолжайте дышать. У вас получится."
1301403-114 = "И как только увидите рыбу...!"
1301403-115 = ""
1301403-120 = ""
1301403-121 = "[ns] «О, поймал!»"
1301403-122 = "Я знала, что у вас получится, Наставник!"
1301403-123 = "Я продолжу держать вас сзади, чтобы сохранить правильную стойку, и—"
1301403-124 = "«Держать вас»..."
1301403-125 = ""
1301403-127 = ""
1301403-128 = ""
1301403-129 = "(Погодите. Для двух людей в купальниках мы сейчас НЕВЕРОЯТНО близко!)"
1301403-130 = ""
1301403-132 = ""
1301403-133 = "А-Ахаха. Если подумать, почему бы вам не попробовать самостоятельно? Птенец когда-нибудь должен покинуть гнездо, верно? Аха... ха!!"
1301403-134 = "[s] «Д-Да!»"
1301403-135 = "Л-Ладно! Продолжаем в том же темпе!"
1301403-138 = "Остаток дня мы продолжали наши занятия юностью, очень внимательно следя за расстоянием между нами."
1301403-145 = "Не успели оглянуться, как время пролетело."
1301403-146 = "Сегодня было так весело."
1301403-147 = "Сохнуть под солнцем, делить пойманную вместе рыбу..."
1301403-148 = "Думаете, именно так всё выглядело бы, если бы мы действительно оказались отрезаны от мира?"
1301403-149 = ""
1301403-151 = ""
1301403-152 = ""
1301403-153 = "..."
1301403-154 = "Однажды я читала роман, где двое застряли на необитаемом острове и влюбились."
1301403-155 = "После него я начала представлять, что сделала бы в такой ситуации."
1301403-156 = "Вы когда-нибудь думаете о таком, Наставник?"
1301403-157 = "[s7] «Да, конечно.»\n[s8] «Мечтать всегда весело.»"
1301403-160 = "...Понятно."
1301403-161 = "Е-Если бы вам пришлось выбрать одного человека, с которым застрять на необитаемом острове, кого бы вы выбрали? П-Потому что, знаете, наверное, хочется выбрать кого-то с хорошими навыками выживания... и другими качествами..."
1301403-162 = ""
1301403-164 = ""
1301403-165 = "..."
1301403-166 = "Я задала вам сложный вопрос, да? Ахаха. Не обязательно отвечать прямо сейчас."
1301403-167 = "Сегодня я просто рада, что смогла насладиться ещё одной частичкой своей юности."
1301403-168 = "...Хотя ответ я всё же хочу знать."
1301403-169 = ""
1301403-171 = ""
1301403-172 = "Н-Неважно! Забудьте!"
1301403-173 = "В общем! Кхм! Уже поздно, пора готовиться!"
1301403-174 = "[s] «Уже поздно, так что, наверное, надо разбить лагерь.»"
1301403-175 = "Совместный кемпинг... определённо популярное занятие юности."
1301403-176 = "Но сегодняшняя сцена — «выживание на необитаемом острове»!"
1301403-177 = "Так что следующим шагом, естественно, будет побег!"
1301403-178 = "Мы, конечно, могли бы просто позвонить лодочнику, который нас сюда привёз..."
1301403-179 = "...но придумать способ сбежать — последний этап сегодняшней тренировки!"
1301403-180 = ""
1301403-182 = ""
1301403-183 = "Поэтому мы построим плот и сбежим обратно на материк!"
1301403-184 = "Дерева полно, материалов более чем достаточно."
1301403-185 = "[s] «Погоди... Мы будем строить ЧТО?!»"
1301403-186 = "Плот, Наставник. И начинать нужно сейчас, если хотим закончить к завтра!"
1301403-187 = ""
1301403-189 = ""
1301403-190 = "Ну что! Выложимся на полную ради нашей юности и выживания, Наставник!"
1301403-191 = "[s] «Р-Рааа! Да!»"
1301403-192 = ""
1301403-194 = ""
1301403-196 = "...Мы с Рэнгэ всю ночь строили плот и в конце концов успешно покинули остров."
