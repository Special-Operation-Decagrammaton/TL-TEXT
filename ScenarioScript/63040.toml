[translation]
63040-1 = "Эпизод 4;Королевская кровь"
63040-2 = "Королевская кровь."
63040-3 = "Особая кровь. Особая родословная."
63040-4 = "Сколько себя помню, меня ставили на воображаемый пьедестал ради одной-единственной неосязаемой вещи."
63040-5 = "Для меня она ничего не значила."
63040-6 = "Ведь со мной всё равно обращались как с мусором."
63040-7 = "Чем «особеннее» я была, тем больше на меня накладывали ограничений. Тем о большем мне запрещали говорить."
63040-9 = "Спасибо, Сао-Сао."
63040-10 = "Я смогла выдержать благодаря тебе."
63040-12 = "Спасибо, [USERNAME] Сенсей."
63040-13 = "Только благодаря нашей встрече я наконец смогла стать самой собой."
63040-15 = "Мисаки и Хиёри — вам тоже."
63040-16 = "Если бы не каждая из вас, я так и осталась бы безмолвной куклой, жертвой."
63040-17 = "Всю жизнь я провела бы как чей-то символ."
63040-18 = ""
63040-19 = "Узнав тайны Ариуса, ты почувствовала себя могущественной?"
63040-20 = "Ты коснулась путей к тому, что спит под этой землёй, и решила, что стала непобедимой?"
63040-21 = ""
63040-23 = ""
63040-24 = "Жаль тебя разочаровывать. Такой объём знаний..."
63040-25 = "...был моим правом по рождению ещё до того, как эта мысль вообще появилась в твоей голове."
63040-26 = "Но теперь я хотя бы могу быть уверена в одном."
63040-27 = "Ангелы Откровения были всего лишь явлением, вызванным Какэхаси Субару."
63040-28 = "Поначалу ты ведь даже не понимала, что сделала? Но сама того не осознавая, призвала их."
63040-29 = "Надеюсь, ты не слишком разочарована."
63040-30 = "Это не Ангел, трубящий в трубу, из Писания."
63040-31 = "Впрочем, шанс был. Это явление могло перерасти в настоящих семь Ангелов, трубящих в трубы."
63040-32 = "Если бы только ты могла стать безупречным судьёй."
63040-33 = "«Б-Безупречным судьёй»...?"
63040-34 = "Как я уже сказала, ты здесь не единственная из Ариуса."
63040-35 = "И не единственная хранительница тайн Ариуса."
63040-36 = "Поэтому... откровение, если можно так выразиться, давно принадлежало и мне."
63040-37 = "Мне просто запрещали говорить о нём. И до сих пор запрещают."
63040-38 = "Вот что значит нести королевскую кровь Ариуса."
63040-39 = "И всё же я должна тебя поблагодарить, Субару."
63040-40 = "Теперь, когда ты раскрыла часть тайны, я могу говорить немного свободнее."
63040-41 = "Это даже освежает. Ты знаешь, как тяжело быть единственной в комнате, кто знает что-то важное?"
63040-42 = "[ns] «Так что же именно это такое, Ацуко?»"
63040-43 = "Перед нами этот ангел... точнее, нечто, принявшее форму ангела..."
63040-44 = ""
63040-46 = "Проще говоря, это явление — воплощение энергии и эмоций Ариуса."
63040-47 = "Я ведь говорила вам некоторое время назад, помните? Ариус стал землёй, где случается необъяснимое."
63040-48 = ""
63040-49 = "[ns] «А...!»"
63040-50 = ""
63040-51 = "В Ариусе всегда было «что-то»."
63040-52 = "Скорбь, обида, ненависть, ярость, смирение... Всё это собирается именно здесь."
63040-54 = "...Так или иначе руководство Ариуса хотело приблизить конец света."
63040-55 = ""
63040-56 = ""
63040-57 = "Скажу прямо, Сенсей. Именно так."
63040-60 = ""
63040-61 = "Ребёнок, которым пренебрегают, подожжёт деревню, лишь бы почувствовать тепло огня."
63040-62 = "Для того, кому уже нечего терять, даже конец света может казаться спасением."
63040-63 = ""
63040-64 = "[ns1] «То есть оно могло... выйти за свои пределы?»\n[ns2] «Ты также сказала, что это возможно при „безупречном судье“, верно?»"
63040-67 = "Да. То, что бурлило под поверхностью Ариуса, обладало достаточной силой, чтобы это произошло."
63040-68 = "...По крайней мере, достаточно, чтобы «дать какой-то результат» в ответ Тринити."
63040-69 = "Если бы Субару буквально была безупречной."
63040-70 = "То есть в ней был какой-то изъян?"
63040-71 = "Был."
63040-72 = "И этим изъяном стала эта девочка."
63040-73 = "А...!"
63040-74 = ""
63040-75 = ""
63040-77 = "Я... Я..."
63040-78 = "Похоже, ты наконец поняла."
63040-79 = "В тот миг, когда ты бросила эту девочку, у твоих действий больше не осталось никакого оправдания."
63040-80 = "Лучше бы ты использовала саму себя как посредника для создания этого явления."
63040-81 = "Вместо этого ты по собственной воле решила стать Ангелом, трубящим в трубу."
63040-82 = "Я понимаю. Ты и все, кто остался в Ариусе, должно быть, так отчаянно хотели сыграть роль судьи."
63040-83 = "Но в самой основе была одна проблема."
63040-84 = "Судья должен быть безупречен."
63040-85 = "«Кто роет яму и углубляет её, тот упадёт в яму, которую сделал»."
63040-86 = "Ты ведь помнишь этот стих?"
63040-87 = "Если бы только Майя хотя бы..."
63040-88 = "Даже если бы ты не стала искать Сенсея, у тебя всё равно оставался шанс стать судьёй."
63040-91 = "Не бросай меня!"
63040-92 = ""
63040-94 = ""
63040-103 = "Ах..."
63040-104 = "А... А-а-а..."
63040-105 = ""
63040-106 = "Субару?"
63040-107 = "Я услышала тихий голос. Может быть... это...?"
63040-108 = "..."
63040-109 = ""
63040-111 = ""
63040-113 = ""
63040-114 = ""
63040-115 = ""
63040-116 = "Х-Хиёри...?"
63040-117 = "Если тебе есть что сказать, говори, Майя!"
63040-118 = ""
63040-120 = ""
63040-121 = "М-Мы ведь именно поэтому прошли весь этот путь, верно?"
63040-123 = "..."
63040-124 = ""
63040-126 = ""
63040-127 = "Да, спасибо, Хиёри."
63040-130 = "Эм, Субару? Эм, есть кое-что, что я давно хотела тебе сказать."
63040-131 = ""
63040-132 = "Всё в порядке, Субару."
63040-133 = "Всё... в порядке."
63040-134 = "...!"
63040-135 = "Я точно не понимаю всего, но, думаю, тебя я понимаю довольно хорошо, Субару."
63040-136 = "Тебя, Отряд и всех в Ариусе..."
63040-137 = "И вас, [USERNAME] Сенсей. Я правда... очень люблю вас всех."
63040-138 = "Поэтому я не хочу, чтобы Ариус исчез."
63040-139 = "Я просто хочу, чтобы Ариус стал школой получше."
63040-140 = "Т-Так что я пытаюсь сказать..."
63040-141 = ""
63040-143 = ""
63040-144 = "То есть... Эм..."
63040-145 = "Пожалуйста, помоги мне, Субару!!"
63040-147 = "...!"
63040-148 = "Я очень-очень люблю, когда ты играешь на губной гармошке!!"
63040-150 = "Следующий Эпизод;Гармошка 2"
