[translation]
10036005-1 = "Пролог"
10036005-3 = ""
10036005-4 = "Где она? Я точно видела, как она побежала сюда."
10036005-5 = "Ц, мелкая крыса...!"
10036005-6 = ""
10036005-8 = ""
10036005-9 = ""
10036005-10 = ""
10036005-11 = "Вон там! Стреляйте!"
10036005-12 = ""
10036005-16 = ""
10036005-17 = "А ТЕПЕРЬ она куда делась?"
10036005-18 = ""
10036005-21 = ""
10036005-26 = "Угх..."
10036005-27 = ""
10036005-28 = ""
10036005-29 = ""
10036005-30 = ""
10036005-31 = "Это была последняя."
10036005-32 = ""
10036005-34 = ""
10036005-35 = "Теперь забрать то, за чем пришла."
10036005-37 = ""
10036005-38 = ""
10036005-39 = "Информационный терминал добыт. Держите."
10036005-40 = "Ого...! Да, это он! Наконец-то он у меня!"
10036005-41 = "Хи-хи. Неплохо для фрилансера."
10036005-42 = "В чём твой секрет?"
10036005-43 = "Ни в чём."
10036005-44 = ""
10036005-46 = ""
10036005-47 = ""
10036005-48 = "Я просто подготовилась, вот и всё."
10036005-49 = "Когда знаешь смены охраны, план здания, внутренние конфликты в организации противника, фракции и иерархию, выполнить работу легко."
10036005-50 = "Хм, вот оно как...!"
10036005-51 = "Хватит болтовни. Теперь моя оплата."
10036005-52 = "А, конечно! Вот, держи."
10036005-53 = ""
10036005-55 = ""
10036005-56 = "Раз, два, три... Ладно, всё на месте."
10036005-57 = "Однако..."
10036005-59 = "Хм? В чём проблема? Я дала ровно столько, сколько мы согласовали."
10036005-60 = "Дело не в этом..."
10036005-61 = ""
10036005-63 = ""
10036005-64 = ""
10036005-65 = "(Если вычесть стоимость оборудования, патронов и прочих расходов, остаются копейки. На этой неделе я едва смогу поесть.)"
10036005-66 = "(Нужна работа с лучшей оплатой.)"
10036005-67 = ""
10036005-69 = ""
10036005-70 = "Хм, выглядишь не очень. Нужно больше денег?"
10036005-71 = "Премию дать не могу, но могу подкинуть ещё работу."
10036005-72 = "О?"
10036005-73 = "Ага, похоже, ты справишься. Интересует?"
10036005-74 = "...Конечно. Лишь бы счета оплачивать."
10036005-75 = "Хорошо. Тогда слушай."
10036005-76 = "Скоро состоится «Великий слёт союза бандитов в шлемах»."
10036005-77 = "...«Великий слёт союза»?"
10036005-78 = "Ага. Неловко признавать, я всё-таки офицер, но раньше мы, бандиты в шлемах, были мелкими местными шайками. Мелкой рыбёшкой."
10036005-79 = "Теперь всё изменится. Мы объединяемся, как один большой кулак."
10036005-80 = "И это хорошо, потому что у нас есть проблемы — например, эти горячие головы, сбежавшие из Исправительного бюро..."
10036005-81 = "*кхм* В общем, вернёмся к делу..."
10036005-82 = "«Великий слёт союза» будет огромным мероприятием, куда пригласят все отделения. По сути, фестиваль."
10036005-84 = "Вы хотите, чтобы я работала на фестивале?"
10036005-85 = "Верно."
10036005-86 = "Мы пригласили самого популярного диджея Чёрного рынка, и ему понадобится телохранитель-помощник."
10036005-87 = "И я думаю, ты идеально подходишь."
10036005-88 = "Что скажешь? Интересует? Платят хорошо, это я могу обещать."
10036005-89 = "Задание по сопровождению... Я не профессиональный телохранитель, но..."
10036005-90 = "...впрочем, выбора у меня сейчас немного."
10036005-91 = "Хорошо. Я согласна. Скажите только когда и где."
10036005-92 = "Правильное решение. Через три дня... на Пляже беззакония."
10036005-93 = ""
10036005-95 = ""
10036005-96 = "...Пляж?"
