[translation]
1802-1 = "Выходной Комитета правосудия, часть 2"
1802-2 = "Сад Тринити"
1802-3 = "За обедом с Клубом ценителей чистой литературы..."
1802-4 = "Вы читали недавно вышедший сборник стихов Ёсимото?"
1802-5 = "Да! Ёсимото идеально передала чувства женщины после расставания... Я была так тронута."
1802-6 = "..."
1802-7 = "Кстати, я слышала, что новое эссе Ногами выйдет в конце месяца."
1802-8 = "Правда? Предыдущее мне так понравилось... Не могу дождаться!"
1802-9 = "..."
1802-10 = "А... что насчёт тебя, Маширо? Какие книги тебе нравились в последнее время?"
1802-11 = "О-О, мне? Недавно я прочитала книгу под названием «Справедливость: поступать правильно»..."
1802-12 = "А что это за книга? Стихи? Эссе? Или, может, роман?"
1802-13 = "Ну, нет... Это книга с различными примерами того, как добиться справедливости..."
1802-14 = "А, значит, философия. Подходит твоему серьёзному характеру. Очень здорово."
1802-15 = "Если не возражаешь, можешь рассказать, о чём она?"
1802-16 = "Ну, тему книги немного сложно передать в двух словах..."
1802-17 = ""
1802-19 = "(Уф, какая пытка... Я просто хочу вернуться в Комитет правосудия...)"
1802-20 = "(Интересно, как там остальные...)"
1802-22 = "Встреча в Чайном клубе."
1802-23 = "Ого, Хасуми, ты отлично умеешь заваривать чай."
1802-24 = "Ага, это лучший чай, который я когда-либо пила!"
1802-25 = "По-моему, вкус чая очень сильно зависит от температуры воды и времени заваривания."
1802-26 = "Чтобы приготовить хороший чай, нужно придерживаться основ и точно следить за временем."
1802-27 = "В каждом твоём движении столько достоинства и изящества, Хасуми. Сразу видно, что ты из Комитета правосудия."
1802-28 = "Согласна! Ты так утончённо говоришь, а одежда такая элегантная!"
1802-29 = "Спасибо, но я пока не заслуживаю таких комплиментов. Мне ещё многому предстоит научиться."
1802-30 = "Кстати, у этих чайных листьев особенно приятный аромат. Откуда они?"
1802-31 = "Эти листья прислала академия Геенна в качестве подарка по обмену. Обычно их довольно трудно достать, поэтому Чаепитие поделилось с нами."
1802-32 = "...Геенна?!"
1802-33 = "Не могу поверить, что я так старательно заваривала чай из листьев, присланных этими мерзавцами!"
1802-34 = "Я лучше сточные воды выпью, чем ещё хоть каплю этого чая!"
1802-35 = "Пожалуйста, сожгите эти листья вместе с теми, что остались в саду. Не пейте эту дрянь!"
1802-36 = ""
1802-37 = "Ого, вице-президент Комитета правосудия вообще не знает пощады, когда дело касается Геенны!"
1802-38 = "Страшно..."
1802-40 = "На обычном понедельничном собрании Клуба сладостей после уроков."
1802-41 = "..."
1802-42 = "..."
1802-43 = "..."
1802-44 = ""
1802-45 = ""
1802-46 = "..."
1802-47 = "(Как неловко...)"
1802-48 = "(Что происходит?! Почему президент Комитета правосудия сидит здесь с нами?!)"
1802-49 = "(Не спрашивай меня! Понятия не имею...)"
1802-50 = "*вздыхает*"
1802-51 = "(Она только что вздохнула! Что это значит?!)"
1802-52 = "(Я же сказала! Не спрашивай меня... я не знаю!)"
1802-53 = ""
1802-54 = "(М-Может, мне с ней заговорить?)"
1802-55 = "(Ты с ума сошла? Она тебя живьём съест!)"
1802-56 = ""
1802-57 = "(Что?! Правда?!)"
1802-58 = "(По-моему, такого не случится...)"
1802-59 = "..."
1802-60 = "Кья-я-я-я!"
1802-61 = "(И-и-ик!)"
1802-62 = "(...?!)"
1802-63 = "(Ого! Ч-Что это было?! Что с ней такое?)"
1802-64 = "(Не знаю! Откуда мне знать?!)"
1802-65 = "..."
1802-66 = "..."
1802-67 = "(Ой-ой... Она замолчала.)"
1802-68 = "Гех..."
1802-69 = "Ге-хе-хе-хе-хе!"
1802-70 = ""
1802-72 = ""
1802-73 = "(Ужас...)"
1802-74 = "(Я уже вообще не понимаю, что происходит...)"
1802-75 = "(Я хочу домой...)"
1802-77 = "Сад Тринити"
1802-78 = "На следующий день."
1802-79 = "После выходного члены Комитета правосудия собрались в саду."
1802-80 = "Я и не представляла, насколько сложно разговаривать так же изящно, как обычные студенты Тринити."
1802-81 = "Почему-то после нашей чайной встречи люди начали меня избегать..."
1802-82 = "Цуруги! А у тебя как всё прошло?"
1802-83 = "...Хм?"
1802-84 = "А..."
1802-85 = "...Это была очень приятная встреча."
1802-86 = "Я рада, что все хорошо провели время."
1802-87 = "Хе-хе-хе!"
1802-88 = "Ке-хе-хе-хе-хе!"
1802-89 = "..."
1802-90 = "Похоже, было очень весело."
1802-91 = "Серьёзно?"
1802-92 = "Мне, конечно, не нравилось следовать плану Нагисы, но я рада, что Цуруги стало лучше."
1802-93 = "Приятно видеть, что Цуруги немного расслабилась."
1802-94 = "Интересно, Клуб сладостей думает так же..."
1802-95 = ""
1802-96 = ""
1802-97 = "Хе-хе-хе-хе!"
1802-98 = "Выходной Комитета правосудия"
