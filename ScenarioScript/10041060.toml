[translation]
10041060-1 = "Эпизод 6;Комната Старшей Сестры"
10041060-4 = ""
10041060-5 = ""
10041060-7 = "Алгоритм Старшей Сестры..."
10041060-9 = "Скажем так... это была моя ошибка. Хотя я никогда не собиралась развивать её дальше."
10041060-10 = "«Ошибка»...?"
10041060-11 = "Никогда не думала, что услышу ЭТО слово от тебя."
10041060-12 = "Это констатация факта. Сейчас я никогда бы не повторила эту ошибку, но тогда сделала это без колебаний."
10041060-13 = "В то время меня волновала только эффективность. Та я, какой была тогда... никогда бы не стала советоваться с тобой."
10041060-14 = "Ну а зачем вообще с кем-то советоваться, когда под рукой радары Алгоритма Старшей Сестры? Вся личная информация каждого гостя на территории кампуса — у тебя на ладони."
10041060-15 = "...И всё это я заблокировала и изолировала, когда покинула Миллениум, не собираясь никогда больше к этому прикасаться."
10041060-16 = "Но теперь другого пути нет. Нам ПРИДЁТСЯ прибегнуть к алгоритму, иначе всё выйдет из-под контроля."
10041060-17 = "И, разумеется, ответственность за это полностью лежит на мне."
10041060-18 = ""
10041060-20 = ""
10041060-22 = "Вам двоим не нужно об этом беспокоиться. Можете уходить."
10041060-23 = ""
10041060-26 = ""
10041060-27 = "...? Что?"
10041060-28 = "Стой-стой. Погоди. Что значит «уходить»?"
10041060-30 = "Я собираюсь совершить преступление. Вы двое к нему не причастны, и я хочу, чтобы так и осталось."
10041060-31 = "Я не это спросила. Если я уйду, кто полезет запускать алгоритм?"
10041060-32 = "Всё, что будет дальше, я сделаю сама."
10041060-33 = "Ты? Одна? Хочешь сама снова вломиться в Центр данных?"
10041060-34 = ""
10041060-36 = ""
10041060-37 = "Ты доказала, что это возможно, Нэру. Я последую твоему примеру и повторю твой маршрут."
10041060-38 = "Должна упомянуть, что для входа именно в ту комнату нужны мои биометрические данные. Иначе всё становится гораздо сложнее."
10041060-39 = "К слову, биометрический сканер действительно где-то сохраняет записи в данных... но это будет проблемой «на потом»."
10041060-40 = ""
10041060-42 = ""
10041060-43 = ""
10041060-44 = "Значит, сейчас или позже, но тебя легко могут поймать."
10041060-45 = "Я знаю, но прямо сейчас это неважно."
10041060-46 = "Важно."
10041060-47 = ""
10041060-49 = ""
10041060-50 = "Ты уже можешь быть подозреваемой в инцидентах с Инженерным отделом и Отделом разработки игр."
10041060-51 = "...Даже если так, это моя ответственность."
10041060-52 = "Я больше не могу подвергать других людей риску."
10041060-53 = ""
10041060-56 = ""
10041060-57 = "Хм."
10041060-58 = ""
10041060-61 = ""
10041060-62 = "А...?"
10041060-63 = "Я очень разочарована, Рио."
10041060-64 = "...Разочарована?"
10041060-65 = "Тем, как ты постоянно отодвигаешь меня в сторону."
10041060-66 = "В прошлый раз ты сказала, что «будет лучше, если меня там не окажется,» а теперь я ещё и «не причастна» ко всему этому."
10041060-67 = "Я могу понять, что один раз ты не пустила меня ради моей безопасности, но это уже становится закономерностью, и мне трудно не чувствовать себя немного задетой."
10041060-68 = "...?! О чём ты? Я вовсе не хотела—"
10041060-69 = ""
10041060-72 = ""
10041060-73 = "Ой, хватит строить мученицу. Ты ведь не взваливаешь всё на себя. Во-первых, всю беготню за тебя делаем МЫ. Знаешь, это одна из причин, почему люди говорят, что ты раздражаешь."
10041060-74 = ""
10041060-76 = ""
10041060-77 = "«Р-раздражаю»...?"
10041060-79 = "А. Наконец-то нашли что-то общее."
10041060-80 = "...И это всё, что я хотела здесь сказать."
10041060-81 = ""
10041060-84 = ""
10041060-85 = "Что общего? Что ты имеешь в виду?"
10041060-86 = "Ну, краткостью я не славлюсь, но позволь сказать прямо:"
10041060-87 = ""
10041060-89 = ""
10041060-90 = ""
10041060-92 = "Ни одна из нас не может доверить тебе эту работу, Рио."
10041060-93 = ""
10041060-96 = "*ахает*"
10041060-97 = "Вы не можете мне доверять...?"
10041060-98 = "Она права. Не можем. Ты ни за что туда не проберёшься незамеченной."
10041060-99 = "Ты просто собираешься «повторить мой маршрут»? Думаешь, этого достаточно?"
10041060-100 = "Если честно, я бы скорее отправила туда девчонку из Чаепития, чем тебя."
10041060-101 = "Сэя. Меня зовут Юризоно Сэя."
10041060-102 = "Точно, Сэя. Даже она справится лучше."
10041060-104 = "Э-Это..."
10041060-106 = "Рио, позволь сказать прямо."
10041060-107 = "Твои личные чувства ставят миссию под угрозу. Проникновение — наша область, не твоя."
10041060-108 = "Пусть это и твоя машина, исключать нас из-за этого совершенно нерационально."
10041060-109 = "Хорошо сказано. Я как раз собиралась сказать то же самое."
10041060-110 = "Внутрь пойдём мы. Найдём твою машину, соберём всю нужную информацию..."
10041060-111 = "...а потом СЛОМАЕМ машину, прежде чем кто-нибудь ещё сможет ей воспользоваться."
10041060-112 = "Так выиграют все трое: ты, я и..."
10041060-113 = ""
10041060-115 = ""
10041060-116 = "...Сэя, точно. Понятно?"
10041060-117 = ""
10041060-120 = ""
10041060-121 = "*ворчит*"
10041060-122 = "Это единственный способ всё сделать. Единственный способ положить этому конец."
10041060-123 = "Теперь у меня сложилось впечатление, что находиться рядом с тобой может быть очень... утомительно."
10041060-124 = "И я знаю, что многие могли бы сказать то же самое обо мне, но всё же утверждаю, что ты ещё хуже."
10041060-126 = "А ты ОТЛИЧНО разбираешься в людях."
10041060-127 = "Вы двое, не могли бы...?"
10041060-128 = "Слушай, времени мало. Всё, что осталось обсудить, обсудим по дороге или когда закончим."
10041060-129 = "Мне НРАВИТСЯ, когда ты говоришь прямо. Ты обычно такая?"
10041060-130 = "К сожалению, нет. Мне говорили, что моя обычная манера речи может сильно раздражать."
10041060-131 = "Может, когда всё это закончится, я тебе продемонстрирую."
10041060-132 = "Ха-ха! Ладно, только пока не раздражай меня. Я бью людей."
10041060-134 = "Э-Это..."
10041060-135 = ""
10041060-137 = ""
10041060-138 = ""
10041060-139 = "...А? Эй, ты что делаешь?"
10041060-140 = ""
10041060-142 = ""
10041060-143 = ""
10041060-145 = "...Поторопись и веди."
