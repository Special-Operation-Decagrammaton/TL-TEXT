[translation]
10028060-1 = "Эпизод 6;Усилия важнее таланта"
10028060-3 = "Ха-ха..."
10028060-4 = ""
10028060-6 = ""
10028060-7 = ""
10028060-8 = ""
10028060-9 = ""
10028060-10 = ""
10028060-13 = ""
10028060-14 = ""
10028060-15 = "Хаха... Хахаха..."
10028060-16 = "Не помню, когда в последний раз так выматывалась. Хотя после всего произошедшего это неудивительно."
10028060-17 = "Ну, эм, мы справились! Ура! Мы уже в головном вагоне, значит теперь осталось только остановить поезд, верно?"
10028060-18 = "Ха-ха-ха!"
10028060-19 = "[s1] «И-Ичика? Ты в порядке...?»\n[s2] «Кажется, реликвия всё-таки разбилась...»"
10028060-22 = "Хаха. Ага. Реликвия, реликвия..."
10028060-23 = ""
10028060-25 = ""
10028060-27 = ""
10028060-29 = ""
10028060-30 = ""
10028060-32 = ""
10028060-34 = "Знаете что, да кому не плевать? Какая разница, чашка это или ночной горшок, попадёт мне или меня вообще уволят? Теперь это уже не в моих руках."
10028060-35 = "В свою защиту скажу: мне велели просто её принести. Никто не говорил, что она должна быть целой. Так что... может, отделаюсь предупреждением? Хаха! Хахахаха!"
10028060-36 = "Хах... Хахаха..."
10028060-37 = "..."
10028060-38 = "*вздыхает*"
10028060-39 = "Мне сейчас кажется, что я немного схожу с ума."
10028060-40 = "Простите, Сенсей. Сегодня всё пошло совсем не по плану."
10028060-41 = "В этот раз я действительно вляпалась. То есть всё превратилось в полный кошмар."
10028060-42 = "Если честно, я немного хотела покрасоваться перед вами... Ну и отлично получилось."
10028060-43 = "Я обещала показать вам себя с лучшей стороны, а показала самую худшую из возможных."
10028060-44 = "... *вздох*"
10028060-45 = "Не могу поверить, что настолько потеряла контроль. Ух..."
10028060-46 = "Почему я такая? Что со мной не так? Это так жалко..."
10028060-47 = ""
10028060-50 = "...Хм?"
10028060-51 = "...Вы не считаете меня жалкой? Но..."
10028060-52 = "Но раньше я ведь допустила довольно серьёзную ошибку... Не сходится..."
10028060-53 = "Разве нет? Я ведь очень сильно облажалась?"
10028060-54 = "...Технически — да?"
10028060-55 = "Вот! Вы со мной согласны! Тогда почему всё ещё так меня поддерживаете?"
10028060-56 = "Но...?"
10028060-57 = "Но что?"
10028060-58 = "[s] «Ну...»"
10028060-59 = ""
10028060-62 = "[ns3] «Эта Касуми нас хорошенько вымотала, да? Хахаха!»\n[ns4] «Мне это понравилось не меньше, чем тебе! Так что я тоже соучастник!»"
10028060-65 = ""
10028060-66 = "...Ха."
10028060-67 = "Хаха! Хахаха!"
10028060-68 = "Не может быть! Вы чувствовали то же самое, Сенсей? Боже, значит я не сумасшедшая!"
10028060-69 = "Вы понимаете? Как вообще можно было всё это терпеть?! А я терпела! Так долго!"
10028060-70 = "Да, вы правы! Она действительно нас достала! Я достаточно натерпелась! Хахахаха!"
10028060-71 = "[s5] «Хахахахаха!»\n[s6] «Вахахаха!!!»"
10028060-72 = "Ха-ха-ха-ха-ха!"
10028060-73 = "Мне не нравится, как вы смеётесь..."
10028060-74 = ""
10028060-76 = ""
10028060-77 = "А-а-ах. Полегчало."
10028060-78 = "Ну, что есть, то есть. О последствиях буду переживать, когда придётся с ними столкнуться."
10028060-79 = "Ни о чём не переживайте, Сенсей. Я обязательно укажу в отчёте, что у вас не было другого выбора, кроме как помочь мне."
10028060-80 = "...А?"
10028060-81 = "Что вы имеете в виду? Вы хотите пойти со мной куда...?"
10028060-82 = "На Чаепитие?"
10028060-83 = "...Почему?"
10028060-84 = "[s7] «Я пойду с тобой. Извинимся вместе.»\n[s8] «Я не могу отправить тебя одну в логово льва, Ичика.»"
10028060-87 = "...?"
10028060-88 = "Зачем вы такое говорите? Это была моя вина. Вам не за что извиняться."
10028060-89 = "Если бы я с самого начала не отправила сумку не в тот груз, ничего этого бы не произошло."
10028060-90 = "Всё случилось из-за меня и моего ужасного характера. Так почему вы считаете, что тоже должны извиняться?"
10028060-91 = "[s9] «А? Ичика, у тебя отличный характер.»\n[s10] «Ужасный характер? У тебя? Ха!»"
10028060-94 = "Вы говорите глупости. Знаете, всегда нужно говорить искренне."
10028060-95 = "Я знаю, что у меня вспыльчивый характер и ещё более скверная натура. Поэтому моя обязанность — не делать это проблемой для других."
10028060-96 = "Но, ну, вы сами всё увидели. В конце концов я всегда теряю самообладание."
10028060-97 = "Вот такая я на самом деле. Я просто очень стараюсь казаться весёлой и беззаботной, чтобы скрыть, насколько всё внутри меня нестабильно."
10028060-98 = "Я думала, уж вы-то, Сенсей, сможете сложить два и два и понять, какая я на самом деле неприятный студент."
10028060-99 = "Или вы просто не хотите сказать мне правду в лицо?"
10028060-100 = "...Вы честно говорите? Я не понимаю..."
10028060-101 = "[s11] «Ичика, ты ведь очень-очень старалась всё это терпеть, правда?»\n[s12] «Ты всегда изо всех сил стараешься поступать правильно. Вот что важно.»"
10028060-104 = ""
10028060-106 = ""
10028060-107 = "...Ого..."
10028060-108 = "Эм... Ох."
10028060-109 = "Ха..."
10028060-110 = "Ого..."
10028060-111 = "Хаха... Ха!"
10028060-112 = "Мне немного трудно понять вашу точку зрения. В неё сложно поверить."
10028060-113 = "Вы в прошлой жизни адвокатом были? Умеете же вы подобрать слова."
10028060-114 = "Это... правда..."
10028060-115 = "Из-за вас мне даже возразить толком нечего... Хаха..."
10028060-116 = "Если вы так это преподносите..."
10028060-117 = "Ладно. Да. Наверное, тут мне нечего возразить. Хм. Такое чувство, будто я всё это время несла огромный груз и стыд, а теперь наконец могу хотя бы немного их отпустить."
10028060-118 = "Если честно, я чувствую себя немного беззащитной. Но ощущение не самое плохое."
10028060-119 = "Мм..."
10028060-120 = "...Ох."
10028060-121 = "Ха-ха."
10028060-122 = "Я очень рада, что сегодня взялась за эту работу, Сенсей."
10028060-123 = "То есть сама работа прошла не сказать чтобы хорошо..."
10028060-124 = "Но, эм, вы ведь сказали, что пойдёте со мной, да? Поможете всё объяснить Нагисе?"
10028060-125 = "Сегодня я совсем обнаглела и прошу вашей помощи. Хахаха!!"
10028060-126 = ""
10028060-128 = ""
10028060-129 = "Эм... Сенсей."
10028060-130 = "Мы уже давно прошли точку невозврата."
10028060-131 = "Раз уж я прошу о помощи, можно мне попросить ещё кое о чём? Пожалуйста."
10028060-132 = "Если вы не против... Если для вас это нормально, я всё ещё..."
10028060-133 = "Вы единственный, кто видел мою вспыльчивую сторону."
10028060-134 = "Если бы вы могли сохранить это в секрете от всех в Тринити..."
10028060-135 = "[s13] «Твой секрет в безопасности со мной.»\n[s14] «Пока сама не будешь готова рассказать другим, я никому не скажу.»"
10028060-138 = ""
10028060-140 = ""
10028060-141 = ""
10028060-142 = ""
10028060-143 = ""
10028060-144 = ""
10028060-145 = ""
10028060-146 = ""
10028060-147 = "...Ничего себе."
10028060-148 = "Иногда кажется, что вы знаете меня лучше, чем я сама."
10028060-149 = "Немного раздражает, когда меня читают как открытую книгу, но в то же время это даже приятно."
10028060-150 = "Когда речь заходит о вас, у меня столько противоречивых чувств."
10028060-151 = ""
10028060-153 = ""
10028060-154 = "Например, мне нравится, что вы позволяете мне на вас полагаться, но нельзя же постоянно так делать! Вы меня совсем разбалуете."
10028060-155 = "Я серьёзно! Правда. Это ощущается немного... опасно."
10028060-156 = "Когда вы рядом, у меня постоянно появляется какое-то смутное чувство спокойствия, будто уже неважно, сделаю я всё идеально или нет."
10028060-157 = "Ух. Я сейчас веду себя как настоящий ребёнок. Как же стыдно."
10028060-158 = "То есть... Наверное, в каком-то смысле это даже приятно..."
10028060-159 = ""
10028060-161 = ""
10028060-162 = ""
10028060-163 = "...А?"
10028060-164 = "Подождите. Что это?"
10028060-165 = "Видите, Сенсей? Вон то. Там, у моста через реку. Видите?"
10028060-166 = "Это ведь...?"
10028060-167 = ""
10028060-169 = ""
10028060-172 = "[ns15] «Отдел горячих источников...»\n[ns16] «Это что, целая куча взрывчатки?!»"
10028060-175 = ""
10028060-176 = "Эм..."
10028060-177 = "Что?"
10028060-178 = "И что именно они собираются делать со всей этой взрывчаткой?"
10028060-179 = "Их президент находится на борту этого поезда!"
10028060-180 = "Подождите... Президент... в поезде...?"
10028060-181 = ""
10028060-183 = ""
10028060-184 = "Ах."
10028060-186 = ""
10028060-187 = "По первоначальному плану, если бы мне не удалось отцепить транспортный вагон и сбежать, я бы сразу перешла к плану Б..."
10028060-188 = ""
10028060-189 = "Который включал сход поезда с рельсов с помощью бомбы, использование хаоса и связь с другими членами клуба, чтобы организовать мой побег, но..."
10028060-190 = ""
10028060-191 = "Вахахаха! Если будете так на меня смотреть, вы заденете мои чувства, Сенсей!"
10028060-192 = ""
10028060-193 = "Не переживайте. Пока я всё ещё здесь, я им этого не позволю!"
10028060-194 = ""
10028060-195 = "Пока я здесь!"
10028060-196 = ""
10028060-197 = ""
10028060-198 = "Пустить... поезд под откос..."
10028060-199 = ""
10028060-201 = ""
10028060-202 = ""
10028060-203 = ""
10028060-204 = "Этого не случится! Пока я всё ещё здесь!"
10028060-205 = ""
10028060-207 = ""
10028060-208 = ""
10028060-209 = ""
10028060-210 = "...Пока «я здесь»!"
10028060-211 = ""
10028060-213 = ""
10028060-214 = ""
10028060-215 = "Ах... Ха..."
10028060-216 = "Так вот что она имела в виду. С ней никогда не знаешь наверняка."
10028060-217 = "[s17] «Она единственная, кто может приказать им остановиться.»\n[s18] «Это был план побега Касуми...»"
10028060-220 = "Хаха. Хахаха..."
10028060-221 = "Она просто... Боже мой..."
10028060-223 = "Она во всём заходит слишком далеко. Всем сердцем и всей душой я это ненавижу."
10028060-224 = ""
