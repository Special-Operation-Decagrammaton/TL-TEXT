[translation]
2005903-1 = "Бесёнок и перекупщики"
2005903-2 = "Той ночью мы с Муцуки отправились на Чёрный рынок."
2005903-3 = ""
2005903-7 = "Сюда, Сенсей. Пойдём!"
2005903-10 = "[ns] «Давно я не был в магазине Чёрного рынка.»"
2005903-11 = "Слышала, туда только что завезли новую бомбу. Очень хочу добавить её в коллекцию."
2005903-12 = "Представьте: радужная дымовая завеса. Не только весело, она ещё дезинфицирует помещение И убивает большинство домашних вредителей!"
2005903-13 = "Все комары, прячущиеся у меня в комнате, не просто вкусят радугу — они в ней УМРУТ!"
2005903-14 = "Ну как? Очень практично, правда?"
2005903-15 = "[s] «Да! Может, и мне взять?»"
2005903-16 = "Куфуфу. Вам тоже понравилась идея, Сенсей? Тогда запасёмся!"
2005903-17 = "На ней радужная этикетка, должна сразу бросаться в глаза..."
2005903-18 = "...А?"
2005903-19 = ""
2005903-21 = ""
2005903-22 = ""
2005903-23 = "Что происходит? Её нет. Где...?"
2005903-24 = "[s] «Не только радужной — вообще НИКАКИХ нет.»"
2005903-25 = "Ищете бомбы?"
2005903-26 = "Извините. Банда Шлемов скупила всё."
2005903-27 = "[s] «Банда Шлемов?»"
2005903-28 = "Ага. Остались только муляжи. Они... тоже по-своему внушительные."
2005903-29 = "Но если хотите, могу отложить для вас, когда придёт новая партия."
2005903-30 = "Разумеется, не бесплатно. Хе-хе-хе."
2005903-31 = "Ахаха, обойдусь."
2005903-32 = "Похоже, это будет слишком хлопотно..."
2005903-33 = "Пойдём, Сенсей. Здесь всё выгребли."
2005903-37 = "Куфуфу. А это уже пахнет делом."
2005903-38 = "Придётся немного поспрашивать. Посмотрим, что здесь НА САМОМ ДЕЛЕ происходит."
2005903-40 = ""
2005903-41 = ""
2005903-43 = ""
2005903-44 = ""
2005903-45 = ""
2005903-47 = "Последовало короткое расследование..."
2005903-49 = "Похоже, продавец говорил правду. Банда Шлемов скупила все бомбы."
2005903-50 = "И, судя по всему, теперь продаёт их намного дороже розницы."
2005903-51 = "Несколько студентов жаловались, что с них дерут втридорога. Платить наценку не хотелось, но пришлось! Бомбы — предмет первой необходимости."
2005903-52 = "Такими темпами..."
2005903-53 = "...мы будем жить в раю перекупщиков. Нельзя этого допустить, Сенсей."
2005903-54 = "[s] «Перекупщики бомб — это что-то новенькое...»"
2005903-55 = "Сенсей! Найдём этих перекупщиков!"
2005903-56 = "И у меня как раз есть идея!"
2005903-58 = "Через несколько дней мы встретились снова..."
2005903-60 = "Секретный склад Банды Шлемов"
2005903-61 = "Уже почти время..."
2005903-62 = "Ха! Не знаю, что за лох, но он хочет купить ВСЕ наши бомбы? Вот это куш!"
2005903-63 = "Не расслабляйся. Может быть ловушка."
2005903-64 = ""
2005903-66 = ""
2005903-67 = "А? Они пришли."
2005903-68 = ""
2005903-70 = ""
2005903-71 = "[ns] «Сюда, миледи.»"
2005903-72 = ""
2005903-75 = "..."
2005903-76 = "О-о, выглядит так, будто у неё денег куры не клюют...!"
2005903-77 = "Эй. Ты покупатель?"
2005903-78 = "[s1] «Прошу прощения! Вы разве не знаете?»\n[s2] «Это леди Капелла из семьи Каппеллини!»"
2005903-81 = "Семья Каппеллини...? Слышала о таких?"
2005903-82 = "Выглядите как уважаемая леди. Зачем вам столько бомб?"
2005903-83 = "Скучно. Уныло. Какой банальный вопрос."
2005903-84 = "Какая тебе разница? Я сделаю с ними всё, что захочу."
2005903-85 = "Тебе нужно лишь взять мои деньги, отдать товар и уползти обратно в канализацию."
2005903-86 = "Д-Думаю, вы правы."
2005903-87 = "Разумеется, права. Теперь отдавай. Я хочу как можно скорее покинуть эту ПОМОЙКУ."
2005903-88 = "Ого. Мы реально позволяем ей так с нами разговаривать?"
2005903-89 = "Цк, заткнись!"
2005903-90 = "Ладно, покажите деньги!"
2005903-91 = "Хмф. Какие подозрительные крыски."
2005903-92 = ""
2005903-94 = ""
2005903-95 = "Дворецкий [USERNAME]. Откройте сумку."
2005903-96 = "[s] «Да, миледи.»"
2005903-100 = ""
2005903-101 = "Деньги настоящие, да?"
2005903-102 = "Конечно. Только не говори, что кто-то твоего... уровня не отличает подделку от оригинала?"
2005903-103 = "Эй, может, настоящие только сверху. Подвинься! Я сама проверю."
2005903-104 = "[s] «Хватит. Теперь наша очередь.»"
2005903-105 = "Именно. А теперь слушайте внимательно."
2005903-106 = "Покажите бомбы, которые принесли. Лапать мои деньги своими грязными руками сможете после того, как я увижу товар."
2005903-107 = "Хмф. Ладно."
2005903-108 = ""
2005903-110 = ""
2005903-113 = "Они подняли брезент, открыв ящики и ящики с бомбами."
2005903-115 = "И я должна поверить, что ВОТ ЭТО настоящее? В магазинах продаются декоративные."
2005903-116 = "Ч-Что делать?"
2005903-117 = "Пусть проверит одну."
2005903-118 = "Х-Хорошо! Сюда!"
2005903-119 = ""
2005903-121 = ""
2005903-122 = ""
2005903-123 = ""
2005903-124 = ""
2005903-125 = ""
2005903-126 = "Подтверждаю. Настоящее ни с чем не перепутаешь, да?"
2005903-127 = ""
2005903-129 = ""
2005903-130 = "Куфуфу. Сенсей. Они сложили всё в одном месте. Будет легко."
2005903-131 = "Куча взрывчатки в крошечном пространстве. Ничего не напоминает?"
2005903-132 = "[s3] «Понятно...»\n[s4] «Мне спрятаться где-нибудь в безопасном месте?»"
2005903-135 = "Даю три секунды."
2005903-136 = "Раз, два..."
2005903-137 = "Эй! О чём вы там шепчетесь...?"
2005903-138 = "Три!"
2005903-139 = "А?"
2005903-140 = ""
2005903-144 = "В-Вы сумасшедшие?! Эта штука нестабильная! Е-Если продолжишь стрелять—"
2005903-145 = "Тогда мы все... взле... ТЫДЫЩ!"
2005903-146 = "Но какая разница? Главное — послание!"
2005903-147 = "Т-Ты! Так ты действительно не собиралась покупать—?"
2005903-148 = ""
2005903-152 = "А-А-а...! Бежим...!!"
2005903-153 = ""
2005903-159 = "Куфуфу! Вот и всё. Перекупщики из Банды Шлемов и их жалкое подобие бизнеса уничтожены."
2005903-160 = "Держу пари, больше они бомбы перепродавать не будут!"
2005903-162 = ""
2005903-163 = "Ах, было весело. Так приятно применить навыки, насладиться хобби... и ещё преподать им урок!"
2005903-164 = "Верно, Сенсей?"
2005903-165 = "[s5] «Именно так, миледи.»\n[s6] «Теперь вы можете продолжать свою здоровую коллекцию бомб.»"
2005903-168 = "Ахахаха! Сенсей! Из вас забавный дворецкий!"
2005903-170 = "Когда всё успокоилось, мы прибрали место и ушли."
2005903-171 = "Я надеялся, что на этом шалости закончатся..."
