[translation]
10001085-1 = "Эпизод 8; Третья победа!"
10001085-2 = "Главная улица академии Красная Зима"
10001085-3 = "Я-я уже думала, что мне руки сломают..."
10001085-4 = "Президент Черино! Вы в порядке?"
10001085-5 = "Уа-а-а! Томоэ! Товарищ! *всхлип* Мне было так страшно!"
10001085-7 = "Хмф, это был идеальный шанс избавиться от неё..."
10001085-8 = "Не мешайте, Сенсей! Даже если вы учитель, я не позволю вам вмешиваться в нашу революцию!"
10001085-9 = "Пожалуйста, успокойтесь. Мы не хотим сражаться с Рабочей партией."
10001085-10 = "Если ваша цель — свергать тиранов, вам следует быть с нами, а не против нас!"
10001085-11 = "В нынешнем состоянии какую угрозу вашей революции представляет президент Черино?"
10001085-12 = "Я понимаю, что Черино никогда не работает и целыми днями спит и перекусывает..."
10001085-13 = "...и точно слишком любит раздавать взыскания, когда что-то идёт не по её воле."
10001085-14 = "Г-главный секретарь Томоэ, ты правда обо мне такого мнения?"
10001085-16 = "Хмф. Лидер отвечает за ошибки своих подчинённых! Поэтому всё плохое в академии Красная Зима — твоя вина как её лидера, товарищ Черино!"
10001085-17 = "Затянувшийся ремонт Старого института, нехватка пудинга, сегодняшний холод — всё из-за Черино!"
10001085-18 = "Все провалы нашей академии доказывают вину президента Черино в преступлениях против студентов Красная Зима!"
10001085-19 = "Это безумие! Тогда получается, что виноват всегда тот, кто у власти!"
10001085-20 = "Именно! Вся суть этой борьбы — изменить баланс власти!"
10001085-21 = "Пока академией правит один человек, этот конфликт никогда не закончится!"
10001085-22 = "Что за...? Это вообще что за революция?"
10001085-23 = "[s] «Вы ведь знаете, что Черино больше не у власти, да?»"
10001085-24 = "Что? Если товарищ Черино не президент, то кто?"
10001085-25 = "Ненавижу это признавать, но... нынешний президент — председатель Марина."
10001085-26 = "Я, во всём своём величии, вынуждена скрываться с тех пор, как она устроила свой подлый переворот!"
10001085-27 = "Не уверена, что тебе стоит говорить это с такой гордостью, Черино."
10001085-28 = "То есть теперь всем заправляет председатель Марина, а Черино здесь — просто бессильная мелкая соплячка...?"
10001085-29 = "Как ты меня только что назвала?!"
10001085-30 = "Слушайте все! У нас новая цель!"
10001085-31 = "Забудьте об этой глупой мелкой соплячке — наша новая цель, новый президент, председатель Марина!"
10001085-32 = "Ты опять назвала меня мелкой соплячкой! Да ещё и глупой!"
10001085-33 = "Такую наглость больше нельзя игнорировать! Взыскания! Все будете наказаны!"
10001085-34 = "Хорошо, товарищи. За права и свободы рабочих и... э-э, по множеству других причин..."
10001085-35 = "...штурмуем секретариат!"
10001085-37 = ""
10001085-38 = "ДА-А-А!"
10001085-40 = "Они меня вообще проигнорировали..."
10001085-41 = "Рабочая партия и правда столь грозна, как о ней говорят, но то, что теперь они практически на вашей стороне, несомненно, нам на руку."
10001085-42 = "Идёмте, президент Черино. Они уже ведут нас к секретариату!"
10001085-43 = ""
10001085-44 = "П-погодите! Это я должна идти впереди! Я здесь главная!"
