[translation]
83302300200-5 = ""
83302300200-6 = "Ако? Что происходит? Я только вернулась — с Префектурной командой что-то случилось?"
83302300200-7 = "Г-глава префектов! Чрезвычайная ситуация!"
83302300200-8 = "Поступили сообщения о «гигантском монстре», напавшем на один из парков Геенны!"
83302300200-9 = "Не знаю, что именно это должно означать, но других подробностей у меня нет!"
83302300200-10 = "...Нет, думаю, я прекрасно понимаю, что происходит."
83302300200-11 = "Как и ожидалось...!"
83302300200-12 = "Постой, что...?"
83302300200-13 = "Дай мне местоположение парка. Я немедленно туда отправлюсь."
