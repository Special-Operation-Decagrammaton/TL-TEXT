[translation]
11040-2 = "Episódio 4;A Situação do Comitê"
11040-3 = "Comitê de Contramedidas — Sala de Aula"
11040-4 = "Bem-vindas de volta. Bom trabalho, pessoal."
11040-5 = "Chegamos~."
11040-6 = "Você também mandou bem como operadora, Ayane-chan."
11040-7 = "O problema urgente com a Gangue dos Capacetes Katakata foi resolvido.#nParece que finalmente podemos respirar um pouco."
11040-8 = "É verdade. Agora finalmente podemos focar no problema principal."
11040-9 = "Sim! Graças ao Sensei, agora podemos nos dedicar de corpo e alma a pagar a dívida!"
11040-10 = "Obrigada, Sensei! Nunca vou esquecer o que você fez por nós!"
11040-12 = "[ns] \"Pagar a dívida?\""
11040-13 = "...A-Ah, opa!"
11040-14 = "I-Isso é..."
11040-15 = "E-Espera!! Ayane-chan, não fala mais nada!"
11040-16 = "...!"
11040-17 = "Não tem problema, Serika-chan. Não é como se fosse algo que a gente precisasse esconder."
11040-18 = "M-Mas também não é algo que a gente precise sair contando por aí!"
11040-19 = "Não é como se a gente tivesse cometido algum crime, né~? Além disso, o Sensei é o adulto que nos ajudou, não é~?"
11040-20 = "A Hoshino-senpai tem razão. Serika, acho que podemos confiar no Sensei."
11040-21 = "I-Isso até pode ser, mas no fim das contas o Sensei ainda é alguém de fora!"
11040-22 = "É verdade que talvez não seja um problema que o Sensei consiga resolver num piscar de olhos.#nMas o Sensei é praticamente o único adulto disposto a nos ouvir, né~?"
11040-23 = "Se a gente desabafar, quem sabe não aparece uma solução~?#nOu será que você tem alguma ideia melhor, Serika-chan~?"
11040-24 = "A-Argh..."
11040-25 = "M-Mas é um adulto que acabou de chegar! Quando foi que os adultos se importaram com o que ia acontecer com esta escola?!"
11040-26 = "Sempre fomos só nós que demos um jeito nos problemas desta escola! E agora, do nada, aparece um adulto querendo se meter..."
11040-27 = "Eu não aceito isso!!"
11040-29 = "Serika-chan?!"
11040-30 = "Eu vou lá ver como ela está."
11040-33 = "..."
11040-34 = "Bem, resumindo a história... esta escola tem uma dívida~.#nBom, nada muito incomum, né."
11040-35 = "Só que o problema é o valor... gira em torno de uns 900 milhões de ienes~."
11040-36 = "...São 962 milhões e 350 mil ienes."
11040-37 = "Esse é o valor que Abydos... não, que nós do \"Comitê de Contramedidas\" precisamos pagar."
11040-38 = "Se não conseguirmos pagar, a escola vai passar para as mãos do banco e não teremos escolha a não ser iniciar o processo de fechamento."
11040-39 = "Porém, a chance de realmente quitarmos tudo é praticamente 0%...#nA maioria das alunas desistiu, abandonou esta escola e a cidade, e foi embora..."
11040-40 = "E só nós restamos."
11040-41 = "O risco de a escola fechar, o sumiço das alunas,#ne a cidade estar virando uma cidade-fantasma... na verdade, tudo isso é culpa desta dívida."
11040-42 = "[s] Peço para que expliquem a situação."
11040-43 = "O motivo de termos contraído essa dívida? Bem..."
11040-45 = "Há algumas décadas, ocorreu uma tempestade de areia no deserto nos arredores deste distrito escolar."
11040-46 = "Tempestades de areia já eram frequentes por aqui, mas aquela teve uma escala inimaginável."
11040-47 = "Várias partes do distrito ficaram soterradas, e mesmo depois que a tempestade passou, a areia continuou se acumulando."
11040-48 = "Para superar esse desastre natural, nossa escola foi obrigada a investir uma quantia enorme de dinheiro..."
11040-49 = "Mas não foi nada fácil encontrar um banco disposto a fazer um empréstimo tão alto para uma escola de interior como a nossa..."
11040-51 = "No fim, não houve outra saída a não ser recorrer a financeiras desonestas."
11040-52 = "...Sim. Acredito que, no início, o plano era quitar tudo rapidamente."
11040-53 = "Mas, depois disso, as tempestades de areia voltaram todos os anos, cada vez maiores... Apesar de todos os esforços da escola, a situação do distrito só piorou até ficar fora de controle..."
11040-54 = "...E, por fim, mais da metade de Abydos foi engolida pela areia e virou deserto, enquanto a dívida só crescia sem parar..."
11040-55 = "..."
11040-56 = "..."
11040-57 = "Só com as nossas forças, mal conseguimos pagar os juros mensais...#nTanto nossa munição quanto nossos suprimentos já chegaram ao fim."
11040-58 = "A Serika está tão na defensiva assim porque ninguém nunca encarou esse problema a sério antes. Você é a primeira pessoa a nos ouvir, Sensei."
11040-59 = "...Bom, é essa a história chata."
11040-60 = "E agora que o problema chato da Gangue dos Capacetes foi resolvido graças ao Sensei,#npodemos focar 100% em pagar a dívida~."
11040-61 = "Mesmo se você aceitar ser o conselheiro deste comitê, não precisa se preocupar com a dívida, tá~?#nSó de ter parado para nos ouvir já somos muito gratas."
11040-62 = "É verdade. O Sensei já nos ajudou o bastante.#nNão podemos dar ainda mais trabalho."
11040-65 = "[ns1] Digo que também faço parte do Comitê de Contramedidas e vou me esforçar junto com elas.\n[ns2] Digo que não vou abandonar o Comitê de Contramedidas e ir embora."
11040-66 = "I-Isso quer dizer..."
11040-67 = "I-Isso quer dizer..."
11040-68 = "A-Ah, sim! Contamos com você, Sensei!"
11040-69 = "Oho, o Sensei também é bem excêntrico, hein~? Se metendo por conta própria numa enrascada dessas."
11040-70 = "Que alívio... Ter o apoio da \"Schale\" é incrível. Com isso, nós também#npodemos ter esperança, não é?"
11040-71 = "É verdade. Talvez a gente comece a enxergar alguma esperança."
11040-73 = "..."
11040-74 = "...Hmph."
11040-80 = "Serika-chan... onde será que ela está...?"
11040-82 = "Próximo;Um Dia Comum de Serika"
