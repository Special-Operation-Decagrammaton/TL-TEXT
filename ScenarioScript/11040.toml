[translation]
11040-2 = "Эпизод 4;Тяжёлое положение комитета"
11040-3 = "Комната Комитета по предотвращению закрытия"
11040-4 = "С возвращением, все. Отлично сегодня поработали."
11040-5 = "Мы вернулись!"
11040-6 = "Спасибо, Аяне. Ты тоже молодец."
11040-7 = "Мы наконец разобрались с Бандой шлемов Ката-Ката. Теперь всё должно пойти как по маслу."
11040-8 = "Верно. Наконец можно вернуться к более важным делам."
11040-9 = "Ха-ха! И всё благодаря Сенсею. Теперь нам остаётся только выплатить долг!"
11040-10 = "Спасибо за помощь, Сенсей. Мы не забудем, что вы для нас сделали!"
11040-11 = ""
11040-12 = "[ns]«Долг?»"
11040-13 = "Погодите... Чёрт!"
11040-14 = "Н-ну, дело в том, что..."
11040-15 = "Стой! Ни слова больше, Аяне!"
11040-16 = "...!"
11040-17 = "Почему, Сэрика? Это же не секрет."
11040-18 = "Это не значит, что нужно рассказывать об этом всем подряд!"
11040-19 = "Мы ведь ни в чём не виноваты. К тому же теперь Сенсей один из нас."
11040-20 = "Хошино права, Сэрика. Сенсею можно доверять."
11040-21 = "Я знаю, но всё равно это человек со стороны."
11040-22 = "Я не говорю, что Сенсей решит эту проблему за нас, но это единственный взрослый, к которому мы можем обратиться."
11040-23 = "Может, если обсудим всё с Сенсеем, вместе придумаем решение.#nИли у тебя есть идея получше, Сэрика?"
11040-24 = "Ну..."
11040-25 = "Сенсей просто взял и появился из ниоткуда! С чего вообще взрослому переживать о наших проблемах?"
11040-26 = "Мы всегда справлялись сами! Зачем нам вдруг понадобился надзор?"
11040-27 = "Я не могу с этим смириться!"
11040-29 = "Сэрика?"
11040-30 = "Я пойду с ней поговорю."
11040-33 = "..."
11040-34 = "Вернёмся к делу... Наша школа задолжала кредитной компании довольно крупную сумму. Проблема серьёзная, хотя сама по себе не такая уж редкая."
11040-35 = "Настоящая проблема в том... что долг превышает 900 миллионов иен."
11040-36 = "Если точно — 962 350 000 иен."
11040-37 = "Именно столько Абидос... нет. Именно столько Комитет по предотвращению закрытия взял на себя обязательство вернуть."
11040-38 = "Если мы не расплатимся, кредитная компания заберёт школу за долги и закроет её."
11040-39 = "Но шанс выплатить настолько огромный долг практически равен нулю.#nПоэтому большинство студентов покинули школу и город..."
11040-40 = "Все, кроме нас."
11040-41 = "Школа на грани закрытия, студенты уехали, город опустел — всё из-за долга."
11040-42 = "[s] Спросить, что произошло."
11040-43 = "Вы спрашиваете, как вообще появился этот долг?"
11040-45 = "Несколько лет назад в пустыне вокруг школы разразилась песчаная буря."
11040-46 = "В районе Абидоса песчаные бури — обычное дело, но та оказалась особенно разрушительной."
11040-47 = "Некоторые районы полностью засыпало песком, и он продолжал прибывать."
11040-48 = "Школе пришлось срочно искать огромные средства на ликвидацию последствий..."
11040-49 = "...но ни один банк не соглашался выдать настолько крупный кредит."
11040-50 = ""
11040-51 = "Поэтому школе пришлось обратиться к ростовщикам..."
11040-52 = "Да. Школа рассчитывала быстро вернуть деньги..."
11040-53 = "...но с каждым годом песчаные бури становились всё сильнее. Несмотря на все усилия школы, ситуация только ухудшалась."
11040-54 = "Сегодня больше половины Абидоса погребено под песком, а долг продолжает расти."
11040-55 = "..."
11040-56 = "..."
11040-57 = "Мы едва справляемся с ежемесячными процентами. Нам не хватает денег даже на боеприпасы и школьные принадлежности."
11040-58 = "Я понимаю, почему Сэрика так злится. Раньше никому не было дела даже до того, чтобы спросить, как у нас дела, не говоря уже о помощи."
11040-59 = "Вот, собственно, и вся история."
11040-60 = "Теперь, когда вы помогли нам прогнать Банду шлемов, мы снова можем сосредоточиться на выплате долга."
11040-61 = "Даже если мы назначим вас советником нашего клуба, не нужно взваливать на себя наш долг. Уже то, что вы выслушали нас, было очень добрым поступком."
11040-62 = "Мы не пытаемся на вас давить. Вы и так уже очень нам помогли."
11040-63 = ""
11040-65 = "[ns1] «Я тоже член Оперативной группы! Не вешайте нос!»\n[ns2] «Теперь мы в одной команде. Я вас не брошу.»"
11040-66 = "Не обязательно говорить такие вещи..."
11040-67 = "Не обязательно говорить такие вещи..."
11040-68 = "...но всё равно спасибо, Сенсей."
11040-69 = "Вот ведь благородный. Вы и правда намерены продолжать нам помогать..."
11040-70 = "Мне стало гораздо спокойнее. С поддержкой Шале у нас хотя бы появилась надежда."
11040-71 = "Верно. По крайней мере, всё начинает налаживаться."
11040-73 = "..."
11040-74 = "Хмф."
11040-77 = ""
11040-78 = ""
11040-79 = ""
11040-80 = "Сэрика, ты где?"
11040-82 = "Следующий Эпизод;Один день из жизни Сэрики"
