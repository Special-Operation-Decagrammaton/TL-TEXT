[translation]
10034020-1 = "Эпизод 2;Что нужно группе больше всего"
10034020-4 = "«Вопрос: что нужно музыкальной группе?»"
10034020-7 = "Хм...? Что вы имеете в виду?"
10034020-8 = "Что нужно группе? ...Например, инструменты?"
10034020-9 = "Для начала, может быть, место... Да? Для репетиций, чтобы вместить людей и..."
10034020-10 = "Рок. Проще говоря, группе нужен рок."
10034020-11 = "Публика. Если слушать некому, то нет и смысла. По крайней мере, мне так кажется."
10034020-12 = ""
10034020-16 = "«В. Что для музыкальной группы самое#nважное?»"
10034020-19 = "Хм, хороший вопрос... Думаю, вокал. Для меня это важнее всего."
10034020-20 = "Ваш внешний вид, дизайн. Визуал должен цеплять, чтобы люди вообще подошли послушать."
10034020-21 = "Рок. Потому что... это рок."
10034020-22 = "Песни? Что за группа без хорошей песни?"
10034020-23 = ""
10034020-28 = "[ns1] «Очень хорошо. Пожалуйста, запомните свои ответы.»\n[ns2] «То, что вы только что назвали важным...»"
10034020-31 = "[ns3] «Поздравляю! С этого момента это ваши роли и обязанности!!»\n[ns4] «Именно над этим я хочу, чтобы каждая из вас теперь работала самостоятельно.»"
10034020-32 = ""
10034020-33 = ""
10034020-35 = ""
10034020-37 = ""
10034020-39 = "Что...?"
10034020-40 = "Чего-о-о?!"
10034020-41 = ""
10034020-42 = "Что?! Вы вот так просто распределяете роли?!"
10034020-43 = "Ладно, да, если мы хотим собрать группу, всё это всё равно придётся делать, но всё же..."
10034020-44 = "Быстрые решения быстрого ума. Это тоже рок."
10034020-45 = "Какой ещё рок?! И почему ты так разговариваешь?!"
10034020-46 = ""
10034020-48 = ""
10034020-50 = ""
10034020-51 = "Она говорит как всегда. Просто заменила слово «романтика» на «рок»."
10034020-52 = "Ахаха... Ну, если так посмотреть..."
10034020-53 = "...Погоди."
10034020-54 = "Стоп. Так как там всё распределилось? За что мы отвечаем?"
10034020-55 = ""
10034020-56 = "Я... за визуал, получается? А что вообще такое визуал? Что я должна делать?"
10034020-57 = "...Нужны логотип, обложка альбома... Работы намного больше, чем я думала!"
10034020-58 = "И ещё костюмы. Костюмы тоже делаю я. Ну, с этой частью я, наверное, справлюсь."
10034020-59 = "Ладно, но всё будет под МОЙ вкус, ясно? Никаких жалоб. Если мне так нравится — вы это надеваете!"
10034020-60 = ""
10034020-62 = ""
10034020-63 = ""
10034020-64 = "Ох, нас всех ждёт модный терроризм."
10034020-65 = ""
10034020-67 = ""
10034020-68 = "...Погодите, стоп."
10034020-69 = "Я сказала «вокал», значит... О нет..."
10034020-70 = "Поздравляю. Ты ведущая вокалистка группы!"
10034020-71 = "П-погодите!! Нет, мы НЕ МОЖЕМ решать это вот так!"
10034020-73 = "Н-ну, у тебя хороший голос, Казуса... и я уверена, что ты умеешь петь!"
10034020-74 = "Я... Ну, я бы с удовольствием послушала."
10034020-75 = "О, Айри высказалась. Побега нет."
10034020-76 = "...! Н-но...!!"
10034020-77 = "Всё равно... даже ради... тебя, Айри...!"
10034020-78 = ""
10034020-80 = ""
10034020-81 = "Ух...!"
10034020-82 = ""
10034020-84 = ""
10034020-85 = "А-а-аргх!!"
10034020-86 = ""
10034020-88 = ""
10034020-93 = "Ну, она больше не говорит «нет». Отлично сработано, Айри."
10034020-94 = "Хи-хи. Ах, чудеса молодости."
10034020-95 = "А я отвечаю за... рок. Хм. Рок..."
10034020-96 = "Но что значит «рокировать»? Вот в чём вопрос."
10034020-97 = "...Хм? Сенсей. Вы что-то сказали?"
10034020-98 = "Вы просите меня заняться организацией, расписанием..."
10034020-99 = "...И уборкой тоже?"
10034020-100 = "Ч-что всё это такое...? Это не рок, это просто... рутина и тяжёлая работа!"
10034020-101 = "[s5] «Добро пожаловать в жизнь рок-звезды.»\n[s6] «Тяжёлая работа, страсть, усилия — ВОТ что такое рок.»"
10034020-102 = ""
10034020-103 = ""
10034020-105 = ""
10034020-106 = "Нет, погодите... Эм..."
10034020-107 = "Стойте... Это же всё просто мотивационная болтовня!"
10034020-108 = "Ладно, поняла! Рок — это жажда успеха и готовность вкладываться!"
10034020-109 = ""
10034020-111 = ""
10034020-112 = ""
10034020-113 = ""
10034020-115 = "Мы молоды, мы заряжены и полностью в ваших надёжных руках! Давайте рок!"
10034020-116 = "Так вот он какой... рок. Аргх..."
10034020-117 = "Ты же не собираешься сказать: «Давайте НЕ рок», да? Хм?"
10034020-118 = "Хм..."
10034020-119 = "М... М...!!"
10034020-120 = "Молодость — это..."
10034020-121 = "...на самом деле довольно больно..."
10034020-122 = ""
10034020-124 = ""
10034020-126 = ""
10034020-127 = "А-ха-ха..."
10034020-128 = ""
10034020-130 = ""
10034020-131 = "...Так, и ещё... Мне нужно написать песню."
10034020-132 = "Хм. Хмм... Я никогда раньше ничего такого не делала."
10034020-133 = "Ну, мы же не ОБЯЗАНЫ писать СОБСТВЕННУЮ песню, правда? Можно просто выбрать готовую и сыграть её."
10034020-134 = "В смысле, там всё равно будет куча любительских школьных групп. Никто не ждёт от нас совершенно нового материала. Не переживай."
10034020-135 = "Я сыграю что угодно, что ты выберешь! Главное, чтобы не слишком сложно. Хи-хи."
10034020-136 = "Д-да, хорошо, я выберу песню..."
10034020-137 = "Даже я с этим справлюсь, правда? Наверное..."
10034020-138 = ""
10034020-141 = "[ns7] (...Даже ты...?)\n[ns8] (...Наверное...?)"
10034020-142 = ""
10034020-143 = ""
10034020-145 = ""
10034020-146 = "Хорошо! За дело! Я начну собирать наши костюмы."
10034020-147 = "Когда закончу, оставлю их здесь, в репетиционной комнате, так что как увидите — просто переодевайтесь. Понятно?"
10034020-148 = "А завтра мы будем... Что у нас завтра по расписанию, Нацу?"
10034020-149 = "Предскажи нам будущее, Госпожа Рока!"
10034020-150 = ""
10034020-155 = ""
10034020-156 = "...Ах. Вы ищете расписание. Добро пожаловать, страждущие пророчества. Я — Госпожа Рока, та, что наблюдает за будущим."
10034020-157 = "Она быстро вошла в роль."
10034020-158 = "Я вижу нас четверых завтра..."
10034020-159 = "...покупающими инструменты, наверное."
10034020-160 = "...Госпожа изрекла! Наше расписание предсказано!"
10034020-161 = "Наверное, она не сможет отставать ОТ расписания, если сама его выдумывает..."
10034020-162 = "Хороший ход, Сенсей. Вы знали, что всё так получится?"
10034020-163 = "[s9] «Хи-хи-хи... Разумеется, всё было предсказано!»\n[s10] «Хаха, нет.»"
10034020-166 = "Ладно, на сегодня всё! Все по домам!"
10034020-167 = "Давайте завтра после школы встретимся и купим инструменты."
10034020-168 = ""
10034020-170 = ""
10034020-171 = ""
10034020-172 = ""
10034020-174 = ""
10034020-175 = ""
10034020-176 = ""
10034020-177 = ""
10034020-180 = "[ns] «...»"
10034020-186 = "Позже тем же вечером. Я заканчивал гору работы."
10034020-187 = ""
10034020-193 = "[ns11] «...Айри?»\n[ns12] Открыть ей входную дверь."
10034020-194 = ""
10034020-195 = ""
10034020-200 = ""
10034020-201 = ""
10034020-202 = "П-простите, мне так неловко приходить так поздно, Сенсей."
10034020-203 = "...А-а? Одежда? О, ну это..."
10034020-204 = "Ёшими оставила её в репетиционной комнате, я увидела, что всё уже там, и... Ха-ха..."
10034020-205 = "...А?"
10034020-206 = "Вы думали, что я могу прийти сюда...? Я...?"
10034020-207 = "П-Почему...?"
10034020-208 = "[s13] «Я подумал, что тебе может понадобиться совет.»\n[s14] «Поговорим о выборе песни?»"
10034020-209 = ""
10034020-210 = ""
10034020-212 = ""
10034020-213 = "А-ха... Хахаха... Как всегда, вы всё знаете, Сенсей."
10034020-214 = "Да. Именно поэтому я и пришла поговорить с вами..."
10034020-215 = "Сначала я попыталась выбрать сама, но получилось не очень."
10034020-216 = "Выбрать песню, которую мы будем играть, оказалось не так просто, как я думала. Хаха..."
10034020-217 = "Хм..."
10034020-218 = "Хм..."
10034020-219 = "Как думаете, Сенсей? Какую песню мне выбрать? Какой вариант будет лучшим?"
10034020-220 = "...А? Почему я ищу «лучшую песню»...?"
10034020-221 = "Ну, очевидно же, что мы хотим устроить лучшее выступление, да? Добиться лучшего результата?"
10034020-222 = "А? Это был неправильный ответ?"
10034020-223 = "Моя ЛЮБИМАЯ песня? Н-нет, так нельзя! Она вообще не подойдёт! Правда, я..."
10034020-224 = ""
10034020-226 = ""
10034020-227 = "П-простите. Я не хотела повышать голос."
10034020-228 = "Но всё-таки... Я просто хочу добиться самого лучшего результата, понимаете?"
10034020-229 = "...Я хочу, чтобы у нас всё получилось."
10034020-230 = "Наверное, я не очень хорошо это объясняю... но вот что я чувствую."
10034020-231 = ""
10034020-233 = ""
10034020-234 = "[ns15] «Что из того, что ты слушала в последнее время, понравилось тебе больше всего?»\n[ns16] «Была песня, от которой ты подумала: „Вау!“?»"
10034020-235 = "Лучшее из того, что я слушала в последнее время..."
10034020-236 = "«Вау», значит?"
10034020-237 = "Хм..."
10034020-238 = "Хм?"
10034020-239 = "Эм..."
10034020-243 = ""
10034020-244 = ""
10034020-245 = "[ns] «...Айри?»"
10034020-246 = "А, ах...! П-простите! На секунду я..."
10034020-247 = "Была одна песня..."
10034020-248 = "Я услышала, как кто-то немного её напевал, когда проходила мимо. Я не знаю, как она называется, и не знаю, смогу ли снова найти ту девушку."
10034020-249 = "Мне даже кажется, что она была не из Тринити. Она просто выступала на улице, пока все готовились к фестивалю."
10034020-250 = "Я знаю, что примерно в это время студенты других школ выступают на улицах повсюду, и днём и ночью..."
10034020-251 = "Но даже если эта певица всё ещё здесь, нам придётся обыскать весь кампус Тринити, чтобы найти её..."
10034020-252 = "...А?"
10034020-253 = "Вы хотите сделать это? Вместе?"
10034020-254 = "Вы уверены? Мы ведь понятия не имеем, где именно в Тринити она может быть..."
10034020-255 = "Н-нет, дело не в том, что у меня мало времени, я просто не хочу заставлять вас тратить неизвестно сколько времени на такое!"
10034020-256 = "[s17] «Тебе не нужно об этом переживать, Айри.»\n[s18] «Не волнуйся. Это вполне настоящая „работа“.»"
10034020-259 = "Сенсей..."
10034020-260 = "...Х-хорошо. Я буду иметь это в виду."
10034020-261 = "Тогда-а-а... когда вы будете свободны?"
10034020-262 = ""
10034020-265 = "Хм?"
10034020-266 = "...Сейчас?"
10034020-268 = "...Правда?"
