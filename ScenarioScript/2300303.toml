[translation]
2300303-1 = "Зависимость от энергетиков"
2300303-2 = "Хакерская комната Веритас"
2300303-3 = ""
2300303-4 = ""
2300303-5 = "А, вот ты где, Сенсей."
2300303-6 = "Я почти закончила тестировать управление модифицированным дроном... Прости. Дай мне ещё минутку."
2300303-7 = "[s] (Передать ей принесённый энергетик.)"
2300303-8 = "Это же Frenzy MAX со вкусом маракуйи! Мне как раз было трудно сосредоточиться. Спасибо."
2300303-10 = "Ахаха... Маракуйя — точно лучший вкус Frenzy MAX. У остальных остаётся мерзкое горькое послевкусие от искусственного подсластителя."
2300303-11 = "Прости, что заставила тебя специально идти за энергетиком для меня."
2300303-12 = "Как я уже говорила, последние пару дней я была слишком занята новой программой, чтобы самой сходить за энергетиками."
2300303-13 = "Ела ли я? Не волнуйся, пока работала, у меня было достаточно энергетиков."
2300303-14 = "Всё нормально. В Frenzy MAX есть не только кофеин, чтобы не спать, но и полно сахара и витаминов для энергии."
2300303-15 = "С одной такой банкой я могу работать всю ночь!"
2300303-16 = "[s] Спросить, сколько банок энергетика она выпила сегодня."
2300303-17 = "Не так уж много. Кажется, четыре?"
2300303-18 = "Вообще-то это даже меньше обычного. Когда работаю на пределе, могу выпить и десять банок."
2300303-19 = "Ты хочешь сказать, что энергетики вредят здоровью и мне стоит перестать их пить?"
2300303-20 = "Но без них я не смогу не спать всю ночь. Да и без сахара из газировки совсем нет мотивации работать..."
2300303-21 = "Хм..."
2300303-22 = "Но раз это говоришь ты, Сенсей, похоже, выбора нет."
2300303-23 = "Ладно. Я перестану пить энергетики."
2300303-24 = "Если нужно будет не спать, могу принимать витамины или жевать мятную жвачку."
2300303-25 = "Хотя одной работать поздно ночью тяжело... Поможешь мне, Сенсей?"
2300303-26 = "Не волнуйся, на этот раз ничего особо тяжёлого."
2300303-27 = "Для начала передвинь вон тот ящик с инструментами..."
2300303-29 = "На следующее утро..."
2300303-30 = "*зевок*"
2300303-31 = "[s] «Доброе утро, Харэ.»"
2300303-32 = "Доброе утро, Сенсей..."
2300303-33 = "Почему-то прошлой ночью совсем не могла уснуть... Заснула только под утро, долго ворочаясь в кровати."
2300303-34 = "Так хочется спать... Это ломка из-за кофеина?"
2300303-35 = "Одна банка Frenzy MAX — и это состояние как рукой снимет. Я серьёзно."
2300303-36 = "Но раз я решила на время отказаться от энергетиков... потерплю."
2300303-37 = "Это всего лишь банка газировки... Я вполне могу от неё отказаться."
2300303-39 = "На следующее утро..."
2300303-40 = "..."
2300303-41 = "[s1] «Ты в порядке?»\n[s2] «Выглядишь неважно.»"
2300303-42 = "Голова болит, тело тяжёлое, желудок мутит... Я всё ещё устала, хотя вроде выспалась... Кажется, вот-вот свалюсь."
2300303-43 = "Голова болит, тело тяжёлое, желудок мутит... Я всё ещё устала, хотя вроде выспалась... Кажется, вот-вот свалюсь."
2300303-44 = "Наверное, это всё-таки кофеиновая ломка..."
2300303-45 = "Не верится, насколько моё тело зависело от кофеина... Виню себя прежнюю."
2300303-46 = "Сенсей. Можно мне хотя бы глоточек энергетика?"
2300303-47 = "Мне кажется, от одного глотка я сразу оживу..."
2300303-48 = "Ты ведь не станешь мне отказывать, правда?"
2300303-49 = "[s] «Нельзя же сдаваться сейчас?»"
2300303-50 = "Ладно, ладно. Тогда отвлекусь на что-нибудь другое."
2300303-51 = "Куда я положила мятную жвачку..."
2300303-53 = "На следующее утро..."
2300303-55 = ""
2300303-56 = ""
2300303-57 = ""
2300303-58 = ""
2300303-59 = "Не могу... больше не могу... Нужен... кофеин..."
2300303-60 = "Я на пределе, Сенсей... Мне срочно нужен энергетик..."
2300303-61 = "[s3] (Дать ей энергетик.)\n[s4] (Отказаться.)"
2300303-63 = "Что бы ты ни говорил... я больше не выдержу!"
2300303-65 = "А-а-а... Как же освежает... и вкусно."
2300303-66 = "Наконец-то энергетик после трёх долгих дней воздержания... Моё тело сейчас растает..."
2300303-67 = "Я знала, что прожить три дня без энергетика невозможно."
2300303-68 = "[s] «Ну что, чит-день удался? Снова бросишь энергетики?»"
2300303-69 = "Нет! Больше не брошу. Я не могу жить без этого вкуса!"
2300303-70 = "Пусть кофеиновая зависимость меня и погубит... Энергетик или смерть!"
