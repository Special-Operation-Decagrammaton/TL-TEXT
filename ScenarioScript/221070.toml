[translation]
221070-1 = "Episódio 07;Uma Espera Inquieta"
221070-3 = ""
221070-4 = "Enfermaria de bordo da Odisseia"
221070-5 = ""
221070-6 = ""
221070-7 = ""
221070-8 = "......Diagnóstico: entorse lombar aguda."
221070-9 = "Não chegou a romper ligamentos, então alguns dias de repouso absoluto devem bastar para recuperar."
221070-10 = "[s1] \"Obrigado pelo atendimento rápido...\"\n[s2] \"......Seu nome é Sanae, certo?\""
221070-13 = "Sim. Sou a oficial médica da Odisseia, [ruby=Funamori]Sanae[/ruby] Funamori."
221070-14 = "Minhas atribuições primárias incluem esterilização de bordo, inspeção sanitária e segurança ocupacional. E também――"
221070-15 = "Remendar as idiotices daquelas energúmenas do Trident. Ao seu dispor."
221070-16 = "E-Ei, pera lá, que falta de respeito é essa?!#nFalando desse jeito parece até que o Trident não segue regras de segurança e vive se quebrando todo santo dia!"
221070-17 = "......E eu por acaso menti?"
221070-18 = "Bem... não posso negar completamente, mas..."
221070-19 = "M-Mas as alunas do Trident têm um porte físico excelente, sabia?!#nA gente quase nunca precisa ser carregada numa maca pra enfermaria..."
221070-20 = "É claro, já que por livre e espontânea vontade vocês preferem morrer a pisar aqui."
221070-21 = "Por outro lado, em comparação com elas, o Sensei é... como posso dizer..."
221070-22 = "Consideravelmente... franzino e frágil."
221070-23 = "Já me constava nos autos que seu corpo não tolera disparos de arma de fogo,#nmas fazia anos que eu não via uma musculatura lombar tão enrijecida e travada de estresse."
221070-24 = "[s3] \"Andei atolado em pilhas de papelada ultimamente...\"\n[s4] \"Minha postura na cadeira deve ter ido pro buraco.\""
221070-27 = "Exercícios de alongamento previnem distensões musculares severas."
221070-28 = "Recomendo alongamentos periódicos e... pausas regulares para descanso."
221070-29 = "Haaah......"
221070-30 = "[s] \"Você não tem um pingo de fé que eu vá fazer isso, né......?\""
221070-31 = "Qualquer profissional da saúde que atende tripulantes neste navio aprende a perder a fé nas pessoas bem depressa."
221070-32 = "Ainda assim, receber um paciente que não seja do Trident serviu como uma boa mudança de ares para variar."
221070-33 = "Me desculpa, Sensei... por minha causa você acabou se machucando de novo..."
221070-34 = "[s] \"Esquenta a cabeça não, eu também fui meio estabanado.\""
221070-35 = "Fico feliz em ouvir sua gentileza, Sensei..."
221070-36 = "E aproveitando que você tá com esse coração tão generoso... hã, bem... sei que é uma cara de pau deslavada pedir isso, mas..."
221070-37 = "Será que esse incidente... poderia ficar em segredo absoluto da Vice-Líder Toru?"
221070-38 = "Lamento desapontá-la, mas a capitã de corveta Toru já deve ter recebido o relatório de ocorrência a esta altura."
221070-39 = "Se eu fosse você, começava a redigir o termo de retratação e o pedido de desculpas agora para economizar tempo."
221070-40 = "Uwaaaah... meu fim chegou......"
221070-42 = ""
221070-43 = ""
221070-44 = ""
221070-45 = ""
221070-46 = "Sammy, a culpa é todinha sua!#nSe você não tivesse escorregado na minha frente...!"
221070-47 = "Mya! Myaon, myaon, nnyaa......"
221070-48 = "Sumika. Pare de chacoalhar o Sammy agora mesmo."
221070-49 = "A pressão arterial dele já está perigosamente alta e ele sofre de tonturas severas.#nFicar sacudindo o animal só vai agravar o quadro clínico."
221070-50 = "Eita."
221070-51 = ""
221070-53 = ""
221070-54 = "Myaaan."
221070-55 = ""
221070-56 = "[ns] \"O estado do Sammy tá pior do que a gente imaginava?\""
221070-57 = "......Levando em conta a idade avançada de um felino, é um milagre ele ainda conseguir andar."
221070-58 = "Ainda assim, a maresia salina e o ambiente hostil de um navio em alto-mar são agressivos demais para o organismo de um gato."
221070-59 = "A saúde dele pode desandar de vez a qualquer minuto."
221070-60 = "[s] \"Sanae, você acha que o Sammy deveria desembarcar em terra?\""
221070-61 = "......Sei lá.#nO mais importante não seria a vontade do próprio Sammy?"
221070-62 = "Myaon."
221070-63 = "Embora o principal interessado esteja pouco se lixando para o mundo ao redor."
221070-64 = "No frigir dos ovos, ficar debatendo se devemos desembarcá-lo ou mantê-lo a bordo#nnão passa de mero [ruby=egoísmo]comodismo egoísta[/ruby] das alunas querendo massagear a própria consciência."
221070-65 = "Mas doutora... o Sammy passou a vida inteirinha navegando no mar!"
221070-66 = "Se a gente jogar ele em terra firme e ele definhar de desgosto...?#nE se ele tiver que dar o último suspiro num lugar frio e estranho longe de todo mundo que ele conhece...?!"
221070-67 = "Isso é puro apelo emocional sem base científica."
221070-68 = "Ficar projetando sentimentos humanos num gato e rachar a academia em partidos políticos rivais por causa disso.#nNão consigo conceber nada mais irracional e ineficiente."
221070-69 = "Haaah......"
221070-70 = "Como eu queria que alguém tomasse essa decisão difícil por nós de uma vez..."
221070-71 = "C-Claro que... se a Capitã ou a Vice-Líder derem a ordem, eu vou bater continência e obedecer, mas..."
221070-72 = "Pois eu ouvi com muita atenção a ponderação de vocês."
221070-73 = ""
221070-74 = ""
221070-75 = "U-U-Uwaaaah?! P-P-Presidente do Conselho Estudantil Federal?!"
221070-76 = "D-Desde quando a senhora tá aí parada...?!"
221070-77 = "Peço desculpas. O assunto parecia denso demais, então preferi aguardar o momento propício para me pronunciar."
221070-78 = ""
221070-80 = ""
221070-81 = ""
221070-82 = "Chegou aos meus ouvidos que o Sensei havia sofrido uma contusão――"
221070-83 = "Como estão as suas costas agora?"
221070-84 = "[s] \"A fofoca já chegou na sede do Conselho Estudantil Federal tão rápido assim?!\""
221070-85 = "Fufufu, não seja dramático."
221070-86 = ""
221070-88 = ""
221070-89 = ""
221070-90 = "Por mera coincidência, eu tinha compromissos oficiais a resolver aqui na Odisseia.#nAcabei ouvindo os burburinhos das estudantes no corredor."
221070-91 = "Imagino que ainda sinta desconforto ao caminhar...#nmas já que a oportunidade se apresentou, o Sensei poderia me acompanhar por alguns instantes?"
221070-92 = "[s5] \"Por mim tudo bem, mas...\"\n[s6] \"Para onde nós vamos exatamente?\""
221070-95 = "Que tal irmos até o conselho Island checar a situação?"
221070-97 = "Pelo andar da carruagem, já deve ser o momento em que a Capitã Minato está à beira do desespero."
221070-99 = "Próximo Episódio;A Terceira Opção"
