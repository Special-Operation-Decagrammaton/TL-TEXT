[translation]
221070-1 = "Episode 7;A Restless Waiting Period"
221070-4 = "Odyssey Infirmary"
221070-8 = "...It is a lumbar sprain."
221070-9 = "It is not a severe injury, so it should improve if you rest for a few days."
221070-10 = "[s1] \"Thanks for patching me up right away....\"\n[s2] \"...You are Sanae, right?\""
221070-13 = "Yes. I am Sanae Funamori, serving as a doctor on the Odyssey."
221070-14 = "My main duties are shipboard disinfection, hygiene inspections, safety inspections. And――"
221070-15 = "Treating the idiots of Trident. It is nice to meet you."
221070-16 = "W-Wait a minute!#nIf you phrase it like that, it makes it sound like Trident members can't even follow safety rules#nand are constantly getting hurt every day!"
221070-17 = "...Is that not true?"
221070-18 = "I cannot deny it, but..."
221070-19 = "B-But~ most Trident students are pretty tough~?#nI do not think they end up carried into the infirmary very often..."
221070-20 = "Well, they rarely come in of their own accord, after all."
221070-21 = "Compared to them, Sensei, you are... well."
221070-22 = "Quite... frail."
221070-23 = "I had heard you could not even withstand bullets, but#nthat aside, it has been a while since I saw someone with their back muscles this tense."
221070-24 = "[s3] \"Lately, I have been swamped with paperwork....\"\n[s4] \"My posture must have gotten really bad.\""
221070-27 = "Stretching helps prevent muscle injuries."
221070-28 = "I recommend regular stretching and... moderate breaks."
221070-29 = "Sigh...."
221070-30 = "[s] \"You have zero expectations for me, do you...?\""
221070-31 = "Anyone treating patients on this ship would give up hope immediately."
221070-32 = "Still, having a patient from outside Trident for a change was a nice break of pace."
221070-33 = "I am sorry, Sensei... Because of me again...."
221070-34 = "[s] \"Don't worry about it. It was partly my own carelessness.\""
221070-35 = "I am glad to hear you say that, but..."
221070-36 = "Um, while I am at it... Ah, well, I know this is a shameless request, but..."
221070-37 = "Could you please keep this incident... a secret from the Vice President?"
221070-38 = "Unfortunately, I believe Vice President Toru has already received a report."
221070-39 = "Would it not save time to write your incident report in advance?"
221070-40 = "Gwah...."
221070-46 = "Sammy, this is your fault!#nBecause you tripped...!"
221070-47 = "Meow, meow, meow, meeeeow..."
221070-48 = "Sumika. Please do not shake Sammy around so much."
221070-49 = "I imagine her blood pressure is already high and her dizziness is severe.#nShaking her might make it worse."
221070-50 = "Ah."
221070-54 = "Meow."
221070-56 = "[ns] \"Is Sammy's condition worse than expected?\""
221070-57 = "...Considering her age, she is doing well to move around at all."
221070-58 = "Even so, a shipboard environment with strong sea breezes is harmful to cats."
221070-59 = "It is a situation where it would not be strange for her condition to worsen at any time."
221070-60 = "[s] \"Do you think Sanae should bring Sammy down to the mainland?\""
221070-61 = "...Who knows.#nIsn't what matters most Sammy's own will?"
221070-62 = "Meow."
221070-63 = "Though the cat in question has not a single care in the world."
221070-64 = "Ultimately, I think debating whether or not to bring Sammy down#nis nothing more than self-satisfaction on the students' part."
221070-65 = "But... Sammy has lived her whole life on this ship!"
221070-66 = "If we bring her to land and she doesn't get better...#nIf she ends up meeting her end in an unfamiliar place...!"
221070-67 = "That is merely emotional argument."
221070-68 = "To arbitrarily guess a cat's feelings and split into factions within the academy.#nThere is nothing more inefficient than that."
221070-69 = "Sigh...."
221070-70 = "I wish someone would just make the decision for us...."
221070-71 = "O-Of course... I will obey if the President or Vice President orders it, though..."
221070-72 = "I have heard your conversation."
221070-75 = "W-W-What?! T-T-The General Student Council President?!"
221070-76 = "S-Since when...?"
221070-77 = "Pardon me. It sounded like a heavy conversation, so I was waiting for the right moment to chime in."
221070-82 = "I heard you were injured--"
221070-83 = "How is your back?"
221070-84 = "[s] \"The General Student Council has been notified already?!\""
221070-85 = "Fufu, of course not."
221070-90 = "I happened to have official business on the Odyssey.#nI just overheard students talking outside."
221070-91 = "I imagine it is still hard for you to move around, but...#nsince it is good timing, would you mind accompanying me for a little while?"
221070-92 = "[s5] \"I don't mind, but...\"\n[s6] \"Where are we going?\""
221070-95 = "Shall we go check on the island?"
221070-97 = "It is about time they started running into trouble."
221070-99 = "Next Episode;The Third Option"
