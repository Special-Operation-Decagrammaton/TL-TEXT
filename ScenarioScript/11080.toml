[translation]
11080-2 = "Episódio 8;A Faz-Tudo Chegou!"
11080-3 = "Comitê de Contramedidas - Sala de Aula"
11080-4 = "...Então, vamos dar início à reunião ordinária do Comitê de Contramedidas de Abydos."
11080-5 = "Como o Sensei também pôde comparecer hoje, acredito que conseguiremos ter uma discussão mais séria do que o habitual..."
11080-6 = "Siiim☆"
11080-7 = "Com certeza."
11080-8 = "Ei, assim parece que a gente nunca leva nada a sério..."
11080-9 = "Uhe, prazer ter você aqui, Sensei."
11080-10 = "[s] \"Podem contar comigo.\""
11080-12 = "Vamos direto à pauta. Hoje, discutiremos medidas concretas para um problema crucial para nós...#n\"Como pagar a dívida da escola\"."
11080-13 = "Quem tiver alguma sugestão, por favor, levante a mão!"
11080-14 = "Eu! Eu!"
11080-15 = "Sim, Kuromi-san, do 1º ano. Por favor."
11080-16 = "...Olha, primeiro, dá pra parar de me chamar pelo sobrenome? Fica estranho."
11080-17 = "S-Serika-chan... mas já que é uma reunião formal..."
11080-18 = "Qual o problema? Esse clima todo formal é legal. Ainda mais hoje, que o Sensei deu as caras."
11080-19 = "Mais do que raro, é a primeira vez."
11080-20 = "Né? Dá um ar bem de comitê de verdade, eu adoreeei☆"
11080-21 = "Aiai... bom, se as senpais dizem..."
11080-22 = "...Enfim! Como tesoureira do Comitê de Contramedidas, só posso dizer que a situação financeira da nossa escola#nestá à beira da falência!"
11080-23 = "Desse jeito a escola vai fechar! Todo mundo sabe disso, né?"
11080-24 = "É, pois é..."
11080-25 = "O pagamento mensal, só de juros, é de 7,88 milhões de ienes!#nA gente se esforça pra ganhar dinheiro, mas, sinceramente, não dá conta nem de cobrir os juros."
11080-26 = "Só ficar prendendo procurados, resolvendo reclamações e fazendo trabalho voluntário como sempre tem limite!"
11080-27 = "Assim a gente não sai do lugar! Precisamos dar uma tacada de mestre, algo grande!"
11080-28 = "Algo grande... tipo o quê?"
11080-29 = "(Vupt) Isso aqui! Um panfleto que estavam distribuindo na rua!"
11080-30 = "Isso é...?!"
11080-31 = "Deixa eu ver..."
11080-32 = "\"Fique rico da noite para o dia com a Pulseira de Pedra Maifan com Germânio\"... sei..."
11080-33 = "Isso mesmo! Vamos faturar rios de dinheiro com isso!"
11080-34 = "..."
11080-35 = "Outro dia, me abordaram na rua e me levaram pra uma palestra.#nDisseram que vendem uma pulseira de germânio que aumenta a sorte!"
11080-36 = "..."
11080-37 = "É só usar que a sua sorte sobe na hora! Aí, se você vender pra mais 3 pessoas ao seu redor..."
11080-39 = "...Gente, o que houve?"
11080-40 = "Rejeitado."
11080-41 = "Quê?! Por quê?! Qual o problema?!"
11080-42 = "Serika-chan... isso é esquema de pirâmide..."
11080-43 = "Não tem como lucrar com isso."
11080-44 = "Hã?!"
11080-45 = "Pra começo de conversa, o que germânio tem a ver com aumentar a sorte...#nUm lugar suspeito desses jamais ofereceria um negócio sério..."
11080-46 = "S-Sério?! Mas eu já comprei duas!!"
11080-47 = "A Serika-chan caiu num golpe, né? Que fofinha☆"
11080-48 = "...!!"
11080-49 = "Ah, Serika-chan, você é tão ingênua...#nSe não tomar cuidado, vai acabar enganada por adultos mal-intencionados e estragar sua vida, viu?"
11080-50 = "N-Não pode ser... eles não tinham cara de golpistas...#nEu até fiquei sem almoçar pra juntar dinheiro e comprar..."
11080-51 = "Tudo bem, Serika-chan. Vamos almoçar juntas? Hoje é por minha conta."
11080-52 = "Snif... Nonomi-senpai..."
11080-54 = "Bom... vamos encerrar a sugestão da Kuromi-san por aqui...#nMais alguém tem alguma ideia?..."
11080-55 = "Eu! Eu!"
11080-56 = "Hum... sim, presidente Takanashi, do 3º ano. Estou com um mau pressentimento, mas..."
11080-57 = "Hum, hum, aham!"
11080-58 = "O maior problema da nossa escola é que o corpo discente inteiro se resume a nós poucas aqui."
11080-59 = "Número de alunas é igual ao poder de uma escola. Se conseguirmos multiplicar o número de alunas como Trinity ou Gehenna,#nsó a mensalidade já renderia uma bolada."
11080-60 = "Ah... é-é mesmo?"
11080-61 = "Exatamente! Então primeiro a gente precisa aumentar o número de alunas. Tudo começa por aí."
11080-62 = "Assim também poderíamos eleger representantes e ter voz no Conselho Estudantil Geral."
11080-63 = "É um ponto muito pertinente, mas... como faríamos isso..."
11080-64 = "Moleza! É só sequestrar os ônibus escolares de outras escolas e pronto!"
11080-65 = "O quê?!"
11080-66 = "A gente sequestra o ônibus a caminho da aula e não deixa ninguém descer até carimbarem#no formulário de transferência pra nossa escola!"
11080-67 = "Uhe~ Com isso, o número de alunas vai disparar com certeza!"
11080-68 = "Isso é interessante."
11080-69 = "O alvo é Trinity? Ou Gehenna? Millennium?"
11080-70 = "Dependendo de quem escolhermos, talvez precisemos ajustar a estratégia."
11080-71 = "Oh? ...Deixa eu ver, hum... que tal Trinity? Não, vamos de Gehenna!"
11080-72 = "E-Esperem um pouco! Desde quando dá pra transferir alunas desse jeito?!"
11080-73 = "Além disso, o Comitê Disciplinar das outras escolas não ia deixar barato..."
11080-74 = "Uhe~ Pois é, né?"
11080-75 = "Nada de \"pois é, né?\", Hoshino-senpai...#nPor favor, leve a reunião mais a sério..."
11080-77 = "Tenho uma boa ideia."
11080-78 = "...Sim, Sunaookami Shiroko-san, do 2º ano..."
11080-79 = "Vamos assaltar um banco."
11080-80 = "O quê?!"
11080-81 = "Um método garantido e simples. Já até escolhi o alvo.#nO Primeiro Banco Central, no centro da cidade."
11080-82 = "Já mapeei a localização do cofre, a rota dos seguranças e o trajeto dos carros-fortes."
11080-83 = "Era isso que você estava analisando tão concentrada agora há pouco?!"
11080-84 = "Dá pra faturar 100 milhões em 5 minutos. Toma, até preparei as máscaras."
11080-88 = "Quando foi que você preparou tudo isso..."
11080-89 = "Nossa, foi você mesma que fez, Shiroko-chan?"
11080-92 = "Uau, olhem só! Parecemos lutadoras de luta livre!"
11080-93 = "..."
11080-94 = "Puxa, gostei! Na vida a gente tem que apostar alto. Né, Serika-chan?"
11080-97 = "Claro que não!! Rejeitado! Rejeitado!!"
11080-98 = "I-Isso mesmo! Cometer crimes é inaceitável!"
11080-101 = "..."
11080-102 = "Não adianta fazer bico, Shiroko-senpai! Não é não!"
11080-103 = "Ai... pessoal, será que podem dar alguma sugestão um pouco mais sensata?..."
11080-105 = "Com licença! Eu! Agora é a minha vez!"
11080-106 = "Sim... Izayoi Nonomi-san, do 2º ano. Por favor, sem crimes nem golpes desta vez..."
11080-107 = "Sim! Tenho um método super limpo e garantido, sem crime e sem esquema de pirâmide!"
11080-108 = "Idols! School idols!"
11080-109 = "I-Idols...?!"
11080-110 = "Isso mesmo! Eu vi num anime que o jeito clássico de salvar uma escola é virar idol!#nSe todas nós estrearmos como idols..."
11080-111 = "Rejeitado."
11080-112 = "Ora... essa também não pode?"
11080-113 = "Por quê? A Hoshino-senpai faria o maior sucesso com um certo nicho de fãs."
11080-114 = "Uhe~ Gente que gosta de um corpo magricela feito o meu não presta como ser humano. Sem chance, nem pensar."
11080-115 = "Poxa, eu até já tinha pensado numa pose de assinatura..."
11080-116 = "(Tcharam!)"
11080-117 = "Eu sou a Christina, das Garotas de Maiô♧"
11080-118 = "Que diabos é isso..."
11080-119 = "O que é essa de \"Christina♧\"?! E \"Garotas de Maiô\"?! Que brega!"
11080-120 = "Ah, mas eu virei a noite pensando nisso..."
11080-122 = "Hum... a discussão não está avançando muito, então já deveríamos chegar a uma conclusão..."
11080-123 = "Vamos deixar pro Sensei decidir! Sensei, das ideias que surgiram até agora, qual você acha melhor?"
11080-124 = "Quê?! Vai escolher entre as ideias de agora há pouco?! N-Não seria melhor pensarmos em algo um pouco mais sensato antes?!"
11080-125 = "Relaxa. O que o Sensei escolher não tem erro."
11080-126 = "E-Espere um pouco! Como pode ter tanta certeza?!"
11080-128 = "Você não vai mandar a gente virar idol, vai?"
11080-129 = "Escolhe idols☆ Por favorzinho♧"
11080-130 = "...(Estende)"
11080-131 = "[s1] \"Sequestrar o ônibus escolar!\"\n[s2] \"Assaltar o banco!\"\n[s3] \"Formar um grupo de idols! Eu serei o produtor!\""
11080-135 = "Quê?! Está falando sério?!"
11080-136 = "Ahahaha! Beleza, fechado! Então vamos partir!"
11080-137 = "Kyaa~☆ Vai ser tão divertido!"
11080-138 = "S-Sério mesmo? Isso vai dar certo?"
11080-139 = "Uhe~ Por que não?"
11080-140 = "Quanto mais ousado o plano, melhor. Não é, Ayane?"
11080-141 = "...Me..."
11080-142 = "Me...?"
11080-144 = "Melhor coisa NENHUMA!!"
11080-145 = "CRAAASH!"
11080-146 = "Lá vem! A famosa virada de mesa da Ayane-chan!"
11080-147 = "..."
11080-148 = "Kyaa, a Ayane-chan ficou brava! Estado de emergência!"
11080-149 = "Uhe~ Ela cresceu tanto que já sabe até virar a mesa com estilo. A mamãe aqui está tão orgulhosa~"
11080-150 = "Quem é mamãe aqui?! Chega, levem isso a sério de uma vez!"
11080-151 = "Vocês só ficam de brincadeira! Falando de assalto a banco, esquema de pirâmide e esse tipo de coisa!"
11080-153 = "(Gulp)"
11080-154 = "..."
11080-156 = "(Depois disso, levamos uma bronca daquelas)"
11080-158 = "Aaaah, foi mal mesmo, Ayane-chan. Eu pago o lámen pra você, então não fica brava, tá bom?"
11080-159 = "Não estou brava..."
11080-160 = "Prontinho, limpa a boquinha. Isso, muito bem☆"
11080-161 = "Eu não sou um bebê!"
11080-162 = "...Tanto faz, né. Mas por que vieram parar aqui no meu trabalho de novo?"
11080-163 = "Ayane, quer mais chashu?"
11080-164 = "(Mastigando) Fsim."
11080-165 = "(Porta deslizando)"
11080-166 = "..."
11080-167 = "C-Com licença..."
11080-168 = "Bem-vinda! Mesa para quantas pessoas?"
11080-169 = "...Q-Qual é o prato mais barato daqui? Q-Quanto custa?"
11080-170 = "O mais barato é..."
11080-171 = "O Lámen Shibasaki, por 580 ienes! É o carro-chefe da casa, uma delícia!"
11080-172 = "O-Obrigada!"
11080-173 = "(Porta deslizando)"
11080-174 = "Hum?"
11080-175 = "(Porta deslizando)"
11080-181 = "Ehehe, finalmente achamos um prato abaixo de 600 ienes!"
11080-183 = "Fufufu. Estão vendo? Tudo tem solução. Estava tudo dentro do planejado."
11080-184 = "É-É mesmo! Como esperado da Presidente, você sabe de tudo..."
11080-185 = "Aiai..."
11080-188 = "Para 4 pessoas? Vou levá-las à mesa."
11080-189 = "Não precisa, a gente só vai pedir uma tigela mesmo."
11080-190 = "Só uma tigela...? Mas... já que vieram, podem se sentar com calma. Agora o movimento está fraco, tem várias mesas vazias."
11080-191 = "Opa, que atendente gentil! Obrigada, então vamos aceitar."
11080-192 = "Ah, aproveitando a gentileza, pode trazer 4 pares de hashi? Obrigadinha, moça do meio período."
11080-193 = "Hã? 4 pares? V-Vocês vão dividir uma tigela entre 4 pessoas?!"
11080-194 = "D-D-Desculpa! Desculpa por sermos pobres!! Desculpa por não termos dinheiro!!"
11080-195 = "A-Ah, não...! Quer dizer, não precisa se desculpar assim..."
11080-196 = "Não! Não ter dinheiro é o mesmo que não ter cabeça! Não merecemos nem viver!#nSomos inferiores a insetos! Me desculpe por ser pior que um inseto...!"
11080-197 = "Aiai... fala mais baixo, Haruka. Está incomodando os outros..."
11080-198 = "Que isso! Não ter dinheiro não é crime! Ergam a cabeça!"
11080-200 = "Hã? ...Sim?!"
11080-201 = "Dinheiro vai e vem, né? Além disso, vocês ainda são estudantes!#nMesmo assim, juntaram as moedinhas pra vir comer aqui, não foi? É isso que importa!"
11080-202 = "Esperem só um pouquinho. Já trago o pedido."
11080-205 = "...Parece que ela entendeu tudo errado, né?"
11080-206 = "Bom, a gente normalmente não é tão pobre assim. Se for culpar alguém, a culpa é da Aru-chan, que gasta dinheiro que nem água."
11080-207 = "Não é \"Aru-chan\", é Presidente! Chefe de Gabinete Mutsuki, use o título corretamente."
11080-208 = "Ué? Mas o expediente já acabou, né? Aliás, que tipo de presidente não consegue pagar nem um lámen pras funcionárias?"
11080-209 = "..."
11080-210 = "A gente gastou quase todo o dinheiro que tinha pra contratar pessoal pro ataque de hoje..."
11080-211 = "Fufufu. Mas no fim estamos aqui comendo lámen, não estamos? Isso também estava nos meus planos."
11080-212 = "Só uma tigela. Pelo menos guarda dinheiro pra 4 tigelas da próxima vez..."
11080-213 = "Fala a verdade, você esqueceu, né? Né, Aru-chan? Esqueceu de separar o dinheiro do jantar, né?"
11080-214 = "...Fufufu."
11080-215 = "Aiai. Bom, reduzir os riscos é sempre melhor. Concordo que o alvo de hoje não dá pra tratar feito uns zé-ninguém tipo a Gangue dos Capacetes."
11080-216 = "Mas Abydos é tão perigosa assim a ponto de precisarmos gastar tudo o que temos contratando gente?"
11080-217 = "Isso é..."
11080-218 = "Provavelmente a Aru-chan nem sabe direito. Por isso ficou com medo e saiu contratando um monte de gente."
11080-219 = "Quem está com medo?! Está tudo sob meu controle!"
11080-220 = "Falhar não é uma opção. Mobilizamos todos os recursos disponíveis para a missão. Esse é o lema da nossa Faz-Tudo 68!"
11080-221 = "Primeira vez que ouço esse lema..."
11080-222 = "Com certeza ela inventou agora."
11080-223 = "Silêncio! Quando completarmos esse serviço e recebermos a recompensa, vamos comer sukiyaki! Então deem o máximo de si, pessoal!"
11080-224 = "S-Sukiyaki...?! O que seria isso?!"
11080-225 = "Comida de adulto, super cara..."
11080-226 = "U-Uau... será que alguém como eu merece comer algo assim? Depois de comer eu tenho que fazer haraquiri...?"
11080-227 = "Fufufu. Funcionárias de uma empresa grandiosa como a nossa precisam se dar ao luxo de vez em quando."
11080-228 = "Opa~ Tá toda animada, hein, Aru-chan?"
11080-229 = "Não é \"Aru-chan\", é PRE-SI-DEN-TE!!"
11080-231 = "Com licença, obrigada pela espera! Cuidado que está quente!"
11080-232 = "(Tum!)"
11080-233 = "Eita, o que é isso?! É um lámen tamanho família gigante!"
11080-234 = "Chuto que dá umas 10 porções..."
11080-235 = "I-Isso não é um erro no pedido?! A gente não tem dinheiro pra pagar por isso..."
11080-236 = "Que nada, está certinho sim. Um Lámen Shibasaki comum de 580 ienes! Não é, Mestre?"
11080-237 = "É, minha mão acabou escorregando e foi um pouco a mais. Não esquentem a cabeça."
11080-238 = "Se o Mestre disse, não façam cerimônia! Bom apetite!"
11080-241 = "U-Uau..."
11080-242 = "Não entendi muito bem, mas que sorte! Bom apetite!"
11080-243 = "...Fufufu, confesso que isso estava fora dos meus planos, mas não podemos recusar tamanha gentileza."
11080-244 = "Vamos comer."
11080-245 = "(Slurp, slurp!)"
11080-246 = "!!"
11080-247 = "Q-Que delícia!"
11080-248 = "Olha, é bom mesmo! Quem diria que teria uma qualidade dessas num fim de mundo desses."
11080-249 = "(Aproxima-se) Não é? Não é? É uma delícia, né?"
11080-250 = "Ué...? A mesa ao lado..."
11080-251 = "Sim, sim, o lámen daqui é realmente o melhor. Tem até clientes que vêm de longe só pra comer aqui."
11080-252 = "É verdade, dá pra entender. Já comi em vários lugares, mas é raro encontrar um lámen desse nível."
11080-253 = "Ehehe... somos clientes frequentes daqui. Fico até feliz de ver alunas de outras escolas provando..."
11080-254 = "Esse uniforme é de Gehenna? Vieram de longe."
11080-255 = "Eu já vi uma cena parecida com essa. Acho que se chamava \"Uma Tigela de Lámen\"..."
11080-256 = "Uhe~ Não era \"Uma Tigela de Kakesoba\"?"
11080-259 = "(...)"
11080-260 = "(...O uniforme delas...)"
11080-261 = "(Opa, verdade.)"
11080-262 = "Ufufufu! Que maravilha encontrar gente com quem nos damos tão bem num lugar desses.#nIsso não estava nos planos, mas esses encontros inesperados são justamente o tempero da vida, não acham?"
11080-263 = "(Parece que a Aru-chan não percebeu?)"
11080-264 = "(...Devíamos contar?)"
11080-265 = "(...Tá engraçado demais, deixa quieto.)"
11080-272 = "(...)"
11080-274 = "Próximo;Batalha Sangrenta dos Ingratos"
