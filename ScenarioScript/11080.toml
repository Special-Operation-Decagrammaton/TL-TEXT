[translation]
11080-2 = "Эпизод 8; Мощь «Решал 68»"
11080-3 = "Комната Комитета по предотвращению закрытия"
11080-4 = "Хорошо. Пора начинать очередное плановое собрание Комитета по предотвращению закрытия Абидоса."
11080-5 = "Напоминаю, сегодня присутствует Сенсей, поэтому надеюсь, вы будете вести себя приличнее обычного..."
11080-6 = "Хорошо! ☆"
11080-7 = "Разумеется."
11080-8 = "Да ладно тебе. Говоришь так, будто раньше мы никогда не относились к собраниям серьёзно..."
11080-9 = "Хех. Спасибо, что присоединились к нам, Сенсей."
11080-10 = "[s] «Спасибо, что пригласили»."
11080-11 = ""
11080-12 = "Хорошо. Перейдём к делу и обсудим главный вопрос повестки... Как нам выплатить школьные долги? Предлагайте."
11080-13 = "Кто хочет высказаться — поднимайте руку!"
11080-14 = "О! Я! Я!"
11080-15 = "Да, первогодка Куроми Сэрика. Вам слово."
11080-16 = "Серьёзно, опять эта официальщина? Ненавижу, когда ты так делаешь..."
11080-17 = "А почему нет? Это наше первое официальное собрание за целую вечность."
11080-18 = "Да, что такого? Иногда приятно устроить всё как положено. Не каждый день у нас на собрании присутствует Сенсей."
11080-19 = "Если точнее, это вообще первое наше собрание с Сенсеем."
11080-20 = "Точно! Теперь мы прямо настоящий комитет! ☆"
11080-21 = "*вздыхает* Ладно. Вы всё-таки старше меня, так что..."
11080-22 = "Итак! Как казначей напоминаю: школа стоит на пороге банкротства!"
11080-23 = "Такими темпами Абидос действительно закроют. Понятно?"
11080-24 = "Ну да."
11080-25 = "Только ежемесячно мы платим почти 8 миллионов иен. Мы делаем всё возможное, чтобы держаться, но этой суммы едва хватает даже на проценты."
11080-26 = "Одними поимками разыскиваемых преступников и выполнением просьб жителей много не заработаешь."
11080-27 = "Если ничего не изменится, нам полный конец. Нам нужно что-то крупное! Огромное даже!"
11080-28 = "Что-то... крупное?"
11080-29 = "*шелест* Смотрите! Это листовка из центра города!"
11080-30 = "Это..."
11080-31 = "Дай-ка посмотрю."
11080-32 = "«Готова стать успешной бизнесвумен-миллиардершей? Разбогатей мгновенно с... сетью... браслетов... из германиевого гранита»?!"
11080-33 = "Именно! Мы все станем успешными бизнесвумен-миллиардершами!"
11080-34 = "..."
11080-35 = "Я недавно была в центре, и там такие крутые люди пригласили меня на семинар. Они рассказали про невероятные германиевые браслеты, которые приносят удачу!"
11080-36 = "..."
11080-37 = "Они настолько мощные, что достаточно просто носить их — и позитивная энергия сама растёт! А если найдёшь ещё трёх девочек, которые тоже хотят стать успешными бизнесвумен..."
11080-38 = ""
11080-39 = "Что? Почему вы так на меня смотрите?"
11080-40 = "Предложение отклонено."
11080-41 = "Что?! Почему?!"
11080-42 = "Сэрика... Ты когда-нибудь слышала выражение «финансовая пирамида»?"
11080-43 = "Это мошенничество."
11080-44 = "Что?!"
11080-45 = "Во-первых, не думаю, что германий вообще способен влиять на удачу. Во-вторых, если это такой выгодный бизнес, с какой стати они бесплатно раскрывают его на каком-то подозрительном семинаре?"
11080-46 = "Н-не может быть! Я уже купила два браслета, значит, это не может быть правдой!"
11080-47 = "Сэрика такая доверчивая, что даже мило! ☆"
11080-48 = "...!"
11080-49 = "Ох, Сэрика, какая же ты наивная. Милая, но наивная. Лучше становись умнее, а то какой-нибудь хитрый взрослый однажды всю тебе жизнь испортит!"
11080-50 = "Н-но... это звучало так убедительно. Я даже отказалась от обеда, чтобы накопить на них..."
11080-51 = "Ну-ну, Сэрика. Всё хорошо. Давай я угощу тебя обедом?"
11080-52 = "*шмыг* О-о. Нономи..."
11080-53 = ""
11080-54 = "Что ж... с предложением Сэрики закончили. Есть ещё идеи?"
11080-55 = "Я! Я!"
11080-56 = "Хорошо. Президент Таканаши Хошино, вам слово..."
11080-57 = "Спасибо. Кхм..."
11080-58 = "Знаете, в чём проблема нашей школы? Всё ученическое сообщество — это мы пятеро."
11080-59 = "Больше студентов — больше денег. Взять Тринити или Геенну с их десятками тысяч учащихся.#nПредставьте, сколько они получают только на ежемесячных школьных взносах!"
11080-60 = "Допустим... И?"
11080-61 = "Значит, нужно увеличить число студентов! С этого и начнём."
11080-62 = "А ещё у нас появится больше представителей и больше влияния в Генеральном ученическом совете."
11080-63 = "Признаю, мысль разумная. Но как ты предлагаешь этого добиться?"
11080-64 = "Просто. Похитим школьный автобус другой академии!"
11080-65 = "Что, простите?!"
11080-66 = "Перехватим автобус со студентами по дороге в школу и будем держать их в заложниках, пока они не подпишут заявление о переводе в Абидос!"
11080-67 = "Так мы точно повысим число учащихся! Хех!"
11080-68 = "Интересно."
11080-69 = "Так кто наша цель? Тринити? Геенна? Или Миллениум?"
11080-70 = "Стратегию придётся подстроить под выбранную цель."
11080-71 = "О, да? Тогда как насчёт Тринити? Нет, погодите! Давайте ударим по Геенне!"
11080-72 = "Подождите! Таким способом мы точно не увеличим число студентов!"
11080-73 = "К тому же руководство других школ наверняка даст отпор..."
11080-74 = "Хех. Пожалуй, да."
11080-75 = "«Пожалуй»?! Хошино... Можно хоть немного серьёзнее отнестись к собранию?"
11080-77 = "У меня есть идея ещё лучше."
11080-78 = "Ладно. Второгодка Сунаоками Широко, вам слово."
11080-79 = "Ограбим банк."
11080-80 = "Что?!"
11080-81 = "План беспроигрышный, и идеальная цель уже есть.#nОграбим Первый центральный банк в центре города."
11080-82 = "Я уже изучила всё: расположение хранилища, позиции охраны, слепые зоны камер и даже маршрут инкассаторской машины."
11080-83 = "Так вот чем ты всё это время занималась?!"
11080-84 = "За пять минут получим 100 миллионов иен. Зашли, вышли — проще простого.#nВот, я даже маски принесла."
11080-85 = ""
11080-86 = ""
11080-87 = ""
11080-88 = "Когда ты вообще успела всё это подготовить?"
11080-89 = "Ого! Широко, ты сама их связала?"
11080-90 = ""
11080-91 = ""
11080-92 = "Ух ты! Смотрите! Я похожа на лучадора?"
11080-93 = "..."
11080-94 = "А мне нравится! Всё или ничего! Разве не в этом смысл жизни, Сэрика?"
11080-97 = "Ещё чего! Ни за что! ОТКЛОНЕНО!"
11080-98 = "Она права! Мы не можем опуститься до настоящих преступников!"
11080-99 = ""
11080-100 = ""
11080-101 = "..."
11080-102 = "Можешь дуться сколько угодно, Широко, но есть границы, которые нельзя переходить!"
11080-103 = "*вздыхает* Серьёзно. Если сейчас никто не предложит нормальную идею..."
11080-105 = "Эй, извините! Теперь я!"
11080-106 = "Хорошо. Второгодка Изаёй Нономи... Если это не мошенничество и не нарушение закона, вам слово."
11080-107 = "Есть! У меня идеальная идея, и обещаю: она не незаконная и не финансовая пирамида. Вот эта точно сработает!"
11080-108 = "Два слова: поп-айдолы! Точнее — школьницы-поп-айдолы!"
11080-109 = "Поп-айдолы...?!"
11080-110 = "Именно! В аниме такое постоянно бывает. Ничто так не оживляет школу, как путь к поп-звёздам! Если мы все вместе ворвёмся в индустрию как поп-айдолы..."
11080-111 = "Отклонено."
11080-112 = "Что...? И эта идея тебе не нравится?"
11080-113 = "Почему нет? У тебя точно были бы поклонники, Хошино."
11080-114 = "Хех. Только извращенцам понравится такая хрупкая крошка, как я. Нет, спасибо."
11080-115 = "Но я даже придумала позы..."
11080-116 = "*позирует*"
11080-117 = "Кристина из Банды купальников! ♧"
11080-118 = "Вы что..."
11080-119 = "...ИЗДЕВАЕШЬСЯ?! Банда ЧЕГО?! Это же ужасно тупо!"
11080-120 = "О-о. А я всю ночь репетировала..."
11080-122 = "Это собрание уже ходит по кругу. Может, попробуем хотя бы что-нибудь решить? Хоть что-нибудь?"
11080-123 = "Почему бы не дать решить Сенсею? Сенсей, какую идею, по-вашему, стоит выбрать?"
11080-124 = "Да ладно! Вы уже хотите выбрать? Может, сначала предложим хоть несколько нормальных идей?"
11080-125 = "Всё будет хорошо. Если Сенсей поддержит идею, уверена, она окажется правильной."
11080-126 = "Погодите-ка. И где тут вообще логика?"
11080-127 = ""
11080-128 = "Ну, по крайней мере, это значит, что поп-айдолы отпадают... правда?"
11080-129 = "Поп-слава, встречай нас! ☆"
11080-130 = "*с надеждой снова надевает маску*"
11080-131 = "[s1] «Пора угнать школьный автобус!»\n[s2] «Идём грабить банк!»\n[s3] «Станьте поп-идолами! А я буду вашим менеджером!»"
11080-132 = ""
11080-133 = ""
11080-134 = ""
11080-135 = "И ВОТ ЭТО вы выбираете?! Вы уверены?!"
11080-136 = "Ха-ха-ха! Похоже, победитель определён. За дело!"
11080-137 = "Ура! Звучит так весело! ☆"
11080-138 = "Это ведь шутка... правда? Мы же не собираемся всерьёз..."
11080-139 = "А почему нет?"
11080-140 = "Если делать, так с размахом. Правда ведь, Аяне?"
11080-141 = "Очевидно..."
11080-142 = "Серьёзно?"
11080-144 = "КОНЕЧНО ЖЕ НЕТ!"
11080-145 = "*ГРОХОТ*"
11080-146 = "Она это сделала! Аяне перевернула стол!"
11080-147 = "..."
11080-148 = "А-а-а! Аяне вошла в режим берсерка! Всем в укрытие!"
11080-149 = "Какой строгой юной леди она выросла. Моё старушечье сердце гордится."
11080-150 = "Вы можете хоть секунду быть серьёзными?! Клянусь, такое чувство, будто Я здесь единственная взрослая!"
11080-151 = "Вы четверо только и делаете, что валяете дурака! Ограбление банка, финансовые пирамиды...#nЭто что, какая-то шутка?!"
11080-153 = "*вздрагивает*"
11080-154 = "..."
11080-156 = "Аяне ещё некоторое время отчитывала всех подряд."
11080-158 = "Всё будет хорошо, Аяне. Мы виноваты, ладно?#nДавай я угощу тебя рамэном в качестве извинения."
11080-159 = "Я... не злюсь..."
11080-160 = "Вот и хорошо. Тише-тише. Умница. ☆"
11080-161 = "Хватит обращаться со мной как с ребёнком!"
11080-162 = "Это всё прекрасно, но вам обязательно было снова сюда приходить?"
11080-163 = "Хочешь ещё тясю, Аяне?"
11080-164 = "*ням* *ням* Ага."
11080-165 = "(дверь открывается)"
11080-166 = "..."
11080-167 = "О... Э-эм..."
11080-168 = "Добро пожаловать! Сколько вас человек?"
11080-169 = "Эм... Простите. А сколько стоит самое дешёвое блюдо у вас?"
11080-170 = "Самое дешёвое?"
11080-171 = "Обычная порция «Шиба Сэки Рамэн» за 580 иен!#nЭто наше фирменное блюдо, и оно очень вкусное!"
11080-172 = "О, эм, спасибо!"
11080-173 = "(дверь открывается)"
11080-174 = "Хм?"
11080-175 = "(дверь открывается)"
11080-176 = ""
11080-178 = ""
11080-179 = ""
11080-180 = ""
11080-181 = "Хех. Наконец-то мы нашли что-то дешевле 600 иен!"
11080-183 = "Сэкономленная иена — заработанная иена. Я знала, что мы что-нибудь найдём."
11080-184 = "В-вы были правы. Похоже, вы и правда всё знаете, босс..."
11080-185 = "*вздыхает*"
11080-186 = ""
11080-188 = "Итак, вас четверо? Я провожу вас к столику."
11080-189 = "Ой, нет-нет-нет. Не нужно. Мы собираемся заказать только одну порцию."
11080-190 = "Только одну...? Всё равно располагайтесь поудобнее. К тому же сейчас у нас не особо людно."
11080-191 = "Как мило с вашей стороны. Тогда не откажемся."
11080-192 = "А, и принесите нам четыре пары палочек, пожалуйста.#nСпасибо, девушка."
11080-193 = "Четыре пары? Эм... вы ведь не собираетесь делить одну миску на четверых, правда?"
11080-194 = "П-простите! Мне так жаль! Простите, что мы без денег и такие бедные!"
11080-195 = "Что...?! То есть за такое вообще-то не надо извиняться..."
11080-196 = "Нет, правда! Какой смысл вообще так жить? Мы только воздух зря переводим!#nНиже грязи! Нам вообще не стоило сюда заходить. Простите, простите, простите..."
11080-197 = "*вздыхает* Да господи... Хватит, Харука. Ты сцену устраиваешь."
11080-198 = "Не говори так! Быть бедной — не преступление и не повод для стыда.#nНе нужно так жестоко к себе относиться!"
11080-200 = "Н-не нужно...?"
11080-201 = "Вы же студенты! Никто не ожидает, что у вас будут горы денег. Но вы с подругами всё равно наскребли достаточно, чтобы вместе разделить миску рамэна. Это ведь уже о многом говорит, правда?"
11080-202 = "Подождите немного. Я с радостью принесу ваш заказ."
11080-205 = "Кажется, она всё неправильно поняла."
11080-206 = "Ага! Мы же не нищие. Просто Ару спустила все наши деньги."
11080-207 = "Для тебя я «босс». Начальнику штаба Муцуки пора бы помнить, как обращаться к руководителю."
11080-208 = "Серьёзно? Даже вне работы нам всё ещё называть тебя боссом? И что это за босс, который не может угостить сотрудников ничем, кроме одной жалкой миски рамэна?"
11080-209 = "..."
11080-210 = "Может, стоило подумать об этом до того, как ты спустила все наши деньги на наёмных головорезов."
11080-211 = "Хех. А чего ещё вы от меня ожидали? Радуйтесь, что хотя бы на миску рамэна осталось."
11080-212 = "Ты могла бы поторговаться так, чтобы хватило на четыре, знаешь ли..."
11080-213 = "Просто признай, что забыла заложить ужин в сегодняшние расходы, Ару."
11080-214 = "Хе-хе-хе..."
11080-215 = "Я понимаю, зачем ты хотела снизить риски операции. Ты права: цель нельзя недооценивать. Это не какие-то статисты вроде Банды шлемов."
11080-216 = "Но серьёзно, босс? Эти студенты Абидоса действительно стоят того, чтобы спустить весь бюджет на дополнительную поддержку?"
11080-217 = "Возможно..."
11080-218 = "Ару, наверное, и сама не знает. Поэтому и наняла этих головорезов — потому что струсила."
11080-219 = "Кого это ты назвала трусихой?! Я просто проявляю осторожность и страхуюсь со всех сторон!"
11080-220 = "Провал недопустим. Вы все знаете девиз Решал 68:#nБудь готова к неожиданностям."
11080-221 = "Впервые слышу этот девиз."
11080-222 = "По-моему, она только что его придумала."
11080-223 = "Заткнитесь! Когда закончим работу и получим деньги, я свожу вас всех на сукияки. Так что выкладывайтесь на полную!"
11080-224 = "Сукияки...?! А это что?"
11080-225 = "Блюдо, которое любят взрослые. И очень дорогое..."
11080-226 = "О-ого. Тогда не знаю, достойна ли такая грязь, как я, оценить его вкус. После такого излишества мне придётся пожертвовать жизнью?"
11080-227 = "Фу-фу-фу. Мы уже практически титаны индустрии. Нам положено только лучшее, согласны?"
11080-228 = "Хех! Амбиций тебе не занимать, Ару."
11080-229 = "Я сказала называть меня боссом!"
11080-231 = "Заказ готов! Миска горячая, осторожно!"
11080-232 = "*тук*"
11080-233 = "Что за...? Эта миска огромная."
11080-234 = "Такое ощущение, что из неё десятерых можно накормить..."
11080-235 = "Эм, вы уверены, что это наш заказ? У нас нет денег заплатить за что-то такое..."
11080-236 = "Именно это вы и заказали. Обычная порция «Шиба Сэки Рамэн» за 580 иен. Верно, хозяин?"
11080-237 = "Ну, может, я самую малость переложил, но ничего страшного."
11080-238 = "Хозяин сказал, что всё нормально, так что не переживайте! Приятного аппетита!"
11080-239 = ""
11080-241 = "О-ого..."
11080-242 = "Предлагаю сначала съесть, а вопросы задавать потом. Палочки наготове!"
11080-243 = "Такого я не ожидала, но возвращать блюдо было бы невежливо."
11080-244 = "Приступим!"
11080-245 = "*хлюп*"
11080-246 = "...!"
11080-247 = "Э-это так вкусно!"
11080-248 = "Очень даже неплохо. Кто бы мог подумать, что в такой глуши есть настолько хороший рамэн-бар?"
11080-249 = "*втискивается* Вот-вот! Правда, лучший?"
11080-250 = "А? Разве ты не сидела за соседним столом?"
11080-251 = "Ага! Здесь лучший рамэн в округе. Люди приезжают издалека только ради него."
