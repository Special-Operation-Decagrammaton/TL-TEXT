[translation]
2001602-1 = "Засада для фройляйн"
2001602-2 = "Один мирный солнечный день."
2001602-3 = "Я наслаждался редким ленивым днём."
2001602-4 = "[ns] «Какой сегодня хороший день.»"
2001602-5 = ""
2001602-9 = ""
2001602-10 = "Простите, Сенсей."
2001602-11 = "[s1] «Что-то случилось?»\n[s2] «Что такое, Ироха?»"
2001602-12 = "Ничего. Я спросила вас в MomoTalk, и вы сказали, что находитесь в Шале."
2001602-13 = "Ничего. Я спросила вас в MomoTalk, и вы сказали, что находитесь в Шале."
2001602-14 = "Вот я и пришла."
2001602-15 = "Мы получили задание от Общества Пандемониума. Приказ — выманить вас."
2001602-16 = "Любыми средствами. Нам разрешено угрожать вам, вести переговоры, взять вас в заложники или даже..."
2001602-17 = "Даже соблазнить вас и переманить на нашу сторону."
2001602-18 = "Вот, в общем-то, и всё."
2001602-19 = "[s] «Эм... А тебе вообще можно мне это рассказывать?»"
2001602-20 = "..."
2001602-21 = "Как же это раздражает."
2001602-22 = "[s] «Это ТЕБЯ раздражает?!»"
2001602-23 = "Я ненавижу глупые вопросы."
2001602-24 = "Но если вам так нужен ответ... всё просто."
2001602-25 = "Я решила, что выдумывать что-то бессмысленно."
2001602-26 = "По моим данным, вы не из тех, кто ведётся на подозрительные уловки."
2001602-27 = "Я решила, что лучший вариант — сразу выложить все карты на стол и просто держаться рядом с вами."
2001602-28 = "Тогда хотя бы вы не будете плохо обо мне думать."
2001602-29 = "К тому же мне лень придумывать сложную стратегию."
2001602-30 = "[s] «Ну... спасибо за честность?»"
2001602-31 = "Да и вам ведь не нужен лжец в союзниках, правда?"
2001602-32 = "Я выбрала путь с минимумом усилий и максимумом эффективности."
2001602-33 = "[s] «Мне, вообще-то, всё равно, если ты хочешь что-то от меня скрыть.»"
2001602-34 = "...Что?"
2001602-35 = "Что вы имеете в виду? Я даже немного обиделась."
2001602-36 = "Вас правда устраивает, если кто-то притворяется, что вы ему нравитесь, хотя на самом деле хочет лишь использовать вас?"
2001602-37 = "Вы меня почти так же злите, как те идиоты из Тринити."
2001602-38 = "[s3] «Какое беспощадное наблюдение!»\n[s4] «Я бы просто предположил, что у тебя есть причины.»"
2001602-39 = "Я изучила вас перед разговором, но вы превзошли мои ожидания..."
2001602-40 = "Я изучила вас перед разговором, но вы превзошли мои ожидания..."
2001602-41 = "Хм... Но если так, возможно, мне придётся немного изменить стратегию."
2001602-42 = "Так что я объясню, хотя очень не хочу."
2001602-43 = "Сенсей, пожалуйста, одолжите Шале Обществу Пандемониума. Если это невозможно, просто помогите нам."
2001602-44 = "А если и это слишком много — считайте нас... заказчиком."
2001602-45 = "Если поможете, мы достойно вас отблагодарим."
2001602-46 = "Кажется, они сказали что-то вроде: «В день, когда мы захватим Кивотос, отдадим вам половину!»"
2001602-47 = "Ну, в контрактах обещания всегда немного преувеличены, правда?"
2001602-48 = "Давайте остановимся на: «Возможно, вы получите меньше половины, но что вообще такое половина? Это всё субъективно.» Просто разные трактовки."
2001602-49 = "Ну как? Хотите заключить эксклюзивный контракт с Обществом Пандемониума?"
2001602-50 = "[s] «Нет, спасибо.»"
2001602-51 = "Хм. Понятно. Какое облегчение."
2001602-52 = "[s] «А?»"
2001602-53 = ""
2001602-55 = ""
2001602-56 = ""
2001602-57 = "[ns] «Ироха? Почему ты теперь лежишь на диване?»"
2001602-58 = "Секунду, Сенсей. Я устраиваюсь поудобнее."
2001602-59 = ""
2001602-62 = "А-а-а... Так гораздо лучше."
2001602-63 = ""
2001602-67 = "[ns5] «Что? Ты теперь читать собралась?!»\n[ns6] «Я вообще не понимаю, что ты делаешь!»"
2001602-68 = "А, точно..."
2001602-69 = "А, точно..."
2001602-70 = ""
2001602-72 = ""
2001602-73 = "[ns] «Я так и знал, что тут что-то ещё!»"
2001602-74 = "У вас здесь есть кофе, да? Можете сделать мне эспрессо?"
2001602-75 = "Я хочу сегодня закончить эту книгу, так что..."
2001602-76 = ""
2001602-78 = ""
2001602-79 = "[ns] «П-Простите?!»"
2001602-83 = "Я провёл очень неловкий день рядом с Ирохой, которая без всяких объяснений развалилась на диване в Шале."
