[translation]
42090-1 = "Эпизод 9;Новый рассвет D.U."
42090-2 = "На следующее утро, перед парком Коусаги."
42090-3 = ""
42090-6 = "Внимание, жители. Сегодня в 00:00 вступает в силу новый исполнительный указ."
42090-7 = "Подробности можно узнать на сайте Генерального студенческого совета и в местных административных органах. Рассчитываем на ваше активное сотрудничество при будущих проверках правоохранительных органов."
42090-8 = "Генеральный студенческий совет не несёт ответственности за ущерб или травмы, возникшие в результате отказа подчиняться."
42090-9 = "Повторяем: внимание, жители. Сегодня в 00:00 вступает в силу новый исполнительный указ."
42090-10 = "Это реально происходит?"
42090-11 = "Похоже на то. Хотя я даже не понимаю, что именно «это»."
42090-12 = "Я уже пыталась прочитать пункты на их тупом сайте, но там всё настолько запутано, что вообще невозможно понять смысл."
42090-13 = "К-Как думаете, с Сенсеем всё хорошо...? Мы ничего не слышали с тех пор, как вчера он пошёл в здание Генерального студенческого совета..."
42090-15 = "С Сенсеем всё будет хорошо. Влияние нового совета пока не распространилось на башню Санктум."
42090-16 = "Меня больше всего волнует, что сейчас происходит по всему городу."
42090-17 = "Одних объявлений хватало, чтобы насторожиться, а с утра улицы заполонила целая колонна бронетранспортёров и солдат."
42090-18 = "Неужели опять переворот?"
42090-19 = "Слишком уж жутко тихо. При перевороте мы бы хотя бы слышали стрельбу."
42090-20 = "Т-Трудно сказать... Отсюда город вообще не видно..."
42090-21 = ""
42090-23 = ""
42090-25 = ""
42090-26 = "Сейчас информация — наш важнейший ресурс. Придётся провести разведку в поле."
42090-27 = "Снаряжайтесь, отряд RABBIT. Разберёмся, что происходит."
42090-28 = "Ох... Ох, боже..."
42090-30 = ""
42090-31 = ""
42090-32 = "Разве это не те идиоты из спецназа Кайзер или как их там?"
42090-33 = "Ага, узнаю их! Почему они в полном снаряжении посреди города? Тут же сплошные гражданские районы..."
42090-35 = "Внимание, граждане. С сегодняшнего дня контроль безопасности в 47 районах, включая город Коусаги, переходит к Служба безопасности Кайзер."
42090-36 = "В соответствии с волей временной председательницы Генерального студенческого совета и новым исполнительным указом Служба безопасности Кайзер будет обеспечивать общественный порядок в Кивотосе."
42090-37 = "Просим общественность сотрудничать, чтобы переход прошёл без затруднений—"
42090-39 = "Ох блин... Я ужасно опаздываю..."
42090-40 = ""
42090-42 = ""
42090-43 = "Почему светофор сегодня так долго?"
42090-44 = "Такими темпами точно опоздаю..."
42090-45 = "Машин всё равно нет; может, просто пойду—"
42090-47 = "Стоять!"
42090-48 = "Эм... я?"
42090-49 = "Да, вы."
42090-50 = "Почему пытаетесь перейти улицу на красный?"
42090-51 = "Я опаздывала на встречу и торопилась..."
42090-52 = "Мне очень жаль. Может, в этот раз простите...?"
42090-53 = "Правила одинаковы для всех!"
42090-54 = "За нарушение правил Генерального студенческого совета и создание помех дорожному движению..."
42090-56 = "Вам назначается штраф в 100 000 йен!"
42090-58 = "Сто тысяч йен за переход на красный?!"
42090-59 = "То есть я понимаю, что переходить нельзя, но это же намного больше обычного—"
42090-60 = "...Вы оспариваете волю временной председательницы Генерального студенческого совета?"
42090-61 = "Недопустимо! Вы арестованы за подстрекательство к мятежу!"
42090-62 = "Да быть такого не может!"
42090-64 = "Так, как эта штука работает? Вот эта кнопка?"
42090-65 = "Что там? Почему все толпятся вокруг банкомата?"
42090-66 = "Эй, вы. Почему задерживаете очередь?"
42090-67 = "Пожалуйста, потерпите. Я старый человек и плохо разбираюсь в технологиях."
42090-68 = "Иногда мне нужно время, чтобы снять деньги... Нужно только найти правильную кнопку..."
42090-69 = "Все равны! Никаких исключений! Все граждане имеют право пользоваться общественной инфраструктурой!"
42090-71 = "Когда отведённое время истекло, вы обязаны отойти. Из-за вашего эгоизма образовалась очередь!"
42090-72 = "Уф... Теперь даже деньги нормально снять нельзя..."
42090-74 = ""
42090-76 = ""
42090-77 = "Эй, вы! Что у вас в руке?"
42090-78 = "...Это? Просто граната."
42090-79 = "Просто граната? ПРОСТО?!"
42090-80 = "Просто смертоносное взрывное устройство, способное одним броском разрушить здания и ранить граждан?!"
42090-81 = "Вы террористка? Кто цель?"
42090-82 = "Погодите! С каких пор нам нельзя носить с собой гранаты?"
42090-83 = "Вы же не скажете, что мне нельзя носить учебники или бутылку воды?! Уверена, гранаты вообще указаны в списке наших припасов!"
42090-84 = "Согласно новым исполнительным указам, носить на территории D.U. взрывчатку массой более 100 граммов незаконно!"
42090-86 = "Вы арестованы за подготовку террористического акта!"
42090-87 = "Да ладно! Это же абсурд!"
42090-89 = "Повсюду солдаты, и они арестовывают граждан направо и налево."
42090-90 = "И с каких пор в городе запрещено носить гранаты? Если бы это было незаконно, меня бы сто лет назад посадили!"
42090-91 = "Это всё часть нового исполнительного указа. Там столько новых правил и ограничений, что по ним можно целый курс преподавать. Учебник был бы огромным..."
42090-92 = "Кхм. Мы сейчас не о том. С каких пор Корпорация Кайзер занимается охраной общественного порядка?"
42090-93 = "Разве после последней неудачной попытки переворота вся эта компания не должна сидеть за решёткой?"
42090-95 = "Похоже, у Кайзер куда больше влияния, чем мы думали... Не могу смотреть, как силовики запугивают и арестовывают жителей, даже под предлогом борьбы с преступностью. Справедливость так не защищают."
42090-96 = "Н-Но... сегодня действительно как будто больше порядка."
42090-97 = "В обычный день в Кивотосе какие-нибудь идиоты уже стреляли бы или пытались взорвать нас гранатомётом."
42090-99 = "При таком угрожающем присутствии силовиков никто не настолько глуп, чтобы что-нибудь начать."
42090-100 = "(...Почему всё это ощущается настолько неправильным?)"
42090-101 = "(Разве это не идеальное общество? Никто не совершает преступлений, потому что закон безраздельно правит городом. Тогда почему всё кажется таким... зловещим?)"
42090-102 = "(Это и есть справедливость, о которой я мечтала все эти годы?)"
42090-103 = ""
42090-104 = "Эй! Ты там! Что делаешь?"
42090-105 = ""
42090-106 = "Не знать меня... Полагаю, тебе впервые довелось узреть такое величие."
42090-107 = "Мы хорошо известны — даже знамениты — среди тех, кто стремится к минимализму и спокойствию. Чтобы не знать о нас, надо было жить в вопиющей роскоши."
42090-108 = ""
42090-110 = ""
42090-111 = "Я Декарт. Мы сообщество бедняков, желающих жить просто и честно — Искатели счастья в нестяжательстве. Для краткости — Искатели."
42090-112 = "Искатели...?"
42090-113 = "Именно. И мы не пиявки общества. Мы сами выбрали этот образ жизни, чтобы питать души: не работать, не владеть, не желать."
42090-114 = "Заинтересовались? Если вам близок наш образ жизни, пожалуйста—"
42090-115 = "Браво 1. Уведите этого идиота."
42090-116 = ""
42090-118 = ""
42090-119 = "Ну-ну, секундочку! Мы ничего плохого не сделали!"
42090-120 = "Если собираетесь нас увезти, хотя бы назовите причину."
42090-121 = "Хорошо, вот причина. Потому что вы НИЧЕГО не делали."
42090-122 = "Вы раковые паразиты, высасывающие жизнь из общества! Пожираете ресурсы и ничего не даёте взамен!"
42090-123 = "Для процветающего общества нам нужно... изменить образ мышления таких, как вы."
42090-124 = "Мы отправляем вас в трудовой центр Корпорация Кайзер работать. Пора приносить пользу обществу!"
42090-125 = "Нет..."
42090-127 = "Вы не заставите меня работать! Неееет!"
42090-128 = "Прошу прощения."
42090-129 = ""
42090-131 = ""
42090-132 = "Даже если ваши действия направлены на общественное благо и безопасность, вы не можете арестовывать граждан без ордера."
42090-133 = "Если вы так злоупотребляете властью, как член академии SRT я обязана вмешаться."
42090-134 = "Вы неправильно понимаете. Это воля временной председательницы. Вы ставите под сомнение её приказ?"
42090-135 = "Даже если это её воля—"
42090-136 = ""
42090-137 = "У оружия одна задача, и если оно не способно её выполнять — оно бесполезно."
42090-138 = ""
42090-139 = "..."
42090-140 = "В любом случае, из какой вы школы? Я не узнаю форму."
42090-141 = "Академия SRT..."
42090-142 = "SRT? Ничего не говорит."
42090-143 = "Прошу прощения? Вы пытаетесь нас спровоцировать?"
42090-144 = "Саки, Саки. Ничего страшного, если не знают. Значит, придётся объяснять им, кто мы, урок за уроком... Хи-хи."
42090-145 = "Кроме того, похоже, у вас оружие, нарушающее новый исполнительный указ..."
42090-146 = ""
42090-148 = ""
42090-150 = "Вы тоже задержаны! Бросить оружие и руки вверх!"
42090-151 = ""
42090-153 = ""
42090-154 = "RABBIT 1. Разрешение?"
42090-155 = "Разрешаю. По моему сигналу..."
42090-157 = "Всё нормально. Я сама разберусь."
42090-158 = ""
42090-159 = "Давно не виделись, отряд RABBIT."
42090-160 = "Генерал. С недавнего нападения на Шале."
42090-161 = "Тот самый, который чуть не взорвал здание во время операции по возвращению Шале?"
42090-162 = "Для меня честь, что моё решение настолько запомнилось такой элите."
42090-163 = "Не зазнавайся."
42090-164 = "Скорее твой абсурдный отказ признавать поражение настолько выделялся, что я не могла забыть."
42090-165 = "Ха-ха. Что ж, придётся довольствоваться этим."
42090-166 = "Признаю, тогда я, возможно, недооценила ваш отряд..."
42090-167 = "Но к вашему несчастью, я не настолько горда, чтобы не учиться на ошибках."
42090-169 = "Почему вы нас отпускаете? В той ситуации преимущество на вашей стороне."
42090-170 = "Ха! Будто эти рядовые смогли бы вас остановить... В любом случае у меня приказ."
42090-171 = "Причём прямой приказ временной председательницы Генерального студенческого совета: не провоцировать студентов SRT."
42090-172 = "Временной... От главы Каи?"
42090-173 = "Да. Похоже, она планирует восстановить академию SRT — на этот раз под собственным командованием."
42090-174 = "Если это правда, мы, может, и не союзники, но окажемся на одной стороне. У меня нет причин с вами драться."
42090-175 = "Она собирается... восстановить SRT?"
42090-176 = ""
42090-177 = "Ну-ну. Ты бледная. Что-нибудь нужно? Пробиотики? Еда?"
42090-178 = "Не стесняйтесь пользоваться услугами Кайзер. Все необходимые припасы доступны в Кайзер Express перед парком."
42090-179 = ""
42090-180 = "Разумеется, открыто выдавать вам запрещённое оружие мы не можем, но если понадобится..."
42090-182 = "Скажем так, можно устроить всё немного менее официально."
42090-183 = "Предложение звучит прекрасно, но я понимаю, когда что-то слишком хорошо, чтобы быть правдой."
42090-184 = "Что вы замышляете за кулисами?"
42090-185 = "Ваш прошлый план свергнуть Генеральный студенческий совет провалился в значительной степени из-за нас."
42090-186 = "Наверняка вы нас ненавидите?"
42090-188 = "Ха-ха. Разве это не очевидно?"
42090-189 = ""
42090-191 = ""
42090-192 = ""
42090-193 = "Терпеть вас не могу. SRT."
42090-194 = "У вас есть сила, о которой большинство может лишь мечтать, и вы растрачиваете её на свои поверхностные идеи о справедливости."
42090-195 = "Ваше ошибочное чувство праведности едва не стоило мне всего."
42090-196 = "Мысль уничтожить каждую из вас? Она... невероятно привлекательна."
42090-197 = "И-Ик..."
42090-198 = "Но иногда общество требует от нас быть милыми. Требует пожимать руки дрожащим маленьким кроликам."
42090-199 = "Личные обиды ничего не значат перед моими великими целями."
42090-200 = "В этом смысле председатель Кая подаёт хороший пример. Она сотрудничает с кем угодно, пока это двигает её к цели. Доказала это, снова протянув мне руку после моего предательства."
42090-201 = "Сотрудничество двух людей, понимающих, как использовать сильные стороны друг друга, крепче ваших жалких отношений."
42090-202 = "Товарищество? Дружба? Инструменты слабых."
42090-203 = "Значит, ты вообще ни во что не веришь?"
42090-204 = "У меня есть убеждения. Но они не диктуют мои миссии."
42090-205 = "Я выполняю приказы независимо от личных убеждений."
42090-206 = "Именно так выглядит идеальный солдат, настоящий агент спецопераций."
42090-207 = "Вы можете сказать то же о себе? Для меня вы сильные, но до смешного идеалистичные. Ноющие дети."
42090-208 = "Вы трусливая добыча, которая сражается с несправедливостью перед носом, но отворачивается от неравенства, которое вас не касается."
42090-209 = "Так что выигрывайте сколько угодно боёв — войну вы не выиграете. Вам не хватает решимости."
42090-210 = ""
42090-212 = ""
42090-213 = ""
42090-214 = "..."
42090-215 = "Возвращаемся, все."
42090-216 = "Разведданных собрано более чем достаточно."
42090-217 = ""
42090-219 = ""
42090-220 = "Не стесняйтесь взять бесплатные припасы Кайзер по дороге назад."
42090-221 = "Нет, спасибо."
42090-222 = "Я не настолько наивна, чтобы становиться должницей такого, как ты. Особенно когда не знаю, что ты задумал."
42090-223 = "О, прекрасно. По крайней мере у лидера есть немного здравого смысла."
42090-224 = "Что ж, тогда до встречи."
42090-225 = ""
42090-227 = ""
42090-229 = "Уф. Не верится, что нас так отчитал именно этот неудачник."
42090-230 = "Что-то не так..."
42090-231 = "Что? У меня что-то на лице?"
42090-232 = "Нет, я про то, как он нас дразнил."
42090-233 = "Ты обычно вспыльчивая идиотка, так что я просто ждала, когда у тебя лопнет шарик."
42090-234 = "Но ты реально сохранила спокойствие. Наша маленькая Саки наконец повзрослела?"
42090-235 = "Вокруг были солдаты с оружием! Дело не во взрослении. Я пыталась не дать нас убить! Мне хотелось взять лицо этого тупого генерала и..."
42090-236 = "...Но в одном он был прав."
42090-237 = "Доминирование в бою не поможет, если люди у власти каждый раз меняют правила, когда начинают проигрывать."
42090-238 = "В конце концов нас создали, чтобы выполнять приказы."
42090-239 = "В-в SRT всегда говорили: «На поле боя эмоции отвлекают. А отвлечение означает провал»."
42090-241 = "..."
42090-242 = "Думаю, пора обсудить слона в комнате. Что дальше, Мияко?"
42090-243 = "Слона? О чём ты?"
42090-244 = "Не прикидывайся. Юкино хочет расформировать нас и включить в FOX. Что ты хочешь делать?"
42090-245 = "Мне не хочется расформировывать RABBIT, но если академию SRT действительно восстановят, продолжать протест здесь будет бессмысленно..."
42090-246 = "Тогда, может, лучший вариант — быть хорошим оружием и слушаться."
42090-248 = "Серьёзно, сколько ещё мы будем жить в парке?"
42090-249 = "Мы не можем вечно рыться в поисках припасов. Денег зарабатывать не умеем, улучшить положение тоже. И лично я предпочла бы тёплую кровать, когда придёт зима."
42090-250 = "Я... Я сделаю то же, что и ты, Мияко."
42090-251 = ""
42090-253 = ""
42090-255 = "...Понятно."
42090-256 = ""
42090-258 = ""
42090-260 = "(Если глава Кая обещала восстановить академию SRT, продолжать баррикаду в парке бессмысленно...)"
42090-261 = "(Присоединиться к старшим — значит получить организованную жизнь, лучшее оружие и удобное место для всего отряда.)"
42090-262 = "(Что для меня важнее? Идеалы, в которые я вцепилась ногтями с первого дня в SRT, — всего лишь идеалы? Мечты?)"
42090-263 = "(...Важнее страдания моих товарищей.)"
42090-264 = ""
42090-266 = "Хорошо, слушайте все."
42090-267 = "Я не могу принять окончательное решение, пока не услышу вас."
42090-269 = "Следующий эпизод;Выход из-под контроля"
