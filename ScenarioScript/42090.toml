[translation]
42090-1 = "Episódio 9;Uma Nova Manhã no D.U."
42090-2 = "(Na manhã seguinte, em frente ao Parque Kousagi)"
42090-6 = "<Atenção, cidadãos.#n A partir da meia-noite de hoje, novas ordens executivas entraram em vigor.>"
42090-7 = "<Pedimos a todos os cidadãos que verifiquem os comunicados no site do Conselho Estudantil Geral ou nos órgãos administrativos de cada distrito. Caso haja solicitação de inspeção por parte das forças de segurança, solicitamos sua colaboração.>"
42090-8 = "<...O Conselho Estudantil Geral não se responsabiliza por quaisquer prejuízos decorrentes#ndo desconhecimento das ordens executivas ou da recusa em cooperar com as inspeções.>"
42090-9 = "<Repetindo o comunicado aos cidadãos. A partir da meia-noite de hoje, novas ordens executivas...>"
42090-10 = "...O que diabos está acontecendo?"
42090-11 = "Sei lá, eu também queria saber."
42090-12 = "Eu até dei uma olhada no site do Conselho Estudantil Geral,#nmas era só um monte de termo complicado que não deu pra entender nada..."
42090-13 = "Será que o Sensei está bem...?#nOntem ele foi chamado pelo Conselho Estudantil Geral, né..."
42090-15 = "Tenho certeza de que ele está bem.#nNão houve nenhuma mudança drástica na Torre Sanctum..."
42090-16 = "Além disso, nossa prioridade agora é verificar o que está acontecendo na área urbana."
42090-17 = "É. Além dessa transmissão de agora há pouco, o que me preocupa são os carros e blindados cheios de soldados armados indo pro centro desde cedo."
42090-18 = "Será que vai acontecer outro golpe de Estado?"
42090-19 = "Mas está silencioso demais pra isso, né..."
42090-20 = "Mesmo querendo checar a situação, daqui do parque não dá pra ver como está o centro..."
42090-26 = "...Vamos deixar o acampamento e ir conferir a situação na área urbana."
42090-27 = "Pessoal, preparem equipamento de reconhecimento e munição.#nAssim que estiverem prontas, partiremos para o destino."
42090-28 = "Tomara que não tenha acontecido nada..."
42090-32 = "Ei, aqueles ali não são as forças especiais da Kaiser Corporation?"
42090-33 = "Por que soldados corporativos estão no meio da cidade...?"
42090-35 = "Atenção, cidadãos. Conforme a ordem executiva em vigor a partir de hoje, os serviços de manutenção da ordem pública em 47 distritos administrativos, incluindo Kousagi Town, foram transferidos para a Kaiser Security."
42090-36 = "Esta operação conta com a autorização da Presidente Interina do Conselho Estudantil Geral.#nA Kaiser Security compromete-se a cumprir suas funções com imparcialidade, em conformidade com a ordem executiva."
42090-37 = "Agradecemos a compreensão e a colaboração de todos os cidadãos—"
42090-39 = "Droga, tô atrasado, tô atrasado!"
42090-43 = "Ah, por que logo hoje esse semáforo tá demorando tanto pra abrir?!"
42090-44 = "Desse jeito eu vou chegar atrasado de verdade..."
42090-45 = "...Não tá vindo nenhum carro. Se eu for agora—"
42090-47 = "Ei, você aí! Pare!"
42090-48 = "Hã?! E-Eu...?"
42090-49 = "Sim, você mesmo."
42090-50 = "Você acabou de tentar atravessar a faixa com o sinal vermelho, não foi?"
42090-51 = "I-Isso foi porque... eu estava quase me atrasando pra um compromisso e acabei indo sem pensar..."
42090-52 = "Desculpe! Mas será que não dá pra relevar só dessa vez...?"
42090-53 = "Negativo! As regras devem ser aplicadas de forma igualitária a todos!"
42090-54 = "Como penalidade por ignorar as normas do Conselho Estudantil Geral#ne tentar perturbar o sistema de trânsito—"
42090-56 = "Você pagará uma multa de 100 mil ienes!"
42090-58 = "C-Cem mil ienes?!#nSó porque eu quase atravessei no vermelho?!"
42090-59 = "Olha, eu sei que errei, claro, mas isso já é absurdo—"
42090-60 = "...Posso interpretar essas palavras como desacato ao Conselho Estudantil Geral?"
42090-61 = "—Você está preso em flagrante por incitação à insurreição!"
42090-62 = "N-Não pode ser uma loucura dessas!!"
42090-64 = "Vejamos, esse botão aqui... pra que servia mesmo?"
42090-65 = "Aquele caixa eletrônico ali... por que está tão lotado?"
42090-66 = "Ei, você aí! Por que está enrolando tanto?"
42090-67 = "Ai...! E-Espere um pouquinho. Essa máquina é muito difícil de mexer..."
42090-68 = "Nessa minha idade, até pra sacar dinheiro a gente acaba demorando..."
42090-69 = "Não quero ouvir desculpas! Não está vendo a fila atrás de você?!"
42090-71 = "Pare de fazer corpo mole aí!#nNão fique monopolizando um equipamento público que pertence a todos!"
42090-72 = "Ah... por que isso comigo..."
42090-77 = "Ei, o que é isso na sua mão?"
42090-78 = "...Hã? É só uma granada de mão..."
42090-79 = "Uma granada de mão?!"
42090-80 = "Andar por aí abertamente com uma arma perigosa capaz de causar grandes danos apenas puxando o pino e arremessando..."
42090-81 = "Você pretende cometer um atentado terrorista, não é?!"
42090-82 = "E-Espera um segundo!#nEu nunca ouvi falar que era proibido andar com granada de mão!!"
42090-83 = "Aliás, granada de mão é praticamente um item do dia a dia aqui em Kivotos, não é?!"
42090-84 = "Desde a meia-noite de hoje, está proibido portar armas com mais de 100 g de explosivos sem autorização dentro da área sob jurisdição do D.U.!"
42090-86 = "Prendam o suspeito por tentativa de terrorismo!"
42090-87 = "Aah... isso é absurdo demais...!"
42090-89 = "Prisão pra lá, prisão pra cá... virou um festival de prisões, hein."
42090-90 = "Mas, falando sério, que história é essa de proibir granada de mão?!#nEu nunca tinha ouvido falar de uma regra dessas!"
42090-91 = "É o que estava anunciado na ordem executiva.#nTambém foram adicionadas várias outras regras de segurança e controle..."
42090-92 = "Mas por que é a Kaiser Corporation,#ne não a Valkyrie, que está cuidando da segurança pública?"
42090-93 = "Eles não tinham sido presos depois daquele golpe de Estado?"
42090-95 = "Além disso, mesmo que seja para prevenir crimes,#nnão acho certo sair levando cidadãos e espalhando medo assim."
42090-96 = "Mas... o centro realmente está meio silencioso hoje, né..."
42090-97 = "Verdade~ Num dia normal, sempre tem pelo menos um ou dois malucos metendo bala ou jogando bomba por aí, né."
42090-99 = "Com a situação assim, onde basta sacar uma arma ou bomba pra ser preso na hora,#nparece que nenhum idiota teve coragem de fazer bagunça."
42090-100 = "(...Que sensação estranha.)"
42090-101 = "(É uma sociedade onde todos seguem as regras e a justiça se cumpre pela lei...#nmas eu não sinto segurança nenhuma.)"
42090-102 = "(Será que era essa a justiça com a qual eu sonhava...?)"
42090-104 = "Ei, você aí. Identifique-se."
42090-106 = "Ora, ora... quer dizer que não nos conhecem?"
42090-107 = "Qualquer um que busque uma vida de pobreza virtuosa nos conhece...#nPelo visto, os senhores têm vivido bem distantes desse caminho."
42090-111 = "Meu nome é Descartes.#nSou o líder da sociedade em busca da pobreza virtuosa — a \"Associação da Felicidade Certa Sem Posse\",#nabreviada como \"Fecespo\"!"
42090-112 = "Fecespo...?"
42090-113 = "Exatamente. Somos buscadores espirituais que vivem nas ruínas,#nseguindo o lema de não trabalhar e nada possuir."
42090-114 = "O que acham? Os senhores também não têm interesse numa vida de pobreza virtuosa—"
42090-115 = "Bravo 1, leve-os."
42090-119 = "E-E-E-Espera aí!!#nO que foi que nós fizemos?!"
42090-120 = "Se vão nos levar, pelo menos digam o motivo!!"
42090-121 = "...Justamente porque vocês não fazem nada."
42090-122 = "Vocês não passam de pragas que parasitam esta sociedade, consumindo recursos sem trabalhar."
42090-123 = "Para a manutenção de uma sociedade saudável,#né necessário reabilitar parasitas sociais como vocês."
42090-124 = "Portanto, vocês serão enviados ao centro de recolocação profissional da Kaiser Corporation.#nLá conseguirão um emprego, vão trabalhar e logo renascerão como excelentes trabalhadores que contribuem para a sociedade!"
42090-125 = "N-NÃÃÃÃO!!"
42090-127 = "Eu não quero virar escravo corporativoooo!!"
42090-128 = "Por favor, esperem."
42090-132 = "Por mais que seja pela segurança pública,#nvocês não podem deter cidadãos sem um mandado."
42090-133 = "Se continuarem abusando de sua autoridade, nós vamos—"
42090-134 = "Do que está falando? Estas são \"ordens\" da Presidente Interina do Conselho Estudantil Geral — pretende desobedecer?"
42090-135 = "Ordens...?"
42090-137 = "Uma arma só tem valor justamente porque não toma decisões por conta própria."
42090-139 = "..."
42090-140 = "Aliás, de que academia vocês são?#nNunca vi esse uniforme antes."
42090-141 = "Hã, da Academia Especial SRT..."
42090-142 = "...Academia Especial SRT?#nNão consta nenhuma academia com esse nome no registro oficial."
42090-143 = "O quê?! Tá procurando briga?"
42090-144 = "...Bom, se não conhece, tudo bem.#nÉ só a gente ensinar bem devagarinho agora mesmo, né?#nHihihi..."
42090-145 = "Além disso, parece que vocês carregam um belo arsenal que viola a ordem executiva..."
42090-150 = "Estão todas presas! Larguem as armas e levantem as mãos imediatamente!"
42090-154 = "...RABBIT 1, quais são as ordens?"
42090-155 = "...Autorizado. Assim que eu der o sinal—"
42090-157 = "...Deixe-as. Podem liberá-las."
42090-159 = "Há quanto tempo, Esquadrão RABBIT."
42090-160 = "Você é... aquele de antes...?"
42090-161 = "O comandante que tentou explodir o prédio bem na nossa frente durante a operação de retomada da Schale?"
42090-162 = "É uma honra que a elite da Academia Especial SRT se lembre da minha decisão."
42090-163 = "...Não."
42090-164 = "Na verdade, eu só lembrei porque a sua cara de desespero foi bem marcante."
42090-165 = "Hehe... isso também aconteceu, não é?"
42090-166 = "De fato, naquela ocasião eu subestimei vocês."
42090-167 = "Mas agora é diferente. Não sou do tipo incompetente que não aprende com os próprios erros."
42090-169 = "...Por que está nos deixando ir?"
42090-170 = "Porque recebemos \"ordens\"."
42090-171 = "Diretamente da Presidente Interina do Conselho Estudantil Geral, proibindo qualquer hostilidade contra alunas da Academia Especial SRT."
42090-172 = "A Chefe Kaya, do Gabinete de Defesa...?"
42090-173 = "Exato.#n—Aliás, ela mencionou que vai reativar a Academia Especial SRT e colocá-la sob seu comando direto."
42090-174 = "Quando isso acontecer, seremos aliados.#nNão há vantagem alguma em criar inimizade com futuros parceiros."
42090-175 = "A reativação... da Academia Especial SRT..."
42090-177 = "Hm? Vocês não parecem com uma cara muito boa. Têm se alimentado direito?"
42090-178 = "Se estiverem sem suprimentos, nós da Kaiser Corporation podemos apoiá-las.#nTemos estoque de sobra, seja de munição ou de provisões.#nSe precisarem, mando entregar na frente do parque pela Kaiser Express a qualquer momento."
42090-180 = "Mesmo que o que precisem sejam armas proibidas pelo decreto..."
42090-182 = "Não seria impossível dar um jeito."
42090-183 = "...A oferta até parece boa, mas sendo escancarado assim só deixa tudo mais suspeito, né."
42090-184 = "É... por que toda essa gentileza?"
42090-185 = "Por nossa causa, o seu plano fracassou e vocês sofreram prejuízos enormes..."
42090-186 = "Você não deveria guardar rancor de nós?"
42090-188 = "Hehe, faz uma pergunta bem óbvia."
42090-193 = "—Sim, é claro que eu detesto vocês da SRT."
42090-194 = "Vocês possuem um poder imenso, que pessoas comuns jamais alcançariam mesmo se esforçando a vida inteira,#ne o desperdiçam em bobagens como justiça e convicções..."
42090-195 = "Graças a essa brincadeira ridícula de justiça,#nquase perdi tudo o que levei meia vida para construir."
42090-196 = "Fazer todas vocês se ajoelharem aqui e pisar em suas cabeças com minhas botas ainda seria pouco...!"
42090-197 = "I-Iih...!"
42090-198 = "...Mas um verdadeiro profissional é aquele capaz de apertar a mão com um sorriso,#npor mais que odeie quem está à sua frente."
42090-199 = "Quem escolhe com quem lidar por rancor pessoal jamais realiza grandes feitos."
42090-200 = "Nesse sentido, a Presidente Interina Kaya é realmente um exemplo admirável.#nMesmo a um traidor que apontou uma arma para a sua nuca, ela estende a mão sem hesitar pensando no futuro."
42090-201 = "O vínculo entre pessoas que sabem exatamente como usar umas às outras é mais forte do que qualquer coisa."
42090-202 = "Essas bobagens de amizade e camaradagem não passam de ilusões para consolar os incapazes."
42090-203 = "...Você não tem nenhuma convicção?"
42090-204 = "Convicção? É claro que tenho.#nMas isso é algo completamente separado do cumprimento da missão."
42090-205 = "Receber ordens e cumpri-las, mesmo que contrariem as próprias convicções."
42090-206 = "É assim que um verdadeiro adulto age, e é assim que uma força especial deve ser."
42090-207 = "Em comparação, vocês... são como bebês que só têm força."
42090-208 = "Covardes que se revoltam com a injustiça diante dos olhos, mas fecham os olhos para os absurdos fora do seu alcance."
42090-209 = "É por isso que podem até vencer uma \"batalha\", mas jamais vencerão uma \"guerra\"."
42090-214 = "..."
42090-215 = "...Vamos voltar."
42090-216 = "Já coletamos informações suficientes em campo."
42090-220 = "Já vão embora? Não querem levar pelo menos alguns suprimentos?"
42090-221 = "Não, obrigada."
42090-222 = "Não somos tolas a ponto de contrair dívidas#ncom alguém cujas intenções desconhecemos."
42090-223 = "Haha, parece que a líder do esquadrão tem alguma cabeça no lugar. Fico aliviado."
42090-224 = "Então, até a próxima."
42090-229 = "Tsc... por que a gente tem que ficar ouvindo sermão de um cara daqueles?"
42090-230 = "...Que estranho."
42090-231 = "O que foi? Tem alguma sujeira na minha cara?"
42090-232 = "Não, tô falando de quando aquele comandante provocou a gente."
42090-233 = "Conhecendo a Saki, achei que você ia perder a cabeça e partir pra cima dele no meio da conversa,#nmas conseguiu se segurar até o fim."
42090-234 = "Hihihi, cresceu bastante, hein~ Muito bem~"
42090-235 = "O que você pensa que eu sou, Moe?#nPor mais que fosse, eu não sou idiota a ponto de avançar numa situação daquelas."
42090-236 = "...Além disso, o que ele disse no final não estava totalmente errado."
42090-237 = "Por mais que a gente derrote o inimigo em combate,#nse os superiores virarem o jogo, não temos como vencer a guerra."
42090-238 = "Pois é. No fim das contas, nós somos só operadoras#nque seguem ordens e executam missões."
42090-239 = "Também é verdade que, se a gente deixar as emoções falarem mais alto, não consegue se concentrar no combate..."
42090-241 = "..."
42090-242 = "Miyako, o que a gente faz agora?"
42090-243 = "H-Hã? Como assim, agora?"
42090-244 = "Tem um monte de coisas, né? Tipo o assunto do destacamento que as veteranas do Esquadrão FOX mencionaram ontem."
42090-245 = "Sinceramente, não me agrada muito...#nmas se a academia vai ser reativada, não faz sentido continuar com o protesto..."
42090-246 = "Talvez ouvir o que as veteranas disseram seja mesmo a melhor escolha."
42090-248 = "Na verdade, eu também já nem sei direito#nse ainda tem motivo pra gente continuar no parque..."
42090-249 = "Os suprimentos estão ficando mais difíceis a cada dia, e quando o inverno chegar vai ser complicado até conseguir água..."
42090-250 = "Pra mim... tanto faz, mas..."
42090-255 = "...É... verdade."
42090-260 = "(Já que a Chefe Kaya garantiu a reativação da Academia Especial SRT,#nnão há mais motivo para continuarmos neste parque.)"
42090-261 = "(...Se formos com as veteranas, teremos uma rotina regrada, equipamentos poderosos, um quarto aquecido... teremos tudo.)"
42090-262 = "(Mas os sonhos e convicções que eu carregava desde que entrei na academia... o que será feito deles...?)"
42090-263 = "(......Mas, se for pelo bem de todas...)"
42090-266 = "...Pessoal, podem me dar um minuto?"
42090-267 = "Antes da decisão final, há algo que eu gostaria de perguntar a vocês."
42090-269 = "Próximo;Fora de Controle"
