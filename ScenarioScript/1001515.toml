[translation]
1001515-1 = "Арис и наклейки похвалы"
1001515-2 = "По просьбе Арис я отправился в комнату Отдела разработки игр."
1001515-3 = "Как только я пришёл..."
1001515-4 = ""
1001515-8 = "Сенсей!"
1001515-9 = "[s] «Арис!!»"
1001515-10 = "Ура, это Сенсей!"
1001515-11 = ""
1001515-15 = "Арис изо всех сил бросилась мне в объятия..."
1001515-16 = "Я чуть не повалился обратно в коридор!"
1001515-18 = ""
1001515-19 = "Добро пожаловать, Сенсей! Я с нетерпением ждала вашего прибытия!"
1001515-20 = "[s] «Спасибо! Что ты хотела мне показать?»"
1001515-21 = "Хи-хи-хи! Это будет..."
1001515-22 = "...вот это!"
1001515-24 = "Она протянула мне маленький кусочек пластика!"
1001515-25 = ""
1001515-26 = "[ns1] «Это... какая-то... значок?»\n[ns2] «Тут написано „Молодец“... Хм.»"
1001515-29 = "Это не значок. Это «Наклейка похвалы Сенсея», официальная фанатская сувенирка!"
1001515-30 = "Вы выглядите растерянным. Ну..."
1001515-31 = "Недавно мы все вместе работали над созданием roguelike-игры."
1001515-32 = "В ней мы запрограммировали уникальный счастливый предмет, который было невероятно трудно получить..."
1001515-33 = "...И назывался он «Наклейка похвалы Сенсея»!"
1001515-34 = "Даже не будучи экипированным, он усиливает персонажа и повышает удачу... просто находясь в инвентаре."
1001515-35 = "Это очень редкий и замечательный предмет!"
1001515-36 = "[s3] «А, понятно...»\n[s4] «Поэтому вы решили сделать настоящий сувенир.»"
1001515-39 = "Верно!"
1001515-40 = "Я хотела бы как следует раздать всем эти Наклейки похвалы!"
1001515-41 = "Итак, Сенсей, отправимся в великое приключение!"
1001515-43 = "Безграничный энтузиазм Арис вывел меня наружу."
1001515-45 = "Приветствую всех!"
1001515-46 = "Привет, Арис. Здравствуйте, Сенсей."
1001515-47 = "Что привело вас в лабораторию?"
1001515-48 = "Я пришла вручить вам Наклейку похвалы! Пожалуйста, получите её!"
1001515-49 = "«Молодец», значит? Да, я вроде ничего особенного не сделала, но приятно, когда это признают."
1001515-50 = "И это от Сенсея, да? Вы правда думаете, что я неплохо справляюсь?"
1001515-51 = "Спасибо, Сенсей."
1001515-52 = "[s] «О, пожалуйста... Хотя я вообще-то ничего не делал.»"
1001515-53 = "Хе-хе, но мне всё равно нравится."
1001515-54 = "Большое спасибо, Арис. Мне очень нравится."
1001515-55 = "Да, и я уверена, что впереди вас ждёт удача. Этот предмет должен повысить характеристику Удачи!"
1001515-56 = "Удача... Ага, мне пригодится сколько угодно."
1001515-57 = "...Разработка новых материалов ощущается почти как лотерея."
1001515-58 = "Растираешь материалы в ступке пестиком, запекаешь их..."
1001515-59 = "...снова измельчаешь в порошок, перетираешь, смешиваешь, снова смешиваешь, трясёшь, ТРЯСЁШЬ..."
1001515-60 = "По сути, бесконечно повторяешь одно и то же, а в конце молишься на прорыв."
1001515-61 = "О великий Владыка Наклейки похвалы, пусть в этот раз синтез пройдёт как надо!"
1001515-62 = "[s] «Д-должно быть, это очень тяжёлая работа...?»"
1001515-63 = "Хотя будущее трудно предсказать, мой друг..."
1001515-64 = "...в этот раз у вас всё получится!"
1001515-65 = "А теперь я отправляюсь раздавать ещё Наклейки похвалы!"
1001515-66 = ""
1001515-68 = ""
1001515-69 = "Эй, эй! Быстрее, показатель стабилизируется! Ты должна это увидеть!"
1001515-70 = "Что?! Правда?!"
1001515-71 = "Ага!"
1001515-72 = ""
1001515-74 = ""
1001515-75 = ""
1001515-76 = "Только не говорите..."
1001515-77 = "...Наклейка похвалы... и правда сработала...?"
1001515-79 = ""
1001515-80 = "Тогда мне пора! Продолжайте в том же духе! Всё обязательно получится великолепно! Платина!"
1001515-81 = "Спасибо. Я никогда в жизни не молился... пока мне не пришлось обслуживать эти серверы."
1001515-82 = ""
1001515-84 = ""
1001515-85 = "А...?"
1001515-86 = "Ошибка сервера исчезла?!"
1001515-88 = ""
1001515-89 = "Ага! Так вот они какие, эти наклейки, о которых я столько слышала..."
1001515-90 = "Да! Пожалуйста, берегите эту наклейку и с теплом вспоминайте меня и Сенсея!"
1001515-91 = "Конечно. Спасибо, Арис."
1001515-92 = ""
1001515-94 = ""
1001515-96 = "А? Я выиграла... третье место в розыгрыше талонов на еду?"
1001515-97 = "..."
1001515-98 = "Похоже, сегодня мне достанется дополнительная порция караагэ!"
1001515-100 = ""
1001515-101 = "Смотрите, он испускает инфракрасные лучи и отрицательные ионы, улучшая кровообращение!"
1001515-102 = "Он ещё и очищает ствол оружия от грязи, а даже простое ношение на руке снижает вероятность заклинивания пуль! Статистически!"
1001515-103 = "Это гер-гер-германиевый браслет! Как можно его не хотеть?!"
1001515-104 = ""
1001515-106 = ""
1001515-107 = "..."
1001515-108 = "*вздох* Сегодня торговля совсем не идёт..."
1001515-109 = "Здравствуйте! Вы сказали, что что-то идёт неудовлетворительно?"
1001515-111 = "Хм? Ну, тут..."
1001515-112 = "...возможно, есть небольшая проблема, да..."
1001515-113 = "Понятно... Тогда положите это в инвентарь."
1001515-114 = "Это Наклейка похвалы, которая повысит вашу характеристику Удачи!"
1001515-115 = "Ч-что, это развод? Сколько хотите?"
1001515-116 = "Нисколько. Я отдаю её бесплатно..."
1001515-117 = "...потому что хочу, чтобы больше людей стали счастливыми!"
1001515-118 = ""
1001515-120 = ""
1001515-121 = "Что это было...?"
1001515-122 = ""
1001515-125 = "Хм? Что это за звук?"
1001515-126 = "...! Заклинившая пуля сама выскочила!"
1001515-127 = ""
1001515-129 = ""
1001515-130 = "Странно... Неужели гер-гер-германиевый браслет и правда работает...?"
1001515-135 = "Мы с Арис раздавали Наклейки похвалы студентам по всему кампусу, а затем вернулись в комнату Отдела разработки игр."
1001515-136 = "И, конечно, любой хороший день должен завершиться... партией в видеоигры!"
1001515-137 = ""
1001515-138 = ""
1001515-139 = ""
1001515-140 = ""
1001515-141 = ""
1001515-142 = ""
1001515-143 = "Спасибо, Сенсей."
1001515-144 = "[s] «Хм? За что?»"
1001515-145 = "За то, что сегодня сопровождали меня на задании. И..."
1001515-146 = "...за то, что вот так играете со мной."
1001515-147 = "Я довольно часто играю с товарищами из Отдела разработки игр..."
1001515-148 = "Но редкое событие... играть наедине с вами, Сенсей."
1001515-149 = "Это награждает меня драгоценными и уникальными очками опыта."
1001515-150 = "[s] «Да пустяки.»"
1001515-151 = "Не говорите так. Мне правда нравится проводить с вами время."
1001515-152 = "Если выразить в цифрах, насколько мне это нравится..."
1001515-153 = "Если бы меня усиливали Сенсей и запас Наклеек похвалы..."
1001515-154 = "Я могла бы играть в видеоигры три ночи подряд без сна!"
1001515-155 = "[s5] «Не стоит так перебарщивать с играми...»\n[s6] «Три бессонные ночи подряд и меня бы доконали...»"
1001515-158 = "П-правда...? Простите..."
1001515-159 = "Но я уверена, что вам тоже пригодилась бы Наклейка похвалы, Сенсей. Моя сработала великолепно."
1001515-160 = "Когда у меня остался один пиксель ОЗ в файтинге, мне удалось сделать «идеальный блок» и заблокировать ультимативную атаку!"
1001515-161 = "А затем я ответила сверхультимативной контратакой в состоянии ярости!"
1001515-162 = "[s] «Ты правда это провернула?!»"
1001515-163 = "Да, один раз! Против Момои!"
1001515-164 = "В тот день комната Отдела разработки игр..."
1001515-165 = "...Эм, она..."
1001515-166 = "...буквально чуть не взорвалась!"
1001515-167 = "[s] «Надо было позвать меня!»"
1001515-168 = "Т-теперь, когда вы сказали..."
1001515-169 = "А! Простите, Сенсей!"
1001515-170 = "[s] «Всё нормально, всё нормально.»"
1001515-171 = ""
1001515-173 = ""
1001515-174 = ""
1001515-175 = ""
1001515-176 = "[ns7] «Но если это „моя“ наклейка, тогда...?»\n[ns8] «Мне как-то неловко будет носить такую.»"
1001515-179 = "Верно, Сенсей. Это действительно хороший довод."
1001515-180 = "Поэтому..."
1001515-181 = "Я сделала две Наклейки похвалы Арис специально для вас!"
1001515-182 = "[s] «Наклейки похвалы Арис?!»"
1001515-183 = ""
1001515-185 = ""
1001515-186 = ""
1001515-187 = ""
1001515-188 = ""
1001515-189 = ""
1001515-190 = "Да! Это особенная наклейка от меня для вас."
1001515-191 = "Ваш труд заслуживает признания!"
1001515-192 = "Конечно, в отличие от «Наклейки похвалы Сенсея», она не решит проблемы и не повысит вашу характеристику Удачи..."
1001515-193 = "Но я хочу, чтобы она была у вас. У меня есть такая же."
1001515-194 = "Благодаря этому я всегда буду чувствовать связь с вами."
1001515-195 = ""
1001515-197 = ""
1001515-198 = ""
1001515-199 = ""
1001515-200 = "[ns] «Да. Конечно.»"
1001515-201 = "Именно так, Сенсей."
1001515-202 = "Вы мне очень нравитесь."
1001515-203 = "[s] «Взаимно.»"
1001515-204 = "Спасибо, Сенсей."
1001515-205 = "А пока вы отвлеклись, я проведу комбо из двух ударов веером и удара ногой в прыжке, а затем оглушу вас тяжёлым ударом!"
1001515-206 = "И закончу особым супер-ультимативным приёмом третьего уровня!"
1001515-207 = ""
1001515-209 = ""
1001515-210 = "[ns9] «Т-ты меня достала!!!»\n[ns10] «Арис...! Не могу поверить, что ты была такой милой только затем, чтобы предать меня!»"
1001515-213 = "Фу-фу-фу. Именно так! Узрите беспощадный и хладнокровный путь Асуры!"
1001515-214 = "Добро пожаловать в мир файтингов!"
1001515-216 = "После этого мы с Арис продолжили играть в видеоигры."
1001515-217 = "Между раундами Арис всегда поглядывала на свою «Наклейку похвалы Арис», словно это был драгоценный трофей."
