[translation]
1600406-1 = "В этот раз..."
1600406-2 = "Местом встречи был ресторан в Хяккияко."
1600406-3 = "Когда я пришёл, меня проводили в отдельную комнату. Пина ждала, сидя с другой стороны стола."
1600406-4 = "...Она была непривычно тихой."
1600406-5 = "...Вы пришли, Сенсей. Я ждала."
1600406-6 = "[s1] «...?»\n[s2] «Пина?»"
1600406-7 = "Простите, что сама не пришла к вам..."
1600406-8 = "Простите, что сама не пришла к вам..."
1600406-9 = "Я очень благодарна, что вы проделали весь путь сюда."
1600406-10 = "[s3] «...А?»\n[s4] «Ты ведёшь себя немного странно...»"
1600406-11 = "Да. Мне естественно вести себя более официально."
1600406-12 = "Да. То есть, это вполне естественно."
1600406-13 = "Я попросила вас прийти, чтобы мы провели особую церемонию."
1600406-14 = "...Вот с этим."
1600406-15 = "[s5] «...Улун?»\n[s6] «С чего вдруг чай?»"
1600406-16 = "Хи-хи."
1600406-17 = "Хи-хи."
1600406-18 = "Сегодня мы отмечаем наши доверительные отношения."
1600406-19 = "Это называется «разделить чашу»."
1600406-20 = "Разделив эту чашу, мы создадим нерушимую связь..."
1600406-21 = "...?"
1600406-22 = "...Обычно чашу разделяют с пивом... а это улун..."
1600406-23 = "...Э-э-э?"
1600406-24 = "...!!!"
1600406-25 = "Эм... Э-эм... Э-это... Ну... Эм..."
1600406-26 = "Я-я попросила у владельца кое-что... но он сказал, что мне нельзя пить алкоголь, потому что я несовершеннолетняя..."
1600406-27 = "Поэтому он предложил улун."
1600406-28 = "Н-неужели это так странно? Улун недостаточно хорош?!"
1600406-29 = "Кажется, в фильмах я ни разу не видела, чтобы для такого использовали улун... Там все пили алкоголь!"
1600406-30 = "Я всё испортила!"
1600406-31 = "Ч-что же теперь делать?!"
1600406-32 = "...?"
1600406-33 = "Думаете, с чаем тоже можно? Н-но вы же только что сказали..."
1600406-34 = "[s7] «Учителю нельзя пить со студентом.»\n[s8] «Да и выпивку я не особо люблю.»"
1600406-35 = "Ах!"
1600406-36 = "Ах!"
1600406-37 = "П-понятно... Хорошо, тогда ладно."
1600406-38 = ""
1600406-40 = ""
1600406-41 = "Пина подняла чашку с чаем и села."
1600406-42 = "Если вас всё устраивает, тогда и меня тоже!"
1600406-43 = "Хорошо, хорошо! Сенсей, пожалуйста, садитесь сюда!"
1600406-44 = "[ns] Перейти на другую сторону стола и сесть."
1600406-47 = ""
1600406-48 = "Э-это обещание между нами, обещание нашими собственными жизнями!"
1600406-49 = "Я-я-я знаю, что я не и-идеальна...! Но... я..."
1600406-50 = "..."
1600406-52 = "Я с нетерпением жду, когда мы снова проведём время вместе!"
1600406-56 = "― [log=피나]...Фух. Такое чувство...[/log][wa:1840]"
1600406-58 = "― [log=피나]будто я зря так нервничала... [/log][wa:330]"
1600406-61 = "― [log=피나]Теперь, когда я успокоилась,[/log][wa:10]"
1600406-63 = "― [log=피나]мне даже немного неловко... [/log][wa:1660]"
1600406-66 = "― [log=피나]...Хи-хи. Вообще-то...[/log][wa:3060]"
1600406-68 = "― [log=피나]Я очень давно ждала этого дня.[/log][wa:10]"
1600406-71 = "― [log=피나]Я... так рада, что сегодня мы смогли[/log][wa:2340]"
1600406-73 = "― [log=피나]провести эту церемонию.[/log][wa:420]"
1600406-76 = "― [log=피나]...Вы помогали мне,[/log][wa:700]"
1600406-78 = "― [log=피나]когда я попадала в беду.[/log][wa:1480]"
1600406-81 = "― [log=피나]Не только сегодня. Вы всегда так делаете.[/log][wa:840]"
1600406-84 = "― [log=피나]Вы научили меня тому, что важно,[/log][wa:660]"
1600406-86 = "― [log=피나]и тому, как отстаивать собственные убеждения...[/log][wa:520]"
1600406-89 = "― [log=피나]Если бы я вас не встретила, я бы никогда этого не узнала,[/log][wa:1180]"
1600406-91 = "― [log=피나]и даже думать об этом грустно.[/log][wa:820]"
1600406-94 = "― [log=피나]...Поэтому я искренне вам благодарна.[/log][wa:1840]"
1600406-96 = "― [log=피나]Сенсей, мне нужно, чтобы вы...[/log][wa:2280]"
1600406-99 = "То есть..."
1600406-100 = "Я хочу, чтобы вы..."
1600406-101 = "Надеюсь, мы будем проводить вместе всё больше и больше времени."
