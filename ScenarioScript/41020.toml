[translation]
41020-1 = "Эпизод 2;Незваный гость в парке"
41020-3 = "Н-Нас атакуют!"
41020-4 = "Разве наш второй отряд не должен был прикрыть нас?! Откуда ведётся огонь?"
41020-5 = ""
41020-7 = ""
41020-9 = "Вы действительно думали, что ваши неуклюжие движения останутся незамеченными?"
41020-10 = "Я следила за вами через тепловизор всё это время."
41020-11 = ""
41020-13 = ""
41020-14 = "Мое! Они в ловушке."
41020-15 = "Дальше за тобой!"
41020-16 = "Сбрасывай бомбы!"
41020-17 = ""
41020-19 = ""
41020-21 = ""
41020-22 = "Хи-хи-хи! Моё время пришло!"
41020-23 = ""
41020-25 = ""
41020-26 = ""
41020-30 = "Атака дронов?!"
41020-31 = "Отступаем! Все, отступайте!"
41020-32 = ""
41020-37 = "Что это за взрыв?!"
41020-38 = ""
41020-40 = ""
41020-41 = "Отряд Альфа! Отряд Альфа, ответьте!"
41020-43 = "Надеюсь, вы не моргали!"
41020-44 = "Хвалёное Бюро Внутренней Безопасности получило беспощадный отпор! Посмотрите, как они бегут!"
41020-45 = "Поскольку Бюро Безопасности и Бюро Внутренней Безопасности пали, последний козырь в Полицейской Академии Валькирия - Бюро Общественной Безопасности!"
41020-46 = "Говорят, студенты, оккупировавшие парк, из самой Академии SRT! Кто бы мог подумать, что они с лёгкостью смогут одолеть студентов из Валькирии?!"
41020-47 = "Можем ли мы и дальше доверять им защиту Кивотоса?"
41020-48 = "По мере того как сомнения множатся, среди горожан нарастает тревога!"
41020-49 = "Заткнитесь! Это не ваше дело!"
41020-50 = "Вы вообще получили разрешение на съёмку? Это место проведения операции! Убирайтесь отсюда!"
41020-51 = "Смотрите! Коррумпированные силы Полицейской Академии Валькирия теперь нацелились на средства массовой информации!"
41020-52 = "Они даже не смогли схватить нарушителей, а теперь вымещают злость на журналистах. Какой позор!"
41020-53 = "Проваливайте!"
41020-54 = "Чёрт! Вдобавок ко всему, мы должны разобраться с этими стервятниками из Кроноса? Это просто абсурд."
41020-55 = "…Хотя они не ошибаются. Неужели мне действительно придётся полагаться на Бюро Общественной Безопасности?"
41020-56 = "[s] «Похоже, у тебя дел по горло.»"
41020-58 = "Мы что, не всех прогнали?"
41020-59 = "Эй, я же уже сказала репортёрам: это место проведения операции. Здесь опасно для гражданских, так что, прошу Вас, уйдите."
41020-60 = ""
41020-62 = ""
41020-63 = ""
41020-65 = "[ns] Передать рекомендательное письмо от Рин."
41020-66 = "Письмо от Вице-Президента?"
41020-67 = "Она зашла так далеко, что отправила Сенсея из Шале… Понятно…"
41020-68 = "Ну..."
41020-69 = "Простите мою грубость. Я не сразу узнала Вас."
41020-70 = ""
41020-72 = ""
41020-74 = ""
41020-75 = "Я Огата Канна, глава Бюро Внутренней Безопасности. Я отвечаю за этот участок."
41020-76 = "[s1] «Рад встрече.»\n[s2] «Что тут у вас происходит?»"
41020-77 = "Как видите…"
41020-78 = "Как видите…"
41020-79 = "Ситуация не очень. Боевой дух на нуле после того, как нас так жестоко разгромили. И у меня осталось не так много вариантов."
41020-80 = "Первоначальный план заключался в том, чтобы компенсировать превосходное снаряжение студентов SRT численным преимуществом. Теперь же у нас мало того что оружие хуже, так ещё и людей поубавилось."
41020-81 = "Всё, что у нас осталось…"
41020-82 = ""
41020-84 = ""
41020-86 = "Глава Канна! Кирино из Бюро Общественной Безопасности прибыла!"
41020-87 = "Жду приказа!"
41020-88 = "Хмм, похоже, ситуация почти улажена. Давайте сворачиваться, народ. Возвращаемся в участок. Кто-нибудь хочет пончик?"
41020-90 = "Всё, что у нас осталось - это Бюро Общественной Безопасности."
41020-91 = "О, здравствуйте, Сенсей. Вы здесь, чтобы помочь нам?"
41020-92 = "Похоже на то! Должно быть, дело куда серьёзнее, чем мы думали."
41020-93 = "Хи-хи! С Сенсеем во главе мы справимся со всем."
41020-94 = "А теперь - время сразиться с преступностью и защитить покой нашего города!"
41020-95 = "Стой! И что вы собираетесь там делать?"
41020-96 = "Если наши Бюро Безопасности и Бюро Внутренней Безопасности не смогли ничего сделать, что, во имя всего святого, Бюро Общественной Безопасности сможет противопоставить элитеSRT?"
41020-97 = "Каков ваш план? Пойти против отряда, вооружённого тяжёлым оружием, со своими игрушками?"
41020-98 = "…И не подумайте, что я не в курсе ваших \"успехов\" на стрельбище."
41020-99 = "Ну-у. План в том, чтобы остановить плохих девчат и помочь горожанам…"
41020-100 = "Я ценю твой энтузиазм. Но если энтузиазм мог бы решать всё, то нас бы здесь сейчас не было."
41020-101 = "Ожидайте в режиме готовности, пока мы ищем другой способ."
41020-102 = "Есть..."
41020-103 = "Хи-хи. Кирино опять отчитали."
41020-104 = "[s] «Что за студенты оккупировали парк?»"
41020-105 = "Это члены отряда RABBIT из Академии SRT. Кажется, первогодки."
41020-106 = "Изначально Отряд RABBIT должен был присоединиться к Бюро Безопасности Валькирии, как и остальные ученицы, но…"
41020-107 = "Как только должен был начаться снос, они потребовали, чтобы мы отменили решение о закрытии их школы, и оккупировали парк."
41020-108 = "Их не так много, но они вооружены самым продвинутым снаряжением Академии СГР… так что нам со своим снаряжением приходится тяжко."
41020-109 = "[s] «Что-то ещё, что я должен знать?»"
41020-110 = "У меня есть несколько записей из Студенческого Совета…"
41020-111 = ""
41020-114 = "А, вот как раз вещательный дрон Кроноса. Вы можете увидеть подозреваемых на видео."
41020-119 = "Кто вам дал разрешение снимать нас?! Я преподам вам урок и угощу вас ракетой из ПЗРК."
41020-120 = "Тише, Саки, тише."
41020-121 = "Мы отбились от всех этих жалких копов, даже не вспотев. Что нам сделает дурацкое видео?"
41020-122 = "Наоборот, пусть они поймут своими тупыми головешками, что им не следовало закрывать SRT."
41020-123 = "Эй, эй! Слышите, вы, недотёпы из Главного Студенческого Совета?"
41020-124 = "Прошу, продолжайте свои бесполезные попытки. У меня ещё есть много, много бомб, которые мне не терпится испытать."
41020-125 = "Если хотите сражаться - вы это получите. Имя Академии SRT останется с нами, несмотря ни на что!"
41020-127 = "Саки, Мое. Пожалуйста, проявите сдержанность хоть сейчас."
41020-128 = "Наша цель - получить преимущество в переговорах посредством боя. Нам не нужна длительная партизанская война."
41020-130 = "Эх. У тебя будут морщины, если продолжишь так хмуриться, Мияко."
41020-131 = ""
41020-134 = "Этот дрон так раздражает. У меня из-за него уже голова раскалывается."
41020-135 = ""
41020-137 = ""
41020-138 = "У нас ещё остались патроны. Почему бы не устроить стрельбу по мишени?"
41020-139 = "Хи-хи. Саки, ну почему ты всегда такая гениальная?"
41020-140 = "Давайте оторвёмся!"
41020-141 = "Ой-ой! Или мы возьмём все оставшиеся боеприпасы и устроим фейерверк?"
41020-142 = "Хи-хи, кажется, я аж начинаю пускать слюнки..."
41020-143 = "Это звучит весело, но разве мы не забыли что-то важное?"
41020-144 = ""
41020-146 = ""
41020-148 = ""
41020-149 = "Эм… Я думаю, это \"что-то важное\" я…"
41020-150 = "Вы собирались взорвать меня вместе со всем остальным?"
41020-152 = "Ах."
41020-153 = "Конечно нет! Мы никогда не забудем о союзнике, спрятанном в тылу врага."
41020-155 = "Рада слышать это…"
41020-156 = "…Все враги уже отступили. Теперь я могу вернуться?"
41020-157 = "Тут так сыро и темно, а эти жуки повсюду…"
41020-158 = "И мне страшно одной."
41020-159 = "Не будь ребёнком, Мию. Мы - элита SRT."
41020-160 = "Настоящая элита никогда не завалит миссию из-за жалкой гусеницы."
41020-161 = "Если ты так раскисла, тогда почему бы тебе не пойти регулировщиком в Полицейскую Академию Валькирия? Тебе так больше понравится?"
41020-162 = "Я и этого не хочу…"
41020-163 = "К тому же миссия не завершена. Мию, ты видишь летающий дрон?"
41020-164 = "Мы хотим приземлить его. Дай информацию по высоте и координатам, и побыстрее."
41020-165 = "Как скажешь, Саки…"
41020-167 = "Саки, постой. У нас больше нет поставок, так что нам нужно экономить то, что имеем. Это бессмысленно и безрассудно."
41020-168 = "Я не хочу слышать об этом!"
41020-169 = "Ты что, отдаёшь нам приказы?"
41020-170 = "Ага! Если я хочу что-то взорвать, я это взорву."
41020-171 = "Наш лидер - президент Главного Студенческого Совета, а не ты!"
41020-172 = "Я это понимаю, но…"
41020-174 = "…Саки, цель находится на высоте 900 метров, расстояние от вас - 2,5 километра, азимут - ноль-три-ноль…"
41020-175 = "Отличная работа."
41020-176 = ""
41020-178 = ""
41020-179 = "Зафиксировать цель."
41020-180 = "Мое, огонь по готовности."
41020-181 = "Ой-ой! Это моя самая любимая часть… *тяжело дышит*"
41020-182 = ""
41020-184 = ""
41020-185 = "Нацелиться и…"
41020-186 = "БА-БАХ!"
41020-187 = ""
41020-189 = ""
41020-195 = ""
41020-196 = "Мы потеряли дрон телевещания."
41020-197 = "Они смеют атаковать снаряжение для телевещания третьей стороны?"
41020-198 = "Как эти мерзавки вообще попали в Академию SRT?"
41020-199 = "[s] «Они очень энергичные.»"
41020-200 = "Энергичные? Скорее уж идиотки."
41020-201 = "В Кивотосе есть поговорка: \"Я готов выйти против сильного соперника, готов выйти против дурака. Но нет ничего страшнее, чем сильный дурак.\""
41020-202 = "Нам нужно отправить запрос на поддержку в академию из соседнего округа."
41020-203 = ""
41020-205 = ""
41020-206 = "Свяжитесь с Хиной из Геенны Команды Префектов…"
41020-207 = "[s3] «Думаю, в этом нет необходимости.»\n[s4] «Я считаю, что мы можем справиться сами.»"
41020-208 = "А? Вы не слушали то, что я говорила?"
41020-209 = "А? Вы не слушали то, что я говорила?"
41020-210 = "У нас осталось от силы человек пять из Бюро Безопасности и Бюро Внутренней Безопасности, способных держать оружие, включая меня."
41020-211 = "[s5] «Кирино, Фубуки. За дело.»\n[s6] «Кирино, Фубуки. Давайте остановим плохишек.»"
41020-214 = "Ч-ч-что?! Я? Кирино?!"
41020-215 = "Прошу, скажите, что Вы шутите!"
41020-216 = "Что я вообще смогу сделать против SRT?"
41020-217 = ""
41020-220 = ""
41020-221 = "Сенсей, сейчас действительно подходящее время для шуток?"
41020-222 = "Эти ученицы - не бойцы, а просто наивные идеалистки, не приспособленные к миру."
41020-223 = "Вы считаете, что эти нетренированные девочки смогут что-то сделать с противником, с которым не смогли справиться наши оперативники?"
41020-224 = "Мне всё равно, насколько Вы умелый тактик. Вы не сможете победить, выставляя пешку против ферзя."
41020-225 = "Некоторым пешкам суждено оставаться всего лишь пешками."
41020-226 = "[s] «Они не шахматные фигуры. В моих глазах все ученицы равны.»"
41020-227 = ""
41020-229 = ""
41020-230 = "Ну и человек..."
41020-231 = "Если - подчёркиваю, ЕСЛИ - всё пойдёт прахом, Шале понесёт за это полную ответственность."
41020-232 = ""
41020-234 = ""
41020-235 = "Слушать мою команду! Оставшиеся члены Бюро Внутренней Безопасности переходят под командование Шале! Взаимодействуйте с Бюро Общественной Безопасности и, ради Кивотоса, вернитесь с хорошими новостями!"
41020-237 = "П-постойте! Это не было шуткой?! Вы хотите, чтобы мы сражались с элитой SRT?"
41020-238 = "Даже Бюро Безопасности и Бюро Внутренней Безопасности не смогли с ними справиться. Это похоже на какой-то страшный сон."
41020-239 = "[s7] «Всё будет в порядке. Просто верьте мне..»\n[s8] «Я бы ни за что не пошёл на это с кем-то другим.»"
41020-240 = "Не переживай, Фубуки! Под командованием [USERNAME] Сенсея мы сможем пройти даже через ад!"
41020-241 = "Не переживай, Фубуки! Под командованием [USERNAME] Сенсея мы сможем пройти даже через ад!"
41020-242 = "Мы - Бюро Общественной Безопасности! Неважно, насколько малый шанс на победу, мы всегда должны стоять на страже безопасности горожан!"
41020-243 = "Эх… Если бы я знала, что всё приведёт к такому, то точно взяла бы больничный…"
41020-244 = "Ну же, если мы успешно выполним эту миссию, тебя могут наградить настоящим отпуском."
41020-245 = "А что ещё лучше - мы покажем свою ценность руководству, и за доблестную службу нас могут перевести в Бюро Безопасности!"
41020-246 = "Меня меньше всего волнует Бюро Безопасности, но вот отпуск…"
41020-247 = "От такого я не смогу отказаться."
41020-248 = "Бюро Общественной Безопасности…"
41020-249 = "Начать операцию!"
