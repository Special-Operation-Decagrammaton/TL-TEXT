[translation]
41020-1 = "Episódio 2;Visita Indesejada"
41020-3 = "Uaaah?! Tiros?!"
41020-4 = "Aqui com certeza é um ponto cego, não é...? De onde estão atirando?"
41020-9 = "...Ingênuas."
41020-10 = "Nunca ouviram falar de câmera térmica? Não adianta se esconder."
41020-14 = "Moe, alvos imobilizados! Manda o bombardeio logo!"
41020-15 = "Coordenadas: VK4-0-4-5!"
41020-16 = "Manda ver!"
41020-22 = "Hehehe, já tava cansada de esperar!"
41020-30 = "É um drone?!"
41020-31 = "Tá vindo direto pra cá, fujam!!"
41020-37 = "O que foi essa explosão?!"
41020-41 = "Esquadrão Alfa, responda!"
41020-43 = "Vocês estão conseguindo ver isso?"
41020-44 = "O Departamento de Segurança Interna está completamente na defensiva!"
41020-45 = "Depois do Departamento de Guarda, até o Departamento de Segurança Interna está prestes a ser derrotado! Será que a única unidade ainda de pé em Valkyrie é o Departamento de Segurança Pública...?!"
41020-46 = "Dizem que quem está promovendo a manifestação são alunas da Academia Especial SRT, mas mesmo assim elas estão pressionando Valkyrie de forma esmagadora."
41020-47 = "O que será que vai acontecer a partir de agora...?!"
41020-48 = "Pois é! Será que Valkyrie ainda tem alguma carta na manga?!"
41020-49 = "Ah, mas que barulheira!"
41020-50 = "Quem deu permissão pra filmarem aqui?! Desliguem essa câmera agora!"
41020-51 = "Ops, deu ruim!"
41020-52 = "Melhor mantermos distância antes de levarmos uma bronca!"
41020-53 = "Não atrapalhem! Saiam da frente!"
41020-54 = "Droga, a Kronos... irritantes como sempre...!"
41020-55 = "Ainda assim, realmente já não temos efetivo... e não dá pra contar com aquelas idiotas do Departamento de Segurança Pública..."
41020-56 = "[s] \"A situação tá bem feia por aqui, hein...\""
41020-58 = "...Quem é você?"
41020-59 = "Não tá vendo que estamos em combate? Estranhos devem cair fora imediatamente."
41020-65 = "[ns] Entregar a carta de recomendação da Rin."
41020-66 = "Isso é... uma carta de recomendação da Administradora...?"
41020-67 = "No lugar do Gabinete de Defesa... \"Schale\"?!"
41020-68 = "...P-Peço mil desculpas pela grosseria."
41020-69 = "Acredito que seja a primeira vez que nos encontramos pessoalmente."
41020-75 = "Sou a responsável em campo por esta operação. Kanna, Diretora do Departamento de Segurança Interna da Academia de Polícia Valkyrie."
41020-76 = "[s1] \"Sim, muito prazer.\"\n[s2] \"Como está a situação?\""
41020-77 = "Bem, como pode ver..."
41020-78 = "Bem, como pode ver..."
41020-79 = "Quase não nos resta efetivo, e o moral está lá embaixo."
41020-80 = "A princípio, planejávamos contê-las pela superioridade numérica, mas o poder de fogo da SRT é absurdo..."
41020-81 = "O pessoal que ainda sobrou é apenas—"
41020-86 = "Desculpe a demora! Sou Kirino, do Departamento de Segurança Pública!"
41020-87 = "Já podemos entrar em ação agora mesmo?!"
41020-88 = "...Não parece que já acabou? Acho que nem sobrou nada pra gente fazer."
41020-90 = "Apenas este \"Departamento de Segurança Pública\"."
41020-91 = "Ah, Sensei! Que coincidência! Veio dar apoio para Valkyrie?"
41020-92 = "Vir até um lugar desses... sua vida continua corrida como sempre, hein."
41020-93 = "Com o Sensei no comando, a operação já é praticamente um sucesso!"
41020-94 = "Vamos, não podemos deixar as coisas assim! Vamos entrar em ação logo!"
41020-95 = "Esperem, não ajam por conta própria. O que acham que vão conseguir indo lá?"
41020-96 = "Tanto o Departamento de Guarda quanto o de Segurança Interna foram quase dizimados. Acham mesmo que dão conta delas?"
41020-97 = "Pra começar, vocês nem têm armas decentes... Com base em quê acham que podem vencer?"
41020-98 = "...Pensei que pelo menos tivessem noção da própria capacidade."
41020-99 = "M-Mas os cidadãos estão assustados... Não podemos ficar só olhando sem fazer nada..."
41020-100 = "...Reconheço a sua disposição. Mas só força de vontade não resolve nada."
41020-101 = "Enquanto procuramos outra solução, fiquem aguardando aqui."
41020-102 = "S-Sim, senhora..."
41020-103 = "Que sorte. Bem, ela tem toda razão, né."
41020-104 = "[s] \"Vocês têm alguma informação sobre as alunas que ocuparam o parque?\""
41020-105 = "Sim, é uma equipe de alunas do primeiro ano da \"Academia Especial SRT\"... o \"Esquadrão RABBIT\"."
41020-106 = "Originalmente, com o fechamento da SRT, elas seriam transferidas para o Departamento de Guarda de Valkyrie, mas..."
41020-107 = "Não sabemos o que houve, mas de repente elas ocuparam o parque e começaram uma manifestação exigindo \"cancelem o fechamento da academia\"."
41020-108 = "Apesar de estarem em menor número, o equipamento delas é de última geração. É principalmente por isso que estamos tendo tanta dificuldade..."
41020-109 = "[s] \"Entendi. Tem mais algum detalhe que eu possa ver?\""
41020-110 = "Bem, temos os arquivos de cada aluna fornecidos pelo Conselho Estudantil Geral..."
41020-114 = "Ah, se quiser ver os rostos delas, talvez seja mais rápido olhar ali. É contra a minha vontade, mas parece que um drone de transmissão da Kronos conseguiu entrar."
41020-119 = "...Hm? Ei, o que você tá olhando? Quer levar um MANPADS na cara?"
41020-120 = "Hehehe... Calma aí, não precisa ficar tão nervosa."
41020-121 = "De qualquer forma, a maré da batalha não vai virar mais. Não tem problema nenhum em sermos filmadas agora."
41020-122 = "Já que estamos aqui, por que não aproveitamos pra espalhar por aí o quanto o Conselho Estudantil Geral é idiota?"
41020-123 = "Então... Conselho Estudantil Geral, tá assistindo~?"
41020-124 = "Já deu pra perceber que vocês estavam errados, não é?"
41020-125 = "Enquanto estivermos aqui, a Academia Especial SRT não vai acabar!"
41020-127 = "Saki, Moe. Evitem provocações desnecessárias."
41020-128 = "O que precisamos é garantir uma posição vantajosa para negociar através do combate. Não há necessidade de fazer nada além disso agora."
41020-130 = "Que sem graça... A Miyako é sempre tão certinha."
41020-134 = "...O zumbido desse drone tá me dando nos nervos. Hora de mandar ele pelos ares."
41020-138 = "Ainda sobrou bastante munição... Que tal darmos uns tiros pra testar também?"
41020-139 = "Saki~, tá pensando em algo divertido, né?"
41020-140 = "Vamos fazer? Vamos fazer bem espalhafatoso?"
41020-141 = "Já que é pra fazer, por que não gastamos toda a munição igual fogos de artifício?"
41020-142 = "Nossa, vai ficar tão lindo... Haa, haa..."
41020-143 = "Por mim tudo bem, mas... tô com a sensação de que estamos esquecendo de alguma coisa..."
41020-149 = "P-Por acaso... vocês tão falando de mim...?"
41020-150 = "Por favor, não me acertem com o bombardeio, tá...?"
41020-152 = "...Ah."
41020-153 = "E-Eu sei! Eu não esqueci de você, não precisa se preocupar!"
41020-155 = "A-Ah, entendi..."
41020-156 = "A propósito, eu já posso voltar...? Não tem mais inimigos por aqui..."
41020-157 = "É que aqui tá meio úmido... e tem um monte de insetos..."
41020-158 = "E, bem, eu tô com medo de ficar sozinha..."
41020-159 = "Miyu. Uma elite da SRT não fica choramingando só por causa de uns insetos."
41020-160 = "Se vai continuar reclamando assim, então vá pra Valkyrie de uma vez."
41020-161 = "Lá você pode ter dias tranquilos, sem incômodos, controlando o trânsito em paz."
41020-162 = "I-Isso, bem..."
41020-163 = "...Deixando isso de lado, Miyu, tá vendo o drone?"
41020-164 = "Assim que medir a altitude, me avise. Vou derrubar ele na hora."
41020-165 = "E-Entendido... Só um minutinho..."
41020-167 = "Saki, espere. Não recomendo disparos desnecessários. Como não podemos esperar reabastecimento agora, devemos manter a vigilância ao redor e..."
41020-168 = "Cala a boca!"
41020-169 = "Por que você tá me dando ordens?!"
41020-170 = "Bem, no fim das contas somos todas do primeiro ano, né."
41020-171 = "A Presidente do Conselho Estudantil Geral nem tá aqui e não há mais nada nos prendendo, então realmente não precisamos mais seguir ordens, né?"
41020-172 = "M-Mas..."
41020-174 = "...Saki-chan, confirmei as coordenadas. Altitude 900m, distância 2500m, azimute 0-3-0..."
41020-175 = "Ótimo,"
41020-179 = "Alvo travado."
41020-180 = "Moe, deixo o disparo com você."
41020-181 = "Nossa, momentos assim me deixam tão empolgada..."
41020-185 = "Lá vai..."
41020-186 = "Fogo!!"
41020-196 = "...Perdemos o sinal do drone de transmissão."
41020-197 = "Elas sabem perfeitamente que não era de Valkyrie, e mesmo assim atacaram..."
41020-198 = "Que bando de inconsequentes... Como gente assim conseguiu entrar na SRT?"
41020-199 = "[s] \"Elas são bem animadas, né.\""
41020-200 = "...Brincadeira sua. Acho que quis dizer \"idiotas\"."
41020-201 = "Se fossem só idiotas, tudo bem, mas são idiotas com um poder absurdo. Difíceis de dialogar e problemáticas ao extremo."
41020-202 = "Do jeito que está, talvez seja melhor pedir apoio aos Comitês Disciplinares dos outros distritos autônomos..."
41020-206 = "Primeiro, entrem em contato com o Comitê Disciplinar de Gehenna—"
41020-207 = "[s3] \"...Deixa comigo, acho que vai dar certo.\"\n[s4] \"Acho que dá pra dar um jeito.\""
41020-208 = "...Como?"
41020-209 = "...Como?"
41020-210 = "Nesta situação, com menos de cinco pessoas em condições de agir...?"
41020-211 = "[s5] \"Kirino, Fubuki, vamos.\"\n[s6] \"Vamos parar o pessoal do Esquadrão RABBIT.\""
41020-214 = "Sim! ...Espera, quê?!"
41020-215 = "S-Só pode ser brincadeira, né...?"
41020-216 = "Estamos falando da SRT, viu?"
41020-221 = "...Com licença, Sensei."
41020-222 = "Basicamente, elas não são combatentes. Pertencem ao Departamento de Segurança Pública, acostumadas demais com a paz."
41020-223 = "Nem o Departamento de Guarda nem o de Segurança Interna conseguiram fazer frente a elas. Acha mesmo que elas vão dar conta sozinhas?"
41020-224 = "Já ouvi falar muito do Sensei, mas com esse grupo improvisado..."
41020-225 = "Existe um abismo intransponível entre alunas de elite e as que não são."
41020-226 = "[s] \"Para mim, todas continuam sendo 'alunas', sem diferença.\""
41020-230 = "...Entendo."
41020-231 = "Já que a responsabilidade será de Schale... bem, não vou impedir à força."
41020-235 = "...Atenção a todas que ainda podem lutar. A partir de agora, sigam as instruções do Sensei de Schale e deem apoio às alunas do Departamento de Segurança Pública!"
41020-237 = "E-Espera aí! Sério mesmo?! Tá falando sério?!"
41020-238 = "Mentira! A gente vai ser derrotada na hora! Sensei, você tá bem da cabeça?!"
41020-239 = "[s7] \"Tô ótimo, ótimo.\"\n[s8] \"Relaxa, vocês com certeza conseguem.\""
41020-240 = "Fubuki, vai ficar tudo bem! Com o Sensei [USERNAME] no comando, vai dar tudo certo! Eu acho!!"
41020-241 = "Fubuki, vai ficar tudo bem! Com o Sensei [USERNAME] no comando, vai dar tudo certo! Eu acho!!"
41020-242 = "Além do mais, é pela segurança dos cidadãos... Não podemos deixar a situação assim!"
41020-243 = "Ah, que saco, meus planos foram por água abaixo... Se eu soubesse, tinha fingido que tava doente..."
41020-244 = "Calma, calma. Se a gente tiver sucesso nessa operação, talvez até ganhe uma folga especial."
41020-245 = "E quem sabe até uma chance de transferência para o Departamento de Guarda!"
41020-246 = "A segunda parte não me interessa nem um pouco, mas fazer o quê..."
41020-247 = "Vamos tentar só um pouquinho, então?"
41020-248 = "Departamento de Segurança Pública,"
41020-249 = "em ação!"
