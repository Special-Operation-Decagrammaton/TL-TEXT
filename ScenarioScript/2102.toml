[translation]
2102-1 = "Если назвали твоё имя — останься, часть 2"
2102-2 = "Угх..."
2102-3 = "Голова всё ещё гудит... По крайней мере, жар почти спал..."
2102-4 = ""
2102-5 = "Ого! Уже столько времени...!"
2102-6 = "Ах..."
2102-7 = "Я сказала им, что сегодня буду отдыхать дома... А остальные должны сейчас убирать спортзал..."
2102-8 = "..."
2102-9 = "Они ведь справятся сами, да? Сэрика и остальные...?"
2102-10 = "Подработку нашла я, а сама прийти не смогла... хотя все и сказали, что не против..."
2102-11 = "Угх..."
2102-12 = "Всё потому, что они постоянно несут какую-то чушь."
2102-13 = "Вечно рассказывают мне свои безумные планы — вроде похищения студентов из других школ!"
2102-14 = "Вот поэтому!"
2102-15 = "..."
2102-16 = "*вздыхает*"
2102-17 = "Надо потом принести в клубную комнату что-нибудь перекусить..."
2102-18 = "Думаю, они заслуживают тёплой встречи, когда вернутся. Всё-таки сегодня они работают вместо меня..."
2102-19 = "*жужжит*"
2102-20 = "А? MomoTalk?"
2102-21 = "О, это от... Хошино?"
2102-22 = "..."
2102-23 = "Хм?"
2102-24 = "«Йо-хо, Аяне! Мы добрались до места подработки, но тут возникла небольшая проблемка»."
2102-25 = "«Спортзал в ещё худшем состоянии, чем я представляла, но я не уверена, что мы вообще пришли куда надо...»"
2102-26 = "«Мы расчистили вход в спортзал, но внутри мусора ещё куча!»"
2102-27 = ""
2102-28 = "«Похоже, для такой старушки, как я, тут слишком много ручного труда...»"
2102-29 = "«Может, просто ничего не делать и сказать, что сделали? Нам правда обязательно выполнять всю работу?»"
2102-30 = "..."
2102-31 = "*дёргается* ...Угх!"
2102-33 = "Внутри незаконно переделанного спортзала"
2102-34 = "*бум*"
2102-35 = "*БА-А-АХ*"
2102-37 = "Изнутри лезут ещё! Их там целая толпа!"
2102-38 = "Не проблема. Оставьте это мне."
2102-39 = "Аяне ответила? Что она сказала? Мы вообще должны этим заниматься?"
2102-40 = "Хм. Ну-ка, посмотрим, что написала Аяне."
2102-41 = ""
2102-42 = "«Ой, да ладно вам. С такой простой работой вы и сами справитесь»."
2102-43 = "«Подработка и должна быть утомительной и тяжёлой»."
2102-44 = "«Так что просто сделайте её»."
2102-45 = "Вот что она написала. Она злится? Звучит так, будто злится."
2102-46 = "Если сдадимся сейчас, мы подведём Аяне. Назад пути нет!"
2102-47 = "Не унывайте, все! Ради Аяне!"
2102-48 = "Верно. Мы должны как следует выполнить поручение Аяне."
2102-49 = "Э-э, ага! Я и так это знала, вообще-то! Просто проверяла! А теперь вперёд!"
2102-50 = "Неужели это сила дружбы? Ах, как же я завидую молодёжи."
2102-51 = "Напоминаю: ты не настолько уж старше меня!"
2102-53 = "...угх!"
2102-54 = "Готово!"
2102-55 = "Отлично, идеально. Закусок и напитков должно хватить с запасом."
2102-56 = "Будет здорово встретить всех после тяжёлого рабочего дня."
2102-57 = "Хм... Хотя они задерживаются дольше, чем я ожидала. Работа не должна была занять столько времени..."
2102-58 = "Интересно, там было так много мусора? Наверное, мне всё-таки стоило пойти с ними..."
2102-59 = "Такое чувство, будто я их подвела..."
2102-60 = "*звонок* *звонок*"
2102-61 = "Телефонный звонок?"
2102-62 = ""
2102-63 = "Комитет по предотвращению закрытия Абидоса. Чем могу помочь?"
2102-64 = "..."
2102-65 = "Простите?"
2102-66 = "Команда, которая должна была убрать спортзал... до сих пор не пришла?!"
2102-67 = "Не может быть. Хошино только что написала мне, что..."
2102-68 = "Чт...?! Штраф за отмену?! Пожалуйста, подождите секунду. Наверняка произошло какое-то недоразумение!"
2102-69 = "*щелчок* А? Алло? ...Алло?!"
2102-70 = "..."
2102-71 = "..."
2102-72 = "Что?"
2102-73 = "*звонок* *звонок*"
2102-74 = ""
2102-75 = "...Алло?"
2102-76 = "Это Комитет по предотвращению закрытия Абидоса?"
2102-77 = "К-кто это?"
2102-78 = "Мы подтвердили, что студенты вашей академии вступили в стычку с местной экстремистской спортивной организацией — Группой сторонников утренней радиогимнастики."
2102-79 = "..."
2102-80 = "Что?"
2102-81 = "Во время столкновения дрон студенты Абидоса подверг спортзал обстрелу и полностью разрушил его, из-за чего всё здание — и внутри, и снаружи — стало непригодно для использования..."
2102-82 = "Разумеется, часть вины лежит на экстремистской организации нашего города, но ущерб просто заоблачный!"
2102-83 = "И, к сожалению... у нас не остаётся иного выбора, кроме как предъявить вашей академии требование о возмещении соразмерной части ущерба."
2102-84 = "..."
2102-85 = "Что?!"
2102-86 = "*топ* *дверь открывается* *хлопок*"
2102-87 = "Постойте, нельзя вот так врываться."
2102-88 = "Я ещё не готова!"
2102-89 = "Иногда лучше просто плыть по течению, Сэрика."
2102-90 = "Эй, Аяне! Мы вернулись!"
2102-91 = "Мы вернулись!"
2102-92 = "Так вот... оказалось, мы пришли не в тот спортзал! Забавно, да?"
2102-93 = "..."
2102-94 = "О. Ты уже разговариваешь по телефону?"
2102-95 = "Ой-ой. Похоже, у нас неприятности. Придётся самой всё объяснить, если хочу придумать оправдание. Хотя, может, уже поздно..."
2102-96 = "О нет... Теперь у нас проблем ещё больше, чем после драки с Группой радиогимнастики, да?"
2102-97 = "Возможно, я немного ошиблась с количеством взрывчатки на дроне, и в итоге обрушилась одна-две колонны..."
2102-98 = "Пожалуйста, просто стойте спокойно и перестаньте действовать Аяне на нервы!"
2102-99 = "..."
2102-100 = "Постой, Аяне! Подожди секундочку! Я понимаю, почему ты можешь злиться... То есть ты совершенно права, что злишься, но...!"
2102-101 = "На это есть веская причина...! Ну, скорее оправдание, чем причина, но выслушай меня!"
2102-102 = "В общем, дело в том, что..."
2102-103 = ""
2102-104 = "*щелчок*"
2102-105 = "..."
2102-106 = "...!"
2102-107 = "...!"
2102-108 = "...!"
2102-109 = "..."
2102-110 = ""
2102-111 = "..."
2102-112 = "Начиная с этого момента..."
2102-113 = "...если я назову ваше имя..."
2102-114 = "...останетесь в комнате..."
2102-115 = "*глоть*"
2102-116 = "..."
2102-117 = "...Сэрика."
2102-118 = "...Чт?! Д-да?! Я?!"
2102-119 = "..."
2102-122 = "...Все, кроме Сэрики, пожалуйста, выйдите."
2102-123 = "Если назвали твоё имя — останься"
