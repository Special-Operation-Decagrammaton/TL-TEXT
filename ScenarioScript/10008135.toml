[translation]
10008135-2 = "Похоже, мне и правда не заплатят."
10008135-3 = "[s] «Ну, дисциплинарный комитет ведь арестовал твоего босса...»"
10008135-4 = "Эх. Ага, не знаю, чего я ожидала."
10008135-5 = "Когда живёшь одними подработками, такое постоянно случается."
10008135-6 = "[s] «Постоянно?!»"
10008135-7 = ""
10008135-9 = ""
10008135-10 = "К тому же не я одна осталась немного разочарована."
10008135-11 = ""
10008135-13 = ""
10008135-15 = "Ха... ха-ха. Всё кончено. Всё кончено..."
10008135-16 = "О, э-эм..."
10008135-17 = "*вздох* Я вымоталась."
10008135-18 = "Как мы могли так потратить Новый год впустую?"
10008135-19 = "Н-Ну, эм..."
10008135-21 = "Ты всё ещё коришь себя из-за этого, Ару?"
10008135-22 = "[s] «Муцуки?»"
10008135-23 = "Что сделано, то сделано. И может, это только мне так кажется, но мне было весело. Не думаю, что всё было зря."
10008135-24 = "Мы создали кучу хороших воспоминаний! Вот это была ночь!"
10008135-25 = "Но наши желания..."
10008135-26 = "Кстати, ты ведь так и не загадала своё, да, Муцуки?"
10008135-27 = "Хм. Похоже на то."
10008135-28 = "Почему бы не сделать это сейчас? Ящик прямо здесь."
10008135-29 = "Хм!"
10008135-30 = "У меня есть идея!"
10008135-31 = "Почему бы нам не загадать вместе?"
10008135-32 = "Вот! У меня хватит игрушечных денег на всех!"
10008135-33 = "А-А?"
10008135-34 = "Т-Ты уверена, что с ними сработает?"
10008135-36 = "Уверена, всё будет нормально."
10008135-37 = ""
10008135-39 = ""
10008135-41 = ""
10008135-43 = ""
10008135-44 = "Вот, Сенсей. Возьми и ты."
10008135-45 = "Давайте все загадаем новогоднее желание."
10008135-46 = "О, только не то же самое, что в первый раз!"
10008135-47 = "Новое желание, новый год, новый ты! Хорошо?"
10008135-48 = ""
10008135-50 = ""
10008135-52 = ""
10008135-53 = "Ну, ладно..."
10008135-54 = "Звучит неплохо."
10008135-55 = "[s] «Я в деле.»"
10008135-57 = "Ладно. Была не была!"
10008135-58 = ""
10008135-60 = ""
10008135-61 = ""
10008135-62 = ""
10008135-64 = ""
10008135-66 = "И-и-и готово!"
10008135-67 = "[s] «Быстро ты.»"
10008135-70 = "Хи-хи. Кто не первый, тот последний, Сенсей."
10008135-71 = "Не припоминаю, чтобы читала такое правило у святыни."
10008135-72 = "Кстати, Сенсей. Что ты загадал?"
10008135-73 = "[s] «А, точно. Я так и не сказал.»"
10008135-74 = "Ару! Если расскажешь всем, оно не сбудется!"
10008135-75 = "Ты ведь не хочешь, чтобы так получилось?"
10008135-76 = "Пожалуй, нет..."
10008135-77 = "Мы всё это время на ногах. Кто-нибудь ещё чувствует...?"
10008135-78 = ""
10008135-81 = "П-Прости! Это мой живот! Я со вчера ничего не ела!"
10008135-82 = "Ха! Точно! Мы все довольно голодные, да?"
10008135-83 = "Сенсей? Не будешь лапочкой и не угостишь нас всех завтраком?"
10008135-84 = "Прекрасная идея. Поддерживаю."
10008135-85 = "Конечно. Если Сенсей не против."
10008135-86 = "Эм... можно мне тоже? Зарплату это не заменит, но если платит Сенсей, я в деле."
10008135-87 = "[s] «Похоже, выбора у меня особо нет, да?»"
10008135-89 = "Ты ведь не откажешь нам? Думаю, после прошлой ночи мы все заслужили."
10008135-90 = "Ага! Погнали!"
10008135-91 = "Ладно, но куда?"
10008135-93 = "Ха-ха."
10008135-94 = "Я-Я предлагаю! Рамен всегда вкуснее всего вместе с Ару!"
10008135-97 = "Так в Кивотосе начался новый год."
10008135-98 = ""
10008135-102 = "[ns] «(Моё новогоднее желание, значит?)»"
10008135-103 = ""
10008135-107 = "[ns] Молча загадать желание на новый год."
10008135-108 = "Новогодняя рапсодия №68"
