[translation]
2601202-1 = "Забота о безопасности на воде"
2601202-2 = "По просьбе Кирино я отправился в тренировочный бассейн Полицейской школы Валькирия."
2601202-3 = ""
2601202-5 = ""
2601202-6 = "А, Сенсей [USERNAME]! Вы пришли!"
2601202-7 = "Простите, что так внезапно. Задание вот-вот начнётся, а больше помочь было некому."
2601202-8 = "[s1] «Ничего страшного. Зови меня в любое время.»\n[s2] «Я всегда рад сходить в бассейн.»"
2601202-11 = "Спасибо. Я очень признательна."
2601202-12 = "Я уже размялась, так что можем сразу начинать."
2601202-13 = "[s] «Тебе нужно, чтобы я оценил твои навыки?»"
2601202-14 = "Именно. Для начала я доплыву до той стены и обратно."
2601202-15 = ""
2601202-17 = ""
2601202-22 = "[ns3] «(Она плывёт по-собачьи?)»\n[ns4] «(Хотя по-собачьи она плавает довольно хорошо...)»"
2601202-25 = ""
2601202-26 = "Фух! Я вернулась!"
2601202-27 = "Ну, какова ваша оценка?"
2601202-28 = "[s5] «Навыки у тебя весьма примечательные.»\n[s6] «Удивительно быстро.»"
2601202-31 = "Хи-хи, спасибо."
2601202-32 = "При этом я понимаю, что для спасательного плавания нужны определённые стили."
2601202-33 = "Нельзя спасти человека, просто плывя вперёд вот так."
2601202-34 = "Поэтому, тщательно всё изучив... та-дам!"
2601202-35 = "[s] «Это... груз?»"
2601202-36 = "Верно! Я использую его, чтобы имитировать тонущего человека. Я должна суметь вытащить его одной рукой."
2601202-37 = "Хм... но это пятикилограммовый груз. Настоящий человек ведь будет тяжелее?"
2601202-38 = "[s] «Всё должно быть нормально. В воде человек ощущается легче из-за плавучести и всего такого.»"
2601202-39 = ""
2601202-42 = "[ns] «Я читал, что в воде вес человека ощущается примерно как 10% от настоящего.»"
2601202-43 = "А, понятно!"
2601202-44 = "Тогда в воде мой вес был бы примерно..."
2601202-45 = ""
2601202-47 = ""
2601202-48 = "О-о...!"
2601202-49 = "Я-я чуть не попалась!"
2601202-50 = "Хорошая попытка, Сенсей!"
2601202-51 = "[s] «А? Ты о чём?»"
2601202-52 = "Эм, забудьте. Давайте просто начнём проверку!"
2601202-53 = "Вы бросаете груз в бассейн, а я достаю его обратно."
2601202-54 = "[ns7] Бросить груз.\n[ns8] Бросить груз изо всех сил."
2601202-55 = ""
2601202-59 = ""
2601202-65 = "О нет, кто-то тонет! Экстренная ситуация! Экстренная ситуация!"
2601202-66 = "Сенсей, немедленно вызовите скорую. И на всякий случай подготовьте AED."
2601202-67 = "[s] «(Значит, это первый шаг...)»"
2601202-68 = "Я иду! Ай!"
2601202-69 = ""
2601202-71 = ""
2601202-76 = "Ха-а-а!"
2601202-77 = ""
2601202-80 = ""
2601202-83 = "[ns] «...»"
2601202-84 = ""
2601202-87 = "[ns] «К-Кирино?!»"
2601202-88 = "Уф!"
2601202-89 = "Э-Это слишком тяжело!"
2601202-90 = "Уф... Кажется, долго я так не выдержу...!"
2601202-91 = "[s9] «Кирино! Не паникуй и хватайся!»\n[s10] «Кирино! Я тебя спасу!»"
2601202-92 = ""
2601202-95 = ""
2601202-100 = "Спасательный круг, поняла! Держусь!"
2601202-101 = "[s] «Хорошо, держись крепче! Я тебя вытащу!»"
2601202-104 = ""
2601202-105 = "*кашляет* *кашляет* *кхе-кхе*"
2601202-106 = "[s11] «*тяжело дышит* *тяжело дышит*»\n[s12] «Ты в порядке?»"
2601202-109 = "Я в порядке, просто немного вымоталась. Спасибо, Сенсей. Я очень благодарна за помощь..."
2601202-110 = "Спасатель сам чуть не утонул. Какой позор..."
2601202-111 = "Похоже, мне нужно тренироваться усерднее..."
2601202-113 = "После этого мы с Кирино продолжили вместе отрабатывать навыки спасателя."
