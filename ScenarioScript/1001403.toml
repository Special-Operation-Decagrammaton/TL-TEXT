[translation]
1001403-1 = "Техника защиты Изуны"
1001403-2 = "(Наконец-то у меня выходной.)"
1001403-3 = "(Чтобы скоротать время, я решил прогуляться.)"
1001403-4 = ""
1001403-5 = "Хм-хм! ♪"
1001403-6 = ""
1001403-7 = "[s] «...»"
1001403-9 = "(Пока я иду по улице...)"
1001403-10 = ""
1001403-11 = "Хм-хм! ♪"
1001403-12 = ""
1001403-13 = "[s] «Хмм...»"
1001403-15 = "(Когда я заглянул в ресторан пообедать...)"
1001403-16 = "Мой господин! Изуна принесла вам обед!"
1001403-17 = ""
1001403-18 = "У них акция, поэтому я бесплатно получила две порции тэмпуры из креветок!"
1001403-19 = "Ой!"
1001403-20 = ""
1001403-22 = ""
1001403-23 = "О нет. Креветочная тэмпура Изуны..."
1001403-24 = "[s] «Не переживай, Изуна. Я возьму тебе ещё одну.»"
1001403-25 = "Что?! Правда?!"
1001403-26 = "Хи-хи! Спасибо, мой господин!"
1001403-28 = "(Когда я был в библиотеке и искал новые материалы для работы...)"
1001403-29 = "Мой господин! Я чувствую, что кто-то смотрит в нашу сторону!"
1001403-30 = "Думаете, это убийца, который охотится за вами?!"
1001403-31 = "[s1] «Это библиотекарь.»\n[s2] «А вот ты только что убила тишину и покой.»"
1001403-32 = "П-Прости..."
1001403-33 = "П-Прости..."
1001403-35 = "(Мы с Изуной буквально неразлучны, и менять это она явно не собирается.)"
1001403-36 = "[s] (Похоже, от этого никуда не деться...)"
1001403-37 = ""
1001403-38 = "Изуна начеку!"
1001403-39 = "[s] «Эй, Изуна...?»"
1001403-40 = "Да! Что вам нужно, мой господин?!"
1001403-41 = "[s3] «Думаю, на сегодня защиты уже достаточно.»\n[s4] «Почему бы тебе не отдохнуть остаток дня? Ты заслужила.»"
1001403-42 = "А? Но..."
1001403-43 = "А? Но..."
1001403-44 = "Но ведь никогда не знаешь, когда может случиться беда!"
1001403-45 = "Я не могу просто взять и перестать вас защищать!"
1001403-46 = "[s] «Беда? Здесь?»"
1001403-47 = "Нельзя никогда терять бдительность, мой господин!"
1001403-48 = "Точно такое же было в фильме про ниндзя, который я смотрела вчера вечером!"
1001403-49 = "«Мне больше не нужна твоя защита. Можешь идти», — сказал господин, но стоило ниндзя уйти..."
1001403-50 = "...как тут же напали убийцы!"
1001403-51 = "[s] «Ты слишком много телевизор смотришь!»"
1001403-52 = "Стрелы летели со всех сторон!"
1001403-53 = "Но ниндзя вернулся как раз вовремя и отбил стрелы."
1001403-54 = "Вот так...!"
1001403-55 = "И вот так...! Это было так круто!"
1001403-56 = "Изуна тоже хочет научиться так делать."
1001403-57 = "Ах, интересно, не прилетит ли откуда-нибудь стрела."
1001403-58 = "[s] «В реальной жизни такого не бывает!»"
1001403-59 = "Господин..."
1001403-60 = "Изуна... действовала вам на нервы?"
1001403-61 = "[s5] «Я не это имел в виду...»\n[s6] «Нам необязательно проводить вместе каждую секунду...»"
1001403-62 = "Нет, я не против, если так."
1001403-63 = "Нет, я не против, если так."
1001403-64 = "В конце концов, Изуна — ваш ниндзя."
1001403-65 = "Ах!"
1001403-66 = "[s] «Что?»"
1001403-67 = "Мой господин! Осторожно!"
1001403-69 = "[ns] «Ч-что случилось?»"
1001403-72 = "Фух. Это была всего лишь собака."
1001403-73 = ""
1001403-74 = "(улыбается) Я так рада, что вы в безопасности, мой господин!"
1001403-75 = "[s] «Эм. Ага. С-спасибо...»"
1001403-76 = "Изуна была полезной! Правда ведь, мой господин?!"
1001403-77 = "(Когда я вижу такую улыбку, у меня просто не хватает духу прогнать её.)"
1001403-78 = "[s] «Конечно, ты была полезной.»"
1001403-79 = "Хи-хи! Можете рассчитывать на меня, мой господин!"
1001403-80 = "[s] «К-конечно...»"
1001403-82 = "(И так Изуна продолжала «защищать» меня весь мой выходной.)"
