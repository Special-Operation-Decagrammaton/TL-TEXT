[translation]
1300002-1 = "Ты мой Господин? Часть 1"
1300002-2 = "Чёрный рынок"
1300002-4 = "Во время миссии за мной погналась Банда шлемов."
1300002-5 = "А ну стой!"
1300002-6 = "Так ты тот самый Сенсей, о котором они постоянно треплются. Хех. В последнее время твой клуб Шале здорово действует нам на нервы."
1300002-7 = "Может, для разнообразия проведёшь немного времени с нами?"
1300002-8 = "Мы слышали, ты угощаешь всех девочек. Почему бы не поделиться и с нами...?"
1300002-9 = "Этого не будет."
1300002-10 = "Потому что вы этого не заслужили."
1300002-11 = "К-Кто здесь?!"
1300002-12 = ""
1300002-13 = ""
1300002-14 = "Я — Сенсея... нет..."
1300002-15 = ""
1300002-16 = "Я..."
1300002-17 = "...надёжная горничная Господина!"
1300002-18 = "...Что?"
1300002-19 = "*бум*"
1300002-20 = "А-а-а! Она бросила бомбу!"
1300002-21 = "Угх…"
1300002-22 = ""
1300002-24 = "(падает)"
1300002-25 = "..."
1300002-27 = "Хи-хи. ♪"
1300002-28 = "Давно не виделись, Господин."
1300002-29 = "[s1] «Аканэ?»\n[s2] «Что горничная делает здесь?»"
1300002-30 = "Ну, я же Аканэ — Прекрасная Таинственная Горничная!"
1300002-31 = "Ну, я же Аканэ — Прекрасная Таинственная Горничная!"
1300002-32 = "Я увидела тебя во время миссии — то есть клубного занятия — и пошла следом."
1300002-33 = "Я всегда рада быть полезной."
1300002-34 = "Знаешь..."
1300002-35 = "...почему-то всё это кажется таким знакомым."
1300002-36 = "Напоминает нашу первую встречу, Сенсей."
1300002-38 = "Исполнительный офис Шале"
1300002-39 = "Не так давно..."
1300002-40 = "Что-то внезапно пробило потолок взрывом."
1300002-41 = "*БУМ*"
1300002-42 = "А-а-а!"
1300002-43 = "Ч-что это было?!"
1300002-46 = ""
1300002-47 = "..."
1300002-48 = "Ты мой господин?"
1300002-49 = "[s3] «Для тебя я Сенсей.»\n[s4] «Всё это до боли знакомо...»"
1300002-50 = "Хм-м."
1300002-51 = "Хм-м."
1300002-52 = "Рада, что чувство юмора у тебя на месте."
1300002-53 = "Приятно познакомиться."
1300002-54 = "Аканэ из C&C."
1300002-55 = "Я здесь, чтобы служить тебе, Сенсей — прошу прощения. Господин."
