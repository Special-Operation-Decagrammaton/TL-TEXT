10002110-1 = "Эпизод 11; Пляжный волейбол"
10002110-2 = "В списке осталось всего два занятия."
10002110-3 = ""
10002110-4 = "Пора играть в пляжный волейбол!"
10002110-5 = "Видите? У нас даже мяч есть."
10002110-6 = "Если точнее, мяч принёс Сенсей."
10002110-7 = "А, ну да."
10002110-8 = "Спасибо, Сенсей. Простите, что так вас напрягла."
10002110-9 = "Пляж уже не такой людный, и в этот раз я не вижу никаких признаков тех хулиганов. Может, наконец выполним задание спокойно."
10002110-10 = "[s1] «Ты точно в порядке, Хифуми?»\n[s2] «Ты выглядишь уставшей.»"
10002110-11 = "А? Я в порядке..."
10002110-12 = "А? Я в порядке..."
10002110-13 = "Я просто думаю, правильно ли мы вообще всё это делаем."
10002110-14 = "Это не совсем те летние каникулы, которые мы себе представляли."
10002110-15 = "Я просто хотела показать Азусе океан и хорошо провести время со всеми."
10002110-16 = "Разве мне не весело?"
10002110-17 = "Я рада, что тебе нравится, но летние каникулы должны быть..."
10002110-18 = "Ну, они не должны состоять из выполнения заданий, странных напитков и постоянных нападений пляжных хулиганов."
10002110-19 = "А если подумать, вероятно, вопрос лишь времени, когда они снова на нас нападут."
