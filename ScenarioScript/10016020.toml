[translation]
10016020-1 = "Эпизод 2;Искушение уличной едой"
10016020-2 = "У спортивного стадиона: улица еды"
10016020-4 = "Когда заседание Исполнительного комитета наконец закончилось, я решил осмотреть палатки торговцев, расставленные к спортивному фестивалю."
10016020-5 = "Сюда! Знаменитая гастрономическая улица «Променад Чёрной Черепахи» из Шанхайцзина приехала на Фестиваль Хало!"
10016020-6 = "У вас уникальный шанс попробовать деликатесы Шанхайцзина, пока вы смотрите соревнования!"
10016020-7 = "Да ладно! Смотри! У «Променада Чёрной Черепахи» тоже есть палатка!"
10016020-8 = "Серьёзно? Я всегда хотела попробовать! Возьмём что-нибудь?"
10016020-9 = "Хотя жирная еда так рано утром, наверное, не очень полезна..."
10016020-10 = ""
10016020-12 = ""
10016020-13 = "Покупайте блюда «Момоёдо» здесь!"
10016020-14 = "Пейте нашу новинку — газировку с сакурой — и болейте за любимых спортсменок!"
10016020-15 = "И попробуйте сэндвич-моти с пастой из бобов, приготовленный лично мной, Шизуко!"
10016020-16 = "Это «Момоёдо»?"
10016020-17 = "Моя подруга была на Фестивале цветения сакуры в Хяккияко и сказала, что еда «Момоёдо» была лучшей частью!"
10016020-18 = "До следующего соревнования времени хватает! Давайте возьмём!"
10016020-19 = ""
10016020-21 = ""
10016020-22 = "[ns] «У стадиона столько народу...»"
10016020-24 = ""
10016020-25 = "Фух! Я объелась!"
10016020-26 = "Здесь я наелась. Пойдём куда-нибудь ещё."
10016020-27 = ""
10016020-29 = ""
10016020-30 = ""
10016020-31 = "А ну стой!"
10016020-32 = "А? Президент Боевой группы Правосудия?"
10016020-33 = "Мусорить запрещено!"
10016020-34 = "Студенты усердно украшали эту территорию. Пожалуйста, уважайте их труд."
10016020-35 = "(Уф... Почему Боевая группа Правосудия дежурит даже во время спортивного фестиваля...)"
10016020-36 = "П-Прости..."
10016020-37 = ""
10016020-39 = ""
10016020-40 = ""
10016020-41 = ""
10016020-42 = "*вздыхает* Может, их захватил фестивальный азарт, но безответственных студентов так много."
10016020-43 = "Я ожидала, что они будут изо всех сил поддерживать репутацию «Тринити»."
10016020-44 = "[s] «Рад снова тебя видеть, Хасуми.»"
10016020-45 = "...Сенсей [USERNAME]?"
10016020-46 = "Не ожидала встретить вас здесь, но рада. Я хотела извиниться за прошлый раз."
10016020-47 = "Несмотря ни на что, вам нравится фестиваль?"
10016020-48 = "[s] «Очень, и всё благодаря тебе.»"
10016020-50 = "[ns] «Ты сейчас на дежурстве, Хасуми?»"
10016020-51 = "Да. Как член Исполнительного комитета, я обязана следить, чтобы фестиваль не вышел из-под контроля. Студенты, осмелевшие из-за суматохи, могут попытаться устроить неприятности."
10016020-52 = "Правда, я недооценила размеры площадки и количество людей."
10016020-53 = "Сегодня весь день придётся быть начеку."
10016020-54 = "[s] «Значит, ты не успеешь поучаствовать в соревнованиях?»"
10016020-55 = "Участвовать? Конечно."
10016020-56 = "Исполнительный комитет отвечает за проведение, а не за участие."
10016020-57 = "Не то чтобы членам комитета запрещено участвовать, но..."
10016020-58 = "Как я уже говорила, есть другие студенты, которые серьёзно тренировались и гораздо лучше подходят для таких соревнований."
10016020-59 = "Так что я лучше останусь в стороне и прослежу, чтобы всё прошло гладко и студенты были довольны."
10016020-60 = "[s] «Похоже, у тебя дел по горло.»"
10016020-61 = "Да, но не слишком много."
10016020-62 = "Это примерно те же обязанности, что и обычно, просто применительно к Фестивалю Хало."
10016020-63 = "Моя работа — следить, чтобы справедливость восторжествовала. Когда и где я это делаю, ничего не меняет."
10016020-64 = "О боже! Какое совпадение. Здравствуйте, Сенсей."
10016020-65 = ""
10016020-67 = ""
10016020-68 = ""
10016020-71 = ""
10016020-72 = "А! [USERNAME]-сенсей."
10016020-74 = "Привет, Сенсей!"
10016020-75 = "[s1] «Всем привет! Вы тоже здесь!» \n[s2] «Общество исследования гурманов участвует в Фестивале Хало?»"
10016020-76 = "Конечно! Этот спортивный праздник — шанс попробовать самые изысканные блюда, которых вы раньше даже не видели."
10016020-77 = "Конечно! Этот спортивный праздник — шанс попробовать самые изысканные блюда, которых вы раньше даже не видели."
10016020-78 = "Мы, Общество исследования гурманов, ни за что не пропустили бы такой кулинарный фестиваль."
10016020-79 = "[s] «Ты только что назвала это кулинарным фестивалем...?»"
10016020-80 = "Я назвала его ровно тем, чем он является. Фестиваль Хало — выставка талантов студентов, верно?"
10016020-81 = "С научными возможностями «Миллениума» вполне возможно даже извлекать или усиливать определённые вкусы с помощью технологий полимерных соединений..."
10016020-82 = "Такая кухня может устроить именно ту революцию, которой нам так не хватает в застоявшемся мире гастрономии."
10016020-83 = "И это ещё не всё — вы бы видели, сколько здесь разных палаток с едой!"
10016020-84 = "Некоторые продавцы даже готовят специальные блюда только для спортивного фестиваля, чтобы есть их во время просмотра соревнований!"
10016020-85 = "Здесь есть даже такие престижные заведения, как «Променад Чёрной Черепахи» и «Момоёдо»! Обычно обычному студенту туда трудно попасть, поэтому многие приходят на стадион только ради еды! ★"
10016020-86 = "[s] «Если подумать, я и правда видел студентов из самых разных академий.»"
10016020-87 = "О, о! А ещё здесь есть соревнование по поеданию хлеба!"
10016020-88 = "Нужно просто поучаствовать в каком-нибудь забеге, и можно есть сколько угодно хлеба! Невероятно!"
10016020-90 = "...Обычно соревнования по еде работают не совсем так."
10016020-91 = "Знаете, что я слышала? Тут даже есть соревнование, где нужно состязаться с машиной, которая автоматически готовит ванко-собу..."
10016020-92 = "Хи-хи. Интересно, сможет ли эта машина тягаться со мной! ♥"
10016020-93 = "Все такие радостные... Глупость какая-то..."
10016020-94 = ""
10016020-96 = ""
10016020-97 = "Эти студенты..."
10016020-98 = "О, кто это? Если я правильно помню, вы президент Боевой группы Правосудия?"
10016020-99 = "(С кем угодно из «Геенны» трудно мирно сосуществовать... И почему из всех возможных это должны быть участницы одного из самых печально известных клубов?)"
10016020-100 = "(Как раздражает.)"
10016020-101 = "Рада знакомству. Сегодня я просто член Исполнительного комитета Фестиваля Хало в Кивотосе, не более."
10016020-102 = "Надеюсь, вы продолжите наслаждаться фестивалем и будете осторожны."
10016020-103 = "Спасибо за тёплый приём."
10016020-105 = "Не уверена, что слово «тёплый» здесь подходит..."
10016020-107 = "В благодарность я купила это в одной палатке..."
10016020-108 = ""
10016020-110 = ""
10016020-111 = "Жареная кукуруза с сахаром и сыром. Хотите одну?"
10016020-112 = "*глоть*"
10016020-113 = "О... Простите. Вы не любите кукурузу?"
10016020-114 = "Нет-нет... Дело не в этом... Скорее в сочетании сахара и сыра."
10016020-115 = "Сколько там калорий со всеми добавками... Для перекуса тяжеловато."
10016020-116 = "А, понятно. Вот что вас беспокоит?"
10016020-117 = "Ну, я бы вообще не переживала. Мы же на спортивном фестивале. Вы всё это мгновенно сожжёте."
10016020-118 = "Вообще, учитывая, сколько вам сегодня придётся бегать, стоит скорее бояться слишком сильно похудеть!"
10016020-119 = "Слишком... сильно... похудеть...?"
10016020-121 = "Кстати, я никогда не задумывалась, какая ты худая при том, сколько ешь, Харуна."
10016020-122 = "Ты сидишь на какой-то секретной диете?"
10016020-123 = "Я никогда не стала бы участвовать в таком фарсе. Я просто не набираю вес."
10016020-124 = "Диеты заставляют чувствовать вину за нечто столь прекрасное и возвышенное, как еда. Как отвратительно и глупо."
10016020-126 = "..."
10016020-127 = "Ты... не набираешь вес...? Отвратительно? ...Глупо?!"
10016020-128 = "Никогда... Никогда..."
10016020-129 = "Я никогда не прощу тебя, «Геенна»!"
10016020-130 = "[s] «Х-Хасуми...?»"
10016020-131 = "Несмотря на постоянные искушения, я всю дорогу сопротивлялась ароматам вкуснейших лакомств, которые окружали меня на каждом шагу!"
10016020-132 = "А потом ты смеешь прийти и насмехаться над моими усилиями! Издеваться над моей борьбой! Я никогда не прощу такой несправедливости!"
10016020-133 = "Ради Сенсея я изо всех сил старалась сохранять спокойствие. Но больше не могу!"
10016020-134 = "Я сделаю всё, что потребуется. Я уничтожу каждую из вас!"
10016020-135 = ""
10016020-137 = ""
10016020-138 = "О-о боже... Кажется, мы задели больное место..."
10016020-139 = "[s] «Вообще-то, Харуна, думаю, тут ты сама виновата.»"
10016020-140 = "Не понимаю. Она же просто предложила вкусную еду!"
10016020-141 = "Да! Кто вообще злится из-за бесплатной вкусной кукурузы?!"
10016020-143 = "Надо быть ещё глупее Изуми, чтобы злиться из-за бесплатной еды."
10016020-144 = "*вздыхает* Что я вообще здесь делаю? Не хочу участвовать в унизительном соревновании по еде, даже если еда вкусная..."
10016020-145 = "К тому же все хорошие палатки мы уже попробовали... Можно я просто пойду домой?"
10016020-146 = "[s] «Джунко.»"
10016020-147 = "Что?"
10016020-148 = "[s] «Почему бы тебе не попробовать другие активности спортивного фестиваля?»"
10016020-149 = "Даже если я и попробую..."
10016020-150 = ""
10016020-153 = "Внимание, пожалуйста! Первое соревнование Фестиваля Хало в Кивотосе скоро начнётся."
10016020-154 = "Участвующие студенты каждой академии должны собраться в зоне участников."
10016020-156 = "Что?! Соревнование вот-вот начнётся!"
10016020-157 = "На забеге с поеданием хлеба может закончиться хлеб! Мы опоздали! Нам конец!"
10016020-158 = "Мы ещё не опоздали. Времени достаточно."
10016020-159 = "Давайте разделимся, чтобы успеть ко всей еде, которую хотим попробовать?"
10016020-160 = "Мне подходит! Пока-пока! ♥"
10016020-161 = ""
10016020-163 = ""
10016020-165 = "...Пока."
10016020-166 = ""
10016020-168 = ""
10016020-170 = "Попрощавшись с Обществом исследования гурманов, я вернулся на стадион смотреть соревнования."
