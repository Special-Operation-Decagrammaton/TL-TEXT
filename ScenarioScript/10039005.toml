[translation]
10039005-97 = "#video;10039"
10039005-1 = "Пролог;Мотоциклетная угроза"
10039005-3 = "...Простите, Сенсей."
10039005-4 = "После всего, что вы сделали, чтобы помочь..."
10039005-5 = "...я даже не знаю, что теперь сказать."
10039005-6 = "Может быть, мне вообще не стоило вмешиваться."
10039005-7 = "Может, это моя вина из-за того, что я так во всё лезла..."
10039005-8 = "...но я всё равно поступила бы так снова."
10039005-9 = "Я не могла просто сидеть и ничего не делать. Мне нужно было действовать."
10039005-10 = "Сенсей, пожалуйста, я понимаю, что прошу о многом, но..."
10039005-11 = ""
10039005-14 = "...после всего этого вы всё ещё можете меня простить?"
10039005-15 = ""
10039005-19 = ""
10039005-20 = ""
10039005-22 = ""
10039005-23 = "«Так слухи правдивы?»"
10039005-24 = ""
10039005-26 = ""
10039005-27 = "«Говорят, это произойдёт на площади Тринити через два часа.»"
10039005-28 = ""
10039005-30 = ""
10039005-31 = "«Ничего себе. С чего всё это вдруг?»"
10039005-32 = ""
10039005-34 = ""
10039005-35 = "«Это просто безумие...»"
10039005-36 = ""
10039005-38 = ""
10039005-39 = ""
10039005-40 = "[log]«Мы сегодня на войну идём?»[/log]"
10039005-42 = ""
10039005-44 = ""
10039005-47 = "Эй, ты! Чего стоишь? Двигай!"
10039005-48 = "Что, не слышишь меня? Проблемы какие-то?"
10039005-49 = "...Хм, это форма Тринити."
10039005-50 = "...Сест...ра...?"
10039005-51 = ""
10039005-53 = ""
10039005-54 = ""
10039005-55 = ""
10039005-56 = ""
10039005-59 = "Эй, ты чего?!"
10039005-60 = "*ахает*"
10039005-61 = "...Слезь. Пожалуйста."
10039005-62 = "Ч-что?!"
10039005-63 = "Мне нужно одолжить этот мотоцикл. Пожалуйста, слезь."
10039005-64 = ""
10039005-66 = ""
10039005-67 = "Сестра, ты о чём вообще?"
10039005-68 = "Ты угоняешь мой байк? Под дулом?!"
10039005-69 = "Какого..."
10039005-71 = ""
10039005-73 = ""
10039005-74 = ""
10039005-75 = "Эй, эй, ты меня пугаешь!"
10039005-76 = "Прости. Нет времени объяснять."
10039005-77 = "Эй, ну хоть скажи, что вообще происходит!"
10039005-78 = ""
10039005-80 = ""
10039005-81 = "Ладно, ладно! Блин!"
10039005-82 = "...Спасибо. Я потом всё возмещу, обещаю."
10039005-83 = ""
10039005-85 = ""
10039005-86 = ""
10039005-88 = "Ты так ничего мне и не расскажешь, да?"
10039005-89 = ""
10039005-91 = ""
10039005-92 = "Ну..."
