[translation]
33170-1 = "Эпизод 17;Воплощение ненависти"
33170-2 = ""
33170-3 = "Отойди, первогодка. Ты не видишь, что происходит?"
33170-4 = "У нас военное положение, и мы на грани войны!"
33170-5 = "Я-Я знаю, но...!"
33170-7 = "С дороги!"
33170-9 = ""
33170-11 = ""
33170-12 = "Не отойду!"
33170-13 = "Я-Я, может, немного тугодум и не до конца понимаю, что происходит..."
33170-14 = "...но я знаю, что это неправильно! То, что вы делаете, неправильно!"
33170-15 = ""
33170-19 = "Ладно. Если не отойдёшь, тогда..."
33170-20 = "П-Подождите. Я где-то уже видела эту девушку."
33170-21 = "И правда знакомое лицо..."
33170-22 = ""
33170-23 = ""
33170-25 = "[ns] «Кохару состоит в Клубе дополнительных занятий. Она мой студент.»"
33170-27 = "С-Сенсей?!"
33170-28 = "..."
33170-30 = "С-Советник из Шале?!"
33170-31 = "Не может быть... Нам сказали, что он без сознания и в критическом состоянии."
33170-32 = "Что он здесь делает...?"
33170-33 = "[s] «Достаточно. Пожалуйста, опустите оружие.»"
33170-34 = "Н-Но..."
33170-35 = "Мы так далеко зашли..."
33170-36 = "Мне кажется, Сенсей не шутит..."
33170-37 = "У-Уходим отсюда."
33170-38 = ""
33170-40 = ""
33170-41 = ""
33170-42 = "С-Сенсей... Это правда вы?"
33170-43 = "[s] «Я горжусь тем, как ты поступила. Как настоящая элита.»"
33170-44 = "Сенсей!"
33170-45 = ""
33170-47 = ""
33170-48 = ""
33170-49 = "..."
33170-50 = "Это правда вы..."
33170-51 = "[s] «С тобой всё будет хорошо, Мика?»"
33170-52 = "Эм... Да."
33170-53 = "Ну, э... давно не виделись?"
33170-54 = "[s] «Да. Мика, почему ты не пошла у них на поводу?»"
33170-55 = "А, это? Ну..."
33170-56 = "Не знаю. Наверное, это была идеальная возможность раз и навсегда избавиться от Геенны..."
33170-57 = "...но ответа у меня нет. Не знаю почему."
33170-58 = "Даже я сама не понимаю..."
33170-59 = "Секундочку..."
33170-60 = "Я что...?"
33170-62 = "Мика..."
33170-63 = "Я думала, твоя ненависть заставит тебя воспользоваться этой возможностью."
33170-64 = "Почему ты сейчас отступаешь...?"
33170-66 = "Я не понимаю, Мика. Зачем ты хочешь помириться с Ариусом?"
33170-67 = "А? Зачем..."
33170-68 = "Нагиса спрашивает, какую политическую выгоду ты в этом видишь."
33170-69 = "Я вообще не об этом думала. Они ведь когда-то были одной из фракций Тринити, да? Да, это было давно..."
33170-70 = "...но что, если мы придём в их район и скажем, что хотим дружить? Потом пригласим их на чай, и всё станет как в старые добрые времена!"
33170-71 = "..."
33170-72 = "..."
33170-73 = "Чего вы так неловко молчите? У меня что-то на лице?"
33170-74 = "По-моему, отличный план! Я бы так и сделала, будь я хозяйкой!"
33170-75 = "Клянусь... Ты хоть подумала, как они отреагируют? Не говоря уже о том, что никто даже не знает, где сейчас находится район Ариуса."
33170-76 = "Меня также беспокоят твои намерения. Если Ариус согласится, Тринити только усилится, а это может спровоцировать войну. Ты этого хочешь?"
33170-77 = "Я об этом особо не думала, но звучит весело!"
33170-78 = "Может, наконец сотрем Геенну с карты. Разве не этого все хотят?"
33170-79 = "..."
33170-80 = "Что такое, Сэя? Почему ты так на меня смотришь?"
33170-82 = "Ты всегда была эгоистичной. Импульсивной, бездумной и вдобавок саморазрушительной."
33170-83 = "Может, поэтому ты мне никогда особо не нравилась."
33170-85 = ""
33170-86 = "Вот. Сэя прямо за этой дверью."
33170-87 = "Теперь я буду следующей в очереди на место хозяйки, пока она отправляется в небольшой затяжной отпуск в больницу."
33170-88 = "Будет так весело!"
33170-89 = ""
33170-91 = ""
33170-92 = "Дальше проникновением займётся отряд."
33170-93 = "Хм? Отряд?"
33170-94 = "Просто чтобы ты знала."
33170-95 = ""
33170-97 = ""
33170-99 = "(Сэя... мертва?)"
33170-100 = "(Но как...? Почему?)"
33170-101 = "(Как это могло произойти? Всё должно было быть не так.)"
33170-102 = "(Это шутка? Я просто хотела...)"
33170-103 = "(Постой. Зачем я вообще это сделала?)"
33170-104 = "(Почему я приказала напасть на Сэю?)"
33170-105 = "(Почему хотела убрать её с дороги?)"
33170-106 = "(...)"
33170-107 = "(А, точно. Я хотела стать хозяйкой.)"
33170-108 = "(Конечно. Потому что я так ненавижу Геенну, а Наги пытается силой протолкнуть этот договор.)"
33170-109 = "(Зачем ей вообще такое? Это же глупость! Мирный договор с Геенной? Как будто это возможно. Я этого не позволю.)"
33170-110 = "(Сэя говорила, что видит будущее. Так почему она этого не предвидела? Почему не защитила себя?)"
33170-111 = "(Она вообще была слишком слабой для Чаепития. И как она иногда на меня смотрела...)"
33170-112 = "(Так что, если подумать...)"
33170-113 = "(...это было неизбежно. Эта жертва была необходима, чтобы избавиться от Геенны.)"
33170-114 = "(Да. Наверное, именно так.)"
33170-115 = ""
33170-116 = "Я-Я просто..."
33170-117 = "..."
33170-118 = "Прости, Сэя. Я не хотела..."
33170-119 = "Я никогда не хотела, чтобы всё закончилось так."
33170-120 = "Прости... Прости!"
33170-121 = "Прости, что я такая идиотка..."
33170-122 = "[s] «Мика...»"
33170-123 = "Сенсей... Я хочу увидеть Сэю..."
33170-124 = "Я хочу снова увидеть Наги..."
33170-125 = "Если бы только я могла..."
33170-126 = ""
33170-128 = "..."
33170-129 = "Теперь я понимаю, Мика."
33170-130 = "Ты просто пыталась рационализировать случившееся."
33170-131 = "Пыталась защитить своё сердце и совесть."
33170-132 = "И, как обычно, ошибалась и заходила слишком далеко."
33170-133 = ""
33170-134 = "..."
33170-135 = "Мне казалось, я тебя насквозь вижу. Я думала, что понимаю, какой ты человек и о чём думаешь..."
33170-136 = "...но я ошибалась."
33170-137 = "Значит, нам обеим ещё многому предстоит научиться."
33170-138 = "Ты, как и я, оказалась на неправильной стороне извращённой сказки ещё до того, как успела это понять."
33170-139 = "Убийство, смерть, предательство, вражда..."
33170-140 = "Слишком мрачная история для такой девушки, как ты."
33170-141 = "Мика..."
33170-142 = "Ты уже довольно долго страдала..."
33170-143 = "...поэтому я тебя прощаю."
33170-144 = "Возможно, мне тоже стоит попросить у тебя прощения."
33170-145 = "В будущем нам будет о многом нужно поговорить."
33170-146 = ""
33170-147 = "[ns] «Конечно. Я это устрою.»"
33170-148 = ""
33170-153 = "Э-Это Сенсей..."
33170-154 = "Невозможно..."
33170-155 = "Сенсей вернулся...?"
33170-156 = "[s] «Спасибо, что все пришли.»"
33170-157 = ""
33170-159 = ""
33170-160 = "Сенсей..."
33170-161 = "С возвращением."
33170-162 = "Д-Да!"
33170-163 = ""
33170-164 = "[ns] «Спасибо, что дождались.»"
33170-166 = "[ns] «Дальше я разберусь.»"
33170-169 = "Следующий эпизод;Ни секунды сомнений"
