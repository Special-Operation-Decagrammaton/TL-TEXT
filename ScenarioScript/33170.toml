[translation]
33170-1 = "Episódio 17;A Verdadeira Face do Ódio"
33170-3 = "Saia da frente, você não entende a situação atual!?"
33170-4 = "É uma emergência, sabia!?"
33170-5 = "M-Mas eu...!"
33170-7 = "Saia da frente!!"
33170-12 = "...N-Não quero!"
33170-13 = "E-Eu sou burra, então não entendo nada do que está acontecendo, mas..."
33170-14 = "Mas isso está errado! Isso não pode acontecer de jeito nenhum!!"
33170-19 = "Ela não escuta mesmo. Nesse caso..."
33170-20 = "E-Espera. Essa garota, eu já vi ela em algum lugar..."
33170-21 = "Olhando bem, o rosto dela não me é estranho..."
33170-25 = "[ns] \"A Koharu é minha aluna, do Clube de Aulas de Reforço.\""
33170-27 = "S-Sensei!?"
33170-28 = "..."
33170-30 = "Da Schale...!?"
33170-31 = "Mas como...? Disseram que estava inconsciente e em estado grave...?"
33170-32 = "S-Sensei, por que você está aqui...?"
33170-33 = "[s] \"Por favor, primeiro quero que parem com a violência.\""
33170-34 = "I-Isso é..."
33170-35 = "..."
33170-36 = "V-Vamos embora. Olha a expressão do Sensei, a coisa tá feia pro nosso lado..."
33170-37 = "...É, vamos."
33170-42 = "S-Sensei... Sensei..."
33170-43 = "[s] \"Você mandou muito bem, Koharu. Como esperado da elite do Comitê de Justiça.\""
33170-44 = "Sensei...!"
33170-49 = "..."
33170-50 = "Sensei..."
33170-51 = "[s] \"Mika, tudo bem com você?\""
33170-52 = "Hum... sim."
33170-53 = "Como posso dizer... quanto tempo... né?"
33170-54 = "[s] \"Pois é. Mika... por que ainda há pouco você...\""
33170-55 = "Hã? Ah, aquilo..."
33170-56 = "...Por que será, né? Eu sei que era a oportunidade perfeita e que bastava eu me levantar agora, mas..."
33170-57 = "Eu ainda odeio elas, mas... por que será...?"
33170-58 = "Nem eu mesma tô entendendo direito..."
33170-59 = "Ué, e-espera um pouco..."
33170-60 = "Eu..."
33170-62 = "Mika..."
33170-63 = "Esse ódio... todo esse rancor que você liderava na linha de frente..."
33170-64 = "Por que você...?"
33170-66 = "Mika-san, já não está na hora de nos contar? \"Reconciliar-se com Arius\"... Qual é a verdadeira intenção por trás disso?"
33170-67 = "Hã? Intenção?"
33170-68 = "Que tipo de benefício político isso traria... é o que a Nagisa está perguntando."
33170-69 = "Não é bem por benefício político... É que, originalmente, todas nós éramos da mesma Trinity, né?"
33170-70 = "Que tal a gente ir direto até o distrito autônomo e dizer: \"Vamos fazer as pazes?\"! Olha, podemos até organizar um chá juntas com todo mundo!"
33170-71 = "..."
33170-72 = "..."
33170-73 = "...Ué, que clima é esse? Eu falei alguma coisa estranha?"
33170-74 = "Não acham uma boa ideia? Ah, se eu fosse a anfitriã, já teria colocado isso em prática na mesma hora."
33170-75 = "Mika-san, você realmente... Bom, deixemos isso de lado por ora. Nem sabemos se o lado de lá aceitaria, não é mesmo? Ainda mais quando sequer sabemos a localização do distrito autônomo."
33170-76 = "Além disso, Mika, mesmo supondo que você conseguisse realizar isso, o que pretende fazer depois? Uma Trinity ainda mais poderosa após absorver Arius... Por acaso planeja iniciar alguma grande guerra?"
33170-77 = "Hmm, bom, eu não tinha pensado em nada disso, mas... até que não seria má ideia, né? Muita gente por aqui também pensa assim."
33170-78 = "E, se isso acontecesse, quem sabe a gente não conseguisse dar um jeito em Gehenna de uma vez?"
33170-79 = "..."
33170-80 = "...Que foi, Seia-chan? Que carinha é essa?"
33170-82 = "Você é egoísta. Além de quase não pensar em nada, é impulsiva, gananciosa e, às vezes, autodestrutiva..."
33170-83 = "Talvez eu não gostasse desse seu jeito."
33170-86 = "...A Seia-chan está aqui."
33170-87 = "Se puderem apenas mandá-la discretamente para um hospital ou algo assim..."
33170-88 = "Então é isso, conto com vocês, viu?"
33170-92 = "Quanto a isso, deixarei a cargo do \"Esquadrão\"."
33170-93 = "...Esquadrão?"
33170-94 = "Sim, você já deve conhecê-las, não é?"
33170-99 = "(A Seia-chan... morreu...?)"
33170-100 = "(...Por quê? Como assim?)"
33170-101 = "(O que aconteceu...? Hã? Por que chegou a esse ponto...?)"
33170-102 = "(Por quê? Elas são idiotas? Mas eu só...)"
33170-103 = "(Espera, eu...)"
33170-104 = "(Por que mesmo eu dei a ordem para atacarem a Seia-chan...?)"
33170-105 = "(Se a Seia-chan se fosse, eu...)"
33170-106 = "(...)"
33170-107 = "(...Ah, é mesmo. Eu estava tentando me tornar a anfitriã...)"
33170-108 = "(Isso, porque eu odiava Gehenna. Porque o que eu odeio, eu odeio. E a Nagi-chan também estava tentando fazer algo estranho com aquele tratado.)"
33170-109 = "(Por que ela inventou de fazer aquilo? Continua uma bobinha como sempre. Um tratado de paz com Gehenna, de jeito nenhum. Isso eu jamais posso perdoar.)"
33170-110 = "(...Seia-chan. Você vivia dizendo que podia ver o futuro e tudo mais, então por que não conseguiu proteger nem a si mesma? Pelo menos isso você devia ter previsto, né?)"
33170-111 = "(Pra começo de conversa, entrou para a Tea Party mesmo tendo uma saúde tão frágil, e vivia pegando no meu pé dizendo \"Pense com mais cuidado\"... Até outro dia mesmo, me olhou com aqueles olhos...)"
33170-112 = "(Por isso, por isso...)"
33170-113 = "(Para que as coisas chegassem até aqui, e para varrer Gehenna do mapa, um sacrifício desse tamanho era inevitável.)"
33170-114 = "(Deveria ter sido assim, mas...)"
33170-116 = "E-Eu..."
33170-117 = "..."
33170-118 = "Desculpa, Seia-chan..."
33170-119 = "Por que as coisas acabaram assim...?"
33170-120 = "Desculpa... me desculpa..."
33170-121 = "Desculpa por eu ser tão burra..."
33170-122 = "[s] \"Mika...\""
33170-123 = "Sensei... Eu quero ver a Seia-chan..."
33170-124 = "Eu quero ver a Nagi-chan mais uma vez também..."
33170-125 = "Depois de tudo o que eu fiz, talvez já seja tarde demais pra mim, mas..."
33170-128 = "..."
33170-129 = "Mika, você..."
33170-130 = "Entendo... você estava buscando um motivo..."
33170-131 = "Achando que precisava de algo concreto para justificar o que odiava, tentando racionalizar isso em algum lugar dentro de si..."
33170-132 = "E assim um erro se somou ao outro... fazendo tolices, como sempre..."
33170-134 = "..."
33170-135 = "Eu achava que entendia você. Mas certamente não era apenas isso... O que você carregava consigo, os seus sentimentos infantis, o que se passava pela sua cabeça, a sua situação... Eu negligenciei o esforço de tentar compreender tudo isso."
33170-136 = "...Entendo."
33170-137 = "Eu ainda sei tão pouco sobre você..."
33170-138 = "...E, quando percebeu, você também estava exatamente como eu. Colocada bem no centro de uma história errada."
33170-139 = "Assassinato, morte, traição, conflito..."
33170-140 = "Era uma história cruel demais para uma garota como você estar envolvida. Um capricho que normalmente deveria ser perdoado acabou levando você a..."
33170-141 = "...Mika."
33170-142 = "Você também, esse tempo todo..."
33170-143 = "...De todo modo, eu vou perdoar você."
33170-144 = "E talvez eu também precise implorar pelo seu perdão."
33170-145 = "Nós duas vamos conversar e nos abrir uma com a outra mais uma vez, e então... quem sabe, depois disso..."
33170-147 = "[ns] \"...Deixe comigo, Mika.\""
33170-153 = "É-É o Sensei..."
33170-154 = "Sensei..."
33170-155 = "Sensei...!?"
33170-156 = "[s] \"Desculpem a demora, pessoal.\""
33170-160 = "Sensei..."
33170-161 = "Sensei...!"
33170-162 = "...!"
33170-164 = "[ns] \"Obrigado por estarem aqui e por esperarem por mim.\""
33170-166 = "[ns] \"Daqui em diante, deixem comigo.\""
33170-169 = "Próximo;Sem Hesitar"
