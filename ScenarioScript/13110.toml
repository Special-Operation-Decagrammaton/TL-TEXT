[translation]
13110-1 = "Episódio 11;O Segredo Revelado"
13110-8 = "Por favor, sentem-se aqui."
13110-9 = "Muito obrigado... Então esta é a sala do Comitê de Contramedidas.#nJamais imaginei que viria até aqui nestas circunstâncias..."
13110-14 = "A Supervisora Suou aqui, como mencionei ontem, representa o lado da Nephthys.#nHoje ela também se dispôs a atuar como minha escolta."
13110-15 = "...Pois é."
13110-19 = "Já faz dois anos desde a última vez que nos vimos pessoalmente.#nA senhorita tem passado bem?"
13110-20 = "...Sim, graças a você."
13110-21 = "Fico aliviado em ouvir isso. ...Como avisei por telefone, trouxe um cartão novo com um limite mais alto."
13110-22 = "...N-Não precisa, está tudo bem.#nNão estou passando por nenhuma dificuldade..."
13110-23 = "...Senhorita, não consideraria voltar agora mesmo?"
13110-24 = "Voltar, como assim...?"
13110-25 = "Para a Academia Ferroviária Highlander, é claro."
13110-26 = "Isso..."
13110-28 = "Você está deixando a Nonomi-chan sem jeito, sabia?"
13110-29 = "Nn, vá direto ao ponto."
13110-31 = "...Sim, peço desculpas."
13110-32 = "Não vejo problema algum nisso."
13110-33 = "Originalmente, a Nephthys deveria firmar uma parceria com a Highlander.#nApesar disso, quase tudo foi por água abaixo só porque a senhorita aí decidiu vir para Abydos."
13110-35 = "..."
13110-36 = "Você não tem noção de que está sendo extremamente desrespeitosa#ncom quem cedeu aos seus caprichos?"
13110-42 = "Se segura, Shiroko-senpai!"
13110-43 = "Nn... Não vou fazer nada."
13110-45 = "Se estiver com vontade, pode vir pra cima.#n— Isso se achar que consegue vencer."
13110-46 = "...Suou-san, por favor, não fique provocando."
13110-47 = "...Hmph."
13110-51 = "...Fique tranquila.#nNão vim aqui com a intenção de levá-la de volta."
13110-53 = "Podemos ir logo ao assunto principal?"
13110-54 = "Tem razão..."
13110-56 = "..."
13110-57 = "..."
13110-62 = "Indo direto à conclusão, por trás da \"Ferrovia Transdesértica\"..."
13110-63 = "Havia um projeto secreto de \"Arma Assimétrica\",#nconduzido em sigilo entre o Conselho Estudantil de Abydos e a Nephthys."
13110-69 = "...Como é?!"
13110-70 = "O Conselho Estudantil...?"
13110-72 = "Arma Assimétrica?"
13110-73 = "O-O que é isso...?"
13110-75 = "O seu nome é —"
13110-76 = "— \"Canhão Ferroviário Shemata\"."
13110-82 = "Tanto o poder destrutivo quanto o alcance do Shemata são incomparáveis aos padrões convencionais.#nMais do que um canhão ferroviário... seria melhor chamá-lo de uma arma-fortaleza."
13110-83 = "Um canhão de alcance ultralongo capaz de disparar projéteis de mais de 1 tonelada a 500 km de distância."
13110-84 = "O plano era fazer um monstro desses percorrer os trilhos da ferrovia."
13110-85 = "Mesmo eu, que estou contando isso, mal consigo acreditar que algo assim seja viável."
13110-86 = "Contudo... caso fosse concluído,#ntornaria-se um poder de dissuasão avassalador contra os distritos autônomos vizinhos."
13110-89 = "...Uma arma dessas, é?"
13110-94 = "M-Mas por que fariam algo assim...?!"
13110-95 = "Não é óbvio?"
13110-96 = "Para pagar a dívida, ora."
13110-97 = "...?"
13110-98 = "Existem inúmeras formas de tirar proveito de uma arma poderosa."
13110-100 = "N-Não pode ser..."
13110-101 = "\"Shemata\"... Por acaso esse nome vem daquela antiga presidente do Conselho Estudantil?"
13110-103 = "Você conhece bem.#n...Shemata, a do governo de punho de ferro."
13110-105 = "...Shemata?"
13110-106 = "É o apelido da lendária presidente que acabou com a era caótica em que existiam 70 presidentes ao mesmo tempo#ne liderou Abydos durante o seu auge."
13110-107 = "70 presidentes?! Isso não faz o menor sentido..."
13110-109 = "...Até eu, que não sou de Abydos, conheço essa história."
13110-110 = "Dizem que, em seu auge, Abydos tinha poderio militar e financeiro esmagadores,#nsendo temida e invejada por todos os distritos autônomos."
13110-111 = "Pensando assim, a escolha do nome do Canhão Ferroviário é bem interessante."
13110-112 = "Será que acharam que, tendo uma arma poderosa, conseguiriam quitar a dívida?"
13110-114 = "...Hoshino-senpai."
13110-115 = "Quer dizer então que... a Ferrovia Transdesértica foi construída para esconder o Shemata?"
13110-120 = "Não, senhorita, não é bem assim.#nO projeto da Arma Assimétrica só veio à tona#ndepois que a obra da ferrovia já estava em andamento."
13110-121 = "Provavelmente, houve alguém que plantou essa ideia no Conselho Estudantil de Abydos."
13110-122 = "Quem faria uma coisa dessas...?!"
13110-123 = "Quanto a isso, eu também não sei...#nAfinal, tudo foi conduzido em segredo, sem maiores explicações..."
13110-125 = "Acalme-se e escute, senhorita.#nEsse projeto já fracassou."
13110-126 = "Sim, exatamente."
13110-127 = "Uma arma-fortaleza absurda como o Shemata jamais funcionaria direito."
13110-128 = "No fim, o motor nunca chegou a dar partida.#nAté hoje, ela segue inacabada e abandonada em algum lugar do Deserto de Abydos."
13110-129 = "E o projeto foi encerrado —"
13110-130 = "...Ou pelo menos era assim.#nAté pouco tempo atrás."
13110-136 = "Quando refizeram as simulações recentemente,#ndescobriram que a viabilidade do Shemata agora é altíssima."
13110-137 = "Se quem o projetou já previa o avanço de alguns anos à frente,#nou se foi mera coincidência, só a própria pessoa sabe..."
13110-139 = "De qualquer forma, a importância da Ferrovia Transdesértica disparou de uma hora para outra."
13110-140 = "Algo que serve de dissuasão só por existir.#nUma tecnologia inovadora à frente do seu tempo."
13110-141 = "Agora que esses fatos vieram à tona, ninguém ficaria de braços cruzados."
13110-142 = "É exatamente por isso que o \"Fundo Privado\" está tão obcecado#npelos direitos da Ferrovia Transdesértica."
13110-146 = "Porque, assim que obtiverem os direitos da ferrovia, o Canhão Ferroviário também cairá nas mãos deles."
13110-147 = "Claro que o próprio Fundo Privado não deve ser totalmente unido."
13110-150 = "E, como eles não conseguiram reunir sozinhos o capital para comprar os títulos da dívida,#nvieram pedir a ajuda da Nephthys..."
13110-151 = "Da nossa parte, queríamos preservar a Ferrovia Transdesértica se possível,#nentão nos aliamos a eles sem saber que o projeto da Arma Assimétrica havia sido retomado."
13110-154 = "..."
13110-155 = "Quando descobrimos toda a verdade sobre o plano, já não tínhamos como nos retirar do acordo com o Fundo Privado..."
13110-156 = "Não podemos, de forma alguma, deixar os direitos do Canhão Ferroviário caírem nas mãos deles."
13110-157 = "Verdade.#nSe uma arma dessas cair nas mãos de gente ruim, com certeza vai gerar guerra."
13110-159 = "Vamos encontrá-lo primeiro e destruí-lo."
13110-160 = "Sr. Mordomo, você sabe onde o Canhão Ferroviário está?"
13110-162 = "Não... sinto muito.#nNão temos a menor pista de sua localização."
13110-163 = "O projeto em si era ultrassecreto.#nOs documentos daquela época não foram encontrados..."
13110-168 = "Entendi..."
13110-169 = "Pensando agora, um dos motivos pelos quais o Fundo Privado se aproximou de nós#ndeve ter sido para descobrir a localização do Canhão Ferroviário."
13110-170 = "Esse plano deles falhou, mas, de todo modo, é só uma questão de tempo."
13110-171 = "O Centro de Controle Central não deve saber da existência do Canhão Ferroviário nem desse projeto.#nMas, assim que as obras forem retomadas, acabarão encontrando-o em breve."
13110-172 = "...O Fundo Privado está tentando garantir os direitos do Canhão Ferroviário por meio de um contrato formal."
13110-173 = "Um contrato formal...?"
13110-174 = "Sim.#nEles nos questionaram diversas vezes sobre a titularidade dos direitos."
13110-175 = "Na verdade, não apenas o Conselho Estudantil de Abydos e a Nephthys,#nmas o próprio projetista também detém parte dos direitos, o que torna tudo bem complexo..."
13110-176 = "Como empresários, eles devem ser bem competentes.#nDeixar a titularidade bem clara evita qualquer dor de cabeça futura."
13110-177 = "...A Kaiser não sabia da existência do Canhão Ferroviário?"
13110-178 = "Quem sabe. Mesmo que soubesse, acho que não tinha muito interesse. Ouvi dizer que o Presidente da Kaiser está muito mais interessado na Torre Sanctum."
13110-179 = "Ele deve ter julgado melhor vender os títulos e levantar dinheiro#ndo que perder tempo com rumores cuja veracidade nem era garantida..."
13110-183 = "...Porém, aconteceu algo que ninguém podia prever."
13110-187 = "Foi encontrado o contrato firmado entre a presidente do Conselho Estudantil de Abydos e a Nephthys."
13110-189 = "Não sei ao certo como isso aconteceu, mas...#nenquanto esse contrato existir, os direitos do Canhão Ferroviário não passarão para o Fundo Privado."
13110-190 = "A Nephthys realmente não sabe de nada sobre esse contrato?"
13110-191 = "Nem sobre o que aconteceu com a Yume-senpai...?!"
13110-193 = "...Hoshino-senpai."
13110-198 = "...Peço perdão.#nNós também desconhecíamos a existência desse contrato..."
13110-199 = "..."
13110-200 = "Considerando a situação daquela época,#nela provavelmente precisava de qualquer dinheiro que conseguisse para evitar a falência."
13110-201 = "Acredito que a Ferrovia Transdesértica tenha sido apenas um dos direitos vendidos nesse processo."
13110-202 = "..."
13110-203 = "De qualquer forma, o Fundo Privado tentará resolver a questão do contrato primeiro."
13110-204 = "Para eles, essa certamente é a prioridade máxima."
13110-209 = "...Na assembleia geral que acontecerá amanhã ao meio-dia, no Antigo Edifício da Estação Central de Abydos, certo?"
13110-210 = "Sim, exatamente."
13110-211 = "No instante em que a representante do Conselho Estudantil rescindir o contrato na assembleia,#nou se ausentar, o contrato será anulado.#nE os direitos passarão para a Nephthys."
13110-215 = "Isso significa que...?!"
13110-216 = "...Não, senhorita.#nA Nephthys não obterá a totalidade dos direitos."
13110-217 = "Como os títulos foram comprados em conjunto, cada parte tem sua respectiva cota."
13110-222 = "...Então só nos resta uma saída."
13110-228 = "Eu vou comparecer à assembleia e declarar a intenção de manter o contrato."
13110-229 = "...Se puder fazer isso, ficarei muito grato."
13110-230 = "Só vamos poder pagar aos poucos, mas,#npor enquanto, se eles não puderem encostar um dedo nisso, já dá pra respirar aliviada."
13110-231 = "Enquanto isso, é só a gente revirar o deserto todo até achar o Canhão Ferroviário, né?"
13110-233 = "Ué, que sem graça, acabou sendo mais fácil do que eu pensava."
13110-234 = "Sobre isso —"
13110-236 = "Será mesmo?"
13110-241 = "É óbvio que o Fundo Privado vai tentar impedir vocês de comparecerem."
13110-242 = "Mesmo assim, chegar a esse ponto..."
13110-243 = "Basta pensar um pouco para perceber, não acha?#nEles devem cercar o antigo edifício com centenas de soldados para impedir que vocês entrem."
13110-244 = "...Não pode ser!"
13110-249 = "Já devem ter começado a se mexer.#n...Usando absolutamente todos os meios disponíveis."
13110-251 = "Região Leste do Antigo Edifício da Estação Central"
13110-256 = "...Deixo aquele setor nas suas mãos."
13110-258 = "Vamos lá, hora de trabalhar!!"
13110-264 = "Antigo Edifício da Estação Central - Praça Oeste"
13110-270 = "Ótimo, o helicóptero também chegou."
13110-271 = "Os tanques devem defender os pontos designados a todo custo.#nOs Guardas do Mercado mantêm o bloqueio total da área.#nNão deixem passar nem um rato."
13110-276 = "Antigo Edifício da Estação Central - Praça Sul"
13110-278 = "...Vocês já estão a par do plano, certo?"
13110-280 = "Pode deixar, a gente trabalha exatamente pelo que pagam."
13110-286 = "Um Canhão Ferroviário... o legado deixado pelo Imperador do Trovão de Gehenna.#nHeh, vamos colocá-lo em nossas mãos custe o que custar."
13110-288 = "Antigo Edifício da Estação Central - Praça Norte"
13110-293 = "Empilhem as barricadas aqui."
13110-297 = "Escavadeiras, tratores, retroescavadeiras...#nTragam tudo o que puderem mobilizar."
13110-307 = "...Se não chegarem até o meio-dia de amanhã, o Canhão Ferroviário será nosso."
13110-308 = "Hohoho... É melhor darem o máximo de si."
13110-310 = "Quê?!"
13110-311 = "...Entendi."
13110-312 = "Hmm..."
13110-313 = "Contra uma força desse tamanho, nós..."
13110-315 = "S-Se o Sensei estiver com a gente, não dá pra dar um jeito?"
13110-316 = "Com que justificativa o Sensei da \"Schale\"#ninterviria em uma transação privada?"
13110-320 = "Eles que estão errados por tentarem atrapalhar,#nqual o problema de pedir ajuda ao Sensei?!"
13110-322 = "...Serika-chan, pensa bem."
13110-324 = "Como assim?"
13110-325 = "A assembleia vai acontecer no Antigo Edifício da Estação Central.#nAli é o ponto central onde várias linhas da Ferrovia Transdesértica se cruzam."
13110-326 = "Como os direitos da ferrovia já pertencem ao Fundo Privado..."
13110-327 = "Eles estão apenas protegendo uma propriedade que lhes pertence."
13110-328 = "U-Uma desculpa dessas cola?!"
13110-334 = "Aliás, quem vai comparecer à assembleia — são vocês do Comitê de Contramedidas?"
13110-336 = "...?"
13110-337 = "Vamos todas juntas."
13110-342 = "Me expressei mal."
13110-343 = "Estou perguntando se vocês vão comparecer como \"Conselho Estudantil de Abydos\",#nou como \"Comitê de Contramedidas\"."
13110-344 = "I-Isso..."
13110-345 = "No contrato assinado por Yume Kuchinashi, o titular consta como Conselho Estudantil de Abydos.#nPorém, hoje em dia isso só existe no papel, não é?"
13110-346 = "Sendo assim, não deveriam primeiro esclarecer a posição do Conselho Estudantil?"
13110-347 = "Bem, se nem conseguirem chegar ao local da assembleia,#nessa discussão toda não vai servir para nada."
13110-348 = "..."
13110-350 = "...Vamos abrir caminho à força."
13110-351 = "Mas é justamente por isso ser difícil que estamos com problemas, né?"
13110-353 = "Precisamos encontrar alguma outra saída..."
13110-355 = "...Existe um meio, senhorita."
13110-363 = "E é um método muito mais simples do que enfrentá-los de frente.#nBasta que a senhorita se matricule na Highlander e assuma como presidente do Conselho Estudantil."
13110-364 = "...Como é?!"
13110-370 = "Se exercer sua autoridade como executiva da \"Nephthys\", poderá cancelar este contrato."
13110-371 = "Nephthys, Highlander e Fundo Privado... Se duas das três forças se opuserem, o Fundo Privado não poderá fazer nada."
13110-372 = "...M-Mas..."
13110-373 = "Se eu fizer isso, terei que deixar Abydos..."
13110-375 = "Rejeitado~."
13110-376 = "Que absurdo você está falando?!#nA Nonomi-senpai não tem que se sacrificar!"
13110-381 = "...Sr. Mordomo.#nEu recuso essa proposta."
13110-382 = "Eu não quero deixar Abydos!"
13110-383 = "...Imaginei que a senhorita diria isso."
13110-384 = "Nesse caso, proponho uma terceira opção.#nEmbora seja provável que seja impossível."
13110-388 = "...Uma terceira opção?"
13110-389 = "É um tanto radical, mas..."
13110-390 = "Não importa, pode falar!"
13110-394 = "Pois bem, o método consiste em..."
13110-395 = "...Anular o próprio contrato de compra e venda da Ferrovia Transdesértica."
13110-396 = "...?"
13110-397 = "E se o \"Conselho Estudantil de Abydos\" que firmou o contrato não tivesse autoridade legítima de Conselho Estudantil...?"
13110-398 = "...?!"
13110-404 = "Basta declarar que o \"Conselho Estudantil de Abydos\", composto por apenas duas integrantes — Yume Kuchinashi e Hoshino Takanashi —, era uma organização não reconhecida."
13110-405 = "O-O que você está dizendo...?"
13110-406 = "Ouvi dizer que a presidente anterior empurrou o cargo para Yume Kuchinashi por meio de uma votação por mãos levantadas, certo?#nOu seja, não é impossível contestar a legitimidade daquela gestão."
13110-407 = "Basta comparecer à assembleia e expor esse fato."
13110-408 = "Assim, o contrato deixará de existir desde a origem..."
13110-409 = "Os direitos da Ferrovia Transdesértica ficarão com nós da Nephthys,#ne o Fundo Privado não poderá interferir."
13110-410 = "Que absurdo você está falando?!#nUm método desses...!"
13110-411 = "...Por isso eu disse que seria impossível."
13110-412 = "..."
13110-413 = "...De todo modo, revelei o segredo da Ferrovia Transdesértica,#nmas parece que não há uma solução fácil à vista."
13110-417 = "— O prazo é amanhã ao meio-dia."
13110-418 = "Da minha parte, entrarei em contato caso pense em alguma boa solução."
13110-419 = "Espero revê-las na assembleia de amanhã."
13110-420 = "Com licença."
13110-429 = "Hmm."
13110-430 = "Nn."
13110-435 = "..."
13110-440 = "Pessoal, chega de ficar aérea, vamos começar a reunião."
13110-441 = "Hoshino-senpai..."
13110-442 = "O velhote aqui tá bem, Nonomi-chan."
13110-443 = "Mais importante, precisamos pensar numa solução."
13110-445 = "Sim, se pensarmos juntas, vamos dar um jeito."
13110-447 = "Sim..."
13110-448 = "Haha~ A Shiroko-chan é sempre tão otimista, gosto disso."
13110-450 = "...Nn."
13110-452 = "Por que você tá ficando sem graça, Shiroko-senpai?"
13110-453 = "Ahaha..."
13110-457 = "Vocês devem estar cansadas, então vamos descansar um pouco antes."
13110-459 = "Próximo;O Início do Comitê de Contramedidas"
