[translation]
13110-1 = "Эпизод 11;Тайна раскрыта"
13110-8 = "Присаживайтесь, пожалуйста."
13110-9 = "Благодарю. Значит... это и есть Комитет по выплате долга. Подумать только, я окажусь здесь при таких обстоятельствах..."
13110-10 = ""
13110-12 = ""
13110-13 = ""
13110-14 = "Как я говорил вчера, надзиратель Суо работает на Нефтис и является нашим союзником. В конце концов, именно она меня сюда сопровождала."
13110-15 = "...Пока не буду вмешиваться в разговор."
13110-16 = ""
13110-18 = ""
13110-19 = "Сколько прошло? Уже два года? Как вы поживали, госпожа?"
13110-20 = "Очень хорошо. Спасибо."
13110-21 = "Как у вас с финансами? Если хотите заменить нынешнюю карту, я могу выдать новую с более высоким лимитом."
13110-22 = "Нет, не стоит беспокоиться. Я вообще почти ей не пользуюсь. Но всё равно спасибо."
13110-23 = "Понятно... Итак, вы думали о возвращении?"
13110-24 = "Ч-Что? Возвращении...?"
13110-25 = "Да. Мы можем повторно зачислить вас в Хайлендер в любой момент, буквально по первому желанию."
13110-26 = "О. Эм..."
13110-28 = "Эй. Ты явно ставишь её в неловкое положение."
13110-29 = "Ага. Переходи к делу."
13110-31 = "А? Д-Да, ну..."
13110-32 = "Я не согласна. Этот вопрос вполне уместен."
13110-33 = "В конце концов, на момент ухода Нономи Хайлендер и Нефтис готовились заключить отраслево-академический союз. Её решение остаться в Абидосе едва всё не разрушило."
13110-35 = "..."
13110-36 = "Именно нам пришлось принять упрямство Нономи и понести основной ущерб от этой потери. Разве не грубо с вашей стороны так с нами обращаться?"
13110-37 = ""
13110-39 = ""
13110-40 = ""
13110-41 = ""
13110-42 = "Широко, держи себя в руках! Нам нельзя создавать новые проблемы, хорошо?!"
13110-43 = "Д-Да. Я и не собиралась..."
13110-45 = "Неважно. Если хочешь, я готова сразиться с тобой в любой момент. Выходи."
13110-46 = "Пожалуйста... сдерживайся, Суо."
13110-47 = "...Хмф."
13110-48 = ""
13110-50 = ""
13110-51 = "Прошу прощения, госпожа. Клянусь, я пришёл сюда не затем, чтобы заставлять вас вернуться."
13110-53 = "Да, думаю, лучше перейти к причине этого визита."
13110-54 = "Да... точно. Скрытая тайна Транс-пустынной железной дороги."
13110-56 = "..."
13110-57 = "..."
13110-58 = ""
13110-60 = ""
13110-62 = "Если сразу к сути, Транс-пустынная железная дорога..."
13110-63 = "...была прикрытием для проекта по созданию оружия асимметричного превосходства, которым руководил студсовет Абидоса, а тайно реализовывала Saint Нефтис."
13110-64 = ""
13110-67 = ""
13110-69 = "...Что?!"
13110-70 = "Студсовет...?"
13110-72 = "Оружие асимметричного превосходства?"
13110-73 = "Вы говорите о... оружии?"
13110-75 = "Да, верно. Название этого оружия..."
13110-76 = "...Железнодорожная пушка «Схемата»."
13110-77 = ""
13110-79 = ""
13110-82 = "«Схемата» задумывалась как гигантская пушка... точнее, оружейная крепость. По калибру, массе, дальности и разрушительной силе она должна была превзойти любые существующие стандарты."
13110-83 = "Транс-пустынная железная дорога, протянувшаяся паутиной по огромному району Абидоса, предназначалась не для грузовых или пассажирских поездов, а..."
13110-84 = "...для стратегической взрывной крепости массой более тонны, оснащённой сверхдальнобойной пушкой, способной стрелять 1200-миллиметровыми фугасными снарядами на расстояние до 500 километров. Можете представить?"
13110-85 = "Проект с самого начала строился на столь грандиозной и безумной идее."
13110-86 = "Его завершение дало бы возможность оказывать немыслимое давление на все соседние районы. Асимметричное превосходство."
13110-89 = "Оружие..."
13110-90 = ""
13110-92 = ""
13110-94 = "Пожалуйста, подождите! З-Зачем студсовету Абидоса вообще понадобилось строить нечто подобное?"
13110-95 = "Разве это не очевидно?"
13110-96 = "Это был привлекательный инструмент, призванный решить долговую проблему Абидоса."
13110-97 = "И-Инструмент...?"
13110-98 = "Как я и сказал. С таким мощным оружием у Абидоса появилось бы бесчисленное количество способов получать прибыль. Возможно, не самых законных, но для Кивотоса это далеко не редкость."
13110-100 = "Э-Это..."
13110-101 = "«Схемата»... Разве это не имя ТОЙ председательницы студсовета?"
13110-103 = "Верно. Железнорукая правительница Схемата."
13110-105 = "А? Кто это?"
13110-106 = "Легендарная председательница студсовета, получившая это прозвище после того, как положила конец хаотичному правлению семидесяти соперничающих председателей и привела Абидос к золотому веку."
13110-107 = "Что? Семидесяти?!"
13110-109 = "Я сама не из Абидоса, но кое-что из его истории знаю."
13110-110 = "Когда-то Абидос был богатейшим и сильнейшим районом Кивотоса. Говорят, остальные районы одновременно боялись его и восхищались им."
13110-111 = "Любопытно, что название выбрали намеренно, не так ли? Оно ясно показывало их намерения."
13110-112 = "Верно. В этом городе нет лучшего способа заработать деньги, чем мощное оружие."
13110-114 = "Хошино..."
13110-115 = "Вы хотите сказать... Транс-пустынная железная дорога на самом деле была обманной схемой Нефтис, прикрывавшей производство этого оружия?"
13110-116 = ""
13110-119 = ""
13110-120 = "Н-Нет, вовсе нет! Я не был руководителем и могу не знать всех деталей, но могу уверенно сказать: изначальной целью действительно было строительство Транс-пустынной железной дороги. План Железнодорожной пушки появился позже."
13110-121 = "Кто-то предложил студсовету пушку как попытку спасти проблемный и убыточный проект."
13110-122 = "Что? Кто? Кто мог предложить такое...?"
13110-123 = "Боюсь, этого я не знаю. Проект вёлся в строжайшей тайне."
13110-125 = "Можете успокоиться, госпожа. Из проекта ничего не вышло."
13110-126 = "Как она и сказала! В итоге нас обманули. Развели... Мы были вынуждены заключить, что сама идея была не более чем безумной аферой."
13110-127 = "Размеры «Схематы» намного превосходили любое существующее оружие. Логически такая махина просто не могла работать!"
13110-128 = "И это в итоге стало её главным ограничением. Несмотря на уверенность конструктора, им так и не удалось запустить двигатель Железнодорожной пушки. Обманули и нас, и студсовет Абидоса."
13110-129 = "Так проект остановили. Железнодорожную пушку бросили где-то в Пустыне Абидос."
13110-130 = "...Так было до недавнего времени."
13110-131 = ""
13110-134 = ""
13110-136 = "Теперь, благодаря новым алгоритмам и результатам моделирования, мы считаем, что сможем успешно довести Железнодорожную пушку до рабочего состояния."
13110-137 = "Не знаю, создавал ли первоначальный инженер проект с расчётом на будущие возможности или всё вышло случайно, но..."
13110-139 = "...это настоящая сокровищница инновационных технологий, опередивших своё время. Мобильное стратегическое оружие, одно существование которого могло бы сдерживать другие районы."
13110-140 = "По сути, Железнодорожную пушку можно считать золотой жилой."
13110-141 = "Как вы прекрасно знаете, теперь множество людей спешат урвать свой кусок, пока весь мир ещё не узнал об этой золотой жиле."
13110-142 = "Именно поэтому фонд прямых инвестиций так одержим получением прав на эксплуатацию вспомогательных объектов Транс-пустынной железной дороги."
13110-145 = ""
13110-146 = "Железнодорожная пушка считается вспомогательным объектом Транс-пустынной железной дороги... Получив права, включённые в облигации, вы получаете и право эксплуатации пушки."
13110-147 = "Их намерения и мотивы различаются, но все фракции фонда прямых инвестиций хотят заработать на Железнодорожной пушке."
13110-148 = ""
13110-150 = "Они обратились к Нефтис, которая давно забыла о брошенном проекте, и предложили инвестиции."
13110-151 = "Для нас Транс-пустынная железная дорога — поучительный урок и исторический артефакт, который мы надеялись хоть как-то сохранить. Поэтому мы приняли их предложение."
13110-154 = "..."
13110-155 = "К тому времени, когда мы узнали истинную природу проекта, было уже слишком поздно выходить из фонда прямых инвестиций."
13110-156 = "Но мы также не могли просто позволить Железнодорожной пушке попасть в жадные руки остальных участников."
13110-157 = "Хотя бы здесь вы правы. Если такое оружие окажется у плохих людей, Абидос попадёт прямо в центр огромного конфликта."
13110-159 = "А нельзя просто разнести её к чёрту?"
13110-160 = "Ты знаешь, где находится Железнодорожная пушка, Дворецкий?"
13110-162 = "Нет... Ни мы, ни фонд прямых инвестиций не знаем, где она."
13110-163 = "Начнём с того, что проект был строго засекречен. Никому не было бы выгодно раскрывать детали, поэтому связанные документы, вероятно, уничтожили."
13110-164 = ""
13110-167 = ""
13110-168 = "Вот как..."
13110-169 = "Если подумать, фонд прямых инвестиций и к нам обращался насчёт местоположения пушки."
13110-170 = "Вопрос времени, когда они её найдут. Как только Хайлендер возобновит строительство Транс-пустынной железной дороги, думаю, они довольно быстро обнаружат местоположение Железнодорожной пушки."
13110-171 = "Сами студенты Хайлендер не знают о существовании пушки, но их бешеная любовь к поездам и первоклассные навыки быстро решат задачу."
13110-172 = "Кроме того, фонд прямых инвестиций попытался получить пушку через законный договор. Если мы её уничтожим, компенсация за ущерб будет астрономической."
13110-173 = "Законный договор...?"
13110-174 = "Да, они очень зациклены на юридической стороне, вероятно потому, что определить владельца Железнодорожной пушки было непросто."
13110-175 = "Основная сторона — студсовет Абидоса, исполнитель — Нефтис, а проектировала её вообще третья сторона... И при этом права завязаны на облигации."
13110-176 = "С деловой точки зрения они действуют правильно. Они пытаются закрыть все юридические вопросы сейчас, чтобы избежать проблем в будущем."
13110-177 = "Кайзер не знает о существовании Железнодорожной пушки? Почему они без раздумий продали облигации?"
13110-178 = "Даже если знают, сомневаюсь, что им интересна эта пушка. Президент Кайзер сейчас, похоже, сосредоточен на Башне Санктум."
13110-179 = "К тому же прибыль Кайзер от продажи облигаций была практически фантастической. В сравнении с ней им, вероятно, плевать на неподтверждённый слух."
13110-180 = ""
13110-182 = ""
13110-183 = "...Но затем произошло нечто неожиданное."
13110-187 = "Некоторые студенты Хайлендер обнаружили договор, подписанный предыдущим председателем студсовета Абидоса."
13110-189 = "Не знаю, как и почему этот договор вообще появился, но теперь, когда о нём стало известно, фонд прямых инвестиций понял, что права на Железнодорожную пушку к ним не перейдут."
13110-190 = "Постой. Ты что-нибудь знаешь об этом договоре?"
13110-191 = "Почему Юмэ— Почему председатель студсовета пошла на этот договор? Что тогда происходило?"
13110-193 = "...Хошино."
13110-194 = ""
13110-196 = ""
13110-198 = "Прошу прощения. Как я уже сказал, мы сами не знали о существовании договора, пока студенты Хайлендер случайно на него не наткнулись. Мы тоже не понимаем ни как, ни почему."
13110-199 = "..."
13110-200 = "В то время Нефтис была на грани банкротства. Мы были заняты распродажей активов по любой цене."
13110-201 = "Права на Транс-пустынную железную дорогу мы считали бесполезными и продали их студсовету."
13110-202 = "..."
13110-203 = "Как бы то ни было, фонд прямых инвестиций хочет как можно скорее закрыть вопрос с этим договором. Для них важно, чтобы весь процесс выглядел законным с юридической точки зрения."
13110-204 = "Именно поэтому они спешат провести общее собрание кредиторов, чтобы официально аннулировать договор."
13110-205 = ""
13110-208 = ""
13110-209 = "Завтрашнее собрание... В полдень, в районном офисе Центральной станции Абидоса."
13110-210 = "Верно. Они обратились к студсовету Абидоса, должнику фонда, чтобы официально уведомить о необходимости присутствовать."
13110-211 = "Если представители студсовета явятся и откажутся от договора либо вообще не придут, договор станет недействительным, а права вернутся к Нефтис как первоначальному владельцу."
13110-212 = ""
13110-214 = ""
13110-215 = "Что?! Но разве это не значит...?!"
13110-216 = "...К сожалению, нет. Формально права вернутся Нефтис, но Нефтис теперь состоит в фонде прямых инвестиций."
13110-217 = "Как и облигации, купленные от имени Нефтис, права будут принадлежать фонду. Мы не сможем ими распоряжаться."
13110-218 = ""
13110-220 = ""
13110-222 = "...Тогда остаётся только один вариант."
13110-223 = ""
13110-226 = ""
13110-227 = ""
13110-228 = "Я пойду на общее собрание кредиторов и заявлю, что мы намерены исполнить договор."
13110-229 = "...Это логичный вывод. Тогда права на Железнодорожную пушку останутся у студсовета Абидоса."
13110-230 = "Верно. Придётся найти способ выплачивать деньги, но хотя бы фонд прямых инвестиций не получит пушку."
13110-231 = "Это даст нам время найти Железнодорожную пушку в пустыне и уничтожить её."
13110-233 = "Ну всё тогда, да? Проблема решена?"
13110-234 = "Технически да, но..."
13110-236 = "Нет, этот план будет трудно осуществить, Таканаши Хошино."
13110-237 = ""
13110-239 = ""
13110-241 = "Фонд прямых инвестиций прекрасно всё это понимает. Они сделают всё возможное, чтобы не позволить тебе попасть на собрание и заверить договор."
13110-242 = "Что? Остановить её? Как...?"
13110-243 = "Просто. Они собираются блокировать районный офис Центральной станции Абидоса. Сотни наёмников встанут между тобой и собранием."
13110-244 = "Что?!"
13110-245 = ""
13110-248 = ""
13110-249 = "Наёмники фонда, вероятно, уже начали ставить блокпосты. Районный офис будут защищать бронемашины, вертолёты, зенитные орудия и баррикады."
13110-251 = "Районный офис Центральной станции — восточная сторона"
13110-254 = ""
13110-256 = "...Хорошо. Дополнительные отряды разместите вон там."
13110-258 = "Выдвигаемся! Пора за работу!"
13110-259 = ""
13110-261 = ""
13110-262 = ""
13110-264 = "Подъездная дорога к районному офису Центральной станции — запад"
13110-268 = ""
13110-270 = "Отлично. Вертолёты прибыли."
13110-271 = "Пусть бронемашины займут назначенные позиции, а охрана рынка усилит зоны блокады."
13110-272 = ""
13110-274 = ""
13110-276 = "Открытая площадка к югу от районного офиса Центральной станции"
13110-278 = "Хорошо. Все поняли план?"
13110-280 = "Разумеется. Мы выполним работу, за которую нам заплатили."
13110-281 = ""
13110-283 = ""
13110-285 = ""
13110-286 = "Железнодорожная пушка — часть наследия тирана-императора Геенны. Нет причин оставлять её ржаветь в этой пустыне."
13110-288 = "Подъездная дорога к районному офису Центральной станции — север"
13110-293 = "О-о! Вот здесь! Усильте баррикаду тут. Чем толще, тем лучше!"
13110-294 = ""
13110-297 = "Тащите всё, что есть: экскаватор, бульдозер, погрузчик — вообще всё!"
13110-298 = ""
13110-301 = ""
13110-302 = ""
13110-303 = ""
13110-304 = ""
13110-307 = "Хи-хи-хи... Если она не появится к полудню завтра, Железнодорожная пушка наша."
13110-308 = "Ну попробуй попасть на это собрание... Хи-хи..."
13110-310 = "Серьёзно?! Они настолько далеко зайдут?"
13110-311 = "Хм... сотни, говоришь?"
13110-312 = "Хм..."
13110-313 = "Против такого количества... Что могут сделать всего пятеро из нас...?"
13110-315 = "Н-Ну, а Сенсей? Может, если Сенсей будет с нами..."
13110-316 = "Нет. У Шале нет оснований вмешиваться в частные деловые сделки."
13110-317 = ""
13110-319 = ""
13110-320 = "Что? Почему?! Эти уроды из фонда как раз и ведут себя нечестно и мутят с договором!"
13110-322 = "Нет, Сэрика. Это никак не доказать."
13110-324 = "О чём ты?"
13110-325 = "Почему, думаешь, они проводят собрание именно в районном офисе Центральной станции? В этой точке пересекаются десятки линий Транс-пустынной железной дороги."
13110-326 = "А! Понимаю. Помимо вспомогательных объектов, фонд владеет всеми правами на Транс-пустынную железную дорогу."
13110-327 = "Ага. Официально они просто скажут, что защищают свою собственность от нарушителей."
13110-328 = "Э-Это так нечестно!"
13110-329 = ""
13110-331 = ""
13110-333 = ""
13110-334 = "...Но кто именно пойдёт на собрание? Только Таканаши Хошино? Или вы все?"
13110-336 = "А? Ну, очевидно..."
13110-337 = "...все пятеро."
13110-338 = ""
13110-340 = ""
13110-342 = "Я неправильно сформулировала вопрос."
13110-343 = "Точнее: на собрание пойдёт студсовет Абидоса или Комитет по выплате долга?"
13110-344 = "Простите? Э-Это..."
13110-345 = "Председатель Юмэ составила договор, указав основной стороной именно студсовет Абидоса. Только студсовет Абидоса."
13110-346 = "Официальным студсоветом школы может быть признана только одна из этих двух организаций. Другую придётся закрыть."
13110-347 = "Ну, это имеет значение только если вы вообще сумеете прорваться внутрь."
13110-348 = "..."
13110-350 = "Пока нужно сосредоточиться на том, как пройти через их оборону."
13110-351 = "Ты говоришь так, будто это прогулка в парке, Широко!"
13110-353 = "Она права. Это невозможно. Нужно искать другой путь."
13110-355 = "...Есть ещё один путь, госпожа."
13110-356 = ""
13110-358 = ""
13110-360 = ""
13110-361 = ""
13110-363 = "Он простой. Прямолинейный. Повторно поступите в академию Хайлендер и станьте председателем студсовета."
13110-364 = "Прошу прощения...?"
13110-365 = ""
13110-368 = ""
13110-370 = "Я назначу вас председателем студсовета Хайлендер. Вы станете сотрудником Нефтис и получите полномочия аннулировать этот договор."
13110-371 = "Будучи одновременно сотрудником Нефтис и председателем студсовета Хайлендер, вы получите влияние на обе фракции фонда прямых инвестиций. Это должно быть в ваших силах."
13110-372 = "Э-Это... сработало бы..."
13110-373 = "Мне пришлось бы уйти из Абидоса... но ещё..."
13110-375 = "Отказ."
13110-376 = "Именно! Я даже слушать такой бред не хочу! С чего бы нам соглашаться, чтобы Нономи ушла от нас?!"
13110-377 = ""
13110-380 = ""
13110-381 = "Согласна. Я не могу принять этот план. Я не уйду из Абидоса!"
13110-382 = "Я даже рассматривать это как решение не стану!"
13110-383 = "Такого ответа и следовало ожидать. Пробить это ваше... упрямство довольно трудно."
13110-384 = "Есть и третий вариант, но... судя по вашему настрою, он тоже вряд ли возможен..."
13110-385 = ""
13110-387 = ""
13110-388 = "Третий...? Какой?"
13110-389 = "Должна предупредить: он весьма радикальный..."
13110-390 = "Мне всё равно, насколько! Пожалуйста, скажите."
13110-391 = ""
13110-393 = ""
13110-394 = "Как пожелаете. Третий вариант..."
13110-395 = "...аннулировать первоначальный договор купли-продажи Транс-пустынной железной дороги."
13110-396 = "...?"
13110-397 = "Вам придётся заявить, что студсовет Абидоса, основная сторона договора, был фиктивной организацией, не имевшей права действовать как студсовет."
13110-398 = "Что?!"
13110-399 = ""
13110-402 = ""
13110-404 = "Иными словами, нам придётся официально признать, что студсовет Абидоса в составе Кучинаши Юмэ и Таканаши Хошино был самозванной организацией, а не законным студсоветом."
13110-405 = "К-Как это вообще решение...?"
13110-406 = "Насколько я понимаю, председателя студсовета выбрали простым поднятием рук предыдущими членами. Отрицать легитимность такой неофициальной процедуры было бы не так уж трудно."
13110-407 = "Таканаши Хошино, как участнице того студсовета, достаточно явиться на собрание и признать этот факт. Если мы, другая сторона договора, примем признание, сам договор будет аннулирован."
13110-408 = "Это эффективнее простой отмены или приостановки: юридически будет считаться, будто договора никогда не существовало."
13110-409 = "Тогда Нефтис получит 100% прав на Железнодорожную пушку независимо от нашего участия в фонде прямых инвестиций."
13110-410 = "Что вы вообще предлагаете? Чтобы мы использовали такой метод...?!"
13110-411 = "Я предупреждала, что, скорее всего, это невозможно."
13110-412 = "..."
13110-413 = "Вот и всё. Я раскрыла вам великий секрет Транс-пустынной железной дороги, но похоже, решения текущей проблемы у вас нет..."
13110-414 = ""
13110-416 = ""
13110-417 = "У вас время до полудня завтра. После этого фонд прямых инвестиций получит то, чего хочет: Железнодорожную пушку."
13110-418 = "Мы со своей стороны сделаем всё возможное, но свяжитесь со мной, если определитесь с планом."
13110-419 = "Увидимся завтра на общем собрании кредиторов. И, пожалуйста, проследите, чтобы фонд не узнал о нашем разговоре."
13110-420 = "До свидания."
13110-421 = ""
13110-423 = ""
13110-429 = "*вздыхает*"
13110-430 = "Хм..."
13110-431 = ""
13110-433 = ""
13110-435 = "..."
13110-436 = ""
13110-439 = ""
13110-440 = "Ну-ну. Сейчас не время сидеть сложа руки. Давайте проведём своё собрание."
13110-441 = "Хошино..."
13110-442 = "С этой старушкой всё будет нормально, Нономи. Время идёт, помнишь?"
13110-443 = "Срок — до полудня завтра, значит, за эту ночь надо что-нибудь придумать. Нужно собраться с мыслями и сосредоточиться. Верно?"
13110-445 = "Да. Как сказала Хошино. Мы что-нибудь придумаем."
13110-447 = "Хорошо..."
13110-448 = "Вот это наша Широко! Всегда позитивная. Все, берите с неё пример!"
13110-450 = "Хм..."
13110-452 = "Ты чего вдруг?"
13110-453 = "Ха-ха. Просто от всех этих сложных дел слишком много напряжения."
13110-454 = ""
13110-456 = ""
13110-457 = "Может, сделаем перерыв, а потом снова соберёмся?"
13110-459 = "Следующий эпизод;Начало Комитета по выплате долга"
