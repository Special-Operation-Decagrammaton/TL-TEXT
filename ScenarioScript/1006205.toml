[translation]
1006205-1 = "Об увлечениях"
1006205-2 = "Исполнительный офис Шале"
1006205-3 = "Мы с Токи приступили к сегодняшней работе в Шале."
1006205-4 = ""
1006205-9 = "[ns] «Токи.»"
1006205-10 = "Что такое, Сенсей?"
1006205-11 = "[s] «Ты, похоже, привыкла к такой работе.»"
1006205-12 = "Возможно. Хотя я не совсем понимаю, что вы подразумеваете под «такой работой»."
1006205-13 = "[s] «Ну, то, чем мы сейчас занимаемся — сортировка файлов и материалов, всё такое.»"
1006205-14 = "А, понятно. Возможно, мне несколько бестактно это упоминать, но подобные задачи часто входили в обязанности, которые поручал мне человек, которому я раньше служила."
1006205-15 = "Разумеется, я также прекрасно умею готовить, убирать и выполнять любую другую домашнюю работу, которая вам понадобится."
1006205-16 = "[s1] «Мне кажется, ты и так делаешь более чем достаточно...»\n[s2] «Тебе никогда не кажется, что ты слишком много работаешь?»"
1006205-19 = "Хм. Вы имеете в виду мою работу в Шале?"
1006205-20 = "Не уверена, что соглашусь. Иногда работы так мало, что мне становится даже неловко."
1006205-21 = "Я превосходная горничная. Если хотите, можете поручать мне больше обязанностей."
1006205-22 = "Например, сейчас я вас сопровождаю, но также умею отражать атаки врагов, подавлять беспорядки, обезвреживать взрывчатку, выслеживать, уничтожать, перехватывать, разрушать и ликвидировать. Обращайтесь, если понадобятся подобные услуги."
1006205-23 = "[s] «Но всё это вообще не имеет отношения к работе горничной?!»"
1006205-24 = "Возможно. И всё же умение делать больше, чем от тебя ожидают, — одно из качеств превосходной горничной."
1006205-25 = "[s] «П-правда?»"
1006205-26 = "Правда. Как идеальной горничной, мне можно доверять в вопросах достоверной информации."
1006205-27 = "[s3] «В таком случае... чем ты занимаешься по выходным?»\n[s4] «Я хочу услышать о твоих увлечениях!»"
1006205-30 = "...Хобби? Свободное время?"
1006205-31 = "Простите, я не совсем понимаю, о чём вы. Пожалуйста, объясните мне эту концепцию."
1006205-32 = "То, чем занимаются, когда есть свободное время? Вы испытываете меня, задавая такие сложные вопросы?"
1006205-33 = "Обычно я работала и по выходным. Свободное от обязанностей время у меня бывало крайне редко."
1006205-34 = "[s5] «К-как... Как такое возможно?»\n[s6] «Нельзя вот так растрачивать школьные годы!»"
1006205-37 = "С-Сенсей?"
1006205-38 = "Что значит «вы не можете оставить всё как есть»? О, мы прямо сейчас куда-то идём? Сенсей? Я ведь уже говорила, нельзя просто хватать меня за руку и тащить—"
1006205-39 = ""
1006205-41 = ""
1006205-43 = "Центр Кивотоса"
1006205-44 = "[ns] «Ну как тебе фильм?»"
1006205-45 = "Я вообще его не поняла."
1006205-46 = "Почему персонажи начали стрелять посреди погони? И вообще, зачем было доводить ситуацию до перестрелки?"
1006205-47 = "Если бы они с самого начала действовали разумнее, а не вели себя настолько подозрительно, всё закончилось бы без пострадавших."
1006205-48 = "[s] «Но в этом же... весь смысл сценария...»"
1006205-49 = "Я заметила и множество других недостатков. Например..."
1006205-51 = "После этого Токи больше получаса перечисляла многочисленные несостыковки фильма."
1006205-53 = "...На этом мой доклад окончен."
1006205-54 = "[s] «...Хорошая работа.»"
1006205-55 = "Ничего особенного."
1006205-56 = "О? Понятно. Вы говорите, что обычно фильм просто смотрят ради удовольствия и не тратят столько времени на придирки."
1006205-57 = "Похоже, мне всё ещё нужно тренироваться в искусстве просмотра фильмов. В будущем я постараюсь лучше."
1006205-59 = "Торговая улица"
1006205-60 = "[ns] «В этот раз попробуем мангу...»"
1006205-61 = "Я слышала выражение «лучше один раз увидеть, чем тысячу раз услышать», но не уверена, что с ним согласна."
1006205-62 = "У меня есть сомнение. Если говорить о плотности информации и эффективности, действительно ли этот метод лучший?"
1006205-63 = "Что бы ни говорили, мне кажется, содержание этого изображения можно было бы куда плотнее передать письменно, потратив меньше чернил и бумаги. А с точки зрения эффективной передачи информации видео, по-моему, превосходит его."
1006205-64 = "Так... какой смысл именно в формате рисунков? Помимо уже перечисленных проблем, на их создание уходит столько времени и сил."
1006205-65 = "Наверняка причина есть, но я её не вижу."
1006205-67 = ""
1006205-68 = ""
1006205-69 = "Покупки — действительно сложный ритуал."
1006205-70 = "Вы осознанно и намеренно решаете купить столько ненужных вещей."
1006205-71 = "Не уверена, что понимаю. У всех действий должен быть смысл, разве нет?"
1006205-72 = "Но в покупках его будто бы нет."
1006205-73 = "[ns] «Значит, тебе всё-таки не понравилось...»"
1006205-75 = "Я продолжил пробовать вместе с Токи разные увлечения."
1006205-76 = "Токи проявила интерес ровно к... ни одному из них."
1006205-78 = "Центр Кивотоса"
1006205-79 = "[ns] «Отличная работа... Токи...»"
1006205-80 = "Я не сделала ничего сложного или достойного похвалы."
1006205-81 = "Вообще-то, мне кажется, сегодня большую часть работы сделали именно вы."
1006205-82 = "..."
1006205-83 = "Эм, Сенсей?"
1006205-84 = "[s] «Хм?»"
1006205-85 = "Я всё ещё не понимаю... что именно считается хобби."
1006205-86 = "Это технический навык, который нужно освоить, вроде навыка сопровождения?"
1006205-87 = "Это занятие, в котором нужно добиться успеха и понимания, или что-то подобное?"
1006205-88 = "Токи смотрела на меня с необычным для неё тревожным выражением."
1006205-89 = "Я тщательно подбирал слова."
1006205-90 = "[s] «Хобби — это...»"
1006205-91 = "Да?"
1006205-92 = "[s7] «Неважно, хорошо у тебя получается или плохо.»\n[s8] «Важно лишь то, что тебе нравится этим заниматься.»"
1006205-95 = "Что-то, что мне нравится... Что-то, что я делаю просто потому, что хочу."
1006205-96 = "[s9] «Не нужно торопиться с поисками.»\n[s10] «Когда найдёшь идеальное увлечение, сама поймёшь.»\n[s11] «Хобби иметь необязательно, но иногда это приятно.»"
1006205-100 = "..."
1006205-101 = "Значит, моим хобби может быть..."
1006205-102 = "...Хи-хи."
1006205-103 = "[s] «Что? Ты уже что-то придумала?»"
1006205-104 = "Ничего! Забудьте."
1006205-105 = ""
1006205-107 = ""
1006205-108 = "Итак, Сенсей."
1006205-109 = "Вернёмся?"
1006205-110 = "Я провожу вас обратно в Шале."
1006205-111 = "[s] «Кажется, ты мне чего-то недоговариваешь...»"
1006205-112 = "Хм, интересно. Что же это может быть?"
1006205-113 = ""
1006205-115 = ""
1006205-118 = "[ns] «Правда не скажешь?»"
1006205-119 = "Как я могу сказать, если сама толком не знаю?"
1006205-120 = "[ns] «Ловко ушла от ответа.»"
1006205-122 = "Мы с Токи болтали по дороге обратно в Шале."
