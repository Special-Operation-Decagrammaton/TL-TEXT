[translation]
2300005-1 = "Беспокойство Айри"
2300005-2 = "Кампус Тринити"
2300005-3 = "Здравствуйте, Сенсей!"
2300005-4 = "Хорошо проводите день?"
2300005-5 = "[s] «Ага. А ты?»"
2300005-6 = "Теперь, когда я с вами, день прекрасный, Сенсей."
2300005-7 = "У вас случайно нет свободной минутки?"
2300005-8 = "Я хотела кое о чём спросить."
2300005-9 = "Эм... Ну..."
2300005-10 = "Ничего серьёзного, просто..."
2300005-11 = "...иногда мне трудно ясно выражать свои мысли, когда я разговариваю с друзьями."
2300005-12 = "Я обычно просто вскользь прохожусь по теме и переключаюсь дальше."
2300005-13 = "Думаю..."
2300005-14 = "Эм, наверное, дело просто в моём характере. Может, я слишком застенчивая..."
2300005-15 = "Это ведь плохо, да? Я думала, что должна над этим поработать..."
2300005-16 = "А вдруг я только раздражаю людей...?"
2300005-17 = "[s] «...»"
2300005-18 = "Сенсей?"
2300005-19 = "[s1] Тема серьёзная, поэтому ответить серьёзно.\n[s2] Студенту нужен совет, поэтому ответить серьёзно."
2300005-20 = "А? Сенсей?"
2300005-21 = "А? Сенсей?"
2300005-22 = "Хм. Теперь я чувствую себя немного иначе..."
2300005-23 = "Может, нам помедитировать или что-нибудь такое?"
2300005-24 = "[s3] «Я мог бы вечно слушать твои рассказы о десертах.»\n[s4] «Твои глаза сияют, когда ты говоришь о сладостях.»"
2300005-25 = "П-правда?"
2300005-26 = "П-правда?"
2300005-27 = "[s5] «Тебе так много есть что сказать о десертах.»\n[s6] «Никогда ты не бываешь смелее и воодушевлённее, чем в такие моменты.»"
2300005-28 = "А? Н-наверное, это правда..."
2300005-29 = "А? Н-наверное, это правда..."
2300005-30 = "...Хм."
2300005-31 = "Кажется, я понимаю, к чему вы клоните."
2300005-32 = "Например, когда мы с друзьями обсуждаем, в каких кафе лучшие десерты."
2300005-33 = "Или когда говорим, какие вкусы выбрать в кафе-мороженом..."
2300005-34 = "...или когда я знакомлю друзей с новым десертом."
2300005-35 = "Вот тогда я..."
2300005-36 = "Эм..."
2300005-37 = "Наверное, иногда я всё-таки умею выражать себя."
2300005-38 = "А-ха-ха-ха..."
2300005-39 = "[s7] «Я рад, что ты это понимаешь.»\n[s8] Молча показать большой палец."
2300005-40 = "..."
2300005-41 = "..."
2300005-42 = "Вы правы. Раньше я просто этого не замечала."
2300005-43 = "Хи-хи. Вот как?"
2300005-44 = "Я рада, что попросила у вас совета."
2300005-45 = "..."
2300005-46 = "Эм, Сенсей?"
2300005-47 = "Есть ещё несколько вещей, которые меня беспокоят."
2300005-48 = "Так что... если у вас есть время..."
2300005-49 = "...можно я ещё немного с вами поговорю?"
2300005-51 = "Мы с Айри долго разговаривали, сидя на скамейке в кампусе Тринити."
