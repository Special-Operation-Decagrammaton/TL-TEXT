[translation]
1600903-1 = "Девушка-ниндзя не останавливается"
1600903-2 = "Было около полудня..."
1600903-3 = ""
1600903-6 = "[ns] «Сегодня я закончил немного раньше. Приготовлю обед.»"
1600903-8 = "[ns] «Так, всего три минуты...»"
1600903-10 = "Я ждал, пока заварится лапша быстрого приготовления."
1600903-11 = ""
1600903-18 = "Вахаха! Долгое ожидание окончено! Я, Мичиру, прибыла!"
1600903-19 = ""
1600903-21 = ""
1600903-22 = "[ns1] «Погоди, Мичиру, я не так уж долго ждал...!»\n[ns2] «Я думал, ты придёшь вечером! Сейчас только полдень...»"
1600903-23 = "Ниндзя могут появиться в любое время и в любом месте, Сенсей!"
1600903-24 = "Ниндзя могут появиться в любое время и в любом месте, Сенсей!"
1600903-25 = "Хи-хи, ну как? Я выглядела крутым ниндзя?"
1600903-26 = "[s] «Ага, к-конечно.»"
1600903-27 = "Какой безжизненный ответ! Ниндзя чувствительны, Сенсей. Вы раните мои чувства."
1600903-28 = "[s] «Почему ниндзя такие сложные?!»"
1600903-29 = "Ха-ха-ха. На меня надо наклеить стикер «Обращаться осторожно»!"
1600903-30 = "Кстати, вы опять едите лапшу быстрого приготовления?"
1600903-31 = "Ну же, Сенсей. Если так продолжать, вы угробите здоровье."
1600903-32 = "[s] «Правда?»"
1600903-33 = "Такая еда несбалансирована по питательным веществам. Она может привести к недоеданию и множеству проблем со здоровьем."
1600903-34 = "К тому же это портит режим сна."
1600903-35 = "Вы будете всю ночь листать интернет в поисках споров с анти-ниндзя. Потом пойдёте смотреть кучу видео на стриминговом сайте."
1600903-36 = "А утром, не получив нормального сна, будете с трудом вставать с кровати!"
1600903-37 = "И ВОТ ПОЭТОМУ среди ниндзя запрещена еда быстрого приготовления. Это серьёзная проблема!"
1600903-38 = "[s3] «Не знал, что лапша быстрого приготовления может быть настолько страшной...»\n[s4] «Объяснение оказалось намного подробнее, чем я ожидал.»"
1600903-39 = "Ну, это потому, что недавно я сама через такое прошла."
1600903-40 = "Ну, это потому, что недавно я сама через такое прошла."
1600903-41 = "[s] «Ты нарушила табу ниндзя?!»"
1600903-42 = "Вы всегда переживаете о глупых мелочах, достопочтенный Сенсей!"
1600903-43 = "В любом случае, я рада, что сегодня вы закончили работу пораньше!"
1600903-44 = "[s] «Вообще-то я ещё не закончил...»"
1600903-45 = "Наверное, вам интересно, зачем я вам написала."
1600903-46 = "Хм. Если сразу раскрыть цель моего визита, будет слишком антиклиматично. Настроение испортится."
1600903-47 = "Точно-точно. Для ниндзя время и атмосфера — всё. Нужно правильно выстроить историю."
1600903-48 = "А затем — засада!"
1600903-49 = "[s] «Вот такого сюжетного поворота я точно не ожидал.»"
1600903-50 = "Тсс. Я думаю."
1600903-51 = "Так, кхм. Хм."
1600903-52 = "Хммммм. Хм."
1600903-53 = "Глубоко вдохнуть. *вдох*"
1600903-54 = "... *кашляет*"
1600903-55 = "[s] «Т-Ты в порядке?»"
1600903-56 = "Я-я в порядке! В общем, я готова!"
1600903-57 = "Итак, достопочтенный Сенсей... Надеюсь, вы не слишком шокируетесь от моей новости."
1600903-58 = "Я долго держала это в секрете."
1600903-59 = "Мне нужно признаться. Я президент тайной организации ниндзя под названием Клуб исследования ниндзюцу."
1600903-60 = "Простите, что говорю только сейчас... Надо было рассказать раньше!"
1600903-61 = "[s5] «А, понятно. Кстати, домашнюю работу сделала?»\n[s6] «Что?! Не может быть!»"
1600903-62 = "Что?! Вы внезапно сменили тему!"
1600903-63 = "Это же самая важная сцена истории! Когда оказывается, что милая девушка по соседству — лидер легендарной организации ниндзя!"
1600903-64 = "[s7] «Я не знал, что такой был сюжет. Так что с домашней работой?»"
1600903-65 = "Уф, какой же вы настойчивый!"
1600903-66 = "Домашняя работа? Хм... Может, я её сделала, а может, и нет. Как кот Шрёдингера..."
1600903-67 = "В-В любом случае, я рассказала вам это потому что..."
1600903-68 = "Вахаха! Вы подыгрываете. Вы лучший, Сенсей!"
1600903-69 = "Я признаю в вас ниндзя продвинутого уровня! Можете гордиться собой!"
1600903-70 = "[s8] «Эм, ура! Продвинутый ниндзя!»"
1600903-71 = "В общем, это было великое раскрытие: милая девушка из соседнего дома на самом деле лидер легендарной организации ниндзя!"
1600903-72 = "А рассказала я это потому что..."
1600903-73 = "Такие необычные завязки сейчас очень популярны."
1600903-74 = "Но если видео будет слишком длинным, просмотров будет меньше!"
1600903-75 = "Я всю ночь смотрела такие ролики."
1600903-76 = "После того как сделала домашнюю работу!"
1600903-77 = "Короче, я хочу снять такое видео для «Мичиручи: свиток девушки-ниндзя»!"
1600903-78 = "[s] «Звучит отлично. После того как поспишь?»"
1600903-79 = "Я в порядке, в порядке! О, у вас тоже есть роль!"
1600903-80 = "Вы будете тем, кто «наблюдал за милой соседкой... но оказывается членом вражеской организации ниндзя»!"
1600903-81 = "Внезапно начинается бой... Война кланов ниндзя! Вчера мы были друзьями, а сегодня враги!"
1600903-82 = "И как раз когда всё кажется безнадёжным...!"
1600903-83 = "Они преодолевают всё и объединяются!"
1600903-84 = "Концовка — секрет. Хи-хи. Если ролик зайдёт, у «Мичиручи» будет куча подписчиков!"
1600903-85 = "[s] «Ну, удачи с этим!»"
1600903-86 = "Идём, Сенсей!"
1600903-87 = "[s] «Погоди, Мичиру. Я ещё не обедал.»"
1600903-88 = ""
1600903-90 = ""
1600903-91 = ""
1600903-92 = "Хватит разговоров! Наша цель — 100 подписчиков!"
1600903-94 = "Так я и оказался на съёмках случайного контента про ниндзя."
1600903-95 = "И снова не смог съесть свою лапшу быстрого приготовления."
