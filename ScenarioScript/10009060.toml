10009060-5 = ""
10009060-6 = ""
10009060-8 = "Бюро безопасности, похоже, занято сильнее, чем когда-либо."
10009060-9 = "Ну, это потому что Исправительному бюро пришлось усилить охрану как никогда прежде."
10009060-10 = "После всех этих улучшений, если Вакамо снова сбежит..."
10009060-11 = "...простыми извинениями уже никто не отделается."
10009060-12 = "Охрану усилили настолько, что капитан говорит: в нашей защите не должно остаться ни единой бреши."
10009060-13 = "И нас ещё поддерживают две студенты из Миллениума!#nЭлектронная безопасность в надёжных руках!"
10009060-14 = "Ну да. Остаётся надеяться, что они смогут работать между комментариями о том, насколько ужасной была наша кибербезопасность до их прихода."
10009060-15 = "Но если без шуток, теперь всё должно быть нормально..."
10009060-16 = "Ты говоришь не слишком уверенно. Что такое?"
10009060-17 = "Да, что-то всё ещё кажется странным..."
10009060-18 = "...но, возможно, я просто слишком много думаю. Наверное, в этом и дело."
10009060-19 = ""
10009060-21 = ""
10009060-23 = ""
10009060-25 = "Кстати..."
10009060-26 = "(Даже жутковато, что с момента поимки она не сказала ни слова. Думаешь, с ней всё в порядке?)"
10009060-27 = "(Разве это не хорошо, если она действительно может околдовать любого, с кем соприкоснётся, как ты слышала?)"
10009060-28 = "Т-ты же сказала, что я слишком много аниме смотрю, когда я тебе это рассказала!"
10009060-29 = "Разве?"
10009060-30 = "Ну да ладно!"
10009060-31 = ""
10009060-33 = ""
10009060-35 = ""
10009060-36 = "Кхм!"
10009060-37 = "Позвольте дать вам предупреждение, мисс «Лиса Бедствий»."
10009060-38 = "Даже НЕ ДУМАЙ выкинуть что-нибудь, слышишь?#nТы вообще представляешь, сколько проблем устроила?"
10009060-39 = "Из-за тебя я рискую лишиться отпуска, премий, оценок, И ещё меня могут заставить писать дурацкую объяснительную! На этот раз ты не сбежишь."
10009060-41 = "Нам дают премии? Впервые слышу..."
10009060-42 = "З-заткнись, Кирино! Я тут пытаюсь выступить!"
10009060-43 = "А-а, точно... Я, эм, была вынуждена написать стостраничную объяснительную из-за тебя, Лиса Бедствий!"
10009060-44 = "Я думала, у меня кисть отвалится..."
10009060-45 = "Ты чего плачешь?! Этого ведь даже ещё не случилось."
10009060-46 = "Как угодно."
10009060-47 = "Должна признать, до сих пор ты неплохо сопротивлялась."
10009060-48 = "Ты даже заставила тех хулиганов выполнять за тебя грязную работу."
10009060-49 = "Прозвище Лиса Бедствий тебе дали не просто так, да?"
10009060-51 = "..."
10009060-52 = "Похоже, ты целилась в Шале и Сенсея."
10009060-53 = "Зачем тебе такое? Хочешь отомстить?#nВыплеснуть злость? Хотя уже неважно."
10009060-54 = "Тебе лучше просто сдаться. Теперь против тебя не только Валькирия.#nУченицы со всего Кивотоса объединились, чтобы тебя остановить."
10009060-55 = "Именно! Даже Лиса Бедствий не сможет сбежать из-под такой охраны!"
10009060-56 = "..."
10009060-57 = "Всё ещё не хочешь говорить, да?"
10009060-58 = "Может, от страха коленки трясутся!"
10009060-59 = "Я бы тебя даже не винила. Только подумала, что свободна,#nа мы снова тебя поймали."
10009060-60 = "Теперь ты под замком в Исправительном бюро и снова сбежать уже не сможешь. Никто не осудит тебя за то, что ты смирилась с судьбой."
10009060-62 = "Эм, Фубуки, мне кажется, ты уже донесла мысль..."
10009060-63 = "А? Чего ты так нервничаешь?"
10009060-64 = "Я просто говорю... Если будешь слишком много болтать, накличешь беду."
10009060-65 = "О чём ты говоришь?"
10009060-66 = "Ты не сможешь быть хорошим полицейским, если веришь в такие суеверия."
10009060-67 = "Я могу говорить что хочу! Не то чтобы она сейчас внезапно—"
