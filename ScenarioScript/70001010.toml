[translation]
70001010-1 = "Термы Акай 1"
70001010-6 = ""
70001010-7 = ""
70001010-8 = "Капитан! Бригады секретариата, преданные этой мелкой тиранше, приближаются к нашей позиции!"
70001010-9 = "Чёрт, она разгромила наш переворот..."
70001010-10 = "Но наша борьба на этом не заканчивается!"
70001010-11 = "Когда-нибудь мы свергнем эту малолетнюю диктаторшу, и новый правитель поведёт академию Красная Зима к славному будущему!"
70001010-12 = ""
70001010-14 = ""
70001010-15 = ""
70001010-16 = ""
70001010-17 = "Репрессировать! Всех вас репрессируют!"
70001010-18 = "Исполнительный офис Черины"
70001010-19 = ""
70001010-20 = "Фух... Подавлять диссидентов — тяжёлая работа..."
70001010-21 = ""
70001010-24 = ""
70001010-25 = "Президент Черина! Мы собрали всех студентов, ответственных за недавний переворот!"
70001010-26 = "Мм, отличная работа, председатель Марина!"
70001010-27 = "В знак нашей благодарности награждаю тебя медалью Усатого Героя... 1-го класса!"
70001010-28 = "...Погоди, разве я уже не давала тебе медаль Усатого Героя 1-го класса за подавление прошлого переворота?"
70001010-29 = "Главный секретарь Томоэ, сколько переворотов у нас уже было на этой неделе?"
70001010-30 = ""
70001010-32 = ""
70001010-33 = "Ну, Великий Вождь, мы подавили две попытки переворота и пять раз были свергнуты..."
70001010-34 = "То есть на этой неделе мы сталкивались с новым государственным переворотом каждый день."
70001010-35 = "Тогда в честь блистательного руководства президента Черины в это беспрецедентное кризисное время, может, закажем художнику картину, чтобы увековечить события прошедшей недели?"
70001010-36 = "Хватит уже что-либо увековечивать... Позапрошлый переворот начал художник, которого мы наняли рисовать предыдущие подавленные перевороты."
70001010-37 = ""
70001010-39 = ""
70001010-40 = "Так... что стало причиной этого?"
70001010-41 = "П-Простите...? Что вы имеете в виду?"
70001010-42 = "Студенты академии Красная Зима известны своим революционным пылом, но даже нашим студентам было бы трудно мобилизоваться на столько переворотов без причины."
70001010-43 = "Обычно нам приходится отбивать попытку переворота лишь раз примерно в три дня..."
70001010-44 = "Так что же провоцирует это непрерывное восстание против моей власти над академией Красная Зима?"
70001010-45 = "Н-Н-Ну..."
70001010-46 = ""
70001010-48 = ""
70001010-49 = "Согласно расследованию, зачинщики недавнего переворота были недовольны состоянием купальных помещений академии Красная Зима."
70001010-50 = "Купальных помещений...? Но у академии Красная Зима лучшие купальные помещения во всём Кивотос!"
70001010-51 = "Раньше они никогда не ныли из-за купания, почему вдруг сейчас?"
70001010-52 = "...Подозреваю, это связано с их посещением Курорта горячих источников №227."
70001010-53 = "Курорт горячих источников №227? При чём здесь этот напыщенный водяной чулан?"
70001010-54 = ""
70001010-56 = ""
70001010-57 = "Курорт горячих источников №227 показал студентам академии Красная Зима роскошь купания, превосходящую самые смелые мечты."
70001010-58 = "После купания в раю возвращение к несколько... непритязательным помещениям академии оказалось неприятным контрастом."
70001010-59 = ""
70001010-60 = ""
70001010-61 = "Хмф, я почти не заметила никакой разницы."
70001010-62 = "В любом случае, пока есть горячая вода, мы можем мыться! В общих общежитиях Красная Зима всегда полно горячей воды!"
70001010-64 = "...Хотя некоторым студентам неудобно, что бойлеры включаются только в 7 утра и 7 вечера, всего на два часа."
70001010-66 = "...Особенно когда отопление полностью ломается и тебя окатывает ледяной водой."
70001010-68 = "Н-Но наши душевые в общежитиях Красная Зима могут вместить сотни студентов одновременно!"
70001010-69 = "Так что по одному только масштабу нашим помещениям нет равных!"
70001010-71 = "Даже если это всего лишь старые душевые лейки без перегородок..."
70001010-73 = "Я всё же скучаю по тому, как после тяжёлого дня принимаешь тёплую ванну и чувствуешь, как стресс исчезает..."
70001010-74 = "О, и выпить потом свежий стакан кофейного молока—"
70001010-75 = ""
70001010-77 = ""
70001010-78 = ""
70001010-79 = "К-Конечно, каким бы вкусным ни было кофейное молоко после горячей ванны, ему далеко до Cherenka, которую готовите вы, президент Черина!"
70001010-80 = "И вообще искать роскошь в такой практичной вещи, как купание, — чистое буржуазное разложение..."
70001010-81 = "..."
70001010-82 = "Я-я честно! Пожалуйста, не репрессируйте меня снова...!"
70001010-83 = "...Тогда лучший выход — полностью отремонтировать купальные помещения академии Красная Зима."
70001010-84 = "Эм... Что?"
70001010-85 = "У тебя что, проблемы со слухом, председатель Марина? Не слышишь, когда тебе говорят прямо в лицо?"
70001010-86 = "Я сказала: нам нужен полный ремонт купальных помещений академии Красная Зима!"
70001010-87 = ""
70001010-89 = ""
70001010-90 = "Если даже офицеры Секретариата выражают недовольство, большинство студентов наверняка разделяет их жалобы."
70001010-91 = "Чтобы быть великим лидером, недостаточно править железной рукой. Я должна прислушиваться к голосу народа и заботиться о его нуждах."
70001010-92 = "Я не настолько упряма, чтобы навязывать свою волю, не обращая внимания на желания студентов!"
70001010-93 = "...К тому же, если я продолжу сталкиваться с переворотами из-за такой мелочи, как купание, то однажды точно потеряю власть окончательно..."
70001010-94 = "Потрясающее решение, Великий Вождь!"
70001010-95 = "Вместо того чтобы осудить студентов, восставших против вашей власти, вы признаёте их страдания и принимаете их нужды как свои...! Я смиренно восхищаюсь вашим видением!"
70001010-96 = "Кхм, естественно! Я Черина, президент ученического совета академии Красная Зима, глава благоустройства, Великий Вождь, глава физического воспитания и многое другое!"
70001010-97 = "Когда новость о ремонте распространится, пожары, бушующие по академии Красная Зима, наверняка стихнут, залитые потоком вашего сострадания!"
70001010-98 = "Подготовить объявление для публикации в «Красном медведе»?"
70001010-99 = "Хм, приступай, главный секретарь Томоэ."
70001010-100 = ""
70001010-102 = ""
70001010-104 = ""
70001010-105 = ""
70001010-106 = ""
70001010-107 = "А пока, чтобы отремонтировать купальные помещения..."
70001010-108 = ""
70001010-110 = ""
70001010-111 = ""
70001010-112 = "...может, для начала удвоим размер душевых?"
70001010-113 = "Эм, мне кажется, это немного не туда—"
70001010-114 = ""
70001010-116 = ""
70001010-117 = "Увеличить размер душевых — отличная идея, но не лучше ли проконсультироваться со специалистом по этому вопросу?"
70001010-118 = "Специалистом? В Красная Зима есть эксперты по купанию?"
70001010-119 = "В академии Красная Зима есть целое учреждение, набитое ими. В конце концов, некоторые наши студенты совсем недавно профессионально управляли курортом горячих источников."
70001010-120 = "Это..."
70001010-122 = ""
70001010-123 = "После всех отчаянных мольб, брошенных из-за промёрзших стен Бывшего института..."
70001010-124 = "Наши просьбы наконец достигли ушей президента Черины!"
70001010-125 = "...Вы наконец решили снять кандалы с наших запястий?"
70001010-126 = ""
70001010-128 = ""
70001010-129 = "...Скорее условно-досрочное освобождение. Временное."
70001010-130 = "Вы правда думаете, что вас можно освободить, несмотря на полное отсутствие раскаяния и исправления? Не будьте настолько самонадеянны."
70001010-131 = "Как вы можете такое говорить?!"
70001010-132 = "Мы без жалоб терпели суровые условия Бывшего института и отправили бесчисленное количество писем с извинениями по всем официальным каналам. Разве это не доказывает, что мы осознали своё поведение и вели себя тихо?!"
70001010-133 = "...Вели себя тихо?"
70001010-134 = "Я-я имею в виду, конечно, мы иногда забирались повыше, чтобы посмотреть на Сенсея..."
70001010-135 = ""
70001010-137 = ""
70001010-138 = ""
70001010-139 = "Например, я залезла на телефонный столб возле Шале и была арестована студентами-полицейскими Валькирия..."
70001010-140 = ""
70001010-142 = ""
70001010-143 = ""
70001010-144 = "Вот именно! Если я помилую студентов, которые раз за разом нарушают мои правила и не раскаиваются, авторитет Секретариата рухнет!"
70001010-145 = "Цк... Ну вот и прощайте, надежды и мечты."
70001010-146 = "Тогда зачем вы так внезапно вызвали нас, если освобождать не собираетесь?"
70001010-147 = "Есть кое-что, о чём я хочу попросить вас лично."
70001010-148 = "Если вы выполните свою часть и исполните мою просьбу, я помилую все ваши прошлые проступки, награжу медалями в соответствии с заслугами и даже дам вам должности в Секретариате!"
70001010-149 = "Медали и прочее от президента Черины — это, конечно, хорошо, но..."
70001010-150 = "Вы оставили нас гнить всё это время, а теперь вдруг вызываете из ниоткуда и просите услугу... Тут что-то нечисто."
70001010-151 = "В прошлый раз, когда мы встречались, вы всё ещё были в ярости из-за того, что мы по собственной инициативе открыли курорт горячих источников."
70001010-152 = "Напротив, Офис Красная Зима был очень впечатлён вашими результатами."
70001010-153 = "Сумев без какого-либо прошлого опыта управлять процветающим курортом горячих источников и обеспечивать отличный сервис студентам академии и нашим гостям, вы воплотили несокрушимый дух рабочего класса."
70001010-154 = "...Хотя бизнес был нелегальным?"
70001010-155 = ""
70001010-157 = ""
70001010-158 = "Верно, вы забыли получить одобрение Секретариата."
70001010-159 = "Поэтому, чтобы исправить ситуацию и дать вам шанс загладить вину, мы хотим предложить вам возможность управлять крупным купальным комплексом."
70001010-160 = "Что? То есть... вы собираетесь возродить Курорт горячих источников №227?"
70001010-161 = "Хмф. Мы едва остановили тех соплячек из Геенна, не дав им превратить всю академию в океан лавы — снова копать горячий источник мы в ближайшее время не станем."
70001010-162 = "Если точнее, мы хотим, чтобы вы помогли отремонтировать общие душевые в общежитиях академии."
70001010-163 = "Наши студенты ясно высказали свои пожелания, и мы начинаем полный капитальный ремонт купальных помещений академии Красная Зима..."
70001010-164 = "А участницы Спецотряда №227 — единственные студенты, у которых есть опыт подобной работы."
70001010-165 = "А, то есть душевые общежития, а не настоящий горячий источник..."
70001010-166 = "Тогда я не смогу предлагать людям напитки после купания."
70001010-167 = "В будущем, возможно, найдётся место и для дополнительных удобств, но сейчас наша главная задача — переделать купальные помещения так, чтобы они подходили всему ученическому составу."
70001010-168 = "Поэтому мы хотим, чтобы Спецотряд №227 посетил другие академии и представил Секретариату отчёт о том, можно ли использовать какие-либо их решения здесь."
70001010-169 = "Вы хотите, чтобы мы осмотрели купальные помещения других академий...?"
70001010-170 = "Да. У нас нет времени и нужной квалификации, чтобы переделывать общежития с нуля."
70001010-171 = "Если перенять решения, уже доказавшие свою работоспособность в другой академии, весь процесс значительно ускорится."
70001010-172 = "Вот где нужна ваша команда. Учитывая ваш бесценный опыт, Секретариат готов предоставить вам право заключить контракт на ремонт с другой академией, если вы решите, что её помещения удовлетворят потребности Красная Зима."
70001010-173 = "Соответственно, Офис Красная Зима покроет любые расходы, возникшие во время вашей исследовательской поездки. Более того, мы настоятельно рекомендуем использовать все предоставленные возможности, если они связаны с купанием."
70001010-174 = "Обычно нашим студентам не позволили бы такую роскошь, так что будьте благодарны!"
70001010-175 = ""
70001010-176 = "Хм-м. Обычно если предложение звучит слишком хорошо, чтобы быть правдой, так оно и есть..."
70001010-177 = "Но Шигурэ! Такой шанс выпадает раз в жизни!"
70001010-178 = "Если всё сделаем как надо, сможем вырваться из ледяных лап Бывшего института и, возможно, даже снова запустить наши услуги горячих источников!"
70001010-179 = "А заодно бесплатно испробуем купальные помещения других академий! Будет как отпуск в спа — с чего обычным студентам вроде нас отказываться?"
70001010-180 = "Ну, если ты действительно хочешь, Нодока, я не стану возражать..."
70001010-181 = "Хочу!"
70001010-182 = ""
70001010-184 = ""
70001010-185 = "В честь ныне закрытого Курорта горячих источников №227 обещаем найти идеальные купальные помещения для студентов академии Красная Зима!"
70001010-187 = "Хи-хи. Рада это слышать."
70001010-188 = "Тогда оставляем дело в ваших способных руках."
