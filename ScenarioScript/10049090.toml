10049090-42 = "Вы готовы сотрудничать?"
10049090-43 = "А, да! Конечно!"
10049090-44 = "Только минутку, хе-хе! Сейчас чуть подправлю тележку..."
10049090-45 = ""
10049090-47 = ""
