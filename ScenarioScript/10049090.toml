[translation]
10049090-1 = "Эпизод 9;Операция «Светошумовая граната»"
10049090-2 = "Видишь что-нибудь новое оттуда, Маширо?"
10049090-3 = "Смотрю, но в темноте дело идёт медленнее."
10049090-4 = "Мы знаем, что цель продаёт шарики и ведёрки для попкорна."
10049090-5 = "Они находятся рядом с той сценой."
10049090-6 = "Откуда ты знаешь, Сузуми?"
10049090-7 = "Перед нашим выходом я видела расстроенных детей."
10049090-8 = "Они просили обменять именно эти товары."
10049090-9 = "С тех пор преступник мог уйти."
10049090-10 = "Сомневаюсь."
10049090-11 = "То место находится рядом с границей Тринити и Геенны."
10049090-12 = "Оттуда можно сбежать в любую сторону."
10049090-13 = "К тому же рядом со сценой проходит больше людей, чем где-либо ещё."
10049090-14 = "Идеальное место для торговли."
10049090-15 = "[s] «Ты острая на глаз, Сузуми!»"
10049090-16 = "М-м, назовём это инстинктом линчевателя. ...Но времени мало."
10049090-17 = "Если не двинемся сейчас, до конца парада, можем их упустить."
10049090-18 = "Ни за что! Мы слишком старались, чтобы сюда добраться!"
10049090-19 = "Меня чуть аллигатор не укусил!"
10049090-21 = "А-Аллигатор...?"
10049090-22 = "Обновление. Вижу цель. Слева от сцены."
10049090-23 = ""
10049090-25 = ""
10049090-26 = "Идём!"
10049090-27 = ""
10049090-28 = ""
10049090-29 = ""
10049090-30 = "Послушай, этот шарик не «протекает»."
10049090-31 = "Он реагирует на твои гиподермальные ионы, твою отрицательную энергию."
10049090-32 = "Позитроний внутри шарика нейтрализует ионы и делает тебя уравновешенной и здоровой!"
10049090-34 = "Я не понимаю половину этих слов."
