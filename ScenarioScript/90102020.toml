[translation]
90102020-1 = "Episode 2;Fare Evasion"
90102020-4 = "(On a day when the summer heat had started to ease...)"
90102020-5 = "(I was riding a train on SCHALE business.)"
90102020-8 = "(About an hour after leaving the previous station...)"
90102020-12 = "Attention passengers, we will now begin ticket inspection."
90102020-13 = "Please be seated in your assigned seats and have your tickets ready."
90102020-14 = "Furthermore, if you refuse to comply with the inspection or possess an invalid ticket—#nwe may be forced to resort to rough measures, so your understanding and cooperation are appreciated."
90102020-15 = "Eeeek...!"
90102020-19 = "Excuse me, ticket please."
90102020-20 = "Well now... Look here, conductor."
90102020-21 = "It's not like I'm saying this because I don't have the money."
90102020-25 = "This is just an old story, you see.#nBack in the day, we carried hundreds of railroad ties on our backs every day to lay the tracks."
90102020-26 = "Suffice to say, you could practically say I built all the tracks around here."
90102020-27 = "And yet, instead of rewarding us for our hard work, the General Student Council tries to charge us fare.#nDon't you think that's unreasonable?"
90102020-28 = "Frankly, 5,000 yen for this distance is a bit steep, wouldn't you say?"
90102020-29 = "In other words... you do not have a ticket?"
90102020-30 = "Good grief, you're a bit slow on the uptake."
90102020-31 = "If you were to just turn a blind eye, there wouldn't be any problem at all."
90102020-32 = "If you have any respect for your elders... you understand, right?"
90102020-33 = "Sigh..."
90102020-34 = "If you do not have a ticket, you are not a passenger.#nGet off the train immediately."
90102020-35 = "What are you talking about? The train is moving, you know?"
90102020-36 = "Leave it to me."
90102020-43 = "Waaaaah—"
90102020-45 = "Now, next passenger."
90102020-46 = "I-I have mine right here!"
90102020-47 = "Look! My ticket to Kawanishi Station—"
90102020-48 = "It would seem so... Yes, thank you. There's no pro—"
90102020-52 = "—This ticket is from a week ago."
90102020-53 = "Surely you don't think you can pull a fast one with a week-old ticket?"
90102020-54 = "Ah, dam—"
90102020-55 = "If you do not have today's ticket, you are not a passenger.#nGet off the train immediately."
90102020-56 = "W-Wait, I didn't mean to—"
90102020-63 = "Waaaaah—"
90102020-66 = "[ns] (That's pretty alarming...)"
90102020-67 = "Sigh... Why are there not even half of the passengers left...?"
90102020-72 = "Passenger. Let's see your ticket."
90102020-73 = "You don't happen to... not have one, do you?"
90102020-74 = "[s1] \"Of course I do! I've got it right here.\"\n[s2] \"See, it's in the front pocket of my bag—\""
90102020-80 = "[ns] \"...Huh?\""
90102020-81 = "Sigh..."
90102020-82 = "So you do not have a ticket."
90102020-83 = "[s] \"I definitely had it up until I got on...!\""
90102020-84 = "Excuses are unnecessary."
90102020-85 = "If you do not have a ticket, you are not a passenger.#nGet off the train immediate—"
90102020-86 = "[s] \"W-Wait!\""
90102020-90 = "[ns] \"Actually, I'm the SCHALE Sensei...\""
90102020-92 = "[ns3] \"I'll buy a new ticket as soon as we reach the next station.\"\n[ns4] \"Could you spare me from being tossed off the train?\""
90102020-95 = "The SCHALE Sensei? You?"
90102020-96 = "Ha, hahaha, hahahaha!"
90102020-97 = "Do you have any idea how many scoundrels try to trick the crew by saying things like that?"
90102020-98 = "Just this morning, there were three people who claimed to be high-ranking General Student Council officials to try and bargain on their fare."
90102020-99 = "If you're the SCHALE Sensei, am I the General Student Council President?"
90102020-100 = "[s] \"No way...\""
90102020-101 = "Anyway. If you do not have a ticket, you are not a passenger.#nIt's about time you got off the—"
90102020-102 = "Excuse me, do you have a moment?"
90102020-103 = "This fell under the seat."
90102020-110 = "[ns] \"Huh? Niko? Why—\""
90102020-111 = "Shh. Just play along for now."
90102020-112 = "Looks like you dropped it when you sat down."
90102020-113 = "You really need to keep a proper hold on your ticket.#nOtherwise, you might end up tossed outside."
90102020-114 = "This ticket belongs to Sensei, doesn't it?"
90102020-115 = "[s] \"Ah, yes! It's definitely mine!\""
90102020-116 = "Let's see here... Hm?"
90102020-117 = "This is... a special pass that only the General Student Council can issue...?"
90102020-118 = "Could you really be the SCHALE Sensei...!? "
90102020-119 = "[s] \"I'm glad you understand...\""
90102020-120 = "I-I-I-I am so sorry!#nThere are just too many scoundrels who lie and ride for free... I suppose I was a bit high-strung."
90102020-121 = "My sincerest apologies. Have a pleasant journey!"
90102020-126 = "Honestly... what are you doing?"
90102020-127 = "Leaving your ticket behind? You can't complain if you get thrown outside, you know."
90102020-128 = "[s5] \"You were all here...\"\n[s6] \"Thanks for saving me...\""
90102020-131 = "It was a matter concerning Sensei's safety."
90102020-132 = "However, there is no guarantee we will be able to protect you next time.#nWe recommend keeping your ticket on your person at all times when riding the train."
90102020-133 = "Still, I totally get it though."
90102020-134 = "Little pieces of paper like train tickets always seem to go missing right when you need them.#nAnd then they turn up all crumpled at the bottom of your bag when you've long forgotten about them."
90102020-136 = "[ns] \"Even so, what is this ticket...?\""
90102020-137 = "It's an emergency special pass entrusted to us by the General Student Council President."
90102020-138 = "It's a versatile pass that can be used when there's no time to issue a ticket,#nlike when we're pursuing a suspect."
90102020-139 = "That being said, if we use it too much, the Finance Office might give us an earful.#nSo we only use it in genuine emergencies."
90102020-140 = "[s7] \"I see... Thanks for lending it to me.\"\n[s8] \"So, do you all have business outside D.U.?\""
90102020-143 = "No, a bit closer than that."
90102020-144 = "We were on our way to Kawanishi Station, located on the outer edge of D.U."
90102020-145 = "Kawanishi Station is a transfer hub where multiple lines intersect, so many students use it for commuting."
90102020-146 = "We've received multiple reports regarding rumors of student disappearances at that station..."
90102020-147 = "[s9] \"That's terrible...\"\n[s10] \"It's not another monster, is it...?\""
90102020-150 = "So far, there have been no reports of anyone sighting a monster."
90102020-151 = "...Sensei.#nHave you heard the rumor about a train not listed on the timetable appearing, taking students aboard, and vanishing?"
90102020-153 = "Next Episode;A Train That Shouldn't Exist"
