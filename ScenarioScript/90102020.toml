[translation]
90102020-1 = "Эпизод 2;Безбилетный проезд"
90102020-4 = "(Однажды, когда жара начала спадать)"
90102020-5 = "(Я ехал на поезде по делам Шале)"
90102020-8 = "(Примерно через час после отправления с предыдущей станции...)"
90102020-11 = ""
90102020-12 = "Уважаемые пассажиры, с этого момента мы начинаем проверку билетов в вагоне."
90102020-13 = "Пожалуйста, займите указанные места и приготовьте свои билеты."
90102020-14 = "Кроме того, в случае отказа от проверки или предъявления недействительного билета――#nнам придётся прибегнуть к жёстким мерам, поэтому просим отнестись с пониманием#nи содействием."
90102020-15 = "Ах..."
90102020-16 = ""
90102020-18 = ""
90102020-19 = "Уважаемый пассажир, предъявите, пожалуйста, ваш билет."
90102020-20 = "Хм... понимаете, уважаемый кондуктор."
90102020-21 = "Дело не в том, что у меня нет денег, чтобы заплатить."
90102020-22 = ""
90102020-24 = ""
90102020-25 = "Это просто старая история.#nВ те времена я таскал на плечах по несколько сотен шпал в день и прокладывал пути."
90102020-26 = "Можно сказать, все здешние рельсы построены моими руками."
90102020-27 = "И вот, вместо того чтобы вознаградить за труды, Генеральный Студенческий Совет ещё и#nтребует плату за проезд. Разве это не противоречит здравому смыслу?"
90102020-28 = "В самом деле, 5000 йен за такое расстояние — слишком дорого, не так ли?"
90102020-29 = "То есть... вы хотите сказать, что у вас нет билета?"
90102020-30 = "Ох, какая же вы недогадливая."
90102020-31 = "Если вы просто закроете глаза, никаких проблем не будет."
90102020-32 = "Если вы уважаете старших... вы же понимаете?"
90102020-33 = "Эх..."
90102020-34 = "Если у вас нет билета, то вы не пассажир.#nНемедленно покиньте поезд."
90102020-35 = "Что вы говорите? Поезд ведь едет!"
90102020-36 = "Предоставьте это мне."
90102020-37 = ""
90102020-39 = ""
90102020-40 = ""
90102020-43 = "Аааааа―"
90102020-44 = ""
90102020-45 = "Итак, следующий пассажир."
90102020-46 = "У-у меня он есть, честно!"
90102020-47 = "Вот! Билет до станции Каваниши―"
90102020-48 = "Похоже, так и есть... Да, благодарю вас. Всё в порядке―"
90102020-49 = ""
90102020-51 = ""
90102020-52 = "―Но у этого билета дата использования — неделю назад."
90102020-53 = "Неужели вы думали, что вас пропустят с билетом недельной давности?"
90102020-54 = "А, ой, подождите―"
90102020-55 = "Если у вас нет билета на сегодня, то вы не пассажир.#nНемедленно покиньте поезд."
90102020-56 = "Н-но я не это имела в виду―"
90102020-57 = ""
90102020-59 = ""
90102020-60 = ""
90102020-63 = "Аааааа―"
90102020-66 = "[ns](Как-то всё слишком жёстко...)"
90102020-67 = "Эх... почему же [ruby=・   ・   ・]пассажиров[/ruby] так мало..."
90102020-68 = ""
90102020-70 = ""
90102020-71 = ""
90102020-72 = "Уважаемый пассажир. Покажите ваш билет."
90102020-73 = "Вы же не хотите сказать, что у вас его нет?.."
90102020-74 = "[s1] «Конечно есть, есть! У меня точно есть.»\n[s2] «Вот, в переднем кармане сумки―»"
90102020-77 = ""
90102020-80 = "[ns] «...А?»"
90102020-81 = "Эх..."
90102020-82 = "Значит, билета у вас нет."
90102020-83 = "[s] «Но у меня же он был, когда я садился...!»"
90102020-84 = "Оправдания излишни."
90102020-85 = "Если у вас нет билета, то вы не пассажир.#nНемедленно покиньте поезд―"
90102020-86 = "[s] «П-подождите!»"
90102020-87 = ""
90102020-90 = "[ns]«Вообще-то я Сенсей из Шале...»"
90102020-92 = "[ns3] «Когда доберёмся до следующей станции, я сразу куплю новый билет.»\n[ns4] «Можно обойтись без выбрасывания меня из поезда?»"
90102020-95 = "Сенсей из Шале? Вы?"
90102020-96 = "Ха, ха-ха, ха-ха-ха!"
90102020-97 = "Вы хоть знаете, сколько [ruby=я]отродий[/ruby], которые [ruby=・   ・   ・]так[/ruby] пытаются обмануть кондуктора?"
90102020-98 = "Только сегодня утром было трое, кто представлялся высокопоставленным чиновником#nГенерального Студенческого Совета и пытался сбить цену за проезд."
90102020-99 = "Если вы Сенсей из Шале, то я, наверное, сама Президент Генерального Студенческого Совета?"
90102020-100 = "[s] «Как же так...»"
90102020-101 = "Так или иначе. Если у вас нет билета, то вы не пассажир.#nПожалуйста, покиньте поезд―"
90102020-102 = "Извините, можно вас на секунду?"
90102020-103 = "Вот, это выпало из-под сиденья."
90102020-104 = ""
90102020-106 = ""
90102020-107 = ""
90102020-109 = ""
90102020-110 = "[ns] «А? Нико? Почему ты―»"
90102020-111 = "Тсс. Сейчас просто подыграйте мне."
90102020-112 = "Похоже, вы обронили его, когда садились на место."
90102020-113 = "Билет нужно хранить при себе.#nА то ведь могут и вышвырнуть наружу."
90102020-114 = "Этот билет ведь принадлежит Сенсею, верно?"
90102020-115 = "[s] «А, да! Это точно мой!»"
90102020-116 = "Посмотрим... хм?"
90102020-117 = "Это же... специальный пропуск, который может выдать только Генеральный Студенческий Совет?"
90102020-118 = "Неужели вы правда Сенсей из Шале!?.."
90102020-119 = "[s] «Как хорошо, что меня поняли...»"
90102020-120 = "П-п-прошу прощения!#nСлишком много лжецов пытается проехать безбилетниками... я немного перенервничала."
90102020-121 = "Приношу искренние извинения. Счастливого пути!"
90102020-122 = ""
90102020-124 = ""
90102020-125 = ""
90102020-126 = "Ну и ну... что вы вытворяете."
90102020-127 = "Забыть билет — и то, если бы вас выбросили, вы не имели бы права жаловаться."
90102020-128 = "[s5] «Вы все здесь...»\n[s6] «Спасибо, что спасли меня...»"
90102020-131 = "Это касалось безопасности Сенсея."
90102020-132 = "Однако не факт, что мы сможем защитить вас в следующий раз.#nРекомендуем не расставаться с билетом, садясь в поезд."
90102020-133 = "Но вообще-то, такое бывает, да."
90102020-134 = "Маленькие бумажки вроде билетов находятся как раз не тогда, когда нужны.#nА потом, когда уже забыл, они откуда-то из глубины сумки вылезают мятые-перемятые."
90102020-135 = ""
90102020-136 = "[ns] «И всё-таки, этот билет?..»"
90102020-137 = "Это специальный пропуск для экстренных случаев, доверенный мне Генеральным Студенческим Советом."
90102020-138 = "Универсальный пропуск, который можно использовать, когда нет времени#nна выпуск обычного билета — например, при преследовании подозреваемого."
90102020-139 = "Но если использовать его слишком часто, можно получить нагоняй из финансового отдела.#nПоэтому применять его стоит только в настоящих чрезвычайных ситуациях."
90102020-140 = "[s7] «Вот как... Спасибо, что одолжила.»\n[s8] «А у вас всех дела за пределами Р.У.?»"
90102020-143 = "Нет, чуть ближе."
90102020-144 = "Мы направлялись на станцию Каваниши на окраине Р.У."
90102020-145 = "Станция Каваниши — пересадочный узел, где пересекается несколько линий, поэтому ей пользуется много студентов."
90102020-146 = "И вот на такой станции поступило несколько сообщений о слухах об исчезновениях студентов..."
90102020-147 = "[s9] «Вот это беда...»\n[s10] «Надеюсь, это не очередные монстры?..»"
90102020-150 = "На данный момент сообщений о появлении монстров не поступало."
90102020-151 = "...Сенсей.#nВы слышали историю о поезде, которого нет в расписании, который появляется и увозит студентов?"
90102020-153 = "Следующий эпизод;Поезд, которого не должно существовать"