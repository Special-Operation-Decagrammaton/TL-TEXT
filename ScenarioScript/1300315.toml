[translation]
1300315-1 = "Её секретный блокнот"
1300315-4 = "Ах да. Это мой блокнот."
1300315-5 = "Спасибо. Мне ужасно неловко, что из-за моей невнимательности тебе пришлось с этим возиться."
1300315-6 = "[s1] «Я рад, что смог помочь.»\n[s2] «Никаких проблем.»"
1300315-9 = ""
1300315-11 = ""
1300315-12 = "Я уже боялась, что потеряла его навсегда, но вот он."
1300315-13 = "Да?"
1300315-14 = "Хочешь узнать, что внутри? Это личное?"
1300315-15 = "[s3] «Ты просто выглядишь такой облегчённой.»\n[s4] «Вижу, как ты этим дорожишь.»"
1300315-18 = "...Ах. Понятно."
1300315-19 = "Ты прав. Наверное, странно видеть, как я так привязана к вещи."
1300315-20 = "Я стараюсь не быть материалисткой. Большинство вещей можно заменить."
1300315-21 = "Видишь, это всего лишь обычная записная книжка. Здесь имена и контакты всех членов Отряда справедливости."
1300315-22 = "Я постоянно напоминаю другим, какой кошмар будет, если она попадёт в чужие руки, а потом сама её потеряла..."
1300315-23 = ""
1300315-26 = "...Ты выглядишь разочарованным."
1300315-27 = "Но мой блокнот немного особенный. Я обновляю его вручную ещё с первого курса."
1300315-28 = "Хм? Нет, не из-за дефицита. Новые экземпляры печатают каждый год."
1300315-29 = "Но... я привыкла вести личные заметки. Можно сказать, сделала этот блокнот своим."
1300315-30 = "Сенсей? Почему ты так засуетился?"
1300315-31 = "[s5] «Прости, я не хотел подглядывать.»\n[s6] Передать ей записи, найденные рядом с книгой."
1300315-34 = ""
1300315-36 = ""
1300315-37 = ""
1300315-38 = ""
1300315-39 = "А, понятно... Наверное, они выпали, когда я уронила блокнот."
1300315-40 = "Не переживай. Спасибо, что собрал их. Ты не мог не прочитать хоть немного."
1300315-41 = "...Хм? Что это за заметки?"
1300315-42 = "Я сама их написала. Это так странно?"
1300315-43 = "...Ты впечатлён?"
1300315-44 = "Ты мне льстишь, Сенсей."
1300315-45 = "Как вице-президент, я отвечаю за распределение заданий Отряда справедливости."
1300315-46 = "Чтобы ставить нужных людей на нужные места, я должна знать сильные и слабые стороны участниц, конфликты характеров..."
1300315-47 = "Сейчас это уже несложно. Просто обращаю внимание и время от времени разговариваю со всеми."
1300315-48 = "Я занимаюсь этим три года, так что нового добавлять почти нечего."
1300315-49 = "[s7] «Вижу, как ты заботишься...»\n[s8] «Ты записала любимые блюда, аллергии, дни рождения...»"
1300315-52 = "Хобби, привычки и важные даты могут казаться незначительными..."
1300315-53 = "И для самой работы они действительно почти бесполезны."
1300315-54 = "Но эти люди не просто члены Отряда справедливости. В конце концов, они все студенты, правда?"
1300315-55 = "Из всех клубов они сами выбрали тот, где много тяжёлой работы и редко получают признание."
1300315-56 = "Я лишь хочу, чтобы они чувствовали себя... особенными. Чтобы знали, что их ценят."
1300315-57 = "Хотя ты-то наверняка понимаешь это лучше всех, да, Сенсей?"
1300315-58 = "Наверное, я сейчас звучу слишком нравоучительно. Прости."
1300315-59 = "[s9] «Я так тронут!»\n[s10] «Хасуми...! Это чудесно!»"
1300315-62 = "Пожалуйста... ты меня смущаешь."
1300315-63 = "Хм? Записываю ли я только про членов Отряда справедливости?"
1300315-64 = "Ну, это всё-таки книга Отряда справедливости. У неё есть конкретное назначение."
1300315-65 = "И... в основном я придерживалась этих рамок."
1300315-66 = "Хи-хи. Но если честно, вне Отряда я знаю не так много людей."
1300315-67 = "Так что я записываю обо всех, кто мне дорог, просто так вышло, что почти все они мои товарищи по клубу."
1300315-68 = "...Прости? Что именно тебе кажется странным?"
1300315-69 = "Что здесь есть член Отряда справедливости с кодовым именем, у которого тот же день рождения, что и у тебя, и который тоже любит гача-игры?"
1300315-70 = ""
1300315-72 = ""
1300315-73 = ""
1300315-74 = "Сенсей, мне было очень приятно поговорить с тобой."
1300315-75 = "Но боюсь, я и так отняла слишком много твоего времени. Ты явно занят."
1300315-76 = "[s] «Хм? Да ничего страшного—»"
1300315-77 = "Нет-нет! Я и так доставила тебе столько хлопот с возвращением блокнота..."
1300315-78 = "О, и я только что вспомнила про срочную чрезвычайную ситуацию! Мне нужно идти!"
1300315-79 = "Прошу прощения!"
1300315-80 = ""
1300315-82 = ""
1300315-88 = "Хасуми мгновенно умчалась."
