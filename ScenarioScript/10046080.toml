[translation]
10046080-1 = "Эпизод 8;Чаепитие в летнюю ночь"
10046080-8 = ""
10046080-9 = "..."
10046080-10 = "..."
10046080-11 = ""
10046080-13 = ""
10046080-15 = "..."
10046080-16 = "О."
10046080-17 = "...Это я сделала?"
10046080-18 = ""
10046080-20 = ""
10046080-22 = ""
10046080-24 = ""
10046080-25 = "Что это было, Мика?"
10046080-26 = ""
10046080-28 = ""
10046080-29 = "Н-Наги...! Нет, всё не так—"
10046080-30 = "Не трать слова. Не нужно."
10046080-31 = "Кто-то заложил бомбу под нашей виллой. Наши дальнейшие действия очевидны."
10046080-32 = ""
10046080-34 = ""
10046080-35 = "Отпуск окончен!"
10046080-36 = "Вы все арестованы. Приготовьтесь к немедленному допросу и пыткам."
10046080-37 = "А ты, Мисоно Мика, главная виновница, будешь наказана: на каждый приём пищи только чёрствые рулетики."
10046080-39 = "...И НИ ЕДИНОГО ГЛОТКА МОЛОКА!"
10046080-40 = ""
10046080-42 = ""
10046080-43 = ""
10046080-45 = "...ка!"
10046080-46 = ""
10046080-48 = "Мика! Ты в порядке?"
10046080-49 = "Это из-за взрыва? Ты выглядишь совсем ошеломлённой."
10046080-50 = "Н-Наги..."
10046080-51 = "Нет, это, то есть..."
10046080-52 = "Мне так жаль, Мика."
10046080-53 = ""
10046080-55 = ""
10046080-56 = "...А?"
10046080-57 = "Почему ТЕБЕ нужно извиняться?"
10046080-58 = ""
10046080-60 = ""
10046080-61 = "Ну, пусть я и не собиралась взрывать наш отпуск, кнопку ведь нажала именно я, разве нет?"
10046080-62 = "Я уничтожила все плоды твоего труда. Пожалуйста, прости меня."
10046080-63 = "Нет-нет! Всё не так! Ты правда... и это всё, что ты скажешь?"
10046080-64 = "О чём ты? Я что-то упустила?"
10046080-65 = "Ну, вилла же взорвалась, да?"
10046080-66 = "Похоже на то."
10046080-67 = "А на самом деле это моя вина. Ты ведь знаешь."
10046080-68 = "Разве тебе не хочется узнать всю историю? Ну, после того как посадишь всех под замок, допросишь и будешь пытать чёрствой выпечкой?"
10046080-69 = ""
10046080-71 = ""
10046080-72 = "...За кого ты вообще меня принимаешь, Мика?"
10046080-73 = "Как я могу винить тебя? Это я так неосторожно нажала кнопку, просто чтобы удовлетворить любопытство. Ты ведь не заставляла меня."
10046080-74 = "...Конечно, мне интересно, почему под виллой были закопаны бомбы и почему детонатор оставили на видном месте."
10046080-75 = "Но сейчас это не главное."
10046080-76 = "Мика."
10046080-77 = ""
10046080-80 = ""
10046080-81 = "Я заметила, что весь день после обеда ты вела себя странно."
10046080-82 = "А теперь понимаю. Всё это время ты тушила десятки маленьких пожаров вроде этого. Думаю, ты заслуживаешь отдыха больше, чем я — объяснений."
10046080-83 = "...Ты веришь мне?"
10046080-84 = "Да?"
10046080-85 = "Ну, то есть... это же я."
10046080-86 = "Я порчу всё, к чему прикасаюсь, и была такой жестокой со всеми."
10046080-87 = "И ты всё ещё веришь мне? Что я хорошая? Что правда старалась и ничего не замышляла?"
10046080-88 = "Ох, ну серьёзно... Ты что, глупая, Мика? Хотя не отвечай. Я и так знаю."
10046080-89 = ""
10046080-91 = ""
10046080-93 = ""
10046080-94 = "Конечно, я тебе верю."
10046080-95 = ""
10046080-97 = ""
10046080-98 = "...*всхлипывает*"
10046080-100 = "...*всхлип* Ва-а-а!!"
10046080-101 = "М-Мика?! Почему ты плачешь на мне?!"
10046080-102 = "Но, Наги, ты... Ты— Ва-а!"
10046080-103 = ""
10046080-107 = "Мика."
10046080-108 = ""
10046080-111 = "...Да."
10046080-114 = "Ты закончила?"
10046080-115 = "...Ага."
10046080-116 = "Ох, какая ты занятая. Сначала столько работы, потом ложь, а теперь ещё и слёзы..."
10046080-117 = "Как всегда, с тобой хлопот не оберёшься."
10046080-118 = "...Тебя это тоже касается, Нагиса."
10046080-119 = ""
10046080-121 = ""
10046080-122 = "Прошу прощения?!"
10046080-123 = "Не пытайся перевести стрелки и отмахнуться. Эта маленькая принцесса плачет по любому поводу. Переживёт."
10046080-124 = "Вы дружите целую вечность. Уже разберитесь наконец."
10046080-125 = ""
10046080-127 = ""
10046080-129 = ""
10046080-130 = "Эм, Наги—"
10046080-131 = "Эм, Мика—"
10046080-132 = "А, говори ты."
10046080-133 = "Нет, ты первая."
10046080-134 = "..."
10046080-135 = "..."
10046080-136 = ""
10046080-139 = ""
10046080-140 = "...? Я тупею просто от того, что это слушаю."
10046080-141 = "Ох, до чего докатилась Тринити. За столом Чаепития сидят две законченные идиотки."
10046080-142 = "П-Погоди! Нечестно! Будто ты сильно отличаешься!"
10046080-143 = "Очевидно, самая умная здесь я, потому что, похоже, только меня волнует НАСТОЯЩАЯ проблема."
10046080-144 = "«Настоящая проблема»?"
10046080-145 = "Да, Мика. Вполне насущная проблема: нам больше негде спать."
10046080-146 = "Ах."
10046080-148 = "Ах."
10046080-149 = "[s] «А.»"
10046080-150 = "Точно. ...Так что хватит рыдать, лучше поставим палаточный лагерь."
10046080-151 = ""
10046080-154 = ""
10046080-155 = "Эм, Сэя, если у тебя найдётся минутка..."
10046080-156 = "Прости, что перебиваю, но мы не брали палатки."
10046080-157 = "Можно съездить в город и поискать ещё открытый магазин, но, пожалуй, в такой ситуации лучше забронировать—"
10046080-158 = "Нет, всё нормально. У меня есть палатки в багажнике."
10046080-159 = ""
10046080-161 = ""
10046080-162 = "Пока что можешь поселиться в одной палатке с Ичикой? Я взяла только две большие, так что, наверное, лучше разделиться по кружкам."
10046080-163 = "Сенсей, если не возражаете, можете взять мою личную палатку. Она будет полностью вашей — в каком-то смысле настоящая роскошь."
10046080-164 = "[s1] «Эм, я благодарен, но...»\n[s2] «Ты взяла три палатки...?»"
10046080-165 = ""
10046080-166 = ""
10046080-168 = ""
10046080-169 = "...? Разве не нужно всегда быть готовой? Никогда не знаешь, когда окажешься где-нибудь в затруднительном положении."
10046080-170 = "Вообще-то у меня достаточно припасов примерно на две недели. Спасательной группе этого времени хватит с запасом."
10046080-171 = "Очень в духе Сэи... всегда мыслит нестандартно и готова ко всему."
10046080-172 = "Хи-хи. Назовём это «женской интуицией»."
10046080-173 = "Ладно, Хасуми, Ичика... и Сенсей."
10046080-174 = "Поможете мне поставить палатки?"
10046080-175 = ""
10046080-177 = ""
10046080-179 = ""
10046080-180 = "Давайте дадим Мике и Наги немного пространства поговорить."
10046080-183 = "Мы поставили палатки из багажника Сэи и приготовились ко сну."
10046080-184 = "Удивительно, но Нагисе, похоже, понравилась ночь под открытым небом."
10046080-189 = "Позже, когда все стихли..."
10046080-194 = "Эм, Сенсей? Вы спите?"
10046080-195 = "[ns3] «Нет, заходи.»\n[ns4] «Да, крепко сплю.»"
10046080-198 = "Ну, раз вы не спите... одну минутку."
10046080-199 = ""
10046080-202 = ""
10046080-203 = "...Как я и думала. Знаю, вдвоём здесь немного тесно. Надеюсь, вы не против."
10046080-204 = "Похоже, сон ускользает и от вас. Неудивительно — день был насыщенным."
10046080-205 = "«Откуда у Золушки взялись мыши?»"
10046080-206 = "И вот у нас счастливый финал, несмотря на историю, которая привела нас сюда. Забавная история, но чем дольше настаивается, тем горче становится."
10046080-207 = "Эту историю никто не хочет вспоминать, но кто-то должен помнить."
10046080-208 = "Возможно, вы уже знаете, но изначально место Нагисы должна была занять я."
10046080-209 = "Разве это не странно? Она кажется идеальной хозяйкой, сдержанным лидером, невозмутимым управляющим."
10046080-210 = "Так почему же когда-то давным-давно руководить изначально выбрали меня?"
10046080-211 = ""
10046080-213 = "Причина проста."
10046080-214 = "«Мыши превратились в лошадей и потянули карету.»"
10046080-215 = ""
10046080-217 = "То, что вы видели раньше, — настоящая Кирифуджи Нагиса."
10046080-218 = "Леди, которая никогда не теряет самообладания, но при этом умеет находить радость даже в повседневном хаосе."
10046080-221 = "...Знаю, в это трудно поверить. Она стала довольно... одинокой в своей позолоченной конюшне, окружённая ответственностью."
10046080-222 = "Мы не особенно близки. Возможно, в другом мире всё было бы иначе, но здесь не сложилось."
10046080-223 = "В итоге Нагиса очень долго тянула нашу карету, надрываясь, пока принцесса не добралась до замка. ...Пока кто-то не получил свой счастливый конец."
10046080-224 = "...Карета прибыла, но лошадь потеряла своё истинное «я». Путешествие изменило её."
10046080-225 = "Эта поездка на пляж была в каком-то смысле искуплением, но она не может длиться вечно."
10046080-226 = "Я боюсь, что если хотя бы иногда не буду видеть «настоящую Нагису», однажды она исчезнет навсегда."
10046080-227 = "...И у неё есть веские причины быть настороже."
10046080-228 = "А, я знаю, слишком тяжёлая тема для такой лёгкой летней ночи. Я не хотела об этом говорить."
10046080-229 = "...Но у меня больше нет ни причины, ни сил это скрывать."
10046080-230 = "[s5] «Ты говорила с Нагисой?»\n[s6] «Может, она сама хочет перемен.»"
10046080-231 = ""
10046080-232 = ""
10046080-234 = ""
10046080-235 = "...Вы шутите? Нет. Я не спрашивала. Не смогла. Стыд отличает нас от животных."
10046080-236 = "[s] «Тогда просто знай: всё будет хорошо.»"
10046080-237 = "Вы говорите с такой уверенностью. Откуда она?"
10046080-238 = "[s7] «Это секрет.»\n[s8] «Спойлеров лучше избегать.»"
10046080-241 = "...!"
10046080-242 = "Хи-хи, очень ловко. Да, я ведь говорила вам, что заранее знать всё — проклятие."
10046080-243 = "Значит, вы хотите сказать, что эту историю стоит пережить самой?"
10046080-244 = "[s9] «Может да, а может и нет?»\n[s10] «Она особенная, но обычная.»"
10046080-247 = "...Загадочные речи обычно МОЯ территория, Сенсей."
10046080-248 = "Но я вас услышала... Понимаю. Без спойлеров."
10046080-249 = "И всё же после ваших слов я с нетерпением жду, как развернётся эта история."
10046080-250 = ""
10046080-255 = "Погоди, Сэя! Иди сюда!"
10046080-256 = "Наги с ума сошла! Она три раза подряд вытянула джокера!"
10046080-257 = "Хи-хи, Мика... Ты забыла, почему меня называли «ангельской рукой»?"
10046080-258 = ""
10046080-260 = ""
10046080-261 = "...Ох, снаружи шумно."
10046080-262 = "Похоже, им весело."
10046080-263 = "Что ж, не буду заставлять их ждать."
10046080-267 = "Сэя! Ты опоздала!"
10046080-268 = "О, думаешь, Сэя тебе поможет? И всё же я, как говорится, «вытру тобой пол»."
10046080-271 = "Карты? Как скучно и банально."
10046080-272 = ""
10046080-274 = ""
10046080-275 = "Что за высокомерный тон?"
10046080-276 = "Ха. Наверное, карты могут развлекать стариков, но как насчёт перейти в нынешний век?"
10046080-277 = ""
10046080-279 = ""
10046080-280 = "Это портативная игровая консоль. Уверена, вы о такой никогда не слышали."
10046080-281 = "Мы знаем, что такое видеоигры! Правда, Наги?"
10046080-282 = ""
10046080-285 = ""
10046080-286 = "К-Конечно! Это, эм, занятие в помещении, которым многие наши студенты увлекаются... для отдыха? Верно?"
10046080-287 = "Как... необычно. Сэя, ты что, своего рода... геймерша?"
10046080-289 = "Это был подарок... от одной девушки из Миллениума."
10046080-290 = "Погоди, у тебя есть ДРУГИЕ друзья?"
10046080-291 = ""
10046080-293 = ""
10046080-294 = "Что? Мне послышалось? У меня много друзей. Мне так жаль, что вы двое не можете этим похвастаться."
10046080-295 = "Хм? Тогда почему ты каждые выходные сидишь в своей комнате?"
10046080-296 = "Есть огромная разница между тем, чтобы по своей воле не иметь плотного расписания, и тем, чтобы быть не способной его составить."
10046080-297 = ""
10046080-300 = ""
10046080-301 = "Занимательно. Раз уж мы говорим о дружбе, то я тоже—"
10046080-302 = ""
10046080-305 = ""
10046080-306 = "Наги... Прости, но ты не считаешься."
10046080-307 = "Со всем уважением и извинениями, Мика права."
10046080-308 = ""
10046080-311 = "Прошу прощения?!"
10046080-312 = ""
10046080-314 = ""
10046080-316 = "Что, простите? У меня есть друзья! Десятки!"
10046080-317 = "О, ты про свой фан-клуб?"
10046080-318 = "Нагиса, они не считаются друзьями. Это последователи."
10046080-319 = "Ого, Сэя. Жестковато, да?"
10046080-320 = "Нагисе давно пора взглянуть правде в глаза."
10046080-321 = ""
