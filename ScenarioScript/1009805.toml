[translation]
1009805-1 = "Геройская схватка"
1009805-3 = "А, Сенсей! Сюда, сюда."
1009805-4 = "Вы и правда пришли. Спасибо!"
1009805-5 = "[s1] «Ты пришла сюда одна, Хошино?!»\n[s2] «Здесь могут быть бандиты в шлемах!»"
1009805-8 = "Кто сказал, что я одна, м?"
1009805-9 = "У меня ведь есть мой надёжный напарник!"
1009805-10 = "[s] «О? Наконец-то приняла эту роль?»"
1009805-11 = "Вы всё звали меня «героем», вот, наверное, и заразили."
1009805-12 = "Да и то, что я всё время хожу в этой форме, тоже повлияло. По крайней мере, смущение уже немного прошло."
1009805-13 = "Хех. Ладно, хватит об этом. Я уже краснеть начинаю."
1009805-14 = "Хотите немного прогуляться со мной по торговому району?"
1009805-15 = "А? Почему вы так насторожились, Сенсей?"
1009805-16 = "Я знаю, что наговорила про врагов и тайные базы, но подтвердить слухи о том, что они тут ошиваются, мне так и не удалось."
1009805-17 = "Так что давайте просто расслабимся."
1009805-18 = "[s] «Хм, значит, вот она — повседневная жизнь героя.»"
1009805-20 = "[ns] «Маскироваться под обычного гражданина — тоже важная обязанность героя!»"
1009805-21 = "Хех, по-моему, это уже притянуто за уши, Сенсей. Теперь вы слишком стараетесь."
1009805-22 = "Ну, если вас это радует."
1009805-23 = ""
1009805-25 = ""
1009805-26 = "Ладно! Вперёд!"
1009805-27 = ""
1009805-29 = ""
1009805-34 = "Добро пожаловать! Осматривайтесь сколько хотите!"
1009805-35 = "Хе-хе. Тут столько милых вещей."
1009805-36 = ""
1009805-38 = ""
1009805-39 = "Смотрите, Сенсей. Кошелёк для монет в форме кита!"
1009805-40 = "Наверное, неплохо будет смотреться на моём жилете... вот здесь."
1009805-41 = "[s] «Я куплю его тебе.»"
1009805-42 = ""
1009805-44 = ""
1009805-45 = "А? Нет-нет! Я вовсе не пыталась—"
1009805-46 = "А? Герою нужен талисман?"
1009805-47 = "Опять вы говорите странные вещи, но..."
1009805-48 = ""
1009805-50 = ""
1009805-51 = ""
1009805-52 = "Я с благодарностью приму его, Сенсей."
1009805-53 = ""
1009805-55 = ""
1009805-56 = "Как мило!"
1009805-60 = "М-м-м... Пахнет вкусно."
1009805-61 = "А, это ресторанная улочка."
1009805-62 = "Может, открытых заведений тут осталось немного, но те, что выжили, — настоящие скрытые жемчужины."
1009805-63 = "Избранные!"
1009805-64 = "[s] «Кстати, уже время обеда.»"
1009805-65 = "А, и правда!"
1009805-66 = "Тут в основном одни уличные лавки, так что можно набрать много разной еды."
1009805-67 = ""
1009805-69 = ""
1009805-70 = "Начнём с такояки!"
1009805-73 = "Хех, торговый район — отличное место! Можно одновременно и закупиться, и набить живот!"
1009805-74 = "Вам нравится, Сенсей?"
1009805-75 = "[s] «Конечно!»"
1009805-77 = "[ns] «Я полностью погрузился в повседневные занятия героя.»"
1009805-78 = "Повседневные занятия... Ну, технически вы не ошибаетесь."
1009805-79 = "Хех. Мне очень нравится проводить с вами это время—"
1009805-80 = ""
1009805-85 = ""
1009805-86 = "...Сенсей. Посмотрите туда."
1009805-87 = ""
1009805-89 = ""
1009805-91 = ""
1009805-92 = "Давайте возьмём сэндвич..."
1009805-93 = "А, и ещё напитки..."
1009805-94 = ""
1009805-96 = ""
1009805-98 = "Банда Шлемов."
1009805-99 = "Посмотрим, что они будут делать. Пока не похоже, чтобы они что-то замышляли."
1009805-101 = "Сдачи не надо! Пока!"
1009805-102 = "Ой! Большое спасибо! Всего доброго!"
1009805-103 = ""
1009805-105 = ""
1009805-107 = "Они даже сдачу оставили...?"
1009805-108 = "На них совсем не похоже. Тут точно что-то нечисто."
1009805-109 = "[s] «Проследим за ними?»"
1009805-110 = "...Наверное, это хорошая идея."
1009805-111 = "Только держитесь подальше, чтобы нас не заметили."
1009805-125 = ""
1009805-126 = "Ну наконец-то! Я уж думал, с голоду помру, пока ты вернёшься!"
1009805-127 = "Прости-прости! Задержалась, пока покупала всё это."
1009805-128 = "Да ладно. Давай просто поедим и вернёмся к работе."
1009805-129 = "У нас ещё никогда не было такого стабильного источника дохода! Надо выжать из него максимум!"
1009805-131 = ""
1009805-132 = "Поняла!"
1009805-133 = ""
1009805-135 = ""
1009805-137 = "Это... наше старое школьное здание."
1009805-138 = "Оно было так глубоко погребено под песком... Когда его успело откопать?"
1009805-139 = "[s] «Может, последняя песчаная буря как раз его и обнажила?»"
1009805-140 = "Возможно..."
1009805-141 = "Теперь понятно. Банда Шлемов случайно наткнулась на него и решила воспользоваться возможностью."
1009805-142 = "Вот откуда у них в последнее время деньги на покупки и дорогое снаряжение. Другие части района они не трогали просто потому, что не было нужды."
1009805-143 = "Они продавали вещи, найденные в этом откопанном школьном здании — как те, кто пытался украсть нашу доску объявлений."
1009805-144 = ""
1009805-146 = ""
1009805-147 = "Мы ведь не можем позволить этим придуркам творить всё, что им вздумается, правда, Сенсей?"
1009805-148 = "[s] «Герой собирается действовать?!»"
1009805-153 = ""
1009805-156 = "Хм?"
1009805-157 = "Вы это слышали?"
1009805-158 = "Там кто-то есть?"
1009805-159 = "Нарушитель? Или другая группировка пытается захватить нашу территорию?"
1009805-160 = "Да без разницы, кто это. Сейчас я им наваляю—"
1009805-161 = ""
1009805-164 = ""
1009805-165 = ""
1009805-167 = ""
1009805-174 = ""
1009805-175 = ""
1009805-177 = ""
1009805-178 = ""
1009805-180 = ""
1009805-182 = "Хех. Хех."
1009805-184 = "О-Они уложили капитана...!"
1009805-185 = "Кто ещё на ногах — бегите!"
1009805-186 = ""
1009805-188 = ""
1009805-189 = "Эй, не бросайте меня!"
1009805-190 = ""
1009805-192 = ""
1009805-193 = ""
1009805-195 = ""
1009805-196 = "Я даже ничего сказать не успела."
1009805-197 = "Эх, думаю, урок они усвоили."
1009805-198 = "[s] «Это Герой Абидоса! Ты потрясающая!»"
1009805-199 = "Вы опять меня смущаете, Сенсей."
1009805-200 = "Ещё одно дело раскрыто. Хорошая работа, Сенсей."
1009805-201 = "А? Думаете, теперь какое-то время будет тихо?"
1009805-202 = "Очень надеюсь, но здесь никогда не угадаешь."
1009805-203 = "Такое случается постоянно. И будет случаться дальше, пока Абидос не сможет нормально обезопасить район."
1009805-204 = "[s] «Ого! Значит, ты сможешь и дальше быть героем!»"
1009805-205 = "..."
1009805-206 = "Вообще-то этого я и ожидала. Хех."
1009805-207 = "И снова вы не ошиблись."
1009805-208 = "Пожалуй, ещё немного похожу в этой форме."
1009805-209 = "А это значит..."
1009805-210 = "[s] «...Значит?»"
1009805-211 = "Вам придётся и дальше быть моим напарником."
1009805-212 = "Хех, я не позволю вам так просто отвертеться."
1009805-213 = ""
1009805-217 = "[ns] «Я бы и не хотел иначе!»"
1009805-218 = "Ага! Мой надёжный напарник!"
1009805-219 = "Тогда вернёмся в торговый район. Есть ещё несколько мест, куда я хочу заглянуть."
1009805-220 = ""
1009805-222 = ""
1009805-223 = ""
1009805-224 = "Думаю, по дороге ещё захвачу сахарной ваты!"
