10038050-123 = "[s] «...»"
10038050-124 = "...Да, для тебя это первая встреча с Сенсеем. Думаю, как и для половины студентов здесь."
10038050-125 = "Так ты сама представишься или мне избавить тебя от хлопот, Шинтани Кай?"
10038050-126 = ""
10038050-129 = ""
10038050-130 = "*ахает*"
10038050-131 = "Это и есть Шинтани Кай, о которой я слышала? Та, что руководила Обществом Восточной Алхимии, пока не свихнулась?"
10038050-133 = "Твоя учтивость становится довольно ядовитой, Кисаки."
10038050-134 = "Прежняя ты сказала бы, что даже яд может стать лекарством — смотря как его использовать."
10038050-135 = "И прежняя я была бы права... Но сейчас лучше говорить прямо."
10038050-136 = ""
10038050-138 = ""
10038050-139 = "Добро пожаловать. Участницы Генрюмона. Сенсей."
10038050-140 = "Меня зовут Шинтани Кай. Меня насильно и довольно произвольно сделали одной из Семи Узников."
10038050-142 = "[ns] «...!»"
10038050-143 = "Шаньхайцзин изгнал меня и попытался забыть..."
10038050-144 = "...Но я никогда не забывала Шаньхайцзин. И Общество."
10038050-145 = "А теперь посмотри на меня, Кисаки. Мой долгий путь домой наконец завершён."
10038050-146 = ""
10038050-148 = ""
10038050-150 = ""
10038050-151 = "Так каков твой план?"
10038050-152 = "Вернуть то, что принадлежит мне, разумеется."
10038050-153 = "Общество Восточной Алхимии тебе не принадлежит."
10038050-154 = "Это по-твоему."
10038050-155 = "И чего ты надеешься добиться, забрав его?"
10038050-156 = "Разве не очевидно? Довести зелье до совершенства."
10038050-157 = "И ради этого заставить бесчисленное множество студентов страдать."
10038050-158 = "Только пока зелье не будет закончено. Потом всё можно вернуть как было. Это уже произошло бы, если бы ты не вмешалась."
10038050-159 = ""
10038050-161 = ""
10038050-163 = "Именно ты встала у меня на пути. Всё это произошло из-за тебя, Кисаки."
10038050-164 = "Но я не лишена жалости и сострадания."
10038050-166 = "О? Вот уж неожиданность."
10038050-167 = "Кех-хе, кех-хе... Но хватит обо мне. Как ты? Наверняка ты уже довела своё бедное тело до предела."
10038050-168 = "*ахает*"
10038050-169 = "Наверное, думаешь, откуда я знаю. Но разумеется, я знаю. Как я могла не знать?"
10038050-170 = "Я могу вылечить тебя, Кисаки."
