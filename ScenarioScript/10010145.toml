10010145-18 = "Хм? Я не узнала о случившемся из соцсетей?#nВообще-то новости я предпочитаю читать в газете."
10010145-19 = "Хотя они изначально решили не освещать это мероприятие.#nУчитывая тему, неудивительно."
10010145-20 = "Наверное, так даже лучше, но кое-что меня всё ещё беспокоит."
10010145-21 = "Хм? Разве не очевидно, что именно?"
10010145-22 = "Я потратила на этот инцидент столько драгоценного времени..."
10010145-23 = "А в итоге беспомощно переживала за человека, которого только встретила.#nЭто ужасно вымотало."
10010145-24 = "Я рада, что всё в итоге разрешилось, но не могу не думать, что было бы, если бы всё пошло не так..."
10010145-25 = "Ух. Ненавижу зацикливаться на «а что если». Вот почему я не люблю связываться с посторонними."
10010145-26 = "Мне всегда приходится водить их за руку и показывать, как всё делать правильно,#nа они всё равно в конце находят способ всё испортить.#nСтолько бесполезных переживаний..."
10010145-27 = "Почему никто никогда не думает о моих чувствах? Вечно только «я, я, я...»#nА в итоге именно я не сплю из-за их проблем."
10010145-28 = "*вздох* Что я вообще говорю? Простите, что вам пришлось видеть меня такой, Сенсей."
10010145-29 = "Н-Не обращайте внимания. Я просто ворчала."
10010145-30 = "Наверное, я пытаюсь сказать..."
10010145-31 = "...именно поэтому я держусь сама по себе."
10010145-32 = "[s1] «Мне кажется, ты добрый человек, Уи.»\n[s2] «Твоему чувству ответственности нет равных.»"
