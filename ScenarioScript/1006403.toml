[translation]
1006403-1 = "Колокола Нового года"
1006403-2 = ""
1006403-3 = ""
1006403-4 = "О, Сенсей! Я вас ждала."
1006403-5 = "[s] «Прости, что опоздал, Каёко. Поезд задержался...»"
1006403-6 = "Всё нормально. Я всё равно ждала недолго."
1006403-7 = "К тому же колокола начинают звонить поздно, ближе к полуночи. Даже если пойдём сейчас, времени хватит."
1006403-8 = "Далеко отсюда?"
1006403-9 = "Хм... Довольно далеко: от центра города до промежуточной станции на окраине придётся около часа ехать на метро..."
1006403-10 = "Назад будем возвращаться довольно поздно, но сегодня есть дополнительные поезда, так что, наверное, всё будет нормально."
1006403-11 = "Кстати... Вы готовы?"
1006403-16 = "Час спустя..."
1006403-17 = "*пых* *пых*... Здесь гора удалённее, чем я думала."
1006403-18 = "Простите, Сенсей. Тяжело было идти в моём темпе, да?"
1006403-19 = "Подниматься на гору в кимоно оказалось неудобнее, чем я думала..."
1006403-20 = "[s] «Ничего. Тропа всё равно была не слишком сложной.»"
1006403-21 = "Но хорошо, что мы успели, потому что колокола вот-вот начнут звонить..."
1006403-22 = ""
1006403-25 = "...О, ничего себе? Почему здесь так мало людей?"
1006403-26 = "Вы пришли посмотреть церемонию новогоднего звона колокола...?"
1006403-27 = "Да, но других гостей будто бы совсем нет..."
1006403-28 = "В этом году колокольня в плохом состоянии, поэтому церемонию новогоднего звона пришлось отменить..."
1006403-29 = "Поскольку это удалённый храм без постоянных посетителей, мы смогли уведомить только местных жителей..."
1006403-30 = "Мне жаль говорить, что вы проделали весь этот путь напрасно..."
1006403-31 = "Ах, чёрт... Я правда хотела послушать колокола и завершить здесь год..."
1006403-32 = "[s1] «Ничего не поделать, от нас это не зависело.»\n[s2] «Попробуем в следующем году.»"
1006403-33 = "Ага..."
1006403-34 = "Ага..."
1006403-37 = "...Что? Последний поезд уже ушёл?!"
1006403-38 = "Я была уверена, что по прошлогоднему расписанию у нас ещё есть время на последний поезд..."
1006403-39 = "Так было в прошлом году, но в этом году другие мероприятия поблизости тоже отменили, поэтому... решили не запускать дополнительные рейсы."
1006403-40 = "К сожалению, похоже, вам придётся подождать до завтра, когда придёт первый поезд."
1006403-41 = ""
1006403-43 = ""
1006403-44 = "А-а-а, ну хуже уже некуда..."
1006403-45 = "Простите, Сенсей. Этого бы не случилось, если бы я заранее всё лучше проверила..."
1006403-46 = "Простите, что втянула вас в такую ситуацию."
1006403-47 = "[s] «Нет-нет. Отчасти это и потому, что я опоздал...»"
1006403-48 = "В любом случае, что делать? Станция в глуши, здесь ни места для отдыха, ни каких-либо удобств, чтобы скоротать время..."
1006403-49 = "[s3] «Как сказал сотрудник станции...»\n[s4] «Похоже, выбора нет — придётся ждать первого поезда в зале ожидания.»"
1006403-50 = "...Да, давайте просто посидим здесь несколько часов."
1006403-51 = "...Да, давайте просто посидим здесь несколько часов."
1006403-54 = ""
1006403-55 = ""
1006403-56 = "Хм..."
1006403-57 = "[s] «Каёко, тебе не холодно?»"
1006403-58 = "Да, всё нормально. Это кимоно теплее, чем я думала."
1006403-59 = "А вы, Сенсей? Вам не холодно?"
1006403-60 = "[s5] «Всё нормально, сегодня вроде довольно тепло.»\n[s6] «Я тоже в порядке.»"
1006403-61 = "...Понятно."
1006403-62 = "...Понятно."
1006403-63 = ""
1006403-65 = ""
1006403-66 = "...Наверное, стоило взять портативную колонку, чтобы мы могли послушать музыку."
1006403-67 = "Я привыкла находиться среди болтливых товарищей, поэтому такая тишина немного давит."
1006403-68 = "[s] «Кстати, Каёко, ты ведь всегда слушала музыку.»"
1006403-70 = "[ns] «Когда ты увлеклась этим?»"
1006403-71 = "Хм, дай подумать... Наверное, ещё до того, как я пришла в офис «Проблема 68»..."
1006403-72 = "И тогда, и сейчас я проводила дни среди шумных людей."
1006403-73 = "Тогда вокруг постоянно были звуки, которые мне не хотелось слышать, поэтому я начала слушать музыку, чтобы отгородиться от реальности и заглушить их."
1006403-74 = "Но шум, с которым я столкнулась после вступления в «Проблему 68»... наверное, не так уж плох."
1006403-75 = "Хи-хи... Приятно, что причин слушать музыку стало меньше."
1006403-77 = "После этого мы с Каёко ещё долго разговаривали о других участниках «Проблемы 68»."
1006403-78 = ""
1006403-79 = "...Ого, вы только посмотрите на время."
1006403-80 = "Разговаривая с вами, Сенсей, я совсем забыла, как быстро оно идёт."
1006403-81 = ""
1006403-84 = "А? Это звук колокола...?"
1006403-87 = "― Уже почти время первого поезда.[wa:780]"
1006403-90 = "― Это не тот звук, на который мы надеялись, но...[wa:1400]"
1006403-92 = "― и он тоже неплох."
1006403-95 = "― В отличие от ежегодных колоколов в конце года...[wa:880]"
1006403-97 = "― колокол первого поезда можно услышать каждое утро.[wa:1130]"
1006403-100 = "― Но даже первый день Нового года...[wa:10]"
1006403-102 = "― всего лишь ещё один день."
1006403-105 = "― Поэтому, возможно, то, что мы только что услышали...[wa:10]"
1006403-107 = "― лучший звук для такого дня."
1006403-110 = "― За ещё один прекрасный год.[wa:680]"
1006403-112 = "― С Новым годом, Сенсей.[wa:1430]"
1006403-115 = "*вздыхает*... Как-то мы всё-таки вернулись."
1006403-116 = "Спасибо, что провели со мной всю ночь. Это мог быть худший Новый год в жизни, но с вами всё стало гораздо лучше."
1006403-117 = "[s] «Мне тоже понравилось разговаривать с тобой, Каёко.»"
1006403-118 = "Теперь осталось только отоспаться после бессонной ночи... но, похоже, до здания, где находится офис «Проблемы 68», мне ещё довольно долго добираться..."
1006403-119 = "...Сенсей, если вы не против, можем пойти в Шале и немного поспать?"
1006403-120 = "Я посоветую музыку, которая помогает крепко уснуть. Даже вы заслуживаете выходной в первый день Нового года, Сенсей."
1006403-122 = "После этого мы с Каёко вернулись в Шале и отоспались."
