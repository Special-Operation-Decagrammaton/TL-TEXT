[translation]
62040-1 = "Эпизод 4;Да настигнет тебя кара"
62040-2 = ""
62040-3 = ""
62040-5 = "[ns] «Мине!!»"
62040-6 = "К-Капитан!"
62040-7 = "Капитан! *рыдает*"
62040-8 = "Ханаэ? Нужно обеспечить проходимость дыхательных путей! Дыхание, похоже, стабилизируется!"
62040-9 = "Поняла! Я ослаблю одежду вокруг шеи и талии... и принесу носилки!"
62040-10 = "Да! Пожалуйста!"
62040-11 = ""
62040-13 = ""
62040-15 = "Вы... это слышали?"
62040-16 = "Ты тоже слышала? Она ТОЧНО только что сказала «Рыцари исправительного курса», да?"
62040-17 = ""
62040-19 = ""
62040-21 = "Так эти волонтёры... были из Тринити?"
62040-22 = "Та «капитан»... Она была там! Она была там в тот день, когда исчезла Мадам!"
62040-23 = "Ты её видела?! Какая она была?"
62040-24 = "Ну..."
62040-27 = ""
62040-28 = ""
62040-39 = "С этого момента ваша задача — быстро спасать и лечить всех врагов, которых я раню."
62040-42 = "И-Ик...! И-и-и-и-и-и...!!!"
62040-43 = "Ч-Что случилось?!"
62040-44 = ""
62040-48 = "[log]Горе![/log]"
62040-52 = "[log]Горе![/log]"
62040-56 = "[log]Горе![/log]"
62040-59 = "[log]Горе живущим на земле,[/log]"
62040-63 = "[log]из-за трубных гласов, которые вот-вот прозвучат#nот трёх других ангелов.[/log]"
62040-65 = "!!!"
62040-66 = "!!!"
62040-68 = "Что... это было?"
62040-69 = "Этот громкий голос шёл прямо с неба?!"
62040-71 = "«Горе живущим на земле»...?"
62040-72 = "«Из-за трубных гласов, которые вот-вот прозвучат от трёх других ангелов»...?"
62040-73 = ""
62040-78 = "*ахает*"
62040-79 = ""
62040-81 = ""
62040-83 = "Неужели... ЭТО?"
62040-84 = "Да быть не может! Это же просто история из «Откровения»...!"
62040-86 = "Но это же ТО САМОЕ Откровение! Ну, то, во что верит Ариус..."
62040-87 = "Разве это не значит, что прямо здесь, в этом месте...?"
62040-88 = ""
62040-92 = "Да! Тогда мы знаем и что это за существа."
62040-93 = "Должно быть, это Ангелы Откровения!"
62040-94 = "Они предвестники конца света!"
62040-96 = "[ns1] «Что это вообще было?»\n[ns2] «Кто-нибудь из вас знает?»"
62040-99 = "..."
62040-100 = "..."
62040-101 = "Это может быть...!"
62040-102 = "Невозможно. Это... должно быть..."
62040-103 = "[s] «Ацуко?»"
62040-104 = "..."
62040-105 = "Прости, Сенсей. Пока у меня лишь догадки."
62040-106 = "Но разве сейчас нашим приоритетом не должна быть эвакуация Рыцарей исправительного курса в безопасное место?"
62040-107 = "[s] «...! Серина! С Мине всё в порядке?»"
62040-108 = ""
62040-110 = ""
62040-111 = "Да, Сенсей! Её состояние не критическое! Но..."
62040-112 = "С-Серина? Сенсей...?"
62040-113 = ""
62040-118 = ""
62040-119 = "[ns] «Отряд Ариус!»"
62040-121 = "...! Поняла, Сенсей. Мисаки! Пробиваем путь!"
62040-122 = "Тц."
62040-124 = "П-Простите... но не могли бы вы дать нам пройти...?"
62040-125 = ""
62040-128 = ""
62040-129 = ""
62040-130 = "Субару...?"
62040-131 = ""
62040-133 = ""
62040-134 = ""
62040-135 = "..."
62040-136 = "Всем отступить."
62040-137 = "По крайней мере пока."
62040-138 = ""
62040-141 = ""
62040-142 = ""
62040-143 = "Поняла, Субару."
62040-149 = ""
62040-150 = "[ns] «Спасибо. Всем вам»."
62040-151 = "Не стоит. Я рада, что у нас была возможность помочь."
62040-152 = "Да. И Рыцарям исправительного курса тоже."
62040-154 = "С-Спасибо..."
62040-155 = "Я думала, нам конец..."
62040-156 = ""
62040-158 = ""
62040-159 = "[ns] «И тебе тоже, Сена»."
62040-161 = ""
62040-162 = "Я лишь следовала стандартному протоколу реагирования на чрезвычайные ситуации."
62040-163 = "Я также рада снова работать вместе с Рыцарями исправительного курса."
62040-164 = ""
62040-166 = ""
62040-167 = "Но она..."
62040-168 = "Сена..."
62040-170 = "..."
62040-171 = "[s] «Что такое, Сена...?»"
62040-172 = "Хм. Как бы это сказать...?"
62040-173 = "Для начала: с её текущим физическим состоянием медицинских проблем нет. Я это подтвердила."
62040-174 = "Судя по времени, указанному в отчёте, она уже должна была прийти в сознание, но пока это просто наблюдение, которое стоит учитывать."
62040-175 = "Однако..."
62040-176 = "Поймите меня правильно, Сенсей. То, что я сейчас скажу, основано не на каких-либо данных, а лишь на моей интуиции."
62040-177 = "В каком-то смысле это итог всех данных, накопленных мной за долгие годы работы в полевых условиях."
62040-178 = "У меня плохое предчувствие."
62040-180 = "...!"
62040-181 = "К-Капитан! *рыдает*"
62040-182 = "Могу ли я сказать что-то конкретнее? Простите, но это трудно объяснить."
62040-183 = "Но всё же..."
62040-184 = "Интуиция подсказывает мне, что путь Мине к выздоровлению будет долгим."
62040-185 = "...Пока что мы будем поддерживать её жизненные показатели стабильными и лечить симптомы по мере их появления."
62040-186 = "Понятно. Я провожу вас в главный корпус Рыцарей исправительного курса."
62040-187 = "Н-Но разве для вас это не будет немного опасно...?"
62040-188 = "Мне не впервой. Давай—"
62040-189 = ""
62040-193 = "Сэн... сэй?"
62040-194 = "!"
62040-196 = "!!"
62040-197 = "Капитан! Вы в порядке?!?!"
62040-198 = ""
62040-200 = ""
62040-202 = ""
62040-203 = "...Прости, Ханаэ. В ушах не перестаёт звенеть. Если можешь, пожалуйста..."
62040-204 = "А-Ах! Простите...!"
62040-205 = "Т-Так лучше?"
62040-207 = "Да. Спасибо за заботу. И Сена?"
62040-208 = "Говорите."
62040-209 = "Вы были правы. Моё нынешнее сознание лишь временно. В обозримом будущем мне придётся положиться на вашу помощь. Благодарю."
62040-210 = "...Понятно."
62040-211 = "И ещё, Сенсей. Пока у меня не вышло время, я должна кое о чём вас попросить."
62040-212 = "[s] «...Проси о чём угодно»."
62040-213 = "Фуфу. Хорошо."
62040-214 = "Но сперва я должна поблагодарить вас. Я смогла выбраться из тьмы лишь потому, что свет ваших слов указал мне путь."
62040-215 = "А теперь моя просьба. Пожалуйста, защитите повседневную жизнь студентов здесь, в Ариусе."
62040-216 = "...!"
62040-217 = "Я понимаю, эта просьба неожиданна. И всё же я обязана обратиться к вам с ней."
62040-218 = "...Ведь где-то по пути я начала воспринимать всё это как должное."
62040-219 = "Обыденный распорядок: проснуться утром, надеть форму, пойти на занятия, участвовать в клубной деятельности, вернуться в общежитие..."
62040-220 = "Для нас это простые, ничтожные части повседневной жизни, а для других — драгоценные мгновения."
62040-221 = "На деле стабильность тех, кто может выстроить обычный ежедневный распорядок, — результат множества маленьких чудес, накопившихся одно за другим."
62040-223 = ""
62040-224 = "Простите? Вы хотите, чтобы я отправилась в Ариус?"
62040-225 = ""
62040-227 = ""
62040-229 = "Да. И ваша миссия..."
62040-230 = "..."
62040-231 = "Я хочу, чтобы вы помогли Сенсею, который будет там готовить студентов Ариуса к экзамену."
62040-232 = "Студентов Ариуса? К экзамену? Что всё это значит?"
62040-233 = "Именно то, что звучит. Ради безопасности Сенсея я надеялась не допустить его личного визита в Ариус."
62040-234 = "Пожалуй, мне следовало понимать, что это совсем не в духе Сенсея. Неважно, даже если пунктом назначения станет сам ад из Писания..."
62040-235 = "Сенсей всегда придёт к студенту, которому нужна помощь."
62040-236 = "Да, согласна. Тогда, насколько я понимаю, наша цель — обеспечить безопасность Сенсея?"
62040-237 = "Хотя это всегда имеет первостепенное значение, я хочу попросить вас о чём-то ещё более важном."
62040-238 = ""
62040-240 = ""
62040-241 = ""
62040-242 = "Я хочу, чтобы вы оказали Ариусу помощь — в любой форме, в какой она понадобится."
62040-243 = "..."
62040-244 = "Уверена, именно вы лучше кого-либо понимаете, что подразумеваете своими словами."
62040-246 = "Я знаю, капитан Мине, что вам всегда не нравилась моя манера поведения."
62040-247 = "И после недавних событий вряд ли вы стали относиться ко мне особенно высоко."
62040-248 = "Я пришла к вам, прекрасно это понимая."
62040-249 = "Поэтому это не приказ Чаепития Рыцарям исправительного курса."
62040-250 = "Это смиренная просьба Кирифуджи Нагисы к Аомори Мине."
62040-251 = "Потому что я уверена: Ариусу нужна ваша помощь."
62040-252 = "...Некоторые скажут, что Тринити не имеет права протягивать Ариусу руку."
62040-253 = "И они будут правы. Но другие также знают, что Аомори Мине не позволит таким препятствиям остановить её стремление поступать правильно."
62040-254 = "..."
62040-255 = "Я бы не сказала, что плохо к вам отношусь, Кирифуджи Нагиса."
62040-256 = ""
62040-258 = ""
62040-259 = ""
62040-260 = "Именно Рыцари исправительного курса сами отказались от права на место в Чаепитии."
62040-261 = "Мы предпочли следовать собственной справедливости, свободные от бремени обязанностей этой должности."
62040-262 = "В каком-то смысле я вам благодарна."
62040-263 = "Однако... боюсь, в методах и манерах мы с вами никогда не сойдёмся."
62040-265 = "...Прошу прощения."
62040-266 = "Я понимаю."
62040-267 = ""
62040-269 = ""
62040-270 = "Тогда я отправлюсь в Ариус, откликнувшись на зов о помощи."
62040-273 = "То, что вы сделали здесь, Сенсей... Вы показали этим студентам хотя бы отблеск той жизни, которая должна была принадлежать им, но была жестоко отнята."
62040-274 = "Такие вещи, как посещать занятия, учиться вместе с другими, переживать из-за пустяков..."
62040-275 = "Эти маленькие ежедневные привычки из жизни студенты..."
62040-276 = "..."
62040-277 = "Пожалуйста."
62040-278 = "Защитите их."
62040-279 = "[s] «...Да. Обещаю»."
62040-280 = "Спаси... бо."
62040-281 = ""
62040-283 = ""
62040-286 = ""
62040-287 = "Капитан. Капитан..."
62040-288 = "...Она снова потеряла сознание."
62040-289 = "..."
62040-290 = "Но то, что она хотя бы ненадолго смогла очнуться, — хороший знак."
62040-291 = "А может, это скорее свидетельство внутренней силы Мине."
62040-292 = ""
62040-294 = ""
62040-295 = "Что ж, Сенсей. Время дорого."
62040-296 = "Пожалуйста, берегите себя."
62040-297 = ""
62040-299 = ""
62040-304 = "О-Они ушли..."
62040-305 = "..."
62040-306 = "..."
62040-307 = "Надеюсь, с Мине всё будет хорошо..."
62040-308 = "[s] «...Я доверяю Сене»."
62040-309 = "...Понятно. Хорошо."
62040-310 = "[s] «Итак, Ацуко. Можешь рассказать ещё что-нибудь?»"
62040-311 = ""
62040-313 = ""
62040-314 = "О том, что я... Точнее, о том, что Ариус знает об этих трубах?"
62040-315 = "В каком-то смысле — почти ничего. Мы знаем лишь их названия."
62040-316 = "Повторюсь, это всего лишь предположение, но, похоже, эти существа — те, кого мы называем Ангелами Откровения."
62040-317 = "Но если они каким-то образом действительно Ангелы Откровения... Тогда это значит..."
62040-318 = "...Да."
62040-319 = ""
62040-321 = ""
62040-322 = "Это начало конца света."
62040-324 = "Следующий Эпизод;Базилика Ариуса"
