[translation]
2001103-1 = "Специалист по мико"
2001103-2 = "Я пришёл на подработку Серики, чтобы увидеть её во всём великолепии мико."
2001103-3 = "[s] «Я уверен, это было где-то здесь.»"
2001103-4 = "Наконец я заметил Серику."
2001103-5 = ""
2001103-7 = ""
2001103-8 = "Почему-то она стояла одна на дальней стороне площадки."
2001103-9 = "[s1] «Это мико!»\n[s2] «Это Серика!»"
2001103-10 = "С-Сенсей?!"
2001103-11 = "Что вас сюда привело?"
2001103-12 = "С-Сенсей?!"
2001103-13 = "Что вас сюда привело?"
2001103-14 = "Что? Вы пришли сюда только ради того, чтобы увидеть меня в образе мико?"
2001103-15 = "Ч-Что вы такое говорите!"
2001103-16 = "[s] «...»"
2001103-17 = "Что такое? Почему вы так на меня смотрите?"
2001103-18 = "Не просто пяльтесь! Если хотите что-то сказать — говорите!"
2001103-19 = "Вообще-то, если вы думаете, что мне не идёт этот образ..."
2001103-20 = "Или что я веду себя не как настоящая мико... или ещё что-нибудь обидное, я-я сама это прекрасно понимаю, так что не обязательно произносить вслух!"
2001103-21 = "[s3] «Ты милая!»\n[s4] «Ты само воплощение мико!»"
2001103-23 = "В-Вы снова говорите всякие глупости!"
2001103-25 = "В-Вы снова говорите всякие глупости!"
2001103-26 = "[s] «Кстати, разве у тебя сейчас не смена? Почему ты одна?»"
2001103-27 = "Ах... Насчёт этого."
2001103-28 = "Дело в том... Сенсей, что мне делать?"
2001103-29 = "По работе я должна провожать людей внутрь площадки..."
2001103-30 = "*вздох* Как видите, у меня не получилось нормально выполнить свою работу."
2001103-31 = "Ага... Всё-таки полный провал... Может, эта работа мне не подходит?"
2001103-32 = "[s] «Не подходит?»"
2001103-33 = "Я старалась подготовиться как можно лучше, но, наверное, этого было недостаточно."
2001103-34 = "Ах! С-Сенсей, я совсем не пытаюсь вас обвинять!"
2001103-35 = "Просто... Ну, мне следовало лучше подготовиться к незнакомой работе. Теперь я начинаю немного жалеть."
2001103-36 = "Но раз уж я уже здесь, остаётся только взять себя в руки."
2001103-37 = "И всё же, возможно, эта работа действительно не для меня..."
2001103-38 = "[s] «Нет, это неправда!»"
2001103-39 = "А? С-Сенсей?"
2001103-40 = "[s5] «Ты уже превосходная мико!»\n[s6] «Просто тебе ещё не представился шанс!»"
2001103-41 = "Ч-Что ты несёшь?"
2001103-42 = "Ч-Что ты несёшь?"
2001103-43 = "А-а-а! Мамочка! Папочка! Где вы?!"
2001103-44 = "О нет, этот ребёнок потерялся?"
2001103-45 = "[s] «Вот твой шанс, Серика!»"
2001103-49 = ""
2001103-50 = "Ох, эм, э-э... Привет, малышка. Ты потерялась?"
2001103-51 = "*всхлип* Нет! Не я! Это мама и папа потерялись!"
2001103-52 = "П-Понятно... Тогда подожди здесь минутку и не плачь. Я их найду, хорошо?"
2001103-53 = "Эй! Кто-нибудь потерял ребёнка?!"
2001103-54 = "Кто-нибудь?!"
2001103-56 = ""
2001103-60 = "Милая! Вот ты где! Я тебя повсюду искал!"
2001103-61 = "А-а-а! Папочка!"
2001103-62 = "Фух, какое облегчение. Простите, что доставили вам хлопоты, госпожа мико."
2001103-63 = "Н-Ничего страшного! Я просто рада, что вы благополучно воссоединились."
2001103-64 = "Госпожа мико! Спасибо! С Новым годом!"
2001103-65 = "И тебя с Новым годом!"
2001103-67 = "*вздох* Так нормально, да?"
2001103-68 = "[s] «Серика! Теперь вон туда!»"
2001103-69 = "Сенсей?! П-Подождите!"
2001103-70 = ""
2001103-72 = ""
2001103-74 = "Я впервые за долгое время пришла сюда помолиться, но спина!"
2001103-75 = ""
2001103-76 = "Простите. Вы в порядке?"
2001103-77 = "Ой-ой, да это же мико! Какая милая! Со мной всё хорошо, просто спина немного болит."
2001103-78 = "Позвольте мне проводить вас внутрь."
2001103-79 = "Но мне будет неудобно, если вы лично станете мне помогать... А?!"
2001103-80 = "Ч-Что-то не так?"
2001103-81 = "После того как ты похлопала меня по спине, боль исчезла! У-У тебя великая сила!"
2001103-82 = "Простите?"
2001103-83 = "Эй, народ! Здесь невероятная мико!"
2001103-85 = "(С этого момента вокруг Серики начало собираться всё больше посетителей.)"
2001103-88 = "Мико! Пожалуйста, благословите омикудзи, которое я только что вытянул!"
2001103-89 = "Б-Благословить? Ну, если хотите, наверное, могу."
2001103-90 = "Ах! Тогда благословите и автомат с капсулами, в который я сейчас буду играть!"
2001103-91 = "Ему вообще нужно благословение?!"
2001103-92 = "Вообще-то лучше сами выберите за меня! Я доверяю только вам!"
2001103-93 = "И что мне делать с такой просьбой?!"
2001103-94 = "[s] «Серика! Давай сделаем это!»"
2001103-95 = "Сенсей?! Прекратите!"
2001103-96 = "Какое облегчение! Тогда полагаюсь на вас!"
2001103-97 = "Уф... Ах! Да к чёрту! Ладно!"
2001103-98 = "М-Мне просто нужно нажать сюда? Вот так?!"
2001103-99 = ""
2001103-101 = "О-о-о! Ну конечно!"
2001103-103 = "Ах. *вздох* С реальностью не поспоришь. Этого персонажа обычной редкости, которого вы мне выбрали... я буду заботливо развивать..."
2001103-104 = "Что за?! Почему я должна чувствовать себя виноватой, если просто сделала то, о чём меня попросили?!"
2001103-106 = "(Постепенно число людей, которым помогла Серика, всё росло.)"
2001103-107 = ""
2001103-108 = "Эй, мисс. Похоже, у вас к этому талант. Не хотите работать у нас и стать мико среди мико — настоящим специалистом?"
2001103-109 = "Подождите, я никогда всерьёз об этом не думала!"
2001103-110 = "Пожалуйста! Обдумайте наше предложение!"
2001103-111 = "А-а-а, С-Сенсей?! Помогите!"
2001103-113 = ""
2001103-116 = "*тяжело дышит* Это было безумие. Слово «катастрофа» придумали именно для таких моментов?"
2001103-117 = ""
2001103-119 = ""
2001103-120 = "Теперь мои переживания о том, что с подработкой ничего не выйдет, кажутся такими глупыми."
2001103-121 = "Я правда не понимаю, как вообще дошла до такого."
2001103-122 = "[s] «Вот что происходит, когда ты действуешь искренне.»"
2001103-123 = "И что это должно значить? Глупость какая-то."
2001103-124 = "В любом случае... Теперь, оглядываясь назад, понимаю, что зря так переживала."
2001103-125 = "Но всё потому, что вы меня поддержали, Сенсей."
2001103-126 = "Ха-ха. В итоге вы снова мне помогли, Сенсей. Такое чувство, что всё всегда заканчивается именно так."
2001103-127 = "Спасибо, что всегда рядом, Сенсей."
2001103-128 = "[s] «Я всегда готов помочь тебе, Сэрика.»"
2001103-129 = "Хмф. А вы уверены в себе! Вы ведь даже не знаете, с какими просьбами я буду обращаться к вам в будущем."
2001103-130 = "[s] «Всё нормально. Пока это просьбы от тебя, Сэрика.»"
2001103-131 = "Эм..."
2001103-132 = ""
2001103-133 = "Н-Ну ладно! Раз уж вы так настаиваете, Сенсей."
2001103-134 = "[s7] «Ага! Так что не сомневайтесь и обращайтесь ко мне в любое время!»\n[s8] «Я помогу вам стать мико среди всех мико!»"
2001103-135 = "Что? Я просто думала, о чём вы говорите."
2001103-136 = "Что? Я просто думала, о чём вы говорите."
2001103-137 = "*вздох* Ну правда..."
2001103-138 = "Пф-ф! Да что с вами?!"
2001103-139 = "Вы и правда... такой дурак!"
2001103-141 = "После этого я помогал Сэрике на подработке до конца её смены."
