[translation]
10053040-1 = "Эпизод 4;Живая каменная кукла"
10053040-3 = ""
10053040-4 = "Ах, вдохните этот свежий воздух! Он мигом вылечит всё, что вас мучает!"
10053040-5 = "Сенсей? Почему вы так сильно отстали?"
10053040-6 = "[s1] «Помедленнее, пожалуйста...»\n[s2] «Я больше не могу идти...»"
10053040-9 = "Ха-ха, это ещё что такое? Похоже, вы совсем не в форме!"
10053040-10 = ""
10053040-13 = ""
10053040-14 = "Нет! *пыхтит* Это ты тут ненормальная!"
10053040-15 = "Мы уже десять минут кричим тебе, чтобы ты сбавила темп!"
10053040-16 = "Ну и ну, какие же вы все лентяи. А что директор Мо?"
10053040-17 = ""
10053040-19 = ""
10053040-20 = ""
10053040-21 = "*Тяжёлое дыхание* *Тяжёлое дыхание*"
10053040-22 = "Ого! Вы выглядите так, будто уже одной ногой в могиле!"
10053040-23 = "Но разве немного вспотеть не приятно?"
10053040-24 = "*задыхается* *хрипит*"
10053040-25 = "Даже сил ответить не осталось? Ха-ха-ха!"
10053040-26 = "Тут вообще-то не до смеха...!"
10053040-27 = ""
10053040-29 = ""
10053040-30 = ""
10053040-32 = ""
10053040-33 = "*вздох* Наконец-то мы добрались до первой точки..."
10053040-34 = "Серьёзно? Здесь же ничего нет."
10053040-35 = "П-Подождите. Дайте отдышаться..."
10053040-37 = ""
10053040-38 = ""
10053040-39 = ""
10053040-40 = "Да. Это наша первая точка исследования на горе Ширакава."
10053040-41 = "Разумеется, это место выглядит непримечательно. Цучиноко не станет устраивать логово там, где интересно людям. Оно старается их избегать."
10053040-42 = "Ну, тут ты не ошибаешься..."
10053040-43 = ""
10053040-45 = ""
10053040-46 = "Правда, последний вопрос, обещаю."
10053040-47 = "Мы что, так и будем продолжать искать? Типа, по всей этой горе? Ради толстой змеи, которой, может быть, вообще не существует?"
10053040-48 = ""
10053040-50 = ""
10053040-51 = ""
10053040-52 = "...Если на этой горе есть Цучиноко..."
10053040-53 = "Мы его найдём."
10053040-57 = "Тридцать минут спустя..."
10053040-58 = ""
10053040-60 = ""
10053040-61 = "..."
10053040-62 = ""
10053040-64 = ""
10053040-66 = "Эй! Что вы там разлеглись?! Мы же едва начали!"
10053040-67 = "У меня на мгновение случился выход из тела... Следовательно, души существуют... Запишите это. Ч... Т... Д."
10053040-68 = "Она вообще о чём...?"
10053040-69 = "Сенсей...?"
10053040-70 = "[ns5] «Мышцы болят от сидячей работы...!»\n[ns6] Не отвечать. Притвориться трупом."
10053040-73 = "Вы двое бесполезны..."
10053040-74 = "...? Чего ты ухмыляешься?"
10053040-75 = "А? Я?"
10053040-76 = "Ты не заметила? У тебя улыбка была буквально до ушей!"
10053040-77 = "О, правда...? Ну, какой-то особой причины нет."
10053040-78 = "Просто мне весело быть здесь вместе со всеми вами."
10053040-79 = "...Понятно."
10053040-80 = "Эй... мне интересно."
10053040-81 = "В Миллениуме нет клубной деятельности, Цубаса?"
10053040-82 = "А то ты могла бы ходить в такие походы с ещё большим количеством людей..."
10053040-83 = "Ах."
10053040-84 = ""
10053040-86 = ""
10053040-87 = "Ну, как бы это объяснить? История немного длинная."
10053040-88 = "Если честно, раньше я активно участвовала в клубе, но теперь больше не могу."
10053040-89 = "Эм, наш клуб..."
10053040-90 = "Его закрыли. Из-за... проблем с бюджетом, низких результатов, отсутствия интеллектуального обоснования..."
10053040-91 = "...Простите."
10053040-92 = "Н-Нет! Всё нормально! Меня это вовсе не сломило или что-то такое!"
10053040-93 = "Миллениум — академия, где всё решают заслуги, так что если я найду Цучиноко, возможно, смогу возродить клуб!"
10053040-94 = "Хотя я никогда не слышала, чтобы закрытый клуб когда-либо открывали снова..."
10053040-95 = "Ну, я тебе помогу. Даже если сама не верю, что Цучиноко существует."
10053040-96 = "Разумеется. Если теория неверна, доказать это тоже важно."
10053040-97 = "Кстати, а где Коноха?"
10053040-98 = "Знаете, кажется, я слышала, как она куда-то убежала. Может, что-то нашла."
10053040-99 = "Надо за ней присматривать. Коноха среди нас самая слабая."
10053040-100 = "...Серьёзно? Она же из Валькирии!"
10053040-101 = "Хм? И что с того?"
10053040-102 = ""
10053040-103 = "А-А-а!!"
10053040-104 = "Что это был за жалкий визг?!"
10053040-105 = "Коноха?! Быстро, найдём её!"
10053040-108 = ""
10053040-109 = "...А-а, у-а... С-Сенсей... Помогите..."
10053040-110 = "[s7] «Что случилось, Коноха?!»\n[s8] «Ты такая бледная!»"
10053040-113 = "Я-Я заметила что-то, закопанное в земле... и откопала..."
10053040-114 = ""
10053040-116 = ""
10053040-118 = "Всё, нам конец."
10053040-119 = "Ч-Что это такое? От него так и веет чем-то зловещим..."
10053040-120 = "Это потрёпанный деревянный сундук. Нужно будет проверить дату изготовления."
10053040-121 = "Но эти талисманы выглядят целыми, хотя сделаны из бумаги. Не думаю, что он настолько старый."
10053040-122 = "Как ты можешь быть такой спокойной?! Тут всё серьёзно!"
10053040-123 = ""
10053040-125 = ""
10053040-126 = "Ч-Ч-Ч-Что мне делать?! Бросить его обратно в яму? Или копать ещё глубже?"
10053040-127 = "Подожди. Ты что, не собираешься его открыть?"
10053040-129 = "Кто бы стал?!"
10053040-130 = ""
10053040-132 = ""
10053040-133 = ""
10053040-134 = "Нет, послушайте. Так называемые «традиционные СМИ» любят показывать загадочные талисманы исключительно как «проклятия» или «дурные знамения», но исторически это неверно!"
10053040-135 = "На самом деле всё наоборот. Если изучить вопрос, выяснится, что их в основном используют для благословений и исполнения желаний."
10053040-136 = "Не-не-не. Только не этот ящик! Как ни крути, он проклят."
10053040-137 = "Ага! Ты водного типа, да?! Пытаешься передать своё невезение мне, огненному типу!"
10053040-139 = "Я-Я тоже думаю, что нам стоит закопать его и сделать вид, будто ничего не было..."
10053040-140 = "Н-Не потому, что я верю в проклятие или что-то такое! Просто некрасиво открывать чужие вещи. Вдруг это кому-то дорого!"
10053040-142 = "Хм..."
10053040-143 = ""
10053040-145 = ""
10053040-146 = ""
10053040-148 = "[ns9] «Ах...»\n[ns10] «Он открылся.»"
10053040-151 = ""
10053040-154 = "Это... каменная статуэтка? Может, идол? Или вообще кукла..."
10053040-155 = "Она «опасная» — вот что это такое!"
10053040-156 = "Успокойся. Это всего лишь обычная каменная кукла. Вероятно, местный обычай."
10053040-157 = "Нет ничего «обычного» в каменной кукле, которую пришлось запереть в ящике, заклеить талисманами и обвязать верёвкой!"
10053040-158 = ""
10053040-160 = ""
10053040-161 = ""
10053040-162 = "Всё в порядке. К сожалению, это подделка."
10053040-163 = "Ч-Что? Подделка?"
10053040-164 = ""
10053040-166 = ""
10053040-167 = ""
10053040-168 = "Во-первых, она сделана не из цельного камня. Для своего объёма она слишком лёгкая, а поверхность чересчур ровная."
10053040-169 = "Я бы сказала, это смесь пластиковой смолы и каменной крошки. Скорее всего, массовое производство. Наверное, из какого-нибудь магазина садового декора."
10053040-170 = "Однако ящик сделан из настоящего дерева и выглядит довольно старым. Кто-то сделал это намеренно. Хотел, чтобы благодаря ящику статуэтка выглядела достовернее."
10053040-171 = ""
10053040-173 = ""
10053040-175 = ""
10053040-176 = "...У кого вообще столько свободного времени? Для розыгрыша это не перебор?"
10053040-178 = "Можно было бы так подумать, но такое случается довольно часто."
10053040-179 = "Обычно ради контента — видео, игр с дополненной реальностью, вирусного маркетинга... А иногда люди просто прячут свои поделки без всякой причины."
10053040-180 = "Могли сделать это ради внимания... или просто чтобы напугать того, кто найдёт. Это может быть мистификация или особенно злая шутка."
10053040-181 = "Я уже встречала подобное. Люди подбрасывают такие вещи в заброшенные здания, которые я исследую."
10053040-182 = ""
10053040-184 = ""
10053040-185 = ""
10053040-186 = ""
10053040-187 = "В-Видите? Я же говорила, ничего страшного, Сенсей!"
10053040-188 = "[s11] «...? Ты теперь меня обвиняешь?»\n[s12] «Ну, раз это подделка, Коноха может успокоиться...»"
10053040-192 = ""
10053040-194 = ""
10053040-195 = "Я начинаю копать!"
10053040-197 = "Э...?"
10053040-199 = "На всякий случай! Даже если это шутка, в неё всё равно вложены злые намерения, верно? Это определённо зловещий предмет!"
10053040-200 = "Так что я запечатаю его навсегда, чтобы больше никто никогда его не увидел!"
10053040-201 = "Понимаю твою мысль... Но если ты хочешь защитить других, можно просто забрать его с собой и нормально утилизировать."
10053040-202 = "Нет!! Эту штуку вообще никогда не следовало выкапывать!!"
10053040-203 = "Я закопаю её ниже самой мантии!!"
10053040-205 = "Все, хватайте лопаты!! ПОЕХАЛИ!!"
10053040-207 = "А-А?"
10053040-208 = "ЧЕ-Е-ЕГО?!"
10053040-216 = ""
10053040-217 = "*фух* Запечатывание завершено!! Проблема решена!!"
10053040-218 = "Ясный ум и чистое сердце! Даже тело будто помолодело! Ха-ха-ха!"
10053040-219 = ""
10053040-221 = ""
10053040-222 = ""
10053040-223 = "*пыхтит* *пыхтит*... Она вообще когда-нибудь устаёт...?"
10053040-224 = "..."
10053040-225 = ""
10053040-227 = ""
10053040-228 = ""
10053040-229 = "Она выкопала метров десять... совсем одна."
10053040-230 = "В последний раз, когда я измеряла, было восемь метров..."
10053040-232 = "Ой, какие же вы все драматичные! Мы почти ничего не сделали!"
10053040-233 = "Всего лишь немного земли перекинули."
10053040-234 = "Это было совсем не похоже на игру в песочнице..."
10053040-235 = "Эй, все студенты Валькирии такие?"
10053040-236 = "Да я по сравнению с остальными мелочь. Вот моя девочка Канна — ВОТ она действительно нечто."
10053040-237 = ""
10053040-239 = ""
10053040-240 = ""
10053040-241 = "..."
10053040-242 = "Напомните мне никогда не нарушать закон."
10053040-243 = "...Хорошая мысль."
10053040-244 = ""
10053040-246 = ""
10053040-247 = ""
10053040-248 = "Тогда, возможно, нам стоит..."
10053040-249 = ""
10053040-251 = ""
10053040-252 = "Возвращаться?"
10053040-253 = "[s13] «ДА!!»\n[s14] «Мы закончили искать Цучиноко?»"
10053040-254 = "Так говорите, будто я держу вас в заложниках."
10053040-255 = "Хотя, в конце концов, держать людей под стражей — моя работа. Ха-ха-ха!"
10053040-256 = ""
10053040-258 = ""
10053040-259 = "Уже почти время ужина! И у нас ещё несколько дней впереди."
10053040-260 = "А после той статуэтки... думаю, с меня хватит «приключений» на сегодня."
10053040-261 = ""
10053040-263 = ""
10053040-264 = ""
10053040-265 = "Фух... По крайней мере, всё закончилось."
10053040-266 = "...Но мы проработали весь день, а показать нечего."
10053040-267 = "Ну, оно бы не было таким уж «легендарным», если бы его было так легко найти, правда?"
10053040-268 = "Верно..."
10053040-269 = ""
10053040-271 = ""
10053040-274 = ""
10053040-275 = ""
10053040-276 = "Хм?"
10053040-277 = "Кажется, за нами кто-то идёт в кустах... Маленькое животное?"
10053040-278 = ""
10053040-280 = ""
10053040-281 = "...!!"
10053040-282 = "КЯ-А-А!!"
10053040-283 = ""
10053040-285 = ""
10053040-286 = "[ns15] «Рэна...?»\n[ns16] Осмотреть то, что увидела Рэна."
10053040-290 = "Это была та самая каменная кукла... хотя мы закопали её на глубину восьми метров!"
10053040-291 = "..."
10053040-292 = "И всё же... она выглядела грязнее, чем раньше... и даже... уставшей?"
10053040-293 = "Сенсей, почему вы отстаёте?"
10053040-294 = ""
10053040-297 = "Я отвела взгляд всего на мгновение. Но когда посмотрела обратно, каменной куклы уже не было."
10053040-298 = "...Каким-то образом нам удалось заработать загадочную обиду."
