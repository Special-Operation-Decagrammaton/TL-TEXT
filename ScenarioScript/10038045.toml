[translation]
10038045-3 = ""
10038045-4 = "Ещё один доклад от главных ворот. Нападающих всего двое, ничего такого, с чем мы не справимся."
10038045-5 = ""
10038045-7 = ""
10038045-8 = ""
10038045-9 = "Вот как? Значит, всё идёт как надо. Особенно... теперь, когда всё готово."
10038045-10 = "Это...?!"
10038045-11 = "Да... Вот оно. Именно ради этого я вернулась..."
10038045-12 = "Долгий же это был путь..."
10038045-13 = "...Мне тоже можно будет выпить, правда?"
10038045-14 = "А, вот чего ты ждала всё это время, да? Кех-хе, кех-хе..."
10038045-15 = "Не бойся. Таков был наш уговор. А я всегда держу обещания."
10038045-16 = ""
10038045-18 = ""
10038045-19 = "Разумеется, я приготовила достаточно и для тебя."
10038045-21 = "Вместе мы сделаем огромный шаг на пути к становлению мудрецами!"
10038045-22 = "Да, к тому, чтобы стать превзошедшими мир мудрецами. С самого начала это и было целью Общества."
10038045-23 = "Даже Сая об этом не забыла."
10038045-24 = ""
10038045-26 = ""
10038045-27 = "......"
10038045-28 = "...Кстати, есть новости о Фестивале Лунного Света?"
10038045-29 = "Он ещё толком не начался. Обычно к этому времени уже вовсю кипит жизнь, но..."
10038045-30 = "Понятно, понятно. Наверняка там сейчас настоящий хаос из-за моего... как они это называют? «Синдрома Малыша»."
10038045-31 = "......"
10038045-32 = "Символично, правда?"
10038045-33 = ""
10038045-35 = ""
10038045-36 = "...Что ты имеешь в виду?"
10038045-37 = "Есть ещё одна легенда о Фестивале Лунного Света."
10038045-38 = "Ты знаешь историю мудреца, который отправился на Луну, а затем вернулся, чтобы нести добродетель и просвещать других, прежде чем снова уйти."
10038045-39 = "Но у этой истории есть и другая сторона. Знаешь её?"
10038045-40 = "...Просвети меня."
10038045-41 = "На самом деле мудрец сеял смуту и раздор, пока ему не пришлось бежать от преследования."
10038045-42 = "То есть мудрец не по своей воле «вернулся» на Луну?"
10038045-43 = "А зачем ему было уходить добровольно, если он сделал жизнь здесь такой прекрасной?"
10038045-44 = "Но хватит болтовни. Зелье."
10038045-45 = ""
10038045-47 = ""
10038045-48 = ""
