[translation]
901010400130-6 = ""
901010400130-9 = ""
901010400130-11 = "...Olá, muito bom dia!"
901010400130-12 = ""
901010400130-14 = ""
901010400130-15 = "...Uou!"
901010400130-16 = "Que susto, garota... Se minha mão escorrega nessa faca de rede, já viu!"
901010400130-17 = "Mil desculpas! É que eu queria compartilhar uma novidade bombástica em primeira mão."
901010400130-18 = ""
901010400130-21 = ""
901010400130-22 = "...Novidade bombástica?"
901010400130-24 = "Sim! O fim de tarde vai caindo e aquela fominha vai batendo, não é verdade? #nE é pensando em trabalhadores dedicados como você que—"
901010400130-25 = "Preparamos uma superpromoção exclusiva de dar água na boca!"
901010400130-26 = "Se responder a uma pesquisa rapidinha do \"FOX EATS\" agora mesmo—"
901010400130-27 = ""
901010400130-29 = ""
901010400130-30 = "Você ganha na faixa uma marmita do renomadíssimo restaurante Yoshino Inari!"
901010400130-31 = "Que tal aproveitar esta oportunidade de ouro?"
901010400130-33 = "...Isso tá com cara de golpe."
901010400130-34 = "Comida de graça assim do nada...? Qual é a pegadinha?"
901010400130-36 = "Bem, como em toda pesquisa de mercado, há algumas cláusulas e termos de uso básicos..."
901010400130-37 = "Esta pesquisa de opinião visa o aprimoramento dos serviços e produtos FOX EATS, podendo seus dados ser compartilhados com parceiros para fins publicitários e estatísticos por um período de 36 meses. Havendo divergências contratuais, consulte o SAC central pelo telefone—"
901010400130-39 = "...Chega, chega, já entendi tudo!"
901010400130-40 = "*Suspiro*... Mais uma dessas agências de marketing torrando dinheiro com bobagem em praça pública."
901010400130-41 = "Bom, a comida em si não tem culpa do falatório, né."
901010400130-42 = "E eu tava mesmo precisando forrar o estômago depois dessa puxada de rede."
901010400130-43 = "Deixa eu ver esse negócio aqui..."
901010400130-44 = ""
901010400130-46 = ""
901010400130-47 = ""
901010400130-48 = ""
901010400130-49 = "Nossa... mas olha só..."
901010400130-50 = "Tá bom pra caramba! O arroz tá soltinho e a trouxinha de tofu frito é grossa e suculenta... Gostei."
901010400130-51 = "Só tem um detalhe que me incomodou..."
901010400130-53 = "Algum problema com o tempero?"
901010400130-54 = "Toda crítica é super bem-vinda para melhorarmos!"
901010400130-55 = "...Esse recheio aqui é kani-kama imitação de caranguejo?"
901010400130-56 = "Um inarizushi tão gostoso desses estragado com kani genérico de peixe moído... Que desperdício de potencial."
901010400130-57 = ""
901010400130-59 = ""
901010400130-60 = "Mas é que... \"caranguejo de verdade\" é caro demais..."
901010400130-61 = "Se usássemos caranguejo nobre, a margem de lucro da marmita promocional ia—"
901010400130-62 = "Em que mundo você vive, menina? O preço do caranguejo despencou pro fundo do poço faz meses!"
901010400130-64 = "Pois é... Ficou tão barato que mal paga o óleo diesel do pesqueiro. #nUltimamente a gente até pensa duas vezes antes de soltar a amarra."
901010400130-66 = "É mesmo? Mas nas feiras e supermercados da cidade continua caríssimo..."
901010400130-67 = "Se não acredita em mim, dá um pulo ali nos galpões de estocagem. #nTem montanhas de caixotes de caranguejo encalhados sem comprador."
901010400130-68 = "Entendi... muito obrigada pela dica! #nVou repassar esse dado de mercado pro pessoal da cozinha."
901010400130-69 = "Ah, aproveitando a conversa, posso te fazer mais uma perguntinha rápida?"
901010400130-70 = "—O senhor por acaso já ouviu falar do tal \"Caranguejo de Tambor de Óleo\"?"
901010400130-71 = "Caranguejo de tambor de óleo...? Tem algum maluco enfiando caranguejo em tambor de combustível por aí?"
901010400130-73 = "Não sei dos outros, mas nós só despachamos tudo em caixotes de madeira. #nSe for no galpão de logística você vai ver."
901010400130-74 = "Perfeito! Muito obrigada pela sua colaboração, senhor!"
901010400130-75 = "Tenha um ótimo dia de trabalho!"
