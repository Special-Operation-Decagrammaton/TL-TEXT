[translation]
901010400130-6 = ""
901010400130-9 = ""
901010400130-11 = "...Извините!"
901010400130-12 = ""
901010400130-14 = ""
901010400130-15 = "А! Чего ты кричишь?"
901010400130-16 = "Я чуть инструмент не уронил!"
901010400130-17 = "Хи-хи... Простите. Я просто так взволнована, потому что принесла отличные новости!"
901010400130-18 = ""
901010400130-21 = ""
901010400130-22 = "...Отличные новости?"
901010400130-24 = "Да. Обед был уже несколько часов назад, а вы всё это время работали! Наверняка проголодались!"
901010400130-25 = "Поэтому FOX EATS подготовила специальную акцию специально для вас!"
901010400130-26 = "Если прямо сейчас пройдёте короткий опрос FOX EATS..."
901010400130-27 = ""
901010400130-29 = ""
901010400130-30 = "Вы получите бесплатный бэнто от Yoshino Inarizushi! Ешьте круто с Yoshino!"
901010400130-31 = "Нужно всего лишь ответить на пару вопросов. Несколько минут — и БЕСПЛАТНЫЙ бэнто ваш! СРАЗУ ЖЕ!"
901010400130-33 = "...Что-то здесь нечисто."
901010400130-34 = "Ага. Говорят, бесплатного ничего не бывает... Ты ведь что-то задумала, да?"
901010400130-36 = "Вовсе нет. Разумеется, есть несколько небольших условий..."
901010400130-37 = "Этот опрос используется FOX EATS для улучшения товаров и услуг, а результаты могут передаваться третьим лицам в рекламных целях. Результаты будут храниться 36 месяцев. По всем вопросам обращайтесь в службу поддержки FOX EATS по—"
901010400130-39 = "Стой... Всё, всё, поняли!"
901010400130-40 = "Судя по тому, как она это протараторила, очередной молодой маркетинговый стартап снова сжигает деньги."
901010400130-41 = "Хотя она сказала про бесплатную еду."
901010400130-42 = "А я как раз голодный."
901010400130-43 = "Так, посмотрим..."
901010400130-44 = ""
901010400130-46 = ""
901010400130-47 = ""
901010400130-48 = ""
901010400130-49 = "Хм, это..."
901010400130-50 = "Вот ЭТО хорошие инаризуси! У риса отличная текстура, а жареный тофу ровно нужной толщины."
901010400130-51 = "Но всё же..."
901010400130-53 = "А, вас что-то беспокоит?"
901010400130-54 = "Ваш честный отзыв невероятно полезен! FOX EATS всегда стремится улучшать сервис, так что смело высказывайтесь."
901010400130-55 = "...Они положили сюда крабовую палочку?"
901010400130-56 = "Жаль, что такой вкусный тофу испортили ненастоящим крабовым мясом."
901010400130-57 = ""
901010400130-59 = ""
901010400130-60 = "Хм? А разве так не делают обычно? Настоящий краб ведь запредельно дорогой, разве нет?"
901010400130-61 = "Я слышал, краб — роскошь. Говорят, один краб может стоить мою дневную зарплату!"
901010400130-62 = "Это уже старые новости, девочка. Цены на краба упали. Практически на морское дно."
901010400130-64 = "Ага. Цены настолько низкие, что мы думаем реже выходить на промысел. Едва отбиваем топливо."
901010400130-66 = "Правда? Но на рынке краб всё равно кажется дорогим."
901010400130-67 = "Это магазин. А ЗДЕСЬ — реальный мир. Не веришь — загляни на тот склад. Увидишь гору непроданных крабов."
901010400130-68 = "Понятно... Я обязательно передам ваш отзыв... ресторану."
901010400130-69 = "О, кстати! Раз вы все здесь работаете, мне любопытно."
901010400130-70 = "Вы когда-нибудь слышали что-нибудь вроде... крабов в бочке?"
901010400130-71 = "Крабы в бочке...? Есть люди, которые перевозят крабов в бочках?"
901010400130-73 = "Не знаю, как в других местах, но мы отправляем крабов в деревянных ящиках. Загляни на склад — увидишь."
901010400130-74 = "Интересно. Спасибо за участие в опросе."
901010400130-75 = "Хорошего дня!"
