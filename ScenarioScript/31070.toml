[translation]
31070-1 = "Episódio 7;Estudando para a Prova"
31070-2 = "(Horário de estudo individual após a aula)"
31070-3 = "Hanako, como resolvo esta questão?"
31070-4 = "Qual delas? Ah, entendi. Nesses casos, você usa o critério de divisibilidade desse jeito..."
31070-5 = "Entendo... Certo, compreendi."
31070-6 = "..."
31070-9 = "...?"
31070-10 = "Hum, Koharu-chan? Tem alguma questão que você não entendeu?"
31070-11 = "N-Não! Nada a ver!?"
31070-12 = "Aliás, essa página que você está olhando agora não cai na prova desta vez."
31070-13 = "Quê, mentira!?"
31070-14 = "N-Não é isso...! E-Eu já sabia! A matéria desta prova tá tão fácil que eu só tava adiantando o conteúdo!"
31070-15 = "A-Ahaha..."
31070-18 = "Hanako, que texto é este?"
31070-19 = "É a abertura de um antigo poema épico. Aquele que começa com \"Canta, ó divindade, a cólera...\""
31070-20 = "Ah, esse. Compreendi."
31070-25 = "..."
31070-28 = "Hanako, e isto aqui..."
31070-29 = "Isto é uma retradução de uma língua antiga. Para entender o texto original, vou precisar de um dicionário... Espere só um momentinho, por favor."
31070-30 = "Ah, entendo. Então provavelmente é \"Gaudium et Spes\"... Alegria e Esperança, não é?"
31070-31 = "Hum... Sim, parece que é isso mesmo. Isto é do Segundo Concílio... Quer dizer, mais importante que isso, você sabe ler a língua antiga, Azusa-chan?"
31070-32 = "Sim, aprendi há muito tempo."
31070-37 = "..."
31070-39 = "[ns] \"Parece que estão indo muito bem.\""
31070-40 = "Sim! A Hanako-chan é incrível demais...! E a Azusa-chan também está super dedicada aos estudos!"
31070-41 = "E parece que a Koharu-chan estava escondendo o verdadeiro potencial dela..."
31070-42 = "Desse jeito, quem sabe a gente não consegue passar com folga...!"
31070-43 = "Ainda bem... Para ser sincera, eu estava muito preocupada..."
31070-44 = "Na verdade, a Tea Party me disse: \"Se alguém reprovar na primeira prova, vocês terão que fazer um acampamento de estudos\"..."
31070-45 = "[s] \"Um acampamento de estudos?\""
31070-46 = "Sim, exatamente... E se reprovarmos em todas até a terceira prova... Auuu..."
31070-47 = "[s] \"Vai acontecer algo ruim...?\""
31070-48 = "N-Não é nada...! Parece que minhas preocupações eram à toa mesmo, então vamos deixar essas conversas tristes de lado..."
31070-49 = "Enfim, parece que não teremos problemas na prova!"
31070-53 = "A Hanako-chan parece ser tão boa nos estudos, então por que será que ela reprovou...? Será que aconteceu algum imprevisto e ela não pôde fazer a prova, como foi comigo...?"
31070-55 = "Dia da 1ª Prova Especial de Aptidão Acadêmica"
31070-58 = "...!"
31070-59 = "Uuu..."
31070-63 = "Fufu."
31070-64 = "..."
31070-67 = "[ns] \"Mantenham a calma e deem o seu melhor, pessoal.\""
31070-68 = "E-Eu vou mostrar a força da elite para vocês!"
31070-69 = "A-Ahaha... Vou dar o meu melhor."
31070-70 = "Fufu, sim."
31070-71 = "Preparação impecável."
31070-76 = "Próximo;1ª Prova Especial de Aptidão Acadêmica"
