[translation]
31070-1 = "Эпизод 7;Подготовка к экзамену"
31070-2 = "(Послеурочные занятия.)"
31070-3 = "Я не понимаю этот вопрос, Ханако."
31070-4 = "Хм? Это задача на разложение на простые множители. Здесь можно использовать признаки делимости. Всё, что нужно..."
31070-5 = "Хм. Понятно."
31070-6 = "..."
31070-7 = ""
31070-9 = "..."
31070-10 = "Хм? Ты на чём-то застряла, Кохару?"
31070-11 = "Н-Нет! Конечно нет!"
31070-12 = "Кстати, страницы, на которой ты сейчас, на экзамене не будет."
31070-13 = "Н-Не будет?!"
31070-14 = "Я-я знала! П-Просто решила забежать вперёд!"
31070-15 = "..."
31070-17 = ""
31070-18 = "Я не понимаю смысл этого предложения, Ханако."
31070-19 = "Это первая строка древнего эпоса. Она переводится как: «О богиня поэзии, воспой песнь ярости.»"
31070-20 = "А, это. Понятно."
31070-21 = ""
31070-22 = ""
31070-24 = ""
31070-25 = "..."
31070-27 = ""
31070-28 = "Ханако, вот это..."
31070-29 = "Это перевод с древнего языка. Подожди. Я возьму словарь, чтобы разобраться точнее."
31070-30 = "О, тогда, кажется, я понимаю. Gaudium et spes... Радость и надежда, кажется."
31070-31 = "Верно. Это девиз второго собора. Но важнее другое: ты умеешь читать на этом языке, Азуса?"
31070-32 = "Да. Научилась давно."
31070-33 = ""
31070-34 = ""
31070-36 = ""
31070-37 = "..."
31070-39 = "[ns] «Дела идут хорошо.»"
31070-40 = "Правда ведь? Ханако явно умеет объяснять! И у Азусы настоящее желание учиться!"
31070-41 = "А Кохару сказала, что скрывала свой полный потенциал..."
31070-42 = "...так что у меня чувство, что экзамены пройдут легко!"
31070-43 = "Какое облегчение. Честно говоря, я очень переживала..."
31070-44 = "Вообще-то Чаепитие приказало устроить учебный лагерь перед вторым экзаменом, если хотя бы одна из нас провалит первый."
31070-45 = "[s] «Учебный лагерь?»"
31070-46 = "Да. Они настроены настолько серьёзно. Если кто-нибудь провалит все три экзамена..."
31070-47 = "[s] «И что именно тогда будет?»"
31070-48 = "Н-Ничего! Думаю, нам не о чем переживать, так что давайте не накликать."
31070-49 = "При таком темпе экзамены не станут проблемой!"
31070-50 = ""
31070-52 = ""
31070-53 = "Кстати, может, Ханако провалилась, потому что тоже пропустила экзамен, как я? Она так хорошо учится. Не понимаю, как иначе она могла провалиться..."
31070-55 = "День первого специального академического аттестационного экзамена"
31070-56 = ""
31070-57 = ""
31070-58 = "..."
31070-59 = "Хм..."
31070-60 = ""
31070-61 = ""
31070-62 = ""
31070-63 = "Хи-хи."
31070-64 = "..."
31070-65 = ""
31070-66 = ""
31070-67 = "[ns] «Удачи всем на первом экзамене.»"
31070-68 = "М-Мне удача не нужна. Сейчас я покажу вам, что значит быть элитой!"
31070-69 = "А-Ахаха..."
31070-70 = "Ну, поехали. Хи-хи."
31070-71 = "Поняла. Все приготовления завершены."
31070-72 = ""
31070-74 = ""
31070-76 = "Следующий эпизод;Первый аттестационный экзамен"
