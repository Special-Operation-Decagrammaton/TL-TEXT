[translation]
2001003-1 = "Тренировка на горячих источниках: ремонт ванны"
2001003-2 = "Жилой корпус Шале"
2001003-3 = "Войдя в жилой корпус, я снова увидел Нодоку, ожидавшую меня в наряде хозяйки гостиницы при горячих источниках."
2001003-4 = "Добро пожаловать, Сенсей. Я вас ждала."
2001003-5 = "Вы сегодня много работали на улице в такую холодную погоду."
2001003-6 = "Если позволите, я прямо сейчас приготовлю для вас тёплую ванну."
2001003-7 = ""
2001003-10 = "[s] «...Что ты делаешь?»"
2001003-11 = "Сколько раз мне ещё повторять? Это моя тренировка на горячих источниках!"
2001003-12 = "К-Кхм!"
2001003-13 = "Как я уже говорила, гости сами потянутся на курорт с хорошими ваннами."
2001003-14 = "Поэтому сегодня я тренировалась ремонтировать ванны на случай нового потопа, как тот, что случился на курорте № 227."
2001003-15 = "[s] «Но в Шале ведь нет горячих источников...»"
2001003-16 = "Конечно, я это знала. Я ведь всегда за всем наблюдаю."
2001003-17 = "Но в Шале есть довольно большая купальня, в которой могут поместиться несколько человек, верно?"
2001003-18 = "Я усердно приводила эту ванну в порядок, словно это любимая купальня курорта № 227."
2001003-19 = "Я вымыла полы и пополнила запас средств для ванной, которые почти закончились."
2001003-20 = "[s] «Но...»"
2001003-21 = "Ваша любимая бомбочка для ванны — шипучая с ароматом лаванды от компании Futsu Futsu! Я знаю, потому что видела, как вы покупаете её в магазине."
2001003-22 = "Я знала, что она вам понадобится, поэтому приготовила её заранее."
2001003-23 = "Если дать ей раствориться заранее, аромат может выветриться, поэтому используйте её прямо перед тем, как войдёте в ванну!"
2001003-24 = "[s] «Так вот, дело в том...»"
2001003-25 = "Температура воды 40 градусов подойдёт? Я знаю, что примерно в это время вы любите снимать усталость в горячей воде."
2001003-26 = "Я открыла горячую воду 30 минут назад, так что сейчас температура должна быть идеальной."
2001003-27 = "Ну же, переодевайтесь и залезайте в ванну! *тяжело дышит* *тяжело дышит*"
2001003-28 = "[s1] «Нодока, послушай меня.»\n[s2] «Сегодня горячей воды нет из-за работ в здании.»"
2001003-29 = ""
2001003-30 = ""
2001003-32 = ""
2001003-33 = "Ч-Что?! Горячую воду отключили?"
2001003-34 = "Вот почему вода, которой я убиралась, была такой еле тёплой."
2001003-35 = "О нет. Что же делать? Я вся перепачкалась, пока чистила ванную."
2001003-36 = "[s] «Эм... спасибо, что убралась...»"
2001003-37 = "Уф, а я ждала, когда вы первым примете ванну."
2001003-38 = "А потом, когда вы выйдете, собиралась сама спокойно искупаться в оставшейся воде."
2001003-39 = "Похоже, сегодня мне просто не везёт."
2001003-40 = "Здесь поблизости случайно нет другой купальни?"
2001003-42 = "(В итоге мы нашли общественную баню неподалёку от Шале и помылись там.)"
2001003-43 = "(После купания я купил расстроенной Нодоке кофейное молоко.)"
