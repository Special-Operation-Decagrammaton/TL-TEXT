[translation]
1006615-1 = "Снаряжение героини-горничной"
1006615-2 = "Здравствуйте! Сегодня я пришла, чтобы убрать ваш Дом гильдии!"
1006615-3 = "[s] «Г-гильдии...?»"
1006615-4 = "Гильдии выдают приключенцам квесты, распределяют награды и помогают собирать отряды."
1006615-5 = "А ещё предоставляют информацию через доску объявлений. Судя по этому описанию, это Дом гильдии."
1006615-6 = "Однако в Доме гильдии обязательно должна быть милая девушка-регистратор, а здесь такой нет. Как нам исправить это несоответствие, Сенсей?"
1006615-7 = ""
1006615-9 = ""
1006615-10 = "А, придумала. Я сменю класс на «регистратора.»"
1006615-11 = "Хотя... поскольку я всего лишь студент героини-горничной, возможно, опция смены класса у меня ещё не разблокирована."
1006615-12 = "М-м! Сенсей, прошу вашей помощи."
1006615-13 = "[s] «Сначала давай закончим уборку...»"
1006615-14 = "..."
1006615-15 = "Конечно. Прежде чем брать новый квест, нужно завершить текущий."
1006615-16 = "Хорошо, Сенсей! Мы будем убираться вместе, находить скрытые предметы и заодно получать EXP."
1006615-17 = "Говорите, скрытых предметов здесь нет? Неправда. Вы много знаете, Сенсей, но не всеведущи."
1006615-18 = "В комнате клуба мы почти наверняка найдём скрытые предметы. Скорее всего, потерянные игры Момои и Мидори."
1006615-19 = "Может быть, даже Юзу найдём!"
1006615-20 = ""
1006615-24 = "Я сделал себе пометку объяснить ребятам из Клуба разработки игр, насколько важно прибираться."
1006615-26 = ""
1006615-27 = ""
1006615-28 = ""
1006615-29 = ""
1006615-30 = ""
1006615-37 = ""
1006615-38 = "Вуаля! Дом гильдии теперь чист. Но..."
1006615-39 = ""
1006615-42 = ""
1006615-43 = "Это большая улитка? ...Нет, это куча белья. Теперь я знаю, что стирка — важная часть уборки."
1006615-44 = "От кого я это узнала? Конечно же, от Нэру! Она бывает довольно пугающей, но..."
1006615-45 = "...в глубине души она добрая. Пойдёмте, Сенсей. Где стиральная машина?"
1006615-46 = "Здесь... нет стиральной машины?"
1006615-47 = "О нет, Сенсей! Вы никогда не стирали эту одежду? Это... мягко говоря, не очень хорошо."
1006615-48 = "Прочность вашей брони со временем снижается. Если её не чинить, она может полностью развалиться."
1006615-49 = "[s] «Нет-нет. Я просто ухаживаю за ней по-другому...»"
1006615-50 = "Вот как?"
1006615-52 = ""
1006615-53 = "А. Вы выдаёте квест на стирку местной прачечной. Это допустимо и даже успокаивает."
1006615-54 = "Что-то не так, Сенсей? ...Моя повязка горничной?"
1006615-55 = "Ох... Её прочность заметно снизилась. Похоже, квест по уборке Дома гильдии дал о себе знать."
1006615-56 = "[s] «Давай заодно постираем и повязку.»"
1006615-57 = "..."
1006615-58 = "Как скажете, Сенсей."
1006615-59 = "А пока у меня случайно есть запасная."
1006615-60 = ""
1006615-62 = ""
1006615-63 = ""
1006615-65 = "[ns] «Ого, ты носишь с собой запасную повязку горничной?»"
1006615-66 = ""
1006615-67 = "Конечно. Это один из трёх символов героини-горничной. Я просто не могу оставаться без неё."
1006615-68 = "[s] «Три символа героини-горничной...? Расскажи подробнее.»"
1006615-69 = "Вы не знали? Тогда начинаем обучение."
1006615-70 = "Есть три ключевых предмета, доказывающих, что ты героиня-горничная: швабра, костюм горничной и повязка горничной."
1006615-71 = "И повязка — самая важная из них!"
1006615-72 = "Почему? Потому что она служит защитным снаряжением для головы."
1006615-73 = "А голова важна во многих отношениях. Урон по голове может наложить тяжёлые негативные эффекты. Кроме того, беспорядок в голове даёт штрафы ко всем действиям."
1006615-74 = "Поэтому эта повязка помогает мне снова сосредоточиться как героине-горничной!"
1006615-75 = ""
1006615-78 = "[ns] «(Так что вообще такое героиня-горничная...?)»"
1006615-79 = "Вы понимаете. Нужно сохранять правильный настрой."
1006615-80 = "Я не могу увидеть или потрогать этот настрой, но без него потеряла бы ощущение собственной личности и цели."
1006615-81 = "Так что без этой повязки я не смогла бы быть собой и делать то, что делаю."
1006615-82 = "[s] «Но разве ты не стала намного лучше по сравнению с тем, что было раньше?»"
1006615-83 = "Вы правда так думаете? Большое спасибо, Сенсей! Услышать это от вас очень поднимает мой боевой дух."
1006615-84 = "Однако... мне всё ещё предстоит долгий путь."
1006615-89 = "*ж-ж-ж*"
1006615-90 = "В прачечной шумели стиральные и сушильные машины."
1006615-91 = ""
1006615-92 = "Мне ещё нужно освоить множество навыков горничной. Уборка уже прокачалась, но характеристики стирки и готовки пока низкие."
1006615-93 = "Даже сейчас обычная машина выполняет квесты по стирке лучше меня."
1006615-94 = "[s] «Ничего страшного, ничего...»"
1006615-95 = "Я едва ли достойна называться «героем.»"
1006615-96 = "У меня есть мечта о мире, Сенсей. Я мечтаю о мире, где все счастливы, где нет печали и страданий."
1006615-97 = "Конечно... осуществить такую мечту будет очень трудно."
1006615-98 = "Для простого студента это недостижимо, но хотя бы тех, кто рядом со мной, я хочу защитить."
1006615-99 = "Да, это мне по силам. А чтобы этого добиться, мне нужны..."
1006615-100 = "...хорошо развитая сила и правильный настрой."
1006615-101 = "Поэтому мне остаётся только продолжать идти вперёд."
1006615-102 = "Пусть моё снаряжение героини-горничной поможет мне пройти этот путь!"
1006615-103 = ""
1006615-106 = "[ns] «(Я всё ещё не понимаю, что такое героиня-горничная...)»"
1006615-107 = "Сенсей, я верю, что в этом мире существует настоящая магия."
1006615-109 = "Мне кажется, она скрывается в радости..."
1006615-110 = ""
1006615-114 = "...и в смелости."
1006615-115 = ""
1006615-119 = "Я считаю, что настоящая смелость — это способность понять мир глазами тех, кому тяжело."
1006615-120 = ""
1006615-124 = "Думаю, именно поэтому игры так увлекательны. Они передают красоту такого взгляда и позволяют хоть немного ощутить это понимание."
1006615-125 = "Пустыня становится ещё прекраснее благодаря скрытому в ней оазису. ...По крайней мере, так я читала в одной сказке."
1006615-126 = ""
1006615-130 = "В любом случае, я хочу узнавать этот мир всё лучше, шаг за шагом."
1006615-131 = ""
1006615-135 = "Конечно, я понимаю, что не всё в мире будет красивым или приятным. Я научилась это принимать. Поэтому иногда мне бывает страшно."
1006615-136 = ""
1006615-140 = "Но смелость может означать и то, чтобы продолжать идти вперёд перед лицом трудностей."
1006615-142 = "[ns] «...Но тебе всё равно может быть страшно. Если этот страх действительно придёт, что ты будешь делать?»"
1006615-143 = "..."
1006615-144 = "...Если мне станет страшно, я найду вас."
1006615-145 = ""
1006615-146 = "В такие моменты нужно обращаться именно к вам, Сенсей. Вы... талисман нашей группы."
1006615-147 = "Пусть вы и не боец передовой линии, одно ваше присутствие в группе поднимает всем дух."
1006615-148 = "Так что, Сенсей..."
1006615-149 = "...вы и дальше будете участвовать в моих приключениях?"
1006615-150 = "[s1] «А для чего вообще нужны талисманы?»\n[s2] «Я постараюсь как следует выполнять свою роль.»"
1006615-153 = "Ха! Как я и ожидала! Я очень рада, что у меня есть такой Сенсей."
1006615-158 = "Сушильная машина звякнула и постепенно остановилась."
1006615-159 = ""
1006615-160 = "А, квест по стирке завершён. Прочность повязки горничной восстановлена."
1006615-161 = ""
1006615-163 = ""
1006615-165 = "Ну что же, отправимся искать следующий квест — вместе, как Сенсей и героиня-горничная!"
1006615-166 = ""
1006615-168 = ""
1006615-169 = "[ns] «(Значит, героиня-горничная — это... Эм...)»"
1006615-170 = ""
1006615-173 = "[ns] «(Вообще-то, кажется, это уже неважно.)»"
1006615-175 = "Взявшись за руки, мы пошли обратно, по пути любуясь окрестностями."
