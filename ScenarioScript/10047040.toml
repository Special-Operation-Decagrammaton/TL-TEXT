[translation]
10047040-1 = "Эпизод 4;Носитель голоса..."
10047040-4 = "Мы побежали к центру академии."
10047040-5 = "[ns] «Фух... Вот это... пробежка...»"
10047040-6 = "Да. Здесь мы должны быть в безопасности."
10047040-7 = "Ню-фу-фу. Мы наверняка оторвались от Проклятого."
10047040-8 = "А, хватит драматизировать! Ты только путаешь Сенсея такими речами!"
10047040-9 = "[ns1] «Кстати говоря... Что на самом деле произошло в галерее?»\n[ns2] «Как статуя демона двигалась сама по себе?»"
10047040-12 = "Из-за паранормального явления... называемого полтергейстом."
10047040-13 = "Хи-хи... Осторожнее... Призрак статуи демона... запомнит вас, Сенсей."
10047040-14 = "Какой ещё полтергейст?! Статуя демона двинулась, потому что ваши крики расшатали постамент!"
10047040-15 = "[s] «А? Так вот что это было?»"
10047040-16 = "Хех... Можете верить во что хотите."
10047040-17 = ""
10047040-19 = ""
10047040-20 = "Посмотрите на это бесстыжее лицо! Всё это мистификация! Шутка!"
10047040-21 = "Не существует никаких демонов... или магии!"
10047040-22 = "[s] «Как я понимаю, ты не веришь в оккультизм.»"
10047040-23 = ""
10047040-25 = ""
10047040-26 = "*вздох*... Нет. Просто мне не повезло поселиться с кучкой старших, помешанных на нём."
10047040-27 = "Что я такого сделала, чтобы заслужить это?"
10047040-28 = "[s] «А как вы вообще познакомились?»"
10047040-29 = "Меня поселили в комнату 404. Вот и всё."
10047040-30 = "Такие студенты, как мы, ничего не решают. Ассамблея решила заселить меня с этими тремя — и точка."
10047040-31 = ""
10047040-33 = ""
10047040-34 = "А, Ассамблея — это..."
10047040-35 = ""
10047040-36 = "Официальное название — Ассамблея искусств."
10047040-37 = "Это организация, которая оценивает художественную ценность наших работ по... очень строгим категориям. Можно считать её ученическим советом."
10047040-38 = "Вы ведь встретили Совет префектов на пункте досмотра? Они тоже подчиняются Ассамблее. Её власть абсолютна и неоспорима."
10047040-40 = "Именно они распределяют комнаты в общежитии. Я не могу прийти и сказать: «Ой, мы с соседками не ладим». Им всё равно!"
10047040-41 = "Очевидно, в этой ситуации я могу сделать только одно."
10047040-42 = "...Заставить этих чудиков перестать быть чудачками! Тогда у меня наконец будет нормальная школьная жизнь!"
10047040-43 = "[s] «Ага, понятно! Ты заботишься о своих подругах!»"
10047040-44 = ""
10047040-46 = ""
10047040-47 = "Простите? С чего вы это взяли?"
10047040-48 = "Вот увидите. Я заставлю всех троих открыть глаза на правду!"
10047040-49 = "Какая решимость... Мне нравится..."
10047040-50 = "Искренняя радость — распространять славу оккультизма среди младших вроде Рэны..."
10047040-51 = "Хмф, думаете, сможете меня обмануть? У меня иммунитет к мистификациям!"
10047040-52 = "Хи-хи... Хорошо... Вот это настрой..."
10047040-53 = ""
10047040-55 = ""
10047040-56 = ""
10047040-57 = ""
10047040-58 = "А теперь отправимся в следующее место. Карты говорят, что дальше нам следует направиться в..."
10047040-59 = ""
10047040-61 = ""
10047040-62 = ""
10047040-63 = "О-хо, интересно..."
10047040-64 = ""
10047040-66 = ""
10047040-67 = ""
10047040-68 = "Значит, мы идём туда..."
10047040-69 = "Все, за мной. Хи-хи..."
10047040-71 = "Улица искусств Вайлдханта"
10047040-73 = "Эта, наша главная улица, посвящена искусству..."
10047040-74 = "Вы можете видеть, что вдоль неё стоят древнейшие скульптуры Вайлдханта..."
10047040-75 = "Каждую работу создал не просто художник... а легенда..."
10047040-76 = "Да! Рельеф и дизайн этого фонтана создал «Леопардо・Да・Пинчи», и он почти ровесник самого Вайлдханта!"
10047040-77 = "[s] «О... Кажется, я однажды видел это в журнале.»"
10047040-78 = "Ню-ху-ху-ху. А поскольку здесь так много великих произведений искусства, разумеется, полно и оккультных историй!"
10047040-79 = "Ох, только не начинай...!"
10047040-80 = ""
10047040-82 = ""
10047040-83 = "[ns] «Хм. Каких историй?»"
10047040-84 = "Давным-давно некоторые безнравственные художники нарушили табу и попытались оживить свои произведения!"
10047040-85 = "Хотите верьте, хотите нет, они замуровывали живых людей внутри скульптур!"
10047040-86 = "Многие из тех скульптур стоят прямо на этой улице. Так что... говорят... из статуй можно услышать шёпот измученных призраков!"
10047040-87 = "О чём ты вообще? Скульптуры вырезают из мрамора. Нельзя просто взять и засунуть внутрь человека!"
10047040-88 = "Хм... Может, речь была скорее о... затвердевшем цементе. Или гипсе?"
10047040-89 = "Кто вообще стал бы делать такое?!"
10047040-90 = "Тогда как ещё объяснить призрачный шёпот и стоны?"
10047040-91 = "Наверное, это студенты прячутся и плачут после проваленных экзаменов!"
10047040-92 = "Хи-хи... Тогда давайте проверим сами."
10047040-93 = "Это всего лишь история...?"
10047040-94 = ""
10047040-96 = ""
10047040-97 = "...Или призраки действительно существуют?"
10047040-98 = ""
10047040-100 = ""
10047040-101 = ""
10047040-102 = "Для начала разделимся и послушаем звуки возле скульптур."
10047040-103 = "А через десять минут встретимся здесь."
10047040-104 = "Хорошо! Начинаем!"
10047040-105 = ""
10047040-107 = ""
10047040-108 = ""
10047040-109 = ""
10047040-110 = ""
10047040-111 = "Х-Хмф! Я не боюсь! Подумаешь!"
10047040-112 = ""
10047040-114 = ""
10047040-115 = "...А? Почему вы просто стоите, Сенсей?"
10047040-116 = "[s3] «Вообще-то мне страшно...»\n[s4] «Я плохо знаю это место.»"
10047040-119 = "Хмф, трусишка."
10047040-120 = "Л-Ладно. Тогда я пойду с вами, и будем искать вместе."
10047040-121 = "Только не позорьте меня. Всё это обман, ясно?"
10047040-122 = "[s] «Обязательно держись рядом со мной.»"
10047040-123 = "Н-Не обращайтесь со мной как с маленькой! Я не боюсь! Правда!"
10047040-125 = "Мы с Рэной прислушивались возле одной скульптуры."
10047040-127 = ""
10047040-128 = ""
10047040-129 = ""
10047040-130 = ""
10047040-132 = "Хмф, это просто ветер. Ничего больше. Никакого призрачного шёпота..."
10047040-134 = "[log=???][ff4444]Выпустите меня... Мне нужно... выбраться...[-][/log]"
10047040-137 = ""
10047040-138 = "Ч-Что это было? Вы что-то сказали, Сенсей?"
10047040-139 = "[s] «И-и! Понятия не имею!»"
10047040-140 = "Был звук! Это был голос. Он звучал так странно, и—"
10047040-141 = "[ns] «Ч-Что происходит...?!»"
10047040-143 = "[log=???][ff4444]Я прокляну их...[-][/log]"
10047040-144 = "[log=???][ff4444]Я прокляну тех... кто превратил меня в это...[-][/log]"
10047040-147 = "И-И-И?!"
10047040-148 = "К-Каноэ! Это ты, да?! Ты вполне могла такое устроить! Это просто розыгрыш, правда?!"
10047040-149 = ""
10047040-151 = ""
10047040-155 = ""
10047040-156 = ""
10047040-157 = ""
10047040-158 = "...Хи-хи. Ты меня поймала."
10047040-159 = "Ой, да ладно! Я так и знала!"
10047040-161 = "[log=???][ff4444]Выпустите меня... Пожалуйста... Выпустите...[-][/log]"
10047040-164 = "...А? Это была не я."
10047040-166 = "ИИИИИИК?!"
10047040-167 = "Н-Но голос точно шёл со стороны Каноэ...!"
10047040-168 = "Ты же видела. Мои губы были сомкнуты."
10047040-170 = "[log=???][ff4444]Верно... Это не она...[-][/log]"
10047040-173 = "К-Кто это?! Кто тут такой великий шутник?"
10047040-175 = "[log=???][ff4444]Вам меня не поймать! Бе-е... бе-е...[-][/log]"
10047040-178 = "Шья-а! Не смей надо мной издеваться!"
10047040-179 = ""
10047040-181 = ""
10047040-182 = ""
10047040-183 = "Здесь? Угх, нет..."
10047040-184 = ""
10047040-186 = ""
10047040-187 = ""
10047040-188 = "В-В-Выходи уже!!"
10047040-189 = ""
10047040-191 = ""
10047040-192 = "Кар! Ка-а-р!"
10047040-193 = "В-Ворона...?"
10047040-194 = "Может... это была ворона."
10047040-195 = "Ворон тоже можно научить разговаривать..."
10047040-196 = "Думаешь, я не знаю, как звучит ворона?!"
10047040-198 = "...Мы ещё некоторое время искали, но так и не выяснили, кто говорил."
10047040-200 = "А? Ты разговаривала с призраком?"
10047040-201 = "Хи-хи. «Бе-е, бе-е»? Звучит как милый призрак."
10047040-202 = "Я же говорю! Кто-то нас разыгрывал!"
10047040-203 = "Хи-хи... Э-хе-хе..."
10047040-204 = "[s] «...Это всё-таки была ты, да?»"
10047040-205 = "Кто знает...?"
10047040-206 = "[s5] «Чревовещание и очень гибкий голос...»\n[s6] «Значит, твоя специальность — это...»"
10047040-209 = "Однажды расскажу. А до тех пор давайте наслаждаться тайной."
10047040-210 = "Хи-хи, э-хе-хе...!"
10047040-211 = "[s] «П-Понятно...»"
10047040-212 = "Тогда пойдём дальше... Я ещё столько всего хочу вам показать, Сенсей..."
10047040-213 = ""
10047040-215 = ""
10047040-217 = "После этого они водили меня по всей академии Вайлдхант."
10047040-219 = "Учебный класс Вайлдханта"
10047040-220 = ""
10047040-222 = "Сад Вайлдханта"
10047040-223 = ""
10047040-225 = "Информационный центр искусств Вайлдхант"
10047040-226 = ""
10047040-228 = "Большой зал Вайлдханта"
10047040-229 = ""
10047040-231 = "...И ещё множество мест."
10047040-233 = "Ну что, Сенсей. Как вам? Было весело?"
10047040-234 = "[s] «Да! Было очень весело. Часы пролетели незаметно!»"
10047040-235 = "Ню-ху-ху. Не радуйтесь слишком рано. Лучшее мы оставили напоследок."
10047040-236 = "Согласно Аркане, последняя остановка нашей экскурсии — это..."
10047040-237 = "Призыв демона при помощи магического глифа!"
10047040-238 = "[s] «Ты... говоришь о настоящем демоне?»"
10047040-239 = "Конечно... они ведь существуют, разве нет?"
10047040-240 = "Мяу! Мя-я-у!"
10047040-241 = "Кар! Ка-а-р!"
10047040-242 = "Слышите...? Они полностью согласны."
10047040-243 = "Ага, фамильяры всё подтвердили. Это правда."
10047040-244 = "Всё было предрешено судьбой. Вам не сбежать, Сенсей."
10047040-246 = "Хи-хи, э-хе-хе..."
10047040-247 = "Ню-ху, ню-ху-ху-ху!"
10047040-248 = "Пожалуйста, меня в это не втягивайте..."
10047040-250 = "Видя, как счастливо Оккультное общество, я с нетерпением ждал следующего розыгрыша."
