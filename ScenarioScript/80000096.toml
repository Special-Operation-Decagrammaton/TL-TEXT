[translation]
80000096-1 = "Женщина, которая всегда найдёт способ"
80000096-2 = "Был самый разгар дня, поэтому я был занят работой."
80000096-3 = ""
80000096-6 = "[ns1] «...Мне пришла посылка?»\n[ns2] «Из Миллениума?»"
80000096-16 = "[log=코유키]«...Дорогой Сенсей.»[/log]"
80000096-19 = "[log=코유키]«Искренне благодарим вас за всю работу с Семинар, а также за всю вашу помощь.»[/log]"
80000096-22 = "[log=코유키]«Приятного аппетита! Желаю счастливого Дня святого Валентина.»[/log]"
80000096-25 = "[log=코유키]«С уважением, Коюки из Семинар.»[/log]"
80000096-30 = "[ns3] «Что-то здесь нечисто...»\n[ns4] Разломить шоколад пополам."
80000096-33 = "[ns5] «...В шоколаде клочок бумаги!»\n[ns6] «А. Так в этом и был смысл подарка?!»"
80000096-36 = "«...Я счастлива.»"
80000096-37 = "«Если вы читаете эту бумажку, значит моё сообщение благополучно прошло мимо старших.»"
80000096-38 = "«Сенсей. Меня держат в комнате саморефлексии. Как вы понимаете, мне отчаянно нужна помощь.»"
80000096-39 = "«Найти место и время, чтобы написать это, было трудно. За мной постоянно следят зоркие глаза старших.»"
80000096-40 = "«Сенсей....»"
80000096-41 = "«ПОМОГИТЕ!!»"
80000096-42 = "«Вы! моя! последняя! надежда!»"
80000096-43 = "«...Пожалуйста, не бросайте своего бедного студента. В отчаянии, Коюки.»"
80000096-44 = ""
80000096-48 = "Фувааа! Ахахаха!! Свежий воздух! Этот вид! Я свободна!!"
80000096-49 = "*вздох* Боже..."
80000096-50 = "Я правда думала, что там мне конец. Правда!"
80000096-51 = "Но никогда не списывайте Куросаки Коюки со счетов. Я не сдаюсь. Всегда нахожу выход!"
80000096-52 = "Спасибо, Сенсей. Вы уже столько раз спасали мне жизнь!"
80000096-53 = "[s7] «Ещё раз... раскаяться — значит...»\n[s8] «...в следующий раз поступить лучше.»"
80000096-54 = "Вы правда думали, что я там всерьёз занималась саморефлексией?"
80000096-55 = "Ахаха! Вы вообще о чём?!"
80000096-56 = "...О!"
80000096-57 = "Кстати, что стало с шоколадом? Вы всё съели?"
80000096-58 = "Понравился? Рада слышать! Я очень старалась, чтобы он был и вкусным, и функциональным!"
80000096-59 = "[s9] «...А? Ты приложила много усилий? Ты, Коюки?»\n[s10] «Хочешь сказать, ты сделала его сама?»"
80000096-62 = "...А?"
80000096-63 = "Ага. И что?"
80000096-64 = "...А?"
80000096-65 = "Почему мне пришлось делать самой? Ну, п-потому что..."
80000096-66 = ""
80000096-68 = ""
80000096-69 = "Ч-Что за глупые вопросы? Я только что сказала, что он должен был быть функциональным, разве нет?"
80000096-70 = "Мне нужно было спрятать письмо! Т-Точно! Да-да!!"
80000096-71 = "[s11] «А-ха! Ну разумеется!»\n[s12] «Таков и был истинный план!!»"
80000096-74 = "Х-Хи-хи! В точку, Сенсей! Т-Точно! Ага."
80000096-75 = "Ах! Боже мой. Не могу поверить, что план сработал! Тут прямо нужен злодейский смех... Ня! Ха! Ха! Ха!"
80000096-76 = "К тому же такой способ, похоже, трудно отследить, значит какое-то время я ещё смогу им пользоваться..."
80000096-77 = "Сенсей, с этого момента..."
80000096-78 = ""
80000096-80 = ""
80000096-81 = "...я снова буду на вашем попечении, хорошо? Хи-хи-хи."
80000096-83 = "После этого я осторожно покинул здание вместе с Коюки."
80000096-84 = "Разумеется, информационная сеть Семинар раскрыла всё, поэтому Коюки больше никогда не смогла воспользоваться этим способом побега."
