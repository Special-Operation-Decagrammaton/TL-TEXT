[translation]
1007502-1 = "Материалы"
1007502-2 = ""
1007502-3 = ""
1007502-4 = ""
1007502-5 = "Я не знал, какое перо лучше выбрать, поэтому купил то, которое посоветовал продавец."
1007502-6 = ""
1007502-8 = ""
1007502-10 = ""
1007502-12 = ""
1007502-13 = ""
1007502-14 = ""
1007502-15 = ""
1007502-17 = "Наверное, из-за того, что я так долго разговаривал с продавцом, в итоге мне ещё дали целую кучу бесплатных дополнений..."
1007502-19 = ""
1007502-20 = "Добро пожаловать, Сенсей! Я вас заждалась!"
1007502-21 = "Все мои идеи и творческое вдохновение чуть не увяли!"
1007502-22 = "Ну, ну? Вы купили перо для планшета? Купили?"
1007502-23 = "[s] «Конечно. Вот! Одно перо для планшета!»"
1007502-24 = "Отлично! Теперь я могу... могу...?"
1007502-25 = ""
1007502-27 = ""
1007502-28 = ""
1007502-29 = "С-Сенсей...?"
1007502-30 = "[s1] «Что случилось, Мэру? Я... купил не тот тип?»\n[s2] «Я даже попросил совета у продавца...»"
1007502-33 = "Нет, скорее наоборот? Не знаю... Это слишком...!"
1007502-34 = "Перо для планшета такого качества... В Красной Зиме о таких только слухи ходят."
1007502-35 = "Вы уверены, что это мне? Такая дорогая вещь? Правда? Точно?"
1007502-36 = "[s] «Если будешь хорошо им пользоваться, цена не важна.»"
1007502-37 = "Тогда я просто не могу отказаться! Личный подарок от Сенсея!"
1007502-38 = ""
1007502-40 = ""
1007502-41 = "А что ещё здесь? Что?! Столько запасных наконечников?!"
1007502-42 = "[s3] «Чему ты так удивляешься?»\n[s4] «А, их мне просто бесплатно дали.»"
1007502-45 = "Вы что, думаете, в Красной Зиме у нас всё настолько плохо?! Хотя... полностью отрицать это я не могу..."
1007502-46 = "Гранаты, ковши экскаваторов и гидравлическое оборудование у нас найти проще простого!"
1007502-47 = "А вот качественные салфетки, мыло, шариковые ручки или по-настоящему хороший пудинг достать очень сложно!"
1007502-48 = "[s] «Ага... Для Красной Зимы звучит правдоподобно...»"
1007502-49 = "К-Кхм. В любом случае, спасибо."
1007502-50 = ""
1007502-52 = ""
1007502-53 = "Мне кажется, я должна как-то отплатить вам..."
1007502-54 = "Что учителя любят получать в подарок?"
1007502-55 = "[s] «Не переживай. Учителю естественно помогать своим ученикам.»"
1007502-56 = "Да ладно! Если уж вы так, я могу сказать, что ученику естественно хотеть отплатить учителю за помощь!"
1007502-57 = "[s5] «Мне правда ничего не нужно.»\n[s6] «Мне достаточно, чтобы вы, ученики, ладили друг с другом. Хе-хе.»"
1007502-60 = "...Вы обращаетесь со мной как с ребёнком, Сенсей! Я этого не позволю!"
1007502-61 = "Ну и ладно! Я воспользуюсь вашим подарком — запасными наконечниками — и сама что-нибудь для вас сделаю!"
1007502-62 = "...Какой у меня план? Хи-хи-хи."
1007502-63 = ""
1007502-65 = ""
1007502-66 = "Персональный портрет Сенсея!"
1007502-67 = "[s] «О! Ох... Нет, правда, не нужно.»"
1007502-68 = "Нет, нужно! Просто представьте, что мои услуги — как у тех уличных художников, которые рисуют карикатуры за безумные деньги!"
1007502-69 = "Только гораздо лучше! Потому что бесплатно и от меня!"
1007502-70 = "[s] «Я правда это ценю. Но не хочу доставлять тебе столько хлопот.»"
1007502-71 = "О чём вы? С чего бы это вообще было для меня хлопотами?"
1007502-72 = "Наоборот! Всегда полезно практиковаться на новых моделях."
1007502-73 = "Такой шанс раз в жизни может больше никогда не представиться! Поэтому сидите смирно и принимайте мой подарок!"
1007502-76 = ""
1007502-78 = ""
1007502-79 = "Вы собираетесь сопротивляться до конца?! Это лишь заставляет душу художника во мне гореть ещё ярче!"
1007502-80 = "Забудьте про отплату! Просто дайте мне вас нарисовать!"
1007502-83 = "[ns] «Кто-нибудь, помогите! Монстр-рисовальщик пытается меня зарисовать!»"
1007502-84 = ""
1007502-86 = ""
1007502-87 = "Хи-хи-хи. Кричите сколько хотите! Здесь никто не услышит ваших мольб!"
1007502-88 = "Библиотека Фронта освобождения знаний находится в стороне от остального кампуса! Здесь только вы и я!"
1007502-89 = "[s7] «Ты не оставляешь мне выбора! Перо или рисунок?!»\n[s8] «Либо бери перо, либо рисуй меня! Выбирай!»"
1007502-92 = ""
1007502-94 = ""
1007502-95 = "А?"
1007502-96 = "Погодите. Я в тупике. Можно выбрать только одно? Перо или рисунок Сенсея?"
1007502-97 = "Но без пера я вообще не смогу вас нарисовать!"
1007502-98 = "Угх! Так вы, взрослые, решаете проблемы? Манипуляции! Нечестно! Вредина!"
1007502-99 = "[s] «Хе-хе... Иногда взрослым приходится быть немного вредными.»"
1007502-100 = "Неужели это конец пути для моей души художника? Неужели моё пламя угасает?"
1007502-101 = "Ладно! Вы выиграли эту битву! Давайте перо и запасные наконечники! Сегодня вам повезло!"
1007502-102 = "Но пока у меня есть перо, я не сдамся. Я ОБЯЗАТЕЛЬНО вас нарисую, Сенсей!"
1007502-103 = ""
1007502-105 = ""
1007502-107 = ""
1007502-108 = "Чтобы осуществить мечту, я буду следить за каждым вашим вдохом! Изучу каждую линию вашего лица!"
1007502-110 = "Остаток дня я убегал от Мэру, пока она пыталась меня «изучить». Мы и не заметили, как начало садиться солнце."
