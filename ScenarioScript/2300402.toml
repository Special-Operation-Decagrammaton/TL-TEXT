[translation]
2300402-1 = "Мастерство"
2300402-2 = "Мастерская Инженерного Департамента"
2300402-4 = "Я пришёл в Инженерный отдел забрать подставку для карандашей, которую попросил сделать Утаху."
2300402-6 = "Нет... Так не пойдёт..."
2300402-7 = "[s1] «Я здесь, Утаха.»\n[s2] «Подставка для карандашей готова?»"
2300402-8 = "А, Сенсей, ты здесь. Подожди ещё немного, пожалуйста."
2300402-9 = "А, Сенсей, ты здесь. Подожди ещё немного, пожалуйста."
2300402-10 = "Возникла небольшая непредвиденная проблема."
2300402-11 = "[s] «Ничего страшного. Не спеши.»"
2300402-12 = "...Хорошо. Обычно такого не бывает, но сегодня станок почему-то работает плохо."
2300402-13 = "Надеюсь, той же проблемы больше не будет..."
2300402-15 = "Спустя некоторое время..."
2300402-17 = "Готово. Пожалуйста, осмотри результат."
2300402-19 = "..."
2300402-20 = "[s] «Ого, лучше, чем я ожидал. Думаю, этого...»"
2300402-21 = "Нет, не так!"
2300402-22 = "[s] «Что случилось?»"
2300402-23 = "Это не та подставка, которую я хотела сделать!"
2300402-24 = "Посмотри. Отделка небрежная, а ламинация изгибается не так, как на чертеже!"
2300402-25 = "И прочность слишком низкая! Она даже пулю .22 калибра не отразит!"
2300402-26 = "[s3] «По-моему, всё хорошо...»\n[s4] «Мне не нужна пуленепробиваемая подставка для карандашей...»"
2300402-27 = "Нет. Даже если тебя устраивает, меня — нет. Это брак!"
2300402-28 = "Нет. Даже если тебя устраивает, меня — нет. Это брак!"
2300402-29 = "Мне будет ужасно стыдно, если другие студенты узнают, что я подарила тебе дефектную вещь..."
2300402-30 = "[s] «Правда, всё нормально...»"
2300402-31 = "Не волнуйся, Сенсей. Ради чести Инженерного отдела я сделаю по-настоящему идеальную подставку."
2300402-32 = "Подожди ещё совсем немного!"
2300402-34 = "Но с такими строгими стандартами Утахи..."
2300402-36 = "Готово. Пожалуйста, осмотри результат."
2300402-37 = "Эта тоже никуда не годится!"
2300402-38 = "[s] «...А теперь что?»"
2300402-39 = "Смотри! Здесь остался след от удалённой поддержки!"
2300402-40 = "Похоже, у экструзионных принтеров есть предел..."
2300402-41 = "Ещё раз! Печатаем снова!"
2300402-42 = "[s] «Мне всё равно, если она будет с дефектом. Пожалуйста, остановись...»"
2300402-45 = "После этого понадобилось ещё десять подставок, прежде чем Утаха осталась довольна."
