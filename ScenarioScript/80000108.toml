[translation]
80000108-1 = "Вершина совершенства"
80000108-2 = "Здравствуйте, Сенсей."
80000108-3 = "[s] «Прости, Токи. Я заставил тебя долго ждать?»"
80000108-4 = "Вовсе нет. Кроме того, причина нашей встречи изначально не настолько важна."
80000108-5 = "Пойдёмте, Сенсей?"
80000108-6 = "[s] «Значит, в офис Токи... верно?»"
80000108-7 = "Верно. Уверена, вы уже привыкли к этому месту."
80000108-8 = "Идёмте, Сенсей. Я вас провожу."
80000108-13 = "Добро пожаловать, Сенсей. Можете сесть вон там."
80000108-15 = "Я посмотрел туда, куда указала Токи, и заметил аккуратно расставленные стол и стул..."
80000108-16 = ""
80000108-20 = ""
80000108-21 = "[ns] «Итак, Токи, я сел. Зачем мы сегодня здесь?»"
80000108-22 = "Хорошо, начиная с этого момента..."
80000108-23 = "...я подам вам специальный валентиновский шоколадный курс, предназначенный только для вас, Сенсей."
80000108-24 = "[s1] «О, сегодня День святого Валентина! Так вот почему...»\n[s2] «...ты так сильно постаралась?»"
80000108-27 = "Верно."
80000108-28 = "Я решила, что такой день не стоит упускать. После долгих размышлений мне показалось, что это лучший способ отплатить вам за всё, что вы для меня сделали, Сенсей."
80000108-29 = "А именно..."
80000108-30 = "[s] «А именно...?»"
80000108-31 = "Абсолютная вершина обслуживания."
80000108-32 = "...Вы ведь не против?"
80000108-33 = "[s] «Нисколько. Наоборот, мне очень интересно посмотреть.»"
80000108-34 = "Понятно. Рада это слышать."
80000108-35 = "Тогда начнём."
80000108-36 = "Не беспокойтесь, я выбрала лучшие шоколадки из лучшего магазина Кивотоса."
80000108-37 = ""
80000108-38 = "Первое блюдо — классический молочный шоколад. Насыщенный молочный вкус хорошо сочетается со сладостью шоколада и пробуждает аппетит."
80000108-42 = ""
80000108-43 = "Далее — белый шоколад. В нём нет какао тёртого и какао-порошка, поэтому вы сможете отчётливо почувствовать сочетание жира и сахара."
80000108-46 = ""
80000108-47 = "Это тёмный шоколад с высоким содержанием какао. Он должен очистить вкус после предыдущих шоколадок."
80000108-50 = ""
80000108-51 = ""
80000108-52 = "Я также приготовила напиток. Это какао с ароматом рома. Сейчас принесу ещё сахара — сделайте его настолько сладким, насколько захотите."
80000108-55 = ""
80000108-56 = "А здесь фруктовый шоколад. Он должен стать освежающей альтернативой сладким, горьким и пикантным вкусам предыдущих шоколадок."
80000108-59 = ""
80000108-60 = "[ns3] «Сначала я думал, что получу набор шоколадных образцов...»\n[ns4] «Но оказалось, что существует целый мир шоколада...»"
80000108-63 = "Шоколад вам понравился?"
80000108-64 = "Интересно, было ли этого достаточно, чтобы вас удовлетворить."
80000108-65 = "[s] «Более чем—»"
80000108-66 = "Но моё обслуживание ещё не закончено."
80000108-67 = "[s5] «Есть ещё?!»\n[s6] «Ладно... Что бы ни было следующим, мой живот готов!»"
80000108-70 = "Как и ожидалось от Сенсея."
80000108-71 = "Начинаю!"
80000108-72 = ""
80000108-74 = ""
80000108-76 = "[ns] «Это—?!»"
80000108-77 = "Мой домашний шоколадный торт. Им мы завершим сегодняшний шоколадный курс."
80000108-78 = "Все предыдущие шоколадки были лишь вступлением перед этим лакомством."
80000108-79 = "Я докажу, что мой шоколад способен соперничать даже с самыми знаменитыми десертами Кивотоса."
80000108-80 = "[s] «Токи, тебе не нужно так стараться. Твой шоколад уже—»"
80000108-81 = "Тише. Вы слишком мягки, Сенсей. Мягче ганаша, который я приготовила для этого торта."
80000108-82 = "Говорят, что в День святого Валентина люди выражают свои сокровенные чувства. Разве нет?"
80000108-83 = "[s] «Да. Всё верно.»"
80000108-84 = "В таком случае логично, что особый шоколад для особого человека нужно вручать особым образом, не так ли?"
80000108-85 = "Более того, можно ли вообще назвать шоколад особенным, если ты не вложил в него всего себя?! Если не превзошёл собственные абсолютные пределы, создавая его?!"
80000108-86 = "[s] «Звучит мощно, но ты не ошибаешься!»"
80000108-87 = "Фух. Простите, я немного увлеклась. Наверное, это праздничное настроение. День святого Валентина — достойный противник, его нельзя недооценивать. Продолжим?"
80000108-88 = "Я привела вас именно сюда, в свой офис, потому что именно здесь вложила все свои силы."
80000108-89 = "Мне показалось, что для сегодняшнего обслуживания это идеальная сцена."
80000108-90 = "[s] «К-конечно...»"
80000108-91 = "Где ещё лучше представить мою подборку изысканного шоколада?"
80000108-92 = "И я действительно имею в виду изысканного. В качестве справки я использовала отзывы в интернете из Тринити и Общества гурманов Геенны."
80000108-93 = "Затем выбрала место с лучшей средней оценкой и окончательно определилась после тщательной дегустации."
80000108-94 = ""
80000108-96 = ""
80000108-97 = "Сенсей...? Вы ведь не думаете, что весь этот шоколадный курс был плохим или странным?"
80000108-98 = "[s] «Нет. На самом деле для меня это большая честь...»"
80000108-99 = "Вот как? Я рада."
80000108-100 = "Но всё это были магазинные изделия. Они способны выразить часть моей благодарности, но не всю."
80000108-101 = "Итак, вы готовы к следующей части?"
80000108-102 = "Почему вы так растеряны? Теперь вы должны попробовать мой домашний торт, Сенсей!"
80000108-103 = "Или... это уже слишком?"
80000108-104 = "[s7] «Я-я с радостью!»\n[s8] «О-особенно после рассказа о том, сколько сил ты вложила!»"
80000108-107 = "Вот как? Хорошо."
80000108-108 = "Сейчас принесу вам молока."
80000108-109 = "Сенсей, я клянусь служить вам до самого конца. Или по крайней мере до тех пор, пока вы не доедите мой торт."
80000108-111 = "Хотя не уверена, что слово «служить» здесь было самым подходящим..."
80000108-112 = "...Искренность Токи придала мне душевных и физических сил съесть её торт до последнего кусочка."
