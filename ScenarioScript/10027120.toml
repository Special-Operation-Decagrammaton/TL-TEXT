[translation]
10027120-1 = "Глава 12;Обычный день Красной Зимы"
10027120-2 = ""
10027120-3 = "Якумо?!"
10027120-4 = "Это... президент?!"
10027120-5 = ""
10027120-7 = ""
10027120-9 = ""
10027120-10 = ""
10027120-11 = "Классическая история о дружбе, тяжёлом труде и упорстве. Так трогательно, что хочется где-нибудь записать её и сохранить навечно."
10027120-13 = "(...Что-то здесь не так. Почему она говорит такие приятные вещи?)"
10027120-15 = "Но сначала поговорим о той самой важной рукописи, которую ты мне обещала."
10027120-17 = "Рукописи?"
10027120-18 = "То есть я знаю, что ты просила меня сделать рукопись, но..."
10027120-20 = "(Зачем она сейчас об этом вспомнила?)"
10027120-22 = "Рада, что ты помнишь! Так вот, насчёт неё..."
10027120-23 = "Я решила, что вместо неё хочу получить написанный тобой 22-й том «Луны»."
10027120-24 = ""
10027120-26 = ""
10027120-28 = "Чт— Только не это! Есть столько причин, почему я не могу его отдать, но главная — я обещала его Момидзи!"
10027120-29 = "О-о-о? А как же наш контракт?"
10027120-30 = "Это— То есть— Ты—"
10027120-31 = "[s] «Обязательно именно „Луна“?»"
10027120-32 = "Да. И на то есть очень хорошая причина."
10027120-33 = "Но можешь расслабиться. Я не прошу передать права навсегда. Скорее дать в долг, оказать услугу."
10027120-34 = "Правда, вполне возможно, что это будет средне- или долгосрочный заём."
10027120-35 = "[s] «Зачем тебе фанфик по „Луне“?»"
10027120-36 = "Д-Да! Что ты собираешься с ним делать? Надеюсь, не массово печатать..."
10027120-38 = "Мне всё равно, насколько потрясающая там история и насколько верно она передаёт несуществующую концовку. Так делать нельзя!"
10027120-39 = ""
10027120-41 = ""
10027120-43 = "..."
10027120-44 = "..."
10027120-45 = "Мэру..."
10027120-47 = "Что?! Я неправа?!"
10027120-48 = "О чём ты вообще? Я не чудовище. Никогда бы не стала публиковать фанфик по незавершённой серии и выдавать его за канон."
10027120-49 = "Ну... Хмф! Тогда зачем тебе моя рукопись?"
10027120-50 = "Всё просто. Но прежде чем объясню, давайте вспомним, из-за чего весь этот шум."
10027120-51 = "Сначала Мэру поссорилась с подругой. И прошла через настоящий ад, чтобы с ней помириться."
10027120-52 = "А, но этот ад ведь устроила мне именно ты, да?"
10027120-53 = "Затем, словно этого было мало, она заручилась помощью знаменитого Сенсея из Шале. И ни разу не поколебалась, сражаясь, мирясь и завоёвывая уважение соперников..."
10027120-54 = "Эй. Это твоя начальница. Сделай с ней что-нибудь."
10027120-56 = "Бесполезно просить меня. Она всегда такая."
10027120-58 = "А в самом конце она отдала все силы созданию рукописи! История о дружбе, насилии, проделках и счастливых случайностях..."
10027120-59 = "Разве это не отличная история?!"
10027120-60 = "[s] «Это... похоже на правду!»"
10027120-61 = "Даже не смей с ней соглашаться, Сенсей!"
10027120-63 = "Именно поэтому я, Арамаки Якумо, приняла решение. Вернее, запускаю запасной план, который придумала в тот самый момент, когда Мэру вошла в Издательский отдел."
10027120-64 = "Эпические, душераздирающие приключения Мэру должны быть проданы— то есть показаны каждому студенту Красной Зимы, нет, всего Кивотоса!"
10027120-65 = "Издательский отдел использует весь свой внушительный арсенал, чтобы превратить эту потрясающую сагу в игровой фильм!"
10027120-66 = ""
10027120-68 = ""
10027120-70 = "...А?"
10027120-71 = "...А?"
10027120-72 = "Что...?"
10027120-73 = ""
10027120-76 = "[ns] «А? Издательский отдел и таким занимается?»"
10027120-78 = "Конечно! Сотрудничество между издательской и киноиндустрией сейчас в моде. Электронная книга превращается в фильм, фильм — в электронную книгу, такое происходит постоянно."
10027120-79 = "Это неотъемлемая часть расширения интеллектуальной собственности, и это хороший бизнес!"
10027120-81 = "Хмм... Нужно было понимать, что после вашего вмешательства их уже нельзя недооценивать, Сенсей."
10027120-82 = "Даже ты впечатлена?!"
10027120-84 = "Если просто одолжишь мне рукопись, возможности будут безграничны! Можно даже использовать её как рекламный материал!"
10027120-85 = "Не волнуйся. Можешь доверять мне — я верну её. Но надо обсудить срок. Это может занять время."
10027120-86 = "Эм, сколько именно времени?"
10027120-87 = "Если удастся придерживаться графика, фильм можно закончить примерно за год, может, за два?"
10027120-88 = "Почему ты вообще решила, что я способна столько ждать? Или что просто отдам её? С чего ты—"
10027120-89 = "Кхм. Ты не очень доверчивая, да? Не недооценивай силу Издательского отдела. Мы можем сделать для тебя большие вещи."
10027120-90 = "Ты думаешь, у меня проблемы с доверием?!"
10027120-91 = "Ну, если ты действительно не можешь отдать нам полную рукопись, значит, ничего не поделать."
10027120-92 = "Ты сдаёшься? Вот так просто? На тебя не похоже. Если только... Ты сейчас не задумала что-нибудь безумное?"
10027120-93 = "Безумным я бы это не назвала, но тебе стоит знать: здесь, в Красной Зиме, немало людей ужаснулись бы твоему легкомысленному отношению к контрактам."
10027120-94 = ""
10027120-97 = ""
10027120-98 = "...особенно те, кто управляет Красной Зимой. Секретариат! Сюда!"
10027120-99 = ""
10027120-101 = ""
10027120-104 = ""
10027120-105 = ""
10027120-106 = "Эта ужасная девушка нарушила обещание, данное подруге."
10027120-107 = "А потом избила каждого члена нашего Секретариата и осталась безнаказанной!"
10027120-108 = "[s] «Меня втянули в это так, будто я один из учеников! Это потрясающе!»"
10027120-109 = "С-Сенсей?! Почему вы здесь?!"
10027120-110 = "На вас пожаловались за нарушение школьных правил?!"
10027120-111 = "[s] «Нет!»"
10027120-112 = "Какие же вы все бесстыдные. Даже вам нельзя нарушать правила Красной Зимы и оставаться безнаказанным, Сенсей!"
10027120-113 = "Мы задержим вас в Комнате саморефлексии! Я сама там не чужой человек. Поверьте, там мило и уютно."
10027120-114 = "[s] «Нет!»"
10027120-116 = "Это ты втянула Секретариат в это дело, Якумо."
10027120-117 = "Стоит быть осторожнее. Контракты бывают опасны. Хи. Хи. Хи."
