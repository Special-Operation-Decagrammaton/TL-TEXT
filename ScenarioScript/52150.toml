[translation]
52150-1 = "Эпизод 15;Конец сладкого сна"
52150-6 = ""
52150-7 = "*зевок*"
52150-8 = ""
52150-12 = "Ты выглядишь уставшей, Аямэ. Плохо спала?"
52150-13 = "Можно и так сказать. Мне приснился сон..."
52150-15 = "О нет, кошмар? Ты выглядишь обеспокоенной."
52150-16 = "Нет-нет. Вообще-то хороший."
52150-17 = "Мне снился мирный мир... настолько мирный, что ни одна проблема ни разу не омрачила двери Хяккарёран."
52150-18 = ""
52150-22 = "Но ты всё равно выглядишь расстроенной..."
52150-23 = ""
52150-25 = ""
52150-26 = "Хм... Неприятный сон легко списать на то, что это всего лишь сон. Проснёшься — и вскоре забудешь."
52150-27 = "А вот со счастливыми снами... суровый контраст с реальностью, в которую приходится просыпаться."
52150-28 = "Начинаешь тосковать по тому миру сна. Будто хочется совсем отвергнуть реальность."
52150-29 = "...По крайней мере, я однажды такое слышала в фильме!"
52150-31 = "Тогда я не могла этого понять, но Аямэ всё время была права."
52150-32 = "Счастье сна остаётся с тобой болезненнее, чем его тьма."
52150-33 = "Если это был всего лишь сон... тогда я действительно хотела бы никогда не просыпаться."
52150-34 = ""
52150-47 = ""
52150-49 = "...Ты проснулась."
52150-50 = ""
52150-53 = ""
52150-54 = ""
52150-55 = "...Аями?"
52150-56 = "Сколько времени прошло, Нагуса."
52150-57 = "Как... я здесь оказалась?"
52150-58 = ""
52150-60 = ""
52150-61 = "Где остальные? Сенсей [USERNAME]?"
52150-62 = "Не переживай. Они все в соседней комнате."
52150-63 = "Никто серьёзно не пострадал. Сенсей Шале спит, но тоже в безопасности."
52150-64 = ""
52150-66 = ""
52150-67 = "...Значит, в Эбису мы встретили не тебя?"
52150-68 = "Ты говоришь: «Сколько времени прошло». Это может означать только одно: та Аямэ, которую я встретила раньше..."
52150-69 = "Угу. Иллюзия, созданная Ста Историями о призраках и питающаяся страхом."
52150-70 = "Питающаяся... страхом? Но я тебя не боялась..."
52150-71 = "Эта иллюзия родилась из тебя и только из тебя."
52150-72 = ""
52150-74 = ""
52150-75 = "Ты ведь сама это поняла, разве нет? Та идеальная версия меня, которой ты так отчаянно желала..."
52150-76 = "...ты знала, что это приторно-сладкий сон, хрупкий и готовый разбиться. Ты боялась жестокой реальности, которая маячила по краям."
52150-78 = "Нет... Я правда верила..."
52150-79 = ""
52150-81 = ""
52150-82 = "Ложь!"
52150-83 = "Ты совсем не изменилась! Прикрываешь свои желания неведением и полагаешься на других, чтобы добиться того, на что сама не способна."
52150-84 = "Сколько ещё будешь прятаться за собственной некомпетентностью?"
52150-85 = ""
52150-87 = "...В одном ты права. Не всё, что говорила моя тень, было ложью. Я действительно чувствовала, что достигла предела как президент. Поэтому и отправилась искать Кузуноху."
52150-88 = "Я настолько вымоталась, постоянно принимая на себя чужие просьбы и желания."
52150-91 = "Нагуса. Каждая из вас повелась на улыбку, которую я носила ради вас. А внутри я ненавидела вас всех."
52150-92 = "Я ненавидела всех слабаков, которые приползали ко мне и умоляли исполнить каждую их прихоть."
52150-93 = "Участниц, которые проповедовали высокие идеалы, но будто страдали аллергией на реальные действия."
52150-94 = "И... тебя. Тебя, которая сдавалась при малейшем сопротивлении и смотрела на меня этими жалкими глазами, полными слёз."
52150-95 = ""
52150-97 = ""
52150-98 = "...Я ненавидела всё это."
52150-99 = ""
52150-101 = ""
52150-102 = "Но я всё равно была президентом Хяккарёран. Поэтому пошла искать Кузуноху, чтобы умолять дать мне силу защитить эту «реальность». А вернулась лишь с пустыми руками и беспочвенными слухами."
52150-103 = "И тогда я поняла: неважно, если эта якобы пророчица сохранилась лишь как слух. С силой тома даже слух можно воплотить в жизнь."
52150-104 = "Если я не могла быть везде одновременно, мне нужна была лишь способность наблюдать за всеми одновременно."
52150-105 = "Нет, Аямэ... У такой концовки нет счастливого финала. Кокурико обманула тебя ложной надеждой."
52150-106 = "Нет, Нагуса. Ты не понимаешь."
52150-107 = "Ты не понимаешь, кем я была. Что я чувствовала."
52150-108 = "Нет, что ты говоришь? Нужно лишь честно поговорить друг с другом, сказать правду от сердца, и мы сможем понять друг друга."
52150-109 = ""
52150-111 = ""
52150-112 = "Почему ты добровольно обманываешь себя этими сладкими пустяками?"
52150-113 = "Время для искренности давно прошло. Ты боялась моей правды. Ты отвернулась от меня ради удобной иллюзии, которую сама возвела на пьедестал."
52150-114 = "Аямэ, я..."
52150-115 = "В конце концов, ты уже знаешь правду моего сердца, разве нет?"
52150-116 = "С самого начала я никогда не считала тебя..."
52150-117 = ""
52150-119 = ""
52150-121 = "[log=아야메 황혼 1]...своей подругой. Ни разу.[/log]"
52150-126 = "Следующий эпизод;Гармония"
