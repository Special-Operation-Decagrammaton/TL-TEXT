[translation]
52150-1 = "Episódio 15;O Fim do Doce Sonho"
52150-7 = "Haaah..."
52150-12 = "O que foi? Não conseguiu dormir direito?"
52150-13 = "Hmm... acho que foi porque tive um sonho?"
52150-15 = "...Um sonho ruim?"
52150-16 = "Nada disso. Foi um sonho bom."
52150-17 = "Um mundo pacífico, sem pilhas de pedidos e sem incidentes repentinos..."
52150-22 = "Então por que você parece estar sofrendo tanto...?"
52150-26 = "Um sonho ruim acaba assim que você acorda..."
52150-27 = "Mas, quando você acorda de um sonho feliz, precisa encarar a realidade."
52150-28 = "É doloroso sentir saudade do sonho e querer negar a realidade..."
52150-29 = "...ou pelo menos foi o que disseram em algum filme!"
52150-31 = "Você sempre tem razão, Ayame..."
52150-32 = "Um sonho feliz é mais doloroso do que um pesadelo."
52150-33 = "Se aquilo era um sonho... bem que podia durar para sempre..."
52150-49 = "...Parece que você acordou."
52150-55 = "...Ayame?"
52150-56 = "Há quanto tempo, Nagusa."
52150-57 = "Este lugar..."
52150-61 = "Onde estão as outras...? E o Sensei [USERNAME]?"
52150-62 = "Não se preocupe. Estão na sala ao lado."
52150-63 = "Estão todas bem. Só o Sensei de Schale que está dormindo."
52150-67 = "E a Ayame que estava comigo até agora...?"
52150-68 = "E o que você quis dizer com \"há quanto tempo\"...?"
52150-69 = "\"Aquilo\" era algo criado pelo Hyakumonogatari, que se alimenta do medo."
52150-70 = "Mas eu não sentia medo daquela forma..."
52150-71 = "É mesmo? Mas foi o seu próprio coração que gerou \"aquilo\"."
52150-75 = "...Na verdade, você já tinha percebido há muito tempo, não é?"
52150-76 = "Que isso era um sonho que um dia iria desaparecer. E que a realidade cruel estava bem diante dos seus olhos."
52150-78 = "I-Isso... eu não sabi..."
52150-82 = "Já chega!"
52150-83 = "Sempre, sempre, sempre inventando desculpas! Sempre se escorando em alguém!"
52150-84 = "Até quando você vai continuar com isso?"
52150-87 = "...Ah, mas o que aquela ilusão disse é verdade, viu?#nEu realmente cheguei ao meu limite e fui procurar pela Kuzunoha-sama."
52150-88 = "Eu estava exausta dos \"desejos dos outros\"... naquela época."
52150-91 = "Sabe, eu odiava tanto..."
52150-92 = "Gente que se agarra aos outros só porque não consegue fazer nada sozinha."
52150-93 = "Gente que enche a boca para dizer palavras de conforto, mas logo depois despeja outro fardo em cima de mim."
52150-94 = "E você, que cai no choro por qualquer coisa..."
52150-98 = "Eu realmente odiava."
52150-102 = "Mas, como Presidente do Hyakkaryouran, eu queria proteger \"esta realidade\". Por isso fui atrás da Kuzunoha-sama... mas tudo o que encontrei lá foi um conto de fadas inútil."
52150-103 = "Então eu decidi. Se a Grande Profetisa de Hyakkiyako era apenas um conto de fadas—#nEu usaria o Livro Sobrenatural para torná-la real."
52150-104 = "E então, eu receberia os olhos para zelar por todos..."
52150-105 = "Não faça isso, Ayame... você com certeza está sendo enganada pela Kokuriko."
52150-106 = "Você jamais vai entender."
52150-107 = "O que eu realmente sentia enquanto sorria para todo mundo."
52150-108 = "Não é verdade... não é verdade! Ainda dá tempo de conversarm—"
52150-112 = "Olha só quem fala."
52150-113 = "Você desviou o olhar de mim e ficou se divertindo com \"aquilo\" tão conveniente."
52150-114 = "Ayame, eu..."
52150-115 = "Eu já não disse?"
52150-116 = "Eu nunca—"
52150-121 = "Nunca te considerei uma amiga."
52150-126 = "Próximo;Flor Artificial"
