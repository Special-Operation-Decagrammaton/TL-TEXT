[translation]
1014903-1 = "Diver and Sea Shanties"
1014903-3 = "(One sunny afternoon)"
1014903-4 = "(After diving with Kokoro, while cleaning up...)"
1014903-7 = "Hm, hm-hm...♪"
1014903-8 = "(When I returned from a little ways away, Kokoro was cleaning up while humming)"
1014903-10 = "♪ The sun shines bright, the pebbles sparkle... ♪"
1014903-11 = "...Fufufu-hm♪"
1014903-12 = "[s1] \"What song is that?\"\n[s2] \"That is a lovely melody.\""
1014903-15 = "Ah, Sensei."
1014903-16 = "What song are you talking about?"
1014903-17 = "[s] \"Weren't you just humming something?\""
1014903-18 = "...Ah."
1014903-19 = "Aaaah...!"
1014903-20 = "Please do not worry about it! Please forget you heard that!"
1014903-21 = "Ugh, I just got into the groove while working... and ended up singing...!'"
1014903-22 = "I cannot believe Sensei saw me acting like that..."
1014903-23 = "[s3] \"You do not need to be embarrassed.\"\n[s4] \"It was a wonderful song.\""
1014903-26 = "Still... it is embarrassing to let other people hear it."
1014903-27 = "That was just an impromptu hum, though..."
1014903-28 = "I have not sung in front of anyone since junior high..."
1014903-29 = "[s] \"Is that so? Your voice is lovely, Kokoro.\""
1014903-30 = "I have never really thought so myself... but thank you."
1014903-31 = "However, whenever I sing... bad things happen..."
1014903-32 = "[s] \"Bad things?\""
1014903-33 = "...Yes."
1014903-34 = "Do you know the legend of the Sirens, Sensei?"
1014903-37 = "Sirens are legendary monsters with the lower bodies of seabirds..."
1014903-38 = "And it is said that any sailors who hear their song will jump right into the ocean."
1014903-39 = "Strangely enough... whenever I sing, the people who listen to me jump into the ocean, too."
1014903-40 = "[s] \"Like a Siren's song?\""
1014903-41 = "Yes. #nI asked them why they jumped in... but everyone just looked away and mumbled vaguely."
1014903-44 = "Perhaps one of my ancestors was a real Siren."
1014903-45 = "Sirens are fictional beings, though."
1014903-46 = "Well, that is just a little theory of mine. #nTo prevent everyone from jumping into the water, I have avoided singing in public."
1014903-47 = "[s5] \"I see. Still, that feels a bit wasteful.\"\n[s6] \"I would love to hear what your singing voice sounds like, too.\""
1014903-55 = "[ns7] \"Well then, Kokoro. Right now--\"\n[ns8] \"Sing for me!\""
1014903-58 = "Eh!? Sensei, were you listening to me at all!?"
1014903-59 = "It is dangerous! You might feel like jumping into the ocean...!"
1014903-60 = "[s9] \"It will be fine, it is not very deep around here.\"\n[s10] \"If you are worried, why not tie me up before you sing?\""
1014903-63 = "That would certainly be safe, but..."
1014903-64 = "Are you really sure...?"
1014903-65 = "[s] \"Yeah! I want to hear you sing, Kokoro!\""
1014903-66 = "...Understood. Excuse me for a moment."
1014903-76 = "Try moving your hands and feet for a moment."
1014903-77 = "...Looks like you are secure."
1014903-78 = "Now then..."
1014903-79 = "Toumi Kokoro, starting to sing!"
1014903-81 = "(With a slightly nervous look on her face, Kokoro began to sing)"
1014903-82 = "(Kokoro's singing voice was... well, it was not unpleasant to listen to, but...)"
1014903-84 = "♭ My name is ♯ Kokoro~♪"
1014903-86 = "(The moment she started singing, I understood why everyone had jumped into the water)"
1014903-88 = "Swimming in the ♭ ocean with the diving ♯ club president~"
1014903-90 = "(Kokoro's singing had all over the place rhythm and pitch... listening to it made me feel uneasy)"
1014903-91 = "(She did not seem to realize it herself, though... #nHer tone-deafness was so severe that it was painful to watch)"
1014903-93 = "Aah~ ♯ The ocean is ♭ so much fun~"
1014903-95 = "(However, I could not bring myself to interrupt Kokoro while she was singing so happily... #nSo I endured it with all my might)"
1014903-97 = "Phew..."
1014903-98 = "Um... how was it...?"
1014903-99 = "While you were listening to the song... did you not feel an urge to jump into the ocean?"
1014903-100 = "[s11] \"Nope, it was not super bad!\"\n[s12] \"It was great! Enough to make me pass out!\""
1014903-103 = "Really!? Thank goodness... I finally broke free from the Siren's curse."
1014903-104 = "If Sensei had not given me that push... I never would have known."
1014903-105 = "[s] \"So, can you untie me now?\""
1014903-106 = "Yes! Of course!"
1014903-110 = "Um... Sensei? If you do not mind... may I sing just one more song?"
1014903-111 = "Singing for the first time in a while made me want to sing even more."
1014903-112 = "Ah, let me untie this first."
1014903-113 = "[s] \"Actually, leave me tied up for a bit longer.\""
1014903-114 = "Eh, but... wouldn't it be uncomfortable being tied up?"
1014903-115 = "[s13] \"Actually, I kind of like being tied up!\"\n[s14] \"So you do not need to worry about me!\""
1014903-118 = "I understand..."
1014903-119 = "Then! I will sing one more song!"
1014903-121 = "(After that... I watched as Kokoro happily sang away while I remained tied up)"
