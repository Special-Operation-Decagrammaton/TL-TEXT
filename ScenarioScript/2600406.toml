[translation]
2600406-1 = "Почаще, пожалуйста"
2600406-2 = "Я пришёл в библиотеку и, к своему удивлению, обнаружил Шимико в холле."
2600406-3 = "О, Сенсей! Я вас ждала."
2600406-4 = "Почему я здесь?"
2600406-5 = "П-потому что... я хочу вам помочь, Сенсей."
2600406-6 = "А? Вы видите меня только за чтением книг?"
2600406-7 = "О, ха-ха-ха. Наверное, это не совсем неправда."
2600406-8 = "В этом есть смысл."
2600406-9 = ""
2600406-11 = ""
2600406-12 = "Хи-хи."
2600406-14 = "Я действительно люблю читать, но это не единственное, что мне нравится в библиотеке."
2600406-15 = "Вообще-то читать я предпочитаю дома."
2600406-16 = "А работать волонтёром в библиотеке мне нравится по другой причине."
2600406-17 = "Из-за таких моментов!"
2600406-18 = "[s1] «...В такие моменты?»\n[s2] «Ты обо мне?»"
2600406-19 = "Да! Поэтому я сейчас очень рада. Не думала, что вы действительно придёте."
2600406-20 = "Да! Поэтому я сейчас очень рада. Не думала, что вы действительно придёте."
2600406-21 = "Самая большая радость библиотекаря — найти для человека книгу, которую он нигде больше не смог найти!"
2600406-22 = "Я пока не знаю, какая книга вам нужна, но уверена, её трудно найти!"
2600406-23 = "Если бы всё было просто, вы бы нашли её в интернете."
2600406-24 = "[s3] «Что ж, ты не ошиблась.»\n[s4] «Я нигде не мог её найти.»"
2600406-25 = "Хи-хи! Я так и знала."
2600406-26 = "Хи-хи! Я так и знала."
2600406-27 = "Теперь, когда столько всего доступно в интернете, библиотеки постепенно устаревают."
2600406-28 = "Но, как ни удивительно, многое всё ещё можно найти только в книгах!"
2600406-29 = "Информация, которой интересуются немногие, и труднодоступные истории всё ещё сохраняются на бумаге."
2600406-30 = "Библиотекарю ужасно интересно искать такие вещи!"
2600406-31 = "И вдобавок..."
2600406-32 = ""
2600406-34 = ""
2600406-35 = "[ns5] «И вдобавок...?»\n[ns6] «Шимико, приём?»"
2600406-36 = "...О, ничего! Ладно, какую книгу вы ищете?"
2600406-37 = "...О, ничего! Ладно, какую книгу вы ищете?"
2600406-38 = "Библиотека хорошо организована по жанрам и названиям, но она ещё и огромная!"
2600406-39 = ""
2600406-41 = ""
2600406-42 = ""
2600406-44 = ""
2600406-45 = "...Хм, понятно. Ясно."
2600406-46 = "Если так... Идите сюда!"
2600406-47 = ""
2600406-49 = ""
2600406-50 = "[ns] Следовать за Шимико."
2600406-54 = "Я пошёл за Шимико вглубь библиотеки."
2600406-55 = "Библиотека была настолько огромной, что под один жанр книг выделялась целая комната."
2600406-56 = "Приходилось проверять всё по одной книге, так что поиски затянулись."
2600406-57 = "Через некоторое время..."
2600406-58 = ""
2600406-61 = "Я нашёл книгу, которую искал."
2600406-62 = "[s] Вытащить книгу."
2600406-63 = ""
2600406-67 = "Я потянул, но она не сдвинулась с места."
2600406-68 = "А?"
2600406-69 = "[s] «...?»"
2600406-72 = "― [log=시미코]К-[/log][wa:4870]"
2600406-73 = "― [log=시미코]Какое совпадение.[/log][wa:2195]"
2600406-76 = "― [log=시미코]Я хотела[/log]"
2600406-77 = "― [log=시미코]найти её первой, для Сенсея.[/log][wa:1665]"
2600406-80 = "― [log=시미코]И похоже,[/log][wa:10]"
2600406-81 = "― [log=시미코]я победила! Хи-хи.[/log][wa:4260]"
2600406-84 = "― [log=시미코]Хм, [/log][wa:2245]"
2600406-85 = "― [log=시미코]отдать её вам?[/log][wa:3485]"
2600406-88 = "― [log=시미코]...Шучу. [/log][wa:1280]"
2600406-91 = "― [log=시미코]Я оформлю выдачу и отдам её вам.[/log][wa:195]"
2600406-92 = "― [log=시미코]Рада, что вы её нашли.[/log][wa:2700]"
2600406-95 = "― [log=시미코]Ну как? Вам понравилось [/log][wa:2810]"
2600406-96 = "― [log=시미코]время в библиотеке?[/log][wa:3050]"
2600406-99 = "― [log=시미코]Такого места, как эта библиотека, больше нет.[/log][wa:925]"
2600406-100 = "― [log=시미코]По-моему, это действительно уникальный опыт.[/log][wa:1830]"
2600406-103 = "― [log=시미코]Приходите в любое время,[/log][wa:1790]"
2600406-104 = "― [log=시미코]если вам что-нибудь понадобится.[/log][wa:3390]"
2600406-107 = "― [log=시미코]Я буду ждать![/log][wa:1860]"
2600406-110 = "Мы с Шимико ещё немного посмотрели книги, а затем я вернулся в «Шале» с взятой книгой."
