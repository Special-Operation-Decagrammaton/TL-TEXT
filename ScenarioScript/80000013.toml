[translation]
80000013-1 = "Под шоколадным морем"
80000013-2 = "Гуляя по городу, мы с Хошино нашли небольшой морской музей."
80000013-3 = "Ей стало интересно, поэтому мы ненадолго зашли внутрь, а потом вышли обратно."
80000013-5 = "Перед Морским музеем D.U."
80000013-6 = "Не ожидала найти такое место именно здесь."
80000013-7 = "Внутри было не очень просторно, но всё равно было интересно посмотреть на столько разных видов рыб."
80000013-8 = "И народу почти не было, так что мы смогли всё рассмотреть сколько хотели. Хе-хе."
80000013-9 = "[s] «Рад, что тебе понравилось.»"
80000013-10 = "Эй. Это у них сувенирный магазин?"
80000013-11 = ""
80000013-13 = ""
80000013-14 = "Смотри, Сенсей! Они продают набор шоколада в форме рыб из музея!"
80000013-15 = ""
80000013-17 = ""
80000013-18 = "Тут морская звезда, фугу и..."
80000013-20 = ""
80000013-22 = ""
80000013-23 = "...это что, кит? Ха-ха. Какие милые!"
80000013-24 = "Постой. Я не помню, чтобы внутри был кит..."
80000013-25 = "Интересно, почему его добавили в набор."
80000013-26 = "[s1] «Может, потому что люди считают китов милыми?»\n[s2] «Никогда не знаешь, на что люди пойдут ради денег.»"
80000013-27 = "Логично. Киты и правда довольно милые."
80000013-28 = "Наверное, без него набор казался бы неполным."
80000013-29 = "Думаешь...?"
80000013-30 = "Ну и ладно. Я уже слишком стара для этой экономики нового мира."
80000013-31 = "В любом случае куплю набор на память о сегодняшнем дне."
80000013-32 = ""
80000013-34 = ""
80000013-36 = "Вот, Сенсей. Хочу, чтобы этот был у тебя."
80000013-37 = "Считай сувениром."
80000013-38 = "[s] «Ты отдаёшь мне шоколад в форме кита? Точно?»"
80000013-39 = "Конечно точно."
80000013-40 = "Шоколад внутри у всех одинаковый, так что форма всё равно перестаёт иметь значение, когда он попадает в живот."
80000013-41 = "Ты прав, кит, пожалуй, мне нравится больше остальных..."
80000013-42 = "...но именно поэтому я хочу отдать его тебе."
