[translation]
1007806-1 = "Спасение в глубине гор"
1007806-2 = "Получив срочный звонок от Касуми, я поспешил к указанному ею месту."
1007806-3 = ""
1007806-6 = "Здесь так тихо, что я услышала ваше приближение за километр! Уахаха!"
1007806-7 = "Я ведь говорила, что угрозы жизни нет... Но стоило ожидать, что всё будет именно так."
1007806-8 = "Сенсей! Эй!"
1007806-9 = "Сюда! Я здесь!"
1007806-10 = ""
1007806-11 = "Вообще-то это немного... неловко. Но позвонить я могла только вам."
1007806-12 = "Спасибо, Сенсей. Я знаю, как вы заняты, и правда очень ценю, что пришли."
1007806-13 = "...Хм? Я ранена?"
1007806-14 = "О, эм, вовсе нет! Со мной всё отлично! Хаха! Правда, я в порядке!"
1007806-15 = "Я в порядке! Не смотрите так обеспокоенно. Мне и без того уже достаточно неловко."
1007806-16 = "Это всё так глупо. Я шла по горной тропе, когда порвался тапок. А потом, конечно же, поскользнулась... и упала..."
1007806-17 = "Уверена, это всего лишь лёгкое растяжение! Крови нет. Волноваться не о чем!"
1007806-18 = "Серьёзно! Смотрите! Могу показать!"
1007806-19 = "...Вот! Посмотрите на мою лодыжку."
1007806-20 = "Всё нормально. А эта ссадина даже недостаточно глубокая, чтобы пошла кровь."
1007806-21 = "...Что? Почему я здесь одна?"
1007806-22 = "Конечно же, исследую местность. Это потенциальное место горячего источника, и я хотела увидеть его своими глазами."
1007806-23 = "Это место довольно уединённое, но обычно мои точки обследования находятся прямо в городах."
1007806-24 = "Когда мы выходим всей компанией, остальные члены клуба привлекают слишком много ненужного внимания."
1007806-25 = "Так что я привыкла проводить обследования одна. Так гораздо быстрее и проще."
1007806-26 = "К тому же я не какой-нибудь затворник-книжный червь, знаете ли. Мне нравится выбираться наружу."
1007806-27 = "...А?"
1007806-28 = "...Хотите знать, что я думаю об этом месте?"
1007806-29 = "Ну... Хм... Если быть совершенно честной..."
1007806-30 = "...Не годится!"
1007806-31 = "Полный провал! Мертворождённый вариант! Даже рассматривать не стоит!"
1007806-32 = "Оно... невероятно обычное. Мало того что место ужасно подходит для горячего источника, так ещё и взрывать здесь будет скучно."
1007806-33 = "Ни одной географической особенности, которая позволила бы устроить уникальный взрыв. Ничего. Ужасно во всех смыслах."
1007806-34 = "Выбрать это место было самой новичковой ошибкой из возможных."
1007806-35 = "И вдобавок ко всему-у-у... я испортила тапок. *вздох*"
1007806-36 = "Простите, что вот так вываливаю всё на вас после того, как заставила тащиться сюда."
1007806-37 = "Кстати... Вы принесли то, что я просила?"
1007806-38 = "[s1] «Новые тапки? Конечно.»\n[s2] Показать принесённые тапки."
1007806-41 = "Уахаха! Я знала, что на вас можно рассчитывать, Сенсей!"
1007806-42 = "Я здесь уже закончила. Так что почему бы мне не переобуться, и мы вместе спустимся?"
1007806-43 = "А?"
1007806-44 = "...Зачем вы тащили их сюда, если не собираетесь мне отдавать?"
1007806-45 = "...Что?"
1007806-46 = "Вы хотите нести меня вниз? Вы же не серьёзно..."
1007806-47 = "Хм..."
1007806-48 = "Ну... Эм... М-м..."
1007806-49 = "Наверное... Но... Хм..."
1007806-50 = ""
1007806-52 = ""
1007806-53 = "Эм, ну... Хм..."
1007806-54 = "Э-Это единственный вариант?"
1007806-55 = "Просто... Это ужасно неловко..."
1007806-56 = "Да, я понимаю, что растянула лодыжку... и она распухла больше грибного облака... но это же не значит, что я совсем беспомощна!"
1007806-57 = "Я всё ещё могу идти, если о-очень медленно. Мне нужна лишь небольшая опора."
1007806-58 = "Уф! Из всех вариантов — именно ехать на спине! И ещё у Сенсея!"
1007806-59 = "Э-э...!"
1007806-60 = "Мне правда обязательно?"
1007806-61 = "[s3] «Отказ не принимается.»\n[s4] «Конечно. Ты ранена.»"
1007806-64 = "Хм-м... Понятно..."
1007806-65 = "П-Похоже, выбора у меня нет, да?"
1007806-66 = "Хаха. Хахаха... Хахаха...!"
1007806-67 = ""
1007806-69 = ""
1007806-70 = "А вы умеете вести переговоры. Никогда ещё я не чувствовала себя настолько побеждённой."
1007806-71 = "Знаете, если другие увидят нас такими близкими, могут пойти разговоры. Вы готовы с этим справиться, Сенсей?"
1007806-72 = "...Ну и что, что я тяну время? ...Ладно, хорошо! Но как только спустимся с горы, сразу отдайте мне тапок, ясно?"
1007806-73 = "Теперь моя судьба в ваших руках, Сенсей."
1007806-74 = ""
1007806-76 = ""
1007806-77 = ""
1007806-78 = ""
1007806-79 = ""
1007806-80 = "[ns5] «...Касуми?»\n[ns6] «Что случилось?»"
1007806-83 = "Н-Ничего. Просто задумалась."
1007806-84 = "...Хаха."
1007806-85 = "Просто... сегодняшняя вылазка на обследование..."
1007806-87 = "Она не была полной потерей времени."
