[translation]
10033050-1 = "Эпизод 5;Любование цветами после еды"
10033050-2 = "После всех этих приключений и веселья вы наверняка догадались, что будет дальше!"
10033050-3 = "Именно! Каким бы потрясающим ни было представление, на пустой желудок ничего не оценишь!"
10033050-4 = "В этом популярном ресторане вы сможете до отвала наесться традиционными блюдами Хяккияко."
10033050-6 = "Пожалуйста, наслаждайтесь очаровательной атмосферой изысканной кухни Хяккияко за обедом!"
10033050-7 = ""
10033050-9 = ""
10033050-11 = "Хи-хи-хи."
10033050-12 = "Стоило только прозвучать словам «изысканная кухня», и я просто не могла пройти мимо."
10033050-13 = "[ns] «Харуна?!»"
10033050-14 = "Харуна?!"
10033050-15 = "Я должна похвалить выбор нашего экскурсовода. Меню здесь образцовое."
10033050-16 = "Однако в чём истинный смысл изысканной кухни? Есть в заранее определённом месте, набивая желудок заранее выбранными блюдами... Неужели этим и ограничивается гастрономия в этой поездке?"
10033050-17 = "Не может быть! Изысканная кухня — вершина существования! Она должна взрываться прекрасным фейерверком разнообразия и бросать вызов самому нашему пониманию жизни!"
10033050-18 = "[s] «Я вообще ничего из этого не понял!»"
10033050-19 = "Она хочет сказать, что мы должны попробовать ВСЮ вкуснятину, которую может предложить Хяккияко! ★"
10033050-20 = "И она абсолютно права! Идём!"
10033050-21 = ""
10033050-23 = ""
10033050-24 = "Я всё равно не смогу их остановить."
10033050-25 = ""
10033050-27 = ""
10033050-29 = "Они никогда не меняются..."
10033050-30 = "Но выглядит довольно весело, не думаешь?"
10033050-31 = "Думаешь? Может, нам тоже сходить."
10033050-32 = "Почему бы и нет?"
10033050-33 = ""
10033050-35 = ""
10033050-37 = "Пожалуйста, вернитесь! У нас сегодня очень плотное расписание!"
10033050-38 = "Ох... Что же делать, Сенсей?"
10033050-39 = "[s] «Давайте пока просто пойдём за ними!»"
10033050-42 = "М-м, да. Хотя соевый соус на этом курином шашлычке довольно насыщенный, лёгкая нотка имбиря не даёт вкусу стать слишком тяжёлым."
10033050-43 = "Смотрите! Это мандзю с мондзяяки внутри! В Геенне такого точно не найдёшь... Я попробую добавить васаби и острый соус!"
10033050-44 = "Мне нравится, что этот жареный кальмар действительно насыщает. Мало того что в одной порции целый кальмар, так он ещё и гигантский... *чмок* Поцелуй шефа!"
10033050-45 = "...Вызов? Мне нужно съесть десять кальмаров за пять минут? Вот это уже разговор! ★"
10033050-46 = "Я должна есть этот рисовый шарик вместе с тэмпурой? Как тэндон? Странно."
10033050-47 = "Может, просто попробовать?"
10033050-48 = ""
10033050-50 = ""
10033050-51 = "...Ой?!"
10033050-52 = "Отлично. Мы попробовали еду со всех ларьков в этом районе."
10033050-53 = "Нельзя терять время, гурманы! К следующему!"
10033050-54 = "Есть, госпожа!"
10033050-55 = ""
10033050-57 = ""
10033050-61 = "Нашла их... Сюда, Сенсей."
10033050-62 = "[s] «Спасибо, Цубаки! Все, сюда!»"
10033050-63 = "*тяжело дышит* *тяжело дышит* Они вообще люди?!"
10033050-64 = "Я искренне поражена тем, с какой скоростью они перемещаются между ларьками! Они едят быстрее, чем мы бегаем!"
10033050-66 = "П-подождите меня! Вааа!"
10033050-67 = "Нужно спешить, Сенсей! Если потеряем их из виду — всё пропало!"
10033050-70 = ""
10033050-71 = "Следующая зона с ларьками..."
10033050-72 = "Как бы это сказать? Они довольно... своеобразные."
10033050-73 = "Этот супер-острый куриный шашлычок ещё ладно, но вот яблоко в карамели, сделанное исключительно с горьким и кислым вкусом..."
10033050-74 = "Разве не супер-вкусно? Наверное, это фирменное блюдо Хяккияко!"
10033050-75 = "(Что? Ей... нравится? Придётся поднять ставки, а?)"
10033050-76 = "Подходи, не стесняйся! Тут рисовые шарики с супер-соусом из умэбоси! Особый соус сделан из слив, вкус которых усилен аж в десять раз!"
10033050-77 = ""
10033050-79 = ""
10033050-80 = ""
10033050-81 = "Контраст сладкого и кислого заставляет мою голову летать! Ещё!"
10033050-82 = ""
10033050-84 = ""
10033050-85 = "(Она чудовище! Но я не сдамся!)"
10033050-86 = "Попробуйте местное блюдо! Тост с джемом из кусаи!"
10033050-87 = ""
10033050-89 = ""
10033050-90 = "Ого, пахнет совершенно новой смесью рыбы и кислятины!"
10033050-91 = "Прямо согревает живот! Вкусно!"
10033050-92 = "Соба с хаукарлем!"
10033050-93 = "Вкуснятина!"
10033050-94 = "Рамэн с ферментированной сельдью!"
10033050-95 = "Какой насыщенный вкус! Вау, вау, вау!"
10033050-97 = "...Такояки из морского огурца с ванильным парфе!"
10033050-98 = "Стоять! Я только что выяснила, что вы работаете без лицензии на продажу еды!"
10033050-100 = "Цк!"
10033050-101 = ""
10033050-104 = "Пожалуйста, не беспокойтесь."
10033050-105 = "П-Почему?!"
10033050-106 = "Лицензии... разрешения... Какое это имеет значение? Возможность попробовать новую кухню в чужих краях — именно то, ради чего и нужна гастрономическая экскурсия!"
10033050-107 = "И если кто-то встанет между нами и изысканной кухней, Общество гурманов не будет бездействовать!"
10033050-108 = "Не забирайте! Это было реально вкусно!"
10033050-109 = "Только ты так думаешь!"
10033050-110 = "Это настоящий, неподдельный опыт экскурсии! Одобряю! ★"
10033050-112 = "Вам стоит слушать экскурсовода. Есть еду у продавцов без лицензии крайне не рекомендуется."
10033050-113 = "Понятно, кому ты предана, Фуука. Я думала, уж ты-то поймёшь миссию Общества гурманов."
10033050-114 = "Это не вопрос идеологии! Это безопасность еды!"
