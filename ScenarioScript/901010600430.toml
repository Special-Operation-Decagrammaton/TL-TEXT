[translation]
901010600430-6 = ""
901010600430-7 = "Alinhando o que descobrimos sobre o pescador desaparecido..."
901010600430-8 = "Como já sabíamos, o novato Miyaguchi tinha uma reputação bem controversa no cais."
901010600430-9 = "Embora trabalhasse duro, vivia resmungando e batendo boca com os veteranos..."
901010600430-10 = "E segundo os colegas de barco, ele estava afundado em jogos de azar clandestinos."
901010600430-11 = "Jogos de azar? Ele apostava dinheiro?"
901010600430-12 = "Sim. Era muito gastão e vivia sem um tostão no bolso. #nTentava dar uma cartada certeira pra mudar de vida da noite pro dia."
901010600430-13 = "Mas nunca dava sorte nas apostas..."
901010600430-14 = "E no desespero acabou recorrendo a financeiras clandestinas e agiotas..."
901010600430-15 = "Jogos de azar são matematicamente desenhados para que a banca sempre vença."
901010600430-16 = "Quem se ilude com a sorte de principiante invariavelmente termina perdendo até a dignidade."
901010600430-17 = "Dinheiro bom é dinheiro conquistado com o próprio suor honesto. Nada que vem fácil se sustenta."
901010600430-18 = "Mas sonhar não custa nada, né, gente?"
901010600430-19 = "Ai, quem me dera acertar na loteria acumulada só uma vezinha na vida~"
901010600430-21 = "Voltando ao assunto. Se Miyaguchi não foi vítima de acidente fatal, os motivos se afunilam drasticamente."
901010600430-22 = "O motivo que levou Miyaguchi a fugir às pressas do porto foi..."
901010600430-23 = ""
901010600430-25 = ""
901010600430-26 = ""
901010600430-29 = ""
901010600430-30 = "O motivo que levou Miyaguchi a fugir às pressas do porto foi...\n[as1] A cobrança implacável dos agiotas.\n[as2] Porque foi jurado de morte por assaltantes.\n[as3] Porque sofria bullying pesado dos colegas."
901010600430-32 = "Exatamente. E soubemos que a cobrança vinha com juros exorbitantes. #nQualquer cidadão comum perderia o sono só de pensar nas parcelas."
901010600430-33 = "Até os colegas de convés já sabiam do endividamento dele..."
901010600430-34 = "Com certeza ele aproveitou a calada da noite quando o cais tava deserto pra fugir sem deixar rastro."
901010600430-35 = ""
901010600430-38 = ""
901010600430-39 = "Hummm... Ele era gastão e chamava atenção, mas..."
901010600430-40 = "Quem vive sem dinheiro e perde tudo em aposta dificilmente vira alvo de assalto a mão armada."
901010600430-41 = "Tenta de novo, Sensei."
901010600430-42 = ""
901010600430-44 = ""
901010600430-45 = ""
901010600430-46 = ""
901010600430-50 = "É verdade que alguns marinheiros achavam ele resmungão e chato, mas..."
901010600430-51 = "Nenhum depoimento mencionou qualquer tipo de perseguição ou agressão entre a tripulação."
901010600430-52 = "Deve haver outro motivo mais determinante."
901010600430-53 = ""
901010600430-55 = ""
901010600430-56 = ""
901010600430-57 = ""
901010600430-60 = "Fugir de madrugada por causa de agiota é algo bem comum em Kivotos, infelizmente."
901010600430-61 = "Mas se a pessoa fugir para outro distrito autônomo, a dívida é perdoada por lei?"
901010600430-62 = "Quem dera. A menos que decrete falência formal, a dívida individual persegue o cidadão até o fim da vida."
901010600430-64 = "Ouvi dizer que teve até uma certa academia que não conseguiu pagar as dívidas astronômicas e o distrito inteiro quase foi leiloado para uma corporação privada."
901010600430-65 = ""
901010600430-68 = ""
901010600430-69 = "Uma dívida do tamanho de uma academia inteira... Nem consigo imaginar como alguém conseguiria pagar isso..."
