[translation]
901010600430-6 = ""
901010600430-7 = "Мне удалось кое-что узнать о пропавшем рыбаке..."
901010600430-8 = "Как мы и знали, репутация Миягучи была далеко не безупречной."
901010600430-9 = "Он усердно работал, но его часто ругали за постоянные жалобы."
901010600430-10 = "А по словам коллег, он часто пропускал работу из-за зависимости от азартных игр."
901010600430-11 = "Азартные игры? В смысле ставки на деньги?"
901010600430-12 = "Ага, и большие. Он любил тратить деньги, поэтому часто сидел без гроша. Вот и вошло в привычку пытать удачу за игровым столом."
901010600430-13 = "Но таланта к этому у него, видимо, не было. Джекпот он так и не сорвал."
901010600430-14 = "Поэтому и взял какие-то сомнительные частные займы."
901010600430-15 = "В азартных играх нет никакого таланта. Они устроены так, чтобы забирать твои деньги и отдавать заведению."
901010600430-16 = "Раз-другой можешь выйти в плюс, но в итоге потеряешь всё, если не умеешь вовремя остановиться."
901010600430-17 = "Лучше зарабатывать честно. И никогда не ставить больше, чем готов потерять. Как говорится: Легко пришло — легко ушло."
901010600430-18 = "Но помечтать всё равно можно."
901010600430-19 = "Вот выиграла бы я в лотерею — жила бы в роскоши..."
901010600430-21 = "Ладно. Значит, если Миягучи не попал в аварию и не исчез внезапно, причин для такого побега остаётся немного."
901010600430-22 = "Причина, по которой ему пришлось сбежать из порта, была..."
901010600430-23 = ""
901010600430-25 = ""
901010600430-26 = ""
901010600430-29 = ""
901010600430-30 = "#Q;유키노;Причина, по которой ему пришлось сбежать из порта, была...\n[as2] «Кто-то охотился за его деньгами.»\n[as3] «Его травили.»\n[as1] «Он не мог выплатить игровой долг.»"
901010600430-32 = "Верно. Он никак не мог справиться не только с игровыми долгами, но ещё и с процентами по частным займам."
901010600430-33 = "Даже его коллеги-рыбаки знали о чудовищном размере долга..."
901010600430-34 = "Наверное, он воспользовался моментом, когда рядом никого не было, и сбежал от кредиторов."
901010600430-35 = ""
901010600430-38 = ""
901010600430-39 = "Хмм. Он много тратил, так что кто-то мог решить, будто он богат..."
901010600430-40 = "Но не думаю, что он бы бросил всю жизнь из-за угроз грабителя. Денег у него и так почти не было."
901010600430-41 = "Подумайте ещё раз, Сенсей."
901010600430-42 = ""
901010600430-44 = ""
901010600430-45 = ""
901010600430-46 = ""
901010600430-50 = "Некоторые его не любили из-за вечных жалоб..."
901010600430-51 = "Но прямых доказательств травли нет."
901010600430-52 = "Если бы это было правдой, разве не нашлась бы более разумная причина?"
901010600430-53 = ""
901010600430-55 = ""
901010600430-56 = ""
901010600430-57 = ""
901010600430-60 = "Многие бегут от долгов."
901010600430-61 = "А это помогает? Если сбежать в другой район, долг исчезнет?"
901010600430-62 = "Нет. Если не объявить банкротство, долг будет преследовать тебя всегда."
901010600430-64 = "Я слышала, однажды ЦЕЛЫЙ район передали корпорации, потому что академия не смогла выплатить долги."
901010600430-65 = ""
901010600430-68 = ""
901010600430-69 = "Долг размером с академию... Даже представить не могу, как такое выплачивать..."
