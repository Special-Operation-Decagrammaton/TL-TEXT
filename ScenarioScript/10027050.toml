[translation]
10027050-1 = "Эпизод 5;У каждого есть секреты"
10027050-2 = "Съезд фанфиков"
10027050-3 = ""
10027050-4 = ""
10027050-5 = "Так... Ты всё-таки нашла дорогу сюда, Мэрури."
10027050-6 = "А? А ты что здесь делаешь?"
10027050-7 = "[s] «А. Привет, Таканэ.»"
10027050-8 = "Привет, Сенсей. Надеюсь, у вас всё хорошо. Я лишь наполовину ожидала встретить здесь вас двоих..."
10027050-9 = "Я немного удивлена видеть вас здесь, но и рада тоже."
10027050-10 = "...Рада? Ты правда хотела, чтобы я это услышала?"
10027050-11 = "Что думаешь?"
10027050-12 = "Ты хочешь сказать, что отправила нас в Издательский отдел в надежде, что мы в итоге попадём сюда?"
10027050-13 = "Мм... Ваши отчаянные поиски финального тома «Луны» ради Момидзи изначально были безнадёжны."
10027050-14 = "22-го тома «Луны» никогда не существовало."
10027050-15 = "Но я видела объявления о продаже в интернете! Их немного, но они есть..."
10027050-16 = "Всё, что ты найдёшь в интернете, будет просто ещё одной такой историей отсюда."
10027050-17 = "«Луна» — шедевр. Она определила целую эпоху и стала невероятным хитом. Но ей сильно не повезло."
10027050-19 = "Самое печальное в «Луне» — финальный том так и не вышел."
10027050-20 = "[s] «Почему?»"
10027050-21 = "Как я уже сказала, «Луна» произвела фурор, но со временем рынок потерял к ней интерес."
10027050-22 = "...На самом деле, в своё время её даже не оценили по достоинству."
10027050-23 = "На самом деле с самой историей никогда не было ничего плохого. Просто она поднимала темы, к которым аудитория тогда была не готова, поэтому отзывы получились... неоднозначными."
10027050-24 = "Но это история стара как мир, правда? Настоящие шедевры часто признают лишь спустя много лет. Не думаю, что «Луна» — единственное произведение, пострадавшее от такой судьбы."
10027050-25 = "Как критик, я знаю это лучше кого-либо. Поэтому и стараюсь читать и оценивать как можно больше произведений."
10027050-26 = "Значит... Ты с самого начала знала, что я никогда не найду финальный том."
10027050-27 = "Тогда зачем было сообщать мне об этом таким окольным путём?"
10027050-28 = ""
10027050-30 = ""
10027050-31 = "...Я хотела проверить тебя, Мэрури."
10027050-32 = "Ты слишком гордая и совсем не стараешься выстраивать отношения. А раз ты искала финальный том «Луны»..."
10027050-33 = "Я подумала, что всё это и путь сюда заставят тебя выйти из зоны комфорта."
10027050-34 = "Другими словами, ты знала, насколько я отчаялась, и решила, что я соглашусь на что угодно. Я правильно поняла?"
10027050-35 = "Да. И я оказалась права. Ты пришла сюда, и..."
10027050-36 = "Мне жаль, что вас втянули во всё это, Сенсей."
10027050-37 = "[s1] «Я не против.»\n[s2] «Таканэ... Ты ведь хотела помочь им помириться, правда?»"
10027050-38 = "Вы проявляете столько доброты и великодушия... Совсем не похожи на эту гордую и злобную художницу."
10027050-39 = "Ах! У тебя вообще стыда нет!"
10027050-40 = "Я-Я просто хотела, чтобы ты сама нашла свой путь, Мэрури. Вот и всё!"
10027050-41 = "Это совсем на тебя не похоже. Не верьте ей, Сенсей! Уверена, здесь какой-то подвох!"
10027050-42 = "Это уже совершенно незаслуженно!"
10027050-43 = "Кто бы говорил!"
10027050-44 = "[s] «Так, хватит.»"
10027050-45 = "...Да, Сенсей."
10027050-46 = "Тц!"
10027050-47 = "...Ммф! Я знаю, что ты просто обо мне заботишься."
10027050-48 = "...Хмф."
10027050-49 = "[s] «И вообще, что ты здесь делаешь, Таканэ?»"
10027050-50 = "Ну..."
10027050-51 = ""
10027050-53 = ""
10027050-56 = "А, вот вы где, президент! Вас все ищут! Пойдёмте!"
10027050-57 = "...!"
10027050-58 = "Президент?"
10027050-59 = "[s] «Президент?»"
10027050-60 = "Подожди-ка... Ты знала, что это за место и где оно находится, а кто-то только что назвал тебя президентом..."
10027050-61 = "Похоже, секрет раскрыт. Да, я президент клуба «Луны»."
10027050-62 = "[s] «Таканэ... Ты организовала этот съезд фанфиков?»"
10027050-63 = "Стой, стой, стой... Слишком много информации сразу."
10027050-64 = "Ты организовала это мероприятие потому, что сама хочешь финальный том, да?"
10027050-65 = "И что, если так?"
10027050-66 = "Ты только что произнесла целую речь о том, как критики помогают освещать самые разные произведения, которые иначе остались бы незамеченными."
10027050-67 = "Но сама ты просто собираешь и читаешь работы по своей любимой истории. Вот уж лицемерие!"
10027050-68 = ""
10027050-70 = ""
10027050-71 = ""
10027050-72 = ""
10027050-73 = "Эй! Ч-Что ты делаешь?!"
10027050-74 = "Если кто-то узнает об этом, моя репутация беспристрастного критика будет уничтожена."
10027050-75 = "И хуже всего то, что ты, Мэрури, дразнишь меня просто за то, что мне что-то нравится."
10027050-77 = "Я решила, что будет лучше, если тебя... заставить замолчать."
10027050-78 = "Что?! Ты сама отправила меня сюда!"
10027050-80 = "Обстоятельства меняются."
10027050-81 = "Серьёзно?! Ты вообще слышишь, насколько безумно сейчас звучишь?"
10027050-82 = "*вздыхает* Полагаю, ты права."
10027050-83 = "Но дело не только во мне. Всегда найдутся люди, которые захотят увидеть, чем всё заканчивается."
10027050-84 = "Кто-то беспокоится об оригинальном авторе, который однажды просто исчез. Кто-то говорит, что было безответственно не завершить историю."
10027050-85 = "Но каждый человек, который любит «Луну», хочет продолжения. Они не хотят, чтобы она умерла вместе с оригинальным автором. Поэтому начали создавать собственные истории."
10027050-86 = "И вот... мы здесь."
10027050-87 = "Ты хочешь сказать, что каждый создаёт совершенно новую концовку в своём стиле?"
10027050-88 = "Да, это их собственная интерпретация. Сколько фанатов — столько и трактовок произведения."
10027050-89 = "Никто никогда не узнает, какая из них правильная, поэтому каждую интерпретацию ценят и уважают одинаково."
10027050-90 = "Конечно, каждый хочет, чтобы именно его версия выделилась и получила признание. Такова природа любого автора."
10027050-91 = "Но в конце концов всё это всё равно фанфики, разве нет?"
10027050-92 = "Я к тому, что ты никогда не смогла бы найти финальный том «Луны» и использовать его, чтобы помириться с Момидзи."
10027050-93 = "Но кое-что сделать всё-таки можно. Подари ей один из фанфиков по «Луне» отсюда — тот, у которого лучшие отзывы."
10027050-94 = "Если что и сможет показать Момидзи, насколько она тебе дорога, то именно это."
10027050-95 = "Так вот зачем ты привела меня сюда..."
10027050-96 = "..."
10027050-97 = "...Ты права. Абсолютно права."
10027050-98 = "Если я не могу найти финальный том, то хотя бы достану для неё лучшее из возможного."
10027050-99 = "Ах, даже ты иногда способна прислушаться к разуму. Чудесно!"
10027050-100 = ""
10027050-102 = ""
10027050-103 = "Дело в том..."
10027050-105 = "Иногда, когда что-то кажется настолько правильным, что ты просто обязана это сделать... тебе вдруг хочется намеренно упереться."
10027050-106 = "Что?! Ты о чём?"
10027050-108 = "Я тоже кое-что создам!"
10027050-109 = "Что?"
10027050-111 = "Я напишу финальный том «Луны»!"
10027050-112 = ""
10027050-114 = ""
10027050-117 = "[ns] «А?»"
10027050-118 = "А?"
