[translation]
1006305-1 = "Ящик Пандоры 2"
1006305-2 = ""
1006305-7 = ""
1006305-8 = "*хихикает* Идеально!"
1006305-9 = ""
1006305-11 = "Теперь меня никто не остановит! Вперёд, к тайным знаниям!"
1006305-12 = ""
1006305-14 = ""
1006305-15 = ""
1006305-16 = "Хммм. Посмотрим... Ого, значит, здесь у вас вот такая система?"
1006305-17 = "Ого, Сенсей. И снова новая!"
1006305-18 = "Вы слишком стараетесь, каждый раз меняя защиту после моего проникновения. Даже немного грустно..."
1006305-19 = "Ведь всё это бесполезно! Ниха-ха-ха!"
1006305-20 = "Так, теперь просто сломаем вот это, и..."
1006305-21 = ""
1006305-37 = "Ладно, посмотрим, что... внутри..."
1006305-38 = "А...?"
1006305-39 = ""
1006305-41 = ""
1006305-42 = "...А? Хм?"
1006305-43 = "[s1] «...Коюки.»\n[s2] «Поймал тебя с поличным.»"
1006305-46 = "А?!"
1006305-47 = "...А-а! Сенсей?! Что вы здесь делаете?"
1006305-48 = "[s3] «Это я должен спрашивать.»\n[s4] «Сдавайся. Сколько раз я тебя уже ловил?»"
1006305-51 = "Ух! Что?! Снова аналоговые ловушки!"
1006305-52 = "Вы всё это время просто ждали, чтобы поймать меня? Вам не стыдно?!"
1006305-53 = "[s5] «Это тоже моя реплика.»\n[s6] «Вообще-то я здесь живу.»"
1006305-56 = "Аргх! Как бесит! Но я не сдамся! В следующий раз точно—"
1006305-57 = "...А?"
1006305-58 = "Сенсей, зачем вы так? Если я не остановлюсь, вы настучите на меня Семинару?"
1006305-59 = "...! Ух!"
1006305-60 = "Н-насколько мелочным надо быть, чтобы вмешивать их в матч один на один! Это вообще не про них, а про нас! Про нашу битву умов!"
1006305-61 = "Что значит «это не соревнование»? Д-да неважно!"
1006305-62 = "[s7] «В этих бумагах хранятся не только мои секреты, Коюки.»\n[s8] «Там тайны, которые затрагивают всех.»"
1006305-65 = "Хм? Сенсей?"
1006305-66 = "Сказать такое с таким лицом..."
1006305-67 = "Хм..."
1006305-68 = ""
1006305-70 = ""
1006305-71 = "*вздыхает*"
1006305-72 = "Ладно. Если вы так ставите вопрос, ничего не поделать."
1006305-73 = "Тогда дальше ковыряться в этом уже неинтересно."
1006305-74 = "Я не буду открывать эти файлы..."
1006305-75 = "[s9] «Спасибо, Коюки.»\n[s10] «Неожиданно разумно с твоей стороны...?»"
1006305-78 = "Ну... если вы серьёзно не хотите, чтобы я смотрела, то и мне уже не хочется. Мне просто было любопытно!"
1006305-79 = "Но..."
1006305-80 = "[s] «...Но?»"
1006305-81 = "Вы сказали, что не хотите, чтобы я смотрела, потому что это касается всех, да?"
1006305-82 = "Иными словами...! Снова пришло время мыслить нестандартно!"
1006305-83 = "Значит, если я узнаю ваши личные секреты, вы сделаете вид, что ничего не заметили!"
1006305-84 = "[ns11] «Как ты вообще пришла к такому выводу...?»\n[ns12] «Ты направляешься в общежитие? Стой!»"
1006305-87 = "Ниха-ха-ха-ха-ха! Пункт назначения — комната Сенсея! Вперёд!"
1006305-88 = ""
1006305-90 = ""
1006305-91 = "[ns13] «С-стой! Коюки!»\n[ns14] Поспешить за ней."
1006305-95 = "Пыхтя и задыхаясь, я побежал за Коюки до самого общежития."
1006305-96 = "Она неслась очень быстро. Догнать её удалось только после того, как она остановилась."
1006305-97 = ""
1006305-101 = "[ns15] «К-Коюки...!»\n[ns16] «Стой! На что ты смотришь?!»"
1006305-104 = ""
1006305-105 = "..."
1006305-106 = "[s17] «...? Коюки?»\n[s18] «...Эм... Что это у тебя в руках?»"
1006305-109 = "Эм..."
1006305-110 = "Это... эм... Сенсей..."
1006305-111 = "Я увидела ящик с паролем, так что... открыла его, и..."
1006305-112 = "У вас тут довольно много этих... эм... странных книжек, да?"
1006305-113 = "Ха... Эм... Ну..."
1006305-114 = "Наверное... у Сенсея тоже должна быть... личная жизнь, да? А... Н-ни-ха..."
1006305-115 = "[s] «...»"
1006305-116 = ""
1006305-119 = "[ns] «...!»"
1006305-120 = "П-простите... Если бы я знала, что там, я бы не стала... Эм... Ниха... ха..."
1006305-121 = "[s19] «П-подожди! Дай объяснить!»\n[s20] «Э-это конфискат! Ящик для конфискованных материалов!»"
1006305-124 = "О нет. Всё нормально. Я понимаю. Не нужно..."
1006305-125 = "Ну, я-я... только что вспомнила... Я оставила духовку включённой! Мне надо помыть голову! И—"
1006305-126 = "Ну, тогда я..."
1006305-127 = "Я пойду!"
1006305-128 = ""
1006305-130 = ""
1006305-131 = "Тогда, эм, пока!"
1006305-132 = ""
1006305-134 = ""
1006305-135 = ""
1006305-139 = "Я попытался догнать Коюки и всё объяснить, но она оказалась слишком быстрой."
1006305-140 = ""
1006305-144 = "Вскоре мне позвонили из Семинара — одновременно с извинениями и лекцией."
1006305-145 = ""
