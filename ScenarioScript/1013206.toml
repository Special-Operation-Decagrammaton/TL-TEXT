[translation]
1013206-1 = "Спасите меня...!"
1013206-3 = "Всё началось с обещания вместе сходить на модный показ."
1013206-5 = "По дороге к месту проведения модного показа"
1013206-8 = "Так... почему мы бежим со всех ног?"
1013206-9 = ""
1013206-13 = "Я-я опоздаю!"
1013206-14 = "[s1] «*пых* *пых*...»\n[s2] «М-Может... чуть помедленнее, Цукуё...?»"
1013206-17 = "П-Простите, Сенсей...!"
1013206-18 = "Если бы я только не проспала...!"
1013206-19 = "Прошлой ночью я никак не могла уснуть. Всё думала о том, что это будет мой последний модный показ...!"
1013206-20 = "[s] «В таком случае, может, поймаем такси?»"
1013206-21 = "М-Машина поедет в объезд! Так будет намного дольше!"
1013206-22 = "Может быть... мы успеем, если пойдём коротким путём!"
1013206-23 = "С-Сюда, Сенсей!"
1013206-24 = ""
1013206-26 = ""
1013206-29 = "[ns] «Это...»"
1013206-30 = "За мной, Сенсей!"
1013206-31 = "Я нашла этот путь, когда тренировалась в паркуре!"
1013206-32 = "Если проскочим через эти здания, дальше будет прямая дорога до показа!"
1013206-33 = "[s] «Эм, кстати, Цукуё...»"
1013206-35 = "[ns] «...Это разве не сетчатый забор?»"
1013206-36 = "В-Всё будет хорошо, Сенсей!"
1013206-37 = "[s] «А, понятно. Сбоку есть маленькая калитка...»"
1013206-38 = "По-настоящему подготовленной ниндзя не составит труда перепрыгнуть это препятствие!"
1013206-39 = "[s] «Что, прости?!»"
1013206-40 = "Я-я покажу, как это делается, Сенсей!"
1013206-41 = ""
1013206-43 = ""
1013206-44 = "Вот здесь... Сосредоточьтесь и оттолкнитесь изо всех сил...!"
1013206-45 = "[s] «Н-Но дверь прямо рядом!»"
1013206-46 = ""
1013206-48 = ""
1013206-51 = "[ns3] «А...?»\n[ns4] «Ты и правда перепрыгнула...!»"
1013206-57 = "[ns] «...Погоди, не уверен, что у тебя получилось...!»"
1013206-60 = "― [log=츠쿠요 드레스]Ух...[/log][wa:470]"
1013206-62 = "― [log=츠쿠요 드레스]Я перелезла через забор... как-то...[/log][wa:3650]"
1013206-65 = "― [log=츠쿠요 드레스]Но одежда зацепилась...[/log][wa:3600]"
1013206-68 = "― [log=츠쿠요 드레스]И я не могу двигаться...[/log][wa:980]"
1013206-71 = "― [log=츠쿠요 드레스]Ух... Простите...[/log][wa:3390]"
1013206-73 = "― [log=츠쿠요 드레스]Это всё потому, что я предложила пойти коротким путём...[/log][wa:3450]"
1013206-76 = "― [log=츠쿠요 드레스]...А? Как вы оказались по ту сторону, Сенсей...?[/log][wa:5590]"
1013206-79 = "― [log=츠쿠요 드레스]Что?! Рядом с забором была калитка...?![/log][wa:2270]"
1013206-82 = "― [log=츠쿠요 드레스]У-Уххх...[/log][wa:1110]"
1013206-84 = "― [log=츠쿠요 드레스]Ух... Я не знала, я...[/log][wa:1340]"
1013206-87 = "― [log=츠쿠요 드레스]...Сенсей, можете освободить ту часть[/log][wa:1270]"
1013206-89 = "― [log=츠쿠요 드레스]которая зацепилась, и помочь мне выбраться?[/log][wa:5250]"
1013206-92 = "Я осторожно помог ей освободить одежду из ограды так, чтобы ничего не повредить."
1013206-93 = "Проходивший мимо полицейский заметил нас, из-за чего возникло небольшое недоразумение, но..."
1013206-94 = "...мы всё-таки добрались до показа — как раз вовремя и по-модному."
1013206-96 = "После этого, встретив ещё одного полицейского снаружи площадки, я немного напрягся."
