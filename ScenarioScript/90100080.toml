[translation]
90100080-1 = "Эпизод 8;За маревом"
90100080-2 = ""
90100080-3 = "FOX 3, докладываю."
90100080-4 = "Журнал. Сейчас 10:00 по корейскому времени. Текущая температура — 28 градусов Цельсия. Скорость ветра — примерно 3 узла."
90100080-5 = "Сейчас мы проверяем появление аномалии, условно названной белым пугалом. FOX 4 находится в точке Ромео по азимуту 0-3-0."
90100080-6 = "С рассвета температура неуклонно растёт, но признаков марева пока нет."
90100080-7 = ""
90100080-9 = ""
90100080-10 = "Как же скучно. Никогда бы не подумала, что мне придётся высматривать горячий воздух."
90100080-11 = "Слушай, Ото— НЕТ... то есть FOX 4! Не засоряй канал связи!"
90100080-12 = "Не кипятись. Всё равно пока ждём, можем разговаривать."
90100080-13 = "Говорит FOX 4. Как уже сообщила FOX 3, здесь нет даже следа обычного марева, не говоря уже об аномальном. Возможно, земля ещё недостаточно нагрелась."
90100080-14 = "...Сегодня ведь гораздо приятнее, да? Мы хотя бы работаем в настоящей тени."
90100080-15 = "Мне намного лучше, и голова яснее. Правда, всё ещё непонятно, что именно мы должны высматривать."
90100080-16 = ""
90100080-18 = ""
90100080-19 = "FOX 1, докладываю. Сосредоточьтесь на мареве, как мы и обсуждали. Именно его вы ищете."
90100080-20 = "Пока у нас нет конкретного подозреваемого, но мы можем получить зацепку, если попробуем взглянуть на ситуацию глазами пострадавших."
90100080-21 = "То есть ты считаешь, что пялиться на несуществующее марево — продуктивно?"
90100080-22 = "Ладно. Буду смотреть во все глаза. Ищем призрачную фигуру из горячего газа, девочки."
90100080-23 = "Т-Ты вообще думаешь, прежде чем что-то сказать?"
90100080-24 = "Пока нельзя исключать ни одной возможности. Нам нужно раскрыть правду о белом пугале."
90100080-25 = "...Я просто пошутила. Прости, командир. Забыла, что у тебя иммунитет к юмору."
90100080-26 = ""
90100080-28 = ""
90100080-29 = ""
90100080-30 = "Говорит FOX 2. Наблюдаю направление 2-1-0 из точки Сьерра. Здесь тоже ничего необычного."
90100080-31 = "Ага... Значит, Сенсея сегодня не будет?"
90100080-32 = "А, Сенсей говорил, что у него есть другая работа."
90100080-33 = "Ты хотела ему что-то сказать?"
90100080-34 = "Н-Нет. Ничего такого..."
90100080-35 = "Просто у меня плохое предчувствие. Как будто что-то надвигается."
90100080-36 = "Есть что-то тревожное в миссии без помощи Сенсея. Надеюсь, всё пройдёт хорошо."
90100080-37 = "Эй, а с каких пор нам вообще кто-то нужен? Мы всегда и сами справлялись, разве нет?"
90100080-38 = "Я скучаю по Сенсею. У него всегда есть новые солёные снеки."
90100080-39 = "Ты что, считаешь Сенсея своим личным мальчиком на побегушках?"
90100080-40 = "Кстати, FOX 4, с тех пор как мы покинули Исправительное бюро, ты выглядишь немного... располневшей."
90100080-41 = "Это мышцы!"
90100080-42 = ""
90100080-43 = ""
90100080-44 = "FOX 2, видишь что-нибудь подозрительное?"
90100080-45 = "Нет. Как я уже сказала, это просто предчувствие. Не переживай."
90100080-46 = "Твоя интуиция почти всегда оказывается права. Трудно не переживать."
90100080-47 = "...Сегодня ты удивительно мягкая и сентиментальная, FOX 1."
90100080-48 = "Разве ты только что не сказала нам не делать выводов без доказательств?"
90100080-49 = "Доказательства нужны, чтобы построить дело. Но в поле приходится доверять интуиции."
90100080-50 = "Осторожность никогда не бывает лишней."
90100080-51 = "Иногда в самый напряжённый момент инстинкты спасают меня раньше, чем я успеваю подумать. Понимаю, о чём ты."
90100080-52 = "Но меня беспокоило не это. Я не чувствовала непосредственной угрозы — вроде возможной вражеской засады или атаки снайпера."
90100080-53 = "Скорее какое-то беспокойство, будто в самой нашей миссии есть фундаментальная ошибка. ...Или ощущение, что в конце концов мы можем предать друг друга."
90100080-54 = "Как во время нашей старой охоты на кроликов."
90100080-55 = "..."
90100080-56 = "...FOX 1. Ты уверена, что встречалась с настоящим президентом Генерального студенческого совета?"
90100080-57 = "...Она была настоящей. Стояла прямо передо мной. Вы все видели фотографии и видео."
90100080-58 = "Верно. То же лицо, те же поступки, и она несомненно была тем президентом Генерального студенческого совета, которого мы все помним."
90100080-59 = "Может, дело в том, что мы даже не уверены, существует ли враг под названием Лор на самом деле. Но эта миссия тревожит меня с самого начала."
90100080-60 = "Если бы Сенсей был здесь и дал нам совет, его слова, наверное, помогли бы мне успокоиться."
90100080-61 = "Но мы не можем каждый день просить Сенсея нам помогать. У него есть настоящая работа."
90100080-62 = ""
90100080-64 = ""
90100080-65 = "Да. Принято к сведению."
90100080-67 = "FOX 4, докладываю. Температура достигла 31 градуса Цельсия."
90100080-68 = "Над асфальтом начало подниматься марево."
90100080-69 = "Видишь что-нибудь похожее на белое пугало?"
90100080-70 = "Отрицательно. Попробую сосредоточиться на бликах, отражающихся от окна."
90100080-72 = "Эм..."
90100080-73 = "Что случилось, FOX 4?"
90100080-74 = "Ничего. Просто закружилась голова. Когда кажется, будто земля движется, это сбивает с толку."
90100080-75 = "Я слышала об этом от другого студента SRT. Она была на задании в Одиссее."
90100080-76 = "В академии Одиссея есть правило: если заметишь студента, который молча смотрит на поверхность воды, его нужно немедленно оттащить."
90100080-77 = "...Почему?"
90100080-79 = "Подробностей я не узнала, но говорят, что рябь на воде может гипнотизировать людей. Она вводит их в транс."
90100080-80 = "Поэтому их нужно оттащить, пока они не прыгнули в воду!"
90100080-82 = "Хм. Это напоминает мне другой миф. Вы когда-нибудь слышали о сиренах?"
90100080-83 = "Ну, история с водой звучит правдоподобнее, чем какой-то полулюдь, распевающий песни!"
90100080-84 = "Осторожнее с маревом, FOX 4. Ещё одержит тебя, и полетишь лицом в асфальт."
90100080-85 = "Да брось. Ты вообще представляешь, сколько у меня за плечами миссий?"
90100080-86 = "А когда такая болтушка, как ты, тараторит без остановки, я точно не потеряю концентрацию."
90100080-87 = ""
90100080-91 = "...А?"
90100080-92 = "Что случилось, ты что-то увидела?"
90100080-93 = "Там всегда... было травяное поле?"
90100080-94 = "Травяное поле? Где? В каком направлении?"
90100080-95 = "Может, это мираж... На карте его точно не было, но я вижу поле прямо за улицей."
90100080-96 = "Посреди заросшей травы стоит потрёпанное пугало, а рядом человек в белой одежде с жуткой улыбкой..."
90100080-97 = "Погодите, это и есть то самое белое пугало, которое видели пострадавшие?"
90100080-98 = "FOX 4, сообщи координаты! В каком направлении ты смотришь?"
90100080-99 = ""
90100080-108 = ""
90100080-109 = ""
90100080-110 = "...Место, где дует холодный, но душный ветер."
90100080-111 = ""
90100080-115 = "Пострадавшие называли это белым пугалом, но это вовсе не пугало."
90100080-116 = "Оно движется по собственной воле. Оно не может существовать, если не танцует. Оно не может влиять на мир, если за ним не наблюдают. Поэтому оно танцует рывками. Всегда облачённое в белое."
90100080-117 = "Что ты такое говоришь, FOX 4?! Возьми себя в руки!"
90100080-118 = "Оно здесь. Оно приближается. Великая серая волна, извивающаяся словно в судорогах, корчащаяся словно в танце..."
90100080-119 = "Извивается, извивается, извивается, извивается, извивается, извивается..."
90100080-120 = ""
90100080-129 = "...ОТОГИ!"
90100080-130 = ""
90100080-135 = "Ч-что это было?!"
90100080-136 = "Точка Ромео, ответьте. Что произошло?"
90100080-139 = ""
90100080-140 = "Ауч... FOX 1, FOX 3 на меня набросилась! Подлетела и со всей силы ударила меня по голове!"
90100080-141 = "Сама-то себя слышишь?! Ты с ума сошла? Слушай сюда! Ты знаешь, кто я такая?"
90100080-142 = ""
90100080-144 = ""
90100080-145 = "Эм, да. Девушка с плоской грудью. Как гладильная доска."
90100080-146 = "Заткнись! Сколько пальцев я показываю?"
90100080-147 = "Два, гений. Я прошла проверку?"
90100080-148 = ""
90100080-150 = ""
90100080-151 = "Какое облегчение. Я уже подумала, что ты отключилась, как остальные пострадавшие."
90100080-152 = "FOX 3, доложи обстановку."
90100080-153 = "Говорит FOX 3. FOX 4, которая только что наблюдала за маревом..."
90100080-154 = "...сказала, что увидела белое пугало."
90100080-155 = "Я сказала?!"
90100080-156 = "Ага. Не помнишь? Ты там поэзию читала про заросшие травой поля и волны."
90100080-157 = "...Совсем не помню."
90100080-158 = "Я... смотрела на марево. А вы говорили про Одиссею."
90100080-159 = "Странно. Что... мне привиделось?"
90100080-160 = "Главное, что ты цела. Теперь оцени ущерб. Ты выстрелила."
90100080-161 = "Уф... Сейчас проверю."
90100080-162 = "Надеюсь, я никого не ранила..."
90100080-163 = ""
90100080-165 = ""
90100080-166 = "...А?"
90100080-167 = "Ч-Что такое? Только не говори, что попала в гражданского."
90100080-168 = "Нет, дело не в этом... Следов попадания нет. Нигде! Но у меня точно были не холостые..."
90100080-169 = "Что? Хочешь сказать, пуля пятидесятого калибра просто растворилась в воздухе?"
90100080-170 = "...Может, это и правда был призрак."
90100080-171 = ""
90100080-172 = ""
90100080-173 = "FOX 1, есть догадки?"
90100080-174 = "Пока нет. Сначала нужно разобрать ситуацию."
90100080-175 = ""
90100080-177 = ""
90100080-178 = "Отряд, возвращаемся в штаб. Соберите снаряжение и встретимся в точке сбора."
90100080-180 = "Есть!"
90100080-182 = "Следующий эпизод;В погоне за иллюзиями"
