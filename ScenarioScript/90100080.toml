[translation]
90100080-1 = "Episódio 8;Do Outro Lado da Miragem"
90100080-2 = ""
90100080-3 = "Relatório, aqui é a FOX3."
90100080-4 = "Horário padrão de Kivotos: 1000h. Temperatura em 28 graus Celsius, vento a cerca de 3 nós."
90100080-5 = "No Ponto Romeo junto com a FOX4, #nvigiando na direção azimute 0-3-0 para o fenômeno anômalo conhecido como \"espantalho branco\"."
90100080-6 = "A temperatura do solo tá subindo direitinho, mas ainda não tem sinal de miragem térmica subindo."
90100080-7 = ""
90100080-9 = ""
90100080-10 = "Que tédio sem fim. Ficar de plantão esperando um troço que nem sabe se vai aparecer..."
90100080-11 = "Ei, Otogi— quer dizer, FOX4! Não interrompa a linha de rádio!"
90100080-12 = "Pra que esquentar com bobeira? #nConversar deixa o plantão muito mais divertido."
90100080-13 = "Aqui é a FOX4. Como a FOX3 disse, nem miragem normal começou a subir, quanto mais anomalia. #nO chão ainda não deve estar quente o bastante."
90100080-14 = "...Aliás, tem certeza de que tá tudo bem a gente ficar mofando na sombra hoje?"
90100080-15 = "Tá mil vezes melhor que ontem, não tô reclamando nem nada, mas..."
90100080-16 = ""
90100080-18 = ""
90100080-19 = "Aqui é a FOX1. O plano continua o mesmo. Mantenham o foco na miragem."
90100080-20 = "Ainda não temos provas conclusivas do suspeito, mas observar o local sob o mesmo campo de visão das vítimas pode revelar pistas."
90100080-21 = "Ou seja... se a gente ficar secando a miragem por tempo suficiente, vai brotar alguma coisa de lá?"
90100080-22 = "Tipo um zumbi todo contorcido no formato da miragem vindo na nossa direção, sei lá~"
90100080-23 = "N-não viaja, isso nunca aconteceria!"
90100080-24 = "Até confirmarmos a verdadeira natureza do \"espantalho branco\", não podemos descartar nenhuma hipótese como \"impossível\"."
90100080-25 = "...Era piada, comandante. Você não entende sarcasmo nem se desenhar, né?"
90100080-26 = ""
90100080-28 = ""
90100080-29 = ""
90100080-30 = "Aqui é a FOX2. Observando o azimute 2-1-0 a partir do Ponto Sierra. #nPor aqui também nada de anormal até agora."
90100080-31 = "A propósito... o Sensei não vem hoje?"
90100080-32 = "Ah, ele comentou que tinha outro compromisso inadiável."
90100080-33 = "Ué, precisava falar algo com ele?"
90100080-34 = "N-não, não é nada disso..."
90100080-35 = "Não sei bem... só tô com um pressentimento esquisito."
90100080-36 = "Pensar em agir sem o apoio do Sensei tão de repente me deixou meio apreensiva."
90100080-37 = "Qual é, a gente sempre resolveu tudo sozinhas até hoje, não?"
90100080-38 = "Quer dizer, com o Sensei por perto rola um lanchinho gostoso e o clima fica mais leve, isso é verdade..."
90100080-39 = "Menina, você acha que o Sensei é o quê, nosso entregador de guloseimas...?"
90100080-40 = "Aliás, FOX4... você não deu uma engordada desde que saiu do Centro Correcional?"
90100080-41 = "É puro músculo, tá!"
90100080-42 = ""
90100080-43 = ""
90100080-44 = "FOX2. Notou algo suspeito?"
90100080-45 = "Não. Como eu disse, é só um pressentimento meu. Pode ignorar."
90100080-46 = "Porém, sua intuição raramente erra, Niko. Não posso desconsiderar."
90100080-47 = "...Não soa muito com você, FOX1. Meio hesitante, guiando-se por impressões."
90100080-48 = "Você não vivia dizendo pra nunca tirarmos conclusões precipitadas sem dados concretos?"
90100080-49 = "Diferente do planejamento, no calor do combate o instinto também é uma arma."
90100080-50 = "Toda cautela ainda é pouca."
90100080-51 = "Quando a experiência fala mais alto, o corpo reage antes da mente... É, tem sua razão."
90100080-52 = "Mas a minha preocupação não é com emboscada inimiga, franco-atirador nem nada tático..."
90100080-53 = "E se essa missão em si for uma armadilha? #nE se, sem perceber, estivermos apontando nossos fuzis pros nossos próprios aliados de novo...? É essa a angústia de fundo."
90100080-54 = "Tipo... como aconteceu na tal \"Caça ao Coelho\"."
90100080-55 = "............"
90100080-56 = "...FOX1. A Presidente do Conselho Estudantil Federal... era mesmo ela?"
90100080-57 = "Mas é claro. Você mesma não verificou os registros de vídeo e as fotos, FOX2?"
90100080-58 = "Sim. Os traços do rosto, a postura... sem sombra de dúvida, era a Presidente que guardamos na memória."
90100080-59 = "Mas talvez por estarmos lidando com [ruby=uma anomalia inexplicável]Lore[/ruby]... essa inquietação não sai do meu peito."
90100080-60 = "Se ao menos o Sensei estivesse aqui do nosso lado..."
90100080-61 = "Mas também não dá pra ficar chamando o Sensei todo santo dia, ocupado do jeito que ele é."
90100080-62 = ""
90100080-64 = ""
90100080-65 = "Entendido. Vou manter isso em mente."
90100080-67 = "Aqui é a FOX4. Temperatura ambiente bateu os 31 graus."
90100080-68 = "A miragem do calor deve começar a subir a qualquer momento."
90100080-69 = "Dá pra ver alguma coisa parecida com um espantalho?"
90100080-70 = "Nada. Ah, mas com o reflexo brilhante dos vidros misturado no ar quente... quem sabe não pareça um espantalho?"
90100080-72 = "Hum..."
90100080-73 = "FOX4?"
90100080-74 = "Nada não, só uma tonturinha de leve... Deve ser de ficar encarando o asfalto tremendo sem piscar..."
90100080-75 = "Falando nisso, me lembrei do que uma colega que serviu na Odisseia me contou uma vez."
90100080-76 = "Ela disse que se vir alguma aluna encarando a água do mar em silêncio por muito tempo, tem que puxar ela pra longe na mesma hora."
90100080-77 = "Por quê?"
90100080-79 = "Não sei os detalhes, mas parece que o movimento das ondas causa uma espécie de transe hipnótico."
90100080-80 = "Por isso tem que tirar a pessoa da beirada antes que ela se jogue na água sozinha."
90100080-82 = "Isso... não é aquela história do \"Canto das Sereias\" dos livros de conto de fadas?"
90100080-83 = "Bom, parece mais plausível do que um monstro metade peixe cantando em cima de um rochedo."
90100080-84 = "Então é bom você se cuidar também, FOX4. #nVai que essa miragem te hipnotiza e você é sugada pra debaixo do asfalto quente."
90100080-85 = "Capaz! A gente já fez dezenas de operações muito mais perigosas que essa."
90100080-86 = "Além do mais, com uma matraca tagarela do meu lado, eu nunca que ia cair num transe—"
90100080-87 = ""
90100080-91 = "...Ué?"
90100080-92 = "Que foi?"
90100080-93 = "Desde quando... tinha um gramado florido bem ali?"
90100080-94 = "Gramado? Onde, em que direção?!"
90100080-95 = "Ali, do outro lado da pista. Dá pra ver um descampado sob o céu azul. #nNão tem nada disso no mapa... é miragem?"
90100080-96 = "A relva tá alta... tem um espantalho... e lá atrás, uma pessoa de branco rindo—"
90100080-97 = "Hã...?! Peraí! Isso não é o \"espantalho branco\"?!"
90100080-98 = "FOX4, quais são as coordenadas?! Pra onde você tá olhando?!"
90100080-99 = ""
90100080-108 = ""
90100080-109 = ""
90100080-110 = "De onde sopra... aquele vento abafado e sinistro..."
90100080-111 = ""
90100080-115 = "Todo mundo chamava de \"espantalho branco\"... mas aquilo não é um espantalho."
90100080-116 = "Aquilo tem vontade própria. Se não se mexer, não consegue existir... #nPrecisa ser observado pra poder interferir, por isso veste branco e dança daquele jeito..."
90100080-117 = "Do que você tá falando?! FOX4! Acorda!!"
90100080-118 = "Tá vindo... tá vindo! Uma onda cinzenta gigante, tremendo em espasmos, se contorcendo, dançando, remexendo—"
90100080-119 = "Kunekune kunekune kunekune—"
90100080-120 = ""
90100080-129 = "OTOGI!!"
90100080-130 = ""
90100080-135 = "O-o que foi isso?! Ouvi um tiro de fuzil...!"
90100080-136 = "Ponto Romeo, responda! O que aconteceu aí?!"
90100080-139 = ""
90100080-140 = "Aaaai...! A FOX3 enlouqueceu do nada! #nEla veio correndo e me deu um cascudo na cabeça com a coronha!"
90100080-141 = "Hãã?! Você que pirou a batatinha! Sabe quem eu sou por acaso?!"
90100080-142 = ""
90100080-144 = ""
90100080-145 = "Por que essa pergunta doida...? Essa tábua reta na minha cara é sua de nascença."
90100080-146 = "Não brinca comigo! Quantos dedos tem aqui?!"
90100080-147 = "Dois...? Qual é, ficou biruta?"
90100080-148 = ""
90100080-150 = ""
90100080-151 = "Que alívio... #nA contagem de vítimas não aumentou..."
90100080-152 = "FOX3. Relate a situação imediatamente."
90100080-153 = "Aqui é a FOX3. A FOX4 estava monitorando a miragem até agora há pouco quando—"
90100080-154 = "Ela disse que viu o \"espantalho branco\"."
90100080-155 = "Eu?!"
90100080-156 = "É, você! Não se lembra?! #nComeçou a delirar falando de \"descampado de céu azul\", \"onda cinzenta gigante\" e um monte de groselha!"
90100080-157 = "Não lembro de nada disso."
90100080-158 = "Só lembro de ouvir a Kurumi falar da Odisseia enquanto eu olhava a miragem pela luneta..."
90100080-159 = "Que esquisito. Será que sonhei acordada?"
90100080-160 = "Se estão inteiras, é o que importa. Algum dano colateral causado pelo disparo acidental?"
90100080-161 = "Ugh... vou checar agora."
90100080-162 = "Tomara que não tenha acertado nada de valor."
90100080-163 = ""
90100080-165 = ""
90100080-166 = "...Ué?"
90100080-167 = "O-o que foi? Não me diga que acertou algum civil—"
90100080-168 = "Não, não é isso... Não tem marca de impacto nenhuma. #nMas o cartucho deflagrou, a bala com certeza saiu do cano."
90100080-169 = "Como assim? Um projétil calibre .50 evaporou no ar por osmose?"
90100080-170 = "...Será que era um fantasma de verdade afinal?"
90100080-171 = ""
90100080-172 = ""
90100080-173 = "FOX1, tem algum palpite sobre o que houve?"
90100080-174 = "Não posso afirmar nada ainda. Mas precisamos alinhar os dados com urgência."
90100080-175 = ""
90100080-177 = ""
90100080-178 = "Todas as operadoras, retorno imediato ao QG. Recolham os equipamentos e reúnam-se no ponto de encontro."
90100080-180 = "Copiado!"
90100080-182 = "A Seguir;Pistas"
