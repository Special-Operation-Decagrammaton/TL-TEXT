[translation]
10002180-1 = "Послесловие;Гордость снайпера"
10002180-2 = "(Все вместе едят арбуз.)"
10002180-3 = "А-а-а! Сейчас этот арбуз такой освежающий!"
10002180-4 = "Жаль, что на него попал песок, но тут ничего не поделаешь. Он всё равно сладкий и вкусный."
10002180-5 = "И есть в нём что-то особенно приятное."
10002180-6 = "Не думаешь, Азуса?"
10002180-7 = "Он обеспечивает достаточную гидратацию, однако соотношение воды к пище слишком высокое. Ты перепьёшь воды раньше, чем насытишься."
10002180-8 = "К тому же он обладает мочегонным эффектом, что создаёт свои проблемы."
10002180-9 = "У-Уа!"
10002180-10 = "Хватит об этом, большое спасибо. Люди могут тебя услышать — и Сенсей тоже, между прочим!"
10002180-11 = ""
10002180-13 = ""
10002180-15 = "А-Арбуз вместе с Сенсеем... *ням* Арбуз..."
10002180-16 = "Хе-хе-хе..."
10002180-17 = "Ням-ням. Как вкусно!"
10002180-18 = "Разве арбуз не потрясающий? Он сочетается И с сахаром, И с солью!"
10002180-19 = "Интересно, как он будет с васаби!"
10002180-21 = "Ч-Что?! С васаби?"
10002180-22 = "(По крайней мере, все наслаждаются арбузом. Надеюсь, мы сможем забыть обо всей той драме, что была раньше.)"
10002180-24 = "Все закончили? Что будем делать дальше?"
10002180-25 = "Нам ещё нужно выполнить кое-что для Хасуми."
10002180-26 = "О, меня кое-что интересует."
10002180-27 = "Что именно, Изуми?"
10002180-28 = "Кто победил в той арбузной перестрелке?"
10002180-29 = "А?"
10002180-30 = "Почему ты снова это вспоминаешь, Изуми? Ты же сама её остановила!"
10002180-31 = ""
10002180-33 = ""
10002180-35 = ""
10002180-36 = "Ты права. Счёт так и не был закрыт."
10002180-37 = "Ты прервала нас как раз перед тем, как определился победитель. Гордость Комитета правопорядка не позволит оставить соревнование незавершённым!"
10002180-38 = "Я чувствую то же самое. Покинуть поле боя без явного победителя — значит лишь запятнать имя Клуба дополнительных занятий."
10002180-40 = "Азуса! Я-Я не думаю, что у Клуба дополнительных занятий вообще должна быть репутация на поле боя!"
10002180-41 = "Хм. Арбуза у нас уже недостаточно, чтобы сыграть снова, даже если захотим."
10002180-42 = "А что, если использовать что-нибудь другое?!"
10002180-43 = "Например, фрукт с того дерева?"
10002180-44 = "Или те маленькие камешки на далёкой скале у пляжа?"
10002180-45 = "А как насчёт тех буйков в море?!"
10002180-46 = "Стойте! Так нельзя!"
10002180-47 = "Пожалуйста, успокойтесь. К тому же мы должны выполнять список Хасуми. Определение победителя нам никак не поможет..."
10002180-48 = "[s] «Да ладно, Хифуми. Это же просто ради веселья.»"
10002180-50 = "В-Вы тоже, Сенсей?! Как вы можете такое говорить?"
10002180-51 = "О. Можно использовать фигурку в масштабе 1/7, которую Сенсей купил в сувенирной лавке на пляже."
10002180-52 = "Она станет идеальной мишенью. Позвольте одолжить её, Сенсей."
10002180-53 = "[s] «А-а-а, нет! Забудьте! Драться плохо!»"
10002180-54 = ""
10002180-56 = ""
10002180-58 = "*бах* *бум* *грохот*"
10002180-59 = ""
10002180-61 = ""
10002180-62 = "Во что вообще превращается этот отпуск?!"
10002180-63 = ""
10002180-64 = ""
10002180-66 = ""
10002180-67 = ""
10002180-68 = "Ням-ням."
10002180-69 = "Ммм!"
10002180-70 = "Васаби И ПРАВДА сочетается с арбузом!"
