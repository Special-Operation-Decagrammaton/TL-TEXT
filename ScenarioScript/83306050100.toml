[translation]
83306050100-5 = ""
83306050100-7 = "Хмм...?"
83306050100-8 = ""
83306050100-10 = ""
83306050100-11 = ""
83306050100-13 = "Почему в таком месте лежит блокнот...? Выглядит очень старым."
83306050100-14 = "Внутри написано..."
83306050100-17 = "«Наконец-то у меня появилась собственная тайная комната с пианино»."
83306050100-18 = "«Моя мечта — стать величайшим композитором и концертным пианистом во всей Геенне... Нет, во всём Кивотосе!»"
83306050100-19 = ""
83306050100-23 = "«С этого дня я буду заниматься каждый день... пока не достигну этой цели»."
83306050100-24 = "«Каждый день буду записывать в этот блокнот результаты занятий. Чтобы будущая я могла оглянуться назад и увидеть всё, чего добилась»."
83306050100-25 = ""
83306050100-29 = ""
83306050100-31 = "Значит... это оставил прежний хозяин этого места."
83306050100-32 = "Уверена, тогда ни пианино, ни блокнот ещё не были покрыты пылью..."
83306050100-33 = "Твоя мечта стать концертным пианистом..."
83306050100-34 = "Интересно, как у тебя сейчас дела."
83306050100-35 = "..."
