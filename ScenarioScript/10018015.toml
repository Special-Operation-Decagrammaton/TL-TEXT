[translation]
10018015-7 = ""
10018015-8 = "Я-я это запомню! И не только то, как мне сейчас больно!"
10018015-9 = "Вы ещё заплатите за то, что связались с бандой гурманов в шлемах!"
10018015-10 = ""
10018015-15 = "Столько времени потрачено на людей, у которых так мало вкуса — и в манерах, и в названиях, и в еде."
10018015-16 = ""
10018015-18 = ""
10018015-19 = "Ну что, вернёмся к нашей изначальной цели?"
10018015-21 = ""
10018015-22 = ""
10018015-24 = "Спасибо за вашу доброту. Я никогда не смогу отплатить вам."
10018015-25 = "Особенно потому, что продолжать этот бизнес буквально невозможно."
10018015-26 = "[s] «Не могли бы вы подробнее объяснить свою ситуацию?»"
10018015-27 = "Я-я не знаю, стоит ли..."
10018015-28 = "Ну, всё равно я закрываюсь, так почему бы и нет."
10018015-29 = ""
10018015-31 = ""
10018015-32 = "Вы случайно не заметили все сетевые рестораны снаружи?"
10018015-33 = "Они вытесняют все маленькие предприятия. Я не первая и, скорее всего, не последняя."
10018015-35 = "(Значит, улица тонет в дешёвой еде со стандартизированным корпоративным вкусом...)"
10018015-36 = "(Душераздирающее, но знакомое зрелище для гурманов по всему миру...)"
10018015-38 = "С ценами и ресурсами сетевых заведений конкурировать нелегко."
10018015-39 = "Будто они высасывают весь воздух из комнаты..."
10018015-40 = "И, словно этого мало, со мной лично тоже случилось кое-что ужасное."
10018015-41 = "Что ты имеешь в виду?"
10018015-42 = "Все ингредиенты мы закупаем у поставщика под названием Няо Фудс."
10018015-43 = "У той же компании закупаются все сетевые рестораны."
10018015-44 = "По какой-то причине Няо Фудс внезапно подняла цены..."
10018015-45 = ""
10018015-47 = ""
10018015-49 = ""
10018015-50 = "Так, подождите секунду!"
10018015-51 = "Разве это не заставит сетевые рестораны тоже поднять цены или пожертвовать прибылью?"
10018015-52 = "Так было бы логично. Если поставщик один и тот же, расходы тоже должны быть одинаковыми."
10018015-53 = "Хм, я не очень понимаю, но это ведь типа из-за инфляции, да?"
10018015-55 = "Дело в том, что все сетевые рестораны связаны с Няо Фудс."
10018015-56 = "Поэтому они получают скидки на поставки, а мы..."
10018015-57 = "Эти скидки как раз полностью компенсируют недавнее повышение цен."
10018015-58 = "Что?! Это нечестно!"
10018015-59 = "И как маленьким семейным заведениям с ними конкурировать?!"
10018015-60 = "...Возможно, они таким образом пытаются вынудить вас войти под крыло Няо Фудс?"
10018015-61 = "Они несколько раз такое предлагали."
10018015-62 = "Но я хотела сохранить этот ресторан своим. Он передавался из поколения в поколение..."
10018015-63 = "Это была глупая идея. Я пыталась его защитить, но в итоге лишь потеряла всё."
10018015-64 = "Сначала я думала, что нужно просто работать усерднее и радовать больше клиентов."
10018015-65 = "Но жизнь так не работает."
10018015-66 = "Знаю, звучит так, будто я совсем раздавлена, но после разговора мне стало легче."
10018015-67 = "Спасибо, что выслушали. Для меня это очень важно."
10018015-68 = ""
10018015-70 = ""
10018015-72 = ""
10018015-73 = "Я понимаю..."
10018015-74 = "А?"
10018015-75 = "Я понимаю вашу боль..."
10018015-76 = "Мадам?"
10018015-77 = "Я стараюсь, стараюсь и стараюсь..."
10018015-78 = "...а потом кто-то другой разрушает все мои планы!"
10018015-79 = ""
10018015-82 = ""
10018015-84 = "Или я вкладываю в блюдо всё, что у меня есть..."
10018015-85 = "...а потом кто-то между делом принижает всю его ценность!"
10018015-86 = "Такое бывает? Как жалко! ★"
10018015-87 = "Но даже тогда я возвращаюсь к делу и пробую снова..."
10018015-88 = "...и какой-нибудь случайный природный катаклизм разрушает мои планы ещё до того, как я успеваю их воплотить!"
10018015-89 = "Ф-Фуука?!"
10018015-90 = "Но, словно остатки индейки после Дня благодарения, я продолжаю держаться..."
10018015-91 = ""
10018015-93 = ""
10018015-95 = "...только чтобы обнаружить, что всю приготовленную мной еду съели ещё до подачи!"
10018015-96 = "Что происходит? Что случилось с Фуукой?"
10018015-97 = "Что бы это ни было, можно я тоже присоединюсь?"
10018015-98 = "М-Мадам?"
10018015-99 = "Я-я понимаю, о чём вы. Пожалуйста, просто успокойтесь!"
10018015-100 = ""
10018015-102 = ""
10018015-104 = "Я помогу вам."
10018015-106 = "П-Правда?"
10018015-107 = "Если мы будем работать вместе, уверена, способ найдётся. Нельзя просто сдаваться, даже не попробовав."
10018015-108 = "Е-Если вам удастся спасти мой... Я даже не знаю, как смогу вам отплатить."
10018015-109 = "Спасибо. Огромное спасибо."
10018015-110 = ""
10018015-112 = ""
10018015-114 = "Хи-хи..."
10018015-115 = "Всё сложилось удачно. Я знала, что правильно сделала, похи— то есть пригласила всех."
10018015-116 = "[s] «...А хоть что-нибудь уже действительно сложилось удачно?»"
10018015-117 = "Ну а что-нибудь уже пошло не так, Сенсей?"
10018015-118 = "Ничего, правда?"
10018015-119 = "Значит, всё будет хорошо."
10018015-120 = ""
10018015-122 = ""
10018015-123 = ""
10018015-125 = "А? К чему этот тяжёлый вздох?"
