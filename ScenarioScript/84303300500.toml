[translation]
84303300500-5 = "Здравствуйте, эм..."
84303300500-6 = "К-Как...? Как такое вообще могло...?"
84303300500-7 = "А?!"
84303300500-8 = "(Ч-Что происходит? Атмосфера какая-то странная...?)"
84303300500-9 = "Не может быть... Не может быть...! Вчера всё было не так...!!"
84303300500-10 = "Вы в порядке...? Что-то случилось..."
84303300500-11 = "О-Ох...!"
84303300500-12 = "Простите. Простите! Мы не так это проектировали! И не так программировали!"
84303300500-13 = "Успокойся. Я не пытаюсь вас обвинить."
84303300500-14 = "Можешь рассказать, что здесь произошло? Кажется..."
84303300500-15 = ""
84303300500-19 = "...снаружи какая-то суматоха..."
84303300500-20 = "Т-Там сейчас огромная драка."
84303300500-21 = "Не уверена, почему именно... Кажется, люди поиграли в нашу игру и начали драться."
84303300500-22 = "Они поиграли... и потом просто внезапно начали драться?"
84303300500-23 = "Это странно. Мы не так... То есть, мы сделали игру такой, но не в ЭТОМ смысле...!"
84303300500-24 = "Я-я понимаю, что это звучит странно, но я говорю правду! Мы правда не хотели такого...!"
84303300500-25 = "Понимаю. Отдохните здесь. Сильно не переживайте."
84303300500-26 = "Я пойду проверю, что там происходит."
