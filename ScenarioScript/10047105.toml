[translation]
10047105-3 = "Коридор общежития Совета префектов Вайлдханта"
10047105-5 = ""
10047105-6 = "[ns] «Здесь подозрительно пусто.»"
10047105-7 = "Хи-хи... Мы оторвались от них... прямо в их собственном общежитии."
10047105-8 = "Думаю, все отправились к Безымянной колокольне."
10047105-9 = "Ох, Рэна... Надеюсь, она смогла выбраться."
10047105-10 = "Раз колокол замолчал... Скоро они должны вернуться."
10047105-11 = ""
10047105-12 = "[ns] «Все, скорее!»"
10047105-13 = ""
10047105-15 = ""
10047105-20 = "Теперь, если только закончить у главного входа..."
10047105-21 = ""
10047105-24 = ""
10047105-25 = "Как вы пробрались в наше общежитие?"
10047105-27 = "Всем стоять! Хватит ваших дешёвых трюков!"
10047105-28 = ""
10047105-30 = ""
10047105-31 = "...Нюхуху, уже поздно. Мы только что завершили магический круг."
10047105-32 = "Время пришло! И вместе с полной луной врата истины откроются...!"
10047105-33 = ""
10047105-35 = ""
10047105-36 = "Магический круг и полная луна? Н-неужели...?"
10047105-37 = "Она и правда это делает! Та самая городская легенда...?"
10047105-38 = "Именно! Сейчас мы вам покажем!!"
10047105-39 = "Магический круг, активируйся...!"
10047105-40 = ""
10047105-42 = ""
10047105-47 = "Г-гха-а...! Мои силы! Моя жизненная энергия!"
10047105-48 = "У-угх...! Н-неужели я так и умру?!"
10047105-49 = "Что на тебя нашло? Это всего лишь светодиодная подсветка."
10047105-50 = "Да. Я знаю."
10047105-51 = "Просто... атмосфера подходящая."
10047105-52 = ""
10047105-56 = "А-а? Почему ничего не происходит?"
10047105-57 = "Я всё идеально спланировала. Круг нарисован без единой ошибки!"
10047105-58 = "Неужели Магии исполнения желаний... не существует?"
10047105-59 = ""
10047105-61 = ""
10047105-62 = "Но разве это не прекрасно? Весь Вайлдхант сияет."
10047105-64 = "...Хм."
10047105-65 = "Из уважения мы особым титулом называем тех, кто работает с драгоценными камнями. Их зовут «Творцами света.»"
10047105-66 = "И под «драгоценностями» подразумеваются не только камни. Вокруг нас я вижу множество прекрасных самоцветов — например, страсть стольких девушек, сражающихся за свои мечты."
10047105-67 = "И всё же, стоя здесь вместе с вами, я вижу то, что мы создали сообща... эту чарующую форму света..."
10047105-68 = "...это единственное, что важно."
10047105-70 = "Ладно, закончили. Сдавайтесь мирно."
10047105-71 = "И вы ещё ответите за то, что прервали наш сон!"
10047105-72 = ""
10047105-78 = ""
10047105-79 = ""
10047105-80 = ""
10047105-81 = ""
10047105-82 = ""
10047105-83 = ""
10047105-84 = ""
10047105-85 = ""
10047105-86 = ""
10047105-87 = ""
10047105-88 = ""
10047105-90 = ""
10047105-91 = ""
10047105-92 = "[ns] «...Вот так всё и закончится...?»"
10047105-94 = "Все. Подождите."
10047105-95 = ""
10047105-97 = ""
10047105-98 = ""
10047105-99 = ""
10047105-100 = ""
10047105-101 = ""
10047105-102 = "[ns] «Ты...»"
10047105-103 = "Здравствуйте. Пожалуйста, подождите немного."
10047105-104 = "Президент Ассамблеи хочет поговорить."
10047105-106 = "Президент Ассамблеи...? Она хочет поговорить с НАМИ?"
10047105-107 = "Верно. Это вам."
10047105-108 = ""
10047105-110 = ""
10047105-113 = "Добрый вечер, все. Говорит Уруваси Манами, президент Ассамблеи искусств."
10047105-114 = "Знаю, уже поздно. Спасибо за ваши старания."
10047105-115 = "Хотела бы я быть там вместе с вами, но из-за неблагоприятных обстоятельств мне пришлось связаться удалённо."
10047105-116 = "Для начала, если честно..."
10047105-117 = ""
10047105-120 = "...я очень тронута."
10047105-121 = "Я уже давно интересуюсь художницами из Отряда 404."
10047105-122 = "Я знала, что вместе они создадут нечто прекрасное, уникальное и захватывающее дух."
10047105-123 = "Сегодня вы оправдали мои высокие ожидания, создав настоящий шедевр."
10047105-124 = "Это невиданная прежде авангардная инсталляция, где прошлое и настоящее Вайлдханта соединены светом и сдержанной геометрией."
10047105-125 = "Я хочу сохранить эту работу в качестве постоянной экспозиции и поддерживать её. Пусть все знают, что это искусство создано Отрядом 404."
10047105-126 = "Кроме того, я намерена установить смотровую площадку, чтобы каждый мог наслаждаться этим видом."
10047105-127 = "Как только получу хороший снимок, с гордостью выставлю его в своём музее."
10047105-128 = "Фуфу... Я с нетерпением жду вашей следующей работы, Отряд 404. Надеюсь, в следующий раз мы встретимся лично."
10047105-129 = "Спасибо за это творение и рождение новой формы искусства. ...До свидания."
10047105-131 = "Магический круг, который мы нарисовали... это «шедевр»?"
10047105-132 = "Как я и говорила. Это изысканное воплощение света."
10047105-133 = "Члены Совета... Вы ведь тоже считаете, что это красиво?"
10047105-134 = ""
10047105-136 = ""
10047105-137 = "Ну... да."
10047105-138 = "Хм. Было бы жаль всё это разбирать."
10047105-139 = ""
10047105-141 = ""
10047105-142 = "Я... всегда хотела создать что-то, что люди заметят."
10047105-143 = "...Стать любимой художницей, а не отстающим студентом."
10047105-144 = "А уверенно улыбалась я лишь потому... что иначе не могла скрыть свой стыд."
10047105-145 = "Но теперь... Спасибо вам. Всё это благодаря вам."
10047105-146 = "Если бы не ваша помощь, я..."
10047105-147 = ""
10047105-149 = ""
10047105-150 = "[ns1] «Нет. Это стало возможным потому, что ты усердно старалась.»\n[ns2] «Гордись собой.»"
10047105-153 = "[ns3] «Это Страна чудес надежд и мечтаний.»\n[ns4] «Место, где мечты каждого становятся явью.»"
10047105-156 = "Мастер..."
10047105-157 = ""
10047105-159 = ""
10047105-160 = ""
10047105-161 = "Да...! Я продолжу усердно работать и выкладываться изо всех сил!"
10047105-162 = "Я верю... что смогу сделать что угодно, пока вы рядом!"
10047105-163 = ""
10047105-167 = ""
10047105-168 = ""
10047105-169 = ""
10047105-170 = ""
10047105-172 = ""
10047105-173 = ""
10047105-174 = ""
10047105-176 = "Да. Всё и правда сбылось."
10047105-177 = "Вот она — Магия исполнения желаний, которой я хотела!"
10047105-179 = "Я желаю..."
10047105-180 = "...чтобы все вы осуществили свои мечты!"
10047105-181 = "И чтобы такие волшебные дни, как этот..."
10047105-182 = "...продолжались вечно!"
