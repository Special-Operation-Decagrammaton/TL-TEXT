[translation]
10040070-1 = "Эпизод 7;Привилегии искателя"
10040070-3 = "..."
10040070-4 = "Сэ...н...сэ...й..."
10040070-5 = "..."
10040070-6 = "...Сэ...н...сэй..."
10040070-7 = "...Сенсей..."
10040070-8 = "О чём задумались, Сенсей?"
10040070-9 = "[ns1] «А, нет. Я просто...»\n[ns2] «Просто думаю обо всём, что сегодня произошло.»"
10040070-12 = "Хи-хи. Понятно."
10040070-13 = "Только не задумайтесь слишком сильно и не споткнитесь. Здесь всё-таки темно."
10040070-14 = "Мы почти пришли. Все ждут нас в конце."
10040070-15 = "Хотите, я возьму вас за руку? Я хорошо знаю эту дорогу."
10040070-16 = "Вот, сюда..."
10040070-17 = "Я шучу, Сенсей. Хотя приятно, что только мне довелось увидеть у вас такое выражение лица."
10040070-18 = "Мне даже немного неловко перед остальными. Подумать только: я сопровождаю достопочтенного Сенсея, и мы совсем одни."
10040070-19 = "Хм..."
10040070-20 = "Может, будем считать это привилегиями искателя, который победил вас в этой игре в прятки?"
10040070-21 = "...Кажется, я слишком разволновалась? Правда? Не возражаю, если вы так думаете."
10040070-22 = "...Что?"
10040070-23 = "...С каких пор я знала? Хи-хи. Полагаю, вам и правда интересно."
10040070-24 = "Посмотрим. С каких же пор...?"
10040070-25 = "А. С того самого момента, когда Коюки выбежала из Комнаты самоанализа и оставила вас в шкафу."
10040070-26 = "[s3] «Так ты знала с самого начала!»\n[s4] «Ты всё это время знала?!»"
10040070-29 = "Так или иначе, это ничего не меняет, так что давайте просто закроем на это глаза."
10040070-30 = "Вы ведь тоже были с нами не до конца честны, верно? Даже если ради Коюки..."
10040070-31 = "...Вы действительно собирались всё это от нас скрыть."
10040070-32 = ""
10040070-34 = ""
10040070-35 = ""
10040070-36 = "Фуфу. Простите, похоже, моя ревность немного вырвалась наружу. Давайте и на это закроем глаза?"
10040070-37 = "Что ж, это вполне в вашем духе. Я верила, что у вас есть какая-то причина."
10040070-38 = "...Но лично у меня причина была немного другая."
10040070-39 = "Вы с Коюки так весело убегали и скрывались. Это выглядело забавно."
10040070-40 = "Мне не хотелось портить вам праздник."
10040070-41 = "Думаю, Юука более-менее всё поняла вскоре после того, как поймала Коюки."
10040070-42 = "Фуфу. Не знаю, как вы, Сенсей, но..."
10040070-43 = "...мне действительно понравилось играть с вами двумя в прятки."
10040070-44 = "Вы и правда были идеальной парой. Было забавно смотреть, как вы барахтаетесь, а возможно, ещё забавнее — как у вас всё получается."
10040070-45 = "И если бы не вся эта цепочка совпадений, нашей маленькой игры вообще бы не случилось."
10040070-46 = "Может, поэтому..."
10040070-47 = "М-м. Может, поэтому мне подсознательно и хотелось растянуть этот единственный в своём роде случай."
10040070-48 = "А. Думаю, обычно вы бы сейчас сказали: «Можешь позвать меня в любое время, если захочешь повеселиться,» но мы оба знаем, что в этот раз всё было немного иначе."
10040070-49 = "...Кажется, я уже слишком долго говорю о себе."
10040070-50 = "А как было для вас, Сенсей? Возможно, вопрос прозвучит странно, но вам понравился сегодняшний вечер?"
10040070-51 = "[s5] «Согласен. Было довольно захватывающе.»\n[s6] «Я уже давно не чувствовал ничего подобного.»"
10040070-54 = "Я и думала, что вы так себя чувствуете, но всё равно рада это услышать. Мне бы не хотелось доставлять вам неудобства."
10040070-55 = "...Что?"
10040070-56 = "...Вы сказали, Коюки говорила какие-то странные вещи?"
10040070-57 = "Можно спросить, какие именно?"
10040070-58 = "[s7] «Она всё повторяла, что чувствует, будто за ней кто-то наблюдает.»\n[s8] «Может, она говорила о тебе.»"
10040070-61 = "Хм..."
10040070-62 = "Понятно. Коюки меня почувствовала...?"
10040070-63 = "Я старалась действовать осторожно, насколько могла, но у неё хорошая интуиция."
10040070-64 = "Хотя меня это не удивляет. В этом и заключается способность Коюки."
10040070-65 = ""
10040070-67 = ""
10040070-68 = "...А?"
10040070-69 = "Фуфу. Не обращайте внимания. Оговорка. Из-за позднего часа я, похоже, говорю чуть больше обычного."
10040070-70 = "[s9] «...Оговорка?»\n[s10] «Хм? Ты о чём?»"
10040070-73 = "Не обращайте внимания. Важнее другое, Сенсей: мы пришли. Зайдём внутрь?"
10040070-74 = "...Все вас ждали."
10040070-75 = ""
10040070-77 = ""
10040070-84 = "Туда? Серьёзно? Ты уве-е-ерена? Точно туда?"
10040070-85 = "Нет-нет. Так быть не может. Если учесть текущее расположение фишек..."
10040070-86 = "Вероятности независимы, так что на самом деле без разницы, куда ставить."
10040070-87 = "[ns11] «...Вечеринка в самом разгаре.»\n[ns12] «Все веселятся.»"
10040070-90 = "АГХ! Эй! Сейчас МОЙ ход, так что Я буду делать, что хочу! Хватит указывать мне, что делать!"
10040070-91 = "Ладно-ладно. Ставь куда хочешь."
10040070-92 = "Вот именно! Если я преодолею это последнее препятствие, победа точно моя!"
10040070-93 = "ПОГНА-А-АЛИ!"
10040070-94 = ""
10040070-98 = "А?! Да вы издеваетесь?! Эта игра отстой! Тупая игра!"
10040070-99 = ""
10040070-103 = "В следующем раунде я присоединился к ним, и мы вместе играли во всякие игры."
10040070-104 = "А. Меня поймали..."
10040070-105 = "АГХ! Да что вообще творит наша команда?!"
10040070-106 = ""
10040070-111 = "А! А-А-А! УА-А-А!"
10040070-112 = "...После трёх поражений подряд Коюки расплакалась и сдалась."
10040070-114 = "Несколько часов спустя..."
10040070-115 = ""
10040070-117 = "Уже довольно поздно. Почти полночь."
10040070-118 = "Фуфу. Посмотрите на Коюки, уже крепко спит."
10040070-119 = "Разве она только что не говорила, что не уснёт до новогоднего отсчёта?"
10040070-120 = "Ничего не поделаешь. Пусть спит."
10040070-121 = "А теперь тем, кто не уснул, пора—"
10040070-122 = "...А?"
10040070-123 = "Ах..."
10040070-124 = ""
10040070-125 = ""
10040070-126 = ""
10040070-127 = ""
10040070-129 = ""
10040070-130 = "[ns13] «...Никто не выжил.»\n[ns14] «Полное уничтожение.»"
10040070-133 = "Ой-ой."
10040070-134 = "Даже я не могла такого предсказать. Я и не ждала, что Коюки с Маки продержатся, но..."
10040070-135 = "Но я уж точно не думала, что остальные участницы Веритас и Юука тоже заснут."
10040070-136 = "Неужели они потратили слишком много сил на игры? Хотя веселились они от души."
10040070-137 = "[s15] «Эти девочки обычно работают до глубокой ночи.»\n[s16] «Может, сегодня они просто отсыпаются за всё это.»"
10040070-140 = "Похоже на то."
10040070-141 = "А вы, Сенсей? Вы ведь работаете больше всех нас..."
10040070-142 = "...Ах."
10040070-143 = "Я отнимаю у вас и без того драгоценное время для сна?"
10040070-144 = "Так и есть, правда? Зная вас, вы бы изо всех сил старались уснуть последним."
10040070-145 = "...Что?"
10040070-146 = "...Фуфу. Уверены, что причина не в этом?"
10040070-147 = "Совсем нет? Хм... Чем настойчивее вы это отрицаете, тем подозрительнее становится."
10040070-148 = ""
10040070-150 = ""
10040070-151 = "...Я шучу. Я вам поверю."
10040070-152 = "Поверю, что вы не спите потому, что не устали, а не ради меня."
10040070-153 = "Тогда, если это правда, давайте выйдем подышать свежим воздухом."
10040070-154 = ""
10040070-156 = ""
10040070-157 = "[ns17] «...Ноа?»\n[ns18] «Ты совсем не устала?»"
10040070-160 = "Ни капли. И уже почти полночь, верно? Я бы хотела встретить Новый год с обратным отсчётом."
10040070-161 = "Но здесь мы его едва ли устроим, не разбудив всех этих спящих студентов."
10040070-162 = "Так что, может, сменим место? Фуфу."
10040070-163 = ""
10040070-165 = ""
10040070-169 = ""
10040070-170 = "...Вы ведь не хотите, чтобы я встречала Новый год одна, правда?"
