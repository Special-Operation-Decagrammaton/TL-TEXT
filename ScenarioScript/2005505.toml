[translation]
2005505-1 = "Игровой турнир"
2005505-2 = "Клубная комната Отдела разработки игр"
2005505-3 = "Не верится, что главным призом игрового турнира предлагают Virtual Boss..."
2005505-4 = "...Хотя, учитывая его популярность и редкость, для первого места он вполне подходит."
2005505-5 = "Постойте, так вот какой у вас план?"
2005505-6 = "Вы думаете, мне нужно просто «выиграть турнир и получить Virtual Boss таким образом»...?!"
2005505-7 = ""
2005505-9 = ""
2005505-10 = "Э-Это не так просто, Сенсей..."
2005505-11 = "[s] «Что, боишься?»"
2005505-12 = "Нет. Просто отдайте команду, Сенсей! Когда дело касается игр, я—!"
2005505-13 = "...Постойте! По какой игре вообще турнир?"
2005505-14 = "Simulion Quest? Это та VR-игра, в которую мы играли вместе, Сенсей...!"
2005505-15 = "...Шанс есть. Наверное. Я определённо начинаю привыкать."
2005505-16 = "Но для одиночного выступления мне пока не хватает уверенности..."
2005505-17 = "[s] «Поэтому я записал нас в парный кооперативный турнир.»"
2005505-18 = ""
2005505-20 = ""
2005505-21 = "А?! Вы тоже будете участвовать?"
2005505-22 = "«Нельзя отправлять союзника в бой одного». О, какая фраза, Сенсей."
2005505-23 = "К-Конечно, в Simulion Quest... одной мне, наверное, было бы трудно пройти даже отборочные..."
2005505-24 = "...Так что спасибо, Сенсей. Будем целиться в чемпионский приз!"
2005505-25 = "[s1] «Кстати, Юзу.»\n[s2] «У турнира по Simulion Quest есть дополнительные требования к участникам.»"
2005505-28 = "«Требования»...?"
2005505-30 = "Прошло несколько дней, и наконец настало время турнира."
2005505-32 = "Вход на площадку игрового турнира"
2005505-33 = ""
2005505-34 = "Не может быть!"
2005505-35 = "Я вам доверяла, Сенсей... Я вам доверяла...!"
2005505-36 = "[s] «Успокойся, Юзу.»"
2005505-37 = ""
2005505-40 = "[ns3] «Все ведь одеты в костюмы из игры, правда?»\n[ns4] «Просто считай это косплей-фестивалем.»"
2005505-43 = "«Все»? Я вижу довольно много людей в обычной одежде..."
2005505-44 = "Д-Даже вы в обычном костюме, Сенсей!"
2005505-45 = "[s5] «Я косплею NPC.»\n[s6] «В конце концов, костюм — „официальная броня“ взрослого.»"
2005505-48 = "Е-Если бы я знала, что так будет, просто надела бы обычную одежду..."
2005505-49 = "Хотя не буду отрицать: этот костюм идеально подходит для VR-игр, но..."
2005505-50 = "[s] «А, похоже, начинается. Пойдём внутрь, Юзу!»"
2005505-51 = "Уа-а-а...!!"
2005505-53 = "С этого момента Юзу буквально приклеилась к моей спине."
2005505-55 = "Внутри площадки игрового турнира"
2005505-56 = "Вот ради чего вы пришли, народ! Время финала, и здесь становится жарко!"
2005505-57 = "А теперь поприветствуем наших претендентов на сцене."
2005505-58 = "Представляем... легендарный дуэт, который в рекордные сроки поднялся в рейтинге Simulion Quest!"
2005505-59 = "«UZQueen & Throne»! Аплодисменты, все!"
2005505-60 = ""
2005505-63 = ""
2005505-64 = "UZQueen...? Они только что сказали UZQueen, да?!"
2005505-65 = "Так она всё-таки решила участвовать! И посмотрите на этот наряд! От неё прямо веет мастерством!"
2005505-66 = "Но... что это вообще за стойка?"
2005505-67 = ""
2005505-69 = ""
2005505-70 = ""
2005505-72 = "Должно быть, она из той странной пары верхом, которая постоянно сметала боссов. Так это всё время была UZQueen?!"
2005505-73 = "Шанс увидеть UZQueen вживую за игрой... Я не пропущу ни секунды!"
2005505-74 = "Уа-а...! Сенсей, поза верхом не очень подходит для публики...!"
2005505-75 = "М-Мне так стыдно. Я почти не могу думать..."
2005505-76 = "Так я не могу сосредоточиться на игре..."
2005505-77 = "[s] «Юзу.»"
2005505-78 = "Д-Да?!"
2005505-79 = "[s] «Только сейчас представь, что мир Simulion Quest реален.»"
2005505-80 = "Н-Но..."
2005505-81 = "Если игровой мир реален, мы окажемся в опасной для жизни ситуации с обнажёнными мечами... Разве от такой мысли мне не станет ещё тревожнее?"
2005505-82 = "Это уже СЛИШКОМ сильное погружение..."
2005505-83 = ""
2005505-85 = ""
2005505-86 = "Значит, чтобы стать чемпионами, нам в итоге нужно победить UZQueen..."
2005505-87 = "Не верится, что UZQueen всё это время использовала эту странную стойку... Что делать?"
2005505-88 = "Забудьте про UZQueen! Я смотрю форумы... НИКТО понятия не имеет, как контрить стойку верхом!"
2005505-89 = "Не переживайте. У меня есть беспроигрышная стратегия."
2005505-90 = "Отложим UZQueen и посмотрим на Throne... Раз её напарник всего лишь обычный игрок, если сначала выбить его, у нас появится шанс победить!"
2005505-91 = "Зажжём!"
2005505-93 = "С-Сенсей! Осторожно!"
2005505-94 = "[ns] «Хм, почему они целятся в меня...?»"
2005505-95 = ""
2005505-97 = "(Если бы эта игра была реальностью...)"
2005505-98 = "(Мне не было бы неловко из-за этого костюма или взглядов окружающих...)"
2005505-99 = "(На чём я действительно сосредоточилась бы...)"
2005505-100 = "...Сенсей, берегитесь!!"
2005505-101 = ""
2005505-105 = "Ч-Что произошло...?"
2005505-106 = "За мгновение она нашла наши слабые места...?"
2005505-107 = ""
2005505-109 = ""
2005505-110 = "Какой поворот! Миг, вспышка — и UZQueen & Throne одерживают победу!"
2005505-111 = "В-Вы это видели? Прямо перед тем как атаковали Throne, UZQueen с невероятной скоростью ударила по слабым местам обоих...!"
2005505-112 = "Э-Это было так быстро, что я ничего не успел увидеть... Как такое вообще возможно? Можно повтор в замедлении?"
2005505-114 = "С-Сенсей. Вы в порядке...?"
2005505-115 = "[s] «Я в порядке...»"
2005505-116 = ""
2005505-119 = "[ns] «Важнее другое: как ты это сделала?»"
2005505-120 = "Я и сама толком не знаю..."
2005505-121 = "Наверное, я изменила свою реальность. Представила, что вам действительно угрожает опасность, и руки двинулись быстрее мыслей..."
2005505-122 = "Не успела я опомниться, как уже использовала их слабости."
2005505-123 = "[s] «Это была впечатляющая концентрация...»"
2005505-124 = "И всё же я рада. Теперь у нас наконец есть Virtual Boss!"
2005505-125 = ""
2005505-128 = ""
2005505-129 = ""
2005505-131 = "UZQueen, можешь ещё раз показать тот приём?"
2005505-132 = "...П-Пожалуйста, объясни по шагам! Я никогда не сталкивалась ни с чем подобным!"
2005505-133 = "Если хочешь, можешь даже ударить меня в реальности—"
2005505-134 = "М-Меня тоже! Я хочу, чтобы меня ещё раз ударили!"
2005505-135 = "У-Ударь и меня!"
2005505-136 = "О, меня, меня тоже ударь, UZQueen! Да!"
2005505-137 = "(Не могу отделаться от ощущения, что просьбы становятся немного странными...)"
2005505-138 = "Пожалуйста, UZQueen! Наступи на меня!"
2005505-139 = "Я хорошо заплачу, лишь бы UZQueen меня ударила! Уничтожь меня, королева!"
2005505-140 = "Э-Это нехорошо..."
2005505-141 = "Сенсей... Пожалуйста, помогите...!"
2005505-142 = "С-Сенсей!"
2005505-143 = ""
2005505-146 = ""
2005505-147 = "С-Сенсей!"
2005505-149 = "Мне удалось вывести Юзу, которая изо всех сил пыталась выбраться из толпы, за пределы площадки..."
