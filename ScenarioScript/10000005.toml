[translation]
10000005-57 = "#video;10000"
10000005-1 = "Пролог"
10000005-2 = "Во время моей обычной работы в Шале мне позвонили."
10000005-4 = "*звонок* *звонок*"
10000005-5 = "[s] «Хм? Кто бы это мог быть?»"
10000005-7 = ""
10000005-9 = "[ns] «Алло?»"
10000005-10 = "А! Ответили! Ч-что мне сказать?!"
10000005-11 = "Успокойтесь и глубоко вдохните, президент! Вдох...! Выдох!"
10000005-12 = "Х-хорошая идея. Ладно, тогда..."
10000005-13 = "Здравствуйте! Эм, простите, это случайно не..."
10000005-14 = "...номер [USERNAME], знаменитого «Сенсея», отвечающего за Шале?"
10000005-15 = "[s1] «Всё верно.»\n[s2] «Простите. Это не он.»"
10000005-16 = "А! Я так и знала! Значит, я была права!"
10000005-17 = "Стоп, я не это хотела сказать...!"
10000005-18 = "А?! Это не он?!"
10000005-19 = "Ух. Так и знала!"
10000005-20 = "Я сразу почувствовала неладное, когда они так неохотно давали мне номер!"
10000005-21 = "[s3] «Шучу. Да, это я.»"
10000005-22 = "Что?!"
10000005-23 = "Т-ты куда более озорной, чем я ожидала... но неважно!"
10000005-25 = "[s] «Так чему обязан удовольствием?»"
10000005-27 = "Кхм..."
10000005-28 = "Здравствуйте, [USERNAME], Сенсей из Шале! ☆"
10000005-29 = "Я Шизуко!"
10000005-30 = "Очень приятно! Я президент отдела организации фестивалей Объединённой академии Хяккияко..."
10000005-31 = "...а ещё идол Момоёдо!"
10000005-32 = "У меня есть веская причина связаться с тобой вот так."
10000005-33 = "Я хочу сердечно пригласить тебя на..."
10000005-34 = "...ежегодный Фестиваль цветения сакуры Хяккияко!"
10000005-35 = "[s4] «Хяккияко?»\n[s5] «Фестиваль...?»"
10000005-36 = "Да! Нам очень хотелось бы, чтобы знаменитый Сенсей из Шале пришёл и отпраздновал вместе с нами!"
10000005-37 = "Да! Нам очень хотелось бы, чтобы знаменитый Сенсей из Шале пришёл и отпраздновал вместе с нами!"
10000005-38 = "В этот раз мы попробуем множество новых вещей, чтобы сделать Фестиваль цветения сакуры Хяккияко лучшим за всю историю!"
10000005-39 = "Ах да, чуть не забыла: есть ещё кое-что, о чём я хочу поговорить с тобой лично, так что обязательно приходи!"
10000005-40 = "..."
10000005-41 = ""
10000005-42 = "Я-я сделала это, Пина! Получилось!"
10000005-43 = "Отличная работа, президент!"
10000005-46 = "Дзинь."
10000005-47 = "В мой почтовый ящик пришло изображение."
10000005-48 = "Эй, снова я. Отправляю тебе листовку, по которой будет легче найти место проведения."
10000005-49 = "Ну тогда до встречи, Сенсей!"
10000005-50 = "Буду ждать тебя в Момоёдо! Ня! ♪"
10000005-52 = "[ns] «Фестиваль цветения сакуры и Момоёдо...»"
10000005-55 = "Итак, я отправился на улицу Хяккияко, где проходил фестиваль."
10000005-59 = "Торговый квартал Хяккияко № 7"
10000005-60 = "Посетители фестиваля наслаждались атмосферой на переполненной улице."
10000005-61 = "Внезапно я услышал, как кто-то меня окликнул."
10000005-63 = "П-пропустите!"
10000005-64 = ""
10000005-66 = ""
10000005-67 = ""
10000005-68 = "Ай..."
10000005-69 = ""
10000005-70 = "*ахает*"
10000005-71 = ""
10000005-74 = ""
10000005-75 = "В-вы в порядке? Вы нигде не ушиблись?!"
10000005-76 = "[s6] «Я в порядке. Прости.»\n[s7] «Кажется, ты мне что-то сломала...»"
10000005-77 = ""
10000005-78 = "Фух. Какое облегчение!"
10000005-79 = ""
10000005-80 = "Правда?!"
10000005-81 = "[s8] «Да ладно, я шучу.»"
10000005-82 = ""
10000005-83 = "Т-ты шутил...? *наклоняет голову*"
10000005-84 = "Вернись сюда! Тебе не уйти!"
10000005-85 = ""
10000005-86 = "П-погоди, К-Каэдэ. *пыхтит* *задыхается* С-слишком быстро.."
10000005-87 = ""
10000005-88 = "А! Они уже догоняют!"
10000005-89 = ""
10000005-90 = "О-ой. Ч-что же Изуне делать?!"
10000005-91 = "[s] «У тебя проблемы?»"
10000005-92 = ""
10000005-93 = "А? Ох. Ну..."
10000005-94 = "Я её вижу! Вон там, Мимори!"
10000005-95 = ""
10000005-96 = ""
10000005-97 = ""
10000005-98 = "Бегите!"
10000005-101 = "После дерзкого побега нам удалось скрыться с места."
10000005-103 = ""
10000005-104 = "Фух... Здесь должно быть безопасно!"
10000005-105 = "Эм, спасибо, что помог Изуне!"
10000005-106 = "Кстати. А ты кто...?"
10000005-107 = "Ты не похож на кого-то из Хяккияко... Погоди, ты взрослый?#n*сглатывает*"
10000005-108 = "[s] «Я советник, отвечающий за Шале.»"
10000005-109 = "Ты представляешь Шале?"
10000005-110 = "О, если ты из Шале, тогда...!"
10000005-111 = "Изуна о тебе слышала!"
10000005-112 = "Говорят, есть удивительный человек по имени Сенсей, который помогает людям по всему Кивотосу!"
10000005-113 = "Ого... Тогда ты вроде как... ниндзя!"
10000005-114 = "[s] «Ниндзя?»"
10000005-115 = "Так ты и правда тот самый Сенсей. *виляет хвостом*"
10000005-116 = ""
10000005-117 = ""
10000005-118 = ""
10000005-120 = "Невероятно!"
10000005-121 = "Но что ты здесь делаешь?"
10000005-122 = "[s] «Пришёл посмотреть фестиваль.»"
10000005-123 = "О, понятно... Вот оно что! Тогда идеально!"
10000005-124 = ""
10000005-125 = ""
10000005-126 = "Тогда Изуна проведёт тебе экскурсию по фестивалю!"
10000005-129 = "Смотри туда! У того продавца есть кицунэ-сэмбэй — фирменное лакомство Хяккияко!"
10000005-131 = "А вон там! Они продают классику фестивалей — тануки-окономияки!"
10000005-132 = "А сакура-дайфуку тоже просто объедение!"
10000005-133 = "Хи-хи. Это настоящий фестивальный деликатес!"
10000005-134 = ""
10000005-137 = "О, и раз ты здесь впервые..."
10000005-138 = "...есть одна часть Фестиваля цветения сакуры Хяккияко, которую Изуна просто обязана тебе показать!"
10000005-139 = "Сюда! Вот сюда, Сенсей!"
10000005-144 = "Смотровая площадка Хяккияко"
10000005-148 = "[ns9] «Вид потрясающий.»\n[ns10] «Вот это огромное дерево.»"
10000005-149 = "Удивлён? Это гордость Хяккияко!"
10000005-150 = "Удивлён? Это гордость Хяккияко!"
10000005-151 = "Изуна обожает это место. Отсюда можно одновременно идеально увидеть и дерево, и улицы Хяккияко!"
10000005-152 = "Когда Изуна смотрит на улицы отсюда, ей всегда кажется, что сердце вот-вот выпрыгнет из груди!"
10000005-153 = "[s] «Выпрыгнет?»"
10000005-154 = "Ага! Потому что у Изуны есть мечта!"
10000005-155 = "Стать величайшей ниндзя, которую когда-либо видели эти улицы!"
10000005-156 = "Изуна стремится к этому каждый день!"
10000005-157 = "[s] «Н... ниндзя?»"
10000005-158 = "Эм...!"
10000005-159 = "Э-эм... Под ниндзя Изуна имеет в виду, эм...!"
10000005-160 = "[s11] «Я не совсем понимаю, почему именно ниндзя, но я верю в тебя.»\n[s12] «Мечта есть мечта, правда? Я буду за тебя болеть.»"
10000005-161 = "Как мы?"
10000005-162 = "Правда?"
10000005-163 = "Ты поддержишь мечту Изуны, Сенсей?"
10000005-164 = "Даже несмотря на то, что она..."
10000005-165 = "...хочет стать ниндзя?"
10000005-166 = "[s] «Работа Сенсея — поддерживать своих студентов.»"
10000005-167 = "...!"
10000005-168 = "Ого! Ты первый человек, который сказал что-то подобное!"
10000005-169 = "Хи-хи. Как здорово!"
10000005-170 = "Если Сенсей тоже поддерживает мечту Изуны, тогда...!"
10000005-171 = "Изуне нечего бояться, даже если она оступится!"
10000005-172 = "Да! Изуна будет стараться изо всех сил и станет великой ниндзя!"
10000005-173 = "Ой, тогда Изуне нельзя здесь задерживаться. Ей ещё нужно выполнить поручение клиента!"
10000005-174 = "Изуне пора спешить!"
10000005-175 = "Ладно, Сенсей. До встречи!"
10000005-176 = "Когда Изуна закончит поручение, давай вместе наслаждаться фестивалем!"
10000005-177 = ""
10000005-178 = "С этими словами Изуна исчезла так же внезапно, как появилась — словно порыв ветра."