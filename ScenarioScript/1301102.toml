[translation]
1301102-1 = "День геймера"
1301102-2 = "Департамент Разработки Игр Милленниума"
1301102-4 = "[ns1] «Я пришёл, потому что ты позвала, но...»\n[ns2] «Чем ты занимаешься?»"
1301102-5 = "О, добро пожаловать, Сенсей!"
1301102-6 = "О, добро пожаловать, Сенсей!"
1301102-7 = "Кхм! Сегодня у меня нет никаких планов, кроме..."
1301102-8 = "...учёбы."
1301102-9 = "[s] «Учёбы?»"
1301102-10 = "Ага. Я хочу подучиться, чтобы делать ещё более весёлые игры."
1301102-11 = "Самый важный вид учёбы для создания хорошей игры — это..."
1301102-12 = "...по-моему, попробовать как можно больше самых разных игр."
1301102-13 = "[s3] «Звучит логично.»\n[s4] «Ты просто говоришь это, потому что хочешь поиграть, да?»"
1301102-14 = "Правда? Именно!"
1301102-15 = "Э... Н-нет...!"
1301102-16 = "Вы должны хвалить своего очаровательного студента за его целеустремлённость!"
1301102-17 = "Знаю, знаю. Наш Отдел разработки игр специализируется исключительно на ретро-играх."
1301102-18 = "Но именно поэтому... нам и стоит расширять кругозор!"
1301102-19 = "Нужно изучать самые разные игровые жанры и выжимать максимум из нашей креативности!"
1301102-20 = "Так что, имея это в виду, вот игру, которую мы подготовили!"
1301102-21 = ""
1301102-22 = ""
1301102-23 = "[s] «Dark Spirits 4...?»"
1301102-24 = "Да! Это новейшая игра серии Spirits и новая вершина жанра souls-like!"
1301102-25 = "Главная особенность этой игры — её печально известная безумная сложность!"
1301102-26 = "А ещё серия Dark Spirits очень необычно рассказывает историю."
1301102-27 = "Вместо того чтобы сразу всё объяснять, она заставляет изучать записки и лор, разбросанные по миру, и самостоятельно складывать всё воедино..."
1301102-28 = "Игроку приходится внимательно следить за деталями и глубже вникать в сюжет и устройство мира..."
1301102-29 = "[s5] «Я...сно.»\n[s6] «Именно это увлекает игроков?»"
1301102-30 = "Ч-что это у вас за выражение лица?"
1301102-31 = "Проще показать, чем объяснять."
1301102-32 = ""
1301102-33 = "А теперь смотрите, Сенсей!"
1301102-34 = "О! Вы знаете её, Сенсей!"
1301102-35 = "Да! Определённо можно так сказать."
1301102-36 = ""
1301102-37 = "Сенсей! Смотрите внимательно, как я играю."
1301102-40 = "О, вот и первый враг!"
1301102-41 = "О-он выглядит очень сильным..."
1301102-42 = "Но я только что наполнила флягу с зельем у колодца, так что совсем не боюсь!"
1301102-43 = "Получай!"
1301102-45 = "*бух* *шлёп*"
1301102-47 = "ВЫ ПОГИБЛИ"
1301102-48 = "А-а-а-а?! Я у-умерла с одного удара?!"
1301102-49 = "Н-не может быть! Е-ещё раз! Ещё одна попытка!"
1301102-51 = "Хи-хи-хи... В этот раз всё будет иначе!"
1301102-52 = "Увернулась в последний момент! Есть! Ну как вам?!"
1301102-53 = "А?! Стойте, не хватило выносливости?!"
1301102-55 = "*бух* *шлёп*"
1301102-57 = "ВЫ ПОГИБЛИ"
1301102-58 = "Что?! Что это вообще такое?!"
1301102-59 = "Гр-р-р! Я не сдамся!"
1301102-61 = "ВЫ ПОГИБЛИ"
1301102-62 = "Ух, угх..."
1301102-63 = "[s] «Эй, Момои?»"
1301102-64 = "Сенсей. Сейчас я просто... дафния... Крохотная, ничтожная дафния..."
1301102-65 = "Дафния... которая даже первого босса победить не может..."
1301102-66 = "Это уже тридцать четвёртый гейм-овер..."
1301102-67 = "Я вообще не могу продвинуться! Как эта игра вообще работает?!"
1301102-68 = "Вот же гад... Вот это баланс! Он слишком сильный!"
1301102-69 = "[s] «Хм, нужна небольшая помощь?»"
1301102-70 = "...Сенсей, вы мне поможете?"
1301102-71 = "[s] «Не уверен, что сильно помогу, но попробую.»"
1301102-72 = "Угх... Просить кого-то другого пройти то, что я сама не могу..."
1301102-73 = "Это серьёзный удар по моей геймерской гордости..."
1301102-74 = "Но мне нужно пройти дальше, если я хочу увидеть продолжение истории..."
1301102-75 = ""
1301102-76 = "*вздох* П-похоже, выбора нет... Только этот момент, Сенсей! Только этот!"
1301102-77 = "Это ради исследования! Просто пройдите мне этот кусок, ладно?"
1301102-78 = "[s] «Ага, конечно.»"
1301102-82 = "*вжух* *бух*"
1301102-83 = "Ого..."
1301102-84 = "Ух ты! Вы и правда его победили! Потрясающе, Сенсей!"
1301102-85 = "[s7] «Да это пустяки. Легкотня.»\n[s8] «Теперь, Момои, играй сама...»"
1301102-86 = "О! Сенсей, смотрите вон туда, в угол! Там сундук с сокровищами!"
1301102-87 = "О! Сенсей, смотрите вон туда, в угол! Там сундук с сокровищами!"
1301102-88 = "[s] «А? О, и правда.»"
1301102-89 = "О! Новый враг! Этот трус стреляет в нас издалека!"
1301102-90 = "[s] «Ой?!»"
1301102-91 = "Сенсей! Победите его!"
1301102-93 = "Да, прямо там, Сенсей! В том тоннеле наверняка есть скрытый проход."
1301102-95 = "*хрум* *хрум* *ням* *ням* О, эти крекеры с икрой минтая такие вкусные. Хотите один, Сенсей?"
1301102-97 = "А? Сенсей! Осторожно! Новый босс! Наверное, у него сопротивление электричеству!"
1301102-100 = "(Прошло время, и наконец по экрану телевизора пополз длинный список финальных титров.)"
1301102-101 = "[ns] «В-всё закончилось...»"
1301102-102 = "Это было невероятно интересно! Какая увлекательная история! Потрясающе, Сенсей!"
1301102-103 = "[s] «Я ведь играл вместо Момои до самого конца...»"
1301102-104 = "Ух ты! Было весело!"
1301102-105 = "В игры весело играть одному, но вместе тоже весело!"
1301102-106 = "Хорошо тогда."
1301102-107 = "[s] «И что дальше?»"
1301102-108 = ""
1301102-109 = ""
1301102-110 = "Давайте прямо сейчас начнём второй заход, Сенсей!"
1301102-111 = "Кстати, во втором прохождении игра снимает тренировочные колёса!"
1301102-112 = "[s] «...»"
1301102-115 = "(Так, помогая Момои, я прошёл Dark Spirits 4 до самого конца.)"
