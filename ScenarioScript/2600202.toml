[translation]
2600202-1 = "Самая важная приправа"
2600202-2 = "Студенческая столовая Геенны №8"
2600202-3 = "(После сообщения от Юри я решил заглянуть в студенческую столовую Геенны.)"
2600202-4 = "Добро пожаловать, Сенсей!"
2600202-5 = "[s] «Ну вот. Я пришёл.»"
2600202-6 = "Спасибо, что согласился прийти сегодня."
2600202-7 = "Есть кое-что, что весь день не выходит у меня из головы."
2600202-8 = "Я никак не могу понять, сколько именно любви нужно положить в это блюдо."
2600202-9 = "Но теперь, когда ты здесь, я уверена, ответ обязательно найдётся!"
2600202-10 = "[s1] «Не знаю. Может, для этого уже поздновато.»\n[s2] «Разве в рецепте бывает „правильное“ количество любви?»"
2600202-11 = "Ну же! Можно хоть немного больше энтузиазма?!"
2600202-12 = "Ну же! Можно хоть немного больше энтузиазма?!"
2600202-13 = "Мы постоянно совершенствуемся и стараемся готовить ещё вкуснее."
2600202-14 = "Никто не тренируется в кулинарии усерднее, чем Клуб школьного питания Геенны!"
2600202-15 = "(После такого страстного заявления Юри я просто не мог ей отказать.)"
2600202-16 = "[s] «Ладно, но как ты собираешься определить нужное количество?»"
2600202-17 = "О! Я уже кое-что придумала."
2600202-18 = "Я приготовила три разных блюда — в каждом своё количество любви!"
2600202-19 = "[s3] «Ты готовила...?!»\n[s4] «Три?!»"
2600202-20 = "Ага. Они ждут нас на кухне."
2600202-21 = "Ага. Они ждут нас на кухне."
2600202-23 = "[s] «Только не говори, что этот взрыв был на кухне...»"
2600202-24 = "А? Я ничего не слышала."
2600202-25 = "Наверное, это у тебя живот заурчал — так не терпится попробовать вкусную еду, полную любви."
2600202-26 = "[s] «Хм. А я бы поклялся, что...»"
2600202-27 = "Хи-хи. Тогда начинаю! ♪"
2600202-29 = "Вот и первое блюдо!"
2600202-30 = ""
2600202-31 = "(Стоило Юри открыть крышку, как мне в нос ударил едкий, резкий запах.)"
2600202-32 = "(Внутри кастрюли извивалось что-то тёмное.)"
2600202-33 = "[s] «Просто из любопытства... что это вообще за блюдо?»"
2600202-34 = "А? Гамбас аль ахильо. Разве не видно?"
2600202-35 = "[s] «В-Вот оно как...»"
2600202-36 = "Любовь в этом блюде..."
2600202-37 = "Ну... она выражает мои чувства к тебе!"
2600202-38 = "Мне будет очень приятно, если ты его попробуешь!"
2600202-40 = "[s] «К-Как тут отказаться? Л-Ладно... была не была...»"
2600202-43 = "[s] «...!»"
2600202-44 = "О! Ну как тебе, Сенсей?"
2600202-45 = ""
2600202-46 = ""
2600202-49 = ""
2600202-50 = "[ns] «Гх!»"
2600202-51 = "(Сознание начинает меркнуть, а всё вокруг темнеет. Я едва удерживаюсь в сознании.)"
2600202-52 = ""
2600202-53 = "(Увидев сияющие глаза Юри, я не могу заставить себя раскритиковать её готовку.)"
2600202-54 = "[s5] «Ну, как бы сказать?»\n[s6] «О-определённо необычно!»"
2600202-55 = "Правда так думаешь?"
2600202-56 = "Правда так думаешь?"
2600202-57 = "И всё же я ожидала реакции посильнее."
2600202-58 = "Наверное, любви всё-таки было маловато. Я так и думала."
2600202-59 = "Обещаю, следующее блюдо будет просто переполнено любовью!"
2600202-60 = "[s] «Ещё больше, чем это...?»"
2600202-63 = "Сюда!"
2600202-64 = "На этот раз попробуем другую любовь. Не дружескую, а любовь, рождённую из глубокого уважения."
2600202-65 = "Сюрприз. Чесночный хлеб с супом из гамбаса."
2600202-66 = "[s] «Погоди. Чесночный хлеб вообще должен быть синим?»"
2600202-67 = "А разве нет?"
2600202-68 = "В любом случае, в прочитанной мной книге был отличный совет по подаче."
2600202-69 = "Там сказано, что чесночный хлеб будет вкуснее, если макать его в суп!"
2600202-70 = "Попробуй, Сенсей!"
2600202-71 = "[s7] «Макать блюдо Джури в другое блюдо Джури...»\n[s8] «Такое сочетание наверняка даст... интересный вкус.»"
2600202-74 = "[s] «Ну...! Была не была...!»"
2600202-77 = ""
2600202-78 = ""
2600202-81 = ""
2600202-82 = "Что такое, Сенсей?"
2600202-83 = "Хм. Раз ты молчишь, значит..."
2600202-84 = "...любви всё равно оказалось недостаточно?"
2600202-85 = "Тогда как насчёт этого?"
2600202-86 = "В третьем блюде я уже ничем не сдерживалась."
2600202-87 = "О-Оно наполнено всей моей п-пламенной, страстной любовью к тебе!"
2600202-88 = "Ой... К-Как же неловко..."
2600202-89 = ""
2600202-90 = "А? Сенсей? Ты меня слышишь?"
2600202-95 = "[ns] *ВЗДОХ*"
2600202-96 = "О. Ты очнулся."
2600202-97 = "[s] «Г-Где я...? А что стало с блюдом?»"
2600202-98 = "Наверное, ты ужасно устал, Сенсей."
2600202-99 = "Ты уснул, даже не успев доесть..."
2600202-100 = "[s] «Я?»"
2600202-101 = "Надеюсь, я не слишком тебя мучила, когда ты и так был уставшим."
2600202-102 = "[s9] «Нет, всё хорошо.»\n[s10] «Я всегда рад помочь, когда понадоблюсь.»"
2600202-103 = "Спасибо, Сенсей."
2600202-104 = "Спасибо, Сенсей."
2600202-105 = "Но всё равно не стоит так себя загонять."
2600202-106 = "Я слышала, что из-за занятости ты часто пропускаешь еду."
2600202-107 = "[s] «Так вот почему ты...?»"
2600202-108 = "*урчание*"
2600202-109 = "Ой. Сенсей, ты голоден?"
2600202-110 = "(Я вспомнил, что за весь день так толком и не поел.)"
2600202-111 = "Как удачно!"
2600202-112 = "[s] «Удачно?»"
2600202-113 = "Я подумала, что ты мог не наесться, раз уснул прямо посреди еды."
2600202-114 = ""
2600202-116 = "Поэтому на всякий случай упаковала все остатки и принесла сюда."
2600202-117 = "Не стесняйся! Налетай!"
2600202-118 = "[s] (Наверняка в медпункте есть лекарство для желудка...)"
2600202-120 = "[s] «Ну зачем было так стараться!»"
2600202-121 = "Ага! На этот раз ты будешь есть..."
2600202-123 = "(Затем я съел готовку Юри и узнал, насколько болезненной может быть любовь.)"
