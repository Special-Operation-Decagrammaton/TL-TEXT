[translation]
90101050-1 = "Эпизод 5;Записи страха"
90101050-2 = "Библиотека района Ширатори, читальный зал 3"
90101050-4 = ""
90101050-5 = "П-Простите. Я хотела найти газетную вырезку в читальном зале..."
90101050-6 = "Утреннюю газету от O/O не вырезали? Похоже, именно этого дня не хватает в альбоме."
90101050-7 = "Правда? Как странно. Я каждое утро вырезаю статьи, так что ничего не должно пропасть."
90101050-8 = "А... Теперь вспомнила."
90101050-9 = "В тот вечер пришёл кто-то из издательства и забрал газеты. Сказали, нужно внести исправление."
90101050-10 = "Они редко забирают уже выпущенные газеты, поэтому тот вечер я хорошо помню."
90101050-11 = "Понятно... А вы помните, чего касалось исправление?"
90101050-12 = "Нет. Мне платят за вырезки, а не за чтение... Простите. Статей было очень много, и я просто не помню."
90101050-13 = "Понятно. Спасибо за помощь."
90101050-14 = ""
90101050-16 = ""
90101050-19 = ""
90101050-20 = "(...Эффективное подавление информации.)"
90101050-21 = "(Вот почему большинство людей считало того странного птичьего монстра всего лишь глупой байкой.)"
90101050-22 = "(До недавнего времени я тоже была среди них...)"
90101050-24 = "Давайте уточним, Сенсей."
90101050-25 = "Эта лимитированная плюшевая игрушка по имени Перородзилла ожила из-за навязчивых желаний фанатов..."
90101050-26 = "...Затем он приблизился к Ц.Р. и был разбит в совместной операции с Шале и Валькирией?"
90101050-27 = "Знаете, в добытых нами записях Бюро безопасности Валькирии упоминалось крупное развёртывание сил."
90101050-28 = ""
90101050-29 = "(Раз Сенсей это подтвердил, значит, в тот день на побережье действительно напал монстр.)"
90101050-30 = "(Но кое-что меня беспокоит... Почему монстр вообще принял облик этой нелепой птицы?)"
90101050-31 = "(Казалось бы, городская легенда, которая живёт в сознании масс, должна быть ужасающей.)"
90101050-32 = "(Но глупая плюшевая игрушка, популярная только среди одержимых фанатов, едва не вызвала катастрофу в D.U...)"
90101050-33 = ""
90101050-35 = ""
90101050-36 = "...Что-то здесь не сходится."
90101050-37 = "(Нужно изучить историю этой плюшевой игрушки и всё, что её окружает.)"
90101050-38 = "(Но я ничего не могу найти. Соцсети цензурируются... и газеты тоже не помогают...)"
90101050-39 = "Вы ищете какую-то конкретную книгу?"
90101050-40 = ""
90101050-42 = ""
90101050-43 = "Нет. Не книгу..."
90101050-44 = "Я могу помочь вам с чем угодно. Всё-таки долг библиотекаря — помогать тем, кто ищет знания."
90101050-45 = ""
90101050-46 = "Конечно, здесь этого может и не быть..."
90101050-47 = ""
90101050-49 = ""
90101050-50 = "...но, возможно, это есть в НАШЕЙ библиотеке."
90101050-51 = "В вашей библиотеке...?"
90101050-52 = "А, позвольте представиться. Я Эндо Шимико."
90101050-53 = "Я работаю в Библиотечном комитете Тринити, но сегодня здесь ради мероприятия по обмену книгами."
90101050-54 = "Так чем я могу помочь?"
90101050-55 = "О, нет. Наверное, это слишком трудно найти..."
90101050-56 = "Я ищу статью от O/O. Но газету отозвали для исправлений, и теперь я нигде не могу найти эту публикацию..."
90101050-57 = "Отозванная газетная статья от O/O..."
90101050-58 = "Вы имеете в виду Неопознанный монстр появился в водах D.U.?"
90101050-59 = ""
90101050-61 = ""
90101050-62 = "Думаю, да. Вы помните, о чём там было?"
90101050-63 = "Да! По крайней мере, большую часть."
90101050-64 = "Это был рассказ, переданный в управление порта. Рыбак из D.U. заметил под поверхностью воды быстро движущуюся огромную тень."
90101050-65 = "Согласно сообщению, тень была размером с кита, но двигалась быстро, как марлин..."
90101050-67 = "После получения сообщения береговая охрана Валькирии смогла отогнать монстра обратно в море, но лишь ценой серьёзного ущерба. В операции они потеряли несколько вертолётов."
90101050-68 = "Монстр напоминал плюшевую игрушку Momo Friends Перородзилла. Он стрелял лазерами из глаз, будто герой недавнего фильма про монстров..."
90101050-69 = "А, ещё в статье говорилось, что эту плюшевую игрушку Momo Friends больше нельзя было купить."
90101050-70 = ""
90101050-71 = "Спасибо. Это очень помогло."
90101050-72 = "...Но удивительно. Не ожидала встретить библиотекаря, который помнит детали случайной газетной статьи."
90101050-73 = "У вас фотографическая память?"
90101050-74 = "Ахаха, да что вы! Просто статья была очень яркая, поэтому я её и запомнила."
90101050-75 = "К тому же о ней спрашивала вице-президент. Мы редко разговариваем, поэтому это выделялось."
90101050-76 = "Получается, происхождение этой Перородзиллы связано с довольно обычной историей. Не ожидала."
90101050-77 = "...Обычной?"
90101050-78 = "Да. Я изучала городскую легенду, встречающуюся только в даркнете. Думала, газета раскроет что-нибудь зловещее, но..."
90101050-79 = "Похоже, статья рассказывала лишь о типичных штампах фильмов про монстров и сообщала о снятой с производства плюшевой игрушке."
90101050-80 = "...Не знаю. Мы ведь не можем быть настолько уверены, правда?"
90101050-81 = "Вы хотите сказать, что где-то есть ещё доказательства?"
90101050-82 = "Нет, дело не в какой-то скрытой подоплёке всей истории..."
90101050-83 = "Я к тому, что фильм про монстров и плюшевая игрушка могут быть совсем не обычными для кого-то другого."
90101050-84 = "Когда я была ребёнком, я прочитала сказку о рыцарях, сражавшихся с драконом. Я верила, что всё это было на самом деле."
90101050-85 = "Когда стала старше, поняла, что это вымысел, но в детстве тот фантастический мир полностью поглотил моё воображение."
90101050-86 = "Может, для кого-то история о глупой плюшевой игрушке и обычном монстре ощущалась реальнее самой реальности?"
90101050-87 = "Городские легенды называются легендами именно потому, что их нельзя полностью объяснить или понять."
90101050-88 = ""
90101050-90 = ""
90101050-91 = ""
90101050-92 = "Вы... правы."
90101050-93 = "Если Лор может рождаться не только из страха, но и из других эмоций, тогда..."
90101050-94 = "Вы ищете что-нибудь ещё?"
90101050-95 = "Если позволите, мне нужно заняться расстановкой книг."
90101050-96 = "Эм, понимаю, что вопрос может прозвучать слишком личным..."
90101050-97 = "Но вам в последнее время нравилось какое-нибудь произведение? Я была бы благодарна за рекомендацию."
90101050-98 = "Что-то, что мне недавно понравилось? Ох, мне нравится столько всего. Как тут выбрать?"
90101050-99 = "Но если назвать что-то совершенно захватывающее и потрясающее..."
90101050-100 = ""
90101050-102 = ""
90101050-103 = "Вы слышали о Девочке-волшебнице тяжёлого калибра?"
90101050-105 = "Следующий эпизод;Люди порта 2"
