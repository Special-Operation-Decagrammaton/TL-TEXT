[translation]
90101050-1 = "Episódio 5;Registros Sobre Uma Anomalia"
90101050-2 = "Distrito Shiratori · Sala de Leitura da 3ª Biblioteca Municipal"
90101050-4 = ""
90101050-5 = "Com licença, estou procurando o arquivo encadernado de notícias..."
90101050-6 = "Parece que a edição matutina do jornal do dia O do mês O está faltando no fichário."
90101050-7 = "Ué? Estranho... Eu mesma organizo os recortes todas as manhãs, não deveria estar faltando nada..."
90101050-8 = "Ah, me lembrei agora!"
90101050-9 = "Houve um dia em que um funcionário do próprio jornal veio aqui recolher todos os exemplares, alegando \"erro factual gravíssimo na reportagem\"."
90101050-10 = "Provavelmente foi dessa data aí que sumiu. #nÉ bem raro recolherem uma tiragem inteira assim..."
90101050-11 = "Entendo... Você por acaso sabe qual era o tema daquela matéria?"
90101050-12 = "Sinto muito... Eu recorto e arquivo os cadernos, mas mal tenho tempo de ler o conteúdo."
90101050-13 = "Compreendo. Muito obrigada pela atenção."
90101050-14 = ""
90101050-16 = ""
90101050-19 = ""
90101050-20 = "(...Não há dúvida de que houve censura e controle de informação da imprensa)"
90101050-21 = "(É justamente por isso que, quando a criatura com aspecto de mascote estranho apareceu, a grande maioria tratou o fato como mero boato)"
90101050-22 = "(Eu mesma cheguei a pensar assim, mas...)"
90101050-24 = "P-peraí... Deixa eu ver se entendi o resumo da ópera do Sensei..."
90101050-25 = "Um bicho de pelúcia raro chamado \"Perorozilla\" se materializou em tamanho colossal pelo anseio dos fãs... #ne marchou em direção ao D.U.?"
90101050-26 = "E o senhor teve que derrotar a besta numa operação conjunta com a Valkyrie?!"
90101050-27 = "Pensando bem, nos arquivos do Departamento de Segurança da Valkyrie constava um envio maciço de tropas costeiras."
90101050-28 = ""
90101050-29 = "(O ataque do monstro gigante ao litoral naquele dia foi um fato consumado. O próprio Sensei deu seu testemunho.)"
90101050-30 = "(O que me intriga... é por que a aberração adotou a forma de um pássaro tão bobo e caricato)"
90101050-31 = "(Se fosse para nascer de uma lenda urbana temida pelos cidadãos, não deveria ter assumido uma forma aterrorizante?)"
90101050-32 = "(Como uma simples pelúcia cobiçada por colecionadores quase causou uma catástrofe sem precedentes no D.U....?)"
90101050-33 = ""
90101050-35 = ""
90101050-36 = "...É incompreensível."
90101050-37 = "(Preciso cruzar os dados daquela pelúcia com os registros históricos da época)"
90101050-38 = "(Mas nem nas redes sociais nem nos jornais sobrou qualquer rastro de informação...)"
90101050-39 = "Procurando algum livro em especial?"
90101050-40 = ""
90101050-42 = ""
90101050-43 = "Não, livros não..."
90101050-44 = "Se houver alguma informação que esteja buscando, posso ajudar! #nAfinal, auxiliar quem busca o conhecimento é o dever de [ruby=nós]uma bibliotecária[/ruby]."
90101050-45 = ""
90101050-46 = "Mesmo algo que não conste nos arquivos daqui..."
90101050-47 = ""
90101050-49 = ""
90101050-50 = "Pode ser que encontremos na nossa biblioteca central."
90101050-51 = "\"Na nossa\"...?"
90101050-52 = "Ah, que indelicadeza a minha, esqueci de me apresentar! Eu me chamo Shimiko Endo."
90101050-53 = "Faço parte do Comitê Bibliotecário de Trinity. #nHoje vim até aqui para uma feira de intercâmbio de acervo."
90101050-54 = "Em que posso ser útil?"
90101050-55 = "Agradeço, mas creio ser um material já indisponível."
90101050-56 = "Trata-se de uma matéria jornalística do dia O do mês O. #nA editora recolheu todas as cópias de circulação, não sobrou nada..."
90101050-57 = "A edição recolhida do dia O do mês O..."
90101050-58 = "Por acaso... não seria aquela reportagem sobre \"o surgimento de uma criatura marinha não identificada no litoral do D.U.\""
90101050-59 = ""
90101050-61 = ""
90101050-62 = "Essa mesma! Você conhece o teor da matéria?"
90101050-63 = "Sim! Lembro perfeitamente dos pontos principais."
90101050-64 = "Quem deu o primeiro alerta foi um pescador local. #nEle avistou uma sombra titânica se deslocando em alta velocidade sob as águas e acionou a Capitania dos Portos."
90101050-65 = "Segundo o relato, era um vulto gigantesco como uma baleia e veloz como um peixe-espada..."
90101050-67 = "A Polícia Marítima da Valkyrie conseguiu rechaçar o monstro de volta para alto-mar... #nmas o prejuízo foi imenso, com vários helicópteros abatidos na costa."
90101050-68 = "A criatura era idêntica ao \"Perorozilla\", um bicho de pelúcia da franquia MomoFriends. #nE assim como no filme lançado no ano passado, disparava feixes de luz pelos olhos—"
90101050-69 = "A propósito, parece que a pelúcia em questão se tornou uma raridade quase impossível de achar no mercado."
90101050-70 = ""
90101050-71 = "Muito obrigada. Suas informações foram valiosíssimas."
90101050-72 = "...Nunca imaginei que encontraria por puro acaso uma bibliotecária que se lembrasse do texto palavra por palavra."
90101050-73 = "Você decora tudo o que lê nos jornais...?"
90101050-74 = "Ahaha, não é bem assim! É que achei a notícia tão fascinante que acabou ficando gravada na memória."
90101050-75 = "E também porque a nossa Vice-Presidente, com quem quase nunca conversava, me pediu pessoalmente para procurar esse artigo do nada."
90101050-76 = "...Pelo que você descreveu, a origem do \"Perorozilla\" parece bastante corriqueira."
90101050-77 = "...[ruby=・]C[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby][ruby=・]r[/ruby][ruby=・]i[/ruby][ruby=・]q[/ruby][ruby=・]u[/ruby][ruby=・]e[/ruby][ruby=・]i[/ruby][ruby=・]r[/ruby][ruby=・]a[/ruby], você diz?"
90101050-78 = "Disseram-me que o embrião da lenda urbana que abalou a internet estava registrado num jornal de bairro, por isso vim conferir, mas..."
90101050-79 = "No fundo, o texto só falava de um enredo de filme de monstros e do fim de linha de um brinquedo de pelúcia."
90101050-80 = "...Será que dá para resumir tudo a \"apenas isso\"?"
90101050-81 = "...Está dizendo que há algo mais profundo que ainda não veio à tona?"
90101050-82 = "Não, não é bem nesse sentido..."
90101050-83 = "Um filme de monstros e um bicho de pelúcia. Talvez, para alguém em especial, isso não tivesse nada de [ruby=・]c[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby][ruby=・]r[/ruby][ruby=・]i[/ruby][ruby=・]q[/ruby][ruby=・]u[/ruby][ruby=・]e[/ruby][ruby=・]i[/ruby][ruby=・]r[/ruby][ruby=・]o[/ruby]."
90101050-84 = "Quando eu era pequena e lia romances de cavalaria enfrentando dragões cuspidor de fogo... eu acreditava piamente que aquilo acontecia de verdade em algum lugar."
90101050-85 = "Conforme cresci, entendi que eram apenas contos de fadas... #nmas enquanto eu estava com o livro aberto nas mãos, aquele mundo era real para mim."
90101050-86 = "Sendo assim, tanto a pelúcia quanto a história do filme... #npara alguém, eram um universo que existia de corpo e alma."
90101050-87 = "Uma lenda urbana... só é chamada de lenda porque escapa à nossa compreensão racional."
90101050-88 = ""
90101050-90 = ""
90101050-91 = ""
90101050-92 = "...Talvez você tenha razão."
90101050-93 = "Se o fenômeno Lore pode brotar de sentimentos além do medo primitivo... isso explicaria muita coisa."
90101050-94 = "Gostaria de procurar mais alguma obra?"
90101050-95 = "Se não houver mais nada, eu vou—"
90101050-96 = "Com licença... posso lhe pedir uma gentileza?"
90101050-97 = "Poderia me indicar uma obra que tenha lido recentemente e que recomende?"
90101050-98 = "Uma recomendação minha? #nHummm... escolher só uma é uma tarefa tão difícil!"
90101050-99 = "Vejamos... uma história que me prendeu do início ao fim sem piscar..."
90101050-100 = ""
90101050-102 = ""
90101050-103 = "—Você já ouviu falar da saga 『Garota Mágica Heavy Caliber』?"
90101050-105 = "A Seguir;Gente do Porto (2)"
