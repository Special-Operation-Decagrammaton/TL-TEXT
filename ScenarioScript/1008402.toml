[translation]
1008402-1 = "Тайный поход в горы"
1008402-6 = "На выходных я отправился в горы на освежающую прогулку..."
1008402-7 = ""
1008402-10 = ""
1008402-12 = "И прямо у начала тропы столкнулся с Котамой."
1008402-13 = "[s] «Котама?»"
1008402-14 = ""
1008402-16 = ""
1008402-17 = "О."
1008402-18 = "П-Почему вы здесь, Сенсей?"
1008402-19 = "То есть... Я здесь, чтобы... эм..."
1008402-20 = ""
1008402-22 = ""
1008402-23 = ""
1008402-24 = ""
1008402-25 = "Какой прекрасный день."
1008402-26 = "[s] «Да, погода чудесная.»"
1008402-28 = "[ns1] «Что привело тебя в горы?»\n[ns2] «Не ожидал увидеть тебя вне клубной комнаты.»"
1008402-31 = "Ну, видите ли…"
1008402-32 = "В качестве новогоднего обещания я решила стать активнее."
1008402-33 = "Поэтому решила начать с похода на эту гору!"
1008402-34 = "[s] «...И для похода тебе нужен этот огромный диктофон?»"
1008402-35 = "Это вовсе не диктофон!"
1008402-36 = "Это многофункциональное электронное записывающее устройство, которое улавливает окружающие звуки поблизости."
1008402-37 = "[s] «То есть диктофон.»"
1008402-38 = ""
1008402-40 = ""
1008402-41 = ""
1008402-42 = "...Не могу поверить, что меня снова раскусили. Вы правы."
1008402-43 = "На самом деле я пришла сюда записывать откровенные разговоры пар, которые ходят в походы."
1008402-44 = "[s] «...Что именно ты называешь откровенными?»"
1008402-45 = ""
1008402-47 = ""
1008402-48 = "Конечно! В ходе тщательного исследования я выяснила, что горы — популярное место для свиданий."
1008402-49 = "Простор и низкая плотность людей создают атмосферу уединения и приватности, а физическая и моральная нагрузка заставляет пары полагаться друг на друга."
1008402-50 = "По мере того как поход сближает их, влюблённые начинают говорить милые вещи, которые обычно не произнесли бы вслух."
1008402-51 = "А среди горных кустов буду прятаться я, готовая записать каждый смешок и тайный шёпот."
1008402-52 = "[s] «А потом тебя посадят за незаконную прослушку.»"
1008402-53 = "Я так и знала, что вы скажете что-то подобное."
1008402-54 = "Но я уже добралась сюда. Не могу уйти без результатов."
1008402-55 = "Хотя бы позвольте мне записать ваш голос, Сенсей—"
1008402-56 = "[s] «(Какой смысл пытаться действовать скрытно, если ты вслух признаёшься в преступлении?)»"
1008402-58 = "[ns] «Раз уж мы всё равно у горы, почему бы не сходить в поход?»"
1008402-59 = "Мм... Я не особо люблю походы..."
1008402-60 = "Но, полагаю, у начала тропы я никаких пикантных разговоров не поймаю."
1008402-61 = "Давайте прочешем гору в поисках романтичного места, где пары начнут сюсюкаться друг с другом."
1008402-62 = "Если повезёт, я даже запишу тяжёлое дыхание Сенсея после нашего напряжённого подъёма."
1008402-63 = "[s] «И для чего именно ты собираешься это использовать?!»"
1008402-64 = "Хи-хи. Секрет."
1008402-65 = ""
1008402-67 = ""
1008402-68 = "Ну что, начнём наше путешествие?"
1008402-74 = "Примерно через тридцать минут..."
1008402-79 = "*тяжело дышит* *хрипит*... Странно..."
1008402-80 = "На указателе у начала тропы было написано, что маршрут для новичков..."
1008402-81 = "Мы ещё даже половину не прошли, а я уже *хрип* выдохлась."
1008402-82 = "Я хотела бы официально потребовать пересмотра информационных табличек на этой горе."
1008402-83 = "[s] «Котама, ты вообще когда-нибудь раньше ходила в поход?»"
1008402-84 = "Конечно нет."
1008402-85 = "Но я думала, что хотя бы маршрут для новичков осилю."
1008402-86 = "[s] «Дальше легче не станет.»"
1008402-87 = ""
1008402-90 = "[ns] «Вот, дай руку. Я помогу.»"
1008402-91 = ""
1008402-93 = ""
1008402-94 = "*кашель*... Спасибо... *тяжело дышит*"
1008402-95 = ""
1008402-97 = ""
1008402-99 = ""
1008402-100 = ""
1008402-101 = "У вас очень тёплые руки, Сенсей."
1008402-102 = "И пахнут довольно приятно."
1008402-103 = "[s] «Спасибо. Я пользуюсь мылом.»"
1008402-104 = "Хм. Я никогда особо не задумывалась о таких вещах, как то, каким мылом пользуются люди."
1008402-105 = "Обычно я зацикливаюсь на голосах. Я совсем не думала о физических ощущениях вроде запаха или тепла тела."
1008402-106 = "Это настоящая сокровищница новых ощущений!"
1008402-107 = ""
1008402-109 = ""
1008402-112 = "А физическая и моральная нагрузка заставляет пары полагаться друг на друга..."
1008402-113 = "По мере того как поход сближает их, влюблённые начинают говорить милые вещи, которые обычно не произнесли бы вслух."
1008402-114 = ""
1008402-118 = "...!"
1008402-119 = "[s] «С тобой всё хорошо?»"
1008402-120 = "Я пришла сюда записывать откровенные разговоры пар, а в итоге сама начала говорить откровенно..."
1008402-121 = "Наверное, поход довёл меня до бреда."
1008402-122 = ""
1008402-124 = ""
1008402-125 = "П-Просто забудьте всё, что я сказала!"
1008402-126 = ""
1008402-128 = ""
1008402-132 = "Котама помчалась вниз по склону быстрее, чем двигалась за весь день. Через считанные секунды она исчезла из виду."
