[translation]
13360-1 = "Эпизод 36;Тетрадь"
13360-2 = ""
13360-3 = ""
13360-5 = ""
13360-6 = "Э-Это хоть что-нибудь дало?"
13360-7 = "Думаю, да! Она перестала двигаться!"
13360-8 = "И эта странная масса молний тоже исчезает!"
13360-9 = "Мы победили? Хошино теперь вернётся в норму?"
13360-10 = ""
13360-12 = ""
13360-13 = "Да! Может, если—"
13360-14 = "Не вернётся. Это невозможно."
13360-15 = ""
13360-17 = ""
13360-18 = "Н-Невозможно?"
13360-19 = "Да, невозможно. Она уже вне нашей досягаемости. Вернуть её было бы сродни воскрешению мёртвого. Ужас обратил её."
13360-20 = "Как когда-то меня."
13360-21 = "Н-Но тогда... значит... ты пришла сюда, чтобы...?"
13360-22 = "Да. Моё предназначение здесь — спасти каждого из вас."
13360-23 = ""
13360-25 = ""
13360-26 = ""
13360-27 = "Я должна разрушить нимб Хошино."
13360-28 = "Что?!"
13360-29 = "Если этого не сделать, та... сущность внутри Хошино проявится полностью. Этот мир будет уничтожен."
13360-30 = "Но... Хошино..."
13360-31 = "...тоже этого хочет. Именно так произошло в моём мире."
13360-35 = ""
13360-36 = "События этого мира могли отклониться от моих, но бесспорно одно: такой финал — судьба Сунаоками Широко."
13360-37 = "Но ты ведь не хотела этого делать даже в своём мире."
13360-38 = "..."
13360-39 = ""
13360-41 = ""
13360-42 = ""
13360-43 = ""
13360-44 = ""
13360-45 = "[ns] «Помоги нам, Широко. Неужели совсем нет другого способа?»"
13360-46 = "Другого способа..."
13360-47 = "Способ, способ... Я терпела одну неудачу за другой, снова и снова, разыскивая этот неуловимый «способ»..."
13360-48 = ""
13360-50 = ""
13360-51 = "Постой. Что-то отличается."
13360-52 = "На груди Хошино..."
13360-56 = "Я никогда не наблюдала такого отклонения... Там что-то есть, но... без материальной формы... Оно ещё не проявилось."
13360-57 = "Это..."
13360-58 = "О... Это..."
13360-59 = "Разве это... не похоже немного на тетрадь?"
13360-60 = "Ах!"
13360-64 = "[ns] «Это... тетрадь Юмэ.»"
13360-69 = "Я..."
13360-70 = "Тетрадь Юмэ... Где..."
13360-71 = "...Юмэ..."
13360-72 = ""
13360-79 = "[ns1] «Хошино всё ещё ищет по Пустыне Абидос.»\n[ns2] «Она всё ещё ищет тетрадь Юме.»"
13360-82 = "..."
13360-83 = ""
13360-85 = ""
13360-86 = "...Хошино."
13360-87 = "Наверное, она..."
13360-88 = ""
13360-90 = ""
13360-91 = ""
13360-92 = "Да. Ужас ещё не полностью захватил Хошино. Пока нет."
13360-93 = "Едва-едва... но эта тетрадь сдерживает проявление."
13360-94 = "[s3] «Значит, это наш последний шанс.»\n[s4] «Нужно, чтобы Хошино услышала наши слова!»"
13360-97 = "..."
13360-102 = "—!!"
13360-103 = "О-Она снова двигается...!"
13360-105 = "...Ситуация проанализирована."
13360-106 = "Плана...?"
13360-107 = "Решение найдено."
13360-108 = ""
13360-112 = "Я определила возможный способ связаться с Хошино до полного обращения её Мистики."
13360-113 = "К-Как?!"
13360-114 = "Разгон. Используя мощность Ковчега Шиттим, мы создадим псевдо-Трон Нарам-Сина."
13360-115 = "Ч-Что? У Ковчега Шиттим нет такой силы! Без Ковчега мы не сможем!"
13360-116 = "...Я завершила анализ способностей Подземного жителя."
13360-118 = "Хаотическое пространство, где измерения, время, существование и несуществование смешаны вместе и никогда не приходят в устойчивое состояние... Если создать нечто подобное..."
13360-119 = "Пусть ненадолго, но мы сможем установить точку контакта с Хошино."
13360-120 = "Н-Но... это слишком опасно..."
13360-121 = "Да. Именно поэтому я верну тебе 99% вычислительных ресурсов."
13360-122 = "После этого я войду в состояние отключённого сознания."
13360-123 = "О-Отключённого сознания?"
13360-124 = "Да. Состояние, близкое к смерти, позволит мне погрузиться в глубины Ковчега Шиттим и создать виртуальное хаотическое пространство."
13360-125 = "Н-Но... Плана... если ты не вернёшься..."
13360-126 = "Я понимаю. Эту часть необходимо скрыть от Сенсея."
13360-127 = "Однако..."
13360-128 = "Арона... Перед началом у меня есть просьба."
13360-129 = "Да, Плана? Что угодно!"
13360-130 = "Возьми... меня за руку..."
13360-131 = "Взять... тебя за руку?"
13360-132 = "Да. Мне немного... страшно."
13360-133 = ""
13360-135 = ""
13360-136 = ""
13360-138 = "Да! Да! Навсегда! Я буду держать тебя за руку всегда-всегда! Не отпущу!"
13360-139 = "Спасибо. Арона..."
13360-142 = "[ns] Выслушать объяснение Ароны."
13360-146 = "[ns] Передать подробности остальным."
13360-147 = "Сенсею... нужно каким-то образом физически коснуться Хошино..."
13360-148 = "Да. Точнее, Ковчег Шиттим Сенсея должен соприкоснуться с этой тетрадью..."
13360-149 = "Э-Эм... Для этого придётся подойти очень близко."
13360-150 = "Чтобы хоть надеяться на успех, нужно обездвижить Хошино."
13360-151 = "...Поняла. Остановить Хошино, затем установить соединение с тетрадью. Принято."
13360-153 = "Я тоже буду выполнять ваши команды, Сенсей."
13360-154 = "Но только мы... как...?"
13360-155 = "...Я помогу."
13360-156 = ""
13360-158 = ""
13360-159 = "[ns] «Хина!! Ты в порядке?! В твоём состоянии—»"
13360-160 = "Пара царапин. Я понимаю, что поставлено на кон, и времени нет. Пойдём."
13360-161 = "..."
13360-162 = "Ещё одна Сунаоками Широко. Та, которой Сенсей помогал в прошлый раз? Есть проблемы?"
13360-163 = "...Нет."
13360-164 = "Если собираемся действовать, нужно действовать сейчас! Молнии снова усиливаются!"
13360-165 = "Да. Сейчас или никогда. Пошли."
