[translation]
13360-1 = "Episódio 36;O Caderno"
13360-6 = "Conseguimos...?"
13360-7 = "Ela parou de se mexer!"
13360-8 = "Os raios também estão desaparecendo!"
13360-9 = "Com isso, a Hoshino-senpai vai voltar ao normal, né?"
13360-13 = "Nn.#nSe continuar assim, com certeza—"
13360-14 = "Não, não vai."
13360-18 = "P-Por que diz isso...?"
13360-19 = "Uma vez que ocorreu a inversão, não há mais volta.#nSeria como trazer um morto de volta à vida."
13360-20 = "Assim como eu estou agora."
13360-21 = "Mas, então..."
13360-22 = "O motivo de eu ter vindo aqui é destruir o Halo da Hoshino-senpai."
13360-27 = "Se eu não fizer isso, não poderei salvar vocês."
13360-28 = "Hã?"
13360-29 = "Se não agirmos rápido, \"aquilo\" que a Hoshino-senpai invocou vai se manifestar e destruir o mundo.#n— Assim como aconteceu no meu."
13360-30 = "Mas se você destruir o Halo dela..."
13360-31 = "...A Senpai já devia estar preparada para isso.#nAssim como ela nos pediu antes."
13360-36 = "É um caminho diferente do que eu trilhei, mas... no fim, o destino era acabar assim."
13360-37 = "...Não.#nEstar preparada é uma coisa, desejar isso é outra. Com você também não é assim?"
13360-38 = "..."
13360-45 = "[ns] \"Eu quero salvá-la de qualquer jeito... Não existe nenhum método?\""
13360-46 = "Um método..."
13360-47 = "...O que alguém como eu, que só falhou até hoje, poderia fazer?"
13360-51 = "Esperem."
13360-52 = "Tem alguma coisa no peito da Hoshino-senpai..."
13360-56 = "...Nunca vi isso antes.#nAinda não tomou uma forma definida...?"
13360-57 = "Nn..."
13360-58 = "Será que...!"
13360-59 = "Não parece ter o formato de... um caderno?"
13360-60 = "...!"
13360-64 = "[ns] \"Será que é o da Yume...?\""
13360-69 = "Eu..."
13360-70 = "O caderno... Onde está o caderno..."
13360-71 = "...Senpai."
13360-79 = "[ns1] \"A Hoshino ainda está vagando pelo deserto.\"\n[ns2] \"...Para encontrar o caderno da Yume.\""
13360-82 = "..."
13360-86 = "...Hoshino-senpai."
13360-87 = "..."
13360-92 = "A Hoshino-senpai ainda não passou pela inversão completa."
13360-93 = "...Provavelmente, a existência daquele caderno está servindo como sua última âncora."
13360-94 = "[s3] \"Ou seja, ainda temos uma chance, certo?\"\n[s4] \"...Precisamos dizer para a Hoshino!\""
13360-97 = "..."
13360-102 = "—!"
13360-103 = "E-Ela começou a se mexer de novo!"
13360-105 = "...Situação confirmada."
13360-106 = "Plana-chan...?"
13360-107 = "Pesquisando método."
13360-112 = "...Parece possível estabelecer contato antes que a \"Mística\" da Hoshino-san sofra inversão completa."
13360-113 = "C-Como...?"
13360-114 = "Overclock, Arona-senpai.#nUsando o poder do \"Baú de Shittim\", vou gerar um \"Trono de Naram-Sin\" simulado."
13360-115 = "Quê?! Aquilo só foi possível porque tínhamos a \"Arca\"...#nSó com o poder do Baú de Shittim..."
13360-116 = "Há pouco, ao analisar a habilidade do \"Morador do Subterrâneo\"..."
13360-118 = "Se conseguirmos criar uma condição semelhante ao \"Domínio do Caos\",#nonde dimensão, tempo e existência se misturam sem definição..."
13360-119 = "Constatei que há a possibilidade de nossa voz alcançar a Hoshino-san."
13360-120 = "M-Mas, com o nosso poder atual..."
13360-121 = "Afirmativo.#nPor isso, devolverei agora 99% dos recursos de processamento à Senpai."
13360-122 = "E eu entrarei em modo de hibernação a partir de agora."
13360-123 = "M-Modo de hibernação...?"
13360-124 = "Sim.#nVou mergulhar no Baú de Shittim e construir o Domínio do Caos."
13360-125 = "M-Mas e se acontecer alguma coisa com você, Plana-chan...?!"
13360-126 = "Por favor, mantenha isso em segredo do Sensei."
13360-127 = "Mas isso...!"
13360-128 = "A execução começará em breve.#n...Senpai, poderia atender a um pedido meu?"
13360-129 = "Pode pedir o que quiser, Plana-chan."
13360-130 = "...Quero que segure a minha mão."
13360-131 = "A sua mão...?"
13360-132 = "...Porque estou com um pouco de medo."
13360-138 = "É claro!#nNão vou soltar de jeito nenhum até você voltar, Plana-chan!"
13360-139 = "Obrigada... Arona-senpai."
13360-142 = "[ns] Arona me explicou o método."
13360-146 = "[ns] Compartilhei o plano com todas."
13360-147 = "Precisamos tocar diretamente na Hoshino-senpai..."
13360-148 = "Para ser exata, aproximar o \"Baú de Shittim\" do caderno."
13360-149 = "De qualquer forma, vamos ter que chegar perto da Senpai..."
13360-150 = "Primeiro, precisamos parar os movimentos da Hoshino-senpai."
13360-151 = "...Entendido."
13360-153 = "Sensei, me dê ordens também."
13360-154 = "Será que conseguimos só nós mesmas...?"
13360-155 = "...Eu também vou ajudar."
13360-159 = "[ns] \"Hina, você está bem fisicamente?!\""
13360-160 = "Sim, estou a par da situação.#nVamos agir imediatamente."
13360-161 = "..."
13360-162 = "Então você é a outra Shiroko Sunaookami.#n...Algum problema?"
13360-163 = "...Não?"
13360-164 = "De qualquer forma, vamos nos apressar.#nOs raios estão ficando mais fortes de novo!"
13360-165 = "Nn, esta é a nossa última chance."
