[translation]
33030-1 = "Episódio 3;Post-mortem (3)"
33030-2 = "Trinity - Prisão"
33030-5 = "Achei que a gente não fosse mais se ver."
33030-6 = "...Ora, essa. Com a relação que eu e você temos, Mika-san?"
33030-7 = "Fufu, pensando bem, é verdade. Afinal, somos amigas de infância, né?"
33030-8 = "..."
33030-9 = "...E então, por que veio até aqui? Se for para me interrogar, já fizeram isso até eu cansar, viu?"
33030-10 = "Se a Nagi-chan veio pessoalmente, quer dizer que tem algum outro assunto importante?"
33030-11 = "..."
33030-12 = "Sobre o \"Esquadrão Arius\"..."
33030-13 = "Uma unidade de forças especiais organizada em segredo pela presidente do conselho estudantil de Arius."
33030-14 = "É só isso que você quer saber? Eu já falei sobre isso durante o interrogatório, lembra?"
33030-15 = "Desde como começou o meu contato com Arius até a formação dos membros do Esquadrão Arius. Tenho certeza de que contei tudo o que eu sabia."
33030-16 = "...Sim. Eu também confirmei isso."
33030-17 = "E aí? Vai dizer que acha que ainda estou escondendo alguma coisa? Que tal tentar arrancar minhas unhas pra testar? Como é mesmo o nome, Irmandade? Usando aquele jeitinho de certas pessoas por aí."
33030-18 = "...Não era a Irmandade, e sim o método da antiga \"Congregação dos Santos\". Além do mais, não permitimos mais métodos tão bárbaros."
33030-19 = "Ahaha, eu só falei por falar. Eu sei muito bem, a doce e gentil Nagi-chan não tem estômago pra essas coisas, né?"
33030-20 = "..."
33030-21 = "...Sei que é estranho vindo de mim, mas já não tanto faz o que acontece com Arius?"
33030-22 = "Agora que perderam o meu apoio nos bastidores, tanto o armamento quanto os suprimentos de Arius já devem estar se esgotando."
33030-23 = "O \"Esquadrão\" ainda está por aí, mas mesmo somando o resto das forças da Filial Arius, se o Comitê de Justiça entrar em ação, dão conta do recado, não dão?"
33030-24 = "...Sim, já avaliamos essa questão. Pelo menos na etapa atual do Tratado do Éden, a Filial Arius de agora não representa um grande fator de risco."
33030-25 = "Pois é, né? Eu também acho. ...Falando nisso, me perguntaram no interrogatório também, mas até o fim eu não descobri nada sobre o distrito autônomo de Arius."
33030-26 = "Quem sabe direitinho como entrar no distrito autônomo... provavelmente é só a líder do \"Esquadrão\", a Saori."
33030-27 = "Se quer saber sobre isso, que tal ameaçar um pouquinho a Azusa-chan e perguntar pra ela? Por mais que seja uma traidora, ela fazia parte daquilo, então deve saber de alguma coisa, não?"
33030-28 = "Isso é que, bem..."
33030-29 = "...? Ah, aah, entendi. Você está toda hesitante assim por acaso por causa daquilo, Nagi-chan?"
33030-30 = "Como você foi malvada com o Sensei [USERNAME], agora fica um clima chato de pressionar a Azusa-chan com perguntas sendo que ela está sob a tutela da Schale?"
33030-31 = "Bom, realmente, se você tentasse fazer algo assim, o Sensei com certeza tentaria proteger a Azusa-chan. Não que ele fosse tratar você mal por isso, Nagi-chan."
33030-32 = "..."
33030-33 = "Essa cara... Nagi-chan, você não se encontrou com o Sensei desde aquela vez, né?"
33030-34 = "Depois de fazer algo tão horrível, não tem nem cara pra aparecer na frente dele... é isso? Aha, você também é mesmo uma garota na puberdade, hein, Nagi-chan."
33030-35 = "...Bom, nisso eu também estou na mesma."
33030-36 = "Sabe, o Sensei... vem até aqui várias e várias vezes tentando falar comigo. E dá um belo trabalho recusar toda vez."
33030-37 = "Eu já estou presa aqui mesmo, então ele bem que podia usar a autoridade da Schale ou o que fosse pra me obrigar a sair e atendê-lo, não acha?"
33030-38 = "...Bom, ele não é esse tipo de pessoa. Você também sabe, né, Nagi-chan? Que eu vazei várias informações pro Sensei pra tentar deixá-lo confuso... Se o Sensei tivesse nos traído com aquilo, a história teria sido bem mais simples."
33030-39 = "Ou, mesmo que não traísse, se ele tivesse acreditado em tudo o que eu dizia, ou acreditado em tudo o que você dizia, Nagi-chan... tudo teria tomado um rumo bem mais fácil de entender. Teria sido muito, muito mais fácil de agir."
33030-40 = "Pois é. Se ele tivesse pelo menos repassado direto pra você tudo o que eu falei... provavelmente uma hora dessas eu estaria recebendo o Sensei aqui de cabeça erguida e com um sorriso no rosto."
33030-41 = "..."
33030-42 = "...Ei, Nagi-chan. Dependendo do ponto de vista, no fim das contas não deu tudo certo?"
33030-43 = "A \"traidora de Trinity\" foi capturada assim. Arius não é mais uma ameaça."
33030-44 = "Agora, contanto que o Tratado do Éden seja assinado, a paz que você tanto desejava vai se tornar realidade, Nagi-chan."
33030-45 = "Final feliz, que maravilha, tudo acabou bem."
33030-46 = "..."
33030-47 = "Nada acabou bem..."
33030-48 = "O que há de bom nesta situação...? Você, Mika-san, sendo a traidora..."
33030-49 = "Por que tentou destruir a minha auréola?"
33030-51 = "..."
33030-52 = "...Por quê? É porque você odeia Gehenna? Foi por esse motivo que tentou fazer aquilo comigo...?"
33030-53 = "E o caso da Seia-san também. Por quê, como pôde...?"
33030-54 = "..."
33030-55 = "Naquela ocasião, quando soube que a Seia-san havia morrido..."
33030-56 = "Senti choque e pavor... e, ao mesmo tempo, pensei: \"Com certeza a próxima sou eu\"."
33030-57 = "A Seia-san, que era a mais sábia entre nós e ainda possuía a arma dos sonhos proféticos... Em certo sentido, é compreensível que atacassem primeiro a pessoa mais perigosa de Trinity."
33030-58 = "E como você, Mika-san, em termos políticos é basicamente... daquele jeito... então pensei que, sem dúvida, a próxima seria eu..."
33030-59 = "...Por acaso você acabou de falar mal de mim?"
33030-60 = "Por isso, se algo acontecesse comigo... eu pretendia confiar todo o resto a você, Mika-san."
33030-61 = "Então, antes disso, antes que você acabasse ficando sozinha, Mika-san... eu queria encontrar o culpado. Ainda mais porque eu jamais iria querer que até você se machucasse, Mika-san..."
33030-63 = "Quem poderia ter sido...? Gehenna? O Conselho Estudantil Geral? Ou seria aquela Big Sister da Millennium? A ditadora de Red Winter? Aquela monarca sombria de Shanhaijing...?"
33030-64 = "Eu só conseguia pensar em quem seria o traidor, o tempo todo... Não podia ser, mas quem sabe, só que...!"
33030-65 = "E então, eu—"
33030-66 = "Nagi-chan."
33030-67 = "...Já chega. Essa história não é nada tão complicado assim. Eu detesto Gehenna e, por causa disso, tentei matar até a minha amiga de infância. É só isso."
33030-68 = "...Não houve algum motivo por trás? Algum engano, um mal-entendido... alguma verdade que não dá para ver apenas pelos fatos...?"
33030-69 = "...Verdade? Ahaha!"
33030-70 = "Ah, puxa, deve ser por isso que eu gosto tanto de você, Nagi-chan. Desse seu lado tão puro."
33030-71 = "Não existe nada disso. Eu tentei dar um fim na Seia-chan e, ainda por cima, em você também, Nagi-chan. É só isso."
33030-72 = "Você me conhece bem, não conhece, Nagi-chan? Quando eu gosto ou desgosto de algo, sou extrema. É só isso. Eu simplesmente não conseguia me dar bem com Gehenna de jeito nenhum, fim de papo."
33030-73 = "Eu não suporto nem a ideia de dividir o mesmo espaço com aquela gentalha. Você não se sente assim, Nagi-chan?"
33030-74 = "...E foi por isso que se aliou a Arius?"
33030-75 = "Sim, eu sou uma assassina, sabia? Quando tem algo que eu não engulo, fazer pelo menos isso é o mínimo, não acha?"
33030-76 = "Mesmo que a Seia-chan esteja viva, o fato de que eu tentei matar aquela garota não vai desaparecer."
33030-77 = "Você só não conhecia esse meu lado, Nagi-chan. Mais nada."
33030-78 = "Por que... eu..."
33030-79 = "\"Passamos tanto tempo juntas, como eu não percebi\"?"
33030-80 = "...Você sabe a resposta pra isso melhor do que eu, não sabe, Nagi-chan?"
33030-81 = "...\"Porque somos duas estranhas\". Viu? Não tinha como você saber, né?"
33030-82 = "..."
33030-83 = "...Por hoje, eu já vou indo."
33030-84 = "Tá bom, vá com cuidado, Nagi-chan. Pena que eu não posso te acompanhar até a porta."
33030-87 = "..."
33030-91 = "...Por que você conta uma mentira dessas?"
33030-92 = "Hmm, hoje estou recebendo bastante visita, hein. Agora é a Hanako-chan."
33030-93 = "...Bem, no meu caso, digamos que é mais por uma questão de função."
33030-94 = "Entendi. Bom, se não veio junto com a Nagi-chan, foi a mando da Irmandade? Por acaso entrou para a facção delas?"
33030-95 = "...Bom, pra mim tanto faz. Mas deixa isso pra lá, o que você quer dizer com \"mentira\"? Quando foi que eu menti, e sobre o quê?"
33030-96 = "..."
33030-97 = "Juntando as informações da Irmandade e de outras fontes, estive deduzindo os seus passos até aqui, Mika-san. Investigar seus alvos e propósitos a partir disso... seria uma espécie de post-mortem, digamos assim."
33030-98 = "Em outras palavras: por que Misono Mika-san causou um incidente como este...?"
33030-99 = "Uau, e você vem falar disso bem na frente da própria envolvida? Que belo passatempo você tem, hein?"
33030-100 = "...Como resultado do seu ódio por Gehenna, você tentou destruir o Tratado do Éden, Mika-san. Isso certamente deve ser verdade."
33030-101 = "..."
33030-102 = "Não sei por quem você foi instigada, ou sequer se existe esse \"alguém\", nem por quais circunstâncias chegou a essa decisão, mas... no fim, para se tornar a Anfitriã, você deu as mãos a Arius."
33030-103 = "O plano inicial não passava simplesmente de sequestrar a Seia-chan e mantê-la em cárcere privado, não é mesmo? Afinal, se o objetivo era tornar-se a Anfitriã, isso já seria o bastante."
33030-104 = "Contudo, o pensamento do \"Esquadrão Arius\", encarregado da execução, era diferente. Elas pretendiam destruir a auréola da Seia-chan desde o princípio..."
33030-105 = "Quanto à sequência de acontecimentos depois disso, também há várias formas de interpretar, mas..."
33030-106 = "De todo modo, você recebeu o relatório de que \"a Seia-chan morreu\", Mika-san."
33030-107 = "Foi a partir desse momento que o seu coração começou a se despedaçar, não foi, Mika-san?"
33030-108 = "Provavelmente você entrou em pânico. A morte da Seia-chan era algo irreversível e, na prática, você havia se tornado uma \"assassina\"..."
33030-109 = "Uma vez que as coisas chegaram a esse ponto, só lhe restava ir até as últimas consequências. Custasse o que custasse, precisava chegar aonde havia planejado no início..."
33030-110 = "Movida por esse impulso destrutivo, quase desesperado—"
33030-111 = "Ei, ei, espera aí um pouquinho."
33030-112 = "Dá pra não ficar deduzindo o coração dos outros por conta própria?"
33030-113 = "Fui eu quem mandou matar a Seia-chan, e também fui eu quem tentou dar um jeito na Nagi-chan, minha própria amiga de infância, viu? Você deveria ser inteligente, Hanako-chan, então que papo é esse de desespero e impulso?"
33030-114 = "...Não. Eu me lembro muito bem das palavras que você disse."
33030-117 = "Mas eu não mandei destruir a auréola dela. Eu não sou uma assassina."
33030-118 = "O que aconteceu com a Seia-chan foi o estopim pra situação tomar essa proporção toda, sabia?"
33030-119 = "A partir dali, um monte de coisas já tinha saído completamente do controle... Ei, o que você acha dessa parte?"
33030-122 = "Há também vários outros pontos que não parecem naturais."
33030-123 = "Naquela ocasião, eu de fato acreditava que \"existia uma verdadeira traidora em Trinity\", mas não imaginava que você fosse realmente se revelar ali."
33030-124 = "Porque fazer aquilo significava jogar fora a sua maior vantagem."
33030-125 = "Pensando estrategicamente, não havia motivo para você tomar uma atitude daquelas."
33030-126 = "Pois é, eu também me arrependo disso. Ah, se eu fosse um pouquinho mais esperta—"
33030-127 = "Mika-san, você \"teve medo de que Arius matasse a Nagisa-san\"... Não foi isso?"
33030-128 = "..."
33030-129 = "Assim como aconteceu com a Seia-chan, Arius poderia destruir a auréola da Nagisa-san. Foi isso que você pensou, não foi?"
33030-132 = "...Sendo assim, podem me devolver a Nagi-chan? Fiquem tranquilas, não vou fazer nada que doa. Bom, talvez ela passe o resto da vida escolar inteira dentro de uma jaula, mas só."
33030-135 = "..."
33030-136 = "Mika-san, você é forte. Provavelmente, em um combate puro, conseguiria lutar de igual para igual até mesmo com a Tsurugi-san, do Comitê de Justiça. É claro que você também possui outras formas de força, mas..."
33030-137 = "Naquele momento, eu fingi estar tranquila, mas, por dentro, sabia que a situação era bastante perigosa."
33030-138 = "Por mais que tivéssemos o apoio da Irmandade, conter você não seria tarefa fácil. Na pior das hipóteses, eu chegava a prever que todas da Irmandade poderiam ser derrubadas."
33030-139 = "...Mas você se rendeu. No exato instante em que ouviu que \"a Seia-chan está viva\"."
33030-140 = "...Já chega."
33030-141 = "E então, o que você quer dizer com tudo isso?"
33030-142 = "Quer dizer que sou uma coitadinha? Que no fundo eu não queria ter feito nada daquilo? Ou que sou só uma tonta que fez as escolhas erradas?"
33030-143 = "Ahahahahahaha!"
33030-144 = "Ah, você é mesmo uma garota muito engraçada..."
33030-148 = "Não tem nada a ver, eu sou só uma traidora. Uma assassina perversa e calculista que vendeu as amigas e companheiras."
33030-149 = "Não tenho a menor intenção de virar o rosto pra esse fato. Uma pessoa como eu merece mais é ser odiada por todo mundo."
33030-150 = "...E mesmo que, por hipótese, existisse algum outro motivo... como é que você iria saber?"
33030-151 = "Se eu mesma estou dizendo que essa é a verdade! Negando até o que eu digo, o que exatamente você está tentando encontrar, Hanako-chan?"
33030-152 = "Por que insistir tanto em algo que não tem como provar?"
33030-153 = "Eu apenas..."
33030-154 = "...Ei, como a Seia-chan está agora? Vocês eram próximas, né, Hanako-chan?"
33030-155 = "A Seia-chan está mesmo a salvo? Eu duvido muito, mas não vai me dizer que \"na verdade ela morreu e vocês mentiram pra mim\", né? Mas, se não é isso, por que ela não dá as caras?"
33030-156 = "Ou será que ainda estão me torturando com essa mentira até agora? Você também é bem ardilosa, né, Hanako-chan? Será que é melhor eu duvidar disso também?"
33030-157 = "..."
33030-158 = "...Peço licença para me retirar por hoje, Mika-san."
33030-159 = "Sobre as deduções que acabei de mencionar, não contarei a ninguém. Muito menos à Nagisa-san, é claro."
33030-160 = "Tá, faça como quiser."
33030-161 = "E nem ao Sensei [USERNAME]."
33030-162 = "..."
33030-163 = "Afinal, não passam de \"deduções\"."
33030-164 = "..."
33030-165 = "...Até mais."
33030-169 = "..."
33030-170 = "......"
33030-176 = "...Eu não sou flor que se cheire, mas você também é bem cruel, hein, Hanako-chan."
33030-178 = "[ns] \"...\""
33030-179 = "Bem, apesar de ter dito aquilo, acabei contando tudo para você assim, Sensei..."
33030-180 = "Eu pretendia apenas provocar a Mika-san um pouquinho, mas... no fim, sinto que acabou virando uma crueldade de verdade."
33030-181 = "...Parece que o sangue me subiu à cabeça. Preciso pedir desculpas a ela na próxima vez..."
33030-182 = "Mas, por enquanto, parece que o desfecho dessa história só pode ficar dessa forma."
33030-183 = "A Mika-san, que detestava Gehenna, tentou atacar a Tea Party para se tornar a Anfitriã."
33030-184 = "Quem ordenou o ataque foi Misono Mika-san. Quem executou foi o Esquadrão Arius. E, por fim, quem explodiu o quarto onde a Seia-chan estava foi Shirasu Azusa-chan."
33030-185 = "Cada uma tinha seus próprios motivos e objetivos diferentes..."
33030-186 = "E os resultados dessas ações se encadearam um após o outro, misturando mal-entendidos e desconfianças, até chegarmos onde estamos agora..."
33030-187 = "...Seria essa a conclusão?"
33030-188 = "[ns] \"Não sei dizer...\""
33030-190 = "[ns] \"Por exemplo, talvez a Mika só quisesse pregar uma peça na Seia no começo... ou algo assim.\""
33030-191 = "...Sensei? O que está dizendo, assim de repente...?"
33030-192 = "Mesmo como hipótese, parece uma suposição bastante extrema, mas... hum, se pararmos para pensar por um instante..."
33030-193 = "Levando em conta a personalidade da Mika-san..."
33030-194 = "Deixando de lado como ela é de verdade, a Mika-san é vista pelos outros como o tipo de pessoa que age sem calcular muito as coisas, a ponto de dizerem que ela \"não leva jeito para a política\"."
33030-195 = "Será que ela andava irritada com a Seia-chan, que vivia dizendo coisas complicadas quase todos os dias...?"
33030-196 = "Bem, é verdade que não dá muito para dizer que a Seia-chan tenha uma \"personalidade fácil\", mas..."
33030-197 = "Daí a Mika-san querer pregar uma peça nela por causa disso e envolver Arius..."
33030-198 = "R-Realmente, parece forçado demais, ou melhor, arbitrário demais..."
33030-199 = "[s] \"É, pode ser.\""
33030-200 = "...Sensei? Aceitou tão fácil assim...?"
33030-201 = "[s] \"Ou talvez o verdadeiro objetivo da Mika fosse fazer as pazes com Arius.\""
33030-202 = "..."
33030-203 = "Fazer as pazes era o verdadeiro objetivo, e acabaram se aproveitando dessa intenção dela...? Instigando o ódio contra Gehenna no processo..."
33030-204 = "...Não, o que você quer dizer, Sensei, é que—"
33030-205 = "Nós não temos como adivinhar os verdadeiros sentimentos da Mika-san... É isso?"
33030-206 = "[s] \"\\\"É possível provar a verdade daqueles que alcançaram o Paraíso?\\\"...\""
33030-207 = "A quinta..."
33030-208 = "Aqueles que alcançam o Paraíso não podem mais ser observados de fora dele. Sua existência não pode ser observada... O paradoxo sobre a prova da existência do Paraíso..."
33030-209 = "[s] \"...Como provar aquilo que não pode ser provado?\""
33030-210 = "..."
33030-211 = "Se pudéssemos alcançar os \"verdadeiros sentimentos de outra pessoa\"... ela já não seria mais uma outra pessoa. E, se não podemos alcançar, então no fim realmente não sabemos quais são seus verdadeiros sentimentos..."
33030-212 = "Tanto o Paraíso quanto os verdadeiros sentimentos de alguém são a mesma coisa... É disso que está falando?"
33030-213 = "...De fato, talvez seja isso mesmo. Não temos nenhum meio de tocar diretamente o coração de alguém, nem qualquer forma de provar a sua verdade."
33030-214 = "Como poderíamos provar que as palavras \"compreendi os verdadeiros sentimentos de alguém\" são \"verdadeiras\"...?"
33030-215 = "É uma verdadeira contradição... Seria então impossível? Não existe nenhuma maneira de compreender os verdadeiros sentimentos do outro...?"
33030-216 = "[s] \"...Provavelmente não existe mesmo.\""
33030-217 = "..."
33030-218 = "[ns] \"Essa com certeza é uma prova impossível...\""
33030-220 = "[ns] \"...E, se for assim, talvez só nos reste acreditar.\""
33030-222 = "[ns] \"De que o Paraíso existe lá.\""
33030-223 = "..."
33030-224 = "É... verdade."
33030-225 = "Pensando bem, você foi assim desde o começo, não é, Sensei? Desde o princípio desta história repleta de suspeitas e desconfianças—"
33030-253 = "Você não duvida das alunas, Sensei, incluindo, é claro, a Mika-san e a Nagisa-san... É isso?"
33030-254 = "...Mesmo que, como consequência, acabe sendo traído por alguém?"
33030-255 = "[s] \"Porque, se isso acontecer, com certeza deve haver algum motivo.\""
33030-256 = "Por que... Sensei, por que você vai tão longe...?"
33030-257 = "[s1] \"Se o Sensei não acreditar nas alunas, nada pode começar...\"\n[s2] \"Porque sou um adulto, quero acreditar em todas.\""
33030-264 = "[ns3] \"Espero que algum dia chegue a hora em que a Nagisa e a Mika\"\n[ns4] \"possam novamente abrir o coração uma para a outra.\""
33030-269 = "[ns] \"Algum dia, com certeza. E, para isso, eu também...\""
33030-272 = "[ns5] \"...Quando o Tratado do Éden terminar,\"\n[ns6] \"vou logo visitá-las mais uma vez.\"\n[ns7] \"Tanto a Mika quanto a Nagisa.\""
33030-273 = "É verdade... Quando tudo estiver resolvido, todas nós, mais uma vez..."
33030-274 = "É verdade... Quando tudo estiver resolvido, todas nós, mais uma vez..."
33030-275 = "É verdade... Quando tudo estiver resolvido, todas nós, mais uma vez..."
33030-276 = "Mesmo sem saber o que vai acontecer... só nos resta estender a mão umas às outras e nos esforçar. É isso, não é?"
33030-277 = "[s] \"Porque essa com certeza é a única coisa que podemos fazer...\""
33030-278 = "...Sim, você tem razão."
33030-282 = "Próximo;Depois disso"
