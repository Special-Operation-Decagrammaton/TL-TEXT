[translation]
33030-1 = "Эпизод 3;Разбор последствий, часть 3"
33030-2 = "Камера заключения Тринити"
33030-3 = ""
33030-4 = ""
33030-5 = "Я думала, что больше тебя не увижу."
33030-6 = "Да брось. Ты же знаешь, что мы неразлучны, нравится нам это или нет."
33030-7 = "Ты права. Так было с тех пор, как мы были маленькими."
33030-8 = "..."
33030-9 = "Так зачем ты пришла? Вряд ли ради допроса. Меня и без того уже достаточно выжимали."
33030-10 = "Что бы это ни было, оно наверняка важно, раз ты лично пришла сюда."
33030-11 = "..."
33030-12 = "Речь об отряде Ариуса."
33030-13 = "Тайное подразделение специальных операций, созданное председателем студсовета Ариуса."
33030-14 = "Что ещё ты хочешь узнать? На допросе я уже рассказала всё, что знаю."
33030-15 = "От того, как связалась с Ариусом, до ролей каждого члена отряда..."
33030-16 = "Да, я знаю."
33030-17 = "Думаешь, я всё ещё что-то скрываю? Хочешь выбить это пытками? Я слышала, Сестринство такое очень любит."
33030-18 = "Это были методы прежнего Совета, а не Сестринства. Такое бесчеловечное обращение сегодня никто бы не допустил."
33030-19 = "Знаю, знаю. Ты ненавидишь подобное — я просто тебя дразнила."
33030-20 = "..."
33030-21 = "Знаю, от меня это прозвучит странно, но разве Ариус сейчас вообще представляет большую угрозу?"
33030-22 = "Без моей поддержки у них нет доступа к новым войскам, оружию или припасам."
33030-23 = "Даже если отряд всё ещё желает навредить Тринити, разве Отряд правосудия не способен справиться с ними и остатками сил Ариуса?"
33030-24 = "Да, мы уже это учли. В контексте Эдемского договора Ариус не должен представлять угрозы."
33030-25 = "Я так и думала... А, и к слову: я пыталась найти их район, но это оказалось непросто."
33030-26 = "Единственный, кто знает, как туда попасть, — Саори, лидер отряда."
33030-27 = "Если тебе действительно нужно знать, всегда можешь спросить Азусу. Да, она предала их, но всё же была студентом Ариуса."
33030-28 = "Обычно я бы могла, но..."
33030-29 = "А, понятно. Теперь она под защитой Шале, да?"
33030-30 = "Ты действительно умудрилась попасть в немилость Сенсея, Наги. Теперь тебе даже неудобно попросить об одолжении."
33030-31 = "Сенсей всегда на стороне студентов, так что не станет делать ничего, что подвергнет Азусу опасности."
33030-32 = "..."
33030-33 = "Вы, наверное, так и не виделись после всего случившегося, да? У тебя это на лице написано."
33030-34 = "Ты не можешь заставить себя встретиться с Сенсеем после того, как была так жестока. Ой, даже ты умеешь быть застенчивой девушкой, Наги. Ха-ха-ха."
33030-35 = "Не то чтобы я не понимала это чувство."
33030-36 = "Сенсей часто приходил навещать меня. Каждый раз было тяжело отказываться."
33030-37 = "Ну, я всё равно здесь застряла. Наверное, Сенсей мог бы воспользоваться влиянием Шале и потребовать встречи, но никогда бы так не сделал — и почему-то от этого ещё раздражительнее."
33030-38 = "Он никогда не делает именно то, чего ты от него хочешь. Я пыталась сливать всю эту ложную информацию, а Сенсея это всё равно не поколебало."
33030-39 = "Всё было бы куда проще, если бы Сенсей просто поверил одной из нас и сделал, что ему сказали."
33030-40 = "Или хотя бы слил всё, что я ему рассказала, — тогда я бы сейчас здесь не сидела."
33030-41 = "..."
33030-42 = "Ну, как бы то ни было. Не думаешь, что в итоге всё обернулось к лучшему?"
33030-43 = "Настоящий предатель заключён, Ариус почти не представляет угрозы..."
33030-44 = "...а Эдемский договор теперь можно подписать по плану. Ты наконец получишь мир, которого так хотела, Наги."
33030-45 = "Такой счастливый конец. Разве не чудесно?"
33030-46 = "..."
33030-47 = "Нет, не чудесно."
33030-48 = "Чему здесь радоваться, Мика? Предатель — ты."
33030-49 = "Ты пыталась уничтожить мой нимб."
33030-50 = ""
33030-51 = "..."
33030-52 = "И ради чего? Потому что ненавидишь Геенну? Ты была готова убить подругу, которую знаешь большую часть жизни, из-за такой мелочи?"
33030-53 = "И Сэя тоже. Почему?"
33030-54 = "..."
33030-55 = "Я была в ужасе, когда услышала о предполагаемой смерти Сэи..."
33030-56 = "Я не могла не думать, что следующая — я."
33030-57 = "Она мудрейшая из нас и даже видит вещие сны, которыми умеет пользоваться. В Тринити нет никого опаснее её. Поэтому первой целью стала она."
33030-58 = "А учитывая твою... политическую хватку, я решила, что следующей буду я."
33030-59 = "И что это должно значить?"
33030-60 = "В любом случае я знала: если со мной что-нибудь случится, всё свалится на твои плечи. Я не могла этого допустить."
33030-61 = "Я отчаянно пыталась найти виновного до того, как до этого дойдёт. Я не хотела оставлять тебя одну. И не хотела, чтобы тебе тоже причинили вред."
33030-63 = "Но кто мог за этим стоять? Геенна? Генеральный студенческий совет? Та Старшая сестра из Миллениума? Может, тиран из Красной Зимы? Или Тёмный монарх Шаньхайцзина..."
33030-64 = "Или среди нас был предатель? Это казалось немыслимым, но всё же..."
33030-65 = "А потом я... я..."
33030-66 = "Помедленнее, Наги."
33030-67 = "Всё не так сложно. Я ненавижу Геенну — настолько, что была готова убить дорогую старую подругу. Понятно?"
33030-68 = "И это действительно всё? Не было какой-то ошибки, недоразумения или подсознательного убеждения, которое ты не могла контролировать, или...?"
33030-69 = "Ха-ха-ха. Какая ещё могла быть причина?"
33030-70 = "Вот за что ты мне всегда и нравилась, Наги. Ты такая чистая. Чистая и наивная."
33030-71 = "Ты ничего не упускаешь. Я попыталась убить Сэю, а затем тебя. Вот и всё."
33030-72 = "Ты же знаешь, насколько крайними бывают мои чувства к тому, что я люблю и ненавижу. Я просто не могу ужиться с этими отбросами из Геенны. Не хочу идти с ними под руку и притворяться друзьями."
33030-73 = "Разве от одной мысли о том, что приходится существовать с ними в одном городе, тебя не передёргивает?"
33030-74 = "И поэтому ты заключила союз с Ариусом?"
33030-75 = "Разумеется. А что ещё должна была делать такая убийца, как я?"
33030-76 = "Даже если Сэя жива, именно я пыталась её убить.#nЭтого уже не изменить."
33030-77 = "А ты даже не заметила, Наги."
33030-78 = "Но как...?"
33030-79 = "Как ты могла знать меня столько лет и не замечать правды?"
33030-80 = "Ты должна знать ответ лучше меня."
33030-81 = "Потому что, в конце концов, мы чужие. Мы возвели между собой столько стен, что никогда не сможем по-настоящему узнать друг друга."
33030-82 = "..."
33030-83 = "Я пойду, Мика."
33030-84 = "Береги себя, Наги. Прости, что не могу проводить."
33030-86 = ""
33030-87 = "..."
33030-88 = ""
33030-90 = ""
33030-91 = "Зачем ты ей так солгала?"
33030-92 = "Сегодня у меня прямо день посетителей. Теперь ты, Ханако?"
33030-93 = "Да, но это не личный визит. Я здесь по делу."
33030-94 = "Логично. Раз ты вошла не вместе с Наги, значит, пришла от имени Сестринства? Теперь выполняешь их поручения?"
33030-95 = "Хотя мне всё равно. Кстати, о чём ты только что говорила? Я не лгала."
33030-96 = "..."
33030-97 = "Я проводила разбор твоих действий на основе всей информации, которую получила от Сестринства."
33030-98 = "Другими словами, я анализировала мотивы Мисоно Мики."
33030-99 = "Ничего себе, как смело признавать это прямо перед человеком, которого анализируешь. И немного бестактно."
33030-100 = "Ты пыталась уничтожить Эдемский договор из-за ненависти к Геенне. Это ясно."
33030-101 = "..."
33030-102 = "Но я не знаю, кто подтолкнул тебя к этому решению и почему в итоге ты объединилась с Ариусом, чтобы стать новой хозяйкой."
33030-103 = "Изначально ты, вероятно, планировала просто похитить Сэю и держать её в плену. По сути, этого достаточно, чтобы титул хозяйки перешёл к другому."
33030-104 = "Но у отряда Ариуса были иные планы. С самого начала они собирались уничтожить нимб Сэи."
33030-105 = "Однако на этом история не заканчивается."
33030-106 = "Сначала тебе сообщили, что Сэя умерла."
33030-107 = "И, думаю, именно тогда ты начала психологически ломаться."
33030-108 = "Вероятно, ты запаниковала. В собственных глазах ты стала «убийцей», и ничто уже не могло убедить тебя в обратном."
33030-109 = "Назад пути не было. Ты не собиралась останавливаться, пока не доведёшь начатое до конца. А какой ещё был выбор?"
33030-110 = "Наверное, ты утопала в отчаянии и действовала под влиянием разрушительного импульса."
33030-111 = "Пого-о-оди секундочку."
33030-112 = "Ты не знаешь, что психологически разбирать человека прямо ему в лицо — грубо?"
33030-113 = "Это я приказала убить Сэю, и это я ударила в спину своей подруге детства Наги. Отчаяние? Импульсивность? О чём ты вообще? Ты идиотка?"
33030-114 = "Нет, но память у меня очень хорошая."
33030-116 = ""
33030-117 = "Но разрушать её нимб в план не входило. Имей обо мне хоть немного хорошего мнения — я не убийца."
33030-118 = "Именно из-за той маленькой ошибки всё так вышло из-под контроля."
33030-119 = "Понимаешь? Теперь я не могу повернуть назад из-за этого — из-за тебя."
33030-121 = ""
33030-122 = "Есть ещё несколько вещей, которые не сходятся."
33030-123 = "Мне казалось, настоящий предатель действительно существует, но я не ожидала, что она раскроет себя прямо тогда и там."
33030-124 = "Ведь это означало бы отказаться от её главного преимущества — анонимности."
33030-125 = "Ни один стратег не стал бы так поступать. В этом нет смысла..."
33030-126 = "Об этом я действительно пожалела. Тут я сильно облажалась."
33030-127 = "Ты не дала мне закончить. В этом нет смысла... если только ты не боялась, что Ариус убьёт и Нагису."
33030-128 = "..."
33030-129 = "Разве не так? Ты боялась, что они убьют её так же, как Сэю."
33030-131 = ""
33030-132 = "Так что выдайте её. Обещаю, я её не убью. Да, остаток школьных лет ей, возможно, придётся провести взаперти, но ничего страшного."
33030-134 = ""
33030-135 = "..."
33030-136 = "Ты сильнее, чем о тебе думают, Мика. Да, ты доказала, что в бою не уступаешь даже председателю Отряда правосудия, но дело не только в этом."
33030-137 = "Во время нашего столкновения я изо всех сил сохраняла спокойствие, но на самом деле#nя прекрасно понимала, насколько шаткой была ситуация."
33030-138 = "Мне приходилось быть готовой к худшему — даже к тому, что Сестринство будет вынуждено отступить."
33030-139 = "Но затем ты сдалась. Ты смирилась, когда услышала, что Сэя всё ещё жива."
33030-140 = "Хватит."
33030-141 = "К чему ты клонишь?"
33030-142 = "Ты меня жалеешь? Скажешь, что я не имела в виду ни слова из сказанного и не хотела, чтобы случились все эти ужасные вещи? Что я была просто растерянной глупой девчонкой, сделавшей пару плохих выборов?"
33030-143 = "Ха-ха-ха!"
33030-144 = "Ты такая смешная, Ханако. Просто умора."
33030-145 = ""
33030-147 = ""
33030-148 = "Всё действительно не так сложно. Я просто предательница — убийца, продавшая друзей и союзников ради обиды, которую носила в своём извращённом, коварном сердце."
33030-149 = "Я больше не пытаюсь это скрывать. После всего, что сделала, я заслуживаю ненависти."
33030-150 = "Даже если у меня были какие-то другие скрытые мотивы, откуда ты вообще можешь знать наверняка?"
33030-151 = "Истиной для тебя может быть только то, что ты видишь. Поэтому отрицать то, что прямо перед глазами, — значит ослепнуть. Разве не так, Ханако?"
33030-152 = "Зачем отчаянно цепляться за то, что невозможно доказать? Хм?"
33030-153 = "Я просто хотела... чтобы..."
33030-154 = "Кстати, как сейчас Сэя? Вы ведь были близки?"
33030-155 = "Ты уверена, что она в безопасности? Может, настоящей ложью было то, что она всё это время была мертва? Если нет, почему я не могу её увидеть?"
33030-156 = "Ты ведь не стала бы мучить меня такой ложью? Это настолько жестоко. Может, подозревать нужно именно тебя."
33030-157 = "..."
33030-158 = "Я пойду, Мика."
33030-159 = "Я не стану делиться своими догадками ни с кем. Даже с Нагисой."
33030-160 = "Делай что хочешь. Меня это не особо касается."
33030-161 = "Так и сделаю. И от Сенсея [USERNAME] тоже всё это скрою."
33030-162 = "..."
33030-163 = "Ты ведь это заслужила за предательство Сенсея, правда?"
33030-164 = "..."
33030-165 = "Береги себя, Мика."
33030-166 = ""
33030-168 = ""
33030-169 = "..."
33030-170 = "..."
33030-171 = ""
33030-173 = ""
33030-176 = "Может, я и отвратительна, но ты откровенно жестока, Ханако."
33030-178 = "[ns] «...»"
33030-179 = "Вот тебе и «никому не расскажу». Именно так она сказала."
33030-180 = "Я лишь хотела немного её подразнить... но, похоже, снова перегнула."
33030-181 = "Когда-нибудь стоит извиниться перед ней за то, что так потеряла самообладание."
33030-182 = "Пока что, думаю, это всё, что мы знаем об инциденте."
33030-183 = "Мика настолько ненавидит Геенну, что устроила заговор против других членов Чаепития."
33030-184 = "Она приказала напасть на Сэю, и отряд выполнил приказ. Именно тогда Азуса уничтожила комнату, где находилась Сэя."
33030-185 = "Каждая сторона действовала, исходя из собственных мотивов."
33030-186 = "В итоге они постоянно мешали друг другу из-за недоверия и недоразумений."
33030-187 = "И это привело нас туда, где мы сейчас. Вот всё, что мы знаем, Сенсей."
33030-188 = "[ns] «Всё равно кажется, что чего-то не хватает.»"
33030-190 = "[ns] «А что, если всё началось с того, что Мика просто хотела поддразнить Сэю?»"
33030-191 = "С чего ты это взял?"
33030-192 = "Довольно экстремальный мысленный эксперимент, но если так..."
33030-193 = "Хм. Для начала рассмотрим характер Мики."
33030-194 = "Все знают, что Мика и политика несовместимы, и несмотря на недавние... открытия, это по-прежнему похоже на правду. Она сначала действует, а уже потом взвешивает плюсы и минусы."
33030-195 = "Возможно, она просто хотела отплатить Сэе за то, что та постоянно её отчитывала и обращалась как с ребёнком."
33030-196 = "Стоит признать, Сэя умеет... действовать людям на нервы."
33030-197 = "Но если Мика хотела лишь немного дружеской мести, зачем втягивать Ариус?"
33030-198 = "Это просто не выглядит реалистично. На самом деле, воспользуйся она таким оправданием, я бы сказала, что оно слишком удобное."
33030-199 = "[s] «Возможно.»"
33030-200 = "Не говори, что уже отказываешься от этой идеи."
33030-201 = "[s] «Но что, если Мика действительно хотела помириться с Ариусом?»"
33030-202 = "..."
33030-203 = "Ты предполагаешь, что она обратилась к Ариусу в надежде на примирение, а они просто воспользовались ею. Обернули её ненависть к Геенне против неё."
33030-204 = "Нет, на самом деле ты хочешь сказать..."
33030-205 = "...что невозможно со стороны узнать истинные намерения Мики."
33030-206 = "[s] «Можно ли доказать, что кто-нибудь вообще достиг рая?»"
33030-207 = "Пятый коан..."
33030-208 = "Тех, кто достиг рая, невозможно найти — и их не должно существовать — за пределами рая... В этом и заключается парадокс попытки доказать существование рая."
33030-209 = "[s] «Иными словами, как доказать искренность другого человека?»"
33030-210 = "..."
33030-211 = "Именно. Если бы мы действительно могли полностью понять чужую точку зрения, она перестала бы быть чужой. А значит, доказать искренность невозможно."
33030-212 = "В этой аналогии рай — это искренность других. Ты это хочешь сказать?"
33030-213 = "Возможно. Нельзя напрямую коснуться чужого сердца."
33030-214 = "Мы не можем доказать искренность, которая в нём есть, так же как не можем доказать, что кто-то достиг рая."
33030-215 = "Сплошной парадокс. Значит, узнать истинные намерения другого невозможно?"
33030-216 = "[s] «Похоже на то.»"
33030-217 = "..."
33030-218 = "[ns] «Нет смысла пытаться доказать невозможное.»"
33030-220 = "[ns] «Поэтому остаётся верить.»"
33030-222 = "[ns] «Нужно верить в рай и доверять другим.»"
33030-223 = "..."
33030-224 = "Полагаю, ты прав."
