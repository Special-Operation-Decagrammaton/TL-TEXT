[translation]
2001815-1 = "Клеймор, клеймор, клеймор!"
2001815-2 = "Исполнительный офис Шале"
2001815-3 = "Это был обычный солнечный день..."
2001815-4 = "...если не считать того, что Моэ как представитель учеников находилась в «Шале» и помогала мне с документами."
2001815-5 = ""
2001815-7 = ""
2001815-8 = ""
2001815-9 = "Им... нет конца."
2001815-10 = "[s] «Нет конца...»"
2001815-11 = ""
2001815-13 = ""
2001815-14 = "И... простого решения тоже нет..."
2001815-15 = "[s] «Нет решения...»"
2001815-16 = ""
2001815-18 = ""
2001815-19 = ""
2001815-20 = "Сенсей! Вы всегда ведёте эту безнадёжную войну с бумажной работой?"
2001815-21 = "Я бы никогда не смогла посвятить жизнь чтению расплывчатых вопросов и ответам ещё более расплывчатыми фразами. Это разрушение души."
2001815-22 = "[s1] «Прости, что не нашлось ничего поинтереснее.»\n[s2] «Но даже просто ввод данных от тебя очень помогает...»"
2001815-25 = "Нет, это не ваша вина. Я просто ЖАЛУЮСЬ."
2001815-26 = "Я сама сказала, что помогу, а однообразная работа даже в некотором смысле моя сильная сторона."
2001815-27 = "Но пальцы уже немеют от этой ручки..."
2001815-28 = "[s3] «Тогда сделаем перерыв?»\n[s4] «Я принесу кофе, а ты немного разомнись.»"
2001815-31 = "Поняла!"
2001815-32 = ""
2001815-34 = ""
2001815-35 = "А, может, тогда воспользуюсь «этим»."
2001815-36 = "Хи-хи... Я знала, что не зря взяла это с собой."
2001815-37 = ""
2001815-39 = ""
2001815-41 = "Тогда без лишних церемоний..."
2001815-43 = "[ns] «Стой!»"
2001815-45 = "В-Вы меня напугали..."
2001815-46 = "Что такое, Сенсей? Я чуть из кожи не выпрыгнула!"
2001815-47 = "[s5] «Ты вообще имеешь право это спрашивать?!»\n[s6] «Посмотри, что у тебя в руке!»"
2001815-50 = ""
2001815-53 = "[ns] «Разве это не детонатор?!»"
2001815-54 = "...Детонатор?"
2001815-55 = "Ах, ах. Хватит так переживать, Сенсей. Не всё всегда таково, каким кажется!"
2001815-56 = "Я не из тех, кто взрывает бомбы ради развлечения, когда становится скучно—"
2001815-57 = ""
2001815-59 = ""
2001815-60 = "...Ладно, да, из тех. Но сегодня — нет, ясно?!"
2001815-61 = "Хорошо-хорошо. Смотрите, просто сожмите эту рукоять и перестаньте коситься на меня с осуждением!"
2001815-62 = "Идите сюда и сами посмотрите, господи!"
2001815-63 = "[s7] «Взрывы уже не дают тебе достаточно адреналина?»\n[s8] «Теперь хочешь манипуляциями заставить меня собственными руками взорвать „Шале“?!»"
2001815-66 = "О! О-о-о, мне нравится. Какая восхитительно разрушительная картина..."
2001815-67 = "НЕТ, серьёзно, смотрите! В этот раз вы правда неправильно поняли! Это не бомба!"
2001815-68 = "Смотрите. Здесь нет устройства сигнала детонации, которое есть у любого детонатора."
2001815-69 = "[s9] «Если присмотреться, действительно немного отличается...»\n[s10] «Тогда для чего эта штука?»"
2001815-72 = "Вы никогда раньше такой не пользовались, Сенсей? Это кистевой тренажёр."
2001815-73 = "Смотрите, если сильно его сжать... Пружина выталкивает пальцы наружу, и можно тренировать силу хвата."
2001815-74 = ""
2001815-76 = ""
2001815-77 = "Он требует большой силы пальцев, поэтому после долгой работы я использую его, чтобы разогнать кровь."
2001815-78 = "[s11] «Я ДЕЙСТВИТЕЛЬНО рад, что ты не пытаешься взорвать „Шале“...»\n[s12] «Но зачем делать его... в виде бомбы?»"
2001815-81 = "Я сама его сделала! Из сломанного детонатора, который нашла."
2001815-82 = "Ну вы же знаете, как бывает. Сидишь где-то, работаешь и оказываешься в ужасной ситуации, где от скуки нельзя ничего взорвать!"
2001815-83 = ""
2001815-85 = "[ns] «(Разве это не... большинство ситуаций?)»"
2001815-86 = "Поэтому всякий раз, когда у меня чесался палец на спусковом крючке, я начинала возиться с этим сломанным детонатором."
2001815-87 = "Чтобы сделать его полезнее, я решила превратить его ещё и в кистевой тренажёр."
2001815-88 = "Нужно было всего лишь убрать капсюль и заменить его пружиной высокой жёсткости."
2001815-89 = "Разве не помните? Я уже говорила, что в SRT даже оператор обязан поддерживать форму и физическое состояние. А для меня, раз я работаю с кучей припасов, особенно важна ловкость рук."
2001815-90 = "А ещё... то, как от него покалывает ладонь... чувство разрушения, бегущее по венам... *тяжело дышит* *тяжело дышит*"
2001815-91 = "[s13] «Очень умно было сделать его ещё и функциональным.»\n[s14] «Для сортировки документов ведь тоже нужна немалая сила хвата.»"
2001815-94 = "Вот теперь понимаете! И сжимать его, между прочим, сложнее, чем кажется."
2001815-95 = "Любопытно? Попробуйте."
2001815-96 = "[s] «Почему бы и нет...»"
2001815-97 = ""
2001815-99 = ""
2001815-100 = ""
2001815-101 = ""
2001815-102 = "Ч-Что? С-Сенсей? Почему вы схватили меня за руку...?!"
2001815-103 = "[s] «Разве не это ты имела в виду под „попробовать“?»"
2001815-104 = "...Ну, наверное, и так сойдёт."
2001815-105 = "Я вообще-то имела в виду кистевой тренажёр..."
2001815-106 = "Но рукопожатие — более динамичный способ измерить силу хвата..."
2001815-107 = ""
2001815-109 = ""
2001815-110 = "Хи-хи... Похоже, вы тоже ходите в спортзал, Сенсей. Эти мышцы просто разрушительны."
2001815-111 = "Как насчёт небольшой борьбы на руках, чтобы узнать, кто сильнее?"
2001815-112 = "Хм... Просто ради развлечения ску-у-учно, так что проигравший... будет должен победителю услугу. Хи-хи-хи."
2001815-114 = "Мы с Моэ поставили честь нашей силы хвата на кон в серии поединков по армрестлингу."
2001815-115 = "Я давил, напрягался и выкладывался изо всех сил, но проиграл все три раунда..."
