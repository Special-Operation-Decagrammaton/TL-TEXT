[translation]
22200-1 = "Эпизод 20; Геймеры и друзья"
22200-2 = "Мы едва смогли сбежать..."
22200-3 = ""
22200-5 = ""
22200-6 = ""
22200-7 = ""
22200-8 = ""
22200-9 = "[ns] «Все в порядке? Кто-нибудь ранен?!»"
22200-10 = "Большинство из нас... Д-Да, но..."
22200-11 = "Неру..."
22200-13 = "Президент потеряла сознание... и до сих пор не очнулась."
22200-14 = "Её травмы серьёзнее, чем я сначала думала."
22200-15 = "Президент... сильно пострадала после падения в последнем бою..."
22200-16 = "[s] «Нэру...»"
22200-17 = "...Это действительно худший вариант."
22200-18 = "Инженерный отдел выбыл из боя против Avant Guard..."
22200-19 = "Хорошо, что мы, Веритас, смогли получить доступ к сети через Mirror, но... дистанционная поддержка тоже имеет предел."
22200-20 = "Что касается Отдела разработки игр... наверное, о нём и говорить нечего."
22200-21 = "Уггх! Н-Но!"
22200-22 = "Я... не могу это отрицать..."
22200-24 = "А наша главная боевая сила, C&C..."
22200-25 = "[s] «...Дело не только в Нэру... Все на пределе.»"
22200-26 = "...Ха. Не хочу этого говорить, но..."
22200-27 = "Это конец...? Такими темпами мы никогда не выберемся из этой ситуации..."
22200-28 = ""
22200-30 = ""
22200-31 = ""
22200-32 = "Неужели мы..."
22200-33 = "...Неужели нас недостаточно?"
22200-34 = "[s] «Момои...»"
22200-35 = "Нас недостаточно... чтобы самим спасти Алису?"
22200-36 = "Мы... Алиса... не сделала ничего плохого..."
22200-37 = "Тогда почему... Почему...?!"
22200-39 = "Мидори..."
22200-40 = "Все помогали нам... чтобы мы дошли сюда..."
22200-41 = "И благодаря усилиям всех... мы едва-едва смогли дойти до этой точки...!"
22200-42 = "Мы не можем вот так сдаться... правда...?"
22200-43 = "У нас не может быть... плохой концовки... такой... Никогда... никогда!"
22200-44 = ""
22200-45 = ""
22200-46 = ""
22200-47 = "Думаете, я просто с этим смирюсь?!"
22200-48 = "Вааааа?!"
22200-49 = "О! Президент!"
22200-50 = "Вы очнулись?"
22200-51 = "[s] «Нэру! Как ты себя чувствуешь?!»"
22200-53 = "А...?"
22200-54 = ""
22200-56 = ""
22200-57 = ""
22200-58 = "Президент! Не перенапрягайтесь! Вы очень серьёзно ранены!"
22200-59 = "Не суетись так... Это не настолько серьёзно."
22200-60 = "По внешнему виду — очень даже серьёзно."
22200-61 = "В любом случае... Что происходит? Почему все такие подавленные?"
22200-62 = "[s] «Ну...»"
22200-64 = "Значит, раз всё обернулось так... вы решили, что всё кончено?"
22200-65 = "..."
22200-66 = "Ха, смешно."
22200-67 = "А?"
22200-68 = "Эй, мелкие."
22200-69 = ""
22200-71 = ""
22200-73 = "И это всё, на что вы способны?"
22200-74 = "О чём ты?"
22200-75 = "Смотрите. Всё, что я знаю — рука вообще не двигается."
22200-76 = "Наверное, связку порвала... и ноги будто деревянные..."
22200-77 = "Кажется, сделаю шаг — и меня вырвет. Наверное, потому что очень неудачно упала."
22200-78 = "Ты звучишь как полный развал!"
22200-79 = "Ага! И даже со всем этим я ни за что не сдамся!"
22200-80 = "Посмотрели на меня — и всё равно собираетесь трусить? При первой же проблеме поджать хвост и побежать домой?!"
22200-81 = "Т-Ты вообще не в том состоянии, чтобы такое говорить...!"
22200-82 = "Ха! Не твоё дело."
22200-83 = "Я это спокойно перетерплю."
22200-84 = "Мы пришли сюда, чтобы спасти подругу."
22200-85 = "Значит, этим и займёмся. Будем двигаться вперёд."
22200-86 = "Н-Не то чтобы мы не хотим её спасать!"
22200-87 = "Но как победить такую читершу?"
22200-88 = "Ну..."
22200-89 = "Варианты ещё не закончились."
22200-90 = ""
22200-93 = "А?!"
22200-94 = "[s] «П-Правда, Юзу?!»"
22200-95 = "Да, это было лишь мгновение, но..."
22200-96 = ""
22200-97 = "(Только что...!)"
22200-98 = ""
22200-99 = "Я увидела, как одна атака Нэру попала."
22200-100 = "[s] «За такое короткое мгновение...?»"
22200-101 = "Конечно, Юзу! Ты же UZQueen! Ты заметила это благодаря невероятной остроте зрения!"
22200-102 = "Но как это сработало? По словам президента, против оружия Токи ничего не действует."
22200-103 = "Я-Я не уверена..."
22200-105 = "А что если..."
22200-106 = "Это всего лишь гипотеза, но..."
22200-107 = "А что, если в оружии Токи есть своего рода лазейка?"
22200-108 = "Лазейка?"
22200-109 = "Президент сказала, что оружие поддерживается сетью Эрида и благодаря вычислениям способно сбивать или уклоняться от любой атаки."
22200-110 = "[s] «Да, и оно полностью это доказало.»"
22200-111 = "Верно. И мы сами убедились, что до определённой степени это правда..."
22200-112 = "Но оно ни разу не делало эти две вещи одновременно."
22200-113 = "...! Точно... Теперь я понимаю!"
22200-114 = "А? Что...?"
22200-115 = "Я... не понимаю. Можете объяснить?"
22200-117 = "Нет сомнений, возможности оружия настолько невероятны, что оно кажется непобедимым."
22200-118 = "Но у всего есть предел."
22200-119 = "Когда оно падало со здания, президент сказала, что даже падение было рассчитано."
22200-120 = "Иными словами, в тот момент оно использовало вычислительную мощность на расчёт падения..."
22200-121 = "[s] «И было мгновение, когда оно не могло заблокировать атаку Нэру...?»"
22200-122 = "О! Поняла!"
22200-123 = "Е-Если мы сможем снова создать такой момент...!"
22200-124 = "Мы, возможно, сможем её победить..."
22200-125 = "Но как? Она наверняка знает ограничения оружия."
22200-126 = "Сбросить её с крыши второй раз уже не сработает..."
22200-127 = "Нэру говорит, что если держаться близко, мы сможем победить... верно?"
22200-128 = "...Да, сможем. Только нужно что-то сделать с её читерскими способностями."
22200-129 = "Тогда у меня есть идея."
22200-130 = "Против чита..."
22200-131 = "Есть трюки, которые можно использовать, не выходя за рамки правил..."
22200-132 = ""
22200-134 = ""
22200-139 = ""
22200-140 = ""
22200-141 = "Неру..."
22200-142 = ""
22200-144 = ""
22200-145 = ""
22200-146 = ""
22200-147 = "Не знаю, что вы задумали, но это не сработает."
22200-148 = "Токи."
22200-149 = "...Да, мэм."
22200-150 = "Ты правда думала, что всё кончено?"
22200-151 = "Давайте закончим!"
22200-153 = "Следующий Эпизод: Что в имени?"
