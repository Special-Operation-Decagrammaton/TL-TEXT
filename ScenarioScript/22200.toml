[translation]
22200-1 = "Episódio 20;Como Gamer, Como Amiga"
22200-2 = "Por enquanto conseguimos fugir para um prédio próximo, mas..."
22200-9 = "[ns] \"Todos estão bem? Alguém se machucou?!\""
22200-10 = "...Nós estamos bem, mas..."
22200-11 = "A Neru-senpai..."
22200-13 = "A Presidente ainda... não recuperou a consciência."
22200-14 = "Os ferimentos parecem mais graves do que imaginávamos."
22200-15 = "Parece que ela se machucou feio com o impacto da queda no final... O que a gente faz, Mestre...?"
22200-16 = "[s] \"Neru...\""
22200-17 = "...É a pior situação possível."
22200-18 = "O Clube de Engenharia ficou fora de combate na luta contra o Avant-Garde..."
22200-19 = "Foi ótimo nós da Veritas termos conseguido conectar à rede, mas...#nPara começo de conversa, apoio à distância tem limite."
22200-20 = "E quanto ao Clube de Desenvolvimento de Jogos... sinceramente, não dá para contar como força de combate."
22200-21 = "Uuuugh! B-Bem, é verdade, mas...!"
22200-22 = "Não dá para negar..."
22200-24 = "Na prática, a C&C, que era nossa única força de combate de verdade..."
22200-25 = "[s] \"...Não é só a Neru, todo mundo já chegou no limite.\""
22200-26 = "...Ah, eu realmente não queria dizer isso, mas..."
22200-27 = "Talvez seja o fim da linha... Não sobrou nenhuma carta na manga..."
22200-32 = "No fim das contas, nós..."
22200-33 = "...Será que só nós mesmas não somos fortes o suficiente?"
22200-34 = "[s] \"Momoi...\""
22200-35 = "Será que... sozinhas... nós não vamos conseguir salvar a Aris-chan?"
22200-36 = "Nem a Aris-chan, nem nós...#nNinguém fez nada de errado..."
22200-37 = "Então por quê...? Por que isso está acontecendo...?"
22200-39 = "Midori..."
22200-40 = "Até aqui... todo mundo ajudou a gente..."
22200-41 = "Com o esforço de todo mundo somado... finalmente conseguimos chegar até aqui...!"
22200-42 = "Não tem outro jeito além de desistir agora...?"
22200-43 = "...Um... Um final ruim desses...#nEu jamais... jamais vou...!"
22200-47 = "Nem ferrando que eu vou aceitar um negócio desses!!"
22200-48 = "Uwaaah?!"
22200-49 = "Ah! Presidente!"
22200-50 = "Você acordou?!"
22200-51 = "[s] \"Neru, você está bem?\""
22200-53 = "Hã...?"
22200-58 = "Presidente! Por favor, não se esforce!#nSeus ferimentos são bem profundos!"
22200-59 = "Para de fazer escândalo... Eu tô bem."
22200-60 = "Olha, pela sua aparência você não tá nada bem..."
22200-61 = "Esquece isso... O que aconteceu?#nPor que tá todo mundo com essa cara de enterro?"
22200-62 = "[s] \"É que...\""
22200-64 = "Ah... Então vocês acham que já era por causa da situação?"
22200-65 = "..."
22200-66 = "Hã? Só pode ser brincadeira."
22200-67 = "Quê...?"
22200-68 = "Ei, tampinhas."
22200-73 = "Então os sentimentos de vocês não passavam disso?"
22200-74 = "\"N-Não passavam disso\"?! Não precisa falar desse jeito!"
22200-75 = "Bem, é verdade que meu braço mal mexe,"
22200-76 = "e pelo jeito rompi o ligamento da perna também..."
22200-77 = "Sério, só de dar um passo já me dá vontade de vomitar, mas..."
22200-78 = "Isso aí já é estar toda arrebentada?!"
22200-79 = "Mas escuta aqui... a ponto de desistir por tão pouco..."
22200-80 = "A determinação de vocês é tão frágil assim?"
22200-81 = "M-Mas, Neru-senpai, o seu corpo já...!"
22200-82 = "Hah! Não fica bancando a preocupada com os outros, não combina com vocês."
22200-83 = "Um arranhãozinho desses eu aguento na base da raça."
22200-84 = "Vocês vieram até aqui só para salvar a Aris, não foi?"
22200-85 = "Então vão até o fim sem desistir, custe o que custar. Entenderam?"
22200-86 = "N-Nós também não queremos desistir!"
22200-87 = "M-Mas contra uma personagem com cheat daquelas... como é que a gente vai vencer...?"
22200-88 = "Pois é..."
22200-89 = "Talvez... exista um jeito... quem sabe."
22200-93 = "Quê?!"
22200-94 = "[s] \"Yuzu, é s-sério mesmo?!\""
22200-95 = "Sim, naquela hora foi realmente por um instante... uma fração de segundo, mas..."
22200-97 = "(Agora...!)"
22200-99 = "Eu vi o ataque da Neru-senpai acertando ela."
22200-100 = "[s] \"Naquele intervalo minúsculo...?\""
22200-101 = "Isso aí, Yuzu! UZQueen! A prodígio da visão dinâmica!"
22200-102 = "Mas por que funcionou?#nSegundo as palavras da Presidente, nada deveria surtir efeito contra o \"Armamento\" da Toki-chan, não é?"
22200-103 = "B-Bem, isso eu também não sei direito..."
22200-105 = "...Isso é só uma hipótese, mas..."
22200-106 = "...É apenas uma hipótese, uma suposição pura e simples, mas..."
22200-107 = "E se o \"Armamento\" da Toki tiver uma brecha?"
22200-108 = "...Uma brecha?"
22200-109 = "A Presidente disse, não foi? Que o \"Armamento\", apoiado pela rede de Eridu,#nconsegue abater e desviar de qualquer ataque por meio de cálculos."
22200-110 = "[s] \"Sim. Na prática pareceu bem isso mesmo.\""
22200-111 = "Pois é. Pelo que vimos com os próprios olhos, não era mentira.#nSó que..."
22200-112 = "Eu pensei que, até agora, nunca vimos ela fazendo essas duas coisas ao mesmo tempo."
22200-113 = "...!#nEntendo, então é isso."
22200-114 = "Hã? Hum? Quê...?"
22200-115 = "Hum... O que isso quer dizer?"
22200-117 = "A habilidade do \"Armamento\" é realmente tão absurda que dá para chamar de cheat, mas..."
22200-118 = "Talvez só pareça assim,#ne o \"Armamento\" também tenha limites... coisas que ele não consegue fazer."
22200-119 = "Quando caíram do prédio, a Presidente disse que até a queda estava nos cálculos, não foi?"
22200-120 = "Ou seja, naquela hora a capacidade de processamento estava ocupada com a queda..."
22200-121 = "[s] \"E por não conseguir bloquear o ataque da Neru... abriu uma brecha...?\""
22200-122 = "Ah! Então é isso!"
22200-123 = "E-Então, se a gente conseguir criar uma brecha como naquela hora...!"
22200-124 = "Talvez a gente consiga... derrotar ela...?"
22200-125 = "Mas como? Duvido que a inimiga não saiba dessa fraqueza."
22200-126 = "Jogar ela do telhado não vai funcionar uma segunda vez..."
22200-127 = "N-Neru-senpai, você disse que... a curta distância... conseguiria vencer, não foi?"
22200-128 = "...É, eu venço.#nMas antes, a gente vai ter que dar um jeito naquela habilidade de cheat dela."
22200-129 = "E-Então eu tenho uma ideia."
22200-130 = "Contra alguém usando cheat..."
22200-131 = "Um \"combo infinito\" que nós podemos usar... dentro das regras do jogo."
22200-141 = "Neru-senpai..."
22200-147 = "...Não sei o que estão tramando, mas é inútil."
22200-148 = "Toki."
22200-149 = "...Sim, senhora."
22200-150 = "Ah, é assim que eu gosto..."
22200-151 = "Dessa vez vamos resolver isso de uma vez por todas!"
22200-153 = "Próximo;O Que Esse Nome Significa."
