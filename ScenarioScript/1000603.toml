[translation]
1000603-1 = "Перерыв на кампусе"
1000603-2 = "Кампус академии Геенна"
1000603-3 = "Я снова встретил Иори в академии Геенна как раз тогда, когда собирался вздремнуть."
1000603-4 = "..."
1000603-5 = "Что ты здесь делаешь, Сенсей...?"
1000603-6 = "[s] «Немного отдыхаю.»"
1000603-7 = "Тогда отдыхай в комнате отдыха, а ещё лучше — в гостиной Шале."
1000603-8 = "Тебе не неудобно на полу? Он весь каменный и неровный."
1000603-9 = "[s] «Вообще-то твёрдые каменные полы полезны для спины.»"
1000603-10 = "Кто добровольно выбирает неудобство?"
1000603-11 = "Я давно хотела спросить, Сенсей... Ты случайно не мазохист?"
1000603-12 = "Я заметила, что в прошлый раз тебе будто нравилось, когда тебя топтали и пинали... Тебе правда такое нравится?"
1000603-13 = "Я тебя не понимаю..."
1000603-14 = "[s] «Почему бы тебе самой не лечь и не проверить?»"
1000603-15 = "Ни за что. Люди подумают, что я сошла с ума."
1000603-16 = "Что? Думаешь, я изменю мнение, если попробую?"
1000603-17 = "То есть ты хочешь сказать, что делать выводы заранее — плохая привычка?"
1000603-18 = "Хм... В этом есть смысл."
1000603-19 = "Но всё же... Кто вообще спит посреди кампуса? Это странно."
1000603-20 = "Но если настаиваешь..."
1000603-21 = ""
1000603-22 = ""
1000603-23 = ""
1000603-26 = ""
1000603-27 = "[s] «Ну как? Каменный пол приятно прохладный, да?»"
1000603-28 = "Нет. Он твёрдый и неудобный..."
1000603-29 = "Я была права. Ты и правда извращённый мазохист..."
1000603-30 = "Фу..."
1000603-32 = "Недоразумений между мной и Иори становится всё больше."
