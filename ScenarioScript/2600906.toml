[translation]
2600906-1 = "Клубная комната как новенькая"
2600906-2 = "Я заглянул в клубную комнату, чтобы помочь с уборкой."
2600906-3 = ""
2600906-7 = "Клубная комната Отдела разработки игр"
2600906-8 = ""
2600906-9 = ""
2600906-10 = ""
2600906-14 = "[ns] «...Юзу?»"
2600906-15 = ""
2600906-16 = "С-Сенсей?! Когда вы пришли?"
2600906-17 = "О, только что. Что привело вас сегодня в Отдел разработки игр?"
2600906-18 = "[s] «Ты сказала, что будешь убираться совсем одна, поэтому я решил зайти и помочь.»"
2600906-19 = "А, понятно. Спасибо..."
2600906-20 = "Но правда, всё в порядке. Я почти закончила."
2600906-21 = "[s1] «А как же все пустые упаковки от закусок на полу?»\n[s2] «А как же все пустые банки на твоём столе?»"
2600906-24 = "А? А что с ними?"
2600906-25 = ""
2600906-27 = ""
2600906-29 = ""
2600906-31 = "...О. Кажется, произошло недоразумение."
2600906-32 = "Я говорила не об уборке клубной комнаты, а о чистке компьютера."
2600906-33 = "Память компьютера во многом похожа на обычное рабочее место. Если время от времени не удалять временные файлы, весь компьютер начинает работать медленнее."
2600906-34 = "В последнее время данных накопилось очень много, и я уже заметила, что это заметно влияет на скорость компьютера."
2600906-35 = "Так что под уборкой я имела в виду чистку ПК: удаление ненужных файлов и очистку реестра."
2600906-36 = "[ns] «Так вот почему ты сказала, что справишься сама.»"
2600906-38 = "[ns] «А когда ты собиралась убираться в клубной комнате?»"
2600906-39 = "Ч-Что...? Убираться в клубной комнате?"
2600906-40 = "Эм, не знаю... Над игрой ещё много работы, да и остальных членов клуба, похоже, беспорядок не беспокоит, так что... я собиралась заняться этим потом..."
2600906-41 = "[s3] «Чем дольше откладывать уборку, тем больше времени она займёт!»\n[s4] «Раз уж я здесь, давай уберёмся сейчас! Я помогу!»"
2600906-44 = "Но... у меня нет сменной одежды, а я не хочу испачкать эту..."
2600906-45 = "[s5] «Не волнуйся. Я подготовился.»\n[s6] «Я подумал, что тебе может что-нибудь понадобиться, поэтому заехал в Maidramatic и забрал твою форму!»"
2600906-48 = "Ч-Что? Зачем?"
2600906-49 = "Но, наверное... я не хочу, чтобы беспорядок стал ещё хуже, а надеть мне всё равно больше нечего..."
2600906-50 = ""
2600906-52 = ""
2600906-54 = ""
2600906-56 = ""
2600906-58 = "И в конце концов, этот наряд как раз предназначен для уборки."
2600906-59 = "Я переоденусь в шкафу."
2600906-62 = ""
2600906-63 = ""
2600906-65 = ""
2600906-68 = "Мы с Юзу усердно убирали клубную комнату."
2600906-69 = ""
2600906-70 = "...Кажется, закончили. Спасибо за помощь."
2600906-71 = "[s] «Хорошая работа, Юзу.»"
2600906-72 = "Вы были правы. Хорошо, что мы всё-таки убрались."
2600906-73 = "Когда смотришь на аккуратно прибранную комнату, сразу появляется мотивация."
2600906-74 = "Хотя носить здесь форму горничной всё равно неловко... Пойду переоденусь, пока никто не увидел."
2600906-75 = ""
2600906-77 = ""
2600906-80 = "Президент Юзу! У вас есть минутка? У меня вопрос."
2600906-81 = "Босс в игре, которую я у вас одолжила, двигается так непредсказуемо... по... шаб...ло...ну..."
2600906-82 = ""
2600906-84 = ""
2600906-86 = "Эм. А..."
2600906-87 = "..."
2600906-88 = "Эм. В общем..."
2600906-89 = "Простите! Простите! Я опять помешала!"
2600906-90 = "Ты всё не так поняла..."
2600906-92 = "...Я зайду позже!"
2600906-93 = ""
2600906-94 = "Я... я... я не могу..."
2600906-96 = "Юзу снова спряталась в шкафу. На этот раз успокаивать её пришлось ещё дольше."
