[translation]
10034170-1 = "2 дня назад: Ради победы"
10034170-4 = "Осталось всего два дня. Время и правда пролетело."
10034170-5 = "Может, ещё раз повторим всё, что мы делали?"
10034170-6 = "От одних твоих слов я начинаю нервничать. А ведь сегодня даже не день прослушивания."
10034170-7 = "Если нервозность заставляет тренироваться, значит, от неё есть польза."
10034170-8 = "«Относись к тренировке как к настоящей игре, а к настоящей игре — как к тренировке». Вот настрой победителя."
10034170-9 = "И не начинайте думать: «Победим или проиграем — всё равно это будет хороший опыт». Так говорят проигравшие, чтобы утешить себя."
10034170-10 = "Важен только РЕЗУЛЬТАТ! Мы будем наслаждаться этой семлой на груде трупов наших врагов!"
10034170-12 = "Ну и манера у неё говорить..."
10034170-13 = "И что она будет делать, если после всего этого мы проиграем?"
10034170-14 = "Ну... хороший вопрос. Наверное, она просто такая."
10034170-15 = "Ну, раз уж так, давайте подыграем. Поднимем себе боевой дух!"
10034170-17 = "Держимся до самого конца!!"
