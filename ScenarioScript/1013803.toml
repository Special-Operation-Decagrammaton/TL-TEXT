[translation]
1013803-1 = "Я этого не приму!"
1013803-2 = "Поздно ночью я пришёл к месту встречи."
1013803-4 = ""
1013803-5 = "С-Сюда! Сенсей!"
1013803-6 = "[s1] «Мы поедем на автобусе? Так поздно?»\n[s2] «Куда мы едем?»"
1013803-9 = "Ну, дело в том..."
1013803-10 = "Начиная прямо сейчас... мы собираемся..."
1013803-11 = "...исследовать школу. Заброшенную. И говорят, там водятся призраки."
1013803-12 = "[s] «Школу с привидениями?!»"
1013803-13 = "Я-я должна!"
1013803-14 = "Я сказала старшекурсницам из Оккультного общества, что докажу: призраков не существует."
1013803-15 = "[s] «Вроде как раз их тема. Почему они не пошли?»"
1013803-16 = "Я сама им запретила."
1013803-17 = "Уверена, они опять устроили бы какую-нибудь дурацкую шутку и попытались меня напугать."
1013803-18 = "К тому же... только у меня есть разрешение на выход."
1013803-19 = "Но всё же... уже так поздно. И место немного подозрительное, понимаете. Поэтому я решила, что одной идти не стоит..."
1013803-20 = "[s] «Поэтому позвала меня?»"
1013803-21 = "Ну, сомневаюсь, что что-то случится, но всё же. Никакие призраки не появятся."
1013803-22 = "Если хотите отплатить мне за тот... «инцидент со штанами», это поможет."
1013803-23 = "[s] «Конечно! Я тебя защищу!»"
1013803-24 = "*вздох* Как мы вообще до этого дошли...?"
1013803-25 = "А. Вот и автобус."
1013803-30 = "Он высадил нас в уединённом районе."
1013803-31 = "Заброшенная школа дальше по этой улице."
1013803-32 = "Может, совпадение, но слухи говорят, что её коридоры мучают загадочные крики... с самого дня открытия школы."
1013803-33 = "...Говорят, крики слышно до сих пор, хотя учеников уже давно нет."
1013803-34 = "Некоторые студенты даже теряли сознание, исследуя её. Поэтому сюда больше никто не ходит."
1013803-35 = "[s] «Какая тщательная подготовка.»"
1013803-36 = "Е-Естественно! Всегда нужно изучать место, куда собираешься."
1013803-37 = "Надо начинать. Пошли, докажем, что призраков не существует!"
1013803-42 = "Мы вошли в заброшенную школу."
1013803-43 = "[ns] «Хм... Тут немного жутковато, нет?»"
1013803-44 = "Говорят, в этой школе есть «Семь тайн»."
1013803-45 = "Первая — громкий стук в окно посреди ночи."
1013803-46 = "Вторая: существует тринадцатая ступенька, которой... на самом деле нет."
1013803-47 = "Третья — жуткая тень, бродящая по коридору для преподавателей."
1013803-48 = "Окровавленный цветок сакуры, прижатый к окну класса, — четвёртая тайна."
1013803-49 = "Пятая: сломанные динамики класса издают звук школьного звонка."
1013803-50 = "Шестая, о которой мы уже говорили, — подозрительные крики из механической комнаты в подвале."
1013803-51 = "А седьмая тайна..."
1013803-52 = "Она настолько загадочная, что никто не знает, в чём она заключается."
1013803-53 = "Говорят, если хотя бы УЗНАТЬ, что это за тайна, на тебя падёт ужасное проклятие."
1013803-54 = "[s] «Звучит как вполне обычные страшилки.»"
1013803-55 = "П-Правда? Просто... обычные страшилки, да?"
1013803-56 = "Вот поэтому я и проверю все эти глупые слухи, сделаю фотографии и покажу остальным."
1013803-57 = "А поскольку НИЧЕГО не произойдёт, я наконец докажу, что призраков—"
1013803-58 = ""
1013803-61 = "...?!"
1013803-62 = "Ч-Ч-Что это...?"
1013803-63 = ""
1013803-66 = "И-и...!"
1013803-67 = ""
1013803-69 = ""
1013803-70 = "[ns] «Громкий стук в окно! Посреди ночи...!»"
1013803-71 = "Н-Но здесь кроме нас никого!"
1013803-72 = "[s] «Давай проверим.»"
1013803-73 = "...!!"
1013803-74 = "[s3] «Не переживай.»\n[s4] «Я ни за что не отпущу твою руку.»"
1013803-77 = "Я-я не переживала!"
1013803-78 = ""
1013803-80 = ""
1013803-81 = ""
1013803-82 = "Л-Ладно! П-Пойдём посмотрим!"
1013803-83 = ""
1013803-86 = ""
1013803-87 = ""
1013803-88 = ""
1013803-89 = ""
1013803-91 = "Кар! Ка-а-ар...!"
1013803-92 = ""
1013803-94 = ""
1013803-95 = "А? Что? Это просто ворона?"
1013803-96 = "Зачем она клевала окно? Здесь ведь даже еды нет."
1013803-97 = "[s] «А что, если это была не ворона? Что если на самом деле призрак...?!»"
1013803-98 = "Шья-а! Ни за что!"
1013803-99 = "Сделаем фото. Мне нужны доказательства, что вся эта суматоха — всего лишь скучающая ворона, ищущая еду."
1013803-100 = ""
1013803-102 = ""
1013803-103 = ""
1013803-105 = ""
1013803-106 = "Вот. Как получилось? Я ничего не испортила, да?"
1013803-107 = "Одна готова. Продолжаем и закрываем остальные так называемые Семь тайн!"
1013803-108 = ""
1013803-109 = "Несмотря на энтузиазм, Рэна так и не отпустила мою руку..."
1013803-110 = ""
1013803-111 = "[ns] «(Мне тоже не стоит отпускать её...)»"
1013803-113 = "Мы с Рэной расследовали все тайны."
1013803-114 = ""
1013803-115 = "Подозрительная тень, крадущаяся по коридору..."
1013803-116 = ""
1013803-118 = ""
1013803-120 = ""
1013803-121 = ""
1013803-122 = "Класс с «якобы» окровавленными цветами сакуры..."
1013803-123 = ""
1013803-124 = ""
1013803-125 = ""
1013803-126 = ""
1013803-127 = "Механическая комната в подвале без единого крика..."
1013803-128 = ""
1013803-129 = ""
1013803-130 = ""
1013803-131 = ""
1013803-137 = "Мы посетили все места из Семи тайн и собрали фотодоказательства."
1013803-138 = "Как и ожидалось, ни одного призрака не появилось."
1013803-140 = "Фух, я так и знала. Никаких призраков не существует."
1013803-141 = "Всё оказалось недоразумениями из-за бродячих животных или разваливающихся сооружений."
1013803-142 = "Отлично! Раз всё собрано, пора возвращаться. Не могу дождаться, когда покажу старшекурсницам!"
1013803-143 = "[s5] «И хотя мы доказали, что призраков не существует...»\n[s6] «Ты всё равно хочешь держаться за руки?»"
1013803-146 = "Э-Это..."
1013803-147 = "...н-не потому, что мне страшно!"
1013803-148 = "Э-Это чтобы мы не упали! Здесь темно! Кто-нибудь может споткнуться."
1013803-149 = "[s] «Да. Не хотелось бы здесь получить травму.»"
1013803-151 = "Я благополучно проводил Рэну обратно в Вайлдхант."
1013803-152 = ""
1013803-153 = ""
1013803-154 = ""
1013803-155 = ""
1013803-157 = "И как раз когда мне показалось, что всё закончилось без проблем..."
