[translation]
1301405-1 = "Купальники и костёр"
1301405-3 = "Когда пришло время, я отправился на пляж встретиться с Рэнгэ."
1301405-7 = ""
1301405-8 = "Здравствуйте, Наставник!"
1301405-9 = "Нельзя терять время! Давайте разводить костёр."
1301405-10 = ""
1301405-12 = ""
1301405-13 = "Хм? Не видите дров?"
1301405-14 = "А вы ожидали, что они будут? Для тренировки это было бы слишком просто. Мы должны сами собрать и сложить дрова!"
1301405-15 = ""
1301405-17 = ""
1301405-18 = "Хорошо! Начнём складывать вон там!"
1301405-19 = "[s] «Д-Да! Юность — это боль и страдания!»"
1301405-20 = "Вот это настрой, Сенсей!"
1301405-21 = "Вот так я хочу сложить дрова для костра."
1301405-22 = "Немного необычно, но, думаю, так будет запоминающееся."
1301405-23 = "[s] «Необычно? В каком смысле?»"
1301405-24 = "Вот, смотрите! Я нарисовала чертёж!"
1301405-25 = "Тогда начнём! Ради нашей юности!"
1301405-26 = "[s] «Р-Ради нашей юности...!»"
1301405-32 = "Энтузиазм Рэнгэ оказался заразительным, и я с азартом начал готовить костёр вместе с ней."
1301405-34 = "Много дров спустя..."
1301405-37 = ""
1301405-38 = "Та-дам! Наш дракон готов!"
1301405-39 = ""
1301405-41 = ""
1301405-43 = "Он значительно больше, чем на чертеже..."
1301405-44 = "Кажется, рядом с вами я немного увлеклась. Хи-хи."
1301405-45 = "[s] «Даже немного жалко поджигать это...»"
1301405-46 = "А я так не думаю! Если не зажечь, получится просто «лагерь» без «костра»!"
1301405-47 = "Так тоже неплохо, но сидеть у огня — отдельное удовольствие."
1301405-48 = "[s] «Ладно... но эта гора растопки выглядит пугающе.»"
1301405-50 = "[ns] «...Ну, что самое плохое может случиться?»"
1301405-51 = "Зажжём вместе, хорошо?"
1301405-52 = ""
1301405-54 = ""
1301405-57 = "Раз. Два. Три...!"
1301405-58 = ""
1301405-60 = ""
1301405-63 = "[log]...Только в этот момент мы поняли свою ошибку.[/log]"
1301405-67 = "[log]Что если ткнуть разъярённого дракона,[/log]"
1301405-68 = "[log]он ответит адским пламенем...[/log]"
1301405-73 = ""
1301405-74 = "[ns] «К-Кажется, у нас проблема.»"
1301405-75 = "Я СОВСЕМ не этого ожидала!!"
1301405-76 = ""
1301405-81 = ""
1301405-82 = "Ч-Что это вообще такое?"
1301405-83 = "Ай! Не подходите! Искры летят во все стороны."
1301405-84 = ""
1301405-86 = ""
1301405-88 = "У нас... кажется, проблема."
1301405-89 = "[s] «Огонь слишком сильный!»"
1301405-90 = ""
1301405-92 = ""
1301405-93 = "Я плесну воды!"
1301405-94 = ""
1301405-105 = "[ns] «Он... Он стал БОЛЬШЕ?!»"
1301405-108 = "Пламя дракона так просто не укротить! Но и меня тоже!"
1301405-109 = ""
1301405-111 = ""
1301405-112 = "Это битва!"
1301405-113 = ""
1301405-116 = "Ты подчинишься, огонь!"
1301405-117 = ""
1301405-132 = "...Рэнгэ наконец удалось потушить пламя."
1301405-136 = "Никто из нас не ожидал, что оно разгорится настолько сильно..."
1301405-137 = ""
1301405-139 = ""
1301405-140 = "Фух. Наконец потушили."
1301405-141 = "...Блин, не думала, что так выйдет. Нужно было быть осторожнее."
1301405-142 = "[s] «В итоге никто не пострадал, так что пусть это будет... уроком юности!»"
1301405-143 = ""
1301405-145 = ""
1301405-146 = "Погодите. Наставник! Ваше лицо!"
1301405-147 = "...Пф."
1301405-148 = "Ахахаха! Вы весь в саже! Прямо как панда."
1301405-149 = "Давайте я вытру."
1301405-150 = "[s] «П-Пожалуйста.»"
1301405-151 = ""
1301405-153 = ""
1301405-155 = ""
1301405-156 = "Сажи так много."
1301405-157 = "Закройте глаза на секунду, пожалуйста."
1301405-158 = ""
1301405-164 = ""
1301405-166 = ""
1301405-167 = "..."
1301405-168 = "(...Я никогда раньше не видела лицо Наставника так близко.)"
1301405-169 = "(Наставник прямо передо мной...)"
1301405-170 = "(Это... тоже часть моей юности?)"
1301405-171 = "[s] «Рэнгэ? Ты всё вытерла?»"
1301405-172 = ""
1301405-174 = ""
1301405-175 = "Ч-Что?! Да! Я точно не думала ни о чём странном!"
1301405-176 = "Закройте глаза, Наставник! Я ещё не всё вытерла."
1301405-178 = "Рэнгэ выглядела смущённой, пока стирала остатки сажи."
1301405-179 = ""
1301405-182 = "Возможно, именно тот момент... и был чувством «юности», которое она искала."
