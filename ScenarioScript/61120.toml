[translation]
61120-1 = "Эпизод 12;Экскурсия 2"
61120-2 = ""
61120-3 = "Вон там, Субару. Смотри! На дереве..."
61120-4 = ""
61120-6 = ""
61120-7 = ""
61120-8 = "*всхлипывает* Моя малышка... Моя кошечка... *всхлипывает*"
61120-9 = "Мяу..."
61120-10 = ""
61120-12 = ""
61120-13 = ""
61120-14 = "Котёнок застрял на дереве?"
61120-15 = "Наверное, залез наверх и не понял, насколько трудно будет спуститься."
61120-16 = "Хех. Я только читала о таких случаях."
61120-17 = "Как его снять...? Я старалась изо всех сил, но ничего толком не смогла сделать."
61120-18 = "..."
61120-19 = "У меня есть идея. Разберёмся с этим по-ариусски."
61120-20 = "Простите! Отойдите, пожалуйста!"
61120-21 = ""
61120-24 = "Няяяа?!"
61120-25 = "Ч-Что-о-о?!"
61120-26 = ""
61120-29 = "Ч-Что вы делаете?!"
61120-30 = "Она только что... выстрелила в котёнка?"
61120-31 = ""
61120-34 = "Ш-ш-ш-ш!!"
61120-35 = ""
61120-37 = "А... Он от страха спрыгнул вниз."
61120-38 = ""
61120-42 = "Поймала. Теперь ты в безопасности."
61120-43 = ""
61120-44 = ""
61120-45 = "Вот, ваша кошечка..."
61120-46 = "*шмыгает носом*..."
61120-47 = "УААААА!"
61120-48 = "Эм, э-эм...?"
61120-49 = "О чём ты вообще думала?!"
61120-50 = "А если бы моя кошка пострадала?! Или ещё хуже?"
61120-51 = "Я-Я просто..."
61120-52 = "Животные обычно замирают, когда боятся."
61120-53 = "Поэтому я просто хотела достаточно её шокировать, чтобы она вышла из этого состояния..."
61120-54 = "Чему вообще детей нынче в школе учат?!"
61120-56 = "А? Посмотрите на эту эмблему! Не может быть..."
61120-57 = "Нет, может! Они студенты Ариуса?"
61120-58 = "Они?! Разве не они устроили трагедию с Эдемским договором?"
61120-59 = "Что вы, хулиганки, делаете в нашем районе?!"
61120-60 = ""
61120-62 = ""
61120-64 = "...Уф. Вот почему воспитание ребёнка так важно."
61120-65 = "Не только они виноваты. Наверняка часть проблемы лежит и на Кивотосе..."
61120-66 = "Нас называют Академическим городом, но посмотрите, насколько запущено образование студентов."
61120-67 = "Но в других районах всё далеко не настолько ужасно..."
61120-68 = "В НОРМАЛЬНОЙ школе никогда бы не позволили детям бесконтрольно носиться, как в Ариусе."
61120-69 = "Это правда. Взрывы и перестрелки могут быть обычным делом, но некоторые дети просто плохие."
61120-70 = ""
61120-72 = ""
61120-73 = "..."
61120-74 = "Пойдём, милая. Не подходи слишком близко к этим людям."
61120-75 = "Почему...?"
61120-76 = "Просто будь хорошей девочкой и слушай маму, хорошо?"
61120-77 = "Хорошо..."
61120-78 = ""
61120-80 = ""
61120-81 = ""
61120-82 = ""
61120-83 = "Э-Э-э..."
61120-84 = "А-а-а-а-а...!"
61120-85 = "Майя?! Что случилось?!"
61120-86 = ""
61120-89 = "Тебе пять дней не платили?"
61120-91 = "То есть у вас вообще нет никаких академических документов?"
61120-93 = "Проваливай. Если работу не берёшь, я даже разговаривать с такими, как ты, не хочу."
61120-95 = "[log]Я всегда думала, что снаружи...[/log]"
61120-97 = "[log]...всё будет иначе.[/log]"
61120-101 = "[log]Для беглецов не существует рая.[/log]"
61120-104 = "[log]Но я всё равно цеплялась за свои мечты.[/log]"
61120-107 = "[log]Я отчаянно тянулась к тому, что называют «надеждой».[/log]"
61120-110 = "Возьми себя в руки!"
61120-111 = ""
61120-113 = ""
61120-114 = "С-Субару...?"
61120-115 = "Я просто кое-что вспомнила."
61120-116 = "Тот день... был точно таким же..."
61120-117 = "Ты имеешь в виду...?"
61120-118 = "Давай, Майя. Поднимайся."
61120-119 = "Если мы так и останемся..."
61120-120 = "..."
61120-121 = "Люди ТОЧНО начнут нас осуждать."
61120-122 = "Субару, я..."
61120-123 = "Эй. Сейчас ты в безопасности."
61120-124 = "Всё нормально. Всё будет хорошо."
61120-125 = "..."
61120-126 = "Даже я... чуть не поддалась эмоциям."
61120-127 = "Я не могу позволить этому повториться. Я должна быть той, кто присматривает за всеми."
61120-129 = "[log]Если всё сложится так, [wa:500]думаю, это будет прекрасно.[/log]"
61120-132 = ""
61120-134 = ""
61120-135 = "Ну и ну. Этот Сенсей... Рядом с ним нельзя терять бдительность."
61120-136 = "А? Что насчёт Сенсея?"
61120-137 = "Ничего. Не переживай."
61120-138 = "Сенсей... не плохой человек."
61120-139 = "В относительном смысле, пожалуй, его можно отнести к хорошим."
61120-140 = "Но не все взрослые такие. И мир тоже состоит не только из хорошего. Это точно."
61120-141 = "Субару...? Ты точно в порядке?"
61120-142 = "Ага-ага. Не волнуйся обо мне."
61120-143 = "Нам удалось благополучно вернуть котёнка хозяину."
61120-144 = "Вот что важно, верно?"
61120-145 = "Н-Наверное?"
61120-146 = "Хорошо. Пойдём обратно."
61120-147 = "Нам лучше не привлекать лишнего внимания."
61120-149 = ""
61120-150 = "Чай, чай!"
61120-151 = "Помните, когда нам приходилось пить только тёплую воду?"
61120-152 = "Благодаря Субару у нас теперь есть даже такие вещи, как «чай»!"
61120-153 = "Но здесь он почему-то ощущается совсем иначе!"
61120-154 = "Точно? Вокруг все куда-то спешат, а мы просто стоим здесь, ничего не делаем и пьём чай..."
61120-155 = "Это потрясающе!"
61120-156 = ""
61120-158 = ""
61120-159 = ""
61120-160 = "*вздыхает*"
61120-161 = "[s] «Всё в порядке? Ты выглядишь задумчивой.»"
61120-162 = "Ч-Что?! Нет. Ничего. Я в порядке!"
61120-163 = "[s] «Правда...? Но—»"
61120-164 = "Какая неожиданность. Здравствуйте, Сенсей."
61120-165 = ""
61120-166 = "А кто все эти люди?"
61120-167 = ""
61120-169 = ""
61120-170 = ""
61120-172 = "Здравствуйте, Сенсей! И все мои ещё незнакомые друзья!"
61120-174 = "Ч-что?!"
61120-175 = "Эм, п-привет...?"
61120-176 = ""
61120-178 = ""
61120-179 = ""
61120-180 = "[ns] «Что Патрульная команда делает здесь?! И почему вы не учитесь?!»"
61120-181 = "М-Мы учимся! Мы просто... ещё и патрулируем!"
61120-182 = "Учёба и общественная безопасность одинаково важны!"
61120-183 = "А...? Я уже использовала эту отговорку?"
61120-184 = "Использовала, Рейса."
61120-185 = "О! Хорошо слышать!"
61120-186 = "(...Хотя ничего хорошего в этом нет.)"
61120-187 = "В любом случае, кто эти люди?"
61120-189 = "М-Мы..."
61120-190 = "Ну, эм..."
61120-191 = ""
61120-193 = ""
61120-194 = "Мы тоже студенты Сенсея."
61120-196 = "А? Правда? Мы тоже!"
61120-197 = "..."
61120-198 = "Так вы из Ариуса... верно?"
61120-200 = "!!"
61120-201 = "..."
61120-203 = "«Ариус»...?"
61120-204 = ""
61120-205 = "А, точно! Теперь вспомнила! Я слышала об этом!"
61120-206 = "Хи-хи-хи! Если подумать, даже тогда этот идол Патрульной команды, эта Узава Рейса...!"
61120-207 = "Да-да. Конечно, именно так."
61120-208 = "Я постаралась объяснить ей всё как можно проще и беспристрастнее. Я справилась, Сенсей?"
61120-209 = "[s] «Да, отлично. Спасибо, Сузуми.»"
61120-210 = "Спасибо."
61120-211 = ""
61120-213 = ""
61120-215 = ""
61120-216 = ""
61120-217 = "(Значит, именно так Тринити воспринимает то, что произошло, и участие Ариуса...)"
61120-218 = "(...Люди и правда склонны толковать события так, как выгоднее всего им самим. И всё же...)"
61120-219 = "(Хех...)"
61120-220 = ""
61120-222 = ""
61120-223 = ""
61120-224 = "В любом случае, приятно видеть, что вы все здесь хорошо проводите время."
61120-225 = "А? Разве это не типа совершенно нормально? Почему это приятно?"
61120-227 = "..."
61120-229 = "Э-э-э... Кажется, я наступила на какую-то странную мину. Простите!"
61120-230 = "Нет. Всё в порядке. С точки зрения студенты Тринити это и правда трудно понять."
61120-231 = "..."
61120-232 = "Так это и есть Патрульная команда? Я слышала, вы патрулируете район без оплаты и признания."
61120-233 = "Именно! Мы везде стоим на страже справедливости!"
61120-234 = "Р-Рейса...?"
61120-235 = "Впечатляет."
61120-236 = "Хотя свободного времени у вас, должно быть, полно."
61120-237 = "Ага! Тринити, Ариус — если честно, я вообще не очень во всём этом разбираюсь!"
61120-238 = "Мы просто делаем это, потому что сами хотим!"
61120-239 = "..."
61120-240 = "Поэтому... мы тоже хотим помочь вам по-своему!"
61120-241 = "Что...?"
61120-242 = "Как?"
61120-243 = "Вот так!"
61120-245 = "Смотри на этих! Эти бандиты выкопали на дороге ямы, чтобы собирать плату с прохожих..."
61120-246 = "А вот фотография, где я запихиваю их в собственную яму головой вперёд!"
61120-247 = ""
61120-249 = ""
61120-250 = "Ого-о-о... Так вот как выглядит человек, которого выкопали вверх ногами..."
61120-251 = "Это уморительно! А-ха-ха-ха!"
61120-252 = "А потом вот эта фотография...!"
61120-253 = ""
61120-255 = ""
61120-256 = ""
61120-257 = "Я рада, что они все поладили."
61120-258 = "Рейса бывает немного... чрезмерно энергичной."
61120-259 = "Хорошо, что здесь это, похоже, всем идёт на пользу."
61120-260 = "..."
61120-261 = "..."
61120-262 = "А? Ребята?"
61120-263 = "Если мы с Рейсой сделали что-то обидное..."
61120-264 = ""
61120-266 = ""
61120-267 = ""
61120-268 = "Эм..."
61120-269 = "[s1] «Не волнуйся, Сузуми.»\n[s2] «Любые отношения должны развиваться в своём темпе.»"
61120-272 = "Я понимаю."
61120-273 = "Просто хотелось бы, чтобы я могла что-то сделать."
61120-274 = ""
61120-276 = ""
61120-277 = ""
61120-278 = ""
61120-279 = "Ну как вы? Повеселились с Рейсой?"
61120-280 = "Субару, мы..."
61120-281 = "Просто... как-то..."
61120-282 = "..."
61120-284 = "Привет! Я Узава Рейса! Тебя зовут... Субару, да?"
61120-286 = "..."
61120-287 = ""
61120-289 = ""
61120-290 = "Да, верно. Я так и не представилась как следует. Приятно познакомиться, Рейса. И с тобой тоже, Сузуми."
61120-291 = "Мне правда очень жаль, если мы вас чем-то расстроили."
61120-292 = "Вовсе нет. Ничего подобного."
61120-293 = "Если хорошенько подумать, само наше присутствие здесь немного невежливо."
61120-294 = "А? Я совсем так не думаю. Я очень рада, что встретила вас всех!"
61120-295 = "..."
61120-296 = "Даже если это всего лишь слова, приятно такое слышать. Спасибо."
61120-297 = "Это похоже на обещание, что если просто продолжать жить, всё как-нибудь наладится."
61120-298 = "Я тоже так думаю! Потому что в мире полно любви и мира!"
61120-299 = "..."
61120-300 = "Позволь спросить. Допустим, есть любовь и есть мир."
61120-301 = "Но что, если их нет? Если всё не складывается так, как ты думаешь, что тогда делать?"
61120-302 = "Э-Э-э...?"
61120-303 = ""
61120-306 = "[ns] «...»"
61120-307 = ""
61120-308 = "Спрашиваете, зачем я внезапно подняла такую страшную тему? Хм... без причины?"
61120-309 = "Не всегда ведь нужна какая-то особая причина, чтобы о чём-то заговорить, верно?"
61120-310 = ""
61120-311 = ""
61120-312 = ""
61120-313 = "[ns3] «Сузуми, почему бы тебе не ответить?»\n[ns4] «Просто выскажи свою точку зрения.»"
61120-316 = "М-Мне? Хм..."
61120-317 = "Поняла, Сенсей. Я постараюсь."
61120-318 = "Ну, я вовсе не считаю само собой разумеющимся, что всё всегда будет хорошо."
61120-319 = "В жизни чаще что-нибудь идёт не так, чем наоборот. Просто так устроено."
61120-320 = "Но мне кажется, верить всё равно нужно."
61120-321 = "Это не столько чувство, сколько выбор. Выбор идеалов, которым мы хотим следовать."
61120-322 = "...Идеалов, да."
61120-323 = "Да."
61120-324 = "Эти идеалы могут не осуществиться сегодня, завтра, а может, никогда."
61120-325 = "Но если каждый день я могу сделать хотя бы один шаг к ним, для меня этого достаточно."
61120-326 = "Прогресс не происходит за одну ночь. Он складывается из всех наших маленьких решений."
61120-327 = "Поэтому мы и не ждём оплаты за свои действия. Справедливость, которую мы защищаем, и есть наша награда."
61120-328 = "Точно! Вот оно! Этот ответ такой типичный для тебя, Сузуми!"
61120-329 = "Ха-ха. Понятно. Это было очень полезно."
61120-330 = ""
61120-332 = ""
61120-333 = "(Идеалистичные оптимистки до мозга костей. Большинство людей считает это достоинством.)"
61120-334 = "(Так легко не замечать, что оптимизм — всего лишь результат хорошей среды и обстоятельств.)"
61120-335 = ""
61120-337 = ""
61120-339 = ""
61120-340 = "Эм, Субару...?"
61120-341 = "Ага?"
61120-342 = "А... Понятно. Хорошо."
61120-343 = "Сенсей. Простите нас ненадолго. И вас тоже, члены Патрульной команды."
61120-344 = "Я немного прогуляюсь с этими двумя."
61120-345 = "[s] «А? О-О. Конечно...»"
61120-346 = ""
61120-348 = ""
61120-350 = ""
61120-351 = ""
61120-352 = ""
61120-353 = "Что такое?"
61120-354 = "...Ну, я догадываюсь."
61120-355 = "Вам было тяжело, да?"
61120-356 = "...Да?"
61120-357 = "Мне кажется, после тех «уроков» стало даже хуже."
61120-358 = "Хм? Почему?"
61120-359 = "Те, кто так быстро подружился с Патрульной командой, — это как раз те, кто очень старается на занятиях."
61120-360 = "But for us..."
61120-361 = "Мы ненавидим слушать, как эти люди говорят."
61120-362 = "Это просто... ужасно нас злит."
61120-363 = "...Мы плохие люди, Субару?"
61120-364 = "Нет. Вовсе нет."
61120-365 = ""
61120-367 = ""
61120-368 = "Это самая естественная реакция на свете. По крайней мере, я бы чувствовала то же самое."
61120-369 = "Тот мир, в котором мы жили... Эти дети из Тринити даже представить его не способны."
61120-370 = "Субару...!"
61120-371 = "В конце концов, легко верить, что всё как-нибудь наладится."
61120-372 = "Легко верить, что в мире нет греха и все его искривлённые части однажды сами распутаются..."
61120-373 = "...Но из всего, что я видела, именно такие лёгкие убеждения дальше всего от реальности."
61120-374 = "Слышали? Сейчас говорят, что богатые люди добрые."
61120-375 = "Милые, мягкие и даже спокойные."
61120-376 = "Потому что... богатым ни в чём не приходится нуждаться."
61120-377 = "В их глазах мир, наверное, выглядит таким красивым и мирным местом."
61120-379 = "Ай..."
61120-380 = "But for us..."
61120-382 = "Именно. Это их мир. Наш совсем не похож на их мягкую постель из цветов."
61120-383 = "Такие привилегированные дети никогда не поймут."
61120-384 = "Они могут смотреть на нас, охать, ахать и жалеть. А в итоге просто получают приятное чувство собственного превосходства."
61120-385 = "Если бы эти соплячки увидели тот ад, через который прошли мы..."
61120-386 = "...они отвернулись бы? Или остались бы верны своим «убеждениям»?"
61120-387 = "И ещё..."
61120-388 = "Как долго они будут отводить глаза от собственной причастности к созданию этого ада?"
61120-389 = "С-Субару? Ты в порядке?"
61120-390 = "Твоё лицо...! Ты выглядишь..."
61120-392 = "А? Что с моим лицом?"
61120-394 = ""
61120-396 = ""
61120-397 = "Н-Неважно... Ничего..."
61120-399 = "...?"
61120-400 = "В любом случае, уже пора, да? Я скажу Сенсею, что нам стоит возвращаться."
61120-401 = "Домой. В наш Ариус."
61120-417 = ""
61120-418 = "[ns] «Всем понравилась экскурсия?»"
61120-419 = "Да!"
61120-420 = "...Да."
61120-421 = ""
61120-423 = ""
61120-424 = ""
61120-425 = "С возвращением, Сенсей, все."
61120-426 = "Вы как раз вовремя. У нас возникла... ситуация, где может понадобиться ваша помощь."
61120-427 = ""
61120-430 = "[ns] «А...?»"
61120-431 = ""
61120-432 = ""
61120-433 = "Э-Эм. Сенсей. Вон там."
61120-434 = ""
61120-436 = ""
61120-437 = "Идите вперёд с верой и честью в сердце."
61120-438 = "Медицина не знает границ."
61120-440 = "...?"
61120-441 = "[s] «?!»"
61120-442 = ""
61120-443 = ""
61120-444 = "Добрый вечер, Сенсей. И..."
61120-445 = "...всем остальным тоже."
