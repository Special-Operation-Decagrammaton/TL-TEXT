[translation]
90100060-1 = "Эпизод 6;Правда и ложь"
90100060-2 = "Штаб отряда FOX"
90100060-4 = ""
90100060-5 = ""
90100060-6 = "Я вернулась!"
90100060-7 = "Отлично. Я уже привела оборудование в порядок и разложила всё по местам."
90100060-8 = "Отряд FOX, докладываем."
90100060-9 = "[s1] «Хорошая работа, все!»\n[s2] «Наверное, тяжело было работать в такую жару.»"
90100060-12 = "Вовсе нет. Спасибо, что присматривали за нами, Сенсей."
90100060-13 = "Раз все вернулись, давайте сразу систематизируем данные..."
90100060-14 = "Погоди-погоди-погоди."
90100060-15 = "Неужели даже перерыв попросить нельзя?"
90100060-16 = "Я насквозь мокрая от пота и чувствую себя отвратительно. Можно хотя бы в душ?"
90100060-17 = "[s] «А, ну...»"
90100060-18 = "Прости, но, возможно, придётся ещё немного подождать. Комната отдыха занята."
90100060-19 = "Представители Студенческого совета всё ещё ходят туда-сюда."
90100060-20 = "Ладно-ладно. Комнату отдыха я обойду. Но что насчёт душевой?"
90100060-21 = "Нет... Там тоже нельзя терять бдительность. Это всё ещё общественное место, вас могут заметить."
90100060-22 = "Несколько дней назад я чуть не столкнулась там с командиром отряда Цукиюки."
90100060-23 = "Мияко?! Что она здесь делала?!"
90100060-24 = "Знаешь, я не спросила... Но если бы я сразу не развернулась, она бы мгновенно меня узнала."
90100060-25 = "Сенсей, что здесь вообще происходит? Почему отряд RABBIT пользуется душевыми Шале?"
90100060-26 = "О, вы их ЗАСТАВЛЯЕТЕ? Шантажируете ради своих ИЗВРАЩЁННЫХ целей?"
90100060-27 = "[s3] «В-Вы неправильно поняли!»\n[s4] «О-Они здесь потому что...»"
90100060-30 = "Похоже, Сенсей предоставляет им некоторые удобства, поскольку в парке Коусаги, где сейчас размещён отряд RABBIT, нет базовой инфраструктуры."
90100060-31 = "Н-неужели?"
90100060-32 = "Хорошая гигиена напрямую связана с боеспособностью отряда. Командир Цукиюки приняла рациональное решение и грамотно использует доступные ресурсы."
90100060-33 = "Тебе не стоит так переживать, Куруми."
90100060-34 = "У Мияко холодная голова и сильная воля. Она не поддастся угрозам или соблазну так просто."
90100060-35 = "Это... Ага, похоже на неё. Наверное, я слишком переживала."
90100060-36 = "Простите, Сенсей. Пожалуйста, забудьте, что я раньше сказала. Про то, что вы извращенец."
90100060-37 = "Кстати, а что именно ты представляла, когда думала о том, что Сенсей делает здесь с RABBIT?"
90100060-38 = "...Заткнись."
90100060-39 = "Настоящая передовая разведчица, да? Всегда держит в голове целый мир «возможностей»..."
90100060-40 = "ЗАТКНИСЬ!"
90100060-42 = "Давайте приступим к анализу данных. У нас есть несколько наблюдений за районом и один успешный опрос."
90100060-43 = "Для начала: возле станции Широ Унаги нашли десять человек без сознания."
90100060-44 = "Их возраст — от 15 до 30 лет, и большинство до сих пор не пришло в сознание. У них наблюдаются судороги, похожие на приступы."
90100060-46 = "Всех пострадавших нашли в ясные безоблачные дни под сильным солнцем. Время обнаружения — между 10:00 и 15:00, в самую жаркую часть дня."
90100060-47 = "Первичные расследования пришли к выводу, что причиной падений были переутомление или тепловой удар. Однако у пострадавших не было повышенного пульса или аномальной температуры."
90100060-48 = "Несколько пострадавших якобы видели «белое пугало» незадолго до того, как с ними произошёл инцидент."
90100060-49 = ""
90100060-50 = "Что это вообще за белое пугало? Оно виновник или просто совпадение?"
90100060-51 = "Могу лишь гадать. Похоже, кроме пострадавших, никто не подходил к пугалу достаточно близко, чтобы выяснить это."
90100060-52 = "Думаю, надо сделать шаг назад. Это вообще уголовное дело? Как можно вырубить нескольких людей, не оставив физических следов?"
90100060-53 = "Вот это нам и предстоит выяснить. Мы знаем, что обычный человек на такое не способен."
90100060-54 = "Президент Генерального ученического совета сказала, что этот случай может быть аномалией, подпитываемой верой в городские легенды. Иными словами, «Преданием»..."
90100060-55 = ""
90100060-57 = ""
90100060-58 = "Что это вообще значит...? Теперь мы сражаемся с призраками и демонами?"
90100060-59 = "С монстрами мы справимся, но с идеями? Как сражаться с иллюзией?"
90100060-60 = "Говорят, призраки пугают людей — ладно. Но физических травм они не наносят."
90100060-61 = ""
90100060-62 = ""
90100060-63 = ""
90100060-64 = "[ns5] «Ну...»\n[ns6] «Мы ведь не можем знать наверняка...»"
90100060-67 = "Ч-Что за...? Что это за взгляд, Сенсей?!"
90100060-68 = "Вы что, охотились на призраков в Кивотосе?"
90100060-69 = "Да ладно. Серьёзно...?"
90100060-70 = "Все, успокойтесь. Мы ещё не подтвердили, что городские легенды действительно каким-то образом вызывают эти происшествия."
90100060-71 = "Точно известно одно: мы специальное подразделение, первая линия обороны Кивотоса. Мы не отступаем, кем бы ни был враг."
90100060-72 = "И что ещё важнее: если мы не раскроем это дело, нас снова отправят в Исправительное бюро."
90100060-73 = "Мы специальное подразделение, а не мико и не экзорцисты..."
90100060-74 = ""
90100060-76 = ""
90100060-77 = ""
90100060-78 = "Ничто не происходит без причины. Даже загадочные явления должны подчиняться определённым правилам."
90100060-79 = ""
90100060-81 = ""
90100060-82 = "Помните дело о «переполохе с призраком» прошлым летом?"
90100060-83 = "Ага. Какой-то застройщик использовал голограммы и стекло, чтобы создать искусственного призрака. Всё ради махинации с землёй, верно?"
90100060-84 = "Хотя предполагаемого призрака мы не могли взорвать, самого застройщика победить оказалось совсем несложно."
90100060-85 = "Если мы не можем разобраться с самой проблемой, можно найти и устранить её причину. Понимаете?"
90100060-86 = "То есть ты хочешь, чтобы мы арестовали всех, кто распространяет слухи?"
90100060-87 = "Не говори глупостей. Это невозможно."
90100060-88 = "...Даже если бы это БЫЛО возможно, такого подхода следует избегать."
90100060-89 = "[s] «И что ты предлагаешь?»"
90100060-90 = "Я предлагаю внимательнее изучить условия, при которых появлялось «белое пугало»."
90100060-91 = "Мы не знаем, вызывает ли пугало эти происшествия, но оно явно с ними связано."
90100060-92 = "Если тщательно проверить места, где находили пострадавших, можно обнаружить новые зацепки. Или, ещё лучше, мы сами можем столкнуться с этим пугалом."
90100060-93 = "То есть ты предлагаешь нам снова выйти наружу?"
90100060-94 = "Хорошо. Похоже, завтра придётся копнуть глубже."
90100060-95 = "Однажды я прочитала в детективном романе: «Строить выводы без достаточных данных — всё равно что делать кирпичи без глины»."
90100060-96 = ""
90100060-98 = ""
90100060-100 = "Ага, если завтра не найдём зацепку, сами запечёмся как кирпичи..."
90100060-102 = "Следующий эпизод;Ровно в полдень и восставший из мёртвых"
