[translation]
90100060-1 = "Episódio 06;Entre Verdades e Mentiras"
90100060-2 = "Quartel-General do Esquadrão FOX"
90100060-4 = ""
90100060-5 = ""
90100060-6 = "Chegamos em casa～"
90100060-7 = "Já guardei todos os equipamentos nos armários de munição."
90100060-8 = "Esquadrão FOX, de volta à base sem baixas."
90100060-9 = "[s1] \"Bom trabalho a todas!\"\n[s2] \"Ficar no sol quente esse tempo todo deve ter sido puxado, né?\""
90100060-12 = "Não foi nada demais. O senhor também se esforçou muito nos acompanhando, Sensei."
90100060-13 = "Como todas retornaram em segurança, iniciaremos imediatamente a tabulação dos dad――"
90100060-14 = "E-Espera só um minutinho, Yukino!"
90100060-15 = "Eu sei que parece capricho burguês, mas será que não dá pra fazermos uma pausa antes?"
90100060-16 = "Tô louca por um banho de chuveiro para tirar o grude do suor..."
90100060-17 = "[s] \"Ah, sobre isso......\""
90100060-18 = "Se forem usar a área de convivência da Schale, acho melhor esperar mais um pouco."
90100060-19 = "As alunas escaladas para o plantão de hoje ainda não foram embora."
90100060-20 = "Se a gente evitar passar pela sala principal e usar só o vestiário dos fundos, não tem perigo, tem?"
90100060-21 = "Não sei não... lá também é arriscado. As alunas circulam por lá às vezes."
90100060-22 = "Outro dia, depois do meu treino noturno, fui tomar uma ducha e quase dei de cara com a líder Tsukiyuki!"
90100060-23 = "O quê?! A Miyako tava lá dentro?!"
90100060-24 = "Não sei o motivo... mas se eu não tivesse recuado na hora certa, ela teria descoberto que estamos escondidas no subsolo da Schale."
90100060-25 = "Sensei, que história é essa?#nPor que as alunas do Esquadrão RABBIT tão usando os chuveiros da Schale?"
90100060-26 = "Não me diga que... o senhor descobriu os pontos fracos delas e tá aplicando punições no――"
90100060-27 = "[s3] \"N-NÃO! Longe disso, pelo amor de Deus!\"\n[s4] \"É-É que a situação é completamente outra......!\""
90100060-30 = "O Parque Kousagi, onde o Esquadrão RABBIT está acampado, não possui infraestrutura sanitária de água quente.#nO Sensei apenas cedeu as dependências da Schale por pura gentileza e consideração."
90100060-31 = "A-Ah... é por isso...?"
90100060-32 = "Manter a higiene em dia afeta diretamente a prontidão de combate de uma tropa. Foi uma decisão tática extremamente razoável da comandante Miyako."
90100060-33 = "Acho que você tá com a imaginação fértil demais pro lado errado, Kurumi."
90100060-34 = "A Miyako-chan não é do tipo que se curva a ameaças ou seduções baratas. Você a conhece muito bem."
90100060-35 = "É... pensando bem, tem razão. Fui precipitada."
90100060-36 = "Me desculpa pelo vacilo, Sensei. Esquece o que eu falei."
90100060-37 = "Mas vem cá, o que passa nessa sua cabecinha pra disparar a palavra 'punições' a cada cinco minutos?"
90100060-38 = "......Cala a boca."
90100060-39 = "Digna da nossa batedora de ponta do Esquadrão FOX.#nSempre cogitando todas as 'possibilidades' táticas, até as mais devass――"
90100060-40 = "EU MANDEI CALAR A BOCA!"
90100060-42 = "Pois bem. Com base nos dados eletrônicos e nos depoimentos colhidos, faremos a síntese do incidente."
90100060-43 = "Primeiro: até o momento, foram registradas exatamente dez vítimas nas imediações da estação Shirounagi."
90100060-44 = "Idades variadas, e a quase totalidade ainda não recobrou a consciência, apresentando espasmos involuntários que lembram crises epilépticas."
90100060-46 = "Os ataques concentram-se invariavelmente em dias de céu aberto e sol escaldante.#nHorários de ocorrência entre 10h00 e 15h00, a faixa de maior pico térmico do dia."
90100060-47 = "Por conta disso, os paramédicos suspeitaram de choque térmico, mas a biometria corporal das vítimas não acusou desidratação nem febre."
90100060-48 = "E o elo comum entre a maioria esmagadora das vítimas: todas avistaram um 'espantalho branco' instantes antes do colapso."
90100060-49 = ""
90100060-50 = "No fim das contas, o que diabos é esse espantalho branco? Tem ligação direta com a identidade do criminoso?"
90100060-51 = "E também é muito estranho que absolutamente ninguém além das próprias vítimas tenha visto esse tal espantalho..."
90100060-52 = "Pra falar a verdade, eu duvido até que se trate da ação de um indivíduo comum.#nAlguém conseguiria nocautear dez alunas armadas sem deixar um arranhão sequer no corpo?"
90100060-53 = "Correto. Não podemos limitar o suspeito a um cidadão convencional de carne e osso."
90100060-54 = "A própria Presidente do Conselho Estudantil Federal aventou a hipótese de estarmos lidando com uma anomalia gerada por uma lenda urbana viva――um Lore..."
90100060-55 = ""
90100060-57 = ""
90100060-58 = "Ela tava falando sério mesmo...?! Quer dizer que o nosso inimigo é um conto de terror ou um fantasma?!"
90100060-59 = "Se fosse um monstro de carne e osso a gente fuzilava, mas lutar contra uma miragem invisível é pedir demais!"
90100060-60 = "Já vi história de fantasma assustando criancinha, mas nunca ouvi falar de fantasma causando trauma físico em alunas de Kivotos."
90100060-61 = ""
90100060-62 = ""
90100060-63 = ""
90100060-64 = "[ns5] \"Huuuum......\"\n[ns6] \"Dizer que é impossível... talvez não seja bem a verdade......\""
90100060-67 = "Ué... Sensei, por que essa cara de enterro?"
90100060-68 = "Não me diga que o senhor já enfrentou fantasmas de verdade?!"
90100060-69 = "Eca, sério mesmo...?!"
90100060-70 = "Mantenham a calma, operadoras. Ainda não temos a confirmação pericial de que se trata de uma lenda urbana."
90100060-71 = "Além do mais, somos a [ruby=SRT]unidade de operações especiais[/ruby] designada para garantir a ordem de Kivotos.#nNão recuaremos diante de inimigo algum, seja ele qual for."
90100060-72 = "Até porque, se fracassarmos nesta missão, voltaremos direto para a prisão."
90100060-73 = "Mas a gente é uma força tática armada, não uma guarnição de sacerdotisas ou [ruby=exorcistas]exorcistas sagradas[/ruby]!"
90100060-74 = ""
90100060-76 = ""
90100060-77 = ""
90100060-78 = "Mesmo diante de um fenômeno que desafie a compreensão humana, onde há um efeito, há obrigatoriamente uma causa."
90100060-79 = ""
90100060-81 = ""
90100060-82 = "Vocês se lembram do 'Incidente do Fantasma' do verão passado?"
90100060-83 = "Lembro perfeitamente. Era um projetor holográfico forjando aparições sobrenaturais, né? Uma imobiliária tentando derrubar o valor dos imóveis da região."
90100060-84 = "Tiros e explosivos não surtiam efeito na projeção fantasmagórica, mas os corretores gananciosos que operavam o sistema eram alvos bem reais."
90100060-85 = "Se não podemos destruir o efeito sobrenatural de imediato, basta identificarmos e aniquilarmos a sua causa."
90100060-86 = "Quer dizer que... a sua ideia é prender todo mundo que espalha boatos na internet?"
90100060-87 = "Não seja ingênua. Uma censura em massa dessas seria taticamente inexequível."
90100060-88 = "......E mesmo se fosse viável, não seria um método ético a ser adotado."
90100060-89 = "[s] \"Alguém tem uma proposta melhor?\""
90100060-90 = "Primeiramente, precisamos compreender as condições exatas de manifestação do 'espantalho branco'."
90100060-91 = "Ainda não podemos atestar se o espantalho é a causa em si, mas é inegável que possui ligação intrínseca com os ataques."
90100060-92 = "Se refizermos as rotas de todas as vítimas, poderemos descobrir um padrão geográfico.#nE a chance de avistarmos a anomalia diretamente não é nula."
90100060-93 = "Em suma: continuaremos batendo perna no sol quente em campo."
90100060-94 = "Amanhã ampliaremos o perímetro para distritos mais afastados."
90100060-95 = "Como ensinavam os clássicos da literatura policial:#n'Teorizar sem dados empíricos é como tentar assentar tijolos sem barro'."
90100060-96 = ""
90100060-98 = ""
90100060-100 = "Se a gente continuar sem achar nenhuma pista... nós é que vamos virar tijolo empilhado nessa história..."
90100060-102 = "Próximo Episódio;Vulto na Rodovia Expressa"
