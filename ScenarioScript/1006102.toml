[translation]
1006102-1 = "Её легко понять неправильно"
1006102-5 = "Обеспокоенный сообщением Сакурако в MomoTalk, я отправился в главный собор в час, когда там ничего не было запланировано."
1006102-6 = ""
1006102-8 = ""
1006102-9 = "Я заметил Сакурако, молившуюся в дальнем конце почти пустой часовни."
1006102-10 = "..."
1006102-11 = "[s1] Подойти и подождать, пока она закончит молиться.\n[s2] Подойти и присоединиться к её молитве."
1006102-12 = ""
1006102-13 = ""
1006102-15 = ""
1006102-17 = ""
1006102-19 = "...?"
1006102-20 = ""
1006102-22 = ""
1006102-23 = ""
1006102-24 = "Хмм...?"
1006102-25 = ""
1006102-27 = ""
1006102-28 = ""
1006102-29 = "А-А? Сенсей?! Когда вы успели прийти?"
1006102-30 = "[s3] «Прости, если помешал.»\n[s4] «Я не хотел тебя пугать...»"
1006102-31 = "Н-Нет. Всё в порядке. На самом деле я как раз закончила молиться."
1006102-32 = "Н-Нет. Всё в порядке. На самом деле я как раз закончила молиться."
1006102-33 = "Но... что вы здесь делаете?"
1006102-34 = "В это время здесь почти никого..."
1006102-35 = "А?"
1006102-36 = "Вы пришли... потому что я вас позвала?"
1006102-37 = "Боюсь, я не понимаю, о чём вы. Я никогда вас не звала..."
1006102-38 = "Мой... MomoTalk?"
1006102-39 = ""
1006102-42 = "[ns5] «Ты написала, что хотела бы поговорить...»\n[ns6] Показать ей историю сообщений в MomoTalk."
1006102-43 = ""
1006102-45 = ""
1006102-46 = "А. Возможно..."
1006102-47 = ""
1006102-49 = ""
1006102-50 = "А. То, что я написала..."
1006102-51 = "Эм. В-в общем. На самом деле сообщения, которые я отправила..."
1006102-52 = "Это и правда было просто приветствие. Никакого скрытого смысла."
1006102-53 = "...Честно."
1006102-54 = "*вздыхает*"
1006102-55 = "Я должна перед вами извиниться. Похоже, я снова стала причиной недоразумения."
1006102-56 = "[s7] «Эй, всё нормально.»\n[s8] «Что значит „снова“?»"
1006102-59 = "Эм... Проблема в том, что окружающие постоянно понимают меня неправильно."
1006102-60 = "Мои разговоры с другими всегда получаются немного... скованными. Возможно, рядом со мной им неловко? Я не уверена."
1006102-61 = "Возможно, моя руководящая должность заставляет других сестёр держать дистанцию."
1006102-62 = "Я считаю это своей недоработкой. Я просила у других сестёр советов, чтобы стать лучше, но пока без особого успеха."
1006102-63 = "А, но вовсе не потому, что они плохо стараются! Все они хорошие люди и изо всех сил пытаются меня понять. Иногда они даже сами предлагают мне советы."
1006102-64 = "Когда сегодня я отправила вам сообщение в MomoTalk, то пыталась воспользоваться советом одной из сестёр."
1006102-65 = "Она сказала, что если добавить смешок перед сообщением или после него, то оно будет звучать дружелюбнее."
1006102-66 = "[s9] «А-а-а...»\n[s10] «Так вот откуда взялось это „хи-хи-хи“.»"
1006102-69 = "Если откровенно, меня это немного тревожит. Если бы дело касалось только меня лично, это было бы не так страшно, но я принадлежу к Сестринству собора Тринити."
1006102-70 = "Сестре полагается быть доброй и такой, с кем легко заговорить."
1006102-71 = "Когда я написала, что надеюсь поговорить с вами... я хотела попросить совета именно по этой проблеме."
1006102-72 = ""
1006102-74 = ""
1006102-75 = ""
1006102-76 = "А, впрочем, я отвлеклась. Надеюсь, мы сможем обсудить это как-нибудь в другой раз."
1006102-77 = "В любом случае, простите, что отвлекла вас пустяком, Сенсей. Может быть, я вас провожу?"
1006102-78 = ""
1006102-80 = ""
1006102-81 = "Сюда..."
1006102-82 = ""
1006102-84 = ""
1006102-87 = "Парк перед собором Тринити"
1006102-88 = "Что ж, дальше я не пойду. Тогда до свидания."
1006102-89 = "Мне было приятно поговорить с вами сегодня, пусть и совсем недолго."
1006102-90 = "Хи-хи."
1006102-91 = "Пусть ваш день будет благосло—"
1006102-92 = ""
1006102-96 = ""
1006102-97 = ""
1006102-99 = "О, это же сестра Сакурако. Эй, сестра Сакурако!"
1006102-100 = "Доброе утро. Как проходит ваш день?"
1006102-102 = "О, сёстры!"
1006102-103 = "Хи-хи. Доброе утро."
1006102-104 = "Желаю вам мира сегодня, как и во все прочие дни, сёстры."
1006102-105 = ""
1006102-107 = ""
1006102-108 = ""
1006102-109 = "Знайте, что я всегда наблюдаю за вами. В каждое мгновение, каким бы незначительным оно ни было..."
1006102-110 = ""
1006102-113 = ""
1006102-115 = "Хи-хи... В любом случае, благословенного вам дня."
1006102-116 = ""
1006102-119 = "И-и-и! Эм, да!"
1006102-120 = "В-вам того же! Нам уже пора!"
1006102-121 = ""
1006102-123 = ""
1006102-125 = "Ой... Осторожнее! Вы можете пораниться, если будете так бежать..."
1006102-126 = ""
1006102-129 = "[ns11] «Хи-хи» именно в такой момент...\n[ns12] «Теперь понятно.»"
1006102-132 = "...Хм? Сенсей, я не расслышала."
1006102-133 = "А, ничего страшного?"
1006102-134 = "Я понимаю."
1006102-135 = "Тогда я пойду."
1006102-136 = ""
1006102-138 = ""
1006102-140 = "Я ещё мгновение смотрел, как за уходящей Сакурако развевается вуаль, а затем вернулся в Шале."
