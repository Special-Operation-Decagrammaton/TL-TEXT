[translation]
33060-1 = "Эпизод 6;Церемония подписания Эдемского договора, часть 2"
33060-2 = "Центральный зал собора"
33060-4 = "[ns] «(Наверное, можно немного побродить, чтобы скоротать время.)»"
33060-5 = ""
33060-6 = "Прошу прощения, но сюда вход запрещён. Зевать тоже запрещено."
33060-7 = "Только для уполномоченного персонала. Зрители должны оставаться за этой линией."
33060-8 = "[s1] «Эм, насчёт этого...»\n[s2] «Насколько я помню, я КАК РАЗ персонал.»"
33060-9 = "Постой. Эй ты, из Дисциплинарного комитета! Ты тоже только что перешла линию?"
33060-10 = "Постой. Эй ты, из Дисциплинарного комитета! Ты тоже только что перешла линию?"
33060-11 = "Это должна быть шутка? Вы, прихвостни Отряда правосудия, целый день переходите все границы."
33060-12 = "Эта соплячка из Тринити нарывается на драку? Сейчас мы её проучим!"
33060-13 = "Ц! Вызывать подкрепление — грязный приём. Ну ладно... Запрашиваю подкрепление!"
33060-14 = ""
33060-16 = ""
33060-17 = "Ке-ке-ке-ке-ке..."
33060-18 = ""
33060-19 = "Ч-Что?! Это их лидер!"
33060-20 = "Я-Я не ожидала, что вы придёте лично, председатель Цуруги!"
33060-21 = "Ке-ке-ке..."
33060-23 = "Кья-а-а-а!"
33060-24 = "И-Ик!"
33060-25 = "П-Простите, все! Здесь нельзя драться..."
33060-26 = ""
33060-28 = ""
33060-29 = "М-Мы ведь пришли сюда ради мира, помните? Драка полностью противоречит смыслу д-договора, госпожа Цуруги."
33060-30 = "..."
33060-31 = "Вы трое. Этот человек — Сенсей из Шале."
33060-32 = "Понятно?"
33060-34 = ""
33060-35 = "П-Поняла!"
33060-37 = "Я-Я больше не повторю эту ошибку, госпожа!"
33060-39 = ""
33060-41 = ""
33060-42 = ""
33060-43 = "[ns] «Спасибо, Цуруги. Прости за беспокойство.»"
33060-44 = "..."
33060-45 = "Н-Не нужно меня благодарить..."
33060-46 = "У меня есть другие дела, поэтому я пойду..."
33060-47 = ""
33060-49 = ""
33060-50 = ""
33060-51 = ""
33060-53 = "Фух."
33060-54 = "[s] «В глубине души она милая девушка.»"
33060-55 = "О-О! Вот как..."
33060-56 = "[s] «И тебе спасибо за помощь. Ты... Хината, верно?»"
33060-57 = "Д-Да, это я. Рада снова вас видеть, Сенсей."
33060-58 = "[s] «Без Сестринства нам бы тогда пришёл конец.»"
33060-59 = "А, это? Вовсе нет. Тогда я почти ничего не сделала."
33060-60 = "На самом деле я только грубой силой и полезна."
33060-61 = "[s] «Другие сёстры тоже будут присутствовать?»"
33060-62 = "Да. Так приказала Сакурако."
33060-63 = "Возможно, вы слышали, что в последнее время наш орден меняет некоторые внутренние позиции."
33060-64 = "Она, возможно, считает, что политика невмешательства привела к инциденту с Чаепитием, поэтому теперь мы будем активнее участвовать во внешних делах."
33060-65 = "Кстати о Сакурако: она должна скоро прибыть."
33060-66 = "Сестринство добровольно предложило помочь с мероприятием — обеспечить охрану и сопровождение гостей."
33060-67 = "Так что, если вы не против, я могу провести вас по собору."
33060-68 = "[s] «Спасибо. Буду рад.»"
33060-69 = "С удовольствием!"
33060-72 = "Галерея собора"
33060-74 = "[ns] «Вот это место.»"
33060-75 = "И правда. Исторический Собор объединения уже начал приходить в упадок, но после решения провести здесь церемонию его масштабно отреставрировали."
33060-76 = "Это решение Нагиса приняла вместе с Макото из Общества Пандемониума Геенны."
33060-77 = "Правда, отремонтировали только части, связанные с мероприятием. Если спуститься глубже, там всё ещё сплошные руины."
33060-78 = "Вообще я слышала, что под собором находится огромная система катакомб."
33060-79 = "Говорят, она тянется на десятки километров. Полной карты не существует, так что, вероятно, даже в древности никто точно не знал, где они заканчиваются."
33060-80 = "О, здесь проход перекрыт. Наверное, это одна из зон, которые было слишком опасно восстанавливать."
33060-81 = "[s] «Ты не шутила.»"
33060-82 = "Да. Всё-таки мы стоим на месте Первого совета."
33060-83 = "Заповеди, принятые советом, считаются священными. Когда я иду по этим залам, кажется, будто духи хранителей заповедей всё ещё здесь."
33060-84 = "[s] «Хранителей?»"
33060-85 = "За нарушением любого обещания должны следовать последствия, верно? Иначе зачем кому-то его соблюдать?"
33060-86 = "В древние времена эту ответственность несли те, кого называли хранителями заповедей."
33060-87 = "Легендарный Совет Святой Юстины."
33060-88 = "[s] «Как современный Отряд правосудия.»"
33060-89 = "Да. Хотя если точнее, они были предшественниками Сестринства."
33060-90 = ""
33060-93 = "О, похоже, Сакурако прибыла. Нагиса тоже скоро должна быть здесь."
33060-94 = "Думаю, нам пора возвращаться, Сенсей. Сюда."
33060-96 = "А приготовления?"
33060-97 = "Только что завершились. Машина доставит вас от офиса Общества Пандемониума до собора."
33060-98 = "Машина? Зачем?"
33060-99 = "Макото хочет покрасоваться. Похоже, Общество Пандемониума недавно купило частный дирижабль, и она хочет... «Показать разницу в авторитете, пока ты ползёшь по земле, а она летит в небесах»."
33060-100 = "..."
33060-101 = "Как всегда, легкомысленно — хотя какая разница. Забавно, что она организовала мне машину после того, как так долго пыталась помешать мне попасть на церемонию."
33060-102 = "Иори и Чинацу ждут. Пойдём."
33060-103 = "..."
33060-104 = "*вздох* Я понимаю, почему ты беспокоишься, Ако, но я уже всё объяснила."
33060-105 = "Мы не распускаем Дисциплинарный комитет. Мы надеваем кандалы ОЭД на Общество Пандемониума."
33060-106 = "Да, я знаю. Хочу верить, что будущее Дисциплинарного комитета всё ещё в безопасности, и знаю, что ограничения Чаепития в какой-то степени свяжут Макото руки. Но меня беспокоите именно вы."
33060-107 = "..."
33060-108 = "На сегодня достаточно."
33060-109 = "Обсудим это после церемонии. Пора ехать."
33060-111 = "Точно."
33060-114 = "Только взгляните! Общество Пандемониума Геенны прибыло на своём совершенно новом частном дирижабле!"
33060-120 = "А вот и она — главная председательница Геенны, Ханума Макото! Полюбуйтесь величием и харизмой руководства Геенны!"
33060-121 = "Ки... Кихехе."
33060-123 = "Похоже, хозяйка Чаепития Общей школы Тринити Кирифуджи Нагиса тоже прибыла к собору!"
33060-124 = "Руководители обеих академий прибывают один за другим."
33060-125 = "Скоро должна появиться и глава Дисциплинарного комитета Геенны. Становится всё жарче, так что не переключайтесь!"
33060-130 = "Готовы?"
33060-131 = "Да. Всё закончено."
33060-132 = "Д-Да, всё подготовлено. Мы всё ещё идём по графику."
33060-133 = "А связь с той куклой?"
33060-134 = "*вдох* (язык жестов) *выдох*"
33060-135 = "Хорошо. Тогда осложнений быть не должно."
33060-136 = "В-Вот оно, да? Будет много страданий, но иначе нельзя."
33060-137 = "Да. Таков путь этого мира."
33060-138 = "..."
33060-140 = "Отряд Ариуса, начать операцию."
33060-145 = "Статус крылатой ракеты?"
33060-146 = "Запрос на запуск подтверждён. Ожидаемое попадание через пять минут."
33060-147 = "А команды II и III?"
33060-148 = "Ожидают перед проходом. Готовы войти в целевую зону в назначенное время."
33060-149 = "Входите сразу после обрушения собора. Мисаки и команда II займутся силами Тринити, а команда III и Хиёри — силами Геенны."
33060-150 = "Есть."
33060-151 = "Команда II должна постоянно держать в поле зрения Цуруги, а команда III — Хину. Не упускайте их."
33060-152 = "П-Поняла! Главу Дисциплинарного комитета!"
33060-153 = "Что касается команд I и V..."
33060-154 = "*вдох* (язык жестов) *выдох*"
33060-155 = "Да. Оттуда пройдёте по проходу в подвал.#nВаша миссия самая важная. Понятно?"
33060-156 = "..."
33060-157 = "*вдох* (язык жестов) *выдох*"
33060-158 = "Знаю. Пожалуйста, продержись как можно дольше, Химэ."
33060-159 = "*кивает*"
33060-160 = "А ты, Саори?"
33060-161 = "У меня дело в другом месте. Присоединюсь к команде V, когда закончу."
33060-162 = "Разорвать строй и продвигаться."
33060-166 = ""
33060-168 = ""
33060-170 = ""
33060-172 = ""
33060-178 = "...?!"
33060-179 = ""
33060-181 = ""
33060-186 = "Азуса? Ты куда?"
33060-187 = "Н-Не смущай её! Очевидно же, ей нужно в туалет."
33060-188 = "Но разве он не в другой стороне?"
33060-191 = "А?"
33060-193 = "..."
33060-194 = "*свиииист*"
33060-195 = "Хм? Вы что-нибудь слышите?"
33060-196 = "Ч-что это было?!"
33060-199 = "Это пришло с неба?! Что-то только что пролетело прямо мимо нас!"
33060-200 = "А-а-а!"
33060-201 = "(Это ещё не конец.)"
33060-202 = "(Нет, это только начало... Верно, Саори?)"
33060-211 = "*БУМ*"
33060-213 = "Следующий эпизод;День огня и пепла, часть 1"
