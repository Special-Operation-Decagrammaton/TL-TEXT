[translation]
33060-1 = "Episódio 6;Cerimônia de Assinatura do Tratado do Éden (2)"
33060-2 = "Interior da Antiga Catedral - Salão Central"
33060-4 = "[ns] (Parece que ainda tenho um tempinho livre, acho que vou dar uma volta por aí.)"
33060-6 = "Com licença, você é da equipe de serviço? A entrada não é permitida aqui, então pedimos que se retire."
33060-7 = "Ei, você aí, esta área é restrita aos envolvidos. Os espectadores ficam para aquele lado."
33060-8 = "[s1] \"Ér...\"\n[s2] \"Tecnicamente, eu sou um dos envolvidos...\""
33060-9 = "...Com licença, você do Comitê Disciplinar, não acabou de cruzar esta linha?"
33060-10 = "...Com licença, você do Comitê Disciplinar, não acabou de cruzar esta linha?"
33060-11 = "Hã? Vocês é que estavam pisando na linha, eu só tentei afastar a pessoa dali."
33060-12 = "Por acaso o pessoal de Trinity está querendo comprar briga? Se é assim, a conversa é curta, vou botar ordem em vocês agora mesmo!"
33060-13 = "Quê, reforços assim do nada...!? Solicito apoio, mandem reforços!"
33060-17 = "Kihihi..."
33060-19 = "Hiii!? A presidente, assim de repente!?"
33060-20 = "R-Reforços coisa nenhuma, é a Tsurugi-senpai...!?"
33060-21 = "Kuhihihihihihi..."
33060-23 = "Hyahhaaaaaaaa!!"
33060-24 = "H-Hiiiii?!"
33060-25 = "H-Hum...! Pessoal, não podem brigar aqui..."
33060-29 = "Já que nos reunimos aqui justamente pela paz... N-Não é mesmo, Tsurugi-san?"
33060-30 = "..."
33060-31 = "...Quem está aqui diante de vocês é o Sensei da Schale."
33060-32 = "Gravem bem isso."
33060-35 = "S-Sim!"
33060-37 = "V-Vamos guardar bem isso na cabeça!"
33060-43 = "[ns] \"Ér, desculpe... E obrigado, Tsurugi.\""
33060-44 = "..."
33060-45 = "N-Não, que isso... Imagina, Sensei."
33060-46 = "Bem, hum, eu tenho outras tarefas para cumprir, então com licença..."
33060-53 = "Ufa..."
33060-54 = "[s] \"A Tsurugi é mesmo gentil...\""
33060-55 = "Sim... Hã!?"
33060-56 = "[s] \"Obrigado por me ajudar. É a Hinata, certo?\""
33060-57 = "...Ah, sim! Não nos vemos desde aquela vez, né, Sensei?"
33060-58 = "[s] \"Aquela vez, a chegada da Irmandade nos salvou.\""
33060-59 = "N-Não, que isso. Naquela ocasião, eu nem consegui ser muito útil..."
33060-60 = "Eu só tenho força bruta de sobra... Me desculpe por não servir para muita coisa..."
33060-61 = "[s] \"Imagina, não diga isso. As outras Irmãs também vieram hoje?\""
33060-62 = "Ah, sim. Foram ordens da Sakurako-sama."
33060-63 = "A partir do último incidente, a nossa política mudou um pouco."
33060-64 = "Talvez ela tenha pensado que a nossa antiga política de não intervenção acabou levando àquela situação... Por isso, disse que daqui em diante atuaremos de forma mais ativa em assuntos externos."
33060-65 = "Acredito que a Irmã Sakurako também deva chegar em breve."
33060-66 = "Nós também estamos basicamente ajudando em várias coisas da cerimônia de assinatura, orientando os convidados, auxiliando na segurança e tudo mais..."
33060-67 = "Ah, se quiser, Sensei, gostaria que eu lhe mostrasse a Antiga Catedral?"
33060-68 = "[s] \"Se não for incômodo, posso aceitar o convite?\""
33060-69 = "Claro, ainda temos tempo agora. Então, por aqui..."
33060-72 = "Interior da Antiga Catedral - Corredor"
33060-74 = "[ns] \"Que lugar incrível.\""
33060-75 = "Sim. Esta \"Antiga Catedral da Comunhão\" ficou abandonada em ruínas por muito tempo, mas... como foi decidido que a cerimônia de assinatura seria realizada aqui, dizem que passou por uma grande reforma."
33060-76 = "Ouvi dizer que essa decisão foi fruto de um acordo entre a Nagisa-san, de Trinity, e a Makoto-san, de Gehenna..."
33060-77 = "Ainda assim, não foi o prédio inteiro que foi reformado, parece que apenas a área onde ocorrerá a assinatura. As partes mais abaixo ainda estão em ruínas..."
33060-78 = "São apenas boatos, mas dizem que existem enormes Catacumbas no subsolo desta Antiga Catedral."
33060-79 = "Um cemitério subterrâneo que se estende por dezenas de quilômetros... Até mesmo nos registros da época do \"Primeiro Concílio\", dizia-se que era tão vasto que não se via o fim..."
33060-80 = "...Ah, este lado aqui está bloqueado. Deve ser porque ainda está em reforma e é perigoso."
33060-81 = "[s] \"É um lugar cheio de história, né.\""
33060-82 = "Sim. Afinal, foi aqui que o Primeiro Concílio foi realizado."
33060-83 = "Os preceitos firmados em um Concílio são sagrados... Essa sacralidade, ou melhor, \"algo\" como um vestígio das guardiãs dos preceitos, parece ainda permanecer neste lugar."
33060-84 = "[s] \"Guardiãs?\""
33060-85 = "Sim, como eu poderia explicar isso... Quando se faz uma \"promessa\", geralmente também se estabelecem regras para o caso de ela ser quebrada, não é? Caso contrário, poderia acontecer de ninguém cumprir a promessa..."
33060-86 = "Aqueles que tinham o papel de impor essa regra, essa \"restrição\", eram chamados de guardiões dos preceitos. Uma força armada de Trinity encarregada de lidar com quem quebrasse as promessas..."
33060-87 = "Essa era a \"Congregação de Santa Justina\"."
33060-88 = "[s] \"Como o Comitê de Justiça de hoje em dia...?\""
33060-89 = "Sim. Historicamente, elas são as predecessoras da nossa \"Irmandade\"..."
33060-93 = "Ah, parece que a Sakurako-sama chegou. E ouvi dizer que a Nagisa-san também está prestes a chegar."
33060-94 = "Desculpe por deixar o passeio pela metade, mas acho melhor irmos indo."
33060-96 = "Tudo pronto?"
33060-97 = "...Sim, tudo certo. Ah, falando nisso, a Pandemonium Society nos emprestou um carro para irmos até a Antiga Catedral."
33060-98 = "...Um carro? Por quê?"
33060-99 = "Parece que elas compraram um dirigível de última geração para esta ocasião... e a Makoto-san disse: \"Rastejem pelo chão para que todos possam fazer uma bela comparação com nós, que voamos pelos céus\"."
33060-100 = "..."
33060-101 = "Gastando o orçamento com esse tipo de coisa de novo... Bom, a essa altura não é novidade. Mas depois de tanto nos atrapalharem para tentar impedir a nossa presença na cerimônia de assinatura, acho bem estranho prepararem um carro para nós no final."
33060-102 = "A Iori, a Chinatsu e as outras estão esperando, vamos logo."
33060-103 = "..."
33060-104 = "Haa, eu sei que você não está nada satisfeita com isso, mas... eu já te disse, não foi, Ako?"
33060-105 = "O Comitê Disciplinar não vai ser dissolvido nem nada do tipo. Isso serve apenas para colocar a coleira chamada Organização do Tratado do Éden na Pandemonium Society."
33060-106 = "...Sim, eu entendo. O Comitê Disciplinar quase não vai mudar, e a Makoto ficará sujeita a restrições. Mas, quando isso acontecer, você, Presidente..."
33060-107 = "..."
33060-108 = "Por enquanto, a nossa prioridade é ir para a cerimônia."
33060-109 = "...Conversamos sobre isso com calma depois que a cerimônia de assinatura terminar, está bem?"
33060-111 = "...Sim."
33060-114 = "Opa, falando no diabo! Parece que a Pandemonium Society de Gehenna acabou de chegar a bordo de um dirigível de último modelo!"
33060-120 = "É a presidente do conselho da Academia Gehenna, Hanuma Makoto! Como esperado, que carisma impressionante! Provavelmente! Essa é a imponência da presidente do conselho estudantil de Gehenna!"
33060-121 = "Kikii..."
33060-123 = "E parece que a anfitriã da Tea Party da Escola Geral Trinity, Kirifuji Nagisa, também acaba de chegar à Antiga Catedral!"
33060-124 = "As figuras principais de ambas as escolas estão se reunindo uma após a outra!"
33060-125 = "Com a chegada da Chefe do Comitê Disciplinar de Gehenna prevista para daqui a instantes, o clima ao redor fica cada vez mais fervoroso! Pessoal, continuem acompanhando tudo ao vivo!"
33060-130 = "E os preparativos?"
33060-131 = "...Sem problemas."
33060-132 = "S-Sim! Já terminei, fiz a checagem e também confirmei várias coisas..."
33060-133 = "E quanto ao contato com aquele boneco?"
33060-134 = "(Gesticula, gesticula...)"
33060-135 = "...Então parece que não há problema. Tudo está pronto."
33060-136 = "A-As coisas vão ficar muito difíceis daqui para frente, né? Todo mundo vai sofrer, né...? Mas não há o que fazer."
33060-137 = "...Sim, essa é a verdade deste mundo."
33060-138 = "..."
33060-140 = "Esquadrão Arius, iniciando a operação."
33060-145 = "E o míssil de cruzeiro?"
33060-146 = "Já foi lançado. Atingirá o ponto-alvo daqui a 5 minutos."
33060-147 = "E as Equipes II e III?"
33060-148 = "E-Estão de prontidão em frente à passagem... A previsão é que invadam a área da operação no horário marcado."
33060-149 = "Avancem no exato momento em que a Antiga Catedral desabar. Misaki e Equipe II cuidam de Trinity; Hiyori e Equipe III ficam com o lado de Gehenna."
33060-150 = "Entendido."
33060-151 = "A Equipe II deve ficar alerta com a Tsurugi. A Equipe III deve tomar cuidado com a Hina ao avançar."
33060-152 = "S-Sim! Entendido! C-Com a Hina-san, né...!"
33060-153 = "Quanto às Equipes I e V..."
33060-154 = "(Gesticula, gesticula...)"
33060-155 = "Sim, sigam pela passagem rumo ao subsolo. Como sabem, é a missão mais importante."
33060-156 = "..."
33060-157 = "(Gesticula...)"
33060-158 = "Princesa... Eu sei. Deve ser desagradável para você, mas quero que aguente só mais um pouco."
33060-159 = "(...Acena com a cabeça)"
33060-160 = "H-Hum, e você, Saori-san...?"
33060-161 = "Eu tenho outro assunto para resolver. Assim que terminar, pretendo me juntar à Equipe V."
33060-162 = "Muito bem, dispersar."
33060-178 = "...!?"
33060-186 = "Ué, Azusa-chan...? Aonde você vai?"
33060-187 = "Não precisa nem perguntar, né? Ela vai ao banheiro!"
33060-188 = "Ér, mas o banheiro não fica para aquele lado..."
33060-191 = "...Hã?"
33060-193 = "..."
33060-194 = "(Fiuuuuuuuuuuu!!)"
33060-195 = "Agora há pouco, fez um barulho estranho..."
33060-196 = "O-O quê!?"
33060-199 = "Tem alguma coisa voando para cá...!?"
33060-200 = "Kyaaaah!?"
33060-201 = "(...Ainda não tinha acabado?)"
33060-202 = "(Não, está apenas começando...? Saori, não me diga que...!?)"
33060-211 = "(CABUUUUUUUUM!!!)"
33060-213 = "Próximo;O Dia Tingido de Fogo e Cinzas (1)"
