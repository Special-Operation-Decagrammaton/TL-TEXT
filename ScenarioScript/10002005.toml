10002005-40 = "#video;10002"
10002005-1 = "Пролог; Девушки летнего моря"
10002005-5 = ""
10002005-6 = "Смотрите! Океан!"
10002005-7 = "Смотри, Азуса! Океан! Мы правда добрались!"
