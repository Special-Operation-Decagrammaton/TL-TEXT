10002005-51 = "Уф."
10002005-52 = ""
10002005-54 = ""
10002005-58 = "С ними покончено, Хасуми."
10002005-59 = "*вздыхает* Как всё дошло до такого?"
10002005-60 = "По отчётам, около 30 членов Оперативной группы правосудия получили ранения, восточная площадь наполовину разрушена, а 12-й институт лежит в руинах."
10002005-61 = "Отчёт оставь на потом, Маширо."
10002005-62 = "Неужели все эти разрушения устроили всего две студенты? Это точно не была более крупная вооружённая группа или, возможно... небольшая армия?"
10002005-63 = "Они захватили танк и практически устроили нам блицкриг. Мы не могли перейти в контратаку, пока не раздобыли панцерфауст."
10002005-64 = "А стрелок на башне танка ещё и по одному снимал наших гранатомётчиков."
10002005-65 = "Они застали нас врасплох."
10002005-66 = "Понятно. Смело с их стороны — украсть школьный танк."
10002005-67 = "Н-нет! Мы не крали танк! Мы всего лишь взяли его... попользоваться..."
10002005-68 = "Без разрешения, госпожа Аджитани Хифуми. Полагаю, именно это и называется кражей, и виновны в ней и вы, и госпожа Ширасу Азуса."
10002005-69 = "Хмф."
10002005-70 = "Ваше наказание скоро определят, так что просто сидите тихо, пока мы обсуждаем."
10002005-71 = ""
10002005-73 = ""
10002005-76 = "Всё плохо. Они не понимают, что это большое недоразумение."
10002005-77 = "Да, исход вышел неудачный. Если бы мы раньше заметили выставленных снайперов, смогли бы уходить от них ещё как минимум два часа."
10002005-78 = "А-Азуса, от таких слов они только сильнее будут нас подозревать."
10002005-79 = "Почему ты вообще напала на Оперативную группу правосудия? Разве не разумнее было просто сдаться?"
10002005-80 = "Они начали нас преследовать, поэтому я ответила тем же. Всё просто. И я бы не смогла победить столько противников, если бы не твоё мастерское управление танком."
10002005-81 = "То, как ты вошла в тот поворот в заносе, было поразительно. Я никогда такого не видела."
10002005-82 = "Я им вообще почти не управляла. Просто нажимала кнопки и дёргала любые рычаги, которые видела. Уф..."
10002005-83 = "Что же нам делать? Нас осудят за кражу танка и разгром Оперативной группы правосудия!"
10002005-84 = "Но именно это мы буквально и сделали."
10002005-85 = "Нет, но... Всё должно было быть совсем не так."
10002005-86 = "У-ух..."
10002005-87 = "Что теперь будет? Нас будут пытать? Хифуми, тебя учили сопротивляться пыткам?"
10002005-88 = "Конечно нет. Да и Оперативная группа правосудия не станет заходить так далеко... наверное."
10002005-89 = "А их президент? Хотя она больше похожа на человека, которому казнь нравится больше пыток."
10002005-90 = "Ц-Цуруги, ну... я не уверена, но не думаю, что она зайдёт так далеко против другого студента."
10002005-91 = "Уверена? Ходят слухи, что она устранила нескольких студентов Тринити."
10002005-92 = "Ну, я тоже это слышала, но никаких..."
10002005-93 = "В любом случае остаётся только рассказать им всю правду и надеяться, что нас простят."
10002005-95 = "..."
10002005-96 = "Итак, причина, по которой вы украли танк..."
10002005-97 = "...в том, что вы хотели показать Азусе океан?"
10002005-98 = "Да. Мы всего лишь одолжили имущество академии. Мы не хотели, чтобы это выглядело как кража."
10002005-99 = "Я знаю, что вы хорошо себя проявляли в Клубе дополнительных занятий, поэтому склонна вам верить."
10002005-100 = "Но зачем танк? Нельзя было дойти до пляжа пешком? Или воспользоваться общественным транспортом?"
10002005-101 = "Нет, тогда всё теряло бы смысл!"
10002005-102 = "Азуса никогда не видела океан, поэтому мы хотели сделать её первую поездку особенной!"
10002005-103 = "Это не отвечает на мой вопрос!"
10002005-104 = "Но... это же летние каникулы и её первый раз! Пляж! Тёплое солнце, прекрасная вода..."
10002005-105 = "Да, и...?"
10002005-106 = ""
10002005-108 = ""
10002005-109 = "Без танка всё это просто невозможно!"
10002005-110 = ""
10002005-112 = ""
10002005-114 = ""
