10002005-229 = "[s3] «Похоже, цель — заставить её повеселиться.»\n[s4] «Это больше похоже на список желаний на лето.»"
10002005-230 = "Не будь таким наивным, Сенсей."
10002005-231 = "Не будь таким наивным, Сенсей."
10002005-232 = "Вообще-то мы сейчас стоим на секретном объекте для сбора разведданных."
