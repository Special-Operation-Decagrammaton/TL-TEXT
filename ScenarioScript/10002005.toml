10002005-165 = "Откуда мне знать? Хотя такой возбуждённой я Цуруги давно не видела. В последнее время она была очень подавленной."
10002005-166 = "По ней вообще невозможно понять, в хорошем она настроении или в плохом. Выглядит всегда одинаково."
10002005-167 = "Так что не удивляйся, если почувствуешь запах пороха и увидишь море крови."
