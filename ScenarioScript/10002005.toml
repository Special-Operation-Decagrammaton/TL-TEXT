10002005-12 = "Верно, Сенсей?"
10002005-13 = "[s1] «Вообще-то не я, а вы все проделали тяжёлую работу...»\n[s2] «Не верится, что ты никогда не была на пляже.»"
10002005-14 = "Не волнуйтесь, внутри я радуюсь сильнее, чем это заметно. Мне не неприятно."
10002005-15 = "Не волнуйтесь, внутри я радуюсь сильнее, чем это заметно. Мне не неприятно."
10002005-16 = "Но..."
10002005-17 = "Просто нам пришлось пережить слишком много неприятностей, чтобы сюда добраться."
