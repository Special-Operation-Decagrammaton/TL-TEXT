[translation]
1801-1 = "Выходной Комитета правосудия, часть 1"
1801-2 = "Заброшенная фабрика неподалёку от Тринити"
1801-3 = "*кричит*"
1801-5 = "Ой, хватит так шуметь! Если продолжишь сопротивляться — пожалеешь!"
1801-6 = "К-Кто вы такие? Зачем вы меня похитили?"
1801-7 = "А у тебя много вопросов, леди из Тринити!"
1801-8 = "Тебе нужно лишь тихо сидеть здесь, пока академия не заплатит выкуп. И даже не думай вытворять глупости!"
1801-9 = "Что?! Вы ведёте переговоры со старшей школой Тринити?"
1801-10 = "Конечно! Мы уже сказали им, что если они хотят вернуть своих студентов, то должны..."
1801-11 = "О нет... Все бегите! ...То есть, берегитесь!"
1801-12 = "А?"
1801-13 = "О чём ты говоришь?"
1801-15 = "*бум*!"
1801-16 = "А-а-а!"
1801-17 = "Что? Что происходит?!"
1801-18 = ""
1801-19 = "Хе-хе-хе..."
1801-20 = ""
1801-21 = "Ке-хе-хе-хе-хе!"
1801-22 = "Чего-о-о?!"
1801-23 = "О-Она здесь! Она пришла!"
1801-24 = ""
1801-25 = "Кья-я-я-я!"
1801-27 = ""
1801-28 = "Центральная палата Рыцарей исправительного курса"
1801-29 = "Ну что, как они?"
1801-30 = "Большинство студентов, которых держали в заложниках, в стабильном состоянии, но..."
1801-31 = "У некоторых из-за пережитого стресса появились симптомы ПТСР... Им понадобится отдыхать не меньше трёх недель."
1801-32 = "..."
1801-33 = "Сэрина, я вернулась!"
1801-34 = "Я отвезла тех бандитов из Банды шлемов Дэко-Боко в государственную больницу на окраине города!"
1801-35 = "Их всех сплющило словно банки из-под газировки. Даже первую помощь им оказывать было страшно!"
1801-36 = "Это... работа Цуруги из Комитета правосудия?"
1801-37 = "Ханаэ..."
1801-38 = ""
1801-39 = "Ой, прости..."
1801-40 = ""
1801-41 = ""
1801-42 = "Пока всё хорошо. Пожалуйста, продолжайте в том же духе."
1801-43 = "Ха... не за что."
1801-45 = "*вздыхает*"
1801-46 = "Отличная работа."
1801-47 = "Теперь надо поблагодарить Сестринство, которое вместе с нами искало заложников среди обломков здания..."
1801-48 = "Эм... да. Туда тоже надо сходить..."
1801-49 = "После этого нужно зайти в офис, занимавшийся заявлением о возмещении ущерба..."
1801-50 = "Хм... верно."
1801-51 = "Ещё надо сходить в штаб клуба и отчитаться обо всех лишних боеприпасах, которые мы потратили..."
1801-52 = "..."
1801-53 = "Всё было во имя справедливости. Мы сделали то, что должны были."
1801-54 = "Это так, но..."
1801-55 = "Кажется, в этот раз Цуруги выглядит немного грустнее..."
1801-56 = "Но разве для неё это не вполне обычно?"
1801-57 = "Наверное..."
1801-58 = "*звонок* А?"
1801-59 = "Что такое?"
1801-60 = "О... это видеосообщение от Чаепития."
1801-61 = "Что? От Чаепития?!"
1801-63 = "Мы слышали о том, что сегодня произошло с Комитетом правосудия."
1801-64 = "Это была спасательная операция, но все студенты, оказавшиеся в заложниках, отправились в больницу..."
1801-65 = "Некоторые даже утверждают, что заработали ПТСР, просто посмотрев на лицо Цуруги..."
1801-66 = "..."
1801-67 = "Я тут подумала."
1801-68 = "Почему с Комитетом правосудия постоянно случаются подобные вещи?"
1801-69 = "Думаю, решением мог бы стать... обмен."
1801-70 = "Точнее, культурный обмен с другими, чтобы научиться здравому смыслу... и проявлять сострадание."
1801-71 = "Именно этого не хватает Комитету правосудия. Вам нужно больше общаться с другими клубами."
1801-72 = "Поэтому я придумала план. Завтра Комитет правосудия будет закрыт."
1801-73 = "А вы в это время будете участвовать в деятельности других клубов академии."
1801-74 = "Мой план идеален. Это даст вам возможность лучше понять других и узнать, что такое здравый смысл и сочувствие."
1801-75 = "Ну как? Уже не терпится?"
1801-76 = "Что ж, удачи всем! ☆"
1801-78 = "О... И на всякий случай: участие обязательное, исключений не будет."
1801-79 = ""
1801-80 = "..."
1801-81 = "...Что это значит? Мы должны наблюдать за всеми остальными клубами?"
1801-82 = "*вздыхает* А что нам ещё остаётся?"
