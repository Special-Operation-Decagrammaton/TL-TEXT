[translation]
1012306-1 = "Я стесняюсь"
1012306-2 = "Исполнительный офис Шале"
1012306-3 = "Сейя пришла вскоре после своего сообщения."
1012306-4 = ""
1012306-7 = ""
1012306-8 = "[ns1] «Очень чинно выглядишь, Сейя.»\n[ns2] «Сезон купальников закончился?»"
1012306-11 = "Можно и так сказать. Однако сегодня я пришла не поэтому."
1012306-12 = "Сегодня... мне хотелось оглянуться на свои успехи."
1012306-13 = "Я прошла долгий путь. Да, я изменилась."
1012306-14 = "Возможно, изменение было небольшим — настолько незначительным, что едва заслуживает внимания."
1012306-15 = "«Но важно не то, насколько велико изменение, а сам факт того, что оно произошло.»"
1012306-16 = "...Именно это, как мне казалось, вы бы и сказали."
1012306-17 = "[s3] «Это вроде твоей интуиции?»\n[s4] «Ты сама до этого додумалась?»"
1012306-20 = "Да. Это был мой собственный вывод."
1012306-21 = "Это не была абстрактная догадка или внезапное озарение. Мне пришлось самой прийти к этому выводу."
1012306-22 = "И именно поэтому он кажется таким ценным."
1012306-23 = "Эту истину нельзя было разглядеть ни гаданием, ни предчувствием. Более того, использование какого-либо внешнего метода... только создало бы проблемы."
1012306-24 = ""
1012306-26 = ""
1012306-27 = "...Речь о взаимоотношениях между людьми."
1012306-28 = "Забавно самой это говорить, но рядом с Нагисой и Микой мне становится всё спокойнее и естественнее."
1012306-29 = "Конечно, это не значит, что раньше мы не были близки. Что бы они обе ни думали, они мне очень дороги."
1012306-30 = "..."
1012306-31 = "...Я неудачно выразилась. Мне не следует говорить о том, что они думают обо мне или не думают. Суть от этого не меняется."
1012306-32 = "[s5] «Ты и правда изменилась.»\n[s6] «Какая взрослая, Сейя!»"
1012306-35 = "Фуфу... Я знала, что вам это понравится."
1012306-36 = "Но эта «непринуждённость» со стороны может выглядеть не слишком здоровой или благопристойной."
1012306-38 = "Для начала, в последнее время я стала гораздо чаще язвить в разговорах с ними обеими."
1012306-39 = "Мика стала терпимее, но при этом прямолинейнее, а Нагиса больше не стесняется... кричать."
1012306-40 = "...Да. Возможно, именно это и значит стать ближе. В каком-то смысле наши отношения стали совершенно неблагополучными."
1012306-42 = "Я не уверена, правильный ли это путь. Со стороны мы ссоримся чаще, и я понимаю, что наблюдать такую недостойную картину неприятно."
1012306-43 = "Возможно, я ещё буду скучать по временам, когда мы были «заботливыми и добрыми», пусть даже это было лишь внешне."
1012306-44 = "И всё же... Ну..."
1012306-45 = "[s7] «Если что-то пойдёт не так, вы справитесь.»\n[s8] «Главное — найти то, что подходит именно вашей компании.»"
1012306-48 = "...Фуфу."
1012306-49 = "Полагаю, так и есть. Я пришла сюда в надежде услышать от вас именно это."
1012306-50 = "В конце концов я нашла собственный ответ. Сарказм всё-таки часть моей натуры."
1012306-51 = "Но с кем-либо, кроме них, я не могу вести себя так. Мне приходится сдерживать часть себя, чтобы другие студенты могли меня принять."
1012306-52 = "Мика и Нагиса в определённой степени научились не обращать внимания на мой колючий характер."
1012306-53 = "А я стала меньше отмахиваться от детских идей Мики. Да, она бывает наивной, но её чувства искренни."
1012306-54 = "И пусть у Нагисы есть упрямая сторона, причины у неё вполне веские. Мы с Микой обе многим обязаны её труду."
1012306-55 = "Мм..."
1012306-56 = "Кажется, я без конца несу всякую ерунду, но..."
1012306-57 = "[s9] «Я всё понял.»\n[s10] «Вы втроём отлично справитесь вместе.»"
1012306-60 = "Хе-хе. Вы правы. Надеюсь, так и будет."
1012306-61 = "...Что ж, на этом история о моей дружбе закончена."
1012306-62 = "Вернёмся к главному. Я хочу поговорить о том, куда движутся наши с вами отношения."
1012306-63 = "[s11] «...НАШИ отношения?»\n[s12] «Что ты имеешь в виду?»"
1012306-66 = "Вы притворяетесь, что не понимаете? Или и правда не понимаете?"
1012306-67 = "Разве это важно? Всё равно я не позволю вам отказаться."
1012306-68 = "А теперь идёмте. Я припарковалась у обочины. Если мы продолжим болтать, мне ещё выпишут штраф."
1012306-69 = "Похоже, такая перспектива вас порядком тревожит. Но будем честны: это ведь не первая ваша поездка со мной, верно?"
1012306-70 = "...Сенсей."
1012306-71 = ""
1012306-73 = ""
1012306-74 = ""
1012306-75 = ""
1012306-77 = "...Я похищаю вас. Прямо сейчас."
