[translation]
21130-1 = "Episódio 13;Nerd VS Maid"
21130-2 = "Millennium - Sala de Operações"
21130-3 = "(KABOOOOM!)"
21130-4 = "Guh?!"
21130-5 = "E-Eu fui derrotada...!"
21130-6 = "O... o feitiço de ressurreição..."
21130-8 = "(Baque)"
21130-10 = "..."
21130-11 = "Não dá para acreditar..."
21130-12 = "Fiquei me perguntando que estratégia usariam, e logo de cara escolheram invadir na força bruta."
21130-13 = "Então esta é a Aris-chan."
21130-14 = "Ela é tão fofa... Dá até vontade de treiná-la como a sexta agente empregada. Posso levá-la para casa?"
21130-15 = "...Isso está fora de questão."
21130-16 = "Por enquanto, ela é uma das culpadas por atacar o conselho estudantil... Vamos deixá-la trancada na sala de reflexão do conselho por ora."
21130-17 = "Mesmo assim... jamais imaginei que explodiriam a porta à força só para burlar o \"sistema de reconhecimento de digitais\" do elevador."
21130-18 = "Verifiquei. Vai ser difícil consertar a trava de segurança do elevador rapidamente. A única solução seria substituir tudo de uma vez..."
21130-19 = "Entendi, então vamos trocar por um novo... Não, espera um pouco."
21130-20 = "É só um palpite, mas aquela arma absurdamente gigante da Aris-chan... com certeza foi feita pelo Clube de Engenharia."
21130-21 = "Nessas horas, costumamos sempre encomendar com o Clube de Engenharia, mas..."
21130-22 = "...Não podemos descartar a possibilidade de ser uma armadilha."
21130-23 = "...Comprem o sistema de segurança mais forte que encontrarem e instalem o quanto antes. Mas que não seja fabricado pelo Clube de Engenharia."
21130-25 = "Millennium - Corredor"
21130-26 = "Uuuuh! Levaram a Aris!"
21130-27 = "Calma, Momoi, está tudo conforme o plano."
21130-28 = "Aris-chan... aguenta firme, vamos te resgatar rapidinho."
21130-31 = "Bom... parece que a primeira armadilha deu certo."
21130-32 = "Não é mesmo, Sensei?"
21130-33 = "[s1] \"Sim, verdade.\"\n[s2] \"Agora pergunte ao Clube de Engenharia se já estão prontos.\""
21130-34 = "Acabou de chegar uma mensagem: \"Aqui é o Clube de Engenharia, conseguimos infiltrar o Cavalo de Troia\"... disseram isso."
21130-35 = "Acabou de chegar uma mensagem: \"Aqui é o Clube de Engenharia, conseguimos infiltrar o Cavalo de Troia\"... disseram isso."
21130-36 = "Ufa, que alívio. Se tivesse falhado, a Aris teria sido trancada à toa..."
21130-37 = "Então, vamos para o próximo passo?"
21130-39 = "...Pois bem, vamos começar."
21130-40 = "Aah, estou nervosa..."
21130-41 = "Não me sentia assim desde que invadimos o prédio da Sociedade de Pesquisa de História Antiga."
21130-42 = "E a Hibiki e a Utaha-senpai?"
21130-44 = "Disseram que já estão prontas para receber os \"visitantes\"."
21130-45 = "Ótimo, como esperado delas."
21130-46 = "Embora o que estamos fazendo não seja lá muito certo..."
21130-47 = "E quanto à Maki e à Kotori?"
21130-48 = "Aqui também está tudo pronto, em posição~."
21130-49 = "Deixem comigo! Segundo a minha teoria, a probabilidade de sucesso desta operação é de 2%!"
21130-50 = "Quêê?! Isso é praticamente fracasso garantido! Por que você está falando tão confiante?!"
21130-51 = "Ehehe, era só uma piadinha para descontrair! É o contrário, temos 98% de chance de sucesso!"
21130-52 = "Se a Kotori-chan e a Maki-chan também já estão prontas..."
21130-53 = "Então é a fase 2."
21130-54 = "Com licença... Sensei!"
21130-55 = "[s] \"Iniciar operação!\""
21130-57 = "Sim!"
21130-58 = "Bora láaa!!"
21130-60 = "Millennium - Sala de Operações"
21130-62 = "(Bip-bip-bip, bip-bip-bip)"
21130-63 = "...Chegaram."
21130-64 = "Alvos detectados nas câmeras de segurança. Portão 1, alvos confirmados no ponto A1."
21130-65 = "Em breve entrarão no ponto A2."
21130-66 = "Se chegarem até lá, podemos considerar a fuga praticamente impossível, certo? ...Nesse caso, eu irei."
21130-67 = "Nossa, está dando bastante crédito a elas. Precisa mesmo da Akane ir pessoalmente?"
21130-68 = "Com certeza."
21130-71 = "Recepcionar os convidados é o básico para uma empregada."
21130-73 = "Millennium - Veritas"
21130-74 = "(Voltando no tempo, 2 horas antes. Durante a reunião de estratégia...)"
21130-75 = "Então, vou explicar sobre o depósito de itens confiscados do conselho estudantil, onde estaria o nosso alvo, o \"Espelho\"."
21130-76 = "O conselho estudantil de Millennium, o \"Seminar\", usa basicamente o último andar da Torre Millennium como espaço exclusivo."
21130-77 = "O depósito de itens confiscados onde está o \"Espelho\" fica na ala oeste desse último andar."
21130-78 = "Pelo que pesquisei, para chegar da entrada até o depósito, precisamos passar por cerca de 400 câmeras de segurança, quase 50 robôs de guarda e dezenas de robôs de combate confiscados de empresas clandestinas."
21130-79 = "Para ser exata, são 442 câmeras de segurança e 52 robôs de guarda divididos em 3 modelos."
21130-80 = "Vocês estão com cara de quem se pergunta como eu sei tantos detalhes... É simples. Fomos nós, do Clube de Engenharia, que ajudamos a construir aquele sistema de segurança."
21130-83 = "Ueeeh..."
21130-84 = "O maior problema é que, para chegar ao depósito, é obrigatório usar o \"elevador\". E esse elevador tem um sistema de reconhecimento de digitais que só permite a passagem de membros do conselho estudantil e poucas pessoas autorizadas."
21130-85 = "Mesmo que conseguíssemos passar pelo elevador, claro que haveria alunas do Seminar e seguranças armados lá dentro, e acima de tudo..."
21130-86 = "O último andar é dividido em seções, sala por sala."
21130-87 = "Seções... Mas salas serem divididas não é algo óbvio?"
21130-88 = "As seções são integradas ao sistema de segurança. Então, se houver fogo ou fumaça em alguma sala, as portas de aço descem para isolá-la das demais."
21130-89 = "E se essas portas de aço descerem, elas também só podem ser destravadas com a digital de um membro do conselho estudantil."
21130-90 = "Se detectar uma digital não registrada ou um impacto forte, uma segunda porta de aço de titânio, ainda mais resistente, é acionada. Aí será necessária a autenticação dupla de digital e íris de um oficial do conselho estudantil."
21130-91 = "Huuuum, que complicado... Além disso, é tão absurdo que nem consigo imaginar direito..."
21130-92 = "Resumindo, primeiro: o único jeito de chegar ao depósito de itens confiscados é pelo elevador."
21130-93 = "Depois, há um sistema de segurança por digitais, e se errarmos, portas de aço descem, dificultando ir para outras seções."
21130-94 = "E se tentarmos passar à força, uma porta de aço ainda mais forte desce e nos deixa presas..."
21130-95 = "E não esqueçam dos robôs de guarda e das câmeras de segurança~."
21130-96 = "As câmeras de segurança até dá para hackear... mas o sistema de segurança em si parece difícil de invadir de frente, mesmo com o poder da Veritas. Afinal, ele é basicamente isolado da rede externa."
21130-97 = "Ah, chegou mais uma informação nova. Se tentarmos invadir o elevador à força, as portas de aço de todas as seções do último andar descem."
21130-99 = "Aah, chega! Só tem notícia difícil e desesperadora! Não tem nenhuma notícia boa, não?!"
21130-100 = "...Se for sobre pontos fracos, existe um."
21130-101 = "Primeiro, ele é vulnerável ao corte de energia externa. Quando a energia cai, ele se conecta automaticamente à rede externa, abrindo uma brecha temporária para invasão."
21130-102 = "Com o micro-EMP que construímos, podemos aproveitar essa brecha para desativar todos os sistemas. O tempo de desativação provável é de... cerca de 6 segundos."
21130-103 = "6 segundos, é..."
21130-106 = "É mais do que suficiente."
21130-108 = "Millennium - Corredor"
21130-109 = "(E então, o tempo volta ao presente)"
21130-110 = "Huum, era por aqui mesmo?"
21130-111 = "Parece que viemos bem para o fundo... mas acredito que não estamos erradas."
21130-113 = "Sim, vocês acertaram."
21130-114 = "?!"
21130-115 = "Boa noite, que bela noite, não é? Acompanhei todos os movimentos de vocês duas até aqui pelas câmeras de segurança."
21130-116 = "Talvez já tenham percebido vagamente, mas o plano de vocês já falhou. Recomendo que se rendam o quanto antes."
21130-117 = "Permitam-me me apresentar novamente: sou a Codinome Zero Três da C&C... Como meu nome verdadeiro é segredo, podem me chamar de Bela Empregada Misteriosa."
21130-118 = "A-Akane-senpai!"
21130-119 = "Aquela Akane-senpai famosa por ter \"assassinato\" como especialidade?"
21130-120 = "Huum... Em teoria eu deveria ser uma agente secreta, como é que fiquei tão conhecida assim...? Será que heroínas de identidade secreta já saíram de moda...?"
21130-121 = "A gente sabe de várias coisas~. Segundo a Kotama-senpai, parece que recentemente o seu peso..."
21130-122 = "E-Esperem um pouco! Esse vazamento de informações já passa dos limites, não acham?!"
21130-123 = "Quanto a essa informação, vou fazê-las guardar silêncio eterno...! Vamos, já está na hora de mostrarem seus rostos, Momoi-chan, Midori-chan!"
21130-125 = "..."
21130-126 = "..."
21130-127 = "Fufufu..."
21130-131 = "Acho que ainda não percebeu. O plano que falhou foi o de vocês, sabia?"
21130-132 = "Como?"
21130-137 = "(Passo suave)"
21130-138 = "Oiii, Akane-senpai! A gente estava tentando voltar para o dormitório, mas acabou se perdendo~."
21130-140 = "V-Vocês duas?!"
21130-141 = "Se perguntam quem somos nós! Explicar é a nossa sina!"
21130-142 = "Fornecendo respostas para qualquer pergunta! A encarnação da explicação do Clube de Engenharia, Toyomi Kotori!"
21130-143 = "A combinação de arte e ciência! A artista digital da Veritas, Maki!"
21130-144 = "Impossível! Quem veio até aqui deveriam ser a Midori-chan e a Momoi-chan?! Eu vi claramente nas câmeras de segurança...!"
21130-146 = "Yuuka! O que está acontecendo?!"
21130-147 = "Não sei! Nas câmeras daqui, a Momoi e a Midori ainda estão aparecendo! E, Akane, você não está aparecendo na imagem...!"
21130-148 = "O-O quê?! Será que isso é...?!"
21130-149 = "Reiniciem as configurações das câmeras! Cortem a conexão com a nuvem e exibam as imagens novamente pela linha privada!"
21130-150 = "Atualizando! Nova imagem... apareceu! Akane confirmada! Está frente a frente com Kotori e Maki!"
21130-151 = "Entendi, então quer dizer que..."
21130-152 = "As imagens que estávamos vendo até agora eram... não pode ser?!"
21130-154 = "Millennium - Corredor"
21130-155 = "Acho que a essa altura já descobriram que era uma gravação."
21130-156 = "Pensando bem, não teria sido melhor só passar uma gravação de tudo calmo e ir pegar o \"Espelho\" escondidas?"
21130-157 = "Como é um lugar muito movimentado, não ter ninguém passando poderia levantar suspeitas, não acha?"
21130-158 = "Além disso, dividir as senpais da C&C e deixá-las presas assim aumenta as nossas chances de sucesso na missão."
21130-164 = "Ah, o elevador chegou! Então vamos entrar \"de verdade\" agora!"
21130-165 = "Espere um pouco... Sensei, está bem escuro por aqui, então segure firme nas nossas mãos, por favor."
21130-166 = "Então... vamos lá!"
21130-167 = "Go!"
21130-169 = "(Uuuuuuuh!)"
21130-171 = "Millennium - Corredor"
21130-172 = "Intrusos detectados. Por medida de emergência, todas as seções do andar exclusivo do Seminar serão fechadas."
21130-173 = "Isto é... as portas de aço?!"
21130-174 = "(CLANG!)"
21130-175 = "Aah, francamente..."
21130-176 = "Hehe, ficamos presas juntas que nem boas amigas~?"
21130-177 = "...Não é bem assim. Diferente de vocês, minhas digitais estão registradas no sistema."
21130-178 = "Se não quiserem se machucar, fiquem quietinhas aí. Foi uma honra conhecê-las, mas eu já vou..."
21130-179 = "Dados incompatíveis. Impressão digital não registrada."
21130-180 = "Quê...?!"
21130-181 = "Ativando segunda porta de aço."
21130-182 = "N-Não pode ser?!"
21130-184 = "(Estrondo... CLANG!)"
21130-186 = "Millennium - Sala de Operações"
21130-187 = "A Akane ficou presa!"
21130-188 = "Algum oficial do conselho estudantil... A Noa deve estar por perto, peçam para ela abrir!"
21130-191 = "O que exatamente elas estão tramando...? Desse jeito, a Momoi e a Midori \"verdadeiras\" também ficariam presas em algum lugar—"
21130-192 = "Ah, será que...?!"
21130-193 = "Contato da Noa! Ela disse que elas também estão presas!"
21130-194 = "Nem a digital da Noa está abrindo as portas de aço, ela está pedindo ajuda!"
21130-195 = "O-O-O quê?!"
21130-196 = "Deu defeito logo agora?! Acabamos de instalar um novo, e transferimos todos os dados de digitais direitinho... Não, espera?!"
21130-197 = "Já veio hackeado?! Então elas planejaram isso desde o começo, fazendo a Aris-chan destruir a porta primeiro...?!"
21130-199 = "Millennium - Interior do Prédio Escolar"
21130-200 = "Sensei, mana, mensagem da Hare-senpai! Disse que conseguiram prender a Akane-senpai!"
21130-201 = "Beleza, o sistema de reconhecimento de digitais funcionou \"normalmente\" também."
21130-202 = "E todos os oficiais do conselho estudantil devem ter sido isolados também... Agora, os únicos que podem circular livremente pela torre somos nós!"
21130-203 = "Um sistema de segurança de última geração que parecia só um pouquinho mais fraco que o original do Clube de Engenharia... parece que funcionou perfeitamente."
21130-204 = "Como esconderam o nome, elas nem devem ter desconfiado que também era do Clube de Engenharia. Nesse ponto, o Clube de Engenharia mandou muito bem. Bom, então vamos entrar de cabeça erguida!"
21130-205 = "Bip— Saiba Momoi, Saiba Midori, Sensei: autorização das 3 pessoas concluída."
21130-206 = "Isso não dá uma sensação meio de déjà vu...?"
21130-207 = "Ah, tipo aquilo nas Ruínas? Que nostalgia, parece que faz tanto tempo."
21130-208 = "Pelo menos foi ótimo termos neutralizado a Akane-senpai. Já que estávamos nisso, queria ter prendido a Asuna-senpai junto... mas ainda não sabemos onde ela está, né?"
21130-209 = "A Hare-senpai vasculhou quase toda Millennium, mas... parece que não encontrou. Será que ela está fora de Millennium?"
21130-210 = "Ela é uma senpai que sempre aparece e some do nada, então não é fácil de achar. Dizem que às vezes ela sai do nada no meio de uma missão só para comer parfait... Bom, até agora está tudo conforme o plano, então sem estresse!"
21130-211 = "Quem está aí?!"
21130-212 = "Ai! Ei, é o conselho estudantil! Ainda tinha gente aqui!"
21130-213 = "O-O que a gente faz, Sensei?!"
21130-214 = "[s3] \"Vamos abrir caminho.\"\n[s4] \"...Que tal fugirmos?\""
21130-215 = "...É, parece que o único jeito é abrir caminho."
21130-216 = "...Sim, tem razão. Não podemos fugir depois de chegar até aqui."
21130-217 = "...Não, não podemos fugir agora! Vamos dar um jeito de passar!"
21130-218 = "Não podemos recuar agora!"
21130-219 = "Pelo bem da Aris-chan também!"
21130-221 = "..."
21130-222 = "[s] \"...Certo, vamos lá!\""
