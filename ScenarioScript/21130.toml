[translation]
21130-1 = "Эпизод 13;Задроты против горничных"
21130-2 = "Главная диспетчерская Милленниума"
21130-3 = "*БА-А-АХ*"
21130-4 = "Аргх!"
21130-5 = "Я-Я пала!"
21130-6 = "Заклинание воскрешения... пожалуйста..."
21130-7 = ""
21130-8 = "*плюх*"
21130-10 = "..."
21130-11 = "Нелепость."
21130-12 = "Их план нападения на студсовет заключался в... лобовой атаке?"
21130-13 = "Итак, это должна быть Алиса."
21130-14 = "Она. Такая. Милая. Можно я её заберу? Я просто хочу подхватить её на руки и тренировками сделать её шестым агентом-горничной."
21130-15 = "Не можешь."
21130-16 = "Она будет под стражей в консультационной комнате за нападение на студсовет."
21130-17 = "Ну и бардак. Не могу поверить, что она пыталась пройти систему распознавания отпечатков пальцев лифта, просто взорвав дверь."
21130-18 = "Замок лифта восстановлению не подлежит. Его нужно немедленно заменить."
21130-19 = "Хмм... Тогда закажем замену прям— секундочку."
21130-20 = "Оружие Алисы должно быть из Инженерного Департамента..."
21130-21 = "Если так, обращаться к ним как обычно будет неразумно."
21130-22 = "Что-то тут нечисто..."
21130-23 = "Найдите самую мощную систему безопасности в Кивотосе, разработанную не Инженерным Департаментом, и раздобудьте её как можно скорее."
21130-25 = "Внешний коридор Милленниума"
21130-26 = "Д-Дерьмо! Алису уводят!"
21130-27 = "Успокойся, Момои. Всё идёт по плану."
21130-28 = "Держись, Алиса... Мы скоро тебя спасём."
21130-29 = ""
21130-31 = "Ну... пока всё хорошо."
21130-32 = "Верно, Сенсей?"
21130-33 = "[s1] «Верно.»\n[s2] «Все готовы?»"
21130-34 = "Сообщение Инженерного Департамента гласит: \"Хорошая работа. Троянский конь прошёл ворота\"."
21130-35 = "Сообщение Инженерного Департамента гласит: \"Хорошая работа. Троянский конь прошёл ворота\"."
21130-36 = "Фух! Какое облегчение. Если бы не сработало, Алису заперли бы зря."
21130-37 = "Время для следующего шага."
21130-39 = "Н-Начинаем?"
21130-40 = "*вздох* Я так нервничаю."
21130-41 = "Такого не было с тех пор, как мы ворвались в здание Общества Исследования Древней Истории."
21130-42 = "Как дела у Хибики и Утахи?"
21130-43 = ""
21130-44 = "Мы готовы встретить наших гостей."
21130-45 = "Хорошо."
21130-46 = "А правда ли хорошо?"
21130-47 = "Что насчёт Маки и Котори?"
21130-48 = "Ожидаем!"
21130-49 = "Не волнуйтесь, мы точно справимся! По моим расчётам, шанс успеха целых два процента!"
21130-50 = "Н-Но это значит, что шанс провала 98 процентов!"
21130-51 = "Хи-хи, целиком и полностью шучу! На самом деле всё наоборот!"
21130-52 = "Ну, если Котори и Маки готовы..."
21130-53 = "...начинаем вторую фазу."
21130-54 = "Дайте сигнал, Сенсей!"
21130-55 = "[s] «Сделаем это!»"
21130-57 = "Да!"
21130-58 = "Поехали!"
21130-60 = "Главная диспетчерская Милленниума"
21130-61 = ""
21130-62 = "*би-бип би-бип*"
21130-63 = "Они здесь."
21130-64 = "Камера подтверждает визуальный контакт с целью. Цель выходит в точке A1 у входа №1."
21130-65 = "Цель приближается к точке A2."
21130-66 = "Значит, пути отхода у них нет, верно? Хорошо. Я займусь."
21130-67 = "А? Ты правда должна делать это лично?"
21130-68 = "Ну конечно."
21130-69 = ""
21130-71 = "В конце концов, встречать гостей с улыбкой — самая базовая обязанность горничной."
21130-73 = "Милленниум — Веритас"
21130-74 = "Два часа назад..."
21130-75 = "Для начала давайте подробнее разберём цель: склад контрабанды студсовета. Текущее место хранения Зеркала."
21130-76 = "Семинар, студсовет Милленниума, от природы подозрительны, и самый верхний этаж башни Милленниума целиком предназначен только для них."
21130-77 = "Склад контрабанды находится в западной части верхнего этажа."
21130-78 = "Между нами и складом около 400 камер и чуть больше 50 охранных роботов. Некоторые из этих роботов конфискованы у сомнительных организаций."
21130-79 = "442 камеры наблюдения и 52 робота трёх типов, если точнее."
21130-80 = "Видите ли, внедрять их систему безопасности помогал Инженерный Департамент."
21130-81 = ""
21130-83 = "Ого..."
21130-84 = "Главная проблема в том, что к складу можно попасть только на лифте. А доступ к нему есть лишь у персонала с авторизацией по отпечатку."
21130-85 = "Даже если обойти лифт, вы неизбежно столкнётесь с членами студсовета и вооружённой охраной. И что самое важное..."
21130-86 = "...все зоны, доступные только студсовету, можно изолировать друг от друга."
21130-87 = "Что это значит?"
21130-88 = "Допустим, в одной из комнат обнаружили дым. Тогда опускаются ставни, отделяющая комнату от остальных."
21130-89 = "После опускания ставней поднять их можно только отпечатком пальца члена студсовета."
21130-90 = "Что будет, если ввести неавторизованный отпечаток? Опустятся ещё и усиленные титаном ставни. Чтобы снять обе, понадобятся одновременно действующий отпечаток и скан сетчатки члена студсовета."
21130-91 = "Угх. У меня уже голова не варит от всего этого."
21130-92 = "То есть правильно понимаю: между этажами можно передвигаться только на лифте."
21130-93 = "Наверху стоят устройства безопасности по отпечатку, которые при срабатывании опускают тяжёлые ставни и изолируют зону."
21130-94 = "Кроме того, если не пройти проверку, срабатывают ещё более мощные ставни."
21130-95 = "Не забывай про вооружённую охрану и камеры!"
21130-96 = "Камеры можно взломать. Однако вмешаться в работу ставней невозможно, даже для Веритас. Они подключены к единственной изолированной, внутренней сети."
21130-97 = "А ещё мы только что узнали, что попытка силой взломать лифт заблокирует весь этаж."
21130-99 = "А-а-аргх! Одни плохие новости! Где хорошие?!"
21130-100 = "Ну, слабое место есть. Мы-то знаем — сами его оставили."
21130-101 = "Во-первых, система уязвима к внешним перебоям электропитания. При отключении питания она автоматически подключается к внешней сети, открывая короткий промежуток времени для взлома."
21130-102 = "Используя наши нано-ЭМИ, мы можем примерно на шесть секунд вернуть Милленниум в каменный век."
21130-103 = "Шесть секунд..."
21130-104 = ""
21130-105 = ""
21130-106 = "Этого хватит."
21130-108 = "Внешний коридор Милленниума"
21130-109 = "Обратно в настоящем..."
21130-110 = "Эм. Кажется, где-то здесь."
21130-111 = "Что-то не так. Тебе не кажется, что мы зашли слишком далеко?"
21130-113 = "Вовсе нет. Вы именно там, где должны быть."
21130-114 = "А?!"
21130-115 = "Добро пожаловать. Я ждала вас."
21130-116 = "Как вы уже, несомненно, поняли, ваш план провалился."
21130-117 = "Я из C&C, позывной Ноль-Три. Моё настоящее имя засекречено, так что можете звать меня Прекрасной Таинственной Горничной."
21130-118 = "*вдох* Это Акане!"
21130-119 = "Разве не она агент-горничная, специализирующаяся на тихих убийствах?"
21130-120 = "Вот досада. Какой смысл в секретном агентстве, если о нём знают все? Значит, мне пора перестать играть загадочную героиню?"
21130-121 = "А, точно, разве Котама не говорила, что когда ты в последний раз взвешивалась, то была—"
21130-122 = "С-С-Стой! Уже то, что ты вообще знаешь нечто подобное, — огромная проблема!"
21130-123 = "Лучше держи эту информацию при себе, Момои. И ты тоже, Мидори!"
21130-125 = "..."
21130-126 = "..."
21130-127 = "Хи-хи-хи."
21130-128 = ""
21130-129 = ""
21130-130 = ""
21130-131 = "Ты пока не понимаешь, но потерпела неудачу именно ты."
21130-132 = "Что, простите?"
21130-136 = ""
21130-137 = "*топ, топ*"
21130-138 = "Хейя, Акане! Мы заблудились по пути в общежитие. Представляешь?"
21130-140 = "К-Кто вы такие?!"
21130-141 = "Ты правда хочешь знать?! Тогда позволь представиться!"
21130-142 = "Просили — получите! Ходячая энциклопедия Инженерного Департамента, Тоёми Котори!"
21130-143 = "Почему искусство и наука должны враждовать? Встречай штатную диджитал художницу Веритас — Маки!"
21130-144 = "Но вы не из Департамента Разработки Игр... Что...?!"
21130-146 = "Юука! Что всё это значит?"
21130-147 = "Не знаю! На камерах точно видно, как Момои и Мидори приближаются к точке A2! Но тебя нигде нет!"
21130-148 = "Ч-Что? Тогда... неужели?!"
21130-149 = "Сбросить настройки камер! Заблокировать облачный доступ и показывать только локальный канал!"
21130-150 = "Обновляю канал! Визуальный контакт подтверждён! Это Акане! Она столкнулась с Котори и Маки!"
21130-151 = "Это значит..."
21130-152 = "...запись, которую мы смотрели всё это время, была...?!"
21130-154 = "Коридор Милленниума"
21130-155 = "Любопытно, догадались ли они, что запись с камер заранее подготовлена."
21130-156 = "Может, лучше было просто включить запись пустого коридора, пока мы забираем Зеркало?"
21130-157 = "Там постоянно кто-то ходит. Они бы не поверили, если бы мы не сделали всё как следует."
21130-158 = "Разделить горничных и запереть их на месте — наш лучший шанс."
21130-159 = ""
21130-160 = ""
21130-164 = "О, лифт. В этот раз действительно поднимаемся наверх."
21130-165 = "Погодите... Сенсей, здесь темно, так что держись за наши руки."
21130-166 = "Ладно... Готовы!"
21130-167 = "Поехали!"
21130-169 = "*у-у-у-у-у*"
21130-171 = "Внешний коридор Милленниума"
21130-172 = "Обнаружен нарушитель. Начинается аварийная изоляция назначенного сектора этажа Семинара."
21130-173 = "Эй! Ставни опускаются. Только не говорите, что...?!"
21130-174 = "*бах*"
21130-175 = "Ох..."
21130-176 = "Похоже, нас заперли вместе!"
21130-177 = "Неважно. В отличие от вас, я легко отсюда выйду."
21130-178 = "Нужно лишь приложить палец сюда, и я освобожусь, а вы останетесь заперты... *бип*"
21130-179 = "Недействительный отпечаток."
21130-180 = "...А?!"
21130-181 = "Активированы вторичные ставни."
21130-182 = "Нет, стой!"
21130-184 = "*гр-р-р-рах бах*"
21130-186 = "Главная диспетчерская Милленниума"
21130-187 = "Акане заперта!"
21130-188 = "Отправьте члена студсовета! Ноа рядом! Она сможет открыть дверь."
21130-189 = ""
21130-191 = "Что они задумали? Настоящие Момои и Мидори тоже должны быть где-то заперты."
21130-192 = "Погодите. Неужели...!"
21130-193 = "Только что пришло сообщение от Ноа! Она тоже заперта, дверь не открывается!"
21130-194 = "На неё тоже опустились вторые ставни. Ноа нужна помощь!"
21130-195 = "Ч-Что за...?!"
21130-196 = "Но как?! Это совершенно новое оборудование, его установили только сегодня— О нет!"
21130-197 = "Поэтому Алиса и сломала те двери? Это с самого начала было частью их плана?!"
21130-199 = "Главный коридор Милленниума"
21130-200 = "Сенсей! Момои! Пришло сообщение от Харе! План по блокировке Акане сработал!"
21130-201 = "Сканер отпечатков работает именно так, как должен."
21130-202 = "Все члены студсовета изолированы! Теперь мы единственные, кто может свободно двигаться по этажу студсовета!"
21130-203 = "Слава богу, Инженерный Департамент сумел обманом заставить того производителя выступить посредником при продаже новой системы безопасности."
21130-204 = "Она сделана настолько хорошо, что совет даже не понял, что её на самом деле разработал Инженерный Департамент. Ладно, идём."
21130-205 = "*бип* Сайба Момои, Сайба Мидори и Сенсей. Доступ разрешён."
21130-206 = "Хмм? Разве что-то подобное не происходило совсем недавно...?"
21130-207 = "Точно. В руинах, да? Какая ностальгия. Хотя кажется, будто прошла целая вечность."
21130-208 = "Хорошо, что удалось запереть Акане, но жаль, что Асуну мы не поймали. Мы всё ещё не знаем, где она, да?"
21130-209 = "Харе обыскала весь Милленниум, но не нашла её. Может, она за пределами академии?"
21130-210 = "Наверное. Я слышала, однажды она бросила миссию ради парфе. Правда, вернулась вовремя и всё равно закончила миссию, но всё же... В общем, всё идёт по плану!"
21130-211 = "Кто здесь?!"
21130-212 = "И-и-и! Члены студсовета?! Здесь ещё кто-то остался?!"
21130-213 = "С-Сенсей?!"
21130-214 = "[s3] «Прорвёмся.»\n[s4] «Бежим.»"
21130-215 = "Похоже, выбора нет."
21130-216 = "Сенсей... Вы правда серьёзно?"
21130-217 = "Не-а! Я никуда не побегу! Нужно как-то прорваться!"
21130-218 = "Точно! Отступать нельзя!"
21130-219 = "Сделаем это ради Алисы!"
21130-220 = ""
21130-221 = "..."
21130-222 = "[s] «Вперёд!»"
21130-223 = ""
