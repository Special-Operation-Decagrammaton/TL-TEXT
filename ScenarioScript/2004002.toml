[translation]
2004002-1 = "Сацуки знает всё"
2004002-2 = "Вскоре после того, как я получил сообщение от Сацуки..."
2004002-3 = ""
2004002-6 = "Хи-хи, так вот какой кабинет Сенсея... Как и говорила Макото, он скромнее, чем можно было подумать."
2004002-7 = "О, я ведь не помешала вашей работе?"
2004002-8 = "[s] «Я всегда занят. В любом случае, зачем ты—»"
2004002-9 = "Что ж, неважно."
2004002-10 = "То, что я сейчас расскажу, имеет высший приоритет независимо от того, чем вы заняты."
2004002-11 = "[s1] «Ты всё равно особо слушать не собираешься, да?»\n[s2] «Что вообще происходит?»"
2004002-14 = "Хмф, думаю, вы и сами знаете, Сенсей."
2004002-15 = "Не нужно притворяться. Мы оба профессионалы, в конце концов."
2004002-16 = "Итак, согласно грандиозному плану Общества Пандемониума..."
2004002-17 = "Первый этап плана Макото по захвату медиа Кивотоса наконец начался."
2004002-18 = ""
2004002-20 = ""
2004002-21 = ""
2004002-22 = "Нам нужно ваше содействие как партнёра Общества Пандемониума."
2004002-23 = ""
2004002-26 = "[ns3] «Я никогда не соглашался помогать с чем-то подобным.»\n[ns4] «Я вообще ВПЕРВЫЕ об этом слышу...»"
2004002-29 = "О нет-нет. Информация Разведывательного комитета Общества Пандемониума НЕ МОГЛА быть ошибочной."
2004002-30 = "Хотите сказать, вы НЕ лизали туфли Макото и не обещали безоговорочное сотрудничество на тысячу лет перед всеми на площади Геенны?"
2004002-31 = "[s] «Нет!! Откуда вообще взялся настолько беспочвенный слух?!»"
2004002-32 = "Хмф, значит, наши сведения были ошибочны. Я единолично решила пропустить проверку — сами знаете, какая это морока, — и, похоже, теперь у нас проблема."
2004002-33 = "[s] «Смелое решение. Уже жалеешь?»"
2004002-34 = ""
2004002-36 = ""
2004002-37 = "...Хм. Полагаю, мне следует как следует представиться."
2004002-38 = "Я Кёгоку Сацуки, наследница Разведывательного комитета Студенческого совета Геенны."
2004002-39 = "Моя организация унаследовала весь опыт прежнего Разведывательного комитета Студенческого совета Геенны, с которым вы, несомненно, знакомы по истории."
2004002-40 = "Правда, ОФИЦИАЛЬНО я не ношу исходный титул, но считаю это небольшой формальностью."
2004002-41 = "[s] «Или, скорее, ты сама так решила.»"
2004002-42 = "Что ж, хватит любезностей. Перейдём к делу."
2004002-43 = "Если вы не желаете сотрудничать..."
2004002-44 = "Тогда мне не остаётся ничего другого, кроме как сообщить вам о компромате, который наш комитет собрал на вас."
2004002-45 = ""
2004002-47 = ""
2004002-48 = ""
2004002-51 = "[ns] «Каком компромате?»"
2004002-52 = "О вашей «слабости», Сенсей."
2004002-53 = "Хи-хи. Ну как? Готовы услышать всё об этом?"
2004002-54 = "[s] «...»"
2004002-56 = "[ns] «(У меня столько слабостей, что я даже не представляю, что она сейчас скажет...)»"
2004002-57 = "Во-первых."
2004002-58 = "Сенсей, нам известно, что вы..."
2004002-59 = ""
2004002-61 = ""
2004002-62 = "Увлекаетесь тем, что бегаете по полям Кивотоса совершенно голым. Верно?"
2004002-63 = "[s] «Ладно, это БЫЛО, но это никакое не увлечение!!»"
2004002-64 = "Как охотно вы это признаёте. Хм."
2004002-65 = "Очевидно, вам совсем не стыдно. Как и ожидалось от вас, Сенсей."
2004002-66 = "[s] «Мне БЫЛО стыдно, но—»"
2004002-67 = "Подождите. Мы ещё не закончили."
2004002-68 = "Всего мне известно несколько десятков ваших слабостей."
2004002-69 = "[s] «Столько? Какой жизнью я вообще жил?»"
2004002-70 = "Если вам некомфортно, мы можем остановиться в любой момент. Просто поклянитесь сотрудничать с Обществом Пандемониума следующие тысячу лет."
2004002-71 = "А теперь ваша вторая слабость..."
2004002-72 = "[ns] *глоть*"
2004002-73 = "Насколько я понимаю, Сенсей, вы..."
2004002-74 = ""
2004002-76 = ""
2004002-77 = "...каждый месяц помогаете собирать средства для студентов, которым не хватает денег на еду. Хи-хи."
2004002-78 = "[s] «...»"
2004002-80 = "[ns5] «Странно упоминать такое в этом контексте.»\n[ns6] «Это скорее добрая история, чем слабость, разве нет?»"
2004002-83 = "О нет. Вовсе нет."
2004002-84 = "Кивотос — дикая земля. Здесь действует только закон выживания сильнейшего."
2004002-85 = "Проявлять сочувствие или милосердие в столь жестоком мире — значит делать себя совершенно уязвимым, разве не так?"
2004002-86 = "[s] «Я учитель. Я забочусь о своих учениках.»"
2004002-87 = "Хи-хи, даже это разоблачение вас не поколебало, да?"
2004002-88 = "Хитро, Сенсей. Если добровольно признать постыдную правду, она перестаёт быть рычагом давления."
2004002-89 = "[s] «Во-первых, в этом нет ничего „постыдного“...»"
2004002-90 = "О, но мы только начинаем."
2004002-91 = "Ваша третья слабость, Сенсей..."
2004002-92 = ""
2004002-94 = ""
2004002-95 = "Когда вы завариваете лапшу быстрого приготовления, то трясёте упаковку, чтобы вытряхнуть все крошки!"
2004002-96 = "[s] «...»"
2004002-98 = "[ns] «Разве это не нормально...?»"
2004002-99 = "Хи-хи, ну, «обычному» человеку это бы сошло с рук, но вам?"
2004002-100 = "Сенсей из Шале, благородный образец для подражания, выскребает последние крошки как простолюдин?"
2004002-101 = "Что скажут ученики, если узнают? Как быстро они отвернутся от вас в разочаровании?"
2004002-102 = "Но Общество Пандемониума... о, мы другие. Мы готовы принять даже—"
2004002-103 = "[s] «Нет, серьёзно, это нормально. Всё в порядке.»"
2004002-104 = ""
2004002-106 = "По-моему, вы не до конца понимаете ситуацию. Мне что, разжевать?"
2004002-107 = "Это шантаж, Сенсей. Я вас шантажирую."
2004002-108 = ""
2004002-110 = ""
2004002-111 = ""
2004002-112 = "У меня есть возможность раскрыть всему миру каждую из ваших чудовищных слабостей."
2004002-113 = "[s] «Не уверен, что это вообще станет проблемой.»"
2004002-114 = ""
2004002-116 = ""
2004002-117 = ""
2004002-118 = "И даже теперь вы продолжаете держаться, да? Хи-хи..."
2004002-119 = "Что ж, вы сильнее, чем я думала. Это признаю."
2004002-120 = "Похоже, так не сработает."
2004002-121 = "Но это ещё не конец. Даже близко."
2004002-122 = "Я сделаю всё, что потребуется, чтобы вы ТОЧНО согласились сотрудничать."
2004002-123 = "Что ж, тогда до встречи."
2004002-124 = "[s] «Х-Хорошо... Пока...»"
2004002-125 = ""
2004002-127 = "И уверяю вас, в следующий раз я уже не буду так добра."
2004002-128 = ""
2004002-130 = ""
2004002-132 = "[ns] «Кажется, как минимум один из нас очень сильно всё неправильно понял.»"
