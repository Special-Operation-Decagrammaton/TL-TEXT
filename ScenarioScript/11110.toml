[translation]
11110-2 = "Эпизод 11;На Чёрный рынок! Часть 1"
11110-3 = "Чёрный рынок"
11110-4 = "На рынке огромная толпа."
11110-5 = "Так вот он какой, Чёрный рынок..."
11110-6 = "Ого! Здесь куча народу! ☆"
11110-7 = "Ага. Я ожидала чего-то поменьше, а здесь почти отдельный город."
11110-8 = "Не думала, что несанкционированный район может быть настолько огромным и оживлённым."
11110-9 = "Если честно, мы почти никогда не покидаем Абидос. За пределами нашего района полно странных мест."
11110-10 = "Ты раньше здесь бывала, Хошино?"
11110-11 = "Нет, но я слышала истории о самых разных местах в городе."
11110-12 = "Говорят, где-то есть даже гигантский океанариум!"
11110-13 = "Надо как-нибудь всем туда сходить. Хех. Представьте, сколько там суши..."
11110-14 = "Точно не знаю, но мне кажется, океанариум не ДЛЯ ЭТОГО..."
11110-15 = "Смотрите в оба. Вы в самом сердце нелегальной торговли оружием, так что будьте готовы ко всему."
11110-16 = "Если что-нибудь случится, я... А?!"
11110-17 = "*пах* *пах* *пах* *тат*"
11110-19 = "Стрельба."
11110-22 = "А ну стой!"
11110-23 = "В-ва-а-а! Нет, нет, нет! П-пожалуйста, перестаньте за мной гнаться!"
11110-24 = "А с чего бы нам останавливаться?!"
11110-25 = ""
11110-26 = ""
11110-28 = "Эй. Эта форма..."
11110-30 = ""
11110-31 = "Берегитесь! Дорогу!"
11110-32 = ""
11110-33 = ""
11110-34 = "*грохот*"
11110-35 = "А-ай... Простите!"
11110-36 = "Вы в порядке?"
11110-37 = "Хотя раз за тобой гонятся, вопрос, наверное, лишний."
11110-38 = "Ну... это..."
11110-41 = "Вы ещё кто такие? С дороги! У нас дело к тому студенту Тринити!"
11110-42 = "Эм... А у меня к вам никаких дел нет."
11110-43 = "...!"
11110-44 = "Точно! Эта форма принадлежит Тринити — одной из крупнейших академий во всём Кивотосе!"
11110-45 = ""
11110-46 = "И одной из самых богатых! За её похищение наверняка можно потребовать огромный выкуп!"
11110-47 = "Похищение и переговоры! Вот это я понимаю инвестиционный план!"
11110-48 = "Ну как? Заинтересованы? Можем поделить по-честному..."
11110-49 = ""
11110-50 = "А?"
11110-51 = ""
11110-52 = ""
11110-53 = "*удар*"
11110-54 = "А-а-аргх!"
11110-55 = "Плохих парней нужно наказывать! ☆"
11110-56 = "Хм-м."
11110-57 = "О. Боже мой."
11110-59 = "С-спасибо вам огромное. Если бы не вы, у меня были бы большие неприятности в школе."
11110-60 = "Уже плохо, что я тайком пришла сюда одна. А если бы ещё что-то случилось...#nУ меня голова болит от одной мысли!"
11110-61 = "Ты сказала, тебя зовут Хифуми, да? Что студент Тринити делает в таком опасном месте?"
11110-62 = "А-ахаха... Долгая история. Я пришла сюда кое-что найти..."
11110-63 = "Это больше не производят, но я слышала, что иногда такое всплывает на Чёрном рынке."
11110-64 = "Что, танк?"
11110-65 = "Контрабандное оружие?"
11110-66 = "Биохимический агент?"
11110-67 = "Что?! Нет, конечно! Это... лимитированный товар с Пероро."
11110-68 = "Пероро?"
11110-69 = "Лимитированный товар?"
11110-70 = "Ага! Вот этот! Ограниченная серия плюшевых игрушек из коллаборации «Пероро и мороженое»!"
11110-71 = "Их выпустили всего 100 штук!"
11110-72 = "Ну как? Милый, правда?"
11110-73 = "..."
11110-74 = "Ого! Я тоже обожаю Momo Friends! Пероро такой милый! ☆#nА лично я фанатка мистера Николая."
11110-75 = "Правда? То, как мистер Николай рассуждает о философии, просто восхитительно!"
11110-76 = "Я недавно даже купила сборник работ мистера Николая,#n«За пределами добра и зла»! И ещё первое издание!"
11110-77 = "Понятия не имею, о чём они говорят."
11110-78 = "Ты никогда особо не любила всякие милые штучки, Хошино."
11110-79 = "Хм. Видимо, я просто не понимаю нынешнюю молодёжь."
11110-80 = "Мы практически ровесницы..."
11110-81 = "Я пришла сюда искать эту игрушку, но в итоге за мной погнались те бандиты.#nВ любом случае без вас я бы серьёзно влипла."
11110-82 = "А что студенты Абидоса делают в таком месте?"
11110-83 = "То же, что и ты. Мы кое-что ищем."
11110-84 = "Ага. Вещь, которую больше не производят и очень трудно достать.#nНо мы слышали, что здесь её можно найти."
11110-85 = "Ого, великие умы мыслят одинаково."
11110-86 = "Погодите, все! К вам приближаются вооружённые силы!"
11110-87 = "Что?!"
11110-89 = "Вот они!"
11110-90 = "Вы заплатите за то, что связались с нами!"
11110-93 = "Должно быть, они из той же банды, что и головорезы, которых вы прогнали.#nИ, похоже, очень хотят подраться!"
11110-94 = "Ну, если им нужна драка..."
11110-95 = "Почему, куда бы мы ни пошли, мы постоянно связываемся с такими отморозками? Может, дело в нас?"
11110-96 = "Пожалуетесь потом... Сейчас нужно действовать!"
