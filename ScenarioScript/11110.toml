[translation]
11110-2 = "Episódio 11;Rumo ao Mercado Negro (1)"
11110-3 = "Mercado Negro"
11110-4 = "(Burburinho)"
11110-5 = "Então este é o Mercado Negro..."
11110-6 = "Uau☆ Que lugar mais movimentado, né?"
11110-7 = "Verdade. Eu estava imaginando um mercadinho pequeno, mas isso aqui tem o tamanho de uma cidade inteira."
11110-8 = "Não achei que uma área fora do alcance do Conselho Estudantil Geral tivesse ficado tão grande assim."
11110-9 = "Uhe~ É que normalmente a gente só fica em Abydos, né~ Fora do nosso distrito escolar tem um monte de lugares bem esquisitos."
11110-10 = "Hoshino-senpai, você já veio aqui antes?"
11110-11 = "Nah, é a minha primeira vez também~ Mas ouvi dizer que nos outros distritos escolares tem várias coisas bem bizarras."
11110-12 = "Dizem que tem até um aquário gigantesco. Chamam de \"Aquarium\"!"
11110-13 = "Quero ir lá qualquer dia~ Uhe, peixes... sashimi..."
11110-14 = "Não entendo muito bem, mas acho que não é bem assim que um \"Aquarium\" funciona..."
11110-15 = "Pessoal, não baixem a guarda. Esse é um lugar onde se negociam armas e armamentos ilegais. Nunca se sabe o que pode acontecer."
11110-16 = "Se acontecer alguma coisa, eu... Kyaaah?!"
11110-17 = "(Tá-tá-tá-tá-tá-tá-tá-tá!)"
11110-19 = "Tiros."
11110-22 = "Espera aí!!"
11110-23 = "U-Uwaaah! Isso é ruim, muito ruim!! P-Por favor, parem de me seguir!!"
11110-24 = "Até parece!"
11110-28 = "Espera... aquele uniforme é..."
11110-31 = "Wa-wa-wa, sai da frente, por favor!!"
11110-34 = "(Tum!)"
11110-35 = "A-Ai, ai... D-Desculpa!"
11110-36 = "Tudo bem?"
11110-37 = "Claro que não, né? Ela parece estar sendo perseguida."
11110-38 = "B-Bem... é que..."
11110-41 = "Quem são vocês? Saiam da frente! Nós temos negócios com essa aluna de Trinity aí."
11110-42 = "A-Auu... E-Eu não tenho negócio nenhum com vocês, mas..."
11110-43 = "...!!"
11110-44 = "Lembrei desse uniforme... É da Escola Geral Trinity, uma das maiores megaescolas de Kivotos!"
11110-46 = "Isso mesmo, e também a escola mais rica de Kivotos!#nPor isso vamos sequestrá-la e arrancar um belo resgate!"
11110-47 = "Sequestro e negociação! Um baita investimento, não acha? Hehehehe."
11110-48 = "E aí, se vocês se interessarem, querem entrar no plano? A divisão do resgate..."
11110-50 = "Hã?"
11110-53 = "(Pá! Pá!)"
11110-54 = "Ugyaaah!"
11110-55 = "Temos que dar uma lição nos vilões☆"
11110-56 = "Nn."
11110-57 = "Ah... Hã? Hã?"
11110-59 = "M-Muito obrigada. Se não fosse por vocês, eu teria causado um problemão para a escola..."
11110-60 = "Além disso, eu saí escondida, então se eu me envolvesse em algum problema... Auu... Só de imaginar..."
11110-61 = "Hmm, Hifumi-chan, né? Mas me diz, o que uma mocinha de Trinity veio fazer num lugar perigoso desses?"
11110-62 = "A-Ahaha... Sobre isso... Na verdade, eu estou procurando uma coisa..."
11110-63 = "É algo que não é mais vendido, então não dá para comprar normalmente, mas ouvi dizer que negociam escondido aqui no Mercado Negro..."
11110-64 = "Por acaso... um tanque de guerra?"
11110-65 = "Ou armas de fogo ilegais?"
11110-66 = "Armas químicas, talvez?"
11110-67 = "Quê?! N-Não... Bem, é um item de edição limitada do Peroro-sama."
11110-68 = "Peroro?"
11110-69 = "Item limitado?"
11110-70 = "Sim! É este aqui. Uma pelúcia limitada da colaboração do Peroro-sama com uma sorveteria!"
11110-71 = "É uma edição limitada com apenas 100 unidades produzidas."
11110-72 = "Viu? Não é fofo?"
11110-73 = "..."
11110-74 = "Uau☆ É da Momo Friends, né! Eu também amo! O Peroro-chan é tão fofo, né?!#nEu adoro o Sr. Nicolai."
11110-75 = "Eu entendo! Esse lado filosófico do Nicolai-san é tão legal."
11110-76 = "Eu até comprei o livro novo do Nicolai-san, \"Além do Bem e do Mal\"! E a primeira edição ainda!"
11110-77 = "...Olha, o velhote aqui não faz a menor ideia do que vocês estão falando~"
11110-78 = "A Hoshino-senpai não tem o menor interesse nessas coisas fofinhas, né?"
11110-79 = "Hmph, não consigo acompanhar esses jovens de hoje em dia."
11110-80 = "A gente quase não tem diferença de idade..."
11110-81 = "Então, eu vim aqui comprar esse item, mas aquele pessoal veio mexer comigo...#nNem quero imaginar o que teria acontecido se vocês não estivessem aqui."
11110-82 = "...A propósito, pessoal de Abydos, o que vocês vieram fazer aqui?"
11110-83 = "A gente tá numa situação parecida. Estamos procurando uma coisa também~"
11110-84 = "É. É uma coisa que não fabricam mais e é difícil de conseguir, mas ouvimos dizer que tem aqui."
11110-85 = "Sério? É uma situação parecida mesmo, então."
11110-86 = "Pessoal, temos um problema! Tem pessoas armadas vindo de todas as direções!"
11110-87 = "O quê?!"
11110-89 = "São elas!!"
11110-90 = "Como ousam fazer aquilo com a gente?! Vocês vão pagar caro!"
11110-93 = "Parecem ser comparsas dos delinquentes que derrotamos há pouco! Estão em modo totalmente hostil!"
11110-94 = "Pode vir."
11110-95 = "Poxa, por que só aparece gente assim pra encher o saco? A gente fez alguma coisa de errado?"
11110-96 = "Deixem as reclamações para depois... Vamos contra-atacar, pessoal!"
