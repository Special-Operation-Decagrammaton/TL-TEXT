[translation]
90001150-1 = "Эпизод 15;Снежная битва"
90001150-3 = ""
90001150-5 = ""
90001150-7 = "...Вот такова нынешняя ситуация."
90001150-8 = "Итак, ещё вопросы?"
90001150-10 = "Эм... Химари? Я спрашиваю только потому, что всё сказанное тобой звучит совсем уж невероятно... Но это ведь не какая-то хакерская шутка, которую я просто не поняла, да?"
90001150-11 = "Серьёзно, сестрёнка? Ну пожалуйста..."
90001150-13 = "Я ожидала, что хотя бы один человек отреагирует именно так..."
90001150-15 = "Однако именно такова нынешняя ситуация. Всё, как сказала Химари."
90001150-16 = "Наша текущая цель — отключить Многомерный барьер."
90001150-17 = "Да. Как и в прошлый раз, если помните."
90001150-22 = "[ns1] «Именно поэтому я попросил Алису и всех вас помочь.»\n[ns2] «Простите, девочки.»"
90001150-25 = "[ns3] «В этот раз я, возможно, не смогу обо всём позаботиться...»\n[ns4] «...но сделаю всё, что смогу.»"
90001150-26 = ""
90001150-27 = ""
90001150-29 = ""
90001150-30 = "С-Сенсей?! Если вы такое говорите, как нам вообще отвечать?!"
90001150-31 = "О-Она права! Когда вы склоняете голову, нам самим становится неловко!"
90001150-33 = "К-К тому же... Ну, на самом деле..."
90001150-35 = "...Да. Я понимаю. Как и в прошлый раз."
90001150-36 = ""
90001150-38 = ""
90001150-40 = ""
90001150-41 = ""
90001150-43 = ""
90001150-44 = "Я справлюсь, Сенсей. Ради вас я могу сделать что угодно."
90001150-45 = "Но..."
90001150-46 = "[s] «Но...?»"
90001150-47 = ""
90001150-49 = ""
90001150-50 = ""
90001150-51 = "Нет. Ничего. Всё будет хорошо. В этом мире есть магия и чудеса. Поэтому я уверена, что всё обязательно получится."
90001150-52 = "Алиса...?"
90001150-53 = "Но одной меня недостаточно."
90001150-54 = ""
90001150-57 = ""
90001150-58 = "Что тебе нужно? Что бы это ни было, мы достанем это для тебя тем или иным способом."
90001150-59 = "Это правда, что тогда я смогла поднять Меч Света... «Благословенный» Меч Света."
90001150-60 = "Однако одной моей силы недостаточно, чтобы его поднять. Тогда было так же."
90001150-61 = "Чтобы я снова могла экипировать Благословенный Меч Света..."
90001150-62 = ""
90001150-64 = ""
90001150-66 = "...мне нужна Кей."
90001150-68 = "Кей...?"
90001150-69 = ""
90001150-71 = ""
90001150-72 = ""
90001150-73 = "Ах!"
90001150-74 = "Алиса! Значит, тогда... Кей выполнила твою просьбу...?"
90001150-76 = "Да. Кей помогла мне. Поэтому я и смогла поднять Благословенный Меч Света. И..."
90001150-77 = "..."
90001150-78 = "Если честно, я не знаю, почему Кей пришлось уйти, а я осталась здесь."
90001150-79 = "Но и тогда, и сейчас мы не сможем пройти замок повелителя демонов без Кей."
90001150-80 = "[s] «Понятно...»"
90001150-81 = "...Если «Кей» является необходимой частью процесса, ничего не поделаешь."
90001150-82 = "Если бы у меня была хоть малейшая зацепка насчёт Кей, тогда, возможно..."
90001150-84 = "...Президент?"
90001150-85 = ""
90001150-87 = ""
90001150-88 = ""
90001150-89 = "Я знаю, Эйми. Знаю."
90001150-91 = "Это нормально? Можно ли... говорить об этом?"
90001150-93 = "...Токи, Эйми, это этическая проблема, над которой обязаны размышлять учёные."
90001150-94 = "Мы не можем отрицать то, существование чего уже доказано."
90001150-95 = "Но..."
90001150-96 = ""
90001150-99 = ""
90001150-100 = "Понятно. Если так считает президент Химари."
90001150-101 = ""
90001150-104 = ""
90001150-105 = "Рио. Я не знаю, правильно ли тебе это рассказывать, но у нас есть зацепка насчёт Кей."
90001150-106 = ""
90001150-109 = ""
90001150-110 = "Что?!"
90001150-111 = "В тот день, когда мы заряжали Ковчег Атрахасиса на Корабле Утнапиштима..."
90001150-117 = ""
90001150-118 = "Значит, Кей пересадили в брелок-куклу Алисы?!"
90001150-120 = "..."
90001150-121 = "Успокойся, Рио. Это было всего 2 КБ данных."
90001150-122 = "И извлечь из них ничего нельзя. Мы сделали это лишь затем, чтобы придать надежде Алисы физическую форму."
90001150-123 = "Ты уверена, что эти данные сформировались естественным образом?"
90001150-124 = ""
90001150-126 = ""
90001150-128 = ""
90001150-129 = "Рио?"
90001150-131 = "Д-Да. Почему ты вдруг об этом спрашиваешь?"
90001150-132 = "..."
90001150-133 = "Это немного, но, возможно, у меня кое-что есть."
90001150-134 = "?!"
90001150-136 = "Есть? Правда? Что именно?!"
90001150-137 = "[s] «Пожалуйста, расскажи подробнее.»"
90001150-140 = "Если я права, сейчас нам нужны данные..."
90001150-141 = "...из того файла размером 2 КБ, который вы перенесли в брелок."
90001150-142 = "Но мы уже пытались анализировать его на уровне битов, и там не было никаких данных...?"
90001150-143 = "Это был бы закономерный результат, если вы использовали «обычные» технологии Кивотоса."
90001150-144 = "Для подобных данных существует другой подход?"
90001150-145 = "Это..."
90001150-147 = "Ты можешь спасти Кей, Рио?!"
90001150-148 = ""
90001150-151 = ""
90001150-152 = "Алиса, пожалуйста, подожди. У нас всё ещё недостаточно контекста и информации—"
90001150-153 = "Пожалуйста, ответь мне! Ты можешь спасти Кей, Рио?"
90001150-154 = ""
90001150-156 = ""
90001150-158 = ""
90001150-159 = "...Прости. Я немного забежала вперёд. Если говорить о вероятности, то примерно пятьдесят на пятьдесят..."
90001150-160 = "Нет. Если быть точной, она значительно ниже."
90001150-161 = "И, что ещё важнее, если я потерплю неудачу, те данные, что у вас есть, могут исчезнуть полностью."
90001150-163 = "!"
90001150-165 = "Алис..."
90001150-166 = "Алис..."
90001150-167 = "..."
90001150-169 = "...То есть, если что-то пойдёт не так, я могу навсегда потерять Кей...?"
90001150-170 = "..."
90001150-171 = "Жестоко говорить тебе такое, Алиса..."
90001150-172 = "...но окончательное решение за тобой."
90001150-173 = "Но для меня... Кей — это..."
90001150-174 = ""
90001150-176 = ""
90001150-178 = ""
90001150-179 = "Я наклонился, чтобы оказаться на одном уровне с глазами Алисы."
90001150-180 = "[ns] «Алиса, чего ты хочешь?»"
90001150-181 = ""
90001150-183 = ""
90001150-184 = "Что...? Что вы имеете в виду?"
90001150-185 = "Но ведь речь о Кей... и если решать буду я..."
90001150-186 = "[s] «Да. Ты права. Никто не должен иметь право решать за Кей.»"
90001150-188 = "[ns5] «И всё же, думаю, именно ты имеешь право принять это решение, Алиса...»\n[ns6] «...больше, чем кто-либо другой в этом мире.»"
90001150-191 = "...!"
90001150-192 = "Я..."
90001150-193 = "...Я... хочу..."
90001150-194 = ""
90001150-196 = ""
90001150-197 = ""
90001150-198 = ""
90001150-200 = "...снова увидеть Кей."
90001150-203 = "Хотя бы ещё один раз я хочу увидеть Кей."
90001150-204 = "Я правда не уверена. Я всего лишь студент, и в этом мире ещё так многого не знаю."
90001150-205 = "Я пыталась поставить себя на место Кей и понять, что она почувствовала бы... но всё равно не знаю."
90001150-206 = "Кей могла бы сказать, чтобы я отпустила её."
90001150-213 = "В тот день именно я осталась, а Кей ушла. Я уверена... это было не случайно."
90001150-214 = "Поэтому всё, что я скажу дальше, — лишь мои личные желания."
90001150-215 = ""
90001150-217 = ""
90001150-218 = "Я хочу снова поговорить с Кей."
90001150-219 = "Я хочу получить шанс стать союзницей Кей. Хочу стать её подругой."
90001150-220 = "Если есть хотя бы крошечный шанс вернуть Кей, я возьму на себя всю ответственность."
90001150-221 = "Если что-то пойдёт не так и я действительно потеряю Кей, я не стану винить Рио."
90001150-222 = "Правда, правда... из меня никудышный герой."
90001150-223 = "Ради исполнения собственного желания я могу отправить Кей туда, откуда уже никогда не смогу её увидеть. Именно об этом я прошу Рио."
90001150-224 = "Прости меня, Рио. Мне очень жаль..."
90001150-226 = "Н-Нет. Я..."
90001150-228 = "Сенсей, перед вами я тоже хочу извиниться. Я жадный человек..."
90001150-229 = "[s] «...»"
90001150-230 = "И я хочу извиниться... перед всеми остальными. Поэтому..."
90001150-231 = "...Поэтому..."
90001150-232 = ""
90001150-234 = ""
90001150-235 = ""
90001150-236 = "..."
90001150-238 = "Я доверяю Кей тебе."
90001150-239 = "...!"
90001150-240 = "...Мы понимаем. В конце концов, это просьба нашей очаровательной Алисы. Как мы можем отказать?"
90001150-241 = "Рио? Сейчас не время мешкать. Приступим. Пока тебе помогает я — хрупкая, но прекрасная сверхгениальная хакерша Миллениум, у которой вдобавок есть степень по Всезнанию, — я не потерплю провала."
90001150-243 = "Я-Я должна ещё раз напомнить: вероятность успеха меньше половины..."
90001150-244 = ""
90001150-247 = ""
90001150-248 = "Мы добьёмся успеха. Понятно?"
90001150-249 = ""
90001150-251 = ""
90001150-252 = "...Поняла. Сейчас не время думать о вероятностях."
90001150-254 = "Э-Эм. Сенсей? Химари? Рио...? Можно мне... пойти с вами?"
90001150-255 = ""
90001150-258 = ""
90001150-259 = "Алиса?"
90001150-260 = "С чего вдруг?"
90001150-261 = "Я... не рекомендовала бы этого, Алиса. Это будет довольно... опасный процесс. К тому же..."
90001150-262 = "Если мы всё-таки потерпим неудачу, ты своими глазами увидишь..."
90001150-264 = "Но, но... я..."
90001150-265 = ""
90001150-267 = ""
90001150-268 = ""
90001150-269 = "Химари бросила на меня острый взгляд."
90001150-270 = "Я пытался понять, что он означает, когда до меня наконец дошло..."
90001150-271 = ""
90001150-273 = ""
90001150-275 = ""
90001150-276 = "[ns] «Итак, Алиса. И Отдел разработки игр.»"
90001150-277 = ""
90001150-278 = "Д-Да...?"
90001150-279 = "Что вам нужно, Сенсей?"
90001150-280 = ""
90001150-282 = ""
90001150-283 = "[ns] «Хотите выйти и устроить снежную битву?»"
90001150-285 = "С... снежную битву? П-Прямо сейчас?"
90001150-286 = ""
90001150-288 = ""
90001150-290 = ""
90001150-291 = "...!"
90001150-292 = "Мне нравится, Сенсей! Отличная идея! Мы ПРЯМО СЕЙЧАС идём наружу!"
90001150-293 = ""
90001150-296 = ""
90001150-297 = "С-Сестрёнка?! Что ты вдруг делаешь?"
90001150-298 = "Момои? Момои? Но я, я..."
90001150-299 = ""
90001150-301 = ""
90001150-302 = ""
90001150-304 = "У-Угх... Серьёзно, Момои..."
90001150-305 = "Спасибо, Сенсей."
90001150-306 = "[s] «Оставь их мне.»"
90001150-308 = "Смотрите не простудитесь. Однако, если у вас всё же поднимется температура, я останусь у вашей постели днём и ночью."
90001150-309 = "Теперь, когда я об этом подумала, мне даже хочется, чтобы такая ситуация произошла."
90001150-310 = "Токи... Ты хочешь, чтобы Сенсей был здоров или нет?"
90001150-311 = "Я и сама не уверена."
90001150-312 = "Ладно, ладно..."
90001150-318 = "[ns] «О! Вы уже начали!»"
90001150-319 = ""
90001150-321 = ""
90001150-322 = ""
90001150-326 = "Ахахаха! Ещё один! Получай, Мидори!"
90001150-327 = "Ай, холодно! А! Холо-о-одно! Сестрёнка, серьёзно! Не думай, что я просто буду стоять и терпеть!"
90001150-330 = "Момои? Мидори? И даже Сенсей...?"
90001150-331 = "Почему все вдруг...? Но я..."
90001150-332 = "[s] «О чём думаешь, Алиса?»"
90001150-333 = ""
90001150-335 = ""
90001150-336 = "Я... не знаю. Это весело, но Кей..."
90001150-337 = "...Кей..."
90001150-338 = "[s] «Ты права. Именно поэтому нам и нужно это делать.»"
90001150-339 = ""
90001150-341 = ""
90001150-342 = "Хм? Что это значит, Сенсей?"
90001150-343 = "[s] «Разве ты не хочешь показать Кей такие классные вещи?»"
90001150-344 = "Что? Такое... Кей...?"
90001150-345 = ""
90001150-347 = ""
90001150-349 = ""
90001150-350 = ""
90001150-352 = ""
90001150-353 = ""
90001150-354 = ""
90001150-355 = "...Хочу. Это очень здорово."
90001150-356 = ""
90001150-358 = ""
90001150-359 = "Я никогда не видела столько снега в одном месте. И смотрите, пингвин! Вживую я их ещё не видела."
90001150-360 = "Момои сказала, что в полярном регионе человек мгновенно замерзает, едва ступив туда, но оказалось, что это не так."
90001150-361 = "Здесь очень холодно... но и это место ощущается частью нашего мира."
90001150-362 = "[s7] «Верно. И ты расскажешь ей, насколько здесь удивительно.»\n[s8] «Но сначала ведь нужно самой как следует повеселиться и насладиться этим, правда?»"
90001150-365 = "[ns] «В конце концов, Кей обязательно вернётся.»"
90001150-366 = ""
90001150-368 = ""
90001150-369 = "Кей обязательно..."
90001150-370 = ""
90001150-372 = ""
90001150-373 = "..."
90001150-374 = "Сенсей, вы правы! Я не думала об этом с такой стороны!"
90001150-375 = "Я понимаю, что вы хотите сказать! Чтобы рассказать ей, насколько удивителен этот мир..."
90001150-376 = "...я сначала сама должна узнать о нём больше! А для этого—"
90001150-377 = ""
90001150-379 = ""
90001150-380 = ""
90001150-384 = ""
90001150-385 = "Кья-а-а?!"
90001150-387 = "А-Ах!! Снежок Мидори попал в Алису!.."
90001150-388 = ""
90001150-390 = ""
90001150-392 = ""
90001150-393 = "Понятно! Ты притворилась, что атакуешь Момои, чтобы отвлечь меня, а потом ударила меня!"
90001150-394 = ""
90001150-399 = "Но я не проиграю! Получай!"
90001150-400 = ""
90001150-406 = ""
90001150-407 = "Гья-а-а?!"
90001150-408 = "Ахаха! Мидори! Это было так смешно— А-а-а?!"
90001150-409 = ""
90001150-412 = ""
90001150-416 = ""
90001150-417 = "Алиса попала прямо в Момои!"
90001150-418 = "Ладно, Алиса! Вот это настрой! Ну давай!"
90001150-420 = "Я готова! Я не стану вас щадить, Момои, Мидори!"
90001150-421 = ""
90001150-425 = ""
90001150-427 = ""
90001150-432 = ""
90001150-434 = ""
90001150-437 = ""
90001150-438 = "Надо... подкрасться сзади и целиться в спину...!"
90001150-439 = ""
90001150-441 = ""
90001150-442 = ""
90001150-444 = "[ns] «Тогда... Я тоже!»"
90001150-445 = ""
90001150-450 = "А-а-а?!"
90001150-451 = "Кья-а-а?!"
90001150-452 = "А-а-аугх?!"
90001150-453 = ""
90001150-455 = ""
90001150-456 = "И-Иик?! Сенсей, и вы тоже...?"
90001150-457 = "[ns9] «Хахахаха! Вы все потеряли бдительность!»\n[ns10] «В этой хладнокровной и беспощадной снежной битве нельзя доверять никому...!»\n[ns11] «Потерять бдительность — значит расстаться с жизнью!»"
90001150-458 = ""
90001150-459 = ""
90001150-460 = ""
90001150-462 = ""
90001150-464 = ""
90001150-465 = "Ах вот как, Сенсей! Я, Сайба Момои, не стану просто стоять и принимать поражение!"
90001150-466 = "Фуфуфу. Ваши слова справедливы, Сенсей. Но это значит, что и вы готовы, верно?"
90001150-467 = "Я знаю это! Это «bellum omnium contra omnes» — война всех против всех!"
90001150-468 = ""
90001150-471 = ""
90001150-472 = ""
90001150-474 = "Точно... Во время снежной битвы я не могу доверять даже Сенсею...!"
90001150-475 = ""
90001150-479 = ""
90001150-481 = ""
90001150-483 = "[ns] «А-а, как такое могло случиться?! Но так просто меня не победить!»"
90001150-484 = "Ура! Ахахаха!"
90001150-485 = "Попробуйте поймать меня, Сенсей!"
90001150-487 = "Я слышала, что в серии ударов каждый отдельный удар должен быть нанесён со всей серьёзностью!"
90001150-488 = ""
90001150-490 = ""
90001150-492 = ""
90001150-493 = "Т-Тогда я тоже стану серьёзной...!"
90001150-499 = "Мы долго бросались друг в друга снежками, смеялись и кричали, бегая по заснеженному полю."
90001150-500 = ""
90001150-503 = "В тот момент... нам было нужно что-то подобное."
90001150-506 = ""
90001150-507 = "Я немного наблюдал, как они радостно наслаждаются непривычными снегом и льдом."
90001150-509 = "Когда их внимание отвлеклось, я тихо проскользнул обратно на базу."
90001150-514 = ""
90001150-515 = "Добро пожаловать, Сенсей. Сначала вам следует отряхнуться. Позвольте мне помочь."
90001150-516 = "Вы как раз вовремя, Сенсей. Мы, эм... только что закончили готовить все пригодные устройства хранения данных на этой базе."
90001150-517 = "Я не до конца понимаю детали, но Рио сказала, что нам нужно как можно больше областей для данных."
90001150-518 = "Поскольку для этого требовались рабочие руки, мы с Эйми помогали."
90001150-519 = "[s] «То есть...?»"
90001150-520 = "Да."
90001150-521 = "Мы станем свидетелями воскрешения Кей."
90001150-523 = "Следующая серия;Снежная битва"
