[translation]
80000061-1 = "Самый лучший момент"
80000061-6 = ""
80000061-7 = "Я вошёл в офис Префектурной команды Геенны и увидел Чинацу, ожидавшую меня за ближайшим столом."
80000061-8 = "Вот и вы, Сенсей. Спасибо, что пришли так поздно."
80000061-9 = "Здесь больше никого нет. Всё это время мне приходилось присматривать за офисом совсем одной."
80000061-10 = ""
80000061-11 = "Нет, погодите."
80000061-12 = "Я-Я понимаю, как это прозвучало, но обещаю: я не приглашала вас сюда с каким-то скрытым умыслом."
80000061-13 = "Нет. Если подумать, это не совсем честно."
80000061-14 = "Я пригласила вас вот из-за этого."
80000061-15 = ""
80000061-17 = ""
80000061-20 = "[ns1] «Это шоколад?»\n[ns2] «Какое странное печенье с предсказанием.»"
80000061-21 = "Не просто шоколад — шоколад с предсказанием."
80000061-22 = "Потому что это не печенье. Это шоколад с предсказанием."
80000061-23 = "Хм?"
80000061-24 = "Хотите знать, почему я выбрала именно этот шоколад? Ну..."
80000061-25 = "...сегодня всё-таки особый день. И... это трудно выразить словами."
80000061-26 = "Я хотела как-то показать свою благодарность..."
80000061-27 = "...но поскольку сегодня День святого Валентина, мне не хотелось переусердствовать и дать повод истолковать мои слова как нечто большее."
80000061-28 = "Н-Не то чтобы я обязательно была против такого толкования. Иначе я бы не стала так стараться. Просто..."
80000061-29 = "..."
80000061-30 = "Н-Неважно. Забудьте, что я сказала. Пожалуйста, просто примите это."
80000061-31 = "[s3] «Спасибо.»\n[s4] Вытащить предсказание из шоколада."
80000061-33 = ""
80000061-37 = ""
80000061-40 = "Что там написано? Мне тоже интересно."
80000061-41 = ""
80000061-43 = ""
80000061-44 = "Хм. Посмотрим."
80000061-45 = "«Время быть счастливым — сейчас. Место для счастья — здесь.»"
80000061-46 = "По-моему, всё верно. Нет места лучше, чем здесь,#nи времени лучше, чем сейчас."
80000061-47 = "Может быть, то, что сегодня вы выбрали именно этот, было предначертано."
80000061-48 = "[s5] «А что насчёт остальных?»\n[s6] «Можно взглянуть на оставшиеся?»"
80000061-49 = "А?! Остальные? Э-Эм... Дело в том..."
80000061-50 = "А?! Остальные? Э-Эм... Дело в том..."
80000061-51 = "П-Постойте, Сенсей! Это, эм... плохая примета! Нельзя читать другие предсказания!"
80000061-52 = ""
80000061-55 = "[ns7] «Время быть счастливым — сейчас. Место для счастья — здесь».\n[ns8] «Постой. Они все одинаковые...»"
80000061-56 = "Н-Ну, это потому что... Эм..."
80000061-57 = "Н-Ну, это потому что... Эм..."
80000061-58 = ""
80000061-62 = "Я же сказала не читать остальные!"
80000061-63 = "Почему они все одинаковые? Ну..."
80000061-64 = "[s9] «Они все одинаковые... потому что...?»\n[s10] «Чинацу, ты могла просто сама это сказать.»"
80000061-65 = "..."
80000061-66 = "..."
80000061-67 = ""
80000061-69 = ""
80000061-70 = "Мне пора!"
80000061-71 = ""
80000061-73 = ""
80000061-75 = "[ns] «Ты куда?!»"
80000061-77 = "В конце концов я догнал Чинацу и убедил её, что всё в порядке."
