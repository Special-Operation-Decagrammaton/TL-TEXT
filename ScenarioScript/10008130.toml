[translation]
10008130-1 = "Эпизод 13;Новогодние желания"
10008130-2 = "После переполоха в первый день Нового года всё наконец начало успокаиваться."
10008130-6 = "Главная новость дня! Скандал на мероприятии Дайкичидэна!"
10008130-7 = "И шокирующая правда об участии банды Курокамэ!"
10008130-8 = "Чтобы узнать правду, со мной одна из участниц дисциплинарного комитета Геенны, которая всю ночь работала над разрешением новогоднего хаоса!"
10008130-9 = ""
10008130-11 = ""
10008130-12 = "Можете подробно рассказать, что вам известно об этом происшествии?"
10008130-13 = "А? Ты пытаешься взять у меня интервью?"
10008130-14 = "Я просто хочу домой и поспать..."
10008130-16 = "Вскоре преступная деятельность банды Курокамэ была раскрыта Школой журналистики «Кронос»."
10008130-17 = "Благодаря дисциплинарному комитету босс банды Курокамэ и большая часть её сил были схвачены. Вернуться к прежним делам им будет непросто."
10008130-18 = "В целом всё почти вернулось к норме."
10008130-21 = ""
10008130-22 = "Нет! Всё не может закончиться так!"
10008130-23 = "Вот именно! Мы что, должны просто забыть про мошенничество с ящиком и жить дальше?!"
10008130-24 = "Я собиралась на эти деньги купить новый шлем! Я что, слишком многого хотела?!"
10008130-25 = ""
10008130-27 = ""
10008130-28 = "Да вы издеваетесь. Я не на это подписывалась!"
10008130-29 = "[s] «Прости. Я помогу.»"
10008130-30 = ""
10008130-32 = ""
10008130-33 = "Ладно! Так тому и быть!"
