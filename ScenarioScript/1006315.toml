[translation]
1006315-1 = "Право на обман"
1006315-2 = "После сообщения Коюки я направился в Комнату самоанализа."
1006315-3 = ""
1006315-8 = "И когда открыл дверь..."
1006315-9 = "Я увидел большую стеклянную сферу, лежащую в центре стола."
1006315-10 = "Внутри неё был заключён четырёхлистный клевер."
1006315-11 = "[ns] «Э-это...»"
1006315-12 = ""
1006315-13 = ""
1006315-14 = "Увидели, Сенсей?"
1006315-15 = "Ну как вам? Тот клевер, который вы нашли, теперь сохранён в стекле!"
1006315-16 = "Теперь можно не переживать, что он высохнет или рассыплется."
1006315-17 = "...И потерять его теперь намного сложнее!"
1006315-18 = "Я даже смогу передать его потомкам как семейную реликвию! Ниха-ха-ха!"
1006315-19 = "[ns] «Трогательно...!»"
1006315-21 = "[ns] «Кстати, ты ведь говорила, что что-то потеряла?»"
1006315-22 = "Именно!"
1006315-23 = "Я подумала: раз вы так талантливо заметили четырёхлистный клевер..."
1006315-24 = "То наверняка сможете найти и мою пропавшую монету, Сенсей!"
1006315-25 = "[s1] «Монету?»\n[s2] «...Если всё настолько плохо, могу одолжить денег...»"
1006315-28 = "Нет! Это не обычная монета!"
1006315-29 = "Она очень особенная, с крошечной дырочкой посередине."
1006315-30 = "[s] «Ты имеешь в виду... вот это?»"
1006315-31 = "...Что?"
1006315-32 = ""
1006315-36 = "Показать ей монету."
1006315-37 = ""
1006315-39 = ""
1006315-40 = ""
1006315-42 = "А?! Почему она у вас, Сенсей?!"
1006315-43 = "Вы украли её в отместку за тот случай, когда я нашла ваши тонкие книжки?"
1006315-44 = "[s] «Что? Я подобрал её по дороге сюда.»"
1006315-45 = "Э-э! Отличная история! Я уже слышала ТАКУЮ отмазку!"
1006315-46 = "Стойте? Вы правда нашли её в коридоре у Комнаты самоанализа?"
1006315-47 = "Эм... Эм... Правда?"
1006315-48 = "Простите..."
1006315-49 = "Наверное, я выронила её по дороге на занятия."
1006315-50 = ""
1006315-52 = ""
1006315-53 = ""
1006315-54 = ""
1006315-56 = "Я передал Коюки монету с дыркой."
1006315-57 = "Ниха-ха! Значит, позвать вас всё-таки было хорошей идеей!"
1006315-58 = "Спасибо, Сенсей!"
1006315-59 = "Фу-фу. Ах ты негодница. Вернулась домой. Ниха-ха..."
1006315-60 = "[s3] «Так что с этой монетой?»\n[s4] «Это что-то вроде... монеты с браком?»"
1006315-63 = "Монета с браком? Что это?"
1006315-64 = "А, вы про деньги, которые неправильно отчеканили или напечатали?"
1006315-65 = "Нет! Я сама просверлила отверстие! Особая ручная работа Коюки!"
1006315-66 = "[s] «Если присмотреться, это даже не настоящая монета.»"
1006315-67 = "Да! Это жетон из игрового автомата. Очень особенная монета."
1006315-68 = "[s5] «Но всё-таки... зачем ты просверлила в ней отверстие?»\n[s6] «Это как твоя любовь сверлить дырки в школьных партах?»"
1006315-71 = "Сверлить парты... Это весёлое занятие..."
1006315-72 = "Но понимаете. Фу. Фу. Фу. Это не какая-то детская забава."
1006315-73 = "Это... чит-монета, которую я сделала, когда была совсем маленькой."
1006315-74 = "[s] «Чит-монета?»"
1006315-75 = "Да! Просверливаешь в монете такую дырочку, привязываешь нитку..."
1006315-76 = "...а потом, удерживая нитку, вставляешь её в игровой автомат. И тогда..."
1006315-77 = "[s7] «Тянешь нитку обратно...»\n[s8] «...и возвращаешь монету?»"
1006315-80 = "Именно! Вы быстро схватываете."
1006315-81 = ""
1006315-84 = "[ns] «Это монета для жульничества, а не „чит-монета“...!»"
1006315-85 = "А? Что ты имеешь в виду, Сенсей?"
1006315-86 = "Это не «жульничество». Всё ради честности! Всё по-честному!"
1006315-87 = "Вы когда-нибудь играли в автомат с клешнёй, Сенсей? Кукла уже схвачена, поднята, всё ещё держится в клешне... А потом автомат просто отпускает её в последнюю секунду, будто так и надо!"
1006315-88 = "А когда играешь в «Teatime Hiking,» автомат выдаёт новый шаблон ровно тогда, когда ты уже вошёл в ритм!"
1006315-89 = "Видите? Игры лживые, жестокие и несправедливые!"
1006315-90 = "И именно поэтому... я имею право немного уравнять шансы."
1006315-91 = "[s] «Кажется, это называется „преступлением“, мисс Коюки.»"
1006315-92 = "Ц...!"
1006315-93 = "Я думала, Сенсей поймёт!"
1006315-94 = "Н-Но я всё равно не выброшу эту монету!"
1006315-95 = "Я всё равно больше не могу ей пользоваться! Один-два раза сработало, а потом все игровые автоматы перешли на карточную систему."
1006315-96 = "[s] «Тогда почему ты так её бережёшь?»"
1006315-97 = "А? Н-Ну..."
1006315-98 = ""
1006315-100 = ""
1006315-101 = "...Не уверена."
1006315-102 = "Почему же? Хм..."
1006315-103 = "Ну... наверное, просто не хотелось её выбрасывать?"
1006315-104 = "В любом случае! Раз уж вы здесь, давайте играть!"
1006315-105 = "Я только что достала новую настольную игру! И дополнение к ней!"
1006315-107 = "Мы вместе сыграли в новую игру в Комнате самоанализа."
1006315-108 = "А после того как я ушёл, я записал Коюки на курс этики от «Валькирии»."
