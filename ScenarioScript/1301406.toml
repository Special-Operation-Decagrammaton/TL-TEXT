[translation]
1301406-1 = "Купальники и юность"
1301406-6 = "К тому времени, как я пришёл на пляж, Рэнгэ уже ждала."
1301406-7 = ""
1301406-9 = ""
1301406-10 = ""
1301406-11 = "Наставник! Сюда."
1301406-12 = "Спасибо, что пришли."
1301406-13 = "Пока мы всё ещё на пляже, я хочу попробовать ещё одно занятие юности."
1301406-14 = "...Угадаете какое?"
1301406-15 = "[s1] «Держаться за руки и гулять по берегу?»\n[s2] «Вместе смотреть на море в лунном свете?»"
1301406-16 = ""
1301406-17 = ""
1301406-19 = ""
1301406-20 = "В-Вообще-то всё это звучит очень здорово!"
1301406-21 = "Но есть кое-что..."
1301406-22 = "...что я очень хочу сделать."
1301406-23 = ""
1301406-25 = ""
1301406-27 = ""
1301406-28 = "Фейерверки!"
1301406-34 = "― [log=렌게 수영복]Моя юность и правда пролетает быстро.[/log][wa:2470]"
1301406-37 = "― [log=렌게 수영복]Прямо как это пламя. Оно яростно горит,[/log][wa:340]"
1301406-39 = "― [log=렌게 수영복]а потом в один миг гаснет...[/log]"
1301406-42 = "― [log=렌게 수영복]Раньше мне казалось именно так.[/log][wa:2060]"
1301406-45 = "― [log=렌게 수영복]...Будто моя юность погаснет в бесконечных тренировках.[/log][wa:1060]"
1301406-48 = "― [log=렌게 수영복]Но теперь я больше так не думаю.[/log][wa:1370]"
1301406-50 = "― [log=렌게 수영복]После встречи с вами многое изменилось, Наставник.[/log][wa:10]"
1301406-53 = "― [log=렌게 수영복]Каждый день кажется весёлым и наполненным.[/log][wa:860]"
1301406-56 = "― [log=렌게 수영복]Я знаю, что не могу повернуть время вспять...[/log][wa:950]"
1301406-59 = "― [log=렌게 수영복]Но думаю,[/log][wa:10]"
1301406-61 = "― [log=렌게 수영복]я всё ещё могу наслаждаться оставшейся юностью.[/log]"
1301406-64 = "― [log=렌게 수영복]Мы всегда можем[/log][wa:1000]"
1301406-66 = "― [log=렌게 수영복]подбросить ещё дров в угасающее пламя. [/log][wa:290]"
1301406-69 = "― [log=렌게 수영복]Так что, Наставник...[/log][wa:3110]"
1301406-72 = "― [log=렌게 수영복]Вы будете и дальше заниматься со мной... делами юности?[/log][wa:2060]"
1301406-76 = "Ха-ха! В этот раз я не перестаралась!"
1301406-77 = "Костёр немного вышел из-под контроля."
1301406-78 = "Понимаете, я ошибалась, думая, что для настоящей юности всё обязательно должно быть как можно масштабнее."
1301406-79 = "Я поняла, что такие тихие моменты тоже приносят удовлетворение."
1301406-80 = "[s] «Ты принесла много бенгальских огней!»"
1301406-81 = "Да! Я хотела спокойно отдохнуть с вами, с чем-то небольшим, но красивым."
1301406-82 = "И это ещё и безопасно, раз мы на пляже."
1301406-83 = "[s3] «Сегодня здесь ещё и никого нет.»\n[s4] «Так что мы можем наслаждаться этой ночью вдвоём сколько захотим!»"
1301406-84 = ""
1301406-85 = ""
1301406-87 = ""
1301406-88 = "В-Вы правы. Проведёте эту юность вместе со мной?"
1301406-89 = ""
1301406-91 = ""
1301406-92 = ""
1301406-93 = ""
1301406-94 = ""
1301406-95 = ""
1301406-96 = "Вот... Давайте вместе зажжём бенгальский огонь."
1301406-100 = "После этого мы с Рэнгэ до поздней ночи наслаждались тихими маленькими фейерверками."
1301406-102 = "Это и правда ощущалось как сама сущность юности."
