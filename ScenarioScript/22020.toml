[translation]
22020-1 = "Эпизод 2; День в Департаменте Разработки Игр"
22020-2 = ""
22020-3 = "Попался редкий случай: в Шале не было работы, и у меня появилось свободное время."
22020-4 = "Я получил просьбу Департамента Разработки Игр принять участие в клубной деятельности."
22020-5 = "Правда, деталей самой деятельности мне не сообщили."
22020-6 = ""
22020-9 = "Департамент Разработки Игр Милленниума"
22020-15 = "Ха! Готовьтесь, Сенсей!"
22020-16 = "Это мой суперсекретный абсолютный приём!"
22020-17 = "Момои-сплэш!"
22020-18 = "Не успел я понять, что происходит, как уже играл с Момои в файтинг."
22020-19 = "[s] «Суперсекретный абсолютный приём Момои...!»"
22020-22 = ""
22020-28 = "Хи-хи-хи! В моём жестоком комбо нет слепых зон! Я не остановлюсь, пока ваше ХП не упадёт до нуля!"
22020-29 = "Хия-я-я-я!"
22020-30 = ""
22020-43 = "*бах* *шлёп*"
22020-44 = ""
22020-47 = "МОМОРИЯ ПРОИГРАЛА!"
22020-48 = ""
22020-51 = "[USERNAME] ПОБЕЖДАЕТ!"
22020-52 = ""
22020-56 = ""
22020-57 = "Вааа! Почему моё комбо не попало?!"
22020-58 = "[s1] «Когда спешишь, нажимаешь кнопки не думая.»\n[s2] «Твои жадные комбо-атаки на мне не сработают, Момои!»"
22020-61 = "Ч-Что?! Сенсей уже раскусил мои паттерны атак?!"
22020-62 = "Я думала, Сенсей полный новичок и вообще раньше не играл."
22020-63 = "Эй! Не надо тыкать меня в это, Мидори!"
22020-64 = "Это не считается!"
22020-65 = "Ещё раз! Давайте ещё матч, Сенсей! Клянусь, сейчас покажу секретное комбо..."
22020-66 = "[s] «Ты говорила это после каждого из последних восьми матчей, Момои...»"
22020-67 = "Что? Мы уже сыграли восемь?!"
22020-68 = "Да, хватит. Сенсей слишком добрый, чтобы тебе отказать."
22020-69 = "Н-Но я не могу закончить поражением. Это ранит мою гордость геймера..."
22020-70 = "Опять эта чушь..."
22020-71 = "А Сенсею, значит, можно закончить поражением? Всё вращается только вокруг тебя?"
22020-72 = "Что?! О... Я об этом не подумала."
22020-73 = "[s] «Всё нормально»."
22020-74 = "*вздох* Сенсей, не надо постоянно ей всё позволять."
22020-75 = "У тебя в голове только игра..."
22020-76 = "Надеюсь, ты не забыла настоящую цель сегодняшней клубной деятельности."
22020-78 = "*ах* Точно...!"
22020-79 = "...Точно?"
22020-80 = "О нет! Мидори! Конечно, я помню! Правда!"
22020-81 = "[s] «Если подумать, я до сих пор не знаю, зачем меня позвали...»"
22020-82 = "Не говори, что привела Сенсея сюда, вообще ничего не объяснив."
22020-83 = "Эй!"
22020-84 = "Я-Я как раз собиралась сейчас всё объяснить! Угу!"
22020-85 = "Цель сегодняшней клубной деятельности..."
22020-86 = ""
22020-88 = ""
22020-89 = "Начать мозговой штурм идей для нашей следующей видеоигры!"
22020-90 = "[s] «Следующей видеоигры?»"
22020-91 = "Да, мы в Департаменте Разработки Игр решили, что пора взяться за новое начинание."
22020-92 = "Точно! Когда мы услышали, что у вас вдруг появилось свободное время — почти никогда такого не бывает — мы обязаны были позвать вас!"
22020-93 = "[s3] «...Простите, что не могу приходить чаще.»\n[s4] «В последнее время у меня и правда стало меньше дел.»"
22020-96 = "Ну, мы все знаем, насколько вы заняты... Спасибо, что пришли!"
22020-97 = "В общем, мы хотим услышать ваше мнение о следующем проекте!"
22020-98 = "Вдруг у вас найдутся невероятные свежие идеи!"
22020-99 = "Мы все так подумали... поэтому и попросили вас прийти!"
22020-100 = "[s] «Ого... Это большая ответственность...»"
22020-102 = "[ns] «Но погодите, почему тогда мы всё это время играли в файтинг?»"
22020-103 = "О, это была её идея."
22020-104 = "Это исследование рынка, ясно?! Исследование!"
22020-105 = "Если просто сидеть и мучительно придумывать идеи, хороший результат никто не гарантирует!"
22020-106 = "Поэтому мы решили поиграть в популярные игры и проанализировать их, чтобы разогнать мозги."
22020-107 = "[s] «Вообще-то логично.»"
22020-108 = "Хи-хи-хи! Правда?! Особенно игра, в которую мы только что играли..."
22020-109 = "The Fist of Cassiopeia - Upalupa Great Battle — один из самых популярных и спорных тайтлов в мире файтингов!"
22020-110 = "У этой игры многому можно научиться. Надо как следует её разобрать и проанализировать!"
22020-111 = "Уверена, так мы придумаем отличные идеи для следующего проекта!"
22020-112 = "То есть наш следующий проект — терапевтическая стратегическая RPG про подземелья, где берёшь задания, рыбачишь, занимаешься фермой и развиваешь персонажей."
22020-113 = "[s] «Что?! Причём тут вообще файтинги?!»"
22020-114 = "Что за вопрос, Сенсей?!"
22020-115 = "Я знаю, связь между стратегической RPG про подземелья и файтингами не сразу очевидна, но..."
22020-116 = "[s] «Но...?»"
22020-117 = "Хи-хи-хи! Нельзя судить книгу по обложке!"
22020-118 = "Чтобы выиграть следующую Премию Миллениума, нужно рисковать так, как никто раньше даже не представлял!!"
22020-119 = "Короче, забудьте стереотипы, преодолейте предубеждения и тянитесь к новым горизонтам!"
22020-120 = "Мы подумали, что сочетание элементов двух, казалось бы, несвязанных жанров может дать свежую и интересную игру."
22020-121 = "Мидори! Я как раз собиралась это сказать!"
22020-122 = "Ты слишком долго объясняла, поэтому я сделала это за тебя."
22020-123 = "Вааа! Какая ты злая!"
22020-124 = "[s] «Ну, приятно видеть, что все так стараются ради клуба.»"
22020-125 = "Правда?!"
22020-126 = "Ах..."
22020-127 = "Хи-хи!"
22020-128 = "Ну конечно!"
22020-129 = "Да, мы с Момои, Юзу и Алисой..."
22020-130 = "Пообещали в следующий раз полностью разнести Премию Миллениума."
22020-131 = "Да. Это наш текущий квест."
22020-132 = ""
22020-136 = ""
22020-137 = "Момои! Мидори! Сенсей! Чрезвычайная ситуация!"
22020-138 = "[s] «Привет, Алиса. Что случилось?»"
22020-139 = "Хм? Что вдруг произошло, Алис?"
22020-140 = "Юзу наконец начала испытание на десять побед подряд в онлайне!"
22020-141 = "Правда?! Не может быть!"
22020-142 = "Что? Десять побед подряд?"
22020-143 = ""
22020-146 = ""
22020-147 = ""
