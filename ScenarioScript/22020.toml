22020-406 = "О...! Даже С-Сенсей меня похвалил... Тут нет ничего особенного..."
22020-407 = "Очень даже есть! Когда ты победила, это было так приятно!"
22020-408 = "Этот опыт отлично помог начать мозговой штурм."
