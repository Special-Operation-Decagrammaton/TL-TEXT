[translation]
22020-1 = "Episódio 2;O Cotidiano Comum do Clube de Desenvolvimento de Jogos"
22020-3 = "(Em um raro dia sem trabalho na Schale, quando finalmente tive um tempo livre)"
22020-4 = "(Recebi uma mensagem do Clube de Desenvolvimento de Jogos pedindo para eu acompanhar as atividades do clube)"
22020-5 = "(Mesmo falando de atividades do clube, acabei não sabendo ao certo o que exatamente faríamos...)"
22020-9 = "Millennium - Clube de Desenvolvimento de Jogos"
22020-15 = "Toma essaaa!#nPrepare-se, Sensei!"
22020-16 = "Agora vou mostrar meu golpe especial secreto...!"
22020-17 = "Contemple o Momoi Splash!!"
22020-18 = "(Quando dei por mim, estava jogando um jogo de luta com a Momoi na sala do clube)"
22020-19 = "[s] \"Golpe especial secreto...!!\""
22020-28 = "Hehehe! Meu combo não tem pontos cegos!#nNão vou parar! Até o seu HP! Chegar a zero, Sensei!"
22020-29 = "Iaaaah!"
22020-43 = "(Pow! Paf!)"
22020-47 = "\"Player MOMORIA LOSE!\""
22020-51 = "\"WINNER! Player [USERNAME]!\""
22020-57 = "Buááá! Por que o meu combo não acertou?!"
22020-58 = "[s1] \"É que você sai esmagando os botões quando fica nervosa, Momoi...\"\n[s2] \"Esse combo moleza não funciona comigo, Momoi!\""
22020-61 = "Não pode ser?!#nJá leu o meu padrão de ataques?!"
22020-62 = "Aliás, mana... o Sensei não disse que é iniciante e começou a jogar só hoje?"
22020-63 = "Aaaah, Midori!!? Não joga essa realidade cruel na minha cara!"
22020-64 = "Essa não valeu! Não valeu!"
22020-65 = "Mais uma! Vamos mais uma, Sensei!#nDessa vez vou mandar o meu verdadeiro combo secreto..."
22020-66 = "[s] \"Essa já é a oitava vez que você diz isso...\""
22020-67 = "Quê?! Já foram tantas assim?!"
22020-68 = "Pois é, mana. Vamos parar por aqui, tá?#nVocê tá deixando o Sensei sem jeito."
22020-69 = "M-mas terminar perdendo fere o meu o-orgulho de gamer..."
22020-70 = "Lá vem você de novo com essa história..."
22020-71 = "Então tudo bem se for o Sensei quem terminar perdendo?"
22020-72 = "Unyah?!#nIsso... é, é verdade... né?"
22020-73 = "[s] \"Por mim tudo bem, não me importo.\""
22020-74 = "Ah... Sensei, não pode ficar mimando demais a minha irmã assim, sabia?"
22020-75 = "Aliás, ficando só jogando desse jeito...#nMana..."
22020-76 = "Você lembra qual era o objetivo da atividade do clube hoje?"
22020-78 = "Ah, verdade...!"
22020-79 = "...Verdade?"
22020-80 = "N-não! Não é isso, Midori!#nEu lembro direitinho, tá?! Né?!"
22020-81 = "[s] \"Pensando bem, eu ainda nem ouvi do que se trata.\""
22020-82 = "Quê, mana... você não explicou nada pro Sensei...?"
22020-83 = "Maaaanaaa?"
22020-84 = "A-agora!#nEu vou falar agora mesmo!"
22020-85 = "Hoje,"
22020-89 = "eu pensei em fazermos um brainstorming pro nosso próximo jogo!"
22020-90 = "[s] \"Próximo jogo...?\""
22020-91 = "Sim. Nós conversamos que já estava na hora de começarmos a preparar o próximo projeto."
22020-92 = "Isso mesmo! E como ouvimos dizer que o Sensei, que nunca dá pra encontrar, estava com um tempo livre,#nachamos que era a chance perfeita e chamamos você!"
22020-93 = "[s3] \"...Desculpa não ter aparecido muito ultimamente.\"\n[s4] \"Realmente, eu tinha acabado de ficar livre.\""
22020-96 = "Bom, a gente sabe que o Sensei é ocupado...#nObrigada por ter vindo!"
22020-97 = "Enfim! Já que o Sensei veio até aqui,#npensei que podíamos ouvir a sua opinião sobre o próximo jogo."
22020-98 = "Além disso, sendo o Sensei, achei que você poderia dar um monte de ideias incríveis..."
22020-99 = "Foi por isso que chamamos você pra sala do clube!"
22020-100 = "[s] \"A-aham... Essa expectativa toda tá meio pesada...\""
22020-102 = "[ns] \"Mas parece que a gente só tá jogando jogo de luta até agora...?\""
22020-103 = "Ah, isso foi ideia da mana."
22020-104 = "Isso, eu pensei em analisarmos os jogos!"
22020-105 = "Ficar quebrando a cabeça sem nada na mente não vai fazer surgir nenhuma ideia boa, né?"
22020-106 = "Por isso, decidimos jogar vários títulos populares e tirar ideias a partir deles.#nFoi esse o plano."
22020-107 = "[s] \"Entendi, faz sentido.\""
22020-108 = "Hehehe! Viu só?#nPrincipalmente esse jogo que eu estava jogando com o Sensei agora há pouco."
22020-109 = "\"Punho de Cassiopeia ~A Grande Saga do Axolote~\" é um jogo popular#nconhecido por ser um verdadeiro ponto fora da curva no mundo dos jogos de luta!"
22020-110 = "Ele tem muitos pontos que servem de referência, então se a gente analisar direitinho..."
22020-111 = "Com certeza vai surgir uma ideia maravilhosa pro nosso próximo jogo! Eu acho!"
22020-112 = "O nosso próximo jogo é um \"RPG de exploração de masmorras estilo vida tranquila e relaxante\"."
22020-113 = "[s] \"E mesmo assim vai ter elementos de jogo de luta?!\""
22020-114 = "O que você tá dizendo, Sensei?!"
22020-115 = "Tá, pro pessoal comum, pode parecer que um RPG de exploração de masmorras e um jogo de luta não têm nada a ver, mas..."
22020-116 = "[s] \"Pode parecer que não têm nada a ver, mas...?\""
22020-117 = "Hehehe! Julgar pela aparência é proibido!"
22020-118 = "Se queremos mirar no próximo Prêmio Millennium, precisamos de um desafio inédito que ninguém consiga prever!"
22020-119 = "Ou seja! Só abandonando preconceitos e superando ideias fixas#né que se consegue alcançar novos horizontes...!"
22020-120 = "Combinar elementos de gêneros que parecem não ter nada a ver#npode acabar resultando em um jogo surpreendentemente divertido."
22020-121 = "Ei! Midori! Não rouba a minha fala!"
22020-122 = "É que a mana fica fazendo suspense e não fala logo."
22020-123 = "Buááá#nQue maldade!"
22020-124 = "[s] \"Vocês estão mesmo dando tudo de si no novo jogo, né.\""
22020-125 = "Hã?"
22020-126 = "Ah..."
22020-127 = "Hehehe!"
22020-128 = "Mas é claro!"
22020-129 = "Sim. Não só eu e a mana, mas a Yuzu e a Aris também.#nTodas nós juntas..."
22020-130 = "Prometemos que, desta vez, vamos conquistar o Prêmio Millennium."
22020-131 = "Sim.#nEssa é a \"missão\" que nos foi dada agora!"
22020-137 = "Momoi! Midori! Sensei!#nÉ uma emergência!"
22020-138 = "[s] \"Oi, Aris. O que aconteceu?\""
22020-139 = "Ué, o que foi, Aris?"
22020-140 = "A Yuzu finalmente passou de 10 vitórias seguidas no modo online!"
22020-141 = "Quê? Sério?!"
22020-142 = "10 vitórias seguidas nesse jogo totalmente desbalanceado?!"
22020-160 = "\"WINNER! Player UZQueen!\""
22020-165 = "Ufaaa..."
22020-166 = "Você arrasou, Yuzu!"
22020-167 = "A Yuzu é incrível mesmo."
22020-169 = "Aris está emocionada!#nComo esperado da lendária heroína \"UZQueen\"!"
22020-170 = "Ah, h-hã...?"
22020-171 = "[s] \"Parabéns, Yuzu! Foi uma vitória perfeita!\""
22020-172 = "Não foi?! Esse é o estilo perfeito da Yuzu, o \"Modo UZQueen\"!"
22020-173 = "[s] \"\"Modo UZQueen\"...?\""
22020-174 = "Deixa que eu explico! O \"Modo UZQueen\"#né uma habilidade de buff da Yuzu que ativa em certas condições!"
22020-175 = "Ela fica um pouco mais ousada que o normal, o raciocínio dela acelera em 1,5 vez#ne a visão dinâmica aumenta em 2,8 vezes!"
22020-176 = "Desde quando você inventou essa ficha técnica?"
22020-177 = "Aris também sabe! Quando fica assim, a Yuzu é super forte!#nAris também quer o \"Modo UZQueen\"!"
22020-178 = "[s] \"O \"Modo UZQueen\" é incrível mesmo...!\""
22020-179 = "A-até o Sensei?!"
22020-180 = "É-é que... auuu...!"
22020-181 = "E-eu só me esforcei normalmente, sabe..."
22020-182 = "Ver a Yuzu brilhando assim deixou Aris super empolgada!"
22020-183 = "Agora é a vez de Aris!"
22020-185 = "(E assim, sob o olhar de todos, começou o desafio de Aris no jogo de luta)"
22020-187 = "Assim como a Momoi, a Midori, a Yuzu — e o Sensei,#nAris também vai se tornar uma heroína dos jogos de luta!"
22020-188 = "Acho que a mana tá mais pro papel de quem é derrotada pelo herói, né."
22020-189 = "Maninha! Às vezes a verdade dói, sabia?!"
22020-190 = "A-Aris... b-boa sorte!"
22020-191 = "Sim! Aris vai dar o melhor de si!"
22020-192 = "(Challengers Next Battle!!)"
22020-194 = "[ns] \"Ah, parece que apareceu um desafiante.\""
22020-196 = "Vou mostrar as habilidades que treinei enfrentando a Momoi!"
22020-197 = "Iaaah!"
22020-201 = "Ei! Iah! Hah!"
22020-207 = "Ele desviou de tudo..."
22020-208 = "Não! O ataque de Aris ainda não acabou!"
22020-209 = "Lá vou eu!"
22020-219 = "Quê?!#nO que foi isso..."
22020-220 = "A Aris atacou agora, mas foi o HP dela que diminuiu?"
22020-221 = "A-ainda não!#nAris ainda conse..."
22020-227 = "[ns] \"Dessa vez o personagem... sumiu...?\""
22020-228 = "Q-quê?!"
22020-234 = "Ele apareceu... atrás de Aris?!"
22020-235 = "Ah, hyaa...!#nAuu! A-atacar!"
22020-241 = "O ataque de Aris atravessou o oponente!"
22020-243 = "Uau?! Agora o personagem ficou invisível?!"
22020-244 = "E ainda... ficou gigante e tá cobrindo a tela inteira."
22020-245 = "D-dessa vez... p-parece que a hitbox sumiu."
22020-254 = "B-buááá!#nNão consigo vencer esse jogador!"
22020-255 = "[s] \"Isso aí, por qualquer ângulo que se olhe...\""
22020-256 = "Qual é a desse cara?! Tá na cara que ele tá usando trapaça!"
22020-257 = "Que horror... Será que dá mesmo pra se divertir vencendo desse jeito?"
22020-258 = "(Challengers Next Battle Again!!)"
22020-263 = "Pedido de revanche?!#nCom certeza vai usar trapaça de novo!"
22020-264 = "...O que fazemos?"
22020-265 = "[s] \"Se o oponente está usando trapaça... talvez seja difícil vencer...\""
22020-266 = "Recusa logo! Não precisamos perder tempo com um trapaceiro desses!"
22020-268 = "É... Aris, que pena, mas dessa vez..."
22020-273 = "A-ainda tem um jeito..."
22020-279 = "[ns] \"Yuzu?\""
22020-281 = "...Deixa comigo.#nE-eu vou assumir."
22020-286 = "3"
22020-288 = "2"
22020-290 = "1"
22020-293 = "(Battle! START!)"
22020-296 = "!!!"
22020-302 = "Ah! Ele usou a trapaça de invisibilidade de novo!"
22020-303 = "Tudo bem.#nEu reparei antes que o personagem fica invisível, mas a sombra continua ali..."
22020-304 = "É só observar o tamanho da sombra pra reagir."
22020-305 = "[s] \"I-incrível...! Nem imaginava que existia um jeito desses!\""
22020-316 = "Tá acertando em cheio, mas o dano não entra!"
22020-317 = "Outra vez a trapaça de invencibilidade..."
22020-318 = "Provavelmente é uma trapaça que altera a hitbox."
22020-319 = "Nesse caso, basta causar dano garantido que ignore a hitbox."
22020-320 = "A habilidade de provocação dessa personagem#ncausa dano garantido se não for interrompida..."
22020-341 = "Momoi! Midori!#nV-vocês viram isso?!"
22020-342 = "É verdade..."
22020-343 = "O dano entrou!"
22020-353 = "[ns] \"Ah! O oponente começou a atacar com tudo de repente!\""
22020-355 = "Tudo bem.#nFicar defendendo no canto, ler os frames..."
22020-356 = "E no instante em que o oponente atacar..."
22020-357 = "Pular para trás!#nE mandar um chute forte..."
22020-364 = "O personagem dele caiu no chão!"
22020-365 = "Quando eu faço essa pressão, não dá pra se aproximar sem saber punir direito."
22020-366 = "Pelo nível do oponente, imaginei que ele não conseguiria..."
22020-367 = "Explorando as fraquezas dele uma por uma desse jeito..."
22020-368 = "Dá pra vencer."
22020-386 = "\"WINNER! Player UZQueen!\""
22020-388 = "Ufa..."
22020-393 = "Com isso... eu venci, né?"
22020-394 = "[s] \"Então essa é... a UZQueen...!\""
22020-395 = "Incrível! Você é incrível, Yuzu!#nA palavra \"incrível\" nem chega perto do quão incrível você foi!"
22020-396 = "Sim! Aris também! Fiquei assistindo vidrada o tempo todo!"
22020-397 = "Não importa o quanto o oponente use trapaças,"
22020-398 = "nós temos os \"golpes apelões\"... né?"
22020-399 = "É... s-se usar demais o jogo perde a graça, e#nbom... entre amigos acaba virando briga, então eu não gosto muito, mas..."
22020-400 = "Contra trapaceiro acho que não precisa pegar leve...#nA-afinal, isso também faz parte do jogo."
22020-401 = "Entendido! Golpes apelões também fazem parte do jogo!#nAris compreendeu!"
22020-402 = "Talvez, se tiver revanche, ele use uma trapaça pra anular golpes apelões, mas..."
22020-403 = "...Mesmo assim, se lutarmos, a gente vence."
22020-404 = "Sim... porque nós somos gamers."
22020-405 = "[s] \"Você é incrível mesmo, Yuzu.\""
22020-406 = "Ah, a-até o Sensei... b-bom, não foi grande coisa."
22020-407 = "Mas vencer no final deu um alívio enorme!"
22020-408 = "E como já terminamos de analisar o jogo..."
22020-409 = "Mana, vamos começar a reunião de planejamento?"
22020-410 = "...Hã, reunião de planejamento? De quê?"
22020-411 = "........."
22020-412 = "Maaaanaaa!"
22020-414 = "I-i-isso mesmo!#nEra verdade!"
22020-415 = "C-claro que a gente vai fazer!"
22020-419 = "(E assim, como sempre, o cotidiano do Clube de Desenvolvimento de Jogos segue em frente)"
22020-421 = "Próximo;~Aris Começa a Aventura!~"
