22020-167 = "Юзу, ты как всегда потрясающая."
22020-169 = "Я тоже впечатлена! Ты настоящий легендарный герой, UZQueen!"
22020-170 = "Ч-Что...? А?"
22020-171 = "[s] «Юзу! Потрясающе! Идеальная победа!»"
22020-172 = "Правда? Идеальная Юзу! Ты была в режиме UZQueen!"
22020-173 = "[s] «Режиме UZQueen...?»"
22020-174 = "Режим UZQueen — это вроде баффа, который активируется, когда Юзу попадает в напряжённую ситуацию!"
22020-175 = "В таком состоянии она становится смелее и увереннее обычного... мозг работает на 150% быстрее, а зрительное восприятие повышается на 280%!"
22020-176 = "Ты это только что выдумала..."
22020-177 = "Я тоже знаю! В таком состоянии Юзу очень сильная! Я бы хотела навык вроде режима UZQueen!"
22020-178 = "[s] «Невероятно! Режим UZQueen!»"
22020-179 = "Сенсей?!"
22020-180 = "Н-Нет, это не...! Огх!"
22020-181 = "На самом деле ничего особенного..."
22020-182 = "Увидев достижение Юзу, я вдохновилась действовать."
22020-183 = "Теперь моя очередь!"
22020-185 = "Под взглядами всех Алиса начала испытание в файтинге."
22020-187 = "Я стану героем файтингов, как Момои, Мидори, Юзу и Сенсей!"
22020-188 = "Момои скорее мусорный моб..."
22020-189 = "Эй! Даже если это правда, говорить вслух необязательно!"
22020-190 = "А-Алиса... Удачи!"
22020-191 = "Да! Я постараюсь!"
22020-192 = "Следующий соперник!"
22020-193 = ""
