22020-394 = "[s] «Вот она... моя UZQueen!»"
22020-395 = "П-Потрясающе! Даже слов нет, насколько это было круто, Юзу!"
22020-396 = "Да! Я всё время не дышала!"
22020-397 = "Понятно. Даже если враг читерит..."
22020-398 = "Его всё равно можно зачизить внутриигровыми трюками."
22020-399 = "Да... Хотя это грязный стиль игры. Я предпочитаю так не играть. Игра задумана не для этого."
22020-400 = "Но если соперник сам решает читерить, тогда все ограничения снимаются. Это тоже часть игры."
22020-401 = "Понятно! Значит, чизы и трюки тоже часть игрового процесса!"
22020-402 = "Да, именно. Хотя уверена, они смогут найти читы, чтобы противостоять и моим методам."
22020-403 = "Но даже если найдут, я придумаю другой способ их победить."
