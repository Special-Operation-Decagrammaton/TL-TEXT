[translation]
2000203-1 = "Эликсир бессмертия"
2000203-2 = "Лаборатория Саи"
2000203-3 = "Вот ты где, Сенсей. Спасибо, что не заставил ждать."
2000203-4 = "Итак, как мы обсуждали в прошлый раз, эликсир бессмертия наконец завершён."
2000203-5 = "Боишься, что кожа снова станет золотой? Ни за что! Просто посмотри на Незусукэ."
2000203-6 = ""
2000203-7 = "Эта блестящая шерсть! Эти большие яркие глаза... Незусукэ точно выглядит намного моложе!"
2000203-8 = "Говоришь, он выглядит как всегда? Хмф. Не будь таким грубым."
2000203-9 = ""
2000203-10 = "[s] Спросить, сколько лет Незусукэ."
2000203-11 = "Незусукэ? Он у меня с десяти лет, так что ему, наверное, уже минимум шесть?"
2000203-12 = "Для мыши это, пожалуй, довольно много... Настоящий мышиный дедушка."
2000203-13 = "Но посмотри на него. Незусукэ бодр и здоров благодаря всем эликсирам, которыми я его кормлю, оттачивая эксперименты. Правда ведь, Незусукэ?"
2000203-14 = "Незусукэ выглядит до смерти напуганным."
2000203-15 = "Незусукэ! Чего ты вдруг замолчал? Сенсей ещё подумает, что я всё это время над тобой издевалась!"
2000203-16 = "А? А как же тот раз, когда я прикрепила к тебе настоящую бомбу...?"
2000203-17 = "Это не издевательство! Это было ради науки, глупыш. Хи-хи!"
2000203-18 = "Ты просто помогал мне с абсолютно безопасным исследованием, потому что ты мой верный ассистент. Правда, Незусукэ?"
2000203-19 = "Незусукэ молчит. Он всё ещё выглядит ужасно напуганным."
2000203-20 = "Ах ты мелкий... Заговори, иначе я прикреплю к тебе ещё одну бомбу и выбью из тебя слова взрывом!"
2000203-21 = "[s] Спросить про эликсир бессмертия."
2000203-22 = "Ах да! Чуть не забыла."
2000203-23 = "Так! Вот ОН — эликсир бессмертия."
2000203-24 = ""
2000203-25 = ""
2000203-26 = "Сая протягивает мне ещё одну подозрительную разноцветную колбу."
2000203-27 = "[s1] «...»\n[s2] «...Ты уверена, что эта работает?»"
2000203-28 = "Сомневаешься? Я уже испытала его на Незусукэ, так что знаю — работает."
2000203-29 = "Сомневаешься? Я уже испытала его на Незусукэ, так что знаю — работает."
2000203-30 = "В мгновение ока снова почувствуешь себя старшеклассником!"
2000203-31 = "[s] Выпить эликсир."
2000203-32 = ""
2000203-33 = ""
2000203-35 = "Ну как? Чувствуешь себя молодым?"
2000203-36 = "[s] «Моя рука...»"
2000203-37 = "Рука?"
2000203-38 = "[s] «На руке растёт серая шерсть!»"
2000203-39 = "Серая шерсть? Что-то не так..."
2000203-40 = "В этой формуле лапки лягушки, щепотка примулы вечерней, клочок шерсти Незусукэ и..."
2000203-41 = "О нет! Это не эликсир бессмертия! Должно быть, я сделала эликсир, от которого всё тело покрывается серой шерстью!"
2000203-42 = "Эм... Предложить тебе бритву, Сенсей?"
2000203-43 = "[s] Потребовать вернуть всё как было."
2000203-44 = ""
2000203-45 = ""
2000203-46 = ""
2000203-47 = "А-а! Не подходи! Ты похож на огромного кота!"
