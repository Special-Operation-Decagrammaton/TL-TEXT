[translation]
2000108-1 = "Мейд-кафе! Часть 1"
2000108-2 = "Площадь снаружи"
2000108-3 = "(Прогуливаясь по улице, я заметил совершенно новое мейд-кафе.)"
2000108-4 = "[s1] «Не стоит. У меня есть дела.»\n[s2] «Лучше не надо. Ещё слишком рано.»"
2000108-5 = "(Я думал, что успешно себя убедил...)"
2000108-6 = "(...но ноги решили иначе.)"
2000108-7 = "*дзынь*"
2000108-9 = "Кафе Maidramatic!"
2000108-11 = ""
2000108-12 = "Ля-ля-ля. Хм-хм-хм."
2000108-13 = "Супермиленькая горничная Господина, Кэтрин, здесь!"
2000108-14 = "С возвращением, Господин!"
2000108-15 = ""
2000108-16 = "Добро пожаловать в Maidramatic! Мы ждали вас, Господин!"
2000108-17 = "Ч-Что за...?!"
2000108-18 = "С-Сенсей, как ты...?"
2000108-19 = "[s3] «Мы раньше встречались?»\n[s4] «„Кэтрин“...?»"
2000108-20 = "*вздох* Нужно было догадаться."
2000108-21 = "*вздох* Нужно было догадаться."
2000108-22 = "Подруга попросила меня... подменить её в десертном кафе, где можно носить очаровательную форму официантки..."
2000108-23 = "Как я могла отказаться от такого предложения?"
2000108-24 = "Я не сразу поняла, что речь о полноценном мейд-кафе..."
2000108-25 = "Н-Но важнее другое! Что ТЫ здесь делаешь, Сенсей?!"
2000108-26 = "Серьёзно! Учителям вообще разрешено ходить в такие места?"
2000108-27 = "[s5] «Моя смена закончилась, так что зови меня Господином.»\n[s6] «Что поделать? Мне нравятся горничные.»"
2000108-28 = "Вот это госслужащий..."
2000108-29 = "В-В общем, уходи! Я не могу работать, пока ты здесь. Слишком стыдно!"
2000108-30 = "Я понимаю, что это не какой-то подозрительный клуб."
2000108-31 = "Но легче от этого не становится! Поэтому прошу. Уйди, пожалуйста..."
2000108-32 = "Нет. Не так, Кэтрин."
2000108-33 = "Ты должна приветствовать посетителей."
2000108-34 = "Ух. Но, босс..."
2000108-35 = "*вздох* Ладно. Раз надо. Ты всё-таки платящий клиент. То есть..."
2000108-36 = "..."
2000108-37 = ""
2000108-38 = "Ты... господин."
2000108-39 = "*вздыхает*"
2000108-40 = "Проходи. Я покажу твой столик."
2000108-42 = "Фотографировать и трогать горничных строго запрещено, но уверен, ты и так это знаешь."
2000108-43 = "И уж точно не фотографируй... Если хоть одно такое фото всплывёт, можешь лишиться жизни."
2000108-44 = "Вот меню. Посмотри и скажи, что будешь..."
2000108-45 = "[s7] «Покажи мне моэ-моэ-кюн.»\n[s8] «Ты ведь умеешь рисовать милые картинки сиропом и кетчупом?»"
2000108-46 = "Сенсей — то есть Господин — как часто ты вообще ходишь в мейд-кафе?"
2000108-47 = "Сенсей — то есть Господин — как часто ты вообще ходишь в мейд-кафе?"
2000108-48 = "Я-я бы никогда не смогла быть настолько бесстыдной."
2000108-49 = "[s] «У моего народа есть одна очень любимая просьба.»"
2000108-50 = "Что значит «твоего» народа?"
2000108-51 = "И откуда мне знать? Я впервые работаю в мейд-кафе."
2000108-52 = "Секунду — посмотрю. Что люди вроде тебя хотят... от мейд-кафе...?"
2000108-53 = ""
2000108-54 = "Что?!"
2000108-55 = "Что за...? Горничные правда делают ТАКОЕ?"
2000108-56 = "Н-Ногами? Как бесстыдно! Ни за что! Я не могу!"
2000108-57 = "Как я могу...? Как мне...?"
2000108-58 = "Ты хочешь, чтобы я по тебе топталась?!"
2000108-59 = "Я не могу сделать такое!"
2000108-60 = "А? Это вроде массажа? *вздох* Никакого смысла..."
2000108-61 = "..."
2000108-62 = "Гх. Менеджер смотрит прямо на меня."
2000108-63 = "Л-Ладно. То, что ты просил, я не сделаю, но вместо этого..."
2000108-64 = ""
2000108-65 = ""
2000108-66 = "...сделаю вот это."
2000108-67 = "Моэ... моэ..."
2000108-68 = "Кю..."
2000108-69 = "Кю...!"
2000108-70 = "Кю-у..."
2000108-71 = "А-а-а! Не могу!"
2000108-72 = ""
2000108-74 = "(После этого менеджер отругал нас обоих.)"
