[translation]
1005005-1 = "Я же сказала, что ненавижу их!"
1005005-2 = "Центр города"
1005005-3 = "Гуляя по центру города, я встретил Кокону."
1005005-4 = "О! Здравствуйте, Сенсей."
1005005-5 = "Хорошо, что я вас встретила. Сейчас у меня в голове много всего."
1005005-6 = "Я думала, как заставить учеников называть меня Инструктор Кокона."
1005005-7 = "Когда вы с ними поговорили, немного помогло, но они довольно быстро снова перешли на просто «Кокона»..."
1005005-8 = "[s1] «Ну, если ты продолжишь избегать моркови—»\n[s2] «Тебе нужно подавать хороший пример, начиная с моркови.»"
1005005-9 = "Но я ненавижу морковь!"
1005005-10 = "Но я ненавижу морковь!"
1005005-11 = "Мне всё равно, что вы скажете."
1005005-12 = "Я никогда её не любила и никогда не полюблю!"
1005005-13 = "Я ведь не выбирала ненавидеть её."
1005005-14 = "Просто... Как люди вообще могут это есть?"
1005005-15 = "Она горькая. Странно пахнет. Твёрдая как камень..."
1005005-16 = "Она не пригодна для употребления человеком."
1005005-17 = "Что вообще заставило людей начать её есть?"
1005005-18 = "Это явный культурный регресс."
1005005-19 = "Мы должны двигаться вперёд. Должны есть лучше. БЫТЬ лучше."
1005005-20 = "Морковь такая... неизысканная!"
1005005-21 = "И даже не начинайте про болгарский перец!"
1005005-22 = "Он не только горький и вонючий — прямо как морковь, — так ещё и острый!"
1005005-23 = "[s3] «А если бы ты оказалась на необитаемом острове и могла есть только морковь или болгарский перец?»\n[s4] «А если бы пришельцы решили мировой голод, но могли дать нам только морковь или болгарский перец?»"
1005005-24 = "Что?!"
1005005-25 = "Что?!"
1005005-26 = "Что это вообще за выбор?!"
1005005-27 = "Морковь или болгарский перец? И всё?"
1005005-28 = "Лучше умру с голоду, чем съем хоть одно!"
1005005-29 = "[s] «Ну ладно. Неужели ты правда считаешь их настолько ужасными...?»"
1005005-30 = "Морковь. И болгарский перец. Конечно считаю."
1005005-31 = "Ух. Ну, если бы я ОБЯЗАТЕЛЬНО должна была выбрать..."
1005005-32 = "Что ж..."
1005005-33 = "...выбрала бы морковь. Скрепя сердце."
1005005-34 = "По крайней мере, она не острая, как болгарский перец..."
1005005-35 = "Фу. Почему вы так упорно хотите это знать?"
1005005-36 = "[s5] «Потому что я знаю ресторан, где готовят лучшую морковь в Кивотосе. Пойдём вместе!»\n[s6] «Потому что хочу помочь тебе распробовать морковь, и знаю идеальный ресторан!»"
1005005-37 = "Вы хотите, чтобы я специально ела морковь? Ещё и в ресторане..."
1005005-38 = "Вы хотите, чтобы я специально ела морковь? Ещё и в ресторане..."
1005005-39 = "Послушайте, я правда ценю предложение и то, что вы готовы заплатить."
1005005-40 = "Но можем сходить куда-нибудь ещё? Есть рестораны и получше."
1005005-41 = "И я предпочла бы что-нибудь более изысканное."
1005005-42 = "Зачем идти в морковный ресторан, если можно съесть что-нибудь лучше?"
1005005-43 = "[s] «Кокона. Ты сказала, что выберешь морковь.»"
1005005-44 = "Я-я знаю, что сказала, но..."
1005005-45 = "Только потому, что вы заставили выбирать между морковью и болгарским перцем."
1005005-46 = "Что— Почему вместо этого вы хотите повести меня в ресторан болгарского перца?!"
1005005-47 = "Сенсей, вы такой злой!"
1005005-48 = "Я думала, хотя бы вы меня поймёте!"
1005005-50 = "Кокона разрыдалась, и мне понадобилось очень много времени, чтобы её успокоить."
