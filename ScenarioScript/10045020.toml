[translation]
10045020-1 = "Эпизод 2;Раунд 1: Полоса препятствий с водяными пистолетами"
10045020-4 = "Не сбавлять напор! Валите Хяккарёран!!"
10045020-5 = "В атаку — со ВСЕЙ накопленной обидой!!"
10045020-6 = ""
10045020-9 = "Юкари! Ты в порядке? Они скоро прорвутся к твоей позиции!"
10045020-10 = ""
10045020-12 = ""
10045020-13 = "А! Я-я пока в порядке!"
10045020-14 = "Непостижимо. Мой план был безупречен..."
10045020-15 = "Это из-за меня... Я бесполезна... Как всегда тяну команду назад..."
10045020-17 = "А-а-а! Держитесь, Хяккарёран!"
10045020-19 = "Десятью минутами ранее..."
10045020-20 = ""
10045020-21 = "Мы открыты со всех сторон."
10045020-22 = "Полагаю, другие участники создадут какое-нибудь укрытие, чтобы укрепить оборону."
10045020-23 = "Самая эффективная стратегия — построить форт и атаковать из-за его стен."
10045020-24 = "Я задержу врагов, пока он не будет готов!"
10045020-26 = "Не мой обычный стиль, но я последую твоему плану, Кикё."
10045020-27 = "Кикё никогда не вела нас не туда."
10045020-28 = ""
10045020-29 = "...Я повела нас не туда."
10045020-30 = "Я не учла возможность того, что мы окажемся в эпицентре такой масштабной битвы."
10045020-31 = ""
10045020-34 = "Кья-а-а...!"
10045020-35 = "Не-е-ет! Пожалуйста, очнись! Мы же обещали после матча сходить в кафе с десертами!"
10045020-36 = ""
10045020-39 = "Агх...!!"
10045020-40 = "Вы, как всегда, безжалостны, Хяккарёран! Я вам этого не прощу!"
10045020-42 = "Это нечестно!"
10045020-43 = "Почему все целятся именно в нас?"
10045020-45 = "Само наше будущее зависит от того, сможем ли мы вас свалить!"
10045020-46 = "Именно! Надо избавиться от самых сильных соперников!"
10045020-47 = "Вы лишили наш клуб финансирования, так что нам нужны призовые деньги!"
10045020-49 = "...Значит, ими двигало отчаяние."
10045020-50 = "Хмф. Вот и последствия ваших собственных поступков!"
10045020-51 = ""
10045020-54 = "Гах! Лидер, берегись!"
10045020-55 = ""
10045020-57 = ""
10045020-58 = ""
10045020-59 = ""
10045020-60 = "АХ! А-А-А!!"
10045020-61 = ""
10045020-62 = "Н-Не может быть!"
10045020-63 = "Вы... Я вам этого никогда не прощу!"
10045020-64 = "Трагедии поля боя сеют семена ненависти!"
10045020-65 = "Преодоление этого испытания станет великим триумфом нашей юности!"
10045020-66 = "Юность не должна быть настолько жестокой!"
10045020-71 = "Какое огненное начало боя! Хяккарёран атакуют со всех сторон! Смогут ли они выстоять?!"
10045020-72 = ""
10045020-73 = "Давайте поможем."
10045020-74 = "Изуне нравится! Хяккарёран всегда протягивали руку помощи тем, кто в ней нуждался!"
10045020-75 = "Фуфу. Тогда, начнём?"
10045020-76 = ""
10045020-79 = ""
10045020-80 = "Какого чёрта?!"
10045020-81 = "Э-Это...!"
10045020-82 = ""
10045020-84 = ""
10045020-85 = "Клуб исследования ниндзюцу пришёл на помощь! Нин-нин!"
10045020-86 = "Эм, я не ниндзя..."
10045020-87 = "Ниндзя или нет... Мы сражаемся вместе."
10045020-89 = "Ух, они объединились!"
10045020-90 = "Не отступать! У нас всё ещё численное преимущество!"
10045020-91 = ""
10045020-93 = ""
10045020-96 = ""
10045020-97 = "Х-Хяккарёран! Позвольте и нам помочь!"
10045020-98 = "Пусть ненадолго, но Рэнгэ когда-то была одной из нас!"
10045020-100 = "Боже мой! Эй, ребята!"
10045020-101 = "Почему их внезапно стало так много?!"
10045020-102 = "Теперь мы переломим ход битвы!"
10045020-103 = "Именно! Все, В АТА-А-АКУ!!"
