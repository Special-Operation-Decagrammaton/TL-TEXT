[translation]
10053030-1 = "Эпизод 3;Автобус-призрак"
10053030-4 = ""
10053030-5 = "Эм..."
10053030-6 = "Похоже, мы взялись за что-то не по силам."
10053030-7 = ""
10053030-9 = ""
10053030-10 = ""
10053030-11 = "Ты уверена, что нам сюда?"
10053030-12 = "Судя по карте, определённо."
10053030-13 = "Может, тебя обманули?"
10053030-14 = "Нет. Я бронировала всё через проверенный сайт и проверила достоверность последних отзывов. Я уверена."
10053030-15 = "Это единственная дорога к нашему горному домику."
10053030-16 = "А этот мост точно надёжный? Он не... рухнет?"
10053030-17 = ""
10053030-19 = ""
10053030-20 = "Ну, даже если рухнет, под ним река. Плавать ты умеешь, да?"
10053030-21 = "Как будто..."
10053030-22 = ""
10053030-23 = "Добрый день, дамы."
10053030-24 = ""
10053030-26 = ""
10053030-27 = ""
10053030-28 = "Полагаю, вы ищете домик на другом конце моста?"
10053030-30 = "О, значит, он всё-таки существует."
10053030-32 = "Да. И если вы ищете тот домик в лесу..."
10053030-33 = "Вам лучше повернуть назад."
10053030-35 = "Что?! Значит, это ВСЁ-ТАКИ мошенничество! Они украли наши деньги?"
10053030-37 = "Нет. Домик там, это точно. Но... лучше вам в нём не оставаться."
10053030-38 = "Причину... Вы поймёте, когда увидите. И пожалеете, что увидели."
10053030-40 = "...!"
10053030-42 = "Я вас предупредил. Ещё не поздно поискать другое место."
10053030-43 = ""
10053030-45 = ""
10053030-46 = ""
10053030-47 = ""
10053030-48 = "...? Какой странный старик."
10053030-49 = "Ладно, пойдём, пока не стало слишком поздно. В сельской местности солнце садится раньше."
10053030-50 = "П-Подождите! Мы просто пойдём туда?!"
10053030-51 = "Хм? Я что-то пропустила?"
10053030-52 = "Я о том! Жуткий старик предупреждал нас не идти! И он весь побитый! Это не совпадение. Он явно ждал именно нас."
10053030-53 = "Коноха... Я восхищаюсь твоей способностью ставить себя в центр вселенной."
10053030-54 = "Но вера в то, что мир вращается вокруг тебя, приведёт к мании величия."
10053030-55 = "И это тоже можно преодолеть."
10053030-56 = ""
10053030-58 = ""
10053030-59 = ""
10053030-60 = "Если подумать, Коноха вообще-то довольно пугливая..."
10053030-61 = "Она читает каждую жуткую историю, которую находит в интернете, а потом так себя накручивает, что не может заснуть."
10053030-62 = "Я? «Пугливая»? Всё совсем не так!"
10053030-63 = "Этот парень весь день ждал здесь, чтобы выдать нам зловещее предупреждение. Он бы не делал этого без причины. Вы же знаете, что говорят о современном обществе и его пренебрежении элементарной безопасностью!"
10053030-64 = "Верно, Сенсей?! Вам это хотя бы НЕМНОГО не показалось подозрительным?"
10053030-65 = "[s1] «Это было слишком удобно для простого совпадения...»\n[s2] «Меня это беспокоит.»"
10053030-68 = "Вот! Сенсей согласен!"
10053030-70 = "Ага. Но если вы вдруг не заметили главное — другого жилья поблизости нет."
10053030-71 = "Ближайшая деревня в часе ходьбы."
10053030-72 = "Фу. Ужас."
10053030-73 = "Нам стоит продолжить. Мы уже заплатили, а при таком позднем отказе деньги не вернут."
10053030-75 = "Пожалуйста, Сенсей!"
10053030-76 = "[ns3] «Час пешком...»\n[ns4] «И похоже, такси здесь тоже нет...»"
10053030-79 = ""
10053030-80 = "[ns] «Коноха.»"
10053030-81 = ""
10053030-82 = "[ns] «Бывают моменты, когда нужно призвать всю свою смелость.»"
10053030-83 = "Сенсей?!"
10053030-84 = ""
10053030-86 = ""
10053030-87 = "А если появится призрак, мы полностью возьмём на себя защиту Конохи."
10053030-88 = "З-Зачем вы это сказали?! Вы же знаете, даже произнесение слова на букву «П» привлекает их!"
10053030-89 = "Если бы всё было так просто, мы бы уже могли надёжно их документировать. Идём. Я подержу тебя за руку."
10053030-90 = "Л-Ладно. Только не тяните меня! Я могу идти в своём темпе!"
10053030-91 = ""
10053030-93 = ""
10053030-94 = ""
10053030-95 = ""
10053030-96 = ""
10053030-99 = "Здесь чище, чем я ожидала."
10053030-101 = ""
10053030-102 = "Снаружи мне казалось, что внутри будет свалка. Но, если честно... не так уж плохо."
10053030-103 = "Эй, Рэна. Тебе не кажется, что здесь какая-то... жуткая атмосфера?"
10053030-104 = "...Ты всё ещё думаешь о том старике?"
10053030-105 = "Нет, дело не в нём! Я что-то чувствую! Костями! Что-то леденящее...!"
10053030-106 = ""
10053030-107 = "Холодные зоны — один из характерных признаков появления призрака."
10053030-108 = ""
10053030-111 = ""
10053030-112 = "Однако я не обнаруживаю никаких неестественных локальных колебаний температуры. Можешь расслабиться."
10053030-113 = ""
10053030-115 = ""
10053030-116 = ""
10053030-117 = "Что это? Камера?"
10053030-118 = "Да! Точнее, это тепловизор. С его помощью я могу видеть относительную температуру в помещении. Он даже умеет делать снимки."
10053030-119 = "Ты и правда подготовилась..."
10053030-120 = "Разумеется. В конце концов, мы охотимся на доселе невиданное легендарное существо."
10053030-121 = "Повторюсь: я научным путём подтвердила, что никаких холодных зон здесь нет. Успокойся, Коноха — ты, наоборот, довольно тёплая."
10053030-123 = "Всегда обо мне заботитесь, директор! На вас можно положиться."
10053030-124 = "Фуфу, в конце концов, я профессионал."
10053030-125 = ""
10053030-127 = ""
10053030-128 = ""
10053030-129 = "...Хм? Сенсей? У вас вопрос?"
10053030-130 = "[ns5] «Ну, ты сказала, что ты „профи“...»\n[ns6] «Это часть клубной деятельности?»"
10053030-133 = "...!"
10053030-134 = "Э-Это тоже интересная тема, но, думаю, лучше углубиться в неё как-нибудь в другой раз!"
10053030-135 = "Время не ждёт! Как я уже говорила, в сельской местности солнце садится рано! Не будем тратить день впустую!"
10053030-136 = ""
10053030-138 = ""
10053030-139 = ""
10053030-140 = "...? Что на неё нашло?"
10053030-141 = "Не хотеть говорить о клубах... Я её понимаю."
10053030-142 = "[s7] «Вы обе тоже не знаете?»\n[s8] «Вы никогда не говорили о её клубе?»"
10053030-145 = "Ну, понимаете..."
10053030-146 = ""
10053030-148 = ""
10053030-149 = "Хм. Странно, правда? Почему я ничего о ней не знаю?"
10053030-150 = "Да, мы давно знакомы, но в основном как друзья из сети. Мы не особо обсуждаем повседневную жизнь."
10053030-151 = "Кинуи Рэна. Академия искусств Вайлдхант, первый курс. Специальность — дизайн одежды."
10053030-152 = "Ч-Что...? Что ты делаешь?"
10053030-153 = ""
10053030-155 = ""
10053030-156 = "Общежитие №4. Номер комнаты..."
10053030-157 = "Уф, не хочу называть этот номер... Но это «404,» верно? У тебя три старшие соседки по комнате."
10053030-158 = "Номер комнаты, количество девушек, которые там живут... Брр, мурашки по коже."
10053030-159 = "Это мне сейчас должно быть жутко! Откуда ты всё это знаешь?! Ты что, следишь за мной...?!"
10053030-160 = "Ц-ц-ц, наивное дитя. Способ всегда найдётся."
10053030-161 = "Люди ничего не могут с собой поделать и постоянно сливают личную информацию, когда что-то публикуют в интернете."
10053030-162 = "Я поняла, в каком общежитии ты живёшь, по тому, как ты рассказывала о ближайшем магазине, о холме, по которому ненавидишь подниматься, и об извилистой дороге на занятия. Она ведёт к... корпусу дизайна, верно?"
10053030-163 = "Я никогда не называла номер своей комнаты."
10053030-164 = "Ты говорила, что чувствуешь себя проклятой из-за номера комнаты. Несчастливыми числами, скорее всего, были бы «4,» «6» или «13». Но раз ты живёшь в общежитии №4, вероятнее всего, это «404», потому что в «406» никакого смысла нет. А в «413» — тем более."
10053030-165 = "Ты кто вообще, детектив?!"
10053030-166 = "Детектив? Какая скукоооота."
10053030-167 = "Я из Бюро общественной безопасности. Училась у лучших. У меня есть знакомая, которая способна заставить матерого бандита рыдать как ребёнок."
10053030-168 = "А, так ты и правда учишься в Валькирии, Коноха. Я думала, ты это выдумала."
10053030-169 = "Аха, как жестоко! Хочешь сказать, я слишком похожа на хулиганку?"
10053030-170 = "Я такого НЕ говорила!"
10053030-171 = "Но подумала же, правда?"
10053030-172 = "Н-Не думала!"
10053030-173 = "Да ладно, наверняка такая мысль мелькнула. Хоть капельку, да? Когда ты впервые меня увидела? М?"
10053030-174 = "...Ну, если ты так ставишь вопрос..."
10053030-175 = "Сенсей!! Рэна назвала меня хулиганкой!!"
10053030-176 = "А?! Ч-Что?! Ты сама заставила меня это сказать!"
10053030-177 = "[s9] «Не дразни Рэну слишком сильно...»\n[s10] «Рэна, уважай старших.»"
10053030-178 = "Ага!"
10053030-179 = ""
10053030-181 = ""
10053030-183 = "С-Сенсей?!"
10053030-186 = "Ах! Ну хватит! Перестаньте меня дразнить!!"
10053030-189 = "...Все свидетельства о Цучиноко были вдоль берега реки у горы Ширакава."
10053030-191 = ""
10053030-192 = "Если Цучиноко действительно биологическое существо, ему нужен постоянный источник воды. Логично предположить, что оно обитает у склона горы или глубоко в долине — подальше от людей."
10053030-193 = ""
10053030-195 = ""
10053030-196 = ""
10053030-197 = "Хорошо, поняла!"
10053030-198 = "Следующая остановка — гора! А эта линия идёт прямо к горе Ширакава!"
10053030-199 = ""
10053030-201 = ""
10053030-202 = "...Ого, Сенсей. Только взгляните."
10053030-203 = "Здесь всего один маршрут, и автобус ходит лишь два раза в день."
10053030-204 = "Ну, это же сельская местность. Не то чтобы сюда толпами ездили туристы..."
10053030-205 = "*вздох* Ну и жииизнь у меня...?"
10053030-206 = "Ну, дамы, осталось всего тридцать минут. Можно и поболтать! Или мы могли бы... попееееть?"
10053030-210 = ""
10053030-211 = "Хм? Это ведь правильный номер, да?"
10053030-212 = "Ага. Как... странно. Он приииилично раньше расписания."
10053030-213 = ""
10053030-215 = ""
10053030-216 = ""
10053030-217 = "..."
10053030-218 = ""
10053030-220 = "..."
10053030-221 = "...Ах!"
10053030-222 = "Неужели это...?!"
10053030-223 = ""
10053030-225 = "Теперь, когда я ближе к Цучиноко, удача возвращается ко мне!"
10053030-226 = "Держи змею поблизости! Всё как сказала гадалка!"
10053030-227 = ""
10053030-229 = ""
10053030-230 = ""
10053030-231 = "Она и правда так нагадала...? Нет, должно быть, совпадение."
10053030-232 = "Подождите, Рэна. Сенсей."
10053030-233 = "Только мне номер этого автобуса кажется странным?"
10053030-234 = "[s11] «А? F 44-66...?»\n[s12] «Очень уж зловеще...»"
10053030-237 = "«Четвёрку» обычно не используют в номерных знаках. Она считается зловещей и ассоциируется со смертью."
10053030-238 = "А тут ещё и 44-66..."
10053030-239 = "Автобус F 44-66...?"
10053030-240 = "Хм? Ты о нём слышала?"
10053030-241 = "М-м... Ну, не скажу, что я эксперт, но в интернете люди делились одной историей."
10053030-242 = "Говорили, что на этом автобусе ездят призраки..."
10053030-243 = "Призраки...?"
10053030-244 = "Типичное клише из страшилок. Кто-то не задумываясь садится в автобус, замечает, что он полон призраков, и выпрыгивает."
10053030-245 = "Или кто-то засыпает в автобусе и оказывается в параллельном Кивотосе... Ну, знаете, как в исекае."
10053030-246 = "Какое-то время истории про автобусы были довольно популярны..."
10053030-247 = "И у всех автобусов в этих страшилках были номера F 44-66...?"
10053030-248 = ""
10053030-250 = ""
10053030-251 = "К-Конечно, это просто совпадение! Шутка! Не то чтобы я верила во всю эту ерунду!"
10053030-252 = "К тому же с чего бы нам встретить призрачный автобус с привидениями посреди бела дня в глуши? Да ещё прямо во время расследования? Слишком уж надуманно! Такого быть не может."
10053030-253 = "Если только он не настоящий."
10053030-254 = "..."
10053030-255 = ""
10053030-257 = ""
10053030-258 = ""
10053030-259 = "Эй, бип-бип! Сенсей, народ, садитесь? Транспорт ждёт!"
10053030-260 = "[ns13] «Может, не на этот автобус.»\n[ns14] «Давайте подождём следующий.»"
10053030-263 = ""
10053030-264 = "А? Но здесь останавливается только один автобус...?"
10053030-265 = "...Что?"
10053030-266 = "Хм. Если присмотреться, номер маршрута этого автобуса не совпадает с номером на остановке."
10053030-267 = "Простите, уважаемый водитель. Этот автобус идёт к горе Ширакава?"
10053030-268 = "..."
10053030-269 = "...? Алло, вы меня слышите?"
10053030-270 = "..."
10053030-271 = ""
10053030-273 = ""
10053030-274 = "Здесь что-то нечисто."
10053030-275 = "...Похоже, пора достать это."
10053030-277 = "Достать что?! Только не ружьё у тебя за спиной?!"
10053030-278 = "Не думаю, что затевать драку с призраком — хорошая идея..."
10053030-280 = ""
10053030-281 = "Сенсей, пожалуйста, присмотрите за Конохой."
10053030-282 = "Когда дело касается суеверий... Коноха постоянно вляпывается в неприятности."
10053030-284 = "[ns15] «(Так вот о чём меня предупреждала Канна...?)»\n[ns16] «Эм, Коноха, давай просто отпустим автобус...»"
10053030-288 = ""
10053030-289 = "Нет, Сенсей. Мой «маленький друг» отлично помогает в таких ситуациях."
10053030-290 = "Ты не оставил мне выбора, приятель."
10053030-291 = ""
10053030-293 = ""
10053030-295 = "[ns17] «...? Что это?»\n[ns18] «Студенческое удостоверение?»"
10053030-298 = "А, похоже, вы с этим не знакомы."
10053030-299 = "Ну что ж, смотрите и учитесь. Водители Кивотоса боятся этого куда больше моего дробовика."
10053030-300 = "Здравствуйте, сэр. Я из Валькирии — вот значок. Не покажете права?"
10053030-301 = ""
10053030-302 = "..."
10053030-303 = "О, я слишком тихо сказала? Я попросила предъявить удостоверение оператора этого тяжёлого транспортного средства. Отказ предоставить документы автоматически считается нарушением."
10053030-304 = ""
10053030-305 = "..."
10053030-306 = ""
10053030-308 = ""
10053030-309 = "Ах! Сэр! Стоять! Только попробуйте—"
10053030-311 = ""
10053030-313 = ""
10053030-314 = "...Он и правда попробовал."
10053030-315 = "Может, призраки тоже боятся штрафов...?"
10053030-317 = "Цк... Ну погоди, приятель. Я запомнила твои номера..."
10053030-318 = "Но всё же, Сенсей. Отличные навыки расследования! Он выглядел СОВЕРШЕННО как обычный автобус."
10053030-319 = "[s19] «Ну... Рэна меня насторожила.»\n[s20] «Цубаса что-то заподозрила...»"
10053030-321 = "А-А?! О-О! Т-Точно! Они вели себя довольно... подозрительно! Да?"
10053030-322 = "(Предупреждайте, если собираетесь вот так внезапно выставлять меня на первый план!)"
10053030-323 = ""
10053030-325 = ""
10053030-326 = ""
10053030-327 = "Хм?"
10053030-329 = "А? Ну потому что... я эксперт! Было множество признаков..."
10053030-330 = "Правда? И что же тебя насторожило, директор?"
10053030-331 = "В-Всё откроется в своё время, Коноха."
10053030-332 = ""
10053030-334 = ""
10053030-335 = "А?"
10053030-336 = ""
10053030-341 = ""
10053030-342 = "О, кажется, вот это уже НАСТОЯЩИЙ автобус!"
10053030-343 = ""
10053030-345 = ""
10053030-346 = ""
10053030-347 = "НАСТОЯЩИЙ...! Стойте, я не это имела в виду — я вовсе не говорю, что считала тот автобус «призрачным» или чем-то таким!"
10053030-348 = ""
10053030-350 = ""
10053030-351 = ""
10053030-352 = ""
10053030-353 = ""
10053030-354 = "Добро пожаловать! Осторожнее на ступеньке, юная леди!"
10053030-355 = "Спасибо. З-Здравствуйте."
10053030-356 = "Эм, вопрос может показаться странным, но раньше здесь уже был автобус, и..."
10053030-358 = "...А? Другой автобус? Странно."
10053030-359 = "Это единственный автобус, который здесь останавливается. Видите знак?"
10053030-360 = "...?!"
10053030-363 = "В итоге мы так и не выяснили, откуда взялся подозрительный автобус и куда он делся..."
