[translation]
1000606-1 = "Нежное лечение"
1000606-2 = "Медпункт академии Геенна"
1000606-4 = "..."
1000606-5 = "[s] «Всё в порядке, Иори?»"
1000606-6 = "А-а! О, это всего лишь ты, Сенсей. Напугал меня!"
1000606-7 = "Как моя рана? Да ничего серьёзного."
1000606-8 = "Префекты должны быть готовы получать травмы при исполнении. Не переживай."
1000606-9 = "А? Зачем её дезинфицировать? Я всё обработала ещё до твоего прихода."
1000606-10 = "Эм..."
1000606-11 = "Только вот... никак не могу дотянуться и нормально завязать бинт сзади..."
1000606-12 = "Не поможешь мне, Сенсей?"
1000606-13 = "Расстегнуть форму сзади немного сложно... Можешь ненадолго закрыть глаза?"
1000606-16 = "И никаких странных мыслей..."
1000606-22 = "Всё. Можешь открыть."
1000606-25 = "― Что это за лицо? Только попробуй думать о чём-нибудь непристойном![wa:620]"
1000606-28 = "― Сколько ты ещё будешь стоять и глазеть? Быстрее помогай.[wa:10]"
1000606-31 = "― Угх... Гх... Аргх...[wa:2300]"
1000606-33 = "― Было больно? Я префект Геенны. Для меня это пустяк![wa:4380]"
1000606-36 = "― Просто... было немного щекотно... Вот и всё.[wa:1120]"
1000606-39 = "― Ты что делаешь? Бинт развязывается.[wa:340]"
1000606-42 = "― Если это ты... я совсем не против.[wa:3500]"
1000606-44 = "― Так что быстрее затяни его крепче![wa:540]"
1000606-47 = "Я перевязал Иори и помог ей снова одеться."
1000606-48 = ""
1000606-49 = "Спасибо тебе за помощь сегодня."
1000606-50 = "Ты всегда казался мне чудаком, но у тебя есть и добрая сторона."
1000606-51 = "Если я попрошу, ты ведь снова поможешь мне обработать раны... да?"
1000606-52 = "Идиот! Я не говорила, что специально буду травмироваться, лишь бы ты мне помогал!"
1000606-53 = ""
1000606-54 = ""
1000606-55 = ""
1000606-56 = ""
1000606-57 = "Но если это всё-таки случится... надеюсь, я смогу на тебя рассчитывать."
1000606-59 = "Иори покинула медпункт с довольным выражением лица."
