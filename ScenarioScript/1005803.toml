[translation]
1005803-1 = "Царство увлечений"
1005803-6 = "Неожиданно ты получил приглашение в комнату Мине..."
1005803-7 = "Добро пожаловать, Сенсей. Это моя комната."
1005803-8 = "[s] «Так вот что значит коллекционировать медицинские принадлежности.»"
1005803-9 = "Ничего удивительного."
1005803-10 = "Кто-то коллекционирует книги. Другие — крышки от бутылок, марки или памятные монеты..."
1005803-11 = "А я просто коллекционирую медицинские принадлежности."
1005803-12 = "Это довольно практично. Они очень полезны."
1005803-13 = "[s] «Но даже так, разве здесь не слишком много всего?!»"
1005803-14 = "Похоже, коллекция и правда сильно разрослась..."
1005803-15 = "Если посмотреть на неё со стороны, наверное, я могу понять."
1005803-16 = "Но, Сенсей, мы ведь Рыцари помощи."
1005803-17 = "Разве мы не должны быть готовы в любой момент?!"
1005803-18 = "Что бы ни случилось!"
1005803-19 = "[s1] «Д-да... Я вовсе не хочу плохо говорить о твоём хобби, Мине.»\n[s2] «Просто кажется, что здесь довольно много одинаковых материалов...»"
1005803-22 = "Одинаковых материалов...?!"
1005803-23 = ""
1005803-25 = ""
1005803-26 = ""
1005803-27 = "Я не могу проигнорировать такое заявление!"
1005803-28 = "Даже если взять только бинты, вот этот и тот — совершенно разные!"
1005803-29 = "[s] «По-моему, это одинаковые бинты...?»"
1005803-30 = "Они разные! Тот, с замысловатой текстурой, — знаменитый бинт от Saint Ann Medical."
1005803-31 = "Они зарабатывают, производя только самые высококачественные медицинские материалы. Нам приходится покупать хотя бы часть этих бинтов, потому что хороших альтернатив нет!"
1005803-32 = "Они предназначены для экстренной помощи, поэтому отлично останавливают кровотечение и обеззараживают раны. А ещё у них достаточно натяжения, чтобы хорошо прижимать рану!"
1005803-33 = "Звучит как идеальный бинт..."
1005803-34 = "Правда, стоит он в пять-семь раз дороже обычных бинтов!"
1005803-35 = ""
1005803-38 = ""
1005803-39 = "А вот этот бинт, напротив, от Rosieu."
1005803-40 = "У него плотное плетение, поэтому он отлично фиксирует, а большая ширина позволяет создавать компрессию на большой площади."
1005803-41 = "Цена низкая или средняя, так что любой может позволить себе держать запас таких бинтов!"
1005803-42 = "Можно сказать, этот продукт ближе всего к истинной сути бинта!"
1005803-43 = "[s] «Д-да! Понятно!»"
1005803-44 = "Эти лечебные мази тоже разные!"
1005803-45 = ""
1005803-47 = ""
1005803-48 = "Вот эта мазь в красной упаковке создана для того, чтобы подавлять размножение микробов."
1005803-49 = "Она особенно эффективна против грамположительных бактерий, которые часто являются основной причиной кожных инфекций."
1005803-50 = "А та мазь в зелёной упаковке немного хуже подавляет рост бактерий."
1005803-51 = "Но зато она стимулирует регенерацию клеток, благодаря чему рана заживает сравнительно быстрее."
1005803-52 = "Также у неё есть некоторые стероидные свойства, поэтому она отлично борется с воспалением."
1005803-53 = "Конечно, злоупотреблять ею опасно именно из-за этих стероидных свойств, но..."
1005803-54 = "[s3] «Понятно! Я не понял вообще ничего!»\n[s4] «Я не особо разбираюсь, но ты потрясающая, Мине!»"
1005803-57 = "Хммм..."
1005803-58 = "Как бы я ни пыталась объяснить, похоже, ты всё равно не понимаешь их различий и красоты..."
1005803-59 = "Ничего. Должен же быть какой-то способ!"
1005803-60 = ""
1005803-62 = ""
1005803-63 = ""
1005803-64 = ""
1005803-65 = ""
1005803-66 = ""
1005803-68 = "Знаю! Давай попробуем ранить моё собственное тело!"
1005803-69 = "[s] «Зачем?!»"
1005803-70 = "Я слышала, что если чего-то не понимаешь, лучше всего учиться, когда это происходит с твоим собственным телом!"
1005803-71 = "Если сравнить эффективность этих медицинских средств на моём теле,"
1005803-72 = "уверена, даже ты сможешь глубоко понять различия между ними, Сенсей!"
1005803-73 = "[s] «Прекрати!»"
1005803-74 = "Совсем чуть-чуть! Можно просто уколоть кончики пальцев иглой или слегка порезать руку скальпелем...!"
1005803-75 = "А? Прямо у тебя на глазах... Ты не можешь смотреть, как студент получает травму...?"
1005803-76 = ""
1005803-78 = ""
1005803-79 = "Если так... прости. Похоже, я слишком увлеклась, Сенсей..."
1005803-80 = "Но если тебе когда-нибудь понадобится экстренная помощь..."
1005803-81 = "Обязательно обратись ко мне."
1005803-83 = "Даже после этого, пока мы возвращались в Шале, Мине страстно рассказывала о медицинских принадлежностях."
