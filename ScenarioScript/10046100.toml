10046100-12 = "Да. Мы откроем частный пляж для всех."
10046100-13 = "И именно поэтому я пригласила сюда Школу журналистики Кроноса. Они распространят эту новость."
10046100-14 = "...Это из-за виллы?"
10046100-15 = "Какой виллы? Это никак с ней не связано. Это... общественно полезное дело."
10046100-16 = ""
10046100-18 = ""
10046100-19 = "Ичика, что ты думаешь об этом пляже?"
10046100-20 = "...Ну, он красивый! Очень чистый."
10046100-21 = "Полностью согласна. Просто дух захватывает."
10046100-22 = "И именно поэтому мы открываем к нему общественный доступ. Жаль держать такую прекрасную землю лишь для немногих привилегированных."
10046100-23 = "Да... это очень щедро."
10046100-24 = "...Но зачем для этого нужна я?"
10046100-25 = "Верно. Мне нужно попросить тебя об одолжении."
10046100-26 = "Если несложно, могла бы ты патрулировать пляж в этот начальный период?"
10046100-27 = "Патрулировать?"
10046100-28 = "Да. Сейчас сезон отпусков, так что после открытия я ожидаю огромный наплыв людей."
10046100-29 = "Где люди, там и происшествия. А если случится что-нибудь неприятное, ответственность могут возложить на Чаепитие."
10046100-30 = "Да. Поняла."
10046100-31 = "Искренне прошу прощения за такую внезапную просьбу."
10046100-32 = "О нет, не нужно. Оставьте это мне."
10046100-33 = "Хи-хи. На тебя всегда можно положиться, но, пожалуйста, не переживай."
10046100-34 = "Я склонна беспокоиться больше остальных и прекрасно понимаю, что это выходит за рамки твоих обычных обязанностей."
10046100-35 = "Так что наслаждайся отдыхом как обычная посетительница, просто, может быть, поглядывай по сторонам, пока гуляешь у берега."
