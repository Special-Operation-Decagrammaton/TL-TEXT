[translation]
10037030-1 = "Эпизод 3;Так король прощается с госпожой"
10037030-2 = ""
10037030-3 = "Хм... Мне кажется или я слышу какой-то металлический инструмент, Томоэ?"
10037030-4 = "Прошу прощения, если звук кажется резким, Великий Вождь Черино. Вы слышите традиционный музыкальный спектакль Шаньхайцзина."
10037030-5 = "Ч-Что это, госпожа Кисаки...?! Традиционный музыкальный спектакль? Хм... Понятно!"
10037030-6 = "Очень необычная мелодия."
10037030-7 = "Её почти больно слушать..."
10037030-8 = "Кто эти люди в странной одежде?"
10037030-10 = "В некотором смысле это актёры. В этом музыкальном представлении длинная история рассказывается через сценическую игру."
10037030-11 = "В Шаньхайцзине мы называем это Пекинской оперой."
10037030-12 = "Пекинская опера...?"
10037030-13 = "Представление вот-вот начнётся. Надеюсь, вам понравится."
10037030-18 = ""
10037030-21 = ""
10037030-23 = ""
10037030-24 = "Улыбки встречают весну. Слёзы омрачают мир."
10037030-26 = "Жизнь — сон весенней порой."
10037030-28 = "В горах кукует кукушка. За лилиями поднимается дым."
10037030-29 = ""
10037030-33 = "Облако остаётся в объятиях небес!"
10037030-34 = ""
10037030-37 = ""
10037030-38 = "Её голос... Такой высокий!"
10037030-39 = "Она использует особую технику, чтобы голос долетал даже до самых дальних уголков площадки."
10037030-40 = "Почему она так вращает рукой? И сама кружится на месте."
10037030-41 = "Каждое движение в Пекинской опере имеет смысл... Но объяснять каждое — плохой способ её прочувствовать."
10037030-42 = "Но несколько подсказок я могу дать. Например, движение рукой, будто она держит кнут, означает, что она едет верхом к месту назначения."
10037030-43 = "Вращение на месте означает долгое путешествие к месту назначения."
10037030-44 = "Если появляется персонаж в доспехах с флагом за спиной... это означает, что он прибыл с тысячной армией."
10037030-46 = "Хм... Было бы проще понять, если бы всё просто показывали, как в кино."
10037030-47 = "Фуфу! В давние времена такое было бы трудно воссоздать."
10037030-48 = ""
10037030-50 = ""
10037030-52 = "Я призываю союзников и поднимаюсь с равнин."
10037030-53 = "Через три года пять владык положат конец древней державе."
10037030-54 = "Небо и земля расколются надвое."
10037030-55 = "Но почему сами небеса замедляют мой путь?!"
10037030-56 = ""
10037030-58 = ""
10037030-60 = ""
10037030-61 = "Вот этот! В маске! Он был довольно крутым!"
10037030-62 = "Хм. Сейчас мы назвали бы его главным героем истории."
10037030-63 = "Сюжет будет разворачиваться вокруг этого персонажа. Советую внимательно за ним следить."
10037030-64 = ""
10037030-67 = ""
10037030-69 = "Она достала длинную палку... Понятно, копьё!"
10037030-71 = "Исход войны никогда нельзя знать наверняка."
10037030-72 = "Человек должен стойко переносить стыд и унижение."
10037030-73 = "Мир полон талантливых и способных людей."
10037030-74 = "Разве они не могут вернуться, подняв в воздух пыль и землю?"
10037030-76 = "Люди измучены бесконечными сражениями."
10037030-77 = "После поражения в Чжунъюане ход событий будет нелегко переломить."
10037030-78 = "Сколько бы талантливых союзников у тебя ни было..."
10037030-79 = "С чего им поднимать пыль и идти к тебе?"
10037030-81 = "Что они говорят?! Им стоит следить за языком!"
10037030-82 = "Я бы их всех отправила на чистку!"
10037030-84 = "К-Кхм...! Иногда упрёк — это тоже проявление верности, разве нет...?"
10037030-85 = "Не знаю насчёт этого! Я бы отправила их всех мыть туалеты без окон!"
10037030-86 = "(Она как-то слишком легко говорит о так называемых чистках. Так диктатор Красной Зимы принимает решения?)"
10037030-87 = ""
10037030-89 = ""
10037030-91 = "Сила двигает горы, а дух охватывает весь мир."
10037030-92 = "Но удача отвернулась от меня, и конь упрямо стоит на месте."
10037030-93 = "Что мне делать, если даже мой конь не желает двигаться?"
10037030-94 = ""
10037030-98 = "Любимая моя, любимая. Что же мне делать?"
10037030-99 = "Враг завладел всем."
10037030-100 = "Издалека со всех сторон до меня доносятся песни."
10037030-101 = "Если твой дух угаснет..."
10037030-102 = "Как мне тогда жить дальше?"
10037030-103 = ""
10037030-105 = ""
10037030-107 = ""
10037030-108 = "Ч-Что? Что они делают? Она отвлекла главного героя и забрала его меч."
10037030-109 = "Постойте — она собирается обратить его против себя?! Нет! Они должны жить дальше вместе! Что будет со всеми, кого они оставят?!"
10037030-111 = "Угх... Все солдаты разбегаются... Он остался совсем один..."
10037030-112 = "И всё же за ним стоят тысячи вражеских солдат..."
10037030-114 = "Ты хочешь использовать мой ум, чтобы завладеть горами золота и землями."
10037030-115 = ""
10037030-117 = ""
10037030-118 = "Я дарую тебе эту последнюю милость!"
10037030-119 = ""
10037030-125 = "Что?!"
10037030-126 = "*шмыгает носом* Не может быть... Он был таким смелым и благородным..."
10037030-127 = "Смелости и благородства недостаточно, чтобы править миром, а одной храбростью невозможно по-настоящему завоевать сердца людей."
10037030-128 = "Таков небесный порядок. Нам остаётся лишь делать всё, что в наших силах, и сохранять скромность."
10037030-129 = "Это-то я понимаю! Но, но..."
10037030-130 = "Не могу поверить, что меня так тронуло. Признаю, постановка была великолепной!"
10037030-131 = "Рада видеть, что вы остались довольны."
10037030-134 = "Теперь, Великий Вождь Черино, следующим пунктом программы—"
10037030-135 = "Перед этим! От имени лидера Федеральной Академии Красной Зимы у меня есть просьба!"
10037030-136 = ""
10037030-138 = ""
10037030-139 = "(Официальная просьба как лидера...? Она уже хочет отплатить за «пышный приём»? Нет... Сейчас делать это было бы неразумно.)"
10037030-140 = "(Пока я выслушаю её просьбу. Учитывая обстоятельства, я не могу разумно ей отказать.)"
10037030-141 = "(Во всяком случае, это даст возможность заглянуть в карты, которые Красная Зима так старательно держит у груди.)"
10037030-142 = "Что именно? Как президент Генрюмона, я сделаю всё, что в моих силах, чтобы исполнить вашу просьбу."
10037030-143 = "Это... насчёт только что прошедшего представления!"
10037030-144 = "Пекинской оперы?"
10037030-145 = "Да, её! Пекинской оперы!"
10037030-146 = "Позовите обратно студента, который играла главного героя!"
10037030-147 = "Вы имеете в виду Кагую...? Зачем...?"
10037030-148 = "Так её зовут Кагуя... Понятно! Я просто хотела с ней поговорить!"
10037030-149 = "(Хм... Всё становится всё загадочнее... Нельзя исключать, что это какая-то психологическая игра...)"
10037030-151 = "Похоже, Великому Вождю действительно очень понравилась Пекинская опера. Если это не слишком затруднит вас, госпожа, могли бы вы помочь нам?"
10037030-152 = ""
10037030-155 = ""
10037030-156 = "Хорошо. Мина. Если не затруднит."
10037030-157 = "Да, госпожа Президент."
10037030-158 = ""
10037030-160 = ""
10037030-164 = ""
10037030-165 = "Я явилась на ваш зов, госпожа. Я, Урусибара Кагуя, приветствую вас! Я пришла так быстро, как могла!"
10037030-167 = "А, вот и она. Позвольте представить. Великий Вождь Черино, это Кагуя, исполнительница, с которой вы хотели встретиться. Она возглавляет Клуб Пекинской Оперы."
10037030-168 = "Кагуя. Это Великий Вождь Черино, президент студенческого совета Красной Зимы. Благодарю за работу, которую ты вложила в эту встречу по обмену."
10037030-170 = "Для меня честь, Великий Вождь Черино! Я глубоко благодарна, что вам понравилось наше представление. Большего я и желать не могла!"
10037030-171 = "О-Ох... На сцене она была такой грозной, а сейчас совсем другая!"
10037030-172 = "Приму это как комплимент! Нам, студентам, часто приходится изображать персонажей, совершенно не похожих на нас самих."
10037030-173 = "Иногда настолько, что мы сами начинаем путаться, где заканчивается персонаж и начинается студент!"
10037030-174 = "Понятно! В чём-то это звучит удобно... а в чём-то ужасно хлопотно!"
10037030-175 = "Какое проницательное наблюдение! Впечатляет!"
10037030-176 = ""
10037030-178 = ""
10037030-181 = ""
10037030-182 = "Что ж, госпожа. Давайте перейдём к сути."
10037030-183 = ""
10037030-186 = ""
10037030-187 = "(Хм...? Великий Вождь Черино, вы доверяете переговоры этой... Томоэ? Мне нужно больше узнать о структуре командования Красной Зимы.)"
10037030-188 = "(А если нет... Возможно ли, что она настолько выдающийся лидер, что способна управлять, даже пальцем не шевеля?!)"
10037030-189 = "(...Пока что мне нужно продолжать разговор с ней.)"
10037030-190 = ""
10037030-192 = ""
10037030-193 = "Как пожелаете, Главный секретарь Томоэ."
10037030-196 = "Бяньлянь? Что это?"
10037030-197 = "Это техника, уникальная для Сычуаньской оперы. Проще говоря, способность менять маски под ситуацию, не касаясь лица!"
10037030-198 = "Звучит очень круто! Потрясающе!"
10037030-199 = "Три главных театральных направления Шаньхайцзина — Пекинская опера, Сычуаньская опера и Куньцюй. Их объединяет одно... Исполнители каждого должны изучать боевые искусства!"
10037030-200 = "Боевые искусства...? Для сценического представления?"
10037030-201 = "Странно, правда? Но это так. В Пекинской опере, которую вы только что видели, наши участницы демонстрировали впечатляющее владение копьём."
10037030-202 = "Хм... Это больше походило на художественное мастерство, чем на реально применимое боевое искусство!"
10037030-203 = "Логично...!"
10037030-204 = ""
10037030-206 = ""
10037030-208 = "Мы не можем выразить, насколько благодарны Академии Шаньхайцзин, известной своей осторожностью в открытии дверей, за то, что она протянула руку Федеральной Академии Красной Зимы."
10037030-209 = "Но в то же время должна быть серьёзная причина, по которой вы именно сейчас открыли нам тяжёлые двери Шаньхайцзина и Генрюмона, разве нет?"
10037030-210 = "Я хотела бы поправить лишь две вещи. Во-первых, двери Шаньхайцзина не так уж тяжелы, как вы думаете. В конце концов, кулинарное мастерство Променада Чёрной Черепахи уже хорошо известно по всему Кивотосу."
10037030-211 = "Во-вторых, Генрюмон и раньше принимал посторонних. Как вы уже знаете, Сенсей — один из таких примеров."
10037030-212 = "[s1] «Да. Хотя я почти не двигался...»\n[s2] «Я прямо здесь! На случай, если вы обо мне забыли...»"
10037030-215 = "Хи-хи! Конечно, Сенсей. Немного жаль. При других обстоятельствах я бы нашла другой способ приятно провести с вами время."
10037030-216 = "Фуфу! Вот тут мы согласны! Надеюсь, вы не слишком расстроены, Сенсей."
10037030-217 = "[s3] «Я в порядке, в порядке...»\n[s4] «Не обращайте на меня внимания. Пожалуйста, продолжайте.»"
10037030-220 = "Ох! Благодаря вам я получаю совершенно новый опыт, госпожа."
10037030-221 = "Рада это слышать. Но я понимаю, что как бы мы ни старались, здесь всё равно не будет так же привычно и удобно, как в вашей собственной школе. Прошу отнестись к этому с пониманием."
10037030-222 = "И всё же я ожидала, что госпожа Кисаки обратится с какой-нибудь просьбой во время этой встречи."
10037030-223 = "Прошу простить, если это прозвучит... невежливо."
10037030-224 = "Вовсе нет. Скорее я должна поблагодарить вас за возможность говорить прямо."
10037030-225 = "Отвечая на ваш вопрос... У меня нет таких намерений."
10037030-226 = ""
10037030-228 = ""
10037030-229 = "Президент...?"
10037030-230 = "Рискуя снова сказать лишнее... Я бы предпочла не ходить вокруг да около, пытаясь угадать истинные намерения Генрюмона и его президента."
10037030-231 = "Именно поэтому я отправила председателя Марину прочь и попросила предоставить нам личное пространство для разговора."
10037030-233 = "Да. По той же причине я отправила прочь своего исполнительного офицера Мину. Я хочу ясно показать, что мне нечего от вас скрывать."
10037030-234 = "[s5] «Да, привет. Простите, что вмешиваюсь...»\n[s6] «Сейчас... Кисаки говорит как президент студенческого совета.»"
10037030-237 = "Спасибо за своевременный совет, Сенсей."
10037030-238 = "Повторю: я ничего от вас не жду. Мне не нужно, чтобы вы что-либо делали, и я не намерена использовать вас для достижения собственных целей."
10037030-240 = "Тогда зачем вообще проводить эту встречу по обмену...?"
10037030-241 = ""
10037030-244 = ""
10037030-245 = "Вас бы не устроил ответ, что я просто хотела показать вам Шаньхайцзин?"
10037030-246 = "Я бы не осмелилась назвать это неудовлетворительным ответом, но и полностью удовлетворительным тоже не назову."
10037030-247 = "Если вы так чувствуете, значит, я объяснила недостаточно."
10037030-248 = "...Вы хотите сказать, что говорите серьёзно?"
10037030-249 = "Да. Если бы у меня было одно желание, я бы хотела, чтобы вы исследовали каждый уголок этого места и по-настоящему узнали Шаньхайцзин."
10037030-250 = "Что вы имеете в виду под «по-настоящему узнать Шаньхайцзин»...?"
10037030-251 = "Фуфу! А вот вокруг этой темы я как раз хотела бы немного походить кругами!"
10037030-252 = "Ох! Вы сумели обратить мои же слова против меня!"
10037030-253 = "Вовсе нет. Здесь, в Шаньхайцзине, отплатить добром за добро — один из важнейших наших принципов."
10037030-254 = "Хи-хи-хи! Понятно."
10037030-255 = "Фуфу! Именно!"
10037030-256 = ""
10037030-258 = ""
10037030-260 = "Вы правда можете выплёвывать огонь изо рта?!"
10037030-261 = "Да! Это техника огненного дыхания. Чем темнее сцена, тем эффектнее она выглядит! И у нас есть немало трюков, чтобы затемнить сцену—!"
10037030-262 = "В Шаньхайцзине и правда столько секретов!"
10037030-263 = "Думаете? Ну, знаете, как говорят... Чем длиннее история, тем больше тайн!"
10037030-265 = "Ещё раз спасибо за тёплый приём, госпожа."
10037030-266 = "Мм! Было очень приятно! Я отлично повеселилась. А главное — мне не пришлось переживать из-за государственного переворота!"
10037030-268 = "Фуфу! Рада это слышать. Надеюсь, вы продолжите наслаждаться Шаньхайцзином."
10037030-269 = "И... вот тут пригодятся ваши способности, Сенсей."
10037030-270 = "[s] «А? Я?»"
10037030-271 = "Да. Я знаю, что могу вам доверять, и, похоже, вы уже знакомы с нашими гостями из Красной Зимы."
10037030-272 = "Я отправлю Мину с вами в качестве сопровождения."
10037030-273 = "[s] «А ты с нами не пойдёшь?»"
10037030-274 = "...Хм. Понимаю, что это невежливо, но боюсь, мне придётся остаться."
10037030-275 = "Можно спросить почему, госпожа?"
10037030-276 = "Простите. Всё, что я могу сказать, — есть обстоятельства, которых нельзя избежать."
10037030-277 = "...Понятно. Тогда мы доверимся исполнительному офицеру Мине и Сенсею."
10037030-279 = "О, товарищ будет с нами? Так даже лучше! Товарищ, это и для тебя первый раз в Шаньхайцзине?"
10037030-280 = "[s] «Если совсем строго... это не первый мой раз?»"
10037030-281 = "Но, как и я, ты ведь мало знаешь о Шаньхайцзине, да?"
10037030-282 = "Тогда нужно воспользоваться возможностью и увидеть и попробовать всё!"
10037030-283 = ""
10037030-285 = ""
10037030-286 = "[ns] «Помедленнее! Ещё споткнёшься.»"
10037030-287 = ""
10037030-290 = ""
10037030-291 = "Если позволите, госпожа. Великий Вождь."
10037030-292 = "Да, хорошая работа сегодня, Кагуя."
10037030-294 = "А...? Кагуя не пойдёт с нами?"
10037030-295 = "Ха-ха-ха. Боюсь, зовёт долг. Прошу, не расстраивайтесь слишком сильно. Если хотите, можете заглянуть в комнату Клуба Пекинской Оперы."
10037030-297 = "Понятно... Если ты занята, ничего не поделаешь! Я тебя прощаю!"
10037030-298 = "Спасибо, Великий Вождь."
10037030-306 = ""
10037030-307 = "..."
10037030-309 = "Президент остаётся в Риккагаку, а Красная Зима отправляется в Шаньхайцзин..."
10037030-310 = "«Если бы у меня было одно желание, я бы хотела, чтобы вы исследовали каждый уголок этого места и по-настоящему узнали Шаньхайцзин». Хм..."
10037030-311 = ""
