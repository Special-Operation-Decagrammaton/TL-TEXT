[translation]
1002403-1 = "Мой личный болельщик"
1002403-2 = "Вскоре после сообщения Широко я отправился на прибрежную дорогу, о которой она мне рассказывала."
1002403-3 = "Вдалеке я увидел, как она размеренно приближается на велосипеде."
1002403-4 = "...?!"
1002403-5 = "Сенсей?"
1002403-6 = "Как ты сюда добрался?"
1002403-7 = "[s1] «Я хотел проверить, как ты.»\n[s2] Помахать рукой."
1002403-8 = "Сенсей..."
1002403-9 = "Сенсей..."
1002403-10 = "О, а что это у тебя? Энергетик?"
1002403-11 = "И полотенце тоже. Ты принёс всё это для меня?"
1002403-12 = "Тебе правда не стоило..."
1002403-13 = "Ничего страшного. Спасибо. И то и другое мне пригодится."
1002403-14 = "Эм..."
1002403-15 = "Неважно. Хм..."
1002403-16 = "Ты всё это время переживал за меня, Сенсей?"
1002403-17 = "Нет?"
1002403-18 = "Но ты проделал весь этот путь только ради того, чтобы принести мне напиток и полотенце."
1002403-19 = "[s] «Считай, что я твой болельщик.»"
1002403-20 = "...!"
1002403-21 = "Болельщик..."
1002403-22 = "Ты мой..."
1002403-23 = "...болельщик в велопутешествии."
1002403-24 = "[s] «Широко?»"
1002403-25 = ""
1002403-28 = "― Спасибо, Сенсей.[wa:1870]"
1002403-31 = "― Эм, я не знаю, что сказать, но...[wa:2470]"
1002403-33 = "― Меня никогда раньше так не поддерживали...[wa:3040]"
1002403-36 = "― Сенсей, когда я рядом с тобой...[wa:960]"
1002403-38 = "― каждый день происходит что-то новое.[wa:1070]"
1002403-41 = "― (Хм? Что происходит? Моё сердце никак не успокоится...)[wa:3930]"
1002403-44 = "― Странно. Это тоже совершенно новый для меня опыт...[wa:3280]"
1002403-46 = ""
1002403-47 = "Спасибо, Сенсей. Я обязательно отплачу тебе за доброту позже."
1002403-48 = "Полотенце..."
1002403-49 = "Ты хочешь, чтобы я воспользовалась тем, которое ты принёс? Я не против..."
1002403-50 = "...но тогда ты вернёшься с использованным полотенцем и пустой бутылкой. Необязательно..."
1002403-51 = "[s] «Здесь звезда — ты. Я всего лишь болельщик.»"
1002403-52 = ""
1002403-54 = ""
1002403-55 = "Хорошо. Если ты настаиваешь."
1002403-56 = "После этого я чувствую себя гораздо бодрее. Буду двигаться дальше, пока не завершу путешествие."
1002403-57 = "Потому что теперь..."
1002403-58 = "...у меня есть собственный личный болельщик."
1002403-60 = "Широко дала мне копию своей карты маршрута, после чего я вернулся в Шале."
