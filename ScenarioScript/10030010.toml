[translation]
10030010-1 = "Эпизод 1;Неожиданный поход"
10030010-2 = "Центральная площадь, Учебный центр Миллениума"
10030010-5 = "Уф... Вставать рано в выходной — хуже всего..."
10030010-6 = ""
10030010-7 = "Согласна. Тратить драгоценный выходной, таскаясь по сельской местности... особенно когда в последний день года можно записать столько праздничных звуков... Это всё равно что тратить премиальную валюту на обычный дроп..."
10030010-8 = "Обычно я в это время ещё сплю... От такого раннего подъёма у меня голова болит..."
10030010-9 = ""
10030010-12 = ""
10030010-14 = "[ns] «...Но хотя бы все пришли вовремя.»"
10030010-15 = ""
10030010-17 = ""
10030010-18 = "А? [USERNAME] Сенсей?"
10030010-19 = "Что привело вас в Миллениум так рано?"
10030010-20 = "[s1] «Чихиро сказала, что вы идёте в поход.»\n[s2] «Я подумал, что вам может пригодиться сопровождающий в дикой местности.»"
10030010-23 = "[ns] «Надеюсь, я не помешаю.»"
10030010-24 = "Вовсе нет! Вам всегда рады, Сенсей!"
10030010-26 = "Возможно, день всё-таки не пропадёт зря, если я смогу весь день слушать голос [USERNAME] Сенсея..."
10030010-27 = "Я не уделила внимания одежде, потому что думала, что это просто поездка клуба... Надо было надеть что-нибудь получше."
10030010-29 = "Ага. Я бы надела что-нибудь гораздо ярче, если бы знала, что Сенсей будет здесь."
10030010-30 = "...Как член Веритас, я определённо должна была получить эту критически важную информацию о миссии."
10030010-31 = "[s3] «По-моему, ваша зимняя одежда выглядит отлично!»\n[s4] «Вы одеты как надо!»"
10030010-34 = "Ну, если Сенсей так говорит..."
10030010-35 = "Но где Чихиро? Это ведь она нас сюда позвала."
10030010-36 = "Если она явится в тщательно подобранном наряде, хотя нам велела одеться попроще—"
10030010-37 = ""
10030010-43 = ""
10030010-44 = "Слава богу, все на месте. Не придётся никого искать."
10030010-45 = ""
10030010-48 = ""
10030010-49 = "Чихиро... Ну и наряд..."
10030010-50 = "...Тщательно подобранный, но в другом смысле."
10030010-51 = "Ха-ха! Что на тебе надето? Ты выглядишь так, будто собралась в поход!"
10030010-53 = "Но мы и собрались. В поход, я имею в виду."
10030010-54 = "...Разве я вам не сказала?"
10030010-55 = ""
10030010-57 = ""
10030010-58 = ""
10030010-59 = "В поход?!"
10030010-61 = "Я бы не стала звать всех сегодня утром только ради того, чтобы посмотреть завтрашний рассвет."
10030010-64 = "Сегодня мы отправимся в Альпы Хигаси, на окраине района Миллениума."
10030010-65 = "Самая высокая вершина обращена на восток и славится видом на рассвет. Но чтобы добраться до подножия горы, нужно пересечь огромную равнину и бурную реку, поэтому туристов там немного."
10030010-68 = "Мы разобьём лагерь у подножия горы, переночуем и начнём подъём до рассвета, чтобы встретить его на вершине."
10030010-69 = "Проведя время вдали от благ цивилизации, возможно, вы поймёте, что и за пределами экранов есть множество вещей, которыми можно наслаждаться."
10030010-70 = ""
10030010-72 = ""
10030010-74 = ""
10030010-75 = "А! Я забыла, у меня вообще-то срочная встреча!"
10030010-76 = "О нет, у меня снова обострился хронический дефицит кофеина..."
10030010-77 = "Я только что получила экстренный сигнал с важнейшей прослушки, которую установила раньше—"
10030010-79 = "Нет. Как я уже сказала, это приказ вице-президента, и никаких отговорок я не приму."
10030010-80 = "Я также получила разрешение Химари. Так что сегодня все вы должны меня слушаться."
10030010-82 = ""
10030010-83 = "Н-Нечестно! Дьявол! Диктатор!"
10030010-84 = "Мы наблюдаем рождение новой Старшей Сестры Миллениума..."
10030010-85 = "Сенсей... помогите..."
10030010-86 = "[s] «Даже если вы так на меня смотрите...»"
10030010-87 = ""
10030010-89 = ""
10030010-90 = "[ns5] «Этот опыт пойдёт вам на пользу.»\n[ns6] «Я буду рядом, так что просто постарайтесь.»"
10030010-91 = ""
10030010-92 = ""
10030010-94 = ""
10030010-95 = "Если Сенсей так говорит..."
10030010-96 = "Я как-нибудь справлюсь, если это всего на день."
10030010-97 = "Я пойду куда угодно, лишь бы можно было записывать голос Сенсея."
10030010-99 = "А теперь, прежде чем отправиться..."
10030010-100 = ""
10030010-103 = ""
10030010-104 = "Нам нужно проверить ваши сумки."
10030010-105 = ""
10030010-107 = ""
10030010-108 = "Проверить сумки? Что не так с нашими сумками?!"
10030010-109 = "Мы же не в начальной школе... Ты ведь не скажешь, что можно брать только сладости дешевле 500 иен... правда?"
10030010-111 = "Сладости можно, но любые электронные устройства, не связанные с походом, строго запрещены."
10030010-112 = "Так что если какие-то электронные устройства совершенно случайно оказались в ваших сумках, перед выходом придётся оставить их в академии."
10030010-113 = "Почему?!"
10030010-114 = "Я же говорила — цель этого похода в том, чтобы провести время на природе, вдали от цивилизации."
10030010-115 = "Если вы возьмёте с собой кучу портативной электроники, то просто будете заниматься тем же самым, только в другом месте."
10030010-116 = "Так что берите только то снаряжение, которое действительно нужно в походе!"
10030010-117 = "Эм... Мне тоже придётся оставить телефон?"
10030010-118 = "Мобильный можно взять на случай чрезвычайной ситуации, но толку от него будет немного."
10030010-119 = "Не думаю, что в горах будет нормальный сигнал."
10030010-120 = "Угх..."
10030010-121 = "Так, начнём с Маки. Дай мне свою сумку."
10030010-122 = ""
10030010-124 = ""
10030010-125 = "Посмотрим. Это..."
10030010-126 = ""
10030010-128 = ""
10030010-129 = "...Солнечная электростанция?"
10030010-131 = "Эм, это..."
10030010-132 = "Б-Было бы огромной проблемой, если бы телефон разрядился именно тогда, когда понадобится вызвать помощь!"
10030010-133 = "Если у нас будет электростанция на солнечной энергии, мы сможем заряжать телефоны когда угодно!"
10030010-134 = "...Обычного пауэрбанка хватило бы. И весит он гораздо меньше."
10030010-135 = "Для нашего походного оборудования электростанция нам не нужна."
10030010-136 = ""
10030010-138 = ""
10030010-139 = "А это..."
10030010-140 = "...Портативная параболическая антенна?"
10030010-141 = "О-Она нужна, чтобы подать сигнал бедствия, если мы вдруг потеряемся."
10030010-142 = "Обычная антенна не сможет принимать сигнал в настолько удалённом месте..."
10030010-143 = "Мы не будем настолько далеко, чтобы нам понадобилась направленная антенна! И я уже передала маршрут похода, так что поисковая группа будет знать, где нас искать!"
10030010-144 = "Как ни называй, это антенна для подключения к интернету!"
10030010-145 = "А вот здесь..."
10030010-146 = ""
10030010-148 = ""
10030010-149 = "...NAS-сервер?"
10030010-150 = ""
10030010-152 = ""
10030010-154 = "Вы правда планировали развернуть временный коммуникационный узел прямо в лагере?!"
10030010-155 = ""
10030010-158 = ""
10030010-159 = "Просто... Мы правда собираемся прожить без интернета больше суток?"
10030010-160 = "Знаешь, сейчас ведь даже можно вести образ жизни цифрового кочевника..."
10030010-161 = "Можно хотя бы взять несколько устройств с доступом в интернет?"
10030010-163 = "Категорически нет. Оставьте всю электронику, которую принесли, в клубной комнате. Всю до единой."
10030010-164 = "Как я уже сказала, эта поездка — крайняя мера, чтобы уменьшить вашу зависимость от интернета—"
10030010-165 = "Забудьте обо всём, что происходит за пределами лагеря, и наслаждайтесь отдыхом."
10030010-167 = ""
10030010-168 = "Отдыхать без интернета — это абсурд..."
10030010-169 = "Наверное, именно так чувствует себя человек, застрявший на необитаемом острове..."
10030010-170 = "Как ты можешь запрещать мне аппаратуру для записи высокой чёткости, когда у меня наконец появилась возможность провести целый день с Сенсеем..."
10030010-172 = ""
10030010-173 = "Мы взяли всё оборудование для готовки, припасы, зимнее снаряжение и нашу общую палатку..."
10030010-174 = "Думаю, у нас есть всё необходимое для похода!"
10030010-175 = ""
10030010-177 = ""
10030010-179 = "Так что взбодритесь и вперёд!"
10030010-180 = "[s] «Ура-а—»"
10030010-182 = ""
10030010-183 = "Бу-у..."
