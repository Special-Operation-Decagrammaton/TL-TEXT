[translation]
2001406-1 = "Полная готовность"
2001406-2 = "Гора за парком Коусаги"
2001406-3 = "Я возвращался с горного поста с припасами для лагеря."
2001406-4 = "Неплохая добыча."
2001406-5 = "От дождевиков, которыми можно заменить брезент, до винтовочных патронов 7,62 мм…"
2001406-6 = "И состояние у них неплохое. Сэкономим ещё немного денег."
2001406-7 = "Сенсей, что вы там делаете?"
2001406-8 = "Здесь нет указателей, поэтому легко сбиться с тропы."
2001406-9 = "Если не будете держаться рядом со мной, снова потеряетесь, как в прошлый раз."
2001406-10 = "[s] «Разве в прошлый раз заблудилась не ты?»"
2001406-11 = "Э-Это другое!"
2001406-12 = "С тех пор я очень много тренировалась читать карты и изучала географию этого района."
2001406-13 = "И к тому же теперь у меня есть смартфон с GPS, так что мы точно не заблудимся!"
2001406-14 = "В любом случае скоро стемнеет, так что возвращаемся в парк."
2001406-15 = ""
2001406-17 = ""
2001406-19 = "[ns] *тяжёлое дыхание*"
2001406-20 = "Сенсей? Почему вы так идёте?"
2001406-21 = "Вы в порядке?"
2001406-22 = "Вы где-то поранились?"
2001406-23 = "[s1] «Лямки впиваются мне в плечи.»\n[s2] «Из-за боли я всё время сжимаю плечи.»"
2001406-24 = ""
2001406-25 = ""
2001406-27 = ""
2001406-28 = "Сядьте, Сенсей."
2001406-29 = "Поставьте мешок. Приподнимите рубашку и покажите плечо."
2001406-30 = "[s3] «Снять рубашку? Здесь?»\n[s4] «Это немного неловко.»"
2001406-31 = "Хватит дурачиться. Быстрее!"
2001406-32 = "Не тупите! Скорее!"
2001406-33 = ""
2001406-35 = ""
2001406-36 = ""
2001406-37 = "У вас на плече волдыри."
2001406-38 = "Сенсей, вы раньше никогда не носили тяжёлый рюкзак в походе, верно?"
2001406-39 = "Такие волдыри появляются, если нести очень тяжёлый рюкзак без защиты. На плечо приходится слишком большая нагрузка."
2001406-40 = "Поэтому я и говорила вам надеть что-нибудь плотное."
2001406-41 = "[s] «Я думал, что всё будет нормально, ведь так жарко.»"
2001406-42 = "В жару кожа становится мягче, так что это тоже нужно учитывать."
2001406-43 = "Вы что, не читали полевой устав, который я вам дала?"
2001406-44 = "У вас есть что-нибудь, что можно надеть поверх рубашки?"
2001406-45 = "Если нет, может, выложим часть вещей из мешка."
2001406-46 = "[s5] «Это моя вина, так что не переживай.»\n[s6] «Я сам взялся нести этот мешок.»"
2001406-47 = "Мне стоило заранее подумать и взять для вас подходящее снаряжение..."
2001406-48 = "Мне стоило заранее подумать и взять для вас подходящее снаряжение..."
2001406-49 = "...Ладно, хорошо."
2001406-50 = ""
2001406-52 = ""
2001406-53 = "Вот, возьмите."
2001406-54 = "Это наплечники. Подложите их под лямки — станет легче."
2001406-55 = "[s] «Разве ты сама их не носила, Саки?»"
2001406-56 = "Ну, технически да!"
2001406-57 = "Но вашим плечам с ними будет гораздо лучше. Надо было взять запасные..."
2001406-58 = "Я привыкла носить тяжёлую броню благодаря тренировкам SRT. Не волнуйтесь."
2001406-59 = "[s] «Спасибо, Саки.»"
2001406-60 = ""
2001406-63 = "[ns] Поднести их к лицу, чтобы рассмотреть поближе."
2001406-65 = "Ч-Ч-Что вы делаете?"
2001406-66 = "Вы только что их понюхали?"
2001406-67 = "Я знаю, что они пропотели, ясно?!"
2001406-68 = "Немедленно отдайте!"
2001406-69 = "[s] «Я просто смотрел!»"
2001406-70 = ""
2001406-73 = "А ну вернитесь! Отдайте их мне!"
2001406-75 = "Благодаря наплечникам Саки я без боли добрался до лагеря."
2001406-76 = ""
2001406-79 = "Но когда Саки наконец меня догнала, она хорошенько меня отделала."
