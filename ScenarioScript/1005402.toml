[translation]
1005402-1 = "Непривычная форма"
1005402-2 = "Ризница собора Тринити"
1005402-3 = "Как и обещал, я пришёл в собор Тринити, чтобы дать Мари совет."
1005402-4 = "Было ещё рано, и ризница за собором стояла тихой и неподвижной."
1005402-5 = ""
1005402-11 = "С-Сенсей? Это ты?"
1005402-12 = "О-О, я не хотела тебя пугать! Это всего лишь я! Иочи Мари! Простите, что прячусь, но у меня есть веская причина..."
1005402-14 = "[ns1] «...Мари?»\n[ns2] «Ты в порядке? Почему прячешься?»"
1005402-17 = "О."
1005402-18 = "С-Сенсей. Это правда ты. Хорошо."
1005402-19 = "П-Пожалуйста, подожди секунду."
1005402-20 = ""
1005402-25 = ""
1005402-26 = ""
1005402-27 = ""
1005402-28 = "Ну... вот и я. Привет, Сенсей..."
1005402-29 = "Спасибо, что пришёл ко мне так быстро."
1005402-30 = "[s3] «Мари, что за спортивная форма...?»\n[s4] «Непривычный для тебя образ.»"
1005402-33 = "Д-Да. Позволь объяснить."
1005402-34 = "Возможно, ты слышал, что скоро спортивный праздник? Несколько сестёр решили участвовать..."
1005402-35 = "И... эм... я подумала тоже пойти, но..."
1005402-36 = "Видишь ли, я не очень спортивная, и меня беспокоит в-вот это..."
1005402-37 = "[s5] «Это...?»\n[s6] «Ты про спортивную форму?»"
1005402-40 = "Ну... эм..."
1005402-41 = "Да. Моя спортивная форма..."
1005402-42 = "Прости. Знаю, я странно себя веду... но никак не могу к ней привыкнуть."
1005402-43 = "Даже здесь, в пустой комнате, мне кажется, что эта форма слишком открывает ноги... Как же мне носить её... перед людьми?"
1005402-44 = "И без вуали я чувствую, будто чего-то не хватает..."
1005402-45 = "О! Не пойми меня неправильно. Я не думаю, что носить такое неправильно или что мне не идёт. П-Просто я к этому не привыкла..."
1005402-46 = "И я не думаю, что мне это подходит, потому что я совсем не спортивная...! Вот что я хотела сказать!"
1005402-47 = "И, эм, учитывая всё это... Разве я не стану просто обузой для команды?"
1005402-48 = "Думаю..."
1005402-49 = ""
1005402-51 = ""
1005402-52 = "Вместо участия в соревнованиях мне, наверное, лучше прийти в обычном монашеском облачении."
1005402-53 = "Так я смогу помогать людям, когда им понадобится помощь. Разве это не лучше?"
1005402-54 = "Вот об этом я всё и думала. Но решение слишком давило на меня, поэтому я захотела обсудить это с тобой."
1005402-55 = "А?"
1005402-56 = "Ты думаешь, спортивная форма... мне правда идёт...?"
1005402-57 = "П-Правда? Хаха, ну... Спасибо."
1005402-58 = "...Хм? Меня пугает само участие... или я просто не хочу участвовать?"
1005402-59 = "Эм... Нет. Не то чтобы я совсем не хотела..."
1005402-60 = "Точно не поэтому. Просто я никогда не участвовала в таком большом событии..."
1005402-61 = "Ну, иногда я играю в настольный теннис с другими сёстрами в соборе."
1005402-62 = "...Хотя всегда проигрываю. Не понимаю, почему они все так хорошо играют."
1005402-63 = "Но всё равно весело. Все относятся ко мне по-доброму, и мы отлично ладим."
1005402-64 = "Но это совсем другое! Там просто маленькое занятие в соборе, а здесь... настоящий спорт."
1005402-65 = "...Хм?"
1005402-66 = "Надевала ли я спортивную форму, когда играла в настольный теннис?"
1005402-67 = "О... Нет, честно говоря... я слишком стеснялась. Всегда играю в обычном облачении."
1005402-68 = "Вообще-то это мой первый раз в спортивной форме. Значит, ты ещё и первый, кто её увидел. Хаха..."
1005402-69 = "[s7] «Разве настольный теннис не требует отличной координации?»\n[s8] «Мари, возможно, ты спортивнее, чем думаешь!»"
1005402-72 = "Что вы имеете в виду...?"
1005402-73 = "Что?"
1005402-74 = "Если я действительно не против участия, мне стоит хотя бы попробовать? Ты так думаешь? Эм..."
1005402-75 = "М-Может, и правда? И мне стоит надеть... эту форму?"
1005402-76 = "...Ты думаешь, в монашеском облачении я выделялась бы гораздо сильнее?"
1005402-77 = ""
1005402-79 = ""
1005402-80 = "А..."
1005402-81 = "Да, в этом есть смысл."
1005402-82 = "Спасибо, Сенсей. Без тебя я могла бы совершить большую ошибку."
1005402-83 = "Я раньше не замечала, но спортивная форма у всех и правда очень похожа. В обычной одежде я бы точно выглядела не к месту."
1005402-84 = "Я всё ещё немного переживаю из-за ног и волос, но..."
1005402-85 = "После разговора с тобой мне стало намного спокойнее."
1005402-86 = "Т-Тогда... я сообщу организаторам, что всё-таки буду участвовать."
1005402-87 = ""
1005402-89 = ""
1005402-91 = "О!"
1005402-92 = ""
1005402-94 = ""
1005402-95 = "Ты... тоже будешь участвовать в спортивном празднике?"
1005402-96 = "...А, точно, конечно. Хаха, логично, что ты не будешь участвовать в самих соревнованиях."
1005402-97 = "Но я рада знать, что ты там будешь."
1005402-98 = ""
1005402-100 = ""
1005402-101 = "Спасибо, Сенсей. Обсудить с тобой мои переживания очень помогло."
1005402-102 = "Думаю, я бы пожалела, если бы не участвовала."
1005402-103 = "...Хи-хи. Это была бы большая ошибка!"
1005402-104 = "Что ж, тогда увидимся, Сенсей!"
1005402-106 = "Мари выглядела неожиданно бодрой и весёлой, провожая меня обратно в Шале."
