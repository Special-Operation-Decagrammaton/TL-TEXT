[translation]
1010405-1 = "Входит..."
1010405-2 = "Главный ресторан Променада Чёрной Черепахи"
1010405-4 = "Что происходит с Променадом Чёрной Черепахи?! Член Гэнрюмона лично приходит сюда с проверкой, а ей даже чай не подают?"
1010405-5 = "Или, только не говорите, вы снова пытаетесь устроить ловушку для уважаемого инспектора? Я не забыла прошлый раз!"
1010405-6 = "Если подобное повторится, последствия будут серьёзными!"
1010405-7 = ""
1010405-9 = "...Для начала я хотела бы искренне извиниться за тот неприятный инцидент."
1010405-10 = "И конечно, мы можем подать вам чай. Но вы уверены, что это хорошая идея?"
1010405-11 = "Что вы имеете в виду?"
1010405-12 = "Если мы будем кипятить чай, придётся использовать посуду, подготовленную для санитарной проверки."
1010405-13 = "Тогда вам придётся начинать проверку заново или вообще переносить её."
1010405-14 = "...!"
1010405-15 = "Л-Ладно. Я занята, так что у меня всё равно нет времени на ваш дурацкий чай."
1010405-16 = "Я раскрою каждый грязный секрет, который скрывает Променад Чёрной Черепахи!"
1010405-17 = ""
1010405-19 = ""
1010405-20 = "[ns] «Эм... Это ведь плохо, Рэйдзё...?»"
1010405-21 = "Они просто ищут, к чему придраться."
1010405-22 = "Что бы мы ни сказали и ни сделали, инспектор будет цепляться к каждой мелочи."
1010405-23 = "Для начала — личная гигиена! Покажите руки!"
1010405-24 = "Вот. Все, покажите руки."
1010405-25 = ""
1010405-27 = ""
1010405-28 = "...Да. Смотрите сколько хотите."
1010405-30 = "...Чистые. И ногти аккуратно подстрижены."
1010405-31 = "Перчатки для готовки на месте, загрязняющие материалы разделены... Ц."
1010405-32 = "Точно! А задняя дверь? Вы ведь не оставляете её открытой?!"
1010405-33 = "Если бездумно держать её открытой из-за жары, внутрь попадёт грязный воздух или даже НАСЕКОМЫЕ!"
1010405-35 = "Разумеется. В Променаде Чёрной Черепахи установлена современная вентиляционная система именно на такой случай."
1010405-36 = "Если включить её вот так..."
1010405-37 = ""
1010405-41 = "К-Кто просил включать её здесь?! Мои волосы!"
1010405-42 = "Доверие и подтверждение — важные части проверки."
1010405-43 = "...Ладно. Дальше — чистота помещения и утвари!"
1010405-45 = "Сроки годности ингредиентов...!"
1010405-47 = "Контроль перекрёстного загрязнения...!"
1010405-49 = "Н-Негигиеничные привычки вроде сигарет или алкоголя...!"
1010405-50 = "[s] «Ну, не думаю, что ученики вообще таким занимаются...»"
1010405-52 = "(Почему... всё соответствует нормам?!)"
1010405-53 = "Вы закончили проверку? Возможно, это прозвучит самоуверенно..."
1010405-54 = "...но, думаю, никаких нарушений вы не найдёте."
1010405-55 = "Хмпф! Ещё не конец! Не недооценивайте Гэнрюмон!"
1010405-56 = "Так... Знаю! Угадайте блюдо, о котором я сейчас думаю!"
1010405-57 = "Простите?"
1010405-58 = "[s] «Это уже неразумно!!»"
1010405-59 = "Даже этого не можете, и называете себя рестораном?!"
1010405-60 = "Как вы собираетесь удовлетворять клиентов душой и сердцем, если не способны предугадывать каждое их желание и потребность?"
1010405-61 = "..."
1010405-62 = "Кроме того! Почему на главных дверях ресторана гордо не красуется эмблема Гэнрюмона?"
1010405-63 = "Вы демонстрируете свои мятежные чувства по отношению к Гэнрюмону! Вот что это значит!"
1010405-64 = "Вернувшись, я немедленно доложу о предательских намерениях Променада Чёрной Черепахи против Гэнрюмона! Нет, против самого Шаньхайцзина!"
1010405-65 = "Пожалуйста, выслушайте. Это Променад Чёрной Черепахи, поэтому естественно, что мы выставляем наш символ—"
1010405-66 = "Не желаю слушать жалкие оправдания! Моя задача — определить, с гордостью ли Променад несёт ответственность сферы обслуживания!"
1010405-67 = "Я должна убедиться, что у вас есть воля поддерживать славные традиции и культуру Шаньхайцзина!"
1010405-68 = "Вообще-то разве это не должна была быть просто санитарная проверка?"
1010405-69 = "Эта фраза выдаёт вашу близорукость! Это важнее гигиены!"
1010405-70 = ""
1010405-72 = ""
1010405-73 = "...Что мне теперь делать, Сенсей?"
1010405-74 = "[s] «Эм... Т-точно. Кунг-фу!»"
1010405-75 = "К-Кунг-фу?"
1010405-76 = "[s] «Просто вспомни уроки, которым тебя научило кунг-фу!»"
1010405-77 = ""
1010405-79 = ""
1010405-81 = "(Уроки кунг-фу...)"
1010405-82 = ""
1010405-84 = ""
1010405-85 = "(Я помню учение: «Не думай — чувствуй.»)"
1010405-86 = "(Что я сейчас чувствую?)"
1010405-87 = "(Крайнюю несправедливость... и ярость!)"
1010405-88 = "(Но яростью проблемы не решишь.)"
1010405-89 = "(Тогда чем можно победить ярость?)"
1010405-90 = "(Конечно... ещё большей яростью!)"
1010405-92 = "Понятно. Вы правы. Как организация столь ужасная, как Променад Чёрной Черепахи, вообще осмеливается распространять еду по всему Шаньхайцзину?"
1010405-93 = "[s] «Рэйдзё?!»"
1010405-94 = "Х-Хмпф! Именно! Наконец-то вы поняли своё положение!"
1010405-95 = "Да. Поэтому отныне мы, Променад Чёрной Черепахи..."
1010405-96 = "...больше не будем доставлять закуски Гэнрюмону."
1010405-97 = "Ч-что?!"
1010405-98 = "В частности, закуски, которые можно найти только в Шаньхайцзине... В Гэнрюмоне любят фруктовое желе, крекеры инджольми и печенье с шоколадным кремом, верно? Я могу назвать ещё несколько."
1010405-99 = "Мы позаботимся, чтобы они больше НИКОГДА! Ни при каких условиях! Ни разу! Не распространялись! Никогда!"
1010405-100 = "Подождите! Если... если вы это сделаете...!"
1010405-101 = "Почему вы удивлены? Как Променад Чёрной Черепахи, который якобы не чтит «уважаемые традиции и культуру» Шаньхайцзина и не умеет нормально обслуживать клиентов..."
1010405-102 = "...может производить и распространять такую продукцию? Разве это не странно?"
1010405-103 = "Особенно если учитывать результаты сегодняшней проверки."
1010405-104 = "Верно, инспектор?"
1010405-105 = "П-Подождите! Одну минуту!!"
1010405-108 = "В конце концов инспектору пришлось практически умолять Рэйдзё у ног..."
1010405-110 = "День вышел довольно насыщенным, но проверку мы всё же прошли без особых происшествий."
1010405-111 = "Уроки кунг-фу и правда полезны, да, Сенсей?"
1010405-113 = "Улыбка Рэйдзё была яркой, а сама она выглядела такой бодрой и освежённой."
1010405-114 = "Мне оставалось только кивнуть и согласиться."
