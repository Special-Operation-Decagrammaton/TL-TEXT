[translation]
2005302-1 = "Девушке-ниндзя нужно лечение"
2005302-2 = "Класс в старом школьном здании Хяккияко 38"
2005302-3 = "Я переживал из-за травмы Мичиру, поэтому отправился в Хяккияко."
2005302-4 = ""
2005302-6 = "А-а? Почтенный Сенсей?!"
2005302-7 = "Вы правда здесь?!"
2005302-8 = "[s] «Где ты поранилась, Мичиру?!»"
2005302-9 = "О, э-это..."
2005302-10 = "Травма действительно была, но..."
2005302-11 = "...пострадала не я."
2005302-12 = "[s] «Хм?»"
2005302-13 = "Ну... «пострадала» моя одежда..."
2005302-14 = "Точнее, платье порвалось..."
2005302-15 = "...И довольно сильно."
2005302-16 = "[s] «Как ты умудрилась...»"
2005302-17 = "Ну, э-это..."
2005302-18 = "Я упала с дерева, пока совершенствовала «Технику извивания на дубе»... Это очень продвинутая техника, и она всё ещё находится в разработке."
2005302-19 = "[s1] «Итак, подведём итог...»\n[s2] «Ты порвала платье, пока лазила по дереву?»"
2005302-22 = "Ах! Обязательно было говорить именно так?"
2005302-23 = "Выставляете всё так, будто я просто дурачилась!"
2005302-24 = "Что значит «просто дурачилась»?"
2005302-25 = "Я-я не дурачилась! Технически это часть тренировки, исследования и разработки ниндзюцу! Нельзя относиться к тренировкам как к шутке!"
2005302-26 = "А-а..."
2005302-27 = "Да уж, Сенсей, вам ещё многому предстоит научиться в ниндзюцу."
2005302-28 = "Вообще-то именно поэтому вам стоит пойти со мной."
2005302-29 = "Пока будем разбираться с этой... проблемой платья, я проведу для вас персональную практическую тренировку в реальных условиях!"
2005302-31 = "Так я и оказался в компании Мичиру по дороге к портному."
2005302-33 = "Торговый квартал Хяккияко"
2005302-34 = ""
2005302-35 = "...Именно поэтому представление о том, что ниндзя всегда носят только чёрное, — вводящий в заблуждение стереотип."
2005302-36 = "Тёмный костюм, закрывающий всё тело, нужен лишь для ночных операций, когда необходимо сливаться с тенями."
2005302-37 = "Днём такое, конечно, сразу бросалось бы в глаза. Поэтому среди обычных людей ниндзя носили обычную одежду."
2005302-38 = "В конце концов, ниндзя должен стремиться смешаться с толпой и остаться незамеченным."
2005302-39 = "Вот почему каждый ниндзя знает: одеваться нужно по ситуации!"
2005302-40 = "Просто вспомните, как мне досталось это платье! Моей миссией было затеряться среди гостей вечеринки на модном показе."
2005302-41 = "Но если бы мне нужно было... красться по чьим-нибудь кустам, я бы надела чёрное и закрыла лицо."
2005302-42 = "Даже существует легенда о ниндзя, которая вообще не носила одежды! Вместо этого она раскрашивала тело, чтобы добиться идеальной маскировки и подвижности."
2005302-43 = "А ещё я слышала, что технологические компании работают над одеждой ниндзя с оптическим камуфляжем! Разве не потрясающе?"
2005302-44 = ""
2005302-46 = ""
2005302-47 = ""
2005302-48 = ""
2005302-52 = ""
2005302-53 = "[ns] «Мичиру, разве это не ателье?»"
2005302-54 = "О! Мы уже пришли?!"
2005302-55 = "Добро пожаловать. Чем могу помочь, мисс?"
2005302-56 = "А, я хотела бы починить это платье, пожалуйста."
2005302-57 = "Конечно. Положите платье на стойку, и давайте посмотрим."
2005302-58 = "А, платье, ну..."
2005302-59 = ""
2005302-61 = ""
2005302-62 = "...Сейчас оно на мне."
2005302-64 = "Я подумала, что будет эффективнее прийти сюда прямо в нём."
2005302-66 = "Эм, ну, если вы хотите, чтобы я его починила, его придётся снять."
2005302-67 = "Ох... Эм... Запасной одежды я не взяла..."
2005302-68 = "А нельзя ли... просто зашить его прямо на мне?"
2005302-69 = "...Вы хотите залезть в швейную машинку?"
2005302-70 = "А-Ах..."
2005302-71 = "Аааа, не могу поверить, что придётся возвращаться! Мы так долго сюда шли."
2005302-72 = "Погодите. ...Нет, ещё не всё потеряно. Нужно проявить находчивость!"
2005302-73 = "Я могу снять платье и положиться на свои инстинкты ниндзя."
2005302-74 = "[s] «Ты же сказала, что запасной одежды у тебя нет?»"
2005302-75 = "Да всё нормально, нормально!"
2005302-76 = "Я могу... нарисовать на себе одежду? Чернилами? Или маркером — чем угодно. Буду как та легендарная ниндзя!"
2005302-77 = "[s] «Но разве тебе не будет неловко?»"
2005302-78 = "Фуфу, конечно, для ниндзя..."
2005302-79 = "..."
2005302-80 = ""
2005302-82 = ""
2005302-83 = "Э-Это будет не просто неловко! Это неприлично, недопустимо!"
2005302-84 = "Ни за что! Как вам вообще могло прийти в голову такое предложить?!"
2005302-85 = "H..."
2005302-86 = "П-Почтенный Сенсей! Извращенец!"
2005302-87 = "[s3] «Я?!» \n[s4] «Я невиновен...!»"
2005302-91 = "В итоге Мичиру купила спортивный костюм в ближайшем магазине и оставила платье в ателье."
2005302-92 = "...Разумеется, платить пришлось единственному взрослому."
