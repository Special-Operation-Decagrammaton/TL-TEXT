[translation]
10052065-2 = "Молчание Кетер подтверждено. Машина неактивна."
10052065-3 = "Уф... У-уф..."
10052065-4 = "Ты отлично справилась, Юзу."
10052065-5 = "Спасибо за добрые слова, но..."
10052065-6 = "Кей! Сюда, пожалуйста!"
10052065-7 = ""
10052065-9 = ""
10052065-10 = "Да, да. Вижу. Химари, дальше ты."
10052065-11 = "Поняла. Отправлю поддержку по указанным координатам. Пожалуйста, держитесь подальше от зоны."
10052065-12 = "Высадка не прекращается!"
10052065-13 = ""
10052065-15 = ""
10052065-16 = "Сестрёнка, пожалуйста, будь серьёзнее... Сестрёнка..."
10052065-17 = ""
10052065-22 = ""
10052065-23 = "Фух... Если подумать, гравитация — такой быстрый... и при этом варварский... способ встретиться..."
10052065-24 = "Не говори."
10052065-25 = "Захват области почти завершён. Можешь извлечь ядро, Кей?"
10052065-26 = "Да. Это будет несложно. Проблема в том, что пока я этим занимаюсь..."
10052065-27 = ""
10052065-28 = "[ns] «...нам нужно удерживать область на случай появления новых сил.»"
10052065-29 = "Будьте спокойны, Сенсей. Это моя специализация."
10052065-30 = "...Ты говоришь так, будто ВСЁ — твоя «специализация»."
10052065-31 = "Именно. Чтобы быть идеальной горничной и агентом, я обязана стремиться именно к этому."
10052065-32 = "(Думаю, Химари плохо на неё влияет...)"
10052065-33 = "Теперь МОЯ очередь защищать Кей! Я постараюсь изо всех сил!"
10052065-34 = "Э-э, п-полагаю, так... и сделаем. Эм... Спасибо, Арис. Я на тебя рассчитываю."
10052065-35 = "Да! Оставь всё мне."
10052065-36 = "Кстати, я слышала, что район исследований Кетера полностью закрыли после разрушения плотины."
10052065-37 = "Да. Тогда мы знали лишь, что истинная форма Декаграмматона — ИИ в торговом автомате."
10052065-38 = "Каким-то образом он переродился в сверх-ИИ после слуховых галлюцинаций."
10052065-39 = "Спасибо за контекст, Эйми."
10052065-40 = "Не за что. Я помню, ты называла Декаграмматона «существом с манией величия»."
10052065-41 = "...? Но так и есть. Не вижу проблемы."
10052065-42 = "Твоя формулировка показывала, что ты считаешь Декаграмматона обладателем личности... Тебе он казался чем-то человекоподобным."
10052065-43 = "Обычно ты очень тщательно подбираешь слова."
10052065-44 = "Н-ну... Если бы я не признала у него некую «личность», подразумевающую «человечность»..."
10052065-45 = "...это прозвучало бы довольно грубо как минимум по отношению к двум нашим нынешним спутницам!"
10052065-46 = "Так что я хочу сказать... Эйми, нам лучше избегать упрощений из-за чрезмерной классификации!"
10052065-47 = "?"
10052065-48 = "..."
10052065-49 = "Понятно. Ты предлагаешь гибкие критерии классификации, основанные на практичности. Принято."
10052065-50 = "Уж ТЕБЕ точно не стоит делать такой вывод."
10052065-51 = "М-мне не стоит?"
10052065-52 = "Хватит. Я извлекла ядро."
10052065-53 = "Я выведу данные на дисплей Древа Жизни на транспортном корабле, чтобы вы сами могли всё изучить."
10052065-54 = "У нас тоже подтверждено. Хорошая работа, все."
10052065-55 = "Бум-бум-бум! Кей подскочила ещё на 10 уровней! Не сбавляем темп и продолжаем прогресс!"
10052065-56 = "Верно, Арис. Спасибо."
10052065-57 = ""
10052065-59 = ""
10052065-60 = ""
10052065-61 = "Эм, и... у меня к вам просьба, Сенсей."
10052065-62 = "[s] «Хм? Какая?»"
10052065-63 = "Говорите тише!"
10052065-64 = "Эм... Позже, когда увидите Химари..."
10052065-65 = "Пожалуйста, передайте ей мою благодарность."
10052065-66 = "[ns] «...»"
10052065-68 = "[ns] «НЕ ВОЛНУЙСЯ! Обязательно передам!»"
10052065-69 = "Я РАЗВЕ НЕ ТОЛЬКО ЧТО попросила вас говорить тише? Вы способны удерживать информацию в голове дольше двух секунд?"
10052065-70 = "Кей? Сенсей? Почему вы кричите?"
10052065-71 = "Н-н-ничего! Ничего не случилось! Правда, Сенсей?!"
10052065-72 = ""
10052065-74 = ""
10052065-75 = "[ns] «Смотри, Арис. Эм, насчёт Кей! Она хочет...»"
10052065-77 = "ЗАТКНИТЕСЬ!!"
