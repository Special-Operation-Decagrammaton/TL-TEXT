[translation]
10036010-1 = "Эпизод 1;Саори, море и..."
10036010-4 = ""
10036010-5 = ""
10036010-6 = "Так! Стоп! Сначала выгружаем крупное!"
10036010-7 = "Время идёт, а дел ещё куча. Быстрее!"
10036010-8 = "Да-да!"
10036010-9 = "Хм, вдвоём мы не справимся... Эй, ты, подработка!"
10036010-10 = ""
10036010-12 = ""
10036010-13 = ""
10036010-14 = "...Хм? Я?"
10036010-15 = "Выглядишь неважно. Заболела? Уже солнечный удар?"
10036010-16 = "Н-Нет. Просто..."
10036010-17 = "Почему мы делаем это средь бела дня?"
10036010-18 = "А если академии пришлют охрану?"
10036010-19 = "Впервые здесь, да?"
10036010-20 = "Это Пляж беззакония. Земля свободы для таких девушек, как мы!"
10036010-21 = "Земля... свободы?"
10036010-22 = ""
10036010-24 = ""
10036010-25 = "Здесь пересекаются юрисдикции трёх разных академий. А значит, ни одна не может ничего сделать, не разозлив две другие!"
10036010-26 = "Ага. Все понимают, что это быстро перерастёт в демонстрацию военной силы. Поэтому вся эта территория — серая зона для всех."
10036010-27 = "...Ну, кроме, может, «Валькирии». Они могут приехать. Но они медленные."
10036010-28 = "К тому времени фестиваль уже закончится. Хи-хи!"
10036010-30 = "Понятно. Значит, нарушители могут делать здесь что угодно..."
10036010-32 = "Ты нас сейчас как назвала?"
10036010-34 = "Мне не стоило так вас называть? Прошу прощения."
10036010-36 = "Что мы за банда, если принимаем извинения?!"
10036010-37 = "Да, верно, мы нарушители. И скажем это во весь голос! Но—"
10036010-39 = "В любом случае, похоже, вам нужна была помощь с переноской."
10036010-40 = ""
10036010-42 = ""
10036010-44 = "Ого, она может нести сразу три огромных железных прута?!"
10036010-45 = "Нам повезло больше, чем мы думали."
10036010-47 = "Куда их положить?"
10036010-49 = "В песок, на расстоянии двух метров друг от друга!"
10036010-52 = ""
10036010-53 = ""
10036010-54 = "Готово, всё расставила."
10036010-55 = "Что теперь?"
10036010-56 = ""
10036010-58 = "Эй, подработка! Можешь помочь?"
10036010-59 = "Мы никак не поставим этот навес!"
10036010-60 = "Показывайте."
10036010-62 = "Хоп! Поехали!"
10036010-63 = "Давайте ещё немного приподнимем эту сторону и... раз!"
10036010-64 = ""
10036010-66 = ""
10036010-67 = "Фух, достаточно. Спасибо, подработка! Теперь можно начинать продавать хот-доги."
10036010-68 = "Благодарить не нужно. Я обязана сотрудничать со всеми вами. Это прописано в контракте."
10036010-69 = "Чёрным по белому."
10036010-70 = "Да? Ну, ты вроде зануда, но работяга."
10036010-71 = "Зануда?"
10036010-72 = "Эй! Помоги нам здесь!"
10036010-73 = "Нужно сделать волейбольную площадку."
10036010-74 = "Уже иду."
10036010-78 = ""
10036010-79 = "...Фух. Ну, пока этого должно хватить."
10036010-80 = "Теперь ждать VIP-гостя."
10036010-81 = ""
10036010-84 = "М-м..."
10036010-89 = "(Однажды я слышала, как кто-то сказал...)"
10036010-90 = "(«Там, где заканчивается суша, начинается океан — такой глубокий и широкий, что неизвестно, где его границы».)"
10036010-91 = "(Я знала это в теории, но впервые вижу своими глазами.)"
10036010-92 = "..."
10036010-99 = ""
10036010-100 = "..."
10036010-101 = "Так спокойно..."
10036010-102 = "Ацуко, Мисаки, Хиёри, Азуса..."
10036010-103 = "Жаль, что их нет здесь, чтобы увидеть это."
10036010-105 = "[log](Тем временем в другом месте Пляжа беззакония...)[/log]"
10036010-110 = ""
10036010-111 = "Сенсей, смотрите! Настоящий краб. Милый, правда?"
10036010-112 = "[s] «Ага, милый!»"
10036010-113 = ""
10036010-115 = ""
10036010-116 = "Ацуко, ты сейчас прольёшь мороженое. Осторожнее."
10036010-118 = ""
10036010-119 = "Я оставила своё на солнце на две секунды, и оно растаяло! Уа-а-а!"
