[translation]
80000084-1 = "Как в романтической комедии"
80000084-2 = "Рано утром в День святого Валентина Мичиру пришла в Шале."
80000084-4 = "Почтенный Сенсей! Сегодня ведь День святого Валентина, верно?"
80000084-5 = "[s] «Ага.»"
80000084-6 = "Ни за что «Мичиручи: Девичий свиток ниндзя» не позволит столь знаменательному дню пройти впустую!"
80000084-7 = "Поэтому в честь такого случая..."
80000084-8 = "...нам следует создать и загрузить особый валентиновский контент!"
80000084-9 = "Те, кто не приспосабливается ко времени, оказываются забыты."
80000084-10 = "Таково моё мнение. Что скажете, почтенный Сенсей?!"
80000084-11 = "[s] «Ну, ты не совсем неправа, но разве твой канал не про ниндзя—»"
80000084-12 = "Даже ниндзя любят шоколад!"
80000084-13 = "[s] «Кажется, ты немного не уловила мою мысль.»"
80000084-14 = "Тот, кто переживает из-за таких мелочей, не выживет в жестокой битве создания контента!"
80000084-15 = "Поэтому, умоляю, помогите мне!"
80000084-16 = "Я должна создать контент, который обеспечит вирусную популярность «Мичиручи: Девичий свиток ниндзя» в День святого Валентина!"
80000084-17 = "Пожалуйста? Пожалуйста?"
80000084-18 = "[s] «Наверное, я не против помочь...»"
80000084-19 = "П-Правда?!"
80000084-20 = "То есть, я правильно сделала, что пришла к вам, почтенный Сенсей!"
80000084-21 = "Человек вашей великодушной натуры никогда не бросит студента в беде!"
80000084-22 = "Как и ожидалось от будущего великого лидера ниндзя!"
80000084-23 = "[s1] «Не припомню, чтобы соглашался на эту часть, но... ладно.»\n[s2] «Так что мы снимаем? У тебя есть план?»"
80000084-24 = "Не бойтесь! У меня есть идея!"
80000084-25 = "Не бойтесь! У меня есть идея!"
80000084-26 = "Я подготовила идеальный сценарий и идеальные инструменты именно для этого момента!"
80000084-27 = "[s] «Знаешь, для человека, который якобы в беде, ты подозрительно хорошо подготовилась...»"
80000084-28 = "...А?"
80000084-29 = "Эм, ну, это просто..."
80000084-30 = "Н-Ну, дело в том, что..."
80000084-31 = "Президент Мичиру просто всегда готова к любой опасной ситуации!"
80000084-32 = "В любом случае! Это неважно. Ваша задача — просто следовать моим режиссёрским указаниям, почтенный Сенсей!"
80000084-33 = "[s] «Ага-ага. Хорошо.»"
80000084-34 = "(Отлично! Первый этап — уговорить почтенного Сенсея участвовать в съёмке — прошёл без сучка без задоринки!)"
80000084-35 = "(Теперь ко второму этапу!)"
80000084-36 = "Хорошо! Начинаем!"
80000084-38 = "Так начались валентиновские съёмки по уникальному видению Мичиру..."
80000084-39 = "Первый кадр — сцена, где двое сталкиваются, одновременно выбегая из-за угла."
80000084-40 = "[s] «Погоди, извини. Что именно мы снимаем?»"
80000084-41 = "Хе-хе-хе. Вы уже согласились, так что скрывать больше нечего!"
80000084-42 = "Мы будем снимать настоящий валентиновский контент!"
80000084-43 = "Я называю его: «Пробуем клише романтических комедий в День святого Валентина!»"
80000084-44 = "[s] «Разве это... не полностью игнорирует тему ниндзя?»"
80000084-45 = "О, ну..."
80000084-46 = "Точно! Простите, мы снимаем не просто обычные клише ромкомов."
80000084-47 = "Это всё клише ниндзя-ромкомов! Видите? Значит, связь с ниндзя есть!"
80000084-48 = "[s] «Хм, раз ты так говоришь...»"
80000084-49 = "Итак! Я выбегу из-за угла с той стороны."
80000084-50 = "А вы стойте здесь и по моему сигналу бегите в эту сторону."
80000084-51 = ""
80000084-53 = ""
80000084-55 = "Хорошо, и... Мотор!"
80000084-56 = ""
80000084-59 = "Следуя указаниям, я медленно побежал трусцой из-за угла."
80000084-60 = ""
80000084-66 = "Хи-я!"
80000084-67 = ""
80000084-69 = ""
80000084-71 = "(Теперь, когда мы столкнёмся, нужно незаметно сунуть это в карман почтенного Сенсея!)"
80000084-72 = "...Уааааа! Банановая кожура?"
80000084-73 = "Откуда она здесь?!"
80000084-74 = ""
80000084-77 = "[s] «Мичиру! Ты в порядке?!»"
80000084-78 = ""
80000084-79 = "Кто совершил этот мерзкий поступок? Кто выбросил мусор прямо на землю?!"
80000084-80 = "Это так опасно! Из-за этого невозможно романтично столкнуться за углом!"
80000084-81 = "[s] «Я... не думаю, что опасность тут именно в банановой кожуре.»"
80000084-82 = "Обязательно всегда опираться на факты и логику, почтенный Сенсей?"
80000084-83 = "Хотя в этот раз, наверное, вы правы... Да и клише уже устарело..."
80000084-84 = "Хорошо! Больше так не делаем!"
80000084-85 = "Переходим к следующему клише!"
80000084-87 = "Ещё какое-то время я снимал с Мичиру клише ромкомов — то есть ниндзя-ромкомов."
80000084-89 = "Для этого клише вы должны простудиться."
80000084-90 = "Кхм..."
80000084-91 = "«[USERNAME] Сенсей! Я слышала, вы плохо себя чувствуете!»"
80000084-92 = "Не волнуйтесь, я принесла вам домашнюю кашу. Она мигом прогонит простуду!"
80000084-93 = "[s] «Эм, каша выглядит так, будто сгорела до черноты...»"
80000084-95 = "[ns] «И что это за запах? Он подозрительно сладкий. Ты уверена, что это каша...?»"
80000084-96 = "О! Я так увлеклась ролью заботливой подруги детства, что совсем не подумала об ингредиентах каши..."
80000084-97 = "Х-Хорошо! К следующему клише!"
80000084-99 = "«[USERNAME] Сенсей! Если мы победим в этом соревновании...»"
80000084-100 = "Я хочу, чтобы вы знали... Я положила кое-что очень важное для вас в капсулу времени под деревом!"
80000084-101 = "[s] «Стой! Я вообще не понимаю завязку этой сцены.»"
80000084-102 = "Аргх! И это не работает?"
80000084-103 = "Ничего! Идём дальше!"
80000084-105 = "Следующее точно завирусится!"
80000084-106 = "Я продолжал разыгрывать список клише Мичиру..."
80000084-107 = "Но из-за череды неудач и просто невезения..."
80000084-108 = "...солнце начало садиться, прежде чем мы смогли снять хоть один хороший кадр."
80000084-110 = "*вздыхает*"
80000084-111 = "[s] «Мичиру, ты в порядке?»"
80000084-112 = "Я-я в порядке..."
80000084-113 = "Нет, погодите... Угх. Кажется, я слишком перенапряглась. Мышцы так болят, что я вообще не могу двигаться..."
80000084-114 = "[s] «Так, пора отдохнуть. Я возьму напитки из автомата.»"
80000084-115 = "Хорошо... Спасибо, почтенный Сенсей..."
80000084-116 = ""
80000084-119 = "Угх..."
80000084-120 = "Угх! Я провалила... вообще всё!"
80000084-121 = "Мой особый план на День святого Валентина..."
80000084-122 = "Мой план тайком передать шоколад почтенному Сенсею..."
80000084-123 = "[s3] «Понятно. Так вот зачем мы на самом деле здесь.»\n[s4] «Впрочем, примерно этого я и ожидал.»"
80000084-124 = "...А?"
80000084-125 = "...А?"
80000084-126 = "П-П-П-Почтенный Сенсей?! Что вы здесь делаете?!"
80000084-127 = "В-Вы же должны были... Напитки?!"
80000084-128 = "[s] «Ну, я забыл спросить, что ты хочешь, поэтому...»"
80000084-129 = "Т-Т-Так вы всё... слышали?!"
80000084-130 = "[s] «Ага.»"
80000084-131 = "Нет... Нееееееет!"
80000084-132 = "Аргх! Ладно! Мне уже всё равно!"
80000084-133 = "Это правда! Настоящая причина, почему я попросила вас снимать со мной контент..."
80000084-134 = "...в том, что я хотела подарить вам шоколад!"
80000084-135 = "Вы всегда помогаете Клубу исследования ниндзюцу, почтенный Сенсей..."
80000084-136 = "Я... Я хотела... хотела сказать... Сказать спаси—АЙ!"
80000084-137 = "[s] «Мичиру? Т-Ты в порядке?»"
80000084-138 = "Угх! Я прикусила язык в самый важный момент!"
80000084-139 = "[s] «Знаешь, можно было просто нормально подарить мне шоколад, Мичиру...»"
80000084-140 = "Что?! Как вы можете быть таким холодным, почтенный Сенсей?!"
80000084-141 = "Просто... просто так взять и вручить кому-то валентиновский шоколад..."
80000084-142 = "Н-Ни за что я не смогла бы участвовать в такой п'иторно-сладкой ромком-сцене т-так п'осто!"
80000084-143 = "Так могут только совершенно бесстрашные или бесстыжие люди! Или и те и другие! То есть совсем не такие, как мы!"
80000084-144 = "[s] «Кажется, тут у тебя есть некоторые предубеждения...»"
80000084-145 = "Угх..."
80000084-146 = "Теперь уже неважно... Моё прикрытие раскрыто."
80000084-147 = "И вы наверняка злитесь, что я целый день таскала вас за собой..."
80000084-148 = "[s] «Вовсе нет. Мне было весело делать с тобой контент.»"
80000084-149 = "П-Правда? Ну, тогда я рада..."
80000084-150 = "Стойте-стойте! Всё становится слишком душевно."
80000084-151 = "Вы просто говорите, что вам понравилось смотреть, как я бегала как обезглавленная курица!"
80000084-152 = "Ладно! Пусть так! Даже ниндзя не может повернуть время вспять."
80000084-153 = "Вот, почтенный Сенсей!"
80000084-154 = ""
80000084-156 = ""
80000084-158 = "Я специально заказала этот шоколад, чтобы как следует вас отблагодарить. Наслаждайтесь!"
80000084-159 = "[s] «Ага, спасибо.»"
80000084-160 = "Ааааагх! Сегодня был худший день! Я совсем была сама не своя!"
80000084-161 = "И закончилось всё так скучно и неромантично..."
80000084-162 = "Хотя, наверное, именно такой финал мне подходит лучше всего."
80000084-163 = "[s] «Погоди, Мичиру.»"
80000084-164 = "А? Что такое, почтенный Сенсей?"
80000084-165 = "[s] «Разве классическое клише ромкома — это не...»"
80000084-167 = "[ns] «...молчаливая передача шоколада на фоне заката?»"
80000084-168 = "...Хм?"
80000084-169 = ""
80000084-171 = ""
80000084-172 = "О, ха... ха-ха-ха..."
80000084-173 = "Аааааааа!"
80000084-174 = ""
80000084-176 = ""
80000084-177 = "[ns] «И... убежала.»"
80000084-179 = "Хотя Мичиру и убежала..."
80000084-180 = "...тепло её подарка осталось со мной."
