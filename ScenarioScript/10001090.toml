[translation]
10001090-1 = "Эпизод 9; Возвращение в секретариат"
10001090-2 = "Секретариат академии Красная Зима"
10001090-3 = "Хе-хе... Власть — это хорошо."
10001090-4 = "Я могу сколько угодно спать и есть сладости! И президентское кресло немного маловато, зато подушка такая мягкая!"
10001090-5 = "Я бы привыкла к такой жизни. Просто рай!"
10001090-6 = "Единственная проблема... я всё ещё не знаю, где президент Черино..."
10001090-7 = "Ну, мои люди её ищут, так что скоро наверняка поймают. Пусть наша академия и огромная, но мест, где может спрятаться эта мелкая соплячка, не так уж много. Ха-ха-ха!"
10001090-8 = "Так, что у нас дальше по повестке?"
10001090-9 = "Наверное, стоит заменить все статуи Черино в кампусе на мои."
10001090-11 = ""
10001090-12 = "Ужасные новости, Великий лидер!"
10001090-13 = "Что случилось? Я же сказала не беспокоить меня, пока не найдёте президента Черино!"
10001090-14 = "Ну, эм, видите ли, президент... бывший президент Черино штурмует секретариат со своими силами."
10001090-15 = "Ч-что? Она идёт сюда?!"
10001090-16 = "Ч-ч-что мне делать? Выйти её встретить? О, и нужно приготовить чашку её любимого горячего какао!"
10001090-17 = "Э-э-э... Президент Марина?"
10001090-18 = "А-А?"
10001090-19 = "А, точно! Теперь президент — я! Это ОНА должна меня бояться."
10001090-20 = "Хех. Не знаю, как этой упрямой соплячке удалось кого-то переманить, но против моей Государственной гвардии им не выстоять! Я не боюсь!"
10001090-21 = "...Но чисто из любопытства, сколько студентов с Черино? Пять или...?"
10001090-22 = "Эм, нет. Точно посчитать не удалось, но за бывшим президентом Черино, похоже, идут сотни студентов."
10001090-23 = "С-сотни? Как, чёрт возьми, она набрала столько людей?"
10001090-24 = "По донесениям, среди них студенты Спецотряда №227, Фронта освобождения знаний и Рабочей партии."
10001090-25 = "Как ей удалось заставить их всех быть ей верными?! Это же бессмыслица...!"
10001090-26 = ""
10001090-27 = ""
10001090-30 = "(Я-я-я попала. Может, просто отдать кабинет и молить о прощении...?)"
10001090-31 = "(...Нет, не поможет. Президент Черино наверняка уже придумывает самое ужасное наказание, какое только способна представить...)"
10001090-32 = "(К тому же я так тяжело добивалась этой власти... Теперь, когда я её вкусила, не могу просто отказаться!)"
10001090-33 = ""
10001090-35 = "...Готовьтесь к бою."
10001090-36 = "А?"
10001090-37 = "Пусть у них численное преимущество, но это всего лишь неорганизованная толпа случайных студентов!"
10001090-38 = "Ударим первыми и разрушим их строй! Так мы и победим!"
10001090-40 = "Государственная гвардия, построиться! Вперёд, захватить президента Черино!"
