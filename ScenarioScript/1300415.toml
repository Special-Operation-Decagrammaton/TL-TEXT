[translation]
1300415-1 = "Секретная записка"
1300415-2 = "Однажды я заглянул по делам к Комитету по предотвращению закрытия."
1300415-3 = ""
1300415-8 = ""
1300415-9 = "Ля-ля-ля-ля!"
1300415-10 = "[ns] «Эй, Нономи!»"
1300415-11 = ""
1300415-13 = ""
1300415-14 = ""
1300415-15 = "С-Сенсей?!"
1300415-16 = "Когда ты пришёл?!"
1300415-17 = "Я даже не слышала, как открылась дверь!"
1300415-18 = "Если бы я знала, приготовила бы нам что-нибудь перекусить."
1300415-19 = "[s] «На чём ты так сосредоточилась?»"
1300415-20 = ""
1300415-22 = ""
1300415-23 = "А, ну..."
1300415-24 = "Э-Это секрет."
1300415-25 = "[s1] «Тогда не моё дело.»\n[s2] «Не буду допытываться.»"
1300415-26 = ""
1300415-27 = ""
1300415-29 = ""
1300415-30 = "Ой... Ты так быстро сдаёшься?"
1300415-31 = "Не то чтобы это какой-то страшный секрет."
1300415-32 = "Вот, покажу. Но только тебе!"
1300415-33 = ""
1300415-36 = ""
1300415-37 = ""
1300415-38 = "[ns] «...Это просто записка?»"
1300415-39 = "Вроде того. Точнее, это мой список желаний."
1300415-40 = "Я записала всё, что однажды хочу сделать вместе с Комитетом по предотвращению закрытия."
1300415-41 = "Иногда, когда я одна и никто не видит, я его дополняю!"
1300415-42 = "[s] «Разве не лучше поделиться им, чтобы вместе выполнять пункты?»"
1300415-43 = "М-м, нет."
1300415-44 = "Если остальные узнают про этот список, они всё бросят и заставят меня выполнить всё сразу."
1300415-45 = "У нас и так полно работы с долгами. Я не хочу ещё сильнее на них давить."
1300415-46 = "Поэтому лучше я буду потихоньку заниматься им сама и выполнять всё в своём темпе."
1300415-47 = "Во всяком случае, занималась, пока ты меня не поймал, Сенсей."
1300415-48 = "[s] «Понятно... Прости...»"
1300415-49 = "Всё хорошо. Я знала, что когда-нибудь мой секрет раскроется. ☆"
1300415-50 = "Раз уж мы об этом заговорили... Хочешь почитать?"
1300415-51 = "[s3] «Если ты уверена...»\n[s4] «Ты правда не против?»"
1300415-54 = "Конечно. Я же сказала, это не какой-то страшный секрет!"
1300415-55 = "Вот, можем прочитать вместе."
1300415-56 = ""
1300415-58 = ""
1300415-65 = "То, что мы уже сделали, я отметила красным."
1300415-66 = "Поесть десерт вместе, украсить академию... Некоторые пункты выполнить было легко, а ради других всем пришлось очень постараться."
1300415-67 = "Мне становится тепло на душе даже просто вспоминать это."
1300415-68 = ""
1300415-71 = "О, помнишь этот? Попробовать острую пиццу пятого уровня."
1300415-72 = "У Серики тогда всё лицо стало ярко-красным. Я бы хотела увидеть это снова! ☆"
1300415-74 = "А вот здесь то, чего мы ещё не сделали."
1300415-75 = "...Было бы здорово однажды вычеркнуть всё."
1300415-76 = "Но стоит выполнить один пункт, как я тут же придумываю ещё два."
1300415-77 = "Вместо того чтобы уменьшаться, список становится всё длиннее."
1300415-78 = "Теперь там уже больше ста невыполненных пунктов... Ахаха, настоящий кошмар!"
1300415-79 = "[s] «Разве это плохо?»"
1300415-80 = ""
1300415-82 = ""
1300415-83 = "[ns5] «Думаю, это значит, что тебе ещё предстоит создать много счастливых воспоминаний.»\n[ns6] «Возможно, впереди тебя ждёт ещё более светлое будущее.»"
1300415-84 = ""
1300415-85 = ""
1300415-87 = ""
1300415-88 = ""
1300415-89 = ""
1300415-90 = "...Точно!"
1300415-91 = "Мы всё ещё пытаемся расплатиться с долгами, но..."
1300415-92 = "Это же не значит, что мы не можем создавать новые счастливые воспоминания!"
1300415-93 = "Значит, я буду ещё усерднее выполнять наш список. Ага-ага!"
1300415-94 = ""
1300415-96 = ""
1300415-97 = "Кстати, хочешь помочь мне вычеркнуть ещё один пункт?"
1300415-98 = "[s] «Конечно. Какой?»"
1300415-99 = "Прыжок с парашютом!"
1300415-100 = "Представь эту свободу — выпрыгнуть из самолёта на высоте четырёх тысяч метров! Разве от одной мысли не захватывает дух?"
1300415-101 = ""
1300415-104 = "[ns] «А-а-а-а — пожалуй, я пас!»"
1300415-105 = ""
1300415-107 = "Хи-хи. Я просто дразнюсь. ☆"
