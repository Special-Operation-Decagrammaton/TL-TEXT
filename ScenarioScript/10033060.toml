[translation]
10033060-1 = "Эпизод 6;Фантастический кошмар"
10033060-2 = "Мы всё ещё немного отстаём от графика..."
10033060-3 = "Но хотя бы удалось расселить студентов Геенны без... особых проблем."
10033060-4 = "Благодаря помощи Сенсея..."
10033060-5 = "[ns] «Вот это был опыт! Ахаха!»"
10033060-7 = "Но мы всё равно заметно отстаём от расписания."
10033060-8 = "Мне ещё нужно проверить, всё ли готово к испытанию храбрости, но кому-то нужно забрать студентов из общежития..."
10033060-9 = "О-о! Я могу помочь!"
10033060-11 = "Для тебя уже довольно поздно, Каэдэ. Ты уверена?"
10033060-12 = "Я... *зевает* немного устала! Но настоящая леди не отступает от своих обязанностей. Просто сочту это дополнительной тренировкой!"
10033060-13 = ""
10033060-15 = ""
10033060-16 = "Тогда идём."
10033060-18 = ""
10033060-19 = "Думаю, стартовая точка где-то здесь."
10033060-20 = ""
10033060-22 = ""
10033060-25 = "Это как искать иголку в стоге сена, но вот они! Спасибо всем за тяжёлую работу."
10033060-26 = "Ну как? Не слишком страшно?"
10033060-27 = "Идеально! Ужасно мило."
10033060-28 = "...Надеюсь, это оправдает их ожидания. Не знаю, насколько сильно это вообще проверит их храбрость."
10033060-30 = "[ns] «Думаю, это где-то здесь...»"
10033060-33 = "Ты, наверное, устала так поздно не спать... Хочешь потом одолжить подушку?"
10033060-34 = "Спасибо, президент Цубаки! Для нас большая честь, но мы слышали, что ваши подушки настолько удобные, что после них можно вообще не проснуться."
10033060-35 = "Верно... Я очень горжусь своей коллекцией подушек."
10033060-36 = "Почему ты говоришь это так, будто это хорошо?!"
10033060-38 = ""
10033060-39 = ""
10033060-40 = "Мы прошли примерно две трети маршрута."
10033060-41 = "Приятно наконец-то получить хотя бы одну победу. Я глубоко благодарна всем за тяжёлую работу над этим фестивалем храбрости."
10033060-42 = ""
10033060-45 = "[ns] «Фестивалем... храбрости?»"
10033060-46 = "Полагаю, слово «фестиваль» здесь выбрано не совсем правильно."
10033060-47 = "Но в каком-то смысле это напоминает мне фестиваль. Все усердно исполняют свои роли, чтобы создать для участников удачный опыт."
10033060-48 = "И если студенты Геенны смогут уйти отсюда, возбуждённо обсуждая любимые моменты и радуясь, что побывали здесь..."
10033060-49 = "Разве это не фестиваль по-своему?"
10033060-50 = "[s] «Почему-то ты меня убедила!»"
10033060-51 = "Вы понимаете?! Поначалу давление из-за необходимости быть идеальным экскурсоводом было просто огромным."
10033060-52 = "Но потом я начала воспринимать всё это как фестиваль всей жизни и поняла, что само по себе это приносит радость."
10033060-53 = "Ты превратила сложную ситуацию в вполне посильную, просто изменив взгляд на неё."
10033060-54 = "Ты настоящее вдохновение, Умика! Считай меня своим преданным студентом на всю жизнь!"
10033060-55 = "П-правда? Я никогда не думала о себе таким образом..."
10033060-56 = ""
10033060-58 = ""
10033060-60 = ""
10033060-61 = "Кихехехе. Слова истинного лидера. Игнорируй реальность и живи исключительно собственным восприятием!"
10033060-62 = "[ns] «Этот очень характерный смех...»"
10033060-63 = "Ты узнал меня лишь по голосу? Кихехехе! Даже мне трудно осознать силу моей подавляющей ауры!"
10033060-64 = "Привет-привет! Это сестрички из Хяккияко и Сенсей! Ибуки передаёт привет!"
10033060-65 = "*вздыхает* Мне правда очень жаль. Я пыталась её остановить."
10033060-66 = "Общество Пандемониума?! Что привело вас на испытание храбрости?"
10033060-67 = "Хи-хи-хи. Думаю, ответ вас довольно сильно удивит. Видите ли—"
10033060-69 = "Мы пришли, чтобы сделать вас счастливыми!"
10033060-70 = "Я как раз собиралась это сказать!"
10033060-71 = "К счастью, я, Кёгоку Сацуки, щедрый человек, чьё терпение не знает границ."
10033060-72 = "Я с радостью отдала бы последнюю клубнику с торта своей очаровательной младшей сестрёнке."
10033060-73 = "Вот с этим я могу согласиться, Сацуки."
10033060-74 = "В конце концов, офицеры Общества Пандемониума славятся золотыми сердцами!"
10033060-75 = "Откуда ты вообще это вытащила, Макото?"
10033060-76 = "...Она просто говорит всё, что, по её мнению, звучит красиво."
10033060-77 = ""
10033060-78 = "Кихехехе. Узрите щедрость великой Макото, протягивающей руку помощи другим академиям. Моя доброта глубже океанов и необъятнее ночного неба!"
10033060-79 = "Несомненно, студенты Геенны услышат истории о моей благотворительности и будут распевать хвалу Обществу Пандемониума по всему району."
10033060-80 = "Этот момент войдёт в учебники истории как миг, когда все студенты пали перед великой Макото и её великолепным лидерством!"
10033060-81 = "Именно так, народ! Достойная предводительница, стоящая во главе Общества Пандемониума!"
10033060-82 = "...Хотя это она сама о себе сказала."
10033060-84 = "Я искренне ценю вашу заботу, эм, великая председательница Геенны, но..."
10033060-85 = "Эй, Макото. А что это за штуковина вон там?"
10033060-87 = ""
10033060-90 = "...?"
10033060-91 = ""
10033060-94 = ""
10033060-95 = ""
10033060-96 = ""
10033060-97 = ""
10033060-99 = ""
10033060-100 = "...А!"
10033060-101 = "...Ничего себе."
10033060-102 = "..."
10033060-103 = ""
10033060-105 = ""
10033060-107 = "В-ва-а... *всхлипывает*"
10033060-108 = "Ибуки?!"
10033060-110 = "Все, паника! Чрезвычайная ситуация!"
10033060-111 = "Ибуки?! Ты в порядке? Сацуки? У-успокойся!"
10033060-112 = ""
10033060-115 = "Что это за... штуки?!"
10033060-116 = "А?!"
10033060-117 = "(Я-я такого не утверждала!)"
10033060-118 = "(С-спокойно. Сначала свяжусь со студентами, отвечающими за костюмы.)"
10033060-119 = ""
10033060-122 = ""
10033060-123 = "Алло, говорит команда экскурсоводов. Сейчас отправлю координаты, но здесь появились странные призрачные костюмы, которые заранее не были согласованы."
10033060-124 = "...А? Если на эту точку никого не назначали, значит..."
10033060-125 = ""
10033060-128 = "П-помогите... Ибуки страшно... Ироха, Макото!"
10033060-129 = "Всё хорошо, Ибуки. Иди сюда. Я не позволю, чтобы с тобой что-то случилось!"
10033060-130 = "Похоже, это не было частью плана. Студенты Хяккияко слишком сильно перепуганы, чтобы это оказалось постановкой."
10033060-131 = ""
10033060-134 = ""
10033060-136 = "Угх! Как они смеют?! Я разберусь с вами с помощью гипноза."
10033060-137 = "Конечно. Давай. Звучит как отличная идея."
10033060-139 = "[ns] «Все, стойте! Что это...?»"
10033060-140 = "Все, стойте за мной."
10033060-141 = "Ты разве не видишь, что Ибуки плачет, Ироха?! Немедленно доставай «это»!"
10033060-142 = "Как обычно, я понятия не имею, что такое «это», а даже если бы знала, мы не в Геенне и я всё равно ничего не могу достать."
10033060-143 = "Но я не могу просто сидеть, пока Ибуки плачет."
10033060-144 = ""
10033060-146 = ""
10033060-147 = "Общество Пандемониума! Защитить Ибуки и атаковать угрозу!"
10033060-148 = "Ура! Вперёд, вперёд!"
