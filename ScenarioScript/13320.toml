13320-210 = "Esqueeece, ela apagou de vez."
13320-215 = "Sensei..."
13320-216 = "Conseguimos parar o Canhão Ferroviário por enquanto, mas o que é isso agora...?"
13320-217 = "O Canhão Ferroviário parece ser o menor dos nossos problemas agora?!"
13320-222 = "[ns] \"Hoshino, Hina...!\""
13320-232 = "Próximo;Manifestação"
