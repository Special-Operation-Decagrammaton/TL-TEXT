[translation]
13320-1 = "Episódio 32;A Única Verdade (2)"
13320-3 = "O legado do Imperador do Trovão deve dar trabalho... mas o Sensei e os outros vão dar um jeito."
13320-4 = "Assim que garantirem a segurança da Suou Asagiri, acho que eles vêm se juntar a nós.#nAté lá, comporte-se e espere quietinha."
13320-5 = "...Você também sabe que era melhor ter sido assim desde o começo,#nnão sabe?"
13320-9 = "..."
13320-10 = "Fala como se soubesse de tudo, senhorita Chefe do Comitê Disciplinar."
13320-12 = "Mas você podia mesmo ter certeza absoluta desde o começo?"
13320-13 = "Não tem como tudo sair do jeito que a gente quer. Na verdade, quase nunca sai."
13320-14 = "..."
13320-15 = "Quem morreu não volta à vida."
13320-16 = "O passado não pode ser mudado."
13320-17 = "Assim como a morte da Yume-senpai jamais será desfeita."
13320-18 = "Isso..."
13320-19 = "...Por quê?"
13320-20 = "Por que a senpai teve que morrer?"
13320-21 = "Onde foi que eu errei... pra ela ter um fim daqueles..."
13320-22 = "...Ei, por quê?"
13320-23 = "(Ela está tendo alucinações...?)"
13320-24 = "O caderno, cadê o caderno?"
13320-25 = "...?"
13320-30 = "Onde?"
13320-31 = "Onde é esse \"lá\" que a senpai disse?"
13320-32 = "Afinal, o que está escrito naquele caderno?"
13320-33 = "...?"
13320-34 = "Eu vou ter que viver para sempre sem saber as últimas palavras dela...?"
13320-35 = "(...Ela claramente não está bem)"
13320-37 = "Ohhh... falta pouco, falta só mais um pouco!"
13320-38 = "Os intrometidos já saíram do caminho."
13320-39 = "Mesmo que o caderno seja encontrado..."
13320-40 = "Não há a menor chance de Hoshino Takanashi descobrir a verdade sobre a morte de Yume Kuchinashi."
13320-41 = "A morte de Yume Kuchinashi já pertence a um passado distante!"
13320-42 = "Nós jamais poderemos alcançar a verdade absoluta que é a \"Morte\"."
13320-43 = "Pois essa é uma verdade imutável!"
13320-52 = "Contudo, Hoshino Takanashi de fato se tornou a existência que mais se aproximou da morte neste mundo.#n— Ó maior Mistério de Kivotos, divindade solar aprisionada na alvorada!"
13320-53 = "Você será a pista para a resposta do 6º Koan."
13320-54 = "Mostre-me o que acontece quando tamanha santidade#né exposta à \"Morte\"!"
13320-55 = "Essa é a recompensa concedida a mim, o vencedor!"
13320-57 = "Deve estar escrito naquele caderno."
13320-58 = "(Sim... você é alguém que deve conhecer a verdade)"
13320-59 = "...Sim. Eu tenho que encontrar, custe o que custar."
13320-60 = "(Lá estará a resposta que você tanto buscou)"
13320-61 = "Ei, com quem você está falando esse tempo todo...?"
13320-64 = "Eu não aguento mais isso!#nO Conselho Estudantil acabou!"
13320-65 = "Se eu não tivesse perdido a cabeça naquela hora..."
13320-68 = "Olha, olha, Hoshino-chan. É um cantil em formato de mochila!#nNão parece super prático?"
13320-69 = "Se eu não tivesse ido contra naquela hora..."
13320-72 = "E pra isso... primeiro, senpai, por favor, aceite isto."
13320-74 = "Hmm...?"
13320-75 = "Se eu não tivesse entrado no Conselho Estudantil naquela época..."
13320-78 = "Espere!"
13320-82 = "...Aii?!"
13320-90 = "Se eu não tivesse estendido a mão naquela hora..."
13320-93 = "Atenção, moradores!"
13320-94 = "Por favor, assinem o abaixo-assinado!"
13320-95 = "..."
13320-96 = "Na verdade, se eu nunca tivesse existido—"
13320-97 = "—A Yume-senpai não teria morrido."
13320-105 = "...Ah."
13320-106 = "—Eu sabia."
13320-107 = "Quem matou a Yume-senpai—"
13320-110 = "—Fui eu."
13320-115 = "A culpa é minha."
13320-116 = "Fui eu quem a matou."
13320-125 = "Fui eu, fui eu... fui eu."
13320-129 = "Fui eu."
