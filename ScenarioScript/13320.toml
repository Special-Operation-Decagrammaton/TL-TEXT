[translation]
13320-1 = "Эпизод 32;Одна истина 2"
13320-3 = "С оружием Тирана-Императора будет трудно справиться, но... Сенсей и Комитет по выплате долга как-нибудь разберутся."
13320-4 = "Сенсей задержит Суо, а затем встретится с нами здесь. Твоя единственная задача теперь — спокойно ждать."
13320-5 = "Ты ведь понимаешь... всё как-нибудь уладится, Таканаши Хошино."
13320-6 = ""
13320-8 = ""
13320-9 = "..."
13320-10 = "Говоришь так, будто знаешь всё на свете, глава Дисциплинарного комитета."
13320-12 = "...Но понимаешь..."
13320-13 = "...тебе кажется, будто у тебя есть ответы на всё... но в этом мире есть вещи, которые невозможно исправить."
13320-14 = "..."
13320-15 = "Мёртвых нельзя вернуть к жизни."
13320-16 = "И уже случившееся нельзя отменить."
13320-17 = "То, что Юмэ мертва, никогда не изменится. Никогда."
13320-18 = "Это..."
13320-19 = "Почему...?"
13320-20 = "Почему Юмэ должна была умереть...?"
13320-21 = "Где всё пошло не так? Почему Юмэ должна была встретить такой трагический конец...?"
13320-22 = "Почему...?"
13320-23 = "(...Что-то не так. Будто она смотрит сквозь меня... на то, чего здесь нет...)"
13320-24 = "...А тетрадь?"
13320-25 = "Тетрадь...?"
13320-26 = ""
13320-30 = "Где она может быть?"
13320-31 = "И что Юмэ там написала?"
13320-32 = "Где это место, в котором она якобы оставила тетрадь...?"
13320-33 = "...?"
13320-34 = "Неужели я проживу всю оставшуюся жизнь, так и не узнав, что она там написала?"
13320-35 = "(С Хошино что-то не так.)"
13320-37 = "Ах! Ах! Ещё немного, совсем чуть-чуть...!"
13320-38 = "Сенсея здесь нет. Никто не сможет вмешаться."
13320-39 = "Нам неведома абсолютная истина, имя которой — смерть."
13320-40 = "И поэтому Таканаши Хошино никогда не узнает правду о смерти Кучинаши Юмэ."
13320-41 = "Тетрадь? Она ничего не значит!"
13320-42 = "Ни один человек в этом мире не способен постичь смерть Кучинаши Юмэ!"
13320-43 = "Такова сама природа смерти!"
13320-44 = ""
13320-52 = "А ты приблизилась к ней ближе всех, ближе любого существа в этом мире. Великая Тайна Кивотоса. Хорус Рассвета! Бог солнца, скованный рассветом!"
13320-53 = "Ты — ключ к ответу на шестой коан!"
13320-54 = "А теперь покажи мне! Что станет с тобой, с божественным существом, столкнувшимся с тайной смерти?"
13320-55 = "Это мой величайший трофей! Я вкушу сладкие плоды своей победы!"
13320-57 = "...Но... есть одна вещь... в истинности которой я уверена..."
13320-58 = "(Да... существует истина, известная только тебе.)"
13320-59 = "И эта истина... должна быть записана в той тетради."
13320-60 = "(Да. Истина, от которой ты не можешь отвернуться! Ответы, которых ты так отчаянно жаждешь, обязательно должны быть там!)"
13320-61 = "...Таканаши Хошино? С кем ты разговариваешь...?"
13320-62 = ""
13320-64 = "К чёрту эту игру в студсовет! Я больше не собираюсь играть с тобой в семью!"
13320-65 = "Если бы я тогда не разозлилась..."
13320-66 = ""
13320-68 = "Смотри, Хошино! Бутылка для воды, которую можно носить как рюкзак! Купить?"
13320-69 = "Нет... Если бы я просто позволила ей купить ту бутылку..."
13320-70 = ""
13320-72 = "Так что вот. Возьми."
