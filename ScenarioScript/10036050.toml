10036050-226 = ""
10036050-227 = "Какая-то случайная участница Флаппи Банды шлемов косит всех подряд!"
10036050-228 = "Кто она такая? Этого нет в сценарии! Что с ней не так?"
10036050-229 = "Вы тоже не знаете, кто она?"
10036050-230 = ""
