[translation]
10036050-1 = "Эпизод 5;Водяная перестрелка Банды шлемов"
10036050-2 = ""
10036050-3 = "Я вернулась с обеда."
10036050-4 = "А, мисс Подработка!"
10036050-5 = "Спасибо за перерыв. Я признательна."
10036050-6 = "Что мне теперь делать?"
10036050-7 = "О, ничего особенного. Можешь просто отдыхать."
10036050-8 = ""
10036050-10 = ""
10036050-11 = "[ns] «(Ого, мы и правда сильно на него повлияли...)»"
10036050-12 = "Нет, мне не следует получать деньги за безделье."
10036050-13 = "Позвольте хотя бы убрать сцену или сделать что-нибудь ещё..."
10036050-14 = ""
10036050-17 = "Эй! Ты говоришь, тебе нечего делать?"
10036050-18 = ""
10036050-20 = ""
10036050-21 = ""
10036050-22 = ""
10036050-23 = "Идеально! У нас тут людей не хватает!"
10036050-24 = "У нас соревнование по стрельбе. Почему бы тебе не присоединиться?"
10036050-26 = "Стрельба? Не совсем понимаю, о чём речь, но я здесь как ассистент-телохранитель DJ B.o.B."
10036050-27 = "Я не могу его оставить."
10036050-28 = "О, всё нормально! Всё нормально! Никаких проблем!"
10036050-29 = "Однако..."
10036050-31 = "Ну, нет-нет, не переживай!"
10036050-32 = "Х-Хорошо..."
10036050-33 = "Это бой с водяными пистолетами. Будет весело!"
10036050-34 = ""
10036050-36 = ""
10036050-37 = ""
10036050-38 = "[ns] «Звучит весело. Почему бы тебе не попробовать?»"
10036050-39 = "Л-Ладно. Если даже вы так говорите, Сенсей..."
10036050-40 = "Тогда увидимся позже."
10036050-41 = ""
10036050-43 = ""
10036050-44 = "[ns] «(Надо проверить остальных девушек...)»"
10036050-46 = ""
10036050-47 = "А, Сенсей!"
10036050-48 = "Куда вы пропали? Я надеялась, что мы все пообедаем вместе."
10036050-49 = "[s1] «Возникла... небольшая ситуация.»\n[s2] «Мне нужно было кое с чем разобраться...»"
10036050-52 = "А, жаль. Мы выиграли раздачу и получили кучу бесплатной еды, хи-хи."
10036050-53 = "Хотелось бы поделиться с вами..."
10036050-54 = "[s] «Ничего. Я тоже хорошо пообедал.»"
10036050-55 = "Раз уж мы перекусили, может, снова проверим Сао-Сао?"
10036050-56 = "Уверена, она всё ещё работает на сцене."
10036050-57 = ""
10036050-59 = ""
10036050-60 = ""
10036050-61 = "Эта штука работает...? Внимание всем бандитам в шлемах! Объявление!"
10036050-62 = "На пляжной арене будет бой на водяных пистолетах, чтобы определить сильнейшее отделение!"
10036050-63 = "Королевская битва: честь каждого отделения на кону и огромный приз! Приходите посмотреть!"
10036050-64 = "И... да, вроде всё!"
10036050-65 = ""
10036050-67 = ""
10036050-68 = "[ns] «(Так вот во что втянули Саори...)»"
10036050-69 = "Бой на водяных пистолетах...? Казалось бы, Банда шлемов должна использовать настоящие пули."
10036050-70 = "Нет, они же не захотят ранить друг друга на собственном фестивале."
10036050-71 = "[s] «Ну что, пойдём посмотрим?»"
10036050-72 = "Но разве мы не собирались проверить Саори?"
10036050-73 = "Не знаю, если пойдём на бой, будет ощущение, будто мы её бросили."
10036050-74 = "[s] «Проверять её хорошо, но вам самим тоже стоит насладиться фестивалем.»"
10036050-75 = "Похоже, все собираются на арене."
10036050-76 = "Сао-Сао тоже может быть там."
10036050-78 = ""
10036050-79 = "Бандиты в шлемах и прочие нарушители, добро пожаловать на Пляж беззакония!"
10036050-80 = "Ну как вам летнее солнце? Жарко на вечеринке, а?"
10036050-81 = "А мы сейчас сделаем ещё жарче И одновременно охладим вас полноценной королевской битвой на водяных пистолетах!"
10036050-82 = "Мы из разных отделений и все хотим знать, кто сильнейший!"
10036050-83 = "Ну вот ваш шанс выяснить это прямо здесь, на новом поле боя!"
10036050-84 = "Пусть водяная война начнё-о-о-отся!"
10036050-85 = ""
10036050-90 = ""
10036050-91 = "Эй, Флаппи, кучкуемся."
10036050-92 = "Мы здесь просто ради участия. Не выпендриваемся и особо не стараемся."
10036050-93 = "Понятно?"
10036050-94 = ""
10036050-96 = ""
10036050-97 = ""
10036050-98 = "Да-да. Будем расслабленно."
10036050-99 = "(Эм, как вообще до этого дошло?)"
10036050-100 = ""
10036050-102 = ""
10036050-103 = ""
10036050-104 = "Так просто будет. Исход почти предрешён."
10036050-105 = "Предрешён?"
10036050-106 = "Эм, больше говорить не надо, так что остановимся."
10036050-107 = "И ты, дополнительный член команды. Всё слышала, да?"
10036050-108 = "..."
10036050-109 = "Да. Поняла."
10036050-110 = "Я этого не планировала, но раз нужно сражаться, выложусь ради команды."
10036050-111 = "Полный штурм. Никакой пощады."
10036050-112 = "Чего-о-о? По твоему ответу вообще не похоже, что ты поняла!"
10036050-113 = ""
10036050-114 = "Итак, правила простые!"
10036050-115 = "Знаю, выглядят как настоящее оружие, но это водяные пистолеты! Правда! Может, не похоже, но это так! Водяные пистолеты. И ничего больше."
10036050-116 = "А теперь заряжайтесь и накормите их свинцом! Побеждает последнее оставшееся отделение!"
10036050-117 = "Все отделения! По местам!"
10036050-119 = ""
10036050-120 = "Ого... Ничего не видно... Слишком много людей!"
10036050-121 = "Участников почти столько же, сколько зрителей. Раз, два, три... Здесь всегда было столько отделений?"
10036050-122 = "Может, толпа просто тоже хочет поучаствовать."
10036050-123 = "Я-Я найду место получше для просмотра... Сенсей, поможете мне забраться повыше?"
10036050-124 = "[s3] «Хорошо, залезай мне на спину.»\n[s4] «Конечно, раз, два...!»"
10036050-125 = ""
10036050-126 = ""
10036050-128 = ""
10036050-129 = ""
10036050-130 = ""
10036050-131 = ""
10036050-132 = "О-о, а можно я сяду вам на плечи, пока мы смотрим?"
10036050-133 = "[s5] «...Ладно.»\n[s6] Утвердительно крякнуть."
10036050-134 = ""
10036050-135 = ""
10036050-139 = "Х-Хи-хи, отсюда идеально видно. Место первого класса!"
10036050-140 = "Хотя если будем слишком шуметь, нас могут выгнать..."
10036050-141 = "...А?"
10036050-142 = ""
10036050-143 = "Что такое, Хиёри?"
10036050-144 = ""
10036050-146 = ""
10036050-147 = ""
10036050-148 = ""
10036050-149 = "Посмотрите на флаг отделения Флаппи Банды шлемов, там, у пляжа!"
10036050-150 = "Саори стоит прямо под ним!"
10036050-151 = ""
10036050-154 = ""
10036050-155 = "...И правда."
10036050-156 = "Похоже, мы замечаем её только тогда, когда вообще не ожидаем."
10036050-157 = "О-о, этот взгляд... Она полностью включила режим лидера!"
10036050-158 = "Не знаю ни почему, ни как, но она явно пришла участвовать."
10036050-159 = "Приятно видеть, что она наслаждается фестивалем."
10036050-160 = "Мы уверены, что она наслаждается?"
10036050-161 = "Думаешь, она победит?"
10036050-162 = "Против Банды шлемов? Да."
10036050-163 = "Если только на неё не навалятся слишком многие."
10036050-164 = "Ну, ей ведь и НЕ ОБЯЗАТЕЛЬНО побеждать."
10036050-165 = "Главное, чтобы ей было весело, правда?"
10036050-167 = ""
10036050-168 = "Все так завелись. Хотя что с того."
10036050-169 = "Пусть развлекаются. Мы все знаем, кто тут победит."
10036050-170 = "Чья очередь? На этот раз Колючие?"
10036050-171 = "Но да, все знают, что всё по сценарию."
10036050-172 = "Хотя зрелище всё равно должно быть неплохим. Смотреть будет весело."
10036050-173 = ""
10036050-175 = ""
10036050-176 = "[ns] «По сценарию?»"
10036050-177 = ""
10036050-180 = ""
10036050-181 = "...Этого мы не можем позволить."
10036050-182 = "Ага, Саори слишком старалась, чтобы проиграть!"
10036050-183 = "Никто не трогает нашего лидера!"
10036050-184 = ""
10036050-186 = ""
10036050-187 = ""
10036050-188 = ""
10036050-189 = "Х-Хи-хи... Сенсей, похоже, мне придётся ещё немного посидеть у вас на плечах..."
10036050-190 = ""
10036050-191 = ""
10036050-192 = "Готовы..."
10036050-194 = "Цельтесь... ОГОНЬ!!"
10036050-195 = "Хмф!"
10036050-196 = ""
10036050-198 = ""
10036050-199 = "Ого! Она быстрая!"
10036050-200 = "М-Мы же только начали?!"
10036050-201 = ""
10036050-203 = ""
10036050-205 = ""
10036050-207 = ""
10036050-209 = ""
10036050-210 = "Следующее!"
