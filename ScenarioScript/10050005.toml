[translation]
10050005-1 = "Пролог;Нет риска — нет прибыли"
10050005-2 = "Библиотека Академии Красной Зимы"
10050005-3 = ""
10050005-4 = ""
10050005-7 = "Ты в порядке, Мэру...?"
10050005-8 = "А как тебе кажется, Момидзи...?"
10050005-9 = "Да... конечно, нет..."
10050005-10 = "Но я кое-что поняла..."
10050005-11 = "Что именно, Мэру?"
10050005-12 = "Когда голодаешь три дня, мучает уже не сам голод..."
10050005-13 = "А полное отсутствие сил..."
10050005-14 = "По крайней мере пока. Думаю, скоро каждая мысль в голове начнёт крутиться вокруг еды."
10050005-15 = "Я уже на этой стадии, так что, может, всё будет нормально..."
10050005-16 = "Не думаю..."
10050005-17 = "Ты помнишь... когда закончат ремонт столовой?"
10050005-18 = "...Они СКАЗАЛИ, что завтра."
10050005-19 = "Ещё... всего один день... в этом трагическом состоянии. Слава богу."
10050005-20 = "...Вчера они говорили то же самое."
10050005-21 = "...Рабочая партия опять бастует?"
10050005-22 = "Мне вообще нужно отвечать?"
10050005-23 = "...С такими темпами даже неделя кажется оптимистичным прогнозом."
10050005-24 = "Может, нам... принять меры?"
10050005-25 = "Мы уже лишь оболочки самих себя... Зомби, беспомощно лежащие на полу библиотеки."
10050005-26 = "Разве не именно так мы сюда и попали? Потому что «приняли меры»?"
10050005-27 = "Всё потому, что наши книги не продавались! И никто не хотел оформлять премиум-подписку на сайте!"
10050005-28 = "Агх... У меня даже сил кричать нет..."
10050005-29 = ""
10050005-31 = ""
10050005-33 = "*шмыг* *всхлип* А настоящий корень этого зла — Секретариат, который вовремя не одобрил наше финансирование..."
10050005-34 = "В наши дни одними продажами книг уже не прокормишься..."
10050005-35 = "Будущее Фронта освобождения знаний будет таким же мрачным, как судьба лимитированного коллекционного фанбука с вырванными основными страницами..."
10050005-36 = "И тогда цивилизация погрузится во тьму, а человечество сделает один гигантский шаг назад..."
10050005-37 = ""
10050005-41 = ""
10050005-42 = "Ну-ну-ну. Ждали нашего долгожданного воссоединения, Фронт освобождения знаний? Нравится вам это или нет, Издательский отдел прибыл."
10050005-43 = "Как всегда жалкое зрелище, Мэрури. Я думала, даже ты не опустишься до того, чтобы использовать пол библиотеки вместо кровати. Вставай уже, прошу."
10050005-44 = "Да-да... Бла-бла-бла..."
10050005-45 = "Что...? Что за вялая реакция? С тобой случилась какая-то трагедия, Мэрури? Или твой неряшливый образ жизни наконец тебя настиг?"
10050005-47 = "Это трагедия, самая настоящая... Якумо, Таканэ..."
10050005-48 = "Так, всё идёт совсем не так, как я ожидала. Что за трагедия у вас, Момидзи?"
10050005-49 = "...У вас есть еда?"
10050005-50 = "Что...?"
10050005-52 = "Агх! А-а! Живот болит!"
10050005-53 = "Даже твой грубый желудок не выдержит столько еды сразу после трёх дней голода. Вот, вода."
10050005-54 = "Спасибо, Якумо, Таканэ... Я уже собиралась писать завещание..."
10050005-55 = "В тяжёлые времена для чего нужны друзья, верно? Чтобы начислять ежедневные проценты, пока долг не будет погашен. Хе-хе-хе."
10050005-57 = "Типичная вымогательница... Угх. Учитывая, что ты раздула угасающие угли нашего клуба, на этот раз я закрою глаза."
10050005-58 = "Причина, очевидно, в задержке клубного финансирования, но последствия слегка драматичны, не находишь?"
10050005-59 = "Ну... Я просто подумала, что, пока мы ждём, можно немного ускорить выпуск, чтобы продержаться до поступления денег. Но, похоже, мы перестарались."
10050005-60 = "А, да. Тот срочный манускрипт, который вы принесли нам на прошлой неделе. Теперь понятно, почему ты так изящно попросила «записать на ваш счёт»."
10050005-61 = "Я ошиблась... но откуда мне было знать?"
10050005-62 = "И вот такую печальную картину Издательский отдел застал, придя взыскать тот самый долг. С процентами."
10050005-63 = "Ну так выкладывай."
10050005-64 = "Серьёзно?! Ты сама видишь: у нас денег даже на крекеры нет! Может, сразу фунт мяса с меня вырежешь?"
10050005-65 = "Договорились."
10050005-66 = "...Серьёзно."
10050005-67 = "Да. С процентами."
10050005-68 = "Ты... Ты дьявол! Дьявол во плоти!"
10050005-70 = "Однако мне это кажется довольно странным. Несмотря на ваши обычно низкие продажи и упрямое желание делать всё, что вздумается..."
10050005-71 = "...не говоря уже о твоей заносчивой манере письма, которой плевать и на тренды, и на продаваемость—"
10050005-72 = "Ты пришла проценты взыскивать или действовать мне на нервы? Я уже поняла!"
10050005-73 = "Я веду к определённой мысли, Мэрури! Несмотря на все эти недостатки, у тебя есть отличный редактор Момидзи и преданные поклонники. Как же вы докатились до такого?"
10050005-74 = "Продажи были... за гранью ужасного... Даже хуже обычного..."
10050005-75 = "У вас остались непроданные экземпляры? Считай это бесплатной консультацией."
10050005-80 = "Н-ну...?"
10050005-81 = "...По крайней мере, проблему я определила."
10050005-82 = "К-какую...?"
10050005-83 = "Мэрури. Хочешь ты того или нет, у тебя сложился собственный бренд. Твои рукописи — только твои. Тебе мало дела до читателя, ты думаешь лишь о творческой целостности."
10050005-84 = "Этот образ одновременно стал твоим благословением и проклятием. Преданные фанаты пошли бы за тобой хоть в ад, но вероятность выйти в высшую лигу равна нулю."
10050005-85 = "Но это...! Я не могу придумать ни одного оправдания этому крысиным гнездом называемому манускрипту! В нём нет того самого вкуса Мэрури, на котором держится твой скромный успех! С каких пор ты пытаешься пресмыкаться перед массами?"
10050005-86 = "Ты и фанатов предала, и ВСЁ РАВНО не сумела понравиться широкой публике! Из пяти звёзд... Ты заслуживаешь... Да едва ли две! Полторы!"
10050005-87 = "Нет, хватит. Я не вынесу твоих заикающихся оправданий, Мэрури. Момидзи, объясни."
10050005-88 = "О-она сказала, что хочет чего-то другого, э-эм, кажется, её словами было «что-нибудь, что сработает»."
10050005-89 = "А потом из-за постоянно сдвигающихся сроков давление стало огромным, и Мэру немного сорвалась... Т-так что я вообще не смогла ничего отредактировать... По срокам это было физически невозможно!"
10050005-90 = "...Ладно. Это я приму. Но у меня есть ещё одна претензия."
10050005-92 = "И какая же...?"
10050005-93 = "Вопрос на засыпку: каков девиз Издательского отдела? Ответ: издать, напечатать, распространить."
10050005-94 = "Да, и именно я управляю этой святой троицей. Так что уж простите, когда я говорю, что эта маркетинговая стратегия — самая идиотская и непродуманная из всех, что мне доводилось видеть."
10050005-95 = "Агх?!"
10050005-96 = "ЧЕГО?!"
10050005-97 = "Возьми всё, что сказала Таканэ, и добавь сверху этот бардак в виде захолустного сайта, куда ты выложила работу. Даже Я никогда не видела адреса, заканчивающегося на «dot-fake»."
10050005-98 = "Крупные сайты... для нас слишком дорогие."
10050005-99 = "Я слышу лишь оправдания вашей несостоятельности! Это ИНТЕРНЕТ! Сделайте ХОТЬ ЧТО-НИБУДЬ!"
10050005-100 = "Будто вы вообще НЕ ХОТИТЕ ничего продавать. Приложив хоть немного усилий, вы могли бы КАК МИНИМУМ найти сайт получше этого мусора!"
10050005-101 = "Е-если сделать что-то хорошее, оно само продастся!"
10050005-102 = "Если бы это было правдой, маркетинга вообще не существовало бы!"
10050005-103 = "Я даже не смогу сосчитать, сколько отличных товаров кануло в пустоту из-за плохого продвижения!"
10050005-104 = "Но уверена, их как минимум столько же, сколько книг у вас здесь, в библиотеке Фронта освобождения знаний!"
10050005-105 = "Ты преувеличиваешь!"
10050005-107 = "Нет! Если учитывать всю историю человечества, цифры будут ОШЕЛОМЛЯЮЩИМИ. Но творцы...!"
10050005-108 = "Творцы! Вот же! Всё только о творчестве и художественной целостности, а деловой хватки — ноль, как и малейшего желания вообще показать свои работы публике!"
10050005-109 = "О-откуда в тебе столько страсти?!"
10050005-110 = "Похоже, ты задела больное место, Мэрури."
10050005-112 = "Вернёмся к делу. Подводя итог: если Фронт освобождения знаний не заработает на оставшемся тираже, проблемы будут и у Издательского отдела."
10050005-113 = "А? Но тогда...? Хм. Хмм. Хм? Неужели...?"
10050005-114 = "Президент? Вы начинаете меня пугать."
10050005-115 = "Оставь, Таканэ. Хе-хе-хе."
10050005-116 = "Ладно, Мэру. Я предложу тебе сделку."
10050005-117 = "Сделку...? С тобой? Угх... Звучит ужасно во всех возможных смыслах."
10050005-118 = "Тебе стоит доверять мне хоть немного больше. Я же не ВСЕГДА поступаю с тобой плохо."
10050005-119 = "Особенно выделю слово «всегда»."
10050005-120 = "Слушай, тебе нужны деньги. Эта сделка принесёт тебе деньги. Мне правда нужно и дальше разжёвывать?"
10050005-121 = "Угх... Ладно. Ближе к делу."
10050005-122 = "Спасибо, что сэкономила нам обеим время. Условия такие: мы займёмся оставшимся тиражом Фронта освобождения знаний."
10050005-124 = "Что...?"
10050005-125 = "...А?"
10050005-126 = "Бесплатных обедов, конечно, не бывает. Мы подключаем наши глубокие карманы и полезные связи, берём на себя продажи и распространение..."
10050005-127 = "...а взамен получаем процент от прибыли. Справедливо, разве нет?"
10050005-128 = "Ни за что! Я отказываюсь! Сделки, обмены и торговля с тобой никогда для меня хорошо не заканчиваются!"
10050005-129 = "Мэру! Мэру! Думаю, Якумо тут права...!"
10050005-130 = "Она права в том, что сами мы с таким огромным тиражом не справимся, а маркетинговых ресурсов у нас ровно ноль..."
10050005-131 = "Неужели гордость стоит того, чтобы утонуть вместе со всем этим тиражом?"
10050005-132 = "И они занимают столько места... Такие тяжёлые и громоздкие..."
10050005-134 = "Хм? Родственная душа? Не часто встретишь делового партнёра, который смотрит на вещи так же, как я."
10050005-135 = "Гах, хуже и быть не могло! Но ты права, Момидзи. Мы в тупике, и это наша единственная спасательная верёвка. Ладно. Будь по-твоему. Я согласна!"
10050005-136 = "Хороший выбор. Тогда начнём переговоры по контракту. Что до распределения прибыли... Как насчёт... 9 к 1?"
10050005-137 = "...И девять — это нам?"
10050005-138 = "Это должна была быть шутка?"
10050005-139 = "Ты мошенница до мозга костей!"
10050005-141 = "Президент, президент! Даже я должна сказать, что ставка немного агрессивная, разве нет?"
10050005-143 = "Улица кампуса «Красной Зимы»"
10050005-144 = "*вздох* ...Наконец-то переговоры завершены."
10050005-145 = "Как только продадим тираж, останется лишь отправить им их долю прибыли."
10050005-146 = "И посмотри, сколько тут всего. Вот же, сколько они вообще надеялись на этом заработать?"
10050005-147 = "В любом случае, идём, Таканэ! Покажем им, чего стоит Издательский отдел!"
10050005-151 = ""
10050005-152 = "Не может быть...!"
10050005-153 = ""
10050005-155 = ""
10050005-157 = "Мы не смогли продать ни одной..."
10050005-158 = "Как?! Стратегия продаж была идеальной!"
10050005-159 = "Если анализировать ситуацию... Начнём с того, что книга Мэрури местами вполне читабельна..."
10050005-160 = "Хм, но для среднего ученика Красной Зимы она просто слишком предсказуема."
10050005-161 = "И, как мы уже обсуждали, она застряла где-то посередине: отталкивает фанатов, но и массам не угождает."
10050005-162 = "Какой бы хорошей ни была история, после третьего пересказа она теряет привлекательность. Говорят, обычные авторы склонны снова и снова повторять то, что умеют."
10050005-163 = "Опытные авторы пробуют себя в двух-трёх специализациях или жанрах, а гении — ещё в большем числе. Похоже, это попытка Мэрури вырасти."
10050005-164 = "Но, опять же, подобная литература здесь, в Красной Зиме, слишком обыденна."
10050005-165 = "...Да, именно, Таканэ. Но есть ещё одна фундаментальная проблема."
10050005-166 = "What's that, President?"
10050005-168 = "У учеников Красной Зимы пустые кошельки и урчащие животы!"
10050005-169 = "Даже если это правда, президент, не обязательно говорить это вслух!"
10050005-170 = "Будем честны: когда денег мало, развлечения и культурные занятия первыми идут под нож."
10050005-171 = "Президент, как вы можете такое говорить, работая в издательской отрасли...?"
10050005-172 = "Именно поэтому я постоянно думаю об этих проблемах!"
10050005-173 = "В-в любом случае, мы просто преодолеем эти пустяковые препятствия. Р-разве не в этом долг Издательского отдела?"
10050005-174 = "Всё равно больше половины наших средств приходит от распространения пропаганды президента Черино и платы за печать «Красного Медведя»!"
10050005-175 = "Стоит ли говорить об этом прямо здесь?! Особенно когда предыдущего главного редактора «Красного Медведя» уже подвергли чистке и он до сих пор пропал без вести!"
10050005-176 = "...Да. Ты права. А всех учеников из Редакционного отдела перевели к нам."
10050005-177 = "*вздох* До этого Издательский отдел прекрасно справлялся."
10050005-178 = "Вообще-то прибыль Издательского отдела выросла с тех пор, как к нам присоединился Редакционный отдел."
10050005-179 = "Меня скорее раздражает сам принцип вмешательства Секретариата в наши дела."
10050005-180 = "Хе-хе-хе. Критический дух у тебя в крови, Таканэ."
10050005-181 = "С точки зрения финансового управляющего Издательского отдела у меня к нынешней ситуации претензий нет."
10050005-182 = "Так или иначе, вернёмся к нашей загадке, которую я, кстати, уже решила. Я знаю, в чём фундаментальная проблема нашей текущей стратегии."
10050005-183 = "What's that, President?"
10050005-184 = "Наша главная проблема в том, что..."
10050005-185 = "...мы пытаемся заработать деньги там, где денег нет!"
10050005-186 = "По сравнению со всеми другими школами Красная Зима бедна до самого основания!"
10050005-187 = "Из сухого полотенца много воды не выжмешь!"
10050005-188 = "Х-хотя я согласна с вашей оценкой, не думаю, что сейчас мы можем что-то с этим сделать..."
10050005-189 = "ЕСТЬ кое-что, что мы можем сделать, Таканэ. Выход есть всегда."
10050005-190 = "И что же... это?"
10050005-191 = "Главное, что нужно учитывать в бизнесе, — позиционирование. Второе? Позиционирование. А третье? Тоже позиционирование."
10050005-192 = "Если здесь денег нет — иди по их следу. Туда, где чтение книг является неотъемлемой частью культуры."
10050005-193 = "Есть такое место?"
10050005-194 = "Разумеется. И это место..."
10050005-196 = "...Общая школа Тринити."
10050005-198 = ""
10050005-199 = "Погодите, президент?! Вы собираетесь лично отправиться в Тринити?! В совершенно другой школьный округ?!"
10050005-200 = "Нет риска — нет прибыли! За мной, Таканэ! Будешь тормозить — оставлю тебя позади!"
10050005-201 = ""
10050005-203 = ""
10050005-204 = ""
10050005-205 = "Президент? Президент?!?!"
10050005-206 = ""
10050005-208 = ""
