[translation]
2401-1 = "Снимаем промо клуба! Часть 1"
2401-2 = "Клуб внутренней дисциплины..."
2401-3 = "Это клуб, где собираются самые красивые девушки Хяккияко..."
2401-4 = "...чтобы тренироваться и воспитывать себя!"
2401-5 = "Одна из них делает это ради максимально комфортного ночного сна..."
2401-6 = "Другая — чтобы стать самой безупречной леди в мире!"
2401-7 = "А ещё одна особенно милая и энергичная!"
2401-8 = "Последняя — талисман Клуба внутренней дисциплины, который постоянно излучает позитив!"
2401-9 = "Здесь, в Клубе внутренней дисциплины, она тренируется, чтобы стать самой потрясающей женщиной в мире!"
2401-10 = "Разве не звучит как замечательный клуб?"
2401-11 = "Сегодня я проведу для вас грандиозную экскурсию по Клубу внутренней дисциплины!"
2401-12 = "..."
2401-13 = "Хммм... Бах!"
2401-14 = "Стоп! Стоп! С самого начала!"
2401-16 = "Нет, совсем не так я это представляла."
2401-17 = "У меня в голове всё было куда живее и ярче..."
2401-18 = "...чтобы любой, кто посмотрит, сразу сказал: «Не могу дождаться, когда вступлю в этот клуб!»"
2401-19 = "[s] «Что ты делаешь, Каэдэ?»"
2401-20 = "Ого! Что за...?!"
2401-21 = "Сенсей, вы меня напугали!"
2401-22 = "Что я сейчас делаю?"
2401-23 = "Ну, приготовьтесь!"
2401-24 = "Сейчас я..."
2401-25 = "...снимаю промо-видео Клуба внутренней дисциплины!"
2401-26 = "Недавно в Хяккияко проводили конкурс UCC, где были промо разных клубов!"
2401-27 = "[s1] «Реклама клубов?»\n[s2] «Конкурс UCC?»"
2401-28 = "Ага! Это конкурс, где каждый клуб делает и отправляет видео, представляющее клуб!"
2401-29 = "Ага! Это конкурс, где каждый клуб делает и отправляет видео, представляющее клуб!"
2401-30 = "В Хяккияко часто проводят подобные конкурсы и турниры."
2401-31 = "Поскольку разные клубы часто конфликтуют, мы устраиваем такие мероприятия, чтобы выяснить, кто лучше."
2401-32 = "[s] «Выяснить, кто лучше...?»"
2401-33 = "Ага! Это соревнование! Поэтому мы не можем проиграть!"
2401-34 = "Это как эпоха Сражающихся царств, только для конкурсов UCC!"
2401-35 = "В прошлый раз Клуб Инь-Ян забрал золото на турнире «Хяккияко: чемпион каруты»."
2401-36 = "Но в этот раз всё будет иначе!"
2401-37 = "Люди любят говорить, что Клуб внутренней дисциплины — место для чудаков..."
2401-38 = "Но с правильным видео мы избавимся от всех этих слухов и точно победим!"
2401-39 = "[s] «Слухов...?»"
2401-40 = "Да! Это всё недоразумение!"
2401-41 = "Мне нужно рассказать остальным, насколько Клуб внутренней дисциплины на самом деле потрясающий."
2401-42 = "Ну, а если я выиграю конкурс и призовые деньги, то смогу купить легендарного Золотого жука-геркулеса..."
2401-43 = "Нет, забудьте!"
2401-44 = "Я хотела сказать, деньги пойдут в бюджет Клуба внутренней дисциплины..."
2401-45 = "...ещё одна ступенька на пути к тому, чтобы стать потрясающей леди!"
2401-46 = "Два зайца одним выстрелом! Как экономно! Ага! Теперь я точно стану потрясающей!"
2401-47 = "[s] «Отлично, я буду за тебя болеть.»"
2401-48 = "Спасибо, Сенсей! Когда выиграю, обязательно угощу вас чем-нибудь вкусным!"
2401-49 = ""
2401-50 = "Но..."
2401-51 = "Есть одна вещь, которая меня беспокоит."
2401-52 = "Я работаю над видео, но ему не хватает того самого «вау-эффекта», понимаете?"
2401-53 = "То есть победа в конкурсе и так очевидна..."
2401-54 = "...ведь в видео в роли репортёра буду я, супермилый талисман Клуба внутренней дисциплины..."
2401-55 = "[s] «Вот это уверенность...»"
2401-56 = "Но всё равно хочется добавить чего-то ещё... того самого «бам»! «Бабах»! «Вау», которое всё решит..."
2401-57 = "Что посоветуете?"
2401-58 = "[s3] «Мыслите шире. Не ограничивайтесь простым представлением.»\n[s4] «А что, если не просто представить клуб, а сделать что-то ещё?»"
2401-59 = "Значит, вместо того чтобы просто рассказывать о клубе..."
2401-60 = "Значит, вместо того чтобы просто рассказывать о клубе..."
2401-61 = "...я покажу, что мы здесь делаем и как?"
2401-62 = "Будет будто человек сам попробовал клуб, просто посмотрев видео!"
2401-63 = "Хмм... Да!"
2401-64 = "Одобряю! Отличная идея, Сенсей!"
2401-65 = "Как я и ожидала от вас!"
2401-66 = "Ни один другой взрослый не даёт мне советов, от которых сердце так поёт..."
2401-67 = "Не будет преувеличением сказать, что вы превзошли силы обычного взрослого. Вы... супервзрослый!"
2401-68 = "[s] «Эм, да. Спасибо?»"
2401-69 = "Ладно! Сделаю прямо сейчас! Пока, Сенсей!"
2401-70 = ""
2401-73 = "[ns] «Эм... Удачи?»"
