[translation]
12100-1 = "Episódio 10;Kaiser PMC (2)"
12100-7 = "Haah, haah..."
12100-8 = "...Ufa."
12100-9 = "Isso não tem fim mesmo..."
12100-11 = "...sei, está me ouvindo? Rompam o cerco... de novo..."
12100-12 = "...está instável... rápido... recuem..."
12100-13 = "...se... aproximando..."
12100-23 = "...Sem saída?"
12100-24 = "Fomos cercadas, hein..."
12100-25 = "..."
12100-32 = "Ouvi dizer que havia invasores... mas não esperava que fossem de Abydos."
12100-33 = "Q-Quem é esse cara..."
12100-34 = "..."
12100-35 = "(Aquele cara é...)"
12100-36 = "Jamais imaginei que viriam até aqui... mas tudo bem."
12100-38 = "Agora que a Presidente do Conselho Estudantil não está mais aqui, devo entender que você, como vice-presidente, assumirá o pagamento da dívida? Takanashi Hoshino-san?"
12100-39 = "Ou então... prefere aceitar a minha proposta?"
12100-41 = "(Daquela vez...)"
12100-42 = "O valor de todos esses danos causados por invadirem propriedade privada sem permissão e causarem essa bagunça..."
12100-43 = "Eu até poderia acrescentar à dívida da escola de vocês, mas bem, não faria muita diferença no total..."
12100-44 = "Você é o cara daquela vez..."
12100-45 = "...Se bem me lembro, você é a presidente do conselho estudantil que a Gematria estava de olho... não, a vice-presidente, certo?"
12100-46 = "...Hmm, tive uma ideia interessante. Parece bem melhor do que contratar a Faz-Tudo ou a Gangue dos Capacetes."
12100-47 = "Faz-Tudo...? D-Do que você está falando?"
12100-48 = "...Quem são vocês?"
12100-49 = "...Não acredito que não saibam quem eu sou. Sendo de Abydos, achei que vocês me conheceriam muito bem."
12100-50 = "Eu sou um dos diretores da Kaiser Corporation."
12100-53 = "E também sou a pessoa a quem vocês, do Colégio Abydos, devem dinheiro."
12100-54 = "!!"
12100-55 = "...Mentira?!"
12100-61 = "Pois bem, que tal termos uma conversinha sobre essa dívida tão antiga?"
12100-63 = "Próximo;Uma Batalha Perdida"
