[translation]
1006105-1 = "Прогулка по коридорам"
1006105-2 = "Сакурако провела меня в один из внутренних коридоров собора."
1006105-3 = "Так поздно ночью весь свет был выключен, и вокруг не было ни души."
1006105-4 = "Спасибо, что пришли, Сенсей."
1006105-5 = "Я ждала."
1006105-6 = ""
1006105-9 = ""
1006105-10 = "Поблагодарить за то, что вы откликнулись на мой зов, и извиниться за столь поздний час."
1006105-11 = "Мне были нужны место и время, когда вокруг никого не будет."
1006105-12 = "Причина, по которой я позвала вас сегодня... довольно личная."
1006105-13 = "Я надеялась, что вы выслушаете мою исповедь."
1006105-14 = "Обычно выслушивать чужие исповеди и помогать с молитвой — моя обязанность."
1006105-15 = "Но хотя бы сегодня, в этот момент..."
1006105-16 = "Но сегодня, хотя бы на этот миг..."
1006105-17 = ""
1006105-19 = ""
1006105-20 = ""
1006105-22 = "Я хочу, чтобы вы услышали мой секрет, Сенсей."
1006105-23 = "[s1] «Твой секрет? Что-то случилось?»\n[s2] «Твоя исповедь? Что-то случилось?»"
1006105-26 = "Хи-хи. Пожалуй, можно и так сказать. А может, и нет."
1006105-27 = "А в вашем случае... Возможно, вы уже этого ожидали."
1006105-28 = "Но... признаюсь, я всё ещё колеблюсь."
1006105-29 = "Это может стать ещё одним бременем, которое вам придётся нести. Меньше всего я хочу становиться причиной ваших тревог."
1006105-30 = "И даже само знание об этом..."
1006105-31 = ""
1006105-33 = ""
1006105-34 = "Если хотите, можете прямо сейчас развернуться и вернуться в Шале. Сегодня вам не обязательно выслушивать что-либо ещё."
1006105-35 = "Клянусь, я не расстроюсь и не разочаруюсь, если вы так решите."
1006105-36 = "[s3] «Как учитель, я не могу так поступить.»\n[s4] «Ты лишь заставила меня хотеть узнать ещё больше.»"
1006105-39 = "Хи-хи. Вот как? Признаюсь, я примерно такого ответа и ожидала."
1006105-40 = "Я чувствовала, что вы согласитесь, и это помогло мне набраться смелости. Поэтому ваши слова придали мне уверенности."
1006105-41 = "Тогда, в таком случае..."
1006105-42 = ""
1006105-44 = ""
1006105-45 = "Прогуляемся? Я хочу немного успокоить нервы."
1006105-52 = "Правда в том, что я, как член Сестринства..."
1006105-53 = "Знаю некоторые вещи, о которых нельзя рассказывать остальному миру. В некоторых случаях даже предусмотрены меры против разглашения."
1006105-54 = "Думаю, в определённой степени..."
1006105-55 = "У любой организации такого размера и возраста, как Сестринство, неизбежно появляются тайны."
1006105-56 = "Можно сказать, это неизбежно."
1006105-57 = "Конечно, даже внутри Сестринства большинство не знает всех наших секретов или знакомо с ними только в рамках священных текстов."
1006105-58 = "Есть слишком много обстоятельств, из-за которых об этих вещах невозможно говорить с другими."
1006105-59 = "И, к сожалению..."
1006105-60 = "Я не могу раскрыть эту информацию даже вам, Сенсей. Это ещё одна причина моих переживаний."
1006105-61 = ""
1006105-63 = ""
1006105-64 = ""
1006105-65 = "А. Да. Именно этого я и боялась..."
1006105-66 = "Наверное, довольно бессердечно говорить вам, что у меня есть секреты, и при этом не раскрывать их."
1006105-67 = "[s5] «Для меня важно не это.»\n[s6] «Меня больше интересует твоя история, Сакурако.»"
1006105-70 = "Сенсей..."
1006105-71 = "Хи-хи."
1006105-72 = "Где же я уже слышала нечто подобное?"
1006105-73 = "Ну..."
1006105-74 = ""
1006105-76 = ""
1006105-77 = ""
1006105-79 = "Если честно, именно поэтому я и позвала вас сегодня."
1006105-82 = "― Я не хочу ничего скрывать...[wa:2760]"
1006105-84 = "― Тем более от вас.[wa:10]"
1006105-87 = "― Но из-за моего положения..."
1006105-89 = "― мне трудно раскрыть всё...[wa:240]"
1006105-92 = "― И всё же...[wa:1280]"
1006105-94 = "― одно то, что я могу сказать вам...[wa:1320]"
1006105-97 = "― что мне приходится хранить секрет, уже приносит облегчение.[wa:1690]"
1006105-100 = "― Я знаю...[wa:1480]"
1006105-102 = "― что вы можете меня не понять.[wa:10]"
1006105-105 = "― Я и не жду этого..."
1006105-108 = "― И всё же я...[wa:1450]"
1006105-110 = "― хочу, чтобы вы приняли меня такой, какая я есть.[wa:1200]"
1006105-113 = "― Эм...[wa:1010]"
1006105-116 = "― Я нервничала."
1006105-118 = "― Я думала, что, узнав об этом, вы перестанете мне доверять...[wa:10]"
1006105-121 = "― Мне и в голову не приходило...[wa:1120]"
1006105-123 = "― что я так быстро услышу такой ответ.[wa:10]"
1006105-126 = "― Я искренне благодарю вас, Сенсей.[wa:3250]"
1006105-129 = "Я рада, что теперь смогу молиться за вас с ещё более лёгким и искренним сердцем, чем прежде."
1006105-130 = "Пусть все ваши будущие начинания будут благословлены счастьем и удачей."
1006105-131 = "Возможно, я уже говорила это раньше. Но надеюсь, повторение поможет вам почувствовать силу моих чувств."
1006105-132 = ""
1006105-134 = ""
1006105-135 = "Каждый час, пока я бодрствую, каждое мгновение..."
1006105-136 = "Я буду молиться за вас, Сенсей."
1006105-138 = "Мы ещё немного побродили по собору, беседуя на более лёгкие темы, а затем я вернулся в Шале."
