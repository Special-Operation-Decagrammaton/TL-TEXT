[translation]
70001020-1 = "Термы Акай 2"
70001020-2 = ""
70001020-3 = "Так вы..."
70001020-4 = "Вы делегация из академии Красная Зима, которая прибыла посмотреть нашу баню...?"
70001020-5 = ""
70001020-7 = ""
70001020-8 = ""
70001020-9 = "Да. Я Амами Нодока из Федеральной академии Красная Зима и по особому разрешению президента Черины изучаю купальные помещения академии Геенна."
70001020-10 = "Должна сказать, мне не терпится лично испытать знаменитые горячие ванны Геенна."
70001020-11 = "Надеюсь на ваше сотрудничество."
70001020-13 = "Хааа... После последней поездки председателя Макото в академию Красная Зима я ожидала, что что-нибудь всплывёт, но..."
70001020-14 = "Она и правда умеет создавать раздражающую работу, о которой никто не просил..."
70001020-16 = "...Есть проблема?"
70001020-18 = "Нет-нет. Пожалуйста, купайтесь сколько захотите."
70001020-19 = "Общежития Геенна обычно живут сами по себе... Я лично почти ими не занимаюсь."
70001020-21 = "Сами по себе? Но здесь так чисто и всё отлично обслуживается."
70001020-22 = ""
70001020-24 = ""
70001020-25 = ""
70001020-26 = "Ага, и полотенца такие мягкие. И посмотри, сколько дорогой косметики!"
70001020-28 = "О, это..."
70001020-29 = "Отдел горячих источников сделал всё это по собственной инициативе."
70001020-31 = "По... собственной инициативе?"
70001020-33 = "Ага. Изначально в центре помещения была всего одна большая горячая ванна, а из мыла — только дешёвое с запахом огурца..."
70001020-34 = "Но потом Отдел горячих источников решил, что за горячими источниками академии Геенна плохо ухаживают, и с тех пор они сами занимаются обслуживанием."
70001020-35 = ""
70001020-38 = ""
70001020-39 = ""
70001020-40 = ""
70001020-41 = "(Так купальнями здесь управляет Отдел горячих источников... Это был пробел в наших разведданных.)"
70001020-42 = ""
70001020-44 = ""
70001020-46 = ""
70001020-47 = ""
70001020-48 = ""
70001020-49 = ""
70001020-51 = ""
70001020-52 = "Вода тоже довольно приятно пахнет... Отдел горячих источников добавляет соли для ванн или что-то такое?"
70001020-54 = "Нет, это естественный запах местных горячих источников."
70001020-55 = "Подземная вода, текущая от вулкана Hinnom, содержит серу, поэтому, поднимая её к академии, студенты могут купаться в горячих источниках по всей Геенна."
70001020-56 = "Это одна из уникальных особенностей района Геенна."
70001020-57 = ""
70001020-59 = ""
70001020-60 = ""
70001020-61 = ""
70001020-62 = ""
70001020-64 = ""
70001020-65 = ""
70001020-66 = "(Значит, нужно учитывать и то, что грунтовые воды отличаются от места к месту...)"
70001020-67 = ""
70001020-69 = ""
70001020-70 = "...Можно мне искупаться и проверить воду на себе?"
70001020-72 = "Конечно, пожалуйста."
70001020-74 = "Так, посмотрим..."
70001020-75 = ""
70001020-77 = ""
70001020-78 = ""
70001020-79 = ""
70001020-80 = ""
70001020-81 = "Ай! Горячо!"
70001020-82 = "Ч-Что это такое?! Почему вода настолько горячая?!"
70001020-84 = "Ванна слишком горячая? Тут всего 70°C..."
70001020-86 = "70 градусов?! Это температура для сябу-сябу в горячем горшке, а не для расслабления в ванне!"
70001020-87 = "Кто полезет в такую воду, точно ошпарится!"
70001020-89 = "Странно. Студенты Геенна сами просили поддерживать такую температуру. Они даже жалуются, если мы её меняем..."
70001020-91 = "Не могу говорить за студентов Геенна, но студенты нашей академии Красная Зима точно не захотят сварить себя заживо."
70001020-92 = "Есть ванны с более низкой температурой?"
70001020-93 = ""
70001020-95 = ""
70001020-96 = ""
70001020-97 = ""
70001020-98 = "Холодные ванны здесь."
70001020-100 = "Так, посмотрим..."
70001020-101 = ""
70001020-103 = ""
70001020-104 = ""
70001020-105 = ""
70001020-106 = ""
70001020-107 = "А-а, ледяная!"
70001020-108 = "Почему холодная ванна наполнена водой со льдом?!"
70001020-110 = "Ого, прямо ностальгия по тем временам, когда нам приходилось мыться в замёрзшей реке позади института..."
70001020-112 = "А почему нет? Говорят, переход от горячей воды к холодной стимулирует кожу и работает как естественная косметическая процедура."
70001020-113 = "Такая интенсивная стимуляция популярна в Геенна, поэтому все наши ванны поддерживаются именно при таких температурах..."
70001020-114 = "Возможно, для студентов Красная Зима это слишком сурово."
70001020-116 = "Это сурово не только для людей из академии Красная Зима, а вообще для жизни как явления!"
70001020-117 = "И без помощи Отдела горячих источников воссоздать такую систему в академии Красная Зима будет трудно..."
70001020-118 = "Очевидно, нужно проверить купальные помещения и других академий!"
70001020-120 = "ДИСКВАЛИФИЦИРОВАНО"
70001020-123 = ""
70001020-124 = "Общая школа Тринити приветствует специальную делегацию из академии Красная Зима."
70001020-125 = "Другие студенты сообщили мне о вашем прибытии."
70001020-126 = "...Также меня уведомили, что в академии Геенна у вас произошёл неприятный опыт."
70001020-127 = "Н-Нет, я бы не стала называть его... неприятным."
70001020-128 = "Ваша дипломатичность делает вам честь, но я не ожидаю, что академия, неспособная контролировать собственных студентов, умеет должным образом принимать гостей и заботиться о них."
70001020-129 = "Пожалуйста, выпейте чаю и немного освежитесь. Мы проводим вас к купальням, как только обслуживающий персонал закончит уборку."
70001020-130 = ""
70001020-132 = ""
70001020-133 = ""
70001020-134 = "О-Ого... Они принесли целую кучу дорогого чёрного чая и закусок."
70001020-135 = "Думаешь, после экскурсии нам разрешат забрать немного с собой...?"
70001020-136 = ""
70001020-138 = ""
70001020-139 = ""
70001020-140 = "Какой глубокий вкус! Я мало знаю о чае, но эти листья наверняка дорогущие!"
70001020-141 = "Если бы я знала, что они устроят чаепитие, принесла бы брусничное варенье, которое приготовила."
70001020-142 = "Когда тебя балуют с самого порога — это прекрасное первое впечатление..."
70001020-143 = ""
70001020-145 = ""
70001020-146 = ""
70001020-148 = ""
70001020-150 = ""
70001020-151 = "Прошу прощения за ожидание. Купальни уже чистые, следуйте за мной."
70001020-153 = ""
70001020-154 = "Мм-м... Как приятно пахнет..."
70001020-155 = "Я чувствую в воде слабый аромат чёрного чая."
70001020-156 = ""
70001020-158 = ""
70001020-159 = ""
70001020-160 = "У вас превосходное обоняние."
70001020-161 = "В общежитиях Тринити мы не только подаём вкусный чай, но и добавляем чайные листья в воду для ванн."
70001020-162 = "Они не только придают нашим ваннам определённое... je ne sais quoi, но и высвобождают содержащиеся в листьях полезные вещества, которые благотворно действуют на здоровье, впитываясь через кожу."
70001020-163 = "Температура воды... Посмотрим..."
70001020-164 = ""
70001020-166 = ""
70001020-168 = ""
70001020-170 = "Ох, это идеальная температура для приятной ванны!"
70001020-171 = "Поддержание оптимальной температуры важно и при заваривании чая, и при наполнении ванны, а значит, это ключ к здоровому телу и духу."
70001020-172 = "Элегантные купальные помещения Тринити на голову выше тех, которыми управляют некоторые... невоспитанные академии, обжигающие тела и напитки кипятком."
70001020-173 = "Вот как..."
70001020-174 = "Что скажете? Рассмотрите возможность установить в академии Красная Зима такие же купальные помещения, как в Тринити?"
70001020-175 = "Думаю, студентам академии Красная Зима тоже понравится..."
70001020-176 = "Как считаешь, Шигурэ?"
70001020-177 = ""
70001020-179 = ""
70001020-181 = ""
70001020-182 = "Хм, простите за такой прямой вопрос, но..."
70001020-183 = "Сколько всё это стоит в обслуживании?"
70001020-185 = "О, само помещение, если учитывать всё, не такое уж дорогое..."
70001020-186 = "Если сложить стоимость ухода за плиткой из костяного фарфора и цену чайных листьев, которые идут в ванну..."
70001020-187 = ""
70001020-189 = ""
70001020-190 = "Мы закладываем как минимум миллион иен в месяц."
70001020-192 = "Что?! Настолько дорого?"
70001020-194 = "Дорого? Чайные листья, которыми мы наполняем ванны, крайне доступны — всего каких-то 10 000 иен за ведро."
70001020-195 = "Неловко признавать, но по сравнению с чёрным чаем, который мы пьём, листья для ванн очень низкого качества..."
70001020-197 = "Подумать только, чайные листья дороже 10 000 иен за ведро считаются низкокачественными..."
70001020-198 = ""
70001020-200 = ""
70001020-202 = "Я не позволю буржуазным ваннам Тринити вскружить мне голову!"
70001020-204 = "ДИСКВАЛИФИЦИРОВАНО"
70001020-207 = ""
70001020-208 = "Серьёзно... Никогда не думала, что у таких знаменитых академий, как Тринити и Геенна, окажутся настолько разочаровывающие купальные помещения."
70001020-209 = "Если бы любая другая академия пыталась содержать такое, она бы обанкротилась за месяц!"
70001020-210 = "Но разве ты не была немного резка, когда мы уходили из Тринити?"
70001020-211 = "Даже если мы не заключили с ними контракт, возможно, нам позволили бы забрать эти дорогие закуски, если бы мы расстались по-хорошему..."
70001020-212 = "М-Меня всё равно не интересуют буржуазные перекусы!"
70001020-213 = "Как посланницы академии Красная Зима, мы представляем свою школу! Мы не можем позорить Красная Зима, переживая из-за таких мелочей, как безупречная вежливость!"
70001020-214 = "Честно говоря, не уверена, что наши действия вообще способны сделать академии больше или меньше стыдно за нас..."
70001020-215 = ""
70001020-217 = ""
70001020-218 = "В любом случае, кто-то из Клуба Инь-Ян вроде должен был встретить нас в академии Хяккияко, но я никого не вижу..."
70001020-219 = "Мы точно в нужном месте?"
70001020-220 = "Простите, здесь кто-нибудь есть?"
70001020-224 = ""
70001020-225 = "...Хм? Вы кто? Кажется, раньше я не видела вас в академии Хяккияко."
70001020-226 = "М-Может, это гости из другой академии...?"
70001020-227 = "О, слава богу. Я уже думала, что мы заблудились."
70001020-228 = "Мы из академии Красная Зима и приехали осмотреть ваши помещения..."
70001020-229 = ""
70001020-231 = ""
70001020-232 = ""
70001020-233 = ""
70001020-234 = ""
70001020-235 = ""
70001020-236 = ""
70001020-238 = ""
70001020-239 = "Осмотреть...?"
70001020-240 = "Цукуё... Может, это гости, которые пришли на бесплатное мероприятие «Попробуй себя ниндзя», которое мы разместили на канале...?"
70001020-241 = "Н-Но... тот пост едва набрал 10 просмотров, не говоря уже о комментариях..."
70001020-242 = "А что, если они как раз двое из этих десяти?"
70001020-243 = "Я думала, ниндзя интересуются только студенты академии Хяккияко..."
70001020-244 = ""
70001020-246 = ""
70001020-247 = "...Это может стать нашим шансом превратить канал «Мичиручи: Девичий свиток ниндзя» в мировой феномен!"
70001020-248 = ""
70001020-250 = ""
70001020-251 = ""
70001020-252 = "Добро пожаловать. Мы ждали вас."
70001020-253 = "Добро пожаловать в академию Хяккияко!"
70001020-254 = "Хи-хи, спасибо за тёплый приём."
70001020-255 = "Что хотите попробовать сначала? Метание сюрикенов? Прыжки через ростки бамбука?"
70001020-256 = "...Метание сюрикенов? ...Прыжки через ростки бамбука?"
70001020-257 = "Никогда не слышала о таком способе купаться..."
70001020-258 = "Купаться...?"
70001020-259 = "Разве вы не знаете? Мы приехали осмотреть ваши купальные помещения—"
70001020-260 = "О, надо было сразу так сказать!"
70001020-261 = "Подождите, я покажу вам нашу проверенную временем ниндзя-традицию купания!"
70001020-262 = ""
70001020-264 = ""
70001020-269 = ""
70001020-270 = ""
70001020-271 = ""
70001020-272 = ""
70001020-273 = "Это...?"
70001020-274 = "Ванны из металлических бочек!"
70001020-275 = "Наливаешь воду в бочку и разводишь под ней огонь — и получаешь тёплую ванну с совсем небольшим количеством воды!"
70001020-276 = "А бочки легко устанавливать, поэтому ванну можно поставить где угодно, даже под открытым небом, если знаете место с красивым видом!"
70001020-277 = "Е-Единственный минус — можно застрять в бочке..."
70001020-278 = "В прошлый раз я слишком долго купалась и потом вообще н-не могла выбраться..."
70001020-279 = "Я была слишком большой и застряла... Простите, уверена, с вами такого не случится..."
70001020-280 = "Х-Хотя тогда бочки и правда были слишком маленькими..."
70001020-281 = ""
70001020-283 = ""
70001020-284 = ""
70001020-285 = ""
70001020-286 = "(Ч-Что...? Их выражения лиц внезапно стали пугающими.)"
70001020-287 = ""
70001020-288 = "Эм, что-то не так...?"
70001020-289 = "Не могу поверить, что студенты такой крупной организации, как академия Хяккияко, вынуждены мыться в подобных условиях..."
70001020-290 = ""
70001020-292 = ""
70001020-293 = "Все вы! Как бы жестоко ни подавлял вас кровавый диктатор Хяккияко, не теряйте надежду!"
70001020-294 = ""
70001020-296 = ""
70001020-297 = "Ваши товарищи из академии Красная Зима всегда будут рядом и помогут в вашей борьбе!"
70001020-298 = ""
70001020-300 = ""
70001020-301 = "Д-Да... С-Спасибо..."
70001020-302 = "Вот! Это особые мандзю с горячих источников, которые мы делали, когда управляли курортом!"
70001020-303 = "Их немного, но спрячьте при себе — они восстановят силы, когда вас попытаются морить голодом!"
70001020-304 = "Д-Да... С-Спасибо..."
70001020-306 = "Давайте сражаться бок о бок за свободные и удобные ванны для всех!"
70001020-308 = "Ага... Конечно..."
70001020-309 = ""
70001020-312 = ""
70001020-313 = "Д-Думаю, произошло какое-то недоразумение..."
70001020-314 = ""
70001020-317 = ""
70001020-318 = "Кья-а-а! Я в беде... Я опаздываю..."
70001020-319 = "О, Клуб исследования ниндзюцу. Вам не попадались студенты из другой академии?"
70001020-320 = "Мне сказали, что сюда должна прибыть специальная делегация из академии Красная Зима..."
70001020-321 = ""
70001020-323 = ""
70001020-324 = "Эм, возможно..."
70001020-325 = ""
70001020-327 = ""
70001020-328 = ""
70001020-329 = ""
70001020-330 = ""
70001020-331 = "Эм, нет, кажется, не видели..."
70001020-332 = "О нет, наверное, они уже ушли... Кахо меня страшно отругает..."
70001020-333 = ""
70001020-335 = ""
70001020-336 = "...Откуда у вас этот мандзю?"
70001020-337 = ""
70001020-339 = ""
70001020-340 = ""
70001020-341 = "Мы... получили его от товарищей, проходивших мимо."
70001020-342 = ""
70001020-344 = ""
70001020-346 = "...Товарищей?"
