[translation]
10008025-1 = "Эпизод 2;Суматоха всегда приходит внезапно"
10008025-3 = "Это был взрыв?! Что здесь происходит?!"
10008025-4 = "Эй, маленькая подработчица! Как раз вовремя. Короче, эти странные типы появились из ниоткуда и..."
10008025-7 = ""
10008025-8 = "Ха-ха-ха!"
10008025-10 = "Кто они вообще такие?!"
10008025-11 = "Хм. Значит, они и правда не часть мероприятия."
10008025-12 = "Конечно нет! Это святыня! Зачем нам вообще нанимать отряд сэнтай?!"
10008025-14 = "Это Кайтенджеры!"
10008025-15 = "Ты про ту шайку негодяев, которая приносит проблемы, куда бы ни пришла?!"
10008025-16 = "Что ОНИ здесь делают?!"
10008025-18 = "То есть они вам не друзья? Это не банда в масках и купальниках в новых костюмах?"
10008025-19 = "Я же сказала нет! Я бы никогда не дружила с этими чудаками!"
10008025-20 = "И больше не вспоминай об этом! Оставь всё в прошлом!"
10008025-21 = "[s] «Кайтенджеры!»"
10008025-22 = "А? Ты их знаешь, Сенсей?"
10008025-23 = "[s1] «Кажется, я вижу их впервые, но...»\n[s2] «Обучающие Blu-ray... Технические заметки... А-а! Голова!»"
10008025-26 = "Ха! Эти злодеи умудрились не отставать!"
10008025-27 = "Не недооценивай их, Красный!"
10008025-28 = "Так что теперь делать?"
10008025-29 = "Не волнуйтесь!"
10008025-30 = "Мы пришли не драться. У нас другая цель!"
10008025-31 = "Хия!"
10008025-32 = ""
10008025-34 = ""
10008025-44 = "Ящик для пожертвований исчез!"
10008025-45 = "А?"
10008025-46 = "Что?!"
10008025-48 = "Эй, Красный. Я стащил ящик. Не забудь записать это мне в табель."
10008025-49 = "Отличная работа, Зелёный! Вот так зарабатывают зарплату!"
10008025-50 = "Первая цель выполнена!"
10008025-51 = "Ахахаха! Да! Мы, Кайтенджеры, проследим, чтобы эти деньги использовали на правые и справедливые дела!"
10008025-52 = "Теперь этот ящик для пожертвований наш!"
10008025-54 = "Что они только что сказали?!"
10008025-55 = "Адьос!"
10008025-56 = ""
10008025-58 = ""
10008025-59 = ""
10008025-60 = "[ns3] «Они его забрали...»\n[ns4] «Это сейчас правда произошло?»"
10008025-63 = "Не-е-ет! Стойте!"
10008025-64 = "Э-Это плохо! Меня могут сделать ответственной! Мне могут не заплатить!"
10008025-65 = "Хи-хи-хи..."
10008025-66 = "Вот же нас провели! Утащили прямо из-под носа!"
10008025-67 = "Да вы издеваетесь..."
10008025-69 = "Ч-Что нам делать, Ару?!"
10008025-70 = "Что за вопрос?! Конечно же, гнаться за ними!"
10008025-71 = "Точно! Нужно вернуть ящик для пожертвований!"
10008025-72 = "..."
10008025-73 = "Эм. Я понимаю, почему тебе не всё равно, но нас-то это вообще не касается."
10008025-74 = "Что?!"
10008025-75 = "Это ящик для пожертвований. Даже если вернём его, нам от этого ничего не достанется. Деньги не наши."
10008025-76 = "К тому же они вроде разыскиваемые преступники? Что хорошего даст такому бизнесу, как наш, открытая стычка с ними?"
10008025-77 = "Ладно! Да кто вас вообще просит?!"
10008025-78 = "Я сама с этим разберусь! Вернуть эти деньги — моя ответственность, как и спасти Абидос!"
10008025-79 = "Я сваливаю!"
10008025-80 = "[s] «Сэрика, стой!»"
10008025-81 = "Не пытайся меня остановить, Сенсей! Нельзя терять время!"
10008025-82 = ""
10008025-85 = ""
10008025-86 = "Мы тоже идём."
10008025-87 = "А?!"
10008025-88 = "В-Вы идёте?!"
10008025-89 = "Каёко права. Теперь, когда мы уже сделали пожертвования, этот ящик нас не касается."
10008025-90 = "Нам нечего получить от возвращения украденной собственности, которая нам не принадлежит."
10008025-91 = "Но... Решалы 68 никогда не работали только ради выгоды."
10008025-92 = "*вздыхает*"
10008025-93 = "Всё упирается в то, что говорит нам сердце."
10008025-94 = "А моё сердце говорит..."
10008025-96 = "...что я не могу закрыть глаза на то, что деньги, которые мы вложили, украли в первый же день финансового года! Они за это заплатят!"
10008025-97 = ""
10008025-99 = ""
10008025-101 = ""
10008025-102 = "Хе-хе."
10008025-103 = "А-Ару!"
10008025-104 = "*вздыхает* Я знала, что ты это скажешь."
10008025-105 = "С таким огромным сейфом они могут пойти только по одному маршруту. Если поспешим, догоним их минут за пятнадцать."
10008025-106 = "А с Сенсеем, возможно, даже быстрее."
10008025-107 = "О, точно!"
10008025-108 = "Слушай, Каёко. Ты уже просчитала их путь отхода, потому что знала, как Ару отреагирует?"
10008025-109 = "Ну, обычно всё именно так и заканчивается."
10008025-111 = "Л-Ладно. Пусть будет по-вашему."
10008025-112 = "Поблагодарю после того, как найдём ящик!"
10008025-113 = "[s] «Погоня начинается!»"
10008025-115 = "Я так и знала, что Ару подойдёт к делу как настоящая преступница! Мне ещё столько учиться!"
10008025-116 = "Можно и так посмотреть. А можно сказать, что Ару всегда прыгает, не думая."
10008025-117 = "Пожалуйста. Преступники должны быть импульсивными. Это называется инстинктом."
10008025-120 = "(Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится! Пожалуйста, пусть мой бизнес не развалится!)"
10008025-121 = ""
10008025-123 = ""
10008025-125 = "А что, если злой дух осквернит эти желания?"
10008025-126 = "Оно вполне может пожелать, чтобы все остальные желания исполнились наоборот!"
10008025-129 = "(Что будет, если мы не вернём сейф?!)"
10008025-130 = "(М-Мы должны найти их раньше, чем это случится!)"
