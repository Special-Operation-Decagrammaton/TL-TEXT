[translation]
1009503-1 = "Время экскурсии, Сенсей"
1009503-2 = "Я пришёл примерно за пятнадцать минут до назначенного времени."
1009503-3 = "Пока я ждал Мидори..."
1009503-4 = ""
1009503-7 = "Привет, Сенсей!"
1009503-8 = ""
1009503-11 = "[ns] «Мидори? Ты и сюда пришла в костюме горничной?»"
1009503-12 = "Ого! На этот раз вы приятно удивились!"
1009503-13 = "[s] «Так вот зачем? Ты просто хотела посмотреть на мою реакцию?»"
1009503-14 = "Ну, Сенсей, это же совершенно естественно."
1009503-15 = "В конце концов, я ведь ваша горничная, разве нет?"
1009503-16 = "[s] «Ты всё ещё продолжаешь это?»"
1009503-17 = "Конечно."
1009503-18 = "[s] «Твой ответ настолько очарователен, что мне даже нечего сказать.»"
1009503-19 = "Так или иначе, раз уж я ваша горничная..."
1009503-20 = "...мой долг — сопровождать вас."
1009503-21 = "Поэтому вполне естественно, что я и выгляжу соответствующе."
1009503-22 = "Вы ведь согласны, Сенсей?"
1009503-23 = "[s] «Я уже вообще ни в чём не уверен...»"
1009503-24 = "О, значит, вы не возражаете! Тогда я могу считать это согласием?"
1009503-25 = "В любом случае... Я хочу сказать..."
1009503-26 = "Я подумала, что вам тоже стоит соблюдать тот же дресс-код, Сенсей!"
1009503-27 = "Разве хорошо подготовленная горничная не должна заранее приготовить такой наряд для своего хозяина?"
1009503-28 = "[s] «Кажется, мы всё дальше уходим от первоначальной темы.»"
1009503-29 = "Не волнуйтесь. Просто доверьтесь мне!"
1009503-30 = ""
1009503-32 = ""
1009503-33 = "Особенно когда я говорю: «Я хочу, чтобы вы переоделись!»"
1009503-34 = "Вот, я принесла несколько вариантов на выбор. Тут есть сюртук, шёлковый цилиндр, трость..."
1009503-35 = "...платье с пряжками, шляпа с перьями и даже зонтик!"
1009503-36 = "Если вам покажется, что аксессуаров мало, у меня есть ещё много вариантов — например, монокль и декоративный веер!"
1009503-37 = "Так что не волнуйтесь. Предоставьте всё мне!"
1009503-38 = "[s1] «А я-то всё думал, зачем ты таскаешь такой огромный чемодан!»\n[s2] «Так вот для чего он был нужен!»"
1009503-41 = "Да, конечно!"
1009503-42 = "А теперь переодевайтесь и позвольте мне сопровождать вас!"
1009503-43 = "Служить такому достойному хозяину — уже награда сама по себе."
1009503-44 = "Я буду в восторге, если увижу вас в этих прекрасных нарядах, Сенсей!"
1009503-45 = "Для меня это будет невероятно полезный опыт — и как для горничной, и как для художницы!"
1009503-46 = "[s3] «Сначала у меня один вопрос.»\n[s4] «Эта одежда точно подходящего размера?»"
1009503-49 = "Об этом можете не беспокоиться."
1009503-50 = "Я уже получила профессиональную поддержку и советы от нескольких человек из Миллениума."
1009503-51 = "Они даже попросили меня сделать фотографии и поделиться ими."
1009503-52 = "Ну что, Сенсей?"
1009503-53 = ""
1009503-55 = ""
1009503-59 = ""
1009503-60 = "Пожалуйста, переодевайтесь...?"
1009503-62 = "Я отказался переодеваться по просьбе Мидори. Она расстроилась, но потом мне удалось её успокоить."
1009503-63 = "Сдав её чемодан в камеру хранения, мы наконец направились в художественный музей..."
1009503-64 = ""
1009503-65 = ""
1009503-66 = ""
1009503-67 = ""
1009503-68 = ""
1009503-69 = ""
1009503-70 = ""
1009503-72 = ""
1009503-73 = "Это действительно впечатляет! Они даже оформили выставочные залы и коридоры в соответствии с концепцией."
1009503-74 = "Серьёзно, это поражает сразу во многих смыслах."
1009503-75 = "Посмотрите, Сенсей. Как свободный крой платья контрастирует с затянутой талией."
1009503-76 = "Я слышала, что для такой талии и её поддержания приходилось носить очень тугие корсеты или утягивающее бельё."
1009503-77 = "У меня голова кружится от одной мысли об этом..."
1009503-78 = "К тому же женщины ведь никак не могли одеваться так самостоятельно, правда?"
1009503-79 = "Я прямо представляю, как пыталась бы надеть такой наряд..."
1009503-80 = "Мне бы понадобилось человека три-четыре на помощь."
1009503-81 = "[s] «И невольно начинаешь задумываться: что вообще такое мода?»"
1009503-82 = "Это всё!"
1009503-83 = "[s] «Настолько важно?»"
1009503-84 = "...Ну, может, и не совсем всё."
1009503-85 = "Но одежда — одна из базовых потребностей наряду с едой и жильём. Так что мода гораздо важнее, чем многие думают."
1009503-86 = "Особенно для иллюстратора вроде меня."
1009503-87 = "То, что человек носит, — часть его самовыражения."
1009503-88 = "Поэтому, Сенсей, думаю, вам тоже стоит больше внимания уделять моде!"
1009503-89 = "[s] «Я это учту...»"
1009503-90 = "Просто «учесть» недостаточно, Сенсей. Это очень важный вопрос!"
1009503-91 = "Знаете что? Давайте прямо сейчас заберём чемодан и переоденем вас!"
1009503-92 = "[s] «Давай успокоимся, Мидори. Хорошо?»"
1009503-93 = "Вы правда совсем не хотите? Я никак не смогу вас уговорить?"
1009503-94 = "А? Если мы выйдем и вернёмся, придётся снова покупать билеты?"
1009503-95 = "Ну, если так посмотреть..."
1009503-96 = ""
1009503-98 = ""
1009503-99 = "Кстати, я заметила кое-что в стилях традиционной одежды."
1009503-100 = "Есть едва заметные сходства с костюмами горничных. И такие же небольшие различия."
1009503-101 = "Например, вот эти чепчики. Или платья с юбками и ленты."
1009503-102 = "[s] «Теперь, когда ты сказала, я понимаю, о чём ты.»"
1009503-103 = "Давайте посмотрим ещё, Сенсей."
1009503-104 = "Думаю, здесь я смогу найти ещё больше вдохновения!"
1009503-113 = "Мидори протащила меня через всю выставку."
1009503-114 = "Когда мы закончили, уже наступил вечер."
1009503-116 = ""
1009503-117 = "Спасибо за сегодняшний день, Сенсей. Я очень благодарна, что вы познакомили меня со всей этой выставкой."
1009503-118 = "Должна признаться..."
1009503-119 = "Мне очень понравилось наше... *кхм* свидание."
1009503-120 = "[ns] «А? Последнюю часть я не расслышал.»"
1009503-121 = ""
1009503-123 = ""
1009503-124 = "Ой, ничего. Ничего такого!"
1009503-125 = "Эй, нам уже пора возвращаться, не думаете? Позвольте мне проводить вас до конца."
1009503-126 = "[s] «Хорошо, спасибо.»"
1009503-127 = ""
1009503-129 = ""
1009503-130 = "...Но, Сенсей?"
1009503-131 = ""
1009503-133 = ""
1009503-137 = "Вы можете хотя бы один раз надеть тот наряд?"
1009503-138 = "[s] «Ну хватит, пожалей меня...»"
1009503-139 = "Сэн-сэ-э-эй... ну пожа-а-алуйста?!"
1009503-141 = "Необычно прижавшись ко мне, Мидори благополучно прошла со мной по вечерней дороге обратно..."
