[translation]
2000403-1 = "Пляжный снайпер"
2000403-3 = "Получив сообщение Маширо, я пришёл к месту на пляже, где мы договорились встретиться, но её нигде не было."
2000403-4 = "[s] «Где ты, Маширо?»"
2000403-5 = "О, вот ты где, Сенсей. Я ждала тебя."
2000403-6 = "[s1] «Погоди, откуда голос?»\n[s2] «Я слышу тебя, но не вижу.»"
2000403-7 = "Эм, ну..."
2000403-8 = "Эм, ну..."
2000403-9 = "Я у тебя под ногами."
2000403-10 = "[s] «Под ногами?»"
2000403-12 = ""
2000403-13 = "Не могу поверить, что ты вообще меня не заметил."
2000403-14 = "Похоже, покупка всё-таки себя оправдала."
2000403-15 = "[s3] «Я совсем тебя там не заметил.»\n[s4] «Откуда ты вообще взялась?»"
2000403-16 = "Как я и сказала, я лежала в песке и не двигалась."
2000403-17 = "Как я и сказала, я лежала в песке и не двигалась."
2000403-18 = "Я испытывала новый маскировочный костюм, который купила."
2000403-19 = "[s] «Маскировочный костюм?»"
2000403-20 = "Да, это снайперский маскхалат из переплетённой ткани или сетки."
2000403-21 = "Когда снайпер в таком костюме, заметить его присутствие очень трудно."
2000403-22 = "Этот новый костюм рассчитан на пустынную местность вроде Абидоса, поэтому возле Тринити испытать его возможности не было."
2000403-23 = "Я решила, что пляж отлично подойдёт для испытания, и надела его."
2000403-24 = "[s] «Я думал, ты будешь тренироваться в купальнике.»"
2000403-25 = "Да, во время тренировки по плаванию. Терпение — добродетель, особенно для снайпера."
2000403-26 = "Это была хорошая возможность научиться устраивать засаду в жарком климате."
2000403-27 = "[s] «Как долго ты ждёшь?»"
2000403-28 = "Я пришла за три часа до того, как написала тебе, так что всего около четырёх часов."
2000403-29 = "Довольно мало по меркам обычной снайперской тренировки."
2000403-30 = ""
2000403-31 = ""
2000403-32 = ""
2000403-33 = ""
2000403-34 = "Что-то не так, Сенсей?"
2000403-35 = ""
2000403-38 = "[ns5] «Ты вся горишь!»\n[ns6] «Тебе нужно куда-нибудь в прохладу!»"
2000403-39 = "Нет, всё хорошо... Тренировка только началась."
2000403-40 = "Нет, всё хорошо... Тренировка только началась."
2000403-41 = "Если бы это было обычное снайперское задание, у меня был бы ещё час, прежде чем я..."
2000403-42 = "А? Почему у меня вдруг кружится голова?"
2000403-43 = ""
2000403-44 = ""
2000403-46 = "[ns] «Не отключайся, Маширо!»"
2000403-48 = "Я как можно быстрее отнёс Маширо в ближайший медпункт."
2000403-50 = "Медпункт прибрежной администрации"
2000403-51 = ""
2000403-52 = "Хм..."
2000403-53 = "Где я?"
2000403-54 = "Я потеряла сознание?"
2000403-55 = "[s] «Ты потеряла сознание из-за теплового удара.»"
2000403-56 = "Понятно. Из-за моей слабости я доставила тебе неудобства. Прошу прощения."
2000403-57 = "Изнуряющая жара и правда достойный противник."
2000403-58 = "Придётся тренироваться ещё усерднее, чтобы продержаться немного дольше."
2000403-59 = "[s] «Нет, тренировки приостановлены.»"
2000403-60 = "Что? Но если я заранее не привыкну к жаре, то провалюсь в настоящем бою."
2000403-61 = "В этот раз мне просто не повезло."
2000403-62 = "Обещаю больше не доставлять неудобств. Пожалуйста, разреши продолжить тренировку."
2000403-63 = "[s] «Нет.»"
2000403-64 = "Но..."
2000403-65 = "[s] «Чтобы защищать справедливость, нужно оставаться здоровой.»"
2000403-66 = "Я никогда не думала об этом с такой стороны."
2000403-67 = "Ты прав. Если преступники появятся, когда я измотана чрезмерными тренировками, я не смогу нормально отреагировать."
2000403-68 = "Так по-снайперски — сосредоточиться на далёких целях и забыть о том, что прямо перед глазами..."
2000403-69 = "Спасибо, Сенсей. Твои советы всегда полезны."
2000403-70 = "[s] «Отдохни, а когда станет лучше, начнём с лёгкого плавания.»"
2000403-71 = "Хорошо. Я выложусь на полную!"
2000403-72 = "[s] «Тебе бы лучше выложиться наполовину...»"
2000403-75 = "Когда Маширо достаточно отдохнула, мы отправились обратно."
