[translation]
80000065-1 = "Мастерство горничной"
80000065-6 = "О, вот вы где."
80000065-7 = "В кабинете вас не было, поэтому я решила поискать здесь."
80000065-8 = "Хи-хи. Верно. Я зашла из-за Дня святого Валентина."
80000065-9 = "Я принесла небольшой знак благодарности за всё, что вы делаете."
80000065-10 = "Он здесь, в этой сумке."
80000065-11 = ""
80000065-13 = ""
80000065-14 = "Хм?"
80000065-15 = "Почему вы так напряглись?"
80000065-16 = "А?"
80000065-17 = "Бомба?"
80000065-18 = ""
80000065-20 = ""
80000065-21 = ""
80000065-22 = "О боже... Теперь понятно."
80000065-23 = "Полагаю, учитывая моё прошлое поведение, такая ошибка вполне понятна."
80000065-24 = "Но сегодня не тот день, когда нужны взрывчатые вещества."
80000065-25 = "Вы не раз видели, как я носила в этой сумке C4 и динамит."
80000065-26 = "Мне ужасно неловко. Впредь я буду немного осторожнее, Сенсей."
80000065-27 = "Обещаю, причин для беспокойства нет. Смотрите..."
80000065-28 = ""
80000065-30 = ""
80000065-32 = "Просто шоколад на День святого Валентина."
80000065-33 = "[s1] «Похоже на домашний шоколад.»\n[s2] «Ты приготовила его специально для меня?»"
80000065-34 = "Хи-хи. Я рада, что вы заметили."
80000065-35 = "Хи-хи. Я рада, что вы заметили."
80000065-36 = "Вы можете знать меня как агента, но не забывайте: я ещё и горничная."
80000065-37 = "Для такой, как я, умение делать подобные вещи — базовый навык."
80000065-38 = "Мне нравятся дни, когда можно делать что-то приятное вроде этого — когда можно отдохнуть от работы агента."
80000065-39 = "[s] «Аканэ?»"
80000065-40 = "Прошу прощения. Я задумалась."
80000065-41 = "Кажется, сегодня я хочу, чтобы мы были студентом и учителем, а не горничной и мастером."
80000065-42 = "Как вы к этому отнесётесь, Сенсей?"
80000065-43 = "[s3] «Для меня ты никогда не была просто горничной, Аканэ.»\n[s4] «Ты всегда будешь моим драгоценным студентом.»"
80000065-44 = "Ох."
80000065-45 = "Ох."
80000065-46 = "Это оказалось немного проще, чем я думала, Сенсей."
80000065-47 = "Не ожидала сразу услышать именно тот ответ, которого хотела."
80000065-48 = "Хи-хи. Спасибо, Сенсей."
80000065-49 = "Я и дальше буду на вас полагаться."
80000065-51 = "После этого мы с Аканэ провели время вместе и доели её шоколад."
80000065-52 = ""
80000065-56 = "Что неудивительно, шоколад оказался качественным и вкусным."
