[translation]
1003503-1 = "Поиски пропавшего ребёнка"
1003503-8 = "Внутри старой библиотеки"
1003503-9 = "[ns1] «Уи!»\n[ns2] «Что случилось? Подробности!»"
1003503-10 = "С-Сенсей!"
1003503-11 = "С-Сенсей!"
1003503-12 = "У-Успокойтесь! Вы весь в поту!"
1003503-13 = "Вы бежали сюда всю дорогу?! Это же так далеко..."
1003503-14 = "[s3] «Не беспокойся обо мне. Что случилось?!»\n[s4] «ОБО МНЕ?! Да у тебя лицо бледное! Ты в порядке?»"
1003503-15 = "Эм... Позвольте объяснить, что произошло."
1003503-16 = "Эм... Позвольте объяснить, что произошло."
1003503-17 = "Эм..."
1003503-18 = "Ну..."
1003503-19 = "[s] «Ну...?»"
1003503-20 = "Я..."
1003503-21 = "[s] «Ты...?»"
1003503-22 = "Ух...!"
1003503-23 = "А-а-а-а! *рыдает*"
1003503-24 = "[s] «Уи, что случилось?!»"
1003503-26 = "Уи вскрикнула от смущения. Я успокоил её и выслушал, что произошло."
1003503-28 = "Ну..."
1003503-29 = "*шмыг* Всё не так, как вы думаете."
1003503-30 = "Я просто поняла, что... один из моих драгоценных детей пропал.#nТ-То есть одна из моих книг."
1003503-31 = "Я знаю, что она где-то здесь, и надеялась, что вы поможете мне поискать..."
1003503-32 = "Судя по вашей реакции, вы, должно быть, неправильно поняли то сообщение."
1003503-33 = "Вы подумали, что пропал настоящий человек..."
1003503-34 = "Я собиралась уточнить, но вы так быстро прибежали и были в панике."
1003503-35 = "Простите — мне так жаль. Не стоило оправдываться.#nЯ заставила вас волноваться из-за пустяка."
1003503-36 = "*шмыг* *всхлип*"
1003503-37 = "[s5] «Всё нормально. Теперь я понял.»\n[s6] «Всё в порядке. Я просто рад, что ничего страшного.»"
1003503-38 = "Сенсей..."
1003503-39 = "Сенсей..."
1003503-40 = "В-Вы удивлены, правда?"
1003503-41 = "На меня не похоже потерять что-то настолько дорогое, как книга.#nНу, дело в том, что..."
1003503-42 = "...технически я её не теряла. Она пропала после того, как остальные члены комитета здесь убирались."
1003503-43 = "[s7] «А, вот почему здесь стало заметно чище.»\n[s8] «(Логично. Одной ей было бы слишком много работы...)»"
1003503-44 = "Я уснула, пока они убирались..."
1003503-45 = "Я уснула, пока они убирались..."
1003503-46 = "После уборки я спросила, знают ли они, где она, но никто, похоже, не понял, о какой книге я говорю."
1003503-47 = "В такой огромной библиотеке потерять одну книгу — всё равно что иголку в стоге сена."
1003503-48 = "[s9] «Да, наверное, найти её очень трудно.»\n[s10] «Не ожидал бы, что ты справишься с этим одна.»"
1003503-49 = "Но я не смогла заставить себя попросить их о помощи."
1003503-50 = "Но я не смогла заставить себя попросить их о помощи."
1003503-51 = "Поэтому вместо этого написала вам. Вот и вся история."
1003503-52 = "Ещё раз простите, Сенсей."
1003503-53 = "Что? Вы правда не против?"
1003503-54 = "И вы поможете мне поискать её...? Точно?"
1003503-55 = "*вздох* Я так сильно отвлекаю вас из-за такой мелочи..."
1003503-56 = "Вообще-то мне ещё кажется, будто я поступила нечестно — словно обманом втянула вас в это."
1003503-57 = "А?"
1003503-58 = "Вы так не думаете? Почему...?"
1003503-59 = "[s11] «Потому что эта книга действительно тебе дорога.»\n[s12] «Потому что так или иначе тебе нужна моя помощь.»"
1003503-60 = "Сенсей..."
1003503-61 = "Сенсей..."
1003503-63 = ""
1003503-64 = "А я всё ещё трачу ваше время, унывая здесь."
1003503-65 = "Хорошо. Я приму вашу помощь."
1003503-66 = "Спасибо, что так меня понимаете, Сенсей."
1003503-67 = "Хм? Как выглядит мой потерянный ребёнок? Кажется, я так и не сказала."
1003503-68 = "Подождите."
1003503-69 = "Теперь вы начинаете говорить прямо как я, раз называете её так."
1003503-70 = "..."
1003503-71 = "В любом случае я очень благодарна за помощь. Не будем больше тратить ваше время."
1003503-72 = "Обложка моего ребёнка выглядит так..."
1003503-73 = "Уи сказала мне название книги и описала её обложку.#nПосле этого мы начали поиски её «ребёнка»."
1003503-75 = "В старой библиотеке оказалось ещё больше книг, чем я представлял. К тому времени, когда мы наконец нашли книгу Уи, уже наступила ночь."
