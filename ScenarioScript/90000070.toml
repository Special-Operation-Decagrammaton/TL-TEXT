[translation]
90000070-1 = "Эпизод 8;Исследование, Часть 7: Район Затопленных Руин"
90000070-2 = "...Эйми. Сенсей."
90000070-3 = "Нашли что-нибудь?"
90000070-4 = "В одном из районов руин мы на мгновение поймали сигнал."
90000070-5 = "Какой сигнал?"
90000070-6 = "Похоже, какой-то позывной."
90000070-7 = "На первый взгляд это можно спутать с бессмысленным шумом, но я запомнила структуру этого позывного."
90000070-8 = "И она в точности повторяет то существо, что нас взломало."
90000070-9 = ""
90000070-14 = "...Неужели он?"
90000070-15 = "Да, Декаграмматон. Я несколько раз всё перепроверила, так что сомнений быть не может."
90000070-16 = "[s] «Это значит...»"
90000070-17 = "...Что Декаграматон находится в Руинах?"
90000070-18 = "Судя по всему да."
90000070-19 = "Подожди. Раз наша миссия в том, чтобы раскрыть личность Декаграмматона..."
90000070-20 = "То почему бы не атаковать его прямо сейчас и не пропустить весь этот сбор данных пророков?"
90000070-22 = "Думаешь, я об этом не думала? Но наша цель — раскрыть его сущность. Если спровоцировать сейчас, он, скорее всего, просто ускользнёт туда, где мы его не найдём, пока он сам того не захочет."
90000070-23 = "Сначала нужно подтвердить мои выводы. На крайне очень маловероятный случай, если я ошиблась."
90000070-24 = "Исследуем место, откуда пришёл сигнал."
90000070-25 = "Сигнал был очень коротким, поэтому точную точку определить нельзя. Зона охватывает большую часть Руин, так что это может занять несколько дней."
90000070-26 = "Все готовы?"
