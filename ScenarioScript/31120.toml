[translation]
31120-1 = "Эпизод 12;Первая ночь в учебном лагере"
31120-2 = "..."
31120-3 = "В итоге мы даже не успели поплавать."
31120-4 = "Прости. Я не учла, сколько времени понадобится, чтобы наполнить бассейн."
31120-5 = "Не нужно извиняться. Миссия всё равно была приятной."
31120-6 = "Ночью здесь неожиданно красиво."
31120-7 = "И правда. Никогда раньше не видела школьный бассейн после заката."
31120-8 = ""
31120-10 = ""
31120-12 = "*клюёт носом*... *клюёт носом*"
31120-13 = "Кохару, ты ещё с нами? Похоже, вот-вот уснёшь стоя."
31120-14 = "Н-Нет, я просто... устала. Сегодня вымоталась."
31120-15 = "Ну, мы убирались с самого утра."
31120-16 = "Может, пойдём внутрь?"
31120-17 = "Завтра начинаются занятия в лагере. Если нормально не выспимся, будет трудно сосредоточиться."
31120-18 = "Да."
31120-19 = "Вернёмся внутрь?"
31120-21 = "Фух. Хорошо снова оказаться внутри."
31120-22 = "День прошёл успешно."
31120-23 = "Хорошая работа, девушки. Давайте отдохнём."
31120-24 = "Спокойной ночи..."
31120-25 = "[s] «Я буду дальше по коридору. Зовите, если что-нибудь понадобится.»"
31120-26 = "Разумеется. Я обязательно это запомню."
31120-27 = "Гх... Комитет правосудия... никогда бы не потерпел такой непристойности..."
31120-28 = ""
31120-30 = ""
31120-31 = "Почему бы нам всем не поспать? Уверена, все устали."
31120-32 = "Спокойной ночи, Сенсей."
31120-33 = ""
31120-37 = "[ns] Вернуться в свою комнату."
31120-40 = "Комната Сенсея"
31120-42 = "[ns1] «...»\n[ns2] «Ну и денёк.»"
31120-46 = ""
31120-47 = "Ведь истинная цель Клуба дополнительных занятий..."
31120-48 = "...исключить студентов."
31120-51 = "[ns] «(Что же задумала Нагиса?)»"
31120-59 = "Кто-то у двери."
31120-60 = "[ns3] «Кто там?»\n[ns4] «Там кто-то есть?»"
31120-63 = "Вы там, Сенсей?"
31120-64 = "[s] Открыть дверь."
31120-65 = ""
31120-68 = ""
31120-69 = "Простите, что беспокою так поздно."
31120-70 = "[s] «Я так и думал, что это ты, Хифуми.»"
31120-71 = "Да. Никак не могу уснуть."
31120-72 = "В голове слишком много всего..."
31120-74 = "Я некоторое время поговорил с Хифуми."
31120-75 = ""
31120-76 = "Спасибо за помощь сегодня, Сенсей."
31120-77 = "[s] «Вы сегодня отлично справились.»"
31120-78 = "Завтра утром официально начинается учебный лагерь, но... мы правда сможем это сделать?"
31120-79 = "До второго экзамена всего неделя. А если снова провалимся, вскоре будет третий."
31120-80 = "И если провалим его..."
31120-81 = "[s] «Всех исключат.»"
31120-82 = "Да. Значит, вы знаете."
31120-83 = "Остальным я не рассказывала, и даже не уверена, правда ли это, но... ух."
31120-84 = "Это обычные индивидуальные экзамены, но к нам применяют странную систему коллективного наказания. Даже то, что нас заставили ехать именно в учебный лагерь, уже подозрительно."
31120-85 = "И вдобавок..."
31120-86 = "*вздыхает*"
31120-87 = "[s] «Что тебе сказала Нагиса?»"
31120-88 = "Ч-что?!"
31120-89 = "Вы... правда хотите знать?"
31120-90 = "Ну..."
31120-91 = "Да, я говорила с ней."
31120-92 = "Она велела держать это в секрете, но мне тяжело хранить всё в себе."
31120-93 = "Что-то происходит. Это..."
31120-94 = "[s] «Речь о поиске предателя Тринити?»"
31120-95 = "Вы и об этом знаете?!"
31120-96 = "Ну, насчёт этого..."
31120-97 = "..."
31120-98 = "Когда я говорила с ней, Нагиса сказала..."
31120-100 = "Хифуми, пожалуйста, найди предателя."
31120-101 = "Простите? Что?! Э-Это..."
31120-102 = "Результаты экзаменов не имеют значения. Исключение после третьего — так сказать, крайняя мера."
31120-103 = "Твоя задача — собрать как можно больше информации о подозреваемых и как можно скорее найти предателя."
31120-104 = "Именно поэтому тебя поместили в Клуб дополнительных занятий."
31120-105 = "Но почему я? Как вообще так вышло...?"
31120-106 = "Почему выбрали именно тебя?"
31120-107 = "Из-за твоих уже существующих отношений с Шале."
31120-108 = "При Сенсее предатель не сможет действовать как захочет."
31120-109 = "Сенсей — моя страховка, крышка мусорного бака, чтобы мусор внутри вашего клуба не разбежался."
31120-110 = "Она только что назвала нас мусорным баком?"
31120-111 = "Не обращай внимания. Продолжим..."
31120-112 = "П-Подождите, Нагиса! Я не могу такое сделать!"
31120-113 = "Хифуми."
31120-114 = ""
31120-116 = ""
31120-118 = ""
31120-119 = "Другого выбора нет. Не забывай, что ты тоже отстающий студент. Уверен, ты понимаешь, что с тобой будет, если провалишь эту миссию, да?"
31120-120 = "..."
31120-121 = ""
31120-122 = "[ns] «(Как я и думал. Она использует и Хифуми.)»"
31120-123 = "Вы издеваетесь. Неужели правда есть предатель? Одна мысль об этом пугает..."
31120-124 = "Мы все студенты одной школы. Весь день вместе убирались. Вместе ужинали."
31120-125 = "Как я могу подозревать кого-то из них? Они мои друзья. Это слишком."
31120-126 = "Я не могу..."
31120-127 = "[s] «...»"
31120-128 = "..."
31120-129 = "[s] «Ты добрый человек, Хифуми.»"
31120-130 = "Что это было?"
31120-131 = "[s] «Тебе не нужно переживать о том, чтобы подозревать друзей.»"
31120-132 = "Сенсей?"
31120-133 = "[s] «Оставь всё мне.»"
31120-134 = "..."
31120-135 = "[s] «Я хочу, чтобы ты сосредоточилась на помощи так, как хочешь ТЫ.»"
31120-136 = "Так, как хочу я..."
31120-137 = "..."
31120-138 = "Точно! Я подумаю, что могу сделать, чтобы помочь!"
31120-139 = "Спасибо, что выслушали. Мне стало гораздо легче."
31120-142 = "Тем временем..."
31120-144 = "Вестибюль дополнительного корпуса"
31120-145 = "..."
31120-146 = "Ханако? Что ты здесь делаешь?"
31120-147 = "Ты тоже ещё не спишь, Азуса? И всё ещё в форме."
31120-148 = "Я уже достаточно поспала. Думаю провести ночной патруль."
31120-149 = "Здесь? И ты правда выспалась? Выглядишь измученной."
31120-150 = "Мне трудно спать в непривычных местах."
31120-151 = "..."
31120-152 = "Не беспокойся обо мне. Я обучена при необходимости обходиться без сна пять дней."
31120-153 = "Дело не совсем в этом."
31120-154 = "В любом случае в первую ночь все, вероятно, нервничают, поэтому вы с Хифуми и вышли прогуляться. Я хотела патрулировать ради вас."
31120-155 = "Вообще-то мне пора возвращаться к патрулю."
31120-156 = "Ладно. Только не засиживайся слишком долго, Азуса."
31120-157 = ""
31120-159 = ""
31120-160 = ""
31120-161 = "..."
31120-163 = "Так прошла первая ночь учебного лагеря."
31120-165 = "Следующий эпизод;Первый пробный экзамен"
