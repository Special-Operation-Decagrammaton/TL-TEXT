[translation]
31120-1 = "Episódio 12;A Primeira Noite do Acampamento"
31120-2 = "..."
31120-3 = "No fim das contas, não conseguimos entrar na piscina para brincar..."
31120-4 = "Pensando bem, encher uma piscina leva bastante tempo mesmo... Desculpe, acabei me esquecendo desse detalhe."
31120-5 = "Não precisa se desculpar. Já foi bem divertido."
31120-6 = "...Que lindo."
31120-7 = "É verdade. Uma piscina no meio da noite é uma vista que não se vê todo dia..."
31120-12 = "(Piscando de sono...)"
31120-13 = "Ora, está com soninho, Koharu-chan?"
31120-14 = "N-Não é nada disso... Mas eu cansei um pouquinho..."
31120-15 = "De fato, o dia hoje foi uma correria só com a faxina desde cedo."
31120-16 = "Então, que tal voltarmos para os quartos para descansar?"
31120-17 = "Amanhã o nosso acampamento de estudos começa pra valer... Se não formos dormir logo, isso pode acabar nos atrapalhando amanhã."
31120-18 = "É..."
31120-19 = "Tem razão. Então vamos encerrar por hoje."
31120-21 = "Bom descanso a todos, bom trabalho hoje."
31120-22 = "Bom trabalho."
31120-23 = "Certo, então até amanhã."
31120-24 = "...Bom descanso."
31120-25 = "[s] \"Vou estar naquele quarto ali, então se precisarem de qualquer coisa, podem me chamar a qualquer hora.\""
31120-26 = "Sim, vou guardar muito bem essa informação♡"
31120-27 = "N-Não pode... Esse tipo de indecência, como membro do Comitê de Justiça, eu...!"
31120-31 = "Parece que todas estão exaustas, então vamos dormir logo."
31120-32 = "Então, boa noite."
31120-37 = "[ns] Volto para o meu quarto."
31120-40 = "Quarto do Sensei"
31120-42 = "[ns1] \"...\"\n[ns2] \"Muito bem...\""
31120-47 = "Para começo de conversa, o Clube de Aulas de Reforço..."
31120-48 = "Foi criado justamente com o propósito de expulsar alunas."
31120-51 = "[ns] (O que será que a Nagisa realmente está planejando...?)"
31120-59 = "Batidas na porta...?"
31120-60 = "[ns3] \"...?\"\n[ns4] \"Pode entrar.\""
31120-63 = "Ah, hum, com licença..."
31120-64 = "[s] A porta se abre."
31120-69 = "Hum, desculpe incomodar tão tarde da noite..."
31120-70 = "[s] \"Hifumi? O que houve?\""
31120-71 = "É que... parece que eu não consigo dormir..."
31120-72 = "Comecei a pensar em um monte de coisas e, bom... Auuu..."
31120-74 = "Decidi conversar um pouco com a Hifumi."
31120-76 = "Sensei, muito obrigada pelo seu esforço hoje também."
31120-77 = "[s] \"Eu que agradeço pelo seu esforço, Hifumi.\""
31120-78 = "Amanhã o acampamento começa pra valer, mas... será que nós vamos mesmo ficar bem desse jeito...?"
31120-79 = "Se reprovarmos na segunda prova daqui a uma semana, teremos a terceira prova..."
31120-80 = "E se, por algum acaso, reprovarmos nela também..."
31120-81 = "[s] \"...Todas serão expulsas.\""
31120-82 = "...Então você já sabia mesmo, Sensei."
31120-83 = "Ainda não contei para ninguém, até porque nem sei se é algo que eu deveria contar..."
31120-84 = "É uma prova de desempenho acadêmico, então não entendo direito por que o sistema de avaliação exige que \"todas passem juntas\", e ainda por cima nos cederam até uma instalação de acampamento como esta só para a nossa prova..."
31120-85 = "Além disso..."
31120-86 = "Uuu..."
31120-87 = "[s] \"Hifumi, a Nagisa te disse mais alguma coisa...?\""
31120-88 = "Não, q-quer dizer...!?"
31120-89 = "A-A Nagisa-sama me disse, hum, é que..."
31120-90 = "..."
31120-91 = "...Sim."
31120-92 = "A Nagisa-sama me pediu para \"não contar a ninguém\", mas... esse assunto é demais para eu dar conta sozinha..."
31120-93 = "Hum, como eu posso explicar..."
31120-94 = "[s] \"Ela pediu para você encontrar a 'traidora de Trinity'?\""
31120-95 = "...!?"
31120-96 = "Isso quer dizer que ela falou o mesmo para você, Sensei...?"
31120-97 = "..."
31120-98 = "...Sim, quando eu estava conversando com a Nagisa-sama—"
31120-100 = "Hifumi-san... Você poderia procurar a traidora infiltrada no Clube de Aulas de Reforço para mim?"
31120-101 = "Quê? O quêêê...!?"
31120-102 = "Para ser totalmente franca, no momento não me importo nem um pouco com os resultados das provas do Clube de Aulas de Reforço. A expulsão caso não sejam aprovadas é, no fim das contas, apenas um último recurso."
31120-103 = "Hifumi-san. Você poderia reunir o máximo possível de informações sobre elas e encontrar a \"traidora\" o mais rápido possível?"
31120-104 = "É para isso que você está no Clube de Aulas de Reforço agora, Hifumi-san."
31120-105 = "M-Mas por que eu faria algo assim...?"
31120-106 = "...\"Por quê\", você pergunta?"
31120-107 = "A resposta é porque você tinha conexões com a Schale, Hifumi-san."
31120-108 = "Enquanto o \"Sensei da Schale\", uma terceira facção neutra, estiver junto, a \"traidora\" não poderá agir de forma imprudente."
31120-109 = "Seria como... uma tampa para impedir que o lixo transborde da lixeira, digamos assim."
31120-110 = "L-Lixeira...?"
31120-111 = "...Perdoe-me, esqueça o que eu disse. Estava apenas pensando alto. De qualquer forma—"
31120-112 = "N-Nagisa-sama...! E-Eu, hum, esse tipo de coisa é...!"
31120-113 = "...Hifumi-san."
31120-119 = "Não há outra escolha. E, embora tenha sido inevitável, caso falhemos, você terá o mesmo destino que elas, Hifumi-san... Entende?"
31120-120 = "...!"
31120-122 = "[ns] (A Nagisa colocou a Hifumi nessa situação...)"
31120-123 = "E-Eu, hum, essa história de traidora..."
31120-124 = "Somos todas alunas da mesma escola, não somos...? Hoje mesmo fizemos faxina todas juntas, comemos juntas..."
31120-125 = "Depois de tudo isso, me pedir para investigar quem é a traidora... Isso é..."
31120-126 = "Eu não consigo fazer uma coisa dessas..."
31120-127 = "[s] \"...\""
31120-128 = "..."
31120-129 = "[s] \"Você é muito gentil, Hifumi.\""
31120-130 = "Hã? Q-Quê...!?"
31120-131 = "[s] \"Você não precisa se preocupar com esse assunto, Hifumi.\""
31120-132 = "S-Sensei...?"
31120-133 = "[s] \"Deixe comigo. Eu vou dar um jeito de resolver isso.\""
31120-134 = "..."
31120-135 = "[s] \"Quero que você se esforce apenas no que estiver ao seu alcance, Hifumi.\""
31120-136 = "No que estiver... ao meu alcance..."
31120-137 = "..."
31120-138 = "...Sim! Entendi! Ah, quer dizer, eu ainda não sei bem o que está ao meu alcance, mas... vou pensar a respeito!"
31120-139 = "Muito obrigada, Sensei! Sinto que tirei um peso do coração...!"
31120-142 = "(Enquanto isso...)"
31120-144 = "Alojamento do Acampamento - Saguão"
31120-145 = "..."
31120-146 = "Hanako? O que está fazendo aqui?"
31120-147 = "Ora, Azusa-chan. Ainda acordada? E de uniforme...?"
31120-148 = "Já dormi o suficiente. Então pensei em ficar de vigia."
31120-149 = "De vigia...? Não, mais importante que isso, Azusa-chan... por acaso você não conseguiu pregar o olho até agora? Seu rosto não parece nem um pouco o de quem dormiu bem, sabia...?"
31120-150 = "...Não consigo dormir muito bem em lugares desconhecidos."
31120-151 = "..."
31120-152 = "Não precisa se preocupar. Recebi treinamento adequado para operar durante a madrugada, então ficar cerca de cinco dias sem dormir não é problema."
31120-153 = "Não... Não é bem esse o ponto..."
31120-154 = "Você também veio caminhar, Hanako? Pelo visto a Hifumi também saiu para dar uma volta em algum lugar. Imagino que todas estejam inquietas por estarem em um lugar desconhecido, então achei que seria bom alguém ficar de vigia."
31120-155 = "É só isso, então não precisa se preocupar."
31120-156 = "...Azusa-chan, por favor, não se esforce demais."
31120-161 = "..."
31120-163 = "E assim passou a primeira noite do acampamento..."
31120-165 = "Próximo;O Simulado do Clube de Aulas de Reforço"
