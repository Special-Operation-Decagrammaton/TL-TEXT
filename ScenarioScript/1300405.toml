[translation]
1300405-1 = "Время отплатить"
1300405-2 = "Торговый центр"
1300405-3 = ""
1300405-4 = ""
1300405-5 = "Сенсей! Сюда! Я здесь!"
1300405-7 = "А вот и вы. ☆"
1300405-8 = "Вы заставили меня ждать? Да нет. Может, всего полчаса."
1300405-9 = "А? Нет, вы пришли вовремя, Сенсей. Это я решила прийти пораньше и подождать. ☆"
1300405-10 = "Ну что, пойдём! ☆"
1300405-11 = "Я так ждала нашего свидания — то есть, не могу дождаться похода по магазинам!"
1300405-13 = "Смотрите, Сенсей! Туда тоже надо заглянуть!"
1300405-14 = "Хм. Может, купить ещё и диффузор? В клубной комнате он пригодится, правда?"
1300405-15 = "Это реверси? Может пригодиться..."
1300405-16 = "[s1] «П-помедленнее.»\n[s2] «Нам это правда нужно?»"
1300405-18 = "Вы знаете, как далеко этот торговый центр от старшей школы Абидос?!"
1300405-19 = "Вы знаете, как далеко этот торговый центр от старшей школы Абидос?!"
1300405-20 = "Мы редко сюда выбираемся, поэтому нужно закупаться впрок."
1300405-21 = "К тому же... остальные выплачивают школьный долг из собственного кармана."
1300405-22 = "Мне их жалко. Мы больше похожи на кадровое агентство, чем на школьный клуб..."
1300405-23 = "В любом случае! Продолжим покупки."
1300405-24 = "У меня в бюджете ещё много денег на нужные вещи!"
1300405-25 = ""
1300405-27 = "(После этого мы довольно долго ходили по магазинам.)"
1300405-29 = "Комната Комитета по предотвращению закрытия"
1300405-30 = "(Всё пришлось тащить обратно самим, потому что Абидос находился вне зоны доставки.)"
1300405-31 = "(падает)"
1300405-32 = "С-Сенсей."
1300405-33 = "Вы в порядке? Спасибо, что несёте всё это!"
1300405-34 = "...Простите. Возможно, я действительно переборщила."
1300405-35 = "Клянусь, обычно я столько не покупаю..."
1300405-36 = "Наверное... немного увлеклась."
1300405-37 = ""
1300405-38 = ""
1300405-39 = "*туп*"
1300405-40 = "(...Гантели упали на пол.)"
1300405-41 = "..."
1300405-42 = "Эти гантели я выбрала... в подарок Широко..."
1300405-43 = "*бум* *бум*"
1300405-44 = "А это цветочный горшок для Серики..."
1300405-45 = "Осторожно, Сенсей! Некоторые вещи слишком хрупкие, чтобы так их ронять!"
1300405-46 = "А...? Это..."
1300405-47 = "О, точно. Я забыла, что положила это сюда. Это ватные палочки."
1300405-48 = "Та-дам! Вообще-то я купила их в подарок вам! ☆"
1300405-49 = "[s] «Мне?»"
1300405-50 = "Ага! Подождите минутку!"
1300405-51 = ""
1300405-52 = "*шурх*"
1300405-53 = "Вот, я постелила на пол одеяло."
1300405-54 = "Ну же, Сенсей..."
1300405-55 = "Ложитесь ко мне на колени."
1300405-56 = "[s] «Лечь?»"
1300405-57 = "Именно, скорее!"
1300405-58 = "[s] Лечь."
1300405-62 = "― Начинаем. Сейчас почистим одно ухо.[wa:60]"
1300405-64 = "― Нужно лежать неподвижно. Хорошо, Сенсей?[wa:760]"
1300405-67 = "― Не ёрзайте. Я сейчас введу её, хорошо?[wa:2440]"
1300405-70 = "― Скажите, если будет щекотно."
1300405-72 = "― Вот так. Хорошо. Идеально.[wa:1620]"
1300405-75 = "― Эм... Теперь, когда думаю... Вам немного неловко?[wa:4820]"
1300405-78 = "― Наши лица довольно близко друг к другу...[wa:2320]"
1300405-80 = "― Ну..."
1300405-83 = "― Это специальный сервис только для вас. Наш маленький секрет. Хорошо?[wa:5880]"
1300405-87 = "― Хм? Если вы ляжете так, я буду видеть только затылок...[wa:2180]"
1300405-89 = "― Эм... Что важнее... я чувствую ваше дыхание...[wa:1640]"
1300405-93 = "― Так не пойдёт, Сенсей! Вернитесь в прежнее положение![wa:480]"
1300405-96 = "Вот. Всё чисто."
1300405-97 = "Ну как? Что чувствуете?"
1300405-98 = "[s] «Не знаю. Немного неловко?»"
1300405-99 = "...Ахаха."
1300405-100 = "Если подумать... Наверное, это было довольно неловко..."
1300405-101 = "Но... ох! ♥"
1300405-102 = "Нет, ничего."
