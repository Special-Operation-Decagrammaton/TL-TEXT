[translation]
1012405-1 = "На пляже"
1012405-2 = "Я наслаждался хорошей погодой, ожидая Хасуми."
1012405-3 = "Сначала я заметил её крылья, торчащие из укрытия, и только потом саму Хасуми."
1012405-4 = "[ns1] «Хасуми, я здесь!»\n[ns2] «Хасуми?»"
1012405-9 = "Всё хорошо, Хасуми... Ты старалась...!"
1012405-10 = "З-здравствуйте, Сенсей..."
1012405-11 = "Я выгляжу... неуместно?"
1012405-12 = "[s3] «Ты словно создана для этого места.»\n[s4] «Ты про размер?»"
1012405-15 = "Н-нет! Купальник сидит на мне идеально!"
1012405-16 = ""
1012405-18 = ""
1012405-19 = "Однако по сравнению с другими моё телосложение может показаться немного..."
1012405-20 = "...плотнее. Не знаю, подходят ли мне такие «миленькие» вещи."
1012405-21 = "[s] «Ты милая с любого ракурса!»"
1012405-22 = "Спасибо за добрые слова..."
1012405-23 = "Но вернёмся к делу. Благодаря вам сегодня я закончила работу раньше."
1012405-24 = "Однако я не совсем поняла, что вы имели в виду под «одолжи мне своё время»."
1012405-25 = "[s5] «Именно то, как это звучит.»\n[s6] «Мне скучно, так что поиграй со мной.»"
1012405-28 = "Я многим вам обязана, так что вам даже не нужно просить."
1012405-29 = "[s] «Тогда начнём с песочного замка!»"
1012405-30 = "П-песочного замка?"
1012405-31 = "Ох. Я не против. Просто никогда не представляла себя за таким милым и весёлым занятием."
1012405-32 = "Однако раз вы этого хотите..."
1012405-33 = "...я с радостью соглашусь."
1012405-35 = "Несмотря на нерешительность Хасуми, мы с удовольствием строили песочные замки вместе."
1012405-36 = "А после этого..."
1012405-37 = ""
1012405-39 = "[ns] «Хасуми, давай устроим песочную ванну!»"
1012405-40 = "Я никогда этого не делала. Нужно просто засыпать ваше тело песком?"
1012405-41 = "[s] «В песочной ванне будешь лежать ты, а не я!»"
1012405-42 = "Что?!"
1012405-44 = "И вот я устроил Хасуми песочную ванну."
1012405-47 = "...Скажите хоть что-нибудь."
1012405-48 = "[s7] «П-первый шаг к плаванию — научиться держаться на воде!»\n[s8] «Почему ты совсем не двигаешься вперёд...?»"
1012405-51 = "Я двигаюсь вперёд! Медленно!"
1012405-52 = "Но я не хочу слышать от вас, что я медленная!"
1012405-54 = "Я выяснил, что Хасуми на удивление плохо плавает."
1012405-55 = ""
1012405-56 = ""
1012405-57 = "Я, пожалуй, пропущу пляжное кафе, Сенсей..."
1012405-58 = "Если только вы не голодны, конечно. Но мне сейчас не очень хочется есть."
1012405-59 = "[s9] «О, тебе не нравится местная еда?»\n[s10] «Я не голоден. Просто переживал, что голодна ты.»"
1012405-62 = "Н-нет, мне нравится... Я-я просто... Сейчас я в порядке!"
1012405-64 = "Хасуми была непривычно упряма, поэтому я позволил ей увести меня подальше от пляжного кафе."
1012405-67 = "Хм-м... Может, здесь?"
1012405-68 = ""
1012405-72 = ""
1012405-73 = "Разбивать арбуз с завязанными глазами оказалось на удивление легко."
1012405-74 = "[s11] «Никто не попадает с первой попытки, Хасуми!»\n[s12] «Почему все снайперы так хороши в этой игре...?»"
1012405-77 = "Мне говорили, что у меня превосходное чувство равновесия."
1012405-78 = "Думаю, это благодаря моим большим крыльям."
1012405-79 = "Наверное, за это я им благодарна, но в целом..."
1012405-80 = "[s] «А? Но твои крылья такие красивые!»"
1012405-81 = "В-вы правда так считаете, Сенсей?"
1012405-82 = "Понятно... Я никогда не смотрела на них с этой стороны."
1012405-83 = "Раз вы так считаете, я постараюсь гордиться ими. Даже если они слишком большие."
1012405-85 = "Мы ещё некоторое время разбивали арбузы, а затем..."
1012405-86 = ""
1012405-89 = ""
1012405-90 = "Насколько я понимаю, пляжный волейбол — не игра для двух человек."
1012405-91 = "[s13] «Это правда, но...»\n[s14] «...может, всё равно будет весело?»"
1012405-94 = "Как бы оптимистично вы на это ни смотрели..."
1012405-95 = ""
1012405-97 = ""
1012405-98 = "Ах..."
1012405-99 = "[s] «Ты в порядке?»"
1012405-100 = "Да, всё хорошо. Не беспокойтесь. Просто немного закружилась голова."
1012405-101 = "Я совершенно в порядке..."
1012405-102 = ""
1012405-104 = ""
1012405-105 = ""
1012405-108 = "[ns] «Хасуми?!»"
1012405-110 = "Эм... Я..."
1012405-112 = ""
1012405-113 = ""
1012405-114 = "[ns] «Не вставай слишком резко.»"
1012405-115 = "Я потеряла сознание? И вы перенесли меня в тень? Как мне вообще перед вами извиниться?"
1012405-116 = "П-подождите. Вы сами перенесли меня сюда? Т-тогда это значит..."
1012405-117 = ""
1012405-119 = ""
1012405-120 = "А-а-а-а-а?!"
1012405-121 = "Я случайно не была слишком тяжёлой...? Нет, вообще-то, пожалуйста, молчите! Не отвечайте."
1012405-122 = "[s] «Мне правда очень жаль, Хасуми.»"
1012405-123 = "За что вам вообще передо мной извиняться?"
1012405-124 = "[s15] «Ты и так тратишь столько сил на работу.»\n[s16] «Мне не стоило таскать тебя по всем этим развлечениям.»"
1012405-127 = "Н-нет! Я потеряла сознание совсем не поэтому."
1012405-128 = "Клянусь, вы совершенно ни в чём не виноваты, Сенсей."
1012405-129 = ""
1012405-131 = ""
1012405-132 = "..."
1012405-133 = "[s] «Хасуми. Я спрашиваю, потому что переживаю.»"
1012405-134 = ""
1012405-137 = "[ns] «Ты что, ничего не ела?»"
1012405-138 = ""
1012405-139 = "...Не ела."
1012405-140 = ""
1012405-142 = ""
1012405-143 = ""
1012405-144 = ""
1012405-147 = "А, Сенсей! Где мы...?"
1012405-148 = "Разве это не...?"
1012405-150 = "Вот ваша якисоба, жареная кукуруза, ванильное мороженое и дынная газировка! Ледяная стружка скоро будет готова!"
1012405-151 = "Ты уплетаешь мою стряпню, будто это твоя первая еда в жизни! Ради таких молодых, как ты, я и продолжаю стоять у плиты!"
1012405-152 = ""
1012405-154 = ""
1012405-156 = "С-спасибо, Сенсей. Очень вкусно. Но я мало того что устроила переполох, так вы ещё и еду мне покупаете..."
1012405-157 = "[s] «Хасуми.»"
1012405-158 = ""
1012405-161 = "[ns17] «Здоровые студенты должны нормально питаться.»\n[ns18] «И не морить себя голодом ради какой-то псевдодиеты.»"
1012405-164 = "...Я поняла. *хлюп*"
1012405-165 = "[s] «Ладно, хватит нотаций. Давай есть!»"
1012405-167 = "Ужин получился поздним, но мы вдвоём от души им насладились."
