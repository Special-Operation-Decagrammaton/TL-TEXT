[translation]
10014005-46 = "#video;10014"
10014005-1 = "Пролог;Тема консультации"
10014005-5 = "...Алло?"
10014005-6 = "А! Вы правда ответили. Эм..."
10014005-7 = "С-Сенсей? Это Сенсей?"
10014005-8 = "[s1] «О, этот голос...»\n[s2] «Кто это?»"
10014005-9 = ""
10014005-10 = ""
10014005-12 = ""
10014005-13 = "...А, да. Простите. Надо было представиться."
10014005-14 = "Это Кёяма Казуса из Клуба сладостей после школы, первокурсница Общей школы Тринити."
10014005-15 = "Ну... Видите ли..."
10014005-16 = "*вздыхает* Это неловче, чем я думала."
10014005-17 = "Можем быстро встретиться до начала занятий? Если вы не заняты."
10014005-18 = "Есть железнодорожный переезд, где можем встретиться. Я пришлю фото."
10014005-19 = "[s3] «Только мы вдвоём?!»\n[s4] «Конечно, но что тебе нужно?»"
10014005-20 = ""
10014005-22 = ""
10014005-23 = "...Теперь я понимаю, что остальные про вас говорили."
10014005-24 = "О, вы и правда очень прямолинейны."
10014005-25 = "На самом деле ничего серьёзного."
10014005-26 = "Мне просто нужен совет насчёт одной вещи..."
10014005-27 = "Я не привыкла вот так просить помощи, так что простите, если веду себя неловко."
10014005-28 = "В общем, как я и сказала, ничего большого."
10014005-29 = "Эм."
10014005-30 = "Хотя если вы заняты, я всё понимаю."
10014005-31 = "[s5] «О, не волнуйся. Я рад, что ты позвонила.»\n[s6] «Вообще-то это моя работа.»"
10014005-32 = "...Наверное, вы правы."
10014005-33 = "...Наверное, вы правы."
10014005-34 = "Это хорошо."
10014005-35 = "Спасибо, Сенсей. Мне уже намного легче."
10014005-36 = "Но я не хочу вами пользоваться..."
10014005-37 = "Куплю вам напиток в благодарность. Тогда будем квиты."
10014005-38 = "Хм?"
10014005-39 = "Хотите примерно знать, о чём речь?"
10014005-40 = "Ну, наверное, это справедливо."
10014005-41 = "Ну... как бы сказать..."
10014005-42 = "В последнее время меня..."
10014005-44 = "...преследуют."