[translation]
63090-1 = "Эпизод 9;Подготовка к экзамену"
63090-3 = ""
63090-4 = "Как дела, Саори? Как жизнь?!"
63090-5 = ""
63090-7 = ""
63090-9 = "Спасибо за беспокойство. У меня всё хорошо. Заместитель директора Коно... кажется?"
63090-10 = "Ой, ой, брось эти жёсткие титулы! Просто зови меня Коно!"
63090-11 = "Ты ведь всё равно на год старше меня, да? Даже если мы на одном курсе."
63090-12 = "Поняла, Коно."
63090-13 = "Однако до сих пор я находилась в камере. Есть причина, по которой меня вызвали в комнату допросов?"
63090-14 = "Да не особо. Просто хотела посмотреть, как ты там. И вообще-то ты у нас в Валькирии немного знаменитость, знаешь?"
63090-15 = "...Вот как? Едва ли стоит стремиться к славе в Валькирии."
63090-16 = "...Всё же лучше, чем быть знаменитой по всему Кивотосу, правда..."
63090-17 = "Это верно. Странно, что именно я это говорю, но... звучит тяжеловато."
63090-18 = "Ладно-ладно. Кажется, неловкость немного спала, так что перейдём к делу."
63090-19 = "Вы девочки... Отряд Ариус, верно? Я пришла сообщить вам об официальном уведомлении по Отряду Ариус, которое только что вышло."
63090-20 = "Полагаю, речь о нашем приговоре."
63090-21 = "Да, вроде того."
63090-22 = "Наш приговор уже был утверждён на официальном суде... Они обнаружили ещё какое-то преступление? В любом случае я готова это принять."
63090-23 = "Ну ты даёшь, Саори. Большинство людей реагируют ровно наоборот, знаешь ли."
63090-24 = "П-Правда? Полагаю, Ариус и правда считают противоположностью «нормального»."
63090-25 = "Ага-ага. Генеральный ученический совет тоже рад, что наконец удалось точно установить местоположение школы-сателлита Ариус. Хотя эта часть не так важна."
63090-26 = "Если речь о моей школе, для меня важно всё. Нравится мне это или нет, я оттуда родом."
63090-27 = "...Даже если она известна тем, что выпустила одних из худших террористов, я не стану отрицать этот факт."
63090-28 = "Я никогда не смогу двигаться вперёд, если не приму собственные ошибки."
63090-29 = "Хорошо сказано! И кстати об этом..."
63090-30 = ""
63090-32 = ""
63090-33 = ""
63090-35 = "...Ты жалеешь?"
63090-36 = "Жалею... о теракте?"
63090-37 = "А что ещё я могла иметь в виду?"
63090-38 = ""
63090-40 = ""
63090-42 = ""
63090-43 = "Ага..."
63090-44 = ""
63090-46 = ""
63090-47 = "Хм? Чего ты смеёшься?"
63090-48 = "А, прошу прощения. Я не пыталась смеяться над тобой, Коно, или над Валькирией... или даже над Тринити."
63090-49 = "Просто... это напомнило мне один разговор, который я когда-то давно вела с человеком."
63090-50 = "Ты спросила, жалею ли я. Ответ простой."
63090-51 = ""
63090-53 = ""
63090-54 = "Я жалела об этом каждый день с тех пор, как это произошло."
63090-57 = "Незрелая, глупая новичок, да?"
63090-58 = "Да. Новичок, которая теперь уже часть моего прошлого."
63090-59 = "Но это прошлое, несомненно, часть того, кто я есть."
63090-60 = "..."
63090-61 = "Ну ладно тогда. Как я и думала."
63090-62 = ""
63090-64 = ""
63090-65 = "Что ты имеешь в виду?"
63090-66 = "О, ничего важного."
63090-67 = "И всё же есть вещи, которые я должна сказать. Традиция, процедура и всё такое."
63090-68 = ""
63090-70 = ""
63090-71 = "Поздравляю, Саори. И Отряд Ариус тоже."
63090-72 = "Собирайте вещи. Вас выпускают условно-досрочно."
63090-73 = ""
63090-76 = ""
63090-77 = "Что...?"
63090-78 = "Не уверена, что понимаю, Коно. Это... какая-то шутка?"
63090-79 = "Если честно, я примерно такой реакции и ожидала."
63090-80 = "Сейчас объясню, так что постарайся не отставать."
63090-81 = "Преступления и приговоры Отряда Ариус остаются в силе, но исполнение наказания приостановлено."
63090-82 = "Приостановлено... наказание? Но террористам не дают условных сроков."
63090-83 = "Ну да, вообще-то это правда."
63090-84 = "Но, честно говоря, то, что вы натворили — взрывы зданий, подрывы и всё в таком духе — здесь почти обычное дело."
63090-85 = "...Поэтому строительство и является одной из главных отраслей Кивотоса."
63090-86 = "П-Правда..."
63090-87 = "Так что когда речь идёт о преступлениях в Кивотосе, нас больше всего волнует намерение убить, злой умысел и подобные вещи."
63090-88 = "Вот как? Впервые слышу о таком критерии. Но если так, тогда тем более..."
63090-89 = "Да, в том нападении совершенно точно было и то, и другое. Вы сами это признаёте."
63090-90 = "Но, знаешь, судя по тому, что я видела, вы все действительно осознали свои поступки."
63090-91 = "А-А?"
63090-92 = "К тому же вы сами пришли сдаваться, верно? Наши проблемные детишки пришли и ПОПРОСИЛИ их арестовать... Впервые вижу такое с тех пор, как стала заместителем директора!"
63090-93 = "Студенты, которые способны признать собственные ошибки и сами ищут наказания... Может, будущее Кивотоса не настолько серое и безнадёжное, как я думала!"
63090-94 = "С-Спасибо..."
63090-95 = "(Не мне об этом говорить, но... разве процедура не какая-то слишком расхлябанная?)"
63090-96 = "И главное — больше всего от ваших действий в итоге пострадали Сенсей и Тринити. Но..."
63090-97 = "...от них к нам пришла целая гора ходатайств."
63090-98 = ""
63090-101 = ""
63090-102 = "Даже из Геенны."
63090-103 = "О, вот это было довольно забавно, так что передам."
63090-105 = "Точно, было такое."
63090-106 = "Такие ранения меня не особо волновали, но я злилась из-за того, что Сенсей попал под огонь."
63090-107 = "Но даже с этим..."
63090-108 = "...Сенсей лично попросил меня простить вас хотя бы ради них. Думаю, это единственное, что я могу сказать на эту тему."
63090-109 = "Так что остаётся лишь оплатить расходы Макото на укладку волос..."
63090-110 = "..."
63090-111 = "Вот и всё. Ничего из этого больше не имеет значения."
63090-114 = "Вот так просто...?"
63090-115 = "Похоже на то."
63090-116 = "В общем, раз всё сложилось именно так, особых причин не проявлять снисхождение у нас нет."
63090-117 = "Валькирия — академия, прежде всего предназначенная для наставления и реабилитации."
63090-118 = "И содержание Исправительного бюро тоже обходится недёшево..."
63090-119 = "А главное — Сенсей сказал, что возьмёт за вас ответственность. Так что не разочаруйте его, ладно?"
63090-120 = "Поняла. Я твёрдо это запомню."
63090-121 = "Уточню: условный срок не означает, что вы невиновны. Если во время испытательного периода снова устроите проблемы, нам придётся назначить более суровое наказание."
63090-122 = "Хорошо. Поняла. Если мы снова натворим что-нибудь, можете разбить мой нимб."
63090-123 = "Э-Эй! Нельзя вот так внезапно такое говорить! Жуть! Вы, девочки из Ариуса, страшные!"
63090-124 = "П-Прости..."
63090-125 = "Значит... нас правда... отпускают условно...?"
63090-126 = "Да."
63090-127 = "Раз так, почему бы вам не пойти готовиться к экзаменам?"
63090-128 = ""
63090-130 = ""
63090-131 = "Т-Точно! Экзамены!"
63090-143 = ""
63090-145 = ""
63090-146 = "Добро пожаловать!"
63090-147 = "..."
63090-148 = "П-Привет всем!"
63090-149 = "Итак, этот класс, возможно, не самый современный..."
63090-150 = "...но давайте выложимся на полную, будем учиться и вместе отлично сдадим пробные экзамены!"
63090-151 = ""
63090-153 = ""
63090-155 = "Ого... Этот класс потрясающий..."
63090-156 = "В таком месте и правда можно настроиться на учёбу..."
63090-157 = ""
63090-160 = ""
63090-161 = "...Ч-Что?"
63090-162 = "Да. Я понимаю вашу реакцию."
63090-163 = "По сравнению с теми классами, к которым мы привыкли, это совершенно естественно."
63090-164 = "Д-Да. Это правда..."
63090-165 = "Спасибо, Хифуми. И всем остальным тоже."
63090-166 = "Я благодарна вам всем за помощь с дополнительными занятиями."
63090-167 = ""
63090-169 = ""
63090-171 = ""
63090-172 = "О, не стоит. Мы рады помочь и вам, и Сенсею."
63090-174 = "Но... не упоминать нашу школу или названия клубов оказалось сложнее, чем я думала... Стоит хоть немного расслабиться, и кажется, что сейчас случайно проговорюсь..."
63090-175 = "[s] «У меня то же самое...»"
63090-176 = ""
63090-178 = ""
63090-179 = "..."
63090-180 = "..."
63090-181 = "О, давно не виделись, Азуса."
63090-182 = "Да, давно, Майя."
63090-183 = "Надеюсь, то, что я сейчас скажу, тебя не заденет."
63090-184 = "Сейчас я рада тебя видеть."
63090-185 = "Т-Ты совсем не изменилась..."
63090-186 = "Я рада... Ты хорошо выглядишь..."
63090-187 = "..."
63090-188 = "Ага..."
63090-189 = "Каждый может найти способ жить счастливо."
63090-190 = "Нужно лишь сделать так, чтобы это произошло."
63090-191 = ""
63090-193 = ""
63090-195 = ""
63090-196 = "Так что если есть что-то, с чем я могу помочь, скажи мне."
63090-197 = ""
63090-199 = ""
63090-200 = "Тогда можешь сдать экзамен вместо нас?!"
63090-201 = "Не могу."
63090-202 = "Уааа..."
63090-203 = ""
63090-205 = ""
63090-206 = "А это Кохару... да? Та самая элитная..."
63090-207 = ""
63090-209 = ""
63090-210 = "Х-Хех! Глаз у тебя намётан! Именно! Я великая..."
63090-211 = ""
63090-213 = ""
63090-214 = "Э-Эм! В общем! Меня считают одной из элиты, так что можете на меня рассчитывать!"
63090-215 = "Тогда как решить эту задачу?"
63090-216 = "А-А?"
63090-217 = ""
63090-219 = ""
63090-220 = "(Хм? Я же точно знаю, как это решать...?)"
63090-221 = "(Почему сейчас не могу вспомнить? Я даже помню, как записывала конспект!)"
63090-222 = "Т-Так вот! Это... Это...!"
63090-223 = "Д-Да!"
63090-224 = "У-ух..."
63090-225 = "Этого не будет на экзамене, так что можешь не переживать!"
63090-227 = "Что?! Правда?!"
63090-228 = "Кохару, нельзя так думать. Смысл учёбы не только в том, чтобы что-то зазубрить ради хорошей оценки на экзамене."
63090-229 = "В таком случае получается, что ты сама... готовилась к какому-то «особому экзамену», не так ли?"
63090-231 = "А-А-А-А?!"
63090-232 = "Ч-Что ты несёшь?! Всё совсем не так! Ты НАМЕРЕННО всё извращаешь!"
63090-234 = "Фуфу. Правда?"
63090-235 = "Что важнее, эта задача действительно не будет на экзамене. Но без неё вы не поймёте основные концепции."
63090-236 = "Поэтому давайте подойдём к ней вот так. Смотрите, здесь..."
63090-237 = ""
63090-239 = ""
63090-240 = ""
63090-242 = "Урава Ханако... Она и правда выдающаяся."
63090-243 = "...Настолько выдающаяся, что совершенно непредсказуема."
63090-244 = "Интересно, существует ли вообще что-то, чего Ханако не знает..."
63090-245 = ""
63090-249 = ""
63090-250 = "Я не знаю всего на свете. Я могу знать только то, что знаю."
63090-251 = "Уааа! В-Вы это слышали?! Проститеее! УААА!"
63090-252 = "Не стоит так переживать из-за мелочей. Цучинага Хиёри, верно? Можно называть тебя Хиёри?"
63090-253 = "Что? Д-Да! Дададада. Д-Для меня честь..."
63090-254 = "А эта юная леди... Ты Хакари Ацуко, верно? Ну надо же..."
63090-255 = ""
63090-257 = ""
63090-258 = "Да, Ханако?"
63090-259 = "...Хм?"
63090-260 = "..."
63090-261 = "..."
63090-262 = ""
63090-264 = ""
63090-265 = "Хи-хи!"
63090-266 = "Фу-фу."
63090-267 = "Похоже, я встретила интересного человека. Уверена, отныне мне ещё много раз придётся на тебя рассчитывать, Ацуко."
63090-268 = "У меня такое же чувство. Рассчитываю на тебя, Ханако."
63090-269 = "Ох-ох."
63090-270 = "Хи-хи-хи."
63090-272 = "Что происходит, Ацуко? Ты тоже раньше знала Ураву Ханако?"
63090-273 = "Вовсе нет, Сао-Сао. Просто возникло ощущение. Будто встретила родственную душу."
63090-274 = "И думаю, она почувствовала то же самое."
63090-275 = "...Что вообще сейчас происходит?"
63090-276 = "Пусть это останется моей тайной."
63090-277 = "Я вообще ничего не понимаю, но ладно..."
63090-278 = "Тогда вернёмся к учёбе, все! Оставим это профессионалу, хорошо?"
63090-279 = "[s] «Можете на меня рассчитывать!»"
63090-282 = ""
63090-285 = ""
63090-286 = ""
63090-288 = ""
63090-290 = ""
63090-294 = "...Кстати, что это за странные пушистые штуки, Хифуми?"
63090-295 = ""
63090-297 = ""
63090-298 = "А! Это..."
63090-299 = ""
63090-301 = ""
63090-302 = ""
63090-303 = "...призы! Momo Friends для студентов, которые получат хорошие оценки!"
63090-305 = "Мы опять к этому вернулись...?"
63090-307 = "«Друзья Момо»?"
63090-308 = "Да! Не всем они нравятся, но у них очень преданная фан-база! И в последнее время они всё популярнее!"
63090-310 = "«Не всем они нравятся»... Как далеко мы зашли..."
63090-311 = "Momo Friends — лучшие. Лично я обожаю Skullman. Эти награды замотивируют каждого студента здесь!"
63090-312 = "Почему... они должны мотивировать?"
63090-313 = "О-О! Потому что на наших дополнительных занятиях они были очень эффективны."
63090-314 = "...Правда? Здесь тоже работает какое-то загадочное «явление ангела»?"
63090-316 = "Хм? Н-Нет, ничего такого. Они просто очень милые, поэтому люди стараются больше, потому что хотят получить одну..."
63090-317 = "Именно. Какой ещё нужен повод?"
63090-318 = ""
63090-320 = ""
63090-322 = "..."
63090-323 = "(Здесь явно что-то не так с водой. Вкусы Азусы стали странными.)"
63090-326 = "Эм, вообще-то сначала мы тоже были не очень хороши в учёбе."
63090-327 = "Но учёба — это в основном выстраивание системы. Если постоянно повторять и практиковаться..."
63090-328 = "...вы обязательно сможете поднять баллы!"
63090-329 = "И кроме того, даже такая обычная и ничем не примечательная, как я, смогла пройти дополнительные занятия!"
63090-330 = ""
63090-332 = ""
63090-333 = "..."
63090-334 = "..."
63090-335 = "Эм, Азуса...?"
63090-336 = "Да, Майя?"
63090-337 = "Хифуми правда... обычная?"
63090-338 = "..."
63090-339 = "По моим наблюдениям, есть два вида «обычных»."
63090-340 = "Один — когда ты сама называешь себя обычной, другой — когда такой тебя видят окружающие."
63090-341 = "А какая из них Хифуми?"
63090-342 = "..."
63090-343 = "Без комментариев."
63090-344 = "Но сам этот ответ уже о многом говорит..."
63090-347 = ""
63090-348 = "Запоминай! Запоминай, тупой мозг! Почему ты просто не можешь выучить?!"
63090-349 = "Кажется, я только что поняла великую истину об этом «экзаменационном сезоне»..."
63090-350 = "Что?"
63090-351 = "Это время, когда внезапно ВСЁ, КРОМЕ учёбы, кажется очень весёлым..."
63090-352 = ""
63090-354 = ""
63090-356 = "О-о! Моя мотивация учиться пылает!"
63090-357 = "Серьёзно?"
63090-358 = "Ага. Горела так жарко, что превратилась в пепел."
63090-359 = ""
63090-361 = ""
63090-362 = "Сенсей, кажется, я чем-то заболела. Можно сделать перерыв?"
63090-363 = "[s] «Чем именно?»"
63090-364 = "Болезнью, от которой мне больно, когда я учусь."
63090-365 = "[s] «О нет! Единственное лекарство — учиться, пока не станет лучше»."
63090-366 = ""
63090-368 = ""
63090-369 = "Вы чудовище..."
63090-370 = "[s] «Конечно. В экзаменационный сезон все учителя такие»."
63090-373 = "Ого! Эта задача потрясающая!"
63090-374 = "«Потрясающая»? Что в ней вообще может быть потрясающего?"
63090-375 = "Я серьёзно! Она настолько хороша, что я даже решать её не хочу, чтобы не испортить!"
63090-376 = "Что за...? Кажется, от всей этой учёбы она сломалась..."
63090-379 = "И вот, пока усилия, метания, отчаяние и крики всех смешивались в хаотичную кашу..."
63090-380 = "...день за днём студенты Ариуса усердно готовились к своему самому первому экзамену."
63090-383 = "Следующий Эпизод;Экклесия для тех, кто не исчезает"
