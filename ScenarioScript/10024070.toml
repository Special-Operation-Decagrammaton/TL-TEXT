[translation]
10024070-1 = "Эпизод 7;Полный галоп, суровый урожай"
10024070-2 = "Окраины Шаньхайцзина"
10024070-6 = ""
10024070-8 = ""
10024070-9 = "..."
10024070-10 = "..."
10024070-11 = "Жёлтый журавль сходит с дороги."
10024070-12 = "Он никогда не возвращается."
10024070-13 = "За тобой следили?"
10024070-14 = "В Шаньхайцзине — нет. А за тобой?"
10024070-15 = "Снаружи за мной никто не шёл."
10024070-16 = "Зачем ты устроил эту встречу?"
10024070-17 = "У нас жалобы на последнюю поставку."
10024070-18 = "Какую поставку?"
10024070-19 = "Не прикидывайся дурочкой. Не хотелось бы, чтобы ты упустила шанс всё исправить."
10024070-20 = "Твоя «Обезьяна Чувств» знает, что ты пытаешься нас доить?"
10024070-22 = "По-моему, ты отворачиваешься и от нас, и от Обезьяны Чувств."
10024070-23 = "Чушь. Я ни разу не думала сделать что-то подобное."
10024070-25 = "Я честно работала с вами на каждом этапе. Ты знаешь это лучше всех."
10024070-26 = "Я тоже так думал. Но в твоей последней партии десятитысячелетнего женьшеня..."
10024070-28 = "...были одни морковки!"
10024070-29 = "Ещё раз: какая поставка? Я давно ничего вам не отправляла!"
10024070-31 = "Если не ты отправила... тогда кто?"
10024070-32 = "Наконец-то слушаешь разум. Но погоди... Если кто-то отправил вам..."
10024070-33 = ""
10024070-37 = "Слушай."
10024070-38 = "Кто там?!"
10024070-39 = "Две крысы встречаются в переулке, чтобы строить заговор, и никто не видит, кроме неба. Вам не повезло: небо рассказало мне всё."
10024070-40 = "Это...?"
10024070-41 = "Я никогда не хотела быть героем, но долг... Долг требует действовать, ведь я женщина действия."
10024070-42 = "Чёрт! Бежим!"
10024070-43 = "Ради чего ты поёшь? Ради чего живёшь?"
10024070-44 = "Я не понимаю, что происходит!"
10024070-45 = "Недостаточно просто быть живым. Нужно разжечь огонь в своём сердце!"
10024070-47 = "Я Коноэ Мина, исполнительный офицер Генрюмон. Всем замереть!"
10024070-48 = "Генрюмон здесь?!"
10024070-49 = "Кстати, бежать некуда. Вы окружены."
10024070-50 = "Нет-нет, попробуйте. Хочу посмотреть, как у вас получится."
10024070-51 = "Конечно, сначала придётся пройти через меня."
10024070-52 = "Променад Чёрной Черепахи и Генрюмон... работают вместе...?!"
10024070-53 = "Вот что я ненавижу в преступниках. Никакого воображения."
10024070-54 = "А теперь покажитесь!"
10024070-55 = ""
10024070-57 = ""
10024070-59 = ""
10024070-61 = "Ц...!"
10024070-63 = "Стой... Ты..."
10024070-65 = "Эта форма...!"
10024070-66 = "А, конечно. Бывает."
10024070-67 = "Надо извиниться перед маленькой Коконой за то, что заставили её доставлять эти морковки."
10024070-68 = "Да. Мне тоже неловко, что мы её так обманули..."
10024070-69 = "[s] «Надо заодно извиниться перед Шун.»"
10024070-70 = ""
10024070-72 = ""
10024070-74 = ""
10024070-75 = "Я знаю тебя."
10024070-76 = "Зачем ты это сделала?"
10024070-77 = "..."
10024070-78 = "Отвечай!"
10024070-79 = "Я сделала это из-за тебя... Коноэ Мина."
10024070-80 = "Я?"
10024070-81 = "Мне нужна была твоя должность. А чтобы её получить, нужны были деньги."
10024070-82 = "Я услышала о ком-то за пределами Шаньхайцзина, кто хотел заполучить десятитысячелетний женьшень."
10024070-83 = "Они обещали хорошие деньги. И могли платить наличными."
10024070-84 = "Сделка была неплохая. А добыть несколько лишних коробок Променада Чёрной Черепахи было легко."
10024070-85 = "...Почему тебе нужна была моя должность?"
10024070-86 = "Ты острие Генрюмон. Исполнительный офицер. Личная охрана президента..."
10024070-87 = "Может, ты слишком тупая, чтобы это понять, но фактически ты второй человек в Генрюмон."
10024070-89 = "Но ты не ценишь президента так, как я!"
10024070-90 = "Её внимание тратится на тебя впустую! Именно я должна быть рядом с ней!"
10024070-91 = "...?!"
10024070-92 = ""
10024070-94 = ""
10024070-95 = ""
10024070-96 = "Она идиотка."
10024070-97 = "Она идиотка."
10024070-99 = "Ты обманула этих детей. Пошатнула сами основы Шаньхайцзина. И всё... ради этого?"
10024070-100 = "«Ради этого»? Это самая важная причина в мире!"
10024070-102 = "Ты вообще не понимаешь президента... Даже если она простит тебя за это, я — не прощу!"
10024070-103 = "Что за чушь. Ты правда устроила столько проблем ради этого?"
10024070-104 = "А теперь ещё кто?!"
10024070-105 = "Контрабанда, предательство и всякие преступления... Ну, мне на это, если честно, плевать."
10024070-106 = "Меня больше интересует вдохновитель всей этой операции!"
10024070-107 = ""
10024070-109 = ""
10024070-110 = "Это я, Якуши Сая! И от имени Общества восточной алхимии мне тоже есть что сказать!"
10024070-111 = "Общество восточной алхимии?! Ты что, пригласила ВСЕХ своих друзей, черепаха?"
10024070-113 = "Нет, я тут вообще ни при чём!"
10024070-115 = "Не недооценивайте информационную сеть Общества!"
10024070-116 = "Когда дело касается перемещения экспериментальных реагентов, мы осведомлены не хуже Променада Чёрной Черепахи!"
10024070-118 = "Правда?!"
10024070-119 = "Да, это очень мило с твоей стороны. Спасибо за всю помощь. До свидания!"
10024070-121 = "Так легко от меня не отделаетесь!"
10024070-122 = "Если вдохновитель тот, о ком я думаю..."
10024070-123 = "...она угрожает всему Шаньхайцзину!"
10024070-124 = ""
10024070-126 = ""
10024070-127 = ""
10024070-128 = "..."
10024070-129 = "Всё становится запутаннее..."
10024070-130 = "Всё нормально. Нужно просто их избить."
10024070-132 = "Цк! Похоже, выбора нет."
10024070-134 = "Рэйдзё, если не затруднит."
10024070-136 = "Да, Президент. Я как раз надеялась, что вы отдадите приказ."
10024070-137 = "Во имя Генрюмон!"
10024070-138 = "Мне нужны ОТВЕТЫ!!"
10024070-139 = "Ждём ваших приказов, Сенсей."
