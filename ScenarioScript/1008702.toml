[translation]
1008702-1 = "Я не проиграю!"
1008702-2 = "Я понятия не имел, что происходит, но всё равно отправился в Геенну."
1008702-3 = ""
1008702-13 = "Административный офис Префекторской команды"
1008702-15 = ""
1008702-16 = "Вы опоздали!!"
1008702-17 = "[s] «...Но я ведь пришёл вовремя.»"
1008702-18 = ""
1008702-20 = ""
1008702-21 = ""
1008702-22 = "Ой... И правда."
1008702-23 = ""
1008702-25 = ""
1008702-27 = "Но вы заставили меня ждать, значит, вы опоздали!"
1008702-28 = "[s] «Вот как это работает...?»"
1008702-29 = "Да! Именно так это и работает!"
1008702-30 = "Вы знаете, сколько раз я посмотрела на часы, пока ждала вашего прихода?"
1008702-31 = ""
1008702-33 = ""
1008702-34 = "И всё же... ТЕХНИЧЕСКИ вы пришли вовремя. Так что я вас прощаю."
1008702-35 = ""
1008702-38 = "[ns1] «(Не думаю, что время относительно, но...)»\n[ns2] «(Рад, что она ведёт себя как обычно.)»"
1008702-43 = "[ns] «Так что случилось, Ако?»"
1008702-44 = ""
1008702-46 = "Это всё те мелкие вредители из Общества Пандемониума!!"
1008702-47 = "Вы знали, что они решили устроить вечеринку? Они снова решили спустить все наши лишние средства на какое-то нелепое развлечение!"
1008702-48 = "Только взгляните на этот план вечеринки!"
1008702-49 = "[s] «Хм...»"
1008702-50 = "Это же буквально перечень всех их злодейских замыслов!"
1008702-51 = ""
1008702-53 = ""
1008702-54 = "Они собираются щеголять в броских вечерних нарядах, а Префекторской команде... особенно старшему администратору, предлагают прийти в своих обычных лохмотьях?"
1008702-55 = "Серьёзно. Моя одежда? Лохмотья? Что за чушь!"
1008702-56 = "[s3] «...Ох.»\n[s4] «Д-давай успокоимся.»"
1008702-57 = "Я — Амау Ако! И я не собираюсь молча терпеть насмешки."
1008702-58 = "Но я — Амау Ако! Я не позволю им провести меня этим мерзким планом."
1008702-59 = "Я знала, что нечто подобное случится. Именно поэтому заранее подготовила секретный резервный фонд на такой случай."
1008702-60 = "[s] «Секретный резервный фонд?!»"
1008702-61 = "Пора начинать войну! Мне нужно платье, которое сотрёт этих паразитов в порошок!"
1008702-62 = "Я покажу им, насколько они ниже Префекторской команды — будто застряли на самом дне ущелья."
1008702-63 = "Теперь вы хорошо понимаете ситуацию, Сенсей?"
1008702-64 = "[s] «О, я всё понимаю... Но при чём тут вообще я?»"
1008702-65 = ""
1008702-67 = ""
1008702-68 = "Что? Сенсей, это имеет к вам самое прямое отношение!"
1008702-69 = "Вы должны помочь мне выбрать платье!"
1008702-70 = ""
1008702-73 = "[ns] «Я?»"
1008702-74 = "А?"
1008702-75 = "А кто ещё, если не вы, Сенсей?"
1008702-76 = "[s] «Но разве тебе не стоит выбрать то, которое больше всего нравится тебе самой?»"
1008702-77 = ""
1008702-79 = ""
1008702-80 = "...Что?"
1008702-81 = ""
1008702-83 = ""
1008702-84 = ""
1008702-85 = "Ч-Что вы такое говорите? Вы правда думаете, что я должна одна выбрать настолько важное платье?"
1008702-86 = "Вы невозможны, Сенсей. Для меня это очень важно. А вы сидите тут с таким видом: «Меня это не касается, зачем мне помогать?»."
1008702-87 = "[s] «Хм, да, звучит не очень.»"
1008702-88 = "В этот раз отсидеться в стороне не получится. Мне нужно поставить их на колени, а без мнения со стороны я не справлюсь."
1008702-89 = "Нужен кто-то, кто скажет, хорошо ли сидит платье. Или какой цвет лучше подчёркивает мои глаза."
1008702-90 = "[s] «Я... Хм... Это... Ладно...»"
1008702-91 = ""
1008702-93 = ""
1008702-94 = ""
1008702-95 = "Тогда приступим к делу."
1008702-96 = ""
1008702-98 = ""
1008702-99 = "Вот, возьмите этот каталог платьев."
1008702-100 = "Выберите то, которое подходит мне лучше всего!"
1008702-102 = "Так начались поиски платья для Ако."
1008702-106 = "Для начала определимся с цветом. Что думаете?"
1008702-107 = "[s5] «Хм... Может, для цельности образа взять цвет, похожий на твою обычную одежду?»\n[s6] «Как насчёт синего?»"
1008702-110 = "...Хм. Это ваши предпочтения? ...Я учту."
1008702-111 = "[s] «Нет-нет, я просто думаю, что тебе это пойдёт. Не подстраивайся под мои вкусы.»"
1008702-112 = ""
1008702-114 = ""
1008702-115 = "Что? Не будьте таким нерешительным."
1008702-116 = "Речь об эстетике, Сенсей. У вас должно быть собственное художественное мнение. Расскажите о своих вкусах!"
1008702-117 = "[s] «...Понял.»"
1008702-120 = "Теперь перейдём к фасонам. Какой, по-вашему, выглядит лучше?"
1008702-121 = "[s7] «На вечеринке нужно выделяться. СМЕЛЕЕ!»\n[s8] «Лучше что-нибудь сдержанное. Не стоит подавлять остальных гостей. Чем меньше, тем лучше.»\n[s9] «Это ведь война? Запугай их дизайном, который кричит: „в атаку, в атаку, в атаку!“»"
1008702-125 = "Вы имеете в виду что-то вроде этого? Посмотрим..."
1008702-126 = ""
1008702-128 = ""
1008702-129 = ""
1008702-130 = ""
1008702-131 = ""
1008702-132 = "Это? Не знаю, кажется, тут СЛИШКОМ много всего."
1008702-133 = "Вот это могло бы дать тем вредителям достойный отпор, но..."
1008702-134 = "А может—? Ух, мне нужно немного подумать..."
1008702-135 = ""
1008702-137 = ""
1008702-138 = ""
1008702-139 = ""
1008702-140 = "...Вам правда нравится эта одежда, которая выглядит так безвкусно?"
1008702-141 = ""
1008702-144 = "[ns] «А?»"
1008702-145 = "Вы хотите, чтобы я надела нечто подобное? Я, старший администратор Префекторской команды? Накладываю вето! Вето!"
1008702-146 = "И зачем я вообще решила положиться на чужой вкус?"
1008702-147 = "Я сама что-нибудь выберу!"
1008702-148 = "[s] «Э-Эй, разве это не немного слишком—»"
1008702-149 = "Это вы слишком!"
1008702-150 = "И не смейте говорить, что я не могу определиться!"
1008702-151 = ""
1008702-153 = ""
1008702-154 = "Я и так знаю! Не напоминайте."
1008702-156 = "(Я решил, что лучше вернуться в Шале. Ако продолжила нервничать и мучительно выбирать, что надеть.)"
