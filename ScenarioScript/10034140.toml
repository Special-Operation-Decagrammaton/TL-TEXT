[translation]
10034140-1 = "5 дней назад: Смена позиций"
10034140-3 = "...Хм. Хорошо. Пока остановимся здесь."
10034140-4 = "Кажется, я становлюсь лучше... Или нет..."
10034140-5 = "Когда растёшь каждый день, трудно заметить изменения от одного дня к следующему."
10034140-6 = "Но не волнуйся. Я их замечаю, и под моим бдительным надзором ты значительно улучшилась."
10034140-8 = "Я бы сказала, ты уже на моём уровне. Иногда даже превосходишь меня."
10034140-9 = "...Уверена, это комплимент, но всё равно почему-то бесит. У тебя настоящий талант так говорить."
10034140-10 = "Если бы сюда вошёл кто-нибудь посторонний и увидел тебя, мог бы решить, что ты эксперт."
10034140-11 = "Ч-Что ты имеешь в виду?"
10034140-12 = "Моё мастерство растёт с каждой секундой. В следующий раз, когда увидишь меня, удивишься."
10034140-13 = "Да-да. Поняла. Дура здесь я, раз воспринимала всё всерьёз..."
10034140-14 = ""
10034140-15 = "...вот что они говорят."
10034140-16 = "Почему-то кажется, что только Айри смотрит на меня..."
10034140-17 = "...Хм-м..."
10034140-18 = "...Может, нам тоже поменяться?"
10034140-19 = "Хи-хи. Значит, мы думали об одном и том же, Казуса."
10034140-20 = "Тогда оставляю это тебе!"
10034140-21 = "...Эм, д-да. Конечно..."
