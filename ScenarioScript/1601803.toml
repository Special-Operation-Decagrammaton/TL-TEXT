[translation]
1601803-1 = "Вес капитана"
1601803-2 = "Мы с Рабу отправились в торговый квартал."
1601803-3 = "Хм-м... Хм-м..."
1601803-4 = "Выбор тут непростой..."
1601803-5 = "[s1] «Что это?»\n[s2] «Какой-то порошок из бобов?»"
1601803-8 = "Порошок из бобов? Нет. Это штука бандитов в шлемах."
1601803-9 = "Это молотая скорлупа грецких орехов. Не думала, что видов будет столько."
1601803-10 = "Когда мы разбиваем шлем, его нужно перекрасить. Сначала шлифуем поверхность наждачкой, да?"
1601803-11 = "Но тогда он выглядит слишком новым — блестящим и отражающим свет, как машина. Поэтому мы используем скорлупу, чтобы вернуть поверхности фактуру. Ну, сделать её снова шероховатой."
1601803-12 = "[s] «Но я видел, что некоторые из вас носят блестящие шлемы.»"
1601803-13 = "Ну да. Но подумай сам."
1601803-14 = "В драке хочется выглядеть сурово — тогда надеваешь потёртый. А блестящий можно оставить для вечеринки или чего-то такого."
1601803-15 = "В общем, мы обрабатываем поверхность скорлупой, чтобы получить нужную фактуру."
1601803-16 = "Не думала, что придётся так выбирать. Зернистость 30 или 50? Хм..."
1601803-17 = "[s] «Но разве результат не будет одинаковым?»"
1601803-18 = "Любитель! Ну же, Сенсей. Смотри внимательнее — может, чему-нибудь научишься!"
1601803-19 = "Надо выбрать правильно. В этом месяце я немного на мели."
1601803-20 = ""
1601803-26 = "А?"
1601803-27 = "Та девушка вон там... Кажется, она главарь Splash Helmet Gang, да?"
1601803-28 = "О, ещё и с Сенсеем из Шале. О-о-о-о! Что это у нас тут?"
1601803-29 = "Эй, ведроголовая!"
1601803-30 = "Ты бросила свою банду и теперь встречаешься с Сенсеем?"
1601803-31 = ""
1601803-33 = ""
1601803-34 = "Чего вы там несёте?!"
1601803-35 = "Хе. А где твои танцоры на заднем плане, принцесса?"
1601803-36 = "Может, навалимся на неё прямо здесь и сейчас?"
1601803-37 = "*вздыхает*"
1601803-38 = "Сенсей, дай мне секунду. Отойди в сторону."
1601803-39 = "[s] «Почему ты снимаешь носок? И надеваешь его на оружие?»"
1601803-40 = "Она совсем свихнулась."
1601803-41 = "Может, тусовки с Сенсеем свели её с ума."
1601803-42 = "В этом месяце у меня туго с деньгами. Не собираюсь тратить пули на таких неудачников, как вы."
1601803-43 = "Так что сейчас отличный момент либо купить что-нибудь, либо проваливать!"
1601803-44 = "Громкие слова..."
1601803-45 = "Взять её!"
1601803-46 = ""
1601803-48 = ""
1601803-51 = ""
1601803-52 = ""
1601803-60 = "Хрг!"
1601803-61 = ""
1601803-63 = ""
1601803-65 = "Лупить нас оружием как дубинкой. Как дёшево...!"
1601803-66 = "Дай сюда!"
1601803-67 = ""
1601803-73 = ""
1601803-77 = "Н-Носок?!"
1601803-78 = "Ты упала, потому что стащила его с оружия, идиотка. И да, носок мне потом верни."
1601803-79 = "Н-Нет!"
1601803-80 = "Ещё как да!!"
1601803-81 = ""
1601803-90 = "*вздыхает* Какая морока."
1601803-91 = "Комакадзэ Рабу! Ты решила устроить это на нашей территории?"
1601803-92 = "Кинь в неё гранату!"
1601803-93 = "Подача!"
1601803-94 = "Оп!"
1601803-95 = ""
1601803-100 = "А-а-а-а-а!"
1601803-101 = ""
1601803-105 = "Ей бы над подачей поработать..."
1601803-106 = "Все! Окружить её!"
1601803-114 = "К-Как она до сих пор держится? Ух..."
1601803-115 = "Отступаем! Отступаем!"
1601803-116 = ""
1601803-118 = ""
1601803-119 = "Это реально раздражало."
1601803-120 = "Посмотри на этот закат! Они целый день угробили!"
1601803-121 = "В следующий раз, когда их увижу, просто упаду на пол и уползу."
1601803-122 = "Ух... Я выжата."
1601803-123 = "Сенсей, ты в порядке? Ни царапин... ни ран, да?"
1601803-124 = "[s3] «Я в порядке! Даже чувствую себя лучше!»\n[s4] «С тобой такое часто происходит?»"
1601803-127 = "Сегодня было немного жестковато, но да. Обычное дело."
1601803-128 = "Мы с бандитами не ладим. Да и банды в шлемах иногда дерутся между собой."
1601803-129 = "Но теперь все на несколько дней притихнут. Иногда им просто нужно кое о чём напомнить."
1601803-130 = "[s] «Напомнить, какая ты сильная, Рабу!»"
1601803-131 = "Хе, ещё бы."
1601803-132 = "Я всё-таки не просто так капитан Splash Gang."
1601803-133 = "[s] «Ты такой надёжный лидер!»"
1601803-134 = "Ну хватит, Сенсей. Ты мне льстишь."
1601803-135 = "[s] «И такая добрая!»"
1601803-136 = "П-Погоди!"
1601803-137 = "[s] «И твои острые зубки супер-милые!»"
1601803-138 = "З-Заткнись!"
1601803-140 = "Я продолжал осыпать Рабу комплиментами, пока она в шутку отталкивала меня."
