[translation]
22130-1 = "Episódio 13;Big Sister"
22130-2 = "Interior de Eridu - Instalação Central de Isolamento"
22130-5 = "Rio... O que você está fazendo é verdadeiramente abominável.#nNão consigo nem suportar olhar para isso."
22130-6 = "...Himari."
22130-7 = "Você está sempre me insultando de todas as formas possíveis, não é?#nDizendo que sou sombria, ou água podre flutuando numa fossa..."
22130-8 = "..."
22130-9 = "...Bom, não importa.#nQuem consegue me acusar dessa maneira, em toda Millennium—"
22130-10 = "—Não, em toda Kivotos, provavelmente é só você, Himari."
22130-11 = "Justamente por ser você, eu tinha esperança de que pudesse entender o que estou prestes a fazer."
22130-12 = "Você quer dizer o ato de \"destruir o Halo da Aris\"?"
22130-13 = "..."
22130-14 = "Você provavelmente acredita que o que está fazendo é para proteger Millennium — e, por extensão, Kivotos...#nAlgo desse tipo."
22130-15 = "—Mas, no fim das contas, você está apenas sequestrando uma garota, prendendo-a em uma cidade#ne tentando destruir o Halo dela, não é?"
22130-16 = "Suas palavras não estão erradas — mas,"
22130-17 = "Não, tem razão... Como você pensa assim, não consegue me entender...#nE muito menos me tolerar."
22130-18 = "Sim. Eu não concordo com você.#nE — o Sensei de Schale também não vai ficar de braços cruzados."
22130-19 = "É verdade.#nA probabilidade de o Sensei vir resgatar a Aris é superior a 99,9999%..."
22130-20 = "Além disso, a C&C, a maior força de combate de Millennium, também está do lado dele."
22130-21 = "—Francamente, ninguém consegue me entender, não é?#n...Nem uma única pessoa."
22130-22 = "Rio... Mesmo sabendo disso, você ainda..."
22130-23 = "—Mesmo assim, não me importo."
22130-24 = "Himari, você disse outro dia, não foi?#nQue eu estaria construindo uma \"casa segura\"."
22130-25 = "...Para falar com mais precisão,#nesta Eridu é uma \"fortaleza\" construída para prevenir e interceptar ameaças que surgirão no futuro..."
22130-26 = "Rio, você continua a mesma de sempre..."
22130-31 = "Não me importo se ninguém me entender, nem se o mundo inteiro me rotular como vilã—"
22130-32 = "Eu apenas seguirei o caminho que acredito ser o certo."
22130-34 = "Mesmo considerando e calculando todas as variáveis possíveis...#na probabilidade de eu atingir meu objetivo é superior a 99%."
22130-35 = "Os preparativos estão completos. Agora só resta executar..."
22130-39 = "Rio-sama, recebemos um relatório da vigilância de Eridu."
22130-40 = "...Entendido.#nNo fim, tudo está acontecendo exatamente como os dados previram."
22130-41 = "Então... conto com você para o resto."
22130-42 = "Sim, senhora."
22130-46 = "Quando tudo isso acabar...#nHimari, você também..."
22130-47 = "E você também, Sensei de Schale..."
22130-48 = "Com certeza..."
22130-50 = "..."
22130-59 = "Então aqui é..."
22130-60 = "Eridu..."
22130-61 = "A Aris-chan está aqui..."
22130-68 = "Ótimo, conseguimos chegar ao local no \"trem não tripulado de transporte logístico\" como previsto."
22130-69 = "Sim. Graças à ajuda do Veritas."
22130-70 = "Como esperado do Veritas!#nQuem diria que vocês hackeariam o sistema inteiro do trem!"
22130-74 = "...Não teve um pouco de veneno nisso aí? Ou é impressão minha?"
22130-75 = "Bom, deixa pra lá... Tomem cuidado.#nAssim que saírem à superfície no fim desse corredor, já estarão em \"Eridu\"."
22130-76 = "Por via das dúvidas, estou monitorando tudo direitinho, então podem ficar tranquilos♪"
22130-77 = "Porém, pode ser que algo que não conseguimos detectar apareça de repente,#nentão tenham muito cuidado."
22130-78 = "[s] \"Sim, obrigado. Vamos tomar cuidado.\""
22130-79 = "Então, primeiro vamos deixar a C&C fazer a bagunça...#nNós ficamos por aqui e..."
22130-84 = "Uwaaah! O-O que é isso?!"
22130-85 = "Ora, mas que gracinha.#nSerá que está perdido?"
22130-86 = "[s1] \"Não, não, não, claro que não está perdido!\"\n[s2] \"Isso... é um drone da Rio...!\""
22130-87 = "Não pode ser...! Já fomos descobertos?!"
22130-88 = "Não pode ser...! Já fomos descobertos?!"
22130-89 = "Não, está tudo bem."
22130-91 = "Já neutralizamos antes que nos descobrissem!#nE aproveitamos para hackear a rede da área, então está tudo sob controle!"
22130-93 = "Uau, dá pra fazer isso também... Que incrível!"
22130-94 = "Só o Veritas mesmo para conseguir fazer isso. Até aqui, é um bom começo."
22130-95 = "[ns] \"Certo, então pessoal, preparem-se para o combate!\""
