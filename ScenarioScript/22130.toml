[translation]
22130-1 = "Эпизод 13; Большая Сестра"
22130-2 = "Центральный карантинный комплекс Эриду"
22130-5 = "Рио, всё, что ты делаешь, настолько отвратительно."
22130-6 = "...Химари."
22130-7 = "Я знаю, что ты обо мне думаешь. Ты всегда говорила, что я похожа на грязную канализационную воду..."
22130-8 = "..."
22130-9 = "Впрочем, неважно. Во всём Миллениуме только ты..."
22130-10 = "Да что там — во всём Кивотосе только ты вправе меня винить."
22130-11 = "Именно поэтому я надеюсь, что ты поймёшь, что я собираюсь сделать."
22130-12 = "Ты об уничтожении нимба Алисы?"
22130-13 = "..."
22130-14 = "Ты думаешь, что защищаешь Миллениум и Кивотос..."
22130-15 = "Но в действительности ты лишь похитила девочку, заперла её в этом пустом городе и теперь собираешься уничтожить её нимб."
22130-16 = "Ну, если так сформулировать..."
22130-17 = "Я знаю, о чём ты думаешь. Знаю, почему ты меня не понимаешь и не можешь принять."
22130-18 = "Верно, я с тобой не согласна. Но важнее другое... Сенсей не позволит этому случиться."
22130-19 = "Да. Вероятность, что Сенсей придёт сюда спасать Алису, около 99,99999%... Я бы даже сказала — 100%."
22130-20 = "К тому же C&C, сильнейшая боевая сила Миллениума, тоже на стороне Сенсея."
22130-21 = "Ни одна душа меня не понимает."
22130-22 = "Рио... Даже зная всё это..."
22130-23 = "Неважно."
22130-24 = "Химари, ты раньше спрашивала, строю ли я убежище."
22130-25 = "В каком-то смысле его можно так назвать, но точнее Эриду — крепость, построенная для предотвращения, перехвата и уничтожения будущих угроз..."
22130-26 = "Рио, ты правда никогда не меняешься."
22130-27 = ""
22130-29 = ""
22130-30 = ""
22130-31 = "Мне всё равно, если меня неправильно поймут или мир объявит меня злом."
22130-32 = "Я делаю то, что считаю правильным!"
22130-33 = ""
22130-34 = "Я просчитала все возможности и переменные. Вероятность достижения моей цели превышает 99%."
22130-35 = "Всё идеально подготовлено, остаётся лишь исполнить..."
22130-36 = ""
22130-39 = "Рио, поступил доклад от сети наблюдения Города-крепости Эриду."
22130-40 = "...Вот как. Они действительно нашли сюда дорогу."
22130-41 = "Оставляю их тебе, Токи."
22130-42 = "Да, мэм."
22130-43 = ""
22130-45 = ""
22130-46 = "Химари, когда всё закончится..."
22130-47 = "И тот Сенсей..."
22130-48 = "Ты..."
22130-50 = "..."
22130-52 = ""
22130-59 = "Это место..."
22130-60 = "Эриду..."
22130-61 = "Алиса здесь..."
22130-68 = "Превосходно. Мы успешно угнали беспилотный грузовой поезд и прибыли на место."
22130-69 = "Без Веритас мы бы не справились. Не думала, что взломать систему поездов будет так легко."
22130-70 = "После взлома школьных записей Миллениума им это наверняка раз плюнуть!"
22130-71 = ""
22130-73 = ""
22130-74 = "В чём ты нас обвиняешь?!"
22130-75 = "В любом случае будьте осторожны. Пройдёте через тоннель и выйдете на поверхность — окажетесь прямо в Эриду."
22130-76 = "Мы следим за экраном, не моргая, но..."
22130-77 = "Отсюда видно не всё. Будьте начеку."
22130-78 = "[s] «Принято. Спасибо всем.»"
22130-79 = "Мы тихо посидим здесь, пока C&C не начнёт буйствовать и отвлекать их, как запланировано..."
22130-81 = ""
22130-83 = ""
22130-84 = "Ого?! Ч-Что это?!"
22130-85 = "О, прикольно. Этот дрон заблудился?"
22130-86 = "[s1] «Нет-нет-нет, конечно же нет!»\n[s2] «Этот дрон... управляется Рио!»"
22130-87 = "Не может быть...! Она уже нас нашла?!"
22130-88 = "Не может быть...! Она уже нас нашла?!"
22130-89 = "Не волнуйтесь."
22130-91 = "Мы перехватили систему раньше, чем она заметила! И взломали окружающие сети, так что вас ещё не раскрыли."
22130-93 = "Это же безрассудство!"
22130-94 = "Как и ожидалось от Веритас. Работу сделали."
22130-95 = "[ns] «Отлично! Готовимся к бою!»"
