[translation]
1301106-1 = "Персиковое ралли печатей"
1301106-2 = "Рынок электроники Миллениум «Хару-Хабара»"
1301106-3 = ""
1301106-4 = ""
1301106-5 = ""
1301106-6 = "Эх, вот бы я узнала раньше!"
1301106-7 = "[s] «Момои, что случилось?»"
1301106-8 = "В честь сорокалетия Ultra Marine Sisters проводится ралли печатей..."
1301106-9 = "Событие действительно достойно сорокалетнего юбилея. По всей Хару-Хабаре расположено сорок точек с печатями, и если собрать их все, можно обменять заполненную карточку на эксклюзивную награду."
1301106-10 = "Но срок заканчивается сегодня в 14:00..."
1301106-11 = ""
1301106-12 = "Что же делать, Сенсей? Осталось меньше двух часов!"
1301106-13 = "Уже давно не было события с призом, который мне настолько хотелось получить!"
1301106-14 = "[s] «Момои.»"
1301106-15 = "А...?"
1301106-16 = "[s] «Сдаваться ещё рано! Пока не попробуешь — не узнаешь.»"
1301106-17 = "Н-но, Сенсей, о чём вы говорите?"
1301106-18 = "[s1] «Нас здесь двое, Момои.»\n[s2] «Так что пора воспользоваться твоей специализацией.»"
1301106-19 = "Что?"
1301106-20 = ""
1301106-21 = "Что?"
1301106-22 = ""
1301106-23 = "О... Вы про кооператив на двоих!"
1301106-24 = "Вы совершенно правы, Сенсей!"
1301106-25 = "Не существует... невыполнимых квестов!"
1301106-26 = "Хорошо, Сенсей! Здесь разделимся!"
1301106-27 = "Каждый возьмёт половину целей, и мы соберём все печати!"
1301106-28 = "Я рассчитываю на Вас, Сенсей."
1301106-29 = "[s] «Верно.»"
1301106-31 = "(После огромных усилий я успел собрать свою норму из двадцати печатей.)"
1301106-33 = "[ns] «Я собрал все печати, но не знаю, где Момои...»"
1301106-34 = "О, Сенсей, сюда. Я здесь."
1301106-37 = "― Смотрите, Сенсей! Я полностью заполнила карточку печатей![wa:2400]"
1301106-39 = "― Теперь этот квест завершён! Ура![wa:2140]"
1301106-42 = "― Сначала я не была уверена, что у нас получится...[wa:300]"
1301106-44 = "― Но мы с вами... отличная команда, Сенсей![wa:730]"
1301106-47 = "― Ух ты-ы! Сенсей...[wa:2460]"
1301106-49 = "― Вы весь вспотели! Вы в порядке?[wa:870]"
1301106-52 = "― Ха-ха-ха! Рада, что вы сказали, что всё нормально.[wa:450]"
1301106-54 = "― Благодаря вам сегодня было очень весело, Сенсей![wa:910]"
1301106-57 = "― Если когда-нибудь снова будет такое событие...[wa:670]"
1301106-59 = "― ...мы обязательно снова пойдём вместе, Сенсей![wa:1920]"
1301106-62 = "Мы... успели! Давайте, идём в пункт обмена."
1301106-63 = "Пойдём заберём честно заработанную добычу!"
1301106-64 = "В благодарность по дороге обратно я куплю вам напиток!"
1301106-66 = "(Так, потягивая купленные Момои напитки, мы неспешно отправились в пункт обмена сдавать печати.)"
