[translation]
10017050-1 = "Эпизод 5;Гражданская война (?)"
10017050-2 = "Кафе White & Mason"
10017050-3 = "Знаете, если честно, я уже очень давно не была на таких мероприятиях. Вообще, возможно, это мой первый раз..."
10017050-4 = "Я даже не знаю, что должна делать... Например, куда девать руки?"
10017050-6 = "Просто расслабьтесь и наслаждайтесь."
10017050-7 = "Мы приготовили вкусные сконы, пирожные и ароматный чёрный чай."
10017050-8 = "Пожалуйста, угощайтесь всем, что привлечёт внимание."
10017050-10 = ""
10017050-12 = ""
10017050-13 = "Но мы не такие утончённые, как вы, вице-президент Хасуми..."
10017050-14 = "Мы понятия не имеем, как правильно наслаждаться чёрным чаем..."
10017050-16 = "Не нужно всё так усложнять."
10017050-17 = "Нет никакого особого эзотерического способа наслаждаться сладостями или чаем."
10017050-18 = "Помните, это мероприятие устроено в честь вашей усердной работы за прошедший год."
10017050-19 = ""
10017050-21 = ""
10017050-23 = "Пожалуйста, выпейте чай, пока он не остыл."
10017050-24 = "С-Спасибо..."
10017050-25 = "Так, а при приготовлении чая с молоком что нужно наливать первым: чай в молоко или молоко в чай?"
10017050-26 = "Разве не логичнее лить молоко в чай? Так молоко охлаждает чай, и его не слишком горячо пить."
10017050-27 = "Что? Нет. Очевидно, правильно наливать чёрный чай в тёплое молоко. Так вкус молока лучше сохраняется и ощущается в готовом чае."
10017050-28 = "Ужасная идея! Пока молоко нагревается, на поверхности может образоваться тонкая плёнка."
10017050-29 = "В итоге чай смешается с примесями, и вкус будет неправильным!"
10017050-30 = "Ты не понимаешь, о чём говоришь! Когда наливаешь молоко в чёрный чай, оно прогревается неравномерно. Белки денатурируют, и именно поэтому образуется плёнка!"
10017050-31 = "А потом в чашке оказывается куча денатурированного белка, поэтому молочного вкуса в чае становится недостаточно!"
10017050-32 = "И наоборот, если, как образованный человек, наливать чай в молоко, оно не нагревается неравномерно, и можно полностью насладиться вкусом без всякой денатурации!"
10017050-33 = "Молоко в чай!"
10017050-34 = "Чай в молоко!"
10017050-36 = "Ну-ну, давайте все успокоимся."
10017050-38 = "Что? Ой, простите. Простите меня, Хасуми!"
10017050-39 = "Простите, я перегнула палку!"
10017050-41 = "Ничего. Но на будущее — это был опасный вопрос."
10017050-42 = "Эм, простите? Опасный?"
10017050-43 = "Вы не знали, но этот вопрос веками был источником раздоров."
10017050-44 = "Это бесконечный конфликт."
10017050-45 = "Говорят, если наливать чай в молоко, можно немного сильнее уменьшить горечь чёрного чая..."
10017050-46 = "Но надо признать, некоторым горечь нравится. В то же время другие клянутся вкусом чая, где молоко налито первым."
10017050-47 = "В какой-то момент между двумя сторонами даже случилась настоящая драка."
10017050-49 = "П-понятно! Простите за моё невежество в истории чая!"
10017050-50 = "Знаете, может, просто расслабимся и будем наслаждаться всем, что есть."
10017050-52 = "Сначала я переживала, но, похоже, всем комфортно и все хорошо проводят время."
10017050-53 = "...Ты в порядке, Цуруги?"
10017050-55 = ""
10017050-57 = ""
10017050-58 = ""
10017050-59 = ""
10017050-60 = ""
10017050-61 = "Кррааагх..."
10017050-62 = "Тебе самой тоже стоит немного расслабиться..."
10017050-63 = "Ты ведь тоже любишь чёрный чай и сладости?"
10017050-64 = "Не то чтобы я их не любила, но..."
10017050-65 = "Просто..."
10017050-66 = "Мне кажется, из-за меня всем здесь напряжённо."
10017050-67 = "Они все члены клуба, а ты их президент. Не стоит так стесняться."
10017050-68 = "Я стараюсь..."
10017050-69 = "Этого достаточно."
10017050-71 = "Вход в White & Mason"
10017050-72 = ""
10017050-74 = ""
10017050-75 = "Эм, что ты делаешь?"
10017050-76 = "Как очевидно, я стою на страже."
10017050-77 = "Да. Но зачем? А как же вечеринка?"
10017050-78 = "Я прекрасно о ней знаю. Именно поэтому стою здесь бдительным стражем, чтобы вечеринка оставалась мирной."
10017050-79 = "Нет справедливости выше, чем та, которую никто не нарушает!"
10017050-81 = "Д-да. Но её никто и не нарушает, так что ты не хочешь немного повеселиться?"
10017050-82 = "Не беспокойся! Для меня нет праздника лучше, чем защита справедливости!"
10017050-83 = "Л-ладно. Эм, но ты точно-точно уверена?"
10017050-84 = ""
10017050-86 = ""
10017050-89 = "...Я могу сменить тебя."
10017050-91 = ""
10017050-93 = ""
10017050-94 = "П-президент?!"
10017050-95 = "Цуруги? Что ты здесь делаешь?"
10017050-97 = "Я же сказала, пришла тебя сменить..."
10017050-99 = ""
10017050-101 = ""
10017050-102 = "Что? Но..."
10017050-103 = "Я-я пойду!"
10017050-104 = ""
10017050-106 = ""
10017050-107 = ""
10017050-109 = "Точно?"
10017050-110 = "Мне здесь будет спокойнее..."
10017050-111 = "Хорошо. Тогда я—"
10017050-113 = "У Рыцарей скорой помощи есть вопросы к Боевой группе Правосудия!"
10017050-115 = ""
10017050-117 = ""
10017050-118 = "Какое интересное вступление."
10017050-119 = "Капитан Майн из Рыцарей скорой помощи?"
10017050-120 = "Что привело вас сюда, капитан?"
10017050-122 = "Как члены Боевой группы Правосудия, вы сегодня отбирали или не отбирали рождественскую курицу у каких-то головорезов?"
10017050-124 = ""
10017050-126 = ""
10017050-127 = "...Хм?"
10017050-128 = "(Курица? Да, отбирали...)"
10017050-129 = "(Ясно изложить факты — тоже часть воплощения справедливости.)"
10017050-130 = "Да, такое было."
10017050-132 = "Понятно. Значит, правда вышла наружу..."
10017050-133 = "Как грустно! Как бесконечно грустно!"
10017050-134 = "Как могло случиться, что именно сегодня, в само Рождество, Боевая группа Правосудия сбилась с пути?!"
10017050-135 = "Не совсем понимаю, что вы имеете в виду."
10017050-136 = "Вы настолько не понимаете? Или намеренно закрываете глаза?!"
10017050-137 = "Боевая группа Правосудия! Призываю вас исправить свой путь! Снова стать защитниками слабых!"
10017050-138 = "(Как обычно, я понятия не имею, о чём она вообще говорит.)"
10017050-139 = "Простите, капитан, но сейчас мы просто проводим небольшую вечеринку в честь Рождества."
10017050-140 = "Рождество ведь важный день и для Рыцарей скорой помощи, нет?"
10017050-142 = "Именно поэтому я здесь!"
10017050-143 = "А-а-а-а?!"
10017050-144 = "Я не имею ничего против вашего веселья."
10017050-145 = "Однако! Боевая группа Правосудия не должна терять сердце и душу ради рождественских развлечений!"
10017050-146 = "Если это путь, который вы избрали, мне не останется ничего другого, кроме как стать щитом на вашем пути!"
10017050-147 = "Такова помощь, которую я несу Боевой группе Правосудия!"
10017050-148 = "М-можете, пожалуйста, просто объяснить, что происходит?"
10017050-149 = "Хватит притворяться, что ничего не знаете! Вы осквернили эту святую ночь, украв курицу у тех головорезов!"
10017050-150 = "Головорезы они или нет, поступок Боевой группы Правосудия был обычной кражей!"
10017050-151 = "Помощь в равной мере принадлежит всем! Вот путеводный свет Рыцарей скорой помощи!"
10017050-152 = "Я понимаю, но та курица была—"
10017050-153 = "Даже после всего сказанного вы всё ещё не понимаете? Или решили не понимать?"
10017050-154 = "Меня переполняет скорбь!"
10017050-156 = ""
10017050-158 = ""
10017050-159 = ""
10017050-160 = "...Отойди, Маширо."
10017050-161 = "Цуруги?"
10017050-162 = ""
10017050-164 = ""
10017050-165 = ""
10017050-167 = "(Если честно, я вообще не понимаю, о чём говорит Майн...)"
10017050-168 = "(Но я точно знаю одно: мои клубные товарищи впервые за долгое время отдыхают, и я не позволю ей это испортить.)"
10017050-169 = ""
10017050-171 = "Когда она в таком состоянии, разговаривать бесполезно. Иди внутрь."
10017050-172 = "Нет! Я не могу!"
10017050-173 = "Справедливость никогда не отступает и не оставляет союзников одних!"
10017050-174 = "...Она идёт. Приготовься."
10017050-175 = "Есть!"
10017050-177 = "Медицина не знает границ!"
