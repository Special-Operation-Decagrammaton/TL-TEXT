[translation]
84312101302-5 = "А, я слышала историю. Даже не знаю, как вас благодарить."
84312101302-6 = ""
84312101302-9 = ""
84312101302-10 = "Вы не дали ни Avant Guard, ни Mechagator перерасти в куда более серьёзные проблемы."
84312101302-11 = "Если хотите, я бы хотела что-нибудь для вас сделать."
84312101302-13 = "Мне не нужна награда. Пока всё закончилось хорошо, одного этого мне достаточно."
84312101302-14 = "Ну, но просто оставить всё так мы тоже не можем. Я обязательно хочу чем-нибудь отплатить..."
84312101302-15 = "Что хотите? Тостер? Автоматический пенал? Летающий пульт?"
84312101302-16 = "Конечно, что бы это ни было, нам понадобится время сделать всё с нуля. Сейчас у нас есть только кресло, похожее на Thundergun... Хмм, может, сделать новую модель Thundergun...?"
84312101302-17 = "...Вы сказали кресло?"
84312101302-18 = "А? Почему? Вам нужно кресло?"
84312101302-19 = "А, нет. Не совсем. Просто..."
84312101302-20 = "Разговор о кресле... напомнил мне о подруге. Я просто о ней подумала."
