[translation]
11200-2 = "Episódio 20;O Comitê Disciplinar Entra na Luta!"
11200-3 = "Área Urbana Destruída de Abydos"
11200-4 = "Chefe! Mutsuki! Haruka! Vamos nos esconder rápido! Eles chegaram!"
11200-5 = "Eles quem?"
11200-6 = "O pessoal do Comitê Disciplinar da nossa escola! Não acredito que vieram atrás da gente até aqui! Ainda mais nessa hora...!"
11200-7 = "Não, ou será que justamente por ser nessa hora...?!"
11200-8 = "(Boooooom!!)"
11200-9 = "Argh!"
11200-10 = "Ugh...!"
11200-12 = "(Cabuuuuum!)"
11200-14 = "Alvo neutralizado."
11200-15 = "Ótimo. Infantaria, até o 2º pelotão, avançar."
11200-16 = "...Iori, o que fazemos com aquelas pessoas?"
11200-17 = "Hm? Ah, as alunas ali do outro lado? Qual era o nome mesmo... Abydos?"
11200-18 = "Ora, é óbvio: qualquer um que atrapalhe o cumprimento do nosso dever oficial é inimigo."
11200-19 = "Nesse caso, espero que elas fiquem quietas...#nMas não deveríamos explicar nossa situação primeiro...?"
11200-20 = "Explicar? E precisa disso?"
11200-21 = "..."
11200-22 = "Já está dando trabalho demais capturar as encrenqueiras da nossa escola.#nSe atrapalharem, mesmo sendo de fora, vou esmagar todas elas juntas sem fazer perguntas."
11200-23 = "..."
11200-25 = "O-O quê?! Quer dizer que o Comitê Disciplinar veio prender a Faz-Tudo?!"
11200-26 = "Ainda não sabemos... Mas é difícil acreditar que sejam amigáveis conosco."
11200-27 = "Verdade. Nós também estávamos na área do bombardeio, mesmo que não tenham mirado diretamente na gente."
11200-28 = "Não pode ser..."
11200-29 = "Nem pensar! A Faz-Tudo é a nossa presa! Qual é a delas, afinal?!"
11200-30 = "Mas o Comitê Disciplinar de Gehenna é completamente diferente de forças armadas oficiais de outras escolas ou de clubes como a Faz-Tudo!"
11200-31 = "Um passo em falso e isso pode virar o estopim de um conflito político..."
11200-32 = "Ayane-chan, ainda não conseguiu contato com a Hoshino-senpai?"
11200-33 = "...Sim. Normalmente, ela nunca ficaria tanto tempo assim sem responder..."
11200-34 = "Nessa situação... o que devemos fazer?"
11200-35 = "..."
11200-36 = "..."
11200-37 = "[s] \"Então vamos deixar a Faz-Tudo ser entregue ao Comitê Disciplinar assim mesmo?\""
11200-38 = "Isso... m-mas... mesmo assim, não podemos simplesmente lutar contra elas..."
11200-39 = "Então o que você quer que a gente faça?"
11200-42 = "Não há outra escolha. Vamos deter o Comitê Disciplinar."
11200-43 = "Shiroko-chan...?!"
11200-44 = "..."
11200-45 = "...Sim, você tem razão."
11200-46 = "O fato de o Comitê Disciplinar já ter realizado uma operação tática no nosso distrito autônomo#nsignifica que um conflito político já vai acontecer..."
11200-47 = "Com certeza, é verdade que o pessoal da Faz-Tudo causou problemas..."
11200-48 = "No entanto, isso não significa que o Comitê Disciplinar de outra academia tenha o direito de cometer uma barbaridade dessas sem a nossa permissão."
11200-49 = "É isso mesmo! Como elas ousam fazer uma coisa dessas?! Isso é desrespeitar completamente os direitos da nossa escola!"
11200-50 = "Quem vai punir a Faz-Tudo somos nós!#nElas precisam pagar por terem destruído o Lámen Shibasaki!"
11200-52 = "..."
11200-53 = "As alunas de Abydos entraram em posição de combate."
11200-54 = "Ah, que saco. São só quatro delas, enquanto nós temos uma companhia inteira aqui."
11200-55 = "Mas o Comitê Disciplinar jamais foge de uma briga que nos foi comprada.#nTodas as unidades, preparar para o combate!"
11200-56 = "...E-Espere um segundo, Iori."
11200-57 = "Hm?"
11200-58 = "Há um civil aparecendo do lado de Abydos. Estou confirmando a identidade, aguarde."
11200-59 = "O quê...?!"
11200-60 = "...A-Aquela pessoa é... por acaso é [USERNAME] Sensei de Schale?!"
11200-61 = "Hm? Schale? O que é isso?"
11200-62 = "...E-Espere um momento. Se o Sensei de Schale está do lado delas..."
11200-63 = "...Não podemos entrar nesse combate!"
11200-64 = "Como assim?"
11200-66 = "Abydos se aproximando! Abrindo fogo!"
11200-67 = "(Ratatatatá!!)"
11200-68 = "Tsc, não tem jeito. Vamos lá!"
11200-70 = "Ah..."
