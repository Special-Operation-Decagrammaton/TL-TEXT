[translation]
11200-2 = "Эпизод 20;Префектурная команда вступает в бой!"
11200-3 = "Разрушенный центр Абидоса"
11200-4 = "Босс! Муцуки, Харука! Нужно уходить! Это они!"
11200-5 = "Кто «они»?"
11200-6 = "Префектурная команда Геенны здесь! Они всё это время следили за нами? И почему именно сейчас..."
11200-7 = "Нет, погодите. Возможно, они просто выбрали идеальный момент для атаки!"
11200-8 = "*БА-БАХ*"
11200-9 = "Аргх!"
11200-10 = "Чёрт..."
11200-11 = ""
11200-12 = "(падает)"
11200-14 = "Цели нейтрализованы."
11200-15 = "Хорошо. Первый и второй отряды — вперёд."
11200-16 = "А что насчёт остальных, Иори?"
11200-17 = "Ты про студентов той школы? Как она там называлась...?#nАбидос?"
11200-18 = "Ты правда спрашиваешь? Любой, кто мешает исполнению служебных обязанностей, — враг."
11200-19 = "Тогда будем надеяться, что они не станут вмешиваться... но по процедуре мы обязаны сначала объявить о своих намерениях."
11200-20 = "Зачем? Это вообще обязательно?"
11200-21 = "..."
11200-22 = "И без того утомительно гоняться за всеми этими жалкими хулиганками из нашей академии. Зачем тратить время и силы? Если начнут мешать — просто сметём их вместе с остальными."
11200-23 = "..."
11200-25 = "Префектурная команда пришла арестовать этих девчонок из «Решателя проблем»?!"
11200-26 = "Пока не уверена... И ведут они себя тоже не особо дружелюбно."
11200-27 = "Ага. Специально по нам они не целились, но мы всё равно попали в зону их обстрела."
11200-28 = "Вот же..."
11200-29 = "Ещё чего! Эти мерзавки из «Решателя проблем» — наши!#nКем они себя вообще возомнили?!"
11200-30 = "Разобраться с Префектурной командой и с мелкими преступницами вроде «Решателя проблем» — совершенно разные вещи. Это официальные вооружённые силы их академии."
11200-31 = "Если будем неосторожны, всё может перерасти в политический конфликт..."
11200-32 = "Аяне, от Хошино всё ещё нет вестей?"
11200-33 = "Нет. Она никогда раньше не пропадала со связи настолько надолго..."
11200-34 = "Так... что нам делать?"
11200-35 = "..."
11200-36 = "..."
11200-37 = "[s] «И вы просто так отдадите им „Решателя проблем“?»"
11200-38 = "Н-но мы ведь не можем сражаться с ними в лоб... правда?"
11200-39 = "Я понимаю, к чему вы ведёте, но что нам вообще остаётся?"
11200-40 = ""
11200-41 = ""
11200-42 = "Мы должны быть единодушны. Нужно разгромить Префектурную команду."
11200-43 = "Широко?!"
11200-44 = "..."
11200-45 = "Она права."
11200-46 = "Префектурная команда сама превратила это в политический конфликт в тот момент, когда начала боевую операцию в нашем районе."
11200-47 = "Да, эти дурочки из «Решателя проблем» могли начать весь этот бардак..."
11200-48 = "...но это не даёт дисциплинарному комитету другой академии права без нашего согласия вводить вооружённые силы в нашу юрисдикцию."
11200-49 = "Ага, точно! Как они смеют? Это всё равно что плюнуть нам в лицо!"
11200-50 = "Это мы разберёмся с «Решателем проблем»! Я лично заставлю их заплатить за то, что они сделали с «Шиба Сэки Рамэн»!"
11200-52 = "..."
11200-53 = "Студенты Абидоса готовятся к бою."
11200-54 = "*вздыхает* Значит, хотят по-плохому? Их всего четверо против целой нашей бригады."
11200-55 = "Но отступить из боя Префектурная команда тоже не может.#nВсем подразделениям приготовиться к бою!"
11200-56 = "Погоди. Секунду, Иори."
11200-57 = "А?"
11200-58 = "На стороне Абидоса замечено гражданское лицо. Секунду, подтверждаю личность..."
11200-59 = "Погодите...!"
11200-60 = "Тот человек. Неужели это...? Сенсей [USERNAME] из Шале?!"
11200-61 = "А? Шале? Это ещё что?"
11200-62 = "П-погодите. Если Шале работает вместе с ними, тогда..."
11200-63 = "Нельзя! Мы не должны вступать в бой!"
11200-64 = "Ты о чём вообще?"
11200-66 = "Студенты Абидоса идут прямо на нас. Открыть огонь!"
11200-67 = "*тра-та-та-та-та-та-та-та-та*"
11200-68 = "Тц! Они не оставляют нам выбора!#nВступаем в бой!"
11200-70 = "*вздыхает*..."
