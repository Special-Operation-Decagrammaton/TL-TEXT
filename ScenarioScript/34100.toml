[translation]
34100-1 = "Episódio 10;Rumo ao Distrito Autônomo de Arius (2)"
34100-2 = "...Daqui, vamos passar pela passagem subterrânea e entrar nas Catacumbas."
34100-3 = "Mas... pelo que vimos agora há pouco, parece que \"ela\" também já sabe que usaríamos esta passagem."
34100-4 = "...É. Provavelmente já deixaram tudo preparado para nós."
34100-5 = "Bom, bastava pensar um pouco para perceber isso."
34100-6 = "Para começo de conversa, é uma entrada que qualquer aluna de Arius conhece."
34100-7 = "E-Então o que vamos fazer?"
34100-8 = "Mesmo assim, não há nenhum desvio e, claro, não temos tempo para procurar outra entrada."
34100-14 = "Vamos abrir caminho à força."
34100-15 = "...Pois é. De qualquer forma, tanto o lado de lá quanto nós estamos pensando a mesma coisa. Mas nós temos o Sensei da \"Schale\" ao nosso lado."
34100-16 = "Hehe... É-É verdade. Contamos com você..."
34100-17 = "[s] \"Hã? A-Ah, sim. Eu que conto com vocês...?\""
34100-21 = "Mais à frente, soldados de elite bem treinadas devem estar nos esperando."
34100-22 = "Nós iremos na frente. Sensei, venha logo atrás assim que garantirmos a segurança."
34100-23 = "Será uma batalha difícil, mas se rompermos este bloqueio, poderemos entrar no Distrito Autônomo de Arius."
34100-24 = "Vamos."
