[translation]
2004503-1 = "Элитный гид"
2004503-2 = "Я присоединился к экскурсионной группе Пины в автобусе."
2004503-3 = "Она обещала показать нам самые популярные места Хяккияко."
2004503-5 = "А теперь время следующей остановки! Все, пожалуйста, возвращайтесь в автобус!"
2004503-6 = "И вы тоже, Сенсей."
2004503-7 = "[s1] «Похоже, ты уже освоилась!»\n[s2] «Наверное, трудно следить за таким количеством людей...»"
2004503-10 = "Легко! Когда понимаешь образ жизни гангстеров, вести за собой группу получается само собой."
2004503-11 = "Мы отстаём от графика, но всё будет хорошо, если поторопимся."
2004503-12 = "Итак, все! Давайте! Быстрее! Двигаться!"
2004503-18 = "Это наша последняя остановка! Хорошо, все, пожалуйста, держитесь за поручни!"
