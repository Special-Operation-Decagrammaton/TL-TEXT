[translation]
1007906-1 = "Правильный поступок"
1007906-2 = "Получив от Мисаки просьбу о помощи (?), я отправился в ближайший парк."
1007906-3 = ""
1007906-10 = "[ns1] «...???»\n[ns2] Пойти на звук."
1007906-14 = ""
1007906-15 = ""
1007906-16 = ""
1007906-17 = ""
1007906-18 = ""
1007906-19 = ""
1007906-20 = ""
1007906-21 = "О нет..."
1007906-22 = "Я добралась до другого мира, а автомат всё равно съедает мои деньги? Как это вообще понимать?"
1007906-23 = "Может, проблема во мне?"
1007906-24 = "Во мне есть что-то, от чего торговые автоматы становятся голодными...?"
1007906-25 = "[s3] «Мисака?»\n[s4] «Почему ты пинаешь автомат?!»"
1007906-28 = "...О, Сенсей."
1007906-29 = "Я не очень хотела, чтобы вы это видели... Простите."
1007906-30 = "...Хм? Автомат?"
1007906-31 = "Понимаете, я просто хотела купить напиток, но он опять съел мои деньги."
1007906-32 = "Эм... Говорю «опять», но с тех пор, как я здесь, это случилось впервые."
1007906-33 = "В моём мире такое происходило со мной постоянно."
1007906-34 = "В Академгородке есть один автомат, который всё время съедал мои деньги. Наверное, такое со мной просто часто случается..."
1007906-35 = "Не думаю, что есть какая-то конкретная причина... Просто вот так у меня бывает."
1007906-36 = "Раз уж я теперь в Кивотосе, я думала, что хотя бы торговыми автоматами смогу пользоваться спокойно."
1007906-37 = "Как видите, не вышло..."
1007906-38 = "...А? Нет, это происходит не КАЖДЫЙ раз, но..."
1007906-39 = "Если бы каждый раз, я хотя бы смогла понять причину."
1007906-40 = "[s5] «Значит, ты из тех людей, которые притягивают странные ситуации.»\n[s6] «В этом я чувствую с тобой какое-то странное родство.»"
1007906-43 = "В общем, когда такое случалось в Академгородке, я несколько раз пинала автомат, пока напиток не выпадал."
1007906-44 = "...Похоже, торговые автоматы понимают только один язык."
1007906-45 = "А? Вы ожидали чего-то другого? Чего именно?"
1007906-46 = "Думали, я ударю его электричеством...?"
1007906-47 = ""
1007906-49 = ""
1007906-50 = "*вздыхает*"
1007906-51 = "Сенсей. Я не использую способности для каждой мелкой проблемы."
1007906-52 = "Если бы я била током каждый автомат, который меня разозлил, у нас бы вообще не осталось автоматов."
1007906-53 = "К тому же в большинстве автоматов не так много тонкой электроники... Хорошенько стукнуть по ним эффективнее."
1007906-54 = "...О?"
1007906-55 = "...Бить общественное имущество нельзя...?"
1007906-56 = "..."
1007906-57 = "Ч-Что?! Вы серьёзно...? Внезапно заговорили таким строгим тоном!"
1007906-58 = "Э-Это, конечно, правда, но... Ладно, может, в гостях мне стоит быть осторожнее..."
1007906-59 = "...А?"
1007906-60 = "Неважно, где я нахожусь? В Академгородке тоже так делать нельзя...?"
1007906-61 = "Ч-Что это такое? Вы ведёте себя как мой учитель...!"
1007906-62 = "[s7] «Ну, вообще-то я И ЕСТЬ учитель...»\n[s8] «Я обязан наставлять своих студентов.»"
1007906-65 = ""
1007906-67 = ""
1007906-68 = "...А."
1007906-69 = "Да, точно. Вы учитель... Хм..."
1007906-70 = "Такое чувство, будто я каким-то образом влипла во что-то странное..."
1007906-71 = "М-Может, мне всё-таки не стоило звать вас сюда... Эм..."
1007906-72 = "П-Прости..."
1007906-73 = "[s9] Связаться с управляющим парка.\n[s10] Позвонить по номеру, указанному на автомате."
1007906-79 = "После того как кто-то пришёл починить автомат, я достал напиток и передал его Мисаке."
1007906-80 = ""
1007906-81 = "...Никогда не видела, чтобы кто-то действительно звонил и вызывал мастера чинить такое."
1007906-82 = "Что? Это нормально? К-Конечно... Да..."
1007906-83 = "Ну, благодаря вам всё закончилось хорошо. Спасибо, Сенсей."
1007906-84 = "Я не ожидала, что вы будете меня так отчитывать, но вы не совсем неправы, поэтому ладно."
1007906-85 = "Хм?"
1007906-86 = "Если такое случится снова, вы хотите, чтобы вместо пинка я сначала позвонила вам?"
1007906-87 = "Э-Эм... Хорошо..."
1007906-89 = "Теперь мне точно неловко... Неожиданно..."
