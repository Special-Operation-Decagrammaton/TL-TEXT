[translation]
83306030100-5 = ""
83306030100-6 = "*вздыхает* Как хлопотно."
83306030100-7 = "Что такое, Ако? Что-то случилось?"
83306030100-8 = "О... Глава префектов."
83306030100-9 = "Пока вас не было в офисе, Префектурной команде постоянно звонили с розыгрышами."
83306030100-10 = "Розыгрышами? Зачем? Что говорят?"
83306030100-11 = "Ну... Ничего особенного... Просто несут какую-то чушь и сразу бросают трубку."
83306030100-12 = "Не думаю, что у этих звонков есть какой-то смысл, кроме желания нас донимать."
83306030100-13 = "Будь моя воля, я бы просто отключила телефон и игнорировала их."
83306030100-14 = "Но Префектурная команда не может позволить себе пропустить срочный или экстренный звонок, поэтому нельзя."
83306030100-15 = "Хм. Тогда на следующий звонок отвечу я."
83306030100-16 = "А! Не нужно! Я не могу тратить ваше время на такую надоедливую ерунду—"
83306030100-17 = "Ако. Это мешает твоей работе, верно?"
83306030100-18 = "Твоё время для меня тоже важно."
83306030100-19 = "Глава префектов Хина..."
83306030100-20 = "Тогда, пожалуйста... я оставляю это вам."
