[translation]
1008205-1 = "Суть юности: Друг детства"
1008205-5 = "[ns] «Ну вот, со всей срочной работой вроде покончено...»"
1008205-6 = ""
1008205-12 = "[ns] «Наконец-то. Пора спать.»"
1008205-13 = ""
1008205-20 = "Я закончил работу в Шале позже обычного и отправился домой спать."
1008205-21 = "[ns] «Завтра утром у меня встреча с Рэнгэ... Надо выспаться...»"
1008205-22 = ""
1008205-43 = "[ns] «(Угх... Уже утро?)»"
1008205-44 = ""
1008205-47 = "После вчерашней поздней работы я ужасно устал и переставил будильник ещё на немного."
1008205-48 = ""
1008205-52 = "[ns] «(Ещё чуть-чуть... Да... Всего пять минуточек...)»"
1008205-53 = ""
1008205-58 = "Хорошо. Раз... два..."
1008205-59 = ""
1008205-62 = "ДОБРОЕ УТРО!"
1008205-63 = ""
1008205-67 = ""
1008205-68 = "Ты собираешься весь день валяться в кровати, соня?! Уже утро!"
1008205-69 = ""
1008205-71 = ""
1008205-75 = "[ns] «У-Угх?!»"
1008205-76 = ""
1008205-78 = "[ns] «Р-Рэнгэ?! Что ты здесь делаешь?»"
1008205-79 = "Разве это не очевидно?"
1008205-80 = "Исполняю обязанности твоей подруги детства!"
1008205-81 = "Ты проспал, так что, конечно же, мне пришлось прийти и разбудить тебя!"
1008205-82 = "[s] «...А? Какой ещё подруги чего?»"
1008205-84 = "Мне удалось уговорить Рэнгэ подождать, пока я соберусь. Ей явно не терпелось объяснить, что происходит."
1008205-86 = "Я ведь уже говорила вам об этом в MomoTalk."
1008205-87 = "Есть определённые отношения, которые люди переживают в юности и которые мы просто не можем пропустить!"
1008205-88 = "Друзья детства! Сегодня я здесь в роли подруги Сенсея, которая росла рядом с ним с самого детства."
1008205-89 = "[s1] «Мне кажется, мы всё-таки не росли вместе...»\n[s2] «Я вижу в этой задумке кучу проблем...»"
1008205-92 = "Да ладно тебе, Сенсей! Обычно ты быстрее схватываешь."
1008205-93 = "Тут нужно учесть одну важную вещь. Как вообще определяется «друг детства», Сенсей?"
1008205-94 = "Есть какие-то официальные законы на этот счёт? Какие-нибудь условия, которые нужно выполнить, чтобы считаться друзьями детства?"
1008205-95 = "Нет! Никакого отраслевого стандарта для такого не существует."
1008205-96 = ""
1008205-98 = ""
1008205-99 = "Друг детства по определению — это тот, с кем ты близок с юных лет. Под «юными,» мы подразумеваем прошлое, а если точнее — любой момент до настоящего."
1008205-100 = "Нужно всего лишь немного воображения и совсем капельку преувеличения!"
1008205-101 = "Мы знакомы ещё с того времени, которое было до сегодняшнего утра, так что если решим считать себя друзьями детства — значит, так оно и есть!"
1008205-102 = "Не зацикливайся на деталях! Главное — светлое и сияющее будущее, к которому мы идём!"
1008205-103 = "[s] «Я вообще не понимаю, есть в этом смысл или нет!»"
1008205-104 = "Опять ты за своё — детали, детали!"
1008205-105 = "Итак, Сенсей... то есть Наставник!"
1008205-106 = "Я назвала сегодняшний эпизод «Суть юности: Друг детства»!"
1008205-107 = "Событие «разбудить друга детства утром» мы уже закрыли!"
1008205-108 = ""
1008205-110 = ""
1008205-111 = "Так что переходим к следующему!"
1008205-112 = "[s] «Л-Ладно...»"
1008205-114 = "Логика казалась мне крайне сомнительной. Как бы то ни было, мы с Рэнгэ начали наши юношеские мероприятия на день."
1008205-116 = "Так, посмотрим... Второе событие, которое нам нужно закрыть..."
1008205-117 = "Это обязательно должно быть событие «вместе идти в школу»!"
1008205-118 = "Оказывается, друзья детства каждый день вместе идут в школу и болтают обо всём подряд."
1008205-119 = "[s] «И источник этой информации, полагаю...»"
1008205-120 = "Я прочитала это в романе автора «Koi About Love»."
1008205-121 = "[s] «Я так и думал!»"
1008205-122 = "Пойдём в школу, Наставник!"
1008205-124 = ""
1008205-127 = ""
1008205-130 = ""
1008205-131 = "Что-то здесь не так..."
1008205-132 = "[s] «Что случилось, Рэнгэ?»"
1008205-133 = "Разве такая обыденная вещь действительно считается юношеским событием?"
1008205-134 = "Сладостное блаженство юности, которым делятся друзья детства... Разве это не должна быть смесь горечи и ностальгии?"
1008205-135 = "Как нам создать такую атмосферу? Чего мне не хватает...?"
1008205-136 = "[s3] «Не уверен, но можем начать с разговора?»\n[s4] «Друзья детства, наверное, говорят обо всём на свете.»"
1008205-137 = ""
1008205-138 = ""
1008205-140 = ""
1008205-141 = "Верно подмечено!"
1008205-142 = "Друзья детства наверняка опираются на общие интересы, которые у них накопились за годы знакомства."
1008205-143 = "Наверное, они рассказывают друг другу о своих проблемах и выслушивают друг друга!"
1008205-144 = "Ты так быстро докопался до сути! Я начинаю понимать, что всё действительно кроется в деталях!"
1008205-145 = "Во время такой обычной вещи, как утренняя дорога в школу, темы разговора, наверное, должны быть лёгкими и непринуждёнными."
1008205-146 = "Хм. Я справлюсь."
1008205-147 = "Пожалуй, логично будет, если начну я."
1008205-149 = "Ты вчера телевизор смотрел?"
1008205-150 = "[s] «Ага.»"
1008205-151 = "Я видела репортаж о том, что кто-то заметил чупакабру в горах за одним городком Южного округа!"
1008205-152 = "Люди обожают чупакабр..."
1008205-153 = "Давай поймаем её! Мы точно завирусимся в соцсетях!"
1008205-154 = ""
1008205-157 = "[ns] «Стоп, Рэнгэ. Люди по дороге в школу не строят планы по похищению чупакабры.»"
1008205-158 = "О. Правда? А почему?"
1008205-159 = "...Может, лучше поговорить о спорте или каком-нибудь популярном сериале?"
1008205-160 = "Это типичная тема для юности? Я ведь вообще не слежу за такими вещами."
1008205-161 = "Чупакабра куда интереснее и по-юношески задорнее! Все любят хорошие истории про чупакабр!"
1008205-162 = "...Некоторые люди вообще не знают, что это такое?"
1008205-163 = "О. А я об этом не подумала. Оказывается, непринуждённо болтать с другом детства не так уж естественно, как мне казалось."
1008205-164 = "Хм... Ну и ладно! Тогда можем переходить к следующему событию."
1008205-165 = "У нас ещё полно времени. Нет причин отчаиваться."
1008205-168 = "Сверюсь со своими материалами. Каким должно быть наше третье событие...?"
1008205-169 = "О! Придумала! Событие «друзья детства помогают друг другу с самыми слабыми предметами»!"
1008205-170 = "[s] «Хороший вариант! В манге такое часто бывает.»"
1008205-171 = "Мой наставник одобрил! Отлично!"
1008205-172 = "Правда, я тут думала, чему именно могла бы тебя научить..."
1008205-173 = "И на самом деле есть только одна вещь, которую я действительно умею."
1008205-174 = ""
1008205-176 = ""
1008205-177 = "*вдох*"
1008205-178 = "*выдох* Держи корпус ниже. Сделай полшага вперёд."
1008205-179 = "[s] «Рэнгэ...? Чему именно ты пытаешься меня научить?»"
1008205-180 = ""
1008205-182 = ""
1008205-183 = "Не смотри так встревоженно, Сенсей."
1008205-184 = "Я учу тебя самообороне! В Хяккарёран я часто провожу такие тренировки, так что ты в надёжных руках."
1008205-185 = "Есть самые разные курсы: что делать при перестрелке, как защищаться от нападающего и даже как ориентироваться по одним только звёздам!"
1008205-186 = "Обычно человеку требуется около трёх лет, чтобы освоить всё это..."
1008205-187 = "Но тебе повезло — твоим учителем буду я!"
1008205-188 = "Меня не просто так называют Дисциплинатором Хяккарёран! Под моим руководством ты освоишь всё за год!"
1008205-189 = "[s] «Иногда я забываю, насколько ты способная, Рэнгэ!»"
1008205-190 = "Что ж..."
1008205-191 = ""
1008205-193 = ""
1008205-195 = "Поехали!"
1008205-196 = ""
1008205-200 = "Мы с Рэнгэ разыгрывали одну сцену за другой в роли друзей детства."
1008205-202 = ""
1008205-203 = ""
1008205-204 = "После школы мы вместе заходили к уличным ларькам за перекусом."
1008205-206 = ""
1008205-207 = ""
1008205-208 = "Она сказала, что просто разойтись по домам будет скучно, поэтому мы отправились в караоке и устроили там вокальную битву."
1008205-210 = ""
1008205-212 = ""
1008205-213 = ""
1008205-214 = "Потом мы вместе заглянули в универмаг, чтобы купить кое-что, что срочно понадобилось Рэнгэ."
1008205-220 = "День был доверху наполнен весёлыми юношескими занятиями."
1008205-221 = ""
1008205-225 = "Не успели мы опомниться, как солнце уже клонилось к закату."
1008205-229 = "Сегодня мы и правда успели очень многое, да?"
1008205-230 = "Думаю, можно уверенно сказать, что день в роли друзей детства удался!"
1008205-231 = "[s] «(Больше чем на друзей детства, сегодняшний день был похож скорее на...)»"
1008205-232 = "Но мы ещё не закончили, Наставник!"
1008205-233 = "Ведь до главного события дня мы пока не добрались."
1008205-234 = "[s] «Хм? И что же это?»"
1008205-235 = "...Хи-хи."
1008205-236 = "Есть одна вещь, которая отличает друзей детства от любых других отношений."
1008205-237 = "В конце концов, друзья детства знают друг друга всю жизнь. Это совсем другой уровень близости."
1008205-238 = "Их связь закалялась годами и годами дружбы."
1008205-239 = "[s] «Но если так, то мы под это определение не очень-то подходим...»"
1008205-240 = ""
1008205-242 = ""
1008205-243 = "Н-Не в этом суть!"
1008205-244 = "Я хочу сказать, что нам осталось преодолеть всего одно последнее препятствие."
1008205-245 = "Это событие «по дороге домой называть друг друга по именам»!"
1008205-246 = "[s] «По именам...?»"
1008205-247 = "Именно! Так что теперь я буду звать тебя по имени!"
1008205-248 = "Ага! Прямо сейчас! Так что приготовься, Наставник!"
1008205-249 = "[s] «Д-Да!»"
1008205-250 = "Так, эм... Ух..."
1008205-251 = "...!"
1008205-252 = "М-Мне сегодня было очень весело, [USERNAME]...!"
1008205-253 = "[s] «Мне тоже было очень весело, Рэнгэ.»"
1008205-254 = ""
1008205-256 = ""
1008205-257 = "П-Правда?!"
1008205-258 = "Какое облегчение. Я немного переживала, что всё это время таскала тебя за собой."
1008205-259 = "Рада слышать это."
1008205-260 = "Признаюсь, называть тебя по имени было довольно неловко."
1008205-261 = "Вся эта концепция друзей детства оказалась куда сложнее, чем я думала."
1008205-262 = ""
1008205-264 = ""
1008205-265 = "Н-Ну, в общем! Нам уже пора возвращаться."
1008205-267 = "[ns5] «Тебе не кажется, что сегодня мы вели себя не просто как друзья детства?»\n[ns6] «Такое чувство, будто мы сегодня сходили на свидание.»"
1008205-268 = ""
1008205-269 = ""
1008205-271 = ""
1008205-272 = ""
1008205-274 = "...А-а-а?"
1008205-275 = ""
1008205-277 = ""
1008205-278 = ""
1008205-280 = "П-П-Постой!"
1008205-281 = "Ч-Ч-Что ты такое говоришь, Наставник?!"
1008205-282 = "[s] «А?! Я что-то не то сказал?!»"
1008205-283 = "Н-Не совсем не то, но...!"
1008205-284 = "Т-Такая концепция...! Это уже совсем не те отношения...!"
1008205-285 = "Это уже слишком для меня!"
1008205-286 = ""
1008205-288 = ""
1008205-291 = "[ns] «А... Убежала.»"
