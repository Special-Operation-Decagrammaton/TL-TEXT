[translation]
2003402-1 = "Как достичь цели"
2003402-2 = "Слушайте внимательно..."
2003402-3 = "Я собираюсь участвовать в новогоднем конкурсе по поеданию еды!"
2003402-4 = "Я уже подала заявку, осмотрела место проведения, проанализировала меню..."
2003402-5 = "Подготовка завершена."
2003402-6 = "Хи-хи-хи. Я и в этом году в предвкушении. ★"
2003402-7 = "[s] «И в этом году?»"
2003402-8 = "Ага, и в этом году."
2003402-9 = "[s] «...А чего именно ты ждёшь?»"
2003402-10 = "Ох! Что вы имеете в виду? ★"
2003402-11 = "Ну что, Сенсей. Готовы идти?"
2003402-12 = "[s] «Я тоже иду?»"
2003402-13 = "Да-да. Если вы пойдёте со мной, соревнование точно запомнится."
2003402-14 = "Или вы хладнокровно откажете в просьбе голодном студенте?"
2003402-15 = "[s] «Голодной, говоришь...»"
2003402-16 = "Именно. Я съела только половину завтрака, чтобы оставить место для этого."
2003402-17 = "Хи-хи. Вы правда думаете, что это так серьёзно?"
2003402-19 = "...Так вы всё-таки пришли, госпожа Ванибучи Акари."
2003402-20 = "Приносим искренние извинения, но наш организационный комитет с сожалением сообщает, что мы не можем допустить вас к участию в этом мероприятии."
2003402-21 = "Ещё раз просим прощения. Благодарим за понимание."
2003402-22 = "А?"
2003402-23 = ""
2003402-25 = ""
2003402-27 = ""
2003402-28 = "[ns] «И чем вы это объясняете?»"
2003402-29 = "Простите меня..."
2003402-30 = "Госпожа Акари победила в прошлом году."
2003402-31 = "М-м, верно. Меня впечатлило, как они обжарили конняку в темпуре, чтобы оно стало ещё сытнее."
2003402-32 = "А ещё она победила годом ранее..."
2003402-33 = "О! Это был тот год, когда они сделали кляр из картофеля и яиц, а затем смешали его с рыбным филе и приготовили особые рыбные котлетки."
2003402-34 = "...А с таким послужным списком она, скорее всего, победит и в этом году..."
2003402-35 = "Ох. Ну, пока не попробуем, не узнаем, правда?"
2003402-36 = ""
2003402-37 = "[ns1] «(Иногда истина и так очевидна...)»\n[ns2] «(Есть в жизни вещи, которые просто не меняются...)»"
2003402-40 = "Прошу понять, наш новогодний конкурс по поеданию еды в торговом квартале..."
2003402-41 = "...изначально задумывался как реклама, чтобы продвигать наши магазины и побуждать покупателей пробовать нашу еду."
2003402-42 = "Но когда участвует госпожа Акари, её победа практически гарантирована."
2003402-43 = "Поэтому организаторы решили, что с её участием соревнование больше не сможет привлекать зрителей."
2003402-44 = "Когда публика поняла, что исход заранее известен... интерес к соревнованию начал угасать."
2003402-46 = "Хм..."
2003402-47 = "В качестве альтернативы мы хотели бы предложить вам тщательно отобранный премиальный новогодний бэнто на десять порций. Наш хит продаж. Считайте это утешительным призом?"
2003402-48 = "Очень надеемся на ваше понимание..."
2003402-49 = "..."
2003402-50 = "Я пришла сюда не ради премиальных новогодних бэнто."
2003402-51 = "Я пришла попробовать необычные блюда вроде темпуры из конняку или рыбных котлеток из картофеля и яиц! Блюда, которые доведут аппетит участников до предела."
2003402-52 = "Э-Это...!"
2003402-53 = "Хи-хи... Интересно, какое блюдо они подготовили для соревнования в этом году? Не могу дождаться. ★"
2003402-54 = "[s] «Так-так-так. Кажется, у меня появилась идея.»"
2003402-55 = "Да?"
2003402-56 = "О?"
2003402-58 = ""
2003402-59 = "Я должна «защитить титул прошлогодней чемпионки?»"
2003402-60 = "Вы предлагаете госпоже Акари напрямую сразиться со всеми остальными участниками...?"
2003402-61 = "Э-Это безопасно? Даже для госпожи Акари это всё равно восемь соперников!"
2003402-62 = "Ох... У меня от одной мысли о таком соревновании разыгрывается аппетит."
2003402-63 = "Мне нравится. Я ведь и не собиралась побеждать."
2003402-64 = "Ни в прошлом году, ни годом ранее победа не была моей целью."
2003402-65 = "Правда?!"
2003402-66 = "[ns] «(Зная Акари... верю.)»"
2003402-67 = "Да, меня это устраивает. И мне тоже интересно, каким будет конкурсное блюдо в этом году."
2003402-68 = "П-Подождите минутку. Я передам это предложение организаторам. Пожалуйста, подождите здесь!"
2003402-69 = ""
2003402-71 = ""
2003402-72 = "Хи-хи!"
2003402-73 = "Благодаря вам мне снова удастся получить необычный гастрономический опыт."
2003402-74 = "[s] «...Только не слишком жестоко с ними, ладно?»"
2003402-75 = "Хм? Что вы имеете в виду? ★"
2003402-77 = ""
2003402-78 = "Дамы и господа, начинаем! Прямо сейчас стартует... новогодний конкурс по поеданию еды нашего торгового квартала!"
2003402-79 = "В этом году соревнование пройдёт немного иначе... Прошлогодняя чемпионка сразится сразу со всеми претендентами!"
2003402-80 = ""
2003402-81 = "Для начала поприветствуем нашу чемпионку! Ванибучи Акари выходит за своим третьим титулом!"
2003402-82 = ""
2003402-84 = ""
2003402-85 = "Хи-хи. Всем здравствуйте. Спасибо за вашу поддержку."
2003402-86 = "А теперь поприветствуем восемь наших претендентов!"
2003402-88 = ""
2003402-90 = ""
2003402-92 = ""
2003402-95 = ""
2003402-96 = ""
2003402-97 = ""
2003402-98 = "И вот соревнование началось! Пока претенденты яростно опустошают тарелки, наша чемпионка выглядит совершенно расслабленной!"
2003402-99 = ""
2003402-100 = "М-м! Особое блюдо этого года — рулет из омлета с молотым таро и бобами. Понятно..."
2003402-101 = "There are some other new year dishes as well. Let's try them all!"
2003402-102 = ""
2003402-103 = ""
2003402-104 = ""
2003402-105 = ""
2003402-106 = ""
2003402-107 = ""
2003402-108 = "А-а! Наши претенденты начинают сдавать!"
2003402-109 = ""
2003402-111 = ""
2003402-112 = ""
2003402-113 = ""
2003402-114 = "Тем временем действующая чемпионка Акари даже не сбавляет темп! Она уплетает всё, что ставят перед ней. Разница в опыте колоссальная!"
2003402-115 = "О, рулетики из икры сельди и ламинарии хорошо приправлены. Вкусно."
2003402-116 = "Я немного хочу пить. Запью всё супом."
2003402-117 = ""
2003402-119 = ""
2003402-120 = ""
2003402-121 = ""
2003402-122 = ""
2003402-123 = ""
2003402-124 = ""
2003402-125 = ""
2003402-126 = ""
2003402-127 = ""
2003402-128 = ""
2003402-129 = ""
2003402-130 = "Претенденты начинают сдаваться один за другим. Пожалуйста, не перенапрягайтесь! Для вас уже дежурят машины скорой помощи!"
2003402-131 = ""
2003402-133 = ""
2003402-134 = ""
2003402-135 = ""
2003402-136 = "Акари в ударе! Она продолжает есть, кусок за куском! Есть ли вообще предел её желудку? Неужели у неё внутри спит чёрная дыра?"
2003402-137 = "Ох. Все уже закончили? А блюд осталось ещё так много."
2003402-138 = "Эй, не могли бы вы принести мне то, что они не доели?"
2003402-139 = "Это ведь конкурс «ешь сколько сможешь», так что жалко выбрасывать еду."
2003402-146 = ""
2003402-147 = "Да! Да! Результаты готовы!"
2003402-148 = "Как многие из вас и предсказывали, победительницей этого года становится... Ванибучи Акари! Теперь она трёхкратная чемпионка!"
2003402-149 = "Хи-хи... Похоже, в этом году соревнование успешно прорекламировало торговый квартал."
2003402-150 = "А ещё я наелась множеством вкусностей... И всё благодаря вашей блестящей идее, Сенсей! ★"
2003402-151 = ""
2003402-152 = "О, огромное спасибо вам обоим! Из-за нашей недальновидности мы едва не совершили огромную ошибку."
2003402-153 = ""
2003402-155 = ""
2003402-156 = "О, мой телефон просто разрывается. Интересно, из-за чего?"
2003402-157 = "[s3] \"The people who watched the contest halfway through...\"\n[s4] \"...uploaded the whole spectacle onto the internet...\""
2003402-160 = "Ох. Посмотрите, сколько просмотров!"
2003402-161 = "Погоди, что?!"
2003402-162 = "..."
2003402-163 = "Замечательно! Это ещё сильнее прорекламирует наш торговый квартал!"
2003402-165 = "Н-Но что будет дальше... я уже не уверена."
2003402-167 = "Хи-хи!"
2003402-168 = ""
2003402-170 = ""
2003402-171 = ""
2003402-172 = "Разве не так устроен мир? ★"
2003402-174 = "Хотя смех Акари был лёгким и чистым, от него всё же веяло едва заметным холодком."
