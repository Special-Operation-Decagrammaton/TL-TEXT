[translation]
10040060-1 = "Эпизод 6;Помните меня!!"
10040060-4 = "...Это здесь?"
10040060-5 = "Да. Этот заброшенный подземный проход, скорее всего, давно забыт."
10040060-6 = "Здесь нет никакой системы безопасности, так что ближе к улице, не выходя за пределы территории, уже не подобраться."
10040060-7 = "Ува... Л-ладно..."
10040060-8 = "Страшно... мрачно... темно... ни признака жизни..."
10040060-9 = "Кажется, всё может рухнуть в любую секунду! Не могу поверить, что такое место вообще существует."
10040060-10 = "В том и смысл. У Семинар здесь нет глаз."
10040060-11 = "Я-я понимаю, но..."
10040060-12 = ""
10040060-14 = ""
10040060-15 = "Угх. Неважно. Просто показалось."
10040060-17 = "...?"
10040060-18 = "У нас нет времени. Мы зашли так далеко, что остаётся только двигаться вперёд. В самом конце этого туннеля будет выход."
10040060-19 = "Сразу предупрежу: когда вы уйдёте слишком глубоко, мы уже не сможем помочь."
10040060-20 = "[s1] «Не сможете?»\n[s2] «Здесь нет сигнала?»"
10040060-23 = "Именно. Некоторое время связаться с вами не получится."
10040060-24 = "Путь может быть немного запутанным, но если следовать нашим указаниям, всё будет хорошо."
10040060-25 = "Выход приведёт в переулок под эстакадой, немного в стороне от здания Семинар."
10040060-26 = "Там вас встретит Маки."
10040060-28 = "Я вообще ничего впереди не вижу! А если споткнусь и упаду?"
10040060-29 = "Если мы пострадаем, будет ооогромная проблема. Нельзя включить свет или что-то такое?"
10040060-30 = "Ты хочешь объявить маршрут побега всему миру?"
10040060-31 = "[s3] «Но нельзя допустить, чтобы кто-то пострадал.»\n[s4] «Давайте включим свет, чтобы избежать риска.»"
10040060-34 = "...И вы туда же, Сенсей?"
10040060-35 = "Освещение по всему проходу есть, но... проблема не в этом."
10040060-36 = "Как только включите свет, диспетчерская заметит, что в проход подали питание. Им хватит секунд, чтобы понять, что произошло."
10040060-37 = "По сути, начнётся гонка: успеете ли вы сбежать раньше, чем они доберутся до вас."
10040060-38 = "Вы правда думаете, что сможете их обогнать, Сенсей?"
10040060-39 = "...А? Даже тогда?"
10040060-40 = "...Вы не хотите, чтобы Коюки или две преследующие вас девушки пострадали?"
10040060-41 = ""
10040060-43 = ""
10040060-44 = "...*вздох* Мы правда будем делать именно так?"
10040060-45 = "Полагаю, это очень в вашем духе. Тогда другого выбора нет."
10040060-46 = "Справа за углом найдёте выключатель питания."
10040060-47 = "Как только включите его, загорится свет и диспетчерская обнаружит вас. Поэтому придётся бежать как можно быстрее."
10040060-48 = "Ладушки! Я справлюсь! Стена... справа у стены..."
10040060-49 = "Посмотрииим. Это?"
10040060-50 = ""
10040060-52 = ""
10040060-54 = "...Сработало?"
10040060-55 = "Звук... чего-то бегущего?"
10040060-56 = ""
10040060-61 = "Ч-что?! Что?! Это ТОЧНО не звук включающегося света!"
10040060-62 = "Обнаруженный звук..."
10040060-63 = "...приближающиеся войска? Летательные аппараты и дроны...?!"
10040060-64 = "Чееего?! П-почему?! Какие ещё ДРОНЫ?!"
10040060-65 = "[ns5] «Они всё это время нас ждали?!»\n[ns6] «К-как они так быстро отреагировали?!»"
10040060-68 = "Убирайтесь оттуда, сейчас же! И-или уже слишком поздно?"
10040060-69 = "Просто бегите! Бегите вперёд, несмотря ни на что!"
