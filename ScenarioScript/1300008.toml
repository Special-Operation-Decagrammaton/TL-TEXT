[translation]
1300008-1 = "Доброе утро, Господин"
1300008-2 = "Дом Шале"
1300008-4 = "Хи-хи. Всё ещё спишь как младенец?"
1300008-5 = "И сон такой приятный. Прости меня за это."
1300008-6 = "Пора просыпаться."
1300008-13 = "Проснулся."
1300008-14 = "Доброе утро, Господин."
1300008-15 = "Рано? Ну конечно. Я ведь специально тебя разбудила пораньше."
1300008-16 = "Моя мотивация может... подождать."
1300008-17 = "Хи-хи. Если злишься, можешь меня наказать."
1300008-18 = "Более того, я настаиваю!"
1300008-19 = "Я бы с улыбкой прошла через ад и обратно, если это позволит служить тебе, пока ты здоров и счастлив!"
1300008-20 = "Так что накажи меня!"
1300008-21 = "..."
1300008-22 = "О. Не видишь необходимости?"
1300008-23 = "Ты слишком добр для собственного блага, Господин. Хи-хи."
1300008-24 = ""
1300008-25 = "А, снова ложиться нельзя! Просыпайся."
1300008-26 = "Можешь просто смириться и... О боже. Что ты...? Ах!"
1300008-27 = "А?"
1300008-28 = ""
1300008-30 = "О-Ой."
1300008-31 = "З-Затаскивать горничную к себе в постель... Как смело."
1300008-32 = "Прошу прощения? Спать вместе?!"
1300008-33 = "Ох, какой скандал. Пусть ты и мой господин, но всё же..."
1300008-35 = "Хм?"
1300008-36 = "..."
1300008-37 = "Боже мой."
1300008-38 = "Ты... Ты правда уснул?!"
1300008-39 = "Невероятно! Просыпайся! Немедленно просыпайся!"
1300008-40 = "*вздыхает*"
1300008-41 = "Послушай. Настоящая причина, по которой я сегодня разбудила тебя так рано..."
1300008-42 = "...в том, что мне не терпелось снова тебя увидеть и поговорить с тобой."
1300008-43 = "..."
1300008-44 = "Так что часть меня совсем не против ещё немного полежать вот так."
1300008-45 = "Хи-хи. Так тепло."
1300008-46 = "Вот бы каждое утро начиналось так блаженно..."
1300008-48 = "...но я приготовила кое-что ещё."
1300008-49 = "Думаю, скоро сам увидишь."
