[translation]
11030-1 = "Episódio 3;O Poder de um Adulto é Incrível!"
11030-2 = "Comitê de Contramedidas - Sala de Aula"
11030-3 = "Nossa~ Não esperava mesmo que a gente fosse vencer. A Gangue dos Capacetes parecia ter vindo com tudo dessa vez."
11030-4 = "Não é hora de dizer que não esperava vencer, Hoshino-senpai...#nSe não vencêssemos, a escola ia virar esconderijo de delinquentes..."
11030-5 = "O comando do Sensei foi ótimo. Foi totalmente diferente de quando somos só nós."
11030-6 = "Então esse é o poder de um adulto...#nUma quantidade enorme de recursos e equipamentos, e até comando em combate. Adultos são incríveis."
11030-7 = "Você andava se sentindo sozinha esse tempo todo, né, Shiroko-chan?#nAgora que o papai voltou pra casa, a mamãe vai poder dormir tranquilinha~"
11030-8 = "Ei, ei, para com essas piadas estranhas! Você vai deixar o Sensei sem graça!#nE além disso, você vive dormindo pelos cantos, Presidente!"
11030-9 = "Isso mesmo, coitadinho do Sensei."
11030-10 = "Ahaha... Está um pouco atrasado, mas vamos nos apresentar formalmente, Sensei."
11030-11 = "Nós somos o Comitê de Contramedidas de Abydos."
11030-12 = "Eu sou Ayane, do 1º ano, secretária e operadora do comitê..."
11030-13 = "Esta é a Serika, também do 1º ano,"
11030-14 = "Olá."
11030-15 = "E do 2º ano, a Nonomi-senpai e a Shiroko-senpai."
11030-16 = "Prazer em conhecê-lo, Sensei~"
11030-17 = "Fui eu quem te encontrou primeiro na beira da estrada agora há pouco."
11030-18 = "...Ah, não estou tentando me gabar nem nada."
11030-19 = "E esta aqui é a nossa presidente,"
11030-20 = "Hoshino-senpai, do 3º ano."
11030-21 = "Opa~ Prazer em te conhecer, Sensei~"
11030-22 = "Como pôde ver, nossa escola está passando por uma crise...#nPor isso, pedimos apoio à \"Schale\", e graças à sua vinda, Sensei,#nconseguimos superar essa situação."
11030-23 = "Se não fosse pelo Sensei, aquele pessoal poderia ter tomado a escola.#nNão temos nem como agradecer o suficiente..."
11030-24 = "[s] Perguntar o que é o Comitê de Contramedidas."
11030-25 = "Tem razão, vou explicar. O Comitê de Contramedidas é... um clube formado por voluntárias para reerguer Abydos."
11030-26 = "Isso mesmo! É o único clube da escola, composto por todo o corpo discente!#nBem, mesmo dizendo todo o corpo discente, somos só nós cinco."
11030-27 = "As outras alunas se transferiram ou abandonaram a escola e foram embora da cidade."
11030-28 = "Com a escola nesse estado, quase todos os moradores do distrito escolar foram embora,#ne acabamos sendo atacadas por delinquentes de terceira categoria como a Gangue dos Capacetes Kata-Kata."
11030-29 = "Do jeito que está, é difícil proteger a escola sozinhas. É vergonhoso admitir como aluna daqui, mas..."
11030-30 = "Se não tivéssemos recebido o apoio da \"Schale\"... desta vez, realmente não haveria mais o que fazer."
11030-31 = "Pois é~ Os suprimentos também estavam acabando, eu já tinha até me conformado. Você apareceu bem na hora certa, Sensei."
11030-32 = "Sim, sim! Agora a Gangue dos Capacetes não é mais nada pra gente. O poder de um adulto é incrível☆"
11030-33 = "Mesmo assim, eles não são do tipo que vão parar de atacar."
11030-34 = "Ah, verdade. Eles são bem insistentes mesmo."
11030-35 = "Até quando vamos ter que continuar nessa guerra de atrito...?#nJá temos tantos outros problemas além da Gangue dos Capacetes..."
11030-38 = "Justamente por isso, eu bolei um planinho~"
11030-39 = "Quê?! A Hoshino-senpai?!"
11030-40 = "Mentira...?!"
11030-41 = "Nossa~ Até eu fico um pouquinho magoada com uma reação dessas~#nO velhote aqui também faz as coisas direito de vez em quando, sabia?"
11030-42 = "...E então, qual é o plano?"
11030-43 = "Em alguns dias, a Gangue dos Capacetes deve atacar de novo.#nAfinal, esse ciclo vem se repetindo há um bom tempo~"
11030-45 = "Por isso, pensei em aproveitar o momento para tomar a iniciativa e atacar o posto avançado deles. Agora deve ser justamente quando estão mais desgastados~"
11030-46 = "A-Agora?"
11030-47 = "Sim. Agora temos o Sensei aqui, e dá pra resolver coisas chatas como suprimentos também."
11030-48 = "Entendi. O posto avançado da Gangue dos Capacetes fica a uns 30 km daqui, então vamos partir agora."
11030-49 = "Acho uma ótima ideia. Eles nem devem sonhar que vamos contra-atacar logo agora."
11030-50 = "B-Bem, isso é verdade, mas... o que você acha, Sensei?"
11030-51 = "[s] Concordar."
11030-54 = "Beleza, já que temos o aval do Sensei, vamos aproveitar o embalo e mandar ver~"
11030-55 = "Não há tempo a perder, então."
11030-56 = "Sim~ Então, vamos lá!"
11030-58 = "Entramos na área onde supostamente fica o esconderijo da Gangue dos Capacetes Kata-Kata."
11030-59 = "Detectados vários sinais inimigos em um raio de 15 km."
11030-60 = "Os inimigos provavelmente já perceberam nossa chegada.#nA partir daqui, vamos com força total!"
