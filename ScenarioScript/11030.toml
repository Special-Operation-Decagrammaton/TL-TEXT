[translation]
11030-1 = "Эпизод 3;Взрослые — это потрясающе!"
11030-2 = "Клубная комната Комитета по предотвращению закрытия Абидоса"
11030-3 = "Ого, не могу поверить, что мы победили! Банда шлемов выглядела очень решительно."
11030-4 = "Не стоит так говорить, Хошино. Если бы мы проиграли, эти бандиты захватили бы школу."
11030-5 = "Сенсей дал нам преимущество, необходимое, чтобы переломить ход боя. Иначе мы бы не справились."
11030-6 = "Такова сила опыта взрослого? То, как вы распоряжались ресурсами, снаряжением и поддержкой, было потрясающе."
11030-7 = "Ну и ну, Широко. Звучишь как школьница, которая втрескалась по уши.#nЛадно, раз всё кончилось, можно я снова пойду спать?"
11030-8 = "Не дразни Широко, Хошино! И вообще, ты сегодня ещё не наспалась?"
11030-9 = "Кому-то сейчас влетит!"
11030-10 = "Ха-ха. В любом случае нам стоит представиться, Сенсей."
11030-11 = "Мы — Комитет по предотвращению закрытия Абидоса."
11030-12 = "Я Аяне, первогодка. Отвечаю за документацию и организацию работы комитета."
11030-13 = "Это Сэрика, тоже первогодка."
11030-14 = "Привет."
11030-15 = "А это наши второгодки — Широко и Нономи."
11030-16 = "Здравствуйте, Сенсей!"
11030-17 = "Мы уже встречались."
11030-18 = "...Не то чтобы я пытаюсь выставить это чем-то особенным."
11030-19 = "А вот и наш президент."
11030-20 = "Хошино — наша единственная третьегодка."
11030-21 = "Приятно познакомиться, Сенсей."
11030-22 = "Наверное, вы уже заметили, что наша школа переживает кризис. Поэтому я обратилась за помощью к Шале, и вы уже успели нас выручить."
11030-23 = "Если бы не вы, эти бандиты сумели бы захватить школу.#nМы даже не знаем, как вас благодарить."
11030-24 = "[s] Спросить, чем занимается Комитет по предотвращению закрытия."
11030-25 = "Цель Комитета по предотвращению закрытия — вернуть Абидосу его былую славу."
11030-26 = "Ага-ага! Мы единственный клуб школы, в котором состоят абсолютно все студенты!#nТо есть... нас во всей школе всего пятеро, но всё же..."
11030-27 = "Все остальные либо перевелись, либо бросили учёбу и уехали из города."
11030-28 = "Я их не виню, что они вообще покинули академический город, учитывая состояние Абидоса.#nА теперь нам ещё приходится иметь дело с бандитами вроде Банды шлемов Ката-Ката, которые пытаются захватить школу."
11030-29 = "Нам тяжело защищать Абидос в одиночку... Если честно, положение у нас плачевное..."
11030-30 = "В этот раз мы бы попали в очень серьёзную передрягу, если бы Шале не пришёл на помощь."
11030-31 = "Серьёзно. Когда у нас закончились припасы, я уже думала, что нам конец.#nВы появились как раз вовремя, Сенсей."
11030-32 = "Зато теперь можно не беспокоиться о Банде шлемов!#nПолезно иметь связи со взрослыми наверху! ☆"
11030-33 = "Нет. Уверена, это лишь вопрос времени, когда они вернутся."
11030-34 = "Да, скорее всего. Они не умеют сдаваться."
11030-35 = "Кто знает, сколько ещё всё это будет тянуться? Помимо Банды шлемов у нас и так полно проблем."
11030-36 = ""
11030-38 = "У меня есть план."
11030-39 = "Что за...?! Хошино придумала план?!"
11030-40 = "Я тоже удивлена!"
11030-41 = "Знаю, на старости лет у меня уже маразм, но не обязательно так ранить мои чувства.#nЯ тоже вношу свой вклад, знаете ли."
11030-42 = "Ну? Выкладывай."
11030-43 = "Если история повторится, Банда шлемов снова нападёт через несколько дней."
11030-44 = ""
11030-45 = "Так почему бы нам до этого хоть раз не перейти в наступление?#nПосле последней драки они наверняка сидят подавленные и уязвимые."
11030-46 = "Т-ты хочешь сказать — прямо сейчас?"
11030-47 = "Да, сейчас. С Сенсеем у нас более чем достаточно припасов, чтобы раз и навсегда закончить это дело."
11030-48 = "Верно. База Банды шлемов в 30 километрах отсюда.#nЕсли выйдем сейчас, времени у нас предостаточно."
11030-49 = "Я за. Последнее, чего они ожидают, — что мы нападём прямо сейчас."
11030-50 = "Не могу не согласиться, но... что вы думаете, Сенсей?"
11030-51 = "[s] «Я за»."
11030-52 = ""
11030-54 = "Отлично! Если Сенсей дал добро, тогда поторопимся."
11030-55 = "Куй железо, пока горячо."
11030-56 = "Хорошо! Вперёд!"
11030-58 = "Теперь вы на территории Банды шлемов Ката-Ката."
11030-59 = "Я засекла несколько сигналов в радиусе 15 километров."
11030-60 = "Они наверняка знают, что вы там. Не теряйте бдительности!"
