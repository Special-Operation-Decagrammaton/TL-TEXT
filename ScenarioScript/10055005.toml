[translation]
10055005-1 = "Prologue;Cast Girl Away"
10055005-3 = "(It is a summer day, and the sweltering heat continues...)"
10055005-7 = "(A video letter arrived from the Pandemonium Society.)"
10055005-14 = "……."
10055005-18 = "…………."
10055005-20 = "Makoto-senpai?#nThe silence is a bit..."
10055005-24 = "Hm? Ah, is it already recording?"
10055005-25 = "I called out to you just now?#nDo you want to redo it?"
10055005-26 = "No, that's fine.#nSomething like this is nothing! Kiki!"
10055005-30 = "—Sensei, rejoice!"
10055005-31 = "The sweltering heat has continued all summer, and you've been racking your brain over it, haven't you?#nBut you can leave it to me, Makoto!"
10055005-32 = "The other day—the contract was successfully finalized. You have been invited to join this glorious journey! Kikiki!"
10055005-33 = "You're happy, aren't you? I'm sure you're so surprised you've fallen over."
10055005-34 = "…Though, since this is a video message, it's a shame I can't see your face."
10055005-38 = "Well, I can pretty much imagine it, though."
10055005-39 = "Makoto-senpai, please get to the point already."
10055005-40 = "Kikiki! Even if I don't say it, you surely already know, Sensei—"
10055005-45 = "What are you talking about, Makoto-senpai?"
10055005-49 = "Ah, Ibuki-chan!"
10055005-55 = "A video letter for Sensei? I want to talk too!"
10055005-56 = "Ibuki-chan, come over here!#nSay cheese!"
10055005-66 = "Cheese! Ehehe! How is it? Can you see me, Sensei?"
10055005-67 = "Yes, perfectly!#nThe Pandemonium Society is in top form today too!"
10055005-68 = "Oh, that's right, Sensei!#nHave you finished packing for our trip?"
10055005-69 = "Your toothbrush, toothpaste, and... your swimsuit and pajamas, and—"
10055005-70 = "Oh! And don't forget your snacks! Snacks must be 300 yen or less!#nOkay, that's a promise with Ibuki!"
10055005-77 = "Kikiki! Good job, Ibuki! A perfect explanation!"
10055005-78 = "…And so, that is that.#nThis summer, we have chartered a luxury liner—and are planning a super-luxurious cruise trip!"
10055005-79 = "While those Prefect Team folks are sweating it out at their hellish training camp, we will be enjoying a super-duper-ultra-luxurious trip!"
10055005-80 = "And by inviting you, Sensei—we shall show them the difference in our class! Kikikiki!"
10055005-85 = "Sigh... what is the point of doing all that?"
10055005-90 = "Anyway, we are planning to stay for a few nights.#nPlease contact us when you arrive."
10055005-98 = "[ns1] (A summer vacation... it's already that time of year.)\n[ns2] (They went through the trouble of inviting me... maybe I should go.)"
10055005-103 = "(And so, leaving my daily life behind for a while—I headed off on a romantic sea voyage.)"
10055005-109 = "[log]Day 7 of Drifting[/log]"
10055005-114 = "Wa... waaaater...!"
10055005-119 = "[ns3] \"MAKOTO!! Stay with me! Makotoooo!!\"\n[ns4] \"Ho-how did it come to this...!!!\""
10055005-123 = "(...The beginning of it all was 7 days ago.)"