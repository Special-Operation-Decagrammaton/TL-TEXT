[translation]
10055005-1 = "Пролог;Девушка, выброшенная на берег"
10055005-3 = "Жарким, душным летним днём..."
10055005-4 = ""
10055005-7 = "...мне пришло видеосообщение от Общества Пандемониум."
10055005-13 = ""
10055005-14 = "..."
10055005-15 = ""
10055005-17 = ""
10055005-18 = "..."
10055005-20 = "Эм, Макото? Теперь твоя реплика!"
10055005-21 = ""
10055005-23 = ""
10055005-24 = "А? Что? Вы уже снимаете?"
10055005-25 = "Ахаха! Я же просила начинать, когда скажу «Мотор!». Можем снять ещё дубль..."
10055005-26 = "Нет! Звезде моего масштаба вторые дубли ни к чему! Ки-хе-хе!"
10055005-27 = ""
10055005-29 = ""
10055005-30 = "Итак, Сенсей, возрадуйтесь!"
10055005-31 = "Разумеется, ваши мысли целиком заняты предстоящим летом. Снова жара, пот и страдания. Но вы ведь знали, что у великой Макото всегда найдётся решение, не так ли?"
10055005-32 = "И вы были правы! Сделка, которая избавит нас от страданий, только что заключена! И по своей безграничной щедрости я приглашаю вас лично стать свидетелем этого славного события!"
10055005-33 = "...В следующий раз пусть это будет прямой эфир. Хочу видеть реакцию Сенсея."
10055005-34 = "Впрочем, уверена, вы уже упали в обморок от потрясения! Или закричали от радости!"
10055005-35 = ""
10055005-37 = ""
10055005-38 = "Уже представляю, какое у Сенсея сейчас лицо."
10055005-39 = "Скорее всего, Сенсей просто в недоумении. Ты ведь ещё ничего не объяснила, Макото."
10055005-40 = "Кихехе! От всех, кроме себя, я и ожидала такой узости мышления! Но знаю, что Сенсей уже сам обо всём догадался, хотя я не сказала ни слова!"
10055005-41 = ""
10055005-45 = "М-м? А что вы тут делаете?"
10055005-46 = ""
10055005-48 = ""
10055005-49 = "О, Ибуки!"
10055005-50 = ""
10055005-54 = ""
10055005-55 = "Вы записываете видео для Сенсея? Ибуки тоже хочет попасть в кадр!"
10055005-56 = "Само собой! Смотри сюда и скажи «сы-ыр», Ибуки!"
10055005-57 = ""
10055005-60 = ""
10055005-62 = ""
10055005-64 = ""
10055005-66 = "Сы-ы-ы-ыр! Ибуки хочет посмотреть! Хорошо получилось?"
10055005-67 = "Да! Всё кристально чётко! Сначала блистательная речь Макото, а теперь неотразимое очарование Ибуки! Сегодня Общество Пандемониум выступает во всём великолепии!"
10055005-68 = "А, Сенсей! Сенсей! Не забудьте про нашу поездку, ладно?"
10055005-69 = "Нужно взять зубную щётку и пасту... и купальник... и пижаму..."
10055005-70 = "О-о, и сладости! На случай, если проголодаетесь! Обещайте на мизинчиках, что ничего не забудете, Сенсей!"
10055005-71 = ""
10055005-73 = ""
10055005-74 = ""
10055005-75 = ""
10055005-76 = ""
10055005-77 = "Кихехе! Вот это наша Ибуки! Кратко и блестяще всё объяснила! Молодец!"
10055005-78 = "...Итак, положение дел таково. Общество Пандемониум арендует роскошный круизный лайнер и отправляется в великолепное путешествие на летних каникулах!"
10055005-79 = "Пока эти невыносимые дураки из команды Префектов будут обливаться потом на своих адских сборах, мы отдохнём с поистине королевским размахом!"
10055005-80 = "А великодушно пригласив вас с собой, мы заставим команду Префектов осознать, насколько мы превосходим её в благородстве и щедрости! Кихехехе!"
10055005-81 = ""
10055005-83 = ""
10055005-85 = "Разница в характере тут и правда очевидна."
10055005-86 = ""
10055005-88 = ""
10055005-89 = ""
10055005-90 = "В общем, поездка займёт несколько ночей, так что дайте знать заранее, если решите присоединиться."
10055005-91 = ""
10055005-98 = "[ns1] «(Летние каникулы... Уже наступило это время года?)»\n[ns2] «(Планов у меня нет, а они сами меня пригласили. Может, и стоит поехать)»."
10055005-103 = "...И я решил ненадолго оставить повседневные заботы и отправиться в путешествие мечты."
10055005-109 = "[log]Седьмой день в открытом море[/log]"
10055005-113 = ""
10055005-114 = "Воды... Во-о-оды...!"
10055005-115 = ""
10055005-117 = ""
10055005-119 = "[ns3] «Макото! Держись, Макото!»\n[ns4] «Как с нами могло случиться такое несчастье...?!»"
10055005-123 = "...Наши мучения начались семь дней назад."
