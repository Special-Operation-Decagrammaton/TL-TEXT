[translation]
70008020-1 = "Свирепо! Ночь Морё! 2"
70008020-2 = ""
70008020-4 = "Ах."
70008020-5 = "Э."
70008020-6 = "Мы столкнулись с худшим и самым опасным сценарием сразу же, как пришли!!"
70008020-7 = "..."
70008020-8 = "*вздыхает*"
70008020-9 = "Что это ещё за реакция?!"
70008020-10 = "Итак, какие неприятности вы устроили на этот раз?"
70008020-11 = "Мы ещё ничего не сделали!!"
70008020-12 = "Ещё...?"
70008020-13 = "Гах! Ты всегда сбиваешь меня с толку тем, как говоришь!"
70008020-14 = "Оставайтесь здесь. Я разберусь."
70008020-15 = "Эй! У нас нет времени на—"
70008020-16 = ""
70008020-19 = "Ой, это не ты ли, Арата?"
70008020-20 = ""
70008020-21 = "Она! И со своими маленькими друзьями!"
70008020-22 = "Сегодня мне никакая помощь не нужна. Что будем делать?"
70008020-23 = ""
70008020-26 = ""
70008020-27 = "...Вы знакомы?"
70008020-28 = "Я иногда выполняю для них поручения за карманные деньги..."
70008020-29 = "Потому что на фестивалях трудно веселиться с пустыми карманами..."
70008020-31 = "Ну что ж, может, угостить вас чем-нибудь? У нас есть ёкан."
70008020-32 = "Правда?! Главарь, что скажешь?"
70008020-34 = "Идиотка! Ты уже забыла, зачем мы сюда пришли?"
70008020-36 = "А, точно. Простите, мы обещали главарю сегодня кое-чем заняться."
70008020-37 = "Ничего страшного! Проголодаетесь — загляните на обратном пути."
70008020-38 = ""
70008020-41 = ""
70008020-42 = "Она создаёт неприятности и иногда привирает, но вообще она хорошая девочка."
70008020-43 = "Вот как."
70008020-44 = "В конце концов, вы все студенты Хяккияко! Надеюсь, сможете поладить."
70008020-46 = "АААА!! Да ОТВАЛИТЕ вы уже все!!!"
70008020-48 = "Ай-яй. Что мы тебе говорили, деточка? На старших голос не повышают."
70008020-49 = "Ха-ха-ха, мы её изрядно разозлили. Ну, нам пора."
70008020-50 = ""
70008020-52 = ""
70008020-53 = "...Хм."
70008020-54 = ""
70008020-56 = ""
70008020-57 = ""
70008020-58 = "Будем друзьями?"
70008020-59 = "Ты совсем с ума сошла?!"
70008020-60 = "Ни за что на свете я не стану дружить с кем-то из Хяккарёран!!"
70008020-61 = ""
70008020-63 = ""
70008020-64 = ""
70008020-65 = "Главарь! Подожди нас!"
70008020-66 = ""
70008020-68 = ""
70008020-69 = ""
70008020-71 = ""
70008020-72 = "*тяжело дышит* *тяжело дышит* Мы от неё оторвались...?"
70008020-73 = "Стой... Мы же вообще ничего не сделали. Тогда чего я бежала...?"
70008020-74 = ""
70008020-77 = ""
70008020-78 = "*запыхавшись* ...Главарь, ты стала быстрее?"
70008020-79 = "Может... потому что в последнее время все наши планы заканчиваются бегством..."
70008020-80 = "З-Заткнись! Быстрее бегать — это хорошо! Не делай из этого что-то странное!"
70008020-81 = "Но, эм, разве это не к лучшему?"
70008020-82 = "Что именно?"
70008020-83 = "Ну, если бы мы дружили с Хяккарёран, нам бы не пришлось столько бегать, верно?"
70008020-84 = "Хм. А ведь верно. Они типа элита из элит. Может, даже давали бы нам купоны на фестиваль..."
70008020-85 = "Хватит! Немедленно хватит!!"
70008020-87 = "Чего ты так бесишься из-за этого...?"
70008020-88 = "Морё и Хяккарёран никогда, никогда, НИКОГДА не смогут дружить! Так заведено!"
70008020-90 = "Так заведено? С каких пор? Кем?"
70008020-91 = "Это... С начала времён! С этим не поспоришь! А тот, кто так решил, очевидно..."
70008020-92 = "Очевидно..."
70008020-93 = "Проехали!! И чтобы я больше никогда не слышала от вас такой кринжатины!"
70008020-95 = "Главарь сама не знает, да?"
70008020-96 = "Иногда надо просто понять намёк и замолчать."
70008020-98 = "Из-за той остроголовой из Хяккарёран наш план спокойно поискать маску на рынке..."
70008020-99 = "Да на рынке всё равно были бы только скучные обычные маски! Нам нужна настолько особенная, чтобы все в комнате сразу обратили на неё внимание!"
70008020-100 = "А-а? Так это не туристическое место?"
70008020-101 = "Гах, мы столько ждали этой поездки, а теперь ещё и заблудились? Нам прямо не везёт."
