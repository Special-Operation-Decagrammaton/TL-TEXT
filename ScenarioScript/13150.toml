[translation]
13150-1 = "Episódio 15;A Ordem da Vice-Presidente do Conselho"
13150-7 = "Ei, Hoshino-chan."
13150-8 = "Sabe... quando te conheci pela primeira vez, achei que fosse um sonho e belisquei minhas bochechas várias vezes."
13150-9 = "Ter uma caloura tão fofa, forte e confiável como você ao meu lado parecia um sonho... Eu fiquei tão feliz..."
13150-10 = "Hmm, talvez eu não esteja conseguindo explicar direito..."
13150-11 = "É só que... poder estar aqui com você assim, para mim, é como um milagre."
13150-13 = "...Mas estamos juntas assim todos os dias, não estamos?"
13150-14 = "Ontem, hoje e amanhã também. Por que está fazendo tanto drama por algo tão comum?"
13150-15 = "Ah... Mas é que..."
13150-16 = "Um \"milagre\" é algo muito mais grandioso e raro do que isso."
13150-17 = "...Não,"
13150-18 = "Hoshino-chan."
13150-22 = "Eu não acho isso."
13150-23 = "Ei, Hoshino-chan. Quando você também tiver calouras fofas um dia, então—"
13150-24 = "Fique sempre ao lado delas, tá?#nPorque são justamente esses momentos que são como milagres."
13150-25 = "Tenho certeza de que um dia você também vai entender, Hoshino-chan."
13150-27 = "Calouras virem para uma escola como esta..."
13150-28 = "Isso sim seria um milagre."
13150-29 = "Ah, não é isso que eu quis dizer, Hoshino-chan."
13150-30 = "Tá bom, tá bom, já entendi."
13150-31 = "...Hehe.#nEntão, se você tiver calouras um dia..."
13150-32 = "Aconteça o que acontecer, proteja todas elas, viu?"
13150-33 = "Bem, farei o possível."
13150-45 = "Ugh..."
13150-46 = "Mesmo depois de todos aqueles ataques,"
13150-47 = "ela nem ficou sem fôlego..."
13150-51 = "...Desculpem."
13150-52 = "Contra três helicópteros, não deu para pegar leve direito."
13150-53 = "...Com isso, acabei repetindo exatamente o mesmo erro de antes, como você disse, Ayane-chan."
13150-54 = "Podem pedir desculpas ao Sensei por mim também?"
13150-55 = "Digam que sinto muito, mesmo depois de ele ter me ajudado."
13150-58 = "..."
13150-59 = "..."
13150-62 = "...Vocês duas são o \"futuro\" de Abydos."
13150-63 = "Eu fiquei muito feliz por vocês terem vindo para uma escola neste estado."
13150-64 = "Por isso, eu preciso proteger vocês.#nAfinal, é dever de uma veterana proteger suas calouras."
13150-70 = "..."
13150-71 = "Mas,"
13150-72 = "desse jeito, senpai, você...!"
13150-74 = "Está tudo bem, Serika-chan."
13150-75 = "Eu estou no terceiro ano, então vou me formar em breve de qualquer jeito."
13150-76 = "Desta vez, protejam as calouras, Ayane-chan e Serika-chan."
13150-79 = "Vocês têm o papel de carregar o futuro de Abydos."
13150-80 = "Se o Canhão Ferroviário desaparecer... com certeza tudo vai se resolver."
13150-81 = "Basta que só o velhote aqui desapareça."
13150-84 = "Nonomi-chan, Shiroko-chan, Ayane-chan, Serika-chan...#nSe todas juntarem forças, vai ficar tudo bem."
13150-85 = "O Conselho Estudantil de Abydos da Yume-senpai e meu se dissolve hoje.#nMas o Comitê de Contramedidas vai continuar daqui em diante."
13150-91 = "Então, passem o bastão para as próximas calouras também."
13150-92 = "Como herdeira da vontade da Presidente do Conselho Estudantil de Abydos, Yume Kuchinashi..."
13150-94 = "Esta é a última ordem da Vice-Presidente do Conselho, Hoshino Takanashi."
13150-103 = "Vocês estão bem?"
13150-105 = "Shiroko-senpai..."
13150-106 = "Você é quem está mais machucada..."
13150-108 = "...Nn. Onde está a Hoshino-senpai?"
13150-109 = "Não conseguimos impedi-la..."
13150-110 = "...Não fomos fortes o suficiente."
13150-111 = "Shiroko-senpai, o que a gente faz agora...?"
13150-112 = "Eu também não sei..."
13150-114 = "Acho que é a primeira vez"
13150-115 = "que vejo a senpai desse jeito..."
13150-117 = "..."
13150-130 = "Falando nisso, o contrato da Presidente do Conselho Estudantil..."
13150-132 = "O que tem ele?"
13150-137 = "Hoje faz exatamente dois anos desde que aquele contrato foi firmado."
13150-138 = "Isso significa que..."
13150-140 = "A Presidente desapareceu exatamente neste dia, há dois anos..."
13150-156 = "...Nonomi-chan, espere por mim."
13150-158 = "Nunca mais..."
13150-161 = "...Eu nunca mais vou repetir aquele erro."
13150-163 = "Próximo;Contra-ataque"
