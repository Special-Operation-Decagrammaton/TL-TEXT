[translation]
13150-1 = "Эпизод 15;Приказ вице-президента студсовета"
13150-4 = ""
13150-7 = "Знаешь, Хошино..."
13150-8 = "Когда мы впервые встретились, мне пришлось ущипнуть себя за щёку, чтобы убедиться, что я не сплю."
13150-9 = "Я не могла быть счастливее, что рядом со мной оказалась такая милая и надёжная младшая."
13150-10 = "Я никогда не умела красиво говорить, но если попытаться объяснить..."
13150-11 = "...я бы сказала, что возможность вот так проводить с тобой время ощущается как чудо."
13150-13 = "Но мы же видимся каждый день."
13150-14 = "Я видела тебя вчера, вижу сегодня и увижу завтра. Что тут особенного?"
13150-15 = "Я знаю, но..."
13150-16 = "Чудеса ведь должны быть невероятными и редкими, разве нет?"
13150-17 = "Ну... нет. Не всегда, Хошино."
13150-18 = "Я в это верю."
13150-19 = ""
13150-21 = ""
13150-22 = "В жизни я многого не понимаю, но в этом уверена."
13150-23 = "Однажды, Хошино, у тебя появятся собственные милые младшие студенты. И когда это случится..."
13150-24 = "Возможность каждый день видеть их лица... создавать вместе воспоминания сегодня, завтра и послезавтра..."
13150-25 = "Ты поймёшь, что именно эти простые, кажущиеся незначительными повседневные моменты и есть настоящие чудеса."
13150-27 = "Появление младших в такой школе... вот это было бы настоящим чудом. Особенно учитывая, что все покидают район."
13150-28 = "У нас вообще будут новые студенты?"
13150-29 = "Хм... Я не это имела в виду, Хошино! Я пытаюсь сказать, что повседневная жизнь..."
13150-30 = "Ладно-ладно. Если ты так говоришь, Юмэ."
13150-31 = "Д-Да! Так что если чудом у тебя появятся милые младшие, Хошино..."
13150-32 = "...обещай на мизинцах, что будешь о них хорошо заботиться. Хорошо?"
13150-33 = "Ладно, поняла. Обещаю."
13150-45 = "*кашель* *кашель* Ух... Ноги... подкашиваются..."
13150-46 = "Я правда выложилась на полную..."
13150-47 = "...и даже царапины не оставили? Как...?"
13150-50 = ""
13150-51 = "...Простите, Аяне, Серика."
13150-52 = "С тремя боевыми вертолётами я не могла особо вам поддаваться."
13150-53 = "Но ты права, Аяне. Я вообще не изменилась. Мне правда жаль."
13150-54 = "Извинитесь перед Сенсеем за меня, ладно? Эта старушка просто снова и снова повторяет одни и те же ошибки..."
13150-55 = "Можете ненавидеть меня за это..."
13150-58 = "..."
13150-59 = "..."
13150-60 = ""
13150-62 = "Вы — будущее Абидоса. Аяне, Серика."
13150-63 = "Вы единственные пришли сюда потому, что вам правда, искренне был дорог Абидос."
13150-64 = "Поэтому я должна защитить ваше будущее. В конце концов, это моя обязанность как вашей старшей."
13150-65 = ""
13150-67 = ""
13150-69 = ""
13150-70 = "..."
13150-71 = "...Но это слишком! Нельзя объявлять прежний студсовет и его председателя фальшивкой!"
13150-72 = "И в одиночку..."
13150-74 = "Всё нормально, Сэрика. Да... Так и должно быть."
13150-75 = "Я ведь однажды выпущусь. И тогда уже вам придётся выйти вперёд и нести ответственность за Абидос."
13150-76 = "Так устроен мир. Я, как ваша старшая, должна защищать вас и прокладывать дорогу к вашему будущему. А вы, младшие, однажды перерастёте меня и продолжите идти дальше."
13150-77 = ""
13150-79 = "Вы, Комитет по выплате долга, должны продолжать двигаться вперёд, к будущему Абидоса."
13150-80 = "Как только я заставлю Железнодорожную пушку исчезнуть... всё будет решено. Угрозы Абидосу, ошибки прежнего студсовета, интриги районных корпораций... Всё наконец закончится."
13150-81 = "После этого у вас всё будет хорошо."
13150-84 = "Нономи, Широко, Серика, Аяне... Я знаю, вы отлично справитесь."
13150-85 = "Пусть студсовет Абидоса времён Юмэ останется в прошлом. Тогда Комитет по выплате долга и Сенсей смогут идти вперёд и строить новое будущее."
13150-86 = ""
13150-88 = ""
13150-90 = ""
13150-91 = "Идите вперёд, в будущее... к свету..."
13150-92 = "Такова воля ушедшей, последней председательницы студсовета Абидоса..."
13150-94 = "...и приказ вице-президента студсовета, Таканаши Хошино."
13150-95 = ""
13150-100 = ""
13150-103 = "Все в порядке?"
13150-105 = "Широко..."
13150-106 = "Ты ранена сильнее всех нас! Это ТЫ в порядке?"
13150-108 = "Да. Хошино... ушла?"
13150-109 = "...Да. Мы не смогли её остановить... Она была слишком сильной..."
13150-110 = "...а мне не хватило сил."
13150-111 = "Ч-Что нам теперь делать, Широко...?"
13150-112 = "Не знаю..."
13150-114 = "Я никогда раньше не видела Хошино такой..."
13150-115 = "Будто... как бы сказать...?"
13150-117 = "..."
13150-124 = ""
13150-125 = ""
13150-130 = "Если я правильно помню, договор, который написала Юмэ..."
13150-132 = "Да?"
13150-133 = ""
13150-135 = ""
13150-137 = "Сегодня... ровно два года со дня его подписания."
13150-138 = "А это значит..."
13150-140 = "Сегодня день, когда председатель Юмэ исчезла..."
13150-149 = ""
13150-151 = ""
13150-152 = ""
13150-155 = ""
13150-156 = "Всё готово. Пора спасать Нономи."
13150-158 = "И ещё..."
13150-161 = "...закончить то, чего я не смогла два года назад."
13150-163 = "Следующий эпизод;Контратака"
