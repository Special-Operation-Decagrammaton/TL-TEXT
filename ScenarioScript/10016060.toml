[translation]
10016060-1 = "Эпизод 6;Сотрудничество 1"
10016060-3 = ""
10016060-4 = "*тяжело дышит* Похоже, их уже и след простыл."
10016060-5 = "Маширо, ты не видела студентов, которых я описывала? Они должны были нести коробки с оборудованием."
10016060-6 = "Отрицательно! Я наблюдала за районом со световой вышки и не видела никого, подходящего под описание."
10016060-7 = "Я попросила остальных доложить, если они что-нибудь увидят, но получаю самые разные ответы..."
10016060-8 = "Пока нам не удалось определить достоверное местонахождение..."
10016060-9 = "[s] «Кирино, ты помнишь, как они выглядели?»"
10016060-11 = "Как они выглядели? Эм... Сейчас вспомню..."
10016060-12 = "Кажется, у них были короткие волосы, спортивная форма... И кроссовки..."
10016060-13 = "Ты только что описала каждого студента в Кивотосе."
10016060-14 = "Но она права, они выглядели довольно неприметно. Ничем особенно не выделялись, так что я мало что помню."
10016060-15 = "Простите... Мне стоило получше рассмотреть их лица..."
10016060-16 = ""
10016060-18 = ""
10016060-19 = "Не извиняйся. Если бы не ты, мы бы вообще не узнали о происходящем."
10016060-20 = ""
10016060-22 = ""
10016060-24 = "(Жаль, что у нас так не хватает людей...)"
10016060-25 = "(Будь это Тринити, преступниц уже бы поймали.)"
10016060-26 = "Здесь какая-то проблема?"
10016060-27 = "Я знаю этот голос..."
10016060-28 = ""
10016060-30 = ""
10016060-32 = ""
10016060-33 = ""
10016060-34 = "Руководители Геенны, Тринити и Миллениума вместе? Никогда не думала, что увижу такое сочетание..."
10016060-35 = "Мы? Сочетание? Пожалуйста, не воспринимайте нас как одну компанию."
10016060-36 = "Эй, мне тоже не нравится, когда меня ставят с тобой в одну группу. Не хочу, чтобы думали, будто я заодно с каким-то чудовищем."
10016060-37 = "Простите?! Как вы меня только что назвали?"
10016060-38 = "Хаха... Давайте не будем ссориться... Пожалуйста..."
10016060-40 = "Что привело вас сюда?"
10016060-41 = "Я возвращалась из медпункта и случайно увидела этих двоих, развалившихся на скамейке."
10016060-42 = "Мы решили зайти в кафе, немного восстановить силы и спрятаться от жары."
10016060-43 = "Но, Хасуми, ты выглядишь обеспокоенной. Всё в порядке?"
10016060-44 = "Думаю, да. Скорее всего, ничего серьёзного."
10016060-45 = "Эти студенты Валькирии сообщили, что видели, как какие-то студенты без разрешения переносили оборудование."
10016060-46 = "Я решила на всякий случай разобраться. Не хотелось бы, чтобы спортивное оборудование попало не в те руки..."
10016060-48 = "Что ты только что сказала?! Это очень серьёзно!"
10016060-49 = "Н-неужели?"
10016060-50 = "Да! Ты представляешь, сколько всё это оборудование стоит? Если его кто-нибудь украдёт, финансовые потери..."
10016060-51 = "Хуже того, всё это оборудование было специально разработано для Фестиваля Хало с использованием технологий Миллениума, так что потенциал для злоупотреблений огромен."
10016060-52 = "Всего в прошлом месяце какие-то хулиганки из Геенны приделали огнемёт к уборочному роботу, украденному у Миллениума, и устроили погром."
10016060-53 = "Один обычный уборочный робот нанёс столько ущерба, что вывел из строя целое подразделение Дисциплинарного комитета. Если кто-то злоупотребит оборудованием с технологиями Миллениума, неизвестно, чем всё закончится."
10016060-54 = "...Не хочется этого говорить, но, возможно, огнемёт на том уборочном роботе уже был установлен изначально."
10016060-55 = "Это лишь подтверждает мою мысль. Нам нужно действовать немедленно."
10016060-56 = "Юука, всё имущество Миллениума оснащено электронными метками, верно?"
10016060-57 = "Пожалуйста, проверь список инвентаря: какое оборудование не вернули после соревнований и во сколько закончились соответствующие игры."
10016060-58 = "Я проверю журналы доступа к ключевым объектам и составлю список студентов, которые находились у дорожек примерно в это время."
10016060-59 = "Я-я уже этим занимаюсь..."
10016060-60 = ""
10016060-62 = ""
10016060-63 = ""
10016060-64 = ""
10016060-65 = "...Какая любопытная ситуация."
10016060-66 = "С чего вдруг Геенна снизошла до того, чтобы помогать кому-то из нас?"
10016060-67 = "А...?"
10016060-68 = "Я не пытаюсь помогать ни тебе, ни Тринити, ни Миллениуму!"
10016060-69 = "Мы всё ещё члены руководства Фестиваля Хало Кивотоса. Я просто выполняю свою работу, чтобы ничто не нарушило деятельность Геенны, на всякий случай."
10016060-70 = "Если виновница окажется из Геенны, нам нужно быстро её поймать, чтобы с нас не взыскали лишние расходы."
10016060-71 = "Теперь понимаешь, к чему я клоню?"
10016060-72 = "...Наверное."
10016060-74 = "Мы осмотрим окрестности и опросим студентов, чтобы найти возможных свидетелей."
10016060-75 = "Мари, можем попросить тебя помочь?"
10016060-76 = "П-Поняла!"
10016060-80 = "Значит, ты видела студентов с коробками оборудования, направлявшихся к подземному входу?"
10016060-81 = "Именно. Они с трудом тащили коробку, полную металлических деталей, но довольно резко отказались от моей помощи. Мне это показалось странным."
10016060-82 = "Это привлекло моё внимание, поэтому я проследила, в какую сторону они пошли."
10016060-83 = "Я составила список оборудования, которое так и не вернули."
10016060-84 = "Коробки с ядрами для толкания, барьеры для одиночной полосы препятствий..."
10016060-85 = "А это все студенты, которые вошли на стадион после соревнований, хотя сами не были участницами."
10016060-86 = "Кирино, ты узнаёшь кого-нибудь из них?"
10016060-87 = "О! Вот эта! Именно она переносила оборудование!"
10016060-89 = "Судя по всем уликам, этот студент тайком относил оборудование к подземному входу стадиона."
10016060-90 = "К подземному входу?"
10016060-91 = "Но мы решили не использовать это помещение, потому что оно слишком маленькое. Что они вообще могли делать там со всем этим оборудованием?"
10016060-92 = "Узнать это можно только одним способом — поймать их."
10016060-93 = "Давайте двигаться, пока след ещё свежий."
10016060-94 = ""
10016060-95 = "Фестиваль Хало Кивотоса — захватывающий спортивный фестиваль, который проходит раз в два года."
10016060-96 = "Участвуя в фестивале, который показывают во всех новостях, можно войти в историю как герой и даже стать примером для подражания, оставив вдохновляющее послание будущим студентам."
10016060-97 = "А это значит..."
10016060-98 = ""
10016060-100 = ""
10016060-101 = "Если мы устроим протест здесь, его последствия прокатятся по всему Кивотосу!"
10016060-102 = "Но, босс, на Атлетическом стадионе охрана каждой академии, да ещё и студенты Полицейской школы Валькирия..."
10016060-103 = "Если мы попробуем протестовать, разве Исполнительный комитет не прикроет нас сразу же?"
10016060-104 = "Не о чем беспокоиться. Камеры канала «Кронос» снимают каждую секунду, так что даже Исполнительный комитет не посмеет нас тронуть."
10016060-105 = "К тому же, пока мы у подземного входа, они не смогут использовать взрывчатку, опасаясь повредить стадион."
10016060-106 = "Они не пробьются через нашу баррикаду и будут вынуждены вести переговоры!"
10016060-107 = "Босс, вы всё продумали! Потрясающе!"
10016060-108 = "Да! Теперь воспользуемся этим моментом и начнём протест за трёхдневную рабочую неделю!"
10016060-110 = "...То есть вы украли наше дорогое оборудование, чтобы построить баррикаду и требовать такую мелочь, как трёхдневная рабочая неделя?"
10016060-112 = "Что? Исполнительный комитет уже здесь?!"
10016060-113 = "Как они нас нашли?!"
10016060-115 = "Неизвестные студенты, не участвующие в соревнованиях, выносили оборудование со стадиона. Вы правда думали, что это не привлечёт внимания?"
10016060-116 = "К тому же оборудование для спортивного фестиваля перевозят роботы, поэтому всё выглядело ещё подозрительнее."
10016060-117 = "Я... даже не подумала об этом..."
10016060-118 = "Но важнее другое: что за чушь вы несли раньше? Трёхдневная рабочая неделя?"
10016060-119 = "Четырёхдневную я ещё могла бы понять, но три дня? Вы хотите, чтобы выходных в неделе было больше, чем рабочих дней?"
10016060-120 = "З-заткнись! Много ли в мире людей, которым работать нравится больше, чем отдыхать?!"
10016060-121 = "Если бы Генеральный студенческий совет действительно заботился о благополучии студентов, он дал бы нам четыре выходных в неделю!"
10016060-122 = "[s] «Именно!»"
10016060-123 = "Сенсей! Вы взрослый человек, помните? Нельзя с ними соглашаться!"
10016060-124 = "Но вернёмся к делу... Вам придётся ответить за нарушение школьных правил и попытку сорвать Фестиваль Хало Кивотоса."
10016060-125 = "Я не стану наказывать вас за кражу оборудования, если вы немедленно его вернёте, но если обнаружатся повреждения, вам выставят счёт за ремонт!"
10016060-126 = "Думаете, нас так легко напугать?"
10016060-127 = "Именно на такой случай мы кое-что подготовили..."
10016060-128 = ""
10016060-130 = ""
10016060-133 = "Мы украли танк, который стоял снаружи стадиона!"
10016060-134 = "[s1] «Танк...? А...»\n[s2] «Погоди, это, наверное, не танк...»"
10016060-135 = "Чего ты так растерялся? Что это ещё может быть, кроме танка?!"
10016060-136 = "В смысле? Если это не танк, тогда что?"
10016060-137 = "У него гусеницы, стальная броня и пулемёт. Что ещё это может быть?"
10016060-138 = "[s3] «(В этом есть смысл...)»\n[s4] «(Тут не поспоришь...)»"
10016060-139 = "К тому же мы почти закончили нашу сверхпрочную баррикаду!"
10016060-140 = "К тому же мы почти закончили нашу сверхпрочную баррикаду!"
10016060-141 = "Эта баррикада построена из металла и дерева. Она непробиваема! Да даже Дисциплинарный комитет Геенны и Боевая группа Правосудия Тринити вместе её не пробьют!"
10016060-142 = ""
10016060-144 = ""
10016060-145 = ""
10016060-147 = "...Вы звали?"
10016060-149 = "Б-босс... Что нам делать? Дисциплинарный комитет, Боевая группа Правосудия и Семинар — все здесь!"
10016060-150 = "Н-не бойтесь! У нас есть танк, помните?"
10016060-151 = "Пусть они и члены студсоветов, их немного. Мы просто всех их скосим!"
10016060-152 = "Ну тогда..."
10016060-153 = "Вперёд, «Крушитель буржуазии»!"
10016060-154 = "[s] «У робота-болельщика появилось ещё одно имя...»"
