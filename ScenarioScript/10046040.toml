[translation]
10046040-1 = "Эпизод 4;С гурманами мы не торгуемся"
10046040-2 = "...Если честно, вся эта ситуация меня немного озадачивает."
10046040-3 = "Но суть в том, что вам нужны продукты для барбекю? Нарезанные, замаринованные и готовые к грилю?"
10046040-4 = ""
10046040-6 = ""
10046040-7 = "Д-Да! Именно!"
10046040-8 = "Сенсей сказал, что у Общества гурманов Геенны, эм, могут оказаться лишние? Прямо под рукой?"
10046040-9 = "Мне это кажется очень... НЕОБЫЧНЫМ... но Сенсей никогда не стал бы лгать о чём-то настолько важном."
10046040-10 = ""
10046040-13 = ""
10046040-14 = "А что произошло? Зачем вам все эти продукты прямо сейчас?"
10046040-15 = "Ой, ну ты же знаешь, как это бывает, Джунко! Иногда чего-то так хочется, желание только растёт, и тебе нужно получить именно это и ничего другого ПРЯМО СЕЙЧАС!"
10046040-16 = "Да, но настолько, что приходится просить о помощи другую академию?"
10046040-17 = "И разве ты не из Чаепития? Это ведь вроде самая верхушка Тринити, да? Почему просто не прикажешь подчинённым купить продукты?"
10046040-18 = "О, бесконечное «чаепитие»? Печенье, чай и пирожные когда захочешь? Завидую...!"
10046040-19 = "Нет... Погодите. Вы и правда весь день только этим и занимаетесь?"
10046040-20 = ""
10046040-22 = ""
10046040-24 = "Меня впечатляет ваша интуиция — или, возможно, разведданные, Сенсей."
10046040-25 = "Потому что у нас действительно сейчас имеется набор продуктов для барбекю высшего качества."
10046040-26 = "[s1] «Правда?!»\n[s2] «Я просто предположил!»"
10046040-29 = "Вы привели меня сюда, даже не зная наверняка?!"
10046040-30 = "Но я рада. Теперь... мне остаётся лишь очаровать их классической дипломатией Тринити."
10046040-31 = "Эм, Харуна... из Геенны, верно? Какое прекрасное место."
10046040-32 = "Как насчёт того, чтобы одолжить мне этот набор для барбекю, м-м?"
10046040-33 = "Я не прошу бесплатно! Я заплачу сполна! Всё, что пожелаете..."
10046040-34 = ""
10046040-36 = ""
10046040-37 = "А, теперь я уже не могу этого сделать..."
10046040-38 = "И всё же я лично очень щедро вас вознагражу!"
10046040-39 = "Хи-хи, переговоры? Очаровательно. Даже представить не могу, сколько всего интересного можно устроить, если Чаепитие окажется у меня в долгу."
10046040-40 = "И поэтому...!"
10046040-41 = "Отказываюсь."
10046040-42 = "П-Почему...?"
10046040-43 = "Мы — эпикурейцы. Наше высшее призвание, страсть и цель заключаются в создании и вкушении изысканной пищи."
10046040-44 = "А ваша попытка выторговать её за нечто столь банальное, как... деньги, наивна до оскорбительности."
10046040-46 = "...Как я и думала."
10046040-47 = ""
10046040-49 = ""
10046040-50 = "Мика. Надеюсь, ты не обидишься, но оставь это дело нам."
10046040-51 = "Хасуми... Давай будем разумными!"
10046040-52 = "Может, попробуем договориться? Хм, нет... У меня плохое предчувствие."
10046040-53 = ""
10046040-57 = ""
10046040-60 = ""
10046040-61 = "...Хасуми права. Не думаю, что это «Общество» настроено на мирные переговоры."
10046040-62 = "Сенсей, вы тоже виноваты!"
10046040-63 = "[s3] «А-А?!»\n[s4] «Что я сделал?!»"
10046040-66 = "Вы сказали, что хотите познакомить нас со своими друзьями. Держали всё в секрете... а потом оказывается, что это Общество гурманов?"
10046040-67 = "Вы вообще представляете, сколько ущерба они нанесли району Тринити?"
10046040-68 = "Они опасны! И вы ПРИВЕЛИ сюда Мику!"
10046040-69 = "[s5] «Нет! Хасуми, всё не так...»\n[s6] «Они... умеренно опасны.»"
10046040-70 = ""
10046040-71 = ""
10046040-73 = ""
10046040-74 = "Да бросьте! Вы прекрасно знаете, кто они такие!"
10046040-75 = "Переговоры окончены. Давайте—"
10046040-77 = "П-Погоди!"
10046040-78 = ""
10046040-80 = ""
10046040-81 = ""
10046040-83 = "Погоди, Хасуми."
10046040-84 = ""
10046040-86 = ""
10046040-87 = ""
10046040-88 = "Опусти оружие. Я хочу попробовать договориться..."
10046040-89 = "Если мы начнём драться, всё может зайти слишком далеко. Кто-нибудь может пострадать."
10046040-90 = "И всё может стать настолько плохо, что Наги или Сэя заметят... Поэтому, пожалуйста..."
10046040-91 = "...давайте постараемся прожить этот день мирно."
10046040-92 = ""
10046040-94 = ""
10046040-96 = "Мика..."
10046040-97 = ""
10046040-99 = ""
10046040-100 = "Как пожелаешь. Я уважаю твою просьбу и пока просто понаблюдаю."
10046040-101 = "Но если я хотя бы учую что-то подозрительное, сразу вмешаюсь."
10046040-102 = "Отлично! Конечно! Спасибо, Хасуми!"
10046040-105 = ""
10046040-106 = ""
10046040-107 = ""
10046040-108 = "Эм, ну, президент Харуна..."
10046040-109 = "Прошу простить мою прежнюю неосторожность. Простите меня."
10046040-110 = "Ха, ничего страшного. Я знаю, что большинству людей трудно понять нашу философию."
10046040-111 = "На самом деле я даже восхищаюсь тем, что вы готовы попытаться."
10046040-112 = "Эм... Значит, я правильно понимаю, что изысканную еду нельзя обменять на деньги."
10046040-113 = "Тогда как насчёт такого? Вы отдаёте продукты для барбекю, а я через два дня добуду вам ещё лучше... максимум через три!"
10046040-114 = "Понятно. Вот это уже прогресс, Мика."
10046040-115 = "Раз изысканная еда поистине бесценна, ты предлагаешь более равноценный обмен."
10046040-116 = "Хи-хи-хи, вот ЭТО уже тот уровень дипломатии, которого я ждала от Чаепития."
10046040-117 = "Т-Тогда?"
10046040-118 = "Именно. Я действительно хотела бы согласиться. Ты приложила такие искренние усилия."
10046040-119 = "Но я снова отказываюсь."
10046040-120 = ""
10046040-122 = ""
10046040-123 = "А?! Разве всё не шло хорошо?! Почему?!"
10046040-124 = "Поверь, это решение и мне далось нелегко. Твоё предложение учитывает ценность изысканной еды, но ему не хватает страсти к самому процессу."
10046040-125 = "Возьмём, например, её поедание. Как долго для тебя длится ощущение, удовлетворение от вкусной еды?"
10046040-126 = "День? Несколько часов? Едва ли. На самом деле само удовольствие исчезает в одно мгновение."
10046040-127 = "А вот подготовка превосходных ингредиентов и оттачивание мастерства — бесконечный путь. Удовольствие заключается в самом стремлении к совершенству."
10046040-128 = "Мне кажется, ты не понимаешь этой тонкости, Мика. Честно говоря, сомневаюсь, что тебе вообще нравится готовить на гриле."
10046040-129 = "Поэтому я вынуждена отклонить твоё предложение."
10046040-130 = "Мы с остальными решили как следует насладиться нашим барбекю. Уже одного этого достаточно, чтобы отказать."
10046040-131 = ""
10046040-133 = ""
10046040-135 = ""
10046040-136 = ""
10046040-137 = "Эм... Это сейчас что было? С ней ещё хуже разговаривать, чем с Сэей..."
10046040-138 = ""
10046040-140 = ""
10046040-141 = "Мика, она отвергла твоё справедливое предложение. Теперь, пожалуйста, позволь нам разобраться с остальным."
10046040-142 = "Хасуми?!"
10046040-143 = "Я предупреждала, что с Геенной невозможно договориться."
10046040-144 = "А здесь ещё и Общество гурманов. Они ещё упрямее."
10046040-145 = ""
10046040-148 = ""
10046040-149 = "Ох, ушки горят!"
10046040-150 = "Ага! Возьми свои слова назад!"
10046040-152 = "С таким ужасным поведением вам стоит радоваться, что мы не арестовали вас на месте."
10046040-153 = "С вами вообще невозможно иметь дело!"
10046040-155 = "Ох-ох. С моих мыслей прямо на твой язык."
10046040-156 = "Именно. Это никогда не было переговорами. Это барбекю — важная часть наших исследований, и мы с ним не расстанемся."
10046040-157 = "Спасибо, что уточнила. Ичика, на позицию!"
10046040-158 = ""
10046040-160 = ""
10046040-161 = "Да!"
10046040-163 = "П-Погодите! Все! Успокойтесь!"
10046040-165 = "Мика, Сенсей. Не беспокойтесь. Мы вознаградим Общество так, как оно того заслуживает."
10046040-166 = "Раз им не понравились наши сладкие речи, как насчёт блюда из пуль?"
10046040-167 = "Хаха... Надеюсь, вам нравится еда навынос."
10046040-168 = ""
10046040-170 = ""
10046040-172 = "[ns7] «Мне следовало этого ожидать.»\n[ns8] «Ещё одна плохая концовка...»"
10046040-173 = ""
10046040-174 = ""
10046040-177 = ""
10046040-180 = "Есть ещё кое-что."
10046040-181 = ""
10046040-183 = ""
10046040-184 = ""
10046040-186 = ""
10046040-187 = "Прежде чем мы начнём схватку, я просто обязана узнать!"
10046040-188 = "Мика."
10046040-189 = ""
10046040-191 = ""
10046040-192 = "Эм, я?"
10046040-193 = "Да, ты! Почему ты так одержима этим барбекю, Мика?"
10046040-194 = "Не хочу тебя обидеть, но ты не похожа на человека, разделяющего нашу эпикурейскую страсть."
10046040-195 = "Мне стало интересно, почему ты так многим рисковала ради барбекю — почему оно понадобилось тебе именно сейчас?"
10046040-196 = ""
10046040-198 = ""
10046040-199 = "Н-Ну..."
10046040-200 = ""
10046040-202 = ""
10046040-204 = ""
10046040-205 = "У меня есть подруга, которая очень много переживает."
10046040-206 = "Она начинает тревожиться, стоит хоть чему-то пойти не по плану."
10046040-207 = "Например, если мы решили пообедать барбекю, а всё сорвалось, она будет бесконечно думать, как могла бы это предотвратить. И уже не сможет расслабиться."
10046040-208 = "Да, порой это раздражает."
10046040-209 = "Но она очень важна для меня, а я не знаю, как помочь ей справляться со стрессом..."
10046040-210 = "Вместо этого я только продолжаю всё портить."
10046040-211 = "Поэтому я хотела, чтобы хотя бы на один день она обо всём забыла и расслабилась."
10046040-212 = "...Но, похоже, ничего не получится."
10046040-213 = ""
10046040-215 = ""
10046040-217 = "Понятно... Это довольно трогательно."
10046040-218 = "Хм... Но даже если мы пойдём на компромисс..."
10046040-219 = ""
10046040-221 = ""
10046040-222 = ""
10046040-223 = "Привет."
10046040-224 = "Харуна, может, просто отдадим ей барбекю?"
10046040-225 = "Изуми...?"
10046040-226 = "Я не умею красиво говорить, как Харуна, но даже самая лучшая еда вкуснее с друзьями!"
10046040-227 = "А если проигнорировать её историю и просто съесть своё барбекю, как мы планировали... думаю, у меня аппетит пропадёт."
10046040-229 = "Согласна."
10046040-230 = "А ты, Джунко?"
10046040-231 = "Ну... После её рассказа я уже не могу остаться в стороне. Я бы хотела помочь."
10046040-232 = "У нас ещё будут барбекю. Это не конец света."
10046040-233 = "...Вообще-то я до этой минуты даже не знала, что сегодня оно было в меню."
10046040-234 = "Два голоса. Акари, что думаешь?"
10046040-235 = ""
10046040-237 = ""
10046040-238 = "Полагаю, ответ очевиден, но всё же скажи."
10046040-239 = ""
10046040-241 = ""
10046040-243 = "Хи-хи. Как хорошо ты меня знаешь, Харуна! Пусть едят мясо!"
10046040-244 = "...Есть последние возражения, дамы?"
10046040-245 = "Хорошо. Мы передадим набор для барбекю Чаепитию."
10046040-246 = ""
10046040-249 = ""
10046040-250 = "Серьёзно?!"
10046040-251 = "Просто отдадите?!"
10046040-252 = "[s] «Что?!»"
10046040-253 = ""
10046040-255 = ""
10046040-256 = "В-Все? Вы вообще за кого меня принимаете?"
10046040-257 = "Эм, ответить по-доброму... или честно?"
10046040-258 = "Этого... уже достаточно больно, спасибо."
10046040-259 = ""
10046040-261 = ""
10046040-262 = "Я не просто отдаю всё бесплатно. Я говорю, что принимаю её первое предложение."
10046040-263 = "То самое обещание добыть ещё лучшие продукты для барбекю через три дня, верно?"
10046040-264 = "Конечно! Самые лучшие, какие смогу найти! Обещаю."
10046040-265 = "Тогда держи."
10046040-266 = ""
10046040-268 = ""
10046040-269 = ""
10046040-270 = ""
10046040-271 = "Отлично! Сенсей! А теперь — к грилю!"
10046040-272 = ""
10046040-274 = ""
10046040-275 = ""
10046040-276 = "..."
10046040-277 = ""
10046040-279 = ""
10046040-280 = "А?"
10046040-281 = "[s9] «Что такое, Мика?»\n[s10] «С продуктами что-то не так?»"
10046040-284 = "Вовсе нет. Всё идеально. Эта коробка... эта марка... именно то, что я заказывала."
10046040-285 = ""
10046040-287 = ""
10046040-289 = ""
10046040-290 = "О."
10046040-291 = "Ничего себе... Неловко вышло."
10046040-292 = ""
10046040-294 = ""
10046040-296 = "То есть Общество гурманов изначально и украло твой заказ?"
10046040-297 = ""
10046040-299 = ""
10046040-301 = "Какое оскорбление! Какая наглость!"
10046040-302 = "Мика! Только скажи слово, и я смету их с лица земли!"
10046040-303 = "..."
10046040-304 = ""
10046040-306 = ""
10046040-307 = ""
10046040-308 = "(Ну вот и всё. О мире теперь можно забыть.)"
10046040-309 = "(Мика пыталась быть дипломатичной и даже милой, но, кажется, её терпение иссякло.)"
10046040-310 = "(Пожалуй, пора доставать броню из грузовика...)"
10046040-311 = "(Как мне спокойно сообщить об этом Нагисе?)"
10046040-312 = ""
10046040-316 = "...Я благодарна. Это именно то, что мне было нужно."
10046040-317 = ""
10046040-319 = ""
10046040-320 = ""
10046040-321 = ""
10046040-322 = ""
10046040-323 = "Прости, Хасуми. Можешь ради меня закрыть на это глаза? Пожалуйста."
10046040-324 = "...Прошу прощения?"
10046040-325 = "Я понимаю, что это бесит и кажется несправедливым, но мне правда нужно поскорее начать барбекю."
10046040-326 = "Разумеется... Но тебя и правда это устраивает?"
10046040-327 = "Да. Сейчас есть кое-кто важнее."
10046040-328 = ""
10046040-330 = ""
10046040-332 = "..."
10046040-334 = "Я-я не понимаю. Она правда за нами не гонится?"
10046040-335 = "Она напоминает мне старосту."
10046040-337 = "Фу-фу... Фу-фу-фу..."
10046040-338 = "Признаю, я этого не планировала, но, похоже, удача нам улыбается."
10046040-339 = "А может, это моя хорошая карма!"
10046040-341 = "Ты совершенно бесстыжая..."
10046040-343 = "Ещё одна победа силы дружбы! ★"
10046040-346 = "Мы слишком опоздали?!"
10046040-347 = "Хм... Даже если поспешим, всё равно прибудем примерно к трём."
10046040-348 = "Мы начнём подготовку. Мика, задержи Чаепитие."
10046040-349 = "Эм, ага! Оставляю это вам!"
10046040-350 = ""
10046040-358 = "У-у-угх...!"
10046040-359 = "Нагиса, ты слишком напряжена."
10046040-360 = "Тебе нужно расслабиться. Используй свои... Если честно, быстрее будет показать."
10046040-361 = "Вот, ты тянешь там, где нужно отпускать. Здесь, там, где мой большой палец."
10046040-362 = ""
10046040-366 = "Ай-ай-ай...?!"
10046040-367 = ""
10046040-370 = "Т-Ты меня убить пытаешься?!"
10046040-371 = "Думаешь, от одного прикосновения можно умереть?"
10046040-372 = ""
10046040-375 = ""
10046040-376 = "А, Сенсей. И Мика."
10046040-377 = "[s11] «Что вы делаете?»\n[s12] «Похоже, вам весело.»"
10046040-380 = "Очевидно же, занимаемся йогой. Это одно из моих маленьких увлечений."
10046040-381 = "Да. Сэя сказала, что мне стоит попробовать..."
10046040-382 = "Я не ожидала, что Нагиса так охотно за мной последует."
10046040-383 = "О, и Мика, как там обед? Мне показалось, некоторое время назад пахло дымом."
10046040-384 = ""
10046040-386 = ""
10046040-387 = "Ну... да! Запустить всё заняло немного времени, но мы только что начали жарить."
10046040-388 = "Простите, что заставили ждать! Вы обе, наверное, ужасно голодны. ★"
10046040-389 = "...? Разве ты не говорила, что у нас будет барбекю? Оно не должно готовиться так долго..."
10046040-390 = ""
10046040-392 = ""
10046040-393 = "А, тогда."
10046040-394 = ""
10046040-397 = ""
10046040-398 = ""
10046040-399 = "Не могла бы ты поставить чайник?"
10046040-400 = "...А?"
10046040-401 = "Да, раз обед задержался, когда мы закончим, уже наступит время послеобеденного чая."
10046040-402 = "О-Ох... Прямо сейчас?"
10046040-403 = ""
10046040-405 = ""
10046040-407 = "Будь так добра."
10046040-408 = ""
10046040-410 = ""
10046040-411 = ""
