[translation]
1011905-1 = "Тьма перед рассветом"
1011905-2 = "Я решил встретиться с Нагусой и патрулировать улицы Хяккияко, отправляя домой всех полуночных нарушителей порядка."
1011905-3 = "Район не такой уж большой, поэтому я думал, что это не займёт много времени, но..."
1011905-4 = "...вскоре мы столкнулись с неожиданными трудностями."
1011905-6 = "Простите, почему вы так поздно слоняетесь по парку?"
1011905-7 = "...Не ваше дело."
1011905-8 = "Разумеется, как студент вы имеете право здесь находиться..."
1011905-9 = "...но место это отдалённое и в такой час может быть небезопасным. Если вам необходимо быть вне дома, лучше выберите семейный ресторан или кафе."
1011905-10 = "Не-а. Там могу встретить сестру."
1011905-11 = "...Сестру?"
1011905-12 = ""
1011905-13 = "[ns] «У тебя дома проблемы с сестрой?»"
1011905-14 = "...Не-а."
1011905-16 = "И я ТОЧНО не убежала непонятно куда только потому, что поссорилась с ней!"
1011905-17 = "[s] «Если хочешь поговорить об этом, мы с радостью тебя выслушаем.»"
1011905-19 = "Мы дали сбежавшей из дома студенту несколько советов."
1011905-20 = ""
1011905-21 = ""
1011905-22 = ""
1011905-23 = ""
1011905-25 = "Хм."
1011905-26 = "А-А? К-Кто здесь?"
1011905-27 = "Чем именно вы занимаетесь?"
1011905-28 = "Эм, стройкой. Мы тут строим."
1011905-29 = "Работаем с канализацией — то есть с водопроводом!"
1011905-30 = "Странно. Я не слышала ни о каких работах с водопроводом в этом районе."
1011905-31 = "И уж точно ничего не было запланировано на такой час ночи."
1011905-32 = ""
1011905-34 = ""
1011905-35 = "Не возражаете, если я проверю ваше оборудование?"
1011905-36 = "Угх..."
1011905-37 = ""
1011905-39 = ""
1011905-41 = ""
1011905-42 = "Чёрт, нас раскусили! Бежим!"
1011905-43 = "Стойте — здесь ещё ходят Хяккарёран?!"
1011905-44 = "Вот и накрылся наш план со взрывчаткой..."
1011905-45 = ""
1011905-47 = ""
1011905-48 = ""
1011905-49 = ""
1011905-50 = "О, далеко вы не уйдёте."
1011905-53 = ""
1011905-61 = ""
1011905-64 = "Мы помешали банде Моурё устроить неприятности."
1011905-65 = ""
1011905-66 = "[ns] «Привет. Тебе разве не пора домой?»"
1011905-67 = "Домой? *ик* Где могу расстянуться под н-небом — там и мой дом!"
1011905-68 = "ВЕСЬ ЭТОТ МИР — мой дом. В чём проблема-то?"
1011905-69 = "[s1] «Прости, но если ты будешь лежать здесь, то станешь мешать людям.»\n[s2] «Если хочешь, я могу проводить тебя до ближайшего отделения Валькирии.»"
1011905-72 = "Что?! Сдашь меня этим соплячкам?!"
1011905-73 = "Без боя я не сдамся! Давайте!"
1011905-74 = "...Сенсей, хотите, я «разберусь» с этой?"
1011905-75 = "[s] «Н-нет...!»"
1011905-77 = "Мы вывели пьяную из опасного места. Это заняло больше времени, чем ожидалось."
1011905-79 = "[ns] «Я вымотался...»"
1011905-80 = "Мы хорошо поработали, Сенсей."
1011905-81 = "Сегодняшняя ночь выдалась тяжелее обычного."
1011905-82 = "И уже далеко за полночь... если немного подождать, увидим рассвет."
1011905-83 = "[s] «Тогда вернёмся в главное здание?»"
1011905-84 = "Подождите немного, Сенсей."
1011905-85 = "Сейчас самая тёмная часть ночи — луна уже зашла."
1011905-86 = "По дороге вы можете споткнуться и подвернуть лодыжку. Давайте отдохнём, пока тьма не рассеется."
1011905-87 = "К тому же я и сама не против передохнуть."
1011905-89 = "По предложению Нагусы мы сели на веранде ближайшей чайной и стали ждать рассвета."
1011905-91 = "...Так тихо."
1011905-92 = "Днём эта чайная полна шумных посетителей. А сейчас... будто всё вокруг перестало дышать."
1011905-93 = ""
1011905-95 = ""
1011905-96 = "Я делаю это не впервые."
1011905-97 = "Я имею в виду — отдыхаю здесь и жду рассвета после долгого патруля."
1011905-98 = "[s] «Тебе чем-то нравится это место?»"
1011905-99 = "...Ничем особенным."
1011905-100 = "Хотя кое-чем. Здесь удобно прятаться..."
1011905-101 = "...от моего страха темноты."
1011905-104 = "― [log=나구사ND]Этот миг перед самым восходом солнца...[/log][wa:1080]"
1011905-105 = "― [log=나구사ND]время, когда тьма господствует.[/log][wa:4040]"
1011905-108 = "― [log=나구사ND]Этой беспросветной тьмы... я всегда боялась.[/log][wa:1060]"
1011905-111 = "― [log=나구사ND]Мне не хватает света, чтобы рассеять эту тьму.[/log][wa:2500]"
1011905-112 = "― [log=나구사ND]И я не могла... выдержать...[/log][wa:5450]"
1011905-115 = "― [log=나구사ND]пока ночь не пройдёт.[/log][wa:1450]"
1011905-118 = "― [log=나구사ND]Мне оставалось лишь прятаться,[/log]"
1011905-119 = "― [log=나구사ND]притворяясь кем-то другим, растворяясь в тенях и изображая спокойствие.[/log][wa:4410]"
1011905-122 = "― [log=나구사ND]Но больше нет.[/log][wa:2210]"
1011905-125 = "― [log=나구사ND]Я знаю, что со временем ночь пройдёт...[/log][wa:20]"
1011905-126 = "― [log=나구사ND]и моя тень ляжет на землю.[/log][wa:4950]"
1011905-129 = "― [log=나구사ND]Поэтому...[/log]"
1011905-132 = "― [log=나구사ND]я объявляю своё имя миру духов. [/log][wa:2480]"
1011905-135 = "― [log=나구사ND]...Я президент Совета урегулирования Хяккарёран...[/log][wa:2310]"
1011905-136 = "― [log=나구사ND]Горё Нагуса![/log][wa:2190]"
1011905-139 = "А вот и солнце взошло."
1011905-140 = "...Та ещё была ночь, правда?"
1011905-141 = "[s] «Да, очень беспокойная.»"
1011905-142 = "Ночь, когда Моурё бесчинствовали во всевозможных странных обличьях..."
1011905-143 = "Вполне соответствует названию «Хяккияко» — «Ночной парад сотни демонов»."
