[translation]
32100-1 = "Эпизод 10;Второй экзамен, часть 1"
32100-2 = "Думаю, сегодня мы сделали всё, что собирались!"
32100-3 = "Теперь мы готовы к завтрашнему второму экзамену."
32100-4 = "Мы уже неделю на подготовке, и я уверена, что нам по силам сдать на отлично."
32100-5 = "Ладно..."
32100-6 = "Именно!"
32100-7 = "Конечно!"
32100-8 = "[s] «Полностью согласен.»"
32100-9 = ""
32100-11 = ""
32100-13 = "А как только сдадим, официально выпустимся из Клуба дополнительных занятий."
32100-14 = "Не дадим пропасть всем нашим трудам!"
32100-15 = "Завершим время, проведённое вместе, на высокой ноте!"
32100-16 = ""
32100-18 = ""
32100-19 = "Я об этом не думала, но ты права. Когда мы все сдадим, нам придётся разойтись."
32100-20 = "П-Почему ты вдруг стала такой сентиментальной?!"
32100-21 = "Нам ведь было так весело вместе. Тебе грустно, что всё закончится, Азуса?"
32100-22 = "Нет. Всё когда-нибудь заканчивается. У любого начала есть конец."
32100-23 = "Не говори так безапелляционно. Даже когда клуб распустят, мы ведь никуда не денемся."
32100-24 = "Мы останемся студентами Тринити и сможем встречаться, когда захотим."
32100-25 = "Д-Да! Можешь в любой момент заглянуть ко мне в комнату Отряда правосудия."
32100-26 = "О."
32100-27 = ""
32100-29 = ""
32100-30 = "Это же не финал подростковой драмы, после которого мы больше никогда не увидимся. А о новых встречах подумаем, когда сдадим экзамены."
32100-31 = "Давайте сегодня ляжем пораньше, чтобы выспаться перед завтра?"
32100-32 = "Кстати, где будет экзамен? В главном корпусе академии?"
32100-33 = "А, точно. Я ещё не прочитала объявление."
32100-34 = "Сейчас. Нужно открыть на телефоне доску объявлений академии и..."
32100-35 = "А?"
32100-36 = "Ч-что?!"
32100-37 = "Что-то не так?"
32100-38 = "Ч-что происходит?!"
32100-39 = "Посмотрим... «Об изменениях в проведении второго контрольного экзамена Клуба дополнительных занятий»."
32100-40 = "«Объём экзаменационных заданий будет примерно втрое больше, чем на первом экзамене»."
32100-41 = "Что?! Почему?!"
32100-42 = "«Кроме того, проходной балл повышен с 60 до 90»."
32100-43 = "Д-Даже я никогда не набирала столько..."
32100-44 = "Что вообще происходит?!"
32100-45 = "Похоже, объявление опубликовали вчера поздно вечером. Зачем внезапно менять столько всего за день до экзамена?"
32100-46 = "[s] «Это могла сделать только одна особа.»"
32100-48 = ""
32100-50 = "..."
32100-51 = "Скорее всего. Видимо, Нагиса каким-то образом узнала, как хорошо мы написали последний пробный экзамен."
32100-52 = "Так она даёт нам понять: любой ценой найдёт повод нас исключить."
32100-53 = "Исключить?"
32100-54 = "Что это за разговоры об исключении?! О чём вы?!"
32100-55 = "[s] «(Они тоже заслуживают знать правду.)»"
32100-56 = "Верно. Обсудим это позже, но в объявлении есть кое-что ещё."
32100-57 = "Время и место экзамена тоже изменили. Новый адрес... «Район Геенны, зона 15-77. Заброшенное здание, первый этаж...»"
32100-58 = "Район Геенны?"
32100-59 = "Почему мы сдаём экзамен в Геенне?!"
32100-60 = "Не может быть! Зачем отправлять туда клуб Тринити?!"
32100-61 = "Полагаю, если мы не подчинимся, нам автоматически поставят незачёт."
32100-62 = "И-И нас за это исключат?! Почему мне никто раньше не сказал?!"
32100-63 = "..."
32100-64 = "[s] Объяснить правду."
32100-67 = "Нас исключат, если мы провалим три экзамена?"
32100-68 = "...Понятно."
32100-69 = "Прости, что мы не рассказали раньше. Я не думала, что всё зайдёт так далеко..."
32100-70 = "Н-Но если меня исключат, я никогда не вернусь в Отряд правосудия!"
32100-71 = "Прости меня, Кохару."
32100-72 = "Спасибо, что объяснили. Думаю, нам пора выдвигаться."
32100-73 = "К-Куда? Почему сейчас?"
32100-74 = "Время экзамена изменили. Он начнётся в три часа ночи. Чтобы успеть, нужно выходить прямо сейчас."
32100-75 = "В три часа УТРА?! Серьёзно?!"
32100-76 = "Сейчас некогда удивляться и возмущаться. Оставим это на потом."
32100-77 = "Жалобы на поставленные перед нами преграды ничего не изменят. Я намерена бороться до последнего."
32100-79 = "А..."
32100-80 = "Ой-ой..."
32100-81 = "Она права. Мы не можем просто сдаться."
32100-82 = "Будем считать это ещё одной весёлой полуночной прогулкой! Никогда раньше не ходила в Геенну ради экзамена."
32100-83 = "Вы обе с ума сошли? Всё становится слишком странным!"
32100-85 = "Выдвигаемся немедленно. Не забудьте оружие."
32100-86 = "Мы туда сражаться идём? Я думала, экзамен сдавать!"
32100-87 = "Район Геенны считается куда опаснее Тринити, а Префектурная команда наверняка занята подготовкой к договору."
32100-88 = "Вы шутите... Как до такого дошло?"
32100-89 = ""
32100-91 = ""
32100-94 = "Отдайте приказ, Сенсей."
32100-95 = "[s] «Вооружайтесь. Вперёд!»"
32100-98 = "Задворки Геенны"
32100-99 = "За этим поворотом мы окажемся в самом сердце района Геенны. Не самое приветливое место из всех, где мне доводилось бывать..."
32100-100 = "Глядите, свеженькие! Вас я тут раньше НЕ видела!"
32100-101 = "Чего спешите? Куда так торопитесь?"
32100-102 = "Ну прямо как по заказу..."
32100-103 = "М-Мы идём сдавать экзамен."
32100-104 = "Чего ты несёшь? Какой ещё экзамен?"
32100-105 = "Я-Я понимаю, как это звучит..."
32100-106 = "По нашей территории ночью просто так не гуляют! Вы кем себя возомнили?!"
32100-107 = "Постойте. Это форма Тринити?"
32100-108 = "Из той богатой академии, где одни принцессы? Значит, можно похитить их и потребовать выкуп?"
32100-109 = "Вот это дело!"
32100-110 = "Я боялась, что так и будет..."
32100-111 = "Пустая трата времени."
32100-112 = ""
32100-114 = ""
32100-115 = ""
32100-117 = "Лови."
