[translation]
32100-1 = "Episódio 10;2º Exame Especial de Aptidão Acadêmica (1)"
32100-2 = "Bom trabalho hoje também, pessoal!"
32100-3 = "Amanhã finalmente é o 2º Exame Especial de Aptidão Acadêmica!"
32100-4 = "Com essa semana de acampamento de estudos, com certeza adquirimos habilidade suficiente para passar com folga!"
32100-5 = "Sim."
32100-6 = "Sim♡"
32100-7 = "Isso aí!"
32100-8 = "[s] \"Sim, vocês realmente se esforçaram muito.\""
32100-13 = "Agora é só passar direitinho no exame... e nos formarmos com orgulho no Clube de Aulas de Reforço."
32100-14 = "Vamos lá provar de uma vez por todas que todo o nosso estudo até agora não foi em vão!"
32100-15 = "E, no final, vamos todas nos despedir com um sorriso...!"
32100-19 = "...É mesmo. Se passarmos, já vai ser a nossa despedida..."
32100-20 = "E-Ei, Azusa!? Por que você ficou toda melancólica assim do nada!?"
32100-21 = "Entendo♡ Incluindo o acampamento, no fim das contas foi tudo muito divertido, não foi?"
32100-22 = "...Sim. Não, mas ainda assim, onde há um encontro, há também uma despedida. Tudo é em vão."
32100-23 = "...Não acho que precise pensar de forma tão extrema. Ninguém aqui, incluindo você, Azusa-chan, vai embora para algum lugar depois que o exame acabar, não é?"
32100-24 = "Mesmo que o Clube de Aulas de Reforço seja desfeito, todas nós continuamos na mesma escola. Se quisermos nos ver, podemos nos encontrar a qualquer hora."
32100-25 = "O-Olha! Eu estou sempre na sala do Comitê de Justiça! S-Se tiver um tempo livre, é só aparecer lá...?"
32100-26 = "...Sim."
32100-30 = "Bom, eu sinto a mesma coisa, mas, por enquanto, passar no exame vem em primeiro lugar, ou melhor, parece que de repente entramos no final de um drama adolescente..."
32100-31 = "E-Enfim. Vamos descansar mais cedo hoje e nos preparar para o exame de amanhã."
32100-32 = "Por falar nisso, o local do exame de amanhã é o mesmo da outra vez?"
32100-33 = "Ah, pensando bem, ainda não olhei o comunicado."
32100-34 = "Deixa eu ver o mural de avisos da Trinity..."
32100-35 = "...?"
32100-36 = "...Quê? Quêê!?"
32100-37 = "Hifumi-chan? Aconteceu alguma coisa?"
32100-38 = "Quê, mentira!? Só pode ser mentira, né!?"
32100-39 = "Err... \"Comunicado sobre alterações referentes ao '2º Exame Especial de Aptidão Acadêmica' do Clube de Aulas de Reforço\"...?"
32100-40 = "\"O conteúdo do exame será ampliado em cerca de três vezes em relação ao anterior\"...?"
32100-41 = "Hãã!? Como assim!?"
32100-42 = "\"Além disso, a nota de corte será elevada de 60 para 90 pontos\"...?"
32100-43 = "M-Mas nem eu consegui passar dos 90 pontos até agora..."
32100-44 = "Q-Que história é essa...?"
32100-45 = "Parece que postaram isso ontem de repente... Logo na véspera do exame, fazerem uma coisa dessas..."
32100-46 = "[s] \"Isso é...\""
32100-50 = "..."
32100-51 = "...Entendo. Parece que a Nagisa-san descobriu de alguma forma os resultados dos nossos simulados."
32100-52 = "Que método mais descarado... Ela quer mesmo nos expulsar a qualquer custo, pelo visto."
32100-53 = "...Expulsar?"
32100-54 = "Quê, e-expulsar!? Espera, como assim!?"
32100-55 = "[s] (...De qualquer forma, talvez já seja hora de contar para todas.)"
32100-56 = "Eu já estava pensando em contar sobre isso para vocês em breve, mas... antes disso, há outras partes que também foram alteradas."
32100-57 = "Ah, o local e o horário do exame também mudaram... O local do exame é \"1º andar das ruínas na Rua 77, Área 15 do Distrito Autônomo de Gehenna\"..."
32100-58 = "...Gehenna?"
32100-59 = "V-Vamos fazer o exame em Gehenna!?"
32100-60 = "P-Por quê!? Por que cargas d'água temos que fazer um exame da Trinity em Gehenna!?"
32100-61 = "Se não formos, seremos consideradas ausentes e reprovadas, não é...?"
32100-62 = "I-Isso também, mas o que foi aquilo sobre expulsão agora há pouco!? É a primeira vez que ouço falar disso!"
32100-63 = "..."
32100-64 = "[s] Explicar tudo desde o começo."
32100-67 = "Se reprovarmos três vezes no exame, seremos expulsas...!?"
32100-68 = "...Entendo."
32100-69 = "D-Desculpem por ter escondido isso... Eu jamais imaginei que as coisas chegariam a esse ponto..."
32100-70 = "O-O que eu faço...!? Se eu for expulsa, não vou poder voltar para o Comitê de Justiça...!"
32100-71 = "Isso..."
32100-72 = "...Entendi a situação. De qualquer forma, vamos partir."
32100-73 = "Quê, quêê!?"
32100-74 = "Está escrito que o horário do exame é às \"3 horas da madrugada\". Se não sairmos agora, não vamos chegar a tempo."
32100-75 = "Ah, é verdade...!?"
32100-76 = "Seja para nos surpreendermos, nos irritarmos ou nos desesperarmos... não será tarde demais deixar isso para depois de fazermos o exame."
32100-77 = "Reclamar da quantidade de obstáculos não vai mudar a situação. O importante é, mesmo assim, lutar até o fim."
32100-79 = "Auu..."
32100-80 = "U-Uuu..."
32100-81 = "...É verdade. A Azusa-chan tem razão. Agora só nos resta agir."
32100-82 = "Ainda assim, fufu... Parece interessante. Ir até Gehenna para fazer uma prova é uma experiência inédita para mim♡"
32100-83 = "Aaah, que droga, nada disso faz o menor sentido! E-Enfim, a gente vai mesmo, né!?"
32100-85 = "Vamos partir imediatamente. Não esqueçam seus equipamentos."
32100-86 = "Equipamentos!? Armas de fogo!?"
32100-87 = "Pois é. O Distrito Autônomo de Gehenna por si só já é uma terra sem lei, e como estamos às vésperas da assinatura do tratado, o Comitê Disciplinar provavelmente não está dando conta de tudo..."
32100-88 = "A-Auu... P-Por que as coisas tinham que ficar assim...?"
32100-94 = "Vamos, Sensei."
32100-95 = "[s] \"Sim. Então, partimos assim que estiverem prontas.\""
32100-98 = "Gehenna - Favelas"
32100-99 = "A partir daqui já é o Distrito Autônomo de Gehenna..."
32100-100 = "Hmm? Ora, ora, temos umas caras desconhecidas por aqui, hein?"
32100-101 = "Que frieza ignorar a gente assim. Pra onde estão indo com tanta pressa?"
32100-102 = "Uau, uma abordagem bem clássica de \"terra sem lei\", hein."
32100-103 = "E-Err, nós estamos a caminho de um exame..."
32100-104 = "...Hã? Exame? Tá bem da cabeça?"
32100-105 = "B-Bom, era de se esperar essa reação..."
32100-106 = "Bom, seja qual for o motivo, pra andar por essas bandas vocês precisam da nossa permissão!"
32100-107 = "Hm? Olhando bem, esse uniforme... não é da Trinity?"
32100-108 = "...Sério mesmo. Fiu-fiu, o que umas madames ricas estão fazendo num lugar desses? Ué, então quer dizer que se a gente sequestrar essas garotas, vamos poder pedir um belo dum resgate?"
32100-109 = "Opa, ótima ideia!"
32100-110 = "S-Sabia que ia acabar nisso de novo..."
32100-111 = "...Perda de tempo."
32100-117 = "Só nos resta abrir caminho à força."
