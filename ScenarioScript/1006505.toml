[translation]
1006505-1 = "Идеальное сопровождение Кахо"
1006505-2 = "Торговый квартал Хяккияко №23"
1006505-4 = ""
1006505-5 = "А, Сенсей. Я здесь."
1006505-6 = "[s] «Привет, Кахо. Спасибо, что снова встретилась со мной.»"
1006505-8 = "[ns1] «В прошлый раз всё стало слишком суматошно по разным причинам.» \n[ns2] «Но сегодня я буду ждать экскурсии с нетерпением.»"
1006505-11 = ""
1006505-13 = ""
1006505-14 = "...!"
1006505-15 = "Я понимаю."
1006505-16 = "Я решила извлечь урок из прошлого раза и сегодня выложиться по полной, но..."
1006505-17 = "Похоже, я слишком легкомысленно к этому отнеслась."
1006505-18 = "[s] «А...?»"
1006505-19 = "Сенсей, пожалуйста, доверьте мне весь сегодняшний день."
1006505-20 = "Я, Куваками Кахо, обещаю устроить для вас лучшую экскурсию, на какую только способна..."
1006505-21 = "Она будет идеальной!"
1006505-22 = ""
1006505-25 = ""
1006505-26 = "Тогда пойдём!"
1006505-27 = "[s] «Эй, я-я вовсе не хотел так на тебя давить... П-прости?!»"
1006505-28 = ""
1006505-30 = ""
1006505-33 = "Так началось сопровождение Кахо."
1006505-34 = "Мы отправились на экскурсию по Хяккияко под руководством Кахо."
1006505-36 = "И первым местом, куда мы прибыли, было..."
1006505-37 = "Если бы меня спросили, о чём в первую очередь стоит подумать во время экскурсии по Хяккияко..."
1006505-38 = "Я бы без колебаний ответила: о его туристической привлекательности."
1006505-39 = ""
1006505-41 = ""
1006505-42 = "Особенно о пейзаже с этой обзорной площадки..."
1006505-43 = "Этот вид, откуда можно увидеть и Древо, и улицы Хяккияко, — поистине лучшее, что может показать Хяккияко."
1006505-44 = "Сенсей, вы знаете о Древе Божеств Хяккияко?"
1006505-45 = "[s3] «Да, вообще-то довольно хорошо. Оно довольно известное.»\n[s4] «Эм, не могу сказать, что знаю о нём подробно...»"
1006505-46 = "Как и ожидалось! Хи-хи."
1006505-47 = "Оно настолько известно, что даже [USERNAME] Сенсей из Шале знает о нём..."
1006505-48 = "Должна признать, я очень горжусь тем, что у нас есть."
1006505-49 = "И правда, густо цветущая сакура не только прекрасна, но и кое-что символизирует здесь, в Хяккияко."
1006505-50 = "Каждый год, когда сакура на Древе Божеств впервые расцветает, начинается знаменитый Фестиваль цветения сакуры Хяккияко."
1006505-51 = "Если представится возможность, было бы здорово, если бы вы присоединились к нам и насладились фестивалем, Сенсей..."
1006505-52 = "О, и я не знаю, слышали ли вы уже, но с этим деревом связана одна история..."
1006505-53 = ""
1006505-55 = ""
1006505-56 = ""
1006505-57 = ""
1006505-58 = "Вот как."
1006505-59 = ""
1006505-61 = ""
1006505-62 = "Тогда позвольте вкратце объяснить."
1006505-63 = "Говорят, Древо Божеств Хяккияко было посажено очень давно..."
1006505-64 = "И под «давно» я имею в виду ещё до того, как Хяккияко сформировала союз."
1006505-65 = "А значит, у этой сакуры есть хранитель, столь же древний, как и само дерево..."
1006505-66 = ""
1006505-68 = ""
1006505-69 = ""
1006505-70 = ""
1006505-72 = "Пока я слушал страстный рассказ Кахо о легендах и сказаниях, связанных с этим местом..."
1006505-76 = "О... Сенсей, вы голодны?"
1006505-77 = "[s] «А, точно. Наверное, потому что я так долго ходил.»"
1006505-78 = "Очень вовремя."
1006505-79 = ""
1006505-81 = ""
1006505-82 = "Давайте попробуем тануки-окономияки — знаменитое блюдо Хяккияко!"
1006505-83 = "Его я могу рекомендовать с полной уверенностью!"
1006505-84 = ""
1006505-86 = "После туристических достопримечательностей мы отправились пробовать разные фирменные блюда Хяккияко."
1006505-88 = ""
1006505-89 = ""
1006505-91 = ""
1006505-92 = ""
1006505-93 = "Сияя ярче обычного, Кахо продолжила сопровождать меня по городу."
1006505-95 = "И спустя несколько часов экскурсии по Хяккияко..."
1006505-98 = "Дальше я отведу вас к..."
1006505-99 = ""
1006505-103 = ""
1006505-104 = "[ns] «Хм? Там собрались люди. Ты знаешь, что происходит?»"
1006505-105 = "Это ведь...?"
1006505-106 = ""
1006505-108 = ""
1006505-110 = "Скоро начнётся флешмоб-кабуки от группы «Бамбуковый побег и Гриб»!"
1006505-111 = "Серьёзно? Каждый их ролик легко набирает миллион просмотров! И это будет прямо здесь?!"
1006505-112 = "Где?! Где именно?!"
1006505-113 = ""
1006505-116 = "...«Бамбуковый побег»... и «Гриб»!!"
1006505-117 = "[s] «Кахо...? Что такое?»"
1006505-118 = ""
1006505-120 = ""
1006505-121 = "А-а, ничего..."
1006505-122 = ""
1006505-124 = ""
1006505-125 = "П-п-пойдём скорее к следующему месту!"
1006505-126 = ""
1006505-128 = ""
1006505-129 = "Но после этого Кахо стала вести себя немного странно."
1006505-132 = "Что? Новый фильм про линчевателя Шиба-ину Ван-Ван?!"
1006505-133 = ""
1006505-135 = ""
1006505-136 = "Эй, срочные новости! Ребята из Морё устроили импровизированную битву хайку в восточной части района после борьбы за влияние!"
1006505-137 = "Битва... хайку...!"
1006505-139 = "Йо! Только не удивляйся... ограниченный поп-ап магазин с новыми товарами Хяккияко...!"
1006505-140 = "Ограниченный... поп-ап магазин...!"
1006505-141 = "[s] «...Кахо...?»"
1006505-142 = ""
1006505-144 = ""
1006505-145 = "Н-н-нет, да! Я...!"
1006505-146 = "Я сейчас сопровождаю вас, поэтому я... не... думаю... ни о чём другом..."
1006505-147 = "Я не думаю о том, чтобы пойти всё это посмотреть или... что-нибудь упустить..."
1006505-148 = "В продаже есть лимитированный мерч с принцессой!"
1006505-149 = ""
1006505-151 = "!!"
1006505-152 = "Если упустите его, придётся ждать минимум полгода!"
1006505-153 = "...?!"
1006505-154 = ""
1006505-156 = ""
1006505-157 = ""
1006505-160 = "[ns] «К-Кахо! Ты в порядке?»"
1006505-163 = "После того как Кахо рухнула, мы решили немного передохнуть."
1006505-167 = "[ns] «Тебе уже лучше?»"
1006505-168 = "*вздох* Мне так жаль... Сенсей..."
1006505-169 = "Я поддалась искушению. Теперь вы увидели меня в таком постыдном виде..."
1006505-170 = "Хотя я сама поклялась сопровождать вас..."
1006505-171 = "Так что даже если это представление, которое после сегодняшнего дня я больше никогда не увижу... или товар, который больше никогда не смогу купить..."
1006505-172 = "...товар... который я больше никогда... который я должна быть способна отпустить..."
1006505-173 = "...Это... неважно...!"
1006505-174 = "[s] «Н-не нужно так себя мучить...»"
1006505-175 = "Как вице-президент клуба Инь-Ян, я прошу прощения за то, что снова вас разочаровала."
1006505-176 = "Если так... единственный способ, которым я, Куваками Кахо, могу по-настоящему перед вами извиниться..."
1006505-177 = "Это... поступить на эксклюзивную службу только в Шале..."
1006505-178 = "[s] «Эй, я же сказал, всё нормально! И я вообще думаю иначе.»"
1006505-179 = "...Что?"
1006505-180 = "[s5] «Всё, что привлекало твоё внимание...»\n[s6] «Это ведь всё то, что тебе нравится, верно?»"
1006505-183 = "Это... Да."
1006505-184 = "...Всё это — культура Хяккияко, которой я горжусь... я бы так сказала."
1006505-185 = "Мне нравилось всё, что мы видели... Но я не могу тратить ваше время впустую..."
1006505-186 = "[s] «Тогда познакомь меня со всем этим.»"
1006505-187 = ""
1006505-189 = ""
1006505-190 = "...Вы... хотите узнать об этом потому, что мне это нравится...?"
1006505-191 = "Хотя обычные достопримечательности и еда тоже хороши, вы имеете в виду, что хотите узнать о том, что нравится лично мне...?"
1006505-192 = "[s7] «Верно. Я думал, что всё это тоже часть Хяккияко...»\n[s8] «И ты тоже хотела мне это показать. Разве нет?»"
1006505-195 = "...С-Сенсей..."
1006505-196 = "...Вы правы, Сенсей."
1006505-197 = "Всё, что вы упомянули, тоже является частью Хяккияко..."
1006505-198 = "Как скажешь..."
1006505-199 = "Я, Куваками Кахо... сделаю всё возможное, чтобы стать вашим проводником, Сенсей!"
1006505-201 = "После этого Кахо показала мне всё то, что ей самой нравилось в Хяккияко."
1006505-202 = "Там были новый фильм о дружинниках, уличная битва хайку... а ещё временные магазины и много чего другого..."
1006505-205 = "Не успел я опомниться, как уже наступил вечер."
1006505-206 = "...поэтому у их канала не так много подписчиков и просмотров, но видео у них очень творческие!"
1006505-207 = "И каждый раз, когда я их смотрю, они меня впечатляют!"
1006505-208 = ""
1006505-210 = ""
1006505-211 = "Так что в следующий раз...!"
1006505-212 = ""
1006505-214 = ""
1006505-215 = "...Ах."
1006505-216 = "...Ах. П-простите."
1006505-217 = "Я опять начала говорить только о том, что интересно мне..."
1006505-218 = "[s9] «Не переживай.»\n[s10] «Мне понравилась сегодняшняя экскурсия.»"
1006505-221 = "Правда...? Тогда я рада..."
1006505-222 = "[s] «Ты ведь очень любишь Хяккияко, да? Как получилось, что ты так сильно её полюбила?»"
1006505-223 = "Ну..."
1006505-224 = "[s] «А, впрочем, можешь не отвечать, если не хочешь.»"
1006505-225 = "Эм, нет, я вовсе не пытаюсь это скрывать."
1006505-226 = "Мне кажется, всё, что я сегодня показала вам в Хяккияко... по-своему особенное и удивительное... каждая мелочь."
1006505-229 = "Если рассматривать всё по отдельности, возможно, оно и не выглядит чем-то выдающимся..."
1006505-230 = "А иногда даже может показаться совсем незначительным..."
1006505-231 = "Многие не понимают, почему я настолько увлечена всем этим..."
1006505-232 = "Но для меня каждая из этих вещей особенная."
1006505-234 = "Люди, которым нравится одно и то же, собираются вместе и начинают мечтать об одном..."
1006505-235 = "Мы стали двигаться вперёд в надежде, что другие тоже смогут полюбить это так же, как мы..."
1006505-236 = "Вот что такое Хяккияко. Думаю, именно в этом и заключается культура нашей академии."
1006505-237 = "[s] «То есть это результат общей мечты всех людей.»"
1006505-238 = "Да... Это то, что было создано сердцами множества людей. Кто-то плачет, кто-то улыбается, люди знакомятся, мечтают вместе..."
1006505-239 = "А потом ещё и становятся друзьями..."
1006505-240 = "Мне кажется, всё это невероятно прекрасным и дорогим."
1006505-241 = "Поэтому я так люблю культуру Хяккияко и хочу рассказать о ней как можно большему числу людей."
1006505-242 = "Такого ответа будет достаточно?"
1006505-243 = "[s] «Ага. Более чем.»"
1006505-247 = "Спасибо, что провели сегодняшний день со мной, Сенсей."
1006505-248 = "Если честно, я всё думаю, хорошо ли справилась в роли вашего сопровождающего и можно ли было что-то сделать лучше..."
1006505-249 = "[s] «Нет, мне понравилось ходить с тобой на свидание, Кахо.»"
1006505-250 = "...Что?"
1006505-251 = "С-С-Свидание...?"
1006505-252 = ""
1006505-254 = ""
1006505-255 = "[ns] «...Кахо...?»"
1006505-256 = "Я-я имею в виду... Эм..."
1006505-257 = ""
1006505-259 = ""
1006505-262 = "......Пш-ш-ш."
1006505-263 = "[ns] «К-Кахо?»"
1006505-264 = ""
1006505-267 = "Я усадил покрасневшую Кахо отдохнуть, и какое-то время мы вместе смотрели на вечерние улицы Хяккияко."
