[translation]
1301003-1 = "Бесценно"
1301003-2 = "Офис Семинар в Миллениум"
1301003-3 = "Вот ты где, Сенсей."
1301003-4 = "Сегодняшняя тема касается финансов Миллениума, поэтому с другими студентами её особо не обсудишь. Я ждала твоего прихода."
1301003-5 = "Я размышляла над этим весь день, но подходящего решения так и не нашла."
1301003-6 = "Можешь посмотреть на эту картинку?"
1301003-8 = "На что это похоже?"
1301003-9 = ""
1301003-10 = "[ns1] «Детские каракули.»\n[ns2] «Удав, проглотивший слона!»\n[ns3] «Пятна от кофе...?»"
1301003-11 = "*вздох* Значит, ты согласен."
1301003-12 = "Хм. Никогда не смотрела на это с такой стороны."
1301003-13 = "Я понимаю, что это абстракция, но можно было проявить хоть немного такта?"
1301003-14 = "Перейду к сути. Эту абстрактную картину нам оставил в залог предприниматель, задолжавший школе Миллениум."
1301003-15 = "По его словам, её написал гениальный художник Мацумото из художественной академии Вайлдхант, и стоит она минимум 100 миллионов иен."
1301003-16 = "Но сколько ни смотрю, всё равно кажется, что это каракули малыша."
1301003-17 = "[s] «Некоторое искусство именно такое.»"
1301003-18 = "Я знаю, но всё равно не могу избавиться от разочарования. Вот и всё."
1301003-19 = "Даже с учётом всех материалов производство не могло стоить больше 10 000 иен."
1301003-20 = "Но только потому, что художник якобы знаменит, цена вырастает в тысячи раз...? Не понимаю, почему так."
1301003-21 = "Впрочем, я всего лишь казначей Семинар. Оценивать искусство — не моя работа. Мне важно лишь понять, годится ли эта картина как залог."
1301003-22 = "[s] «Ценность искусства нельзя посчитать обычной математикой.»"
1301003-23 = "Если её нельзя вычислить формулой, тогда КАК её вообще определяют?"
1301003-24 = "Ты хочешь сказать, что при оценке искусства нужно учитывать труд и творческий замысел художника?"
1301003-25 = "Интересно... Наверное, я бы тоже разозлилась, если бы полностью рабочий робот и куча металлолома считались одинаково ценными лишь потому, что весят одинаково."
1301003-26 = "Но мы снова вернулись к началу. Поскольку я не умею оценивать искусство, хочу, чтобы эту картину оценил ты."
1301003-27 = "Как думаешь, сколько она стоит?"
1301003-29 = "[s] «Ноль иен.»"
1301003-30 = "...Что? Как такое возможно?"
1301003-31 = "В художественной академии Вайлдхант нет знаменитого художника по имени Мацумото.#nПолучается, эта картина просто подделка?"
1301003-32 = "Тогда почему ты не сказал это сразу?!"
1301003-34 = "Хотя картина ничего не стоит, мы всё равно решили её повесить, потому что хранить больше негде."
