[translation]
51050-1 = "Episódio 5;A Garota Autoproclamada Elite Entra em Cena!"
51050-5 = "Yukari, Yukari...#nHmm... Parece que já ouvi esse nome em algum lugar."
51050-6 = "Yukari da Hyakkaryouran... Será que é da família Kadenokouji...?"
51050-7 = "[s] \"Você é a garota de antes...?\""
51050-12 = "Ora? O Sensei da Schale... O que faz por aqui?"
51050-16 = "Ah...! Eu acabei de perceber."
51050-17 = "Você me ajudou agora há pouco já prevendo este exato desenrolar, não é mesmo...?!"
51050-18 = "É exatamente o golpe do \"Sou eu! Sou eu!\" de que minha senpai falou!#nJamais imaginei que faria algo assim... Estou em choque!"
51050-23 = "Ora, ora, parece que vocês dois desenvolveram uma relação bem complicada sem que eu soubesse...?"
51050-24 = "[s] \"Não, isso é um mal-entendido...\""
51050-25 = "Nyahaha~ E então, o que traz a senhorita Yukari da Hyakkaryouran—#nao Clube Yin-Yang?"
51050-26 = "Ah, é mesmo!"
51050-27 = "Eu ouvi aquele rumor!"
51050-28 = "De que a Vice-Presidente do Comitê de Mediação de Conflitos Hyakkaryouran..."
51050-30 = "Não, a Presidente Interina, Nagusa-senpai, apareceu!"
51050-32 = "...Ora?"
51050-34 = "...A propósito, onde você ouviu essa história?"
51050-36 = "Naquele dia em que o céu se tingiu de vermelho..."
51050-37 = "Nós da Hyakkaryouran obtivemos a informação de que o Clube Yin-Yang estava agindo nos bastidores para resolver a situação."
51050-38 = "[s] \"Onde exatamente vocês descobriram isso...?\""
51050-40 = "...Para a Hyakkaryouran, coletar informações é tarefa fácil.#nAfinal, elas possuem sua própria rede de inteligência."
51050-41 = "Nós também ficamos de olho na Hyakkaryouran, né.#nNaturalmente, elas fazem o mesmo conosco."
51050-42 = "Niya-sama..."
51050-43 = "Haa..."
51050-45 = "Segundo as informações, o Clube Yin-Yang enviou agentes para a Grande Planície Nevada do Norte."
51050-46 = "O esquadrão de agentes sob comando direto do Clube Yin-Yang que solucionou inúmeros incidentes em Hyakkiyako...!"
51050-57 = "O lendário — \"Esquadrão Ninja Especial\"!!"
51050-63 = "[ns] \"Essa história não ficou um pouco exagerada demais...?\""
51050-64 = "Não conseguimos apurar os detalhes da missão, mas uma coisa é certa..."
51050-65 = "Que o esquadrão enviado encontrou \"alguém da Hyakkaryouran\" na Grande Planície Nevada."
51050-66 = "Huhu~n! Ficaram impressionados com a capacidade investigativa da Hyakkaryouran, não é?"
51050-67 = "Nyahaha. Controlamos as informações a rigor para evitar confusão, mas saberem até desse detalhe... Vocês são bem competentes, hein♪"
51050-68 = "Sim! Sim, com toda certeza! Não há ninguém que se iguale à capacidade de coleta de informações da Kikyou-senpai!"
51050-69 = "Entendi~ Kikyou...#nA aluna do segundo ano da Hyakkaryouran, Estrategista de Operações, Kiryuu Kikyou-san, não é?"
51050-73 = "Ah...! Acabei deixando escapar o nome da minha senpai... F-Finjam que eu não disse nada!"
51050-74 = "Bom, não há motivo para esconder... Sim, é verdade."
51050-76 = "Niya-sama—"
51050-78 = "Calma, calma, Kaho.#nJá é passado, e se tratando da Hyakkaryouran, não há problema em saberem a verdade."
51050-79 = "Então, é verdade mesmo...!"
51050-83 = "Sim. Nós fizemos contato com a Vice-Presidente do Comitê de Mediação de Conflitos Hyakkaryouran, \"Goryou Nagusa\"-san."
51050-84 = "...!"
51050-85 = "Nesse caso, tudo fica ainda mais rápido!#nEu tenho um pedido a fazer ao Clube Yin-Yang!"
51050-86 = "Hmm...?"
51050-87 = "[s] \"Quer que a gente convença a Nagusa a voltar, ou algo assim...?\""
51050-88 = "Não, não é isso."
51050-93 = "Para que eu possa me tornar a Presidente da Hyakkaryouran—"
51050-95 = "Peço que sejam testemunhas do \"Torneio de Sucessão da Hyakkaryouran\"!"
51050-103 = "[ns] \"Torneio de... Sucessão?\""
51050-105 = "[log=유카리](O que é o \"Torneio de Sucessão da Hyakkaryouran\"...)[/log]"
51050-109 = "(Hyakkaryouran... Um comitê tradicional encarregado de mediar conflitos, no qual apenas as alunas mais seletivas de toda Hyakkiyako podem ingressar.)"
51050-110 = "(Naturalmente, quem ocupa o topo precisa possuir capacidades à altura.)"
51050-113 = "(Portanto, quando membros de alto escalão julgam que quem está no topo não faz jus ao título—)"
51050-130 = "(Qualquer membro do comitê pode solicitar um \"Torneio de Sucessão\" e tomar o cargo! Esse é o \"Torneio de Sucessão da Hyakkaryouran\"!)"
51050-144 = "[ns] \"A Hyakkaryouran tem mesmo um sistema desses para derrubar superiores?!\""
51050-145 = "Hmm... Entendi o que você quer fazer, mas por que um Torneio de Sucessão...?"
51050-146 = "Parte meu coração ter que dizer isto com minhas próprias palavras, mas..."
51050-147 = "Atualmente, a Hyakkaryouran encontra-se em um estado que ninguém poderia chamar de \"comitê\"."
51050-148 = "A causa disso é... a Nagusa-senpai, que deveria estar no centro da Hyakkaryouran..."
51050-149 = "...É porque a Presidente Interina, Nagusa-senpai, abandonou seu posto.#nÉ por causa da ausência de uma Presidente!"
51050-154 = "Hmm..."
51050-155 = "Quando ouvi sobre a ordem de dissolução da Hyakkaryouran..."
51050-156 = "Enquanto pensava no que fazer durante o banho...!"
51050-157 = "Isso mesmo! Tive uma ideia brilhante num estalo!"
51050-158 = "Lembrei-me do Torneio de Sucessão sobre o qual ouvira falar em <rumores> tempos atrás!!"
51050-159 = "[s] \"Então não acontece com tanta frequência assim?\""
51050-161 = "Sim. Embora o \"Torneio de Sucessão\" conste no regulamento da Hyakkaryouran, não é algo que aconteça com frequência..."
51050-162 = "Não é de se estranhar que a senhorita Yukari, sendo recém-ingressa, nunca tenha presenciado um."
51050-164 = "Por conseguinte! Agora que conheço um meio capaz de reverter a situação atual... uma possível saída, eu me decidi!"
51050-165 = "Eu, Yukari, a elite da Hyakkaryouran e a promissora supernova!"
51050-166 = "Derrotarei a Nagusa-senpai no Torneio de Sucessão e assumirei com louvor o cargo de Presidente!"
51050-167 = "Se eu fizer isso, tudo deverá se resolver da melhor forma...#nPortanto, por favor... peço que me emprestem sua força!"
51050-168 = "[s] \"Err, mas a Nagusa é a Presidente Interina, não é...?\""
51050-170 = "Sim. A atual Presidente da Hyakkaryouran é Nanakado Ayame-san."
51050-171 = "Goryou Nagusa-san é, oficialmente, apenas a Vice-Presidente."
51050-172 = "Hmm... Mesmo assim, posso perguntar por que pretende desafiar a Nagusa-san para um Torneio de Sucessão?"
51050-178 = "A Presidente Ayame... deixou a Hyakkaryouran há bastante tempo."
51050-179 = "[s] \"...Há quanto tempo?\""
51050-180 = "Foi quase na mesma época em que entrei na Hyakkaryouran, então há cerca de dez meses."
51050-181 = "A Presidente Ayame passou para a Nagusa-senpai a \"Prova\" herdada por gerações na Hyakkaryouran. E, desde então, desapareceu sem deixar rastros."
51050-182 = "Normalmente, a Nagusa-senpai, por ter recebido a Prova, deveria ter assumido o cargo de Presidente, mas..."
51050-183 = "Por algum motivo, a Nagusa-san recusou e acabou ficando como interina, então..."
51050-184 = "Será que há algum motivo para isso?"
51050-185 = "...Eu não faço ideia."
51050-186 = "Não tive muitas oportunidades de conversar com a Presidente Ayame, mas..."
51050-187 = "Nós, do primeiro ano, não podemos opinar sobre o que ela decidiu."
51050-188 = "A Renge-senpai e a Kikyou-senpai aceitaram a decisão da Ayame-senpai."
51050-189 = "Contudo, a Nagusa-senpai recusou-se a aceitar até o fim... dizendo que só a Ayame-senpai podia ser a Presidente."
51050-190 = "E assim, a Presidente desapareceu em algum lugar, restando apenas a Nagusa-senpai..."
51050-196 = "...Chega de conversas sombrias!"
51050-197 = "O importante é o futuro! O fu~tu~ro!"
51050-198 = "Tudo se resolverá assim que eu, Yukari, a supergênia de elite, me tornar a Presidente!"
51050-199 = "Sim — a partir de agora, tem início a lenda de Yukari da Hyakkaryouran!"
51050-200 = "...É o que eu gostaria de dizer, mas infelizmente o Torneio de Sucessão não pode ser realizado apenas pela minha vontade."
51050-201 = "[s] \"Existe alguma condição especial para o Torneio de Sucessão?\""
51050-203 = "Sim, exatamente."
51050-204 = "Se qualquer um pudesse iniciar um Torneio de Sucessão livremente, todas se candidatariam em massa, não acha?#nPor isso, certas regras são necessárias."
51050-205 = "Para realizar o Torneio de Sucessão, é preciso obter a aprovação de pelo menos duas pessoas."
51050-206 = "Para garantir a imparcialidade do julgamento do Torneio de Sucessão, um membro do alto escalão da Hyakkaryouran e—"
51050-208 = "Uma testemunha de fora da Hyakkaryouran."
51050-209 = "[s] \"É uma regra para garantir a imparcialidade, então.\""
51050-211 = "Nyahaha. Há gerações, é o Clube Yin-Yang quem atua como testemunha no Torneio de Sucessão."
51050-212 = "Afinal, ocupamos uma posição de certo respeito dentro de Hyakkiyako♪"
51050-213 = "Contudo, atualmente a Hyakkaryouran encontra-se sob uma \"ordem de dissolução\"."
51050-214 = "Realizar um \"Torneio de Sucessão\" neste momento..."
51050-220 = "Com certeza é um erro."
51050-222 = "Oh...?"
51050-224 = "Afinal, tanto a Kikyou-senpai quanto a Renge-senpai... e todas as outras também."
51050-225 = "Enquanto houver pessoas que amam a Hyakkaryouran, uma ordem de dissolução é inconcebível."
51050-226 = "[s] \"...\""
51050-227 = "Entendo..."
51050-228 = "Ou seja, como uma ordem de dissolução é inconcebível, o Torneio de Sucessão pode ser realizado sem problemas, é isso..."
51050-229 = "Sim, mas é claro!"
51050-234 = "—Sendo assim, posso confirmar uma coisa?"
51050-235 = "...?"
51050-236 = "Como você mesma sabe, Yukari-san, a Hyakkaryouran atual não está funcionando. Isso é um fato inegável."
51050-237 = "Nesse cenário, realizar um \"Torneio de Sucessão\" pode fazer com que, de fora, pareça que você \"se aproveitou do caos na Hyakkaryouran para tomar o cargo de Presidente\"."
51050-242 = "E, além disso, contando com a ajuda do Clube Yin-Yang..."
51050-244 = "Em resumo, você estaria nos fazendo cúmplices de uma rebelião."
51050-247 = "—Você tem consciência disso?"
51050-249 = "...Ugh!"
51050-250 = "Eu não havia pensado tão longe..."
51050-251 = "Jamais imaginei que pudesse ser interpretado dessa maneira..."
51050-252 = "...M-Mas!"
51050-253 = "Mesmo assim..."
51050-254 = "...Mesmo assim, eu..."
51050-255 = "...Se mesmo compreendendo isso você ainda pede nossa ajuda..."
51050-256 = "...Seria esse um pedido como membro da família Kadenokouji?"
51050-257 = "...!!"
51050-261 = "..."
51050-262 = "Não, não é."
51050-263 = "Isto é..."
51050-268 = "Apenas da Yukari... É um pedido meu, pessoal."
51050-270 = "...Entendo."
51050-272 = "Porém, se existe a possibilidade de sermos vistos dessa forma..."
51050-273 = "Se isso for causar problemas ao Clube Yin-Yang, então eu..."
51050-274 = "Brincadeirinha~ Normalmente eu recusaria dizendo \"não podemos nos arriscar assim\", mas~"
51050-275 = "Nyahaha, você tem muita sorte, Yukari-san."
51050-277 = "Hã...?"
51050-282 = "Temos bem aqui alguém que jamais conseguiria ignorar as suas preocupações..."
51050-287 = "Niya-sama...!"
51050-289 = "Ora? Por acaso eu disse alguma mentira, Sensei?"
51050-290 = "[s] \"Bom... mentira não é, mas...\""
51050-291 = "...?? O que isso quer dizer...?"
51050-292 = "Significa que, se o \"Sensei da Schale\" atuar como testemunha, pelo menos os problemas políticos podem ser evitados. Nyaha."
51050-294 = "Niya-sama... Envolver ainda mais o Sensei nos nossos problemas..."
51050-296 = "Calma, calma, Kaho... Não precisa fazer essa cara assustadora."
51050-297 = "O Sensei jamais recusaria o pedido de uma aluna... não é mesmo?"
51050-298 = "[s] \"Se a Yukari está em apuros, ajudar com isso não custa nada.\""
51050-302 = "...!"
51050-303 = "Ufufu, que ótimo.#nAfinal, o nome da Schale tem poder suficiente para virar qualquer balança♪"
51050-304 = "Então, vamos deixar a função de \"testemunha\" com o Sensei [USERNAME] da Schale..."
51050-305 = "Bem, duvido que alguém ouse implicar com a Schale, mas...#nPor precaução, eu também atuarei como testemunha."
51050-306 = "Com isso... está satisfeita?"
51050-308 = "S-Sim! Claro...!"
51050-309 = "Agradeço imensamente pela gentil—"
51050-310 = "—Porém."
51050-316 = "Nunca se esqueça de que esta é uma exceção que só existe graças à presença da Schale."
51050-318 = "...Sim!"
51050-319 = "Guardarei isso bem no meu coração."
51050-320 = "Haa... Entendido."
51050-321 = "Então vamos dar andamento aos trâmites. Por aqui, Yukari-san..."
51050-322 = "Chise-chan, venha por aqui também."
51050-323 = "Sim~#nAté mais, Sensei~"
51050-329 = "Nyahaha~, que momento mais oportuno, não é?#nAinda bem, ainda bem."
51050-330 = "[s] \"Você me chamou porque já sabia que isso ia acontecer?\""
51050-331 = "Hm~? Não faço a menor ideia do que o senhor está falando."
51050-332 = "Digamos que foi apenas uma série de coincidências, uma questão de puro acaso."
51050-333 = "Se nossos interesses coincidem, não há motivo para não darmos as mãos, certo?#nAlém disso, achei que seria simplesmente divertido."
51050-334 = "...E também, pensei que nos aproximarmos da Hyakkaryouran seria uma boa oportunidade para descobrir mais sobre a Kuzunoha."
51050-335 = "[s] \"Você previu até esse ponto desde o começo, Niya...?\""
51050-336 = "Nyaha~, quem sabe?"
51050-337 = "Pelo menos, parece que vamos conseguir sair da situação em que só causávamos problemas unilateralmente, sabe~"
51050-338 = "Afinal, uma relação em que só se recebe acaba ficando desconfortável, não acha?"
51050-342 = "[ns] \"...Obrigado.\""
51050-343 = "Ora, ora, essa fala deveria ser minha. Nfufu."
51050-348 = "...Por favor, cuide de Hyakkiyako, Sensei."
51050-350 = "Próximo;O Próximo Destino"
