[translation]
51050-1 = "Эпизод 5;Появление самопровозглашённой элитной девушки!"
51050-2 = ""
51050-3 = ""
51050-5 = "Хм... Я помню это имя."
51050-6 = "Юкари из Хяккарёран... Наследница знатной семьи."
51050-7 = "[s] «Постой, ты та девушка, которую я встретил раньше.»"
51050-8 = ""
51050-11 = ""
51050-12 = "Хм? Что привело сюда Сенсея из Шале?"
51050-13 = ""
51050-15 = ""
51050-16 = "*ах* Я так и знала!"
51050-17 = "Вы помогли мне раньше, потому что знали, что случится нечто подобное, верно?!"
51050-18 = "Всё как предупреждала Рэнгэ! Ухмыляющийся паук заманил меня в свою паутину! Всё это время я была его целью и даже не понимала, в какой опасности нахожусь!"
51050-19 = ""
51050-22 = ""
51050-23 = "...Между вами двумя есть что-то, о чём я не знаю?"
51050-24 = "[s] «Нет, это просто одностороннее недоразумение. С её стороны.»"
51050-25 = "Но зачем Юкари спускаться с высот Хяккарёран аж до Клуба Инь-Ян?"
51050-26 = "О, точно!"
51050-27 = "Насчёт этого... Я услышала новости."
51050-28 = "Вице-президент Хяккарёран..."
51050-30 = "Нет, исполняющая обязанности президента Нагуса вернулась!"
51050-32 = "О боже..."
51050-34 = "...И где ты это услышала?"
51050-36 = "В тот день, когда небо окрасилось в красный."
51050-37 = "Хяккарёран получил сведения, что Клуб Инь-Ян тайно работал над исправлением ситуации."
51050-38 = "[s] «Откуда у вас эти сведения?»"
51050-40 = "...У Хяккарёран очень искусная разведывательная сеть."
51050-41 = "Лучше всегда исходить из того, что Хяккарёран следит за любой операцией. Конечно, отчасти поэтому мы и сами наблюдаем за ними, ня-ха-ха!"
51050-42 = "Ния..."
51050-43 = "*вздыхает*"
51050-45 = "Согласно донесению, агенты Клуба Инь-Ян были отправлены на Великое снежное поле на севере."
51050-46 = "И не просто агенты... таинственный отряд, подчиняющийся напрямую Клубу Инь-Ян... Специалисты, которые бесчисленное количество раз спасали Хяккияко от опасностей!"
51050-50 = ""
51050-52 = ""
51050-54 = ""
51050-56 = ""
51050-57 = "Легендарный Особый отряд ниндзя!"
51050-58 = ""
51050-60 = ""
51050-61 = ""
51050-63 = "[ns] «...Это не слишком преувеличено?»"
51050-64 = "Хотя точные детали задания нам выяснить не удалось, в одном мы были уверены."
51050-65 = "На Великом снежном поле отряд, направленный Клубом Инь-Ян, связался с кем-то из Хяккарёран."
51050-66 = "Ну как вам разведка Хяккарёран!"
51050-67 = "Ня-ха-ха! Та операция проводилась в строжайшей тайне, чтобы не поднимать шума. Впечатляет, что вам удалось узнать так много!"
51050-68 = "Да! Аналитические способности Кикё в разведке непревзойдённы!"
51050-69 = "А, под Кикё ты имеешь в виду Кирю Кикё, второкурсницу и офицера по операциям Хяккарёран, верно?"
51050-70 = ""
51050-72 = ""
51050-73 = "...А-а! Я раскрыла имя своей старшей... Э-Это была ошибка! П-Пожалуйста, забудьте мои слова!"
51050-74 = "Ха. Ну, если она выяснила столько, скрывать уже бессмысленно... Да. Ваш доклад был верен."
51050-76 = "Ния."
51050-78 = "Всё в порядке, Кахо. Операция уже завершена. К тому же она студент Хяккарёран — имеет право знать."
51050-79 = "Тогда... вы правда...!"
51050-80 = ""
51050-82 = ""
51050-83 = "Да, мы поддерживали связь с вице-президентом Хяккарёран, Горё Нагусой."
51050-84 = "...!"
51050-85 = "Это... великолепно! Тогда у меня, Юкари, есть просьба к Клубу Инь-Ян!"
51050-86 = "Учитывая нынешнюю ситуацию, полагаю, твоя просьба..."
51050-87 = "[s] «Ты хочешь, чтобы мы убедили Нагусу вернуться...»"
51050-88 = "Нет. Совсем нет."
51050-89 = ""
51050-91 = ""
51050-92 = ""
51050-93 = "Ибо я, Юкари, поклялась сама стать президентом Хяккарёран!"
51050-95 = "Я хочу, чтобы президент Клуба Инь-Ян засвидетельствовала мой Поединок за преемство Хяккарёран!"
51050-96 = ""
51050-98 = ""
51050-100 = ""
51050-101 = ""
51050-102 = ""
51050-103 = "[ns] «Поединок за... что?»"
51050-105 = "[log=유카리]Поединок за преемство Хяккарёран![/log]"
51050-107 = ""
51050-109 = "Совет урегулирования Хяккарёран — престижный клуб, отвечающий за разрешение споров внутри Хяккияко, куда можно вступить только по приглашению!"
51050-110 = "Любой, кто осмелится встать во главе столь элитной организации, должен доказать, что достоин руководить ею!"
51050-111 = ""
51050-113 = "Если выяснится, что какому-либо офицеру или руководителю недостаёт навыков или характера, необходимых для его должности..."
51050-114 = ""
51050-116 = ""
51050-117 = ""
51050-119 = ""
51050-121 = ""
51050-122 = ""
51050-123 = ""
51050-124 = ""
51050-125 = ""
51050-126 = ""
51050-130 = "Любой другой член клуба может бросить ему вызов в Поединке за преемство и занять его место!"
51050-131 = ""
51050-137 = ""
51050-139 = ""
51050-141 = ""
51050-144 = "[ns] «Н-Неужели в Хяккарёран всё настолько сурово?!»"
51050-145 = "Хм, но почему ты решила провести Поединок за преемство именно сейчас?"
51050-146 = "Мне больно признаваться в этом постороннему, но..."
51050-147 = "Всем очевидно, что Хяккарёран сейчас в полном раздрае! Мы едва ли можем называть себя настоящим клубом!"
51050-148 = "И главный источник этого беспорядка — Нагуса, которая должна быть опорой, удерживающей Хяккарёран вместе..."
51050-149 = "Без исполняющей обязанности президента Нагусы мы словно тело без головы!"
51050-150 = ""
51050-152 = ""
51050-154 = "Хм..."
51050-155 = "Поэтому я, Юкари, направила свой могучий разум на решение этой проблемы!"
51050-156 = "И после долгих раздумий и размышлений, особенно после объявления приказа о роспуске Хяккарёран..."
51050-157 = "Во время вечерней ванны меня внезапно осенило!"
51050-158 = "Я вспомнила рассказы о прошлых Поединках за преемство!"
51050-159 = "[s] «...Рассказы?»"
51050-161 = "Хотя устав Хяккарёран предусматривает Поединки за преемство, на практике они случаются не так уж часто..."
51050-162 = "Учитывая, что Юкари вступила в клуб лишь в этом году, неудивительно, что для неё они почти легенда."
51050-164 = "Осознав, что есть способ спасти нас на краю пропасти, я принесла торжественную клятву!"
51050-165 = "Я, Юкари, элита Хяккарёран и звезда, пылающая огнём всех наших надежд, торжественно клянусь:"
51050-166 = "Я одолею Нагусу в Поединке за преемство и сама займу пост президента!"
51050-167 = "Это решит все наши проблемы! Поэтому прошу вас, президент Клуба Инь-Ян, помочь мне!"
51050-168 = "[s] «Но разве ты не сказала, что Нагуса — вице-президент? Тогда президентом является кто-то другой?»"
51050-170 = "Официальным президентом Хяккарёран сейчас числится Нанакадо Аямэ."
51050-171 = "На бумаге Горё Нагуса носит лишь титул вице-президента."
51050-172 = "Тогда чего ты надеешься добиться, вызвав Нагусу на Поединок за преемство?"
51050-173 = ""
51050-175 = ""
51050-177 = ""
51050-178 = "...Прошло уже некоторое время с тех пор, как президент Аямэ покинула клуб."
51050-179 = "[s] «Аямэ ушла из клуба?»"
51050-180 = "Да. Около десяти месяцев назад, как раз когда я вступила в Хяккарёран."
51050-181 = "Президент Аямэ передала Нагусе Полномочие президента, обозначив её своей преемницей, как каждый президент Хяккарёран делал со времён основания... А затем исчезла."
51050-182 = "После этого Нагуса должна была стать президентом..."
51050-183 = "Но она отказалась принять полный титул и согласилась лишь исполнять обязанности президента..."
51050-184 = "Ты знаешь почему?"
51050-185 = "...Я... не уверена."
51050-186 = "Я совсем недолго состояла в Хяккарёран, пока президент Аямэ была во главе... и почти ничего о ней не знаю."
51050-187 = "Но когда она решила покинуть клуб, никто из нас не смог её остановить."
51050-188 = "Я, Юкари, приняла эту истину. Как и Рэнгэ с Кикё."
51050-189 = "Но Нагуса... Она отказывается... Она утверждает, что президентом может быть только Аямэ."
51050-190 = "...Но президента больше нет с нами! Нагуса — единственная..."
51050-191 = ""
51050-194 = ""
51050-196 = "Нет, хватит зацикливаться на прошлом!"
51050-197 = "Важнее будущее!"
51050-198 = "Всё наладится, когда я, Юкари, сверхэлитный гений, стану президентом Хяккарёран!"
51050-199 = "Это ознаменует новый акт в легенде Хяккарёран, написанный не кем иным, как мной, Юкари!"
51050-200 = "...По крайней мере, я на это надеюсь, но, к сожалению, Поединок за преемство нельзя объявить в одиночку."
51050-201 = "[s] «У такого пафосного названия, как Поединок за преемство, наверняка есть свои правила.»"
51050-203 = "Именно, Сенсей. Ни одна сторона не может самостоятельно начать Поединок за преемство Хяккарёран."
51050-204 = "Если бы любой мог начать его по своему желанию, клуб погружался бы в хаос каждый раз, когда подчинённому казалось бы, что у него идея получше. Ничего бы никогда не делалось."
51050-205 = "Согласно уставу Хяккарёран, чтобы Поединок за преемство имел законную силу, нужны ещё два человека, которые выступят свидетелями."
51050-206 = "Первым свидетелем должен быть уважаемый человек, не связанный с руководством Хяккарёран. Он подтверждает, что ритуал проводится по праведной причине..."
51050-208 = "А вторым свидетелем должен быть другой офицер Хяккарёран, который проводит Поединок за преемство и следит, чтобы всё было честно для обеих сторон."
51050-209 = "[s] «Понятно. Так у обеих сторон будут равные условия...»"
51050-211 = "Ня-ха-ха, немного неловко говорить это самой, но традиционно первым свидетелем на Поединках за преемство выступает президент Клуба Инь-Ян."
51050-212 = "В конце концов, нас в Хяккияко довольно уважают!"
51050-213 = "Однако Хяккарёран приказано распустить."
51050-214 = "В таких обстоятельствах я не представляю, как Поединок за преемство вообще может быть законно проведён..."
51050-215 = ""
51050-217 = ""
51050-219 = ""
51050-220 = "Это неправда."
51050-222 = "О...?"
51050-224 = "Кикё... Рэнгэ... и остальные члены клуба."
51050-225 = "Пока живы люди, любящие Хяккарёран, никакая Декларация о роспуске не может считаться действительной."
51050-226 = "[s] «...»"
51050-227 = "Так что... раз была издана незаконная Декларация о роспуске..."
51050-228 = "Ты хочешь, чтобы мы одобрили твой Поединок за преемство, верно?"
51050-229 = "Да, именно!"
51050-230 = ""
51050-232 = ""
51050-234 = "Тогда у меня к тебе один вопрос, Юкари."
51050-235 = "О?"
51050-236 = "Как ты и сказала, сейчас Хяккарёран фактически не функционирует."
51050-237 = "Проводить Поединок за преемство в таких обстоятельствах... Кто-то может сказать, что ты устраиваешь переворот, пока Хяккарёран находится в хаосе."
51050-238 = ""
51050-241 = ""
51050-242 = "А прося помощи у Клуба Инь-Ян..."
51050-244 = "Ты просишь нас присоединиться к твоей измене."
51050-247 = "И даже если отбросить столь недоброжелательные подозрения, ты определённо просишь нас разделить политические риски, связанные с твоими действиями. Ты это понимаешь?"
51050-249 = "...Ч-Что?"
51050-250 = "Я-я-я даже не думала ни о чём подобном!"
51050-251 = "Ч-Чтобы это могли воспринять именно так..."
51050-252 = "...Н-Но!"
51050-253 = "Но..."
51050-254 = "Всё же... я..."
51050-255 = "Если ты всё ещё хочешь просить нас о помощи..."
51050-256 = "...Это просьба от твоей семьи?"
51050-257 = "Угх!!!"
51050-258 = ""
51050-260 = ""
51050-261 = "..."
51050-262 = "Нет. Совсем нет."
51050-263 = "Это не... Я просто..."
51050-264 = ""
51050-266 = ""
51050-267 = ""
51050-268 = "Это всего лишь просьба от меня, Юкари из Хяккарёран."
51050-270 = "Хм-м."
51050-272 = "Но если мой поединок и правда могут воспринять так, как вы сказали..."
51050-273 = "Я вовсе не хочу создавать проблемы для Клуба Инь-Ян..."
51050-274 = "...Обычно я потребовала бы от тебя что-нибудь взамен за головную боль, которую ты доставишь Клубу Инь-Ян. И ещё что-нибудь — за головную боль лично мне, как президенту."
51050-275 = "Но, как оказалось, момент ты выбрала идеальный."
51050-277 = "П-Правда?"
51050-278 = ""
51050-281 = ""
51050-282 = "Тебе повезло, Юкари. Так уж вышло, что здесь как раз находится человек, который не способен пройти мимо твоих трудностей."
51050-283 = ""
51050-286 = ""
51050-287 = "Н-Ния!"
51050-289 = "Ох. Разве я не права, Сенсей?"
51050-290 = "[s] «Нет, ты права, но...»"
51050-291 = "...Что это значит?"
51050-292 = "Если Сенсей из Шале выступит твоим свидетелем, наш клуб вообще не окажется рядом с политическими последствиями."
51050-294 = "Ты снова втягиваешь Сенсея в проблемы Хяккияко..."
51050-296 = "Не делай такое страшное лицо, Кахо."
51050-297 = "Сенсей ведь никогда не откажет студенту, которому нужна помощь, пра-а-а-авда?"
51050-298 = "[s] «Если Юкари нужна моя помощь, я помогу ей.»"
51050-299 = ""
51050-301 = ""
51050-302 = "...!"
51050-303 = "Ня-ха-ха, прекрасно! Как мило со стороны Шале ворваться сюда и оказаться выше нашей мелочной внутренней политики."
51050-304 = "Тогда я официально прошу Сенсея [USERNAME] из Шале выступить свидетелем предстоящего Поединка за преемство."
51050-305 = "Сомневаюсь, что кто-то станет возражать против Сенсея, но на всякий случай я, Ния, как президент Клуба Инь-Ян, официально подтверждаю право Шале выступить свидетелем."
51050-306 = "Такого ответа тебе достаточно?"
51050-308 = "Д-Да! Конечно!"
51050-309 = "С-Спасибо вам за—!"
51050-310 = "Однако."
51050-311 = ""
51050-313 = ""
51050-314 = ""
51050-316 = "Имей в виду: это особое исключение, разрешённое благодаря прежней помощи Шале этой академии."
51050-318 = "...!"
51050-319 = "Да, я запомню."
51050-320 = "Хорошо."
51050-321 = "Нам нужно оформить официальное заявление о намерениях, так что следуй за мной, Юкари."
51050-322 = "Ты тоже, Чисэ..."
51050-323 = "Хорошо... До встречи, Сенсей..."
51050-324 = ""
51050-326 = ""
51050-329 = "Ня-ха-ха! Мы как раз вовремя смогли помочь Юкари. Какое облегчение!"
51050-330 = "[s] «Ния, ты ожидала чего-то подобного после Декларации о роспуске?»"
51050-331 = "Хм, кто знает? Не понимаю, на что вы намекаете, Сенсей."
51050-332 = "Наверное, то, что вы с Юкари оказались здесь одновременно, было просто счастливым совпадением."
51050-333 = "Но раз уж так вышло, вполне логично, что вы ей поможете. Решение, выгодное всем."
51050-334 = "...К тому же, пока вы будете с Хяккарёран, возможно, узнаете что-нибудь о Кузунохе, а?"
51050-335 = "[s] «Ния, ты всё это спланировала с самого начала.»"
51050-336 = "Ня-ха-ха! Возможно!"
51050-337 = "Я просто рада, что Сенсей охотно участвует."
51050-338 = "Знаете, быть человеком, к которому все бегут со своими проблемами, совсем не весело."
51050-339 = ""
51050-342 = "[ns] «...Спасибо.»"
51050-343 = "Ох, это я должна вам сказать!"
51050-344 = ""
51050-346 = ""
51050-347 = ""
51050-348 = "Буду ждать ваших трудов на благо Хяккияко, Сенсей. Но постарайтесь всё же насладиться фестивалем."
51050-350 = "Следующий эпизод;Следующее назначение"
