[translation]
1011305-1 = "Круговорот поверхностных течений"
1011305-2 = "[ns] «Ого, мы вместе едем на пляж!»"
1011305-3 = "Вы сегодня очень энергичны, Сенсей."
1011305-4 = "Это хорошо. Я рада."
1011305-5 = "[s1] «А почему тебе сегодня захотелось на пляж?»\n[s2] «Сейчас не лето, там может быть холодно.»"
1011305-8 = "Ну, главным образом я подумала, что могу увидеть утонувшее тело..."
1011305-9 = "Прошу прощения, промокшего пациента в экстренном состоянии."
1011305-10 = "И тогда я смогу провести сердечно-лёгочную реанимацию."
1011305-11 = "[s] «Эм... Да... Хорошо...»"
1011305-12 = "В Геенне множество способов умереть — или, по крайней мере, получить травму."
1011305-13 = "Ручные гранаты, боеприпасы с белым фосфором, мины, самодельные взрывные устройства, RDX... но УТОНУВШЕГО пациента встретить редко."
1011305-14 = "Конечно, есть вулкан Хинном и горячие источники, но в горячих источниках тонут нечасто."
1011305-15 = "А если честно, мне ещё хотелось увидеть пляжный пейзаж."
1011305-16 = "Студенты Геенны, конечно, иногда выбираются сюда."
1011305-17 = "Но с моим плотным расписанием я уже очень давно не была на пляже."
1011305-18 = "[s3] «...!»\n[s4] «Ну тогда едем прямо сейчас!»"
1011305-21 = "Хм-м."
1011305-22 = "Вы и правда полны энергии, Сенсей."
1011305-26 = "Вот он... пляж."
1011305-27 = "[s] Ну как тебе?"
1011305-28 = "Это... на удивление трудно выразить словами."
1011305-29 = "Я почти никогда здесь не бывала."
1011305-30 = "Но если описать одним словом..."
1011305-32 = "...простор."
1011305-33 = "И он непрерывно движется. Я про волны."
1011305-34 = "Я не вижу, где море заканчивается. Впечатляющее зрелище. В прошлый раз, когда передо мной был открытый горизонт, я была слишком маленькой, чтобы обратить внимание."
1011305-35 = ""
1011305-36 = "Иногда мне трудно понять, что правильно, а что нет."
1011305-37 = "Здесь НЕТ утонувших тел... *кхм* пациентов?"
1011305-38 = "[s5] «Ну, сейчас просто не сезон...»\n[s6] «Сегодня здесь не так уж много людей.»"
1011305-41 = "Полагаю, вода слишком холодная, чтобы плавать или... купаться в море."
1011305-42 = "То есть сегодня мне не стоит ожидать никаких тел— пациентов."
1011305-43 = "...Хорошо. Понимаю."
1011305-44 = "В каком-то смысле я этому даже рада. Значит, мне ничего не придётся делать."
1011305-45 = "Но есть одна проблема."
1011305-46 = "А ЧТО вообще делать на пустом пляже?"
1011305-47 = "[s] «Оставь это Сенсею!»"
1011305-48 = "Звучите уверенно."
1011305-49 = "Хорошо. Тогда сделаю именно так, как вы сказали."
1011305-50 = ""
1011305-52 = ""
1011305-53 = ""
1011305-54 = "Оставляю это вам, Сенсей."
1011305-56 = "Это... кафе у моря, верно?"
1011305-57 = "Мне кажется или здесь всё намного дороже?"
1011305-58 = "Хм? То есть в таких местах мы доплачиваем за атмосферу?"
1011305-59 = "Не... уверена, что понимаю, но вы наверняка знаете, о чём говорите, Сенсей."
1011305-60 = "В конце концов, с пляжами я почти не знакома."
1011305-61 = ""
1011305-62 = "Это... такояки и кофе. Не знала, что такое сочетание вообще существует."
1011305-63 = "Полагаю, кофе смывает тяжёлый вкус такояки. В этом идея?"
1011305-64 = "Понятно. Поверю вам на слово."
1011305-65 = ""
1011305-71 = "...Такояки немного холодные, а кофе для меня слишком горячий."
1011305-72 = "Я не в том положении, чтобы судить о вкусе ИЛИ еде, но за такую цену это немного разочаровывает."
1011305-73 = "[s] «Эм... Прости?»"
1011305-74 = "..."
1011305-75 = "Не стоит. Кажется, теперь я понимаю, что вы имели в виду под «доплатой за атмосферу»."
1011305-77 = "Вот уж неожиданно. Лес прямо рядом с пляжем?"
1011305-78 = "А, значит, это называется «ветрозащитный лес»."
1011305-79 = "Его посадили здесь, чтобы защищать от волн и песка."
1011305-80 = "Я одновременно слышу волны, чаек и лесных птиц."
1011305-81 = "И чувствую запах морской соли и деревьев."
1011305-82 = "Это... довольно свежий опыт."
1011305-84 = "Знаете, я слышала, как вы говорили, что один из способов наслаждаться прибрежными дорогами — ездить по ним на велосипеде..."
1011305-85 = "[ns] «*пыхтит* *пыхтит* *пыхтит* *пыхтит*»"
1011305-86 = "Вы в порядке, Сенсей? Хотите, я поеду впереди и поведу вас?"
1011305-87 = "[s] «*задыхается* Не... Не могу...»"
1011305-88 = "...Понимаю. Если вы настолько решительно настроены, Сенсей, мне больше нечего сказать."
1011305-89 = "Даже если из-за нагрузки у вас начнётся гипоксия, можете не волноваться."
1011305-90 = "Что бы ни произошло, я позабочусь о вас любыми необходимыми средствами."
1011305-91 = "Даже рот в рот."
1011305-98 = "...О, уже вечер."
1011305-99 = "[s] «Хорошо провела время?»"
1011305-100 = "Да. Всё казалось мне таким новым."
1011305-101 = "Давно у меня время не пролетало так незаметно."
1011305-102 = "Спасибо, Сенсей."
1011305-103 = "Я надолго запомню этот день."
1011305-104 = "Поверьте, я говорю искренне."
1011305-107 = "― [log=세나 사복]Вода определённо холодная.[/log][wa:3590]"
1011305-109 = "― [log=세나 사복]У некоторых людей это может вызвать переохлаждение. [/log][wa:90]"
1011305-112 = "― [log=세나 사복]Кто-нибудь может даже... [/log]"
1011305-113 = "― [log=세나 사복]...потерять сознание, хотя бы ненадолго.[/log][wa:10]"
1011305-116 = "― [log=세나 사복]А, это...[/log][wa:1960]"
1011305-118 = "― [log=세나 사복]то, что люди называют «портить атмосферу».[/log][wa:2030]"
1011305-121 = "[ns] «Непривычно слышать от тебя такое, Сэна.»"
1011305-122 = "― [log=세나 사복]Я и сама немного удивлена.[/log][wa:4100]"
1011305-125 = "― [log=세나 사복]Но, Сенсей? После целого дня[/log][wa:1040]"
1011305-126 = "― [log=세나 사복]таких новых впечатлений...[/log][wa:990]"
1011305-129 = "― [log=세나 사복]Может, хотя бы один раз попробовать и новые выражения[/log][wa:10]"
1011305-130 = "― [log=세나 사복]будет не такой уж плохой идеей.[/log][wa:3260]"
1011305-133 = "― [log=세나 사복]...Вода и правда очень холодная.[/log][wa:3680]"
1011305-135 = "― [log=세나 사복]Но... кажется, не из тех холодов, которые неприятны.[/log][wa:950]"
1011305-138 = "..."
1011305-139 = "Сенсей, внутри меня есть какое-то... пустое место."
1011305-140 = "Трудно выразить словами, но люди время от времени говорят мне именно так."
1011305-141 = "Может, я просто такой человек."
1011305-142 = "Я... неопределённая."
1011305-143 = "Пожалуйста, помните об этом, хорошо? Когда смотрите на меня или думаете обо мне."
1011305-144 = "Не думаю, что занимаюсь работой Клуба скорой медицинской помощи потому, что она мне нравится. Но и не то чтобы она мне не нравилась."
1011305-145 = "Я делаю её потому что... ну, потому что должна."
1011305-146 = "И она удовлетворяет мои интересы... или мои эгоистичные желания, смотря как посмотреть."
1011305-147 = "Полагаю, для людей естественно стремиться к собственным интересам."
1011305-148 = "Возможно, внутри каждого из нас есть пустое место, и мы постоянно ищем, чем его заполнить."
1011305-149 = "[s] «Как думаешь, сейчас это место хотя бы немного заполнилось?»"
1011305-150 = "Возможно."
1011305-151 = ""
1011305-153 = ""
1011305-154 = "По крайней мере... именно так я себя чувствую, когда я с вами."
1011305-155 = "Я знаю лишь одно: даже в той холодной воде... на душе у меня было так тепло."
1011305-157 = "Мы с Сэной оставались на пляже до позднего вечера, а затем вместе вернулись обратно."
