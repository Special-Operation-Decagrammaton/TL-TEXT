[translation]
10055120-1 = "Afterword Part 3: The Dream Battleship"
10055120-2 = "……So that’s what happened."
10055120-3 = "I apologize. My lack of oversight caused you so much trouble."
10055120-4 = "N-no, it’s quite alright."
10055120-5 = "We were properly warned, after all. It was our responsibility for venturing so far out."
10055120-6 = "Even so……"
10055120-7 = "What’s with this shiny new ship……?"
10055120-8 = "Hm? It’s compensation for the ship we destroyed."
10055120-9 = "Was it perhaps not enough?"
10055120-10 = "Good heavens, quite the opposite!"
10055120-11 = "I’d have been lucky just to scrap that old ship for free. And yet, you give us a state-of-the-art vessel like this……"
10055120-12 = "The value of something isn't just about the price tag, is it?"
10055120-13 = "That ship had been with us for decades."
10055120-14 = "We were the ones who destroyed it. It’s only right that we provide the best compensation."
10055120-15 = "……You’re a rare kind of student these days."
10055120-16 = "Hanuma Makoto, was it? I shall make sure to remember that name."
10055120-17 = "Kikiki! Not a single one of the common folk shall escape!"
10055120-18 = "This is the imperial education of Makoto-sama!"
10055120-23 = "I see…… a ship, huh."
10055120-24 = "Makoto-chan?"
10055120-25 = "You’re done with your business, aren't you? Why the long face?"
10055120-26 = "……In the end, it sank. Bis-maru."
10055120-27 = "Well, considering who we were up against."
10055120-28 = "Did you actually think we could win?"
10055120-29 = "That’s not it."
10055120-30 = "Of course, most things in this world can be solved with sheer willpower, but we were clearly at a disadvantage that time."
10055120-31 = "It’s just…… it really is a shame."
10055120-32 = "A shame?"
10055120-33 = "The way the tremors shook my entire body! The roar that rattled my chest, and the smoke from the explosions!"
10055120-34 = "Experiencing it myself made me realize! The power of surface ships and naval guns, and their potential!"
10055120-35 = "Losing Bis-maru is, indeed, a tremendous loss!"
10055120-36 = "……No, this is no time to dwell on the past! We must move forward!"
10055120-37 = "As soon as we arrive at Gehenna, we begin the construction plan for Bis-maru II!"
10055120-38 = "Huh?"
10055120-39 = "Not only will it be bigger than Bis-maru I, but we shall build a super-battleship that surpasses any ship in the Odyssey!"
10055120-40 = "Hmm? Well, I suppose that’s fine."
10055120-41 = "But do we even have the money for that?"
10055120-42 = "We’ll just cut the Prefect Team’s budget! They’re allocated far more than they deserve anyway!"
10055120-43 = "I can solve two problems at once! Truly, a brilliant strategy from Makoto-sama."
10055120-44 = "That sounds more like you're creating more problems than you're solving."
10055120-45 = "Ooh! I can already feel a major scoop coming on!"
10055120-46 = "Something like 'Pandemonium Society President Impeached' would make for a great article."
10055120-47 = "Kikiki! Just you watch, Odyssey!"