[translation]
10055120-1 = "Эпилог;Боевой корабль мечты"
10055120-2 = "...Значит, вот что случилось."
10055120-3 = "Простите. Я не поддерживала лодку в должном состоянии, и вам пришлось за это расплачиваться."
10055120-4 = "Н-нет, всё нормально."
10055120-5 = "Вы нас не раз предупреждали. Это мы слишком далеко заплыли."
10055120-6 = "Но, знаете, мне просто любопытно..."
10055120-7 = "Откуда у моего причала эта новенькая сверкающая лодка?"
10055120-8 = "Это компенсация за ваши потери..."
10055120-9 = "Её недостаточно?"
10055120-10 = "Н-нет! Более чем достаточно!"
10055120-11 = "Та лодка и так на ладан дышала. А вы заменили её совершенно новой, хотя за утилизацию старой мне ещё пришлось бы платить."
10055120-12 = "Вещи дороги нам не только своей ценой."
10055120-13 = "Хотя лодка и пришла в негодность, вы всё равно её берегли. За десятки лет она стала для вас ценнее любой суммы, за которую её можно продать."
10055120-14 = "И повредили её только мы, так что наш долг — исправить ошибку."
10055120-15 = "Нынче редко встретишь студентов с такими принципами."
10055120-16 = "Ханума Макото, верно? Не забуду этого имени."
10055120-17 = "Кихехе! Ни один из моих людей не будет брошен на произвол судьбы!"
10055120-18 = "Вот оно, искусство руководства в стиле Макото!"
10055120-20 = ""
10055120-21 = ""
10055120-22 = ""
10055120-23 = "И всё же... Корабль, да..."
10055120-24 = "Макото?"
10055120-25 = "Мы ведь закончили? Чего ты вдруг уставилась на море и вздыхаешь?"
10055120-26 = "...Несмотря на всё, «Бисмару» всё-таки затонула."
10055120-27 = "Учитывая, кто был нашим противником..."
10055120-28 = "Ты же не думала, что мы действительно победим?"
10055120-29 = "Нет-нет. Я не об этом."
10055120-30 = "Большинство проблем в жизни можно решить силой духа, но иногда встречаются обстоятельства, которые не одолеть никакой силой духа."
10055120-31 = "И всё же... Как жаль."
10055120-32 = "Жаль?"
10055120-33 = "Ощущение, от которого всё тело вибрирует! Громовые раскаты и клубы дыма, от которых загорается сердце!"
10055120-34 = "Испытав это на себе, я поняла, насколько мощны надводные военные корабли и их орудия! Я увидела их поистине безграничный потенциал!"
10055120-35 = "Скорбь о потере «Бисмару» до сих пор терзает меня!"
10055120-36 = "Но нельзя вечно оплакивать утраченное! Геенна должна смотреть только вперёд!"
10055120-37 = "Вот почему, едва вернувшись, я начну разрабатывать проект «Бисмару II»!"
10055120-38 = "Что?"
10055120-39 = "Построим гигантский боевой корабль, больше первой «Бисмару»! И больше любого корабля «Одиссеи»!"
10055120-40 = "Ну, почему бы и нет?"
10055120-41 = "Однако откуда возьмёшь деньги?"
10055120-42 = "Возьмём из бюджета Префектов! Им и так выделяют больше, чем заслуживают!"
10055120-43 = "Две проблемы одним махом! Ещё один гениальный план Великой Макото! Кихехе!"
10055120-44 = "Нет, ты создаёшь мне миллион новых проблем."
10055120-45 = "О-о! Чую огромную сенсацию!"
10055120-46 = "У меня даже заголовок готов: «Председатель Общества Пандемониум отстранена от должности»."
10055120-47 = "Кихехе! Только погодите, «Одиссея»!"
