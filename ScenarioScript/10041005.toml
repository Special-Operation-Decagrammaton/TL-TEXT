[translation]
10041005-40 = "#video;10041"
10041005-1 = "Пролог;Выставка Миллениума"
10041005-6 = "Смотрите, Сенсей. Мы почти пришли."
10041005-7 = "С моего прошлого визита прошло немало времени. Да и тогда я приезжала на встречу."
10041005-8 = ""
10041005-12 = "Школа науки и технологий..."
10041005-13 = "...Научная школа «Миллениум»."
10041005-17 = "Спасибо, что согласились пойти со мной."
10041005-18 = "Не то чтобы мне нравилось быть у вас в долгу..."
10041005-19 = ""
10041005-21 = ""
10041005-23 = ""
10041005-24 = ""
10041005-25 = ""
10041005-27 = "...но другого выхода не было. Нагиса ни за что не одобрила бы эту поездку, если бы я не взяла вас с собой."
10041005-28 = "До вашего прихода наш разговор стал... довольно жарким."
10041005-29 = "Поэтому не знаю, как вы на это смотрите, Сенсей, но для меня это «испытание»."
10041005-30 = "Возможно, и для остальных тоже, но особенно для меня."
10041005-31 = ""
10041005-33 = ""
10041005-35 = ""
10041005-36 = "Мы увидим, смогу ли я, Юризоно Сэя, твёрдо стоять на своём. Это решающий момент..."
10041005-38 = "...и способ доказать себя."