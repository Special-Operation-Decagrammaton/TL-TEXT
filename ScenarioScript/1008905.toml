[translation]
1008905-1 = "Мой счёт снова заморозили"
1008905-3 = "К назначенному времени нашей встречи Ару загадочным образом так и не появилась."
1008905-4 = ""
1008905-7 = "[ns1] «Интересно, что её задержало...»\n[ns2] «Может, позвонить ей?»"
1008905-11 = "О нет. Боюсь, что..."
1008905-12 = "П-Подождите минутку! Дайте мне ещё немного времени! П-Почему? Почему это опять происходит?!"
1008905-14 = "[ns3] «...Ару?»\n[ns4] Пойти на звук её голоса."
1008905-17 = ""
1008905-18 = "Хм. Это довольно затруднительно... Особенно для вас, мисс..."
1008905-19 = "П-Послушайте... Не то чтобы у меня нет денег! У меня очень много денег, просто—!"
1008905-20 = "О нет-нет. Я вас не осуждаю, так что не нужно смущаться. Такое иногда случается."
1008905-21 = "Мы с радостью могли бы оформить для вас долгосрочную рассрочку..."
1008905-22 = "Но переделки, которые вы запросили для своего наряда, довольно дорогие. Без первоначального платежа мои возможности ограничены."
1008905-23 = "Не то чтобы мы предполагаем, что вы оформите рассрочку, а потом не сможете платить. Мы верим, что сможете, просто таковы правила магазина. Прошу понять."
1008905-24 = "[s5] «Ару? Что здесь происходит?»\n[s6] Расспросить продавца о ситуации."
1008905-27 = "...А? Сенсей?"
1008905-28 = "Ну?"
1008905-29 = ""
1008905-31 = ""
1008905-32 = "Ч-Что ты здесь делаешь?!"
1008905-33 = "Я-я ведь должна была встретиться с вами в...!!"
1008905-34 = "*ахает*"
1008905-35 = "Я уже столько времени здесь?!"
1008905-36 = ""
1008905-39 = ""
1008905-40 = "[ns7] «А, понятно. Твою карту отклонили.»\n[ns8] «И поэтому ты не смогла оплатить переделку.»"
1008905-43 = "Префекторская команда снова нашла мой кредитный счёт и заморозила его. А я-то думала, что в этот раз идеально замела следы..."
1008905-44 = "*вздох*... На исправление уйдёт целая вечность. Какая морока..."
1008905-45 = ""
1008905-47 = ""
1008905-48 = "Хм..."
1008905-49 = "Ух! Я совсем НЕ хотела, чтобы вы увидели меня в таком положении! Серьёзно!"
1008905-50 = "И да. Наличные у меня есть. Проблема не в этом!"
1008905-51 = "В этот раз цена переделки просто заоблачная."
1008905-52 = ""
1008905-54 = ""
1008905-55 = "Это довольно дорогой наряд. Чтобы внести нужные изменения, потребуется много материалов и работы."
1008905-56 = "Тех денег, что у неё с собой, и близко не хватит..."
1008905-57 = "...Прошу прощения?"
1008905-58 = "Какой именно наряд? Вот тот, прямо там."
1008905-59 = ""
1008905-61 = ""
1008905-63 = "[ns9] «О... ЭТО платье...»\n[ns10] «Ага, его переделка действительно обойдётся недёшево.»"
1008905-66 = "Что же мне делать? Обычно переделки её повседневной одежды я записываю в кредит. Но теперь кредит заморожен. И что мне делать...?"
1008905-67 = "...А? Что вы сказали?"
1008905-68 = "Вы оплатите всю стоимость переделки?!"
1008905-69 = "Сенсей, нельзя!"
1008905-70 = "Значит, оплату я приму от вас? Хорошо. Молодая мисс и правда выглядела очень отчаявшейся."
1008905-71 = "Ура! Я спасена! Ахахаха!"
1008905-72 = ""
1008905-74 = ""
1008905-76 = "Оплатив переделку и забрав наряд, я вышел из магазина вместе с Ару."
1008905-77 = ""
1008905-81 = ""
1008905-82 = "Хи-хи... Спасибо, Сенсей. Я у вас в долгу."
1008905-83 = "Э-Эм, это... Как бы сказать...?"
1008905-84 = "Н-Нет. Дело не в том, что я должна сказать... скорее... эм..."
1008905-85 = "...Это и-инвестиция!"
1008905-86 = "Да, именно! Вы сделали значительную инвестицию в будущее меня и Решал 68!"
1008905-87 = "Так что... эм..."
1008905-88 = ""
1008905-90 = ""
1008905-91 = "С-Спасибо... Простите, если из-за моих ошибок я создала для вас лишние проблемы."
1008905-92 = "А?"
1008905-93 = "Такое постоянно случается?"
1008905-94 = "Вы хотите сказать, люди просто направо и налево всё покупают в кредит?!"
1008905-95 = "[s11] «В бизнесе хорошая кредитная линия жизненно важна.»\n[s12] «Я уже со счёта сбился, сколько раз мне приходилось брать заём у Будущего Сенсея!»"
1008905-98 = "*ах!*"
1008905-99 = "Х-Хи-хи... Вы всегда знаете, что сказать, Сенсей."
1008905-100 = "Понятно. Тогда, пожалуй, мои прежние слова теперь значат ещё больше."
1008905-101 = ""
1008905-103 = ""
1008905-104 = "...Спасибо за вашу инвестицию, Сенсей. Я, Рикухатима Ару, никогда не забуду вашу сегодняшнюю поддержку."
1008905-105 = "В следующий раз, когда вам что-нибудь понадобится, просто скажите!"
1008905-106 = "Хи-хи, хи-хи-хи...!"
1008905-107 = ""
1008905-109 = ""
1008905-110 = ""
1008905-111 = "...О, точно."
1008905-112 = ""
1008905-114 = "Если подумать..."
1008905-115 = "Куда мне отправить деньги, которые я вам должна?"
1008905-117 = ""
1008905-119 = "Несмотря на мои заверения, что возвращать деньги не нужно, Ару сразу же компенсировала мне стоимость переделки, как только её кредитный счёт разморозили."
