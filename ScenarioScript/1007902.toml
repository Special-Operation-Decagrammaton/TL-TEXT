[translation]
1007902-1 = "На всякий случай"
1007902-2 = "Я случайно заглянул в магазин электроники в городе, где остановилась Мисака."
1007902-3 = ""
1007902-7 = "Я заметил её у витрины с устройствами."
1007902-8 = ""
1007902-10 = ""
1007902-11 = "..."
1007902-12 = ""
1007902-14 = ""
1007902-15 = "...А, Сенсей. Сюда."
1007902-16 = "Ищу ли я что-то конкретное? Нет, не особо."
1007902-17 = "Я просто немного исследовала окрестности. Встретить вас здесь — чистое совпадение, Сенсей."
1007902-18 = "Хотя посмотреть здесь есть на что — больше, чем я ожидала."
1007902-19 = "Некоторые вещи примерно такие же, как дома, но в других отношениях... всё совершенно иначе."
1007902-20 = "Вся электроника здесь — брендов, которых я никогда раньше не видела."
1007902-21 = "Проводка и схемы внутри устройств мне незнакомы, но базовые принципы, похоже, такие же, как в моём мире..."
1007902-22 = "[s1] «Словно оказаться в другой стране...»\n[s2] «Наверное, чувствуешь себя туристом.»"
1007902-25 = "Верно. Но мы хотя бы говорим на одном языке, так что с общением проблем нет..."
1007902-26 = "Хм?"
1007902-27 = "А, хотите знать, как я исследовала электронику? Да. Это всё часть моей способности."
1007902-28 = "Я могу примерно понять, как внутри чего-то течёт электричество, даже не разбирая устройство."
1007902-29 = "Не то чтобы я проводила глубокий анализ или что-то такое."
1007902-30 = ""
1007902-32 = ""
1007902-33 = ""
1007902-34 = "С этим немного... Когда пытаюсь использовать способность, у меня всё ещё начинает болеть голова. Сосредоточиться трудно..."
1007902-35 = "Так с самого момента, как я попала в этот мир. Не знаю, дело ли в самом этом месте или..."
1007902-36 = "А. Я не больна, так что не волнуйтесь. Просто чувствую себя немного не так."
1007902-37 = "Это небольшая помеха, и только когда использую способности... Ничего серьёзного."
1007902-38 = "Бывают моменты, когда..."
1007902-39 = "Да... Немного раздражает, что я не могу использовать всю силу. Раньше я воспринимала это как должное."
1007902-40 = "Никогда не думала, что полагаюсь на неё, но, похоже, бессознательно использовала способность для множества вещей в повседневной жизни."
1007902-41 = ""
1007902-43 = ""
1007902-44 = "[ns3] «Может, в этом есть и хорошая сторона.»\n[ns4] «Есть что-то в твоих способностях, что тебя раздражает?»"
1007902-47 = "Это что, сеанс терапии? Не то чтобы я из-за этого в депрессии."
1007902-48 = "Ну... Ладно. Раз уж это говорите вы, я подумаю."
1007902-49 = "Что меня раздражало в моей способности..."
1007902-50 = "Было ли вообще что-то такое? Электричество... Электричество..."
1007902-51 = "О."
1007902-52 = ""
1007902-54 = ""
1007902-55 = "А...?"
1007902-56 = "Может быть...? Может, это...?"
1007902-57 = "[s5] «Может, что?»\n[s6] «Ты что-то вспомнила?»"
1007902-60 = "Сенсей! Стойте! Подождите здесь!"
1007902-61 = "Я хочу кое-что проверить! Скоро вернусь!"
1007902-62 = ""
1007902-64 = ""
1007902-65 = ""
1007902-66 = "[ns] Пойти за Мисакой."
1007902-68 = "Мисака сорвалась с места, а я последовал за ней в ближайший переулок."
1007902-69 = "Когда я догнал её, она стояла с поникшим выражением лица."
1007902-70 = ""
1007902-73 = ""
1007902-74 = ""
1007902-75 = ""
1007902-76 = ""
1007902-77 = "[ns7] «Мисака?»\n[ns8] «Что случилось?»"
1007902-80 = "..."
1007902-81 = ""
1007902-84 = "[ns9] «Это кошка?»\n[ns10] «Я слышу мяуканье...»"
1007902-87 = "Хмм... Я подумала: раз моя способность сейчас настолько слаба, то, может... только может быть..."
1007902-88 = "...Простите, Сенсей. Мне не стоило убегать одной, ничего не сказав."
1007902-89 = "Понимаете, кошки и другие животные обычно избегают меня из-за электрических способностей."
1007902-90 = "Раз здесь они намного слабее, я подумала, что всё может стать лучше..."
1007902-91 = "Но они всё равно убегают, даже когда я такая."
1007902-92 = "*вздыхает*"
1007902-93 = "Получается, одни минусы и никаких плюсов..."
1007902-94 = "..."
1007902-95 = "Хм?"
1007902-96 = "Думаете, она убежала просто потому, что дикая?"
1007902-97 = "Может, если найти кошку, которая доверяет людям, я хотя бы смогу её погладить...?"
1007902-98 = ""
1007902-100 = ""
1007902-101 = ""
1007902-102 = ""
1007902-103 = ""
1007902-104 = "Вы правда так думаете, Сенсей?"
1007902-105 = "[s11] «Не могу быть уверен на сто процентов, но...»\n[s12] «Попытка не повредит, правда?»"
1007902-108 = "Хмм. Вы правы."
1007902-109 = "Хорошо! Как сказал Сенсей, сдаваться ещё рано!"
1007902-110 = "Пойдём! Вы знаете хорошие места? Может, котокафе или зоомагазин?"
1007902-111 = "Ведите, Сенсей!"
1007902-113 = "Пока мы обходили местные зоомагазины и котокафе, Мисака буквально не находила себе места от предвкушения."
