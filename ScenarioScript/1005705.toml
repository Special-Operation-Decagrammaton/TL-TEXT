[translation]
1005705-1 = "Четыре элемента гастрономии"
1005705-2 = "Я ждал Харуну."
1005705-3 = ""
1005705-6 = "Здравствуйте, Сенсей."
1005705-7 = "Простите, что заставила ждать."
1005705-8 = "[s] «Я и сам недавно пришёл.»"
1005705-9 = "Понятно."
1005705-10 = "Я тут размышляла..."
1005705-11 = "Какой элемент в гастрономии самый важный?"
1005705-12 = "Дело ведь не может быть только в самой еде..."
1005705-13 = "К такому выводу я приходила снова и снова."
1005705-14 = "Поэтому сегодня я постаралась учесть все возможные факторы."
1005705-15 = "Хи-хи."
1005705-16 = "Теперь я наверняка смогу достичь высот вкуса."
1005705-17 = "[s] «Я за тебя болею.»"
1005705-18 = "Для начала я приготовила вот это."
1005705-19 = ""
1005705-21 = ""
1005705-23 = "Да. Осэти в трёхъярусных коробках."
1005705-24 = "Согласно традиционной теории, элементы гастрономии — это еда, время и тот, с кем ты ешь..."
1005705-25 = "Итак, у меня есть хорошая еда, идеальное время года для неё и вы, Сенсей."
1005705-26 = "Когда все эти элементы собраны вместе, думаю, нас ждёт беспрецедентный гастрономический опыт!"
1005705-27 = "[s] «Эм... Я не специалист по теории гастрономии, так что раз ты говоришь — ладно.»"
1005705-28 = "Хи-хи."
1005705-29 = "Пожалуйста, садитесь."
1005705-30 = "Остальное я беру на себя."
1005705-37 = "― Для настоящего гастрономического опыта важно многое:[wa:10]"
1005705-39 = "― сама еда, тот, с кем ты её ешь, время...[wa:400]"
1005705-42 = "― И, конечно, то, как именно ты ешь,[wa:580]"
1005705-44 = "― не менее важно."
1005705-47 = "― Хе-хе-хе. И я подумала...[wa:940]"
1005705-49 = "― почему бы нам сегодня не покормить друг друга?[wa:710]"
1005705-52 = "― Сначала я покормлю вас, Сенсей.[wa:2480]"
1005705-54 = "― Ну же, откройте рот. Скажите «а-а-а»...[wa:2000]"
1005705-57 = "― П-Поторопитесь уже.[wa:1720]"
1005705-59 = "― Мне тоже неловко...[wa:730]"
1005705-62 = "― Пока вы не попробуете кусочек с моей руки,"
1005705-64 = "― я ни на шаг не сдвинусь![wa:430]"
1005705-67 = "― Ну же... А-а-а...[wa:1320]"
1005705-70 = "Вам понравилось?"
1005705-71 = "[s1] «Б-Было вкусно!»\n[s2] «Н-Но в такой ситуации трудно сосредоточиться на вкусе!»"
1005705-74 = "Хи-хи. Понятно."
1005705-75 = "Тогда ещё один раунд. Скажите «а-а-а»..."
1005705-76 = ""
1005705-80 = ""
1005705-81 = "Теперь еда нравится вам ещё больше, правда?"
1005705-82 = "А теперь моя очередь."
1005705-83 = "[s] «Т-Твоя очередь?! Я должен тебя кормить?!»"
1005705-84 = "Ну да, такие вещи не должны быть односторонними."
1005705-85 = ""
1005705-87 = ""
1005705-88 = "Я жду, Сенсей. А-а-а..."
1005705-90 = "Мы кормили друг друга осэти, пока коробки не опустели..."
1005705-93 = "Хи-хи."
1005705-94 = "Трапеза, которую не забудешь."
1005705-95 = "Спасибо, Сенсей."
1005705-96 = "[s3] «Ну, раз ты счастлива...»\n[s4] «(Сначала я немного смущался, но, кажется, привык...)»"
1005705-99 = "У вас есть время ещё немного побыть со мной?"
1005705-100 = "У меня руки... немного замёрзли."
1005705-101 = ""
1005705-103 = ""
1005705-104 = "Вы в порядке, Сенсей?"
1005705-105 = ""
1005705-107 = ""
1005705-111 = "Мы коротали время, гуляя по городу рука об руку."
