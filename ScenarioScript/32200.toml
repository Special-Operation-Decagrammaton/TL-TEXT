[translation]
32200-1 = "Эпизод 20; Эпилог"
32200-2 = "В итоге Клуб дополнительных занятий сдал экзамен исключительно благодаря собственным знаниям."
32200-3 = "Теперь Кохару сможет вернуться в Отряд правосудия."
32200-4 = "Похоже, Ханако нашла место, которому принадлежит, так что причин бросать школу у неё больше быть не должно."
32200-5 = "Азуса открыла для себя радость учёбы."
32200-6 = "А Хифуми, пожалуй, самая искренняя и трудолюбивая участница клуба, сможет вернуться к обычной жизни."
32200-7 = "Мика заперта под стражей, возможно, навсегда."
32200-8 = "Эдемский договор Нагисы будет подписан по плану."
32200-9 = "..."
32200-10 = "Можно сказать, всё аккуратно завершилось и перевязано бантиком..."
32200-11 = "...но история ещё не закончена."
32200-12 = "У тебя всё ещё есть обязанность довести её до самого конца."
32200-13 = "Будь уверен: сколько бы поворотов ни сделала эта история..."
32200-14 = "...она неизбежно скатится в катастрофу."
32200-15 = ""
32200-17 = ""
32200-18 = ""
32200-19 = "Видишь их на горизонте?"
32200-20 = "Надвигаются тёмные тучи — настолько тёмные, что закроют солнце. Возможно, они уже никогда не рассеются."
32200-22 = "Всё ещё не кончено. Ты ведь знаешь это лучше всех, правда?"
32200-25 = "Приготовьтесь."
32200-27 = "О-О, наконец начинается? Будет больно, да? Точно будет больно."
32200-28 = "Ничего страшного. Боль — доказательство того, что ты жива."
32200-29 = "..."
32200-30 = "Х-Химэ что-то показывает жестами. Эм..."
32200-31 = "«Что с ней случилось?» Ты про ту девушку, Химэ?"
32200-32 = "..."
32200-33 = "Какая разница? Это был лишь вопрос времени."
32200-34 = ""
32200-36 = ""
32200-38 = "Достаточно."
32200-39 = "..."
32200-40 = "Видите те тёмные тучи? Скоро пойдёт дождь."
32200-41 = "Д-Дождь? Но я не люблю дождь. Он мокрый, холодный и раздражает... и проникает повсюду."
32200-42 = ""
32200-44 = ""
32200-45 = ""
32200-47 = "Борись сколько хочешь, Азуса, но тебе не сбежать."
32200-48 = "Истина въелась в саму твою сущность, и скоро тебе о ней напомнят."
32200-49 = "Таково пророчество."
32200-52 = "Всё тщетно. Жизнь в конечном счёте пуста."
32200-58 = "Эдемский договор;Продолжение в главе 3"
