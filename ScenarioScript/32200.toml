[translation]
32200-1 = "Episódio 20;Epílogo"
32200-2 = "...Todas do Clube de Aulas de Reforço conquistaram a aprovação com firmeza e com as próprias forças."
32200-3 = "Depois disso, a Koharu finalmente poderá voltar de cabeça erguida para o Comitê de Justiça."
32200-4 = "A Hanako parece ter encontrado boas companheiras, boas amigas para quem pode se mostrar como realmente é. Provavelmente, ao menos por enquanto, ela não deve mais estar pensando em largar a escola."
32200-5 = "A Azusa certamente poderá continuar aprendendo daqui para frente."
32200-6 = "E a Hifumi, que em certo sentido esteve mais na linha de frente do que qualquer outra e acumulou esforços sinceros, poderá voltar ao seu cotidiano de até então."
32200-7 = "...A Mika foi confinada na prisão da academia. Talvez nunca mais possamos nos encontrar."
32200-8 = "A Nagisa... conforme o programado, irá assinar o Tratado do Éden."
32200-9 = "..."
32200-10 = "Sim, até aqui foi uma história muito bem construída."
32200-11 = "...Mas ainda é cedo demais para os créditos finais."
32200-12 = "Afinal, o desfecho que você deve testemunhar ainda não revelou toda a sua forma."
32200-13 = "Não importa que rumo esta história venha a tomar..."
32200-14 = "Tudo converge para a catástrofe."
32200-19 = "...Nuvens negras."
32200-20 = "Nuvens negras que ninguém é capaz de conter, que fazem parecer impossível ver a luz do sol outra vez... estão se aproximando lentamente neste exato momento."
32200-22 = "Ainda há coisas pendentes, este não é o ato final... Certamente você sabe disso melhor do que ninguém, não é?"
32200-25 = "...Preparem-se, pessoal."
32200-27 = "A-Aah... F-Finalmente vai começar...!? Fi-Finalmente chegou a hora... Mas vai ser sofrido, não vai? Vai ser doloroso, não vai...?"
32200-28 = "...Sim. Mas tudo bem, o sofrimento é a prova de que estamos vivas."
32200-29 = "..."
32200-30 = "A-A Princesa está dizendo alguma coisa em língua de sinais. Hã..."
32200-31 = "...\"O que aconteceu com aquela garota\", você diz? Está curiosa, Princesa?"
32200-32 = "..."
32200-33 = "...Tanto faz, não é? No fim das contas, é só uma questão de acontecer mais cedo ou mais tarde."
32200-38 = "Chega dessa conversa."
32200-39 = "..."
32200-40 = "Nuvens escuras... Amanhã vai chover."
32200-41 = "Ch-Chuva? Que horrível, a chuva deixa tudo tão úmido e abafado... É sofrido e dá uma sensação péssima..."
32200-47 = "...Azusa. Por mais que se debata, você jamais conseguirá escapar."
32200-48 = "O seu corpo se lembra. Logo você deverá recordar a verdade."
32200-49 = "...Como dizem:"
32200-52 = "Tudo é em vão. Não importa aonde vá, tudo não passa de pura vaidade."
32200-58 = "Arco do Tratado do Éden;Continua no Capítulo 3"
