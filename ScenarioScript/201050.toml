[translation]
201050-1 = "Эпизод 5;Ошибка в памяти"
201050-2 = ""
201050-3 = "Вы... президент Генерального ученического совета...?"
201050-4 = "Конечно... Что с тобой, Рин?"
201050-5 = "Я знаю, что меня долго не было, но мы ведь не чужие друг другу..."
201050-6 = "Нет. Вы мне чужая. Кто вы?"
201050-8 = "...Рин."
201050-9 = "Наверное, ты злишься на меня за то, что я вот так исчезла."
201050-10 = "Я не хочу оправдываться, но позволь мне объяснить."
201050-11 = "Это был не пассивно-агрессивный выпад из-за злости. Я сказала именно то, что хотела сказать."
201050-12 = "Я вас не знаю. В моей жизни вообще нет никаких воспоминаний о человеке вроде вас."
201050-13 = "Я знаю, как выглядит президент. Поэтому то, что вы называете себя ею..."
201050-14 = "Если это чья-то шутка или нечто более опасное, мне это СОВЕРШЕННО не смешно."
201050-15 = "...Я очень хотела этого избежать."
201050-16 = "Протокольная команда, можете позвать сюда Аой... Нет, главу финансового отдела?"
201050-17 = "Скажите ей, что у меня есть опасения по поводу состояния главного администратора."
201050-18 = "(...Что она задумала?)"
201050-19 = "(Зачем ей ещё сильнее подставляться и звать сюда главу финансового отдела? Её ложь раскроется мгновенно.)"
201050-20 = ""
201050-22 = ""
201050-25 = ""
201050-26 = "А, Рин... Нет, главный администратор. Вот вы где."
201050-27 = "Я слышала, вы вчера так и не вернулись к себе. Неужели так соскучились по работе за время отдыха, что всю ночь просидели здесь?"
201050-28 = "Это полностью лишает ваш отдых всякого смысла."
201050-29 = "Сейчас проблема совсем не в этом. Эта незнакомка—"
201050-30 = "...В любом случае, зачем вы меня звали, президент?"
201050-31 = "...Что?"
201050-32 = "Аой, как ты только что назвала этого человека...?"
201050-33 = "...Президентом?"
201050-34 = "Она позвала меня сюда по делу..."
201050-35 = "Даже ты, Аой..."
201050-36 = "Тебе совсем не кажется странным, что этот человек прямо сейчас притворяется президентом?"
201050-37 = "Рин, о чём вы говорите?"
201050-38 = "За столом..."
201050-39 = "...сидит наш президент Генерального ученического совета."
201050-40 = ""
201050-42 = ""
201050-43 = ""
201050-44 = "А...? Президент? По-моему, она выглядит как всегда..."
201050-45 = "Может, ощущается немного иначе... но не знаю."
201050-46 = ""
201050-47 = "Конечно помню. Как можно забыть эти роскошные платиново-светлые волосы, прямо как картофельные чипсы со вкусом икры минтая?"
201050-48 = "Ты серьёзно утверждаешь, что у президентки были голубые волосы?"
201050-49 = "Эм, может, тебе стоит сначала посмотреть в словаре, что значит «платиновый»..."
201050-50 = ""
201050-51 = "Как выглядела президент Генерального ученического совета? Конечно, я помню!"
201050-52 = "У неё были розовые волосы и зелёные глаза..."
201050-53 = "Стоп, нет, так выглядела бывшая исполняющая обязанности президента Кая. А как выглядела президент...?"
201050-54 = "Может... чёрные волосы?"
201050-55 = ""
201050-56 = "Р-Рин... Вы снова и снова задаёте один и тот же вопрос, и я уже не знаю, что ответить."
201050-57 = "Для меня она выглядит как обычно."
201050-58 = ""
201050-60 = ""
201050-61 = "Эм... Возможно, это прозвучит немного грубо..."
201050-62 = "Но вам не кажется, что в последнее время вы слишком себя загоняли? Может, вам просто нужно хорошенько выспаться."
201050-63 = ""
201050-64 = "...Вы успокоились?"
201050-65 = "Это на тебя не похоже, Рин."
201050-66 = ""
201050-68 = ""
201050-69 = "Как же так... никто не помнит?"
201050-70 = "После всего, через что мы прошли вместе... Почему никто не помнит президента?"
201050-71 = "Я отказываюсь в это верить. Кто ты такая и как тебе удалось убедить всех, что ты — президент?"
201050-72 = "...Возможно, это моя вина."
201050-73 = "Может быть, я слишком многого от тебя требовала, попросив занять моё место, пока меня не было."
201050-74 = "Человеческая память ненадёжна, а сильный стресс или усталость действительно могут влиять на мозг. Так что ничего страшного, если ты меня не помнишь—"
201050-75 = "Нет. Я ничего не путаю."
201050-76 = "Даже если остальные не помнят, я всё это время хранила обрывки воспоминаний о ней."
201050-77 = "Смотрите. Вот фотография, которую я всегда ношу с собой — мы с президентом..."
201050-78 = ""
201050-80 = ""
201050-81 = ""
201050-82 = ""
201050-83 = "Как...?"
201050-84 = "Она... исчезла с нашей фотографии?"
201050-85 = "...Прости, Рин."
201050-86 = "Теперь я вернулась, так что ты можешь немного отойти от работы."
201050-87 = "Почему бы тебе не воспользоваться случаем и не взять хороший длинный отпуск?"
201050-88 = "...На этой фотографии точно была..."
201050-89 = ""
201050-93 = "[ns1] «Доброе утро, Ринни!»\n[ns2] «Хорошо выспалась?»"
201050-96 = ""
201050-97 = "Сенсей [USERNAME]!"
201050-98 = "Как раз вовремя. Мне нужно кое-что у вас спросить."
201050-99 = "Этот студент тоже кажется вам президентом Генерального студенческого совета?"
201050-100 = ""
201050-103 = "[ns3] «Она? Президент...?»\n[ns4] «Простите, но я её не знаю...»"
201050-106 = "Я так и знала!"
201050-107 = "Я знала, что не единственная помню, как на самом деле выглядела президент."
201050-108 = "И ведь... Ведь президент, которую помню я, не может быть неправильной, верно?"
201050-109 = "[s5] «Успокойся, Рин.»\n[s6] «Кажется, ей уже довольно неуютно.»"
201050-112 = ""
201050-115 = "[ns] «Давай сначала успокоимся и выслушаем её.»"
201050-116 = "О боже..."
201050-117 = "Я никогда раньше не видела, чтобы Рин вот так обращалась за помощью ко взрослому."
201050-118 = "Приятно видеть, что наша упрямая Рин хоть немного смягчилась, но мне от этого и немного грустно. Аха."
201050-119 = "[s] «...Можно попросить тебя представиться?»"
201050-120 = "Что ж. Приветствую."
201050-121 = "Я президент Генерального ученического совета, управляющего академическим городом Кивотос."
201050-122 = "Немного неловко говорить это самой, но в Кивотосе я довольно известна. Редко встретишь жителя, который не знает, кто я."
201050-123 = "Поэтому я удивлена, что вы меня не знаете."
201050-124 = "Вы прибыли сюда из-за пределов Кивотоса?"
201050-125 = "Если можно, я бы хотела, чтобы вы тоже представились."
201050-126 = "[s] «Я [USERNAME], Сенсей из Шале.»"
201050-127 = "Шале...?"
201050-128 = "Эм, а чем именно занимается эта организация «Шале»?"
201050-129 = "[s7] «Шале — Федеральный следственный клуб, организация с внесудебными полномочиями.»\n[s8] «Шале выслушивает студентов и решает их проблемы.»"
201050-132 = "Следственная организация с экстерриториальными полномочиями, стоящими выше власти отдельных академий..."
201050-133 = "...Уверена, для работы организации с такими полномочиями требовалось разрешение президента Генерального ученического совета."
201050-134 = ""
201050-136 = ""
201050-137 = "Однако я не помню, чтобы учреждала такую организацию."
201050-138 = "Я не могу просто закрыть на это глаза."
201050-139 = "[s] «...Что?»"
201050-140 = ""
201050-144 = "[ns] «...Серьёзно?!»"
