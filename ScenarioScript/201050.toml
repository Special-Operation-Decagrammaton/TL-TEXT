[translation]
201050-1 = "Episódio 5; Falha na Memória"
201050-2 = ""
201050-3 = "Você...... é a Presidente do Conselho Estudantil Federal?"
201050-4 = "Sim, sou eu mesma...... o que houve com você, Rin?"
201050-5 = "Reconheço que passei muito tempo ausente.#nMas agir como se fôssemos \"estranhas\" que acabaram de se conhecer......"
201050-6 = "Não. Eu nunca te vi na minha vida."
201050-8 = "...... Rin."
201050-9 = "Você ainda está ressentida por eu ter sumido do nada daquele jeito?"
201050-10 = "Sei que nada do que eu disser vai servir de desculpa.#nMesmo assim――"
201050-11 = "Não, eu estou sendo cem por cento literal."
201050-12 = "Nós estamos nos vendo pela primeira vez. Eu não conheço você.#nNem o seu rosto, nem a sua voz, absolutamente nada."
201050-13 = "A Presidente do Conselho que eu conheço não é você."
201050-14 = "Mesmo que isso seja alguma piada de mau gosto, já passou de todos os limites."
201050-15 = "...... Aconteceu alguma coisa séria, não aconteceu?"
201050-16 = "Com licença. Poderia chamar a Aoi agora mesmo...... digo, a Diretora Financeira?"
201050-17 = "Preciso ter uma conversa urgente sobre a Administradora-Chefe――"
201050-18 = "（O que raios essa garota tá pensando?）"
201050-19 = "（Assim que alguém aparecer aqui a farsa vai cair por terra, e ela ainda tem a audácia de chamar a Diretora Financeira――）"
201050-20 = ""
201050-22 = ""
201050-25 = ""
201050-26 = "Ora...... Administradora-Chefe Rin. Você estava aqui."
201050-27 = "Fiquei preocupada quando soube que você não voltou pro dormitório ontem.#nNão vai me dizer que a sua folga mal acabou e você já virou a noite trabalhando?"
201050-28 = "A gente se desdobrou inteira para te dar um descanso, assim não adianta nada."
201050-29 = "Esqueça isso por um instante e tire essa intrusa daqui――"
201050-30 = "E então...... precisa de alguma coisa, Presidente do Conselho?"
201050-31 = "...... Hã?"
201050-32 = "Aoi, como foi que você a chamou......?"
201050-33 = "Ué, aconteceu alguma coisa?"
201050-34 = "Eu só estou falando com a Presidente do Conselho Estudantil Federal."
201050-35 = "Aoi......"
201050-36 = "Você...... tá chamando essa pessoa de Presidente do Conselho?!"
201050-37 = "Rin-senpai, que pergunta mais sem pé nem cabeça é essa?"
201050-38 = "Ficar confirmando o óbvio uma hora dessas......"
201050-39 = "Ela é a nossa Presidente do Conselho Estudantil Federal, quem mais seria?"
201050-40 = ""
201050-42 = ""
201050-43 = ""
201050-44 = "...... A Presidente? Ué, ela sempre foi desse jeito, não?"
201050-45 = "Parece que a energia dela mudou um tiquinho...... mas só isso também, né?"
201050-46 = ""
201050-47 = "Mas é claro que eu lembro! Jamais esqueceria aquele cabelo loiro-platinado reluzente cor de batatinha de ovas apimentadas."
201050-48 = "Hã? O cabelo dela era azul-celeste......?"
201050-49 = "Não viaja, Rin! Cê tá confundindo as coisas."
201050-50 = ""
201050-51 = "A aparência da Presidente? Lembro perfeitamente!"
201050-52 = "Cabelo cor-de-rosa e olhos verdes penetrantes――"
201050-53 = "Opa, peraí, essa era a ex-interina Kaya, né? Humm, deixa eu ver, a Presidente era......"
201050-54 = "Cabelo preto...... será?"
201050-55 = ""
201050-56 = "S-Senpai...... mesmo que você me pergunte tantas vezes, eu não sei o que te responder."
201050-57 = "A Presidente do Conselho continua exatamente a mesma de sempre, sem mudar nada."
201050-58 = ""
201050-60 = ""
201050-61 = "É que...... com todo o respeito do mundo......"
201050-62 = "Será que de tanto trabalhar sem parar, a sua memória não acabou ficando meio confusa?"
201050-63 = ""
201050-64 = "...... Conseguiu se acalmar um pouco?"
201050-65 = "Você não parece nem um pouco com a Rin de costume hoje."
201050-66 = ""
201050-68 = ""
201050-69 = "Por que...... por que ninguém se lembra dela?"
201050-70 = "Vocês passaram tanto tempo juntas ao lado dela...... como podem ter esquecido?!"
201050-71 = "Aliás, justamente por isso...... quem é você afinal,#nque todo mundo insiste em chamar de Presidente do Conselho?!"
201050-72 = "Talvez...... a culpa de tudo isso seja minha."
201050-73 = "Por ter ficado tanto tempo longe, acabei jogando um fardo pesado demais nas suas costas."
201050-74 = "A memória humana pode ser facilmente distorcida por estresse extremo ou exaustão.#nPor isso, mesmo que a Rin não se lembre de mim――"
201050-75 = "Não!"
201050-76 = "Mesmo que ninguém se lembre...... os rastros e registros que ela deixou para trás ainda existem!"
201050-77 = "Se olharmos as fotos que tiramos com a Presidente――"
201050-78 = ""
201050-80 = ""
201050-81 = ""
201050-82 = ""
201050-83 = "Como assim......?"
201050-84 = "Apenas a Presidente...... sumiu da foto......?!"
201050-85 = "...... Me perdoe, Rin."
201050-86 = "Pode ficar tranquila e esquecer o trabalho por enquanto.#nEu assumo tudo daqui para frente."
201050-87 = "Já que estamos nisso, aproveite para descansar mais um pouco."
201050-88 = "De fato, esta foto......"
