201050-115 = "[ns] \"Que tal a gente ouvir o que ela tem a dizer primeiro?\""
201050-116 = "Nossa......"
201050-117 = "É tão raro ver a Rin confiando desse jeito num adulto."
201050-118 = "Acho uma mudança muito positiva, mas confesso que dá um aperto no coração, fufufu."
201050-119 = "[s] \"...... Você poderia nos contar quem é você?\""
201050-120 = "Com certeza. Muito prazer."
201050-121 = "Eu sou a líder máxima do Conselho Estudantil Federal, responsável pela gestão da cidade acadêmica de Kivotos. A Presidente do Conselho."
201050-122 = "Fica até meio sem jeito falar de mim mesma, mas meu rosto é bem conhecido por aqui.#nO estranho mesmo seria alguém em Kivotos não me conhecer......"
201050-123 = "Uma reação bem inusitada da parte de vocês."
201050-124 = "Você veio de fora de Kivotos por acaso?"
201050-125 = "Se não se importar, gostaria muito de ouvir a sua história também."
201050-126 = "[s] \"Eu sou o [USERNAME], o Sensei do Clube de Investigação Federal Schale.\""
201050-127 = "Schale......?"
201050-128 = "Que tipo de organização seria essa?"
201050-129 = "[s7] \"Um departamento federal com autoridade extralegal.\"\n[s8] \"Um órgão dedicado a ouvir e resolver os problemas das alunas.\""
201050-132 = "Uma agência extralegal que se sobrepõe à jurisdição de todas as academias......"
201050-133 = "Para dispor de uma autoridade colossal desse nível, exigiria autorização expressa da Presidente do Conselho."
201050-134 = ""
201050-136 = ""
201050-137 = "Só que eu não me lembro de ter concedido autorização nenhuma para algo assim."
201050-138 = "Isso é...... algo grave demais para eu simplesmente fazer vista grossa."
