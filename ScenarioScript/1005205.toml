[translation]
1005205-1 = "Повседневная жизнь секретаря Ноа"
1005205-2 = "Кафе возле Миллениума"
1005205-3 = "По дороге с работы я зашёл в ближайшее кафе."
1005205-4 = ""
1005205-6 = ""
1005205-7 = "...И заметил Ноа, глубоко задумавшуюся над стопкой документов."
1005205-8 = "[ns] «...Ноа?»"
1005205-9 = "О, Сенсей."
1005205-10 = "Прости, что не заметила тебя, я была поглощена работой."
1005205-11 = "[s] «И что это за работа, которая требует столько внимания?»"
1005205-12 = "Одна из моих обязанностей как секретаря «Семинара» — проверка патентов."
1005205-13 = "Скоро Премия Миллениума, поэтому все в Миллениуме работают на полную мощность, в том числе подают множество заявок на патенты."
1005205-14 = "Оценка и систематизация этих патентов как во время подачи, так и после неё — важная часть моей работы."
1005205-15 = "Обычно я работаю в клубной комнате, но сегодня такая хорошая погода, что мне захотелось пойти туда, где можно ей насладиться."
1005205-16 = "Навёрстывать работу под тёплым солнцем — по-своему уютно."
1005205-17 = "[s] «Я могу чем-нибудь помочь?»"
1005205-18 = "Не нужно."
1005205-19 = "Это моя работа, но мне она ещё и искренне нравится."
1005205-20 = "Если только... Сенсей, ты ведь не пытаешься снова вывести меня из равновесия под предлогом помощи? Хи-хи."
1005205-21 = "[s1] «Если помочь не могу...»\n[s2] «Не против, если я просто выпью кофе рядом с тобой?»"
1005205-22 = "Садись, конечно. Не обращай на меня внимания и отдыхай."
1005205-23 = "Конечно. Не обращай на меня внимания и отдыхай."
1005205-24 = "Или... можешь снова попробовать следить за каждым моим движением?"
1005205-25 = "[s] «С меня пока хватит ведения записей...»"
1005205-26 = "Хи-хи, шучу. В отличие от меня, у тебя, похоже, рабочий день уже закончился."
1005205-27 = "Кстати... Мне пора вернуться к этим бумагам."
1005205-29 = "Шло время, и аккуратные стопки проверенных документов становились всё выше."
1005205-30 = "Этот... налево... Этот... тоже налево..."
1005205-32 = "[ns] «Как ты распределяешь документы?»"
1005205-33 = "Их сортируют по тому, соответствуют ли потенциальные патенты базовым требованиям для рассмотрения."
1005205-34 = "Предложения, соответствующие требованиям, кладутся справа. Те, что не соответствуют, — слева."
1005205-35 = "[s] «Тогда все эти документы слева — это...»"
1005205-36 = "Да. Это предложения, не соответствующие базовым требованиям, и они будут отклонены."
1005205-37 = "К сожалению, существует множество причин, по которым не каждую идею можно зарегистрировать как патент."
1005205-38 = "Но успех рождается из неудач. Если эти провалы будут накапливаться, однажды из них может родиться изобретение, меняющее правила игры, а то и целую парадигму."
1005205-39 = "[ns] Просмотреть отклонённые документы."
1005205-40 = "Тебя заинтересовал двигатель Unlimited Boiler Works с эффективностью теплопередачи 99,99%?"
1005205-41 = "Предложение, безусловно, интересное, но патент получить нельзя, потому что само изобретение фактически не завершено."
1005205-42 = "Идея покрыть внутреннюю поверхность материалом с высокой теплоизоляцией разумна, но ни сам материал, ни способ такой изоляции не представлены."
1005205-43 = "[ns] «А это что...?»"
1005205-44 = "Исследовательский отчёт Клуба разработки новых материалов. Во время работы над улучшенными клеями они каким-то образом синтезировали новое взрывчатое вещество."
1005205-45 = "Открытие впечатляет, но одно лишь открытие ещё не гарантирует патент."
1005205-46 = "Патент — это не просто новое знание, а использование и конкретное применение этого знания."
1005205-47 = "[s] «А что насчёт этого?»"
1005205-48 = "В случае с маской, которая одновременно отбеливает кожу и зубы..."
1005205-49 = "С патентом всё в порядке... кроме того, что точно такую же вещь Инженерный отдел запатентовал ещё в прошлом месяце."
1005205-50 = "В конечном счёте патенты — это вопрос права собственности, а в мире патентов двух владельцев быть не может."
1005205-51 = "[s] «Мир патентов глубок...»"
1005205-52 = "Это может казаться жестоким, но патенты жизненно важны, чтобы настоящие создатели получали заслуженное признание."
1005205-53 = "Если патенты оформляются несправедливо, систему можно злоупотреблять, и это отбивает у создателей желание искать новые идеи."
1005205-54 = ""
1005205-56 = ""
1005205-57 = "Хм... Это..."
1005205-58 = "Что ж, эта патентная заявка ещё может пройти."
1005205-59 = "[s] «Почему ты сначала сомневалась?»"
1005205-60 = "Изобретение необычное, но базовым требованиям соответствует."
1005205-61 = "Более того, думаю, оно было бы очень полезно Миллениуму."
1005205-62 = "Хотите посмотреть, Сенсей?"
1005205-63 = ""
1005205-65 = ""
1005205-67 = ""
1005205-68 = ""
1005205-69 = "[ns3] «Собирает и анализирует поведенческие шаблоны Сенсея...»\n[ns4] «Устройство, которое отслеживает Сенсея по каждому его движению и мысли...?»"
1005205-70 = "Хи-хи. Интересно, правда?"
1005205-71 = "Хи-хи. Интересно, правда?"
1005205-72 = "Предиктивный анализ на основе моделей поведения и склонностей сам по себе не нов..."
1005205-73 = "Но это первый случай, когда его применяют к одному конкретному человеку, да ещё и учителю. Существующих патентов он не нарушает, а предложение очень... подробное."
1005205-74 = "И хотя оценка коммерческой жизнеспособности патента не входит в мои обязанности..."
1005205-75 = "Думаю, в Кивотосе найдётся немалый спрос на устройство, способное отслеживать тебя, правда?"
1005205-77 = "[ns5] «Это вторжение в мою личную жизнь!»\n[ns6] «Этот патент — полный абсурд!»"
1005205-78 = "Ох, это возражение?"
1005205-79 = "Ох, это возражение?"
1005205-80 = "Конечно, ты можешь подать заявление на признание патента недействительным, но..."
1005205-81 = "Устные просьбы недействительны. Пожалуйста, воспользуйся установленной процедурой и необходимыми документами."
1005205-83 = "После этого мы жарко спорили о том, действителен патент или нет. Почему-то мне кажется, что я проиграл."
