[translation]
1002303-1 = "Слабость Дисциплинарного комитета"
1002303-2 = "После тревожного сообщения Иори в MomoTalk я решил проследить за ней."
1002303-4 = ""
1002303-5 = ""
1002303-6 = ""
1002303-7 = "Надеюсь, никто этого не видел."
1002303-8 = "Я знаю, что это была ошибка, но из всех людей это сообщение должен был увидеть именно Сенсей..."
1002303-9 = ""
1002303-10 = "Теперь я опаздываю. Надо скорее к месту встречи."
1002303-11 = ""
1002303-13 = ""
1002303-15 = "[ns] Проследить за Иори."
1002303-17 = ""
1002303-18 = ""
1002303-19 = "Наконец-то ты пришла. Я уже заждался."
1002303-20 = "Ты принесла?"
1002303-21 = "Разумеется."
1002303-22 = "Никогда бы не подумал, что холодная и расчётливая специалистка Дисциплинарного комитета Геенны станет связываться со мной через тайные каналы."
1002303-23 = "У меня не было другого выбора. Если бы я попыталась купить это обычным способом, другие студенты бы заметили."
1002303-24 = "В любом случае, ты ведь сохранишь это в секрете?"
1002303-25 = "Конечно. Конфиденциальность клиентов — в наших же интересах."
1002303-26 = "Ну что, посмотрим товар?"
1002303-27 = ""
1002303-29 = ""
1002303-30 = ""
1002303-31 = "Всё в порядке."
1002303-32 = "Вот твои деньги."
1002303-33 = "[s] «Что здесь происходит?»"
1002303-34 = "Какого...? Сенсей?!"
1002303-35 = "Ч-Что ты здесь делаешь?!"
1002303-36 = "[s] «Я пошёл за тобой из-за твоего сообщения.»"
1002303-38 = "Ты ЧТО?! Всё это время преследовал меня?!"
1002303-39 = "Ты отвратителен! Умри, извращенец!"
1002303-40 = "[s] «Но подозрительно ведёшь себя именно ты.»"
1002303-41 = "Здесь нет ничего подозрительного."
1002303-42 = "Я всего лишь продал ей—"
1002303-43 = "Стой! Ты только что не говорил, что конфиденциальность клиентов в твоих интересах?"
1002303-44 = "Почему ты так легко всё выбалтываешь?!"
1002303-45 = "Но разве не будет не менее неприятно, если поползут слухи, будто ты покупала что-то незаконное?"
1002303-46 = "Ты в любом случае проигрываешь, так что лучше всё прояснить."
1002303-47 = "Это так, но..."
1002303-48 = "[s] «Просто скажи честно. Я выслушаю.»"
1002303-49 = ""
1002303-51 = ""
1002303-52 = "...Нарукавники."
1002303-53 = "[s] «Что?»"
1002303-54 = "Я сказала, что покупала надувные нарукавники."
1002303-55 = "[s] «Что?»"
1002303-56 = ""
1002303-58 = ""
1002303-59 = "Я СКАЗАЛА, НАРУКАВНИКИ! Такие, которые надевают на руки и пояс, чтобы легче было плавать!"
1002303-60 = "Вот почему я не хотела, чтобы меня поймали! Теперь ты будешь надо мной смеяться!"
1002303-61 = "[s] «Зачем тебе покупать нарукавники?»"
1002303-62 = "Потому что я не умею плавать!"
1002303-63 = "Из-за дел Дисциплинарного комитета я часто пропускаю занятия по плаванию в Геенне."
1002303-64 = "А что будет, если беглец попытается скрыться по воде, а я не смогу плыть? Это будет катастрофа."
1002303-65 = "Поэтому я тайно покупала эти нарукавники, чтобы тренироваться плавать."
1002303-66 = "И из всех людей меня должен был поймать именно ты..."
1002303-67 = "[s] «Я научу тебя плавать.»"
1002303-68 = "Что? Зачем тебе это?"
1002303-69 = "...У тебя ведь какие-то грязные скрытые мотивы, да? Меня не обманешь."
1002303-70 = "[s] «Но со мной всё пойдёт намного быстрее, чем если ты будешь тренироваться одна.»"
1002303-71 = "Не могу сказать, что ты неправ, но..."
1002303-72 = ""
1002303-74 = "(Нет смысла скрывать от Сенсея, что я не умею плавать.)"
1002303-75 = "(Может, это и к лучшему. Пусть уж узнает Сенсей, чем кто-то из других студентов.)"
1002303-76 = ""
1002303-78 = "Ладно. Я согласна..."
1002303-79 = "...но если начнёшь вытворять что-нибудь странное, я убью тебя на месте."
1002303-80 = "[s] «Я постараюсь.»"
1002303-81 = "Что значит «постараюсь»?! Просто держи руки при себе!"
1002303-83 = "Я усердно тренировался плавать вместе с Иори до поздней ночи."
