[translation]
10001030-1 = "Эпизод 3; Спецотряд №227"
10001030-2 = "Заснеженные горы академии Красная Зима"
10001030-4 = ""
10001030-5 = "Уф... Мы уже целый час идём..."
10001030-6 = "Куда мы вообще направляемся? Я даже не вижу ничего похожего на здание!"
10001030-7 = "Сколько ещё до места назначения?"
10001030-8 = "Академия Красная Зима знаменита тем, что она крупнейшая среди всех академий Кивотоса. До окраин, боюсь, идти немного дольше."
10001030-9 = "Я понимаю, но всё же!"
10001030-10 = "Уф... Ноги ужасно болят. Я больше ни шагу!"
10001030-11 = "Тогда, может, немного отдохнём?"
10001030-12 = ""
10001030-13 = "Хотя нет. У меня есть идея!"
10001030-15 = ""
10001030-16 = ""
10001030-17 = "Товарищ, неси меня на спине!"
10001030-18 = "[s1] Сделать, как говорит Черино.\n[s2] Сделать вид, что не услышал её."
10001030-19 = ""
10001030-21 = ""
10001030-22 = "Не может быть, что ты меня не услышал!"
10001030-23 = "Если сам не посадишь меня на спину, я заберусь туда сама!"
10001030-24 = ""
10001030-26 = ""
10001030-29 = "У-у-у... Т-тут выше, чем я думала..."
10001030-30 = "Но отсюда видно намного дальше, и воздух такой свежий!"
10001030-31 = "Значит, вот как Марина и Томоэ видят мир..."
10001030-32 = ""
10001030-33 = "Ого, ты только посмотри!"
10001030-34 = ""
10001030-35 = "Ты словно обезьянка, висящая на дереве! Такая милая... то есть... величественная!"
10001030-36 = "Т-ты так думаешь? Хи-хи-хи..."
10001030-37 = "Как насчёт фотографии на память?"
10001030-38 = ""
10001030-39 = "Пожалуйста! Теперь-то я точно не потеряюсь на фотографии, раз нахожусь так высоко!"
10001030-40 = ""
10001030-41 = ""
10001030-43 = ""
10001030-44 = ""
10001030-45 = ""
10001030-47 = ""
10001030-49 = ""
10001030-50 = "Ого! Смотри, Черино. На спине Сенсея ты кажешься такой высокой!"
10001030-51 = "Так, посмотрим..."
10001030-52 = ""
10001030-53 = ""
10001030-54 = "И правда!"
10001030-55 = "Хи-хи. Отлично. Когда верну власть, прикажу кому-нибудь постоянно носить меня на спине."
10001030-56 = "И больше никто никогда не сможет смотреть на меня свысока! Ха-ха-ха!"
10001030-57 = "Прекрасная идея, президент Черино."
10001030-58 = "Уверена, вид того, как вы торжественно отдаёте приказы, сидя у кого-то на спине, заставит студентов Красная Зима ещё сильнее уважать вашу власть."
10001030-59 = "Вот именно! Когда я вернусь в секретариат, Марина будет носить меня на спине!"
10001030-60 = "Но сначала, разумеется, она будет наказана за весь этот переворот!"
10001030-61 = "Как насчёт месяца кормления кроликов? Хотя нет, кролики милые. Нужно что-нибудь страшное и неприятное..."
10001030-64 = "[ns] «Я-я устал...»"
10001030-65 = "О, вам неудобно, Сенсей?"
10001030-66 = "Хотя... надеюсь, вы не хотите сказать, что наш Великий лидер слишком тяжёлая. Она лёгкая как пёрышко!"
10001030-67 = "Как представитель Шале, вы ведь не собираетесь бросать президента, которой тяжело идти, правда?"
10001030-68 = "[s] «Нет, но...»"
10001030-70 = "Чего медлишь, товарищ? Марина может быть прямо у нас за спиной!"
10001030-71 = "Нам нужно как можно скорее добраться до старого школьного здания!"
10001030-72 = "Но-о, пошёл!"
10001030-74 = "После этого я ещё почти час шёл по горной дороге с Черино на спине..."
10001030-76 = "Бывший институт академии Красная Зима"
10001030-78 = "Мы наконец прибыли, президент. Добро пожаловать в Старый институт."
10001030-79 = "Хотя он давно заброшен, когда-то это было славное место, где студенты Красная Зима проводили юность и усердно учились."
10001030-80 = "А теперь это просто грязные старые развалины..."
10001030-81 = "И довольно жуткие. Кажется, будто в любую секунду может выскочить медведь."
10001030-82 = "Томоэ, нам правда нужно здесь оставаться?"
10001030-83 = "Да, но однажды вы обязательно вернётесь в секретариат."
10001030-84 = "Но пока председатель Марина охотится за вами, возвращаться нельзя."
10001030-85 = "Если будете стараться, уверена, сможете вернуться раньше, чем думаете!"
10001030-86 = "П-Правда?"
10001030-87 = "Похоже, без моей власти ничего не сдвинется с места!"
10001030-88 = "Хорошо, отныне это здание станет нашим командным центром, и отсюда мы отвоюем секретариат!"
10001030-90 = "А кто сказал, что ты можешь вот так решать?!"
10001030-91 = "К-кто здесь?! Э-это м-медведь?"
10001030-92 = ""
10001030-94 = ""
10001030-98 = ""
10001030-99 = "М-медведь? Где?!"
10001030-100 = "Успокойся, Нодока. Президент Черино просто с перепугу всё себе вообразила."
10001030-102 = "Перепугалась? Я? Н-никогда!"
10001030-103 = "Кстати, вы ведь...?"
10001030-104 = "Хмф. Наконец-то нас узнала?"
10001030-105 = ""
10001030-106 = "...Вообще-то нет. Понятия не имею."
10001030-107 = "Что?! Ты правда забыла, кто мы? Не могу поверить!"
10001030-108 = "Мы терпеливо сидели здесь, среди развалин Старого института, потому что думали, что ты вернёшься и позволишь нам вернуться в главный кампус!"
10001030-109 = "Всё ещё ничего не вспоминаю..."
10001030-110 = "Главный секретарь Томоэ, у нас здесь, в Старом институте, всегда был какой-то клуб?"
10001030-111 = "Официально — нет, но здесь есть место содержания отстранённых студентов под названием «Спецотряд №227»."
10001030-112 = "Но ведь отстранение временное, да? Почему эти студенты всё ещё здесь? Разве им не пора вернуться в главный кампус?"
10001030-113 = "А. Ну, вернуться они могут только после соответствующего приказа от кого-то... то есть от вас."
10001030-114 = "...Точно! Ты та извращенка, которую отстранили за то, что она следила за нашим товарищем в телескоп с крыши кампуса!"
10001030-115 = "Я была так занята руководством нашей славной академией, что совсем об этом забыла!"
10001030-116 = "Ты сослала нас в этот промёрзший северный ад и забыла о нас?! Как можно быть настолько безответственной?!"
10001030-117 = "Ты вообще понимаешь, насколько тяжело здесь просто выживать?"
10001030-118 = "Какие там сладости. Мы даже нормальной еды не получаем!"
10001030-119 = "И у нас нет обогревателя, чтобы переживать этот лютый холод."
10001030-120 = "А в одеялах водятся жуки!"
10001030-121 = "И иногда снаружи бродит голодный медведь..."
10001030-122 = "Т-так здесь правда есть медведь?!"
10001030-123 = "Я-я не могу здесь оставаться, Томоэ. Р-разве нам больше некуда пойти?"
10001030-124 = "Прости, Черино, но сейчас тебе пора показать, что именно делает тебя лидером академии Красная Зима."
10001030-125 = "Но медведи такие страшные..."
10001030-126 = "Ладно, раз ты здесь, президент, значит, мы наконец можем уйти?"
10001030-127 = "Эм, я..."
10001030-128 = "К сожалению, сейчас у нас нет полномочий отменить ваше отстранение."
10001030-129 = "П-почему?"
10001030-130 = "Президент Черино сейчас в бегах. Её свергли в результате переворота."
10001030-131 = "Всё из-за этой проклятой Марины! Если бы не она, я бы не оказалась в этом ужасном месте!"
10001030-133 = "То есть теперь ты просто беспомощная малявка?"
10001030-134 = "Какое разочарование."
10001030-135 = "Гр-р...! Я не малявка!"
10001030-136 = "Пусть сейчас я и не у власти, но я всё ещё Великий лидер академии Красная Зима, Благоустроитель земель и начальник санитарной службы... Я великая Черино, стоящая над всеми!"
10001030-137 = "Узрите мои великолепные усы и знайте своё место!"
10001030-138 = ""
10001030-139 = "Да кому есть дело до твоих накладных усов?!"
10001030-140 = ""
10001030-141 = "Ч-что ты только что сказала...?"
10001030-142 = ""
10001030-143 = ""
10001030-144 = ""
10001030-145 = "Т-Томоэ, откуда они знают, что усы ненастоящие?"
10001030-146 = ""
10001030-147 = "Уверена, она просто случайно угадала. Вам не о чем беспокоиться."
10001030-148 = "К-конечно! Эта девчонка просто грязная соплячка и сама не понимает, что говорит!"
10001030-149 = "И не думай, что я забыла, как ты извращённо подглядывала за Сенсеем в телескоп с крыши!"
10001030-150 = "Я-я не извращенка!"
10001030-151 = "И вообще, разве ты не приехала сюда на спине Сенсея?"
10001030-152 = "(Х-хотя я немного завидую...)"
10001030-153 = "Ты куда большая извращенка, чем я!"
10001030-154 = "Эта поездка на спине была лишь демонстрацией связи между мной и моим товарищем! Если ты считаешь это извращением, значит, у тебя самой грязные мысли!"
10001030-155 = "Только извращенка стала бы следить за Сенсеем!"
10001030-156 = "Я не следила за Сенсеем! Это было совершенно нормальное проявление уважения издалека!"
10001030-157 = "Ты просто бесишься, потому что ниже меня!"
10001030-158 = "Ты младше меня, проявляй уважение!"
10001030-159 = "[s] «Они ссорятся как младшеклассницы...»"
10001030-160 = "Надо же, энергии у них обеих хоть отбавляй."
10001030-161 = "Но пока председатель Марина остаётся у власти, мы ничего не решим, если продолжим ссориться между собой."
10001030-162 = "Если не хотите оставаться здесь, помогите нам вернуть должность нашему Великому лидеру."
10001030-163 = "Ты предлагаешь мне работать вместе с этой мелкой соплячкой?"
10001030-164 = "Отказываюсь!"
10001030-165 = "Взаимно! Я не стану работать с такой грязной извращенкой!"
10001030-166 = "Вы обе упрямые как ослы... Вот это задачка."
10001030-167 = ""
10001030-168 = ""
10001030-170 = ""
10001030-171 = "Есть способы решить спор о том, кто из вас взрослее!"
10001030-172 = "Шигурэ?"
10001030-173 = "В старых историях говорится, что настоящий взрослый может выпить целую бочку вина и не опьянеть!"
10001030-174 = "Так что в этом духе устроим состязание по выпивке и выясним, кто тут ребёнок, а кто взрослый!"
10001030-175 = "Шигурэ, пусть мы и не в кампусе, но алкоголь всё равно запрещён правилами академии Красная Зима!"
10001030-176 = "Ой, прости, я и не предлагала пить настоящий алкоголь."
10001030-177 = "Вместо этого у меня есть особый компот, который я приготовила к фестивалю Ивана Купалы!"
10001030-178 = "Но поскольку холодильник у нас здесь так себе, он мог немного забродить..."
10001030-179 = "Звучит подозрительно..."
10001030-180 = "Если страшно, президент, можешь не участвовать."
10001030-181 = "Хотя, наверное, если откажешься, то так навсегда и останешься трусихой в глазах остальных."
10001030-182 = "С-страшно? Мне?! Да я что угодно выпью!"
10001030-183 = "Я-я тоже! Я ни за что не проиграю!"
10001030-184 = "Отлично. Наконец-то компот, который я приготовила прошлой осенью, дождался своего часа!"
10001030-186 = "Вскоре Шигурэ вернулась с напитками с фруктовым и кисловатым запахом."
10001030-187 = ""
10001030-190 = ""
10001030-191 = ""
10001030-192 = ""
10001030-193 = "Эм... Шигурэ, ты уверена, что здесь нет алкоголя?"
10001030-194 = "П-погоди, это ведь тот студент, которого отстранили за то, что он добавлял водку в компот...?"
10001030-195 = "Ладно, хватит болтовни."
10001030-196 = "На старт..."
10001030-197 = "Внимание. Марш!"
