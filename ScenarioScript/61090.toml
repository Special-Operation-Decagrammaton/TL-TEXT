[translation]
61090-1 = "Эпизод 9;Урок начинается"
61090-2 = "Фух..."
61090-3 = "У-Ух...!"
61090-4 = ""
61090-6 = ""
61090-7 = ""
61090-8 = "...Разница была всего в одну пулю."
61090-9 = "Хотя мы всё равно победили."
61090-10 = "...Немного заржавели, да, отряд?"
61090-11 = "Не могу этого отрицать."
61090-12 = "Нам было трудно поймать привычный ритм."
61090-13 = "...!"
61090-14 = "И что теперь будете делать?"
61090-15 = "Мы более чем доказали здесь свою «ценность»."
61090-16 = ""
61090-18 = ""
61090-19 = "Правила... есть правила, наверное..."
61090-20 = "Ух! Эти предательницы, ещё и такие высокомерные!"
61090-21 = "Наверняка снаружи они успели влезть во всевозможные безумные драки! У нас с самого начала почти не было шансов."
61090-22 = "Но они даже Ариус защитить не смогли, а теперь думают, что могут здесь командовать?"
61090-23 = "Мелкие—!"
61090-24 = "Всё в порядке, Мисаки. Всё будет хорошо."
61090-25 = "Мы не вправе обесценивать их обиду."
61090-26 = "Этот «Сенсей» именно такой! Эгоистичный и упрямый!"
61090-27 = "Он делает вид, что заботится о нас как об «студентах», а сам только и ждёт возможности ударить в спину!"
61090-28 = ""
61090-30 = ""
61090-33 = ""
61090-34 = ""
61090-35 = "А-а?!"
61090-36 = "Э-Эй! Ты в порядке?!"
61090-37 = "Она отключилась..."
61090-38 = "Д-Два выстрела в грудь и один в голову. Я едва успела заметить, как это произошло."
61090-39 = "Это совсем не похоже на навыки того, кто заржавел!"
61090-41 = "А-Ацуко?!"
61090-42 = "Хи-хи-хи-хи..."
61090-43 = "Мы стерпим всё, что вы захотите бросить в нас, но вам лучше не направлять ничего из этого на Сенсея."
61090-44 = "Надеюсь, хотя бы настолько здравого смысла у вас хватит."
61090-45 = "Я ведь тоже из Ариуса. Понятно?"
61090-46 = "Е-Есть, госпожа!"
61090-47 = "..."
61090-49 = "После... вспышки Ацуко воздух стал заметно неловким и пугающим."
61090-50 = "Поскольку напряжение было предельным, я решил воспользоваться моментом и немного разрядить обстановку."
61090-51 = "[ns] «Ну что, детишки! Приступаем к учёбе!»"
61090-52 = "М-Можете так говорить, но у нас нет ничего из того, что бывает в обычной школе."
61090-53 = "Наши классы давно заброшены. У нас нет ни учебных материалов, ни программы, ни учителей."
61090-54 = "...Вы правда хотите, чтобы я продолжала?"
61090-55 = "[s1] «Не забивайте голову мелочами!»\n[s2] «Вам достаточно знать про стулья, парты и доску.»"
61090-56 = ""
61090-57 = ""
61090-60 = "[ns] «А учителей я уже присмотрел!»"
61090-61 = ""
61090-64 = "...Вот, значит, как."
61090-65 = "[s3] «Идеально! Для начала поднимем стулья!»\n[s4] «Смотрите, тут даже есть кафедра и доска!»"
61090-68 = "В Ариусе не так много словарей..."
61090-69 = "...но, видимо, определение слова «идеально» когда-то изменилось."
61090-70 = "В любом случае уже поздно. Скоро зайдёт солнце."
61090-71 = "[s5] «Всё хорошо! Первый урок — скорее вводное занятие!»\n[s6] «Просто краткий обзор, а затем перекличка!»"
61090-74 = "В-Вы уверены, Сенсей?"
61090-75 = "[s] «Конечно! Ты справишься, Саори!»"
61090-76 = "?!"
61090-77 = "!?"
61090-78 = "Ч-Что? Что именно я должна делать, Сенсей?"
61090-79 = "[s7] «Ты станешь одной из наших учителей-практикантов...»\n[s8] «...и проведёшь первый урок!»"
61090-82 = "Когда... это было решено, Сенсей?"
61090-83 = "...Только что? А. Простите, что вообще спросила."
61090-84 = "Это... Это и был ваш «грандиозный план», Сенсей?!"
61090-85 = "Поэтому вы спрашивали, продолжаем ли мы учиться?"
61090-86 = "*вздыхает* Теперь всё понятно."
61090-87 = "Н-но я... я..."
61090-88 = "[s] «Ура! Мы готовы к уроку, госпожа Джомаэ!»"
61090-89 = "Да. Я готова, госпожа Саори."
61090-90 = "Ацуко, и ты туда же?!"
61090-92 = "Саори выглядела измученной и ужасно неловкой, когда встала за кафедру."
61090-93 = ""
61090-94 = "(Что мне вообще преподавать? И как?)"
61090-95 = "(Это... учебник по обществознанию о... теории общественного договора?)"
61090-96 = ""
61090-98 = ""
61090-99 = "(Я это знаю!)"
61090-100 = "Класс! Садитесь по местам, начинаем."
61090-101 = "А? Почему мы должны садиться только потому, что она сказала?"
61090-102 = "Ну... вообще-то мы уже сидим..."
61090-103 = "Откройте тетради! Если тетради нет, используйте ученический справочник Ариуса! Уж он-то у каждой из вас точно есть."
61090-104 = "Если вам совсем не на чем писать, потом перепишите конспект у соседки."
61090-105 = "Обязательно записывайте! Никогда ничего не запомните, если будете просто говорить себе, что и так всё удержите в голове."
61090-106 = "П-Поняла!"
61090-107 = "И-и... Меня накрывают воспоминания о тех временах, когда Саори была нашим инструктором..."
61090-108 = "Прежде чем начать, я должна донести до каждой из вас одну крайне важную вещь."
61090-109 = ""
61090-111 = ""
61090-112 = "Договоры важны!"
61090-113 = "«Договоры»?"
61090-114 = "Ч-Что это? Что-то из внешнего мира?"
61090-115 = "Договор — это документ, составленный между двумя сторонами и служащий юридическим подтверждением их взаимного соглашения и согласованных условий."
61090-116 = "Неважно, насколько идеально, сильно или эффективно вы работаете! Без договора вам никогда не заплатят!"
61090-117 = "Вы изрежете руки, вложите всю душу и сердце, а уйдёте ни с чем! Даже без достоинства! И это будет происходить снова, снова и снова!"
61090-118 = "Д-Думаете, с ней всё в порядке?"
61090-119 = "Вот именно. Это прозвучало очень уж лично..."
61090-120 = "Держись, Сао-Сао!"
61090-121 = "С-Саори...!"
61090-123 = "Итак, теория общественного договора утверждает, что общество не имеет собственного, естественного смысла, а является искусственной конструкцией, поддерживаемой согласием и соблюдением правил его участниками."
61090-124 = "И хотя его происхождение искусственно, общество исходит из того, что каждый его участник с рождения наделён неотъемлемыми правами."
61090-125 = "П-Простите... У меня вопрос..."
61090-126 = "Что такое, Майя?"
61090-127 = "Если общество ненастоящее, разве это не означает, что эти «неотъемлемые права» тоже ненастоящие?"
61090-128 = "Хороший вопрос. На первый взгляд это утверждение и правда кажется противоречивым."
61090-129 = "Но общество держится на допущениях и соглашениях."
61090-130 = "Всем выгодно исходить из того, что каждый человек рождается с тем, что мы называем «правами человека»."
61090-131 = "И такое допущение создаёт для общества более прочный фундамент."
61090-132 = "Так что да. Всё это не является чем-то объективно реальным или истинным. Но решение верить в это в конечном счёте приносит пользу всем."
61090-133 = "Никогда раньше не думала об этом так!"
61090-134 = ""
61090-136 = ""
61090-137 = "И на сегодня всё."
61090-138 = "Если появятся вопросы, запишите их и принесите на следующий урок."
61090-139 = "Было бы нечестно требовать от вас готовиться заранее. Но хотя бы повторите то, что сможете."
61090-140 = "Повторение — одна из важнейших частей учёбы."
61090-143 = ""
61090-144 = "Эм... Ну как я справилась, Сенсей?"
61090-145 = "[s9] «Даже лучше, чем ожидалось, госпожа Джомаэ...»\n[s10] «Как коллега-учитель, я был тронут!»"
61090-148 = "Я пока не совсем привыкла, когда меня так называют."
61090-149 = "Но спасибо. Мне стало спокойнее."
61090-151 = "[ns] «А теперь физика, госпожа Имашино!»"
61090-152 = "Что, простите? Именно физика? Что это ещё такое, Сенсей?!"
61090-153 = "Что? Баллистика — это в основном классическая механика? Это...!"
61090-154 = "..."
61090-155 = "...Вообще-то это правда. И от этого я злюсь ещё сильнее."
61090-156 = "Уф. Ладно."
61090-159 = "Для начала запомните формулы! Вы все впервые по-настоящему напрягаете мозг!"
61090-160 = "Так что мои ожидания невысоки! По крайней мере, пока мы не продвинемся дальше по программе."
61090-161 = "Радуйтесь, что математика и физика начинаются с запоминания формул!"
61090-162 = "Если вы уже понимаете всё, о чём я говорю, считайте себя гениями. Идите становиться физиками или ракетостроителями."
61090-163 = "...Хотя чем ты умнее, тем легче твой взгляд сужается до одних чисел и фактов."
61090-164 = "Сочувствие и сострадание тоже играют свою роль в науке."
61090-165 = ""
61090-166 = "Здравствуйте. Я Хакари Ацуко, и сегодня буду преподавать вам биологию."
61090-167 = "Сразу перейдём к уроку. Биология и интересна, и важна."
61090-168 = "Например, что такое ген?"
61090-169 = "Какой процесс позволяет живым существам производить потомство?"
61090-170 = "[s] «Ацуко! Стой! СТО-О-ОЙ!»"
61090-171 = "Хм? Вы предлагаете мне пропустить важную теорию, Сенсей?"
61090-172 = "Хи-хи. Не волнуйтесь. Можете мне доверять, Сенсей."
61090-173 = "Тогда почему бы не начать с того, что такое мейоз?"
61090-175 = "На этом мы завершаем знакомство с компонентами и органеллами клетки, включая гены."
61090-176 = "Если запомните только одну вещь, запомните: клетка — базовая единица жизни."
61090-178 = "..."
61090-179 = "Эм. Ну. П-Привет всем. Эм... давно не виделись."
61090-180 = "Т-Так вот."
61090-181 = ""
61090-183 = ""
61090-184 = "Ч-Что я вообще здесь делаю, Сенсей?!"
61090-185 = "Я не такая, как остальные! Я просто много журналов читаю!"
61090-186 = "[ns] «...!»"
61090-188 = "[ns] «(Стоило ей упомянуть журналы, и я сразу понял решение!)»"
61090-189 = "А? Вы хотите, чтобы я рассказала, как люди живут снаружи?"
61090-190 = "Например, что они носят, что едят, как живут... Всё то, что я видела в журналах...?"
61090-191 = "..."
61090-192 = "Я-Я вполне смогу! Наверное!"
61090-194 = "Е-Если вы не против, я начну сначала... Привет всем."
61090-195 = "М-Может прозвучать совсем внезапно, но... Эм..."
61090-196 = "Что вы все думаете о моде?"
61090-197 = ""
61090-200 = "Хи-хи... Знаю, это не кажется чем-то особо важным или тем, чему учат в школе..."
61090-201 = "Но мода на самом деле — это просто... выбор того, каким ты хочешь казаться другим..."
61090-202 = "Мне кажется, это куда важнее, чем можно подумать!"
61090-203 = "И вообще-то это большая часть повседневной жизни людей снаружи...!"
61090-205 = "Лекция Хиёри о моде и повседневной жизни понравилась студентам больше всех четырёх."
61090-206 = ""
61090-209 = "Помогло и то, что их учителями были ровесницы — люди, которых они уже знали и с которыми выросли."
61090-210 = "Постепенно мы разрушали настороженность остальных студентов по отношению к учёбе."
61090-211 = "И это был мой сигнал вмешаться!"
61090-213 = "[ns11] «Из всего, что мы обсудили, можно сделать следующий вывод.»\n[ns12] «Самоочевидное утверждение — это нечто ясное по самой своей природе...»"
61090-216 = ""
61090-217 = ""
61090-218 = ""
61090-219 = "Удивительно, но многие студенты действительно смогли следить за уроком."
61090-220 = ""
61090-222 = ""
61090-223 = ""
61090-225 = "...Разумеется, не все."
61090-226 = "Но всё это — просто часть школьной жизни."
61090-228 = "[ns] «На этом всё! Отличная работа, все!»"
61090-229 = "Спасибо..."
61090-230 = "Ух... Голова болит..."
61090-231 = "ХОТЯ, наверное, всё было не так уж плохо..."
61090-232 = "Эй. Дай свои записи."
61090-233 = "Ты сама ничего не записывала?!"
61090-234 = "Не буду врать. Я вообще всё прослушала..."
61090-235 = ""
61090-237 = ""
61090-238 = "..."
61090-240 = "Это будет ваша комната... если это вообще можно так назвать."
61090-241 = "Простите, Сенсей. Это лучшее, что у нас есть."
61090-242 = "[s13] «Не волнуйся! Я тоже захватил спальный мешок!»\n[s14] «Ах... Вот это рай...!»"
61090-245 = ""
61090-247 = ""
61090-248 = "[ns] «Всё в порядке, Саори?»"
61090-249 = "...Сенсей."
61090-250 = "У вас есть время поговорить? Постараюсь не занимать его слишком много."
61090-251 = "Я хотела бы поговорить с вами о некоторых вещах... пожалуйста."
61090-253 = "Следующий Эпизод;Шрамы и то, что осталось"
