[translation]
901010600440-6 = ""
901010600440-7 = "А теперь подведём итог по путям входа и выхода из порта Канэсаки..."
901010600440-8 = "Единственный официальный способ войти или выйти из порта — через главные ворота, которые охраняет семья Карпаччо."
901010600440-9 = "Официальный? А что насчёт неофициальных? Есть другие пути?"
901010600440-10 = "Поскольку это порт, можно попасть сюда на лодке."
901010600440-11 = "Однако порт Канесаки не является пассажирским портом. Круизы и гражданские здесь не пришвартовываются."
901010600440-13 = "Можно спрятаться в ящике и пробраться на грузовое судно, как контрабанда. Но я слышала, безбилетным пассажиром быть очень опасно."
901010600440-14 = "Где ты это слышала?"
901010600440-15 = "Сегодня утром один портовый рабочий рассказывал."
901010600440-16 = "После кражи ценностей вор попытался сбежать, тайком забравшись на грузовой корабль."
901010600440-17 = "А нашли его спустя месяцы, истощённого из-за недоедания, потому что судно слишком долго было в море."
901010600440-18 = "Ого... Довольно страшно."
901010600440-19 = "Другой вариант — воспользоваться железнодорожной платформой порта."
901010600440-20 = "В основном это грузовая станция, но, похоже, рано утром там ходит рабочий поезд для сотрудников порта."
901010600440-21 = "Обычные туристы почти не пользуются им, потому что линия идёт только до депо, но если нужно быстро покинуть порт — это вариант."
901010600440-22 = "Исходя из этого, единственный способ, которым Миягучи мог добровольно покинуть порт, — это..."
901010600440-23 = ""
901010600440-25 = ""
901010600440-26 = ""
901010600440-29 = ""
901010600440-30 = "#Q;쿠루미;Исходя из этого, единственный способ, которым Миягучи мог добровольно покинуть порт, — это...\n[as2] «Через главный вход.»\n[as3] «Уплыть в море.»\n[as1] «На рабочем поезде.»"
901010600440-31 = "На раннем рабочем поезде он мог покинуть порт незамеченным."
901010600440-32 = "А поскольку платформой управляет академия Хайлендер, он мог избежать семьи Карпаччо."
901010600440-33 = "Я связалась с Генеральным студенческим советом, чтобы проверить данные о посадках на платформе..."
901010600440-35 = "...Это было бы сложно."
901010600440-36 = "Главный вход в порт Канэсаки охраняет семья Карпаччо, которой Миягучи задолжал деньги."
901010600440-37 = "Я не состою в их семье, но сомневаюсь, что они позволили бы крупному должнику просто выйти через главные ворота."
901010600440-38 = ""
901010600440-40 = ""
901010600440-41 = ""
901010600440-42 = ""
901010600440-46 = "Плыть в открытое море посреди ночи... Звучит невероятно опасно."
901010600440-47 = "Наверняка есть более безопасный способ сбежать из порта?"
901010600440-48 = ""
901010600440-50 = ""
901010600440-51 = ""
901010600440-52 = ""
901010600440-55 = ""
901010600440-59 = ""
901010600440-60 = "Транспортное управление Генерального студенческого совета наконец ответило."
901010600440-61 = ""
901010600440-63 = ""
901010600440-64 = "Что они сказали? Миягучи правда сел на поезд в тот день?"
901010600440-65 = "...Да. Согласно записи, Миягучи купил билет И покинул порт."
901010600440-66 = "Хм. Вот тебе и жестокое нападение краба. Парень просто сбежал."
901010600440-67 = "Я зря переживала. Думала, с ним случилась авария."
901010600440-69 = "Я просто рада, что на самом деле никто не пропал."
