[translation]
901010600440-6 = ""
901010600440-7 = "Alinhando as rotas de acesso e fuga do Porto de Kanezaki..."
901010600440-8 = "A única entrada e saída terrestre \"oficialmente reconhecida\" é a guarita do portão principal, vigiada pela Família Carpaccio."
901010600440-9 = "Oficialmente? Quer dizer que existem outras rotas secundárias?"
901010600440-10 = "Sendo um porto marítimo, é evidente que dá para sair de barco pelo mar."
901010600440-11 = "Só que Kanezaki é um porto estritamente pesqueiro e cargueiro, navios de passageiros não atracam aqui."
901010600440-13 = "Daria para embarcar escondido num cargueiro como contrabando humano, mas o risco de vida é imenso."
901010600440-14 = "Quem te contou isso?"
901010600440-15 = "Um estivador com quem conversei de manhã."
901010600440-16 = "Ele disse que uma vez um ladrão roubou joias valiosas no cais e se escondeu no porão de um cargueiro..."
901010600440-17 = "Só que a viagem demorou tanto que quando abriram o contêiner no destino, o sujeito quase morreu de inanição e desidratação."
901010600440-18 = "Credo... De todas as lendas que ouvi hoje, essa foi a que me deu mais arrepio real."
901010600440-19 = "Mas além do mar, descobri outra alternativa: a estação ferroviária do porto."
901010600440-20 = "Não atende trens comuns, mas na madrugada circula uma composição curta de dois vagões para transportar operários até o pátio de trens."
901010600440-21 = "Liga direto à oficina ferroviária e quase ninguém de fora usa... Uma rota perfeita pra quem precisa vazar com urgência."
901010600440-22 = "O método que Miyaguchi usou para escapar do porto foi..."
901010600440-23 = ""
901010600440-25 = ""
901010600440-26 = ""
901010600440-29 = ""
901010600440-30 = "O método que Miyaguchi usou para escapar do porto foi...\n[as1] Embarcou no trem de operários da madrugada.\n[as2] Passou marchando pelo portão principal.\n[as3] Fugiu nadando pelo oceano escuro."
901010600440-31 = "Faz todo sentido! Pegando o trem de operários que parte de madrugada rumo ao pátio de manobras, dava pra escapar sem ser notado por ninguém."
901010600440-32 = "A linha é gerida pela Highlander, então a Família Carpaccio não tem jurisdição direta sobre as catracas."
901010600440-33 = "E por sorte, eu tinha acabado de pedir à Divisão de Transportes para verificar os registros da bilhetagem eletrônica—"
901010600440-35 = "...Isso seria bastante improvável."
901010600440-36 = "A guarita do portão principal é controlada pela própria Família Carpaccio, com quem Miyaguchi contraiu a dívida."
901010600440-37 = "Eles jamais deixariam um devedor inadimplente cruzar a cancela na cara deles."
901010600440-38 = ""
901010600440-40 = ""
901010600440-41 = ""
901010600440-42 = ""
901010600440-46 = "Nadar quilômetros em mar aberto no breu da madrugada...? Isso beira o suicídio."
901010600440-47 = "Havendo alternativas terrestres muito mais seguras, ninguém se jogaria na água gelada sem motivo."
901010600440-48 = ""
901010600440-50 = ""
901010600440-51 = ""
901010600440-52 = ""
901010600440-55 = ""
901010600440-59 = ""
901010600440-60 = "Opa! Chegou a resposta da Divisão de Transportes!"
901010600440-61 = ""
901010600440-63 = ""
901010600440-64 = "E aí?! O que disseram? O Miyaguchi tava na lista de passageiros?"
901010600440-65 = "...Confirmado. Naquela mesma madrugada do sumiço, um bilhete foi validado no nome de Miyaguchi e ele deixou a estação do porto."
901010600440-66 = "Ah, fala sério! Todo aquele bafafá de ataque de caranguejo assassino e no fim o cara só deu no pé pra fugir da cobrança!"
901010600440-67 = "E eu achando que ele tinha virado comida de monstros do mar..."
901010600440-69 = "Bom, pelo menos confirmamos que ele está vivo e que não houve assassinato. É um alívio!"
