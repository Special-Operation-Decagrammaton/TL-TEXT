[translation]
12050-1 = "Эпизод 5;У каждого своя история 2"
12050-2 = "«Кайзер Констракшн»? Ты имеешь в виду Корпорацию «Кайзер»?!"
12050-3 = "Район Абидоса принадлежит «Кайзеру»?!"
12050-4 = "А «Шиба Сэки Рамэн» тоже?"
12050-5 = "Да. Здание уже принадлежит корпорации Кайзер. Уведомление о выселении выдали некоторое время назад..."
12050-6 = "Поэтому хозяин решил закрыть магазин... Он сказал, что рано или поздно это всё равно должно было случиться."
12050-7 = "..."
12050-8 = "...!"
12050-9 = "Что?!"
12050-10 = "Нет... Только не раменная..."
12050-11 = "И это ещё не всё. Главное здание Абидоса, окружающая пустыня и пустоши..."
12050-12 = "...даже здания, которые природа ещё не поглотила — почти всё уже принадлежит им."
12050-13 = "Под нашим контролем остались только главное школьное здание и часть территории вокруг..."
12050-14 = "Н-Но как такое возможно? Как землю школьного района вообще могли продать?"
12050-15 = "Кто мог такое сделать?"
12050-16 = "Наверное, Студсовет Абидоса."
12050-17 = "...!"
12050-18 = "У Студсовета есть право голосовать по школьному имуществу. Только он мог разрешить такую сделку."
12050-19 = "Она права. Сделки проводил предыдущий Студсовет Абидоса."
12050-20 = "Но... Студсовета Абидоса уже два года как нет..."
12050-21 = "Да. После исчезновения Студсовета новых сделок не обнаружено."
12050-22 = "Понятно. Два года назад..."
12050-23 = "Что они натворили? Эти идиоты из Студсовета!"
12050-24 = "Как они могли продать школьную землю корпорации Кайзер?!"
12050-25 = "Школа принадлежит студентам! Зачем они сделали такое?!"
12050-26 = "..."
12050-27 = "Это же огромная проблема, а мы даже не знали, что такое произошло..."
12050-28 = "Район принадлежит школе — это само собой разумеется. Поэтому нас волновал только школьный долг, а не активы школы."
12050-29 = "Если бы я только узнала раньше..."
12050-30 = "Даже если бы знала, ты ничего не смогла бы сделать."
12050-31 = "Это случилось ещё до твоего поступления и даже до появления Целевой группы."
12050-32 = "Хошино... Ты что-нибудь об этом знала?"
12050-33 = "А, точно! Ты ведь раньше была в Студсовете Абидоса?"
12050-34 = "О, правда? Это так?"
12050-35 = "Да. Более того... она была вице-президентом последнего Студсовета..."
12050-36 = ""
12050-37 = "Ну да, это правда, но старшекурсниц, которые были там два года назад, я никогда не встречала."
12050-38 = "К моменту моего вступления все прежние члены уже ушли."
12050-39 = "Учеников оставалось меньше десяти, преподавателей не было, занятия давно прекратились."
12050-40 = "Комната Студсовета была как пустой склад, прежние члены не оставили никаких документов. Тогда школьное здание несколько раз переносили, спасаясь от опустынивания."
12050-41 = "В последнем Студсовете были только новая президент и я."
12050-42 = "Президент была идиоткой с худшими оценками в школе и вслепую согласилась на должность, а я — вспыльчивой первокурсницей."
12050-43 = "Ух... Там был полный бардак."
12050-44 = "Студент с худшими оценками был президентом? Что это вообще за Студсовет?"
12050-45 = "Оценки не показывают, подходит человек для работы или нет, Серика."
12050-46 = "У тебя самой оценки не особо..."
12050-47 = "Я-я знаю! Зачем ты вдруг заговорила о моих оценках? Я просто сказала!"
12050-48 = "Нет, она права. Мы назывались Студсоветом, но были совершенно некомпетентны."
12050-49 = "Я вообще попала в Студсовет случайно... Хм, тогда я была совершенно потерянной."
12050-50 = "Я понятия не имела, что делаю... Полная идиотка."
12050-51 = "..."
12050-52 = "Хошино..."
12050-53 = "Хошино, не вини себя."
12050-54 = "Наоборот, после роспуска Студсовета именно благодаря тебе в Абидосе появилась Целевая группа."
12050-55 = "А?"
12050-56 = "Ты можешь лениться, но когда действительно важно, всегда первой берёшь инициативу."
12050-57 = "Да. Когда пропала Серика, именно ты первой предложила попросить Сенсея о помощи."
12050-58 = "Правда? Не помню..."
12050-59 = "[s] «Да, это правда.»"
12050-60 = "О. Серьёзно?!"
12050-61 = "Ну, может, ты и безнадёжная, но я всё равно могу тебя уважать."
12050-62 = "Не уверена, что это комплимент..."
12050-63 = "Ч-Что это? Что на тебя нашло, Широко?! Мне так неловко слышать такое от тебя!"
12050-64 = "...Ну, просто захотелось сказать."
12050-65 = "Э-Э?"
12050-66 = "..."
12050-68 = "Как думаете, почему прежний Студсовет продавал землю Кайзеру?"
12050-69 = "Очевидно, они были с Кайзером заодно."
12050-70 = "Нет... Не думаю."
12050-71 = "О, я почти не знала тех старшекурсниц, но уверена, они старались ради школы."
12050-72 = "Может, они делали это, чтобы выплатить долг..."
12050-73 = "Долг..."
12050-74 = "Да. Я тоже так думаю. Уже тогда школьный долг был огромным."
12050-75 = "Но землю продавали так дёшево, что о выплате основной суммы можно было забыть. Они даже растущие проценты не успевали покрывать..."
12050-76 = "Вот и продолжали продавать землю..."
12050-77 = "Что? Это же странно..."
12050-78 = "[s] «Их вынудили отдавать землю.»"
12050-79 = "А? Что ты имеешь в виду, Сенсей?"
12050-80 = "[s] «Абидос попал в грязную ловушку.»"
12050-81 = "А-А?"
12050-82 = "...О."
12050-83 = "Понятно."
12050-84 = "Именно Кайзер давал Абидосу деньги в долг."
12050-85 = "...!"
12050-86 = "Это значит..."
12050-87 = "Кайзер Кредит одолжили школе столько, сколько она никогда не смогла бы вернуть, вынуждая продавать землю, чтобы покрывать растущие проценты."
12050-88 = "Да. Наверное, сначала они предлагали продавать бесполезные земли пустоши и пустыни..."
12050-89 = "Земля уже была испорчена, поэтому такое предложение соблазнило бы кого угодно..."
12050-90 = "Но поскольку продавали её очень дёшево, долг не уменьшался, и им приходилось отдавать всё больше земли..."
12050-91 = "Так район Абидоса постепенно стал собственностью Кайзера..."
12050-92 = "Да. Наверное, всё было именно так."
12050-93 = "Тогда причина, по которой они вообще дали Абидосу эти деньги... заключалась в том, чтобы забрать землю."
12050-94 = "Это ловушка, которую они готовили очень давно. Может, даже десятилетиями..."
12050-95 = "Всё было частью огромного заговора..."
12050-96 = "Не могу поверить! Они сыграли прямо на руку этим ублюдкам из Кайзера!"
12050-97 = "Студсовет был таким тупым! Как они могли так легко попасться?!"
12050-98 = "[s] «Нет, ты всё поняла неправильно.»"
12050-99 = "Сенсей?"
12050-100 = "[s] «Злодеи — те, кто их обманул. Не вини жертв.»"
12050-101 = "..."
12050-102 = "..."
12050-103 = "Я-я знаю! Я сама покупала подозрительную фигню вроде германиевых браслетов! Я лучше всех знаю, что мошенники — плохие!"
12050-104 = "Но..."
12050-105 = "Но я всё равно так злюсь... Почему?"
12050-106 = "Почему они так жестоко поступили с Абидосом? Нам и без того было тяжело..."
12050-107 = "Серика..."
12050-108 = "[s] «...»"
12050-109 = "..."
12050-110 = "..."
12050-111 = "Когда людям плохо, они становятся отчаянными."
12050-112 = "А?"
12050-113 = "А отчаявшиеся люди... пойдут на всё, лишь бы облегчить страдания."
12050-114 = "Я лишь цитирую чужие слова. Вот и всё, Серика."
12050-116 = "Школьный долг... ситуация в Абидосе и улики, которые мы нашли вместе с Сенсеем..."
12050-117 = "Всё складывается воедино."
12050-118 = "После исчезновения Студсовета корпорация Кайзер больше не могла покупать землю..."
12050-119 = "Эта школа была последним куском, которым они не владели, поэтому они наняли банды, чтобы нас изводить!"
12050-120 = "В итоге корпорации Кайзер были нужны не деньги... а земля!"
12050-121 = ""
12050-122 = "Но... зачем им земля?"
12050-123 = "Район Абидоса — это одна пустошь и разрушенные песком руины..."
12050-124 = "З-Знаю... Я понятия не имею, какая им от этого выгода..."
12050-125 = "[s] «Кажется, у меня есть кое-какая информация.»"
12050-126 = "...Сенсей?"
12050-127 = "[s] Передать им сведения, полученные от Хины."
12050-130 = "...Сенсей из Шале."
12050-131 = "Ни Пандемониум, ни Чаепитие пока не получили эту информацию."
12050-132 = "Но я решила, что тебе стоит знать."
12050-133 = "Похоже, корпорация Кайзер что-то затевает в заброшенной пустыне Абидоса."
12050-135 = "В заброшенной пустыне..."
12050-136 = "Кайзер..."
12050-137 = "Что-то затевает?"
12050-138 = "П-Почему главный префект Геенны...?"
12050-139 = "Зачем она рассказала тебе об этом, Сенсей?"
12050-140 = "Да ладно! Чего тут думать?"
12050-141 = "Пустыня Абидос находится в нашем районе! Почему бы просто не пойти и не проверить?"
12050-142 = "Раз вам так интересно, что там, давайте сами посмотрим!"
12050-143 = "...Хм."
12050-144 = "...Ого, Серика. У тебя впервые появилась хорошая идея. Ты так выросла. Я горжусь."
12050-145 = ""
12050-146 = ""
12050-147 = ""
12050-148 = "Что это за чувство? Таково быть поддержанной?"
12050-149 = "А-Ахаха..."
12050-150 = "Да. Серика права."
12050-151 = ""
12050-152 = ""
12050-153 = "[ns1] «Тогда нужно уходить прямо сейчас.»\n[ns2] «Отправляемся в Пустыню Абидос.»"
12050-156 = ""
12050-157 = ""
12050-158 = "Хорошо!"
12050-161 = "...Сенсей."
12050-162 = "Можно на минутку перед уходом?"
12050-163 = "...Мне нужно кое-что с тобой обсудить."
12050-164 = "[s] Следовать за Широко."
12050-168 = "..."
12050-169 = "Вот."
12050-170 = "[s] Взять листок у Широко."
12050-171 = "...Я нашла это в сумке Хошино."
12050-172 = ""
12050-173 = ""
12050-175 = "[ns] «Заявление об уходе... Таканаши Хошино, Целевая группа по взысканию долгов?»"
12050-176 = "(кивает)"
12050-177 = "Это заявление о выходе из Целевой группы."
12050-178 = "Я никому не говорила... но уверена, Хошино знает, что я рылась в её сумке."
12050-179 = "[s] «Зачем ты рылась в её сумке?»"
12050-180 = "...Вчера во время атаки Префектурной команды она отсутствовала дольше, чем когда-либо."
12050-181 = "Я просто не могла понять почему, поэтому заглянула в сумку и нашла это."
12050-182 = "...Прости. Можешь меня отругать. Я знаю, что непонятный мне поступок не становится преступлением."
12050-183 = "[s3] «Позже я тебя отругаю.»\n[s4] «А пока сохрани это в тайне.»"
12050-184 = "Хорошо. Хошино... Думаю, она что-то от нас скрывает."
12050-185 = "Хорошо. Хошино... Думаю, она что-то от нас скрывает."
12050-187 = ""
12050-188 = "..."
