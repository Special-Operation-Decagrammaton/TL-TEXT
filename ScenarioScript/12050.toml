[translation]
12050-1 = "Episódio 5;A História de Cada Uma (2)"
12050-2 = "Kaiser Construction... É uma subsidiária da Kaiser Corporation...?!"
12050-3 = "A Kaiser Corporation é dona do Distrito Autônomo de Abydos...?!"
12050-4 = "...Até o Lámen Shibasaki?"
12050-5 = "...Sim. O Mestre Shiba já sabia disso, e parece que já havia recebido uma ordem de despejo há bastante tempo..."
12050-6 = "Parece que o Mestre Shiba já tinha decidido fechar o restaurante... Ele disse que era algo que aconteceria mais cedo ou mais tarde..."
12050-7 = "..."
12050-8 = "...?!"
12050-9 = "Como assim...?!"
12050-10 = "Não pode ser, o Lámen Shibasaki..."
12050-11 = "...O prédio principal original do Colégio Abydos, que já virou deserto, e as dezenas de milhões de metros quadrados de terras áridas ao redor."
12050-12 = "E até os prédios e terrenos da cidade onde a desertificação ainda não avançou..."
12050-13 = "As únicas áreas cuja posse ainda não foi transferida são este prédio que usamos agora como sede principal e uma pequena região ao redor..."
12050-14 = "M-Mas como isso foi acontecer? Negociar terras do distrito autônomo de uma escola não deveria ser possível normalmente..."
12050-15 = "Quem diabos faria uma coisa dessas..."
12050-16 = "...O Conselho Estudantil de Abydos, né."
12050-17 = "...!"
12050-18 = "O poder de decisão sobre os bens da escola pertence ao Conselho Estudantil. Pensando bem, os únicos capazes de fazer isso seriam os membros do próprio Conselho Estudantil da escola."
12050-19 = "...Sim, exatamente. Quem conduziu a negociação foi o antigo Conselho Estudantil de Abydos."
12050-20 = "Não pode ser... O Conselho Estudantil de Abydos não deixou de existir há dois anos...?"
12050-21 = "...Sim. Por isso, desde que o Conselho Estudantil deixou de existir, nenhuma negociação foi feita."
12050-22 = "Entendi, há dois anos..."
12050-23 = "O que diabos esse pessoal do Conselho Estudantil tinha na cabeça?!"
12050-24 = "Vender as terras da escola? E logo para a Kaiser Corporation?!"
12050-25 = "A escola pertence às alunas, não é?! Por que fariam uma coisa dessas...?!"
12050-26 = "..."
12050-27 = "Algo tão grave assim, e nós nem percebemos durante todo esse tempo..."
12050-28 = "...O distrito autônomo de cada escola pertence à própria escola. É algo tão óbvio que ninguém questiona. Era tão óbvio que ficamos tão focadas na dívida e acabamos não percebendo."
12050-29 = "Se eu tivesse percebido um pouco antes..."
12050-30 = "...Não, não, a Ayane-chan não precisa se preocupar com isso."
12050-31 = "Isso aconteceu antes mesmo de você entrar na escola... não, antes mesmo de o Comitê de Contramedidas existir."
12050-32 = "...Hoshino-senpai, você sabe de alguma coisa?"
12050-33 = "Ah, é verdade! A Hoshino-senpai também era do Conselho Estudantil de Abydos, não era?"
12050-34 = "Hã? S-Sério?!"
12050-35 = "E mais... ouvi dizer que você foi a vice-presidente do último Conselho Estudantil."
12050-37 = "...Uhee~, bom, teve isso também, né. Já faz dois anos, e pra falar a verdade, eu nem cheguei a ter contato com os veteranos daquela época do Conselho Estudantil."
12050-38 = "Quando entrei no Conselho Estudantil, quase todo mundo lá já tinha saído."
12050-39 = "Naquela época o número de alunas já tinha caído para dois dígitos e não havia mais professores nem funcionários. As aulas já tinham parado fazia muito tempo."
12050-40 = "A sala do Conselho Estudantil parecia só um depósito se ninguém avisasse, e não tinha nem uma única folha de documento de transição. Também era bem na época em que estavam mudando o prédio da escola de lugar várias vezes para fugir da desertificação."
12050-41 = "Pra começo de conversa, mesmo chamando de último Conselho Estudantil, só tinha eu e a nova presidente."
12050-42 = "...Aquela presidente era imprudente, a maior cabeça de vento da escola mesmo sendo presidente... e eu era uma caloura com uma personalidade horrível."
12050-43 = "Puxa~... Estava tudo uma bagunça completa."
12050-44 = "A maior cabeça de vento da escola era a presidente...? Que diabos de Conselho Estudantil era esse...?"
12050-45 = "Notas e cargo são coisas diferentes, Serika."
12050-46 = "Além do mais, as suas notas também não são lá essas coisas, Serika-chan..."
12050-47 = "E-Eu já sei!! Por que estamos falando das minhas notas do nada?! Eu só fiz um comentário, tá?!"
12050-48 = "Uhee~, não, não, é exatamente isso mesmo. Conselho Estudantil era só o nome, na prática eram só duas cabeças de vento juntas."
12050-49 = "Por algum engano acabei entrando no Conselho Estudantil... puxa~, naquela época a gente corria de um lado para o outro sem parar, né."
12050-50 = "Feito duas bobas, sem saber de absolutamente nada..."
12050-51 = "..."
12050-52 = "Hoshino-senpai..."
12050-53 = "...A Hoshino-senpai não tem motivo para se sentir culpada."
12050-54 = "Não sei como eram as coisas antigamente, mas depois que o Conselho Estudantil foi dissolvido... se o Comitê de Contramedidas existe hoje em Abydos, com certeza é graças à Hoshino-senpai."
12050-55 = "H-Hã...?"
12050-56 = "...A Hoshino-senpai é preguiçosa e vive desconversando, mas nos momentos importantes ela sempre toma a frente antes de todo mundo."
12050-57 = "É verdade. Quando a Serika-chan desapareceu, quem foi pedir ajuda ao Sensei primeiro também foi a Hoshino-senpai..."
12050-58 = "...Uhee~, foi mesmo? Não me lembro muito be—"
12050-59 = "[s] \"Foi sim, você sempre toma a frente.\""
12050-60 = "Essa é novidade para mim!! Por que não me contaram?!"
12050-61 = "A Hoshino-senpai tem vários defeitos, mas eu a respeito."
12050-62 = "Isso é um elogio ou um insulto...?"
12050-63 = "O-O que deu em você, Shiroko-chan?! Soltando uma fala tão juvenil assim do nada...! O velhote aqui não leva muito jeito pra esse tipo de clima, sabia?!"
12050-64 = "...Ah, só achei que devia dizer isso."
12050-65 = "H-Hã...?"
12050-66 = "..."
12050-68 = "...Então, por que o antigo Conselho Estudantil vendeu as terras de Abydos para a Kaiser Corporation?"
12050-69 = "Será que eles estavam mancomunados por baixo dos panos?"
12050-70 = "Não... eu acho que não foi isso."
12050-71 = "É verdade~. Eu também não me envolvi de perto, então é só um palpite... mas acho que eram pessoas que realmente pensavam no bem da escola e estavam tentando fazer o melhor que podiam."
12050-72 = "Provavelmente, no começo, era só para tentar pagar a dívida... algo assim~."
12050-73 = "Venderam as terras por causa da dívida..."
12050-74 = "Sim, eu também acho. Naquela época, a dívida da escola já tinha crescido demais."
12050-75 = "Mas, mesmo assim, as terras de Abydos não valeriam muito, então no fim não serviu nem para reduzir a dívida em si..."
12050-76 = "E assim acabaram entrando em um ciclo vicioso de vender terras repetidamente... seria isso?"
12050-77 = "O que é isso? Não está meio estranho? Parece que não tinha saída desde o começo..."
12050-78 = "[s] \"...Esse tipo de golpe existe mesmo.\""
12050-79 = "Hã? Como assim?"
12050-80 = "[s] \"Talvez Abydos tenha caído em uma armadilha maliciosa.\""
12050-81 = "H-Hã?"
12050-82 = "Ah~..."
12050-83 = "Entendi, faz sentido."
12050-84 = "...Quem emprestou dinheiro para Abydos também foi a Kaiser Corporation."
12050-85 = "...!!"
12050-86 = "Isso quer dizer que..."
12050-87 = "A Kaiser Loans emprestou uma quantia que a escola jamais conseguiria pagar e os induziu a vender as terras só para pagar os juros."
12050-88 = "Sim. Com certeza, no começo, usaram lábia dizendo que bastava vender o deserto inútil ou as terras devastadas."
12050-89 = "Já que eram terras desertificadas e sem utilidade, não havia motivo forte para recusar a proposta..."
12050-90 = "Mas, ao mesmo tempo, vender por um preço tão baixo não diminuía a dívida, e eles só iam perdendo mais e mais terras..."
12050-91 = "...Até que o próprio Distrito Autônomo de Abydos fosse passando aos poucos para as mãos da Kaiser Corporation."
12050-92 = "Talvez tudo já estivesse calculado assim desde o início."
12050-93 = "Desde o momento em que emprestaram dinheiro para Abydos, planejaram tudo para acabar desse jeito..."
12050-94 = "Talvez tenha sido uma armadilha planejada há muito tempo. Tipo, há dezenas de anos..."
12050-95 = "Pode ser um plano nessa escala mesmo..."
12050-96 = "O que é isso?! Então eles só estavam brincando com a gente esse tempo todo!"
12050-97 = "Quão incompetentes eram aqueles caras do Conselho Estudantil?! Se não tivessem caído num golpe desses...!"
12050-98 = "[s] \"Serika, calma.\""
12050-99 = "Sensei...?"
12050-100 = "[s] \"Acho que o errado não é quem foi enganado, e sim quem enganou.\""
12050-101 = "..."
12050-102 = "..."
12050-103 = "...E-Eu também sei disso! À-Às vezes eu compro umas pulseiras de germânio e tal, então eu sei disso melhor que qualquer um aqui! Que o culpado é quem engana!"
12050-104 = "Mas..."
12050-105 = "Que raiva, por quê..."
12050-106 = "Abydos já está sofrendo tanto, por que fazer uma coisa tão cruel..."
12050-107 = "Serika-chan..."
12050-108 = "[s] \"...\""
12050-109 = "..."
12050-110 = "..."
12050-111 = "...Quem está sofrendo acaba ficando encurralado fácil demais, né~."
12050-112 = "...Hã?"
12050-113 = "Quando a pessoa fica encurralada, acaba fazendo qualquer coisa..."
12050-114 = "Bem, é uma história comum. Acho que é só isso mesmo, Serika-chan."
12050-116 = "A dívida da escola, a situação em que Abydos se encontra e as várias pistas que descobrimos junto com o Sensei."
12050-117 = "Sinto que tudo está começando a se conectar aos poucos."
12050-118 = "Depois que o Conselho Estudantil de Abydos desapareceu, a Kaiser Corporation perdeu a forma de comprar terras..."
12050-119 = "E contratou a Gangue dos Capacetes para tomar o \"último terreno\" que ainda não conseguiram: esta escola...!"
12050-120 = "Acho que podemos concluir que o objetivo da Kaiser Corporation não era o dinheiro, mas sim as terras!"
12050-122 = "Sim, faz todo sentido. Mas aí surge a próxima dúvida... por que as terras?"
12050-123 = "Quase todo o Distrito Autônomo de Abydos já virou deserto, terras áridas e ruínas cobertas de areia..."
12050-124 = "Realmente... não consigo imaginar que tomar terras assim traga algum grande lucro..."
12050-125 = "[s] \"Falando no deserto, tem algo que preciso contar para vocês...\""
12050-126 = "...Sensei?"
12050-127 = "[s] Contar as informações que ouviu da Hina."
12050-130 = "...Sensei da Schale."
12050-131 = "É uma informação que nem a Sociedade Pandemônio nem o Tea Party sabem ainda."
12050-132 = "...Mas talvez seja melhor avisar você."
12050-133 = "No deserto abandonado de Abydos... a Kaiser Corporation está tramando alguma coisa lá."
12050-135 = "No Deserto de Abydos..."
12050-136 = "A Kaiser Corporation..."
12050-137 = "Está tramando alguma coisa...?"
12050-138 = "P-Por que a Chefe do Comitê Disciplinar de Gehenna saberia de algo assim...?"
12050-139 = "E por que ela contou para o Sensei...?"
12050-140 = "Ah, chega! Em vez de ficar quebrando a cabeça com coisas complicadas, tem algo que precisamos fazer antes!"
12050-141 = "O Deserto de Abydos faz parte do nosso distrito autônomo! É só a gente ir lá ver!"
12050-142 = "Não sei direito o que está acontecendo, mas é mais rápido confirmar com nossos próprios olhos!"
12050-143 = "...Nn, é verdade."
12050-144 = "...Puxa~, a Serika-chan falou bonito, hein? A mamãe fica tão feliz de ver você crescendo tão forte, acho que vou até chorar. Me dá um lenço."
12050-148 = "Q-Que clima é esse?! É tão estranho assim eu falar algo sensato?!"
12050-149 = "A-Ahaha,"
12050-150 = "Claro que não... Mas a Serika-chan tem razão."
12050-153 = "[ns1] \"Então, assim que estivermos prontos, vamos lá.\"\n[ns2] \"Rumo ao Deserto de Abydos.\""
12050-158 = "Sim!"
12050-161 = "...Sensei."
12050-162 = "Antes de partirmos, posso falar com você um instante?"
12050-163 = "...Tenho algo que quero conversar."
12050-164 = "[s] Seguir a Shiroko."
12050-168 = "..."
12050-169 = "...Isto."
12050-170 = "[s] Receber algo da Shiroko."
12050-171 = "...Encontrei dentro da bolsa da Hoshino-senpai."
12050-175 = "[ns] \"Pedido de desligamento... Comitê de Contramedidas, Takanashi Hoshino...?!\""
12050-176 = "...Nn."
12050-177 = "Acho que significa exatamente o que está escrito."
12050-178 = "Não mostrei nem contei para ninguém além de você, Sensei... mas acho que a Hoshino-senpai já percebeu que eu mexi na bolsa dela."
12050-179 = "[s] \"Shiroko, por que você...?\""
12050-180 = "...A Hoshino-senpai nunca tinha se ausentado por tanto tempo antes. E não aparecer nem quando fomos encurraladas daquele jeito pelo Comitê Disciplinar..."
12050-181 = "Isso não saía da minha cabeça... então mexi na bolsa dela e encontrei isso."
12050-182 = "...Desculpa, sei que foi errado. Não posso reclamar se levar bronca da Hoshino-senpai e de você também, Sensei."
12050-183 = "[s3] \"...Ainda há muitas coisas que não sabemos.\"\n[s4] \"Vamos deixar isso em suspenso por enquanto. Vamos manter em segredo por ora.\""
12050-184 = "...Sim. Acho que você também já percebeu, Sensei... mas a Hoshino-senpai está escondendo alguma coisa."
12050-185 = "...Sim. Acho que você também já percebeu, Sensei... mas a Hoshino-senpai está escondendo alguma coisa."
12050-188 = "..."
12050-190 = "Próximo;Rumo ao Deserto de Abydos (1)"
