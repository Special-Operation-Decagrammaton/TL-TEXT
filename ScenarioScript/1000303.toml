1000303-45 = "Т-Ты так думаешь? Хи-хи..."
1000303-46 = "У меня нет каких-то особых талантов, поэтому я стараюсь помогать друзьям чем могу."
1000303-47 = "И моя набитая сумка — тому доказательство!"
1000303-48 = ""
1000303-49 = ""
1000303-51 = "О, смотри. Внезапный дождь..."
1000303-52 = "Видишь? Вот почему я всегда готова! Хи-хи..."
1000303-53 = "Вот, Сенсей. Вставай под мой зонтик Pinky-Paca. Давай сюда!"
1000303-54 = ""
