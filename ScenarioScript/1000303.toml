1000303-3 = "Хм-хм... ♪ Хм-м-м... ♬"
1000303-4 = "О, Сенсей!"
1000303-5 = ""
1000303-6 = "А-А?"
1000303-7 = ""
1000303-9 = "Ай..."
1000303-10 = "[s] «Ты в порядке?»"
1000303-11 = "Хи-хи... Я-я в порядке. Для меня упасть из-за собственной неуклюжести — обычное дело."
1000303-12 = "Хотя странно. Я ведь не споткнулась о камень или что-то такое. Почему я вдруг потеряла равновесие...?"
1000303-13 = "[s] «Может, сумка слишком тяжёлая?»"
1000303-14 = "Ты про эту сумку с Пероро? Возможно, ты прав."
1000303-15 = "В ней много всего, поэтому она довольно тяжёлая... Я давно собиралась разобрать вещи."
1000303-16 = "Если подумать, почему бы не сделать это прямо сейчас?"
1000303-19 = "[ns] «Подожди, это же...?»"
1000303-20 = "Какой глаз, Сенсей! Это пластырь с лицом Пероро!"
1000303-21 = "Я ношу их на случай, если кто-то из друзей поранится рядом со мной. Мне было бы ужасно, если бы я не смогла помочь."
1000303-22 = "Поэтому они всегда лежат в моей сумке!"
1000303-25 = "[ns] «...А это что?»"
1000303-26 = "О, это подушка Big Brother!"
1000303-27 = "Она набита перьями, поэтому очень мягкая."
1000303-28 = "С ней никакая скамейка не покажется жёсткой!"
1000303-31 = "[ns] «...А вот это?»"
1000303-32 = "Это зонтик с принтом Pinky-Paca!"
1000303-33 = "Сегодня дождя не обещали, но кто знает, правда?"
1000303-34 = "Лучше иметь зонтик и не воспользоваться им, чем остаться без него, когда он понадобится!"
1000303-35 = ""
1000303-36 = "Хм... Я думала, найду здесь что-нибудь, без чего смогу обойтись, но всё такое важное."
1000303-37 = ""
1000303-38 = ""
1000303-39 = ""
1000303-40 = ""
1000303-41 = ""
1000303-42 = ""
