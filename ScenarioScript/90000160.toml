[translation]
90000160-1 = "Эпизод 17;Пятый Пророк"
90000160-2 = ""
90000160-3 = "Мне не удаётся обнаружить никаких следов тех странных существ."
90000160-4 = "Bсчезли, не оставив ни следа."
90000160-5 = "*вздыхает*"
90000160-6 = "[s] «И кем же они были на самом деле?»"
90000160-7 = "Как они и сказали. Инженеры, учёные и помощники пророков Декаграмматона."
90000160-8 = "Даже с того света Декаграмматон и его козни продолжают нас преследовать."
90000160-9 = "Не знаю, зачем они позвали нас сюда, но похоже, наше присутствие стало последним компонентом для завершения той Старшей Сестры, о которой они говорили."
90000160-10 = "Не знаю, нужен ли был им кто-то один или все сразу..."
90000160-11 = "Может, им нужна была технология Безымянных Жрецов и Богов в Аби-Эшухе..."
90000160-12 = ""
90000160-14 = ""
90000160-15 = "Или даже Сундук Шиттима, оставленный Шале Президентом Генерального Студсовета?.."
90000160-16 = "[s] «...»"
90000160-17 = "Кто знает, быть может им понадобился грозный дар Всеведения сверххрупкой гениальной хакерши Акебоши Химари!"
90000160-18 = "(Это выдумка.)"
90000160-19 = "Но о какой \"Старшей Сестре\" они говорили?"
90000160-20 = "Даже не знаю. Мне нужно больше данных. Когда вернёмся в лабораторию, придётся провести дополнительные исследования."
90000160-21 = "Президент, я кое-что вспомнила."
90000160-22 = "А?"
90000160-23 = "Последние слова Декаграмматона."
90000160-25 = "Даа!.. Я вижу её!"
90000160-26 = "Пророк, что поведёт всех остальных... Мой последний пророк, Малкут, возглавит наступление, дабы подтвердить моё существование!.."
90000160-28 = ""
90000160-29 = ""
90000160-30 = "Малкут..."
90000160-31 = "..."
90000160-32 = "..."
90000160-33 = "Ты права, Эйми. Малкут должна быть... последней Сефирой на самом конце Древа Жизни, полагаю."
90000160-34 = "Возможно, мы стоим на пороге невиданной прежде катастрофы."
90000160-35 = "Что будем делать, Президент?"
90000160-36 = "Готовиться."
90000160-37 = "Готовиться к борьбе с теми, кто исполняет волю Декаграмматона. Нашими противниками будут три инженера: Айн, Соф и Ор."
90000160-38 = "[s] «...»"
90000160-39 = "Полагаю, времени у нас совсем немного."
90000160-40 = "Это лишь предположение, но лёгкой эта задача точно не будет. Кивотосу придётся подготовиться к битве со всеми десятью пророками, записанными в Древе Жизни..."
90000160-42 = "Все десять пророков..."
90000160-43 = "Именно. Потому не будем сидеть сложа руки. Нам нужно немедленно начать подготовку."
90000160-44 = "По-первых. нам не хватает информации. Нужно собрать как можно больше данных о пятом пророке, Гебуре."
90000160-45 = "Мне нравится эта идея. Погода здесь очень приятная. Можно даже считать это отпуском."
90000160-46 = "Ни в коем случае! Как можно назвать такие условия подходящими для отпуска?! Эта морозная тундра больше похожа на место для ссылки!"
90000160-47 = "Не будем терять самообладание. В такие моменты важно сохранять спокойствие."
90000160-48 = "Видите? Токи тоже со мной согласна."
90000160-49 = "...Сенсей?"
90000160-50 = "[s] «Давайте успокоимся и начнём решать проблемы по мере их поступления.»"
90000160-51 = "И Вы, Сенсей?"
90000160-52 = "Хорошо. Я придумаю, как защититься от олода, а вы наслаждайтесь своим морозным отпуском."
90000160-53 = "Ура. В путь!"
