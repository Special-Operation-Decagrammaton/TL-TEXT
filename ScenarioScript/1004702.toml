[translation]
1004702-1 = "В поисках сияния"
1004702-2 = "Неожиданно мне позвонила Чисэ, и я отправился на пляж."
1004702-3 = ""
1004702-5 = ""
1004702-6 = "[s] «О, привет, Чисэ.»"
1004702-7 = "Привет, Сенсей."
1004702-8 = "[s1] «Я пришёл, потому что ты позвала, но...»\n[s2] «Всё в порядке, Чисэ?»"
1004702-11 = "Это..."
1004702-12 = "[s] «Это...?»"
1004702-13 = ""
1004702-14 = ""
1004702-16 = ""
1004702-20 = ""
1004702-21 = "Вы знаете, о чём речь?"
1004702-22 = ""
1004702-25 = "[s] «Эм...»"
1004702-26 = "О! Я вспомнила, Сенсей."
1004702-27 = "Да... Речь о сиянии."
1004702-28 = "Мне нужно найти сияние."
1004702-29 = "[s] «Сияние...?»"
1004702-30 = "С сегодняшнего дня у меня летние каникулы."
1004702-31 = "Я думала, чем заняться во время отдыха."
1004702-32 = "Я зашла в интернет и поискала: «чем заняться летом»."
1004702-33 = "[s3] «О, ты тоже пользуешься интернет-поиском!»\n[s4] «Какая ты предусмотрительная!»"
1004702-36 = "Спасибо за комплимент, Сенсей."
1004702-37 = "И вот в интернете..."
1004702-38 = "я нашла это, Сенсей."
1004702-39 = "Посмотрите."
1004702-40 = ""
1004702-42 = ""
1004702-43 = ""
1004702-45 = ""
1004702-46 = ""
1004702-47 = "Смотрите, Сенсей. Вот..."
1004702-48 = ""
1004702-50 = ""
1004702-51 = ""
1004702-52 = ""
1004702-55 = "[ns] «П-Подожди! Чисэ! Я ничего не вижу, когда ты подносишь это так близко...!»"
1004702-56 = "О. Ой."
1004702-57 = ""
1004702-60 = "Тогда вот так?"
1004702-62 = "Я успокоил Чисэ, которая с энтузиазмом размахивала чем-то у меня перед лицом."
1004702-63 = "Это была часть недавно опубликованной в интернете летней статьи."
1004702-64 = "Под заголовком была фраза..."
1004702-65 = "[ns5] «Этим летом обретите своё взрослое сияние...»\n[ns6] «Что... Что это вообще?»"
1004702-68 = "Да. Поэтому я найду своё взрослое сияние."
1004702-69 = "Это сияние! Чтобы вырасти!"
1004702-70 = "[s] «Эй, подожди, Чисэ?!»"
1004702-71 = "Я не знала, чем заниматься на летних каникулах."
1004702-72 = "Я очень этому рада."
1004702-73 = "Это драгоценное время для вдохновения."
1004702-74 = "Как участница Клуба Инь-Ян и автор хайку... то есть хайкер..."
1004702-75 = "я всегда должна искать новые способы расти."
1004702-76 = "[s] «Не думаю, что „хайкер“ — настоящее слово...»"
1004702-77 = "Да. Настоящее. Поэтому я нашла это в интернете."
1004702-78 = "Если я найду сияние, то смогу вырасти!"
1004702-79 = "Я доверяю этой информации."
1004702-80 = "Поэтому я хочу найти своё сияние."
1004702-81 = "[s7] «Я горжусь тем, что ты хочешь учиться даже на каникулах, но...!»\n[s8] «Не думаю, что там имеется в виду то, что ты думаешь...»"
1004702-84 = "Но что?"
1004702-85 = "Нет?"
1004702-86 = "То есть искать сияние плохо?"
1004702-87 = ""
1004702-89 = ""
1004702-90 = "Я так ждала, что мы будем искать его вместе..."
1004702-91 = "[s] «Ух!»"
1004702-93 = "[ns] «То есть, если ты хочешь искать — конечно, я помогу!»"
1004702-94 = "Правда? Я рада."
1004702-95 = "Хорошо, Сенсей. Нам пора."
1004702-96 = "Нужно найти много сияния."
1004702-97 = "И тогда я смогу сильно вырасти, Сенсей."
1004702-98 = "[s] «Хорошо, поможем тебе повысить уровень.»"
1004702-99 = "Насколько большой я вырасту, Сенсей?"
1004702-100 = "Размером с танк?"
1004702-101 = "[s] «Размером с танк... Слегка преувеличено, но ладно, попробуем!»"
1004702-102 = "Так мы с Чисэ начали искать сияние."
1004702-105 = ""
1004702-107 = ""
1004702-108 = "[ns] «Но, Чисэ, что именно ты подразумеваешь под этим сиянием?»"
1004702-109 = "О, насчёт этого."
1004702-110 = "Сияние — это просто то, что сияет."
1004702-111 = "Значит, мне нужно найти что-нибудь блестящее."
1004702-112 = "[s] «Ответ очень прямой, но одновременно ужасно запутанный!»"
1004702-113 = "Сияние, подходящее летнему пляжу..."
1004702-114 = "Или, может, сияние, которое можно найти только на пляже..."
1004702-115 = "О, смотрите туда, Сенсей."
1004702-116 = "На пляже что-то блестит."
1004702-117 = ""
1004702-119 = ""
1004702-120 = "[ns] «П-Подожди, Чисэ...!»"
1004702-121 = ""
1004702-124 = ""
1004702-125 = "Эта блестящая штука на пляже — это..."
1004702-126 = ""
1004702-128 = ""
1004702-129 = ""
1004702-130 = "...медуза?"
1004702-131 = "[s] «О, Чисэ. Это мусорный пакет. Думаю, просто солнце на него попало.»"
1004702-132 = "О. Это мусорный пакет."
1004702-133 = "Но он так сиял!"
1004702-134 = "Оп!"
1004702-135 = "[s] «Ты только что положила это себе в сумку?!»"
1004702-136 = "Я не могу оставить его здесь. Он может попасть в океан."
1004702-137 = "Поэтому заберу медузу."
1004702-138 = "О, Сенсей, вон там."
1004702-139 = "Там ещё одна блестящая штука."
1004702-140 = ""
1004702-142 = ""
1004702-143 = "[ns] «П-Подожди меня, Чисэ!»"
1004702-144 = ""
1004702-148 = ""
1004702-149 = "Блестящая штука здесь — это... камешек?"
1004702-150 = "[s] «О, это пустая бутылка матча-рамунэ, которую кто-то выбросил.»"
1004702-151 = "Понятно. Это тоже не сияние."
1004702-152 = "Оп, оп! Это тоже заберу."
1004702-153 = "Нам нужно идти дальше, Сенсей."
1004702-154 = "Мы должны найти сияние."
1004702-155 = ""
1004702-157 = ""
1004702-160 = ""
1004702-161 = "Это ракушка?"
1004702-162 = "[s] «О, кажется, это футляр от пудры, который кто-то выбросил...»"
1004702-163 = "Хм, понятно!"
1004702-164 = ""
1004702-166 = ""
1004702-167 = ""
1004702-168 = ""
1004702-169 = "А это что? Водоросли?"
1004702-170 = "[s] «Может, выброшенная на берег рыболовная сеть?»"
1004702-171 = ""
1004702-173 = ""
1004702-174 = "О, Сенсей, это..."
1004702-175 = "Что это?"
1004702-176 = ""
1004702-178 = ""
1004702-179 = ""
1004702-180 = "...Что это такое?"
1004702-182 = "В поисках сияния мы с Чисэ бесцельно бродили по песчаному пляжу."
1004702-183 = "Некоторое время мы продолжали находить и собирать разные вещи."
1004702-185 = "Мы нашли очень много всего."
1004702-186 = "[s] «На пляже столько мусора...»"
1004702-190 = "После трёх часов обхода пляжа мы собрали следующее:"
1004702-191 = "использованную бутылку из-под напитка, мусорный пакет, осколки Blu-ray, кучу сетей..."
1004702-192 = "буй, запутавшийся в водорослях и похожий на утопленника, смятую пластиковую бутылку и так далее."
1004702-193 = "[s] «Хм, такое чувство, будто сегодня мы просто убирали пляж...»"
1004702-195 = "Ого."
1004702-196 = "[s] «А? Что „ого“, Чисэ?»"
1004702-197 = "Все вещи, которые мы сегодня нашли, обходя пляж..."
1004702-198 = "Все они сияли."
1004702-199 = "Как пакет-медуза, камешки, кораллы и ракушки."
1004702-200 = "Пляж полон сияния."
1004702-201 = "[s] «...Наверное, если смотреть на это так, то да.»"
1004702-202 = "Хм. Но чего-то не хватает."
1004702-203 = "Когда я закрываю глаза, я вижу их в уме."
1004702-204 = "Сияние, которое я хочу найти, другое."
1004702-205 = "Оно расплывчатое, его трудно увидеть..."
1004702-206 = "Почему так, Сенсей?"
1004702-207 = "[s] «Думаю, ответ на это есть только у тебя.»"
1004702-208 = "..."
1004702-209 = "И всё же я довольна. Я искала сияние вместе с Сенсеем."
1004702-210 = "Для меня этого достаточно..."
1004702-211 = ""
1004702-213 = ""
1004702-214 = "О, уже время ужина, Сенсей. Пойдём обратно."
1004702-215 = "[s] «А как же твоё сияние, Чисэ?»"
1004702-216 = "О, да..."
1004702-217 = "Ну..."
1004702-218 = "Если мы до сих пор его не нашли..."
1004702-219 = "...после того как весь день здесь ходили..."
1004702-220 = "Наверное, я не смогу вырасти до размера танка."
1004702-221 = "[s] «Лето ещё долгое. Всё нормально.»"
1004702-222 = "Сенсей? Что вы имеете в виду?"
1004702-223 = "[s9] «Я буду помогать тебе, пока ты не найдёшь то, что ищешь.»\n[s10] «Буду искать сияние вместе с тобой каждый день.»"
1004702-226 = "..."
1004702-227 = "...Понятно."
1004702-228 = "Пока я его не найду..."
1004702-229 = "Ах."
1004702-230 = ""
1004702-232 = ""
1004702-233 = "[s] «Что такое, Чисэ?»"
1004702-234 = "Сенсей, я просто..."
1004702-235 = "...Ни о чём."
1004702-237 = "Как всегда, вы правы. Каникул ещё много. Летние дни длинные."
1004702-238 = "Пора ужинать."
1004702-239 = "Кто первым вернётся..."
1004702-240 = "...тот помидор!"
1004702-241 = "[s] «Ч-Что? Помидор?! Почему помидор?!»"
1004702-242 = ""
1004702-246 = "Мы вернулись в общежитие, тихо идя по пляжу на закате."
