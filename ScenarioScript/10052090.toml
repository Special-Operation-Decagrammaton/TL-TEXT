[translation]
10052090-39 = "Oh... no, it's nothing."

10052090-1 = "Хокма, Древний хранитель царства"
10052090-3 = "[ns] «Кстати, Кей-Кей.»"
10052090-4 = "Ч-Что?"
10052090-5 = "[s] «Тебе точно можно продолжать участвовать в полевых операциях, Кей-Кей?»"
10052090-6 = "Почему вы спрашиваете об этом ТОЛЬКО СЕЙЧАС?"
10052090-7 = "[s] «Потому что я переживаю за Кей-Кей!»"
10052090-8 = "...Вы правда переживаете...?"
10052090-9 = "С ней всё будет хорошо, Сенсей. Я справлюсь с любыми неожиданностями."
10052090-10 = "[s] «Верно. В конце концов, ты лучший полевой агент.»"
10052090-11 = ""
10052090-13 = ""
10052090-14 = "Докладываю. Кто-то сказал «лучший полевой агент»?"
10052090-15 = "[s] «О, я это сказал? Токи тоже лучшая. Безусловно!»"
10052090-16 = "Не совсем понимаю это «тоже», но ответ меня устраивает. До свидания."
10052090-17 = ""
10052090-19 = ""
10052090-21 = ""
10052090-22 = "...Что вообще здесь происходит?"
10052090-23 = "Если подумать, Рио первой обнаружила Хокму."
10052090-24 = "Х-хм? Да... пожалуй."
10052090-25 = "Но даже я удивилась, когда из земли внезапно поднялся корабль."
10052090-26 = "Похоже на самое настоящее «сверхъестественное явление»..."
10052090-27 = "..."
10052090-28 = "Рио, как создатель Отряда Исследования Сверхъестественного, что ты обо всём этом думаешь?"
10052090-29 = "А? Ты и это знаешь, Кей?"
10052090-30 = "Ну... Я ведь получила большую часть данных и истории, приведшей нас к этому моменту, разве нет?"
10052090-31 = "Просто считай, что я знаю всё, что знаешь ты. Погоди, разве я уже не говорила об этом?"
10052090-33 = "Ага... Понятно."
10052090-34 = "Это... Пожалуй, сейчас я могу сказать, что «глубоко тронута» тем, что ты спросила?"
10052090-36 = "...!"
10052090-37 = "...!"
10052090-38 = ""
10052090-41 = ""
10052090-42 = "Почему вы все так на меня смотрите?"
10052090-44 = "Эм... Ничего. Ну..."
10052090-45 = "Кажется, с тех пор ты сильно изменилась, Рио."
10052090-46 = "Очень тонко, Эйми!"
10052090-48 = "Понятно... Это был комплимент или оскорбление?"
10052090-50 = "Не можешь понять? Почему именно в такие моменты у тебя пропадает здравый смысл?"
10052090-51 = "Успокойся, Кей. Если злиться на каждую мелочь, можно пережечь эмоциональные контуры."
10052090-53 = "Такое вполне возможно. Я ведь ещё не полностью проанализировала твоё новое тело."
10052090-54 = "Если возникнет фатальная ошибка, мне может быть сложно её исправить."
10052090-55 = ""
10052090-58 = ""
10052090-61 = "Я? Да это ВЫ меня убиваете..."
10052090-62 = "[s] «...Ты в порядке, Кей-Кей?»"
10052090-63 = "Если я умру от раздражения, виноваты будете все вы."
10052090-64 = ""
10052090-66 = ""
10052090-67 = "Что? Кей умирает? Кей, НЕЕЕЕТ!"
10052090-68 = "Нет... Я не умираю. Это оборот речи, Арис. Для... эмоционального эффекта."
10052090-69 = "[s] «Нашей Кей-Кей и правда тяжело...»"
10052090-70 = "Спасибо за понимание, Сенсей..."
10052090-71 = ""
10052090-76 = "Пора двигаться, Кей. Посмотри, можешь ли найти место, откуда Сенсей сможет безопасно наблюдать."
10052090-77 = "Поняла... На этом этапе было бы уже проще заняться НАСТОЯЩЕЙ работой."
10052090-78 = "Тогда начинаем, Сенсей."