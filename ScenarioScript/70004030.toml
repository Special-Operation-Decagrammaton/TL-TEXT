[translation]
70004030-1 = "Потерянный подарок 3"
70004030-2 = ""
70004030-3 = "*вздыхает*"
70004030-4 = "Мне так и не удалось найти владельца подарка..."
70004030-5 = "Если это и правда просто потерянная вещь, то ладно... Но я очень надеюсь, что это не начало какого-нибудь ужасного хаоса в Кивотос."
70004030-6 = ""
70004030-7 = "...В Кивотос приближается ужасный хаос?"
70004030-8 = "И-Ик!"
70004030-9 = "М-Мияко? К-Когда ты пришла?!"
70004030-10 = "Только что... Прошу прощения. Я не хотела подкрадываться."
70004030-11 = "В любом случае, что это за ужасный хаос? Ты обнаружила потенциальную угрозу миру Кивотос?"
70004030-12 = "Н-Нет! Ничего такого..."
70004030-13 = "Э-Эм, точно! Новая курица Explosion God! Я слышала, она суперострая!"
70004030-14 = "Согласно описанию товара, её острота станет сенсацией во всём Кивотос... Вот я и подумала, надеюсь, она не вызовет никакого хаоса."
70004030-15 = "А. Ты просто думала о новом товаре?"
70004030-16 = "Какое облегчение. Я боялась, что вражеские бойцы охотятся за Сенсеем."
70004030-17 = "Хаха... Н-Наверное, нет?"
70004030-18 = "Кстати, что ты здесь делаешь, Мияко? Я ещё не рассортировала просроченные бэнто на выброс."
70004030-19 = "А... Сегодня я пришла не за этим."
70004030-20 = "Вот, возьми."
70004030-21 = "А, вкусно пахнет... Что это?"
70004030-22 = "Жареная индейка. Мне подарил индейку один местный житель, но у нас осталась лишняя."
70004030-23 = "Я хотела поделиться, ведь ты всегда заботишься обо мне, Сора."
70004030-24 = "Н-Что ты. Если ты даёшь мне альтернативу бэнто, это ты мне помогаешь. Спасибо, что подумала обо мне."
70004030-25 = "А, знаешь, если есть время, хочешь поесть здесь со мной, Мияко? В это время обычно тихо, так что можно не спешить."
70004030-27 = "Спасибо за предложение, но вообще-то... я надеялась дать немного и Сенсею."
70004030-28 = "Поэтому после этого собиралась зайти к ней в офис. Прости, что отказываюсь от такого доброго приглашения."
70004030-29 = "...Вот как?"
70004030-31 = "...Хаха. Я так и думала, что ты это скажешь."
70004030-32 = ""
70004030-34 = ""
70004030-35 = "Не могу сказать... что никогда не делилась десертом с Сенсеем."
70004030-36 = ""
70004030-38 = ""
70004030-39 = "Но мы всё ещё учитель и студент."
70004030-40 = ""
70004030-41 = ""
70004030-42 = "Похоже, всем в Кивотос очень нравится [USERNAME] Сенсей."
70004030-43 = "Да. Её доброта не знает границ."
70004030-44 = "Но о ней ходит так много плохих слухов. Я слышала, что Сенсей общается с хулиганками и даже любит гулять по парку в сомнительных нарядах."
70004030-45 = "Ахаха... На неё не похоже."
70004030-46 = "И-и ещё с детства меня учили с подозрением относиться к людям, которые проявляют доброту, ничего не ожидая взамен."
70004030-47 = "Поэтому... мне трудно понять, почему все так безоговорочно верят Сенсею."
70004030-48 = ""
70004030-50 = ""
70004030-51 = "Может, наоборот. Может, мы верим Сенсею именно потому, что она совсем не надёжный взрослый."
70004030-52 = "Потому что она... не надёжный взрослый?"
70004030-53 = "[USERNAME] Сенсей проблемная и ведёт себя так, что её трудно понять. Само воплощение взрослого, которому нельзя доверять."
70004030-54 = "Но при этом она всегда на стороне студентов, что бы ни случилось. Выслушает наши истории без капли осуждения или предубеждения."
70004030-55 = "Поэтому рядом с этим несовершенным учителем кажется, что можно быть собой, со всеми недостатками. Без тревоги и груза на душе можно рассказать, что у тебя внутри."
70004030-56 = ""
70004030-58 = ""
70004030-59 = "...Мияко."
70004030-60 = "Сенсей никогда не просила тебя делать ничего... странного, правда?"
70004030-61 = "К-Конечно нет!"
70004030-62 = "Какое облегчение... Но на всякий случай спрошу и тебя..."
70004030-63 = "Ты ничего не забывала в последнее время?"
70004030-64 = "Хм... Наверняка могла что-то потерять, но ничего не приходит в голову."
70004030-65 = "А, я слишком задержалась. #nСчастливых праздников, Сора."
