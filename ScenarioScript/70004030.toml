70004030-69 = "..."
70004030-70 = "[ns] «Добрый вечер, Сора.»"
70004030-71 = "Ч-Чего! Когда вы пришли, Сенсей?!"
70004030-72 = "[s1] «...Только что?»\n[s2] «Я просто подумал, что энергетик поможет мне сосредоточиться.»"
70004030-73 = "П-Понятно... Добро пожаловать в Ангел 24!"
70004030-74 = "П-Понятно... Добро пожаловать в Ангел 24!"
70004030-75 = "[s3] «Кажется, тебя многое тревожит.»\n[s4] «Тебя что-то беспокоит?»"
70004030-76 = "Нет, не особо..."
70004030-77 = "Нет, не особо..."
70004030-78 = ""
70004030-80 = ""
70004030-81 = "...Вообще-то да. Есть кое-что."
70004030-82 = "Я пытаюсь найти владельца подарка, который кто-то оставил в магазине."
70004030-83 = "[s] «А? Сора, ты всё ещё его не открыла?»"
70004030-84 = "А? Мне...?"
70004030-85 = "Это случайно не вы его здесь оставили?"
70004030-86 = "[s5] «Если подумать, тогда я забыл об этом упомянуть.»\n[s6] «Да. Это мой рождественский подарок тебе.»"
70004030-87 = "Р-Рождественский подарок вот так внезапно...? А я вам ничего не приготовила..."
70004030-88 = "Р-Рождественский подарок вот так внезапно...? А я вам ничего не приготовила..."
70004030-89 = "Я никак не смогу отблагодарить вас за такой подарок."
70004030-90 = "А. Может, моя скидка сотрудника на бэнто? Это немного..."
70004030-91 = "[s] «Всё нормально. Ты уже многое мне дала, Сора.»"
70004030-92 = "Я? Вам, Сенсей?"
70004030-93 = "[s7] «Ты всегда готова встретить покупателей в „Ангеле 24“.»\n[s8] «Когда я работаю допоздна, меня утешает одно — этот магазин всё ещё открыт.»"
70004030-94 = "Я ведь делаю это не по доброте душевной..."
70004030-95 = "Я ведь делаю это не по доброте душевной..."
70004030-96 = "Я просто выполняю свою работу..."
70004030-97 = "[ns] «„Просто выполнять свою работу“ никогда не бывает так легко, как кажется.»"
70004030-99 = "[ns9] «Вера в то, что кто-то выполнит свои обязанности...»\n[ns10] «...позволяет таким людям, как я, спокойно жить изо дня в день.»"
70004030-100 = "...Думаете?"
70004030-101 = "...Думаете?"
