70004030-109 = "Хи-хи... Дизайн очень милый."
70004030-110 = "Хи-хи... Дизайн очень милый."
70004030-111 = "Они тёплые, но очень лёгкие, так что для работы отлично. И сидят идеально, будто вы измеряли..."
70004030-112 = "...Сенсей. Откуда вы знаете размер моих рук?"
70004030-113 = "[s13] «Я отлично помню все твои размеры.»\n[s14] «Когда ты даёшь мне сдачу, я всегда смотрю на твои руки!»"
