[translation]
10016160-1 = "Послесловие;Эпизод Исполнительного комитета"
10016160-3 = ""
10016160-4 = ""
10016160-5 = ""
10016160-6 = "А-а-а... Чувствую, как всё тело расслабляется."
10016160-7 = "Будто вся усталость за день смывается одной чашкой горячего чая..."
10016160-8 = "Это... очень вкусно. Кажется, я ещё никогда не пробовала чёрный чай с таким необычным и сладким ароматом."
10016160-9 = "И вода не слишком горячая, но и не тёплая, поэтому вкус раскрывается полностью и без горечи."
10016160-10 = "Когда я завариваю чай, он и близко не получается таким насыщенным... Ты потрясающая, Хасуми."
10016160-11 = ""
10016160-13 = ""
10016160-14 = "Хаха. Это всё благодаря Чайная партия, которые прислали мне такие хорошие чайные листья."
10016160-15 = "Они прислали с большим запасом, так что, если захотите ещё, просто скажите."
10016160-16 = ""
10016160-18 = ""
10016160-19 = "Кстати, твоя чашка пуста. Ещё?"
10016160-20 = "Да, пожалуйста."
10016160-21 = ""
10016160-23 = ""
10016160-24 = ""
10016160-29 = "Я слышала, что вице-президент Отряда правосудия Тринити очень строга к чайному этикету. Похоже, слухи не врали."
10016160-30 = "Я и представить не могла, что чай, заваренный человеком, может иметь настолько утончённый и изысканный вкус."
10016160-31 = "Спасибо, что подарили нам такой редкий опыт."
10016160-32 = "Я очень рада, что вам нравится приготовленный мной чай."
10016160-33 = ""
10016160-35 = ""
10016160-36 = "Ты Ушио Ноа, верно?"
10016160-37 = "Кажется, я несколько раз видела тебя мельком, но в офисе Исполнительного комитета тебя вроде не встречала."
10016160-38 = "Да, если подумать, это наша первая официальная встреча. Но я много слышала о вас от Юки."
10016160-39 = "На этом Фестивале Хало я в основном занималась работой на местах, а вы преимущественно находились в офисе, поэтому мы почти не пересекались."
10016160-40 = "Понятно. Прошу прощения, что не представилась раньше."
10016160-41 = "Хасуми, ты ведь не участвовала ни в каких соревнованиях, кроме эстафеты?"
10016160-43 = "Было немало дисциплин, в которых ты могла бы отлично выступить, например стрельба или толкание ядра."
10016160-44 = "Почему ты ни в одной не участвовала?"
10016160-45 = "Ну, эм..."
10016160-46 = "Если честно, как человек, отвечающий за безопасность фестиваля, я считала неправильным расслабляться и наслаждаться атмосферой."
10016160-47 = "Чем сильнее я радовалась фестивалю, тем больше переживала, что кому-то придётся компенсировать моё веселье, поэтому я старалась не замечать праздник вокруг и сосредоточиться на обязанностях."
10016160-48 = "...Хотя, как выяснилось, даже это у меня не получилось."
10016160-49 = "Пока мы готовили нынешний Фестиваль Хало, я часто слышала подобное."
10016160-50 = "Будто фестиваль — игра с нулевой суммой счастья."
10016160-51 = "Будто день, которым все могут наслаждаться в равной степени, — лишь иллюзия."
10016160-52 = "Но я верю: если достаточно постараться, возможно всё что угодно и когда угодно."
10016160-54 = "Юука часто жалуется, что это совершенно неразумно, но лично мне нравится эта иррациональность."
10016160-55 = "..."
10016160-56 = "А ты, Хасуми? Тебе понравился этот неразумный фестиваль?"
10016160-57 = "Да. Было действительно весело."
10016160-58 = "Когда слышу это от тебя, понимаю, что все бессонные ночи подготовки к Фестивалю Хало того стоили."
10016160-59 = "Неплохой способ закончить день — посидеть за чаем со студентами других академий."
10016160-61 = "Даже если не ради фестиваля, стоит время от времени устраивать что-нибудь подобное."
10016160-62 = ""
10016160-64 = ""
10016160-65 = "Кстати, Хасуми, слышала когда-нибудь такую поговорку?"
10016160-67 = "Всё не закончено, пока не закончено."
10016160-68 = "Это какие?"
10016160-69 = "Я уже говорила: если достаточно стараться, всё может случиться когда угодно."
10016160-70 = "Кто знает? Например, какие-нибудь особенно увлечённые студенты могут устроить последние неприятности на вечеринке после фестиваля."
10016160-71 = "Учитывая всё, что сегодня произошло, я прекрасно понимаю твою тревогу."
10016160-72 = "Но я правда верю, что никто не окажется настолько глуп, чтобы устраивать проблемы, пока офицеры ученических советов каждой академии—"
10016160-73 = ""
10016160-77 = "Хасуми, у нас проблема!"
10016160-78 = "Студенты Геенны сцепились с охраной, потому что хотят использовать костёр вечеринки для барбекю!"
10016160-79 = "А ещё какие-то студенты пытаются бросить в костёр металлический порошок, потому что им не нравится цвет огня!"
10016160-80 = "..."
10016160-81 = "Ох, как ужасно."
10016160-82 = "Пожалуйста, вызовите всех членов Отряда правосудия, с которыми сможете сейчас связаться."
10016160-83 = "И скажите подготовить систему пожаротушения спортивного стадиона."
10016160-84 = "Где старшая администратор Геенны?"
10016160-85 = "Ну, насчёт этого... Администратор Ако сказала, что ей нужно найти президента Хину, и уже какое-то время её нет..."
10016160-86 = "А ещё система пожаротушения стадиона, эм, исчезла. Похоже, один из клубов Геенны утащил всё оборудование, чтобы разрабатывать горячий источник?"
10016160-87 = "..."
10016160-88 = ""
10016160-92 = "Боже мой! Чудовищные создания из столовой Геенны сбежали! Они несутся к толпе!"
10016160-93 = "Нет! Нет! Только не летающие блинчики!"
10016160-94 = ""
10016160-97 = ""
10016160-98 = "Я никогда..."
10016160-99 = "Я никогда не прощу Геенну!"
