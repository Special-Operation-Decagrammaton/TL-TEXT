[translation]
1013903-1 = "Поход Нико за продуктами"
1013903-2 = "Вечером я отправился встретиться с Нико и помочь ей с операцией."
1013903-3 = "Я нервно гадал, как выглядит особая миссия SRT... и насколько она опасна."
1013903-4 = ""
1013903-8 = "Но, добравшись до места, которое прислала Нико, я оказался перед переполненным супермаркетом."
1013903-9 = "[ns1] «Эм, Нико...»\n[ns2] «...Где мы?»"
1013903-12 = ""
1013903-13 = "Да. Это целевая точка особой снабженческой операции отряда FOX. Точка Майк."
1013903-14 = "С виду здесь обычная толпа на мирной улице..."
1013903-15 = "Но не теряйте бдительность, Сенсей. На самом деле это поле боя."
1013903-16 = "[s3] «Поле боя...?»\n[s4] «Кто-то угрожает терактом?»"
1013903-19 = "Нет, ничего настолько серьёзного."
1013903-20 = "Думаю, проще просто показать."
1013903-21 = "Сюда, Сенсей. Следуйте за мной."
1013903-22 = ""
1013903-24 = ""
1013903-27 = "Я вошёл за Нико в супермаркет и увидел настоящий хаос."
1013903-28 = "Некоторое время спустя..."
1013903-31 = "Сейчас ровно 18:00. Поэтому..."
1013903-32 = "Мы начинаем вечернюю распродажу!"
1013903-33 = "УРА-А-А-А!"
1013903-34 = ""
1013903-36 = ""
1013903-37 = ""
1013903-38 = "[ns] «А-а! Толпа...!»"
1013903-39 = "Паниковать нельзя, Сенсей."
1013903-40 = "Идём в Дельту-3, овощной отдел, и первым делом обеспечим морковь!"
1013903-41 = "[s] «Д-Да, мэм!»"
1013903-42 = ""
1013903-43 = ""
1013903-44 = "С этого момента все овощи по 99 йен?"
1013903-45 = "Ух, нельзя медлить! Народу слишком много!"
1013903-46 = "Что лучше? Эта или эта?"
1013903-47 = "Для начала возьму хоть что-нибудь—"
1013903-48 = ""
1013903-50 = ""
1013903-51 = ""
1013903-52 = ""
1013903-53 = "Вы это сейчас видели?!"
1013903-54 = "Тот студент! Она проскользнула сквозь толпу и мгновенно выбрала толстую сочную морковь!"
1013903-55 = "Морковь вся в земле! Как она так быстро нашла настолько идеальную?"
1013903-56 = ""
1013903-58 = ""
1013903-59 = ""
1013903-60 = "Обычно более грязная морковь свежее очищенной, потому что очищенную чаще обрабатывают консервантами. Но по одному цвету всё равно не определишь."
1013903-61 = "Вместо этого просто смотрите на сердцевину у основания ботвы! По ней сразу видно свежесть."
1013903-62 = "[s5] «Т-Ты потрясающая, Нико...»\n[s6] «У меня все силы ушли только на то, чтобы пройти сквозь толпу.»"
1013903-65 = "Вы слишком высокого обо мне мнения. По сравнению с нашими обычными операциями это пустяк."
1013903-66 = "Дальше Дельта-5 — картофельный отдел."
1013903-67 = "Пожалуйста, защищайте корзину всеми силами, Сенсей!"
1013903-68 = "[ns] «Не подведу, Нико!»"
1013903-69 = ""
1013903-71 = ""
1013903-72 = "Ах! Я смотрела именно на эту картофелину! Как она успела схватить её первой?!"
1013903-73 = "Она не обычный студент!"
1013903-74 = "Нужно шевелиться, иначе она заберёт всё хорошее раньше нас!"
1013903-76 = ""
1013903-77 = "Фух! С овощами должно хватить."
1013903-78 = "Дальше сектор Чарли-1 — мясной отдел..."
1013903-79 = "[s] «Я опять отвечаю за корзину?»"
1013903-80 = "Нет. Начиная с 18:10 мясной отдел каждые десять минут чередует скидки на свинину и говядину, так что если брать по очереди, оба предложения мы не успеем."
1013903-81 = "Сенсей, я займусь говядиной в точке Браво, а вы в это время возьмите свинину в точке Папа!"
1013903-82 = "Ваша цель — упаковка свиной грудинки весом 200 граммов..."
1013903-83 = "Сенсей, ни при каких обстоятельствах не берите её до того, как сотрудник наклеит стикер «-50%»!"
1013903-84 = "[s] «П-Понял...!»"
1013903-86 = "Без Нико это оказалось легче сказать, чем сделать. Толпа у точки Папа была беспощадной."
1013903-88 = ""
1013903-89 = ""
1013903-90 = ""
1013903-91 = "Дорогу, дорогу, дорогу! Я с самого начала смотрела на эту свиную лопатку!"
1013903-92 = "Свиные рёбрышки со скидкой 30%? От такого предложения я просто не могу отказаться!"
1013903-93 = ""
1013903-95 = ""
1013903-96 = ""
1013903-97 = "Простите. Я первая пройду здесь."
1013903-98 = ""
1013903-100 = ""
1013903-101 = "Тогда и я протиснусь..."
1013903-102 = ""
1013903-104 = ""
1013903-106 = "[ns] «Уф...»"
1013903-107 = "Толпа мотала меня из стороны в сторону, но к витрине я так и не приблизился."
1013903-108 = ""
1013903-111 = "Следующая распродажа начинается в мясном отделе!"
1013903-112 = "[ns] «(Сейчас...!)»"
1013903-117 = "[ns7] «А? Здесь только 30%...?»\n[ns8] «Я был уверен, что видел стикер „-50%“!»"
1013903-121 = ""
1013903-122 = "Хе-хе... Впервые в этом супермаркете, новичок?"
1013903-123 = "Стикеры «-30%» здесь очень похожи на «-50%», так что новички постоянно путают!"
1013903-124 = "Ты куда смотришь? Это отдел замороженного мяса!"
1013903-126 = "Подавленный напором опытных ветеранов закупок, я в итоге схватил не то."
1013903-127 = ""
1013903-128 = "FOX 2 вернулась."
1013903-129 = "Сенсей. Цель обеспечена?"
1013903-130 = "[s9] «Прости, меня полностью смяла толпа...»\n[s10] «Удалось найти только со скидкой 30%.»"
1013903-133 = "Ничего страшного! Я взяла говядину со скидкой 70%, так что в среднем всё отлично!"
1013903-134 = "[s11] «Семьдесят процентов?!»\n[s12] «Как тебе вообще это удалось?»"
1013903-137 = "Фуфу, некоторые называют это «искусством переговоров»."
1013903-138 = "В конце концов, умение успешно вести переговоры — обязательный навык спецподразделения."
1013903-139 = "[ns] «Я снова поражён навыками SRT...»"
1013903-141 = "[ns13] «Но в последнее время с деньгами тяжело?»\n[ns14] «Вам не хватает на еду? Я могу помочь.»"
1013903-144 = "Нет, питание во время операций — наша ответственность. Я не могу принять такую помощь."
1013903-145 = "Конечно, важно нормально питаться, но нет гарантии, что у нас всегда будет доступ к хорошим продуктам."
1013903-146 = "Поэтому мы и изучаем разные навыки выживания — например, как обеспечить стабильный источник еды где угодно. В горах ли мы или за линией врага, мы обязаны уметь себя прокормить."
1013903-147 = "Ни одна операция не пойдёт гладко, если мы пропускаем еду."
1013903-148 = "После условно-досрочного освобождения из Исправительного бюро мы получаем бюджет от Генерального студенческого совета, но для операций его недостаточно."
1013903-149 = "Я хочу, чтобы товарищи по отряду получали все необходимые питательные вещества, поэтому уже привыкла вырезать купоны."
1013903-150 = "Наверное, со стороны это выглядит немного жалко, правда, Сенсей?"
1013903-151 = "[ns15] «Нет-нет! Я вообще так не думал!»\n[ns16] «Наоборот, меня впечатляет, как ты заботишься об отряде.»"
1013903-155 = "[ns] «Теперь понимаю, почему тебя называют „мамой отряда“.»"
1013903-156 = "Хи-хи. «Мамой отряда», говорите?"
1013903-157 = "Я постоянно это слышу от них, но от вас звучит немного неловко."
1013903-158 = "Не думаю, что действительно заслуживаю такую роль."
1013903-159 = "[s] «Ты была бы отличной мамой, Нико.»"
1013903-160 = "А-ха-ха..."
1013903-161 = "Очень мило с вашей стороны. Спасибо."
1013903-162 = "Похоже, распродажа уже почти закончилась."
1013903-163 = "Мне нужно вернуться за луком, а ещё понадобится порошок карри."
1013903-164 = "[s] «У полок со специями тихо, я схожу за ним.»"
1013903-165 = "А, Сенсей. Секунду."
1013903-166 = "[s] «Для покупки карри тоже есть специальные приёмы?»"
1013903-167 = "Нет, ничего такого... Только это секрет, хорошо?"
1013903-168 = ""
1013903-170 = ""
1013903-171 = ""
1013903-172 = "Промышленные продукты вроде карри дешевле в другом супермаркете."
1013903-173 = ""
1013903-175 = ""
1013903-176 = ""
1013903-177 = "Тогда берём оставшееся и на кассу!"
1013903-178 = ""
1013903-180 = ""
1013903-182 = "Мы с Нико заехали в последний супермаркет за порошком карри, а затем вернулись в Шале."
1013903-183 = "Карри Нико оказался настолько вкусным, что невозможно было поверить: все продукты куплены на вечерней распродаже."
