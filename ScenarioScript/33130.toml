[translation]
33130-1 = "Episódio 13;O Outro Lado Inalcançável"
33130-2 = "..."
33130-3 = "A Hanako é esperta."
33130-4 = "Só com as informações espalhadas pelo tabuleiro, alguém como ela certamente conseguiria chegar bem perto da verdade."
33130-5 = "A situação que está se desenrolando agora, a causa dela e até o fato de que não há nada que ela possa fazer para impedir isso. Ela já deve ter entendido tudo."
33130-6 = "A Escola Geral Trinity, da qual ela finalmente havia começado a gostar... Ter que assistir ao seu fim de mãos atadas é algo cruel para a Hanako."
33130-7 = "..."
33130-8 = "E parece que ela não é a única prestes a chegar a essa conclusão. Bem, dizer que \"não é a única\" aqui não significa, de forma alguma, algo esperançoso."
33130-9 = "A Hifumi, que estava correndo de um lado para o outro atrás da Azusa... também parece estar chegando a uma conclusão parecida."
33130-10 = "Uma única mensagem. Coordenadas, um horário e um código usando o nome de um animal. Ela não é do tipo que deixaria de perceber quem enviaria uma mensagem dessas."
33130-17 = "Azusa-chan...?"
33130-18 = "Azusa-chan, sou eu. Onde você está...?"
33130-19 = "Azusa-chan... Por favor, me responda, Azusa-chan...!"
33130-25 = "Azusa-chan...?"
33130-26 = "...Hifumi."
33130-27 = "Azusa-chan, onde você estava até agora...? A escola está um caos..."
33130-28 = "...Sim, eu sei."
33130-29 = "Azusa-chan...?"
33130-30 = "...Alguém precisa pôr um fim nisso."
33130-31 = "O que você quer dizer com isso...? Por que está fazendo essa cara...?"
33130-32 = "Azusa-chan..."
33130-38 = "Não chegue perto!!"
33130-39 = "...!!"
33130-40 = "..."
33130-41 = "...Obrigada, Hifumi."
33130-42 = "Mas é só até aqui. Você não pode passar daqui."
33130-43 = "Daqui em diante, é o meu lugar."
33130-44 = "Uma pessoa boa como você, Hifumi, não deve dar mais nenhum passo."
33130-45 = "A-Azusa-chan...? Do que... do que você está falando...?"
33130-46 = "Por que eu não posso ir...?"
33130-50 = "...Essa é uma história que não combina com alguém comum e gentil como você, Hifumi."
33130-51 = "Azusa-chan, eu...!"
33130-52 = "\"Assassina.\""
33130-53 = "...!"
33130-54 = "...Se eu me tornar uma assassina, não poderemos mais ser amigas, não é?"
33130-55 = "A-Azusa-chan...?"
33130-56 = "Mas... mas você jamais faria uma coisa dessas, Azusa-chan..."
33130-57 = "A culpa é minha."
33130-58 = "Por minha causa, todo mundo se machucou... e o Sensei foi baleado."
33130-59 = "O Comitê de Justiça, a Tea Party, a Irmandade e até o pessoal de Gehenna..."
33130-60 = "A Seia ter entrado em coma, a escola ter sido destruída até esse ponto... é tudo culpa minha."
33130-61 = "Você, Hifumi, e também a Hanako e a Koharu. Se continuar assim, todas vocês vão correr perigo também."
33130-63 = "I-Isso não é culpa sua, Azusa-chan... Isso é..."
33130-64 = "V-Vai ficar tudo bem. O-O Sensei..."
33130-65 = "Tenho certeza de que o Sensei vai acordar logo... então...!"
33130-66 = "Hifumi."
33130-67 = "Esse tipo de final feliz... não existe neste mundo."
33130-68 = "..."
33130-69 = "Agora mesmo, eu vou lá para \"destruir\" o halo da Saori."
33130-70 = "Fora isso, não há outro jeito de parar essa situação."
33130-71 = "E-Espere, por favor! Um jeito... com certeza deve haver outro jeito...!"
33130-77 = "Eu vou matar uma pessoa agora."
33130-78 = "Uma existência criada num lugar onde isso é normal, ensinada de que isso é normal e treinada para agir como se isso fosse normal..."
33130-79 = "Essa sou eu de verdade."
33130-80 = "Alguém como eu não pode viver no mesmo mundo que você, Hifumi."
33130-81 = "Azusa-chan...?"
33130-86 = "...Hifumi. Obrigada por me considerar sua amiga."
33130-89 = "Obrigada por me chamar de \"Azusa-chan\"."
33130-92 = "Obrigada por me dar aquela pelúcia fofa."
33130-97 = "Obrigada por me levar à praia. Obrigada por me dar lembranças tão divertidas."
33130-100 = "Obrigada por me ensinar que existem coisas fofas, coisas bonitas,"
33130-101 = "e tantas coisas que eu não conhecia."
33130-106 = "Os dias no Clube de Aulas de Reforço..."
33130-107 = "Foi tão bom ter passado dias tão maravilhosos e aprendido tantas coisas."
33130-111 = "Aprender foi algo realmente divertido... Nem na morte vou esquecer o tempo que passei até aqui."
33130-112 = "Mesmo que por pouco tempo, fico feliz por ter sido uma aluna do Clube de Aulas de Reforço..."
33130-117 = "Obrigada, Hifumi. Adeus."
33130-121 = "Azusa-chan..."
33130-122 = "Não pode ser, espere, espere por favor..."
33130-123 = "Com certeza há outro jeito... O-O Sensei, todo mundo..."
33130-124 = "Porque... porque a gente ainda..."
33130-125 = "A gente não prometeu que \"da próxima vez vamos todas juntas à praia\"...? A gente nem conseguiu assistir juntas ao anime de aventura do Peroro-sama ainda..."
33130-126 = "N-Não vá, por favor..."
33130-127 = "Azusa-chan... Não, não vá... Espere, por favor, Azusa-chan..."
33130-129 = "Azusa-chan!!!!"
33130-135 = "Próximo;Na Escuridão"
