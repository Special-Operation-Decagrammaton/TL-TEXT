[translation]
33130-1 = "Эпизод 13;Недостижимая сторона"
33130-2 = "..."
33130-3 = "Интересно."
33130-4 = "Ханако — умная девушка. Даже имея совсем немного информации, она смогла докопаться до истины."
33130-5 = "Она поняла обстоятельства, вычислила виновника и осознала, что у неё нет средств всё это остановить."
33130-6 = "Трагично. Ханако поняла всё это как раз тогда, когда начала по-настоящему ценить Тринити."
33130-7 = "..."
33130-8 = "Но она не единственная, кто добрался до истины."
33130-9 = "Хифуми получила сообщение, пока искала Азусу."
33130-10 = "В сообщении были только координаты, время и название животного в качестве кодового слова. Странно, но Хифуми наверняка поняла, кто его отправил."
33130-11 = ""
33130-17 = "Азуса?"
33130-18 = "Это я. Где ты? Я пришла, как ты сказала."
33130-19 = "Ты здесь, Азуса? Пожалуйста, ответь..."
33130-20 = ""
33130-22 = ""
33130-23 = ""
33130-25 = "Азуса?"
33130-26 = "Хифуми."
33130-27 = "Где ты была? Весь район сейчас в панике!"
33130-28 = "Я знаю."
33130-29 = "Азуса...?"
33130-30 = "Кто-то должен положить этому конец."
33130-31 = "Что ты имеешь в виду? Что случилось?"
33130-32 = "Азуса?"
33130-33 = ""
33130-35 = ""
33130-36 = ""
33130-38 = "Не подходи ближе!"
33130-39 = "...!"
33130-40 = "..."
33130-41 = "Спасибо, Хифуми."
33130-42 = "Но здесь мы прощаемся. Тебе нельзя подходить ближе."
33130-43 = "Ещё один шаг. Сделаешь ещё шаг — и окажешься там, где студентам быть не место."
33130-44 = "Вот моё место. Не твоё."
33130-45 = "Азуса? Я не совсем понимаю, о чём ты."
33130-46 = "Хочешь сказать, я недостаточно хороша? Ты это имеешь в виду?"
33130-47 = ""
33130-49 = ""
33130-50 = "Это место не для обычной девушки вроде тебя, Хифуми."
33130-51 = "Но, Азуса...!"
33130-52 = "Убийца."
33130-53 = "...!"
33130-54 = "Ты можешь дружить с убийцей?"
33130-55 = "Что ты такое говоришь...?"
33130-56 = "У-Убийство? Ты бы никогда не сделала ничего подобного..."
33130-57 = "Это моя вина."
33130-58 = "То, что случилось с Сенсеем, произошло из-за меня. Все страдают по моей вине."
33130-59 = "Отряд правосудия, Чаепитие, Сестринство, даже студенты Геенны."
33130-60 = "Сэя в коме, город разрушается... и всё это моя вина."
33130-61 = "Лишь вопрос времени, когда вы с Ханако и Кохару тоже окажетесь в опасности."
33130-63 = "Н-Не говори так. Это не твоя вина."
33130-64 = "Всё будет хорошо."
33130-65 = "Сенсей скоро очнётся. Я просто знаю..."
33130-66 = "Хифуми."
33130-67 = "В настоящем мире не бывает сплошных счастливых концовок."
33130-68 = "..."
33130-69 = "Мне пора. Я должна уничтожить нимб Саори."
33130-70 = "Другого способа закончить это нет."
33130-71 = "Т-Ты же не серьёзно. Должен быть другой выход."
33130-72 = ""
33130-75 = ""
33130-77 = "Я убийца."
33130-78 = "Меня именно этому и учили. Убивать так, будто это естественно, как дышать."
33130-79 = "Вот какая я на самом деле."
33130-80 = "Мне не место в том мире, откуда ты, Хифуми."
33130-81 = "Это... неправда."
33130-86 = "Спасибо, что была моей подругой.[wa:500]"
33130-89 = "Спасибо, что так добра ко мне.[wa:500]"
33130-92 = "Спасибо за подарок.[wa:500]"
33130-97 = "Спасибо, что сводила меня на пляж, и за воспоминания, которые мы создали#nв тот день.[wa:4000]"
33130-100 = "Спасибо, что показала мне красоту этого мира.[wa:2700]"
33130-101 = "Я счастлива, что смогла учиться и расти..."
33130-106 = "...вместе с тобой и Клубом дополнительных занятий.[wa:3000]"
33130-107 = "Я и не знала, что учёба может быть такой весёлой.[wa:3500]"
33130-111 = "Я никогда не забуду дни, которые мы провели вместе, и всё, чему научились."
33130-112 = "Я благодарна за возможность побыть настоящим студентом."
33130-113 = ""
33130-115 = ""
33130-116 = ""
33130-117 = "Прощай, Хифуми. Береги себя."
33130-118 = ""
33130-120 = ""
33130-121 = "Азуса?"
33130-122 = "Пожалуйста, не уходи..."
33130-123 = "Должен быть другой способ. Уверена, Сенсей и остальные..."
33130-124 = "Азуса..."
33130-125 = "Мы ведь обещали в следующий раз все вместе сходить на пляж. И нам ещё нужно посмотреть премьеру нового аниме про Пероро."
33130-126 = "Я..."
33130-127 = "Ты не можешь просто вот так меня бросить..."
33130-129 = "Азуса!!!"
33130-135 = "Следующий эпизод;Свет во тьме"
