[translation]
1008206-1 = "Ценность юности"
1008206-3 = "[ns] «Надо успеть разобраться с работой до прихода Рэнгэ.»"
1008206-11 = "[ns] «С этой стопкой вроде закончил. Дальше...»"
1008206-14 = "К тому моменту, как я разобрал основную часть работы, уже почти настало время встречи с Рэнгэ."
1008206-15 = ""
1008206-18 = "[ns] «...Уф. А когда я вообще в последний раз ел?»"
1008206-19 = "Я потерял счёт времени за работой и пропустил пару приёмов пищи. Но как раз когда я собирался решить эту проблему..."
1008206-20 = ""
1008206-23 = ""
1008206-24 = "Сэн—"
1008206-25 = "Кхм! Наставник! Я пришла!"
1008206-26 = "Давай и сегодня отлично проведём время в погоне за нашей юностью!"
1008206-27 = ""
1008206-29 = ""
1008206-30 = "...С тобой всё хорошо, Наставник? Ты выглядишь немного вымотанным. И сосредоточен хуже обычного."
1008206-31 = "[s] «Ничего серьёзного. Просто устал от работы.»"
1008206-32 = "Хм, вот как?"
1008206-33 = "Точно только это?"
1008206-34 = "[s] «Обещаю. Мне уже лучше, раз ты пришла.»"
1008206-35 = "Ч-что?!"
1008206-36 = "Т-Ты не можешь вот так просто говорить такие вещи, Сенсей!"
1008206-37 = "Хорошо ещё, что я студент юности! Иначе от такой фразы у меня бы ноги подкосились!"
1008206-38 = "Ты и правда настоящий наставник юности!"
1008206-39 = "[s1] «Вообще-то я не это имел в виду.»\n[s2] «Ты повысилась с новичка юности!»"
1008206-40 = ""
1008206-41 = ""
1008206-43 = ""
1008206-44 = "Ну, раз ты в порядке, у нас сегодня длиннющий список юношеских занятий!"
1008206-45 = "Нельзя терять время впустую."
1008206-46 = "[s] «Вперёд!»"
1008206-47 = ""
1008206-50 = ""
1008206-52 = "Мы посвятили весь день поиску юности Рэнгэ."
1008206-55 = ""
1008206-56 = ""
1008206-59 = ""
1008206-60 = ""
1008206-62 = "Но тогда..."
1008206-67 = "Ого!"
1008206-68 = "Сегодня был очень насыщенный и по-настоящему юношеский день, Наставник!"
1008206-69 = "Я сегодня набралась столько опыта! Столько очков накопила, что, кажется, даже уровень подняла!"
1008206-70 = "Не успеешь оглянуться, как я стану мастером юности, Наставник."
1008206-71 = "[s3] «Сначала новичок юности, потом студент, а дальше мастер!»\n[s4] «Понятно! Тут целая система уровней!»"
1008206-74 = "Я твёрдо верю, что во всём нужно соблюдать правильный порядок!"
1008206-75 = "Как всегда, спасибо, что участвуешь в—"
1008206-76 = ""
1008206-79 = ""
1008206-81 = ""
1008206-83 = ""
1008206-84 = "А? Что случилось? Ты какой-то бледный."
1008206-85 = "[s] «Прости, Рэнгэ. Я просто...»"
1008206-86 = ""
1008206-88 = ""
1008206-90 = ""
1008206-92 = ""
1008206-96 = ""
1008206-97 = "Н-Наставник?!"
1008206-98 = ""
1008206-100 = ""
1008206-101 = "Скажи что-нибудь! Наставник!"
1008206-102 = ""
1008206-105 = "...?"
1008206-108 = "Рэнгэ каким-то образом помогла мне добраться обратно до Шале."
1008206-111 = "Итак, подведём итог..."
1008206-112 = "Ты так увлёкся работой, что сегодня вообще ничего не ел?"
1008206-113 = "А потом, проведя со мной весь день, потерял сознание от голода?"
1008206-114 = "[s] «...Да, всё верно.»"
1008206-115 = "...Угхххх."
1008206-116 = "[s] «Эм... Рэнгэ? Почему у тебя такое лицо?»"
1008206-117 = ""
1008206-119 = ""
1008206-120 = "Сенсей! Как ты вообще мог так поступить?!"
1008206-122 = "[ns] «Ого?! Вот такой реакции я точно не ожидал!»"
1008206-123 = "Неважно, сколько у тебя работы! Нормальное питание — основа здоровья!"
1008206-124 = "Это фундамент вообще всего! Пропускать еду совершенно недопустимо!"
1008206-125 = "Что бы случилось, если бы меня сегодня рядом не было? А если бы ты потерял сознание на улице один?!"
1008206-126 = "Постой, постой, постой. Если Сенсей был настолько занят, что даже не мог поесть..."
1008206-127 = ""
1008206-129 = ""
1008206-130 = "Неужели это случилось..."
1008206-131 = "...из-за меня?"
1008206-132 = "[s] «Что? Конечно нет. Просто работы накопилось слишком много.»"
1008206-133 = "Я понимаю, но..."
1008206-134 = "Если бы я не втянула тебя в это наставничество по юности, может, у тебя бы не скопилось столько работы."
1008206-135 = "Ты всё это время помогал мне, совсем не думая о себе."
1008206-136 = "Всё случилось потому, что твоё расписание оказалось забито моими юношескими занятиями. Из-за меня..."
1008206-137 = "[s] «Я сам решил помогать тебе, Рэнгэ. Ты меня ни к чему не принуждала.»"
1008206-138 = "Сенсей..."
1008206-139 = "..."
1008206-140 = "Тебе серьёзно нужно следить за тем, что ты говоришь в такие моменты!"
1008206-141 = "Если бы я не была экспертом по юности, ещё одна такая фраза точно сразила бы меня наповал!"
1008206-142 = "[s] «...Ты опять повысила уровень?»"
1008206-143 = "Сколько раз мне ещё говорить тебе не цепляться к мелочам!"
1008206-144 = "(Всё это случилось из-за меня и моей погони за юностью. Я должна как-то отплатить Наставнику...)"
1008206-145 = ""
1008206-147 = ""
1008206-148 = ""
1008206-149 = "Ах."
1008206-150 = "Мне пришла хорошая идея, так что на сегодня давай закончим, ладно?"
1008206-151 = ""
1008206-154 = ""
1008206-155 = "Мне нужно идти! Но не забудь поесть, Сенсей! Серьёзно!"
1008206-156 = "До скорого!"
1008206-157 = ""
1008206-159 = ""
1008206-160 = "[ns] «А... Хорошо? Пока?»"
1008206-163 = "[ns] «Не хотел заставлять Рэнгэ так переживать.»"
1008206-165 = "Я всё ещё прокручивал в голове события дня, когда мне позвонили."
1008206-172 = "[ns] «Алло? Сенсей слушает.»"
1008206-173 = ""
1008206-174 = "Сенсей! Я тут подумала, не заинтересует ли тебя—"
1008206-175 = "...А? Я мошенница? И ты больше на это не купишься?!"
1008206-176 = "Ч-Что ты вообще такое говоришь?! Хотя... Ладно. Наверное, начало и правда прозвучало подозрительно."
1008206-177 = "Но это действительно я, Рэнгэ! Это не мошенничество! И у меня важный вопрос."
1008206-178 = "Ну, эм... Я просто хотела узнать, есть ли у тебя любимое блюдо... или, знаешь, что-то, что ты вообще не можешь есть. Аллергии есть?"
1008206-179 = "...А? Зачем я спрашиваю?"
1008206-180 = "Э-Это для школьного проекта! Я опрашиваю кучу людей. Вообще всех членов Хяккарёран!"
1008206-181 = "А тебя решила спросить просто мимоходом. Ничего серьёзного, ясно?!"
1008206-182 = ""
1008206-185 = "[ns] Ответить на вопросы Рэнгэ."
1008206-189 = "...Хорошо. Сейчас только запишу... Отлично!"
1008206-190 = "Теперь у меня есть всё, что нужно! Так что берегись, Сенсей!"
1008206-191 = "[s] «Почему у тебя угроза - реакция по умолчанию?!»"
1008206-192 = "Увидимся завтра!"
1008206-193 = ""
1008206-195 = ""
1008206-199 = "После этого хаотичного разговора я повесил трубку, одновременно обеспокоенный и заинтригованный."
1008206-203 = "И вот наконец наступило завтра."
1008206-209 = "Я занимался работой в Шале."
1008206-210 = ""
1008206-214 = ""
1008206-215 = "[ns] «Привет, Рэнгэ. Я думал, ты сегодня придёшь.»"
1008206-216 = ""
1008206-218 = ""
1008206-219 = "П-Приду! Вроде того! Я просто морально готовлюсь войти внутрь."
1008206-220 = "Угх! Самой войти в здание и вручить это тебе — слишком даже для Эксперта по юности Рэнгэ!"
1008206-221 = "...Ты ведь там, Сенсей? В Шале? И один?"
1008206-222 = "...Хорошо, отлично. Тогда можешь выйти на минутку, Сенсей?"
1008206-223 = "Я буду в парке прямо рядом со зданием!"
1008206-224 = "С-Скоро увидимся!"
1008206-232 = "[ns] «Она сказала, что будет в парке...»"
1008206-233 = ""
1008206-235 = ""
1008206-236 = "Сенсей! Сюда!"
1008206-237 = "Спасибо, что вышел встретить меня."
1008206-238 = "Понимаешь, я поняла, что ты нормально не ел и отставал по работе, потому что тратил столько сил... на меня."
1008206-239 = "[s] «Я правда обещаю, что помогал тебе с удовольствием.»"
1008206-240 = "А мне совсем не нравится, что ты из-за меня страдаешь, ясно?!"
1008206-241 = ""
1008206-243 = ""
1008206-244 = "Поэтому... Вот... Это тебе!"
1008206-245 = ""
1008206-249 = "[ns] «А...»"
1008206-250 = ""
1008206-254 = "[ns] «Бэнто...?»"
1008206-255 = "― [log=렌게]Д-Да![/log][wa:870]"
1008206-257 = "― [log=렌게]Ты как всегда наблюдателен! Другого я и не ожидала.[/log][wa:110]"
1008206-260 = "― [log=렌게]Я-я приготовила это для тебя, Наставник![/log][wa:1890]"
1008206-263 = "[ns] «Я очень ценю это, но... по какому поводу?»"
1008206-264 = "― [log=렌게]Всё это время я вела себя ужасно эгоистично.[/log][wa:1350]"
1008206-266 = "― [log=렌게]Я столько от тебя требовала и ничего не давала взамен.[/log][wa:10]"
1008206-269 = "― [log=렌게]Я и правда была одной сплошной обузой...[/log][wa:10]"
1008206-271 = "― [log=렌게]Поэтому я хотела выразить свою благодарность...[/log][wa:960]"
1008206-274 = "― [log=렌게]Я-я впервые готовлю что-то подобное...[/log][wa:40]"
1008206-276 = "― [log=렌게]Так что, пожалуйста, не жди качества уровня ресторана...[/log][wa:1290]"
1008206-279 = "― [log=렌게]Может, я ещё недостаточно прокачалась для этого финального события юности.[/log][wa:1040]"
1008206-281 = "― [log=렌게]Н-Но я вложила в него всю себя![/log][wa:1490]"
1008206-284 = "[ns] «...Спасибо, Рэнгэ. Я очень это ценю.»"
1008206-285 = "― [log=렌게]А! Эм... Правда?[/log][wa:2620]"
1008206-288 = "― [log=렌게]Надеюсь, тебе[/log][wa:2290]"
1008206-290 = "― [log=렌게]п-понравится...[/log][wa:2280]"
1008206-293 = "У меня получилось! Я ведь отдала тебе его, да?"
1008206-294 = "Считаю, что это ещё одно повышение уровня юности!"
1008206-295 = ""
1008206-297 = ""
1008206-298 = "Ну! Ладно! П-Пока, Сенсей!"
1008206-299 = ""
1008206-301 = ""
1008206-304 = "Я вернулся в кабинет и попробовал домашнее бэнто Рэнгэ. Оно оказалось очень вкусным."
