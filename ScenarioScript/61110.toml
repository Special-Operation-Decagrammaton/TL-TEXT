[translation]
61110-1 = "Эпизод 11;Экскурсия 1"
61110-4 = ""
61110-5 = "[ns1] «Ещё один чудесный день!»\n[ns2] «Ещё один весёлый день занятий!»"
61110-8 = "«Весёлый». Как вы умудряетесь так невозмутимо мне лгать?"
61110-9 = "Я... Я о-очень усердно готовилась в этот раз!"
61110-10 = "[s] «О-о, молодец! Вот это моя Хиёри!»"
61110-11 = "Е-Ещё... Хи-хи... Хвалите меня ещё..."
61110-12 = "Ведь нет никакой гарантии, что завтра будет таким же, как сегодня...!"
61110-13 = "Только потому, что сегодня солнце взошло на востоке, нельзя со стопроцентной уверенностью сказать, что завтра оно тоже взойдёт на востоке!"
61110-14 = "[s3] «Именно! Это скептический эмпиризм!»\n[s4] «А он прямо ведёт к деонтологической этике!»"
61110-17 = "Я-Я это видела! В книге, которую вы мне дали, Сенсей!"
61110-22 = ""
61110-23 = "А теперь проведём внезапный тест."
61110-24 = ""
61110-26 = ""
61110-27 = ""
61110-28 = "В-внезапный ЧТО?"
61110-29 = "В-внезапный «тест»? То есть это разновидность экзамена?"
61110-30 = ""
61110-32 = ""
61110-33 = ""
61110-34 = ""
61110-35 = "Да. Быстрая и упрощённая версия."
61110-36 = "Я буду вслух читать вопросы, а вы записывайте ответы на бумаге."
61110-38 = ""
61110-39 = "Эм... Хм... Мы это проходили..."
61110-40 = "Уф, будто помню, но одновременно и нет."
61110-42 = ""
61110-43 = "О, вспомнила! Она ведь говорила, что можно спрашивать, если чего-то не знаем? Эй, какой ответ здесь?"
61110-44 = "Здесь? Эм, кажется..."
61110-46 = "Эй, не списывать."
61110-48 = "«Списывать»? Это что?"
61110-50 = "Во время экзамена копировать чужие ответы или обсуждать их друг с другом считается списыванием."
61110-52 = "Но я думала, можно спрашивать, если не знаешь!"
61110-54 = "Когда учишься и занимаешься."
61110-56 = "То есть... экзамен — это совсем не то же самое, что учёба? Я и не знала..."
61110-58 = "...Мы из одной школы, но я всерьёз за них переживаю."
61110-65 = "[ns] «Я немного...»"
61110-67 = "[ns] «Ах, какая сегодня хорошая погода.»"
61110-68 = "Мы точно смотрим на одно и то же небо? На то, которое затянуто мрачными облаками?"
61110-69 = ""
61110-71 = ""
61110-73 = "[ns5] «Чувства и мнения субъективны...»\n[ns6] «„Хорошо“ — это моё мнение.»"
61110-76 = "Как скажешь..."
61110-77 = "Ладно, к чему вы ведёте?"
61110-78 = "[s] «Мы впустую тратим такой прекрасный день!»"
61110-79 = "Я всё ещё не понимаю..."
61110-80 = ""
61110-83 = "[ns] «Пойдём на экскурсию!»"
61110-84 = "Теперь-то вы что несёте?!"
61110-87 = ""
61110-88 = "Так... можно...?"
61110-89 = "Что? Некоторые вещи в жизни нужно познавать на практике?"
61110-90 = "Вы считаете это школьной работой, потому что урок всё ещё продолжается...?"
61110-91 = "Вы только что на ходу это придумали, чтобы вам было удобно."
61110-92 = "[s] «Ай. Попался.»"
61110-93 = "Вы иногда бываете довольно хитрым, знаете ли."
61110-94 = "[s] «Это привилегия взрослого.»"
61110-95 = "Хочешь присесть, Субару? Наверное, ноги устали."
61110-96 = "И вы тоже, Сенсей. Ноги не болят?"
61110-97 = "Вообще-то совсем не чувствую усталости."
61110-98 = ""
61110-100 = ""
61110-101 = ""
61110-102 = "Немного странно."
61110-103 = "Я никогда не думала, что вот так снова вернусь во внешний мир."
61110-104 = "..."
61110-105 = "В этот раз всё ощущается... совсем иначе."
61110-106 = ""
61110-109 = "Ай...!"
61110-110 = "Ты в порядке? Что случилось, Майя?"
61110-111 = "Простите! Я в порядке. Просто кое-что вспомнила. Хи-хи."
61110-112 = "..."
61110-113 = "[s] «Воспоминания о тех временах?»"
61110-114 = "...!"
61110-115 = "Н-Нет. Ничего, Сенсей... по крайней мере, ничего серьёзного."
61110-116 = "..."
61110-117 = "Майя ведь говорила, что недавно ей приснился кошмар. Вот и всё."
61110-118 = "[s] «Но...»"
61110-119 = "Не волнуйтесь, Сенсей."
61110-120 = ""
61110-122 = ""
61110-123 = "[ns] «Ты уверена?»"
61110-124 = "Да."
61110-125 = "Знаете, это я здесь изображала психотерапевта для всех студентов."
61110-126 = "Э-Это правда..."
61110-127 = ""
61110-129 = ""
61110-131 = "Сенсей! Куда мы идём сначала?"
61110-132 = "Здесь всё такое яркое... Я даже не понимаю, где лево, а где право."
61110-134 = "..."
61110-135 = "Полагаю, вы пришли сюда с планом?"
61110-136 = "Если вы забыли, идея с экскурсией была вашей."
61110-137 = "[s] «Ага, всё под контролем! Просто доверьтесь своему учителю!»"
61110-138 = "Ого, смотрите. Это здание из стекла? Как блестит..."
61110-139 = "В Ариусе такое здание долго бы не простояло."
61110-140 = "Как думаете, члены отряда видят такое каждый день?"
61110-141 = "Жаль, что они не смогли пойти с нами."
61110-142 = "Ничего не поделаешь. Кто-то должен присматривать за Ариусом, пока нас нет."
61110-143 = "Но отряд и то, какими они стали сейчас... Правда ли им можно это доверить?"
61110-144 = "..."
61110-145 = "Так или иначе, Сенсей берёт там ответственность на себя."
61110-146 = "Верно, Сенсей?"
61110-147 = "[s] «Ага, всё под контролем! Просто доверьтесь своему учителю!»"
61110-148 = "..."
61110-149 = "*вздыхает*..."
61110-151 = "Официально отряд остался защищать Ариус и присматривать за районом."
61110-152 = "Но настоящая причина, почему они не смогли пойти на экскурсию, была совсем в другом..."
61110-153 = ""
61110-154 = "В конце концов, мы всё ещё разыскиваемые преступницы."
61110-155 = "Мы не можем свободно передвигаться. Лучше лишний раз не высовываться."
61110-156 = "...А я так ждала экскурсии вместе с Сенсеем."
61110-157 = "Хи-хи... Я тоже, но... что поделать. Я уже привыкла разочаровываться..."
61110-158 = ""
61110-160 = ""
61110-161 = ""
61110-162 = "Немного иронично, что в розыске именно вы."
61110-163 = "Серьёзно, сколько вы ещё собираетесь играть в беглянок, отряд?"
61110-164 = "Ты...!"
61110-165 = "..."
61110-166 = "Отставить, Мисаки."
61110-167 = "...Тц."
61110-169 = ""
61110-170 = ""
61110-171 = "Вы думаете об отряде, верно?"
61110-172 = "[s] «?!?!»"
61110-173 = "Удивлены?"
61110-174 = "Вы читаетесь проще, чем думаете, Сенсей. Особенно в таких вещах."
61110-175 = "..."
61110-176 = "Я хотела кое-что спросить."
61110-177 = "Кто для вас члены отряда? Студенты Ариуса? Или кто-то ещё?"
61110-178 = "А, причины никакой. Просто мимолётное любопытство. Правда."
61110-179 = "[s] «Это...»"
61110-180 = ""
61110-182 = ""
61110-183 = "Хорошо, что вы двое выглядите такой отличной командой! Наверное, непросто управляться с таким количеством студентов."
61110-184 = "Что...?"
61110-185 = "А?!?!"
61110-186 = "Ч-Что вы имеете в виду?!"
61110-187 = "Ах, прошу прощения! Наверное, вы учительница-практикантка под началом такого замечательного наставника. Обязательно научитесь у него всему, чему сможете!"
61110-188 = "П-П-Постойте! Вы всё совершенно неправильно поняли! С-Сенсей! Помогите!"
61110-189 = "В смысле, они мягко мне улыбаются? А-а! А-А-А-а!! Я серьёзно, вы всё не так поняли! Это не...! Мы не...!"
61110-190 = "Хо-хо, ох! Молодость! Что ж, этому нежеланному старому третьему колесу лучше удалиться."
61110-191 = "Да я пытаюсь вам сказать, всё совсем не так!"
61110-197 = "..."
61110-198 = "..."
61110-199 = "Это просто охрененно!!"
61110-200 = "Странно... Все здания целые..."
61110-201 = "У нас дома здания постоянно разваливаются и лежат в руинах. Обычно мы просто латаем их, пока не выжмем из них последнюю каплю пользы."
61110-202 = "А когда одно наконец рушится, мы устраиваем маленькую поминальную церемонию и благодарим его за всё, что оно для нас сделало..."
61110-203 = "[s] «А теперь все перейдём на другую сторону улицы!»"
61110-204 = "Переходим дорогу? Мне уже идти?"
61110-205 = ""
61110-208 = ""
61110-209 = "Ого?! Почему вы меня оттягиваете, Сенсей?!"
61110-210 = "[s] «Нельзя переходить дорогу на красный свет!»"
61110-211 = "Серьёзно...?"
61110-212 = "Так вот как здесь всё работает..."
61110-213 = "Но я не думаю, что от машины мы пострадаем ПРЯМ настолько сильно. Мы довольно крепкие, знаете ли."
61110-214 = "А? Попробовать представить, что почувствует водитель? Ну, могу попробовать..."
61110-216 = ""
61110-217 = ""
61110-218 = ""
61110-219 = "«Бассейн»...?"
61110-220 = "Что это за место...?"
61110-221 = "Говорят, это спортивный объект, построенный исключительно для занятия чем-то под названием «плавание»."
61110-223 = "Как в одном месте может быть СТОЛЬКО чистой воды?! Это безумие!"
61110-224 = ""
61110-226 = ""
61110-229 = ""
61110-230 = "А? Что теперь, Сенсей?"
61110-231 = "[s] «Нельзя пить воду из бассейна...»"
61110-232 = ""
61110-234 = ""
61110-235 = ""
61110-236 = "Н-Но её же так много!"
61110-237 = "Пахнет свежо, так что живот, наверное, не заболит."
61110-238 = "А? Этот запах от химического дезинфицирующего вещества, которое называется хлор?"
61110-239 = ""
61110-241 = ""
61110-242 = "Во внешнем мире даже воду дезинфицируют?!"
61110-244 = ""
61110-245 = ""
61110-246 = ""
61110-247 = ""
61110-248 = "Мы так высооооко!!"
61110-249 = "Смотрите на небо! Оно тако-о-ое синее!"
61110-250 = "Так вот как выглядит река... Ого..."
61110-251 = "Та штука называется мостом, да? Как они вообще такое построили?!"
61110-252 = "[s7] «Здорово, что вы все так воодушевлены, но не забывайте об окружающих!»\n[s8] «Говорите потише. Не кричите!»"
61110-255 = "Хорооошо, Сенсей!"
61110-256 = ""
61110-258 = ""
61110-259 = "Вы... сейчас плачете, Сенсей?"
61110-260 = "А? Вы просто очень благодарны, что мы такие послушные?"
61110-261 = "Если подумать, это немного странно... Раньше я терпеть не могла слушать взрослых."
61110-262 = "Ну, потому что они только и делали, что угрожали нам и били..."
61110-264 = "Я знаю, что это! Это гамбургер!"
61110-265 = "Ага, я такой уже ела. Субару иногда покупает их нам!"
61110-266 = ""
61110-268 = ""
61110-272 = "На вкус точно такой же, но почему-то ощущается иначе... Интересно почему..."
61110-273 = "Может, потому что мы едим его в новом месте?"
61110-274 = "Ага, может быть."
61110-275 = ""
61110-279 = "[ns9] «Все, подождите! Нет, стойте!»\n[ns10] «Не прижимайтесь ртом к крану, когда пьёте!»"
61110-282 = "Н-Но вы же сказали, что можно пить сколько угодно..."
61110-283 = "Потому что этим фонтанчиком должны пользоваться и другие люди?"
61110-284 = "..."
61110-285 = "А. Я об этом не подумала."
61110-286 = ""
61110-287 = "А? Вы благодарите нас за то, что мы нормально встали в очередь?"
61110-288 = "Немного неловко получать похвалу за такую элементарную вещь, Сенсей."
61110-289 = "Ага. Если во время раздачи пайков неправильно стоял в очереди или пытался пролезть вперёд, тебя наказывали, пока не отключишься!"
61110-292 = "Г-Где мы теперь, Сенсей?"
61110-293 = "Здесь ужасно шумно и столько мигающих огней... А-а..."
61110-294 = "А? Это место называется «игровой центр»? А что такое «игра»?"
61110-295 = "..."
61110-296 = "Н-Не врите нам, Сенсей! Не может такого существовать в этом мире! Электронные автоматы, сделанные исключительно ради развлечения...?"
61110-297 = "...Хотя все эти автоматы... и правда выглядят весело..."
61110-298 = "О нет, смотрите. Даже за одну игру нужно платить! Это настоящий грабёж!"
61110-299 = "Люди тратят свои драгоценные деньги на... развлечения?"
61110-300 = "[s] «Не волнуйтесь! Ваш учитель всё оплатит!»"
61110-301 = "Правда?!"
61110-302 = ""
61110-304 = ""
61110-308 = ""
61110-309 = "Я всё равно не понимаю... Как это может считаться школьной экскурсией...?"
61110-310 = "А? Мы изучаем математику? Практический урок по функциям? О чём вы вообще?"
61110-311 = "...Стойте, что? Дайте убедиться, что я правильно услышала: функция — это правило, где на вход поступает значение, а на выходе получается результат."
61110-312 = "В аркадном автомате ты нажимаешь кнопки — это вход — и персонаж двигается — это выход."
61110-313 = "И поэтому это «практический» урок по функциям?"
61110-314 = "..."
61110-315 = "Это была самая изобретательная, оригинальная и идиотская куча бессмыслицы, которую я когда-либо слышала."
61110-316 = "А? Я бы даже не поверила, какую чушь распространяют во внешнем мире?"
61110-317 = "..."
61110-318 = "Тогда я лучше останусь невежественной, спасибо..."
61110-322 = "Уааа! Что это было?! Не может быть!"
61110-323 = ""
61110-326 = "Ещё одну! Ещё одну игру!!"
61110-328 = "[ns] «Уф... Я вымотался...»"
61110-329 = ""
61110-330 = "Сегодня вы очень старались, Сенсей."
61110-331 = "Это я вам признаю."
61110-332 = "Так какой урок скрывается в этом парке?"
61110-333 = "«Когда пора отдыхать, лучше отдыхать»? Не скажу, что это неправильно..."
61110-334 = "...Даже во время той «подготовки», через которую нас заставляли проходить, мы старались тайком отдыхать при любой возможности."
61110-339 = ""
61110-340 = "[ns] «Вы все такие... энергичные...»"
61110-341 = "Можете присоединиться к тренировкам в любое время, Сенсей."
61110-342 = "Те дни для вас уже позади? Ха-ха-ха..."
61110-343 = "Хм? Вы надеетесь, что мне весело?"
61110-344 = "..."
61110-345 = "По-своему я наслаждаюсь этим моментом."
61110-346 = "По крайней мере, сейчас."
61110-349 = "На короткое мгновение между нами повисла тишина."
61110-350 = "Мы сидели рядом и оба смотрели в небо."
61110-351 = ""
61110-354 = "А небо и правда синее."
61110-355 = "...То ли из-за местности, то ли из-за климата, но над Ариусом небо чаще всего было серым."
61110-356 = ""
61110-359 = "..."
61110-360 = "Эй, Сенсей."
61110-361 = "Допустим, чисто гипотетически, если кто-то..."
61110-362 = "...очень, очень, очень сильно хотел бы выбросить свою жизнь."
61110-363 = "Вообще возможно его остановить?"
61110-364 = ""
61110-366 = ""
61110-367 = "[ns] «ЧТО?!?!?!»"
61110-368 = "Ну и выражение у вас сейчас. Ха-ха-ха."
61110-369 = "Почему вдруг такая мрачная тема? Хм. Без причины?"
61110-370 = "Не всегда ведь нужна какая-то особая причина, чтобы о чём-то заговорить, верно?"
61110-371 = "Это был серьёзный вопрос?"
61110-372 = "Да. Очень серьёзный."
61110-373 = "Так что я хочу, чтобы вы тоже ответили серьёзно, Сенсей."
61110-374 = "Это ведь своего рода «урок», верно?"
61110-375 = ""
61110-376 = "...В моей голове на мгновение всплыло чьё-то лицо..."
61110-377 = ""
61110-379 = ""
61110-380 = "Поэтому, как она и предложила, мы сделали вид, будто находимся на уроке."
61110-381 = ""
61110-382 = "[ns11] «Если честно.»\n[ns12] «Не думаю, что вопрос был серьёзным.»"
61110-385 = "Что...?"
61110-386 = "Подождите, вам вообще нормально так себя вести?! Как педагогу?!"
61110-387 = "[s] «Ты просто хотела увидеть, как твой бедный учитель запаникует, да?»"
61110-388 = "А? Н-нет! Всё не так...!"
61110-389 = "..."
61110-390 = "Не то чтобы у меня никогда не было таких мыслей, но..."
61110-391 = "Н-Но если серьёзно!"
61110-392 = "[s13] «Суть твоего вопроса — в счастье.»\n[s14] «Как продолжать жить, если ничто не приносит радости?»"
61110-395 = "Наверное, понимаю..."
61110-396 = "А? Идеалистично считать, что жизнь — только о счастье?"
61110-397 = "Идеалы сами по себе хороши. К ним стоит стремиться и на них надеяться."
61110-398 = "Но вы хотите сказать, что... полного счастья не существует?"
61110-399 = "..."
61110-400 = "Тогда что реалистичнее?"
61110-401 = "[s15] «Счастье — это то... что помогает нам двигаться вперёд.»\n[s16] «...Даже если такие мгновения редки.»"
61110-404 = "...Это правда."
61110-405 = "Люди редко получают награду за свои усилия, как бы сильно ни старались."
61110-406 = "[s17] «Поэтому, если кто-то испытывает невыносимую боль...»\n[s18] «Даже если он умоляет тебя отпустить его...»"
61110-409 = "..."
