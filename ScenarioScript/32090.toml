[translation]
32090-1 = "Episódio 9;Mão Negra"
32090-3 = "[ns] \"Eu não tenho intenção de gastar meu tempo duvidando de alguém.\""
32090-4 = "...?"
32090-5 = "[s] \"Só vou fazer o meu melhor para que o esforço daquelas meninas seja recompensado.\""
32090-6 = "..."
32090-7 = "Que tal eu tentar explicar mais uma vez? O motivo de serem justamente elas."
32090-8 = "Imagino que o Sensei também tenha suas próprias redes de informação... mas vamos falar por partes."
32090-9 = "Primeiro, a Koharu-san está lá para manter a Hasumi-san sob controle."
32090-10 = "A Hasumi-san odeia Gehenna mais do que qualquer outra pessoa. Ela é como uma bomba-relógio; nunca se sabe o que pode fazer ou quando."
32090-11 = "E a Hanako-san, apesar de originalmente possuir um talento superior ao de qualquer outra aluna, agora deixa de levar as provas a sério de propósito. É impossível compreender o que ela está tramando."
32090-12 = "Quanto à Azusa-san, a própria existência dela já é cercada de pontos suspeitos. Além disso, ela já causou inúmeros incidentes violentos com outras alunas e é alguém impossível de controlar."
32090-13 = "Já a Hifumi-san..."
32090-14 = "[s] \"Nagisa, sobre a Hifumi, você...\""
32090-15 = "...Sim. É verdade. Os meus sentimentos pela Hifumi-san... são bastante especiais."
32090-16 = "Eu tenho um carinho imenso pela Hifumi-san. Eu gosto muito dela... quanto a isso, não há a menor dúvida."
32090-17 = "Contudo... recebi informações de que a verdadeira identidade dela é, na verdade, a de líder de uma terrível gangue criminosa."
32090-18 = "[s] \"...\""
32090-19 = "Histórias assim são, pelo contrário, as mais assustadoras. Eu me pergunto se, justamente por confiar tanto nela, acabei deixando de enxergar algo... se não fiquei cega para a realidade."
32090-20 = "Por mais cuidado que se tenha ao erguer uma torre, ela pode desmoronar facilmente a partir de uma pequena rachadura..."
32090-21 = "Será que eu realmente compreendo a Hifumi-san, ou será que existe mesmo uma verdade que desconheço...? Eu já não sei mais."
32090-22 = "[s] \"Isso é um mal-entendido... Há toda uma circunstância por trás disso, e eu também posso explicar direitinho—\""
32090-23 = "Como?"
32090-24 = "Você consegue provar? Como pretende provar o coração da Hifumi-san, os verdadeiros sentimentos e as reais intenções dela?"
32090-25 = "Dizer que não é bem assim, que é um mal-entendido, que há circunstâncias... Que peso têm essas palavras? Quanta verdade há nelas?"
32090-26 = "...O que há dentro do coração de alguém não é algo que se possa provar."
32090-27 = "O coração bondoso da Hifumi-san, a educação dela, a gentileza dela... Mesmo conhecendo tudo isso profundamente, é impossível saber o que ela realmente pensa no fundo."
32090-28 = "É natural... Por mais que tentemos, no fim das contas, somos apenas \"estranhos\" uns para os outros."
32090-29 = "[s] \"...\""
32090-30 = "Por isso, não há outra escolha a não ser expulsá-las. Pelo Tratado do Éden... e pelo seu sucesso."
32090-31 = "[s] \"...Acho que agora eu entendi.\""
32090-32 = "...?"
32090-33 = "[s] \"Nagisa. Agora mesmo, você certamente está presa na escuridão da paranoia e da desconfiança.\""
32090-34 = "...Como? Na escuridão... da paranoia e da desconfiança...?"
32090-35 = "[s] \"Acho que você está vendo apenas o que quer ver e acreditando apenas no que quer acreditar.\""
32090-36 = "..."
32090-37 = "[s1] \"Eu vou tirar você daí.\"\n[s2] \"E, custe o que custar, farei todas do Clube de Aulas de Reforço passarem.\""
32090-38 = "...Fufu, entendo."
32090-39 = "...Fufu, entendo."
32090-40 = "Compreendo. Bem, em outras palavras, a nossa conversa ficou mais simples."
32090-41 = "...Entendido. Por favor, dê o seu melhor, Sensei."
32090-46 = "Pois eu também darei o meu melhor, à minha maneira."
32090-47 = "[ns] Retirar-se do local por ora."
32090-51 = "Próximo;2º Exame Especial de Aptidão Acadêmica (1)"
