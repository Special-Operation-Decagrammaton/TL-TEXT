[translation]
32090-1 = "Эпизод 9;Тень протягивает руку"
32090-2 = ""
32090-3 = "[ns] «Я не хочу тратить время на подозрения.»"
32090-4 = "...?"
32090-5 = "[s] «Я хочу лишь, чтобы Клуб дополнительных занятий сдал экзамен.»"
32090-6 = "..."
32090-7 = "Возможно, мне стоит объяснить, почему я выбрала каждую из них."
32090-8 = "Полагаю, вам уже рассказывали свою версию... Но вот правда."
32090-9 = "Во-первых, Кохару я выбрала, чтобы держать Хасуми в узде."
32090-10 = "Хасуми ненавидит Геенну больше всех. Она словно бомба с часовым механизмом: никто не знает, на что она способна."
32090-11 = "Ханако была отличницей, но по непонятной причине начала намеренно портить оценки. Подозрительно."
32090-12 = "Азуса и сама подозрительная личность. За ней всё больше случаев вооружённых стычек с другими студентами."
32090-13 = "Что касается Хифуми..."
32090-14 = "[s] «Я думал, ты высокого о ней мнения.»"
32090-15 = "Верно — была. Такое сострадание, как у неё, встречается редко."
32090-16 = "Я всегда очень тепло относилась к Хифуми, это правда..."
32090-17 = "...но у нас есть сведения, что она может возглавлять страшную преступную организацию."
32090-18 = "[s] «...»"
32090-19 = "Этого я и боюсь больше всего: что привязанность ослепит меня. Это роковая слабость."
32090-20 = "Даже самая тщательно возведённая башня может рухнуть из-за одного изъяна."
32090-21 = "Насколько хорошо я в действительности знаю Хифуми? Нет ли у неё стороны, которой я никогда не видела? Я не знаю ответа..."
32090-22 = "[s] «Но ты ведь ЗНАЕШЬ её! Произошло ужасное недоразумение!»"
32090-23 = "Откуда вам это известно? Вы готовы за неё поручиться?"
32090-24 = "Можете доказать невиновность Хифуми? Что она всегда была искренней?"
32090-25 = "Без конкретных доказательств ваши слова ничего не стоят."
32090-26 = "Доказать искренность чужих чувств невозможно."
32090-27 = "Я прекрасно знаю, какой отзывчивой, вежливой и доброй бывает Хифуми... но заглянуть ей в сердце и узнать, что там на самом деле, я никогда не смогу."
32090-28 = "В конечном счёте все мы друг другу чужие."
32090-29 = "[s] «...»"
32090-30 = "Поэтому ради Эдемского договора каждую из них необходимо исключить."
32090-31 = "[s] «Теперь я понял. Всё встало на свои места.»"
32090-32 = "...?"
32090-33 = "[s] «Ты просто циничная скептичка.»"
32090-34 = "Я? Циничная?"
32090-35 = "[s] «Ты видишь лишь то, что хочешь видеть, и веришь лишь в то, во что хочешь верить.»"
32090-36 = "..."
32090-37 = "[s1] «Положим конец твоим теориям заговора.»\n[s2] «Клуб дополнительных занятий ОБЯЗАТЕЛЬНО сдаст.»"
32090-38 = "Ха-ха. Что ж, хорошо."
32090-39 = "Ха-ха. Что ж, хорошо."
32090-40 = "Это всё упрощает."
32090-41 = "Удачи вам, Сенсей."
32090-42 = ""
32090-44 = ""
32090-45 = ""
32090-46 = "Придётся взять дело в свои руки."
32090-47 = "[ns] Повернуться и уйти."
32090-51 = "Следующий Эпизод;Второй экзамен, часть 1"
