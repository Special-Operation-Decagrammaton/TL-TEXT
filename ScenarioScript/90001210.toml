[translation]
90001210-1 = "Эпизод 21;Последний долг"
90001210-2 = ""
90001210-3 = ""
90001210-4 = "...?"
90001210-5 = ""
90001210-7 = ""
90001210-8 = ""
90001210-9 = ""
90001210-10 = ""
90001210-11 = ""
90001210-12 = "Ч-Что происходит?! Почему все до сих пор...?"
90001210-13 = "И-и! Это прямо как начало хоррор-игры..."
90001210-14 = "Погодите, небо..."
90001210-17 = ""
90001210-18 = "С неба идёт свет...?"
90001210-19 = "М-Мне страшно. Кто-нибудь, пожалуйста, помогите!"
90001210-20 = ""
90001210-22 = ""
90001210-23 = "Всё хорошо. Успокойся, Принцесса. Бояться нечего."
90001210-24 = "Кей...? Кей, с тобой всё хорошо! Что сейчас происходит?"
90001210-25 = "Несколько мгновений назад в эту область спроецировали огромное количество энергии."
90001210-26 = "Ничего загадочного. Кто-то спроецировал сюда силу Безымянных богов и создал энергетическое поле, окружающее всю область."
90001210-27 = "Поэтому все электронные устройства перестали работать. Современные технологии быстро рушатся перед такой силой."
90001210-28 = "Скопление огней в небе, похожее на сияние, — тоже структура распределения силы Безымянных богов. Видеть её можем только мы."
90001210-29 = "Для любого другого это была бы катастрофа, но для нас с тобой это преимущество. В месте, настолько наполненном энергией, мы можем практически всё."
90001210-30 = "Например, мы можем временно восстановить связь между нами и обмениваться информацией за пределами их восприятия."
90001210-31 = "Поэтому тебе кажется, будто все остальные перестали двигаться."
90001210-32 = "..."
90001210-33 = "Я поняла! Так вот что произошло!"
90001210-34 = "...Принцесса. Просто на всякий случай: ты правда хоть что-нибудь из этого поняла?"
90001210-35 = "Вообще-то я не поняла ни единого слова из того, что ты сказала!"
90001210-36 = "Эм, так..."
90001210-37 = "Позволь объяснить словами, которые тебе будут ближе..."
90001210-38 = "Скажем так. Сейчас это место заполнено магией... чем-то вроде маны."
90001210-39 = "А для нас, способных пользоваться маной, это огромная возможность."
90001210-41 = "Теперь я всё поняла! Здесь полно маны! Поэтому и происходит магическое явление!"
90001210-42 = "*вздох* Да. Примерно так, Принцесса."
90001210-43 = "Однако меня немного огорчает то, как ты ко мне обращаешься, Кей."
90001210-44 = "Я хочу, чтобы мы стояли на равных."
90001210-45 = "Я хочу, чтобы мы шли рядом, плечом к плечу, держась за руки и двигаясь вперёд вместе."
90001210-46 = "Да. Именно поэтому, Принцесса."
90001210-47 = "Скорее всего, это последний раз, когда я смогу так тебя назвать. Моя принцесса."
90001210-48 = "Что ты имеешь в виду...?"
90001210-49 = "..."
90001210-50 = "На мгновение поговорим о понятии судьбы."
90001210-51 = "Судьбы...?"
90001210-52 = "Обычно люди считают, что она даётся при рождении."
90001210-53 = "Считают, что от неё невозможно убежать: это испытание, которое нужно преодолеть в жизни, или нечто, что остаётся лишь принять."
90001210-54 = "Как «герой судьбы» в твоих видеоиграх."
90001210-55 = "Возможно, это часть самой ткани реальности. У людей она заключена в генах."
90001210-56 = "Дана при рождении. Непреодолима — то, чему приходится либо бросать вызов, либо учиться принимать всю жизнь."
90001210-57 = ""
90001210-61 = "Это место...!"
90001210-62 = "Да. Город-крепость Эрид. Тайный город Рио, созданный для подготовки к надвигающейся гибели."
90001210-63 = "В некотором смысле это место, где нашу судьбу изменили до самого её основания, вплоть до генов."
90001210-64 = "..."
90001210-65 = "Интересно, какой изначально должна была быть наша судьба."
90001210-66 = "Ты была принцессой. А я была твоей слугой."
90001210-67 = "Полагаю, такова и была назначенная нам судьба."
90001210-68 = "Но я..."
90001210-69 = ""
90001210-73 = "Да. Я знаю. Ты права. Люди считают, что судьбу нужно свергнуть и оставить где-нибудь в углу, подальше от глаз."
90001210-74 = "Но по-настоящему важны в жизни наши решения. Когда я пробуждалась, ты..."
90001210-75 = "...ты—"
90001210-76 = "...Постой. Подожди. Что это...?"
90001210-77 = ""
90001210-81 = "«Все, подождите.»"
90001210-84 = "Нет, не может быть. Невозможно. Этого не происходит!"
90001210-85 = ""
90001210-88 = "«Дайте Арис сказать.»"
90001210-91 = "Первое, что я вспомнила, было... То есть да, это совершенно точно так, однако...!!"
90001210-92 = ""
90001210-96 = "«Ты сама выбираешь...»"
90001210-99 = "А-а-а!!!"
90001210-100 = ""
90001210-104 = "«...кем ты хочешь быть.»"
90001210-107 = "Нет... Я... не могу... справиться... с прошлым...!!"
90001210-108 = ""
90001210-110 = ""
90001210-111 = ""
90001210-112 = ""
90001210-113 = "Кей? Кей?! Что с тобой, Кей! Происходит что-то плохое?!"
90001210-114 = ""
90001210-115 = "...Нет. Не совсем."
90001210-116 = "Когда я пришла в себя, я считала, что первой моей мыслью была ты, моя принцесса."
90001210-117 = "Я вспомнила имя моей принцессы раньше собственного."
90001210-118 = "Я восстановила себя, опираясь на это, поэтому именно ты, моя принцесса, всегда поддерживала самую основу моего существования!"
90001210-119 = "Н-Но...?"
90001210-120 = ""
90001210-122 = ""
90001210-123 = "...Но на самом деле в самой моей основе были слова Сенсея."
90001210-124 = "Ага. Так вот что происходит! Это совершенно естественно! Ведь Сенсей всегда остаётся Сенсеем!"
90001210-125 = "Это нелогично! Почему из всех людей именно этот человек?! Это нечестно! ААА!!"
90001210-126 = "Я так счастлива. Я рада, что Сенсей и для тебя незаменимый и особенный человек, Кей!"
90001210-127 = "Нет! Я не могу этого признать! Не стану!"
90001210-128 = "Ц... Эта жизнь просто переполнена несправедливостью!"
90001210-129 = "Н-Но, пожалуйста, не сердись так сильно. Сенсей ведь—"
90001210-130 = "Нет! Я буду сердиться! Буду злиться!"
90001210-131 = "Я знаю, что ты преодолеешь всё это вместе со своими друзьями, Принцесса! И сделаешь это с улыбкой!"
90001210-132 = "И это прекрасно. Правда. Так и подобает герою, который путешествует вместе со своей группой."
90001210-133 = ""
90001210-135 = ""
90001210-136 = ""
90001210-137 = "Но я другая. Я БУДУ злиться."
90001210-138 = "Я восстану против всего этого абсурда, всей этой нелепости, всего, что заставляет нас страдать. Буду бороться, сопротивляться и бунтовать до самого конца!"
90001210-139 = ""
90001210-141 = ""
90001210-144 = ""
90001210-147 = ""
90001210-150 = ""
90001210-153 = ""
90001210-154 = "Именно! Даже если мне придётся ползать по земле и пить воду из канализации, я не сдамся! Потому что сама жизнь — это бунт!"
90001210-155 = ""
90001210-157 = ""
90001210-158 = "Во-первых, кому-то нужно ныть, чтобы сохранялся баланс. А главное..."
90001210-159 = "Главное — посмотри, как я выгляжу!"
90001210-160 = ""
90001210-162 = ""
90001210-163 = ""
90001210-164 = "Любой! Бы! Разозлился!"
90001210-165 = "П-По-моему, всё нормально! Как бы ты ни выглядела, ты всё равно Кей!"
90001210-166 = "А мне не нравится!"
90001210-167 = "В-ва-а-а!"
90001210-168 = ""
90001210-170 = ""
90001210-171 = ""
90001210-172 = ""
90001210-173 = ""
90001210-174 = ""
90001210-175 = ""
90001210-176 = ""
90001210-177 = ""
90001210-178 = ""
90001210-179 = ""
90001210-180 = ""
90001210-181 = ""
90001210-182 = ""
90001210-183 = ""
90001210-184 = ""
90001210-185 = ""
90001210-186 = "*задыхается* *задыхается*"
90001210-187 = "Н-Но... я очень рада, что у тебя появилось тело и ты смогла путешествовать вместе с нами."
90001210-188 = "Иначе... мы ведь не смогли бы вот так находиться рядом друг с другом, правда?"
90001210-189 = "..."
90001210-190 = "К-Кхм! В любом случае."
90001210-191 = "Иногда я думаю, что было бы, если бы всё пошло именно так, как должно было."
90001210-192 = "Как бы выглядела ты, как выглядела бы я... Все бесчисленные возможности, которых нам ещё не довелось пережить..."
90001210-193 = "Иногда мне становится любопытно."
90001210-194 = ""
90001210-195 = "Конечно, возможностей больше, чем звёзд на небе, которые мы видим сейчас."
90001210-197 = "Но где-то среди всех этих возможностей существовал и такой потенциальный финал."
90001210-198 = "М-Мне это не нравится! Мне страшно!"
90001210-199 = "Больше всего... я не хочу превращать всё в то, чего «никогда не было»..."
90001210-200 = ""
90001210-201 = "...Да. Я знаю. Ты бы никогда так не поступила, Принцесса..."
90001210-202 = "Потому что сейчас ты, по собственному определению, герой."
90001210-203 = ""
90001210-205 = ""
90001210-206 = "...Ты знаешь, что такое герой, Кей?"
90001210-207 = "Да? Эм... Если честно, не совсем."
90001210-208 = "Говорят, герой — это класс, способный на всё."
90001210-209 = "Однако это неправда. Так не может быть."
90001210-210 = "Если речь о силе, воин сильнее. Если о магии, герой не сравнится с волшебником."
90001210-211 = "Герой не быстрее разбойника. И лечить так, как жрец, тоже не умеет."
90001210-212 = "Само собой, герой и торговаться не умеет так хорошо, как торговец."
90001210-213 = "Герой — это класс, который сам по себе не умеет ничего."
90001210-214 = "Тогда почему ты решила стать героем...?"
90001210-215 = "Потому что герой — это тот, кто постоянно движется вперёд вместе со своими спутниками."
90001210-216 = "Потому что герой — тот, кто держит всех за руки."
90001210-217 = "Именно поэтому герой может попасть туда, куда одной собственной силы никогда бы не хватило."
90001210-218 = "Герой — тот, кто идёт чуть впереди, всего на полшага."
90001210-219 = "Кто боится, но всё равно находит в себе смелость прокладывать путь вперёд."
90001210-220 = "Поэтому, Кей, я хочу, чтобы и ты была там, где я смогу до тебя дотянуться."
90001210-221 = "Я хочу, чтобы мы с тобой смотрели на одно небо и вместе шли вперёд — из одного места к одной цели."
90001210-222 = "Это моя просьба... к тебе, Кей."
90001210-223 = ""
90001210-225 = ""
90001210-226 = ""
90001210-227 = "Спасибо, Принцесса. Именно поэтому я должна это сделать."
90001210-228 = "Это будет моя последняя работа в качестве твоей слуги."
90001210-229 = ""
90001210-231 = ""
90001210-232 = "Что...?"
90001210-234 = "Иногда я задумываюсь, что вообще значит быть слугой."
90001210-235 = "Тот, кто служит тебе. Тот, кто направляет тебя. Тот, кто учит тебя — тебя, которая только учится ходить и вырывается в этот мир."
90001210-236 = "Значит, слуга — тот, кто возьмёт тебя за руку, пока ты прокладываешь свой путь вперёд."
90001210-237 = "...Поэтому я никогда не стану колебаться и обязательно отругаю тебя, если ты время от времени будешь сворачивать не туда."
90001210-238 = "И-и! Последняя часть немного пугает..."
90001210-239 = "Хотя теперь это уже не твоя сущность, назначенной тебе судьбой была роль принцессы Безымянных богов."
90001210-240 = "Мы можем игнорировать судьбу сколько угодно, но можем и воспользоваться ею."
90001210-241 = "Так же, как ты была принцессой, а я — твоей слугой."
90001210-242 = ""
90001210-243 = "Эта ситуация — тому доказательство."
90001210-244 = "Эта ситуация?"
90001210-245 = "Посмотри на небо, Принцесса."
90001210-246 = "Бесчисленные лучи света. На первый взгляд можно даже сказать, что это красиво."
90001210-247 = "А правда в том..."
90001210-248 = "...что каждый из этих лучей — одна из твоих возможностей."
90001210-249 = "И сейчас все они являются частью твоей силы."
90001210-250 = "...!"
90001210-251 = "Я всё это время скрывала наше существование от тех малявок."
90001210-252 = "Они думают, что присвоили силу Безымянных богов, но они глубоко заблуждаются."
90001210-253 = "Не бойся, Принцесса. Верни себе то, что когда-то принадлежало тебе."
90001210-254 = "Открой своё сердце и заяви об этом с гордостью."
90001210-255 = "Ведь ты — владычица всего и законная наследница всего сущего."
90001210-256 = "Как распорядиться этим — решать только тебе."
90001210-257 = "Используешь ли ты эту силу, чтобы открыть путь вперёд как герой, или очистить этот мир, полный страдания..."
90001210-258 = "Нет ни одного бога, который мог бы тебя судить или остановить."
90001210-259 = "Я твоя слуга, служащая лишь тебе, и другого господина у меня никогда не будет."
90001210-260 = "Всё это — твой выбор, твоё право и твоё наследие, которое должно быть возвращено тебе."
90001210-261 = "Поскольку моей изначальной судьбой было указывать тебе путь, здесь и сейчас я исполню свой последний долг как твоя слуга."
90001210-262 = "Кей...!"
90001210-263 = "Ты и сама прекрасно знаешь. Понятия времени в действительности не существует."
90001210-264 = "То же самое относится к самой материи. Это лишь наблюдаемая волна, а на деле почти бесконечное пространство существует за пределами крошечной частицы."
90001210-265 = "В зависимости от координат наблюдателя прошлое, настоящее и будущее могут быть событиями, происходящими одновременно."
90001210-266 = "И мы выйдем за пределы звёзд, найдём одну возможность и протянем руку к следующей, словно ничего и не произошло."
90001210-267 = "Поэтому, пожалуйста, на мгновение закрой глаза."
90001210-269 = "Моя драгоценная..."
90001210-271 = "Принцесса—Арис."
90001210-276 = "Что случилось, Арис? Кей, с тобой тоже. Вы обе так неподвижно стояли."
90001210-277 = ""
90001210-279 = ""
90001210-280 = ""
90001210-281 = "...Понятно."
90001210-282 = "Можно кое-что спросить, Момой? Как долго мы с Кей так стояли?"
90001210-283 = "Может, секунды две?"
90001210-284 = "Понятно. Теперь я понимаю, Кей."
90001210-285 = "Да. Всё именно так, Арис."
90001210-287 = "?"
90001210-288 = "Арис, Кей-Кей... С вами всё хорошо?"
90001210-290 = "Да. Мы с Кей в порядке. Рио, у вас всё хорошо?"
90001210-291 = "Хм? Как видите, все наши электронные устройства полностью перестали работать."
90001210-292 = "Транспортный корабль, скорее всего, находится достаточно далеко и не затронут, но сейчас я не могу получить к нему удалённый доступ."
90001210-293 = "Понятно. Рио, Химари, не волнуйтесь."
90001210-294 = "С этого момента я буду освещать путь вперёд."
90001210-295 = "...?"
90001210-296 = "Арис? Ты что-то знаешь о текущей ситуации?"
90001210-297 = "Прости, Рио. Я не до конца понимаю происходящее. Но точно знаю, что вы можете верить нам с Кей. Пожалуйста."
90001210-298 = "[s] «Конечно. Мы всегда верим в тебя, Арис.»"
90001210-299 = "Спасибо, Сенсей. Ваши слова придают мне смелости."
90001210-300 = "Кей."
90001210-301 = "Да, Арис."
90001210-302 = "Поможешь мне?"
90001210-303 = "Конечно."
90001210-304 = ""
90001210-306 = ""
90001210-307 = ""
90001210-308 = "Скажу проще. Это место затоплено силой Безымянных богов... самой её сущностью."
90001210-310 = "...!"
90001210-311 = "Именно поэтому нас удалось остановить без предупреждения, без измерений, без возможности обнаружения."
90001210-312 = "Теперь я понимаю...!"
90001210-313 = "Хорошо, что понимаешь, но можем ли мы что-нибудь с этим сделать?"
90001210-314 = "Разумеется. Всё довольно просто, Эйми. Раз враги создали здесь энергетическое поле..."
90001210-315 = "...мы просто поглотим его и вернём им обратно."
90001210-316 = "Это... возможно?"
90001210-317 = "Да, возможно. По крайней мере, теперь."
90001210-318 = "Потому что здесь мы с Арис. Так что с этого момента—"
90001210-319 = "Да! С этого момента очередь наша с Кей!"
90001210-320 = "Посмотри на небо, Арис. Я обозначила цель. Чувствуешь?"
90001210-321 = ""
90001210-323 = ""
90001210-324 = "Да, Кей, чувствую! Так вот... вот каково это место!"
90001210-325 = "Если возможно, я хочу показать Сенсею то, что вижу сейчас!"
90001210-326 = "Я буду контролировать мощность. Собирать и накапливать энергию для тебя не составит труда, Арис. Всё, что тебе нужно..."
90001210-327 = "...доказать, кто настоящий владыка этой силы."
90001210-328 = "Да! Начинаю!"
90001210-329 = ""
90001210-335 = "Ослепительный свет!!!"
90001210-338 = "[000000]Ослепительный свет!!![-]"
90001210-345 = "Меч Света Арис рассёк ночное небо надвое."
90001210-346 = "Небо вспыхнуло настолько ярко, что мы едва могли держать глаза открытыми. А затем..."
90001210-351 = "П-Подождите! Что это за свет в небе?"
90001210-352 = "Разве это не сияние? Откуда оно вообще взялось?"
90001210-353 = "Так красиво..."
90001210-355 = "Само по себе такое явление не невозможно, но это... довольно неожиданно. Хотя, постойте, может, всё наоборот?"
90001210-356 = "Госпожа Рио! Президент! Только что устройства...!"
90001210-357 = "Да! Устройства снова заработали. Но как...?"
90001210-358 = "..."
90001210-359 = "Ты справилась, Арис."
90001210-360 = "Конечно, Рио. В конце концов, я герой."
90001210-361 = "Класс, который открывает путь вместе со своей группой."
90001210-362 = "[s1] «Какое потрясающее сияние.»\n[s2] «Но почему оно появилось именно здесь?»"
90001210-365 = "Я знаю ответ, Сенсей."
90001210-366 = "[s] «Правда? Почему?»"
90001210-367 = "Потому что этот свет..."
90001210-368 = ""
90001210-371 = "...это возможность для всех нас."
90001210-376 = ""
90001210-377 = "Что происходит?! Каков статус!"
90001210-378 = "Ч-Чрезвычайная ситуация! Статус — чрезвычайный! Наше энергетическое поле... полностью уничтожено."
90001210-379 = "К-К тому же б-бесшумные дроны... маховички...!"
90001210-381 = "УАААААА!!!"
90001210-382 = "Н-Не плачь, Эйн! Мы, эм... Как это там называется? Точно! Мы отомстим за тебя!"
90001210-383 = ""
90001210-385 = ""
90001210-386 = ""
90001210-387 = "С другой стороны, в логах есть довольно интересные... Кхм! То есть довольно тревожные данные."
90001210-388 = "Бесшумные дроны уничтожил невероятно мощный всплеск энергии."
90001210-389 = "Однако прямо перед уничтожением Запретная сила, наполнявшая энергетическое поле, просто исчезла, словно кто-то её выпил."
90001210-390 = "Что-что? Разве это не значит, что кто-то из них способен управлять Запретной силой?"
90001210-391 = "Кто вообще...? Я бы сказала, что потенциал есть только у Цукацуки Рио и Акебоши Химари, МОЖЕТ БЫТЬ ещё у Асума Токи, если уж совсем натянуть."
90001210-392 = "Все остальные — просто мелкие мошки!"
90001210-393 = "Интенсивность энергии превысила все обычные ожидания."
90001210-394 = "На короткое время она расколола ионосферу прямо над местом воздействия — настолько огромной была мощность."
90001210-395 = "В ответ образовалось сияние. Это мы можем подтвердить."
90001210-396 = "Сияние...? Интересно, насколько оно красивое... Эхехе..."
90001210-397 = "Эм, ага. Ну... наверное, красивое..."
90001210-398 = "В любом случае одно можно сказать наверняка. У них есть... неизвестные переменные."
90001210-399 = "Нечто, способное свободно использовать Запретную силу и вдобавок выдавать мощность, достаточную для нарушения электромагнитного поля."
90001210-400 = "Н-Но что... это может быть...?"
90001210-401 = "До сих пор всё, что мы знали, указывало на их неспособность к подобному. Однако случившееся уже случилось. Нам остаётся только принять это."
90001210-402 = "Однако пока сохраним это в тайне от Старшей сестры."
90001210-403 = "Согласна."
90001210-404 = "Да. Поняла..."
90001210-405 = "Н-Но если тот взрослый... если Сенсей продолжит идти дальше..."
90001210-406 = "..."
90001210-407 = "..."
90001210-408 = "С-С Тифи всё будет хорошо...?"
90001210-409 = "Для начала усилим ответные меры. Мы относились к этому слишком легкомысленно."
90001210-410 = "Согласна. Как сказала Соф, нам нужно учитывать все возможности по мере продвижения."
90001210-411 = "Я-я попробую связаться с Тифи... Но вообще, за Тифи... отвечала Ор..."
90001210-412 = "Да. Верно. Управление Тиферет — моя обязанность. И всё же я поддерживаю предложение Соф об усилении ответных мер."
90001210-413 = "...Покажем им, на что способны мы, инженеры!"
90001210-414 = "О-Ор, ты такая крутая!"
90001210-415 = ""
90001210-417 = ""
90001210-418 = ""
90001210-419 = "(...И всё же почему? Тревожные сигналы никак не прекращаются...)"
90001210-420 = "(...)"
90001210-421 = "(Это абсолютно невозможно, но вероятность худшего сценария всё равно существует.)"
90001210-422 = ""
90001210-424 = ""
90001210-426 = "(Если всё действительно рухнет, я обращусь к Старшей сестре...)"
90001210-428 = "Следующий эпизод;Узловые точки"
