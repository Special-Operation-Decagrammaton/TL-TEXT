[translation]
1007303-1 = "Маленькое кафе в лесу"
1007303-3 = "Я пришёл в то «хорошее место», о котором говорила Уй."
1007303-7 = "[ns1] «...?»\n[ns2] «Кажется, я пришёл куда надо...»"
1007303-8 = ""
1007303-9 = ""
1007303-12 = "О, Сенсей. Ты пришёл."
1007303-13 = ""
1007303-16 = "Сюда."
1007303-17 = ""
1007303-20 = "[ns] Посмотреть в сторону, откуда доносится голос."
1007303-23 = "― [log=우이 수영복ND]Ч-Что скажете...?[/log][wa:1790]"
1007303-25 = "― [log=우이 수영복ND]Моё маленькое убежище...[/log][wa:1070]"
1007303-28 = "― [log=우이 수영복ND]Здесь довольно мило, правда? Хи-хи... [/log][wa:4290]"
1007303-31 = "[ns3] «Ты всё это сама сделала?»\n[ns4] «Ничего себе. Настоящее кафе.»"
1007303-32 = "― [log=우이 수영복ND]Не хотите зайти, Сенсей?[/log][wa:2040]"
1007303-33 = "― [log=우이 수영복ND]Не хотите зайти, Сенсей?[/log][wa:1940]"
1007303-35 = "― [log=우이 수영복ND]Здесь уютнее, чем может показаться.[/log][wa:510]"
1007303-38 = "― [log=우이 수영복ND]Ох... Наверное, здесь слишком тесно[/log][wa:500]"
1007303-40 = "― [log=우이 수영복ND]для двоих...[/log][wa:1270]"
1007303-43 = "― [log=우이 수영복ND]...Что? Вам достаточно просто смотреть...?[/log][wa:3400]"
1007303-46 = "― [log=우이 수영복ND]...Но тогда теряется весь смысл того, что я привела вас сюда...[/log][wa:1430]"
1007303-49 = "― [log=우이 수영복ND]...И всё же здесь приятно.[/log][wa:7840]"
1007303-52 = "― [log=우이 수영복ND]Может быть...[/log]"
1007303-54 = "― [log=우이 수영복ND]Не всё на свежем воздухе так уж ужасно.[/log][wa:1830]"
1007303-57 = "― [log=우이 수영복ND]...Эм, Сенсей...? [/log][wa:2500]"
1007303-60 = "― [log=우이 수영복ND]Если хотите...[/log][wa:1240]"
1007303-63 = "― [log=우이 수영복ND]Не желаете... чего-нибудь выпить?[/log][wa:1310]"
1007303-66 = ""
1007303-67 = "В-Вот, пожалуйста, Сенсей."
1007303-68 = "Холодный американо из кафе Уй..."
1007303-69 = "Я принесла немного льда из лагеря. Удивительно, что он ещё не растаял."
1007303-70 = "Хотя... наверное, для этого и нужен холодильник. Я нечасто выбираюсь наружу..."
1007303-71 = "[s5] Выпить кофе, который предложила Уй.\n[s6] «Спасибо. На улице жарко.»"
1007303-74 = "Хи-хи..."
1007303-75 = "...О."
1007303-76 = "Наверное, это и так очевидно, но, пожалуйста, никому не рассказывайте об этом месте."
1007303-77 = "Это единственное место, где я могу спрятаться так, чтобы меня никто не нашёл..."
1007303-78 = "...Хм? Не против ли я, что вы о нём знаете?"
1007303-79 = "Ну... Вы — это вы..."
1007303-80 = "И-и как учителю... в-вам, наверное, лучше знать..."
1007303-81 = "Если никто вообще не будет знать, где я... могут возникнуть проблемы..."
1007303-82 = "Я не хочу никого заставлять волноваться. Просто иногда мне хочется побыть одной."
1007303-83 = "Думаю... если все будут знать, что вы знаете, где я, то смогут спокойно оставить меня в покое."
1007303-84 = ""
1007303-86 = ""
1007303-87 = "Хм..."
1007303-88 = "Ну... Пожалуй, это просто куча оправданий..."
1007303-89 = "Я не против, если вы будете приходить сюда, Сенсей. Хи-хи."
1007303-90 = "[s7] «Такое чувство, будто у меня появилось собственное эксклюзивное кафе.»\n[s8] «Тайное кафе, спрятанное только для меня!»"
1007303-93 = "Эм... Наверное, можно и так сказать..."
1007303-94 = "Хм... Кафе... Кафе Сенсея..."
1007303-95 = "...Ну..."
1007303-96 = "Я могу с этим смириться. Пока здесь только мы."
1007303-97 = "...Кажется, я уже начинаю это представлять. В конце концов, кофе здесь есть..."
1007303-98 = "...Кафе."
1007303-99 = ""
1007303-101 = ""
1007303-102 = "Это... звучит не так уж плохо."
1007303-103 = "Хи-хи."
1007303-105 = "Мы с Уй ещё немного посидели в её кафе, пили ледяной американо и наслаждались оставшимся временем."
1007303-106 = ""
1007303-109 = "Когда солнце начало садиться, я первым вернулся в базовый лагерь."
