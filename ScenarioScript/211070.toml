[translation]
211070-1 = "Эпизод 7;Карен"
211070-6 = ""
211070-7 = ""
211070-8 = "Эй, как жизнь?"
211070-9 = ""
211070-11 = ""
211070-12 = ""
211070-13 = ""
211070-14 = "Ага! Это мы к тебе обращаемся!"
211070-15 = "Ч-что? Что случилось?"
211070-16 = ""
211070-18 = ""
211070-19 = "Ну, просто терпеть не могу вас, студентов Геенны..."
211070-20 = "...Настолько, что у меня на вас аллергия!"
211070-21 = "Стоит только посмотреть на тебя, и меня сразу обсыпает. Видишь?!"
211070-22 = "А? Уже исчезло."
211070-23 = "Чёрт, наверняка фломастер на водной основе. Дай-ка мне..."
211070-24 = ""
211070-26 = ""
211070-27 = "Ну вот, смотри! Семь воспалённых пятен! Меня всю крапивницей обсыпало! По-твоему, мне... не положена денежная компенсация?"
211070-28 = "Но ты же только что нарисовала их маркером! Прямо у меня на глазах!"
211070-29 = "Я не шучу! Я сказала, что меня от тебя тошнит, значит, так и есть! А ну гони деньги!"
211070-30 = "Нет! Это же бред!"
211070-31 = "Эй, хочешь гранату схлопотать? Закрой рот и доставай кошелёк."
211070-32 = "Ух... Т-ты..."
211070-33 = "Ха-ха-ха! Вы, гееннские придурки, такая лёгкая добыча! Вечно поодиночке ходите."
211070-34 = "Студенты Геенны никогда не держатся вместе, а вашу Префектуру волнует только то, что творится ВНУТРИ её территории."
211070-35 = "Так что никто тебе не поможет! Выкладывай деньги, пока цела!"
211070-37 = "[ns] Выйти вперёд."
211070-40 = "[ns] «Хм...? Это ведь...»"
211070-41 = "Я-ха! Какая занимательная сценка! Просто умора."
211070-42 = "А? Что ты сказала?"
211070-43 = "А ты ещё кто?"
211070-44 = ""
211070-46 = ""
211070-47 = ""
211070-48 = "А это кто ещё? Тоже из Геенны? Вся такая нарядная..."
211070-49 = ""
211070-51 = ""
211070-52 = "Ещё как! Я с гордостью могу сказать, что я из Геенны."
211070-53 = "Ну..."
211070-54 = "Так что убери лапы от моего товарища по академии и проваливай!"
211070-55 = ""
211070-57 = ""
211070-59 = "Мёраку Карен, студент второго курса академии Геенна."
211070-60 = "Нынешний заместитель председателя Лиги наследия Геенны."
211070-61 = "Известна ярким стилем и вспыльчивым нравом. Осторожно: без колебаний прибегает к крайним мерам."
211070-63 = ""
211070-65 = "Чего? Ты чего сказала?"
211070-66 = "Ха-ха! Ноготочки красивые, чудила. Ты вообще кто такая? Повязки Префектуры на тебе не вижу..."
211070-67 = "Эй, ты её знаешь?"
211070-68 = "А? Нет... Не особо...?"
211070-69 = ""
211070-71 = ""
211070-72 = "Ну, теперь мы друзья. Привыкай."
211070-73 = "Ого..."
211070-74 = "Ха! Эта принцесска думает, что справится с нами в одиночку? Пора преподать ей урок жизни."
211070-75 = "Ага! Покажем ей, каким жестоким бывает Кивотос!"
211070-76 = ""
211070-77 = "[ns] «П-посто...»"
211070-78 = ""
211070-80 = ""
211070-81 = ""
211070-82 = ""
211070-86 = ""
211070-87 = "Ух! О-она..."
211070-88 = ""
211070-90 = ""
211070-91 = ""
211070-92 = ""
211070-94 = ""
211070-96 = ""
211070-97 = "Ай! Больно-то как...!"
211070-98 = "Н-нас отделали!"
211070-99 = ""
211070-101 = ""
211070-103 = "О-она всех уложила за считаные секунды..."
211070-104 = ""
211070-106 = ""
211070-107 = ""
211070-108 = "Вы в порядке?"
211070-109 = "А-а...? Да, всё хорошо..."
211070-110 = "Чего ты так трясёшься? Ни царапины же... И сумку вроде не отобрали!"
211070-111 = "Огромное спасибо! Они бы у меня всё забрали... даже журналы!"
211070-112 = "Я ведь сказала: теперь мы друзья. И я НИКОМУ не позволю обижать своих."
211070-113 = "К-как круто..."
211070-114 = "Кстати, ты что-нибудь слышала о Лиге наследия Геенны?"
211070-115 = "...Вроде бы? Это тот клуб, о котором сейчас все говорят?"
211070-116 = "Именно. Я оттуда."
211070-117 = "Серьёзно?! Теперь мне точно интересно! Я как раз подумывала вступить в какой-нибудь клуб!"
211070-118 = "Вот как? Тогда присоединяйся к нам! Я-ха-ха!"
211070-119 = "Держи мой контакт в MomoTalk. Пиши, если попадёшь в беду."
211070-120 = "В отличие от Префектуры, Лига защищает студентов Геенны даже за пределами академии. Как сегодня."
211070-121 = "О-о... Как обнадёживает."
211070-122 = "Хорошо! Если что случится, обязательно напишу! И насчёт вступления тоже подумаю!"
211070-123 = "Слава Геенне!"
211070-124 = ""
211070-126 = ""
211070-127 = "Да, слава Геенне! Поняла!"
211070-128 = ""
211070-130 = ""
211070-131 = ""
211070-132 = "Я-ха, обычный рабочий денёк."
211070-133 = ""
211070-135 = ""
211070-136 = ""
211070-137 = "Хм? Сенсей, это вы?"
211070-138 = "[s] «Привет, Карен»."
211070-139 = "Ничего себе! Сам Сенсей собственной персоной?"
211070-140 = "Чем занимаетесь? Куда идёте? Видели, что я только что сделала? Ну как вам?"
211070-141 = "[s1] «Хожу по делам».\n[s2] «Это было круто, Карен. Ты защитила своего друга»."
211070-144 = "Так вы всё-таки видели!"
211070-145 = "Не то чтобы я делала это ради чужого внимания... Но мне особенно приятно знать, что ВЫ всё видели."
211070-146 = ""
211070-148 = ""
211070-149 = "Тогда жду поглаживаний по голове! За хорошую работу полагается награда, верно? Только причёску не испортите."
211070-150 = "[s] Осторожно погладить Карен по голове."
211070-151 = ""
211070-153 = ""
211070-154 = ""
211070-155 = "М-м! Как приятно! Я-ха-ха!"
211070-156 = ""
211070-158 = ""
211070-159 = "«Часто ли такое случается», спрашиваете?"
211070-160 = "Хм... Иногда."
211070-162 = "Префектура патрулирует территорию, так что внутри района такое редко увидишь. А вот за его пределами... Бывает неспокойно."
211070-163 = "Одинокие студенты Геенны часто становятся лёгкой мишенью. Впрочем, наверное, так в любой академии."
211070-164 = "Но если я вижу неприятности, то стараюсь вмешаться. Не хочу, чтобы КТО-ТО думал, будто наших студентов можно безнаказанно обижать."
211070-165 = ""
211070-166 = "А... Мне не стоит «перегибать палку»? Лучше «обратиться к вам за помощью»?"
211070-167 = ""
211070-169 = ""
211070-170 = "Вы слишком добры, Сенсей. Давненько никто не предлагал за меня вступиться."
211070-171 = "Но я довольно крепкая. Нескольких хулиганов разом уж точно одолею."
211070-172 = "А если не смогу... то убегу и потом устрою засаду каждому по отдельности! Они этого заслуживают."
211070-173 = "И, как вы сами убедились, район здесь совсем небезопасный. Вам не стоит ходить в одиночку."
211070-174 = "Раз уж мы встретились, я провожу вас, пока вы не закончите свои дела!"
211070-175 = "Да всё нормально, честно! У меня всё равно никаких планов не было!"
211070-176 = ""
211070-177 = ""
211070-178 = ""
211070-179 = ""
211070-180 = ""
211070-182 = "На нас напали несколько хулиганов из числа студентов..."
211070-183 = ""
211070-184 = ""
211070-185 = ""
211070-186 = ""
211070-187 = ""
211070-188 = ""
211070-189 = ""
211070-190 = ""
211070-191 = ""
211070-192 = ""
211070-193 = ""
211070-194 = ""
211070-196 = "Но Карен без труда с ними справилась."
211070-197 = ""
211070-202 = "[ns] «Спасибо за сегодняшний день, Карен»."
211070-203 = "Я-ха-ха! Вот это приятно слышать."
211070-204 = "Мне понравилось гулять с вами, Сенсей."
211070-205 = "Кстати... Кажется, к вам многие цепляются. Даже сегодня столько всего было..."
211070-206 = "[s] «Ага...»"
211070-207 = "Тогда, если понадобится охрана, смело зовите меня!"
211070-208 = "Вот, дам вам свой контакт в MomoTalk. Можете и писать, и звонить!"
211070-209 = ""
211070-211 = ""
211070-213 = "И... готово! Я-ха!"
211070-214 = "Здорово, когда мы на связи, правда?"
211070-215 = "Я впервые вот так гуляю со взрослым. Оказывается, это довольно весело..."
211070-216 = ""
211070-218 = ""
211070-219 = "А, мне, наверное, пора возвращаться."
211070-220 = "Хм, Сенсей, хотите о чём-нибудь спросить меня напоследок?"
211070-221 = "Только сегодня и только для вас отвечу на что угодно. На ЛЮБОЙ вопрос, Сенсей! Я-ха-ха!"
211070-222 = ""
211070-225 = "[ns] «Почему ты вступила в Лигу наследия?»"
211070-226 = "А? Ого, вас вот что интересует?"
211070-227 = "Ну..."
211070-228 = ""
211070-230 = ""
211070-231 = "Наверное, потому что я люблю Геенну?"
211070-232 = "Пожалуй, это главная причина! Я-ха!"
211070-233 = "А ещё мне ужасно нравится проводить время с другими участниками. И, как вы заметили, все они по-своему забавные личности."
211070-234 = "«Почему я люблю Геенну», спрашиваете?"
211070-235 = "..."
211070-236 = "Хм... М-м-м..."
211070-237 = "Сложный вопрос. Причин ведь СТОЛЬКО."
211070-238 = "Ну, для начала мне нравится, что здесь всё говорят прямо!"
211070-239 = "Терпеть не могу лицемеров. В лицо улыбаются, а за спиной поливают грязью. Уф, меня от такого воротит."
211070-240 = "А в Геенне всё иначе. Мы говорим прямо и от души. Если есть проблема, то разбираемся открыто и доводим дело до конца."
211070-241 = "Здесь можно быть собой. Вот эта свобода мне и нравится."
211070-242 = "А? Вы считаете, что это «не похоже на цели Лиги наследия»?"
211070-243 = "Ну да, наверное. Мы же хотим навести в Геенне порядок и установить контроль..."
211070-244 = "Я знаю, слово «контроль» звучит сурово, но это просто Шоуко так выражается. Она у нас главный мозг."
211070-245 = "Так что да, вы правы. Именно к этому мы и стремимся."
211070-246 = "Вообще-то мне нравится и нынешний полный хаос. Но я осталась, потому что хочу посмотреть, чего добьётся Маюми."
211070-247 = "Из всех моих знакомых Маюми любит Геенну сильнее всех! Это сразу видно!"
211070-248 = ""
211070-249 = "В ней столько энергии и решимости. Хочу увидеть, что она сможет сделать для академии."
211070-250 = "Да, она немного безрассудная. Сначала делает, потом думает, но мне в ней и это нравится."
211070-251 = "И да, Шоуко иногда говорит странные вещи, но Геенну она тоже любит."
211070-253 = "Как тут не заинтересоваться? Было бы здорово увидеть по-настоящему единую Геенну, правда?"
211070-254 = "Академию, где все действуют сообща и идут к одной цели, а не разбегаются в сотне направлений!"
211070-255 = "Честно говоря, мне даже трудно такое представить! Так что хочу увидеть своими глазами."
211070-256 = ""
211070-257 = "Я-ха-ха! Вот почему я остаюсь в Лиге наследия вместе с друзьями."
211070-258 = "Я ответила на ваш вопрос? Кажется, я наговорила всего вперемешку. Ну не умею я произносить речи!"
211070-259 = "[s] «Ты хорошо ответила на мой вопрос»."
211070-260 = "А! И ещё кое-что."
211070-261 = ""
211070-263 = ""
211070-264 = ""
211070-265 = "Спасибо, что помогаете нам, Сенсей."
211070-266 = "В одиночку нам пришлось бы тяжело. Только благодаря вам мы смогли сдвинуться с места."
211070-267 = "И в последнее время к нам вступило столько новых студентов. Это просто невероятно..."
211070-268 = "В общем, будем на связи, договорились? Я-ха-ха!"
211070-270 = "Благодаря Карен я закончил все дела и благополучно вернулся."
211070-271 = "Не оставалось сомнений, что она искренне заботится о Геенне."
211070-273 = "Следующий эпизод;Зона безудержной стрельбы"
