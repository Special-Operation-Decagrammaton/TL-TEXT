211070-1 = "Episódio 07;Karen"
211070-6 = ""
211070-7 = ""
211070-8 = "Fala aí, belezinha? Cooomo vai essa força?"
211070-9 = ""
211070-11 = ""
211070-12 = ""
211070-13 = ""
211070-14 = "Pô, ignorar a gente assim é vacilo, hein."
211070-15 = "......O que vocês querem?"
211070-16 = ""
211070-18 = ""
211070-19 = "É que assim... eu tenho uma implicância mortal com o povo de Gehenna."
211070-20 = "Só de bater o olho em vocês já me dá crise alérgica."
211070-21 = "E acabei de olhar bem na sua fuça, sacou?#nPor isso... se liga aqui: empipocou tudo de urticária."
211070-22 = "...Ué, cadê? Já sumiu?"
211070-23 = "Droga, a tinta da caneta é à base d'água. Empresta o marcador aí de novo."
211070-24 = ""
211070-26 = ""
211070-27 = "Aí, tá vendo só? Brotou sete pintas pretas no meu braço por sua culpa.#nComo você vai me indenizar por esse prejuízo?!"
211070-28 = "Você acabou de desenhar isso com canetinha na minha frente?!"
211070-29 = "Cala a boca! Sem desculpinha esfarrapada, passa a grana do dano moral!"
211070-30 = "Que loucura sem cabimento..."
211070-31 = "Acho bom ir abrindo a carteira logo pro seu próprio bem, mané!"
211070-32 = "Ugh... suas covardes..."
211070-33 = "Hahaha! Garota de Gehenna andando sozinha na rua é presa fácil demais!"
211070-34 = "Zero união entre vocês, e o Comitê de Disciplina tá ocupado demais dentro do próprio quadrado."
211070-35 = "Ou seja: não tem uma viva alma pra te salvar!"
211070-37 = "[ns] Dá um passo à frente."
211070-40 = "[ns] \"Hum...? O que é aquilo...?\""
211070-41 = "Hahaha! Que piada mais sem graça, na moral."
211070-42 = "Ahn?! Quem foi que abriu a boca?!"
211070-43 = "Quem é você, ô trombadinha?"
211070-44 = ""
211070-46 = ""
211070-47 = ""
211070-48 = "Qual foi, outra pirralha de Gehenna?"
211070-49 = ""
211070-51 = ""
211070-52 = "É. De Gehenna com muito orgulho."
211070-53 = "Então façam o seguinte――"
211070-54 = "Tirem as patinhas imundas da nossa aluna e sumam daqui antes que sobre pra vocês."
211070-55 = ""
211070-57 = ""
211070-59 = "[ruby=Myouraku]Karen Myouraku[/ruby]"
211070-60 = "Assessora da Presidente do Comitê de Restauração de Gehenna"
211070-61 = "Ao contrário de sua aparência descontraída, tem pavio curtíssimo e zero hesitação para a violência"
211070-63 = ""
211070-65 = "Como é que é?!"
211070-66 = "Olha a audácia dessa fedelha... Quem você pensa que é?#nBraçadeira... você não tem, então não é do Comitê de Disciplina."
211070-67 = "Quer dizer então que você é [ruby=amiga]amiguinha[/ruby] dela?"
211070-68 = "E-Eh?! Não, eu nem conheço... a gente não――"
211070-69 = ""
211070-71 = ""
211070-72 = "Virei amiga agora. Muito prazer."
211070-73 = "Quêêê...?!"
211070-74 = "Tanto faz, dane-se! O que uma pirralha sozinha vai fazer?!#nVamos te ensinar o que é a lei da selva neste mundo!"
211070-75 = "Deguste o curso intensivo do amargor gélido de Kivotos na marra!!"
211070-76 = ""
211070-77 = "[ns] \"E-Ei, calma aí...!\""
211070-78 = ""
211070-80 = ""
211070-81 = ""
211070-82 = ""
211070-86 = ""
211070-87 = "Guaaah! S-Sua desgraçada...!"
211070-88 = ""
211070-90 = ""
211070-91 = ""
211070-92 = ""
211070-94 = ""
211070-96 = ""
211070-97 = "Uuuugh! Ai, que dor――!!"
211070-98 = "V-Você vai pagar por isso...!"
211070-99 = ""
211070-101 = ""
211070-103 = "Acabou num piscar de olhos..."
211070-104 = ""
211070-106 = ""
211070-107 = ""
211070-108 = "Tá inteira aí?"
211070-109 = "Hã... ah... sim."
211070-110 = "Pode relaxar, não precisa travar desse jeito não.#nNão parece ferida e nada seu foi levado, que alívio."
211070-111 = "Muito obrigada mesmo! Se você não tivesse aparecido, eu nem sei o que teria acontecido..."
211070-112 = "Eu não te falei agorinha? Somos amigas.#nE quem mexe com amigo meu não se cria na minha frente."
211070-113 = "Que incrível..."
211070-114 = "Ah, mudando de assunto do nada: você já ouviu falar no Comitê de Restauração de Gehenna?"
211070-115 = "...Acho que já. O nome tá bem falado ultimamente, não tá?"
211070-116 = "Pois é, eu faço parte de lá."
211070-117 = "Caraca, sério?! Eu não participo de nenhum clube..."
211070-118 = "Aee! Então bora entrar com a gente!"
211070-119 = "Toma aqui o meu MomoTalk. Se der qualquer ruim, me dá um toque."
211070-120 = "A gente protege os alunos de Gehenna até do lado de FORA. Ao contrário do Comitê de Disciplina."
211070-121 = "Caramba, que atitude maneira..."
211070-122 = "Acho que vou preencher a ficha de inscrição agora mesmo!"
211070-123 = "Gehenna grande de novo!"
211070-124 = ""
211070-126 = ""
211070-127 = "Tornar Gehenna grande de novo!"
211070-128 = ""
211070-130 = ""
211070-131 = ""
211070-132 = "Hahaha! Mais um caso encerrado com chave de ouro!"
211070-133 = ""
211070-135 = ""
211070-136 = ""
211070-137 = "Ué... Sensei?!"
211070-138 = "[s] \"Olá!\""
211070-139 = "Eita, é você mesmo em carne e osso!"
211070-140 = "O que tá fazendo por aqui? Pera aí... você viu a minha performance triunfal?!"
211070-141 = "[s1] \"Você foi incrível.\"\n[s2] \"Defendeu sua amiga bravamente.\""
211070-144 = "Sério?! Você viu tudinho?!"
211070-145 = "Nossa... caraca! Fiquei até feliz agora, na moral."
211070-146 = ""
211070-148 = ""
211070-149 = "Então... cadê o meu cafuné?! Quem faz boa ação merece receber carinho na cabeça, ué!"
211070-150 = "[s] Faz cafuné na cabeça dela."
211070-151 = ""
211070-153 = ""
211070-154 = ""
211070-155 = "Hihihi!"
211070-156 = ""
211070-158 = ""
211070-159 = "Hum? Se eu vivo fazendo isso por aí?"
211070-160 = "Ah, com certa frequência até."
211070-162 = "Do lado de fora do distrito autônomo, essas emboscadas rolam direto. O Comitê de Disciplina só opera lá dentro, afinal."
211070-163 = "Aluna de Gehenna andando sozinha vira alvo fácil na hora.#nQuer dizer, isso meio que vale pra qualquer escola hoje em dia."
211070-164 = "Mas eu não deixo barato. Tocou num aluno nosso, não escapa da minha mão."
211070-165 = ""
211070-166 = "Ué? Pode me chamar a qualquer hora...? Você quer que eu te chame, Sensei?"
211070-167 = ""
211070-169 = ""
211070-170 = "Que fofura... fazia tempo que ninguém me tratava com tanto carinho assim."
211070-171 = "Mas olha lá, hein? Eu sou bem casca-grossa na briga!#nMesmo em desvantagem numérica, costumo dar conta do recado facinho."
211070-172 = "Se a coisa apertar, é só recuar um teco e armar uma emboscada surpresa que tá tudo resolvido."
211070-173 = "Na real, quem tá correndo perigo aqui é você, Sensei!#nVocê viu como o clima nesta vizinhança tá tenso e perigoso."
211070-174 = "Já que estamos aqui, vou ser sua guarda-costas particular até você terminar seus afazeres!"
211070-175 = "Nem esquenta a cabeça, eu tava atoa e entediada mesmo."
211070-176 = ""
211070-177 = ""
211070-178 = ""
211070-179 = ""
211070-180 = ""
211070-182 = "(Fomos abordados por outras arruaceiras durante o trajeto, mas...)"
211070-183 = ""
211070-184 = ""
211070-185 = ""
211070-186 = ""
211070-187 = ""
211070-188 = ""
211070-189 = ""
211070-190 = ""
211070-191 = ""
211070-192 = ""
211070-193 = ""
211070-194 = ""
211070-196 = "(Karen repeliu todas elas com tremenda facilidade)"
211070-197 = ""
211070-202 = "[ns] \"Muito obrigado pela ajuda hoje.\""
211070-203 = "Imagina, não precisa agradecer! Fico feliz em ter sido útil."
211070-204 = "Foi super divertido bater perna por aí com você."
211070-205 = "Mas olha, Sensei... você atrai confusão que é uma beleza, hein? Só hoje foi uma atrás da outra."
211070-206 = "[s] \"É um verdadeiro drama...\""
211070-207 = "Das próximas vezes pode me chamar sem vergonha, beleza?"
211070-208 = "Aliás, deixa eu te passar meu MomoTalk! Mensagem, ligação, o que você preferir～"
211070-209 = ""
211070-211 = ""
211070-213 = "Prontinho, contato salvo!"
211070-214 = "Dá uma sensação boa de proximidade, né?"
211070-215 = "Essa é a primeira vez que me conecto assim com um adulto. Hihi, achei muito legal."
211070-216 = ""
211070-218 = ""
211070-219 = "Ah, preciso voltar logo pro comitê."
211070-220 = "Pra encerrar, tem alguma pergunta que queira fazer?"
211070-221 = "Hoje eu tô boazinha demais! Respondo o que você quiser saber!"
211070-222 = ""
211070-225 = "[ns] \"Karen, por que você se dedica tanto ao Comitê de Restauração de Gehenna?\""
211070-226 = "Opa, pegou pesado na pergunta!"
211070-227 = "Deixa eu ver..."
211070-228 = ""
211070-230 = ""
211070-231 = "Porque eu amo Gehenna?"
211070-232 = "Acho que esse é o principal motivo!"
211070-233 = "Trabalhar em equipe com as meninas é divertido demais.#nE você viu com seus próprios olhos, né, Sensei? Nosso grupo só tem figuraça incrível."
211070-234 = "Hum? Por que exatamente eu amo Gehenna?"
211070-235 = "......"
211070-236 = "Huuuum... deixa eu pensar direito..."
211070-237 = "É meio difícil de explicar em palavras, mas tem várias coisas."
211070-238 = "Primeiro... o ar daqui não é pesado nem cheio de falsidade, sabe?"
211070-239 = "Eu detesto hipocrisia com todas as forças.#nGente que sorri pela frente e fala mal pelas costas...#nEsse tipo de falsidade não desce de jeito nenhum."
211070-240 = "Mas aqui não tem isso, né?#nQuando quebra o pau, a gente sai na mão e depois acabou, vida que segue. Sem teatrinho nem máscara."
211070-241 = "E também tem essa vibe de poder fazer o que quiser. Essa sensação de liberdade total. Eu adoro isso."
211070-242 = "Se isso não contradiz as diretrizes do comitê?"
211070-243 = "Pois é... pior que sim! Essa parada de 'ordem e controle em Gehenna'..."
211070-244 = "Pode soar meio feio falar isso, mas... esse discurso aí é ideia que a [ruby=cerebro]Shoko-chan[/ruby] bolou."
211070-245 = "Mas a verdade... é que eu tenho curiosidade de ver o horizonte que a Mayumi enxerga.#nEu quero ver aquela paisagem com meus próprios olhos, por isso corro ao lado dela."
211070-246 = "A Gehenna caótica de hoje não é ruim, mas..."
211070-247 = "De todo mundo que eu conheço na vida, a Mayumi é quem mais ama Gehenna de corpo e alma!"
211070-248 = ""
211070-249 = "Eu fico imaginando que tipo de escola uma garota como ela quer construir."
211070-250 = "Ela é do tipo que sai atropelando tudo e vive quebrando a cara, mas é isso que faz ela ser única."
211070-251 = "A Shoko solta umas loucuras frias de vez em quando, mas o amor que ela tem por Gehenna é igualzinho."
211070-253 = "Você não tem curiosidade de ver?#nUma Gehenna onde todo mundo marcha unida num propósito só?"
211070-254 = "Em vez de todo mundo disperso e perdido, todo mundo olhando na mesmíssima direção."
211070-255 = "Eu não faço a menor ideia de como seria isso na prática..."
211070-256 = ""
211070-257 = "Hihi, acho que é isso aí! O motivo de eu dar o sangue no comitê."
211070-258 = "E aí? Consegui responder direito?#nSe ficou meio enrolado me perdoa, não sou muito dos estudos."
211070-259 = "[s] \"Não se preocupe, entendi perfeitamente o seu coração.\""
211070-260 = "Que bom! Fico aliviada.#n...Ah! Quase me esqueci de falar outra coisa importante!"
211070-261 = ""
211070-263 = ""
211070-264 = ""
211070-265 = "Muito obrigada por estar nos ajudando, Sensei."
211070-266 = "Se fossemos só nós três, com certeza teria sido um perrengue sem fim.#nGraças a você, as coisas estão fluindo que é uma beleza."
211070-267 = "Ultimamente tem entrado uma enxurrada de alunas novas no comitê."
211070-268 = "Então continua com a gente daqui pra frente, combinado?!"
211070-270 = "(Graças a Karen, consegui concluir meus compromissos em total segurança)"
211070-271 = "(Pude sentir que o sentimento delas por Gehenna é genuíno e puro)"
211070-273 = "A Seguir;Zona do Gatilho Fácil"