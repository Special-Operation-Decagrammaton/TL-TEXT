[translation]
211070-1 = "Episode 7;Karen"
211070-8 = "Heeey, heeeellloooo?"
211070-14 = "Ignoring me is pretty rude, you know."
211070-15 = "……Do you need something?"
211070-19 = "Ugh, I absolutely hate Gehenna people."
211070-20 = "Just looking at them gives me an allergic reaction."
211070-21 = "And look, I just saw you, didn't I?#nSo... see here, hives."
211070-22 = "……Wait, they didn't go away?"
211070-23 = "Tch, was it water-based? Lend me your pen again."
211070-27 = "Look at that. Because of you, I've got seven moles on my arm now.#nHow are you going to take responsibility for this?"
211070-28 = "You just drew those yourself, didn't you!?"
211070-29 = "Shut up! Don't give me any excuses, just pay the damages!"
211070-30 = "That's ridiculous……."
211070-31 = "I think it'd be in your best interest to take out your wallet, pronto."
211070-32 = "Ugh…… you guys……."
211070-33 = "Ha, even if you're from Gehenna, you're easy prey when you're walking alone."
211070-34 = "You've got no unity, and the Prefect Team is too busy with stuff inside the district."
211070-35 = "In other words, nobody is going to help you!"
211070-37 = "[ns] Step forward."
211070-40 = "[ns] \"Hmm...? What's that...?\""
211070-41 = "Yaha! That's hilarious."
211070-42 = "Huh? What did you just say?"
211070-43 = "Who the hell are you?"
211070-48 = "What, another Gehenna student?"
211070-52 = "Yeah. Gehenna."
211070-53 = "So—"
211070-54 = "Could you take your hands off my student and get lost already?"
211070-59 = "Myouraku Karen"
211070-60 = "Vice-Chair of the Gehenna Restoration Committee"
211070-61 = "Despite her appearance, she is short-tempered and has no hesitation in using violence."
211070-65 = "Huh?"
211070-66 = "What, what, who do you think you are?#nYou're not wearing an armband... and you don't look like you're from the Prefect Team."
211070-67 = "Does that mean you're her friend?"
211070-68 = "Eh, no... it's not like that—"
211070-72 = "You're friends now. Nice to meet you."
211070-73 = "Ehh……."
211070-74 = "Well, whatever. What can you do all by yourself?#nI'll teach you what the unfairness of the world is all about!"
211070-75 = "It's a crash course in the bitterness and coldness of Kivotos!"
211070-77 = "[ns] \"W-wait a second...!\""
211070-87 = "Guh! You... this...!"
211070-97 = "Ugh! Ow—!!"
211070-98 = "J-just you wait...!"
211070-103 = "It was over in an instant……."
211070-108 = "You okay?"
211070-109 = "Eh, ah... yeah."
211070-110 = "You're so stiff. You can be more casual, you know.#nDoesn't look like you're hurt, and it doesn't look like they took anything either."
211070-111 = "Thank you so much. I don't know what would have happened if you hadn't helped me……."
211070-112 = "I told you earlier, didn't I? We're friends now.#nI never forgive anyone who bullies my friends."
211070-113 = "So cool……."
211070-114 = "Oh, totally changing the subject, but have you heard of the Gehenna Restoration Committee?"
211070-115 = "……Maybe I have. They've been pretty famous lately, right?"
211070-116 = "I'm in that group."
211070-117 = "Eh, really? I'm not in any clubs or anything."
211070-118 = "Yaha, then you should join!"
211070-119 = "Here, this is my MomoTalk. Let me know if anything happens."
211070-120 = "We protect Gehenna students even 'outside' the district. Unlike the Prefect Team."
211070-121 = "That's so cool……."
211070-122 = "Maybe I should submit an application!"
211070-123 = "Make Gehenna Great Again!"
211070-127 = "Make Gehenna Great Again!"
211070-132 = "Yaha, another job well done!"
211070-137 = "Oh, Sensei?"
211070-138 = "[s] \"Hey there.\""
211070-139 = "Whoa, it's the real deal!"
211070-140 = "What are you doing here? And wait, did you see me in action?"
211070-141 = "[s1] \"You were cool.\"\n[s2] \"You protected your friend.\""
211070-144 = "For real? You saw it!"
211070-145 = "Aww, that's awesome. I'm actually happy."
211070-149 = "Then, headpats! It's only natural to be praised for doing something good, right?"
211070-150 = "[s] Pat her head."
211070-155 = "Yaha."
211070-159 = "Hmm? You asking if I do this all the time?"
211070-160 = "Well, I guess so?"
211070-162 = "It happens sometimes outside the district. The Prefect Team only stays inside."
211070-163 = "Gehenna students walking alone are easy targets.#nWell, I guess that's the same for every school."
211070-164 = "But I never let anyone who messes with Gehenna students get away."
211070-166 = "Eh? Call you anytime, you say... you mean Sensei?"
211070-170 = "How sweet~ It's been a while since someone said that to me."
211070-171 = "But you know, I'm actually pretty strong?#nEven if there are a lot of them, I can usually handle it."
211070-172 = "If I think I'm going to lose, I just retreat and launch a surprise attack, and I'm good."
211070-173 = "Actually, isn't it more dangerous for you, Sensei?#nLike just now, the security around here is pretty shaky."
211070-174 = "Since you're here, I'll escort you until you're done with your business!"
211070-175 = "Oh, don't worry about it. I had nothing to do and was bored anyway."
211070-182 = "(On the way, we were threatened a few more times, but...)"
211070-196 = "(Karen fought them off.)"
211070-202 = "[ns] \"Thanks for today.\""
211070-203 = "Don't mention it. I'm glad I could be of help."
211070-204 = "I had fun going around with you, too."
211070-205 = "But Sensei, you really are the type to get into trouble, aren't you? You were targeted way too much just today."
211070-206 = "[s] \"It's a real problem...\""
211070-207 = "Don't hesitate to call me from now on, okay?"
211070-208 = "Oh, should I give you my MomoTalk? Message or call, whichever you prefer~"
211070-213 = "Alright, registration complete!"
211070-214 = "It feels nice to be connected like this."
211070-215 = "This is the first time I've done something like this with an adult. Yaha, this is super fun."
211070-219 = "Oh, I should get back soon."
211070-220 = "Before I go, is there anything you want to ask?"
211070-221 = "I'm feeling generous today. I'll answer anything, okay?"
211070-225 = "[ns] \"Why does Karen do activities for the Gehenna Restoration Committee?\""
211070-226 = "Oh, that's an unexpected question."
211070-227 = "Hmm……."
211070-231 = "Because I love Gehenna?"
211070-232 = "That's probably the biggest reason!"
211070-233 = "It's fun doing things with everyone.#nYou saw it yourself, Sensei, right? My group members are all so interesting."
211070-234 = "Hmm? The reason I love Gehenna?"
211070-235 = "……."
211070-236 = "Hmm…… uuuuh……."
211070-237 = "That's a tough one. I think there are a lot of reasons."
211070-238 = "First of all... the 'no hard feelings' vibe? Is that what you call it?"
211070-239 = "I really hate hypocrisy.#nSmiling to someone's face and then talking behind their back.#nI really can't stand that."
211070-240 = "But we're not like that, right?#nWhen we do something, we do it big, and that's it. No front, no back."
211070-241 = "Also, I like that we can do whatever we want. That feeling of freedom. I like that."
211070-242 = "You think that sounds a bit different from the committee's direction?"
211070-243 = "Yeah, that's true. 'Order and control for Gehenna,' right?"
211070-244 = "It might sound bad when I say it like this... but that's just something I heard from our brain, Shoko-chan."
211070-245 = "But... I think I'm just curious about the scenery Mayumi-chan is looking at.#nI want to see it too, so I'm running alongside her."
211070-246 = "It's not like I hate the chaotic Gehenna, though."
211070-247 = "Because Mayumi-chan loves Gehenna more than anyone I know!"
211070-249 = "I wonder what kind of school Mayumi-chan wants to create."
211070-250 = "She's the type to rush ahead and crash, but I guess that's what's good about her."
211070-251 = "Shoko-chan says weird things sometimes, but she loves Gehenna just as much."
211070-253 = "Don't you want to see it?#nA Gehenna where everyone is one."
211070-254 = "Not scattered, but everyone looking in the same direction."
211070-255 = "I can't even imagine what that would be like, though."
211070-257 = "Yaha, I guess that's it. The reason I'm working hard in the Restoration Committee."
211070-258 = "How was that? Did I answer it properly?#nSorry if it wasn't very coherent. I'm not good at studying."
211070-259 = "[s] \"It's okay, I understood perfectly.\""
211070-260 = "I see. That's good.#n……Ah! I have to say this too."
211070-265 = "Thanks for helping me, Sensei."
211070-266 = "I'm sure it would have been much harder if it were just us.#nThings are going smoothly thanks to you."
211070-267 = "We've even had more students joining lately."
211070-268 = "So, I'm counting on you from now on too!"
211070-270 = "(Thanks to Karen, I was able to finish my schedule safely.)"
211070-271 = "(I also felt that her passion for Gehenna was 'for real'.)"
211070-273 = "Next Episode;Trigger Happy Zone"