[translation]
1015303-1 = "Fairy Queen Titania"
1015303-4 = "I'm glad our shopping trip went well."
1015303-5 = "We were able to buy everything we needed, and we even managed to win a#nplushie from the arcade!"
1015303-6 = "I'm always lucky when I'm with you, Sensei!"
1015303-7 = "[s] \"It was a struggle to win that plushie though!\""
1015303-8 = "Eheheh, as long as we got it in the end!"
1015303-9 = "...Ah, I need to change lanes."
1015303-10 = "Turn on the indicator, check the mirror, and—"
1015303-13 = "Uwah!?"
1015303-14 = "Watch where you're goin'! The hell were you lookin' at!?"
1015303-17 = "We were here first. Back off!"
1015303-18 = "Ow... That scared me so bad I nearly sprained my neck. #nProbably gonna have to go to the hospital for this. I'm billin' you for the medical."
1015303-20 = "[ns] \"They were the ones who cut us off, weren't they?\""
1015303-21 = "Yes. What's more, you're not allowed to change lanes there..."
1015303-22 = "*Sigh*..."
1015303-23 = "I'm sorry! I'll be more careful!"
1015303-24 = "[s] \"You're apologizing even if it wasn't your fault?\""
1015303-25 = "Ahaha... They might hold a grudge towards me otherwise. #nBesides, you're riding with me right now too."
1015303-26 = "Above all though, this place is prone to traffic jams. #nIt's inconvenient for everyone here if a fight breaks out or an accident occurs."
1015303-27 = "The hell, hey! Drive on the left lane if you're gonna go this slow!"
1015303-28 = "Ahaha... Sorry about that..."
1015303-29 = "You think you're on a Sunday drive!? Move outta the way!"
1015303-30 = "Yeees."
1015303-31 = "[s] \"You're such a calm driver. That's Hifumi for you...!\""
1015303-32 = "I'm simply prioritizing safety."
1015303-33 = "I understand that some people tend to get a little hotheaded behind the wheel,#nso..."
1015303-35 = "Tch. This's borin'. She's barely reactin' to any of this."
1015303-36 = "Meh, what's the point of tailgating a dumbass like this—"
1015303-37 = "Hey, in front of you! Look out!"
1015303-38 = "Huh?"
1015303-39 = "Gyaaah!"
1015303-44 = "You dumbass! How'd you manage to crash into a vehicle that ain't even movin'!?"
1015303-45 = "That's what happens when you drive like that..."
1015303-46 = "Hold on, didya forget this was OUR car? #nWhat're we gonna do if Valkyrie catches us!?"
1015303-47 = "Run away! I bent the license plate; they won't be able to ID us!"
1015303-53 = "[ns] \"They're fleeing!\""
1015303-54 = "It's a hit-and-run!"
1015303-55 = "Sensei, should we give chase!?"
1015303-56 = "[s] \"Up to you!\""
1015303-57 = "Got it...!"
1015303-58 = "Sensei, I suggest you tighten your seatbelt while you have the chance."
1015303-59 = "In the mean time, I'll finish preperations on my end..."
1015303-62 = "[ns] \"Is this fine? Won't they get away?\""
1015303-63 = "Sensei, the light's currently red. #nBesides, this much is still fine."
1015303-67 = "...Switching on launch control."
1015303-68 = "—Here we go!"
1015303-73 = "Hold on tight! Sharp curve ahead."
1015303-80 = "[ns] \"Uwooogh... The lateral G's...!!\""
1015303-81 = "I'll finish this quickly!"
1015303-82 = "Hold on just a little longer!"
1015303-84 = "Hey hey hey! That tank's zoomin' towards us!"
1015303-85 = "What happened to the Sunday drivin' from earlier!?"
1015303-86 = "That exhaust does NOT sound right! #nWhy does it sound like popcorn!?"
1015303-87 = "We're gonna be caught at this rate!"
1015303-91 = "The woods! Run for the forest!"
1015303-92 = "That thing's set up for rallying! We should be safe there!!"
1015303-93 = "Wooooagh!!"
1015303-98 = "...So they've entered the woods."
1015303-99 = "With rough terrain and complicating pathing... #nI suppose they thought they'd lose us in there."
1015303-100 = "However, they're sitting ducks now."
1015303-101 = "Sensei, hold on tight. #nI'll finish this as safely and quickly as I possibly can!"
1015303-105 = "[ns] \"What did you just push? Why do I hear alarms?\""
1015303-106 = "Don't worry about that."
1015303-107 = "All I did was disable the auto rev-matching."
1015303-108 = "Now, into the woods we go."
1015303-119 = "U-umm... Could you raise your heads already...?"
1015303-120 = "We're sorry, ma'am!!"
1015303-121 = "We didn't expect there to be such a big shot on a public road!"
1015303-122 = "We won't ever tailgate again!!"
1015303-123 = "We'll quietly turn ourselves in to Valkyrie!"
1015303-124 = "Eh? U-um...? #nAll I meant to do was report them..."
1015303-125 = "[s] \"Hi...fumi... Urp... Great wo... work...!\""
1015303-126 = "I'm so sorry! I was driving too wildly!"
1015303-127 = "Please! I'll never drive down these streets ever again!"
1015303-128 = "Actually... I'll just walk on foot for the rest of my life!!"
1015303-129 = "E-eh!? #nY-you could just not bother people and drive around normally!"
1015303-131 = "(When Valkyrie arrived later, the two tailgaters immediately clung onto them.)"
1015303-132 = "(However, they were reluctant to get into the patrol car due to their newfound fear#nof vehicles, so it took quite a bit of time to transport them.)"
1015303-135 = "(That aside, I couldn't help but to think of the courage I'd need to ride on Hifumi's tank in the future.)"