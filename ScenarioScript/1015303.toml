[translation]
1015303-1 = "Fairy Queen"
1015303-4 = "I'm so glad our shopping trip went smoothly!"
1015303-5 = "We were able to buy everything we needed, and I even won a stuffed animal at the arcade!"
1015303-6 = "We're so lucky to have Sensei with us!"
1015303-7 = "[s] \"Though it was tough getting it out!\""
1015303-8 = "Ehehe, but we got it, so that's all that matters!"
1015303-9 = "...Ah, I need to change lanes."
1015303-10 = "Put on the turn signal, check the mirror, and then—"
1015303-13 = "Wha—?!"
1015303-14 = "Watch where you're going, dumbass!!"
1015303-17 = "We were here first, weren't we? Get the hell out of the way!"
1015303-18 = "Ow, ow... The shock totally messed up my neck. #nLooks like I'll need to be hospitalized. Time to demand medical bills."
1015303-20 = "[ns] \"They're the ones who cut in, right?\""
1015303-21 = "Yes. Besides, changing lanes isn't even allowed there..."
1015303-22 = "Haa..."
1015303-23 = "Um! I'm sorry, I'll be more careful!"
1015303-24 = "[s] \"You're apologizing even though it's not your fault, Hifumi?\""
1015303-25 = "Ahaha... There's a chance they might hold a grudge, #nand Sensei is in the car with me, too."
1015303-26 = "Above all, traffic tends to get congested around here. #nStarting a fight or causing an accident would just be a nuisance to everyone."
1015303-27 = "The hell, man! If you're gonna be so slow, get in the left lane!"
1015303-28 = "Ahaha... I'm so sorry..."
1015303-29 = "Stop crawling along! You're in the way!"
1015303-30 = "Yeees."
1015303-31 = "[s] \"As expected of Hifumi, such calm driving...!\""
1015303-32 = "I'm just driving with safety first."
1015303-33 = "I understand how easy it is to lose your temper while driving, though..."
1015303-35 = "Tch, how boring. Why are they barely reacting?"
1015303-36 = "Well, even if you tailgate a slowpoke like this—"
1015303-37 = "Ah, hey! Watch the front, look ahead!"
1015303-38 = "Huh?"
1015303-39 = "Gyaaa?!"
1015303-44 = "You idiot! What are you doing crashing into a stopped car?!"
1015303-45 = "That's what you get for driving like that..."
1015303-46 = "Besides, you forgot this car is ours, right? #nWhat're we gonna do if Valkyrie busts us?!"
1015303-47 = "Let's bail!! The license plate is bent, so they won't figure it out!"
1015303-53 = "[ns] \"They ran away!!\""
1015303-54 = "It's a hit-and-run!"
1015303-55 = "Sensei, should we pursue them?!"
1015303-56 = "[s] \"If you're okay with it, Hifumi!\""
1015303-57 = "Yes...!"
1015303-58 = "Sensei, please fasten your seatbelt properly in the meantime."
1015303-59 = "I'll get ready..."
1015303-62 = "[ns] \"Are you okay? Won't they get away?\""
1015303-63 = "Sensei, the traffic light is red. #nBesides, this much is no problem."
1015303-67 = "...Engaging launch control, there."
1015303-68 = "—Here we go!"
1015303-73 = "Hold on tight! Sharp curve ahead."
1015303-80 = "[ns] \"Whooooaa... The lateral G-force...!!\""
1015303-81 = "I'll wrap this up quickly!"
1015303-82 = "Just bear with it a little longer!"
1015303-84 = "No way, no way, no way! A tank is speeding after us!!"
1015303-85 = "What was all that sluggish driving about earlier?!"
1015303-86 = "Doesn't that exhaust note sound weird?! #nIt sounds like popcorn popping?!"
1015303-87 = "At this rate, they're gonna catch us!"
1015303-91 = "A forest! Dive into the logging road!"
1015303-92 = "This is a rally setup, we should be able to make it!!"
1015303-93 = "Wooooooh!!"
1015303-98 = "...They've entered the forest."
1015303-99 = "It's unpaved over there, and the terrain is complex... #nThey probably thought they could shake us off by escaping into it—"
1015303-100 = "Now, we can catch up."
1015303-101 = "Sensei, please hold on tight. #nI'll make this as safe and quick as possible!"
1015303-105 = "[ns] \"What button did you just press? There's a warning sound...\""
1015303-106 = "No problem."
1015303-107 = "I just turned off the rev-matching system."
1015303-108 = "Now, entering the forest."
1015303-119 = "Um, um... Please raise your head now..."
1015303-120 = "We're so sorry, Big Sis!!"
1015303-121 = "To think there'd be such a powerhouse out on public roads!"
1015303-122 = "We'll never tailgate anyone ever again!!"
1015303-123 = "We'll gladly surrender to Valkyrie!"
1015303-124 = "Huh, w-wait...? #nI was just planning to report them..."
1015303-125 = "[s] \"Hi... Hifumi... Ugh, good job, yo... barf...!\""
1015303-126 = "I'm so sorry!! My driving was way too rough, wasn't it...!!"
1015303-127 = "I'll never touch a steering wheel in this city again!!"
1015303-128 = "No... I'll just walk everywhere for the rest of my life!!"
1015303-129 = "What?! #nJ-Just drive normally and quietly—!!"
1015303-131 = "(Shortly after, the tailgating drivers clung to the Valkyrie officers the moment they arrived.)"
1015303-132 = "(However, they were too scared of the car and refused to get into the patrol car, so the escort took a little while.)"
1015303-135 = "(Be that as it may, I figured that riding in Hifumi's tank might require a bit of courage...)"
