[translation]
2600005-1 = "Консультация по восстановлению после усталости"
2600005-2 = "(...)"
2600005-5 = "[ns] «...?»"
2600005-6 = "..."
2600005-7 = "[s1] «Где я...?»\n[s2] «Чинацу?»"
2600005-8 = "Сенсей?"
2600005-9 = "Сенсей?"
2600005-10 = "Вы в медпункте. Я сама принесла вас сюда."
2600005-11 = "...Хм? Хотите узнать, почему вы здесь?"
2600005-12 = "Я тоже хотела бы знать. Что с вами произошло до того, как я вас нашла?"
2600005-13 = "После нашего последнего сообщения я пришла к месту встречи..."
2600005-14 = "...и обнаружила вас лежащим без сознания на земле с шишкой на голове размером с мой кулак."
2600005-15 = "Можете рассказать, что произошло, Сенсей? На вас напали?"
2600005-16 = "Что-нибудь помните?"
2600005-17 = "[s3] «Я просто переработал. Не о чем волноваться.»\n[s4] «Не знаю. Честно говоря, почти ничего не помню.»"
2600005-18 = "..."
2600005-19 = "..."
2600005-20 = "*вздыхает*"
2600005-21 = "Понятно. Значит, вы потеряли сознание... от переутомления."
2600005-22 = "Тогда шишка на голове появилась либо когда вы ударились о стол, либо когда упали в обморок."
2600005-23 = "Серьёзных травм у вас нет, так что после отдыха всё должно быть хорошо."
2600005-24 = "У вас... ещё осталась работа?"
2600005-25 = "И вы собираетесь сразу вернуться и закончить её?"
2600005-26 = "..."
2600005-27 = "Не выйдет, Сенсей."
2600005-28 = "Мне ужасно жаль, но я не могу вам этого позволить."
2600005-29 = "Если понадобится, я останусь здесь и прослежу, чтобы вы никуда не ушли."
2600005-30 = "Я отвечаю за медицинскую помощь, а значит, сейчас вы мой пациент. Я не стану закрывать глаза."
2600005-31 = "..."
2600005-32 = "Кроме того, есть кое-что, что я надеялась не говорить..."
2600005-33 = "У меня бывает довольно тяжёлый характер, Сенсей."
2600005-34 = "[s] «...Чинацу?»"
2600005-35 = "Возможно, я перешла границу, но пока вы спали, я провела полную диагностику."
2600005-36 = "Вы невероятно истощены — настолько, что само ваше выживание уже чудо."
2600005-37 = "Как бы сильно вы ни были преданы работе и благополучию своих студентов..."
2600005-38 = "...вы никому не сможете помочь, если окончательно себя загоните."
2600005-39 = "Если продолжите так себя изводить..."
2600005-40 = "..."
2600005-41 = "П-простите. Я снова вас отчитываю."
2600005-42 = "..."
2600005-43 = "Н-но с этого момента, когда работы станет слишком много, лучше позовите меня."
2600005-44 = "Я не смогу выполнять все ваши обязанности и принимать решения за вас..."
2600005-45 = "...но хотя бы с простыми задачами вроде сортировки и организации я могу помочь."
2600005-46 = "Сколько мы знакомы, всегда именно вы помогали мне. Поэтому я хочу, эм..."
2600005-47 = "...получить шанс... отплатить вам."
2600005-48 = "..."
2600005-49 = "В-вы не против, Сенсей...?"
2600005-50 = "[s5] «Если так говорить, мы почти похожи на супругов.»\n[s6] «Мне нравится идея секрета только между нами.»"
2600005-51 = "Я рада, что вы понима—"
2600005-52 = "Я рада, что вы понима—"
2600005-53 = "...?"
2600005-54 = "Сенсей..."
2600005-55 = "[s] «Прости. Возможно, это было слишком»."
2600005-56 = "..."
2600005-57 = "*вздох* Не нужно извиняться. Я уже знаю, чего от вас ожидать."
2600005-58 = "..."
2600005-59 = "Я нервничала, когда собиралась вам это сказать, потому что боялась показаться назойливой..."
2600005-60 = "Так что спасибо, что согласились. Теперь, когда я это сказала, мне должно стать... ну..."
2600005-61 = "...проще обращаться к вам, Сенсей."
2600005-62 = ""
2600005-63 = "Я хочу, чтобы отныне мы вдвоём заботились друг о друге."
2600005-65 = "(Чинацу уходила куда бодрее, чем выглядела в начале разговора.)"
