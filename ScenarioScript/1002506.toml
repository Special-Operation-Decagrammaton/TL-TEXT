[translation]
1002506-1 = "Секретная база"
1002506-2 = "Парк с игровой площадкой рядом с Садом цветущей сливы"
1002506-3 = "Когда я была маленькой, здесь находилась моя секретная база."
1002506-4 = "Я даже не помню, когда приходила сюда в последний раз."
1002506-5 = "Такое чувство, будто прошла вечность, но эта площадка почти совсем не изменилась."
1002506-6 = "И, судя по всему, моя секретная база всё ещё в хорошем состоянии."
1002506-7 = "[s] «Я ничего не вижу...»"
1002506-8 = "Конечно. Какая же это секретная база, если её так легко найти?"
1002506-9 = "Хочешь попробовать её отыскать, Сенсей?"
1002506-10 = ""
1002506-11 = ""
1002506-16 = "[ns1] «Это те кусты под горкой?»\n[ns2] «Нет. У меня больше нет идей.»"
1002506-17 = "Бззт! Неправильный ответ."
1002506-18 = "Эти заросли — просто обычные разросшиеся кусты."
1002506-19 = "Ха-ха. Ты слишком легко сдаёшься."
1002506-21 = "Похоже, тебе трудно её найти, так что я сама скажу."
1002506-22 = "Моя секретная база находится..."
1002506-23 = ""
1002506-24 = "...здесь!"
1002506-25 = "[s] «Бетонная труба?»"
1002506-26 = "Она может выглядеть как заброшенная строительная труба, но вход идеального размера. Он такой маленький, что внутрь могут залезть только дети."
1002506-27 = "Когда я сама была воспитанницей Сада цветущей сливы, я приходила сюда, если случалось что-нибудь плохое, чтобы успокоиться."
1002506-28 = "Здесь я могла привести мысли в порядок, потому что никто другой не мог сюда попасть. Как ни странно, это всегда помогало."
1002506-29 = "Я изливала обиду на надоедливых друзей и писала о своей мечте однажды стать замечательной наставницей..."
1002506-30 = "[s] «Неудивительно, что ты была зрелой не по годам.»"
1002506-31 = "Думаешь? А мне кажется, сейчас я больше похожа на ребячливую хулиганку."
1002506-32 = "Раньше я постоянно сюда приходила, но, когда стала старше, начала бояться, что застряну."
1002506-33 = ""
1002506-34 = ""
1002506-35 = "Но с этим телом я, возможно, снова помещусь в трубу."
1002506-36 = "И я не говорю, что перестала помещаться потому, что растолстела! Я выросла во всех смыслах!"
1002506-37 = "[s] «Тебе не нужно передо мной оправдываться.»"
1002506-38 = "О-О. Да, пожалуй, это и не нужно было говорить."
1002506-39 = "В любом случае, я впервые за много лет заберусь в свою секретную базу. Подожди меня здесь, Сенсей."
1002506-40 = "Была не была."
1002506-41 = ""
1002506-43 = ""
1002506-46 = "― Хи-хи. Здесь совсем ничего не изменилось.[wa:6010]"
1002506-49 = "― Обещания, которые я написала себе на стене,[wa:620]"
1002506-51 = "― всё ещё здесь."
1002506-54 = "― Были времена...[wa:710]"
1002506-57 = "― Теперь, когда я на них смотрю,[wa:1280]"
1002506-59 = "― понимаю, что большинство мне удалось выполнить.[wa:10]"
1002506-62 = "― Может, тогда написать[wa:1160]"
1002506-64 = "― над ними новое желание?[wa:1630]"
1002506-67 = "[ns] «И что же ты напишешь?»"
1002506-68 = "― Я-Я не могу тебе сказать.[wa:1930]"
1002506-70 = "― Это секрет!"
1002506-73 = "― Дети не могут рассказывать[wa:1660]"
1002506-75 = "― свои секреты взрослым! Хи-хи.[wa:2080]"
1002506-78 = "Странно впервые с детства вернуться в свою секретную базу."
1002506-79 = "Я смогла увидеть, какие мысли и мечты были у меня в детстве."
1002506-80 = "Я благодарна за возможность оглянуться назад и увидеть, как выросла."
1002506-81 = "[s] «Жаль, что я тоже не могу попасть в секретную базу...»"
1002506-82 = "Не-а. Я уже говорила, взрослым нельзя. Она только для детей."
1002506-83 = ""
1002506-85 = ""
1002506-86 = ""
1002506-87 = "Нооо, если хочешь, вместо этого мы можем поиграть и создать воспоминания только для нас двоих. ♥"
1002506-89 = "Я играл с Шун на заброшенной площадке до самого заката."
