[translation]
2101-1 = "Кого назовут — останьтесь, часть 1"
2101-2 = "Где-то у границы Абидоса"
2101-6 = "*тяжело дышит*"
2101-7 = "Как же жарко! Сколько мы уже идём? Мы вообще в правильную сторону движемся?"
2101-8 = "На карте казалось, что совсем недалеко..."
2101-9 = "По карте нам сюда, и мы уже прошли километров тридцать... но я всё ещё ничего не вижу."
2101-10 = "Что?! Это же почти целый марафон!"
2101-11 = "Ага, но если настроиться, не так уж и тяжело..."
2101-12 = "Помолчи, Широко..."
2101-13 = "*бормочет*"
2101-14 = "В моём возрасте и без того спина болит. Я слишком стара для таких прогулок..."
2101-15 = "Ты достаточно старая, чтобы разобраться, почему мы здесь!"
2101-16 = "Вы вообще думали, почему мы бродим по этой глуши?"
2101-17 = "Всё это изначально произошло по вашей вине!"
2101-18 = "Хм..."
2101-19 = "Хе!"
2101-20 = "Ого! ☆"
2101-21 = "Не отвлекайтесь!"
2101-22 = "Только не говорите, что уже забыли!"
2101-23 = "Серьёзно! Ничего бы этого не случилось, если бы вы вчера не довели Аяне!"
2101-25 = "(Днём ранее, в комнате Комитета по предотвращению закрытия.)"
2101-26 = "..."
2101-27 = "..."
2101-28 = "..."
2101-29 = "..."
2101-30 = "..."
2101-31 = "Итак, эм..."
2101-32 = "Кто предложил «Операцию: потратить все деньги на лотерейные билеты! Один раз живём!»?"
2101-33 = "Это я! Хитрая ветеранша!"
2101-34 = "..."
2101-35 = "Кто подал «План операции: 15 способов захватить большое количество студентов в заложники и насильно перевести их в другую школу»?"
2101-36 = "Это была я."
2101-37 = "..."
2101-38 = "Хм. А ведь может сработать. Можно во время общего собрания напасть на актовый зал академии в соседней деревне..."
2101-39 = "Эм, погодите..."
2101-40 = "Кто подал «План поездки: У-и-и-и! Давайте на выходных устроим пикник на природе! ☆»?"
2101-41 = "О! Это я!"
2101-42 = "..."
2101-43 = "Эм... это не то, что ты хотела?"
2101-44 = "Мои старческие годы и мудрость подсказывают, что у нас небольшие проблемы..."
2101-45 = "Вы вообще о чём, чёрт возьми, думали?!"
2101-46 = "Я попросила принести предложения для наших будущих действий, а вы принесли мне планы лотереи, преступления и отпуска!"
2101-47 = "Отнеситесь серьёзно! Вы не видите, как у Аяне на лбу от стресса морщины появляются?!"
2101-48 = "Не волнуйтесь, госпожа Куроми. Остался ещё один."
2101-49 = "А? Что это за внезапная официальность, Аяне?"
2101-50 = "И последнее... кто принёс вот это? «Руководство предпринимателя по продвижению бизнеса на ферме возобновляемой нефти»?"
2101-51 = "Э-Это я..."
2101-52 = "..."
2101-53 = "Выслушай меня, Аяне! Это настоящая бизнес-модель. В буклете, который мне дали на презентации, обещали довольно приличную прибыль."
2101-54 = "Сэрика... Нефть добывают из-под земли."
2101-55 = "Я... Я знаю! Но недавно открыли такую штуку, как нефть Понци..."
2101-56 = "..."
2101-57 = ""
2101-58 = ""
2101-59 = "С меня хватит!"
2101-66 = "..."
2101-67 = "...А."
2101-68 = "Теперь вспомнила."
2101-70 = "Аяне стала очень страшной."
2101-71 = "Если честно, мой план прошёл множество симуляций."
2101-72 = "Я всего лишь хотела обрести немного душевного спокойствия."
2101-73 = "Почему вы говорите так, будто вас это не касается?! Всё произошло по вашей вине!"
2101-74 = "Да, но именно ты окончательно довела Аяне, Серика. Ты стала последней каплей!"
2101-75 = "Что?!"
2101-76 = "У неё было лицо человека, потерявшего всякую надежду — отчаяние и разочарование в чистом виде."
2101-77 = "Э-Это...!"
2101-78 = "Аяне особенно хорошо к тебе относится, Серика, так что для неё это наверняка было ещё большим потрясением."
2101-79 = "Ух...!"
2101-81 = "*тяжело дышит*"
2101-82 = "Все, пожалуйста..."
2101-83 = "Прошу вас, ради всего святого, хоть раз сделайте работу нормально..."
2101-85 = "Похоже, её всё это уже окончательно достало."
2101-86 = "А потом она устроилась на подработку — убирать спортзал в другом городе."
2101-87 = "Нужно убрать весь мусор, накопившийся в спортзале, чтобы завтра там смогли провести школьный фестиваль искусств... верно?"
2101-88 = "Когда она вообще успела найти подработку? Аяне всегда думает на два шага вперёд."
2101-89 = "Но... я переживаю за Аяне. Такое чувство, что она взвалила на себя больше, чем может вынести..."
2101-90 = "Именно из-за такого стресса Аяне сегодня снова заболела!"
2101-91 = "Если бы всё пошло по плану, мы бы сейчас были здесь все вместе и уж точно не заблудились бы!"
2101-92 = "Не переживай. Лучше пусть Аяне сегодня отдохнёт."
2101-93 = "Вообще-то... разве это не шанс заработать у неё пару очков?"
2101-94 = "Надо показать ей, что мы иногда и сами способны довести дело до конца."
2101-95 = "Думаю, справимся, но идти далековато. Я была бы очень признательна, если бы кто-нибудь понёс меня на спине."
2101-96 = "Мы тоже устали! Мы уже несколько часов тут плутаем..."
2101-97 = "А, смотрите! Вон там!"
2101-98 = "...!"
2101-100 = "Незаконно переделанный спортзал"
2101-101 = "..."
2101-102 = "?"
2101-103 = "..."
2101-104 = "(Что это? Спортзал...? Разве здесь всегда был спортзал?)"
2101-105 = "Хм... это точно спортзал? Больше похоже на..."
2101-106 = "Какого чёрта?! Вы ещё кто такие?!"
2101-107 = ""
2101-108 = "...!"
2101-109 = "Эй, вы, шпана! Какого чёрта вы здесь забыли?! А? Вы хозяева этого спортзала, что ли?!"
2101-110 = "Мы уже застолбили это место. Не хотите огрести — валите отсюда!"
2101-111 = "И чтоб вы знали, мы вам не какие-нибудь слабаки! Кехехехе!"
2101-112 = "Что это за типы? Откуда они вообще взялись?"
2101-113 = ""
2101-114 = ""
2101-115 = ""
2101-117 = "..."
2101-118 = "А, вот как?"
2101-119 = "Так вот что происходит... Теперь понятно."
2101-120 = "Широко? Что ты только что достала?! Это мощная взрывчатка?!"
2101-121 = "О! Теперь и я всё поняла. ☆"
2101-122 = "А?"
2101-124 = "У меня есть честная и совершенно законная работа для членов комитета."
2101-125 = "Простая подработка: нужно очистить спортзал от всего мусора. Честно, понятно и совершенно обычно..."
2101-127 = "«...Убрать мусор, накопившийся в спортзале». Именно это сказала нам Аяне."
2101-128 = "Мусор...?"
2101-129 = "Аяне ведь довольно сообразительная. Уверена, она всё это заранее предусмотрела!"
2101-130 = "Чт...?! П-постойте!"
2101-131 = "Стойте..."
2101-132 = ""
2101-134 = ""
2101-135 = "У нас мало времени. Приступим."
2101-136 = "Пора вынести злодейский мусор!"
2101-137 = "Ага! Пора действовать пожёстче! ☆"
2101-138 = ""
2101-139 = "*вжух*"
2101-140 = "*БА-БАХ* ☆"
