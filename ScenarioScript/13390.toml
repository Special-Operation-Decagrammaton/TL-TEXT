[translation]
13390-1 = "Episódio 39;Liberação de Restrições"
13390-2 = "Hoshino-senpai!"
13390-3 = "Senpai!"
13390-4 = "Hoshino-senpai!"
13390-5 = "Senpai..."
13390-7 = "Não acredito, é mesmo verdade..."
13390-12 = "Shiroko-chan, Serika-chan, Nonomi-chan, Ayane-chan...#nE... Shiroko-chan?"
13390-16 = "Chefe do Comitê... não, Hina-chan também."
13390-17 = "Vamos deixar as saudações do reencontro para depois."
13390-24 = "É verdade... Primeiro, vamos dar um jeito naquilo ali."
13390-28 = "...Como ousa usar um truque tão sujo!!"
13390-29 = "Mas ouça bem, Sensei [USERNAME]!"
13390-30 = "Eu ainda tenho um quinto método de estratégia na manga."
13390-31 = "\"Combater trapaça com trapaça\"."
13390-32 = "Ihi, hihi... Hihihihihi!!"
13390-33 = "Eu consegui analisar o seu poder."
13390-34 = "Até mesmo uma trapaça tem limites... não é mesmo?"
13390-35 = "O máximo de alvos que você pode comandar ao mesmo tempo são seis pessoas."
13390-36 = "Mais do que isso, e o controle se desfaz."
13390-37 = "Este é o resultado que obtive ao analisar todas as informações coletadas até agora!"
13390-38 = "Afinal, o comando do Sensei ou a minha \"Constelação dos Deuses\"... qual será o mais forte?"
13390-39 = "Hihi, hihihihihi...#nNão importa quantos venham contra mim, vocês não são páreo."
13390-40 = "Não há como vencer a \"Fúria de Set\"!"
13390-41 = "Isto sim é a verdadeira trapaça!!"
13390-46 = "[ns1] \"Desculpe a demora.\"\n[ns2] \"A partir de agora, é a minha vez.\""
13390-49 = "Sim, Sensei!"
13390-50 = "A Plana-chan descobriu um novo processo escondido nas profundezas do \"Baú de Shittim\"!"
13390-51 = "Explicação.#nDevido à presença de dois sistemas operacionais no \"Baú de Shittim\", eu e a Arona-senpai..."
13390-52 = "Tornou-se possível liberar as restrições anteriores e realizar um processamento de cálculos ainda maior."
13390-53 = "Sensei, suas ordens."
13390-57 = "[ns] \"Vamos lá. Este é o nosso novo conteúdo.\""
13390-59 = "Ordem confirmada."
13390-60 = "Baú de Shittim, liberação de restrições.#nIniciando operação limitada do processo \"Perez-Uzzah\"."
13390-65 = "Autenticação concluída."
13390-66 = "Processo de conexão do Sensei confirmado.#nConto com você."
13390-67 = "Baú de Shittim, liberação de restrições.#nProcesso \"Perez-Uzzah\" em operação limitada."
13390-68 = "Em espera.#nSensei, suas ordens."
13390-69 = "Agora eu sou invencível.#nEstou duas vezes mais forte do que o normal."
13390-70 = "Vou unir forças com a Arona-senpai para dar suporte ao Sensei."
13390-74 = "...!"
13390-75 = "O quê...?"
13390-76 = "Alteração no sistema...!?"
13390-77 = "Liberar as restrições anteriores... Isso é possível!?"
13390-81 = "[ns3] \"Desta vez, acabou.\"\n[ns4] \"Não vou deixar mais ninguém morrer em Abydos.\""
13390-90 = "[ns] \"...Não vou deixar mais ninguém em Abydos sofrer.\""
13390-94 = "O que você está dizendo...?"
13390-95 = "O que diabos isso tem a ver com vencer ou perder esta disputa...!?"
13390-96 = "[ns] \"Se há uma \"criança\" sofrendo \"no mundo\"...\""
13390-98 = "[ns] E ela estende a mão pedindo ajuda..."
13390-100 = "[ns5] \"Não importa quando, não importa a hora—\"\n[ns6] Não importa quando, não importa a hora—"
13390-103 = "[ns7] \"Como um adulto que vive ao lado das crianças, devo assumir a responsabilidade.\"\n[ns8] Como um adulto que vive ao lado das crianças, devo assumir a responsabilidade."
13390-106 = "[ns9] \"Porque não deveria existir um mundo onde as alunas precisem arcar com a responsabilidade.\"\n[ns10] Porque não deveria existir um mundo onde as alunas precisem arcar com a responsabilidade."
13390-110 = "[ns11] Pegar o Cartão de Adulto.\n[ns12] Pegar o Cartão de Adulto."
13390-113 = "O que é isso!?"
13390-114 = "...Hã?"
13390-115 = "O que diabos..."
13390-116 = "...é isso!?"
13390-117 = "O-Oh—"
13390-118 = "O Cartão de Adulto...!?"
13390-119 = "C-Como você tem... uma coisa dessas..."
13390-120 = "E as regras? E o Códice?#nComo alguma coisa poderia competir com um poder desses!?"
13390-121 = "Isso é contra as regras!!"
13390-122 = "Uma coisa dessas... como algo assim pode ser permitido?!"
13390-123 = "Isso não vale... Um cartão... Usar isso num jogo é jogo sujo, não é...? Hã...??"
13390-124 = "Isso é trapaça..."
13390-125 = "É trapaça, é trapaça!"
13390-126 = "É trapaçaaaaa!!"
13390-127 = "Como ousa me enganar!!"
13390-128 = "Jogo anulado!"
13390-129 = "Entendeu?!"
13390-130 = "Conexão confirmada."
13390-131 = "—O quê!?"
13390-132 = "Transmitindo uma mensagem do Sensei."
13390-137 = "[ns13] \"Para um moleque que só consegue definir este mundo em vitória e derrota—\"\n[ns14] \"Como Sensei, eu não posso me dar ao luxo de perder.\""
13390-140 = "O que disse...!?"
13390-142 = "Em resumo, significa que não há tempo a perder#ncom alguém como você, que não conseguiu se tornar um adulto."
13390-143 = "...!!!!"
13390-147 = "Afinal, o Sensei é uma pessoa ocupada.#nAliás, ontem também virou a noite trabalhando."
13390-148 = "(A Plana-chan está meio assustadora...)"
