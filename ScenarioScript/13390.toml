[translation]
13390-1 = "Эпизод 39;Снятие Всех Ограничений"
13390-2 = "Хошино!"
13390-3 = "Хошино!"
13390-4 = "Хошино!"
13390-5 = "Хошино...!"
13390-7 = "...Ты действительно вернулась. Как...?"
13390-8 = ""
13390-10 = ""
13390-11 = ""
13390-12 = "Широко. Серика. Нономи. Аяне... и Широко..."
13390-13 = ""
13390-15 = ""
13390-16 = "Глава Дисципли— Нет, Хина..."
13390-17 = "Воссоединяться будете потом."
13390-18 = ""
13390-22 = ""
13390-23 = ""
13390-24 = "А. Точно-точно. Сначала разберёмся вон с той штукой."
13390-25 = ""
13390-28 = "Самая финальная, финальная, ФИНАЛЬНАЯ битва!! Сенсей [USERNAME]!"
13390-29 = "Вы сорвали мои планы своим трусливым жульничеством, но больше этого не будет!"
13390-30 = "Я раскрою пятую стратегию здесь и сейчас!"
13390-31 = "Скрытая стратегия! «На жульничество отвечай жульничеством»."
13390-32 = "Хи-хи! Хи-хи-хи!!"
13390-33 = "Мой анализ наконец завершён! Я обнажу каждую слабость вашей системы, всю суть вашей так называемой силы! Я раскрыл ваши грязные жульнические приёмы!"
13390-34 = "Именно! Я раскрыл их все до единого! У вашей штуковины есть пределы! Ведь так?!"
13390-35 = "Количество людей, которыми вы можете командовать, ограничено... четыре плюс два..."
13390-36 = "...Шесть! Максимум вы можете вывести шесть боевых единиц, Сенсей! Всё сверх этого вам неподвластно!"
13390-37 = "Да? Верно? ДА-А-А?! Славным методом индукции, собрав каждый клочок информации, который я хитро выведал... я вскрыл вашу слабость!"
13390-38 = "Значит... Небесному Пантеону моего мира нужно лишь превзойти это число. И тогда наконец победа будет моей!"
13390-39 = "Шесть? Жалкие шесть? Хи-хи-хи! Я легко это превзойду! Даже все вы вместе не сможете призвать силу, способную победить меня!"
13390-40 = "Жалкая мощь вашей системы меркнет перед Яростью Сета! Вкусите поражение! Насладитесь своей ничтожностью!"
13390-41 = "Я пережульничаю вас, перехитрю, превзойду! Я одержу верх во всём—"
13390-42 = ""
13390-45 = ""
13390-46 = "[ns1] «Спасибо, что подождали.»\n[ns2] «Теперь моя очередь?»"
13390-49 = "Да! Плана нашла процесс, запертый глубоко внутри Ковчега Шиттим."
13390-50 = "Плана!"
13390-51 = "Пояснение. Обычно запустить этот процесс невозможно. Однако сейчас внутри Ковчега Шиттим находятся две операционные системы: Арона и я."
13390-52 = "Ресурс не бесконечен, но мы можем выдавать мощность на более высоком уровне."
13390-53 = "Жду ваших приказов, Сенсей."
13390-54 = ""
13390-56 = ""
13390-57 = "[ns] «Покажем им наш новый навык.»"
13390-59 = "Подтверждено."
13390-60 = "Операция «Перец-Узза» начата. Выполняется Снятие Всех Ограничений Ковчега Шиттим."
13390-61 = ""
13390-65 = "Проверка завершена."
13390-66 = "Процесс соединения подтверждён. Спасибо, Сенсей."
13390-67 = "Ограничения Ковчега Шиттим сняты. Процесс «Перец-Узза». Выполняется ограниченный режим."
13390-68 = "Ожидаю. Отдавайте команды, Сенсей."
13390-69 = "Я вдвое сильнее обычного. Чувствую себя непобедимой."
13390-70 = "Я объединю свою силу с силой Ароны, чтобы поддержать вас, Сенсей."
13390-71 = ""
13390-74 = "...?!"
13390-75 = "Что вы сказали...?"
13390-76 = "Вы изменили систему...?"
13390-77 = "Вы сняли... текущие ограничения системы?"
13390-78 = ""
13390-81 = "[ns3] «С тебя хватит.»\n[ns4] «Я больше не позволю никому здесь умереть.»"
13390-86 = ""
13390-90 = "[ns] «Я больше не позволю ни одному человеку из Абидоса страдать.»"
13390-94 = "Ч-Что это за... нелепость?"
13390-95 = "Какое отношение этот бред... имеет к нашему бою? Это не поможет вам победить... ЧТО ВЫ НЕСЁТЕ?!"
13390-96 = "[ns] «Если ребёнок страдает и в моих силах ему помочь...»"
13390-98 = "[ns] Если у этого ребёнка есть желание, а у меня есть сила его исполнить..."
13390-100 = "[ns5] «Тогда это всегда будет...»\n[ns6] Тогда это всегда будет..."
13390-103 = "[ns7] «...обязанностью взрослых, которые делят этот мир с детьми.»\n[ns8] ...обязанностью взрослых, которые делят этот мир с детьми."
13390-106 = "[ns9] «И никак иначе.»\n[ns10] И никак иначе."
13390-110 = "[ns11] Достать кредитную карту.\n[ns12] Достать кредитную карту."
13390-113 = "Что это, чёрт возьми, такое?!"
13390-114 = "Что..."
13390-115 = "...это..."
13390-116 = "...может быть...?"
13390-117 = "Ч-Что-о-о?"
13390-118 = "Кредитная карта?! П-Плати, чтобы победить, в МОЕЙ кампании?!"
13390-119 = "Э-Э-Это... бессмыслица..."
13390-120 = "А как же кодекс?! Правила?!"
13390-121 = "М-Моя победа...?! Я имею в виду... матч!"
13390-122 = "Что?! Это, это, это, это, это нарушение правил...! Жульничество!"
13390-123 = "Э-Это немыслимо! Запрещено!! Игра не должна быть непроходимой...! А? Гах?!"
13390-124 = "Как мне победить такое? Ж-Ж-Ж-Жулик! Жульничество!"
13390-125 = "Жульничество, жульничество, жульничество, ЖУЛЬНИЧЕСТВО!"
13390-126 = "ЖУЛЬНИЧЕСТВО!!"
13390-127 = "ОБМАНЩИК!"
13390-128 = "Нет-нет-нет-нет-нет... Это не считается... Не считается!"
13390-129 = "Недействительно—"
13390-130 = "Принудительное соединение установлено."
13390-131 = "Что?!?!"
13390-132 = "Передаю сообщение Сенсея. Подземный житель. Слушай внимательно."
13390-133 = ""
13390-135 = ""
13390-136 = ""
13390-137 = "[ns13] «Такого сопляка, как ты, который способен определять жизнь только через победу и поражение...»\n[ns14] «...взрослый должен как следует отругать.»"
13390-140 = "Ч-Ч-Ч-Что...?!"
13390-142 = "Перевод: Сенсею незачем тратить время на «сопляка», который так и не смог повзрослеть."
13390-143 = "...!!"
13390-144 = ""
13390-147 = "Сенсей — взрослый. Он слишком занят для тебя. Более того, вчера Сенсей вообще не спал всю ночь."
13390-148 = "(Плана... иногда страшная...)"
