[translation]
41120-1 = "Эпизод 12;Промокшие от дождя купюры"
41120-2 = "Приёмная Генерального Студенческого Совета"
41120-5 = ""
41120-6 = "Заявка? Для чего она?"
41120-7 = "[s] «Просто взгляни на неё.»"
41120-8 = "Хм… Заявка на ремонт и обслуживание объектов в парке Коусаги, пострадавших от затопления…"
41120-9 = "Сама по себе задача несложная."
41120-10 = "Но как это относится к деятельности Шале?"
41120-11 = "[s] «Ну, строго говоря, это не совсем…»"
41120-12 = "Тогда скажите. Это как-то связано со студентами Академии SRT?"
41120-13 = ""
41120-16 = "…Ваше молчание говорит само за себя."
41120-17 = "Я прочитала рапорт главы Оборонного Комитета. Ученицы Академии SRT поселились в том же парке, где устроили акцию протеста. И Вы присматриваете за ними."
41120-18 = "Сложная ситуация. Но не мне критиковать Вас, Сенсей. Шале устроено так, что я не смогла бы этого сделать, даже если бы захотела."
41120-19 = "Поэтому я просто выскажу своё мнение. Тот факт, что студенты живут в парке, крайне неприятен."
41120-20 = "[s] «Потому что они заняли парк, предназначенный для жителей?»"
41120-21 = "Вряд ли. Это удалённый парк, в котором редко бывают посетители."
41120-22 = "Рано или поздно его всё равно бы снесли."
41120-23 = "Однако..."
41120-24 = ""
41120-26 = ""
41120-27 = ""
41120-29 = "В своё время Президент Генерального Студенческого Совета предоставила Академии SRT особый иммунитет, чтобы максимизировать их эффективность."
41120-30 = "Однако привилегии должны предоставляться только тогда, когда это необходимо. Без цели привилегия - это угроза."
41120-31 = "Вы уже прекрасно знаете, как большинство членов Генерального Студенческого Совета воспринимает Академию SRT. Они боятся их."
41120-32 = "И теперь Вы хотите предоставить жильё и оружие студентам, которые, чисто технически, всё ещё протестуют?"
41120-33 = "Представьте, какой хаос начнётся, если Административный Комитет узнает об этом."
41120-34 = "[s] «Разве ты ничего не можешь сделать, Рин?»"
41120-35 = ""
41120-37 = ""
41120-38 = "Нет. Ничего."
41120-40 = "Я встретился с каждым главой комитета, чтобы заручиться поддержкой."
41120-41 = "Но в ответ слышал лишь категорическое \"нет\"."
41120-42 = ""
41120-44 = "Офис Главы Оборонного Комитета"
41120-46 = "…И вот в конце концов Вы оказались здесь."
41120-47 = ""
41120-49 = ""
41120-50 = "Вы были очень заняты, Сенсей. Не желаете чаю?"
41120-51 = "Нет?"
41120-52 = "Полагаю, Вашу спешку не унять простыми любезностями."
41120-53 = ""
41120-55 = ""
41120-56 = "Тогда сразу к делу. Боюсь, я тоже ничем не смогу Вам помочь."
41120-57 = "Неважно, что говорят эти студенты, Академии SRT больше не существует."
41120-58 = "Как бы я ни пыталась найти лазейку, использовать бюджет Генерального Студенческого Совета для студентов несуществующей академии просто невозможно."
41120-59 = "Я пыталась профинансировать ремонт парка под этим предлогом, но тоже ничего не вышло - план по перепланировке района уже утверждён."
41120-60 = "Боюсь, предела моих полномочий хватает лишь на то, чтобы сохранить личные дела студентов и не допустить удаления их данных."
41120-61 = "Мне очень жаль. Хотелось бы порадовать Вас ответом."
41120-62 = "[s1] «Ты и так уже многое сделала, Кая.»\n[s2] «Так или иначе, я что-нибудь придумаю.»"
41120-63 = ""
41120-64 = ""
41120-66 = ""
41120-67 = "...Сенсей."
41120-68 = "Вам понравилось проводить время с ученицами Отряда RABBIT?"
41120-69 = "[s] «Они мне очень дороги.»"
41120-70 = "Рада слышать это."
41120-71 = ""
41120-73 = ""
41120-74 = ""
41120-76 = "Прошу, продолжайте присматривать за ними точно так же, как и раньше."
41120-80 = ""
41120-81 = "Уф."
41120-82 = "[s] «В тот раз, у Полицейской школы Валькирии…»"
41120-83 = "Какое совпадение. Приветствую, Сенсей."
41120-84 = "Вы к главе штаба?"
41120-85 = "[s] «Да. Ты тоже?»"
41120-86 = "О... Ну..."
41120-87 = "Вроде того. Личное дело."
41120-88 = ""
41120-90 = ""
41120-91 = "Думаю, мы ещё увидимся, Сенсей."
41120-92 = ""
41120-94 = ""
41120-98 = ""
41120-99 = "Добро пожаловать, директор Бюро Общественного Правопорядка. Я рада, что ты смогла прийти."
41120-100 = ""
41120-102 = ""
41120-103 = "У тебя такой вид, будто тебя ведут на плаху. Канна, не переживай."
41120-104 = "Я просто хотела получить отчёт о моей последней просьбе."
41120-105 = ""
41120-107 = ""
41120-108 = "ССкажи мне, Канна. Каковы успехи в восстановлении Города Коусаги?"
41120-109 = "Ну… По крайней мере, приготовления завершены. Но в заброшенных зданиях сидит группа упрямых хиппи."
41120-110 = "Мы не можем заставить их освободить здания, что приводит к задержкам при сносе."
41120-111 = "Что?"
41120-112 = ""
41120-114 = ""
41120-115 = "Директор Бюро Общественного Правопорядка, возможно, ты оговорилась?"
41120-116 = "Добросовестная Полицейская Школа Валькирия, защитники Кивотоса и хранители порядка."
41120-117 = "Надеюсь, ты очень хорошо подумаешь, прежде чем давать ответ на мой следующий вопрос. Ты хочешь сказать, что элита из элит твоей школы не обладает должной компетенцией, чтобы справиться с горсткой хиппи?"
41120-118 = "М-мэм. Это не обычные бездомные. Мы не знаем, как и где они раздобыли его, но они вооружены до зубов по последнему слову техники!"
41120-119 = "Оно превосходит наше снаряжение для подавления беспорядков, и мы не смогли получить стратегическое преимущество."
41120-120 = "Плюс, эти студенты SRT, которым Вы помогли, засели в парке неподалёку, что ещё больше затрудняет передвижение."
41120-121 = "Полагаю, я просила тебя тщательно обдумать ответ. Ты обвиняешь меня?"
41120-122 = "Н-нет, прошу прощения, глава штаба."
41120-123 = ""
41120-125 = ""
41120-126 = ""
41120-128 = ""
41120-130 = "Видишь ли, Канна. Мне нравятся люди, которые могут взять на себя ответственность."
41120-131 = "Я на своей должности главы Оборонного Комитета, ты - в качестве директора… Нам нужно нести ответственность за исполнение своих обязанностей."
41120-132 = "То, что я слышу от тебя сейчас, Директор, - это самоуверенная чушь. Это пренебрежение своими обязанностями. А я ненавижу такое."
41120-133 = "А когда люди говорят то, что я ненавижу, они оказываются там же, где и студенты SRT."
41120-135 = "*глоть*"
41120-136 = "Хи-хи. Ох, Канна. Это просто шутка. Но раз уж ты так мучаешься с моей просьбой, дай я дам совет."
41120-137 = "Ты знакома с притчей о Трёх Стрелах?"
41120-138 = "Одна стрела переломится, словно хрупкая кость. Но связку стрел сломать уже не так-то просто."
41120-139 = "И что же делать, если ты столкнёшься с проблемой, с которой не в состоянии справиться хрупкое Бюро Общественного Правопорядка? Просто привлеки больше людей."
41120-140 = "Ты хочешь сказать?.."
41120-141 = "Если ты не можешь понять, о чём я, я найду кого-то менее бестолкового."
41120-142 = "Д-да, мэм."
41120-143 = "Прекрасненько. С нетерпением жду твоего отчёта."
41120-144 = ""
41120-146 = ""
41120-147 = ""
41120-148 = "Ух. Почему каждый, с кем мне приходится работать, абсолютно некомпетентен?"
41120-149 = "Должно быть, я совершила что-то ужасное в прошлой жизни, раз получила такое наказание."
41120-150 = ""
41120-151 = "Надеюсь, мы не входим в их число."
41120-152 = "Ой, не глупи. Ты - лучший партнёр в моей жизни. ♡"
41120-153 = "Должна признать, я не ожидала, что Отряд RABBIT и Сенсей так быстро подружатся."
41120-154 = "Эффект получился совершенно противоположным тому, на который я рассчитывала."
41120-155 = "Как эксперт, что ты думаешь по этому поводу?"
41120-156 = ""
41120-157 = "Неожиданно, но не удивительно."
41120-158 = "Ха-ха. Скучный ответ, как и всегда."
41120-159 = ""
41120-161 = ""
41120-162 = ""
41120-163 = "Мы будем внимательно следить за ними."
41120-165 = "Следующий эпизод;Лисы и Инари-суши"
