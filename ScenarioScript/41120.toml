[translation]
41120-1 = "Episódio 12;Fatura Encharcada de Chuva"
41120-2 = "Conselho Estudantil Geral - Sala de Recepção"
41120-6 = "...O que é isso?"
41120-7 = "[s] \"Desculpa atrapalhar enquanto você está ocupada, mas queria que desse uma olhada nisso, Rin...\""
41120-8 = "\"Proposta de reparo de instalações no 'Parque Kousagi' atingido por alagamento\"..."
41120-9 = "...Não tenho nenhuma objeção, em si, a reparar um parque usado pelos cidadãos, mas..."
41120-10 = "Isso é necessário para as atividades da Schale?"
41120-11 = "[s] \"Não é bem isso, mas...\""
41120-12 = "Então... quer dizer que é necessário para as alunas da SRT?"
41120-16 = "...Ficar em silêncio é a resposta certa."
41120-17 = "Ouvi falar disso pela Kaya. As alunas da Academia Especial SRT que recusaram a transferência para a Valkyrie... estão acampando no parque, e o Sensei as está apoiando nos bastidores."
41120-18 = "Não pretendo criticar isso. Afinal, a Schale é uma organização independente..."
41120-19 = "Porém, falando da minha posição, não posso aprovar que elas continuem naquele parque."
41120-20 = "[s] \"...Por estarem ocupando um parque que deveria ser de uso público?\""
41120-21 = "Não. Aquele parque fica em uma área remota que quase ninguém frequenta."
41120-22 = "Na verdade, já estava nos planos demolir aquele parque em breve."
41120-23 = "Mas, independentemente disso..."
41120-29 = "...De fato, a SRT é uma organização especial que recebeu privilégios da Presidente do Conselho Estudantil Geral para neutralizar criminosos com rapidez."
41120-30 = "Contudo, tais privilégios só têm valor quando usados com o propósito certo e da maneira correta. Caso contrário, apenas trazem perigo."
41120-31 = "...Como o Sensei bem sabe, não são poucos os membros dentro do Conselho Estudantil Geral que temem o poder bélico da SRT."
41120-32 = "Nesse cenário, se fizermos qualquer movimento para apoiá-las..."
41120-33 = "Haverá uma forte reação por parte do Comitê Administrativo."
41120-34 = "[s] \"Você não poderia convencê-los, Rin...?\""
41120-38 = "Não vou."
41120-40 = "Depois disso, tentei falar com outros membros do Conselho Estudantil Geral para pedir ajuda, mas..."
41120-41 = "...Quase ninguém quis sequer me ouvir."
41120-44 = "Gabinete de Defesa - Escritório"
41120-46 = "...Entendo, então foi por isso que veio até aqui."
41120-50 = "De qualquer forma, bom trabalho. Aceita um chá?"
41120-51 = "...Hihi. Pelo visto, não está com tempo para isso."
41120-52 = "Não, eu sei perfeitamente o quanto a Schale é ocupada... Embora eu adorasse poder conversar com mais calma."
41120-56 = "Indo direto ao ponto... sinto muito, mas receio que eu também não poderei ajudar."
41120-57 = "Oficialmente, a Academia Especial SRT já é uma escola fechada..."
41120-58 = "Independentemente do pretexto, na prática ficaria configurado que \"o Conselho Estudantil Geral está oferecendo apoio direto a alunas de uma academia inexistente\". Isso seria bem difícil."
41120-59 = "Pensei se não poderíamos dar um jeito usando o parque como pretexto... mas parece igualmente inviável. Afinal, aquela área já estava marcada para revitalização..."
41120-60 = "Tudo o que posso fazer, como lhe disse antes, é manter os registros escolares delas intactos..."
41120-61 = "Sinto muito por não poder ser útil."
41120-62 = "[s1] \"Imagina. Eu é que peço desculpas por tomar seu tempo.\"\n[s2] \"Só isso já ajuda muito, obrigado.\""
41120-67 = "...Sensei."
41120-68 = "Está sendo divertido passar seus dias com elas?"
41120-69 = "[s] Acenar com a cabeça."
41120-70 = "Que maravilha."
41120-76 = "Então, continuo deixando o Esquadrão RABBIT aos seus cuidados."
41120-81 = "Ah..."
41120-82 = "[s] \"Quanto tempo.\""
41120-83 = "...Que coincidência nos encontrarmos de novo."
41120-84 = "O Sensei também tinha assuntos com a Chefe do Gabinete de Defesa?"
41120-85 = "[s] \"Sim, e você, Kanna?\""
41120-86 = "Eu, bem..."
41120-87 = "Digamos que é um assunto pessoal..."
41120-91 = "Desculpe por tomar seu tempo. Até mais."
41120-99 = "Bom trabalho. Eu estava esperando por você."
41120-103 = "Kanna, não precisa ficar tão tensa. Não a chamei aqui para atormentá-la."
41120-104 = "É apenas uma verificação de progresso."
41120-108 = "Então, como anda a construção de \"Kousagi Town\"?"
41120-109 = "Acontece que há muitas pessoas acampando nas redondezas..."
41120-110 = "E a demolição dos prédios está um pouco atrasada..."
41120-111 = "...Como é?"
41120-115 = "Isso significa, então, o seguinte?"
41120-116 = "A Academia de Polícia Valkyrie, responsável pela segurança de Kivotos..."
41120-117 = "Sua elite, o Departamento de Segurança Interna, está tendo dificuldade para despejar uns andarilhos?"
41120-118 = "M-Mas acontece que eles estão equipados com um armamento pesado fora do comum...!"
41120-119 = "Com o nosso equipamento, estamos tendo dificuldade para fazer frente..."
41120-120 = "Além disso, aquelas alunas da SRT também continuam no parque..."
41120-121 = "Ora, está dizendo que a culpa é minha?"
41120-122 = "P-Perdão! Jamais diria algo assim...!"
41120-130 = "Kanna, eu adoro pessoas com senso de responsabilidade."
41120-131 = "Eu cumpro com a minha responsabilidade, e você cumpre com a sua."
41120-132 = "Se por acaso você acabar negligenciando essa responsabilidade..."
41120-133 = "Mesmo que acabe tendo o mesmo destino da SRT, não poderei fazer nada por você, entendeu?"
41120-135 = "..."
41120-136 = "Hihi, então deixe-me lhe dar um conselho."
41120-137 = "Kanna, você conhece a parábola das \"Três Flechas\"?"
41120-138 = "Uma única flecha se quebra facilmente. Mas, juntas em feixe, não se quebram com tanta facilidade."
41120-139 = "Se está difícil apenas com o Departamento de Segurança Interna, por que não chama \"pessoas com interesses em comum\"?"
41120-140 = "Isso quer dizer..."
41120-141 = "Ora, é muito mais \"elegante\" não dizer esse tipo de coisa até o fim."
41120-142 = "S-Sim..."
41120-143 = "Pois bem, espero notícias melhores da próxima vez."
41120-148 = "Ah... Francamente, é tão triste ter tão poucas pessoas capazes de agir direito."
41120-149 = "Parece que nunca tenho sorte com as pessoas..."
41120-151 = "...Desculpe se não estou sendo útil."
41120-152 = "Não, não, não estou falando de você. Pelo contrário, você é a minha melhor parceira♡"
41120-153 = "Pois bem... Jamais imaginei que o Esquadrão RABBIT e o Sensei da Schale ficariam tão próximos assim."
41120-154 = "Achei que acabariam se machucando e se afastando naturalmente..."
41120-155 = "Como \"especialista\", o que você acha dessa situação?"
41120-157 = "Fugiu das previsões, mas... não deveria ser nada surpreendente."
41120-158 = "Hihi... Uma resposta sem graça como sempre — bem a sua cara."
41120-163 = "...Preciso observar um pouco mais de perto."
41120-165 = "Próximo;Oinari-san"
