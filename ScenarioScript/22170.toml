[translation]
22170-1 = "Episódio 17;O Trampolim para a Virada"
22170-3 = "Chihiro-senpai?!"
22170-4 = "Buááá! Vice-presidente!"
22170-5 = "Como esperado. Estávamos esperando por você."
22170-6 = "Mas... como?"
22170-8 = "Pois é! Afinal, a rede de comunicações de Eridu...!"
22170-9 = "Não estava sob o controle da Presidente Rio?"
22170-11 = "Sim, a Presidente Rio controla tudo.#nMas parece que a Himari deixou uma \"arma secreta\" preparada para uma situação assim."
22170-12 = "[s] \"Uma arma secreta...?\""
22170-13 = "Ah... mana! É aquilo! Aquilo lá!"
22170-14 = "A-Aquilo o quê?!"
22170-15 = "Aquela coisa que a gente encontrou antes, quando tentou analisar a G.Bible!"
22170-24 = "[ns] \"O 'Espelho'...!\""
22170-25 = "Na mosca. Isso mesmo, usamos o \"Espelho\" para hackear a rede de Eridu."
22170-26 = "De quebra, também colocamos a Presidente para fora."
22170-27 = "Hã, c-como assim?! Não me diga que o motivo de a presidente Himari ter deixado o Conselho Estudantil confiscar o \"Espelho\"...!"
22170-28 = "Foi justamente para se preparar para um caso assim?"
22170-29 = "Como esperado da ex-presidente da Veritas. Não dá para subestimá-la."
22170-30 = "[s] \"Mandou bem, Chihiro! A deusa da Veritas!\""
22170-31 = "D-Deusa...? Sensei... aí já é exagero demais."
22170-33 = "Ué?! M-Mas ir até o depósito de itens confiscados é super difícil, né?!"
22170-34 = "Sozinha seria impossível..."
22170-35 = "Ah, quanto a isso, tive ajuda de alguém."
22170-36 = "De um clube que, por sorte, escapou da vigilância da Presidente—"
22170-40 = "Olá, Treinador."
22170-41 = "[s] \"Sumire?!\""
22170-42 = "Ao saber o que aconteceu com a Aris-san, não consegui ficar parada...#nTomei a liberdade de oferecer minha ajuda."
22170-43 = "Sim, você me ajudou demais. Obrigada."
22170-48 = "...Enfim, é isso. No momento, estamos no meio de uma bela luta contra os drones."
22170-49 = "Sinceramente, não sei quanto tempo vamos aguentar...#nMas bom, vou fazer tudo o que puder."
22170-50 = "Se for uma batalha de resistência, pode deixar comigo."
22170-51 = "[s] \"Obrigado, Sumire. Dá até um alívio saber que podemos contar com você.\""
22170-61 = "Como eu temia...#nMesmo usando o \"Espelho\", o firewall está reagindo."
22170-62 = "Precisamos agir rápido antes que a conexão caia."
22170-63 = "É nessas horas que entra a \"Veritas\" — a nossa vez de brilhar."
22170-64 = "Pode deixar com a gente, vice-presidente."
22170-65 = "Mesmo que a gente precise gastar todos os nossos recursos!#nNós vamos manter a rede de pé!"
22170-66 = "Sim, daremos o nosso máximo."
22170-68 = "Certo. Deixo a manutenção com vocês.#nEm troca, daqui em diante, eu assumo a navegação para o Sensei."
22170-69 = "Pessoal — vocês ainda conseguem lutar, né?"
22170-73 = "[ns] \"Sim, vamos nessa.\""
22170-75 = "Então vamos começar o contra-ataque. Lá vamos nós!"
