[translation]
22170-1 = "Эпизод 17; Переломить ход битвы"
22170-2 = ""
22170-3 = "Чихиро!"
22170-4 = "Ааа! Вице-президент!"
22170-5 = "Мы вас ждали, вице-президент."
22170-6 = "Как вы...?"
22170-8 = "О, точно! Я думала, связь с сетью Эриду...!"
22170-9 = "Я думала, Рио сумела нас вышвырнуть!"
22170-11 = "Так и было, но Химари кое-что подготовила на такой случай."
22170-12 = "[s] «Химари?»"
22170-13 = "О... Точно! Момои!"
22170-14 = "Ч-Что ты имеешь в виду, Мидори?!"
22170-15 = "Та штука, которую мы нашли для расшифровки Г.БИБЛИИ!"
22170-16 = ""
22170-19 = ""
22170-21 = ""
22170-22 = ""
22170-23 = ""
22170-24 = "[ns] «Зеркало!»"
22170-25 = "Да. С помощью Зеркала я взломала и захватила зашифрованную сеть Эриду."
22170-26 = "И заодно вышвырнула оттуда президента."
22170-27 = "Ч-Ч-Что?! Значит, Химари приказала Студсовету конфисковать Зеркало именно потому...!"
22170-28 = "Чтобы подготовиться к такому дню?"
22170-29 = "Бывшую президента Веритас нельзя недооценивать."
22170-30 = "[s] «Потрясающе, Чихиро! Ты богиня Веритас!»"
22170-31 = "Б-Богиня... это уже слишком, Сенсей."
22170-33 = "А?! Н-Но разве попасть на склад контрабанды было не трудно?!"
22170-34 = "Как вы туда проникли? Это же невозможно."
22170-35 = "О, мне кое-кто помог."
22170-36 = "Та, кто смог ускользнуть от наблюдения Рио благодаря своим врождённым способностям..."
22170-37 = ""
22170-39 = ""
22170-40 = "Здравствуйте, Тренер."
22170-41 = "[s] «Сумире?!»"
22170-42 = "Узнав об Алисе, я не могла просто сидеть сложа руки, поэтому решила помочь."
22170-43 = "Да. Если бы не ты..."
22170-44 = ""
22170-46 = ""
22170-47 = ""
22170-48 = "...Но сейчас на складе контрабанды идёт бой с дронами."
22170-49 = "Не знаю, сколько мы ещё продержимся."
22170-50 = "Не беспокойтесь. Я уверена в своей выносливости."
22170-51 = "[s] «Я верю в тебя, Сумире!»"
22170-52 = ""
22170-54 = ""
22170-55 = ""
22170-56 = ""
22170-57 = ""
22170-61 = "Пожалуй, этого стоило ожидать... Мы использовали Зеркало, но файрволл сразу отреагировал."
22170-62 = "Пока нас не отрезали на подступах, нужно перехватить инициативу."
22170-63 = "Веритас, теперь наш ход."
22170-64 = "Хорошо, предоставьте это мне, вице-президент."
22170-65 = "Даже если придётся использовать все ресурсы, мы идеально удержим сеть!"
22170-66 = "Да. Можете на нас рассчитывать."
22170-68 = "Хорошо, оставляю это вам. Я займусь навигацией."
22170-69 = "Все ещё способны сражаться?"
22170-70 = ""
22170-72 = ""
22170-73 = "[ns] «Да!»"
22170-75 = "Тогда пора переходить в контратаку."
