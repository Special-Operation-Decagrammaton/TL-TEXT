[translation]
10017005-1 = "Пролог;Рождество в Кивотосе!"
10017005-9 = "Медпункт Тринити"
10017005-10 = "Цветущие цветы весной, сияющее солнце летом, опавшие листья осенью и..."
10017005-11 = "Снег зимой!"
10017005-12 = "Конечно, и это тоже, но что ещё?"
10017005-13 = "Белое Рождество!"
10017005-14 = "Рождество?"
10017005-15 = "Рождество!"
10017005-16 = "Украшать ёлки!"
10017005-17 = "Петь рождественские гимны!"
10017005-18 = "Готовить подарки!"
10017005-19 = "Ждать Санта-Клауса!"
10017005-20 = ""
10017005-21 = "Ура!"
10017005-22 = "[ns] «Все такие воодушевлённые.»"
10017005-23 = "Ну да! Ведь Рождество!"
10017005-24 = "Хахаха, это правда. Но нельзя слишком увлекаться весельем."
10017005-25 = "Я не забыла, зачем мы здесь! Для этого и нужен костюм Санты!"
10017005-26 = "Как всегда полна энтузиазма, Ханаэ..."
10017005-27 = "Ч-что думаете, Сенсей? Этот костюм на мне не выглядит странно или как-нибудь ещё, правда?"
10017005-28 = "[s1] «Тебе очень идёт, Сэрина.»\n[s2] «Очень... традиционно.»"
10017005-31 = "А я? А я как, Сенсей?!"
10017005-32 = "[s3] «Ты очень милая, Ханаэ.»\n[s4] «Ты выглядишь полной энергии.»"
10017005-35 = "Ура! Твои утренние старания не пропали даром, Сэрина!"
10017005-36 = "Х-Ханаэ! Н-не нужно сейчас об этом говорить..."
10017005-37 = "[s] «Значит, Рыцари скорой помощи отмечают Рождество.»"
10017005-38 = "Конечно, Сенсей! Рождество очень важно для Рыцарей скорой помощи!"
10017005-39 = "Рыцари скорой помощи ценят самые разные праздники. И Рождество не исключение."
10017005-41 = "Ну-ну, достаточно."
10017005-43 = ""
10017005-46 = ""
10017005-47 = "Для Рыцарей скорой помощи Рождество — не день развлечений."
10017005-48 = "Напротив, в этот священный день мы ищем, где наша помощь нужнее всего..."
10017005-49 = "...и со смирением размышляем о прошлом."
10017005-50 = "[s] «И... как Рыцари скорой помощи всё это делают?»"
10017005-51 = "Проще говоря, мы занимаемся благотворительностью, Сенсей."
10017005-52 = "Мы поставим в городе ящик для пожертвований и будем просить прохожих жертвовать деньги!"
10017005-53 = "Мы будем петь гимны и раздавать перчатки и шапки, которые связали сами!"
10017005-54 = "Сэрина замечательно поёт! Вам понравятся её рождественские песни, Сенсей!"
10017005-55 = "Х-Ханаэ, ты меня смущаешь..."
10017005-56 = ""
10017005-58 = ""
10017005-59 = ""
10017005-61 = "[ns5] «Вот почему вы попросили о помощи.»\n[ns6] «Теперь я понимаю, что Рождество значит для Рыцарей скорой помощи.»"
10017005-65 = "Сэрина, Ханаэ. Рада видеть, что вы обе полны сил."
10017005-66 = "Сенсей, ещё раз спасибо, что доставили себе хлопоты ради нас."
10017005-67 = "[s7] «Такое полезное дело не может быть хлопотным!»\n[s8] «Я просто хочу услышать, как Сэрина и Ханаэ поют!»"
10017005-70 = "Раз вы все так воодушевлены, тогда идите вперёд."
10017005-71 = "А я ещё раз обойду Тринити перед тем, как присоединиться к вам."
10017005-73 = "Да, капитан."
10017005-74 = "Хорошо!"
