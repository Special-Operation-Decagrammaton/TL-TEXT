[translation]
2001405-1 = "Экономность"
2001405-2 = ""
2001405-3 = "[s] «Ты в хорошем настроении.»"
2001405-4 = "Сенсей!"
2001405-5 = "Да, вы правы!"
2001405-6 = "Сегодня утром я нашла на барахолке невероятно выгодную вещь."
2001405-7 = "Это..."
2001405-8 = "37-мм миномёт-лопата!"
2001405-9 = "[s] «...Что-что?»"
2001405-10 = "А, наверное, вы раньше такого не видели."
2001405-11 = "Неудивительно. Это очень редкая вещь, и почти все записи о её производстве утрачены."
2001405-12 = "Какой-то чудак из Академии Красной Зимы когда-то давно сделал такую! И смотрите: она ещё и служит сапёрной лопатой!"
2001405-13 = "Смотрите, ствол можно держать как рукоять лопаты! А если взять вот здесь... вуаля! Теперь это миномёт!"
2001405-14 = "Это же так изобретательно! Потрясающая многофункциональность!"
2001405-15 = "Один предмет снаряжения подходит и для ближнего, и для дальнего боя!"
2001405-16 = "Не понимаю, почему они перестали выпускать такую крутую штуку."
2001405-17 = "[s] «Может, она не настолько полезна, как кажется?»"
2001405-18 = "А? Да ни за что."
2001405-19 = "Сапёрная лопата и миномёт — оба важнейшие элементы снаряжения! Этого просто не понимают заносчивые начальники, которые ни разу сами не рыли окоп."
2001405-20 = "Наверное, этот миномёт выбросил какой-нибудь высокопоставленный чиновник, не понимавший его ценности в пехотном бою."
2001405-21 = "Но я докажу, чего он на самом деле стоит."
2001405-22 = "[s] «Он весь ржавый.»"
2001405-23 = "Это нормально. Продавец сказал, что он десятилетиями пылился на складе."
2001405-24 = "Но восстановить его будет проще простого. Конструкция довольно простая."
2001405-25 = "Никогда не бросай снаряжение, которое можно починить чисткой, подтяжкой и смазкой!"
2001405-26 = "Хорошо, Сенсей. Давайте отремонтируем этот миномёт!"
2001405-27 = "[s] «Я постараюсь.»"
2001405-30 = "― ...Ух, ух![wa:470]"
2001405-33 = "― ...Хмф.[wa:10]"
2001405-35 = "― Как туго. Вообще не двигается.[wa:860]"
2001405-38 = "― Нужно больше смазки...[wa:840]"
2001405-40 = "― Сенсей, можете передать мне смазочное масло вон там?[wa:1270]"
2001405-43 = "[ns] Передать ей смазочное масло."
2001405-44 = "― Ого, теперь двигается отлично![wa:160]"
2001405-47 = "― Ах... Обожаю счищать ржавчину.[wa:1680]"
2001405-49 = "― Как же приятно.[wa:480]"
2001405-52 = "― Вас смущают движения моих рук?[wa:1950]"
2001405-55 = "― Ч-Что?![wa:340]"
2001405-58 = "― Это священный процесс обслуживания ствола![wa:10]"
2001405-60 = "― О чём вы вообще думаете, идиот![wa:10]"
2001405-63 = "Готово!"
2001405-64 = "Посмотрите на этот блестящий ствол и лезвие лопаты. Какая красота."
2001405-65 = "Нельзя отрицать классическое очарование старого оружия."
2001405-66 = "Хорошо, давайте сделаем пробный выстрел!"
2001405-67 = "Навести ствол на цель... зарядить снаряд..."
2001405-68 = "Огонь!"
2001405-69 = ""
2001405-72 = "..."
2001405-73 = "Что это было? Осечка?"
2001405-74 = "Наверное. Попробуем ещё раз."
2001405-75 = "Огонь!"
2001405-76 = ""
2001405-79 = ""
2001405-80 = "Неужели от 37-мм фугасного снаряда при таком стволе просто слишком многого требовать?"
2001405-81 = "Это даже шлем не пробьёт, не говоря уже о «Точке»..."
2001405-82 = "Ничего! Пусть мощность невелика, у этого миномёта всё равно есть преимущество — им можно копать."
2001405-83 = "Например, я легко передвину вот эту кучу земли!"
2001405-84 = ""
2001405-86 = ""
2001405-87 = ""
2001405-88 = "Очень... легко..."
2001405-89 = ""
2001405-91 = ""
2001405-92 = ""
2001405-93 = "Эта лопата ужасна. Толстый ствол мешает. И она ещё такая тяжёлая!"
2001405-94 = "Я лучше буду рыть окоп голыми руками, чем пользоваться этим!"
2001405-95 = "[s] «Похоже, есть причина, почему этим оружием никто не пользуется.»"
2001405-96 = "Н-Но это же такая редкая вещь."
2001405-97 = "Ей обязательно должно найтись применение!"
2001405-99 = "Саки ещё долго упрямо таскала с собой миномёт-лопату."
2001405-100 = "Но однажды миномёт нашли в ближайшем сарае, покрытым пылью."
