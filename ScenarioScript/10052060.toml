[translation]
10052060-1 = "Кетер, Лучезарнейшая Высшая Корона"
10052060-2 = "Мы вошли в зону влияния Кетер."
10052060-3 = "Я всё ещё не до конца понимаю, что это значит, но говорят, что символическое число этой Сефиры — «1»."
10052060-4 = "Ого... Потрясающе, Токи! Я не знала!"
10052060-5 = "Милая Арис, я получила эту информацию, изучив справочные материалы о пророке."
10052060-6 = "Какая ты внимательная, Токи!"
10052060-7 = "Разумеется. Я идеальная горничная и агент."
10052060-8 = "Хорошо!"
10052060-9 = ""
10052060-11 = ""
10052060-12 = ""
10052060-13 = ""
10052060-14 = ""
10052060-15 = "Сенсей, пожалуйста, руководите нами."
10052060-16 = "...Хотя Кетер мы встретили гораздо позже."
10052060-17 = "Вот что я хотела услышать."
10052060-18 = "[s] «Мы играли в догонялки.»"
10052060-19 = "Сигнал Кетер подтверждён. Она впереди."
10052060-20 = "[s] «И это был один из редких случаев, когда ты сама была на месте событий.»"
10052060-21 = "Она выглядит как крепость..."
10052060-22 = "Или как огромный арсенал."
10052060-23 = "В любом случае, попасть туда с земли будет сложно."
10052060-24 = "Значит, снова высадка сверху?"
10052060-25 = "Именно."
10052060-26 = "Юзу уже дрожит."
10052060-27 = "Э-Эйми?!"
10052060-28 = "Ты дрожишь."
10052060-29 = "Не переживай. Система высадки уже проверена."
10052060-30 = "Это не делает её менее страшной!"
10052060-31 = "И всё же это самый эффективный путь."
10052060-32 = "Так началась ещё одна возможность..."
10052060-33 = "...и вот мы оказались здесь."
10052060-34 = "Мне больно оттого, что я не смогла предвидеть такой исход и подготовиться."
10052060-35 = "...? Президент Химари. Вы что, без моего ведома обрели пророческие способности?"
10052060-36 = "Разумеется, нет. Хотя одна из причин, по которой я изучаю оккультизм, — исследование предвидения."
10052060-37 = "Но окончательного ответа в этой области я пока не нашла..."
10052060-38 = "Если так, почему вы пытаетесь брать на себя ответственность за результат, который физически не могли предвидеть?"
10052060-39 = "...!"
10052060-40 = "(Хорошо сказала, Токи.)"
10052060-41 = "Отлично, Токи."
10052060-42 = ""
10052060-44 = ""
10052060-45 = ""
10052060-46 = "Эм, я рада, что со всем разобрались, но..."
10052060-47 = "Нам обязательно... ПАДАТЬ?!"
10052060-48 = "Да. Это наиболее логичный вариант."
10052060-49 = "Именно. Базовая тактика."
10052060-50 = "Перекрёстный огонь Кетер слишком плотный, чтобы подбираться по земле."
10052060-51 = "Вы уже знакомы с системой высадки. Вашей безопасности ничего не угрожает."
10052060-52 = "В конце концов, это ведь не первая ваша десантная операция, верно?"
10052060-53 = "Это не аттракцион в парке развлечений! Мне страшно!"
10052060-54 = "Редко слышу от тебя столько эмоций. Значит, ты действительно боишься, Юзу."
10052060-55 = "Но разве десантные капсулы не проектировали с участием Отдела разработки игр?"
10052060-56 = "НО НЕ ДЛЯ МЕНЯ! Я ВООБЩЕ НЕ ДОЛЖНА БЫЛА В НИХ ЛЕТАТЬ!"
10052060-57 = "Все, пора спускаться. Залезай в капсулу, Юзу."
10052060-58 = "И-и-и?!"
10052060-59 = "Юзу, ты в порядке?"
10052060-60 = "Нет, нет, нам не обязательно—"
10052060-61 = "Десантной группе пройти к капсулам. Повторяю. Десантной группе пройти к капсулам."
10052060-62 = "Десантные капсулы готовы к запуску. ЗАЛЕЗАЙ В КАПСУЛУ, ЮЗУ."
10052060-63 = ""
10052060-65 = ""
10052060-69 = "Приступим."
10052060-70 = "Передовую оставьте мне."
10052060-72 = "Президент Химари, Момои. Пожалуйста, обеспечьте поддержку. Действуйте по обстановке."
10052060-73 = "И-и-и-и-и-и...!"
10052060-75 = "Сброс!"
10052060-77 = "Так... Мне просто нажать этот рычаг, да? Или скорее потянуть?"
10052060-78 = "Сестрёнка... умоляю, отнесись к этому серьёзно."
10052060-79 = "Я сейчас максимально серьёзна!"
10052060-86 = "Кья-а-а-а-а-а!!!"
10052060-87 = "(Сколько бы раз я это ни слышала, крик всё равно ужасает...)"
