[translation]
34180-1 = "Episódio 18;Outra de Nós"
34180-9 = "Por aqui, Hiyori, Misaki.#nVamos nos esconder aqui."
34180-10 = "S-Saori-neesan..."
34180-11 = "Shh! Silêncio. Abaixem mais a cabeça."
34180-12 = "T-Tá bom... Aliás, quem é aquela ali no meio?#nE-E-Ela tá usando uma roupa tão... t-tão linda..."
34180-13 = "Eu também não sei direito... Deve ser alguém importante."
34180-14 = "Dizem que ela é uma princesa. Que tem sangue nobre ou algo assim."
34180-15 = "U-Uma princesa!? Ela é uma princesa?"
34180-16 = "E-Então existem mesmo princesas neste mundo? D-Diferente de nós, que vivemos no fundo do poço..."
34180-17 = "Ela não deve passar fome... nem se machucar...#ne-e também não dorme na beira da estrada, né...? Não é?"
34180-18 = "É-É... Deve ser isso mesmo."
34180-19 = "...Eu achava que só existia sofrimento neste mundo... mas saber que existe uma princesa tão linda e que vive feliz assim... chega a ser emocionante. Buááááá!"
34180-20 = "N-Não chora assim do nada! Vão descobrir a gente!"
34180-21 = "D-Desculpa, Saori-neesan... Buááááá!#nMas é que... Buááááá!"
34180-22 = "...Mesmo sendo chamada de princesa, acho que a situação dela não é diferente da nossa, ou talvez ela seja tratada até pior."
34180-23 = "...?"
34180-24 = "Parece um desfile, mas aquilo é um cortejo levando uma refém para o inimigo.#nSerá que é por causa da guerra civil...? Até esse tipo de coisa acontece."
34180-25 = "Aquela princesa com certeza também vai passar fome na prisão.#nVai levar uma vida em que ter restos para comer já vai ser muita sorte."
34180-26 = "A-Auuu..."
34180-27 = "Pare com isso, Misaki. Está assustando a Hiyori."
34180-28 = "...E então, o que vamos fazer, Saori-neesan?#nViemos até aqui só pra ficar olhando e voltar?"
34180-29 = "Não, é claro que vamos atacar.#nVamos nos misturar naquela multidão e pegar emprestado o que parecer útil."
34180-30 = "Vamos lá."
34180-38 = "Parem!!"
34180-39 = "Saia da frente, líder do 8º Esquadrão."
34180-40 = "Vocês pretendem destruir o Halo dela!?#nParem com isso!!"
34180-41 = "P-Por favor... por favor, já chega... Ugh, uuu..."
34180-42 = "Ela se opôs a nós, então é apenas a consequência.#nSe não recuarem, vocês terão o mesmo destino."
34180-43 = "Cof... cof.#nNão me faça rir... Quem é que..."
34180-44 = "Sua maldita, como ousa!!"
34180-45 = "Esperem!!"
34180-46 = "...Eu mesma vou discipliná-la."
34180-47 = "Discipliná-la...?"
34180-48 = "...Mais uma perda de tempo."
34180-49 = "Tanto a Hiyori quanto a Misaki são alunas que eu disciplinei. A Princesa também — todas têm boas notas, não têm?"
34180-50 = "Por isso, deixem comigo — eu assumo a responsabilidade de discipliná-la."
34180-53 = "...Isso dói."
34180-54 = "Misaki... Nunca mais, nunca mais faça uma coisa dessas!#nDe jeito nenhum...!!"
34180-55 = "...Por quê?"
34180-56 = "O quê...?"
34180-57 = "Por que eu não posso?#nPor que temos que continuar vivendo em meio a essa dor sem sentido?"
34180-58 = "— Com frio, com fome, sofrendo.#nSão apenas dias em que a dor se repete sem parar."
34180-59 = "Por que você nos força a suportar essa dor sem sentido, Neesan?#nQue sentido existe nisso?"
34180-60 = "I-Isso é..."
34180-61 = "Isso... é..."
34180-62 = "...Viu só? Você nem consegue responder.#nFinge que sabe de tudo, mas no fundo você é igualzinha a nós, Neesan."
34180-65 = "...M-Misaki! Espera..."
34180-66 = "Espera! E-Eu..."
34180-68 = "...Por favor, me perdoe... Eu sinto muito..."
34180-69 = "Nunca mais... nunca mais farei algo assim..."
34180-70 = "Nunca mais vou desobedecer às palavras dos adultos... Não vou me rebelar... Vou me esforçar para não nutrir esperanças para o futuro..."
34180-71 = "Nunca mais vou desejar a felicidade... Não vou rezar..."
34180-72 = "Por isso, por favor..."
34180-74 = "Por favor... tenha misericórdia..."
34180-75 = "Misericórdia..."
34180-77 = "...Por que você resiste tanto assim, Azusa?"
34180-78 = "Um símbolo de reconciliação...? Não, isso não passa de uma farsa.#nVocê não é nada disso."
34180-79 = "Tudo o que você preparou e estudou foi unicamente para \"aquela missão\"."
34180-80 = "Portanto, desista e aceite — pois tudo é em vão."
34180-81 = "Azusa...?"
34180-82 = "O que você disse?#nEspere..."
34180-85 = "A-Aonde você vai? Azusa!"
34180-86 = "Espere! O que... Aonde você está indo?#nNós ainda estamos \"aqui\"..."
34180-87 = "Azusa..."
34180-88 = "V-Você... descobriu?#nVocê... já sabe a resposta para isso...?"
34180-89 = "Me diga, eu..."
34180-90 = "O que é que eu... devo fazer..."
34180-93 = "...Azusa."
34180-94 = "...Azusa?"
34180-95 = "...!!#nK-Kh, guh..."
34180-99 = "...Ugh, guh."
34180-103 = "...Com esses ferimentos é impossível, Saori."
34180-104 = "...Entendo."
34180-105 = "É mesmo... Então eu perdi."
34180-106 = "...Já chega."
34180-107 = "Já... chega...?"
34180-108 = "...Sim. Eu já não sei mais o que é o certo."
34180-109 = "Até agora, segui em frente acreditando que isso era o certo...#nMas, quando olho para trás, vejo que estava tudo errado..."
34180-110 = "...Shirasu Azusa."
34180-111 = "...?"
34180-112 = "O que você queria perguntar para a Azusa-chan?"
34180-113 = "...Então você ouviu."
34180-114 = "A Azusa-chan do Clube de Aulas de Reforço.#nPara começo de conversa, ela era uma espiã escolhida para ajudar no meu plano de golpe de Estado, não era?"
34180-115 = "Se não fosse pela ajuda do Sensei, ela deveria ter sido apenas mais uma peça no tabuleiro..."
34180-116 = "...A Azusa..."
34180-117 = "Originalmente, ela não foi escolhida para ser uma espiã."
34180-118 = "...Hã?"
34180-123 = "Aquela garota..."
34180-124 = "...deveria ter se tornado o \"símbolo da reconciliação\"."
34180-125 = "..."
34180-126 = "O quê..."
34180-127 = "Entre Trinity e Arius...#nQuem usou essa expressão pela primeira vez foi você, Mika."
34180-128 = "Do que você tá falando...? Isso foi...#nÉ, eu lembro... Foi só uma desculpa que eu inventei na hora pra enganar o Sensei..."
34180-129 = "— Não. Foram as palavras que você usou quando veio nos procurar pela primeira vez."
34180-130 = "Antes do ataque à Seia acontecer — numa época em que nem o Tratado do Éden, nem o seu golpe de Estado haviam sido planejados."
34180-131 = "..."
34180-132 = "Naquela ocasião, você disse que queria se reconciliar com Arius."
34180-134 = "Muito prazer☆ Não sei quem é você, mas você é uma aluna de Arius, né...?"
34180-135 = "O tempo tá ótimo hoje, né? Tão calmo e agradável..."
34180-136 = "Vá direto ao assunto, Trinity."
34180-137 = "Uaa... Então você odeia quebrar o gelo, né?#n...Tá bom, então não tem jeito, vou direto ao ponto."
34180-142 = "— Eu quero me reconciliar com vocês de Arius."
34180-143 = "Reconciliar...?"
34180-144 = "Sim. Pode parecer uma ideia meio radical, mas..."
34180-145 = "Vocês provavelmente ainda nos odeiam, não é?"
34180-146 = "É por isso que recusam tanto a nossa ajuda quanto a do Conselho Estudantil Geral e vivem isoladas em um distrito autônomo oculto, certo? Porque o ódio do passado ainda permanece."
34180-147 = "..."
34180-148 = "Mas, pra resolver isso... o ódio mútuo é grande demais...#nAlém disso, os mal-entendidos acumulados também devem ser enormes... Bom, fácil não é, né?"
34180-149 = "É natural que a Nagi-chan e a Seia-chan sejam contra..."
34180-150 = "Mas sabe... será que é tão difícil assim a gente se dar bem?#nSe cada lado ceder um pouquinho e der um passo em direção ao outro, um dia isso não pode se tornar realidade?"
34180-151 = "É o que eu acho... Por isso resolvi me esforçar aos pouquinhos e vim até aqui."
34180-152 = "...Como espera que eu acredite que essas palavras são sinceras?"
34180-153 = "É... Eu entendo essa sua reação.#nPor isso mesmo, eu pensei numa coisa."
34180-154 = "Que tal transferirmos uma aluna de vocês, de Arius, para Trinity?#nEm segredo, é claro."
34180-155 = "Se eu for a guardiã dela, consigo dar um jeito.#nPor mais que não pareça, eu faço parte da Tea Party."
34180-156 = "..."
34180-157 = "Assim, vamos provar que uma aluna de Arius pode conviver em harmonia na nossa academia, sem problema algum, e ser feliz."
34180-159 = "Por assim dizer, essa garota se tornaria o \"símbolo da reconciliação\".#nO que acha?"
34180-163 = "...Que plano absurdo."
34180-164 = "M-Mas... se existir alguém assim, tenho certeza de que a Seia-chan e a Nagi-chan vão acabar entendendo!"
34180-165 = "..."
34180-166 = "Pois bem. Mas essa não é uma questão que eu possa decidir sozinha.#nVocê terá que aguardar o meu próximo contato."
34180-167 = "Hã? E-Espera um pouco!#nExiste mesmo uma garota assim?"
34180-168 = "..."
34180-175 = "Azusa, tenho uma missão para você."
34180-179 = "...Qual?"
34180-181 = "Reconciliação? Que ideia absurdamente ingênua. Seria estranho se não fosse uma armadilha."
34180-182 = "Hum... Bom, não há motivo para pressa.#nVamos observar por enquanto para ver se ela é mesmo ingênua ou uma serpente traiçoeira."
34180-183 = "Recuse por ora.#nE enrole-a na medida certa para manter o contato e obter informações de Trinity."
34180-184 = "Isso significa que... devemos recusar?"
34180-185 = "É claro. Símbolo da reconciliação? Que tamanho disparate.#nVamos fazer a gentileza de usá-la como uma ferramenta para obter informações de Trinity."
34180-186 = "..."
34180-187 = "Saori... Há algum problema?#nNão me diga que estava preparando algo sem a minha permissão?"
34180-188 = "N-Não... De forma alguma, Madame."
34180-189 = "Não me diga que se esqueceu, não é?#nDo motivo pelo qual vocês sofrem — a raiz do motivo de tremerem de frio e passarem fome sem parar?"
34180-190 = "...Sim. Tudo isso é culpa de Trinity, que nos expulsou."
34180-191 = "Exatamente. Reconciliação com nossos inimigos jurados jamais acontecerá, por toda a eternidade.#n— Jamais, em hipótese alguma, esqueça esse ódio."
34180-192 = "Sim, Madame.#nEu não esquecerei o ódio."
34180-194 = "Nem eu mesma sei direito o porquê... Mas se fosse a Azusa...#nSe fosse aquela Azusa..."
34180-195 = "Eu... provavelmente queria que a Azusa se tornasse alguém assim..."
34180-196 = "..."
34180-197 = "Contudo, a oportunidade de confirmar isso nunca chegou..."
34180-201 = "...A Seia-chan está aqui."
34180-202 = "Se puderem só mandá-la para o hospital sem fazer alarde..."
34180-203 = "Então é isso, conto com vocês."
34180-205 = "..."
34180-206 = "...A Madame não deixou essa oportunidade escapar.#nPorque a Seia era uma pedra no sapato para a Madame."
34180-207 = "Você provavelmente nos via apenas como um exército particular conveniente.#nCaso contrário, jamais teria nos revelado a localização ultrassecreta da Seia."
34180-208 = "Mas nós não somos uma existência conveniente assim.#nNós somos..."
34180-210 = "Um grupo de assassinas...#nque aprendeu e treinou \"como destruir Halos\", e que possui as ferramentas para isso."
34180-212 = "Recebemos a missão de matar a Seia com uma \"bomba destruidora de Halos\"."
34180-216 = "Como a Azusa... possuía muito conhecimento sobre Trinity para se tornar o símbolo da reconciliação, ela acabou sendo enviada para essa missão."
34180-224 = "...A Nagi-chan está tramando uma coisa estranha."
34180-225 = "..."
34180-226 = "Parece que ela perdeu o rumo depois que a Seia-chan morreu.#nUm tratado de paz com Gehenna, vê se pode. Essa Nagi-chan..."
34180-227 = "Por isso — é. Quero que comecem aquele plano que eu propus outro dia."
34180-229 = "Mandar uma espiã para dentro de Trinity.#nDe um jeito cauteloso, diferente de como foi com a Seia-chan."
34180-231 = "Mika..."
34180-232 = "Eu não conseguia entender você.#nNão fazia a menor ideia do que você realmente desejava."
34180-233 = "Cheguei a pensar que você fosse apenas uma idiota... Mas, se você realmente acreditava naquilo..."
34180-234 = "Mesmo quando ouvi a palavra \"reconciliação\" de você pela primeira vez... embora a minha razão entendesse que não passava de um delírio..."
34180-235 = "\"E se um futuro assim realmente existisse para nós...?\""
34180-236 = "Eu não consegui apagar esse pensamento por completo..."
34180-237 = "..."
34180-238 = "Mika, você..."
34180-243 = "Você realmente, do fundo do coração, queria se reconciliar conosco."
34180-244 = "..."
34180-245 = "Você veio até nós com boas intenções.#nE fui eu quem pisoteou esse seu sentimento, enganou você e a guiou para este inferno."
34180-246 = "E você não conseguiu aceitar este inferno... Por isso, trancou as suas próprias memórias e as negou."
34180-247 = "Sim, não apenas você..."
34180-248 = "...O fato de a Princesa ter sido forçada a viver escondendo a voz e o rosto,#ne o fato de eu ter arrastado a Hiyori e a Misaki para o Esquadrão..."
34180-249 = "E a Azusa, que foi enviada novamente a Trinity não como o \"símbolo da reconciliação\", mas como uma \"assassina\" — uma \"espiã\" forçada a enganar e pisotear a todos..."
34180-250 = "— Tudo isso é culpa minha."
34180-251 = "Eu... não sou cão de caça nenhum. Eu sou..."
34180-252 = "Um presságio de ruína... que espalha dor por tudo ao seu redor."
34180-253 = "..."
34180-254 = "O que eu queria perguntar para a Azusa, é...?#nSim... havia algo..."
34180-255 = "Mesmo tendo tudo isso jogado sobre os ombros, a Azusa..."
34180-256 = "...parecia feliz."
34180-257 = "Aquela Azusa que nunca demonstrava emoções para ninguém, que não nos aceitou até o fim#ne que se manteve firme em sua solidão..."
34180-259 = "Aquela garota que mantinha o coração fechado com tanta força quanto uma concha no fundo d'água..."
34180-270 = "Uniu forças com as amigas... e com um adulto..."
34180-271 = "E, no fim, superou as provações..."
34180-272 = "E seguiu em frente... sob um céu azul radiante e repleto de felicidade..."
34180-274 = "Não... Isso não pode ser verdade.#nAquilo... aquilo é mentira. É uma farsa!"
34180-275 = "É uma felicidade como uma miragem, que um dia vai desaparecer!"
34180-279 = "Abaixar a cabeça, rezar e implorar não muda absolutamente nada!"
34180-280 = "Azusa, no fim das contas, nós jamais poderemos ser felizes.#nVocê sabe muito bem disso, não sabe? — Que tudo é em vão."
34180-282 = "Mas... no fim, não tive escolha a não ser admitir..."
34180-285 = "Ah... Entendo."
34180-286 = "Tanto o nosso ódio... quanto as palavras \"tudo é em vão\"...#ne tudo o que fizemos até aqui..."
34180-287 = "— Era tudo mentira..."
34180-288 = "Tola e covarde como eu era... levei todos ao meu redor à ruína, como um presságio de desgraça..."
34180-299 = "— Ah, então era isso no fim das contas.#nA causa de tudo fui eu."
34180-300 = "A Azusa pôde ser feliz porque conseguiu se afastar de mim."
34180-301 = "Eu provavelmente quis negar essa verdade até o último instante..."
34180-303 = "Azusa, se fosse você... saberia a resposta certa?"
34180-304 = "Azusa... Será que eu..."
34180-305 = "— Poderia ser feliz?"
34180-306 = "O que eu deveria fazer para me tornar como você?#nSerá que uma chance assim existe? Será que alguém como eu tem o direito de desejar algo assim...?"
34180-307 = "Se... eu..."
34180-310 = "...tivesse encontrado um bom adulto um pouco mais cedo..."
34180-311 = "Será que até alguém como eu... teria tido outra vida...?"
34180-312 = "Será que eu poderia ter alcançado outro futuro, em vez deste fim trágico...?"
34180-313 = "Será que para mim... uma chance... assim..."
34180-314 = "Azusa... O que foi... que você disse naquela hora?"
34180-315 = "Eu... aquilo..."
34180-319 = "...Mika."
34180-320 = "Veja o estado em que estou.#n— Faça o que quiser. Tome de mim na mesma medida em que tudo lhe foi tirado."
34180-321 = "Pois quem transformou você, que tinha um coração gentil... em uma \"bruxa\" de ódio,#nnão foi ninguém menos do que eu."
34180-322 = "Eu já tirei demais dos outros... Com isso, as coisas ficarão ao menos justas..."
34180-332 = "Ah... Se esse papel coubesse a alguém, eu achei que seria da Azusa...#nMas acabou sendo você, Mika."
34180-340 = "...?"
34180-341 = "...E-Eu..."
34180-342 = "Eu... não consigo."
34180-343 = "Não consigo fazer uma coisa dessas...#nPorque..."
34180-344 = "Eu também..."
34180-345 = "Assim como você, eu também desejei uma chance dessas..."
34180-346 = "Eu também... queria ter sido feliz..."
34180-347 = "Eu também ficava pensando... que, como você, se eu tivesse conhecido o Sensei um pouquinho mais cedo...#nTalvez eu pudesse ter desfeito os meus erros..."
34180-352 = "Eu tinha aceitado que esse era o meu castigo merecido...#nMas, ainda assim, rezei incontáveis vezes pedindo por misericórdia."
34180-353 = "Mas... foi inútil."
34180-354 = "Eu não faço a menor ideia de como poderia ser perdoada#npor todas as coisas irremediáveis que cometi..."
34180-355 = "Uma segunda chance..."
34180-356 = "O Sensei e todas as meninas se reunindo por minha causa... para que eu pudesse recomeçar.#nEu acreditava que uma chance assim também existia pra mim... Mas não existia... Esse futuro não existia..."
34180-357 = "Neste mundo onde tudo é em vão, tudo o que fiz foi sofrer implorando por salvação..."
34180-359 = "Você... sou eu, Saori..."
34180-360 = "Você não pode ser feliz.#nDa mesma forma que eu não posso ser feliz."
34180-361 = "Isso é impossível. Para nós, que já fomos longe demais e não temos mais volta, jamais existiria uma segunda chance."
34180-363 = "Por isso, talvez eu tenha desejado uma dor \"justa\" para você..."
34180-364 = "Mas, justamente por isso... eu não consigo..."
34180-365 = "Se eu decidir o seu fim dessa maneira..."
34180-366 = "Estarei provando com as minhas próprias mãos que não existe salvação para mim..."
34180-371 = "Mika... Você..."
34180-372 = "Ei, por que você não usou a \"bomba destruidora de Halos\"?"
34180-373 = "...!!"
34180-374 = "Eu ouvi dizer que você tinha uma... Você teve chances de sobra pra usar, não teve?#nPor que não usou?"
34180-375 = "Se você tivesse usado aquilo... eu..."
34180-376 = "Aquilo... Para começo de conversa, não está comigo."
34180-377 = "Porque o Sensei a confiscou..."
34180-378 = "...Hã?"
34180-379 = "...Confiscou? O Sensei?"
34180-380 = "Hã, como assim...?"
34180-385 = "[ns] \"Coisas perigosas o Sensei confisca.\""
34180-386 = "!?"
34180-387 = "S-Sensei...!?"
34180-388 = "S-Sensei... P-Por que você está aqui...!?"
34180-390 = "Próximo;Possibilidades Infinitas"
