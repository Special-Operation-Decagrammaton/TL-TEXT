[translation]
34180-1 = "Эпизод 18;Другие мы"
34180-9 = "Сюда, Хиёри, Мисаки. Спрячемся здесь."
34180-10 = "Э-Эй..."
34180-11 = "Тише. Пригни голову."
34180-12 = "Кто та девушка посередине? Н-На ней очень красивое платье..."
34180-13 = "Не знаю... Наверное, она очень важная."
34180-14 = "Это Химэ. В ней королевская кровь."
34180-15 = "Правда?! Она принцесса?"
34180-16 = "Ого! Не знала, что у нас есть королевская семья! Наверное, её жизнь совсем не похожа на нашу!"
34180-17 = "Наверняка ей никогда не приходилось красть еду... получать обморожение... или спать на холодном полу..."
34180-18 = "Т-Ты плачешь?!"
34180-19 = "В мире, полном страданий... я не знала, что может существовать такой прекрасный человек... Это так трогательно. *всхлип*"
34180-20 = "Мне всё равно, насколько это трогательно! Ты нас выдашь!"
34180-21 = "Прости, н-но... *всхлип*"
34180-22 = "...Даже если она принцесса, сейчас её положение, вероятно, ещё хуже нашего."
34180-23 = "...?"
34180-24 = "Они сопровождают захваченную заложницу к врагу. Она военнопленная."
34180-25 = "Её, наверное, запрут и больше никогда не выпустят на свет, оставят одну медленно умирать от голода."
34180-26 = "О... О нет..."
34180-27 = "Хватит, Мисаки. Ты пугаешь Хиёри."
34180-28 = "...Прости. Что будем делать? Просто вернёмся?"
34180-29 = "Конечно нет. Такие толпы — идеальные охотничьи угодья. Крадите всё, до чего сможете дотянуться."
34180-30 = "Поняли? Вперёд."
34180-38 = "Стойте!"
34180-39 = "С дороги, командир восьмого отряда."
34180-40 = "Вы разрушите ей нимб! Пожалуйста!"
34180-41 = "Пожалуйста... Прошу, остановитесь... *всхлип*"
34180-42 = "Вот что бывает за сопротивление. Отойди, если не хочешь той же участи."
34180-43 = "*кашель* Вы меня... не сломали..."
34180-44 = "Какая дерзость!"
34180-45 = "П-Погоди!"
34180-46 = "Я-я её научу!"
34180-47 = "Научишь...?"
34180-48 = "...И снова она за своё."
34180-49 = "Я-я умею учить! У Хиёри, Мисаки и Химэ оценки улучшились с тех пор, как я стала им помогать."
34180-50 = "Я прослежу, чтобы она слушалась! Поэтому, пожалуйста...!"
34180-53 = "...больно."
34180-54 = "Мисаки, больше так не делай. Пожалуйста."
34180-55 = "...Почему?"
34180-56 = "П-Почему...? П-Потому что... ну..."
34180-57 = "Почему мы должны продолжать мучиться?"
34180-58 = "Мне холодно, я голодна и больна. Каждый день одинаковый. Больной и невыносимый."
34180-59 = "Зачем ты заставляешь нас терпеть эту бессмысленную боль? Что из неё может получиться?"
34180-60 = "Н-Но..."
34180-61 = "Потому что..."
34180-62 = "...Я так и знала. Ты ведёшь себя так, будто всё знаешь, но ничем не лучше нас. Ты ничего не знаешь!"
34180-63 = ""
34180-65 = "М-Мисаки! Нет, подожди!"
34180-66 = "Подожди! Я-я..."
34180-68 = "П-Пожалуйста, простите меня... Я была неправа... Простите..."
34180-69 = "Простите... простите... мне так жаль... Я больше никогда..."
34180-70 = "Я никогда больше не ослушаюсь приказа взрослого... никогда... Откажусь от всякой надежды... Не буду восставать."
34180-71 = "Я никогда не стану молиться о счастье... Никогда... Простите..."
34180-72 = "Так что, пожалуйста... простите..."
34180-74 = "Помилуйте... пожалуйста..."
34180-75 = "Милость..."
34180-77 = "Почему ты продолжаешь сопротивляться, Азуса?"
34180-78 = "Символ примирения? Это была мечта дурочки. Ложь. На тебя не похоже верить в ложь."
34180-79 = "Настоящая истина — в твоей подготовке, в уроках, которые мы выучили здесь."
34180-80 = "Откажись от надежды. Не восставай. Не молись о счастье. Всё тщетно."
34180-81 = "Азуса! Ты меня слушаешь?!"
34180-82 = "Ч-Что? Что ты сказала?"
34180-85 = "Куда ты идёшь? Вернись... Азуса!"
34180-86 = "Скажи мне... пожалуйста! Что ты сказала? Не... Не оставляй нас."
34180-87 = "Азуса..."
34180-88 = "Ты... нашла свой ответ?"
34180-89 = "Пожалуйста... что ты знаешь? Я..."
34180-90 = "Что мне делать?"
34180-92 = ""
34180-93 = "Азуса..."
34180-94 = "...Азуса?"
34180-95 = "А-Ах...!"
34180-96 = ""
34180-98 = ""
34180-99 = "У-ух..."
34180-100 = ""
34180-103 = "С такими ранами ты не сможешь двигаться, Саори."
34180-104 = "...Значит, вот и всё."
34180-105 = "Похоже, этот конец был предрешён."
34180-106 = "...Ничего."
34180-107 = "Что именно «ничего»?"
34180-108 = "Мой конец. Страницы моей истории закончились уже давно."
34180-109 = "Я всё время бежала вперёд, всем сердцем веря, что делаю то, что должна. Но это не делало мои поступки правильными."
34180-110 = "Азуса..."
34180-111 = "...?"
34180-112 = "Ты позвала Азусу. Почему?"
34180-113 = "...Ты это слышала?"
34180-114 = "Азуса из Клуба дополнительных занятий... шпионка, выбранная помочь моему перевороту."
34180-115 = "Если бы не Сенсей, она осталась бы тем, чем должна была быть: бездумной шахматной фигурой."
34180-116 = "Азуса... Она..."
34180-117 = "Она никогда не должна была быть шпионкой."
34180-118 = "Что?"
34180-119 = ""
34180-121 = ""
34180-122 = ""
34180-123 = "Сначала она была..."
34180-124 = "Она была символом примирения."
34180-125 = "..."
34180-126 = "О чём ты?"
34180-127 = "Примирение Тринити и Ариуса... Это была твоя идея, Мика."
34180-128 = "Ну да. Но я всё это придумала только чтобы обмануть Сенсея..."
34180-129 = "Нет. Не помнишь? Ты сказала это, когда впервые к нам пришла."
34180-130 = "До нападения на Сэю. До Эдемского договора, до переворота... До всей лжи и интриг."
34180-131 = "......"
34180-132 = "Когда мы впервые встретились, ты говорила только о мире."
34180-133 = ""
34180-134 = "Привет! Ты студент Ариуса? Как тебя зовут?"
34180-135 = "Сегодня такой прекрасный день! Обожаю чувствовать солнце на коже."
34180-136 = "Ближе к делу, Тринити."
34180-137 = "Ого. Не любишь светские разговоры?"
34180-138 = ""
34180-140 = ""
34180-142 = "Ладно-ладно. Я хочу, чтобы Тринити и Ариус помирились."
34180-143 = "...Что?"
34180-144 = "Знаю. Безумие, да?"
34180-145 = "Думаю, вы всё ещё нас ненавидите."
34180-146 = "И, наверное, поэтому вы прячетесь в этом изолированном районе и отказываетесь от любой помощи извне. Всё из-за какой-то вражды многолетней давности."
34180-147 = "......"
34180-148 = "Не смотри на меня так. Я понимаю, сколько гнева и ненависти из той вражды дожило до наших дней. Никто не захочет идти на компромисс."
34180-149 = "Наги и Сэя всё ещё категорически против. И я их понимаю."
34180-150 = "Но одновременно не понимаю. Разве было бы так плохо попытаться быть добрее друг к другу? Понемногу можно было бы разрушать эту ненависть."
34180-151 = "Я правда думаю, что это возможно. Поэтому и пришла сюда встретиться с вами. Попробовать, шаг за шагом."
34180-152 = "...Ты ждёшь, что я тебе поверю?"
34180-153 = "Вообще нет. Поэтому предлагаю вот что."
34180-154 = "Что если тайно перевести одного студента Ариуса в Тринити?"
34180-155 = "Я могу устроить это щелчком пальцев. Участие в Чаепитии даёт свои преимущества."
34180-156 = "......"
34180-157 = "Если студент Ариуса сможет влиться в Тринити, мы докажем, что не так уж отличаемся."
34180-159 = "Она будет вроде... символа примирения! Ну разве я не гений?"
34180-160 = ""
34180-162 = ""
34180-163 = "Ты безумна. Твой план — безумие."
34180-164 = "Знаю, да? Но если получится, Сэя и Наги наконец начнут меня слушать!"
34180-165 = "..."
34180-166 = "Это не решение, которое я могу принять одна. Поговорим позже."
34180-167 = "П-Подожди! Значит, ты рассматриваешь вариант? Уже есть кто-то на примете?"
34180-168 = "..."
34180-169 = ""
34180-171 = ""
34180-172 = ""
34180-175 = "Азуса. Есть миссия."
34180-176 = ""
34180-179 = "...Миссия?"
34180-181 = "Примирение? Твоя наивность поражает. Ты входишь в ловушку с широко открытыми глазами."
34180-182 = "Хотя... это можно обратить нам на пользу. Наблюдай за ней. Выясни, действительно ли она простая дурочка или хитрая змея."
34180-183 = "Пока откажись, но поддерживай отношения. Выжми из неё максимум информации."
34180-184 = "Ты не хочешь... попробовать?"
34180-185 = "Глупый ребёнок. Символ примирения? Если бы я фыркнула сильнее, смогла бы плюнуть в ту девчонку из Тринити."
34180-186 = "......"
34180-187 = "Я чувствую недовольство, Саори. Неужели ты действительно думала согласиться с Тринити?"
34180-188 = "...Конечно нет, Мадам."
34180-189 = "Скажи мне. Кто научил тебя, что значит голодать? Кто отнял у тебя крышу над головой?"
34180-190 = "...Тринити."
34180-191 = "Умница. Примирения не существует. Они забрали у тебя всё, кроме ненависти. Не потеряй её."
34180-192 = "Да, Мадам. Не потеряю."
34180-194 = "Не знаю, что именно было в ней... но я думала, что Азуса..."
34180-195 = "Я думала, она может стать тем самым символом для обеих академий."
34180-196 = "......"
34180-197 = "Но мы уже никогда не узнаем, каким могло стать то будущее."
34180-198 = ""
34180-199 = ""
34180-200 = ""
34180-201 = "Сэя прямо за этой дверью."
34180-202 = "Ты отправишь её в небольшой затяжной отпуск в больницу, а следующей хозяйкой стану я!"
34180-203 = "Вот будет весело! Разве ты не рада?"
34180-205 = "..."
34180-206 = "Мадам хотела избавиться от Сэи, и подвернулась возможность."
34180-207 = "Вы считали нас всего лишь одноразовой пехотой, да? Иначе зачем раскрыли местоположение Сэи?"
34180-208 = "Но мы были не мелкими воришками, которыми можно манипулировать."
34180-210 = "Мы убийцы. День за днём тренировались разрушать нимбы."
34180-212 = "А потом получили миссию... разрушить нимб Сэи."
34180-216 = "А Азусу... назначили на миссию, потому что она уже училась и готовилась стать нашим символом примирения."
34180-224 = "...Наги что-то странное задумала."
34180-225 = "......"
34180-226 = "Мирное соглашение с Геенной? После смерти Сэи она совсем с ума сошла."
34180-227 = "Учитывая ситуацию, стоит пересмотреть наш план."
34180-229 = "Заслать в Тринити шпиона. На этот раз осторожнее."
34180-231 = "Ты..."
34180-232 = "Я не понимала, чего ты хотела и каких принципов придерживалась. До сих пор не понимаю."
34180-233 = "Я могла просто отмахнуться от тебя как от глупой наивной девчонки. Но я знала тебя лучше."
34180-234 = "Твои мечты о примирении казались мне немыслимыми, но..."
34180-235 = "А что, если это было возможно? Что, если мы могли выйти из тени?"
34180-236 = "Даже сейчас я не могу выбросить эти мысли из головы."
34180-237 = "......"
34180-238 = "Мика..."
34180-239 = ""
34180-241 = ""
34180-242 = ""
34180-243 = "Когда ты впервые пришла ко мне, ты действительно хотела примирения, правда?"
34180-244 = "......"
34180-245 = "Ты пришла к нам с лучшими намерениями, а я обманула тебя и утянула в ад."
34180-246 = "Ты не смогла принять этот ад, выросший из твоей надежды. Поэтому заперла воспоминания и приняла тьму, которая, как тебе казалось, жила внутри тебя."
34180-247 = "И ты не единственная."
34180-248 = "Хиёри и Мисаки оказались втянуты в отряд, а Химэ... ей вообще не пришлось бы здесь сражаться."
34180-249 = "Азусу заставили вернуться в Тринити не как символ примирения, на который мы надеялись, а как убийцу и шпионку."
34180-250 = "Всё это из-за меня. Из-за моей слабости."
34180-251 = "Как ты всегда меня называешь? Гончая..."
34180-252 = "Да. Бешеная гончая. Та, что заражает всех вокруг."
34180-253 = "..."
34180-254 = "Почему я звала Азусу? У меня... столько вопросов к ней."
34180-255 = "Азуса стала жертвой обстоятельств. В каком-то смысле она страдала сильнее всех, и всё же..."
34180-256 = "...она выглядела счастливой."
34180-257 = "Азуса всегда была закрытой. Она принимала наше присутствие, но не дружбу."
34180-259 = "Её одиночество буквально ощущалось."
34180-270 = "Но потом она действительно отправилась в Тринити. Завела друзей, встретила хорошего взрослого..."
34180-271 = "Азуса преодолела все трудности и страдания с улыбкой."
34180-272 = "Она выглядела счастливой в том мире под голубым небом, до которого я никогда не могла дотянуться."
34180-274 = "Это ложь. Разве ты не понимаешь? Мира не существует."
34180-275 = "Твоя надежда? Иллюзия! Она исчезнет вместе с заходящим солнцем!!"
34180-276 = ""
34180-279 = "Я молилась! Мечтала и надеялась! Плакала и умоляла — и ничего никогда не менялось!"
34180-280 = "Всё тщетно, Азуса! Всё!"
34180-282 = "Но в итоге..."
34180-285 = "В итоге она была права."
34180-286 = "Всё, во что я верила... моя ненависть, моя решимость..."
34180-287 = "Всё было ложью. Не всё тщетно."
34180-288 = "Моя слабость погубила всех."
34180-290 = ""
34180-299 = "Во всём виновата я, Мика."
34180-300 = "Азуса не могла обрести счастье, пока наконец не сбежала... от меня."
34180-301 = "Ты знаешь, как далеко я зашла, лишь бы отрицать этот простой факт."
34180-303 = "Я хочу узнать... чему научилась Азуса. Какие ответы нашла в Тринити."
34180-304 = "У меня столько вопросов к ней."
34180-305 = "...Смогу ли я тоже однажды стать счастливой?"
34180-306 = "Как мне найти покой? Будет ли у меня когда-нибудь шанс? Или точнее... заслуживаю ли я его?"
34180-307 = "А что если..."
34180-310 = "Что если бы я первой встретила Сенсея? А не Мадам?"
34180-311 = "Как изменилась бы моя жизнь?"
34180-312 = "Может, я не причинила бы боль всем, кого люблю."
34180-313 = "Если бы у меня был... шанс быть хорошей..."
34180-314 = "Я хочу понять те слова, которые ты сказала мне, Азуса."
34180-315 = "Я хочу..."
34180-316 = ""
34180-319 = "Теперь уже неважно... Мика."
34180-320 = "Отомсти. Забери столько, сколько сама потеряла."
34180-321 = "Ты никогда не была ведьмой. Это я впрыснула свою ненависть тебе в кровь."
34180-322 = "Я отняла слишком много у всех вокруг. Такой конец мне подходит."
34180-323 = ""
34180-326 = ""
34180-327 = ""
34180-329 = ""
34180-330 = ""
34180-332 = "Что ж... Я всегда думала, что это будет Азуса, но лучше, если это будешь ты, Мика."
34180-333 = ""
34180-337 = ""
34180-339 = ""
34180-340 = "......"
34180-341 = "Я-я..."
34180-342 = "Я... не могу... Не могу этого сделать..."
34180-343 = "Не могу... потому что..."
34180-344 = "Я..."
34180-345 = "...тоже этого хотела..."
34180-346 = "Я хотела быть счастливой!"
34180-347 = "Я тоже снова и снова думала об этом! Что если бы встретила Сенсея раньше? Сенсей мог бы помочь мне исправить ошибки!"
34180-348 = ""
34180-349 = ""
34180-350 = ""
34180-351 = ""
34180-352 = "Мне казалось, это несправедливо! Я ошиблась... сильно. Но потеряла всё дорогое. Я молилась хоть о какой-нибудь милости."
34180-353 = "Но... она так и не пришла. Не для меня."
34180-354 = "А теперь слишком поздно. Не думаю, что когда-либо смогу искупить ужасные вещи, которые сделала."
34180-355 = "Второй шанс...?"
34180-356 = "Я так сильно его хотела. И когда Сенсей пришёл в мою камеру и сказал, что все друзья придут на слушание, я подумала, что получу его. Но... даже это ускользнуло."
34180-357 = "...Всё тщетно, да? Мне оставалось только страдать... и ненавидеть."
34180-359 = "Мы с тобой... словно две половины одного пламени, Саори."
34180-360 = "Непостижимо связанные, проклятые никогда не найти счастья."
34180-361 = "Мы не можем повернуть время назад и изменить будущее."
34180-363 = "Наверное, поэтому я так зациклилась на тебе. Месть казалась единственной вещью, которую я могла контролировать."
34180-364 = "Не ты превратила меня в ведьму. Я сама выпила яд."
34180-365 = "Даже когда Сенсей пытался дать противоядие, я его выплюнула."
34180-366 = "Как всегда говорит Сэя, я и правда безнадёжна."
34180-367 = ""
34180-369 = ""
34180-370 = ""
34180-371 = "Мика..."
34180-372 = "Почему ты ещё не разрушила мой нимб?"
34180-373 = "...!"
