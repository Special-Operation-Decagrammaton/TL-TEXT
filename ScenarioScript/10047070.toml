[translation]
10047070-1 = "Эпизод 7;Доказательство легенды"
10047070-2 = "Вернувшись в общежитие, все усердно принялись за уборку."
10047070-6 = "[ns] «Подожди, это же...?»"
10047070-7 = "В углу комнаты стояли несколько холстов, накрытых чёрной тканью."
10047070-8 = ""
10047070-10 = ""
10047070-11 = "Тебе... не стоит на них смотреть."
10047070-12 = "Это... старые картины Эри."
10047070-13 = "Оставь их..."
10047070-14 = "[ns] «Она сохранила их и не выбросила?»"
10047070-15 = "Она сказала, что хочет вспоминать... свои первые шаги."
10047070-16 = "Смотреть на прежнюю, неопытную себя... должно быть больно..."
10047070-17 = "Она... старается больше всех нас."
10047070-18 = ""
10047070-20 = ""
10047070-23 = "[ns] «...Девушка, идущая за своей мечтой.»"
10047070-24 = "Мастер? О чём вы шепчетесь?"
10047070-25 = "[s] «А? Ну, эм...!»"
10047070-26 = "...О моей прошлой жизни."
10047070-27 = "Похоже, Сенсей... не помнит свою прошлую жизнь со мной."
10047070-28 = "*вздох* ТАК ВЫ тот человек, о котором говорила Каноэ?!"
10047070-29 = ""
10047070-30 = "[ns] «Я ничего об этом не знаю...!»"
10047070-32 = "Благодаря вмешательству Каноэ Эри так и не поняла, о чём мы на самом деле говорили."
10047070-33 = ""
10047070-37 = "[ns] «Мечта Эри...»"
10047070-38 = "Не произнося мыслей вслух, мы продолжили уборку."
10047070-41 = "Ню-ху-ху, как новенькая!"
10047070-42 = "*вздох* Если вы снова выкинете что-то подобное, я заставлю вас заплатить."
10047070-43 = "О! Ну... хм, тогда, может, в следующий раз попробуем другой подход!"
10047070-44 = "ПОЖАЛУЙСТА, думай о последствиях своих действий!"
10047070-45 = "Хм... Взрыв и правда оказался сильнее, чем я думала... Стены ослабли..."
10047070-46 = "Если хотим оставаться в безопасности... стоит попробовать где-нибудь за пределами общежития..."
10047070-47 = "Но там Совет следит гораздо строже."
10047070-48 = "Я не вижу пути. Сейчас нам нужна..."
10047070-49 = "Магия Арканы! Время разложить карты Таро!"
10047070-50 = ""
10047070-52 = ""
10047070-53 = "...Поразительно."
10047070-54 = "А теперь разберём, почему мы потерпели неудачу."
10047070-55 = ""
10047070-57 = ""
10047070-58 = "Мастер, пожалуйста, вытяните три карты и положите их на стол рубашкой вверх."
10047070-59 = "[ns] Осторожно вытянуть карты и положить их на стол."
10047070-60 = ""
10047070-64 = "Тогда... посмотрим..."
10047070-65 = ""
10047070-67 = ""
10047070-68 = "Хм, интересно..."
10047070-69 = "...Может, нам не хватило огневой мощи?"
10047070-70 = ""
10047070-72 = ""
10047070-73 = ""
10047070-74 = "Хи-хи... Возможно, стоило взорвать всё общежитие..."
10047070-75 = "Понимаю. Демоны хотят общаться только с интересными людьми."
10047070-76 = "...Если бы мы взорвали общежитие, думаю, встретили бы демона по имени «Отчисление»."
10047070-77 = "Хм, мне кажется, огневая мощь здесь скорее метафора."
10047070-78 = "А эта карта... символизирует древнюю историю."
10047070-79 = "Хммм..."
10047070-80 = ""
10047070-82 = ""
10047070-83 = "Мастер, простите. Не могли бы вы вытянуть ещё одну карту?"
10047070-84 = "[ns] Кивнуть и вытянуть карту."
10047070-85 = ""
10047070-89 = ""
10047070-90 = ""
10047070-91 = ""
10047070-92 = "Это... прямой Маг?"
10047070-93 = "[s1] «Ага...»\n[s2] «Это хорошо или плохо?»"
10047070-96 = "Мага нельзя толковать так однозначно."
10047070-97 = "Он означает огромные способности, но также и непредсказуемость. Точно сказать невозможно."
10047070-98 = "Непредсказуемость...? Похоже на старших."
10047070-99 = "Это... прямо как мы?"
10047070-100 = ""
10047070-102 = ""
10047070-103 = ""
10047070-105 = ""
10047070-106 = "Понятно! Вот оно!"
10047070-107 = "Спасибо, Рэна! Как и ожидалось от члена Общества исследования оккультизма!"
10047070-108 = "Ч-Что? Мне уже не нравится, куда всё идёт..."
10047070-109 = "Карты говорят обратиться к древней истории, мечтая о преобразующем будущем. И всё это чистая магия!"
10047070-110 = "Все! Помните историю о магии Вайлдханта?"
10047070-111 = "Ты имеешь в виду... то самое...?"
10047070-112 = "Понятно."
10047070-113 = "Возродить шепчущую легенду в настоящем... Это тоже искусство."
10047070-114 = "Что именно? Не говорите так, будто все всё понимают. Объясните!"
10047070-115 = "Огромный магический круг!"
10047070-116 = "В ночь полной луны! Легенда гласит, что если создать гигантский магический круг, соединив главные сооружения академии, случится нечто потрясающее!"
10047070-117 = "[s] «А что именно потрясающее?»"
10047070-118 = "Это... древняя легенда, появившаяся ещё до письменности... Мы не знаем точно."
10047070-119 = "Но говорят, это магия, исполняющая самое заветное желание..."
10047070-120 = "Ню-ху-ху, разве это не захватывает?"
10047070-121 = "Вы серьёзно?"
10047070-122 = "Вы собираетесь ночью носиться по всему кампусу и рисовать круги на полу?"
10047070-123 = "А-А если вас поймает Совет префектов?!"
10047070-124 = "Хи-хи, слушай внимательно, Рэна..."
10047070-125 = ""
10047070-127 = ""
10047070-129 = "Всё нормально, пока нас не поймают."
10047070-130 = "Хех, искусство расцветает через приключения."
10047070-131 = "А если легенда правдива, моя мечта исполнится!"
10047070-132 = "...И это звучит весело!"
10047070-133 = "Шья-а! Я так и знала! Сенсей! Остановите их!"
10047070-134 = ""
10047070-136 = ""
10047070-137 = "[ns3] «Если это поможет мечте Эри, я хочу присоединиться.»\n[ns4] «Конечно, ничего чрезмерного делать не стоит.»"
10047070-140 = "Согласна. Поддерживать мечты друг друга и делиться силой... Всё это не оставляет сомнений, что..."
10047070-141 = ""
10047070-143 = ""
10047070-144 = ""
10047070-145 = "...дружба..."
10047070-146 = "...это единственное, что важно!"
10047070-147 = "УФ!"
10047070-148 = "А-а, да делайте что хотите! Я ухожу!"
10047070-149 = "Всё нормально! Я понимаю твоё беспокойство."
10047070-150 = "Что бы ни случилось, я прослежу, чтобы у тебя не было проблем."
10047070-151 = "Хмф. Всегда так гладко говорите..."
10047070-153 = "А теперь... посмотрим..."
10047070-154 = "Форма большого магического глифа... который, как говорят, опоясывает всю академию..."
10047070-155 = "Пойдём в Информационный центр искусств и всё исследуем! Уверена, некоторые из этих зданий должны образовывать круг."
10047070-156 = ""
10047070-158 = ""
10047070-159 = "Ты тоже пойдёшь, Рэна?"
10047070-160 = "...Только чтобы вы, старшие, не устроили сцену, ясно!"
10047070-161 = "И ТОЛЬКО поэтому. Понятно?"
10047070-162 = "Хех, знаем."
10047070-164 = "Информационный центр искусств Вайлдхант"
10047070-166 = ""
10047070-167 = ""
10047070-168 = ""
10047070-169 = ""
10047070-170 = ""
10047070-171 = ""
10047070-172 = ""
10047070-173 = ""
10047070-174 = ""
10047070-175 = ""
10047070-176 = ""
10047070-177 = ""
10047070-178 = ""
10047070-180 = ""
10047070-181 = ""
10047070-182 = ""
10047070-183 = ""
10047070-184 = ""
10047070-185 = ""
10047070-186 = ""
10047070-187 = ""
10047070-189 = "Расследование оказалось непростым..."
10047070-194 = "Ничего не выглядело так аккуратно и ясно, как мы надеялись."
10047070-195 = "Как бы мы ни пытались соединять здания, получались до смешного помятые магические круги."
10047070-196 = ""
10047070-197 = ""
10047070-198 = ""
10047070-199 = ""
10047070-200 = ""
10047070-201 = ""
10047070-202 = ""
10047070-204 = "Я уже начал думать, сколько ещё мы сможем продолжать..."
10047070-205 = ""
10047070-206 = ""
10047070-207 = ""
10047070-208 = ""
10047070-209 = "...Нашла."
10047070-210 = "Наконец-то! Я нашла расположение магического круга Вайлдханта!"
10047070-211 = ""
10047070-213 = ""
10047070-214 = ""
10047070-215 = ""
10047070-216 = ""
10047070-217 = "Э-Это серьёзно? Не просто кто-то нарисовал на старой карте?"
10047070-218 = "Ню-ху-ху, это настоящее!"
10047070-219 = "Мы не замечали его, потому что всё время пытались соединять современные здания."
10047070-220 = "Но если соединить СТАРЫЕ здания, которые стояли здесь при основании Вайлдханта, получается идеально симметричный магический круг!"
10047070-221 = "И здесь даже математика есть! Не просто магический круг, а магический КВАДРАТ!"
10047070-222 = "Если сложить последнюю цифру адреса каждого здания, через которое проходят эти линии..."
10047070-223 = "Видите! Шесть линий, каждая даёт в сумме 26! Совпадение? Не думаю!"
10047070-224 = "Это сделали намеренно! Я знала! Оккультизм встроен прямо в фундамент Вайлдханта!"
10047070-225 = "Н-Не может быть..."
10047070-226 = "Эта тайна всё это время ждала, когда её кто-нибудь обнаружит..."
10047070-227 = "Неоспоримый, настоящий магический круг. Какая магия ждёт нас... если мы его завершим?"
10047070-228 = ""
10047070-230 = ""
10047070-231 = "И всё же... Есть одна проблема."
10047070-232 = ""
10047070-234 = ""
10047070-235 = ""
10047070-236 = "Смотрите. Это современная карта академии... Она сильно изменилась."
10047070-237 = "Одни здания исчезли... Появились новые..."
10047070-238 = "Вот проблема... Новое здание построили прямо там, где проходит круг..."
10047070-239 = ""
10047070-241 = ""
10047070-242 = "*вздох* Неужели...?!"
10047070-243 = "Ой-ой."
10047070-244 = "Да... Чтобы завершить магический круг по этой карте..."
10047070-246 = "[log=카노에]Нам придётся пройти через общежитие Совета префектов.[/log]"
