[translation]
1007005-1 = "Нуар в дождливый день"
1007005-3 = "Я возвращался после того, как закончил административные дела в Шаньхайцзине..."
1007005-4 = ""
1007005-6 = "[ns] «Эти тучи...»"
1007005-8 = "*льёт дождь*"
1007005-9 = ""
1007005-12 = "[ns] «Ого, льёт как из ведра!»"
1007005-13 = "Похоже, вам пригодился бы зонтик."
1007005-14 = "[s] «Мина!»"
1007005-15 = ""
1007005-18 = ""
1007005-19 = "[ns] «Ты знала, что пойдёт дождь?»"
1007005-20 = "Хе-хе... Перед бурей у меня ноют старые боевые раны."
1007005-21 = "[s] «(Старые боевые раны, значит...?)»"
1007005-22 = ""
1007005-24 = ""
1007005-26 = "Я провожу вас домой, Сенсей. Идём?"
1007005-28 = ""
1007005-33 = ""
1007005-34 = "И мы с Миной пошли по дождливым улицам Шаньхайцзина."
1007005-35 = "На её лице едва скрывалась радость..."
1007005-36 = "[s1] «Погодка...»\n[s2] «Тебе нравится дождь, да?»"
1007005-39 = "Хм?"
1007005-40 = "Ну, видите ли…"
1007005-43 = "― [log=미나]Да... Я люблю мир дождливых дней.[/log][wa:2660]"
1007005-45 = "― [log=미나]Всё становится таким простым.[/log][wa:780]"
1007005-48 = "― [log=미나]Чёрное и белое.[/log][wa:1760]"
1007005-50 = "― [log=미나]Мир нуара...[/log][wa:170]"
1007005-53 = "― [log=미나]Настоящий мир[/log][wa:360]"
1007005-55 = "― [log=미나]такой яркий и пёстрый, что слепит глаза.[/log][wa:10]"
1007005-58 = "― [log=미나]Но большинство людей этой истины не замечают...[/log][wa:2640]"
1007005-60 = "― [log=미나]И я не исключение.[/log][wa:600]"
1007005-63 = "― [log=미나]Но мир нуара устроен иначе.[/log][wa:1940]"
1007005-65 = "― [log=미나]Его легко понять.[/log][wa:900]"
1007005-68 = "― [log=미나]Но... с другой стороны...[/log][wa:2200]"
1007005-70 = "― [log=미나]хотя бы зонтик должен быть ярким и цветным,[/log][wa:2200]"
1007005-73 = "― [log=미나]чтобы вы никогда не сбились с пути.[/log][wa:140]"
1007005-76 = ""
1007005-78 = "[ns3] «Приятно, когда есть что-то яркое, за чем можно следовать.»\n[ns4] «Мне и самому нравятся броские зонтики.»"
1007005-81 = "Правда? Именно так я отношусь к госпоже Кисaки."
1007005-82 = "[s] «В каком смысле?»"
1007005-83 = "Госпожа Кисаки — причина, по которой я вступила в Генрюмон."
1007005-84 = "Мне плевать на деньги и славу. В конце концов всё это исчезает."
1007005-85 = "Но президент... Она настоящий крутой профессионал до мозга костей!"
1007005-86 = "У неё такая харизма, что перед ней хочется преклонить колени, но она всегда готова тебя выслушать!"
1007005-87 = "И телосложение у неё просто идеальное для больших объятий. Разве это не прекрасно?"
1007005-88 = "И дело не только во мне. Большинство членов Генрюмона собрались вместе именно благодаря ей."
1007005-89 = ""
1007005-92 = "[ns] «(Не знал, что Генрюмон — это фан-клуб Кисаки...)»"
1007005-93 = "Кхм. На мгновение я потеряла самообладание. Прошу прощения."
1007005-94 = "Но да, в жизни нужен яркий цветной зонтик."
1007005-95 = "[s] «Да. Даже посреди нуара дождливой бури.»"
1007005-96 = "...Вы довольно проницательны, Сенсей."
1007005-97 = "У вас всегда находится что-нибудь интересное сказать."
1007005-98 = "И с вами можно поговорить о вещах, о которых я сама никогда бы не задумалась или которые обычно не смогла бы произнести вслух..."
1007005-99 = ""
1007005-102 = "А...? Куда вы идёте, Сенсей? Зонтик...!"
1007005-103 = "[s5] «Вообще-то мне нравится ощущение дождя.»\n[s6] «Мне захотелось петь! И танцевать!»"
1007005-106 = "..."
1007005-107 = "Понятно..."
1007005-108 = "Однажды я видела такое в старом фильме."
1007005-109 = "Сенсей, вы и правда в этом разбираетесь."
1007005-110 = "Ах... Какой прекрасный день."
1007005-111 = "Прекрасный день для степа!"
1007005-112 = "Ха-ха-ха. Ха-ха-ха!"
1007005-114 = ""
1007005-117 = "Лицо Мины просияло, и она побежала ко мне."
1007005-118 = "Мы коротали время, распевая песни и танцуя под дождём."
