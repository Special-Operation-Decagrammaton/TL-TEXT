[translation]
2601302-1 = "Невидимое, но всё ещё существующее"
2601302-2 = "А, [USERNAME] Сенсей."
2601302-3 = "Привет."
2601302-4 = "[s1] «Ты выглядишь счастливой, Ацуко.»\n[s2] «Ты выглядишь взволнованной, Ацуко.»"
2601302-7 = "Вот как?"
2601302-8 = "Я думала, что скрываю это, но..."
2601302-9 = "Похоже, вы всё-таки заметили."
2601302-10 = "Вы правы. Я довольно взволнована. Наверное, всё из-за ожидания фестиваля."
2601302-11 = "К тому же на Пляже Беззакония мне не нужно ни от кого прятаться или убегать."
2601302-12 = "У меня даже есть камера."
2601302-13 = "Мне очень понравилось фотографировать."
2601302-14 = "Возможность запечатлеть и сохранить драгоценные моменты..."
2601302-15 = "Поэтому сегодня я хотела найти хорошие места для фотографий."
2601302-16 = "Вы составите мне компанию, Сенсей?"
2601302-17 = "[s] «Конечно!»"
2601302-18 = "Тогда пойдём."
2601302-20 = "Для начала буду фотографировать всё, что привлечёт внимание."
2601302-21 = "Мне очень повезло наткнуться на эту цифровую камеру на Чёрном рынке."
2601302-22 = "Она немного старая, но по характеристикам всё ещё неплоха."
2601302-23 = "А, Сенсей. Подождите."
2601302-24 = "Мне нравится настроение той вывески."
2601302-25 = "[s] «Вывески?»"
2601302-26 = "Да. Надписи «якисоба, какигори, кукуруза...»"
2601302-27 = "Позже, глядя на эту фотографию, я вспомню сладкие запахи, шипение жарящейся еды и все вкусные блюда фестиваля."
2601302-28 = "Это будет хорошее воспоминание."
2601302-29 = ""
2601302-30 = ""
2601302-31 = "Найдём следующий объект."
2601302-33 = "Прогулка вдоль берега... Очень освежает."
2601302-34 = "А, Сенсей, смотрите под ноги! Вы чуть не наступили на рака-отшельника."
2601302-35 = "[s] «Ого. Чуть не случилось.»"
2601302-36 = "Хи-хи. Какой милый."
2601302-37 = "А теперь позируйте как следует. Это моя награда за спасение."
2601302-38 = ""
2601302-40 = ""
2601302-41 = "М-м, хороший кадр. До свидания, господин Рак-отшельник."
2601302-42 = "Возвращайтесь в океан, там безопасно."
2601302-43 = "Теперь этот момент навсегда останется на фотографии. В этом и смысл фотографии."
2601302-44 = "Что запечатлеть дальше?"
2601302-46 = "Мы с Ацуко продолжили гулять по пляжу и фестивалю, делая фотографии."
2601302-48 = "Куда ушло время...?"
2601302-49 = "[s3] «Закат очень красивый.»\n[s4] «Может, сделаем сегодня ещё один последний снимок?»"
2601302-52 = "Да, мне нравится эта идея. Где бы...? Хм..."
2601302-53 = "Ах!"
2601302-54 = ""
2601302-58 = "Моя камера!"
2601302-59 = "Какое облегчение. Мягкий песок смягчил падение."
2601302-60 = "А. Но крышка батарейного отсека открылась."
2601302-61 = "Надеюсь, внутрь не попал песок..."
2601302-62 = "...Эм..."
2601302-63 = "[s] «Гнездо для батареи... пустое.»"
2601302-64 = ""
2601302-66 = ""
2601302-67 = "А... Точно. Я собиралась вставить батарею утром, но совсем забыла."
2601302-68 = "Наверное, поэтому экран и не включался. Я просто решила, что дело в возрасте камеры..."
2601302-69 = "Получается, все фотографии, которые мы сделали сегодня..."
2601302-70 = "[s] «На самом деле ни одна не была сделана.»"
2601302-71 = ""
2601302-73 = ""
2601302-74 = "...Сегодня мне было очень весело, но всё оказалось впустую."
2601302-75 = "Подумать только, из-за одной невнимательности я ухожу ни с чем."
2601302-76 = "Вывеска, рак-отшельник и остальные сегодняшние воспоминания — всё исчезло."
2601302-77 = "...Все воспоминания, которые я создала вместе с вами, Сенсей."
2601302-78 = "[s] «...Это неправда.»"
2601302-79 = "Не... раз в жизни?"
2601302-80 = "Мне не удалось сохранить ни одного снимка..."
2601302-81 = "Я хотела потом вспоминать сегодняшний день, глядя на фотографии."
2601302-82 = "[s] «Воспоминания никуда не делись, даже без фотографий.»"
2601302-83 = ""
2601302-85 = "[ns] «То, что мы вместе наслаждались фестивалем, не изменится.»"
2601302-86 = ""
2601302-87 = "...Это правда."
2601302-88 = "Радостные воспоминания навсегда останутся в нашей памяти."
2601302-89 = "Я буду дорожить даже простыми моментами, когда мы просто разговаривали вот так."
2601302-90 = "Вы снова научили меня чему-то новому. Спасибо, Сенсей."
2601302-91 = "[s] «В следующий раз я принесу запасные батарейки.»"
2601302-92 = "Хи-хи."
2601302-93 = "Да. В следующий раз мы снова вместе исследуем фестиваль, Сенсей."
2601302-94 = "Я не повторю эту ошибку."
