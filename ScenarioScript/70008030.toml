[translation]
70008030-1 = "Свирепо! Ночь Морё! 3"
70008030-2 = "Так-так, похоже, все собрались..."
70008030-3 = "Объявляю... Ночь Морё этого года открытой!"
70008030-4 = ""
70008030-9 = ""
70008030-10 = ""
70008030-11 = ""
70008030-13 = "(Ого... Здесь все суперизвестные главари Морё... Ух, я начинаю нервничать...)"
70008030-14 = "(Неужели... я тут одета хуже всех?!)"
70008030-15 = "*шёпот* *шёпот*"
70008030-16 = "Эй, ты её видела?"
70008030-17 = "В этом году среди гостей есть одна опасная особа..."
70008030-18 = "(А-а-а...! Если даже такие высокопоставленные главари из-за неё нервничают, она, должно быть, очень важная!)"
70008030-19 = ""
70008030-21 = ""
70008030-22 = ""
70008030-23 = "Разве она не из другой группировки...?"
70008030-24 = "Я слышала, за пределами Хяккияко встречаются такие психи..."
70008030-25 = ""
70008030-29 = "Тишина! Тишина! Т-и-и-ишина!"
70008030-30 = ""
70008030-32 = ""
70008030-33 = "Сегодня мы собрались обсудить будущее Морё, а не болтать."
70008030-34 = ""
70008030-36 = ""
70008030-37 = "Все меня слышат? Хорошо, приступим. Как в последнее время обстоят дела в Хяккияко?"
70008030-38 = "Такое чувство, будто нас в последнее время совсем игнорируют... Кто-нибудь ещё?"
70008030-39 = "Это... Согласна. Мы уже не внушаем такого страха, как раньше."
70008030-40 = "Вот, например, ритуал Древа Божеств провели и даже не поставили нас в известность!"
70008030-41 = "Да-да! Имя Морё вообще перестали уважать!"
70008030-42 = "Похоже, мы все согласны."
70008030-43 = "Даже во время ритуала Древа Божеств мы едва избежали полного унижения. Однако протест Араты из Уличных Морё очень помог нашему делу, поэтому сегодня мы пригласили её сюда."
70008030-44 = "Ч-Что?! М-Меня?! Д-Да...! Ритуал Древа Божеств — фестиваль Хяккияко, а значит, и наш фестиваль... Я не могла просто позволить чужакам делать что захотят..."
70008030-45 = "Я правда помогла...? Мне запомнилось только, как Клуб Инь-Ян и Хяккарёран опять отчитывали нас за проблемы..."
70008030-46 = "Именно! Всё, что принадлежит Хяккияко, принадлежит Хяккияко, а значит — нам, Морё! Мы всего лишь защищаем своё!"
70008030-47 = "Эта высокомерная Хяккарёран состоит из шарлатанок, которые заявляют, будто «защищают» НАШУ Хяккияко! Вот именно! Хяккияко принадлежит нам, Морё!"
70008030-48 = "Точно! Всё как она сказала!"
70008030-49 = "Да-да!"
70008030-50 = "(Да, вот ради чего всё это! Вот что значит быть Морё! Я защищала традиции Хяккияко!)"
70008030-51 = "Да, мы до сих пор кое-что спускали им с рук, чтобы Клуб Инь-Ян не потерял лицо, но пора наконец решить, кто настоящий победитель этой борьбы за власть!"
70008030-52 = "Поэтому на следующем фестивале мы объявляем войну Хяккарёран!"
70008030-54 = "(...О-Объявляем войну? Ч-Что... что она имеет в виду?)"
70008030-55 = "Чёрт да! Пора показать им, кто тут главный!"
70008030-56 = "Все согласны! Хватит тянуть, начинаем!"
70008030-57 = "Хяккарёран будут наиболее уязвимы, когда рассредоточатся по фестивалю ради охраны. Вот тогда и ударим! Спрячемся среди туристов и устроим засаду!"
70008030-58 = "Мы уничтожим их всех до последней!"
70008030-59 = "Вернём то, что принадлежит нам по праву! Отвоюем фестивали и выгоним чужаков!"
70008030-60 = "Эм... разве это... не очень плохая идея?"
70008030-61 = "...Кто это сказал?"
70008030-62 = ""
70008030-65 = ""
70008030-66 = ""
70008030-67 = "Ч-Что...? Н-Не толкайтесь! Ну... да... Э-Это была я."
70008030-68 = "Арата. От тебя, открыто выступившей против ритуала Древа Божеств, я меньше всего ожидала такой слабости."
70008030-69 = "Нет, тогда всё было совсем иначе! ...Ну, вроде того."
70008030-70 = "Они же на этом фестивале вроде ничего плохого не делают... и все жители так стараются его подготовить... Не поймите неправильно, мне тоже хочется проучить этих придурков из Хяккарёран не меньше любой Морё... Просто..."
70008030-71 = "Пострадает куча вообще ни в чём не виноватых людей, понимаете? Это как-то..."
70008030-72 = "Ты что, называешь НАС злодеями?! Ну, технически мы и есть злодеи, но не обязательно говорить это вслух! Я чувствительная!"
70008030-73 = "И ты собралась отступить, наконец-то добравшись сюда?!"
70008030-74 = "Я разочарована, Арата. А я надеялась, именно ты поведёшь их за собой."
70008030-75 = "Но раз уж ты услышала наши планы, просто отпустить тебя мы не можем."
70008030-76 = "Ч-Что?! Нет! Отойдите! Кто-нибудь, помогите!!"
70008030-77 = ""
70008030-81 = "Мы всё слышали!"
70008030-82 = ""
70008030-84 = ""
70008030-85 = "Ниндзя Изуна пришла остановить ваш злой заговор!"
70008030-87 = "Ниндзя?! НИНДЗЯ?!"
70008030-88 = "Я-Я слышала о них! Говорят, Клуб Инь-Ян тренирует тайных агентов, но я не думала, что это ниндзя!"
70008030-90 = "Ня-ха-ха! Именно так! Хорошая у тебя разведка!"
70008030-91 = "Нет ничего веселее — то есть лучше — чем внезапное появление ниндзя, которое оживляет скучную историю."
70008030-92 = "Президент Клуба Инь-Ян, Амачи Ния! Как ты смеешь врываться сюда?! Ты обязана сохранять абсолютный нейтралитет!"
70008030-93 = "Понятия не имею, о чё-ё-м вы. Я просто проверяла, всё ли у нас готово к следующему фестивалю, а мой прелестный младший студент пришёл расследовать!"
70008030-94 = "Т-Ты думаешь, такая очевидная ложь сойдёт тебе с рук?!"
70008030-95 = "Какая наглость — врываться на наше собрание и рассчитывать уйти невредимой! Даже Клуб Инь-Ян и Хяккарёран не выстоят против всей мощи Морё!"
70008030-96 = "Динь-динь-динь! Именно поэтому мы здесь!"
70008030-97 = "Я вполне не против одной-двух милых бездомных собачек, но терпеть целую волчью стаю не намерена."
70008030-98 = "Ха-йя! Техника Изуны «Не шалить»!"
70008030-99 = "П-Подожди, по меркам Морё я не настолько уж шальная!"
70008030-100 = "Она одна! Сделайте что-нибудь! КЯ-А-А!"
70008030-101 = "Ой, они и правда довольно милые, даже такой недособранной стаей. Ня-ха-ха! Что ж, у меня ещё дела, так что прошу меня извинить."
70008030-102 = ""
70008030-104 = ""
70008030-105 = "Президент Клуба Инь-Ян...! Ах ты мелкая...!"
70008030-106 = "П-Плохие новости, Верховная главарь! Это Хяккарёран! Хяккарёран пришли!"
70008030-108 = "Что?! Сначала ниндзя, теперь Хяккарёран?! Я на такое не подписывалась! Я ухожу!"
70008030-109 = ""
70008030-111 = ""
70008030-112 = "Бежим все! Бежим!"
70008030-113 = ""
70008030-115 = ""
70008030-116 = ""
70008030-117 = ""
70008030-118 = ""
70008030-119 = ""
70008030-120 = "П-Подождите! Нас так много, если мы объединим силы—"
70008030-121 = "Попалась! Злодейка-кукловод! Ха-йя!"
70008030-122 = "Ай! Уа-а-а! Я так старалась всех собрать!"
70008030-123 = "Да ну всё это! Отменяем план!"
70008030-124 = ""
70008030-126 = ""
70008030-135 = "*тяжело дышит* *тяжело дышит* Еле выбралась."
70008030-136 = "Что... вообще произошло? Я всего лишь хотела стать настоящей Морё... а в итоге всё как обычно... За мной гнались... и пришлось убегать..."
70008030-137 = "И Ночь Морё, которую я так ждала, вообще оказалась не такой уж крутой..."
70008030-138 = "Где всё пошло не так...?"
70008030-139 = "Эй, ты."
70008030-140 = "А, я знаю этот голос!"
70008030-141 = "Та, что одолжила мне свою крутую маску!"
70008030-142 = "ОДОЛЖИЛА?! Ты просто подбежала и стащила её у меня с головы!"
70008030-143 = "И что бандитке в шлеме делать без шлема?! Повезло, что у меня был запасной!"
70008030-144 = "Эй, ты ведь его не повредила? Этот шлем для меня очень важен."
70008030-145 = "О. Ни царапины. Держи."
70008030-146 = ""
70008030-148 = ""
70008030-149 = ""
70008030-150 = "О-О. Хм, это оказалось проще, чем я думала... и, похоже, ты хорошо с ним обращалась."
70008030-151 = ""
70008030-153 = ""
70008030-154 = ""
70008030-155 = "...Я гналась за тобой, чтобы отомстить."
70008030-156 = "Но ты выглядишь такой несчастной... У меня вообще пропало желание."
70008030-157 = "СТАРШАЯ СЕСТРЁ-Ё-ЁНКА!"
70008030-158 = "Кого ты сестрёнкой называешь?!"
70008030-159 = "Что значит быть Морё?"
70008030-160 = "Морё? Что ещё за «Морё»? О чём ты вообще?"
70008030-161 = "Так и знала..."
70008030-162 = ""
70008030-164 = ""
70008030-165 = ""
70008030-166 = ""
70008030-167 = "Слушай, я ничего не знаю про ваших Морё, но вы, мелкие, живёте тут как хотите, да? Это сразу видно."
70008030-168 = "Так чего ты всё усложняешь? Просто наслаждайся жизнью."
70008030-169 = "Наслаждаться... жизнью?"
70008030-170 = "Ну да. Вы ведь всем этим занимаетесь потому, что вам не нравятся учёба, клубы и прочая нормисная чушь, верно?"
70008030-171 = "Да... это правда..."
70008030-172 = "Тогда чего переживать? Делай то, что хочется, и не делай того, чего не хочется."
70008030-173 = "Хм... Правда? Кажется, в этом есть смысл... Хм..."
70008030-174 = "...Эй."
70008030-175 = "А теперь тебе придётся отплатить мне за то, что ты взяла... то есть одолжила мой шлем."
70008030-176 = "Что?! У-У меня нет денег!"
70008030-177 = "Эй! Я тебе не какая-то обычная бандитка! Ну... вроде как, но всё равно не надо так со мной. Денег не хочу. Мы с подругами впервые в Хяккияко, так что... покажи нам окрестности."
70008030-178 = "Мы вообще не знаем, где тут самые крутые места."
70008030-179 = "Что? Вы впервые в Хяккияко? Значит, вы ещё не были на смотровой площадке Древа Божеств?"
70008030-180 = "А? Это то гигантское дерево? Там есть смотровая площадка?"
70008030-181 = "Да ладно! Нельзя говорить, что побывала в Хяккияко, если не видела смотровую площадку!"
70008030-182 = "Пошли! Прямо сейчас!"
70008030-183 = "Ч-Что? Я рада, что тебе полегчало, но неужели всё было настолько просто?"
70008030-184 = "Хватит время терять!! Закат со смотровой очень красивый, но вид днём тоже обязательно надо увидеть!"
70008030-185 = "Быстрее!! За мной, старшая сестрёнка!!"
70008030-186 = "Хватит звать меня сестрёнкой!!"
70008030-188 = "Почти никто, включая Арату, уже не помнит, что изначально слово «Морё» означало людей, полностью свободных и ничем не связанных."
70008030-189 = "Возможно, Арата, которая каждую минуту ищет новые развлечения, и есть самая настоящая Морё из всех."
70008030-190 = "Свирепо! Ночь Морё!"
