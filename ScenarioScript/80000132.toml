[translation]
80000132-1 = "Подзарядка маны для Мастера"
80000132-2 = "Этим утром произошло нечто волшебное."
80000132-3 = ""
80000132-4 = ""
80000132-5 = "Мастер! Вы ведь сегодня собираетесь посетить Вайлдхант?"
80000132-6 = "Тогда я очень хочу кое-что вам передать!"
80000132-7 = "Ню-ху-ху, встретимся в секретном месте! Ну, вы знаете!"
80000132-9 = "И я прибыл в уединённый парк Вайлдхант."
80000132-10 = ""
80000132-12 = "Уединённый парк"
80000132-13 = ""
80000132-14 = "О. Здравствуйте, Мастер! Вы пришли раньше, чем я предвидела!"
80000132-15 = "[s] «Зачем ты попросила прийти сюда?»"
80000132-16 = "Потому что... После долгих размышлений и исследований я поняла, что ЭТО идеальное место, чтобы встретиться и синхронизировать нашу ману!"
80000132-17 = "В других местах слишком людно. Наши магические поля неизбежно утонули бы в помехах."
80000132-18 = "[s] «Хм...? Проще говоря, ты хотела встретиться со мной наедине?»"
80000132-19 = "И-Именно!"
80000132-20 = "Как и ожидалось от Мастера. Вы быстро понимаете."
80000132-21 = "И теперь, когда мы только вдвоём...!"
80000132-22 = "...я могу снять это, правда?"
80000132-23 = "[s] «...Что?!»"
80000132-24 = "Мастер. Я хочу показать вам свою решимость. Искренность! Моё настоящее магическое сердце!"
80000132-25 = "...Я!"
80000132-26 = ""
80000132-30 = "Хя-а-а...!"
80000132-31 = ""
80000132-36 = ""
80000132-37 = ""
80000132-38 = ""
80000132-39 = "Я-я знаю, что делаю это ради вас, но снимать это на улице... Т-Так неловко."
80000132-40 = "[s] «Эм... Эри?»"
80000132-41 = "П-Простите, странно, да? Я знаю, но...!"
80000132-42 = "Для меня это почти как быть голой."
80000132-43 = "Ух, когда я репетировала с членами Оккультного общества, всё было нормально..."
80000132-44 = "[s] «Перед ними тебе не стыдно?»"
80000132-45 = "Ну, мы достаточно близки, чтобы вместе мыться в общественных банях..."
80000132-46 = "Так что снять шляпу..."
80000132-47 = "...для НИХ это не казалось чем-то особенным."
80000132-48 = "...А?! Я-я не имела в виду ничего другого! Никакого скрытого смысла. Это была... МАНА!"
80000132-49 = "[s] «Н-Не нужно себя заставлять! Можешь надеть обратно!»"
80000132-50 = "Н-Но я пришла сюда с такой решимостью...!"
80000132-51 = "Кроме того, для эффективной передачи магии ничто не должно мешать..."
80000132-52 = "..."
80000132-53 = "В-Всё хорошо, я справлюсь...!"
80000132-54 = "Фух..."
80000132-55 = "Т-Тогда, Мастер!"
80000132-56 = ""
80000132-58 = ""
80000132-59 = ""
80000132-60 = "Эти... шоколадки наполнены моей силой."
80000132-61 = "Я сделала их собственной магией. Не полагалась ни на силу шляпы, ни на КАКИЕ-ЛИБО внешние силы."
80000132-62 = "Поэтому подумала, что будет неправильно вручать их вам в шляпе—"
80000132-63 = "...М-Мастер?"
80000132-64 = "[s] «О-о, я чувствую себя сильнее, просто глядя на них!»"
80000132-65 = "П-Правда?"
80000132-66 = "Т-Тогда, эм..."
80000132-67 = "Можно попросить вас сказать «а-а»...?!"
80000132-68 = "[s] «Так вот что значит „подзарядить ману“!»"
80000132-69 = "В-Вы правы!"
80000132-70 = "Не могу поверить, что вы снова меня раскусили... Вы впечатляете, Мастер."
80000132-71 = "Я не выдержу. Без полей шляпы моё лицо совсем открыто."
80000132-72 = "Но я попробую! Ради вас. Готовы?"
80000132-73 = "[s] «Готов в любое время!»"
80000132-74 = "Т-Тогда начинаю!"
80000132-75 = "Для начала..."
80000132-76 = ""
80000132-78 = ""
80000132-79 = ""
80000132-80 = "...ш-шоколадка в форме звезды?"
80000132-84 = ""
80000132-85 = "[ns] «О, сладко, и что-то потрескивает!»"
80000132-86 = "Хи-хи... В звёздочки я добавила шипучие конфеты."
80000132-87 = "Берите одну, если начнёте засыпать..."
80000132-88 = "[s] «А какая на вкус сердечком?»"
80000132-89 = "Это... Может, попробуете сами?"
80000132-90 = "П-Пожалуйста...!"
80000132-93 = ""
80000132-94 = "[ns] «Э-Этот вкус...?!»"
80000132-95 = "...Он был сладким и кисловатым."
80000132-96 = "Почему-то мне показалось, что истощённая мана восполняется...!"
80000132-97 = "П-Понравилось?"
80000132-98 = "В сердечки... я добавила немного витаминов. Совсем немного! Ничего безумного!"
80000132-99 = "Так что это шоколад... и одновременно пищевая добавка."
80000132-100 = "Просто... вы ведь всегда заняты, Мастер?"
80000132-101 = "Даже нормально поесть не успеваете, а иногда не спите всю ночь."
80000132-102 = "Ух, мне грустно даже думать об этом..."
80000132-103 = "Так что в такие моменты съедайте шоколадное сердечко и думайте обо мне."
80000132-104 = "Уверена, оно восполнит вашу истощённую ману!"
80000132-105 = "[s1] «Как это заботливо, Эри...»\n[s2] «Хочу прямо сейчас проглотить их все!»"
80000132-108 = "Н-Нельзя так много!"
80000132-109 = "Если перезарядить ману, может произойти взрывная перегрузка."
80000132-110 = "[ns] «Хорошо! Запомню!»"
80000132-112 = "[ns] «А ты тоже хочешь попробовать, Эри?»"
80000132-114 = ""
80000132-115 = "Э-Это обратная подзарядка маны... от Мастера...?!"
80000132-116 = "Тогда она должна быть в два раза эффективнее обычной!"
80000132-117 = "Т-Тогда оставляю всё вам, Мастер!"
80000132-119 = "Я убедился, что Эри счастлива и полностью заряжена маной."
