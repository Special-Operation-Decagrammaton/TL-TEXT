[translation]
1300306-1 = "Корень стресса"
1300306-2 = "Магазин в пригороде Тринити"
1300306-3 = "Эй, Сенсей."
1300306-4 = "Нам нужно перестать так встречаться."
1300306-5 = "[s] «Хасуми...? Что ты здесь делаешь?»"
1300306-6 = "Разве не очевидно? Мне что, нельзя здесь покупать вещи?"
1300306-7 = "...Я на тебя сорвалась?"
1300306-8 = "Ох... Прости. Я пытаюсь отказаться от десертов."
1300306-9 = "Из-за этого я очень напряжённая и раздражительная."
1300306-10 = "А нынешняя нагрузка Отряда справедливости только ухудшает ситуацию..."
1300306-11 = "У меня даже начали болеть голова."
1300306-12 = "..."
1300306-13 = "...Но я в порядке."
1300306-14 = "[s] «На вид не очень.»"
1300306-15 = "Правда...?"
1300306-16 = "Если я продолжаю беспокоить окружающих, какой вообще смысл в этой диете?"
1300306-17 = "[s] «Почему бы не бросить диету, если она вызывает столько стресса?»"
1300306-18 = "Думаешь, стоит?"
1300306-19 = "Но я..."
1300306-20 = "Немного стыдно признавать, но я теряю уверенность, когда вижу других девушек в их изящной форме..."
1300306-21 = "Эм... Можно спросить..."
1300306-22 = "Ты не хочешь, чтобы я сидела на диете, Сенсей?"
1300306-23 = "[s1] «Ты нравишься мне такой, какая ты есть, Хасуми.»\n[s2] «Ты прекрасна такой, какая есть.»"
1300306-24 = "..."
1300306-25 = "..."
1300306-26 = "Понятно."
1300306-27 = "...Ты правда так считаешь?"
1300306-28 = "Хи-хи. Головная боль внезапно прошла."
1300306-29 = "Пойдём. Я знаю неподалёку отличную пекарню."
1300306-30 = ""
1300306-31 = ""
1300306-32 = "Именно ты сказал мне бросить диету. Значит, теперь обязан пойти со мной и пробовать десерты."
1300306-34 = "После этого мы отправились в пекарню и наелись до отвала."
