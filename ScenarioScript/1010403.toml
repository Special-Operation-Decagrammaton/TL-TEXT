[translation]
1010403-1 = "Корректировка отношения"
1010403-2 = "Главный ресторан Променада Чёрной Черепахи"
1010403-4 = "Вам понравилась еда, Сенсей?"
1010403-5 = "[s1] «Было лучше всего!»\n[s2] «Но я хочу попробовать твою готовку.»"
1010403-6 = "Вот как? Я рада. Знаю, это стандартная фраза, но..."
1010403-7 = "...я действительно надеюсь, что вы снова посетите Променад Чёрной Черепахи."
1010403-8 = "Вы сказали... мою готовку?"
1010403-9 = "Я уже некоторое время работаю управляющей Променада, а не поваром..."
1010403-10 = "Хорошо. Как-нибудь я найду возможность приготовить вам что-нибудь в Шале."
1010403-11 = ""
1010403-14 = ""
1010403-15 = "Ч-Чрезвычайная ситуация! Один из наших ресторанов до сих пор не получил сегодняшние ингредиенты!"
1010403-16 = "Какой ресторан?"
1010403-17 = "«Сад Цзинхуа» в западной части Хо Туй!"
1010403-18 = "«Сад Цзинхуа»... Я знаю, где это. Хорошо."
1010403-19 = "Ч-Что нам делать? Говорят, такими темпами они никак не успеют подготовиться к дневной смене!"
1010403-20 = "Пока отправим им экстренный запас со склада главного ресторана."
1010403-21 = "Конечно, это даст нам лишь немного времени — часа три... скорее максимум два."
1010403-22 = "Я перенаправлю весь оставшийся транспортный персонал к Синьсинлоу №3 на улице Хунцзин. Там должно быть два свободных грузовика. Связь возьму на себя."
1010403-23 = "Поскольку Синьсинлоу сегодня закрыт, они смогут поделиться лишними ингредиентами."
1010403-24 = "Так как это чрезвычайная ситуация, главный ресторан пока покроет расходы. Но после закрытия обязательно возьмите с них оплату."
1010403-25 = "Есть! Поняли!"
1010403-27 = "*вздыхает* Как-то разобрались."
1010403-28 = ""
1010403-30 = ""
1010403-31 = "Это Променад Чёрной Черепахи в Шаньхайцзине?"
1010403-32 = "Мне всё равно что, просто принесите самое вкусное блюдо, какое у вас есть!"
1010403-33 = ""
1010403-35 = "Ч-Что? Ну, это..."
1010403-36 = ""
1010403-38 = ""
1010403-39 = ""
1010403-40 = "Разумеется. Для начала позвольте проводить вас к столу. Сюда, пожалуйста."
1010403-42 = "Большое спасибо, что сегодня посетили Променад Чёрной Черепахи."
1010403-43 = "Раз вы попросили что-то особенное, я хотела бы предложить специальное блюдо от шефа. Вас это устроит?"
1010403-44 = "Это есть в меню? Я ничего такого не видел!"
1010403-45 = "Именно поэтому оно особенно — только для вас."
1010403-46 = "У-У нас есть такое блюдо?"
1010403-47 = "Нет. Но удовлетворять потребности клиента — часть управления рестораном."
1010403-49 = "Хм? Что-то случилось?"
1010403-50 = "Вовсе нет. Шеф сообщил, что сегодня особое блюдо — сет с морским ушком."
1010403-51 = "Морское ушко! Да ещё целый сет! Жду с нетерпением!"
1010403-53 = "Р-Разве это не будет слишком дорого?!"
1010403-54 = "Гость с самого начала сказал, что хочет только лучшее из лучшего."
1010403-55 = "Такие клиенты хотят чувствовать себя в роскоши. «Доступное» блюдо их только оскорбит."
1010403-56 = "Мы немедленно подадим вам сет, уважаемый гость."
1010403-57 = "Быстро сообщите на кухню."
1010403-59 = "Есть! Поняли!"
1010403-60 = ""
1010403-62 = ""
1010403-64 = "Ах, боже. Сегодня ещё хаотичнее обычного. И Сенсей здесь."
1010403-65 = ""
1010403-68 = "Я же сказал, что уже заплатил!"
1010403-69 = ""
1010403-71 = ""
1010403-73 = ""
1010403-74 = "Но..."
1010403-75 = "Я вижу, что вы делаете! Пытаетесь меня обмануть!"
1010403-76 = ""
1010403-78 = ""
1010403-81 = ""
1010403-82 = "В чём здесь проблема?"
1010403-83 = "Я уже заплатил через ваше приложение, а официантка говорит, что платёж не прошёл! Она хочет заставить меня платить дважды!"
1010403-84 = "И это знаменитый сервис Променада Чёрной Черепахи?"
1010403-85 = "Но мы—"
1010403-87 = "Я полностью понимаю ваше недовольство. Если произошла ошибка, приношу искренние извинения от лица всех сотрудников."
1010403-88 = "Согласно стандартной процедуре, не могли бы вы немного подождать, пока я проверю камеры и уточню информацию у платёжной компании?"
1010403-89 = "Всегда лучше подтвердить детали, чтобы все стороны чувствовали себя спокойно и уверенно."
1010403-90 = "А...? Камеры...? Данные транзакции...?"
1010403-91 = "Чтобы обеспечить лучший сервис всем клиентам, в главном ресторане Променада Чёрной Черепахи камеры установлены по всему помещению."
1010403-92 = "Это займёт всего около пяти минут. Заодно я подтвержу данные транзакции."
1010403-93 = ""
1010403-95 = ""
1010403-96 = "Эм. Раз уж вы сказали... может, я просто неправильно открыл приложение... или что-то такое..."
1010403-97 = "Не хотелось бы доставлять вам столько хлопот..."
1010403-98 = "О нет. Совсем нет. Наша обязанность — правильно разбираться с такими ситуациями."
1010403-99 = "Разумеется, все наши камеры имеют встроенную функцию записи. Если это имеет значение."
1010403-100 = "З-Записи?!"
1010403-101 = "Да, просто решила упомянуть. На всякий случай. Вы хорошо себя чувствуете, уважаемый гость? Что-то не так?"
1010403-102 = "А-А, ничего! Правда ничего!"
1010403-104 = "Простите, Сенсей. Сегодня такой хаос."
1010403-105 = "[s] «Я впечатлён...»"
1010403-106 = "Ч-Что?! О чём вы?"
1010403-107 = "Вы... считаете, что я потрясающе разобралась со всеми этими ситуациями?"
1010403-108 = "Спасибо за комплимент, но для работы на Променаде это обычное дело."
1010403-109 = "...Хотя не каждый день настолько забит срочными проблемами."
1010403-110 = "А самое важное событие дня ещё даже не началось, а мы уже по уши заняты."
1010403-111 = "[s] «Что за событие?»"
1010403-112 = "Не знаю, имею ли я право это разглашать..."
1010403-113 = "Ну, у нас групповое бронирование от Сада Цветущей Сливы."
1010403-114 = "Неловко признавать..."
1010403-115 = "...но мне трудно ладить с детьми."
1010403-116 = "[s] «С ними никому не просто.»"
1010403-117 = "Спасибо, что понимаете, Сенсей."
1010403-118 = "Дети милые и невинные... но в отличие от обычных клиентов они довольно упрямые и настойчивые."
1010403-119 = "А? Вы поможете мне, насколько сможете, Сенсей? Но..."
1010403-120 = "А. Хорошо. Наверное, иногда можно принять помощь."
1010403-121 = "Спасибо, Сенсей. Я рассчитываю на вас."
1010403-123 = "Сенсей, Сенсей! Смотрите сюда! Этот кальмар похож на цветок! Разве не здорово?"
1010403-124 = "[s] «Да. Повар специально так его нарезал.»"
1010403-125 = "Эй, Сенсей. Я слышала, есть такие штуки — сосиски-осьминожки. Почему их здесь нет?"
1010403-126 = "Сосиски-осьминожки делают из осьминогов? Я не люблю осьминогов... Их тяжело есть!"
1010403-127 = "[s] «Это обычные сосиски, просто нарезанные в форме осьминога.»"
1010403-128 = "О, правда? Тогда хочу попробовать! Вы не врёте, Сенсей? Только не врите!"
1010403-129 = "Однажды в школе нам сказали, что на обед вкусный жареный рис с говядиной... а там были перец и брокколи!"
1010403-130 = ""
1010403-132 = ""
1010403-133 = "Я впечатлена, Сенсей. Вы действительно хорошо ладите с детьми."
1010403-134 = "Если не возражаете... можете... научить меня?"
1010403-135 = "[s3] «Тут не так уж многому можно научить.»\n[s4] «Но знаешь, тебе не обязательно решать их проблемы.»"
1010403-138 = "А? Разве проблемы не нужно решать? Что вы имеете в виду?"
1010403-139 = "Некоторые вещи могут решиться сами... если я просто выслушаю?"
1010403-140 = "...Я никогда об этом не думала."
1010403-141 = "[s] «Хочешь попробовать, Рэйдзё?»"
1010403-142 = ""
1010403-144 = ""
1010403-145 = "Да. В конце концов, это моя обязанность."
1010403-146 = ""
1010403-149 = ""
1010403-150 = ""
1010403-151 = "Я люблю креветочные пельмешки! И свиные!"
1010403-152 = "Я люблю обычные, жареные на сковороде, жареные во фритюре..."
1010403-153 = "Подождите... а какие тогда мои любимые?"
1010403-154 = "Е-Если не можешь выбрать любимые, может, тебе нравятся все?"
1010403-155 = "О боже, точно! Но! Пельмешки с водорослями мне не нравятся. Они все склизкие!"
1010403-156 = "Может, это вообще не пельмешки...?"
1010403-157 = ""
1010403-159 = ""
1010403-160 = "...Грустно, что культура питания вне дома так процветает. Ведь это доказательство того, что ни у кого больше нет времени готовить."
1010403-161 = "Ты ешь в ресторане, чтобы сэкономить время, но часто сэкономленное время просто уходит на ещё больше работы."
1010403-162 = "Даже работодатели не свободны от этой проблемы. В итоге система определяет всё."
1010403-163 = "А... С вашим блюдом что-то не так...?"
1010403-164 = "Возможно, именно то, что с ним всё в порядке, и делает всё ещё печальнее."
1010403-166 = "...Наконец-то всё закончилось."
1010403-167 = "Дети всё пытались залезть на меня и играть в прятки, и это немного пугало..."
1010403-168 = "[s] «Это просто значит, что им рядом с тобой комфортно.»"
1010403-169 = "Да... Они сказали, что хотят снова нас навестить."
1010403-170 = "Для человека из сферы обслуживания это всегда приятно слышать."
1010403-171 = ""
1010403-173 = ""
1010403-174 = "Это был интересный опыт. Во многих смыслах."
1010403-175 = "Спасибо, Сенсей."
1010403-176 = "[s] «Не думаю, что сделал много.»"
1010403-177 = "Вам может так казаться, но для меня ваша помощь изменила всё."
1010403-178 = "Буду ждать вашего следующего урока, Сенсей."
