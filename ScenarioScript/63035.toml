[translation]
63035-1 = "Эпизод 3;Ангел, трубящий в трубу"
63035-3 = ""
63035-4 = "Аргх!"
63035-5 = "[ns] «Саори!»"
63035-6 = "Саори!"
63035-7 = "Я в порядке. Просто царапина."
63035-8 = "...По тебе не скажешь, но раз ты так говоришь, Лидер."
63035-9 = "Но серьёзно, что нам с этим делать? Мы никогда даже не дрались ни с чем подобным, не говоря уже о победе."
63035-10 = "А эта штука вообще совершенно другого уровня..."
63035-13 = ""
63035-14 = "Хм...? Труба? Та самая, о которой вы говорили?"
63035-15 = "Да, она! Н-Но... почему небо вдруг так потемнело...?"
63035-17 = "Секунду назад был самый разгар дня!"
63035-18 = "Что... Что происходит...?"
63035-23 = ""
63035-24 = ""
63035-25 = "Почему внезапно наступила ночь?"
63035-26 = "Я-Я это знаю! Я читала в Писании...!"
63035-27 = "«Поражена была третья часть солнца, и третья часть луны, и третья часть звёзд, так что третья часть их затмилась»."
63035-28 = "«И третья часть дня была без света, равно как и третья часть ночи»."
63035-34 = "Труба... Это труба..."
63035-35 = "Получается шесть...!"
63035-36 = "Странно. Почему мы снова её слышим?"
63035-37 = "Ты права. Такими темпами получится не семь труб, а все четырнадцать..."
63035-40 = ""
63035-41 = "П-Почему всё потемнело? Что... происходит...?"
63035-42 = "Остановись, Субару! О чём ты думаешь?! Что с тобой случилось?!"
63035-43 = ""
63035-45 = ""
63035-46 = "...В общем-то очевидно, но, похоже, она тебя не слышит, Лидер."
63035-47 = "..."
63035-48 = "Субару!"
63035-49 = "СУБАРУУУ!!"
63035-50 = ""
63035-52 = ""
63035-53 = ""
63035-54 = "..."
63035-55 = "Ч-Что... это...?"
63035-56 = "Как... ты оказалась здесь?"
63035-57 = ""
63035-58 = "В смысле? Она всё это время была здесь."
63035-59 = "Здесь, с нами."
63035-60 = "Почему ты раньше её не видела?"
63035-61 = "Потому что никогда не пыталась смотреть."
63035-62 = "Разве не так, Субару?"
63035-63 = "Или теперь, когда ты сама стала явлением, нам стоит называть тебя «Ангелом, трубящим в трубу»?"
63035-64 = "Ацуко? Что происходит?"
63035-65 = "Раньше я лишь предполагала, но теперь уверена."
63035-66 = "Не волнуйся. Я объясню всё с самого начала."
63035-67 = "И в этих обстоятельствах позволь мне кое-что предельно ясно сказать."
63035-68 = "Ты здесь не единственная, кто принадлежит Ариусу, Субару."
63035-70 = "Следующий Эпизод;Королевская кровь"
