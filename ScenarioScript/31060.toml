[translation]
31060-1 = "Эпизод 6;Растопить лёд"
31060-2 = "Класс Клуба дополнительных занятий"
31060-3 = "(Участницы Клуба дополнительных занятий кратко представились.)"
31060-4 = "Вот и вся ситуация. Это временная мера, но давайте постараемся извлечь из неё максимум."
31060-5 = "[s] «Рад со всеми познакомиться.»"
31060-6 = "..."
31060-7 = "..."
31060-8 = "..."
31060-9 = ""
31060-11 = "Эм... есть вопросы?"
31060-12 = "Нет. Помимо обычных занятий мы должны проходить специальную подготовку после уроков. Всё ясно."
31060-13 = "В целом да. Цель — чтобы каждая из нас сдала специальный академический аттестационный экзамен..."
31060-14 = "Н-Нам не обязательно сдавать на отлично — главное не провалить... Сенсей тоже будет делать всё, чтобы помочь."
31060-15 = "Экзамен можно будет сдавать три раза. Но если пройдём первый, остальные уже не нужны. Значит, дополнительные занятия закончатся раньше!"
31060-16 = "Роль Сенсея — руководить и следить за нами, проверять расписание. Ещё мы можем обращаться за дополнительными уроками по обычным предметам."
31060-17 = "Поняла. Наша цель — вместе выполнить эту миссию. Для этого мы должны ежедневно собираться здесь и тренироваться."
31060-18 = "По сути, здесь собрались те, кто пытается избежать позорного увольнения. Не вижу причин саботировать такой порядок."
31060-19 = "Именно! О, кстати... ты ведь перевелась сюда совсем недавно, да, Азуса?"
31060-20 = "Наверное, ещё привыкаешь к академии. Если будешь усердно заниматься с Сенсеем, быстро закончишь дополнительные занятия."
31060-21 = "О? Мисс Ширасу — переведённый студент?"
31060-22 = "В Тринити редко кто переводится..."
31060-23 = "..."
31060-24 = "Ну, по крайней мере, так было написано в твоём деле... Ой. Ты не хотела, чтобы я об этом рассказывала?"
31060-25 = "Нет, скрывать правду бессмысленно. Не переживай."
31060-26 = "Адаптация — лишь вопрос достаточных усилий."
31060-27 = "Хм..."
31060-28 = "Ты не против, если я буду звать тебя Азуса?"
31060-29 = "Нет. С чего бы мне возражать?"
31060-30 = "Чудесно! Мои одноклубницы Азуса, Хифуми и Кохару. Звучит приятно. Мы солдаты в окопах дополнительных занятий."
31060-31 = "Можешь изображать ледяную королеву, Азуса, но я вижу, что у тебя есть и милая сторона. Хи-хи."
31060-32 = ""
31060-33 = ""
31060-34 = ""
31060-36 = ""
31060-37 = "..."
31060-38 = "Что-то не так. Почему-то Кохару смотрит на нас так, будто ненавидит!"
31060-39 = "Вы все... За что мне это? Я отказываюсь принимать такое!"
31060-40 = "Ч-Что...?"
31060-41 = "Что именно ты отказываешься принимать?"
31060-42 = "Я-я элитный член Комитета правосудия!"
31060-43 = "Н-Не смейте смотреть на меня свысока только потому, что я единственная первокурсница!"
31060-44 = "Я скоро вылечу из этого дурацкого Клуба дополнительных занятий, так что даже не привязывайтесь!"
31060-45 = "Хм. В этом есть смысл. Не вижу причин относиться друг к другу иначе из-за курса. Меня устраивает."
31060-46 = "Меня тоже. Я всё равно не привыкла к такой культуре."
31060-47 = "К тому же каждая из нас здесь ради собственной выгоды, так что не вижу смысла притворяться подругами."
31060-48 = "Ну..."
31060-49 = "Отлично! Вообще-то я скрывала от вас один секрет..."
31060-50 = "Причина моих провалов в том, что я сдавала экзамены второго курса, чтобы перескочить через год!"
31060-51 = "Перескочить курс? Зачем?"
31060-52 = "Зачем?! Потому что я стану асом Комитета правосудия!"
31060-53 = "Эм, но ведь именно поэтому ты и провалилась, да? Один раз ещё понятно, но зачем продолжать после провала?"
31060-54 = "З-Заткнись! Не в этом дело!"
31060-56 = "Главное, что я скрывала свою настоящую силу."
31060-57 = ""
31060-59 = ""
31060-61 = "На этот раз я буду сдавать экзамен первого курса! Я точно получу награду за отличные результаты, да?"
31060-62 = ""
31060-64 = ""
31060-66 = "А после этого — прощай, Клуб дополнительных занятий!"
31060-67 = "Никто не говорил, что дополнительные занятия заканчиваются, если получишь награду за отличные результаты..."
31060-68 = "Ты сдерживалась? Понятно. Кстати, я тоже буду сдавать экзамен первого курса."
31060-69 = "К-Какая разница? После следующего экзамена я покидаю Клуб дополнительных занятий! Увидимся, приятно было познакомиться — вот и всё!"
31060-70 = "Я всё рассчитала, так что делайте вид, будто меня здесь никогда не было! Пока! А-ха-ха-ха!"
31060-71 = "И удачи!"
31060-72 = ""
31060-74 = "О-Она правда ушла..."
31060-75 = "Разве перепады настроения Кохару не милейшие?"
31060-76 = "А с другой стороны, очаровательно, как Азуса вообще не меняется."
31060-77 = ""
31060-78 = ""
31060-79 = "Эм..."
31060-80 = "Кажется, мне здесь понравится. Хи-хи."
31060-82 = "(С этого дня Клуб дополнительных занятий собирался каждый день на уроки после школы.)"
31060-84 = "Следующий эпизод;Подготовка к экзамену"
