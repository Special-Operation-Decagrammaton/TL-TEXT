[translation]
31060-1 = "Episódio 6;Vamos nos apresentar!"
31060-2 = "Clube de Aulas de Reforço - Sala de Aula"
31060-3 = "(Depois disso, fizemos uma breve apresentação pessoal e do Clube de Aulas de Reforço.)"
31060-4 = "Bom, então é isso... Será por pouco tempo, mas conto com a colaboração de todas daqui em diante."
31060-5 = "[s] \"Prazer em trabalhar com vocês.\""
31060-6 = "..."
31060-7 = "..."
31060-8 = "..."
31060-11 = "H-Hum, se tiverem alguma dúvida ou algo que queiram perguntar..."
31060-12 = "Sem problemas. Basicamente, além das aulas normais, teremos treinamento especial todos os dias depois das aulas, certo?"
31060-13 = "Hum, não sei se 'treinamento' é a palavra certa, mas é isso mesmo. O nosso objetivo é que \"todas sejam aprovadas ao mesmo tempo\" no Exame Especial de Aptidão Acadêmica que está por vir."
31060-14 = "O Sensei também vai nos ajudar, então v-vamos dar o nosso melhor juntas para escapar da reprovação...!"
31060-15 = "Parece que o Exame Especial de Aptidão Acadêmica vai até a 3ª rodada, ou seja, teremos três chances... Mas, se todas nós passarmos juntas em pelo menos uma delas, as aulas de reforço terminam na hora!"
31060-16 = "Quanto ao Sensei... gostaríamos que cuidasse principalmente de organizar o cronograma e de nos dar várias aulas de reforço."
31060-17 = "Sim, entendido. Das três missões, precisamos alcançar o sucesso com a equipe inteira em pelo menos uma. Para isso, vamos nos reunir aqui todos os dias para treinar... Não é uma missão tão difícil."
31060-18 = "Essa reunião, portanto, é uma medida para evitar a baixa de qualquer integrante... Da minha parte, não tenho intenção nem motivo para sabotar."
31060-19 = "I-Isso mesmo, vamos dar o nosso melhor! Hum, Azusa-chan, não faz muito tempo que você foi transferida para cá, né?"
31060-20 = "Deve ser também porque você ainda não se acostumou com esta escola, então acho que, se nos esforçarmos juntas, vamos dar um jeito nisso rapidinho!"
31060-21 = "Ora? A Shirasu-san foi transferida para cá?"
31060-22 = "Uma transferência para a Trinity... que coisa rara, não é...?"
31060-23 = "..."
31060-24 = "Ah, é que estava escrito assim nos documentos... S-Será que eu falei demais...?"
31060-25 = "Não, não é nenhum segredo, então não precisa se preocupar. É a pura verdade."
31060-26 = "Preciso me acostumar com esse tipo de comentário, e vou me esforçar para isso."
31060-27 = "Entendo..."
31060-28 = "Sendo assim, será que eu também posso te chamar de Azusa-chan?"
31060-29 = "...? Por mim, tudo bem."
31060-30 = "Então, Azusa-chan. Hifumi-chan. E Koharu-chan. Ufufufu, soa muito bem. A partir de agora, somos todas companheiras do Clube de Aulas de Reforço."
31060-31 = "A Azusa-chan parece fria à primeira vista, mas tem um jeitinho bem fofo. Fufufu."
31060-37 = "..."
31060-38 = "Ora, o que foi, Koharu-chan? Por que esse olhar cheio de rancor?"
31060-39 = "Já vou avisando que eu não aceito isso...!"
31060-40 = "Hum...?"
31060-41 = "Ora, do que está falando?"
31060-42 = "E-Eu sou da elite do Comitê de Justiça!"
31060-43 = "Só porque sou mais nova, não pensem que vou chamar vocês de senpai!"
31060-44 = "E, pra começo de conversa, eu vou dar o fora deste clube rapidinho! Então dá pra não ficarem de tanta intimidade comigo?!"
31060-45 = "Entendo... De fato, acho que não há necessidade de formalidades entre veteranas e calouras aqui dentro do Clube de Aulas de Reforço. Por mim, não há problema algum."
31060-46 = "Por mim também não. Para início de conversa, não estou acostumada com essa cultura."
31060-47 = "Além do mais, este grupo não se reuniu para fazer amizade. Estamos aqui puramente por interesse mútuo, então não há necessidade de fingir intimidade. Ou estou errada?"
31060-48 = "A-Auu..."
31060-49 = "Então está decidido! E tem mais uma coisa, pra começo de conversa..."
31060-50 = "O único motivo de eu ter reprovado na prova... foi porque fiz o teste do 2º ano, uma série acima, pra tentar pular de ano!"
31060-51 = "Ora, pular de ano? Por que fez uma coisa dessas...?"
31060-52 = "C-Como assim por quê...?! Eu sou alguém que vai carregar o Comitê de Justiça nas costas no futuro...!"
31060-53 = "Mas você acabou ficando de recuperação por causa disso, não foi? Se fosse tentar uma vez como desafio, eu até entenderia, mas por que insistir nisso tantas vezes...?"
31060-54 = "C-Cala a boca, cala a boca! Não é isso que eu quero dizer!"
31060-56 = "Ou seja, até agora eu só estava escondendo o meu verdadeiro poder!!"
31060-61 = "Na próxima prova, vou fazer direitinho o teste do 1º ano! Aí vou tirar uma nota excelente e pronto, fim de papo. Entenderam?"
31060-66 = "E aí vou sair deste Clube de Aulas de Reforço num piscar de olhos!"
31060-67 = "Hum, mesmo que você tire uma nota excelente individualmente, isso não significa que poderá sair do clube..."
31060-68 = "Entendo, então estava ocultando o seu histórico. A propósito, como a diferença no ritmo de ensino em relação ao meu colégio anterior era muito grande, atualmente também estou fazendo a prova do 1º ano."
31060-69 = "Ah, então somos iguais... D-Digo, não! De qualquer forma, logo não terei mais nada a ver com vocês!"
31060-70 = "Além disso, é uma pena que nossa convivência vá ser tão curta, mas parece que esse não é o caso de vocês, né? Ahaha!"
31060-71 = "Até mais! Esforcem-se o quanto puderem!"
31060-74 = "E-Espera...! E-Ela foi embora..."
31060-75 = "Fufu, o humor da Koharu-chan oscila tanto que é divertido de observar."
31060-76 = "Em compensação, a Azusa-chan é super consistente e não se abala com nada."
31060-79 = "Auu..."
31060-80 = "Mal posso esperar pelo que vem por aí, fufufu."
31060-82 = "(A partir de então, o Clube de Aulas de Reforço passou a se reunir todos os dias após as aulas na sala para ter aulas especiais de reforço.)"
31060-84 = "Próximo;Estudando para a prova"
