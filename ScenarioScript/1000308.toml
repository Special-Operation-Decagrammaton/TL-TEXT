[translation]
1000308-1 = "Обычная прогулка"
1000308-2 = "Ворота старшей школы Тринити"
1000308-3 = "Я так ждала сегодняшнего дня..."
1000308-4 = "Вот бы у остальных не появились дела в последний момент..."
1000308-5 = "И что мне теперь делать после занятий?"
1000308-6 = ""
1000308-7 = "Сенсей? Что привело тебя в Тринити?"
1000308-8 = "[s] «Были дела, но теперь я свободен и собираюсь прогуляться.»"
1000308-9 = "А, понятно. Какое счастливое совпадение!"
1000308-10 = "Мы с друзьями собирались встретиться здесь и погулять..."
1000308-11 = "...но у всех появились важные дела, поэтому они отменили встречу. Осталась только я. Хи-хи."
1000308-12 = "Теперь я даже не знаю, как провести день..."
1000308-13 = "Так что скажешь, Сенсей? Если ты не занят, может, погуляем вместе?"
1000308-14 = "Я не против просто присоединиться к твоей прогулке... Можно?"
1000308-15 = "[s] «Договорились.»"
1000308-16 = "Ух ты! Спасибо, Сенсей!"
1000308-17 = ""
1000308-18 = ""
1000308-19 = "Тогда идём! Я покажу дорогу!"
1000308-22 = "― Куда теперь? Туда?[wa:2480]"
1000308-24 = "― О, а как насчёт того места?[wa:2440]"
1000308-27 = "― Конечно, я пойду куда угодно, если мы вместе![wa:2580]"
1000308-30 = "― Сенсей, смотри туда! И туда, туда тоже![wa:5290]"
1000308-33 = "― Я столько раз ходила по этой улице. Почему теперь всё выглядит иначе?[wa:1060]"
1000308-36 = "― Хм? Долго ты ещё будешь там сидеть?[wa:120]"
1000308-38 = "― Ладно! Давай ещё погуляем![wa:10]"
1000308-41 = "― А? Тебе отсюда вид нравится больше?[wa:10]"
1000308-43 = ""
1000308-44 = "Фух. Было так весело!"
1000308-45 = "После того как остальные отменили встречу, я уже ничего не ждала от этого дня..."
1000308-46 = "Но время с тобой сделало его лучше, чем я могла представить!"
1000308-47 = "Н-Не то чтобы я рада, что друзья всё отменили."
1000308-48 = "Слушай, Сенсей? В следующий раз можем сходить куда-нибудь, где я ещё не была?"
1000308-49 = "Не глупи. Конечно, я не нервничаю из-за нового места."
1000308-50 = "Мне будет хорошо где угодно, если мы вместе!"
