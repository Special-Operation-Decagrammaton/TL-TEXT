[translation]
1003203-1 = "Новогодние развлечения!"
1003203-3 = "(Новогоднее мероприятие, где мы договорились встретиться с Муцки, было переполнено людьми и шумом.)"
1003203-4 = ""
1003203-6 = ""
1003203-7 = ""
1003203-8 = "О, Сенсей! Сюда, сюда!"
1003203-9 = "Вы пришли вовремя! Я думала, из-за работы опоздаете!"
1003203-10 = "*всхлип* Я волновалась!"
1003203-11 = "[s] «Я дал тебе обещание. На такое я не могу опоздать.»"
1003203-12 = "Хи-хи."
1003203-13 = "Вы серьёзно?"
1003203-14 = "Кстати, Новый год, поэтому здесь просто море людей!"
1003203-15 = "*зевает* Мне уже, кажется, надоело."
1003203-16 = "[s] «Но я только пришёл!»"
1003203-17 = "Шучу, Сенсей! Пойдём внутрь."
1003203-18 = "О, зачем мы вообще сюда пришли?"
1003203-19 = "Как я и говорила в MomoTalk, мы пришли загадать желание. Это мероприятие особенно известно своими милыми эма."
1003203-20 = "Я подумала: почему бы не попробовать какие-нибудь весёлые новогодние развлечения?"
1003203-21 = ""
1003203-23 = ""
1003203-24 = "Ну же, не стойте. Пойдёмте, Сенсей!"
1003203-25 = ""
1003203-27 = ""
1003203-30 = "(После этого Муцки повела меня внутрь.)"
1003203-31 = ""
1003203-33 = ""
1003203-34 = "Хм..."
1003203-35 = ""
1003203-38 = "Уф!"
1003203-39 = "У-у-ух! Я ЗАДЫХАЮСЬ!"
1003203-40 = "Мне нужна бомба! Сейчас я тут всё БАБАХНУ."
1003203-41 = "[s] «Давай не будем этого делать, Муцки!»"
1003203-42 = "Ха-ха! Сенсей! Я же очевидно шучу!"
1003203-43 = "Даже я понимаю, что взрывать всё нужно в подходящее время и в подходящем месте!"
1003203-44 = ""
1003203-46 = ""
1003203-47 = "Но... может, подходящее время и место — прямо здесь и сейчас?"
1003203-48 = "[s] «М-Мы почти пришли, честно!»"
1003203-49 = "(Пока я изо всех сил пытался успокоить Муцки...)"
1003203-50 = "Извините!"
1003203-51 = "Ах!"
1003203-52 = "[s] «Муцки, осторожно!»"
1003203-53 = ""
1003203-55 = ""
1003203-58 = ""
1003203-60 = "Сенсей!"
1003203-61 = "[s] «Ты в порядке? Не ушиблась при падении?»"
1003203-62 = "Я-Я в порядке, но, эм..."
1003203-63 = "Знаете, вы всё ещё держите меня за руку."
1003203-64 = "Хи-хи. Сенсей! Вы используете это как повод прижаться ко мне поближе?"
1003203-65 = ""
1003203-68 = ""
1003203-69 = "Ахаха! Не надо так смущаться!"
1003203-70 = "Но благодаря вам я уже немного меньше раздражена."
1003203-71 = "Хм, хотя мне стало бы ещё лучше, если бы я нашла того, кто меня толкнул, и вручила ему небольшой взрывной подарок."
1003203-72 = "[s] «П-Пожалуйста, не надо.»"
1003203-73 = "Хи-хи-хи!"
1003203-74 = "А! Теперь наша очередь, Сенсей!"
1003203-78 = ""
1003203-79 = "Мы можем написать желания на эма и повесить их вон там."
1003203-80 = "Ну что, запишем наши желания?"
1003203-81 = "[s1] (Я очень хочу, чтобы этот год был спокойным.)\n[s2] (Я хочу, чтобы этот год был полон весёлых событий.)"
1003203-82 = "Сенсей, вы уже написали своё желание?"
1003203-83 = "Хи-хи."
1003203-84 = ""
1003203-86 = ""
1003203-87 = "Покажите, что вы написали! Прямо сейчас!"
1003203-88 = "[s3] «С-Стой, Муцки!»"
1003203-89 = "Я вообще позвала вас сюда именно затем, чтобы узнать ваше желание, Сенсей!"
1003203-90 = "От меня не убежите!"
1003203-91 = "Я! Хия! Ахаха!"
1003203-92 = ""
1003203-96 = "Так-так, посмотрим. Что же загадал Сенсей?"
1003203-97 = ""
1003203-99 = ""
1003203-100 = "А? Вы пожелали мира?"
1003203-101 = "Хмф! С таким же успехом можно было пожелать скучного года!"
1003203-102 = "Эх, а я ожидала чего-нибудь более зловещего,"
1003203-103 = "или хотя бы чего-то, что выражает ваши желания, Сенсей. Какое разочарование."
1003203-104 = "[s4] «Разве такое желание не разочаровало бы сильнее?»"
1003203-105 = "Правда так думаешь?"
1003203-106 = "Сенсей, вы уже написали своё желание?"
1003203-107 = "Хи-хи."
1003203-108 = ""
1003203-110 = ""
1003203-111 = "Покажите, что вы написали! Прямо сейчас!"
1003203-112 = "[s5] «С-Стой, Муцки!»"
1003203-113 = "Я вообще позвала вас сюда именно затем, чтобы узнать ваше желание, Сенсей!"
1003203-114 = "От меня не убежите!"
1003203-115 = "Я! Хия! Ахаха!"
1003203-116 = ""
1003203-120 = "Так-так, посмотрим. Что же загадал Сенсей?"
1003203-121 = ""
1003203-123 = ""
1003203-124 = "А? Вы хотите, чтобы этот год был полон весёлых событий?"
1003203-125 = "Ого, Сенсей, вот это желание!"
1003203-126 = "Весёлые события, говорите? Интересно, какие именно события вы имеете в виду!"
1003203-127 = "Хм-м, может, делать всякое такое с кем-нибудь милым вроде меня!"
1003203-128 = "Вы ждёте кучу всего такого, от чего будете кричать «Вау! Ух ты!»?"
1003203-129 = "[s6] Что ты вообще говоришь?"
1003203-130 = "Если это ваше желание, я могу его исполнить!"
1003203-131 = "Что-о-о? Я просто шучу. ☆"
1003203-132 = "Погодите, вы что, уже обрадовались? Правда, Сенсей? Ахаха! Простите, но этого не будет!"
1003203-133 = "[s] «А какое желание у тебя, Муцки?»"
1003203-134 = "А? Моё желание?"
1003203-135 = "Хм-м, никакого! Смотрите, я ничего не написала на своей эма."
1003203-136 = "Хи-хи. Я пришла сюда только ради того, чтобы узнать ваше желание, Сенсей!"
1003203-137 = "[s] «Тогда я напишу твоё желание за тебя, Муцки.»"
1003203-138 = "А?"
1003203-139 = "Нет, не нужно. Это не так уж важно."
1003203-140 = "Ха-ха, я даже не могу придумать, чего хочу."
1003203-141 = ""
1003203-144 = "[s] «Хорошо, тогда напишу вот это.»"
1003203-145 = "А? Эм, Сенсей? Я даже не знаю, как реагировать, когда вы настолько серьёзны."
1003203-146 = ""
1003203-149 = ""
1003203-150 = ""
1003203-152 = "[ns7] «Как насчёт такого желания?»\n[ns8] «Я хочу как можно дольше оставаться рядом с теми, кого люблю!»"
1003203-153 = "Ох... Сенсей."
1003203-154 = "Ох... Сенсей."
1003203-155 = "Говорите мне такое с настолько серьёзным выражением лица..."
1003203-156 = "Это... Это..."
1003203-157 = "[s] «...Это?»"
1003203-158 = ""
1003203-160 = ""
1003203-161 = "Ки-хи-хи, ахаха!"
1003203-162 = "Это так неловко! Простите, не могу перестать смеяться! Ахаха!"
1003203-163 = "Ого, Сенсей, как вы можете говорить такое с совершенно серьёзным лицом? Ки-хи-хи! Это уморительно!"
1003203-164 = "[s] «Это правда было настолько неловко?»"
1003203-165 = "Ахаха! Ещё как! У-У меня живот болит! Ха-ха-ха!"
1003203-166 = "Ну и ну! Сенсей, вы настоящий мастер банальностей!"
1003203-167 = "На этот раз вы меня сделали!"
1003203-168 = "Ух ты! Было весело!"
1003203-169 = "Сенсей, пусть в этот раз я и проиграла вашей контратаке, но в следующий берегитесь!"
1003203-170 = "В следующий раз я заставлю вас смутиться и заберу победу себе!"
1003203-171 = "До следующего раза, Сенсей!"
1003203-172 = ""
1003203-174 = ""
1003203-176 = "[ns9] «Я не понимаю её критериев победы и поражения.»\n[ns10] «Но... разве я сказал что-то настолько странное?»"
1003203-180 = "(Я молча попрощался с Муцки, которая весело удалялась, пока совсем не скрылась из виду.)"
