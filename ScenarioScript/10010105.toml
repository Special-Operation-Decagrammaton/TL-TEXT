[translation]
10010105-1 = "Эпизод 10;Незаконченная история, часть 2"
10010105-2 = ""
10010105-11 = "После столь необходимого сна я медленно открыл глаза."
10010105-12 = "О. Вы проснулись, Сенсей."
10010105-19 = "Не ожидала, что вы встанете так рано. Надеюсь, я вас не разбудила."
10010105-20 = "А вот кое-кто всё ещё крепко спит. Надо же, даже во сне что-то бормочет..."
10010105-22 = "Хе-хе... Щекотно... Хе-хе..."
10010105-23 = "Она такая всю ночь."
10010105-24 = "Даже не представляю, что ей снится. По крайней мере, сейчас она выглядит гораздо спокойнее, чем перед сном."
10010105-25 = "[s1] «Ты правда всю ночь работала, да?»\n[s2] «Ну и как дела? Хорошо продвигается?»"
10010105-28 = "Да, пожалуй..."
10010105-29 = "Я сказала, что дальше справлюсь сама. И намерена сдержать слово..."
10010105-30 = "Вообще-то я почти закончила. Остался примерно час."
10010105-31 = "[s3] «Как ты смогла сделать всё так быстро?»\n[s4] «Теперь понятно, почему тебя зовут магом.»"
10010105-34 = "П-Пожалуйста. Лесть не заставит меня работать быстрее."
10010105-35 = "Хотя не то чтобы я не любила комплименты. На самом деле я получаю их нечасто..."
10010105-36 = "В любом случае... спасибо."
10010105-37 = "..."
10010105-38 = "Эм, так..."
10010105-39 = "З-Забудьте, что я сказала. Я просто разговаривала сама с собой.#nС одними мыслями бывает скучно."
10010105-40 = "Ч-Честно говоря, вчера я вела себя неразумно, когда попросила вас достать тот торт."
10010105-41 = "Мне показалась нелепой ваша просьба, поэтому я... в ответ выдвинула столь же тяжёлое требование. Возможно, вы и сами догадались."
10010105-42 = "Я правда не ожидала, что вы его достанете."
10010105-43 = "И всё же вы двое вернулись со всем — и с материалами, и даже с тортом."
10010105-44 = "Не то чтобы я внезапно изменила своё мнение о некоторых вещах,#nно всё же..."
10010105-45 = "Хм-м."
10010105-46 = "[s5] «Всё нормально. Шаг за шагом, Уи.»\n[s6] «Теперь ты немного иначе смотришь на Хинату?»"
10010105-47 = "Вы правда так думаете? Хм. Не уверена."
10010105-48 = "Вы правда так думаете? Хм. Не уверена."
10010105-49 = "Не то чтобы мы с ней вдруг стали особенно близки."
10010105-51 = "И всё же... прежняя я никогда бы не согласилась позволить вам двоим спать здесь."
10010105-52 = "Странно, что я стала такой уступчивой."
10010105-53 = ""
10010105-56 = "И я никогда не представляла, что..."
10010105-57 = "...буду дружелюбно беседовать с кем-то так поздно ночью."
10010105-59 = "Возможно, я обнаружила в себе слабое место, о котором раньше не знала."
10010105-60 = "И, возможно..."
10010105-61 = "...если бы мы лучше узнали друг друга..."
10010105-62 = "...то смогли бы..."
10010105-63 = "*зе-е-е-е-евок*"
10010105-65 = "..."
10010105-66 = ""
10010105-69 = "Г-Где я...?"
10010105-70 = "А, точно. Мы добывали материалы для реставрации книги. Поэтому..."
10010105-71 = "Который час?"
10010105-72 = "О, я уже пропустила отбой в общежитии. И перекличку..."
10010105-73 = "Перекличку...? Хм..."
10010105-74 = "Хорошо поспала, Хината?"
10010105-76 = "ПЕРЕКЛИЧКА!"
10010105-77 = "Ч-Что...?"
10010105-78 = "[ns7] «О чём ты?»\n[ns8] «Что случилось?»"
10010105-79 = "Э-Это плохо, Сенсей! Перекличка! Я её пропустила!"
10010105-80 = "Э-Это плохо, Сенсей! Перекличка! Я её пропустила!"
10010105-81 = "Как стало так поздно?! Который час?!"
10010105-82 = "Эм, Хината. Я всё ещё работаю. Можешь говорить потише?"
10010105-83 = "Н-Но я наверняка уже пропустила её! Они знают, что меня нет!"
10010105-84 = "Стоит ли поднимать такой шум из-за такой мелочи? Никогда не пойму, как устроено Сестринство. В любом случае, мне нужно, чтобы ты говорила тише."
10010105-85 = "Н-Но...! Я не могу пропустить перекличку! Что, если остальные Сёстры узнают, что я опоздала, потому что уснула?"
10010105-86 = "Пожалуйста, тише..."
10010105-88 = "..."
10010105-90 = "М-Мне придётся связаться с заведующей общежитием, и...!"
10010105-91 = "Я СКАЗАЛА, ТИХО!"
10010105-92 = "А-а-а!"
10010105-93 = "[s9] «Ты её довела.»\n[s10] «Удивительно, что она продержалась ТАК долго.»"
10010105-94 = "Сколько раз мне просить тебя говорить тише?! Это всё ещё библиотека!#nТс-с-с-с!"
10010105-95 = "Сколько раз мне просить тебя говорить тише?! Это всё ещё библиотека!#nТс-с-с-с!"
10010105-96 = "П-Прости, Уи. Я не заметила..."
10010105-97 = "Простите!"
10010105-98 = ""
10010105-101 = ""
10010105-102 = "И поставь телефон на беззвучный режим!"
10010105-103 = "Х-Хорошо! Сейчас же!"
10010105-104 = "...?"
10010105-105 = ""
10010105-107 = ""
10010105-108 = "А?"
10010105-110 = "Что ещё?"
10010105-111 = "Эм..."
10010105-112 = "Эм... Я-я только что получила сообщение. Этого не может быть..."
10010105-113 = "Из собора. Сейчас прочту."
10010105-114 = "Из собора?"
10010105-115 = "«Обновление по мероприятию, посвящённому представлению и чтению писания, которое было назначено на завтра...»"
10010105-116 = "..."
10010105-117 = "[s11] «Что там написано, Хината?»\n[s12] «Что случилось с мероприятием?»"
10010105-118 = "«Все стороны согласились провести мероприятие как можно скорее.»"
10010105-119 = "«Все стороны согласились провести мероприятие как можно скорее.»"
10010105-120 = "«Мероприятие состоится сегодня в полночь.»"
10010105-121 = "В полночь... сегодня?"
10010105-122 = "Полночь..."
10010105-124 = "Полночь."
