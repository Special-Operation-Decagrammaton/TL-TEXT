1008703-106 = ""
1008703-109 = "[ns5] «...Может, если сказать, что так велел специалист, она мне поверит.»\n[ns6] «У меня плохое предчувствие. Но ведь каждая девушка заслуживает чувствовать себя элегантной... правда?»"
1008703-112 = "Вы приняли правильное решение."
1008703-113 = "Вот. Я добавлю это к вашему заказу."
1008703-121 = "Когда я пришёл в офис Префекторской команды, Ако не было на месте. Поэтому я оставил платье на её столе."
