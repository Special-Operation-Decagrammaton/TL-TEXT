[translation]
2005206-1 = "Психология управления"
2005206-2 = "Сенсей, на что вы готовы ради продажи?"
2005206-3 = "[s1] «Ещё один загадочный вопрос от Якумо.»\n[s2] «Всё в порядке?»"
2005206-6 = "Ну, в последнее время дела идут немного тяжело..."
2005206-7 = "В наши дни издательская индустрия постоянно переживает кризис."
2005206-8 = "А, вы знали?"
2005206-9 = "Управленец имеет право объявить кризис."
2005206-10 = "Даже если продажи растут, всегда можно заявить, что неопределённое будущее ввергает нас в кризис."
2005206-11 = "А когда продажи падают... Ну, тут дополнительных объяснений и не требуется."
2005206-12 = "После рекордных продаж неизбежно следует относительное снижение показателей."
2005206-13 = "Проще говоря, у нас снизился темп продаж, а это как раз достаточное основание объявить кризис."
2005206-14 = "Честно говоря, управленцам вообще нельзя доверять. Хе-хе-хе."
2005206-15 = "[s] «Тогда выходит, тебе тоже нельзя доверять.»"
2005206-16 = "Кх."
2005206-17 = "Вот... как это работает, значит...?"
2005206-18 = "Я-я просто пошутила. Конечно. Хе-хе... хе."
2005206-19 = "В любом случае."
2005206-20 = "Печатные книги практически превратились в сувениры. Памятные вещи."
2005206-21 = "А рынок электронных книг находится в таком хаосе, что предсказать его будущее невозможно."
2005206-22 = "Я всё размышляла... существует ли решение для всего этого."
2005206-23 = "Но даже если оно есть, это будет лишь временная мера, маскирующая основную проблему."
2005206-24 = "Хотя, знаете, если постоянно латать временными решениями, когда-нибудь, возможно, получится заткнуть течь, верно?"
2005206-25 = "[s] «Наверное, вам просто нужно заставить всех читать побольше книг.»"
2005206-26 = "Да. Это наша основная политика."
2005206-27 = "Именно поэтому мне очень хочется, чтобы пошёл сильный снег."
2005206-28 = "Почему снег? Потому что когда идёт снег, студенты обычно спешат обратно в комнаты и поглощают тот контент, который их сейчас увлёк. Это же идеальная пропаганда..."
2005206-29 = "Прошу прощения. Идеальная возможность для «рекомендаций в общественных интересах»."
2005206-30 = "[s] «Я почти скучаю по временам, когда ты хотя бы делала вид, что скрываешь свои намерения.»"
2005206-31 = "...Мне кажется, последнюю черту я пока всё-таки не перешла..."
2005206-32 = "Как бы то ни было, есть проблема."
2005206-33 = "Красная Зима и без того постоянно покрыта снегом..."
2005206-34 = "Раз снег уже повсюду, даже если я скажу, что сверху навалило ещё больше, кого это вообще впечатлит?"
2005206-35 = "[s] «Тогда просто подчеркни, НАСКОЛЬКО много снега выпало?»"
2005206-36 = "Если говорить просто — да."
2005206-37 = "А? У вас есть хорошая идея?"
2005206-41 = "Сенсей...?"
2005206-42 = "Боюсь, я не совсем поняла. Не могли бы вы объяснить ещё раз...?"
2005206-43 = "[s3] «Вопросы студентов всегда приветствуются!»\n[s4] «Как я и сказал, давай поместим на обложку фото, где ты делаешь снежного ангела!»"
2005206-46 = "Почему...?"
2005206-47 = "[s] «Для снежного ангела нужно много снега!»"
2005206-48 = "Да, я знаю. Я выросла в Красной ЗИМЕ. Но почему именно Я?"
2005206-49 = "Я издатель. Быть в центре внимания — совсем не моё."
2005206-50 = "Да и публика меня, мягко говоря, не обожает, Сенсей."
2005206-51 = "[s5] «Именно поэтому это идеально!»\n[s6] «Если люди увидят в снегу кого-то вроде тебя...»\n[s7] «...они точно поверят, что снегопад был действительно сильным!»"
2005206-52 = ""
2005206-53 = ""
2005206-54 = ""
2005206-56 = ""
2005206-57 = "А...? Если снег был настолько сильным, что даже президента Издательского отдела, которая обычно живёт в роскоши, засыпало снегом..."
2005206-58 = "Все решат, что ситуация и правда чрезвычайная..."
2005206-59 = "И главное, сама эта сцена... Вы думаете, она будет забавной?"
2005206-60 = "...Значит, вы всё-таки говорили совершенно искренне..."
2005206-61 = "[s] «Разве ты не готова на всё ради продажи?»"
2005206-62 = "Ух, получить по голове собственными словами...!"
2005206-63 = "Ничего не поделаешь... Сказанные и написанные слова уже не забрать назад..."
2005206-64 = ""
2005206-66 = ""
2005206-71 = "― [log=야쿠모]Ох... Как мягко.[/log][wa:1780]"
2005206-74 = "― [log=야쿠모]А это даже приятно...[/log][wa:2060]"
2005206-77 = "― [log=야쿠모]Почему от этих слов меня пробрал озноб?  [/log][wa:3500]"
2005206-80 = "― [log=야쿠모]Апчхи! [/log][wa:10]"
2005206-83 = "[ns] «Так, улыбнись в камеру!»"
2005206-84 = "― [log=야쿠모]Сняли?[/log][wa:1550]"
2005206-86 = "― [log=야쿠모]А теперь ваша очередь.[/log][wa:490]"
2005206-89 = "― [log=야쿠모]А?[/log]"
2005206-91 = "― [log=야쿠모]Вы правда собирались заставить меня делать это в одиночку? [/log][wa:90]"
2005206-94 = "― [log=야쿠모]Ай-ай-ай. Не думаю,[/log][wa:1580]"
2005206-96 = "― [log=야쿠모]что это очень ответственно с вашей стороны, Сенсей.[/log][wa:1240]"
2005206-99 = "― [log=야쿠모]Холод Красной Зимы[/log][wa:1710]"
2005206-101 = "― [log=야쿠모]одинаков для всех, знаете ли? Хе-хе-хе.[/log][wa:1400]"
