[translation]
101090-1 = "Эпизод 9; Столкновение 1"
101090-2 = "Как они..."
101090-3 = "Военное положение... Но... Генеральный студенческий совет..."
101090-4 = "Валькирия..."
101090-5 = "Сообщение от генерала... и..."
101090-6 = "[ns1] «...»\n[ns2] Открыть глаза."
101090-9 = "[ns3] «(Я не вижу Ковчег Шиттим...)»\n[ns4] «(Они забрали Ковчег Шиттим...?)»"
101090-13 = "Мы всё ещё ждём. Они даже не смогли включить Сундук, не говоря уже о взломе."
101090-14 = "Попробовали подключить его к нашим серверам — и восемь дата-центров штаба отключились."
101090-15 = "Всё вверх дном."
101090-16 = "Похоже, единственный вариант — использовать Сенсея."
101090-17 = "Вы слышали?! Это был выстрел?"
101090-18 = "Выстрел?!"
101090-19 = ""
101090-21 = ""
101090-22 = "Сверху!"
101090-23 = "Пошли!"
101090-24 = ""
101090-26 = ""
101090-36 = "*тяжело дышит* *тяжело дышит*"
101090-37 = ""
101090-40 = "Какая неожиданная встреча, Сенсей [USERNAME]."
101090-41 = "[ns] «(Этот голос...)»"
101090-42 = ""
101090-43 = "Какое облегчение... Я прошла через ад, чтобы найти это место, но главное — вы в порядке."
101090-44 = "[s] «Канна...?!»"
101090-45 = "Хм. Вы меня помните. Не думала, что третьесортная злодейка вроде меня сыграет достаточно большую роль в вашей истории."
101090-46 = "Сейчас я вас... *кашель кашель* ...вытащу... *кашель*"
101090-47 = "Уф."
101090-48 = "[s] «Канна, что случилось? Почему ты так ранена?»"
101090-49 = "А, это? Издержки профессии, не переживайте."
101090-50 = ""
101090-53 = "*пыхтит* *пыхтит* ...Так. Должно открыться."
101090-54 = "[ns] Выйти из камеры."
101090-56 = "Сюда, Сенсей... Уверена, у вас полно вопросов, но сначала нужно попасть в безопасное место."
101090-57 = "Идите за мной."
101090-58 = ""
101090-60 = ""
101090-61 = "[ns] Следовать за Канной."
101090-64 = "Ч-что?!"
101090-65 = "Гх?"
101090-66 = ""
101090-76 = ""
101090-77 = "Они все солдаты PMC под видом... *кашель* студентов Валькирии... *кашель кашель*"
101090-78 = "[s] «Это я понял, но где мы?»"
101090-79 = "Третья школа-спутник Полицейской школы Валькирия в D.U. Из-за нехватки бюджета её использовали только для подготовки новых студентов Валькирии..."
101090-80 = "Я не знала, что она попала в руки Корпорация Кайзер..."
101090-81 = "[s] «Кайзер...»"
101090-82 = "Им наверняка помогал кто-то внутри Валькирии."
101090-83 = "Я не знаю, насколько глубоко Кайзер Group запустила руки в Валькирию..."
101090-84 = "Но... без коррупции в наших рядах такое произойти не могло."
101090-85 = "[s] «...Канна.»"
101090-86 = ""
101090-88 = ""
101090-89 = ""
101090-90 = "Что сделано, то сделано. Я отправила сигнал. Нам нужно добраться до заднего входа здания."
101090-91 = "Я подготовила способ выбраться из заблокированного D.U."
101090-92 = "[s5] «Побег...? Заблокирован...?»\n[s6] «Что, чёрт возьми, происходит?»"
101090-95 = "...Нам нужно двигаться."
101090-96 = ""
101090-98 = ""
101090-99 = "[ns] Последовать за ней."
101090-104 = ""
101090-105 = ""
101090-108 = "Плохо. Они уже в полной боевой готовности. Это было наше назначенное место встречи."
101090-109 = "Кто там?!"
101090-110 = "Вот они! Огонь!"
101090-111 = ""
101090-114 = "Сенсей, берегитесь!"
101090-115 = ""
101090-117 = ""
101090-118 = ""
101090-119 = "[ns] «Канна!»"
101090-120 = ""
101090-122 = ""
101090-123 = "А-Ай?!"
101090-124 = "П-подкрепление...!"
101090-125 = ""
101090-127 = ""
101090-131 = "Сенсей! Вы в порядке?!"
101090-132 = "Угх... Не могу поверить, что это происходит."
101090-133 = "[s7] «Кирино! Фубуки!»\n[s8] «Бюро общественной безопасности!»"
101090-136 = "*пых-пых* Как раз вовремя."
101090-137 = "Видели? Мой выстрел! Идеальный! ...А?! Директор Канна?!"
101090-138 = "Ого... Вы выглядите ужасно. Всё нормально?"
101090-139 = "Последнее, что нам сейчас нужно, — ещё одна обуза. Сосредоточьтесь на миссии и обеспечьте путь отхода."
101090-140 = "Поняла, директор! Сенсей, пожалуйста, идите за мной и Фубуки!"
101090-141 = "Пока, кажется, были только эти двое охранников. Бешеная Гончая... То есть директор Канна, мы пойдём впереди."
101090-142 = ""
101090-143 = ""
101090-144 = ""
101090-145 = ""
101090-146 = "Охрана тут серьёзная... Угх..."
101090-147 = ""
101090-152 = "*пыхтит* *пыхтит* Просто... минутку... *пыхтит*"
101090-153 = "Кирино, директор Канна тяжело ранена. Нужно сбавить темп."
101090-154 = "Т-Ты права. Простите!"
101090-155 = "Время применить мой главный навык: отдыхать. Быстро, все в это пустое здание."
101090-156 = "Идём!"
101090-158 = "Пока что здесь безопасно."
101090-159 = "Ключевые слова — «пока что». Слишком долго задерживаться нельзя."
101090-160 = "Это место... *пыхтит* *пыхтит*"
101090-161 = "Директор..."
101090-162 = "Если не возражаете, можно спросить, что вы здесь делаете? Работа директора Бюро общественного порядка — допросы. Зачем идти на такие крайности?"
101090-163 = "Я... Я должна была взять ответственность..."
101090-164 = "..."
101090-165 = "...Так и думала."
101090-166 = "Ситуация слишком сложная, сторон слишком много и их интересы противоречат друг другу. Я не могла попросить подчинённых нарушить закон, если сама не готова сделать то же самое."
101090-167 = "[s] «Расскажи, что произошло с момента моего захвата.»"
101090-168 = "..."
101090-169 = "Это..."
101090-170 = "...Шесть часов назад ЧВК Кайзер атаковали Генеральный студенческий совет."
101090-172 = ""
101090-173 = "Высокопоставленный командир ЧВК Кайзер, известный как генерал... захватил власть, распустил Административный совет, занял башню Санктум и объявил военное положение по всему D.U."
101090-175 = "Все транспортные и коммуникационные сети, ведущие в D.U. и из него, перекрыты, а другие ведомства, включая Валькирию, лишились административных полномочий и ждут приказов..."
101090-176 = ""
101090-177 = "Сейчас вся безопасность D.U. в рамках военного положения передана ЧВК Кайзер."
101090-179 = "То, что я, глава силовой организации, сейчас помогаю вам и выступаю против ЧВК Кайзер, равносильно неповиновению закону."
101090-180 = "Студенты Бюро общественной безопасности… формально вообще не являются силовой организацией, так что если я засвидетельствую, что вы исполняли приказ начальницы, с которой «случайно» оказались связаны, вы двое хотя бы избежите ответственности."
101090-181 = "Мне плевать, нарушаю ли я их законы! Ради справедливости, настоящей справедливости, я сделаю что угодно!"
101090-182 = "Не будь такой близорукой. Если тебя не станет, кто будет регулировать движение в Кивотосе? Особенно сейчас — кто поможет гражданам, попавшим в беду?"
101090-183 = "У нас с тобой разные способности, а значит, каждая обязана делать всё возможное, чтобы выполнить только ей доступный долг."
101090-184 = "Когда смогу, я возмещу вам то, что втянула вас в такую опасную ситуацию."
101090-185 = "Мне нужна всего дюжина глазированных пончиков из Master Donuts."
101090-186 = "Если это всё, объешься ими хоть до отвала. В офисе Бюро общественного порядка их целая гора."
101090-188 = "Вернёмся к делу, Сенсей. Полной картины у меня нет, но я расскажу всё, что знаю."
101090-190 = "Как вы знаете, главный администратор созвала Комитет экстренного реагирования и вызвала представителей каждого района."
101090-191 = "Мы все ожидали вашего присутствия там, Сенсей."
101090-192 = "Но, как вам прекрасно известно, вы исчезли из Шале."
101090-193 = ""
101090-195 = ""
101090-196 = "Есть новости?"
101090-197 = "Ноль. Сенсей исчез без следа."
101090-198 = "..."
101090-199 = "Рин..."
101090-200 = "...Ладно. Продолжай поиски, Момока. Любой ценой, какой бы мелкой ни была зацепка — найди хоть что-нибудь."
101090-201 = "Ну, я постараюсь..."
101090-202 = "На этом этапе отменять Комитет экстренного реагирования уже нельзя. Продолжаем по плану."
101090-203 = "Но с начальником обороны Каей тоже не удаётся связаться..."
101090-204 = "В Абидосе, похоже, возникла чрезвычайная ситуация, требующая их внимания. Рио из Миллениума даже не ответила."
101090-206 = "И большинство организаций согласилось участвовать только при условии присутствия Сенсея..."
101090-207 = "..."
101090-209 = "Заседание Комитета экстренного реагирования прошло без вас, Сенсей..."
101090-213 = "...Такова полная картина явлений сверхвысокоэнергетических объектов, которые сейчас проявляются по всему Кивотосу."
101090-214 = "Пустыня Абидос, заброшенный парк аттракционов возле Р.У., закрытая зона на окраине Миллениума, приграничная область между Тринити и Геенной, новый городок возле Миллениума... и башня Санктум в Р.У."
101090-215 = "Мы просим каждый район сотрудничать в расследовании этой потенциальной угрозы."
101090-217 = "Где Сенсей? Мне сказали, что Шале будет участвовать в Комитете экстренного реагирования."
101090-218 = "Э-это..."
101090-219 = "Нам нужно обсудить с Шале более срочные вопросы. Их здесь нет?"
101090-220 = "Что может быть срочнее этого, Сакурако?"
101090-221 = "Это... деликатный вопрос."
101090-222 = "Что нельзя обсуждать здесь? Что на этот раз скрывает Сестринство?!"
101090-223 = "У нас есть кое-что, что, как мы полагаем, связано с этим инцидентом и что нам также нужно обсудить с Сенсеем."
101090-224 = "И что же это такое? Только не говори, что она спит, пока Сэя говорит. Я ожидала от Геенны хотя бы крупицы уважения."
101090-226 = "Макото, пожалуйста, встань... Все на тебя смотрят..."
101090-227 = "Хи-хи-хи. Я не сплю, Ироха. Просто пропускаю весь этот бред мимо ушей."
101090-228 = "Мы уже закончили? Ибуки не успела позавтракать, Ибуки голодная!!"
101090-229 = "...Бред? Кстати, если у тебя проблемы со сном, меня считают своего рода специалистом по усыплению людей. Навсегда."
101090-230 = "Мика, всё хорошо. Пожалуйста, сядь."
101090-231 = "Хи-хи. ☆ Я просто поправляла стул. Я не собиралась вставать, честно."
101090-233 = "Вернёмся к моему первоначальному вопросу. Где Сенсей?"
101090-234 = "Генеральный студенческий совет явно прячет Сенсея! Эта встреча бессмысленна!"
101090-235 = "Всё это заговор! Вы, тупицы, ещё не поняли?"
101090-236 = "Макото, если бросаться такими безумными обвинениями..."
101090-239 = "Пожалуйста, соблюдайте порядок. Мы делаем всё возможное, чтобы найти Сенсея."
101090-240 = "Найти...? Сенсей из Шале пропал?"
101090-241 = "Не вижу смысла продолжать обсуждение без Шале. Нам нечего сказать Генеральному студенческому совету. Ироха, Ибуки, Сацуки — уходим!"
101090-242 = "П-подожди, Макото...!"
101090-243 = "Все обстоятельства этой ситуации кажутся мне крайне подозрительными."
101090-244 = "Я согласна с Мине. Сэя, Мика, Чаепитие будет действовать независимо от Генерального студенческого совета."
101090-245 = "Да. В нынешней ситуации они не могут ожидать нашего доверия."
101090-246 = "..."
101090-248 = "Погодите! Здесь нет пудинга! Как это может не быть пудинга, если я проделала весь этот путь?"
101090-249 = "Президент... Срочное сообщение из академии."
101090-250 = "Что?! Пока меня не было, опять переворот?!"
101090-251 = "Где на этот раз? Федерация зимнего обтирания холодной водой? Впервые о них слышу... Ладно, возвращаемся, Томоэ! Подавим переворот!"
101090-253 = "*вздох* Пожалуй, другого и ждать не стоило..."
101090-254 = "Нам правда нужно продолжать это...?"
101090-255 = "Какой район обсуждаем следующим?"
101090-256 = "Да, главный администратор! Следующий район..."
101090-257 = ""
101090-259 = ""
101090-261 = "Никакого."
101090-262 = "!"
101090-263 = "Н-Начальник финансов!"
101090-264 = "Аой..."
101090-265 = ""
101090-267 = ""
101090-268 = ""
101090-269 = "Есть темы, которые я хотела бы обсудить. Исчезновение начальника обороны выглядит слишком удобным. Комитет экстренного реагирования сильнее всего вторгается именно в полномочия её управления."
101090-270 = "Это..."
101090-271 = "И это ещё не всё: Сенсей из Шале внезапно пропал. Не слишком ли много совпадений?"
101090-272 = "..."
101090-273 = "Я также подтвердила, что после расформирования SRT образовавшуюся пустоту заполнили силами PMC. Сделка была анонимной, но мне удалось установить это, отследив финансовые показатели."
101090-274 = "План передать власть Генерального студенческого совета частным компаниям... Неужели всё это было частью вашей большой схемы?"
101090-275 = "..."
101090-276 = "Главный администратор. Вы организатор всех этих происшествий? Всё шло по плану? Распуск SRT? Создание Шале? А что насчёт..."
101090-278 = "...пропавшей президентки Генерального студенческого совета?"
101090-279 = "...! Это... Я...!"
101090-280 = "Прости, Рин. Достаточно."
101090-281 = ""
101090-283 = ""
101090-284 = "Э-это..."
101090-285 = "Вот предложение о выражении недоверия Рин. Большинство из шести членов Административного совета согласилось, что не доверяет главному администратору Рин."
101090-286 = "...!"
101090-287 = "Это официально изданный приказ. Отныне все исполнительные распоряжения приостанавливаются до проведения голосования о доверии."
101090-289 = "Следующий Эпизод; Столкновение 2"
