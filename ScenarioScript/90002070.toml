[translation]
90002070-1 = "Эпизод 7;Кей"
90002070-2 = "Кей? Кей?! Ты в порядке, Кей?! Пожалуйста! КЕЙ! Не... Ты НЕ МОЖЕШЬ меня оставить!"
90002070-3 = "Кей!!!"
90002070-5 = ""
90002070-8 = "Арис."
90002070-9 = ""
90002070-11 = ""
90002070-12 = "Д-да! Ч-что такое? Кей, что угодно. Я слушаю, так что...!"
90002070-13 = "Прости. У меня в голове звенит, так что, пожалуйста, перестань кричать."
90002070-14 = "Что...?"
90002070-15 = "Ух... Я вымоталась..."
90002070-16 = "Кей, ты в порядке...?"
90002070-17 = "В порядке, в порядке, Арис. Со мной всё отлично, успокойся. Просто всё тело скрипит при каждом движении."
90002070-18 = ""
90002070-20 = "Дай взгляну, Арис."
90002070-21 = "Д-да, Рио...!"
90002070-23 = ""
90002070-24 = "Всё хорошо, Арис. Сознанию Кей... её жизни ничего не угрожает."
90002070-25 = "Правда? Спасибо, Рио!"
90002070-26 = "Однако тело Кей практически достигло своего предела."
90002070-27 = "П-правда? Что нам делать, Химари...?"
90002070-28 = "Ничего страшного. Нужно просто провести полный капитальный ремонт."
90002070-29 = "В конечном счёте наша единственная задача — восстановить функциональность и работоспособность её аппаратной части."
90002070-30 = "Д-да. Я рада... Кей..."
90002070-31 = "Погодите. То есть в итоге вы предлагаете починить это тело и снова им пользоваться?"
90002070-32 = "Да? Конечно, это займёт время: придётся всё разобрать, провести обслуживание деталей и собрать заново... Есть какая-то проблема, Кей?"
90002070-33 = ""
90002070-35 = ""
90002070-36 = "..."
90002070-37 = "Это всего лишь предложение."
90002070-38 = "...Может, воспользуемся возможностью и рассмотрим... другое тело?"
90002070-39 = "Другое тело? Но у нас нет других подходящих кандидатов."
90002070-40 = "Там ведь был «подходящий кандидат»!"
90002070-41 = "Там — это где...?"
90002070-43 = "Ты имеешь в виду вот эту штуку?"
90002070-44 = "Но разве её не создал Декаграмматон...?"
90002070-45 = "Мы почти закончили анализ! И подтвердили, что она подходит, совместима и никаких проблем нет!"
90002070-46 = "Успокойся, Кей. Мы говорили исключительно о её подвижности."
90002070-47 = "Верно. Мы сказали, что она сможет двигаться после имплантации контура сознания, но..."
90002070-48 = "Вот поэтому! Возьмите! И поместите меня туда!"
90002070-49 = "Я против. Я даже представить не могу все неизвестные переменные. Проще говоря... это слишком опасно."
90002070-50 = "И прежде всего нет никакой гарантии, что мы вообще сумеем взломать защиту этого устройства."
90002070-51 = "Дайте мне попробовать. Помните, я говорила, что смогу, если у меня будет достаточно времени и ресурсов?"
90002070-52 = "[s] «Но сейчас у нас нет ни того, ни другого!»"
90002070-53 = "Э-эм... Пусть это и не СОВСЕМ невозможно, рисков всё равно слишком много..."
90002070-54 = ""
90002070-56 = ""
90002070-57 = "Почему все говорят, что это невозможно?!"
90002070-58 = "Даже! Не попробовав! Сначала!"
90002070-59 = "Хм, похоже, энергия к тебе вернулась, Кей."
90002070-60 = "Вот, смотрите. Эта штука ведь сделана из материалов Стального континента, верно?"
90002070-61 = "Если синхронизация сработает, да? Если я подключусь к этой штуке? Может, это даст нам подсказку, что делать дальше!"
90002070-62 = "Но если мы потерпим неудачу..."
90002070-64 = "Почему ты так упорно настроена негативно?! С таким отношением никуда не продвинешься!"
90002070-65 = "Давайте попробуем! Прямо сейчас! А если не получится? Тогда вернёмся к вашей бесконечной круговой логике и потратим ещё больше времени!"
90002070-66 = "Кей, ты сейчас говоришь как загнанный менеджер среднего звена..."
90002070-67 = "Ой, да ладно. Мы способны на это! Мы уже один раз переносили систему сознания. Я вообще раньше была в брелоке! В безделушке! Вы все это прекрасно знаете!"
90002070-68 = ""
90002070-70 = ""
90002070-71 = ""
90002070-72 = ""
90002070-73 = "Да! Я до сих пор храню его на память!"
90002070-74 = "А, да. Спасибо, что сохранила его, Арис.#nВ общем, я хотела сказать..."
90002070-75 = "Мы уже делали это один раз, значит, сможем и снова!"
90002070-76 = "И я уже неоднократно говорила: если это не сработает, попробуем что-нибудь другое!"
90002070-77 = "...Ты правда настолько ненавидишь своё нынешнее тело...?"
90002070-78 = "Пожалуйста! Умоляю. Если вы хотя бы НЕ ПОПРОБУЕТЕ меня перенести..."
90002070-79 = "...я прямо здесь рухну и устрою истерику из сообщений об ошибках, пока вы не согласитесь!!"
90002070-80 = ""
90002070-82 = ""
90002070-83 = ""
90002070-84 = ""
90002070-85 = ""
90002070-87 = ""
90002070-88 = "Кей?!"
90002070-89 = "Ух... Кажется, я немного увлеклась... в этом разваленном теле..."
90002070-90 = ""
90002070-91 = "[ns] «...Почему бы нам не попробовать то, чего хочет Кей?»"
90002070-92 = "Н-но, Сенсей..."
90002070-93 = "Это совсем невозможно? Наверное... нет. Но всё же... риски есть."
90002070-94 = "Как я уже говорила, по возможности я бы хотела избежать появления дополнительных переменных..."
90002070-95 = "[s] «Но если всё получится, мы ведь что-то приобретём, верно?»"
90002070-96 = "Если получится АБСОЛЮТНО всё, то да. Очень вероятно, что этот модуль создали те дети Декаграмматона."
90002070-97 = "Мы также подтвердили, что некоторые области защищены особой системой безопасности. Возможность проанализировать её изнутри могла бы оказаться очень полезной."
90002070-98 = "Очевидно, что система безопасности каким-то образом связана с Кей. На случай сбоя мы также можем подключить дополнительное устройство резервной памяти."
90002070-99 = "Так что, полагаю, серьёзных проблем с сохранностью сознания и безопасностью Кей не будет, но..."
90002070-100 = "Если мы провалимся, это будет стоить нам драгоценного времени."
90002070-101 = "То есть времени на капитальный ремонт нынешнего тела Кей, времени на имплантацию её сознания в новое устройство..."
90002070-102 = "...и времени на его анализ."
90002070-103 = "[s] «...»"
90002070-104 = ""
90002070-107 = "[ns] «Тогда давайте попробуем!»"
90002070-108 = "В-вы серьёзно, Сенсей?!"
90002070-109 = "Потому что мы можем многое получить, говорите? И да, Кей будет в безопасности, даже если мы потерпим неудачу. Это правда, но..."
90002070-110 = "Уверена, мы столкнёмся со множеством проблем. Вы представляете, сколько времени это займёт? Сколько непредвиденного обслуживания?"
90002070-111 = "А? Я должна сделать это как «одолжение»?"
90002070-112 = "..."
90002070-113 = ""
90002070-115 = ""
90002070-116 = "Хорошо, Сенсей. Я попробую."
90002070-117 = "*вздох* Раз Сенсей так говорит, ничего не поделаешь. К тому же это просьба моей милой подруги."
90002070-118 = "Я так рада за тебя, Кей! Все тебе помогут!"
90002070-119 = "Хи-хи, хи-хи-хи... Я так и знала... Искреннее убеждение... и падение без сил... обязательно растрогают всех..."
90002070-120 = "Понятно! Я узнала от Кей кое-что новое. Попробую так в следующий раз, когда мне понадобится поговорить с Юкой!"
90002070-121 = "...Не думаю, что Юука на это купится, Момои..."
90002070-123 = "На счёт три нажми «Enter», Химари! Раз, два..."
90002070-124 = "...Три!"
90002070-126 = ""
90002070-130 = ""
90002070-131 = "Кей?"
90002070-132 = "Я тоже! Хочу посмотреть! Ого..."
90002070-133 = ""
90002070-135 = ""
90002070-136 = "Пока что я могу подтвердить, что это устройство успешно активировано. Кроме того..."
90002070-137 = "Ты можешь сказать, кто мы?"
90002070-139 = ""
90002070-140 = "[ns] «...Кей?»"
90002070-141 = ""
90002070-143 = "Сенсей? И..."
90002070-144 = "...Алиса?"
90002070-146 = "Кей!!"
90002070-147 = ""
90002070-152 = "Как и ожидалось от великой Кей! Я всем сердцем в тебя верила!"
90002070-153 = "...Я же говорила, что ничего не случится. Какие же вы ВСЕ драматичные..."
90002070-154 = "[s] «Думаю, шумиха была вполне оправданной.»"
90002070-155 = "Верно. Тебе бы не было обидно, если бы мы все отнеслись к этому равнодушно?"
90002070-156 = "Это было необходимо. Ради тебя, Кей, я постараюсь сохранять спокойствие."
90002070-157 = "Нет, всё нормально..."
90002070-159 = "Э... Эм... В таком случае, всем привет. Я Кей. Всё ещё Кей."
90002070-160 = "Это Кей!"
90002070-161 = "Ну вот, теперь ты красивая девушка-андроид!"
90002070-162 = "Ага. Этот дизайн лучше."
90002070-163 = "Я-я рада за тебя... Кей."
90002070-164 = "(...Мне и прежний дизайн не казался плохим...)"
90002070-165 = ""
90002070-167 = ""
90002070-168 = ""
90002070-169 = "...Теперь я могу ходить. Прыг! Могу говорить ртом, а не через тот жестяной динамик."
90002070-170 = "У меня есть волосы, руки, пальцы... Ну, в каком-то смысле руки у меня и раньше были, но... Неважно."
90002070-171 = ""
90002070-173 = ""
90002070-174 = "...*шмыгает носом*"
90002070-175 = "Поздравляю, Кей. Тогда перейдём к следующему этапу. Ты что-нибудь узнала, находясь в этом теле?"
90002070-176 = "Конечно, даже если нет, я всё равно рада видеть тебя счастливой."
90002070-177 = ""
90002070-179 = ""
90002070-180 = "Эм... Да. После такой истерики было бы стыдно сказать, что мне совсем нечем поделиться."
90002070-181 = "Так что скажу прямо. Мне есть чем поделиться."
90002070-182 = "Вернёмся на транспортный корабль."
90002070-184 = "Следующий эпизод;Повышение уровня"
