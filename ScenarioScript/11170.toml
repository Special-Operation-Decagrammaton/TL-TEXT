[translation]
11170-2 = "Episódio 17;Nuvens Negras no Horizonte"
11170-3 = "Faz-Tudo 68 - Escritório"
11170-5 = "Bom dia~"
11170-6 = "(Exausta) Bom dia..."
11170-7 = "Uau, que susto! Aru-chan, você virou a noite?"
11170-8 = "Não, eu dormi direitinho..."
11170-9 = "Presidente, tem alguma coisa te preocupando?"
11170-10 = "A gente já montou o plano direitinho, não foi?#nContratar o dobro de gente de antes e atrair Abydos pra um campo de batalha onde temos a vantagem do terreno."
11170-11 = "A Haruka saiu cedo de manhã pra plantar as bombas.#nPelo plano, vamos acabar com Abydos numa área com dezenas#nde bombas enterradas, né?"
11170-13 = "(Clac)"
11170-14 = "Estou de volta."
11170-15 = "Bem-vinda de volta, Haruka. Bom trabalho."
11170-16 = "Eu enterrei as bombas nos pontos principais. Agora é só apertar este botão e..."
11170-17 = "Isso aí, mandou muito bem! Só não vai esquecer os lugares, decora tudo direitinho."
11170-18 = "É só dar a ordem. Eu mesma vou mandar tudo pelos ares com estas mãos... Com estas mãos..."
11170-19 = "Ah..."
11170-20 = "Por que essa cara de quem tá morrendo?#nSe era pra ficar assim, devia ter pedido um adiantamento pro tal cliente desde o começo e usado pra bancar tudo."
11170-21 = "...Não aceitamos adiantamentos. Essa é a regra de ouro da nossa empresa."
11170-22 = "O motivo era que, se aceitarmos um adiantamento, ficamos obrigadas a obedecer às ordens do cliente... era isso mesmo?"
11170-23 = "Exatamente. Primeiro concluímos o serviço com maestria, e só então recebemos o pagamento.#nSe quebrarmos essa ordem, jamais alcançaremos a visão que buscamos."
11170-24 = "Visão? A gente tinha isso?"
11170-25 = "É claro que temos!! Foras da lei hard-boiled, livres das amarras da lei e da ordem!#nEssa é a visão da Faz-Tudo 68!!"
11170-26 = "Era? Ah, lembrei, lembrei."
11170-27 = "Como a Kayoko acabou de dizer, o mesmo vale para os pedidos dos clientes.#nEles podem se tornar correntes que nos prendem.#nPodemos acabar sendo forçadas a agir contra a nossa vontade."
11170-28 = "Por isso, o pagamento deve ser sempre recebido apenas após o sucesso da missão."
11170-29 = "..."
11170-30 = "Se está sentindo tanta pressão assim, largar tudo e voltar pra Gehenna também é uma opção, Presidente."
11170-31 = "Hã?!"
11170-32 = "E-Eu não disse que estou sentindo pressão! Só... um pouquinho..."
11170-33 = "Hmm, mas voltar agora não seria meio impossível? O pessoal do Comitê Disciplinar não ia deixar barato."
11170-34 = "O Comitê Disciplinar... é."
11170-36 = "É verdade que o Comitê Disciplinar nos vê como uma pedra no sapato...#nMas não foi deles que nós fugimos."
11170-37 = "Além disso, o verdadeiro motivo de o nosso Comitê Disciplinar às vezes ser chamado de o mais forte de Kivotos..."
11170-40 = "É por causa da existência da Chefe do Comitê Disciplinar, Hina."
11170-41 = "Não é exagero dizer que quase todo o poder de combate do Comitê Disciplinar está nas costas dela.#nEla é a própria encarnação de 'uma pessoa que vale por cem'."
11170-42 = "Em outras palavras,"
11170-46 = "Tirando a Hina, o resto do Comitê Disciplinar não é grande coisa."
11170-47 = "Se elaborarmos um bom plano, temos chances de sobra de vencer."
11170-49 = "Sério? Kayoko-cchi, você pensou até nisso?"
11170-50 = "Porque uma hora ou outra vamos acabar nos enfrentando. Se for o Comitê Disciplinar sem a Hina,#npelo esforço que estamos dedicando contra Abydos agora, conseguiríamos lutar contra eles sem dificuldade."
11170-51 = "Por outro lado, isso significa que Abydos é um oponente que não se pode subestimar.#nEmbora o número reduzido de alunas seja o maior ponto fraco delas."
11170-52 = "Ué? Será que elas são tão fortes assim...?"
11170-55 = "..."
11170-56 = "...Não, voltar para Gehenna agora está fora de cogitação."
11170-57 = "Mas por outro lado... ah."
11170-58 = "...Afinal, o que é que está te incomodando?"
11170-59 = "Tá bom, tá bom. Chega de papo chato, Aru-chan,#nvamos comer alguma coisa.#nEu tô com fome."
11170-60 = "Vamos na casa de lámen? No Shibasaki?"
11170-61 = "De novo?"
11170-62 = "Relaxa, relaxa. Parece que o turno da garota do bico só começa à tarde.#nSe a gente não der de cara com ela, não tem problema, né?"
11170-63 = "Bem... estava gostoso mesmo. De qualquer forma, precisamos animar a Presidente..."
11170-64 = "Então tá combinado! Vamos, vamos♪"
11170-66 = "Comitê de Contramedidas - Sala de Aula"
11170-68 = "(Ao entrar na sala de aula, Hoshino estava deitada com a cabeça no colo de Nonomi)"
11170-69 = "Bom dia, Sensei~"
11170-70 = "Bom dia, Sensei. Chegou cedo hoje, não é?"
11170-71 = "Hm? Que eu tô bem relaxada? Uhee~ O colo da Nonomi-chan é macio e maravilhoso.#nÉ o meu assento VIP exclusivo, sabe~"
11170-72 = "O Sensei também quer experimentar? Pode vir, fique à vontade~☆"
11170-73 = "Nem pensar! Esse lugar aqui é meu, então o Sensei pode ir sentar naquela#ncadeira ali que parece bem desconfortável~"
11170-74 = "Meu colo não é exclusivo da senpai..."
11170-77 = "(Sussurrando) Da próxima vez, fazemos isso quando não tiver ninguém por perto, Sensei."
11170-79 = "Opa, lá vai."
11170-80 = "Uaaah~ Todo mundo tá cheio de energia logo cedo, hein."
11170-81 = "Faz tempo que não temos um momento para relaxar... Agora deve estar todo mundo#nfazendo o que tem vontade."
11170-82 = "Hmm, a Shiroko-chan com certeza está treinando,#ne a Ayane-chan provavelmente foi estudar na biblioteca..."
11170-83 = "E a Nonomi-chan limpou a escola e arrumou a sala de aula pra gente, né~#nUhee~ Todo mundo é tão esforçado."
11170-84 = "Hm? Eu? Uhee~ Eu, claro, fiquei só à toa por aqui mesmo."
11170-85 = "Que tal a senpai começar alguma coisa também? Um trabalho de meio período, ou musculação..."
11170-86 = "Sem chance, sem chance~ O corpo deste velhote já não aguenta mais esses esforços pela idade, sabe~"
11170-87 = "Mas temos quase a mesma idade, sabia?"
11170-88 = "Uhee~ Enfim, o Sensei já chegou, então o resto do pessoal deve estar chegando também, né?#nSendo assim, vou dar no pé."
11170-89 = "Ora, senpai, aonde vai?"
11170-90 = "Uhee~ Hoje é dia de folga pro velhote aqui.#nVou ficar matando tempo por aí, então se acontecer alguma coisa me avisa, Nonomi-chan."
11170-92 = "Hoshino-senpai... Parece que ela foi tirar mais um cochilo."
11170-93 = "Hmm, acho que não tem problema. A Ayane-chan vai conduzir a reunião direitinho."
11170-94 = "Ahaha... Pensando bem, a Hoshino-senpai mudou bastante em comparação a antes."
11170-95 = "Hein? Como ela era antes?"
11170-96 = "Hoje em dia ela parece estar sempre sonolenta, mas...#nQuando eu a conheci, a Hoshino-senpai parecia estar constantemente sendo perseguida por alguma coisa."
11170-97 = "Se me perguntar pelo quê... humm, acho que por absolutamente tudo."
11170-98 = "Pelo que ouvi dizer, antes havia uma certa senpai aqui..."
11170-99 = "Parece que ela foi a última presidente do conselho estudantil de Abydos, mas era uma pessoa muito avoada e, depois que ela partiu, a Hoshino-senpai acabou tendo que assumir tudo sozinha..."
11170-100 = "Dizem que a Hoshino-senpai estava no primeiro ano na época...#nEu também não sei os detalhes."
11170-101 = "Mas agora temos o Sensei, e podemos até interagir com alunas de outras academias..."
11170-102 = "Antes, ela detestava até mesmo a ideia de se envolver com outras escolas...#nEla amoleceu bastante, não é?"
11170-103 = "Sim, com certeza é graças ao Sensei☆"
11170-105 = "..."
11170-108 = "..."
11170-109 = "Ora, ora."
11170-111 = "Eu estava à sua espera, Hórus do Alvo...#nNão, era Hoshino-san, certo? Peço perdão pela indelicadeza."
11170-112 = "Ah, que isso, ainda não me acostumei totalmente a Kivotos.#nPor aqui, por favor, Hoshino-san."
11170-113 = "...Ei, cara de terno preto, o que você quer desta vez?"
11170-114 = "...Fufu, as circunstâncias mudaram.#nDesta vez, pensei em fazer mais uma proposta à senhorita Hoshino, portadora do maior Mistério de Abydos."
11170-115 = "Proposta? Não brinca comigo!!! Eu já disse que isso...!!"
11170-116 = "Calma, calma, por favor, acalme-se."
11170-117 = "...?!"
11170-118 = "...Há uma fala do meu filme favorito. Permitirei-me citá-la desta vez."
11170-120 = "(Tump)"
11170-123 = "Vou lhe fazer uma proposta que você jamais poderá recusar."
11170-124 = "Acredito que será uma proposta bastante interessante, portanto, peço que ouça com atenção."
11170-125 = "Kuku, kukukuku..."
11170-127 = "Próximo;Não Somos Amigas!"
