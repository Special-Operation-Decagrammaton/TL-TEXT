[translation]
11170-2 = "Эпизод 17;Надвигается буря"
11170-3 = "Офис «Решателя проблем 68»"
11170-5 = "Доброе утро!"
11170-6 = "*зевает* Доброе утро..."
11170-7 = "Ого, Ару, ты в порядке? Всю ночь не спала?"
11170-8 = "Н-нет. Я спала... технически."
11170-9 = "Что на этот раз тебя гложет, босс?"
11170-10 = "План ведь уже готов, да? Нанимаем вдвое больше бойцов, потом заманиваем девчонок из Абидоса туда, где преимущество будет на нашей стороне."
11170-11 = "А Харука с утра ушла устанавливать взрывчатку.#nПлан ведь в том, чтобы перебить студентов Абидоса одну за другой в зоне поражения, да?"
11170-12 = ""
11170-13 = "*дверь открывается*"
11170-14 = "Я вернулась."
11170-15 = "О, вернулась. Ну...? Как всё прошло?"
11170-16 = "Я установила бомбы на ключевых перекрёстках. Теперь достаточно нажать эту кнопку, и..."
11170-17 = "Отлично! Главное, не забудь, где они все стоят."
11170-18 = "Конечно. Только скажите — и от них мокрого места не останется..."
11170-19 = "Тц..."
11170-20 = "Что теперь не так? Деньги? Если это настолько бьёт по нашим карманам, почему мы не взяли у клиента аванс и не пустили его на подготовку?"
11170-21 = "Никаких авансов — политика компании. Ты же знаешь."
11170-22 = "Потому что предоплата даст клиенту слишком много права указывать нам, как работать, или что-то вроде того?"
11170-23 = "Именно. Мы получаем деньги только после выполнения работы. И никак иначе.#nИ я никогда не иду на компромиссы."
11170-24 = "Правда? С каких это пор?"
11170-25 = "Всегда так было! Мы крутые преступницы, не скованные ни правилами, ни законами!#nЭто всегда было главным принципом Решал 68!"
11170-26 = "Да? Наверное, что-то знакомое в этом и правда есть."
11170-27 = "С контрактами то же самое. Всегда есть шанс, что это окажется ловушкой. Мы не хотим, чтобы нас вынуждали делать то, чего мы сами не хотим."
11170-28 = "Поэтому и берём оплату только после завершения работы."
11170-29 = "..."
11170-30 = "Знаешь, босс... если давление становится слишком сильным, можно просто всё бросить и вернуться в Геенну."
11170-31 = "Что?!"
11170-32 = "К-кто сказал, что на меня слишком сильно давят?! Я просто... немного..."
11170-33 = "Хе... Не думаю, что это хорошая идея. Префектурная команда уже не спустит ей всё с рук."
11170-34 = "Тоже верно."
11170-36 = "Наверное, для Префектурной команды мы уже просто заноза в заднице.#nХотя мы ведь и сюда приехали не ради того, чтобы от них убежать."
11170-37 = "И не забывайте: единственная причина, по которой Префектурную команду считают самой страшной организацией во всём Кивотосе..."
11170-39 = ""
11170-40 = "...это глава префектов Хина."
11170-41 = "Большая часть их боевой мощи приходится на одну только главу префектов.#nОна буквально армия из одного человека."
11170-42 = "Другими словами..."
11170-43 = ""
11170-46 = "...остальная Префектурная команда вовсе не непобедима."
11170-47 = "Если правильно разыграем карты, шанс победить у нас есть."
11170-48 = ""
11170-49 = "Вот как? Не знала, что ты настолько далеко всё продумала, Каёко."
11170-50 = "Рано или поздно нам всё равно придётся с ними сражаться. Можно использовать те же ресурсы, что мы подготовили против Абидоса, чтобы разобраться с Префектурной командой без Хины."
11170-51 = "Настолько сильными я считаю девчонок из Абидоса. Их единственная настоящая слабость — малочисленность."
11170-52 = "Вот оно как..."
11170-53 = ""
11170-55 = "..."
11170-56 = "Нет. Возвращение даже не обсуждается."
11170-57 = "Хотя хотелось бы, чтобы обсуждалось..."
11170-58 = "Ты уже можешь определиться?!"
11170-59 = "Ладно. Хватит этого скучного разговора, пойдём поедим.#nЯ умираю с голоду."
11170-60 = "Как насчёт рамэна? В «Шиба Сэки»?"
11170-61 = "Туда?"
11170-62 = "Боишься той подработчицы? Она работает только после обеда. Просто не будем с ней пересекаться."
11170-63 = "Наверное... Признаю, еда там была довольно вкусной. Да и боссу не помешало бы немного поднять настроение."
11170-64 = "Отлично! Пошли! ♪"
11170-66 = "Комната Комитета по предотвращению закрытия Абидоса"
11170-68 = "Когда я вошёл в клубную комнату, меня встретила Хошино, устроившая голову на коленях Нономи."
11170-69 = "Ой. Доброе утро, Сенсей."
11170-70 = "Вы рано. Рада вас видеть."
11170-71 = "Выгляжу удобно, да? Хе. Колени Нономи такие мягкие — идеально для сна. Будто моя собственная подушка."
11170-72 = "Для вас тоже место найдётся, Сенсей! Устраивайтесь поудобнее! ☆"
11170-73 = "Не-а! Я первая заняла эти колени, так что отойдите и садитесь на один из тех неудобных стульев, Сенсей."
11170-74 = "Никто не говорил, что их можно «занимать», но ладно..."
11170-75 = ""
11170-76 = ""
11170-77 = "(Почему бы вам не зайти попозже, когда здесь никого больше не будет, Сенсей?)"
11170-78 = ""
11170-79 = "*потягивается*"
11170-80 = "*зевает* Как это все уже заняты делами с самого утра?"
11170-81 = "Впервые за долгое время у нас появилась передышка... Видимо, все решили наконец заняться тем, что давно откладывали."
11170-82 = "Широко, наверное, тренируется, а Аяне, скорее всего, учится в библиотеке."
11170-83 = "Ого. А ты пришла в школу пораньше, чтобы прибраться в клубной комнате, Нономи?#nКакие же вы все трудолюбивые."
11170-84 = "А я? Хе. А я просто валялась без дела!"
11170-85 = "Может, для разнообразия займёшься чем-нибудь полезным, Хошино?#nПодработкой, например, или сходишь в спортзал?"
11170-86 = "Не-а. У меня и так забот выше крыши. К тому же я старая сморщенная развалина, которая едва выдерживает занятия на свежем воздухе."
11170-87 = "Но мы ведь почти одного возраста."
11170-88 = "В любом случае, раз Сенсей уже здесь, остальные скоро подтянутся.#nА я пойду пока убью время."
11170-89 = "А? Эй, ты куда?"
11170-90 = "Сегодня у меня выходной! Меня весь день не будет, так что звоните, если что-то случится."
11170-92 = "Хошино... Наверняка опять пойдёт спать."
11170-93 = "Наверное, ничего страшного. Аяне всё равно проследит, чтобы собрание прошло нормально."
11170-94 = "Ха-ха... И всё же Хошино сильно изменилась с тех пор, как я впервые с ней познакомилась."
11170-95 = "Хм? А какой она была раньше?"
11170-96 = "Сейчас она кажется ленивой соней, но тогда не было ни минуты, чтобы Хошино не выглядела измотанной и напряжённой."
11170-97 = "Из-за чего она так переживала? Не знаю... Из-за всего?"
11170-98 = "Я не знаю всех подробностей, но раньше здесь был ещё один студент..."
11170-99 = "Говорят, она была последним президентом ученического совета Абидоса.#nНасколько я слышала, на неё нельзя было особенно положиться или довериться.#nПосле её исчезновения Хошино пришлось всё делать самой."
11170-100 = "А Хошино тогда была всего лишь первокурсницей. В общем, как я сказала,#nвсех деталей я не знаю."
11170-101 = "Но теперь у нас есть вы, Сенсей. И со студентами других академий она тоже общается без проблем..."
11170-102 = "Раньше она никогда бы так не поступила. Можно сказать, наконец-то немного оттаяла."
11170-103 = "И мне кажется, всё это благодаря вам, Сенсей! ☆"
11170-105 = "..."
11170-106 = ""
11170-108 = "..."
11170-109 = "А, вы пришли."
11170-111 = "Я вас ждал, Хор Восхо... Ах, прошу прощения.#nТеперь вас зовут «Хошино», верно?"
11170-112 = "Боюсь, я всё ещё привыкаю к здешним порядкам Кивотоса.#nПрошу, сюда, мисс Хошино."
11170-113 = "Чего тебе опять надо, Чёрный Костюм?"
11170-114 = "Если кратко, обстоятельства изменились. И поскольку вы обладаете величайшей Мистикой во всём Абидосе, я хотел бы, чтобы вы ещё раз обдумали моё предложение."
11170-115 = "Опять это? Да отстань ты уже! Я ведь уже...!"
11170-116 = "Ай-ай-ай. Давайте говорить потише, хорошо?"
11170-117 = "...?!"
11170-118 = "Как бы это сказать? Ах, пожалуй, процитирую один из моих любимых фильмов."
11170-120 = "*садится*"
11170-123 = "Я сделаю вам предложение, от которого вы не сможете отказаться."
11170-124 = "Уверяю, оно покажется вам очень заманчивым. Может, хотя бы выслушаете?"
11170-125 = "Хе-хе... Ха-ха-ха."
11170-127 = "Следующий Эпизод;Мы им не друзья!"
