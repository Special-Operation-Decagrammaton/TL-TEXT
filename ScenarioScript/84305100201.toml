[translation]
84305100201-5 = "Ты гораздо полезнее, чем я ожид... то есть представляла, Юризоно Сэя."
84305100201-6 = "Чувствую, будто я у тебя в долгу."
84305100201-7 = "Не думай об этом так. На самом деле мне кажется, что это ты помогаешь мне."
84305100201-8 = "В каком смысле? Не понимаю."
84305100201-9 = "Фуфу, трудно объяснить. Просто такое ощущение."
84305100201-10 = "Но сейчас важно не это. Верно, Нэру?"
84305100201-11 = "Ха...!"
84305100201-12 = "Раз понимаешь, тогда двигаемся. Ты уже должна знать: я не люблю тратить время впустую."
