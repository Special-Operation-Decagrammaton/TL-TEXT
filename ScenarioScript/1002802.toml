[translation]
1002802-53 = "."
1002802-1 = "Чем мы занимаемся поздно ночью"
1002802-2 = "Я направился в прачечную, переживая, что Асуна может устроить какую-нибудь сцену."
1002802-5 = "Прачечная работала круглосуточно, но глубокой ночью там было тихо."
1002802-6 = "*ж-ж-ж*"
1002802-7 = "Из прачечной доносился звук работающих стиральных машин."
1002802-8 = "[s] Пойти туда, откуда доносится звук."
1002802-9 = ""
1002802-15 = "А?"
1002802-16 = "Мне сейчас что-то послышалось...?"
1002802-17 = "[s1] «...Асуна?»\n[s2] «Так ты и правда здесь.»"
1002802-18 = "...?"
1002802-19 = "...?"
1002802-22 = "― А? Что вы делаете здесь в такое время, Господин?[wa:2240]"
1002802-25 = "― Я? Разве не очевидно? Пришла стирать бельё![wa:1690]"
1002802-28 = "― ...Почему я так одета, когда стираю?[wa:930]"
1002802-31 = "― Потому что вся остальная одежда сейчас в стирке.[wa:1140]"
1002802-33 = "― Я сейчас стираю всё нижнее бельё, так что больше мне надеть нечего.[wa:10]"
1002802-36 = "― Что? Я не вру![wa:1930]"
1002802-38 = "― Хотите сами проверить?[wa:1400]"
1002802-41 = "[ns3] «Нет-нет. Я ошибся.»\n[ns4] «Так ты и правда пришла сюда только постирать.»"
1002802-44 = "― Хахаха. У вас лицо покраснело![wa:790]"
1002802-46 = "― Но почему вы здесь, Господин?[wa:830]"
1002802-49 = "― А? Вы пришли увидеться со мной? В такое время?[wa:1650]"
1002802-52 = "― Здорово! Мне одной уже становилось скучно![wa:2220]"
1002802-54 = "― Спасибо, Господин! Так во что будем играть?[wa:1930]"
1002802-58 = ""
1002802-59 = "Я правда не ожидала встретить вас здесь!"
1002802-60 = "Вы пришли из-за сообщения, которое я отправила раньше? Так ведь? Я молодец?"
1002802-61 = "Вы получили сообщение и..."
1002802-62 = "...!"
1002802-63 = "Хм-м."
1002802-64 = "[s5] «...Асуна?»\n[s6] «Почему ты вдруг стала такой серьёзной?»"
1002802-65 = "Нет, просто..."
1002802-66 = "Нет, просто..."
1002802-67 = "Такое чувство, будто я внезапно вас вызвала. Теперь мне немного неловко."
1002802-68 = "[s7] «...Вызвала?»\n[s8] «Ну, это ведь не задание какое-нибудь.»"
1002802-69 = "Наверное, когда слышишь свой позывной, приходится откликаться!"
1002802-70 = "Хахаха! Да, пожалуй, вы правы."
1002802-71 = "Просто у меня такое ощущение. Хоть я и ходила вокруг да около, вы поняли, чего я хотела, и сразу пришли сюда."
1002802-72 = "Ой, точно! Мне же нужно запустить стиральную машину. Вот я растяпа."
1002802-73 = ""
1002802-75 = ""
1002802-79 = "Асуна бросила бельё из корзины в стиральную машину и нажала кнопку."
1002802-80 = ""
1002802-84 = "Стиральная машина Асуны загудела вместе с остальными."
1002802-87 = "Хм..."
1002802-88 = "Но если бы я знала, что вы и правда вот так прибежите, я бы позвала вас днём."
1002802-89 = "Вам ведь тоже нужно спать, правда?"
1002802-90 = "А?"
1002802-91 = "Вы пришли ко мне, потому что я тоже пришла бы к вам, если бы понадобилась?"
1002802-92 = "Ой-ой."
1002802-93 = "Как здорово! Значит, у нас такие отношения? Да? Правда, Господин?"
1002802-94 = "Что я имею в виду под такими отношениями?"
1002802-95 = "Вы же сами сказали, Господин! Такие, где стоит одному позвать — и другой приходит."
1002802-96 = "Тогда, когда будете стирать, тоже можете звать меня. Я приду в любое время дня и ночи!"
1002802-97 = "Или когда я буду стирать, могу заодно постирать и наши вещи вместе. Вам ведь понравится, да?"
1002802-98 = "Сами справитесь? Я неправильно вас поняла?"
1002802-99 = "Хахаха! Почему вы извиняетесь? Мне нравится, что я никогда не знаю, что вы скажете!"
1002802-100 = "Ха-ха-ха-ха!"
1002802-102 = "Даже когда Асуна закончила стирать, мы продолжили сидеть и разговаривать."
1002802-103 = "А когда я вернулся в Шале, солнце уже вставало."