[translation]
2001503-1 = "Я хочу стать настоящей леди!"
2001503-2 = "По приглашению Каэдэ я отправился в комнату Клуба внутренней дисциплины."
2001503-3 = "О, Сенсей! Добро пожаловать!"
2001503-4 = "[s] «Так что ты так хотела выяснить?»"
2001503-5 = "Сенсей! Вы ведь знаете, как усердно я тренируюсь, чтобы стать настоящей леди, правда?"
2001503-6 = "Недавно я успешно съела весь зелёный перец в карри!"
2001503-7 = "[s] «Отличная работа.»"
2001503-8 = "Я думала, что ещё могу сделать ради своей цели."
2001503-9 = "И поэтому поискала в интернете."
2001503-10 = "[s1] «Хорошая мысль. В интернете можно найти что угодно.»\n[s2] «Не знал, что ты так хорошо разбираешься в технологиях, Каэдэ.»"
2001503-11 = "Правда ведь? Я умная, да...? В общем, я нашла кое-что полезное."
2001503-12 = "Правда ведь? Я умная, да...? В общем, я нашла кое-что полезное."
2001503-13 = "В том числе статью, где говорилось, что настоящая леди ВСЕГДА сохраняет спокойствие."
2001503-14 = "[s] «Вот как...»"
2001503-15 = "И знаете что? У меня это уже отлично получается!"
2001503-16 = "Я талисман Клуба внутренней дисциплины, который никогда не теряется ни в какой ситуации. Это про меня, Сенсей!"
2001503-17 = "Ого?! Значит, это...? Неужели я уже...?"
2001503-18 = "[s] «Так вот о каком великом открытии ты говорила...»"
2001503-19 = "Точно, Сенсей! Может быть, я уже стала настоящей леди!"
2001503-20 = "[s] «Вот это вывод!»"
2001503-21 = "Но в одиночку я этого не докажу, понимаете?"
2001503-22 = "Я позвала вас сегодня, чтобы показать: я уже стала настоящей леди!"
2001503-23 = "Давайте, Сенсей. Попробуйте смутить меня! Я покажу, как настоящая леди справляется с такой ситуацией!"
2001503-24 = "Это поединок один на один между вами и мной!"
2001503-25 = "[s3] «По-моему, ты немного драматизируешь...»\n[s4] «Ладно, вызов принят. Тогда это дуэль!»"
2001503-26 = "Ну же — начинаем!"
2001503-27 = "Ну же — начинаем!"
2001503-29 = "И вот началась дуэль с целью вывести Каэдэ из равновесия."
2001503-31 = "Используйте всё, что у вас есть, Сенсей! Меня невозможно смутить!"
2001503-32 = "[s] «Сама напросилась. Итак... насчёт клубничного торта, который я сегодня принёс...»"
2001503-33 = "Вы принесли торт?! Почему сразу не сказали?!"
2001503-34 = "[s] «Прости, но всю клубнику с торта я съем сам.»"
2001503-35 = "Н-Но ведь всем известно, что клубника — самое главное... в клубничном торте..."
2001503-36 = "[s5] «Попалась. И вообще, я шутил. Вот, угощайся.»\n[s6] «Похоже, счёт: Сенсей — один, Каэдэ — ноль.»"
2001503-37 = "Н-Нет, подождите! Я просто думала, что... если вы съедите всю клубнику, то...!"
2001503-38 = "Н-Нет, подождите! Я просто думала, что... если вы съедите всю клубнику, то...!"
2001503-39 = "Д-Да! Я просто переживала, что у вас заболит живот, вот и всё."
2001503-40 = "Я ни капельки не растерялась!"
2001503-41 = "Ладно, переходим к следующему!"
2001503-43 = "После этого ожесточённая психологическая война с Каэдэ продолжилась."
2001503-45 = "[ns] «Каэдэ, насчёт пудинга в холодильнике...»"
2001503-46 = "А? Вы про сладкий карамельный пудинг на верхней полке?"
2001503-47 = "Я его берегла! У-Ух... Н-Ну ладно!"
2001503-48 = "Е-Если вы правда хотите его съесть, то... Ух..."
2001503-49 = "[s] «Д-Да...»"
2001503-51 = "[ns] «Насчёт этого стального сундука со всеми твоими сокровищами...»"
2001503-52 = "О! Сенсей! С ним нужно обращаться осторожно! Там много драгоценных вещей!"
2001503-53 = "Там есть супергладкий камешек, который я недавно нашла в реке Красной Панды!"
2001503-54 = "О, хотите посмотреть? Я никогда не видела ничего настолько гладкого..."
2001503-56 = ""
2001503-57 = ""
2001503-58 = ""
2001503-59 = ""
2001503-60 = ""
2001503-61 = ""
2001503-62 = ""
2001503-64 = "[ns] «Думаю, достаточно.»"
2001503-65 = "*тяжело дышит* *тяжело дышит* Хмф! Это было довольно впечатляюще, Сенсей!"
2001503-66 = "Вы почти смогли меня смутить! Но вообще-то у вас совсем не получилось!"
2001503-67 = "[s] «Так ты всё ещё считаешь, что не растерялась...»"
2001503-68 = "Настоящая леди всегда сохраняет спокойствие!"
2001503-69 = "Судя по сегодняшнему эксперименту, похоже, я уже стала настоящей леди...#nТак тому и быть!"
2001503-70 = "О, посмотрите на время. День пролетел незаметно, правда?"
2001503-71 = "[s] «Да. Тебе нужно ещё куда-то?»"
2001503-72 = "Ага! Сегодня вечером специальная трансляция сериала «Маскированный Водитель»!"
2001503-73 = "Да!"
2001503-74 = "«Слушайте все водители перед телевизорами!»"
2001503-75 = "«Где бы вы ни находились, Маскированный Водитель будет там!»"
2001503-76 = "В этом году легендарной серии «Маскированный Водитель» исполняется 15 лет!#nВ честь совершенно новых эпизодов пройдёт специальное геройское шоу!#nВстретьтесь с Маскированным Водителем лично! Покупайте билеты прямо сейчас!"
2001503-77 = ""
2001503-80 = "...!"
2001503-81 = "Я..."
2001503-82 = "[s] «А?»"
2001503-83 = "А-А-А-А-А-А!!!"
2001503-84 = "С-СЕНСЕЙ! Я СМОГУ ВСТРЕТИТЬ МАСКИРОВАННОГО ВОДИТЕЛЯ ВЖИВУЮ!"
2001503-85 = "Билет! Мне надо купить билет!"
2001503-86 = "...!"
2001503-87 = "Что?! С-Сенсей, сайт продажи билетов упал! Что мне делать?!"
2001503-88 = "[s] «Эм, подожди здесь. Я достану тебе билет.»"
2001503-89 = "Ура! Спасибо, Сенсей! Вы лучший!"
2001503-90 = ""
2001503-92 = ""
2001503-93 = ""
2001503-96 = "[ns] «Похоже, путь к настоящей леди ещё очень долгий.»"
2001503-97 = "А?"
