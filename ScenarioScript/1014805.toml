[translation]
1014805-1 = "Последние каникулы путешественницы"
1014805-2 = ""
1014805-3 = "О, Сенсей."
1014805-4 = "Вы как раз вовремя."
1014805-5 = "Не волнуйтесь, сегодня нам некуда спешить."
1014805-6 = "Ну что, отправимся?"
1014805-7 = ""
1014805-9 = ""
1014805-14 = "Выставка Миллениума звучит интересно."
1014805-15 = "Бывала ли я раньше в Миллениуме? Несколько раз, но только по делам."
1014805-16 = "Межакадемические отношения — одна из немногих сфер интересов Общества Пандемониума."
1014805-17 = "Но я всегда приезжала по работе. Ни разу не была там как турист."
1014805-18 = "А, выставка этого года уже закончилась."
1014805-19 = "Может, тогда сходим вместе в следующем году?"
1014805-20 = ""
1014805-22 = ""
1014805-23 = "Только мы вдвоём."
1014805-30 = ""
1014805-31 = "...Я раньше никогда не выходила на этой станции."
1014805-32 = "Вы тоже?"
1014805-33 = "Хи-хи. Значит, сегодня нас обоих ждёт что-то новое."
1014805-34 = "Пойдём куда глаза глядят!"
1014805-35 = ""
1014805-37 = ""
1014805-39 = "Ого. Сколько же народу на рынке."
1014805-40 = "В последнее время по всей Геенне открывается всё больше сетевых продуктовых магазинов, и небольшие рынки вроде этого страдают."
1014805-41 = "Меня это тоже касается: я люблю неспешно бродить между лавками и всё рассматривать."
1014805-42 = "Давайте заглянем сюда."
1014805-43 = ""
1014805-45 = ""
1014805-46 = ""
1014805-47 = "Похоже на сувенирную лавку..."
1014805-48 = "Что это...?"
1014805-49 = ""
1014805-51 = ""
1014805-52 = "...Кальмар, расплющенный прессом...?"
1014805-53 = "Нет-нет-нет! Это не настоящий кальмар!"
1014805-54 = "Наш фирменный сэнбэй в форме кальмара! Очень популярный сувенир. Возьмёте? Можете прямо сейчас попробовать образец!"
1014805-55 = "А? ...Это не слишком ли безвкусно?"
1014805-56 = "В последнее время здесь редко встретишь парочки на прогулке. Настоящая редкость."
1014805-57 = "...Хм?"
1014805-58 = "А, простите, я сказал что-то лишнее? Просто вы выглядели как пара..."
1014805-59 = "...Не переживайте."
1014805-60 = "Раз уж мы здесь, почему бы не взять коробочку сэнбэй в форме кальмаров?"
1014805-61 = "Спасибо! Положу вам ещё несколько штук на пробу! Одну минутку!"
1014805-62 = ""
1014805-64 = ""
1014805-65 = "Хи-хи. Слышали, что он сказал?"
1014805-66 = "Я не против того, что он принял нас за пару."
1014805-67 = ""
1014805-69 = ""
1014805-70 = "А вы, Сенсей?"
1014805-72 = "Мы с Ирохой ещё какое-то время гуляли по рынку, заглядывая в лавки, которые привлекали наше внимание."
1014805-73 = ""
1014805-74 = "Это кафе? Давайте немного отдохнём здесь."
1014805-75 = "У меня ноги устали от ходьбы."
1014805-76 = "Хотите что-нибудь выпить?"
1014805-77 = "А? Нет, позвольте мне угостить вас. Это ведь я весь день вас за собой таскала."
1014805-78 = "Эй, Сенсей! Я серьёзно. Дайте мне... Ух, ладно. Но хотя бы за себя я заплачу, хорошо?"
1014805-79 = ""
1014805-81 = ""
1014805-85 = ""
1014805-86 = "Здесь очень уютно, но никого нет. Наверное, сюда редко заглядывают."
1014805-87 = "Не то чтобы я жаловалась. Словно у нас собственное маленькое кафе."
1014805-88 = "...Как же здесь хорошо."
1014805-89 = "В Геенне всё наоборот. Шумно. Многолюдно."
1014805-90 = "Хм-м, не то чтобы я это ненавидела. Просто иногда устаёшь от людей, понимаете?"
1014805-91 = "Порой я начинаю мечтать о другой жизни."
1014805-92 = "Представляю себе тихую, беззаботную жизнь где-нибудь в таком месте."
1014805-93 = "...С вами такое бывает?"
1014805-94 = "Наверное, вы тоже устаёте от людей. И от работы, конечно."
1014805-95 = "Знаете, Сенсей? А вот с вами я, пожалуй, хотела бы жить вместе."
1014805-96 = "А? Куда я хочу пойти дальше?"
1014805-97 = "Так, посмотрим..."
1014805-98 = "Кажется, неподалёку отсюда был пляж."
1014805-99 = "Он не пользуется особой популярностью у туристов, так что вряд ли там всё обустроено."
1014805-100 = "Но раз мы уже здесь, почему бы не посмотреть?"
1014805-101 = "К тому же..."
1014805-102 = "Я ведь в купальнике."
1014805-109 = "А-а..."
1014805-110 = "Какой приятный морской ветерок."
1014805-111 = "Здесь даже лучше, чем я ожидала."
1014805-112 = "...Сенсей."
1014805-113 = "Почему вы стоите так далеко?"
1014805-114 = "Бо́итесь промокнуть?"
1014805-115 = "Фу-фу. Не волнуйтесь, сейчас отлив."
1014805-116 = ""
1014805-118 = ""
1014805-119 = "Что думаешь?"
1014805-120 = "Вблизи ещё красивее, правда?"
1014805-121 = "..."
1014805-122 = ""
1014805-124 = ""
1014805-125 = "Что ж."
1014805-126 = ""
1014805-131 = "― [log=이로하 수영복]Фу-фу, [/log][wa:2040]"
1014805-133 = "― [log=이로하 수영복]у вас такое забавное выражение лица. [/log][wa:10]"
1014805-136 = "― [log=이로하 수영복]Не сердитесь на меня. [/log][wa:10]"
1014805-138 = "― [log=이로하 수영복]Я просто пошутила. [/log][wa:10]"
1014805-141 = "― [log=이로하 수영복]Какой тёплый песок.[/log][wa:1610]"
1014805-143 = "― [log=이로하 수영복]До сих пор хранит дневное тепло...[/log]"
1014805-146 = "― [log=이로하 수영복]...Сегодня было так весело.[/log][wa:1710]"
1014805-149 = "― [log=이로하 수영복]А вы? [/log]"
1014805-151 = "― [log=이로하 수영복]...Вам тоже понравилось?[/log]"
1014805-154 = "― [log=이로하 수영복]Может, нам просто... [/log][wa:260]"
1014805-156 = "― [log=이로하 수영복]...не возвращаться? [/log][wa:1340]"
1014805-159 = "― [log=이로하 수영복]Может, сбежим? Было бы здорово... Куда-нибудь очень-очень далеко.[/log][wa:6420]"
1014805-161 = ""
1014805-162 = "[ns] «...Ироха»."
1014805-164 = "[ns] «Хорошим детям пора домой»."
1014805-166 = "Ц."
1014805-167 = "Какой же вы упрямый, Сенсей."
1014805-168 = "[s1] «Тебе понравилось сегодня?»\n[s2] «Мы столько всего успели сделать вместе»."
1014805-171 = "...Если честно, нет."
1014805-172 = "Люди и правда жадные создания."
1014805-173 = "Думаю, вы и сами понимали, к чему я сегодня клонила."
1014805-174 = "Сегодня последний день летних каникул."
1014805-175 = "А значит, завтра всё вернётся на круги своя."
1014805-176 = "Не ожидала, что вы до самого конца будете потакать моим капризам."
1014805-177 = "[s3] «Потому что ты всегда усердно работаешь, Ироха».\n[s4] «Сегодня мы с тобой напарники по безделью»."
1014805-180 = "...Вы всегда находите нужные слова."
1014805-181 = "Слушайте. Насчёт моего прежнего предложения..."
1014805-182 = "Оно всё ещё в силе."
1014805-183 = "Знаю, знаю. Сегодня ваш ответ — нет."
1014805-184 = "Но думаю, когда-нибудь вы ответите «да»."
