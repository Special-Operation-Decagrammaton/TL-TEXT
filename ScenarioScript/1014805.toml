[translation]
1014805-1 = "Ausflug and the End of Summer Vacation"
1014805-3 = "Sensei."
1014805-4 = "You're right on time."
1014805-5 = "Well, it's not like we're in any rush."
1014805-6 = "Shall we get going, then?"
1014805-14 = "Oh... Millennium EXPO. That sounds interesting."
1014805-15 = "...Yes?#nAh, I've been to Millennium a few times for work."
1014805-16 = "The Pandemonium Society is quite interested in exchanges with other schools."
1014805-17 = "That said, I've never actually gone sightseeing there."
1014805-18 = "It seems this year's EXPO has already ended, though..."
1014805-19 = "If there's one next year, would you like to go with me?"
1014805-23 = "Just the two of us, of course."
1014805-31 = "This station... I've never gotten off here before."
1014805-32 = "You too, Sensei?"
1014805-33 = "Hehe. Then, I suppose it's a first for both of us."
1014805-34 = "Shall we go wherever the wind takes us?"
1014805-39 = "It's quite lively here."
1014805-40 = "In Gehenna, these kinds of local shopping streets are disappearing.#nThe momentum of the large shopping centers is something else."
1014805-41 = "Personally, it's a shame. I like walking around and looking at the small shops."
1014805-42 = "Oh. May I take a look at that shop?"
1014805-47 = "It looks like a souvenir shop, but..."
1014805-48 = "What is this...?"
1014805-52 = "Pressed... squid?"
1014805-53 = "Actually, it's not the real thing!"
1014805-54 = "It's our specialty, squid-shaped crackers! Would you like one?#nEveryone buys them as souvenirs. Get it? Squid-venirs!"
1014805-55 = "Is this... really popular...?"
1014805-56 = "By the way, are you two on a date?#nIt's rare to see people all the way out here."
1014805-57 = "...Yes?"
1014805-58 = "Ah, sorry. You two looked so cozy, I just..."
1014805-59 = "...No."
1014805-60 = "...Since we're here, I'll take one box."
1014805-61 = "One box of squid crackers sold! Thank you!#nPlease wait just a moment!"
1014805-65 = "Hehe. Did you hear that?"
1014805-66 = "It doesn't feel bad at all."
1014805-70 = "What about you... Sensei?"
1014805-72 = "(We spent the rest of the time visiting various places.)"
1014805-74 = "Shall we take a break at this cafe?"
1014805-75 = "I'm a little tired. We walked quite a lot."
1014805-76 = "What would you like to drink? My treat."
1014805-77 = "No, it's fine, really.#nI'm the one who dragged you along, after all."
1014805-78 = "Eh? Why would you say that? I told you it's fine...#nNo, I'm paying for everything... I'll pay for my own share—"
1014805-86 = "It's a nice atmosphere, but it's empty. Maybe because it's in a place with little foot traffic?"
1014805-87 = "Well, it's nice to have the place to ourselves, though."
1014805-88 = "Phew... this is relaxing."
1014805-89 = "Gehenna is just too noisy. And there are too many people."
1014805-90 = "Not that that's a bad thing, but...#n...Sometimes, I get tired of it."
1014805-91 = "And so... every time that happens, I imagine it."
1014805-92 = "Leaving everything behind and relaxing in a quiet place."
1014805-93 = "Don't you ever want to do that, Sensei?"
1014805-94 = "I mean, you're usually busy, right?"
1014805-95 = "I suppose... if it's with you, Sensei, running away together might not be so bad."
1014805-96 = "Next time, you ask?"
1014805-97 = "Well, let's see..."
1014805-98 = "The ocean is close by here."
1014805-99 = "Since we're here, why don't we go?"
1014805-100 = "It's not famous, so it probably won't be crowded..."
1014805-101 = "Actually, I brought it with me."
1014805-102 = "A swimsuit."
1014805-109 = "Phew..."
1014805-110 = "The sea breeze feels so good..."
1014805-111 = "It's a nicer place than I thought."
1014805-112 = "...Sensei?"
1014805-113 = "Aren't you going to come closer?"
1014805-114 = "Are you worried about your clothes getting wet?"
1014805-115 = "It's fine. The waves don't reach that far."
1014805-119 = "Here."
1014805-120 = "It's even more beautiful when you see it up close, isn't it?"
1014805-121 = "..."
1014805-125 = "Gotcha."
1014805-131 = "[wa:2120]― [log=이로하 수영복]Hehe.[/log]"
1014805-133 = "― [log=이로하 수영복]You're making such a face.[/log]"
1014805-136 = "― [log=이로하 수영복]Please don't be angry.[/log]"
1014805-138 = "― [log=이로하 수영복]It's just a cute little prank, isn't it?[/log]"
1014805-141 = "[wa:620]― [log=이로하 수영복]The sand, [wa:1470]it's warm, isn't it?[/log]"
1014805-143 = "― [log=이로하 수영복]It still has the heat from the day...[/log]"
1014805-146 = "[wa:360]― [log=이로하 수영복]...Today, [wa:1710]it was fun.[/log]"
1014805-149 = "― [log=이로하 수영복]You too, Sensei?[/log]"
1014805-151 = "― [log=이로하 수영복]...Is that so?[/log]"
1014805-154 = "[wa:620]― [log=이로하 수영복]Then, why don't we...[/log]"
1014805-156 = "― [log=이로하 수영복]Just not go back?[/log]"
1014805-159 = "[wa:3610]― [log=이로하 수영복]Just like this, [wa:1680]somewhere far away... [wa:3010]I'm just kidding.[/log]"
1014805-162 = "[ns] \"...Iroha.\""
1014805-164 = "[ns] \"It's time for good kids to head home.\""
1014805-166 = "Tch."
1014805-167 = "You're a tough one."
1014805-168 = "[s1] \"Did you have fun today?\"\n[s2] \"Do you think you can do your best tomorrow?\""
1014805-171 = "...Who knows."
1014805-172 = "Humans are greedy creatures, after all."
1014805-173 = "So, you knew. What kind of day today is."
1014805-174 = "Summer vacation ends today."
1014805-175 = "Starting tomorrow, it's back to the tedious, sluggish daily grind."
1014805-176 = "That's why this was special...#nI never expected you to stick with me until the very end. That was unexpected."
1014805-177 = "[s3] \"Because Iroha is always working hard.\"\n[s4] \"We're partners in slacking off, after all.\""
1014805-180 = "You and your words..."
1014805-181 = "That proposal from earlier."
1014805-182 = "It's still valid for a while."
1014805-183 = "You might say 'no' for now, but..."
1014805-184 = "Someday, I'm sure it'll be a 'yes'."