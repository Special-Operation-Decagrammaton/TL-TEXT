[translation]
1014805-1 = "Ausflüglerin and the End of Summer Vacation"
1014805-3 = "Sensei."
1014805-4 = "You're right on time."
1014805-5 = "Well, it's not like we're in a hurry."
1014805-6 = "Shall we get going, then?"
1014805-14 = "Heh... Millennium EXPO. Sounds interesting."
1014805-15 = "...Hm? #nAh, I've been to Millennium a few times for work."
1014805-16 = "Pandemonium Society is quite interested in interacting with other schools."
1014805-17 = "That said, I've never really done any proper sightseeing there."
1014805-18 = "It seems this year's EXPO has already ended, though..."
1014805-19 = "If they hold it next year, would you like to go together?"
1014805-23 = "Just the two of us, of course."
1014805-31 = "This station... I've never been here before."
1014805-32 = "You haven't either, Sensei?"
1014805-33 = "Hehe. This is the first time for both of us."
1014805-34 = "Shall we wander wherever our mood takes us?"
1014805-39 = "It's quite lively."
1014805-40 = "In Gehenna, local shopping streets like this have been declining. #nThe rise of shopping centers is something else."
1014805-41 = "Personally, I find it a shame. I like looking around at these small shops."
1014805-42 = "Ah. Can we take a look at that shop?"
1014805-47 = "It looks like a souvenir shop..."
1014805-48 = "What is this...?"
1014805-52 = "A pressed... squid?"
1014805-53 = "But guess what, it's not real!"
1014805-54 = "Our specialty, squid-shaped rice crackers! Would you like one? #nEveryone often buys them as souvenirs to take home. Sounds good isn't it? #nSquidly Speaking!"
1014805-55 = "Is this... really popular...?"
1014805-56 = "Anyway, are you two on a date? #nIt's rare to see people come all the way out here."
1014805-57 = "...Excuse me?"
1014805-58 = "Ah, sorry. You both just had such a good vibe, I couldn't help but..."
1014805-59 = "...No, it's fine."
1014805-60 = "...Since we're here, I'll take a box."
1014805-61 = "One box of squid crackers, coming right up! Thank you! #nPlease wait a moment!"
1014805-65 = "Hehe. Did you hear that?"
1014805-66 = "I don’t mind it at all."
1014805-70 = "What about you... Sensei?"
1014805-72 = "(We continued looking around various places after that)"
1014805-74 = "Should we take a break at this cafe?"
1014805-75 = "I'm a little tired. We walked quite a bit."
1014805-76 = "What would you like to drink? It's my treat."
1014805-77 = "No, it's fine, this is nothing. #nI'm the one dragging you around, after all."
1014805-78 = "Eh? Why are you being like this? I said it's fine... #nNo, I'm not going to let you pay for everything... I'll pay for my own—"
1014805-86 = "The atmosphere is nice, but it's completely empty. Maybe because it's in a place #n with less people around."
1014805-87 = "Well, it feels like we have the place to ourselves, which is nice."
1014805-88 = "Phew... It's so relaxing."
1014805-89 = "Gehenna is just too loud. There are too many people, too."
1014805-90 = "It's not like that's a bad thing, but... #nsometimes, it gets tiring."
1014805-91 = "So... every time that happens, I imagine it."
1014805-92 = "Throwing everything away and just relaxing in a quiet place."
1014805-93 = "Don't you ever feel like doing that too, Sensei?"
1014805-94 = "After all, you're pretty much always busy."
1014805-95 = "As I thought... it might not be so bad to run away together, if it's with you."
1014805-96 = "Our next stop?"
1014805-97 = "Let's see..."
1014805-98 = "The sea is close to here."
1014805-99 = "Since we're here, why don't we go take a look?"
1014805-100 = "It's not very famous, so it probably won't be crowded..."
1014805-101 = "Actually, I brought it with me."
1014805-102 = "My swimsuit."
1014805-109 = "Phew..."
1014805-110 = "The sea breeze feels so nice..."
1014805-111 = "It's a nicer place than I thought."
1014805-112 = "...Sensei?"
1014805-113 = "Aren't you going to come closer?"
1014805-114 = "Are you worried your clothes will get wet?"
1014805-115 = "It's fine. The waves don't reach that far."
1014805-119 = "See?"
1014805-120 = "It's even prettier when you look at it up close, you know?"
1014805-121 = "..."
1014805-125 = "Splash!"
1014805-131 = "[wa:2120]― [log=이로하 수영복]Hehe.[/log]"
1014805-133 = "― [log=이로하 수영복]You're making a great face.[/log]"
1014805-136 = "― [log=이로하 수영복]Please don't be mad.[/log]"
1014805-138 = "― [log=이로하 수영복]It's just a cute little prank, right?[/log]"
1014805-141 = "[wa:620]― [log=이로하 수영복]The sand,[wa:1470] is warm.[/log]"
1014805-143 = "― [log=이로하 수영복]The heat from the day is still lingering...[/log]"
1014805-146 = "[wa:360]― [log=이로하 수영복]...I had a lot of fun[wa:1710] today.[/log]"
1014805-149 = "― [log=이로하 수영복]You too, Sensei?[/log]"
1014805-151 = "― [log=이로하 수영복]...I see.[/log]"
1014805-154 = "[wa:620]― [log=이로하 수영복]In that case, why don't we...[/log]"
1014805-156 = "― [log=이로하 수영복]...just not[wa:1400] go home?[/log]"
1014805-159 = "[wa:3610]― [log=이로하 수영복]Just keep going[wa:1680] somewhere far away...[wa:2950] Just kidding.[/log]"
1014805-162 = "[ns] \"...Iroha.\""
1014805-164 = "[ns] \"Good kid has to go home, you know?.\""
1014805-166 = "Tsk."
1014805-167 = "You're tough to crack."
1014805-168 = "[s1] \"Did you enjoy today?\"\n[s2] \"Do you think you can do your best starting tomorrow?\""
1014805-171 = "...Who knows."
1014805-172 = "Humans are greedy creatures, after all."
1014805-173 = "Wait, so you knew. What kind of day today is."
1014805-174 = "Summer vacation ends today."
1014805-175 = "Starting tomorrow, it's back to our troublesome and sluggish everyday lives."
1014805-176 = "That's why it was a special occasion... #nI didn't expect you to stay with me until the very end. It was a surprise."
1014805-177 = "[s3] \"You're always working hard, Iroha.\"\n[s4] \"We're slacking-off buddies, after all.\""
1014805-180 = "There you go, saying things like that again..."
1014805-181 = "My proposal from earlier."
1014805-182 = "It's valid for a while."
1014805-183 = "It might be a \"no\" right now, but..."
1014805-184 = "One day, it's bound to become a \"yes.\""