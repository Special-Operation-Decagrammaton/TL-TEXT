[translation]
10059030-1 = "Episode 3: Black Market Investigation"
10059030-2 = "(The next day)"
10059030-8 = "Is this... the place?"
10059030-9 = "The black market the secretary mentioned."
10059030-10 = "...Captain. #nIs the black market really a place you can just walk into this easily?"
10059030-11 = "I assumed it would be hidden somewhere much more discreet."
10059030-13 = "Apparently, regular students come here to look for Momo Friends merchandise."
10059030-14 = "I suppose they must be strong enough to defend themselves against delinquents."
10059030-15 = "Still, though... I wonder who created a place like this in the first place."
10059030-16 = "I'd love to have a nice, long chat with them sometime."
10059030-17 = "I'm curious about that too. I wonder who the original founder of this lawless zone is."
10059030-21 = "Hehe, it's great to see everyone so motivated."
10059030-22 = "Let's begin the investigation immediately."
10059030-23 = "We will recover as many art pieces as possible and bring them back to the academy."
10059030-24 = "D-Dormitory Warden team... please, I'm counting on you..."
10059030-25 = "I don't really sense much spirit from Urara-sama herself, though..."
10059030-26 = "I-I just can't get used to places like this..."
10059030-27 = "Being too kind is both Vice President Urara's strength and her weakness. #nYou need to have a little more confidence."
10059030-28 = "Hmm... Urara-sama. #nHow about trying to shout something like this?"
10059030-32 = "You bastards!! Come at me all at once—!!"
10059030-33 = "Ehh...!?"
10059030-34 = "Go ahead, Urara-sama. #nJust as Manami-sama said, the first step is to have confidence."
10059030-39 = "Y-y-y-you bastards! #nA-a-all of you, come... come at... come at me... please...!"
10059030-42 = "Hehe, that's the spirit."
10059030-48 = "[ns] \"Everyone, someone is coming from over there.\""
10059030-51 = "What's this? Aren't those the honor students from Wild Hunt?"
10059030-52 = "Hey, you lot! What are you doing on our turf!?"
10059030-53 = "You're an eyesore. Get lost before you get hurt...!!"
10059030-54 = "Oh my. It seems we've caught some lively prey right from the start."
10059030-55 = "W-was I the bait...!?"
10059030-56 = "You bastards... are you mocking us right to our faces!?"
10059030-57 = "I'll make you pay dearly for looking down on us...!"
10059030-58 = "Now then. I wonder which of us will be paying the price."
10059030-59 = "Dormitory Warden Captain Sayo."
10059030-64 = "It's my turn."
10059030-65 = "Are you ready?"
10059030-69 = "W-what is this...?"
10059030-70 = "This pressure, it's suddenly—!"
10059030-71 = "In that case..."
10059030-72 = "Let's all have a fun little 'chat'."
