[translation]
52140-1 = "Эпизод 14;Фантомная художница «Красоты природы»"
52140-2 = ""
52140-3 = "Ч-Что ты имеешь в виду...? Ты говоришь, Азами из «Красоты природы»?"
52140-4 = "Именно. Хабу Азами вовсе не студент дочерней школы Эбису."
52140-5 = "Более того, думаю, именно она призывала Духов артефактов и нападала на людей."
52140-6 = "Всё это время мы играли ей на руку."
52140-7 = ""
52140-9 = ""
52140-11 = "Очень наблюдательно, госпожа офицер операций Хяккарёран."
52140-12 = "Полагаю, продолжать эту скучную шараду уже нет смысла. Но скажи, маленькая кошечка, что меня выдало?"
52140-13 = "Избавь меня от сарказма. Ты слишком явно что-то скрывала. Проклинаю себя за то, что не заметила раньше."
52140-14 = "Нужно было понять ещё тогда, когда ни один житель деревни тебя не узнал."
52140-15 = ""
52140-19 = "В конце концов, ты якобы президент Комитета самоуправления. Деревня крошечная, а тебя никто не знает."
52140-20 = "А потом Ябуки Сюро упала от выстрела президента Аямэ."
52140-25 = ""
52140-28 = "Том должен был её защищать. Если бы Сюро действительно всё контролировала, ранить её могла бы только Сотня Лотосов."
52140-29 = "Даже после этого мы её обыскали и ничего не нашли... Значит, том держал кто-то другой."
52140-32 = "И наконец, этот особняк явно принадлежал семье Кадэнокодзи."
52140-33 = "Они жили здесь до переезда в Центральный Хяккияко. Особняк Запределья, это огромное поместье, был их домом."
52140-34 = "Президент Комитета самоуправления Эбису никогда не забыла бы историю семьи Кадэнокодзи. Ты должна была узнать фамилию Юкари."
52140-35 = "Ты скрывала всё это до самого конца. Очевидно, ты утаивала правду об особняке. Ты заманила нас сюда."
52140-36 = ""
52140-38 = ""
52140-39 = ""
52140-40 = "Ха-ха-ха... Аха-ха-ха...!"
52140-41 = "Прекрасное расследование. Я знала, что ты мне понравишься, офицер операций!"
52140-42 = "Ну, раз кошка уже вылезла из мешка, можно переодеться во что-нибудь поудобнее."
52140-43 = ""
52140-52 = ""
52140-53 = "Меня зовут Хабу Азами. Я с гордостью служу госпоже Кокурико, хозяйке историй о призраках. Я заклинательница змей, очаровывающая простаков своим змеиным языком."
52140-54 = "Но моя настоящая страсть... искусство... фантомного толка."
52140-55 = "Моя задача была привести Хяккарёран в особняк моей госпожи. Очевидно, для Сюро это оказалось слишком... сложно."
52140-56 = "Ну что, повеселились? Я всегда хотела съездить в девчачье путешествие!"
52140-57 = "Коварная жестокая змея! Я прикончу тебя окончательно!"
52140-58 = "Фу-фу. Твоя пылкая смелость достойна внимания, но жалка."
52140-59 = "Думаешь, у тебя есть шанс без Сотни Лотосов? Или без Сенсея?"
52140-60 = "...Нет, в нынешней ситуации даже Нагуса уже не сможет тебе помочь."
52140-61 = ""
52140-63 = ""
52140-64 = "Ты... Что ты сделала с Нагусой?"
52140-65 = "Ну, хочешь попробовать угадать, умница? Какие ужасы с ней случились... интересно?"
52140-66 = ""
52140-68 = ""
52140-69 = "Ах... Да, именно такое выражение я и хотела увидеть. Твой страх изыскан."
52140-70 = "Можешь притворяться возмущённой, изображать смелость, но я вижу тебя насквозь."
52140-71 = ""
52140-73 = ""
52140-74 = "Мой том, «Фантомные иллюстрации Тоутэй», питается страхом."
52140-75 = "Я использую твой прекрасный страх — оттенки твоей боли — чтобы раскрашивать свои иллюстрации."
52140-76 = ""
52140-78 = ""
52140-82 = ""
52140-83 = ""
52140-84 = ""
52140-85 = ""
52140-86 = ""
52140-88 = ""
52140-90 = "Позволь ему поглотить тебя, дорогая. Выпусти его."
52140-91 = "...Пусть он задушит тебя изнутри и оживит мою историю."
