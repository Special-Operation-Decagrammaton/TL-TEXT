[translation]
52140-1 = "Episódio 14;A Artista Macabra do Clube Beleza da Natureza"
52140-3 = "O-O que você tá dizendo...? A Azami-san é do Clube Beleza da Natureza?"
52140-4 = "É exatamente o que eu disse. Ela — Azami Habu — não é nenhuma aluna da Escola Filial Ebisu."
52140-5 = "Se minha hipótese estiver certa... acredito que todas as aparições avistadas no Distrito Autônomo do Norte estavam sendo controladas por ela."
52140-6 = "Desde o começo, ela só estava nos dando corda."
52140-11 = "Que poder de dedução impressionante! Não é à toa que é a Estrategista da Hyakkaryouran."
52140-12 = "Bem, não há mais motivo para esconder, então tudo bem... mas desde quando você desconfiava?"
52140-13 = "Isso é sarcasmo...?#nÉ até vergonhoso eu não ter percebido antes uma atuação tão malfeita."
52140-14 = "Primeiro, os moradores próximos à Escola Filial Ebisu não se lembravam do seu rosto."
52140-19 = "Pensei que fosse coincidência, mas... numa cidade tão pequena, como ninguém conheceria a presidente do Comitê Autônomo?"
52140-20 = "E então... quando Shuro Yabuki foi baleada pela Ayame,"
52140-28 = "O poder do Livro Maldito deveria se aplicar não só às Hyakumonogatari, mas também à própria Contadora de Histórias Macabras. Só que, naquela hora, a Shuro foi atingida por uma arma comum."
52140-29 = "Além disso, ela não estava com o Livro Maldito. ...Sendo assim, tinha que haver outro membro do clube escondido por perto, não é?"
52140-32 = "E, por último, o que estava gravado nesta casa... era o brasão da família Kadenokouji."
52140-33 = "Se a família Kadenokouji usava esta \"Mansão Higan\" há 20 anos..."
52140-34 = "Mesmo que hoje seja uma ruína, como o Comitê Autônomo de Ebisu não saberia dessa história?"
52140-35 = "...A menos que houvesse um motivo para mentir."
52140-40 = "Ahaha... ahahaha!"
52140-41 = "Nossa, acabei ficando até hipnotizada ouvindo você falar."
52140-42 = "Pois bem, deixe-me apresentar novamente..."
52140-53 = "Eu sou uma serva de \"Kokuriko\"-sama, a Senhora dos Contos Macabros do Clube Beleza da Natureza. A Mulher-Serpente que acaricia corações frágeis com língua de cobra e..."
52140-54 = "A Artista Macabra, criadora de \"artes macabras\".#n...Chamo-me Azami Habu."
52140-55 = "Minha missão era guiar todas vocês até esta \"Mansão Higan\" no lugar da pobre Shuro-chan, mas..."
52140-56 = "Parece que vocês se divertiram bastante pelo caminho, o que me deixa muito feliz."
52140-57 = "Sua maldita...! Prepare-se...!"
52140-58 = "Hehe, é admirável ver tanta disposição, mas..."
52140-59 = "Vocês acham mesmo que conseguem me vencer? Logo agora que nem o Sensei de Schale — a última esperança de vocês — nem a Nagusa-san estão aqui."
52140-60 = "...De qualquer forma, do jeito que a Nagusa-san está agora, ela não serviria de grande ajuda em combate."
52140-64 = "Você... o que fez com a Nagusa-senpai?"
52140-65 = "Hmm, contar logo de cara não teria graça nenhuma... Tentem adivinhar."
52140-69 = "Aaaah...! Isso, isso! Era exatamente essa expressão que eu queria ver!"
52140-70 = "Por fora parecem arder em fúria — mas, por dentro, estão sendo corroídas pelo medo do desconhecido."
52140-74 = "Esse sentimento é o que dá poder ao meu Livro Maldito, o \"Toutei Bukkairoku\"...!"
52140-75 = "É o \"medo\" que vocês imaginam que pinta o Toutei Bukkairoku com as cores mais belas."
52140-90 = "Por favor, abram as asas da imaginação."
52140-91 = "Até o instante em que vocês se contorcerem em agonia e exalarem o último suspiro... a história continuará."
