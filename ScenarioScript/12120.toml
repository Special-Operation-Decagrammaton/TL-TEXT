[translation]
12120-1 = "Episódio 12;Alguns Segredos"
12120-2 = "Tcharam!"
12120-3 = "Hoshino-chan, olha, olha só! Um pôster antigo do Festival da Areia de Abydos! Finalmente consegui um!"
12120-4 = "Nessa época o oásis ainda se espalhava feito um lago, né? Ah, vou te dar este pôster de lembrança!"
12120-5 = "Ehehe, não é maravilhoso? Se algum milagre acontecer, um montão de gente vai se reunir aqui de novo, que nem naquela época—"
12120-6 = "Milagres não acontecem, senpai."
12120-7 = "Não existe nada disso. Em vez de sonhar, encare a realidade!"
12120-8 = "H-Hau..."
12120-9 = "Como é que um monte de gente viria para o meio desse deserto?! Já chega dessas fantasias!"
12120-10 = "Ueeh, mas Hoshino-chan... d-desculpa, tá?"
12120-11 = "...Ngh."
12120-12 = "Ficando aí nas nuvens, falando de milagres, felicidade e sei lá mais o quê..."
12120-13 = "Crie juízo de uma vez! Você é a Presidente do Conselho Estudantil de Abydos, sabia?! Que tal começar a ter um pouco mais de noção da responsabilidade que carrega nos ombros?!"
12120-14 = "(Raaasg!)"
12120-16 = "Comitê de Contramedidas — Sala de Aula"
12120-17 = "...Haa."
12120-18 = "Argh, qual é a deles, afinal?!"
12120-19 = "O que será que a Kaiser Corporation está tramando lá...?"
12120-20 = "Eles disseram que \"estão procurando um tesouro\", mas..."
12120-21 = "Não deveria haver nada naquele deserto. Acho que estão falando bobagem."
12120-22 = "Não sobrou nenhum recurso subterrâneo lucrativo como petróleo... Já saíram relatórios de pesquisa confirmando isso há muito tempo."
12120-23 = "Sendo assim, por que..."
12120-24 = "Não, não, agora a prioridade é a dívida, né?! Eles não falaram em 3000%?!!"
12120-25 = "E ainda exigiram uma caução... 300 milhões de ienes em só uma semana..."
12120-27 = "...Eu vou lá. Preciso investigar o que eles estão fazendo."
12120-28 = "S-Shiroko-senpai?! Ir aonde, exatamente...?"
12120-29 = "Na instalação da PMC. Se eu me preparar direito, acho que consigo me infiltrar. Vou lá ver o que estão fazendo."
12120-30 = "E-Espera, Shiroko-senpai! Antes disso, a gente tem que resolver a dívida!"
12120-31 = "..."
12120-32 = "...Não dá mais para pagar a dívida de um jeito honesto. Precisamos de outro método..."
12120-33 = "N-Não pode! Senão vai acontecer de novo..."
12120-34 = "...Eu concordo com a Shiroko-senpai! Se a escola acabar, acabou tudo! Não dá mais para ficar escolhendo os meios!!"
12120-35 = "Não diga isso, Serika-chan...?!"
12120-36 = "Espera, Serika-chan! Se fizer isso, vai ser igual àquela vez?!"
12120-37 = "N-Não foi isso que eu quis dizer! Não é bem assim, mas...!"
12120-38 = "A Hoshino-senpai impediu a gente naquela época, e agora você quer virar criminosa por conta própria?!"
12120-39 = "E-Eu..."
12120-40 = "..."
12120-41 = "Calma, calma, pessoal, respirem fundo~."
12120-42 = "Tá saindo até fumaça da cabeça de vocês~?"
12120-43 = "Nn..."
12120-44 = "..."
12120-45 = "..."
12120-46 = "Sim, me desculpe..."
12120-47 = "...Desculpa, eu não queria deixar o clima assim."
12120-48 = "Sim, todo mundo sabe disso. A Shiroko-chan também é uma boa menina, afinal."
12120-49 = "..."
12120-50 = "Bom, por enquanto vamos encerrar por hoje."
12120-51 = "Uhee~, então dispensadas, dispensadas~. Vamos esfriar a cabeça e nos reunir de novo amanhã. É ordem da presidente do comitê."
12120-52 = "[s] \"...É verdade. Por enquanto, vamos todas para casa.\""
12120-54 = "(Nonomi, Ayane e Serika foram para casa, deixando apenas Hoshino e Shiroko)"
12120-55 = "Hm~? Parece que a Shiroko-chan ainda tem alguma coisa pra fazer?"
12120-56 = "...Senpai, tem um minuto?"
12120-57 = "Uhee~, quer conversar com o velhote aqui? Assim eu fico encabulado~."
12120-58 = "[s] \"Eu também.\""
12120-59 = "...O Sensei também? Uhee, o velhote tá popular hoje~."
12120-60 = "Mas olha, hoje foi cansativo e aconteceu um monte de coisa, né?"
12120-61 = "Vamos conversar amanhã. Já tenho uma boa ideia do que é."
12120-62 = "...Nn, entendi."
12120-63 = "Sensei..."
12120-64 = "[s] Assentir."
12120-65 = "Nn, então até amanhã..."
12120-67 = "Uhee~, mandou bem, hein, Sensei? Desde quando você e a minha querida Shiroko-chan se entendem só pelo olhar~?"
12120-68 = "Nossa, o Sensei realmente é um adulto que não dá pra subestimar~. O velhote aqui não consegue acompanhar o ritmo e até fica meio solitário."
12120-73 = "[ns] \"Hoshino, posso te perguntar uma coisa?\""
12120-74 = "Hm~, o quê?"
12120-75 = "[s] Entregar o pedido de desligamento de Hoshino."
12120-78 = "Isso aí é..."
12120-79 = "Uhee~, quando foi que...! Com certeza foi a Shiroko-chan quem pegou isso, né?"
12120-80 = "Francamente, essa Shiroko-chan... Por mais que seja ela, mexer na bolsa da senpai já é demais~."
12120-81 = "Sensei, dê uma boa bronca na Shiroko-chan, tá~? Desse jeito não seria surpresa nenhuma se ela virasse uma supervilã."
12120-82 = "[s1] \"Sim. Isso a gente vê outra hora.\"\n[s2] \"Agora, eu quero saber sobre este pedido de desligamento.\""
12120-83 = "..."
12120-84 = "..."
12120-85 = "Entendi..."
12120-86 = "[s] \"Pode me contar?\""
12120-87 = "..."
12120-88 = "Hmm. Pelo visto você não vai me deixar escapar... né~?"
12120-89 = "...Haa, fazer o quê."
12120-92 = "Ficar conversando cara a cara assim é meio sem jeito... Sensei, quer dar uma volta por aí comigo?"
12120-93 = "[s] Sair para o corredor com Hoshino."
12120-100 = "Cof, cof... Uau, aqui também tá cheio de areia~..."
12120-101 = "Bom, não tem jeito mesmo. Mesmo se quiséssemos limpar, o prédio é grande demais para tão pouca gente..."
12120-102 = "Seria bom se as tempestades de areia diminuíssem..."
12120-103 = "Uhee~, passar toda a vida no ensino médio cercada só pela cor da areia... não acha meio deprimente?"
12120-104 = "[s] \"Você gosta mesmo desta escola, né, Hoshino.\""
12120-105 = "...Você concluiu isso do que eu acabei de falar? Uhee, o Sensei é mesmo uma pessoa estranha."
12120-106 = "...Dizem que, antes de a desertificação avançar, Abydos era uma escola enorme e poderosa... mas o velhote aqui não tem nenhuma lembrança nem sensação disso~."
12120-107 = "Desde o começo já era tudo uma bagunça, uma escola sem nada que prestasse."
12120-108 = "O prédio principal de Abydos de quando o velhote se matriculou já foi engolido pelo deserto. E os veteranos daquela época também já foram todos embora."
12120-109 = "Este lugar onde estamos agora é só um anexo para onde viemos parar depois de mudar de lugar várias vezes fugindo do deserto."
12120-110 = "...Bom, mas foi vindo para cá que eu conheci a Shiroko-chan, a Nonomi-chan, a Ayane-chan e a Serika-chan..."
12120-111 = "..."
12120-112 = "...Uhee, acho que eu gosto mesmo daqui~."
12120-113 = "[s] \"......\""
12120-114 = "...Sensei, vou ser sincera com você."
12120-116 = "Faz dois anos que venho recebendo uma proposta de uns caras estranhos."
12120-117 = "[s] \"Uma proposta?\""
12120-118 = "Da Kaiser Corporation..."
12120-119 = "Proposta, ou talvez um convite de recrutamento... Desde logo depois que entrei em Abydos, várias e várias vezes."
12120-120 = "Pensando bem, rolou de novo outro dia~..."
12120-122 = "Tenho uma proposta que certamente não poderá recusar."
12120-123 = "Abandone o Colégio Abydos e junte-se à nossa corporação... Se aceitar esta condição, assumiremos quase metade da dívida que atualmente pesa sobre Abydos."
12120-124 = "Kuku, kukukuku... Pois bem, ouçamos sua resposta. Se for sim, assine bem aqui."
12120-126 = "...Já disse mil vezes que eu recuso."
12120-127 = "..."
12120-129 = "Era uma oferta absurda de boa sob qualquer ponto de vista. Mas na época eu achava que o Colégio Abydos ia desmoronar se eu saísse, por isso sempre recusei..."
12120-130 = "...Parece que eles estão reunindo gente que possam usar na PMC."
12120-131 = "[s] \"...Quem é essa pessoa, afinal?\""
12120-132 = "Eu também não sei a identidade dele... Só o chamo de Terno Preto."
12120-133 = "[s] \"Terno Preto...\""
12120-134 = "Ele dá um calafrio estranho... Por maior que Kivotos seja, nunca vi ninguém daquele tipo..."
12120-135 = "É um sujeito suspeito, mas nunca chegou a causar nenhum problema em particular..."
12120-136 = "O que será que ele é, hein? Até aquele diretor da Kaiser parecia ter medo do Terno Preto..."
12120-137 = "[s] \"Então, este pedido de desligamento...\""
12120-138 = "...Uhee."
12120-139 = "...Bem, seria mentira dizer que não fiquei nem um milímetro em dúvida. Foi só um momento de fraqueza, sabe?"
12120-140 = "...É, vou jogar isso fora logo."
12120-142 = "Uhee~, que alívio."
12120-143 = "Desculpa por causar um mal-entendido à toa. É que contar isso para as meninas só ia deixá-las preocupadas sem ajudar em nada."
12120-144 = "Mas bem, também não é certo ficar escondendo coisas das minhas queridas calouras para sempre... Amanhã eu conto tudo direitinho para elas."
12120-145 = "Mesmo que isso só vá deixá-las sem saber o que fazer, é sempre melhor não guardar segredos."
12120-146 = "Na real, por enquanto não consigo pensar em nenhuma outra saída além de aceitar aquela proposta..."
12120-147 = "[s] \"...Com certeza deve haver outro jeito.\""
12120-148 = "..."
12120-149 = "É verdade, seria ótimo se acontecesse algum milagre..."
12120-150 = "...Um milagre, é?"
12120-151 = "...Boooom, fim de papo sobre isso."
12120-152 = "Então, até amanhã, Sensei."
12120-153 = "Adeus."
12120-157 = "[ns] \"Hoshino!\""
12120-158 = "O-O quê...?"
12120-159 = "[s] \"Como adulto, eu vou dar um jeito! Então...!\""
12120-160 = "..."
12120-161 = "...Uhehe. Eu parecia tão desanimada assim?"
12120-165 = "Sim. Obrigada, Sensei."
12120-170 = "(No dia seguinte)"
12120-171 = "Haa, bom dia, pessoal..."
12120-174 = "Ué, eu fui a primeira a chegar...?"
12120-176 = "...?"
12120-178 = "O que é isso...?"
12120-179 = "...Mentira,"
12120-180 = "Por quê... Por que isso?!?!"
12120-182 = "(Sobre a mesa estavam o pedido de desligamento deixado por Hoshino e uma carta para todas)"
12120-184 = "Próximo;O Que Escapou por Entre os Dedos"
