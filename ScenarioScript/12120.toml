[translation]
12120-1 = "Эпизод 12;Секреты"
12120-2 = "Та-дам!"
12120-3 = "Смотри, Хошино! Я наконец достала старый плакат Фестиваля оазиса Абидоса!"
12120-4 = "Оазис раньше был размером с озеро! Вот, можешь оставить на память!"
12120-5 = "Разве не потрясающе? Если случится какое-нибудь чудо, сюда снова начнут приезжать люди! Только представь!"
12120-6 = "Чудес не бывает."
12120-7 = "Такого не случится!"
12120-8 = "А-Ай..."
12120-9 = "Кому вообще захочется ехать в какую-то дыру посреди пустыни?! Хоть раз в жизни перестань мечтать!"
12120-10 = "П-Прости, Хошино... Я-я просто дурочка..."
12120-11 = "...!"
12120-12 = "Чудеса, удача, везение..."
12120-13 = "Ты президент Студсовета Абидоса! Относись к своей должности серьёзнее!"
12120-14 = "*рвёт* *р-рвёт* *р-р-рвёт*"
12120-16 = "Комната Комитета по предотвращению закрытия"
12120-17 = "..."
12120-18 = "Серьёзно! Что нам вообще делать?!"
12120-19 = "Что корпорация Кайзер делает там?"
12120-20 = "Похоже, они что-то выкапывали... Это их так называемое «сокровище»..."
12120-21 = "Не может быть. Там одна пустыня."
12120-22 = "Ни нефти, ни подземных ресурсов — ничего ценного. Это выяснили давным-давно."
12120-23 = "Тогда зачем им земля...?"
12120-24 = "Нет!! Сейчас проблема не в этом!! А что с долгом?! Они хотят выплату до конца месяца?! Как мы это сделаем?!"
12120-25 = "Кайзер Кредит уже прислали напоминание и потребовали взнос. К следующей неделе нужно найти 300 миллионов иен."
12120-26 = ""
12120-27 = "Я иду. Нужно выяснить, что они там делают."
12120-28 = "П-Погоди! Широко?! Ты куда—?!"
12120-29 = "К объекту PMC. Если всё тщательно подготовить, проникнуть будет несложно. Я выясню, для чего они его используют."
12120-30 = "Так станет только хуже, Широко! Нужно думать, как выплатить долг!"
12120-31 = "..."
12120-32 = "Этот долг не получится выплатить тем, что мы делали до сих пор. Сейчас нужны радикальные меры."
12120-33 = "Н-Нет! Если ты снова уйдёшь..."
12120-34 = "...Нет, хватит! Какой смысл поддаваться эмоциям?! Если потеряем школу — всё кончено! Я за!"
12120-35 = "Что?! Н-Нет!"
12120-36 = "А?! Серика! Ты всерьёз идёшь против Хошино?!"
12120-37 = "Я не это имела в виду! Просто..."
12120-38 = "Это ты всё усложняешь, Серика! Ты теперь собираешься стать преступницей?!"
12120-39 = "Я-я..."
12120-40 = "..."
12120-41 = "Так-так, успокойтесь все."
12120-42 = "Вы так разгорячились, что, клянусь, в комнате стало теплее."
12120-43 = "Э-Эм..."
12120-44 = "..."
12120-45 = "..."
12120-46 = "Ты права. Прости..."
12120-47 = "Я-я не хотела так отчаиваться... Прости."
12120-48 = "Да знаю, знаю. Я не могу долго на тебя злиться, Широко."
12120-49 = "..."
12120-50 = "Ладно. На сегодня хватит."
12120-51 = "На этом всё! Остудим головы и завтра соберёмся снова. Считайте это приказом президента."
12120-52 = "[s] «Хорошая мысль. Завтра вернёмся со свежей головой.»"
12120-54 = "Остальные участницы клуба одна за другой разошлись, пока не остались только Хошино и Широко."
12120-55 = "Что такое, Широко? Домой не идёшь?"
12120-56 = "У вас есть минутка?"
12120-57 = "Конечно. Хотела мне что-то сказать?"
12120-58 = "[s] «Я тоже здесь.»"
12120-59 = "О. Ты тоже, Сенсей?"
12120-60 = "Но я сегодня совсем вымоталась. Столько всего произошло."
12120-61 = "Можно до завтра? Кажется, я уже понимаю, о чём речь."
12120-62 = "О-О, хорошо. Поняла."
12120-63 = "Сенсей?"
12120-64 = "[s] Кивнуть."
12120-65 = "В таком случае..."
12120-66 = ""
12120-67 = "Ну-ну, Сенсей. Когда вы с миленькой Широко стали настолько близки, что понимаете друг друга одним взглядом?"
12120-68 = "Ого, пожалуй, мне и правда не стоит тебя недооценивать, Сенсей. Эта старушка уже начинает чувствовать себя лишней!"
12120-69 = ""
12120-71 = ""
12120-72 = ""
12120-73 = "[ns] «Будь со мной честна, Хошино.»"
12120-74 = "Хм? Насчёт чего?"
12120-75 = "[s] Показать Хошино заявление об уходе."
12120-76 = ""
12120-78 = "О. Разве это не...?"
12120-79 = "Ах! Когда ты...?! Погоди, это ведь Широко, да?"
12120-80 = "Ну Широко. Нельзя рыться в сумке своего президента!"
12120-81 = "И ты, Сенсей! Если продолжишь поддерживать крутое преступление под названием грабёж, к твоему возрасту Широко станет суперзлодейкой!"
12120-82 = "[s1] «Позже я с ней поговорю.»\n[s2] «А сейчас мне нужно поговорить с тобой.»"
12120-83 = "..."
12120-84 = "..."
12120-85 = "Значит, вот как."
12120-86 = "[s] «Расскажи мне. Ты ведь что-то скрываешь от остальных?»"
12120-87 = "..."
12120-88 = "Ну ты меня и прижал, да?"
12120-89 = "*вздох* Ладно."
12120-90 = ""
12120-91 = ""
12120-92 = "Не хочешь прогуляться со мной, Сенсей?"
12120-93 = "[s] Выйти из класса вместе с Хошино."
12120-100 = "*кашель* *кашель* Здесь тоже песок уже накапливается."
12120-101 = "Нас слишком мало, чтобы поддерживать такое большое здание в чистоте..."
12120-102 = "Вот бы песчаные бури хоть немного утихли..."
12120-103 = "Жестоко, правда? Не слишком ли сурово, что вся школьная жизнь этой старушки — один сплошной... песок?"
12120-104 = "[s] «Ты ведь очень любишь эту школу, правда?»"
12120-105 = "С чего ты взял?"
12120-106 = "Говорят, до наступления пустыни здесь была огромная и могущественная школа, но я ничего об этом не знаю."
12120-107 = "Я помню только бардак — разрушенную школу, где всё было вверх дном."
12120-108 = "Здание, куда я впервые пришла много лет назад, теперь погребено под песком, а все старшекурсницы, которыми я восхищалась, давно ушли."
12120-109 = "Это даже не главное здание школы. Просто пристройка, куда мы перебрались после того, как остальные здания поглотила пустыня."
12120-110 = "Но если бы я сюда не пришла, то не встретила бы Широко, Нономи, Аяне и Серику."
12120-111 = "*вздыхает*"
12120-112 = "Хех. Похоже, я всё-таки немного привязалась?!"
12120-113 = "[s] «...»"
12120-114 = "Можно честно, Сенсей?"
12120-116 = "Уже два года какие-то странные люди делают мне предложения."
12120-117 = "[s] «Предложения?»"
12120-118 = "Корпорация Кайзер."
12120-119 = "Можно назвать это вербовкой. С тех пор как я пришла в Абидос, они связывались со мной несколько раз."
12120-120 = "И недавно тоже..."
12120-122 = "Я сделаю вам предложение, от которого вы не сможете отказаться."
12120-123 = "Половина долга Абидоса будет немедленно списана, если ты бросишь школу и вступишь в корпорацию, которой я управляю."
12120-124 = "Хе-хе-хе. Ну что, договорились? Да? Тогда подпиши здесь."
12120-126 = "Сколько раз повторять? Нет. Мой ответ всё ещё нет."
12120-127 = "..."
12120-129 = "Предложение было заманчивым, без сомнений. Но тогда я постоянно отказывалась — потому что знала: если уйду, Абидос развалится."
12120-130 = "Но знаешь... Похоже, они набирают людей для своей PMC."
12120-131 = "[s] «Кто это был?»"
12120-132 = "Я тоже не знаю... Просто называю его Чёрным Костюмом..."
12120-133 = "[s] «Чёрный Костюм...»"
12120-134 = "От него мурашки. Я никогда не видела в Кивотосе никого, кто выглядел бы так."
12120-135 = "Он подозрительный, это точно... но проблем пока не создавал."
12120-136 = "Одно я знаю наверняка: даже руководители Кайзера его боятся."
12120-137 = "[s] «А это заявление об уходе?»"
12120-138 = "...О."
12120-139 = "...Ну, нельзя сказать, что сомнений у меня не было давно. Возможно, это всего лишь след тех колебаний."
12120-140 = "Дай сюда. Выброшу."
12120-141 = ""
12120-142 = "Хех. Видишь? Теперь оно в мусорке."
12120-143 = "Похоже, я зря вызвала подозрения. Но нет смысла зацикливаться на такой неприятной мысли."
12120-144 = "Но они мои младшие, и я им должна. Завтра всё им расскажу."
12120-145 = "История не самая счастливая, но я понимаю, что не должна скрывать это от них."
12120-146 = "Хотя понятия не имею, как начать..."
12120-147 = "[s] «Уверен, способ найдётся.»"
12120-148 = "..."
12120-149 = "Может быть. Возможно всё... даже чудеса."
12120-150 = "..."
12120-151 = "Ладно. Достаточно об этом."
12120-152 = "До завтра, Сенсей."
12120-153 = "Пока."
12120-154 = ""
12120-157 = "[ns] «Хошино!»"
12120-158 = "Ага?"
12120-159 = "[s] «Ты ведь знаешь, что можешь положиться на меня? Уверен, выход найдётся!»"
12120-160 = "..."
12120-161 = "Хех. Я выглядела настолько подавленной?"
12120-162 = ""
12120-163 = ""
12120-164 = ""
12120-165 = "Хорошо, Сенсей. Спасибо."
12120-170 = "На следующий день."
12120-171 = "*вздох* Всем привет. Аяне пришла."
12120-173 = ""
12120-174 = "Я первая...?"
12120-175 = ""
12120-176 = "А?"
12120-177 = ""
12120-178 = "Э-Это...?"
12120-179 = "..."
12120-180 = "Кья-а-а-а-а!"
12120-182 = "На столе лежали заявление Хошино о выходе из клуба, заявление об отчислении из академии и письмо."
12120-184 = "Следующий эпизод;То, что ускользнуло сквозь трещины"
