[translation]
1601906-39 = "#wait;1000"
1601906-1 = "Утренняя разведка"
1601906-2 = "...Разумеется, у любой системы обороны есть уязвимости. Это установила сама госпожа Рио, как никто другой."
1601906-3 = "Но мы всегда должны быть готовы к неожиданным ситуациям."
1601906-4 = "Кроме того, это особое место, где здравый смысл во многих отношениях не действует."
1601906-5 = "[s] «На тебя так можно положиться, Токи.»"
1601906-6 = "Спасибо, что признаёте это."
1601906-7 = "И есть ещё одна причина для утренней разведки."
1601906-8 = "[s] «И к чему же?»"
1601906-9 = "Скоро узнаете."
1601906-10 = ""
1601906-17 = "Да. Кажется, идеально."
1601906-18 = ""
1601906-20 = ""
1601906-21 = "Смотрите, Сенсей. Даже здесь восходит утреннее солнце."
1601906-25 = "― [log=토키 결전]Какой красивый рассвет.[/log][wa:1620]"
1601906-27 = "― [log=토키 결전]Здесь мы видим это каждый день.[/log][wa:1780]"
1601906-30 = "― [log=토키 결전]Хотя записей с момента нашего прибытия [/log][wa:930]"
1601906-32 = "― [log=토키 결전]у нас пока совсем немного...[/log][wa:270]"
1601906-35 = "― [log=토키 결전]Так что, возможно, не ПРЯМО каждый день.[/log][wa:480]"
1601906-38 = "[ns] «Невероятно.»"
1601906-40 = "― [log=토키 결전]Да. И всё же цвет здесь кажется совсем [/log][wa:2480]"
1601906-42 = "― [log=토키 결전]здесь всё иначе. [/log][wa:810]"
1601906-45 = "― [log=토키 결전]Небо...[/log]"
1601906-47 = "― [log=토키 결전]и даже земля сияет оранжевым.[/log][wa:270]"
1601906-50 = "― [log=토키 결전]Мне нравятся такие моменты, когда я могу любоваться пейзажем вместе с Сенсеем.[/log][wa:2180]"
1601906-52 = "― [log=토키 결전]Мне нравится делиться с вами своими впечатлениями.[/log][wa:2550]"
1601906-55 = "― [log=토키 결전]Этот миг существует только сейчас.[/log][wa:3530]"
1601906-57 = "― [log=토키 결전]И больше никогда не повторится.[/log][wa:910]"
1601906-60 = "― [log=토키 결전]Сенсей.[/log][wa:2390]"
1601906-62 = "― [log=토키 결전]Если бы «последний» миг настал прямо сейчас...[/log][wa:850]"
1601906-65 = "― [log=토키 결전]смогла бы я стать «последним» человеком,[/log][wa:2610]"
1601906-67 = "― [log=토키 결전]который останется рядом с вами?[/log][wa:570]"
1601906-70 = "[ns] «Значит, тебе нравится этот пейзаж.»"
1601906-71 = "Верно."
1601906-72 = "Конечно, я также осознаю парадоксальность этого."
1601906-73 = "Мы на территории врага..."
1601906-74 = "Любое действие может оказаться смертельным."
1601906-75 = "Но... у меня есть и немного эгоистичная мысль."
1601906-76 = "Какой бы абсурдной ни была ситуация, если человек способен находить в ней радость, он должен это признать."
1601906-77 = "[s] «Разве способность замечать и чувствовать красоту — не замечательная вещь?»"
1601906-78 = ""
1601906-81 = "[ns1] «Именно поэтому... мы должны продолжать смотреть и наблюдать.»\n[ns2] «Это показывает, что у будущего есть надежда.»"
1601906-84 = "...Понятно."
1601906-85 = "Что? Вам показалось, что мои мысли о неизбежном конце были «слишком драматичными»?"
1601906-86 = "..."
1601906-87 = "Если смотреть с вашей точки зрения, возможно, вы правы."
1601906-88 = "Но всё в порядке. В конце концов, я рядом с вами, Сенсей."
1601906-89 = "И самое главное — я не позволю, чтобы с вами случилось что-то настолько ужасное."
1601906-90 = "Именно поэтому я полностью вооружена этими двумя пистолетами. Видите? Они всегда готовы, как и я."
1601906-91 = ""
1601906-93 = ""
1601906-94 = "Ох... Солнце уже взошло. Рядом с вами время действительно летит незаметно."
1601906-95 = "..."
1601906-97 = "Хотела бы я поймать «время». Держать его рядом, бережно в своих руках."
1601906-98 = "Если бы это было возможно, я сохраняла бы только самые яркие моменты."
1601906-99 = "И носила бы их с собой вечно. Хранила бы там, откуда никто никогда не смог бы их у меня отнять."
1601906-100 = ""
1601906-101 = "[ns3] «Да. Если бы только это было возможно.»\n[ns4] «Но всё же сейчас мы здесь вместе, разве нет?»"
1601906-104 = "..."
1601906-105 = "Да. Именно так. По крайней мере, сейчас я с Сенсеем..."
1601906-106 = "Я и Сенсей..."
1601906-107 = "..."
1601906-108 = "Сенсей."
1601906-109 = "[s] «Хм?»"
1601906-110 = "Хотя бы в этот момент можете остаться таким, как сейчас? Пожалуйста, не двигайтесь."
1601906-111 = ""
1601906-114 = "Сказав это, Токи..."
1601906-115 = ""
1601906-120 = "...осторожно подошла и устроилась у меня в объятиях...!"
1601906-121 = "[ns] «Т-Токи?!»"
1601906-122 = "Тише. Вы можете разбудить остальных."
1601906-123 = "Всего на минутку, Сенсей. Только один момент с вами — только мой."
1601906-125 = "..."
1601906-126 = "Вместо того чтобы ловить время... да. Так лучше."
1601906-127 = "Есть..."
1601906-128 = ""
1601906-130 = ""
1601906-131 = "Спасибо, Сенсей."