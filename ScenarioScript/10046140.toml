[translation]
10046140-2 = ""
10046140-3 = "*вздох* Как такое вообще произошло?"
10046140-4 = "Мне ужасно жаль, Ичика. Я и представить не могла, что открытие пляжа создаст столько проблем."
10046140-5 = "Хаха... Всё нормально. Обычный рабочий день, знаешь ли..."
10046140-6 = "Обычный...?"
10046140-7 = "Неужели служба безопасности в Тринити и правда настолько ужасна?"
10046140-8 = "О нет! Просто я обычно работаю у границы или даже за её пределами. Там много всякого сброда."
10046140-9 = "Я поговорю с Цуруги и Хасуми о выделении дополнительных ресурсов."
10046140-10 = "Хаха... Желаю удачи."
10046140-11 = "Но что касается твоего нынешнего патрулирования..."
10046140-12 = "Обычно как хозяйка Чаепития я стараюсь воздерживаться от агрессии."
10046140-13 = "Но сейчас я не на работе и нахожусь в отпуске."
10046140-14 = "Возможно, я могла бы помочь тебе как... гражданское лицо?"
10046140-15 = "А? Ты хочешь... присоединиться?"
10046140-16 = "Это по моей неосторожности всё началось. Я должна взять на себя ХОТЬ какую-то ответственность."
10046140-17 = "Я не могу сидеть сложа руки и заставлять тебя с Оперативной группой разбираться с созданным мной бардаком."
10046140-18 = "Н-Нет! Всё хорошо! Правда!"
10046140-19 = "Я чувствую себя обязанной. Пожалуйста, позволь. Так мне будет спокойнее."
10046140-20 = "Если ты настаиваешь..."
10046140-21 = "Сделаю, как говоришь. Рада видеть тебя в команде!"
10046140-22 = "Хи-хи. И я благодарна за возможность поработать с тобой. Ну что ж, веди меня. Что делаем сначала?"
10046140-23 = ""
10046140-25 = ""
10046140-26 = ""
10046140-27 = ""
10046140-28 = "(...Это плохо.)"
10046140-29 = "(Ох, какое давление... Но я не могу отказать!)"
10046140-30 = "(Если с Нагисой что-нибудь случится...)"
10046140-31 = "(...)"
10046140-32 = "(...)"
10046140-33 = "(Не случится. Я её защищу!)"
