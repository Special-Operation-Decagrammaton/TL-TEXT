[translation]
1005002-1 = "Не Кокона. Инструктор Кокона!"
1005002-2 = "Сад Цветущей Сливы"
1005002-3 = ""
1005002-4 = ""
1005002-5 = "Кокона! Я хочу это!"
1005002-6 = "Кокона, какая сегодня закуска?"
1005002-7 = "Нельзя просто называть меня Кокона. Я Инструктор Кокона!"
1005002-8 = "Кокона, я не понима-а-аю! Сделаешь за меня?"
1005002-9 = "Эй, Кокона! Правда ли нули дзета-функции Римана определяют колебания функции подсчёта простых чисел?"
1005002-10 = "Сколько раз мне повторять? Инструктор Кокона!"
1005002-11 = "И что это вообще за вопрос?"
1005002-12 = "[s1] «Похоже, у тебя дел по горло.»\n[s2] «Быть инструктором в Саду сливовых цветов, похоже, тяжело...»"
1005002-13 = "О, Сенсей!"
1005002-14 = "О, Сенсей!"
1005002-15 = "Все, поздоровайтесь с Сенсеем!"
1005002-16 = "Здравствуйте, Сенсей!"
1005002-17 = "Ну вот, к вам они прекрасно обращаются «Сенсей»."
1005002-18 = "Так почему же меня упорно называют просто Кокона?"
1005002-19 = "Это неправильно!"
1005002-20 = "Я состоявшийся инструктор. Они должны относиться ко мне соответственно!"
1005002-21 = "Ах... Простите. Так жаловаться непрофессионально."
1005002-22 = "[s] «Не переживай. Никто не идеален.»"
1005002-23 = "Что?! Нет! Я должна быть идеальной!"
1005002-24 = "Ух... Я знаю, что не должна быть такой чувствительной."
1005002-25 = "Настоящая леди никогда не выходит из себя из-за мелочей."
1005002-26 = "А настоящая леди может быть привередливой в еде, Кокона?"
1005002-27 = "Д-да. Даже у настоящей леди есть одно-два нелюбимых блюда."
1005002-28 = "Значит, нам не обязательно есть то, что не нравится?"
1005002-29 = "Нет! Всё равно нужно питаться сбалансированно!"
1005002-30 = "Но ты ешь что хочешь! Почему нам нельзя?"
1005002-31 = "Потому что я инструктор!"
1005002-32 = "Разве это не значит, что ты должна подавать нам хороший пример, Кокона?"
1005002-33 = "Я—да, но—"
1005002-34 = "Сенсей, скажите им хоть что-нибудь, пожалуйста?!"
1005002-35 = ""
1005002-37 = ""
1005002-38 = "[ns3] «Конечно. Все, делайте, как говорит Инструктор Кокона.»\n[ns4] «Они правы. Все, Инструктор Кокона больше не будет привередничать.»"
1005002-39 = "Эй, Сенсей сказал «Инструктор Кокона»!"
1005002-40 = "Эй, Сенсей сказал «Инструктор Кокона»!"
1005002-41 = "А я думал, просто Кокона..."
1005002-42 = "Нет, Сенсей назвал её так. Значит, так правильно!"
1005002-43 = "Ну, звучит немного странно, но... наверное, тогда будем называть её Инструктор Кокона."
1005002-44 = "Я, кажется, сотню раз называла вам своё имя. Только теперь запомнили?"
1005002-45 = "Инструктор Кокона?"
1005002-46 = "Инструктор Кокона!"
1005002-47 = "[s] «Ты выглядишь счастливой, Инструктор Кокона.»"
1005002-48 = "Я-я счастлива... Но ничего особенного."
1005002-49 = "Кхм! Теперь вы все знаете."
1005002-50 = "Я инструктор Сада сливовых цветов."
1005002-51 = "Инструктор Кокона! Я хочу в туалет!"
1005002-52 = "Инструктор Кокона! Я скучаю по семье. Когда они придут?"
1005002-53 = "П-Погоди!"
1005002-54 = "Дети... Вечно слишком возбуждены, чтобы слушать..."
1005002-55 = "[s] «(Не только дети...)»"
1005002-56 = "...Что такое, Сенсей?"
1005002-57 = "Я знаю, кажется, будто на моих плечах много всего."
1005002-58 = "Но моя работа как инструктора Шаньхайцзин — направлять каждого ребёнка, чтобы он стал отличным учеником."
1005002-59 = "И мне это нравится. Поэтому по-настоящему жаловаться я не могу."
1005002-60 = "Инструктор Кокона! Я хочу перекусить!"
1005002-61 = "Только не ТВОИ закуски. Они отстой."
1005002-62 = "Ещё не время для перекуса."
1005002-63 = "И подождите. Однажды я приготовлю что-нибудь даже лучше, чем Шун."
1005002-64 = "Тогда вы все заберёте свои слова обратно!"
1005002-65 = "Ого! Кокона злится!"
1005002-66 = "Почему ты опять называешь меня Кокона?!"
