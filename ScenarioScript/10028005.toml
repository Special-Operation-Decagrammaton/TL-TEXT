10028005-64 = "Транспортный вагон с целью на позиции! Повторяю, цель на позиции! Закрепить цепи!"
10028005-65 = ""
10028005-68 = ""
10028005-69 = ""
10028005-70 = ""
10028005-72 = "Внутрь и сядь! Даже моргнуть неправильно не вздумай, поняла?"
10028005-73 = ""
10028005-75 = ""
10028005-76 = ""
10028005-77 = "Стой там! А теперь веди себя хорошо и сиди спокойно, пока не прибудем в штаб."
10028005-78 = "Цепи и кандалы закреплены! Всё чисто!"
10028005-79 = ""
10028005-81 = ""
10028005-82 = ""
10028005-83 = "Когда вернёмся, они решат, что с тобой делать. Сегодня последний день, когда ты вообще увидишь солнечный свет."
10028005-84 = "..."
10028005-85 = "Серьёзно? Ни звука? Ничего. Скоро мы это исправим."
10028005-86 = "Э-Эй, ты уверена, что мы схватили нужную? По-моему, ради мелкой девчонки сюда согнали слишком много сил..."
10028005-87 = "Не недооценивай её из-за роста! Это её террористическая группа сорвала собрание руководства семьи. Нормальный человек такого не делает."
10028005-88 = "Я тоже читала сводку! Знаю, что она сумасшедшая или типа того. Но всё равно..."
10028005-89 = "Уф, ладно. Наверное, отряд префектов Геенны не стал бы просто так объявлять её особо интересующей персоной."
10028005-90 = "Нас это не касается. Приговор вынесет сама семья."
10028005-91 = "Теперь ты в руках семьи Аранчино."
10028005-92 = "..."
10028005-93 = "Задние ворота закрыты! Занять позиции и приготовиться к отправлению!"
10028005-94 = "Есть, мэм! Всем оставаться на местах до прибытия в штаб! Выдвигаемся!"
