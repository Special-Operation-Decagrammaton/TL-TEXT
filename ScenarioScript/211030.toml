[translation]
211030-1 = "Episode 3;Make Gehenna Great Again!"
211030-6 = "Ugh!"
211030-7 = "Who fired that AT4 recoilless rifle!?"
211030-11 = "My bad!#nI was practicing rocket jumping and it just went off!"
211030-12 = "Why would you practice that on school grounds!?"
211030-13 = "If not here, then where?"
211030-14 = "Somewhere without people!#nLook at this! There's a huge hole in the parking lot, and the streetlights are knocked over!"
211030-15 = "Oh! You're right!"
211030-16 = "This is why people say, 'Gehenna is always messy and chaotic'!"
211030-20 = "Eh, you're just realizing this now? Gehenna has always been like this, right?"
211030-21 = "Wha...!"
211030-22 = "Well, I'm gonna bolt before the Prefect Team gets here! See ya!"
211030-30 = "Oh boy, look at this mess the moment I take my eyes off things."
211030-31 = "Are you alright, Chairwoman Mayumi?"
211030-32 = "I'm managing.#nI was just doing traffic control, but some student fired a recoilless rifle and ran off... *sigh*."
211030-33 = "It's fortunate that it was only one shot."
211030-34 = "Don't sweat it, don't sweat it."
211030-35 = "Well, it's our first time, so this is to be expected.#nTraffic control, school volunteering... we just have to keep at it."
211030-36 = "Yeah..."
211030-37 = "...It's fine that we failed. Things like this happen when you're trying."
211030-38 = "But, I just can't forgive that one phrase."
211030-42 = "The phrase I hate the most."
211030-43 = "That 'Gehenna has always been like this' stuff!!"
211030-44 = "What do you mean 'always'?#nThat just means you have no intention of changing anything!"
211030-45 = "Besides, Gehenna wasn't like this from the start, was it?#nWhen did it even become like this!"
211030-46 = "That's true. Gehenna wasn't originally like this."
211030-50 = "Who...?"
211030-56 = "You guys are the Gehenna Restoration Committee, right?"
211030-57 = "We are, but..."
211030-58 = "And you are, Senpai?"
211030-59 = "Just a passing member of the Pandemonium Society."
211030-60 = "I was just curious, so I thought I'd say one thing. I'm not looking to join the conversation, so..."
211030-61 = "Wait!"
211030-62 = "Do you know about the old days, Senpai?"
211030-63 = "Back when order was maintained and the whole academy followed the rules."
211030-64 = "I do. I know it well."
211030-65 = "Gehenna was cool back then, right?"
211030-66 = "Not like the chaos it is now..."
211030-67 = "..."
211030-68 = "I see. You guys don't know about the past."
211030-69 = "Nobody will tell us anything properly!"
211030-73 = "...There's a reason why everyone keeps their mouths shut."
211030-77 = "What do you mean?"
211030-78 = "It means it's not something you can just praise unconditionally."
211030-79 = "Even though you guys seem to admire it..."
211030-83 = "I... don't want to go back to those days."
211030-84 = "Why!?"
211030-89 = "So, Senpai, you think it's better now?"
211030-90 = "Yeah."
211030-91 = "..."
211030-92 = "I don't intend to go into details, and it's not something I can talk about anyway."
211030-93 = "I know you're trying to do something for Gehenna.#nI'm sure there's meaning in that."
211030-94 = "I'm just saying, it's better not to hold onto fantasies."
211030-98 = "Well, I'm rooting for you. It's not bad to see people working hard."
211030-103 = "..."
211030-104 = "..."
211030-105 = "That Senpai doesn't know anything! That's definitely it!"
211030-106 = "The old Gehenna must have had proper order and been a cool academy!#nRight?"
211030-107 = "...Yes. Of course."
211030-108 = "Alright! This is no time to be feeling down!#nWhat we're doing has meaning!!"
211030-109 = "Heh, that's our Chairwoman for you!"
211030-110 = "We'll make that Senpai realize it too."
211030-111 = "We'll work hard and restore Gehenna's greatness!"
211030-112 = "You bet!"
211030-113 = "To do that, we need something—"
211030-117 = "There's a limit to just running around doing things the hard way like we are now."
211030-121 = "What do you think we're missing?"
211030-125 = "As it happens, I've already drafted a few plans."
211030-126 = "That's our brain for you! Shouko-chan!"
211030-127 = "I want to hear them, I want to hear them!"
211030-128 = "But before that."
211030-132 = "No matter how noble your argument is, it's meaningless if no one listens."
211030-133 = "Well... that's true."
211030-134 = "What we need to get our point across."
211030-138 = "That would be 'Authority'."
211030-139 = "Au-!"
211030-140 = "thority!"
211030-144 = "Exactly."
211030-145 = "And—I happen to have a perfect symbol for that."
211030-147 = "Next Episode;Make Gehenna Great...!"