[translation]
211030-1 = "Эпизод 3;Слава Геенне!"
211030-5 = ""
211030-6 = "Ух, я ведь всего лишь пытаюсь регулировать движение...!"
211030-7 = "Кто тут палит из безоткатного гранатомёта AT4?! Да ещё и ЗДЕСЬ?!"
211030-10 = ""
211030-11 = "Ой, виновата! Я тренировалась прыгать с помощью ракетных выстрелов, и один снаряд... кажется, немного сбился с курса."
211030-12 = "Да зачем ты это делаешь на территории академии?!"
211030-13 = "В смысле? А где мне ещё тренироваться?"
211030-14 = "Где-нибудь подальше от людей! Смотри, ты оставила воронку на парковке! А фонарь теперь на одном проводе висит!"
211030-15 = "Вахаха! И правда, сестрёнка!"
211030-16 = "Вот поэтому все и твердят, что в Геенне царят хаос и беспорядок!"
211030-17 = ""
211030-19 = ""
211030-20 = "И что с того? Такая уж Геенна. Подумаешь."
211030-21 = "Ц...!"
211030-22 = "Не скучай! Мне пора сваливать, пока команда Префектов не нагрянула!"
211030-23 = ""
211030-25 = ""
211030-26 = ""
211030-29 = ""
211030-30 = "Ух, ну и разгром. Что тут произошло?"
211030-31 = "С тобой всё хорошо, председатель?"
211030-32 = "Кто-то выстрелил из безоткатного гранатомёта и сбежал. *вздыхает*"
211030-33 = "По крайней мере, похоже, она успела выстрелить лишь раз."
211030-34 = "Ага! Не унывай, председатель! Яха!"
211030-35 = "Мы запустили программу регулирования движения и волонтёрские работы на территории академии. Это уже прогресс! Но мы ведь только начинаем, так что без накладок не обойтись."
211030-36 = "Пожалуй..."
211030-37 = "...Ничего страшного, если мы иногда оступаемся. Ведь мы только начали наводить порядок."
211030-38 = "Меня больше задело то, что она сказала напоследок."
211030-39 = ""
211030-41 = ""
211030-42 = "Знаете, какую фразу я ненавижу больше всего?"
211030-43 = "«Такая уж Геенна»!"
211030-44 = "И всё?! «Такая уж»?! Это самодовольство! Капитуляция! Признание, что ты ничего не собираешься менять!"
211030-45 = "Геенна не всегда была такой. Когда-то она была ВЕЛИКОЙ. Как же мы так низко пали?"
211030-46 = "Ты права. Геенна не всегда была такой."
211030-47 = ""
211030-49 = ""
211030-50 = "Что...?"
211030-51 = ""
211030-53 = ""
211030-55 = ""
211030-56 = "Вы из того клуба, верно? «Комитет по восстановлению Геенны»?"
211030-57 = "Эм... Да."
211030-58 = "А ты ещё кто?"
211030-59 = "Я? Просто член Общества Пандемониум. Ничего особенного."
211030-60 = "Случайно услышала вашу пылкую речь. Не хотела мешать, так что, с вашего позволения..."
211030-61 = "П-подождите!"
211030-62 = "Вы сказали, что Геенна не всегда была такой. Значит, вы знаете, какой она была «раньше»?"
211030-63 = "Ну, когда в Геенне царила дисциплина, было единство и..."
211030-64 = "Конечно, знаю. Я тогда уже училась здесь."
211030-65 = "И-и как там было? Раньше Геенна точно была гораздо круче, чем сейчас, правда?"
211030-66 = "И никто не палил куда попало и не взрывал академию просто так?"
211030-67 = "..."
211030-68 = "Подумать только... Вы, пожалуй, почти ничего не знаете о старой Геенне."
211030-69 = "Не особо! Об этом никто не рассказывает! Какой она была?"
211030-70 = ""
211030-72 = ""
211030-73 = "Хм... Думаю, я понимаю, почему мои ровесники предпочитают молчать."
211030-74 = ""
211030-76 = ""
211030-77 = "Почему? Что вы имеете в виду?"
211030-78 = "...Тогда всё было не так уж «великолепно»."
211030-79 = "Похоже, вы идеализируете прошлое просто потому, что мало о нём знаете..."
211030-80 = ""
211030-82 = ""
211030-83 = "И, откровенно говоря, мне не хочется возвращаться к тем временам."
211030-84 = "Почему?!"
211030-85 = ""
211030-87 = ""
211030-88 = ""
211030-89 = "То есть тебе на самом деле больше нравится нынешняя Геенна?"
211030-90 = "Могу говорить только за себя... Но да."
211030-91 = "..."
211030-92 = "Не хочу вдаваться в подробности, да и не могу."
211030-93 = "Я знаю, как сильно вы любите Геенну. Уже само по себе это многое значит."
211030-94 = "Но мне бы хотелось, чтобы вы не идеализировали прошлое."
211030-95 = ""
211030-97 = ""
211030-98 = "Я буду болеть за вас троих. Приятно видеть, что у нас есть инициативные студенты, которым не всё равно."
211030-99 = ""
211030-101 = ""
211030-102 = ""
211030-103 = "..."
211030-104 = "..."
211030-105 = "Вы это видели? Да она вообще ничего не понимает!"
211030-106 = "Конечно, раньше в Геенне всё было куда лучше! Была дисциплина, единство и... круто же было! Правда, Шоуко?"
211030-107 = "...Да. Всё верно."
211030-108 = "Вот именно! Так что не будем унывать! Мы на правильном пути, нужно только продолжать!"
211030-109 = "Вот это настрой, председатель! Яха!"
211030-110 = "Хмф! Она ещё увидит. Однажды сама нас поблагодарит."
211030-111 = "Ведь мы докопаемся до сути, приложим все силы... и вернём Геенне былую славу!"
211030-112 = "Вместе мы справимся!"
211030-113 = "...Значит, нам нужно... Эм..."
211030-114 = ""
211030-116 = ""
211030-117 = "Знаете, одними нашими силами многого не добиться. Мы всего лишь трое младшекурсников..."
211030-118 = ""
211030-120 = ""
211030-121 = "Чего же нам не хватает? Нужно что-то особенное. Что-то, что заставит остальных нас слушать!"
211030-122 = ""
211030-124 = ""
211030-125 = "У меня есть... кое-какие наброски плана."
211030-126 = "Ещё бы! Наш стратег снова в деле!"
211030-127 = "Да? И с чего начнём? Что будем делать?"
211030-128 = "Но сначала..."
211030-129 = ""
211030-131 = ""
211030-132 = "Какими бы убедительными ни были наши доводы, всё напрасно, если люди нас... не слушают."
211030-133 = "Верно, тут не поспоришь..."
211030-134 = "Поэтому, чтобы наш голос прозвучал громче..."
211030-135 = ""
211030-137 = ""
211030-138 = "Нам понадобится авторитетная поддержка."
211030-139 = "Авторитетная!"
211030-140 = "Поддержка!"
211030-141 = ""
211030-143 = ""
211030-144 = "Фу-фу... Именно."
211030-145 = "И я ТОЧНО знаю, кто нам подойдёт..."
211030-147 = "Следующий эпизод;Слава Геенне...!"
