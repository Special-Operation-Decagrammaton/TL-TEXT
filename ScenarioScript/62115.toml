[translation]
62115-3 = ""
62115-4 = "Ух...!"
62115-5 = "Сенсей?!"
62115-6 = "[s] «Пока отступим!»"
62115-7 = ""
62115-10 = ""
62115-11 = "Все в порядке?!"
62115-12 = ""
62115-14 = ""
62115-15 = ""
62115-16 = "Д-Да...!"
62115-17 = "Похоже, остальные студенты Ариуса тоже воспользовались возможностью спрятаться."
62115-19 = "...Но ангелы всё ещё бродят вокруг Porta Pacis. Будто... ищут следующую цель."
62115-20 = "Ч-Что нам делать...? Мы ведь даже не знаем, что это такое..."
62115-22 = "Никто не знал, что сказать или сделать."
62115-23 = "Выстрелы и противостояние постепенно стихли, и вокруг воцарилась зловещая тишина."
62115-24 = "Напряжение наконец разорвал сигнал MomoTalk."
62115-27 = "[ns] «Хм? Разве этот эмодзи не...»"
62115-28 = ""
62115-29 = "Машущий белый флаг? Это...?"
62115-30 = "Это ведь означает капитуляцию? Только перед кем они здесь вообще сдаются?"
62115-31 = "[s] «Нет, погоди! Я понял! Пойдём встретимся с ними!»"
62115-33 = "Осторожно мы отправились к месту, указанному в MomoTalk."
62115-35 = ""
62115-36 = ""
62115-37 = "Ну вот, мы здесь..."
62115-38 = "Э-Эй...? Здесь кто-нибудь есть...?"
62115-39 = ""
62115-41 = ""
62115-42 = ""
62115-43 = "Сенсей! И Отряд!"
62115-44 = "И ты..."
62115-45 = "П-Привет... Снова встретились... Хотя, пожалуй, обстоятельства не лучшие."
62115-46 = "...Значит, ты всё-таки пошла к Сенсею."
62115-47 = "Д-Да."
62115-48 = "Какое облегчение. Спасибо, что присмотрели за ней, Сенсей. Мы все волновались."
62115-49 = "[s1] «Я лишь сделал то, что сделал бы любой.»\n[s2] «Но сначала... почему ты связалась со мной?»"
62115-52 = "А, да. Это..."
62115-53 = "Мы... знаем обходной путь."
62115-55 = "Обходной путь?"
62115-57 = "Да. Мы проверили — ангелы не реагировали, когда мы шли по нему."
62115-58 = "...Я так боялась, что они заметят, но всё действительно получилось!"
62115-59 = "Но если не будете осторожны, они всё равно вас увидят!"
62115-61 = "...Понятно. Спасибо. Наверняка это было опасно..."
62115-63 = "Хи-хи. Не стоит благодарности. Сенсей... просто показался хорошим взрослым."
62115-64 = "Вы очень нам помогли, поэтому мы хотели отплатить тем же."
62115-65 = "...Смешно говорить это сейчас, но мне на самом деле понравилось учиться..."
62115-66 = "Хотя занятия были скучными, всё равно было весело. Трудно объяснить, да?"
62115-67 = "[s3] «...Я рада, что ты честно признался, что было скучно...»\n[s4] «В следующий раз я постараюсь лучше...»"
62115-70 = "Было весело увидеть Саори в роли учителя!"
62115-72 = "..."
62115-74 = "Занятие Ацуко было... Эм..."
62115-75 = "Не знаю почему, но мне было правда интересно. Не весело, а как-то иначе."
62115-77 = "Фуфу. Спасибо. Может, потому что материал был новым?"
62115-79 = "...Мне казалось, что анализ я могу заучить и решать, а вот тригонометрию понять не получалось..."
62115-81 = "...Значит, ты недостаточно училась."
62115-82 = "..."
62115-84 = "...Я хочу ещё раз попасть на занятие Хиёри. ВОТ там было весело."
62115-86 = "С-Спасибо...!"
62115-87 = ""
62115-89 = ""
62115-90 = ""
62115-91 = "Если честно, я всё ещё не понимаю всей этой штуки с «экзаменами»... Но это потому, что для нас всё это в новинку. Абсолютно всё."
62115-92 = "И ещё..."
62115-93 = "Ну, было приятно, что кто-то относился к нам по-доброму и учил чему-то, кроме того, как причинять людям боль."
62115-94 = "Да. Всё это..."
62115-95 = "Казалось чем-то, что случается раз в жизни, но всё равно."
62115-96 = "[s] «Нет. Это не „раз в жизни“»."
62115-97 = "Не... раз в жизни?"
62115-98 = "[s] «Так должна выглядеть ваша повседневная жизнь»."
62115-99 = "Наша... повседневная жизнь?"
62115-100 = "..."
62115-101 = "Прости. Я даже представить себе такое не могу..."
62115-102 = "В-В общем... Хватит о нас."
62115-103 = "Вы ведь хотите поговорить с Субару? Идите сюда. Мы покажем обходной путь."
62115-104 = ""
62115-106 = ""
62115-107 = ""
62115-109 = "Вот здесь. Если спуститесь по этим лестницам... попадёте к задней двери, ведущей в подземный архив."
62115-110 = "Никто не знает, что она сейчас там делает. Она приказала никого не впускать."
62115-111 = "Не знаю, о чём вы хотите с ней поговорить, но очень надеюсь, что всё получится."
62115-112 = "Без Субару... все, кто остался в Ариусе, исчезли бы... один за другим..."
62115-113 = "[s5] «Я сделаю всё, что смогу.»\n[s6] «Я не спущу студенту прогул занятий!»"
62115-116 = "Да, Сенсей!"
62115-119 = ""
62115-120 = "Этим лестницам конца не видно."
62115-121 = ""
62115-123 = ""
62115-124 = ""
62115-125 = "Ух... Такое чувство, будто дорога ведёт прямо в бездну, как в Писании..."
62115-126 = ""
62115-128 = ""
62115-129 = ""
62115-130 = "Жаль, что нельзя включить свет... Нельзя ведь, да...?"
62115-131 = ""
62115-133 = ""
62115-134 = ""
62115-135 = "Угу. Нельзя выдавать своё местоположение."
