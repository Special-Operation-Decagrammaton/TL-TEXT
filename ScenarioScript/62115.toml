62115-146 = "Ацуко?!"
62115-147 = "Спасибо, что поймали меня, Сенсей. Но остальные в порядке?"
62115-148 = ""
62115-150 = ""
62115-151 = ""
62115-152 = "Что-то случилось? Там был камень или ловушка?"
62115-153 = "Я почти ничего не вижу, но и не чувствую ничего странного."
62115-154 = "У меня тоже ничего."
62115-156 = "...Понятно. Значит, это только я."
62115-157 = "(Похоже, чувствую это только я.)"
62115-158 = "(...Давление невероятное. Будто кто-то вонзается мне в голову и трясёт мозг изнутри.)"
62115-159 = "(Надо... сосредоточиться... иначе потеряю сознание...!)"
62115-160 = "А...?"
62115-161 = "Что такое? Ты тоже что-то чувствуешь?"
62115-162 = "Я-Я сама не понимаю. Почему мне так..."
62115-163 = "...так страшно... и грустно... Больно..."
62115-164 = "Это не моё... будто я чувствую это откуда-то ещё..."
62115-165 = ""
62115-172 = "Наконец-то вы здесь, Сенсей."
