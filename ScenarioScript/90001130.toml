[translation]
90001130-1 = "Эпизод 13;Отправление"
90001130-9 = ""
90001130-10 = "О, наконец-то прибыло!"
90001130-12 = "Д-Да! Последние ресурсы прибыли... с узловых точек!"
90001130-13 = "Ну-ну-ну. Если быть точной и честной, это не совсем правда. Общий показатель сбора — 99,98%... Твоё утверждение ложно, пока мы не получим ещё примерно две поставки."
90001130-14 = ""
90001130-16 = ""
90001130-17 = "Э-Это правда, но... *хнык*"
90001130-19 = "В-Всё нормально, Эйн! Учитывая, как это называется, э-э, погрешность, мы уже полностью готовы перейти к следующим этапам!"
90001130-20 = "Ор! Почему ты всегда портишь настроение?"
90001130-21 = ""
90001130-23 = ""
90001130-24 = "Но... разве ты не была со мной согласна, Соф?"
90001130-25 = "...И с чем именно я соглашалась? Случаи, когда я была согласна с ТВОЕЙ чушью, можно пересчитать по пальцам одной руки."
90001130-26 = ""
90001130-28 = ""
90001130-29 = ""
90001130-31 = "С абсолютно фактическим утверждением, что Эйн милее всего, когда плачет!"
90001130-33 = "Ч-ЧТООО?!"
90001130-35 = "Хм. Ну, это правда, но..."
90001130-37 = "Даже ты, Соф?!"
90001130-38 = ""
90001130-41 = ""
90001130-42 = "А-а, Эйн! Я-я хочу сказать... Я не это имела в виду—"
90001130-43 = "Посмотри, что ты наделала, Ор!"
90001130-44 = "На каком основании ты обвиняешь меня?!"
90001130-45 = ""
90001130-47 = ""
90001130-48 = ""
90001130-53 = ""
90001130-54 = "Эм... Все..."
90001130-61 = ""
90001130-62 = "П-Передача ресурсов завершена! Теперь очередь наших Рабочих!"
90001130-63 = ""
90001130-65 = ""
90001130-66 = "Хорошая работа, Эйн. Всё функционирует как задумано, да?"
90001130-67 = "Но всё же... я-я волнуюсь. Раны Спирального №5 ещё не полностью зажили..."
90001130-68 = ""
90001130-71 = ""
90001130-72 = "Спиральный №5? А, тот, у которого краска облупилась? Ты уже дала ему имя?"
90001130-73 = "Д-Да! С повреждённой краской он сильнее подвержен ржавчине!"
90001130-74 = "Поэтому, пока я его лечила, я усилила его огромной механической рукой, и теперь он б-больше. Значит, ему нужно больше мощности!"
90001130-75 = "А значит, привод тоже должен быть больше, так что я воспользовалась случаем и сделала корпус крупнее из более прочных материалов, чтобы—"
90001130-76 = "Успокойся, Эйн. Глубоко вдохни. Я знаю этот... Спиральный №3, ты сказала? Я понимаю, что это устройство очень, очень важно для тебя."
90001130-77 = "Э-Это №5! И Спиральный №5 н-не устройство! Этот ребёнок, эм..."
90001130-78 = "Он особенный!"
90001130-79 = "Что в нём такого особенного? Это всего лишь один из десятков тысяч Рабочих."
90001130-80 = ""
90001130-83 = ""
90001130-84 = "Ах, какая холодная жестокость! Соф — хладнокровный, безжалостный надзиратель, для которого всё лишь средство достижения цели!"
90001130-85 = "Неужели ты правда не понимаешь, что твоими холодными бездушными словами ранишь нежное сердце Эйн?"
90001130-86 = "...Не хочу слышать это от тебя!"
90001130-87 = "В любом случае, Эйн. Этого хватит, чтобы вылечить раны Спирального №5?"
90001130-88 = ""
90001130-91 = ""
90001130-93 = "Любые физические улучшения должны сопровождаться соответствующей оптимизацией и поддержкой программного обеспечения."
90001130-94 = "Ты подарила Спиральному №5 силу, но его суставы и детали могут постепенно изнашиваться. Его срок службы даже может... сократиться вдвое!"
90001130-96 = "Ч-Что?! Я-я этого не хочу...!!"
90001130-97 = "Да-да, я помогу. Доверься мне."
90001130-98 = "Для начала я оптимизирую его процессы. Он сможет работать вдвое быстрее и заканчивать работу за половину времени."
90001130-99 = ""
90001130-101 = ""
90001130-102 = "А пока он простаивает... Да! Сделаем так, чтобы Спиральный №5 хватал себя за ноги и вечно крутился на одном месте, бесконечно! А затем—"
90001130-104 = "Э-Это слишком жестоко! Ува-а...!!"
90001130-105 = ""
90001130-109 = ""
90001130-113 = ""
90001130-115 = ""
90001130-116 = ""
90001130-117 = "Без насилия... Уф...!"
90001130-119 = "Н-Но... раз показатель сбора уже 99,98%..."
90001130-120 = "...Да. Ты права. Наконец-то пришло время."
90001130-121 = ""
90001130-123 = ""
90001130-124 = "Да-да. Ради нашей Старшей Сестры."
90001130-125 = ""
90001130-127 = ""
90001130-128 = "Чтобы Малкут наконец сошла в этот мир."
90001130-130 = "М-М-М-М-М-Мы справимся? Я ведь ничего не испортила, правда?"
90001130-131 = "Е-Если я где-то ошиблась и Старшая Сестра из-за этого не проснётся...!"
90001130-132 = "Хватит ерунды, Эйн. Мы тебе доверяем. Ты всё это время отлично справлялась, разве нет?"
90001130-133 = "Когда дело касается механического оборудования, никто из нас и близко с тобой не сравнится."
90001130-134 = "Н-Н-Н-Н-Но..."
90001130-135 = ""
90001130-137 = ""
90001130-139 = "Я понимаю твои опасения, Эйн. В конце концов, в какой-то момент... приходится учитывать квантово-механические эффекты."
90001130-140 = "Фраза «я сделала всё возможное» рано или поздно становится слабым оправданием. Фу-фу..."
90001130-141 = "*всхлипывает*"
90001130-142 = "Но всё просто так, как есть. В любом деле наступает момент, когда остаётся лишь принять результат."
90001130-143 = "Хотя я не обязательно одобряю то, что мы заимствуем Запретную Силу ради сошествия нашей Старшей Сестры..."
90001130-144 = "...важен результат! Результат! И посмотри, как мы скрыли это место от любопытных чужаков!"
90001130-145 = "Да. Многомерный интерпретационно-вероятностный суперпозиционный фазовый барьер... Долго и раздражает, так что будем просто называть его Многомерным барьером."
90001130-146 = "Использовать само пространство, где все возможности в бесконечных измерениях включены как вероятности, в качестве защитного механизма..."
90001130-149 = "В тот день мы получили превосходный образец. Благодаря ему смогли провести обратный анализ и реконструировать его в нынешнем виде."
90001130-150 = "Хи-хи. Хи-хи. Э-хе-хе-хе. Настал ли наконец момент, когда ты признаешь, что именно мой бесценный вклад привёл к такому результату?"
90001130-151 = "...Да. Мне отвратительно это признавать, но это правда."
90001130-152 = "П-Простите... В этой части теории я всё ещё не до конца разбираюсь... *всхлип*"
90001130-153 = ""
90001130-155 = "Всё нормально, всё нормально, Эйн! В конце концов, у каждой из нас есть свои сильные стороны, правда?"
90001130-156 = "Соф. Почему твоя доброта достаётся только Эйн и никому больше?"
90001130-157 = "Загляни о-очень глубоко внутрь себя — там и найдёшь ответ."
90001130-158 = "В любом случае, да. Это место защищено Многомерным барьером. Любопытным чужакам почти невозможно сюда пробраться."
90001130-159 = ""
90001130-161 = ""
90001130-163 = "Можно даже сказать, что мы держим силу Безымянных богов прямо в своих руках!"
90001130-165 = "М-Можно ли правда так... думать? А если потом кто-нибудь рассердится на нас за её использование...?"
90001130-166 = "Но разве не мы используем эту силу наилучшим возможным образом?"
90001130-167 = ""
90001130-170 = ""
90001130-171 = "Зачем ты упорно всё усложняешь? Мы — совершенные существа!"
90001130-172 = "Мы просто используем то, что хотим, и выбрасываем остальное. Зачем переживать о забытом наследии утраченных времён?"
90001130-173 = "Да-да. Мы слышали о существовании жрецов Богов и прочем..."
90001130-174 = "Они должны кланяться нам с благодарностью за то, что мы используем их силу! Эти неудачники, преклонившие колени перед временем!"
90001130-176 = "Хорошо сказано, Ор. Вот это настрой."
90001130-177 = "Т-Точно можно так делать...?"
90001130-190 = ""
90001130-192 = ""
90001130-193 = "...Наконец-то я дошла до конца..."
90001130-194 = ""
90001130-196 = ""
90001130-197 = ""
90001130-198 = ""
90001130-201 = ""
90001130-202 = "Н-Ну как? Как?!"
90001130-203 = ""
90001130-206 = ""
90001130-207 = "Да! Я знаю! Это..."
90001130-208 = "Это...?"
90001130-209 = ""
90001130-211 = ""
90001130-213 = "...мусорная игра!"
90001130-215 = "Ух...!"
90001130-216 = "Кхек?!"
90001130-217 = "Для начала, сестрёнка... почему я УМИРАЮ от переохлаждения в ту же секунду, как ступаю на лёд?!"
90001130-218 = "Эм, потому что игра происходит в полярном регионе. В полярных регионах так и бывает, разве нет?"
90001130-219 = "Это слишком экстремально! Нужно хотя бы дать людям возможность поиграть!"
90001130-220 = "Е-Если не пропускать обучение, там дают зимнее снаряжение!"
90001130-221 = "То самое обучение, которое длится тридцать минут?! А снаряжение ещё надо найти в каком-то неочевидном спрятанном углу карты!"
90001130-222 = "И вообще, даже в реальной жизни человек не умирает в ту же секунду, как коснётся льда!"
90001130-223 = "Ты никогда не была в Арктике! Откуда тебе знать, а?!"
90001130-224 = ""
90001130-226 = ""
90001130-227 = "*вздох* Ладно, неважно. Забудем про реализм. Куда делись все ресурсы зимнего снаряжения, которые я для тебя рисовала?"
90001130-228 = ""
90001130-230 = ""
90001130-231 = "О-Они выйдут в будущих DLC..."
90001130-232 = ""
90001130-234 = ""
90001130-236 = "Тогда не проси меня рисовать их с самого начала!"
90001130-237 = ""
90001130-243 = ""
90001130-244 = "Н-Не ссорьтесь..."
90001130-245 = "Но мне было очень весело! Было весело и делать игру, и вместе играть, и исправлять её!"
90001130-246 = ""
90001130-249 = ""
90001130-250 = ""
90001130-251 = "Ува-а! Алиса!"
90001130-252 = "*вздох* Может, всё всегда заканчивается так потому, что Алиса слишком балует сестрёнку."
90001130-254 = "Но... думаю, есть фундаментальная проблема. Что... мы могли упустить?"
90001130-256 = "Мм...! Как сценарист, дизайнер и ведущий продюсер, я должна серьёзно над этим подумать."
90001130-257 = "Титул ведущего продюсера ты сама себе придумала..."
90001130-258 = ""
90001130-260 = ""
90001130-261 = "Поняла! На основании своего опыта могу заключить, что нашей игре «Полярное приключение» просто не хватает реальных источников!"
90001130-262 = "Точнее, нам нужно больше реалистичной информации о полярном регионе!"
90001130-263 = "Ты вообще о чём, сестрёнка?! И что, по-твоему, сейчас произойдёт? Мы просто соберём вещи и поедем в Ледниковое море?!"
90001130-264 = ""
90001130-267 = ""
90001130-268 = "Поездка...? Ещё дальше наружу, чем просто наружу...? Э-Это...!"
90001130-269 = ""
90001130-271 = ""
90001130-273 = ""
90001130-274 = "Ю-Юзу? Юзу, ты в порядке?!"
90001130-276 = "Но подумай... Бесконечные снежные поля, голубые ледники, белые медведи и пингвины, играющие вместе..."
90001130-277 = "Разве такая потрясающая сцена не наполнила бы нас вдохновением и энергией?"
90001130-278 = "Это чистое самоудовлетворение... К тому же белые медведи и пингвины не живут в одном регионе. А если бы встретились, пингвинов бы съели."
90001130-279 = "П-Пожалуйста, не тащи сюда реалии дикой природы..."
90001130-280 = ""
90001130-285 = ""
90001130-287 = ""
90001130-288 = "Кто-то звонит Алисе?"
90001130-289 = ""
90001130-292 = ""
90001130-293 = "Разве этот номер не...?"
90001130-294 = ""
90001130-296 = ""
90001130-298 = "Сенсея...?"
90001130-299 = "Подождите. Это Сенсей?"
90001130-301 = "Разговаривать с Сенсеем... приятно... Хи-хи."
90001130-302 = ""
90001130-304 = ""
90001130-305 = "Здравствуйте, Сенсей!"
90001130-306 = "[s] «Привет, Алиса!»"
90001130-307 = "Да! Это Алиса Сенсея! Кажется, прошло очень много времени!"
90001130-308 = "А? Это не просто кажется? Если подумать, прошло действительно слишком много времени!"
90001130-309 = "Момои, Мидори, Юзу и я все хотим чаще видеть Сенсея! Так что, пожалуйста, звоните нам чаще!"
90001130-310 = "[s] «Прости, прости.»"
90001130-312 = "[ns] «Кстати, все там?»"
90001130-313 = "Да! Мы в клубной комнате тестируем новую игру, которую сделали. Мы хотим поиграть в неё вместе с вами, Сенсей!"
90001130-314 = ""
90001130-316 = ""
90001130-317 = "...Она настолько хорошая? То есть..."
90001130-318 = ""
90001130-320 = ""
90001130-322 = ""
90001130-323 = ""
90001130-324 = ""
90001130-326 = ""
90001130-327 = "Я не уверена! Но процесс создания был очень весёлым!"
90001130-328 = "Всё в порядке, Сенсей? Тон вашего голоса немного отличается от того, к которому я привыкла."
90001130-329 = "[s] «Да... Ты права. Ты сказала, что все там, верно?»"
90001130-330 = "Да, все здесь!"
90001130-331 = ""
90001130-335 = "Я всё никак не мог решить, сколько стоит рассказать Алисе и Отделу разработки игр."
90001130-336 = "Но в конце концов решил, что честность будет лучшим вариантом."
90001130-337 = ""
90001130-338 = "[ns] «Я хочу, чтобы вы все внимательно выслушали то, что сейчас скажу.»"
90001130-339 = ""
90001130-341 = ""
90001130-347 = ""
90001130-349 = "Ледни...?"
90001130-350 = "...ковая!"
90001130-351 = "Экспеди...?"
90001130-352 = "...ция!!!"
90001130-353 = "Ура! Ура! Я поняла, Сенсей! Разве это не прекрасно, Момои? Ледниковое путешествие всей компанией!"
90001130-355 = "Ещё бы! Идеальный момент! Сенсей лучший!"
90001130-356 = "[s1] «Эй, все...? Я несколько раз это подчёркивал...»\n[s2] «...но вы понимаете, что это будет очень опасно, верно?»"
90001130-359 = "П-Правильно, сестрёнка! И ты тоже, Алиса! Давайте я подведу итог тому, что сказал Сенсей!"
90001130-360 = "Мы имеем дело с загадочной ИИ-штукой с загадочными целями! И вдобавок она создала огромного робота-монстра, чтобы помочь достичь этих целей!"
90001130-361 = "Так что им может понадобиться помощь Алисы в битве с ним!"
90001130-362 = "Уф... Нам и в видеоиграх таких боссов хватает..."
90001130-363 = "[s3] «Д-Да! Именно то, что сказали Мидори и Юзу!»\n[s4] «Поэтому вам стоит отнестись к этому серьёзнее...»"
90001130-366 = "Но Сенсей, я ваш союзник. А вы — мой союзник."
90001130-367 = "[s] «Мне очень приятно это слышать...»"
90001130-369 = "[ns] «Но повторю ещё раз. В каком-то смысле это—»"
90001130-370 = "А? Теперь я поняла. Это очень серьёзная ситуация."
90001130-371 = "Она может быть настолько опасной, что вы не сможете гарантировать мою безопасность."
90001130-372 = "Алис..."
90001130-373 = ""
90001130-375 = ""
90001130-377 = "..."
90001130-378 = "Понятно. Сенсей, как мне добраться до Ледникового моря?"
90001130-379 = "[s] «Что?!»"
90001130-380 = ""
90001130-383 = ""
90001130-384 = "А-Алиса?!"
90001130-385 = "Алиса?!"
90001130-386 = ""
90001130-389 = ""
90001130-390 = "Почему вы удивлены? Нельзя убегать, когда союзник в беде. Это базовый принцип игры в группе."
90001130-391 = "И я благодарна, что именно обо мне вы подумали в такой ситуации."
90001130-392 = "Это значит, что вы доверяете мне, Сенсей. А доверие между нами — доказательство того, что мы союзники."
90001130-393 = "[s] «...Ты точно уверена?»"
90001130-394 = "Сенсей, пусть я всего лишь студент, но я всё равно герой. По крайней мере, я стараюсь быть им каждый день."
90001130-395 = "Поэтому я... Я хочу помочь сделать этот мир хоть немного лучше. И я действительно так думаю."
90001130-396 = "Вот почему я не могу сбежать и спрятаться, когда человек, который так много для меня сделал, протягивает мне руку."
90001130-397 = "Именно так я и сделаю мир лучше — пусть даже совсем чуть-чуть."
90001130-398 = "[s] «Но что ты будешь делать, если станет совсем-совсем опасно?»"
90001130-399 = "Понятно... Если всё и правда станет настолько опасно, тогда, несмотря ни на что..."
90001130-403 = ""
90001130-405 = "...я снова стану обычным студентом и спрячусь где-нибудь в безопасном месте!"
90001130-407 = "О! Точно! В играх ведь не бывает слишком дешёвых приёмов!"
90001130-408 = "Да! Ну, если это не взлом и не читерство."
90001130-409 = "Д-Думаю, хотя бы это мы можем сделать... Как считаете, Сенсей?"
90001130-410 = "[s] «Можешь пообещать на мизинцах, что прибегнешь к дешёвым приёмам, если придётся?»"
90001130-412 = "Конечно, Сенсей! Герой никогда не нарушает обещаний!"
