[translation]
1006805-1 = "Скажи спасибо, Рейса"
1006805-2 = "Я отправился в переулок Тринити, где Рейса хотела встретиться."
1006805-4 = "Переулок Тринити"
1006805-5 = ""
1006805-13 = "Сенсей!"
1006805-14 = "[ns1] (Знакомый голос.)\n[ns2] Посмотреть в сторону крика."
1006805-21 = "Сенсей!"
1006805-22 = ""
1006805-26 = ""
1006805-27 = "Ай! Простите! Я не успела остановиться. Простите!"
1006805-28 = "[s3] «Ты сегодня очень энергичная.»\n[s4] «Ничего страшного. С таким я справлюсь в любой день.»"
1006805-31 = "Хи-хи-хи..."
1006805-32 = "Стойте! Нет. Всё не так. Сейчас не время вам быть добрым ко мне!"
1006805-33 = "Сейчас время мне быть доброй к вам! Точно! Я отплачу вам за всю помощь, которую вы мне оказали, Сенсей!"
1006805-34 = "Я ведь уже говорила, да? Сегодня всё за мой счёт!"
1006805-35 = "Я довольно долго на это копила! Так что позвольте мне сегодня за всё вас угостить, хорошо?"
1006805-36 = "...А?"
1006805-37 = "Хотите оплатить часть транспорта? Нет! Нет, ну же, так не пойдёт. Платить должна я!"
1006805-38 = "Вы говорите... что у вас просто всегда так? Эм... правда? Не уверена, что можно просто так это заявить..."
1006805-39 = ""
1006805-41 = ""
1006805-42 = "Н-Но! Сейчас не до этого! Нам пора идти! Нам ещё столько мест нужно посетить."
1006805-43 = ""
1006805-45 = ""
1006805-47 = "Хи-хи. Готовы, Сенсей? Лучше бы да! Я выбрала все самые модные места!"
1006805-48 = ""
1006805-50 = ""
1006805-51 = "[ns] Следовать за Рейсой."
1006805-53 = "Торговая улица Тринити"
1006805-54 = "Та-дам! Вот первое место!"
1006805-55 = "Здесь потрясающе, правда? В этом торговом районе новые десерты появляются раньше, чем где-либо ещё в Тринити!"
1006805-56 = "Так что если хотите попробовать самые свежие новинки, лучше места не найти! О, о, а за этим углом ещё и знаменитое Cafe Mille-Feuille!"
1006805-57 = "Что? Ха-ха, нет, я ничего не изучала заранее... Просто друзья показали мне всё вокруг."
1006805-58 = "В общем! Вы уже бывали в Cafe Mille-Feuille, Сенсей?"
1006805-59 = "[s5] «Немного знаком.»\n[s6] «Я был там пару раз.»"
1006805-62 = "Ух ты! Круто, Сенсей!"
1006805-63 = "Но со мной вы там ещё не были! Пойдём!"
1006805-64 = ""
1006805-66 = ""
1006805-68 = ""
1006805-70 = "Игровой центр"
1006805-71 = "Та-дам! А вот и следующее место!"
1006805-72 = "Здесь при желании можно провести целый день! Тут так здорово!"
1006805-73 = ""
1006805-75 = ""
1006805-76 = "Мне нравится автомат-хватайка с Пероро! О, и Hitgirls!"
1006805-77 = "Хе-хе, может, по мне и не скажешь, но я довольно хорошо играю в Hitgirls! Начала совсем недавно, но по проценту побед уже примерно посередине среди одноклассников, даже тех, кто играет дольше."
1006805-78 = "Ну что, во что хотите сыграть, Сенсей?"
1006805-79 = "[s7] «Мне нравится автомат-хватайка.»\n[s8] «Осторожнее. Вообще-то я неплохо играю в Hitgirls.»"
1006805-82 = "...!"
1006805-83 = "Хорошо! Вперёд!"
1006805-84 = ""
1006805-86 = ""
1006805-88 = "Парк развлечений"
1006805-89 = "Для парка развлечений здесь намного пустыннее, чем ожидаешь, правда? Но так даже лучше! Никаких очередей!"
1006805-90 = "Хотя вообще-то мы с друзьями обычно ходим в парк побольше, он чуть дальше отсюда... Но я не смогла впихнуть его в расписание!"
1006805-91 = "Так что я здесь впервые. Сузуми патрулирует этот район и посоветовала мне это место."
1006805-92 = "Хм! На чём покатаемся? Отсутствие очередей означает ещё и слишком большой выбор!"
1006805-93 = "[s9] «Здесь очень хорошее колесо обозрения.»\n[s10] «А карусель здесь довольно красивая.»"
1006805-96 = "О, понятно! Тогда..."
1006805-97 = ""
1006805-99 = ""
1006805-100 = "Эм... хм..."
1006805-101 = "Хм. Ну..."
1006805-102 = "[s11] «Рейса...?»\n[s12] «Ты о чём-то задумалась. Что такое?»"
1006805-105 = "О! Ничего. Ничего такого! Ха-ха!"
1006805-106 = ""
1006805-108 = ""
1006805-109 = "Пойдём! Да!"
1006805-110 = ""
1006805-112 = ""
1006805-116 = "Детская площадка"
1006805-118 = ""
1006805-119 = ""
1006805-120 = ""
1006805-121 = "Да уж. Я смертельно устала. В любом случае..."
1006805-122 = "Когда я распланировала целый день, немного переживала, что вам станет скучно..."
1006805-123 = "Но в итоге нам нашлось чем заняться! И всё заняло больше времени, чем я думала."
1006805-124 = "Так приятно завершить такой насыщенный день! Но, эм, вам-то как, Сенсей?"
1006805-125 = "[s13] «Мне тоже было очень весело.»\n[s14] «Жаль только, что время пролетело так быстро.»"
1006805-128 = "Хи-хи..."
1006805-129 = ""
1006805-131 = ""
1006805-132 = "Вообще-то... Дело в том..."
1006805-133 = "Есть... ещё одна вещь. Хотя нам обоим было весело..."
1006805-134 = "Куда бы мы ни ходили — в кафе, игровой центр и все остальные места... Я хотела показать их вам, но вы и так уже всё знали."
1006805-135 = "А в парке развлечений в итоге вообще вы показывали всё мне..."
1006805-136 = "Но, наверное, это логично. Вы бываете в стольких местах с самыми разными студентами."
1006805-137 = "Просто..."
1006805-138 = "Я столько говорила о том, что устрою для вас особенный день, а в итоге не смогла этого сделать."
1006805-139 = "Так что мне кажется, будто я просто зря потратила ваше время, Сенсей..."
1006805-140 = "Думаю... со мной иногда такое бывает. Я так радуюсь тому, что могу что-то кому-то подарить, что совсем не замечаю, нравится ли это самому человеку..."
1006805-141 = "И... похоже, сейчас мог быть ещё один такой случай. Если так... простите."
1006805-142 = ""
1006805-145 = "[ns15] «Нет, этот день точно был особенным!»\n[ns16] «То было тогда, а это — сейчас.»"
1006805-148 = "А? Но, Сенсей..."
1006805-149 = "[ns17] «Я впервые был в этих местах вместе с тобой.»\n[ns18] «И узнал о тебе много нового.»"
1006805-152 = "[ns] «Так что я уже жду следующего дня, который мы проведём вместе, Рейса.»"
1006805-153 = ""
1006805-155 = ""
1006805-156 = "Сенсей..."
1006805-157 = "..."
1006805-158 = "Хорошо!!"
