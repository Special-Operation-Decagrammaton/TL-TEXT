[translation]
1011805-1 = "Неожиданное место"
1011805-3 = "Я направлялся к метро, как обычно."
1011805-6 = "[ns] «А?»"
1011805-7 = ""
1011805-8 = "Погоди, что? Сенсей?"
1011805-9 = "Пахьяхья! Не ожидала встретить тебя здесь!"
1011805-10 = "[ns1] «Привет, Нозоми.»\n[ns2] «Что ты здесь делаешь?»"
1011805-13 = "Конечно же, еду на метро."
1011805-14 = "Ты тоже на нём едешь, Сенсей?"
1011805-15 = "Отлично! Давай вместе."
1011805-17 = "Повезло! Есть свободное место!"
1011805-18 = "Сенсей! Садись сюда!"
1011805-19 = ""
1011805-24 = ""
1011805-25 = ""
1011805-26 = "[ns3] «Я нечасто вижу тебя в метро.»\n[ns4] «Ты часто им пользуешься?»"
1011805-29 = "Пахьяхья! Иногда. Не везде же есть железнодорожные пути."
1011805-30 = "Оно не так уж сильно отличается от поезда, поэтому мне нравится, понимаешь?"
1011805-31 = "[s] «Наверное, они и правда похожи.»"
1011805-32 = "Вмещают много людей, обычно ходят по расписанию..."
1011805-33 = "...и ещё внутри просторно, поэтому меня не укачивает."
1011805-34 = "Пахьяхья! Так что да, большинство плюсов прямо как у поезда!"
1011805-35 = "Минусы: оно меньше, бывает тесно и останавливается чаще, чем поезд."
1011805-36 = "Получается, поезда всё-таки лучше. Не думаешь?"
1011805-37 = "[s5] «Да, но, как ты и сказала, железная дорога есть не везде.»\n[s6] «Метро и автобусы тоже нужны.»"
1011805-40 = "Хм-м. Наверное."
1011805-41 = "В зависимости от того, куда едешь, они действительно МОГУТ быть практичнее поездов."
1011805-42 = "Может, когда-нибудь мне дадут поводить метро."
1011805-43 = "[s] «А кораблём управлять не думала?»"
1011805-44 = "Кораблём? Я никогда не плавала, но слышала, что там ужасно укачивает."
1011805-45 = "Наверное, это не для меня!"
1011805-46 = "О? На больших кораблях укачивает меньше? Хех, похоже, ты поездил на самых разных видах транспорта, да?"
1011805-47 = "Пахьяхья! Ну, может, когда-нибудь отправлюсь куда-нибудь на корабле."
1011805-48 = "Но знаешь, что было бы по-настоящему круто? Морской поезд!"
1011805-49 = "[s7] «Ехать по рельсам прямо по морю!»\n[s8] «Было бы круто, если бы такое существовало.»"
1011805-52 = "Нужно просто продолжать строить новые пути, верно? Рано или поздно это случится. Пахьяхья!"
1011805-54 = "Мы ещё некоторое время обсуждали разные виды транспорта..."
1011805-55 = ""
1011805-58 = "...и в итоге я проехал свою остановку."
