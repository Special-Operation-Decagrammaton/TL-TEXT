[translation]
10058110-1 = "Episode 11;Off your Tank!"
10058110-3 = "Now then! Let us move onto the award ceremony!"
10058110-4 = "To keep things moving, I— Kyougoku Satsuki— will be present the victors."
10058110-8 = "The victors are—Red Winter Federal Academy's Spec Ops No. 183!"
10058110-22 = "We really won..."
10058110-23 = "U-Urgh... Th-this isn't a dream, right?"
10058110-26 = "Why did you shoot me!? Aren't you normally supposed to pinch your own#ncheeks!?"
10058110-27 = "'Cause that'd huurt! Uwaaaan!"
10058110-28 = "Congratulations!"
10058110-29 = "Well done, soldiers of Red Winter."
10058110-30 = "I'm so glad we helped you out! I can't believe you actually won!"
10058110-33 = "The Make-up Work Club..."
10058110-34 = "We couldn't have done it without you! Uwaaaaan!"
10058110-40 = "...?"
10058110-41 = "Oh my. Heheh."
10058110-42 = "This is supposed to be a happy occasion—why're you all crying!? #nHeheheh! But that does make this the perfect opportunity for a photo!"
10058110-43 = "A-A photo!?"
10058110-44 = "Wait just a sec, now!"
10058110-45 = "Where did Rana run off to? Ranaaa!"
