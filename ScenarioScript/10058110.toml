[translation]
10058110-1 = "Episode 11;Off your Tank!"
10058110-3 = "Now then! Let's move on to the awards ceremony!"
10058110-4 = "Due to scheduling, I, Satsuki Kyogoku, will be making the announcement."
10058110-8 = "The winner is... Redwinter Federal Academy's Class 183 Special Class!"
10058110-22 = "We really won..."
10058110-23 = "N-No way... This... This isn't a dream, right?"
10058110-26 = "Why would you hit me?! Normally people pinch their own cheeks!"
10058110-27 = "That hurts, you know!! Waaaaah!"
10058110-28 = "Congratulations!"
10058110-29 = "Congratulations, warriors of Redwinter."
10058110-30 = "I'm so glad we helped you! Winning is amazing!"
10058110-33 = "Remedial Class everyone..."
10058110-34 = "Thanks to you all, we won! Waaaaah!"
10058110-40 = "...?"
10058110-41 = "My, hehe."
10058110-42 = "Why is everyone crying at such a happy moment!#nHehe! Though this is definitely a photo opportunity!"
10058110-43 = "A, a photo!?"
10058110-44 = "Wait just a minute?!"
10058110-45 = "Where did Rana go? Lana!"
10058110-46 = "Lost again?!"
10058110-47 = "I saw her walking off by herself that way just now."
10058110-48 = "I don't think she's lost. She had the look of someone heading where she needs to go."
10058110-49 = "Eh?"
10058110-51 = "Say cheese!"
10058110-52 = "Ch-Cheese!?!?!"
10058110-57 = "Um, fluffy-san."
10058110-58 = "Oh. You're the pilot from earlier."
10058110-59 = "Congratulations on your victory."
10058110-60 = "If you don't mind me asking, there's something I'd like to know."
10058110-61 = "Why do you not feel any sadness or regret?"
10058110-62 = "Huh?"
10058110-63 = "I'm sorry, I can't put it into words well.#nI'm certainly not trying to mock you."
10058110-64 = "Even though fluffy-san lost, somehow you looked like you were in a good mood."
10058110-65 = "If that's really true, please tell me why."
10058110-66 = "Let me ask you something as well. Why are you asking this?"
10058110-67 = "Because I'm worried about a friend."
10058110-68 = "My friend... was troubled both before coming here, and after."
10058110-69 = "Fearing failure and danger, they tried to give up."
10058110-70 = "...Yes."
10058110-71 = "Not wanting to embarrass everyone, not wanting to put them in danger—"
10058110-72 = "It must have been for reasons like that."
10058110-73 = "My friend calls themselves a coward...#nbut I think differently. Because I believe that giving up is also a form of courage."
10058110-74 = "...filters..."
10058110-75 = "However, even if my friend were to experience setback once again—"
10058110-76 = "Having had no friends until now, #nI don't know what I can do for them as a friend..."
10058110-77 = "That's why...#nWhen my friend eventually needs comfort, I want to know what words I can say to them."
10058110-78 = "\"An acquaintance of mine said this.\""
10058110-79 = "Ho."
10058110-80 = "If that's the case, I understand."
10058110-81 = "It's true, I was in a good mood."
10058110-82 = "That's because everyone fought with all their might."
10058110-85 = "Just because you lost as a result doesn't mean you need to feel regret."
10058110-86 = "I think... as long as we both fought with all our might, that's enough."
10058110-87 = "I like slacking off and being lazy too, but#nthis kind of thing isn't bad once in a while."
10058110-88 = "I don't dislike the eyes of people who \"work hard at what they love with all their might.\"#nWell, doing it every time is exhausting, though."
10058110-89 = "Besides...#nif you don't want to give up even a little, I think it's important to just try it anyway."
10058110-90 = "Regretting \"I should have done it back then...\" is the most troublesome thing of all.#nI hate troublesome things."
10058110-91 = "I see. That's very informative."
10058110-92 = "May I ask one more question?#nDid battling us become an \"important process\" for you as well, fluffy-san?"
10058110-93 = "That is..."
10058110-97 = "U-Um!!"
10058110-98 = "I-I'm sorry!! Tank Commander Iroha!! I got so nervous...!"
10058110-99 = "I'm so sorry for asking such a pointless question!!"
10058110-100 = "Tank Commander, is it."
10058110-101 = "The race is over. There's no need to call me \"Tank Commander.\""
10058110-102 = "People lose sometimes. Rest assured. I won't get angry over something like this."
10058110-103 = "I just get a bit high-strung while I'm in the tank.#nI'd like to apologize, so let's go get some food together as a wrap party."
10058110-106 = "Iroha-senpai...!"
10058110-107 = "Since there are no objections, let's do that."
10058110-108 = "Shall we go to karaoke together too!?"
10058110-109 = "If just listening is fine. Well then..."
10058110-110 = "Iroha Natsume!!!!!!"
10058110-111 = "What is the meaning of this?! For Gehenna to miss out on victory?!"
10058110-112 = "The prestige of the Pandemonium Society is ruined! The prestige of Lord Makoto is ruined!!"
10058110-113 = "Haa. Looks like I have to run away again."
10058110-114 = "Toramaru, all hands mount!"
10058110-115 = "Destination, hamburger shop!"
10058110-116 = "Ma'am, yes ma'am!!!"
10058110-120 = "Ah... I haven't answered yet, have I?"
10058110-124 = "I suppose it was an \"important process\" for me too. Since it was a good experience."
10058110-127 = "Toramaru, move out!"
10058110-132 = "Iroha Natsumeーーー!!!"
10058110-135 = "Farewell. The \"important process\" I met in Gehenna."
10058110-136 = "Lana! Hurry up and come here!!"
10058110-137 = "Sensei says they'll take a picture!! Everyone's gathering together~!"
10058110-147 = "A commemorative photo...! I've got to hang this on the lab wall...!"
10058110-148 = "We finally won...! At last...! Uwaaaah!"
10058110-149 = "Hey, Elina!! Don't push!"
10058110-150 = "Hah~? I'm not pushing~!? It's cramped, so go over there!!"
10058110-151 = "I was here first, so Elina, you go over there!#nIt's fine with just Rana and me over here!"
10058110-152 = "Now that I look at it, Anna's covered in ash! Go change your clothes or something!?"
10058110-153 = "So is Elina!!"
10058110-154 = "Hold the trophy, and make a peace sign."
10058110-155 = "[ns] \"Alright, taking it!\""
10058110-157 = "[ns] \"Say cheese!\""
