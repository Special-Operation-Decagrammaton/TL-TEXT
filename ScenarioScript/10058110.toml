10058110-57 = "Excuse me, Fluffy-san."
10058110-58 = "Oh. You were the driver, weren't you?"
10058110-59 = "Congratulations on your victory."
10058110-60 = "If you don't mind, I have something I'd like to ask you."
10058110-61 = "Why do you not feel sad or frustrated for losing?"
10058110-62 = "Huh?"
10058110-63 = "Sorry, I'm not very good at articulating myself. #nI wasn't trying to make fun of you."
10058110-64 = "I was only wondering why you seem to be in a good mood despite losing."
10058110-65 = "If you really are, then I would like to know why."
10058110-66 = "Then let me ask you this—why would you like to know?"
10058110-67 = "Because I'm worried about my friends."
10058110-68 = "My friends... They've been uneasy this entire time, whether it be before or after#ncoming here."
10058110-69 = "They'd even considered quitting out of a fear of failure or danger."
10058110-70 = "...I see."
10058110-71 = "The desire to not see us humiliated or put in the face of danger—"
10058110-72 = "These are just some of the reasons why."
10058110-73 = "My friends think of themselves as cowards... #nBut I see it differently. I believe giving up is a form of courage itself."
10058110-74 = "..."
10058110-75 = "But if there ever comes time where they experience another setback—"
10058110-76 = "As someone who's never had friends until now, #nI don't know what I can do for them as a friend..."
10058110-77 = "What I'm saying is... #nIf my friends ever need comforting, I'd like to know what I can say to help them."
10058110-78 = "Or at least that's what someone I know would like to ask."
10058110-79 = "Interesting."
10058110-80 = "I think I understand."
10058110-81 = "I can't deny that I'm in a good mood."
10058110-82 = "If you're wondering why, then it's because everyone gave it their all."
10058110-85 = "If that's what I lost to, then so be it."
10058110-86 = "Personally... As long as everyone puts their heart into it, then I'm satisfied."
10058110-87 = "I'm a big fan of playing hooky and lazing around, #nbut something like this every once in a while isn't so bad."
10058110-88 = "It's hard to hate someone who puts everything they have into something they#nlove. That said, it is a pain to do it everytime though."
10058110-89 = "Besides... If there's ever a single part of you that refuses to give up, I think it's#nimportant to listen to it and push on for the time being."
10058110-90 = "There's no bigger hassle than the kinds of regret that make you go, \"if only#nI'd tried that earlier...\" and if there's anything about me, it's that I hate hassles."
10058110-91 = "I see. I learned something new."
10058110-92 = "I have one last thing I'd like to ask. #nDo you consider our fight as a precious part of your journey too, Fluffy-san?"
10058110-93 = "Well..."
10058110-97 = "U-Umm!"
10058110-98 = "I-I'm sorry, Commander Iroha! I was just really nervous at the time...!"
10058110-99 = "I'm really sorry for asking such a trivial question earlier!"
10058110-100 = "Commander?"
10058110-101 = "The race is already over. There's no need to call me \"commander\" anymore."
10058110-102 = "Also, you win some, you lose some—so don't get too caught up over it. I won't get mad at you over something like this."
10058110-103 = "I tend to be a little high-strung when I'm in a tank. #nTo make it up to you all, how about we go out for a meal as an after-party?"
10058110-106 = "Iroha-senpai...!"
10058110-107 = "If no one has any objections, then I'll take that as approval."
10058110-108 = "Could we go to a karaoke afterward too!?"
10058110-109 = "If you're fine with me just listening, then sure. Now then..."
10058110-110 = "NATSUME IROHA!!"
10058110-111 = "What is going on here!? Why has Gehenna lost!?"
10058110-112 = "Not the prestige of the Pandemonium Society! The prestige of the great#nMakotooo!"
10058110-113 = "*Sigh* Seems it's time to run again."
10058110-114 = "Toramaru, to your stations!"
10058110-115 = "Set course for a hamburger shop!"
10058110-116 = "Yes!"
10058110-120 = "Ah, right... I haven't answered your question yet."
10058110-124 = "I'd say it was a part of that precious journey for me too—I had a good experience."
10058110-127 = "Toramaru, advance!"
10058110-132 = "NATSUME IROHAAAAA!!"
10058110-135 = "Farewell, the part of our journey at Gehenna."
10058110-136 = "Rana! Come over here quickly!"
10058110-137 = "Sensei's gonna take a pic for us! Everyone's gathering for this one!"
10058110-147 = "A commemorative photo...! I'm definitely hanging this on the wall of my lab!"
10058110-148 = "Finally, at last...! We've won...! Uwaaaaah!"
10058110-149 = "Hey, Erina! Stop pushing me!"
10058110-150 = "'Scuse me? I am NOT pushing you! It's too cramped here, so shoo!"
10058110-151 = "I was here first, so YOU should be the one to scooch over! #nThis place is only big enough for Rana and I!"
10058110-152 = "Looking at you again, you're completely covered in ash! How about you go#nchange!?"
10058110-153 = "You know the same goes for you, right!?"
10058110-154 = "With this trophy in hand—peace."
10058110-155 = "[ns] \"I'm taking the photo now!\""
10058110-157 = "[ns] \"Everybody say cheese!\""