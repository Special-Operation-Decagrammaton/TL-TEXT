[translation]
102185-3 = ""
102185-4 = "Ну вот и всё."
102185-5 = "Э-Эм... спасибо за помощь."
102185-6 = "Хмф, не меня благодари. Благодари Ибуки."
102185-8 = "Ибуки! Спасибо! Ты проделала весь этот путь, чтобы спасти нас?"
102185-9 = "Ага! Ибуки не хотела, чтобы ниндзя-сестрички Ибуки пострадали! Поэтому Ибуки попросила Макото позаботиться о вас!"
102185-10 = "Но... Но... Ибуки не помешала важной ниндзя-миссии?"
102185-12 = "А? Н-Нет, Ибуки! Б-Благодаря тебе все в безопасности!"
102185-13 = "Благодаря тебе мы преодолели кризис, Ибуки!"
102185-14 = "Серьёзно. Я уже думала, что Клубу исследования ниндзюцу конец... Кажется, я до сих пор потею. Ты появилась в самый идеальный момент, Ибуки!"
102185-15 = "Правда? Хи-хи-хи. Хорошо! Ибуки рада, что всё сделала правильно."
102185-16 = "Но... Ибуки не хочет мешать вашей важной ниндзя-миссии!"
102185-17 = "Ибуки будет болеть за вас издалека! Вперёд, ниндзя, вперёд! Ниндзя-сестрички Ибуки!"
102185-18 = "Спасибо за поддержку, Ибуки!"
102185-19 = "Да! Я постараюсь изо всех сил ради тебя, Ибуки! Нин-нин!"
102185-20 = "М-Мы сделаем всё, что сможем..."
102185-25 = "Связь, построенная на любви к ниндзя... или что-то вроде того. Наверное."
102185-26 = "..."
102185-27 = "И всё? Концовка какая-то немного антиклимактичная."
102185-28 = "Макото, Ироха! Спасибо, что сделали то, о чём попросила Ибуки!"
102185-29 = "Ибуки простите... Ибуки всегда такая большая капризуля!"
102185-30 = "*вздыхает* Всё нормально, если ты счастлива."
102185-31 = "Иногда делать что-то подобное... пожалуй, не так уж плохо."
102185-32 = "Прекрасно. Миссия выполнена — возвращаемся в Геенна! Ироха!"
102185-33 = "...Поехали."
102185-35 = "Следующий эпизод; Операция по обороне района — Город Ширатори, D.U."
