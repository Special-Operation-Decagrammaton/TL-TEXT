[translation]
10001010-1 = "Эпизод 1; Фестиваль взысканий"
10001010-2 = "Главный клуб школьного питания академии Красная Зима"
10001010-3 = "Это столовая, которая обеспечивает питанием наших гордых студентов академии Красная Зима!"
10001010-4 = "Питание — основа любой деятельности! Немыслимо связывать качество еды со статусом."
10001010-5 = "Поэтому все наши студенты великодушно получают одинаковое количество еды!"
10001010-6 = "Конечно, как Великий лидер академии, уважаемый президент, Благоустроитель окружающей среды, начальник санитарной службы..."
10001010-7 = "Эм..."
10001010-8 = "И всё остальное! В общем, поскольку я, Черино, великая и отвечаю за все великие дела, мне полагается один дополнительный пудинг!"
10001010-9 = "Кроме меня, все получают одинаковую порцию! Ха-ха-ха!"
10001010-10 = "[s] «Что они сейчас готовят?»"
10001010-11 = "Отличный вопрос, товарищ! Мне тоже интересно, откуда идёт этот сладкий запах."
10001010-12 = "Повар, что у тебя в кастрюле?"
10001010-13 = ""
10001010-14 = "Президент! По вашему великому приказу мы готовим пудинг к празднику Ивана Купалы."
10001010-15 = "В этом году к Ивану Купале нам велено удвоить порции пудинга, поэтому каждый член Клуба школьного питания круглые сутки трудится над его приготовлением."
10001010-16 = "Вот такого отношения я и ожидаю от образцового члена Клуба школьного питания! Очень хорошо!"
10001010-17 = "После окончания фестиваля я награжу тебя Орденом Усов первой степени!"
10001010-18 = "Спасибо, президент!"
10001010-19 = "А. Должно быть, это тот самый пудинг. Я лично его попробую."
10001010-20 = ""
10001010-21 = ""
10001010-22 = "*жует*"
10001010-23 = "Уф... Что с ним такое?! Безвкусный и слишком жидкий!"
10001010-24 = "Н-ну... Нам пришлось увеличить производство, но получить больше ингредиентов мы не смогли..."
10001010-25 = "Когда молока стало не хватать, мы начали добавлять воду, чтобы из той же смеси выходило больше."
10001010-26 = "Вы разбавляли пудинг водой? Наглецы...!"
10001010-27 = ""
10001010-28 = "Даже ради производительности это недопустимо!"
10001010-29 = "Марина!"
10001010-31 = "Вы звали меня, президент?"
10001010-32 = "Убрать отсюда этих наглых членов Клуба школьного питания! Тем, кто осмеливается разбавлять пудинг, полагаются взыскания!"
10001010-33 = "П-простите нас, Великий лидер! Мы тоже не хотели этого делать!"
10001010-34 = "Вы думали, вам сойдёт с рук саботаж славного и безупречного плана нашего Великого лидера?!"
10001010-35 = "Или вы настолько не уважаете власть усов?"
10001010-36 = "Уф, это несправедливо! У нас не было выбора!"
10001010-38 = ""
10001010-40 = "Фух, вот это была суматоха."
10001010-41 = "[s1] «Ж-жестоко...»\n[s2] «Ну и академия...»"
10001010-42 = "Ха-ха. Забудь об этом, товарищ. Всего лишь мелкая неприятность."
10001010-43 = "Ха-ха. Забудь об этом, товарищ. Всего лишь мелкая неприятность."
10001010-44 = "Хм? Хочешь знать, что происходит со студентами, получившими взыскания?"
10001010-45 = "Что ж."
10001010-46 = "Их ждут ужасные наказания!"
10001010-47 = "Им уготована одна из двух страшных участей. Неделю в одиночку мыть туалеты..."
10001010-48 = "...или целый месяц оставаться без порции сладостей!"
10001010-49 = "Для всеобщего блага лучше не бросать вызов власти академии Красная Зима, товарищ. Ха-ха!"
10001010-50 = "Ладно, хватит об этом. Идём на следующий объект инспекции!"
10001010-52 = "Типография академии Красная Зима"
10001010-53 = "Это редакция «Красного медведя» — ежедневной газеты, которая распространяет новости и славу нашей академии Красная Зима!"
10001010-54 = "А? Хочешь знать, зачем она нам, если всей прессой Кивотоса занимается Кронос?"
10001010-55 = "Да всё это чушь!"
10001010-56 = "Жёлтая журналистика Кронос — сплошные сплетни и ложь!#nЕй не сравниться с «Красным медведем», который всегда оперативен и точен!"
10001010-57 = "Товарищ, как будет время, обязательно почитай «Красного медведя». Может, узнаешь кое-что полезное!"
10001010-58 = ""
10001010-60 = "Главный редактор, специальный выпуск к Ивану Купале уже готов?"
10001010-61 = ""
10001010-62 = "Разумеется, президент. В этом специальном выпуске на первой полосе будет ваш большой портрет, напечатанный цветными чернилами на бумаге высшего качества."
10001010-63 = "Превосходно! После фестиваля тебя ждёт медаль за службу!"
10001010-64 = "Спасибо, президент!"
10001010-65 = "Хм-м, позвольте взглянуть на статью."
10001010-66 = ""
10001010-67 = "«Великий президент Черино лично инспектирует строительную площадку парка развлечений...»"
10001010-68 = "Да-да. Очень хорошо!"
10001010-69 = "...Хм? Главный редактор. С фотографией рядом со статьёй что-то не так."
10001010-70 = "Марина и Томоэ здесь есть, а меня нигде не видно. Что случилось?"
10001010-71 = "Прошу прощения, президент, но вы были... слишком низкой, чтобы попасть в кадр, поэтому мы—"
10001010-72 = "Что?! Ты называешь меня коротышкой?!"
10001010-73 = "Я-я такого не говорил!"
10001010-74 = ""
10001010-75 = "Вот наглость этого жалкого репортёра!"
10001010-76 = "Если нашего президента не было видно с такого ракурса, следовало отредактировать снимок и сделать её выше!"
10001010-77 = "Н-но «Красный медведь» — газета, которая должна всегда сообщать правду..."
10001010-78 = "Ар-р-р! Марина!"
10001010-79 = "Да, президент."
10001010-80 = ""
10001010-81 = "Взыскание этому наглому главному редактору, посмевшему оскорбить нашего уважаемого президента, великого лидера академии Красная Зима!"
10001010-82 = ""
10001010-83 = "Я-я всё исправлю! Пощадите, президент!"
10001010-84 = ""
10001010-85 = "Ты должен знать: сказанные слова и напечатанные статьи назад уже не заберёшь!"
10001010-89 = "Боже мой, в последнее время столько неповиновения."
10001010-90 = "Ну и ладно. Буду просто наказывать их по мере появления."
10001010-91 = "*зевает* Может, я слишком много работаю. Спать хочется..."
10001010-92 = "Томоэ, я хочу вернуться и вздремнуть..."
10001010-93 = "Хи-хи. Поняла. Я немедленно подготовлю вашу кровать."
10001010-94 = "Товарищ, пока я буду спать, тебе тоже стоит немного отдохнуть."
10001010-95 = ""
10001010-96 = "Сенсей, можете воспользоваться комнатой отдыха."
10001010-97 = "Идите за мной, я покажу дорогу."
10001010-99 = "Коридор нового здания академии Красная Зима"
10001010-100 = ""
10001010-101 = "Хорошая работа сегодня, председатель Марина!"
10001010-102 = "Спасибо! Вы все тоже отлично потрудились!"
10001010-103 = "Наконец-то я закончила наказывать сегодняшних недовольных. Пора возвращаться и немного отдохнуть..."
10001010-104 = ""
10001010-105 = ""
10001010-106 = ""
10001010-107 = "Ч-что за...?"
10001010-108 = ""
10001010-111 = "Ай, моя спина..."
10001010-112 = "Почему Комитет благоустройства позволяет валяться пустым банкам?!"
10001010-113 = "Я всех их привлеку за саботаж!"
10001010-114 = "И кажется, когда я упала, я во что-то врезалась..."
10001010-115 = "Что это?"
10001010-119 = "С-статуя президента Черино?!"
10001010-120 = "Наверное, при падении у неё отломились усы!"
10001010-121 = "Ч-что же делать? Может, их ещё можно приклеить обратно...?"
10001010-122 = "*вздыхает* Если президент Черино об этом узнает..."
10001010-123 = ""
10001010-126 = "Ты сломала мою статую?! И посмотри на её усы! Они выглядят нелепо!"
10001010-127 = "Гр-р... Непростительно! Ты будешь наказана! Взыскание!"
10001010-129 = "Бывший председатель Марина, до самого выпуска будешь мыть грязные туалеты в Старом институте!"
10001010-130 = ""
10001010-131 = "Н-нет... Я так усердно работала, чтобы добиться этой должности!"
10001010-132 = "Должен быть какой-то выход... Что-то, что позволит избежать наказания! Я не собираюсь до конца своих дней мыть грязные туалеты!"
10001010-133 = ""
10001010-134 = "...Погоди."
10001010-135 = "Если не будет никого, кто обладает большей властью, чем я, меня ведь некому будет наказать, верно?"
10001010-136 = "Точно! Первое правило боя — ударить первой! Если я свергну Черино и стану президентом, меня больше никто не сможет наказать!"
10001010-137 = "Совет безопасности, построиться!"
10001010-138 = ""
10001010-140 = ""
10001010-141 = ""
10001010-142 = ""
10001010-143 = "Что происходит, госпожа председатель?"
10001010-144 = "Немедленно штурмуем секретариат, вытаскиваем оттуда чиновников и свергаем президента Черино!"
10001010-145 = "Это... революция, госпожа председатель?"
10001010-146 = ""
10001010-147 = "Д-да! Революция!"
10001010-148 = "...И я совершенно точно делаю это не ради того, чтобы избежать наказания президента Черино!"
10001010-149 = "О! Председатель Марина обнажила меч!"
10001010-150 = "Свергнем президента Черино и её прогнивших приспешников!"
10001010-151 = ""
10001010-153 = "(Я сделала это в панике, но всё идёт куда лучше, чем я ожидала!)"
10001010-154 = "(Точно. Мне просто нужно стать новым президентом и взять власть в свои руки!)"
10001010-155 = ""
10001010-157 = "Хорошо. Все готовьтесь к штурму секретариата..."
10001010-158 = "Выдвигаемся!"
