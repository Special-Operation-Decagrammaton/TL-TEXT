[translation]
1000306-1 = "Совет"
1000306-2 = "Класс Тринити"
1000306-3 = ""
1000306-4 = ""
1000306-5 = ""
1000306-6 = "*вздыхает*"
1000306-7 = "[s] «Что случилось?»"
1000306-8 = "О! С-Сенсей! Когда ты пришёл?"
1000306-9 = "Ты забеспокоился после моего последнего сообщения?"
1000306-10 = "Прости. Я не хотела тебя тревожить..."
1000306-11 = ""
1000306-12 = "Вообще-то я переживаю не за себя. За одну из подруг..."
1000306-13 = "Дело в том, что друзья часто обращаются ко мне за советом. Может быть, потому что я кажусь спокойной."
1000306-14 = "Сегодня одна из них пришла поговорить со мной, но я ничем не смогла ей помочь..."
1000306-15 = "Я только повторяла то, что она говорила. Ничего не добавила..."
1000306-16 = "Может, если бы я не была такой обычной и обладала настоящим талантом, я смогла бы помочь... Я была бы так счастлива, если бы просто могла быть рядом с ними."
1000306-17 = "Сегодня я весь день об этом думаю."
1000306-18 = "Хи-хи. Жалкое зрелище, правда?"
1000306-19 = "Не то чтобы что-то изменится от того, что я жалуюсь тебе, Сенсей..."
1000306-20 = "[s] «По-моему, ты отлично справляешься, Хифуми.»"
1000306-21 = "А? В каком смысле отлично?"
1000306-22 = "Я ведь только выслушала подругу..."
1000306-23 = "Не то чтобы я совсем ничего не сделала, но мне кажется, этого недостаточно..."
1000306-24 = "[s] «Ты поддерживаешь её.»"
1000306-25 = "Поддерживаю её..."
1000306-26 = "Иными словами, вместо того чтобы жалеть себя, мне стоит быть благодарной за то, что подруга на меня рассчитывает..."
1000306-27 = "Мне нужно сохранять позитивный настрой, чтобы подбодрить её, да?"
1000306-28 = "Спасибо. Мне уже намного лучше."
1000306-29 = "Ты прав. Иногда человеку просто нужен кто-то, с кем можно поговорить."
1000306-30 = "Поэтому, Сенсей, я бы хотела, чтобы... для меня таким человеком был ты."
1000306-31 = "Потому что я тоже на тебя рассчитываю, Сенсей!"
