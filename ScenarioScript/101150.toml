[translation]
101150-1 = "Эпизод 15; Ниспровержение повествования"
101150-2 = "Хорошо! Я силой вломлюсь в административное управление отсюда и первым делом подключу сети связи!"
101150-3 = "Мы восстановим все сети связи и административные системы, отключённые по всему D.U.!"
101150-4 = "М-Момока..."
101150-5 = ""
101150-7 = ""
101150-13 = "Готово!"
101150-14 = ""
101150-16 = ""
101150-17 = "Ч-что?!"
101150-21 = "Сенсей, связь восстановлена!"
101150-22 = "Ч-Ч-Что?! Сколько же здесь непрочитанных сообщений!"
101150-23 = "Двести пятьдесят пропущенных звонков?!"
101150-25 = "Сенсей, где вы? Мне нужно кое-что с вами обсудить. Это касается пророчества..."
101150-26 = "Сенсей, мне нужно поговорить с вами о том, что мы нашли в районе Ариус."
101150-27 = "Сенсей? Где вы? Почему вы сегодня не пришли на Комитет экстренного реагирования? Сенсей?"
101150-28 = "Сенсей? Вы в порядке?"
101150-29 = "Сенсей! Я только что услышала про Комитет экстренного реагирования. Подождите, я уже иду. Не начинайте без меня!"
101150-30 = "Ч-Что?! Военное положение? Заблокировано? Что происходит, Сенсей?"
101150-31 = "Сенсей... Похоже, в Кивотосе что-то происходит. Вы в порядке?"
101150-32 = "Что случилось с электричеством, Сенсей? Что не так?"
101150-33 = "Сенсей... Где вы?"
101150-34 = "Это всё из-за меня? С вами что-то случилось... из-за меня?"
101150-35 = "Сенсей... Широко..."
101150-36 = "Широко бесследно исчезла... Почему это происходит?"
101150-37 = "Сенсей... Это насчёт Широко... Что нам делать...?"
101150-38 = "Сенсей! Широко пропала! Она оставила велосипед! Позвоните, как только увидите это!"
101150-41 = "Это..."
101150-44 = "Ч-Что это?! Это по всему Кивотосу..."
101150-46 = "Это..."
101150-47 = "Отступим и выясним, что происходит."
101150-48 = "П-Поняла!"
101150-49 = "..."
101150-51 = "У-угх... Ублюдки..."
101150-52 = ""
101150-55 = "FOX 1. Здесь чисто."
101150-56 = "FOX 2. Начальник обороны захвачена. Как дела, FOX 3?"
101150-57 = "Целевой предмет у нас. Покидаем здание Шале."
101150-58 = "Я так горжусь нашими младшими. Они сражались на равных со спецназом Кайзер."
101150-59 = "Им помогал Шале."
101150-60 = "Но что это такое? Мне приказали забрать это из подвала Шале, а я даже не знаю, что это."
101150-61 = "Начальник обороны наверняка знает. Спрошу, когда она очнётся."
101150-62 = "Так что с нашим планом? Что теперь?"
101150-63 = "Пока отступаем. Атака Кайзер сорвала план."
101150-64 = "Хорошо. Звучит нормально!"
101150-65 = ""
101150-67 = ""
101150-68 = "...Пока отступим."
101150-73 = "Сенсей, это..."
101150-74 = ""
101150-76 = ""
101150-79 = ""
101150-81 = "А. Теперь я понимаю."
101150-82 = ""
101150-83 = ""
101150-84 = "Сенсей, ваша сила больше не сработает."
101150-85 = "[s] «Ты... Голконда...?»"
101150-86 = "Неверно. Голконды больше нет. Я — Франциск, и вместе с Декалькоманией я буду наблюдать за вами. Внемлите этим последним словам."
101150-87 = "По самой природе этой истории вы могли бы быть её главным героем."
101150-88 = "До сих пор вы пользовались привилегией собственной неуязвимости. История была написана для вас."
101150-89 = "Но теперь..."
101150-90 = "Это повествование было ниспровергнуто."
101150-91 = "Установленные прежде контекст, структура, природа, замысел и трактовка были полностью разрушены."
101150-92 = "Что такое смысл? Истина? Всё поблекло. Переплелось. Стало непостижимым."
101150-93 = ""
101150-95 = ""
101150-96 = ""
101150-97 = "Сенсей."
101150-98 = "Все истории до этого момента были напрасны."
101150-99 = "События, которые развернутся с этого мгновения, вытеснят ваши прежние представления."
101150-100 = "Вы столкнётесь с миром без главных героев. Не будет ни злодеев, ни конфликта."
101150-101 = "Параллельные линии переплетутся, а все аксиомы, которые вы считали истинными, будут разрушены."
101150-102 = "Искусственная реальность, в которой устройство ваших жизней больше ничего не значит. Контекст, вероятность — всё теряет смысл."
101150-103 = "Этот мир будет полон настолько непостижимых абсурдов, что даже разница между верхом и низом утратит значение."
101150-104 = "Увы, ваше предначертанное будущее всегда существовало именно таким."
101150-105 = "Но те времена прошлого давно забыты."
101150-107 = "Это повествование больше не ваше. Вы никто, Сенсей."
101150-108 = "Милая история об академиях и юности закончилась."
101150-109 = "Повествование ниспровергнуто. Почувствуйте, как некогда дорогая вам значимость угасает, пока от вас не останется ничего."
101150-110 = "Так начнём же нашу новую реальность. Ту, где нет историй."
101150-111 = "[ns] «Нет.»"
101150-113 = "[ns1] «Будь то история конфликта, буйства, предательства или свержения...»\n[ns2] «Даже если история настолько сломана, что её едва можно назвать историей...»"
101150-116 = "[s] «Всё это неважно.»"
101150-118 = "[ns3] «Мне всё равно, если этот предполагаемый сюжет перевернётся.»\n[ns4] «Мне всё равно, даже если появится межгалактический линкор или гигантский робот.»"
101150-123 = "[ns] «Какой бы финал нас ни ждал, мы вместе его преодолеем.»"
101150-124 = ""
101150-125 = "..."
101150-126 = "Понятно. Тогда я буду наблюдать, как вы сражаетесь с этой историей, Сенсей... Или, вернее, наш главный герой!"
101150-127 = "Я буду смотреть, как вы движетесь к финалу отчаяния и катастрофы!"
101150-128 = ""
101150-132 = "О-они... Сенсей..."
101150-133 = "[s] «Арона, свяжись со всеми.»"
101150-134 = "А? Х-хорошо! Но что вы имеете в виду под «всеми»?"
101150-135 = "[s] «Я имею в виду всех.»"
101150-155 = "...Хорошо."
101150-156 = "Значит, Хрома уже соприкоснулась с Безымянными богами... Я просчитался."
101150-157 = "И подумать только, что скрывалось внутри бога-волка."
101150-158 = "Анубис, бог смерти, проводник всех живых существ в загробный мир..."
101150-159 = ""
101150-162 = "Это и был Ужас по ту сторону Мистики."
101150-163 = ""
101150-166 = "Сенсей! Прежде чем связь оборвалась, я отправила сообщение всем студентам, которых вы знаете!"
101150-167 = "Еле-еле успела... Но теперь..."
101150-168 = "[s5] «Ты отлично справилась. Спасибо, Арона.»\n[s6] «Как всегда, вместе мы сможем решить эту проблему.»"
101150-172 = "...На этом заключительный этап этого повествования завершён."
101150-173 = "Противник, с которым нам предстоит столкнуться, — Проводник Хромы, приведённый богом смерти."
101150-178 = "[ns] «Что ж. Теперь очередь Шале.»"
101150-180 = "Финальный эпизод; Продолжение во второй главе"
