83300200400-6 = ""
83300200400-7 = "Как и говорила Фуука, ингредиентов здесь огромная гора..."
83300200400-8 = ""
83300200400-10 = ""
83300200400-12 = "...Обычные продукты вроде мяса, молока и яиц..."
83300200400-13 = ""
83300200400-15 = ""
83300200400-17 = "А здесь... сладости? Это на День святого Валентина?"
83300200400-18 = "Их очень много... И не так уж много групп способны потратить столько денег на подготовку вечеринки..."
83300200400-19 = ""
83300200400-21 = ""
83300200400-23 = ""
83300200400-24 = ""
83300200400-26 = "А, на боку коробки есть накладная... В ней должно быть название, которое я ищу."
83300200400-28 = "...Именно как я и думала. Общество Пандемониума..."
83300200400-29 = ""
83300200400-30 = ""
83300200400-32 = "В отличие от вечеринок прошлых лет, на этот раз они передали всю подготовку Клубу школьных обедов."
83300200400-33 = "Макото... Что ты задумала?"
83300200400-34 = "...Нужно обсудить это с Ако."
