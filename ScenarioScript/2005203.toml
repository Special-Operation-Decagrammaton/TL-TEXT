[translation]
2005203-1 = "Деловое предложение"
2005203-2 = "Знаете, Сенсей."
2005203-3 = "[s] «Что такое, Якумо?»"
2005203-4 = "Всё, что говорит Шале, рано или поздно расходится по всему Кивотосу, верно?"
2005203-5 = "[s] «Ну, в каком-то смысле это довольно официальная позиция.»"
2005203-6 = "Разумеется. Но даже с учётом этого..."
2005203-7 = "Недавно я поняла, насколько редко встречается человек с таким уровнем неосязаемого влияния и охвата."
2005203-8 = "[s] «Когда ты начинаешь так говорить, мне становится очень тревожно.»"
2005203-9 = "Просто выслушайте меня, Сенсей."
2005203-10 = "Разве не жалко растрачивать впустую такое влияние и доверие?"
2005203-11 = "Вы, может, так не думаете. А я думаю. Я вижу эту возможность."
2005203-12 = "И пока я размышляла об этом, придумала отличное предложение. Что, если запустить кампанию «Давайте читать вместе» при прямой поддержке Шале?"
2005203-13 = "[s] «Похоже, это могло бы принести пользу обществу.»"
2005203-14 = "А затем мы тщательно отберём и добавим специальную подборку книг Издательского отдела. Хе-хе-хе."
2005203-15 = "[s] «Веди себя прилично, Якумо.»"
2005203-16 = "А, если подумать, библиотека Тринити от этого, наверное, пострадает..."
2005203-17 = "Нет. Если всё правильно разыграть, это только сильнее повысит доверие к Издательскому отделу... Можно обратить это себе на пользу..."
2005203-18 = "Говорят же, что только настоящий предприниматель умеет превращать кризис в возможность..."
2005203-19 = ""
2005203-21 = ""
2005203-22 = "Сенсей. Не могли бы вы поддержать Издательский отдел? В качестве советника или вроде того?"
2005203-23 = "А обоснование... Хм. «Ради благополучия замёрзшей академии среди пустошей и обездоленных студентов, страдающих там»."
2005203-24 = "[s] «Нет.»"
2005203-25 = "Почему?"
2005203-26 = "[s] «Ты сама знаешь почему.»"
2005203-27 = "Вы правы... Вот досада. Если бы только не существовало этого раздражающего положения о нейтралитете."
2005203-28 = "Так, что ещё у нас есть...?"
2005203-29 = "Шале... D.U...."
2005203-30 = "Общепризнанная зона политического нейтралитета..."
2005203-31 = "Иными словами, ни одна академия не может бездумно заявлять здесь о своём суверенитете..."
2005203-32 = "...а значит, даже слабый голос Федеральной академии Красная Зима мог бы прозвучать в Шале гораздо громче..."
2005203-33 = "Хм-м, хм-м. И студентом этой самой академии совершенно случайно являюсь я, Арамаки Якумо..."
2005203-34 = ""
2005203-36 = ""
2005203-37 = "Сенсей!"
2005203-38 = "Ради равенства и справедливости — неофициального девиза нашей Федеральной академии Красная Зима — все академии—"
2005203-39 = "Ну, не все, но так называемые «три главные академии»..."
2005203-40 = "Как насчёт того, чтобы сделать им... мягкое предложение напрямую или косвенно помочь Красной Зиме с производством пудинга?"
2005203-41 = "А мелким шрифтом добавим, что всё это мероприятие спонсировал Издательский отдел."
2005203-42 = "Это временно облегчит хроническую нехватку пудинга, повысит статус Красной Зимы за её пределами, а внутри..."
2005203-43 = "[s] «Отка-а-азано.»"
2005203-44 = ""
2005203-46 = ""
2005203-47 = "Почему?"
2005203-48 = "Ух... Ладно..."
2005203-49 = "Погоди. До сих пор я думала только о Красной Зиме... Может, именно эта близорукость и была причиной моих неудач?"
2005203-50 = "Если использовать тот факт, что Шале обладает внесудебными полномочиями..."
2005203-51 = "...Не смотрите на меня так. На этот раз цель — создать благотворную культуру. Поверьте мне. Это правда!"
2005203-52 = "В любом случае эти внесудебные полномочия, хотя раньше их применяли лишь в чрезвычайных ситуациях..."
2005203-53 = "В данном случае можно использовать ради общего блага..."
2005203-54 = "Предположим, например..."
2005203-55 = ""
2005203-57 = ""
2005203-58 = "...Конкретику продумаем немного позже."
2005203-59 = "В любом случае давайте от имени Шале осуществлять общественные проекты, полезные всем."
2005203-60 = "А потом просто объявим, что вы сотрудничаете с Издательским отделом!"
2005203-61 = "[s] «Нет.»"
2005203-62 = "Как холодно..."
2005203-63 = "[s] «И всё же, похоже, тебе действительно нравится заниматься подобными вещами, Якумо.»"
2005203-64 = "Ну да. Составление деловых предложений — в некотором роде моё хобби."
2005203-65 = "Как бы это объяснить? Меня захватывает возможность исследовать бесконечные варианты любой ситуации и играть с ними."
2005203-66 = "Неважно, совершенно ли идея невозможна или вполне осуществима."
2005203-67 = "Кроме того..."
2005203-68 = "Когда речь идёт о заработке, нужно преувеличивать всё, что только можно (в разумных пределах), но при этом не врать напрямую!"
2005203-69 = "Особенно когда дело касается Управления Красной Зимы..."
2005203-70 = "Например, предположим, что если проект пройдёт успешно, месячная норма пудинга удвоится..."
2005203-71 = "[s] «И хоть раз это действительно срабатывало?»"
2005203-72 = ""
2005203-74 = ""
2005203-75 = "Эм... Уверена, когда-нибудь сработает..."
2005203-77 = "Обсуждая важность доверия в любом бизнесе..."
2005203-78 = "мы с Якумо понемногу разгребали работу каждый по-своему и даже получали от этого удовольствие(?)."
2005203-79 = "К концу дня я с приятным удивлением снова вспомнил, что Якумо, в своей уникальной манере, — идеальный собеседник."
