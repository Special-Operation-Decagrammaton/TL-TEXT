[translation]
42185-3 = "M-Mas quem são elas?! De onde diabos estão surgindo e pra onde estão sumindo?!"
42185-4 = "Era para termos dominado completamente a planta da estação... Vai me dizer que existe alguma passagem secreta que só elas conhecem?!"
42185-10 = "Mas é claro!"
42185-11 = "Quando foi que—"
42185-21 = "Estações antigas passam por várias ampliações ao longo do tempo, então há muitos corredores e espaços que não aparecem no mapa!"
42185-22 = "Lugares assim têm maior tendência a ocorrências criminais,#nentão nós, alunas do Departamento de Segurança Pública, conhecemos todos eles...#nEmbora eu nunca tenha imaginado que isso seria útil numa situação dessas!"
42185-26 = "Ah, Fubuki! Tem inimigos... quer dizer, passageiros baderneiros indo para o segundo andar!"
42185-28 = "Ahaam, tô vendo~"
42185-29 = "Será que eles pretendem subir correndo pela escada rolante? Isso é perigoso~"
42185-34 = "Droga! Eu vou mostrar pra vocês!"
42185-36 = "Ah, calma aí.#nÉ que essa escada rolante é velha demais, sabe."
42185-40 = "De vez em quando~ ela dá uma parada de emergência."
42185-48 = "U-Uaaah?!"
42185-53 = "Por isso, para sua segurança, fiquem parados na escada rolante, tá?#nÉ o básico de qualquer cidadão civilizado."
42185-59 = "Maldito bando de rejeitados do Departamento de Segurança Pública... Brincando conosco desse jeito..."
42185-60 = "Não vou perdoar isso!"
42185-61 = "Ah, cuida—"
42185-75 = "Esquecerem-se da \"FeliSem\"... Parece que a elite da Kaiser Corporation ainda tem muito o que aprender!"
42185-76 = "Mesmo que o desprezo e a perseguição contra nós continuem... mesmo que todos os membros fujam e eu fique completamente sozinho... a luta da \"FeliSem\" jamais terminará."
42185-77 = "Até o dia em que todos em Kivotos deixem de trabalhar e de possuir — e descubram a alegria do Desapego!"
42185-79 = "Buscar um estilo de vida sem precisar trabalhar parece uma ideia maravilhosa, hein."
42185-80 = "Oh, você se interessa pelo estilo de vida do Desapego?#nEstamos sempre de braços abertos para novos discípulos!"
42185-81 = "...Porém, para entrar na \"FeliSem\", você precisará abrir mão de um pouquinho dos seus pertences para provar o seu desapego."
42185-82 = "(Hmm~ essa conversa tá ficando meio suspeita...)"
42185-86 = "...Área limpa. A plataforma no sentido de subida também foi liberada."
42185-87 = "Muito obrigada a todos do Departamento de Segurança Pública.#nGraças a vocês, chegamos à plataforma em segurança e sem ferimentos."
42185-88 = "Que nada! Esta oficial apenas conteve os passageiros baderneiros que estavam causando transtornos na estação."
42185-89 = "Na verdade, eu é que agradeço pela colaboração com o nosso serviço!"
42185-90 = "...A habilidade em CQB que você demonstrou hoje, Kirino-san, foi realmente impressionante."
42185-91 = "C-CQB...?#nNão me lembro de ter aprendido isso..."
42185-92 = "Com as entradas e saídas bloqueadas, identificar rotas rapidamente#ne realizar uma emboscada antes que o alvo reaja é o básico do CQB."
42185-93 = "Já venho pensando nisso há algum tempo, mas acredito que a sua capacidade de resposta, Kirino-san, supera a de qualquer membro da SRT."
42185-94 = "Então não era mentira o que dizem sobre o Departamento de Segurança Pública chegar à cena do crime mais rápido do que qualquer um."
42185-96 = "S-Sério mesmo...?"
42185-97 = "Na verdade, esta oficial só queria terminar a patrulha logo para ir comer algo gostoso..."
42185-101 = "..."
42185-102 = "...Bem, mas mesmo assim!#nComo integrante do Departamento de Segurança Pública, tenho o meu devido orgulho!"
42185-104 = "Sim. Como moradora do parque, estou sempre em dívida com vocês."
42185-105 = "Sendo assim... conto com vocês daqui em diante."
42185-107 = "Sim!"
42185-109 = "Próximo;Abismo"
