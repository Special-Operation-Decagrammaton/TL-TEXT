[translation]
42185-3 = "Кто эти люди? Как они так перемещаются? Откуда они вообще берутся?"
42185-4 = "У нас должны быть полные чертежи станции. Неужели есть какой-то тайный маршрут, о котором знают только они?"
42185-5 = ""
42185-7 = ""
42185-8 = ""
42185-10 = "Точно!"
42185-11 = "Когда она успела...?!"
42185-12 = ""
42185-21 = "Старые станции вроде Коусаги пережили множество реконструкций, поэтому здесь полно забытых закоулков."
42185-22 = "Такие места часто становятся рассадниками сомнительной активности, так что студенты Бюро общественной безопасности естественным образом отлично изучают местность. Просто не думала, что нам придётся использовать эти знания вот так."
42185-23 = ""
42185-26 = "О, Фубуки! У нас противники — то есть нарушители правил перевозки — направляются на второй этаж!"
42185-28 = "Ага-ага. Я их вижу."
42185-29 = "Они решили сократить путь по эскалатору? Рискованный ход..."
42185-30 = ""
42185-32 = ""
42185-34 = "Ах вы мелкие засранцы! Вот только догоним!"
42185-36 = "О, кстати, предупреждаю: эти эскалаторы древние."
42185-37 = ""
42185-39 = ""
42185-40 = "Пожалуйста, будьте готовы к внезапной остановке. Спасибо!"
42185-41 = ""
42185-43 = ""
42185-44 = ""
42185-48 = "Ч-что?!"
42185-49 = ""
42185-51 = ""
42185-53 = "Вот почему бегать по эскалатору не рекомендуется. Обычная техника безопасности."
42185-54 = ""
42185-56 = ""
42185-57 = ""
42185-59 = "Чёртовы дети из Бюро общественной безопасности водят нас за нос своими грязными трюками."
42185-60 = "Мы вас всех уделаем!"
42185-61 = "Осторожно!"
42185-62 = ""
42185-65 = ""
42185-75 = "Новички здесь вы, если забыли про противника — Искателей!"
42185-76 = "Даже если на меня смотрят с презрением... Даже если я останусь последним... Наша борьба продолжится!"
42185-77 = "Пока каждый житель Кивотоса не поймёт свободу жизни без бремени работы и собственности!"
42185-79 = "Мир без работы? Уже интересно..."
42185-80 = "Возможно, вас заинтересовала жизнь без собственности? Мы всегда готовы принять новых последователей!"
42185-81 = "...Но вступление в Искатели означает отказ от «некоторых» материальных привязанностей. Желательно в форме наличных."
42185-82 = "(Почему мне кажется, будто меня вербуют в финансовую пирамиду...)"
42185-85 = ""
42185-86 = "...Всё чисто. Северная платформа под контролем."
42185-87 = "Спасибо, Бюро общественной безопасности. Без вашей помощи мы бы не добрались сюда без потерь."
42185-88 = "Обычная работа. Просто следим, чтобы пассажиры и гражданские были в безопасности!"
42185-89 = "Вообще-то, это мы вам должны за помощь в поддержании общественного порядка!"
42185-90 = "Спасибо. Сегодня меня очень впечатлили ваши навыки ближнего боя."
42185-91 = "М-Мои? Я... Я этому вообще никогда не училась..."
42185-92 = "Понимать, как контролировать и сдерживать движения противника в тесном пространстве, — основа ближнего боя. Вы делаете это инстинктивно."
42185-93 = "Я всегда считала, что вы оцениваете ситуацию и реагируете на неё даже лучше многих студентов SRT."
42185-94 = "Вы воплощаете репутацию Бюро общественной безопасности — скорость и эффективность. Именно поэтому вы так меня впечатляете, Кирино."
42185-96 = "Впечатляю? Я...?"
42185-97 = "У меня просто привычка двигаться максимально эффективно, чтобы быстрее закончить патруль и успеть в любимые забегаловки..."
42185-98 = ""
42185-100 = ""
42185-101 = "..."
42185-102 = "...Но, конечно же, я невероятно горжусь своей работой в Бюро общественной безопасности «Валькирии» и отношусь к ней со всей ответственностью!"
42185-104 = "Да, как жители парка, мы вверяем себя вашей заботе."
42185-105 = "Тогда... остальное оставляю вам."
42185-107 = "Поняла!"
42185-109 = "Следующий эпизод; Бездна"
