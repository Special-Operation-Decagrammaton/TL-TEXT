[translation]
10053080-1 = "Эпизод 8;Появление серого пришельца"
10053080-2 = ""
10053080-3 = "Простите, что заставила ждать. У меня есть результаты."
10053080-4 = "...О, а где Коноха?"
10053080-5 = "Она забаррикадировалась в комнате и прячется от «призрака.»"
10053080-6 = "Можешь позвать её? Она успокоится. Это не призрак."
10053080-7 = "Слышала?! Быстро спускайся сюда!!"
10053080-8 = "Не торопи её... Коноха чувствительная, с ней нужно помягче."
10053080-9 = "...Серьёзно?"
10053080-10 = ""
10053080-12 = ""
10053080-13 = ""
10053080-14 = "...Это правда был не призрак?"
10053080-15 = "Сейчас объясню. Все, подойдите и посмотрите на фотографию."
10053080-16 = ""
10053080-18 = ""
10053080-19 = ""
10053080-20 = "..."
10053080-21 = "..."
10053080-22 = "...И? Здесь ничего нет."
10053080-23 = ""
10053080-25 = ""
10053080-26 = ""
10053080-27 = "Сначала я тоже так подумала..."
10053080-28 = "Но посмотрите вот сюда, в угол. Если сильно приблизить между кустами..."
10053080-29 = "Там что-то... бледное?"
10053080-30 = ""
10053080-32 = ""
10053080-33 = "Я сделала этот снимок сразу после того, как Коноха открыла окно. Он немного не в фокусе. Я почему-то... не была готова."
10053080-34 = "Но это оно! Я уверена! Это тот самый распространённый «фактор X»! Оно наблюдало за нами и создавало все проблемы!"
10053080-35 = "И, естественно, мы можем сделать лишь один вывод: это..."
10053080-37 = "Серый!"
10053080-38 = ""
10053080-40 = ""
10053080-41 = ""
10053080-42 = ""
10053080-43 = "Знаешь, мне кажется, он скорее... цвета слоновой кости? Белый?"
10053080-44 = "Не «серый» как цвет. Это вид пришельцев."
10053080-45 = "Цубаса, почему ты так уверена, что это Серый?"
10053080-46 = ""
10053080-48 = ""
10053080-49 = ""
10053080-50 = "Я понимаю, звучит маловероятно, но выслушайте."
10053080-51 = "Подумайте. Посреди ночи кто-то наблюдал за нами снаружи через окно. Это классический предвестник похищения пришельцами."
10053080-52 = "Большинство похищенных рассказывают, что чувствовали, будто за ними «наблюдают», ещё до встречи с пришельцами. Ничего не напоминает?"
10053080-53 = "А ПОХОЖЕ это на параноидальный бред."
10053080-54 = "Не думаю, если мы все видели одно и то же. Сенсей тоже видел."
10053080-55 = "...Верно, Сенсей?"
10053080-56 = "[s1] «Не уверен, что это был пришелец...»\n[s2] «Но кто-то там точно был.»"
10053080-59 = "А как насчёт «массовой истерии»?"
10053080-60 = "Она не объясняет фотографию. Это неопровержимое доказательство. Явно не блик объектива и не шум."
10053080-61 = "Я хотела бы предложить ещё одну гипотезу."
10053080-62 = "Пришельцы способны двигаться с гиперзвуковой скоростью, причём бесшумно. Про НЛО обычно говорят, что они летают, не издавая ни звука."
10053080-63 = "...То есть ты хочешь сказать, что пришелец наблюдал за нами, а когда мы открыли окно, молниеносно убежал?"
10053080-64 = "И из-за их «инопланетных технологий» мы ничего не услышали?"
10053080-65 = "...Другого объяснения нет."
10053080-67 = "Ещё как есть! Ты делаешь дикие логические скачки."
10053080-68 = "Сначала ты говорила, что Цучиноко — разведывательный дрон пришельцев! Но если у них есть змеиный дрон-разведчик, зачем им лично приходить и подглядывать за нами? Где логика?!"
10053080-69 = ""
10053080-71 = ""
10053080-72 = ""
10053080-73 = "Фух. Главное, что это не призрак."
10053080-74 = ""
10053080-76 = ""
10053080-77 = "Вот это всё, что её волнует?"
10053080-78 = "Конечно, но вспомните всё, через что мы прошли. Всё было сверхъестественным. Ничего не имело рационального объяснения."
10053080-79 = "Вместо того чтобы делать вид, будто всё это совпадение, разве не реалистичнее предположить, что у всего есть общая причина?"
10053080-80 = "В этом есть смысл..."
10053080-81 = ""
10053080-83 = ""
10053080-84 = "Нет! Я всё равно не верю! Пока сама не увижу пришельца своими глазами, не поверю!"
10053080-85 = "Вы ведь на моей стороне, Сенсей?"
10053080-86 = "[ns3] «Для начала, если кто-то был снаружи домика...»\n[ns4] «Разве не стоит сообщить об этом в Валькирию?»"
10053080-89 = ""
10053080-90 = "Верно. Кто бы или ЧТО бы это ни было, оно опасно."
10053080-91 = "Подождите. Если вы сообщите, Генеральный студсовет может всё замять! Как они уже делали со всеми остальными НЛО!"
10053080-92 = "С меня хватит твоих параноидальных теорий заговора! Я звоню!"
10053080-93 = ""
10053080-95 = ""
10053080-96 = "..."
10053080-97 = ""
10053080-99 = ""
10053080-100 = ""
10053080-101 = "Гудка нет. Телефон вообще подключён?"
10053080-102 = "Провод выглядит целым."
10053080-103 = "Тогда почему...?"
10053080-104 = ""
10053080-106 = ""
10053080-107 = ""
10053080-108 = ""
10053080-109 = "Неужели?!"
10053080-110 = ""
10053080-112 = ""
10053080-114 = ""
10053080-115 = ""
10053080-116 = "...Как я и думала. Согласно моим расчётам, это худший возможный сценарий."
10053080-117 = ""
10053080-120 = ""
10053080-121 = "Что у вас там, директор?"
10053080-122 = "Телефонная линия."
10053080-123 = "Точнее... ПЕРЕРЕЗАННАЯ телефонная линия."
10053080-124 = "...Что?"
10053080-125 = "Телефон был нашей единственной связью с внешним миром... Если они добрались и до него... Тогда...!"
10053080-126 = ""
10053080-128 = ""
10053080-133 = ""
10053080-134 = ""
10053080-135 = "Как я и думала. Мы опоздали."
10053080-136 = ""
10053080-139 = ""
10053080-140 = "Что?! Несколько часов назад всё было нормально!"
10053080-141 = "Что случилось с мостом?"
10053080-142 = ""
10053080-144 = ""
10053080-145 = "Все успокойтесь и послушайте."
10053080-146 = "По моей теории, этот мост намеренно разрушили."
10053080-147 = "Скорее всего, тот же человек, который перерезал телефонную линию... и тот же, кто наблюдает за нами."
10053080-148 = "Они пытаются держать нас в изоляции."
10053080-149 = "Кто?! Зачем?! Зачем им это делать?!"
10053080-150 = "...Потому что мы ищем Цучиноко."
10053080-151 = "Если Цучиноко — разведывательный дрон, то мы, Экспедиционная группа X, — главная угроза для пришельцев!"
10053080-152 = "Возможно, мы подобрались к раскрытию ИСТИНЫ о Цучиноко ближе, чем кто-либо до нас!"
10053080-153 = "Цубаса, хватит нести чушь, будь серьёзнее!"
10053080-155 = "Ч-Что происходит? Почему так ярко?!"
10053080-156 = "Это НЛО! Оно здесь!"
10053080-157 = "О-Они и правда пришельцы...?"
10053080-159 = ""
10053080-160 = "...Подождите. Стоп. Я уже такое видела."
10053080-161 = "Это сигнальная ракета."
10053080-162 = "Хм?"
10053080-164 = ""
10053080-165 = "Да-а-а! Похоже, заместитель директора и правда суеверная трусиха!"
10053080-166 = "Давайте, народ! Пора отплатить им!"
10053080-167 = ""
10053080-170 = ""
10053080-171 = "Что происходит?"
10053080-172 = "Они... не похожи на пришельцев."
10053080-173 = "Конечно нет! Что нам делать?!"
10053080-174 = ""
10053080-176 = ""
10053080-177 = ""
10053080-178 = "...Ага. Наконец-то хоть что-то, что я понимаю."
10053080-179 = ""
10053080-181 = ""
10053080-182 = "ПОРА ВЫНЕСТИ МУСОР!!"
