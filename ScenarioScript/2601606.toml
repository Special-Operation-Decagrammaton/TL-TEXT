[translation]
2601606-1 = "Без коммерции и переделок."
2601606-2 = "И в завершение специального выпуска..."
2601606-3 = "Мне нужно лишь немного пикантного материала о вас, Сенсей!"
2601606-4 = ""
2601606-6 = ""
2601606-7 = "[ns] «Так и знал, что ты к этому клонишь!»"
2601606-8 = "Нет-нет-нет! Я бы не сказала, что это главная цель. Интервью — всего лишь часть процесса!"
2601606-9 = "Ну что, произошло в последнее время что-нибудь интересное? Может, у вас намечается роман?"
2601606-10 = "Или можете позволить мне сфотографировать вас в какой-нибудь странной позе! Подойдёт что угодно!"
2601606-11 = "[s] «Обычной, спокойной статьи более чем достаточно!»"
2601606-12 = "Но специальному выпуску нужна хоть капелька остроты, чтобы было интересно!"
2601606-13 = "Уф. Ладно."
2601606-14 = "[s1] «Я пока займусь делами, которые принёс с собой, а ты заканчивай вычитку, Чиаки».\n[s2] «И никакого компромата на меня!»"
2601606-17 = "Да вы же ничего не потеряете!"
2601606-18 = "[s] «Ещё как потеряю!! Репутацию! Достоинство! И всё такое!»"
2601606-19 = "А-ха-ха!"
2601606-22 = "Я занялся работой на ноутбуке, которую взял с собой."
2601606-23 = "Рядом сидела Чиаки, надув щёки и пристально глядя на меня."
2601606-24 = ""
2601606-26 = ""
2601606-27 = ""
2601606-29 = ""
2601606-30 = "Эй, Сенсей? Не хочу мешать, но..."
2601606-31 = "Вы даже рожицы не корчите, пока работаете. Никакого материала!"
2601606-32 = "[s] «Я не позволю тебе сделать из меня сенсацию!»"
2601606-33 = "Тц."
2601606-34 = "Хм..."
2601606-35 = ""
2601606-37 = ""
2601606-38 = "О!"
2601606-39 = ""
2601606-41 = ""
2601606-42 = "А! Сенсей! Я уронила монетку под стол!"
2601606-43 = "Не могли бы вы её поднять? Она укатилась на вашу сторону!"
2601606-44 = "[s3] «Хм? Ладно!»\n[s4] Залезть под стол."
2601606-47 = "Попались!"
2601606-49 = "Оп!"
2601606-52 = "― [log=치아키 수영복]Фу-фу! А вот и момент! Идеальный кадр![/log][wa:1750]"
2601606-55 = "― [log=치아키 수영복]А-ха-ха! Сенсей, вы так забавно свернулись калачиком...[/log][wa:590]"
2601606-57 = "― [log=치아키 수영복]Для обложки — идеальный снимок![/log][wa:60]"
2601606-60 = "― [log=치아키 수영복]Хи-хи![/log][wa:430]"
2601606-62 = "― [log=치아키 수영복]Если сенсации нет, я сама её создам![/log][wa:580]"
2601606-65 = "[ns] «Ч-чиаки?! Погоди, а где монетка?»"
2601606-67 = "― [log=치아키 수영복]Ц-ц-ц-ц-ц! Какой же вы наивный![/log][wa:2800]"
2601606-69 = "― [log=치아키 수영복]На самом деле я уронила вот эту крышечку от бутылки![/log][wa:1080]"
2601606-72 = "― [log=치아키 수영복]Буквально подстроила редкий кадр, не потратив ни гроша![/log][wa:300]"
2601606-75 = "― [log=치아키 수영복]Скучный Сенсей приговаривается к заточению под столом![/log][wa:2860]"
2601606-78 = "― [log=치아키 수영복]Может, я вас выпущу, если вы расскажете[/log][wa:560]"
2601606-80 = "― [log=치아키 수영복]какой-нибудь интересный секрет.[/log][wa:2640]"
2601606-83 = "― [log=치아키 수영복]Хм? Вы в порядке?[/log][wa:600]"
2601606-85 = "― [log=치아키 수영복]Почему вы на меня не смотрите...?[/log]"
2601606-88 = "[ns] «Я СОВЕРШЕННО не знаю, куда сейчас смотреть!»"
2601606-90 = "― [log=치아키 수영복]Мы же берём интервью![/log][wa:210]"
2601606-92 = "― [log=치아키 수영복]Вы должны смотреть на меня![/log]"
2601606-95 = "― [log=치아키 수영복]Почему не хотите смотреть?[/log]"
2601606-98 = "― [log=치아키 수영복]А! Это же...![/log][wa:1180]"
2601606-101 = "― [log=치아키 수영복]Кья-а-а![/log][wa:4430]"
2601606-103 = "― [log=치아키 수영복]Н-не смотрите![/log][wa:570]"
2601606-106 = "― [log=치아키 수영복]Не вылезайте![/log][wa:720]"
2601606-108 = "― [log=치아키 수영복]Сидите там![/log]"
2601606-111 = "Я застрял под столом, пока не стало безопасно вылезать."
2601606-112 = "После этого Чиаки вдруг вспомнила о каком-то срочном деле и поспешила уйти."
