[translation]
1000309-1 = "Внезапная встреча с фанатами"
1000309-2 = "Перед ареной Кивотоса"
1000309-3 = "Я купила всё необходимое. Так..."
1000309-5 = "Хм? Что там за огромная толпа?"
1000309-6 = "Сенсей, смотри! Это Пероро!"
1000309-7 = "И Wavecat с Pinky-Paca тоже! Кажется, там кукольное представление!"
1000309-8 = "Никогда бы не подумала, что увижу кукольное шоу Momo Friends в таком месте..."
1000309-9 = "С-Сенсей! Можно посмотреть представление перед уходом?"
1000309-10 = "[s] «Я не против.»"
1000309-11 = "Вы лучший, Сенсей!"
1000309-12 = "Сенсей, смотри! Злодей промыл мозги Angry Adelie, и теперь они собираются напасть на Пероро!"
1000309-13 = "Берегись, Пероро!"
1000309-15 = "*вздох* Это было потрясающе!"
1000309-16 = "У меня ладони вспотели, когда Пероро победил злодея своими фирменными облизываниями и фразой: «Пероперо!»"
1000309-17 = "Я увидела Пероро вживую, собственными глазами... Это самый счастливый день в моей жизни!"
1000309-18 = ""
1000309-20 = "Подожди... Они что, собираются на бис или что-то вроде того?"
1000309-21 = "Очередь на встречу с Пероро начинается здесь!"
1000309-22 = "Шанс встретить САМОГО Пероро!"
1000309-23 = "Я смогу сама коснуться этих пушистых крыльев..."
1000309-24 = "[s] «Почему бы не встать в очередь?»"
1000309-25 = "Ахаха... Было бы здорово, но мне будет ужасно неловко."
1000309-26 = "Почти все в очереди — маленькие дети. Если я встану туда в моём возрасте, буду выглядеть странно..."
1000309-27 = "Мне и кукольного представления хватило."
1000309-28 = "[s] «Если Пероро — твоя настоящая любовь, какая разница, что думают другие?»"
1000309-29 = "Настоящая любовь...!"
1000309-30 = "Ты прав. Если я не пойду, будет ощущение, будто я предала Пероро."
1000309-31 = ""
1000309-32 = "Пойдём в очередь, Сенсей!"
1000309-33 = "[s] «И меня с собой зовёшь?»"
1000309-34 = "Конечно! Не каждый день выпадает возможность встретиться с Пероро!"
1000309-35 = "Обещаю, он будет пушистым и прекрасно пахнуть!"
1000309-37 = "Я встал в очередь вместе с Хифуми и пожал руку кукле Пероро."
1000309-38 = "Почему-то крылья куклы пахли жареной курицей..."
