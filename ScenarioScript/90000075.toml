[translation]
90000075-2 = "Все в порядке?"
90000075-3 = "Что это было, Президент?"
90000075-4 = "Я тоже впервые такое увидела. Скорее всего это..."
90000075-5 = "Новый, неизвестный до сих пор, пророк Декаграматона."
90000075-6 = "Так и думала. Он появился так внезапно..."
90000075-7 = "Хорошо, что мы смогли безопасно отступить. Но его поведение отличалось от других пророков."
90000075-8 = "Я знаю такое поведение. Он что-то охранял."
90000075-9 = "А значит..."
90000075-10 = "Там действительно находится Декаграмматон? Может, этот новый пророк как раз его и защищает?"
90000075-11 = "Хм..."
90000075-12 = "Нужно просто всё самим разузнать."
90000075-13 = "Теперь наша миссия перешла в новую фазу."
90000075-14 = "Может ли в затопленном районе быть нечто, что охраняет пророк и чего нам не следует видеть?"
90000075-15 = "Придётся это выяснить."
90000075-17 = "Да, Президент. Эта миссия будет намного сложнее прежних."
90000075-18 = "Согласна. Нужно тщательно прочесать затопленный район."
90000075-19 = "Мне всё равно, попытается ли пророк нас остановить. Никто не удержит меня от того, чего я хочу."
90000075-21 = "Следующий Эпизод;Поисковая Операция"
