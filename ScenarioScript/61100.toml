[translation]
61100-1 = "Эпизод 10;Шрамы и то, что осталось"
61100-2 = "Я хотела бы поговорить с вами о некоторых вещах... пожалуйста."
61100-3 = "[s1] «Конечно. Хочешь чего-нибудь выпить?»\n[s2] «Правда, у меня есть только молочный чай в бутылке и ячменный чай.»"
61100-6 = "Да, пожалуйста... Любой подойдёт."
61100-8 = "Некоторое время мы молча сидели, потягивая напитки из бутылок и отдыхая после дня."
61100-9 = "Саори была напряжена, и было видно, что у неё многое на уме."
61100-10 = ""
61100-11 = "[ns] «Кстати, сегодняшний урок у тебя был потрясающий.»"
61100-12 = "П-Правда?"
61100-13 = "...Даже вы не думаете, что смогли бы провести его так же хорошо?"
61100-14 = "Слишком много похвалы немного смущает, Сенсей."
61100-15 = "...Вы серьёзно? Вы действительно знали, что не ошиблись, попросив нас?"
61100-16 = "О. Эм..."
61100-17 = "Раньше я обучала их всех. Как инструктор по подготовке."
61100-18 = "Но этот опыт... заставляет меня хотеть учиться ещё усерднее."
61100-19 = "Хм? Преподавание само по себе тоже форма учёбы?"
61100-20 = "Пожалуй, чтобы научить кого-то, нужно самому по-настоящему глубоко понимать предмет."
61100-21 = "Фу-фу. Согласна. Когда я начала объяснять, будто туман рассеялся."
61100-22 = "И... Хм? Есть что-то ещё?"
61100-23 = "[s] «Я постоянно узнаю от каждой из вас всё больше и больше.»"
61100-24 = "Чему... мы вообще можем вас научить?"
61100-25 = "Разве работа учителя не состоит в том, чтобы направлять тех, у кого меньше опыта?"
61100-26 = "[s] «Как бы ни казалось, мне самому тоже ещё очень не хватает опыта.»"
61100-27 = ""
61100-30 = "[ns3] «С возрастом многое теряешь.»\n[ns4] «Но благодаря студентам я могу научиться всему заново.»"
61100-33 = "П... понятно..."
61100-34 = "Мне трудно это понять."
61100-35 = "...Но однажды я пойму?"
61100-36 = "Иногда, Сенсей..."
61100-37 = "Вы говорите немного как... старикан."
61100-38 = "[s] «Гх! А-а! *кашляет* *кашляет*»"
61100-39 = "Вы в порядке, Сенсей?! Подавились? Вам плохо?"
61100-40 = "Н-Нет? Это было отчаяние человека, которого заставили взглянуть в лицо неопровержимой истине?"
61100-41 = "М-Мне не стоило использовать это слово? Я впервые..."
61100-42 = "Однажды случайно услышала, как кто-то так сказал, и захотела попробовать."
61100-43 = "[s5] «Нет-нет. В твоих словах не было ничего плохого.»\n[s6] «Кого ещё в Кивотосе считать „стариканом“, если не „Сенсея из Шале“?»"
61100-46 = "Я... правда прошу прощения! Даже если вы меня простите, я..."
61100-47 = "Я..."
61100-48 = "..."
61100-49 = ""
61100-50 = "Лицо Саори помрачнело, и её голос медленно затих."
61100-51 = "Я терпеливо ждал, пока она подберёт слова, а она ещё несколько раз отпила из бутылки."
61100-52 = "Сенсей."
61100-53 = "Простите. Снова. За другое."
61100-54 = "...Фу-фу. Возможно, все эти извинения уже мешают донести мои настоящие намерения."
61100-55 = "Так мы рискуем повторить круиз. Бесконечная карусель извинений, которая никуда не приводит."
61100-56 = "*вздыхает*"
61100-57 = "Простите, если мой следующий вопрос прозвучит грубо, Сенсей."
61100-58 = "Надеюсь, я не покажусь невежливой."
61100-59 = "Это лишь результат моей решимости встретиться лицом к лицу со своими преступлениями."
61100-60 = "Вернувшись сюда, я кое-что поняла."
61100-61 = "Я ни разу перед вами не извинилась. Ни единого раза."
61100-62 = "[s7] «Я совершенно серьёзно говорю, что всё хорошо, Саори.»\n[s8] «Я понял, что ты хотела сказать раньше, поэтому и сменил тему.»"
61100-65 = "Тогда...?"
61100-66 = ""
61100-67 = "Просто... возвращение сюда..."
61100-68 = "...во многих смыслах пробуждает слишком много воспоминаний."
61100-69 = "..."
61100-70 = "С-Сенсей?"
61100-71 = "..."
61100-72 = "Я всё ещё как следует перед вами не извинилась, Сенсей..."
61100-73 = "[log]А! Чуть не забыл! Насчёт переведённых студентов![/log]"
61100-76 = ""
61100-77 = "А... Тогда это и правда показалось внезапным. Я просто не поняла, что причина была в этом."
61100-78 = "Однако..."
61100-79 = "Можете немного потерпеть мою прихоть, Сенсей? Я понимаю, что веду себя эгоистично."
61100-80 = "В последнее время мне кажется, будто я застряла в том моменте. Словно прошлое держит меня там и требует найти смелость встретиться с ним лицом к лицу."
61100-81 = "Если я не смогу сделать это здесь, где всё началось... не знаю, смогу ли когда-нибудь вернуться к тем детям."
61100-82 = "Я так и останусь барахтаться в этой жиже сожаления и вины."
61100-83 = "[s] «Понял. Тогда сделаем это вместе.»"
61100-84 = "Хм..."
61100-85 = "Что ж..."
61100-86 = ""
61100-88 = ""
61100-89 = "Можете показать мне свой живот, Сенсей?"
61100-90 = "[s9] «?!?!?!?!»\n[s10] «Саори?!?!»"
61100-93 = "Я понимаю, как это звучит! Но я совсем не это имею в виду!"
61100-94 = "На этот раз я даже попыталась сначала дать контекст..."
61100-95 = "..."
61100-96 = "Я..."
61100-97 = "Я хочу... мне нужно увидеть это собственными глазами, Сенсей. Ваш шрам. Следы, оставшиеся на вас."
61100-98 = "[ns] «...!»"
61100-100 = "Наконец я поняла, к чему Саори всё это вела."
61100-101 = "Поэтому, хорошо это было или нет, я выполнил её просьбу и приподнял рубашку."
61100-102 = ""
61100-103 = "Ах..."
61100-104 = "Это..."
61100-105 = "..."
61100-108 = "Саори протянула руку и кончиками пальцев осторожно провела по выпуклым краям моего шрама."
61100-109 = "Её рука дрожала так сильно, что я чувствовал это кожей, даже не глядя."
61100-111 = "Я... простите..."
61100-112 = "Сенсей, я..."
61100-113 = "...простите..."
61100-114 = "Простите. Мне просто так..."
61100-115 = "Простите. Простите. Мне так жаль."
61100-116 = "Я... Ч-Что мне делать? Как всё исправить? Как мне это исправить?"
61100-117 = "Сенсей..."
61100-118 = "Наш Сенсей..."
61100-119 = "Как могла... такая, как я...?"
61100-120 = "Как я могла...?"
61100-121 = "Угх..."
61100-122 = "Нгх..."
61100-123 = "*всхлипывает* Я... *всхлипывает* А-а...!"
61100-125 = "Саори рухнула на землю, словно её придавило тяжестью собственной вины."
61100-126 = "Медленно и осторожно я положил руки ей на плечи."
61100-127 = ""
61100-128 = "[ns] «Эй. Всё в порядке.»"
61100-129 = "Сэн... сэй?"
61100-130 = "[s11] «Ты сама видела. Я выздоровел. Со мной всё хорошо.»\n[s12] «Мне не больно. Обещаю. Совсем не больно.»"
61100-133 = "Н-Неважно!"
61100-134 = "Я оставила на вас шрам! Он всё ещё здесь! И останется навсегда!"
61100-135 = "Я это знаю! По крайней мере это я уже поняла, Сенсей!"
61100-136 = "Это последствия моих поступков! Что бы я ни делала, совершённое мной оставило раны, которые уже никогда, никогда по-настоящему не заживут!"
61100-137 = "Шрамы самого моего существования разлетелись шипами и ранили всё и всех вокруг! Я никогда не смогу стереть эти следы! Ни вчера, ни сейчас, ни когда-либо!"
61100-138 = "Если всё так, тогда лучше бы я..."
61100-139 = "Лучше бы я... была..."
61100-140 = "[s13] «Никогда больше так не говори.»\n[s14] «Мне невыносимо слышать такие печальные слова от собственного студента.»"
61100-143 = "Сенсей...?"
61100-144 = "[s15] «Я не могу тебе лгать, Саори.»\n[s16] «Есть раны, которые никогда не заживут.»"
61100-147 = "Ух...!"
61100-148 = "[s17] «Но люди удивительны: даже с такими шрамами...»\n[s18] «...мы остаёмся поразительно сильными. Мы несём их и продолжаем жить. Вместе.»"
61100-151 = "...Несём их с собой? Вместе?"
61100-152 = "..."
61100-153 = "Вот как... люди должны жить...?"
61100-154 = "Но..."
61100-155 = "Я всё равно не знаю. Правда не знаю..."
61100-156 = "Единственное, чему я научилась... это тому, что я вообще ничего не знаю."
61100-157 = "Я искренне верила, что если смогу встретиться лицом к лицу с тем, что сделала, то наконец смогу двигаться дальше."
61100-158 = "Я обманывала себя мыслью, что, увидев это собственными глазами, смогу простить себя."
61100-159 = "Но всё это..."
61100-160 = "Это была всего лишь моя самонадеянность, верно?"
61100-161 = "[s] «Эй, Саори.»"
61100-162 = "...Да?"
61100-163 = "[s19] «Если бы ты могла вернуться в прошлое, к Саори тех времён...»\n[s20] «Что бы ты ей сказала?»"
61100-166 = ""
61100-168 = ""
61100-172 = ""
61100-173 = "..."
61100-174 = "Фу-фу."
61100-175 = "Как странно."
61100-176 = "Я много раз об этом думала."
61100-177 = "..."
61100-178 = "И каждый раз меня переполняло сожаление."
61100-179 = "Я ненавидела ту глупую девчонку, которая не задумываясь ранила других и совершала преступления."
61100-180 = "Не думая о последствиях своих поступков и почти не заботясь о жизнях, которые разрушит."
61100-181 = "Я хотела бы поговорить с той девчонкой."
61100-182 = "...После того как хотя бы раз влепила бы ей пощёчину."
61100-183 = "Я бы спросила, понимает ли она всю тяжесть того, что собирается сделать."
61100-184 = "Я бы трясла её, пока она не пришла бы в себя, пока не увидела бы, насколько тёмная и пустынная дорога лежит перед ней."
61100-185 = "..."
61100-186 = "Но теперь это невозможно."
61100-187 = "Той девчонки больше нет. Осталась только я. Я, пытающаяся понять те самые последствия, которые она так эгоистично игнорировала."
61100-188 = "Раз я не могу вернуться назад, мне остаётся только продолжать путь, на который она нас вывела. И пытаться как-то всё исправить."
61100-189 = "Вот и всё."
61100-190 = "..."
61100-191 = "Да. Вот и всё."
61100-192 = "[s] «И этого более чем достаточно, Саори.»"
61100-193 = "Сенсей...?"
61100-194 = "[ns] «Ты слышишь меня, Саори? Этого достаточно.»"
61100-196 = "[ns] «Даже если весь мир будет указывать на тебя пальцем—»"
61100-197 = "Значит, вы всё-таки считаете меня виновной...?"
61100-198 = "[s21] «Дай мне договорить!»\n[s22] «Я совсем не это пытаюсь сказать!»"
61100-201 = "...Если в следующий раз я смогу сделать лучший выбор..."
61100-202 = "...и если я достаточно выросла, чтобы в следующий раз остановиться и подумать прежде, чем действовать, для вас этого достаточно?"
61100-203 = "Если я смогу вам это пообещать, вы будете рядом..."
61100-204 = "...столько раз, сколько понадобится?"
61100-205 = "У-ух..."
61100-209 = "Саори рыдала, выплёскивая наружу все свои чувства и всю вину."
61100-210 = "Я гладил её по спине и успокаивал, пока рыдания не превратились в тихое шмыганье носом и икоту."
61100-212 = "Знаете, здесь, в Ариусе, что-то изменилось."
61100-213 = "[s] «Хм? Что изменилось?»"
61100-214 = "Эм."
61100-215 = "Первый урок помог немного снять напряжение."
61100-216 = "И мы смогли поговорить друг с другом."
61100-217 = "Качество их жизни улучшилось."
61100-218 = "Теперь Время воды превратилось в более спокойное чаепитие, и они получают три нормальных приёма пищи в день."
61100-219 = "Конечно, весь район по-прежнему в ужасном состоянии, но..."
61100-220 = "Деньги и припасы начали хоть немного циркулировать."
61100-221 = "Хотя я всё ещё не понимаю, откуда всё это берётся."
61100-222 = "Как бы то ни было, в Ариусе что-то сдвинулось."
61100-223 = "...Наверное, это и неудивительно."
61100-224 = "В этом мире ничто не остаётся совершенно неизменным навсегда."
61100-225 = "[s] «Эти перемены тебя тревожат?»"
61100-226 = "Я пока не знаю, как назвать это чувство."
61100-227 = "Могу сказать только одно: приятно видеть, что их жизнь стала лучше, пусть даже совсем немного."
61100-228 = "..."
61100-229 = "Сенсей."
61100-230 = "Как думаете... для нас тоже есть надежда?"
61100-231 = "[s23] «Отсюда мы можем начать строить.»\n[s24] «Когда кладёшь кирпичи один за другим, кажется, что конца не будет.»\n[s25] «Но все эти маленькие усилия складываются в целое здание.»"
61100-235 = "...Понятно."
61100-236 = "Я благодарна судьбе за то, что мы встретили вас, Сенсей."
61100-237 = "Нам невероятно повезло, что вы всё это время были рядом..."
61100-238 = "Без вас я..."
61100-239 = "Вообще-то, наверное, все мы бы..."
61100-240 = ""
61100-242 = ""
61100-243 = "Сенсей, это всего лишь предположение, но у меня есть вопрос."
61100-244 = "..."
61100-245 = "Можно мне... сегодня спать здесь вместе с вами?"
61100-246 = "[s] «?!?!»"
61100-247 = "Не смотрите ТАК потрясённо, Сенсей. Я просто пошутила."
61100-248 = "[s] «Когда человек, который никогда не шутит, внезапно выдаёт шутку, это немного шокирует...»"
61100-249 = "Понимаю. Запомню на будущее."
61100-250 = "[s] «Я полностью опозорился, да?»"
61100-251 = "Фу-фу. Кто знает?"
61100-252 = "Ну, меня и не сказать чтобы ждёт самая удобная комната."
61100-253 = "Но всё равно стоит вернуться туда. Спокойной ночи, Сенсей."
61100-254 = "[s] «Спокойной ночи, Саори.»"
61100-258 = "Саори закрыла дверь, на мгновение замерла и прислонилась к ней."
61100-259 = "Я ведь сказала, что просто шутила."
61100-260 = "Хотя какая-то часть меня, возможно, говорила серьёзно."
61100-261 = "Фу-фу."
61100-262 = "Спокойной ночи, Сенсей."
61100-267 = "Э-Эм, Субару? Ты спишь...?"
61100-268 = ""
61100-270 = ""
61100-271 = "О, Майя. Нет, не сплю. Заходи."
61100-272 = "Всё нормально! Эм, я просто решила проверить..."
61100-273 = "О-хо? Решила, что я сижу здесь, зализываю гордость и дуюсь после поражения от отряда и Сенсея?"
61100-274 = "Н-Н-Н-Нет конечно! Совсем не поэтому! Я точно, совершенно точно так не думала, Субару!"
61100-275 = "Не волнуйся... Я понимаю, почему ты могла так подумать..."
61100-276 = "Я СКАЗАЛА, дело не в этом!"
61100-277 = "А-ха-ха. Прости, Майя. Я просто поддразниваю. Не о чем волноваться, хорошо?"
61100-278 = "П-Правда...?"
61100-279 = "Правда. Может, сейчас не лучшее время об этом говорить, но..."
61100-281 = "Ненависть Ариуса так просто не утолить."
61100-282 = "А...!!"
61100-283 = "Кстати, тебе сегодня было весело?"
61100-284 = "На уроке? Эм... Ну..."
61100-285 = "А-А тебе, Субару?"
61100-286 = "Эй, мы же это обсуждали. Мы никуда не продвинемся, если ты всегда отвечаешь вопросом на вопрос."
61100-287 = "П-Прости, Субару!"
61100-288 = "Мне трудно сказать..."
61100-289 = "Я никогда раньше не испытывала ничего подобного. Слишком много всего происходило одновременно."
61100-290 = "Но..."
61100-291 = "Но по-своему это было очень здорово."
61100-299 = "Прямо как: «Ого! Так вот как всё работает снаружи»."
61100-302 = "И я поняла... насколько раздельными были наши два мира."
61100-303 = ""
61100-308 = "Хотя нет, не совсем так."
61100-309 = "Они и сейчас остаются двумя совершенно разными мирами."
61100-310 = "...Не могу этого отрицать."
61100-311 = "Но здесь всё равно многое изменилось."
61100-312 = "Самое главное — теперь еды хватает всем. Так что по-своему мы всё-таки сделали шаг вперёд."
61100-313 = "Угу! Это самое лучшее во всём этом!"
61100-314 = "Я-Я как раз... хотела кое-что спросить..."
61100-315 = "Вся эта еда, закуски и блюда... Они ведь стоят денег?"
61100-316 = "Так откуда...?"
61100-317 = "..."
61100-319 = "Ты точно хочешь знать, Майя?"
61100-320 = "А? Д-Да..."
61100-321 = "Как только узнаешь, пути назад не будет. Есть вещи, которых лучше не знать. Они исказят твоё понимание мира."
61100-322 = "В-Вы серьёзно?!"
61100-323 = "Нет-нет. Шучу, я шучу. Простишь?"
61100-324 = "Субару..."
61100-325 = "Но правда в этом тоже есть. Новые знания меняют твою точку зрения."
61100-326 = "Они формируют то, как ты воспринимаешь определённые обстоятельства. И развидеть их уже не получится."
61100-327 = "...Как сегодняшние уроки Сенсея."
61100-328 = "Субару...?"
61100-329 = "В этом мире без денег ничего не изменить и ничего не сделать."
61100-330 = "Все хотят получить что-то получше, но количество ресурсов в мире ограничено."
61100-336 = "Дефицит порождает конкуренцию, а конкуренция — конфликт."
61100-341 = ""
61100-342 = "По дороге кто-то обязательно остаётся позади. Но общество ни ради кого не останавливается, и однажды все просто забывают, что этот человек вообще существовал. Вот так."
61100-343 = "...Как забыли о нас."
61100-344 = "Слышала? В Кивотосе наш особый набор навыков пользуется очень большим спросом."
61100-345 = "Это такая работа, где только студенты Ариуса обладают совершенно уникальным преимуществом."
61100-346 = "Другими словами, у Ариуса монополия на этом рынке."
61100-347 = "«Такая работа»? «Монополия»? Наше «уникальное преимущество»...?"
61100-348 = ""
61100-350 = ""
61100-351 = "С-Субару?!?"
61100-353 = ""
61100-354 = "Хорошо, ты вернулась. Полагаю, работа сделана?"
61100-355 = ""
61100-357 = ""
61100-358 = "Хм? А это что?"
61100-359 = "П-Пощадите меня! Я сделаю что угодно, только оставьте меня в живых! Пожалуйста, не убивайте!"
61100-360 = "Эм...?!"
61100-361 = "..."
61100-362 = "Объяснись, Субару. Я сказала тебе «разобраться с ним»."
61100-363 = "Считай его подарком. С этого момента он живёт, чтобы служить тебе."
61100-364 = "Если тебе не нравится, я прямо здесь накормлю его свинцом."
61100-365 = "А-А-А! Нет! Пожалуйста! Только не это!"
61100-366 = "...Выглядит он подходяще. Но убрать его будет чище."
61100-367 = "Если я убью его здесь, ты не получишь ничего из его имущества. Оставишь в живых — всё, чем он владеет, станет твоим, вплоть до носков."
61100-368 = "Можете забрать всё, что хотите! Только не убивайте! Я могу быть полезен!"
61100-369 = "Хм... И как ты гарантируешь мою безопасность? Он в любой момент может обернуться против меня."
61100-370 = "Скажи ему, что Ариус у тебя на быстром наборе. Это удержит его в узде."
61100-371 = "Ииик!!"
61100-372 = "Звучит заманчиво, но... ты всего лишь наёмница. Стоит мне отвернуться — ударишь в спину."
61100-373 = "Я не какой-то мелкий преступник, который ищет быстрые деньги. Без репутации наёмник — ничто."
61100-374 = "Мы непредсказуемый элемент в бизнесе, который не любит сюрпризов, поэтому наёмникам приходится быть надёжными, чтобы выжить."
61100-375 = "..."
61100-376 = "Ладно. В этот раз поверю тебе. Хорошая работа."
61100-377 = "Ба-ха-ха-ха! Рынок практически наш!"
61100-378 = "(...Большинство людей почти ничего не знают об Ариусе, а те, кто знает, считают его грязными трущобами.)"
61100-379 = "(Неужели они не понимают, насколько грязен внешний мир, в котором живут сами?)"
61100-380 = ""
61100-381 = "Т-Тогда получается..."
61100-382 = "...ты уже... кого-нибудь убивала...?"
61100-383 = "Пока нет."
61100-384 = "Ф-Фух! Слава богу! Это приятно слышать!"
61100-385 = "Но за... такое действительно платят?"
61100-386 = "Я сама не довожу дело до конца. Просто... подхожу достаточно близко. Обычно этого хватает."
61100-387 = "Часто говорят, что люди не меняются."
61100-388 = "Я поняла, что это неправда."
61100-389 = "Когда человек лицом к лицу встречается со смертью... он меняется. Наверное, это инстинкт. И всегда лотерея — кем он станет в этот последний момент."
61100-390 = "Может, мы тоже изменились. Кто в этом мире живёт ближе к смерти, чем мы?"
61100-392 = "Потому что мы — Ариус."
61100-393 = ""
61100-394 = "Может, это только моё мнение, но деньги... это просто деньги."
61100-395 = "Не существует «чистых» или «грязных» денег. Одна иена всегда остаётся одной иеной. Если бы у меня была роскошь задумываться о таком, я бы считала себя счастливицей."
61100-396 = "Чем дольше я занимаюсь такой работой, тем сильнее чувствую, как она стирает мою душу."
61100-397 = "Когда нападаешь на что-то, похожее на человека, это въедается в голову. Может, люди так эволюционировали, чтобы защищать нас друг от друга."
61100-398 = "Хм? Что я делаю, когда начинаю так себя чувствовать?"
61100-399 = "..."
61100-400 = ""
61100-401 = "Конечно, думаю о каждой из вас."
61100-402 = "Вы — причина, по которой я продолжаю двигаться вперёд."
61100-403 = ""
61100-404 = "...В последнее время меня чаще не бывает рядом, да? Простите."
61100-405 = "Н-Н-Нет! Вовсе нет! Пожалуйста, не извиняйся! Уж кто-кто, а ты не должна извиняться! Ты так усердно работаешь ради нас, Субару..."
61100-406 = "И я рада это делать. Отплатите мне тем, что будете хорошо есть и наслаждаться юностью. Именно это помогает мне продолжать."
61100-407 = "Не все могут быть счастливы. Иначе думают только мечтатели и наивные люди."
61100-408 = "Никто не знает этого лучше нас."
61100-409 = "Поэтому детям Ариуса нужно место, куда можно вернуться. Место, которое они смогут назвать домом."
61100-410 = "Я построю для них такой дом. Здесь."
61100-411 = "Дети, которых выбросили, те, кого общество сочло «бесполезными»... смогут прийти сюда."
61100-412 = "Правда, если все придут сразу, может стать немного тесно!"
61100-413 = "...Как маленькое птичье гнездо, да?"
61100-414 = "Как бы там ни было, именно это гнездо я хочу защитить."
61100-415 = "Тогда все эти птенцы смогут жить здесь, чувствуя себя в безопасности."
61100-416 = "И, может быть, шаг за шагом они научатся тому, каково это — жить."
61100-417 = "Субару..."
61100-418 = "Помнишь Мадам?"
61100-419 = "Уф."
61100-420 = "Ха-ха-ха! Серьёзно. Уф! От одной мысли о тех временах мурашки по коже."
61100-421 = "...Во внешнем мире есть вещи, которых Мадам никогда не делала."
61100-422 = "Вещи, которые ей даже не приходило в голову попробовать."
61100-423 = "Если я проживу жизнь, испытав всё это, то буду довольна."
61100-424 = "А пока... этого достаточно."
61100-425 = "..."
61100-426 = "Субару."
61100-427 = "Ага?"
61100-428 = "Сыграй мне песню!"
61100-429 = "Т-Ты вообще знаешь, сколько сейчас времени? Я уже сегодня играла..."
61100-430 = "Ещё один раз! Пожалуйста? Уверена, остальные тоже услышат и им понравится!"
61100-431 = "Ну и ну... Не понимаю, как вы все такими стали."
61100-432 = "Ладно-ладно. Хорошо."
61100-433 = "Хи-хи..."
61100-434 = ""
61100-440 = ""
61100-444 = ""
61100-450 = ""
61100-451 = "Это губная гармошка? Субару..."
61100-452 = "..."
61100-453 = "Эта совсем не изменилась."
61100-454 = "Хм...?"
61100-455 = ""
61100-457 = ""
61100-458 = "Ч-Что это? Кто там?!"
61100-459 = ""
61100-462 = ""
61100-463 = "Уф!"
61100-467 = "(Кажется, я плыву... в удушающем тумане...)"
61100-468 = "(Но что это...?)"
61100-470 = "Это... труба?"
61100-472 = "Следующий Эпизод;Экскурсия 1"
