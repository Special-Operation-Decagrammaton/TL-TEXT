[translation]
10023055-2 = "Впечатляет, незнакомка."
10023055-3 = "Спасибо, госпожа Воровка. Надеюсь, почтительное обращение немного утихомирит ваш гнев."
10023055-4 = "Хи-хи... Думаешь, что уже поймала меня?"
10023055-5 = ""
10023055-11 = ""
10023055-13 = ""
10023055-16 = ""
10023055-18 = "?! Ловушка?"
10023055-19 = ""
10023055-22 = ""
10023055-23 = ""
10023055-26 = "Кроликам стоит внимательнее смотреть по сторонам, иначе их схватит хищник."
10023055-27 = ""
10023055-29 = ""
10023055-30 = "?!"
10023055-31 = "Думали, что избавились от нас?!"
10023055-32 = "Мы куда сильнее, чем выглядим! Хотя немного опоздали..."
10023055-34 = "О боже. Эти очаровательные горничные — твоё подкрепление?"
10023055-36 = "Очаровательные? Ну... Хи-хи-хи!"
10023055-37 = "Момои! Не позволяй врагу заговорить тебе зубы!"
10023055-38 = "Ты ничего не вынесешь из этого поместья!"
10023055-39 = "Должна признать, ваша смелость впечатляет. Но далеко ли можно зайти на одной смелости?"
10023055-40 = ""
10023055-42 = ""
10023055-44 = ""
10023055-45 = "Вы упустили шанс в тот миг, когда потеряли эффект неожиданности."
10023055-46 = "Ваша храбрость сияет прекрасно, но движения оставляют желать лучшего. Бесцельные. Реактивные."
10023055-48 = "Может, про нас это и правда..."
10023055-50 = "Но хорошо, что твой противник — не мы!"
10023055-51 = "...?"
10023055-52 = ""
10023055-55 = "Слепящий Свет!"
10023055-56 = ""
10023055-57 = ""
10023055-58 = ""
10023055-59 = ""
10023055-60 = "Уф!"
10023055-61 = "Так держать, Арис!"
10023055-62 = "Ой... Эм... Мы ведь не взорвали особняк, правда?"
10023055-63 = "Нет! Я — DPS светлого атрибута по одной цели! Мой Ослепительный Свет фокусируется исключительно на цели!"
10023055-65 = "...!"
10023055-66 = "Значит, они всё ещё могут двигаться. Тогда..."
10023055-68 = ""
10023055-69 = ""
10023055-70 = ""
10023055-71 = ""
10023055-72 = ""
10023055-73 = ""
10023055-75 = "Отсюда я не промахнусь...!"
10023055-76 = "А?!"
10023055-77 = ""
10023055-79 = ""
10023055-80 = ""
10023055-82 = "Сейчас! Хватайте её!"
10023055-83 = "Вперёд, Момои!"
10023055-84 = ""
10023055-87 = ""
10023055-89 = ""
10023055-90 = ""
10023055-91 = "Что?!"
10023055-92 = "А-А-А!"
10023055-93 = "Ч-Что случилось?"
10023055-94 = "Смотрите вверх! Она пробила потолок!"
10023055-96 = "Позвольте мне пересмотреть мою первоначальную оценку."
10023055-97 = "Вы все весьма впечатляющие. Прошу прощения за позднее знакомство, но кто вы?"
10023055-99 = "Я — позывной Ноль-Четыре из C&C. Асума Токи."
10023055-100 = ""
10023055-103 = ""
10023055-104 = "Не может быть... C&C? Во плоти?"
10023055-105 = "По какой причине вы помогаете Мэйтаро?"
10023055-107 = "Н-Ну... Мы получили заказ... а награда была такая большая... хотелось... FlyStation..."
10023055-108 = "...Простите?"
10023055-109 = "Момои! Ты всё это время думала о FlyStation?!"
10023055-110 = "Не слушайте её! Мы просто..."
10023055-111 = "Мы просто хотели остановить воровку!"
10023055-112 = ""
10023055-114 = ""
10023055-115 = "..."
10023055-116 = "[ns] «А ты? Зачем ты крадёшь произведения искусства?»"
10023055-117 = "А это ещё кто?"
10023055-118 = "Ах, можешь не представляться. Твоё лицо мне знакомо..."
10023055-119 = "Ты ведь Сенсей из Шале, верно?"
10023055-120 = "Твоё прибытие в Кивотос как раз совпало с побегом Семи Узников из Исправительного бюро."
10023055-121 = "Да... Понятно."
10023055-122 = "Не думай, что тебе удастся сбежать, Благородный Вор! На этот раз пути к отступлению нет!"
10023055-123 = ""
10023055-125 = ""
10023055-129 = "С-С-Стойте! Не стреляйте! Мы же прямо здесь!"
10023055-130 = "Ай?!"
10023055-131 = ""
10023055-133 = ""
10023055-134 = "Мидори?!"
10023055-137 = "(А...?)"
10023055-138 = "(Я... падаю...?)"
10023055-140 = "Хи-хи!"
10023055-143 = ""
10023055-144 = ""
10023055-146 = "Ого! Благородный Вор спасла Мидори!"
10023055-147 = "Мидори! Мидори! Ты в порядке?!"
10023055-148 = "Д-Да, спасибо. Но зачем она меня спасла?"
10023055-149 = "(Какая у неё могла быть причина...)"
10023055-150 = ""
10023055-152 = ""
10023055-153 = "Теперь я понимаю ситуацию. Как же это захватывающе!"
10023055-154 = "Позвольте оставить вам несколько слов на прощание. Иногда нужно заглянуть за внешнюю оболочку, чтобы увидеть скрытую внутри красоту."
10023055-155 = "С нетерпением жду нашей следующей встречи, C&C."
10023055-156 = ""
10023055-158 = ""
10023055-159 = "Как она так быстро сбежала?!"
10023055-160 = "Это записка на полу?"
10023055-161 = "Это визитная карточка... Тут сказано, что обещание из предыдущей карточки всё ещё будет исполнено."
10023055-162 = "Слишком громкие слова для той, кто только что сбежала!"
10023055-163 = "И это всё. И ещё... Когда она успела это написать? Она что, постоянно носит с собой целую пачку таких карточек?!"
10023055-164 = ""
10023055-166 = ""
10023055-167 = "Наконец-то я вас нашёл. Чем вы вообще тут занимались?"
10023055-168 = "А?! Ну, эм..."
10023055-169 = "[s] «На самом деле всё это было частью секретной отвлекающей операции.»"
10023055-170 = "Сенсей!"
10023055-171 = "Хм... Думаю, вы должны объяснить немного подробнее."
10023055-173 = "Понятно... Значит, ваш пятый участник присоединился позже, как вы и планировали заранее."
10023055-174 = "И вы говорите, что операция почти удалась?"
10023055-175 = "[s] «Простите. В последний момент ей удалось сбежать.»"
10023055-176 = "Не нужно извиняться. Я впечатлён тем, что вам удалось заставить Благородного Вора отступить."
10023055-177 = "Если нам повезёт, возможно, вы отпугнули её навсегда, и мы сможем оставить всё это позади."
10023055-178 = "Я бы не была так уверена..."
10023055-180 = "Мэйтаро, что всё это значит?"
10023055-181 = "Объяснитесь! Если бы я знал, что нападение планирует именно Благородный Вор, я бы ни за что не пришёл."
10023055-182 = "Ну-ну. Пожалуйста, успокойтесь. Всё уже улажено."
10023055-183 = "Оглянитесь. Мы ведь сумели без проблем отбить нападение негодяйки, не так ли?"
10023055-184 = "Я не видел смысла вас тревожить, ведь наши тылы надёжно прикрывали лучшие из лучших — C&C!"
10023055-186 = "C&C? Та самая знаменитая секретная организация с агентами высшего класса?"
10023055-187 = "Полагаю, это объясняет, как им удалось так быстро разобраться с воровкой..."
10023055-189 = "Ещё раз спасибо за вашу работу."
10023055-190 = "Мне придётся откланяться, чтобы помочь гостям добраться до комнат. Думаю, на одну ночь впечатлений уже достаточно."
10023055-191 = ""
10023055-193 = ""
10023055-194 = "А вы пока можете составить план охраны на ближайшие дни. Спокойной ночи."
10023055-196 = ""
10023055-197 = "(Она всё это время не переставала на нас пялиться...!)"
10023055-198 = "..."
10023055-199 = "(С-Сенсей... Как думаете, Токи на нас злится...?)"
10023055-200 = "[ns] «Эй, Токи, давай вместе глубоко вдохнём...»"
10023055-201 = "Да плевать! Можешь сколько угодно смотреть на меня угрожающе! Я-Я не боюсь!"
10023055-202 = "Н-Но ещё спасибо тебе! Ты правда сильно нам помогла, так что я просто хотела поблагодарить!"
10023055-204 = ""
10023055-206 = ""
10023055-207 = "...Теперь понимаю."
10023055-208 = "Спасибо, отдел разработки игр."
10023055-209 = "А? Что?"
10023055-210 = "Какого...?"
10023055-211 = ""
10023055-213 = ""
10023055-214 = "Вы помогли мне, поэтому я благодарю вас. Точно так же, как сделали вы."
10023055-215 = "Но если ты просто хотела нас поблагодарить, зачем так злобно пялилась?!"
10023055-216 = "Ну... Я не знала, что должна говорить в такой ситуации."
10023055-217 = "Ты не сверлила нас взглядом? Ты просто пыталась понять, как поблагодарить?"
10023055-218 = "Да. И я должна ещё раз поблагодарить тебя, Момои. Ты выразила это словами за меня."
10023055-219 = "С этим разобрались. Теперь нужно обсудить текущую ситуацию. Она оказалась сложнее, чем мы предполагали."
10023055-221 = "Теперь понятно. Значит, ты тоже получила задание остановить Благородного Вора."
10023055-222 = "Да. Хотя это было не единственное задание, которое я получила."
10023055-223 = "Т-Ты расскажешь Нэру, что мы испортили твою миссию?"
10023055-224 = "Нет. Более того, до сих пор я считала ваши действия полезными."
10023055-225 = "В дальнейшем мы будем проводить совместную операцию C&C и отдела разработки игр."
10023055-226 = "Правда можно?"
10023055-227 = "Да. Остальных участников всё равно нет рядом, чтобы возразить."
10023055-228 = "Почему мне кажется, что это уже повторяется?!"
10023055-230 = "Потому что так и есть."
10023055-231 = "Получается, теперь мы друзья, Токи?"
10023055-232 = "...?"
10023055-233 = "Пожалуйста, вступи в мою группу! Я хочу, чтобы мы завершили этот квест вместе, как участники одной группы!"
10023055-234 = "Что? Я не..."
10023055-235 = "Ох... Разве нельзя?"
10023055-236 = "Нет... То есть да. Я ведь сказала «в следующий раз», поэтому... Да. Я вступлю в вашу группу."
10023055-237 = "Ура! Теперь мы друзья, Токи. И с отделом разработки игр тоже!"
10023055-238 = "Спасибо, что так сказали."
10023055-239 = "Бам-бам-бам! К группе присоединился новый игрок!"
10023055-240 = ""
10023055-242 = ""
10023055-244 = "*ахает*"
10023055-245 = "П-Пожалуйста, не обнимай меня! Да ещё и без предупреждения...!"
10023055-246 = ""
10023055-247 = ""
10023055-248 = ""
10023055-249 = "(хлоп) (хлоп)"
10023055-250 = "(Её голова идеально подходит по высоте, чтобы гладить. Это странно... приятно.)"
10023055-251 = ""
10023055-252 = ""
10023055-253 = ""
10023055-255 = "Ты правда думаешь, что всё будет нормально, Момои?"
10023055-256 = "Ну... Мы же говорим об Арис, знаешь ли..."
10023055-258 = "Я рада, что Арис смогла достучаться до неё. Ради них обеих — Арис и Токи."
10023055-260 = "Токи стала почётным членом группы и официальным другом отдела разработки игр."
10023055-261 = "И у этих новоиспечённых друзей всё было хорошо и прекрасно."
10023055-263 = "...А может, и нет."
