101080-8 = ""
101080-10 = ""
101080-11 = "Ха-ха... После стольких отказов мы наконец встречаемся с Генеральным студенческим советом."
101080-12 = "И не говори. Раньше он меня так бесил, что я даже подумывала стереть Генеральный студенческий совет с лица земли. А теперь посмотри на нас."
101080-13 = "Генеральный студенческий совет?! Хошино, даже для тебя это не чересчур?"
101080-14 = "Конечно чересчур. Хе-хе. Теперь я старая, со спиной больной. Просто вспоминала времена, когда была такой же горячей молодёжью, как вы."
101080-15 = "Ха-ха-ха... Это ведь было совсем недавно."
101080-16 = ""
101080-18 = ""
101080-19 = "Может, и недавно, но теперь всё иначе. У нас есть Сенсей."
101080-20 = "Не знаю, почему в последнее время меня так тянет на воспоминания. Помнишь, как ты внезапно появилась, Нономи? И как мы впервые встретили Широко."
101080-21 = "Ты просто ведёшь себя как старая бабка, Хошино."
101080-22 = "А я вообще никогда не слышала историю о том, как вы впервые встретили Широко."
101080-23 = "Правда? Я никогда не рассказывала?"
101080-24 = "Когда мы встретились, Широко была дикой девчонкой. Мне и Нономи пришлось здорово постараться, чтобы её поймать..."
101080-25 = "Что значит «поймать»...?"
101080-27 = "Хошино, эта история..."
101080-28 = "Больше незачем что-либо скрывать, Нономи."
101080-29 = ""
101080-31 = ""
101080-32 = ""
101080-33 = "Я тоже не хочу, но... сложно. Широко почти ничего не помнит о времени до того, как пришла в Абидос."
101080-34 = "У неё была амнезия?"
101080-35 = "Что?! Мы что, в мыльной опере?"
