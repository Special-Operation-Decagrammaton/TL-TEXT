[translation]
101080-1 = "Эпизод 8; Пришествие света"
101080-3 = "Широко, все ждут. Поторопись!"
101080-4 = "Широко! Нам пора. Мы опаздываем."
101080-5 = "*трррк* Еду так быстро, как могу. Уже почти на месте."
