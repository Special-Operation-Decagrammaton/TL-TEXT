[translation]
1014102-1 = "Неожиданная встреча"
1014102-3 = "Я возвращался домой после работы."
1014102-4 = ""
1014102-6 = ""
1014102-7 = ""
1014102-8 = ""
1014102-9 = ""
1014102-10 = "Вдруг я заметил Харуку: она ходила туда-сюда перед зданием, похожим на выставочный центр."
1014102-11 = ""
1014102-13 = ""
1014102-14 = ""
1014102-15 = ""
1014102-16 = ""
1014102-17 = "Похоже, она никак не могла решить, входить или нет."
1014102-18 = ""
1014102-19 = "Я решил подойти и узнать, что случилось."
1014102-20 = ""
1014102-22 = ""
1014102-23 = ""
1014102-24 = ""
1014102-25 = "С-Сенсей?!"
1014102-26 = ""
1014102-28 = ""
1014102-29 = ""
1014102-30 = "[ns] «Привет, Харука.»"
1014102-31 = "З-Здравствуйте!"
1014102-32 = "П-Простите! Я даже не заметила, как вы подошли, Сенсей...!"
1014102-33 = "[s] «Ты пришла на выставку?»"
1014102-34 = "А? О, эм... Да, наверное."
1014102-35 = "Хотите узнать, какую?"
1014102-36 = "Это... выставка ландшафтного садоводства Кивотоса."
1014102-37 = "Там показывают и продают деревья, цветущие кусты, материалы для ландшафтного дизайна..."
1014102-38 = "[s] «Ага, вот почему ты такая красивая.»"
1014102-39 = "А?"
1014102-40 = "Э-Э-Э-Э?!"
1014102-41 = "К-КРАСИВАЯ?! Нет-нет!!"
1014102-42 = "Такая потрёпанная, мрачная странная девчонка, как я, делает всё, к чему прикасается, только МЕНЕЕ красивым!"
1014102-43 = "[s] «Нет, я серьёзно. Ты очень красивая.»"
1014102-44 = "Ч-Что-о-о...?!"
1014102-45 = "Н-Не нужно говорить хорошие вещи, чтобы утешить такую недостойную, как я..."
1014102-46 = "[s] «Это не пустая вежливость. Клянусь.»"
1014102-47 = "УА-А-А-А-А...!"
1014102-48 = "Проститепроститепроститепростите!"
1014102-50 = "Я осторожно успокоил растерянную Харуку."
1014102-52 = "У-у-у..."
1014102-53 = "Мне так жаль... Почему я всегда создаю проблемы...?"
1014102-54 = "А? Почему я просто стояла здесь?"
1014102-55 = "Н-Ну..."
1014102-56 = "Потому что... я не заслуживаю входить внутрь."
1014102-57 = "[s1] «Чего-о-о?»\n[s2] «Если билет оплачен, заслуживаешь...»"
1014102-60 = "Н-Нет, эм..."
1014102-61 = "Я сегодня просто работаю у входа — ну, охраной."
1014102-62 = "Поэтому, конечно, я не заслуживаю заходить внутрь выставочного центра."
1014102-63 = "[s] «Охраной...?»"
1014102-64 = "Ах. Я неправильно поняла, чем должна заниматься охрана?"
1014102-65 = "Может, мне нужно не охранять дверь, а самой СТАТЬ дверью?!"
1014102-66 = "[s] «Это уже сильно выходит за рамки обязанностей!»"
1014102-68 = "Как выяснилось, организаторы выставки наняли Харуку охранником."
1014102-69 = ""
1014102-71 = ""
1014102-72 = "[ns] «Значит, платье на тебе тоже потому что...»"
1014102-73 = "Это форма... вроде бы."
1014102-74 = "Мне сказали, что охрана должна быть в «официальной одежде»."
1014102-75 = "Я-я понимаю! Мой наряд недостаточно официальный, да?!"
1014102-76 = "[s] «Нет. Куда уж официальнее платья.»"
1014102-77 = "Н-неужели?"
1014102-78 = "Слава богу..."
1014102-79 = ""
1014102-81 = ""
1014102-82 = "БА-БА-А-АХ!"
1014102-83 = ""
1014102-85 = ""
1014102-86 = "[ns] «Взрыв...?!»"
1014102-87 = "Он был из выставочного центра...!"
1014102-88 = "Кажется, там началась драка!"
1014102-89 = ""
1014102-91 = ""
1014102-92 = "Гинкго — лучшее дерево из всех! Все остальные ему и в подмётки не годятся!"
1014102-93 = "Какие старомодные традиционалисты! Что хорошего в этом вонючем старом дереве?!"
1014102-94 = "Что? Вонючем?! А ваши платаны каждую весну разбрасывают семена повсюду... как СОБАЧЬЮ ШЕРСТЬ!"
1014102-95 = "Нет, ты сейчас серьёзно это сказала?!"
1014102-96 = "Все, в атаку!"
1014102-97 = ""
1014102-101 = "О-Они дерутся из-за пород деревьев...?"
1014102-102 = "Что мне делать? Остановить их?"
1014102-103 = "Уа-а-а, такого не было в обучении..."
1014102-104 = ""
1014102-107 = "[ns] «О? Это кусок дерева летит сюда с опасной скоростью?»"
1014102-111 = "[ns] «А, попало.»"
1014102-112 = ""
1014102-113 = "[ns] «Эм, Харука? У тебя атмосфера полностью изменилась...»"
1014102-114 = "Ты..."
1014102-115 = "Вы ничтожные черви...!!!"
1014102-116 = "[s5] «Харука?!»\n[s6] «Я в порядке! Правда, совсем не больно!»"
1014102-119 = ""
1014102-121 = ""
1014102-127 = "Как вы посмели бросить кусок дерева прямо в лицо Сенсею?!"
1014102-128 = "Т-Ты вообще кто такая?!"
1014102-129 = "Неважно, просто УМРИТЕУМРИТЕУМРИТЕЕЕ!!"
1014102-130 = "Я похороню вас всех под теми деревьями, которые вы так любите!!"
1014102-131 = "П-Помогите!!"
1014102-132 = ""
1014102-139 = "И вот так Харука быстро усмирила всех, кто устроил беспорядок на выставке."
1014102-140 = "Правда, сам выставочный центр... тоже немного пострадал, мягко говоря."
1014102-142 = "Переулок за выставочным центром"
1014102-143 = ""
1014102-144 = "[ns] «Хорошая работа, Харука.»"
1014102-145 = "Эм... Ух-х-х..."
1014102-146 = "Простите, Сенсей, проститепроститепроститепростите..."
1014102-147 = "Вам даже пришлось на коленях умолять организаторов от моего имени!"
1014102-148 = "[s] «Это слегка преувеличено... И правда всё нормально, Харука.»"
1014102-149 = "Угх..."
1014102-150 = "Спасибо, Сенсей..."
1014102-152 = "Мы немного посидели на скамейке, отдышались и пришли в себя."
1014102-153 = "Когда обоим стало легче, я проводил Харуку обратно в офис Решатели проблем 68."
