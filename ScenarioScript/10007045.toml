[translation]
10007045-1 = "Эпизод 4;Подозрительная сделка"
10007045-2 = "Уф! Ты меня одолела!"
10007045-3 = "Это очень редкая возможность... Я не прощу такого поведения на нашем курорте!"
10007045-4 = "Я конфискую твои наброски, набитые твоими фантазиями, Мэру!"
10007045-5 = "Нет! Верни!"
10007045-6 = ""
10007045-8 = ""
10007045-9 = ""
10007045-10 = "Так, посмотрим... «Секретная коллекция усов главного секретаря Т»."
10007045-11 = "«Тайная любовь вице-президента Х и старшей администраторши А». «Тайное увлечение казначея Миллениума Ю»?"
10007045-12 = "Ч-Что это всё такое, Мэру?!"
10007045-13 = "Так ты рисовала студентов?"
10007045-14 = "...Тут даже есть рисунки студентов из других школ!"
10007045-15 = "Если книга с твоими фантазиями утечёт наружу, она спровоцирует разрушительную войну между школами!"
10007045-16 = "Такой опасной книге не место в этом мире! Я от неё избавлюсь!"
10007045-17 = "Н-Не делай этого! Я столько сил потратила на все эти исследования!"
10007045-18 = "Можешь просто сделать вид, что ничего не видела? Хотя бы один раз?"
10007045-19 = "Я-Я обменяю это на неё!"
10007045-20 = ""
10007045-22 = ""
10007045-23 = ""
10007045-24 = "Это... рисунок Сенсея [USERNAME]?"
10007045-25 = "Потрясающий образ Сенсея, который я могла видеть через линзу телескопа, теперь прямо у меня в руках... *тяжело дышит* *тяжело дышит*"
10007045-26 = "А?! Что я сейчас вообще представляю?!"
10007045-27 = "Хи-хи, похоже, этот рисунок тебе нравится."
10007045-28 = "Если хочешь, я могу нарисовать ещё."
10007045-29 = "В любой позе, с любым количеством деталей, Нодока. Просто подумай об этом."
10007045-30 = "Куча рисунков с разными сторонами потрясающего Сенсея..."
10007045-31 = ""
10007045-33 = ""
10007045-34 = ""
10007045-35 = "Хм, хм! Раз уж мы с Фронтом освобождения знаний сражались бок о бок как товарищи за свободу, и учитывая твою очевидную искренность... на этот раз я тебя отпущу."
10007045-36 = "Но проследи, чтобы никто никогда не узнал, что эти рисунки были созданы в академии Красной Зимы! Иначе начнётся поле боя."
10007045-37 = "Не волнуйся. При публикации я использую псевдоним и полностью скрою свою личность."
10007045-38 = "Хи-хи. Теперь у меня не будет никаких проблем с зимним Комисэном!"
10007045-39 = "Счастливый конец для всех!"
10007045-40 = "[s] «А моё мнение вообще кого-нибудь интересует...»"
10007045-41 = "Сенсей, тебя всё ещё не устраивает обслуживание на нашем курорте горячих источников №227?"
10007045-42 = "...У меня нет другого выбора."
10007045-43 = ""
10007045-45 = ""
10007045-46 = ""
10007045-48 = "Раз уж ты закончил наслаждаться купанием, теперь я проведу для тебя экскурсию по нашему саду!"
10007045-49 = "[s] «Пожалуйста, просто дай мне здесь отдохнуть.»"
10007045-51 = "После этого Нодока фактически вытолкала меня из купальни."
