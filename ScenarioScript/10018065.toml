[translation]
10018065-2 = "Уф, чёрт!"
10018065-3 = ""
10018065-5 = ""
10018065-7 = "Уааа, это было так тяжело!"
10018065-8 = "Хм..."
10018065-9 = "Похоже, Няо Фудс относится к делу с «Воробьём» серьёзнее, чем я думала."
10018065-11 = ""
10018065-13 = ""
10018065-14 = "Почему ты так решила?"
10018065-15 = "[s] «Они проделали слишком много работы ради одного-единственного ресторана.»"
10018065-16 = ""
10018065-18 = ""
10018065-19 = "...Важен не сам «Воробей», а то, что его отказ подчиниться стал символом."
10018065-20 = "Символом?"
10018065-21 = "Для тех, кто не хочет присоединяться к Няо Фудс..."
10018065-22 = "...он стал чем-то вроде точки сплочения."
10018065-23 = "А? Хозяйка просто хочет защитить свой бизнес."
10018065-24 = "Ага, и есть другие владельцы, которые думают так же."
10018065-25 = "Независимо от намерений хозяйки, сам факт, что «Воробей» всё ещё существует..."
10018065-26 = "...плохо выглядит для Няо Фудс и подталкивает другие предприятия сопротивляться компании."
10018065-27 = "А вместо отдела по связям с общественностью у Няо Фудс есть мы."
10018065-28 = "Наша работа — избавиться от «Воробья» максимально показательно."
10018065-29 = "Это станет уроком для других владельцев бизнеса."
10018065-30 = "[s] «И тебя это устраивает?»"
10018065-31 = "...Ну, план не то чтобы идеальный."
10018065-33 = "Тогда зачем следовать за таким маньяком?"
10018065-35 = "Потому что мне нужно платить за жильё."
10018065-36 = "[s] «Напрокат?»"
10018065-37 = "Верно, мы не помогаем Няо Фудс, мы работаем на Няо Фудс."
10018065-38 = "Если не считать всей этой тактики запугивания, нам платят за сбор, обработку, упаковку и доставку ингредиентов и товаров."
10018065-39 = "Для банды гурманов в шлемах Няо Фудс — всего лишь работодатель."
10018065-40 = "Не то чтобы мы занимаемся этим ради развлечения."
10018065-41 = "И не только мы."
10018065-43 = "Многим будет лучше работать на Няо Фудс, включая владельцев местных магазинов."
10018065-44 = ""
10018065-46 = ""
10018065-48 = ""
10018065-49 = "А что насчёт людей, которые этого не хотят?"
10018065-50 = "Не моя проблема. Я просто делаю свою работу."
10018065-51 = "[s] «Мы никак не можем договориться?»"
10018065-52 = "...Без понятия. Вам придётся поговорить напрямую с нашим работодателем."
10018065-53 = "Но удачи вам найти местоположение штаб-квартиры Няо Фудс!"
10018065-54 = ""
10018065-56 = ""
10018065-58 = ""
10018065-60 = "О, оно есть на их сайте."
10018065-61 = "Где?"
10018065-62 = ""
10018065-64 = ""
10018065-65 = "«Главный приоритет Няо Фудс — обеспечивать местные сообщества доступной и вкусной едой. Чтобы посетить нас...»"
10018065-66 = ""
10018065-69 = ""
10018065-70 = "Мне недостаточно платят за это..."
10018065-71 = ""
10018065-73 = ""
10018065-75 = "О, они убежали!"
10018065-76 = "Я их понимаю. ★"
10018065-77 = ""
10018065-79 = ""
10018065-81 = "Ну что, нам тоже пора?"
