[translation]
10042060-1 = "Эпизод 6;Что нужно сделать"
10042060-2 = "..."
10042060-3 = "Нет. Это правда...?"
10042060-4 = "[s] «Я ведь предупреждал...»"
10042060-5 = "Но КАК это может быть реальностью?"
10042060-6 = "Это ведь не какой-то... тщательно и злонамеренно сконструированный кошмар, в который меня кто-то запер, правда? Проверим..."
10042060-7 = ""
10042060-9 = ""
10042060-10 = "Ай, больно!"
