10042060-24 = "..."
10042060-25 = "Неважно. Всем орудиям приготовиться к залпу!"
10042060-26 = "Есть! Всем двенадцати 88-мм FlaK 36 приготовиться к залпу!"
10042060-27 = "П-Подождите, старший администратор...! Нам нужно это обсудить!"
