10042060-32 = "Она постоянно прячется за разными зданиями."
10042060-33 = "Если откроем огонь, то нанесём чудовищный ущерб СОБСТВЕННОМУ ГОРОДУ!"
10042060-34 = "...? Серьёзно?"
10042060-35 = "...Да, я тоже об этом подумала, госпожа."
10042060-36 = "Д-Да ладно. Да ладно!!"
10042060-37 = "БЛИНЧИК СЛИШКОМ БЫСТРЫЙ, он прячется, и мы не можем стрелять, не разнеся весь район..."
10042060-38 = "Я... Я уже вообще не понимаю, что происходит."
10042060-39 = "[s1] «Да, всё плохо.»\n[s2] «По крайней мере, спасибо, что не открыла огонь.»"
10042060-42 = "За кого вы меня вообще принимаете?"
10042060-43 = "...Ургх..."
10042060-44 = ""
10042060-46 = ""
