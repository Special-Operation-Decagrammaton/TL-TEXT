10042060-21 = "Я сказала: Я С САМОГО НАЧАЛА БЫЛА ПРАВА. Быстрее признайте это и не смотрите на меня так!"
10042060-22 = "[s] «Ладно, хорошо. Только не надо сейчас расплакиваться.»"
