[translation]
80000086-1 = "Сладкая логистика"
80000086-2 = "Пока я помогал Моэ разбирать припасы отряда RABBIT..."
80000086-3 = ""
80000086-6 = "...нас внезапно накрыл ливень, и мы промокли насквозь."
80000086-8 = "Парк Коусаги"
80000086-9 = "*вздох* ...Прогноз обещал солнце весь день. Почему обязательно должен был пойти дождь?"
80000086-10 = "По крайней мере благодаря вам мы успели защитить всю важную электронику и боеприпасы, но..."
80000086-11 = "Теперь я промокла и даже переодеться не во что."
80000086-12 = "Могло быть и хуже, но мне так холодно... Кажется, я простужусь."
80000086-13 = "[s] «Может, взять тебе запасную спортивную форму из Шале?»"
80000086-14 = "Если мы пойдём до Шале в мокрой одежде, вы тоже заболеете, Сенсей."
80000086-15 = ""
80000086-17 = ""
80000086-18 = "Я разведу огонь. Сначала обсохнем."
80000086-19 = "Солнце уже снова выглядывает, так что одежда наверняка быстро высохнет. Просто немного подождите."
80000086-21 = "Моэ нашла сухие дрова и развела костёр."
80000086-22 = ""
80000086-23 = "Ах, тепло..."
80000086-24 = "Когда согрелась, всё сразу кажется гораздо лучше."
80000086-25 = "[ns] «Ага! Теперь здесь тепло и уютно.»"
80000086-26 = ""
80000086-27 = "Хи-хи... Хи-хи-хи."
80000086-28 = "Когда смотрю на пляшущее пламя, вспоминаю... это."
80000086-29 = "Сладкую погибель, вкус которой можно познать только у костра..."
80000086-30 = "Ах, я так давно об этом не думала, но это пламя всё вернуло."
80000086-31 = "*тяжёлое дыхание* Сенсей, что мне делать? Я больше не могу..."
80000086-32 = "Я больше не могу сдерживаться!"
80000086-35 = "[ns] «Стой... Погоди, Моэ! Прекрати, что бы ты там ни задумала!»"
80000086-37 = ""
80000086-38 = ""
80000086-39 = "Хм? Сенсей, вы что, не хотите смор?"
80000086-40 = "[s] «Смор...?»"
80000086-41 = "Ага. Разве у костра не всегда хочется поджарить маршмеллоу?"
80000086-42 = "Они и сами по себе вкусные, но если поджарить над огнём, сладость и тягучая текстура усиливаются, и устоять невозможно!"
80000086-43 = "Когда мой отряд разводил костры в SRT, мы всегда жарили маршмеллоу и делали сморы."
80000086-44 = "Но, хи-хи... Жарить маршмеллоу у костра вместе с вами тоже очень приятно, Сенсей."
80000086-45 = "[s] «Если ты просто жаришь маршмеллоу, то всё нормально...»"
80000086-47 = "[ns] «Но что насчёт той погибели, о которой ты говорила?»"
80000086-48 = "Разве не видите, Сенсей? Не понимаете разрушительной сути сморов?"
80000086-49 = "Сладкий маршмеллоу кладётся на сладкий крекер, а сверху — сладкий шоколад."
80000086-50 = "Конечно, это вкусно, но калории..."
80000086-51 = "[s] «Понимаю. Наверное, их там очень много...»"
80000086-52 = "Именно. Это десерт погибели для любого, кто сидит на диете."
80000086-53 = "Но есть радости, которые можно испытать лишь если готов терпеть сопутствующие трудности."
80000086-54 = "Ну что, Сенсей? Хотите вкусить погибель?"
80000086-56 = "Мы с Моэ ели сморы у костра."
80000086-57 = "Они были вкусными, но теперь слово «погибель» навсегда будет у меня с ними ассоциироваться..."
