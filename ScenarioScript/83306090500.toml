[translation]
83306090500-10 = ""
83306090500-11 = "*пыхтит* *задыхается* *тяжело дышит* Прости, что опоздала, Эрика!"
83306090500-12 = "Кирара! Ты не просто опоздала — ты всё пропустила! Глава префектов уже помогла мне закончить всю работу."
83306090500-13 = "Прости! Я встретила старушку, которая стояла перед переходом и выглядела напуганной! Правда прости — я просто не могла не помочь ей!"
83306090500-14 = "Стоило догадаться, что ты опоздаешь из-за чего-нибудь такого..."
83306090500-15 = "В общем, дежурство уже закончено? И мисс Хина тебе помогла?! Правда?!"
83306090500-16 = "Ага. Каким-то образом..."
83306090500-17 = "Ого... Спасибо, что сделали всю работу, которую должна была делать я!"
83306090500-18 = "Я отплачу и куплю вам креп! Это традиция Клуба «Домой после уроков»!"
83306090500-19 = "Хм? О, не нужно—"
83306090500-20 = "Не-а! Я всегда возвращаю долги!"
83306090500-21 = "Кирара упрямая в таких вещах, так что тебе лучше просто согласиться."
83306090500-22 = "...Хорошо. Тогда можем сходить, когда моё дежурство закончится—"
83306090500-23 = "Договорились! Обещание!"
