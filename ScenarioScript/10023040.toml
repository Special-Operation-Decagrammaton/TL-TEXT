[translation]
10023040-1 = "Эпизод 4; Привет. Прыг."
10023040-2 = ""
10023040-3 = ""
10023040-4 = ""
10023040-5 = ""
10023040-6 = ""
10023040-7 = ""
10023040-8 = "[ns] «Привет, Арис. Ты занята уборкой!»"
10023040-9 = "Да! Потому что я герой-горничная!"
10023040-10 = "[s] «Что такое герой-горничная?»"
10023040-11 = "Продвинутый класс! Слияние сильнейших. Только тот, кто освоил и класс героя, и класс горничной, может эволюционировать в эту форму."
10023040-12 = "[s] «(Арис действительно восхищается горничными...)»"
10023040-13 = "Я занята уборкой, но почему вы так рано не спите, Сенсей?"
10023040-14 = "Правильный сон, отдых и питание очень важны! Пожалуйста, берегите себя."
10023040-15 = "Сенсей не неуязвим, как я! Мы с Момои и остальными привыкли всю ночь играть в видеоигры!"
10023040-16 = "[s1] «Ваша энергия заряжает и меня!» \n[s2] «Знаешь, Момои пора перестать не давать всем спать по ночам...»"
10023040-17 = ""
10023040-18 = ""
10023040-21 = ""
10023040-24 = "Сенсей! Вы зевнули! Вам нужно пойти отдохнуть и оставить уборку нам!"
10023040-25 = "Всё-таки для Сенсея ещё очень рано вставать!"
10023040-26 = "Ты почти закончила мыть пол, Арис...? Не поможешь потом протереть пыль?"
10023040-27 = "Я закончила, Юзу! Переключаюсь в режим вытирания пыли!"
10023040-28 = ""
10023040-30 = ""
10023040-31 = "*зевок*"
10023040-32 = "Так хочется спать..."
10023040-33 = "[s] «У всех работы по горло, да ещё и с самого утра.»"
10023040-34 = "Ну, изначальная задача — остановить воровку, а в карточке говорилось, что она придёт между 5:20 и 7:40 утра."
10023040-35 = "Мэйтаро просто добавил уборку сверху, раз уж мы всё равно встали."
10023040-36 = "За это доплачивают, так что жаловаться особо не на что, но..."
10023040-37 = "Я так... хочу спать..."
10023040-39 = "Время прошло от утра до дня без единого происшествия."
10023040-40 = "Гости начали прибывать, вечеринка началась по расписанию, но работа оказалась ещё более... обширной, чем нам изначально говорили."
10023040-42 = "Ты. Мой бокал всё ещё пуст. Может, в первый раз ты меня не услышала?"
10023040-43 = "А? О, эм..."
10023040-44 = "Мне очень жаль... Сейчас же наполню."
10023040-45 = "Хмф. Тебе стоит помнить, что твои действия отражаются на работодателе."
10023040-46 = "(Что он несёт?! Я вообще не настоящая горничная, придурок!)"
10023040-47 = "Я понимаю, вы временные работницы, но разве ваше агентство не учит хотя бы основам? Не уметь наполнить бокал—"
10023040-48 = "Прошу прощения, но ваш бокал полон."
10023040-49 = "Вы меня за идиота держите? Я знаю, как выглядит пустой бокал, и он выглядит вот так!"
10023040-50 = ""
10023040-52 = ""
10023040-53 = "О-О? Погодите... К-Когда его успели наполнить? Я даже не заметил..."
10023040-55 = "(Что за чёрт?! Ты видела, Мидори?)"
10023040-56 = "(Видела, но не понимаю, как это произошло...)"
10023040-57 = ""
10023040-58 = ""
10023040-59 = ""
10023040-60 = ""
10023040-61 = ""
10023040-62 = ""
10023040-63 = ""
10023040-64 = ""
10023040-65 = "А! Гостей слишком много! Меня раздавят, как слизневого моба!"
10023040-66 = ""
10023040-69 = "Эй, ты! На полу тарелка!"
10023040-70 = "К счастью, она не разбилась, и я не пострадал! Но всё равно очень испугался!"
10023040-72 = "П-Простите! Я стараюсь, но меня с-сдавливают...!"
10023040-74 = "Какая лень! Я требую, чтобы ты выполняла работу и убрала её!"
10023040-75 = "Н-Но..."
10023040-76 = ""
10023040-78 = ""
10023040-79 = "У-Уф! П-Простите, но мне нужно пройти, гости...!"
10023040-80 = ""
10023040-82 = ""
10023040-83 = ""
10023040-85 = ""
10023040-86 = ""
10023040-87 = "А? Я не понимаю. Тарелки нет..."
10023040-88 = "У тебя глаз нет? Тарелка прямо там!"
10023040-89 = "Что?! Кто её поднял?!"
10023040-90 = "Эм... Я просто пытался покритиковать мероприятие, чтобы потом поторговаться на аукционе... Как досадно..."
10023040-92 = "У тебя ноги свинцом налиты?! Я не могу отправлять холодное блюдо в зал!"
10023040-93 = "Посмотри на это! Это похоже на жареного морского окуня? Если его отпустить, он оживёт и уплывёт обратно в море!"
10023040-94 = "Что с вами, горничные? Хотите денег — работайте!"
10023040-95 = "А-а! Вы правы! Простите! Мне очень жаль!"
10023040-96 = "«Простите» еду не доставляет! Здесь столько блюд ждут отправки, будто у нас тут ужин на День благодарения. Скорее и—"
10023040-97 = "И ещё..."
10023040-98 = "Куда... делась вся еда...?"
10023040-99 = ""
10023040-100 = ""
10023040-101 = "Я всё доставила. Что делать дальше?"
10023040-102 = "Что значит «всё доставила»?! Все эти блюда?!"
10023040-103 = "Для способной горничной это детская игра."
10023040-104 = "Т-Ты сказала, что горничная... а не... кролик?"
10023040-105 = "Ну, эм, думаю, это всё, что было нужно. Можете идти."
10023040-106 = ""
10023040-108 = ""
10023040-109 = "Не вы, кухонный персонал! Сюда!"
10023040-110 = ""
10023040-112 = ""
10023040-113 = ""
10023040-116 = "Эм..."
10023040-117 = ""
10023040-119 = ""
10023040-121 = "Давно не виделись. Мир, мир."
10023040-122 = "Чего-о-о?! И не говори «мир», когда показываешь знаки мира! Это лишнее!"
10023040-124 = "[ns] «Так вот что произошло. Это была Нэру...»"
10023040-125 = "Да. Она сообщила мне о планах Благородной Воровки и попросила обеспечить безопасность особняка."
10023040-126 = "Хотя я получила и ещё одну миссию..."
10023040-127 = "В любом случае, я действительно... рада этой неожиданной встрече, Сенсей."
10023040-128 = "[s] «Взаимно, Токи.»"
10023040-129 = "Спасибо, Сенсей."
10023040-130 = "Знаете, перед уходом остальные участницы сказали мне кое-что..."
10023040-131 = "Они сказали: «Токи, только на тебя мы можем положиться в этой работе. Верим, что ты вернёшься с хорошими новостями и результатами, достойными агента C&C.»"
10023040-132 = "«Выполни задачу любой ценой. Никакой инструмент или потребность не слишком дороги. Просто отправь отчёт о расходах в Семинар.»"
10023040-133 = "«Мы редко это говорим, но все мы в тебя верим.»"
10023040-134 = ""
10023040-136 = ""
10023040-137 = "Хи-хи."
10023040-138 = "[s] «По этой довольной ухмылке видно, что тебе очень хотелось мне это рассказать...»"
10023040-139 = "Да. А ещё мне сказали, что Благородная Воровка всегда присылает визитную карточку перед самим ограблением."
10023040-140 = "Если не возражаете, думаю, я могу помочь."
10023040-141 = "[s5] «Кажется, ты упускаешь что-то важное...» \n[s6] «Меня кое-что не оставляет в покое...»"
10023040-142 = "М? Ты о чём?"
10023040-143 = "Да? Что именно?"
10023040-144 = "[s] «...Почему на тебе костюм кролика?»"
10023040-145 = "..."
10023040-146 = "Я разочарована в вас, Сенсей."
10023040-147 = "[s] «За что?!»"
10023040-148 = "Тебе и так должно быть известно. Я лично изучила предыдущие случаи проникновения C&C, особенно их операцию на круизном лайнере Морской академии «Одиссея»."
10023040-149 = "Я пришла к выводу, что костюм кролика — оперативная форма C&C для работы под прикрытием."
10023040-150 = "[s] «О... О нет. Там была совсем другая ситуация...»"
10023040-151 = "...?"
10023040-152 = "[s] «Неважно. В конце концов, Токи, ты всегда останешься собой. И это хорошо.»"
10023040-153 = "Ваши слова добрые, но тяжёлый вздох после них звучал очень обречённо..."
10023040-154 = "Но я приму ваши слова буквально."
10023040-155 = "Думаю, у нас есть более... срочная проблема."
10023040-156 = ""
10023040-158 = ""
10023040-159 = "Уф... А-а-а-а..."
10023040-160 = ""
10023040-162 = ""
10023040-163 = "...Не смотрите... сюда... Никого нет..."
10023040-164 = ""
10023040-165 = "..."
10023040-166 = "Что мне делать, Сенсей?"
10023040-167 = "[s7] «Логично спросить учителя о непонятной ситуации...» \n[s8] «Мне жаль это говорить, но у учителей не всегда есть ответы...»"
10023040-168 = "Понятно... Тогда можно спросить, что вообще здесь происходит?"
10023040-169 = "Понятно... Тогда можно спросить, что вообще здесь происходит?"
10023040-170 = "Я-я тебя не боюсь! Я могу победить тебя в бою... в-в файтинге!"
10023040-171 = "Осторожно, Момои. В прошлый раз, когда она начала проигрывать, она сменила класс и сжульничала!"
10023040-173 = "М-Мы не хотим снова потерять Арис... но...!"
10023040-174 = "[s] «...Позвольте объяснить.»"
10023040-176 = ""
10023040-177 = "Вы приняли заказ для C&C, поэтому и попросили меня найти форму горничных. Понятно..."
10023040-178 = "Н-Нам конец, Момои...?"
10023040-179 = "Не знаю! Что делать? Нэру теперь правда нас убьёт?"
10023040-180 = "Ик!"
10023040-181 = "Я вас не выдам. Это не конец, и Нэру вас не убьёт. Я здесь, чтобы выполнить свою миссию, и больше ничего."
10023040-182 = "Хотя я понятия не имела, что Отдел разработки игр окажется частью этой миссии..."
10023040-183 = "[s] «Ты уверена? Мы полностью действовали сами по себе, используя ваше имя.»"
10023040-184 = "Да, уверена."
10023040-185 = "Если мои товарищи могут отправиться на миссию без меня, значит и я могу делать что захочу без них."
10023040-186 = ""
10023040-189 = "[ns9] «Это внезапно стало очень личным...» \n[ns10] «Мы потеряли счёт времени! Сейчас... 7:38?»"
10023040-190 = "?!?!"
10023040-191 = "?!?!"
10023040-193 = "Что происходит? Свет погас!"
10023040-194 = "Что всё это значит? Мэйтаро? Мэйтаро!"
10023040-195 = "П-Пожалуйста, сохраняйте спокойствие! Это всего лишь временное отключение электричества. Свет скоро вернётся."
10023040-196 = "Глупая надежда."
10023040-197 = "Кто...?"
10023040-199 = "Чем ценнее предмет, тем отчаяннее общество стремится им завладеть. Подчинить его себе."
10023040-200 = "Элита «protect» охраняет эти ценности, чтобы они оставались в руках достойных: то есть их самих."
10023040-201 = "Но разве так должно быть? Нет! Если вещь действительно настолько ценна, ею должны свободно наслаждаться все!"
10023040-202 = "Не может быть...!"
10023040-204 = ""
10023040-205 = "Ходят слухи о неуловимой воровке..."
10023040-206 = ""
10023040-207 = ""
10023040-208 = ""
10023040-209 = ""
10023040-211 = ""
10023040-212 = "Пока другие презрительно называют меня обычной преступницей."
10023040-213 = ""
10023040-214 = ""
10023040-215 = ""
10023040-216 = ""
10023040-217 = "В день рождения мы чисты: без титулов, без ярлыков. И потому принимаем те, которыми нас одаривают другие."
10023040-218 = ""
10023040-219 = ""
10023040-220 = ""
10023040-221 = ""
10023040-222 = "И мне вы, члены общества, тоже любезно даровали титул."
10023040-224 = "Да. Я приняла имя, которым вы меня нарекли."
10023040-225 = ""
10023040-235 = ""
10023040-236 = "Рада знакомству. Я — Благородный Вор."
