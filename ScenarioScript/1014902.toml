[translation]
1014902-1 = "Divers and Safety Measures"
1014902-2 = "Schale Office"
1014902-3 = "(It is Kokoro turn to be on duty at Schale today.)"
1014902-8 = "Hello, Sensei...!"
1014902-9 = "I am Toumi Kokoro from the Diving Club.#nLet us work hard together today, please!"
1014902-10 = "[s1] \"You do not need to be so nervous.\"\n[s2] \"Likewise, nice to work with you, Kokoro.\""
1014902-13 = "U-Um...!"
1014902-14 = "It has been almost a year since I left Odyssey...#nSo I guess I was a little tense."
1014902-18 = "...The scenery in D.U. has changed quite a bit, too."
1014902-19 = "[s3] \"Things have been changing pretty fast lately.\"\n[s4] \"Even I am surprised by how much the cityscape has changed.\""
1014902-22 = "Seeing the scenery change so rapidly... makes me think it is amazing, but also a bit scary."
1014902-23 = "I wonder if there are unseen dangers lurking in this scenery..."
1014902-24 = "Be that as it may! What should we do today?"
1014902-25 = "[s] \"Let us see...\""
1014902-29 = "[ns5] \"The office is pretty messy...\"\n[ns6] \"Could you help me tidy up the supplies?\""
1014902-32 = "Understood! Leave it to me!"
1014902-40 = "Sensei, about this desk corner..."
1014902-41 = "[s] \"Hm? Is something wrong with it?\""
1014902-42 = "Look at it. The corner is sharp. Plus, it is made of iron..."
1014902-43 = "Let us put corner guards on it for safety."
1014902-44 = "If someone falls, they could get seriously hurt."
1014902-45 = "[s7] \"No way...\"\n[s8] \"I think that is a pretty rare case...\""
1014902-48 = "Ugh..."
1014902-52 = "...That kind of thing does happen!"
1014902-53 = "If an accident happens, even once, it cannot be undone!"
1014902-54 = "Besides, I heard that Sensei is fragile enough to get severely injured by a single bullet."
1014902-55 = "If Sensei gets hurt because we neglected safety measures... what would everyone think?"
1014902-56 = "[s] \"O-Okay then, I guess I will leave it to you...\""
1014902-57 = "Yes, leave it to me!"
1014902-59 = "(Kokoro immediately began installing safety devices all over the office.)"
1014902-62 = "Sensei. The floor in front of the restroom is quite slippery."
1014902-63 = "Most fall accidents happen in restrooms and bathrooms. Let us put down a mat."
1014902-64 = "Do you mind if I use this rug we found in the warehouse?"
1014902-68 = "This TV is supported by just a single screw...?"
1014902-69 = "If it fell on your head from the impact... ugh..."
1014902-70 = "We need more screws-- no, let us just use a fixing band instead!"
1014902-77 = "(Following Kokoro instructions, we installed safety devices all around the office.)"
1014902-78 = "(The inspection took longer than expected, and by the time it was finished, it was evening.)"
1014902-80 = "...I think we have taken precautions to a certain extent."
1014902-81 = "Um, the remaining risk factors are..."
1014902-85 = "Eek!"
1014902-86 = "[ns9] \"Sorry, was it cold?\"\n[ns10] \"I brought you a drink.\""
1014902-89 = "...Thank you for your thoughtfulness."
1014902-91 = "Phew..."
1014902-92 = "Before I knew it, it is already this late..."
1014902-93 = "I am sorry. I might have gone a bit overboard."
1014902-94 = "[s] \"Overboard? You think so?\""
1014902-95 = "Yes. Usually I am cautious even just choosing my words..."
1014902-96 = "Due to my diving training, when it comes to safety...#nI guess I got a little too excited."
1014902-97 = "Or rather, I got carried away..."
1014902-98 = "Even today, I forced all this on Sensei..."
1014902-99 = "[s] \"I do not think it was rude at all.\""
1014902-103 = "[ns] \"Thanks to you, we were able to prevent accidents.\""
1014902-104 = "Still..."
1014902-105 = "Making a fuss only at times like this... I think it looks strange from an outsider's perspective..."
1014902-106 = "[s] \"No, I think that is part of your charm, too, Kokoro.\""
1014902-110 = "[ns] \"If even one piece of you were missing, you wouldn't be Kokoro anymore.\""
1014902-112 = "___"
1014902-113 = "Sensei... um..."
1014902-118 = "Was that... unintentional?"
1014902-119 = "[s] \"Eh? Did I say something weird?\""
1014902-120 = "It is not that..."
1014902-121 = "...The biggest hazard in Schale might just be Sensei."
1014902-123 = "(After that, I continued my work while receiving suspicious, wary glances from Kokoro...)"
