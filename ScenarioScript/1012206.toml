[translation]
1012206-1 = "От моих первых шагов — вперёд"
1012206-2 = "Я отправился искать Мику после её странных сообщений в MomoTalk."
1012206-5 = "[ns] «Кажется, сюда...?»"
1012206-6 = "Хи-хи... Э-хе-хе."
1012206-7 = ""
1012206-10 = "[ns] «Мика...?»"
1012206-11 = ""
1012206-12 = "А..."
1012206-13 = "Сэн-сэ-эй! Э-хе-хе!"
1012206-14 = "Тыыы всё-таки пришёёёл?"
1012206-15 = "Я... прооосто сиде-е-ела. Ага-а..."
1012206-16 = "[ns] «Что происходит? Это ведь...»"
1012206-17 = "Э-хе-хе. Было вкусно. Я выпила па-арочку стака-анчиков?"
1012206-18 = "И ещёёё я тут ду-уумала..."
1012206-19 = "Сенсе-эй? Хоочешь немноожко?"
1012206-20 = "А-ха-ха. Идии сюда. Сади-ись. Рядом со мной."
1012206-21 = "[ns] Сесть рядом с Микой."
1012206-23 = ""
1012206-24 = "...Ты правда сел. Ого-о. Хи-хи..."
1012206-25 = "[ns1] «Мика, похоже, ты хочешь поговорить.»\n[ns2] «Что случилось?»"
1012206-28 = "Ах..."
1012206-29 = "Ага-а. Хи-хи. Ты та-акой умный, Сенсей. Быстро понял!"
1012206-30 = "Тогда я скажу-у, ладно-о?"
1012206-31 = ""
1012206-33 = ""
1012206-34 = "...Я тут ду-умала..."
1012206-35 = "Знаешь, раньше я была настоя-ящей принцессой."
1012206-36 = "А-ха-ха... Серьёзно. Я правда почти ею была. Честно."
1012206-37 = "Я получала и дела-ала всё, что хоте-ела..."
1012206-38 = "И все меня слушались..."
1012206-39 = "Принцесса Патер... Потом меня пригласили в Чаепитие..."
1012206-40 = "Для меня это было совершенно естественно. Я про-осто... думала, что мне всё это положено."
1012206-41 = "Хи-хи... Я думала, что такая особенная... такая кру-утая..."
1012206-42 = "М-м..."
1012206-43 = "[ns] «...»"
1012206-44 = "Я была полной дурой."
1012206-45 = "Я поступала плохо... и меня наказали. Все это знали."
1012206-46 = "Даже после этого... столько всего произошло."
1012206-47 = "Хи-хи, вот и-и..."
1012206-48 = "Сияю-ющая и всеми любимая принцесса Чаепития вообще не представля-яла, кто она на самом деле."
1012206-49 = "«Настоящая она» оказалась вовсе не такой милой, счастливой, крутой или особенной."
1012206-50 = "...Просто хитрой, расчётливой и эгоистичной соплячкой."
1012206-51 = "Вот какая Мика на самом деле... А-ха-ха."
1012206-52 = ""
1012206-54 = ""
1012206-55 = "Тогда кто я вообще такая...? Почему я такая ужасная?"
1012206-56 = "Я не знаю... почему я такая..."
1012206-57 = ""
1012206-60 = "[ns] «Так вот о чём ты переживала, Мика.»"
1012206-61 = "М-м..."
1012206-62 = "Я часто об этом думаю..."
1012206-63 = "[s3] «Тебе просто нужен был предлог, чтобы говорить честно.»\n[s4] «Ты притворяешься пьяной.»"
1012206-66 = ""
1012206-68 = ""
1012206-69 = "Т-Ты понял...?"
1012206-70 = "[s] «Это ведь просто сок, да?»"
1012206-71 = "...У-Ух..."
1012206-72 = "У-У-у-ух... Ты всё это время знал?!"
1012206-73 = "Я знала, что будет неловко, но... А-АХ! Это уже слишком."
1012206-74 = "[s] «Эх, Мика. Сначала прыгаешь в омут, а потом жалеешь.»"
1012206-75 = "Н-Ну ты же понимаешь! Я просто хотела оставить себе путь к отступлению. Типа притвориться?"
1012206-76 = "Я просто не могла... Как я могла сказать тебе всё прямо, если даже сама не понимала, что хочу сказать?"
1012206-77 = "П-Поэтому я подумала... когда взрослый человек переживает стресс, он..."
1012206-78 = "[ns5] «Будь собой.»\n[ns6] «Просто честно расскажи о своих чувствах.»"
1012206-81 = "Ага."
1012206-82 = "...Теперь у меня есть ещё одно позорное воспоминание, которое я буду постоянно прокручивать в голове."
1012206-83 = "..."
1012206-84 = "Но я правда всё это имела в виду. Я постоянно веду себя как дура. Как идиотка."
1012206-85 = "Я всех раздражаю. Прямо сейчас я и ТЕБЯ достаю!"
1012206-86 = "И продолжаю так делать. Наверное, я просто такая."
1012206-87 = "Я... не знаю, что мне ещё делать. Как я могу доверять себе после того, как я...?"
1012206-88 = "[s7] «У тебя всё хорошо получается, Мика.»\n[s8] «Ты очень стараешься.»"
1012206-91 = "Х-Хм?"
1012206-92 = "У-У меня хорошо получается...? Ты правда так думаешь...?"
1012206-93 = "...Сейчас самый важный период моей жизни?"
1012206-94 = ""
1012206-96 = ""
1012206-97 = "Я знаю. И я мучаюсь, переживаю и стараюсь стать лучше."
1012206-98 = "...Но есть ли в этом вообще смысл?"
1012206-99 = "[s] «Такие моменты поддерживают и формируют твоё будущее.»"
1012206-100 = "Это всё просто отдельные моменты..."
1012206-101 = "...словно маленькие шаги, которые ведут меня туда, куда нужно."
1012206-102 = ""
1012206-104 = ""
1012206-105 = ""
1012206-106 = ""
1012206-107 = ""
1012206-108 = "Честно говоря, я не знаю. Я правда сомневаюсь, возможно ли это вообще."
1012206-109 = "Но..."
1012206-110 = "Если так сказал Сенсей..."
1012206-111 = "Если Сенсей сказал это именно мне..."
1012206-112 = "...я подумаю об этом."
1012206-113 = "[s9] «Всё будет хорошо.»\n[s10] «Все эти тяжёлые уроки однажды окупятся.»"
1012206-116 = "..."
1012206-117 = "Ага. Наверное, я..."
1012206-118 = "...я продолжу... думать об этом. И, Сенсей..."
1012206-119 = "...я рада, что мы об этом поговорили."
1012206-120 = ""
1012206-122 = ""
1012206-123 = ""
1012206-124 = ""
1012206-125 = "Какой же длинный был день. Я так устала..."
1012206-126 = "[s] «Привет?»"
1012206-127 = "М-м..."
1012206-128 = "..."
1012206-130 = ""
1012206-132 = ""
1012206-134 = "[ns11] «...»\n[ns12] «Мика?»"
1012206-138 = "Мика крепко уснула. Я отнёс её обратно в кровать и оставил отдыхать."
