[translation]
10008050-1 = "Эпизод 5;Дисциплинарный комитет вступает в бой"
10008050-3 = "Куда делись эти чудики-Кайтенджеры?"
10008050-4 = "Судя по их маршруту до этого момента, они должны были пойти—"
10008050-5 = ""
10008050-9 = "Стоять! Обнаружены подозрительные цели!"
10008050-10 = "Подозрительные? Это Кайтенджеры? Где?!"
10008050-11 = "Скажите, куда они пошли!"
10008050-13 = "Окружить и задержать!"
10008050-14 = ""
10008050-16 = ""
10008050-23 = ""
10008050-24 = "Босс, по-моему, она имела в виду..."
10008050-25 = "Только не говори!"
10008050-26 = "Подозрительные цели — это мы...?"
10008050-27 = ""
10008050-31 = "Наконец-то поймали вас. Бежать больше некуда!"
10008050-32 = "[s] «Иори?»"
10008050-33 = "Сенсей? Мне показалось, кто-то из вас знакомый."
10008050-34 = "С Новым годом, Сенсей... Но что ты здесь делаешь? Ещё и с этими негодяйками?"
10008050-35 = "Н-Не называй нас негодяйками!"
10008050-36 = "А как ещё вас называть? «Создатель проблем 68»?"
10008050-37 = "[s] «Почему ты работаешь так поздно, Иори?»"
10008050-38 = "Разве не очевидно?"
10008050-39 = "Судя по тому, сколько вас вышло в патруль..."
10008050-40 = "Ха-ха-ха!"
10008050-41 = "Теперь понятно! Вам всем сегодня нечем было заняться, вот и устроили жалкую вечеринку одиночек."
10008050-42 = "Что?!"
10008050-43 = "Мы работаем ИМЕННО потому, что Новый год!"
10008050-44 = "[s] «У дисциплинарного комитета сегодня не выходной?»"
10008050-45 = "Конечно нет. Из-за трансляции Дайкичидэна всё превратилось в хаос."
10008050-46 = "Все охотятся за тем ящиком. Полный бардак."
10008050-47 = "*вздыхает* Проблемные студенты нашей академии разбушевались. Ако сказала даже не возвращаться, пока ситуацию не возьмём под контроль."
10008050-48 = "Почему это должно было случиться именно во время моего ночного дежурства?! Я не так хотела провести Новый год!"
10008050-49 = "И всё из-за этих негодяек."
10008050-50 = "Что мы вообще сделали?!"
10008050-51 = "Мы такие же жертвы этой ситуации, как и вы."
10008050-52 = "Ага! Жертвы, у которых нет времени на эту ерунду!"
10008050-53 = "Ты же не серьёзно."
10008050-54 = "У вас совсем нет стыда? Я знаю, вы тоже хотите ящик себе, как и все остальные."
10008050-55 = "Э-Это не так. Всему есть нормальное объяснение."
10008050-56 = "Значит, признаёте! И что ещё хуже, вы препятствуете правосудию, сопротивляясь дисциплинарному комитету.#nНегодяйки, как я и сказала!"
10008050-58 = "Я остановлю вас здесь во имя дисциплинарного комитета и во имя возвращения моего выходного!"
10008050-60 = "Ты нас вообще не слушаешь!"
10008050-61 = "[s] «Давайте все успокоимся...»"
10008050-63 = "Ахахаха! Хотите подраться?!"
10008050-64 = "Готовлюсь к бою, босс."
10008050-65 = "А-Ару! Можешь на меня рассчитывать!"
10008050-66 = ""
10008050-69 = ""
10008050-70 = "ЧТО ВЫ ВСЕ ТВОРИТЕ?!"
