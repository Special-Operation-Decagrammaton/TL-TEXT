[translation]
10016100-1 = "Эпилог;Чай для всех"
10016100-2 = "После эстафеты Фестиваль Хало Кивотоса завершился без особых происшествий..."
10016100-3 = "Он успешно подошёл к концу с заключительной речью представительницы школы Миллениум."
10016100-4 = ""
10016100-7 = ""
10016100-8 = "Приветствую спортсменок и зрителей. Меня зовут Ушио Ноа из школы Миллениум. Я секретарь Семинара и член Исполнительного комитета этого Фестиваля Хало Кивотоса."
10016100-9 = "Изначально заключительную речь должна была произнести президент студсовета Миллениума Рио. Но из-за непредвиденных обстоятельств сегодня я выступлю вместо неё. Благодарю за понимание."
10016100-10 = "Как я уже говорила, в роли секретаря и писаря я больше привыкла записывать истории, чем рассказывать их. Поэтому мне немного трудно подобрать слова для заключительной речи."
10016100-11 = "Поэтому вместо обычного заключительного обращения я хотела бы немного оглянуться на события сегодняшнего дня, как продолжение своих обычных секретарских обязанностей."
10016100-12 = ""
10016100-14 = ""
10016100-15 = "На Фестивале Хало Кивотоса в этом году прошло множество соревнований и игр, и бесчисленное количество спортсменок представляли свои школы."
10016100-16 = "Лично я считаю, что каждое соревнование было захватывающей битвой, достойной аплодисментов, хотя, возможно, не все разделяют это мнение. В любом случае спортивный фестиваль получился великолепным."
10016100-17 = "Я не смогла бы выбрать одну школу или одного студента, чтобы отдельно отметить невероятное спортивное мастерство и выступление. Потому что каждая из вас показала именно это."
10016100-18 = ""
10016100-20 = ""
10016100-21 = "Поэтому я хочу оставить вам такое послание... Я глубоко благодарна всем студентам, которые пришли и показали всё, на что способны, на этом спортивном фестивале."
10016100-22 = "Ведь, как было сказано на церемонии открытия... Фестиваль Хало Кивотоса — событие, созданное студентами для студентов, и наслаждаться им должны все."
10016100-23 = "И на этом я надеюсь, что все прекрасно провели время, и официально объявляю Фестиваль Хало Кивотоса успешно завершённым!"
10016100-26 = "Что теперь будем делать? Вокруг стадиона ещё много всего интересного."
10016100-27 = "Да, но если честно, я довольно голодна..."
10016100-28 = "Слышала, торговцы будут работать допоздна, даже несмотря на окончание мероприятия."
10016100-29 = "Хочу попробовать те китайские рисовые чаши, на которые раньше не хватило времени!"
10016100-30 = "Я видела огромную кучу дров перед стадионом... Интересно, они собираются разводить костёр?"
10016100-31 = "Будет вечеринка после фестиваля, разве ты не знала?"
10016100-32 = "Это одна из главных традиций Фестиваля Хало Кивотоса: вечеринка с огромным костром и народными танцами для всех студентов."
10016100-33 = "Есть даже легенда, что если станцевать вокруг костра с тем, кто тебе нравится, ваша любовь расцветёт и продлится вечно!"
10016100-34 = "Есть кто-нибудь, с кем ты хочешь потанцевать на вечеринке?"
10016100-35 = "Хм, думаю, я хотела бы потанцевать с..."
10016100-37 = "Хасуми, всё необходимое оборудование и огнетушители для вечеринки готовы."
10016100-38 = "А вот сводка, которую вы просили, по количеству боеприпасов, израсходованных во время фестиваля..."
10016100-39 = "Спасибо. Ты очень помогла."
10016100-40 = "Когда начнётся вечеринка, студенты могут вести себя неосторожно возле костра, так что, пожалуйста, особенно внимательно следите за безопасностью."
10016100-41 = "Давайте сделаем так, чтобы праздник завершился на высокой ноте."
10016100-42 = "П-Поняла!"
10016100-43 = ""
10016100-45 = ""
10016100-46 = "[ns] «Вижу, ты усердно работаешь до самого конца, Хасуми.»"
10016100-47 = "О, Сенсей."
10016100-48 = "Спасибо за всё, что вы сделали сегодня. Благодаря вам Фестиваль Хало Кивотоса прошёл без серьёзных проблем."
10016100-49 = "[s] «Это ничто по сравнению с тем, сколько пришлось работать Исполнительному комитету.»"
10016100-51 = "[ns] «...Тебе понравился Фестиваль Хало, Хасуми?»"
10016100-52 = "Мне? Вы хотите знать, что я думаю о фестивале?"
10016100-53 = "Хм, если честно..."
10016100-54 = "...Это было ужасно."
10016100-55 = "Мало того что я выступила посредственно, так в конце ещё пришлось стоять и смотреть, как Геенне вручают победу на пьедестале."
10016100-56 = "Вдобавок бесконечные выходки проблемных студентов, постоянные сбои новейшей робототехники Миллениума..."
10016100-57 = "И наконец огромное количество уличных торговцев, продающих сверхкалорийные закуски и соблазняющих меня разрушить диету направо и налево!"
10016100-58 = "...Это был худший Фестиваль Хало Кивотоса в моей жизни."
10016100-59 = "Но... мне также посчастливилось увидеть, как многие студенты работали вместе ради победы в своих соревнованиях."
10016100-60 = "И пусть я выступила неважно, было невероятно захватывающе бежать по трассе изо всех сил."
10016100-61 = "Так что, по крайней мере, я не могу отрицать, что мне было весело."
10016100-62 = "[s] «Я рада это слышать.»"
10016100-63 = "Разумеется, было бы ещё лучше, если бы чемпионат выиграла Тринити."
10016100-64 = "Но раз уж я бежала последней в школьной эстафете, пожалуй, мне некого винить кроме себя..."
10016100-65 = ""
10016100-67 = ""
10016100-68 = "Кстати, Сенсей. Эти студенты позади вас..."
10016100-69 = "[s] «Позади меня...?»"
10016100-70 = ""
10016100-71 = ""
10016100-72 = ""
10016100-74 = "[ns1] «Юука, Ако и... Мари?»\n[ns2] «Что вы трое здесь делаете...?»"
10016100-77 = ""
10016100-78 = "Н-ну, понимаете... Скоро начнётся вечеринка, и нам было интересно, собираетесь ли вы туда..."
10016100-79 = "Обещаю, мы не собирались подслушивать ваш разговор... Простите!"
10016100-80 = "М-меня вовсе не волнуют всякие легенды..."
10016100-81 = "Н-но если у вас нет партнёра для народного танца, я просто хотела сказать, что у меня тоже никого нет, так что я могла бы составить вам компанию... Если хотите."
10016100-82 = "Мне вообще нет дела до танцев, но я увидела, что вы двое разговариваете."
10016100-83 = "Я надеялась услышать какой-нибудь компромат, чтобы потом тебя поддразнивать. Но увы."
10016100-85 = "Вы трое и правда не меняетесь."
10016100-86 = "Соревнования закончились, но работы всё ещё полно, в том числе по подготовке вечеринки."
10016100-87 = "Вас вообще не волнуют ваши настоящие обязанности членов Исполнительного комитета?"
10016100-89 = "Э-эй, я уже разобралась со всеми срочными делами, ясно?"
10016100-90 = "Не тебе, студенту Тринити, читать мне нотации."
10016100-92 = "Но, знаешь... Наверное..."
10016100-93 = "Не будет концом света, если мы немного отложим работу и насладимся праздником. Хотя бы иногда."
10016100-94 = ""
10016100-96 = ""
10016100-97 = "Им понадобится ещё довольно много времени, чтобы подготовить костёр."
10016100-98 = ""
10016100-100 = ""
10016100-101 = ""
10016100-103 = ""
10016100-105 = "Так... Может, кто-нибудь хочет чаю, специально подаренного Чайной партией?"
10016100-106 = "На старт, внимание, марш! Фестиваль Хало Кивотоса!"
