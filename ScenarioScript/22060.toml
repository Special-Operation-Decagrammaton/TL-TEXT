[translation]
22060-1 = "Episódio 6;A Máquina Misteriosa (1)"
22060-2 = "(Certo dia, a Veritas entrou em contato comigo...)"
22060-10 = "[ns] \"O que houve assim de repente?\""
22060-11 = "Sensei, escuta só! A gente fez a \"descoberta do século\"!!"
22060-12 = "É algo incrível demais...!! Pode ser uma descoberta histórica que vai entrar pra história de Kivotos!!"
22060-13 = "[s] \"...Uma descoberta histórica?\""
22060-14 = "Maki, isso já é exagero demais."
22060-15 = "A Hare tem razão.#nÉ verdade que encontramos algo bem incomum, mas..."
22060-16 = "A maior parte das coisas que aparecem em Millennium costuma ser sucata,#nentão, estatisticamente, é bem provável que isso também seja."
22060-17 = "Poxa~! Vocês bem que podiam ter um pouco mais de espírito aventureiro, né?#nPerguntei pra várias pessoas e ninguém nunca viu nada parecido."
22060-18 = "Bom, isso é verdade..."
22060-19 = "A Maki até que tem um ponto, mas..."
22060-20 = "[s] \"O que exatamente vocês encontraram?\""
22060-21 = "Hmm... É meio difícil de explicar só com palavras."
22060-22 = "Como a Maki disse, é um objeto diferente de tudo o que já vimos..."
22060-23 = "Como é difícil para nós avaliarmos sozinhas, gostaríamos que o Sensei viesse ver pessoalmente."
22060-24 = "Então é isso... Sensei, você tem um tempinho?"
22060-25 = "[s] \"Tenho, sim.\""
22060-26 = "Beleza, vamos te esperar na sala da Veritas."
22060-27 = "Oba! Se o Sensei vai vir, vamos fazer uma festa!"
22060-28 = "Sim. Vamos pedir pizza."
22060-29 = "Não, isso já é exagero..."
22060-32 = "(Assim que cheguei à sala da Veritas...)"
22060-33 = "Ah! Aris avistou o Sensei!"
22060-41 = "...Ué?"
22060-42 = "O-Olá..."
22060-44 = "E aí, Sensei!"
22060-45 = "...O que está fazendo aqui?"
22060-46 = "[s] \"E aí. A Veritas me chamou... O Clube de Desenvolvimento de Jogos também?\""
22060-47 = "Aham! Parece que a Maki achou uma coisa superinteressante!"
22060-49 = "Achamos que talvez pudéssemos tirar alguma inspiração disso."
22060-50 = "Como pode acontecer um evento importante, hoje a Yuzu também veio!"
22060-51 = "Sim... s-se puder render boas ideias...#nMas v-vir até aqui foi... um pouco..."
22060-52 = "...muito difícil..."
22060-53 = "Falta só mais um pouquinho, Yuzu!"
22060-54 = "É, força."
22060-56 = "Aris vai segurar firme para a Yuzu não desmaiar!"
22060-57 = "O-Obrigada, pessoal..."
22060-58 = "[s] \"Então, vamos entrar?\""
22060-63 = "Opa! Podem entrar!"
22060-71 = "E aí! Com licença!"
22060-72 = "O membro do grupo que se juntou no caminho, o Sensei, também está conosco."
22060-74 = "Parece que chegaram na hora certa."
22060-75 = "E aí~! Quanto tempo!"
22060-76 = "(Faz uma reverência)"
22060-77 = "[s] \"E aí~.\""
22060-79 = "Então, Hare-senpai. Cadê a tal coisa?"
22060-80 = "Ah, quanto a isso..."
22060-81 = "Isto aqui."
22060-91 = "(O que Hare nos mostrou era um robô de formato bizarro.)"
22060-92 = "(Olhando com mais atenção, havia um total de 5 robôs espalhados pela sala do clube.)"
22060-93 = "[s] \"Onde vocês encontraram isso...?\""
22060-95 = "Todos foram encontrados nos arredores do distrito escolar de Millennium."
22060-96 = "E isso não é tudo, ainda tinha pelo menos mais 20 lá!"
22060-97 = "[s] \"A aparência deles é meio...\""
22060-98 = "Eles meio que parecem peixes abissais, né?"
22060-99 = "Bom, até parecem robôs, mas..."
22060-100 = "Mas é meio estranho, né?#nNão tem nenhum drone feito em Millennium com esse formato."
22060-101 = "Eles têm um visual bem peculiar."
22060-102 = "Hmm, peculiar não sei... É meio..."
22060-107 = "[ns] (Meio sinistro, talvez...)"
22060-108 = "Q-Que susto! Não tem nada a ver com o que eu estava imaginando!"
22060-110 = "É tipo assistir a um filme de comédia e ele virar terror do nada...!#nQue negócio é esse?!"
22060-111 = "Será que esses robôs foram mesmo feitos em Millennium...?"
22060-112 = "Hare-senpai, em que estado eles estão agora?"
22060-113 = "Se a gente se esforçar, será que dá pra ligar...?"
22060-115 = "......"
22060-117 = "Nós também demos uma olhada geral neles."
22060-118 = "Como estavam bem conservados, a gente achou que talvez desse pra ligar."
22060-119 = "Mas, no fim, não encontramos nada."
22060-120 = "[s] \"Como assim...?\""
22060-121 = "Após examinarmos, não encontramos nem um botão de ligar, muito menos uma porta de conexão."
22060-122 = "Antes disso, não há nem sequer uma emenda na superfície."
22060-123 = "Como não dá para abrir, não sabemos se o motivo de não ligar é hardware ou software..."
22060-124 = "Na verdade, nem sabemos se está realmente quebrado..."
22060-130 = "Por isso chamamos o Sensei."
22060-131 = "Sim. Pensamos em pedir a colaboração da Schale caso seja algo perigoso."
22060-135 = "Pensando por esse lado, chamar o Clube de Desenvolvimento de Jogos também não faz muito sentido."
22060-136 = "Ahaha. Bom, aproveitei o embalo.#nEssas coisas ficam mais divertidas vendo em grupo, né?"
22060-141 = "......"
22060-146 = "E aí, Sensei? Conseguiu descobrir alguma coisa?"
22060-147 = "[s] \"...Hmm, acho que não sei.\""
22060-148 = "É, não teve jeito mesmo.#nEu achei que o Sensei talvez soubesse..."
22060-149 = "Será que só resta perguntar pra presidente...?#nSe não me engano, ela gostava dessas coisas de ocultismo."
22060-150 = "Ocultismo, é..."
22060-151 = "Ou pra vice-presidente, talvez?#nA vice-presidente com certeza conseguiria descolar alguma informação~!"
22060-152 = "Não adianta ficar falando de quem não está aqui agora."
22060-153 = "Mais do que não estar aqui, a presidente mal aparece, pra começo de conversa."
22060-155 = "...Ah."
22060-159 = "O que foi? Aconteceu alguma coisa?"
22060-162 = "Aris..."
22060-163 = "Aris... já viu isso antes."
22060-164 = "Aris-chan...?"
22060-166 = "Isto... é..."
22060-180 = "Hein?! O quê?! Ligou?!"
22060-181 = "Hein?!"
22060-182 = "Hã? O que é, o que é?!"
22060-188 = "Esse som..."
22060-189 = "Mana, está saindo som de videogame?"
22060-190 = "Hã?"
22060-196 = "Ah, é verdade.#nNão ligava de jeito nenhum até agora... Por que será?"
22060-198 = "E-Espera... tem algo... estranho com a Aris-chan."
22060-199 = "Aris...?"
22060-200 = "......"
22060-204 = "<<<Minha...>>>"
22060-206 = "[ns] \"Aris?\""
22060-208 = "<<<Minha preciosa...>>>"
22060-211 = "...Iniciando ativação."
22060-212 = "...Aris?"
22060-221 = "Uau! Por que começou a se mexer do nada?!#nKotama-senpai, você fez alguma coisa?!"
22060-222 = "Não fui eu, Maki. Eu não fiz nada..."
22060-223 = "...Cuidado! Tem alguma coisa muito errada!"
22060-225 = "<<<Ó minha preciosa...>>>"
22060-227 = "[ns] \"Mas o que é isso...\""
22060-229 = "...Codinome \"AL-1S\", ativação concluída."
22060-236 = "Executando o protocolo ATRAHASIS."
22060-237 = "[ns] \"...!\""
