[translation]
22060-1 = "Эпизод 6; Странная машина 1"
22060-2 = "Однажды я получил сообщение от Веритас."
22060-4 = ""
22060-9 = ""
22060-10 = "[ns] «Что случилось, девочки?»"
22060-11 = "Сенсей, Сенсей! Мы нашли нечто совершенно безумное!"
22060-12 = "Настолько безумное, что наше открытие вполне могут вписать в учебники истории Кивотоса!"
22060-13 = "[s] «Что ты имеешь в виду?»"
22060-14 = "Маки, ты как всегда драматизируешь."
22060-15 = "Согласна с Харе, Маки. Да, это интересно, но..."
22060-16 = "Учитывая, сколько всего можно найти в Миллениуме, весьма вероятно, что это вообще ничего особенного."
22060-17 = "Ну вы и зануды! Сами же сказали, что никогда ничего подобного не видели!"
22060-18 = "Ну... пожалуй..."
22060-19 = "Тут не поспоришь."
22060-20 = "[s] «Что вы нашли?»"
22060-21 = "Хм... Если честно, это сложно объяснить."
22060-22 = "Как сказала Маки, мы никогда не видели ничего подобного, Сенсей."
22060-23 = "Мы сами не поняли, на что смотрим, поэтому хотели, чтобы вы тоже взглянули."
22060-24 = "У вас есть время, Сенсей?"
22060-25 = "[s] «Ну, ради такого я найду время.»"
22060-26 = "Отлично. Мы все сейчас в клубной комнате Веритас."
22060-27 = "Сенсей придёт? Круто, будет тусовка!"
22060-28 = "Да. Тогда я закажу пиццу."
22060-29 = "Только не ты тоже, Котама..."
22060-32 = "По пути к клубной комнате Веритас я заметил несколько знакомых лиц."
22060-33 = "Смотрите! Это Сенсей!"
22060-34 = ""
22060-38 = ""
22060-39 = ""
22060-40 = ""
22060-41 = "А?"
22060-42 = "З-Здрасьте..."
22060-43 = ""
22060-44 = "Привет, Сенсей!"
22060-45 = "...А? Что вы здесь делаете, Сенсей?"
22060-46 = "[s] «Мне позвонили из Веритас. Вас тоже позвали?»"
22060-47 = "Ага! Маки сказала, что нашла кое-что крутое!"
22060-48 = ""
22060-49 = "Мы подумали, что сможем почерпнуть вдохновение для нашей игры."
22060-50 = "Это может оказаться событием основного квеста, поэтому сегодня даже Юзу пришла!"
22060-51 = "Да... Е-Если нам удастся найти хорошие идеи... то то, что я пришла сюда..."
22060-52 = "...будет не зря... хотя добраться было непросто..."
22060-53 = "Мы почти пришли, Юзу!"
22060-54 = "Ты справишься!"
22060-55 = ""
22060-56 = "Юзу, я буду держать тебя, чтобы ты не упала!"
22060-57 = "С-Спасибо всем вам..."
22060-58 = "[s] «Если все готовы, давайте зайдём!»"
22060-59 = ""
22060-63 = "Они пришли! Пришли! Заходите!"
22060-64 = ""
22060-71 = "Департамент Разработки Игр прибыл!"
22060-72 = "Сенсей тоже присоединился к нашей группе!"
22060-74 = "Вы как раз вовремя!"
22060-75 = "Всем привет! И вам привет, Сенсей!"
22060-76 = "*кланяется*"
22060-77 = "[s] «Спасибо, что позвали.»"
22060-79 = "Ну так что за великое открытие, Харе?"
22060-80 = "А, ну..."
22060-81 = "Вот это."
22060-82 = ""
22060-84 = ""
22060-91 = "Харе показала нам странного робота."
22060-92 = "Вообще-то он был не один — по клубной комнате Веритас было разбросано целых пять роботов."
22060-93 = "[s] «...Роботы? Где вы их нашли?»"
22060-95 = "Мы нашли их на окраине школьного района Миллениума."
22060-96 = "И это далеко не все, Сенсей. На окраине осталось ещё как минимум двадцать."
22060-97 = "[s] «Выглядят они как-то...»"
22060-98 = "Разве этот не похож на гигантского кальмара, выброшенного на берег из морских глубин?"
22060-99 = "Ну, судя по внешнему виду, нет причин не называть это роботом, но..."
22060-100 = "Странно, правда? В Миллениуме мы никогда не видели таких дронов."
22060-101 = "Весьма необычно."
22060-102 = "Не знаю, стоит ли называть это необычным, или..."
22060-103 = ""
22060-106 = ""
22060-107 = "[ns] «(Я бы скорее сказал — гротескным...)»"
22060-108 = "Ого! Я совсем не ожидала увидеть такое!"
22060-110 = "Это как... купить билет на комедию и попасть на фильм ужасов..."
22060-111 = "Э-Эти роботы точно были сделаны в Миллениуме...?"
22060-112 = "В каком они состоянии, Харе?"
22060-113 = "Оу... Они не работают? Интересно, можно ли как-нибудь снова их запустить."
22060-115 = "..."
22060-117 = "Мы уже пробовали. Много раз."
22060-118 = "С виду они были в отличном состоянии, поэтому мы решили, что сумеем снова их запустить."
22060-119 = "Но мы даже не смогли понять, с чего начать."
22060-120 = "[s] «В смысле?»"
22060-121 = "Ни на одном нет кнопки питания или разъёма для подключения внешнего источника энергии."
22060-122 = "И нет никаких швов, по которым их можно было бы открыть."
22060-123 = "Если мы не можем их вскрыть, то не поймём, проблема в питании или в программном обеспечении."
22060-124 = "Может, они просто сломаны. Без понятия."
22060-125 = ""
22060-128 = ""
22060-129 = ""
22060-130 = "Поэтому мы и позвали вас, Сенсей!"
22060-131 = "Мы подумали, что на всякий случай стоит вызвать Шале — вдруг они опасны."
22060-132 = ""
22060-134 = ""
22060-135 = "Я всё ещё не понимаю, зачем ты позвала Департамент Разработки Игр, Маки."
22060-136 = "Хи-хи. Мне показалось, это довольно круто, а чем больше народу, тем веселее!"
22060-137 = ""
22060-139 = ""
22060-141 = "..."
22060-142 = ""
22060-146 = "Итак, что думаете, Сенсей?"
22060-147 = "[s] «...Не уверен.»"
22060-148 = "Серьёзно?! Эх, а мы думали, Сенсей что-нибудь знает!"
22060-149 = "Для такой странной штуки лучше всего подошла бы Химари. Она ведь увлекается оккультизмом и всем таким."
22060-150 = "Оккультизмом? Хмм..."
22060-151 = "Или, может, вице-президент Чихиро смогла бы быстро найти информацию!"
22060-152 = "Но её здесь нет, так что толку..."
22060-153 = "Мы уже давно не видели президента Химари..."
22060-155 = "...Ах."
22060-156 = ""
22060-159 = "А? Алиса, что-то не так?"
22060-161 = ""
22060-162 = "Я..."
22060-163 = "Я уже видела это раньше."
