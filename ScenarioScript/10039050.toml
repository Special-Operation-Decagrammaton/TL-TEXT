[translation]
10039050-1 = "Эпизод 5;Прелюдия к войне"
10039050-3 = "*тяжело дышит* *пыхтит* *тяжело дышит*"
10039050-4 = ""
10039050-11 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
10039050-12 = ""
10039050-17 = "П-Подождите...! Пожалуйста, остановитесь на минутку!"
10039050-18 = ""
10039050-20 = ""
10039050-21 = "Хм? Что случилось, Сакурако?"
10039050-22 = "Музыка слишком громкая? Можем сделать потише."
10039050-23 = "Нет, дело не в этом. Просто... Это вообще не имеет смысла!"
10039050-24 = "Это ведь тренировка, верно? Мы отрабатываем танец, который выучили у преподавателя?"
10039050-25 = "Эм..."
10039050-26 = "Да, всё так. В чём проблема?"
10039050-27 = "Ну... я не эксперт, но немного поискала информацию в интернете. И вот что выяснила..."
10039050-28 = "...профессиональные идолы на тренировках носят спортивные костюмы или другую спортивную одежду."
10039050-29 = "Они НЕ тренируются вот так, в полном сценическом костюме."
10039050-31 = "И что ты хочешь этим сказать?"
10039050-32 = "Что хочу сказать...?! Я только что сказала!"
10039050-33 = "Разве не было бы удобнее тренироваться в более подходящей одежде?"
10039050-34 = "Да, но именно поэтому мы этого и не делаем."
10039050-35 = "Если позволим себе слишком расслабиться, не сможем нормально тренироваться."
10039050-36 = "Что? Это же нелепо..."
10039050-37 = "Сакурако, ты когда-нибудь слышала выражение..."
10039050-38 = "«...Тренируйся так, словно это настоящее выступление, а настоящее выступление воспринимай как тренировку»?"
10039050-39 = "...! Н-Ну...!"
10039050-40 = "Я понимаю твою мысль, Сакурако, но мы с тобой НЕ профессионалы."
10039050-41 = "Они уже умеют двигаться в костюмах, поэтому им нужно выучить ТОЛЬКО танец. А мы пока не научились ни тому, ни другому."
10039050-42 = "Ну, возможно, это и правда так, но всё равно ощущается так странно..."
10039050-44 = "Я сказала: «Тренируйся так, словно это настоящее выступление!»"
10039050-45 = "Уф... Видимо, повторение — мать учения..."
10039050-46 = "Как ни крути, очевидно, что мы учимся слишком медленно."
10039050-47 = "Такими темпами мы вообще не успеем подготовиться!"
10039050-48 = "Интересно, может, Мари сможет что-то посоветовать—"
10039050-49 = "Ты снова хочешь нагрузить Мари?!"
10039050-50 = "Ну...!"
10039050-51 = "Она дала нам всё, что здесь есть, а ты ещё осмеливаешься просить БОЛЬШЕ?!"
10039050-52 = "Сколько ты собираешься просить у неё на этот раз? Она что, решает за тебя ВСЕ проблемы?!"
10039050-53 = "Н-Нет, я не хотела сказать—"
10039050-54 = "Неважно, что ты хотела сказать: каждый раз, когда ты к ней обращаешься, именно ЭТО и происходит!"
10039050-55 = "Разве не ты старше и выше по положению?! Ты должна понимать, что твои слова и поступки влияют на других!"
10039050-56 = "Ну... я действительно просила её о помощи НЕСКОЛЬКО раз..."
10039050-57 = ""
10039050-59 = ""
10039050-60 = "Но... хорошо. Возможно, Сенсей сможет помочь."
10039050-61 = "И ты ВСЁ ЕЩЁ ничего не поняла!"
10039050-62 = "Ч-Чего я не понимаю?"
10039050-63 = "Ты слишком быстро и слишком легко просишь помощи! У других, у интернета..."
10039050-64 = "Нет ничего постыдного в том, чтобы обратиться за помощью, когда она ДЕЙСТВИТЕЛЬНО нужна, но это должен быть последний выход, а не первый!"
10039050-65 = "Ты понимаешь? Мы уже слишком многого попросили у Мари и Сенсея."
10039050-66 = "С этого момента это наша задача, наше путешествие! Какие бы испытания ни выпали, мы справимся сами. Даже не думай больше бежать от вызова, Сакурако."
10039050-68 = "Уф!"
10039050-69 = "Ладно, это очень вдохновляюще, но факт остаётся фактом: дедлайн приближается, а времени на подготовку не хватает!"
10039050-70 = "Это правда."
10039050-71 = "Поверь, меня это тоже беспокоит, но даже так мы больше не должны создавать проблемы другим."
10039050-72 = "Более того, даже если нам предложат помощь, мы откажемся и продолжим сами."
10039050-73 = "Тогда наши товарищи и все, кто уже помог нам, будут смотреть выступление с гордостью и уважением."
10039050-74 = "Ну что..."
10039050-75 = "Так что держи строй, ни к кому не обращайся, и даже если придёт сообщение — игнорируй его."
10039050-76 = "Только до выступления. И всё."
10039050-77 = "Я понимаю."
10039050-78 = "Хм..."
10039050-79 = "...Но проблема всё та же."
10039050-80 = "Мы едва можем двигаться в этих костюмах, не можем держать ритм..."
10039050-81 = "...и, что важнее, мы в принципе не понимаем, что ТАКОЕ поп-идол."
10039050-82 = "Хм..."
10039050-83 = "Не сказала бы, что я совсем ничего не понимаю. Я иногда слушаю песни идолов и время от времени смотрю их трансляции."
10039050-84 = "Тогда, может, ты знаешь, чего нам не хватает. Что есть у других групп, но нет у нашей."
10039050-85 = "Хм, ну..."
10039050-86 = "Да?"
10039050-87 = "...Ах."
10039050-88 = "...«А»?"
10039050-89 = "Что такое, капитан?"
10039050-90 = "Хм... Дай подумать..."
10039050-91 = "...Да. Да, это действительно многое изменило бы."
10039050-92 = "Что именно изменило бы?"
10039050-93 = "Ты права, Сакурако. Нам кое-чего не хватает."
10039050-94 = "Чего-то, что объединит нас и, так сказать, синхронизирует."
10039050-95 = ""
10039050-97 = ""
10039050-98 = "У нас нет лидера."
10039050-99 = "Лидера?"
10039050-100 = "Вроде начальника?"
10039050-101 = "В каком-то смысле. Кого-то, кто направит нашу группу в одну сторону и сохранит гармонию несмотря на различия."
10039050-102 = "Теперь это кажется очевидным. Как в нашей группе может быть порядок, если никто ею не руководит?"
10039050-103 = "Хм, логично. Любой организации нужно какое-то руководство."
10039050-104 = "Но кто тогда будет вести нас? Вы, капитан Минэ, раз знаете больше меня?"
10039050-105 = "Возможно, я и знаю больше, но нет, это не ответ."
10039050-106 = "Одних знаний и опыта недостаточно, чтобы быть лидером."
10039050-107 = "Мы начали этот проект по твоей инициативе. Возможно, эта роль лучше подходит тебе."
10039050-108 = "Вопрос сложный. Не стоит отвечать поспешно."
10039050-109 = "Давай возьмём немного времени и приведём мысли в порядок."
10039050-110 = "Кстати, ты выглядишь немного уставшей. Отдохнём, пока будем думать?"
10039050-112 = "Я пыталась это скрыть, но вы, видимо, сразу всё заметили."
10039050-113 = "Хорошо, тогда отдохнём."
10039050-114 = "После того как... снимем эти костюмы."
10039050-116 = ""
10039050-117 = ""
10039050-118 = ""
10039050-119 = ""
10039050-122 = ""
10039050-123 = "...И правда."
10039050-124 = "Через два часа. Площадь Тринити, у центрального фонтана."
10039050-125 = "Хорошо. Встретимся там..."
10039050-127 = "...и выясним, кто достоин называться «старшей.»"
10039050-128 = ""
10039050-131 = ""
10039050-133 = "Хорошо сказано, но помни..."
10039050-134 = "...это должно остаться тайной, даже от Сенсея."
10039050-135 = "Никто больше не должен знать."
10039050-136 = "Тайная встреча один на один, чтобы решить, кто будет вести нас обеих..."
10039050-137 = ""
10039050-139 = ""
10039050-140 = "У тебя очень своеобразная манера выражаться, знаешь?"
10039050-141 = "Хм? Какие именно слова?"
10039050-142 = "О, неважно. До встречи. Не опаздывай."
10039050-143 = "До скорого..."
10039050-144 = ""
10039050-146 = ""
10039050-147 = ""
10039050-148 = ""
10039050-149 = ""
10039050-151 = "А?"
10039050-153 = ""
10039050-157 = ""
10039050-158 = "...Наконец-то тихий и спокойный день."
10039050-159 = "Погода ясная, Карнавал идёт гладко..."
10039050-160 = "...другие студенты взяли на себя участие..."
10039050-161 = "...словно даже вкус чёрного чая стал глубже."
10039050-162 = "Конечно, вкус чая зависит не только от самого чая..."
10039050-163 = ""
10039050-165 = ""
10039050-166 = "*вздыхает*"
10039050-167 = "Жаль, Мики здесь нет. Наверное, где-то гуляет."
10039050-168 = "А Сейя просто отдыхает у себя в комнате. Жаль. Она составила бы здесь хорошую компанию."
10039050-169 = "В такой прекрасный день..."
10039050-170 = "В этот мирный солнечный день, когда ничего не происходит..."
10039050-171 = "Хм..."
10039050-172 = "Я ведь всегда вызываю их сюда и заставляю приходить ко мне."
10039050-173 = "Для разнообразия мне самой стоит навестить их."
10039050-174 = "Если день останется спокойным, пойду их поищу."
10039050-175 = ""
10039050-179 = ""
10039050-181 = "Нагиса! Н-Нагиса...!"
10039050-182 = "*вздыхает* Сколько раз я просила тебя не врываться вот так?"
10039050-183 = "Ты полноправный член Чаепития. Пожалуйста, помни о приличиях!"
10039050-184 = "Прости, Нагиса..."
10039050-185 = "Н-Но учитывая обстоятельства...!"
10039050-186 = "...Какие обстоятельства?"
10039050-187 = "Что происходит?"
10039050-188 = "Если это связано с Карнавалом, я уже сказала вам помогать по необходимости и позволить остальным студентам наслаждаться праздником."
10039050-190 = "Дело не в этом... Пришёл доклад от разведки..."
10039050-191 = "От разведки?"
10039050-192 = "Да, только что."
10039050-193 = "Утадзуми Сакурако из Сестринства и Аомори Минэ из Рыцарей скорой помощи..."
10039050-194 = "...через два часа встретятся на площади Тринити... чтобы определить единого лидера для обеих групп!"
10039050-195 = ""
10039050-197 = ""
10039050-198 = "..."
10039050-199 = "...Что?"
10039050-200 = "Что ты имеешь в виду? Сестринство и... Рыцари скорой помощи...?"
10039050-201 = "Один лидер на обе группы...? Почему вдруг?"
10039050-202 = "Ну, всех подробностей мы пока не знаем..."
10039050-203 = "...но судя по тому, что удалось подслушать, они говорили так, будто речь идёт о какой-то дуэли..."
10039050-204 = "Дуэли?"
10039050-205 = ""
10039050-207 = ""
10039050-208 = "Опять же, зачем им вообще единый лидер? И почему именно сейчас?"
10039050-209 = ""
10039050-211 = ""
10039050-213 = "(...Постойте...)"
10039050-214 = "(«Почему именно сейчас?» Сейчас, когда силы Чаепития растянуты из-за подготовки к Карнавалу...?)"
10039050-215 = "(Если они объединятся в такой момент, их численность намного превзойдёт нашу.)"
10039050-216 = "(...)"
10039050-217 = "(......)"
10039050-218 = "*ахает*"
10039050-220 = "Ах, нет. Нельзя делать поспешных выводов..."
10039050-221 = "В конце концов, я уже переросла такое."
10039050-222 = "Будем верить в добрые намерения наших товарищей."
10039050-223 = "...Я просто позвоню им и устраню любое недоразумение."
10039050-224 = ""
10039050-226 = ""
10039050-228 = ""
10039050-229 = "...Хм, Сакурако, похоже, недоступна."
10039050-230 = "А Минэ...?"
10039050-231 = ""
10039050-233 = ""
10039050-235 = ""
10039050-236 = "...Принято."
10039050-237 = "Хорошо, отправлю сообщение в MomoTalk."
10039050-238 = "«Это Кирифуджи Нагиса... из Чаепития...»"
10039050-239 = "«Прошу простить за внезапное сообщение, но... ходят странные слухи...»"
10039050-240 = "«Якобы вы с Сакурако запланировали какую-то личную встречу. Не могли бы вы рассказать подробнее?»"
10039050-241 = "Отправка..."
10039050-242 = ""
10039050-246 = ""
10039050-247 = "О! Ответ..."
10039050-248 = "И ответ такой..."
10039050-249 = "«Спасибо за беспокойство, но...»"
10039050-250 = "«...это действительно личный вопрос между мной и Сакурако. Чаепитию не стоит о нём беспокоиться.»"
10039050-251 = "..."
10039050-252 = ""
10039050-254 = ""
10039050-255 = "Н-Нагиса...?"
10039050-256 = "..."
10039050-257 = "Нагиса. Что будем делать? Нагиса...?"
10039050-258 = "..."
10039050-259 = "...Мика."
10039050-260 = "...Что?"
10039050-261 = ""
10039050-264 = "Найди Мику. Иди. Прямо сейчас."
10039050-266 = "Я гулял по кампусу Тринити, осматривая мероприятия и выступления студентов."
10039050-267 = ""
10039050-270 = "[ns1] «(Здесь столько всего интересного.)»\n[ns2] «(Большая школа — большие мероприятия.)»"
10039050-275 = "[ns3] «(Хм? Кто звонит?)»\n[ns4] Ответить на звонок."
10039050-279 = "...Сенсей?"
10039050-280 = "Сенсей!"
10039050-281 = "Хорошо, вы там."
10039050-282 = "[s5] «Мари? Что случилось?»\n[s6] «Что происходит? Это ветер я слышу?»"
10039050-285 = "Простите, что звоню вот так, но это ОЧЕНЬ срочно!"
10039050-286 = ""
10039050-290 = "Надеюсь, вы слышите меня сквозь ветер. Я на мотоцикле!"
10039050-291 = ""
10039050-294 = "[ns7] «...Что?»\n[ns8] «Ты на чём?»"
10039050-297 = "Могу попросить вас встретиться со мной в одном месте?"
10039050-298 = "Всё расскажу лично. Времени мало..."
10039050-299 = "Я не знаю ТОЧНО, что происходит, но люди говорят, что творится безумие!"
10039050-300 = "То есть..."
10039050-301 = "Тринити... Сегодня, кажется..."
10039050-302 = ""
10039050-305 = "Мне кажется, они собираются начать гражданскую войну!"
