[translation]
10025010-1 = "Эпизод 1;Милые купальники в уродливом городке"
10025010-2 = "Въезд в деревню Ятоура"
10025010-5 = ""
10025010-6 = ""
10025010-7 = ""
10025010-9 = ""
10025010-11 = ""
10025010-12 = ""
10025010-13 = ""
10025010-15 = "...Моэ. Ты ведь понимаешь, что мы на задании?"
10025010-16 = "Хм? И что ты хочешь этим сказать?"
10025010-18 = "Где твои очки? И серверный терминал?"
10025010-19 = "Кто плавает в очках? Я надела линзы."
10025010-20 = "А серверный терминал не водонепроницаемый. Подключаюсь удалённо со смартфона."
10025010-21 = "Не так стабильно, как через терминал, но работает..."
10025010-22 = "Ты ведь понимаешь, что мы на самом деле не в отпуске?"
10025010-24 = "Это задание!"
10025010-25 = "Нам нужна максимальная оперативная эффективность, а ты оставила снаряжение, чтобы поплавать?"
10025010-26 = ""
10025010-28 = ""
10025010-30 = "Вообще-то для этой миссии Моэ сделала правильный выбор."
10025010-31 = ""
10025010-34 = ""
10025010-35 = "По легенде мы обычные туристки. Любое оборудование, которое выдаёт в нас спецназ, разрушит прикрытие."
10025010-36 = "Если действовать строго по инструкции, оно поможет в бою, но может помешать в остальных аспектах задания."
10025010-37 = ""
10025010-40 = ""
10025010-41 = ""
10025010-42 = "...А что это за купальник на тебе?"
10025010-43 = "Эм... С ним что-то не так? Я думала, он милый..."
10025010-44 = "Нет-нет, он милый. Но..."
10025010-45 = "В нём разве не трудно двигаться? С таким количеством оборок наверняка неудобно."
10025010-46 = "И зачем тебе надувной круг?"
10025010-47 = "Ты же сдала экзамен по плаванию в SRT?"
10025010-48 = "А... Это... Это снаряжение для задания..."
10025010-50 = "Да ладно, часто ли мы вообще бываем на пляже? Дай нашему храброму лидеру хоть немного показать свою милую сторону."
10025010-52 = "Моэ!"
10025010-54 = "А давайте посмотрим на ТВОЙ наряд, Саки. Что это за... всё?"
10025010-55 = "Спортивная сумка... подсумки для магазинов... И это панама-буни?"
10025010-56 = "В таком виде ты скорее собралась взорвать пирс, чем любоваться видами."
10025010-57 = "Прошу прощения? Я сократила снаряжение до абсолютного минимума, чтобы не разрушить маскировку!"
10025010-58 = "Но даже под прикрытием я не могу оставить необходимое оборудование."
10025010-59 = "Пуленепробиваемая панама, дополнительные патроны, бутылка воды для поддержания водного баланса и снаряжение для дайвинга — на всякий случай..."
10025010-60 = "..."
10025010-61 = "Можно хотя бы взять обычную спортивную сумку? Что-нибудь менее военное?"
10025010-62 = "В смысле? Это моя личная спортивная сумка!"
10025010-63 = ""
10025010-65 = ""
10025010-67 = ""
10025010-68 = "П-Простите, что опоздала! Подготовка заняла больше времени, чем я думала..."
10025010-69 = "Снайперское снаряжение я спрятала в эту рыболовную сумку. Н-Не слишком странно выглядит...?"
10025010-70 = "А ещё мне показалось, что рыболовные снасти выглядят слишком новыми, поэтому я состарила их, потерев песком на ближайшем пляже—"
10025010-71 = ""
10025010-73 = ""
10025010-74 = ""
10025010-75 = ""
10025010-77 = "Эм...? Почему вы все так на меня смотрите?"
10025010-79 = "Так вот как выглядит настоящее проникновение. Я и близко так не смогла."
10025010-80 = "В умении сливаться с окружением никто не сравнится с Мию."
10025010-82 = "П-Пожалуйста, перестаньте на меня смотреть...!"
10025010-83 = ""
10025010-85 = ""
10025010-88 = ""
10025010-89 = "[ns1] «О, вы все переоделись!»\n[ns2] «Отлично выглядите в купальниках.»"
10025010-93 = "А, спасибо..."
10025010-94 = "Я-я рада это слышать..."
10025010-96 = "Просто несколько девушек, готовых провести день на пляже... плюс одна чудачка, экипированная для триатлона."
10025010-97 = "...Ты уже донесла свою мысль."
10025010-98 = "Прости, что не нарядилась красиво, как остальные."
10025010-99 = "[s3] «Не будь к себе так строга, Саки!»\n[s4] «По-моему, твой купальник ничуть не хуже.»"
10025010-103 = ""
10025010-105 = ""
10025010-106 = ""
10025010-107 = ""
10025010-108 = ""
10025010-109 = "Не уверена, радоваться этому или нет..."
10025010-110 = "Если вы имеете в виду, что я выгляжу как обычная туристка, тогда... спасибо."
10025010-111 = ""
10025010-113 = ""
10025010-115 = ""
10025010-116 = "Похоже, все готовы, так что проведём короткий инструктаж."
10025010-117 = "Цель операции — проникнуть в деревню Ятоура и выяснить, что происходит с креветками."
10025010-118 = "Чтобы добиться успеха, понадобится сотрудничество местных. Постарайтесь не вызывать у них лишних подозрений."
10025010-119 = "П-Простите, что перебиваю, но..."
10025010-121 = "По-моему... мы уже привлекаем внимание..."
10025010-122 = ""
10025010-124 = ""
10025010-125 = ""
10025010-126 = ""
10025010-127 = ""
10025010-129 = ""
10025010-130 = "...Похоже, местные вообще не привыкли видеть здесь купающихся."
10025010-132 = "Да. Конечно мы выделяемся, раз ходим по деревне в купальниках. Здесь нет нормальной туристической инфраструктуры."
10025010-133 = "Разве этот г-городок не немного... жуткий? Напоминает фильм ужасов..."
10025010-135 = "...Странновато для приморского городка, да?"
10025010-137 = "Согласно моим данным, раньше деревня Ятоура была популярна среди туристов благодаря своей природной красоте."
10025010-138 = "Всё изменилось после открытия рыбоперерабатывающего завода. Туризм после этого почти полностью исчез."
10025010-139 = "[s] «...Может, вам всё-таки стоило оставить школьную форму.»"
10025010-140 = "Нет. В форме SRT мы выглядели бы ещё подозрительнее."
10025010-141 = "Это может осложнить расследование, но придерживаемся исходной легенды."
10025010-142 = "Я опрошу рыбаков в порту. Саки, узнай в местной службе, не происходило ли недавно каких-нибудь происшествий."
10025010-144 = "Поняла."
10025010-146 = "Моэ, проверь записи камер наблюдения на предмет подозрительной активности. А Мию, поспрашивай, не приезжали ли сюда ещё люди извне."
10025010-148 = "Х-Хорошо!"
10025010-149 = "Оставь мне!"
10025010-151 = "Задачи получили. Начинаем!"
