[translation]
21050-1 = "Эпизод 5;Я, Алиса..."
21050-2 = "Департамент Разработки Игр Милленниума"
21050-3 = ""
21050-4 = "Не знаю насчёт этого."
21050-5 = "Правда всё будет нормально, если мы выдадим её за участницу клуба?"
21050-6 = "Нормально? Проверка значения. Состояние, лишённое отрицательных свойств или проблем. Подтверждено."
21050-7 = "Так не сработает! Она раскроется в ту же секунду, как откроет рот!"
21050-8 = "Безнадёжно. Нам такое не провернуть!"
21050-10 = "Придётся. Я сделаю всё, что угодно, если это спасёт Департамент Разработки Игр."
21050-11 = "Юзу не может вернуться в общежитие. Если мы этого не сделаем... ей будет некуда идти."
21050-12 = "..."
21050-13 = "Это правда..."
21050-15 = ""
21050-16 = "Думаю, внешне она проходит. Теперь ей нужны только оружие и студенческий билет."
21050-17 = "Я займусь регистрацией и сделаю ей билет."
21050-18 = "Мидори, научи Алису нормально разговаривать с Юзу."
21050-19 = "Разговаривать?"
21050-20 = "Как ты сама сказала, она не звучит как обычный студент."
21050-21 = "Нам уже давно говорят, что наш клуб не может набрать новых участников, потому что у нас нет друзей."
21050-22 = "Так что если Юука спросит Алису, правда ли она состоит в Департаменте Разработки Игр, а Алиса ответит что-нибудь вроде..."
21050-24 = ""
21050-25 = "\"Подтверждаю. Алиса является собственностью, зарегистрированной за Департаментом Разработки Игр. Бип-буп\"."
21050-26 = "...Это вызовет вопросы."
21050-27 = "Ну да, но..."
21050-28 = "*вздыхает*"
21050-29 = "Окей. Я попробую."
21050-30 = "Отлично! Рассчитываю на тебя!"
21050-33 = "П-Погоди!"
21050-34 = "Эм..."
21050-36 = "...?"
21050-37 = "Ээ, так... Алиса?"
21050-38 = "Подтверждаю. Алиса — установленное имя данной единицы."
21050-39 = "Хмм... Я даже не помню, как сама научилась разговаривать. Наверное, просто переняла это, смотря телевизор и слушая других."
21050-40 = "Хм. Может, в интернете найдётся какая-нибудь обучающая программа для детей."
21050-41 = ""
21050-42 = ""
21050-43 = "*осматривается*"
21050-44 = "...?"
21050-45 = "Запрос. Пожалуйста, подтвердите личность объекта."
21050-46 = "А?"
21050-47 = "Т-Ты про это?!"
21050-48 = ""
21050-51 = "А. Это. Немного неловко, но вообще-то игру на обложке сделали мы. Она получила кучу ужасных отзывов."
21050-52 = "О, точно!"
21050-53 = "Я не горжусь тем, что она выиграла \"Худшую игру года\"..."
21050-54 = "...но почему бы тебе не попробовать, Алиса?"
21050-55 = "В игре полно разных диалогов, так что это может помочь тебе научиться разговаривать."
21050-56 = "...?"
21050-57 = "Цель не понята."
21050-58 = "Однако... *кивает*"
21050-59 = "П-Правда?! Дай минутку. Сейчас всё настрою!"
21050-62 = "Хорошо, готово!"
21050-63 = "..."
21050-64 = ""
21050-65 = ""
21050-66 = "Алиса запускает игру."
21050-68 = "Как следует из названия, наша игра — классическая фэнтезийная RPG с насыщенной сказочной атмосферой."
21050-69 = "[56cd7b]2354 год Космического календаря. Человечество охвачено пламенем возмездия."
21050-71 = "...?"
21050-72 = "Ну... мы вдохновлялись и другими жанрами. Если постоянно использовать одни и те же затёртые штампы, быстро станет скучно."
21050-73 = "..."
21050-74 = "Нажимаю кнопку."
21050-75 = "[56cd7b]Начало обучения."
21050-77 = "[56cd7b]Нажмите кнопку B, чтобы экипировать оружие перед вами."
21050-79 = "Нажимаю... кнопку B..."
21050-82 = "*бум*"
21050-83 = "...?"
21050-84 = "[FF6666]ИГРА ОКОНЧЕНА"
21050-86 = "...?!"
21050-87 = "Ахахаха!"
21050-89 = "Какой смысл играть, если знаешь, что произойдёт?! Тут надо было нажать A!"
21050-90 = "Что ты здесь делаешь, Момои? Я думала, ты пошла за студенческим."
21050-91 = "А, там никого не было. Видать, я пришла слишком поздно. Попробую завтра."
21050-92 = "Кстати, если подумать, мы, наверное, сделали этот момент немного нечестным."
21050-93 = ""
21050-95 = "..."
21050-96 = "Е-Ещё раз..."
21050-97 = "Возобновление. Испытываю эмоцию, которую невозможно выразить словами."
21050-98 = "О! Я знаю, что ты чувствуешь! Наверняка \"интерес\" или \"предвкушение\"!"
21050-99 = "Я бы сказала, \"ярость\"."
21050-101 = "[56cd7b]Оружие успешно экипировано."
21050-103 = "Получен... меч..."
21050-104 = "Ты схватываешь быстрее, чем я ожидала! Как закончишь обучение, скоро доберёшься до лучшей части любой RPG..."
21050-105 = "[FF6666]БОЙ НАЧАЛСЯ!"
21050-107 = "...?!"
21050-108 = "[56cd7b]Появился дикий Плюх-желе!"
21050-110 = "Напряжение. Возбуждение. Интерес."
21050-111 = "Спамь кнопку A! Поверь мне!"
21050-112 = "Кнопка A... Секретный меч Цубамэ Гаэси атакует дважды."
21050-113 = "Уничтожаю Плюх-желе."
21050-114 = "Секретный меч! Цубамэ...!"
21050-115 = "[56cd7b]Бабах!"
21050-117 = "[56cd7b]Контратака. Вы погибли."
21050-120 = "[FF6666]ИГРА ОКОНЧЕНА"
21050-122 = "...?!"
21050-123 = "[56cd7b]Плюх-желе: Нужно было знать, что с мечом на перестрелку не ходят. Хмф!"
21050-126 = "Тебе не кажется, что \"Хмф!\" в конце было уже лишним?"
21050-127 = "По-моему, это не главная проблема."
21050-128 = ""
21050-130 = "Ошибка в работе. Обработка."
21050-131 = "А-Алиса, ты в порядке?"
21050-132 = "..."
21050-133 = "Функциональность восстановлена. Запуск."
21050-134 = "Внимание: в зоне действия Плюх-желе требуется осторожность. Перемещайтесь и уничтожьте цель."
21050-135 = "Вот, уже получается! Главное — понемногу учиться, пока не начнёшь справляться со всем подряд. В этом и прелесть ретро-игр!"
21050-137 = "(Два часа спустя...)"
21050-138 = "Произошла критическая ошибка вычислительной обработки и понимания."
21050-139 = "В-Всё нормально, Алиса! Сразу после этой фазы начинается кульминация!"
21050-140 = "Угх. Тут мы и правда накосячили..."
21050-141 = "Там должно было быть написано, что он предпочитает мясо, но мы не смогли подобрать слова..."
21050-142 = "Когда он говорит: \"Извините, дамы, с вашими овощами помочь не могу, я больше по сосискам\", у Алисы чуть схемы не сгорели!"
21050-143 = "Запрос. Почему моя мать является романтическим интересом и почему в прошлой жизни она была моей женой?"
21050-144 = "Дополнительный запрос. Почему пропавший наполовину-друг детства моей жены явился через временной разлом? Поиск значения \"наполовину-друг\" дал отрицательный результат. Определение в Кивотосе не найдено."
21050-145 = "О-Ошибка!"
21050-146 = "А-Алиса! Ты в порядке? До кульминации совсем чуть-чуть!"
21050-147 = "Инициация перезагрузки."
21050-148 = "Восстановление системы завершено."
21050-149 = "Фух..."
21050-150 = "Это... ваша игра..."
21050-151 = ""
21050-153 = "Возобновляю игру."
21050-155 = "(Два часа спустя...)"
21050-156 = "\"Пожалуйста... убей... меня...\""
21050-158 = "Это было потрясающе, Алиса! Да, рядом с тобой были два разработчика, но ты получила истинную концовку всего за три часа! Вот это спидран!"
21050-159 = "Кстати, Момои..."
21050-160 = "Ты заметила, что чем больше Алиса играет..."
21050-161 = "...тем страннее она начинает говорить?"
21050-162 = ""
21050-164 = "Ежели вопрошаешь моего мнения, о дорогой герой, то ваша покорная слуга всецело согласна."
21050-165 = "Да, понимаю, о чём ты..."
21050-166 = "Конечно, немного неловко, но это куда лучше, чем когда она просто перечисляла слова!"
21050-167 = "Э-Эм, так..."
21050-168 = "У меня немного неловкий вопрос к тебе, Алиса."
21050-169 = ""
21050-171 = ""
21050-172 = "Как тебе наша игра? Было весело?!"
21050-173 = "..."
21050-174 = "Запрошенное описание не найдено."
21050-175 = "Н-Но почему...?"
21050-176 = "Идёт поиск выражения..."
21050-177 = "Загрузка ответа..."
21050-178 = "П-Пожалуйста, только не ругательство."
21050-179 = "....Весело."
21050-180 = "Веселье... подтверждено."
21050-181 = "*вздох!*"
21050-182 = "Чем больше я играла..."
21050-183 = "...тем сильнее казалось, будто меня перенесли в новый мир."
21050-184 = "Это было как... сон."
21050-185 = ""
21050-186 = ""
21050-188 = "Мне... нужно ещё..."
21050-189 = ""
21050-190 = "..."
21050-191 = "*всхлипывает*"
21050-193 = "Ч-Что за...?!"
21050-194 = "А-Алиса, почему ты плачешь?"
21050-195 = "В смысле почему? Её тронула наша игра!"
21050-196 = "Но наша игра — просто комедийная RPG..."
21050-197 = "Спасибо, Алиса! Твои слёзы отменяют тысячу плохих отзывов! Жаль, Юзу этого не видит!"
21050-199 = "...Я здесь."
21050-200 = "*скрип*"
21050-201 = "А? Эта дверца шкафа только что открылась?"
21050-202 = ""
21050-203 = "И-и-и! П-Призрак!"
21050-204 = "Мидори, стой! Не бросай опять FlyStation!"
21050-205 = ""
21050-206 = "..."
21050-207 = "...?"
21050-208 = "Юзу!"
21050-209 = "Мы тебя нигде не могли найти! Сколько ты уже прячешься в шкафу?"
21050-210 = "...С тех пор как вы вернулись из руин."
21050-211 = "Это же несколько часов назад! Ой, ты испугалась Алисы или чего?"
21050-212 = "Нужно было сказать. Мы с Алисой могли бы выйти, если тебе так было спокойнее."
21050-213 = "В любом случае, пора познакомиться. Алиса, это Юзу, президент Департамента Разработки Игр."
21050-214 = ""
21050-215 = ""
21050-216 = "*пододвигается ближе*"
21050-217 = ""
21050-218 = ""
21050-219 = "Хм?"
21050-220 = "Эм. То есть..."
21050-221 = "С... С..."
21050-222 = "С...?"
21050-223 = "Спасибо."
21050-224 = "Спасибо, что сказала... что игра была весёлой... и что хотела играть ещё."
21050-225 = "И спасибо, что заплакала... Для меня это правда много значит."
21050-226 = "...?"
21050-227 = ""
21050-229 = "Я всегда хотела... услышать такие слова о нашей игре..."
21050-231 = ""
21050-232 = ""
21050-233 = "Юзу..."
21050-235 = "Следующий эпизод;Как выучить язык"
