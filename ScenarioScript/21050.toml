[translation]
21050-1 = "Episódio 5;Eu Sou Aris"
21050-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21050-4 = "Hmm, continuo preocupada..."
21050-5 = "Fingir que essa garota é membro do nosso clube... Vai mesmo dar certo?"
21050-6 = "Verificando o significado de \"dar certo\"... Estimado como \"situação em bom estado e sem problemas ocorridos\". Afirmativo."
21050-7 = "...Não, não, não dá pra confirmar isso! Com esse jeito de falar, vão desconfiar na hora!"
21050-8 = "Melhor a gente desistir!? Isso é impossível!"
21050-10 = "Desistir agora é que é impossível. A gente tem que proteger o nosso Clube de Desenvolvimento de Jogos custe o que custar."
21050-11 = "Senão, o cantinho da Yuzu vai... Ela não pode voltar pro dormitório..."
21050-12 = "..."
21050-13 = "É, tem razão..."
21050-16 = "A roupa já tá mais ou menos ajeitada, agora falta uma arma e... fazer o registro estudantil pra conseguir a carteirinha."
21050-17 = "A carteirinha estudantil eu dou um jeito."
21050-18 = "Midori, você e a Yuzu ensinam a Aris \"como falar\"."
21050-19 = "C-como falar?"
21050-20 = "Do jeito que tá agora, como você mesma disse, podem acabar desconfiando."
21050-21 = "A gente já ouviu que \"sem nem ter amigos, vocês nunca conseguiriam recrutar novos membros\"..."
21050-22 = "Se por acaso a Yuuka perguntar \"Você é mesmo do Clube de Desenvolvimento de Jogos?\"..."
21050-25 = "\"Afirmativo. Apresentando a resposta da Aris para a sua pergunta. Eu sou membro do Clube de Desenvolvimento de Jogos.\""
21050-26 = "...Se ela soltar uma dessas, vai tudo por água abaixo."
21050-27 = "É, pensando bem..."
21050-28 = "Aah..."
21050-29 = "Não tem jeito, vou fazer o que eu puder."
21050-30 = "Beleza, então deixo com você!"
21050-33 = "E-espera aí!"
21050-34 = "Huuuum..."
21050-36 = "???"
21050-37 = "Er, então... Aris-chan?"
21050-38 = "Afirmativo. A designação desta unidade é Aris."
21050-39 = "Certo, então vou te chamar de Aris-chan. Mas ensinar a falar... Pensando bem, como é que se aprende isso? Normalmente a pessoa vê vídeos ou vai imitando quem tá por perto até ficar natural, né..."
21050-40 = "...Hmm. Será que tem algum programa educativo infantil na internet...?"
21050-43 = "(Olhando ao redor)"
21050-44 = "?"
21050-45 = "Objeto não identificado detectado. Iniciando verificação."
21050-46 = "Hm?"
21050-47 = "Ah, i-isso é...!?"
21050-51 = "É que... dá um pouco de vergonha, mas na verdade tem um jogo que a gente fez aí dentro. Bem, ele foi massacrado pela crítica..."
21050-52 = "Ah, já sei!"
21050-53 = "Acabou ficando em 1º lugar no ranking de jogos ruins, então não sei o que a Aris-chan vai achar, mas..."
21050-54 = "Aris-chan, quer... jogar o nosso jogo?"
21050-55 = "Como você avança \"conversando\", jogar talvez ajude a aprender a falar."
21050-56 = "...?"
21050-57 = "Não consigo compreender perfeitamente a intenção dessas falas e ações até o momento. Contudo..."
21050-58 = "...Afirmativo. Aris vai jogar."
21050-59 = "S-sério mesmo!? E-espera só um pouquinho, já vou configurar tudo!"
21050-62 = "Pronto, tudo preparado!"
21050-63 = "..."
21050-66 = "Aris iniciando o jogo..."
21050-68 = "Talvez dê pra notar pelo título, mas esse jogo é um RPG de fantasia clássico, colorido e com clima de conto de fadas."
21050-69 = "[56cd7b]Ano 2354 da Era Cósmica, a humanidade foi envolvida pelas chamas do inferno..."
21050-71 = "...?"
21050-72 = "Bem, eu disse clássico, mas a gente misturou vários elementos. Só seguir a tendência não dá, mas se prender demais ao clássico também fica datado, sabe?"
21050-73 = "..."
21050-74 = "Pressionando o botão..."
21050-75 = "[56cd7b]Iniciando o tutorial."
21050-77 = "[56cd7b]Primeiro, pressione o botão B para equipar a arma à sua frente."
21050-79 = "Botão B..."
21050-82 = "(CABUUUUM!!)"
21050-83 = "???"
21050-84 = "[FF6666]<GAME OVER>"
21050-86 = "!?!?"
21050-87 = "Ahahahaha!"
21050-89 = "Não tem nada mais sem graça do que um desenvolvimento previsível! Na verdade, aqui você não pode seguir a instrução — tem que apertar o botão A!"
21050-90 = "Mana...? Você não disse que ia fazer a carteirinha estudantil?"
21050-91 = "Eu fui, mas como já tava tarde, não tinha ninguém lá. Vou de novo amanhã."
21050-92 = "Deixando isso de lado, revendo agora, essa parte é mesmo meio sacanagem."
21050-95 = "..."
21050-96 = "V-vou começar de novo..."
21050-97 = "Reiniciando... Emoção indescritível por texto detectada."
21050-98 = "Ah, eu sei o que é isso! Com certeza é \"interesse\" ou \"expectativa\", alguma emoção assim!"
21050-99 = "Com certeza absoluta é \"raiva\" ou \"confusão\", né..."
21050-101 = "[56cd7b]Você equipou a arma."
21050-103 = "Equipamento concluído..."
21050-104 = "Opa, mandou bem. Se continuar assim, vem a estrela de qualquer RPG: o combate..."
21050-105 = "[FF6666]Um encontro ocorreu!"
21050-107 = "!?"
21050-108 = "[56cd7b]Um Puni-Puni selvagem apareceu!"
21050-110 = "Tensão, empolgação, interesse."
21050-111 = "Aperta o botão A! Dessa vez não é pegadinha!"
21050-112 = "Botão A... \"Espada Secreta: Corte da Andorinha — Ataca o inimigo 2 vezes.\""
21050-113 = "Lá vai, contra o Puni-Puni..."
21050-114 = "Espada Secreta! Corte da Andor—"
21050-115 = "[56cd7b]BANG!"
21050-117 = "[56cd7b]O ataque acertou. Morte instantânea."
21050-120 = "[FF6666]<GAME OVER>"
21050-122 = "!?!?"
21050-123 = "[56cd7b]Puni-Puni: Não importa o quanto treine sua esgrima, diante da minha arma ela é inútil... Heh."
21050-126 = "Hmm, acho que um Puni-Puni falando \"heh\" fica meio forçado, né."
21050-127 = "...Acho que o problema não é bem esse."
21050-130 = "Pensamento interrompido. Processamento computacional não consegue acompanhar."
21050-131 = "A-Aris-chan? Tá tudo bem?"
21050-132 = "..."
21050-133 = "Reinicialização. Retomando."
21050-134 = "Desta vez, vou calcular o alcance da arma e eliminar o Puni-Puni sem me aproximar demais."
21050-135 = "Isso, exatamente! Tentar de novo sem desistir e descobrir a resposta na base da tentativa e erro! Esse é o charme dos jogos retrô!"
21050-137 = "(2 horas depois...)"
21050-138 = "...Erro crítico ocorrido no sistema de processamento computacional e no sistema de expressão."
21050-139 = "Força, Aris! Passando daqui já chega no clímax tão esperado!"
21050-140 = "Ugh...!"
21050-141 = "Isso aí com certeza foi culpa sua, mana, porque você não lembrava da expressão \"tipo herbívoro\" e escreveu \"em estado vegetativo\"!"
21050-142 = "No instante em que leu \"Desculpe. Como estou em estado vegetativo, não consigo puxar assunto com mulheres facilmente\", a Aris-chan desmaiou por um segundo!"
21050-143 = "...Pergunta. Por que a mãe é a heroína, e ao mesmo tempo é na verdade a esposa da vida passada,"
21050-144 = "e ainda por cima por que um amigo de mães diferentes de quem se separou na infância viajou no tempo até essa esposa...#nNão, antes de tudo, a expressão \"amigo de mães diferentes\" não consta no dicionário de dados de Kivotos—"
21050-145 = "Erro detectado, erro detectado!"
21050-146 = "A-aguenta firme, Aris-chan! Falta pouquinho pro clímax!"
21050-147 = "...Reinicialização."
21050-148 = "Processos recuperados."
21050-149 = "...Ufa."
21050-150 = "Então isso é um jogo..."
21050-153 = "Retomando."
21050-155 = "(1 hora depois...)"
21050-156 = "Me... ma... ta..."
21050-158 = "Incrível, Aris! Mesmo com duas desenvolvedoras ajudando, chegar no final verdadeiro em 3 horas!"
21050-159 = "I-isso também, mas..."
21050-160 = "Será que quanto mais ela joga..."
21050-161 = "Os padrões de fala da Aris-chan estão ficando cada vez mais variados...!?"
21050-164 = "Ó herói, se buscas minha concordância, eu a concederei."
21050-165 = "É, parece que... sim?"
21050-166 = "Ainda tá meio estranho porque ela aprendeu direto do jogo, mas... já melhorou muito comparado a quando ela só enfileirava palavras!"
21050-167 = "A-a propósito, er..."
21050-168 = "Dá um nervosismo perguntar isso cara a cara, mas..."
21050-172 = "O que você achou do nosso jogo? Foi divertido!?"
21050-173 = "..."
21050-174 = "...Inexplicável."
21050-175 = "Q-quê!? Por quê!?"
21050-176 = "...Buscando expressões similares."
21050-177 = "Carregando..."
21050-178 = "S-será que ela tá procurando um xingamento...? Não pode ser, né?"
21050-179 = "...Diversão."
21050-180 = "Ela existe claramente..."
21050-181 = "Opa!"
21050-182 = "Quanto mais eu avanço no jogo..."
21050-183 = "Parece que estou viajando por outro mundo..."
21050-184 = "É como estar sonhando... Mais uma vez..."
21050-188 = "Mais uma vez..."
21050-190 = "..."
21050-191 = "(Uma lágrima cai)"
21050-193 = "Quê!?"
21050-194 = "A-Aris-chan!? Por que você tá chorando!?"
21050-195 = "É óbvio! Porque o nosso jogo foi emocionante nesse nível!"
21050-196 = "N-não exagera... Aliás, esse jogo era pra ser um RPG de comédia..."
21050-197 = "Obrigada, Aris! Essa lágrima vale 100 vezes mais do que qualquer coisa que aqueles críticos dizem! Aaah, mal posso esperar pra contar pra Yuzu...!"
21050-199 = "...Eu... eu vi tudo direitinho."
21050-200 = "(Rangido)"
21050-201 = "Ué? O armário abriu sozinho..."
21050-203 = "Kyaaaah! U-u-um fantasma!?"
21050-204 = "Calma, Midori! Não joga o PryStation! Ele já tá quase quebrando!"
21050-206 = "..."
21050-207 = "...?"
21050-208 = "Yuzu!"
21050-209 = "Yuzu-chan, a gente te procurou em todo lugar e não achou! Desde quando você tava dentro do armário?"
21050-210 = "D-desde que vocês voltaram das Ruínas..."
21050-211 = "Faz um tempão, então!? Você ficou no armário esse tempo todo? Ah, será que tava com medo da Aris-chan?"
21050-212 = "Podia ter avisado pelo MomoTalk ou algo assim, que susto..."
21050-213 = "Ah, é a primeira vez que você vê ela, né, Aris? Essa é a presidente do nosso Clube de Desenvolvimento de Jogos, a Yuzu."
21050-216 = "(Se aproxima devagar)"
21050-219 = "?"
21050-220 = "Er, então, bem..."
21050-221 = "O-o-o..."
21050-222 = "O...?"
21050-223 = "...Obrigada."
21050-224 = "Por dizer que o jogo é divertido... Por dizer que quer jogar mais uma vez..."
21050-225 = "Por chorar... Muito obrigada, de verdade."
21050-226 = "???"
21050-229 = "\"Divertido\", \"mais uma vez\"... Era exatamente isso que eu sempre quis ouvir."
21050-233 = "Yuzu-chan..."
21050-235 = "Próximo;Como Aprender a Falar"
