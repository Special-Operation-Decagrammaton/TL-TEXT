[translation]
1601903-1 = "Временные меры"
1601903-3 = "Докладываю о сегодняшней разведке, Сенсей."
1601903-4 = "Если сразу к выводу — ничего серьёзного не произошло."
1601903-5 = "[s] «Да. Рад это слышать.»"
1601903-6 = "Именно. Я уничтожила и взорвала несколько вещей, заодно сняв необходимый стресс."
1601903-7 = "[s] «Но ты же сказала, что ничего серьёзного не произошло!»"
1601903-8 = "Этот континент... интересное место."
1601903-9 = "Каждый раз, когда я выхожу на разведку, что-нибудь меняется, даже в уже исследованных местах."
1601903-10 = "Неизменным остаётся лишь этот металлический пейзаж."
1601903-11 = "Без точных координат я наверняка заблудилась бы."
1601903-12 = "В каком-то смысле это похоже на вход в лабиринт без ясного пути."
1601903-13 = "[s1] «Звучит опасно...»\n[s2] «Может, стоит сократить число разведывательных вылазок...»"
1601903-16 = "Это тоже создаст проблемы."
1601903-17 = "Понятно. Классический «рассинхрон» между полевыми сотрудниками и офисом."
1601903-18 = "Как бы то ни было, совсем недавно три металлических существа, похожих на животных, попытались приблизиться к нашему кораблю."
1601903-19 = "[s] «Это было опасно?!»"
1601903-20 = "Да. Очень опасно."
1601903-21 = "К несчастью, они были настолько «милыми», что я едва не потеряла сознание."
1601903-22 = "[s] «Что...?»"
1601903-23 = "И вели себя они тоже мило."
1601903-24 = "Они переворачивались на спину и показывали живот. Более того, положительно реагировали, когда я выполняла почёсывающие манёвры по открытым участкам."
1601903-25 = "[s3] «Уф! Завидую! Нечестно!»\n[s4] «Ты уверена, что это были металлические животные...?»"
1601903-28 = "Похоже на то."
1601903-29 = "Каждое выглядело как смесь кошки, щенка и ягнёнка."
1601903-30 = "Я попыталась забрать одно, но после окончания нашего сеанса «игры» они настояли на уходе."
1601903-31 = "Таким образом, докладываю: неопознанные сущности, приблизившиеся к кораблю, были успешно отогнаны."
1601903-32 = "[s] «Если разведка такая, я тоже хочу!»"
1601903-33 = "К сожалению, это обязанность назначенных полевых сотрудников. Мир."
1601903-34 = "И самое главное: всё происходящее на этом континенте должно оставаться в тайне."
1601903-35 = "Жаль, что такое событие нельзя было транслировать в прямом эфире..."
1601903-36 = "[s] «Прямой эфир?»"
1601903-37 = "О, вы не знакомы?"
1601903-38 = "Это довольно серьёзно. Те, кто не поспевает за временем, останутся позади."
1601903-39 = "Но мы справимся. Я могу навсегда остаться рядом и быть вашим проводником."
1601903-40 = "[s5] «Я знаю, что такое стрим!»\n[s6] «Я просто удивлён, что ТЫ знаешь!»"
1601903-43 = "О, неужели вы настолько не в курсе?"
1601903-44 = "Это тоже серьёзная проблема. Не могу поверить, что вы настолько не интересуетесь своими студентами, Сенсей."
1601903-45 = "Вообще-то в последнее время я регулярно смотрю стримы."
1601903-46 = "Смотрите. Из-за равнодушия Сенсея, из-за отсутствия заботы..."
1601903-47 = "я не могу функционировать из-за переполняющих меня разочарования и печали."
1601903-48 = "Поэтому Сенсей обязан экстренно погладить меня по голове. Быстрее. Сейчас. Немедленно."
1601903-52 = "Я много раз погладил Токи по голове."
1601903-53 = ""
1601903-54 = "М-м. Было приятно."
1601903-55 = "Теперь моя энергия и жизненные силы восстановлены. Я снова идеально-оптимальная Токи."
1601903-56 = "[s] «Рад это слышать...»"
1601903-57 = "Итак, вернёмся к исходной теме."
1601903-58 = "Несколько студентов, а также вы, советовали мне найти «хобби»."
1601903-59 = "Поэтому я заинтересовалась культурой так называемых «стримов»."
1601903-60 = "Особенно меня заинтриговал обычай «донатов»."
1601903-61 = "Я заметила, что большие суммы требуют более тяжёлого эмоционального труда. Чем больше денег, тем нелепее разговоры и требования, которые стример обязан замечать."
1601903-62 = "Разве стриминг не является вершиной капитализма?"
1601903-63 = "[s] «Токи... Ты ведь не делаешь на этих стримах ничего странного, правда...?»"
1601903-64 = "Не дуюсь."
1601903-65 = "Чаще всего я молчаливый наблюдатель."
1601903-66 = "Но участие в аудитории помогает мне прогнать скуку. Некоторые стримеры говорят примерно следующее:"
1601903-67 = ""
1601903-69 = ""
1601903-72 = "«Видите это, чат? Давайте заспамим pog!»"
1601903-73 = "«Да ну, такого быть не может. Контроллер сломан. Это всё пинг.»"
1601903-74 = ""
1601903-76 = ""
1601903-77 = "«...Следующая игра! Возвращаю деньги. Нам конец.»"
1601903-78 = "«Хватит врать! Они так говорят только потому, что это спонсорка!»"
1601903-79 = ""
1601903-81 = ""
1601903-82 = ""
1601903-83 = "«Я не могу страдать один... Все заходите на мой сервер...»"
1601903-84 = "[s] «...»"
1601903-85 = "..."
1601903-86 = "Общество состоит из невероятно разнообразной и яркой мозаики."
1601903-87 = "[s7] «И что мне теперь делать...?»\n[s8] «Наша Токи смотрит каких-то чудиков...»"
1601903-90 = "Будьте спокойны. Я ещё не настолько далеко зашла."
1601903-91 = "Именно. Пока ещё не настолько."
1601903-92 = "Тем не менее один конкретный стрим мне особенно трудно выдерживать."
1601903-93 = "Хотите узнать канал?"
1601903-94 = "..."
1601903-95 = "Он посвящён «Девичьему свитку ниндзя», хотя никакого свитка я там ни разу не видела. Всё вращается вокруг историй некой «Митти»... или как-то так."
1601903-96 = "[s] «...»"
1601903-97 = "Эм... В качестве испытания я пыталась досматривать её стримы до конца. Это оказалось непросто."
1601903-98 = "Совсем непросто. Стрим оказался грозным противником."
1601903-99 = "Я знаю, что с практикой стану сильнее, но сейчас не думаю, что выдержу весь «Свиток ниндзя»."
1601903-100 = "[s] «Тебе не нужно ради этого тренироваться...»"
1601903-101 = "Вот как? Я не совсем понимаю..."
1601903-102 = "Есть ли у меня «другие хобби», Сенсей?"
1601903-103 = "Хм, одно могу назвать."
1601903-104 = "Но всё же, Сенсей. Просмотр интернет-стримов и подобные занятия — всё это лишь «временные» увлечения."
1601903-105 = "То есть сейчас мне это интересно, но интерес может измениться."
1601903-106 = "В конце концов, моё настоящее хобби — это..."
1601903-107 = "..."
1601903-108 = "Думаю, я уже сказала достаточно."
1601903-109 = "[s] «Ты научилась хорошо менять тему!»"
1601903-110 = "Да, Сенсей. Этому навыку меня научили вы."
1601903-111 = "В конце концов, я, Асума Токи, всё ещё расту и совершенствуюсь. В том числе прямо сейчас."
1601903-112 = "[s] «Да, понимаю...»"
1601903-113 = "Я пришла к выводу, что люди легко поддаются влиянию окружения."
1601903-114 = "Благодаря опыту они постепенно, шаг за шагом меняют и себя, и окружающую среду."
1601903-115 = "Поэтому..."
1601903-116 = "..."
1601903-117 = "Мне понравилось играть в видеоигры."
1601903-118 = "...И читать мангу тоже."
1601903-119 = "[s] «Уверен, ты хорошо ладишь с Отделом разработки игр...»"
1601903-120 = "Да. Верно, а Арис оказалась грозной соперницей."
1601903-121 = "Сейчас я отстаю на одну игру, но уверена, что наверстаю."
1601903-122 = "А вот Юзу..."
1601903-123 = "[s] «Мне кажется, её уровень вообще из другого измерения...»"
1601903-124 = "Значит, вы тоже это признаёте, Сенсей..."
1601903-125 = "Я поняла бессмысленность раздражения при такой разнице в навыках."
1601903-126 = "Это словно сражаться со стихийным бедствием: наводнением, тайфуном, вращающимся торнадо."
1601903-127 = "[s] «(Юзу уже достигла уровня „стихийного бедствия“?)»"
1601903-129 = "Когда мы закончили разговор и оставшуюся работу, Токи показала мне своих любимых стримеров."
1601903-130 = "...Позже я обнаружил, что Токи уснула, прислонившись к моему плечу."
