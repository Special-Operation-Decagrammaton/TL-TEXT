[translation]
80000121-1 = "Шоколад Железной ладони"
80000121-2 = "Спасибо, что пришли, Сенсей."
80000121-3 = "То есть, это я попросила вас встретиться, но знаю, насколько вы заняты."
80000121-4 = "[s] «Не переживай из-за такого.»"
80000121-5 = "И всё же, спасибо. Итак, эм..."
80000121-6 = "..."
80000121-7 = "Э-Эм. Как бы это сказать?"
80000121-8 = "Немного неловко."
80000121-9 = "Я знаю, какой сегодня день, что люди обычно делают и что вы, наверное, уже привыкли к таким вещам..."
80000121-10 = "Да... Ну, валентиновский шоколад. Наверняка вы уже получили бесчисленное количество шоколада от других студентов, так что мой ничем не особенный..."
80000121-11 = "[s1] «Ничего подобного! Это точно мой первый!»\n[s2] «О, эм, пожалуй, я и правда получил немало...»"
80000121-12 = "Э-Э? Тогда, может, стоило подарить вам что-нибудь другое..."
80000121-13 = "...Любой подарок от меня вас порадует? Х-Хорошо..."
80000121-14 = "Наверное... но мне хотелось подарить вам что-то..."
80000121-15 = "...запоминающееся..."
80000121-16 = "*глубокий вдох* В общем!"
80000121-17 = "Пожалуйста, возьмите! А я пойду!"
80000121-18 = ""
80000121-21 = "[ns] «Форма... кулака?»"
80000121-22 = "Д-Да. И это..."
80000121-23 = "...связано с происхождением этого шоколада!"
80000121-24 = ""
80000121-27 = "Д-Да. Хотите подробности? А, понимаю. Наверное, если просто внезапно заговорить о происхождении шоколада без объяснений, любой запутается..."
80000121-28 = "..."
80000121-29 = "Сенсей. Вы знаете о тренировочном методе боевых искусств под названием «Железная ладонь»?"
80000121-30 = "Это упражнение, где в миску насыпают мелкий песок и вонзают в него пальцы."
80000121-31 = "Начинают с холодного песка, затем переходят к нагретому. Постепенно увеличивают размер частиц: песок, мелкая галька, жареные бобы и наконец железные шарики..."
80000121-32 = "Так тренируют кончики пальцев и весь кулак, пока техника рук не станет твёрдой как железо."
80000121-33 = "Как Железная ладонь связана с шоколадом? Ну..."
80000121-34 = "Понимаете, у меня появилась мысль. Вместо жареных бобов..."
80000121-35 = "...а что, если использовать какао-бобы?"
80000121-36 = "И что, если результат тренировки использовать для приготовления шоколада?!"
80000121-37 = "[s] «То есть ты тренировала Железную ладонь на какао-бобах?»"
80000121-38 = "Д-Да, получается так..."
80000121-39 = "А потом... как бы сказать? Я слишком увлеклась..."
80000121-40 = "...и когда пришла в себя, уже размолола их в порошок."
80000121-41 = "К-Конечно, я ожидала чего-то подобного, но не думала, что это действительно случится..."
80000121-42 = "П-Поэтому! Раз уж я уже приготовила шоколад своими руками..."
80000121-43 = "...я подумала, может, отпечатать на нём форму моего кулака..."
80000121-44 = "И, эм, вот что получилось."
80000121-45 = "С-Странно, правда? И шоколад, и я..."
80000121-46 = "[s] «...»"
80000121-47 = ""
80000121-50 = "[ns] «Но тогда это буквально шоколад ручной работы Рэйдзё?!»"
80000121-51 = "Ч-Что-о-о?! Что вы такое говорите...!"
80000121-52 = "..."
80000121-53 = "Я..."
80000121-54 = "...Хотя совсем неправыми вас не назвать."
80000121-55 = "Но когда вы говорите это именно так, становится ужасно неловко..."
80000121-56 = ""
80000121-59 = "Я жадно съел шоколад Рэйдзё!"
80000121-60 = "С-С-С-Сенсей?! Если вы будете есть шоколад вот так...!"
80000121-61 = "[s] «Так вот какая Рэйдзё на вкус!»"
80000121-62 = "Ч-ЧТООО?!"
80000121-63 = "Эм, Сенсей??? Выражение вашего лица немного...!"
80000121-64 = "Немного..."
80000121-65 = "Ну тогда, как вам..."
80000121-66 = "...мой вкус?"
80000121-67 = "[s3] «Это было великолепно!»\n[s4] «Дай ещё!»"
80000121-70 = "В-Вы серьёзно?!"
80000121-71 = "...По вашему лицу видно, что вы абсолютно серьёзны."
80000121-72 = "П-Поняла. Я немного, но всё же надеялась на что-то подобное."
80000121-73 = "Так что я сделала запас..."
80000121-74 = "Хотя именно такой сценарий я не представляла..."
80000121-75 = "Мм."
80000121-76 = "Всё равно спасибо, Сенсей."
80000121-77 = "Осталось немного, но берите сколько хотите."
80000121-78 = "И принесу вам чаю, на случай если захочется пить."
80000121-80 = "Мы ещё немного посидели с Рэйдзё, неторопливо разговаривая о Променаде, шоколаде, боевых искусствах и прочих приятных вещах."
