[translation]
1601802-1 = "Визит капитана"
1601802-3 = "[ns1] «Рабу!!»\n[ns2] «Добро пожаловать в Шале!!»"
1601802-6 = "З-Заткнись! Чего ты так орёшь?!"
1601802-7 = "[s3] «Рабу пришла в Шале!»\n[s4] «Нужно сделать этот день ежегодным праздником!»"
1601802-10 = "Ч-Ч-Ч-Что?! «Ежегодным праздником»? Ты о чём вообще?!"
1601802-11 = "Но прежде чем это обсуждать, почему ты торчал за входной дверью?"
1601802-12 = "[s] «Я просто прибежал из офиса. Хотел тебя увидеть!»"
1601802-13 = "Ты что, грустный щенок?"
1601802-14 = "А если бы ты поранился?! Посмотри на эти отполированные полы и толстенные стеклянные двери."
1601802-15 = "*вздыхает* Ну, приятно, конечно, что ты решил лично меня встретить, раз я проходила мимо."
1601802-16 = "Но... Сенсей..."
1601802-17 = "Тебе всё равно, что могут подумать люди?"
1601802-18 = "[s5] «А что? У меня одежда странная?»\n[s6] «Это одна из моих любимых рубашек...»"
1601802-21 = "Нет-нет! С одеждой всё нормально."
1601802-22 = "Ну... я имела в виду... У тебя ведь определённая репутация, да? Нужно подавать пример."
1601802-23 = "Ты постоянно общаешься со студсоветами, Валькирия и Чаепитием."
1601802-24 = "*вздыхает*"
1601802-25 = "Я просто спрашиваю... Ты точно хочешь, чтобы тебя видели со мной? На людях?"
1601802-26 = "[s] «Хм? А почему нет? У тебя проблемы?»"
1601802-27 = "Ну, то есть..."
1601802-28 = "*вздыхает* Да ладно. Я несу чушь. Ты ведь вообще о таком не думаешь, да?"
1601802-29 = "[s] «Но Рабу, ты ведь такой хороший студент.»"
1601802-30 = "А?!"
1601802-31 = "[s7] «Твоё сообщение было таким вежливым.»\n[s8] «Ты спросила, как у меня дела.»\n[s9] «И даже предупредила быть осторожнее!»"
1601802-35 = "П-Погоди! Ты о чём вообще?!"
1601802-36 = "Это просто элементарные манеры! У меня есть базовое воспитание. Я же не НАСТОЛЬКО плохая, да?"
1601802-37 = "Ладно, неважно. Если ты говоришь, что всё нормально, пусть будет так."
1601802-38 = "Но всё же рядом со мной может быть... ну, сам понимаешь."
1601802-39 = "Ладно, увидимся. Спасибо, что вышел. И не бегай по лестнице!"
1601802-40 = "Пока, т..."
1601802-41 = "[ns10] Взять Рабу с собой в Шале.\n[ns11] «Ну же! Я покажу тебе всё вокруг!»"
1601802-44 = ""
1601802-45 = "Ч-Что?! Ай! Что на тебя нашло?"
1601802-46 = "[s12] «Я горжусь тем, что ты мой студент, Рабу!»\n[s13] «Устрою тебе полную экскурсию!»"
1601802-49 = "По S-Шале?! Прямо сейчас?!"
1601802-50 = "[s] «Ты устала? Могу понести тебя на спине...»"
1601802-51 = "Это ещё хуже, идиот!"
1601802-52 = "Мне не нужно, чтобы меня... поднимали! Давай просто пойдём пешком, раз уж ты настаиваешь."
1601802-54 = "Я показал Рабу весь Шале."
1601802-55 = "Мы отлично провели время."
