[translation]
2000503-1 = "Пожалуйста, соблюдайте безопасность за рулём"
2000503-2 = "Внутри «Крусейдера»"
2000503-4 = "Дорога в этом районе довольно ухабистая,"
2000503-5 = "Осторожно, Сенсей. Смотри, не ударься о поручни танка."
2000503-6 = "Тут много острых краёв, о которые легко поцарапаться."
2000503-7 = "В танке я стараюсь носить плотную одежду. Так даже если поскользнусь и упаду, не поранюсь."
2000503-8 = "[s] «Но сейчас на тебе ведь купальник?»"
2000503-9 = "Ну да. Потому что мы едем на пляж."
2000503-10 = "Место, куда мы направляемся, тоже очень отдалённое и открытое, так что переодеться там будет негде."
2000503-11 = "К тому же мне всегда хочется прыгнуть в воду сразу по приезде, поэтому я заранее переоделась в купальник!"
2000503-12 = "[s] «И всё же бикини и танк — занятное сочетание.»"
2000503-13 = "Ха-ха... Да, когда ты так говоришь, немного неловко."
2000503-14 = "К счастью, пока я здесь внизу, никто не видит, во что я одета."
2000503-15 = "И этот купальник выбрал для меня ты, поэтому мне совсем не неловко носить его перед тобой!"
2000503-16 = "Ладно, пора давить на газ. Едем на пляж!"
2000503-19 = "О, кажется, мы наконец приехали."
2000503-20 = "Сенсей, выходи наружу!"
2000503-21 = ""
2000503-24 = "Пляж Муйгахама"
2000503-25 = "Мы на пляже!"
2000503-26 = "[s] «Пляж! Пляж!»"
2000503-27 = "Правда здорово выглядит? Только посмотри, как разбиваются волны."
2000503-28 = "Мне так хочется сразу же прыгнуть в воду..."
2000503-29 = "...но сначала нужно припарковать танк. В инструкции сказано, что сперва надо поставить противооткатный упор. Можешь сделать это?"
2000503-30 = "[s] «Без проблем.»"
2000503-31 = ""
2000503-32 = ""
2000503-36 = "[ns] «Теперь можешь выходить.»"
2000503-37 = "Хорошо, уже иду!"
2000503-39 = "Оп-ля..."
2000503-40 = "Погоди. Это сейчас..."
2000503-41 = "О нет!"
2000503-42 = ""
2000503-43 = ""
2000503-45 = "[ns] «Что случилось?»"
2000503-48 = ""
2000503-49 = "Порвался..."
2000503-50 = "[s] «Что порвалось?»"
2000503-51 = "Купальник сзади зацепился за поручень танка и порвался..."
2000503-52 = "[ns] «Ты порвала купальник?!»"
2000503-53 = "Тсс! Не так громко!"
2000503-54 = "Что мне делать, Сенсей?! Как я теперь вообще выйду наружу?"
2000503-55 = "Я так обрадовалась, когда переодевалась в купальник, что забыла взять с собой другую одежду..."
2000503-56 = "[s] «Я схожу в ближайший магазин и куплю тебе что-нибудь.»"
2000503-57 = "Но я же говорила, что здесь совсем глухое место. Тут даже круглосуточного магазина нет."
2000503-58 = "Н-Нам остаётся только ехать обратно на танке!"
2000503-59 = ""
2000503-60 = ""
2000503-62 = "[ns] «Подожди, противооткатный упор всё ещё...!»"
2000503-65 = "Что случилось с гусеницей танка...?"
2000503-67 = "..."
2000503-68 = "Сенсей, ты случайно не умеешь чинить танковые гусеницы?"
2000503-69 = "[s1] «Нет. Значит, остаётся один вариант...»\n[s2] «Похоже, мне придётся сходить пешком до твоего общежития и обратно.»"
2000503-70 = "Прости. Спасибо, что делаешь это..."
2000503-71 = "Прости. Спасибо, что делаешь это..."
2000503-73 = "Я несколько часов шёл пешком, чтобы принести Хифуми её форму."
2000503-74 = "По дороге меня остановили и обвинили в том, что я извращенец, укравший форму школьницы..."
