[translation]
1005206-1 = "Повседневная жизнь Ушио Ноа"
1005206-4 = "Конференц-зал «Семинара», башня Миллениума"
1005206-5 = "Мою встречу отменили, поэтому я решил навестить Ноа в конференц-зале."
1005206-6 = ""
1005206-11 = ""
1005206-12 = ""
1005206-13 = ""
1005206-15 = "...Сенсей?"
1005206-16 = "Я ведь сообщила тебе, что сегодняшняя встреча отменена, разве нет?"
1005206-17 = "Ты не видел моё сообщение?"
1005206-18 = "[ns] «Видел.»"
1005206-20 = "[ns] «Но решил использовать свободное время, чтобы вместо этого прийти к тебе.»"
1005206-21 = "О, рада это слышать."
1005206-22 = "Я как раз тоже думала, чем заняться с неожиданно появившимся свободным временем."
1005206-23 = "Книги, которые были со мной, я уже дочитала, а прохожих из окна из-за дождя совсем не видно..."
1005206-24 = "Если бы ты не пришёл, день выдался бы скучным."
1005206-25 = "[s] «Я ведь не мешаю твоим тихим размышлениям?»"
1005206-26 = "Нисколько. Я рада, что ты пришёл."
1005206-27 = "Неловко признавать, но помимо секретарских обязанностей я всегда была одержима наблюдением и фиксацией происходящего вокруг."
1005206-28 = "Мне тяжело переносить неподвижную рутину повседневной жизни. Я гораздо больше люблю шум и беспорядок суматошных ситуаций."
1005206-29 = "Если бы ты сегодня не пришёл..."
1005206-30 = "Я могла бы сама устроить какую-нибудь неприятность, лишь бы создать суету и спастись от скуки. Хи-хи."
1005206-31 = "[s1] «Ноа сама создаёт больше суеты...»\n[s2] «Сложно представить.»"
1005206-32 = "Просто обычная жизнь студентов Миллениума и без того полна проблем и происшествий."
1005206-33 = "Просто обычная жизнь студентов Миллениума и без того полна проблем и происшествий."
1005206-34 = "И без моего вмешательства здесь хватает хаоса, который можно превращать в записи и наблюдения."
1005206-35 = "...Кстати, на окнах скопился конденсат и теперь стекает вниз."
1005206-36 = "Надо протереть окна, пока пол не намок."
1005206-37 = ""
1005206-39 = ""
1005206-41 = "[ns] Слегка написать на окне."
1005206-42 = "Сенсей?"
1005206-43 = "Ты... пишешь на окне?"
1005206-44 = "Мне такое даже в голову не приходило..."
1005206-45 = "Хи-хи. Будто призрачные буквы вырезаны на конденсате и контрастируют с облаками за стеклом... Очень красиво."
1005206-46 = "Можно и мне что-нибудь написать?"
1005206-49 = "― Как странно...[wa:760]"
1005206-52 = "― Совсем не похоже на письмо на бумаге.[wa:10]"
1005206-54 = "― Здесь больше... живости.[wa:220]"
1005206-57 = "― Записи[wa:1500]"
1005206-59 = "― несут смысл в будущее.[wa:1930]"
1005206-62 = "― Но когда дождь закончится и взойдёт солнце,[wa:1420]"
1005206-64 = "― эти слова исчезнут, такие же временные, как мгновение, породившее их.[wa:10]"
1005206-67 = "― Это стекло слишком хрупко...[wa:3040]"
1005206-69 = "― чтобы выдержать вес истины или разума.[wa:1400]"
1005206-72 = "― Но... именно поэтому[wa:2380]"
1005206-74 = "― мне и нравится эта большая стеклянная страница.[wa:2450]"
1005206-77 = "[ns] «Что ты написала?»"
1005206-78 = "Это?"
1005206-79 = "Меня вдохновило одно из моих любимых стихотворений."
1005206-80 = "Как тот писатель любил облака, так и мне полюбилась эта фраза, но..."
1005206-81 = "Я боялась, что если запишу её на бумаге, мои чувства застынут в реальности и станут неподвижными."
1005206-82 = "Но слова на этом окне ещё мимолётнее, чем настроение человека."
1005206-84 = "Так что, Сенсей..."
1005206-85 = "Сегодняшняя запись останется только в моём сердце."
1005206-87 = "Я написал на окне собственные чувства и разговаривал с Ноа, пока дождь не закончился. Наш разговор пережил записи на стекле."
