10028050-91 = "Ох, Иори. Моя дорогая, глупенькая Иори!"
10028050-92 = "Ты ведь знаешь, что я всегда выхожу победителем, но это никогда не мешает тебе бросать мне вызов!"
10028050-93 = "Не то что моя очаровательная и послушная Милашка. Пока я не отдам эту сумку..."
