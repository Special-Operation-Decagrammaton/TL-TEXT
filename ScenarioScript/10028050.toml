10028050-133 = "Всё это, наверное, уже обречено. Реликвия — точно. Наверное. Кто знает!"
10028050-134 = "Ну, я и сама не смогу объяснить, как мы вообще до такого дошли."
10028050-135 = "Но мне кажется... немного несправедливо, что страдать пришлось только мне. Весь. Этот. День."
