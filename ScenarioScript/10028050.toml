10028050-10 = "Эм... Итак, Сенсей..."
10028050-11 = "Я уверена, что такого быть не может..."
10028050-12 = "Но вдруг..."
10028050-13 = "По какой-то совершенно невероятной случайности..."
10028050-14 = "Вы с девушкой из Тринити ведь не думаете договариваться с этой преступницей, правда? ...Правда?"
10028050-15 = "Вахахаха!! Ах, Иори, Иори."
10028050-16 = "Твои наивные мечты держатся на неведении! Ты случайно не знаешь, что внутри этой сумки?"
10028050-17 = "Это не просто красивая сумка. В ней хранится одна из школьных реликвий Тринити."
10028050-18 = "Если она потеряется или, страшно представить, сломается..."
10028050-19 = ""
10028050-21 = ""
10028050-23 = ""
10028050-24 = ""
10028050-27 = ""
10028050-29 = ""
10028050-31 = ""
10028050-32 = "Что ж, даже для такой крупной шишки, как Академия Тринити, это станет проблемой."
10028050-33 = "Что ты имеешь в виду? Реликвия Тринити?"
10028050-34 = "И что вообще такая вещь делает здесь...?"
10028050-35 = "Ладно, ладно! Я всё разложила так, чтобы всем было понятно!"
10028050-36 = "Раз уж дошло до этого, давайте выложим карты на стол. Кто знает! Может, в итоге все уйдут довольными!"
10028050-37 = "Иори, ты тайком пробралась на этот поезд, чтобы обрушить руку правосудия на банду и работников состава. Я права?"
10028050-38 = "Отпусти меня, и мы продолжим нашу маленькую игру в кошки-мышки. Тебе ведь нравится азарт погони, разве нет?"
10028050-39 = "А нашей Милашке из Тринити нужно всего лишь забрать свой багаж и на следующей остановке умчаться обратно в свои башни из слоновой кости."
10028050-40 = "Знаю, знаю! Но что же будет с нашей главной героиней?"
10028050-41 = "Я тихонько исчезну отсюда, будто меня никогда и не было. Избавлю вас всех от бумажной волокиты! Какая же я добрая, правда?"
10028050-42 = "Всё складывается идеально! И драться не надо! Умно, да?"
10028050-43 = "Все получают желаемое — всего-то за цену одного закрытого глаза! В конце концов, бедную маленькую меня похитили и силой притащили сюда! Не думаю, что прошу слишком многого."
10028050-44 = "Ну же! Чего уставились? Мы ведь не впервые через такое проходим?!"
10028050-45 = "Самое захватывающее в жизни — то, что всё никогда не идёт точно по плану! Смиритесь и наслаждайтесь!"
10028050-46 = "Вот и всё! Что скажешь, Иори? Сделка! Сделка!"
10028050-47 = "Предложение не такое уж плохое..."
10028050-48 = "...Если позволите мне самой так сказать. А я позволю!"
10028050-49 = "Тебя по голове ударили?! В какой вселенной я отпущу тебя снова бесчинствовать, когда ты прямо у меня под носом?"
10028050-50 = "Мне плевать на Тринити и их дурацкие проблемы! Единственное, что имеет значение, — выполнить мою работу!"
10028050-51 = ""
10028050-53 = ""
10028050-54 = "..."
10028050-55 = "...*вздыхает*..."
10028050-56 = "[s1] «...???»\n[s2] «Ичика...?»"
10028050-59 = ""
10028050-60 = "Ты правда так думаешь? Всё не так просто..."
10028050-61 = "Нравится тебе это или нет, но теперь это и твоя проблема, Иори. Хи-хи."
10028050-62 = "Протестуй сколько хочешь! Пока эта сумка у меня..."
10028050-63 = "Девушка из Тринити и Сенсей вынуждены меня слушать. Правда ведь, Милашка?"
10028050-64 = "..."
10028050-65 = "Повторяю ещё раз! Что бы у них там ни происходило — не моя проблема! У нас с тобой есть свои дела!"
10028050-66 = "И ты! Чего ты так упрямишься?! Я тебя даже не арестовываю. Очевидно, здесь что-то произошло, и мне всего лишь нужно выслушать твою версию! Дай мне уже нормально сделать свою чёртову работу!"
10028050-67 = "..."
10028050-68 = "Ты правда зациклилась совсем не на том. Я затаив дыхание жду её решения. Через пару мгновений она застрелит тебя ради этой чайной чашки...? Ночного горшка? Короче, этой штуки."
10028050-69 = "Ведь так? Наша подруга из Отряда справедливости... Как тебя там звали?"
10028050-70 = "...Ника?"
10028050-71 = "В общем, тебе ведь нужно, чтобы это осталось целым, да?"
10028050-72 = "..."
10028050-73 = "Хватит уже про эту сумку! Чайник то! Сумка это! Серьёзно!!"
10028050-74 = "..."
10028050-75 = "Да кому вообще сдалась эта дурацкая сумка?!"
