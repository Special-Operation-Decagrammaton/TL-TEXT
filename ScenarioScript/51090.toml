[translation]
51090-1 = "Эпизод 9;Фува Рэнгэ"
51090-2 = "...Что ты здесь делаешь, Юкари?"
51090-3 = "Я, Юкари, прочесала все гуманитарные клубы, чтобы найти вас, Рэнгэ! И вот мои поиски завершены!"
51090-4 = "Но я никак не ожидала, что вы окажетесь с Клубом внутренней дисциплины."
51090-6 = "Рэнгэ попросилась к нам на испытательный срок, чтобы познакомиться с деятельностью Клуба внутренней дисциплины."
51090-7 = "*зевает* Вот почему... я сейчас... знакомлюсь с нашей деятельностью... *храп*"
51090-8 = "Значит, рекламное видео Клуба внутренней дисциплины сработало! Правда?!"
51090-9 = "Простите, я бы сказала раньше, если бы поняла, что вы знакомы. Хотя, наверное, могла догадаться по этому синему хаори..."
51090-10 = "Ого, да! Оно точно такое же! Значит, Рэнгэ тоже из Хяккарёран?!"
51090-12 = "А, ну, да, но..."
51090-13 = "Я-я вовсе не пыталась это скрывать или что-то такое..."
51090-14 = "Понимаю. Вы просто пытаетесь вернуть себе юность."
51090-15 = "...А?!"
51090-16 = "П-Постой, Юкари! Откуда ты знаешь про—"
51090-17 = "Вы сами мне рассказывали! Кроме того, сначала я отправилась к вам домой."
51090-18 = "Вас там не было, зато я нашла записку: «Я отправилась возвращать свою юность!»"
51090-19 = ""
51090-21 = ""
51090-23 = "Так что мы с Сенсеем прошли по всем клубам, куда вы могли заглянуть!"
51090-24 = "[s] «Клубную деятельность определённо можно назвать частью юности.»"
51090-25 = "Я встретила всех тех членов клубов, которые приняли вас и были тронуты вашим чистым сердцем!"
51090-26 = "И я, Юкари, тоже тронута! Я рада, что вы отправились на поиски своей горько-сладкой юности, Рэнгэ! Но нам нужно обсудить—"
51090-27 = "П-Постой! Не надо меня позорить — хватит уже с этим «юность то, юность это», п-пожалуйста!"
51090-28 = "Я написала ту записку сгоряча..."
51090-29 = "Говорят, студенческая жизнь может закончиться раньше, чем успеешь заметить, поэтому я старалась уделить внимание как можно большему числу клубных занятий..."
51090-30 = "[s] «(Правда так говорят?)»"
51090-31 = "Нет, постойте! С чего мне вообще стыдиться своих мечтаний?!"
51090-32 = ""
51090-34 = ""
51090-36 = "Вы правы, Юкари! Я пришла в Клуб внутренней дисциплины, чтобы найти свою юность."
51090-37 = "Всё то время, когда я, словно старая дева, только и делала, что переживала о делах клуба, с потом на лбу и хмурым лицом... Я верну себе свою юность!"
51090-38 = "...Так что, Юкари, я не знаю, зачем ты гналась за мной, но я уже решила отложить хаори и вступить в Клуб внутренней дисциплины. Поэтому, что бы там ни было, как бы больно тебе ни было, возвращайся—"
51090-40 = "А какой деятельностью ради юности занимается Клуб внутренней дисциплины?"
51090-41 = "Ты вообще меня слушаешь?!"
51090-42 = "Я просто хочу узнать, чем вы занимались, Рэнгэ!"
51090-43 = "А-Ах, тогда... Мои занятия ради юности... Я..."
51090-44 = "Я..."
51090-45 = ""
51090-47 = ""
51090-48 = ""
51090-50 = "Я вступила в Клуб внутренней дисциплины, чтобы стать спокойной и утончённой леди! А ещё бойцом, овладевшим искусством сна красоты!"
51090-51 = ""
51090-53 = ""
51090-54 = ""
51090-56 = ""
51090-57 = "...А?"
51090-58 = "*зевок*"
51090-59 = "Значит, вот какова ваша цель, Рэнгэ?"
51090-60 = "[s] «...Так ты хочешь стать спокойной и утончённой леди? Или мастером сна красоты?»"
51090-61 = ""
51090-64 = ""
51090-65 = "И то и другое! Или что-нибудь одно! Неважно!"
51090-66 = "Какой бы путь я ни выбрала, это всё равно ю-юность!"
51090-68 = "О боже..."
51090-69 = "Вы думаете, это странно, Юкари...?"
51090-70 = "Это потрясающе! Вы всегда несётесь прямо к своим целям, ни секунды не колеблясь!"
51090-71 = "Именно этим я восхищаюсь в вас больше всего, Рэнгэ!"
51090-72 = "О-О, п-правда...?"
51090-73 = ""
51090-75 = ""
51090-77 = "Кикё знает об этом?"
51090-78 = "Уверена, она бы поддерживала вас изо всех сил..."
51090-80 = "Ни за что! Я прямо вижу, как она загадочно ухмыляется, если я ей расскажу! Она последний человек, которому я хочу это говорить!"
51090-81 = "В-Важнее другое, Юкари, теперь моя очередь задавать вопросы! Зачем ты меня искала?"
51090-82 = "Хм?"
51090-83 = "Не делай вид, что не слышишь. Ты знаешь, что я спросила..."
51090-84 = "Наш клуб распустили. Наша деятельность приостановлена."
51090-85 = "Тебе бы сейчас готовиться наслаждаться фестивалем как обычному студенту..."
51090-87 = "Никогда!"
51090-88 = "[s] «...»"
51090-89 = "Эм, то есть... Конечно, у меня есть причина вас искать! ...Мне ведь нечего скрывать!"
51090-90 = "Я, Юкари, пришла, потому что мне нужна ваша помощь!"
51090-91 = "С... С вами в качестве свидетеля я объявляю Поединок за преемство Хяккарёран!"
51090-92 = ""
51090-95 = ""
51090-96 = "...Что."
51090-97 = "...С чего вдруг ты заговорила о Поединке за преемство?"
51090-99 = "Мы рассказали Рэнгэ всё, что узнали в Клубе Инь-Ян, а Юкари повторила своё заявление."
51090-101 = "Кикё была права!"
51090-102 = "Нагуса действительно отправилась на Великое снежное поле!"
51090-104 = "..."
51090-106 = "Значит, путь вперёд ясен! Мы можем всё исправить и вернуть Хяккарёран к прежнему состоянию!"
51090-107 = "Я одолею Нагусу в Поединке за преемство, а затем..."
51090-108 = "А затем сама стану президентом!"
51090-109 = ""
51090-111 = ""
51090-113 = "..."
51090-114 = "Рэнгэ! Давайте вернёмся вместе!"
51090-115 = "Мы найдём Кикё и снова объединим Хяккарёран! Пожалуйста... станьте свидетелем моего Поединка за преемство!"
51090-116 = "Юкари... Ты..."
51090-117 = "Ты всё ещё..."
51090-118 = "Да!"
51090-119 = ""
51090-121 = ""
51090-123 = "Ты всё ещё несёшь эту чушь?!"
51090-124 = ""
51090-127 = ""
51090-128 = "Ч-Что?"
51090-129 = "Юкари, Хяккарёран уже распущен."
51090-130 = "Кикё лично вынесла это решение, пользуясь полномочиями офицера по операциям."
51090-131 = "А? Хяккарёран... распущен? К-Когда?"
51090-132 = "[s] «Это долгая история, Мимори...»"
51090-134 = "Н-Она бы никогда!"
51090-135 = "Рэнгэ, приказ о роспуске наверняка ошибка!"
51090-137 = "Ошибки нет."
51090-138 = ""
51090-141 = ""
51090-142 = "Когда президент Аямэ исчезла... Ну, никто из нас не был потрясён — мы знали, что однажды нечто подобное может случиться."
51090-143 = "Президент — удивительный человек, и жаль, что ты не успела узнать её лучше... но мы все предполагали, что она может исчезнуть в любой момент. Это сложно объяснить..."
51090-144 = "...!"
51090-145 = "Но потом Нагуса, которая должна была принять руководство как новый президент, не задумываясь бросила нас. Она ушла искать президента..."
51090-146 = "Для Хяккарёран уже тогда всё закончилось. Мы уже были мертвы. Просто ещё продолжали двигаться."
51090-148 = "Это не... Не может быть правдой!"
51090-149 = "Хяккарёран всё ещё жив... Вы только что это доказали!"
51090-150 = "Вы всё ещё остановили Моурё и не дали им устроить хаос! Что это, если не долг Хяккарёран?!"
51090-152 = "Я сделала это не ради Хяккарёран. Я сделала это, чтобы вернуть годы, которые по глупости ему отдала."
51090-153 = ""
51090-155 = ""
51090-156 = ""
51090-158 = "Моурё мешали мне вернуть мою юность. Я остановила их ради себя."
51090-160 = "Рэнгэ..."
51090-161 = "..."
51090-163 = "Но... Но... Без Хяккарёран мир в Хяккияко..."
51090-164 = "Ха, да ты и правда ничего не понимаешь, да?"
51090-165 = "[s] «Что ты имеешь в виду?»"
51090-166 = "Вы Сенсей из Шале, верно?"
51090-167 = "Помните, Сенсей? Когда небо стало красным?"
51090-168 = "...!"
51090-173 = "Хяккияко погрузилась в хаос."
51090-174 = "Чудовища бесчинствовали на улицах, а студенты в отчаянии взывали, чтобы кто-нибудь их спас — чтобы Хяккарёран их спас."
51090-175 = "Но без президента и вице-президента мы... Мы носились как куры без головы."
51090-176 = "Я, Кикё... И ты тоже, Юкари! Мы метались, пытаясь исправить ситуацию как могли, но сами по себе почти никому не помогли."
51090-177 = "И знаешь, что произошло в итоге?"
51090-178 = "[s] «...Что произошло?»"
51090-179 = "Ничего. Совершенно ничего."
51090-180 = ""
51090-183 = ""
51090-185 = "Юкари, перестань жить во сне. Ты видела то же, что и я. Люди способны решать свои проблемы без Хяккарёран. С Хяккияко всё будет в порядке и без нас."
51090-186 = "Лишь отсутствие Хяккарёран доказало, что мы никогда не были необходимы."
51090-188 = "Даже если президент и вице-президент никогда не вернутся... Никто не пострадает из-за отсутствия Хяккарёран. Мы никому не нужны."
51090-190 = "Наш клуб... всё, что мы делали..."
51090-191 = "В конце концов, мы были всего лишь клубом, который отнимал у людей время и причинял им боль. Правильно, что мы исчезнем."
51090-192 = "Но... но..."
51090-193 = "Рэнгэ! Вы тоже восхищались Нагусой! Вы любили Хяккарёран, я знаю!"
51090-195 = "У Рэнгэ несгибаемое сердце... Для такой колеблющейся души, как моя, она весьма вдохновляет."
51090-196 = "Мы многим обязаны Рэнгэ. Ты ведь тоже так думаешь, Юкари?"
51090-197 = "Конечно!"
51090-198 = "Смело с твоей стороны говорить Нагусе, что Рэнгэ впечатляет тебя больше, Юкари."
51090-199 = "Ч-Что?! Нет, я—"
51090-200 = "Эй, не дразни её только потому, что хочешь смутить меня! Есть вещи, которые слишком неловко слышать, знаешь ли?!"
51090-201 = "...Странно слышать такую искреннюю похвалу от столь утончённого человека."
51090-202 = ""
51090-204 = ""
51090-205 = ""
51090-206 = ""
51090-208 = "...Хи-хи."
51090-210 = "Вы всегда были рядом с нами! Поднимали нам настроение во время долгих патрулей и всегда прикрывали! Я-я гордилась вами! Нагуса вами гордилась!"
51090-211 = "...!!"
51090-212 = "Кому какое дело?! Это не помешало ей бросить нас!"
51090-213 = "Ты не можешь изменить прошлое! И дело даже не только в том, что Нагуса не вернётся!"
51090-214 = "Она уже... Даже после того, как попыталась вернуть это, ты всё равно—!"
51090-215 = "[s] «(...Вернуть?)»"
51090-216 = "Но..."
51090-217 = "Я знаю, прошло уже много времени. Но всё же... если мы снова соберём всех вместе... Если встретимся с Нагусой... И если я выиграю Поединок за преемство...!"
51090-218 = "Если мы это сделаем, всё сможет вернуться как раньше! Мы снова будем все вместе!"
51090-219 = "Вернуться как раньше..."
51090-221 = "...Юкари. Ты всегда была такой. Если считаешь что-то правильным, несёшься вперёд на полной скорости."
51090-222 = ""
51090-223 = "Ты всегда вела себя так, будто всё возможно, если вложить в это всё сердце... Я восхищалась этим в тебе..."
51090-224 = "Но именно поэтому я знаю: одних моих слов и близко не хватит, чтобы заставить тебя отступить."
51090-225 = ""
51090-227 = "Ты не из тех, кого можно убедить, пока не докажешь всё действием."
51090-228 = ""
51090-230 = ""
51090-231 = "Так что я убежу тебя своей силой — прямо здесь и сейчас."
51090-232 = ""
51090-234 = ""
51090-235 = "Я иду, Юкари!"
51090-236 = ""
51090-238 = ""
51090-239 = ""
