[translation]
51090-1 = "Episódio 9;Fuwa Renge"
51090-2 = "...O que você está fazendo aqui?"
51090-3 = "Eu estava procurando por você, Renge-senpai, passando pelos clubes culturais!"
51090-4 = "Mas jamais imaginei que estaria junto com as integrantes do Clube de Disciplina Interior..."
51090-6 = "A Renge-chan dizia há tempos que queria experimentar o Clube de Disciplina Interior."
51090-7 = "Uaaah... Por isso agora... ela está em período de experiência... Zzz..."
51090-8 = "Já sei!#nO vídeo promocional do Clube de Disciplina Interior que eu gravei funcionou mesmo!"
51090-9 = "Vocês duas já se conheciam, então.#nPensando bem, estão usando o mesmo haori azul-claro..."
51090-10 = "Ah! É verdade! A Renge-senpai também é do Hyakkaryouran?"
51090-12 = "Ah... É, sou sim."
51090-13 = "Quer dizer, não é que eu estivesse tentando esconder nem nada..."
51090-14 = "Você está fazendo períodos de experiência em vários clubes em busca de atividades da juventude, não é mesmo?"
51090-15 = "...Ngh?!"
51090-16 = "E-Espera aí! Yukari, como é que você sabe disso...?!"
51090-17 = "Enquanto a procurava, Renge-senpai, fui até a sua residência!"
51090-18 = "Havia um bilhete deixado na porta dizendo \"Parti em uma jornada da juventude\"..."
51090-23 = "Então, ao ouvir que a senpai estava em período de experiência, deduzi que fosse por esse motivo..."
51090-24 = "[s] \"Atividades de clube são mesmo a cara da juventude, né?\""
51090-25 = "Sim!"
51090-26 = "Esse anseio pela juventude... Eu mesma fiquei profundamente comovida."
51090-27 = "Ah, chega! Para de repetir essa palavra sem parar!"
51090-28 = "Todo mundo já teve vontade de deixar um bilhete assim uma vez na vida, não teve...?"
51090-29 = "Dizem por aí que a vida escolar passa num piscar de olhos, então é melhor aproveitar..."
51090-30 = "[s] (Será que alguém disse isso pra ela...?)"
51090-31 = "Ah, quer dizer, não que seja algo para se envergonhar..."
51090-36 = "...Isso mesmo. Como você disse, eu entrei no Clube de Disciplina Interior para aproveitar a minha juventude."
51090-37 = "A juventude que eu perdi até agora em meio a tantos dias de treino...#nPara recuperar a minha juventude!"
51090-38 = "...Então, Yukari. Não sei por que você está me procurando, mas eu já decidi. Vou viver a minha juventude aqui no Clube de Disciplina Interior. Então volte quietinha para—"
51090-40 = "Também estou muito curiosa para saber como são essas atividades da juventude no Clube de Disciplina Interior!"
51090-41 = "Você ouviu alguma coisa do que eu disse?!"
51090-42 = "Se até você, Renge-senpai, chegou a esse ponto...#nEu também fiquei curiosa!"
51090-43 = "P-Por isso, a minha atividade da juventude é..."
51090-44 = "Bom..."
51090-50 = "I-Isso mesmo! No Clube de Disciplina Interior, estou treinando para me tornar uma \"Dama Lutadora do Sono Profundo\"!"
51090-57 = "Hã?"
51090-58 = "Uaaah...?"
51090-59 = "Renge-chan... Você tinha um objetivo desses?!"
51090-60 = "[s] \"...Quer dizer lutar enquanto dorme?\""
51090-65 = "Q-Que diferença faz?!"
51090-66 = "Continua sendo juventude do mesmo jeito!"
51090-68 = "N-Não pode ser..."
51090-69 = "Bem, olhando do ponto de vista da Yukari, talvez pareça mesmo meio estranho..."
51090-70 = "M-Maravilhoso! Que postura admirável, seguindo em frente rumo ao seu objetivo!"
51090-71 = "Como esperado da Renge-senpai que eu tanto respeito!"
51090-72 = "Quê... A-Ah, é?"
51090-77 = "Será que a Kikyou-senpai já sabe disso?"
51090-78 = "Com certeza, a Kikyou-senpai a apoiaria com todas as forças—"
51090-80 = "Claro que não! Aquela lá ia rir da minha cara na certa! Na verdade, ela é a última pessoa que eu quero que saiba!"
51090-81 = "E-Enfim, mudando de assunto! Você queria alguma coisa comigo?"
51090-82 = "...Hã?"
51090-83 = "Como assim \"hã\"...?"
51090-84 = "Pra começo de conversa, as atividades do Hyakkaryouran estão suspensas, não estão?"
51090-85 = "Além disso, você não deveria estar super ocupada agora com os preparativos do festival...?"
51090-87 = "Aaaah!!!"
51090-88 = "[s] \"...?\""
51090-89 = "Aham! Claro que há um motivo pelo qual eu estava procurando por você, Renge-senpai."
51090-90 = "A partir de agora, pretendo desafiar a Nagusa-senpai para o \"Torneio de Sucessão do Hyakkaryouran\"."
51090-91 = "Por isso... gostaria que você me emprestasse a sua força, Renge-senpai."
51090-96 = "...Hã? Torneio de Sucessão?"
51090-97 = "O que diabos... você está pensando em fazer?"
51090-99 = "(Nós contamos à Renge o que aconteceu no Clube Yin-Yang e os planos da Yukari)"
51090-101 = "Era exatamente como a Kikyou-senpai havia dito!"
51090-102 = "A Nagusa-senpai estava na Grande Planície Nevada...!"
51090-104 = "..."
51090-106 = "Portanto, para fazer o Hyakkaryouran voltar a ser o que era—"
51090-107 = "Vou derrotar a Nagusa-senpai no \"Torneio de Sucessão\"..."
51090-108 = "E herdarei o posto de Presidente!"
51090-113 = "..."
51090-114 = "Renge-senpai, vamos voltar juntas."
51090-115 = "Para o Hyakkaryouran, onde a Kikyou-senpai está! E como testemunha do Torneio de Sucessão—"
51090-116 = "Yukari... Você ainda..."
51090-117 = "Ainda está..."
51090-118 = "Sim!"
51090-123 = "Ainda está falando esse tipo de bobagem?"
51090-128 = "...Quê?"
51090-129 = "Como você mesma sabe, já foi emitida uma \"Ordem de Dissolução\" para o Hyakkaryouran."
51090-130 = "A própria Kikyou tomou essa decisão usando sua autoridade como Estrategista."
51090-131 = "Não pode ser... Uma Ordem de Dissolução para o Hyakkaryouran...?#nHum, isso é..."
51090-132 = "[s] \"Mimori, a situação por trás disso é um pouco complicada...\""
51090-134 = "I-Isso não pode ser verdade!"
51090-135 = "Essa Ordem de Dissolução é toda um engano...!"
51090-137 = "—Não é engano nenhum."
51090-142 = "Desde o dia em que a Presidente Ayame desapareceu... estava destinado a acabar assim mais cedo ou mais tarde."
51090-143 = "A Presidente realmente era incrível... mas todo mundo, inclusive você, sempre achou que ela poderia sumir a qualquer momento, não achou?"
51090-144 = "...!"
51090-145 = "A Nagusa-senpai, que deveria herdar o posto, nem olhou para nós que ficamos para trás e foi procurar a Presidente."
51090-146 = "Naquele instante, o Hyakkaryouran já tinha acabado."
51090-148 = "Isso... não é verdade!"
51090-149 = "A-Além disso... você mesma, Renge-senpai, não acabou de provar que o Hyakkaryouran ainda não terminou?!"
51090-150 = "Agora há pouco, você enfrentou a Trupe Chimi! Isso foi por senso de responsabilidade como membro do Hyakkaryouran..."
51090-152 = "Isso é um engano seu, Yukari."
51090-158 = "Eu só dei uma surra nos caras que estavam atrapalhando a minha juventude. Eu lutei por mim mesma."
51090-160 = "Renge-chan..."
51090-161 = "..."
51090-163 = "M-Mas então... se o Hyakkaryouran deixar de existir,#na paz de Hyakkiyako..."
51090-164 = "Hah... Isso sim era pura arrogância nossa."
51090-165 = "[s] \"Como assim...?\""
51090-166 = "Você é o Sensei da Schale, né?"
51090-167 = "Lembra do dia em que o céu ficou vermelho?"
51090-168 = "...!"
51090-173 = "Naquela época, Hyakkiyako estava um caos completo."
51090-174 = "Naquele dia em que monstros apareceram na cidade... dava para ouvir vozes chamando pelo Hyakkaryouran por toda parte."
51090-175 = "Mas sem a Presidente e sem a Vice-Presidente, nós mal dávamos conta de ajudar quem estava bem na nossa frente. Não conseguíamos fazer nada além disso."
51090-176 = "Eu, a Kikyou... e você também, Yukari.#nCorremos de um lado para o outro tentando conter a situação de algum jeito."
51090-177 = "Você lembra o que mudou como resultado de tudo o que fizemos?"
51090-178 = "[s] \"...O que aconteceu?\""
51090-179 = "—Nada.#nNão mudou... absolutamente nada."
51090-185 = "Você estava lá, então deve saber. Mesmo sem o Hyakkaryouran, o problema foi resolvido.#n—Hyakkiyako não precisa do Hyakkaryouran."
51090-186 = "É... Esse é o fato que a nossa ausência naquele dia acabou provando."
51090-188 = "Com ou sem Presidente, com ou sem Vice-Presidente... mesmo que o Hyakkaryouran se dissolva, nada muda em Hyakkiyako. Ninguém precisa de nós."
51090-190 = "Se é assim, então..."
51090-191 = "Não tem por que continuar sofrendo esperando por uma Presidente que não vai voltar... não é?"
51090-192 = "Mas... mesmo assim!"
51090-193 = "V-Você também, Renge-senpai... Você gostava da Nagusa-senpai e das atividades no Hyakkaryouran, não gostava?!"
51090-195 = "A Renge é muito talentosa. Muito mais do que alguém inexperiente como eu."
51090-196 = "Eu tenho muito orgulho dela.#nNé, Yukari, você também acha?"
51090-197 = "Sim!"
51090-198 = "Yukari, ela acabou de dizer que a Renge é mais talentosa que ela mesma."
51090-199 = "Hã...?!"
51090-200 = "Ei! Dá pra parar? Fico com vergonha ouvindo isso!"
51090-201 = "Não consigo ficar feliz de verdade ouvindo isso da Nagusa-senpai, que é mais forte que eu!"
51090-208 = "...Hehe."
51090-210 = "A Nagusa-senpai tinha tanto orgulho de você, Renge-senpai...#nSempre na linha de frente abrindo caminho...!"
51090-211 = "...!!"
51090-212 = "E daí?! No fim das contas, nós fomos abandonadas!"
51090-213 = "O passado é passado.#nA Nagusa-senpai não vai mais voltar... muito pelo contrário..."
51090-214 = "Ela tentou devolver... Mesmo assim, você...!"
51090-215 = "[s] (O que será que a Renge disse...?)"
51090-216 = "Mas..."
51090-217 = "Não vou dizer que agora não dói... mas mesmo assim, se a Nagusa-senpai voltar e pudermos nos reunir todas de novo..."
51090-218 = "Se eu conseguir vencer o \"Torneio de Sucessão\"...#nSe a Nagusa-senpai puder entender os meus sentimentos... mais uma vez, aqueles dias...!"
51090-219 = "Tenho certeza... de que poderemos sorrir... como naquela época..."
51090-221 = "...Você sempre foi assim, Yukari.#nQuando acredita que está certa, segue em frente sem olhar para os lados."
51090-223 = "Sempre transbordando confiança... achando que, se quiser de verdade, consegue fazer qualquer coisa."
51090-224 = "Você realmente... nunca volta atrás."
51090-227 = "E continuar sem se convencer só na conversa, precisando bater de frente para entender... isso também não mudou nada."
51090-231 = "Já que é assim, vou fazer você entender na marra."
51090-235 = "Yukari... está preparada?"
