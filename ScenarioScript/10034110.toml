[translation]
10034110-1 = "7 дней назад: Сделать всё как следует"
10034110-4 = "Ладно! Осталось всего несколько дней, так что пора взяться всерьёз."
10034110-5 = "До сих пор мы усердно репетировали, и шанс у нас есть. Так что давайте выложимся в эту последнюю неделю!"
10034110-6 = "Лихорадочная подготовка в канун решающей битвы..."
10034110-8 = "...Это определённо рок."
10034110-9 = "И долго ты ещё будешь пытаться сделать это своей фишкой?"
10034110-10 = "...Около недели? Пока не сниму этот наряд?"
10034110-11 = "То есть это сезонная реплика."
10034110-12 = "Не хочу никого разочаровывать, но конкуренция будет ЖЁСТКОЙ. Легко не будет."
10034110-13 = "М-мы всё равно справимся! Может быть... Точно!"
10034110-14 = "...Нет, мы СПРАВИМСЯ! Да!"
10034110-15 = "...Айри?"
10034110-16 = "Эм... Это... Ну..."
10034110-17 = "Эм..."
10034110-18 = "Просто такое чувство. Эхехе..."
10034110-19 = ""
10034110-21 = ""
10034110-22 = "...Ну, неважно. Думаю, раз уж мы это делаем, надо делать всё как следует. Да?"
10034110-23 = "А? Что за резкая смена настроя?"
10034110-24 = "Эй, эй. Хватит ерунды. На неё нет времени!"
10034110-25 = "Давайте начинать!"
10034110-26 = "Кто тебя главной назначил?"
