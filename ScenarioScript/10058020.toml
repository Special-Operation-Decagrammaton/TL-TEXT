10058020-58 = "...Last time I said, 'Tanks are like family to me,'#nand you gave it some ridiculous title, didn't you?"
10058020-59 = "Ahaha...#nI just exaggerated a *teeny* bit to get the readers excited..."
10058020-60 = "What was the title?"
10058020-61 = "'Iroha Natsume's Hidden Family Revealed'"
10058020-62 = "I-Isn't a growing family a good thing?"
10058020-63 = "Chiaki... do you know how many bones make up the human skull?"
10058020-64 = "I learned that when we interviewed for the last feature article! It's 23, right!"
10058020-65 = "Would you like me to increase that to 230 right now?"
10058020-66 = "Eep...!"
10058020-67 = "Ahahaha! I think I'm fine with just the 23!"
10058020-68 = "Iroha! You're not planning to skip out on promotional activities, are you!?"
10058020-69 = "I will not allow it! We must make the majesty of the Pandemonium Society echo across all of Kivotos!"
10058020-70 = "What does that even have to do with anything..."
10058020-71 = "Kikikik, if I were to list the reasons, a hundred wouldn't be enough! First—"
10058020-72 = "That's quite alright. I didn't actually want to hear your reasons."
10058020-73 = "I'm getting down, so please stop throwing a tantrum."
10058020-78 = "...This is fine, right?"
10058020-79 = "Huh? Where's that sexy uniform?"
10058020-80 = "We went out of our way to have it custom-made, so why are you in your usual clothes!?"
10058020-81 = "How many times do I have to tell you...#nThat is an outfit for race ambassadors, not something for the actual contestants to wear."
10058020-82 = "Listen well, Iroha. The Pandemonium Society is at the top of Gehenna, and you are the tank commander of the Pandemonium Society..."
10058020-83 = "Which means...#nGehenna's spotlight depends entirely on how much you stand out!"
10058020-84 = "The Intelligence Department reported that Schale's Sensei is rather fond of such attire."
10058020-85 = "If Sensei, invited as our commentator, sees you captivated in that outfit...#nIt'll only be a matter of time before Gehenna rules all of Kivotos!"
10058020-86 = "Like I said, that's for people participating in the race, not..."
10058020-87 = "Sigh... explaining this is becoming exhausting..."
10058020-88 = "...If it bothers you that much, please hand out those clothes first.#nI can't wear something I don't have."
