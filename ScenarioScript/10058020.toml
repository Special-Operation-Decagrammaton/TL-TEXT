10058020-92 = "Satsuki! Bring me *that*!"
10058020-93 = "Right, Makoto-chan! It's already ready to go!"
10058020-94 = "Then—"
10058020-104 = "So this is, basically..."
10058020-105 = "I see, so it's an outfit that only fools can see!"
10058020-106 = "K-Kikikik. I shall put it on at once!"
10058020-111 = "As if something like that could possibly exist..."
10058020-112 = "Look closely. The box is completely empty."
10058020-113 = "W-Wha...? Where on earth did the clothes go?#nI'm sure I hadn't opened the box yet..."
10058020-114 = "It was super heavy when Ibuki brought it yesterday, though!"
10058020-115 = "T-The clothes are gone?"
10058020-116 = "You don't even have anything to change into, so why are you trying to strip?"
10058020-117 = "Hold that pose! Ahh, what a missed photo op~!"
10058020-118 = "This is a direct challenge to the authority of the Pandemonium Society!"
10058020-119 = "Either way is fine, but it's almost time for the race."
