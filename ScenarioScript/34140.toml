[translation]
34140-1 = "Episódio 14;Encontro"
34140-4 = "...Limpo. Até aqui está seguro."
34140-5 = "S-Sim! Está tudo bem!"
34140-6 = "Estranho... a cidade está silenciosa demais.#nJá era um lugar com pouco movimento, mas não deveria ser a esse ponto."
34140-7 = "T-Tem... um monte de coisas que eu não conheço espalhadas por aí..."
34140-8 = "É verdade... eu também estou sentindo essa estranheza já faz um tempo."
34140-9 = "Por mais que tenhamos ficado longe do distrito autônomo por um bom tempo, esta cidade se tornou um lugar completamente desconhecido para mim."
34140-10 = "..."
34140-11 = "C-Como posso dizer... pensando bem agora, tenho a impressão de que coisas estranhas já vinham aparecendo aos poucos desde antes."
34140-12 = "Os mísseis de cruzeiro instalados por todo o distrito autônomo... as armas misteriosas que recebíamos como suprimento..."
34140-13 = "E, parando para pensar agora, aquela coisa de \"Réplica\" também não era muito estranha? Mesmo assim, sinto que aceitávamos tudo sem questionar nada."
34140-19 = "Desde quando Arius tem coisas como mísseis de cruzeiro...?"
34140-20 = "E quando foi que passamos a controlar um poder tão misterioso daqueles...?"
34140-21 = "...E a \"bomba que destrói halos\" também."
34140-22 = "Mas afinal, desde quando...?"
34140-24 = "..."
34140-25 = "Esperem um pouco... tem alguém ali. Escondam-se."
34140-37 = "Aquilo é..."
34140-38 = "O-O Conselho das Santas!? É o Conselho das Santas de Justina, não é?#nE aquela aparência..."
34140-39 = "...Por quê?#nAgora que o Tratado do Éden foi anulado, deveria ser impossível controlá-las."
34140-40 = "...Pensando bem."
34140-41 = "Para começo de conversa, o motivo de termos atacado o local do Tratado do Éden era garantir a capacidade de \"Réplica\"."
34140-42 = "É verdade... foi por isso que a Princesa-chan fez o que aquele \"boneco de madeira\" mandou no subsolo da Antiga Catedral..."
34140-43 = "E, com as forças do Conselho das Santas garantidas dessa forma, ocupar os distritos autônomos de Trinity e de Gehenna...#nEssa era a nossa missão."
34140-44 = "Embora tenhamos sido derrotadas pela \"Schale\" depois disso."
34140-45 = "Sim... e foi por esse motivo que fugimos.#nPorque falhamos tanto em garantir a capacidade de \"Réplica\" quanto em ocupar as duas academias."
34140-46 = "E, mesmo assim...#nO Distrito Autônomo de Arius... \"ela\" já garantiu a capacidade de \"Réplica\"...?"
34140-53 = "(Vuuuuuuuuuum!)"
34140-54 = "Esse som é..."
34140-55 = "É o grito do \"Ambrosius\", que usamos como \"arma tática\" na época do Tratado do Éden. ...Parece que são mesmo as \"Réplicas\" que nós controlamos naquela ocasião."
34140-56 = "O que significa que..."
34140-57 = "...Bastava que a \"Réplica\" tivesse sucesso uma única vez..."
34140-58 = "Ou seja, a nossa verdadeira missão desde o início era...#nApenas \"levar a Princesa até a Antiga Catedral e ativar a Réplica\"...?"
34140-59 = "Então, a missão de ocupar Trinity e Gehenna..."
34140-60 = "— Para ela, não tinha a menor importância...?"
34140-61 = "..."
34140-62 = "Então, a nossa missão..."
34140-63 = "Que sentido teve tudo aquilo, afinal?"
34140-71 = "...Estamos cercadas!?"
34140-72 = "Tsc... Uma armadilha."
34140-73 = "...Sabiam que viríamos para cá."
34140-77 = "Sim, é claro."
34140-78 = "...Madame."
34140-79 = "Este é um território sob o meu domínio.#nEu tenho total controle sobre a localização de vocês, seu destino e até mesmo a rota que estão seguindo."
34140-80 = "Eu também sabia desde o princípio que vocês tentariam ir ao corredor subterrâneo do prédio antigo.#nCrianças tolas — é impossível esconder qualquer coisa de mim."
34140-81 = "I-Iiiih... D-Desde o princípio..."
34140-82 = "No fim das contas, estávamos mesmo na palma da mão dela..."
34140-83 = "..."
34140-84 = "Sim, é exatamente isso."
34140-85 = "A missão de vocês, desde o início, era \"levar o Sangue Real até a Antiga Catedral e fazer o Conselho das Santas se manifestar\"... apenas isso."
34140-86 = "Contanto que o Caminho fosse conectado uma única vez, eu mesma poderia assumir o controle a partir da seguinte.#nEmbora o Maestro tenha detestado a ideia, achando que suas obras estavam sendo roubadas."
34140-87 = "..."
34140-88 = "Ora, se Trinity ou Gehenna seriam ocupadas ou não, isso para mim é uma questão trivial."
34140-89 = "Não passava de um pretexto conveniente para controlar o ódio que este distrito autônomo cultivou por tantos anos.#nEu mesma não tenho rancor algum daquelas academias."
34140-90 = "...!!"
34140-91 = "Pois é. Portanto, pode-se dizer que você cumpriu a sua missão. Afinal, me proporcionou a capacidade de \"Réplica\"—"
34140-92 = "E ainda me ofereceu docilmente o Sangue Real como sacrifício.#nVocê é uma boa menina que obedece direitinho às ordens, Saori."
34140-93 = "...Como eu pensava, você nunca teve a intenção de cumprir a promessa desde o começo..."
34140-94 = "Enfim, deixemos essa conversa infrutífera por aqui... O meu verdadeiro interesse é... sim."
34140-100 = "G-Guh..."
34140-102 = "Muito prazer em conhecê-lo, Sensei [USERNAME]."
34140-103 = "[s] \".........!!\""
34140-104 = "Eu me chamo Beatrice. Como talvez já saiba, sou um dos membros da \"Gematria\". Perdoe-me por cumprimentá-lo através de uma transmissão."
34140-105 = "Já ouvi falar muito a seu respeito pelo Terno Preto, pelo Maestro e por Golconde."
34140-106 = "[s] \"Você é quem está dominando Arius... Beatrice?\""
34140-107 = "Sim. E, atualmente, sou a única na Gematria a ter alcançado o sucesso."
34140-108 = "Fufu... Ficou curioso a meu respeito?#nSobre como coloquei Arius na palma da minha mão... Se quiser, posso trocar essa resposta pelas informações que você possui, que tal?"
34140-109 = "[s1] \"Não preciso disso.\"\n[s2] \"Eu já conheço os seus métodos.\""
34140-110 = "Oh, é mesmo?"
34140-111 = "Oh, é mesmo?"
34140-112 = "Em defesa da minha honra, permita-me esclarecer que não utilizei nenhum poder especial."
34140-113 = "Lavagem cerebral ou poderes sobrenaturais... Hehehe, seria ótimo se eu tivesse uma habilidade tão conveniente assim.#nInfelizmente, esse não é o jeito dos \"adultos\"."
34140-114 = "Sim. Ódio, raiva, desprezo, repulsa — eu apenas utilizei essas emoções negativas para dominar as crianças com falsidades e enganos."
34140-115 = "É um método simples, porém infalível. Você deve saber muito bem disso, não é?"
34140-117 = "...Para começo de conversa, este distrito autônomo já estava em guerra civil antes mesmo da minha chegada."
34140-118 = "As emoções negativas que nutriam umas pelas outras já transbordavam mais do que o suficiente.#n— Eu apenas fiz bom uso disso."
34140-119 = "E não é como se este lugar fosse especial.#nAlgo assim não passa de um cenário perfeitamente comum?"
34140-122 = "Pois é... Na verdade, quando se trata de ódio, talvez o de Trinity seja ainda mais forte do que o daqui."
34140-124 = "Eu apenas agi seguindo esse fluxo."
34140-125 = "Distorci o provérbio que ensina a humildade da vida, transformando-o em um vazio sem valor..."
34140-126 = "Distorci a rigorosa autocrítica que alerta contra a corrupção, transformando-a em um sentimento de culpa inescapável..."
34140-127 = "Distorcer os fatos, ocultar a verdade, deturpar as verdadeiras intenções, alimentar a repulsa, incitar o ódio e fazer do outro, do outro, do outro, do outro — eternamente estranhos uns aos outros."
34140-128 = "O paraíso só pode ser paraíso justamente porque jamais será alcançado. E, dentro desse inferno, os \"adultos\" dominam, exploram e devoram as \"crianças\"."
34140-129 = "Sim — para alguns pode parecer o inferno, mas este é o verdadeiro e plácido paraíso dos \"adultos\"."
34140-130 = "Sendo assim, você também consegue compreender esta minha predação, não é? Sensei?"
34140-132 = "E será que você poderia simplesmente deixar o Sangue Real em paz?"
34140-133 = "Aquela garota é uma aluna a quem ensinei com todo o meu esmero. Se a oferecermos como sacrifício, certamente trará um evangelho maravilhoso para nós, adultos."
34140-134 = "Não está curioso? Sobre o que estou fazendo e que grande feito estou prestes a alcançar.#nSim — posso lhe contar tudo agora mesmo, aqui e agora."
34140-135 = "O que me diz, Sensei?"
34140-137 = "Por exemplo, este mundo — não gostaria de saber que tipo de lugar é esta Kivotos?"
34140-138 = "Este mundo é uma incógnita — um sublime conversor onde o místico e o terror se misturam, completamente além de qualquer compreensão."
34140-140 = "Sim... eu posso lhe ensinar a verdade sobre este mundo.#nO que acha? Se deixar escapar esta oportunidade, talvez nunca mais haja uma próxima vez."
34140-141 = "[s] \"Já chega.\""
34140-142 = "Oh?"
34140-143 = "[s3] \"Não tenho interesse nesse tipo de coisa.\"\n[s4] \"Não preciso de uma verdade alcançada através do sacrifício de alguém.\""
34140-144 = "...Hehehe. Entendo... Como esperado, tinha que terminar assim."
34140-145 = "...Hehehe. Entendo... Como esperado, tinha que terminar assim."
34140-146 = "Ao que parece, nós dois acreditamos em verdades diferentes.#nSim — não resta a menor dúvida de que você é o meu antagonista."
34140-147 = "Sim... Agora eu compreendo. O paraíso de que você fala era o \"Tratado do Éden\", não é?#nUm mundo simples e fácil de entender, onde o mal é repelido pela amizade de todos."
34140-148 = "Hehehe... Por que o pensamento das crianças é sempre tão puro e simplório?"
34140-149 = "Dar a algo o nome de paraíso não muda absolutamente nada.#nPelo contrário, como adulto, é meu dever ensinar a verdade como ela realmente é:"
34140-150 = "\"Que esse mesmo paraíso foi o lugar onde o pecado original começou\"..."
34140-151 = "E que o verdadeiro paraíso transborda de ódio, raiva, repulsa, dor e remorso—#né repleto de coisas assim."
34140-152 = "[ns] \"Beatrice.\""
34140-154 = "[ns5] \"Você insultou as alunas, insultou a nós.\"\n[ns6] \"E insultou o 'ensino' e o 'aprendizado'.\"\n[ns7] \"Como adulto, eu jamais poderei perdoar você.\""
34140-159 = "...Posso considerar isso uma declaração de guerra?"
34140-160 = "Pois bem, estarei esperando na Basílica.#n— Isto é, se conseguirem chegar até lá."
34140-161 = "Vamos acertar nossas contas lá."
34140-162 = "Venha, Sensei — ó ser incompreensível."
34140-164 = "O Terno Preto o reconhece como um companheiro, acreditando que podem competir entre si."
34140-165 = "O Maestro o reconhece como alguém capaz de compreendê-lo, acreditando que podem elevar um ao outro."
34140-166 = "Golconde o reconhece como uma metáfora, acreditando que serão completados um através do outro."
34140-167 = "E eu o reconheço como um antagonista, acreditando que nos repelimos mutuamente."
34140-169 = "Você é meu inimigo."
34140-177 = "(...)"
34140-178 = "(...)"
34140-179 = "(S-Sim. E-Eu estou... pronta!)"
34140-180 = "Eliminem todos."
34140-185 = "[ns] \"Vamos, Esquadrão!\""
34140-186 = "Sim!"
