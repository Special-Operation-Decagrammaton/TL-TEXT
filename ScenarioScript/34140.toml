[translation]
34140-1 = "Эпизод 14;Лицом к лицу"
34140-3 = ""
34140-4 = "Всё чисто. Двигаемся."
34140-5 = "Ох, жизнь и правда сплошное страдание."
34140-6 = "Вам тоже кажется, что здесь слишком тихо? Никогда не видела район настолько пустым."
34140-7 = "На этой улице полно вещей, которых я раньше не видела."
34140-8 = "С самого прибытия здесь что-то не так."
34140-9 = "Пусть нас долго не было, но всё ощущается иначе."
34140-10 = "..."
34140-11 = "Например, здесь всегда было столько безумного оборудования?"
34140-12 = "Крылатые ракеты повсюду, оружие для раздачи на каждом углу."
34140-13 = "Кстати, вам не кажется, что Мимесисы очень странные? А мы просто приняли их как должное."
34140-14 = ""
34140-16 = ""
34140-19 = "Как давно у Ариуса появилась эта крылатая ракета?"
34140-20 = "Когда вы получили контроль над этими загадочными солдатами?"
34140-21 = "Даже бомба, способная разрушать нимбы..."
34140-22 = "Как всё это вообще возможно?"
34140-23 = ""
34140-24 = "..."
34140-25 = "Враг приближается. Спрятаться."
34140-26 = ""
34140-28 = ""
34140-32 = ""
34140-35 = ""
34140-37 = "Разве это не...?"
34140-38 = "С-Совет?! Совет Святой Юстины? Почему они так жутко выглядят?"
34140-39 = "Как они могут быть здесь? Сенсей ведь отменил наш контракт."
34140-40 = "Если подумать..."
34140-41 = "Целью операции с Эдемским договором было получить способность Мимесиса."
34140-42 = "Химэ сделала всё, что велела деревянная кукла в подвале собора, точно по инструкции."
34140-43 = "Получив войска Совета, мы должны были занять районы Тринити и Геенны."
34140-44 = "Но проиграли Шале."
34140-45 = "Да... Мы провалили и получение способности Мимесиса, и захват академий."
34140-46 = "Но... она уже получила способность Мимесиса...?"
34140-47 = ""
34140-49 = ""
34140-53 = "Р-А-А-А-А-А."
34140-54 = "Ч-Что это было...?"
34140-55 = "Крик Амвросия, тактического оружия, использованного во время инцидента с Эдемским договором. Похоже, это тоже разновидность Мимесиса."
34140-56 = "То есть получается..."
34140-57 = "Да. Возможно, ей нужен был всего один успешный Мимесис."
34140-58 = "Настоящей нашей миссией, должно быть, было привести Химэ в старый собор и активировать Мимесис."
34140-59 = "Тогда наша миссия по захвату Геенны и Тринити..."
34140-60 = "...для неё вообще... ничего не значила?"
34140-61 = "..."
34140-62 = "Тогда в чём был смысл всего этого? Всей этой боли..."
34140-63 = "Какой же смысл в этом МОГ быть, малышка?"
34140-64 = ""
34140-66 = ""
34140-68 = ""
34140-70 = ""
34140-71 = "...Нас окружили?!"
34140-72 = "Как вы..."
34140-73 = "Она знала, что это наш единственный путь внутрь."
34140-74 = ""
34140-76 = ""
34140-77 = "Пять с плюсом тебе, маленькая Мисаки."
34140-78 = "...Мадам."
34140-79 = "Это моя территория. Здесь вы не можете даже вдохнуть без моего ведома."
34140-80 = "Ваши детские планы были очевидны с самого начала. Вы правда думали, что сможете меня перехитрить?"
34140-81 = "О-Она прочитала нас как ж-журнал!"
34140-82 = "Именно. Всё это время мы лишь играли по её правилам."
34140-83 = "..."
34140-84 = "И да, Саори. Ты была права."
34140-85 = "С самого начала ваша истинная миссия заключалась в том, чтобы привести королевскую кровь в старый собор и воплотить Совет."
34140-86 = "Мне нужно было лишь, чтобы вы открыли путь к способности Мимесиса. Конечно, Маэстро не любит, когда я вторгаюсь в его якобы область знаний."
34140-87 = "..."
34140-88 = "Тринити и Геенна были лишь мелкими мухами, севшими на мою шахматную доску."
34140-89 = "Я использовала их только как повод разжечь глубокую ненависть внутри вашего района. Она сделала вас, маленьких дурочек... такими, такими лёгкими для контроля."
34140-90 = "...?!"
34140-91 = "В этом смысле, пожалуй, вы всё-таки выполнили свою миссию! Без вас я не получила бы способность Мимесиса."
34140-92 = "И мало того — вы так послушно передали мне королевскую кровь. Какая хорошая девочка, Саори."
34140-93 = "Я подчинялась только ради безопасности Химэ! Ты нам лгала."
34140-94 = "Да-да. Так трагично, так печально. В любом случае у меня есть дела поважнее."
34140-95 = ""
34140-97 = ""
34140-100 = "У-Ух!"
34140-102 = "И вот мы наконец встретились, Сенсей [USERNAME]."
34140-103 = "[s] «Откуда ты знаешь, кто я?»"
34140-104 = "Преподаватель Шале. Любимый всеми Сенсей. Ваша репутация действительно идёт впереди вас. Я давно ждала этой встречи."
34140-105 = "Позвольте представиться. Я Беатриче, член Гематрии, но можете звать меня Мадам."
34140-106 = "[s] «Не могу сказать, что рад знакомству, Беатриче. Ты... правительница Ариуса?»"
34140-107 = "Ц. Какая наглость. Да, я единственная в Гематрии, кому удалось создать собственные владения. И взгляните, как они процветают."
34140-108 = "Разве вам не любопытно, как я подчинила себе всё ученичество? Я расскажу свои секреты... конечно, в обмен на несколько ваших."
34140-109 = "[s1] «Мне плевать на твои извращённые методы.»\n[s2] «Я и так знаю, как действуют такие, как ты.»"
34140-110 = "О? Вы именно такой, каким я вас представляла."
34140-111 = "О? Как разочаровывает."
34140-112 = "Видите ли, несмотря на мой внешний вид, у меня нет особых сил или способностей."
34140-113 = "Иногда я мечтала о них... контроле разума, промывке мозгов. Это наверняка сэкономило бы мне немало времени. Но мы, взрослые, должны действовать по-своему, как вы прекрасно знаете."
34140-114 = "Ненависть, презрение, гнев, отвращение... Такие сильные, всепоглощающие эмоции. Ими смехотворно легко манипулировать."
34140-115 = "Мне нравится изящество этого метода. Нужно лишь поджечь фитиль и смотреть, как мои тщательно выстроенные планы сжигают мир. По крайней мере, так было бы, если бы вы не вмешались."
34140-117 = "Но эти глупые маленькие соплячки, которых вы так стараетесь спасти, ещё до моего появления уже вели гражданскую войну. Вы знали об этом, Сенсей?"
34140-118 = "Вся эта глубоко укоренившаяся ярость... кипящая ненависть к миру. Я всего лишь... воспользовалась ею. Трудно назвать их бедными невинными студентами."
34140-119 = "Разумеется, все студенты, которых вы так рьяно защищаете, такие же. Человеческая природа в своей основе жестока и эгоистична."
34140-122 = "Достаточно взглянуть на Тринити, чтобы понять. Вы сами видели, Сенсей. Их ненависть. Их жестокость."
34140-123 = ""
34140-124 = "Если посмотреть с этой стороны, разве в моих методах нет красоты?"
34140-125 = "Я лишь запускаю руку в ненасытную пустоту ненависти, которая уже есть внутри них, и разрываю её ещё шире. А затем заполняю эту дыру собственным учением, пока мой голос не становится единственной командой, которой они следуют."
34140-126 = "А заставляя их совершать чудовищные преступления по моему приказу... врождённое чувство вины лишь сильнее привязывает их ко мне. Моя ли это вина? Их? Обожаю смотреть, как они рассыпаются."
34140-127 = "Понимаете, я искажаю саму ткань их реальности. Их эмоции больше им не принадлежат, отношения друг с другом рушатся, а я становлюсь единственной спасательной лодкой посреди предательского моря."
34140-128 = "Рай остаётся раем только если он доступен избранным. А в моём взрослые господствуют, эксплуатируют и пожирают эти несчастные души."
34140-129 = "Чем хуже им, тем уютнее становится этот рай для меня."
34140-130 = "А теперь, дорогой Сенсей. Почему бы вам не уйти и не позволить мне спокойно питаться моими верными подданными?"
34140-132 = "Не могли бы вы отказаться от королевской крови?"
34140-133 = "Я вложила в неё столько сил. Вы ведь не хотите, чтобы всё пропало зря? И обещаю, её жертва принесёт пользу и вам."
34140-134 = "Вам совсем не любопытно, чего можно добиться, пожертвовав одним незначительным студентом?"
34140-135 = "Я создам мир специально для вас. Разве это не звучит заманчиво, Сенсей?"
34140-137 = "Присоединяйтесь ко мне, и я расскажу всё. О нашем новом мире и о тайнах мира, в котором мы сейчас живём."
34140-138 = "Кивотос... поистине... чудо. Возвышенная история тайн и ужаса."
34140-139 = ""
34140-140 = "И я могу показать вам правду обо всём. Возьмите меня за руку, Сенсей. В последний раз я её протягиваю."
34140-141 = "[ns] «Хватит с меня твоей болтовни.»"
34140-142 = "О?"
34140-143 = "[s3] «Меня не интересуют твои бредовые извращённые мечты.»\n[s4] «Мне не нужна истина, требующая невинной крови.»"
34140-144 = "Ха-ха-ха. Они были правы. Вы непреклонны в своих убеждениях."
34140-145 = "Ха-ха-ха. Они были правы. Вы непреклонны в своих убеждениях."
34140-146 = "Если наши истины несовместимы, я могу видеть в вас лишь противника."
34140-147 = "Так... этот Эдемский договор — ваш рай? Неуклюжий идеалистичный мир, где любовь и дружба всё преодолевают?"
34140-148 = "Вы ничем не лучше этих наивных детей."
34140-149 = "Нельзя просто наклеить на что-то слово «рай» и продать им. Как взрослый, вы должны учить истине."
34140-150 = "«Рай — источник первого греха...»"
34140-151 = "Настоящий рай — это ненависть. Гнев и сожаление. Зло, которое живёт внутри каждого из нас."
34140-152 = "[ns] «Беатриче.»"
34140-153 = ""
34140-154 = "[ns5] «Ты достаточно долго оскорбляла наш образ жизни.»\n[ns6] «Твои методы оскорбляют всё, во что я верю.»\n[ns7] «Как взрослый, я не могу тебя простить.»"
34140-159 = "...Значит, вот какой путь вы выбираете, Сенсей?"
34140-160 = "Пусть так. Я буду ждать вас в базилике."
34140-161 = "Давайте поспорим, сможете ли вы вообще до меня добраться."
34140-162 = "Сенсей, вы поистине непостижимое существо."
34140-164 = "Чёрный костюм считает вас соперником. Немалый комплимент от него."
34140-165 = "Маэстро вами совершенно очарован. Он считает, что только вы способны его понять."
34140-166 = "Для Голконды вы — метафора, завершающая его вечный поиск."
34140-167 = "А я воспринимаю вас как противника. Мы отталкиваем друг друга, как масло и вода."
34140-169 = "Мой естественный враг."
34140-170 = ""
34140-174 = ""
34140-175 = ""
34140-177 = "(...)"
34140-178 = "(...)"
34140-179 = "(Да, да, да. М-Мы... готовы!)"
34140-180 = "Раздавите их. Втопчите в землю."
34140-181 = ""
34140-183 = ""
34140-184 = ""
34140-185 = "[ns] «Я с вами, отряд!»"
34140-186 = "БЕАТРИЧЕ!"
