[translation]
83301100200-5 = ""
83301100200-6 = "Глава префектов! Вы уверены, что это разумно?"
83301100200-7 = "Что именно ты называешь неразумным?"
83301100200-8 = "Согласиться на требования этой идиотки, даже если за ними стоит Общество Пандемониума...!"
83301100200-9 = "Не о чем беспокоиться. Нельзя сказать, что председатель совсем уж неправа."
83301100200-10 = "Как я уже сказала... я тоже чувствую ответственность за произошедшее."
83301100200-11 = "И... чтобы оправдать ожидания Сенсея..."
83301100200-12 = "Хм?"
83301100200-13 = "...Нет, ничего."
83301100200-14 = "Хорошо... раз вы так говорите."
83301100200-15 = "Как бы то ни было, нам нужно собрать информацию. Нет смысла преследовать Отдел горячих источников без какого-либо плана."
83301100200-16 = "Сомневаюсь, что Отдел горячих источников решил раскопать Зал собраний Общества Пандемониума просто по прихоти."
83301100200-17 = "Кинугава Касуми, глава Отдела горячих источников, конечно, способна действовать по наитию..."
83301100200-18 = "Но за её кажущейся импровизацией может скрываться куда более глубокий расчёт. Уверена, у её действий есть причина."
83301100200-19 = "Причина... помимо желания превратить парковку в горячий источник?"
83301100200-20 = ""
83301100200-22 = ""
83301100200-23 = "А, кстати... Среди студентов ходит один слух."
83301100200-24 = "Слух?"
83301100200-25 = "Говорят, Отдел горячих источников обнаружил истинный потенциал Геенны... и что мы стоим на пороге революции горячих источников."
83301100200-26 = "Будто появится нечто, что навсегда решит все проблемы Геенны с горячими источниками. И на волне этих слухов билеты раннего доступа к источникам раскупили полностью."
83301100200-27 = "Раннего... чего?"
83301100200-28 = "Я тоже не совсем понимаю, что это значит... но очевидно, что нам нужно расследовать дело и узнать подробности."
83301100200-29 = "Теперь понимаю, Ако. Спасибо."
83301100200-30 = "Конечно! Если понадобится что-нибудь ещё, только скажите — я помогу всем, чем смогу!"
83301100200-31 = "Прежде чем расспрашивать студентов, следует осмотреть место..."
