[translation]
10047005-1 = "Пролог;Пророчество"
10047005-3 = ""
10047005-4 = ""
10047005-5 = "...Вот. Время пришло."
10047005-6 = "Сила Арканы направит нас к созданию нового будущего."
10047005-7 = "Ню-ху-ху... Начнём же. #nПока Проклятый не принёс гибельный конец."
10047005-8 = ""
10047005-10 = ""
10047005-11 = ""
10047005-13 = "...О ты, призванный зовом судьбы."
10047005-14 = "Скоро покровительство звёзд высечет надежду."
10047005-15 = "И восходящее солнце изгонит скверну..."
10047005-16 = "Колесница победы прорвётся сквозь отчаяние."
10047005-17 = "И эта могучая сила низвергнет зловещую башню..."
10047005-18 = ""
10047005-19 = "И принесёт блистательный рассвет."
10047005-20 = ""
10047005-22 = ""
10047005-23 = ""
10047005-24 = "О-о, это гадание...!"
10047005-25 = "Ошибки быть не может. Это пророчество предсказывает исполнение самых заветных желаний каждого!"
10047005-26 = "Ню-ху-ху. День, когда моё художественное чутьё взорвётся... уже совсем близко!"
10047005-27 = "Ню-ху, ню-ху-ху-ху..."
10047005-28 = "Ню-ху-ху-ху-ху...!!"
10047005-29 = ""
10047005-31 = ""
10047005-32 = "Вот теперь! Мне нечего бояться, что бы ни принесло будущее!"
10047005-33 = "Начнём!"
10047005-34 = "Этот блистательный первый шаг будет высечен в истории!"
