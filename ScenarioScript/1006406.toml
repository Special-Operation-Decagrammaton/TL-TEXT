[translation]
1006406-1 = "Как снизить стресс"
1006406-2 = "...С Нового года я постоянно бегаю по всему Кивотосу, помогая разбираться с возникающими делами."
1006406-4 = "Сенсей, если во время розыгрыша в ханэцуки я выполню бэкхенд-смэш, это будет считаться нарушением правил...?"
1006406-5 = "Обычно я держу ракетку хваткой shakehand, и когда бью смэш как в пинг-понге, моя подруга ужасно злится..."
1006406-6 = "[s1] «Вот это действительно непростой вопрос...»\n[s2] «Давай пока подумаем об этом вместе...»"
1006406-10 = "Я оказался втянут в консультации, которые было трудно разрешить, и даже в неожиданные споры..."
1006406-12 = "Ты вообще кто такой? С чего ты решил вмешиваться в чужие дела?"
1006406-13 = "Какая тебе разница, сколько я плачу своему студенту-подработчице в месяц?"
1006406-14 = "А? Сенсей из Шале...?"
1006406-15 = "Да плевать! Будь ты хоть Сенсей из Шале, хоть президент Генерального студсовета, если будешь мешать моему бизнесу..."
1006406-16 = "С тобой случится что-нибудь ужасное!"
1006406-17 = "[s] «У-успокойтесь, давайте сначала поговорим...»"
1006406-19 = "К концу дня я был полностью вымотан..."
1006406-22 = "...О, Сенсей?"
1006406-23 = "Вот уж неожиданная встреча. Всё хорошо?"
1006406-24 = ""
1006406-26 = ""
1006406-27 = "...Вообще-то, не похоже. Что-то случилось?"
1006406-28 = "[s3] «Я вымотан, Каёко.» \n[s4] «Сегодня особенно много всего навалилось...»"
1006406-29 = "...Хм, это большая проблема."
1006406-30 = "...Хм, это большая проблема."
1006406-31 = "На вас столько всего навалилось из-за работы Сенсея в Шале. Простите, что могу предложить только слова поддержки."
1006406-32 = "[s] «Твоих слов поддержки более чем достаточно... спасибо.»"
1006406-34 = "[ns] «Кстати, куда ты направлялась, Каёко?»"
1006406-35 = "О, я шла на концерт неподалёку. Там выступает группа, которая мне нравится."
1006406-36 = "Вы раньше слышали о Wagakki Club?"
1006406-37 = "Это группа, которая играет современную поп-музыку на традиционных инструментах вроде сямисэна, барабанов и кото..."
1006406-38 = "Современная поп-музыка в исполнении традиционных инструментов показалась мне довольно необычной, поэтому я часто за ними слежу."
1006406-39 = "[s5] «Современный поп на традиционных инструментах, говоришь...»\n[s6] «Наверное, хорошо освежает.»"
1006406-40 = "Да, необычное звучание вагакки помогает мне снять стресс..."
1006406-41 = "Да, необычное звучание вагакки помогает мне снять стресс..."
1006406-42 = "Эй, если вы не против, хотите пойти на концерт со мной?"
1006406-43 = "У остальных членов «Проблемы 68» свои дела... а у меня как раз есть лишний билет."
1006406-44 = "[s7] «Да, конечно!»\n[s8] «Мне сегодня как раз не помешало бы немного развеяться.»"
1006406-45 = "Хи-хи, отлично."
1006406-46 = "Хи-хи, отлично."
1006406-47 = "Тогда идите за мной, зал совсем рядом."
1006406-50 = "После этого я последовал за Каёко и добрался до зала, где выступала вагакки-группа, но..."
1006406-51 = "Я понял, что под «снять стресс» Каёко понимает немного не то, что представлял я..."
1006406-53 = "Кивотос, погребённый во тьме — ощути жалкую смерть—"
1006406-54 = "Это разрушитель разрушения! The End, который положит конец этому миру—!"
1006406-55 = ""
1006406-57 = ""
1006406-60 = "После концерта..."
1006406-62 = "Вау, какой же весёлый был концерт..."
1006406-63 = "Особенно в конце, когда исполнительница на сямисэне зубами вцепилась в струны, а по тайко ударила головой — это было невероятно!"
1006406-64 = "[s] «Д-да...»"
1006406-65 = "Хм..."
1006406-66 = "Концерт оказался для вас слишком агрессивным, Сенсей?"
1006406-67 = "После выступления вы выглядите ещё более уставшим... Мне неловко."
1006406-68 = "[s9] «Нет, дело не в этом...»\n[s10] «Просто я так активно болел под напряжённую рок-музыку, что устал...»"
1006406-71 = "[ns] «Но стресс и правда прошёл, прямо как ты говорила, Каёко!»"
1006406-72 = ""
1006406-73 = "...Спасибо, что так говорите."
1006406-74 = "Но вы действительно выглядите вымотанным, так что лучше на сегодня закончить и вернуться в Шале отдыхать."
1006406-75 = "...Спасибо, что и сегодня провели время со мной, Сенсей."
1006406-76 = "В следующий раз, когда вы будете чувствовать себя лучше, сходим ещё на один концерт. Так точно будет веселее."
