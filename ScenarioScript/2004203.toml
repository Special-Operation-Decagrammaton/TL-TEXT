[translation]
2004203-1 = "Дополненная реальность"
2004203-2 = "На выходных я отправился на туристическую тропу возле Миллениума, о которой рассказывала Маки."
2004203-3 = ""
2004203-5 = ""
2004203-6 = ""
2004203-7 = "Уф... У-уф..."
2004203-8 = "[s1] «Привет, Маки.»\n[s2] «Что ты делаешь в телефоне?»"
2004203-11 = "А, вы уже здесь, Сенсей."
2004203-12 = "Простите, дайте мне секундочку. Я сейчас ежедневки закрываю..."
2004203-13 = "Еженедельное подземелье готово, всю выносливость потратила, награду за вход получила..."
2004203-14 = "Значит, всё!"
2004203-15 = ""
2004203-18 = "[ns3] «Я не собираюсь ворчать на тебя из-за хобби...»\n[ns4] «Но разве тебе не стоит больше смотреть на горы вокруг?»"
2004203-21 = "А, с этим у меня всё схвачено."
2004203-22 = "Эта игра — игра с дополненной реальностью, обычно её называют AR!"
2004203-23 = "Смотрите, смотрите. Видите, как игровой монстр двигается вместе с окружением, которое снимает камера? Технически я и пейзажем любовалась, И играла."
2004203-24 = "[s] «Я не это имел в виду...»"
2004203-25 = "К тому же на этой тропе связь намного лучше, чем в кемпинге, где мы были в прошлый раз."
2004203-26 = "Вообще-то я и хотела пойти в поход из-за того, что в этой игре..."
2004203-27 = ""
2004203-29 = ""
2004203-30 = ""
2004203-31 = "Погодите, у нас нет на это времени. Я слышала, что в горах солнце садится рано, особенно зимой."
2004203-32 = "Нужно торопиться, Сенсей. Мы должны успеть посмотреть на горы на закате."
2004203-33 = ""
2004203-35 = ""
2004203-40 = ""
2004203-41 = ""
2004203-42 = ""
2004203-43 = "М-м, я точно помню, что это было где-то здесь."
2004203-44 = "[s5] «Маки, смотри под ноги.»\n[s6] «Если будешь всё время смотреть в телефон, можешь споткнуться и упасть.»"
2004203-47 = "Я знаю."
2004203-48 = "...Странно. Клянусь, в гайде было сказано, что это где-то здесь."
2004203-49 = "Я ведь не перепутала координаты?"
2004203-50 = "[s] «Ты ищешь что-то конкретное?»"
2004203-51 = "Скорее дикое животное, чем вещь, но..."
2004203-52 = ""
2004203-54 = ""
2004203-55 = "А, нашла!"
2004203-56 = "Сенсей, смотрите. Золотая ласка!"
2004203-57 = "[s] «Где? Я ничего не вижу...»"
2004203-58 = "Не там, смотрите на мой телефон."
2004203-59 = "На камере видите золотую ласку, которая бегает по долине?"
2004203-60 = "Хи-хи, эта золотая ласка — монстр в AR-игре, который даёт безумные награды, и встретить её очень трудно."
2004203-61 = "Один игрок написал, что видел её возле этой тропы, вот я и решила попробовать... Не могу поверить, что действительно нашла!"
2004203-62 = "[s7] «Так ты хотела пойти сегодня в поход...»\n[s8] «…из-за своей AR-игры?»"
2004203-65 = "Да."
2004203-66 = ""
2004203-69 = "П-почему вы так на меня смотрите?!"
2004203-70 = "Чихиро сказала, что AR-игры совершенно нормальны!"
2004203-71 = "Чтобы играть в AR-игры, приходится ходить на улице, так что она сказала, что я хотя бы двигаюсь... Технически это намного полезнее для меня, чем остальные игры, в которые мы играем!"
2004203-72 = "[s9] «Я не собираюсь ругать тебя за игры, но...»\n[s10] «Разве не жалко приехать так далеко и всё время смотреть в телефон?»"
2004203-75 = "Уф, ворчите прямо как взрослый... Хотя погодите, вы же и есть взрослый!"
2004203-76 = ""
2004203-78 = ""
2004203-79 = ""
2004203-80 = "...Ладно, ладно. Наверное, и правда невежливо всё время сидеть в телефоне, пока мы вместе. Да и я не хочу, чтобы вы скучали."
2004203-81 = "Тогда что будем делать?"
2004203-82 = "А, придумала! Сенсей, давайте устроим соревнование. Кто первым доберётся до той долины, тот победил!"
2004203-83 = "Хи-хи, а проигравший потом покупает победителю напиток!"
2004203-84 = ""
2004203-86 = ""
2004203-87 = "[ns] «М-Маки. Подожди...!»"
2004203-92 = "Хи-хи, я первая!"
2004203-93 = ""
2004203-95 = ""
2004203-96 = "Что случилось, Сенсей? Вы постоянно ворчите, чтобы мы больше двигались, а сами, похоже, куда хуже меня в форме!"
2004203-97 = "[s11] «В последнее время я веду слишком сидячий образ жизни...»\n[s12] «Я недооценил выносливость молодёжи.»"
2004203-100 = ""
2004203-102 = ""
2004203-103 = ""
2004203-104 = "В общем, эта долина какая-то скучная."
2004203-105 = "Несколько скульптур и ярких цветов здорово бы её оживили."
2004203-106 = "[s13] «Говорят, это место известно своими осенними листьями.»\n[s14] «После окончания осени здесь и правда немного пустовато.»"
2004203-109 = "Ага..."
2004203-110 = ""
2004203-112 = ""
2004203-113 = ""
2004203-114 = "А, у меня появилась хорошая идея!"
2004203-115 = "Сенсей. Подождите минутку!"
2004203-116 = ""
2004203-118 = ""
2004203-119 = ""
2004203-120 = "А теперь, Сенсей, попробуйте посмотреть вокруг через камеру моего телефона."
2004203-121 = "[ns] «Посмотрим...»"
2004203-122 = ""
2004203-126 = ""
2004203-128 = "[ns15] «...Вся долина заполнена разноцветными осенними листьями!»\n[ns16] «Как ты добавила все эти листья?»"
2004203-131 = "Я же говорила раньше. Это дополненная реальность!"
2004203-132 = "В этой AR-игре есть функция, которая использует систему, чтобы отображать не только монстров, но и любые нужные рисунки."
2004203-133 = "Я решила воспользоваться ею и нарисовала по всей долине яркие осенние листья."
2004203-134 = "Ну как? Смотреть на мир через дополненную реальность не так уж плохо, правда?"
2004203-135 = "[s17] «Пожалуй, тут и правда не поспоришь...»\n[s18] «Оказывается, иногда через экран мир выглядит ярче.»"
2004203-138 = "Конечно. Дайте мне ручку и немного вдохновения — и я раскрашу мир бесконечной живостью и радостью!"
2004203-139 = "Раз уж ручка у меня с собой, может, добавить вокруг ещё больше цветов!"
2004203-140 = "Сенсей, хотите что-нибудь добавить к нашему окружению? Скажите — я нарисую!"
2004203-141 = "[s] «Хорошо, может, попрошу кое о чём.»"
2004203-142 = ""
2004203-144 = ""
2004203-146 = "После этого я с удовольствием любовался пейзажами, которые Маки рисовала для меня на экране телефона."
