[translation]
1003303-1 = "Свидание вдвоём"
1003303-2 = "Сегодня у меня первый за долгое время выходной от работы в Шале."
1003303-3 = "[s1] «Мне это было нужно...»\n[s2] «Теперь у меня есть время на то, что я откладывал из-за работы.»"
1003303-4 = ""
1003303-5 = ""
1003303-11 = "Для начала я отправился в торговый центр неподалёку от Шале."
1003303-12 = "[s] «Похоже, у них какая-то распродажа.»"
1003303-13 = "Здравствуйте! Спасибо, что сегодня выбрали наш магазин!"
1003303-14 = "В честь 15-летия нашего магазина мы предлагаем специальную скидку на нашу лучшую премиальную говядину вагю!"
1003303-15 = "В наличии всего 100 упаковок, продажа идёт в порядке живой очереди.#nНе упустите эту возможность!"
1003303-16 = "Распродажа начинается ПРЯМО СЕЙЧАС!"
1003303-17 = ""
1003303-21 = "Я пробился сквозь толпу и, к счастью, сумел занять место в очереди."
1003303-22 = "Следующий! Вот, держите. Спасибо за покупку... Следующий!"
1003303-26 = "После долгого ожидания наконец подошла моя очередь."
1003303-27 = "Вот, держите. Наша последняя упаковка!"
1003303-28 = ""
1003303-32 = ""
1003303-33 = "Хмф."
1003303-34 = "Я забираю её!"
1003303-35 = "Ой! Н-Но, сэр...!"
1003303-36 = "[s] «Погодите! Нельзя просто влезать без очереди!»"
1003303-37 = "«Влезать», говоришь?"
1003303-38 = "Нет. Я лишь обошёл тебя, потому что ты слишком долго возился."
1003303-39 = "И что с того, что изначально я стоял позади тебя? Кто первый пришёл — того и товар.#nТы же слышал управляющего."
1003303-40 = "В любви, на войне и за говядину все средства хороши."
1003303-41 = "[s] «Вы вообще слышите, что говорите?»"
1003303-43 = "Мне не нужны твои замечания! Говядина у меня, и это всё, что имеет значение!"
1003303-44 = "Не бойся. Этой говядине гораздо лучше у меня — я приготовлю её как следует! Ахахаха!"
1003303-45 = "А теперь, с вашего позволения."
1003303-46 = ""
1003303-48 = ""
1003303-51 = "О нет!"
1003303-52 = ""
1003303-54 = ""
1003303-55 = "В-Вы в порядке?"
1003303-56 = ""
1003303-59 = "[s] «Какого...?!»"
1003303-60 = "Вы меня слышите?! Сэр...!"
1003303-61 = "Кто-нибудь, вызовите врача! Он совсем без сознания!"
1003303-62 = "Нам срочно нужен врач!"
1003303-66 = "Фух. Теперь он должен быть в надёжных руках."
1003303-67 = "Жаль будет, если последняя упаковка пропадёт зря.#nВы всё ещё хотите её купить?"
1003303-68 = "[s] «Конечно... Только надеюсь, с тем парнем всё будет нормально.»"
1003303-69 = ""
1003303-71 = ""
1003303-73 = ""
1003303-76 = "По причинам, которых я до конца так и не понял, мне удалось успешно купить вагю, после чего я отправился обедать в популярную закусочную."
1003303-80 = "[ns] «Как там называлось блюдо, о котором все говорили в соцсетях?»"
1003303-81 = "Еда здесь и правда такая вкусная, как я слышала!"
1003303-82 = "Ещё одну! Мне ещё порцию!"
1003303-83 = "А я намешаю джангл-джус у автомата с напитками!"
1003303-84 = ""
1003303-87 = "Те трое там такие шумные."
1003303-88 = "Тс-с! Тише, а то они тебя услышат."
1003303-89 = "Отстой. Я тащился сюда издалека, потому что слышал об этом месте,#nа теперь даже спокойно поесть не могу."
1003303-90 = "Ха-ха-ха-ха!"
1003303-91 = "Хи-хи-хи!"
1003303-92 = "Ахахахаха!"
1003303-93 = ""
1003303-97 = "П-Простите, девушки. Мы получили жалобы от других посетителей.#nНе могли бы вы говорить хоть немного потише?"
1003303-99 = ""
1003303-100 = "Чего-о-о? Думаешь, мы слишком шумные?"
1003303-101 = "А давай мы засунем тебе динамики туда, куда солнце не светит,#nведро с болтами."
1003303-102 = "Вот тогда и посмотрим, кто будет ГРОМЧЕ орать от боли!"
1003303-104 = "*ах* П-Пожалуйста! Только не..."
1003303-105 = "[s] «Эй. Вы устраиваете сцену.»"
1003303-107 = ""
1003303-108 = "А?!"
1003303-109 = "Разве это не...?"
1003303-110 = "Сенсей из Шале!"
1003303-111 = "Ты был там, когда нас в прошлый раз разнесло взрывом!#nНе думай, что мы об этом забыли!"
1003303-112 = "Что скажете, девочки? Сейчас самое время отомст—"
1003303-113 = ""
1003303-115 = ""
1003303-116 = ""
1003303-117 = ""
1003303-118 = ""
1003303-119 = ""
1003303-120 = ""
1003303-125 = "О боже мой! Вы трое в порядке?!"
1003303-126 = ""
1003303-129 = "Э-Это были выстрелы..."
1003303-130 = "Откуда они пришли?"
1003303-131 = "[s] «Опять?»"
1003303-132 = ""
1003303-134 = ""
1003303-136 = ""
1003303-137 = ""
1003303-140 = "Последнее, что мне оставалось сделать в выходной, — купить кое-какие необходимые вещи в магазине у дома."
1003303-141 = "[s3] «Ну и денёк...»\n[s4] «Это ненадолго. Что вообще может пойти не так?»"
1003303-142 = ""
1003303-143 = ""
1003303-146 = "[ns] «Да ладно!»"
1003303-147 = "Ч-что происходит?!"
1003303-148 = "Хахаха! Это ограбление!"
1003303-149 = "Выгребай всё из кассы, живо!"
1003303-150 = ""
1003303-153 = ""
1003303-154 = ""
1003303-155 = ""
1003303-156 = "[ns] «П-Погодите!»"
1003303-164 = "А-а-а-а-а!"
1003303-165 = "М-Меня подстрелили!"
1003303-166 = ""
1003303-168 = ""
1003303-170 = "[ns] «*вздох*»"
1003303-173 = "Мой напряжённый выходной наконец подошёл к концу."
1003303-175 = "А на следующий день..."
1003303-176 = "[s] «Вчера был тот ещё денёк.»"
1003303-177 = ""
1003303-180 = "[ns] «Кто там?»"
1003303-183 = ""
1003303-184 = "Хи-хи. Это я, Сенсей. Вакамо. Я просто не смогла держаться от вас подальше."
1003303-185 = "Вчера я так чудесно провела с вами время, даже несмотря на то, что мы почти не поговорили."
1003303-186 = "Вспоминая об этом, я не смогла сопротивляться желанию снова вас увидеть.#nХотя я знаю, что сегодня у вас уже не выходной."
1003303-187 = "И всё же я не смогла держаться от вас подальше! ♥"
1003303-188 = "[s] «Я...сно. Погоди, ты сказала „вчера“?»"
1003303-189 = "Хм? Да, сказала."
1003303-190 = "Разве ты не помнишь?"
1003303-191 = "У меня до сих пор бабочки в животе, когда я вспоминаю, сколько времени мы вчера провели вместе!"
1003303-192 = "[s] «Стоп. Вот здесь. Объясни, что именно ты имеешь в виду.»"
1003303-193 = "Вот как."
1003303-194 = "С радостью. Для вас — что угодно, Сенсей."
1003303-195 = "Вчера у нас был весьма насыщенный день, но всё же было чудесно сходить на наше первое свидание в ваш заслуженный выходной."
1003303-196 = "[s] «С-Свидание? Какое ещё свидание?!»"
1003303-197 = "Сначала мы столкнулись с тем бестолковым идиотом, который нам завидовал."
1003303-198 = "Но я рада, что в итоге вы всё-таки смогли купить заслуженную говядину вагю."
1003303-199 = "Как нам приготовить её сегодня?"
1003303-200 = "Я приготовлю её так, как вы захотите. Я уже представляю, как мы ужинаем вместе и обсуждаем наши любимые блюда и вкусы..."
1003303-201 = "Даже от одной мысли об этом я чувствую себя ближе к вам, мой дорогой.#nЯ так счастлива."
1003303-202 = "[s] «...?»"
1003303-203 = "Однако..."
1003303-204 = "...но наше счастье продлилось недолго. В ресторане, куда мы зашли пообедать, нам снова кто-то помешал."
1003303-205 = "Эти шумные насекомые не могли не жужжать во весь голос рядом с теми, кто просто хотел спокойно провести день. Какая невоспитанность."
1003303-206 = "Мне больше всего хотелось оторвать им крылья одно за другим прямо на месте, чтобы они больше никогда не издали ни звука..."
1003303-207 = "...но я не смогла. Я не могла позволить себе испортить наше драгоценное время, поэтому ограничилась предупреждением."
1003303-208 = "А потом мы столкнулись с теми дураками в магазине, которые разыгрывали из себя крутых грабителей."
1003303-209 = "День выдался насыщенным, но то же самое я могу сказать о любом дне, который провожу рядом с вами."
1003303-210 = "И я не хотела бы, чтобы было иначе, мой дорогой! ♥"
1003303-211 = ""
1003303-214 = "[ns] «Так ты вчера повсюду за мной следила?»"
1003303-215 = "Следила?"
1003303-216 = "Я бы никогда не стала делать ничего подобного. Я просто шла совсем рядом позади, позволяя вам вести меня."
1003303-217 = "Я не хотела ничем мешать нашему свиданию."
1003303-218 = "Ох, но вам не о чем беспокоиться."
1003303-219 = "В следующий раз, когда мы пойдём куда-нибудь вместе, я буду осторожнее..."
1003303-220 = "...и заранее устраню все возможные препятствия на нашем пути, прежде чем они успеют вмешаться."
1003303-221 = "Тогда нашему второму свиданию ничто не помешает!"
1003303-222 = "[s] «Прекрати, Вакамо!»"
1003303-223 = "Дорогой...?"
1003303-224 = "[s] «В следующий раз тебе не нужно этого делать!»"
1003303-225 = ""
1003303-227 = ""
1003303-228 = ""
1003303-230 = ""
1003303-231 = "Ох. В следующий раз?"
1003303-232 = "[s5] «На нашем свидании мы весь день будем держаться за руки!»\n[s6] «(Ради безопасности остальных я не могу спускать с неё глаз!)»"
1003303-233 = ""
1003303-234 = ""
1003303-236 = ""
1003303-237 = "О-Ох, Сенсей. Вы такой прямолинейный!"
1003303-238 = "Но хорошо. Если вы этого хотите."
1003303-239 = "Н-Не могу дождаться. Буду с нетерпением ждать."
1003303-240 = "Д-До свидания, мой дорогой."
1003303-241 = ""
1003303-243 = ""
1003303-245 = "Я спокойно проводил Вакамо, а она, всё ещё смущённая, убежала прочь со всех ног."
