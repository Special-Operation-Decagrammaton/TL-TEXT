[translation]
83300100200-5 = ""
83300100200-6 = "Спасибо за вашу усердную работу на тренировке в холодную погоду, глава префектов."
83300100200-7 = "Без твоей усердной работы ничего бы не получилось. Спасибо, Ако."
83300100200-8 = "Мы провели вдвое больше тренировок, чем в прошлом году, после того как Общество Пандемониума вломилось со своими требованиями."
83300100200-9 = "Но благодаря стараниям всех участников нам удалось благополучно уладить дело."
83300100200-10 = "И правда. После такого даже Обществу Пандемониума придётся на время притихнуть."
83300100200-11 = ""
83300100200-15 = ""
83300100200-17 = "...Хм? Снаружи какой-то шум."
83300100200-18 = "Вы правы... Что-то происходит?"
83300100200-19 = "Я надеялась немного отдохнуть, ведь мы только вернулись, но..."
83300100200-20 = "Ако, я выясню, в чём дело. Скоро вернусь."
83300100200-21 = ""
83300100200-23 = ""
83300100200-26 = "А, да...! Тогда я тоже разузнаю, что происходит!"
