[translation]
2001802-1 = "Сопутствующий ущерб"
2001802-2 = "Теперь понятно. Я не мог отследить его, потому что вор смылся на Чёрный рынок с устройством радиоэлектронного подавления."
2001802-3 = "Сам район — словно лабиринт из переулков, а некоторые места плохо видны даже на камерах. Глушилка там действительно эффективна."
2001802-4 = "Не проблема! Запущу тепловизионный дрон SRT с системой противодействия помехам ECCM. Вы обратились к правильному человеку. Хи-хи-хи."
2001802-5 = "Но вы правда всё хорошо обдумали, Сенсей?"
2001802-6 = "[s1] «Не совсем понимаю, о чём ты...»\n[s2] «Есть проблема с операцией?»"
2001802-7 = "Нет, операция идеальна. На этом этапе я могу найти подозреваемого одним нажатием кнопки."
2001802-8 = "Нет, операция идеальна. На этом этапе я могу найти подозреваемого одним нажатием кнопки."
2001802-9 = "Но после столь долгого перерыва мне разрешили использовать целую кучу взрывчатки и оружия...! У меня что, слюни текут?"
2001802-10 = "[s] «Уточню: я разрешил использовать ровно столько, сколько необходимо.»"
2001802-11 = "Ох, Сенсей. Вечно пыхтите из-за мелочей."
2001802-12 = "Начинаем шоу. Господин Преступник, познакомьтесь с тепловым дроном~"
2001802-15 = ""
2001802-16 = "*тяжело дышит* *тяжело дышит* ...Я наконец от них оторвался?"
2001802-17 = "Похоже, эта глушилка всё-таки стоила своих денег."
2001802-18 = "Даже дроны не могут меня засечь с этой штукой! Я могу красть всё что захочу!"
2001802-19 = "Я могу продолжать вечно!"
2001802-20 = ""
2001802-23 = "К-Как эти дроны меня нашли?!"
2001802-24 = "Почему эта дурацкая штука не работает?"
2001802-25 = ""
2001802-27 = ""
2001802-28 = "Ай! Больно! Ух! Отстаньте от меня!"
2001802-29 = ""
2001802-31 = ""
2001802-32 = "Хи-хи-хи! Если только ты не умеешь рыть туннели под землёй, моему дрону от тебя не скрыться! Что такое? Ты крот, господин Преступник?"
2001802-33 = "О, подождите! Я сто лет не была в поле! Только не попадайся слишком быстро, ладно? Беги, беги, беги изо всех сил!"
2001802-34 = "[s3] «Эй... Моэ? Может, немного сбавим обороты.»\n[s4] «Кажется, ты ведёшь себя немного... жестоко.»"
2001802-35 = "Тс-с, Сенсей. Я отношусь к этой операции очень серьёзно, обещаю."
2001802-36 = "Тс-с, Сенсей. Я отношусь к этой операции очень серьёзно, обещаю."
2001802-37 = "По крайней мере, пока. Хи-хи."
2001802-38 = "[s] «Пока...?!»"
2001802-39 = "А! Я снова засекла его — движется на север."
2001802-40 = "Отложим мысль, Сенсей! Время града пуль!"
2001802-43 = ""
2001802-45 = ""
2001802-46 = ""
2001802-47 = "Ай! Ай! БОЛЬНО! Хватит! Хватит!"
2001802-48 = "Ух! Всё, хватит! Я сдаюсь!"
2001802-49 = "Уже...? И... это всё?"
2001802-50 = "Да, всё! А чего ты ожидала?! Мне негде спрятаться ни от твоих дронов, ни от пуль!"
2001802-51 = "Я всё верну, только перестань в меня стрелять!"
2001802-52 = "[s5] «Хорошая работа, Моэ. Дело сделано.»\n[s6] «Можешь отозвать дроны, Моэ.»"
2001802-53 = "..."
2001802-54 = "..."
2001802-56 = "...Но я ещё ни одной ракеты не выпустила."
2001802-57 = "[s] «Считай это хорошей новостью.»"
2001802-59 = "[ns7] «Здесь слишком много горючих материалов.»\n[ns8] «Если ты применишь ракеты в таком месте, у нас будут проблемы.»"
2001802-60 = "Наверное, если я спалю весь район, нас действительно будут ругать..."
2001802-61 = "У нас будут проблемы? Если я всё разнесу к чёрту?"
2001802-62 = "То есть вы хотите сказать, что нажатие этой кнопки запуска приведёт к ужасным и необратимым последствиям?"
2001802-63 = "Разумеется, большая сила означает большую ответственность..."
2001802-64 = "А большая ответственность означает огромное, огромное удовольствие..."
2001802-65 = "*тяжело дышит* *тяжело дышит*"
2001802-66 = "[s] «М-Моэ...? Ты там вообще в порядке?»"
2001802-67 = "Я вся на нервах! Больше не могу сдерживаться!"
2001802-68 = ""
2001802-70 = ""
2001802-71 = "П-Подождите... Дрон светится каким-то странным цветом..."
2001802-72 = "О-Она сейчас запустит в меня ракету?! Она сумасшедшая?"
2001802-73 = "Она разнесёт весь город, если запустит её здесь!"
2001802-74 = "Весь город, говоришь?"
2001802-75 = "Это словно горячечный сон! *тяжело дышит* *тяжело дышит*"
2001802-76 = ""
2001802-78 = ""
2001802-79 = "Стойте! Пожалуйста! Я уже сдался!"
2001802-80 = "Нееееееет!"
2001802-81 = ""
2001802-84 = "После этого мелкого воришку обезвредили и передали полиции. Но из-за одной помешанной на взрывах сотрудницы пришлось очень долго всё убирать."
2001802-86 = "..."
2001802-87 = "...Почему вы так на меня смотрите?"
2001802-88 = "[s] «Зачем ты запустила ракету? Всё уже закончилось.»"
2001802-89 = "Хм... Потому что..."
2001802-90 = "О! Знаю! Кнопка была прямо передо мной!"
2001802-91 = "[s] «Это даже не оправдание.»"
2001802-92 = "Потому что у меня его и нет! Понятно, что разумный и нормальный человек не нажал бы кнопку."
2001802-93 = "Но когда я вижу перед собой большую красную кнопку, которую категорически нельзя нажимать, я схожу с ума!"
2001802-94 = "Лобная доля отключается, и наружу вырывается моё «Оно»! *тяжело дышит* *тяжело дышит*"
2001802-95 = "[s] «Я очень стараюсь тебя понять, Моэ.»"
2001802-96 = "Сенсей. Вы когда-нибудь видели, как расставляют домино?"
2001802-97 = "В домино прямоугольные костяшки очень легко падают, потому что стоят близко друг к другу. Поэтому их расстановка требует огромного терпения."
2001802-98 = "Сбил одну — и попрощайся со всей работой. Бу-ху, как печально."
2001802-99 = "Но когда видите эти хрупко стоящие костяшки, которые кто-то мучительно выстраивал одну за другой, разве вам не хочется их опрокинуть?"
2001802-100 = "Когда одним прикосновением рушится чья-то долгая и тяжёлая работа... это неописуемый, щекочущий нервы катарсис... *тяжело дышит* *тяжело дышит*"
2001802-101 = "[s] «Не могу сказать, что разделяю это чувство, но, кажется, понимаю.»"
2001802-102 = "Отлично! Тогда поймите и это. Единственное, чего я хочу от жизни, — испытывать удовольствие, которое получаешь, руша такое домино!"
2001802-103 = "Как оператор и специалист по связи нашей команды, я постоянно пользуюсь кучей кнопок."
2001802-104 = "И есть много кнопок, которых нельзя касаться без экстренной необходимости."
2001802-105 = "В свободное время я просто представляю, что будет, если их нажать."
2001802-106 = "Какую мощь я высвобожу... одним нажатием?"
2001802-107 = "Эта мысль захватывает меня! Руки начинают двигаться сами...!"
2001802-108 = "Стоит лишь нажать — и всё вокруг будет уничтожено! Здания, мосты — всё превратится в руины одним моим касанием!"
2001802-109 = "От одной мысли я чувствую... Я... Я...!"
2001802-110 = "*тяжело дышит* *тяжело дышит*"
2001802-111 = "[s] «У-Успокойся. Теперь я понял.»"
2001802-113 = "[ns9] «Ну, спасибо за помощь сегодня.»\n[ns10] «Хочешь что-нибудь из автомата с собой?»"
2001802-114 = "Всегда пожалуйста. А можно сначала что-нибудь взять из автомата?"
2001802-115 = "О, спасибо. Сегодня было довольно жарко, я хочу пить."
2001802-116 = "Мне бы прохладный спортивный напиток..."
2001802-117 = "О, что это за банка? Никогда раньше не видела..."
2001802-118 = "...«Ультравзрывной суп из красной фасоли»?"
2001802-119 = "[s11] «Это тёплая банка супа из красной фасоли.»\n[s12] «Сегодня слишком жарко для супа.»"
2001802-120 = "...Если я съем горячий фасолевый суп, могу начать сильно потеть и обезвожусь."
2001802-121 = "...Если я съем горячий фасолевый суп, могу начать сильно потеть и обезвожусь."
2001802-122 = "Выбрать фасолевый суп, когда есть столько других вариантов, было бы саморазрушительным решением."
2001802-123 = ""
2001802-125 = ""
2001802-126 = "...Но кнопка фасолевого супа — единственная, которая ведёт к разрушению."
2001802-127 = "Если я подниму палец и нажму эту кнопку, пути назад уже не будет... *тяжело дышит* *тяжело дышит*"
2001802-128 = "[s] «Подожди, Моэ. Стой!»"
2001802-129 = ""
2001802-131 = ""
2001802-132 = ""
2001802-133 = "*тяжело дышит* *тяжело дышит* ...Я и правда это сделала..."
2001802-134 = "Это тёплое и тяжёлое ощущение... Что будет, если съесть такое в жаркий день? Хи-хи-хи."
2001802-135 = "[s] «Я куплю тебе что-нибудь другое. Не заставляй себя.»"
2001802-136 = "Нет, тогда весь смысл пропадёт."
2001802-137 = "Я сама выбрала этот путь. Если не возьму ответственность, всё будет бессмысленно!"
2001802-138 = "До дна, Сенсей!"
2001802-139 = ""
2001802-141 = ""
2001802-142 = "...Ого! Горячо!"
2001802-143 = "Густой суп из красной фасоли стекает по горлу и жаром возбуждает всё тело..."
2001802-144 = "Теперь мне достаточно просто держать банку у рта, чтобы вспотеть..."
2001802-145 = "[s] «Ты точно в порядке...?»"
2001802-146 = "Я-я в порядке... Я..."
2001802-147 = "Я чувствую, что живу!"
2001802-148 = "До сих пор я разрушала только то, что вокруг меня. А такое саморазрушительное поведение..."
2001802-149 = "...это так бодрит!"
2001802-151 = "Несмотря на мои многочисленные протесты, Моэ продолжила жадно допивать фасолевый суп, всё сильнее краснея."
