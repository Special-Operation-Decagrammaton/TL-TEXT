[translation]
102170-1 = "Эпизод 17; Пятое святилище — Окраина города Эрид"
102170-2 = "Ну что, готова?"
102170-3 = "Да, мэм."
102170-4 = "П-Подождите, стоп!"
102170-5 = "Что-то не так, Коюки?"
102170-6 = "Вы ждёте, что я просто улыбнусь и скажу: «Да, Юука!» — в такой ситуации?!"
102170-7 = "Что вообще происходит? Что я здесь делаю?! Прежде чем спрашивать, готов ли кто-то что-то делать, неплохо бы сначала получить его согласие!"
102170-8 = "Хм? Я думала, мы всё объяснили, Коюки. Мы идём побеждать хранителя."
102170-9 = "Н-Но я об этом и говорю! Я уже отключила дурацкую систему безопасности президента Рио."
102170-10 = "Да-да. Хорошая девочка, Коюки. Ты отлично справилась."
102170-11 = "Честно говоря, твой талант настолько поражает воображение, что его стоило бы изучать как научное чудо."
102170-12 = "Отлично! Значит, я сделала всё, что вы просили! Можно теперь вернуть меня в Комнату саморефлексии? Я должна, типа, смотреть в стену и размышлять о своих проступках, да?!"
102170-13 = "Нет. Чтобы зачистить пятое святилище, нам нужно выманить Hod на поверхность."
102170-14 = "Вот именно это я и пытаюсь сказать!!! Что значит «НАМ»?! Возьмите кого-нибудь другого, пожалуйста!"
102170-15 = "Президент Рио установила барьеры по всему Городу-крепости. Нам придётся разбирать барьеры на пути, одновременно выманивая Hod..."
102170-16 = "И только ты во всём мире способна это сделать, Коюки."
102170-17 = "Никакого «кого-нибудь другого» нет. Мы теряем драгоценное время из-за твоих жалоб."
102170-18 = "Вперёд!"
102170-19 = "ААААААА!!!"
102170-20 = ""
102170-29 = "Вот здесь, забейте кол!"
102170-30 = "Хорошо!"
102170-35 = "Подрыв завершён! Ха-ха-ха-ха! Шоссе рушится!"
102170-36 = "О, прекрасно. Теперь действительно чувствуется, что здесь идёт настоящая разработка."
102170-37 = "Президент Касуми, думаю, здесь мы почти закончили! Переходим к следующему участку!"
102170-38 = "Хорошо! Снесите все здания до последнего!"
102170-39 = "Принято! Сносим здания! Сжигаем всё!"
102170-41 = "Разработка! Разработка!"
102170-42 = ""
102170-47 = "Ва-ха-ха! Да! Пока мы не найдём горячие источники под Миллениум, будем взрывать, сносить и перекапывать этот город сколько душе угодно!"
102170-50 = "Город... Здания..."
102170-52 = "Простите, но я должна спросить... Вы ведь не пришли уничтожить район Миллениум под видом сноса Башни эрозии, правда...?"
102170-55 = "Хи-хи-хи! Уничтожить Миллениум? О чём ты? Всё это ради горячих источников! А заодно можно снести и святилище! Двух зайцев одним выстрелом! Разработка — это эффективность!"
102170-58 = "..."
102170-59 = ""
102170-63 = "Горячие источники...? В нашем районе их совершенно точно нет... Вы могли бы понять это, немного проанализировав слои грунта..."
102170-65 = "Анализ? Смотреть на слои грунта? Эх вы, учёные! С таким подходом вам никогда не разработать горячий источник! Его надо чувствовать! Чуять!"
102170-66 = "Нужно верить, что горячие источники существуют! Тогда они ответят вам! Ва-ха-ха!"
102170-69 = "..."
102170-71 = "..."
