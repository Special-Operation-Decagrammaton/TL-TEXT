[translation]
10045050-1 = "Эпизод 5;На грани выбывания"
10045050-4 = "[ns] «...кё!»"
10045050-6 = "[ns] «Кикё!»"
10045050-7 = ""
10045050-8 = ""
10045050-9 = "*кашель* *кашель* *кашель*"
10045050-10 = ""
10045050-12 = ""
10045050-13 = "Кикё!"
10045050-14 = ""
10045050-16 = ""
10045050-18 = "Сенсей...?"
10045050-19 = "[s1] «Слава богу, ты очнулась.»\n[s2] «Хорошо, что вода была не слишком глубокой.»"
10045050-22 = "*кашляет* *кашляет*"
10045050-23 = "Ч-Что... случилось? Что с матчем? После того как я упала в море... память туманная."
10045050-24 = "Матч уже закончился. Чисэ и Изуна стали победительницами."
10045050-25 = "Хяккарёран... выбыли."
10045050-26 = "...!!"
10045050-27 = "...Неужели вы пожертвовали матчем, чтобы спасти меня?"
10045050-28 = "Пффф! Ты вообще о чём? Конечно."
10045050-29 = "Значит, вина лежит на мне..."
10045050-30 = "Если бы я только призналась, что смертельно боюсь воды... Мы могли избежать такого конца."
10045050-32 = "Я думала, ты просто не любишь воду, Кикё!"
10045050-33 = "...Я не люблю находиться под солнцем, поэтому крайне редко бывала рядом с водоёмами."
10045050-34 = "Я не умею плавать. Я не могу заходить в воду выше пояса."
10045050-35 = "Но я оперативный офицер Хяккарёран. Как я могла навлечь такой позор на свою должность? На сами Хяккарёран?"
10045050-36 = "Простите. Каждую из вас. Сегодня моя гордость привела к настоящей глупости."
10045050-37 = "Тебе не за что извиняться. Я тоже немного виновата."
10045050-38 = "Я знаю тебя с детства и вообще ничего не заметила..."
10045050-39 = "Прости, что так тебя игнорировала."
10045050-40 = "Кажется, Я сказала, что прошу прощения."
10045050-41 = "Ну а я не принимаю! Потому что виновата Я!"
10045050-42 = "Нет, я!"
10045050-43 = "Нет, я!"
10045050-45 = "Фуфу. Ваша близость очень согревает сердце."
10045050-46 = "Кикё, пожалуйста, не вини себя так сильно. Мы не держим на тебя зла."
10045050-47 = "Я чувствую лишь огромное облегчение от того, что ты по-настоящему не пострадала."
10045050-48 = "...Вы не злитесь?"
10045050-50 = "Напомни, какова была цель нашей операции? Социализация, разве нет?#nДумаю, с этим мы справились более чем."
10045050-51 = "Именно! Значит, как наш оперативный офицер ты идеально выполнила свою работу!"
10045050-52 = "Но..."
10045050-53 = ""
10045050-54 = "[ns] «Не переживай так! У тебя всё ещё есть шанс.»"
10045050-55 = "Шанс? Какой шанс?"
10045050-56 = "[s3] «Без спойлеров!»\n[s4] «Увидимся на площадке для пляжного волейбола!»"
10045050-59 = "...Хм?"
10045050-62 = "Финиш этого жаркого Водного фестиваля Хяккияко уже близок!"
10045050-63 = "Но нам очень грустно с ним прощаться. Разве зрители не чувствуют то же самое?"
10045050-64 = ""
10045050-67 = "Я так и знала! Поэтому, по многочисленным просьбам, у нас для вас особый сюрприз!"
10045050-68 = "Барабанная дробь! Мы проведём... матч на возвращение!"
10045050-69 = "Восемь игроков, выбывших на полосе препятствий, сыграют в пляжный волейбол — по 2 игрока в команде!"
10045050-70 = "Победившая команда тоже получит шанс в финальном раунде! Сетка проигравших!"
10045050-71 = "Так что не унывайте, все! И удачи!"
10045050-72 = "[ns] «А теперь объявлю совершенно случайные пары!»"
10045050-74 = "[log]Матч по пляжному волейболу 1![/log]"
10045050-76 = ""
10045050-77 = "ПРОТИВ"
10045050-79 = ""
10045050-81 = "Я и Кикё? Отличная разминка."
10045050-82 = "..."
10045050-84 = "УГХХХ. Вы серьёзно?!"
10045050-85 = "Хватит плакать! Мы ещё не выбыли!"
10045050-86 = ""
10045050-87 = "[ns] «Следующий матч!»"
10045050-89 = "[log]Матч по пляжному волейболу 2![/log]"
10045050-91 = ""
10045050-92 = "ПРОТИВ"
10045050-94 = ""
10045050-96 = "Какое совпадение. Ты станешь моей боевой сестрой, Нагуса!"
10045050-97 = "С тобой рядом я не представляю, как можно проиграть!"
10045050-98 = "Да. Сделаем всё, что можем."
10045050-100 = "Ч-Что нам делать? Это совсем нечестно!"
10045050-101 = "Фуфу. Ты ничуть не хуже их. Тебе нужна лишь уверенность, чтобы выступить против них."
10045050-102 = "Приготовьтесь стать моими тренировочными мишенями."
10045050-104 = "Ого, какие горячие пары!"
10045050-105 = "Сейчас небольшой перерыв, но не теряйте азарт перед первым матчем!"
10045050-106 = "[ns] «Оставайтесь с нами...!»"
10045050-108 = "(...Каким бы ни был исход, в финал могут пройти лишь двое.)"
10045050-109 = "(Если я снова стану причиной поражения Рэнгэ...)"
10045050-110 = "(...)"
10045050-111 = "(Я должна выступить хорошо.)"
10045050-112 = "(По крайней мере мы останемся на твёрдой земле. Это я могу.)"
10045050-113 = "(Да и в любом случае первые противники не представляют серьёзной угрозы. Рэнгэ могла бы победить их одна.)"
10045050-114 = "(Так почему...)"
10045050-115 = "(...я чувствую, как внутри растёт тревога?)"
