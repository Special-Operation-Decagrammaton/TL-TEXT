[translation]
1003905-1 = "RABBIT 4, Огонь"
1003905-2 = "С-Сенсей. Здравствуйте."
1003905-3 = "Простите, что заставила вас так далеко ехать."
1003905-4 = "[s] «Я только рад помочь.»"
1003905-5 = "С-Спасибо. Мне нужно потренироваться в стрельбе для городских операций SRT..."
1003905-6 = "Я собиралась пойти в центр Кивотоса и попросить кого-нибудь помочь с тренировкой..."
1003905-7 = "Н-Но мне было страшно обращаться к незнакомцам..."
1003905-8 = "[s1] «Всё нормально, ты поступила правильно.»\n[s2] «Стрелять из оружия в центре города опасно.»"
1003905-9 = "Угу. Поэтому я х-хочу найти другое место."
1003905-10 = "Угу. Поэтому я х-хочу найти другое место."
1003905-11 = "Я у-увидела этот заброшенный дом у тропы."
1003905-12 = "Я наблюдала всю неделю. Им никто не пользуется."
1003905-13 = "П-Поэтому я хочу тренироваться здесь."
1003905-14 = "[s] «Чем я могу помочь?»"
1003905-15 = "Я-я почти всё могу сделать сама..."
1003905-16 = "Можете п-просто установить бумажную мишень на гребне?"
1003905-17 = "[s] «Трёхсот метров хватит?»"
1003905-18 = "Н-Не совсем."
1003905-19 = "[s] «Пятьсот метров?»"
1003905-20 = "Всё ещё нет..."
1003905-21 = "П-Простите. Наверное, километр?"
1003905-22 = "[s] «Деревья закроют линию огня. Ты уверена?»"
1003905-23 = "Я всё-таки снайпер SRT, знаете ли."
1003905-24 = "Я должна уметь хотя бы это, чтобы не отставать."
1003905-25 = "С-Спасибо, Сенсей."
1003905-26 = ""
1003905-28 = "[ns] Установить бумажную мишень."
1003905-30 = "Установив бумажную мишень, я вернулся на огневую позицию к Мию."
1003905-31 = "*тяжело дышит* *тяжело дышит*"
1003905-32 = "...А Мию совершенно не замечала, что её окружили дикие животные."
1003905-35 = "― Фух... Вдохни...[wa:140]"
1003905-37 = "― Сосредоточься на цели...[wa:510]"
1003905-40 = "― Дистанция 1150 метров... ветер с северо-востока, пятнадцать узлов.[wa:1960]"
1003905-42 = "― Если учесть погрешность из-за температуры и влажности...[wa:10]"
1003905-45 = "― Э-Эм... Сенсей.[wa:3030]"
1003905-47 = "― П-Перестаньте баловаться... п-пожалуйста...[wa:3200]"
1003905-50 = "―Это..! Я не могу сосредоточиться на прицеливании...[wa:320]"
1003905-53 = "[ns] «Я вообще ничего не делаю.»"
1003905-54 = "― ...Ой.[wa:540]"
1003905-57 = "― Э-Это не помеха?[wa:10]"
1003905-59 = "― В-Вы тренируете меня для р-реального боя.[wa:2690]"
1003905-62 = "― Кажется,"
1003905-64 = "― м-мы делали такое в SRT...[wa:1320]"
1003905-67 = "[ns] «Я правда ничего не делаю...»"
1003905-68 = "― А-А-а...?[wa:520]"
1003905-71 = "― С-Сенсей...! В-Вы[wa:2860]"
1003905-73 = "― д-д-дышите мне в у-ухо...!![wa:420]"
1003905-76 = "― (Дыхание Сенсея... так близко...!)[wa:4720]"
1003905-78 = "― (Я-я не могу прицелиться...!)[wa:1180]"
1003905-81 = "[ns] Рассказать Мию о животных."
1003905-82 = "К-Когда здесь успело появиться столько животных?!"
1003905-85 = "Угх..."
1003905-86 = "Я д-думала, что хорошо, когда животные меня любят..."
1003905-87 = "Но теперь э-это мешает заданию..."
1003905-88 = "Это не талант..."
1003905-89 = "Я и правда бесполезна."
1003905-90 = "[s] «Смотри, я останусь прямо рядом с тобой.»"
1003905-91 = ""
1003905-94 = "[ns] «Давай попробуем ещё раз.»"
1003905-95 = ""
1003905-96 = "...Да."
1003905-97 = "Я рассчитываю на вас, Сенсей!"
1003905-99 = "Я отогнал животных от Мию и наблюдал за её тренировкой."
1003905-100 = "Несмотря на сомнения, Мию раз за разом безошибочно попадала в бумажную мишень."
