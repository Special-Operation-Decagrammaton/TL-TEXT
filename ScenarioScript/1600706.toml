[translation]
1600706-1 = "Неудача должна быть искоренена"
1600706-2 = "Добро пожаловать, Сенсей."
1600706-3 = "Спасибо, что пришли помочь, Сенсей."
1600706-4 = "[s] «Ты мне угрожала. У меня не было выбора...»"
1600706-5 = "Угрожала? Я попросила вас о помощи так же, как обычно."
1600706-6 = "[s] «Ты же сказала, что если я сбегу, нас обеих подвергнут чистке.»"
1600706-7 = "Да, конечно. Мы с тобой товарищи, связанные одной судьбой."
1600706-8 = "Моя ошибка — твоя ошибка..."
1600706-9 = "Иными словами, коллективная ответственность!"
1600706-10 = "[ns] «Зачем ты попросила меня встретиться с тобой на кухне?»"
1600706-11 = ""
1600706-13 = ""
1600706-14 = "Потому что сегодняшняя задача — разработать новую сладкую закуску."
1600706-15 = "...Ты случайно не знаешь, как приготовить сладкую закуску из болгарского перца?"
1600706-16 = "[s] «Сладкую закуску из болгарского перца?»"
1600706-17 = "Понимаешь, в прошлом месяце заведующий школьной столовой по ошибке заказал огромное количество болгарского перца. Очень огромное."
1600706-18 = "Заведующего столовой, допустившего столь серьёзную ошибку, немедленно подвергли чистке, но президент Черино заявила, что ни за что не станет есть болгарский перец."
1600706-19 = "Но я думаю, что если мне удастся сделать из него сладкую закуску, нашей привередливой президентше она может понравиться."
1600706-20 = "[s] «Об этом обычно переживают родители или опекуны.»"
1600706-21 = "Хи-хи, мне всегда приятно видеть, как президент Черино с удовольствием ест что-нибудь вкусное."
1600706-22 = "Но как превратить этот горький и резкий овощ в сладкую закуску?"
1600706-23 = "Мне очень хотелось бы услышать ваше мнение, Сенсей."
1600706-24 = "[s1] «А если его высушить?»\n[s2] «А если замариновать его с сахаром?»"
1600706-25 = "И правда. Сушёные овощи становятся хрустящими, почти как крекеры."
1600706-26 = "К тому же у них появляется лёгкая сладость."
1600706-27 = "И правда. Сладость сахара могла бы скрыть горечь перца."
1600706-28 = "А ещё, когда из маринованного овоща испаряется влага, его текстура становится мягче."
1600706-29 = "Какой замечательный план. Я знала, что на вас можно положиться, Сенсей!"
1600706-30 = "Я немедленно начну подготовку."
1600706-35 = "Мы испробовали разные способы приготовления болгарского перца."
1600706-37 = "Хм... Чего-то не хватает."
1600706-38 = "Как ни подслащивай его и какой бы приятной ни была текстура, горечь всё равно не удаётся устранить."
1600706-39 = "Черино, будучи привередой в еде, ни за что не станет это пробовать и тем более есть с удовольствием."
1600706-40 = "[s] «Но мы ведь так старались. Уверена, она поймёт.»"
1600706-41 = "Ч-Что?! Вы хотите доложить президенту о нашей неудаче?!"
1600706-42 = "Всё, что делается во имя президента, не может быть неудачей. Президент всегда права!"
1600706-43 = "*шёпотом* Если Черино спросит, куда делся болгарский перец, отвлеките её роскошным пудингом, который я для неё приготовила."
1600706-44 = ""
1600706-46 = ""
1600706-47 = "Вы понимаете, Сенсей? Для меня этого никогда не происходило. Нужно уничтожить все свидетельства провала."
1600706-48 = "[s] «Но закусок из перца осталось очень много.»"
1600706-49 = "Придётся так или иначе от них избавиться."
1600706-50 = "За работу, Сенсей."
1600706-52 = "После этого мы с Томоэ съели оставшиеся закуски из болгарского перца."
1600706-53 = "...Но их оказалось слишком много, поэтому мы раздали их студентам Академии Красной Зимы."
