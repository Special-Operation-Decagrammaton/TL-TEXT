[translation]
10018060-1 = "Эпизод 6; Всё распродано? Не может быть..."
10018060-2 = "Я отправился на улицу, где всем заправляет Няо Фудс, чтобы купить продукты."
10018060-3 = "Всё выглядело совершенно обычно, ничего особенного не бросалось в глаза."
10018060-7 = ""
10018060-8 = "Сегодня на улице очень оживлённо."
10018060-9 = "Учитывая время, это логично."
10018060-10 = "Я... даже немного взволнована!"
10018060-11 = "[ns] «Сегодня у тебя много дел, Джури.»"
10018060-12 = "Вовсе нет. Я каждый день занимаюсь таким для Клуба школьной столовой."
10018060-13 = "Если что, сегодня даже проще и приятнее, чем обычно."
10018060-14 = "О! Я не хочу сказать, что работа в Клубе школьной столовой неприятная."
10018060-15 = "Невероятно наблюдать, как работают старшие участницы клуба. Их мастерство завораживает..."
10018060-16 = "Мне становится радостно просто смотреть на них."
10018060-17 = "А я была бы ещё счастливее, если бы они готовили ещё более вкусные обеды!"
10018060-18 = "Понимаю, что ты имеешь в виду..."
10018060-19 = "Уверена, ты довольно часто слышишь что-то подобное. ★"
10018060-20 = "*вздыхает*"
10018060-21 = "Верно. Именно этим Клуб школьной столовой и должен заниматься, но..."
10018060-22 = "[s] «Спасибо, что пришли, Изуми и Акари.»"
10018060-23 = "Конечно! Я обожаю смотреть на вкусную еду!"
10018060-24 = "Но есть её я люблю ещё больше... *глоток*"
10018060-25 = "Я просто не хотела, чтобы Джури одна наслаждалась всей этой кулинарной красотой. ★"
10018060-26 = "В любом случае, чем больше помощи, тем лучше, так что не переживайте, Сенсей."
10018060-27 = "[s] «Не уверен насчёт всего этого... но раз ты так говоришь.»"
10018060-29 = "Хорошо, идём за продуктами!"
10018060-30 = "Наша цель — найти лучшие из лучших посредственных ингредиентов."
10018060-34 = ""
10018060-35 = "О! Эта капуста выглядит неплохо, но не слишком хорошо."
10018060-36 = ""
10018060-38 = ""
10018060-39 = "Коричневых пятен немного. При нажатии она твёрдая, значит хотя бы свежая. Выглядит достаточно хорошо за свои деньги."
10018060-40 = "Извините. Мы хотели бы купить эту капусту."
10018060-41 = "О, простите. Всё уже распродано."
10018060-42 = "...Что? Но я прямо сейчас держу одну в руках."
10018060-43 = "Простите, за всё заранее заплатили."
10018060-44 = "В-Вы уверены, что ничего не осталось?"
10018060-45 = "Уверена... К тому же нам велели больше ничего не продавать, даже если что-то останется."
10018060-46 = "Мне так жаль. Хотелось бы, чтобы всё было иначе..."
10018060-47 = ""
10018060-49 = ""
10018060-50 = ""
10018060-52 = "Хм..."
10018060-53 = "Это какой-то бред!"
10018060-57 = "Давайте тогда попробуем купить мясо."
10018060-58 = ""
10018060-60 = ""
10018060-61 = "Свинина здесь выглядит хорошо!"
10018060-62 = "Красивый розовый цвет, и прожилки выглядят неплохо."
10018060-63 = "Мы сегодня закрываемся. Что вам нужно?"
10018060-64 = "Что? Уже?"
10018060-65 = "На сегодня всё распродано."
10018060-66 = "Ага. Случайно не потому, что кто-то заплатил заранее?"
10018060-67 = "Вообще-то да. Странно. Со мной такого раньше никогда не случалось."
10018060-68 = "Простите. Приходите снова, когда пополним запасы."
10018060-69 = "Что-то тут пахнет рыбой, и дело не в мясе."
10018060-72 = "Ну, можем пойти купить соевый соус и кулинарное вино, но у меня плохое предчувствие..."
10018060-73 = "Приправы долго хранятся, и их нечасто покупают большими партиями, так что они не должны закончиться..."
10018060-74 = "Здравствуйте, у вас есть соевый соус и кулинарное вино? Нам ещё нужно масло для готовки."
10018060-75 = "Эм, вообще-то нам придётся закрыться, пока не поступит новая партия товара."
10018060-76 = ""
10018060-78 = ""
10018060-79 = "Всё... распродано?"
10018060-80 = "Да, простите за неудобства."
10018060-81 = ""
10018060-83 = ""
10018060-85 = "Один-два раза ещё можно списать на совпадение, но три? Ни за что."
10018060-86 = "Кто-то делает это специально? Но зачем?"
10018060-87 = "Это так подло!"
10018060-88 = "[s] «Это не случайность.»"
10018060-90 = "Д-Давайте проверим другие места!"
10018060-97 = "Безрезультатно, и я не только про фруктовую лавку."
10018060-98 = "[s] «На всей улице всё распродано?»"
10018060-99 = "Не всё, Сенсей, только всё приличное."
10018060-100 = "Кто-то пытается нам помешать! Но почему?!"
10018060-101 = ""
10018060-104 = "Потому что вы перешли черту."
10018060-106 = ""
10018060-108 = ""
10018060-109 = "[ns] «Кто это?»"
10018060-110 = ""
10018060-112 = ""
10018060-115 = ""
10018060-116 = "Вы зашли слишком далеко."
10018060-117 = "Скорее всего, вы этого не сделаете, но ещё не поздно отступить."
10018060-118 = "Уходите, и тогда мы перестанем вмешиваться."
10018060-119 = "Похоже, ты уже знаешь ответ. С чего ты взяла, что мы уйдём?"
10018060-120 = "Слушайте, это неудобно для всех. Мы не хотим этим заниматься, вы тоже, так что если вы остановитесь, мы тоже сможем остановиться."
10018060-121 = "Скорее, если мы остановимся, вы просто захватите «Воробей»!"
10018060-122 = "Неужели этот ресторан вообще стоит всех этих проблем..."
10018060-123 = "Но ладно, как хотите."
10018060-124 = "Я предполагала, что до этого дойдёт, поэтому пришла подготовленной."
10018060-125 = ""
10018060-127 = ""
10018060-129 = ""
10018060-131 = "Э-Эти штуки вообще без шлемов!"
10018060-132 = "А, понятно, что вы задумали."
10018060-134 = "Помните, это ваша вина."
10018060-135 = ""
10018060-137 = ""
10018060-138 = "На этот раз всё закончится немного иначе."
