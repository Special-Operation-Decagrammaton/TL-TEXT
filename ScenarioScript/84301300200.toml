[translation]
84301300200-5 = "...Да, я знала, что всё пойдёт наперекосяк."
84301300200-6 = "(Я знала...)"
84301300200-7 = "Такие... происшествия здесь часто случаются?"
84301300200-8 = "О, каждый день. Если бы C&C отправляли на каждое происшествие, мы бы уже давно все свалились от усталости."
84301300200-9 = "Вот что мы имели в виду, когда раньше сказали, что «шум поднять может что угодно»."
84301300200-10 = "Ты ведь не пострадала? Если что-то болит, пожалуйста, скажи нам."
84301300200-11 = "Нет, я в порядке, правда. Не беспокойтесь обо мне."
84301300200-12 = "Если уж на то пошло, я бы хотела увидеть ЕЩЁ больше таких происшествий."
84301300200-13 = "Больше? Зачем...?"
84301300200-15 = "Потому что это весело, правда? По-моему, весело."
84301300200-16 = "Асуна, мы здесь телохранители, а не искатели острых ощущений."
84301300200-17 = "Ну, я не хочу доставлять неприятности, но согласна с Асуной. Было довольно весело."
84301300200-18 = "Кстати, я раньше кое-что слышала об Инженерном отделе. Говорят, это они могли создать робокрокодила."
84301300200-19 = "А что это вообще за отдел?"
84301300200-20 = ""
84301300200-22 = ""
84301300200-23 = "Н-Ну, это..."
84301300200-24 = "О, чудесное место! Они делают столько всяких интересных вещей!"
84301300200-25 = "Асуна...!!"
84301300200-27 = "Фуфу, понятно. Что ж, тогда, может, заглянем к ним?"
84301300200-28 = "Скажем так... они пробудили моё любопытство."
84301300200-29 = "Серьёзно...?"
84301300200-30 = ""
84301300200-32 = ""
84301300200-33 = "Да ТЫ сама ходячая проблема."
84301300200-34 = "Ну не могу же я ничего поделать со своими интересами. Надеюсь, вы понимаете. Формальный эскорт мне не нужен. Можем обойтись без церемоний."
84301300200-35 = "...Проводите меня до Инженерного отдела, пожалуйста?"
84301300200-36 = "Да! Пойдём прямо сейчас!"
84301300200-37 = "*вздыхает*"
84301300200-38 = "Похоже, выбора у меня нет. Клиент хочет — мы должны это обеспечить."
84301300200-39 = "И, судя по всему, Семинар совсем недавно тщательно проверил Инженерный отдел."
84301300200-40 = "...Уверена, всё будет хорошо."
