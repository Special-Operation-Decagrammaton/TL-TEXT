[translation]
51070-1 = "Episódio 7;Garota da Juventude (?) (1)"
51070-3 = "[ns] \"...Afinal, o que significa exatamente 'juventude'?\""
51070-4 = "Ah! Agora que me lembrei..."
51070-5 = "Certa vez, ouvi algo da Renge-senpai sobre isso."
51070-11 = "Falando nisso, Yukari, você já dizia que queria entrar pra cá desde o ensino fundamental, né?"
51070-12 = "Sim!"
51070-13 = "\"Foi por causa daquele encontro predestinado naquela noite\"... não era isso?"
51070-14 = "Quando ouvi isso pela primeira vez, pensei: 'Por que alguém ia querer vir pra um lugar desses...? Que garota estranha'... Mas..."
51070-15 = "O Hyakkaryouran é um comitê esplêndido onde a elite se reúne! Sendo eu também parte da elite, decidi que este era o único lugar para mim!"
51070-16 = "Bom, é verdade... Desde o ensino fundamental, você vinha literalmente todo santo dia..."
51070-17 = "A Kikyou te mandava embora, e no dia seguinte#nvocê aparecia toda animada de novo, sem nem se abalar."
51070-18 = "Acordar às quatro da manhã todo dia pra treinar, tomar café e ir direto pra aula... depois da aula, mais treino...#nO que tem de tão bom num comitê assim?"
51070-20 = "Mesmo assim, para mim, o tempo que passo me esforçando ao lado da Renge-senpai e das outras senpais é imensamente prazeroso!"
51070-21 = "É, bom... se você diz isso desse jeito, não tenho nem o que rebater."
51070-22 = "Mas... você nunca pensou nisso nem uma vezinha?"
51070-24 = "...?"
51070-25 = "Tipo, aproveitar a juventude com as amigas, fora das atividades do Hyakkaryouran..."
51070-26 = "Nem uma única vez!"
51070-27 = "Nossa, respondeu na lata..."
51070-28 = "E quanto à Renge-senpai? Não gosta das atividades do Hyakkaryouran?"
51070-29 = "Pois é... Desde que entrei junto com a Kikyou, até que tenho me divertido bastante."
51070-30 = "Fiquei bem próxima da Nagusa-senpai e de você também... Não é como se eu me arrependesse, mas..."
51070-35 = "De vez em quando, fico pensando... como seria viver uma juventude comum, sabe?"
51070-36 = "Às vezes isso passa pela minha cabeça.#nComo posso dizer... algo tipo um clube cultural?"
51070-42 = "—Naquela época, não compreendi muito bem o que aquelas palavras significavam."
51070-43 = "Mas, ao relembrar nossa conversa daquele dia... pus-me a refletir."
51070-44 = "Talvez a Renge-senpai desejasse entrar em outro clube...#nPode ser apenas impressão minha, mas..."
51070-45 = "[s] \"Será que ela não está só fascinada pela ideia de 'juventude'?\""
51070-49 = "Ah...?!#nEntão é isso mesmo?!"
51070-50 = "Entendo... Isso significa que a Renge-senpai, neste exato momento..."
51070-51 = "Assim como está escrito neste papel, partiu em uma jornada para aproveitar a juventude...?!"
51070-52 = "Ela havia dito: \"Se é para viver a juventude, tem que ser em um clube cultural. É muito mais a cara da juventude do que o Hyakkaryouran cheio de suor\" — jamais imaginei que isso nos levaria até aqui!"
51070-53 = "[s] \"Parece que já temos uma pista de para onde ela foi, né?\""
51070-54 = "Hmph... A Renge-senpai sempre esteve na linha de frente nos protegendo, e mesmo assim..."
51070-55 = "Agora que a Nagusa-senpai desapareceu e as atividades do Hyakkaryouran foram suspensas...#na paciência dela finalmente chegou ao limite..."
51070-59 = "E seu desejo pela juventude finalmente explodiu! Tenho certeza absoluta!"
51070-60 = "Vamos! Não há tempo a perder! Partamos imediatamente, Sensei!"
51070-66 = "Porém, bem..."
51070-72 = "Para onde exatamente deveríamos ir?#nNão sou muito familiarizada com os clubes culturais..."
51070-79 = "[ns] \"Aqui está, a Kaho preparou uma lista dos clubes culturais para nós.\""
51070-80 = "O Clube Yin-Yang nos preparou uma lista?!"
51070-81 = "I-Incrível!"
51070-82 = "Ah... Seria este o famoso poder da Schale, respeitado até mesmo pela Presidente e pela Vice-Presidente do Clube Yin-Yang...?"
51070-83 = "Será que estou acompanhada por alguém verdadeiramente perigoso?!"
51070-84 = "[s] \"N-Não é nada disso...\""
51070-85 = "Muito bem..."
51070-86 = "Vamos usar isto como guia para encontrar a Renge-senpai!"
51070-88 = "Clube de Observação de Clorela"
51070-90 = "O primeiro da lista é este lugar aqui..."
51070-91 = "Pois bem—"
51070-95 = "Com licença!"
51070-107 = "Por acaso vieram conhecer o clube?"
51070-108 = "...De novo?"
51070-109 = "[s] \"Olá. Bem, nós—\""
51070-111 = "Sim! Viemos procurar pela Renge-senpai!"
51070-113 = "Renge...?"
51070-114 = "De quem você está falando...?"
51070-116 = "A Renge-senpai é..."
51070-117 = "A Renge-senpai, ora!"
51070-119 = "...Hã?"
51070-122 = "[ns] \"Yukari, primeiro você precisa descrever como a Renge é...\""
51070-123 = "Ah, tem razão!"
51070-124 = "Vejamos, bem, a Renge-senpai é..."
51070-125 = "Alguém que diz \"Quem faltar ao treino matinal vai levar punição!\"..."
51070-126 = "Que implica comigo quando tenho um grão de arroz no rosto..."
51070-127 = "Ela é assim, mas assim que avista a Trupe Chimi causando problemas, corre imediatamente para lá... Uma pessoa por quem nutro profunda admiração..."
51070-132 = "Hum... não fazemos a menor ideia de quem seja."
51070-134 = "N-Não pode ser...?!"
51070-135 = "[s1] \"O que você acabou de descrever...\"\n[s2] \"Foi só o que você acha da Renge, né...\""
51070-138 = "H-Hum... de fato, tem toda razão..."
51070-139 = "Vejamos... A Renge-senpai tem lindos cabelos vermelho-escarlate e..."
51070-141 = "Cabelos vermelho-escarlate?"
51070-142 = "[s] \"Acho que procurar assim aleatoriamente—\""
51070-143 = "Se tem cabelo vermelho-escarlate, será que não é aquela garota que fez o período experimental há pouco tempo?"
51070-149 = "Ah... aquela que usava um haori azul-claro?"
51070-151 = "Sim, é ela mesma! Então ela realmente esteve aqui!"
51070-152 = "Sendo a Renge-senpai, com certeza deve estar se destacando como o ás deste \"Clube de Observação de Clorela\" também...!"
51070-154 = "Como dizer... ela falava umas coisas meio sem sentido, né..."
51070-155 = "Tipo: \"Vamos nos esforçar até o amanhecer mirando no torneio nacional! Primeiro, condicionamento físico!\"..."
51070-156 = "Aliás, por acaso existe torneio nacional de observação de clorela?"
51070-157 = "Acho que ela também disse algo como: \"Me ensinem a verdadeira essência da observação de clorela! Vou começar a me preparar agora mesmo para brilhar no nacional!\"..."
51070-163 = "[ns] \"Hum, pelo que elas estão dizendo...\""
51070-165 = "...Como esperado da Renge-senpai! Que atuação magnífica!"
51070-169 = "[ns] \"S-Será que isso conta como atuação?!\""
51070-170 = "Afinal, a Renge-senpai é alguém que jamais aceita fazer nada pela metade!"
51070-171 = "E então... gostaria de perguntar: onde a Renge-senpai está agora...?"
51070-172 = "Ah, ela não está mais aqui."
51070-173 = "No dia em que terminou o período experimental, se não me engano..."
51070-180 = "Argh... Me desculpem!!"
51070-181 = "Durante todo o período experimental, eu só fiquei fazendo perguntas.#nFoi mal, acabei dando trabalho pra vocês."
51070-186 = "Não, a gente não achou que deu trabalho..."
51070-188 = "...Mas, graças a isso, eu percebi uma coisa."
51070-190 = "Hum?"
51070-191 = "Diferente de vocês, que observam a clorela com toda a seriedade, eu... estava fazendo tudo pela metade, olhando só para a superfície."
51070-192 = "No fim das contas, comparada a vocês que dedicaram a vida inteira a este clube, eu não chego nem aos seus pés."
51070-193 = "Não, a gente não dedicou a vida inteira..."
51070-194 = "Então, desculpa!! Quanto a entrar oficialmente no clube... sinto muito, mas vou ter que recusar."
51070-195 = "Mas! Eu recebi com todo o respeito a paixão ardente de vocês. Deixem que eu continue torcendo pela observação de clorela daqui pra frente!"
51070-197 = "Quando vocês forem pro torneio nacional, eu com certeza vou lá torcer!"
51070-204 = "—Ela disse isso e foi embora."
51070-205 = "Torneio nacional de observação de clorela..."
51070-206 = "Será que eu devia pesquisar primeiro se isso existe?"
51070-208 = "...Entendo."
51070-209 = "Por acaso saberiam dizer para onde ela seguiu?"
51070-210 = "Estamos bem ocupadas agora com os preparativos da nossa barraca para o \"Festival das Lanternas\"..."
51070-211 = "Ela saiu logo em seguida, então não sabemos mais nada além disso. Desculpa."
51070-214 = "[ns] \"Que pena, chegamos um passo tarde demais.\""
51070-215 = "Sim. Contudo, descobrir que a Renge-senpai está frequentando os clubes culturais já é um grande avanço!#nExatamente como eu havia previsto!"
51070-219 = "Parece que estamos no caminho certo, então sigamos para o próximo clube!"
51070-221 = "Clube de Shogi Simultâneo"
51070-223 = "A garota de cabelo vermelho do Hyakkaryouran...?"
51070-224 = "Ah, lembrei. Ela passou pelo nosso clube também."
51070-225 = "Como posso dizer... ela era uma garota bem peculiar."
51070-226 = "Durante a partida, quando ela ficou em apuros, perguntei se queria \"voltar a jogada\", e então—"
51070-231 = "I-Isso é... você está tendo pena de mim...?"
51070-232 = "Argh... Mas!!"
51070-233 = "Entendi..."
51070-237 = "Sendo assim, xeque-mate."
51070-242 = "Eu me rendo!!!"
51070-245 = "—Foi isso que aconteceu.#nDepois, ela disse \"Preciso me treinar de novo por ter vacilado nem que fosse por um segundo\", fez várias reverências e foi embora."
51070-247 = "Que... que atuação mais digna da Renge-senpai!"
51070-249 = "Clube de Rakugo Fitness"
51070-250 = "Ah. Se está falando da Renge-san, ela esteve aqui, sim."
51070-251 = "Ficamos felizes quando ela disse \"Meus sonhos de juventude se expandiram!\" enquanto ouvia nosso rakugo, mas..."
51070-252 = "Estamos ocupadas com os preparativos do festival, então não temos tempo para receber novas integrantes agora.#nAcabamos recusando a entrada dela."
51070-254 = "Clube de Batalha de Karuta"
51070-255 = "Ah, verdade, verdade. Uma garota assim passou por aqui também."
51070-256 = "Disse que sonhava com batalhas ardentes de karuta da juventude, ou algo assim."
51070-257 = "Bom, como o festival está chegando, recusamos a entrada dela, mas..."
51070-264 = "(Depois disso, continuamos visitando os clubes na ordem da lista.)"
51070-268 = "[ns] \"Vamos tomar um chá e descansar um pouco.\""
51070-272 = "Ah, muito obrigada..."
51070-273 = "(Visitamos vários clubes, mas não conseguimos encontrar a Renge.)"
51070-274 = "Jamais imaginei que a Renge-senpai tivesse feito tantos períodos experimentais assim..."
51070-275 = "Ainda assim, a impressão que todas tiveram da Renge-senpai..."
51070-276 = "[s] \"Pois é, foi meio mordaz...\""
51070-277 = "Sim! Foram elogios muitíssimo mordazes!"
51070-278 = "...Hã? Estou usando a palavra errado...?"
51070-279 = "Fufu, mas o que está dizendo!"
51070-280 = "Toda palavra muda de sentido dependendo de como a interpretamos!"
51070-281 = "O fato de todas se lembrarem da Renge-senpai prova que ela se dedicou à juventude com toda a seriedade!"
51070-282 = "Afinal, desde sempre a Renge-senpai costuma dizer: \"O importante é ir até o fim sem fazer nada pela metade!\""
51070-283 = "[s] \"Você realmente admira a Renge de todo o coração, né?\""
51070-284 = "Sim! Eu admiro a Renge-senpai do fundo do meu coração!"
51070-285 = "Vejamos..."
51070-289 = "Então, nosso próximo destino é—"
51070-291 = "Sensei... te acheeei!"
51070-300 = "[ns] \"Uau?!\""
51070-304 = "[ns] \"Kaede?!\""
51070-306 = "S-Sensei?! Não se machucou?!"
51070-307 = "K-Kaede-chan?! Isso é perigoso!"
51070-308 = "Fuaa..."
51070-309 = "[s] \"Kaede, Mimori, Tsubaki...?\""
51070-312 = "Próximo;Garota da Juventude (?) (2)"
