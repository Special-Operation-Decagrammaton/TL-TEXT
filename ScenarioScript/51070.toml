[translation]
51070-1 = "Эпизод 7;В погоне девушки за юностью(?) 1"
51070-2 = ""
51070-3 = "[ns] «Юность? Что это значит?»"
51070-4 = "...Ах! Теперь, когда я задумалась..."
51070-5 = "Рэнгэ как-то говорила что-то подобное."
51070-7 = ""
51070-8 = ""
51070-10 = ""
51070-11 = "Кстати, Юкари. Ты ведь хотела вступить к нам ещё со средней школы."
51070-12 = "Да!"
51070-13 = "Хех. Ты тогда кричала что-то вроде: «Всё было предрешено той судьбоносной ночью!», да?"
51070-14 = "Когда я это услышала, подумала, что ты самый странный новичок из всех, кого мы когда-либо видели. Представить только — ребёнок сам хочет вступить в такое изматывающее место."
51070-15 = "Что вы имеете в виду?! Хяккарёран — место, где элита собирается вместе, чтобы сражаться за справедливость! Я, Юкари, с самого начала знала, что это единственный клуб для меня!"
51070-16 = "...Значит, ты всегда была такой. Или, по крайней мере, ещё со средней школы, да?"
51070-17 = "Когда Кикё отчитала тебя за попытку вступить, ты ушла с самым унылым лицом, какое я когда-либо видела. А на следующий день вернулась как ни в чём не бывало."
51070-18 = "В дождь и в солнце ты приходила в четыре утра на тренировку с улыбкой, уходила на завтрак, шла на занятия, а потом снова тренировалась и тренировалась. Что ты находишь в этом настолько привлекательного — никогда не пойму."
51070-20 = "Ах, но мне, Юкари, нравится быть с Рэнгэ и остальными!"
51070-21 = "Ну... Если уж на то пошло, ты и сама не так плоха."
51070-22 = "Но всё же... У тебя когда-нибудь возникали такие мысли?"
51070-24 = "...?"
51070-25 = "Haven't you ever thought about the bittersweet moments of youth you might be experiencing if you weren't so devoted to your duties with the Hyakkaryouran...?"
51070-26 = "Нет, ни капельки!"
51070-27 = "Фух... Какой быстрый ответ."
51070-28 = "А вы, Рэнгэ? Наверняка вы можете многое рассказать мне о Хяккарёран!"
51070-29 = "...Ну, с тех пор как мы с Кикё вступили сюда, было много весёлого."
51070-30 = "Я встретила Нагусу и тебя... Так что не могу сказать, что жалею."
51070-31 = ""
51070-33 = ""
51070-35 = "Но всё же, если бы я могла провести свою юность иначе..."
51070-36 = "Возможно, я предпочла бы гуманитарный клуб, а не тот, где столько физической активности─"
51070-37 = ""
51070-40 = ""
51070-42 = "...Я не поняла, о чём она говорила. Мне казалось, она проверяет мою решимость как новичка..."
51070-43 = "Но потом я, Юкари, время от времени снова вспоминала тот разговор."
51070-44 = "Неужели Рэнгэ и правда хотела бы вступить в другие клубы? Может, я слишком переживаю, но..."
51070-45 = "[s] «Как ни посмотри, она ведь явно сожалела об упущенной юности?!»"
51070-46 = ""
51070-48 = ""
51070-49 = "*ах* Значит, я была права!"
51070-50 = "Понятно... Значит, Рэнгэ..."
51070-51 = "Она и правда отправилась искать свою юность, как и написано в записке?!"
51070-52 = "Значит, когда она говорила: «Ага, гуманитарные клубы — вот где настоящая юность, звучит куда лучше, чем потеть на тренировках Хяккарёран», она вовсе не проверяла меня!"
51070-53 = "[s] «Я... думаю, в этом можно быть уверенным на сто процентов.»"
51070-54 = "Хм, Рэнгэ всегда шла впереди. Она усердно старалась, чтобы никто из нас не пострадал."
51070-55 = "Но после исчезновения Нагусы... А особенно после того, как Хяккарёран прекратил деятельность..."
51070-56 = ""
51070-58 = ""
51070-59 = "Рэнгэ больше не смогла подавлять своё желание снова почувствовать себя юной! Я уверена!"
51070-60 = "Нам нужно искать её, а не тратить здесь время, Сенсей!"
51070-61 = ""
51070-63 = ""
51070-65 = ""
51070-66 = "Но, эм..."
51070-67 = ""
51070-70 = ""
51070-71 = ""
51070-72 = "Куда нам идти?"
51070-73 = ""
51070-79 = "[ns] «Вот, это список гуманитарных клубов, который я получил у Кахо.»"
51070-80 = "Вы так легко убедили Клуб Инь-Ян поделиться информацией о клубах?!"
51070-81 = "Э-Это потрясающе!"
51070-82 = "Чтобы президент и вице-президент Клуба Инь-Ян так быстро уступили... *ах* Н-Неужели это та самая печально известная власть Шале?"
51070-83 = "Неужели я, Юкари, и правда попала в лапы чрезвычайно опасного человека?!"
51070-84 = "[s] «П-Пожалуйста, хватит этих недоразумений...»"
51070-85 = "Хм!"
51070-86 = "В любом случае, с этим списком мы можем начать поиски Рэнгэ!"
51070-88 = "Клуб экологии хлореллы"
51070-90 = "Согласно списку... Здесь находится штаб первого клуба..."
51070-91 = "Итак..."
51070-92 = ""
51070-94 = ""
51070-95 = "Прошу прощения!"
51070-96 = ""
51070-102 = ""
51070-103 = ""
51070-105 = ""
51070-106 = ""
51070-107 = "Хм? Посетители?"
51070-108 = "А? Здравствуйте?"
51070-109 = "[s] «Здравствуйте! Простите за беспокойство, мы пришли—»"
51070-111 = "Мы пришли за Рэнгэ! Немедленно выдайте её!"
51070-113 = "...Рэнгэ?"
51070-114 = "О чём вы говорите? Кто такая Рэнгэ?"
51070-116 = "Рэнгэ — это, эм..."
51070-117 = "Рэнгэ!"
51070-119 = "...А?"
51070-121 = ""
51070-122 = "[ns] «Юкари, им нужно больше подробностей...»"
51070-123 = "А, п-правда?"
51070-124 = "М-м... Подробности о Рэнгэ..."
51070-125 = "Она ругает меня, если я просплю утреннюю тренировку, и в наказание бегает со мной дополнительные круги..."
51070-126 = "А ещё смеётся, если у меня на губах остаётся рис, ей это кажется забавным..."
51070-127 = "А когда мы вместе ходили за покупками и увидели, как Моурё пристают к людям, она ни секунды не колебалась! Скрутила их прежде, чем они поняли, что происходит... Я очень ею восхищаюсь..."
51070-128 = ""
51070-131 = ""
51070-132 = "...Простите, я не понимаю, о ком вы говорите."
51070-134 = "А-А?! Как этого может быть недостаточно?!"
51070-135 = "[s1] «Твои чувства к Рэнгэ вполне понятны, но...»\n[s2] «Может, попробуешь описать её внешность?»"
51070-138 = "Хм-м... Понятно..."
51070-139 = "Что люди чаще всего замечают в Рэнгэ... это её невероятно крутые красные волосы..."
51070-141 = "Красные волосы?"
51070-142 = "[s] «Может, стоит изменить наш подход...»"
51070-143 = "Красные волосы... Она ведь не про ту девушку, которая недавно заходила к нам, говорит?"
51070-144 = ""
51070-147 = ""
51070-149 = "А... Ту, что была в небесно-голубом хаори?"
51070-151 = "Да, это она! Я знала, что она придёт в этот клуб!"
51070-152 = "Зная Рэнгэ, она наверняка стала новым асом Клуба экологии хлореллы!"
51070-154 = "Она, эм... Кажется, говорила какие-то вещи, которые было трудно понять?"
51070-155 = "Она говорила что-то вроде: «Будем тренироваться всю ночь! Пора нацелиться на национальный чемпионат! Моя выносливость непобедима!»"
51070-156 = "...А по наблюдению за хлореллой вообще проводят чемпионаты?"
51070-157 = "А ещё она говорила что-то вроде: «Научите меня всему, что только можно знать о хлорелле! Я буду стараться изо всех сил, вы за меня не будете краснеть!», и это было немного..."
51070-158 = ""
51070-160 = ""
51070-162 = ""
51070-163 = "[ns] «Это... довольно сильное впечатление.»"
51070-164 = ""
51070-165 = "...Как и ожидалось, потрясающее выступление Рэнгэ!"
51070-166 = ""
51070-169 = "[ns] «А?! Это ты называешь потрясающим выступлением?!»"
51070-170 = "Рэнгэ никогда не идёт на компромиссы!"
51070-171 = "Простите, что забираю её у вас, но теперь можете сказать Рэнгэ, чтобы выходила!"
51070-172 = "А, её здесь нет..."
51070-173 = "В день, когда закончился её испытательный срок..."
51070-174 = ""
51070-176 = ""
51070-179 = ""
51070-180 = "Угх! Простите...!"
51070-181 = "Последние несколько дней... Вы столько сил потратили, чтобы показать новой младшей участнице, как тут всё устроено."
51070-182 = ""
51070-185 = ""
51070-186 = "Да это было совсем не сложно..."
51070-188 = "Это помогло мне понять..."
51070-190 = "Хм?"
51070-191 = "Увидев, насколько серьёзно вы наблюдаете за хлореллой, я поняла, что сама лишь скользила по поверхности."
51070-192 = "Мои половинчатые усилия никогда не сравнятся с вашими. Вы посвятили клубной деятельности свои жизни, а я..."
51070-193 = "Н-Нет, мы вообще-то почти не проводим здесь времени..."
51070-194 = "Простите меня! У меня нет другого выбора... кроме как выйти из клуба!"
51070-195 = "Ах, но ваша пылающая страсть вдохновила меня! Поэтому я продолжу болеть за наблюдение за хлореллой!"
51070-197 = "Я обязательно приду поддержать вас на национальном чемпионате!"
51070-198 = ""
51070-201 = ""
51070-204 = "...А потом, как только закончился её испытательный срок, она убежала."
51070-205 = "Кстати..."
51070-206 = "Может, нам хотя бы попробовать зарегистрироваться на... чемпионат по наблюдению за хлореллой? Мне вроде хочется, чтобы она нами гордилась..."
51070-208 = "А-Ах... значит, её здесь нет..."
51070-209 = "Вы не знаете, куда она ушла?"
51070-210 = "Ну..."
51070-211 = "Все клубы заняты подготовкой к Фестивалю фонарей, так что мы не уверены."
51070-214 = "[ns] «Жаль, что нам не удалось найти Рэнгэ.»"
51070-215 = "Да, но мы подтвердили, что Рэнгэ действительно изучает гуманитарные клубы, как мы и предполагали!"
51070-216 = ""
51070-218 = ""
51070-219 = "Метод работает, так что давайте искать следующий клуб!"
51070-221 = "Клуб стратегии научно-фантастических сёги"
51070-223 = "Красноволосая девушка из Хяккарёран?"
51070-224 = "Да, помню. Она и к нам заходила."
51070-225 = "Она... немного странная, да?"
51070-226 = "Она довольно сильно проигрывала партию в сёги, и я спросила, не хочет ли она, чтобы я отменила свой ход..."
51070-228 = ""
51070-230 = ""
51070-231 = "А-Ах...! Т-Тогда, хоть это и против официальных правил... В-Вы делаете послабления членам клуба, чтобы партии оставались д-дружескими...!"
51070-232 = "Но...! Но!"
51070-233 = "А, ты не хочешь?"
51070-234 = ""
51070-236 = ""
51070-237 = "Тогда это мат."
51070-238 = ""
51070-240 = ""
51070-242 = "Я проигра-а-а-ала!!!"
51070-245 = "После этого она извинилась, сказала, что разочарована собой из-за колебаний, и убежала."
51070-247 = "Ха! Ничего другого от Рэнгэ я и не ожидала!"
51070-249 = "Клуб фитнес-ракуго"
51070-250 = "А, Рэнгэ тоже к нам заходила."
51070-251 = "Мы были рады её интересу. Она сказала, что хочет взрастить мечты о юности, слушая наши выступления ракуго."
51070-252 = "Но нам пришлось отказать ей во вступлении. Пока мы готовимся к фестивалю, на новых участников просто нет времени."
51070-254 = "Клуб боевой каруты"
51070-255 = "А, да. Был у нас такой человек."
51070-256 = "Она сказала, что с нетерпением ждёт возможности доказать свою юность в жарких боях каруты..."
51070-257 = "Ну, мы не смогли принять её, потому что фестиваль вот-вот начнётся."
51070-258 = ""
51070-260 = ""
51070-262 = ""
51070-264 = "После этого мы посетили ещё множество клубов."
51070-268 = "[ns] «Вот, выпей воды.»"
51070-269 = ""
51070-271 = ""
51070-272 = "А, да. Спасибо..."
51070-273 = "Рэнгэ видели повсюду, но никаких зацепок о том, где она находится сейчас, мы так и не нашли."
51070-274 = "Не ожидала, что Рэнгэ подаст заявки в столько клубов..."
51070-275 = "Но всё же... слушать, как все рассказывают о Рэнгэ..."
51070-276 = "[s] «Некоторые из них выражались немного дерзко...»"
51070-277 = "Да! Было чудесно слышать, как они с такой дерзостью рассказывают, насколько высоко ценят Рэнгэ!"
51070-278 = "...А? Вы думаете, «дерзко» означает не это?"
51070-279 = "Хи-хи, какая глупость!"
51070-280 = "Всё, что говорят другие, зависит от того, как это воспринимать!"
51070-281 = "Они все запомнили Рэнгэ и рассказывали о ней! Она оставила впечатление на каждом, потому что изо всех сил участвовала в их клубной деятельности!"
51070-282 = "Как Рэнгэ всегда говорила мне: «Не делай ничего вполсилы — если начала, доводи до конца!»"
51070-283 = "[s] «Ты, должно быть, очень доверяешь Рэнгэ.»"
51070-284 = "Да! Я, Юкари, глубоко ею восхищаюсь!"
51070-285 = "К-Кхм."
51070-286 = ""
51070-288 = ""
51070-289 = "Так, эм, куда нам теперь..."
51070-291 = "Нашла вас, Сенсей!"
51070-292 = ""
51070-295 = ""
51070-296 = ""
51070-300 = "[ns] «Ч-Что?!»"
51070-301 = ""
51070-303 = ""
51070-304 = "[ns] «Каэдэ?!»"
51070-306 = "С-Сенсей?! Вы в порядке?!"
51070-307 = "К-Каэдэ?! Нельзя так беспокоить Сенсея!"
51070-308 = "*зевок*"
51070-309 = "[s] «Каэдэ, Мимори и даже Цубаки...?»"
51070-310 = ""
51070-312 = "Следующий эпизод;В погоне девушки за юностью(?) 2"
