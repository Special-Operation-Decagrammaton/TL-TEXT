[translation]
1004502-1 = "Сокровище тайного острова"
1004502-2 = "Услышав слова Хошино, я отправился в коридор домика."
1004502-7 = "..."
1004502-8 = "Хех, вот оно. Я как раз искала что-то подобное..."
1004502-9 = ""
1004502-12 = "...?"
1004502-13 = "Вполне неплохо. Хороший вкус..."
1004502-14 = "[s1] «...Хошино?»\n[s2] Идти на звук."
1004502-15 = ""
1004502-16 = ""
1004502-19 = ""
1004502-21 = "А?"
1004502-22 = "О, вот ты где, Сенсей."
1004502-23 = "Я же сказала сделать вид, что вы ничего об этом не знаете. Зачем пришли? Хаха. Типичный Сенсей."
1004502-24 = "[s3] «Что ты здесь делаешь?»\n[s4] «Ты разговаривала сама с собой...»"
1004502-25 = "А?"
1004502-26 = "А?"
1004502-27 = "Хи-хи. Похоже, вы меня поймали."
1004502-28 = ""
1004502-30 = ""
1004502-31 = "...Вот."
1004502-32 = ""
1004502-35 = "[ns5] «Карта курорта?»\n[ns6] «Разве у нас в холле нет карт?»"
1004502-36 = "Хех. Вы даже не понимаете, на что смотрите, да?"
1004502-37 = "Хех. Вы даже не понимаете, на что смотрите, да?"
1004502-38 = "Посмотрите внимательнее."
1004502-39 = "Видите, она потёртая? Кто-то из тех, кто здесь останавливался, делал на этой карте пометки."
1004502-40 = "Она намного лучше новой. Здесь сохранился чей-то опыт пребывания на острове."
1004502-41 = "Я как раз искала ещё такие. Вдруг кто-то отметил интересные места!"
1004502-42 = "Это вроде как карта сокровищ."
1004502-43 = "Вы думали, я опять где-то дремлю, да?"
1004502-44 = "Хм? Что меня больше всего заинтересовало..."
1004502-45 = "Хорошо, что спросили. Я здесь почти закончила."
1004502-46 = "Раз уж вы пришли..."
1004502-47 = ""
1004502-49 = ""
1004502-51 = ""
1004502-53 = "Почему бы вам не пойти со мной?"
1004502-54 = "Давайте исследуем нашу карту сокровищ!"
1004502-60 = ""
1004502-61 = "Хм, мы почти пришли. Должно быть где-то здесь..."
1004502-62 = "Ого! Здесь так красиво. Теперь понятно, почему людям нравится это место."
1004502-63 = ""
1004502-65 = ""
1004502-66 = "А вон то..."
1004502-67 = ""
1004502-69 = ""
1004502-70 = "Ого."
1004502-71 = "[s] «Хошино...»"
1004502-72 = ""
1004502-74 = ""
1004502-76 = "...!"
1004502-77 = ""
1004502-80 = ""
1004502-81 = "[ns] «Хошино?!»"
1004502-88 = "― Ого, это потрясающе.[wa:1660]"
1004502-90 = "― Наверное, это и есть рай.[wa:460]"
1004502-93 = "― Прохладная тень... приятный морской бриз...[wa:2550]"
1004502-95 = "― Тихий шум волн...[wa:170]"
1004502-98 = "― Ого...! Я рада, что пришла сюда![wa:630]"
1004502-100 = "― Лучшего и не надо. Это место словно сон...[wa:1400]"
1004502-103 = "― ...Сенсей, не стойте просто так.[wa:2160]"
1004502-105 = "― Почему бы вам не прилечь здесь?"
1004502-108 = "― Места немного... Но...[wa:870]"
1004502-110 = "― здесь довольно здорово!"
1004502-113 = "[ns7] «Мне достаточно видеть, что ты счастлива.»\n[ns8] «Не переживай обо мне. Наслаждайся своим сном.»"
1004502-114 = "― Хех. Я знала, что вы так скажете...[wa:10]"
1004502-115 = "― Хех. Я знала, что вы так скажете...[wa:10]"
1004502-117 = "― Ну, этого и следовало ожидать.[wa:1400]"
1004502-120 = "― Я не против...[wa:90]"
1004502-123 = "― Впрочем, именно это мне в вас и нравится.[wa:1170]"
1004502-125 = "― ...Хи-хи-хи."
1004502-128 = "[ns9] «Значит, ты пришла сюда поспать.»\n[ns10] «Ты дремлешь? Вполне ожидаемо.»"
1004502-129 = "Не вредничайте. Уверена, когда меня не будет рядом, вы и сами придёте сюда отдохнуть."
1004502-130 = "Не вредничайте. Уверена, когда меня не будет рядом, вы и сами придёте сюда отдохнуть."
1004502-131 = ""
1004502-133 = ""
1004502-134 = ""
1004502-135 = "Эм, ну..."
1004502-136 = "Если всё-таки придёте сюда поспать... возьмите меня с собой, хорошо?"
1004502-138 = "В итоге мы легли рядом, немного поспали, а потом вернулись."
