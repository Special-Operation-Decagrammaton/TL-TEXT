[translation]
80000099-1 = "Яйцо из горячих источников"
80000099-2 = "Я пришёл в место, которое указала Мэгу, — переулок довольно далеко от главной улицы."
80000099-3 = "Хи-хи. Всё-таки пришли, Сенсей? Я вас ждала."
80000099-4 = "[s1] «Мэгу?»\n[s2] «Что ты делаешь в таком месте?»"
80000099-5 = ""
80000099-6 = ""
80000099-9 = "Хи-хи. Я знала, что вы спросите!"
80000099-10 = "Знаете, какой сегодня день, Сенсей? Особенный!"
80000099-11 = "Хотя нет, уверена, вы и так знаете. Вы ведь умный! В отличие от меня."
80000099-12 = "В общем! Вы всегда мне помогаете, поэтому сегодня я хотела что-нибудь сделать для вас! Хотя бы только сегодня!"
80000099-13 = "Проблема в том, что я умею только работать, понимаете?"
80000099-14 = "Копать, сносить, взрывать или устраивать контролируемые поджоги..."
80000099-15 = "О. Я ещё и строительством занимаюсь, но слушайте, всё это вообще не связано с сегодняшним днём!"
80000099-16 = "Поэтому я думала, что делать, и поняла: нужно подарить вам что-то, связанное с тем, что я умею!"
80000099-17 = "И я придумала... вот это!"
80000099-18 = ""
80000099-20 = ""
80000099-21 = "*барабанная дробь*"
80000099-22 = ""
80000099-24 = ""
80000099-26 = "[ns3] «Это яйца, сваренные в горячем источнике?»\n[ns4] «Копчёные... яйца?»"
80000099-29 = "Хи-хи. Такая ваша догадка? Интересно, что же это?!"
80000099-30 = "Вы можете быть одновременно и неправы, и правы!"
80000099-31 = "Единственное, что я умела приготовить к сегодняшнему дню, — яйца из горячего источника."
80000099-32 = "Но эти яйца особенные, знаете? Они могут быть немного слаще обычных."
80000099-33 = "Ну же, Сенсей! Очистите одно! Хочу увидеть, правильно ли я всё сделала!"
80000099-34 = "Фух. Не терпится увидеть результат!"
80000099-35 = "[ns] Очистить яйцо."
80000099-36 = ""
80000099-38 = "[ns5] «Внутри шоколад!»\n[ns6] «А, это не яйцо? Просто шоколад, похожий на яйцо?!»"
80000099-41 = "Та-дам!!"
80000099-42 = "Это шоколад из горячего источника. Я сделала его так же, как делаю яйца из горячего источника!!"
80000099-43 = "Потрясающе! *аплодисменты*!"
80000099-44 = "Ну же, Сенсей! Вы должны узнать, насколько это вкусно!!"
80000099-45 = "Быстрее!!"
80000099-46 = ""
80000099-50 = "[ns7] «О! Сладко.»\n[ns8] «Очень вкусно!»"
80000099-53 = "*ахает*"
80000099-54 = "...!!!"
80000099-55 = "Ууууу! Миссия выполнена!!"
80000099-56 = "Хи-хи. Я очень боялась, что они получатся странными... Так что рада, что всё вышло."
80000099-57 = "Хм? Делала ли я пробную партию?"
80000099-58 = "Нет! Это вообще был мой первый раз."
80000099-59 = "...О."
80000099-60 = "...! О боже! Надо было сначала потренироваться! А вдруг те, что я вам дала, были невкусными?!"
80000099-61 = "Вы всегда такой мудрый, Сенсей!! Хи-хи..."
80000099-62 = ""
80000099-64 = ""
80000099-65 = "Итак..."
80000099-66 = "...Я сделаю целую партию только для себя!"
80000099-68 = "После этого мы приготовили ещё целую кучу шоколадных яиц из горячего источника."
80000099-69 = "Несмотря на прежние слова, Мэгу отдала мне много яиц. Я положил их в холодильник Шале, чтобы потом полакомиться."
