3603-11 = "Ты в порядке, Наги?"
3603-13 = "Я в порядке... В оптимальном состоянии, если честно."
3603-14 = "Благодаря вашим искренним стараниям сегодня я получила столько оздоровительного отдыха..."
3603-15 = "Ага... Не верю. Она всё ещё не в себе."
3603-16 = "Хм..."
3603-17 = "Может, стоило попробовать парк развлечений..."
3603-18 = "О?"
3603-21 = ""
3603-22 = "Эй... Это там, вдалеке, детская площадка?"
3603-23 = "Наги, Наги, тебе это не напоминает старые времена?"
3603-24 = "Когда мы были младше и любили дурачиться и качаться на площадке?!"
3603-25 = "Детская площадка..."
3603-26 = ""
3603-28 = ""
3603-29 = "Прекрасно."
3603-30 = ""
3603-33 = "*визг тормозов*"
3603-34 = "?!"
3603-35 = "Ого, Сэя, зачем ты так резко затормозила?!"
3603-36 = "Опасно вести транспорт в сонном состоянии."
3603-37 = "Давайте сделаем перерыв в этом парке."
3603-38 = "..."
3603-39 = "Хм-м, понимаю, Сэя."
3603-40 = "Думаю, это отличная идея."
3603-41 = "...?"
3603-44 = ""
3603-45 = "Это напоминает мне площадку, где мы играли в детстве."
3603-46 = "Только теперь она пустая и вся заросла сорняками..."
3603-47 = ""
3603-49 = ""
3603-51 = ""
3603-52 = "Наги! Наги! Сюда!"
3603-53 = "Я... останусь... здесь..."
3603-54 = "Не-а! ☆"
3603-55 = "А?"
3603-56 = ""
3603-58 = ""
3603-59 = ""
3603-60 = ""
3603-61 = ""
3603-62 = ""
3603-64 = "Мика потащила Нагису на площадку."
3603-66 = ""
3603-67 = "..."
3603-68 = ""
3603-69 = "(Надо сесть...)"
3603-70 = "(А, горка.)"
3603-71 = ""
3603-72 = ""
3603-73 = ""
3603-75 = "*шшшш*"
3603-76 = "Ааа?!"
3603-78 = "Горячо...!"
3603-79 = "Ахаха! Классическая Наги — снова заняла всю горку!"
3603-80 = "Чего ты смеёшься? Ты вообще представляешь, насколько солнце раскалило этот металл? Такую опасность надо... запретить законом!"
3603-81 = "Подумать только, это сооружение предназначено для детей! Они же тут поджарятся и обуглятся. Возмутительно!"
3603-82 = ""
3603-84 = ""
3603-85 = "Ну, Наги, по крайней мере, тебе вроде стало лучше!"
3603-86 = "Что? Эм, ну..."
3603-87 = "Пожалуй... я немного пришла в себя?"
3603-88 = "Я рада, Наги."
3603-89 = "Я так переживала. Ты была растерянной и вялой, как брошенный оленёнок."
3603-90 = "Что это вообще за нелепое сравнение...?"
3603-91 = "...И всё же, похоже, трудно оставаться вялой, когда приходишь на детскую площадку."
3603-92 = "Именно. Давай поддерживать твою энергию."
3603-93 = "Съешь это, Нагиса."
3603-94 = ""
3603-96 = ""
3603-97 = ""
3603-98 = "...?"
3603-99 = "Разве это не... сильно переработанная вредная еда?"
3603-100 = "Я купила её в том магазине, пока вы двое препирались."
3603-101 = "Тебе нужно поесть. За весь день у тебя был только чёрный чай."
3603-102 = "Х-Хорошо..."
3603-103 = ""
3603-105 = ""
3603-107 = ""
3603-108 = "...Ужасно сладко."
3603-109 = "Они и начинку сделали слишком сладкой, а потом ещё сверху покрыли сахаром."
3603-110 = "А это очень солёное... прямо как океан."
3603-111 = ""
3603-113 = ""
3603-114 = "Последнее пахнет искусственным дымом и имеет непомерно насыщенный вкус."
3603-115 = "Насколько же всё это неизысканно..."
3603-116 = "Но в детстве тебе наверняка нравилось, Нагиса."
3603-117 = "Я ошибаюсь?"
3603-118 = "...Конечно нет. Я любила эти... штуки."
3603-120 = "Это и правда возвращает меня в те беззаботные дни. Тогда жизнь была проще."
3603-121 = "В те времена Наги была намного милее. ☆"
3603-122 = "Ч-Что ты вообще такое говоришь?"
3603-124 = "Нагиса, вкус вредной еды не изменился."
3603-125 = "А вот ты изменилась."
3603-126 = "Ты выросла и приобрела более тонкий и изысканный вкус."
3603-127 = "...?"
3603-128 = "Вот в чём урок. Даже приятные воспоминания о прошлом могут разочаровать, если к ним вернуться."
3603-129 = "Как эта вредная еда."
3603-130 = "..."
3603-131 = "Или наоборот. Возможно, на нынешние тяжёлые времена мы потом оглянемся и даже посмеёмся."
3603-132 = "Мы с тобой и Сэей постоянно растём и меняемся!"
3603-133 = "Что ты пытаешься сказать, Мика?"
3603-134 = "Ты советуешь мне смириться с грузом ответственности? Намекаешь, что сегодняшние трудности окупятся завтрашними благами?"
3603-135 = "Какая поверхностная банальность."
3603-136 = "Ох, Наги, это было жёстко."
3603-137 = "Фуфу, действительно. И всё же истина порой бывает поверхностной. И избитой."
3603-138 = "Именно поэтому мы так часто принимаем её как должное."
3603-139 = "Так что позвольте мне сказать это, пока я не забыла..."
3603-141 = "Спасибо вам обеим. За всё."
3603-143 = "..."
3603-144 = "Хаха, тогда нам стоит чаще устраивать такие поездки!"
3603-145 = ""
3603-147 = ""
3603-148 = "Например, на частный пляж Чайная партия! Давайте в следующий раз туда!"
3603-149 = "...Хм, звучит приятно."
3603-150 = "Правда? Тогда это свидание, Наги!"
3603-151 = "Да. Давайте возвращаться..."
3603-152 = "...Домой."
3603-153 = "...И, хотя это для меня нехарактерно спонтанно, у нас случайно оказались эти высококачественные чайные листья, поэтому предлагаю заварить их и поделиться этими... любопытными закусками. Устроим чаепитие в Тринити."
3603-154 = ""
3603-156 = ""
3603-158 = ""
3603-159 = ""
3603-161 = "Кажется, сработало!"
3603-162 = "Ты права."
3603-163 = "Однако..."
3603-164 = "Ты хочешь сказать, что эффект временный, эфемерный, что-то в таком духе?"
3603-165 = "...Ты стала лучше чувствовать атмосферу, Мика."
3603-166 = "Ну, это же логично. Годы стресса не исчезнут после одной однодневной поездки."
3603-167 = "И уверена, к её возвращению работа уже снова накопится."
3603-168 = "Но ничто не остаётся идеальным навсегда, правда?"
3603-169 = "А если Наги снова начнёт стрессовать, мы просто вмешаемся и устроим ещё один отпуск."
3603-170 = "Я всё ещё считаю, что частный пляж — отличная идея!"
3603-171 = "...Череда временных решений. Как и всё остальное в жизни."
3603-172 = "Ага. Ничто не длится вечно, поэтому нам остаётся просто стараться изо всех сил, да?"
3603-173 = "Как сегодня."
3603-174 = "..."
3603-175 = "Почему вы так на меня смотрите?"
3603-176 = "Мика, ты сегодня непривычно добрая и мудрая. Это нервирует."
3603-177 = "А? Что, мне теперь нельзя взрослеть как личности?"
3603-178 = ""
3603-180 = ""
3603-181 = "Не торопись. Я прогрею скутер."
