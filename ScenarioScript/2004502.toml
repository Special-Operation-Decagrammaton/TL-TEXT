[translation]
2004502-1 = "Другая сторона Пины"
2004502-2 = "Я приехал в Хяккияко, чтобы встретиться с Пиной."
2004502-3 = ""
2004502-7 = "[ns] «Хм-м... это точно та дорога?»"
2004502-8 = ""
2004502-9 = "Спасибо! Благодаря вам я добралась!"
2004502-10 = "Девушка, не подскажете, где здесь магазин тканей...?"
2004502-11 = ""
2004502-12 = "[ns1] («Гид. Отлично!»)\n[ns2] «Извините! Кажется, я немного заблудился.»"
2004502-15 = "Я могу помочь! Куда..."
2004502-16 = ""
2004502-18 = ""
2004502-19 = ""
2004502-20 = "А! Сенсей!"
2004502-21 = "Я экскурсовод Пина! У вас прекрасный день?"
2004502-22 = "[s3] «Пина?!»\n[s4] «Экскурсовод?!»"
2004502-25 = "Именно! Всё верно!"
2004502-26 = "В торговом квартале такой хаос. Здесь нужен был гид, и я... оказалась свободна и решила помочь!"
2004502-27 = ""
2004502-29 = ""
2004502-30 = "А ещё я провожу экскурсии по торговому кварталу. Одна как раз скоро начнётся. Хотите присоединиться?"
2004502-31 = "[s] «Если ты не против, с удовольствием.»"
2004502-32 = "Да! Тогда отправляемся! Все, пожалуйста, следуйте за мной!"
2004502-34 = "С этой исторической смотровой площадки открывается непревзойдённый вид на Хяккияко!"
2004502-35 = "Вон там вы увидите Древо божеств — гордость Объединённой академии Хяккияко. Обязательно приходите на наш ежегодный ритуал!"
2004502-36 = "О-о... Как культурно!"
2004502-37 = "Девушка? Можно сфотографировать пейзаж?"
2004502-38 = "Конечно!"
2004502-39 = ""
2004502-41 = ""
2004502-45 = "На этой легендарной улице собраны знаменитые вкусы и очарование Хяккияко!"
2004502-46 = "Если не знаете, что заказать, просто спросите меня!"
2004502-47 = "Я всегда рада помочь!"
2004502-48 = "Какие чудесные ароматы!"
2004502-49 = "Ох, даже не знаю, с чего начать... и где сесть!"
2004502-50 = "О! Тогда советую вкусный куриный шашлычок — его удобно есть на ходу!"
2004502-52 = "А позади меня вас очарует гордость Хякки... яко..."
2004502-53 = "...А?"
2004502-54 = ""
2004502-56 = ""
2004502-57 = "Ч-Что...?"
2004502-58 = ""
2004502-60 = ""
2004502-61 = "О! Эм... Я его не вижу..."
2004502-62 = "[s] «Пина? Что случилось?»"
2004502-63 = "Он пропал! Что же мне..."
2004502-64 = "Так вся экскурсия будет испорчена!"
2004502-65 = "[s] «Что? Декорации для фильма? Их же разбирают...»"
2004502-66 = "Нет, дело не в этом..."
2004502-67 = "Щенок! Он должен быть здесь!"
2004502-68 = "[s] «...Щенок?»"
2004502-69 = "Он чудесный! Он одет как пёс-герой из «Шиба на ветру»! Он каждый день здесь спит..."
2004502-70 = "Это достопримечательность Хяккияко, которую нельзя пропустить!"
2004502-71 = "[s6] «Он... вообще-то может уйти. Он же щенок.»\n[s7] «Может, сегодня он пошёл куда-то ещё.»"
2004502-74 = "Точно! Он свободен передвигаться. Я поддерживаю автономию..."
2004502-75 = "Но он такой милый! Погодите, может, я смогу его найти..."
2004502-76 = "Девушка, а почему мы здесь?"
2004502-77 = "Простите? Щенков я и дома могу посмотреть!"
2004502-78 = ""
2004502-80 = ""
2004502-82 = "(Уф... О-Ой, всё плохо...)"
2004502-83 = "(Просто его наряд такой милый. Он маленький гангстер! Я ничего такого не имела в виду!)"
2004502-84 = "[ns] «Нет, эм! Вон там! Для чего эти картонные фигуры?»"
2004502-85 = "(А! Босс...!)"
2004502-86 = "Именно! Это кинодеревня Хяккияко. У неё тоже... богатая история..."
2004502-87 = ""
2004502-89 = ""
2004502-90 = ""
2004502-91 = "(Сенсей... Спасибо...!)"
2004502-93 = "Пина взяла себя в руки и закончила экскурсию на высокой ноте."
