[translation]
10058005-1 = "Prologue"
10058005-12 = "Eek... Eek-eek-eek..."
10058005-13 = "Welcome, everyone, to Kivotos's premier tank race, the Gehenna Cup—#nI bid you a heartfelt welcome."
10058005-14 = "I am Hanuma Makoto, President of the Pandemonium Society of Gehenna Academy."
10058005-15 = "Tanks are, after all, a familiar means of transportation for us."
10058005-16 = "We have taken that mundane, boring machine and elevated it into a nail-biting form of entertainment—the greatest tournament in Kivotos, the Gehenna Cup!"
10058005-17 = "There is only one rule.#nBombard the five targets scattered around the circuit and return. That is all."
10058005-18 = "Heh.#nI, Lord Makoto, devised this so that even those foolish members of the Prefect Team could understand.#nSimple and clear, isn't it?"
10058005-21 = "Um, Makoto-senpai."
10058005-22 = "Not now, Iroha! I'm in the middle of a speech!"
10058005-23 = "Sigh..."
10058005-24 = "Ahem."
10058005-25 = "It is no exaggeration to call the Gehenna Cup the greatest tournament in Kivotos.#nParticipants will be provided with everything, from lodging to meals throughout the event!"
10058005-26 = "You should be grateful for this generous hospitality that only Gehenna can provide!"
10058005-32 = "...With that, I conclude Millennium's foolish rambling."
10058005-33 = "Hmm. That introduces all the academies. Time to wrap things up."
10058005-34 = "Now... I hereby declare the Gehenna Cup open!"
10058005-39 = "What?!"
10058005-40 = "What is this reaction?! There should be thunderous applause right now!"
10058005-41 = "...Makoto-senpai."
10058005-42 = "I didn't even have a chance to interject, but for the past 30 minutes—"
10058005-46 = "The microphone wasn't turned on."
10058005-47 = "I tried to point it out, you see.#nBefore you told me to 'wait for later'."
10058005-48 = "W-What?!"
10058005-49 = "Then what happened to Lord Makoto's legendary, history-making speech?!"
10058005-52 = "Why are you suddenly shouting?!"
10058005-53 = "Ngh, is it finally starting~?#nSetting things up took way too long~"
10058005-54 = "Sigh... I wonder if this tournament will end safely."
