[translation]
10058005-1 = "Prologue"
10058005-12 = "Keke... Kekekeh..."
10058005-13 = "One and all, I sincerely welcome you— #nTo the pinnacle of tank racing in Kivotos! The Gehenna Cup!"
10058005-14 = "I am the chairman of Gehenna Academy's Pandemonium Society, #nthe great Hanuma Makoto."
10058005-15 = "Fundamentally, tanks are to us a familiar means of transportation."
10058005-16 = "But we have taken this plain and banal concept...#nand ascended it into a spectacle that will keep you at the edge of your seats! #nThis is essence of Kivotos' greatest tournament—this is the Gehenna Cup!"
10058005-17 = "There is only one rule. #nYou must shell the five targets located around the track and return to the start.#nThat is all."
10058005-18 = "Kekeh. The great Makoto has devised these rules such that even the fools of#nthe Prefect Team are able to comprehend them. #nPlain and simple, are they not?"
10058005-21 = "Um, Makoto-senpai."
10058005-22 = "Save it for later, Iroha! I am in the middle of a speech!"
10058005-23 = "*Sigh*..."
10058005-24 = "Ahem."
10058005-25 = "The Gehenna Cup can be regarded as the zenith of all tournaments in Kivotos. #nDuring its length, we shall provide everything our participants may need, from#nlodging to catering!"
10058005-26 = "Be grateful, for Gehenna is the only academy that can provide such generous#nhospitality."
10058005-32 = "...And with that, I conclude my remarks regarding the commoners from Millennium."
10058005-33 = "Hmph. Now that all of the schools have been introduced, shall we wrap things up?"
10058005-34 = "From here on out... I declare that the Gehenna Cup is now officially open!"
10058005-39 = "Hngh!?"
10058005-40 = "What is this reacton!? Where is the cheering and the applause!?"
10058005-41 = "...Makoto-senpai."
10058005-42 = "I couldn't find a time to bring it up... But for the past 30 minutes—"
10058005-46 = "Your mic hasn't been on."
10058005-47 = "I want you to know that I did try to let you know. #nHowever, you told me to \"save it for later.\""
10058005-48 = "H-How could this be!?"
10058005-49 = "Then what of the great Makoto's legendary speech!?#nThe one for the history books!?"
10058005-52 = "Why'd she suddenly start shouting!?"
10058005-53 = "Ngh, is it finally startin'? #nThey took waaay too long to set things up."
10058005-54 = "*Sigh*... Now I'm questioning just how smoothly this tournament will go."