10038055-16 = "[ns] «Кисаки!»"
10038055-17 = "Назад, Сенсей!"
10038055-18 = "Это слишком опасно. Она всё ещё двигается!"
10038055-19 = "...Что ты с собой сделала?"
10038055-20 = ""
10038055-22 = ""
10038055-24 = ""
10038055-25 = "А-а! ...Всего лишь вкусила плоды собственных трудов."
10038055-26 = "Тебе, наверное, трудно это понять: ты застряла в старых порядках и при этом вся полна сомнений."
10038055-27 = "Что... ты несёшь...?"
10038055-28 = ""
10038055-31 = ""
10038055-32 = "Ты ВСЁ ЕЩЁ сомневаешься, правда?"
10038055-33 = "Все эти ограничения на Променаде и Фестивале, твои решения насчёт Генрюмона и Клуба Пекинской Оперы."
10038055-34 = "Ты заявляешь, что защищаешь традиции и гордость Шаньхайцзина."
10038055-35 = ""
10038055-37 = ""
10038055-39 = "Но внутри думаешь совсем иначе."
10038055-41 = "*ахает*"
10038055-42 = "Кех-хе. Вижу, как ты отрицаешь. А за этим — недоумение: откуда я вообще могу знать, о чём ты думаешь."
10038055-43 = "Что за чушь ты несёшь, ты...?"
10038055-45 = "О, продолжай поддерживать этот образ, сколько сможешь. Но твои поступки показывают, за что ты на самом деле стоишь."
10038055-46 = "Вы, гордые стражи Генрюмона, прекрасно понимаете, о чём я. В глубине души вы уже всё осознали."
10038055-47 = ""
10038055-50 = ""
10038055-52 = ""
10038055-53 = ""
10038055-55 = "Вы видите маску, которую она носит. И знаете, что за ней скрывается другой человек. Не защитница традиций, какой она хочет казаться."
10038055-56 = ""
10038055-59 = ""
10038055-60 = "......"
10038055-61 = "Президент действительно...?"
10038055-62 = "Ты вообще о чём? Не слушай эту преступницу!"
10038055-63 = "Н-Но..."
10038055-64 = "..."
10038055-65 = ""
10038055-67 = ""
10038055-68 = "Кех-хе, ха-ха-ха-ха...!"
10038055-69 = "Клятву верности может произнести кто угодно. И сомневаться тоже может кто угодно."
10038055-70 = "Даже величайший правитель не способен управлять сердцами людей."
10038055-71 = "И запомните мои слова. Однажды вы все испытаете то же, что и я."
10038055-72 = "То есть?"
10038055-73 = "Вас изгонят из Шаньхайцзина. Вы познаете эту боль и этот стыд — как познала я."
10038055-74 = "Вы узнаете, как тяжело быть студентом без принадлежности к академии — как узнала я."
10038055-75 = "Вы узнаете пустоту скитаний без дома — как узнала я."
10038055-76 = "И всё потому, что..."
10038055-78 = "...ты сделала меня такой, Кисаки."
10038055-79 = ""
10038055-81 = ""
10038055-82 = "Я... написала?"
10038055-83 = ""
10038055-85 = ""
10038055-87 = ""
10038055-88 = "Да, ты. Никто иной."
10038055-89 = "Ты наполнила моё сердце ядом, обидой и жаждой мести. Каждая капля этого — твоя вина."
10038055-90 = "И в чём роль президента, если не в том, чтобы принимать вину на себя?"
10038055-91 = "*ахает*"
10038055-92 = "Правители древности брали на себя вину за всё. За бури, пожары, наводнения."
10038055-93 = "Вся ответственность — без единого оправдания. Вот что значит соответствовать своему положению, госпожа."
10038055-94 = "Это... Я...!"
10038055-95 = "Всё было ради Шаньхайцзина... Я поступила с тобой так, потому что студенты страдали..."
10038055-96 = "Значит, ты принесла небольшую жертву ради общего блага?"
10038055-97 = "*глубокий вдох*"
10038055-98 = "Да, именно так. Вот это выражение я и хотела увидеть. Уже ради одного этого стоило проделать весь путь сюда."
10038055-99 = "Смотрите внимательно, Генрюмон. Вот ваша президент. Бледная тень вашего славного прошлого."
10038055-100 = "Она не любит ваши традиции. Ей даже не нужна личная слава — это хотя бы можно было понять."
10038055-101 = "Она всего лишь глупый ребёнок, который не понимает, что значит занимать своё положение, и даже не знает, чего на самом деле хочет."
