[translation]
10046030-1 = "Эпизод 3;Шоссе по-моему"
10046030-4 = "Нагиса, просыпайся."
10046030-5 = "Мы приехали."
10046030-10 = "О? Сенсей? Вы пришли нас встретить?"
10046030-11 = "Если бы я знала, что вы ждёте, я бы не ехала так медленно."
10046030-12 = ""
10046030-15 = "Нагиса. Нагиса?"
10046030-16 = ""
10046030-19 = "...А, а. Мы уже приземлились?"
10046030-20 = "Ты, должно быть, уснула. Во сне летала?"
10046030-21 = "Я и БЛИЗКО не спала... хотя ты устроила достаточно тряски, чтобы показалось, будто мы летим на каком-то... чартерном самолёте."
10046030-22 = ""
10046030-28 = ""
10046030-29 = "Нагиса, все четыре колеса всё время были на дороге."
10046030-30 = ""
10046030-32 = ""
10046030-34 = ""
10046030-35 = "Сэя, я совершенно серьёзно настаиваю, чтобы ты возобновила уроки вождения."
10046030-36 = "Я соблюдала те правила, в которых был смысл, и скрупулёзно не превышала ограничение скорости."
10046030-37 = "Здесь вообще нет ограничения скорости!"
10046030-38 = ""
10046030-40 = ""
10046030-41 = "...А, Сенсей."
10046030-42 = "Мы только приехали, а уже выставляем себя в неловком свете. Прошу искренне меня простить."
10046030-43 = "Нагиса, ты в отпуске. Не нужно быть такой официальной."
10046030-44 = ""
10046030-46 = ""
10046030-47 = "...Сенсей? Что такое?"
10046030-48 = "Вы выглядите довольно... заворожённым. Что-то случилось?"
10046030-49 = "[s1] «Вы обе такие...»\n[s2] «...Выглядите готовыми повеселиться.»"
10046030-50 = ""
10046030-51 = ""
10046030-53 = ""
10046030-54 = "...? Разумеется. Мы И ПРИЕХАЛИ сюда развлекаться. Разве не в этом смысл отпуска?"
10046030-55 = "Это золотая возможность вырваться из рамок привычных нам образов. Было бы жаль её упустить."
10046030-56 = "Говори за себя, Сэя. По-моему, раньше я выглядела вполне уместно. Но остальные настояли..."
10046030-57 = "А-а. Цикл продолжается..."
10046030-58 = "Ты уже здесь, Нагиса. Так что можешь хотя бы попробовать получить удовольствие."
10046030-59 = ""
10046030-61 = ""
10046030-62 = ""
10046030-63 = "Прошу простить за вмешательство. Кажется, у одной из моих младших есть новости."
10046030-64 = ""
10046030-66 = ""
10046030-69 = ""
10046030-70 = "Алло? А, нет. Вы не ошиблись. Это Юризоно Сэя."
10046030-71 = "Да, Нагиса сегодня в отпуске... НЕТ, это не шутка. Отныне все рабочие звонки перенаправляйте мне."
10046030-72 = ""
10046030-74 = ""
10046030-75 = ""
10046030-76 = "Сэя...?"
10046030-77 = "Ты уже забыла своё обещание? Или вообще не собиралась его выполнять?"
10046030-78 = "Мы ясно договорились. Сегодня все официальные обязанности Чаепития будут переданы—"
10046030-79 = "...Сэя. Да, я помню обещание."
10046030-80 = "Но вот так отбирать мой телефон было довольно..."
10046030-81 = "Необходимо? Ты ведь не станешь с этим спорить?"
10046030-82 = ""
10046030-84 = ""
10046030-85 = "Ты здесь не просто для того, чтобы восстановиться физически. Это можно было сделать и на шезлонге в зимнем саду. Ты помнишь, зачем вообще понадобился этот отпуск?"
10046030-86 = "Чтобы освободить тебя от повседневных обязанностей и позволить полностью сосредоточить тело и разум на восстановлении. Мы все согласились, что это необходимо."
10046030-87 = "Или, по-твоему, я что-то неправильно поняла?"
10046030-88 = "...Нет. Ты права."
10046030-89 = "Тогда я конфискую твой телефон."
10046030-90 = "Только освободившись от оков постоянной связи, ты сможешь освободить разум от работы."
10046030-91 = "Это уже слишком драматично! Просто..."
10046030-92 = "К слову, мне, откровенно говоря, всё равно, какие решения ты принимаешь. Не я планировала этот отпуск, и мне он мало интересен."
10046030-93 = "Но интересно, так ли это для Мики..."
10046030-94 = "...!"
10046030-95 = ""
10046030-97 = ""
10046030-99 = "Мне любопытно, как отреагирует Мика, когда узнает, что ты... изначально не собиралась выполнять обещание."
10046030-100 = "Впрочем, с чисто интеллектуальной точки зрения твоё поведение весьма занимательно. Интересно, что ты выберешь?"
10046030-101 = "Ух...!"
10046030-102 = ""
10046030-104 = ""
10046030-105 = ""
10046030-106 = "Хорошо. На оставшееся время отпуска я доверю свой телефон тебе, Сэя."
10046030-107 = ""
10046030-109 = ""
10046030-110 = "Если честно, мне всё ещё трудно понять смысл всего этого представления."
10046030-111 = "Одной Мики уже более чем достаточно. Не нужно ещё и тебе меня донимать."
10046030-112 = ""
10046030-119 = ""
10046030-120 = "Удивительно, как хорошо нытьё действует на Нагису."
10046030-121 = "Что думаете, Сенсей? Я ведь довольно неплохо изобразила Мику, правда?"
10046030-122 = "[s3] «Ты изображала Мику?»\n[s4] «А... эм...»"
10046030-123 = ""
10046030-124 = ""
10046030-126 = ""
10046030-127 = "Какая прохладная реакция. А я столько сил вложила."
10046030-128 = "В следующий раз постараюсь лучше. Может, стоит вместо этого сосредоточиться на пародии на Нагису."
10046030-129 = "Сенсей, сегодня вас, возможно... Нет, совершенно точно ждёт особенная история."
10046030-130 = "Можно сказать... это своего рода пролог."
10046030-131 = ""
10046030-133 = ""
10046030-134 = "«Откуда у Золушки взялись мыши?»"
10046030-135 = "Да, это именно такая история."
10046030-136 = ""
10046030-138 = ""
10046030-139 = "...А, простите. Мне и правда не стоит всё усложнять."
10046030-140 = ""
10046030-142 = ""
10046030-144 = ""
10046030-145 = "Если выразиться проще..."
10046030-146 = "...Ничто иное, как..."
10046030-147 = ""
10046030-149 = ""
10046030-150 = ""
10046030-151 = "Нет, лучше позволить событиям разворачиваться самим."
10046030-152 = "[s5] «Я-я хочу знать!»\n[s6] «Сэя!»"
10046030-155 = "Хи-хи, спойлеров лучше избегать."
10046030-156 = "Поверьте, нет ничего скучнее, чем заранее знать главный поворот."
10046030-157 = "...А, я не хотела выражаться так туманно."
10046030-158 = "К тому же это такое клише, но я говорю искренне. Жизнь нужно проживать, а не просто... узнавать её спойлеры."
10046030-159 = "Похоже, у меня есть дурная привычка — желание увидеть всё собственными глазами."
10046030-160 = ""
10046030-162 = ""
10046030-163 = "...Почему вы так на меня смотрите?"
10046030-164 = "Думаете, я вовсе не намерена исправлять эту свою... дурную привычку?"
10046030-165 = "Хи-хи. Разумеется."
10046030-166 = "В конце концов, мои предчувствия сделали меня той, кто я есть."
10046030-167 = "Может, сама идея «исправить это» бессмысленна. Если однажды я изменюсь, полагаю, это должно произойти естественно."
10046030-168 = "Но сегодня я постараюсь воздержаться."
10046030-169 = "Эта эгоистичная, недальновидная нарушительница спокойствия вложила в этот отпуск немало сил."
10046030-170 = "И как такая же участница Чаепития..."
10046030-171 = "...Нет, как подруга... я поступила бы невежливо, если бы её не поддержала."
10046030-172 = ""
10046030-176 = "*грохот* *грохот*"
10046030-177 = ""
10046030-179 = ""
10046030-180 = "Что это было?"
10046030-181 = "Со стороны берега... Мне послышалось... будто там стройка?"
10046030-182 = "[s7] «А, точно...!»\n[s8] «(Материалы всё ещё на пляже!)»"
10046030-183 = ""
10046030-184 = ""
10046030-190 = ""
10046030-191 = "...Любопытно."
10046030-192 = "Что это?"
10046030-193 = "Не помню, чтобы я одобряла эти пристройки..."
10046030-194 = ""
10046030-196 = ""
10046030-197 = "Н-Наги?!"
10046030-198 = "Я-я могу объяснить!"
10046030-199 = "Не нужно."
10046030-200 = ""
10046030-202 = ""
10046030-203 = "(Что делать, что делать?)"
10046030-204 = "(Она задыхается в облаке дыма, а вокруг неё пиломатериалы!)"
10046030-205 = "(Она наверняка считает это подозрительным...)"
10046030-206 = ""
10046030-210 = ""
10046030-211 = ""
10046030-212 = "Мы не сможем наслаждаться отпуском, если на нас активно... нападают. Или что это вообще такое."
10046030-213 = "Давайте найдём более безопасное место."
10046030-214 = "Например... укреплённое убежище. Глубоко под землёй, где совершенно запрещено веселиться."
10046030-215 = ""
10046030-217 = ""
10046030-218 = "Н-Но... а как же наш отпуск?"
10046030-219 = ""
10046030-221 = ""
10046030-222 = "Разумеется, отменяется."
10046030-223 = ""
10046030-225 = ""
10046030-226 = ""
10046030-228 = "НЕЕЕЕЕТ!"
10046030-231 = ""
10046030-232 = "А! Ты меня напугала. Мика, что такое?"
10046030-233 = ""
10046030-235 = ""
10046030-236 = "Н-Нет! Наги! Это—!"
10046030-237 = "Полагаю, ответ мне уже известен. Как досадно."
10046030-238 = "Я могу объяснить!"
10046030-239 = "Как я уже сказала, не нужно."
10046030-240 = "Вместо объяснений, наверное, лучше просто не обращать на это внимания. Не стоит устраивать сцену."
10046030-241 = ""
10046030-243 = ""
10046030-244 = "...А?"
10046030-245 = "Ну, я предполагала, что такое может случиться. Пусть это и наш частный пляж, мы почти им не пользовались."
10046030-246 = "Даже если мы попросим их переселиться, справедливо сославшись на то, что это частная территория, было бы жаль выгонять людей из их домов."
10046030-247 = "...И всё же я поражена масштабом этой стройки. Интересно, планируется ли что-то ещё."
10046030-248 = "Эм... А?"
10046030-249 = "О, да! Раз уж ты упомянула, утром здесь были какие-то строители. Они... сказали, что не хотят неприятностей..."
10046030-250 = "Я собиралась тебе рассказать, но совсем забыла! ★"
10046030-251 = ""
10046030-253 = ""
10046030-254 = "А? Как можно забыть о таком?"
10046030-255 = "Ну, знаешь. Я просто так занята..."
10046030-256 = ""
10046030-258 = ""
10046030-259 = "В любом случае, давайте скорее обедать! Я голодная! Ну же, пошли, копуша!"
10046030-260 = ""
10046030-262 = ""
10046030-263 = ""
10046030-264 = "Мика... всё такая же."
10046030-265 = ""
10046030-272 = "..."
10046030-273 = "Она поверила...?"
10046030-274 = ""
10046030-276 = ""
10046030-277 = ""
10046030-278 = "Мика."
10046030-279 = ""
10046030-281 = ""
10046030-282 = "Сэя! Ты всё видела?"
10046030-283 = "Да, выглядело забавно. Ты неплохая актриса..."
10046030-284 = ""
10046030-286 = ""
10046030-287 = "...Наверное, именно так тебе и удалось обмануть Тринити."
10046030-288 = "Сэя?! Обязательно было это вспоминать?!"
10046030-289 = "Хи-хи, прости. Тебя просто так легко дразнить."
10046030-290 = "В любом случае, сегодняшняя Нагиса... идёт по плану."
10046030-291 = "Это случилось раньше, чем я ожидала, но неудивительно, учитывая, насколько Нагиса была занята в последнее время."
10046030-292 = "[s9] «Ты это предвидела?»\n[s10] «Ты знала, что Нагиса так отреагирует?»"
10046030-293 = ""
10046030-294 = ""
10046030-296 = ""
10046030-297 = "А, теперь вы обе нервничаете. Интересно."
10046030-298 = "Идеальная прелюдия..."
10046030-299 = ""
10046030-301 = ""
10046030-302 = "..."
10046030-303 = "Но увы, сегодня мы избегаем спойлеров."
10046030-304 = "Говоришь так высокомерно."
10046030-305 = "Мы занимаем высокие посты. Разумеется, хотя есть одна заноза, которая постоянно портит нашу репутацию..."
10046030-306 = "Какая же ты раздражающая!"
10046030-307 = "*вздох* Мне стоит держать себя в руках."
10046030-308 = "О?"
10046030-309 = "Мы всё ещё идём по расписанию, так что мне не стоит так заводиться."
10046030-310 = "У нас будет барбекю. Гриль уже разогрет, осталось дождаться доставки продуктов..."
10046030-311 = ""
10046030-313 = ""
10046030-314 = "...? Погоди, который час?"
10046030-315 = ""
10046030-317 = ""
10046030-318 = ""
10046030-319 = "12:40?"
10046030-320 = "В заказе было указано 12:30! Я совершенно чётко это обозначила!"
10046030-321 = "Ох... У меня плохое предчувствие..."
10046030-322 = ""
10046030-324 = ""
10046030-325 = "Н-Нет! Всё хорошо! Отлично!"
10046030-326 = "Всего десять минут. Это НАШ отпуск. Всё будет ЗАМЕЧАТЕЛЬНО."
10046030-334 = ""
10046030-335 = "Уже час дня..."
10046030-336 = "Простите, Сенсей. Я позвоню."
10046030-337 = ""
10046030-339 = ""
10046030-343 = ""
10046030-344 = "Эм, приветик! Это Мика, ДА, из Чаепития..."
10046030-345 = ""
10046030-351 = ""
10046030-352 = "А? Погодите..."
10046030-353 = "Я вас почти не слышу, говорите медленнее. Вы там что, на поле боя?"
10046030-354 = "На грузовик с доставкой... напали? Значит, вы гонитесь... ЗА КЕМ?!"
10046030-355 = "Простите, я не понимаю. Ещё раз."
10046030-356 = ""
10046030-360 = "Угу. Ага. Ага. Мои соболезнования."
10046030-361 = "Грузовик с МОИМ барбекю угнали? Что значит «он пропал»?"
10046030-362 = ""
10046030-364 = ""
10046030-365 = "Как такое вообще могло случиться?!"
10046030-366 = "Нет, ну серьёзно! Вы же не драгоценностями торгуете или... произведениями искусства!"
10046030-367 = "То есть да, я заказала САМЫЕ ЛУЧШИЕ продукты, но это всё равно барбекю! Весёлое девчачье барбекю на пляже, понимаете?!"
10046030-368 = ""
10046030-371 = "Эм, Мика? Я слышу твои вопли. Ты в порядке?"
10046030-372 = ""
10046030-374 = ""
10046030-375 = "В-Всё хорошо! Наги, просто расслабься! Отдохни!"
10046030-376 = "А... Привет, просто решила проверить, как вы там! Хасуми заметила, что уже довольно поздно, так что..."
10046030-377 = "И-Ичика?"
10046030-378 = "Ну... Это немного странно..."
10046030-383 = "Хм... Группа бандитов, жаждущих высококачественного мяса, угнала грузовик..."
10046030-384 = "Я могу назвать как минимум шестерых вероятных подозреваемых."
10046030-385 = "Правда?!"
10046030-386 = "Хаха... О да! Ты бы удивилась, какие преступления встречаются Оперативной группе Правосудия!"
10046030-387 = "Хм, ну, признаю, это серьёзная помеха. Мы так далеко от города, что просто заскочить в магазин, думаю, не получится..."
10046030-388 = "К счастью, у нас есть булочки и сосиски! Полагаю, придётся обойтись этим!"
10046030-389 = "Это... неприемлемо!"
10046030-390 = ""
10046030-392 = ""
10046030-393 = "Да?"
10046030-394 = "Я уже сказала Наги, что у нас будет барбекю! Изысканное, восхитительное, первоклассное барбекю!"
10046030-395 = "И если она не увидит обещанного, то... ОТМЕНИТ отпуск!"
10046030-396 = "Я знаю, Нагиса бывает педантичной, но... ты ведь шутишь, правда?"
10046030-397 = "Только подумай! Наги узнает, что кто-то украл продукты, потом поймёт, что было совершено преступление против Чаепития..."
10046030-398 = "...А. Теперь, когда ты сказала, она и правда может слишком остро отреагировать."
10046030-399 = "Именно. Теперь понимаешь, почему я ОБЯЗАНА спасти это барбекю. Но... как?"
10046030-400 = ""
10046030-402 = ""
10046030-404 = "[ns11] «...Кажется, я знаю кое-кого.»\n[ns12] «Я не хотел, чтобы до этого дошло...»"
10046030-405 = ""
10046030-406 = ""
10046030-408 = ""
10046030-409 = "[ns] «Я ОЧЕНЬ не хотел, чтобы до этого дошло!»"
10046030-410 = "С-Сенсей?! Вы в порядке?"
10046030-411 = "Хм... Не знаю, что происходит, но вы выглядите очень обеспокоенным. И вспотели."
10046030-412 = "Я не хочу, чтобы вы страдали. Не волнуйтесь. Я что-нибудь придумаю."
10046030-413 = "О? Ты и правда обо мне беспокоишься...?"
10046030-414 = ""
10046030-416 = ""
10046030-417 = ""
10046030-418 = "...В таком случае я с радостью приму вашу помощь."
10046030-419 = "Что бы вы ни задумали, я готова! Мы ещё исправим этот день!"
10046030-423 = "...Понятно. Я осознаю всю серьёзность ситуации."
10046030-429 = ""
10046030-430 = ""
10046030-432 = ""
10046030-433 = ""
10046030-435 = "Ох-ох, прийти к нам в погоне за изысканной едой."
10046030-436 = ""
10046030-438 = ""
10046030-439 = ""
10046030-440 = "Вы обратились к нужным людям, хи-хи-хи."
