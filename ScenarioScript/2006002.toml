[translation]
2006002-1 = "Resting with Ibuki!"
2006002-2 = "Under the beach umbrella"
2006002-5 = "(Although I promised Ibuki a summer vacation...)"
2006002-6 = "(...I pushed myself too hard to make the schedule work, and by the time we reached the beach, I was completely exhausted.)"
2006002-10 = "Yaaawn..."
2006002-11 = "Ibuki is so sleepy..."
2006002-12 = "(Perhaps my fatigue rubbed off on her, as Ibuki also looks completely wiped out.)"
2006002-13 = "I don't have any energy left at all..."
2006002-14 = "[s] \"Me too, Ibuki...\""
2006002-15 = "Hehe... just like me, Sensei."
2006002-16 = "But, playing with Sensei..."
2006002-17 = "We promised... so..."
2006002-18 = "..."
2006002-20 = "...Zzz."
2006002-21 = "[s] \"It's okay for you to rest, Ibuki.\""
2006002-22 = "(After confirming that Ibuki is fast asleep...)"
2006002-23 = "[ns] \"I'll just close my eyes for a bit...\""
2006002-24 = "(...And I fell asleep right there.)"
2006002-25 = "(...I suddenly wake up.)"
2006002-29 = "[ns] \"...Nn, is it hot?\""
2006002-32 = "(Perhaps time has passed... the umbrella's shadow has shifted, and the sunlight is burning my skin.)"
2006002-33 = "[ns] \"I need to make sure Ibuki isn't too hot...\""
2006002-34 = "(I adjust the umbrella's shadow.)"
2006002-35 = "[ns1] \"That should do it.\"\n[ns2] \"...Just going to close my eyes for a little longer.\""
2006002-39 = "(A while later...)"
2006002-41 = "[ns] \"...Hah! The sun is hitting us again!\""
2006002-43 = "(I move the umbrella again. Ibuki is still fast asleep.)"
2006002-48 = "(A while later...)"
2006002-52 = "[ns] \"Huh...? A call from Ibuki...?\""
2006002-55 = "(I wake up and look to my side.)"
2006002-56 = "(Ibuki, who should have been sleeping, is gone.)"
2006002-60 = "[ns] \"Ibuki...!?\""
2006002-62 = "(Feeling worried, I answer the phone.)"
2006002-66 = "Sensei, Sensei!"
2006002-67 = "[s] \"Thank goodness...! Are you okay?\""
2006002-68 = "What are you talking about?#nGuess what, Sensei! I found an amazing spot!"
2006002-69 = "Look at the ocean, then head straight to the right!"
2006002-70 = "I'll be waiting!"
2006002-74 = "[ns] \"...I'd better go check it out.\""
2006002-76 = "(Relieved that Ibuki is safe, I head to the location she mentioned.)"
2006002-83 = "[ns] \"I came where you said, but...\""
2006002-84 = "Sensei!"
2006002-85 = "(Suddenly, I hear Ibuki's voice from above.)"
2006002-86 = "[ns] I look up."
2006002-89 = "[wa:500]― [log=이부키 수영복]Sensei![wa:950] Over here, over here~![/log]"
2006002-90 = "[wa:2860]― [log=이부키 수영복]It's [wa:560]so [wa:610]cool here![/log]"
2006002-93 = "[wa:670]― [log=이부키 수영복]No matter how strong the sun is—[/log]"
2006002-94 = "[wa:3180]― [log=이부키 수영복]Up here... [wa:1080]see, [wa:950]it's not hot at all~![/log]"
2006002-97 = "[wa:500]― [log=이부키 수영복]So! [wa:930]From here—[/log]"
2006002-98 = "[wa:1880]― [log=이부키 수영복]You don't have to [wa:630]keep moving the umbrella anymore, [wa:2100]Sensei.[/log]"
2006002-101 = "[ns] \"...You noticed?\""
2006002-103 = "[wa:2000]― [log=이부키 수영복]...[wa:1010]Yeah. [wa:1090]Actually, [wa:830]I was [wa:710]watching you.[/log]"
2006002-104 = "[wa:2150]― [log=이부키 수영복]Watching you heave, [wa:1490]heave, [wa:890]moving that umbrella around...[/log]"
2006002-107 = "[wa:670]― [log=이부키 수영복]But [wa:860]it's okay here![/log]"
2006002-108 = "[wa:2910]― [log=이부키 수영복]Let's rest [wa:1330]nice and [wa:470]slowly together![/log]"
2006002-111 = "I found this place, so I wanted you to come quickly!"
2006002-112 = "If I look from up high, I can even tell you if you get lost! Hehe!"
2006002-113 = "Hey, hey, Sensei."
2006002-114 = "Um..."
2006002-115 = "...I can't get down."
2006002-116 = "[s] \"Come here to me.\""
2006002-118 = "(I helped Ibuki down from the tree, and we decided to rest together in the shade.)"
2006002-119 = "(We later moved after hearing that coconuts might fall on us, but...)"
2006002-120 = "(The time I spent with Ibuki was truly peaceful.)"