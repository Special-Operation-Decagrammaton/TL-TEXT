[translation]
2006002-1 = "Отдыхаем с Ибуки!"
2006002-2 = "Под пляжным зонтом"
2006002-5 = "Обещать Ибуки свозить её на летние каникулы было замечательной идеей..."
2006002-6 = "...Но я слишком себя загнал. Хотя к приезду на пляж уже выбился из сил, я всё равно намеревался придерживаться расписания."
2006002-7 = ""
2006002-9 = ""
2006002-10 = "*Зевок*..."
2006002-11 = "Ибуки хочет спать..."
2006002-12 = "Возможно, она заразилась моей усталостью, но Ибуки тоже выглядела сонной."
2006002-13 = "Сенсей... Ибуки... устала..."
2006002-14 = "[s] «Сенсей тоже...»"
2006002-15 = "Хи-хи... Как Ибуки..."
2006002-16 = "Ибуки обещала поиграть с..."
2006002-17 = "Сен...сеем..."
2006002-18 = "Хр-р..."
2006002-20 = "Хр-р..."
2006002-21 = "[s] «Да, пожалуй, лучше немного вздремнуть...»"
2006002-22 = "Я убедился, что Ибуки крепко спит."
2006002-23 = "[ns] «...Пожалуй, я тоже отдохну»."
2006002-24 = "И я уснул рядом с Ибуки."
2006002-25 = "Однако..."
2006002-26 = ""
2006002-29 = "[ns] «...Почему так жарко?»"
2006002-32 = "Солнце переместилось, и из-за зонта выглянули обжигающие лучи."
2006002-33 = "[ns] «Надо позаботиться, чтобы Ибуки не перегрелась...»"
2006002-34 = "Я передвинул зонт и поправил угол тени."
2006002-35 = "[ns1] «Вот так».\n[ns2] «А теперь можно снова поспать...»"
2006002-39 = "Но вскоре..."
2006002-41 = "[ns] «...Ай, горячо»."
2006002-43 = "Я снова поправил зонт и вернулся ко сну."
2006002-44 = ""
2006002-48 = "А ещё немного погодя..."
2006002-49 = ""
2006002-52 = "[ns] «М-м? Ибуки меня зовёт?»"
2006002-55 = "Я огляделся и понял, что её больше нет рядом."
2006002-56 = "Более того, Ибуки вообще нигде не было видно."
2006002-57 = ""
2006002-60 = "[ns] «Ибуки...?»"
2006002-62 = "Заволновавшись, я быстро ответил на звонок."
2006002-63 = ""
2006002-65 = ""
2006002-66 = "Сенсей! Сенсей!"
2006002-67 = "[s] «Господи...! Где ты?»"
2006002-68 = "Ибуки нашла очень классное место!"
2006002-69 = "Повернитесь лицом к морю, идите направо и всё время прямо!"
2006002-70 = "Скорее, Сенсей! Ибуки хочет вас увидеть!"
2006002-71 = ""
2006002-73 = ""
2006002-74 = "[ns] «...Надо идти»."
2006002-76 = "Облегчённо вздохнув, я направился туда, куда указала Ибуки."
2006002-83 = "[ns] «Это должно быть где-то здесь...»"
2006002-84 = "Сенсей!"
2006002-85 = "Внезапно голос Ибуки раздался откуда-то сверху."
2006002-86 = "[ns] Посмотреть вверх."
2006002-89 = "― [log=이부키 수영복]Сенсей! Я здесь! [/log][wa:1130]"
2006002-90 = "― [log=이부키 수영복]В этом лесу та-а-ак прохладно![/log][wa:3350]"
2006002-93 = "― [log=이부키 수영복]Как бы ярко ни светило солнце...[/log][wa:30]"
2006002-94 = "― [log=이부키 수영복]Смотрите... Деревья всё закрывают![/log][wa:4690]"
2006002-97 = "― [log=이부키 수영복]Поэтому здесь...[/log][wa:990]"
2006002-98 = "― [log=이부키 수영복]Вам не придётся двигать зонт, Сенсей![/log][wa:3770]"
2006002-101 = "[ns] «...Ты заметила, что я его передвигал?»"
2006002-103 = "― [log=이부키 수영복]...Да. Ибуки всё видела.[/log][wa:5080]"
2006002-104 = "― [log=이부키 수영복]Сенсей всё время двигал зонт, пыхтя от усилий...[/log][wa:3530]"
2006002-107 = "― [log=이부키 수영복]А здесь вам больше не придётся этого делать![/log][wa:610]"
2006002-108 = "― [log=이부키 수영복]Можно просто хорошенько отдохнуть вместе с Ибуки![/log][wa:3550]"
2006002-110 = ""
2006002-111 = "М? Зачем Ибуки забралась на дерево?"
2006002-112 = "Потому что с высоты Ибуки быстрее заметит, когда придёт Сенсей!"
2006002-113 = "Кстати, Сенсей."
2006002-114 = "Эм..."
2006002-115 = "А как... Ибуки теперь слезть?"
2006002-116 = "[s] «Давай, держись за меня»."
2006002-118 = "Я помог Ибуки спуститься, и мы снова устроились отдохнуть в тени."
2006002-119 = "Правда, вскоре пришлось уйти: смотритель парка предупредил нас, что с пальм могут падать кокосы."
2006002-120 = "Но всё же это был самый безмятежный отдых за всё лето."
