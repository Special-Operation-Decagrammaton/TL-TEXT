200001-13 = "A autoridade ruiu, a ordem virou pó――"
200001-14 = "A ilusão se desfez sem deixar vestígios, e aquele poder fictício foi todo devolvido pra sociedade."
200001-15 = "A essa altura, não adianta mais gritar a plenos pulmões... não sobrou ninguém pra olhar pra trás."
200001-16 = "Como foi que \"nós\" fomos parar num desfecho desses?"
