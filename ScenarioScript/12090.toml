[translation]
12090-1 = "Эпизод 9;ЧВК Кайзер 1"
12090-2 = "Ух, к-кто эти ребята?!"
12090-3 = "Они не такие сильные, но ужасно неприятные... больше всего, с чем я сталкивалась раньше."
12090-4 = "У-Ух... Может, даже хуже Префектурной команды..."
12090-5 = "Кто они вообще? И что здесь делают?"
12090-6 = "Я нашла эмблему объекта!"
12090-8 = "Это..."
12090-9 = "Секунду, проверяю..."
12090-10 = "Есть. Название организации..."
12090-11 = "ЧВК «Кайзер»..."
12090-13 = "Да, точно. Они называются ЧВК Кайзер."
12090-14 = "К-Кайзер...? То есть эти тоже связаны с корпорацией Кайзер?"
12090-15 = "Да. В открытых списках их нет, но это дочерняя структура корпорации Кайзер..."
12090-16 = "Ух, это уже смешно! Кайзер тут, Кайзер там — куда ни глянь! Что им вообще нужно?!"
12090-18 = "Но PMC означает..."
12090-19 = "Что такое?"
12090-20 = "Private Military Company — частная военная компания..."
12090-21 = "Частная военная...?!"
12090-22 = "..."
12090-23 = "Они не такие, как громилы из Банды шлемов. Они очень организованы... прямо как армия!"
12090-24 = "...!"
12090-25 = "А-Армия? Т-То есть они не студенты?!"
12090-26 = "Ходили слухи о компании, которая вербует бросивших учёбу, исключённых и проблемных учеников в частную армию... Неужели это..."
12090-28 = "*дзззззззззынь*!"
12090-30 = "С-Сигнал тревоги?!"
12090-31 = "Он со всех сторон... Дело плохо..."
12090-33 = "Слышите... вертолёты?"
12090-34 = "А этот грохот, должно быть... танки."
12090-35 = "К вам приближается огромная армия! Они пытаются вас окружить!"
12090-36 = "Танки, бронемашины и даже вертолёты...! Они бросили сюда всё!"
12090-37 = "Все, это опасно! Отступайте, пока вас не окружили! Нужно прорвать кольцо и уйти!"
12090-38 = "Сенсей! Ждём приказов!"
