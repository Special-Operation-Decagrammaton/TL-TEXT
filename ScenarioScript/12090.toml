[translation]
12090-1 = "Episódio 9;Kaiser PMC (1)"
12090-2 = "Uhe~, afinal, quem são esses caras?"
12090-3 = "Eles nem são tão fortes assim, mas atrapalham, sabe, são meio chatos... Sei lá, de todos que já enfrentamos, esses parecem especialmente \"problemáticos\"."
12090-4 = "Nn, se bobear, são mais chatos que o Comitê Disciplinar..."
12090-5 = "Quem será que são essas pessoas... E o que será que estão fazendo num lugar como este?"
12090-6 = "Encontrei algum tipo de emblema na instalação!"
12090-8 = "Isso é..."
12090-9 = "Um momento, por favor, estou verificando agora..."
12090-10 = "...Confirmado. Esse emblema, esse grupo é..."
12090-11 = "...Kaiser PMC."
12090-13 = "Ah!? ...Sim. Exatamente como a Hoshino-senpai disse, é a Kaiser PMC."
12090-14 = "Kaiser...? Quer dizer que esses caras também são da Kaiser Corporation!?"
12090-15 = "Sim, é uma subsidiária da Kaiser Corporation..."
12090-16 = "Onde quer que a gente vá é Kaiser, Kaiser, Kaiser! O que diabos está acontecendo!?"
12090-18 = "E além disso, se é \"PMC\", isso significa que..."
12090-19 = "Eh, é alguma coisa ruim?"
12090-20 = "PMC significa Empresa Militar Privada..."
12090-21 = "M-Militar...!?"
12090-22 = "..."
12090-23 = "Eles estão em outro nível comparado a arruaceiros como a Gangue dos Capacetes. São profissionais realmente organizados... Literalmente, como um exército!"
12090-24 = "...!"
12090-25 = "Um exército!?"
12090-26 = "Havia rumores de que empresas estavam reunindo alunas expulsas e delinquentes para contratá-las como soldados particulares, mas não imaginei que..."
12090-28 = "(UIIIIIIIIIIN!!)"
12090-30 = "U-Um alarme...!?"
12090-31 = "Tenho o pressentimento de que isso vai virar um baita problemão..."
12090-33 = "Isso é... som de helicóptero...?"
12090-34 = "E esse tremor no chão... Provavelmente tanques."
12090-35 = "Uma força militar em larga escala está se aproximando! Estão vindo para nos cercar!"
12090-36 = "Exatamente como disseram, além de veículos blindados, há até tanques e helicópteros...! É um número absurdo!"
12090-37 = "Recuem antes que completem o cerco! Primeiro, saiam daí o mais rápido possível...!"
12090-38 = "Sensei, suas ordens, por favor!"
