901010600110-17 = "A FOX4 já tá roncando aqui no posto dela. Dá pra ouvir o sono pesado até sem rádio."
901010600110-18 = "Vou prestar suporte de longo alcance à FOX2 vigiando o perímetro como na última vez."
901010600110-20 = "Aham, afinando a audição babando na luneta do fuzil, né? Que feio."
901010600110-21 = "Tô bem acordada, tá bom?! Não tem uma alma viva que escape do meu raio de visão!"
901010600110-22 = "A maioria do pessoal do porto não parece envolvida no boato, mas pode haver pontas soltas. Investiguem minuciosamente."
901010600110-24 = "A partir de agora, FOX2 inicia a aproximação tática."
901010600110-27 = "A propósito, FOX1, encontrou alguma evidência nova na sua investigação de ontem?"
901010600110-28 = "Investigação de ontem...?"
901010600110-29 = "Sim. Você disse que tinha algo para investigar e saiu à tarde, lembra?"
901010600110-30 = "Achei que tivesse ido atrás do Caranguejo de Tambor de Óleo... Não foi isso?"
901010600110-31 = "Ah... você se refere a ontem."
901010600110-32 = "Não foi nada de mais. Apenas um assunto de cunho estritamente pessoal."
901010600110-34 = "Huuuum... Assunto pessoal, né?"
901010600110-35 = "...Algum problema, FOX3?"
901010600110-36 = "Nenhum? Só achei curioso, porque nunca vi a FOX1 sair para um \"assunto pessoal de verdade\" na vida."
901010600110-37 = "Será que alguém andou amolecendo o coração?"
901010600110-38 = "A Yukino começou a mudar depois que o Sensei da [USERNAME] apareceu—"
901010600110-39 = "—Chega de conversa fiada fora do protocolo da missão."
901010600110-40 = "Pois bem, FOX2. Conto com você."
901010600110-41 = "Hihi, então vamos dar início aos trabalhos!"
