[translation]
901010600110-6 = ""
901010600110-7 = "FOX 2, докладываю. Только что вошла в точку Альфа."
901010600110-8 = ""
901010600110-10 = ""
901010600110-11 = "Принято. Запрашиваю доклады от остальных членов отряда."
901010600110-12 = ""
901010600110-14 = ""
901010600110-16 = ""
901010600110-17 = "FOX 3 и FOX 4 находятся в точке Сьерра."
901010600110-18 = "Я веду наблюдение и буду дистанционно поддерживать FOX 2, как в прошлый раз."
901010600110-20 = "...Принято."
901010600110-21 = "Цель сегодняшней миссии — выяснить местонахождение субъекта Миягучи, пропавшего рыбака. В прошлый раз нам не удалось узнать о нём ничего полезного."
901010600110-22 = "В прошлый раз большинство связанных с портом людей выглядели равнодушными к слухам о крабах в бочках. Сегодня внимательно смотрите по сторонам. Мы могли что-то упустить."
901010600110-24 = "Есть!"
901010600110-27 = "Кстати, FOX 1. Узнала что-нибудь новое во время своего личного расследования вчера?"
901010600110-28 = "Моего расследования...?"
901010600110-29 = "Ага. Ты днём куда-то уходила, потому что хотела что-то проверить."
901010600110-30 = "Я решила, что это связано с миссией, но могу ошибаться... Я не права?"
901010600110-31 = "А... Точно, вчера."
901010600110-32 = "Ничего особенного. Исключительно личное дело."
901010600110-34 = "О-о-о... Личное дело."
901010600110-35 = "...Проблема, FOX 3?"
901010600110-36 = "Вовсе нет. Просто я никогда раньше не слышала, чтобы тебя волновали личные дела. Да ещё в выходной...?"
901010600110-37 = "Есть причина для такой перемены?"
901010600110-38 = "Может, Юкино изменилась, потому что за ней наблюдает Сенсей [USERNAME]..."
901010600110-39 = "...Хватит пустой болтовни. Сосредоточьтесь на миссии."
901010600110-40 = "Дальше на тебе, FOX 2."
901010600110-41 = "Фуфу. Тогда начинаю!"
