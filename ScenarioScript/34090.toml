[translation]
34090-1 = "Эпизод 9;В район Ариуса, часть 1"
34090-3 = "[ns] «Девяносто минут до чего?»"
34090-4 = "Чтобы попасть в район Ариуса, нужно пройти через подземные катакомбы."
34090-5 = "До сих пор обнаружили около 300 входов в катакомбы. Но настоящие среди них лишь некоторые."
34090-6 = "Если выбрать неправильный, будешь блуждать там, пока не умрёшь от голода."
34090-7 = "Поэтому мы получали и расшифровывали код внутреннего маршрута от настоящего входа через катакомбы к району Ариуса."
34090-8 = "Дело в том, что внутри катакомб периодически всё меняется."
34090-9 = "[s] «Сами тоннели двигаются?»"
34090-10 = "Можно сказать и так. Раньше открытые пути внезапно перекрываются. Там легко потерять направление."
34090-11 = "Я не понимаю, как устроена эта структура, но по сути это постоянно меняющийся лабиринт."
34090-12 = ""
34090-14 = ""
34090-16 = "Поскольку настоящий вход постоянно меняется, без подсказки мы его не найдём."
34090-17 = "Беглой гончей никто не станет показывать дорогу домой."
34090-18 = "Н-Но мы выяснили один действующий вход. Это наш билет внутрь."
34090-19 = "Сегодня в полночь он изменится, отсюда и девяносто минут."
34090-20 = "Если он закроется, вернуться в Ариус мы уже не сможем."
34090-21 = "Даже если найдём другой путь, к Химэ всё равно не успеем."
34090-22 = "Нам нужно спешить..."
34090-23 = ""
34090-26 = "?!"
34090-27 = "Это отряд!"
34090-28 = "Я так и знала! Они здесь! Готовьтесь к бою!"
34090-29 = "...Они, должно быть, думали о том же."
34090-30 = "Начинаем атаку."
34090-31 = "Ох, жизнь и правда сплошное страдание."
34090-32 = "...Хлопотно."
34090-34 = "Покажем им, насколько остры наши клыки!"
