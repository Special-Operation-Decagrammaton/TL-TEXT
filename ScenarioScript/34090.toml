[translation]
34090-1 = "Episódio 9;Rumo ao Distrito Autônomo de Arius (1)"
34090-3 = "[ns] \"O que vocês quiseram dizer agora há pouco com \"mais 90 minutos\"?\""
34090-4 = "Para ir ao Distrito Autônomo de Arius, precisamos passar pelas Catacumbas no subterrâneo de Trinity."
34090-5 = "Só das entradas conhecidas das Catacumbas, existem cerca de 300. Entre elas, as \"entradas verdadeiras\" são poucas, e todas as outras são falsas."
34090-6 = "Se errar a entrada, você acaba vagando perdida pelas Catacumbas sem fim."
34090-7 = "Por isso, recebemos por código a entrada correta e a rota interna das Catacumbas que leva até o Distrito Autônomo de Arius."
34090-8 = "...Porque o interior das Catacumbas muda em ciclos regulares."
34090-9 = "[s] \"O interior muda...?\""
34090-10 = "Isso. O caminho pelo qual passamos da última vez vira um beco sem saída... ou então perdemos o senso de direção... coisas desse tipo."
34090-11 = "Não sei qual é o mecanismo por trás disso, mas... as Catacumbas são um labirinto cuja extensão total ainda é desconhecida. Cada vez que você pisa lá dentro, a rota e a entrada mudam."
34090-16 = "Na nossa situação atual, não sabemos qual é a entrada correta... porque já não nos passam mais o código."
34090-17 = "Afinal, não há necessidade de ensinar o caminho de casa para cães de caça que fugiram."
34090-18 = "M-Mas... ainda resta uma única entrada que podemos usar."
34090-19 = "E mesmo essa só pode ser usada até a virada de hoje. Daqui a uma hora, ela também vai se fechar... E se isso acontecer..."
34090-20 = "Não poderemos mais voltar ao Distrito Autônomo de Arius."
34090-21 = "E mesmo que demos um jeito de voltar, não chegaremos a tempo de salvar a Atsuko."
34090-22 = "Por isso precisamos nos apressar..."
34090-26 = "!?"
34090-27 = "É o \"Esquadrão\"!"
34090-28 = "Sabia que viriam para cá! Todas as unidades, preparar para o combate!"
34090-29 = "...Parece que elas tiveram a mesma ideia que a gente."
34090-30 = "Preparar para o combate."
34090-31 = "S-Sim!"
34090-32 = "...Bom, já era de se esperar."
34090-34 = "Pois bem... vamos mostrar a elas o orgulho de cães de caça feridos."
