103160-13 = "Результаты моделирования выглядят хорошо. Этого должно хватить, чтобы уничтожить Ковчег Атрахасис."
103160-14 = "Пора бабахнуть! Обломки посыплются на Кивотос, как фейерверк!"
103160-16 = "Все приготовления завершены. Сообщите мне, когда будете готовы к эвакуации."
