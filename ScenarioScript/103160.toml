103160-153 = "..."
103160-160 = "С-Сэя! Мика!"
103160-161 = "Ты опоздала, Наги. Сэя уже ушла."
103160-162 = "...Что?"
103160-163 = "Она сказала, что у неё дурное предчувствие, и решила подготовиться на всякий случай."
103160-164 = "Она велела нам разобраться со всем, что возникнет в её отсутствие. Думаю, это как раз тот случай."
103160-165 = "Понятно. Тогда нам нужно немедленно мобилизоваться."
103160-166 = "Я начну прямо сейчас."
103160-167 = "В конце концов, мы не можем подвести Сенсея! Если мы здесь не удержим ситуацию, он разочаруется!"
103160-168 = "Переживать будем после того, как кризис закончится!"
103160-170 = "О-о нет! Ох! Н-Небо!"
103160-171 = "Хиёри, только не начинай."
103160-172 = "Что? Что я такого сказала, Мисаки? У тебя обо мне настолько плохое впечатление? Я порчу всем настроение? Своей паникой делаю только хуже, да? Я понимаю, почему могу так выглядеть, но...!"
103160-174 = "...Нужно двигаться."
103160-175 = "Согласна. Что бы ни происходило, мы не перестанем пытаться."
103160-177 = "Да! Идём!"
103160-178 = "...Верно. Мы должны сделать всё, что можем."
103160-180 = "Противник захватил Утнапиштим..."
103160-181 = "Я прямо сейчас отслеживаю источник сигнала!"
103160-182 = "Подтверждено. Он в центре четвёртой зоны Ковчега Атрахасис."
103160-183 = "У этого места слишком длинное название!"
103160-184 = "Центр управления многомерным аналитическим двигателем, Трон Нарам-Сина..."
103160-185 = "Именно оттуда взламывают Утнапиштим! Мы должны их остановить!"
103160-187 = "Все целы?"
103160-188 = "Ух... Я в порядке. Не ранена, но..."
103160-189 = "Это... то, о чём я думаю?"
103160-190 = "..."
103160-191 = "Понятно... Широко перехватывала нас, чтобы..."
103160-192 = "...Тянуть время? Она просто задерживала нас?"
103160-193 = "Э-Это значит..."
103160-195 = "Операция провалится... Всё, что мы делали... Все усилия остальных..."
103160-196 = "Нет. Ещё не всё потеряно."
103160-197 = "С-Широко?"
103160-199 = "[ns] «Отряхнитесь. Сдаваться ещё рано.»"
103160-200 = "Д-Даже Сенсей? Г-Где вы?"
103160-209 = "Мы в порядке. Мы с Сенсеем направляемся к месту, откуда взламывают Утнапиштим, — в центр четвёртой зоны."
103160-211 = "Что?!"
103160-212 = "[s] «Мы с Широко так или иначе остановим взлом. А вы разберитесь со всем остальным.»"
