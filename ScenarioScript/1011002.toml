[translation]
1011002-1 = "Злоупотребление властью"
1011002-2 = "Как и просила Сейя, я прибыл в Тринити в тихое время дня."
1011002-3 = ""
1011002-8 = "[ns1] «(...? Её здесь нет?)»\n[ns2] «(Я пришёл не туда?)»"
1011002-12 = "Дверь не была заперта. Более того, она была слегка приоткрыта."
1011002-13 = ""
1011002-17 = "[ns3] «Это...»\n[ns4] «...? Сейя? Ты здесь?»"
1011002-20 = "...М-м..."
1011002-21 = "М-м..."
1011002-22 = ""
1011002-25 = "...О."
1011002-26 = "Сенсей..."
1011002-29 = "― [log=세이아]...Я не знала, что вы уже здесь.[/log][wa:570]"
1011002-30 = "― [log=세이아]Может, по мне и не видно, но уверяю вас: я весьма удивлена.[/log][wa:5300]"
1011002-33 = "[ns5] «Прости, что вошёл без разрешения.»\n[ns6] «Прости, я не хотел тебя напугать.»"
1011002-36 = "― [log=세이아]О, не поймите неправильно. Сюрпризы могут быть прекрасны.[/log][wa:5670]"
1011002-37 = "― [log=세이아]Даже то, чего ожидаешь, может оказаться сюрпризом, когда наконец происходит.[/log][wa:3770]"
1011002-40 = "― [log=세이아]...Например...[/log][wa:1690]"
1011002-41 = "― [log=세이아]Например, когда вы, Сенсей, внезапно появляетесь передо мной...[/log][wa:4760]"
1011002-44 = "― [log=세이아]Посмотрим. Сегодня было...[/log][wa:2260]"
1011002-45 = "― [log=세이아]Ах да.[/log][wa:4840]"
1011002-48 = "― [log=세이아]Вы пришли из-за моей просьбы.[/log][wa:1230]"
1011002-51 = "― [log=세이아]...За это прошу прощения. Никакого особого повода нет.[/log][wa:2360]"
1011002-54 = "― [log=세이아]Я просто...[/log][wa:160]"
1011002-55 = "― [log=세이아]...Я... просто хотела поговорить с вами. Вот и всё.[/log][wa:8430]"
1011002-57 = ""
1011002-58 = "Возможно, моё упрямство доставило вам неудобства."
1011002-59 = "Хотя, пожалуй, уже поздно это говорить. Хи-хи."
1011002-60 = "...А, значит, вас это не беспокоит? Тогда никаких проблем?"
1011002-61 = "Конечно, вы так и скажете. Вы ведь всегда так великодушны."
1011002-62 = "[s7] «Я думал, ты хочешь обсудить какие-то дела Чаепития.»\n[s8] «Казалось, у тебя на уме что-то официальное.»"
1011002-65 = "Да, полагаю, мои сообщения действительно можно было понять именно так."
1011002-66 = "Хотя вы, скорее всего, пришли бы, даже если бы я просто сказала: «Я хочу вас увидеть.»"
1011002-67 = "Иногда я бываю довольно хлопотной девчонкой, не так ли?"
1011002-68 = "Возможно, мне просто хотелось увидеть ваше лицо в такой запутанной и неловкой ситуации."
1011002-69 = "А потом я беззаботно проспала ваше появление."
1011002-70 = "Какая глупость. Фуфу."
1011002-71 = "...Вас удивляет, что я разыграла карту «официальных дел Чаепития» ради собственных желаний?"
1011002-72 = "Или вы и так всё поняли, Сенсей?"
1011002-73 = "В отличие от других, я не испытываю по этому поводу особых угрызений. У меня есть привилегии, и я ими пользуюсь. Разумеется, пока это не причиняет проблем Тринити или Чаепитию."
1011002-74 = "В конце концов, что плохого в том, чтобы сделать это всего один раз?"
1011002-75 = "Но теперь, когда это уже произошло..."
1011002-76 = "...я больше не стану звать вас сюда таким способом."
1011002-77 = "Иногда мне нравится наблюдать ваше замешательство, но я вовсе не хочу, чтобы вы перестали мне доверять или начали меня недолюбливать."
1011002-78 = "Хотя я ещё могу найти другие способы вас смутить."
1011002-79 = "...Надеюсь, я вас ещё не утомила?"
1011002-80 = "[s9] «Мне приятно узнавать тебя лучше, Сейя.»\n[s10] «Вообще-то я и раньше хотел вот так с тобой поговорить.»"
1011002-81 = ""
1011002-82 = ""
1011002-84 = ""
1011002-85 = "Очень хорошо. Именно это я и хотела услышать."
1011002-86 = "Наверное, вам нелегко иметь дело с такой девчонкой, как я."
1011002-87 = ""
1011002-89 = ""
1011002-90 = "Раз уж мы заговорили о чём-то похожем..."
1011002-91 = "Вы ведь ещё даже не спросили, как я себя чувствую, Сенсей. Большинство людей начинают разговор именно с этого."
1011002-92 = "Ну знаете: «Как ты себя чувствуешь?», «Всё хорошо?», «Тебе не больно?» — что-нибудь в таком духе."
1011002-93 = "...Фуфу."
1011002-94 = "Но, конечно, вы знаете, что подобные любезности я считаю совершенно излишними."
1011002-95 = "[s11] «Твоё поведение уже ответило на этот вопрос.»\n[s12] «Мне и спрашивать не нужно, чтобы понять.»"
1011002-98 = "Прекрасно. Значит, моя маленькая авантюра полностью себя оправдала."
1011002-99 = "Что ж, Сенсей, раз вы всё-таки нашли время прийти сюда..."
1011002-100 = "...у меня действительно есть официальная просьба — как у бывшей хозяйки Чаепития."
1011002-101 = ""
1011002-103 = ""
1011002-104 = ""
1011002-105 = ""
1011002-106 = ""
1011002-107 = ""
1011002-108 = ""
1011002-109 = ""
1011002-111 = "Не могли бы вы... помочь мне выполнить моё «задание на дневной сон» и немного подремать вон там?"
1011002-113 = "После этого я долго дремал в комнате вместе с Сейей, а затем вернулся в Шале."
