[translation]
83304400400-5 = ""
83304400400-6 = "Я слышала, у Макото случились неприятности. Что-то связанное с гипнозом?"
83304400400-7 = "...*вздыхает*. Конечно, ты уже слышала. Ага... Сацуки полностью загипнотизировала Макото..."
83304400400-8 = "А Ибуки пострадала из-за последствий..."
83304400400-9 = "Я понятия не имею, чем она думала! Вообще никакого!"
83304400400-10 = "А теперь, когда она снова в себе, закатывает истерику, как ей жаль, и переживает, какие подарки нужно подготовить, чтобы загладить вину перед Ибуки."
83304400400-11 = "Серьёзно, Ибуки могла оказаться в настоящей опасности! О чём она вообще думала?!"
83304400400-12 = "Это... Похоже, тебе сейчас тоже хватает забот."
83304400400-13 = "...А, не надо меня сейчас жалеть."
83304400400-14 = "Но, наверное, нам обеим приходится по-своему поспевать за Макото."
83304400400-15 = "Похоже, у нас обеих забот выше крыши."
83304400400-16 = "Не так уж плохо. Я просто делаю всё, что могу."
83304400400-17 = "...Ладно. На этом и остановимся."
