[translation]
13070-1 = "Episódio 7;O Limite do Corpo"
13070-6 = "...Shiroko-chan?"
13070-7 = "Você tá me seguindo faz um tempão, o que será que quer com o velhote aqui~?"
13070-8 = "Nn, só estou te seguindo."
13070-9 = "Aí complica um pouco...#nPra começo de conversa, uma colegial seguindo um velhote? Que situação invertida é essa?"
13070-10 = "...Por que você veio aqui?#nNão mora mais ninguém aqui..."
13070-11 = "...É."
13070-12 = "Não tem mais... ninguém aqui, né."
13070-13 = "Aqui foi onde eu conheci a Yume-senpai pela primeira vez."
13070-14 = "A antiga presidente do conselho estudantil..."
13070-15 = "Então, quando me dei conta, meus pés já tinham me trazido pra cá... É, tipo isso."
13070-19 = "Eu também não sei o que aconteceu com ela."
13070-20 = "..."
13070-21 = "Mas acho que não é bom continuar escondendo coisas de todo mundo."
13070-22 = "..."
13070-23 = "A Ayane, a Nonomi e a Serika estão todas preocupadas.#nIsso também tem a ver com a presidente desaparecida?"
13070-28 = "Aaah!#nOlha lá, um carro-forte sem nenhuma escolta!"
13070-38 = "Hoshino-senpai!"
13070-47 = "Não vou deixar você escapar."
13070-49 = "Uaaah?!#nVocê ficou ainda mais rápida, hein, Shiroko-chan?!"
13070-50 = "Aliás, aquilo agora há pouco foi a forma do velhote aqui de ser atencioso...!#nDá pra ler um pouquinho o clima, não?!"
13070-51 = "Não. Vou te pegar."
13070-52 = "Ah, qual é...!#nEu só queria ficar um pouco sozinha, sabia?!"
13070-59 = "A Shiroko-senpai tá demorando, né..."
13070-60 = "...Acho melhor eu entrar em contato com o mordomo, afinal."
13070-61 = "...O da Nephthys, certo?"
13070-62 = "Sim, a Nephthys com certeza deve saber de alguma coisa.#nPor enquanto, não temos nenhuma outra pista..."
13070-63 = "V-Você tem certeza de que está tudo bem?#nDaquela vez, o clima parecia meio desconfortável..."
13070-64 = "Faz muito tempo que não entro em contato com a minha família...#nEles provavelmente não têm uma boa impressão disso."
13070-65 = "...Eu não me importo muito com isso, mas...#nO contato era... deixa eu ver..."
13070-66 = "...Não se force demais, tá bom, Nonomi-senpai?"
13070-67 = "...Sim."
13070-75 = "Desculpa, ela escapou."
13070-76 = "Shiroko-senpai!"
13070-77 = "Entendo..."
13070-78 = "Nn... Ainda estou muito fraca."
13070-79 = "E-Ela ficou pra baixo..."
13070-80 = "Se nem a Shiroko-senpai conseguiu, ninguém conseguiria alcançá-la."
13070-81 = "...A Hoshino-senpai falou.#nDisse pra não nos preocuparmos, que amanhã ela vai pra escola."
13070-83 = "Ah, entendo..."
13070-84 = "...Talvez a Hoshino-senpai só precise de um pouco de tempo agora."
13070-85 = "..."
13070-89 = "...Ah."
13070-93 = "...Senhorita."
13070-94 = "Sr. Mordomo, hum..."
13070-95 = "Deseja saber sobre a Ferrovia Transdesértica?"
13070-96 = "...Sim."
13070-97 = "Você sabe de alguma coisa, não sabe?"
13070-98 = "Certamente, estou ciente."
13070-99 = "O que a Nephthys está tramando?#nQual é o objetivo do fundo privado?"
13070-100 = "Qual a relação entre o desaparecimento da antiga presidente e o contrato...?"
13070-101 = "Estou ciente, sim —#nmas acredito que a senhorita não tenha necessidade de se preocupar com assuntos de negócios, não concorda?"
13070-102 = "...Isso..."
13070-103 = "Pode até ser verdade, mas..."
13070-107 = "...Faz dois anos desde a última vez que conversamos propriamente assim.#nA senhorita tem passado bem?"
13070-108 = "...Sim."
13070-109 = "O limite do seu cartão tem sido suficiente?#nSe precisar, posso providenciar um novo cartão com um limite maior,#nportanto basta me avisar quando quiser."
13070-110 = "N-Não... está tudo bem.#nEu não estou passando por nenhum aperto..."
13070-111 = "..."
13070-112 = "Comigo está tudo bem...#nSr. Mordomo, a Nephth—"
13070-114 = "Por favor, não faça nada e continue vivendo como sempre viveu.#n...A senhorita não se esqueceu de todo o prejuízo que causou, não é mesmo?"
13070-115 = "..."
13070-120 = "Nn..."
13070-122 = "Com todo o respeito, a senhorita sempre criticou a Nephthys.#nAcredito que muitos considerariam \"conveniente demais\" vir perguntar agora, não acha...?"
13070-123 = "Isso é..."
13070-124 = "...Peço desculpas pelas palavras duras.#nNo entanto, a Nephthys encontra-se em crise no momento."
13070-125 = "...Hã?"
13070-126 = "Não seria exagero dizer que na assembleia geral daqui a dois dias#na sobrevivência da empresa estará em jogo."
13070-127 = "O que exatamente vai acontecer nessa assembleia...?"
13070-128 = "...As demais alunas de Abydos estão aí com a senhorita agora?"
13070-134 = "..."
13070-136 = "Amanhã irei pessoalmente até aí.#nJá está tarde hoje, então conversaremos em detalhes na ocasião."
13070-137 = "E, senhorita, não se esqueça do seu cartão. Farei a troca.#nPois bem, com licença por hoje."
13070-138 = "Hã? Quanto a isso, está tudo b—"
13070-142 = "..."
13070-143 = "Nonomi-senpai..."
13070-144 = "...Por favor, não se preocupem.#nMais importante do que isso, a sobrevivência da Nephthys estar em jogo..."
13070-145 = "A situação pode ser ainda mais complicada do que pensávamos..."
13070-146 = "Eu também vou tentar reunir mais informações."
13070-147 = "Você tá bem...?#nVocê também tá cansada, né, Ayane-chan."
13070-148 = "Sim, mas... mesmo assim...!"
13070-149 = "[s] \"Vamos voltar cedo e descansar hoje.\""
13070-150 = "Sensei?"
13070-151 = "...Vamos fazer isso, Ayane-chan.#nNessas horas, descansar também é importante."
13070-152 = "Você também, Shiroko-chan, Serika-chan, e o Sensei também..."
13070-154 = "Eu estou bem."
13070-155 = "Não, não, dá pra ver na sua cara que você tá cansada, Shiroko-senpai.#nVai pra casa e descansa direito, tá?"
13070-156 = "...Nn."
13070-157 = "Ahaha... Afinal, você correu atrás da Hoshino-senpai com tudo o que tinha..."
13070-158 = "[s1] \"Eu também vou voltar pra Schale e investigar algumas coisas.\"\n[s2] \"Vamos nos reunir todos de novo amanhã.\""
13070-161 = "Nn, entendido."
13070-162 = "Então, pessoal, até amanhã."
13070-163 = "Tá, até mais."
13070-168 = "..."
13070-169 = "Algum problema, Ayane-chan?"
13070-170 = "...Você não está tendo uma sensação estranha?"
13070-171 = "Sensação estranha como?"
13070-172 = "A Ferrovia Transdesértica, a assembleia geral dos credores, o Conselho Estudantil de Abydos..."
13070-173 = "A data do contrato encontrado por acaso e o dia em que a Yume-senpai desapareceu..."
13070-174 = "Parece que tem algo enorme se movendo sem que a gente saiba..."
13070-175 = "Sim, é por isso que a gente vai se reunir amanhã de novo, né?"
13070-176 = "É verdade, mas não é só isso..."
13070-177 = "Como eu posso dizer... uma sensação de estranhamento..."
13070-178 = "[s] \"Estranhamento?\""
13070-179 = "...Sim."
13070-181 = "Como se houvesse a intenção oculta de alguém...#nEu sinto uma espécie de malícia..."
13070-182 = "Malícia...? Mas de quem?"
13070-183 = "[s] \"...\""
13070-184 = "...É, tem razão.#nTalvez eu esteja pensando demais."
13070-185 = "Não se preocupe com isso também, Sensei."
13070-186 = "...Provavelmente estou só confusa por falta de informações."
13070-187 = "Amanhã vamos nos encontrar com o pessoal da Nephthys,#nentão vou coletar o máximo de informações que puder."
13070-188 = "[s] \"Entendido, mas não se esforce demais, tá?\""
13070-189 = "...Sim.#nVamos pra casa, Serika-chan."
13070-190 = "E-Espera aí, Ayane-chan!"
13070-195 = "[ns] Voltar para a Schale."
13070-199 = "Estratégia número 1 — \"O que já aconteceu não pode ser mudado\"."
13070-200 = "Se o Sensei sempre acaba mudando o futuro,#nbasta usar o passado."
13070-201 = "Mesmo sendo o Sensei, alterar o passado é impossível."
13070-207 = "Ou seja, a chave da estratégia está — no \"passado\"."
13070-216 = "Eu..."
13070-219 = "Pois bem, ó Sensei... Hihi, hihihi..."
13070-221 = "Há quatro estratégias ao todo."
13070-222 = "A primeira já está em andamento...#nE a segunda também logo virá... Hihi."
13070-223 = "Ora, ora, talvez a quarta estratégia nem precise entrar em cena. Será que..."
13070-224 = "Vou me divertir muito assistindo à sua escolha... Hihi, hihihihi..."
13070-228 = "[ns] \"Arona, Plana.\""
13070-230 = "Sim, Sensei!"
13070-231 = "Confirmado. Aguardando ordens."
13070-232 = "[ns] \"Tenho algo que preciso terminar até de manhã.\""
13070-234 = "[ns5] \"Se eu acabar pegando no sono no meio,\"\n[ns6] \"vocês podem dar um jeito de me acordar?\""
13070-237 = "Virar a noite... V-Você tem certeza que vai ficar bem, Sensei?"
13070-238 = "U-Uhh... Entendido!#nMas faça pausas direito, tá bom?!"
13070-239 = "Compreendido.#nUm serviço de despertador, certo? Pode deixar comigo."
13070-240 = "[ns] \"...Ah, e mais uma coisa.\""
13070-242 = "[ns] \"...A Gematria fez algum movimento?\""
13070-243 = "A Gematria?#nDesde aquela vez, nada em particular..."
13070-244 = "A que se refere, Sensei?"
13070-245 = "[s] \"...Não, se for assim, tudo bem.\""
13070-254 = "Bom dia~."
13070-255 = "Bom dia."
13070-256 = "Sim, sim☆#nQue ótimo ver que vocês duas estão bem dispostas, Ayane-chan e Serika-chan."
13070-257 = "...Nonomi-senpai, você não conseguiu dormir?"
13070-258 = "Hehe... Desculpe, eu dormi um pouquinho, sim."
13070-263 = "Bom dia."
13070-264 = "A Shiroko-senpai parece ótima, né."
13070-265 = "Nn?"
13070-266 = "Só disse que é bom ver você bem disposta.#nE então, cadê a Hoshino-senpai?"
13070-267 = "Ela ainda não mandou notícia.#nMas ela disse que vinha."
13070-268 = "Aliás, e o Sensei...?"
13070-269 = "Conhecendo o Sensei,#ncom certeza deve estar investigando alguma coisa."
13070-270 = "...Ele não tá pensando em aparecer cambaleando só no fim da tarde, né?"
13070-271 = "Amanhã é o dia da assembleia geral; se ele atrasar demais, os preparativos vão..."
13070-275 = "Mnha... nnn, fuhihi..."
13070-276 = "...Senpai, Arona-senpai."
13070-277 = "Huaaah... Plana-chan?#nAconteceu alguma coisa...?"
13070-281 = "Uaaah, já amanheceu?!#nPreciso acordar o Sensei...!"
13070-282 = "Não há problema.#nO Sensei ficou acordado até de manhã."
13070-283 = "Que alív..."
13070-284 = "Não, virar a noite de novo não faz nada bem, na verdade..."
13070-285 = "Isso é verdade... A propósito, Arona-senpai.#nHavia alguma obra prevista para hoje?"
13070-286 = "Obra? Não, não deveria haver nenhuma...?"
13070-287 = "...Uma anomalia foi detectada no sistema de tubulação de gás."
13070-288 = "...Hã?"
13070-290 = "Confusão. É um fenômeno que nunca vi antes...#nA tubulação de gás foi alterada."
13070-291 = "É como se alguém estivesse intervindo à força... retorcida, distorcida, desagradável..."
13070-292 = "...E-Espera aí!"
13070-296 = "Sensei!!!"
13070-305 = "...Estratégia número 2."
13070-306 = "Mesmo sendo o portador de milagres, o corpo possui limites físicos."
13070-307 = "Esse é o seu ponto fraco, não é... Sensei?#nHihi, hi..."
13070-308 = "Hihihi, hihihihihi!"
13070-310 = "Ihihihihihihihihihi!!"
13070-312 = "\nPróximo;O Conselho Estudantil de Abydos (1)"
