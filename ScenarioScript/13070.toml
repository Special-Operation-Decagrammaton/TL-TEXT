[translation]
13070-1 = "Эпизод 7;Пределы тела"
13070-3 = ""
13070-4 = ""
13070-5 = ""
13070-6 = "Широко..."
13070-7 = "Тебе ещё не надоело за мной ходить? Почему бы просто не сказать, что хочешь?"
13070-8 = "Нет. Просто иду следом."
13070-9 = "Старшекласснице не стоит таскаться за старушкой, знаешь ли. Что это вообще за ситуация? Всё наоборот."
13070-10 = "Почему сюда, Хошино? Это заброшенный город."
13070-11 = "...Ах."
13070-12 = "Это место... да."
13070-13 = "Именно здесь... я впервые встретила Юмэ."
13070-14 = "Где ты встретила... Юмэ?"
13070-15 = "А... Да, примерно. Я вообще-то не планировала здесь оказаться."
13070-16 = ""
13070-18 = ""
13070-19 = "Хошино. Твоя жизнь до нашей встречи для меня загадка."
13070-20 = "..."
13070-21 = "Никто не хочет на тебя давить, но думаю, время пришло."
13070-22 = "..."
13070-23 = "Никто не знает, что делать. Все тревожатся. Смерть председателя Юмэ связана с нынешней ситуацией?"
13070-24 = ""
13070-26 = ""
13070-28 = "А! Смотри! Вон грузовик с деньгами злой компании, по которому никто не будет скучать!"
13070-29 = ""
13070-31 = ""
13070-33 = ""
13070-38 = "Хошино?!"
13070-39 = ""
13070-41 = ""
13070-47 = "Ты не уйдёшь."
13070-49 = "Ч-Ч-Что?! Широко?! Ради всего святого, перестань меня преследовать!"
13070-50 = "Ты намёков не понимаешь? Я буквально размахиваю неоновой вывеской: «Я не хочу об этом говорить!» Перестанешь нестись за мной на полной скорости?!"
13070-51 = "Если поймаю, придётся рассказать."
13070-52 = "Не поймаешь! Просто дай мне немного времени!"
13070-53 = ""
13070-59 = "Широко всё ещё не вернулась..."
13070-60 = "Я больше не могу ждать. Свяжусь с дворецким."
13070-61 = "С... Нефтис?"
13070-62 = "Да. Они могут знать правду об этом проекте, а других вариантов у нас не осталось."
13070-63 = "Т-Ты уверена? Когда ты спрашивала раньше, он выглядел... неудобно."
13070-64 = "Потому что... когда я решила остаться в Абидосе, я разорвала отношения с семьёй. Едва ли после стольких лет они хорошо ко мне относятся."
13070-65 = "Я приняла последствия... Посмотрим. Я удалила контакты, но если правильно помню..."
13070-66 = "Не нужно так себя заставлять, Нономи."
13070-67 = "Спасибо, Аяне."
13070-68 = ""
13070-70 = ""
13070-74 = ""
13070-75 = "Я её потеряла."
13070-76 = "Широко?!"
13070-77 = "Ты потеряла Хошино?"
13070-78 = "Да. Моей подготовки оказалось недостаточно. Теперь жалею."
13070-79 = "Не выгляди так разочарованно собой, Широко..."
13070-80 = "Сэрика права. Когда Хошино старается, её никто не догонит."
13070-81 = "Она сказала не переживать и что увидится со мной завтра в школе. Потом я потеряла её из виду."
13070-83 = "Завтра..."
13070-84 = "Возможно, ей просто нужно немного времени..."
13070-85 = "..."
13070-86 = ""
13070-89 = "А. Дворецкий перезванивает."
13070-90 = ""
13070-92 = ""
13070-93 = "...Госпожа."
13070-94 = "Это я... Здравствуй, Дворецкий..."
13070-95 = "Я предполагал, что вы позвоните. Ищете сведения о Транс-пустынной железной дороге, полагаю?"
13070-96 = "...Да."
13070-97 = "Должен быть какой-то секрет, раз все так борются за права на заброшенный проект. Нефтис знает?"
13070-98 = "...Разумеется."
13070-99 = "Пожалуйста, скажи мне. Какова цель фонда прямых инвестиций? Что задумала Нефтис?"
13070-100 = "И договор! Нам нужно понять, что происходит с договором, который подписала наша прежняя председательница!"
13070-101 = "Ну, вам не стоит забивать прекрасную голову деловыми вопросами, госпожа."
13070-102 = "Это не..."
13070-103 = "Это ради Абидоса, Дворецкий. Мне нужно знать."
13070-104 = ""
13070-106 = ""
13070-107 = "Если подумать, прошло почти два года с вашего последнего звонка. Как вы поживаете, госпожа?"
13070-108 = "Хорошо. Я в порядке."
13070-109 = "Вы уже достигли лимита карты? Я могу заменить её новой, когда понадобится."
13070-110 = "Я почти ей не пользуюсь. Но спасибо."
13070-111 = "..."
13070-112 = "У меня всё хорошо, Дворецкий, но речь о—"
13070-114 = "Не сомневаюсь, что у вас всё прекрасно. Кто бы сомневался, после того как вы протащили собственную семью по грязи?"
13070-115 = "..."
13070-116 = ""
13070-119 = ""
13070-120 = "Эм..."
13070-122 = "Если говорить откровенно, госпожа, ваше поведение кажется мне довольно бесстыдным. Вы осуждаете нас, отрекаетесь от собственного имени, а потом звоните, как только это становится выгодно вам?"
13070-123 = "Это... Ну..."
13070-124 = "Если уж вам так нужно знать, Нефтис — ваша семья — переживает кризис."
13070-125 = "К-Кризис?"
13070-126 = "Да. Мы изо всех сил пытаемся избежать возможного краха компании. И исход общего собрания кредиторов через два дня определит нашу судьбу."
13070-127 = "Что вообще будет происходить на этом собрании? Похоже, от него зависит слишком многое..."
13070-128 = "Остальные студенты Абидоса сейчас рядом?"
13070-129 = ""
13070-132 = ""
13070-134 = "..."
13070-136 = "Уже поздно. Завтра я лично приеду в Абидос, и мы обсудим всё подробно."
13070-137 = "А, да. Я принесу замену вашей золотой карте, поэтому возьмите с собой ту, что сейчас у вас."
13070-138 = "Что? Я же сказала—"
13070-139 = ""
13070-141 = ""
13070-142 = "..."
13070-143 = "Ну и напряжённо было. Ты в порядке, Нономи?"
13070-144 = "Не переживай. Это было нормально. Меня куда сильнее тревожит это общее собрание кредиторов."
13070-145 = "Чем больше мы пытаемся перелистнуть страницы, тем запутаннее становится сюжет..."
13070-146 = "Я постараюсь найти больше информации."
13070-147 = "Аяне, тебе не нужен перерыв? Сегодня и так был какой-то кошмар..."
13070-148 = "Э-Это неважно, мне нужно—"
13070-149 = "[s] «Вам всем нужно отдохнуть.»"
13070-150 = "Сенсей?"
13070-151 = "Давай послушаем Сенсея, Аяне. Во время такого стресса нельзя загонять себя."
13070-152 = "Широко, Сэрика и Сенсей..."
13070-154 = "Со мной всё нормально."
13070-155 = "Не хочу это слышать, Широко! Ты еле глаза держишь открытыми. И тебе нужен душ!"
13070-156 = "Х-Хорошо..."
13070-157 = "А-ха-ха... Всё-таки угнаться за Хошино — достойное достижение."
13070-158 = "[s1] «Посмотрю, удастся ли что-нибудь найти в Шале.»\n[s2] «Я вернусь завтра, так что ждите меня.»"
13070-161 = "Хорошо. Поняла."
13070-162 = "Именно! Все, по домам!"
13070-163 = "Собрание окончено!"
13070-164 = ""
13070-166 = ""
13070-167 = ""
13070-168 = "..."
13070-169 = "Ты в порядке, Аяне? Они сейчас уйдут без нас."
13070-170 = "...Что-то здесь не так."
13070-171 = "Аяне?"
13070-172 = "Транс-пустынная железная дорога... Общее собрание кредиторов... Студсовет..."
13070-173 = "И случайно найденный договор... Дата, совпадающая с исчезновением председателя Юмэ..."
13070-174 = "Будто всё это соединяет одна нить, но я никак не могу её увидеть."
13070-175 = "Ну да. От одной мысли обо всём этом у меня снова голова кружится. Поэтому надо отдохнуть, а завтра вместе раскроем загадку!"
13070-176 = "Я не про какой-то тайный заговор, Сэрика."
13070-177 = "Как бы объяснить..."
13070-178 = "[s] «Что именно кажется тебе странным?»"
13070-179 = "Если попытаться описать эту нить..."
13070-181 = "Будто кто-то намеренно бьёт по всем нашим самым уязвимым местам."
13070-182 = "А? Кто вообще мог бы знать такие вещи?"
13070-183 = "[s] «...»"
13070-184 = "Именно. Чтобы это провернуть, кому-то нужно знать об Абидосе даже больше, чем знаем мы."
13070-185 = "Наверное, я просто слишком много думаю."
13070-186 = "Мне всегда помогает раскладывать всё по полочкам. Я систематизирую информацию и, возможно, увижу картину яснее."
13070-187 = "В конце концов, завтра мы встречаемся с сотрудником самой Нефтис. Нужно подготовиться."
13070-188 = "[s] «Хорошо. Только не загоняй себя, Аяне.»"
13070-189 = "Да. Тогда... Пошли, Сэрика."
13070-190 = "П-Подожди меня, Аяне!"
13070-191 = ""
13070-193 = ""
13070-195 = "[ns] Вернуться в Шале."
13070-198 = ""
13070-199 = "С-Стратегия первая: сделанного не воротишь."
13070-200 = "Сенсей — аномалия... способная изгибать реальность под свою волю и манипулировать исходами словно кукловод. Тогда моя задача — использовать то, что невозможно согнуть."
13070-201 = "Да, да. Сделанного не воротишь. То, что нельзя изменить, не изменится."
13070-202 = ""
13070-204 = ""
13070-207 = "Слабость Сенсея — прошлое... значит, прошлое я и использую..."
13070-208 = ""
13070-210 = ""
13070-211 = ""
13070-216 = "Я..."
13070-219 = "Ну что, Сенсей... Хи-хи-хи..."
13070-220 = ""
13070-221 = "Для вас я подготовил четыре с-с-стратегии."
13070-222 = "С их помощью я одержу п-п-победу в этом перетягивании воли. Первая уже в движении, в-вторая всё ближе подкрадывается к вам."
13070-223 = "Хватит двух? Или в-вы заставите меня дойти до предела? Хи-хи! Хи-хи-хи!"
13070-224 = "Ах! Да... П-Покажите мне... ваши слабости... ваши препятствия...!"
13070-228 = "[ns] «Арона, Плана.»"
13070-230 = "Да, Сенсей!"
13070-231 = "Ожидаю приказов."
13070-232 = "[ns] «Мне придётся работать всю ночь.»"
13070-233 = ""
13070-234 = "[ns5] «Но утром нужно вернуться в Абидос.»\n[ns6] «Так что разбудите меня, если всё-таки усну.»"
13070-237 = "Вы уверены? С вами всё будет хорошо, Сенсей?"
13070-238 = "Ну, раз вы так решили! Но постарайтесь хотя бы немного вздремнуть! Отдых очень важен!"
13070-239 = "Принято. Я не подведу."
13070-240 = "[ns] «А... И ещё.»"
13070-241 = ""
13070-242 = "[ns] «...Есть ли какие-нибудь движения со стороны Гематрии?»"
13070-243 = "Давно не слышала этого названия! После всей истории с красным небом ничего не было!"
13070-244 = "Что-то случилось, Сенсей?"
13070-245 = "[s] «...Хм. Нет, ничего.»"
13070-246 = ""
13070-248 = ""
13070-254 = "Мы пришли!"
13070-255 = "Доброе утро."
13070-256 = "Ага-ага! Доброе утро, Аяне! Серика! ♧"
13070-257 = "Ты совсем не отдыхала ночью, Нономи?"
13070-258 = "Ой. Так заметно? Кажется, я всё-таки немного задремала..."
13070-259 = ""
13070-261 = ""
13070-263 = "Доброе утро."
13070-264 = "Широко как всегда в порядке!"
13070-265 = "Хм?"
13070-266 = "Ничего-ничего! Хошино уже видела?"
13070-267 = "Нет. Но она сказала, что придёт. Значит, придёт."
13070-268 = "От Сенсея тоже ничего?"
13070-269 = "Наверное, он всё ещё собирает информацию…"
13070-270 = "Но Сенсей обещал... Может, имел в виду позже сегодня?"
13070-271 = "Но собрание уже завтра, нам нужно как можно больше времени на подготовку…"
13070-275 = "Хр-р... Хр-р..."
13070-276 = "...Арона? Арона."
13070-277 = "*зевает* Плана? Что случилось?"
13070-278 = ""
13070-280 = ""
13070-281 = "Ай! Уже утро! Нужно разбудить Сенсея!"
13070-282 = "Отрицательно. Сенсей не заснул."
13070-283 = "Фух! Какое облегчение! Я уже подумала, что всё испортила."
13070-284 = "Стоп, вообще-то нет! Я же говорила хотя бы вздремнуть!"
13070-285 = "Вопрос. Арона. В газовой системе Шале проводятся какие-нибудь изменения?"
13070-286 = "Кажется, нет. Но мы вообще не занимаемся такими вещами. Почему?"
13070-287 = "Доклад. Я обнаружила необычную активность в газовых трубах."
13070-288 = "Это плохо! Какую активность?!"
13070-290 = "Это... замешательство? Я никогда такого не испытывала. Газовые трубы словно изменяются... без причины."
13070-291 = "Я чувствую... Чужая рука тянется в этот мир. Что-то меняет. Это... чужеродное ощущение."
13070-292 = "Чужеродное... П-Постой!"
13070-293 = ""
13070-295 = ""
13070-296 = "СЕНСЕЙ!!!"
13070-297 = ""
13070-304 = ""
13070-305 = "...Стратегия вторая."
13070-306 = "Тот, кто творит чудеса... кто изгибает реальность! Даже он р-раб пределов собственного тела!"
13070-307 = "В-Всемогущий Сенсей! Я вскрыл слабость с-с-спасителя! Хи-хи. Хи-хи-хи!"
13070-308 = "Хи-хи-хи... хи-хи-хи-хи!"
13070-310 = "ХИ-ХИ-ХИ-ХИ-ХИ!"
13070-312 = "Следующий эпизод;Студсовет Абидоса 1"
