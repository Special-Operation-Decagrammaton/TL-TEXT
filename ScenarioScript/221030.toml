221030-8 = ""
221030-9 = ""
221030-10 = ""
221030-11 = ""
221030-12 = ""
221030-13 = ""
221030-14 = "Pois bem... já que se deram ao trabalho de vir até aqui, que tal um tour pelas instalações da nossa escola?"
221030-15 = "Agradeço a gentileza da oferta, mas sugiro seguirmos diretamente para a sala do conselho estudantil."
221030-16 = "Compreendo, mas como é a primeiríssima visita do Sensei...#nnão seria mais adequado começarmos com uma boa apresentação da academia?"
221030-17 = "Agradecemos o cuidado, mas tanto eu quanto o Sensei estamos com compromissos inadiáveis na agenda."
221030-18 = "Poderíamos deixar esse tour para uma próxima oportunidade?"
221030-19 = "Prometo não tomar muito do seu tempo."
221030-20 = "Além disso, é uma tradição sagrada da Odisseia que a própria Capitã receba e acompanhe pessoalmente os convidados de honra do Island."
221030-21 = "Tradição, é――?"
221030-22 = "Está sugerindo que nós também deveríamos nos curvar às tradições da Odisseia?"
221030-23 = "Qualquer pessoa que ponha os pés nesta embarcação está sujeita a elas por igual. Não abrimos exceções."
221030-24 = "Entendo......"
221030-25 = "Pelo que vejo, a Capitã da Odisseia é tão inflexível e apegada a princípios rígidos quanto [ruby=・]diziam[/ruby] os boatos."
221030-26 = "Fufufu, vou receber isso como um grande elogio."
221030-27 = ""
221030-29 = ""
221030-30 = ""
221030-31 = "............"
221030-32 = "Ai, ai, meu bom Jesus amado......"
221030-33 = "D-De que lado eu fico numa hora dessas......?!#nA autoridade máxima é a Presidente do Conselho Estudantil Federal......? Ou a minha superior direta, a Capitã......?!"
221030-34 = ""
221030-36 = ""
221030-37 = ""
221030-38 = "[ns1] \"É... bem...\"\n[ns2] \"Por mim, tudo bem dar uma voltinha rápida pela escola...\""
221030-41 = "......Se o Sensei faz tanta questão, que assim seja."
221030-42 = ""
221030-47 = "[ns] \"......Um gato?\""
221030-49 = ""
221030-50 = "......Sammy, quando foi que você subiu até aqui?#nVamos, desce já daí."
221030-51 = "Myaaau～"
221030-52 = "Pelo visto, o Sammy também fez questão de vir dar as boas-vindas às visitas."
221030-53 = ""
221030-55 = ""
221030-56 = ""
221030-57 = "......Esse felino é criado pelo conselho estudantil?"
221030-58 = "Sim. Geralmente ele não sobe até esta área do convés superior...#nMas acho que sentiu cheiros diferentes e ficou curioso."
221030-59 = ""
221030-61 = ""
221030-62 = "（Fungando curioso）"
221030-63 = "......Ora, vejam só que guia de turismo adorável nós arranjamos."
221030-64 = "Fazer um tour na companhia de um bichinho tão charmoso promete ser bem agradável."
221030-65 = "Então estamos combinados."
221030-66 = ""
221030-68 = ""
221030-69 = ""
221030-70 = "......Sammy, não adianta fazer charme na frente dos convidados, você não vai ganhar petisco extra hoje, viu?#nJá reparou como você andou ganhando peso ultimamente?"
221030-71 = "Myaau......"
221030-72 = ""
221030-73 = "[ns] \"Não sabia que era comum criar gatos em navios.\""
221030-74 = "Aqui na Odisseia isso é a coisa mais natural do mundo."
221030-75 = "Mas enfim, deixemos a conversa sobre o Sammy para mais tarde. Vamos nos deslocar para a próxima embarcação?"
221030-76 = ""
221030-77 = "[ns] \"A gente vai pra outro navio?\""
221030-78 = "Exato. O Olympos é a nau capitânia privativa do nosso conselho, o Island."
221030-79 = "Se fôssemos comparar com uma academia em terra firme... seria o equivalente ao prédio do grêmio estudantil."
221030-80 = "As atividades extracurriculares da Odisseia funcionam na premissa da vida no mar.#nPor conta disso, quase todos os clubes possuem suas próprias embarcações dedicadas."
221030-81 = "O porte e a doutrina de cada navio mudam completamente conforme o clube, então é bem divertido comparar as diferenças."
221030-82 = "[s] \"Agora fiquei animado......!\""
221030-83 = "Para começar, vou lhes apresentar o maior clube de toda a Odisseia."
221030-85 = "[ns3] \"Onde estamos...?\"\n[ns4] \"Essa instalação é gigantesca!\""
221030-88 = "Estas são as instalações do Clube de Pesquisa em Aquicultura."
221030-89 = "Não é exagero nenhum dizer que a sobrevivência alimentar da Odisseia depende inteiramente daqui."
221030-90 = "A Aquicultura não é apenas o maior clube da escola em número de membros,#nmas também a que recebe a maior fatia do nosso orçamento anual."
221030-91 = "Criamos peixes, polvos, lulas, algas marinhas e uma enorme variedade de crustáceos."
221030-92 = "Graças a este complexo auto-sustentável, não importa o quanto nossa viagem se prolongue em alto-mar,#nnunca passamos aperto por falta de comida!"
221030-93 = ""
221030-95 = ""
221030-96 = "De fato, com esta envergadura, é plenamente capaz de fornecer um suprimento estável para abastecer toda a academia."
221030-97 = "Contudo, alimentar-se exclusivamente de frutos do mar não causaria um desequilíbrio nutricional nas estudantes?"
221030-98 = "Quanto a isso, não há motivo para alarde.#nA saúde de toda a tripulação é monitorada com rigor militar pela enfermaria do navio."
221030-99 = "E claro, as cozinheiras inventam mil receitas para ninguém enjoar do cardápio.#nExtraímos até sal refinado e especiarias a partir da água do mar e das algas."
221030-100 = "Ainda assim, não dá para substituir absolutamente tudo o que existe em terra firme..."
221030-101 = "Quando a viagem já passa de vários meses, chega a rolar até mercado clandestino disputando os últimos doces que sobraram――"
221030-102 = "Capitã, por favor, não toque nesses detalhes na frente das autoridades..."
221030-103 = "É um absurdo sem tamanho, isso sim!#nMês passado mesmo, o [ruby=Trident]nosso esquadrão[/ruby] pegou em flagrante uma aluna contrabandeando mercadoria!#nEla tentou afanar as últimas 10 barras de chocolate ao leite da despensa!"
221030-104 = "Dizem que a cotação do câmbio negro bateu 10 quilos de sardinha congelada por uma única barrinha de chocolate."
221030-105 = "[s] \"Nem sei se isso foi caro ou barato......\""
221030-106 = "......Senhorita [ruby=Komori]Sumika[/ruby]."
221030-107 = "A-Ai, céus! M-Mil perdões pela indiscrição!"
221030-108 = "Bem, percalços à parte... ter peixe fresco à vontade na mesa a qualquer momento#né uma vantagem competitiva que nenhuma outra academia de Kivotos consegue bater."
221030-109 = "Sensei, segure este carapau aqui para sentir o peso.#nOs peixes criados no nosso viveiro chegam a ficar do tamanho de cavalas de grande porte――"
221030-110 = ""
221030-115 = "Sammy!"
221030-116 = "Esse gato safado......"
221030-117 = "......Peço desculpas. Vou trazê-lo de volta num minuto."
221030-118 = "[s] \"Deixa comigo, vou chamar ele aqui.\""
221030-119 = ""
221030-122 = "[ns] \"Vem cá, Sammy, vem cá, bichano～ (assobia)\""
221030-123 = "......Eita."
221030-124 = "Isso aí... foi um assobio?"
221030-125 = "Quem foi que assobiou?!"
221030-126 = "Ai, não, que desgraça! Logo agora que estamos com falta de [ruby=defensas]defensas[/ruby] no estoque!"
221030-127 = ""
221030-129 = ""
221030-130 = "[ns] \"U-Ué...? Eu fiz alguma coisa errada?\""
221030-131 = "......É um [ruby=tabu]tabu sagrado[/ruby] dos marinheiros."
221030-132 = "Um tabu, é......?"
221030-133 = "Capitã, posso deixar a escolta dos dois sob sua responsabilidade?#nVou capturar o Sammy e já alcanço vocês."
221030-134 = "Ah... c-claro. Pode deixar."
221030-135 = "Com licença, vejo vocês em breve."
221030-137 = "E este navio aqui é――"
221030-138 = "[s] \"Não me diga que... é um navio de cruzeiro?\""
221030-139 = "Vejo que o Sensei tem olho clínico."
221030-140 = "Esta beldade atende pelo nome de Golden Elysium.#nÉ a capitânia do Clube de Operações de Cruzeiro, responsável por grande parte da receita turística da Odisseia, além de servir como dormitório estudantil."
221030-141 = "O Clube de Cruzeiros administra dezenas de transatlânticos de luxo,#noferecendo entretenimento e serviços de hotelaria de primeira linha aos passageiros."
221030-142 = "Na verdade, a maioria das pessoas de fora que afirmam já ter visitado a Odisseia#nestá se referindo, quase sempre, aos nossos navios de cruzeiro."
221030-143 = "Imagino que o Sensei já tenha navegado a bordo de algum dos nossos cruzeiros antes, não é verdade?"
221030-144 = "[s5] \"Dá pra dizer que sim e que não, sabe...\"\n[s6] \"Tinha umas alunas vestidas de um jeito meio peculiar lá...\""
221030-147 = "Ora, puxa vida. Pelo visto o Sensei acabou embarcando num navio operado por alunas de conduta duvidosa."
221030-148 = "Consta que embarcações que fogem ao controle diretivo do clube impõem trajes não autorizados pela escola#ne cobram preços extorsivos por produtos triviais para lucrar de forma abusiva."
221030-149 = "Em nome de toda a academia, peço as mais sinceras desculpas pela inconveniência e pelo desconforto que passou."
221030-150 = "[s] \"Não precisa se preocupar, a culpa não foi de vocês.\""
221030-151 = "Ah, veja só, a líder do Clube de Cruzeiros está bem ali."
221030-152 = "Vamos pedir que ela mesma faça as honras da casa."
221030-154 = "Ora, ora? Temos hóspedes de honra a bordo?"
221030-157 = ""
221030-158 = "Sejam muitíssimo bem-vindos ao majestoso Golden Elysium! Já realizaram o check-in na recepção?"
221030-159 = "......Ah, perdoem a falta de modos, onde estão os meus préstimos?"
221030-160 = "Sou a gerente-geral do Golden Elysium e presidente do Clube de Operações de Cruzeiro――#n[ruby=Sengoku]Mitsuki[/ruby] Sengoku, ao seu inteiro dispor! É um deleite conhecê-los!"
221030-161 = "[ns] \"Mas o traje dessa aqui também tá passando de todos os limites, não tá não?!\""
221030-162 = "Como assim, perdoe a indiscrição?"
221030-163 = "Por acaso meu lenço de pescoço ficou torto ou coisa parecida...?"
221030-164 = "[s] \"Não é bem isso, é que......\""
221030-165 = "Senhorita Sengoku, apenas para sanar uma dúvida pontual..."
221030-166 = "Por acaso você não... esqueceu a parte de baixo da vestimenta?"
221030-167 = "A parte de baixo...?"
221030-168 = "Ahhh! Parece que estamos diante de um clássico mal-entendido cultural!"
221030-169 = "Fiquem completamente despreocupados! Isso não é roupa íntima, é um autêntico traje de banho!"
221030-170 = "E se não é roupa de baixo, não há motivo algum para sentir vergonha, não concordam?"
221030-171 = "[ns] \"Será que... não tem mesmo...?\""
221030-172 = "Com toda certeza! Este uniforme foi plenamente homologado pelo conselho Island para o Clube de Cruzeiros."
221030-173 = "Mantemos o dólmã tradicional da tripulação naval na parte superior, mas adotamos o biquíni embaixo para que possamos nos lançar ao mar em socorro a qualquer instante!"
221030-174 = "Como fui eu mesma quem desenhou o modelo, todas as integrantes do clube trajam exatamente o mesmo modelo."
221030-175 = "Nenhuma delas sente o menor pudor... creio eu."
221030-176 = "[ns] \"Por que você deu essa engasgada no final......?\""
221030-177 = "Não há razão para preocupação. Afinal, a essência da hospitalidade não reside no vestuário!"
221030-178 = "Pois bem, durante sua estada na Odisseia,#nnosso Clube de Cruzeiro terá o imenso prazer de cuidar de cada detalhe do seu bem-estar."
221030-179 = "Possuem alguma restrição alimentar ou alergia?"
221030-180 = "Que tipo de acomodação preferem? Uma suíte panorâmica com vista deslumbrante para as ondas do mar,#nou preferem um quarto interno mais resguardado, próximo ao salão de banquetes?"
221030-181 = "E também, poderiam informar em qual porto pretendem desembarcar?"
221030-182 = "Qualquer inconveniência durante a hospedagem, basta acionar os comissários de bordo. Faremos o impossível para atendê-los."
221030-183 = "Em nome do Clube de Cruzeiros――garanto com '100%' de certeza que sairão plenamente extasiados!"
221030-184 = "Fufufu, que entusiasmo contagiante.#nVejo que deposita uma confiança inabalável no próprio trabalho."
221030-185 = "Mas com toda certeza deste mundo! Até hoje, jamais tivemos um único cliente que ousasse emitir uma queixa sequer!"
221030-186 = "E caso ainda reste alguma pontinha de dúvida... que tal fazermos uma aposta?"
221030-187 = "Eu aposto este magnífico navio Golden Elysium inteirinho#nem como a Presidente do Conselho Estudantil Federal nos dará nota 100 de aprovação!"
221030-188 = "A alma do jogo é o puro calafrio do risco! Eu não fujo da raia nem me escondo. Posso redigir um contrato agora mesmo para ninguém voltar atrás!"
221030-189 = "Vamos lá... diga lá, ilustre Presidente, o que a senhora gostaria de botar na mesa para apost――"
221030-190 = "Sempre a mesma história, senhorita Sengoku. O que você tá querendo apostar dessa vez?"
221030-191 = "Myaao."
221030-192 = "Apostar?! Quem, eu?! Não faço a menor ideia do que está falando!"
221030-193 = "Não se faça de desentendida.#nÉ de conhecimento público a sua mania compulsiva de propor jogatinas aos clientes."
221030-194 = "Foi exatamente por causa disso que você acabou perdendo o [ruby=・]Golden[/ruby] [ruby=・]Fleece[/ruby] a preço de banana, não foi?"
221030-195 = "Eu não perdi navio nenhum a preço de banana, tá legal?!#nVocê tem como bancar essa acusação caluniosa?!"
221030-196 = "Se você estiver errada, eu aposto um milhão de ienes agor――"
221030-197 = ""
221030-199 = ""
221030-201 = "Ai, ai, ui!"
221030-202 = "Peço escusas. Ela é uma administradora excepcional, mas sofre de um vício incorrigível em apostas..."
221030-203 = "Se ela voltar a lhes oferecer qualquer tipo de aposta ou desafio,#nsuplico que ambos simplesmente finjam demência e ignorem."
221030-204 = "[s] \"......Deu pra sacar perfeitamente o espírito da coisa.\""
221030-205 = ""
221030-206 = ""
221030-209 = "[ns] \"Então aquela aluna vestida de coelhinha não tinha nada a ver com o Clube de Cruzeiros?\""
221030-210 = ""
221030-211 = ""
221030-212 = "Ah... sim. Você se refere ao disfarce que imita aquele [ruby=・]animal[/ruby] [ruby=・]de[/ruby] [ruby=・]orelhas[/ruby] [ruby=・]compridas[/ruby], correto?"
221030-213 = "É óbvio que o Clube de Cruzeiros jamais autorizaria uma vestimenta tão escandalosa."
221030-214 = "Antes mesmo de olhar a parte de baixo, não cobrir nada sobre os ombros... que falta tremenda de compostura."
221030-215 = "......Por acaso fantasias de coelhinha também se enquadram nos tabus marítimos?"
221030-216 = ""
221030-218 = ""
221030-219 = "Bem, o problema não reside exatamente no figurino em si..."
221030-220 = "A pronúncia da palavra 'coelho' é algo que os marinheiros evitam a todo custo pronunciar a bordo."
221030-221 = "Lamento pelo transtorno de tantas regras, mas peço sua benevolente compreensão."
221030-222 = "[s] \"Perdão, foi falta de tato minha não me atentar a isso.\""
221030-223 = "............"
221030-224 = "Muito bem, podemos seguir para o próximo navio?"
221030-226 = "（E assim continuamos pulando de navio em navio, conhecendo os mais diversos clubes da Odisseia.）"
221030-236 = "（Quando terminamos a inspeção de todas as embarcações, o sol já começava a tocar a linha do horizonte.）"
221030-238 = "Ora vejam, já está nessa hora..."
221030-239 = "Peço desculpas depois de ter prometido que não tomaria muito do seu tempo.#nCalculei mal a rota entre os conveses."
221030-240 = "[s] \"Não se preocupe com isso. Foi uma experiência muito enriquecedora.\""
221030-241 = "Para mim também, foi um momento consideravelmente mais prazeroso do que imaginei."
221030-242 = "Fazia tempos que não me sentia tão revigorada...#ne tive a chance de conhecer coisas que jamais descobriria trancada em meu gabinete."
221030-243 = "Fico imensamente feliz e aliviada em ouvir tais palavras."
221030-244 = "Pois bem, antes de retornarmos à sala do conselho para tratarmos dos assuntos oficiais――"
221030-245 = "Gostariam de nos dar a honra de jantar conosco?"
221030-246 = "Fufufu, agora um convite para o jantar?"
221030-247 = "Já que faz questão de nos mimar com tanta hospitalidade, aceito com prazer."
221030-248 = ""
221030-250 = ""
221030-251 = "Capitã, a senhorita não se esqueceu, não é? O jantar de hoje é..."
221030-252 = "Ah... puxa vida! Tinha me esquecido completamente..."
221030-253 = ""
221030-254 = "[ns] \"Tem alguma coisa errada com o menu?\""
221030-255 = "Não, quanto ao preparo da comida, garanto que estará impecável."
221030-256 = "O detalhe é que... o prato servido no primeiro dia de atracação é fixo por tradição inegociável."
221030-257 = ""
221030-259 = ""
221030-260 = "......A senhora se importaria se for curry?"
221030-261 = ""
221030-263 = ""
221030-265 = "Próximo Episódio;Uniforme Branco e Curry"
