[translation]
221030-1 = "Episode 3;Ocean's Taboo"
221030-14 = "Now... since you have taken the trouble to visit us, how about a tour of the academy?"
221030-15 = "I appreciate the thought, but let us head straight to the student council room."
221030-16 = "However, [USERNAME]-sensei is visiting for the first time...#nWould it not be better to start with an introduction to the academy?"
221030-17 = "I appreciate your consideration, but both the sensei and I have tight schedules."
221030-18 = "Could we save the guided tour for another time?"
221030-19 = "It will not take much of your time."
221030-20 = "Besides, it is a tradition of Odyssey for the captain herself to welcome distinguished guests to the island."
221030-21 = "Tradition..."
221030-22 = "You expect us to follow the traditions of Odyssey as well?"
221030-23 = "Those who set foot on this ship are all equal. There are no exceptions."
221030-24 = "Is that so..."
221030-25 = "Just as I had heard, the captain of Odyssey is a strict principle without compromise."
221030-26 = "Hufu, I will take that as a compliment."
221030-31 = "........."
221030-32 = "Ugh, ughhh..."
221030-33 = "W-Whose side should I take in a situation like this...?#nIs the higher rank the General Student Council President...? Or is it the captain, who is our superior at the academy...?"
221030-38 = "[ns1] \"Um...\"\n[ns2] \"I think taking a quick tour of the academy would be fine...\""
221030-41 = "...If Sensei says so."
221030-47 = "[ns] \"...A cat?\""
221030-50 = "...Sammy, when did you climb all the way up here?#nCome on, go back."
221030-51 = "Meow~"
221030-52 = "It seems Sammy wants to welcome you as well."
221030-57 = "...Do you keep this cat on the island?"
221030-58 = "Yes. Usually it does not come up this far, but...#nIt seems to have been curious about an unfamiliar scent."
221030-62 = "(Sniff, sniff)"
221030-63 = "...To think we have such an adorable guide."
221030-64 = "A tour with this little one by our side should be quite enjoyable."
221030-65 = "Then it is settled."
221030-70 = "...Sammy, even if you act cute in front of the guests, I am not giving you any treats.#nYou have gotten a little heavy lately, you know."
221030-71 = "Meow..."
221030-73 = "[ns] \"I suppose keeping cats on ships is a thing.\""
221030-74 = "It is nothing unusual on Odyssey."
221030-75 = "At any rate, we can talk about Sammy later. Shall we move to another ship first?"
221030-77 = "[ns] \"We are going to a different ship?\""
221030-78 = "Yes. The Olympus is the flagship of our island."
221030-79 = "If I were to compare it to a land academy... perhaps the student council building would be the easiest way to understand."
221030-80 = "Club activities on Odyssey are built upon the premise of navigation.#nBecause of this, most clubs own their own ships."
221030-81 = "Since the scale and operational policies vary by club, comparing them is quite interesting."
221030-82 = "[s] \"I am getting excited...!\""
221030-83 = "First, allow me to introduce the largest club on Odyssey."
221030-85 = "[ns3] \"Where is this...?\"\n[ns4] \"It is a massive facility.\""
221030-88 = "This is the Aquaculture Research Club's aquaculture facility."
221030-89 = "It is no exaggeration to say that the food supply of Odyssey depends entirely on this place."
221030-90 = "The Aquaculture Research Club is not only the largest club on Odyssey, but also#nthe one allocated the most club budget."
221030-91 = "They cultivate a wide variety of things, including fish, octopus, squid, and seaweed."
221030-92 = "Because of this facility, no matter how long an ocean voyage lasts,#nwe never have to worry about food!"
221030-96 = "Indeed, at this scale, you can stably supply enough food to sustain the entire academy."
221030-97 = "However, would relying solely on marine products lead to a nutritional imbalance for the students?"
221030-98 = "You need not worry about that.#nThe health of the students is thoroughly monitored by the ship's medical room."
221030-99 = "Of course, we also take measures to ensure they do not get tired of the taste,#nsuch as extracting salt and spices from seawater and seaweed."
221030-100 = "However, that still does not mean we can replace all land-based ingredients..."
221030-101 = "When a voyage lasts several months, black market trades break out over the dwindling supply of desserts—"
221030-102 = "Captain, please refrain from saying such things in front of the guests..."
221030-103 = "It is truly troublesome!#nJust last month, Trident cracked down on a student trying to run a black market deal.#nShe tried to steal the last 10 bars of milk chocolate!"
221030-104 = "The exchange rate at the time was supposedly 10kg of frozen sardines per single bar of chocolate."
221030-105 = "[s] \"I cannot tell if that is expensive or cheap...\""
221030-106 = "...Komori-san."
221030-107 = "Ah, ahh! A-Apologies!"
221030-108 = "Well, various things happen... but even so, the ability to secure fresh fish at any time#nis a strength that no other academy can rival."
221030-109 = "Sensei. Please try holding this horse mackerel.#nHorse mackerel raised here grow as large as mackerels, so—"
221030-115 = "Sammy!"
221030-116 = "That stupid cat..."
221030-117 = "...Pardon me. I will go drag her back immediately."
221030-118 = "[s] \"No, let me try calling her.\""
221030-122 = "[ns] \"Sammy, come over here~\""
221030-123 = "...Ah."
221030-124 = "Was that... whistling?"
221030-125 = "Who is that? Who blew it?"
221030-126 = "Jeez, this is the worst. Even our stock of fenders is not sufficient."
221030-130 = "[ns] \"H-Huh...? Did I do something wrong?\""
221030-131 = "...It is a sailor's taboo."
221030-132 = "A taboo, you say..."
221030-133 = "Captain. May I leave the guidance of our two guests to you?#nI will catch Sammy and then catch up with you."
221030-134 = "Ah... o-okay. Understood."
221030-135 = "Then, I will join you again later."
221030-137 = "This is—"
221030-138 = "[s] \"Could this be a cruise ship?\""
221030-139 = "You are well-informed."
221030-140 = "The name of this ship is the Golden Elysium.#nIt is the flagship of the Cruise Operation Department, which handles all of Odyssey's tourism revenue,#nas well as our student dormitory."
221030-141 = "The Cruise Operation Department manages dozens of cruise ships#nand provides entertainment and services to our guests."
221030-142 = "For the most part, when people say they have visited Odyssey,#nthey are usually referring to these cruise ships."
221030-143 = "As for Sensei, surely you have used an Odyssey cruise ship before?"
221030-144 = "[s5] \"Well, I suppose you could say yes, and you could say no...\"\n[s6] \"There was a student wearing a rather strange outfit...\""
221030-147 = "Oh my. It seems you boarded a ship run by students of questionable conduct."
221030-148 = "I hear that ships operating outside the department's control force students to wear unauthorized clothing#nor charge exorbitant prices for goods to make unfair profits."
221030-149 = "I sincerely apologize on behalf of the academy for causing you an unpleasant experience."
221030-150 = "[s] \"No, no, it is not your fault.\" "
221030-151 = "Ah, the head of the Cruise Operation Department is right over there."
221030-152 = "Shall we ask her to introduce the department?"
221030-154 = "Oh my? Are you guests?"
221030-158 = "Welcome to the Golden Elysium. Have you completed your check-in?"
221030-159 = "...Ah, pardon my delayed introduction."
221030-160 = "I am Mitsuki Sengoku, the general manager of the Golden Elysium and head of the Cruise Operation Department.#nIt is a pleasure to meet you."
221030-161 = "[ns] \"Is her outfit not just as questionable?!\""
221030-162 = "Pardon me?"
221030-163 = "Could it be that my scarf is slightly crooked..."
221030-164 = "[s] \"No, well...\""
221030-165 = "Sengoku-san, just to ask to be safe..."
221030-166 = "Did you happen to... forget your bottoms?"
221030-167 = "Bottoms...?"
221030-168 = "Ah, it seems there has been a misunderstanding."
221030-169 = "Rest assured. These are swimwear, not undergarments."
221030-170 = "If they are not underwear, there is nothing to be embarrassed about, right?"
221030-171 = "[ns] \"Is that... so?\""
221030-172 = "Yes. This is a legitimate uniform of the Cruise Operation Department, approved by the island."
221030-173 = "While maintaining the traditional cruise crew uniform style on top,#nto allow for jumping into the ocean at any time, we adopted swimwear for the bottom."
221030-174 = "Since it is a uniform devised by the department head, all department members wear the same outfit."
221030-175 = "They should have no sense of shame... presumably."
221030-176 = "[ns] \"Why did you trail off at the end...\""
221030-177 = "You need not worry. After all, the uniform is not what matters most."
221030-178 = "Now, while you stay on Odyssey,#nour Cruise Operation Department will take care of your personal needs."
221030-179 = "Do you have any allergies?"
221030-180 = "How would you like your room?#nAn open room with an ocean view? Or perhaps an interior room closer to the banquet hall?"
221030-181 = "And might I ask which port you plan to disembark at?"
221030-182 = "Should you encounter any inconvenience during your stay, please feel free to ask your room maid.#nWe will respond to the best of our abilities."
221030-183 = "On the honor of the Cruise Operation Department—I guarantee you will be 100 percent satisfied with our service!"
221030-184 = "My, how ambitious.#n You seem quite confident in your own work."
221030-185 = "Of course. After all, not a single guest has ever voiced a complaint."
221030-186 = "If you have your doubts... care to make a wager?"
221030-187 = "I will wager the Golden Elysium itself on the Federal Student Council President giving us a score of 100!"
221030-188 = "The essence of gambling is a thrill! I will neither run nor hide.#nI will even prepare a contract so there is no room for excuses!"
221030-189 = "Now... now, now, what will the Federal Student Council President wager—"
221030-190 = "As usual, I see, Sengoku-san. What are you planning to wager this time?"
221030-191 = "Meow."
221030-192 = "A wager!? Why, whatever do you mean."
221030-193 = "Do not play innocent.#nIt is common knowledge that you have a habit of dragging guests into wagers."
221030-194 = "Is that why you ended up letting someone take the Golden Elysium for a song?"
221030-195 = "It was not taken for a song?! Can you take responsibility for that statement?"
221030-196 = "I will bet one million yen that your words are wrong—"
221030-201 = "Ouch!"
221030-202 = "Pardon me. She is quite capable, but she has a severe gambling addiction..."
221030-203 = "Should she ever try to propose a wager to you,#nit would be a great help if the two of you would simply pretend not to notice."
221030-204 = "[s] \"...I think I get the general idea.\""
221030-209 = "[ns] \"That bunny girl has nothing to do with the Cruise Operation Department, right?\""
221030-212 = "Ah... yes. You are referring to the costume mimicking an animal with long ears?"
221030-213 = "Naturally, the Cruise Operation Department would never approve of such an indecent costume."
221030-214 = "Never mind the bottoms, going without anything draped over your shoulders... how unseemly."
221030-215 = "...Could it be that bunny girls are also considered a taboo?"
221030-219 = "Ah, well... it is not a matter of the costume..."
221030-220 = "The word 'rabbit' is something sailors must avoid."
221030-221 = "We apologize for the inconvenience, but we ask for your understanding."
221030-222 = "[s] \"Sorry, I was not considerate enough.\""
221030-223 = "........."
221030-224 = "Now then, shall we move on to the next ship?"
221030-226 = "(After that, moving from ship to ship, we toured various clubs of Odyssey.)"
221030-236 = "(By the time the tour came to an end, the sun was beginning to sink below the horizon.)"
221030-238 = "Oh my, it is already this late..."
221030-239 = "I apologize, even though I said it would not take much of your time.#nIt seems I miscalculated our route."
221030-240 = "[s] \"Do not worry about it. It was meaningful.\""
221030-241 = "I found it much more enjoyable than expected as well."
221030-242 = "It has been a nice change of pace for once...#nand I was able to touch upon things I would never have known had I stayed cooped up."
221030-243 = "I am most glad to hear you say that."
221030-244 = "Now then, before we return to the student council room and get to the main business—"
221030-245 = "Would you care to join me for dinner?"
221030-246 = "Hufu, an invitation to dinner this time."
221030-247 = "If you are inviting us, I accept without hesitation."
221030-251 = "Captain, do you realize? Tonight's dinner is..."
221030-252 = "Ah, right. I completely forgot..."
221030-254 = "[ns] \"Is there a problem?\""
221030-255 = "No, I believe there are no issues with the preparation."
221030-256 = "It is just that... the menu for the first day of arrival is always set to 'that'."
221030-260 = "...Would curry be alright with you?"
221030-265 = "Next Episode;White Uniforms and Curry"
