[translation]
2003106-1 = "Внезапно"
2003106-2 = "Я заглянул в Бывший институт, чтобы посмотреть на недавно обновлённые ванны Шигурэ..."
2003106-3 = ""
2003106-5 = ""
2003106-6 = "Сенсей, мне стало интересно..."
2003106-7 = "Вы предпочитаете купаться в одиночестве или вместе с другими?"
2003106-8 = "[s] «С чего вдруг такой вопрос?»"
2003106-9 = "О... Да ни с чего. Просто вспомнила, что было раньше."
2003106-10 = "Лично мне нравится купаться большой компанией — так веселее."
2003106-11 = "Разве не приятно просто сидеть вместе в горячей воде? Никому нечего скрывать."
2003106-12 = "Но я выяснила, что многие студенты Бывшего института предпочитают купаться в одиночку."
2003106-13 = "В прошлый раз я пробралась в ванну, когда там была Нодока, и она разозлилась, что я прервала её время наедине с собой."
2003106-14 = "[s1] «У обоих вариантов есть плюсы и минусы...»\n[s2] «Но, наверное, стоит спрашивать, прежде чем присоединяться к кому-то в ванной.»"
2003106-17 = "Хмм... Значит, некоторые и правда так чувствуют..."
2003106-18 = "[s3] «...Ты ведь понимаешь, что не должна идти за мной, да?»\n[s4] «Тебе нельзя присоединяться ко мне, пока я купаюсь.»"
2003106-21 = "...А? Нельзя?"
2003106-22 = "Но было бы жаль упустить возможность лучше вас узнать, Сенсей."
2003106-23 = "Представьте, какие глубокие разговоры мы могли бы вести, когда совсем ничем не прикрыты..."
2003106-24 = "[s5] «Мы можем вести глубокие разговоры и во множестве других мест.»\n[s6] «Пожалуйста, дай мне хотя бы спокойно искупаться одному.»"
2003106-27 = "...Тц."
2003106-28 = ""
2003106-31 = ""
2003106-32 = "Ой, вот глупая. Я забыла взять морс, который приготовила для ванны."
2003106-33 = "Сенсей, хотите пойти первым? Мне нужно кое-что принести..."
2003106-34 = "Идите и спокойно понежьтесь. Я зайду после вас."
2003106-35 = "[s] «Хорошо, но, пожалуйста, не заходи, пока я не закончу...»"
2003106-37 = "Проводив Шигурэ обратно к зданию Бывшего института, я первым вошёл в ванну."
2003106-40 = "Ванну идеально очистили. От прежних странных ароматов не осталось и следа."
2003106-41 = "Пока я отмокал в горячей воде..."
2003106-42 = ""
2003106-46 = ""
2003106-47 = ""
2003106-48 = ""
2003106-49 = "[ns7] «...Шигурэ? Быстро ты.»\n[ns8] «Кажется, я просил не присоединяться ко мне.»"
2003106-52 = "..."
2003106-53 = "[ns] «(Через пар почти ничего не видно...)»"
2003106-55 = "[ns] «Осторожнее. Возле ванны не балуйся.»"
2003106-56 = "Шигурэ просто сидела в воде и молча смотрела на меня."
2003106-57 = "Возможно, из-за густого пара казалось, будто на ней надета толстая меховая шуба..."
2003106-58 = ""
2003106-61 = "[ns9] «...Шигурэ, ты вошла в воду прямо в одежде?»\n[ns10] «Ты какая-то... медленная...»"
2003106-64 = "..."
2003106-65 = ""
2003106-67 = ""
2003106-68 = ""
2003106-69 = "[ns11] «Т-Ты пьёшь воду из горячего источника?»\n[ns12] «Это негигиенично! Выплюнь!»"
2003106-72 = "*вздыхает*"
2003106-73 = "[ns] «(Дыхание Шигурэ звучит тяжелее обычного...)»"
2003106-75 = "[ns] «Я сейчас выйду. Не торопись.»"
2003106-78 = "Я быстро покинул горячий источник."
2003106-80 = ""
2003106-81 = "О, Сенсей. Вы уже закончили?"
2003106-82 = "Я как раз собиралась присоединиться к вам. Какая жалость..."
2003106-83 = "[s13] «Шигурэ? Ты всё ещё здесь?»\n[s14] «Тогда кто присоединился ко мне в воде...?»"
2003106-86 = "В горячем источнике с вами был кто-то ещё?"
2003106-87 = "Конечно. Это наверняка был..."
2003106-88 = "...медведь."
2003106-89 = ""
2003106-92 = "[ns] «...Медведь?!»"
2003106-93 = "Да. Когда мы управляли Курортом горячих источников №227, медведи иногда спускались с гор и отмокали в воде."
2003106-94 = "Курорт, может, и закрыт, но они всё ещё время от времени приходят искупаться."
2003106-95 = "Но насладиться ванной с Сенсеем раньше меня... Не могу поверить, что ревную к медведю."
2003106-96 = "[s] «Так всё это время я разговаривал с медведем...»"
2003106-97 = "Полагаю, после такого опыта вы уже не захотите возвращаться в воду...?"
2003106-98 = "Хорошо. Тогда я пойду купаться одна. Пожалуйста, присмотрите за моими вещами."
2003106-99 = ""
2003106-101 = ""
2003106-103 = "Ожидая, пока Шигурэ закончит, я снова и снова прокручивал в голове ужас встречи с купающимся медведем."
