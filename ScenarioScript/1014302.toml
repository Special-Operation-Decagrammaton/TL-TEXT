[translation]
1014302-1 = "Waterbed"
1014302-2 = "(I came to the valley's waterside with Shun...)"
1014302-6 = "Wow... the water is cool and feels refreshing."
1014302-7 = "[s] \"You're a good swimmer.\""
1014302-8 = "Hehe, thank you."
1014302-9 = "As someone who teaches children, I have to be able to swim at least a little bit."
1014302-10 = "Besides, I've always liked swimming."
1014302-11 = "[s] \"Is that so?\""
1014302-12 = "Yes, I can't get enough of this indescribable feeling of weightlessness."
1014302-13 = "It frees you from gravity, so you can relax."
1014302-14 = "Also, swimming is effective for beauty in many ways..."
1014302-15 = "Among aerobic exercises, it has a high calorie burn."
1014302-16 = "Because pools use chlorine-based disinfectants—"
1014302-17 = "it's said that they aren't very good for the skin..."
1014302-18 = "Even so, I think it's good exercise."
1014302-19 = "...Are you good at swimming, Sensei?"
1014302-20 = "[s1] \"I guess I'm alright.\"\n[s2] \"It's nothing special.\""
1014302-23 = "In that case... please come over here."
1014302-24 = "It's shallow around here, so don't worry."
1014302-25 = "And if anything happens, I'll be here to help you."
1014302-28 = "(I slowly walk toward Shun)"
1014302-31 = "It feels like I'm lying on a waterbed."
1014302-32 = "[ns] \"A real \"waterbed,\" isn't it?\""
1014302-33 = "Hehe, it's funny how your voice sounds different than usual, Sensei."
1014302-34 = "If you'd like, would you like to join me?"
1014302-35 = "...You're right, it might be dangerous if both of us get swept away."
1014302-36 = "Hehe, in that case..."
1014302-37 = "could you just watch over me for a little while like this?"
1014302-38 = "(I quietly watched Shun floating for a while)"
1014302-42 = "That's right. I had some fruit chilling in the water— would you like to have some?"
1014302-43 = "Watermelon, melon, peaches, grapes, plums... I didn't know your preferences, so I brought a variety."
1014302-44 = "[s] \"T-that's a lot...\""
1014302-45 = "Hehe. If there's any left, I'll take it home, so please eat whatever you like."
1014302-47 = "(Shun peels the fruit with skilled hands)"
1014302-48 = "(As I was watching her do that... a piece of peach was suddenly put into my mouth)"
1014302-53 = "How does it taste?"
1014302-54 = "[ns] \"I-it's very sweet and delicious.\""
1014302-55 = "And?"
1014302-56 = "[ns] \"It's so juicy...\""
1014302-57 = "Hehe, I think it's because I peeled it while thinking of you eating it, Sensei."
1014302-58 = "[ns] \"Y-yeah. I guess...!\""
1014302-59 = "Hehe, there's still plenty more, so please eat as much as you'd like."
1014302-61 = "(I enjoyed the summer fruit together with Shun)"
1014302-63 = "Now then, Sensei..."
1014302-64 = "would you like to try a \"waterbed\" too?"
1014302-65 = "[s] \"Eh, me too?\""
1014302-66 = "It's fine. Just leave it to me."
1014302-67 = "Relax, lie on your back—"
1014302-72 = "take a deep breath, and spread your arms and legs out... #nSee? Your body will slowly start to float."
1014302-73 = "Just in case... I'll support your head, Sensei."
1014302-75 = "(Doing as Shun said—)"
1014302-79 = "(My body slowly began to float.)"
1014302-82 = "How is it?"
1014302-83 = "[ns] \"You're right. My voice sounds different than usual...\""
1014302-84 = "Hehe, see?"
1014302-85 = "And you feel very relaxed, don't you?"
1014302-86 = "...If you move your head slowly, you can see the scenery around us."
1014302-87 = "Please be careful, as moving it too much might make you lose your balance."
1014302-90 = "It's a truly beautiful day today, isn't it?"
1014302-91 = "Under the shining sun—"
1014302-92 = "The murmuring of the river feels soothing."
1014302-93 = "Being like this... it's as if—"
1014302-94 = "It feels like there is no one in this world but you and me, Sensei."
1014302-95 = "(The strength left my body... and my head started to feel hazy.)"
1014302-100 = "If that were to really happen, it would be a disaster, but..."
1014302-101 = "Just for a little while, perhaps..."
1014302-102 = "(The summer sun was scorching hot, but the water was inversely cold.)"
1014302-103 = "(The sounds around me began to fade away, little by little...)"
1014302-107 = "If I could be alone with you, where no one is watching..."
1014302-108 = "Yes, just like now..."
1014302-109 = "(My head feels... light...)"
1014302-110 = "..."
1014302-111 = "What would you like to do, Sensei?"
1014302-112 = "[ns] \"...\""
1014302-113 = "Se—Sensei? Sensei!?!?"
1014302-118 = "You cannot fall asleep in a place like this!!!"
1014302-120 = "[ns] \"That was close...\""
1014302-121 = "You startled me too..."
1014302-122 = "If you fall asleep in the water, your body temperature will drop, and that's#ndangerous."
1014302-126 = "(Just then, I let out a sneeze.)"
1014302-127 = "Ah, are you alright, Sensei!?"
1014302-128 = "Oh... do you feel chilly?"
1014302-129 = "You have to be careful. It's easy to catch a cold by the water in summer."
1014302-130 = "Come on, sit over here. Let's warm your body up with a towel."
1014302-131 = "(Shun wrapped my body in a large towel.)"
1014302-132 = "(And then...)"
1014302-138 = "[ns] \"Sh-Shun...?\""
1014302-140 = "...Hehe."
1014302-141 = "To warm up your body, cuddling like this is the most effective way."
1014302-142 = "I have no other secret motives."
1014302-143 = "Yes, really."
1014302-144 = "[ns] \"I-Is that so...?\""
1014302-150 = "(The next moment, Shun wrapped her arms around my waist along with the#ntowel...!)"
1014302-152 = "How about it, Sensei?"
1014302-153 = "Wouldn't you like to... get even warmer?"
1014302-154 = "[s] \"Y—Yeah, that's right...!\""
1014302-155 = "Hehe, I'm glad."
1014302-156 = "Because I don't want anything to happen to you, Sensei."
1014302-158 = "(And so, we press our bodies together until we are warm.)"