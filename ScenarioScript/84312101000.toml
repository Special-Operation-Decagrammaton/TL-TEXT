[translation]
84312101000-6 = "Рио...!! Рио...!!"
84312101000-7 = "Я знаю, что происходит. Нам нужно двигаться сейчас же."
84312101000-8 = "Это серьёзно? В самый последний момент..."
84312101000-9 = "Наверное, это и было то предчувствие, о котором ты говорила."
84312101000-10 = "Похоже на то."
84312101000-11 = "Прошлой ночью ЭТОГО точно не было ни возле выставочного зала, НИ где-либо на территории кампуса. Значит, оно ушло, а потом вернулось."
84312101000-12 = "Для штуки такого размера... возможен только один маршрут."
84312101000-13 = "...Подземный переход."
84312101000-14 = "Там мы впервые встретились."
84312101000-16 = "Не совсем так я хотела замкнуть круг."
84312101000-17 = "Времени нет. Если оно сумеет уйти отсюда, неизвестно, когда вернётся снова. И не отправится ли в другую школу."
84312101000-18 = "Давайте возьмём его."
84312101000-19 = "Фуфу, неожиданный подарок к окончанию Экспо."
84312101000-20 = "Ты называешь ЭТО подарком?"
84312101000-21 = "Ха...! Ладно, я и думала, что что-нибудь подобное обязательно случится."
84312101000-22 = "Я обеспечу любую удалённую поддержку, которая понадобится — и в бою, и вне его."
84312101000-23 = ""
84312101000-25 = ""
84312101000-27 = "Ладно, финальный бой! Вперёд!"
84312101000-28 = "Ага!"
