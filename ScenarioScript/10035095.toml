[translation]
10035095-3 = "*тяжело дышит* *тяжело дышит*"
10035095-4 = "Вражеский Мехагатор: деактивация подтверждена!"
10035095-5 = "Функциональность отключена!"
10035095-6 = "Ага, если судить по дыму из двигателя, мы его поджарили."
10035095-7 = ""
10035095-9 = ""
10035095-11 = ""
10035095-12 = "Фух...!"
10035095-13 = "Ха-ха-ха!"
10035095-14 = "О, что, уже всё? Больше не тянешь? Ха-ха!"
10035095-16 = "Смелые слова после того, как ты носилась как сумасшедшая и швырялась гранатами..."
10035095-19 = "[ns] «Отличная работа, все.»"
10035095-20 = "Это благодаря вам и вашим указаниям, Сенсей."
10035095-21 = "Спасибо за всю вашу тяжёлую работу."
10035095-22 = ""
10035095-24 = ""
10035095-25 = "Т-Там он! Стреляйте, стреляйте!"
10035095-26 = "Босс, он уже уничтожен."
10035095-27 = "...А?"
10035095-28 = "Уничтожен — в смысле сломан?"
10035095-30 = "Верно. Мехагатор больше не должен доставлять вам проблем."
10035095-31 = "Уверена, дальше вы справитесь сами."
10035095-33 = "Д-Да, конечно!"
10035095-34 = "Сюда, сюда! Быстрее!"
10035095-35 = ""
10035095-38 = ""
10035095-40 = "Сначала доставьте раненых в медпункт! Комфорт посетителей превыше всего!"
10035095-42 = ""
10035095-43 = "Есть, сэр!"
10035095-46 = ""
10035095-47 = "Ай... Я растянул лодыжку, пока бегал."
10035095-48 = "Пойдём в медпункт."
10035095-51 = "Я-Я потеряла друзей в толпе!"
10035095-52 = "Опиши, как они выглядят, и я помогу их найти."
10035095-55 = "[ns1] «Ну, всё хорошо, что хорошо кончается.»\n[ns2] «По крайней мере, всё закончилось.»"
10035095-58 = "Ага, пожалуй, есть и хорошая сторона."
10035095-59 = "Ещё немного драки — и всю внутреннюю часть парка разнесли бы безвозвратно."
10035095-60 = "Что важнее, похоже, никто серьёзно не пострадал."
10035095-61 = "Одна проблема решена!"
10035095-62 = ""
10035095-64 = ""
10035095-66 = ""
10035095-67 = "То есть хорошо, что мы его уничтожили, но..."
10035095-68 = "...вам не кажется, что тут осталось несколько нерешённых вопросов?"
10035095-70 = "Хм?"
10035095-72 = "Вы ведь видели? Когда аллигатор попытался атаковать Дикую Гончую..."
10035095-73 = ""
10035095-75 = ""
10035095-77 = "...он замер, да?"
10035095-78 = "И да, так было проще закидать его гранатами, но... что именно тогда произошло?"
10035095-80 = "Может, у него просто случился сбой именно в тот момент."
10035095-81 = "Или он увидел директора и решил отступить? Сменить курс?"
10035095-83 = "Это вообще имеет смысл? Он уже собирался ударить."
10035095-84 = ""
10035095-86 = ""
10035095-87 = "Так что за фокус ты тут провернула, Дикая Гончая?"
10035095-89 = "Я не занимаюсь фокусами. Никогда."
10035095-90 = "Тогда как ТЫ это объяснишь?"
10035095-91 = "Я... понятия не имею."
10035095-92 = "[s] «Нужно внимательнее осмотреть Мехагатора и понять, как он работает.»"
10035095-94 = "Логично. Всё равно нельзя просто оставить его валяться."
10035095-95 = "Безопасно ли в нём ковыряться?"
10035095-97 = "Мы уже в нём «поковырялись», и теперь это просто куча металлолома. Кого волнует?"
10035095-102 = "Посмотрим... Ого, эта штука не только прочная, внутри всё ещё и очень сложно."
10035095-103 = "Да, качество обработки и плавность сочленений явно указывают на опытного мастера."
10035095-105 = "Тогда два вопроса: кто способен такое сделать и кому это понадобилось?"
10035095-106 = "Ну, вскрываем."
10035095-107 = ""
10035095-109 = ""
10035095-114 = ""
10035095-115 = "[ns3] «Эти схемы... чрезвычайно сложные.»\n[ns4] «Даже вблизи я ничего здесь не понимаю.»"
10035095-118 = "Ого, я вообще не понимаю, как это работает. Ясно только одно: это точно не любительский проект."
10035095-119 = "От одного взгляда голова кругом…"
10035095-120 = "Я тоже ничего не понимаю. Могли бы хотя бы поставить где-нибудь клеймо с именем."
10035095-121 = ""
10035095-125 = "О! Вон там!"
10035095-126 = ""
10035095-128 = ""
10035095-129 = "[ns5] «Что?»\n[ns6] «Этот голос...?»"
