83302600400-6 = ""
83302600400-7 = "(Она ведь ничего не может поделать с тем, на что Общество гурманов готово ради еды...)"
83302600400-8 = "(...И всё же похитить Фууку прямо посреди всего этого хаоса.)"
83302600400-9 = "(От клуба, состоящего в списке наблюдения Геенны, большего ожидать и не стоило. Я прослежу, чтобы до конца этого кризиса мы не спускали с них глаз.)"
