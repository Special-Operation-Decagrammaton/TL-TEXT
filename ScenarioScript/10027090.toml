[translation]
10027090-1 = "Эпизод 9; «Предложение» Секретариата"
10027090-4 = "Снежные поля Красной Зимы"
10027090-5 = ""
10027090-6 = "*тяжело дышит* *тяжело дышит*"
10027090-7 = "Почему Красная Зима такая огромная...?"
10027090-8 = "Раз у тебя хватает дыхания говорить, значит, бежишь недостаточно быстро!"
10027090-9 = "Эм...? Что там впереди—"
10027090-10 = "Что?!"
10027090-11 = ""
10027090-13 = ""
10027090-15 = ""
10027090-16 = "Приветствуем, Фронт освобождения знаний. Мы здесь от имени Секретариата Красной Зимы."
10027090-18 = "Ч-Что? Что вы...?"
10027090-20 = "Я хотела бы поздравить Фронт освобождения знаний с его достижениями. Возрадуйтесь!"
10027090-22 = "...Не знаю, о чём вы там говорите, но, пожалуйста, заканчивайте быстрее. Мы заняты!"
10027090-24 = "Скажу коротко. В Секретариат поступила информация, что легендарный Сенсей из Шале работает с Фронтом освобождения знаний над созданием... фанфика."
10027090-26 = "К-Кто вам сказал?!"
10027090-28 = "Арамаки Якумо."
10027090-30 = "Она?!"
10027090-32 = "Да. В ответ Секретариат провёл расследование этого так называемого фанфика и связанных с ним событий."
10027090-33 = "И мы решили наградить вас Президентской усатой медалью за старание."
10027090-34 = "Фронт освобождения знаний должен считать это величайшей честью."
10027090-36 = "Эм... Спасибо, наверное, но..."
10027090-37 = "(Я бы лучше напечатала книгу, чем получила какую-то дурацкую медаль...)"
10027090-39 = "Но я забегаю вперёд. Видите ли, я не могу вручить вам эту медаль, пока вы не выполните одно условие."
10027090-40 = "Если Фронт освобождения знаний хочет получить медаль..."
10027090-42 = "...чтобы распространить славу милоты и очарования великой президента Черины... мы требуем, чтобы она появилась в вашем фанфике как приглашённый персонаж!"
10027090-43 = "Только представьте: очарование Черины заставит ваш фанфик сиять словно солнечный свет, согревая сердце каждого студента Красной Зимы, которая его прочитает!"
10027090-44 = "Разве это не будет великолепное зрелище?!"
10027090-45 = "[s] «О да, зрелище будет ещё то...»"
10027090-47 = "Знаете, если подумать, можно вообще отдать ей главную роль. Сделаете так — и получите ещё и Президентскую усатую медаль за достижения!"
10027090-49 = "..."
10027090-51 = "Не говори глупостей! У нас осталось меньше трёх часов!"
10027090-52 = "Если хотите видеть президента Черину, пусть Секретариат пишет собственную мангу! Или ещё лучше — закажите её у меня за небольшую плату, от которой я, конечно же, откажусь!"
10027090-54 = "Отлично сказано, Мэру! Ничего другого я от тебя и не ожидала!"
10027090-55 = "А теперь. Мы ужасно заняты, так что перестаньте нас отвлекать! Не нужна нам ваша вонючая медаль!"
10027090-56 = "Похоже, вы забыли кое-что важное, поэтому напомню. Фронт освобождения знаний борется за знания, а не за медали!"
10027090-57 = "Знание — сила! И мы ОБЯЗАТЕЛЬНО его защитим!"
10027090-58 = "[s] «Прости. В этот раз компромисса не будет. Я не могу вам помочь.»"
10027090-60 = "..."
10027090-61 = "Понятно. Что ж, я знала, что будет нелегко."
10027090-62 = "Поэтому у меня есть запасной план. Я использую всю мощь Секретариата, чтобы вас убедить."
10027090-64 = "Ч-Что вы собираетесь делать?"
10027090-65 = "У меня снова это плохое предчувствие..."
10027090-67 = ""
10027090-69 = ""
10027090-70 = ""
10027090-71 = ""
10027090-74 = ""
10027090-75 = ""
10027090-77 = "Секретариат не гнушается принуждением. Мы добьёмся, чтобы президент Черина появилась в собственном фанфике!"
