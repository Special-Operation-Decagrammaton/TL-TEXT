10039060-11 = "Вы это видели, да?"
10039060-12 = "Едва успела. Она пронеслась мимо нас."
10039060-13 = "Это было так круто..."
10039060-14 = "...Но есть вопрос."
10039060-15 = "Та, кто ехала... Она была похожа на...?"
10039060-16 = "Да, я тоже её видела."
10039060-17 = ""
10039060-19 = ""
10039060-20 = "Она выглядела как Сестра."
10039060-23 = "Я поспешил к месту, о котором сказала Мари."
10039060-24 = "Сенсей!"
10039060-25 = ""
10039060-29 = "[ns1] «Мари...?»\n[ns2] «Ого, ты и правда НА мотоцикле.»"
10039060-34 = ""
10039060-35 = "Простите, что вытащила вас сюда, но, как я сказала, дело очень срочное!"
10039060-36 = "Е-Если вы не против... можете сесть сзади? Я отвезу вас на площадь Тринити."
10039060-37 = "Если вы будете там, возможно, мы сможем остановить то, что надвигается..."
10039060-38 = "[s3] «Объяснишь по дороге. Поехали.»\n[s4] Сесть на заднее сиденье мотоцикла."
10039060-41 = "Хорошо!"
10039060-42 = "Поехали! Держитесь крепче!"
10039060-43 = ""
10039060-45 = ""
10039060-46 = ""
10039060-50 = "Откуда вдруг взялась такая толпа?"
10039060-51 = "Ты не слышала? Здесь скоро будет дуэль. Два клуба собираются объединиться и сразиться, чтобы решить, кто станет лидером!"
10039060-52 = "Правда...? Это было запланировано? И почему сегодня, прямо посреди Карнавала?"
10039060-53 = "Может, именно поэтому. Хотели сделать объявление перед большой толпой."
10039060-54 = "Хм, что же это может быть...?"
10039060-55 = "Внезапная дуэль? Я ничего об этом не слышала...!"
10039060-56 = "Но в этом есть смысл. Нет лучшего времени, чтобы объединиться и выбрать лидера."
10039060-57 = "А дуэль — самый... прямолинейный и надёжный способ."
10039060-58 = "О чём ты вообще говоришь?! Никакого смысла! Это странно! Что-то не так!"
10039060-60 = "Согласна. Нам стоит сохранять бдительность."
10039060-61 = "Может, всё началось с какого-то мелкого спора, который потом разросся."
10039060-62 = "Или причина ещё глупее..."
10039060-63 = "...Хи-хи. В любом случае это должно быть интересно, так что немного посмотрю."
10039060-64 = "«Интересно»?"
10039060-66 = "А? Что происходит? ...Я ничего об этом не слышала."
10039060-67 = "Это серьёзно? Ты пробовала позвонить Сакурако?"
10039060-68 = "Я-Я УЖЕ пытаюсь, но она почему-то не отвечает."
10039060-69 = "Я ещё писала ей, но она просто оставила сообщение «прочитанным.»"
10039060-70 = "Но почему? Здесь правда что-то происходит?"
10039060-71 = "Может, у неё есть какой-то секретный план, о котором она рассказала только некоторым."
10039060-72 = "Мы не всегда можем знать, чем она занимается."
10039060-73 = "Но если это правда..."
10039060-74 = "Если Сакурако и капитан Минэ действительно собираются драться..."
10039060-75 = "...Сакурако точно проиграет! Мы же говорим о капитане Минэ!"
10039060-76 = "Д-Да, ты права. Тогда..."
10039060-77 = "Наверное, нам нужно как-то к этому подготовиться..."
10039060-78 = "Да!"
10039060-80 = "Ч-Что-то странное происходит."
10039060-81 = "Дуэль...? Капитан Минэ что-нибудь вам об этом говорила?"
10039060-82 = "Нет, я впервые слышу."
10039060-83 = "Она лидер, так что МОЖЕТ это сделать, но зачем ей это?"
10039060-84 = "Может, где-то произошло недоразумение..."
10039060-85 = ""
10039060-91 = "Уф, ах...! П-Пожалуйста, успокойтесь. Все, успокойтесь!"
10039060-92 = "Я знаю, что вы слышали, но мы здесь НЕ ВСЕ ради драки, если вы так думаете."
10039060-93 = ""
10039060-96 = "Понятно?"
10039060-97 = "О, это же..."
10039060-98 = ""
10039060-100 = ""
10039060-101 = ""
10039060-102 = "...На..."
10039060-103 = "...Нагиса из Чаепития?!"
10039060-107 = ""
10039060-108 = ""
10039060-109 = ""
10039060-110 = "Эм, эй, Наги...?"
10039060-111 = "Это точно правильно? Всё серьёзно? Как ни думаю, что-то здесь не сходится..."
10039060-112 = "Они бы не стали просто так драться... в такой день... в таком месте. Наверняка какое-то недоразумение."
10039060-113 = "Мне кажется, наше присутствие здесь сделает всё ещё страннее. Давай отойдём и ещё раз всё обдумаем, хорошо? ...Наги?"
10039060-115 = "...Мика."
10039060-116 = "Чаепитие всегда должно быть готово к любой возможности. А это всё больше становится не возможностью, а уверенностью."
10039060-117 = "Посмотри туда. Видишь силы Сестринства и Рыцарей скорой помощи?"
10039060-118 = "Думаешь, это будет чистая дуэль? Если что-то пойдёт не так, придётся перейти к плану Б и взять ситуацию под контроль силой."
10039060-119 = "Из-за этого Тринити может скатиться в гражданскую войну."
10039060-120 = "И, как ты сказала, сегодня важный день. Его проводим мы. Значит, и ответственность на нас. Было бы недопустимо потерять контроль."
10039060-121 = "Будь готова сражаться."
10039060-122 = ""
10039060-124 = ""
10039060-125 = ""
10039060-126 = ""
10039060-127 = "...Погоди, я?!"
10039060-128 = "Что?! Ты шутишь? Ты хочешь, чтобы Я дралась?!"
10039060-129 = "Ты серьёзно, Наги?! Поэтому ты привела меня сюда?"
10039060-130 = "Ради мира в Общей школе Тринити! Ты — военная сила Чаепития!"
10039060-131 = "Нет, нет! Нет-нет-нет!"
10039060-132 = "Даже не проси меня! Я сейчас ВООБЩЕ не в том положении, чтобы пытаться захватывать власть!"
10039060-133 = "Ты с ума сошла, Наги?! Возьми себя в руки! Я..."
10039060-134 = "Мне нужно что-то сделать. Я должна позвонить Сенсею и...!"
10039060-138 = ""
10039060-139 = ""
10039060-140 = "..."
10039060-141 = "А вот и они. Зачинщицы."
10039060-142 = ""
10039060-144 = ""
10039060-147 = ""
10039060-148 = "...Ты как раз вовремя, Сакурако."
10039060-149 = "Тебе хватило времени всё обдумать?"
10039060-150 = "Конечно. Я бы не хотела заставлять тебя ждать."
10039060-151 = "Особенно когда на кону наше лидерство."
10039060-153 = "Ставки высоки, да?"
10039060-154 = ""
10039060-157 = ""
10039060-158 = ""
10039060-159 = "Но... откуда здесь взялась такая толпа?"
10039060-160 = "Я вижу много Сестёр."
10039060-161 = "И Рыцарей скорой помощи. Здесь происходит что-то ещё?"
10039060-162 = "Может, стоит спросить."
10039060-163 = "...Я не верила, но это правда."
10039060-164 = ""
10039060-166 = ""
10039060-167 = ""
10039060-168 = "Сестра, капитан, вы двое куда смелее, чем я думала."
10039060-170 = "...Нагиса из Чаепития?"
10039060-171 = "Разве ты не должна заниматься Карнавалом? Что ты здесь делаешь?"
10039060-173 = "Будто ты не знаешь. Думаешь, я дура?"
10039060-175 = "..."
10039060-176 = "...? Что?"
10039060-178 = "Как хозяйка Чаепития, я официально требую от вас обеих заявить о своих намерениях."
10039060-179 = "Для чего это собрание? Говорите. Сейчас."
10039060-180 = "...Чтобы уточнить: вы спрашиваете КАК «хозяйка Чаепития,» а не как председатель комитета Карнавала?"
10039060-181 = "Хм? Верно. В этом есть проблема?"
10039060-182 = "...Нет, совсем нет."
10039060-183 = "Тогда, если кратко, хозяйка Чаепития..."
10039060-184 = ""
10039060-186 = ""
10039060-187 = "...это не ваше дело."
10039060-188 = "..."
10039060-189 = "(сверлит взглядом)"
10039060-190 = "...Мика!"
10039060-191 = "Наги, нет, подожди. Здесь правда что-то не так. Не думаю, что..."
10039060-192 = "Давай просто ещё немного с ними поговорим, пожалуйста..."
10039060-193 = "МИКА!"
10039060-194 = "Ааа! Наги, пожалуйста!"
10039060-195 = "Уф...! Ладно. Только не вини меня потом!"
10039060-196 = ""
10039060-198 = ""
10039060-200 = ""
10039060-201 = "...Что она...?"
10039060-202 = "Ты заряжаешь оружие? Среди бела дня, посреди площади, у всех на глазах?"
10039060-203 = "Чаепитие окончательно сошло с ума?"
10039060-204 = "Хорошо. Каковы бы ни были ваши причины бросить нам вызов, мы его принимаем."
10039060-205 = "К оружию, Сакурако. Их подкрепление приближается!"
10039060-207 = "...А? М-Мне тоже?"
10039060-208 = "Сейчас!"
10039060-209 = "Эм... А? Гяаа...!"
10039060-210 = "Ч-Что происходит? Почему всё вдруг началось?!"
10039060-211 = "Так вот чего ты добивалась, Сакурако!"
10039060-212 = "Всем членам — готовиться к бою!"
