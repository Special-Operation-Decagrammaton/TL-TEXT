[translation]
10053070-1 = "Эпизод 7;Лучшая страшилка"
10053070-2 = ""
10053070-3 = "А, Коноха. Сенсей."
10053070-4 = "Что с вами двумя случилось? Мы уже собирались отправлять поисковую группу!"
10053070-5 = "И почему вы оба такие потные? И запыхавшиеся?"
10053070-6 = ""
10053070-8 = ""
10053070-9 = ""
10053070-10 = "Ох, Рэна, я не хочу об этом говорить... Это был отчаянный поступок!"
10053070-11 = "[ns1] «Ничего не случилось...!»\n[ns2] «Ну, КОЕ-ЧТО всё-таки случилось...»"
10053070-14 = ""
10053070-15 = ""
10053070-16 = "...? Что-то ТОЧНО случилось."
10053070-18 = "Я рассказал о происшествии в телефонной будке."
10053070-19 = "После этого мы сравнили всё, что знали о ней, подозрительном автобусе и каменной кукле."
10053070-21 = ""
10053070-22 = "Что?! Это был ПРИЗРАЧНЫЙ АВТОБУС? Я угрожала ПРИЗРАКУ? Почему вы мне не сказали?"
10053070-23 = "Потому что ты бы испугалась и запаниковала, очевидно же."
10053070-24 = "Соль! Срочно посыпать всё вокруг солью!"
10053070-25 = "Сенсей, в поте много соли. Может, мы защищены?"
10053070-26 = ""
10053070-27 = "[ns3] «Звучит неоднозначно...»\n[ns4] «Но когда вернёмся, всё равно надо принять душ...»"
10053070-30 = ""
10053070-31 = ""
10053070-32 = "Если всё это правда, похоже, вы двое столкнулись с полтергейстом."
10053070-33 = "Хотя полтергейсты прежде всего известны тем, что двигают предметы и заставляют свет мерцать, они также способны вызывать резкие перепады температуры."
10053070-34 = ""
10053070-36 = ""
10053070-37 = "Но странно. У меня... довольно большой опыт в этой области..."
10053070-38 = "...А за последние двадцать четыре часа я столкнулась с большим количеством паранормальных явлений, чем за всю свою карьеру."
10053070-39 = ""
10053070-41 = ""
10053070-42 = "Я тоже это заметила."
10053070-43 = "То есть ты намекаешь, что за всем этим кто-то стоит?"
10053070-44 = "А? Вовсе нет... Я лишь отмечаю, что плотность паранормальных происшествий оказалась исключительно высокой."
10053070-45 = "Возможно, мы находимся над древними руинами, или пришельцы проводят над этой местностью эксперименты."
10053070-46 = "Ты серьёзно...? Нет, ты реально серьёзно."
10053070-47 = ""
10053070-49 = ""
10053070-50 = "...Может, за этим стоят Семеро заключённых?"
10053070-51 = "Здравый смысл подсказывает, что всё это не может быть совпадением. Логично предположить, что кто-то целится именно в нас."
10053070-52 = "Кто из Семерых заключённых способен на такое?"
10053070-53 = ""
10053070-55 = ""
10053070-56 = ""
10053070-57 = "Хм-м, пока это не призрак, меня устраивает."
10053070-58 = "Если это та преступница, о которой я думаю... я не удивлюсь. Она любит всё планировать. И всегда пугающе хорошо подготовлена."
10053070-59 = "Это та же заключённая, которую ты подозревала в прошлый раз?"
10053070-60 = "Вообще-то, да."
10053070-61 = "Уф... Ненавижу это. Из всех мест на свете почему Цучиноко должен был появиться именно здесь?"
10053070-62 = "Или, МОЖЕТ БЫТЬ, именно это и привлекло Цучиноко?"
10053070-63 = ""
10053070-65 = ""
10053070-66 = ""
10053070-67 = ""
10053070-68 = "Подождите. Я вижу фары! Сядем в такси, вернёмся в домик..."
10053070-69 = ""
10053070-72 = "...и подумаем... об этом..."
10053070-73 = ""
10053070-76 = "...?"
10053070-79 = "...?!"
10053070-81 = "ЭЙ! АХ ВЫ МЕЛКИЕ ЗАСРАНЦЫ! С МЕНЯ ХВАТИТ!"
10053070-82 = "Тут... слишком много всего происходит."
10053070-83 = "Ужасно несвязно. Скорее запутывает, чем пугает..."
10053070-84 = "СЛУШАЙТЕ, Я ВООБЩЕ НЕ СОБИРАЛСЯ ЗАСТАВЛЯТЬ ВАС САДИТЬСЯ! НО ВАМ ОБЯЗАТЕЛЬНО БЫЛО УГРОЖАТЬ МНЕ ШТРАФОМ?"
10053070-85 = "И ПАЛИТЬ ВО ВСЕ СТОРОНЫ ПО МОЕЙ ТЕЛЕФОННОЙ БУДКЕ?"
10053070-86 = "И КТО В ЗДРАВОМ УМЕ КОПАЕТ НА ВОСЕМЬ МЕТРОВ ВГЛУБЬ?"
10053070-87 = ""
10053070-88 = ""
10053070-89 = "Похоже, они серьёзно затаили обиду."
10053070-90 = "Ещё хватает наглости говорить о «здравом уме»..."
10053070-91 = "Даже Коноха это страшным не назовёт..."
10053070-93 = "А-а-а?! Что это?!"
10053070-94 = "Ой. Неважно."
10053070-96 = "Ты! Серебряный дьявол! Это всё твоя вина!"
10053070-97 = "Я покажу тебе настоящий ужас!!"
10053070-99 = "Они идут на Коноху! Осторожно!"
10053070-101 = "А-а-а-а, а-а-а..."
10053070-103 = "О нет! Она застыла от страха!"
10053070-104 = "Эй! Если хотите разыграть страшилку, следуйте сценарию! Нельзя просто давить людей! Лучше напугайте меня! Слабо?!"
10053070-106 = "Высшая форма страшилки — создать её самой!"
10053070-107 = "Хватит врать!! Ты вообще не призрак, да?"
10053070-108 = "...А?"
10053070-110 = "Ты так напугана, что даже кричать не можешь! Вот и всё!"
10053070-111 = "Нет! Коноха, тебя сейчас собьют! Ты должна увернуться! Пожалуйста!"
10053070-112 = "С-Сенсей!"
10053070-113 = "[ns5] «Я разберусь!»\n[ns6] «Заберите Коноху и бегите...!»"
10053070-119 = "..."
10053070-120 = ""
10053070-124 = "А-а-а-а!"
10053070-129 = "..."
10053070-130 = ""
10053070-131 = ""
10053070-132 = "..."
10053070-133 = ""
10053070-135 = ""
10053070-136 = "О-о-о-ой! Это о-о-очень больно!"
10053070-137 = "Ах! Уф! О-о-о, жёстко было."
10053070-139 = ""
10053070-140 = ""
10053070-141 = "Что... сейчас произошло?"
10053070-142 = "Цубаса, ты это видела?"
10053070-143 = "[s7] «Она уничтожила его... кулаком...»\n[s8] «Это был великолепный прямой удар.»"
10053070-146 = "Ах, серьёзно... Как ты... до самого конца?"
10053070-147 = "Это просто не имеет смысла..."
10053070-148 = "*помехи*"
10053070-149 = "Цубаса? Эй, Цубаса?"
10053070-150 = ""
10053070-152 = ""
10053070-153 = ""
10053070-154 = ""
10053070-155 = "Сенсей, она упала!"
10053070-157 = "Ах, это просто ХУДШЕЕ! Я ради этого отпуск взяла! Я хочу домой!"
10053070-159 = "Так встреча с призраком, похоже, закончилась до смешного буднично, и никто так ничего и не понял."
10053070-160 = ""
10053070-163 = "А позже той ночью..."
10053070-165 = ""
10053070-166 = "...Потерять сознание в такой важный момент... Как лидер экспедиционной группы, я ужасно опозорилась."
10053070-167 = "Коноха, тебя едва не сбили. Как ты спаслась?"
10053070-168 = ""
10053070-170 = ""
10053070-172 = ""
10053070-173 = "Уф, ну... Как-то..."
10053070-174 = "Хотя магии в этом мире не существует, иногда случаются вещи ЕЩЁ СТРАННЕЕ."
10053070-176 = "...?"
10053070-177 = "Я не понимаю, но, похоже, всё разрешилось?"
10053070-178 = "Разрешилось... Разрешилось...?"
10053070-179 = "Нет. Вовсе нет. Я вообще НЕ ПОНИМАЮ, что всё это было. Как думаете, Сенсей?"
10053070-180 = "[s9] «Я знаю, что это было ненормально.»\n[s10] «И... думаю, нам стоит уехать отсюда.»"
10053070-183 = "Значит, мы согласны."
10053070-184 = "Не-не-не. А как же Цучиноко?!"
10053070-185 = "Ты всё ещё хочешь найти эту штуку?"
10053070-186 = "Раз призрака привлекло моё невезение, значит, я обязана найти Цучиноко!"
10053070-188 = "Похоже, вы двое разошлись во мнениях относительно дальнейших действий."
10053070-189 = "Как бы то ни было, уже поздно, и сейчас идти куда-то нет смысла."
10053070-190 = "Давайте пока поспим, а утром решим, что делать."
10053070-191 = "О, ТЕПЕРЬ ты решила вести себя как лидер? Ну... вообще-то я согласна."
10053070-196 = "...сэй. Пс-с."
10053070-197 = ""
10053070-199 = ""
10053070-200 = ""
10053070-201 = "Сенсей."
10053070-202 = "[s11] «Что случилось, Коноха?»\n[s12] «Не спится?»"
10053070-205 = ""
10053070-207 = ""
10053070-208 = "Тс-с. Сенсей."
10053070-209 = "За окном кто-то есть."
10053070-210 = "[s13] «Что?»\n[s14] «Кто? И как давно?»"
10053070-213 = "Не знаю. Мы только что заметили."
10053070-214 = "Точнее, я заметила после того, как увидела, что Коноха не спит."
10053070-215 = "То, что они наблюдают за нами прямо сейчас, сильно повышает вероятность, что именно они стоят за всем произошедшим."
10053070-216 = ""
10053070-218 = ""
10053070-220 = ""
10053070-221 = "У меня всё ещё есть предчувствие, что это одна из Семерых заключённых."
10053070-222 = "...Мицуи Кёко."
10053070-223 = ""
10053070-225 = ""
10053070-226 = ""
10053070-227 = "Коноха. Я подготовила камеру. Можем начинать запись, когда будешь готова."
10053070-228 = "...Хорошо. Тогда на счёт три бросаемся на них."
10053070-229 = "Один. Два..."
10053070-230 = "Вперёд!!!"
10053070-231 = ""
10053070-233 = ""
10053070-234 = ""
10053070-235 = ""
10053070-236 = ""
10053070-237 = ""
10053070-239 = "Ч-Хм?! А-А? Что?"
10053070-241 = ""
10053070-244 = ""
10053070-245 = "...? Они только что были прямо здесь! Куда делись?"
10053070-246 = "Вы ведь тоже их видели?"
10053070-247 = "Да. Они стояли там и заглядывали внутрь, пока Коноха не открыла окно. Я уверена."
10053070-248 = "Но они просто растворились в воздухе?"
10053070-249 = "А, точно. Директор, вы успели сделать фото?"
10053070-250 = "Я посмотрю, но многого не ждите."
10053070-251 = "Мы вообще-то должны были двинуться на «три.»"
10053070-252 = ""
10053070-254 = ""
10053070-256 = ""
10053070-257 = "Что за шум? Что случилось, Сенсей?"
10053070-258 = "[s15] «Похоже, снаружи кто-то был.»\n[s16] «Мы думаем, именно он стоит за всеми странностями.»"
10053070-261 = "Снаружи? И вы сказали, что они заглядывали «через» окно?"
10053070-262 = "...?"
10053070-263 = "Что такое? Ты всё ещё наполовину спишь?"
10053070-264 = "Нет, со мной всё нормально. Но если подумать, разве это не странно?"
10053070-265 = ""
10053070-267 = ""
10053070-269 = "Мы на втором этаже."
