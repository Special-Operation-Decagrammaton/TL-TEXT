[translation]
3201-1 = "Особый концерт принцессы Вараку 1"
3201-2 = "Следующий пункт повестки..."
3201-3 = "На фестивале Клуб Инь-Ян проведёт концерт под названием «День благодарности Хяккияко»."
3201-4 = "Этот фестиваль — важная традиция для всех нас, но переживать не о чем."
3201-5 = "Всё должно пройти как обычно, так что режиссуру и организацию я возьму на себя."
3201-6 = ""
3201-8 = ""
3201-9 = ""
3201-10 = "Подождите, пожалуйста."
3201-11 = "Да, Чисэ? У тебя есть вопрос?"
3201-12 = "М-м..."
3201-13 = "Я хочу быть главной."
3201-14 = "На концерте?!"
3201-16 = "Режиссёр Чисэ? Ня-ха-ха!"
3201-17 = "Мне нравится, как звучит."
3201-18 = "П-Правда? ...То есть я ценю предложение, Чисэ, правда!"
3201-19 = "Но работы всё равно не так много. Мы будем использовать старое оборудование и реквизит..."
3201-20 = "Это особенный концерт."
3201-21 = "Я хочу сделать его сама, хорошо?"
3201-22 = "(О-Она ослепительно милая!)"
3201-23 = "Кхм! В таком случае..."
3201-24 = "Я буду рядом на каждом шагу. Помогу купить дополнительный реквизит, поставить сцену..."
3201-25 = "Я прослежу, чтобы всё прошло для тебя гладко как по маслу, Чисэ."
3201-26 = "Ты не слишком перебарщиваешь?"
3201-27 = "Всё будет совсе-е-ем нормально."
3201-28 = "Это входит в мои обязанности как вице-президента Клуба Инь-Ян."
3201-29 = "Я всегда координировала наши мероприятия и концерты..."
3201-31 = "(Отчасти потому, что мне было бы ужасно неловко, если бы Чисэ взяла на себя мои обязанности...)"
3201-32 = "(И ещё... Я доверяю Чисэ, но всё равно не могу не переживать...)"
3201-33 = "Всё нормально."
3201-34 = "В этот раз Кахо может отдохнуть."
3201-35 = "Солнце светит. Я слышала, загорать весело."
3201-36 = "Ты загорай, а я буду режиссировать."
3201-37 = "Ладно. Я пошла за покупками."
3201-38 = ""
3201-40 = ""
3201-41 = "Стой, Чисэ! Вернись!"
3201-42 = "О боже. И вот её уже нет."
3201-43 = "Это совсем не похоже на Чисэ!"
3201-44 = "Неужели... Ч-Чисэ проходит через бунтарский период?!"
3201-45 = "Ня-ха-ха! Не думаю, что для неё это вообще возможно. Почему бы просто не передать ей бразды правления на этот раз, Кахо?"
3201-46 = "Чисэ не из тех, кто делает что-то без причины."
3201-47 = "Я-Я знаю! Не то чтобы я думала, что она плохо справится..."
3201-48 = "Н-Но что, если она потеряется в торговом центре?"
3201-49 = "Или её могут похитить! Снова!"
3201-51 = "Тревожная Кахо снова являет свой грозный лик!"
3201-52 = "Мы ведь никогда не забудем инцидент с «Принцессой Вараку», да? Она всего лишь идёт за покупками."
3201-53 = "А откуда ты знаешь, что это не повторится? Хм?!"
3201-54 = "Вот именно! Не знаешь! Поэтому я буду... присматривать за ней!"
3201-55 = "Поторопись, Ния!"
3201-56 = "И почему меня в это втянули?"
3201-57 = ""
3201-58 = "Добро пожаловать!"
3201-59 = "Какая неожиданность! Для нас честь обслуживать саму Чисэ."
3201-60 = "Привет. Спасибо."
3201-61 = ""
3201-62 = ""
3201-64 = "Тебе сейчас самой не кажется, что ты сталкер?"
3201-65 = "Может, нас арестуют! Ня-ха-ха!"
3201-66 = "Нас поймают только если ты продолжишь так шуметь!"
3201-67 = "Я не слежу за ней! Я уважаю её самостоятельность и одновременно забочусь о безопасности, ясно?"
3201-68 = "Ой. Она только что повернула голову? Она тебя услышит, Кахо."
3201-69 = "Уф!"
3201-70 = "Ну, раз уж мы здесь, можно посмотреть, что будет."
3201-71 = ""
3201-72 = "Полагаю, ты пришла за реквизитом для концерта."
3201-73 = "Тогда позволь порекомендовать вот это..."
3201-74 = "А. Нашла!"
3201-75 = "Кахо любит использовать на концертах этот зонтик цвета индиго."
3201-76 = "Отличный выбор, Чисэ!"
3201-77 = "Индиго — цвет достоинства! Он идеально олицетворяет Хяккияко."
3201-78 = ""
3201-80 = ""
3201-81 = ""
3201-82 = "Мне розовый, пожалуйста."
3201-83 = ""
3201-85 = "Что?!"
3201-86 = "О чём ты думаешь, Чисэ?!"
3201-87 = "Мы всегда использовали на концертах зонтики цвета индиго... Неужели она всё это время их ненавидела?"
3201-88 = "Наблюдать за этим куда веселее, чем я ожидала."
3201-90 = "Похоже, наша идол Чисэ И ПРАВДА переживает бунтарский период."
3201-91 = ""
3201-92 = "Этот розовый, верно?"
3201-93 = "Упаковано и готово!"
3201-94 = "Спасибо."
3201-95 = "Конечно. Принцесса Вараку здесь всегда желанная гостья!"
3201-97 = "Чисэ! Сегодня решила пройтись по магазинам?"
3201-98 = "Я покупаю кукол."
3201-99 = "Милых, пожалуйста."
3201-100 = "О! Наверное, для концерта Дня благодарности!"
3201-101 = "Эти куклы кокэси будут естественным выбором."
3201-102 = "Молодец, Чисэ! Куклы — очень важный реквизит любого ритуала Хяккияко, особенно Дня благодарности."
3201-103 = "Пусть зонтик и неправильного цвета, зато хотя бы кокэси покупает."
3201-104 = "Ты справишься!"
3201-105 = "Тебе надо научиться немного расслабляться, Кахо."
3201-107 = "Куклы кокэси?"
3201-108 = "По-моему, вот эта милее."
3201-109 = "Л-Лиса? Немного нетрадиционно, но держи..."
3201-110 = "Без кокэси?!"
3201-111 = "Эта хорошая. Похожа на вице-президента Кахо."
3201-113 = "О-Она выбрала куклу, похожую на меня?!"
3201-114 = "Ого. И внезапно тебя уже совсем не расстраивает отсутствие кокэси. Ня-ха-ха!"
3201-116 = "Даруму тоже, пожалуйста."
3201-117 = "Конечно! Спасибо!"
3201-118 = "Смотри. Это президент Ния."
3201-120 = "Я?! Дарума?"
3201-121 = "Она думает, мы похожи?! Она ведь символически, правда?"
3201-122 = "Спасибо. Именно это я и искала."
3201-123 = "С нетерпением жду концерта!"
3201-125 = ""
3201-126 = ""
3201-128 = "А как же традиции?! Она покупает АПЕЛЬСИНОВЫЙ СОК??"
3201-130 = ""
3201-131 = ""
3201-133 = "У нас уже есть традиционная посуда! Что она собирается делать с каким-то мерчем?"
3201-134 = ""
3201-135 = ""
3201-136 = ""
3201-138 = "Пудинг?! М-Мороженое?!"
3201-142 = ""
3201-143 = "*тяжело дышит* *тяжело дышит*"
3201-144 = "Ты правда всю дорогу бежала. Не думаешь, что немного драматизируешь?"
3201-145 = "Нет! Нам надо было вернуться раньше Чисэ, иначе нас могли поймать!"
3201-146 = "Ладно-ладно. В любом случае я вообще не понимаю замысел Чисэ."
3201-147 = "Очень странный набор реквизита..."
3201-148 = "Я тоже не знаю."
3201-149 = "Я изо всех сил стараюсь просто довериться её решению."
3201-150 = ""
3201-152 = ""
3201-154 = "Привет. Я вернулась."
3201-155 = ""
3201-158 = ""
3201-160 = "Я прогулялась с господином Солнцем."
3201-161 = "Ч-Ч-Чисэ! Какая неожиданность!"
3201-162 = "Удачно сходила за украшениями?"
3201-163 = "Да. Идеально."
3201-164 = "Всё идёт по плану."
3201-165 = "Я-Я с нетерпением жду!"
3201-166 = "Пойду начну подготовку."
3201-167 = ""
3201-169 = ""
3201-170 = "Что же она делает..."
