[translation]
1001803-1 = "Дружелюбный боец"
1001803-2 = "Клубная комната Отдела разработки игр"
1001803-3 = "Эм, Сенсей, если вы не против..."
1001803-4 = "Хотите сыграть со мной в файтинг?"
1001803-5 = "[s] «В файтинг?»"
1001803-6 = "Да, я наконец купила новый файтинг, о котором рассказывала вам в переписке!"
1001803-7 = "Я очень ждала эту игру и хочу сыграть прямо сейчас. Но у остальных сегодня свои дела..."
1001803-8 = "Поскольку это файтинг, без соперника играть невозможно. Но мне страшновато играть с совершенно незнакомым человеком..."
1001803-9 = "Побудете моим соперником, Сенсей?"
1001803-10 = "[s1] «Я плохо играю в файтинги...»\n[s2] «Я не буду тебе поддаваться, готовься!»"
1001803-11 = "Всё нормально. Я тоже впервые играю в эту игру."
1001803-12 = "Давайте сразимся и будем вместе развивать навыки!"
1001803-13 = "Ха-ха... После таких слов я немного нервничаю."
1001803-14 = "Тогда я тоже постараюсь дать отпор!"
1001803-21 = "О-ой... Я-я в беде!"
1001803-24 = "П-потрясающе... Я не знала, что вы настолько искусны..."
1001803-25 = "Тогда в этот раз попробую другой подход..."
1001803-30 = "Победа Юзу! Идеальная победа!"
1001803-31 = "[s] «...Я проиграл.»"
1001803-32 = "Хи-хи! Этот раунд за мной."
1001803-33 = "С-Сенсей? Почему у вас такое лицо? В-вам не весело?"
1001803-34 = "А? Правда ли я впервые играю в эту игру?"
1001803-35 = "Конечно! Это совершенно новая игра, она вышла только сегодня утром."
1001803-36 = "Может, в этот раз мне просто повезло, так что... давайте ещё раунд!"
1001803-43 = "Я-я даже не знала, что такой приём существует."
1001803-44 = "На этот раз я действительно в трудном положении..."
1001803-47 = "Победа Юзу! Идеальная победа!"
1001803-48 = "[s] «...»"
1001803-49 = "Фух... Я снова едва победила."
1001803-50 = "Несмотря на мои слова, я всё это время легко вас побеждаю?"
1001803-51 = "Ну... Когда я вхожу в раж, то начинаю разговаривать сама с собой и даже не замечаю..."
1001803-52 = "Я-я не хотела говорить ничего странного, честно!"
1001803-53 = "Т-тогда в этом раунде я не буду использовать комбо, так что... сыграем ещё раз?"
1001803-60 = "Победа Юзу! Идеальная победа!"
1001803-61 = "П-просто... когда я беру контроллер, сама не замечаю, как начинаю сильно увлекаться... Ха-ха..."
1001803-62 = "В-в этот раз я не буду использовать захваты, поэтому, пожалуйста, сыграйте со мной ещё один раунд!"
1001803-64 = "Хотя Юзу снова и снова мне поддавалась, в следующих десяти боях меня полностью разгромили..."
