[translation]
2502-1 = "Манеры делают игру. Часть 2"
2502-2 = "Большая аркада рядом с Миллениум"
2502-4 = ""
2502-5 = ""
2502-6 = ""
2502-7 = "Она стала гораздо больше, чем в прошлый раз. Они что, здание перестроили?"
2502-8 = "И правда. Ого, они поставили новейший автомат Space Cat!"
2502-10 = "Юзу, смотри, там стенд с новой консолью!"
2502-11 = "Ого... Наконец-то вышло пятнадцатое поколение консолей..."
2502-12 = "Так... Сбоку добавили новый механизм охлаждения. Это точно решит проблему прошлого поколения."
2502-13 = "И это ещё не всё: благодаря этой высокоскоростной игровой памяти время отклика стало гораздо меньше..."
2502-14 = "Ха-ха... Юзу всегда так оживляется, когда речь заходит об игровых штуках."
2502-15 = "Сестрёнка, пойдём сыграем в Space Cat!"
2502-16 = "Давай! Но поддаваться я не буду, так что готовь—"
2502-17 = "...Стоп, мы вообще-то не за этим сюда пришли!"
2502-18 = "Все забыли, зачем мы здесь? Нам надо прямо сейчас найти того токсичного игрока!"
2502-20 = ""
2502-21 = "Вообще-то я пришла купить новый контроллер."
2502-22 = "Нам нужно сразить ещё много монстров, Момои. В какую игру сыграем первой?"
2502-23 = "Я бы лучше осталась здесь и смотрела на новую консоль, чем с кем-то дралась..."
2502-24 = "Нет! Даже прямо сейчас этот игрок может токсичить кому-нибудь ещё!"
2502-25 = "Если он продолжит, а потом и остальные начнут делать то же самое... в итоге игроков в файтинги вообще не останется!"
2502-26 = "Тебе не кажется, что это уже слишком пессимистично?"
2502-27 = "Это священная битва за спасение мира..."
2502-28 = "Герои, настало время отправиться в логово Владыки демонов!"
2502-29 = "Верно, скорее к автоматам Student Fighter 2!"
2502-31 = "Людей меньше, чем я ожидала. Может, он уже ушёл?"
2502-32 = "Нет, не может быть. Проверяйте ID на экранах."
2502-33 = ""
2502-34 = ""
2502-35 = "Хм... Не этот игрок..."
2502-36 = ""
2502-37 = ""
2502-38 = "И этот тоже не тот..."
2502-39 = ""
2502-43 = ""
2502-44 = ""
2502-46 = "Ура, ещё одна победа! У меня серия побед!"
2502-47 = "Ух, опять проиграл... хотя использовал свой секретный приём!"
2502-48 = "Ты серьёзно называешь это корявое комбо секретным приёмом?"
2502-49 = "Да моя бабушка играет лучше тебя!"
2502-50 = "Что? Это всего лишь игра! Нельзя так говорить!"
2502-51 = "Забери свои слова обратно!"
2502-52 = "С чего бы? Ты же идиот, который даже нормально играть не умеет!"
2502-53 = "Ух. Я маме пожалуюсь!"
2502-54 = ""
2502-55 = ""
2502-57 = "Жесть... Не верится, что кто-то может так токсичить даже вживую."
2502-58 = "Нашла! Тот самый ID, который я видела раньше!"
2502-59 = ""
2502-61 = "Хм? Чего, вы тоже хотите меня вызвать?"
2502-62 = ""
2502-63 = ""
2502-64 = "Ты Sukeban312, да? Это ты назвала меня бабулей в онлайне!"
2502-65 = "Так это... ты Peach_Fighter?"
2502-66 = "Ха-ха, ну надо же. Ты и правда такая мелкая, как я и думала."
2502-67 = "Ч-Что вы только что сказали?!"
2502-68 = "Какая же ты грубая! Не верится, что ты продолжаешь говорить такое прямо в лицо."
2502-69 = "Момои, давай очистим эту злодейку Мечом Света!"
2502-70 = "Если ты сейчас же не извинишься за свои оскорбления, я покажу тебе ад! Извиняйся, немедленно!"
2502-71 = "Не-а, не буду."
2502-72 = "Почему?!"
2502-73 = "Я не извиняюсь перед теми, кто слабее меня."
2502-74 = "С какой стати мне кланяться игроку хуже меня? Только гордость зря пострадает."
2502-76 = "Ах ты мелкая...!"
2502-77 = "Сестрёнка, мне её пристрелить?"
2502-78 = "Герой, я готова обнажить свой меч. Только прикажи."
2502-79 = ""
2502-80 = "Хе-хе. Если тебе кажется, что это так нечестно, почему бы нам прямо сейчас не решить всё в Student Fighter 2? Если сумеешь забрать у меня хотя бы один раунд, я извинюсь за свои слова!"
2502-81 = "Ладно, договорились! Но в этот раз я поддаваться не буду..."
2502-82 = "Готовься встать на колени и извиняться!"
2502-83 = "Ну тогда..."
2502-84 = ""
2502-85 = ""
2502-86 = ""
2502-88 = ""
2502-89 = "Начали!"
2502-96 = "SYSTEM: Победа за Sukeban312!"
2502-97 = "Пф! Ничего себе, опять проиграла после таких громких слов!"
2502-98 = "Ну ты и нубина! Хе-хе..."
2502-99 = "Эй! Нельзя просто сидеть в левом нижнем углу и ждать! Это жульничество!"
2502-100 = "Как ты вообще можешь драться одними тычками?!"
2502-101 = "Ты о чём вообще? Эти приёмы есть в самой игре, значит всё честно. Не хочешь под них попадаться — придумай, как им противостоять. Тебе самой не стыдно ныть из-за каких-то выдуманных правил?"
2502-102 = "Ух... чёрт!"
2502-104 = "Странно. Ладно ещё эти дурацкие тычки, но ни один спецприём сестрёнки будто вообще не сработал."
2502-105 = "Мы что-то упускаем?"
2502-106 = "Скорее всего, соперница эксплуатирует баг."
2502-107 = "Баг?"
2502-108 = "Да. В Student Fighter 2 есть баг: если ввести определённую комбинацию, автомат на долю секунды зависает."
2502-109 = "Думаю, соперница использует этот баг, чтобы уклоняться от атак Момои."
2502-110 = "Тогда у нас вообще нет шансов победить!"
2502-111 = "Если бы Момои была намного сильнее соперницы, шанс ещё был бы, но при таком раскладе..."
2502-112 = ""
2502-114 = "..."
2502-115 = ""
2502-116 = ""
2502-117 = ""
2502-119 = ""
2502-120 = ""
2502-121 = "Эй... можно я сыграю вместо Момои...?"
2502-122 = "Что, новый претендент?"
2502-123 = "Давай, выходи. Но ты станешь всего лишь очередной жертвой моей непревзойдённой техники. Ха-ха-ха!"
2502-124 = "Тогда, похоже, придётся играть всерьёз..."
2502-125 = "SYSTEM: Готовы... Бой!"
2502-132 = "SYSTEM: Идеальное комбо! Победа UZQueen! Безупречная победа!"
2502-133 = "Н-Нет... Не может быть... Я проиграла такой мелкой?"
2502-134 = "Я даже ударить тебя не смогла, а ты добила меня полным комбо!"
2502-135 = "Теперь извинись..."
2502-136 = "Что?"
2502-137 = "Извинись перед Момои, как обещала..."
2502-138 = "Ладно... Мне неприятно это говорить, но обещание есть обещание..."
2502-139 = ""
2502-140 = "Прости. Я наговорила лишнего."
2502-142 = ""
2502-143 = "Это было потрясающе, Юзу! Ты размазала эту заносчивую геймершу буквально за секунду!"
2502-144 = "Идеальная победа... Ты невероятна!"
2502-145 = "Вот это победа, достойная имени «UZQueen»!"
2502-146 = "Хватит... не поднимайте такой шум... Мне неловко..."
2502-148 = "Погоди, так ты UZQueen?"
2502-149 = "Та самая легендарная геймерша, которая держится на первом месте онлайн-рейтинга и никогда никому не показывала лица?"
2502-150 = "Я не легендарная геймерша... но да, я UZQueen..."
2502-151 = ""
2502-153 = "Что? Эта девочка — UZQueen?"
2502-154 = "Разве UZQueen не та легендарная игрокиня, которая занимает первое место не только в файтингах, но и в ритм-играх?"
2502-155 = "Не могу поверить, что вижу UZQueen вживую..."
2502-156 = "UZQueen, можно ваш автограф?!"
2502-157 = "Эй, не лезь без очереди! Я первой возьму автограф!"
2502-158 = "Э-э-э... столько людей..."
2502-159 = "Помогите! ...Момои! Мидори! Алиса!"
2502-160 = "Эм, наверное, здесь аркада, поэтому многие узнали её ник."
2502-161 = "Смотрите, сколько у Юзу поклонников! ...Я так ею горжусь."
2502-162 = "Герой, если желаешь стать великим правителем, ты должна вынести всю тяжесть короны."
2502-163 = "А я просто хотела поиграть в видеоигры..."
2502-164 = "UZQueen, раз уж вы здесь, дайте мне пару советов!"
2502-165 = "И мне!"
2502-166 = "Ох... Людей становится всё больше..."
2502-167 = "Нет... Хватит!"
2502-169 = "Юзу удаётся покинуть аркаду лишь после того, как её заставляют поприветствовать целую толпу поклонников..."
2502-170 = "Манеры делают игру"
