[translation]
1012506-1 = "Волшебная художница"
1012506-2 = "Как и обещал Эри, я отправился на территорию академии Вайлдхант."
1012506-3 = ""
1012506-6 = ""
1012506-7 = ""
1012506-8 = "О-о! Сюда, Мастер!"
1012506-9 = "Всё готово. Давай начнём."
1012506-10 = "[s] «Ты говорила, что сегодня будешь рисовать, верно?»"
1012506-11 = "Верно."
1012506-12 = "Я собираюсь написать портрет. А моделью будешь ты, Мастер."
1012506-13 = "[s] «О-о, жду с нетерпением.»"
1012506-14 = "Ню-ху-ху, и правильно. Сегодня мы будем рисовать в особых условиях."
1012506-15 = "Я буду рисовать, используя только ману, которая есть внутри меня."
1012506-16 = "[s1] «Ты готовишься к практическому экзамену?»\n[s2] «Собираешься снять шляпу?»"
1012506-19 = ""
1012506-21 = ""
1012506-22 = "Т-Ты просишь меня раздеться, Мастер...?"
1012506-23 = "...Ну, если ты этого просишь, я сниму её. Но не при таком количестве людей вокруг."
1012506-24 = "[s] «...Ты ведь про шляпу, да?»"
1012506-25 = ""
1012506-27 = ""
1012506-28 = "Ню-ху-ху, возможно..."
1012506-29 = "[s] «Пожалуйста, скажи, что да!»"
1012506-30 = "Ню-ху-ху, да. Я говорю о шляпе."
1012506-31 = "А теперь, без лишних слов, отправимся в ателье."
1012506-34 = ""
1012506-36 = "[ns] «Эй, разве ателье не в другой стороне?»"
1012506-37 = "А, сегодня — нет."
1012506-38 = "Потому что сегодня НАШИМ ателье станет ВОТ ЭТО место!"
1012506-39 = "Я напишу твой портрет прямо здесь, в самом людном месте всей академии Вайлдхант!"
1012506-40 = "Если смогу рисовать здесь, среди толпы, моя уверенность вырастет ещё сильнее."
1012506-41 = "[s3] «Хорошая идея.»\n[s4] «Если сможешь рисовать перед зрителями, сможешь рисовать где угодно.»"
1012506-44 = "Итак, садись, пожалуйста, прямо туда. А я пока достану холст..."
1012506-51 = "Хм? О, она тренируется на улице?"
1012506-52 = "Я не занята. Хочешь пойти посмотреть?"
1012506-53 = ""
1012506-55 = ""
1012506-56 = ""
1012506-57 = "[ns] «А вот и наши первые зрители.»"
1012506-58 = ""
1012506-59 = "К-Как и ожидалось. Ничего страшного."
1012506-60 = ""
1012506-62 = ""
1012506-63 = "...Начнём."
1012506-64 = "Здесь, перед всеми, узрите мою магию — как одной лишь волей я создаю целый мир!"
1012506-67 = "― [log=에리]...Это напоминает мне первый раз, когда я взяла в руки кисть.[/log][wa:5440]"
1012506-70 = "― [log=에리]Тогда... я была такой неопытной и чистой...[/log][wa:940]"
1012506-72 = "― [log=에리]...когда стояла перед тем холстом. [/log][wa:10]"
1012506-75 = "― [log=에리]Но теперь... я больше так не чувствую.[/log][wa:1240]"
1012506-78 = "― [log=에리]Я потеряла магию вдохновения... [/log][wa:480]"
1012506-80 = "― [log=에리]...а вместе с ней и уверенность в себе.[/log][wa:400]"
1012506-83 = "― [log=에리]Но потом,[/log][wa:540]"
1012506-85 = "― [log=에리]ты сказал мне, Мастер...[/log][wa:280]"
1012506-88 = "― [log=에리]...что мечты сами по себе — магия,[/log]"
1012506-90 = "― [log=에리]живущая прямо здесь, в моём сердце.[/log][wa:1290]"
1012506-93 = "― [log=에리]Что эти мечты не дадут мне[/log][wa:2410]"
1012506-95 = "― [log=에리]сбиться с пути.[/log][wa:290]"
1012506-98 = "― [log=에리]Мастер... если ты не против, [/log][wa:890]"
1012506-100 = "― [log=에리]не хочешь пройти этот путь вместе со мной?[/log][wa:180]"
1012506-103 = "― [log=에리]Путь магии,[/log][wa:1900]"
1012506-105 = "― [log=에리]полный разноцветных мечтаний![/log]"
1012506-108 = ""
1012506-109 = "Что скажешь, Мастер? Моё сердце смогло достучаться до тебя?"
1012506-110 = "[s5] «Ещё как.»\n[s6] «Твои слова — настоящая магия, Эри.»"
1012506-113 = "Хи-хи-хи..."
1012506-114 = "[s] «Можно одним глазком взглянуть на картину?»"
1012506-115 = "Ещё нет! Покажу, когда закончу!"
1012506-116 = ""
1012506-118 = ""
1012506-119 = ""
1012506-120 = "О, это же Эри!"
1012506-121 = "Ого, вы только посмотрите на её картину..."
1012506-122 = "В-Вы все? К-К-Когда вы успели прийти?!"
1012506-123 = "Это ОЧЕНЬ впечатляющий портрет. И сразу видно твою цветовую гамму!"
1012506-124 = "Не стесняйся. Выглядит потрясающе!"
1012506-125 = "В-Вы правда так думаете?"
1012506-126 = "А, извини! Не буду отвлекать. Увидимся позже!"
1012506-127 = "Эри, ты крутая! Так держать!"
1012506-128 = ""
1012506-130 = ""
1012506-131 = "Э-хе, э-хе-хе..."
1012506-132 = "[s] «У тебя хорошие друзья.»"
1012506-133 = "Они и правда замечательные."
1012506-134 = "...А я зря так переживала."
1012506-135 = ""
1012506-137 = ""
1012506-138 = ""
1012506-139 = "Тогда мне лучше продолжать в том же духе!"
1012506-140 = ""
1012506-142 = ""
1012506-143 = ""
1012506-144 = "Создавая миры собственного воображения!"
1012506-146 = "И так, под поддержкой и восхищёнными взглядами окружающих, Эри завершила свою работу."
1012506-147 = "Получилась невероятная картина в её неповторимом стиле."
