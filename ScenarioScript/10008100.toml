[translation]
10008100-1 = "Эпизод 10;Начать контратаку!"
10008100-3 = ""
10008100-4 = "А-а. Всё идёт гладко."
10008100-5 = "Мы вернули ящик, а Кайтенджеры продолжают отлично отвлекать всех."
10008100-6 = "Ха! Теперь осталось только закончить наши дела, исчезнуть#nи начать заново."
10008100-7 = ""
10008100-10 = ""
10008100-11 = "У нас проблема, босс!"
10008100-12 = "Ты что, стучаться не умеешь? Надеюсь, это действительно важно!"
10008100-13 = "П-Прошу прощения, но вы должны немедленно включить новости!"
10008100-14 = ""
10008100-16 = ""
10008100-17 = ""
10008100-18 = ""
10008100-21 = "С вами Шинон из Школы журналистики «Кронос»! Срочные новости по главной истории сегодняшнего вечера!"
10008100-22 = ""
10008100-23 = "В Дайкичидэне настоящий переполох! Давайте посмотрим!"
10008100-24 = ""
10008100-26 = ""
10008100-28 = "Что? Ящик с самого начала был мошенничеством?"
10008100-29 = "А как же все слухи в соцсетях?"
10008100-30 = "Я требую вернуть деньги!"
10008100-31 = ""
10008100-33 = ""
10008100-35 = "Хотите знать, как до этого дошло?!"
10008100-36 = "Всё благодаря этому видео, недавно загруженному в соцсети!"
10008100-39 = "Ха! Возможно. Рано или поздно кто-то сложит всё воедино, но что с того? К тому времени нас здесь давно не будет."
10008100-40 = "А почему нет? В мире хватает дураков, верящих всему, что читают в интернете. «Пожелаешь — получишь». Ну серьёзно."
10008100-41 = "Наш бизнес будет процветать вечно, пока существуют лёгкие жертвы!"
10008100-42 = ""
10008100-44 = "Как видите, эти слова вызвали настоящий гнев! Правда ли то, что показано на видео?"
10008100-45 = "Дайкичидэн обманывал людей?"
10008100-46 = "Школа журналистики «Кронос» намерена обратиться прямо к источнику и выяснить правду!"
10008100-47 = ""
10008100-52 = ""
10008100-53 = "Что...?"
10008100-54 = "ЧТО ВСЁ ЭТО ЗНАЧИТ?!"
10008100-57 = "Ох. Здесь полный хаос."
10008100-58 = "Все в ярости! ☆"
10008100-59 = "Хи-хи-хи."
10008100-60 = "Вот теперь это настоящий фестиваль! Так-то лучше!"
10008100-61 = ""
10008100-63 = ""
10008100-65 = "Ты всё это время снимала?"
10008100-66 = "Конечно. А что мне ещё оставалось делать, когда этот управляющий всё повторял, что мир полон идиотов, верящих всему, что слышат в интернете?"
10008100-67 = "Значит, ты обернула его же слова против него."
10008100-68 = "Ха! Я не могла позволить ему безнаказанно оскорблять Ару и моих друзей из «Решателя проблем»! Вот и сняла его, решив, что пригодится."
10008100-69 = "И посмотрите, как интересно всё обернулось!"
10008100-70 = "Муцуки..."
10008100-71 = "[s] «Я так и знал, что это её рук дело.»"
10008100-72 = ""
10008100-74 = ""
10008100-76 = ""
10008100-77 = "Толпа только растёт. Там скоро всё выйдет из-под контроля!"
10008100-78 = "Если войдём через главный вход, будет слишком тесно. Поймать управляющего станет сложнее."
10008100-79 = "У меня есть идея."
10008100-80 = "У Дайкичидэна два входа. Если мы прорвёмся через главный..."
10008100-81 = "...банда Курокамэ наверняка попытается уйти через задний."
10008100-82 = "Мы можем использовать это в свою пользу."
10008100-84 = "Отлично. Полезно иметь на своей стороне бывшего сотрудника."
10008100-85 = "Обязательно было подчёркивать «бывшего»?! Дайте мне хотя бы последнюю зарплату получить."
10008100-86 = "[s] «Хорошо. Тогда разделимся на две команды.»"
10008100-88 = "Как насчёт того, чтобы мы пошли через главный вход, а «Решатель проблем» прикрыл тыл?"
10008100-89 = "Сэрика, ты тоже иди с ними."
10008100-90 = "Мне подходит!"
10008100-91 = "Мы разберёмся здесь."
10008100-92 = "Обещаю отомстить за бедный ящик для пожертвований."
10008100-94 = "Д-Да. Удачи вам троим."
10008100-95 = "Мы с Сенсеем обязательно остановим управляющего."
10008100-96 = "Приказ босса? Хорошо."
10008100-97 = "П-Поняла!"
10008100-98 = "Хи-хи! В атаку, дамы!"
