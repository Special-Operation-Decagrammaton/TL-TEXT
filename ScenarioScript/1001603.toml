[translation]
1001603-1 = "Полевые исследования, Сенсей"
1001603-2 = "Вход на выставку игровой графики Миллениум"
1001603-3 = "Сэндвич, который я приготовила утром... есть."
1001603-4 = "Улун и закуски, чтобы поделиться с Сенсеем, я взяла..."
1001603-5 = "Блокнот и скетчбук тоже со мной... Я ничего не забыла?"
1001603-6 = "Подготовка необходима, чтобы пройти подземелье."
1001603-7 = "*вдох* *выдох* *вдох* *выдох*"
1001603-8 = "Эта выставка — возможность показать Сенсею, насколько я взрослая."
1001603-9 = "[s] «Что ты там бормочешь?»"
1001603-10 = "А-а! В-вы меня напугали!"
1001603-11 = "С-Сенсей, когда вы пришли? Сколько вы слышали?"
1001603-12 = "[s1] «С того момента, как ты уставилась на коробку с бэнто...»\n[s2] «И до глубокого вдоха, словно герой перед штурмом подземелья.»"
1001603-13 = "В-вы тогда слышали всё!"
1001603-14 = "В-вы тогда слышали всё!"
1001603-15 = "[s] «Ты, похоже, очень ждала сегодняшнюю выставку!»"
1001603-16 = "П-потому что... выставка игровой графики проходит всего раз в год."
1001603-17 = "Я собираюсь воспользоваться возможностью и многое изучить."
1001603-18 = "(Конечно, это не единственная причина, почему я так ждала этот день...)"
1001603-19 = "Не будем стоять на месте. Пойдёмте, Сенсей!"
1001603-21 = "Выставка игровой графики Миллениум, 1-й этаж"
1001603-23 = "Эм, похоже, стенды с новейшими играми находятся на первом этаже, а каждый этаж разделён по жанрам."
1001603-24 = "О, выставка классической игровой графики начинается с третьего этажа."
1001603-25 = "[s] «Здесь битком.»"
1001603-26 = "Да, думаю, это одна из главных достопримечательностей игровой индустрии."
1001603-27 = "Все здесь играли в разные жанры, в разных местах и в разные периоды своей жизни."
1001603-28 = "А в итоге мы можем собраться в таком месте и делиться воспоминаниями."
1001603-29 = "О, вообще-то нам стоит подняться на третий этаж, Сенсей. Там наверняка много крутых работ."
1001603-31 = ""
1001603-32 = ""
1001603-33 = ""
1001603-34 = ""
1001603-35 = "(Я пришла сюда с Сенсеем вдвоём — уже успех. А теперь завершить миссию...)"
1001603-36 = ""
1001603-38 = "Мы уже долго ходим, Сенсей. Вы не хотите пить?"
1001603-39 = "Я принесла из дома улун..."
1001603-40 = "(Так, теперь подойти к Сенсею с чаем!)"
1001603-41 = "[s] «Мидори, посмотри туда.»"
1001603-42 = "А? Что там..."
1001603-43 = ""
1001603-44 = ""
1001603-46 = "О, это работа с сильным чувством запустения, совсем без признаков жизни..."
1001603-47 = "Эта картина пустыни... Неужели..."
1001603-48 = "Точно! Я так и знала, Сенсей!"
1001603-49 = "Run-and-gun шутер, считающийся шедевром среди классики!"
1001603-50 = "Это арт пустынной карты из Metal Snail 2! Круто!"
1001603-51 = "О, и это ещё не всё. Посмотрите на работу вон там!"
1001603-52 = ""
1001603-54 = "А это арт печально известного города зомби из Denizen Evil — Rodent City!"
1001603-55 = "Все они — шедевры классических игр!"
1001603-56 = ""
1001603-57 = ""
1001603-58 = "[ns3] «Мидори, успокойся.»\n[ns4] «Мидори, у тебя уже слюни текут.»"
1001603-59 = "Как тут можно оставаться спокойной?!"
1001603-60 = "Как тут можно оставаться спокойной?!"
1001603-61 = "О!"
1001603-62 = "Это арт уровня 1-1 из знаменитой классической платформенной игры Ultra Marine Sisters!"
1001603-63 = "Сенсей, Сенсей! А вы знали?"
1001603-64 = "Кусты и облака в Ultra Marine Sisters имеют абсолютно одинаковый пиксельный дизайн!"
1001603-65 = "Ах! Я слишком возбуждена! Идеи заполняют голову... перегрузка!"
1001603-66 = "Б-блокнот... Где мой блокнот?! Надо это зарисовать..."
1001603-68 = "После этого Мидори ещё некоторое время воодушевлённо рисовала."
1001603-69 = "После выставки игровой графики..."
1001603-71 = "Даже не знаю, что сказать. Я опять слишком увлеклась..."
1001603-72 = "Сенсей, простите. Я таскала вас повсюду, даже не подумав, как вы себя чувствуете..."
1001603-73 = "(Я радовалась как ребёнок в магазине сладостей. Мой план показать Сенсею взрослую сторону пошёл насмарку...)"
1001603-74 = "[s5] «Нет, мне понравилось.»\n[s6] «Ты правда любишь ретро-игры, Мидори.»"
1001603-75 = "О, да! Поначалу я не понимала, почему столько людей играют в ретро-игры."
1001603-76 = "О, да! Поначалу я не понимала, почему столько людей играют в ретро-игры."
1001603-77 = "Мне стало любопытно."
1001603-78 = "Я начала играть в них, когда вступила в Отдел разработки игр, и обнаружила, что они мне очень нравятся."
1001603-79 = "В некоторых играх правила сложно понять."
1001603-80 = "Например, в той игре, где надо карабкаться вверх и ломать лёд!"
1001603-81 = "Почему я умираю, когда ухожу за край экрана?! Почему игра меня не ждёт?!"
1001603-82 = "[s] «Приятно видеть тебя такой счастливой.»"
1001603-83 = "А..."
1001603-84 = "Сенсей, вы всегда говорите такие вещи..."
1001603-85 = "Ну да. Сегодня мне правда понравилось."
1001603-86 = "Давайте как-нибудь повторим, Сенсей."
