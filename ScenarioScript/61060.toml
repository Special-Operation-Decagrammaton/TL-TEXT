[translation]
61060-1 = "Эпизод 6;Место по ту сторону"
61060-6 = "...Скоро зайдёт солнце."
61060-7 = "Верно. Нам лучше поторопиться."
61060-8 = ""
61060-10 = ""
61060-11 = "..."
61060-12 = "Что такое, Хиёри?"
61060-13 = "Просто... до меня только сейчас дошло, что мы действительно возвращаемся в Ариус. Хе-хе. Хи-хи."
61060-14 = "...Просто так выпали кости."
61060-15 = "На этом этапе будь что будет."
61060-16 = "Ты повзрослела, Мисаки. Очень зрелый взгляд на вещи."
61060-17 = ""
61060-19 = ""
61060-21 = "Не тебе это говорить, «лидер». Вечно появляешься и исчезаешь, когда тебе вздумается."
61060-22 = "Ай..."
61060-23 = "В её подколах чувствуется привязанность, Саори. Она И ПРАВДА рада, что ты вернулась."
61060-24 = "Пусть даже временно."
61060-25 = "Эй...!"
61060-26 = "...Не буду с тобой спорить. Всё равно будешь думать что захочешь, Химэ."
61060-27 = "Хи-хи. Уязвимость явно не входит в число твоих сильных сторон, Мисаки."
61060-28 = "Вот именно об этом я и говорю!"
61060-29 = ""
61060-30 = "[ns] «Приятно видеть, что вы все так хорошо ладите.»"
61060-31 = "И вы называете ЭТО хорошими отношениями, Сенсей?"
61060-32 = "Хи-хи. А я ОЧЕНЬ рада, что Сенсей идёт с нами."
61060-34 = "Я-Я тоже! Это как... миссия сопровождения!"
61060-35 = ""
61060-36 = "Как и сказала Саори, у меня есть к вам просьба, Сенсей."
61060-37 = "Не могли бы вы обучать студентов Ариуса?"
61060-38 = "Если вам удобнее делать это дистанционно, мы можем всё организовать."
61060-39 = "Я понимаю, что просьба непростая. Ваша безопасность будет нашим главным приоритетом."
61060-40 = "И с определённой точки зрения, продолжить этот план означало бы пренебречь желаниями студентов Ариуса..."
61060-41 = "Что?! Вы хотите обучать их лично?!"
61060-42 = ""
61060-43 = "..."
61060-44 = "Изначально я думала, что наша миссия будет заключаться в переговорах со студентами Ариуса..."
61060-45 = "...и поддержке Сенсея, пока он будет обучать их дистанционно."
61060-46 = "Но раз вы согласились ехать лично, это действительно можно считать своего рода миссией сопровождения."
61060-47 = "[ns] «Прости. Я усложнил вам задачу?»"
61060-48 = "Н-Нет! Вовсе нет."
61060-49 = "Скорее я переживаю, что вы снова взваливаете наши проблемы на себя."
61060-50 = "И мне от этого неловко."
61060-51 = "Раз уж об этом заговорили..."
61060-52 = "Почему вы вообще готовы рисковать своей безопасностью и отправляться в такое опасное место, как Ариус, Сенсей?"
61060-53 = ""
61060-55 = ""
61060-56 = "[ns1] «Хе-хе-хе. Конечно же, ради шанса покрасоваться...»\n[ns2] «...перед моими дорогими студентами!»"
61060-59 = ""
61060-60 = "[ns] «Хи-хи. Неплохо получилось, правда?»"
61060-61 = "А. Э-эм..."
61060-62 = "Я уже поняла одну вещь..."
61060-63 = "...взрослые бывают ужасно кринжовыми."
61060-64 = ""
61060-65 = "[ns] «Это было... не круто?»"
61060-66 = "Совсем нет. Кажется, это называют «испанским стыдом»."
61060-67 = "Но именно из-за этой вашей стороны мы вам и доверяем, Сенсей."
61060-68 = "...Это прозвучало как комплимент из жалости?"
61060-69 = "Угу. Даже мне самой так показалось, когда я это сказала."
61060-70 = ""
61060-72 = ""
61060-75 = "А-Ацуко?!"
61060-76 = "К-Критический урон! Сенсей пал! Он сейчас умрёт?!"
61060-77 = "Прекратите представление, Сенсей. Нам пора двигаться."
61060-79 = "Итак, давайте дружно поаплодируем!"
61060-80 = "Отпразднуем благополучное возвращение нашей соратницы в Ариус!"
61060-81 = ""
61060-83 = ""
61060-84 = ""
61060-86 = "Ага... ха... Хотя путь был далеко не гладким."
61060-87 = "Главное, что твой нимб цел."
61060-88 = "Ты защитила самое ценное, а с остальным можно разобраться со временем."
61060-89 = ""
61060-91 = ""
61060-92 = ""
61060-93 = "С возвращением. И спасибо, что вернулась в целости, Майя."
61060-94 = "Время пока на нашей стороне."
61060-95 = "Д-Да, Субару!"
61060-96 = "Прости. У нас даже нет подарка в честь твоего возвращения."
61060-97 = "Н-Нет! Самого возвращения более чем достаточно. Я как-то... даже скучала по этому месту..."
61060-98 = "А, точно. Ну и как там? Снаружи? Пожалуйста, расскажи."
61060-99 = "Снаружи?"
61060-100 = "...Это было потрясающе."
61060-101 = "И красиво."
61060-103 = ""
61060-105 = ""
61060-106 = "..."
61060-108 = "Я увидела столько всего. Стеклянные небоскрёбы..."
61060-109 = "Огромную реку, над которой висят мосты."
61060-112 = "А ночью повсюду были огни."
61060-113 = "Даже мосты светились. Их мерцание над водой выглядело как сон."
61060-115 = "Там было целое здание, полностью предназначенное для музыки."
61060-116 = "А мы могли играть только тайком, когда Мадам не видела..."
61060-119 = "...там же постоянно устраивали самые разные концерты, и днём, и ночью."
61060-120 = "Раз они играли даже ночью, всё вокруг украсили множеством красивых огней."
61060-121 = "...Я поняла, что там люди не задумываются, насколько полезны их усилия."
61060-122 = "Им не приходится постоянно думать о выживании. Они создают красивые вещи просто потому, что они красивые."
61060-124 = "А на рынках...! Я и не знала, что в мире существует столько разной еды."
61060-125 = "От одного запаха казалось, будто желудок уже полный."
61060-126 = "...Хотя, возможно, потому что нюхать — это всё, что я МОГЛА себе позволить."
61060-128 = "А вы когда-нибудь слышали об аквапарке? Там целую огромную территорию заполняют чистой водой, и люди приходят просто играть в ней!"
61060-130 = "Там даже есть крытая и открытая части — словно два разных мира прямо рядом друг с другом."
61060-131 = "Я даже не смогу сосчитать всё, что там увидела."
61060-144 = ""
61060-145 = "..."
61060-146 = "..."
61060-147 = "Но среди всех этих новых и захватывающих вещей... для меня там словно не было места."
61060-148 = "Да. Я понимаю."
61060-149 = "Огни сияли так ярко, и все вокруг улыбались."
61060-150 = "Они выглядели такими счастливыми вместе."
61060-151 = "Но именно поэтому..."
61060-152 = ""
61060-154 = ""
61060-156 = "Потому что даже если бы я где-нибудь потеряла сознание или упала в тёмном углу..."
61060-157 = "...никому из них не было бы дела. Я это знала. Я это чувствовала."
61060-158 = ""
61060-160 = ""
61060-161 = "Одни люди счастливы."
61060-162 = "Другие довольны своей жизнью."
61060-163 = "Но люди редко вспоминают о..."
61060-164 = ""
61060-166 = ""
61060-167 = "...тех, кто страдает."
61060-168 = "Людям с рождения внушают: «Ты можешь всё»."
61060-169 = "Но это также означает, что ты можешь вообще ничего не делать."
61060-170 = "Никто не берёт тебя за руку и не ведёт по жизни шаг за шагом."
61060-171 = "Тебя просто оставляют в покое. Говорят, что правильного ответа не существует, поэтому живи как хочешь."
61060-172 = "Но разве это не просто красивые слова, которыми люди снимают с себя ответственность?"
61060-173 = ""
61060-175 = ""
61060-176 = ""
61060-178 = "Ты хорошо постаралась. С возвращением."
61060-179 = "Субару..."
61060-180 = "Я знаю. Не могу не понимать."
61060-181 = "Многие, как и ты, уходили отсюда, а потом возвращались."
61060-182 = "...А некоторые ушли в Тринити, и с тех пор мы ничего о них не слышали."
61060-183 = "..."
61060-184 = "Тринити..."
61060-185 = "Хм? Ты тоже хочешь туда?"
61060-186 = ""
61060-188 = ""
61060-191 = ""
61060-192 = "Н-Никогда! Я никогда тебя не брошу."
61060-193 = "Не переживай так. Если бы ты действительно захотела уйти, я была бы не против."
61060-194 = "Просто я бы не пошла... не смогла бы пойти за тобой. Я никогда не прощу Тринити."
61060-195 = "В-Вот именно! С чего бы тебе прощать их?"
61060-196 = "Я чувствую то же самое, Субару!"
61060-197 = "Спасибо. Это придаёт мне сил."
61060-198 = ""
61060-200 = ""
61060-201 = ""
61060-202 = ""
61060-204 = "И прежде всего..."
61060-205 = "Я не могу простить отряд. Они должны были вести нас за собой, а вместо этого выбросили нас как вчерашний мусор."
61060-206 = ""
61060-208 = ""
61060-209 = "Особенно её. Джомаэ Саори."
61060-211 = "Следующий Эпизод;Гармоника"
