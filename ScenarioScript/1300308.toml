[translation]
1300308-1 = "Коротко, но прекрасно"
1300308-2 = "Дополнительный корпус Тринити"
1300308-3 = "*вздыхает*"
1300308-4 = "О, Сенсей?"
1300308-5 = "Ты идёшь домой? Должно быть, работал допоздна."
1300308-6 = "Ты не один такой. У меня тоже были важные клубные дела..."
1300308-7 = "Рада, что смогла всё закончить."
1300308-8 = "Бумажная работа никогда не бывает весёлой, но кто-то должен её делать..."
1300308-9 = "[s] «Молодец.»"
1300308-10 = "Спасибо. И тебе тоже хорошая работа, Сенсей."
1300308-11 = "*вздох* После целого дня работы плечи совсем затекли."
1300308-12 = "Почему бы не пойти домой вместе? Уже поздно, так что я пойду пешком."
1300308-13 = "*треск* *грохот*"
1300308-14 = "А?"
1300308-15 = "Похоже, погода собирается испортиться."
1300308-16 = "Бежим, Сенсей!"
1300308-17 = ""
1300308-20 = "*кап-кап*"
1300308-21 = "Боже... Льёт как из ведра."
1300308-22 = "Нужно где-то укрыться."
1300308-23 = "[s] «Пойдём в парк.»"
1300308-24 = "В парк?"
1300308-25 = "А, точно. То место..."
1300308-27 = "Мы с Хасуми направились в беседку, где раньше вместе смотрели закат."
1300308-30 = "[ns] «Нашли укрытие.»"
1300308-31 = "Да. Здесь... должно быть нормально."
1300308-34 = "― Ах. Мы промокли насквозь. Нехорошо...[wa:3780]"
1300308-37 = "― Хм. Дождь и не думает прекращаться.[wa:1960]"
1300308-40 = "― Ну что ж, похоже, мы здесь застряли вдвоём, да?[wa:1100]"
1300308-43 = "― Хи-хи. Не так я представляла этот вечер.[wa:140]"
1300308-46 = "― Я не против вот так отдохнуть... если ненадолго.[wa:3620]"
1300308-48 = "― Такие возможности выпадают мне редко, но я всегда ими дорожу.[wa:2540]"
1300308-51 = "Дождь наконец прекратился лишь на рассвете."
1300308-54 = "..."
1300308-55 = "[s] «(Нужно разбудить Хасуми.)»"
1300308-56 = "Ах..."
1300308-57 = "Я уснула? Прости..."
1300308-58 = "Похоже, бумажная работа меня вымотала."
1300308-59 = "..."
1300308-60 = "...Солнце встаёт."
1300308-61 = "[s] «Всё в порядке?»"
1300308-62 = "Да, всё хорошо. Я предупредила общежитие, что буду работать допоздна, так что вряд ли там переживают, где я."
1300308-63 = "...Хи-хи."
1300308-64 = "Я снова у тебя в долгу, Сенсей."
1300308-65 = "...Никогда не думала, что смогу провести с тобой столько приятного времени."
1300308-66 = "[s] «Что ты сказала?»"
1300308-67 = "...Ничего."
1300308-68 = "Мне стоит вернуться в общежитие, пока меня здесь никто не заметил."
1300308-69 = "Ну что ж, Сенсей..."
1300308-70 = ""
1300308-71 = "...увидимся позже."
