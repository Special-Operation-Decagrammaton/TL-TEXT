[translation]
12195-2 = "Hey, Hoshino-chan."
12195-3 = "You know,"
12195-4 = "When I first met you, I thought I must be dreaming, so I pinched my cheeks over and over."
12195-5 = "The idea of having a cute, strong, and reliable underclassman like you by my side felt like a dream, and it made me so happy..."
12195-6 = "Hmm, maybe I'm not explaining it very well..."
12195-7 = "It's just that being able to be here with you, Hoshino-chan, feels like a miracle to me."
12195-8 = "...But we're together like this every single day, aren't we?"
12195-9 = "Yesterday, today, and tomorrow too. Why make such a big deal out of something so ordinary?"
12195-10 = "Hau... but..."
12195-11 = "A 'miracle' is supposed to be something much more grand and rare."
