[translation]
12195-2 = "Ei, Hoshino-chan."
12195-3 = "Sabe, eu..."
12195-4 = "Quando eu te conheci pela primeira vez, Hoshino-chan, achei que estava sonhando e belisquei minhas bochechas várias vezes."
12195-5 = "Ter uma caloura tão fofa, forte e confiável como você ao meu lado parecia um sonho... Eu fiquei tão feliz..."
12195-6 = "Hmm, talvez eu não esteja sabendo explicar direito..."
12195-7 = "É só que... poder estar aqui junto com você, Hoshino-chan, é como um milagre para mim."
12195-8 = "...A gente fica juntas assim todo santo dia, não é?"
12195-9 = "Ontem, hoje, e amanhã também. Por que está exagerando tanto por algo tão comum?"
12195-10 = "Hau... Mas é que..."
12195-11 = "Um \"milagre\" é algo muito mais incrível e raro do que isso."
12195-12 = "...Não, Hoshino-chan."
12195-13 = "Eu não acho que seja assim."
12195-14 = "Ei, Hoshino-chan. Um dia, quando você também tiver calouras fofas, então—"
12195-16 = "..."
12195-19 = "A senpai deve estar logo ali!!"
12195-20 = "Nn, não quebra... De novo..."
12195-22 = "A-Ayane-chan?! Como você chegou aqui?!"
12195-23 = "Com o helicóptero que a Schale nos emprestou! Onde está a Hoshino-senpai?!"
12195-24 = "Aqui! Mas a porta não abre...!!"
12195-25 = "Ora, sua...!!"
12195-26 = "(KABUUUUM!!!)"
12195-28 = "(O que aconteceu...?)"
12195-29 = "(Consigo mexer o corpo...? Será que estou sonhando...?)"
12195-30 = "(Ouvi a voz de todo mundo, então é um sonho mesmo...)"
12195-31 = "(Essas vozes...)"
12195-36 = "(Vêm daqui, talvez...?)"
12195-37 = "(Mesmo que seja um sonho... só mais uma última vez...)"
12195-40 = "(Clang!)"
12195-42 = "Hoshino-senpai!!!!"
12195-46 = "O-O quê... Como vocês...?"
12195-47 = "Por quê...? Mas eu..."
