[translation]
12195-2 = "Знаешь, Хошино."
12195-3 = "Я кое-что хочу сказать."
12195-4 = "Когда я впервые тебя увидела, всё щипала себя за щёки, думая, что, наверное, сплю."
12195-5 = "Иметь рядом такую милую, сильную и надёжную девушку, как ты... Я была так счастлива..."
12195-6 = "Угх... Я недостаточно умная, чтобы нормально это объяснить, но..."
12195-7 = "Одно только то, что я могу вот так стоять здесь и разговаривать с тобой... кажется мне чудом."
12195-8 = "...Мы видимся каждый день."
12195-9 = "Я видела тебя вчера, вижу сегодня и увижу завтра. Что тут особенного?"
12195-10 = "А, ну... Я знаю, но..."
12195-11 = "Чудеса ведь должны быть редкими и необыкновенными."
12195-12 = "...М-м. Нет, Хошино. Я думаю иначе."
12195-13 = "Может, я и глупая... но одно знаю точно."
12195-14 = "Однажды, Хошино, у тебя появятся собственные милые младшие студенты. И когда это случится..."
12195-16 = "..."
12195-19 = "Она должна быть с другой стороны!"
12195-20 = "Не поддаётся. Попробуйте ещё раз..."
12195-22 = "А-Аяне?! Как ты...?"
12195-23 = "Я взяла вертолёт, который одолжило Шале! Ладно, где Хошино?"
12195-24 = "Здесь! Помоги нам открыть дверь!"
12195-25 = "Отойдите!!"
12195-26 = "*БАХ*"
12195-28 = "(Что происходит...?)"
12195-29 = "(Моё тело... Я снова могу двигаться... Это сон...?)"
12195-30 = "(Мне казалось, я слышала голоса всех остальных. Наверное, это сон.)"
12195-31 = "(Звучало так, будто...)"
12195-36 = "(Может, сюда...?)"
12195-37 = "(Даже если это всего лишь сон... Ещё один раз... Дайте мне их услышать...)"
12195-40 = "*клац*"
12195-42 = "Хошино!!"
12195-46 = "А...? Но как?"
12195-47 = "Почему...? Я думала, что я..."
12195-50 = "[ns] «Хошино.»"
12195-52 = "Хошино"
12195-53 = "...О."
12195-56 = "Хошино"
12195-57 = "Теперь ясно. Наверняка это Сенсей."
12195-60 = "Хошино"
12195-61 = "Взрослый всё-таки справился. Хех."
12195-66 = "Серика"
12195-67 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-68 = "С-с возвращением, Хошино."
12195-71 = "Нономи"
12195-72 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-73 = "А! Серика меня опередила! Ты же говорила, что это слишком стыдно, а теперь посмотри на себя!"
12195-76 = "Серика"
12195-77 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-78 = "З-заткнись! Какая разница, кто первым сказал!"
12195-81 = "Широко"
12195-82 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-83 = "Мы рады, что с тобой всё в порядке."
12195-86 = "Аяне"
12195-87 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-88 = "Да! С возвращением!"
12195-91 = "Нономи"
12195-92 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-93 = "Ага-ага! С возвращением!"
12195-96 = "Широко"
12195-97 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-98 = "С возвращением, Хошино."
12195-102 = "Хошино"
12195-103 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-104 = "...Ахаха."
12195-107 = "Хошино"
12195-108 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-109 = "...А? Почему вы все так на меня смотрите?"
12195-112 = "Хошино"
12195-113 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-114 = "А-а, теперь понятно. Вы хотите, чтобы я сказала ту фразу, да?"
12195-117 = "Серика"
12195-118 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-119 = "З-заткнись! Не тяни!"
12195-124 = "Хошино"
12195-125 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-126 = "Хе!"
12195-129 = "Хошино"
12195-130 = "[7cd0ff]Комиссия по взысканию долгов[-]"
12195-131 = "Не могу же я отказать своим милым девочкам..."
12195-134 = "Я дома."
