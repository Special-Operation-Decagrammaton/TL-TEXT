[translation]
2002006-1 = "Хрупкая точка с запятой гениального хакера"
2002006-2 = "Сегодня, в отличие от обычного, меня пригласили не в убежище Химари, а туда, где она работает для Веритас."
2002006-3 = ""
2002006-7 = ""
2002006-8 = "Здравствуйте, Сенсей. Хи-хи, вы пришли."
2002006-9 = "[s] «Почему сегодня здесь, а не в убежище?»"
2002006-10 = "Сегодняшняя цель не такая расслабленная, как обычно. У меня есть кое-какая работа..."
2002006-11 = "Что ж, перейдём к делу."
2002006-12 = "Наконец-то оно моё."
2002006-13 = "[s] «Наконец твоё... То сокровище, о котором ты говорила?»"
2002006-14 = "Хи-хи. Да, сокровище."
2002006-15 = "Его ценность уступает только сложности его получения."
2002006-16 = "Хотите узнать, что это за сокровище?"
2002006-17 = "Хи-хи."
2002006-18 = "Приготовьтесь удивляться..."
2002006-19 = ""
2002006-21 = ""
2002006-22 = ""
2002006-24 = "Это не что иное, как вот это!"
2002006-25 = ""
2002006-28 = "[ns] «...Не что иное, как Frenzy MAX?»"
2002006-29 = "Хе-хе-хе. Это не обычный Frenzy MAX."
2002006-30 = "Это специальное издание. По слухам, оно в сто раз вкуснее любого другого Frenzy MAX. Даже лучше лучшего из лучших."
2002006-31 = "[s] «...Хорошо.»"
2002006-32 = ""
2002006-35 = ""
2002006-36 = "...Какая прохладная реакция."
2002006-37 = "Среди технически подкованных это легендарная вещь. Слово «лимитированная» даже близко не передаёт её редкость."
2002006-38 = "Все участники Веритас отчаянно хотят заполучить её."
2002006-39 = "[s] «О, значит... это подарок всем?»"
2002006-40 = "Ну, иногда мне нужно демонстрировать свою щедрость как президенту."
2002006-41 = "Кстати, я выбрала вкус «Маракуйя-микс», чтобы мы с вами попробовали его вместе, Сенсей."
2002006-42 = "[s] «Очень мило с твоей стороны, Химари.»"
2002006-43 = "Хорошо, попробуем и узнаем, из-за чего столько шума. После этого будем усердно работать."
2002006-44 = "Я даже получила от одной участницы совет, как выжать максимум удовольствия из банки Frenzy MAX."
2002006-45 = "[s] «Серьёзно?»"
2002006-46 = "Да, смотрите."
2002006-47 = ""
2002006-49 = ""
2002006-50 = ""
2002006-52 = ""
2002006-53 = "[ns] «Х-Химари?! Зачем ты трясёшь банку?!»"
2002006-54 = "Вот... так..."
2002006-55 = ""
2002006-57 = ""
2002006-59 = ""
2002006-60 = "Сильно встряхнуть банку..."
2002006-61 = "Чтобы Frenzy MAX вступил в реакцию внутри..."
2002006-62 = ""
2002006-64 = ""
2002006-66 = ""
2002006-67 = "И стал ещё вкуснее перед открытием... Хия!"
2002006-68 = ""
2002006-70 = ""
2002006-72 = ""
2002006-73 = "Примерно в пять раз вкуснее обычного... Хияп!"
2002006-74 = "[s] «Подумай! Тебя разыграли!»"
2002006-75 = "Хм?"
2002006-76 = ""
2002006-79 = ""
2002006-84 = "[ns] «Ожидаемая трагедия...»"
2002006-85 = ""
2002006-86 = "А..."
2002006-87 = "Это... было одним из возможных исходов."
2002006-88 = "То есть это газированный напиток... А значит, есть определённые последствия..."
2002006-89 = "Но удача любит смелых. Разве неправильно было рискнуть взрывом в лицо ради надежды на более светлое и вкусное будущее?"
2002006-90 = "Или мне следовало довольствоваться посредственным настоящим? Без риска нет награды."
2002006-91 = "Такова дилемма самой жизни."
2002006-92 = "[s1] «Не думаю, что нужно воспринимать это настолько серьёзно!»\n[s2] «Ладно, давай вытремся, пока ты не простудилась.»"
2002006-93 = "О... С-Спасибо."
2002006-94 = ""
2002006-96 = ""
2002006-97 = "О... С-Спасибо."
2002006-101 = ""
2002006-102 = "Большую часть себя я сумела вытереть, но..."
2002006-103 = "Но мои ноги..."
2002006-104 = "...Хм."
2002006-105 = "[s] «Хочешь, я помогу?»"
2002006-106 = ""
2002006-108 = ""
2002006-109 = "А-А? Вы? Поможете мне?"
2002006-110 = "Э-это..."
2002006-111 = "[s] «О, прости. Если тебе неловко...»"
2002006-112 = ""
2002006-114 = ""
2002006-115 = "Н-Нет! Всё нормально! Совершенно нормально!"
2002006-116 = "То есть, если вы действительно хотите вытереть ноги такой прекрасной супергениальной хакерши, как я, кто я такая, чтобы вам мешать?"
2002006-117 = "...К-Кхм."
2002006-118 = ""
2002006-120 = ""
2002006-121 = "...Хорошо, пожалуйста?"
2002006-122 = ""
2002006-124 = ""
2002006-125 = ""
2002006-127 = "[s] «Тогда... я вытру?»"
2002006-128 = "Д-Давайте!"
2002006-131 = "― Хи-хи. Ну как ощущения?[wa:240]"
2002006-134 = "― Редкая возможность вытереть изящные ножки"
2002006-136 = "― самой потрясающей и хрупкой красавицы Миллениума."
2002006-139 = "― Поистине шанс, выпадающий раз в жизни.[wa:10]"
2002006-141 = "― Не каждый день приходится..."
2002006-144 = "― Хм...?[wa:420]"
2002006-146 = "― Ощущается совсем не так, как я думала...[wa:2320]"
2002006-149 = "― Так странно... Будто я... стесняюсь?[wa:2200]"
2002006-151 = "― Я-я не понимаю...[wa:740]"
2002006-154 = "― Эти чувства... Я не могу выразить их словами![wa:680]"
2002006-157 = "― Всё, что делает Сенсей, — осторожно вытирает мои нежные ноги[wa:240]"
2002006-159 = "― с величайшей заботой...[wa:440]"
2002006-162 = "― Так почему же...?"
2002006-165 = "[ns] «Я ведь ещё даже не начал!»"
2002006-166 = "― О. Хаха.[wa:630]"
2002006-169 = "― Да, конечно. Как видите, я полностью готова.[wa:10]"
2002006-171 = "― Так что не стоит беспокоиться."
2002006-174 = "― А теперь давайте, сколько душе угодно...![wa:10]"
2002006-176 = "― Раз уж я морально подготовилась...[wa:3680]"
2002006-179 = "[ns] «Хорошо, тогда начинаю.»"
2002006-180 = "― Д-Да, конечно.[wa:960]"
2002006-182 = "― Я... я доверюсь вам...[wa:3100]"
2002006-186 = "[ns] «Готово!»"
2002006-187 = "А?"
2002006-188 = "Х-Хм... Хмммм..."
2002006-189 = "[s] «Что такое, Химари? Я что-то пропустил? Нужно вытереть ещё где-то?»"
2002006-190 = ""
2002006-192 = ""
2002006-193 = "Н-Нет! Просто..."
2002006-194 = "Даже такой супергений, как я, не ожидал... То есть когда кто-то другой трёт часть твоего тела... Это, оказывается, немного смущает."
2002006-195 = "Вы всегда находите способ удивить меня, Сенсей... Это ваш метод обучения? Очень впечатляет."
2002006-196 = "[s] «Я не понимаю...»"
2002006-197 = "Хи-хи, не переживайте."
2002006-198 = "Вы всегда слишком переживаете о мелочах..."
2002006-199 = "...Да, это всего лишь крошечная пустяковая мелочь. ♪"
2002006-201 = "После этого мы с Химари допили оставшийся в банке Frenzy MAX, а затем я помог ей с работой."
