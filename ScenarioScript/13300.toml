[translation]
13300-1 = "Episódio 30;A Existência do Caderno"
13300-3 = "Ah, mas o que você está fazendo?!"
13300-5 = "H-Hoshino-chan, desculpa.#nFoi culpa minha..."
13300-6 = "Desculpa coisa nenhuma!#nComo é que você cai nisso toda santa vez?!"
13300-7 = "B-Bem, é que..."
13300-8 = "Nesse estado lamentável, como você ainda tem coragem de falar em \"uma Abydos cheia de sonhos e esperanças\"...?#nAh, chega! Faça tudo sozinha do jeito que bem entender!"
13300-9 = "H-Hoshino-chan...?"
13300-11 = "Não dá mais para continuar com isso!#nO Conselho Estudantil acabou!"
13300-15 = "Não quero nem saber de você, senpai!"
13300-20 = "..."
13300-22 = "Não é verdade, senpai.#nEu não quis dizer aquilo..."
13300-23 = "Foi só no calor do momento, eu acabei pegando pesado demais."
13300-24 = "Eu ia voltar logo em seguida..."
13300-25 = "Eu jamais imaginei... que aquela seria a última vez."
13300-28 = "Yume-senpai, eu voltei."
13300-29 = "Da próxima vez é só tomar mais cuidado."
13300-30 = "Enfim..."
13300-37 = "...Yume-senpai?"
13300-38 = "Onde será que ela foi? Achei que já tivesse voltado."
13300-43 = "Esse bilhete já estava aqui antes...?"
13300-47 = "\"Obrigada por tudo, Hoshino-chan!! Cuide-se bem!\" ...?"
13300-50 = "...Yume-senpai?"
13300-52 = "Yume-senpai..."
13300-54 = "Yume-senpai!"
13300-56 = "Yume-senpai?!"
13300-68 = "Desculpa, Hoshino-chan#nO sinal não tá pegando@#$%"
13300-69 = "Eu tava no deserto@#&%peguei uma tempestade de areia&#@"
13300-72 = "Hoshino-chan... desculpa"
13300-73 = "Esqueci a bússola de novo"
13300-74 = "Deixei um bilhete, mas vou mandar aqui também#n#nMeu caderno está lá naquele lugar"
13300-75 = "Que você conhece muito bem, Hoshino-chan@$^$%@#$#nDeixei num lugar bem visível, então acho que você vai achar logo"
13300-78 = "Hoshino-chan, eu"
13300-80 = "Yume-senpai..."
13300-81 = "Por que você foi para o deserto...?"
13300-82 = "...Que \"assunto\" era esse?#nO que aconteceu enquanto eu não estava...?"
13300-83 = "...Onde está o caderno?"
13300-84 = "O que... está escrito nesse caderno?"
13300-85 = "...Eu... não posso ver o caderno...?"
13300-86 = "Não dá mais para continuar com isso!#nO Conselho Estudantil acabou!"
13300-88 = "A culpa é minha, não é?"
13300-89 = "Aquelas palavras machucaram a senpai... empurraram a senpai para longe..."
13300-90 = "\"Hoshino-chan, eu\"."
13300-91 = "O que vinha depois naquela mensagem?"
13300-92 = "Eu... não faço ideia..."
13300-93 = "...Yume-senpai."
13300-96 = "Por que... por que eu..."
13300-103 = "..."
13300-104 = "Ué..."
13300-105 = "...Cadê a Chefe do Comitê Disciplinar?!"
13300-110 = "Se não me engano, nós caímos juntas..."
13300-111 = "Bom, agora não é hora de ficar me preocupando com os outros."
13300-114 = "...Não devo estar muito longe da Estação Grande Oásis."
13300-115 = "Eu lembro porque vim aqui com a Yume-senpai."
13300-116 = "Se eu avançar mais um pouco, chego onde ficava o antigo oásis..."
13300-117 = "O Canhão Ferroviário deve estar lá."
13300-118 = "Preciso destruí-lo logo."
13300-119 = "Senão..."
13300-120 = "Eu—"
13300-133 = "O oásis já deve estar..."
13300-138 = "Você não passa daqui, Hoshino Takanashi."
13300-139 = "...?!"
13300-150 = "...Ugh."
13300-151 = "Cof, cof...!"
13300-156 = "Y-Yume-senpai..."
13300-160 = "..."
13300-161 = "Yume Kuchinashi... a Presidente do Conselho Estudantil de Abydos, não é?"
13300-163 = "Próximo;A Única Verdade (1)"
