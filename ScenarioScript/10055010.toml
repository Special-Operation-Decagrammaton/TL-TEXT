[translation]
10055010-1 = "Эпизод 1;Романтический круиз"
10055010-3 = "Небо было безоблачным."
10055010-7 = "Морской ветер гнал мягкие волны, лениво набегавшие на чистый берег."
10055010-8 = "Лучших предзнаменований для начала круиза и придумать нельзя."
10055010-11 = "Ну..."
10055010-12 = "Где, говоришь, находится корабль, который мы арендовали?"
10055010-13 = "Вы Ханума Макото, верно?"
10055010-14 = "Это я! Ханума Макото, верховный председатель Общества Пандемониум, единственный истинный лидер Геенны, величайшая под небесами!"
10055010-15 = "...Ну да, ну да, несравненная. Ваш великолепный корабль прямо здесь. Видите, написано: «Арендован Ханумой Макото»."
10055010-16 = ""
10055010-18 = ""
10055010-19 = ""
10055010-20 = ""
10055010-21 = "Нет, этого не может быть!"
10055010-24 = "Вот эта посудина?!"
10055010-25 = "Эта старая развалюха, которая уже наполовину пошла ко дну?"
10055010-26 = "Это на ней Общество Пандемониум должно отправиться в роскошный круиз?!"
10055010-29 = "Ироха! Что всё это значит?!"
10055010-30 = ""
10055010-32 = ""
10055010-33 = "Почему ты смотришь на меня...? Ты же сама велела не мешать, потому что нашла «лучшую сделку, доступную лишь великому лидеру»."
10055010-34 = "Ну... цена и правда была подозрительно низкой... Наверное..."
10055010-35 = "АХ! Знаю! Всё это с самого начала было коварной ловушкой этих подлых Префектов!"
10055010-36 = "Ты... Нет, команда Префекты тут вообще ни при чём."
10055010-37 = "То есть ты собиралась арендовать большой пассажирский лайнер, но прельстилась низкой ценой и каким-то образом сняла крошечную рыбацкую лодку."
10055010-38 = "Если так об этом сказать, звучит даже хуже. Чем ты думала?"
10055010-39 = "Пф! Не в этом суть!"
10055010-41 = "М? Что-то не так? Я ведь отправлял вам фотографию для подтверждения, но вы не ответили..."
10055010-43 = "...И что ты скажешь в своё оправдание?"
10055010-44 = "Я глава прославленного Общества Пандемониум! Думаешь, у меня есть время ПРОВЕРЯТЬ СООБЩЕНИЯ?!"
10055010-45 = "Надо же. Если открыть словарь на слове «бесстыдство», там будет твой портрет."
10055010-47 = "Та-ак, это значит, что поездка отменяется?"
10055010-48 = "Что за вопрос?! Нельзя же показываться на отдыхе в этой жалкой лодчонке! Нас засмеёт весь Кивотос!"
10055010-49 = ""
10055010-51 = ""
10055010-53 = "Мы... отменяем поездку?"
10055010-54 = "М-мы не поедем на этом «клуизе»?"
10055010-55 = "Ибуки... что-то сделала не так? Это из-за того, что она сегодня утром не почистила зубки?"
10055010-56 = "ЧЕГО-О?!"
10055010-57 = "Н-н-нет! Конечно, нет! Ты за всю жизнь ничего плохого не сделала, Ибуки! Ты права! Какая разница, на каком корабле плыть, если он держится на воде? Большой или маленький, главное — провести время с тобой!"
10055010-58 = "На таком корабле мы хоть до края моря доплывём! Верно, Сенсей?!"
10055010-59 = ""
10055010-63 = "[ns] «Конечно, соглашусь!!»"
10055010-64 = "...*вздох* Ничего не поделаешь."
10055010-65 = "Макото — это одно, но огорчать Ибуки так нельзя."
10055010-67 = "А-ха-ха! Сколько бы Макото и Ироха ни ругались, отказать Ибуки не может ни одна из них!"
10055010-68 = "Я представляла всё немного иначе, но сойдёт."
10055010-70 = "А? Так вы всё-таки берёте её?"
10055010-71 = "Не судите по виду! Эта старушка верой и правдой пережила тридцать лет штормов и дождей!"
10055010-72 = "Корпус иногда даёт течь, но поблизости всё равно патрулирует «Одиссея»! Если начнёте тонуть, подайте сигнал бедствия, и вас вытащат!"
10055010-73 = ""
10055010-76 = ""
10055010-77 = "Не самая смешная шутка. ...Это ведь была шутка, да?"
10055010-78 = "Эй, не пугай! Сацуки и так легко напугать! Но это застывшее от страха лицо так и просится в кадр! Запечатлеем момент! Скажи «СЫ-Ы-ЫР»!"
10055010-79 = ""
10055010-81 = ""
10055010-84 = ""
10055010-86 = ""
10055010-88 = "Последнее предупреждение: не уходите слишком далеко в открытое море."
10055010-89 = "П-почему?! Мы утонем?!"
10055010-90 = "Да нет... Дело скорее в том, что там водится. В порту поговаривают, что в последнее время здесь бродит какой-то корабль-призрак."
10055010-91 = "К-корабль-призрак...?!"
10055010-92 = "Я-то думал, вы, молодёжь, наслышаны об этом куда больше меня."
10055010-94 = "Я, я! Я слышала!! Если нужны слухи и сплетни, положитесь на меня, Мотомию Чиаки, секретаря Общества Пандемониум!"
10055010-95 = "Давным-давно пираты нашли в море сокровище. Но жадная команда захотела присвоить его себе, подняла бунт и выбросила капитана за борт."
10055010-96 = "Однако у моря своя справедливость. Оно прокляло вероломных пиратов и обрекло их вечно блуждать в бесконечном тумане..."
10055010-97 = ""
10055010-99 = ""
10055010-100 = "Знаете, днём рассказывать эту историю совсем не так жутко, как читать её ночью в одиночестве."
10055010-101 = "Надо же, Чиаки, сколько ты знаешь. Даже я, глава разведывательного комитета Общества Пандемониум, раньше не слышала этой истории. Впечатляет."
10055010-102 = "Хи-хи, спаси-и-ибо!"
10055010-104 = "Хм. Даже я, почитаемый лидер Общества Пандемониум, о таком не слышала. А ты что скажешь... Ироха?"
10055010-105 = "А? ...Ни за что, я не стану в это играть. Не смотрите на меня так."
10055010-106 = "Но я об этом слышала."
10055010-107 = "Не то чтобы специально искала, просто эта история разлетелась по соцсетям. Сейчас в Геенне труднее найти того, кто о ней не знает... Кроме нашего главы разведки и председателя..."
10055010-109 = "Ну почему такая жуткая история набрала популярность прямо перед нашей поездкой?"
10055010-110 = "Потому что его недавно видели, ну конечно!"
10055010-111 = "Видели?"
10055010-112 = "Ага. В сети появляются сообщения от совершенно разных людей, которые утверждают, будто видели его в одном месте и в одно время."
10055010-113 = "Будто он... и правда материализовался."
10055010-114 = ""
10055010-116 = ""
10055010-117 = "Только не говорите, что вы, студенты, проделали весь этот путь, потому что тоже верите в эту чушь."
10055010-118 = "А? Капитан, вы думаете, всё это выдумки?"
10055010-119 = "Пф! Я здесь рыбачил, когда вы ещё под стол пешком ходили! Если бы по моим водам плавал корабль-призрак, я бы его увидел!"
10055010-120 = "Меня больше раздражает переполох, который эти проклятые слухи устроили в городе!"
10055010-121 = "Ахаха... И то правда."
10055010-122 = "Если подумать, история ведь очень старая. СТРАННО, что корабль-призрак начали видеть только сейчас."
10055010-123 = "И слухи разлетелись лишь после того, как один человек заявил, что встретил его..."
10055010-124 = "Может, остальные просто захотели ухватить свою долю внимания и подхватили историю, когда она стала популярной!"
10055010-125 = "Что?! Кто посмел бы врать о таком в интернете? Я лично расследую это и накажу виновных!"
10055010-127 = "Забудьте старые байки. В действительности туманы здесь в последнее время густые. Если небо начнёт затягивать облаками, немедленно возвращайтесь, ясно?"
10055010-128 = ""
10055010-130 = ""
10055010-131 = "Море непредсказуемо. В нём всегда нужно быть настороже."
10055010-133 = "Кихехе! По-моему, небо совершенно ясное! Что вообще может случиться?"
10055010-134 = "Макото, ПОЖАЛУЙСТА, не накликай беду..."
10055010-136 = "О-о! Значит, мы правда отправляемся? Ура! Я сделаю кучу замечательных снимков!"
10055010-137 = "Но лодка и правда крошечная. Нам придётся сидеть очень тесно."
10055010-138 = ""
10055010-141 = ""
10055010-142 = "Ибуки занимает колени Сенсея!"
10055010-143 = ""
10055010-145 = ""
10055010-146 = "И-Ибуки?! У меня ведь тоже свободные колени! ИБУКИ-И?!"
10055010-154 = ""
10055010-155 = "Хм. А ведь здесь совсем неплохо, правда?"
10055010-156 = ""
10055010-158 = ""
10055010-160 = "И правда расслабляет! О, Ироха! Посмотри на меня! Улыбнись!"
10055010-161 = ""
10055010-163 = ""
10055010-166 = ""
10055010-168 = ""
10055010-170 = "А? Я не подписывала согласие на съёмку, так что не стоит фотографировать меня без разрешения."
10055010-171 = "Ахаха, да ладно тебе! Это же на память! Разве не хочешь сохранить воспоминания о морском путешествии?"
10055010-172 = ""
10055010-174 = ""
10055010-175 = ""
10055010-176 = "...Кстати, где Макото? Давно её не видела."
10055010-177 = "А, Макото? Её укачало, и она ушла прилечь."
10055010-178 = "Если её так укачивает, зачем вообще было устраивать круиз?"
10055010-179 = "Наверняка услышала слово «роскошный» и сразу загорелась! Ты же знаешь Макото!"
10055010-180 = "Мне никогда не понять её вкусы..."
10055010-181 = "Хотя я немного за неё волнуюсь! Пойду проведаю... и заодно сделаю пару снимков исподтишка!"
10055010-182 = "Хочешь сфотографировать её спящей?"
10055010-183 = "Ага! Макото всегда выглядит такой крутой на страницах «Еженедельника Пандемониума»! Было бы занятно показать, как она мужественно преодолевает морскую болезнь!"
10055010-184 = "Логично. Мне тоже распечатай экземпляр."
10055010-185 = "[s] «Никогда мне не понять её вкусы...»"
10055010-186 = "А-а-а? ВЫ хотите фотографию МАКОТО? И правда, в открытом море возможно всё!"
10055010-187 = "Договорились, тогда пошли! Только постарайтесь не шуметь!"
10055010-192 = ""
10055010-193 = "Макото? Мы войдём!"
10055010-194 = ""
10055010-196 = ""
10055010-198 = ""
10055010-199 = "А, Чиаки... и Сенсей. Что вы здесь делаете?"
10055010-200 = "Хотели узнать, не стало ли тебе лучше! ...А ещё я хотела тебя сфотографировать!"
10055010-201 = "К-кихе... Сы-ыр."
10055010-202 = "[s] «Ничего себе, она и правда позирует»."
10055010-203 = "Естественно... Как председатель Общества Пандемониум..."
10055010-204 = ""
10055010-206 = ""
10055010-207 = "...я должна всегда... сохранять величественный вид... *тошнит*"
10055010-208 = "[s1] «Сама напросилась».\n[s2] «Не суетись и отдыхай»."
10055010-211 = "Воспользуюсь вашей добротой и снова прилегу."
10055010-212 = ""
10055010-214 = ""
10055010-216 = ""
10055010-217 = "Вот уж чего никогда не думала увидеть."
10055010-218 = "И не говори. Хотела бы я, чтобы она всегда была такой тихой."
10055010-219 = "Ироха! Ну ты и безжалостная!"
10055010-220 = ""
10055010-225 = "Сацуки! Смотри туда! Чайки!"
10055010-226 = "О, и правда. Интересно, они летят за лодкой?"
10055010-229 = ""
10055010-230 = "Хи-хи."
10055010-231 = "...Что?"
10055010-232 = "Ироха, ты улыбаешься."
10055010-233 = "Тебе показалось."
10055010-234 = "[s] «Всё-таки здорово иногда вот так выбираться, правда?»"
10055010-235 = "Это... не самое худшее занятие на свете."
10055010-236 = ""
10055010-241 = ""
10055010-242 = "Эм, кто-нибудь ещё слышал? Как будто что-то зашипело."
10055010-243 = "Ага, звук был нехороший. Кажется, дизельный двигатель..."
10055010-244 = ""
10055010-246 = ""
10055010-247 = "У меня плохое предчувствие. Пойдёмте проверим."
10055010-248 = ""
10055010-255 = "Эм..."
10055010-258 = "Двигатель... заглох."
10055010-261 = "[log]Первый день в открытом море[/log]"
