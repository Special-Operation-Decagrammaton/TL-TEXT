[translation]
10055010-1 = "Episode 1;Romantic Cruising"
10055010-3 = "(Clear skies)"
10055010-7 = "(Gentle ripples lap against the hull, and the sea breeze brushes against my cheeks)"
10055010-8 = "(It was the perfect day for a boat trip)"
10055010-11 = "—So."
10055010-12 = "Where is our ship?"
10055010-13 = "You... Makoto Hanuma, was it?"
10055010-14 = "Indeed. I am the Supreme Chair of Pandemonium and the sole leader of Gehenna. #nHeaven and earth, I alone am honored—I am Makoto Hanuma."
10055010-15 = "Heaven and... whatever. Never mind, look, there's a signature right here, isn't there? #n\"Makoto Hanuma.\""
10055010-21 = "No, that can't be right!"
10055010-24 = "This pathetic excuse for a boat!?"
10055010-25 = "A piece of junk that looks like it'll sink at the slightest wave...!"
10055010-26 = "This is the cruise ship we're supposed to be boarding!?"
10055010-29 = "Iroha! What is the meaning of this!?"
10055010-33 = "What do you mean, 'what'? You were the one who rejected all my proposals, Makoto-senpai. #nSaying things like, 'This one is a better deal than those,' and so on."
10055010-34 = "W-well, that may be true, but... #nI certainly thought it was suspiciously cheap, but..."
10055010-35 = "Hah...! Could the Prefect Team have set a cowardly trap...!?"
10055010-36 = "Sigh... there's no way that's the case. #nPlease, try to face reality for once."
10055010-37 = "In other words... you were lured by the price and signed the contract for this boat, is that correct?"
10055010-38 = "I mean, you should have been able to tell before signing..."
10055010-39 = "Grrr! This is a trivial matter! Besides, even I, Makoto-sama, was—"
10055010-41 = "Hmm, is there some trouble? #nI did send you photos for confirmation beforehand, you know..."
10055010-43 = "...That's what they say."
10055010-44 = "Do you think I, the Chair of Pandemonium, have the time to check every little thing!?"
10055010-45 = "Your ability to act like you're in the right is almost artistic at this point."
10055010-47 = "So, shall we cancel the trip?"
10055010-48 = "Of course! If it gets out that we went on a trip in a boat like this? We'll be the laughingstock of the world!"
10055010-53 = "Trip... canceled?"
10055010-54 = "We're not going...?"
10055010-55 = "Is it... my fault? #nBecause I wasn't a good girl?"
10055010-56 = "Ngh!?"
10055010-57 = "Th-that's not it, Ibuki! #nA boat just needs to float on the sea! The size is a trivial detail!"
10055010-58 = "Yes! I was wrong. We can proceed with our boat trip as planned. #nIsn't that right, Sensei!?"
10055010-63 = "[ns] \"That's exactly right!!!\""
10055010-64 = "...Sigh, I suppose I have no choice."
10055010-65 = "Makoto-senpai is one thing, but I can't let Ibuki be sad."
10055010-67 = "Makoto-senpai and Iroha-chan are both so soft on Ibuki-chan, when it comes down to it!"
10055010-68 = "Hmm? Well, it doesn't matter to me either way... #nBut this is a little different from what I expected."
10055010-70 = "Hmm... it seems you've reached an agreement."
10055010-71 = "Well, she may look like this, but she's been working hard for 30 years."
10055010-72 = "Besides, even if a hole were to open in the floor, we're in the patrol area of the Odyssey Maritime School, so it'll be fine. #nIf you send a distress signal, they should be able to save you before you sink. Hahaha!"
10055010-77 = "...Even if that's a joke, it's not funny. #nAre you really sure it's safe?"
10055010-78 = "Satsuki-senpai, you don't have to be scared! But your scared face is also quite good! One for the memories, say cheese!"
10055010-88 = "Ah, yes, one more thing... Try not to go too far out."
10055010-89 = "Um, Makoto-chan... isn't this actually dangerous?"
10055010-90 = "No, that's not what I meant. #n...There have been rumors lately about a ghost ship appearing."
10055010-91 = "A-a ghost ship...!?"
10055010-92 = "You lot seem to know more about it than I do... have you not heard?"
10055010-94 = "When it comes to rumors and gossip, leave it to me—Chiaki Motomiya, the scribe of Pandemonium! #n...I have heard of it!"
10055010-95 = "Once upon a time... pirates who found a hidden treasure at sea kicked their captain off the ship to keep the loot for themselves."
10055010-96 = "It is said that the pirates, having incurred the wrath of the Sea God, are still wandering through the fog to this day..."
10055010-100 = "...Huh? It was actually pretty scary when I read it."
10055010-101 = "That's the first I've heard of that story, even as the Intelligence Chief. You're well-informed, Chiaki."
10055010-102 = "Hehe, thank you!"
10055010-104 = "Hmm, even Makoto-sama, the Chair, is involved. #nHey, Tank Commander—Iroha, have you heard of it?"
10055010-105 = "Eh? What is it... all of a sudden. #nI don't do ghost stories."
10055010-106 = "I have heard of it, though."
10055010-107 = "It pops up on social media trends quite often. #nI think there are fewer people who don't know about it."
10055010-109 = "Why are such rumors circulating... it's creepy."
10055010-110 = "Apparently, there have been quite a few sightings?"
10055010-111 = "Sightings?"
10055010-112 = "Yes! It seems quite a few people have seen the ship in the same place at the same time."
10055010-113 = "It might really be... a ghost ship."
10055010-117 = "Did you lot come here to verify those rumors, too?"
10055010-118 = "Oh, you don't believe in it, Captain?"
10055010-119 = "Of course not. How many years do you think I've been a fisherman here? #nIf a ghost ship actually existed, I would have seen it ages ago."
10055010-120 = "The whole town is in an uproar because of those rumors... *sigh*."
10055010-121 = "Ah, I see... that makes sense."
10055010-122 = "It's an old folktale, so it's strange that sightings are popping up recently..."
10055010-123 = "Thinking about it, it feels like people only started seeing it after the rumor was first posted..."
10055010-124 = "Is it a trend or something? Maybe more people are just saying they saw it because someone else started the rumor."
10055010-125 = "So it's just a lie in the end? #nWhat could anyone possibly gain from spreading such a rumor..."
10055010-127 = "Well, rumors aside... it is true that there's been a lot of fog lately. #nIf the sea looks even slightly strange, turn back immediately."
10055010-131 = "The sea is fickle. It's best to proceed with caution."
10055010-133 = "Kiki! What are you saying in this clear weather? There's nothing to worry about."
10055010-134 = "Makoto-senpai, please don't jinx it."
10055010-136 = "Oh! So we're going then? I'll be able to take lots of great photos!"
10055010-137 = "Still, this boat is a bit small... we'll have to sit close together."
10055010-142 = "Then I'll sit on Sensei's lap!"
10055010-146 = "I-Ibuki!? My lap is empty too, you know? Ibuki~~!?"
10055010-155 = "Heh, isn't this pretty nice?"
10055010-160 = "It certainly feels like a power spot! #nOh, Iroha-chan, say cheese!"
10055010-170 = "Please don't take pictures without asking. That's an infringement of my portrait rights."
10055010-171 = "Ahaha! It's just a commemorative photo! We're at the sea, after all."
10055010-176 = "...Huh? Come to think of it, Makoto-senpai isn't here."
10055010-177 = "If you're looking for Makoto-chan, she's inside. #nLooks like she got seasick."
10055010-178 = "Why would she plan a boat trip if she gets seasick?"
10055010-179 = "Maybe she was lured by the idea of a 'luxury cruise ship'! #nMakoto-senpai likes that sort of thing, right?"
10055010-180 = "Sigh... it's like she just wants to show off."
10055010-181 = "Hmm... but I'm a little worried... maybe I'll go check on her. #nI'll bring my camera just in case—"
10055010-182 = "Camera...?"
10055010-183 = "I usually only take photos when everyone is fired up, so having a photo of her looking weak for once would be a nice gap moe!"
10055010-184 = "Ah, I see... I suppose one photo like that wouldn't hurt."
10055010-185 = "[s] \"So even Makoto has her weaknesses...\""
10055010-186 = "Makoto-senpai tries to hide it, though! You'd better not bring it up too much!"
10055010-187 = "Alright, charging in!"
10055010-193 = "Makoto-senpai, excuse me!"
10055010-199 = "Ah, Chiaki and... Sensei. Is something the matter?"
10055010-200 = "I was worried about you, Senpai! Are you okay? #nAlso, may I take a picture?"
10055010-201 = "K-kiki... Ah, no problem."
10055010-202 = "[s] \"Are you okay? Don't push yourself.\""
10055010-203 = "Kiki, this is nothing... for the Chair of Pandemonium."
10055010-207 = "To always be dignified, anytime, anywhere... Ugh...!"
10055010-208 = "[s1] \"You're pushing yourself too hard by talking...\"\n[s2] \"Please, get some rest.\""
10055010-211 = "Ah. I shall take you up on your kindness and rest, Sensei."
10055010-217 = "Makoto-senpai didn't have much energy, did she?"
10055010-218 = "Indeed. It would be nice if she were that quiet all the time."
10055010-219 = "Iroha-chan, you're so sharp!"
10055010-225 = "Satsuki-senpai! Look! Seagulls!"
10055010-226 = "Oh, you're right. I wonder if they're following the ship."
10055010-230 = "Hmph-hmm?"
10055010-231 = "...What was that for?"
10055010-232 = "Iroha-chan, you seem to be in a good mood?"
10055010-233 = "What are you talking about?"
10055010-234 = "[s] \"It's nice to go out together like this, isn't it?\""
10055010-235 = "Well... it's not bad, I suppose."
10055010-242 = "...? Did you hear a strange sound just now? #nLike a 'psshhh' sound."
10055010-243 = "That sounds like... a diesel engine. #nBut that sound just now..."
10055010-247 = "I have a bad feeling about this. #nLet's go check."
10055010-255 = "This is..."
10055010-258 = "The engine... has stopped."
10055010-261 = "[log] D r i f t i n g   D a y   1 [/log]"