[translation]
10045070-1 = "Эпизод 7;Хяккарёран против Хяккарёран"
10045070-2 = "Спасибо, Юкари. Без твоих усилий мы бы не победили."
10045070-3 = "Не за что! Но всё благодаря тебе! Ты напомнила мне, что значит идти путём Хяккарёран!"
10045070-4 = "Я рада это слышать, Юкари."
10045070-5 = ""
10045070-7 = "(Люди живут, помогая друг другу.)"
10045070-8 = "(Никто не должен нести весь груз один и не должен стыдиться своих естественных слабостей.)"
10045070-9 = ""
10045070-11 = ""
10045070-12 = "(...Правда, Аямэ?)"
10045070-13 = ""
10045070-15 = "Следом мы встретимся с Рэнгэ и Кикё, Юкари. Сможем ли мы победить их в бою?"
10045070-16 = "Я знаю их силу лучше всех!"
10045070-17 = "Но наша командная работа крепка, а дух ещё крепче!"
10045070-18 = "Победа, поражение — неважно! Мы просто отдадим всё в предстоящем бою!"
10045070-19 = "Это на тебя похоже."
10045070-20 = "Моя правая рука достаточно восстановилась, чтобы использовать её в следующем матче."
10045070-21 = "Проложим путь вперёд так, чтобы не осталось места для сожалений."
10045070-22 = "Фуфуфу! Само собой!"
10045070-23 = ""
10045070-24 = "Нам нужно придумать план, Кикё."
10045070-25 = "В прошлом раунде мы едва вырвали победу, но в следующем так не получится."
10045070-26 = "Есть какие-нибудь умные предложения?"
10045070-27 = "Конечно нет! Это твоя работа, госпожа оперативный офицер."
10045070-28 = "*вздох* Иного я и не ожидала."
10045070-29 = "..."
10045070-30 = "Для начала Нагуса и Юкари будут стремиться к честному бою."
10045070-31 = "Они никогда не прибегнут к грязным уловкам, потому что..."
10045070-32 = "Потому что знают: именно такого боя ты больше всего хочешь избежать."
10045070-33 = "Да. Суть стратегии — действовать неожиданным образом.#nЕсли они загонят нас силой, мы окажемся в невыгодном положении."
10045070-34 = "Поэтому перед нами только один путь."
10045070-35 = "Сражаться с ними в лоб."
10045070-36 = "Когда стратегии нет места на поле боя..."
10045070-37 = "...победит более сплочённая команда. Всё превращается в психологическую игру."
10045070-38 = "О? Тогда преимущество у нас!"
10045070-39 = "...По какой причине?"
10045070-41 = "Мы знаем друг друга чуть ли не с пелёнок! Кто может работать вместе лучше нас?"
10045070-42 = "Рэнгэ..."
10045070-43 = "Это ты и я, Кикё. Конечно, мы победим."
10045070-44 = "..."
10045070-45 = "Ты и правда..."
10045070-46 = "Понятно. Я разработаю план."
10045070-47 = "Идеально подходящий нам с тобой, Рэнгэ."
10045070-48 = "Сделаем это!"
10045070-50 = "Некоторое время спустя..."
10045070-52 = "Это финальный раунд драматичного матча на возвращение!"
10045070-53 = "[ns] «Не могу дождаться, чем всё закончится!»"
10045070-57 = ""
10045070-58 = "Интересно, кого Наставник считает победителем."
10045070-59 = "Не отвлекайся."
10045070-60 = "Сосредоточься на противнике перед собой, Рэнгэ."
10045070-61 = "Вот это мне нравится, Кикё! В тебе снова появился дух!"
10045070-65 = ""
10045070-66 = "Кикё и Рэнгэ... Вокруг них прямо чувствуется иная атмосфера."
10045070-67 = "Мы тоже укрепили свою решимость!"
10045070-68 = "Пусть четверо из нас покажут..."
10045070-69 = "...честный бой во славу имени Хяккарёран!"
10045070-71 = "А теперь! Пусть матч начнётся!!"
10045070-72 = ""
10045070-75 = "[ns] «Команда Нагусы идёт в атаку!»"
10045070-76 = ""
10045070-79 = "Какая свирепая силовая подача! Смогут ли они ответить?"
10045070-80 = "Рэнгэ!"
10045070-81 = "Поняла!"
10045070-82 = ""
10045070-84 = ""
10045070-86 = ""
10045070-87 = "[ns] «Чистый приём!»"
10045070-88 = "Переходим к Типу-0!"
10045070-89 = "Уже!"
10045070-90 = "Что ещё за «Тип-0»?"
10045070-91 = ""
10045070-93 = ""
10045070-95 = "Ха...!!"
10045070-96 = ""
10045070-100 = "...!!"
10045070-101 = "Ах! Какая идеальная точность в передаче Кикё... и это атака с задержкой от Рэнгэ?! Ох, Нагуса попалась!"
10045070-103 = "Нас поймали!"
10045070-105 = "Тогда я должна...!"
10045070-106 = ""
10045070-108 = ""
10045070-110 = "Кья-а-а...!!"
10045070-112 = "Она приняла это...?!"
10045070-113 = "Отлично, Юкари! Ничего другого от моей младшей и не ждала!"
10045070-115 = "Хоп! Вверх и через!"
10045070-116 = ""
10045070-118 = ""
10045070-121 = "Первое касание моё!"
10045070-122 = "Есть!"
10045070-123 = ""
10045070-125 = ""
10045070-127 = "Ух...!"
10045070-128 = "Отличный приём! Дальше «Юность S»!"
10045070-129 = "Ю-Юность..."
10045070-130 = ""
10045070-132 = ""
10045070-134 = "Ты стесняешься?!"
10045070-135 = "Ю-ЮНОСТЬ S!"
10045070-136 = ""
10045070-138 = ""
10045070-141 = "Резкий удар! Смогут ли они его остановить?!"
10045070-143 = "...!!"
10045070-144 = "А!!"
10045070-145 = ""
10045070-148 = "Очко! Команда Рэнгэ получает очко!"
10045070-149 = "[ns] «Они точно нашли брешь в защите!»"
10045070-150 = "Ты избавилась от сомнений, Кикё?"
10045070-151 = "...Я поняла, что должна принять и то, что могу, и то, чего не могу."
10045070-152 = "Ведь даже когда мне чего-то не хватает, есть те, кто всё равно верит в меня."
10045070-153 = "И эти «те» — конечно же, Хяккарёран."
10045070-154 = "Да. Вот наш оперативный офицер Хяккарёран."
10045070-156 = "Ах, ах! Неужели мечты моей юности воплощаются? Совместная прогулка в чистейшем виде! Да!"
10045070-157 = "Согласна! Но матч остаётся матчем. Мы не будем вам поддаваться."
10045070-158 = "Ты словно сняла слова у меня с языка."
10045070-159 = "Я высвобожу всю мощь своей правой руки. Смотрите."
10045070-160 = "Сколько ещё раз мне говорить, насколько это неловко...?"
10045070-161 = "Хм, наши игроки обмениваются словами в самом пылу матча!"
10045070-162 = "Но теперь они выглядят ещё более заряженными на игру!"
10045070-164 = "Весь матч они шли ноздря в ноздрю, и дело дошло до равного счёта."
10045070-165 = "Счёт постепенно дополз до 20:20, когда..."
10045070-175 = "А! Они забили! Получилось!"
10045070-176 = ""
10045070-178 = ""
10045070-179 = "Какая яростная борьба! Обе стороны были великолепны, но команда, которая наконец берёт матч-пойнт...!!"
