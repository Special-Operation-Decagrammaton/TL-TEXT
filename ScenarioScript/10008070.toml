10008070-104 = ""
10008070-105 = ""
10008070-107 = ""
10008070-108 = "Раз уж вы знаете, что мы преступники, можно больше не притворяться и решить всё простым способом."
10008070-109 = "[s] «Они идут!»"
10008070-111 = "Что?!"
