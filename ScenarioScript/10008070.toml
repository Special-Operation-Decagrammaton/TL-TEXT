[translation]
10008070-1 = "Эпизод 7;В западне! Часть 1"
10008070-3 = "Они нас уделали!"
10008070-4 = "Наша мечта! Что теперь делать, Красный?"
10008070-5 = "Как такое возможно? Как эти злодеи растоптали нашу справедливость?"
10008070-6 = ""
10008070-8 = ""
10008070-12 = "[ns] «Кажется, мы победили.»"
10008070-13 = "М-Мы сделали это, Ару!"
10008070-14 = "Фух. Это были последние?"
10008070-15 = "Чего вы так устали? Было проще, чем я думала."
10008070-17 = "Победа есть победа. Я бы предпочла не затягивать дольше необходимого."
10008070-18 = "Отлично сработано, все. Командная работа была превосходной — включая нашего приглашённого участника."
10008070-19 = "О, и про тебя нельзя забывать, Сенсей. Как всегда, отличные команды."
10008070-20 = "С тобой во главе всё прошло ещё гладче."
10008070-21 = "Ты, эм... заслуживаешь моей благодарности."
10008070-22 = "Я горжусь тем, что ты один из наших деловых партнёров. ♪"
10008070-23 = "[s] «Ты заставишь меня покраснеть.»"
10008070-24 = ""
10008070-26 = ""
10008070-27 = "Что ж. Осталось только забрать у них ящик."
10008070-29 = "Ха. Большое спасибо, что избавили нас от хлопот."
10008070-31 = "Хм? Что ещё?"
10008070-32 = "Ару, посмотри туда. Туда!"
10008070-33 = ""
10008070-35 = ""
10008070-38 = ""
10008070-39 = "Вам удалось отбить наш ящик у этих хулиганов. Даже не знаю, как вас благодарить."
10008070-41 = "Подождите. Разве вы не...?"
10008070-42 = "Управляющий Дайкичидэна."
10008070-44 = "О, этот наряд. Вы, случайно, не одна из наших подработчиц?"
10008070-45 = "Какая приятная неожиданность!"
10008070-46 = "Вы не только помогали нам у святыни, но ещё и участвовали в возвращении ящика."
10008070-47 = ""
10008070-49 = ""
10008070-50 = "Я обязательно награжу каждого из вас позже. А теперь, будьте добры, передайте ящик."
10008070-51 = "Всем стоять."
10008070-52 = "В чём дело?"
10008070-53 = "В интервью вы сказали, что тот, кто вернёт ящик, сможет забрать содержимое. Разве не таковы правила?"
10008070-55 = "Точно. Я почти забыла."
10008070-56 = "Верно, ты это сказал в эфире!"
10008070-58 = "А теперь пытаешься забрать его себе. Почему вдруг передумал?"
10008070-59 = ""
10008070-61 = "..."
10008070-62 = "Я ведь действительно говорил что-то такое...?"
10008070-63 = "Ну, понимаете. Дело в том..."
10008070-64 = ""
10008070-66 = ""
10008070-67 = ""
10008070-68 = ""
10008070-72 = ""
10008070-74 = "О-Откуда они взялись?!"
10008070-75 = "Ха! Застали нас врасплох, да?"
10008070-76 = "Вы драки ищете?"
10008070-78 = "Всё было бы гораздо проще, если бы вы просто забыли мои слова в интервью."
10008070-79 = "Сами виноваты, что усложнили то, что могло быть просто. Боюсь, вы не оставили мне выбора."
10008070-80 = "Я так и знала. Ты изначально не собирался выполнять обещание из интервью."
10008070-81 = "[s] «Тогда зачем вообще такое говорить? Ещё и на камеру.»"
10008070-82 = "Потому что это была та же тактика, что и раньше. Они использовали СМИ и соцсети, чтобы манипулировать всеми."
10008070-83 = "Так они получали желаемое, не пачкая рук."
10008070-85 = "Вы... врали в интернете? Кто вообще так делает?!"
10008070-87 = "Да. Врал. СМИ так легко манипулировать."
10008070-88 = "Мне всего лишь нужно было немного соврать, что ящик достанется тому, кто его вернёт, — и посмотрите, что получилось."
10008070-89 = ""
10008070-91 = ""
10008070-92 = "Бесплатная рабочая сила со всего Кивотоса сама вызвалась сделать за меня грязную работу, и вот ящик снова у меня в руках."
10008070-94 = "Аргх!"
10008070-96 = "Нас интересовало только возвращение ящика.#nИспользовать СМИ было лучшим способом добиться этого."
10008070-97 = "[s] «Обычный рабочий день банды Курокамэ, да?»"
10008070-98 = "Быстро схватываешь! Мне нравится."
10008070-99 = "Более того! Мы уже всё поняли. Мы знаем, что ящик Дайкичидэна использовали для отмывания грязных денег!"
10008070-100 = "Хорошо. Это всё упрощает."
10008070-101 = "А-А?"
