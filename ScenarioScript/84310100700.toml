[translation]
84310100700-5 = ""
84310100700-6 = "...?? Что сейчас произошло?"
84310100700-7 = "Судя по твоему лицу... ты будто только что выбралась из смертельно опасной ситуации."
84310100700-8 = ""
84310100700-10 = ""
84310100700-11 = "Ух, что теперь случилось?!"
84310100700-12 = "Мы же сказали звонить, если что-то произойдёт! Так что случилось?!"
84310100700-14 = "Нет-нет, всё нормально. Ничего такого."
84310100700-15 = "Ну, не совсем «ничего», но и не то «что-то», о котором вы думаете. Просто..."
84310100700-18 = "Сэя рассказала Нэру и Рио, что произошло."
84310100700-19 = ""
84310100700-21 = "Эм... Ну... Да..."
84310100700-22 = "Очень на неё похоже, конечно, но..."
84310100700-23 = "...Отохана Сумирэ — это нечто."
84310100700-24 = "Нет, я бы сказала, Сэя ещё удивительнее, раз сумела сбежать. Для этого нужен талант."
84310100700-26 = "Вы обе выглядите мрачно. Что было бы, если бы она меня поймала? Тренировка была бы очень тяжёлой?"
84310100700-27 = "ОЧЕНЬ тяжёлой? Нет, скорее..."
84310100700-29 = "Нэру сказала Сэе, что у неё хорошие инстинкты и хорошо, что её не поймали."
84310100700-32 = "Меньше 2% учеников Отоханы Сумирэ заканчивают её программу тренировок. Меньше 1% уходят домой на своих двоих."
84310100700-33 = "...А остальные 98%...?"
84310100700-34 = "...Ну..."
84310100700-36 = "Пока Сэя ждала ответа, её прошиб холодный пот, хотя она вообще не тренировалась."
