[translation]
10002045-1 = "Эпизод 4; Песчаные замки и загар, часть 2"
10002045-2 = "(Когда пыль — то есть песок — осела, замок оказался почти полностью разрушен.)"
10002045-3 = "А..."
10002045-4 = "Песчаный замок Азусы и Маширо..."
10002045-5 = "Не переживай, Хифуми. Форма — это пустота, пустота — это форма. Всё обречено однажды разрушиться и исчезнуть."
10002045-6 = "Н-Но..."
10002045-7 = "Песчаный замок можно построить заново. Выживание куда важнее в таком пустом мире."
10002045-8 = "Верно. Зло может быть где угодно. Мы должны всегда быть готовы с ним сражаться."
10002045-9 = "Я уже вообще не понимаю, что происходит..."
10002045-10 = "Что нам теперь делать?"
10002045-11 = "Как мы выполним наши задания?"
10002045-14 = ""
10002045-15 = "Ч-что думаешь, Цуруги?"
10002045-16 = "Ки-хе-хе-хе!"
10002045-18 = "Ха-ха-ха-ха!"
10002045-19 = "[s] «Похоже, ей снова весело.»"
10002045-21 = "Я-я поверю вам на слово, Сенсей."
10002045-22 = "О, я только сейчас поняла, что мы сделали фото только с песчаным замком. Нам ещё нужна фотография, где мы загораем. Что будем делать?"
10002045-23 = "А? Вы уже сделали, Сенсей?"
10002045-24 = "К-когда? И кто на фотографии?"
10002045-25 = "Что? Там были хулиганы?"
10002045-26 = "Что вообще...?"
10002045-27 = "Можно посмотреть?"
10002045-28 = ""
10002045-30 = ""
10002045-31 = ""
10002045-32 = "[ns] Передать Хифуми фотографию."
10002045-33 = ""
10002045-34 = ""
10002045-35 = "Как бы это сказать...?"
10002045-36 = "Не думаю, что это считается загаром, Сенсей."
10002045-37 = "Скорее выглядит так, будто их заживо закопали."
