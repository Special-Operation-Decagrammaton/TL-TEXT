[translation]
1001203-1 = "Мой тренер и я"
1001203-2 = "Торговый центр возле Миллениума"
1001203-4 = "Я случайно проспала и опоздала на встречу с Сумире на полчаса."
1001203-5 = "[s] Поискать Сумирэ."
1001203-6 = "(Я осмотрел место встречи, но её нигде не было.)"
1001203-7 = "[s] «Хм?»"
1001203-9 = ""
1001203-10 = ""
1001203-11 = ""
1001203-12 = ""
1001203-13 = "*тяжело дышит* *тяжело дышит*"
1001203-14 = "А? Тренер!"
1001203-15 = "Я ждала тебя."
1001203-16 = "[s] «Прости, что опоздал.»"
1001203-17 = "Ничего страшного."
1001203-18 = "Вообще-то я переживала, что из-за наших планов не успею потренироваться сегодня."
1001203-19 = "Но благодаря твоему опозданию успела сделать немного приседаний."
1001203-20 = "Отличное упражнение."
1001203-21 = "Я сделала совсем немного, а мышцы уже горят."
1001203-22 = "[s] «Ты же в общественном месте. Тебя не смущает, что люди смотрят?»"
1001203-23 = "Такое приятное... А?"
1001203-24 = "Ах..."
1001203-25 = "Аааа!"
1001203-26 = ""
1001203-28 = "[s] «С-Сумирэ!»"
1001203-29 = "(Я побежал в ту сторону, куда исчезла Сумирэ.)"
1001203-31 = "У-ух..."
1001203-32 = "П-Прости, Тренер."
1001203-33 = "Я просто искала способ с пользой провести время."
1001203-34 = "И подумала, что это идеальный момент для приседаний."
1001203-35 = "Я собиралась сделать всего несколько, но потом вошла в ритм и..."
1001203-36 = "Е-Если..."
1001203-37 = "Если тебе кажется, что я делаю слишком много, тогда..."
1001203-38 = "[s1] «Нет, дело не в этом.»\n[s2] «Я рад, что ты так предана делу.»"
1001203-39 = "Спасибо. Мне нужно было это услышать."
1001203-40 = "Спасибо. Мне нужно было это услышать."
1001203-41 = "Но всё же, если я когда-нибудь сделаю что-то, что тебя беспокоит..."
1001203-42 = "...я хочу, чтобы ты сказал мне."
1001203-43 = "Фитнес для меня очень важен..."
1001203-44 = "...но важнее всего для меня..."
1001203-45 = "..."
1001203-46 = "[s] «...?»"
1001203-47 = "Н-Ничего! Забудь, что я сказала!"
1001203-48 = "В-В любом случае! Мы ведь собирались покупать протеиновые добавки?"
1001203-49 = "Пошли!"
1001203-50 = ""
1001203-52 = "(Мы купили протеиновые добавки вместе с почему-то смущённой Сумирэ.)"
1001203-54 = "Пригородные улицы Миллениума"
1001203-55 = "Спасибо, что сегодня сходил со мной за покупками, Тренер."
1001203-56 = "Ты помог мне найти всё необходимое."
1001203-57 = "Особенно благодарна за то, как ты находишь скидки."
1001203-58 = "То, как ты протиснулся сквозь толпу ради того протеина, было потрясающе."
1001203-59 = "Ты отличный пример решительности и мотивации."
1001203-60 = "Хотя было ещё забавно смотреть, как прохожие недоумевают, куда ты так несёшься."
1001203-61 = "Я бы никогда не смогла сделать что-то подобное."
1001203-62 = "[s3] «Ха-ха. Теперь мне немного неловко.»\n[s4] Хвастаться изо всех сил."
1001203-63 = "Хи-хи. Ты такой забавный."
1001203-64 = "Хи-хи. Ты такой забавный."
1001203-65 = "В любом случае, думаю, на сегодня хватит."
1001203-66 = "Что? Думаешь, я купила слишком много добавок?"
1001203-67 = "Ты удивишься, как быстро они у меня заканчиваются."
1001203-68 = "К тому же..."
1001203-69 = "...у меня есть ощущение, что скоро они понадобятся ещё кое-кому."
1001203-70 = "Хм? Хочешь узнать кому?"
1001203-71 = "Секрет."
1001203-72 = "Скоро сам узнаешь. Хи-хи."
1001203-73 = "Мне пора возвращаться."
1001203-74 = "Осторожнее по дороге домой, Тренер."
1001203-75 = ""
1001203-77 = "(Я отправился домой, гадая, кого Сумирэ имела в виду.)"
