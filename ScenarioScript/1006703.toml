[translation]
1006703-1 = "Причина существования"
1006703-2 = "Исполнительный офис Шале"
1006703-4 = "Сегодня в Шале тоже спокойно. Это хорошо."
1006703-5 = "О, Сенсей. Передайте мне, пожалуйста, те картофельные чипсы."
1006703-6 = ""
1006703-10 = "[ns1] «Хорошо, что тебе здесь комфортно...»\n[ns2] «Но, по-моему, тебе здесь уже слишком комфортно, знаешь?!»"
1006703-13 = ""
1006703-14 = "Хм? Это серьёзная проблема? Нет?"
1006703-15 = "Тогда ничего страшного. Не волнуйтесь. Чипсы, которые я съела, я пополню."
1006703-17 = "Меня уже некоторое время беспокоила одна проблема."
1006703-18 = "Она не была серьёзной, но Токи начала чувствовать себя в Шале уж слишком как дома."
1006703-19 = "Пару дней назад я серьёзно поговорил с Токи, но..."
1006703-20 = ""
1006703-21 = "Почему я так часто прихожу в Шале?"
1006703-22 = "Причин несколько, но главная — моё положение сейчас не совсем определено."
1006703-23 = "Из-за этого мне трудно действовать вместе со старшими, несмотря на мой позывной Zero-Four в C&C."
1006703-24 = "Поэтому Шале для меня — самое эффективное место."
1006703-25 = "Здесь я могу легко получать приказы и предпринимать необходимые действия в любой ситуации."
1006703-26 = "В таких обстоятельствах любой предпочёл бы оставаться в Шале. Разве нет?"
1006703-28 = "Тогда мне нечего было на это ответить."
1006703-29 = "И вот всё зашло ещё дальше..."
1006703-30 = ""
1006703-31 = "Хм. От солёного захотелось пить. Сенсей, дайте мне того зелёного чая."
1006703-32 = ""
1006703-34 = ""
1006703-36 = ""
1006703-37 = ""
1006703-39 = ""
1006703-41 = "О, чайный стебелёк стоит вертикально. Сегодня счастливый день."
1006703-42 = "Аромат отличный, и вкус тоже. Не знала, что вы любите зелёный чай."
1006703-43 = "[s] «Эм... Мне его вроде как подарили.»"
1006703-44 = "Вот как. Понятно. Тогда я немного разочарована."
1006703-45 = "[ns] «Почему?!»"
1006703-46 = "Что вы планируете взять сегодня на обед?"
1006703-47 = "Не беспокойтесь обо мне. Я совершенно не против, если вы закажете только на себя и поедите в одиночестве."
1006703-48 = "Со мной всё будет прекрасно. Моё настроение ничуть не изменится, и никаких сильных эмоций я не испытаю."
1006703-49 = ""
1006703-56 = "[ns3] «Здравствуйте, это Шале... Можно заказать на двоих?» \n[ns4] «Два специальных полезных комплексных обеда, пожалуйста...»"
1006703-59 = "О, вы заказали две порции."
1006703-60 = "Тогда у меня нет выбора, придётся поесть вместе с вами."
1006703-61 = "[s] «Ага. Нужно есть и овощи, и белок...»"
1006703-62 = "Когда вы так говорите, создаётся впечатление, будто до этого я питалась одной вредной едой..."
1006703-63 = "[s] «А разве нет...?»"
1006703-64 = "..."
1006703-65 = "Прошлое осталось в прошлом. Нужно скорее забыть его и шагнуть в светлое будущее."
1006703-66 = "[s] «Хотя бы попытайся придумать оправдание...!»"
1006703-72 = "[ns] «Кстати, Токи...»"
1006703-73 = ""
1006703-74 = "Да?"
1006703-75 = "Да. Конечно, когда день заканчивается, я возвращаюсь в свой кабинет."
1006703-76 = "Почему я не остаюсь ждать в собственном кабинете?"
1006703-77 = "..."
1006703-78 = "Вам... тяжело от того, что я нахожусь здесь...?"
1006703-79 = "[s5] «Нет-нет-нет, совсем не поэтому!»\n[s6] «Просто мне казалось, что тебе будет скучно приходить в пустой кабинет!»"
1006703-82 = "Я особо так не чувствую."
1006703-83 = "Значит, я могу оставаться здесь, верно?"
1006703-84 = "[s] «Ну, если ты так хочешь...»"
1006703-85 = "Хи-хи-хи..."
1006703-86 = "Хм? Но вас беспокоят слухи о Шале?"
1006703-88 = "Из-за Токи начали распространяться странные слухи..."
1006703-89 = ""
1006703-90 = "Ты слышал? Говорят, Сенсей из Шале..."
1006703-91 = "Да, слышала! Сенсей заставляет студентов носить костюмы кроликов... и, похоже, ему это нравится, да?"
1006703-92 = "Я слышала, что Сенсей хороший человек, но никогда не знаешь наверняка..."
1006703-93 = "Ещё вчера кто-то видел, как студент в костюме кролика заходила в Шале..."
1006703-94 = "Вот примерно так..."
1006703-96 = ""
1006703-98 = "Я попытался поговорить об этом с Токи..."
1006703-99 = "Хм. Ничего важного. Это всего лишь слухи, очень далёкие от истины."
1006703-100 = "Для начала, я единственный студент, который приходит в Шале в костюме кролика."
1006703-101 = "И вам это не нравится, значит слух полностью неверный."
1006703-102 = "...Или вы тайком всё-таки наслаждаетесь этим?"
1006703-103 = "[ns] «Нет, вообще нет!»"
1006703-104 = "Я знала, что вы так ответите."
1006703-105 = "В любом случае, не думаю, что нужно принимать меры против каждого ложного слуха, который мы слышим."
1006703-106 = "Так что считаю дело закрытым."
1006703-107 = "[s] «А точно всё будет нормально...?»"
1006703-108 = "Конечно. Я не вижу никаких проблем."
1006703-109 = "Хм? Ваша репутация? Хм... Не уверена. Пока воздержусь от решения."
1006703-110 = ""
1006703-114 = "О, доставка пришла."
1006703-115 = ""
1006703-117 = ""
1006703-118 = "Я заберу."
1006703-119 = ""
1006703-122 = "Сенсей? Почему вы так торопитесь? Хм? Сами заберёте?"
1006703-123 = "..."
1006703-124 = "Подтверждаю, хотя я не совсем понимаю..."
1006703-126 = "Почему-то после этого обед с Токи пошёл у меня не очень."
