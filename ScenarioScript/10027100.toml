[translation]
10027100-1 = "Эпизод 10; «Предложения» Трудовой партии"
10027100-9 = "Снежные поля Красной Зимы"
10027100-10 = "*тяжело дышит* *тяжело дышит*"
10027100-11 = "Мы... победили?"
10027100-12 = "Мы одолели Секретариат, но боюсь, это повредит нашим отношениям..."
10027100-13 = "Не волнуйся. Секретариат и так считал Фронт освобождения знаний занозой в боку."
10027100-14 = "Это, конечно, правда, но..."
10027100-16 = ""
10027100-18 = "[ns] «Те, кто встанет у нас на пути, сами себя погубят!»"
10027100-19 = "С-Сенсей?!"
10027100-20 = "Давайте! У нас заканчивается время!"
10027100-23 = "Стойте! Во имя труда и революции я должна высказаться!"
10027100-25 = "Что теперь?!"
10027100-26 = ""
10027100-28 = ""
10027100-32 = ""
10027100-34 = "Эм...? Тут целая толпа членов Трудовой партии и... сама президент Минори?!"
10027100-36 = "Слава богу, что я нашла вас здесь."
10027100-37 = "Я слышала, Фронт освобождения знаний прилагает огромные усилия для создания фанфика по «Луне»."
10027100-39 = "Я бы не сказала, что прямо огромные..."
10027100-40 = "Почему Трудовую партию так интересует наш фанфик?"
10027100-42 = "Мы уважаем дух Фронта освобождения знаний. Прежде всего мы хотим возродить наследие прошлого и применить его в современной эпохе."
10027100-43 = "Чем больше мы узнаём об истории труда, тем сильнее вдохновляемся на восстание и свержение существующего порядка!"
10027100-45 = "(Они правда думают, что «Луна» была об этом?)"
10027100-46 = "(Да быть такого не может...)"
10027100-48 = "В этом духе у нас есть для вас предложение!"
10027100-49 = "Мы предлагаем Фронту освобождения знаний переработать текущий фанфик так, чтобы подчеркнуть эти революционные идеалы!"
10027100-51 = "Революция! Революция!"
10027100-53 = "И более того! Чтобы просветить рабочий класс и освободить его от гнёта угнетателей, мы предлагаем сделать борьбу рабочих главной темой!"
10027100-55 = "Свобода! Свобода!"
10027100-56 = ""
10027100-58 = ""
10027100-61 = "[ns] «Откуда вы вообще взяли эти идеи?»"
10027100-62 = ""
10027100-63 = "Я всё ждала, когда вы наконец заговорите..."
10027100-64 = "Я благодарна Трудовой партии и ценю, что вы посещаете нашу библиотеку."
10027100-66 = "Но мы не можем согласиться на вашу просьбу."
10027100-67 = "Да! У нас нет времени!"
10027100-68 = ""
10027100-70 = ""
10027100-72 = ""
10027100-73 = "Очень жаль это слышать. Мы многому научились благодаря литературным произведениям, которые собирают библиотекари Фронта освобождения знаний."
10027100-74 = "Я мечтала о союзе, в котором мы вместе проучим эти мерзкие усы, выбрасывающие крышечки от йогурта, не облизав их!"
10027100-75 = "[s] «Так я и знал, что за той листовкой стояла Трудовая партия!»"
10027100-76 = "Я не хотела прибегать к этому, но вы не оставляете мне выбора."
10027100-77 = "Товарищи! С этого дня мы будем вести беспощадную войну против Фронта освобождения знаний, пока не вернём ясность их затуманенному взору!"
10027100-79 = "ДА!"
