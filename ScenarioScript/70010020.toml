[translation]
70010020-1 = "Конец механической коробки передач 2"
70010020-2 = "Хм, что бы ещё спросить?"
70010020-3 = "(До сих пор они справлялись отлично, но её бесконечные вопросы наверняка уже выматывают.)"
70010020-4 = ""
70010020-5 = "Внутри коробки"
70010020-6 = "И СКОЛЬКО ещё вопросов она собирается задавать?"
70010020-7 = "Хорошо, что у Минори такие обширные знания, но этому нет конца!"
70010020-8 = "У меня?"
70010020-9 = "Если честно, многое я просто угадывала."
70010020-10 = "Серьёзно?! А если она поймёт?"
70010020-11 = "Понимаю твою тревогу. Ответь мне: что такое «вопрос»?"
70010020-13 = "Запрос информации, которой у спрашивающего нет."
70010020-14 = "...Если говорить по сути."
70010020-15 = "Именно! Человек задаёт вопрос, потому что чего-то не знает."
70010020-16 = "Так откуда ему знать, правильный ответ он получил или нет?"
70010020-17 = "Вот на чём строился твой расчёт..."
70010020-18 = "А, как когда люди спрашивают: «Мэрури, а что означает эта сцена?»"
70010020-19 = "Нет, Мэру, по-моему, ЭТО уже совсем другой вопрос..."
70010020-21 = "Пока мы не противоречим тому, что она считает правдой, она ничего не заметит."
70010020-22 = ""
70010020-23 = "Ладно. Вопросы закончились..."
70010020-25 = "Отлично! Я в восторге, что вам понравилось! Тогда немедленно отключу питание, чтобы сохранить его ресурс к важному дню!"
70010020-27 = "А, точно! Я ещё хотела попросить его что-нибудь нарисовать."
70010020-29 = "Прошу прощения?!"
70010020-31 = "А он не умеет? Но эта штука Миллениум умела..."
70010020-32 = "Пфах! Конечно умеет! Это же технология Красная Зима! Я хочу... величественный портрет себя!"
70010020-33 = "«Нарисуй мой величественный портрет»...?"
70010020-34 = "Ч-Что это?! Я только чертежи умею рисовать!"
70010020-35 = "Хм..."
70010020-36 = ""
70010020-38 = ""
70010020-40 = ""
70010020-41 = "Э...?"
70010020-42 = "Ч-Что? Почему все на меня смотрят? Хотите, чтобы я рисовала?"
70010020-43 = "Похоже, ты наша единственная надежда. Пришло время великой Мэрури взяться за перо."
70010020-44 = "Ты всё равно не успеваешь к дедлайну... Я вообще не видела, чтобы ты хоть одну линию нарисовала."
70010020-45 = "Пришло время великой Мэру хоть раз выйти на сцену. Хе-хе-хе."
70010020-47 = "Не буду!!"
70010020-48 = "Вы думаете, если просто потребовать от художника рисунок, он взмахнёт волшебной палочкой и исполнит каждую вашу прихоть?"
70010020-49 = "Искусство не бесплатно! Деньги тут вообще ни при чём — такое грубое отношение к искусству недостойно!"
70010020-51 = "Мэру!! Ты должна помочь нам выбраться из этого! Это ты хотела новый материал для вдохновения! Я вообще не хотела сюда лезть!"
70010020-52 = "Мне всё равно! Совершенно! Просто скажите ей, что эта функция недоступна!"
70010020-53 = "Почему он не отвечает? Что происходит?"
70010020-55 = "Н-Ну, изначально такая функция не предусматривалась. Но если подождать немного..."
70010020-57 = "То есть он хуже того, что был у Миллениум."
70010020-58 = "Тогда он мне вообще не нужен..."
70010020-60 = "Может, просто бросить его в печь? Хотя бы металл переработаем из этой бесполезной штуки."
70010020-61 = "Прошу прощения?!"
70010020-63 = "Издательский отдел вроде подавал заявку на новые печатные формы, да? Можете использовать металл..."
70010020-64 = "Ладно, ещё немного подожду, прежде чем отправить всю эту штуку в печь и превратить в бесформенную забытую жижу."
70010020-65 = ""
70010020-67 = ""
70010020-68 = "Мэрури!! О великая Мэрури!!"
70010020-69 = "Говорят, писатели продолжают жить в своих словах, но подумать только, что всё закончится тем, что меня буквально превратят в слова на печатной форме... Хе. Хи. Хе..."
70010020-70 = "Даже Якумо теряет самообладание перед лицом полного уничтожения."
70010020-72 = "Ладно, ладно! Всё! Я поняла! Минори, ручку! Быстро!"
70010020-73 = "Ничего страшного. Достойный конец подходит финальной главе революционера."
70010020-74 = "Для меня честь стоять рядом с вами в нашем последнем бою, где товарищ Мэру до самого конца остаётся непреклонной."
70010020-75 = "Хватит оплакивать нашу скорую смерть и просто дайте мне ручку!"
70010020-76 = ""
70010020-78 = "О, вот и оно!"
70010020-79 = ""
70010020-81 = ""
70010020-82 = "Ого!! Потрясающе!! Это шедевр!"
70010020-84 = "(Химэки Мэру... Я обязательно честно заплачу за твоё искусство.)"
70010020-85 = "(Спасибо... огромное...!)"
70010020-86 = "Но чем дольше смотрю... тем больше кажется, что до оригинала всё-таки не дотягивает. Сразу видно, что это сделала машина."
70010020-87 = ""
70010020-89 = ""
70010020-90 = "Наверное, это пределы техноло—"
70010020-91 = ""
70010020-96 = "*БАХ*!!! *БАХ*!!!"
70010020-97 = "Что?"
70010020-98 = "Наверное, звук чтения диска, президент!"
70010020-100 = "Отпустите меня!! Я сейчас дам ей по лицу самым что ни на есть человеческим кулаком!!"
70010020-102 = "Успокойся! Она нас услышит!"
70010020-103 = "Считай это комплиментом!! Значит, линии у тебя такие же чистые, как у машины!"
70010020-105 = "А компьютером по башке получать доводилось, А?!"
70010020-106 = ""
70010020-107 = "Президент, пора на дегустацию нового пудинга."
70010020-108 = "Ой, я совсем забыла. Наверное, слишком увлеклась! Спасибо, Томоэ!"
70010020-109 = "Марина, отличная работа. У тебя настоящий талант делать невозможное возможным!"
70010020-110 = "Я официально выдвигаю тебя кандидатом на звание Федерального героя Красная Зима!"
70010020-112 = "С-Спасибо, президент!"
70010020-113 = "А, точно. Прежде чем уйти... Я должна задать суперкомпьютеру один очень важный вопрос, связанный с будущим Красная Зима."
70010020-114 = "Это совершенно секретно, так что все — вон!"
70010020-115 = "О-Освободить помещение! Немедленно!"
70010020-116 = "Есть! Поняли!"
70010020-117 = ""
70010020-119 = ""
70010020-120 = ""
70010020-122 = ""
70010020-123 = ""
70010020-126 = "Хм..."
70010020-127 = "Хе-хе, великолепно. Вот так, просто выкладывай самые сокровенные тайны прямо на стол Издательскому отделу."
70010020-128 = "Моя глубочайшая благодарность. Хе-хе-хе."
70010020-129 = "Это станет ещё одним поводом сплотиться ради революции!"
70010020-131 = "Нам конец! Если она когда-нибудь узнает, нас трижды почистят!"
70010020-132 = ""
70010020-134 = ""
70010020-135 = "Идёт."
70010020-137 = "Так, посмотрим..."
70010020-138 = "Я хочу, чтобы мой любимый товарищ чаще приезжал в Красная Зима."
70010020-139 = ""
70010020-141 = ""
70010020-142 = "И хочу, чтобы товарищ чаще играл со мной. Как этого добиться?"
70010020-143 = "А..."
70010020-145 = "Ой-ой-ой."
70010020-146 = "Это... девять из десяти. О-хо..."
70010020-148 = "Это правда совершенно секретно! Какие три раза — если нас поймают, нас девять раз почистят!"
70010020-149 = "Вот ЭТО тот материал, который я искала, но он даже слишком хорош!"
70010020-150 = "Эй, нам нужен ответ! Придумайте что-нибудь, что угодно!"
70010020-152 = "И как вообще отвечать на такое искреннее и наивное письмо?"
70010020-153 = "Как угодно! Неважно кто — просто нужен хоть какой-то ответ!"
70010020-154 = ""
70010020-156 = "Есть!"
70010020-157 = "Дай посмотреть!"
70010020-159 = "Отличный вопрос, товарищ! Нужно всего лишь сделать следующее — и обязательно последовательно!"
70010020-160 = "Ввести двухдневную рабочую неделю, утроить бюджет Издательского отдела и выделить средства на фанфики."
70010020-161 = "Если всё это сделать, Сенсей будет приезжать чаще!"
70010020-162 = ""
70010020-163 = ""
70010020-164 = "Эй, так это же легко!!"
70010020-165 = "Спасибо, суперкомпьютер!"
70010020-166 = ""
70010020-168 = ""
70010020-169 = ""
70010020-171 = "Фух... Не ожидала, что это сработает..."
70010020-176 = ""
70010020-177 = "Я проведу финальную проверку безопасности. Можете расходиться по домам."
70010020-178 = "Поняла! Спасибо за ваш труд и самоотдачу!"
70010020-179 = ""
70010020-181 = ""
70010020-182 = ""
70010020-183 = ""
70010020-186 = "Все ушли. Можете вылезать."
70010020-187 = "Гах! Свежий воздух!!"
70010020-189 = "Таканэ уснула. Учитывая время, я её не виню."
70010020-190 = "Не могу поверить, что нас не поймали."
70010020-192 = "От всего сердца прошу прощения за все неприятности! Я отплачу каждой из вас вдвойне! Честное слово!"
70010020-193 = "Надеюсь, завтра, когда приедут гости из Миллениум, я тоже смогу на вас рассчитывать."
70010020-194 = "В этом нет необходимости. Потому что этой ночью поднимается революция!"
70010020-195 = "Да! Революция поднимается!"
70010020-196 = ""
70010020-198 = ""
70010020-199 = "...Простите?"
70010020-200 = "Товарищ Марина, последний кусочек головоломки для спасения наших угнетённых товарищей наконец у нас."
70010020-201 = "Чтобы разорвать цепи угнетения, мы должны свергнуть президента Черину — корень всей этой гнили!"
70010020-202 = "Что?! Вы вообще о чём?!"
70010020-203 = "Спасибо, товарищ! Мы были вирусами, которых ты установила в этот «компьютер» и доставила прямо в сердце офиса Красная Зима!"
70010020-204 = "Революция начинается изнутри!"
70010020-206 = "За свободу, товарищ Марина!"
70010020-207 = "Стойте, это не—!"
70010020-208 = ""
70010020-213 = ""
70010020-214 = "Вперёд! ЗА СВОБОДУ-У-У!!"
70010020-215 = ""
70010020-217 = ""
70010020-218 = ""
70010020-219 = "Каким-то образом мы оказались прямо в центре очередного бардака."
70010020-220 = "АААРГХ!! Мой дедлайн!!"
70010020-221 = ""
70010020-223 = ""
70010020-224 = "Ч-Что это? Я проснулась прямо в кошмаре."
70010020-225 = "Что-то знакомое... Вирус... доставленный внутри компьютера?"
70010020-227 = "Что-то... конь...?"
70010020-229 = "Наконец-то! Никогда не думала, что однажды меня пригласят в Красная Зима!"
70010020-230 = "Передовой суперкомпьютер Красная Зима... О-о-о, не могу сдержать восторг!"
70010020-231 = "Интересно, какие невиданные технологии я сейчас увижу! Так интере—"
70010020-232 = ""
70010020-234 = ""
70010020-235 = ""
70010020-238 = ""
70010020-239 = "Революционеры суперкомпьютера, уничтожить офис Красная Зима!!"
70010020-240 = "Победим силой суперкомпьютера!"
70010020-241 = ""
70010020-243 = ""
70010020-244 = ""
70010020-245 = "Суперкомпьютер, как ты смеешь предавать меня?!"
70010020-246 = "Чистка! Чистка!!"
70010020-247 = ""
70010020-258 = ""
70010020-259 = "Суперкомпьютер...? Революционеры...? Предательство...?"
70010020-260 = ""
70010020-262 = ""
70010020-263 = "Мне кажется, нам стоит вернуться и немного понизить характеристики нашего суперкомпьютера..."
70010020-264 = "Конец механической коробки передач"
