[translation]
11008-3 = "."
11008-5 = "."
11008-7 = "."
11008-9 = "Conectando à [FF6666]Arca de Shittim...[-]"
11008-12 = "Por favor, insira a senha de acesso ao sistema."
11008-14 = "[ns] \"...A senha é...\""
11008-16 = "[ns] Digitar as palavras que vieram à mente."
11008-18 = "[FF6666]...Nós desejamos as Sete Lamentações.[-]"
11008-20 = "[FF6666]...Nós nos lembramos dos Preceitos de Jericó.[-]"
11008-23 = "..."
11008-25 = "Senha de acesso aprovada.#nUsuário atual confirmado: [USERNAME]."
11008-28 = "Bem-vindo à \"Arca de Shittim\", Sensei [USERNAME]."
11008-29 = "Transferindo para o sistema operacional principal A.R.O.N.A. para autenticação biométrica e geração de certificado."
11008-35 = "???"
11008-36 = "(Em uma sala de aula desconhecida, uma garota cochila debruçada sobre a carteira)"
11008-37 = "Fuuuuh... Zzzz"
11008-38 = "Fuuuuh... Zzzz"
11008-39 = "Nham... Pra acompanhar bolo castella... leite de banana combina muito mais... que leite de morango..."
11008-40 = "Fuuuuuh... Zzzzzzz"
11008-43 = "Eheh... Ainda tem um montão sobrando..."
11008-44 = "[s1] Sacudir para acordá-la.\n[s2] Cutucar a bochecha dela."
11008-45 = "(Sacode, sacode)"
11008-46 = "Ueeeh..."
11008-47 = "...Ueeeh... Hiiih?!"
11008-48 = "(Pá!)"
11008-49 = "(Cutuca)"
11008-50 = "Unnha... Ainda não... Tem que mastigar direitinho..."
11008-52 = "(Cutuca, cutuca)"
11008-53 = "Auhn, mas..."
11008-56 = "(Cutuca, cutuca, cutuca)"
11008-57 = "...Huuuum!"
11008-58 = "(Pá!)"
11008-60 = "(Levanta-se devagar)"
11008-61 = "Nham... Aah, que coisa... Ué?"
11008-62 = "Ué, uééé...?"
11008-63 = "Hã? Ué? Que estranho..."
11008-64 = "S-Sensei?!"
11008-65 = "Se entrou neste espaço, então... s-s-será que você é o Sensei [USERNAME]...?!"
11008-66 = "[s3] \"Sou eu mesmo.\"\n[s4] \"Quem é você?\""
11008-67 = "U-Uwaaah?! É-É mesmo?! Já tá nessa hora?!"
11008-68 = "U-Uwaaah?! É-É mesmo?! Já tá nessa hora?!"
11008-69 = "Uwaah, waaah?! Calma, calma, respira..."
11008-70 = "É que... bem... Ah, isso! Primeiro as apresentações!"
11008-71 = "Eu sou a Arona!"
11008-72 = "Sou a administradora de sistema residente desta \"Arca de Shittim\", o sistema operacional principal e a secretária que vai te ajudar a partir de agora, Sensei!"
11008-73 = "Finalmente nos encontramos! Eu fiquei aqui esperando por você por muito, muuuito tempo, Sensei!"
11008-74 = "[s] \"Não estava só dormindo, não?\""
11008-75 = "A-Auuuh... C-Claro que de vez em quando eu dou uma cochiladinha, mas..."
11008-76 = "[s] \"Prazer em trabalhar com você.\""
11008-77 = "Sim! O prazer é todo meu!"
11008-78 = "Meu corpo ainda está numa versão bem inicial, então preciso ajustar algumas coisas, principalmente nas cordas vocais..."
11008-79 = "Mas vou dar o meu melhor para ajudar o Sensei em tudo o que precisar daqui pra frente!"
11008-80 = "Ah, lembrei! Primeiro, mesmo sendo só uma formalidade, vamos fazer a autenticação biométrica♪"
11008-81 = "Uuh... Dá um pouquinho de vergonha, mas faz parte do procedimento. Pode chegar mais perto, por favor."
11008-84 = "Só mais um pouquinho."
11008-88 = "Pronto, agora encoste o seu dedo no meu, Sensei."
11008-92 = "Ufufu. Parece até que estamos fazendo uma promessa de dedinho, né?"
11008-93 = "Como assim?! Parece cena de filme de alienígena?!"
11008-94 = "Na verdade, é assim que eu confirmo a sua impressão digital!"
11008-95 = "Eu verifico a digital que fica na tela no olho mesmo... mas é rapidinho!#nPode não parecer, mas eu tenho uma vista ótima."
11008-98 = "Deixa eu ver..."
11008-99 = "Hmm..."
11008-100 = "(Hmm... Acho que não dá pra enxergar direito...)"
11008-101 = "(...Ah, tá bom assim, né?)"
11008-103 = "...Prontinho! Verificação concluída♪"
11008-104 = "Hã? \"Faz isso direito\"? Tá dizendo que eu fiz corpo mole?!#nN-Nada disso!"
11008-105 = "..."
11008-106 = "Os aparelhos de hoje em dia fazem leitura digital automática? Hã, não leva nem 1 segundo?!#nE-Eu não tenho essa tecnologia toda de ponta, mas..."
11008-107 = "M-Mesmo sem isso, a Arona ainda é super útil, tá?! Eu consigo conferir perfeitamente só olhando!"
11008-108 = "...Essa sua cara diz que não acreditou em nenhuma palavra..."
11008-109 = "..."
11008-110 = "Uuh..."
11008-111 = "(Olhos marejados)"
11008-112 = "Então por que não vai lá ficar com esse seu tal aparelho de última geração?!"
11008-113 = "[s] Consolar dizendo que era brincadeira."
11008-114 = "Sniff..."
11008-116 = "(Consolei ela bastante)"
11008-118 = "..."
11008-119 = "Entendi... Acho que peguei o básico da sua situação, Sensei."
11008-120 = "A Presidente do Conselho Estudantil Geral desapareceu e, por causa disso, perderam o controle da torre de Kivotos..."
11008-121 = "[s5] \"Você sabe alguma coisa sobre a Presidente do Conselho Estudantil Geral?\"\n[s6] \"Quem é a Presidente do Conselho Estudantil Geral?\""
11008-122 = "Eu tenho acesso a muitas informações sobre Kivotos... mas quase nada sobre a Presidente do Conselho Estudantil Geral.#nNão sei quem ela é, nem o motivo de ter desaparecido..."
11008-123 = "Eu tenho acesso a muitas informações sobre Kivotos... mas quase nada sobre a Presidente do Conselho Estudantil Geral.#nNão sei quem ela é, nem o motivo de ter desaparecido..."
11008-124 = "Desculpe por não poder ajudar nisso."
11008-125 = "...Mas o problema da Torre Sanctum acho que eu consigo resolver!"
11008-126 = "[s] \"Então conto com você, Arona.\""
11008-127 = "Sim! Deixa comigo! Vou restaurar os privilégios de acesso da Torre Sanctum agora mesmo!"
11008-128 = "Aguarde só um momentinho!"
11008-130 = "(Zuuuuuuum...)"
11008-138 = "..."
11008-139 = "Privilégios de administrador da Torre Sanctum obtidos..."
11008-140 = "Sensei, consegui recuperar o controle da Torre Sanctum sem problemas!#nAgora a Torre Sanctum está sob o meu controle, da Arona."
11008-141 = "Na prática, toda Kivotos está nas suas mãos agora, Sensei!"
11008-142 = "Basta você autorizar que eu transfiro o controle da Torre Sanctum de volta para o Conselho Estudantil Geral."
11008-143 = "Mas... tem certeza? Tudo bem mesmo devolver o controle ao Conselho Estudantil Geral...?"
11008-144 = "[s7] \"Tudo bem.\"\n[s8] \"Autorizado.\""
11008-145 = "Entendido! Transferindo agora o controle da Torre Sanctum para o Conselho Estudantil Geral!"
11008-146 = "Entendido! Transferindo agora o controle da Torre Sanctum para o Conselho Estudantil Geral!"
11008-148 = "...Sim. Entendido."
11008-149 = "(Clic) Confirmamos a recuperação do controle da Torre Sanctum."
11008-150 = "A partir de agora, podemos retomar a gestão administrativa exatamente como era quando a Presidente estava aqui."
11008-151 = "Excelente trabalho, Sensei.#nEm nome do Conselho Estudantil Geral, agradeço profundamente por ter evitado o caos em Kivotos."
11008-152 = "Quanto às delinquentes e às alunas suspensas que atacaram este local, nós vamos rastreá-las e neutralizá-las, então não precisa se preocupar."
11008-153 = "Bem, já entreguei a \"Arca de Shittim\", então parece que minha tarefa por aqui está concluída."
11008-154 = "...Ah, havia mais uma coisa."
11008-155 = "Venha comigo, por favor. Vou lhe apresentar o Clube de Investigação Federal \"Schale\"."
11008-158 = "Este é o saguão principal do Schale."
11008-159 = "Ficou vazio por um longo tempo, mas finalmente recebeu seu dono."
11008-160 = "(Clac, pum)"
11008-164 = "E esta é a sala do clube Schale."
11008-165 = "É aqui que o Sensei pode começar o seu trabalho."
11008-166 = "[s] \"O que eu devo fazer agora?\""
11008-167 = "...Como o Schale é uma organização cheia de autoridade, mas sem uma diretriz definida,#nnão existe nenhuma obrigação formal de fazer algo específico."
11008-168 = "Você pode circular livremente pelo distrito autônomo de qualquer academia de Kivotos e recrutar qualquer aluna que desejar como membro do clube, independentemente da afiliação..."
11008-169 = "Curioso, não é?#nEmbora se chame \"clube de investigação\", a Presidente do Conselho Estudantil Geral nunca deu maiores detalhes sobre essa parte."
11008-170 = "Em resumo, o Sensei tem total liberdade para fazer o que bem entender..."
11008-171 = "..."
11008-172 = "...Mesmo que quiséssemos perguntar diretamente a ela, a Presidente continua desaparecida."
11008-173 = "Estamos dedicando todos os nossos esforços às buscas, por isso não temos pessoal sobrando para lidar com os problemas que surgem por toda Kivotos."
11008-174 = "E as reclamações que chegam ao Conselho Estudantil Geral não param...#nPedidos de suprimentos, melhorias estruturais, aulas de reforço para alunas reprovadas, solicitações de apoio a clubes e por aí vai..."
11008-175 = "...Talvez o \"Schale\", que parece estar com tanto tempo livre, consiga resolver essas inúmeras demandas chatas."
11008-176 = "Deixei uma pilha de documentos sobre tudo isso em cima da sua mesa, Sensei. Dê uma olhada quando tiver vontade."
11008-177 = "Afinal, tudo fica a critério do Sensei."
11008-178 = "Fique à vontade. Entrarei em contato novamente quando precisarmos."
11008-181 = "Sim. Acabamos de confirmar que o Conselho Estudantil Geral recuperou o controle da Torre Sanctum."
11008-182 = "A Wakamo conseguiu fugir para os distritos autônomos... mas deve ser capturada logo. Nossa parte termina aqui."
11008-183 = "O resto deixamos com os responsáveis."
11008-184 = "Bom trabalho, Sensei. Seus feitos logo vão se espalhar por toda Kivotos. Capaz até de virar assunto nas redes sociais em pouco tempo, né?"
11008-185 = "[s] \"Bom trabalho, pessoal.\""
11008-186 = "Nos despedimos por aqui, mas venha visitar a Escola Geral Trinity em breve, Sensei."
11008-188 = "(Faz uma reverência)"
11008-189 = "Eu também vou voltar para reportar os eventos de hoje à Chefe do Comitê Disciplinar. Quando passar pela Academia Gehenna, não deixe de nos visitar."
11008-190 = "Se aparecer na Escola de Ciências Millennium, talvez a gente se esbarre de novo! Até mais, Sensei!"
11008-192 = "[ns] Voltar para o escritório do Schale."
11008-194 = "..."
11008-195 = "Aah... Que situação mais complicada..."
11008-196 = "Huhu... Huhuhu."
11008-198 = "...Ufufufufufufu♡"
11008-200 = "Ahaha... Foi tudo meio corrido, mas...#nparece que as coisas finalmente deram uma acalmada. Bom trabalho, Sensei!"
11008-201 = "[s] \"Bom trabalho pra você também, Arona.\""
11008-202 = "Sim! Mas a parte difícil de verdade começa agora, sabia?"
11008-203 = "A partir de hoje, vamos resolver juntos os problemas enfrentados pelas alunas de Kivotos...!"
11008-204 = "Pode parecer simples, mas não é nada fácil... É uma missão super importante."
11008-205 = "Conto com você para cuidar de Kivotos e do Schale, Sensei."
11008-206 = "[s9] \"Vamos juntos, Arona.\"\n[s10] \"Eu é que conto com você.\""
11008-207 = "Então, vamos dar início à primeira missão oficial do Clube de Investigação Federal \"Schale\"!"
11008-208 = "Então, vamos dar início à primeira missão oficial do Clube de Investigação Federal \"Schale\"!"
