11008-63 = "А-а? Чт...?!"
11008-64 = "С-Сенсей?!"
11008-65 = "Раз вы здесь, т-т-тогда вы, должно быть, Сенсей [USERNAME]!"
11008-66 = "[s3] «Это я.»\n[s4] «А ты кто?»"
11008-67 = "О-ого! Так я права? Уже столько времени прошло?!"
11008-68 = "О-ого! Так я права? Уже столько времени прошло?!"
11008-69 = "Ого-о-о. Погодите. Надо успокоиться..."
11008-70 = "Эм, значит... Ах, точно! Я забыла представиться!"
11008-71 = "Меня зовут Арона!"
11008-72 = "Я системный администратор, живущий внутри Ковчега Шиттим, и его основная ОС. Можете считать меня вашей надёжной секретаршей, Сенсей!"
11008-73 = "Я так рада наконец встретиться с вами! Я всё это время вас ждала!"
11008-74 = "[s] «Разве ты не спала?»"
11008-75 = "Ну, эм... М-может, я и задремала ненадолго, но всё же..."
11008-76 = "[s] «Мне тоже приятно познакомиться»."
11008-77 = "Да! Я очень рада это слышать!"
11008-78 = "Моя внешность, да и голос, конечно, могли бы быть посовременнее, но..."
11008-79 = "...я всё равно уверена, что смогу стать отличной помощницей!"
11008-80 = "Ах, точно! Это всего лишь формальность, но давайте завершим вашу биометрическую аутентификацию. ♪"
11008-81 = "Эм... Немного неловко, но таков протокол. Не могли бы вы подойти чуть ближе?"
11008-82 = ""
11008-83 = ""
11008-84 = "Ещё чу-у-уть поближе."
11008-88 = "Теперь приложите кончик пальца к моему."
11008-92 = "Хи-хи. Похоже, будто мы даём друг другу обещание, правда?"
11008-93 = "Что? Напоминает сцену из известного научно-фантастического фильма?"
11008-94 = "Но... я просто должна так проверить ваш отпечаток пальца!"
11008-95 = "Я сама отсканирую ваш отпечаток на экране. Но не волнуйтесь! У меня глаз как у орла!"
11008-98 = "Так, посмотрим..."
11008-99 = "Хм-м."
11008-100 = "(Эм, немного размыто...)"
11008-101 = "(...Нгх. Наверное, неважно.)"
11008-103 = "Готово! ♪"
11008-104 = "А? Вы думаете, я сделала это неправильно? Н-неправда!"
11008-105 = "..."
11008-106 = "Говорите, современные сканеры отпечатков работают автоматически и мгновенно? Но... у меня нет такой высокотехнологичной функции..."
11008-107 = "М-мне и не нужны такие функции! Моих глаз вполне достаточно!"
11008-108 = "Хм... Похоже, вы не убеждены."
11008-109 = "..."
11008-110 = "*вздыхает*"
11008-111 = "*шмыгает носом*"
11008-112 = "Тогда, раз вы так думаете, идите к своей навороченной Шиири!"
11008-113 = "[s] «Я всего лишь пошутил»."
11008-114 = "*всхлипывает*"
11008-116 = "Мне пришлось несколько минут успокаивать Арону."
11008-118 = "..."
11008-119 = "...Понятно. Похоже, произошло много всего."
11008-120 = "Президент Генерального ученического совета пропала, и теперь Башней Санктум в Кивотосе невозможно управлять..."
11008-121 = "[s5] «Ты что-нибудь знаешь о президенте Генерального ученического совета?»\n[s6] «А кто вообще президент Генерального ученического совета?»"
11008-122 = "У меня много данных о Кивотосе, но о президенте я знаю совсем мало. К сожалению, мне неизвестно, кто она и почему исчезла."
11008-123 = "У меня много данных о Кивотосе, но о президенте я знаю совсем мало. К сожалению, мне неизвестно, кто она и почему исчезла."
11008-124 = "Жаль, что я не могу быть полезнее..."
11008-125 = "Эм... но думаю, по крайней мере с проблемой Башни Санктум я помочь смогу."
11008-126 = "[s] «Полагаюсь на тебя, Арона»."
11008-127 = "Конечно! Сейчас я восстановлю права доступа к Башне Санктум!"
11008-128 = "Одну минутку!"
11008-130 = "*жужжание механизма*"
11008-138 = "..."
11008-139 = "Получены права администратора Башни Санктум."
11008-140 = "Мы успешно восстановили доступ к Башне Санктум, Сенсей! Теперь башня находится под моим контролем."
11008-141 = "А значит, весь Кивотос теперь буквально у вас на ладони!"
11008-142 = "С вашего разрешения я могу передать управление Башней Санктум Генеральному ученическому совету."
11008-143 = "Но... вы уверены, что хотите этого? Вы отдадите Генеральному ученическому совету полный контроль."
11008-144 = "[s7] «Всё будет хорошо.»\n[s8] «Одобрено.»"
11008-145 = "Хорошо. Передаю управление Башней Санктум Генеральному ученическому совету!"
11008-146 = "Хорошо. Передаю управление Башней Санктум Генеральному ученическому совету!"
11008-148 = "...Понятно. Хорошо."
11008-149 = "*щелчок* Передача управления Башней Санктум только что подтверждена."
11008-150 = "Теперь мы сможем управлять городом так же, как когда президент была здесь."
11008-151 = "Отличная работа, Сенсей. Вы не позволили Кивотосу погрузиться в полный хаос. От имени всего Генерального ученического совета я хочу вас поблагодарить."
11008-152 = "Не беспокойтесь об отстранённом студенте и бандитах, которые напали на нас ранее. Их скоро найдут и накажут."
11008-153 = "Моей обязанностью было проследить, чтобы вы получили Ковчег Шиттим, так что моя работа здесь закончена."
11008-154 = "...О. Вообще-то осталось ещё одно дело."
11008-155 = "Идёмте. Я хотела бы как следует представить вам Федеральный следственный клуб «Шале»."
11008-156 = ""
11008-158 = "Это главный вестибюль Шале."
11008-159 = "Он долго пустовал, но теперь у него наконец появился хозяин."
11008-160 = "(открывает дверь)"
11008-164 = "А это клубная комната Шале."
11008-165 = "С этого момента вы будете работать здесь."
11008-166 = "[s] «Что мне теперь делать?»"
11008-167 = "...У Шале есть широкие полномочия, но конкретных целей на данный момент нет."
11008-168 = "Вы можете входить в любой академический район Кивотоса и регистрировать в клубе любых встреченных студентов."
11008-169 = "...Забавно, правда? Он называется «следственным клубом», но президент так и не уточнила, чем именно он должен заниматься."
11008-170 = "Возможно... это означает, что вы вольны делать всё, что захотите."
11008-171 = "..."
11008-172 = "Как бы мне ни хотелось, чтобы вы сами спросили президента о подробностях, факт остаётся фактом: она всё ещё числится пропавшей без вести."
11008-173 = "Мы используем все доступные ресурсы, чтобы найти её, но из-за этого нам не хватает людей для решения остальных проблем Кивотоса."
11008-174 = "Прямо сейчас Генеральный ученический совет завален обращениями граждан. Запросы на снабжение, улучшение окружающей среды, дополнительные занятия для отстающих, просьбы спасти клубы и так далее..."
11008-175 = "Возможно, Шале мог бы заняться этими запросами, раз уж теперь у него, вероятно, полно свободного времени..."
11008-176 = "Я положила все документы на ваш стол. Просмотрите их, когда будет время."
11008-177 = "В конце концов, теперь всё зависит от вас."
11008-178 = "...Удачи на новой должности, Сенсей. Я свяжусь с вами, когда нам снова понадобится ваша помощь."
11008-179 = ""
11008-181 = "Верно. Генеральный ученический совет восстановил контроль над Башней Санктум."
11008-182 = "Вакамо сбежала в ученический район, но уверена, её скоро найдут и арестуют. Наша работа здесь закончена."
11008-183 = "Остальное можно оставить ответственным сотрудникам."
11008-184 = "А вы неплохи, Сенсей. Теперь о вас будет говорить весь Кивотос. Наверняка соцсети уже гудят."
11008-185 = "[s] «Без вас я бы не справился»."
11008-186 = "Пока нам придётся попрощаться, но надеюсь, вы скоро посетите Тринити, Сенсей."
11008-188 = "*кивает*"
11008-189 = "Я доложу обо всём нашей главе префектов. И не забудьте заглянуть к нам, если когда-нибудь окажетесь в Академии Геенна."
11008-190 = "Кто знает, может, мы ещё пересечёмся, если вы заглянете в Миллениум. Пока, Сенсей!"
11008-191 = ""
11008-192 = "[ns] Вернуться в офис Шале."
11008-194 = "..."
11008-195 = "О нет. Так не пойдёт."
11008-196 = "Хе-хе... Хе-хе-хе."
11008-197 = ""
11008-198 = "Хи-хи. ♥"
11008-200 = "Ха-ха... Всё немного вышло из-под контроля, но, кажется, теперь всё в порядке. Спасибо за помощь."
11008-201 = "[s] «Ты отлично справилась, Арона»."
11008-202 = "Спасибо! Но это только начало."
11008-203 = "Вам ещё предстоит помогать решать все проблемы, с которыми сталкиваются студенты Кивотоса!"
11008-204 = "Может показаться, что это просто, но легко точно не будет... В любом случае это очень важная задача!"
11008-205 = "Кивотос и Шале рассчитывают на вас, Сенсей."
11008-206 = "[s9] «И я рассчитываю на тебя, Арона.»\n[s10] «Рад помочь.»"
11008-207 = "Ну что ж, начнём вашу первую официальную миссию Федерального следственного клуба «Шале»!"
11008-208 = "Ну что ж, начнём вашу первую официальную миссию Федерального следственного клуба «Шале»!"
