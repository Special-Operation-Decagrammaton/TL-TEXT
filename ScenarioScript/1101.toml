[translation]
1101-1 = "Странный день Общества гурманов, часть 1"
1101-2 = "Где-то за пределами Геенны"
1101-4 = "*тяжело дышит* *тяжело дышит* Мы оторвались?"
1101-5 = "Думаю, да. Даже глава префектов не настолько упряма, чтобы гнаться за нами так глубоко в лес! ☆"
1101-6 = "Ну и шум подняли из-за того, что мы разнесли эту помойку, которую они называют столовой. У Префектурной команды Геенны дел поважнее нет?"
1101-7 = "Вообще-то нет. Это... как раз и есть работа Префектурной команды."
1101-8 = "Послушай, Джунко. Если бы ты увидела, как из крана вода льётся в переполненную раковину, а вокруг никого нет, что бы ты сделала?"
1101-9 = "Наверное... закрыла бы кран?"
1101-10 = "Именно. Вот ровно такое же желание у меня возникает, когда я вижу заведение, которое ничем не лучше кормушки."
1101-11 = "Можешь остановиться. Я всё равно никогда не пойму, как ты думаешь."
1101-12 = "Постойте. Я давно не видела Изуми. Разве она не бежала за нами?"
1101-13 = "Изуми отстала уже давным-давно. Уверена, Хина её уже поймала."
1101-14 = "Ты издеваешься?! Это же серьёзно! Почему ты раньше ничего не сказала?!"
1101-15 = "Когда Изуми отстала, она что-то кричала про решимость. Вопль души, исполненной непреклонной воли, что-то в таком духе."
1101-16 = "Р-Решимость? Н-Не может быть! Неужели она... ради нас...?"
1101-17 = "Мы никогда не забудем её жертву. Что именно сказала Изуми?"
1101-20 = "Н-Нет! Предательницы! Не бросайте меня!"
1101-21 = "*скользит* А?!"
1101-22 = ""
1101-23 = "*бахает по столу*"
1101-24 = "А-а! Я вам это припомню! Клянусь, я вам отомщу, даже если это будет последнее, что я сделаю!"
1101-26 = "...Что-то вроде того."
1101-27 = "..."
1101-28 = "..."
1101-29 = "Хи-хи! ☆"
1101-31 = ""
1101-32 = "*принюхивается* Чувствуете? Что-то пахнет просто восхитительно."
1101-34 = "Здесь? Посреди парка?"
1101-35 = "Что бы это ни было, аромат просто неземной!#n*принюхивается* Сюда!"
1101-36 = ""
1101-37 = "*вжух*"
1101-39 = "*роется*"
1101-40 = "Нашла! Запах идёт от этих грибов!"
1101-41 = "Ох... Неужели это...?"
1101-42 = "Трюфели! Это трюфели!"
1101-43 = "Трюфли?"
1101-44 = "Их ещё называют чёрными бриллиантами. Эти грибы — редкость из редкостей!"
1101-46 = "Более того, этот деликатес ценится даже выше самой отборной дорогой рыбы — кинмагуро!"
1101-47 = "Ого-о-о! Правда?"
1101-48 = "А особенно уникальным его делает этот насыщенный, ни с чем не сравнимый аромат."
1101-49 = "Нам уже повезло хотя бы потому, что мы можем им дышать."
1101-50 = "Я слышала, насколько они редкие. Люди даже специально обучают свиней с острым нюхом, чтобы искать их."
1101-51 = "Кто бы мог подумать, что у Джунко такой талантливый пятачок?"
1101-52 = "Ещё один такой комплимент с подковыркой — и я закопаю тебя там же, где нашла эти трюфели!"
1101-53 = ""
1101-54 = "У нас нет времени на это. Первые пять минут после сбора трюфеля крайне важны, если мы хотим сохранить его вкус и аромат."
1101-55 = "Нам нужен чистый кусок ткани."
1101-56 = "Погоди. Ты правда думаешь, что у кого-то из нас найдётся чистая ткань после забега по этой грунтовой дороге? Мы все в грязи."
1101-57 = "А такое подойдёт?"
1101-58 = "Какого...?! Это что, трусики?"
1101-59 = "Совершенно новые, ни разу не надеванные! И к тому же из стопроцентного шёлка высшего качества! Ну и что, что это бельё? Чем оно отличается от носового платка?"
1101-60 = "Наверное, ничем, но... что думаешь, председатель? Сойдёт?"
1101-61 = "Разумеется. Даже легче стало. Никогда не думала, что невроз Акари однажды окажется полезен."
1101-62 = "*фьюить*"
1101-63 = "Вуаля. Теперь осталось только вернуться и приготовить эти трюфели."
1101-64 = "..."
1101-65 = "Нет. Полагаю, сперва нам следует спасти Изуми. Недопустимо пробовать столь редкий деликатес, когда отсутствует хотя бы один член клуба."
1101-66 = "Ну тогда пошли поставим этих зануд из Префектурной команды на место и спасём Изуми!"
1101-67 = "Любовь и насилие! Вот на чём держится дружба, девочки! ☆"
1101-70 = "И кого это вы собрались ставить на место?"
1101-71 = "Какого...?! Что здесь делает Префектурная команда?!"
1101-72 = ""
1101-73 = ""
1101-74 = ""
1101-75 = "*вжух*"
1101-77 = "Ох... Нас окружили."
1101-78 = "*вздыхает* Я устала бегать. Покончите с ними, девочки."
1101-79 = "(Чего...?!)"
1101-80 = ""
1101-81 = "...Вам повезло, что мне не хочется потом убирать последствия. Откройте огонь, но оставьте их в живых."
1101-83 = "*кивает*"
1101-84 = "Пожалуйста, не сопротивляйтесь. Это бессмысленно."
1101-86 = ""
1101-87 = "*бах* *бах* *бах* *тра-та-та*"
1101-89 = "(Всех быстро побеждают и арестовывают.)"
