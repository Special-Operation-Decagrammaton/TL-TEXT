[translation]
10004075-1 = "Эпизод 7;Ответственность инструктора"
10004075-2 = "Уф. Какая же это была катастрофа..."
10004075-3 = "Не ожидала встретить там студента Полицейской школы Валькирия."
10004075-4 = "Как она могла нас так сдать?! Она выставила всё именно так, как оно и выглядело!"
10004075-5 = "[s] «Ну, если ты так просишь...»"
10004075-6 = "Нет, так не пойдёт. Такими темпами Шун навсегда останется невыносимым маленьким ребёнком."
10004075-7 = "Очевидно, нужен более мощный паралитик..."
10004075-8 = "[s1] «Хватит уже с препаратами.»\n[s2] «Я поговорю с Шун.»"
10004075-9 = "Ты попробуешь её убедить? Не думаю, что она станет слушать."
10004075-10 = "Ты попробуешь её убедить? Не думаю, что она станет слушать."
10004075-11 = "Если пойдёшь один, она просто втянет тебя в ещё большие неприятности."
10004075-12 = "К тому же ты обещал сегодня провести время со мной, помнишь?"
10004075-13 = "[s3] «Чрезвычайные обстоятельства.»\n[s4] «В следующий раз я всё компенсирую.»"
10004075-16 = ""
10004075-18 = ""
10004075-19 = ""
10004075-20 = ""
10004075-21 = "Ладно. Чувствую, не только я ждала нашей сегодняшней прогулки."
10004075-22 = "Но в следующий раз ты обязан купить мне двойную порцию лапши, нарезанной ножом, с дополнительным маслом красного перца!"
10004075-23 = "[s] «Обещаю.»"
10004075-24 = "Ха-ха-ха. Ладно, на сегодня эксперимент окончен."
10004075-25 = "И, пожалуйста, позаботься о нашем ненадёжном инструкторе Шаньхайцзина."
10004075-26 = ""
10004075-28 = ""
10004075-29 = "[ns] Найти пропавшую Шун."
10004075-31 = ""
10004075-32 = ""
10004075-33 = ""
10004075-34 = "Я всех ненавижу."
10004075-35 = "Ненавижу студентов Сада сливового цветка за то, что никогда меня не слушают, ненавижу Кокону за то, что заставляет делать её работу... и ненавижу Сенсея за то, что пытался заставить меня принять противоядие!"
10004075-36 = "Почему все так со мной поступают?!"
10004075-37 = "[s] «Я не хотел быть с тобой злым.»"
10004075-39 = "С-Сенсей?!"
10004075-40 = "Когда вы пришли?"
10004075-41 = ""
10004075-42 = "Неважно. Я знаю, вы здесь, чтобы заставить меня принять противоядие!"
10004075-43 = "И мне всё равно! Я не вернусь, что бы вы ни сказали!"
10004075-44 = "[s] «Почему ты не хочешь вернуться в прежнюю форму?»"
10004075-45 = "Разве не очевидно? Стареющее тело только мешает!"
10004075-46 = "Кожа была грубой, после короткой пробежки я задыхалась, плечи болели при каждом движении..."
10004075-47 = "...и все заставляли меня быть ответственной."
10004075-48 = "Инструкторам Сада сливового цветка предоставляют такие огромные привилегии, что даже офицеры Генрюмон не могут относиться к ним легкомысленно. Но и ответственности у них очень много."
10004075-49 = "От рассвета до заката я не могу ни на секунду спустить глаз с детей. Каждый раз, когда происходит несчастный случай, я пропускаю собственные занятия, чтобы разбираться с последствиями."
10004075-50 = "Я устала от всей этой ответственности. Мне совсем не нравится заботиться о детях."
10004075-51 = "[s] «Ты правда так считаешь?»"
10004075-52 = "Конечно! Ты даже не представляешь, насколько комфортно было сегодня жить как ребёнок."
10004075-53 = "Ты тоже инструктор, Сенсей. Ты должен понимать, как трудно заботиться о детях."
10004075-54 = "То есть... наверное, весь день со мной было ужасно раздражающе. Быть ответственным всегда тяжело."
10004075-55 = "[s] «Я был рад, что сегодня ты полагалась на меня.»"
10004075-56 = "Что? Тебя это не раздражало?"
10004075-57 = "Не ври мне. Никто не захотел бы разбираться со всем этим бардаком!"
10004075-58 = "Ты не смог выполнить обещание Сае, потратил кучу денег... и даже попал в неприятности с полицией!"
10004075-59 = "Как ты можешь быть этому рад?"
10004075-60 = "[s] «Потому что я увидел твою улыбку.»"
10004075-61 = "Улыбку..."
10004075-62 = "Ой, какая разница до моей улыбки? Улыбкой ничего не решить!"
10004075-63 = "Улыбка ребёнка мне не помогает!"
10004075-64 = "Совсем..."
10004075-65 = "[s5] «Ты ведь уже знаешь правду, да?»\n[s6] «Улыбка ребёнка — бесценное сокровище.»"
10004075-66 = "..."
10004075-67 = "..."
10004075-68 = "Это был всего лишь побочный эффект, но я воспользовалась им, потому что так устала от детей."
10004075-69 = "Я бросила маленьких ангелов, которые всегда мне доверяли, и убежала от обязанностей инструктора."
10004075-70 = "Я знаю, что недостаточно хороша..."
10004075-71 = "Как я могу снова взять на себя ответственность за детей?"
10004075-72 = "[s] «Студентам ты всё ещё нужна.»"
10004075-73 = "Откуда ты можешь знать?"
10004075-74 = "[s] «Посмотри туда.»"
10004075-75 = "А?"
10004075-76 = ""
10004075-78 = ""
10004075-80 = "Кокона! Куда ушла Шун?"
10004075-81 = "Я не хочу сегодня есть твою еду, Кокона! Она странная на вкус!"
10004075-82 = "Не называйте меня просто Коконой. Называйте меня инструктор Кокона!"
10004075-83 = "Что мне вообще делать с ужином? Я просто не так хорошо готовлю, как Шун..."
10004075-84 = "Понимаю, что не очень вкусно, но можете съесть хотя бы сегодня?"
10004075-85 = "Нет! Я хочу еду Шун!"
10004075-86 = "Скорее приведи Шун! Уа-а-а!"
10004075-87 = "П-Подожди, не плачь! Истерикой ничего не изменишь!"
10004075-88 = "Серьёзно, это мне впору плакать..."
10004075-89 = "Когда она вернётся? Уа-а-а!"
10004075-90 = ""
10004075-92 = ""
10004075-94 = ""
10004075-95 = "*вздыхает*"
10004075-96 = "Этим детям постоянно нужно внимание."
10004075-97 = "Прости, Сенсей. Можно мне теперь противоядие?"
10004075-98 = ""
10004075-101 = ""
10004075-102 = ""
10004075-103 = "[ns] Передать Шун противоядие."
10004075-104 = "Спасибо."
10004075-105 = "Я сегодня доставила тебе столько проблем."
10004075-115 = "Гр-р-р... Шун, ты за это заплатишь, когда вернёшься. Клянусь!"
10004075-116 = ""
10004075-119 = ""
10004075-120 = "Правда? И что ты собираешься со мной сделать?"
10004075-121 = "О, Шун! К-Когда ты вернулась?"
10004075-122 = "Какая разница? Я ведь уже здесь, не так ли? ♥"
10004075-123 = "Понимаю, тебе было тяжело, но инструктор Сада сливового цветка не может плакать перед студентами. Тебе ещё многому учиться, Кокона."
10004075-124 = "Я-я вообще-то не плакала!"
10004075-125 = "В любом случае, где ты была сегодня? Мне пришлось готовить детям перекус и ужин, потому что ты исчезла!"
10004075-126 = "Вообще-то приготовление перекуса изначально было твоей задачей..."
10004075-127 = "...но я всё равно прошу прощения, что так внезапно исчезла."
10004075-128 = "В качестве извинения куплю тебе мороженое Baagen-Razs с карамельным моти — твоё любимое!"
10004075-129 = "Уф. Не думаю, что одного мороженого достаточно."
10004075-130 = "Но раз ты моя сестра, на этот раз прощу."
10004075-131 = "Шун, где ты была?!"
10004075-132 = "Ужин Коконы ужасный! Быстрее приготовь нам новый!"
10004075-133 = "Эй! Нельзя так говорить, даже если вам не нравится её еда. Она старалась!"
10004075-134 = "Но раз сегодня я опоздала, на десерт приготовлю вкусные панкейки!"
10004075-135 = "Ура! Шун, ты лучшая!"
10004075-136 = "Ну что, все. Пойдём ужинать вместе, хорошо?"
10004075-137 = "Ага!"
10004075-138 = ""
10004075-140 = ""
10004075-141 = ""
10004075-142 = ""
10004075-144 = ""
10004075-145 = "Кстати, я ведь так и не попрощалась как следует, да?"
10004075-146 = "Спасибо за сегодня."
10004075-147 = "[s] «Береги себя, Шунлинь.»"
10004075-148 = ""
10004075-150 = ""
10004075-151 = "Хорошо, Сенсей."
10004075-153 = "Я ещё немного посидел на скамейке в парке и смотрел, как Шун и студенты уходят."
