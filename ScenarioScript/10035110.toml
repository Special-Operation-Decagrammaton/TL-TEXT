[translation]
10035110-1 = "Эпизод 11;Эпилог"
10035110-3 = "Извините!"
10035110-4 = "Сотрудница Кирино из Бюро общественной безопасности прибыла в Бюро общественного порядка по служебному делу!"
10035110-5 = "Разрешите войти!"
10035110-6 = "Я же говорила, не нужно так официально."
10035110-7 = "Я заметила, что они не отвечают, когда я говорю таким тоном."
10035110-8 = "Вот именно. Так что просто заходи."
10035110-9 = "К тому же это они тебя сюда позвали."
10035110-10 = "Верно."
10035110-11 = "Они сказали, что хотят выдать мне награду за выполненную миссию."
10035110-12 = "Мне тоже. Я ждала."
10035110-13 = "Как думаете, что это будет? Отпуск на десять ночей и одиннадцать дней? Месячный бесплатный абонемент в Master Donut?"
10035110-14 = "О-о, или должность в Бюро безопасности или Бюро общественного порядка!"
10035110-15 = "Я бы отказалась..."
10035110-16 = ""
10035110-22 = "Почему вы стоите в дверях?"
10035110-23 = "Вы мешаете. Либо заходите, либо нет."
10035110-25 = "О! Директор!"
10035110-26 = "Как всегда, выглядите уставшей."
10035110-28 = "А ты помолчи."
10035110-29 = "Заходите. Конока говорит, для нас троих есть награда."
10035110-30 = "Музыка для моих ушей."
10035110-31 = "Можете сказать, что это? Хоть намёк."
10035110-32 = "Без понятия."
10035110-33 = ""
10035110-35 = ""
10035110-44 = "А-А-А! Что...? Почему?"
10035110-45 = ""
10035110-47 = ""
10035110-48 = ""
10035110-49 = "О, ты здесь!"
10035110-50 = "...Вы простудились?"
10035110-51 = "А-А-А! Что...? Почему?"
10035110-52 = "Ага, но ничего серьёзного. Я примерно ожидала, что простужусь."
10035110-53 = "В любом случае, я как раз собиралась вас звать, но вы уже здесь."
10035110-54 = "Здравствуйте, заместитель директора! Я сотрудница Кирино из Бюро общественной безопасности!"
10035110-55 = "Рада познакомиться. Вы многое для нас сделали!"
10035110-56 = "Как-нибудь надо вместе сходить поесть гюдон."
10035110-58 = "Хватит болтать."
10035110-59 = "Награда — дело, ради которого мы собрались. Давайте закончим и вернёмся к работе."
10035110-60 = "Конечно. Вот!"
10035110-62 = "Хорошо!"
10035110-63 = "Хм. Маленькие конверты."
10035110-65 = "...У меня плохое предчувствие."
10035110-66 = "Давайте, открывайте."
10035110-67 = ""
10035110-73 = ""
10035110-74 = ""
10035110-75 = ""
10035110-76 = "Это..."
10035110-77 = "Браслеты для входа в аквапарк «Эгир»."
10035110-79 = "Верно!"
10035110-80 = "В знак признания всей вашей тяжёлой работы там!"
10035110-81 = "А теперь сходите туда уже как посетители."
10035110-82 = "Я специально запросила их для вас. Показалось уместным."
10035110-83 = "...Почему все хмурятся?"
10035110-84 = "Ты хочешь, чтобы я снова туда пошла? Мне это место уже надоело."
10035110-85 = ""
10035110-87 = ""
10035110-89 = "У меня до сих пор всё тело болит..."
10035110-91 = "Вот. Отдай кому-нибудь другому."
10035110-92 = ""
10035110-95 = ""
10035110-96 = "...Хм."
10035110-97 = "Но директор, когда вы вернулись оттуда в прошлый раз, выглядели такими счастливыми."
10035110-98 = "Вам разве не нравится играть в воде?"
10035110-99 = "Мне? Нет, водные развлечения меня вообще не интересуют."
10035110-100 = "Если я улыбалась... значит, причина была в чём-то другом."
