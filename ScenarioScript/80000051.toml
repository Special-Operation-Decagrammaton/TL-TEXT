[translation]
80000051-1 = "Слаще и горше, чем когда-либо"
80000051-2 = "Столовая Геенны №17"
80000051-3 = "Я заглянул в одну из столовых Геенны после последнего сообщения Харуны."
80000051-4 = "[s] «Она сказала, что хочет встретиться здесь...»"
80000051-5 = "Как раз вовремя, Сенсей."
80000051-6 = "[s] «О, Харун—»"
80000051-7 = "ХААА!"
80000051-10 = "[ns] «Ч-Что...? Бр-р-р?!»"
80000051-11 = ""
80000051-14 = "Не успел я понять, что происходит, как на языке уже смешались горечь матчи и лёгкая сладость шоколада."
80000051-15 = ""
80000051-18 = "[ns] «*глоток* *выдох* Это был... шоколад с матчей?»"
80000051-19 = "Очень хорошо, Сенсей. У вас тонкий вкус."
80000051-20 = "[s] «Спасибо... наверное.»"
80000051-21 = "Вам стоит быть благодарным. Это шоколад люксового бренда.#nНу как?"
80000051-22 = "[s] «Эм... Горько-сладко.»"
80000051-23 = "Именно. Позвольте записать."
80000051-24 = "Ох. Наверное, вы не понимаете, что происходит."
80000051-25 = "Как вы знаете, сегодня День святого Валентина — день, когда люди дарят вкусные десерты тем, кто им дорог."
80000051-26 = "Чаще всего, конечно, дарят шоколад, но некоторые теперь выбирают торты, конфеты или макаруны."
80000051-27 = "Итак, Сенсей. Что общего у всех этих сладостей?"
80000051-28 = "[s] «Хм. Ну... Если попробовать угадать...»"
80000051-29 = "Дзинь. Время вышло."
80000051-30 = "[s] «Тут ещё и ограничение по времени было?!»"
80000051-31 = "Разумеется. На пути гурмана порой важна скорость.#nВершина вкуса иногда существует лишь краткий миг."
80000051-32 = "Но шутки в сторону: их объединяет то, что все они сладкие,#nочевидно же."
80000051-33 = "[s] «Это сладости, так что я думал, это и так понятно.»"
80000051-34 = "Казалось бы, очевидно. Но именно это заставило меня задуматься.#nПочему в День святого Валентина мы дарим именно сладости?"
80000051-35 = "Я долго размышляла над этим вопросом, пока кое-что не поняла."
80000051-36 = "Это метафора."
80000051-37 = "[s] «Что именно?»"
80000051-38 = "Сладость десерта символизирует сладость чувств, которыми люди делятся друг с другом."
80000051-39 = "Это метафора чувств, которые вы испытываете к другому человеку!"
80000051-40 = "[ns] «Д-Думаю... да.»"
80000051-41 = "Осознав это, я выдвинула гипотезу. Если сладость — метафора чувств, что будет, если вложить в десерт как можно больше любви?"
80000051-42 = "Не станет ли он сладким настолько, что вы и представить себе не сможете?!"
80000051-43 = "[s] «Возможно?»"
80000051-44 = "А вот ингредиенты для шоколада с матчей."
80000051-45 = "Вы, наверное, задаётесь вопросом: почему именно матча-шоколад?"
80000051-46 = "Поскольку шоколад с матчей от природы одновременно горький и сладкий,#nон идеально подходит для проверки моей гипотезы."
80000051-47 = "Именно поэтому вы здесь, Сенсей."
80000051-48 = "Мы вместе приготовим шоколад, удвоим сладость и полностью перебьём горечь!"
80000051-49 = "[s] «Погоди. Харуна, ты хочешь сказать...?»"
80000051-50 = "Вы ведь поможете мне, правда?"
80000051-51 = "[s] «Чтобы он стал слаще, это должно озна—»"
80000051-52 = "Так вы поможете мне или нет?"
80000051-53 = "[s] «Есть, мэм.»"
80000051-54 = "Вот это я и хотела услышать. Начнём!"
80000051-55 = "После этого мы с Харуной принялись готовить шоколад."
80000051-58 = "Хм. Возможно, мы неправильно регулировали температуру.#nКастрюля ведь не должна внезапно взрываться."
80000051-59 = ""
80000051-61 = ""
80000051-67 = "Знаете... В Геенне ходит городская легенда, будто в холодильнике этой столовой живёт демон. Возможно, она правдива."
80000051-68 = "Но меня это не остановит. Мы так легко не сдадимся!"
80000051-69 = ""
80000051-71 = ""
80000051-76 = "Ещё раз! Попробуем снова!"
80000051-77 = ""
80000051-79 = ""
80000051-80 = "[ns] «Ты ТОЧНО уверена, что это сработает?!»"
80000051-83 = "После множества проб и ошибок мы наконец закончили шоколад с матчей."
80000051-85 = "И вуаля! Готово. Представляю вам совершенный домашний#nшоколад с матчей."
80000051-86 = "Попробуйте и скажите, слаще ли он того шоколада, которым я кормила вас раньше."
80000051-87 = "[s] «Л-Ладно.»"
80000051-88 = ""
80000051-92 = "Хи-хи-хи!"
80000051-93 = "Харуна смотрела на меня с ожиданием, и, к счастью, мне не пришлось сдерживать впечатления."
80000051-94 = "[s] «Сладкий. Намного слаще предыдущего.»"
80000051-95 = "Я так и знала! Мы сделали ещё один шаг к вершине гурманства!"
80000051-96 = "[s] «Наверное, потому что ты вложила в него свои чувства.»"
80000051-97 = "...?!"
80000051-98 = "М-Мои чувства, говорите? Д-Да, полагаю, это не совсем неверно."
80000051-99 = "Но я..."
80000051-100 = "[s] «Харуна?»"
80000051-101 = "Вот уж неожиданность."
80000051-102 = "(Стоять лицом к лицу с тем, кто мне дорог, и слышать похвалу шоколаду, который я приготовила... Поистине, это слаще любого десерта.)"
80000051-103 = "Хи-хи. Сегодня я многое поняла."
80000051-104 = "А теперь я пойду, Сенсей."
80000051-105 = "Остальной шоколад оставляю вам. До встречи."
80000051-106 = ""
80000051-108 = ""
80000051-109 = "[ns] «Харуна?! Ты куда?!»"
80000051-112 = "Я смотрел, как Харуна стремительно уходит, и откусил ещё кусочек шоколада с матчей."
80000051-114 = "Он всё ещё был горьким — и всё же теперь казался слаще, чем когда-либо."
