[translation]
10023105-2 = "Ух...!"
10023105-3 = "Это поистине исключительная сила... Неужели это... сила Сенсея из Шале, о которой все говорят?"
10023105-4 = ""
10023105-6 = ""
10023105-11 = "Корона возвращена!"
10023105-12 = "Получен редкий предмет! Бум-бум-бум!"
10023105-13 = "Что нам делать... с ней...?"
10023105-14 = ""
10023105-17 = ""
10023105-19 = "...!"
10023105-20 = "Берегите дыхательные пути, Сенсей. Этот дым вреден."
10023105-22 = "Аргх! Глаза чешутся! *кашель* *кашель* Момои, ты здесь?"
10023105-24 = "Ай! Я слышу тебя совсем рядом, но не вижу!"
10023105-25 = ""
10023105-29 = "Внезапно к моей ноге подкатилась маленькая штука, похожая на шарик."
10023105-30 = ""
10023105-33 = "И когда я поднял этот шарик..."
10023105-34 = "Здравствуйте. Сенсей?"
10023105-35 = "[s] «...Да, я вас слышу.»"
10023105-37 = "Я хотела извиниться за то, как мы расстались."
10023105-38 = "В итоге вы победили. Корона у вас."
10023105-39 = "Но с другой стороны, мне удалось вырвать Корону из рук Мэйтаро. Так даже лучше."
10023105-40 = "Так что я не полностью удовлетворена, но на этот раз отпущу ситуацию. Считайте это знаком моего уважения в честь нашей первой встречи, Сенсей из Шале."
10023105-41 = "[s] «...Ты всё это время делала всё одна?»"
10023105-42 = "..."
10023105-43 = "Сенсей, вы знаете, чем отличается камень от произведения искусства?"
10023105-44 = "Для некоторых ничем. Настолько они слепы к истинной ценности искусства."
10023105-45 = "Я говорила серьёзно. Только я способна понять его красоту, увидеть истинную ценность."
10023105-46 = "А значит, только я способна хранить эти предметы в безопасности, разве нет?"
10023105-47 = "[s] «И поэтому ты решила стать воровкой?»"
10023105-50 = "Да. Так проявляются моя любовь, преданность и милосердие к красоте... моё благородство."
10023105-51 = "Я забираю произведение искусства, которое иначе навечно исчезло бы во тьме, и храню его, пока мир не будет готов увидеть его."
10023105-52 = "«В день рождения мы чисты: без титулов, без ярлыков. И потому принимаем те, которыми нас одаривают другие.»"
10023105-53 = "Мир называл меня воровкой, поэтому я приняла это имя, добавив к нему свой смысл."
10023105-54 = "...Конечно, люди говорят, что не понимают меня, что это не любовь, что я безумна."
10023105-55 = "Так что я ничего не смогу сделать, если и вы тоже—"
10023105-56 = "[s] «Ну... Я на самом деле не думаю о тебе так.»"
10023105-57 = "А?!"
10023105-60 = "[ns1] «Это непросто, но я понимаю.» \n[ns2] «Я твой учитель. Я не стану тебя судить.» \n[ns3] «Я всегда буду стараться понять тебя.»"
10023105-61 = ""
10023105-62 = ""
10023105-63 = ""
10023105-66 = "Мне ещё никто... никогда так не отвечал."
10023105-67 = "Я не обычный студент. Вы действительно можете понять воровку, Сенсей?"
10023105-68 = "[s] «Как взрослый и твой учитель, я не должен тебя судить.»"
10023105-69 = "А если эта воровка упрямая и испорченная? Та, что никогда не изменится?"
10023105-70 = ""
10023105-73 = "[ns] «Я умею не сдаваться, когда дело касается моих учеников.»"
10023105-74 = "...!"
10023105-75 = "[s4] «Я буду рядом, чтобы остановить студента, если он слишком далеко свернёт с пути.» \n[s5] «И всегда протяну ей руку, когда она потеряется.»"
10023105-78 = "Значит, мы просто продолжим пытаться? Это вы хотите сказать?"
10023105-79 = "..."
10023105-80 = "Я бы хотела задать вам вопрос..."
10023105-81 = "Несмотря на то, что я преступница, одна из печально известных Семи Заключённых и даже Благородная Воровка... я всё равно ваш студент?"
10023105-82 = "[s] «Когда я смотрю на тебя, я вижу только своего студента.»"
10023105-83 = "..."
10023105-84 = "...Акира."
10023105-85 = "[s] «Акира?»"
10023105-86 = "Да. Киёсуми Акира."
10023105-87 = ""
10023105-90 = "Это моё имя."
10023105-91 = ""
10023105-94 = "Сенсей... Уверена, однажды судьба снова сведёт наши пути. А до тех пор..."
10023105-95 = ""
10023105-100 = "Угх..."
10023105-101 = "Я снова вижу! Сенсей, вы в порядке?!"
10023105-102 = "Вы не ранены, Сенсей? Вы слабый, поэтому вам нужно быть особенно осторожным."
10023105-103 = "Первичный осмотр указывает на хорошее состояние."
10023105-104 = "[s] «Да, я в порядке.»"
10023105-106 = "Эм... Если вы так говорите, но... у вас такое лицо, будто вы съели горькую конфету..."
10023105-107 = "Всё точно хорошо? Не знаю, сколько ещё плохих новостей я выдержу."
10023105-108 = "[s6] «Всё хорошо. Мы её получили?» \n[s7] «А Корона? Мы ведь её не потеряли?»"
10023105-109 = ""
10023105-110 = ""
10023105-112 = ""
10023105-113 = "Да. Иначе. Почему-то."
10023105-114 = ""
10023105-116 = ""
10023105-117 = "Она в безопасности."
10023105-119 = "Юзу достала Корону, и все с облегчением выдохнули."
10023105-120 = "Хотя и Благородная Воровка, и Мэйтаро сбежали, мы были счастливы, что все остались целы."
10023105-124 = "*тяжело дышит* *тяжело дышит* За мной ведь никто не гонится? Хорошо..."
10023105-125 = "Я ещё могу... Пока я не сдаюсь, обязательно появится шанс..."
10023105-126 = "Я знаю... Знаю! Я выжил не просто так!"
10023105-128 = "А? Вот как? Тогда попробуй пережить это."
10023105-129 = ""
10023105-131 = ""
10023105-132 = "Кто т—"
10023105-133 = ""
10023105-140 = ""
10023105-141 = "Угх?!"
10023105-142 = ""
10023105-152 = ""
10023105-153 = "Что это было? Я думала, будет драка."
10023105-154 = "«Магнат подворотен», говоришь? Мелкая сошка."
10023105-155 = "Эй, пошли! Надо поздороваться с кое-какими детишками."
