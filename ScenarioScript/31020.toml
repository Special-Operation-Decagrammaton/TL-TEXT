[translation]
31020-1 = "Эпизод 2;Клуб дополнительных занятий"
31020-2 = "Я больше не могу!"
31020-3 = "Я в агонии! В муках! В страданиях!"
31020-4 = "И-И всё это из-за вас, Сенсей!"
31020-5 = "[s] «Я?»"
31020-6 = ""
31020-7 = ""
31020-8 = "Кохару, если продолжишь так говорить, заденешь чувства Сенсея."
31020-9 = "Помни, Сенсей здесь только чтобы помочь нам... К тому же они пришли уже после того, как ты провалила прошлые экзамены, верно?"
31020-10 = "...!"
31020-11 = "Я-я член Комитета правосудия! Не моя вина, что мне приходится пропускать столько занятий!"
31020-12 = "Странно. Это касается и других членов Комитета правосудия, но провалилась только ты, Кохару."
31020-13 = "..."
31020-14 = "Боже, Азуса. Ты хочешь сказать Кохару, что она не очень умная?"
31020-15 = "Можешь понимать это так, но реальность в том, что иногда жизнь просто такая."
31020-16 = "Ты хочешь сказать, жизнь — это агония, муки и страдания, как она сказала? Глубоко."
31020-17 = "П-Почему пристали именно ко мне?! Вы все тоже провалились! Если я тупая, значит и вы все тупые!"
31020-18 = "А-Аха-ха... Девочки..."
31020-19 = "Идиотки — все до одной! Поэтому вы вообще и оказались в Клубе дополнительных занятий!"
31020-20 = "Ты!"
31020-21 = "И ты!"
31020-22 = "И ТЫ!"
31020-23 = ""
31020-24 = ""
31020-26 = "И ты тоже!"
31020-27 = "[s] «А я что сделал?!»"
31020-28 = "Так, Кохару. Глубоко вдохни. Успокойся."
31020-29 = "Успокоиться?! Нас всех исключат!"
31020-30 = "А если меня исключат, выгонят и из Комитета правосудия. Только не это..."
31020-31 = "Вот тут я могу посочувствовать. Исключение недопустимо. Я буду бороться до конца, каким бы бессмысленным это ни казалось."
31020-32 = "Ха-ха. Не знаю. Исключение не выглядит концом света. Скорее..."
31020-33 = "Что, простите?!"
31020-34 = "..."
31020-35 = "..."
31020-36 = "..."
31020-37 = ""
31020-38 = ""
31020-40 = ""
31020-41 = "П-Прости, что накричала. Я хотела сказать: мы здесь как раз затем, чтобы нас не исключили."
31020-42 = "Но если не начнём думать вместе..."
31020-43 = "...через неделю исключат всех."
31020-44 = "Мне кажется, тут нужно нечто большее, чем клише вроде «думать вместе». Может, мыслить нестандартно?"
31020-45 = "Например... «Давайте соединимся телами!» Как вам?"
31020-46 = ""
31020-47 = ""
31020-48 = ""
31020-50 = "Убери грязные мысли из головы, если не хочешь смертной казни, извращенка! Ты себя вообще слышишь? Это же бессмыслица!"
31020-51 = "Ох, у тебя совсем бедное воображение, Кохару. Мы всегда можем попробовать вместе."
31020-52 = ""
31020-53 = ""
31020-54 = ""
