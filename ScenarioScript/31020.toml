31020-59 = "Иду к тебе! ♥"
31020-60 = ""
31020-61 = ""
31020-63 = "Нет, отпусти меня! Спасите, Сенсей! Простите! Простите...!"
31020-64 = "Прости, что сорвалась на тебя, Ханако! Пожалуйста, отпусти меня!"
31020-65 = "Занятно. Я ещё не видела настолько эффективного приёма удержания в ближнем бою. Это может оказаться весьма полезным."
31020-66 = "Но я бы сначала выкрутила ей суставы. Ты сделала слишком много лишних движений руками."
31020-67 = ""
