[translation]
31020-1 = "Episódio 2;Clube de Aulas de Reforço"
31020-2 = "Eu não aguento mais!!"
31020-3 = "Não dá pra continuar fazendo isso! Eu não entendo nada! É chato! É um saco!!"
31020-4 = "E tudo isso é culpa sua, Sensei!!"
31020-5 = "[s] \"Quê, minha...?\""
31020-8 = "Ah, Koharu-chan. Se você disser um absurdo desses, vai deixar o Sensei sem jeito, não acha?"
31020-9 = "Afinal, o Sensei veio aqui apenas para nos ajudar... e, para começo de conversa, não entender a matéria e ter reprovado na prova não é culpa do Sensei, mas sua mesmo, Koharu-chan..."
31020-10 = "Ugh...!!"
31020-11 = "E-Eu faço parte do Comitê de Justiça! Por isso acabo faltando a muitas aulas... É isso! A culpa é disso!"
31020-12 = "Isso vale para todas as outras integrantes do Comitê de Justiça. Mas a única que está aqui é você, Koharu."
31020-13 = "..."
31020-14 = "Entendo. Ou seja, o que a Azusa-chan está tentando dizer é que a Koharu-chan é simplesmente uma bobinha, estou certa?"
31020-15 = "Bem, não está de todo errado. O que não tem remédio, remediado está; a vida é quase sempre vã."
31020-16 = "De fato, a vida é uma sucessão de sofrimentos... Essas coisas acontecem."
31020-17 = "Aaah, calem a boca!? Se for falar assim, vocês todas estão no mesmo barco! Se eu sou burra, todo mundo aqui é burra também, suas burras!!!!"
31020-18 = "A-Ahaha... Bom, quanto a isso..."
31020-19 = "N-Não falei nenhuma mentira, falei? Vocês estão aqui porque são burras, não é!?"
31020-20 = "Você também!"
31020-21 = "Você também!!"
31020-22 = "Você também!!!"
31020-26 = "E você também!!!!"
31020-27 = "[s] \"Eu sou o Sensei aqui, sabia...?\""
31020-28 = "Au... K-Koharu-chan, acalme-se um pouquinho..."
31020-29 = "Como é que eu vou me acalmar?! Numa situação dessas, em que todas nós estamos prestes a ser expulsas juntinhas...!"
31020-30 = "Se eu for expulsa... v-vou deixar de ser membro do Comitê de Justiça... Uuh..."
31020-31 = "É claro que eu também não pretendo ser expulsa. Vou superar isso custe o que custar, mesmo que eu tenha que passar por situações humilhantes."
31020-32 = "Ora, ora, ser expulsa não significa que seja o fim de tudo, então vamos levar as coisas com mais leveza. Na verdade..."
31020-33 = "C-Com licença!!!"
31020-34 = "..."
31020-35 = "..."
31020-36 = "..."
31020-41 = "Ah, hum, bem... O motivo de estarmos reunidas aqui, antes de mais nada, é justamente para evitarmos a expulsão..."
31020-42 = "Por enquanto, hum, precisamos juntar nossas cabeças e procurar algum bom jeito de resolver isso..."
31020-43 = "Senão, daqui a uma semana todas nós vamos mesmo acabar expulsas juntinhas..."
31020-44 = "\"Juntar nossas cabeças\"... Entendo. Não é ruim, mas não parece muito empolgante. Que tal algo um pouco mais, digamos..."
31020-45 = "Por exemplo, vejamos... Que tal \"juntarmos nossas partes fracas e sensíveis\"?"
31020-50 = "O-O que você tá falando assim do nada!? Nada de indecência! É proibido! Pena de morte!! P-Partes sensíveis?! O que você tá querendo juntar e como!?"
31020-51 = "Ah, ficou um pouco difícil de entender? Nesse caso, deixe-me demonstrar na prática. Se puder abrir um pouquinho mais as pernas, assim..."
31020-55 = "... Hã? Quê!?"
31020-58 = "P-Para! Não chega perto! Eu não sei de nada, não quero saber e ainda é cedo demais pra isso!!"
31020-59 = "Iá♡"
31020-63 = "P-Para...! Paraaa! S-Socorro, Sensei...!"
31020-64 = "E-Eu estava errada, me desculpe por falar sem respeito com uma veterana! Me perdoa, para com isso, isso ainda nããão!!!!"
31020-65 = "Entendo, então existe esse tipo de técnica de imobilização. Parece útil em combate corpo a corpo... Vivendo e aprendendo."
31020-66 = "Contudo, sinto que há muitos movimentos desnecessários. Se fosse eu, já teria travado a articulação dois tempos antes."
31020-68 = "..."
31020-69 = "S-Senseeei..."
31020-70 = "[s] \"... É, eu também vou dar o meu melhor.\""
31020-71 = "C-Conto com você..."
31020-72 = "Se continuar assim... todas nós vamos mesmo acabar expulsas..."
31020-74 = "(O início de toda essa história remonta a algumas semanas atrás...)"
31020-76 = "Terraço de Trinity"
31020-78 = "Olá, Sensei [USERNAME]. Esta é a primeira vez que nos encontramos pessoalmente assim, não é?"
31020-79 = "Me chamo Kirifuji Nagisa, anfitriã da Tea Party."
31020-81 = "E esta é Misono Mika-san, que também é membro da Tea Party."
31020-82 = "Mais uma vez, é um prazer conhecê-lo. Nós somos o conselho estudantil de Trinity, a Tea Party."
31020-84 = "Próximo;Tea Party"
