[translation]
10013060-1 = "Эпизод 6;Посланники Чёрной Черепахи 1"
10013060-6 = "Вот мы и пришли! Это тот самый курорт, о котором все говорят в интернете. Здесь находятся Посланники Чёрной Черепахи, требующие постоянной компенсации!"
10013060-7 = "[s] «Какая толпа.»"
10013060-8 = "И не только..."
10013060-9 = "*принюхивается* Изуна чувствует что-то вкусное!"
10013060-10 = ""
10013060-12 = ""
10013060-13 = ""
10013060-14 = ""
10013060-15 = "Сенсей. У меня урчит живот."
10013060-16 = "[s] «Хм, может, что-нибудь съедим?»"
10013060-17 = "Да, пожалуйста!"
10013060-18 = "Хи-хи. На сытый желудок всё лучше."
10013060-20 = "Кстати..."
10013060-21 = "Здесь всё выглядит спокойно. Неужели это место действительно известно тем, что здесь собираются свирепые Охотники за курортами?"
10013060-22 = "Я нашла ещё немного информации в интернете."
10013060-23 = "Похоже, управлением этим курортом занимается знаменитая Променад Чёрной Черепахи."
10013060-24 = "[s] «Променад Чёрной Черепахи из Шаньхайцзина?»"
10013060-25 = "ТА САМАЯ Чёрная Черепаха?!"
10013060-26 = "Но странно другое... хотя они заметны в Охоте на курорты..."
10013060-27 = "В интернете пишут, что обслуживание клиентов здесь ужасное!"
10013060-28 = "Как странно... Они известны вкусной едой, я думала, обслуживание тоже будет хорошим."
10013060-29 = "Придётся увидеть и оценить самим."
10013060-30 = ""
10013060-36 = "Смотрите. Там люди кричат."
10013060-37 = "Похоже, клиент и работник."
10013060-39 = "Н-Это нечестно! Как можно брать деньги за то, что я сижу на стуле?!"
10013060-40 = "Что значит нечестно? Пользуешься вещью — естественно, плати!"
10013060-41 = "И не только за стул: ещё плати за то, что тронул палочки и стакан!"
10013060-42 = "О! И стол тронул! Добавлю в счёт!"
10013060-43 = "Э-Это уже слишком!"
10013060-44 = "Ха-ха-ха! Что значит? Мы Променад Чёрной Черепахи. Премиальные услуги стоят денег!"
10013060-45 = "Это всё равно нечестно!"
10013060-46 = "[s] «А! Шизуко!»"
10013060-47 = "Вы вообще кто такие?! Пришли мешать нашему бизнесу?"
10013060-48 = "Я понимаю, что в бизнесе есть расходы на труд, аренду и прочее, и цена определяется этими факторами. Цену назначает поставщик услуги."
10013060-49 = "На курорте люди и правда готовы тратить больше обычного."
10013060-50 = "Из-за спроса и предложения естественно брать столько, сколько удаётся! Я знаю это лучше кого-либо!"
10013060-51 = "Но вы всё равно переходите черту!"
10013060-52 = "Плата за то, что сел на стул, тронул палочки, стакан, стол? Это уже неуважение к клиентам!"
10013060-53 = "Точно! Что это за бизнес? Это обдираловка!"
10013060-54 = "Я всё думала, откуда взялось название «Посланники Чёрной Черепахи, требующие постоянной компенсации»."
10013060-55 = "Но не могу поверить, что оно значило именно это! Если оказываете услугу, нужно заботиться о клиентах!"
10013060-56 = "Как знаменитая Променад Чёрной Черепахи докатилась до такого?"
10013060-57 = "[s] «Нет-нет, это Банда Курокамэ.»"
10013060-58 = ""
10013060-60 = ""
10013060-61 = "Серьёзно?"
10013060-62 = "О, это... не Променад Чёрной Черепахи?"
10013060-63 = "Что?! Правда?!"
10013060-65 = "Н-Нас раскрыли?!"
10013060-66 = "Подкрепление! Вызывайте подкрепление!"
10013060-67 = ""
10013060-70 = ""
10013060-74 = "Что происходит? Это не Променад Чёрной Черепахи, а Банда Курокамэ?"
10013060-75 = "[s] «Да, но я думал, они распались.»"
10013060-76 = ""
10013060-78 = ""
10013060-79 = ""
10013060-80 = "Что происходит?"
10013060-81 = ""
10013060-84 = ""
10013060-85 = "Я же говорила вам разбираться с мелкими проблемами самостоятельно."
10013060-86 = ""
10013060-88 = ""
10013060-89 = ""
10013060-91 = "Ах."
10013060-92 = "Ох."
10013060-93 = "[s] «Ох.»"
10013060-94 = ""
10013060-96 = ""
10013060-98 = "Эм..."
10013060-99 = "Д-Д-Датэ Мяуру?!"
10013060-100 = "П-Погоди. А вы что здесь делаете?"
10013060-101 = "Хотя... наверное, этого стоило ожидать."
10013060-102 = "Я видела в своём контракте, что Отдел проведения фестивалей Хяккияко указан владельцем этих курортов."
10013060-103 = "Так что ваше появление не было совсем уж невозможным, но всё же!"
10013060-104 = "[s] «Что ты здесь делаешь?»"
10013060-105 = "Хмф! Как видите, занимаемся бизнесом."
10013060-106 = "Мы никому ничего не навязываем. У меня есть курортный билет, дающий право вести здесь дела. Нам нечего скрывать!"
10013060-107 = "[s] «Но вы выдавали себя за Променад Чёрной Черепахи.»"
10013060-108 = "Кхм! Э-Это была просто умная и находчивая бизнес-стратегия!"
10013060-109 = "Мы пришли собрать остатки провалившейся организации, реорганизоваться и начать бизнес заново! Верно?!"
10013060-110 = ""
10013060-111 = "Да!"
10013060-113 = "Скорее реорганизоваться и строить заговоры! Ты злодейка!"
10013060-114 = "Какие ещё заговоры? Хм? Я увидела хорошую возможность и воспользовалась ею."
10013060-115 = "Курортный контракт... Очевидно, это была чья-то ловушка. Вы полностью на неё попались. Какая жалость."
10013060-116 = "...!"
10013060-117 = "Мы восстановили организацию и создали этот курорт. Ха-ха! Я снова получила платформу и поднялась наверх. Наверное, мне стоит вас поблагодарить!"
10013060-118 = "Раз ты уже знаешь ситуацию, объяснять ничего не нужно. Отдавай контракт!"
10013060-119 = "Хмф! Ты правда думаешь, я просто так отдам его тебе?"
10013060-120 = "Это из-за тебя всё дошло до такого, Кавава Шизуко!"
10013060-121 = "Это..."
10013060-122 = "Очевидно, ты решила быстро заработать и пожадничала!"
10013060-123 = "Поспешно разрешила использовать своё имя и позволила себя использовать. Какое разочарование."
10013060-124 = "Нет! У босса вообще не было таких намерений!"
10013060-125 = "[s] «Шизуко не стала бы так действовать, не подумав.»"
10013060-126 = "Сенсей..."
10013060-128 = "Твои намерения неважны! Вам вообще не следовало сюда приезжать!"
10013060-129 = "Каждый, у кого есть контракт, становится целью Охоты на курорты!"
10013060-130 = ""
10013060-132 = ""
10013060-133 = "Мы заберём у вас всё!"
10013060-135 = "Все! Осторожно!"
10013060-136 = "Изуна будет сражаться рядом с вами, господин!"
10013060-137 = "Ага! Давайте всё сожжём."
