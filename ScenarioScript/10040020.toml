[translation]
10040020-1 = "Эпизод 2;Конец года, начало года"
10040020-2 = ""
10040020-3 = "Ну..."
10040020-4 = "Все эти вещи, разбросанные по комнате, как-то связаны с тем, почему мы сейчас в пижамах?"
10040020-5 = "Подожди, Ноа! Не осматривайся тут без разрешения! Я ещё не закончила всё готовить!"
10040020-6 = "Хихи. Прошу прощения. Просто здесь собрана такая интересная коллекция вещей."
10040020-7 = ""
10040020-9 = ""
10040020-10 = ""
10040020-11 = "Набор для ночёвки с зубной щёткой и туалетными принадлежностями, лёгкие ночные закуски..."
10040020-12 = "...и эти очаровательные пижамы с зайчиком. Судя по размеру, они для Коюки?"
10040020-13 = "Э-Это...!"
10040020-14 = "Но как странно... Мне кажется, последние несколько дней ты вообще не выходила из клубной комнаты Семинар."
10040020-15 = "Так откуда взялась эта пижама?"
10040020-16 = "На прошлой неделе... Я искала одежду в торговом районе и увидела эту пижаму. Ушки кролика показались мне милыми..."
10040020-17 = "А мне она слишком мала, зато цвет и дизайн очень напомнили Коюки... Вот я и подумала, что когда-нибудь можно будет подарить—"
10040020-18 = ""
10040020-20 = ""
10040020-21 = "Почему я вообще выдумываю все эти странные оправдания?!"
10040020-23 = "Хихи. Когда дело касается Коюки, ты и правда слишком мягкая."
10040020-24 = ""
10040020-26 = ""
10040020-27 = "...Ну, уверена, Коюки проще ладить со своей честной и заботливой, хоть и ворчливой, старшей. В отличие от кое-кого, кого слишком трудно прочитать."
10040020-28 = "Ноа, ты всё ещё думаешь о том, что Коюки сказала раньше?"
10040020-29 = ""
10040020-31 = ""
10040020-32 = "...Нет?"
10040020-33 = "Похоже, всё-таки думаешь."
10040020-34 = "Коюки иногда бывает немного легкомысленной, но она никогда намеренно не злится и не относится к людям предвзято."
10040020-35 = "Вам просто нужно чаще проводить время вместе, и тогда Коюки избавится от своих странных заблуждений насчёт тебя."
10040020-36 = "К тому же в последнее время Семинар был так занят чередой происшествий, что сотрудники почти не успевали общаться друг с другом."
10040020-37 = "Именно поэтому я и устроила сегодня эту пижамную вечеринку!"
10040020-39 = "...Ты действительно очень заботливая, Юука."
10040020-40 = "Ты права. Укреплять отношения с моей милой младшей важно. Думаю, пижамная вечеринка — отличная идея, Юука. Я уже предвкушаю."
10040020-41 = "За приятным разговором и в расслабленной атмосфере мы, возможно, даже увидим твою сторону, которой ещё никогда не встречали. Хихи."
10040020-42 = "(Почему-то мне кажется, что я начинаю лучше понимать то самое «давление», о котором говорила Коюки...)"
10040020-43 = "Если подумать, я давно не была в твоей комнате общежития. Обычно мы просто расходимся по домам от клубной комнаты."
10040020-44 = "С тех пор ты здорово её обжила. Этих плакатов и фотографий раньше не было..."
10040020-45 = ""
10040020-47 = ""
10040020-48 = "Ох? Это Сенсея..."
10040020-49 = "Почему ты без разрешения роешься в моей комнате?!"
10040020-50 = "Разве не так начинаются все пижамные вечеринки? Находят тайные дневники или фотографии, спрятанные в спальне главной героини?"
10040020-51 = "Я как-то читала такое в любовном романе из библиотеки."
10040020-52 = "Нет! Это вообще не нормально! И эта дурацкая вечеринка ещё даже не началась!"
10040020-53 = "Если у тебя столько времени валять дурака, лучше помоги мне разобрать одежду."
10040020-54 = "Есть, госпожа!"
10040020-56 = "С одеждой всё. Осталось только... может, настольная игра, в которую мы сможем сыграть все вместе?"
10040020-57 = "В Семинар есть только старая колода карт. Ноа, у тебя есть какие-нибудь настольные игры?"
10040020-58 = "Хм. Лично у меня нет..."
10040020-59 = "А! Я слышала, у Маки большая коллекция настольных игр. Может, она согласится одолжить нам несколько на ночь?"
10040020-60 = "Маки... из Веритас?"
10040020-61 = "Уверена, у неё их полно, но почему-то мне совсем не хочется её просить."
10040020-62 = "Да и общее мнение такое, что Веритас, мягко говоря, не самые большие поклонники Семинар."
10040020-63 = "Хм? Кажется, я помню, как ты говорила, что хорошее общение помогает устранять недопонимание."
10040020-64 = "Почему бы не воспользоваться случаем, не поговорить с Маки и заодно не развеять некоторые твои заблуждения о Веритас?"
10040020-65 = "Ладно-ладно, поняла. Спросим Маки, можно ли взять её настольные игры."
10040020-66 = "Но эта пижамная вечеринка — личное мероприятие! Чтобы избежать лишних проблем, никаких записей о ней в документах Семинар, ясно?"
10040020-67 = "Никаких записей не будет. Фуфу."
10040020-69 = ""
10040020-70 = ""
10040020-71 = ""
10040020-72 = ""
10040020-73 = ""
10040020-74 = ""
10040020-75 = ""
10040020-76 = ""
10040020-77 = "Хмм... Этого недостаточно для нужного впечатления. Может, композиция слишком банальная?"
10040020-78 = "Можно снизить насыщенность по краям, чтобы сделать контраст сильнее..."
10040020-79 = ""
10040020-83 = ""
10040020-84 = ""
10040020-85 = ""
10040020-86 = "А. Вот ты где, Маки."
10040020-87 = "Мы не нашли тебя в общежитии, поэтому пошли искать."
10040020-89 = "А? Юука... и Ноа тоже?"
10040020-90 = "Я понимаю, последний день года, но вы уже в пижамах? Даже если хотите лечь спать пораньше, не СЛИШКОМ ли это рано?"
10040020-92 = "Ну, вообще-то мы так оделись, потому что..."
10040020-93 = "Мы планируем маленькую весёлую пижамную вечеринку для укрепления дружбы между сотрудниками Семинар."
10040020-94 = "Ну, это официальная причина. А настоящая в том, что Юука так старалась, потому что переживала, что Коюки будет одиноко встречать Новый год взаперти в Комнате самоанализа—"
10040020-95 = "НОА!"
10040020-97 = "Ого! Пижамная вечеринка! Завидую! Хотела бы и я устроить что-нибудь такое..."
10040020-98 = "Хотя, если подумать, мы и так довольно часто всю ночь едим закуски и играем..."
10040020-99 = "А ты, Маки? Не встречаешь Новый год с другими членами клуба?"
10040020-100 = "А, я? Работаю над плакатом для будущей выставки Миллениум."
10040020-101 = "В этом году весь график сдвинули вперёд, поэтому срок подачи плакатов наступает гораздо раньше, чем я ожидала."
10040020-102 = "А, точно. У нас были проблемы с персоналом, поэтому выставку следующего года перенесли на более ранний срок."
10040020-103 = "Помощь школе, должно быть, не даёт тебе скучать."
10040020-104 = "Да нормально. Мне всё равно было скучновато, потому что у клуба не было особых планов на Новый год."
10040020-105 = "А иногда хаотичная спешка в конце года здорово вдохновляет, знаешь?"
10040020-107 = "Каждый раз, когда вижу твою работу, поражаюсь твоему таланту."
10040020-108 = "И мне интересно, Маки: с таким талантом почему ты не поступила в художественную академию Вайлдхант?"
10040020-109 = "Ахаха. Если я начну эту историю, мы просидим тут до следующего года..."
10040020-110 = "В общем, вы меня искали, да? Я могу чем-то помочь?"
10040020-111 = "А. Я слишком увлеклась разговором."
10040020-112 = "Маки, у тебя случайно нет настольных игр, которые можно одолжить? Я надеялась, что на пижамной вечеринке мы сможем поиграть вместе."
10040020-113 = "Эм, в последнее время я почти не играю, так что совсем не против дать их вам. Но..."
10040020-114 = "Котама и Харе взяли их несколько дней назад и до сих пор не вернули."
10040020-115 = "Не могли бы вы спросить у них вместо меня? Я не могу отойти посреди работы над рисунком."
10040020-117 = "Конечно. Тогда после вечеринки я верну их тебе."
10040020-118 = "Фуфуфу, значит, получу их уже в следующем году?"
10040020-119 = "Увидимся в новом году, Юука!"
10040020-120 = "С Новым годом, Маки!"
10040020-122 = ""
10040020-123 = "Эм... Котамы и Харе тоже нет в общежитии?"
10040020-124 = "Может, они замышляют какой-нибудь злодейский заговор..."
10040020-125 = "По-моему, это уже немного притянуто за уши."
10040020-126 = "Как ни крути, сегодня последний день года. Как и Маки, они могут просто быть заняты подготовкой к Новому году."
10040020-127 = "Нет-нет. Нельзя терять бдительность."
10040020-128 = "Вспомни, сколько проблем члены Веритас устроили, когда их никто даже не подозревал—"
10040020-129 = "Мои дети опять создают проблемы?"
10040020-130 = ""
10040020-132 = ""
10040020-133 = "Этот голос..."
10040020-134 = "А, Чихиро! Ты не видела Котаму и Харе—"
10040020-136 = ""
10040020-137 = "Ч-что-то случилось? Ты выглядишь измотанной!"
10040020-138 = "Ничего серьёзного. Я просто не спала двое суток."
10040020-139 = "Это ОГРОМНАЯ проблема!"
10040020-140 = "Проблемы с безопасностью школьных серверов?"
10040020-141 = "Не совсем. Просто поступили сообщения о новой вредоносной программе на публичных серверах Миллениум, которую не обнаруживает даже наш последний антивирус."
10040020-142 = "Похоже, это вредоносное ПО — чья-то шутка. Люди жаловались на внезапные страшные изображения на экранах или пустые письма, отправляющиеся сами собой. Я прочесала сервер за два дня, но не нашла ни единого следа."
10040020-143 = "Если даже ты не смогла её найти..."
10040020-144 = "Возможны две причины. Либо сообщения ошибочны, либо это работа хакера, который на несколько уровней выше меня."
10040020-145 = "В любом случае, сейчас я больше ничего не могу сделать. Я как раз собиралась спать."
10040020-146 = "Последний день года, а ты так усердно работаешь."
10040020-147 = "Такова природа работы в безопасности."
10040020-148 = "В любом случае, зачем вы спрашивали про наших членов? Что-то случилось?"
10040020-150 = "О, вовсе нет... Мы устраиваем пижамную вечеринку Семинар и хотели одолжить у Харе и Котамы несколько настольных игр."
10040020-151 = "Пижамная вечеринка... Звучит неплохо. Как далёкая мечта, до которой никак не дотянуться."
10040020-152 = "Они, скорее всего, в гостиной Веритас. Когда я проверяла сервер клубной комнаты, их смартфоны пинговались именно там."
10040020-153 = "Ого, вот она — сила вице-президента Веритас?"
10040020-154 = "Ну, это проще, чем в одиночку в тёмной комнате искать код, которого, возможно, вообще не существует."
10040020-155 = "*вздох*... Надеюсь, сегодня ночью ничего не случится."
10040020-157 = "Я бы не переживала. Ты два дня изучала систему. В Кивотосе нет ни одного хакера, который сможет взломать твою защиту всего за день."
10040020-158 = "Выбрось это из головы и отдохни!"
10040020-159 = "Точно. Спокойной ночи, Чихиро, увидимся в следующем году!"
10040020-161 = "Да-да. И вас с Новым годом."
10040020-163 = "Вот, Котама. Я запрограммировала её автоматически начинать запись, если кому-то выпадет штраф в рулетке."
10040020-164 = "Но зачем вообще настольной игре функция записи?"
10040020-165 = "Разве не очевидно, Харе? Есть только одно разумное объяснение, зачем нужны записи из «Пиратской рулетки», известной элементом неожиданности."
10040020-167 = "Чтобы записывать испуганные визги игроков."
10040020-169 = "Ладно, это я понимаю, но... что ты вообще будешь с ними делать?"
10040020-170 = "Тот ASMR, который тебе нравится, — это же скорее тихий шёпот и мягкие звуки?"
10040020-171 = "Разумеется, пронзительные резкие вопли не относятся к самым популярным типам аудиозаписей. Но именно поэтому их образцы гораздо реже."
10040020-172 = "Посмотри на киноиндустрию. Они до сих пор используют одни и те же затёртые крики из классических фильмов."
10040020-173 = "Если я смогу получить записи естественных криков, возможно, позже сумею обменять их на ещё более ценные аудиоматериалы..."
10040020-175 = "...Обменять? Кроме тебя, кому-то ещё такое нравится?"
10040020-176 = "В любом случае, подумай. А если в эту игру случайно сыграет Сенсей [USERNAME]? Мы можем получить редкую запись его голоса!"
10040020-177 = "Это... заманчиво..."
10040020-178 = "Фуфуфу. И с установкой этого сверхмаленького рекордера всё готово!"
10040020-179 = "Теперь остаётся лишь вернуть «Пиратскую рулетку» на место и позволить устройству делать своё дело."
10040020-180 = ""
10040020-182 = ""
10040020-183 = ""
10040020-184 = "...Ты ведь понимаешь, что я не могу позволить вам осуществить такой злодейский план."
10040020-185 = ""
10040020-188 = "Семинар?! Когда вы...?"
10040020-189 = "А. Неужели вы тоже искали настольную игру с диктофоном?"
10040020-190 = "Ну, вообще-то мы предпочли бы игру без диктофона, но..."
10040020-191 = "Мне придётся конфисковать эту игру, которая явно угрожает частной жизни и безопасности."
10040020-192 = "Нууу...!"
10040020-194 = "Почему все так стремятся устроить проблемы именно в последний день года?"
10040020-195 = "Вот поэтому все и думают, что Миллениум набит странными клубами. Обеим стоит брать пример с Чихиро!"
10040020-197 = "Хм."
10040020-198 = "Я понимаю, возможно, это не моё дело, но..."
10040020-200 = "А? Почему вы обе выглядите такими возмущёнными...?"
10040020-201 = "Ну, разве Семинар тоже не известен тем, что постоянно создаёт проблемы?"
10040020-202 = "Я слышала, что кое-кто из Семинар отключил гораздо больше систем безопасности, чем Веритас..."
10040020-203 = "К-Коюки сейчас очень усердно занимается самоанализом, ясно?!"
10040020-204 = "Последний месяц она очень послушно размышляла о своих поступках— то есть, может, последнюю неделю!"
10040020-206 = "Тебе не нужно так оправдывать Коюки, Юука."
10040020-207 = "...Хотя, если подумать, в последнее время Коюки и правда довольно хорошо себя ведёт."
10040020-208 = "Она не пыталась дерзко сбежать из Комнаты самоанализа и не касалась никаких неразрешённых электронных устройств."
10040020-210 = "Может, новый год помогает ей немного повзрослеть?"
10040020-211 = "Тогда эта пижамная вечеринка — награда за хорошее поведение?"
10040020-213 = "Скорее... я просто не доверяю Коюки настолько, чтобы надолго оставлять её одну без неприятностей."
10040020-214 = "Поэтому ради её спокойствия нам нужно периодически давать ей отвлекаться."
10040020-216 = "(Звучит так, будто они заботятся о новом щенке, а не о младшем студенте...)"
10040020-217 = "Тогда вам разве не нужно как можно скорее вернуться в Комнату самоанализа?"
10040020-219 = "Мы проверяли её несколько часов назад, и она тихо играла сама с собой. Всё должно быть нормально."
10040020-220 = "Несмотря на её чрезвычайную и нелепую безрассудность, сомневаюсь, что за такое короткое время она сумеет устроить серьёзный хаос."
10040020-221 = "Очень на это надеюсь."
10040020-222 = ""
