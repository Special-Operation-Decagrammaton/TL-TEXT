[translation]
1001508-1 = "Магия Арис"
1001508-2 = "Департамент Разработки Игр Милленниума"
1001508-3 = "Добрый вечер, Сенсей."
1001508-4 = "Я просто спокойно проводила время за игрой."
1001508-5 = "[s] «Правда? Во что играла?»"
1001508-6 = "В классическую RPG."
1001508-7 = "RPG — мои любимые игры. Другие тоже весёлые, но RPG всегда особенно радуют."
1001508-8 = "[s] «Мечи, магия... Тебе нравится такое?»"
1001508-9 = "Да, в RPG такое встречается."
1001508-10 = "[s] «В них есть фантастические вещи, которых не существует в реальности.»"
1001508-11 = "Вы так думаете?"
1001508-12 = ""
1001508-13 = "Я вижу это иначе."
1001508-14 = ""
1001508-15 = ""
1001508-18 = "― Я считаю, что магия существует и в Кивотосе.[wa:2020]"
1001508-21 = "― Она должна существовать. Иначе как вам удаётся делать меня такой счастливой, Сенсей?[wa:3710]"
1001508-24 = "― Игры прекрасны потому, что отражают красоту мира.[wa:2950]"
1001508-26 = "― Вы научили меня этому.[wa:720]"
1001508-29 = "― Игры, кошки, друзья... и даже этот момент.[wa:5460]"
1001508-31 = "― Мир полон прекрасных вещей.[wa:390]"
1001508-34 = "― И я хочу узнать о них больше. Вместе с вами, Сенсей.[wa:2080]"
1001508-37 = "― Я хочу узнать больше об этом мире![wa:410]"
1001508-40 = "Мы с Арис до поздней ночи говорили о её любимых RPG."
