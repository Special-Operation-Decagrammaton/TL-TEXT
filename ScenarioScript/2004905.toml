[translation]
2004905-1 = "Загорать — это совсем не весело"
2004905-2 = "Я взял два шезлонга и отправился на пляж, где была Мисаки."
2004905-4 = "А, ты здесь, Сенсей."
2004905-5 = "Это шезлонг? Два?"
2004905-6 = "Один для меня? Я не говорила, что соглашусь на это..."
2004905-7 = ""
2004905-9 = ""
2004905-10 = "...Ладно. Подыграю."
2004905-11 = "[s] «...А? Правда?»"
2004905-12 = "Что такое?"
2004905-13 = "...Ты не ожидал, что я так быстро соглашусь?"
2004905-14 = "Хочешь, чтобы я это сделала — сделаю. В чём проблема?"
2004905-15 = "...Если спрашиваешь, никакой особой причины нет. Просто хочу поскорее с этим закончить."
2004905-16 = "Всё равно это ничего не значит."
2004905-17 = "То есть мне просто лечь сюда?"
2004905-20 = ""
2004905-21 = "Я поставил свой шезлонг рядом с Мисаки и лёг, глядя в небо."
2004905-23 = "...Жарко."
2004905-24 = "[s] «Я думал, ты привыкла к жаре.»"
2004905-25 = "То, что я к ней привыкла, не значит, что она мне нравится."
2004905-26 = "И зачем вообще люди этим занимаются?"
2004905-27 = "[s1] «Потому что слегка загорелая кожа выглядит здоровой...?»\n[s2] «Ну и витамин D всё такое...?»"
2004905-30 = "Хм."
2004905-31 = "Значит, по сути это бессмысленно."
2004905-32 = "[s] «Можно и так сказать.»"
2004905-33 = "..."
2004905-37 = "...Дождь?"
2004905-38 = "[s3] «Ух, льёт как из ведра!»\n[s4] «Сюда, давай спрячемся в той пляжной хижине!»"
2004905-41 = ""
2004905-44 = "*тяжело дышит* *тяжело дышит*"
2004905-45 = "[s] «Фух, успели. Садись.»"
2004905-47 = ""
2004905-48 = "Я знала, что что-нибудь такое обязательно случится."
2004905-49 = "У меня никогда не получается просто чем-то наслаждаться."
2004905-50 = "Каждый раз обязательно появляется что-то и всё отбирает."
2004905-51 = "Поэтому лучше вообще ничего не ожидать с самого начала."
2004905-52 = "Нет ожиданий — нет разочарований."
2004905-53 = "Нет напрасных усилий, нет эмоциональной драмы..."
2004905-54 = "[ns] «...»"
2004905-55 = ""
2004905-57 = ""
2004905-58 = "Хм, дождь уже закончился? Будто облака разом вылили всю воду."
2004905-59 = "И что теперь?"
2004905-60 = "Полагаю, ты хочешь вернуться загорать."
2004905-61 = "[s] «Вообще-то да.»"
2004905-62 = "Ух... Зачем?"
2004905-63 = "[s5] «Ну, если забыть про здоровую кожу и витамин D...»\n[s6] «Полежать рядом и поболтать с тобой — это будет хорошее воспоминание.»"
2004905-66 = "..."
2004905-67 = "Не понимаю."
2004905-68 = "Воспоминания..."
2004905-69 = "...И что будет, когда только они и останутся? По-моему, тогда просто почувствуешь пустоту."
2004905-70 = "[s7] «Я готов рискнуть, если и ты готова.»\n[s8] «Почему бы не проверить самой?»"
2004905-73 = "Опять ты меня втягиваешь..."
2004905-74 = "..."
2004905-75 = "*вздыхает*"
2004905-76 = "Я всё ещё не понимаю..."
2004905-77 = "...но ладно. Втягивай."
