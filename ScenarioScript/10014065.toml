[translation]
10014065-4 = "Здесь?"
10014065-5 = "Как вы узнали, Сенсей? Прицепили трекер или ещё что-нибудь странное?"
10014065-6 = "[s1] «Я просто пошёл туда, где была большая толпа бандитов.» \n[s2] «Их довольно трудно не заметить.»"
10014065-7 = "П-Правда..."
10014065-8 = "П-Правда..."
10014065-9 = "Теперь понятно. При таком шуме Оперативная группа справедливости из Тринити уже давно бы явилась."
10014065-10 = "Они хотели любой ценой этого избежать, поэтому устроили Рейсе засаду здесь, на окраине."
10014065-11 = "Валькирия или кто-то ещё так далеко не поможет до самого утра."
10014065-12 = "Кстати..."
10014065-13 = ""
10014065-14 = ""
10014065-15 = ""
10014065-16 = "А эти люди что здесь делают?"
10014065-17 = "Что значит «эти люди»?! Тебя убьёт хоть раз быть повежливее?"
10014065-18 = "Да! Убьёт! Идите домой! Здесь вы только помешаете!"
10014065-19 = "Думаешь, я балласт? А?! Давай выйдем и разберёмся!"
10014065-20 = "Уф... Ещё одна крикунья... Она уже и говорить начала как они... Мы буквально и так на улице..."
10014065-21 = "Хватит этого детского языка! Только не делай из этого привычку!"
10014065-22 = "Д-Детского? Я...?"
10014065-23 = "Повтори ещё раз!!"
10014065-25 = "Ёшими! Казуса! Сейчас правда не лучшее время для ссор!"
10014065-26 = "Как вы все здесь оказались?"
10014065-27 = "Вы ведь их позвали, да?"
10014065-28 = "[s3] «Чем больше, тем веселее.»\n[s4] Отвести взгляд и насвистывать."
10014065-29 = "Сенсей..."
10014065-30 = "Сенсей..."
10014065-31 = ""
10014065-33 = ""
10014065-34 = "Казуса. Мы — грозная Банда сладкоежек после уроков. Мы союзники Кат Палуг, которая сожрёт весь мир."
10014065-35 = "А союзник нашего союзника... тоже наш союзник."
10014065-36 = "Эти бандиты заплатят за то, что причинили вред союзнику нашей организации."
10014065-37 = "Сколько раз мне повторять? Мы не друзья."
10014065-38 = "Ха. Ха. Ха. Никакой дружбы? Как по-бандитски!"
10014065-39 = "Сюжет закручивается!"
10014065-40 = "Серьёзно! Тебе вообще не стыдно так говорить?"
10014065-41 = "Сейчас тебе кажется, что это круто, но потом пожалеешь!"
10014065-42 = "...? Сейчас? Она?"
10014065-43 = "По-моему, ей на самом деле очень нравится быть бандиткой."
10014065-44 = ""
10014065-46 = ""
10014065-47 = ""
10014065-48 = "...Ага."
10014065-49 = "Ненавижу это... Это какой-то бесконечный кошмар?"
10014065-50 = ""
10014065-52 = ""
10014065-53 = "Да ладно, не парься по мелочам! Пойдём наваляем бандитам!"
10014065-54 = "С нами Сенсей. Будет проще простого."
10014065-55 = "С-Сенсей, пожалуйста, будьте осторожны!"
10014065-56 = "[s5] «Вперёд, Банда сладкоежек после уроков!»\n[s6] «Пойдём спасать Рейсу!»"
10014065-59 = "В АТА-А-АКУ!"
10014065-60 = "Д-Да!"
