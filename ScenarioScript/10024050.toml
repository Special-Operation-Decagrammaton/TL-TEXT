[translation]
10024050-1 = "Эпизод 5;Один раз научили — трижды усвоил"
10024050-2 = "Сад Цветущей Сливы"
10024050-3 = ""
10024050-4 = "72, 53, 81, 48..."
10024050-5 = "Фух, с проверкой закончено! Надо бы размяться..."
10024050-6 = "Эх... Хотелось бы, чтобы дети больше учились..."
10024050-7 = "Я ведь даже не делала тест особо сложным, но всё равно есть дети, которым придётся пересдавать!"
10024050-8 = "Уже представляю, как Шун снова будет приставать ко мне из-за сложности тестов..."
10024050-9 = ""
10024050-12 = ""
10024050-13 = ""
10024050-15 = "Добрый день, маленький инструктор. Давненько не виделись."
10024050-16 = "Президент Руми? Привет!"
10024050-17 = "Но, эм, «маленький» инструктор? У меня вообще-то есть имя!"
10024050-18 = "А, прости. Маленькая Кокона, как поживаешь?"
10024050-19 = ""
10024050-21 = ""
10024050-22 = ""
10024050-23 = ""
10024050-24 = ""
10024050-25 = "(«Маленькая Кокона» ничем не лучше...)"
10024050-26 = "(Но я взрослая! Я могу не обращать внимания!)"
10024050-27 = ""
10024050-29 = "У меня всё хорошо! Учить детей — дело хлопотное."
10024050-30 = "Это замечательно, Кокона. Просто замечательно. Если что-нибудь понадобится, сразу говори, хорошо?"
10024050-31 = "Надеюсь, мы не отвлекаем вас от работы, Инструктор Кокона."
10024050-32 = "О, н-нет. Совсем не отвлекаете! Добро пожаловать!"
10024050-33 = "Просто, эм... Очень необычно видеть людей из Променада Чёрной Черепахи и Генрюмон вместе."
10024050-34 = "Так вот насчёт этого..."
10024050-36 = "Хорошо, что ты заговорила! Держись подальше от этих плохих девчонок. Они плюют на традиции и постоянно устраивают неприятности."
10024050-37 = "А этих хулиганок я бы тоже избегала. Они отгораживаются от мира, а потом цепляются ко всем, кто не делает то же самое."
10024050-38 = ""
10024050-41 = ""
10024050-43 = "...Хватит с тебя. У меня хотя бы есть принципы."
10024050-44 = "Не указывай мне, Генрюмон. Это не твоя территория."
10024050-46 = "А-ха... Хахаха..."
10024050-47 = "[s] «Бедная Кокона. От ваших перепалок у неё уже паническая атака.»"
10024050-48 = "Ц."
10024050-49 = "Хмф."
10024050-51 = "Спасибо, Сенсей. Хорошо выручили."
10024050-52 = "Вообще-то у нас есть причина для визита, Кокона..."
10024050-53 = ""
10024050-56 = ""
10024050-58 = "[ns] «В последнее время тебя не просили перевезти какие-нибудь странные коробки?»"
10024050-59 = "Странные коробки? Не думаю..."
10024050-60 = "О... Вообще-то...!"
10024050-61 = "Попадание, да?"
10024050-63 = "Да! Один студент действительно просил меня доставить кому-то за пределами академии коробку с ингредиентами Променада Чёрной Черепахи!"
10024050-64 = "...Конечно же, она была с Променада Чёрной Черепахи."
10024050-65 = "Хватит делать поспешные выводы! Инструктор Кокона, как выглядел этот студент?"
10024050-67 = "Я не успела хорошо рассмотреть... Думаю, она была больна, потому что носила маску."
10024050-68 = "Значит, скрывала личность. Очевидный трюк Променада Чёрной Черепахи!"
10024050-69 = "О? И почему же?"
10024050-70 = "Променад Чёрной Черепахи готов на всё ради ингредиентов, верно?"
10024050-71 = "Ну... Этого я отрицать не могу..."
10024050-73 = "Но если бы кто-то из наших делал нечто настолько незаконное, что пришлось скрывать лицо, я бы об этом услышала."
10024050-74 = "Вот это интересно. Не Руми, а ты?"
10024050-75 = "Ну... скажем так, Рэйдзё действительно выполняет немалую часть нашей «полевой» работы."
10024050-76 = "Она ещё ничего не пропустила. Я за неё ручаюсь."
10024050-78 = "О! И учеников Сада сливовых цветов в последнее время просили выполнять какие-то странные поручения."
10024050-80 = "Студентов?!"
10024050-82 = "Ты имеешь в виду... детей?!"
10024050-83 = "Здесь странные координаты. Должно быть, где-то в Руинах."
10024050-84 = "Эм... В общем, мы часто поручаем детям небольшие доставки и другие дела для других студентов. Это хорошая практика реальной жизни."
10024050-85 = "Но в последнее время... нас начали просить доставлять вещи людям за пределами академии."
10024050-86 = "Вы ведь не принимали эти поручения?"
10024050-87 = "А? Ну да... Это не звучало опасно, а студенты, просившие о помощи, сказали, что присмотрят за нашими детьми."
10024050-88 = "Один раз я даже пошла с ними, просто чтобы убедиться. Всё выглядело нормально."
10024050-90 = "В любом случае... кто в Кивотосе посмеет тронуть студентов Сада сливовых цветов?"
10024050-91 = ""
10024050-94 = ""
10024050-95 = "...Отвратительно."
10024050-96 = "Хм? Ты что-то сказала?"
10024050-97 = "Неважно. Спасибо, что уделили время, Инструктор Кокона. Сенсей?"
10024050-98 = "[s] «А, точно. Спасибо за ваше время!»"
10024050-100 = ""
10024050-104 = "А-а? Что? Уже уходите?"
10024050-106 = ""
10024050-110 = "Улицы Шаньхайцзина"
10024050-111 = ""
10024050-112 = "Хорошая мысль, Рэйдзё. Такое лучше не обсуждать перед детьми."
10024050-113 = "...Я просто хотела защитить их от выражения лица офицера Мины."
10024050-114 = "Использовать невинных детей вот так..."
10024050-115 = ""
10024050-117 = ""
10024050-118 = ""
10024050-119 = ""
10024050-120 = "У них вообще стыда нет?!"
10024050-121 = "Я их найду! И раздавлю! Если понадобится — всей мощью Генрюмон!"
10024050-122 = ""
10024050-125 = ""
10024050-126 = "[ns] «Может, сделаешь несколько глубоких вдохов?»"
10024050-127 = "Вы ждёте, что я просто спущу это с рук, Сенсей?"
10024050-129 = "Никто этого не предлагает, но давай на минуту подумаем."
10024050-130 = "Было бы здорово собрать всю мощь Генрюмон, как ты сказала."
10024050-131 = "Но насколько я знаю, даже Кисаки не может этого сделать."
10024050-132 = "Что ты знаешь о президенте?"
10024050-133 = "Скажем так, мы с ней знаем друг о друге ровно столько, сколько должны."
10024050-134 = "Что это вообще значит...?"
10024050-135 = "[s] «Что бы мы ни делали дальше, нужно убедиться, что поймаем настоящих виновников.»"
10024050-137 = "Хорошая мысль, Сенсей."
10024050-138 = "В крупных организациях довольно часто всю вину и ответственность сваливают на членов низшего ранга."
10024050-139 = "Я даже видела такое на Променаде Чёрной Черепахи."
10024050-140 = "Это потому, что ты даёшь подчинённым слишком много свободы."
10024050-141 = "Должны быть строгие правила, которым следуют все члены группы. Без исключений."
10024050-142 = "Ага, настолько строгие, что вы не способны подстроиться под время."
10024050-143 = "Когда жизнь подкидывает неожиданные проблемы, наши люди достаточно гибкие, чтобы реагировать."
10024050-144 = "И как ты называешь обман бедных детей из Сада сливовых цветов? Гибкостью?"
10024050-145 = "Да пойми ты наконец! Мы вообще не имели к этому отношения!"
10024050-146 = "И у тебя всё равно нет никаких конкретных доказательств."
10024050-147 = "Вот поэтому нам и нужно работать вместе. Собирать доказательства и найти настоящего виновника."
10024050-148 = "Мы не меньше тебя злимся из-за того, что Сад сливовых цветов втянули во всё это."
10024050-150 = "И что ты будешь делать, когда я докажу, что за всем этим всё-таки стоял Променад Чёрной Черепахи?"
10024050-151 = "Я лично возьму ответственность. Закрою Променад, распущу наших членов — что угодно."
10024050-152 = "Президент!"
10024050-154 = "Не волнуйся. Даже если мы потеряем всё, всегда сможем начать заново."
10024050-155 = "К тому же я не думаю, что Генрюмон устроит что-то меньшее, чем абсолютная уверенность."
10024050-156 = "Итак, Сенсей, какой наш следующий ход?"
10024050-157 = ""
10024050-160 = ""
10024050-162 = "[ns] «Пора поставить ловушку.»"
10024050-163 = "Ловушку?"
