[translation]
83300200200-5 = ""
83300200200-6 = "Фух. Что это всё такое?"
83300200200-7 = "Могли хотя бы предупредить, прежде чем требовать столько всего!"
83300200200-8 = "Им вообще плевать, сколько проблем они нам создают..."
83300200200-9 = "Именно!!! Почему они так с нами? Мы ведь стараемся изо всех сил!"
83300200200-10 = "Уф... Что же делать...?"
83300200200-11 = ""
83300200200-13 = ""
83300200200-15 = ""
83300200200-16 = "Фуука? Прошу прощения, я хотела бы кое-что у тебя спросить."
83300200200-17 = "А? Глава префектов? Чем могу помочь?"
83300200200-18 = "Мне сказали, ты можешь что-нибудь рассказать о Вечеринке Геенны."
83300200200-19 = "А-а... Вечеринка Геенны..."
83300200200-20 = "Так это как раз наша проблема!"
83300200200-21 = "Нам никогда ещё не приходилось справляться с настолько огромным заказом..."
83300200200-22 = "Что за заказ?"
83300200200-23 = "Нам дали безумный приказ всего за пять дней приготовить достаточно еды для всей Вечеринки Геенны!"
83300200200-24 = "Это просто слишком много!"
83300200200-25 = "И они не просто отдали заказ и позволили нам самим с ним разбираться..."
83300200200-26 = "Они ещё и навязали нам целую гору ингредиентов, которых мы вообще не просили! Вон там всё сложено!"
83300200200-28 = "Ингредиенты?"
83300200200-29 = "Уф, они заявили, что еда для вечеринки — само собой обязанность Клуба школьных обедов, хотя мы раньше никогда её не обслуживали!"
83300200200-30 = "Почему мы должны всё это делать? Мы тоже заслуживаем отдых на День святого Валентина!"
83300200200-31 = "Да!!! Дайте Фууке отдохнуть!"
83300200200-32 = "Но... Фуука, не волнуйся! Даже если они не уступят!"
83300200200-33 = "Даже если мне придётся приготовить всю еду самой... Я буду стараться, чтобы ты смогла отдохнуть!"
83300200200-34 = "Эм, Джури, я очень тебе благодарна... Но если мы так сделаем, случится нечто невероятное..."
83300200200-35 = ""
83300200200-37 = ""
83300200200-38 = ""
83300200200-39 = "(...Клуб школьных обедов получил огромный заказ на кейтеринг, а вместе с ним против своей воли — громадное количество ингредиентов.)"
83300200200-40 = ""
83300200200-42 = "Фуука, ты не против, если я осмотрю те ингредиенты, о которых ты говорила?"
83300200200-43 = "Хм? Конечно, они вон там. Главе префектов я могу доверить свою кухню."
83300200200-44 = "Рада это слышать, но выходит, есть люди, которым доверять нельзя?"
83300200200-45 = "Ну... Общество гурманов любит устраивать набеги за ингредиентами всякий раз, когда приходит новая поставка. Иногда берут нас в заложники и заставляют готовить. А когда гурманы узнают о новом блюде, вообще сходят с ума...!"
83300200200-46 = "...Звучит тяжело."
