[translation]
1008503-1 = "Глэмпинг"
1008503-3 = "Работа Шале снова привела меня в Миллениум. Я решил заглянуть в клубную комнату Веритас и проведать Харэ."
1008503-4 = ""
1008503-8 = "Хакерская комната Веритас"
1008503-10 = "[ns1] «Ты здесь, Харэ?»\n[ns2] «Я принёс Frenzy MAX со вкусом маракуйи!»"
1008503-11 = ""
1008503-12 = ""
1008503-16 = "[ns3] «Ух ты, тут мороз!»\n[ns4] «Кондиционер работает в такую погоду?»"
1008503-17 = ""
1008503-18 = ""
1008503-22 = ""
1008503-23 = "Немного рановато. До готовности ещё далеко."
1008503-24 = "Прости. Я ходила за посылкой."
1008503-25 = ""
1008503-27 = ""
1008503-28 = "Это энергетик со вкусом маракуйи?"
1008503-29 = "Я как раз хотела пить. Спасибо, что принесли."
1008503-30 = "[s5] «Без проблем.»\n[s6] «Кстати, кажется, ты оставила кондиционер включённым...»"
1008503-33 = "Не волнуйтесь за кондиционер. Так и задумано."
1008503-34 = "Я гоняю серверный компьютер в клубной комнате на максимальной нагрузке, тестируя его новые высокоскоростные облачные вычисления."
1008503-35 = "Даже малейший скачок температуры может обрушить производительность сервера, поэтому я охлаждаю комнату кондиционером."
1008503-36 = "Знаю, здесь очень холодно, но надеюсь, вы поймёте."
1008503-37 = "[s7] «Для меня это не проблема...»\n[s8] «Но ты сможешь работать при такой температуре?»"
1008503-40 = "Да. За меня можете не беспокоиться."
1008503-41 = "Как раз для такого случая я одолжила немного походного снаряжения у вице-президента."
1008503-42 = ""
1008503-44 = ""
1008503-45 = ""
1008503-46 = "Ветровка, портативная электрическая грелка для рук... о, а это утеплённое одеяло просто обязательно!"
1008503-47 = "Я даже принесла консервированный суп и лапшу быстрого приготовления, чтобы согреваться."
1008503-48 = "Иными словами... сегодня хакерская гостиная Веритас превращается в..."
1008503-50 = "Базовый лагерь для глэмпинга!"
1008503-51 = ""
1008503-54 = "[ns] «Глэмпинг?»"
1008503-55 = "Да. Разве я не упоминала об этом в MomoTalk?"
1008503-56 = "Глэмпинг — это все плюсы кемпинга без утомительных вещей вроде установки палатки или перетаскивания снаряжения."
1008503-57 = "Технически мы используем походное снаряжение прямо здесь, в клубной комнате. Так что, думаю, это тоже можно считать разновидностью глэмпинга."
1008503-58 = "Если я справлюсь с глэмпингом здесь, думаю, смогу потом попробовать и на природе вместе с Чихиро."
1008503-59 = "Пусть на первый взгляд это не особо отличается от нашего обычного обустройства..."
1008503-60 = "...это подготовка к будущим вылазкам на природу!"
1008503-61 = "[s] «Вывод звучит немного натянуто...»"
1008503-62 = "Как бы то ни было, раз уж я одолжила всё это снаряжение, буду отдыхать так, будто я в настоящем лагере."
1008503-63 = ""
1008503-65 = ""
1008503-66 = "Для начала банка Frenzy MAX..."
1008503-67 = ""
1008503-69 = ""
1008503-70 = ""
1008503-71 = "А-а-а... кемпинг и холодный напиток... назовите дуэт лучше!"
1008503-72 = "Ну что, приступить к настройке сервера?"
1008503-76 = "Я наблюдал, как Харэ работает из своего кокона из одеяла."
1008503-79 = "Мм, вот эта часть сложная."
1008503-80 = "Нужно настроить параметры, которые автоматически увеличивают мощность этого узла при перегрузке..."
1008503-81 = ""
1008503-83 = ""
1008503-84 = "*глоть*"
1008503-85 = "[s9] «Эм, Харэ...»\n[s10] «Ты собираешься что-нибудь делать с этой горой банок на столе?»"
1008503-86 = ""
1008503-87 = ""
1008503-89 = ""
1008503-90 = "...Хм? Банок...?"
1008503-91 = "А? Я всё это выпила?!"
1008503-92 = "[s11] «Не хочу ворчать...»\n[s12] «Но, может, уберёшь весь этот мусор со стола?»"
1008503-95 = "Мм... Стоило бы."
1008503-96 = "Но я как раз вошла в поток, пока чиню этот узел. Если сейчас отвлечься на мусор, могу сбиться..."
1008503-97 = ""
1008503-99 = ""
1008503-100 = "Точно. Я ведь сейчас как будто в кемпинге?"
1008503-101 = "А в кемпинге мусор всегда собирают в одном месте."
1008503-102 = "Обещаю, в самом конце я вынесу все банки. Так что до тех пор можешь закрыть на это глаза?"
1008503-103 = "[s] «Ну, если ты так говоришь...»"
1008503-104 = "Хи-хи. Я знала, что вы поймёте."
1008503-105 = "А теперь обратно к обновлению этого узла..."
1008503-111 = "Но ленивый кемпинг Харэ только начинался..."
1008503-115 = "Хи-хи. Лапша из стаканчика такая вкусная, когда ешь её прямо из спального мешка."
1008503-116 = "Почти как завтрак в постели... Кажется, у меня появилось новое маленькое удовольствие."
1008503-117 = ""
1008503-119 = ""
1008503-120 = ""
1008503-122 = "*зевок*"
1008503-123 = "Кажется, меня наконец накрывает после всех этих энергетиков..."
1008503-124 = "Или это потому, что меня одновременно обдувает кондиционер и греет уютный спальный мешок. Глаза еле держатся открытыми..."
1008503-128 = "Угх... Думаю, этого хватит."
1008503-129 = "Теперь осталось только дождаться завершения анализа данных..."
1008503-130 = "Может, пока вздремнуть."
1008503-131 = "Сенсей, можете выключить свет?"
1008503-132 = "В спальном мешке так тепло. Не хочу вылезать..."
1008503-133 = ""
1008503-136 = ""
1008503-138 = ""
1008503-139 = ""
1008503-140 = "С-Сенсей? Что случилось? У вас такое лицо, что мне страшно..."
1008503-141 = ""
1008503-145 = "[ns] «Просыпайся!»"
1008503-146 = ""
1008503-148 = ""
1008503-149 = "Ч-что?!"
1008503-150 = "[s13] «Я думал, что смогу это перетерпеть. Но явно нет.»\n[s14] «Этот домашний кемпинг сделал тебя ещё ленивее обычного!»"
1008503-153 = "[ns] «Хватит! Пора проснуться и почувствовать запах зарядки!»"
1008503-154 = "Н-Но сегодня день глэмпинга! Я не хочу—"
1008503-155 = "...Что? Кардио согреет меня лучше спального мешка? Это ложь!"
1008503-156 = "Если я слишком сильно устану от упражнений, как потом программировать? Я же думать не смогу!"
1008503-157 = "Я-я слышала об исследовании, что интеллектуальные занятия вроде программирования вообще-то сжигают много калорий—"
1008503-158 = ""
1008503-162 = "Пожалуйста, Сенсей! Я учёная, а не спортсменка! Я не хочу на пробежку! Сенсей!!"
1008503-163 = ""
1008503-168 = "Я вывел Харэ на лёгкую пробежку вокруг академии. Она поклялась больше никогда не устраивать глэмпинг в клубной комнате."
