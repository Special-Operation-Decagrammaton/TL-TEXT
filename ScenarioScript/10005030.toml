[translation]
10005030-1 = "Эпизод 3;Безжалостный допрос"
10005030-2 = "Мы вернулись в каюту и подошли к охраннице в костюме кролика, которая всё ещё была связана и без сознания."
10005030-3 = ""
10005030-6 = ""
10005030-7 = "М-мм... Мм?"
10005030-9 = "...! Ай!"
10005030-10 = "Ч-Что? Что происходит?"
10005030-12 = "Хм. Она довольно быстро очнулась."
10005030-13 = "Я рада. Она довольно крепкая, так что допрос будет замечательным."
10005030-14 = "Пожалуйста, не пугай её ещё до того, как мы начали."
10005030-15 = "Не слушай их. Пока отвечаешь на наши вопросы, с тобой ничего не случится."
10005030-17 = "Ничего не случится?! Вы уже вырубили меня, связали и заперли здесь!"
10005030-18 = "Кто вы? Из какой школы? Вам нужны деньги?"
10005030-19 = "Думаете, вам это сойдёт с рук?"
10005030-20 = "...А?!"
10005030-21 = "Это что, угроза? Я тебя в лепёшку раскатаю!"
10005030-22 = "И-Ик!"
10005030-23 = "Е-Если вам нужны деньги, я ничем не помогу! Я всего лишь мелкая сошка!"
10005030-25 = "Хи-хи, мы прекрасно знаем, что ты мелкая сошка."
10005030-26 = "Но не забивай этим свою хорошенькую головку."
10005030-27 = "Мы просто ищем подругу."
10005030-29 = "Подругу? Ч-Что вы имеете в виду?"
10005030-30 = "Её зовут Белая..."
10005030-31 = "Куросаки Коюки. Она должна была прибыть несколько дней назад. Ты что-нибудь знаешь?"
10005030-32 = "А? Я-я никогда о ней не слышала!"
10005030-33 = "Думаешь, можешь прикинуться дурочкой?"
10005030-34 = "Если ты врёшь, у меня как раз руки чешутся на ком-нибудь сорваться."
10005030-35 = "П-Подождите! Стойте, прекратите!"
10005030-36 = "Я-я клянусь! Я понятия не имею, о чём вы! Честно!"
10005030-37 = "Каждый день сюда приходят тысячи людей играть в розыгрыше!"
10005030-38 = "Я бы никогда не запомнила все их лица, не говоря уже об одном имени!"
10005030-39 = "Это лицо всё сильнее просит кулака."
10005030-40 = "А-а-а-а-а!"
10005030-41 = "П-Пожалуйста! Я не вру!"
10005030-42 = "[s1] «Думаю, она правда не знает.»\n[s2] «Нэру. Без насилия.»"
10005030-43 = "Уф!"
10005030-44 = "Уф!"
10005030-45 = "Считай, тебе повезло. Серьёзно, очень повезло."
10005030-46 = "Вы правда думаете, что я сейчас чувствую себя везучей?!"
10005030-48 = "Но она права. Она всего лишь охранница."
10005030-49 = "И даже если бы она была начальницей, она всё равно не знала бы имя случайного пассажира."
10005030-50 = "Что ж, неловко вышло."
10005030-51 = "[s3] «Почему бы не описать её?»\n[s4] «Есть в ней что-нибудь особенно приметное?»"
10005030-52 = "А! Хорошая идея."
10005030-53 = "А! Хорошая идея."
10005030-54 = "Как и ожидалось от Сенсея. Описание внешности может освежить ей память."
10005030-55 = "А Белая Кроличка очень выделяется. Очень."
10005030-56 = "Эй, уши у тебя есть, да? Я сейчас опишу её, так что слушай внимательно."
10005030-57 = "Попробуешь финтить — у меня палец на спуске чешется! Поняла?!"
10005030-59 = "Ик!"
10005030-60 = "Не думаю, что простое описание передаст всё как следует. Лучше взгляни на эту фотографию."
10005030-61 = ""
10005030-63 = ""
10005030-64 = "Вот так выглядит наша подруга."
10005030-65 = "Она шумная, и голос её слышно за километр. Из тех, кто сразу перетягивает всё внимание на себя."
10005030-66 = "Наверняка вела себя легкомысленно и была самым грубым человеком, которого ты встречала. Никого такого не помнишь?"
10005030-67 = ""
10005030-69 = ""
