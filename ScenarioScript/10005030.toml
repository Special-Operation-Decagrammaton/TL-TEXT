10005030-109 = "[s7] «Ты, Карин?»\n[s8] «У тебя что-то есть на уме?»"
10005030-110 = "Да, думаю, мой метод может сработать."
10005030-111 = "Да, думаю, мой метод может сработать."
10005030-112 = "Поверьте мне. Никто не пострадает, и, думаю, в конце все будут смеяться."
10005030-113 = "Все будут смеяться...?"
10005030-114 = "Это вообще возможно в такой ситуации?"
10005030-115 = "Позволите попробовать, Сенсей?"
10005030-116 = "[s9] «Я буду рад, если всё закончится смехом.»\n[s10] «Конечно. Давайте решим всё мирно.»"
10005030-117 = "Спасибо, Сенсей. В таком случае..."
10005030-118 = "Спасибо, Сенсей. В таком случае..."
