10005030-97 = "Сенсей."
10005030-98 = "[s5] «Точно. Нэру, помнишь про отсутствие насилия?»\n[s6] «Нэру, давай сначала обдумаем варианты.»"
10005030-99 = "...А?"
10005030-100 = "...А?"
