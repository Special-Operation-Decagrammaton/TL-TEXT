10005030-77 = "*ахает*"
10005030-78 = "Она сказала! Она сказала «А»!"
10005030-79 = "Ахахаха! Попалась!"
10005030-80 = "Н-Нет! Я не знаю! Ничего не знаю. Ноль! Ничего! И даже если бы знала, я не могу разглашать информацию о клиентах!"
10005030-81 = "Хи-хи-хи! Она точно что-то знает, точно!"
10005030-82 = "Её реакция выдаёт её с головой."
10005030-83 = "Итак, как же нам это из неё вытянуть?"
10005030-84 = ""
10005030-86 = ""
10005030-87 = ""
10005030-88 = "...!"
10005030-89 = "П-Пожалуйста! Хватит! Б-Больше не надо! Я против насилия. Против!"
10005030-90 = "Я уже задолбалась сидеть взаперти на этой дурацкой скрытной миссии. Наконец-то хоть какое-то действие."
10005030-91 = "Не радуйся раньше времени, ладно? Я буду о-очень разочарована."
10005030-92 = "И если хоть на секунду почувствуешь обиду... Помни: ничего этого не было бы, если бы ты просто заговорила."
