10005030-102 = "И вообще, в такой работе нужно быть готовой к подобному."
10005030-103 = "У вас есть идея получше? Она явно не собирается говорить."
10005030-104 = "Мы торопимся! Давайте уже покончим с этим!"
10005030-105 = "Подождите."
10005030-106 = "Позволите мне попробовать?"
10005030-107 = "А?!"
