[translation]
1300808-1 = "Неожиданная удача"
1300808-2 = "(У нас была запланирована ночная смена в магазине, но нас отпустили раньше.)"
1300808-4 = "Ух ты, сегодня нам повезло, Сенсей!"
1300808-5 = "Я готовилась торчать почти всю ночь, но покупателей было так много, что у магазина закончились товары."
1300808-6 = "Нет ничего лучше полной оплаты И раннего ухода!"
1300808-7 = "Приятное разнообразие, правда, Сенсей?"
1300808-8 = "[s] «Ещё бы.»"
1300808-9 = "Этот район всегда такой оживлённый. Здесь много вещей, которых в Абидосе не увидишь..."
1300808-10 = "Смотрите, такояки! И жареный кальмар!"
1300808-11 = "А вон там продают смешные маски."
1300808-12 = "[s] «Хочешь немного осмотреться?»"
1300808-13 = "А-А?"
1300808-14 = "П-Посмотреть? Только вдвоём?"
1300808-15 = "..."
1300808-16 = "[s] «Если не хочешь, можем идти домой.»"
1300808-17 = "Я-я не говорила, что не хочу!"
1300808-18 = "Не каждый день нас отпускают пораньше. Б-Было бы жалко сразу возвращаться..."
1300808-19 = "Иногда всем нужно расслабляться и веселиться, знаете?"
1300808-20 = "Ладно, тогда..."
1300808-21 = ""
1300808-22 = ""
1300808-23 = "(Серика обхватила мою руку.)"
1300808-24 = "..."
1300808-25 = "Ч-Что? Вы ведь не против?"
1300808-26 = "[s1] «То есть...»\n[s2] «Просто...»"
1300808-27 = "Стоп! Ничего не говорите!"
1300808-28 = "Стоп! Ничего не говорите!"
1300808-29 = "...Хи-хи."
1300808-30 = "Ладно! Сначала пойдём посмотрим вон туда! ♪"
1300808-32 = "(Мы с Серикой поели жареного кальмара, кукурузы с соевым соусом, печёной картошки и такояки, а потом разглядывали витрины всех магазинов.)"
1300808-33 = "(Домой мы добрались только на рассвете.)"
