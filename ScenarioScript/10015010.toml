[translation]
10015010-1 = "Эпизод 1;Мейстер «Миллениума»"
10015010-2 = "Промышленная лаборатория Миллениум"
10015010-3 = "Давайте пройдёмся по списку Юки. Первым делом..."
10015010-4 = "...отремонтировать повреждённого робота-болельщика."
10015010-5 = "Сразу предупрежу: Юука сильно преуменьшила масштабы. Повреждения совсем не незначительные."
10015010-6 = "На этом этапе, возможно, проще будет собрать его заново с нуля."
10015010-7 = "[s] «...К завтрашнему утру?»"
10015010-8 = "Знаю, знаю. Но для этой сложной задачи я позвала лучших из лучших."
10015010-9 = "Наших местных технологических мейстеров..."
10015010-10 = "Инженерный отдел!"
10015010-11 = ""
10015010-16 = ""
10015010-17 = "Мы знаем о механизмах всё от и до! Кстати, вы знали, что первая машина была создана..."
10015010-18 = "Чтобы починить робота-болельщика, нам не нужна история промышленной революции, Котори."
10015010-19 = "Понадобится много ресурсов, но я оцениваю ремонт примерно в полдня."
10015010-21 = "Большое спасибо, что пришли так быстро."
10015010-22 = "Раз вы взялись за дело, мои тревоги буквально растворились в атмосфере."
10015010-23 = "Мы вас не подведём."
10015010-24 = "Инженерный отдел гордится тем, что мы студенты «Миллениума». Мы поможем всем, чем сможем."
10015010-25 = "Если честно, нас немного удивило, что «Семинар» не обратился к нам раньше."
10015010-26 = "Если бы робота-болельщика делали мы, он бы прямо сейчас размахивал помпонами. Какой-то жалкий взрыв даже царапины бы на нём не оставил."
10015010-28 = "..."
10015010-30 = "Вы серьёзно говорите мне это после нескольких последних поставок, которые прислали нам?"
10015010-31 = "Последних поставок... А, тех деталей, которые вы заказывали?"
10015010-32 = "Всё, что сделано Инженерным отделом, по определению не может быть бракованным."
10015010-33 = "«Бракованным» — возможно, слишком сильное слово. Но они определённо были... своеобразными. И причиняли ущерб."
10015010-34 = "Например, гигантское сверло, которое вы установили в кофемашину в комнате отдыха «Семинара»..."
10015010-36 = "Т-технически это была кофемолка, а не сверло."
10015010-37 = "Мы решили: чем прочнее лезвие, тем лучше! Поэтому сделали его твёрдым как алмаз, чтобы оно могло за раз перемалывать уйму кофейных зёрен!"
10015010-38 = "Это было сверло. А как насчёт огнемёта в автоматическом пылесосе? Как вы это объясните?"
10015010-39 = "У пылесосов есть ограничения. Бывают загрязнения, с которыми им просто не хватает огневой мощи."
10015010-40 = "Моё изобретение должно было учитывать как можно больше возможных сценариев. Поэтому я добавила огнемёт, чтобы сжигать любые горючие материалы, с которыми пылесос не справится."
10015010-41 = "Ладно, признаю, этот мне даже немного понравился. Но Юке — совершенно и категорически нет."
10015010-42 = "Ещё ей совсем не понравилось считать расходы на ремонт огромной дыры в стене, которую проделала ваша «кофемолка»."
10015010-43 = "Большой риск — большая награда."
10015010-44 = "Такова цена прогресса! А страх провала или банкротства — наш враг!"
10015010-45 = "Да-да. Я в целом согласна, но если Юука это услышит, она наверняка накажет нас квитанциями и бухгалтерскими книгами. Так что лучше не будем делиться этим со всем классом."
10015010-47 = "Начинаю диагностику повреждений."
10015010-48 = "Ох-ох. Посмотрите на эту ось... Ударная волна от взрыва полностью её уничтожила. Я думала, хотя бы один-два шарнира удастся спасти."
10015010-49 = "Плата сгорела. Придётся паять новую с нуля."
10015010-50 = "Вы сказали, это был несчастный случай? Повреждения будто специально сосредоточены на самых сложных для ремонта деталях. Я бы ожидала куда более равномерного ущерба."
10015010-51 = "Мне трудно поверить, что это просто неудачный научный эксперимент."
10015010-53 = "У меня есть подозрения, но у нас нет ни доказательств, ни времени на расследование."
10015010-54 = "Разберёмся с этим после того, как фестиваль успешно завершится."
10015010-55 = "Ну? Сколько времени?"
10015010-56 = "Если ремонтировать, успеем прямо к церемонии открытия."
10015010-57 = "Но если собрать нового с нуля, по моим расчётам понадобится около трёх часов."
10015010-58 = "Правда? Думаете, лучше полностью собрать заново?"
10015010-59 = "Мне, в общем-то, всё равно, каким способом, лишь бы в итоге у меня был робот-болельщик. Но насколько дороже это обойдётся?"
10015010-60 = "Ни насколько! У нас как раз есть отличные материалы для модификации танков, которые мы—"
10015010-61 = ""
10015010-63 = ""
10015010-64 = ""
10015010-65 = ""
10015010-66 = "Кхм! То есть... Инженерный отдел всегда готов предоставить любые нужные детали!"
10015010-67 = "Что ж, я рада видеть, что вы так увлечены этим."
10015010-68 = "В целом я не против... если смогу задать несколько требований."
10015010-70 = "Требований? Каких именно?"
10015010-71 = "Пусть заказ и срочный, но это всё равно изделие, которое «Семинар» заказывает у Инженерного отдела."
10015010-72 = "Как заказчик, я могу попросить кое-что добавить, верно?"
10015010-73 = "...В разумных пределах."
10015010-74 = "Во-первых, он должен быть прочным. Очень прочным."
10015010-75 = "Учитывая ужасный конец первого робота-болельщика, я бы очень не хотела, чтобы этого постигла та же судьба."
10015010-76 = "Об этом даже просить не нужно. Если робот не выдерживает пару ударов, значит, его делал не Инженерный отдел."
10015010-77 = ""
10015010-79 = ""
10015010-80 = ""
10015010-81 = "О! О! А что если сделать композитную броню, добавив к оцинкованной стали керамику?"
10015010-82 = "Это сработает, но ему ещё нужно болеть за спортсменок. Нельзя утяжелять его слишком большим количеством деталей."
10015010-83 = "Знаю. А если сделать структуру однороднее прокаткой стали?"
10015010-85 = "Дальше — он должен передвигаться по любой местности."
10015010-86 = "Обычных колёс недостаточно: по лестницам и склонам он не проедет. Он должен перемещаться так же свободно, как студент «Миллениума»."
10015010-88 = "Это чуть сложнее, но ничего такого, с чем мы бы не справились."
10015010-89 = ""
10015010-90 = ""
10015010-91 = "А если дать ему ноги, как у собаки? А-а, нет, не получится. Слишком много времени уйдёт на калибровку движений и нормальную ходьбу."
10015010-92 = "Можно просто использовать гусеницы."
10015010-93 = "Колёса у робота останутся, а гусеницы дадут ему сцепление, чтобы карабкаться через любые препятствия."
10015010-94 = "[s] «У меня очень плохое предчувствие...»"
10015010-96 = "И последнее, но самое важное... Закончите к сроку."
10015010-97 = "К сроку?"
10015010-98 = "Уверена, вы прекрасно понимаете, что спортивный фестиваль начинается завтра."
10015010-99 = "Я понимаю, что время разработки напрямую связано с качеством, но качество бесполезно, если изделие не готово тогда, когда оно нужно."
10015010-100 = "Пожалуйста. Мы профессионалы. Мы никогда не срываем сроки."
10015010-101 = "Честь Инженерного отдела на кону — мы создадим идеального робота-болельщика и ещё останется куча времени."
10015010-102 = "Я вам верю. Рассчитываю на вас."
10015010-103 = "[s] «Я могу чем-нибудь помочь?»"
10015010-104 = "Не нужно. Разработка роботов — наша специализация."
10015010-106 = "И мы работаем с множеством опасных и острых инструментов, Сенсей! Нужно идеально знать, как ими пользоваться. Если хотите, рекомендую начать с небольшой литературы! Лично я—"
10015010-107 = "Короче говоря, идите помогите тому, кому помощь действительно нужна."
10015010-109 = "Тогда оставим вас работать."
10015010-110 = "Помните — через три часа! Надеюсь, ремонт..."
10015010-111 = "То есть, надеюсь, робот к тому времени будет готов к выдаче."
10015010-112 = ""
10015010-117 = ""
10015010-118 = "Хи-хи! Давненько «Семинар» не заказывал у нас роботов."
10015010-119 = "И не просто робота, а очень важного! Робота-болельщика, которым будут восхищаться все студенты Кивотоса на единственном и неповторимом Фестивале Хало!"
10015010-120 = "Давайте испытаем на нём всё новое, что мы недавно сделали!"
10015010-121 = "Да-да. А как насчёт гиродатчика? Мы ещё не успели проверить его стабильность."
10015010-122 = "Не будем забегать вперёд."
10015010-123 = "Прежде чем начнём, я хочу, чтобы вы внимательно меня выслушали."
10015010-124 = ""
10015010-125 = ""
10015010-126 = "Фестиваль Хало в Кивотосе — мероприятие для всего региона, которое проводится раз в два года..."
10015010-127 = "«Семинар» без конца работал, чтобы это событие не просто состоялось, но и превзошло ожидания всего Кивотоса."
10015010-128 = "Я никогда не откажусь от нашей миссии технологического прогресса. Но наши амбиции не должны свести усилия «Семинара» на нет. Ни в коем случае."
10015010-129 = "Поэтому наша сегодняшняя задача — не изменить мир, а создать робота-болельщика, которым «Семинар» будет гордиться."
10015010-130 = "Уф... Она права! Ничего не поделаешь!"
10015010-131 = "Ты говоришь так, будто мы какие-то безумные изобретатели-социопаты без капли здравого смысла..."
10015010-132 = "...но я поняла. Ладно."
10015010-133 = "Спасибо за понимание."
10015010-134 = "А теперь начнём с чего-нибудь простого."
10015010-135 = "Я вот думаю... Как насчёт пятнадцатимиллиметрового пулемёта спереди?"
10015010-137 = ""
10015010-138 = "Есть, госпожа!"
