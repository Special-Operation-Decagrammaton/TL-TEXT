[translation]
10043090-1 = "Эпизод 9;Подведение итогов тренировки"
10043090-2 = "После той славной победы..."
10043090-3 = "...мир продолжил вращаться, и мы не заметили, как наступил следующий день."
10043090-4 = ""
10043090-9 = "Беговая дорожка Миллениум"
10043090-11 = ""
10043090-12 = "О! Здравствуйте, Сенсей."
10043090-13 = "[s] «Что это за... гора бейсбольного снаряжения?!»"
10043090-14 = "А, это? Heroes прислали в подарок!"
10043090-15 = "Ещё мне предложили место в команде..."
10043090-16 = "...но я отказалась."
10043090-17 = "[s] «Да, давление было бы НЕСЛАБОЕ.»"
10043090-18 = ""
10043090-20 = ""
10043090-21 = "Нет, дело не в этом. Я уже СОСТОЮ в команде! Я Номаса Рэй, четвёртый отбивающий бейсбольного клуба Миллениум!"
10043090-22 = "Если я хочу привести клуб к большому возвращению, нельзя отвлекаться!"
10043090-23 = "[s] «А, вот что ты имела в виду. Понятно.»"
10043090-24 = "Но за всё снаряжение я их как следует поблагодарила. Клубу оно очень пригодится."
10043090-25 = "Один из немногих минусов бейсбола — снаряжение может быть слишком дорогим."
10043090-26 = "...До сих пор трудно поверить, знаете."
10043090-27 = "Я правда выбила хоум-ран!"
10043090-28 = "Раньше у меня ни разу не получалось. Ни в матчах, ни на показательных играх, даже на тренировках!"
10043090-29 = "[s] «Ага...»"
10043090-30 = ""
10043090-32 = ""
10043090-33 = "Сенсей, вы сейчас меня жалеете?"
10043090-34 = "Не надо. После вчерашнего я чувствую себя совершенно другим человеком!"
10043090-35 = "Прямо восходящей звездой!"
10043090-36 = "Просто смотрите, Сенсей. Я покажу, что теперь умею!"
10043090-37 = ""
10043090-39 = ""
10043090-40 = "Берегись, машина для подачи и отбивания Миллениум, версия Инженерного департамента!"
10043090-41 = "Даже если ты можешь свободно чередовать 15 почти неотличимых видов чейнджапов и схем подачи на основе всех данных, которые способна обработать..."
10043090-42 = "сегодняшняя «я» отправит их все за ограду!!"
10043090-43 = ""
10043090-45 = ""
10043090-47 = "С этими словами Рэй уверенно вышла на тренировочное поле..."
10043090-50 = ""
10043090-55 = ""
10043090-60 = ""
10043090-64 = ""
10043090-65 = "...и зрелищно получила страйк-аут."
10043090-66 = ""
10043090-68 = ""
10043090-69 = "Почему?!"
10043090-70 = ""
10043090-72 = ""
10043090-74 = "Ну ладно, ИНОГДА я, конечно, промахиваюсь..."
10043090-75 = "Но как мой средний показатель упал с ноль-восемь-ноль до ноль-семь-девять? У меня же был небольшой запас, разве нет?"
10043090-76 = "[s] «Хм... Может, плечи были слишком зажаты?»"
10043090-77 = "То есть это самый банальный совет от тренеров, но..."
10043090-78 = ""
10043090-81 = ""
10043090-82 = "Вот вы где, Тренер. Привет, Рэй."
10043090-83 = "Сумирэ?"
10043090-84 = ""
10043090-85 = "[ns1] «Привет, Сумирэ. Эм...»\n[ns2] «Почему ты всё ещё в этом?»"
10043090-88 = "А, почему я всё ещё это ношу?"
10043090-89 = "Если коротко — из-за вчерашней игры."
10043090-90 = ""
10043090-92 = ""
10043090-93 = "Если длинно — вся эта страсть и волнение очень меня задели."
10043090-94 = "Тогда я даже не осознавала, насколько сильно втянулась."
10043090-95 = "Мне не хотелось отпускать это чувство, поэтому пока решила остаться в этой форме."
10043090-96 = "Двигаться в ней не так легко, как в моей обычной тренировочной одежде..."
10043090-97 = "...но иногда спорт — это не только оптимизированные показатели, правда?"
10043090-98 = "[s] «Думаю, да.»"
10043090-99 = "Да, Тренер."
10043090-100 = "И ещё, кажется, вчера я поняла кое-что важное."
10043090-101 = ""
10043090-103 = ""
10043090-104 = ""
10043090-105 = "СЛИШКОМ сильно увлекаться спортивными событиями иногда вредно."
10043090-106 = ""
10043090-109 = "[ns] «Ты кто и что сделала с настоящей Сумирэ?»"
10043090-110 = ""
10043090-112 = ""
10043090-113 = "Нет, эм, это точно всё ещё я..."
10043090-114 = "...но весь вчерашний бардак случился из-за фаната, который любил бейсбол самую чуточку слишком сильно."
10043090-115 = "Можно сказать, это как перетренированность."
10043090-116 = "Люди не всегда это признают, но перетренированность может привести к потере мышечной массы."
10043090-117 = "...Хотя я и сама не всегда это признаю."
10043090-118 = "[s3] «А-а... Да, ты точно наша Сумирэ.»\n[s4] «Ага, это точно ты.»"
10043090-121 = "Хе-хе. Сочту это за комплимент."
10043090-122 = ""
10043090-124 = ""
10043090-125 = "Ладно, ещё раз!"
10043090-126 = "Вот это настрой, Рэй!"
10043090-127 = "Ну да, конечно!"
10043090-128 = "Я четвёртый отбивающий Миллениум! Если я собираюсь вернуть бейсбольный клуб Миллениум туда, где ему место..."
10043090-129 = "...мне нельзя сидеть сложа руки!"
10043090-130 = "Вперёд!"
10043090-131 = "А чтобы поддержать тебя, я..."
10043090-132 = ""
10043090-134 = ""
10043090-135 = ""
10043090-136 = "...Ты что?"
10043090-137 = "Сумирэ, надеюсь, это просто моя паранойя, но у меня сейчас появилось очень плохое предчувствие."
10043090-138 = "Почему? Волноваться не о чем. Я никогда не сделаю ничего, что тебе не поможет."
10043090-139 = ""
10043090-141 = ""
10043090-143 = "Поэтому начиная с сегодняшнего дня я проведу для тебя специальный курс тренировок на выносливость и силу."
10043090-144 = ""
10043090-147 = ""
10043090-148 = "...А?"
10043090-149 = "Погоди, как ты вообще пришла к..."
10043090-150 = "Хотя да, все твои мысли в итоге всё равно приходят к..."
10043090-151 = ""
10043090-153 = ""
10043090-154 = "...!"
10043090-155 = ""
10043090-157 = ""
10043090-158 = ""
10043090-159 = ""
10043090-161 = ""
10043090-163 = "Куда это ты, Рэй?"
10043090-164 = "То есть, «Стажёр»?"
10043090-165 = "..."
10043090-166 = ""
10043090-168 = ""
10043090-170 = "А-а-а!"
10043090-171 = "Ненавижу Клуб спортивных тренировок!!"
10043090-174 = "[ns5] «Я буду за тебя болеть...»\n[ns6] «...вон оттуда, издалека!»"
10043090-175 = ""
10043090-176 = ""
10043090-178 = ""
10043090-179 = "Что вы такое говорите, Тренер?"
10043090-180 = "Или мне тоже называть вас «Стажёром»?"
10043090-181 = "Вы будете тренироваться вместе с ней!"
10043090-182 = "[s] «Погодите, что?!»"
10043090-184 = "[ns] «Ну как тут не любить Клуб спортивных тренировок...»"
10043090-187 = "Нет, вы ужасны!!"
10043090-188 = "Pray-Ball! Замах на гран-слэм!"
