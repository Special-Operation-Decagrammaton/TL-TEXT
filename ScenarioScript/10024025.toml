[translation]
10024025-2 = ""
10024025-3 = "Н-не может быть...!"
10024025-5 = "Что ж, будет интересно. Кисаки ведь не приказывала вам нас арестовывать, правда?"
10024025-7 = "В-вы ничего не знаете о нашем президенте!"
10024025-8 = "Ну, справедливости ради, её действительно трудно читать..."
10024025-9 = "На ней нет ценника, и её не потрясёшь, чтобы услышать, что внутри."
10024025-10 = "Но всё равно я знаю её лучше любой из вас."
10024025-11 = "Следите за манерами!"
10024025-12 = "Это вам надо следить за собой!"
10024025-14 = "После того, что вы сделали, вам повезло, что мы не подаём официальную жалобу в Генрюмон!"
10024025-16 = "Как будто они станут слушать вас, преступников!"
10024025-17 = "Вот увидите... Вы за это заплатите!"
10024025-19 = ""
10024025-23 = "Бегают они действительно быстро..."
10024025-24 = "[s] «Не хотите пойти за ними?»"
10024025-25 = "Мы, может, и выиграли этот бой, но рисковать не стоит. В конце концов, это территория Генрюмон."
10024025-26 = "Будем надеяться, они не приведут ещё друзей... Хотя это привлечёт внимание Кисаки. Так что мы должны быть в безопасности."
10024025-27 = "[s] «Что делаем дальше?»"
10024025-28 = "Кажется, кто-то говорил, что нам нужно узнать больше о десятитысячелетнем женьшене?"
10024025-29 = "А как насчёт жалобы в Генрюмон? Ну... если понадобится, всегда успеем сделать это позже."
10024025-30 = "Сейчас для меня главное — очистить имя Променада."
10024025-32 = "И помочь нам сможет только одно место."
