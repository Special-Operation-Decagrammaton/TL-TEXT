[translation]
80000107-1 = "Процесс и результат"
80000107-2 = "Главное — подача!!!"
80000107-3 = "[s] «Ты чего кричишь?!»"
80000107-4 = "Послушайте, Сенсей."
80000107-5 = "Если результат остаётся одним и тем же и ясно, что людей он уже не впечатляет..."
80000107-6 = "Разве это не значит, что ключевым становится сам процесс его получения?"
80000107-7 = "[s] «Верно. Но к чему ты ведёшь?»"
80000107-8 = "Фух. Как говорится... Лучше один раз увидеть, чем сто раз услышать..."
80000107-9 = "Итак! Позвольте показать вам моё представление, Сенсей!"
80000107-13 = "И из кармана лабораторного халата Мэру достала..."
80000107-14 = "Несколько тонких белых пластин, от которых почему-то исходил странный сладкий аромат."
80000107-15 = "[ns] «Это...?!»"
80000107-16 = ""
80000107-17 = "Хе. Хе. Хе..."
80000107-18 = "Это бумага для рисования, сделанная из шоколада..."
80000107-19 = "Пластина из белого шоколада!"
80000107-20 = "Так, холст у нас готов. Теперь нужна только ручка..."
80000107-21 = "И тут в дело вступает наша ручка из тёмного шоколада!"
80000107-22 = "[s] «То есть ты рисуешь шоколадом по шоколаду!»"
80000107-23 = "Чтобы к шоколаду у вас был ещё шоколад, Сенсей."
80000107-24 = "Такой день это заслуживает. Вы же не думали, что я забуду настолько важную дату?"
80000107-25 = "...Это настолько избитая тема в моей индустрии, что забыть о ней невозможно, даже если стараться."
80000107-26 = "[s] «Тут не поспоришь...»"
80000107-27 = "В общем! Наше шоколадное художественное шоу начинается прямо сейчас, так что не переключайтесь!"
80000107-28 = "Говорят, что нарисованные вручную иллюстрации автора фанфиков Мэрури... *кхм*... не получают заслуженного признания..."
80000107-29 = "Но однажды они станут настоящим хитом!"
80000107-30 = ""
80000107-32 = ""
80000107-33 = ""
80000107-35 = "Выкрикнув это, Мэру начала рисовать на шоколадном холсте."
80000107-36 = ""
80000107-39 = ""
80000107-40 = "[ns1] «О? Похоже, что-то начинает получаться.»\n[ns2] «Как быстро... Мэру, это автопортрет?»"
80000107-41 = ""
80000107-42 = ""
80000107-44 = ""
80000107-45 = "..."
80000107-46 = "Не то!"
80000107-47 = "[s] «Ч-Что не так? По-моему, рисунок хороший.»"
80000107-48 = "Совсем нет! Тут куча проблем! Во-первых, здесь брови размазались!"
80000107-49 = "Ух... Главная проблема рисования шоколадом в том, что ошибки почти невозможно стереть."
80000107-50 = "Но меня, Химэки Мэру, такими вещами не остановить!"
80000107-51 = "Я ожидала, что такое случится, поэтому принесла запасные листы шоколадной бумаги!"
80000107-53 = "Мэру снова принялась рисовать."
80000107-54 = ""
80000107-55 = "..."
80000107-56 = "Линии неровные!"
80000107-58 = "И снова..."
80000107-59 = ""
80000107-60 = "..."
80000107-61 = "Здесь анатомия совершенно неправильная!"
80000107-63 = "И ЕЩЁ РАЗ..."
80000107-64 = ""
80000107-65 = "Я не закончила рисунок одним штрихом!"
80000107-69 = ""
80000107-70 = "..."
80000107-71 = "[s3] «Эм, Мэру?»\n[s4] «Кажется, у тебя закончилась шоколадная бумага для рисования...»"
80000107-74 = "Не может быть... Столько бумаги впустую, а я не смогла сделать ни одного достойного рисунка..."
80000107-75 = "Неужели это мой предел? Всё так отличалось от рисования на бумаге или планшете, но я думала, что справлюсь..."
80000107-76 = "Ух... Аргх..."
80000107-77 = ""
80000107-80 = "Я подошёл к работам Мэру..."
80000107-81 = "И выбрал ту, которая показалась мне самой удачной."
80000107-82 = ""
80000107-84 = ""
80000107-85 = ""
80000107-87 = "...?! Ч-Что вы делаете, Сенсей?! Это же полный провал!"
80000107-88 = "[s] «По-моему, это одна из твоих лучших работ.»"
80000107-89 = "Д-Даже если субъективно вам нравится... Так всё равно нельзя! Здесь столько ошибок—"
80000107-90 = "[s] «Разве ты сама не говорила, что важен процесс? Общая подача?»"
80000107-91 = "*ахает*"
80000107-92 = "Ого... Подловили. Причём моими же словами?"
80000107-93 = "..."
80000107-94 = "Хия!"
80000107-95 = ""
80000107-99 = "Мэру выхватила у меня свой шоколадный рисунок."
80000107-100 = "[ns] «Ч-Что случилось, Мэру?!»"
80000107-101 = ""
80000107-102 = "В смысле что? По крайней мере, вручить это вам должна я сама!"
80000107-103 = "Потому что сегодня... ну... День святого Валентина!"
80000107-104 = "То есть... Шоколад может символизировать много разных вещей..."
80000107-105 = "Но самое главное — чтобы я сама его вам вручила!"
80000107-106 = "[s] «Да, тут ты совершенно права!»"
80000107-107 = "Правда?"
80000107-108 = "И всё же... Хотя мне кажется, что это кошмар..."
80000107-109 = ""
80000107-111 = ""
80000107-112 = ""
80000107-114 = "Вот, берите. Наслаждайтесь шоколадной картиной."
80000107-115 = "Хм? С какого места будет наименее невежливо начать есть ваш подарок?"
80000107-116 = "Вы переживаете из-за такой мелочи. Очевидно же..."
80000107-117 = "...Очевидно..."
80000107-118 = "..."
80000107-119 = "Пожалуй, мне придётся немного подумать!"
80000107-121 = "Мы с Мэру ещё долго спорили, с какого места правильнее всего начинать есть её шоколадный портрет."
