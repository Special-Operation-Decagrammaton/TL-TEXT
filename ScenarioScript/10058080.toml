10058080-249 = "She was so openly hostile literally just moments ago..."
10058080-250 = "President Cherino is usually very magnanimous, but there are instances where she#nis especially lenient."
10058080-251 = "For example, in tank racing, she shows great respect towards worthy opponents."
10058080-252 = "Sorry, everyone from the Make-up Work Club..."
