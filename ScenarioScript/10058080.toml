10058080-35 = "Ughhh..."
10058080-36 = "...Why're you making me say it out loud!? I know you're thinking the same thing!"
10058080-41 = "Koharu-chan! ♡"
10058080-42 = "Even though I know we only stand to lose from this... #nI CAN'T just abandon them! I HAVE to help them, and it PISSES me off!"
10058080-43 = "Team Make-up Work, we're absolutely going to save them! I swear I'll cut ties with#nyou all if we don't! Uwaaaagh!!"
10058080-46 = "Let's do this!!"
10058080-48 = "I've got you now, you dissidents!"
10058080-49 = "Anyone who dares to rebel against me deserves a point-blank purge!"
10058080-50 = "We were so close to fixing the tank..."
10058080-51 = "It's..."
10058080-52 = "It's... over..."
