10058080-230 = "How do you ALWAYS have these sorts of comments prepared!? You're the#nabsolute worst! I'm sentencing you to death!!"
10058080-231 = "Ahaha... I'm glad to hear you're all safe."
10058080-232 = "How is Crusader-chan looking?"
10058080-233 = "Heavily damaged. We're out of ammo, and the engine and axles are broken."
10058080-234 = "It's unfortunate, but it seems that's all for us then..."
10058080-235 = "Hello, Ajitani Hifumi. Your merry band of friends, as well."
10058080-239 = "U-Umm... This is all just a race, so..."
10058080-240 = "C-Calm down, both of you..."
10058080-244 = "That was an impeccable match! It was a delight to face you once more!"
10058080-245 = "Same here! I was very impressed by your unconventional tactics!"
10058080-246 = "Hm...?"
10058080-247 = "President Cherino isn't mad at an opponent she was fighting...?"
