[translation]
10058080-1 = "Episode 8;Not a Coup?"
10058080-2 = "Boom!!"
10058080-5 = "What are your orders, President? #nWe've put enough distance between the Crusader and ourselves—they are no#nlonger able to penetrate our armor."
10058080-6 = "Then let us purge those immobilized fools from 183."
10058080-7 = "Their tracks are broken and they're unable to target us!"
10058080-8 = "Understood! All hands, take aim and fire when ready!"
10058080-9 = "Roger!"
10058080-14 = "T-The engine's stopped working!"
10058080-15 = "The red light's flashing! Are we in trouble!?"
10058080-16 = "We've overheated. It looks like the radiator's been destroyed... #nIf we start the engine now, it'll seize up."
10058080-17 = "The enemy tank is no longer aiming at us."
10058080-18 = "They intend to shoot Team 183."
10058080-19 = "Why didn't they run away!? We bought them so much time too!"
10058080-20 = "They can't run away. Their tracks are broken."
10058080-21 = "And without a turret, they're unable to even fight back..."
10058080-22 = "Yet... they haven't abandoned their tank; they're still trying their best to fix the#ntracks."
10058080-23 = "Even as they cry... they refuse to run away until the end."
10058080-24 = "What's our next move then? I don't think there's anything left we can do."
10058080-25 = "...There is one more thing we could do."
10058080-26 = "Hifumi...?"
10058080-27 = "If they're unable to rotate their tank themselves, then we simply have to rotate it#nfor them."
10058080-28 = "In other words... We'll ram Crusader-chan into their tank to change their bearing."
10058080-29 = "But supposing we do that... If we start the engine now..."
10058080-30 = "The engine will seize. But even if it doesnt, we may be shot instead anyway."
10058080-31 = "Koharu-chan."
10058080-32 = "In that case, we won't be able to win... #nAnd then I'll have to take make-up exams... and study..."
10058080-33 = "Koharu."
