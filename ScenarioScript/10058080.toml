10058080-218 = "Eh!?"
10058080-219 = "Huuuh!?"
10058080-220 = "I nearly had the wrong idea! I thought you were using this race as cover to stage a#ncoup d'etat and overthrow me!"
10058080-221 = "If that wasn't the case, then I'm perfectly fine with this outcome. Well fought!"
10058080-222 = "I wouldn't dare to stage a coup. Leading the Office sounds like a bore."
10058080-223 = "Tomoe! Remove them from the purge list!"
10058080-224 = "Understood. I'll remove these three from the purging queue."
10058080-225 = "Pheeeew...!"
