10058080-155 = "We did it... Yippie."
10058080-159 = "Erinaa!?"
10058080-160 = "Urk... All the tension's leaving me too..."
10058080-165 = "This is why sleep is important."
10058080-167 = "As you'd expect from Red Winter, their revolutionaries are nothing to scoff at! #nEven when caught between a rock and a hard place, they managed to adapt and#ncome out on top!"
10058080-168 = "By looking through the barrel, they were able to aim their gun despite their broken#nsights! Now that's a first!"
10058080-169 = "That brings 183's total eliminations to two! They're truly living up to their title as#nthe dark horse!"
10058080-170 = "On the other hand, Team Make-up Work Club, led by number two ranked Ajitani#nHifumi, has fallen out of the race. This tournament is truly full of unpredictable#ntwists and turns."
10058080-171 = "Everyone looks so angry. Are they not friends?"
10058080-172 = "Should Ibuki share her snacks so they stop...?"
10058080-173 = "It's alright, Ibuki-chan! It's all just for sport!"
10058080-174 = "Right, Sensei!?"
10058080-175 = "[s] \"Getting into a scuffle every now and then helps you grow up!\""
10058080-176 = "Really!? Then... Ibuki will get into lots of fights and grow up big and strong!"
10058080-177 = "[s] \"That's NOT what I meant, Ibuki!\""
10058080-178 = "That stumped expression is GOLD, Sensei! Thanks for that! Ahaha!"
10058080-179 = "...Alright. Looks like we're about to enter the climax of this match! As always..."
10058080-180 = "Stay tuned—"
10058080-181 = "[s] \"—for more!\""
10058080-186 = "U-Umm... President Cherino?"
