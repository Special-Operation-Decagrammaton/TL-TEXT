10058080-204 = "All you did... was destroy the tank I was on?"
10058080-205 = "Yes. You said that Red Winter would win this race, which meant we had to defeat#nyou in order to win."
10058080-206 = "If President Cherino had won instead, then we couldn't have won."
10058080-207 = "This was not meant to be a coup; that is why we never declared it as one."
