[translation]
10058080-1 = "Episode 8;A Coup, Not Quite?"
10058080-2 = "BOOM!!!!"
10058080-5 = "President, your orders?#nThe Crusader has put some distance between us, so we can't penetrate its armor."
10058080-6 = "In that case, let's purge those No. 183 losers who can't even move."
10058080-7 = "Their tracks are broken, so they can't even aim at us!"
10058080-8 = "Understood! Everyone, lock on and commence bombardment!"
10058080-9 = "Roger!"
10058080-14 = "Th-the engine stopped!"
10058080-15 = "The red light is on, is that bad!?"
10058080-16 = "It's an overheat. The radiator seems to be broken...#nIf we start the engine now, it'll seize up."
10058080-17 = "The enemy tank took its sights off us."
10058080-18 = "They're planning to fire on No. 183."
10058080-19 = "Why aren't they running away!? Even after we bought them so much time!"
10058080-20 = "They can't run. The tank's tracks are broken."
10058080-21 = "Without a turret, they can't even counterattack..."
10058080-22 = "Even so... instead of abandoning the tank, they're trying their best to fix the tracks."
10058080-23 = "Even while crying... all the way to the end, without running away..."
10058080-24 = "Then what do we do? We're out of options, right?"
10058080-25 = "...There is one."
10058080-26 = "Hifumi...?"
10058080-27 = "If they can't turn the hull themselves, we'll just have to turn it for them."
10058080-28 = "Meaning... we'll crash into Crusader-chan and force her to change direction."
10058080-29 = "Even if you say that... if we start our engine now..."
10058080-30 = "The engine will seize. Even if it doesn't, we might take a shell in their place."
10058080-31 = "Koharu-chan."
10058080-32 = "Then we won't win...#nAnd then we'll have remedial classes again... and have to study..."
10058080-33 = "Koharu."
10058080-34 = "..."
10058080-35 = "Uuuuu..."
10058080-36 = "...If you're thinking the same thing, don't make me say it!"
10058080-41 = "Koharu-chan ♡"
10058080-42 = "Even though you know you'll lose out...#nI seriously, really hate how you can't just ignore things and have to stick your nose in!"
10058080-43 = "You better help me pass the remedial classes, or I'll never speak to you again! Waaaaahhh!!!"
10058080-46 = "Everyone, let's go!!!"
10058080-48 = "Got you now, rebels!"
10058080-49 = "Anyone who defies me gets a point-blank purge!"
10058080-50 = "We were almost done fixing it..."
10058080-51 = "Ah..."
10058080-52 = "W-well..."
10058080-53 = "I'm sorry, everyone from the Remedial Class. Even after you helped us so much..."
10058080-54 = "I really should have... made sure the turret could rotate..."
10058080-55 = "Just a little more... if the hull had just faced sideways..."
10058080-58 = "Fire!"
10058080-61 = "?"
10058080-65 = "Kyaah!? Wh-what just hit us!?"
10058080-66 = "The Remedial Class members took the hit for us...!"
10058080-67 = "Feels like a rear-end collision. Should we call insurance?"
10058080-69 = "Everyone! You should be able to target them now!"
10058080-70 = "At this distance, it'll be a breeze."
10058080-71 = "W-what!? Are they planning to counterattack!"
10058080-74 = "Everyone from the Remedial Class!!!"
10058080-75 = "If we're going to get purged anyway, we have no choice but to do this!!!"
10058080-76 = "It's a serious match!! We won't let this chance go to waste!!"
10058080-77 = "There's no turning back now!!!"
10058080-83 = "AP shell, loaded!!"
10058080-86 = "Fire! Fire! Fire! Fire! Fireeeeeee!!!"
10058080-90 = "To think you'd miss at this distance, Ajitani Hifumi. Your calculations were off."
10058080-92 = "Kuh..."
10058080-95 = "Hiiiieee!!!"
10058080-96 = "What are you doing!! How could you possibly miss at this range~?!"
10058080-97 = "The gunsight is broken, so the zero-in is off!!"
10058080-98 = "Then just adjust the aim for the offset!"
10058080-102 = "Still no good!!"
10058080-103 = "The recoil throws off the aim every time we fire! There's no predicting this!"
10058080-105 = "No need to drag this out any further. Load the next round!"
10058080-106 = "There are spare shells in the corner, we're pulling them out now!"
10058080-107 = "Hurry up, or I'll purge you too!!"
10058080-109 = "No way...!"
10058080-110 = "Even though we went out of our way to help you, waaahhh!"
10058080-112 = "What do we do! What are we supposed to do!?"
10058080-113 = "Anyway, we have to lock on..."
10058080-114 = "...I know!!"
10058080-115 = "Anna, pull the shell out!!"
10058080-116 = "What's gotten into you all of a sudden!? Are you planning to surrender now?"
10058080-117 = "As if! Just do it, hurry!!!"
10058080-118 = "O-okay, fine!!"
10058080-121 = "Move, move aside!!"
10058080-122 = "Why are you pressing your head against the breech!? It's dangerous!"
10058080-123 = "Jeez! Shut up~ and just watch!!"
10058080-127 = "5 to the right! 10 down!"
10058080-130 = "Alright!! Load!!"
10058080-133 = "Fire! Fire! Fire! Fire! Fireeeeeee!!!"
10058080-134 = "Fire!!!"
10058080-138 = "What!?"
10058080-141 = "Uwaaaaaahhh!?"
10058080-142 = "BOOM!!!!!"
10058080-148 = "Well done. A victory for Anna and the others who didn't give up until the end."
10058080-149 = "Our sacrifice wasn't in vain."
10058080-150 = "A re-exam... I already dread it..."
10058080-151 = "My, my ♡ Don't worry, Koharu-chan.#nI'll teach you this and that, all～l of it."
10058080-152 = "I'm genuinely depressed right now, so stop it!"
10058080-154 = "Th-the enemy tank, destroyed..."
10058080-155 = "Yes..."
10058080-159 = "Elina!?"
10058080-160 = "Ugh... The tension just finally left me..."
10058080-165 = "This is why sleep is important."
10058080-167 = "The assassins from Red Winter are truly strong!#nDespite the difficult situation, they adapted on the fly and survived!"
10058080-168 = "To peer down the barrel to aim because the gunsight broke... completely unprecedented!"
10058080-169 = "No. 183 has recorded 2 tank kills. Truly a performance worthy of a dark horse!"
10058080-170 = "Meanwhile, the Remedial Class team led by 2nd-ranked Ajitani Hifumi has been eliminated.#nThis tournament is truly showing turbulent developments where disaster lurks around every corner."
10058080-171 = "Everyone looks really angry. Aren't they friends?"
10058080-172 = "Should I share my snacks with them to make them stop...?"
10058080-173 = "It's alright, Ibuki-chan! This is a sport, after all!"
10058080-174 = "That's right, Sensei!"
10058080-175 = "[s] \"Everyone grows by getting into fights over and over!\""
10058080-176 = "Really!? In that case... Ibuki's gonna get into lots of fights and grow super big!"
10058080-177 = "[s] \"That's not what I meant, Ibuki!\""
10058080-178 = "Got a picture of Sensei's flustered face~! Ahaha!"
10058080-179 = "...Right. Now, the match heads into its climax!"
10058080-180 = "Stay tuned—"
10058080-181 = "[s] \"—right where you are!\""
10058080-186 = "Um, excuse me... President Cherino?"
10058080-187 = "Are you hurt? Hehe..."
10058080-188 = "You guys are the ones who destroyed my tank!?"
10058080-189 = "Whimper..."
10058080-190 = "Please don't be mad! There's a good reason for this..."
10058080-191 = "I said Red Winter would win, but#nwhat are you doing sabotaging each other!! You rebels!!"
10058080-192 = "Yikes..."
10058080-193 = "You're getting purged the moment we get back! Purged!!"
10058080-194 = "President Cherino."
10058080-195 = "What is it? Do you still have an excuse?"
10058080-196 = "President Cherino. We did not stage a coup."
10058080-197 = "Hold on, Rana!!"
10058080-198 = "The President is mad right now, so you should just apologize!!"
10058080-199 = "You didn't stage a coup? What do you mean?"
10058080-200 = "We didn't stage a coup...#nWe just destroyed the tank the President was riding in."
10058080-204 = "You just destroyed the tank I was riding in...?"
10058080-205 = "Yes.#nSince the President told us to win, we took down the President's tank in order to win."
10058080-206 = "If President Cherino won, we wouldn't be able to win."
10058080-207 = "We had no intention of staging a coup. That's why we didn't declare one."
10058080-212 = "You attacked me not to stage a coup, but to win?"
10058080-213 = "..."
10058080-217 = "What, is that all it was! You guys were just having a race!"
10058080-218 = "Eh!?"
10058080-219 = "Eeeh!?"
10058080-220 = "You almost had me misunderstand!#nI thought you were using the race as an excuse to stage a coup#nand drag me down from power!"
10058080-221 = "If that's the case, there's no problem. Good match!"
10058080-222 = "A coup is out of the question. The Office sounds boring."
10058080-223 = "Tomoe! Remove these guys from the purge list!"
10058080-224 = "Understood. I'll remove these three from the upcoming purge list."
10058080-225 = "Haaaaaahhhh...!"
10058080-228 = "Is everyone alright?"
10058080-229 = "Yes~! As bouncy and glossy as ever!"
10058080-230 = "Do you always prepare lines like that!? Absolutely terrible, death penalty!!!"
10058080-231 = "Ahaha... I'm glad. Everyone seems unhurt."
10058080-232 = "How is Crusader-chan holding up?"
10058080-233 = "Totaled. We're out of ammo, and the engine and accelerator are completely useless."
10058080-234 = "It's a shame, but we're eliminated..."
10058080-235 = "Ajitani Hifumi. And her comrades."
10058080-239 = "U-um... you see, this was a race..."
10058080-240 = "C-calm down, both of you..."
10058080-244 = "It was an impeccable match! I'm glad we could fight again!"
10058080-245 = "Likewise! I deeply admire your tactics that disregard convention!"
10058080-246 = "Hmm...?"
10058080-247 = "President Cherino isn't mad at her opponent...?"
10058080-248 = "Eh...?"
10058080-249 = "Weren't they radiating hostility until just a moment ago...?"
10058080-250 = "President Cherino is always magnanimous, but there's a specific field where she's especially generous."
10058080-251 = "Above all, in tank races, she respects the rivals she has fought."
10058080-252 = "Everyone from the Remedial Class..."
10058080-253 = "We are truly sorry for causing all this because of us..."
10058080-254 = "It's fine! All of this is also—right, Azusa-chan!"
10058080-255 = "\"An important process.\" It was fun."
10058080-256 = "Ehehe."
10058080-257 = "Uwaaahhh..."
10058080-258 = "If we didn't have this process,#nI wouldn't have known that Hifumi was a ruthless \"Fairy Queen\"."
10058080-259 = "Azusa-chan!?#nPlease stop talking about that～!!"
10058080-265 = "My, oh my~ ♡"
10058080-266 = "This is a touching moment, so don't just casually hug me!"
10058080-269 = "So hugging is a Trinity culture for sharing emotions. In that case, I too..."
10058080-270 = "N-no way!! I'll be the sacrifice, so don't let her influence you!!"
10058080-272 = "Ajitani Hifumi. To give up on winning like that..."
10058080-273 = "What is she thinking? I don't understand it at all."
10058080-274 = "However..."
10058080-281 = "It doesn't seem like she had no reason."
10058080-282 = "Someday, I'll make time to ask her."
10058080-284 = "Ow ow ow..."
10058080-285 = "It was the perfect opportunity, yet of all times, my shoelace had to untie!"
10058080-286 = "Absolute purge when I get back... ugh..."
10058080-287 = "Marina."
10058080-288 = "C-Cherino-kaicho!?"
10058080-289 = "I'm so sorry! O-ow..."
10058080-290 = "Hmph."
10058080-291 = "Are you hurt?"
10058080-292 = "N-no! I'm completely fine!"
10058080-293 = "..."
10058080-294 = "Someone, lend her a hand."
10058080-295 = "Good work, Marina."
10058080-298 = "Mr.-Mr. Presidentーー!!"
10058080-299 = "Allow me, Committee Chairperson Marina. I'll lend you my shoulder."
10058080-300 = "By the way, Marina, would you mind cleaning the bathrooms once we get back?"
10058080-301 = "Your cleaning always turns out the neatest."
10058080-302 = "Leave it to me! I'll have them polished to a shine!"
10058080-303 = "(It doesn't sound much different from a purge, but I suppose it's good for her)"
10058080-306 = "A-ahaha. Everyone looks busy, so we'll be taking our leave~!"
10058080-307 = "Great work~!"
10058080-310 = "Oh..."
10058080-311 = "Such a heart-pumping development."
10058080-314 = "Let's hurry up and run before they change their minds!!"
10058080-321 = "Ugh, we got done for..."
10058080-322 = "Ugh..."
10058080-327 = "Tank Commander Iroha. Enemy tank neutralized."
10058080-328 = "That makes 33 tanks destroyed. What's our next move?"
10058080-329 = "We head to the final target."
10058080-330 = "Driver. Put it in 3rd gear and advance quietly."
10058080-331 = "Loader. Load an APHE shell."
10058080-332 = "Yes! Loading APHE shell!"
10058080-336 = "Tank Commander Iroha. Communication from management."
10058080-337 = "Put it through to line 2."
10058080-341 = "..."
10058080-344 = "Understood, Chiaki. I still have my questions, but rules are rules."
10058080-345 = "Then."
10058080-348 = "Hah. Why is it in a position like this again..."
10058080-349 = "Driver. Advance 15 meters and stop."
10058080-350 = "Tank Commander Iroha. What was that call just now about?"
10058080-353 = "If necessary, information will be shared accordingly."
10058080-354 = "Eh?"
10058080-357 = "S-sorry! She only just joined us recently!"
10058080-358 = "I judged that it wasn't useful information for fulfilling our respective roles,#nso I simply didn't share it."
10058080-359 = "Was it necessary information?"
10058080-360 = "N-no!!"
10058080-361 = "Sorry! We'll follow orders in silence!"
10058080-366 = "Did I do something bad, by any chance?"
10058080-367 = "Not necessarily bad, but you shouldn't chime in like that!"
10058080-368 = "We just follow orders. No need for extra suggestions or questions."
10058080-369 = "Eeeh, we usually exchange greetings if we pass each other in the hallways."
10058080-370 = "When you're in a tank, it's an exception!#nUnless you're at Ibuki-chan's level, you can't voice opinions to Iroha-senpai inside a tank."
10058080-371 = "Is that so... Should I apologize?"
10058080-372 = "I don't think you need to go that far, but just be careful from now on!"
10058080-377 = "To think we'd meet like this."
10058080-378 = "I hope they come at us with everything they've got, too."
10058080-383 = "Hit! The next one is the final target!"
10058080-384 = "Shoot that and cross the finish line to win!"
10058080-387 = "Huh? A video call. Who could it be from...?"
10058080-390 = "Hello? We're busy right now..."
10058080-391 = "Heeey, hello there~!"
10058080-392 = "It's Motomiya Chiaki from management~!"
10058080-394 = "Eh...?"
