[translation]
10051080-1 = "Эпизод 8;Каждый на своём месте"
10051080-2 = "Фотостудия"
10051080-4 = "(Уф... Первый перерыв за несколько часов...)"
10051080-5 = "(Я вымоталась...)"
10051080-6 = "(Когда же эта фотосессия закончится...?)"
10051080-7 = "(Свет такой яркий, что кожу щиплет... И каблуки красивые, но сжимают ноги. Стоять больно...)"
10051080-8 = "(А главное, этот макияж... Он такой плотный, будто кожа задыхается...)"
10051080-9 = "(Интересно... когда я смогу вернуться к...)"
10051080-10 = ""
10051080-17 = "Всё идёт хорошо?"
10051080-18 = "Да?!"
10051080-19 = "Великолепно. Рад это слышать. Выглядишь хорошо."
10051080-20 = "О? То есть, эм, я правда хорошо справляюсь?"
10051080-21 = "Я просто делаю то, что мне говорят..."
10051080-22 = "Если ты следуешь указаниям и не отстаёшь, значит, справляешься хорошо."
10051080-23 = "Следую указаниям..."
10051080-24 = "Э-Эм, кстати..."
10051080-25 = "Хм?"
10051080-26 = "Можно мне... уже вернуться?"
10051080-27 = "Вернуться? Куда?"
10051080-28 = "Обратно в этот ваш «отряд шиноби» или как там?"
10051080-29 = "Да, в Клуб исследования ниндзюцу..."
10051080-30 = "То есть ты хочешь вернуться туда, где была раньше."
10051080-31 = "Тогда позволь спросить: а КЕМ ты там была?"
10051080-32 = "Что...?"
10051080-33 = "Спроси себя. Серьёзно подумай. Каким человеком ты там была? В чём была твоя цель? Что ты давала этой организации?"
10051080-34 = "Что?! Э-Это..."
10051080-35 = ""
10051080-37 = ""
10051080-38 = "Смотри. Вот сегодняшние фотографии."
10051080-39 = "...!"
10051080-40 = "Что думаешь? Даже человек совершенно без чувства прекрасного увидит истину прямо перед глазами."
10051080-41 = "Он скажет, что эти фотографии прекрасны. ТЫ прекрасна."
10051080-42 = "..."
10051080-43 = "Цукуё, ты лучшая модель из всех, кто у нас есть."
10051080-44 = "И именно поэтому ты должна остаться здесь. Твоё место здесь. Здесь ты можешь раскрыть свой настоящий потенциал и сиять, как звезда, которой являешься."
10051080-45 = ""
10051080-47 = ""
10051080-48 = "...Мы всего лишь ПЕРЕМЕЩАЕМ это платье туда, где оно сможет полностью раскрыть свой потенциал!"
10051080-49 = ""
10051080-51 = "Раскрыть... потенциал..."
10051080-52 = "Конечно, выбор за тобой. Ты можешь остаться в зоне комфорта, прячась от жизни, или выйти на свет и найти свою истинную ценность."
10051080-53 = "Э-Это..."
10051080-54 = "Но будет жаль потерять тебя. Я уже планирую показ, где ты станешь главной моделью."
10051080-55 = "Что?!"
10051080-56 = "Он снова пройдёт в Хяккияко. Мы планируем модный показ в честь Нового года. Там вроде проходит какой-то фестиваль."
10051080-57 = "И-И-И вы хотите, чтобы Я участвовала в таком большом событии?!"
10051080-58 = "Разумеется. Ни одна модель не справится лучше."
10051080-59 = "Так что давай считать, что ты согласилась. Мне нужно запускать процесс, а времени всё меньше."
10051080-60 = ""
10051080-62 = ""
10051080-63 = "Э-Эм, я...!"
10051080-64 = ""
10051080-70 = "Шайнкэт, ваша еда готова."
10051080-71 = "А? Только сейчас? Чего так долго?"
10051080-72 = "Прошу прощения. Курьера по пути сюда атаковали Моурё..."
10051080-73 = "Эти чёртовы нарушители..."
10051080-74 = "Кстати, вам не кажется, что мои заказы в последнее время ЧЕРЕСЧУР часто перехватывают?"
10051080-75 = "Да, я тоже это заметил."
10051080-76 = "Неважно. Возможно, я слишком остро реагирую. Наверное, это такая «очаровательная» культура Хяккияко."
10051080-77 = "Столько времени прошло, что я уже забыл, что заказал. Напомни."
10051080-78 = "Вы заказали рамен, жареный рис и гёдза."
10051080-79 = "Восхитительно. Тяжёлый труд нужно вознаграждать хорошей едой. Пойдём."
10051080-80 = ""
10051080-82 = ""
10051080-83 = ""
10051080-84 = ""
10051080-85 = "Ц-ц. Твоя еда в ТОЙ комнате. Она уже ждёт тебя."
10051080-86 = "Что...?"
10051080-87 = "Чего ты так удивилась? Теперь ты модель, а значит, конечно, должна следить за питанием."
10051080-88 = "Можешь взять лапшу из конняку с нулевой калорийностью и салат. С заправкой поосторожнее, хорошо? И за нами не ходи."
10051080-89 = "Что?! Но разве вы не говорили, что если я «следую указаниям», значит, справляюсь хорошо?"
10051080-90 = "Очевидно, это не включает следование за нами сюда!"
10051080-91 = "Приятного аппетита, Цукуё."
10051080-92 = "Эй, а какой там рамен, напомни?"
10051080-93 = "Ваш обычный, сэр. Тонкая лапша, без свиной грудинки и очень лёгкий бульон."
10051080-94 = "Восхитительно."
10051080-95 = "П-Подождите?!"
10051080-96 = ""
10051080-98 = ""
10051080-100 = "Кладовая"
10051080-101 = "Угх..."
10051080-102 = "Так жестоко... Не могу поверить, что мне дают только лапшу из конняку и салат. Вот тебе и ужин..."
10051080-103 = "А у них ещё и намеренно пресный рамен, жареный рис и гёдза..."
10051080-104 = "И они ВСЁ ЕЩЁ держат мой телефон..."
10051080-105 = "..."
10051080-106 = "Я хочу... рамен..."
10051080-107 = "...с президентом... Изуной... и Сенсеем..."
10051080-108 = "Толстая лапша, свиная грудинка, политая маслом чили... Хи-хи."
10051080-109 = "Вот это рамен ниндзя..."
10051080-110 = "..."
10051080-111 = ""
10051080-113 = ""
10051080-114 = ""
10051080-115 = ""
10051080-116 = "Модель... и ниндзя..."
10051080-117 = "Но я правда... лучше как модель, чем как ниндзя?"
10051080-118 = "Модельная работа делает меня ценной? Значимой? Похоже, люди так думают."
10051080-119 = "...Неужели в Клубе исследования ниндзюцу я и правда была настолько бесполезной? Имело ли это вообще значение?"
10051080-121 = "Уф... Не знаю..."
10051080-122 = "Пожалуйста... Пусть кто-нибудь сжалится и даст мне ответ..."
10051080-124 = "Раменная в Хяккияко"
10051080-126 = "Мичиру, Изуна и я закончили съёмку. Мы отправились в раменную."
10051080-127 = ""
10051080-129 = ""
10051080-130 = "*шмыг* Чудесный аромат тонкоцу..."
10051080-131 = "Прекрасная награда за наши труды. Мы это заслужили!"
10051080-132 = "Изуна согласна!"
10051080-133 = "[s] «Я угощаю, так что ешьте сколько хотите.»"
10051080-134 = "Фу-фу, раз достопочтенный Сенсей настаивает, пожалуй... побалую себя чем-нибудь особенным!"
10051080-135 = "Мы хотим сделать заказ!"
10051080-136 = "Да! Что вам принести?"
10051080-137 = "Четыре миски рамена и тарелку гёдза, пожалуйста."
10051080-138 = "А рамен..."
10051080-139 = "Толстая лапша, свиная грудинка, политая маслом чили. Верно?"
10051080-140 = "*ахает* Откуда вы знаете?!"
10051080-141 = "Ха-ха! Вы, девочки-ниндзя, всегда это заказываете!"
10051080-142 = "И в благодарность за вашу помощь в прошлый раз я добавил ТО особое блюдо в меню. Видите? Это «Блюдо ниндзя»!"
10051080-143 = "Теперь можете не мучиться и просто заказывать «Блюдо ниндзя»!"
10051080-145 = "*ахает*"
10051080-146 = "Мир наконец начал признавать законность существования ниндзя...!"
10051080-147 = "Кстати, а другая ниндзя опаздывает? Я её не вижу... а её довольно трудно не заметить."
10051080-148 = "А? Что вы имеете—"
10051080-149 = "А, точно. Цукуё... не смогла прийти."
10051080-150 = "Пожалуйста, тогда три миски вместо четырёх!"
10051080-152 = "Сейчас будет!"
10051080-153 = ""
10051080-155 = ""
10051080-156 = ""
10051080-157 = "Я по привычке заказала и за Цукуё."
10051080-158 = "Изуна тоже не сразу поняла..."
10051080-159 = "Я скучаю по Цукуё..."
10051080-160 = "Президент, Изуна хотела вас спросить..."
10051080-161 = "Хочешь это посмотреть?"
10051080-162 = "Что такое?"
10051080-163 = "Видео с фотосессии Цукуё загрузили несколько минут назад!"
10051080-164 = "...!"
10051080-165 = "Правда? Давайте посмотрим все вместе!"
10051080-166 = "Поняла!"
10051080-167 = ""
10051080-169 = ""
10051080-171 = "Мы вместе с Мичиру и Изуной посмотрели видео с фотосессии Цукуё."
10051080-173 = "..."
10051080-174 = "Ого... Я и не знала, что Цукуё может быть такой смелой."
10051080-175 = "Но погодите, просмотры у этого видео... О, наверное, это баг."
10051080-176 = ""
10051080-178 = ""
10051080-179 = "Стоп, вы хотите сказать, что у видео вообще может быть СТОЛЬКО просмотров?!"
10051080-180 = "Правда? Дайте я ещё раз пересчитаю запятые."
10051080-181 = "Оно только что вышло, а просмотров уже столько?!"
10051080-182 = "...Одно это видео Цукуё набрало больше просмотров, чем весь наш канал, Президент."
10051080-183 = "..."
10051080-184 = "Президент, это правда будто смотришь в другой мир."
10051080-185 = "Другой мир..."
10051080-186 = ""
10051080-188 = ""
10051080-190 = ""
10051080-192 = "..."
10051080-193 = "Эй, Изуна."
10051080-194 = "Да, президент?"
10051080-195 = "Цукуё... наверное... не хочет возвращаться, да?"
10051080-196 = "Что?!"
10051080-197 = "Спасибо, что подождали!"
10051080-198 = "Приятного аппетита!"
10051080-199 = ""
10051080-201 = ""
10051080-202 = "Наконец-то «Блюда ниндзя» здесь..."
10051080-203 = "Эм, Президент, что вы там говорили...?"
10051080-204 = "Предлагаю есть, ниндзя! Не переживай. Я просто устала после съёмки."
10051080-206 = "Спасибо, достопочтенный Сенсей!"
10051080-207 = "С-Спасибо, мой господин!"
10051080-209 = "Мы съели рамен и разошлись. Всё казалось обычным."
10051080-210 = "Но через несколько дней..."
10051080-211 = ""
10051080-216 = ""
10051080-217 = "Мой господин, мой господин!"
10051080-218 = "[s] «Что случилось, Изуна?»"
10051080-219 = "Это... Это..."
10051080-220 = "Президент ведёт себя странно...!"
