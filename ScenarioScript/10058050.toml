[translation]
10058050-1 = "Episode 5;We Don't Listen to Weaklings"
10058050-2 = "Whoa-ho! What's this?!#nThe Valkyrie Police Academy team has been eliminated in a flashy explosion~!"
10058050-3 = "And they acted like winning would be a piece of cake~."
10058050-4 = "Ibuki ate breakfast!"
10058050-5 = "The basics of tank warfare are hit-and-run!#nThey racked up points near the starting line, but#nallowed a surprise attack!"
10058050-6 = "This is the first time the Special Class 183, making their debut today, has been destroyed!#nCongratulations~!!"
10058050-7 = "Now, before we return to the action on the field—"
10058050-8 = "Sensei, please give us a wrap-up!"
10058050-11 = "[ns] \"Don't touch that dial!\""
10058050-12 = "Thank you very much!!"
10058050-17 = "Guhhh!!!"
10058050-23 = "Iori! Pull the tank a bit closer! I'll beat them to a pulp with this gun!"
10058050-24 = "You're getting too worked up... Chinatsu, stop her."
10058050-25 = "I can't. She's been going on and on since earlier about how#n\"It's the Prefect Team's destiny to snatch the championship trophy from the Pandemonium Society's tournament.\""
10058050-26 = "The only one who can stop an administrative officer once she gets going is the President."
10058050-27 = "Come on, keep firing! The glory of victory belongs to the President!"
10058050-28 = "...Huh? What's that light?"
10058050-29 = "Who cares about some light?! Focus a bit more on the enemy right in front of—"
10058050-35 = "Kyaaaah!!!"
10058050-38 = "That person was swinging her gun around on top of the tank."
10058050-39 = "What a weird delinquent..."
10058050-40 = "Asuna, was the prism cannon giving you any trouble?"
10058050-41 = "Nope! No problem at all~!"
10058050-42 = "Who would've thought we'd get taken down by the Game Development Department's runts...#nWell, good thing we could fix it, though."
10058050-43 = "Still, four people really makes it feel cramped...#nWhere in the world has Toki gone since yesterday?"
10058050-44 = "I can't even get in touch with her, I'm worried."
10058050-45 = "I hope she hasn't gotten herself caught up in some trouble..."
10058050-46 = "She's not someone who goes down that easily, you know? Don't worry. #nBesides... why is everyone and their mother coming at our tank with such intense hostility the moment they see it?!"
10058050-47 = "Could it be because it's the weirdest one? Ahaha!"
10058050-48 = "Well, I mean, the Engineering Department made it after all..."
10058050-49 = "There's not another bizarre tank like this anywhere else..."
10058050-55 = "...Huh?"
10058050-56 = "Is this... the same prism cannon as ours...?"
10058050-60 = "It is not a prism. It is a pretty maid."
10058050-61 = "Where the hell have you been wandering off to?! And what is that tank?!!"
10058050-62 = "I asked the Engineering Department for the same thing."
10058050-63 = "I thought I wanted to win against Neru-senpai just once."
10058050-64 = "Those guys actually agreed to that?!"
10058050-68 = "Mirror matches are pure romance, after all."
10058050-69 = "It'd be a waste to use the blueprints only once, too!"
10058050-70 = "And it looked fun."
10058050-71 = "Those guys, I swear..."
10058050-72 = "Fine, bring it on!! I'll smash you to pieces!!"
10058050-75 = "[ns] \"Mirror match! Mirror match! Mirror match!\""
10058050-76 = "This is an unexpected turn of events!#nTo think the missing club member would return riding the exact same model of tank!"
10058050-77 = "I wonder who's going to win? I can't wait~!"
10058050-78 = "When it's mirror match tanks, it all comes down to the crew's skill!#nAh! And while we're talking, it's started!"
10058050-79 = "The cameras can't keep up! It's a no-guard brawl with zero defense and zero evasion!"
10058050-105 = "What's this, neither Toki nor the Engineering Department's gear is that big a deal!"
10058050-106 = "Hey! Even your tank is broken now! Just give up already!"
10058050-107 = "..."
10058050-110 = "W-What?!"
10058050-115 = "To answer your question... It's a super pretty maid."
10058050-116 = "Peace, peace."
10058050-117 = "That's not what I asked AT ALL!!!!"
10058050-118 = "This match goes to me."
10058050-121 = "H-Hey!!!"
10058050-126 = "You robot maid over there! You're disqualified! Step out of the vehicle!"
10058050-131 = "Disqualified?"
10058050-132 = "I am a super pretty maid."
10058050-133 = "Never mind that. According to the rules, a contestant who transforms is classified as a tank."
10058050-134 = "Since the rule is one tank per team, having two counts as a penalty."
10058050-135 = "Hahaha! Serves you right!"
10058050-136 = "And... because the vehicle body is damaged and unable to move, the C&C team is also eliminated."
10058050-137 = "You gotta be kidding me?!"
10058050-138 = "Ahaha! Ah, that was fun~!"
10058050-139 = "We lasted longer than expected."
10058050-140 = "Gehenna seems to have a lot of hot springs,#nso shall we go enjoy those and then maybe hit up karaoke?"
10058050-141 = "Why are you guys taking this so easily?!"
10058050-142 = "We all had plenty of fun, so isn't that enough?"
10058050-143 = "Toki, get over here!! We're settling this again! What you just did was totally a foul!!"
10058050-144 = "No."
10058050-145 = "You're bad at this, Senpai."
10058050-146 = "I don't bother with small fry."
10058050-147 = "Who the hell is small fry, you punk?!"
10058050-153 = "You two are so faaaast! Ahaha!"
10058050-154 = "Hehe, looks like you still have plenty of energy left."
10058050-157 = "Is that what they call a powered exoskeleton?! Amazing!!"
10058050-158 = "Forget that, if we take this narrow path, the third target is right there! Let's hurry!"
10058050-159 = "What if we run into someone else like before...!"
10058050-160 = "That's exactly why we're taking the side street!"
10058050-161 = "And what if that puts extra strain on the transmission?"
10058050-162 = "Jeez~! Then what do you want to do?!"
10058050-163 = "Ah."
10058050-164 = "Tank, ahead."
10058050-165 = "There's an enemy here, too!!"
10058050-166 = "Load! Load! Hurry, hurry, hurry!!"
10058050-167 = "Gugigigi~! These shells are way too heavy~! Why'd they have to go and remove the hoist?!"
10058050-168 = "We didn't think we'd be shelling anything other than targets! They said it was a race!"
10058050-172 = "L-Load a HEAT shell! Give me the target info~!"
10058050-183 = "1 o'clock direction! Range, 130!"
10058050-184 = "Currently, the enemy tank is..."
10058050-189 = "...Hitchhiking?"
