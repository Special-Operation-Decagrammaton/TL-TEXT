[translation]
10011105-1 = "Эпилог; После фестиваля"
10011105-2 = ""
10011105-4 = "Так скандал, потрясший академию Хяккияко, завершился под видом представления."
10011105-5 = ""
10011105-9 = "Хахаха! Вот это событие! Тебе понравилось, Ибуки?"
10011105-10 = "Ага! Было очень весело!"
10011105-11 = "...Это было утомительно. Во всех смыслах."
10011105-13 = "Моурё всё твердили, что за инцидентом стоял некто по имени Профессор Самодовольство, но к тому времени, как мы вышли на их след, они уже исчезли."
10011105-14 = "...Ненавижу незаконченные дела."
10011105-15 = "Почему ничего никогда не может пройти спокойно?"
10011105-17 = "Что такое, Ироха? Почему у тебя такой вид, будто глава Префектов наступила на твою любимую книгу?"
10011105-18 = ""
10011105-20 = ""
10011105-21 = "Ибуки, что это у тебя? Раньше я такого не видела."
10011105-22 = "Это? Это ниндзя, которого Ибуки подарили девушки-ниндзя!"
10011105-23 = "Ниндзя? Как в комиксах? Я не понимаю."
10011105-24 = "Не-а! Ниндзя настоящие! Поняла? И они очень-очень крутые! Так что слушай внимательно!"
10011105-26 = "А что касается Клуба исследования ниндзюцу после инцидента..."
10011105-27 = ""
10011105-30 = "[ns] «Эй, их показывают в новостях.»"
10011105-32 = "А теперь следующая новость..."
10011105-33 = "На недавней встрече по обмену между академиями Хяккияко и Геенна все обсуждают невероятные подвиги Клуба исследования ниндзюцу во время представления!"
10011105-34 = "Вот что люди говорят об их внезапном появлении!"
10011105-36 = "Вы слышали? Испытание Спящей красавицы они прошли как прогулку в парке!"
10011105-37 = "Они одолели читающего мысли члена Клуба внутренней дисциплины, даже не задумавшись!"
10011105-38 = "А я слышал, что они буквально водили Общество Пандемониума за нос!"
10011105-39 = "Они на танке разнесли кинодеревню! Настоящие беззаконники!"
10011105-41 = "Мы решили проверить эти заявления."
10011105-42 = "И обнаружили шокирующий факт! Оказывается, никакой официальной организации под названием «Клуб исследования ниндзюцу» вообще не существует!"
10011105-43 = "Так кто же эти загадочные члены клуба? Призраки? Или группа сверхсекретных агентов, тайно действующих под руководством Клуба Инь-Ян?"
10011105-44 = "Чтобы раскрыть правду, мы..."
10011105-45 = ""
10011105-48 = "[ns] «Иногда СМИ пугают.»"
10011105-50 = "(Слухи повсюду. Всё сообщество захлестнула медийная истерия...)"
10011105-52 = ""
10011105-56 = "Достопочтенный Сенсей! Вам нужно меня спрятать!"
10011105-57 = "С-Сенсей... П-Пожалуйста, помогите...!"
10011105-58 = "Пожалуйста!"
10011105-59 = "[s] «Что происходит, девочки?»"
10011105-60 = "Кахо уже наступает нам на пятки! Она даже натравила на нас Клуб Инь-Ян!"
10011105-61 = "Из-за недавнего инцидента!"
10011105-63 = "Хм? Вы хотите официального признания клуба, потому что выступление прошло успешно?"
10011105-64 = "Я не отрицаю и не преуменьшаю вашу помощь, но есть более срочный вопрос."
10011105-65 = ""
10011105-70 = "Счёт. За весь ущерб, нанесённый во время представления."
10011105-71 = "За полное уничтожение кинодеревни Хяккияко... считайте восьмизначную сумму щедрым предложением."
10011105-72 = ""
10011105-74 = ""
10011105-75 = "Мы с радостью выполним свою часть сделки. Как только вы погасите долги."
10011105-77 = "Это нелепо! Всё из-за той девчонки из Пандемониума, которая решила покататься на танке!"
10011105-78 = "Хах... Блин. Я начинаю думать, что все эти мучения вообще не стоили усилий."
10011105-79 = "Какой же кошмар..."
10011105-80 = ""
10011105-82 = ""
10011105-83 = "Достопочтенный Сенсей."
10011105-84 = "[s] «Да, Мичиру?»"
10011105-85 = "Эм... Я просто хотела сказать..."
10011105-86 = "Простите. За всё."
10011105-87 = "[s] «Мичиру? Извиняется?»"
10011105-88 = "Не надо так удивляться!"
10011105-89 = "Я знаю, что иногда бываю совершенно бесстыжей, ясно?!"
10011105-90 = "Я доставила вам немало хлопот и знаю, что со мной было нелегко... местами..."
10011105-91 = "Наверное, я вас ужасно раздражала, да?"
10011105-92 = "[s] «Ничего страшного. Я учитель. Моя работа — помогать ученикам справляться с такими вещами.»"
10011105-93 = "Это самая взрослая вещь, которую я когда-либо слышала."
10011105-95 = "А ещё... Эм. Я последовала вашему совету и поговорила с Изуной и Цукуё."
10011105-96 = "Ну, обо всём этом и о моих чувствах насчёт официального признания клуба."
10011105-97 = "И мы вместе приняли решение. Наверное, мне всё ещё страшно."
10011105-98 = "Может, мне просто нужно немного времени. Я спросила, не будут ли они против, если мы пока отложим это дело."
10011105-99 = "И обе сказали..."
10011105-101 = "[ns] «Что всё нормально и ничего страшного?»"
10011105-102 = "...Ага."
10011105-103 = ""
10011105-105 = ""
10011105-106 = "Мне действительно достались лучшие младшие студенты в мире."
10011105-109 = "[ns] «Тогда, может, пойдём купим всем новый мерч с Нинперо?»"
10011105-110 = "А?"
10011105-111 = "Что?"
10011105-112 = "Господин?! Правда-правда?!"
10011105-113 = "[s] «Правда-правда. В награду за всю вашу тяжёлую работу.»"
10011105-114 = "Достопочтенный Сенсей, вы лучший!"
10011105-115 = "Подарок от моего господина?! Я сохраню его как семейную реликвию!"
10011105-116 = "[s] «Мне кажется, вы все немного преувеличиваете.»"
10011105-117 = "Я буду беречь его каждый день до конца жизни! Это будет моё сокровище!"
10011105-118 = "[s] «П-Потому что это ценный мерч...»"
10011105-119 = "Я тоже! Буду уважать его так же сильно, как достопочтенного Сенсея! Каждый день буду выводить его на прогулку!"
10011105-120 = "[s] «Это всего лишь плюшевая игрушка!»"
10011105-122 = "(На этом всё и закончилось.)"
10011105-123 = "(...Хотя на самом деле оставалось ещё кое-что.)"
10011105-125 = ""
10011105-129 = "(Где-то в кинодеревне, в слегка прохладный день.)"
10011105-130 = "Хи-хи-хи."
10011105-131 = "Бвахаха. Как всегда, я прекрасно повеселилась!"
10011105-132 = "По крайней мере, я так считаю. Хи-хи, а вы?"
10011105-133 = "Сенсей?"
10011105-134 = "[s] «Да, Ния?»"
10011105-135 = ""
10011105-136 = "Нам удалось провести эту встречу по обмену благодаря сотрудничеству с Шале."
10011105-137 = "Именно вашему сотрудничеству! Огромное спасибо за всю вашу помощь!"
10011105-138 = "[s] «Не стоит.»"
10011105-140 = "[ns] «Но тебе не кажется, что ты упускаешь главное?»"
10011105-141 = "О-о-о, а я ведь пыталась создать настроение. Вы так раните мои бедные чувства."
10011105-142 = "[s] «Всё это устроила ты, не так ли, Ния?»"
10011105-143 = "Вы вот так сразу и спросите? Почему бы не насладиться моментом? Медленно подвести меня к признанию?"
10011105-144 = ""
10011105-146 = ""
10011105-147 = "И у вас есть какие-нибудь доказательства?"
10011105-148 = "[s] «Моурё прошли через охрану как нож сквозь масло и похитили Ибуки. Они знали, как попасть внутрь.»"
10011105-149 = "А-ха! Значит, вы думаете, ничего бы не случилось, если бы Клуб Инь-Ян с самого начала принял надлежащие меры предосторожности."
10011105-150 = "Иными словами, вы обвиняете Клуб Инь-Ян в том, что он с самого начала был замешан."
10011105-151 = "Хи-хи."
10011105-152 = "Дзынь-дзынь-дзынь. Верно."
10011105-153 = "[s] «У тебя даже ума не хватает соврать.»"
10011105-155 = "Потому что мне незачем лгать."
10011105-156 = "Я просто хотела лично убедиться, действительно ли знаменитый Сенсей из Шале настолько силён и способен, как я слышала."
10011105-157 = "Хахаха. Этот Клуб исследования ниндзюцу."
10011105-158 = "Надо признать, занятная компания."
10011105-160 = "Но в конечном счёте это троица безнадёжных дурочек, которые даже собственный клуб не могут официально зарегистрировать."
10011105-161 = "Но эти разношёрстные девочки вам понравились, и вы помогли им героически спасти принцессу. Вы сделали невозможное возможным."
10011105-162 = "Я поняла это, наблюдая, как они бесстрашно проходили одно испытание за другим."
10011105-163 = "Вы и правда ничуть не менее впечатляющи, чем о вас говорят, Сенсей из Шале."
10011105-164 = "Я была просто поражена!"
10011105-165 = "[s] «Вот как? Правда?»"
10011105-167 = "Ох. Вы расстроены, узнав, что именно я устроила весь этот скандал?"
10011105-168 = "Или, может быть, испытываете отвращение?"
10011105-169 = "Манипулирую людьми, как мне вздумается..."
10011105-170 = "Выжимаю из них максимум удовольствия для себя..."
10011105-171 = "Я вам отвратительна? При виде меня у вас мурашки по коже? Хи-хи."
10011105-172 = "[s] «Ния.»"
10011105-173 = "Да-а-а-а, Сенсей?"
10011105-174 = "[s] «Время для нравоучений.»"
10011105-175 = ""
10011105-177 = ""
10011105-178 = "...Что, простите?"
10011105-179 = "[s] «Садись, Ния. Сейчас тебя будут серьёзно отчитывать.»"
10011105-180 = "Отчитывать? ...Сенсей?"
10011105-181 = "Не хотелось бы мне это говорить, правда. Но разве эта ситуация не требует... не знаю, чуть больше драмы и величия?"
10011105-182 = "Я ведь только что очень эффектно раскрывала свой тёмный тайный план! А вы собираетесь отчитывать меня как ребёнка — это же полностью портит атмосферу!"
10011105-183 = "[s] «Ну что ж, приготовься, малышка. Мне есть что тебе сказать.»"
10011105-184 = ""
10011105-187 = ""
10011105-189 = "Вы... Вы серьёзно?"
10011105-190 = "Что?! Сенсей, перестаньте так страшно смотреть! АААААААЙ?!"
10011105-192 = "Скандал, может, и закончился, но разбираться с последствиями..."
10011105-193 = "Что ж, на это понадобится ещё немного времени."
10011105-194 = "Нескрываемое сердце"
