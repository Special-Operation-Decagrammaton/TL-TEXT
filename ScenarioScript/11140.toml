[translation]
11140-2 = "Episódio 14;Em Ação! A Gangue Mascarada de Maiô (2)"
11140-3 = "Banco"
11140-7 = "Obrigado por esperar, cliente."
11140-8 = "O que quer dizer com \"obrigado por esperar\"?! Eu esperei mesmo! Por 6 horas! Bem aqui!!"
11140-9 = "Por que a análise de um empréstimo demora meio dia inteiro?! Nem parecia ter ninguém na minha frente!"
11140-10 = "Minhas acompanhantes ficaram tão cansadas de esperar que até pegaram no sono naquele sofá!"
11140-11 = "São questões internas da nossa instituição. Peço a sua compreensão."
11140-12 = "...A propósito, Srta. Aru. Não creio que a senhorita esteja em posição de adotar essa atitude, não é mesmo?"
11140-13 = "A-Ah, ugh..."
11140-14 = "Se precisa da ajuda do nosso banco, saber esperar com paciência também é importante.#n...Ah, e quanto às suas acompanhantes, não podemos permitir que durmam ali."
11140-15 = "(Estalo) Segurança. Por favor, acorde aquela mendiga... digo, aquela cliente."
11140-17 = "Ei, acorda, acorda!"
11140-18 = "Mmm..."
11140-19 = "Uah?! O quê, o quê?!"
11140-20 = "(Abre os olhos) ...!!"
11140-21 = "Aah... D-Desculpe, desculpe por ter cochilado!!"
11140-23 = "..."
11140-24 = "Pois bem, vamos conferir juntas. Seu nome é... Srta. Aru Rikuhachima.#nAluna do 2º ano da Academia Gehenna, correto?"
11140-25 = "Atualmente presidente da Faz-Tudo 68, certo...?#nEssa agência não seria uma empresa de fachada? Nos documentos, as finanças estão em frangalhos."
11140-26 = "N-Nós ganhamos dinheiro sim! Só não conseguimos cobrar o pagamento dos serviços ainda..."
11140-27 = "Além disso, há apenas 4 funcionárias incluindo a presidente, mas vocês têm chefe de departamento, gerente de seção e funcionária júnior...#nNão é um desperdício de cargos? Estão brincando de empresinha?"
11140-28 = "I-Isso é... T-Ter cargos assim ajuda a conseguir clientes..."
11140-29 = "E mais uma coisa: o aluguel do escritório é alto demais sem necessidade.#nPrecisam encontrar um imóvel compatível com a situação financeira de vocês."
11140-30 = "U-Um escritório decente ajuda... a conseguir clientes..."
11140-31 = "..."
11140-32 = "Srta. Aru. Nessas condições, fica difícil aprovar o empréstimo."
11140-33 = "Quê?! Nããão?!"
11140-34 = "Que tal começar buscando um emprego mais estável? Trabalhos diários ou temporários são bem rápidos de conseguir, por exemplo."
11140-35 = "Hã? Hããã?!"
11140-38 = "(Treme-treme)"
11140-39 = "(Que raiva... Será que eu devia quebrar tudo aqui e levar o dinheiro do banco embora?)"
11140-40 = "(...Não, nada feito. Mesmo que eu conseguisse sair daqui com o dinheiro, escapar do Mercado Negro seria quase impossível. Tem Guardas do Mercado por todo lado...)"
11140-41 = "(...Mas, pensando bem, talvez eles nem sejam grande coisa.#nNós quatro juntas talvez conseguíssemos derrubar todo mundo e fugir...)"
11140-42 = "(...Aaah, esquece, sem chance. Comprar briga com o Mercado Negro...#nNão tenho coragem pra isso...)"
11140-43 = "(Droga, o que é isso? Que patético... Eu tinha decidido me tornar a maior fora-da-lei de Kivotos. E agora...)"
11140-44 = "(Empréstimo pra cá, empréstimo pra lá... Ficando estressada com umas bobagens dessas...)"
11140-45 = "(Não é isso que eu quero... Eu quero ser uma fora-da-lei implacável, que não teme nada nem se prende a nada...)"
11140-47 = "(Era isso que eu queria ser...)"
11140-48 = "...Srta., Srta. Aru!"
11140-49 = "U-Uau?! S-Sim?! ...Hum, disse alguma coisa?"
11140-50 = "A solicitação de empréstimo não foi aprovada. Lamento não poder ajudar."
11140-51 = "Q-Quê?! E-Espera um pouco!!"
11140-52 = "(Tlec!)"
11140-53 = "O-O que aconteceu? Queda de energia?!"
11140-54 = "Q-Quem foi?! Até os computadores desligaram!"
11140-55 = "(Ratatatata! Ratatatata!!)"
11140-56 = "Tiros?!"
11140-59 = "Uah! Aaaaah!"
11140-60 = "Uaaaah!"
11140-63 = "O-O que está acontecendo... Uaaah!!"
11140-65 = "(Tlec!)"
11140-67 = "(Tã-dã!)"
11140-70 = "Todo mundo no chão! Larguem as armas!"
11140-71 = "Se não obedecerem, vão se dar mal☆"
11140-72 = "A-Ahaha... Pessoal, não queremos que ninguém se machuque, então... por favor, deitem no chão..."
11140-74 = "A-Assalto a banco?!"
11140-75 = "Emergência! Emergência!"
11140-76 = "Uhe~ Nem adianta~#nEu já cortei a energia do sistema de alarme externo, viu~"
11140-77 = "I-Iik!"
11140-78 = "Ei, você aí!! Já mandei ficar no chão! Se fizer gracinha, vai pro além!!"
11140-79 = "Pessoal, por favor, fiquem paradinhos... Ahh..."
11140-80 = "Uhe~ Até aqui, tudo conforme o plano! Vamos pro próximo passo!#nLíder Faust! Aguardando suas ordens!"
11140-81 = "Quê?! Quê?! Faust... s-sou eu? Líder? Eu?!"
11140-82 = "É a líder! A chefona! E, a propósito, eu sou..."
11140-83 = "Christina, da Gangue dos Maiôs Mascarados♧"
11140-84 = "Argh, que papo é esse?! Desde quando a gente se chama Gangue dos Maiôs Mascarados?! E é brega demais!"
11140-85 = "..."
11140-86 = "Uhe, a Faust dá medo quando fica brava, sabia? Se não obedecer, vai levar bronca, hein~"
11140-87 = "Ahh... Acabei virando a líder... Desse jeito, vou manchar o nome do Tea Party..."
11140-89 = "Ué... Aquelas ali..."
11140-90 = "A... Abydos...?"
11140-91 = "É mesmo, são as garotas de Abydos. Tem um rosto que eu não conheço ali também.#n...O que será que elas estão fazendo aqui? Ainda mais usando máscaras."
11140-92 = "S-Será que o alvo delas somos nós?! Se for, vamos acabar com elas!!"
11140-93 = "Não, o alvo não parece ser a gente... O que essas garotas pretendem?#nSerá que vão assaltar...?"
11140-94 = "Ai, ai, o que a Aru-chan está fazendo?"
11140-96 = "Os pontos cegos das câmeras, a rota dos seguranças, a planta do banco... Tenho tudo na cabeça. Não tentem resistir."
11140-97 = "Agora, você aí, coloque dentro desta bolsa. Do carro-forte que chegou há pouco..."
11140-98 = "E-Entendido! Eu dou tudo o que quiserem! Dinheiro, títulos, barras de ouro, levem o quanto quiserem!!"
11140-99 = "N-Não é isso... O registro de cobranças..."
11140-102 = "A-Aqui está! Enchi até a boca! Por favor, poupe a minha vida!!"
11140-103 = "Ah... H-Hum..."
11140-106 = "..."
11140-107 = "(C-Caramba!! Quem são essas garotas?! Assaltar um banco do Mercado Negro!)"
11140-108 = "(Como será que elas pretendem fugir? Não, antes disso, ainda existem foras-da-lei capazes de bolar um plano tão ousado assim?!)"
11140-109 = "(Elas são rápidas demais, super profissionais. Parece até que nasceram só pra fazer isso. Resolveram tudo em cinco minutos!)"
11140-110 = "(Q-Que incrível...! De arrepiar! Isso sim são verdadeiras foras-da-lei! Ahh... Acho que vou chorar!)"
11140-112 = "Ela não percebeu nada mesmo..."
11140-113 = "Pelo contrário, está até com os olhos brilhando."
11140-114 = "Haaah..."
11140-115 = "N-Nós devemos ficar aguardando aqui?"
11140-116 = "...Não temos motivo pra ajudar aquelas garotas, nem pra ficar do lado do banco.#nE, com a presidente naquele estado... Melhor ficarmos escondidas por enquanto."
11140-117 = "S-Sim..."
11140-120 = "Ei, Shiro... d-digo, Blue-senpai! Conseguiu a encomenda?"
11140-121 = "Ah, s-sim. Peguei."
11140-122 = "Então vamos dar o fora! Retirada geral!"
11140-123 = "Adio~s☆"
11140-124 = "P-Parece que ninguém se machucou... Desculpem o transtorno, tchauzinho!!"
11140-125 = "(Vuum!)"
11140-127 = "P-Peguem elas!! Bloqueiem as ruas! Avisem os Guardas do Mercado!"
11140-129 = "Não deixem nenhuma escapar!!"
