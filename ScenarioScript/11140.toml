[translation]
11140-2 = "Эпизод 14;Банда в масках и купальниках! Часть 2"
11140-3 = "Банк"
11140-4 = ""
11140-6 = ""
11140-7 = "Прошу прощения за небольшую задержку... Ару, верно?"
11140-8 = "Это вы называете небольшой задержкой?! Я жду здесь уже шесть часов!"
11140-9 = "Что это вообще за собеседование по кредиту?! Я весь день здесь,#nа перед нами даже никого не было!"
11140-10 = "Посмотрите на моих подчинённых! Мы ждали так долго, что они уже отключились на диване!"
11140-11 = "У нас возникли внутренние проблемы. Приносим извинения."
11140-12 = "Однако не уверена, что вы в том положении, чтобы что-то требовать, мисс Ару."
11140-13 = "У-ух..."
11140-14 = "Для человека, которому нужна помощь нашего банка, ожидание — меньшее из зол. К тому же спать на общей мебели считается дурным тоном."
11140-15 = "*щёлкает пальцами* Охрана. Разбудите этих бездельников... то есть клиентов..."
11140-17 = "Так, так! Подъём! Пора просыпаться!"
11140-18 = "Хр-р..."
11140-19 = "А-а?! Какого чёрта?!"
11140-20 = "...!"
11140-21 = "П-простите! Нам очень жаль! Не стоило нам засыпать!"
11140-22 = ""
11140-23 = "..."
11140-24 = "*листает* Так, посмотрим. Имя... Рикухатима Ару.#nПринадлежность: второй курс Академии Геенна."
11140-25 = "Текущее место работы: глава Решал 68... По мне, это похоже на фирму-однодневку. Ваши финансовые документы — полный беспорядок."
11140-26 = "Н-нет! Мы совершенно легальны! Просто нам ещё не заплатили за некоторые заказы!"
11140-27 = "А это что? У вас всего три подчинённые, зато у каждой особая должность... Начальник штаба, глава отдела и рядовой сотрудник? Не слишком ли громко? Вы играете в настоящую компанию?"
11140-28 = "Если хочешь получать заказы, нужно поддерживать имидж..."
11140-29 = "Не хотите объяснить, зачем вы арендуете настолько роскошный офис?#nВы же должны понимать, что живёте явно не по средствам."
11140-30 = "Н-ну... чтобы заработать деньги, сначала надо их потратить...?"
11140-31 = "..."
11140-32 = "Ох-ох, Ару. Похоже, дела у тебя идут совсем неважно."
11140-33 = "Э-этого не может быть!"
11140-34 = "Настоятельно рекомендую вам немедленно найти нормальную работу. Может, попробовать рынок подёнщиков ранним утром?"
11140-35 = "Ч-что вы сказали?!"
11140-36 = ""
11140-37 = ""
11140-38 = "*щёлк*"
11140-39 = "(Ах ты мелкая... Да я сейчас тут всё разнесу и ограблю этот банк!)"
11140-40 = "(Нет, надо успокоиться. Даже если я разгромлю это место, выбраться с Чёрного рынка — совсем другое дело. Тут повсюду патрулирует охрана...)"
11140-41 = "(Хотя... так ли это страшно? Может, эти ребята на самом деле не такие уж сильные. Кто сказал, что мы вчетвером не сможем прорваться отсюда с боем и уложить их всех?)"
11140-42 = "(Хотя нет... у меня не хватит духу сделать врагом весь Чёрный рынок.)"
11140-43 = "(Как же жалко. Я хотела стать величайшей преступницей всего Кивотоса, а теперь посмотрите на меня...)"
11140-44 = "(Этот кредит, мой бизнес... Всё это только бесконечная головная боль.)"
11140-45 = "(Я совсем не этого хотела... Я хотела быть крутой преступницей.#nНастоящим свободным духом, которого ничто не сдерживает — даже страх.)"
11140-47 = "(Это всё, чего я когда-либо хотела.)"
11140-48 = "Ару, вы меня слушаете?!"
11140-49 = "К-конечно слушаю! Так... можете повторить?"
11140-50 = "Я сказала: ваша заявка на кредит отклонена. А теперь можете идти."
11140-51 = "Что?! П-погодите секундочку!"
11140-52 = "*бабах*"
11140-53 = "Что происходит? Электричество отключилось?!"
11140-54 = "Кто-то выбил пробки? Все компьютеры отключились!"
11140-55 = "*пах* *пах* *пах* *тат*"
11140-56 = "Стрельба?!"
11140-59 = "Гр-р-рх!"
11140-60 = "А-а-арх!"
11140-63 = "Что происходит? Ух!"
11140-65 = "*дзынь*"
11140-66 = ""
11140-67 = "*та-дам!*"
11140-68 = ""
11140-70 = "Всем на пол! Оружие бросить, руки держать на виду!"
11140-71 = "Кто не подчинится — получит хорошую взбучку! ☆"
11140-72 = "Э-это ограбление... ложитесь на пол, если не хотите пострадать... пожалуйста!"
11140-73 = ""
11140-74 = "Г-грабители банка?!"
11140-75 = "*УИУ-УИУ* *УИУ-УИУ* Тревога! Тревога!"
11140-76 = "Бесполезно. Внешняя система безопасности уже отключена."
11140-77 = "*ахает*"
11140-78 = "Эй, ты там! Тебе сказали лечь на пол!#nЕщё один фокус — и я понаделаю дырок в твоих схемах!"
11140-79 = "Пожалуйста, просто делайте, как мы говорим. Пожалуйста..."
11140-80 = "Хе! Всё идёт по плану! Пора переходить к следующей фазе. Отдавай приказы, Фауст!"
11140-81 = "Что?! Вы это мне?!"
11140-82 = "Конечно — ты же лидер! Босс! А я, между прочим..."
11140-83 = "Я Кристина из Банды в масках и купальниках! ♧"
11140-84 = "Эй, когда это мы решили взять себе имена?! И что это вообще за выбор? Звучит ужасно!"
11140-85 = "..."
11140-86 = "Хе-хе! Лучше делайте, как говорит Фауст. Не стоит её злить.#nВам не понравится, когда она злится."
11140-87 = "Я... Ох, боже. Как я вообще оказалась главарём? И как мне теперь смотреть в глаза Чаепитию?"
11140-89 = "Погодите... Разве это не...?"
11140-90 = "Студенты из Абидоса?!"
11140-91 = "Точно. Хотя, кажется, с ними кто-то новенький.#nКакого чёрта они здесь делают? И что за маски?"
11140-92 = "О-они пришли за нами?! М-мне их всех уничтожить?"
11140-93 = "Нет, не думаю, что они здесь из-за нас... Что они вообще делают? Они грабят банк?"
11140-94 = "Что ты делаешь, Ару?"
11140-96 = "Я запомнила слепые зоны камер, позиции охраны и внутреннюю планировку банка. Так что пусть никто не делает глупостей, иначе..."
11140-97 = "Так, ты там. Тот инкассаторский грузовик, который только что уехал.#nВозьми этот мешок и..."
11140-98 = "К-конечно! Наличные, облигации, золото — всё, что захотите! Вот!"
11140-99 = "Нет, эм... Мне нужны транспортные журналы..."
11140-100 = ""
11140-101 = ""
11140-102 = "В-вот! Я набил столько, что мешок сейчас лопнет! Только не трогайте меня!"
11140-103 = "Э-эм... Спасибо..."
11140-104 = ""
11140-105 = ""
11140-106 = "..."
11140-107 = "(Они правда грабят банк Чёрного рынка! Это та-а-ак круто!)"
11140-108 = "(Как они собираются уйти? И главное — откуда у них столько СМЕЛОСТИ на такое?!)"
11140-109 = "(Посмотрите на это спокойствие и хладнокровие. Они профессионалы. Будто родились для этого. И провернули всё за каких-то пять минут!)"
11140-110 = "(Э-это великолепно! Вот это крутизна! Вот они — настоящие преступники! Я сейчас расплачусь.)"
11140-111 = ""
11140-112 = "Она вообще ничего не понимает..."
11140-113 = "Она что, правда сейчас прослезилась?"
11140-114 = "*вздыхает*"
11140-115 = "Эм, нам просто стоять здесь?"
11140-116 = "Ни им, ни банку помогать нам незачем. А учитывая состояние Ару... лучше вообще не вмешиваться."
11140-117 = "Как скажешь..."
11140-118 = ""
11140-120 = "Эй, Широ... то есть, эм... Синяя. Добыча у тебя?"
11140-121 = "Д-да. Орёл приземлился."
11140-122 = "Тогда живее! Выдвигаемся!"
11140-123 = "Ну что ж. Адьос! ☆"
11140-124 = "П-похоже, никто не пострадал. П-простите за всё это. Спасибо и хорошего вам дня!"
11140-125 = "*вжух*"
11140-127 = "Н-не дайте им уйти! Перекрыть дороги! Связаться с охраной Чёрного рынка!"
11140-128 = ""
11140-129 = "Их нужно немедленно поймать!"
