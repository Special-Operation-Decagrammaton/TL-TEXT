[translation]
1014705-1 = "Satsuki's Pain Prevention"
1014705-2 = "(Satsuki, who has finally gotten used to being in the water, went out for a swim.)"
1014705-7 = "Heh, not bad at all."
1014705-8 = "But, I can also—"
1014705-12 = "[ns] \"Gotcha!\""
1014705-13 = "Eek!?"
1014705-19 = "[ns] \"Hehehe, you've got quite a lot of nerve chatting in the middle of a battle!\""
1014705-21 = "Ugh... hey! You got seawater in my mouth..."
1014705-25 = "Honestly, Sensei—"
1014705-29 = "Kyaaaaah!!"
1014705-34 = "[ns] \"C-calm down! Satsuki! It's just seaweed!\""
1014705-37 = "Haa, haa... I thought it was the tentacle of some unknown monster..."
1014705-38 = "It was black and slimy... ugh...!"
1014705-39 = "Whether it's wakame or kelp, I really don't like seaweed..."
1014705-40 = "[s] \"Sorry... I went a bit too far with the prank...\""
1014705-41 = "What's with that hangdog look?"
1014705-42 = "Well... I know you didn't mean it, so I'll forgive you this time."
1014705-43 = "But still, the ocean is a scary place. You can never be too careful."
1014705-44 = "Seaweed is one thing, but... look at that thing floating over there—"
1014705-45 = "Hey! There's a jellyfish!!"
1014705-46 = "Whoa! Run away!"
1014705-47 = "...Yes, exactly like that."
1014705-48 = "Sensei, do you know much about jellyfish?"
1014705-49 = "[s1] *Nod nod.*\n[s2] *Shake shake.*"
1014705-52 = "Jellyfish are one of the most dangerous things in the ocean."
1014705-53 = "Things like the Portuguese man o' war are extremely venomous, so you must never touch them."
1014705-54 = "If you see a blue or purple jellyfish, keep your distance immediately."
1014705-55 = "Of course, be careful of transparent ones like box jellyfish, too."
1014705-56 = "If you get stung, it hurts sooooo much. Ugh... just imagining it gives me the chills..."
1014705-57 = "[s] \"Satsuki, you're really knowledgeable!\""
1014705-58 = "Isn't that obvious?"
1014705-59 = "I used the full resources of the Pandemonium Society's Intelligence Department to research all the dangers of the sea."
1014705-60 = "..."
1014705-61 = "I-I'm getting scared just talking about it. Let's go a bit further away..."
1014705-63 = "(While moving with Satsuki...)"
1014705-70 = "Walking in the ocean is harder than I thought. Don't let go of my hand, Sensei."
1014705-74 = "...?"
1014705-75 = "W-wait! Something just touched my leg—"
1014705-79 = "J-jellyfish...! My... my leg...!"
1014705-84 = "(Before I could even check the situation, Satsuki clung to me.)"
1014705-88 = "S-Sensei! On my thigh! A jellyfish!"
1014705-89 = "N-no... this is the end...!"
1014705-90 = "It's coming...! The unbearable pain...!"
1014705-94 = "[ns3] \"This is...\"\n[ns4] \"It's a plastic bag.\""
1014705-98 = "...Huh? ...Oh."
1014705-99 = "Honestly! Who would throw something like this into the ocean!"
1014705-100 = "Haa... haa... haa..."
1014705-101 = "[s] \"Satsuki, I can't move like this...\""
1014705-102 = "Just wait a moment... My knees have gone weak..."
1014705-106 = "Sensei, your body is so warm."
1014705-111 = "Maintaining body temperature is important in the ocean, too. So, just like this for a little longer..."
1014705-113 = "(Satsuki didn't let go for a while.)"
1014705-114 = "(After that, Satsuki and I picked up trash on the beach.)"