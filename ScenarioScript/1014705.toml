[translation]
1014705-1 = "План Сацуки по борьбе с болью"
1014705-2 = "Мы с Сацуки снова отправились к морю, ведь теперь она стала увереннее чувствовать себя в воде."
1014705-3 = ""
1014705-6 = ""
1014705-7 = "Фу-фу. Вы весьма яростно разбрызгиваете воду... и довольно далеко."
1014705-8 = "Однако! Сейчас вы увидите приём Кёгоку Сацуки...!"
1014705-9 = ""
1014705-11 = ""
1014705-12 = "[ns] «Вот она, брешь в защите!»"
1014705-13 = "Кья-а-а?!"
1014705-14 = ""
1014705-19 = "[ns] «Ва-ха-ха! Напал, пока ты говорила!»"
1014705-20 = ""
1014705-21 = "Ух, фу! Солёная морская вода попала мне в рот..."
1014705-22 = ""
1014705-24 = ""
1014705-25 = "Что это...?"
1014705-26 = ""
1014705-28 = ""
1014705-29 = "Кья-а-а!!"
1014705-30 = ""
1014705-34 = "[ns] «У-успокойся, Сацуки! Это всего лишь водоросли!»"
1014705-36 = ""
1014705-37 = "*тяжёлое дыхание* *тяжёлое дыхание*... Я думала, на меня напало щупальце неведомого чудовища..."
1014705-38 = "Длинное, чёрное, мягкое и склизкое...!"
1014705-39 = "Будь то вакаме или комбу, намокшие водоросли очень противны на ощупь!"
1014705-40 = "[s] «Прости... Это я тебя разыграл...»"
1014705-41 = "Хм? Что это у вас за выражение лица?"
1014705-42 = "Главное — намерения, а злого умысла у вас не было. Поэтому я прощаю вам этот проступок."
1014705-43 = "Я снова убедилась, насколько же страшно море. В нём бесконечно много вещей, способных застать врасплох."
1014705-44 = "Эти водоросли, и ещё что-то плавающее вон там..."
1014705-45 = "Медуза!!"
1014705-46 = "КЬЯ-А-А! Прочь с дороги!"
1014705-47 = "Вот так..."
1014705-48 = "Сенсей, вы хорошо разбираетесь в медузах?"
1014705-49 = "[s1] Энергично кивать.\n[s2] Покачать головой."
1014705-52 = "Как вы, вероятно, знаете, медузы — одни из самых опасных морских обитателей."
1014705-53 = "Например, синие медузы-зонтики чрезвычайно ядовиты, поэтому прикасаться к ним категорически нельзя."
1014705-54 = "Синяя? Фиолетовая? Уже сами эти цвета предупреждают: держитесь подальше."
1014705-55 = "Разумеется, бывают и совершенно бесцветные медузы. Кубомедузу вообще очень трудно заметить."
1014705-56 = "А вот её укус причиняет ужасную, невыносимую боль! Даже звучит жутко."
1014705-57 = "[s] «Сацуки, ты столько всего знаешь!»"
1014705-58 = "Конечно!"
1014705-59 = "Я задействовала все возможности разведывательного комитета Общества Пандемониума, чтобы изучить каждую опасность пляжа."
1014705-60 = "..."
1014705-61 = "В-во всяком случае, мне страшно, так что давайте отойдём немного в сторону, Сенсей..."
1014705-63 = "Пока мы с Сацуки отходили в сторону..."
1014705-64 = ""
1014705-66 = ""
1014705-67 = ""
1014705-68 = ""
1014705-69 = ""
1014705-70 = "Ходить в воде действительно утомительнее, чем кажется... Так что не отпускайте мою руку, Сенсей."
1014705-71 = ""
1014705-74 = "...?"
1014705-75 = "Ч-что-то коснулось моей ноги..."
1014705-76 = ""
1014705-78 = ""
1014705-79 = "Медуза...! У меня на ноге медуза!!"
1014705-80 = ""
1014705-84 = "Не успел я понять, что произошло, как Сацуки бросилась ко мне."
1014705-85 = ""
1014705-87 = ""
1014705-88 = "О-она у меня на бедре! Медуза у меня на бедре!"
1014705-89 = "Ва-а...! Мне конец, Сенсей!!"
1014705-90 = "Сейчас начнётся... Ужаснейшая боль...!! Будто тысячи игл вонзятся мне в кожу!"
1014705-91 = ""
1014705-94 = "[ns3] «Это...»\n[ns4] «Пластиковый пакет»."
1014705-97 = ""
1014705-98 = "...Хм? Правда?"
1014705-99 = "Да кто же всё время выбрасывает мусор в море?! Ну в самом деле?!"
1014705-100 = "*задыхается* *задыхается*"
1014705-101 = "[s] «Так и будешь на мне висеть?»"
1014705-102 = "Да... Море окончательно меня вымотало."
1014705-103 = ""
1014705-105 = ""
1014705-106 = "Какое у вас тёплое тело..."
1014705-107 = ""
1014705-109 = ""
1014705-110 = ""
1014705-111 = "К тому же, находясь в воде, важно сохранять тепло тела."
1014705-113 = "Сацуки ещё какое-то время не отпускала меня."
1014705-114 = "Позже мы прошлись вдоль берега и собрали весь попавшийся мусор, в том числе пластиковые пакеты."
