[translation]
1014708-1 = "Kyogoku Satsuki"
1014708-4 = "It's true, whenever I see you, Sensei—"
1014708-5 = "I feel happy and at ease."
1014708-6 = "I wonder why. Before... it didn't bother me at all if we couldn't meet."
1014708-7 = "Lately... I find myself constantly worrying about where you are, what you're doing, or if you've gotten into any danger."
1014708-8 = "[s1] \"I do get dragged into things sometimes... but I'm fine.\"\n[s2] \"Thank you for worrying about me, Satsuki.\""
1014708-11 = "...You put yourself last too often, Sensei. You need to take better care of yourself."
1014708-12 = "As the greatest collaborator the Pandemonium Society could ever boast—"
1014708-16 = "No. As the best partner that Kyogoku Satsuki recognizes."
1014708-17 = "[s] Nods."
1014708-18 = "...Hehe."
1014708-21 = "(I walked along the beach at night, chatting idly with Satsuki.)"
1014708-23 = "[ns] \"Come to think of it, Satsuki, you're not a fan of the dark, are you?\""
1014708-24 = "Yes."
1014708-25 = "Dark places make me anxious. I never know what might come out of the shadows..."
1014708-26 = "The darkness... it's scary, and I absolutely hate it..."
1014708-27 = "[s] \"It's night right now, though... are you okay?\""
1014708-28 = "Huh?"
1014708-29 = "I suppose... normally, I wouldn't go out at night, and if I did, I'd only walk in well-lit areas."
1014708-30 = "There are no lights here, so it's dark. By all rights, I should be terrified and miserable..."
1014708-31 = "But I'm not that scared, and I don't hate it. I wonder why..."
1014708-35 = "J-just in case... let's check to make sure there's no danger around."
1014708-42 = "This is..."
1014708-46 = "...Our footprints, aren't they?"
1014708-47 = "Yours and mine, side by side..."
1014708-48 = "[s] \"We've been walking together, after all.\""
1014708-49 = "..."
1014708-50 = "I see."
1014708-51 = "I understand now."
1014708-52 = "Why I'm not afraid."
1014708-57 = "...It's because you're here with me, Sensei."
1014708-62 = "[ns] (Suddenly, the scent of Satsuki tickles my nose.)"
1014708-66 = "[wa:2270]― [log=사츠키 수영복]Thinking back, [wa:1570]it was always like this, wasn't it?[/log]"
1014708-67 = "[wa:3410]― [log=사츠키 수영복]You were always [wa:1190]walking right [wa:900]beside me.[/log]"
1014708-70 = "[wa:610]― [log=사츠키 수영복]No matter how selfish I was—[/log]"
1014708-71 = "[wa:2690]― [log=사츠키 수영복]Even when I tried to torture you, [wa:2050]or put you under hypnosis.[wa:3570] [/log]"
1014708-73 = "― [log=사츠키 수영복]No matter what it was,[/log]"
1014708-74 = "[wa:1440]― [log=사츠키 수영복]You went along with it [wa:940]without a single complaint.[/log]"
1014708-77 = "[wa:560]― [log=사츠키 수영복]...Thank you [wa:1210]for saying you'd protect me.[/log]"
1014708-78 = "[wa:1040]― [log=사츠키 수영복]Thank you.[wa:2430] [/log]"
1014708-80 = "― [log=사츠키 수영복]When I was scared,[/log]"
1014708-81 = "[wa:1640]― [log=사츠키 수영복]Thank you for [wa:990]holding my hand.[wa:3900] [/log]"
1014708-83 = "― [log=사츠키 수영복]Thank you for [wa:410]always rushing over[/log]"
1014708-84 = "[wa:1950]― [log=사츠키 수영복]whenever I needed you.[/log]"
1014708-87 = "[wa:440]― [log=사츠키 수영복]So—[/log]"
1014708-88 = "[wa:3550]― [log=사츠키 수영복]I'm counting on you [wa:1560]from now on, [wa:1410]too, Sensei.[/log]"
1014708-91 = "I see... so that's how it was."
1014708-92 = "It seems I've wanted to tell you these things for a long time."
1014708-93 = "...I feel like there's still more I want to say, but I feel a little lighter now."
1014708-97 = "I think this is enough for today."
1014708-98 = "[ns] \"By the way...\""
1014708-100 = "[ns] \"Are we going to stay like this?\""
1014708-101 = "Yes."
1014708-102 = "Do you mind?"
1014708-103 = "[s] \"I don't mind, but...\""
1014708-104 = "When we're like this, I feel a sense of fulfillment."
1014708-108 = "You promised to protect me, didn't you? Just so you know, I won't accept any contract cancellations."
1014708-116 = "(We continued to walk along the beach, Satsuki staying close to my side.)"