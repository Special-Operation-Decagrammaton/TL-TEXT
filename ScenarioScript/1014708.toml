[translation]
1014708-1 = "Кёгоку Сацуки"
1014708-3 = ""
1014708-4 = "Когда я смотрю на вас..."
1014708-5 = "Мне становится радостно. И спокойно."
1014708-6 = "Интересно, почему? Раньше я даже не вспоминала о вас."
1014708-7 = "Но в последнее время я порой лежу без сна и думаю, где вы сейчас... Всё ли с вами хорошо..."
1014708-8 = "[s1] «Если честно, в моём случае это обоснованное беспокойство...»\n[s2] «Но спасибо, что переживаешь за меня, Сацуки»."
1014708-11 = "Хм... Сенсей, вы склонны незаметно для себя пренебрегать собственным благополучием. Вам стоит больше заботиться о себе."
1014708-12 = "Как важнейшему партнёру великого Общества Пандемониума..."
1014708-13 = ""
1014708-15 = ""
1014708-16 = "Нет, как самому дорогому спутнику Кёгоку Сацуки."
1014708-17 = "[s] Кивнуть."
1014708-18 = "...Фуфу."
1014708-21 = "Мы с Сацуки гуляли по ночному пляжу и разговаривали."
1014708-22 = ""
1014708-23 = "[ns] «Кстати, вспомнил... Ты же боишься темноты»."
1014708-24 = "Верно."
1014708-25 = "В темноте зрение ухудшается, и нападения можно ждать с любой стороны."
1014708-26 = "Это поистине ужасно... И я искренне ненавижу темноту."
1014708-27 = "[s] «Но сейчас ночь... Ты в порядке?»"
1014708-28 = "А?"
1014708-29 = "А. Обычно по ночам я нахожусь только при искусственном освещении или в помещении."
1014708-30 = "Такая темнота... обычно приводит меня в ужас."
1014708-31 = "Но сейчас я ничуть не тревожусь. И даже не понимаю почему."
1014708-32 = ""
1014708-34 = ""
1014708-35 = "Надо всё же осмотреться, н-на всякий случай. Убедиться, что вокруг не скрывается опасность."
1014708-36 = ""
1014708-38 = ""
1014708-39 = ""
1014708-40 = ""
1014708-41 = ""
1014708-42 = "Эти следы..."
1014708-43 = ""
1014708-45 = ""
1014708-46 = "А, это наши следы."
1014708-47 = "Наши следы на песке идут рядом."
1014708-48 = "[s] «Да. Ведь мы шли вместе»."
1014708-49 = "..."
1014708-50 = "Ах."
1014708-51 = "Я поняла."
1014708-52 = "Почему сейчас мне не страшно и темнота больше не властна надо мной."
1014708-53 = ""
1014708-55 = ""
1014708-56 = ""
1014708-57 = "...Потому что вы рядом."
1014708-58 = ""
1014708-60 = ""
1014708-62 = "[ns] Меня окутал аромат Сацуки."
1014708-66 = "― [log=사츠키 수영복]Если подумать, так было всегда.[/log][wa:2640]"
1014708-67 = "― [log=사츠키 수영복]Вы всегда оставались рядом со мной.[/log][wa:4780]"
1014708-70 = "― [log=사츠키 수영복]Даже когда я делала всё, что вздумается.[/log][wa:10]"
1014708-71 = "― [log=사츠키 수영복]Даже когда я мучила вас и гипнотизировала.[/log][wa:7470]"
1014708-73 = "― [log=사츠키 수영복]Спасибо...[/log][wa:10]"
1014708-74 = "― [log=사츠키 수영복]За то, что всегда были рядом.[/log][wa:1940]"
1014708-77 = "― [log=사츠키 수영복]Спасибо, что сказали, что защитите меня.[/log][wa:770]"
1014708-78 = "― [log=사츠키 수영복]что защитите меня.[/log][wa:2990]"
1014708-80 = "― [log=사츠키 수영복]Спасибо[/log][wa:10]"
1014708-81 = "― [log=사츠키 수영복]Спасибо, что держали меня за руку, когда было страшно.[/log][wa:5130]"
1014708-83 = "― [log=사츠키 수영복]Спасибо, что были рядом[/log][wa:10]"
1014708-84 = "― [log=사츠키 수영복]всякий раз, когда вы были мне нужны.[/log][wa:1270]"
1014708-87 = "― [log=사츠키 수영복]Поэтому...[/log]"
1014708-88 = "― [log=사츠키 수영복]Я и дальше... буду на вас полагаться.[/log][wa:5680]"
1014708-91 = "Фу-фу. Теперь я всё поняла."
1014708-92 = "Именно это я всё время хотела вам сказать."
1014708-93 = "Пусть многое ещё осталось невысказанным, но на душе у меня стало легче."
1014708-94 = ""
1014708-96 = ""
1014708-97 = "Тогда на сегодня закончим!"
1014708-98 = "[ns] «Кстати...»"
1014708-99 = ""
1014708-100 = "[ns] «Ты собираешься так и оставаться?»"
1014708-101 = "Безусловно!"
1014708-102 = "Почему? Вам не нравится?"
1014708-103 = "[s] «Ну, нет...»"
1014708-104 = "Когда мы вот так рядом, у меня на душе так тепло."
1014708-105 = ""
1014708-107 = ""
1014708-108 = "Вы сказали, что всегда будете рядом. Обещали на тысячу лет, так что теперь нельзя идти на попятную."
1014708-109 = ""
1014708-111 = ""
1014708-113 = ""
1014708-116 = "Так я и шёл обратно вдоль берега, а Сацуки буквально висела на мне."
