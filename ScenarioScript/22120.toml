[translation]
22120-1 = "Эпизод 12; Стратегическое совещание"
22120-2 = "Президент... забрала Алису?"
22120-3 = "[s] «Да, поэтому я подумал, что вы можете знать, где Рио.»"
22120-4 = "Я подозревала, что она втайне над чем-то работает."
22120-5 = "Но не могу поверить, что это было нечто подобное. Это немного... шокирует."
22120-6 = "Рио... Чего она пытается добиться?"
22120-7 = "Алиса?"
22120-8 = "Она её похитила?"
22120-9 = "Чтобы уничтожить её нимб?!"
22120-10 = "...Я не понимаю!"
22120-11 = "Она склонна делать вещи, которые трудно понять."
22120-12 = "Ноа! Тут дело не в понимании!"
22120-13 = "Я никогда не знаю, что у неё в голове, но..."
22120-14 = "Даже если она президент, такое нельзя прощать!"
22120-15 = ""
22120-17 = ""
22120-18 = "Смелые слова в адрес старшекурсницы."
22120-19 = "Правда? Вот такая наша Юука!"
22120-20 = "О, хи-хи. Это доверие? ♪"
22120-21 = "...А? Что ты имеешь в виду?"
22120-22 = "[s1] «В любом случае, Юука, Ноа, я рассчитываю на вас.»\n[s2] «Сможете узнать, куда Рио увела Алису?»"
22120-23 = "Да, мы можем проверить внутреннюю информацию Семинара и выяснить местонахождение президента Рио."
22120-24 = "Да, мы можем проверить внутреннюю информацию Семинара и выяснить местонахождение президента Рио."
22120-26 = "Предоставьте это нам! Мы сделаем всё возможное, чтобы помочь!"
22120-28 = "Нашли, Сенсей! Мы выяснили, куда Рио увезла Алису!"
22120-29 = "Я надеялась, что рассказанное вами неправда, но..."
22120-30 = "Не могу поверить, что она присваивала средства Семинара, чтобы построить нечто подобное..."
22120-31 = "Я всё ещё в шоке."
22120-32 = "[s] «Что это?»"
22120-33 = "На всякий случай мы поискали данные, которые намеренно удалили или скрыли из базы данных Семинара..."
22120-34 = "Их умело спрятали, но мы заметили расхождение в использовании клубных средств Семинара."
22120-35 = "И нашли это место... Сейчас выведу на экран!"
22120-36 = ""
22120-41 = "[ns] «Это... город?»"
22120-42 = "Восстановив удалённые данные из базы, мы нашли информацию об этом городе."
22120-43 = "Кодовое название — Эриду."
22120-44 = "Президент Рио тайно строила его..."
22120-45 = "Это \"город-крепость для подготовки к уничтожению Кивотоса\"."
22120-46 = "[s] «Эриду... Город-крепость.»"
22120-47 = "Как она могла построить город такого масштаба без нашего ведома?!"
22120-48 = "Скрыть движение таких средств было бы непросто..."
22120-50 = "Ах..."
22120-51 = "Может... это как-то связано с происшествием, в которое была втянута Коюки...?"
22120-52 = "О."
22120-53 = "КО! Ю! КИ!!!"
22120-54 = "[s] «Но зачем ей строить целый город?»"
22120-55 = "Президент Рио не колеблется, когда считает, что чего-то необходимо добиться."
22120-56 = "У неё здравый рассудок, смелость принимать решения и напор, с которым она прёт вперёд словно бульдозер."
22120-57 = "Неустанно пытаясь устранить опасности и предотвратить уничтожение Кивотоса, она создала..."
22120-58 = "...город-крепость Эриду."
22120-59 = "С высокой вероятностью Алису увезли в центральную башню города."
22120-61 = "Алиса... может быть там..."
22120-62 = "Сейчас отправлю вам координаты."
22120-63 = "Это всё, чем мы можем помочь, но..."
22120-64 = "Пожалуйста, все, остановите Президента Рио и верните Алису!"
22120-65 = "[s] «Понял. Предоставьте это нам.»"
22120-66 = ""
22120-68 = ""
22120-70 = ""
22120-71 = "Координаты Эриду подтверждены. Проблема в том, как туда проникнуть."
22120-72 = "Уверена, президент построила систему защиты от незваных гостей."
22120-73 = "Нам нужен план..."
22120-74 = "Что ж, видимо, мы на себе узнаем, почему его называют Городом-крепостью."
22120-76 = "Но как нам туда попасть?"
22120-77 = "Похоже, обычным путём туда не пробраться..."
22120-79 = "Обычным способом, возможно, и нет..."
22120-81 = "Но Инженерный Департамент знает другой путь."
22120-82 = "[s] «Другой путь...?»"
22120-83 = "Если бы дело было только в рабочей силе, Рио могла бы закрыть вопрос своими дронами."
22120-84 = "Но с материалами иначе. Даже она не может создать что-то из ничего."
22120-85 = "На окраинах района Миллениума много беспилотных поездов, используемых для грузовых перевозок..."
22120-86 = "Если Миллениум перевозил ресурсы для строительства этого города, велика вероятность, что один из маршрутов тайно ведёт в Эриду."
22120-87 = "О... Тогда, если мы найдём этот маршрут..."
22120-88 = "Да, сможем добраться до Эриду."
22120-89 = "Но как понять, какой именно поезд? Это же невозможная задача!"
22120-90 = "Вот здесь и вступает в дело Инженерный Департамент."
22120-91 = "[s] «Но, Утаха, нам придётся сражаться с Рио. Ты уверена...?»"
22120-92 = "Вы спрашиваете, почему мы готовы сотрудничать?"
22120-93 = "Ответ должен быть очевиден."
22120-94 = "Президент Рио украла величайшее изобретение Инженерного Департамента, которое мы доверили Алисе."
22120-95 = "Величайшее изобретение...?"
22120-96 = "Сверхновую... её Меч Света."
22120-97 = "Да. Вмешательство в работу наших изобретений — самоуправство. Это объявление войны Инженерному Департаменту. Как президент я не могу спустить такое с рук."
22120-98 = "Утаха, не стесняйся..."
22120-99 = "А-А? Что...? Эм, о чём ты?"
22120-100 = "Я объясню! Вот что думает Утаха!"
22120-101 = "Она хочет пойти спасти подругу, но ей неловко сказать это вслух. Она считает, что инженеру нелогично говорить, будто она переживает за дорогого ей человека, поэтому проще использовать украденное изобретение как предлог..."
22120-103 = "Котори."
22120-104 = ""
22120-106 = ""
22120-108 = "М-Ммф?!"
22120-109 = "Тс-с."
22120-110 = "*кивок* *кивок*"
22120-111 = ""
22120-112 = ""
22120-113 = "...Хорошо. Мой секрет в безопасности."
22120-114 = "[s] «Эм, по-моему, это уже не секрет.»"
22120-115 = "...Всё ещё секрет."
22120-116 = "[s] «Е-Если ты так говоришь...»"
22120-117 = "Итак, Инженерный Департамент поможет."
22120-118 = "Поняла."
22120-119 = "Ага! Можете на нас рассчитывать!"
22120-120 = ""
22120-122 = ""
22120-124 = "Когда мне уже казалось, что мы нашли и местонахождение Алисы, и способ туда добраться, я понял..."
22120-126 = "[ns] «Настоящая проблема — как вернуть Алису, когда мы туда попадём.»"
22120-127 = "Президент Рио наверняка всё предусмотрела. Она не просто так назвала его Городом-крепостью."
22120-128 = "Уровень безопасности и оборонительные системы города должны превосходить самые смелые наши фантазии."
22120-129 = "И не только это... даже если мы проникнем в Город-крепость, нам всё равно придётся столкнуться с главным препятствием."
22120-130 = "[s] «Главным препятствием...»"
22120-132 = "Горничной рядом с Рио, которая будет тщательно охранять это место."
22120-133 = "..."
22120-134 = "Её звали... Токи?"
22120-135 = "То, что Токи сделала в прошлый раз..."
22120-136 = "Я никогда раньше не видела, чтобы кто-то двигался настолько быстро..."
22120-137 = "Будто она включила читы."
22120-139 = ""
22120-140 = ""
22120-141 = "Нам нужна стратегия."
22120-142 = ""
22120-144 = ""
22120-145 = ""
22120-146 = ""
22120-147 = "[ns] «Неру только что сказала \"стратегия\"?!»"
22120-148 = "Н-Неру, ты в порядке?"
22120-149 = "Ты головой случайно не ударилась...?"
22120-150 = "Да пошла ты! Я серьёзно!"
22120-151 = "Понятно. Президент перешла в режим миссии."
22120-152 = "Когда хочет, она вообще-то умеет быть очень серьёзной."
22120-153 = "Именно."
22120-155 = "П-Понятно!"
22120-156 = "Хм, Неру... Можешь объяснить подробнее?"
22120-157 = "Даже если мы проникнем в Город-крепость, наши действия сразу раскроют — это территория Рио."
22120-158 = "Не зря её называют Большой Сестрой. От неё ничего не ускользает."
22120-159 = "[s] «То есть...?»"
22120-160 = "Всё просто. Вместо того чтобы всё усложнять, мы идём туда и открыто привлекаем их внимание."
22120-161 = "И президент Рио уничтожит нас за считанные мгновения."
22120-162 = "Поэтому я и сказала, что нам нужна стратегия."
22120-163 = "Точнее, отвлекающий манёвр."
22120-164 = "[s] «Отвлекающий манёвр...?»"
22120-165 = "Условия победы в этой игре просты."
22120-166 = "Спасти мелкую прежде, чем нас выведут из строя."
22120-167 = "Если C&C атакует в лоб и устроит хаос, всё внимание Рио и Токи будет приковано к нам."
22120-168 = "Пока они отвлечены, вы спасаете мелкую. Просто и понятно."
22120-170 = "Если получится..."
22120-171 = "Для Рио это будет гейм овер!"
22120-172 = "Н-Но... Эм... Ты уверена, что справишься, Неру? Эта Токи — та ещё читерша..."
22120-174 = "А? Ты меня недооцениваешь?"
22120-175 = "В прошлый раз она меня уделала, так что теперь я должна вернуть должок."
22120-176 = "Я сделаю то, что должна. А вы выполняйте свою часть."
22120-177 = "Как обычно, я с тобой."
22120-178 = "Хи-хи. Звучит весело! Оставьте это нам!"
22120-179 = "Мы постараемся."
22120-180 = "...Если у нас будет весь состав C&C... вероятность реально прорваться довольно высока..."
22120-181 = "Тогда решено. Президент и C&C идут впереди."
22120-182 = "А остальные — Департамент Разработки Игр и Сенсей... будут в тылу, получается?"
22120-183 = "Веритас окажет поддержку из-за кулис."
22120-184 = "Ага! Мы взломаем любые системы безопасности, которые встанут у вас на пути!"
22120-185 = "Да. Мы не позволим никакой её технологии вам помешать."
22120-187 = "Отлично! Звучит как план!"
22120-188 = "[s] «Мы справимся.»"
22120-189 = "Цель — центральная башня Города-крепости Эриду! Там удерживают Алису!"
22120-190 = "Раз Алиса ушла из дома без нашего разрешения..."
22120-191 = "Мы вернем её, когда захотим!"
