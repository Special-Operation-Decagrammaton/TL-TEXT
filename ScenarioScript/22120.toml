[translation]
22120-1 = "Episódio 12;Reunião Estratégica"
22120-2 = "A Presidente levou a Aris-chan...?"
22120-3 = "[s] \"Sim... E pensei que talvez você soubesse onde a Rio está, Yuuka.\""
22120-4 = "Ultimamente, parecia mesmo que ela estava tramando algo por baixo dos panos, mas..."
22120-5 = "Não imaginei que chegaria a esse ponto...#nEstou um pouco chocada."
22120-6 = "Presidente... O que diabos você está planejando?"
22120-7 = "Sequestrar"
22120-8 = "a Aris-chan—"
22120-9 = "E ainda por cima destruir o Halo dela...?"
22120-10 = "...Isso não faz o menor sentido!"
22120-11 = "Ela sempre teve o hábito de tomar atitudes extravagantes, mas..."
22120-12 = "Noa! Isso já passou de todos os limites!"
22120-13 = "Eu já não entendia o que se passava na cabeça dela há muito tempo, mas..."
22120-14 = "Mesmo sendo a Presidente... existem limites para o que se pode ou não fazer!"
22120-18 = "...Ela não pega leve nem com a própria senpai, né."
22120-19 = "Não é?#nBom, é bem a cara da Yuuka agir assim!"
22120-20 = "Ora, hihi♪#nParece que confiam bastante em você, Yuuka-chan."
22120-21 = "...Hã? O que quer dizer com isso?"
22120-22 = "[s1] \"...Yuuka, Noa, por favor.\"\n[s2] \"Quero que descubram para onde a Rio levou a Aris.\""
22120-23 = "Entendido. Vamos verificar os dados internos do Seminar.#nAcredito que ainda haja rastros da Presidente Rio."
22120-24 = "Entendido. Vamos verificar os dados internos do Seminar.#nAcredito que ainda haja rastros da Presidente Rio."
22120-26 = "Pode deixar conosco! Vamos cooperar com tudo o que temos!"
22120-28 = "Descobrimos para onde a Presidente Rio levou a Aris-chan!"
22120-29 = "Quando ouvi o que o Sensei contou, achei que não pudesse ser verdade, mas..."
22120-30 = "Não acredito que ela realmente desviou o orçamento do Seminar..."
22120-31 = "Estou realmente chocada... Nunca pensei que ela fosse capaz de algo assim."
22120-32 = "[s] \"Hã, como assim?\""
22120-33 = "Bem... Ao investigar o banco de dados do Seminar, encontrei registros apagados#n— com sinais de terem sido ocultados intencionalmente — e..."
22120-34 = "Descobri um fluxo suspeito em parte do orçamento.#nE consegui rastrear o destino dele."
22120-35 = "O rastro nos levou até este lugar... Vou mostrar na tela agora!"
22120-41 = "[ns] \"Isso é... uma cidade?\""
22120-42 = "Quando restauramos os arquivos deletados do banco de dados...#nencontramos os dados de uma certa cidade."
22120-43 = "Codinome \"Eridu\"."
22120-44 = "Pelo visto, é algo que a Presidente Rio construiu em segredo..."
22120-45 = "Uma \"cidade-fortaleza para se preparar para o fim\"."
22120-46 = "[s] \"Cidade-fortaleza 'Eridu'...\""
22120-47 = "Quando foi que ela construiu uma cidade desse porte...?"
22120-48 = "Até esconder o fluxo de tanto dinheiro deve ter sido difícil..."
22120-50 = "Ah..."
22120-51 = "Será que...#nisso tem alguma relação com o incidente da Koyuki-san outro dia...?"
22120-52 = "Ah!"
22120-53 = "KOOOYUUUKIII!!"
22120-54 = "[s] \"Por que será que ela construiu uma cidade?\""
22120-55 = "A Presidente Rio nunca hesita quando decide fazer algo."
22120-56 = "Ela toma decisões racionais — sem hesitar nem mesmo diante das escolhas mais drásticas —#ne, para alcançar seu objetivo, sai passando por cima de tudo feito um trator."
22120-57 = "E o resultado de todo esse esforço para eliminar ameaças e impedir o fim de Kivotos..."
22120-58 = "deve ser aquela cidade-fortaleza, \"Eridu\"."
22120-59 = "É muito provável que a Aris-chan tenha sido levada para a torre no centro de \"Eridu\"."
22120-61 = "É lá que... a Aris está..."
22120-62 = "Vou passar as coordenadas de \"Eridu\" para vocês."
22120-63 = "Pela nossa posição, só podemos ajudar até aqui, mas..."
22120-64 = "Por favor... detenham a Presidente Rio e tragam a Aris-chan de volta!"
22120-65 = "[s] \"Sim, pode deixar.\""
22120-71 = "Conseguimos confirmar as coordenadas de Eridu, mas o problema é como vamos nos infiltrar."
22120-72 = "Conhecendo a Presidente, ela com certeza montou um sistema de defesa contra invasores."
22120-73 = "Se nos aproximarmos sem nenhum preparo..."
22120-74 = "vamos descobrir na pele por que Eridu#né chamada de \"cidade-fortaleza\"."
22120-76 = "E-Então o que a gente faz?!"
22120-77 = "É difícil até de se aproximar..."
22120-79 = "— Isso só vale se vocês tentarem \"se aproximar normalmente\"."
22120-81 = "...Nós do Clube de Engenharia conhecemos outra rota."
22120-82 = "[s] \"Outra rota...?\""
22120-83 = "Se fosse só pela \"mão de obra\" para construir a cidade,#nos drones da Presidente Rio dariam conta, mas..."
22120-84 = "com \"materiais\" a história é outra. Afinal, não dá para criar algo do nada."
22120-85 = "Nos arredores do distrito autônomo de Millennium, há vários trens de carga não tripulados..."
22120-86 = "Supondo que ela transportou os materiais de construção a partir de Millennium,#nhá grandes chances de uma dessas linhas levar direto até Eridu."
22120-87 = "Então, se descobrirmos qual é a linha...!"
22120-88 = "Isso mesmo. Dá para chegar a Eridu."
22120-89 = "M-Mas existem tantas linhas, não é...?#nComo vamos fazer para encontrar a certa?!"
22120-90 = "É verdade. Por isso, o Clube de Engenharia vai dar apoio nessa parte."
22120-91 = "[s] \"Utaha, nós vamos acabar lutando contra a Rio. Mesmo assim...\""
22120-92 = "Está perguntando por que vamos ajudar?"
22120-93 = "Ora, é óbvio."
22120-94 = "A Presidente Rio tomou sem permissão a maior invenção do Clube de Engenharia."
22120-95 = "A maior invenção...?"
22120-96 = "A \"Supernova\" da Aris..."
22120-97 = "Na mosca. Atrapalhar a coleta de dados do nosso clube é um claro abuso de poder.#nNa prática, é uma declaração de guerra contra o Clube de Engenharia.#nComo presidente do clube, eu jamais poderia deixar isso passar..."
22120-98 = "A Utaha-senpai é tão tímida..."
22120-99 = "H-Hã, do que vocês estão falando?"
22120-100 = "Sim! Deixe que eu explico!#nA linha de raciocínio da Utaha-senpai é a seguinte!"
22120-101 = "Quero ajudar uma amiga, mas tenho um pouco de vergonha de dizer em voz alta...#nJá sei! Vou usar o fato de terem levado algo nosso como desculpa...!"
22120-103 = "Ei, Kotori."
22120-108 = "Ngh, ugh?!"
22120-109 = "Shhh."
22120-110 = "(Assentindo freneticamente!!)"
22120-113 = "...Certo, o segredo está salvo."
22120-114 = "[s] \"Desculpa... mas acho que não salvou segredo nenhum.\""
22120-115 = "...Está salvo, sim."
22120-116 = "[s] \"É, t-tá bom...\""
22120-117 = "Aham... Sendo assim, nós do Clube de Engenharia também vamos ajudar."
22120-118 = "Sim."
22120-119 = "Humpf! Pode deixar conosco!"
22120-124 = "(E assim, embora tivéssemos descoberto onde a Aris estava e como chegar até lá...)"
22120-126 = "[ns] \"...Agora precisamos pensar em como trazer a Aris de volta.\""
22120-127 = "Sim. Se chega a ser chamada de cidade-fortaleza...#na Presidente Rio deve estar preparada para tudo."
22120-128 = "Além da segurança da cidade,#no sistema de defesa também deve ser de altíssimo nível."
22120-129 = "E tem mais... Mesmo que a gente dê um jeito na cidade-fortaleza, ainda resta um problema."
22120-130 = "[s] \"É verdade... a cidade-fortaleza é só um detalhe.\""
22120-132 = "Pelo que ouvi, a empregada que faz a escolta da Presidente Rio é o maior obstáculo."
22120-133 = "..."
22120-134 = "Toki-san... era esse o nome dela, certo?"
22120-135 = "Os movimentos dela... naquela hora..."
22120-136 = "Parecia..."
22120-137 = "É — parecia uma \"jogadora usando cheat\"..."
22120-141 = "O que a gente precisa é de uma estratégia."
22120-147 = "[ns] \"A Neru... acabou de dizer 'estratégia'?!\""
22120-148 = "N-Neru-senpai, você tá bem? Não tá com febre?"
22120-149 = "Será que é efeito colateral dos ferimentos graves...?"
22120-150 = "Hã? Do que vocês tão falando?"
22120-151 = "...A presidente entrou no modo missão."
22120-152 = "Isso mesmo! Quando a presidente entra no modo trabalho, ela fica suuuper séria!"
22120-153 = "Hihi, na verdade é isso mesmo."
22120-155 = "E-Entendi...!"
22120-156 = "Hmm, Neru-senpai...#nPosso perguntar o que você quer dizer com isso?"
22120-157 = "Mesmo que a gente chegue na cidade-fortaleza inteiros,#nenquanto estivermos no território da Rio, ela vai ver cada passo nosso."
22120-158 = "Digam o que disserem, aquela lá é a \"Big Sister\"."
22120-159 = "[s] \"O que quer dizer...?\""
22120-160 = "É simples. Em vez de perder tempo bolando plano mirabolante,#né melhor partir pra cima logo de cara."
22120-161 = "Mas, presidente, não estaríamos caindo direto na armadilha da Presidente Rio...?"
22120-162 = "É por isso que eu tô dizendo que a gente precisa de uma estratégia."
22120-163 = "— Mais precisamente, uma distração."
22120-164 = "[s] \"Uma distração...?\""
22120-165 = "A condição de vitória desse jogo é bem simples."
22120-166 = "\"Resgatar aquela tampinha antes que a gente seja derrotada.\""
22120-167 = "Nós da C&C vamos invadir pela frente e fazer a maior bagunça.#nAssim, não só a Rio, mas aquela tal de Toki também vai ser obrigada a lidar com a gente, né?"
22120-168 = "Enquanto isso, vocês resgatam a tampinha.#nE aí? Simples, não é?"
22120-170 = "Se resgatarmos a Aris..."
22120-171 = "A vitória é nossa...!"
22120-172 = "Mas, Neru-senpai, vai ficar tudo bem?#nA oponente é aquela \"jogadora usando cheat\"..."
22120-174 = "Hã? Quem é que você pensa que eu sou?"
22120-175 = "Aquela lá me passou a perna uma vez.#nEu já decidi que ia dar o troco na próxima vez que a encontrasse."
22120-176 = "Agora é só colocar isso em prática."
22120-177 = "Entendido. Vamos seguir o plano."
22120-178 = "Sim, sim! Pode deixar com a gente♪"
22120-179 = "Hihi, farei o meu melhor."
22120-180 = "(...Realmente, diferente daquela vez, com toda a C&C reunida...#nas chances de conseguirmos abrir caminho são altas...)"
22120-181 = "Então está decidido.#nNós da C&C cuidaremos da linha de frente junto com a presidente."
22120-182 = "Na infiltração pela retaguarda ficam o Clube de Desenvolvimento de Jogos, nós... e o Sensei, certo?"
22120-183 = "Nós da Veritas vamos dar suporte remoto."
22120-184 = "Deixem o hackeamento do sistema de defesa com a gente!"
22120-185 = "Vamos cumprir nossa parte com perfeição."
22120-187 = "Beleza, então vamos com tudo!"
22120-188 = "[s] \"Sim.\""
22120-189 = "Nosso alvo é a torre central da \"Cidade-Fortaleza Eridu\"!#nO lugar para onde levaram a Aris!"
22120-190 = "A Aris que fugiu de casa sem avisar!"
22120-191 = "Vamos trazê-la de volta com nossas próprias mãos!"
22120-195 = "[ns] \"Muito bem, a partir de agora—\""
22120-204 = "[ns] \"— Operação iniciada!\""
22120-206 = "Próximo;Big Sister"
