[translation]
1014006-1 = "Украшенная лисица"
1014006-4 = "Штаб отряда FOX"
1014006-5 = "[ns] «Все на местах?»"
1014006-6 = "Постойте, [USERNAME] Сенсей?"
1014006-7 = "Кажется, на сегодня операций не запланировано... Что вы делаете в штабе?"
1014006-8 = "[ns] «Сегодня я получил подарок от фермы, где была проблема с морской водой.»"
1014006-9 = ""
1014006-12 = "[ns1] «И это просто невероятное количество картошки...»\n[ns2] «Я решил поделиться с вами.»"
1014006-15 = "О, спасибо! Картошке найдётся масса применений."
1014006-16 = "Её можно запечь, сварить, пожарить... Она невероятно универсальна."
1014006-17 = "Поделюсь с остальными участницами отряда."
1014006-18 = "[s] «Кстати, ты сегодня одна?»"
1014006-19 = "Да. Все ушли по личным делам."
1014006-20 = "У вас были к ним какие-то дела?"
1014006-21 = "[s3] «Нет, не к ним...»\n[s4] «Мне немного неловко оставаться с тобой наедине.»"
1014006-22 = ""
1014006-25 = "Ух! Не говорите мерзости, да ещё и без всякого повода!"
1014006-26 = "[ns] «Так чем ты занималась, Куруми?»"
1014006-27 = "А? Как видите, занималась щитом."
1014006-28 = "В последнее время я занята, поэтому он немного потрепался."
1014006-29 = "Сначала уберу царапины абразивом, а потом перекрашу."
1014006-30 = "[s] «Понятно. Ты усердно работаешь.»"
1014006-31 = ""
1014006-34 = "[ns5] «Как часто ты обслуживаешь свой щит?»\n[ns6] «Щит ведь неизбежно царапается, разве нет?»"
1014006-37 = ""
1014006-38 = "Я осталась заниматься обслуживанием снаряжения."
1014006-39 = "Именно. Передовая боец обязана особенно тщательно следить за экипировкой."
1014006-40 = "Именно. Передовая боец обязана особенно тщательно следить за экипировкой."
1014006-41 = "Ведь это первое, что противник видит во время операции, да?"
1014006-42 = "Этот щит — словно первое впечатление, которое производит наш отряд. Поэтому перед выходом я хочу быть уверена, что он в идеальном состоянии."
1014006-43 = "Честно говоря, в самом бою такие вещи уже не замечаешь..."
1014006-44 = "Так что это в основном просто моя личная прихоть."
1014006-45 = "[s7] «Мне всё равно нравится такой подход.»\n[s8] «Именно такие вещи отличают отряд FOX.»"
1014006-48 = "П-Правда? Я знала, что вы поймёте, Сенсей!"
1014006-49 = "Я должна уверенно демонстрировать свои убеждения, иначе сама не буду чувствовать уверенности. Даже перед врагами!"
1014006-50 = "Поэтому иногда даже клею на него наклейки, немного ради красоты."
1014006-51 = "Смотрите. Эту наклейку бесплатно дали с журналом. Милая, правда?"
1014006-52 = "[s] «О, милая!»"
1014006-53 = ""
1014006-56 = "[ns] «Кстати, у меня тоже есть наклейка, которую я выиграл как приз.»"
1014006-57 = "Ой! Маленькая наклейка с котиком."
1014006-58 = "Какая милая..."
1014006-59 = "[s] «Если хочешь, можешь наклеить её на свой—»"
1014006-60 = "Ни за что не наклею это на щит!"
1014006-61 = "Вы хотите, чтобы этот очаровательный котик на моём щите попал под ливень пуль? У вас вообще сердца нет, Сенсей?"
1014006-62 = "Единственное впечатление от отряда FOX с такой наклейкой будет, что мы безжалостные чудовища!"
1014006-63 = "[s9] «Прости, я так далеко не подумал.»\n[s10] «Тогда заберу наклейку обратно...»"
1014006-66 = ""
1014006-68 = ""
1014006-69 = "...Отказываюсь."
1014006-70 = "Вы подарили её мне, значит назад не отдам."
1014006-71 = "Кроме щита полно других мест. Например, дневник или военный блокнот..."
1014006-72 = "[s] «Куруми. Неужели...»"
1014006-73 = "Нет! Я-я совершенно не хочу сохранить её только потому, что технически это подарок от вас!"
1014006-74 = "Не поэтому! Просто... Посмотрите на этого котика! Он очаровательный!"
1014006-75 = "Не зазнавайтесь! Большой идиот!"
1014006-77 = "Я весело проводил время с Куруми, пока она продолжала обслуживать щит и всё это время меня отчитывала."
