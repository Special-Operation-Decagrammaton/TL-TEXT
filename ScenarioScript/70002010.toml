[translation]
70002010-1 = "Сверкающий день Кирары и Эрики 1"
70002010-2 = ""
70002010-3 = "Бальзам для губ — есть! Бигуди — есть!"
70002010-4 = "Сумка собрана, пора поспать ради красоты!"
70002010-5 = "Интересно, что весёлого ждёт меня завтра..."
70002010-6 = ""
70002010-9 = "О? Что за уведомление?"
70002010-10 = "Так, посмотрим..."
70002010-11 = "А! Сериал, на который я подписана, выпустил новую серию."
70002010-12 = "Я собиралась спать... но это же надо посмотреть, правда?"
70002010-13 = "Так, посмотрим..."
70002010-14 = "Давайте сами создадим свою юность!"
70002010-15 = ""
70002010-19 = "Цветок юности должен быть...!"
70002010-20 = ""
70002010-24 = ""
70002010-25 = "...!"
70002010-27 = ""
70002010-31 = "Пора домой, Кирара!"
70002010-32 = "..."
70002010-34 = "Ноль реакции. Что с тобой?"
70002010-36 = "Ч-Чего! Когда ты пришла, Эри?"
70002010-37 = "Ты не слышала, как я топала сюда? Или звонок? Ты разве домой не хочешь?"
70002010-38 = "А! Ага! Пойдём."
70002010-39 = "Ты сегодня сама не своя, Кирара. Что-то случилось?"
70002010-40 = "А-А? Вроде ничего?"
70002010-41 = "Наверное, потому что вчера я суперпоздно легла! Хахаха!"
70002010-42 = ""
70002010-44 = ""
70002010-46 = "...?"
70002010-48 = ""
70002010-49 = "Ура! Сегодня солнце светит!"
70002010-50 = "Надеюсь, по дороге домой случится что-нибудь весёлое!"
70002010-51 = "А, а! Смотри туда, Эри!"
70002010-52 = "Хм?"
70002010-53 = ""
70002010-56 = ""
70002010-57 = ""
70002010-59 = "На того студента, который идёт мимо?"
70002010-60 = "Ага! Она пьёт тот бабл-ти из ограниченного меню кафе перед нашей школой!"
70002010-61 = "Интересно, как ей удалось его достать. У меня никогда не получалось..."
70002010-62 = "Есть только один способ узнать! Пойдём поздороваемся!"
70002010-63 = ""
70002010-65 = ""
70002010-66 = "Поехали."
70002010-68 = ""
70002010-69 = ""
70002010-70 = ""
70002010-71 = "Йаху! Привет! Очень приятно!"
70002010-72 = "А-А?! Вы кто?!"
70002010-73 = "Я Кирара! А это Эри!"
70002010-74 = "Только ты зовёшь меня так, Кирара. Я Эрика."
70002010-75 = "Ладно-ладно! Ты сейчас домой идёшь?"
70002010-76 = "Д-Да... А вам что от меня нужно...?"
70002010-78 = "У тебя есть секундочка? Ну пожа-а-алуйста?"
70002010-79 = "Н-Наверное. Что такое?"
70002010-80 = "Ты лучшая! Спасибо! Как ты достала этот вкус бабл-ти? Я слышала, он супер-пупер эксклюзивный!"
70002010-81 = "Я решила, что ты наверняка знаешь всякие секретные хитрости из мира вкусных напитков! Настоящий ценитель, как говорится!"
70002010-82 = "Поэтому я просто обязана была подойти и попросить тебя научить меня своим приёмам!"
70002010-83 = "Ты драматизируешь."
70002010-84 = "Вот и всё. Прости, что побеспокоили."
70002010-85 = "Мы давно хотели его попробовать, но каждый раз, когда приходим, всё уже распродано."
70002010-86 = "О... Понятно."
70002010-87 = "Ага, я слышала, что его сложно достать, поэтому просто оформила заказ утром по дороге на занятия."
70002010-88 = "Ого! Я бы никогда не додумалась заказать заранее! Я знала, что у тебя есть секреты!"
70002010-89 = "Огромное спасибо! В качестве оплаты расскажу тебе свой секрет! Лучшее место с крепами в Геенна!"
70002010-90 = "В честь нашей дружбы!"
70002010-91 = "Д-Дружбы? Но мы типа только что познакомились... меньше пяти минут назад..."
70002010-92 = "Именно! Значит, теперь мы друзья!"
70002010-93 = "Т-Так это работает?"
70002010-94 = "Ага! А как ещё?"
70002010-96 = "Ладно. Но один момент."
70002010-97 = "А? Что такое?"
70002010-98 = "На самом деле этот бабл-ти довольно пос—"
70002010-99 = ""
70002010-104 = "О?"
70002010-105 = "Ого, ого! Десертное кафе взорвалось!"
70002010-106 = "Кафе взорвали? Это наверняка...!"
70002010-108 = ""
70002010-109 = "Хи-хи. Когда оно завирусилось в соцсетях, признаю, у меня были большие ожидания."
70002010-110 = "Но... вот это. Посредственные ингредиенты. Сомнительные маркетинговые схемы..."
70002010-111 = "Этот напиток не соответствует даже базовым стандартам кухни! А если он не способен оправдать само своё существование, значит ему просто не следует существовать."
70002010-112 = "Серьёзно? А мне сэндвич с огурцом и ксилитом показался вкусненьким!"
70002010-113 = "И ты единственная, кто так думает!"
70002010-114 = "Минус десять баллов за отсутствие безлимитных напитков! ☆"
70002010-115 = "В последний раз говорю: в десертных кафе вообще ничего не бывает безлимитным! И главное — вы взорвали его до того, как я успела попробовать!"
70002010-116 = ""
70002010-121 = ""
70002010-123 = "Стоять, Общество гурманов!"
70002010-125 = "Ох."
70002010-126 = "Префектурная команда?! Даже для вас реакция быстрая!"
70002010-128 = "Я патрулировала неподалёку, а Клуб школьного питания сообщил, что вы опять нарушаете закон!"
70002010-129 = "Не думала, что поймаю вас прямо на месте преступления!"
70002010-130 = "О чём вы думали, взрывая десертное кафе?! На этот раз я вас не отпущу!"
70002010-131 = ""
70002010-132 = "У меня есть множество возражений против твоего узколобого образа мыслей, но, боюсь, сейчас мы заняты."
70002010-133 = "Акари."
70002010-134 = "Да, мэм! Все в грузовик! Пора удирать. ☆"
70002010-135 = "Отступаем! Отступаем!"
70002010-136 = ""
70002010-138 = ""
70002010-140 = ""
70002010-141 = "П-Погодите меня! Не бросайте меня одну!"
70002010-142 = ""
70002010-144 = ""
70002010-146 = ""
70002010-147 = "Негодяйки! Вернитесь и сдавайтесь! Я вам не позво—"
70002010-148 = ""
70002010-153 = ""
70002010-155 = "*кашель* *кашель* *кхе* Я сказала стоять!"
70002010-156 = "Вот мелкие засранки! Им хватило наглости украсть грузовик Клуба школьного питания и использовать его как машину для побега?!"
70002010-157 = "Эй! Вы двое! Клуб «Домой после уроков»!"
70002010-159 = "А? Мы?"
70002010-160 = "Да, вы! Мне нужна ваша помощь. На этот раз мы прикончим Общество гурманов окончательно!"
70002010-161 = "Э-Это немного внезапно..."
70002010-163 = "Звучит круто! Я за!"
70002010-164 = "Ты слишком быстро согласилась. Уверена?"
70002010-165 = "Гнаться за грузовиком звучит супер-весело! Давайте!"
70002010-166 = "Где веселье — там и Кирара."
70002010-167 = "Ладно, почему бы и нет? Пойдём."
70002010-168 = "Йаху! Ты лучшая, Эри!"
70002010-170 = "Хорошо! Спасибо за помощь!"
70002010-171 = "Времени нет! За ними!"
70002010-172 = ""
70002010-174 = ""
70002010-176 = "Йаху!"
70002010-177 = ""
70002010-179 = ""
70002010-181 = "Десять минут спустя..."
70002010-182 = ""
70002010-183 = "*пых* *пых*..."
70002010-184 = "Хахаха! Похоже, мы потеряли и грузовик, и нашу подругу из Префектурной команды!"
70002010-185 = "Нам что, пора начинать тренироваться?"
70002010-186 = "Ну, для Префектурной команды это обычное дело, но нормальные люди не могут догонять несущиеся машины..."
70002010-187 = "Хахаха! Зато было весело! Разве не приятно немного пропотеть?"
70002010-188 = "На удивление я и правда чувствую себя неплохо."
70002010-190 = ""
70002010-192 = ""
70002010-193 = "Эй! Вы двое! Там!"
70002010-195 = "Хм?"
70002010-196 = ""
70002010-199 = ""
70002010-200 = ""
70002010-201 = "Можно спросить дорогу? Я так увлеклась клубной деятельностью, что заблудилась!"
70002010-203 = "Ура! Новый друг!"
70002010-204 = "Мы поможем! Куда тебе нужно?"
70002010-206 = "Спасибо! Я пытаюсь добраться до перекрёстка перед большим актовым залом..."
70002010-208 = "Актовый зал... Тогда ты совсем рядом."
70002010-209 = "Ага! Просто спускаешься по лестнице, поворачиваешь направо, идёшь прямо и..."
70002010-210 = ""
70002010-212 = ""
70002010-213 = "Знаешь, давай лучше проводим тебя? Так будет намного быстрее, правда, Эрика?"
70002010-214 = "Хорошая идея."
70002010-215 = "Тогда просто иди за мной! Доставим тебя туда целой и невредимой!"
70002010-217 = "Ого! Огромное спасибо! Похоже, мы встретили надёжных друзей, да?"
70002010-218 = "Все, берите инструменты! Выдвигаемся!"
70002010-219 = ""
70002010-221 = ""
70002010-223 = "Сюда!"
70002010-224 = ""
70002010-226 = ""
70002010-228 = ""
70002010-229 = ""
70002010-231 = ""
70002010-232 = "Пришли! Вот большой актовый зал!"
70002010-233 = "Похоже на нужное место?"
70002010-235 = "Ага! Именно это место указала президент!"
70002010-236 = "Отлично! Спасибо! Нам пора заниматься клубными делами!"
70002010-238 = "Не за что! Увидимся!"
70002010-240 = ""
70002010-242 = ""
70002010-243 = ""
70002010-245 = "Мне нравится помогать новым друзьям!"
70002010-246 = "Угу. По дороге домой мы постоянно притягиваем такие ситуации."
70002010-247 = ""
70002010-251 = ""
70002010-253 = "Зато с ними не скучно!"
70002010-254 = "У нас ни одна прогулка не похожа на другую."
70002010-255 = ""
70002010-259 = "Это Отдел горячих источников! Они опять всё взрывают!"
70002010-260 = "Немедленно эвакуируйтесь, иначе вас заденет!"
70002010-261 = ""
70002010-263 = ""
70002010-264 = "Ага-ага! Каждый день — захватывающее приключение."
70002010-265 = "Но... и это всё...?"
70002010-266 = "Хм?"
70002010-267 = "Хм..."
70002010-268 = ""
70002010-270 = ""
70002010-271 = "Хахаха! Ничего!"
70002010-272 = "Пора двигать дальше!"
70002010-276 = ""
70002010-277 = "И вот наш обычный перекрёсток."
70002010-278 = "Увидимся завтра? Как всегда?"
70002010-279 = "..."
70002010-280 = "Кирара?"
70002010-281 = "Ладно. Да. Надо тебе рассказать."
70002010-282 = "Наконец-то скажешь, что тебя беспокоит?"
70002010-283 = "Ч-Чего? Я настолько читаемая?"
70002010-284 = "Мы всё время вместе, Кирара. Конечно, я заметила."
70002010-285 = "Просто не хотела заставлять тебя говорить, пока ты сама не будешь готова."
70002010-286 = "Хахаха! От тебя ничего не скроешь, Эри."
70002010-287 = "Так вот, если честно..."
70002010-288 = "В нынешней жизни... будто чего-то не хватает?"
70002010-289 = "Не хватает? Чего... именно?"
70002010-291 = "ЮНОСТИ!"
70002010-292 = "Азарт!"
70002010-293 = "Блеск!"
70002010-294 = "Ч-Что...?"
70002010-295 = "Обычно я за тобой поспеваю, но тут, пожалуй, понадобится объяснение."
70002010-296 = "Я хочу сказать вот что..."
70002010-298 = "Давай начнём заниматься клубной деятельностью!"
70002010-299 = "Клубной... деятельностью?"
70002010-300 = "С чего это вдруг?"
70002010-301 = "Ладно, помнишь, я вчера поздно легла? Я смотрела «Истории нашей юности: Идеальный клубный эпизод»."
70002010-302 = "Это тот веб-сериал, которым ты в последнее время увлеклась?"
70002010-303 = "Ага-ага. Главные герои там занимались всякими клубными штуками, и выглядело это просто супер-пупер весело!"
70002010-304 = "И мне тоже захотелось попробовать!"
70002010-305 = "Я типа очень люблю Клуб «Домой после уроков», но ведь может существовать целый мир веселья, который мы ещё не открыли! Просто прячется под видом клубной деятельности!"
70002010-306 = "Как новые друзья, которых мы встретили сегодня! Они явно были суперувлечены своими клубами!"
70002010-307 = "Разве не будет ужасно обидно, если мы выпустимся и поймём, что пропустили лучшие школьные дни?"
70002010-309 = "Мы... Мы уже могли потратить впустую половину этих лучших школьных дней!"
70002010-310 = "Т-Так это работает...?"
70002010-311 = "Ну да! В конце концов, клубы — это почва, из которой расцветает цветок юности... или как-то так, да?"
70002010-312 = "Как скажешь, Кирара..."
70002010-313 = "Ладно. Звучит неплохо. Давай придумаем, как это устроить."
70002010-314 = "Ого! Вау! Ты будешь делать это вместе со мной?"
70002010-315 = "Ты довольно часто втягиваешь меня в свои очередные затеи."
70002010-316 = "И я всегда иду с тобой, разве нет? Ты моя лучшая подруга."
70002010-317 = "Ура! Ты правда лучшая на свете, Эри! Хи-хи. Спасибо!"
70002010-318 = "Для начала: в какой клуб ты хочешь вступить? Какой-нибудь уже приглянулся?"
70002010-319 = "Вообще нет! Я до этой части ещё не дошла."
70002010-320 = "Примерно этого я и ожидала, но ты сказала это вообще без колебаний."
70002010-321 = ""
70002010-323 = ""
70002010-324 = ""
70002010-325 = "Тогда давай сделаем так."
70002010-326 = "В Геенна есть система «пробного вступления» в клубы."
70002010-327 = "Можем попробовать разные клубы и посмотреть, какой понравится больше всего."
70002010-328 = ""
70002010-330 = ""
70002010-331 = "Обожаю! Пойдём прямо сейчас!"
70002010-333 = "Надеюсь, найдём какой-нибудь суперзахватывающий и сверкающий клуб!"
