[translation]
52135-2 = "Тем временем перед особняком..."
52135-4 = ""
52135-6 = ""
52135-7 = ""
52135-8 = ""
52135-10 = ""
52135-11 = "[ns1] «Они нас нашли.»\n[ns2] «Не думал, что сначала они пойдут за нами...»"
52135-14 = "...Духи артефактов? И ни одного Хяккарёран рядом?"
52135-15 = "Сенсей, за меня. Я вас защищу!"
52135-16 = ""
52135-20 = "Ха. Ха-ха..."
52135-23 = "Ха-ха-ха, ха-ха..."
52135-24 = "ХА-ХА-ХА-ХА!!"
52135-25 = "Видишь? Госпожа Кокурико думает обо всём!"
52135-26 = "Она знала, что вы, идиоты, отправитесь искать Особняк Запределья, а теперь вы забрались сюда без Сотни Лотосов!"
52135-27 = "И вы повелись на мои слёзы, Сенсей! Сами позволили мне вас изолировать!"
52135-28 = "Думали, сможете перехитрить «Красоту природы»?"
52135-29 = "Идиот! Тупой идиот! Попался. Сунул свою так называемую руку помощи прямо в пасть змеи!"
52135-30 = "[s] «...Сюро.»"
52135-31 = ""
52135-33 = ""
52135-34 = "Что такое, Сенсей? Хочешь попробовать умолять?"
52135-35 = "Слишком поздно. Время вышло!"
52135-36 = "Готовься отправиться в мир духов. А твоих студентов я пришлю следом!"
52135-37 = "[s] «Так это всё было притворством?»"
52135-38 = "Ц...!"
52135-39 = "Я же только что сказала! Думаешь, я вру?"
52135-40 = "О, Сенсей... такой благородный, такой сочувствующий, такой жалкий и слабый. Меня сейчас стошнит! А теперь, мои любимые Духи артефактов — сожрите их!"
52135-41 = ""
52135-43 = ""
52135-44 = "Что вы делаете? Нападайте на Сенсея!"
52135-45 = ""
52135-47 = ""
52135-49 = ""
52135-50 = ""
52135-53 = ""
52135-54 = ""
52135-55 = "П-Почему...?"
52135-56 = "Почему вы, тупые зонты, нападаете на МЕНЯ? Вы вообще знаете, кто я?!"
52135-57 = "Нет, что-то не так. Если только госпожа Кокурико не бросила меня, но—"
52135-58 = ""
52135-61 = ""
52135-62 = ""
52135-65 = ""
52135-66 = ""
52135-67 = "У-Уа-а..."
52135-68 = ""
52135-70 = ""
52135-73 = "[ns3] «Что происходит...?»\n[ns4] «Почему они нападают на Сюро?»"
52135-76 = "Не знаю. Внутри «Красоты природы», должно быть, возник какой-то конфликт."
52135-77 = "Но с ней всё будет хорошо? Похоже, она вообще их не контролирует..."
52135-78 = "Без тома её могут поглотить..."
52135-79 = "Сюро провалится в мир духов..."
52135-80 = "Хотя, возможно, она это заслужила."
52135-81 = "[s] «...Я сейчас вернусь.»"
52135-82 = ""
52135-84 = ""
52135-85 = "Ты с ума сошёл?"
52135-86 = "Духи артефактов отвлечены, а здесь небезопасно."
52135-87 = "Мы понятия не имеем, что происходит внутри Особняка Запределья..."
52135-88 = "И ты готов рискнуть жизнью, чтобы спасти ребёнка, который пытался тебя убить?"
52135-89 = "Невероятно—"
52135-91 = "[ns5] «Она просто ребёнок.»\n[ns6] «Для неё ещё не поздно.»"
52135-92 = ""
52135-93 = ""
52135-99 = ""
52135-100 = "Ха. Ха-ха..."
52135-101 = ""
52135-103 = ""
52135-104 = "Изысканно. Вы настолько предсказуемы, Сенсей."
52135-109 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
52135-112 = "(«Нет, нет, нет, нет...»)"
52135-113 = "(«Я... Неужели она и правда могла меня бросить?»)"
52135-114 = "(«Я дважды провалилась. Госпожа Кокурико больше не может мне доверять.»)"
52135-115 = "(«Вот почему она приказала Духам артефактов напасть на меня.»)"
52135-116 = "(«Я ей больше не нужна. Она меня не любит. Всё потому, что я...»)"
52135-117 = ""
52135-122 = ""
52135-123 = ""
52135-124 = ""
52135-125 = ""
52135-126 = ""
52135-128 = ""
52135-129 = "Нет... Пожалуйста..."
52135-130 = "Я... Я не хочу уходить!"
52135-131 = ""
52135-135 = ""
52135-137 = "...Стой!"
52135-138 = ""
52135-140 = ""
52135-145 = ""
52135-146 = "...А?"
52135-147 = "[s] «...Рад, что нашёл тебя.»"
52135-148 = "...Сенсей Шале?"
52135-149 = "Почему вы толкнули меня себе за спину?"
52135-150 = "[s] «Ты была в опасности.»"
52135-151 = "Но..."
52135-152 = "Я... пыталась тебя убить. Идиот!"
52135-153 = "Я даже не одна из твоих жалких студентов! Ты бредишь?"
52135-154 = "Что, думаешь, теперь я тебе должна? Что посвящу жизнь добрым делам и стану скучной?"
52135-155 = "[s7] «Я просто хотел, чтобы ты была в безопасности.»\n[s8] «Ты была ребёнком в беде.»"
52135-156 = ""
52135-157 = ""
52135-159 = ""
52135-160 = "Как же глупо..."
52135-161 = "Ты не такой, как мы, Сенсей! Одна случайная пуля может тебя убить!"
52135-162 = "И ты бы... рискнул своей тупой жалкой жизнью ради меня? После всего, что я сделала?"
52135-163 = "Ты безнадёжен! Такой... идиот!"
52135-164 = "[s] «Не переживай, дорогая Сюро. Я крепче, чем выгляжу.»"
52135-165 = ""
52135-167 = ""
52135-168 = "Кого ты назвал «дорогой»?!"
52135-169 = "[s] «...Хотя больно всё-таки...»"
52135-172 = ""
52135-173 = "...О?"
52135-180 = ""
52135-181 = "...Сенсей!"
52135-182 = ""
52135-185 = ""
52135-186 = "Хяккарёран. Вы добрались!"
52135-187 = "Духи артефактов заполонили территорию!"
52135-188 = "...Мы знаем."
52135-189 = "Важнее другое: Сенсей [USERNAME] в безопасности?"
52135-190 = "Ну, эм..."
52135-191 = "Сюро убежала от агрессивных Духов артефактов, а Сенсей побежал её спасать."
52135-192 = ""
52135-194 = ""
52135-195 = "Я пыталась остановить, но он оказался ужасно упрямым!"
52135-197 = "Постой! Ты просто стояла и смотрела, как Сенсей убегает?"
52135-198 = "И даже не попыталась преградить путь? Удержать?"
52135-199 = ""
52135-201 = ""
52135-202 = ""
52135-203 = ""
52135-204 = "Кикё?!"
52135-205 = "Да, я её отчитывала, но не обязательно направлять на меня оружие..."
52135-206 = "Я настолько сосредоточилась на президенте Аямэ, что не увидела то, что было прямо перед глазами."
52135-207 = "Я знала, что рядом участница «Красоты природы». Знала, что они используют том."
52135-208 = ""
52135-210 = ""
52135-211 = "Но не ожидала, что она всё это время будет прямо у нас под носом."
52135-212 = ""
52135-214 = ""
52135-215 = ""
52135-216 = ""
52135-217 = "Аха... Ха-ха-ха..."
52135-218 = ""
52135-220 = ""
52135-221 = "...Разве это не изысканно?"
52135-223 = "Следующий эпизод;Фантомная художница «Красоты природы»"
