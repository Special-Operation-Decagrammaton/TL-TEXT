[translation]
52135-2 = "(Enquanto isso, no mesmo instante, em frente à \"Mansão Higan\"...)"
52135-11 = "[ns1] \"Como eu esperava, apareceu...\"\n[ns2] \"Não achei que viria para cá primeiro...\""
52135-14 = "...Tsukumogami?!"
52135-15 = "Sensei, fique atrás de mim!"
52135-20 = "Ihihi..."
52135-23 = "Aha... Ahahaha..."
52135-24 = "Ahahahahahahaha!!"
52135-25 = "Bem feitooo! A Kokuriko-sama já sabia de tudinhooo?!"
52135-26 = "Que vocês viriam até a \"Mansão Higan\" seguindo aquelas marcas estranhas, e que o Hyakumonogatari só pode ser derrotado com o Hyakuren!"
52135-27 = "Bastou eu fingir um pouquinho de medo para se separarem e largarem o Sensei para trás!"
52135-28 = "Acharam mesmo que tinham pegado o Clube Beleza da Natureza numa armadilhaaa?"
52135-29 = "Sem nem perceberem que estavam enfiando a mão na boca da cobraaa! Ihihihi!"
52135-30 = "[s] \"...Shuro.\""
52135-34 = "O que foi, Sensei da Schale? Agora ficou com medo de morrer, éee?"
52135-35 = "Ninguém vai vir te salvar agoraaa."
52135-36 = "Deixe o Crepúsculo te devorar sem fazer cena, táaa? Aí você pode ir aconselhar as suas alunas lá do outro ladooo."
52135-37 = "[s] \"...Aquilo de antes foi mesmo atuação?\""
52135-38 = "...Ngh!"
52135-39 = "Já disse que era atuação! Tá achando que eu fiquei com medo, é?!"
52135-40 = "Que nojo, falando como se soubesse de tudo! Vire comida do Hyakumonogatari logo de uma vez!"
52135-44 = "Vamos, atire logooo!"
52135-55 = "Hã...?"
52135-56 = "O Hyakumonogatari das histórias de terror... atirou em mim...?"
52135-57 = "M-Mentira... não pode ser... Kokuriko-samaaa..."
52135-67 = "(Snif)... Não pode ser..."
52135-73 = "[ns3] \"O que está acontecendo...?\"\n[ns4] \"Por que o Hyakumonogatari atirou na Shuro?\""
52135-76 = "...Será que houve algum problema interno no Clube Beleza da Natureza?"
52135-77 = "Mais importante, parece que a Shuro-san não consegue mais controlar o Hyakumonogatari."
52135-78 = "Se ela for atacada agora..."
52135-79 = "Ela vai ser engolida pelo Crepúsculo..."
52135-80 = "Talvez... ela tenha colhido o que plantou."
52135-81 = "[s] \"...Eu vou lá.\""
52135-85 = "E-Está falando sério?"
52135-86 = "O Hyakumonogatari desapareceu, mas ainda é perigoso."
52135-87 = "A \"Mansão Higan\" continua sendo território inimigo..."
52135-88 = "Aquela garota estava tentando matar você, sabia?"
52135-89 = "Isso é imprudente demais—"
52135-91 = "[ns5] \"Se há uma garota em perigo, eu preciso ajudá-la.\"\n[ns6] \"Eu julgo depois.\""
52135-100 = "Haha..."
52135-104 = "De algum jeito, eu já imaginava que você diria isso."
52135-109 = "Arf... arf... arf..."
52135-112 = "(É mentira, é mentira, é mentira...!)"
52135-113 = "(Eu fui mesmo... descartada?)"
52135-114 = "(A Kokuriko-sama ficou brava porque eu falhei duas vezes...?)"
52135-115 = "(É por isso que o Hyakumonogatari me...)"
52135-116 = "(Eu não quero isso! Sem a Kokuriko-sama, eu vou acabar de novo...)"
52135-129 = "Não... paraaa..."
52135-130 = "Eu não quero ser abandonada de novo... não quero voltar pra aquele lugar..."
52135-137 = "...P-Paraaa!!"
52135-146 = "...Hã?"
52135-147 = "[s] \"Ainda bem... que cheguei a tempo.\""
52135-148 = "...Sensei da Schale?"
52135-149 = "Por que se jogou na frente...?"
52135-150 = "[s] \"Vim te salvar.\""
52135-151 = "Mas..."
52135-152 = "Eu... eu tentei matar você..."
52135-153 = "O-O que você tá pensando, hein?!"
52135-154 = "Tá achando que eu vou virar boazinha por causa disso?!"
52135-155 = "[s7] \"Não preciso de motivo para salvar alguém em perigo.\"\n[s8] \"É o mínimo a se fazer como ser humano.\""
52135-160 = "Não brinca comigo...!"
52135-161 = "Eu sei muito bem que você, diferente de nós, cai com um único tirooo!"
52135-162 = "E mesmo assim... mesmo assim, você salvou uma inimiga que tentou jogar não só você, mas as suas alunas pro Crepúsculo devorar?!"
52135-163 = "...Você é idiotaaa?!"
52135-164 = "[s] \"Está tudo bem, Shuro-chan. Eu sou mais resistente do que pareço.\""
52135-168 = "Quem você tá chamando de Shuro-chan—"
52135-169 = "[s] \"Mas, pensando bem, dói mesmo...\""
52135-173 = "...Hã?"
52135-181 = "Mestreee!"
52135-186 = "Ah, que bom que vocês também estão a salvo!"
52135-187 = "A-Agora há pouco, o Hyakumonogatari apareceu..."
52135-188 = "Eu sei."
52135-189 = "...Sensei [USERNAME] está bem?"
52135-190 = "Hum... Sensei—"
52135-191 = "Foi atrás da Shuro-san, que foi atacada pelo Hyakumonogatari..."
52135-195 = "Eu bem que tentei impedir..."
52135-197 = "E mesmo assim você deixou o Mestre ir sozinho?!"
52135-198 = "Nem que fosse à força—"
52135-204 = "Kikyou?!"
52135-205 = "N-Não precisa exagerar assim..."
52135-206 = "Eu estava focada demais na Presidente Ayame."
52135-207 = "Suspeitava que o Clube Beleza da Natureza estivesse escondido em algum lugar..."
52135-211 = "Mas nunca imaginei que estivesse tão perto."
52135-217 = "...Aha."
52135-221 = "...Como você descobriu?"
52135-223 = "Próximo;A Artista Macabra do Clube Beleza da Natureza"
