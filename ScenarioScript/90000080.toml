[translation]
90000080-1 = "Эпизод 9;Поисковая Операция"
90000080-3 = "Президент, Кетер начал двигаться. Он направляется сюда."
90000080-4 = "Контакт примерно через три минуты."
90000080-5 = "Значит, и это тупик..."
90000080-6 = "Подтверждаю. Какой бы маршрут вы ни выбрали, Кетер преграждает дорогу."
90000080-7 = "Похоже, оторваться от него невозможно. Он оказывается везде, куда мы поворачиваем."
90000080-8 = "Исследование Района Затопленных Руин... может занять намного больше времени, чем мы предполагали..."
90000080-9 = "А я так уверенно рассчитывала сыграть в тактические прятки... Ну ладно."
90000080-10 = "Сенсей, пока отступайте вместе с Эйми. Я попробую придумать другое решение."
90000080-11 = "[s] «Веди.»"
