103120-117 = "..."
103120-119 = "Я не знаю тебя, Кей. Но я подумала, что бы чувствовала на твоём месте."
103120-120 = "Если предназначение Кей — быть ключом, ведущим к уничтожению мира, значит, тебе пришлось в одиночку нести огромную боль и одиночество."
103120-123 = "И тогда я поняла: Кей всё это время страдала."
103120-125 = "Принцесса... Я..."
103120-127 = "Сенсей сказал мне, что я сама могу решать, в чём смысл моего существования."
