103120-136 = "За именем «Кей» нет ни причины, ни смысла, ни предназначения."
103120-138 = "Вы... Вы не хотите, чтобы я больше страдала? Даже если я существую лишь для уничтожения мира? Мне не обязательно... быть одной?"
103120-139 = "В-Вы спасёте меня, принцесса? Вы это хотите сказать?"
103120-141 = "Я не знаю, способна ли кого-то спасти."
