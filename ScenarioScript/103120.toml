103120-5 = "Н-Не может быть..."
103120-6 = "Мы думали, что сможем тягаться с этим чудовищем? Какая самонадеянность..."
103120-7 = "Снизьте скорость корабля! Если так продолжится, мы столкнёмся с тем деформированным многомерным барьером!"
103120-8 = "Если мы врежемся в него при нынешнем состоянии резонанса... нас либо затянет в незнакомое измерение, либо разорвёт на куски!"
103120-9 = "Э-Эм... Даже если мы замедлимся, это лишь отсрочит неизбежное столкновение!"
103120-10 = "Мы никак не можем пройти?"
103120-12 = "...Это невозможно. Тут уже скорее область концепций, чем науки. С нашими знаниями мы не можем разрушить это состояние."
103120-13 = "...Возможно, есть один способ."
103120-14 = "...!"
103120-15 = "Если это копия Ковчега Атрахасис, то вмешаться способно только..."
