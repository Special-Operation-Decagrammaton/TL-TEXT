103120-19 = "Что?! Что вы такое говорите, президент?!"
103120-20 = "Нет! Нельзя! Если Ковчег сделает это..."
103120-21 = "Старшая сестра, ты же не серьёзно...!"
103120-23 = "До столкновения шесть минут...! Хватит спорить, ищите решение!"
103120-25 = "Я понимаю."
