[translation]
221120-1 = "Episode 12;Taking Up the Oar"
221120-3 = "(After hearing from Sanae, I hurried toward the island's officer room.)"
221120-6 = "Olympus - Island Officer Room"
221120-9 = "Body temperature dropped to 36 degrees, blood pressure 190 mmHg, pulse over 220."
221120-10 = "Respiration is shallow and she is exhibiting mouth breathing.#nHer heart function is likely deteriorating as well."
221120-11 = "High blood pressure caused by impaired renal function may have negatively affected the heart."
221120-12 = "All other organs are weakening too... I do not think she has much time left."
221120-13 = "No way... She was running around full of energy just this morning..."
221120-14 = "Why all of a sudden..."
221120-15 = "From the start, her condition was such that it would not be strange for this to happen at any time."
221120-16 = "Considering her age, it is not uncommon for her condition to suddenly change in a matter of hours and become critical."
221120-17 = "If anything, she was just too energetic until now."
221120-23 = "...This is my fault."
221120-24 = "Because I pushed her too hard when trying to get Sammy off..."
221120-25 = "If I had... mustered up the courage sooner..."
221120-27 = "Right now, such assumptions are meaningless."
221120-28 = "Countless coincidences and inevitable factors are intertwined in the worsening of symptoms."
221120-29 = "If we judge based on a single assumption and stop thinking, no disease can be cured."
221120-30 = "For now, just watch over Sammy."
221120-31 = ".........Hah."
221120-32 = "Captain, please make a decision."
221120-33 = "Wh-, what...?"
221120-34 = "Sammy is a precious friend. My feelings of not wanting to part ways are no different from yours.#nHowever..."
221120-35 = "A cat losing its life on a ship is one of the heaviest taboos of all.#nIt is incomparable to whistling or sneezing."
221120-36 = "Therefore, in the past, all ship's cats have ended their lives on land."
221120-37 = "If we do not decide quickly, it will become irreversible."
221120-42 = "No matter how much we must not break taboos, this is just too much!"
221120-43 = "Sumika. Do not interrupt the island's decision."
221120-44 = "[s] \"Wait, this is not the time for that kind of talk--\""
221120-46 = "Please wait, Sensei."
221120-47 = "This is an Odyssey matter."
221120-48 = "--Let us decide."
221120-55 = "Vice Captain Ami, prepare for an emergency broadcast."
221120-56 = "Also, please begin preparations for the Olympus to set sail."
221120-66 = "Ah, ah, I am Minato Umiji, Captain of the Odyssey."
221120-67 = "Sorry for startling you so suddenly.#nI have never broadcasted like this before, and I suppose some of you are hearing my voice for the first time."
221120-68 = "Given the late hour, I imagine some of you were already trying to sleep, but..."
221120-72 = "As Captain, I address all students of the Odyssey."
221120-73 = "Sammy, the ship's cat of Odyssey Marine High School and our friend, is--#ncurrently in critical condition."
221120-74 = "According to the Chief Medical Officer, tonight will be difficult."
221120-75 = "As you all know, a cat losing its life on a ship is an unforgivable taboo for a sailor."
221120-76 = "That is why the seniors of Odyssey would put cats whose lives were nearing their end ashore#nand welcome new ship's cats."
221120-78 = "But you see... I know. Sammy loved this ship."
221120-80 = "She loved chasing bubbles on the deck and playing tag."
221120-82 = "On sunny days, she loved climbing on top of the bridge and gazing at the sea."
221120-85 = "...She loved playing with balls made of old rope."
221120-88 = "--I!#nSending away a companion with whom we shared hardships and joys to an unfamiliar land goes against decency."
221120-92 = "That is why, for this time only, I want to indulge in my selfishness as Captain."
221120-93 = "As a final gift, I want to show Sammy the scenery she loved."
221120-94 = "Instead of a port where everything stands still, let us gift her our everyday scenery where waves rise and sea breezes blow."
221120-95 = "The Odyssey flagship, the Olympus, will--set sail at 0600 tomorrow morning."
221120-96 = "Of course, you are under no obligation to share in this ill-omened voyage."
221120-97 = "Even if you leave the ship to avoid the taboo, you will not be held responsible."
221120-98 = "Objections will be accepted after the voyage is over."
221120-103 = "Each department is to submit a report after inspections before departure."
221120-104 = "--End. Odyssey Captain, Minato Umiji."
221120-108 = "Next Episode;The Final Voyage"
