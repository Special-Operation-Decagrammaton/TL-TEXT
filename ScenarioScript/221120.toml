[translation]
221120-1 = "Episódio 12;Erguer os Remos"
221120-3 = "（Após receber a ligação urgente de Sanae, rumei às pressas para a sala de oficiais do conselho Island.）"
221120-6 = "Olympos - Sala de Oficiais do Island"
221120-8 = ""
221120-9 = "Temperatura corporal em declínio rápido para 36°C, pressão arterial acima de 190mmHg, pulso ultrapassando 220 batimentos."
221120-10 = "Respiração extremamente superficial com episódios repetidos de respiração agônica pela boca.#nÉ quase certo que a função cardíaca esteja entrando em colapso."
221120-11 = "A hipertensão crônica decorrente da insuficiência renal sobrecarregou o coração de forma irreversível."
221120-12 = "Os demais órgãos vitais também apresentam falência iminente... Dificilmente ele resistirá por muito tempo."
221120-13 = "Não pode ser... Ele estava correndo e brincando pelo convés até esta manhã..."
221120-14 = "Como foi piorar tão de repente...?"
221120-15 = "O quadro clínico dele já estava no limite há semanas."
221120-16 = "Na idade dele, uma descompensação súbita evoluindo para estado terminal em questão de poucas horas não é surpresa alguma para a medicina veterinária."
221120-17 = "Pelo contrário, é surpreendente como ele aguentou firme até hoje."
221120-18 = ""
221120-20 = ""
221120-22 = ""
221120-23 = "......A culpa foi toda minha."
221120-24 = "Por ter insistido em desembarcá-lo, forcei o corpinho dele a um estresse desnecessário..."
221120-25 = "Se eu... tivesse tido coragem de tomar essa decisão antes..."
221120-27 = "Fazer suposições tardias a esta altura não tem relevância médica alguma."
221120-28 = "O colapso de um organismo vivo envolve uma teia complexa de causas necessárias e acidentais."
221120-29 = "Reduzir tudo a um único remorso e paralisar o raciocínio não curará enfermidade alguma."
221120-30 = "Neste momento, a única coisa que podemos fazer é velar por ele com serenidade."
221120-31 = "............Haaah."
221120-32 = "Capitã, a senhorita precisa tomar uma resolução final."
221120-33 = "U-Uma resolução... do quê...?"
221120-34 = "O Sammy é um companheiro insubstituível, meu peito também se despedaça com a partida dele. No entanto..."
221120-35 = "Entre todos os tabus náuticos, 'um gato perder a vida a bordo de uma embarcação' é a maldição mais temida de todas.#nInfinitamente mais grave do que assobios ou espirros no convés."
221120-36 = "Por essa razão, na história da navegação, todos os gatos marinheiros foram desembarcados em terra antes do suspiro final."
221120-37 = "Se não agirmos imediatamente, as consequências internas serão irreversíveis."
221120-38 = ""
221120-41 = ""
221120-42 = "Por mais sagrados que sejam os tabus, isso já é crueldade demais!"
221120-43 = "Sumika, contenha-se! Alunas do Trident não têm prerrogativa de interferir nas decisões do conselho!"
221120-44 = "[s] \"Esperem um instante, este não é o momento para discussões――\""
221120-46 = "Por favor, aguarde, Sensei."
221120-47 = "Esta é uma encruzilhada que pertence exclusivamente à Odisseia."
221120-48 = "――Permita que nós mesmas definamos o nosso destino."
221120-49 = ""
221120-52 = ""
221120-54 = ""
221120-55 = "Vice-Capitã Ami, prepare o sistema de som para uma transmissão geral de emergência."
221120-56 = "E inicie imediatamente os procedimentos para a desatracação e partida do Olympos."
221120-59 = ""
221120-62 = ""
221120-64 = ""
221120-66 = "Atenção a toda a tripulação. Aqui quem fala é a Capitã da Odisseia, [ruby=Kairo]Minato[/ruby]."
221120-67 = "Peço desculpas pelo sobressalto repentino a estas horas da noite.#nQuase nunca utilizo os canais gerais, imagino que muitas calouras estejam ouvindo minha voz pela primeira vez."
221120-68 = "Sei que a maioria já estava recolhida aos seus aposentos para dormir, mas..."
221120-69 = ""
221120-71 = ""
221120-72 = "Na qualidade de Capitã, comunico a todas as alunas da Odisseia:"
221120-73 = "O nosso venerável gato marinheiro e amigo mais leal, Sammy――#nencontra-se neste exato momento em estado terminal crítico."
221120-74 = "Pelo diagnóstico da doutora [ruby=Funamori]Sanae[/ruby], ele dificilmente superará esta noite."
221120-75 = "Como é de conhecimento de cada tripulante deste navio, a morte de um felino em alto-mar é um tabu supremo e imperdoável para os marinheiros."
221120-76 = "Por essa razão secular, as gerações que nos precederam sempre desembarcaram os gatos enfermos em terra para acolher um novo mascote a bordo."
221120-78 = "Mas vejam bem... eu sei o quanto o Sammy amava estar neste navio."
221120-79 = ""
221120-80 = "Ele adorava correr pelo convés estourando bolhas de sabão e brincando de pega-pega com vocês."
221120-81 = ""
221120-82 = "Nos dias de céu límpido, ele subia até o topo da torre de comando e passava horas contemplando as ondas do oceano."
221120-85 = "......E se divertia como um filhote com aquela velha bola feita de cabo naval surrado."
221120-88 = "――Por tudo isso!#nEu considero uma covardia indigna banir para uma terra estranha o companheiro que compartilhou cada tempestade e cada alegria ao nosso lado!"
221120-89 = ""
221120-91 = ""
221120-92 = "Por isso, apenas desta vez, peço licença para exercer a prerrogativa da minha autoridade."
221120-93 = "Como último tributo de despedida, quero presenteá-lo com a paisagem que ele mais amou durante toda a sua existência."
221120-94 = "Não as águas paradas e cinzentas de um cais adormecido, mas o balanço das ondas e o sopro livre da maresia: [ruby=o mar aberto]o seu verdadeiro lar[/ruby]."
221120-95 = "A nau capitânia da Odisseia, o Olympos――zarpará pontualmente às 06h00 de amanhã!"
221120-96 = "Obviamente, nenhuma aluna está obrigada a participar desta viagem repleta de presságios sombrios."
221120-97 = "Aquelas que desejarem desembarcar para se resguardarem do tabu têm plena liberdade de fazê-lo, sem qualquer sanção disciplinar."
221120-98 = "Quaisquer contestações ou protestos formais serão ouvidos após o regresso da embarcação."
221120-99 = ""
221120-103 = "Que todos os postos efetuem a checagem dos equipamentos e encaminhem seus relatórios de prontidão antes da partida."
221120-104 = "――Transmissão encerrada. Capitã da Odisseia, Minato Kairo."
221120-108 = "Próximo Episódio;A Última Viagem"
