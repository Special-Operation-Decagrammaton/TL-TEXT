[translation]
1012006-1 = "Барабаны рассвета"
1012006-2 = "Я устроил себе бессонную ночь, пытаясь закончить работу до дедлайна..."
1012006-3 = "Измотавшись и решив передохнуть, я вышел на улицу подышать свежим воздухом."
1012006-4 = ""
1012006-11 = "И кого же я нашёл у реки, как не..."
1012006-12 = "Хм? Сенсей?"
1012006-13 = ""
1012006-16 = "Что привело вас сюда так поздно? Или уже рано?"
1012006-17 = "Ох. Вы работали всю ночь?"
1012006-18 = "...Ответственность — палка о двух концах."
1012006-19 = "[s] «А ТЫ что здесь делаешь, Нацу?»"
1012006-20 = "Я бегала."
1012006-21 = "С тех пор как вступила в группу, каждое утро бегаю вдоль реки."
1012006-22 = "Бить по барабанам гораздо тяжелее физически, чем можно подумать."
1012006-23 = "Поэтому я работаю над выносливостью."
1012006-24 = "Можно сказать, я... расходую силы вне сцены, чтобы проявлять силу на сцене."
1012006-25 = "[s] «Ты трудяга, Нацу.»"
1012006-26 = "Ха."
1012006-27 = "Вам ли говорить, Сенсей."
1012006-28 = "[s1] «Старательному студенту...»\n[s2] «...полагается угощение.»"
1012006-31 = ""
1012006-33 = ""
1012006-36 = "Я купил в ближайшем автомате две банки чёрного кофе и одну протянул Нацу."
1012006-38 = "О, спасибо, Сенсей."
1012006-39 = "Кофе с нулевой калорийностью... уникальный десерт после тренировки."
1012006-40 = "Я сел с Нацу на скамейку."
1012006-41 = ""
1012006-43 = ""
1012006-44 = "Во время тренировки я поняла, что барабаны прекрасно демонстрируют понятие «антиномии»."
1012006-45 = "Представьте барабанщика: сидит в глубине сцены, почти незаметный."
1012006-46 = "Его видят меньше всех, но именно его ритм ведёт выступление."
1012006-47 = "Все инструменты следуют за ним, за его движущим ритмом."
1012006-48 = "Другим участникам может хотеться ускорить темп, но барабанщик обязан оставаться стабильным."
1012006-49 = "Он должен сохранять спокойствие и удерживать бьющееся сердце песни на верном пути."
1012006-50 = "Так что, хотя я играю на самом громком инструменте, делать это должна со спокойным разумом и собранным сердцем."
1012006-51 = "Конечно, я не хочу сказать, что барабанщик важнее всех."
1012006-52 = "У каждой роли есть своё место."
1012006-53 = "Но лично для меня барабаны приносят огромное удовлетворение."
1012006-54 = "Ну..."
1012006-55 = ""
1012006-61 = "Я продолжал слушать Нацу, но..."
1012006-62 = "...меня так клонило в сон, что даже кофе уже не помогал."
1012006-63 = ""
1012006-65 = ""
1012006-67 = ""
1012006-69 = ""
1012006-72 = "Веки налились тяжестью, и я начал проваливаться в сон..."
1012006-73 = ""
1012006-76 = "С-Сенсей...?"
1012006-77 = "Мои плечи..."
1012006-78 = "..."
1012006-79 = "...!"
1012006-80 = "*тук-тук* *тук-тук*"
1012006-81 = "Эм..."
1012006-82 = "Сенсей...?"
1012006-83 = "Э-э..."
1012006-84 = "..."
1012006-85 = "Это тревожно..."
1012006-86 = "Сердце не должно биться... так быстро..."
1012006-93 = "Я проснулся через несколько минут. Каким-то образом Нацу уже дотащила меня обратно в Шале."
1012006-94 = "Убедившись, что со мной всё хорошо, она, не сказав больше ни слова, быстро скрылась в рассвете."
