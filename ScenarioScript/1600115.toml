[translation]
1600115-1 = "Талисман удачи"
1600115-2 = "К тому моменту, как я добрался туда, Асуна уже была в самом разгаре боя."
1600115-3 = ""
1600115-8 = "Ну бли-и-ин! Это совсем портит всю идею «проникнуть незаметно», знаешь!"
1600115-9 = "Серьёзно?! Ты СЕРЬЁЗНО думала пробраться сюда В ТАКОМ наряде?"
1600115-10 = "Если на нашу сделку заявляется ГОРНИЧНАЯ, конечно охрана заметит! Тут всё кишит охранниками!"
1600115-11 = "Но я же не могу просто снять форму—"
1600115-12 = ""
1600115-14 = ""
1600115-15 = "О? А почему бы мне просто её не снять?"
1600115-16 = ""
1600115-19 = "[ns1] «Нет! Нельзя!»\n[ns2] «Лучше я тебе помогу, Асуна!»"
1600115-22 = ""
1600115-23 = "Ух ты-ы! Это Господин!!"
1600115-24 = "Ладненько! План Б — прорываемся силой!"
1600115-25 = ""
1600115-27 = ""
1600115-28 = "Остановите её!"
1600115-29 = "Не дайте ей добраться до площадки!"
1600115-30 = ""
1600115-32 = ""
1600115-37 = "Жестокий бой продолжался..."
1600115-39 = "Тц, как бесит...! Мы даже ОДНОГО члена C&C остановить не можем?"
1600115-40 = "Вот тебе и C&C..."
1600115-41 = ""
1600115-43 = ""
1600115-46 = "[ns] «Ты в порядке, Асуна?»"
1600115-47 = "Ага-ага! Даже не вспотела!"
1600115-48 = "Но секундочку! В драке куда-то улетела моя лента!"
1600115-50 = "Может, здесь?"
1600115-51 = ""
1600115-54 = "Или здесь...?"
1600115-55 = ""
1600115-58 = "Ай! Моя нога!"
1600115-59 = "А! Прости-прости!"
1600115-60 = "Эй, а ТЫ не видел где-нибудь синюю ленту для волос?"
1600115-61 = "Я немного занята ПУЛЕВЫМ РАНЕНИЕМ, которое ты мне только что оставила!"
1600115-62 = "Ой, прости-и! Ты пока полежи тут!"
1600115-63 = ""
1600115-66 = "А, нашла! Повезло!"
1600115-68 = "Господин, Господин! Долго ждал?"
1600115-69 = "[s] «Нашла свою ленту?»"
1600115-70 = "Ага-ага! Вот эта синяя! Я ей волосы завязываю."
1600115-71 = "Хорошо, что нашла. Пойдём отчитаемся и закончим миссию!"
1600115-73 = ""
1600115-75 = ""
1600115-76 = "[ns] «Если подумать, ты всегда носишь эту ленту.»"
1600115-77 = "Ага! Ты заметил, Господин?"
1600115-78 = ""
1600115-80 = ""
1600115-82 = "Это мой талисман удачи! С тех пор как начала её носить, всё в жизни стало складываться лучше!"
1600115-83 = "Например?"
1600115-84 = "Хм! Да много чего!"
1600115-85 = "А, точно."
1600115-86 = "Например, как-то я до последнего откладывала подготовку к тесту на следующий день и уснула за каракулями!"
1600115-87 = "Но пришла на тест в этой ленте и угадала все ответы!"
1600115-88 = "[s] «Все?!»"
1600115-89 = "Ага!! Вообще все!"
1600115-90 = "О, и ещё, ещё!"
1600115-91 = "В моём любимом десертном кафе специальное блюдо обычно продают всего по двадцать порций в день, да?"
1600115-92 = "Но если я была в этой ленте, мне всегда доставалась порция! И не раз — самая последняя!"
1600115-93 = "[s] «Невероятно!»"
1600115-94 = "ПРАВДА?! Но это ещё не всё!"
1600115-95 = "Однажды прямо во время боя у меня закончились патроны! Плохо же, да? А врагов ещё была целая ку-у-уча!"
1600115-96 = "Так я превратила ленту в пращу и настучала всем по головам, пока не победила!"
1600115-97 = "[s] «Не уверен, что я бы назвал это „удачей“...»"
1600115-98 = "Вот настолько она сильная! Моя счастливая лента защищает меня!"
1600115-99 = "Фу-фу, смотри, она до сих пор как новенькая, правда? Правда? Потому что я очень-очень за ней слежу!"
1600115-100 = "[s5] «А если он снова выпадет из волос?»\n[s6] «Однажды ты можешь его потерять.»"
1600115-103 = "Правда потерять?"
1600115-104 = "...Хм..."
1600115-105 = "...Хм-м..."
1600115-106 = "Хммм..."
1600115-107 = "[s] «З-Забудь, что я это сказал! Не знаю, зачем вообще ляпнул!»"
1600115-108 = "Думаю, всё было бы нормально!"
1600115-109 = "[s] «А?»"
1600115-110 = "Конечно, я бы очень-очень расстроилась и загрустила..."
1600115-111 = "Но эта лента уже принесла Асуне более чем достаточно удачи!"
1600115-112 = "Доказательство прямо передо мной!"
1600115-113 = "Я ведь встретила тебя, Господин?"
1600115-114 = "Так что даже если потеряю её — ничего страшного! Ага! Я на сто процентов уверена!"
1600115-115 = "[s7] «Я глубоко тронут твоими словами!»\n[s8] «Но давай всё же постараемся его не потерять!»"
1600115-118 = "Хи-хи, ага!"
1600115-119 = "Асуна будет осторожна, чтобы не потерять ни Господина, ни свою ленту!"
1600115-121 = "По дороге обратно мы с Асуной обсуждали другие счастливые случаи из нашей жизни."
