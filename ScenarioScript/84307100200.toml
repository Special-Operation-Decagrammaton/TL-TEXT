[translation]
84307100200-5 = "С возвращением, Нэру. У меня для тебя новое задание."
84307100200-6 = ""
84307100200-8 = ""
84307100200-9 = "Серьёзно? Я только что пришла!"
84307100200-10 = "Думаешь, можешь просто командовать мной? Я сказала, что помогу, но..."
84307100200-11 = "...А Сэя? Ты ведь не решила всё свалить только на меня, да? Для неё тоже что-то есть?"
84307100200-12 = "Юризоно Сэя уже выполняет задание и делает всё, что может. Как и я здесь. И я очень благодарна вам за всю тяжёлую работу и вклад."
84307100200-13 = "Но это задание я не могу поручить ей. В этот раз нужна именно ты."
84307100200-14 = "Почему, это боевое задание или что-то такое?"
84307100200-15 = "Да, боевое."
84307100200-16 = ""
84307100200-18 = ""
84307100200-19 = "Ладно, логично."
84307100200-20 = "...Ты быстро понимаешь."
84307100200-21 = "Ну, ты сразу перешла к делу. Если говоришь разумные вещи, я спорить не стану. Если только сама не хочешь."
84307100200-22 = "Не хочу."
84307100200-23 = "В любом случае... вот, возьми это."
84307100200-24 = "...? Что это?"
84307100200-25 = ""
84307100200-27 = ""
84307100200-28 = "Наколенники? Они особенные? Ты их изобрела?"
84307100200-29 = "Технология не новая, но у них есть одна специальная функция."
84307100200-30 = "С ними ты сможешь одним движением проскользить через комнату, не издав ни звука."
84307100200-31 = ""
84307100200-33 = ""
84307100200-34 = "И ещё вот это..."
84307100200-35 = ""
84307100200-37 = ""
84307100200-39 = "С его помощью можно ударом тока оглушить и обезвредить цель — опять же без шума. Думаю, тебе пригодится."
84307100200-40 = "Хех... Много забавных игрушек. Неплохо."
84307100200-41 = ""
84307100200-43 = ""
84307100200-44 = "И я могу сразу использовать их на этом задании, да?"
84307100200-45 = "Конечно. Для этого я их тебе и дала."
84307100200-46 = ""
84307100200-48 = "Задание простое. Я обнаружила людей, которые пытаются пробраться на территорию Экспо и украсть экспонаты. Нужно их обезвредить."
84307100200-49 = ""
84307100200-51 = ""
84307100200-53 = ""
84307100200-54 = "Главная цель — их лидер. Пока она на ногах, они не остановятся. Выруби её, а потом передай властям для допроса."
84307100200-57 = "А остальные? Я могу просто избить их и оставить в отключке, да?"
84307100200-58 = "Пока не стреляешь."
84307100200-59 = "Хех... Ладно, в этот раз только ближний бой. Весело!"
84307100200-60 = "Не то чтобы я за тебя переживала, но всё же должна сказать: «Будь осторожна и не пострадай»."
84307100200-61 = "Когда ты так это говоришь, смысл теряется..."
84307100200-62 = "...но для тебя это прогресс, так что засчитаю."
84307100200-63 = ""
84307100200-65 = ""
84307100200-66 = "Тогда я пошла. Жди меня здесь."
84307100200-68 = "...Береги себя."
