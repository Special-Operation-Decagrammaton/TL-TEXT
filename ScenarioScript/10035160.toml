[translation]
10035160-1 = "Послесловие;День Бюро общественного порядка без директора"
10035160-3 = ""
10035160-4 = "Раз директора Канны нет, вам придётся исполнять её обязанности, заместитель директора."
10035160-5 = ""
10035160-7 = ""
10035160-9 = "*вздыхает*"
10035160-10 = "Я рада, что отправила сестрёнку в аквапарк, но не подумала, сколько работы она оставит."
10035160-11 = ""
10035160-13 = ""
10035160-14 = "Сначала нужно ваше одобрение на всех этих документах."
10035160-15 = "Ладно, ладно..."
10035160-16 = "Печать сестрёнки... Где... же... она...?"
10035160-17 = ""
10035160-19 = ""
10035160-20 = ""
10035160-21 = ""
10035160-22 = "Нашла."
10035160-23 = ""
10035160-25 = ""
10035160-26 = ""
10035160-27 = "...Так, печать есть, но КАК я разберусь со всем этим..."
10035160-28 = "*вздыхает* Работа, работа, работа..."
10035160-29 = "Хм, план ремонта пункта питания Бюро общественного порядка, хорошо."
10035160-30 = "«Запрос на установку окна в подземной комнате для допросов.»"
10035160-31 = "Что это? Отклонено!"
10035160-32 = "«Запрос на смену поставщика кацудона». ...Одобрено!"
10035160-33 = ""
10035160-35 = ""
10035160-37 = "(Идёт быстрее, чем я ожидала...)"
10035160-38 = "(Такими темпами я и правда могу закончить сегодня.)"
10035160-39 = ""
10035160-41 = ""
10035160-42 = ""
10035160-43 = "Угх, не хочу этим заниматься."
10035160-45 = "Чем заниматься?! Ты почти ничего не сделала!"
10035160-46 = "Я просто ненавижу бумажную работу. От неё я вся из себя выхожу. Терпеть не могу."
10035160-47 = "Но заместитель директора, эти документы НУЖНО закончить сегодня."
10035160-48 = "Да, я понимаю, но..."
10035160-49 = ""
10035160-51 = ""
10035160-52 = "Скажи честно, тебе ведь тоже скучно, да?"
10035160-53 = "А-А?"
10035160-54 = "Ха, можешь не стесняться. Тебе же ненавистно весь день сидеть за столом и пялиться в бумаги, правда?"
10035160-55 = "Нет, вовсе нет!"
10035160-56 = "Э-Это важная часть нашей работы, и..."
10035160-57 = "А, меня не обманешь."
10035160-58 = "Признайся, тебе хочется выйти наружу и насладиться летом, да?"
10035160-59 = "...Да?"
10035160-60 = "Ха, тогда ты не оставляешь мне выбора!"
10035160-61 = "Как заместитель директора, я обязана учитывать жалобы сотрудников!"
10035160-62 = ""
10035160-64 = ""
10035160-65 = "Внимание всем! Слушайте внимательно!"
10035160-67 = "Сегодня после обеда состоится обязательная тренировка Бюро общественного порядка по ведению боя на воде!"
10035160-68 = "Вот так внезапно?!"
10035160-69 = ""
10035160-71 = ""
10035160-78 = ""
10035160-80 = "Угу!"
10035160-81 = "На знаменитом открытом тренировочном бассейне Полицейской школы «Валькирия»!"
10035160-82 = "Мы должны соответствовать нашему директору — она уже снаружи и в воде!"
10035160-83 = "Каждая проплывёт по 200 кругов!"
10035160-84 = "Все готовы?!"
10035160-86 = "А? 200 кругов? Вы шутите?"
10035160-87 = "Может, ВЫ и можете, а мы нет!"
10035160-89 = "А? Что ты сказала?"
10035160-90 = "Если хочешь хранить порядок, нужен дух!"
10035160-91 = "К тому же всего-то надо немного махать руками и ногами. Любой сможет!"
10035160-92 = ""
10035160-95 = ""
10035160-96 = ""
10035160-97 = "Эм... ладно..."
10035160-99 = "Я не услышала!"
10035160-101 = ""
10035160-102 = "Есть, заместитель директора!"
10035160-104 = "Вот так-то лучше!"
10035160-105 = "А после этого мы пойдём есть хороший тонкоцу-рамен. С кучей чеснока! Я угощаю!"
10035160-106 = "Лично я бы предпочла торт или макаруны..."
10035160-107 = "Тс-с, это любит заместитель директора. Просто соглашайся."
10035160-109 = "Там без разговоров!"
10035160-110 = "Пошли. За мной!"
10035160-111 = ""
10035160-115 = ""
10035160-116 = "А-А?"
10035160-118 = "Только что появилась чёрная кошка... и исчезла."
10035160-119 = "Заместитель директора, вы ведь только что сказали, что... поведёте нас?"
10035160-121 = "Эм... ну..."
10035160-122 = ""
10035160-124 = ""
10035160-125 = ""
10035160-127 = "(Чёрные кошки — к несчастью...)"
10035160-128 = "(Кстати, сегодня утром в моём завтраке было ровно тринадцать горошин...)"
10035160-129 = "(А ещё я потеряла четырёхлистный клевер, который нашла на прошлой неделе...)"
10035160-130 = "(У меня плохое предчувствие...)"
10035160-131 = "(Очень, очень, очень плохое!)"
10035160-132 = ""
10035160-134 = "Я... Вообще-то я с вами не пойду."
10035160-135 = ""
10035160-138 = ""
10035160-139 = "А? В смысле?"
10035160-140 = "Вы хотите, чтобы мы тренировались без вас?!"
10035160-141 = "Это вы только что всех сюда созвали!"
10035160-143 = "В-В любом случае! Сейчас слишком много неизвестного!"
10035160-144 = "Вы и без меня потренируетесь, всё нормально!"
10035160-145 = ""
10035160-148 = ""
10035160-149 = "Отлично, у нас опять какой-то «дурной знак». Что будем делать?"
10035160-150 = "В смысле, «что будем делать»? Мы не обязаны страдать одни."
10035160-151 = ""
10035160-153 = ""
10035160-155 = "Акх!"
10035160-156 = ""
10035160-158 = ""
10035160-161 = ""
10035160-164 = ""
10035160-165 = ""
10035160-166 = "Ч-Что вы делаете?!"
10035160-168 = "О-Отпусти меня...!"
10035160-169 = ""
10035160-172 = ""
10035160-173 = ""
10035160-180 = "О, за это я вас НАКАЖУ."
10035160-181 = "А-а! Она за нами гонится! Бежим!"
10035160-182 = ""
10035160-184 = ""
10035160-186 = ""
10035160-187 = "Заместитель директора! Сюда! Вот сюда!"
10035160-188 = ""
10035160-190 = ""
10035160-191 = ""
10035160-193 = ""
10035160-194 = ""
10035160-195 = ""
10035160-197 = "И так проходят летние дни в Бюро общественного порядка..."
