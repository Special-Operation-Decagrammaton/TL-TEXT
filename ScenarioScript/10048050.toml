[translation]
10048050-1 = "Эпизод 5;Источник цвета"
10048050-3 = "[log]Улитки заплачут,[/log]"
10048050-4 = "[log]твёрдое небо смягчится,[/log]"
10048050-5 = "[log]лишь король улыбнётся.[/log]"
10048050-6 = "[log]Когда двери закроются и радуга сольётся воедино, в тот волшебный миг —[/log]"
10048050-7 = "[log]я явлюсь.[/log]"
10048050-10 = ""
10048050-11 = "Правда? Это действительно написала Благородная воровка?"
10048050-13 = "Это копия... очевидно. Оригинал хранится у Префектурного совета в комнате для вещественных доказательств."
10048050-14 = "Ты поняла, что я имею в виду. То есть послание настоящее?"
10048050-15 = "Верно."
10048050-16 = "Эй, эй, а кто вообще эта Благородная воровка?"
10048050-17 = "Она НАСТОЯЩАЯ похитительница произведений искусства, не то что мы. Она печально известна не только своей дерзостью, но и процентом успешных краж."
10048050-18 = "А ещё она одна из Семи заключённых."
10048050-19 = "И что за карточка? Зачем ей заранее говорить, что она придёт?"
10048050-20 = "Она любит выделяться, Рицу. Она не обычная воровка и любит... играть с людьми. Будто это игра."
10048050-21 = "Перед каждым делом Благородная воровка обязательно оставляет визитную карточку. В ней она объявляет свою цель."
10048050-22 = "То есть это послание. Настоящая... визитная карточка. Ух ты..."
10048050-23 = "А я думала, это стихотворение или что-то вроде того!"
10048050-25 = "Понимаю, почему ты так решила. В этом есть что-то художественное."
10048050-26 = "Но Благородная воровка больше любит головоломки. Это послание — загадка."
10048050-27 = "И вот что мне интересно... Миё."
10048050-28 = "Что?"
10048050-29 = "Почему заместитель капитана Префектурного совета показала это тебе? И ещё дала копию?"
10048050-30 = "Мы... соратницы. Литературный факультет довольно маленький..."
10048050-31 = "Нет, я о том, что это улика. Разве она не должна быть строго засекречена?"
10048050-32 = "Изначально так и было, но оказалось, что..."
10048050-33 = "...Да?"
10048050-34 = "Им нужна помощь со стороны. Никто в Совете не смог разгадать загадку."
10048050-35 = "Ах..."
10048050-36 = "Она хотела, чтобы я попробовала и... позвонила ей, если разгадаю."
10048050-37 = ""
10048050-39 = ""
10048050-40 = "Ну так что, разгадала?"
10048050-41 = "Нет. Ещё нет."
10048050-42 = "Если честно, у меня сейчас и без того голова забита."
10048050-43 = "Вот как?"
10048050-44 = "Да, потому что, если вы не заметили, и МЫ, и Благородная воровка нацелились на выставку Вероники."
10048050-45 = "Префектурный совет настороже из-за Благородной воровки, а значит, и выставочный зал, и хранилище теперь охраняются усиленно."
10048050-47 = "...!"
10048050-48 = "Погоди-погоди, тогда вся работа, которую ты проделала...?"
10048050-49 = "Теперь бесполезна. Из-за такого поворота придётся вернуться к наброску и строить план заново."
10048050-50 = "И, эм... далеко я не продвинусь, пока не... расшифрую эту карточку..."
10048050-51 = "Ауауагхуаагххх..."
10048050-52 = "Эм... ну... удачи тебе... чемпион."
10048050-53 = "Миё..."
10048050-54 = "Я... буду в библиотеке. За своим обычным столом. В глубине."
10048050-55 = "Мне нужно... успокоить разум и тело."
10048050-56 = "...А заодно, может, разгадаю эту карточку... Уф."
10048050-57 = "Пока."
10048050-58 = ""
10048050-60 = ""
10048050-62 = "Информационный центр искусств Вайлдхант"
10048050-63 = "*долгий вздох*..."
10048050-64 = "Ещё раз, Миё..."
10048050-65 = "Улитки заплачут, твёрдое небо смягчится, лишь король улыбнётся..."
10048050-66 = "Когда двери закроются и радуга сольётся, в тот волшебный миг... я явлюсь."
10048050-67 = "...Что автор хотел этим сказать?"
10048050-68 = ""
10048050-70 = ""
10048050-71 = ""
10048050-72 = "(Я перерыла весь сайт выставки и не нашла ни одной картины с улитками.)"
10048050-73 = "(А картин с небом, конечно, было ПРОСТО море. Художники ОБОЖАЮТ небо. «Твёрдое небо»? Что?)"
10048050-74 = "(Королей там будет всего несколько... И на всех картинах они хмурятся. Ни намёка даже на улыбку...)"
10048050-75 = "(...Так на что же может охотиться Благородная воровка?)"
10048050-76 = "(А-а-а... Почему всё стало настолько сложным? И глупым? И почему я всегда оказываюсь в самом центре?!)"
10048050-77 = ""
10048050-81 = ""
10048050-82 = "А? Книги...? С ними всё в порядке?"
10048050-83 = "А, ой! Это я. Надо бы ремень или сумку купить, ха! Прости, что напугала."
10048050-84 = "Тебе... не за что извиняться."
10048050-85 = "Позволь мне помочь."
10048050-86 = "Большое спасибо!"
10048050-87 = ""
10048050-89 = ""
10048050-90 = ""
10048050-91 = "(«Введение в магию призыва», «Разветвлённый путь Таро», «Понимание астрального плана»... Большая ведьминская шляпа...)"
10048050-92 = "Эм... Ты ведь Эри, да? Из Общества исследования оккультизма...?"
10048050-93 = "О! Миё, это правда ты!"
10048050-94 = "Не хотела делать выводы. Ты так уткнулась головой, будто совсем замучилась."
10048050-95 = "А, понимаешь... Я переживала из-за важной контрольной..."
10048050-96 = "Тут есть одна задача, и я никак не могу её решить."
10048050-97 = "Кстати, Эри, а у тебя какая специальность...?"
10048050-98 = "Живопись! Да. Практическое и студийное искусство."
10048050-99 = "Надеюсь, историю тоже немного изучаете. Ты не знаешь каких-нибудь знаменитых... картин с улитками?"
10048050-100 = "А?! С улиткой?! Такой, со слизью?"
10048050-101 = "Хм-м... Ничего не приходит в голову..."
10048050-102 = "А картины с небом?"
10048050-103 = "С небом?"
10048050-104 = "На множестве картин есть небо. Но если именно НЕБО... хм. Ты имеешь в виду ночь, рассвет, сумерки...?"
10048050-105 = "Что-нибудь с «твёрдым небом», если вдруг что-то вспоминается."
10048050-106 = "«Твёрдое небо»...? Твёрдое в смысле суровое, будто пылающее? Или твёрдое как... хм."
10048050-107 = "...Прости. Может, это ошибка перевода. Я никогда не слышала о —"
10048050-108 = "Погоди секунду. Стоп. Подожди."
10048050-109 = "Небо. Ночь. Звёзды... ТВЁРДОСТЬ... шкала твёрдости..."
10048050-111 = "У меня есть идея!"
10048050-112 = "П-Правда? Какая?"
10048050-113 = "Как думаешь, речь может быть о лазурите?"
10048050-114 = "Лазурит — синий минерал. Он входит в состав ляпис-лазури, драгоценного камня, который полезен для интуиции, гаданий, психической защиты..."
10048050-115 = "Но самое главное — название «ляпис-лазурь» означает «камень неба»!"
10048050-116 = "Если это «камень неба»... значит, это и есть «твёрдое небо», верно?"
10048050-117 = "Драгоценный камень... камень неба... твёрдое небо..."
10048050-118 = "Интересная мысль. Я изучу ляпис-лазурь. Возможно, это ключ..."
10048050-119 = "Большое спасибо, Эри."
10048050-120 = "Нюхуху, без проблем!"
10048050-121 = "И, Эри, не могу не заметить, что ты, похоже, интересуешься драгоценными камнями."
10048050-122 = "Хм? А... не в каком-то странном смысле или вроде того."
10048050-123 = "Я знаю про ляпис-лазурь только потому, что у нас был раздел про пигменты и краски. Ну, как часть моей специальности по живописи..."
10048050-124 = "Драгоценный камень... входит в краску?!"
10048050-125 = "Не кусками же... Раньше его растирали в порошок, чтобы получить ультрамарин."
10048050-126 = "Это прекрасный синий цвет. Кажется, когда-то это была ещё и самая дорогая краска в истории."
10048050-127 = "Сейчас ультрамарин делают из синтетики, но раньше его добыча разорила немало художников! Представляешь? Вот это преданность делу!"
10048050-128 = "«...Твёрдое небо смягчится.»"
10048050-129 = "...А?"
10048050-131 = "Если растереть ляпис-лазурь, камень неба, и смешать его, чтобы получить краску... Да. Я поняла...!"
10048050-132 = "...Хм?"
10048050-133 = ""
10048050-135 = ""
10048050-136 = ""
10048050-137 = "Ой, прости, Миё! Мне надо ответить. Удачи с контрольной!"
10048050-138 = ""
10048050-140 = ""
10048050-142 = ""
10048050-143 = "«Твёрдое небо»... означало вид краски."
10048050-144 = "Тогда, может быть, «плач улиток» тоже...?"
10048050-145 = "...Стоит попробовать. Пигменты, оттенки, материалы. Поняла. Пора сосредоточиться."
10048050-146 = ""
10048050-148 = ""
10048050-151 = "Несколько часов спустя..."
10048050-153 = "Парк Вайлдханта"
10048050-154 = ""
10048050-155 = ""
10048050-158 = "*тяжело дышит* *тяжело дышит*..."
10048050-159 = "Почему тебя нет в общежитии?! *задыхается* Погодите."
10048050-160 = "*задыхается* Я везде искала..."
10048050-161 = "Мы просто работаем, президент. Ты же видела календарь команды."
10048050-162 = "Что случилось? Почему ты вся вспотела?"
10048050-163 = "А? Что такое, Миё?"
10048050-164 = "У тебя проблемы?"
10048050-165 = "...Я разгадала."
10048050-166 = "Разгадала? Хм? Что?"
10048050-168 = "...Карточку. Я поняла загадку."
