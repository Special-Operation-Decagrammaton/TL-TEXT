80000017-8 = ""
80000017-9 = "*вздох* Эта работа заняла целую вечность."
80000017-10 = "Вы просили просто обслужить сервер, но ровно в полночь письма посыпались с пугающей скоростью."
80000017-11 = "Их было столько, что я не могла отойти от сервера ни на минуту, иначе он бы перегрузился."
80000017-12 = "[s] «Прости, что тебе пришлось с этим возиться.»"
80000017-13 = ""
80000017-15 = ""
80000017-16 = "Всё нормально. Обычный вечер системного специалиста."
80000017-17 = "Хотя передышка мне действительно не помешает."
80000017-18 = "Не угостите меня чашкой кофе, Сенсей?"
80000017-19 = "Хотя даже баночный кофе подойдёт.#nМне просто нужен кофеин."
80000017-24 = "[ns] Дать Чихиро кофе из автомата."
80000017-25 = ""
80000017-30 = "Спасибо. Теперь мне гораздо лучше."
80000017-31 = "Кстати, почему сегодня вам пришло так много писем?"
80000017-32 = "И улицы вечером выглядят совсем иначе, чем утром, когда я пришла. Я что-то пропустила?"
80000017-33 = "Фестиваль ко Дню святого Валентина?"
80000017-34 = "А, точно. Он же сегодня."
80000017-35 = "Значит, в вашу почту сыпались любовные письма? Сервер так сильно обнимали, будто это DDoS-атака."
80000017-36 = "Вот вы какой популярный, Сенсей."
80000017-37 = "[s] «Прости...»"
80000017-38 = "Не нужно извиняться. Вы не виноваты."
80000017-39 = "Теперь жалею, что ничего вам не приготовила, потому что весь день работала."
80000017-40 = "Сомневаюсь, что в такой час ещё открыты магазины..."
80000017-41 = "Значит, выбора у меня немного."
80000017-42 = ""
80000017-44 = ""
80000017-48 = "Вот, Сенсей. Пожалуйста, примите."
80000017-49 = "[s] «Баночный шоколад...?»"
80000017-50 = "Считайте это моим шоколадом на День святого Валентина. Для меня будет честью, если вы его примете."
80000017-51 = "Конечно, это не совсем традиционный шоколад, но вы ведь не откажетесь...#nправда?"
80000017-52 = "Так вышло, что мне очень нравится эта марка."
80000017-53 = "Я часто беру его, когда во время ночной работы хочется сахара и кофеина."
80000017-54 = "Он всегда выручает меня, когда особенно нужен."
80000017-55 = ""
80000017-57 = ""
80000017-58 = "Наверное, поэтому он напоминает мне вас."
80000017-59 = "С Днём святого Валентина, Сенсей."
