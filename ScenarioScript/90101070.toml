[translation]
90101070-1 = "Episódio 7;Aviso de Licitação Periódica"
90101070-2 = "Porto de Kanezaki · Pescados Akita"
90101070-4 = ""
90101070-5 = "Opa, sejam muito bem-vindos!"
90101070-6 = "Ué? A mocinha não é..."
90101070-7 = ""
90101070-10 = ""
90101070-11 = "Bom dia! Agradecemos sempre pela preferência."
90101070-12 = "Sei que ainda tá meio cedo... mas o senhor já está aberto?"
90101070-13 = "Ah, com certeza! Acabei de subir as portas agora mesmo..."
90101070-14 = "Mas a mocinha das entregas por aqui... quer dizer que pintou pedido de algum lugar?"
90101070-15 = "Não, não, hoje viemos para fazer uma refeição aqui mesmo."
90101070-16 = "Hehe, e eu trouxe as minhas amigas também!"
90101070-17 = ""
90101070-19 = ""
90101070-20 = ""
90101070-21 = ""
90101070-22 = ""
90101070-23 = "Então é aqui o lugar de que a Nico tanto falava?"
90101070-24 = "Olhando por fora, parece igualzinho aos outros botecos do porto."
90101070-25 = "Os aquários não têm uma mancha sequer. E os queimadores do fogão estão brilhando. A higiene daqui é impecável."
90101070-26 = "Com esse cuidado todo, não precisamos nos preocupar com o frescor do peixe."
90101070-27 = "Opa, que maravilha ouvir isso, fico até lisonjeado!"
90101070-28 = "Pode ser que eu não tenha muitas frescuras que garotas jovens curtem no cardápio, mas preparo tudo num estalar de dedos. Podem pedir o que quiserem!"
90101070-29 = "Ah, só não vai dar pra fazer os fritos do verso do cardápio. A encomenda dos ingredientes ainda não encostou no cais."
90101070-30 = "[ns] \"Puxa vida... e eu de olho no peixe frito empanado... que pena.\""
90101070-31 = "E... quem é o senhor aí?"
90101070-32 = "Andar pelo porto logo de manhã cedo rodeado de colegiais é meio suspeito, não acha não?"
90101070-33 = "[s1] \"Sou o responsável e tutor dessas meninas—\"\n[s2] \"Sou o patrão da Nico... mais ou menos isso!\""
90101070-36 = "Ahhh, então o senhor é o dono da tal 'FOX EATS' ou sei lá o que?! Mil perdões pela desfeita!"
90101070-37 = "A entregadora de vocês tem quebrado um galho danado pra mim, sabia?"
90101070-38 = "Sempre que vê algum perrengue, ela se antecipa e propõe um plano de entrega na medida certa. A garota é boa de negócio, tem futuro!"
90101070-39 = "[s3] \"O senhor tem ótimo olho para talentos.\"\n[s4] \"Todas as minhas alunas são brilhantes.\""
90101070-42 = "Sensei, precisa estufar o peito com tanto orgulho assim...?"
90101070-43 = "Elogio direto no alvo é de desarmar qualquer um, né?"
90101070-44 = "Olha lá, as orelhinhas da Nico tão vermelhas de vergonha!"
90101070-45 = "S-Sensei! Vamos pedir logo! Escolha alguma coisa e peça, por favor!"
90101070-46 = ""
90101070-48 = ""
90101070-49 = ""
90101070-50 = "[ns5] \"C-Certo, então...\"\n[ns6] \"Pode trazer cinco 'Tigelas de Frutos do Mar do Chef'!\""
90101070-53 = "Cinco Tigelas ao Gosto do Chef, saindo no capricho! É pra já!"
90101070-54 = ""
90101070-56 = ""
90101070-61 = ""
90101070-62 = "Escuta... por que esse prato se chama 'Tigela ao Gosto do Chef'?"
90101070-63 = "Ué, porque não tem peixe fixo, ora."
90101070-64 = "Num boteco como o meu, essa tigela é feita com as aparas nobres e o que sobrou dos cortes do dia."
90101070-65 = "Ou seja, o conteúdo muda conforme a pesca fresca que chega. #nDepende do humor do cozinheiro, por isso é 'ao gosto do chef'."
90101070-66 = "Em compensação, é a opção mais barata de todas. Tem cliente que pede só pra testar a própria sorte do dia."
90101070-67 = "Ué, quer dizer que tem chance de vir uma montanha só de sashimi de carapau?"
90101070-68 = "Kurumi, você ainda não conhece a malícia do mundo comercial, né? #nQuem disse que só vem sashimi de peixe de verdade?"
90101070-69 = "Pra bater o peso mínimo da porção, tem lugar que tacha kani desfiado ou até atum enlatado no meio!"
90101070-70 = "E uma pouca-vergonha dessas ainda tem coragem de se chamar 'tigela de frutos do mar'?!"
90101070-71 = "Tigela de atum com maionese não tem gosto ruim. O único contra é o excesso de calorias."
90101070-72 = ""
90101070-74 = ""
90101070-75 = ""
90101070-76 = "Prontinho, cinco 'Tigelas ao Gosto do Chef' servidas!"
90101070-77 = "Nossa..."
90101070-78 = "Moço, tem certeza de que não tá errado?"
90101070-79 = "Não trocou com a tigela de atum especial de outro cliente, trocou...?"
90101070-80 = "Mas que bobagem é essa? Vocês são os meus primeiros clientes do dia!"
90101070-81 = "É que hoje de manhã, enquanto eu limpava o atum, minha mão acabou escorregando. #nSobrou um monte de apara nobre, só isso."
90101070-82 = "...Mas não se acostumem, hein! Não é todo dia que tem essa moleza!"
90101070-83 = ""
90101070-85 = ""
90101070-86 = ""
90101070-87 = "Hehe, parece que hoje a sorte tá do nosso lado!"
90101070-88 = "Então, bom apetite a todas!"
90101070-89 = ""
90101070-91 = ""
90101070-92 = ""
90101070-93 = ""
90101070-94 = "M-Meu Deus... que sabor é esse...?!"
90101070-95 = "[s] \"Você reconheceu o corte?!\""
90101070-96 = "Não, eu não entendo nada disso..."
90101070-97 = "Mas esse atum aqui... parece de uma parte caríssima! Tem gosto de comida de ricaço!"
90101070-98 = "Eu também não sou especialista... mas dá pra sentir que é atum de primeiríssima."
90101070-99 = "Tem uma gordura tão suculenta que parece derreter na boca..."
90101070-100 = "Não me diga que... #né o famoso 'Otoro'?! Eu nunca comi na vida, então nem sei dizer!"
90101070-101 = "O molho de shoyu temperado por cima também tá uma delícia."
90101070-102 = "Tem um perfume suave de yuzu... a acidez realça o sabor do peixe sem roubar a cena, casando perfeitamente com os acompanhamentos."
90101070-103 = "Sim. O equilíbrio dos sabores está exemplar."
90101070-104 = "Para um prato supostamente feito 'ao gosto do momento', exige um preparo muito refinado."
90101070-105 = "Hahaha, ver vocês comendo com tanto gosto faz valer o esforço do dia!"
90101070-106 = "Eu me garanto no cardápio todo. Na próxima vez, venham experimentar os outros pratos, beleza?"
90101070-107 = ""
90101070-109 = ""
90101070-110 = "...Quer dizer, isso se o meu restaurante ainda existir no mês que vem, né."
90101070-111 = ""
90101070-113 = ""
90101070-114 = "Como assim? Este lugar vai fechar?!"
90101070-115 = "Não, ainda não é nada garantido."
90101070-116 = "Mas os estabelecimentos aqui do Porto de Kanezaki têm a obrigação de renovar o contrato periodicamente através de licitação pública."
90101070-117 = "Como a localização é boa e tem muito movimento, a concorrência é selvagem. #nE o próximo leilão já tá batendo na porta, só que o movimento de fregueses caiu bastante ultimamente."
90101070-118 = "Eu já tava quase jogando a toalha e desistindo... mas ver o entusiasmo de vocês me deu uma energia nova! #nVou entrar na disputa mês que vem e lutar com tudo."
90101070-119 = "Que ótima notícia! Ficamos muito felizes em ouvir isso."
90101070-120 = ""
90101070-122 = ""
90101070-123 = "...Bom, mas a minha situação nem se compara ao aperto que a Família Carpaccio tá passando."
90101070-124 = "Vocês viram a surra feia que levaram outro dia, né? #nNa próxima licitação, com certeza vai brotar um monte de gente de olho na cota de 'serviços de segurança' do porto..."
90101070-125 = "...A próxima licitação de segurança, o senhor disse?"
90101070-126 = "...Eita nós. Falei demais."
90101070-127 = "Foi mal aí, finjam que não ouviram nada."
90101070-128 = "Se descobrirem que eu andei difamando a moral dos Carpaccio, aqueles valentões não vão deixar pedra sobre pedra neste boteco..."
90101070-129 = "Não, não se preocupe com isso..."
90101070-130 = "A concessão dos serviços de segurança que a Família Carpaccio opera também é obtida através dessa licitação pública?"
90101070-131 = "Sim. A maioria dos contratos no Porto de Kanezaki é decidida por leilão público do Conselho Estudantil Federal."
90101070-132 = "Só que, até hoje, ninguém tinha coragem de bater de frente com eles no pregão. #nTodo mundo morria de medo de levar bala ou sofrer retaliação da Família Carpaccio."
90101070-133 = "Só que, depois daquela confusão recente, todo mundo viu que eles não passam de tigres desdentados. #nVai chover concorrente querendo abocanhar o contrato agora."
90101070-134 = "Ai, ai, minha língua tá solta demais hoje! Onde já se viu eu abrir o bico desse jeito..."
90101070-135 = ""
90101070-137 = ""
90101070-138 = ""
90101070-139 = "[ns] \"...Yukino.\""
90101070-140 = "Sim, Sensei."
90101070-141 = "Se a Família Carpaccio está desesperada com a sua reputação pública perante os concorrentes..."
90101070-142 = "Eles teriam todos os motivos do mundo para espalhar o 'terror' deliberadamente."
90101070-143 = ""
90101070-145 = ""
90101070-146 = "Muito obrigada pela refeição! Estava maravilhoso!"
90101070-147 = "Ué, mas precisava engolir a comida com tanta pressa assim?!"
90101070-148 = "Surgiu uma emergência inadiável de última hora!"
90101070-149 = "A gente volta em breve, viu?!"
90101070-150 = ""
90101070-152 = ""
90101070-153 = ""
90101070-154 = ""
90101070-155 = "...Peraí."
90101070-156 = "Essas garotas... não eram capangas da Família Carpaccio disfarçadas, eram...?!"
90101070-158 = "A Seguir;O Segredo da Família Carpaccio"
