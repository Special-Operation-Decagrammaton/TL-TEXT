[translation]
90101070-1 = "Эпизод 7;Объявление о регулярных торгах"
90101070-2 = "Порт Канэсаки: Акита Сифуд"
90101070-4 = ""
90101070-5 = "Добро пожаловать в Акита Сифуд!"
90101070-6 = "А? Ты! Ты же из—"
90101070-7 = ""
90101070-10 = ""
90101070-11 = "Здравствуйте, рада снова вас видеть! Какое чудесное место."
90101070-12 = "Знаю, ещё рано, но вы уже открыты?"
90101070-13 = "Ага. Только что открылись..."
90101070-14 = "Ты за заказом на доставку?"
90101070-15 = "Сегодня нет. Я просто пришла вкусно поесть с друзьями!"
90101070-16 = "Вот, смотрите. Нас пятеро, пожалуйста."
90101070-17 = ""
90101070-19 = ""
90101070-20 = ""
90101070-21 = ""
90101070-22 = ""
90101070-23 = "Так вот это то место, о котором ты рассказывала..."
90101070-24 = "Выглядит как вполне обычный ресторан."
90101070-25 = "На аквариуме нет ни разводов, ни налёта. Плита идеально чистая. Очевидно, здесь серьёзно относятся к гигиене."
90101070-26 = "За свежесть рыбы можно не переживать."
90101070-27 = "О, это твои друзья?"
90101070-28 = "Не скажу, что я специалист по модным вещам, которые любит молодёжь, но приготовлю что пожелаете."
90101070-29 = "А, кроме темпуры на последней странице. Я ещё жду поставку."
90101070-30 = "[ns] «Жаль. Я хотела попробовать темпуру из скумбрии...»"
90101070-31 = "А... А кто этот разборчивый взрослый?"
90101070-32 = "Гулять утром по порту с группой девушек... немного подозрительно."
90101070-33 = "[s1] «Я их опекун.»\n[s2] «Можете считать меня... начальником Нико!»"
90101070-36 = "А, так это вы стоите за Fox Food или как там? Простите за грубость!"
90101070-37 = "Ваша курьерша очень мне помогла."
90101070-38 = "Она заметила, что у меня проблемы, и предложила деловое решение. Очень харизматичная девушка."
90101070-39 = "[s3] «Совершенно верно.»\n[s4] «Все мои студенты исключительно талантливы.»"
90101070-42 = "...Почему вы ведёте себя так, будто ужасно нами гордитесь?"
90101070-43 = "Будто любящий родитель хвастается ребёнком."
90101070-44 = "Смотрите, у Нико уши краснеют."
90101070-45 = "С-Сенсей. Давайте уже заказывать!"
90101070-46 = ""
90101070-48 = ""
90101070-49 = ""
90101070-50 = "[ns5] «Тогда...»\n[ns6] «Пять 'Сашими-боулов на выбор шефа', пожалуйста.»"
90101070-53 = "Пять Сашими-боулов на выбор шефа. Принято."
90101070-54 = ""
90101070-56 = ""
90101070-61 = ""
90101070-62 = "Почему он называется Сашими-боул на выбор шефа?"
90101070-63 = "Это просто! Потому что ингредиенты каждый раз разные."
90101070-64 = "Обычно такие сашими-боулы делают из кусочков, оставшихся после нарезки... или из случайной рыбы, которую больше некуда пристроить."
90101070-65 = "Поэтому содержимое меняется в зависимости от улова дня. Ты полностью доверяешь выбор шефу."
90101070-66 = "Обычно это самый дешёвый пункт меню, но некоторые заказывают его, чтобы испытать удачу или получить сюрприз!"
90101070-67 = "Погодите, то есть нам может достаться огромная миска одной скумбрии?"
90101070-68 = "Ты ещё не сталкивалась с низами общества, Куруми. Пора перестать ожидать, что сашими-боул обязательно содержит сашими."
90101070-69 = "Может попасться рис с крабовыми палочками или консервированным тунцом. Настоящий бюджетный вариант."
90101070-70 = "Это вообще можно называть сашими-боулом?!"
90101070-71 = "Боулы с тунцом и майонезом довольно вкусные. Единственный минус — очень калорийные."
90101070-72 = ""
90101070-74 = ""
90101070-75 = ""
90101070-76 = "Пять Сашими-боулов на выбор шефа, готово!"
90101070-77 = "Это..."
90101070-78 = "Эм, вы уверены, что это наше?"
90101070-79 = "Это выглядит как сашими-боул с тунцом..."
90101070-80 = "О чём вы? Конечно ваше! Вы мои первые заказы сегодня."
90101070-81 = "Просто так вышло, что у меня осталось много тунца — утром ошибся при нарезке. Упс!"
90101070-82 = "...Так бывает не каждый день, так что не привыкайте."
90101070-83 = ""
90101070-85 = ""
90101070-86 = ""
90101070-87 = "Фуфу, похоже, сегодня нам повезло."
90101070-88 = "Спасибо за еду!"
90101070-89 = ""
90101070-91 = ""
90101070-92 = ""
90101070-93 = ""
90101070-94 = "Этот вкус...!"
90101070-95 = "[s] «Что такое, Отоги?»"
90101070-96 = "Не знаю, как объяснить. Но этот тунец..."
90101070-97 = "...Это дорогая часть. Я чувствую!"
90101070-98 = "Я тоже мало разбираюсь в сашими... Но это явно очень качественный тунец."
90101070-99 = "Он маслянистый и мягкий, но при этом ровно настолько упругий, насколько нужно..."
90101070-100 = "Не может быть. Я никогда раньше не пробовала, но это... оторо? Настоящее жирное брюшко тунца?"
90101070-101 = "Соевый соус великолепно его дополняет."
90101070-102 = "Лёгкий аромат юзу и сбалансированная кислинка гармонируют с ингредиентами, не перебивая вкус рыбы."
90101070-103 = "И рис здесь исключительный."
90101070-104 = "Не могу поверить, что за такую низкую цену мы получаем что-то настолько хорошее."
90101070-105 = "Ха-ха, видеть, как вам нравится еда, — настоящая радость!"
90101070-106 = "Я отлично готовлю и другие блюда, так что в следующий раз попробуйте что-нибудь новое."
90101070-107 = ""
90101070-109 = ""
90101070-110 = "...Конечно, если к тому времени я всё ещё буду здесь..."
90101070-111 = ""
90101070-113 = ""
90101070-114 = "О нет! Вы закрываетесь?"
90101070-115 = "Нет, я не это имел в виду. Просто..."
90101070-116 = "Все предприятия в порту Канэсаки продлевают контракты через регулярные торги."
90101070-117 = "Следующая дата торгов уже близко, а поскольку порт Канэсаки удобный и туристический, конкуренция серьёзная."
90101070-118 = "Я думал отказаться от участия в торгах на следующий месяц, потому что дела долго шли плохо. Но благодаря тебе клиентов стало много, так что, пожалуй, попробую."
90101070-119 = "Рада слышать, что такое замечательное место продолжит работать."
90101070-120 = ""
90101070-122 = ""
90101070-123 = "...Ну, семье Карпаччо, наверное, сейчас ещё тяжелее, чем нам."
90101070-124 = "После того, что с ними случилось, на следующем аукционе на их сервисный контракт ТОЧНО найдётся немало желающих..."
90101070-125 = "...Следующем аукционе?"
90101070-126 = "Ой, а! Я-я не должен был..."
90101070-127 = "Прости, можешь просто забыть всё, что я сейчас сказал?"
90101070-128 = "Семья Карпаччо починит мой магазин, если узнает, что я болтаю об их делах..."
90101070-129 = "Мы ничего не скажем. Просто..."
90101070-130 = "Семья Карпаччо тоже получила контракт на охрану через торги?"
90101070-131 = "Конечно. Почти всё в порту Канэсаки проходит через процедуру торгов Генерального студенческого совета."
90101070-132 = "Никто никогда не подавал заявку против семьи Карпаччо. Они... производят впечатление довольно опасной компании, если понимаете, о чём я."
90101070-133 = "Но теперь, когда все знают, что они всего лишь беззубый тигр, наверняка несколько человек захотят побороться за их контракт."
90101070-134 = "Господи, я и правда слишком много болтаю..."
90101070-135 = ""
90101070-137 = ""
90101070-138 = ""
90101070-139 = "[ns] «...Юкино.»"
90101070-140 = "Да."
90101070-141 = "Если семья Карпаччо так заботилась о своей устрашающей репутации..."
90101070-142 = "Тогда у них вполне был мотив распространять страх, пусть даже только через слухи."
90101070-143 = ""
90101070-145 = ""
90101070-146 = "Большое спасибо за еду!"
90101070-147 = "Уже? Вы даже не доели..."
90101070-148 = "Всё было невероятно вкусно, но внезапно появилось срочное дело!"
90101070-149 = "Мы скоро вернёмся! Спасибо!"
90101070-150 = ""
90101070-152 = ""
90101070-153 = ""
90101070-154 = ""
90101070-155 = "...Погоди."
90101070-156 = "Они ведь не из семьи Карпаччо, да...?"
90101070-158 = "Следующий эпизод;Секреты семьи Карпаччо"
