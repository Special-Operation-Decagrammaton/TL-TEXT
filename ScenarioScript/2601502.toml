[translation]
2601502-1 = "Сёрфинг по-деловому"
2601502-2 = "Я шёл по пляжу и случайно увидел Ичику."
2601502-3 = ""
2601502-6 = ""
2601502-7 = ""
2601502-8 = "Сенсей?"
2601502-9 = "Что привело вас... А, вообще-то, ничего странного, что вы здесь."
2601502-10 = "Хотите знать, что я делаю? А, ха-ха, ну..."
2601502-11 = "Сегодня я закончила работу раньше обычного."
2601502-12 = "Не хотела, чтобы люди подумали, будто я просто бездельничаю, поэтому решила прогуляться."
2601502-13 = "[s1] «А, понимаю.»\n[s2] «Работа вообще может... закончиться раньше?»"
2601502-16 = "Но всё сложилось удачно — иначе я бы с вами не встретилась!"
2601502-17 = "Кстати, у вас сегодня есть какие-нибудь планы?"
2601502-18 = "Подозреваю, работа преследует вас повсюду, даже на отдыхе."
2601502-19 = ""
2601502-21 = ""
2601502-22 = "Так что надеюсь, мой вопрос не слишком очевидный."
2601502-23 = "Хм? ...Вы правда бездельничаете? И хотите, чтобы я присоединилась?"
2601502-24 = "А-ха-ха! Звучит весело. Я в деле."
2601502-27 = ""
2601502-28 = "Хм? На что вы смотрите, Сенсей?"
2601502-29 = "Хм-м, «Уроки сёрфинга для начинающих»? Вот что привлекло ваше внимание?"
2601502-30 = "Я краем уха слышала, что сегодня здесь проводят соревнования по сёрфингу."
2601502-31 = "Полагаю, они убивают двух зайцев: рекламируют и соревнования, и свои занятия."
2601502-32 = "Но я не ожидала, что вы интересуетесь сёрфингом."
2601502-33 = "Что...?"
2601502-34 = "...Думаете, мне может понравиться?"
2601502-35 = "Опять вы за своё!"
2601502-36 = "Я действительно хотела чем-нибудь занять день, но не сёрфингом же!"
2601502-37 = "Мне просто кажется, что сёрфинг — не совсем моё. Я представляю сёрфера кем-то немного... круче, понимаете?"
2601502-38 = "Я, скорее всего, просто свалюсь с доски и опозорюсь."
2601502-39 = "Думаете, падать — тоже часть веселья? Хм, так вот чего вы добивались, Сенсей!"
2601502-40 = ""
2601502-42 = ""
2601502-43 = "...Теперь я поняла вашу игру!"
2601502-44 = "Фуфу, ладно, ладно. Попробую."
2601502-45 = "Но с одним условием! Вы тоже участвуете, Сенсей."
2601502-46 = "[s] «А...? Почему я?!»"
2601502-47 = "Потому что это изначально была ваша идея! Нужно довести дело до конца!"
2601502-48 = "Ну же, взрослый, большой и сильный человек! Я записываю нас обоих!"
2601502-50 = "Так я в итоге пошёл на урок сёрфинга вместе с Ичикой..."
2601502-51 = "...и промок насквозь."
2601502-53 = ""
2601502-54 = ""
2601502-55 = ""
2601502-56 = ""
2601502-57 = "Эм-м... О? Кажется, получилось?"
2601502-58 = "Ого, отличная работа, Ичика! Я думал, ты впервые на доске!"
2601502-59 = "А? Так и есть! Я просто делала всё по вашим указаниям."
2601502-60 = "Ты говоришь так, будто это легко! Большинству людей нужно время хотя бы научиться стоять на доске, не говоря уже о том, чтобы поймать волну с первой попытки."
2601502-61 = "Ха-ха... Спасибо. Наверное, у меня просто неплохая координация."
2601502-62 = "Обычно в первый день мы занимаемся только основами, но, думаю, тебе уже можно попробовать движения посложнее!"
2601502-63 = "А-ха-ха, почему бы и нет? Надеюсь, не разочарую."
2601502-65 = "Несмотря на сомнения, Ичика с лёгкостью и изяществом осваивала всё новое."
2601502-66 = "Некоторое время спустя..."
2601502-68 = ""
2601502-69 = ""
2601502-70 = "Ну..."
2601502-71 = "...И как именно мы вообще до этого дошли?"
2601502-72 = ""
2601502-75 = "А теперь — Накамаса Ичика из Тринити! Пусть она записалась в последний момент, уверен, она покажет отличное выступление!"
2601502-76 = "У тебя получится, Ичика!"
2601502-77 = "[s3] «Вперёд, Ичика!»\n[s4] «Ты лучшая, Ичика!!!»"
2601502-80 = "Ха-ха... Даже Сенсей теперь ведёт себя как настоящий фанат."
2601502-81 = "Мы, конечно, говорили о соревновании, но я не думала, что инструктор действительно меня запишет."
2601502-82 = ""
2601502-84 = ""
2601502-85 = "Ичика! Перед началом хочешь что-нибудь сказать зрителям?"
2601502-86 = "Эм... Надеюсь, я не свалюсь с доски."
2601502-87 = "Ха-ха-ха! Да у нас тут комик!"
2601502-88 = "Вообще-то я... совершенно серьёзно..."
2601502-89 = "*вздыхает* Ну что ж, пора. Постараюсь хотя бы не опозориться."
2601502-90 = ""
2601502-92 = ""
2601502-96 = "О-о! Несмотря на скромные слова, Накамаса Ичика отлично управляется с доской!"
2601502-97 = "Пусть её стиль и не самый эффектный, базовая техника впечатляет. Это может быть её первое соревнование, но новичком её точно не назовёшь!"
2601502-98 = ""
2601502-101 = "Несмотря на отличное выступление, с базовым уровнем сёрфинга Ичика не смогла занять первое место."
2601502-104 = ""
2601502-105 = "Ты была потрясающей, Ичика! Если бы умела делать пант, наверняка могла бы вырвать победу."
2601502-106 = "Ха-ха, спасибо."
2601502-107 = "В следующем турнире ты точно победишь! Следуй за мной, и я приведу тебя к славе в мире сёрфинга!"
2601502-108 = "А... Я правда очень ценю предложение, но сейчас мои приоритеты всё-таки связаны с клубом."
2601502-109 = "Эх, вот досада. У тебя настоящий талант! Ладно, тогда хотя бы возьми мою визитку! Позвони, если передумаешь."
2601502-110 = ""
2601502-112 = ""
2601502-113 = "...Фух. Жизнь и правда полна сюрпризов."
2601502-114 = "Подумать только: ещё несколько часов назад я была уверена, что никогда не буду иметь ничего общего с сёрфингом."
2601502-115 = "[s5] «Невероятно! Ты вошла в тройку лучших!»\n[s6] «Ты была так близка к победе!»"
2601502-118 = "Ха-ха, перестаньте! Вы слишком меня нахваливаете. Я и не рассчитывала победить после всего одного дня тренировок."
2601502-119 = "И что было бы, если бы я победила? Подумайте обо всех людях, которые посвятили этому столько времени и сил."
2601502-120 = "Уже одна мысль о победе с моей стороны кажется довольно невежливой."
2601502-121 = "...Я опять слишком много думаю?"
2601502-122 = "Ха-ха. Возможно. У меня есть такая привычка."
2601502-123 = "Но я и правда думаю, что испортила бы всю атмосферу, если бы победила."
2601502-124 = ""
2601502-126 = ""
2601502-127 = "А, уже так поздно..."
2601502-128 = "Сегодня я совершенно не знала, чем заняться, а вы в итоге втянули меня в настоящее приключение. Спасибо, Сенсей!"
2601502-129 = "Хм? А что насчёт сёрфинга?"
2601502-130 = ""
2601502-132 = ""
2601502-133 = "М-м-м... Не знаю, стану ли я продолжать."
2601502-135 = "Уходя, Ичика выглядела немного озадаченной."
