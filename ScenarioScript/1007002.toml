[translation]
1007002-1 = "Первое впечатление"
1007002-2 = "Исполнительный офис Шале"
1007002-3 = "В MomoTalk она написала, что пришла вовремя..."
1007002-4 = ""
1007002-7 = "Но прошло уже десять минут после назначенного времени, а её всё нигде не было."
1007002-8 = "[ns1] «Я начинаю волноваться...»\n[ns2] «Может, позвонить ей?»"
1007002-12 = "[ns] «Погодите... Чей это телефон?»"
1007002-13 = "Прямо за дверью кабинета заиграл рингтон...!"
1007002-14 = "А-а-а-а!"
1007002-16 = ""
1007002-20 = "Услышав крик, я выбежал в коридор..."
1007002-21 = ""
1007002-23 = ""
1007002-25 = "[ns] «Мина...?»"
1007002-26 = "А... На этот раз я здорово облажалась."
1007002-27 = "Не могу поверить, что допустила такую новичковую ошибку. Простите, Сенсей."
1007002-28 = "О, и за опоздание тоже простите."
1007002-29 = "[s3] «Ничего страшного, но...»\n[s4] «Что ты делала здесь, в коридоре?»"
1007002-32 = "Хе-хе... Вы уверены, что хотите это услышать?"
1007002-33 = "На самом деле всё просто. Но при этом крайне серьёзно."
1007002-34 = "Возможно, вы и так это знаете, Сенсей, но... первое впечатление очень важно."
1007002-35 = "Именно в первую секунду знакомства складывается большая часть мнения о человеке. Это влияет на все дальнейшие отношения."
1007002-36 = "Первое впечатление — как самая первая костяшка домино в ряду. Она запускает всё, что происходит дальше."
1007002-37 = "[s] «(Вообще-то опоздание тоже не лучшее первое впечатление...)»"
1007002-38 = "Вот я и задумалась, как устроить максимально эффектное появление..."
1007002-39 = "В конце концов, мне нужно произвести на вас правильное впечатление..."
1007002-40 = "И я так сильно задумалась, что потеряла счёт времени, и вот мы здесь..."
1007002-41 = "Чёрт. Я так зациклилась на идеальном результате, что всё испортила. В следующий раз постараюсь лучше..."
1007002-42 = "Но вы должны понять, Сенсей. Такое могло случиться с кем угодно."
1007002-43 = "Я думала войти так, будто мне принадлежит это место, с леденцом во рту..."
1007002-44 = "...или прокрасться внутрь и внезапно появиться у вас за спиной, как призрак..."
1007002-45 = "Что впечатлило бы вас сильнее, Сенсей? Ну же, не держите меня в напряжении!"
1007002-46 = "[s] «Первое впечатление и так получилось достаточно сильным, спасибо. Заходи.»"
1007002-47 = "Вы слишком добры. После вас!"
1007002-49 = ""
1007002-54 = ""
1007002-56 = "[ns5] «Итак, насчёт сегодняшних обязанностей...»\n[ns6] «Чем я могу тебе помочь?»"
1007002-59 = "Не так быстро! Сначала..."
1007002-60 = "Нам нужно решить, как мы будем друг друга называть."
1007002-61 = "[s] «Простите?»"
1007002-62 = "Обращения, которыми двое называют друг друга, важнее, чем может показаться."
1007002-63 = "Они показывают, как эти двое воспринимают друг друга."
1007002-64 = "Уверена, большинство студентов вполне устраивает называть вас «Сенсей»..."
1007002-65 = "Но мне этого недостаточно."
1007002-66 = "Разве наши отношения не должны быть особенными по сравнению с вашими отношениями со всеми остальными?"
1007002-67 = "Я рассуждаю именно так."
1007002-68 = "[s] «П-правда?»"
1007002-69 = "Именно."
1007002-70 = "Мне хочется чего-то, что не будет слишком тесно связано с Генрюмоном. Чего-то, что покажет нашу связь..."
1007002-71 = ""
1007002-73 = ""
1007002-74 = "Это совсем не простая задача."
1007002-75 = "Но чем сложнее дело, тем приятнее его раскрыть."
1007002-76 = "[s] «(Если я просто буду молча сидеть, это когда-нибудь закончится...)»"
1007002-77 = "Командир?"
1007002-78 = "[s] «Мы не в армии.»"
1007002-79 = "Тогда... шеф?"
1007002-80 = "[s] «А ты не детектив.»"
1007002-81 = "Господин?"
1007002-82 = "[s] «Слишком избито.»"
1007002-83 = "Доктор?"
1007002-84 = "[s] «Кажется, у меня нет докторской степени...»"
1007002-85 = "...Товарищ?"
1007002-86 = ""
1007002-88 = "[ns] «Уже занято.»"
1007002-90 = ""
1007002-95 = "Так мы с Миной и провели очень глубокий (?) разговор."
1007002-96 = "Разумеется, до настоящих дел мы так и не добрались."
1007002-97 = "Не то чтобы дело было особенно важным..."
1007002-98 = ""
1007002-99 = "Я вымоталась..."
1007002-100 = "[s] «Я тоже...»"
1007002-101 = "И после всего этого мы возвращаемся к... «Сенсею»."
1007002-102 = "Наверное, вы ужасно разочарованы. Простите..."
1007002-103 = "[s] «Сенсей» вполне подходит. Правда."
1007002-104 = "Вы так говорите... Вы так говорите..."
1007002-106 = "Мы решили вернуться к делу Мины в другой раз."
