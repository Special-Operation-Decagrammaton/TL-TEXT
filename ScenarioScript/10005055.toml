[translation]
10005055-2 = ""
10005055-4 = "Яхахаха! Мои самые безумные мечты сбылись!"
10005055-5 = "Мало того что великих C&C схватили, так ещё и всё благодаря мне!"
10005055-6 = "Я настоящий, стопроцентный гений! Надо было сбежать с самого начала!"
10005055-7 = "[s1] «Вся банда в сборе.»\n[s2] «Теперь не хватает только Асуны?»"
10005055-8 = "Ох... Погодите. А где Асуна?"
10005055-9 = "Ох... Погодите. А где Асуна?"
10005055-10 = "Похоже, её всё ещё не поймали."
10005055-11 = "Хмф, неважно. Охрана здесь работает тщательно, да и их слишком много для одного человека."
10005055-12 = "Яхахаха! Это лишь вопрос времени, когда вся семья снова соберётся!"
10005055-13 = "Мы уплывём далеко-далеко, высадим вас на необитаемом острове..."
10005055-14 = "А потом пока-пока! Счастливо оставаться!"
10005055-15 = ""
10005055-18 = "А вот и дверь! Лучше я бы и сама не рассчитала. А я, между прочим, лучшая."
10005055-19 = "Яхаха! Было приятно вас знать, C&C, но мои часы говорят, что вам пора!"
10005055-20 = "Заходи, Асуна!"
10005055-21 = ""
10005055-23 = ""
10005055-28 = ""
10005055-29 = "О! Коюки!"
10005055-30 = "Привет-привет!"
10005055-32 = "Яхахаха! Скучала по мне, Асуна?"
10005055-33 = "И привет всем охранницам-кроликам!"
10005055-34 = ""
10005055-37 = ""
10005055-39 = "Мы тут уже место для тебя пригрели, так что заходи! Без жалоб!"
10005055-40 = "Моя дорогая ответственная старшая ведь никогда не стала бы создавать проблемы в чужой школе, правда?"
10005055-41 = ""
10005055-44 = ""
10005055-45 = "...Ты, там."
10005055-46 = "...?"
10005055-47 = "...Кто? Я?"
10005055-48 = "Что? Нет."
10005055-49 = "Не ты. Те, кто заперт в карцере."
10005055-50 = "Вы свободны."
10005055-51 = ""
10005055-53 = ""
10005055-54 = "А?"
10005055-56 = "...Что она только что сказала?"
10005055-57 = "О...?"
10005055-58 = "...Освобождены? Почему?"
10005055-60 = "Как один из наших VIP-членов, мисс Асуна обладает внесудебными полномочиями на борту этого корабля."
10005055-61 = "...Она теперь кто?"
10005055-62 = "По распоряжению мисс Асуны все её спутники должны быть немедленно освобождены."
10005055-63 = "Весь материальный ущерб, причинённый в ходе драки, не будет передан в суд при условии его возмещения."
10005055-64 = "Что ж, тогда прошу простить. Приятного дальнейшего пребывания, мисс Асуна."
10005055-65 = ""
10005055-67 = ""
10005055-68 = ""
10005055-70 = ""
10005055-71 = "Разве это не безумие?!"
10005055-72 = "Эти странные типы никак не переставали за мной гоняться, а потом я потянула розыгрыш, потому что он выглядел весело."
10005055-73 = "Не знаю почему, но после этого они просто остановились и сказали, что я могу делать что угодно! Вот я и здесь!"
10005055-74 = "Нэру! Они сказали, что мы можем делать что угодно, если заплатим за ущерб. Это ведь несложно, правда?"
10005055-75 = "[s3] «Тебе выпал S...?»\n[s4] «Забавный поворот событий.»"
10005055-79 = "Хм. Хех..."
10005055-80 = "Хе-хе... Хех... Понятно. Теперь я полностью понимаю ситуацию."
10005055-81 = "То есть пока мы платим, что бы я ни делала, какой бы хаос ни устроила..."
10005055-82 = "У Миллениума не будет никаких проблем, верно?"
10005055-83 = "...Хахаха. Мне нравится. Очень нравится."
10005055-84 = "Лучшая новость за весь день."
10005055-85 = "Эй, наша прелестная Белая Кроличка. Как быстро ты умеешь бегать?"
10005055-87 = "..."
10005055-88 = "Ну что ж, попробуй бежать так быстро, как только могут твои маленькие кроличьи ножки."
10005055-89 = "...Теперь моя очередь."
