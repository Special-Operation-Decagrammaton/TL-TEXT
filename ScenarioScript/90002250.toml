[translation]
90002250-1 = "Эпизод 25;Эпилог 1"
90002250-2 = ""
90002250-3 = "А, Сенсей!"
90002250-4 = "Сенсей! И Арис с Токи тоже. Привет!"
90002250-6 = "Здравствуйте!"
90002250-7 = "Здравствуйте. Сегодня хороший день."
90002250-9 = "Кстати, я давно вас не видела... Что-то случилось?"
90002250-10 = "Точно! Два дня назад у меня было дежурство представителя учеников, а вас там не было. Надеюсь, у вас есть хорошая причина, Сенсей!"
90002250-11 = "[s] «Прости! На следующей неделе всё наверстаю.»"
90002250-12 = "Правда? На следующей неделе? Я запомню это обещание."
90002250-13 = ""
90002250-17 = ""
90002250-18 = ""
90002250-19 = ""
90002250-20 = "А...? Вам не показалось, что сейчас что-то промчалось мимо?"
90002250-22 = "?!"
90002250-23 = "Конечно нет! Я-я-я уверена, что там ничего не было! Совершенно! Правда ведь, Токи?!"
90002250-24 = "...Да. Вы «правы.» Именно так..."
90002250-25 = ""
90002250-28 = ""
90002250-29 = "...?"
90002250-30 = "Хм...?"
90002250-31 = "[s1] «Д-да! Она права!»\n[s2] «Я ничего... не видел и не чувствовал!»"
90002250-34 = "Вот как? Хм, странно."
90002250-35 = "Сенсей, вы ведь ничего не скрываете? Вы подозрительно растеряны. И немного вспотели."
90002250-36 = "Ага, ага. Если не признаетесь сами, только сделаете всё хуже!"
90002250-38 = "Уа-а! Что нам делать, Токи?!"
90002250-39 = "При необходимости я могу развернуть восстановленный Аби-Эшух и провести «физическое» стирание памяти...!"
90002250-40 = "Н-не думаю, что нам стоит...!"
90002250-42 = "А! Мы можем проверить камеры наблюдения и воспроизвести запись. Вы ведь можете это сделать?"
90002250-43 = "Проще простого."
90002250-44 = "[s] «В-вы... правда можете?!»"
90002250-45 = "Конечно можем. В конце концов, это Миллениум. Так что там было?"
90002250-46 = ""
90002250-48 = ""
90002250-49 = "А...? Ничего интересного. Просто мы стоим."
90002250-50 = "Эх, ладно. Ску-у-у-у-чно."
90002250-51 = "[s] «Вот видите? Не стоит так быстро обвинять людей.»"
90002250-52 = "Урок усвоен, хорошо?"
90002250-53 = "Ага, Сенсей. Увидимся позже. И вы тоже, Арис и Токи! Берегите себя!"
90002250-54 = ""
90002250-56 = ""
90002250-59 = ""
90002250-60 = "Ч-чуть не попались..."
90002250-61 = "Миссия выполнена. И всё же — Рио, Кей. Полагаю, вам уже можно выходить."
90002250-62 = ""
90002250-64 = ""
90002250-66 = ""
90002250-67 = "Какое облегчение..."
90002250-68 = "...Знаешь, почему пряталась Рио, я понимаю. Но зачем к ней присоединилась я?"
90002250-70 = "Полагаю, это было упражнение на сплочение команды."
90002250-71 = "Не обязательно озвучивать каждую свою мысль, Токи."
90002250-77 = ""
90002250-78 = "..."
90002250-79 = "Что такое, Рио?"
90002250-80 = "Я просто... осознала, что наконец вернулась сюда."
90002250-81 = "Всё хорошо, Рио. Я буду храброй вместе с вами! Уверена, всё обязательно—"
90002250-82 = ""
90002250-84 = ""
90002250-86 = ""
90002250-87 = "О боже, какая приятная встреча. Здравствуйте, Сенсей и Арис. И Токи..."
90002250-88 = "Г-Гах?!"
90002250-89 = ""
90002250-91 = ""
90002250-94 = "[ns3] «Арис? Арис?! Ты же сказала, что будешь храброй!»\n[ns4] «Если ты так спрячешься за мной...!»"
90002250-97 = "Что такое, Арис? Ты ведёшь себя так, будто увидела чудовище."
90002250-98 = ""
90002250-100 = ""
90002250-101 = ""
90002250-102 = "А... Простите... Дело не в этом... Просто..."
90002250-103 = "Фуфу. И тебя рада видеть, Токи. Я получила твой отчёт. Полагаю, это крайне сокращённая версия?"
90002250-104 = ""
90002250-106 = ""
90002250-107 = "Д-да. Позже б-будет раскрыто больше информации и деталей..."
90002250-108 = "[s] «(Даже Токи... в ужасе...!)»"
90002250-109 = "Не переживайте, Арис и Токи. Вы обе неизменно выполняли образцовую работу в тяжёлых обстоятельствах."
90002250-110 = "И если простите мою невежливость, я всё же должна остановиться и представиться."
90002250-111 = ""
90002250-113 = ""
90002250-114 = "Здравствуйте, Кей-Кей? Очень рада знакомству. Я Ушио Ноа."
90002250-115 = ""
90002250-117 = ""
90002250-118 = "...Похоже, и здесь я «Кей-Кей»... Д-да, то есть. Я Тэндо Кей. Приятно познакомиться, Ноа."
90002250-119 = "Фуфу. Взаимно. Буду рада работать с тобой здесь, в Миллениуме."
90002250-120 = "А ещё..."
90002250-121 = ""
90002250-124 = ""
90002250-126 = ""
90002250-127 = "Ух...!"
90002250-128 = "..."
90002250-129 = "..."
90002250-130 = "Давно не виделись, президент Рио."
90002250-131 = "П-подожди. Я могу... разъяснить."
90002250-132 = "Всё хорошо, Рио. Тебе не нужно ничего мне объяснять."
90002250-133 = "Н-не нужно...?"
90002250-134 = "Потому что есть кое-кто другой, кто очень хочет услышать твою историю."
90002250-135 = "А? Это значит...?!"
90002250-136 = "Да."
90002250-137 = ""
90002250-139 = ""
90002250-140 = "Юука так долго ждала встречи с тобой, знаешь?"
90002250-141 = "?!"
90002250-142 = "Ну что ж, пожалуйста, пройди через эту дверь. Заходи."
90002250-143 = ""
90002250-145 = ""
90002250-147 = ""
90002250-148 = "Х-Хорошо..."
90002250-149 = "...Сенсей. Даже мне сейчас немного страшно..."
90002250-150 = "[s] «У меня сердце сейчас остановится...»"
90002250-151 = "Кстати, президент?"
90002250-152 = "Х-Хм?"
90002250-153 = "Юука иногда, как известно, выходит из себя. И даже дуется."
90002250-154 = "Несмотря на это, она моя добрая подруга и всегда готова выслушать любую разумную просьбу."
90002250-155 = "Но если Юука станет... ПО-НАСТОЯЩЕМУ злой... даже я не смогу вам помочь."
90002250-156 = "Поэтому сегодня, пожалуйста, следите за манерами."
90002250-157 = "?!"
90002250-158 = "С-Сенсей...!"
90002250-159 = "[s] «Рио.»"
90002250-161 = "[ns] «Всем... иногда приходится собираться с духом...!»"
90002250-162 = "...Хорошо."
90002250-163 = "Если это бремя, которое я должна нести..."
90002250-164 = ""
90002250-171 = ""
90002250-172 = "А, президент Рио. Пожалуйста, присаживайтесь. Я слышала, вам пришлось через многое пройти."
90002250-173 = "Или, может быть, мне наконец стоит сказать... с возвращением в Миллениум?"
90002250-174 = "Я слышала, вы в итоге спасли Кивотос, пока мы тут били баклуши."
90002250-175 = "Превосходная работа. Мы все ТАК благодарны."
90002250-176 = "Раз с этим разобрались, перейдём к следующей теме?"
90002250-177 = ""
90002250-179 = ""
90002250-180 = "Юука, дело в том... Пожалуйста, выслушай меня. Я всё могу объяснить. Так что..."
90002250-181 = "Что случилось, Президент?"
90002250-182 = "Звучит почти так, будто..."
90002250-183 = "...ты думаешь, что я собираюсь поднять щекотливую тему."
90002250-184 = "Или несколько. Растрата, заговор, несколько нарушений безопасности..."
90002250-185 = "У-Ух...!"
90002250-186 = "Ну что же."
90002250-188 = "Мы ведь не можем избегать этого вечно, верно? Лучше поговорить по душам."
90002250-189 = "Ты ведь не против?"
90002250-190 = "И-и-и...!"
90002250-196 = ""
90002250-197 = "Уа-а! Уа-а-а! Мне страшно!"
90002250-198 = "Так вот она какая... легендарная..."
90002250-200 = "Сенсей, что нам делать?"
90002250-201 = "[s] «Держитесь... Нам нужно пережить это...!»"
90002250-202 = ""
90002250-207 = ""
90002250-208 = "Хм."
90002250-209 = "Почему-то напряжение даже уменьшилось. Это почти... терапия."
90002250-213 = ""
90002250-214 = ""
90002250-215 = "Р-Рио...?"
90002250-216 = "Ты в порядке, Рио? Нет, прости... глупый вопрос!"
90002250-217 = ""
90002250-222 = ""
90002250-223 = ""
90002250-224 = ""
90002250-225 = "[ns] «А? Это была Коюки? Почему...?»"
90002250-227 = "..."
90002250-228 = "Причину установить трудно, но, вероятнее всего, она попала в неприятности."
90002250-229 = "[s] «Наверное...»"
90002250-231 = "[ns] «Но важнее другое, Рио! Ты как? Всё нормально, да...?»"
90002250-232 = ""
90002250-234 = ""
90002250-236 = "..."
90002250-237 = "Конечно."
90002250-238 = "К... конечно."
90002250-239 = "Я подготовилась, как рекомендовал Сенсей..."
90002250-240 = "Эм... Похоже, тебе досталось немного больше, чем ты готовилась выдержать?"
90002250-241 = "..."
90002250-242 = "Сенсей. Вообще-то, все."
90002250-243 = "Я кое-что поняла."
90002250-244 = "Правда... иногда может..."
90002250-245 = "...почти... убить человека... морально... Мы должны..."
90002250-246 = ""
90002250-248 = ""
90002250-250 = "[ns5] «Рио?! Рио!!»\n[ns6] «Не-е-ет...! Только не Рио...!!»"
90002250-255 = "...Кому-то это зрелище могло бы разбить сердце."
90002250-256 = "Но я не стану вас жалеть, президент. Боюсь, от этого вам стало бы только хуже."
90002250-257 = "В конце концов, ваша судьба была решена в тот момент, когда вы навлекли на себя гнев Юки. Тут уже ничем не смягчишь обстоятельства."
90002250-258 = ""
90002250-260 = ""
90002250-262 = ""
90002250-263 = "*вздох* Серьёзно..."
90002250-264 = "[s7] «П-привет. Юука...?»\n[s8] «Д-давно не виделись, да? П-правда?!»"
90002250-267 = "..."
90002250-268 = "И правда давно. Здравствуйте, Сенсей. Арис и Токи — тоже давно не виделись."
90002250-269 = "...!"
90002250-270 = "З-здравствуй, Юука."
90002250-271 = "Ага. Передай Нэру от меня привет — нет, наверное, правильнее сказать «Химари», да?"
90002250-272 = "...Да. Передам."
90002250-273 = "И ещё..."
90002250-274 = ""
90002250-276 = ""
90002250-277 = "Ты Кей, верно?"
90002250-278 = "..."
90002250-279 = "Ю-Юука! Всё хорошо! Кей совершенно нормальная, у неё никаких проблем! Она в безопасности!"
90002250-280 = "Если она неприемлема, тогда... я-я умру вместе с ней!"
90002250-281 = "[s9] «О-она права! И я возьму ответственность на себя.»\n[s10] «Арис, немного сбавь тон!»"
90002250-282 = ""
90002250-283 = ""
90002250-286 = ""
90002250-287 = "Хм? Что такое, Сенсей? И с тобой тоже, Арис."
90002250-288 = "..."
90002250-289 = "Хорошо. Нам придётся поговорить об этом подробнее в другой раз, Сенсей."
90002250-290 = "...!"
90002250-291 = "Но всё же насчёт Арис и Кей..."
90002250-292 = "Уа-а..."
90002250-293 = "Для начала прошу перестать так бояться. В целом я уже знаю ситуацию."
90002250-294 = "А...?"
90002250-295 = "...Что? А..."
90002250-296 = "Почему, Юука...?"
90002250-297 = "Это ведь то же самое, что и в твоём случае, разве нет?"
90002250-298 = "Что...? В каком смысле...?"
90002250-299 = ""
90002250-301 = ""
90002250-302 = ""
90002250-303 = "Пусть форма у Кей уже есть, но её нужно официально зачислить! Разве не так?"
90002250-305 = "...?"
90002250-307 = "...!"
90002250-308 = "Спасибо, Юука!"
90002250-309 = "Да, знаю. Молодец, Арис."
90002250-310 = ""
90002250-312 = ""
90002250-313 = "И, как я уже говорила, позже нам нужно поговорить, Сенсей."
90002250-314 = "[s] «П-Понял!»"
90002250-320 = ""
90002250-321 = "В-о-о-о-бщем! Президент Рио ВСЕГДА была такой!!"
90002250-322 = "Она никогда не думает о последствиях своих действий! О том, СКОЛЬКО СТРАДАНИЙ причиняет другим. У неё всегда «цель оправдывает средства»."
90002250-324 = "О, она думает, что может «заработать денег и вернуть долг»? Она что, Коюки?!"
90002250-325 = "Конечно, я знаю, что ВЫ не хотели никому навредить... или поощрять такое поведение."
90002250-326 = "Вы бы никогда, никогда даже не подумали причинить кому-то боль, но всё равно! ВСЁ РАВНО!"
90002250-327 = "[s11] «Юука, Юука! Давай съедим шоколадку, а?!»\n[s12] «Смотри! Без сахара!»"
90002250-328 = ""
90002250-329 = ""
90002250-331 = ""
90002250-332 = "Спасибо, Сенсей. *ням* *ням*"
90002250-333 = "Фух... Так лучше."
90002250-334 = "[s13] «(Мы разговариваем уже несколько часов...)»\n[s14] «(И всё же я рад, что ей стало легче...)»"
90002250-337 = "Итак, в случае президента Рио процесс будет включать..."
90002250-338 = "...привлечение к ответственности за материальные и нематериальные потери, вызванные её отсутствием."
90002250-339 = "Но угх... Тут есть небольшая проблема. Миллениум..."
90002250-340 = "...из-за её отсутствия не понёс никаких материальных потерь."
90002250-341 = "Если уж на то пошло, потери, пожалуй, начались только после того, как она снова стала действовать..."
90002250-342 = "[s15] «В-в таком случае!»\n[s16] «Можно попросить её уйти с поста президента...?»"
90002250-343 = ""
90002250-344 = ""
90002250-346 = ""
90002250-347 = "Зачем? Кто ещё сможет занять место Рио?"
90002250-348 = "Н-несмотря на ваш скепсис, Миллениум — академия, движимая меритократией..."
90002250-349 = "По уровню способностей Рио просто вне конкуренции."
90002250-350 = "А что до её... проступков, всё, что у меня есть, — сухо оформленный отчёт в стиле Миллениума."
90002250-351 = "В нём... нет ничего, что перечёркивало бы достижения Рио."
90002250-352 = "В конце концов, она спасла мир... Кивотос."
90002250-353 = "[s17] «Спасибо, что учитываете это...»\n[s18] «Но меня беспокоит ещё кое-что...»"
90002250-356 = "Хм? Хотите узнать, как мы вообще будем «справляться с президентом Рио»?"
90002250-357 = "..."
90002250-358 = "Вы правы, это разумный вопрос... *вздох*"
90002250-359 = "Но нам стоит попробовать вместе. В конце концов, Сенсей, разве не вы учили нас никогда не отказываться от ученика?"
90002250-360 = "И не забывайте, теперь у нас есть ВЫ, чтобы помогать держать её в рамках!"
90002250-361 = "[s] «Да. Уверен, Рио усвоила урок.»"
90002250-363 = "[ns] «...Правда?»"
90002250-364 = "Вы меня спрашиваете? Ну, вы же знаете, я ей сочувствую..."
90002250-365 = "Может, перейдём к следующему пункту? Перевод одной... «Тэндо Кей»."
90002250-366 = "Хм? Хотите узнать, «получится ли»?"
90002250-367 = "..."
90002250-368 = "В правилах нашлись некоторые... двусмысленные формулировки. Кое-что допускало разные трактовки."
90002250-369 = ""
90002250-371 = "В конце концов, Кей появилась здесь без истории, без проверок биографии... Будто девушка возникла из ниоткуда и захотела получить образование."
90002250-372 = "А когда дело касается... УГХ, ненавижу это выражение... потенциальных студентов, которые «магическим образом появляются»..."
90002250-373 = "...у Миллениума нет установленной процедуры."
90002250-376 = "[ns] «...Было бы довольно странно, если бы она была.»"
90002250-377 = "Именно. Поэтому мы решили, что лучше всего рассматривать эту ситуацию как особый случай. И передали решение высшей инстанции."
90002250-378 = "Что оказалось весьма удобно, учитывая возвращение президента Рио."
90002250-379 = "Если бы это произошло неделю назад, мы бы спорили, кто главный, кто контролирует процесс, кто входит в комитет по этике..."
90002250-380 = "...И продолжалось бы это минимум три дня и четыре ночи."
90002250-381 = "Но благодаря президенту Рио мы всё это пропустили."
90002250-382 = "[s] «Я догадываюсь... но что именно сказала Рио?»"
90002250-383 = "Хмм? А вы как думаете, Сенсей?"
90002250-384 = "Фуфу. Как вы и предполагали. Основополагающая миссия Миллениума — принимать любого ученика, желающего учиться."
90002250-385 = ""
90002250-387 = ""
90002250-388 = "Поэтому, естественно, Кей теперь переведённый студент Научной школы Миллениум!"
90002250-389 = "[s] «Уже?!»"
90002250-390 = "Мы уже проходили это с Арис."
90002250-391 = "Да, в первый раз было сложно. Но с Кей всё прошло легко."
90002250-392 = "А теперь перейдём к настоящей причине, по которой я проделала весь этот путь сюда..."
90002250-393 = "[s] «И-и что же это?»"
90002250-394 = "..."
90002250-395 = ""
90002250-397 = ""
90002250-398 = ""
90002250-399 = "ВЫ! ВООБЩЕ! ПОНИМАЕТЕ! КАК! СИЛЬНО! Я! ЗА! ВАС! ПЕРЕЖИВАЛА?!"
90002250-400 = "Знаете, через что мне пришлось пройти, чтобы узнать, где вы? А потом выясняется, что вы сражались с РОБОТАМИ в ледяной тундре?"
90002250-401 = "Я ужасно волновалась. И вы не сообщили мне никаких подробностей! Я должна была просто ПОВЕРИТЬ, что всё как-нибудь обойдётся?"
90002250-402 = "Я знаю... знаю, что момент был неподходящий. Вы спешили. Стальной континент расширялся, у вас была работа..."
90002250-403 = "Но... Но всё равно...!"
90002250-405 = "Мне было страшно, знаете ли..."
90002250-406 = "[s] «Прости, Юука.»"
90002250-407 = "Не верю..."
90002250-408 = "[s] «Больше так не буду.»"
90002250-409 = "Не обещайте того, чего не сможете выполнить. Если подобное случится снова... Вы же знаете, что снова уйдёте."
90002250-410 = "[s19] «Эм, ну. Не могу это отрицать...»\n[s20] «Но я хотя бы постараюсь... не уходить, ничего не сказав.»"
90002250-413 = "...Правда?"
90002250-414 = "[s] «Д-да!»"
90002250-415 = "...Ладно."
90002250-418 = "Вместо этого вы должны рассказать мне всё, что произошло на Стальном континенте. Каждую деталь."
90002250-419 = "Что насчёт «отчёта», спрашиваете? Это и был всего лишь отчёт, написанный в типичном стиле Миллениума."
90002250-420 = "Максимум определений убрано... никаких эмоций, только голые факты... краткие утверждения, строго основанные на причине и следствии..."
90002250-421 = "Он написан с мыслью, что слова и язык — всего лишь инструменты, а инструменты нужно использовать рационально и эффективно."
90002250-422 = "Это буквально квинтэссенция отчёта в стиле Миллениума."
90002250-423 = "[s] «Понятно. Тогда мне определённо нужно вмешаться.»"
90002250-424 = "Хи-хи. Спасибо, что понимаете."
90002250-425 = ""
90002250-428 = "[ns] «Ну что ж... С чего начать...?»"
90002250-430 = "И тогда я рассказал Юке обо всём, что произошло."
90002250-431 = "Я смеялся, удивлялся, временами сомневался и даже... в конце плакал."
90002250-444 = ""
90002250-448 = "Я рассказал ей о Стальном континенте, Декаграмматоне, Эйн, Соф и Ор."
90002250-449 = "...А также историю Кей."
90002250-452 = ""
90002250-453 = "Сенсей."
90002250-454 = "[s] «Хм?»"
90002250-455 = "Вы хотите спать?"
90002250-456 = "[s] «Немного... Нет, вообще-то я и правда немного устал.»"
90002250-457 = "Понятно."
90002250-458 = "Пожалуйста, проведите остаток сегодняшнего дня отдыхая."
90002250-459 = "И не волнуйтесь."
90002250-460 = ""
90002250-462 = ""
90002250-464 = ""
90002250-466 = "Что бы ни произошло... и чего бы это ни стоило..."
90002250-467 = "Я обязательно позабочусь, чтобы у Кей и Арис было место в Миллениуме."
90002250-468 = "Вы очень много работали. Отличная работа. И ещё..."
