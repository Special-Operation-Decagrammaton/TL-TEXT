[translation]
1601505-1 = "Сахарный спад"
1601505-2 = "Поговорив с Айри в MomoTalk, я отправился в комнату группы, где она обычно тренировалась."
1601505-6 = "...Сенсей?!"
1601505-7 = ""
1601505-10 = "Здравствуйте! Что вас сюда привело?"
1601505-11 = "На сегодня была назначена репетиция...?"
1601505-12 = "...Что?"
1601505-13 = "Почему я здесь? Н-Ну..."
1601505-14 = "Э-Эм... Эмм... Хороший вопрос! И правда, ПОЧЕМУ я здесь? Ха-ха... Ха-ха-ха!"
1601505-15 = "Никаких дел ведь нет... И я даже в полном сценическом костюме..."
1601505-16 = ""
1601505-18 = ""
1601505-19 = "В-Важнее другое! Я первая спросила, Сенсей! Что привело сюда вас?"
1601505-20 = "...П-Простите? Вы пришли ради меня? Н-Но... почему?"
1601505-21 = "И вообще, откуда вы знали, что я здесь? Кажется, я вам не говорила—"
1601505-22 = "...Что?"
1601505-23 = "Предчувствие? Какое ещё предчувствие...?"
1601505-24 = "Вы подумали... что мне будет не хватать... репетиций...?"
1601505-25 = "[s1] «Срок аренды этой комнаты почти закончился, да?»\n[s2] «Мне показалось, что ты захочешь увидеть её в последний раз.»"
1601505-28 = "Ах..."
1601505-29 = "Когда вы так говорите..."
1601505-30 = "Не думаю, что сама это осознавала... Но, похоже, вы правы."
1601505-31 = ""
1601505-33 = ""
1601505-34 = "Вы предугадали мои чувства ещё до того, как я их поняла. И поэтому пришли сюда..."
1601505-35 = "Хи-хи."
1601505-36 = "Но, эм... Думаю, вы наполовину правы, а наполовину нет."
1601505-37 = "Дело не совсем в том, что я скучаю... Скорее..."
1601505-38 = "..."
1601505-39 = "Есть это... чувство. Оно никак не даёт мне покоя."
1601505-40 = "[ns3] «Потому что группа распалась?»\n[ns4] «Потому что кажется, будто возвращаешься к обычной жизни?»"
1601505-43 = ""
1601505-44 = "...Да."
1601505-45 = "Будто вы читаете мои мысли."
1601505-46 = "Я постоянно оглядываюсь на весь этот опыт и понимаю, что всё не так просто..."
1601505-47 = "Но в конце концов я больше не могу отмахиваться от этих чувств."
1601505-48 = "Меня не отпускает ощущение, будто что-то важное ускользает из рук."
1601505-49 = "Мы стали клубом из-за любви к сладостям. Пытаться при этом ещё и продолжать группу было бы для нас слишком тяжело."
1601505-50 = "Если гнаться сразу за обоими, участницы просто выгорят... Поэтому приходится выбирать что-то одно."
1601505-51 = "И, конечно, стать полноценной группой никогда не было реально возможным вариантом."
1601505-52 = "...Да."
1601505-53 = "...В конце концов, мы Клуб сладостей после школы."
1601505-55 = "Будем жить как раньше. Встречаться после занятий, болтать о последних новостях за новым десертом..."
1601505-56 = "Мы... вернёмся к повседневной жизни, как и должно быть. К такому выводу я пришла после всех размышлений."
1601505-57 = ""
1601505-58 = "Это будет легко, но уже не так особенно..."
1601505-59 = "К-Конечно, в этом нет ничего плохого! Мне ничего не будет не хватать и я не стану это ненавидеть! Совсем нет!"
1601505-60 = "Но...!"
1601505-61 = "Если отложить это в сторону..."
1601505-62 = "Прямо сейчас у нас есть и группа, и клуб, и нам очень повезло. Но с другой стороны, это чувство, будто теряешь что-то важное..."
1601505-63 = "[s5] «Ну, если только вы не захотите продолжить группу...»\n[s6] «...ты чувствуешь это в последний раз.»"
1601505-66 = "...Да."
1601505-67 = "Пожалуй..."
1601505-68 = "[s] «...Однако.»"
1601505-69 = "Хм?"
1601505-70 = "...Однако...?"
1601505-71 = "...Что?"
1601505-72 = "...Именно поэтому я могу посмотреть на всё иначе? Что вы имеете в виду, Сенсей?"
1601505-73 = "Нам не обязательно загонять себя в рамки чего-то одного?"
1601505-74 = "[s7] «Вы решили создать группу именно потому, какие вы сами.»\n[s8] «Так что когда появится шанс попробовать что-то новое, вы сможете за него ухватиться.»"
1601505-77 = "...!"
1601505-78 = "Сенсей..."
1601505-79 = "Как вам всегда удаётся говорить такие добрые вещи с таким серьёзным лицом?"
1601505-80 = "Если только... вы не просто пытаетесь меня утешить."
1601505-81 = "..."
1601505-82 = "...Я шучу."
1601505-83 = "Хотя в любом случае это неважно."
1601505-84 = "Потому что сейчас одних ваших слов хватило, чтобы поднять мне настроение, Сенсей."
1601505-85 = "Хи-хи."
1601505-86 = "Значит, для нашей группы это и правда конец, да? Но я рада, что смогла в последний раз осмотреться здесь вместе с вами. Наверное, всё не так уж плохо."
1601505-87 = ""
1601505-89 = ""
1601505-90 = "...Сенсей."
1601505-91 = ""
1601505-93 = ""
1601505-94 = ""
1601505-95 = "Что мне попробовать дальше?"
