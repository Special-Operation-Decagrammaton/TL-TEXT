[translation]
2005403-1 = "Правила и понятия"
2005403-2 = ""
2005403-3 = ""
2005403-4 = "Хорошо поспали, Сенсей?"
2005403-5 = "[s] «Спасибо, что разбудила...»"
2005403-6 = "Не стоит благодарности. Сейчас я ваша личная утончённая, прекрасная и сверхгениальная хакерша-система жизнеобеспечения..."
2005403-7 = "Я поистине идеальный помощник по жизни. Идеальный... партнёр."
2005403-8 = "Итак, Сенсей. Думаю, нам пора заняться дневными делами."
2005403-10 = "Я вместе с Химари занимался дневными делами."
2005403-11 = ""
2005403-14 = ""
2005403-15 = "[ns] «*зевает*...»"
2005403-16 = "Тебе снова хочется спать?"
2005403-17 = "Не совсем спать... просто немного «клонит в сон», говорите? Хи-хи. Я прекрасно понимаю."
2005403-18 = "Что ж, я собираюсь провести техобслуживание своей инвалидной коляски. Не хотите составить мне компанию?"
2005403-19 = "[s] «А? Но ты же прямо сейчас ей пользуешься?»"
2005403-20 = "Нет. Не этой коляской..."
2005403-21 = "Я говорю о той, которую использую для скоростного передвижения. Она также пригодна для боя и экстренного тактического реагирования."
2005403-22 = "Знаете, о всепроходимой тактической инвалидной коляске для улицы."
2005403-23 = "[s] «Это мотоцикл...»"
2005403-24 = "Ин. Ва. Лидная. Коляска. Верно, Сенсей?"
2005403-25 = "[ns] «Д-Да...»"
2005403-28 = ""
2005403-29 = ""
2005403-30 = ""
2005403-31 = "Химари умело обслужила свой мотоцикл... ТО ЕСТЬ инвалидную коляску."
2005403-32 = "Было приятно видеть Химари довольной, но подыгрывать ей и называть это... так было странно."
2005403-35 = ""
2005403-36 = ""
2005403-37 = "Выход левитационной системы в норме. Трансмиссия, тормозная система и нагнетатель прошли диагностику. Проверяю остаточный запас вспомогательной энергии..."
2005403-38 = "Фу-фу. Сегодня моя коляска в идеальном состоянии. Как и ожидалось."
2005403-39 = "[s] «Что именно ты вообще считаешь инвалидной коляской, Химари...?»"
2005403-40 = "Ох. Подумать только, такой культурный и чуткий человек, как вы, этого не знает, Сенсей."
2005403-41 = "Что ж, выбора вы мне не оставили. Позвольте раз и навсегда дать вам чёткое определение."
2005403-42 = "Инвалидная коляска — это, разумеется, средство передвижения, позволяющее человеку перемещаться сидя."
2005403-43 = "В частности, моя — электрическая модель с приводом, подходящая как для помещения, так и для улицы."
2005403-44 = "[s] «П-Понятно...?»"
2005403-45 = "Ох. Почему-то мне кажется, что вам как раз НЕ понятно. Нужно ещё время, чтобы уложить мысли?"
2005403-46 = "Сенсей, это устройство работает от двигателя, помогает передвигаться и делает мою повседневную жизнь удобнее. Инвалидная коляска."
2005403-47 = "Эта «тактическая инвалидная коляска» для меня — всего лишь одно из множества... средств мобильности."
2005403-48 = "Уверена, даже в те времена, когда мои ноги могли выдерживать чуть большую нагрузку..."
2005403-49 = "...я всё равно придумала бы и построила такую коляску... будь у меня возможность."
2005403-50 = "Конечно, тогда нас ограничивали обычные инженерные обстоятельства."
2005403-51 = "Время и бюджет сдерживали мои возможности, но теперь ситуация иная."
2005403-52 = "Хм? Говорите, вам нравится, насколько я «амбициозна и уверена в себе» во всех смыслах?"
2005403-53 = "Фу, фу-фу... Разумеется, Сенсей. За кого вы меня принимаете?"
2005403-54 = "Снаружи я обладаю красотой орхидеи, а внутри — волей крепче чистейшего белого нефрита."
2005403-55 = "Редко падающая духом и почти никогда не терпящая поражений, великая Акебоши Химари..."
2005403-56 = "Подумайте, Сенсей. Разве не прекрасно было бы иметь ещё больше средств мобильности и доступности, рассчитанных на разные задачи и потребности?"
2005403-57 = "[ns] «Ну... да. Как отвёртки бывают разных размеров.»"
2005403-58 = ""
2005403-60 = ""
2005403-61 = ""
2005403-62 = "Фу-фу. Любопытное сравнение. Да. Именно так."
2005403-63 = "Хм? Тогда чем именно эта «тактическая инвалидная коляска» отличается от «обычных мотоциклов»?"
2005403-64 = ""
2005403-66 = ""
2005403-67 = "Полагаю, выбора у меня нет. Знайте, вообще-то я не собиралась этого предлагать."
2005403-68 = "Но раз уж представилась возможность, я хотела бы показать вам, Сенсей, на что способна моя «коляска»."
2005403-69 = "Если сравнивать мотоцикл с моей коляской, можно начать с самых базовых, фундаментальных различий."
2005403-70 = "Я хочу, чтобы разница стала для вас абсолютно очевидной, Сенсей."
2005403-71 = "[s] «(Звучит немного зловеще...)»"
2005403-72 = "Ну что, Сенсей?"
2005403-73 = "У вас есть свободная минутка?"
