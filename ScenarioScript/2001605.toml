[translation]
2001605-1 = "Хитрая фройляйн"
2001605-2 = "Как всегда, я работал в Шале над бесконечной горой задач."
2001605-3 = ""
2001605-7 = ""
2001605-8 = "Здравствуйте, Сенсей. Живы-здоровы?"
2001605-9 = "[s] «Более-менее. Рад тебя видеть, Ироха.»"
2001605-10 = "Выглядите занятым."
2001605-11 = "Эти тёмные круги под глазами — новый образ? На роль в фильме ужасов пробуетесь?"
2001605-12 = "[s] «Очень смешно, Ироха.»"
2001605-13 = "(Ответ вышел довольно вялым.)"
2001605-14 = "Я бы никогда не стала мешать человеку, который так упорно хочет работать, так что придётся просто поработать рядом с вами."
2001605-15 = "Кто знает, что я сегодня выкину, лишь бы не заниматься ничем полезным."
2001605-16 = "*нервно оглядывается*"
2001605-17 = "[s] «Прости, Ироха. Сегодня у меня нет времени на перепалки. Уф.»"
2001605-18 = ""
2001605-20 = ""
2001605-22 = ""
2001605-26 = "Сенсей? Вы в порядке?"
2001605-27 = "[s1] «Всё нормально. Кажется, я просто вымотался.»\n[s2] «В кофейнике есть кофе. Надо выпить чашку.»"
2001605-28 = "Хм... Хорошо."
2001605-29 = "Хм... Хорошо."
2001605-30 = ""
2001605-32 = ""
2001605-33 = "С этим можно работать."
2001605-34 = "Одолжите мне тот стол."
2001605-40 = "Так не годится. *взгляд*"
2001605-41 = ""
2001605-44 = "Совсем не годится. *взгляд*"
2001605-45 = ""
2001605-48 = "Ох-ох. И что же делать? *взгляд*"
2001605-49 = "[s] «Эм... Ироха? Что-то случилось?»"
2001605-50 = "А, это?"
2001605-51 = "Не переживайте. Это просто чек-лист с нашей последней инспекции."
2001605-52 = "Поскольку я командир Общества Пандемониума, мне приходится следить, чтобы всё соответствовало нормам."
2001605-53 = "По итогам последней инспекции... скажем так, я почти получила «A»."
2001605-54 = "[s] «Разве это не хорошо?»"
2001605-55 = "Нет. Максимальная оценка — «S»."
2001605-56 = "Как лучший студент Общества Пандемониума, танкист номер один и второгодка из топ-300, на которую равняются младшие, я не могу получать «A»."
2001605-57 = "[s] «Жестоко...»"
2001605-58 = "Сенсей?"
2001605-59 = "[s] «О, то есть... У тебя получится, Ироха!»"
2001605-60 = "Спасибо... наверное."
2001605-61 = "Но мне всё равно стыдно, что я не получила «S»."
2001605-62 = "Похоже, мне действительно нужно стараться больше."
2001605-63 = "Может, «S» мне не дали потому, что часть оборудования старая. А может, мне самой чего-то не хватает."
2001605-64 = "Уф. Похоже, выбора у меня и правда нет."
2001605-65 = "Сенсей. Не уделите немного времени бедствующему студенту?"
2001605-66 = "[s] «Эм. Прямо сейчас?»"
2001605-67 = "В эту самую секунду. Считайте это заказом Общества Пандемониума."
2001605-68 = "Вы правда откажетесь от шанса сделать так, чтобы студент Геенны был вам должен?"
2001605-69 = "Пожалуйста?"
2001605-70 = "[s] «Ну... если тебе действительно так нужно.»"
2001605-71 = "Хи-хи. Мне придётся очень усердно поработать над всеми своими недостатками."
2001605-72 = "Итак, первым делом — шопинг!"
2001605-74 = "Оживлённый торговый район Восточной Геенны"
2001605-76 = ""
2001605-77 = ""
2001605-78 = "Хорошо. Сразу к делу."
2001605-79 = "Это наша первая остановка."
2001605-80 = "[s] «...Магазин кукол?»"
2001605-81 = "Добро пожаловать! Чем могу помочь?"
2001605-82 = "Секунду. У меня есть список, посмотрим."
2001605-84 = "У вас есть тот плюшевый медведь Геенны? С бантом?"
2001605-85 = "[s] «А?»"
2001605-86 = "О! Это лимитированный товар, и у нас остался всего один!"
2001605-87 = "Отлично. Беру. Упаковывать не нужно. Это не подарок."
2001605-88 = "[s] «Погоди, Ироха? Ты вроде не похожа на любительницу плюшевых мишек...»"
2001605-89 = "Спасибо за покупку!"
2001605-90 = "Первый пункт — готов. Идём дальше."
2001605-91 = "[s] «Что вообще происходит?»"
2001605-93 = "Добро пожаловать! Что будете заказывать?"
2001605-94 = "У вас есть подушки с Вейвкэтом?"
2001605-95 = "О! У вас отличный вкус! Да, вот наш ассортимент!"
2001605-96 = "Хорошо. Возьму одну."
2001605-97 = ""
2001605-99 = ""
2001605-100 = ""
2001605-101 = "[s] «А...?»"
2001605-103 = "Ироха ходила из магазина в магазин, покупая всё новые странные вещи."
2001605-104 = "Декоративная рамка..."
2001605-105 = ""
2001605-106 = "Новые картофельные чипсы с васаби..."
2001605-107 = ""
2001605-108 = "У вас есть новая книга автора бестселлера «Любовь — это золотая рыбка»?"
2001605-109 = ""
2001605-110 = "Я пришла по вашей рекламе. Где у вас подушки «Идеальная плюшевость»?"
2001605-111 = "[s] «Ты вообще собираешься объяснять?!»"
2001605-113 = "Чем дольше шопинг продолжался, тем больше у меня становилось вопросов. Через полтора часа Ироха наконец закончила со списком."
2001605-115 = "Думаю, этого достаточно."
2001605-116 = "Спасибо, что сегодня сходили со мной по магазинам."
2001605-117 = "Я действительно исправила все свои недостатки."
2001605-118 = "[s] «Я окончательно запутался! Я думал, ты покупаешь оборудование для танка!»"
2001605-119 = "Вы думали, этот список был для танкового оборудования?!"
2001605-120 = "Да ни за что! Вы правда считали, что детали для танка — основы Общества Пандемониума — можно купить в обычном торговом районе?!"
2001605-121 = "У нас есть собственная ремонтная мастерская для танков на случай любых проблем."
2001605-122 = "[s] «Тогда в чём вообще был смысл сегодняшнего дня?»"
2001605-123 = "Я просто ходила по личным покупкам. Заполняла своё убежище любимыми вещами."
2001605-124 = "Убежище тоже нужно поддерживать в надлежащем состоянии. Во время недавней проверки оказалось, что наполнитель в подушках свалялся, а подушка для сна совсем износилась."
2001605-125 = "Ну и, конечно, закуски и игрушки для Ибуки, когда она приходит в гости."
2001605-126 = "[s] «Тогда зачем ты заставила меня через всё это пройти?!»"
2001605-127 = "Разве это не очевидно?"
2001605-128 = "Раньше вы были совсем никакой. Даже шутить было неинтересно."
2001605-129 = "Моя гордость такого не позволяет!"
2001605-130 = "Я не могу прогуливать работу одна, поэтому пустила в ход всё своё коварство и вытащила вас с собой."
2001605-131 = "На этот раз я вас здорово провела, да?"
2001605-132 = "Но вы, Сенсей... Разве сегодня вам тоже не было весело?"
2001605-133 = "[s] «Ироха...»"
2001605-134 = "Теперь, когда вы отдохнули, давайте возвращаться. Я вполне удовлетворена сегодняшним количеством прогула."
2001605-135 = "Когда вернёмся в Шале, я помогу вам с работой. Я знаю, каково это — быть посредником."
2001605-136 = "[s3] «Ты всё это сделала ради меня...»\n[s4] «Спасибо...»"
2001605-137 = "А? Не понимаю, о чём вы."
2001605-138 = "А? Не понимаю, о чём вы."
2001605-139 = "Хи-хи. Пойдём назад."
2001605-141 = "Вернувшись в Шале, Ироха засиделась допоздна и помогла мне закончить работу."
