[translation]
2002305-1 = "Отдых директора"
2002305-2 = "Порт Канэсаки, D.U."
2002305-3 = "Я находился в порту, помогая Бюро общественного порядка в операции по задержанию контрабандиста."
2002305-4 = ""
2002305-6 = ""
2002305-7 = "...Понятно. Хорошая работа."
2002305-8 = "Внимание всем сотрудникам. Контрабандист был обнаружен при попытке сбежать на лодке у порта 3 и задержан студентами Бюро безопасности."
2002305-9 = "Отличная работа, всем спасибо. Операция завершится через час."
2002305-10 = "Отличная работа!"
2002305-11 = "[s] «Сегодня ты отлично справилась, Канна.»"
2002305-12 = "Задание было несложным."
2002305-13 = "Хотя без свидетельских показаний, которые вы собрали у находившихся поблизости учеников Шале, всё заняло бы гораздо больше времени."
2002305-14 = "Поэтому, как представитель Бюро общественного порядка, позвольте выразить вам нашу искреннюю благодарность."
2002305-15 = "[s] «Ой, да я почти ничего и не сделал...»"
2002305-16 = ""
2002305-18 = ""
2002305-21 = ""
2002305-22 = "Директор Канна! После операции не хотите выпить с нами?"
2002305-24 = "Выпить? Где?"
2002305-25 = "Конечно же, в «Байзерии»! Ну, в семейном ресторане неподалёку."
2002305-26 = "В баре напитков у них появился новый рутбир."
2002305-27 = "Сейчас все делают из него флоат с мороженым из десерт-бара. В соцсетях только об этом и говорят."
2002305-28 = "Мы хотим собраться и отметить хорошо выполненную работу!"
2002305-29 = "...Простите. Сегодня после обеда у меня ещё очень много работы."
2002305-30 = "Идите и повеселитесь без меня. Уверена, присутствие директора только испортит настроение."
2002305-31 = "Но... каждый раз, когда мы вас куда-нибудь зовём, вы говорите, что слишком заняты."
2002305-32 = "А мы правда надеялись сегодня провести с вами время..."
2002305-33 = "Вряд ли так уж весело проводить время со своим командиром."
2002305-34 = "Уверена, есть другие ученики, которых вы предпочли бы позвать. А я просто слишком занята."
2002305-35 = "[s1] «Почему бы тебе самой немного не отдохнуть?»\n[s2] «Если у тебя и правда столько работы, я помогу.»"
2002305-38 = "Спасибо, но после работы мне ещё нужно в другое место."
2002305-39 = "К сожалению, выбраться куда-нибудь со всеми придётся в другой раз."
2002305-40 = "Прошу прощения."
2002305-42 = "В тот вечер, закончив работу, я возвращался в Шале..."
2002305-43 = ""
2002305-47 = "[ns3] «Я опять забыл поужинать...»\n[ns4] «Интересно, хоть что-нибудь ещё открыто...»"
2002305-52 = "Подходите, не стесняйтесь! Передвижная лавка «Мэнъя Сузу» открыта!"
2002305-53 = "У нас есть рамэн! И одэн!"
2002305-54 = ""
2002305-58 = "[ns] Поразившись такому идеальному совпадению, я направился к лавке."
2002305-61 = "Добро пожаловать! Добро пожаловать в «Мэнъя Сузу»!"
2002305-62 = "Что будете заказывать?"
2002305-63 = "[s] «Одну порцию рамэна, пожалуйста.»"
2002305-64 = "Хорошо. Перед вами ещё несколько заказов, так что придётся подождать всего пару минут."
2002305-65 = ""
2002305-67 = ""
2002305-69 = "А-а-а... после тяжёлого рабочего дня нет ничего лучше куриного шашлычка..."
2002305-70 = "И нигде их не готовят так, как здесь."
2002305-71 = "А чай, который к ним подают... Обожаю, как свежий вкус улуна одновременно смывает жир от шашлычка и усталость за весь день."
2002305-72 = "[s] «...Канна?»"
2002305-73 = ""
2002305-75 = ""
2002305-76 = "А?"
2002305-77 = "С-Сенсей?! Что вы здесь делаете?"
2002305-80 = "― Не ожидала встретить вас здесь...[wa:1960]"
2002305-82 = "― Я потеряла самообладание. Простите.[wa:10]"
2002305-85 = "[ns] «Я тоже не ожидал встретить тебя здесь.»"
2002305-86 = "― Вот как?[wa:800]"
2002305-88 = "― Здесь я чувствую себя спокойнее всего.[wa:2680]"
2002305-91 = "― Я не могу взять выходной от роли грозного директора Бюро общественного порядка, но...[wa:780]"
2002305-93 = "― ...мне нужно место, где хотя бы ненадолго можно ослабить бдительность.[wa:1280]"
2002305-96 = "― Поэтому сегодня...[wa:2340]"
2002305-98 = "― Пожалуйста, сделайте вид, что никогда не видели меня здесь.[wa:2860]"
2002305-101 = ""
2002305-103 = ""
2002305-106 = "[ns5] «Если тебе нужен был отдых...»\n[ns6] «Почему тогда раньше не пошла со всеми?»"
2002305-109 = "Теперь, когда вы меня увидели, лгать уже бессмысленно."
2002305-110 = "Возможно, вы уже догадались, но дело не в том, что мне не нравится куда-то ходить с другими."
2002305-111 = "Но как Бешеная Гончая Бюро общественного порядка я должна следить за своим образом."
2002305-112 = "Если преступники узнают, что страшную Бешеную Гончую видели за едой и весельем с другими учениками..."
2002305-113 = "Это может поставить под угрозу безопасность Кивотоса."
2002305-114 = "Поэтому, если есть шанс, что меня увидят обычные граждане, я не могу показывать свою более... человеческую сторону."
2002305-115 = "Но и от вас это скрывать бессмысленно."
2002305-116 = "Так что, пожалуйста, пусть это останется между нами."
2002305-117 = "[s] «Что здесь посоветуешь?»"
2002305-118 = "Что? Какая резкая смена темы."
2002305-119 = "[s7] «Это цена моего молчания.»\n[s8] «Хочу, чтобы ты посоветовала блюдо.»"
2002305-122 = "...Ха-ха. Что ж, такую цену я без проблем заплачу."
2002305-123 = "Мне нравится ассорти из шашлычков, но в такой день свежесваренный одэн — беспроигрышный вариант."
2002305-124 = "Они начинают варить бульон для одэна задолго до открытия, поэтому он отлично пропитывается вкусом говяжьих сухожилий."
2002305-125 = "[s] «Звучит хорошо. Тогда добавлю его к заказу.»"
2002305-126 = "Можно нам две порции одэна, пожалуйста?"
2002305-127 = "И фирменный улун."
2002305-128 = "Сейчас будет!"
2002305-131 = "Остаток вечера я провёл с Канной за одэном."
