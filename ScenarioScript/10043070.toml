10043070-124 = ""
10043070-127 = ""
10043070-128 = "Эй, оставьте фанатов в покое! Не делайте ничего... странного!"
10043070-129 = ""
10043070-132 = "Погоди, разве ты не четвёртый отбивающий? Почему ТЫ сюда лезешь?!"
10043070-134 = "Разве не очевидно? Без фанатов мы никто!"
10043070-135 = "Игроки ДОЛЖНЫ за них заступаться!"
10043070-137 = "Ты совсем с ума сошла?!"
10043070-138 = ""
10043070-142 = ""
10043070-143 = "Клиент в поле зрения! Запрашиваю подкрепление!"
10043070-144 = "Эм, а что именно мы вообще должны здесь делать?"
10043070-146 = "Просто... прогоните их! Но аккуратно. Игроков не ранить!"
10043070-147 = "Тренера? Ладно, но игроков — нет! Поняли?"
