[translation]
10043070-1 = "Эпизод 7;Что было обронено на стадионе"
10043070-8 = ""
10043070-9 = "И на этом нижняя половина восьмого закончена. Новых ранов нет. Бегуны остались на первой и третьей."
10043070-10 = "ОДИН маленький хит. Им нужен был ВСЕГО ОДИН!"
10043070-11 = "Почему они постоянно бьют граундеры? Они что, пытаются посадить бейсбольные деревья?!"
10043070-12 = ""
10043070-14 = ""
10043070-17 = ""
10043070-18 = "Так эта команда и играет. Мы все это знаем. *вздох*"
10043070-19 = "По крайней мере, клоузера мы сохранили до нижней половины девятого. Теперь, судя по порядку отбивающих Pillagers, сначала стоит бросить слайдер..."
10043070-21 = "Почему...? Почему мы НИКОГДА не можем победить?!"
10043070-22 = "Стартовый порядок отбивающих всегда разваливается. Стартовый питчер заканчивает в буллпене!"
10043070-23 = "Звёздные игроки никогда не оправдывают ожиданий, а решения тренера невозможно понять!"
10043070-24 = "Тренера третьей базы надо было уволить ещё сто лет назад!"
10043070-25 = "Кричалки огонь, конечно, но ВСЁ, чего они добиваются, — снова заманивают фанатов на стадион!"
10043070-26 = ""
10043070-30 = ""
10043070-31 = "Эм, если будете так шуметь, вас найдут."
10043070-32 = "То есть мы вас защитим, раз вы нам за это платите, но было бы лучше обойтись без лишнего шума."
10043070-33 = "Спасибо за напитки, кстати. Очень кстати пришлись."
10043070-35 = "Н-Ну, тут столько подработчиков было, вот и решили поделиться."
10043070-36 = "*пыхтит* *задыхается* *пыхтит* *задыхается*..."
10043070-37 = "...Всё нормально. Мы всё ещё отстаём всего на три рана. Ещё можем отыграться."
10043070-38 = ""
10043070-40 = ""
10043070-41 = "Нам нужно лишь пережить верхнюю половину девятого, а нижнюю начнём с восьмого отбивающего."
10043070-42 = "Если всё пойдёт нормально, ещё сможем передать очередь четвёртому отбивающему. Так что...!"
10043070-43 = "Так что да, мы всё-таки что-то изменили!"
10043070-44 = "(Мы и раньше много раз отставали на два-три рана, но...)"
10043070-45 = ""
10043070-50 = ""
10043070-51 = "Ч-Что за шум?! Я тут пытаюсь думать!"
10043070-52 = ""
10043070-54 = ""
10043070-55 = "Плохие новости, босс!"
10043070-56 = ""
10043070-59 = ""
10043070-60 = "Вот они. Я так и знала!"
10043070-61 = "Тренер! Сюда!"
10043070-62 = ""
10043070-66 = ""
10043070-67 = "ХА! НАШЛИ ВАС!"
10043070-68 = ""
10043070-71 = ""
10043070-72 = "Уа-а-а? Что делать?!"
10043070-73 = "П-Пошли отсюда!"
10043070-74 = ""
10043070-76 = ""
10043070-77 = "Даже не думайте!"
10043070-80 = ""
10043070-81 = ""
10043070-82 = ""
10043070-83 = ""
10043070-84 = "А? Куда это вы?"
10043070-85 = "Все сюда! Наш клиент двинулся!"
10043070-89 = ""
10043070-90 = ""
10043070-92 = "[ns] «Попались!»"
10043070-93 = ""
10043070-97 = ""
10043070-98 = "Пытаетесь затеряться в толпе, да? Плохая идея."
10043070-99 = "Мы весь матч изучали весь стадион. Теперь знаем, кто где сидит."
10043070-100 = "А теперь признавайтесь! Зачем вы это устроили?"
10043070-101 = ""
10043070-104 = ""
10043070-107 = ""
10043070-108 = "Да, зачем вы пытались испортить нам матч?"
10043070-109 = "Испортить... ваш матч?!"
10043070-110 = ""
10043070-112 = ""
10043070-114 = "ДА ЛАДНО! Вы сами постоянно его портите!"
