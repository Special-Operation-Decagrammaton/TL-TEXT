10017065-25 = "Уф!"
10017065-26 = "Акх!"
10017065-27 = "Как всегда великолепно, вице-президент Хасуми."
10017065-28 = "Для меня честь, капитан Майн."
10017065-29 = "Но от этого только трагичнее знать, на что вы тратите такой выдающийся талант."
10017065-30 = "И ради чего! Украсть рождественскую курицу у людей с добрыми намерениями?!"
10017065-32 = "!"
10017065-33 = "...Курицу?"
10017065-34 = "Вы в одиночку напали на Боевую группу Правосудия... из-за какой-то курицы?"
10017065-35 = "Какие ещё грехи вы совершили?!"
10017065-36 = "Я думала, ситуация... серьёзнее."
10017065-37 = "Какой-то тупик, не оставивший вам другого выбора, кроме нападения на Боевую группу Правосудия."
10017065-38 = "Я думала, за вашим нападением стоит великая причина, глубокий мотив, заставивший вас обострить вопрос, который вам дорог."
10017065-39 = "Я думала, некое неизбежное оправдание вынудило вас напасть на Боевую группу Правосудия на Рождество."
10017065-40 = "И всё было из-за курицы?!"
10017065-41 = "Ты вообще не понимаешь, что происходит! Та курица—"
10017065-43 = ""
10017065-45 = ""
10017065-46 = "Отлично выглядите, Боевая группа Правосудия!"
10017065-47 = "Вот что вы заслужили за издевательства над злодеями! Чёрт! То есть над слабыми!"
10017065-48 = "Получаете по заслугам!"
10017065-49 = "Ага! Ну как вам побыть по другую сторону? Теперь ваша очередь получать наказание!"
10017065-50 = "Хахахаха! Наш момент настал!"
10017065-52 = "А? По другую сторону?"
