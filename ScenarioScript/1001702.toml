[translation]
1001702-1 = "Церемония награждения"
1001702-2 = "Президентский кабинет академии Красная Зима"
1001702-3 = "Хм... Сколько ни думаю, никак не могу придумать хорошее название."
1001702-4 = "Нужно что-то более почётное и благородное... что-то подходящее мне..."
1001702-5 = ""
1001702-6 = "О, Товарищ, вы здесь! Я вас ждала!"
1001702-7 = "Я вызвала вас, потому что у меня есть важное дело, для которого нужна ваша мудрость."
1001702-8 = "Как вам известно, последние несколько месяцев я неустанно работала над развитием академии Красная Зима."
1001702-9 = "Весь день ела пудинг, чтобы контролировать качество столовой, спала, чтобы сохранить силы перед инспекцией школы, и... и..."
1001702-10 = "В общем! Я очень устала от стольких трудов. Я заслуживаю награды!"
1001702-11 = "Поэтому я размышляла, как себя наградить, и решила вручить себе самую престижную медаль Федеральной академии Красная Зима."
1001702-12 = "В отличие от сладостей вроде пудинга, медали не исчезают. Как только их вручают, они навсегда попадают в историю и изменяют академию Красная Зима..."
1001702-13 = "Это идеальная награда для меня, ведь я так долго и усердно трудилась!"
1001702-14 = "Но есть одна проблема..."
1001702-15 = "Я уже получила все медали, которые есть в академии Красная Зима, так что новых мне больше не осталось!"
1001702-16 = "Ну, раз я президент студсовета, могу просто создать новую медаль."
1001702-17 = "Но хорошее название для неё никак не придумывается..."
1001702-18 = "Товарищ, сможете придумать название, которое будет почётным, благородным, элегантным и лучше всего описывать мои достижения?"
1001702-19 = "Придумайте крутое слово, которое можно поставить перед названием медали!"
1001702-20 = "[s1] «Гипер.»\n[s2] «Ультра.»\n[s3] «Мега.»"
1001702-21 = ""
1001702-22 = "О, какое замечательное слово! С ним наверняка получится крутое название медали!"
1001702-23 = ""
1001702-24 = "О, какое замечательное слово! С ним наверняка получится крутое название медали!"
1001702-25 = ""
1001702-26 = "О, какое замечательное слово! С ним наверняка получится крутое название медали!"
1001702-27 = "Ещё одно слово, дайте ещё одно!"
1001702-28 = "Что? Если поставить «Супер» перед словом, оно звучит ещё мощнее?"
1001702-29 = "Отлично, беру и это!"
1001702-30 = "Хм, хм. И..."
1001702-33 = "Всё, я решила!"
1001702-34 = "Новая высшая награда Красная Зима будет называться... Супер-гипер-ультра-мега-медалью за доблестные усилия!"
1001702-35 = "Студенты будут в восторге уже от одного названия этой медали, не так ли? Хи-хи-хи..."
1001702-36 = "А? Думаете, раз мы придумали название вместе, вам тоже полагается награда?"
1001702-37 = "Эм... Но Супер-гипер-ультра-мега-медаль за доблестные усилия — самая почётная награда академии Красная Зима, её нельзя вручать кому попало..."
1001702-38 = "Ну ладно."
1001702-39 = "Товарищ, пусть это и не высшая награда, но я вручу вам кое-что достойное ваших усилий: Гипер-ультра-мега-медаль за доблестные усилия."
1001702-40 = "Вы должны гордиться, Товарищ!"
1001702-42 = "После этого мы с Черино ещё довольно долго придумывали дизайн медали."
