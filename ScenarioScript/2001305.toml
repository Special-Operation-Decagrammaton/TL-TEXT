[translation]
2001305-1 = "Техническое обслуживание"
2001305-2 = "Дата-центр Делового района"
2001305-4 = ""
2001305-5 = ""
2001305-7 = ""
2001305-8 = "Кабельные и LAN-соединения в порядке, мощности оборудования достаточно."
2001305-9 = "С настройками безопасности проблем нет. Осталось только сделать резервную копию базы данных после обновления до последней версии ядра."
2001305-10 = "[s] «...»"
2001305-11 = "Что такое? Представляли, как я в бешеном темпе колочу по клавиатуре перед мигающим красным монитором, как хакеры в сериалах и кино?"
2001305-12 = "Хотя, полагаю, при экстренном реагировании иногда всё действительно выглядит примерно так."
2001305-13 = "Это всего лишь плановое обслуживание. В обычных условиях всё выглядит именно так."
2001305-14 = "[s] «Но зачем работать посреди ночи?»"
2001305-15 = "Потому что на время обслуживания сервер приходится отключать. У каждого сервиса свои особенности, но обычно ночные работы позволяют свести неудобства для клиента к минимуму."
2001305-16 = "Ночью в деловом районе относительно тихо, поэтому обработка данных тоже идёт быстрее."
2001305-17 = "Хотя у ночной работы есть свои недостатки, а некоторым людям услуги требуются в любое время суток."
2001305-18 = "Но угодить всем невозможно, поэтому это просто лучший вариант."
2001305-19 = "[s] «У тебя и правда полно дел.»"
2001305-20 = "Я не против. В конце концов, это моя работа."
2001305-21 = ""
2001305-23 = ""
2001305-24 = "Обслуживание серверов не так уж отличается от других общественных служб вроде полиции или пожарных: чем меньше приходится делать, тем лучше."
2001305-25 = "Работа любого администратора сервера одинакова, каким бы компетентным он ни был: обеспечивать бесперебойную работу сервера."
2001305-26 = "Работа не самая эффектная, но кто-то должен её выполнять."
2001305-27 = ""
2001305-29 = ""
2001305-30 = ""
2001305-31 = "[ns] «*зевок*»"
2001305-32 = "Вы, наверное, устали."
2001305-33 = "Резервное копирование скоро закончится. Когда всё будет готово, можем выйти и выпить кофе."
2001305-34 = "[s] «Разве в такое время что-нибудь открыто?»"
2001305-35 = "Не волнуйтесь. Есть одно место, куда я люблю ходить во время ночных смен."
2001305-36 = "В прошлый раз я обещала угостить вас кофе, так что настаиваю."
2001305-37 = "Мы почти закончили. Потерпите ещё немного."
2001305-41 = ""
2001305-42 = "Вскоре обслуживание сервера завершилось. Затем я вышел вслед за Чихиро."
2001305-43 = ""
2001305-45 = ""
2001305-46 = ""
2001305-47 = "[ns] «Здесь правда есть открытое кафе?»"
2001305-48 = "Оно должно быть прямо за этим углом."
2001305-49 = ""
2001305-51 = ""
2001305-52 = "Вот. Идите за мной, Сенсей."
2001305-53 = ""
2001305-55 = ""
2001305-58 = "― Хи-хи. Нет ничего лучше хорошего кофе после работы.[wa:4080]"
2001305-61 = "― Хм? Вы думали, мы идём в кафе?[wa:1760]"
2001305-64 = "― Простите, что разочаровала. В такое время ничего не работает.[wa:1390]"
2001305-66 = "― Автомат — единственное место, где можно купить напиток.[wa:10]"
2001305-69 = "― Я прихожу сюда за банкой кофе[wa:1920]"
2001305-71 = "― каждый раз, когда заканчиваю ночную работу.[wa:10]"
2001305-74 = "― Этот автомат всегда здесь,[wa:1260]"
2001305-76 = "― даже когда в такую позднюю пору больше никого нет.[wa:10]"
2001305-79 = "― Просто выполняет свою работу, готовый помочь тому, кому это нужно.[wa:1560]"
2001305-82 = "― Я в каком-то смысле им восхищаюсь.[wa:10]"
2001305-84 = "― Он напоминает мне о моей собственной работе...[wa:1830]"
2001305-87 = "― Поэтому, Сенсей,[wa:480]"
2001305-89 = "― мне было бы приятно, если бы вы тоже полюбили этот кофе так же, как я.[wa:840]"
2001305-92 = "Фух. Вы только посмотрите на время."
2001305-93 = "Я так увлеклась разговором, что не заметила, как почти наступил рассвет."
2001305-94 = "Поздние поезда уже не ходят. Вернуться в общежитие «Миллениума» будет трудно."
2001305-95 = "В Шале есть где-нибудь место, где я могу переночевать?"
2001305-97 = "Я проводил Чихиро до жилого корпуса Шале и выделил ей свободную комнату для отдыха."
