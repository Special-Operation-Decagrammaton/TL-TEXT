[translation]
10038105-7 = ""
10038105-11 = "Как это возможно...?"
10038105-12 = "Фуфу. Ты всё ещё не понимаешь? Тогда объясню."
10038105-13 = ""
10038105-15 = ""
10038105-16 = "Ты распространила синдром Тайка по всему Саньхайцзину. Подумай хорошенько."
10038105-17 = "Он возвращает физический возраст тела обратно к детскому..."
10038105-18 = ""
10038105-20 = ""
10038105-21 = "Нет..."
10038105-22 = "О да. И благодаря этому моё тело сейчас здоровее, чем когда-либо."
10038105-23 = "Но когда ты...?!"
10038105-24 = "Ох, не уверена. Когда же это было?"
10038105-25 = "Кисаки, ты...!"
10038105-26 = "Фуфу. Ты угодила в собственную ловушку, Шинтани Кай."
10038105-27 = "Ну и что теперь? Если тебе всё ещё мало хаоса..."
10038105-28 = ""
10038105-30 = ""
10038105-31 = "...мы можем продолжать столько, сколько пожелаешь."
10038105-32 = ""
10038105-34 = ""
10038105-36 = ""
10038105-37 = "......"
10038105-38 = ""
10038105-40 = ""
10038105-41 = "Я проиграла. В этот раз."
10038105-42 = "Так скажи, что ты собираешься со мной делать, Кисаки?"
10038105-43 = "Саньхайцзин не смог меня удержать. В прошлый раз ты отправила меня в Исправительное бюро."
10038105-44 = "......"
10038105-45 = ""
10038105-47 = ""
10038105-48 = "Действительно, Саньхайцзину ты доставила немало проблем."
10038105-49 = "Но решение Гэнрюмона остаётся в силе."
10038105-50 = "Тебя снова переведут в Исправительное бюро. И на этот раз отправят в куда более защищённое место."
10038105-52 = "Кех-хех-кех... Если уж что в тебе неизменно, так это последовательность. Но знаешь, есть такая поговорка."
10038105-53 = ""
10038105-55 = ""
10038105-56 = "«Повторять одни и те же действия и ожидать иного результата — признак безумия.»"
10038105-58 = "Говори и делай что хочешь, Шинтани Кай..."
10038105-59 = "Но Гэнрюмон каждый раз будет стоять у тебя на пути."
10038105-60 = ""
10038105-63 = ""
10038105-64 = "О, это уже даже слегка не забавно. Позвольте спросить, Сенсей..."
10038105-65 = "[s] «А? Я?»"
10038105-66 = "Да. Вы всегда меня интересовали."
10038105-67 = "Я слышала, что вы «всегда на стороне студентов.» Это правда?"
10038105-68 = "[s] «Да, правда.»"
10038105-69 = "Это относится и ко мне?"
10038105-70 = "[s] «Всегда значит всегда.»"
10038105-71 = "Хм?"
10038105-72 = ""
10038105-75 = ""
10038105-76 = "Сэн—"
10038105-77 = "[s1] «Если ты перестанешь использовать других студентов.»\n[s2] «Пообещай не причинять им вред, и я буду на твоей стороне.»"
10038105-80 = "...Ах, значит, есть условия."
10038105-81 = "Но Сенсей, а что, если я скажу, что не сделала ничего плохого?"
10038105-82 = "[s3] «Тогда тебе нужно ещё немного „поучиться“.»\n[s4] «Если понадобится учитель, можешь обратиться ко мне.»"
10038105-86 = "[ns] «Я не откажусь ни от одного студента, если могу ей помочь.»"
10038105-87 = ""
10038105-89 = ""
10038105-90 = "Послушайте, Сенсей..."
10038105-91 = "......"
10038105-92 = "...Хорошо. Это гипотетический вопрос."
10038105-93 = "Просто из любопытства."
10038105-94 = "Если студента считают чудовищем..."
10038105-95 = "Если она совершенно безнадёжна и напрочь отказывается смотреть на себя со стороны..."
10038105-96 = "...вы всё равно скажете то же самое?"
10038105-97 = ""
10038105-100 = "[ns5] «Даже тогда я всё равно постараюсь изо всех сил.»\n[ns6] «Это единственное, что я могу сделать для любого человека.»"
10038105-103 = "Но что, если студент действительно уже не подлежит спасению, что бы вы ни делали?"
10038105-104 = "[s] «Раз уж мы говорим о вопросах, у меня есть одна просьба...»"
10038105-105 = ""
10038105-107 = ""
10038105-108 = ""
10038105-111 = "[ns] «Позволь мне верить в тебя.»"
10038105-112 = ""
10038105-114 = ""
10038105-115 = "......"
10038105-116 = "Кех, кех-хех... Хахахаха! Хорошо сыграно! Такого ответа я не ожидала."
10038105-117 = "Ладно, уводите меня. После такого ответа я вообще не стану сопротивляться."
10038105-118 = "«Позволь мне верить в тебя»... Ах, как весело. Как же весело."
10038105-119 = "Ещё кое-что, Шинтани Кай."
10038105-120 = "Говори, пока я всё ещё в хорошем настроении."
10038105-121 = "Саньхайцзину нужно лекарство от синдрома Тайка."
10038105-122 = "О, и всего-то...? Что ж, синдром Тайка заразен, но лекарство тоже можно передавать."
10038105-123 = "Лечение легко распространить. Я могу сделать это немедленно."
10038105-124 = "Кех-хех-кех... Но что тогда будет с тобой? Когда лечение распространится, ты вернёшься в прежнее состояние — со всей своей слабостью."
10038105-125 = "Неважно, что это будет значить для меня."
10038105-126 = ""
10038105-128 = ""
10038105-129 = ""
10038105-130 = "Если мы сможем вернуть Саньхайцзин в норму и безопасно провести Фестиваль лунного света..."
10038105-131 = "...что ещё нам нужно?"
10038105-132 = ""
10038105-135 = ""
10038105-136 = "...Обычный человек до мозга костей."
10038105-137 = ""
10038105-139 = ""
10038105-140 = "Хорошо, как пожелаешь. Даже если однажды ты пожалеешь об этом решении — меня это не касается."
10038105-141 = "Поверь, не пожалею."
