[translation]
1300702-1 = "Искренняя награда"
1300702-2 = "Сонным днём я решил заглянуть в кондитерскую."
1300702-5 = "Кондитерская L'Oiseau Bleu"
1300702-6 = "Добро пожаловать в L'Oiseau Bleu!"
1300702-7 = "[s] «Джунко?»"
1300702-8 = "Сенсей? А ты-то что здесь делаешь?"
1300702-9 = "Просто пришёл купить сладостей? Для спонтанной покупки это место дороговато..."
1300702-10 = "Наверное, в этом и плюс быть взрослым с кредитной линией."
1300702-11 = "Ты даже не понимаешь, как тебе повезло. Взрослые могут есть десерт когда захотят!"
1300702-12 = "В смысле я? Что я здесь делаю?"
1300702-13 = "Разве не очевидно? Подрабатываю."
1300702-14 = "Мне нужно оплачивать свои привычки. Завтрак, обед, ужин, не говоря уже о перекусах между ними..."
1300702-15 = "Почему хорошие ингредиенты должны быть такими дорогими? Как студенту вообще себя прокормить?!"
1300702-16 = "Я подрабатываю не потому, что хочу... просто такова цена эпикурейства."
1300702-17 = "[s] «Работа тяжёлая?»"
1300702-18 = "Не особо. Выпечкой занимаюсь не я."
1300702-19 = "К тому же L'Oiseau Bleu разрешает сотрудникам забирать оставшиеся сладости домой."
1300702-20 = "Так что я могу бесплатно есть сладости, которые иначе никогда не смогла бы себе позволить. Какой ещё нужен повод здесь работать?"
1300702-21 = "[s] «Что посоветуешь?»"
1300702-22 = "Посоветовать? Так..."
1300702-23 = "По-моему, всё меню хорошее, но мой личный фаворит — Монблан прямо перед тобой."
1300702-24 = "Из-за цены их продают не так много, но стоит попробовать хотя бы ради насыщенного вкуса кремовой каштановой пасты в сочетании с хрустящим безе!"
1300702-25 = "Мне однажды повезло забрать один оставшийся бесплатно... и это изменило мою жизнь!"
1300702-26 = "[s] «Один Монблан, пожалуйста.»"
1300702-27 = "Отличный выбор. Не пожалеешь!"
1300702-28 = "Что? Если я продам слишком много, к концу дня для меня ничего не останется, и я окажусь в минусе?"
1300702-29 = "Х-Хорошая мысль. Тогда надо лениться, чтобы осталось побольше..."
1300702-30 = "Нет, это неправильно! Если ничего не продам, мне не заплатят, и я не смогу покупать другую еду!"
1300702-31 = "Хм. Но я всё равно хочу остатки. Что же делать...?"
1300702-32 = "[s] Протянуть Джунко купленный Монблан."
1300702-33 = "А...? Но ты же купил его себе, Сенсей."
1300702-34 = "Ты хочешь подарить его мне за хорошую работу? С-Спасибо..."
1300702-35 = "Но я понимаю, что лениться и пользоваться чужой добротой неправильно."
1300702-36 = "Поэтому сегодня буду работать вдвое усерднее, чтобы отплатить тебе!"
1300702-38 = "После этого я купил немного хлеба на перекус и отправился обратно в Шале."
