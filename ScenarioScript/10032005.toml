[translation]
10032005-101 = "#video;10032"
10032005-1 = "Пролог"
10032005-5 = "[i]Blue Archive представляет[/i]"
10032005-10 = "[i]Событие Решалы 68[/i]"
10032005-12 = ""
10032005-17 = "Рикухатима Ару"
10032005-18 = "Ониката Каёко"
10032005-20 = ""
10032005-23 = "Асаги Муцуки"
10032005-24 = "Игуса Харука"
10032005-26 = ""
10032005-29 = ""
10032005-30 = ""
10032005-31 = ""
10032005-33 = "и..."
10032005-41 = "...Этого... достаточно...? Хотя бы... столько...?"
10032005-42 = "Я в точности выполнила ваши приказы... Они без сознания... и обезврежены..."
10032005-44 = ""
10032005-45 = "Ого, ого! Харука, ты безжалостна!"
10032005-46 = "П-Правда...? Хи... хихи! Я т-так рада, что смогла быть полезной."
10032005-47 = "Но, эм, что нам делать... с ними?"
10032005-48 = ""
10032005-50 = ""
10032005-55 = "Разве не стоит... спрятать их где-нибудь? К-Кто-нибудь может случайно наткнуться, если мы просто оставим их..."
10032005-56 = "Ах! Стой! Они могут шуметь... А-Что, если закопать их на ближайшей стройке?"
10032005-57 = "Нет... нет... Рабочие могут откопать их, и тогда...! Н-Нужно сделать всё правильно... может, сбросить их у пирса...?"
10032005-58 = ""
10032005-61 = ""
10032005-62 = ""
10032005-63 = "Хех. Хех. Ты хорошо справилась, Харука. Не беспокойся об этой мелкой рыбёшке."
10032005-64 = "Они всего лишь ступеньки на пути к нашей настоящей цели."
10032005-65 = "Мы ведь выполнили работу, да? «Разобраться с охраной цели»!"
10032005-66 = "Да. Нужно было убрать все препятствия до прибытия цели."
10032005-67 = "...Эти охранники — ничто по сравнению с главным уловом."
10032005-68 = "Именно. Добыча, достойная внимания Решал 68."
10032005-69 = "Хи-хи-хи! Посмотрите на Ару, как она радуется возвращению в поле! От неё прямо исходит новая энергия."
10032005-70 = "Н-Не в этом дело! И на работе называй меня боссом, начальник штаба Муцуки!"
10032005-71 = "И не так уж много времени прошло с нашего последнего заказа! Просто сам уровень работы... прямой запрос от людей, которые действительно понимают ценность Решал 68."
10032005-72 = "Это правда был Д-Дон Аранчино? Т-Тот суперстрашный лидер Союза банд?"
10032005-73 = "Я слышала, он настоящий плохой парень..."
10032005-74 = "Это совсем не похоже на наши обычные задания, да? Никаких погонь за кошками или слежки за случайными студентами..."
10032005-75 = "Н-Не нужно вспоминать прошлое...! Те дни позади!"
10032005-76 = "Как только мы успешно выполним эту миссию, все увидят, насколько Решалы 68 по-настоящему суровы!"
10032005-77 = ""
10032005-80 = ""
10032005-81 = "Босс?"
10032005-82 = "А? Каёко? Что такое?"
10032005-83 = "Разве я не говорила? Когда мы работаем под прикрытием, радиосвязь может нас выдать и поставить миссию под угрозу. Если это не абсолютно необходимо..."
10032005-84 = "Это как раз случай абсолютной необходимости."
10032005-85 = "Похоже, Сенсей..."
10032005-86 = "...только что прибыл в этот оперный театр."
10032005-87 = ""
10032005-89 = ""
10032005-90 = ""
10032005-91 = ""
10032005-92 = ""
10032005-93 = "Это слегка ломает наши планы."
10032005-94 = "Может, свалим? Попробуем в следующий раз."
10032005-95 = "..."
10032005-96 = "...Босс?"
10032005-97 = "...Ах."
10032005-100 = "Кто... прибыл?"