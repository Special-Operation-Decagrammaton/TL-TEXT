[translation]
1005405-1 = "Ответный долг Мари"
1005405-2 = "Закрытый парк за собором"
1005405-3 = "В свободное время я заглянул в собор Тринити."
1005405-4 = "Ворота были открыты, и я побродил по закрытому парку за собором."
1005405-5 = ""
1005405-9 = "*тяжело дышит* ... *тяжело дышит* ... *тяжело дышит*"
1005405-10 = ""
1005405-16 = "*тяжело дышит* *тяжело дышит*"
1005405-17 = "[ns1] «Этот звук... кто-то бежит?»\n[ns2] «Кто здесь занимается пробежкой?»"
1005405-20 = "О-Ой..."
1005405-21 = "Сенсей?"
1005405-22 = "[ns3] «...А?»\n[ns4] «Этот голос...»"
1005405-25 = ""
1005405-28 = ""
1005405-29 = "О, это правда вы! Я не была уверена, что вы зайдёте так далеко сюда..."
1005405-30 = "Вы пришли на службу? Боюсь, на сегодня они уже закончились."
1005405-31 = "Нет-нет, конечно же, вам всегда рады. Собор открыт для всех."
1005405-32 = "И вы очень помогли собору, да и лично мне тоже."
1005405-33 = "Хм? Почему вы так на меня смотрите?"
1005405-34 = "О, моя спортивная форма?"
1005405-35 = "Да. Сегодня работа закончилась рано, поэтому я переоделась для тренировки."
1005405-36 = "Ничего слишком тяжёлого. Немного пробежки и растяжки."
1005405-37 = "Хи-хи, но с тех пор как начала, я не пропустила ни дня."
1005405-38 = "Благодаря вам, Сенсей, я теперь совершенно спокойно чувствую себя в этой форме."
1005405-39 = "Помните... как я сначала боялась даже попробовать."
1005405-40 = "Но с вашей помощью я попробовала что-то новое и получила удовольствие. А теперь у меня появилась привычка тренироваться!"
1005405-41 = "Хаха, возможно, вам уже надоело это слышать, но я хочу сказать хотя бы ещё раз. Спасибо, Сенсей."
1005405-42 = "Если проведут ещё один спортивный праздник, я, наверное, снова запишусь."
1005405-43 = "Может, в следующий раз даже выступлю лучше!"
1005405-44 = "[s5] «Рад, что смог помочь.»\n[s6] «Это здорово. В следующий раз я тоже буду тебя поддерживать.»"
1005405-47 = "Сенсей..."
1005405-48 = "Раз вы пришли так далеко, не могли бы немного подождать?"
1005405-49 = "Я приведу себя в порядок и переоденусь. Тогда смогу провести для вас экскурсию по собору. Это меньшее, что могу сделать."
1005405-50 = "Не хотите экскурсию? Но..."
1005405-51 = "...Хм?"
1005405-52 = "Вы правда хотите, чтобы я просто продолжила тренировку? А как же вы?"
1005405-53 = "Говорите, просто посидите и посмотрите? Но... нельзя! Я-я не хочу тратить ваше время..."
1005405-54 = "О... но разве это не будет пустой тратой?"
1005405-55 = "[s7] «Мне бы не помешало немного расслабиться.»\n[s8] «Не переживай. Для меня это будет целительно!»"
1005405-58 = "Иногда я совершенно вас не понимаю..."
1005405-59 = "Но хорошо. Уверена, вы знаете, что делаете."
1005405-60 = "Т-Тогда..."
1005405-61 = "Тогда я вернусь к тренировке."
1005405-62 = ""
1005405-64 = ""
1005405-65 = ""
1005405-67 = "..."
1005405-68 = "После этого я сидел на скамейке и смотрел, как Мари бегает и растягивается."
1005405-69 = "Через некоторое время Мари закончила тренировку."
1005405-71 = ""
1005405-73 = ""
1005405-74 = "Я закончила..."
1005405-75 = "Простите, это заняло больше времени, чем я думала... Вы ведь не слишком заскучали?"
1005405-76 = "...Совсем нет?"
1005405-77 = "Вам понравилось смотреть... потому что рядом никого нет, кто мог бы вас в чём-то обвинить?"
1005405-78 = "Простите, я не понимаю. В чём вас могли бы обвинить...?"
1005405-79 = "Это была шутка? Понятно. Я не была уверена, нужно ли смеяться... Видимо, я плохо разбираюсь в таком."
1005405-80 = "В любом случае я рада, что вам удалось отдохнуть. Я не совсем понимаю почему, но счастлива, что каким-то образом смогла вам помочь."
1005405-81 = "Я и так собиралась продолжать тренироваться, но если это помогает и вам, Сенсей, мне будет ещё приятнее!"
1005405-82 = "В следующий раз принесу вам напитки и закуски, чтобы было ещё удобнее."
1005405-83 = "В конце концов, этот парк создан для того, чтобы дарить людям покой."
1005405-84 = "Приходите в любое время, когда захотите отдохнуть."
1005405-85 = "...О, только... часы работы установлены, и если парк закрыт, я ничего не смогу сделать..."
1005405-86 = "[s9] «Скажи мне, когда не захочется тренироваться одной.»\n[s10] «Всё нормально. Я не собираюсь приходить сюда, чтобы сидеть один.»"
1005405-89 = "Хм? Что вы имеете в виду...?"
1005405-90 = ""
1005405-92 = ""
1005405-93 = "Хи-хи... хи-хи-хи."
1005405-94 = "Что ж, хорошо, Сенсей. Если вы так хотите."
1005405-95 = "Я рада, что вы собираетесь прийти снова."
1005405-96 = ""
1005405-98 = ""
1005405-99 = "...Пойдёмте внутрь."
1005405-101 = "Мы вместе вошли в собор, и я подождал, пока она переоденется обратно в монашеское облачение. После этого она проводила меня в Шале."
1005405-102 = "Когда мы прощались, после тренировки она выглядела свежей и полной сил."
