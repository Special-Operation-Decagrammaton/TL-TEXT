[translation]
1901-1 = "Еженедельное собрание Префектурной команды"
1901-4 = ""
1901-5 = "Итак, пора начинать наше регулярное еженедельное собрание Префектурной команды."
1901-6 = "*вздыхает*"
1901-7 = "Ако, сегодня у меня важная встреча с Обществом Пандемониума, так что давай закончим побыстрее."
1901-8 = "Хорошо. Следующая встреча через пятнадцать минут, думаю, успеем до неё."
1901-9 = "Сначала нужно разобрать отчёт о неопознанном взрыве в зоне 97-44."
1901-10 = "Мы подтвердили, что взрыв в зоне 97-44 был вызван универсальной взрывчаткой высокой мощности, используемой при подрывных работах."
1901-11 = "Это наверняка дело рук Отдела горячих источников... Подозреваемые сейчас в бегах, за ними гонятся три отряда."
1901-12 = "Мотив?"
1901-13 = "Как всегда — разработка горячих источников."
1901-14 = "Погодите... Разве зона 97-44 не находится прямо посреди автострады? Они взорвали мощную взрывчатку, чтобы открыть там горячий источник?"
1901-15 = "Именно. Когда дело касается разработки горячих источников, чувство вины им незнакомо..."
1901-17 = "Так что я обязана спросить... зачем вы это делаете?"
1901-18 = "Неважно, где мы найдём горячий источник, главное — найти! Перекопаем всё!"
1901-19 = "Ха-ха-ха! Сожгите всё! Сожгите весь этот бесполезный мусор!"
1901-20 = "Снести всё бульдозером! Время разрушать! Разрушать! Главное — разработка!"
1901-21 = "(Я вообще не понимаю, о чём они... И что мне теперь делать?)"
1901-25 = ""
1901-26 = "Вот основная суть отчёта Чинацу. Хотя я сама этого не понимаю..."
1901-27 = "Полагаю, они собирались построить что-то вроде зоны отдыха на трассе."
1901-28 = "*вздыхает*"
1901-29 = "Ожидается, что трасса будет перегружена около трёх месяцев, а значит, пятьдесят четыре процента перевозимых товаров..."
1901-30 = "Понятно. Остальное можешь передать Обществу Пандемониума. Что дальше?"
1901-31 = "Хорошо. Следующий инцидент — взрыв в школьной столовой..."
1901-32 = "Взрыв в столовой... Общество гурманов?"
1901-33 = "Именно, президент."
1901-34 = "А мотив?"
1901-35 = "На этот раз причина была в том, что... к карааге не подали лимон..."
1901-36 = "Лимон...?!"
1901-37 = "Они взяли в заложники Фууку, президента Клуба школьных обедов, и вступили в спор с членами Префектурной команды, прибывшими их усмирить."
1901-39 = "Хорошо, позвольте задать вам один очень важный вопрос, Префектурная команда."
1901-40 = "Нужно поливать карааге лимоном или нет?!"
1901-41 = "Ну что, все? Как думаете?"
1901-42 = "Ну, по-моему... я-я думаю... лимон нужен..."
1901-43 = "Что? Тогда хрустящая корочка вся размокнет! Зачем вообще поливать её лимонным соком?!"
1901-44 = "Но освежающий аромат лимона отлично убирает ощущение жирности!"
1901-45 = "Ха-ха! Хорошо... хорошо. Похоже, это серьёзный гастрономический вопрос! Именно ради такого и существует Общество гурманов!"
1901-46 = "Так как же правильно? Ну же, давайте вместе найдём ответ!"
1901-47 = "*перешёптываются* Значит... лимон убирает жирность..."
1901-48 = "*перешёптываются* Но тогда панировка ведь..."
1901-49 = "*перешёптываются* А что насчёт соли?"
1901-50 = "*перешёптываются* Почему ты внезапно сменил тему? Я вообще-то предпочитаю соевый соус!"
1901-51 = "Хи-хи!"
1901-52 = ""
1901-54 = ""
1901-55 = "(Уф... Мне всё равно... Пожалуйста, просто вытащите меня отсюда.)"
1901-59 = ""
1901-60 = "(Жаркий спор перерос в драку. Многие члены Префектурной команды, включая Иори, оказались в больнице. После этого Общество гурманов сбежало.)"
1901-61 = "*вздыхает*"
1901-62 = "Попроси президента Клуба школьных обедов оценить ущерб и подать отчёт."
1901-63 = "Если мы потеряем ещё одну столовую, на обед останутся одни рисовые шарики!"
1901-64 = "Поняла, президент."
1901-65 = "Дальше... Арестована группа, подделывавшая справки об отсутствии и продававшая их по 2000 иен за штуку."
1901-66 = "«Решатель проблем»?"
1901-67 = "Именно. Это были Решалы 68... Они проникли в учительскую и сделали копию печати для справок об отсутствии."
1901-68 = "А затем без всякого стыда вывесили на школьной доске объявление: «Хотите прогулять занятия? Купите нашу справку и уходите когда захотите!»"
1901-69 = "Справки об отсутствии? Но в нашей академии никто не просит разрешения пропустить занятия..."
1901-71 = "Почему никто их не покупает?!"
1901-72 = "Уф! Нам конец, Ару!"
1901-73 = "*нервно ёрзает*"
1901-76 = ""
1901-77 = "*вздыхает*"
1901-81 = ""
1901-82 = "Да, именно. Поэтому они не смогли продать ни одной. Преступления здесь — незаконное проникновение и подделка официальных документов."
1901-83 = "*вздыхает*"
1901-84 = "Дальше..."
1901-85 = "Погодите... Сколько ещё пунктов в списке?"
1901-86 = "Ещё восемнадцать, президент."
1901-87 = "Что?! И всё это произошло за одну неделю?"
1901-88 = "Нет, это только за последние два дня. Разведывательный комитет сейчас в отпуске, поэтому отчёт за оставшиеся пять дней будет готов к собранию на следующей неделе."
1901-89 = "...О нет..."
1901-90 = "Угх..."
1901-91 = "Не унывайте, президент!"
1901-92 = "*вздыхает*"
1901-93 = "Еженедельное собрание Префектурной команды"
