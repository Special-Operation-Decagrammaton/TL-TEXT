901010400410-14 = "А, Нико— нет, FOX 2. С возвращением. Отличная работа сегодня."
901010400410-15 = "Фуфу. Ты тоже неплохо справилась, FOX 3."
901010400410-16 = "Мы с FOX 4 просто сидели на наблюдении. Это ты носилась по всему району и... разговаривала с людьми."
901010400410-17 = "Правда? А мне всегда куда тяжелее сидеть без дела."
901010400410-18 = "Ты же только на прошлой неделе чистила щит? Что-то случилось?"
901010400410-19 = "Ну... Сегодня был сильный ветер, наверное, потому что мы у моря."
901010400410-20 = "Когда вернулись в штаб, смотровое окно было почти белым. Да и остальной щит выглядел не лучше."
901010400410-21 = "Если нормально не смыть соль, он заржавеет. Поэтому решила почистить его до конца смены."
901010400410-22 = "Трудолюбивая ты."
901010400410-23 = "На коже у тебя наверняка тоже соль, так что потом обязательно сходи в душ. Кто знает, может, это ещё и отличный пилинг!"
901010400410-24 = "Так и сделаю. Позовите меня на разбор миссии."
