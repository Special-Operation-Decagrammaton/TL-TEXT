1003606-43 = "Хи-хи..."
1003606-44 = "Хи-хи..."
1003606-45 = "Сумка довольно большая, поэтому даже после того, как я кладу туда автоматический гранатомёт, остаётся много места."
1003606-46 = "Обычно я кладу туда книги или запасную одежду.#nОчень удобно."
1003606-47 = "Хорошо. Положу это обратно в сумку. Хмф."
1003606-48 = ""
