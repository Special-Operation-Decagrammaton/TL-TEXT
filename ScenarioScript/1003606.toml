1003606-6 = "[s1] «Привет, Хината.»\n[s2] «Ты выглядишь взволнованной.»"
1003606-7 = "А-Ахаха..."
1003606-8 = "А-Ахаха..."
1003606-9 = "Т-Так заметно? Я изо всех сил пыталась это скрыть."
