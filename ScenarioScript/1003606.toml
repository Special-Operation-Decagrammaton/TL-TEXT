1003606-22 = "Значит, вы заметили, что она похожа на мою обычную, да?"
1003606-23 = "Значит, вы заметили, что она похожа на мою обычную, да?"
1003606-24 = "О."
1003606-25 = "А-Ахаха. Наверное, вы бы заметили."
1003606-26 = "В этой сумке я ношу автоматический гранатомёт."
1003606-27 = "На самом деле она устроена вот так..."
1003606-28 = ""
1003606-30 = ""
