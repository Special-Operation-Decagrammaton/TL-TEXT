1003606-16 = "Д-Да! Именно!"
1003606-17 = "Вы всегда будто понимаете, что я пытаюсь сказать..."
1003606-18 = "В любом случае я подумала, что это хороший способ отплатить вам за всю помощь в последнее время."
1003606-19 = "Поэтому я приготовила кое-что особенное!"
1003606-20 = "Это сумка для пикника!"
