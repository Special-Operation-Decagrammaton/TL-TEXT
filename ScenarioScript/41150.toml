[translation]
41150-1 = "Episódio 15;Uma Pequena e Certa Derrota"
41150-2 = "Parque Kousagi"
41150-6 = "Não imaginava que alguém realmente iria querer aquele míssil enferrujado... Que surpresa."
41150-7 = "E-E ainda pagou tudo em dinheiro vivo..."
41150-8 = "Nunca vi tanto dinheiro assim na minha vida..."
41150-10 = "...Aquele cara era meio suspeito."
41150-11 = "Escondeu o rosto direitinho, nem verificou o estado da arma... e ainda pagou essa bolada sem nem tentar pechinchar."
41150-12 = "Será que esse dinheiro não é falso?"
41150-13 = "Ah, relaxa, quem se importa de onde veio a grana? Se dá pra comprar armas novas, tá tudo certo!"
41150-14 = "...Mas vem cá, Saki, por que a primeira coisa que você pediu foi combustível sólido e gasolina?"
41150-15 = "Com tanto dinheiro assim, você podia ter comprado uns explosivos plásticos."
41150-16 = "Por acaso você quer cozinhar arroz usando bomba? E além disso, a gente precisa disso pra fazer o helicóptero funcionar."
41150-17 = "Nem sempre mais poder de fogo significa que é melhor."
41150-18 = "O que você tá falando?! No campo de batalha, o mais importante é poder de fogo!"
41150-19 = "De qualquer forma, que bom."
41150-20 = "Com isso, conseguimos recuperar um pouco da nossa capacidade de combate."
41150-21 = "Por enquanto, acho que conseguimos repelir quem quer que apareça..."
41150-23 = "P-Por favor, me ajudem..."
41150-35 = "Foi só falar e já apareceu um invasor."
41150-36 = "Hehehe, bem na hora. Que tal testar o poder de fogo disso aqui agora mesmo?"
41150-38 = "Já se esqueceram de mim?! E aliás, eu acabei de pedir \"ajuda\", não pedi?!"
41150-39 = "...Então, o que aconteceu desta vez?"
41150-40 = "Por princípio, não intervimos em disputas privadas entre cidadãos."
41150-41 = "Pois é! Se deu problema, por que não pede ajuda praquele seu pessoal da \"FeliTorta\" ou sei lá o quê?"
41150-42 = "É \"FeliCerta\"! \"Grupo em Busca da Felicidade Certa Sem Possuir Nada\" — abreviado, \"FeliCerta\"!"
41150-43 = "Infelizmente, todos os companheiros da \"FeliCerta\" acabaram se separando..."
41150-44 = "Nosso número já estava diminuindo, e aí o pessoal do Departamento de Segurança Interna de Valkyrie invadiu o lugar...!"
41150-45 = "...Departamento de Segurança Interna?"
41150-46 = "Por que o Departamento de Segurança Interna viria arrumar briga com andarilhos como vocês?"
41150-47 = "N-Não está confundindo com o Departamento de Segurança...?"
41150-48 = "Não, tenho certeza absoluta! Eu vi claramente com meus próprios olhos!"
41150-49 = "Eu vi aquele \"Cão Feroz\" empunhando uma arma estranha e destruindo o nosso santuário!"
41150-50 = "[s1] \"Isso quer dizer...?\"\n[s2] \"Kanna...?\""
41150-55 = "...Ei, me deixa ver essa marca de tiro."
41150-61 = "Pela marca de ignição e pelo ângulo, a dureza também é bem alta..."
41150-62 = "Isso aqui é munição HEIAP."
41150-63 = "[s] \"Você consegue saber só pela marca do disparo?\""
41150-64 = "Não com cem por cento de certeza, mas isso tá no manual."
41150-65 = "...É a primeira vez que vejo munição HEIAP desse calibre."
41150-66 = "Pra começar, quase ninguém produz isso. É caro demais pra armas individuais e pouco prático."
41150-67 = "Se fosse pra chutar quem fabrica algo assim..."
41150-68 = "Talvez só a \"Kaiser Industry\"?"
41150-73 = "Então quer dizer que quem comprou um monte de armas da \"Kaiser Industry\" foi Valkyrie?"
41150-74 = "M-Mas será que a Academia de Polícia Valkyrie tem orçamento pra isso tudo...?"
41150-80 = "Parece que a situação financeira de Valkyrie inteira não anda nada boa... Até repor munição tá sendo uma luta."
41150-81 = "Desse jeito, vai até parecer que o armamento da Academia de Polícia Valkyrie é todo precário."
41150-83 = "Aconteceu alguma coisa, Sensei?"
41150-84 = "[s] \"Ah, desculpa. Só estava pensando em uma coisa.\""
41150-85 = "Ah, achei que tivesse tirando um cochilo em pé."
41150-86 = "Sonhar acordado até que é legal, né?"
41150-87 = "De qualquer forma, sinto muito pelo que aconteceu com Valkyrie."
41150-89 = "Não é hora pra \"sinto muito\"! Isso também diz respeito a vocês!"
41150-90 = "O alvo do Departamento de Segurança Interna não somos só nós. Eles estão patrulhando toda essa região e expulsando todo mundo que veem pela frente!"
41150-91 = "Não seria nenhuma surpresa se eles aparecessem aqui agora mesm—"
41150-96 = "...Argh!"
41150-106 = "...Quando um animal selvagem está em perigo, ele corre pra perto da matilha mais forte."
41150-111 = "Então estavam aqui. Me pouparam o trabalho de ficar procurando."
41150-113 = "Próximo;Propina"
