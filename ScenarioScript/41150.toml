[translation]
41150-1 = "Эпизод 15;Маленькая, но неудача"
41150-2 = "Парк Коусаги"
41150-5 = ""
41150-6 = "Я всё ещё немного в шоке. Мое действительно удалось найти того, кто согласился купить наши ржавые и бесполезные ракеты."
41150-7 = "Они даже заплатили нам наличными…"
41150-8 = "Я никогда в жизни не видела столько денег…"
41150-10 = "Неужели никто, кроме меня, не находит этого покупателя подозрительным?"
41150-11 = "Они припёрлись с полностью закрытыми рожами, притаскивают пачки денег и даже не проверяют оружие?"
41150-12 = "Что… Что если эти деньги фальшивые? Или грязные."
41150-13 = "Ой, дитя моё наивное! Деньги есть деньги. Мы можем купить новые игрушки и боеприпасы, а это главное."
41150-14 = "Кстати, Саки. Что за твёрдое топливо и бензин ты заказала? С их помощью ничего толком не взорвёшь."
41150-15 = "Из-за тебя я не смогла купить свои боеприпасы объёмного взрыва."
41150-16 = "Ты совсем дура? На чём ты собиралась готовить нам ужин и заправлять вертолёт - своими драгоценными малышками? А?"
41150-17 = "Взрывчатка - это не самое главное на поле битвы, знаешь ли!"
41150-18 = "Это ты меня дурой назвала? Ты ещё глупее! Назови хоть одну вещь, которая важнее взрывов!"
41150-19 = "Наконец-то я могу перевести дух."
41150-20 = "До нашего первоначального арсенала тут ещё далеко, но мы восстановили большую часть того, что потеряли во время потопа."
41150-21 = "По крайней мере, теперь мы сможем какое-то время удерживать наш периметр."
41150-23 = "*пха* *пха* Помогите!"
41150-24 = ""
41150-27 = ""
41150-28 = ""
41150-33 = ""
41150-35 = "Лёгок на помине. Нарушитель."
41150-36 = "Хи-хи-хи. Вперёд, мои крошки! Время делать ба-бах!"
41150-38 = "Нет, чёрт возьми! Я прошу вас о помощи!"
41150-39 = "…Чего тебя надо?"
41150-40 = "Протокол запрещает нам вмешиваться в дела гражданских."
41150-41 = "Ага, так что вали отсюда. Попроси своих жалких дружков или как ты их там называть привык."
41150-42 = "Преследователей! Сокращенно от Преследователи счастья в нестяжании!"
41150-43 = "И благодаря вам, ребятушки, большинство из них меня бросило…"
41150-44 = "Я говорил вам, что жадность - это грех! Бюро Общественного Правопорядка из Полицейской Школы Валькирия силой вышвырнуло нас и уничтожило наши драгоценности! Мои вещи!"
41150-45 = "Бюро Общественного Правопорядка?"
41150-46 = "Эти нахальные легавые не потратили бы и полцента на кучку таких бродяг, как вы."
41150-47 = "М-может, ты перепутал их с Бюро Безопасности?"
41150-48 = "Я не дебил! Я видел их, клянусь!"
41150-49 = "Эта психопатка устроила настоящий погром в нашем святилище, размахивая каким-то невероятным оружием, которого я в жизни не видел!"
41150-50 = "[s1] «Бюро Общественного Правопорядка...»\n[s2] «Неужели это была Канна?..»"
41150-51 = ""
41150-52 = ""
41150-54 = ""
41150-55 = "Покажи-ка следы от пуль на своих перчатках."
41150-56 = ""
41150-58 = ""
41150-59 = ""
41150-60 = ""
41150-61 = "Подпалины от термита и следы прямых попаданий сердечников высокой плотности…"
41150-62 = "Это не обычные пули. Похоже на осколочно-фугасные зажигательные бронебойно-пробивные боеприпасы, также известные как HEIAP."
41150-63 = "[s] «Ты смогла определить это только по следам от пуль?»"
41150-64 = "Не всегда получается. Но я изучала их по учебникам."
41150-65 = "Хотя я впервые своими глазами вижу боеприпасы типа HEIAP такого калибра."
41150-66 = "Я тоже. Они слишком дорогие и непрактичные для использования в стрелковом оружии, поэтому их обычно не производят. Ну, полагаю, до настоящего момента."
41150-67 = "Единственная компания, способная на их массовое производство, - это…"
41150-68 = "Кайзер Индастриз."
41150-69 = ""
41150-72 = ""
41150-73 = "Значит, эти неблагодарные, выкупившие всё моё оружие у Кайзер, - это Полицейская Школа Валькирия?"
41150-74 = "Н-но такое вооружение должно быть с-супер дорогим…"
41150-75 = ""
41150-80 = "А учитывая, что в наши дни бюджета едва хватает на патроны, мне не стоит быть эгоисткой."
41150-81 = "Такими темпами мне придётся сражаться с горохомётом против огнемёта! Или чем-то похуже!"
41150-83 = "Вы в порядке, Сенсей?"
41150-84 = "[s] «Ага… Просто задумался.»"
41150-85 = "Вы что, заснули стоя?"
41150-86 = "Хи-хи. Похоже, у Сенсея есть хоть один талант!"
41150-87 = "Как бы то ни было, похоже, ты просто попал под перекрёстный огонь во время полицейской операции. В следующий раз повезёт больше."
41150-89 = "И это всё?! Вы думаете, вас это вообще не касается?"
41150-90 = "Досталось не только нам! Бюро Общественного Правопорядка проводило рейды по всему городу, вышвыривая каждого бродягу и бездомного, которого только находили."
41150-91 = "Они могут наведаться сюда в любую минуту!"
41150-92 = ""
41150-94 = ""
41150-96 = "А-а-а!"
41150-97 = ""
41150-100 = ""
41150-101 = ""
41150-105 = ""
41150-106 = "А вы знали? Когда дикие животные оказываются в опасности, они бегут к самому сильному вожаку в округе."
41150-107 = ""
41150-110 = ""
41150-111 = "Полагаю, этот бродяга избавил меня от необходимости самой выискивать мусор."
41150-113 = "Следующий эпизод;Откат"
