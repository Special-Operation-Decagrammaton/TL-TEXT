[translation]
90100050-1 = "Эпизод 5;Местонахождение туза"
90100050-2 = ""
90100050-3 = "Журнал. 10:30 по стандартному времени Кивотоса. Погода... солнечная."
90100050-4 = "Отряд FOX немедленно приступает к сбору сведений в рамках «Операции: Погоня за Преданиями»."
90100050-5 = "Запрашиваю отчёты о состоянии от каждого члена отряда. Докладывайте."
90100050-6 = ""
90100050-8 = ""
90100050-9 = "FOX 4 на связи. Наблюдаю за перемещением цели. Цель покинула точку «Оскар»."
90100050-10 = "Цель не проявляла необычной активности. Район выглядит спокойным и пустым. Однако..."
90100050-11 = "В точке «Оскар» есть одна ма-а-аленькая проблемка."
90100050-12 = "«Ма-а-аленькая» проблемка?"
90100050-13 = "Так жа-а-арко... Я даже не двигаюсь, а уже горю."
90100050-14 = "Кажется, я сейчас растаю. Я вся накрыта маскировочной сеткой, а от палящего солнца она вообще не спасает... Разве до лета не ещё несколько месяцев?"
90100050-15 = "Похоже, в этом году жара пришла раньше обычного."
90100050-16 = "В следующий раз постараюсь найти для тебя укрытие получше. А пока постарайся потерпеть ещё несколько—"
90100050-17 = ""
90100050-19 = ""
90100050-20 = "Хватит ныть, FOX 4. Я видела тебя и в куда худшей погоде."
90100050-21 = "Может, ты размякла после того, как тебя нянчили в Исправительном бюро?"
90100050-22 = "Хватит брюзжать в эфире, FOX 3. Сколько ни тренируйся, если жарко — значит жарко. Смирись."
90100050-23 = "Я бы не так потела, если бы могла отделаться одной майкой вместо нормального бюстгальтера, как НЕКОТОРЫЕ..."
90100050-24 = "На мне всё что нужно!"
90100050-25 = ""
90100050-27 = ""
90100050-28 = "...FOX 3, доклад."
90100050-29 = "Г-Говорит FOX 3. Я-я как раз говорила, что вообще-то ношу нормальный—"
90100050-30 = "FOX 3, не реагируй. FOX 4 просто пошутила. Незачем отвлекаться."
90100050-31 = "П-Поняла. Ух..."
90100050-32 = ""
90100050-34 = ""
90100050-35 = "Говорит FOX 3. Сейчас я работаю с оборудованием для сбора IMSI в точке «Папа»."
90100050-36 = "Отсутствие собранных идентификаторов устройств в точке «Папа» указывает, что в радиусе 500 метров других людей нет."
90100050-37 = "Если в зоне наблюдения будут обнаружены аномалии или изменения, доложу дополнительно."
90100050-38 = "FOX 1, принято."
90100050-39 = ""
90100050-41 = ""
90100050-42 = "И наконец, FOX 2..."
90100050-43 = ""
90100050-45 = ""
90100050-47 = ""
90100050-48 = "Да. У меня тоже всё готово."
90100050-49 = "Запасов достаточно, маскировка идеальна, так что..."
90100050-50 = "Когда цель прибудет, соберу информацию согласно процедуре."
90100050-51 = "Отлично. Тогда теперь..."
90100050-52 = "[ns1] «Похоже, всё становится серьёзно...»\n[ns2] «Каков план?»"
90100050-55 = "А... [USERNAME] Сенсей."
90100050-56 = "Кажется, я уже говорила, что вам не нужно лично контролировать операцию. После миссии я предоставлю официальный отчёт."
90100050-57 = "Есть причина, по которой вы вышли на связь?"
90100050-58 = "[s3] «Это первая совместная миссия отряда FOX и Шале!»\n[s4] «Я хотел лично посмотреть, как вы работаете!»"
90100050-61 = "...Понимаю."
90100050-62 = "Тогда я кратко изложу текущую ситуацию и наши дальнейшие действия."
90100050-63 = "Первая задача операции «Кон-Кон»... Нет, операции «Погоня за Преданиями» — выяснить правду о серии происшествий, которые якобы случились здесь, возле станции Широ Унаги."
90100050-64 = "[s] «Выяснить правду...?»"
90100050-65 = "Да. С прошлого месяца, примерно с возвращения президента Генерального студенческого совета, в этом районе несколько студентов потеряли сознание."
90100050-67 = "Большинство пострадавших находили около полудня, в сильную жару. Кроме мелких ссадин внешних травм не было. Естественно, многие заподозрили тепловой удар..."
90100050-68 = "Однако пульс и температура тела пострадавших были в норме. Более того, у многих наблюдались судороги, похожие на эпилептические. Для теплового удара это совершенно нетипично."
90100050-69 = "Особенно примечательно, что свидетели неизменно утверждали: перед происшествиями пострадавшие гнались за белым пугалом... Полицейская школа Валькирия сейчас расследует личность этого белого пугала."
90100050-71 = "Но дело в том... что никто НЕ видел пугало вблизи... кроме самих пострадавших."
90100050-72 = "Поскольку число жертв растёт, студенты уже распространяют слухи о призраке или злом духе, обитающем в этом районе."
90100050-73 = "Призраков не существует! Они всё выдумывают! Это полная чушь!"
90100050-74 = "Бессмысленное распространение таких слухов лишь мешает добраться до истины."
90100050-75 = "Согласна... Но доказательств для вывода пока недостаточно."
90100050-76 = "Независимо от наших предубеждений, нужно не спешить, тщательно изучить происшествия и собрать доказательства."
90100050-77 = "[s] «Так какова текущая цель?»"
90100050-78 = "Я опрошу людей, особенно тех, кто был близок к пострадавшим."
90100050-79 = "Никто не любит допросы, поэтому я притворюсь подработчицей. Немного поболтаю, а затем попробую как бы невзначай поднять эту тему."
90100050-80 = "[s] «Опять продаёшь инаризуси?»"
90100050-81 = "Хаха... Из-за жары пришлось изменить меню."
90100050-82 = "Последней пострадавшей была спортсменка команды Геенны по лёгкой атлетике..."
90100050-83 = "И, судя по всему, бегуньи Геенны любят эту уединённую дорожку."
90100050-84 = "Согласно странице их команды в соцсетях, сегодня у них тренировка."
90100050-85 = "Надеюсь, товарищи пострадавшей по команде смогут пролить свет на то, что случилось с их подругой."
90100050-86 = "[s] «Понятно...»"
90100050-87 = "Говорит FOX 4. Простите, что прерываю разговор..."
90100050-88 = "Но цели приближаются к точке встречи."
90100050-89 = ""
90100050-91 = ""
90100050-92 = "Дальше ты, FOX 2."
90100050-93 = "Оставь мне!"
90100050-98 = ""
90100050-99 = ""
90100050-100 = "Раз, два! Раз, два! Раз, два!"
90100050-101 = "Следите за дыханием! Держите ритм счёта!"
90100050-102 = ""
90100050-104 = ""
90100050-105 = "Прошу прощения!"
90100050-106 = "Хм? Ты кто? С дороги!"
90100050-107 = "Простите, что прерываю вашу тяжёлую тренировку... Но вам, девушки, наверное, ужасно жарко! Хотите попробовать освежающий «Гиперэйд»?"
90100050-108 = "Спортивный напиток...? Слушай, денег у нас нет. Проваливай!"
90100050-109 = "Девушки! Бесплатно! Я большая поклонница легкоатлетической команды Геенны! Вы все такие... особенные!"
90100050-110 = "Подозрительно..."
90100050-111 = "Нет, он веганский! «Гиперэйд» — новейшая система восполнения электролитов и гидратации от фармацевтической компании Козука! Сохраняйте прохладу вместе с Козукой!"
90100050-112 = "Мы раздаём листовки и проводим промоакции... Но говорят же, что сарафанное радио быстрее всего, верно? А уж вы-то, девушки, знаете толк в «быстрее»! Хаха!"
90100050-113 = "Вот мы и подумали: если уважаемые спортсменки его оценят, вы могли бы сделать нам одолжение и рассказать друзьям!"
90100050-114 = "Вы наверняка знаете, как важно восполнять электролиты после тренировки. В «Гиперэйде» научно подтверждённая концентрация электролитов выше, чем у конкурентов, а значит, вы сможете восстановиться—"
90100050-115 = "Д-Да, поняли. Бесплатно и вы серьёзно. Попробуем."
90100050-116 = "Ага. Я всё равно уже хотела пить."
90100050-117 = ""
90100050-119 = ""
90100050-120 = ""
90100050-121 = "...Может, это из-за сегодняшней жары? Кажется, мне правда было нужно что-то такое. Он реально работает?"
90100050-122 = "Прямо чувствую, как вода проникает в клетки!"
90100050-123 = "Именно! «Гиперэйд» — это настоящий хайп, когда речь идёт о доставке НУЖНЫХ ВАМ электролитов! Особенно когда становится жарко, если понимаете, о чём я!"
90100050-124 = "Напитка хватит всем, так что не стесняйтесь! Сделайте глоток и ПОКАЖИТЕ ЛУЧШИЙ РЕЗУЛЬТАТ!"
90100050-125 = "О, он и правда вкусный? Хм, ладно... Попробую!"
90100050-126 = "Ага, и мне один!"
90100050-127 = ""
90100050-128 = ""
90100050-129 = ""
90100050-130 = "Чёрт, что она туда намешала? Им же реально нравится."
90100050-131 = "Это порошок для напитка из SRT. Она просто развела его не так сильно. Ты наверняка его пробовала."
90100050-132 = "А? Эта дешёвая пародия на лимонад? Что не так с этими бегуньями?"
90100050-133 = "Похоже, FOX 2 упустила своё истинное призвание. Забудь про оружие — ей надо было идти в продажи."
90100050-134 = "(Я завладела их вниманием... Теперь нанести удар.)"
90100050-135 = ""
90100050-136 = "...Спасибо за напиток. Ты нас спасла! Жаль, что мы ничем не можем отплатить."
90100050-137 = "За счёт заведения, дорогуша! Но я буду безмерно благодарна, если вы разнесёте ХАЙП о «Гиперэйде» среди друзей!"
90100050-138 = "Без проблем! Уже не терпится увидеть его в магазинах. Мы всем расскажем."
90100050-139 = ""
90100050-141 = ""
90100050-142 = ""
90100050-143 = "...Кстати о том, как расходятся... слухи..."
90100050-144 = "Вы слышали о бегунье, которой здесь стало плохо?"
90100050-145 = ""
90100050-147 = ""
90100050-148 = "Хм? Ты про Таму? А что..."
90100050-149 = "...Тебе-то какое дело?"
90100050-150 = "О, никакого."
90100050-151 = "Просто... мой менеджер сказал быть здесь осторожнее. Что тут происходили... «инциденты»."
90100050-152 = "..."
90100050-153 = "Ага, извини. Нам нечего об этом сказать."
90100050-154 = "Это ведь был тепловой удар, да?"
90100050-155 = "Она вообще ничего не знает..."
90100050-156 = "Э-Эм, может, мы можем—"
90100050-157 = ""
90100050-159 = ""
90100050-160 = "Спасибо за напитки."
90100050-161 = ""
90100050-163 = ""
90100050-164 = ""
90100050-165 = ""
90100050-166 = ""
90100050-167 = "Чёрт. Не сработало."
90100050-168 = "Похоже, Нико каким-то образом их разозлила."
90100050-169 = "FOX 2, докладываю... Простите, похоже, я провалилась."
90100050-170 = "Ничего. Мы и не думали, что будет легко."
90100050-171 = ""
90100050-173 = ""
90100050-174 = "FOX 2, оставайся на месте. К тебе кто-то направляется."
90100050-175 = ""
90100050-177 = ""
90100050-178 = ""
90100050-180 = ""
90100050-181 = "Здравствуйте... Вы ещё раздаёте образцы?"
90100050-182 = "К-Конечно. Хотите попробовать?"
90100050-183 = ""
90100050-185 = ""
90100050-186 = ""
90100050-187 = "Большое спасибо. Мне стало любопытно — никогда не слышала об этой марке."
90100050-188 = ""
90100050-190 = ""
90100050-191 = "Хм... Бодрит, и вкус необычный. Расскажу о нём Кираре."
90100050-192 = "Ты такая милая! Учишься где-то поблизости?"
90100050-193 = "А... С-Спасибо! Я учусь, но не рядом. Академия у нас очень уединённая. Называется... «Частная академия Гиацинт»..."
90100050-194 = "«Частная академия Гиацинт»? Где-то я это слышала."
90100050-195 = "Но я всё видела. Не обращай внимания на легкоатлеток. Они просто немного на нервах после... ну, ты понимаешь."
90100050-196 = "Не уверена, что именно я должна «понимать»?"
90100050-197 = "Ты же сама упоминала! Про бегунью, которая здесь потеряла сознание?"
90100050-198 = "Наверняка тебе любопытно."
90100050-199 = "О... Я не хотела лезть не в своё дело или кого-нибудь обидеть..."
90100050-200 = "Какая ты милая, но давай честно. Хочешь узнать подробности, да?"
90100050-201 = "И я вижу, что ты любишь посплетничать. От тебя прямо веет этим."
90100050-202 = ""
90100050-204 = ""
90100050-205 = ""
90100050-206 = "Ахаха... Неужели настолько заметно?"
90100050-208 = "Так вот, наша легкоатлетическая команда готовилась к предстоящему межшкольному чемпионату. И девушка, которая потеряла сознание, была одной из главных претенденток на место в основном составе."
90100050-209 = "Она была настолько соревновательной, что бегала сама даже вне общих тренировок. Даже по выходным."
90100050-210 = "Поэтому все решили, что она перетрудилась и получила тепловой удар."
90100050-211 = ""
90100050-212 = "Но на самом деле это был не тепловой удар?"
90100050-213 = "Ага. Об этом уже пишут в сети, но с ней всё было в норме. Клуб экстренной медицинской помощи это подтвердил."
90100050-214 = "Тогда люди начали говорить, будто кто-то из клуба из зависти проклял или напал на неё, чтобы занять её место в основном составе."
90100050-215 = "А... Вот почему те бегуньи были такими напряжёнными."
90100050-216 = "Даже если конкурентов станет меньше, всё равно будешь защищаться, когда люди намекают, будто ты специально подставила подругу."
90100050-217 = "Я знаю, мы, девушки Геенны, обычно уверены в себе, но совсем не думать о чужом мнении трудно."
90100050-218 = "Понятно. Сильный стресс и публичный позор действительно могут подкосить здоровье."
90100050-219 = "Пока легкоатлетическую команду буквально поджаривает эта ситуация, выбора у них нет. Остаётся переждать слухи — особенно пока девушка, потерявшая сознание, всё ещё не может говорить."
90100050-220 = ""
90100050-222 = ""
90100050-223 = "...Всё это лишь слухи."
90100050-224 = "Такие дикие слухи иногда сравнивают с природными явлениями — ветром или волнами."
90100050-225 = "Их не остановить, сколько ни пытайся, а борьба с ними только усугубляет ситуацию."
90100050-226 = "Для тех, кто оказался в центре слухов, это, наверное, ощущается как шторм посреди моря."
90100050-227 = "Наверное, кажется, что единственный способ выжить — отдаться на волю волн и довериться судьбе..."
90100050-228 = "Но... мы ведь не безвольные лодки без руля."
90100050-229 = "Возможно, лучше самому взяться за штурвал и идти против волн."
90100050-230 = ""
90100050-232 = ""
90100050-233 = ""
90100050-234 = "Это ты из личного опыта говоришь?"
90100050-235 = "Невозможно прожить подростковые годы и ни разу не пришлось пробираться через мерзкие слухи."
90100050-236 = "Фу-фу, ты мне нравишься."
90100050-237 = "Хочешь добавиться друг к другу в MomoTalk? Вдруг ещё встретимся."
90100050-238 = "Конечно! Секунду."
90100050-239 = ""
90100050-241 = ""
90100050-242 = ""
90100050-243 = "Отлично. Тогда до встречи. Не перегревайся!"
90100050-244 = ""
90100050-246 = ""
90100050-247 = ""
90100050-248 = ""
90100050-249 = "В ней было что-то особенное, правда?"
90100050-250 = "Ага. Эй, FOX 2, ты же не дала ей свой НАСТОЯЩИЙ MomoTalk, да?"
90100050-251 = "Не переживай. Это временный аккаунт. Завтра удалю."
90100050-252 = "В другом месте мы, возможно, стали бы подругами... Но сейчас мы посреди миссии."
90100050-253 = ""
90100050-255 = ""
90100050-256 = "Говорит FOX 2. Задание завершено, информация получена. Возвращаюсь на базу."
90100050-258 = "Следующий эпизод;Правда и ложь"
