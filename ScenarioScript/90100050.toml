[translation]
90100050-1 = "Episódio 05;Coleta de Pistas"
90100050-2 = ""
90100050-3 = "Hora padrão de Kivotos: 10h30."
90100050-4 = "A partir deste instante, o Esquadrão FOX inicia a coleta de informações da 'Operação: Caça às Lendas Urbanas'."
90100050-5 = "Operadoras, apresentem seus relatórios de situação."
90100050-6 = ""
90100050-8 = ""
90100050-9 = "Aqui é a FOX4. Monitorando a movimentação do alvo a partir do Ponto Oscar."
90100050-10 = "Até o presente momento, nenhuma anormalidade detectada."
90100050-11 = "Porém... temos um probleminha microscópico aqui no Ponto Oscar."
90100050-12 = "Especifique a anomalia."
90100050-13 = "Tá um calor do cão... Tô parada feito estátua e suando em bica.#nO verão ainda nem começou, meu Deus do céu?!"
90100050-14 = "Ficar debaixo de lona de camuflagem no sol a pino tá derretendo os meus miolos～"
90100050-15 = "Os índices térmicos deste ano estão consideravelmente acima da média histórica."
90100050-16 = "Na próxima fase, designarei uma posição sombreada. Lamento pelo desconforto temporário――"
90100050-17 = ""
90100050-19 = ""
90100050-20 = "FOX4, para de choradeira. A gente já suportou calor muito pior do que esse em operações de selva."
90100050-21 = "Por acaso ficou mole durante o tempo que passou na prisão?"
90100050-22 = "FOX3, não vem me dar sermão no canal tático. Mesmo quem treina pesado sente calor, tá legal?"
90100050-23 = "Se eu estivesse só de camisetinha fina sem nada por baixo igual a certa pessoa, seria bem mais fresco――"
90100050-24 = "EU TÔ USANDO SUTIÃ SIM, SUA DESAVERGONHADA!!"
90100050-25 = ""
90100050-27 = ""
90100050-28 = "......FOX3, prossiga com o relatório técnico."
90100050-29 = "A-Aqui é a FOX3! Bem, eu também tava com tudo nos trinques――"
90100050-30 = "FOX3. Não dê ouvidos às provocações infantis da FOX4."
90100050-31 = "É... tem razão. Uuu..."
90100050-32 = ""
90100050-34 = ""
90100050-35 = "Aqui FOX3. Dispositivo de interceptação de [ruby=I     M     S     I]identidade de assinante[/ruby] operando no Ponto Papa a plena carga."
90100050-36 = "Cruzando os IDs de dispositivos móveis captados com o número de alvos no Ponto Oscar,#nestimamos que não há transeuntes identificáveis em um raio de 500 metros."
90100050-37 = "Caso surja qualquer anomalia de sinal ou novos terminais ingressem no perímetro, emitirei alerta imediato."
90100050-38 = "FOX1, ciente."
90100050-39 = ""
90100050-41 = ""
90100050-42 = "E por último, FOX2――"
90100050-43 = ""
90100050-45 = ""
90100050-47 = ""
90100050-48 = "Tudo prontinho por aqui também."
90100050-49 = "Suprimentos a postos, disfarce impecável..."
90100050-50 = "Assim que confirmar a aproximação dos alvos, darei início à abordagem conforme o procedimento padrão."
90100050-51 = "Excelente. Sendo assim, declaro――"
90100050-52 = "[ns1] \"Nossa... vocês usam uns termos táticos bem avançados, né?\"\n[ns2] \"O que exatamente vocês vão fazer agora?\""
90100050-55 = "Sensei."
90100050-56 = "Tínhamos combinado que faríamos a reunião de debriefing após a conclusão da ronda.#nEu havia dito que não era necessário o senhor nos acompanhar pessoalmente sob o sol."
90100050-57 = "Haveria alguma inquietação com a nossa conduta?"
90100050-58 = "[s3] \"É a primeira operação conjunta da Schale com o Esquadrão FOX!\"\n[s4] \"Queria ver a Yukino em ação de perto com os meus próprios olhos.\""
90100050-61 = "......Compreendo."
90100050-62 = "Pois bem. Farei um breve alinhamento tático para situá-lo."
90100050-63 = "O objetivo primário da 'Operação: Caça às Lendas Urbanas' é compreender a totalidade dos incidentes que vêm ocorrendo nos arredores da estação Shirounagi."
90100050-64 = "[s] \"O que tem acontecido por aqui afinal......?\""
90100050-65 = "Desde o mês passado, temos uma série de ocorrências de estudantes encontradas inconscientes pelo chão.#nCoincidentemente, por volta da época em que a Presidente do Conselho Estudantil Federal reapareceu."
90100050-67 = "A maioria das vítimas foi localizada exatamente ao meio-dia.#nComo não apresentavam ferimentos além de escoriações leves de queda, a suspeita inicial recaiu sobre insolação ou desidratação."
90100050-68 = "Contudo, os sinais vitais, pulso e temperatura corporal das vítimas estavam absolutamente normais,#ne quase todas apresentavam quadros severos de convulsões motoras."
90100050-69 = "Além disso, há um depoimento comum entre as testemunhas: todas alegam ter perseguido um 'espantalho branco' instantes antes de desmaiarem.#nA Guarda Valkyrie tenta descobrir a identidade da figura, sem sucesso."
90100050-71 = "O problema é que ninguém além das próprias vítimas conseguiu ver esse espantalho branco...#nAs investigações convencionais bateram num muro."
90100050-72 = "Conforme o número de vítimas aumenta, boatos sobre maldições de fantasmas e espíritos malignos começaram a incendiar as redes sociais..."
90100050-73 = "Até parece que fantasma existe!#nÉ só o povo inventando história fiada pra justificar o pânico."
90100050-74 = "Espalhar histeria sem embasamento só serve para nublar o foco do inquérito policial."
90100050-75 = "Concordo com o ponto de vista, mas no presente momento faltam elementos probatórios."
90100050-76 = "Nossa única alternativa é refazer os passos das vítimas e colher evidências concretas."
90100050-77 = "[s] \"E qual é o plano para agora?\""
90100050-78 = "Iniciaremos interrogando pessoas ligadas aos círculos de convivência das vítimas."
90100050-79 = "Para extrair declarações sem despertar desconfiança, a FOX2 se disfarçou de promotora de vendas de rua."
90100050-80 = "[s] \"Ela vai vender sushis de inari de novo?\""
90100050-81 = "Alteramos o produto para adequar ao perfil do alvo. Vender comida perecível sob este mormaço seria inviável."
90100050-82 = "A vítima mais recente é uma velocista do Clube de Atletismo de Gehenna."
90100050-83 = "O time costuma utilizar este calçadão ribeirinho para treinos de corrida diários, devido ao baixo fluxo de pedestres."
90100050-84 = "Confirmamos na agenda esportiva delas que há um treino programado para hoje."
90100050-85 = "Colegas de equipe da mesma equipe certamente devem saber o que a vítima relatou antes de cair."
90100050-86 = "[s] \"Entendi a jogada......\""
90100050-87 = "Aqui é a FOX4. Lamento interromper o bate-papo descontraído, mas――"
90100050-88 = "Os alvos estão se aproximando do ponto de interceptação."
90100050-89 = ""
90100050-91 = ""
90100050-92 = "FOX2, proceda com a abordagem."
90100050-93 = "Deixa com a mamãe aqui～"
90100050-98 = ""
90100050-99 = ""
90100050-100 = "Um, dois! Um, dois! Ritmo constante!"
90100050-101 = "Não percam o fôlego! Acompanhem o grito de guerra!"
90100050-102 = ""
90100050-104 = ""
90100050-105 = "Com licença, atletas～"
90100050-106 = "Epa, sai da frente, tá atrapalhando!"
90100050-107 = "Perdoem a intromissão no treino... Que tal experimentarem o novíssimo isotônico 'Hyper Aid', o repositor do futuro?"
90100050-108 = "Hã? Isotônico do nada? O que é isso, empurroterapia de vendedor ambulante?!"
90100050-109 = "Imagina! Estamos distribuindo amostras grátis bem geladinhas para atletas de ponta! Sirvam-se à vontade!"
90100050-110 = "Hum... isso tá com cara de furada..."
90100050-111 = "Fufufu, compreendo a cautela... Mas este é o grande lançamento dos prestigiados Laboratórios Kozuka!"
90100050-112 = "Fizemos comerciais e eventos de marketing, mas no mundo esportivo moderno, nada supera a recomendação boca a boca de quem entende do riscado."
90100050-113 = "Por isso gostaríamos que as atletas de elite do Atletismo de Gehenna degustassem em primeira mão. Se gostarem, basta compartilhar a experiência nas redes!"
90100050-114 = "Como bem sabem, exercícios extenuantes drenam os eletrólitos do corpo no suor... Repor com absorção rápida é a chave da vitória! O 'Hyper Aid' possui uma concentração eletrolítica superior a qualquer concorrente――"
90100050-115 = "Tá, tá, já entendi, não precisa dar uma palestra científica! Me dá um copo aí pra eu ver se é bom."
90100050-116 = "Minha garganta tá seca mesmo, veio a calhar."
90100050-117 = ""
90100050-119 = ""
90100050-120 = ""
90100050-121 = "Nossa... será que é por causa do calorão?#nMolhou a garganta bem mais rápido do que água comum..."
90100050-122 = "Parece que o líquido é absorvido pelas células no mesmo segundo em que você engole..."
90100050-123 = "Exatamente! Garantir absorção celular máxima em qualquer condição adversa é o grande trunfo do Hyper Aid!"
90100050-124 = "Tenho caixas e mais caixas aqui, podem repetir à vontade!"
90100050-125 = "Dá essa energia toda mesmo? Passa um copo pra cá então!"
90100050-126 = "Eu também quero! Me dá um copo!"
90100050-127 = ""
90100050-128 = ""
90100050-129 = ""
90100050-130 = "Que bebida é essa afinal? Eu nunca ouvi falar dessa marca na vida..."
90100050-131 = "Você com certeza já bebeu isso centenas de vezes, Kurumi.#nÉ aquele pozinho de limonada barata da ração da SRT diluído com uma vez e meia a água recomendada."
90100050-132 = "O QUÊ?! Aquele refresco artificial vagabundo?! E elas tão vibrando daquele jeito...?!"
90100050-133 = "Se a Niko não tivesse entrado para a SRT, teria ficado milionária como gerente de vendas."
90100050-134 = "（A primeira etapa de desarmar a desconfiança foi um sucesso absoluto...）"
90100050-135 = ""
90100050-136 = "......Ufa, tava ótimo! Como é que a gente faz pra retribuir o brinde?"
90100050-137 = "Não há de quê! Ficarei imensamente grata se postarem suas impressões honestas no Momotalk."
90100050-138 = "Pode deixar com a gente! Vou recomendar pra todo mundo que eu conheço!"
90100050-139 = ""
90100050-141 = ""
90100050-142 = ""
90100050-143 = "......Aliás, falando em recomendações e comentários..."
90100050-144 = "Por acaso vocês ouviram falar de uma velocista daqui que desmaiou misteriosamente por perto dias atrás?"
90100050-145 = ""
90100050-147 = ""
90100050-148 = "Hã? Tá falando da Tama-chan? Por que foi tocar nesse assunto do nad――"
90100050-149 = "......Por que você tá querendo saber disso?"
90100050-150 = "Ah, não foi por mal! É que soube de vários incidentes estranhos nessa área e fiquei com receio de andar por aqui sozinha..."
90100050-151 = ""
90100050-152 = "............"
90100050-153 = "Nós não temos absolutamente nada para falar com estranhos sobre isso."
90100050-154 = "No fim, você também vai dizer que foi insolação por excesso de treino, né?"
90100050-155 = "Falam como se soubessem de alguma coisa..."
90100050-156 = "E-Ei, me desculpem se ofendi vocês, eu só――"
90100050-157 = ""
90100050-159 = ""
90100050-160 = "Obrigada pelo suco. Vamos embora, meninas."
90100050-161 = ""
90100050-163 = ""
90100050-164 = ""
90100050-165 = ""
90100050-166 = ""
90100050-167 = "Haaah... deu ruim, meninas..."
90100050-168 = "Parece que você tocou numa ferida aberta bem dolorida."
90100050-169 = "Aqui FOX2... Perdão, a sondagem direta falhou."
90100050-170 = "Não se preocupe. Sabíamos que não seria fácil extrair detalhes logo de primer――"
90100050-171 = ""
90100050-173 = ""
90100050-174 = "Espere, FOX2! Um novo indivíduo está se aproximando da sua posição."
90100050-175 = ""
90100050-177 = ""
90100050-178 = ""
90100050-180 = ""
90100050-181 = "Com licença... essa bebida aí ainda tá sendo distribuída?"
90100050-182 = "C-Com certeza! Gostaria de um copo geladinho?"
90100050-183 = ""
90100050-185 = ""
90100050-186 = ""
90100050-187 = "Obrigada! Nunca vi essa marca antes, fiquei super curiosa."
90100050-188 = ""
90100050-190 = ""
90100050-191 = "Huuuum... Que gosto exótico! É uma pegada bem diferente, nunca provei nada parecido.#nVou até recomendar pra Kirara mais tarde!"
90100050-192 = "Mas vem cá, nunca vi você por estes lados. Você é de outra escola, né?"
90100050-193 = "S-Sim! Sou de uma academia um pouco distante daqui... do Colégio Particular Hyacinth..."
90100050-194 = "Huum... acho que já ouvi esse nome em algum lugar..."
90100050-195 = "Mas enfim, relaxa! Não liga pra patada que as meninas do atletismo te deram agora há pouco não.#nElas tão com os nervos à flor da pele por causa daquele rolo todo."
90100050-196 = "Aquele rolo...?"
90100050-197 = "Da menina que acharam desmaiada no meio do nada."
90100050-198 = "Você tava doida pra saber o que rolou, né?"
90100050-199 = "Não, eu só achei estranh――"
90100050-200 = "Tá estampado na sua testa: 'Tô morrendo de curiosidade com a fofoca'!#nVejo que você também adora um boato misterioso, né?"
90100050-201 = ""
90100050-202 = ""
90100050-204 = ""
90100050-205 = ""
90100050-206 = "Ahaha... deu pra perceber tão na cara assim?"
90100050-208 = "O Clube de Atletismo de Gehenna tá prestes a fazer a seletiva pras vagas titulares do campeonato nacional.#nA menina que apagou era a grande favorita pra liderar a equipe."
90100050-209 = "Ela treinava feito uma condenada, até nos dias de folga vinha correr sozinha no asfalto."
90100050-210 = "Por isso, quando acharam ela estirada no chão, todo mundo achou que ela tinha passado do limite e desmaiado de insolação..."
90100050-211 = ""
90100050-212 = "......Mas não era insolação, era?"
90100050-213 = "Exato. Já vazou no Momotalk: os exames clínicos não acusaram nenhuma anomalia física.#nO Comitê de Emergência Médica de Gehenna assinou o laudo, então não é fake news."
90100050-214 = "Só que aí começou o inferno: por que diabos a [ruby=favorita]estrela do time[/ruby] desmaiou do nada?#nComeçaram a espalhar que outras velocistas colocaram 'mau-olhado' nela por inveja ou sabotaram a água dela!"
90100050-215 = "Ah... então foi por isso que elas reagiram daquele jeito tão na defensiva."
90100050-216 = "Pois é! Mesmo que a saída dela abra vaga pras outras, ninguém quer ser acusada de ter rogado praga numa colega de equipe, né?"
90100050-217 = "Dizem que as alunas de Gehenna não tão nem aí pra opinião alheia,#nmas fofoca venenosa atinge qualquer um em cheio."
90100050-218 = "Com certeza. Como diz o provérbio: 'A língua do povo fere mais do que espada afiada'."
90100050-219 = "Pois é. E como a vítima não consegue nem falar pra contar o que viu, as meninas do atletismo só podem engolir o choro e esperar a poeira baixar."
90100050-220 = ""
90100050-222 = ""
90100050-223 = "......Boatos são cruéis mesmo."
90100050-224 = "Dizem que as fofocas correm como o vento... e se espalham com a força incontrolável da natureza."
90100050-225 = "Quanto mais você tenta conter, mais elas transbordam e causam estragos por onde passam."
90100050-226 = "Para quem está no epicentro, a sensação deve ser a de encarar uma onda gigante que ameaça engolir o barco."
90100050-227 = "Deixar-se levar pela correnteza e aceitar o destino pode parecer tentador..."
90100050-228 = "Mas nós não somos cascas de noz vazias à deriva."
90100050-229 = "Precisamos empunhar os remos com firmeza e remar contra a arrebentação――#nsó assim chegaremos ao porto seguro da verdade."
90100050-230 = ""
90100050-232 = ""
90100050-233 = ""
90100050-234 = "Nossa... isso soou muito como experiência própria, hein?"
90100050-235 = "Acho difícil encontrar alguém neste mundo que nunca tenha sido alvo de uma fofoca maldosa pelo menos uma vez na vida."
90100050-236 = "Fufufu, você é bem profunda, gostei de você!"
90100050-237 = "Bora trocar contato no Momotalk? Quem sabe a gente não se esbarra por aí de novo!"
90100050-238 = "Com prazer. Um instante enquanto abro o código."
90100050-239 = ""
90100050-241 = ""
90100050-242 = ""
90100050-243 = "Prontinho! Depois te chamo lá. Se cuida nesse solzão, tá?"
90100050-244 = ""
90100050-246 = ""
90100050-247 = ""
90100050-248 = ""
90100050-249 = "Que garota mais cheia de luz e estilo, né?"
90100050-250 = "Pois é. Mas vem cá, Niko, você não passou a sua conta real de verdade pra ela, né?"
90100050-251 = "Claro que não. Passei uma conta temporária descartável que expira em 24 horas."
90100050-252 = "Se tivéssemos nos conhecido em outra época, tenho certeza de que seríamos grandes amigas... mas agora estamos em missão oficial."
90100050-253 = ""
90100050-255 = ""
90100050-256 = "Aqui FOX2. Missão de reconhecimento concluída com sucesso. Retornando à base."
90100050-258 = "Próximo Episódio;Entre Verdades e Mentiras"
