[translation]
1012805-1 = "Попытка вербовки"
1012805-2 = "Доброе утро, Сенсей!"
1012805-3 = "Надеюсь, у тебя всё хорошо!"
1012805-4 = "[s] «Добро пожаловать, Фую.»"
1012805-5 = ""
1012805-8 = "[ns] «...Но сегодня ты не представительница учеников?»"
1012805-9 = "Нет, вообще-то как раз представительница. Всё официально записано."
1012805-10 = "Если хочешь, можешь проверить журнал выходов Вайлдхант. Недавно были кадровые перестановки."
1012805-11 = "[s] «Странно, я ничего об этом не слышал...»"
1012805-12 = "Конечно, логично."
1012805-13 = "...Потому что я только что всё изменила."
1012805-14 = "[s] «...Что?»"
1012805-15 = "В жизни есть вещи важнее денег, Сенсей."
1012805-16 = "Иногда мы обмениваем товары на... определённые привилегии."
1012805-17 = ""
1012805-20 = "[ns] «Ты хочешь сказать, что пронесла контрабанду и подделала документы!»"
1012805-21 = "Как всегда сообразителен, Сенсей! Снова раскрываешь тайны."
1012805-22 = "Но, Сенсей, выслушай меня. Послушай. Присядь."
1012805-23 = "Это было неизбежно. Ничего нельзя было поделать."
1012805-24 = "[s] «...Ладно, слушаю.»"
1012805-25 = "Понимаешь, эта возможность может изменить всю жизнь."
1012805-26 = "И это..."
1012805-27 = "...Эксклюзивная презентация, на которой я завербую Сенсея официальным советником Картеля свободной торговли!"
1012805-28 = "[s] «Я?!»"
1012805-29 = "Прежде чем что-то скажешь, взгляни на это предложение. Видишь график?"
1012805-30 = "Если ты станешь советником Картеля свободной торговли, мы сможем диверсифицировать бизнес-модель, повысить производительность... и помочь ученикам! Это поднимет моральный дух!"
1012805-31 = "Посмотри на этот список. Видишь, что особый партнёр сможет провести через ворота Вайлдхант? Это всё необходимое ученикам...!"
1012805-36 = "Презентация Фую продолжалась. Честно говоря, она впечатляла..."
1012805-37 = ""
1012805-38 = "...Итак, думаю, здесь мы все согласны. Будущее принадлежит тем, кто верит в красоту своей мечты."
1012805-39 = "Так поверь в мечту. Что скажешь, Сенсей?"
1012805-40 = "[s1] «Было увлекательно, менеджер по продажам.»\n[s2] «Но предложение отклонено.»"
1012805-43 = "Ах...! Почему...?!"
1012805-44 = "Это моя вина. Видимо, я недостаточно подробно объяснила твой обширный пакет компенсаций и льгот!"
1012805-45 = "Итак, чтобы всё было ясно: если ты станешь нашим советником, партнёром, наставником..."
1012805-46 = "Я лично буду приходить сюда и БЕСПЛАТНО чинить большую часть бытовой техники и электроники."
1012805-47 = "[s3] «Фую, иногда мне кажется...»\n[s4] «Миллениум, возможно, упустил талант...»"
1012805-50 = "...Фуфу."
1012805-51 = "[s] «И всё же — отказ.»"
1012805-52 = "Отказ даже при таких условиях..."
1012805-53 = "Хм, посмотрим. А, точно! Давайте работать до «да»."
1012805-54 = "Например... Ты знал, что я отлично готовлю?"
1012805-55 = "Могу собирать ланч, сворачивать омлеты, хорошо варю мисо-суп. Ничто не сравнится с хорошим завтраком."
1012805-56 = "[s] «И всё равно нет.»"
1012805-57 = "Эм, что ещё..."
1012805-58 = "Д-Да. Е-Если ты станешь нашим советником..."
1012805-59 = "Т-Ты сможешь, если захочешь, видеть меня каждый день? Ну, понимаешь?"
1012805-60 = "Разве это не хорошо? М-Могу ли я вообще назвать это преимуществом..? Эм..."
1012805-61 = ""
1012805-64 = "[ns] «Хм, вот это уже определённо заманчиво.»"
1012805-65 = "Э."
1012805-66 = "П-П-П-Правда...?!"
1012805-67 = "[s5] «Но, к сожалению, я занят работой Шале...»\n[s6] «Я не могу стать вашим советником... пока что.»"
1012805-70 = ""
1012805-72 = ""
1012805-73 = "Н-Н-Ничего не поделаешь! Я попыталась. Отказ. Эх."
1012805-74 = "Ф-Фуфу, в следующий раз просто вернусь с презентацией получше."
1012805-75 = "Ну тогда пока! Увидимся!"
1012805-76 = ""
1012805-78 = ""
1012805-81 = ""
1012805-82 = ""
1012805-83 = "«Заманчиво», значит..."
1012805-84 = ""
1012805-86 = ""
1012805-87 = "...Хи-хи."
