[translation]
102195-4 = "Ха-ха-ха! Ещё одна успешная миссия!"
102195-5 = "Тогда до встречи когда-нибудь!"
102195-6 = "Бесконечный конвейер ведёт прямиком к справедливости!"
102195-7 = "Бесконечный суши-отряд: Кайтенгеры! Уходим!"
102195-8 = ""
102195-10 = ""
102195-12 = "..."
102195-13 = "Кто... Кто они вообще были?"
102195-15 = "*трррк* Я выполнила задание здесь, президент Химари."
102195-16 = "Токи...?"
102195-17 = "Ты уже закончила...? Тогда я могу прямо сейчас отправить координаты следующей цели. Подойдёт?"
102195-18 = "Да, мэм."
102195-19 = "...Токи, ты и о себе заботишься? Ты работаешь без остановки."
102195-20 = "Спасибо за заботу, Эйми, но в оружии ещё осталась энергия. Я могу продолжать сражаться."
102195-22 = "Токи. Даже если в способности Abi-Eshuh была отражена часть технологии Безымянных богов... использовать её мы могли только благодаря существованию Города-крепости Эрид."
102195-23 = "Это нестандартно, или, скорее... дурной вкус — использовать целый город как вычислительное устройство для усиленного экзоскелета... Но именно поэтому он смог показать такую производительность."
102195-24 = "Уверенность Рио в том, что Abi-Eshuh сможет противостоять принцессе Безымянных богов, возможно, была не пустой мечтой..."
102195-25 = "Но теперь, когда Эрид разобран и от него осталась лишь оболочка, он больше не способен работать на прежнем уровне."
102195-26 = "Пожалуйста, будь осторожна и воспринимай его как обычный экзоскелет. Хорошо?"
102195-27 = "...Да."
102195-28 = "...Ну, пожалуй, не совсем обычный. Я, сверхгениальный хакер, кое-что модифицировала... Это невероятный шедевр гения, пусть и не такого читерского уровня, как раньше."
102195-29 = "Поняла. Спасибо, президент Химари."
102195-30 = ""
102195-32 = "Прости, что спрашиваю снова, но ты точно в порядке, Токи? Я тоже могу оказать поддержку."
102195-33 = "Всё в порядке, Эйми. Я привыкла сражаться одна."
102195-34 = ""
102195-36 = ""
102195-38 = "Когда доберусь до координат цели, свяжусь с вами."
102195-39 = ""
102195-41 = ""
102195-42 = "Она... очень мрачная. И серьёзная."
102195-43 = "Токи изначально была из C&C. Возможно, она хочет сражаться рядом с другими агентами."
102195-44 = "Тогда почему не делает этого?"
102195-45 = "Вот в чём загадка. Возможно... она считает, что не заслуживает стоять рядом с ними в бою."
102195-46 = "Хм... Я не согласна. Токи лишь выполняла приказы."
102195-47 = "В конечном счёте виновата старшая сестра."
102195-48 = "Но всё же именно она совершала эти действия. Она не полностью невиновна."
102195-49 = "Хм. Сложно."
102195-50 = "И правда. Рио и Токи похожи своей неловкостью в отношениях с другими людьми."
102195-51 = ""
102195-55 = "Следующий эпизод; Финальная оборонительная операция — Шале"
