[translation]
1201-1 = "Уборка & Зачистка"
1201-2 = "Улица кампуса Миллениум"
1201-3 = "(На углу улицы в Миллениум припаркован грузовик с логотипом C&C.)"
1201-4 = ""
1201-6 = ""
1201-7 = ""
1201-8 = ""
1201-9 = ""
1201-10 = ""
1201-11 = "Хм-м, хм-м, хм-м. ♪ ♬"
1201-12 = "..."
1201-13 = "..."
1201-14 = ""
1201-16 = ""
1201-18 = "Хм-м, хм-м, хм-м. ♪ Хм-м, хм-м. ♬"
1201-19 = "..."
1201-20 = "*вздох* Невероятно."
1201-21 = "Не стой столбом и не глазей. Помоги мне подмести."
1201-22 = "Не-а, ты и сама справляешься. Похоже, тебе очень весело."
1201-23 = "И это ты называешь весельем? Ты всё это время ни слова не сказала."
1201-24 = "Что? Ты про... уборку?"
1201-25 = "Конечно. Когда чисто — приятно смотреть. Понятия не имею, что тебя не устраивает."
1201-26 = "Забудь."
1201-27 = "*вздох* Не понимаю, как я вообще докатилась до того, что сижу здесь и занимаюсь такой ерундой..."
1201-28 = "Эй, смотрите туда. Это C&C. Они убираются."
1201-29 = "...?"
1201-30 = "C&C? О, и правда. Ну и что? Логично, что клуб уборки, ну... убирается."
1201-31 = "Погоди, ты правда не знаешь? Говорят, это всё прикрытие."
1201-32 = "..."
1201-33 = "Прикрытие? Какое ещё прикрытие?"
1201-34 = ""
1201-35 = "Ну... Как бы сказать? На самом деле они специальные агенты, которые получают заказы от высокопоставленных людей."
1201-37 = "Да чтоб вас! Чего вы там шепчетесь? На что уставились, а?!"
1201-38 = "А-а-а-а-а!"
1201-39 = ""
1201-42 = "О боже..."
1201-43 = "Убежали. Ты их напугала."
1201-44 = "Похоже, наш образ Клуба благоустройства окружающей среды опять уплыл куда-то вдаль."
1201-45 = "Заткнись."
1201-46 = ""
1201-48 = ""
1201-49 = "Эге-гей! Смотрите сюда. Тут тоже полно пыли! И вот здесь!"
1201-50 = "Ты что там делаешь?! Зачем тебе вообще лезть на перила?!"
1201-51 = "Слезай немедленно! Если эта особа вернётся и снова начнёт нести всякую чушь..."
1201-52 = "C&C, усердно работаете?"
1201-53 = "...!"
1201-54 = "...!"
1201-55 = "...Как будто за нами призрак ходит..."
1201-56 = ""
1201-58 = ""
1201-59 = ""
1201-60 = "В-Всё в порядке? Вы все вдруг стали такими напряжёнными."
1201-61 = "Не может быть, я уверена, все хотели поприветствовать тебя. Даже президент."
1201-62 = "Ага, конечно."
1201-63 = "Совсем не похоже."
1201-64 = "А-ха-ха..."
1201-65 = "А я-то думала, это Клуб благоустройства окружающей среды, а тут даже президент лентяйничает..."
1201-66 = "Что, пришла проверять качество нашей уборки? Или решила нарываться?"
1201-67 = "Нет, я не нарываться пришла. Я просто беспокоюсь. Зачем перекручивать мои слова?"
1201-68 = "Судя по тем студентам, которые только что прошли мимо, ваше прикрытие работает так себе."
1201-69 = "Если ты пришла докапываться, может, лучше просто оставишь нас в покое?"
1201-70 = "Прости, но не могу. И я уже сказала: я не пришла докапываться."
1201-71 = ""
1201-73 = ""
1201-74 = "...А теперь посмотрите сюда. Как думаете, что это?"
1201-75 = "...Хм? Что там? Чек...?"
1201-76 = "Да, чек. Стоимость ремонта школьного имущества, которое вы уничтожили во время прошлой операции."
1201-77 = "Ох..."
1201-78 = "А теперь смотрите! Смотрите сюда! Что скажете об этой цифре?"
1201-79 = "О боже... Сумма невероятная. Похоже, в прошлый раз мы слегка увлеклись."
1201-80 = "Хм. Не хочу забегать вперёд, Юука, но разве Семинар не должен оплачивать наши операции...?"
1201-81 = "Да, знаю. Конечно, знаю."
1201-82 = ""
1201-84 = ""
1201-85 = ""
1201-87 = "...Вот именно поэтому я и пришла вас отчитывать."
1201-88 = "...!"
1201-89 = "...!"
1201-90 = "..."
1201-91 = ""
1201-93 = ""
1201-94 = "Сколько... Сколько раз я уже вас об этом умоляла?!"
1201-95 = "Я несколько раз подчёркивала, что операция проходит в районе, где полно дорогого оборудования. Я просила вас быть осторожнее!"
1201-96 = ""
1201-98 = ""
1201-99 = "Но вы взорвали всё это место бомбой! БОМБОЙ!"
1201-100 = "Эм... Я понимаю, что было немного громко. Но я делала это с намерением провести зачистку!"
1201-101 = "Я не такую зачистку имела в виду!"
1201-102 = "Прошу, прошу, прошу вас хоть немного думать о бедных людях, которым потом реально приходится разгребать ваш бардак! Например, обо мне!"
1201-103 = "П-Прости. В будущем постараюсь быть внимательнее."
1201-104 = "..."
1201-105 = "И я прости. Только что немного погорячилась."
1201-106 = "Ну... По крайней мере, я вас всех нашла."
1201-107 = "Поэтому я хотела попросить вас, эм... Для начала можем перейти в другое место?"
1201-108 = "...?"
1201-109 = "...?"
1201-110 = "Перейти? Погоди, уже пора выполнять следующий заказ?"
1201-111 = "Ага. Но учитывая, где мы сейчас, инструктаж здесь проводить нельзя. Давайте переместимся куда-нибудь побезопаснее."
1201-112 = "Я знаю, что говорю это каждый раз, но..."
1201-113 = "Я умоляю вас выполнить всё тихо и чисто. Тихо. Чисто."
1201-115 = "Поняли-поняли. Не переживай так. Мы разберёмся."
1201-116 = "...После всего, что ты сейчас сказала, мне только тревожнее... Но что мне остаётся..."
1201-117 = "Удачи вам... наверное."
1201-120 = "После завершения задания C&C в Семинар срочно отправили отчёт о выполнении."
1201-121 = "Что?! Серьёзно? Вы меня в могилу сведёте!!"
1201-122 = "Уборка & Зачистка"
