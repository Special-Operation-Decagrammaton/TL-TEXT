[translation]
1011202-1 = "В автобусе"
1011202-3 = "В тот день я направлялся прямиком в Миллениум по работе."
1011202-4 = "Был час пик, поэтому я был уверен, что автобус окажется переполнен."
1011202-5 = ""
1011202-15 = "[ns] «Уф... Сколько людей...»"
1011202-16 = ""
1011202-19 = "Когда я пробирался к середине салона..."
1011202-20 = ""
1011202-24 = "А? Господин?"
1011202-25 = "[s] «Этот голос...»"
1011202-26 = ""
1011202-28 = "Ого, Господин, это и правда вы! Ахаха!"
1011202-29 = "[s1] «Привет, Асуна!»\n[s2] «Сегодня ты в школьной форме?»"
1011202-32 = "Ага! Сегодня клубных занятий нет, поэтому..."
1011202-33 = ""
1011202-35 = ""
1011202-36 = "А, вы, наверное, не привыкли видеть меня в такой одежде, да, Господин?"
1011202-37 = "[s] «Это точно.»"
1011202-38 = ""
1011202-40 = ""
1011202-41 = "Фуфу. Ну и как вам? Мне идёт?"
1011202-42 = ""
1011202-44 = ""
1011202-46 = "«Господин»...?"
1011202-47 = "Ч-что не так с этим человеком...?"
1011202-48 = ""
1011202-50 = ""
1011202-51 = "[ns3] «Д-да! Тебе идёт, Асуна...!»\n[ns4] «И-и можешь не называть меня „Господином“.»"
1011202-52 = ""
1011202-53 = ""
1011202-56 = ""
1011202-57 = "А-а, поняла."
1011202-58 = "Сейчас я ведь не горничная."
1011202-59 = "Тогда... Сенсей! Так правильно?"
1011202-60 = ""
1011202-63 = ""
1011202-64 = "«С-Сенсей»...?"
1011202-65 = "Это что, он заставляет своих учеников называть его Господином...?"
1011202-66 = ""
1011202-68 = ""
1011202-69 = "[ns5] «...»\n[ns6] «(Недоразумение становится только хуже...)»"
1011202-70 = ""
1011202-71 = ""
1011202-77 = "Кхм-кхм. Внимание, пассажиры."
1011202-78 = ""
1011202-82 = "Впереди крутой поворот, но снижать скорость мне не хочется, поэтому сейчас будет инерционный дрифт."
1011202-83 = "[ns] «Простите, ЧТО?!»"
1011202-84 = ""
1011202-87 = "Пожалуйста, крепче держитесь за поручни и самостоятельно позаботьтесь о своей безопасности."
1011202-88 = ""
1011202-90 = ""
1011202-91 = "Ахаха, держитесь крепче, Сенсей!"
1011202-92 = ""
1011202-98 = "[ns] «А-А-А-А!»"
1011202-99 = ""
1011202-103 = ""
1011202-104 = ""
1011202-105 = "Ииик!!"
1011202-106 = ""
1011202-110 = ""
1011202-111 = "Вы в порядке, Сенсей?"
1011202-112 = "[s] «Д-да, я жив...»"
1011202-113 = "Хаха, было весело! Ага! Всех так швыряло из стороны в сторону..."
1011202-114 = "Прямо не автобус, а американские горки, правда?"
1011202-115 = "[s] «Ага! Вот только это ДОЛЖЕН быть автобус!»"
1011202-116 = ""
1011202-119 = "[ns] «...»"
1011202-120 = "Из-за этого дрифта меня прижало слишком близко к Асуне."
1011202-121 = "[ns] «Эм, Асуна... мы не слишком близко друг к другу?»"
1011202-122 = "А?"
1011202-123 = "Совсем нет! Мне и так нравится!"
1011202-124 = ""
1011202-127 = "Я почти никогда не вижу вас так близко! Фуфу..."
1011202-128 = "[s] «Н-но тут есть одна проблема...»"
1011202-129 = ""
1011202-132 = "[ns7] Изо всех сил попытаться освободить немного места\n[ns8] «Хоп!!»"
1011202-135 = "Ахаха!!"
1011202-136 = "Что это было, Сенсей? Вы такой смешной!"
1011202-137 = "[s] «Я изо всех сил стараюсь вести себя как учитель.»"
1011202-138 = "Вы пытаетесь сделать так, чтобы мне было удобнее двигаться?"
1011202-139 = "А мне и так хорошо. С вами удобно. Хаха."
1011202-140 = "[s] «В этом-то и проблема...»"
1011202-141 = "Ого, я слышу, как бьётся ваше сердце, Сенсей. «Тук-тук-тук-тук.» Как быстро!"
1011202-143 = "После десяти минут, которые ощущались как десять лет..."
1011202-144 = "Я наконец добрался до нужной остановки и вышел из автобуса."
