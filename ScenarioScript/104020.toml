[translation]
104020-1 = "Эпизод 2; Сопротивление 1"
104020-4 = "А-Ару. Посмотри на небо."
104020-5 = "Похоже, здесь опять станет жарко."
104020-6 = "...И что с того? Давайте, вы двое!"
104020-7 = "А-Ару?"
104020-8 = "Сенсей и Каёко сейчас там наверху и изо всех сил продолжают бороться!"
104020-9 = "Если вы собираетесь поджать хвост и разреветься из-за такой мелкой неприятности, даже не думайте больше когда-либо вставать перед ними!"
104020-10 = "Ух ты! Ару!"
104020-11 = "Хи-хи."
104020-12 = "Мы сделаем здесь всё, что в наших силах!"
104020-13 = ""
104020-15 = ""
104020-17 = "Да, да! Я пойду за тобой до самого конца, Ару!"
104020-18 = ""
104020-20 = ""
104020-22 = ""
104020-23 = "...В критические моменты Ару такая крутая."
104020-24 = ""
104020-26 = ""
104020-29 = ""
104020-30 = ""
104020-31 = "...Что это был за свет?"
104020-32 = "В данных никакого отклика..."
104020-33 = "...На всякий случай стоит проверить."
104020-34 = ""
104020-38 = "Что происходит?"
104020-39 = "Похоже, Санктумы снова начинают проявляться."
104020-40 = "*вздыхает*"
104020-41 = "К-Как думаете... С-Сенсей в порядке?"
104020-42 = "Сейчас нет времени об этом переживать. Нужно готовиться к атаке."
104020-43 = ""
104020-45 = ""
104020-46 = ""
104020-48 = "Снайпер, перейди к следующей позиции и жди. Лидер отряда RABBIT, возглавь наступление. Раз Арис здесь нет, я возьму на себя сосредоточенный огонь."
104020-49 = "Сделаем всё, что сможем."
104020-50 = "Да. Поняла!"
104020-53 = "Повторяю. Всем пассажирам необходимо немедленно эвакуироваться. Запуск последовательности самоуничтожения через 17 секунд..."
104020-54 = "Х-Химари... Мы можем это остановить?"
104020-55 = "Д-Дай мне секунду...!"
104020-56 = ""
104020-61 = "Пожалуйста, немедленно эвакуируйтесь. Запуск последовательности самоуничтожения через 9 секунд..."
104020-62 = "Я-я не могу... Я проиграла..."
104020-63 = "Не сдавайся!!!"
104020-64 = ""
104020-66 = ""
104020-67 = "Р-Рио?!"
104020-68 = "Так разве говорит гениальная хакерша, Химари?"
104020-69 = ""
104020-71 = ""
104020-72 = "Запуск последовательности самоуничтожения через 9 секунд... Запуск последовательности самоуничтожения через 9 секунд... Запуск последовательности самоуничтожения через 9 секунд..."
104020-73 = "О-Оно остановилось...?"
104020-74 = "Я принудительно остановила Утнапиштим с помощью функции подавления многомерного анализа."
104020-75 = "Но это лишь временная мера."
104020-76 = "Понятно. Ведь как только подавление многомерного анализа закончится, Ковчег снова рванёт вперёд..."
104020-77 = "Но мы хотя бы выиграли немного времени."
104020-78 = "За это время нужно что-нибудь придумать. Какой бы безупречной ни была его система управления, идеальных программ не существует. Должен быть способ её победить."
104020-79 = "В одиночку я не справлюсь. Мне нужна помощь."
104020-80 = "Никогда не думала, что услышу такие слова от тебя, Старшая сестра."
104020-81 = ""
104020-83 = ""
104020-84 = "Верно... Даже у столь мощной системы управления должен быть коммуникационный терминал, через который передаются команды."
104020-85 = "Если мы найдём и уничтожим этот терминал, принудительное соединение разорвётся."
104020-86 = "Не можем остановить взлом — тогда просто перережем провод? Это может сработать, но..."
104020-87 = "Да, это лишь временная мера. Наверняка есть резервный терминал, так что мы снова лишь выигрываем время."
104020-88 = "Но... если нам удастся освободить Утнапиштим от взлома и захватить контроль над вычислительным устройством Ковчега..."
104020-90 = "Мы сможем снова запустить последовательность самоуничтожения Ковчега Атрахасис."
104020-91 = "И подготовленная мной последовательность эвакуации тоже станет доступна."
104020-93 = "..."
104020-94 = "..."
104020-95 = "Чи! Сможешь определить местоположение коммуникационного терминала Ковчега?"
104020-97 = "Уже ищу. Анализирую объём трафика Ковчега... чтобы найти место с наибольшей концентрацией..."
104020-98 = "Мы можем отследить обращения, но найти физическое оборудование — это уже далеко за пределами наших возможностей!"
104020-99 = "Нам понадобятся чертежи и структурная схема."
104020-100 = ""
104020-102 = ""
104020-103 = "...Нужна помощь Инженерного отдела."
104020-105 = ""
104020-106 = "...Да, я слышала. Уже ищу."
104020-107 = "Я стараюсь изо всех сил... Мне нужно разобраться в чертежах Ковчега... Анализ трёхмерного сканирования структурной схемы — совсем не прогулка."
104020-108 = "Да, идём по порядку, начиная с зоны с самым большим объёмом трафика... П-Пожалуйста, подождите немного! Мы работаем так быстро, как можем!"
104020-111 = "Лидер..."
104020-112 = "Знаю. Я чувствую то же самое. Но..."
104020-113 = "Да. Давайте поверим в них и подождём."
104020-114 = "..."
104020-117 = ""
104020-118 = "*вздыхает*"
104020-119 = ""
104020-121 = ""
104020-122 = ""
104020-123 = "Хи-хи... Только не дрожи сейчас."
104020-124 = "К-Кто сказал, что я дрожу?!"
104020-127 = ""
104020-128 = ""
104020-131 = ""
104020-132 = ""
104020-134 = ""
104020-135 = ""
104020-136 = ""
104020-137 = ""
104020-138 = "*тяжело дышит* ... *тяжело дышит*"
104020-139 = "[s] «Нет, ещё не конец.»"
104020-140 = "Мы не сдадимся. Ни сейчас. Никогда."
104020-141 = "..."
104020-143 = "Нашла! Все сигналы взлома проходят через эту область!"
104020-144 = "Отправляю координаты, Чихиро! Это место называется Коридор Шар-Кали-Шарри!"
104020-145 = "Это сектор на самом дне Ковчега!!"
104020-147 = "Отличная работа. Получила. Преобразую в навигационные данные и отправляю."
104020-148 = "Если мы уничтожим его, принудительное соединение между Утнапиштимом и Ковчегом разорвётся!"
104020-150 = "Да. Готово. Нижний сектор Ковчега — Коридор Шар-Кали-Шарри. Нам нужно спуститься отсюда на тысячу двести метров."
104020-151 = "Но отключить систему безопасности этого сектора довольно сложно! Я объясню, как..."
104020-152 = "Оставь мне!"
104020-153 = ""
104020-155 = ""
104020-157 = "...Подтверждено!"
104020-158 = "Уже?!"
104020-159 = "Подытожу. Чтобы добраться до коммуникационного терминала в Коридоре Шар-Кали-Шарри на нижнем уровне Ковчега, сначала нужно открыть огромный барьер, преграждающий путь."
104020-160 = "Утнапиштим взломан, поэтому отсюда открыть барьер невозможно."
104020-161 = "Единственный способ — одновременно уничтожить два аварийных предохранителя в восточном и западном секторах Ковчега."
104020-162 = "Тогда барьер откроется примерно на пять секунд, и за это время мы сможем уничтожить коммуникационный терминал!"
104020-163 = "П-Пять секунд...?"
104020-164 = "Неважно! Нужно просто сделать это! Делимся на три команды: одна идёт на восток, другая — на запад, третья — на нижний уровень!"
104020-165 = "Добраться до восточной и западной сторон не проблема, но нижний уровень... Как нам преодолеть тысячу двести метров за это время?"
104020-167 = "...Хи-хи-хи-хи."
104020-168 = ""
104020-174 = "Фуука. Наконец настал этот момент."
104020-175 = "Что ещё за момент? Даже не думай о том, о чём, как мне кажется, ты думаешь."
104020-176 = "Именно об этом. Фуука, этот момент создан для того, чтобы ты продемонстрировала свой талант всему миру."
104020-178 = ""
104020-179 = ""
104020-180 = "Ты так долго развивала этот талант."
104020-181 = "Каждый день тренировалась и становилась лучше, несмотря на постоянные неудачи... Я знаю, сколько сил ты вложила..."
104020-182 = "Да! Пришло время высвободить этот талант! Эти усилия! Это мастерство! Это судьба!"
104020-183 = "Это вождение! ★"
104020-184 = "Верно! Именно в этом президент Клуба школьного питания лучше всех!"
104020-185 = "Ага, в такой ситуации ты специалист номер один, Фуука."
104020-186 = ""
104020-188 = ""
104020-189 = ""
104020-190 = "Харуна... Ты живёшь ради того, чтобы превращать мою жизнь в кошмар? В этом твоя цель?"
104020-191 = "Ты цепляешься не за те детали! Фуука, ты оказалась на этом корабле именно ради этого момента!"
104020-192 = "Не ради вашей идиотской космической еды?!"
104020-194 = "В общем! Разрушать — наша специальность! Мы справимся!"
104020-195 = "Мы всё тут разнесём! А вы идите открывать барьер!"
104020-197 = "Поняла. Займёмся."
104020-198 = "Мы возьмём аварийный предохранитель в восточном секторе!"
104020-199 = "Сейчас мы ближе всех к нему!"
104020-200 = "Разберёмся с ним побыстрее, а потом пойдём помогать Сенсею и Широко!"
104020-201 = "Я вас доставлю!"
104020-203 = ""
104020-204 = "Тогда мы берём западную сторону!"
104020-205 = "Отдел разработки игр?!"
104020-206 = "Д-Да! Мы можем добраться туда быстрее всех."
104020-207 = "Я вам доверяю. Покажу дорогу."
104020-209 = "Хорошо, идём!"
104020-210 = ""
104020-212 = ""
104020-213 = "Н-Не бросай меня!"
104020-214 = ""
104020-216 = ""
104020-218 = "Арис, ты в порядке?"
104020-219 = "Да! Никаких проблем!"
104020-220 = "О, и Меч Света: Атрахасис Super Nova пока ещё не уничтожен."
104020-221 = "...Так мы всё-таки остановились на этом названии?"
104020-222 = "Да. Химари, можешь на всякий случай проверить его?"
104020-223 = "Наверное, так будет лучше. Я проверю, но береги себя, Арис."
104020-224 = "Спасибо!"
104020-225 = ""
104020-228 = "Готова, Фуука?"
104020-230 = "*вздох* Как я вообще умудрилась и в это ввязаться?"
104020-231 = "Мы на борту!"
104020-232 = "Я так взволнована. Сейчас всё разнесём!"
104020-233 = "Если все здесь, поехали! Времени нет!"
104020-234 = "*вздох* Спуститься на тысячу двести метров...? Ладно, представим, что это просто очередная доставка..."
104020-235 = "Поехали, Фуука. Когда всё получится, покажешь нам большой палец!"
104020-236 = "Даже не пытайся заставить меня это делать. Иначе на этот раз я реально разозлюсь."
104020-238 = "Тогда ПОООЕХАЛИ!"
104020-239 = ""
104020-251 = "А-А-А-А-А!"
104020-253 = "Следующий эпизод; Сопротивление 2"
