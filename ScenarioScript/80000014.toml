[translation]
80000014-1 = "Ненамеренный подарок"
80000014-2 = "Офис Шале"
80000014-5 = "Доброе утро, Сенсей."
80000014-6 = "Простите за опоздание. Поезд задержался."
80000014-7 = "[s] «Ничего страшного. Всего пять минут.»"
80000014-8 = "Чтобы загладить вину, я купила это по дороге на станции."
80000014-9 = ""
80000014-11 = ""
80000014-13 = "Набор шоколада. Надеюсь, вам понравится."
80000014-14 = "[s] «Вот это сюрприз...»"
80000014-15 = "Я подумала, что это будет неплохо, ведь вы всегда обо мне заботитесь."
80000014-16 = "К тому же вы никогда не были жаворонком — особенно когда засиживаетесь допоздна за работой."
80000014-17 = "Я подумала, что кофеин и теобромин в шоколаде помогут вам взбодриться."
80000014-18 = "Если честно, это была импульсивная покупка. Перед станцией как раз продавали самые разные наборы шоколада. Интересно, почему..."
80000014-19 = "А-А? Потому что сегодня День святого Валентина?"
80000014-20 = "Т-Точно. Сегодняшняя дата... Значит, шоколад, который я вам дала, получается валентинский..."
80000014-21 = "Клянусь, я не знала! Я вовсе не имела ничего такого в виду, когда его давала!"
80000014-22 = "То есть не то чтобы вы мне НЕ нравились, но я не имела в виду, что вы мне НРАВИТЕСЬ вот так, и я...! Я...!"
80000014-23 = "Я-Я просто хочу сказать, что не имела это в виду!"
80000014-24 = "Не могу винить вас, если вы так это восприняли... да и не конец света, конечно."
80000014-25 = "Но что я скажу, если остальные из оперативной группы узнают?!"
80000014-26 = "Они же начнут меня дразнить: «Ого, Аяна. А ты времени не теряешь.#nС самого утра тайком пошла делать первый шаг!»"
80000014-27 = "П-Пожалуйста, пусть это останется между нами. Нет, так звучит ещё подозрительнее! Можете рассказать, если хотите, только не... Угх, я уже сама не знаю!"
80000014-29 = "Я изо всех сил успокаивал смущённую Аяну, а потом мы вместе съели шоколад и хорошенько посмеялись."
