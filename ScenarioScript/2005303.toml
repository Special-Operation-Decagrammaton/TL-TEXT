[translation]
2005303-1 = "Девушка-ниндзя стесняется!"
2005303-2 = "Торговый квартал Хяккияко"
2005303-3 = "Ваше платье готово, мисс."
2005303-4 = "Ох...!"
2005303-5 = "Идеально...!"
2005303-6 = "Даже не видно, где оно было порвано!"
2005303-7 = "Эта женщина настоящий профессионал. Какая потрясающая работа!"
2005303-8 = "[s] «Рад, что всё получилось.»"
2005303-9 = "Фуфу, но мы ведь не можем вот так закончить нашу прогулку!"
2005303-10 = "Одну минутку, Почтенный Сенсей! Я мигом вернусь!"
2005303-11 = ""
2005303-13 = ""
2005303-15 = "Прошло пять минут..."
2005303-16 = "Почтенный Сенсей!"
2005303-17 = ""
2005303-18 = "Ну что, двигаемся дальше!"
2005303-19 = "[ns] «Ты переоделась в платье?!»"
2005303-20 = "Фуфу, конечно."
2005303-21 = "Одежда по своей природе должна быть «практичной»..."
2005303-22 = "Значит, чтобы проверить качество ремонта, я должна как можно скорее надеть платье и испытать его, верно?"
2005303-23 = "[s] «В этом есть смысл!»"
2005303-24 = "Но! Просто надеть его недостаточно."
2005303-25 = "Мне нужно попробовать в нём самые разные позы."
2005303-26 = "А ещё походить, побегать и попробовать поднимать тяжёлые предметы...!"
2005303-27 = "Нужно проверить, выдержит ли починка мои повседневные задачи ниндзя!"
2005303-28 = "[s] «Ты не совсем неправа...»"
2005303-29 = "Убедила вас, Почтенный Сенсей?"
2005303-30 = "Отлично! Потому что я уже придумала самый эффективный и оптимальный план!"
2005303-31 = "Пока мы идём по этой улице, пройдём мимо магазинов с самыми разными товарами!"
2005303-32 = "В том числе... моего любимого магазина! Возможно, вы помните, как мы уже ходили туда вместе!"
2005303-33 = "В общем, пройдём по улице, закончим покупки и уйдём!"
2005303-34 = "Так мы сразу выполним требования по ходьбе, бегу и поднятию тяжестей! Всё за один заход!"
2005303-35 = "А ещё я слышала, что в некоторых магазинах как раз появился новый мерч ниндзя... то есть ИНСТРУМЕНТЫ ниндзюцу, да?"
2005303-36 = "Разве это не удивительно? Значит, всё больше людей узнаёт о ниндзя! Мы — культурный феномен!"
2005303-37 = "[s] «Так вот какова была твоя настоящая цель!»"
2005303-38 = "О? Вы ведь всё равно пойдёте со мной, правда?"
2005303-39 = "[s] «Я этого ещё не говорил...!»"
2005303-40 = "Как и ожидалось от Почтенного Сенсея! Идём!"
2005303-41 = ""
2005303-43 = ""
2005303-46 = "Торговый район мерча Хяккияко"
2005303-47 = "В итоге Мичиру протащила меня через весь торговый район."
2005303-48 = "Так, помните: нельзя терять концентрацию!"
2005303-49 = "Хотите верьте, хотите нет, но иногда разные магазины ставят совершенно разные цены на один и тот же товар!"
2005303-50 = "Поэтому важно закалять силу духа. Запоминайте каждый ценник, который увидите, чтобы потом сравнить цены."
2005303-51 = "...Разумеется, это не относится к мерчу ниндзя... то есть инструментам ниндзюцу."
2005303-52 = "Их запасы настолько малы, а сами вещи настолько редкие и драгоценные, что сравнивать цены незачем..."
2005303-53 = "Но всё же... Хм?"
2005303-54 = "Нашла! Сюрикен-матрёшка!"
2005303-55 = "Смотрите, это особый сюрикен, внутри которого находится сюрикен поменьше!"
2005303-56 = "Его невозможно заблокировать! Даже если кто-то успеет поймать его после броска, наружу вылетит ещё один крошечный сюрикен и ударит прямо в лицо."
2005303-57 = "Возможно, вы видели такое в ранних работах Кайгенвуфвуф. Очень историческая вещь."
2005303-58 = "А рядом... огненная дымовая бомба ниндзя!"
2005303-59 = "Этот важнейший инструмент ниндзюцу при взрыве выпускает вместо дыма пламя — одновременно атакует и перекрывает видимость!"
2005303-60 = "[s] «И чем это отличается от зажигательного оружия...?»"
2005303-61 = "Ох, Сенсей, не стоит беспокоиться о таких мелочах."
2005303-62 = "Так, а здесь у нас... голографический свиток древнего ниндзя?!"
2005303-63 = "У них даже ТАКОЕ есть в наличии?"
2005303-64 = ""
2005303-66 = ""
2005303-67 = ""
2005303-68 = ""
2005303-70 = "Некоторое время я ходил за Мичиру и разглядывал мерч ниндзя... то есть ИНСТРУМЕНТЫ ниндзюцу."
2005303-72 = "Няха... Было весело..."
2005303-73 = "Хотя позволить себе я смогла только сюрикен, потому что уже потратила столько денег на ремонт платья..."
2005303-74 = "Но гулять с вами было так весело, Почтенный Сенсей."
2005303-75 = "И, эм..."
2005303-76 = "Спасибо... что были со мной, Сенсей..."
2005303-77 = "[s] «Не за что! Мне тоже было весело.»"
2005303-78 = "П-Правда...?"
2005303-79 = "Хи... Хи-хи..."
2005303-80 = "Н-Но всё равно! Мне немного... неловко заканчивать нашу прогулку без нормальной благодарности!"
2005303-81 = "Вот!"
2005303-82 = "[s] «Разве это не... игрушка из капсулы?»"
2005303-83 = "Да, для вас! Я достала её из автомата!"
2005303-84 = "...Из единственного на этой улице автомата с капсулами ниндзя!"
2005303-85 = "Хотя я понятия не имею, что внутри..."
2005303-86 = "...Но в этом ведь часть удовольствия, правда? Сюрприз?"
2005303-87 = "Ну что, откроем?"
2005303-89 = "...А?"
2005303-92 = "― [log=미치루 드레스]Внутри... кольцо! Что?![/log][wa:3930]"
2005303-94 = "― [log=미치루 드레스]Р-Разве оно не потрясающее с украшением-сюрикеном?! Ого![/log][wa:3140]"
2005303-97 = "[ns] «Мне примерить?»"
2005303-98 = "― [log=미치루 드레스]...Хм? Э? Почтенный Сенсей? Вы его надеваете...?[/log][wa:2780]"
2005303-100 = "― [log=미치루 드레스]Н-Нет, не то чтобы это что-то значило...![/log][wa:1210]"
2005303-103 = "― [log=미치루 드레스](А? Подарить кому-то кольцо...?)[/log][wa:3360]"
2005303-105 = "― [log=미치루 드레스](Разве это не... почти признание?!)[/log][wa:2360]"
2005303-108 = "― [log=미치루 드레스]П-Погодите, Почтенный Сенсей![/log][wa:1050]"
2005303-110 = "― [log=미치루 드레스]Я точно не делала это специально... То есть, ну...![/log][wa:1670]"
2005303-113 = "[ns] «Успокойся, Мичиру...!»"
2005303-114 = "― [log=미치루 드레스]Ух, ааа...![/log][wa:2880]"
2005303-117 = "Э-Э-Это...!"
2005303-118 = "Н-Ну...!"
2005303-119 = "Я-Ях!"
2005303-120 = "*бум*"
2005303-121 = "[ns] «...»"
2005303-123 = "К тому времени, как дым рассеялся, Мичиру уже исчезла."
2005303-124 = "А игрушечное кольцо из капсулы почему-то оказалось у меня на пальце."
