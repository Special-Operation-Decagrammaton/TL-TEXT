[translation]
51225-7 = "Mmm... Onde estou...?"
51225-9 = "Ahá, já acordou?"
51225-10 = "Quem é você...?"
51225-11 = "Ora, ora, que pena...#nJá se esqueceu de mim?"
51225-12 = "Eu sou... a sua representante."
51225-13 = "Uma contadora de histórias... feita para transmitir os seus \"sentimentos\" a todos."
51225-14 = "Sentimentos...?"
51225-19 = "\"Esses seus sentimentos — não gostaria de devolvê-los todinhos, na mesma moeda — não acha?\""
51225-24 = "Não... pode ser..."
51225-25 = "Olhe, olhe, veja só para cá.#nNão é uma paisagem absolutamente deslumbrante?"
51225-26 = "Hã...?"
51225-44 = "Isso é... Por que o local do festival está...!"
51225-45 = "Ahahaha! Não é maravilhoso?"
51225-46 = "Ah, ah! Que cena sublime...!#nEu estou adorando tanto isso."
51225-47 = "Por que... fazer uma crueldade dessas...!"
51225-48 = "Ora, ora, não diga uma coisa tão triste assim."
51225-49 = "Você fala como se eu tivesse feito tuuudo isso sozinha."
51225-50 = "...Hã?"
51225-51 = "Eu apenas transmiti os sentimentos da Senhorita Sacerdotisa no seu lugar, sabia?"
51225-52 = "Não está vendo?#nAquilo bem na sua frente."
51225-53 = "Aquilo que você expeliu..."
51225-58 = "Os \"sentimentos\" — que transbordaram do fundo do seu peito, sabe?"
51225-59 = "...!!"
51225-65 = "Ah... ah..."
51225-66 = "Isso é... meu..."
51225-67 = "Um sentimento... nascido de mim?"
51225-73 = "Ngh...!"
51225-76 = "Só de olhar já dá para sentir, não é?"
51225-77 = "A fumaça que redemoinha lá dentro... as chamas que se erguem."
51225-78 = "Sentimentos profundos e intensos — que tomam conta de todo o corpo!"
51225-80 = "Tudo isso... é graças a você, Senhorita Sacerdotisa."
51225-82 = "Graças... a mim...?"
51225-84 = "Sim, sim. Eu entendo perfeitamente."
51225-85 = "Ninguém dá ouvidos à minha voz... ninguém tenta me entender...!"
51225-86 = "Os outros só pisoteiam os meus sentimentos, a minha voz e até os meus desejos."
51225-87 = "Só impõem os próprios desejos e ambições, dizendo para fazer a escolha certa."
51225-88 = "Por isso — doía tanto, não é? Você ficou exausta, não foi?"
51225-89 = "Ah... uh..."
51225-91 = "Por isso... você quis jogar tuuudo para o alto, não foi?"
51225-92 = "Para aquelas que não ouvem a sua opinião, que sequer lhe dão atenção — para quem despejava essas palavras sobre você —"
51225-96 = "[log][ff4444]<— Que tudo queime de uma vez>[-][/log]"
51225-98 = "Você... pensou isso, não pensou?"
51225-100 = "E-Eu..."
51225-102 = "Ahahaha!"
51225-103 = "Aquilo é uma efígie sem rosto, nascida na fenda entre essas suas memórias e sentimentos."
51225-104 = "Se fôssemos dar um nome..."
51225-105 = "Vejamos... que tal chamarmos de \"Efígie Sem Rosto\"?"
51225-106 = "Com aquilo, bem como você desejou... Hyakkiyako inteira será reduzida a cinzas, do começo ao fim!#nSim! Uma paisagem bela e efêmera!"
51225-107 = "Sim, sim! Vai ser uma obra de uma beleza verdadeiramente sublime."
51225-108 = "Ah —"
51225-115 = "A cidade está em chamas."
51225-116 = "Chamas escarlates rastejando pelo chão."
51225-117 = "O grito de alguém ecoando à distância."
51225-120 = "Tudo isso — é culpa minha."
51225-128 = "Só porque, mesmo que por um instante, eu cheguei a pensar algo assim."
51225-129 = "Porque sonhei com a Hyakkaryouran e fugi do meu verdadeiro dever —"
51225-133 = "...Um castigo que caiu sobre mim por imaginar uma versão minha na Hyakkaryouran e tentar interpretar esse papel."
51225-136 = "(...Entendi)"
51225-137 = "(É tudo culpa minha...)"
51225-140 = "Aquilo é... algo que nasceu de mim."
51225-150 = "Ora, ora? Desmaiou?"
51225-151 = "Que sem graça. E olha que o banquete mal começou."
51225-152 = "Bem, não tem problema. Senhorita Sacerdotisa, o seu papel já terminou.#nA partir daqui, é a minha vez."
51225-153 = "Os atores e o palco já estão prontos —"
51225-154 = "Finalmente, aquilo que a Senhora Kokuriko desejava..."
51225-155 = "O meu próprio \"Hyakumonogatari\"...!"
51225-157 = "Está prestes a se completar —"
51225-163 = "[ns] \"Já chega, Shuro!\""
51225-169 = "Devolva a Yukari...!"
51225-173 = "...Que corta-clima, hein?"
51225-177 = "Próximo;Palavras Falsas"
