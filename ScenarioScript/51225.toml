51225-36 = ""
51225-37 = ""
51225-43 = ""
51225-44 = "Улицы горят? К-Как... вы это сделали?"
51225-45 = "Ха-ха-ха! Знаю! Вдохновляет! Прекрасно!"
51225-46 = "Настоящее воплощение утончённости."
51225-47 = "Как... вы могли? Зачем вы это сделали?"
51225-48 = "Пожалуйста, не разочаровывайте меня такими словами."
51225-49 = "Ведь мы сделали это вместе."
51225-50 = "...Что?"
51225-51 = "Я лишь исполнила то, чего вы в глубине души желали."
51225-52 = "Оглянитесь вокруг!"
51225-53 = "Всё это — ваше!"
51225-54 = ""
51225-56 = ""
51225-58 = "Все ваши эмоции, вырвавшиеся из самой души!"
51225-59 = "...!!"
51225-60 = ""
51225-64 = ""
51225-65 = "...Ах."
51225-66 = "Эти разрушения... мои?"
51225-67 = "Все эти ужасные эмоции исходили от меня?"
51225-68 = ""
51225-70 = ""
51225-71 = ""
51225-73 = "Ух...!"
51225-74 = ""
51225-76 = "Вы ведь чувствуете, да?"
51225-77 = "Топливо под всем этим пламенем и дымом..."
51225-78 = "Всё это питают гнев и ненависть, одиночество и страх."
51225-80 = "И без вас, мико, я бы не справилась."
51225-82 = "Без... меня?"
51225-84 = "Да. Не переживайте. Я поняла, что вы чувствовали."
51225-85 = "Никто не считал, что ваши слова что-нибудь значат."
51225-86 = "Они растоптали ваши чувства и лишили вас всякой возможности решать за себя."
51225-87 = "Что вы слышали всю жизнь? Исполни долг. Соответствуй ожиданиям. Все, абсолютно все использовали вас ради собственных целей."
51225-88 = "Бедняжка. Разве это не казалось ужасно несправедливым? Разве вы не устали?"
51225-89 = "Я... эм..."
51225-91 = "Представьте, каково наконец стать свободной."
51225-92 = "Вы больше не будете скованы ожиданиями, освободитесь от тех, кто принижал и угнетал вас."
51225-93 = ""
51225-96 = "[log][ff4444]Я хочу, чтобы всё сгорело.[-][/log]"
51225-98 = "Разве не так вы чувствуете?"
51225-100 = "Я... Я..."
51225-102 = "Ха-ха-ха! Хорошо, хорошо!"
51225-103 = "Вот воплощение вашей ненависти! Вашего отчаяния!"
51225-104 = "Как бы его назвать..."
51225-105 = "А! Назовём его Безликим Каташиро. Ваш собственный представитель."
51225-106 = "С его силой вы сможете воздать всем, кто причинил вам боль, по заслугам. Пусть Хяккияко ГОРИТ!"
51225-107 = "Вот сама суть утончённости!"
51225-108 = "Ах."
51225-115 = "Улицы горят."
51225-116 = "Я слышу далёкий голос. Он кричит в агонии, пока пламя пожирает его плоть."
51225-117 = "Улицы залиты багрянцем."
51225-120 = "Виновата... я."
51225-121 = ""
51225-128 = "Мои наивные идеалы породили разрушение."
51225-129 = "Я пыталась сбежать от ожиданий, от своих обязанностей. Гналась за мечтой в Хяккарёран."
51225-130 = ""
51225-133 = "Это моё наказание за то, что осмелилась мечтать. Хяккарёран никогда не принадлежал мне."
51225-135 = ""
51225-136 = "(Ах... Теперь я понимаю.)"
51225-137 = "(Мне никогда не позволялось мечтать.)"
51225-140 = "Улицы горят моим пламенем. Как я вообще смогу искупить это отчаяние?"
51225-141 = ""
51225-149 = ""
51225-150 = "Уааа. Она что, просто потеряла сознание?"
51225-151 = "И именно когда вечеринка наконец начала набирать обороты."
51225-152 = "Неважно. Всё равно она уже сделала то, что мне было нужно."
