51225-12 = "Считайте меня своим представителем!"
51225-13 = "Я ваш бард! Я доношу ваши чувства до масс!"
51225-14 = "Мои... чувства? О чём вы?"
51225-15 = ""
51225-17 = ""
51225-19 = "Заставить их страдать так же, как страдали вы!"
51225-20 = ""
51225-23 = ""
51225-24 = "Я не желаю..."
51225-25 = "Посмотрите на этот хаос, мико. Разве он не прекрасен?"
