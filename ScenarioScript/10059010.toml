[translation]
10059010-1 = "Episode 1;An Invitation from the Art Council"
10059010-2 = "[ns] \"Wait... the Student Council President of Wildhunt?\""
10059010-3 = "Yes, that is correct."
10059010-4 = "I have been looking forward to this day ever since that day I will never forget."
10059010-5 = "I wonder what kind of feelings would arise when facing the culprit who caused such a stir at the academy... #nThat is what Manami-sama said, but that's a secret."
10059010-6 = "Fufu, the Magic Circle Incident was... yes."
10059010-7 = "It left quite an impression on me."
10059010-8 = "[s] \"I apologize for the trouble I caused back then.\""
10059010-9 = "Do not worry. Manami-sama is a very generous person."
10059010-10 = "We were in the middle of introductions. #nThis person who has been providing supplementary information is Kanon Kuonji."
10059010-11 = "She is the secretary who records everything for the Art Council."
10059010-12 = "Yes. I record everything."
10059010-13 = "I plan to record this meeting as well, right down to the number of times you blink while looking at us, Sensei."
10059010-14 = "[s] \"Wait, even that?\""
10059010-15 = "Recording everything in detail. That is my specialty. #nAnd the special ability that makes it possible is—"
10059010-16 = "The \"Lake of Memories.\""
10059010-17 = "The Lake of Memories—it is the record of all creation that sleeps behind her eyepatch."
10059010-18 = "It is an image beyond the boundary, a place where only I am permitted to dip my feet."
10059010-22 = "[ns1] \"…………。\"\n[ns2] (I should be extra careful today...)"
10059010-28 = "Oh my, I have talked for too long. It seems the performance is about to begin."
10059010-29 = "Let us end our conversation here. #nIt is bad manners to chat during a performance."
10059010-30 = "Now then, please enjoy the show."
10059010-33 = "(And so, I watched the ballet gala concert with Manami and Kanon.)"
10059010-34 = "(The fantastical dancing of beautiful ballerinas wearing tiaras, #nharmonized with sweet music—)"
10059010-35 = "(It was truly a stage of dreams and fantasy.)"
10059010-43 = "Fufu, the gala concert format is truly magnificent, isn't it?"
10059010-44 = "It is, so to speak, a festival held on stage."
10059010-45 = "A dream stage that gathers the most brilliant moments from many works to captivate the audience."
10059010-46 = "Of course, regular performances have their own beauty in that you can experience the full story."
10059010-47 = "...Now, a question for you."
10059010-48 = "Sensei, which do you prefer: a regular performance or a gala concert?"
10059010-49 = "[s3] \"I think I prefer a regular performance where I can enjoy the story to the end.\"\n[s4] \"I think I prefer a gala concert where I can enjoy a wide variety of highlights.\""
10059010-52 = "Hmm, I see."
10059010-53 = "Manami-sama. I have now grasped Sensei's preferences."
10059010-57 = "[ns] \"Was that the wrong answer...?\""
10059010-58 = "Not at all."
10059010-59 = "There is no great meaning in which one you chose."
10059010-60 = "Because the scenery one sees differs for every person. There is no right answer in art."
10059010-61 = "[s] \"I see... Which one do you like, Manami?\""
10059010-62 = "Let me see... If I had to choose, perhaps a regular performance."
10059010-63 = "From beginning to end. I like being able to follow the story through beautiful dancing."
10059010-64 = "Among them, I am particularly fond of a work called \"The Steadfast Tin Soldier.\""
10059010-65 = "The original is a sad story about a one-legged toy soldier and a ballerina doll."
10059010-66 = "But once, it was adapted into a happy ending and performed."
10059010-67 = "The structure of turning a tragedy into a comedy, combined with the beautiful dancing, is truly captivating. #nIt has even been praised by critics."
10059010-68 = "[s] \"I would like to see that too.\""
10059010-69 = "Manami-sama. That work is—"
10059010-70 = "Yes. I know."
10059010-74 = "Unfortunately, it will be difficult to see it in a theater for the time being."
10059010-75 = "The ballerina who conceived the work and played the lead retired due to an ankle injury."
10059010-76 = "...It is ironic. #nTo suffer such an injury in a story about a one-legged soldier."
10059010-77 = "Since then, no one else has been able to dance it, and the performance has effectively been suspended."
10059010-78 = "[s] \"That is... very unfortunate.\""
10059010-82 = "...Yes."
10059010-83 = "Nothing in this world is eternal."
10059010-84 = "Even the stars shining in the night sky will eventually lose their light..."
10059010-89 = "That is why I preserve the shining moments in a museum."
10059010-90 = "I also have a recording of the final performance of \"The Steadfast Tin Soldier\" in my collection."
10059010-91 = "I would love to watch it with you someday."
10059010-92 = "If the opportunity arises, that is."
10059010-93 = "[s] (It doesn't sound like she'll show it to me easily...)"
10059010-94 = "Fufu, it has been a long time since I've talked with someone from the outside like this."
10059010-95 = "Thanks to you, I had a pleasant time."
10059010-96 = "Interpretation... is unnecessary. This means I truly enjoyed myself. #nPlease do not misunderstand."
10059010-97 = "Yes. At this rate, it seems safe to lower our guard against you a little, Sensei."
10059010-98 = "[s] \"So you were on guard after all...\""
10059010-99 = "We cannot easily trust someone who caused such a stir at the academy. #n...That said, a few points have been added to your score."
10059010-100 = "So, I would like to offer you an opportunity to earn more points... #nWhat do you think?"
10059010-101 = "An opportunity to redeem your honor—would you not like that?"
10059010-102 = "[s] \"Please, tell me anything...!\""
10059010-103 = "I do not dislike that positive attitude."
10059010-104 = "Now, Secretary Kanon. The item we prepared."
10059010-109 = "[ns] \"Is this... an invitation?\""
10059010-110 = "Yes. It is an official invitation issued in the name of the Council President."
10059010-111 = "[s5] \"The fact that you had this prepared means—\"\n[s6] \"You knew I was coming here?\""
10059010-114 = "Fufu. I just came to enjoy today's performance."
10059010-115 = "I always carry invitations with me, just in case."
10059010-116 = "You have lost the points you just gained with that comment. What a pity."
10059010-117 = "[s] \"Ugh...!\""
10059010-118 = "In any case, I have given you the invitation. #nLet us discuss the rest in an official setting."
10059010-119 = "I am sure it will be a fun time sharing our sensibilities."
10059010-121 = "(What kind of conversation will we have—)"
10059010-122 = "(The next day, I arrived with a hint of anxiety.)"
10059010-127 = "..."
10059010-128 = "(A student exuding an overwhelming sense of pressure was standing in front of the main gate.)"
10059010-129 = "Oh? An outsider? What's wrong?"
10059010-130 = "[s] \"I'm [USERNAME] from Schale...\""
10059010-131 = "Ah, so you're the one."
10059010-132 = "...You look a bit nervous."
10059010-133 = "Is this your first time meeting an executive of the Dormitory Supervisory Team?"
10059010-134 = "[s] \"I think I've met Miria before.\""
10059010-135 = "Miria. She was cute, wasn't she?"
10059010-136 = "She is a very excellent member."
10059010-137 = "Ah, I'm just talking about others. I'm Koshiro Sayo."
10059010-138 = "I am the Dormitory Supervisory Captain of Wildhunt."
10059010-139 = "[s] (I knew she wasn't just anyone...!!)"
10059010-140 = "I was told by the Council to welcome you today, Sensei."
10059010-141 = "I've also received reports about the Magic Circle Incident."
10059010-142 = "I was away, but it would have been better if I had met you back then."
10059010-143 = "I really love having long talks in the reflection room."
10059010-144 = "[s] \"I, I see...\""
10059010-145 = "For now, I'll skip the luggage inspection."
10059010-146 = "An officially invited guest wouldn't bring anything suspicious, right?"
10059010-147 = "Isn't that so?"
10059010-148 = "[s] \"Of course!\""
10059010-149 = "Well, it doesn't really matter either way."
10059010-150 = "If you had brought something, it would have been a good opportunity to have that talk we couldn't have back then."
10059010-151 = "[s] \"I don't have anything, so don't worry!\""
10059010-152 = "Yeah. I'll believe you."
10059010-153 = "Then, this way. Everyone is waiting."
10059010-159 = "The Council is in the main building."
10059010-160 = "Is this your first time entering here, Sensei?"
10059010-161 = "You don't have to be nervous."
10059010-162 = "If you do something bad, you'll get scolded by me... but you're a good kid, right, Sensei?"
10059010-163 = "[s] \"O, of course!\""
10059010-168 = "Council President. I've brought Sensei."
10059010-169 = "Thank you for your hard work. Please, come in."
10059010-173 = "There you go. She said you can come in."
10059010-178 = "[ns] \"Oh...\""
10059010-179 = "I have been waiting for you, Sensei."
10059010-180 = "Welcome to the Art Council—the heart of Wildhunt."
10059010-181 = "Look. Hanging on the wall is the academy's representative work, fitting for this place—"
10059010-182 = "The original of \"The Image of Creation.\""
10059010-183 = "To carry this work on one's back means to carry the entire academy."
10059010-184 = "We, the Council, operate the academy with this heavy responsibility in our hearts."
10059010-185 = "Now, let me introduce the officers who carry that burden."
10059010-186 = "First, Secretary Kanon to my left."
10059010-189 = "Greetings. It has been since yesterday."
10059010-190 = "I pray that today, Sensei will be able to earn a high score from Manami-sama."
10059010-193 = "Fufu... Oh, Kanon-sama..."
10059010-194 = "Greetings. I am Unrin-in Urara. #nI serve as the Vice President of the Council."
10059010-195 = "I hope this meeting will remain in your memory as beautifully as a fragrant blooming flower."
10059010-199 = "[ns] \"Wait... is that the scent of roses...?\""
10059010-200 = "Fufu... It seems the scent has lingered on me. #nI take care of the rose garden on a daily basis."
10059010-201 = "...Ahem. Sensei, I am happy to meet you. Welcome to the Council."
10059010-202 = "[s] \"Nice to meet you.\""
10059010-205 = "Now, Sensei. Thank you for coming."
10059010-206 = "I would like to offer you a small token of hospitality."
10059010-207 = "Vice President Urara."
10059010-212 = "Are you aware of this, Sensei?"
10059010-213 = "It is the premium milk that has been popular lately."
10059010-214 = "It is reputed to be not only delicious but also good for your health. #nI hope it suits your palate..."
10059010-219 = "[ns7] (I feel like negative ions are coming from Urara...)\n[ns8] \"Thank you. I'll have some.\""
10059010-227 = "[ns] \"Delicious... Maybe I should keep some at Schale.\""
10059010-229 = "Vice President Urara supports me while fulfilling various duties in academy management."
10059010-230 = "Today's hospitality was also prepared by Vice President Urara. #nPlease, feel free to enjoy it."
10059010-234 = "I will explain... It means this is the Vice President's kindness that I cherish. #nIf you leave any, it will be a significant point deduction."
10059010-238 = "N-no... not at all."
10059010-239 = "If that were the case, it would mean I failed to understand Sensei's preferences..."
10059010-240 = "[s9] \"No, it's very delicious.\"\n[s10] \"I'll gratefully accept it.\""
10059010-243 = "Fufu... This feeling welling up inside me is like... #nflowers rejoicing in the blessing of rain."
10059010-244 = "Now that the greetings are over, shall we get to the main point?"
10059010-245 = "First, the reason why I called for you, Sensei."
10059010-246 = "Recently, the activities of a disturbing force have been confirmed within the academy."
10059010-247 = "If it were a problem between students, we would have handled it internally, but this time the situation is a bit different."
10059010-248 = "To resolve this issue, the Wildhunt Art Council formally requests the cooperation of Sensei from Schale."
10059010-252 = "Please lend us your strength to uncover the darkness lurking in the academy."
