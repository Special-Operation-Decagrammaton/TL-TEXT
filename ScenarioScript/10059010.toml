[translation]
10059010-1 = "Episode 1;Invitiation From the Assembly of Arts"
10059010-2 = "[ns] \"Does that mean... You're Wildhunt's student council president?\""
10059010-3 = "Indeed I am."
10059010-4 = "Ever since that unforgettable day, I've waited with bated breath for the day we#ncould meet thus."
10059010-5 = "Manami-sama once mentioned that she was curious what sort of emotions would arise upon meeting the culprit of such a disturbance... This was a secret, by the#nway."
10059010-6 = "Heheh. Indeed, that incident with the magic circle..."
10059010-7 = "I'd say it left quite a deep impression."
10059010-8 = "[s] \"I must've caused you a lot of trouble.\""
10059010-9 = "You needn't worry. Manami-sama is a magnanimous person."
10059010-10 = "Ah yes, I believe we were in the middle of introductions still. #nThis individual who has been interjecting is Kuonji Kanon."
10059010-11 = "She is the secretary of the Assembly of Arts, recording all things pertaining to the Assembly."
10059010-12 = "Indeed. I am the one who records all that is."
10059010-13 = "I intend to chronicle everything, from our current encounter to the very number of#ntimes you have blinked since then."
10059010-14 = "[s] \"Huh? You're recording THAT too?\""
10059010-15 = "Recording all things down to their every minute detail—that is my expertise. #nAnd I am in possession of a special ability that makes it all possible."
10059010-16 = "The Lake of Memories."
10059010-17 = "It slumbers deep beneath this eyepatch; a record of all things in creation."
10059010-18 = "A mental landscape residing beyond the boundary, where only I am permitted to#nset foot."
10059010-22 = "[ns1] \"......\"\n[ns2] (Yeah, I think I should be extra careful today...)"
10059010-28 = "Oh dear, it seems we've gone on a little too long.#nThe performance is about to begin."
10059010-29 = "Let us conclude our conversation here. It would be undecorous to whisper among ourselves whilst the performance is underway."
10059010-30 = "Well then, I bid you a most pleasant viewing."
10059010-33 = "(I appreciated the ballet gala concert alongside Manami and Kanon.)"
10059010-34 = "(The mystical dance of the beautiful tiara-wearing ballerinas blended#nharmoniously with the rapturous music.)"
10059010-35 = "(It was truly a stage of dreams and fantasy.)"
10059010-43 = "Heheh. The gala concert is truly a wonderful format."
10059010-44 = "It is, in a sense, a festival upon a stage."
10059010-45 = "A phantasmagorical stage that gathers only the most brilliant moments from all#nmanners of works to captivate its audience."
10059010-46 = "However, it must be stated that ordinary performances posses their own beauty as#nwell, for they allow you to savor the tales they tell in their entirety."
10059010-47 = "...Now let me pose a question."
10059010-48 = "What do you fancy more? An ordinary performance or a gala concert?"
10059010-49 = "[s3] \"Probably an ordinary performance, since you can enjoy the full story.\"\n[s4] \"Probably a gala concert, since you can enjoy a wide variety of highlights.\""
10059010-52 = "Hmm. I see."
10059010-53 = "Manami-sama, I believe I have an understanding of Sensei's tastes now."
10059010-57 = "[ns] \"Was that a bad answer...?\""
10059010-58 = "Not at all."
10059010-59 = "The choice itself carries no greater significance."
10059010-60 = "On the whole, there are as many ways to view the world as there are people, for#nthere is no correct answer in art."
10059010-61 = "[s] \"I see... Then which one do you prefer?\""
10059010-62 = "I wonder... If I must choose, then I would say an ordinary performance, perhaps."
10059010-63 = "I appreciate how an entire story can be told through beautiful choreography, from opening act to curtain call."
10059010-64 = "My favorite of them all is the tale of \"The Steadfast Tin Soldier.\""
10059010-65 = "The original tells of a tragic story spun by a one-legged toy soldier and a ballerina doll."
10059010-66 = "However, there once was a production that adapted it to have a happy ending."
10059010-67 = "Oh how it transformed tragedy into comedy. In tandem with its beautiful#nchoreography, it truly was captivating. Even the critics praised it thus."
10059010-68 = "[s] \"You're making me want to watch it too.\""
10059010-69 = "Manami-sama. That work was..."
10059010-70 = "Indeed, I am aware."
10059010-74 = "Unfortunately, you will find it most difficult to watch in a theater nowadays."
10059010-75 = "The ballerina who conceived the piece and performed as its lead has retired due to#nan ankle injury."
10059010-76 = "...How ironic. #nTo suffer such an injury while performing a story about a one-legged soldier."
10059010-77 = "Since then, all further performances have effectively stalled, as there have been#nnone other who could perform its choreography."
10059010-78 = "[s] \"That's... really a shame.\""
10059010-82 = "...Indeed."
10059010-83 = "Nothing in this world is eternal."
10059010-84 = "Even the stars shining in the night sky will one day lose their brilliance."
10059010-89 = "That is the very reason why I choose to preserve those instants of brilliance within my museum."
10059010-90 = "A recording of the final performance of \"The Steadfast Tin Soldier\" is also within#nmy collection."
10059010-91 = "Perhaps one day, we might appreciate it together."
10059010-92 = "If the opportunity so arises."
10059010-93 = "[s] (Doesn't seem like she'll let me see it easily...)"
10059010-94 = "Heheh. It has been a while since I've held such a conversation with a stranger."
10059010-95 = "I've truly enjoyed our time together."
10059010-96 = "An explanation… is unnecessary. What she means is that she had a genuinely#npleasant time, plain and simple. I needn't explain more."
10059010-97 = "Indeed. It should be fine now to relax my vigilance towards you just a little."
10059010-98 = "[s] \"So you WERE suspicious of me...\""
10059010-99 = "How could I trust someone who caused a disturbance of such scale so easily? #n...Nonetheless, you did manage to gain a small number of points in your favor."
10059010-100 = "But perhaps I should give you an opportunity to earn even more points... #nWhat do you think?"
10059010-101 = "A chance to restore your honor—wouldn't you like that?"
10059010-102 = "[s] \"Tell me what to do and I shall comply!\""
10059010-103 = "I can't say I dislike such an honest attitude."
10059010-104 = "Then, Secretary Kanon—if you would."
10059010-109 = "[ns] \"Is this... a letter of invitation?\""
10059010-110 = "Indeed. In the name of the Assembly President, I formally extend an invitation to#nyou."
10059010-111 = "[s5] \"If you had this prepared...\"\n[s6] \"Does that mean you knew I was going to be here?\""
10059010-114 = "Heheh. I came here with the sole intent of enjoying the performance."
10059010-115 = "I simply carry an invitation with me, just in case."
10059010-116 = "You worked so hard to earn a few points, only to lose them right back.#nHow unfortunate."
10059010-117 = "[s] \"Ugh...!\""
10059010-118 = "In any case, I shall give you the invitation. #nWe will discuss the rest at a more formal location."
10059010-119 = "I'm sure it will be a pleasant experience—an exchange of the senses."
10059010-121 = "(Still without any idea of what kind of conversation we would have...)"
10059010-122 = "(The next day arrived, bringing with it a hint of unease.)"
10059010-127 = "..."
10059010-128 = "(A student with an immensely intimidating aura stood in front of the main#nentrance.)"
10059010-129 = "Hm? An outsider? Do you need something?"
10059010-130 = "[s] \"Um, I'm Schale's Sensei...\""
10059010-131 = "Ah, so it's you."
10059010-132 = "...You look quite nervous."
10059010-133 = "Is this your first time meeting an officer of the Prefectural Council?"
10059010-134 = "[s] \"I've met Miria before.\""
10059010-135 = "Miria. She's an adorable one, isn't she?"
10059010-136 = "A truly outstanding member of ours."
10059010-137 = "Ah, look at me rambling on about others. My name is Koshiro Sayo."
10059010-138 = "I'm the prefect of the Prefectural Council."
10059010-139 = "[s] (I had a feeling she wasn't just an ordinary student...!)"
10059010-140 = "Today, I've been instructed by the Assembly to welcome you, Sensei."
10059010-141 = "I've also been briefed on the magic circle incident."
10059010-142 = "I would've preferred if we had met then, but alas I was absent at the time."
10059010-143 = "I'm quite fond of having long, leisurely \"talks\" in the Meditation Room, after all."
10059010-144 = "[s] \"I-Is that so...?\""
10059010-145 = "For now, we'll skip the inspections."
10059010-146 = "I'm sure a formally invited guest wouldn't bring anything suspicious with them."
10059010-147 = "Isn't that right?"
10059010-148 = "[s] \"Of course!\""
10059010-149 = "Well, I wouldn't have minded either way."
10059010-150 = "If you did have something, then it would've made for a good opportunity to have#nthat talk we didn't have before."
10059010-151 = "[s] \"I didn't bring anything, don't worry!\""
10059010-152 = "Yeah, I believe you."
10059010-153 = "Now then, right this way. Everyone's waiting."
10059010-159 = "The Assembly is in the main building."
10059010-160 = "Is this your first time entering this place?"
10059010-161 = "There's no need to be nervous."
10059010-162 = "If you do something bad, then I WILL have to scold you...#nBut you're a good kid, right?"
10059010-163 = "[s] \"O-Of course!\""
10059010-168 = "Assembly President, I've brought Sensei over."
10059010-169 = "Excellent work. You may enter."
10059010-173 = "You heard the lady. Time to go in."
10059010-178 = "[ns] \"Whoa...\""
10059010-179 = "We've been expecting you, Sensei."
10059010-180 = "Welcome to the Assembly of Arts—the very heart of Wildhunt."
10059010-181 = "Behold. Displayed upon these walls is a piece truly befitting of this place; the#nmagnus opus of this school—"
10059010-182 = "The original \"Portrait of Genesis.\""
10059010-183 = "To bear the weight of this piece is to shoulder the entire academy itself."
10059010-184 = "We, the Assembly of Arts, bear that heavy responsibility within our hearts as we#noversee the academy."
10059010-185 = "Allow me introduce you our officers who share in this burden."
10059010-186 = "First, to my left stands our secretary, Kanon."
10059010-189 = "Greetings. It's been a day since we last met."
10059010-190 = "I pray that you're able to earn a high score from Manami-sama today."
10059010-193 = "Hehe... Oh, Kanon-sama..."
10059010-194 = "How do you do, Sensei? My name is Unrinin Urara. #nI serve as the vice-president of the Assembly."
10059010-195 = "I hope this encounter may remain with you as a beautiful memory...#nOne reminiscent of a fragrant flower in full bloom."
10059010-199 = "[ns] \"Huh... I'm smelling roses...?\""
10059010-200 = "Hehe... It must be the scent clinging onto me. #nI often spend my days tending to the rose garden."
10059010-201 = "...Ahem. It's a pleasure to be able to meet you, Sensei. Welcome to the Assembly."
10059010-202 = "[s] \"Nice to meet you.\""
10059010-205 = "Well then, Sensei. Thank you very much for coming."
10059010-206 = "Small as it may be, I would like to present you a token of our hospitality."
10059010-207 = "Vice-president Urara, if you would."
10059010-212 = "Are you familiar with this, Sensei?"
10059010-213 = "It's a premium milk that has been popular lately."
10059010-214 = "It has a reputation for being not merely delicious, but also healthy. #nI hope it's to your taste..."
10059010-219 = "[ns7] (It's almost like Urara is radiating negative ions...)\n[ns8] \"Thank you. I'll enjoy it.\""
10059010-227 = "[ns] \"It's delicious... I should stock some at Schale.\""
10059010-229 = "In addition to assisting me, vice-president Urara additionally carries out a wide#nmanner of tasks pertaining to the operation of the academy."
10059010-230 = "Today's refreshments were also provided by vice-president Urara. #nPlease, enjoy them without reservation."
10059010-234 = "Allow me to explain... What she means is that this is a gesture of kindness from#nour dear vice-president. If you leave any of it behind, then prepare for a massive#ndeduction in points."
10059010-238 = "N-No... Not at all."
10059010-239 = "If that were to happen, then it's a a failure on my part to grasp your personal#npreferences..."
10059010-240 = "[s9] \"Not at all. This is absolutely delicious.\"\n[s10] \"I'll be sure to enjoy it.\""
10059010-243 = "Hehe... How should I describe this feeling welling up within me? #nPerhaps the jubilance of a flower showered by the long-awaited rain?"
10059010-244 = "Now that introductions are complete, shall we get down to business?"
10059010-245 = "To begin, allow me to explain why I called you here."
10059010-246 = "Recently, we have confirmed the movement of unsettling forces within the#nacademy grounds."
10059010-247 = "If it was a mere conflict between students, then we would have handled it#ninternally. However, the situation is slightly different this time."
10059010-248 = "The Wildhunt Assembly of Arts formally requests the cooperation of Schale's#nSensei in the resolution of this matter."
10059010-252 = "We ask for your assistance in dispelling the darkness that lurks within the#nacademy."