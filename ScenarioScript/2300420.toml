[translation]
2300420-1 = "Даже если заменить всё"
2300420-3 = "Я пришёл в торговый центр по приглашению Утахи..."
2300420-4 = "Привет, Сенсей."
2300420-5 = "Спасибо, что пришёл. Уверена, у тебя были дела поинтереснее."
2300420-6 = "Не переживать?"
2300420-7 = "Хи-хи. Я предупреждала!"
2300420-8 = "О магазине инструментов, куда мы идём, знают лишь немногие студенты Миллениума."
2300420-9 = "Считай это тайной сокровищницей."
2300420-10 = "Ну что, пойдём?"
2300420-11 = ""
2300420-22 = "Давно не виделись, хозяин."
2300420-23 = "А, мейстер Утаха. Так давно тебя не видел, что почти забыл, как ты выглядишь."
2300420-24 = "Это всё потому, что вы слишком хорошо делаете свою работу."
2300420-25 = "Если бы ваши инструменты ломались чаще, у меня было бы больше причин приходить!"
2300420-26 = "Вот как? Может, тогда начать делать инструменты похуже..."
2300420-27 = "Но в конце концов верность клиента живёт ровно столько, сколько качество обслуживания."
2300420-28 = "Ахаха! Что ж, придётся смириться с недостатком в виде чрезмерной преданности ремеслу. Что нужно сегодня?"
2300420-29 = "Для начала набор шестигранных ключей и штангенциркуль на 100 см. Нужно ещё кое-что, но сначала осмотрюсь."
2300420-30 = "Конечно. Кстати, кто это с тобой?"
2300420-31 = "Это Сенсей из Шале."
2300420-32 = ""
2300420-34 = ""
2300420-35 = "А, Сенсей! Столько о вас слышал. Если понадобятся инструменты — обращайтесь!"
2300420-36 = "[s] «Да, конечно...»"
2300420-42 = "*свистит* Думаю, с заменой инструментов всё..."
2300420-43 = "[s] «Это очень... впечатляющий набор.»"
2300420-44 = "А, это?"
2300420-45 = ""
2300420-47 = ""
2300420-48 = ""
2300420-49 = "Хи-хи, впечатляющим я бы его не назвала, но он мой."
2300420-50 = "Точнее, я называю его «Набор инструментов мейстера»."
2300420-51 = "Он может показаться слегка чрезмерно кастомизированным, но..."
2300420-52 = "Пользуюсь им я, значит всё нормально, правда?"
2300420-53 = "В конце концов, это тот самый набор, которым я пользуюсь с тех пор, как впервые стала мейстером."
2300420-54 = ""
2300420-56 = ""
2300420-57 = "Хотя если подумать... Ни один инструмент в наборе уже не тот, что был изначально."
2300420-58 = "Какими бы прочными они ни были, каждый когда-нибудь приходилось заменять."
2300420-59 = "[s] «Тогда...»"
2300420-60 = "...Если заменили вообще всё, можно ли всё ещё считать это тем же набором?"
2300420-61 = "Ахаха. Хороший вопрос, Сенсей."
2300420-62 = ""
2300420-64 = ""
2300420-65 = ""
2300420-67 = "Представь корабль. Со временем его части приходится заменять."
2300420-68 = "И ты заменяешь их одну за другой, пока однажды не окажется, что заменены абсолютно все части. Сенсей, это всё ещё тот же корабль?"
2300420-69 = ""
2300420-72 = "[ns] «Сложный вопрос...»"
2300420-73 = "Вот как думаю я..."
2300420-74 = "Мне кажется, заменённые части корабля не важны. Главное — осталась ли той же команда. Пока она та же, для меня это тот же корабль."
2300420-75 = "Без того, кто им пользуется, разве корабль — не просто груда искривлённого металла и дерева? Если сущность корабля определяет его функция, разве функция не определяет и его идентичность?"
2300420-76 = "Глубокая трактовка? Или слишком закрученная?"
2300420-77 = "В любом случае именно так я вижу отношения мейстера и её инструментов."
2300420-78 = "Инструменты создаются ради определённого применения и определяются им. Если ими никто не пользуется, можно ли вообще назвать согнутый кусок металла инструментом?"
2300420-79 = "[s1] «Возможно, это прозвучит странно...»\n[s2] «Но инструменты, которыми ты пользуешься, наверняка очень счастливы, Утаха.»"
2300420-80 = ""
2300420-81 = ""
2300420-83 = ""
2300420-84 = "Не знаю, странно ли это звучит... но слегка неловко — точно..."
2300420-85 = "Но быть мейстером с инструментами, которыми можно гордиться..."
2300420-86 = "Хи-хи. Звучит не так уж плохо."
2300420-88 = "Пока мы продолжали покупки, Утаха шагала чуть увереннее обычного."
