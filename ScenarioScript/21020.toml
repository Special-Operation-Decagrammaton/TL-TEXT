[translation]
21020-1 = "Episódio 2;Yuuka, a Tesoureira do Seminar"
21020-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21020-4 = "..."
21020-5 = "Apareceu! Uma dos Quatro Reis Celestiais do Conselho Estudantil! A tesoureira conhecida como a \"Aritmética Impiedosa\", Yuuka!"
21020-6 = "Dá pra parar de inventar apelidos estranhos e falar de mim como se eu fosse um monstro? Que falta de educação."
21020-7 = "Mais importante..."
21020-8 = "...Sensei."
21020-9 = "[s] \"Oi, Yuuka.\""
21020-10 = "...Ai, que situação pra gente se encontrar."
21020-11 = "Eu tenho várias coisas pra conversar com você, Sensei, mas deixemos isso pra depois... Momoi."
21020-13 = "Você realmente não sabe quando desistir, né? Chegar ao ponto de envolver a \"Schale\" só pra tentar impedir o fechamento do clube."
21020-14 = "Mas não vai adiantar nada."
21020-15 = "Mesmo que seja a Schale do Conselho Estudantil Geral... Não, mesmo que a própria Presidente do Conselho Estudantil Geral voltasse!"
21020-16 = "A administração dos clubes fica basicamente sob responsabilidade do conselho estudantil de cada escola."
21020-17 = "O fechamento do Clube de Desenvolvimento de Jogos já está decidido, e ninguém pode reverter isso."
21020-18 = "I-Isso não é verdade!"
21020-19 = "Você mesma disse que, se a gente atingisse o número mínimo de membros ou apresentasse resultados dignos de um clube da Millennium..."
21020-20 = "...Se conseguissem, tudo bem. Se não, o clube seria fechado, a verba cortada e a sala confiscada. Eu deixei tudo bem claro, não deixei?"
21020-21 = "Vocês não têm membros suficientes e já se passaram meses sem nada que prove algum resultado como clube..."
21020-24 = "Então não deveriam ter nenhuma objeção ao fechamento, certo?"
21020-26 = "Objeção! Muitas objeções! Nós também damos tudo de nós nas atividades do clube!"
21020-28 = "Por isso, tipo, como é mesmo... circunstâncias ambulantes? A gente devia ter direito a algo assim!"
21020-29 = "Você quer dizer \"circunstâncias atenuantes\", não? E, mais importante, o que você acabou de dizer? Dando tudo de si...?"
21020-30 = "Não me faça rir!"
21020-32 = "Primeiro vocês ergueram um prédio esquisito no campus, decoraram igual a um cassino e organizaram um torneio de apostas; depois invadiram o Clube de Pesquisa de História Antiga dizendo que estavam procurando jogos retrô..."
21020-33 = "Não percebem o absurdo?! Podem até estar \"dando tudo de si\", mas isso está completamente errado como atividade de clube! E ainda têm a cara de pau de pedir verba toda vez depois de causar tanta dor de cabeça por aí?!"
21020-34 = "Pelo menos tentem dar uma desculpa decente!"
21020-35 = "À-Às vezes é preciso valorizar mais a boa vontade do que os resultados..."
21020-36 = "Não quero ouvir desculpas de perdedoras."
21020-37 = "Você quer ouvir ou não quer, afinal?!"
21020-38 = "Estou dizendo que não quero ouvir desculpas sem sentido. Na Millennium, \"resultados\" são tudo."
21020-39 = "M-Mas a gente tem resultados, sim! Nós estamos desenvolvendo jogos!"
21020-40 = "I-Isso mesmo! \"Tales Saga Chronicle\" até ganhou um prêmio \"naquele concurso\"..."
21020-43 = "[ns] \"'Tales Saga Chronicle'?\""
21020-44 = "...Pois é. De fato, ganhou um prêmio."
21020-45 = "Pela sua reação, parece que você não conhece, Sensei."
21020-46 = "\"Tales Saga Chronicle\"... O único resultado deste Clube de Desenvolvimento de Jogos."
21020-47 = "O jogo em si já chama atenção, mas as análises foram particularmente memoráveis."
21020-48 = "\"De longe o RPG mais 'desesperador' que já joguei na vida. E não pela história, mas pelo nível de acabamento do jogo.\""
21020-49 = "\"Se eu começar a listar o que falta nesse jogo, não termino nunca... mas, bom, o que mais falta mesmo é 'sanidade'.\""
21020-50 = "\"Depois de jogar isso, chego até a pensar se 'Dead Cream Zone' não era uma obra-prima...\""
21020-51 = "N-Nosso jogo não vai se curvar à maldade da internet..."
21020-52 = "Mesmo que existissem usuários infinitos, quando tantas avaliações convergem para o mesmo ponto, isso é o mais próximo possível da verdade."
21020-53 = "Além disso, o único \"resultado\" que vocês têm é esse \"1º lugar no Ranking de Piores Jogos do Ano\", não é?"
21020-54 = "B-Bem, sim, mas...!"
21020-55 = "[s] \"1º lugar?! Incrível, fiquei curioso pra jogar!!\""
21020-57 = "..."
21020-58 = "..."
21020-61 = "..."
21020-62 = "...Enfim."
21020-63 = "Se um clube como o de vocês continuar existindo, só vai manchar a reputação da escola."
21020-64 = "E se redirecionarmos essa verba, ela poderá ajudar alunas que realmente fazem atividades relevantes..."
21020-65 = "Portanto, se querem insistir que as atividades de vocês têm valor... provem."
21020-66 = "Provar...?"
21020-67 = "Já disse várias vezes. Se comprovarem um feito ou resultado legítimo, eu revogo o fechamento."
21020-68 = "Tipo ganhar um prêmio em alguma competição?"
21020-69 = "Exato. Nos esportes, ir para o campeonato interescolar; no Clube de Engenharia, apresentar uma invenção... esse tipo de coisa."
21020-70 = "Para o Clube de Desenvolvimento de Jogos, imagino que existam vários concursos assim..."
21020-71 = "Dito isso, não acho que só participar vá resolver. A capacidade de vocês já foi comprovada por aquele ranking de piores jogos."
21020-72 = "Argh..."
21020-73 = "Já que é assim, que tal facilitarmos as coisas pra todo mundo? Esvaziem a sala agora mesmo e joguem fora toda essa tralha."
21020-74 = "..."
21020-75 = "N-Não chama isso de tralha...!"
21020-76 = "...Então o que é?"
21020-77 = "É-É que..."
21020-81 = "...!"
21020-82 = "...Entendido. Vou provar tudo com resultados."
21020-83 = "Ah, é...?"
21020-84 = "E os preparativos pra isso já estão prontos!"
21020-86 = "Hã?"
21020-87 = "Estão?!"
21020-88 = "Por que você tá surpresa, Midori?!"
21020-89 = "Enfim, nós temos um trunfo na manga."
21020-90 = "E vamos usar esse trunfo para inscrever no próximo \"Prêmio Millennium\" o nosso jogo..."
21020-91 = "\"TSC2\"... \"Tales Saga Chronicle 2\"!"
21020-92 = "?!"
21020-93 = "[s] \"Prêmio Millennium... o que é isso?\""
21020-95 = "É a maior competição da Millennium, onde clubes da escola inteira disputam com suas criações! Se a gente ganhar um prêmio lá, você não vai poder reclamar de nada, né?!"
21020-96 = "...Bem, é verdade."
21020-97 = "Isso SE vocês ganharem."
21020-98 = "Mas, Momoi, o que você está falando agora nem se compara a um clube de esportes ir para o campeonato interescolar..."
21020-99 = "É um sonho tão distante quanto \"um jogador de beisebol do ensino médio estreando direto na Major League\"."
21020-100 = "...Mas tudo bem. Não sei por quê, até eu fiquei um pouco curiosa."
21020-102 = "Certo, então vou esperar até lá."
21020-103 = "Faltam duas semanas até o Prêmio Millennium... Mal posso esperar pra ver que tipo de resultado vocês conseguem nesse prazo curto."
21020-105 = "...Ufa. Nunca imaginei que acabaria mostrando um lado tão pouco fofo na frente do Sensei..."
21020-106 = "Mas isso também faz parte do trabalho do Conselho Estudantil."
21020-107 = "Da próxima vez, vamos nos encontrar em uma situação mais tranquila, Sensei. Até mais."
21020-109 = "(Clac)"
21020-110 = "..."
21020-111 = "Mana..."
21020-112 = "As chances são baixas nos dois casos, mas... em vez de fazer um jogo do zero agora, não seria melhor recrutar novos membros?"
21020-113 = "A gente já tentou isso o mês inteiro... e, no fim, ninguém quis entrar."
21020-114 = "Já tô cheia de ouvir gente rindo da nossa cara dizendo \"Pfff! Até RV já tá ultrapassado, quem liga pra jogo retrô?\"."
21020-115 = "..."
21020-116 = "Sua covarde, Yuuka! Se aproveitar do fato de que nerds como a gente têm poucos amigos! Imperdoável!"
21020-117 = "Olha... isso não é culpa da Yuuka, acho que é 100% culpa nossa mesmo."
21020-118 = "De qualquer forma, continuar recrutando membros não vai nos levar a lugar nenhum."
21020-119 = "Além disso, ainda temos outra esperança."
21020-120 = "Ah, é mesmo. Aquele \"trunfo\" que você mencionou agora há pouco... o que é exatamente?"
21020-121 = "É o Sensei, claro!"
21020-122 = "[s] \"...Eu?\""
21020-123 = "Voltando ao assunto, o nosso objetivo está nas \"Ruínas\"."
21020-124 = "As \"Ruínas\"... são uma área misteriosa nos arredores da Millennium cujo acesso era originalmente restrito pelo Conselho Estudantil Geral."
21020-125 = "Diziam que o acesso era restrito por ser uma \"zona perigosa\"... mas, na verdade, ninguém sabe exatamente qual é o perigo."
21020-126 = "Não sabemos nem se ninguém nunca entrou lá, se é impossível entrar, ou se quem entrou nunca mais voltou..."
21020-127 = "...É um lugar envolto em mistério."
21020-128 = "[s] \"Por que vocês querem ir a um lugar desses...?\""
21020-129 = "Porque eu quero fazer um bom jogo!"
21020-130 = "Eu quero provar..."
21020-131 = "Mesmo que, por enquanto, o nosso nível seja só de \"1º lugar no Ranking de Piores Jogos do Ano\"..."
21020-132 = "Que esses jogos que eu amo tanto... que me fizeram tão feliz..."
21020-134 = "Não são tralha nenhuma, são tesouros preciosos!"
21020-135 = "...Mana."
21020-136 = "E, pra isso, a gente precisa dar um jeito de entrar nas Ruínas e encontrar \"aquilo\"."
21020-137 = "[s] \"Aquilo?\""
21020-138 = "Ah, acho que comecei pela ordem errada. Preciso te contar sobre isso agora."
21020-139 = "Sensei,"
21020-142 = "Você conhece a... G.Bible?"
21020-144 = "Próximo;Rumo às Ruínas"
