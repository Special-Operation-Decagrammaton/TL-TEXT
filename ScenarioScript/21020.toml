[translation]
21020-1 = "Эпизод 2;Казначей Семинар Юука"
21020-2 = "Департамент Разработки Игр Милленниума"
21020-3 = ""
21020-4 = "..."
21020-5 = "Это ты! Одна из Четырёх божественных зверей студсовета! Холодная и расчётливая казначей Юука!"
21020-6 = "Можно не описывать меня так, будто я какое-то чудовище? Я просто выполняю свою работу."
21020-7 = "..."
21020-8 = "Сенсей."
21020-9 = "[s] «Рад тебя видеть, Юука.»"
21020-10 = "*вздох* Ну и бардак."
21020-11 = "Момои."
21020-12 = ""
21020-13 = "Вы всё такие же упрямые, да? Теперь ещё и Шале втянули, чтобы помешать нам закрыть ваш клуб."
21020-14 = "Но это ничего не меняет."
21020-15 = "Будь то Шале, Генеральный Студенческий Совет — даже если бы сама президент Ген Студсовета внезапно вернулась, это ничего бы не изменило!"
21020-16 = "Студсовет академии имеет полное право решать судьбу своих клубов."
21020-17 = "Департамент Разработки Игр будет закрыт. Никто этому не помешает."
21020-18 = "Н-Не так быстро!"
21020-19 = "Ты сказала, что если у нас не будет минимально необходимого количества участников или мы не будем выполнять цели клуба..."
21020-20 = "...вы потеряете бюджет и клубную комнату, да. Вам это объясняли уже бесчисленное количество раз."
21020-21 = "Прошло больше года, а у вас до сих пор недостаточно участников, и цели клуба вы тоже не выполняете."
21020-22 = ""
21020-24 = "С учётом этого на каких основаниях вы вообще можете возражать против нашего решения?"
21020-26 = "Основания есть! Мы прямо на куче оснований стоим! Н-Наш клуб из кожи вон лезет, выполняя свою деятельность!"
21020-28 = "Так что м-мы заслуживаем саммит-слушание!"
21020-29 = "Думаю, ты имеешь в виду смягчающее слушание..."
21020-30 = "И не говори ерунды!"
21020-31 = ""
21020-32 = "Вы пытались открыть в школе зал патинко, напали на Общество исследований древней истории в поисках редкой классической консоли..."
21020-33 = "Деятельность вашего клуба является какой угодно, только не нормальной! Как вы смеете просить ещё денег?! Вы просто устраиваете хаос под вывеской «создания здоровой среды разработки»."
21020-34 = "Что вы можете сказать в своё оправдание?!"
21020-35 = "И-Иногда нужно смотреть не на результат, а на намерения..."
21020-36 = "Так говорит неудачник. Не хочу это слышать."
21020-37 = "Ты сама попросила оправдание!"
21020-38 = "Я просила причину, а не бессмысленную отговорку. В Милленниуме важен только результат."
21020-39 = "Да есть у нас результаты! Мы ВЫПОЛНИЛИ одну цель! Мы закончили игру!"
21020-40 = "В-Вот именно! Tales Saga Chronicle заняла первое место на конкурсе!"
21020-41 = ""
21020-43 = "[ns] «Tales Saga Chronicle?»"
21020-44 = "Да, я знаю о награде, которую вы получили."
21020-45 = "Но Сенсей, вероятно, не в курсе."
21020-46 = "Tales Saga Chronicle — единственная игра, которую вашему клубу удалось успешно выпустить."
21020-47 = "И отзывы были столь же впечатляющими, как сама игра. Я прекрасно их помню."
21020-48 = "\"Если они хотели создать самую жалкую RPG всех времён, то отлично справились\"."
21020-49 = "\"Ей не достаёт во многих областях, особенно в области здравого смысла\"."
21020-50 = "\"О боже. На фоне этой игры Dead Crimson кажется шедевром\"."
21020-51 = "Н-Нельзя судить нашу игру по каким-то троллям, которые её разносят..."
21020-52 = "Это вовсе не единичные случаи. Таково было общее мнение."
21020-53 = "Именно поэтому вы получили награду за худшую игру года."
21020-54 = "Э-Эй, любая известность — хорошая известность, верно?!"
21020-55 = "[s] «И вам даже кубок дали?!»"
21020-57 = "..."
21020-58 = "..."
21020-59 = ""
21020-61 = "..."
21020-62 = "...В любом случае."
21020-63 = "Неприемлемо, что ваш клуб тратит бюджет впустую и одновременно портит репутацию Милленниума."
21020-64 = "Вы высасываете ресурсы и мешаете прогрессу других клубов кампуса."
21020-65 = "Так что именно вы должны доказать, что ваш клуб занимается полноценной деятельностью."
21020-66 = "Ты хочешь, чтобы мы это доказали?"
21020-67 = "Как я уже сказала, если ваш клуб сможет показать значимый результат, мы отменим решение о закрытии."
21020-68 = "В смысле, например, выиграть какую-нибудь награду?"
21020-69 = "Да. Например, выход бейсбольного клуба на межшкольный чемпионат или представление Инженерным Департаментом новых изобретений. Что-то в этом духе."
21020-70 = "Наверняка существует конкурс, в котором Департамент Разработки Игр может поучаствовать."
21020-71 = "Только постарайтесь не выиграть ещё одну награду \"Худшая игра года\"."
21020-72 = "Уф."
21020-73 = "Если хотите сэкономить время, могу закрыть вас прямо сейчас. Можете освободить клубную комнату и выбросить весь этот хлам."
21020-74 = "..."
21020-75 = "Н-Не называй это хламом."
21020-76 = "А что это, если не хлам?"
21020-77 = "Это мои..."
21020-78 = ""
21020-79 = ""
21020-81 = "Придумала!"
21020-82 = "Хочешь результатов? Будут тебе результаты!"
21020-83 = "Правда...?"
21020-84 = "На самом деле разработка уже почти закончена!"
21020-86 = "Неужели?"
21020-87 = "Ч-Что ты несёшь?"
21020-88 = "Чего ты так удивляешься, Мидори?"
21020-89 = "У нас в рукаве есть секретное оружие."
21020-90 = "И мы подадим заявку на Премию Милленниума..."
21020-91 = "С Tales Saga Chronicle 2! Или сокращённо TSC2!"
21020-92 = "?!"
21020-93 = "[s] «Что такое Премия Милленниума?»"
21020-95 = "Это конкурс, куда сотни клубов Милленниума представляют плоды своей работы. Если мы победим, нас уже никто не сможет закрыть! Даже ты!"
21020-96 = "Возможно."
21020-97 = "Если — и только если — вы победите."
21020-98 = "Надеюсь, ты понимаешь, насколько абсурдно твоё предложение, Момои."
21020-99 = "Это всё равно что нашему бейсбольному клубу не просто выйти на межшкольный чемпионат, а сразу пробиться в высшую лигу."
21020-100 = "Как бы то ни было, мне интересно посмотреть, что вы покажете — даже если всё обречено на провал."
21020-101 = ""
21020-102 = "Итак, вот ваш последний шанс."
21020-103 = "До Премии Милленниума две недели. Надеюсь, вы ждёте его не меньше меня."
21020-104 = ""
21020-105 = "Рада была снова увидеть Вас, Сенсей. Жаль, что обстоятельства оказались не самыми приятными."
21020-106 = "Но когда речь о делах студсовета, работа есть работа."
21020-107 = "Надеюсь, следующая наша встреча будет приятнее. Всего доброго."
21020-109 = "*клац*"
21020-110 = "..."
21020-111 = "Момои..."
21020-112 = "Шанс невелик, но тебе не кажется, что найти ещё одного участника будет проще, чем разработать новую игру?"
21020-113 = "Мы уже месяц пытаемся, и никто так и не вступил."
21020-114 = "Мне надоело слышать, что ретро-игры — мусор, потому что VR существует уже много лет."
21020-115 = "..."
21020-116 = "Эта коварная Юука! Она просто дискриминирует нас, потому что знает: мы задроты без друзей! Ненавижу её!"
21020-117 = "Нельзя винить Юку... Это мы нарушаем правила, которые действуют для всех клубов."
21020-118 = "Неважно. Я к тому, что путь через набор участников для нас безнадёжен."
21020-119 = "Но это не значит, что другого пути нет."
21020-120 = "А, точно. Что за \"секретное оружие\", о котором ты упоминала Юке?"
21020-121 = "Очевидно же — Сенсей."
21020-122 = "[s] «Я?»"
21020-123 = "Помните руины, о которых я говорила, Сенсей?"
21020-124 = "Недалеко от Милленниума есть загадочное место, куда Генеральный Студенческий Совет никого не пускает."
21020-125 = "Говорят, доступ ограничен из-за опасности, но что именно там опасного, никто никогда не объяснял. По-моему, это очень подозрительно."
21020-126 = "Невозможно узнать, заходил ли туда вообще кто-нибудь и возвращался ли обратно."
21020-127 = "Совершенно неизведанный мир..."
21020-128 = "[s] «Зачем вам вообще идти в такое место?»"
21020-129 = "Потому что мы хотим сделать великую игру!"
21020-130 = "Я хочу кое-что доказать."
21020-131 = "Я знаю, что пока у нас за душой только жалкая награда за худшую игру года."
21020-132 = "Но игровые консоли, которые я люблю и которые всегда делали меня счастливой..."
21020-133 = ""
21020-134 = "...никакой не хлам! Это мои сокровища!"
21020-135 = "Момои..."
21020-136 = "Нам нужно лишь отправиться в руины и наконец найти её."
21020-137 = "[s] «Найти что?»"
21020-138 = "О, наверное, стоило сначала объяснить."
21020-139 = "Сенсей, Вы случаем..."
21020-140 = ""
21020-141 = ""
21020-142 = "...никогда не слышали о Г.БИБЛИИ?"
21020-144 = "Следующий эпизод;В руины"
