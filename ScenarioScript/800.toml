[translation]
800-1 = "Появление Аой"
800-3 = ""
800-4 = "Я ждала вас, Сенсей."
800-5 = "[s] «Эм...»"
800-6 = "Алло? Вы меня слышали, Сенсей?"
800-7 = "[s1] «...Ты кто?»\n[s2] «Ты... казначей...?»"
800-8 = "Вы не помните, кто я...? Я Оки Аой, глава финансов Генерального студенческого совета."
800-9 = "[s3] «Ч-Что-то припоминаю...»"
800-10 = "*вздох* Не мне читать вам лекции об иерархии Совета. Делайте как хотите."
800-11 = "...Я бы предпочла иметь возможность произвести на вас лучшее первое впечатление."
800-12 = "К сожалению, я не смешиваю работу и личное. Сегодня я здесь как глава финансов, а не как Аой."
800-13 = "[s] «Сегодня...?»"
800-14 = ""
800-16 = ""
800-17 = "Да. Сегодня — строго по делу. Посмотрим: нужно проверить документы, обработать жалобы граждан..."
800-18 = "Обычно этим занимается Рин... то есть главный администратор, но в её расписании почти нет свободной минуты."
800-19 = "Если она узнает об этих задачах, то заработается до поездки в отделение неотложной помощи Рыцарей первой помощи Тринити. Поэтому другого выхода нет."
800-20 = "Я ей помогу."
800-21 = "[s] «А я помогу тебе?»"
800-22 = "Да. Вы поможете мне помочь ей."
800-23 = "[s] «Ладно. А кто поможет мне помочь тебе помочь ей?»"
800-24 = "Ха-ха. Спасибо, Сенсей."
800-25 = "И последнее."
800-26 = ""
800-28 = ""
800-30 = ""
800-31 = "Давайте сохраним это между нами. Хорошо?"
800-32 = "Это не обычная работа Казначейства, а Рин наверняка найдёт способ почувствовать себя виноватой. Так что, пожалуйста..."
800-33 = "[s] «Никому ни слова»."
800-34 = "Тогда не будем терять время."
