[translation]
1002102-1 = "Приоритетная цель"
1002102-2 = "Я решил сообщить Азусе, где нахожусь."
1002102-3 = "Вскоре я увидел, как Азуса издалека торопливо приближается ко мне."
1002102-4 = ""
1002102-6 = ""
1002102-7 = "Вот ты где, Сенсей. Как я и ожидала, ты сидишь на совершенно открытом месте."
1002102-8 = "Разве я не говорила тебе, насколько здесь опасно?"
1002102-9 = "С тактической точки зрения такое открытое место без укрытий поблизости совершенно невозможно оборонять."
1002102-10 = "А? Почему я беспокоюсь об этом на пляже?"
1002102-11 = "Твоя проблема в том, что ты слишком беспечен, Сенсей. Враги склонны нападать из самых неожиданных мест."
1002102-12 = "С тактической точки зрения это идеальное место для засады."
1002102-13 = "Совсем недавно... О!"
1002102-14 = "Сенсей! Ложись!"
1002102-15 = ""
1002102-17 = "[ns] «...?!»"
1002102-18 = ""
1002102-19 = "..."
1002102-20 = "Фух."
1002102-21 = "Похоже, это был просто турист. Всё чисто. Можешь вставать."
1002102-22 = "[s1] «Не думаю, что тебе нужно быть настолько напряжённой.»\n[s2] «Азуса, это тебе надо успокоиться, а не мне.»"
1002102-23 = "Лучше бы ты так не говорил."
1002102-24 = "Лучше бы ты так не говорил."
1002102-25 = "Если бы он и правда был настроен враждебно, мы могли оказаться в серьёзной опасности."
1002102-26 = "Я понимаю, что ты хочешь сказать, но нам слишком рискованно терять бдительность."
1002102-27 = "Если будешь неосторожен, можешь потом пожалеть."
1002102-28 = "Как я и думала, это место не подходит. Пойдём куда-нибудь ещё. Я найду более укреплённую позицию."
1002102-29 = "А? Ты хочешь остаться здесь?"
1002102-30 = "Сенсей, мне казалось, я объяснила достаточно понятно..."
1002102-31 = "Хм-м."
1002102-32 = "[s] «Об Азусе?»"
1002102-33 = "*вздох* Ладно. Полагаю, я должна уважать мнение человека, которого защищаю."
1002102-34 = "Но с этого момента ты должен меня слушаться."
1002102-35 = "Для начала нужно укрепить эту зону. Оставайся там и не двигайся."
1002102-36 = "[s] «Укрепить зону?»"
1002102-37 = "Да. Нам нужны хотя бы самые простые оборонительные меры. Это не займёт много времени."
1002102-38 = ""
1002102-39 = "*достаёт лопату*"
1002102-40 = "[s] «Почему у тебя это с собой?!»"
1002102-41 = "Нет ничего примитивнее стены, когда речь идёт об обороне."
1002102-42 = "Не волнуйся. Я хорошо умею это делать, так что справлюсь быстро. Здесь в основном песок, копать будет легко."
1002102-44 = "Азуса без колебаний начала копать песок."
1002102-46 = "Хм. Выглядит немного неказисто, но пока сойдёт."
1002102-47 = "[s3] «Ты уже закончила?!»\n[s4] «Как ты вообще...?»"
1002102-48 = "Я столько раз проходила такие учения, что комплименты меня уже не трогают."
1002102-49 = "Я столько раз проходила такие учения, что комплименты меня уже не трогают."
1002102-50 = "Но думаю, это поможет защитить тебя. Никогда не знаешь, что может пригодиться."
1002102-51 = "Сюда, Сенсей. Заходи с этой стороны."
1002102-54 = "Я забрался внутрь и сел рядом с Азусой."
1002102-55 = "Как и сказала Азуса, хотя укрытие было сделано из песка, внутри оно ощущалось как маленькая уютная кабинка глубоко под землёй."
1002102-56 = "*вздох* Так гораздо лучше..."
1002102-57 = "Хм? Что такое, Сенсей?"
1002102-58 = "Хм? Что?"
1002102-59 = "Это я была напряжена?"
1002102-60 = "Ты надеешься, что здесь я смогу немного расслабиться?"
1002102-61 = "Э-Это нелепо!"
1002102-62 = "Я уже много раз говорила тебе, что всё это только ради твоей безопасности."
1002102-63 = "Я вовсе не напряжена. Я просто очень бдительна, когда речь идёт о безопасности. Пожалуйста, не путай эти вещи."
1002102-64 = "Я специально пришла к тебе, потому что..."
1002102-65 = "Ч-Что это за выражение лица?"
1002102-66 = "Почему вы так на меня смотрите?"
1002102-67 = "[s5] «Хочешь чего-нибудь сладкого? Это поможет успокоиться.»\n[s6] «Ты ведь знаешь, что можешь поговорить со мной, если нервничаешь, да?»"
1002102-68 = "О-О. Хорошая идея. Тогда я..."
1002102-69 = "...?"
1002102-70 = "П-Правда? Ты уверен, Сенсей?"
1002102-71 = "Тогда я продолжу..."
1002102-72 = "О."
1002102-73 = "...!"
1002102-74 = ""
1002102-76 = "Лицо Азусы вспыхнуло ярко-красным, а звук выстрела из её оружия эхом разнёсся вокруг."
1002102-77 = "Разумеется, владельцы ближайших лавок тут же прибежали сделать нам замечание. Мы с Азусой вместе перед ними извинились."
