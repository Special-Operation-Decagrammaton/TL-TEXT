[translation]
1009002-1 = "Фестивали — это здорово. Очень, очень, очень!"
1009002-3 = "А, Сенсей!"
1009002-4 = ""
1009002-7 = "Хи-хи-хи. Добро пожаловать на фестиваль!"
1009002-8 = "Тут немного хаотично, правда? Сейчас я вам помогу."
1009002-9 = "[ns] «Да уж, это точно фестиваль Хяккияко...»"
1009002-10 = "А ведь этот ещё даже не особенно большой!"
1009002-11 = "Особенно по сравнению с главными событиями вроде Фестиваля цветения сакуры Хяккияко, Фестиваля аттракционов Кинодеревни Водоворота или Фестиваля фонарей Хяккияко..."
1009002-12 = ""
1009002-15 = ""
1009002-16 = "На их фоне уже ничто не кажется таким уж грандиозным, верно?"
1009002-17 = "Ах! Но мне вообще не стоит сравнивать фестивали. Как же я могла!"
1009002-18 = "У каждого фестиваля есть свой особый смысл, и в конце концов все они весёлые!"
1009002-19 = ""
1009002-21 = ""
1009002-22 = "Вы всегда замечаете и исправляете мои ошибки... Вы такой мудрый, Сенсей!"
1009002-23 = ""
1009002-25 = "[ns] «Ты точно уверена?!»"
1009002-26 = ""
1009002-27 = "Ну же, не отставайте! За мной! Как видите, здесь проходит шествие с паланкином, украшенным множеством самых разных кукол!"
1009002-28 = "В прошлом эти куклы в основном изображали принцесс, но..."
1009002-29 = "Сейчас это превратилось в фестиваль, где паланкин набивают как можно большим количеством разнообразных красивых кукол и проносят по улицам!"
1009002-30 = ""
1009002-32 = ""
1009002-33 = "...Интересно, поэтому столько кукольных мастеров стараются подружиться с торговой гильдией и организаторами фестиваля..."
1009002-34 = "...А ещё были какие-то странности с контрактами на материалы для самого паланкина..."
1009002-35 = "[s] «...Мне точно стоит слышать все эти закулисные подробности?»"
1009002-36 = "Н-Но неважно! Одно осталось неизменным: каждый год в центре паланкина ставят большой фонарь в форме принцессы!"
1009002-37 = ""
1009002-40 = "А здесь можно увидеть фестивальные угощения: карамелизированные яблоки в форме цветков лотоса и ледяной десерт с розовым сиропом из клубники и вишни!"
1009002-41 = ""
1009002-44 = "Смотрите! Представление началось! Они танцуют под музыку, идя следом за паланкином!"
1009002-45 = ""
1009002-48 = "Билет у вас есть? Отлично! Внутри должен быть купон, который можно обменять максимум на четыре разных вещи — маски, веера и даже закуски!"
1009002-49 = ""
1009002-62 = "Фух... Так долго идти за этим шествием с паланкином утомительно..."
1009002-63 = "[s] «Я снова убедился, насколько сильно ты любишь фестивали.»"
1009002-64 = "Я?"
1009002-65 = "Хи-хи-хи... Когда вы говорите это вслух, мне немного неловко, Сенсей..."
1009002-66 = ""
1009002-68 = "..."
1009002-69 = "Да, я люблю фестивали."
1009002-70 = "А разве не все?"
1009002-71 = "Это короткий побег от повседневности в мир мечты..."
1009002-72 = "Стоит мне подумать, что я помогаю людям попасть в этот мир, и меня сразу переполняет восторг!"
1009002-73 = "Хм... Наверное, можно сказать, что это похоже на парк аттракционов..."
1009002-74 = "Н-Некоторые сходства есть... П-Понимаю, почему кто-то может так подумать."
1009002-75 = "Но фестивали ощущаются куда более живыми!"
1009002-76 = "[s] «Живыми?»"
1009002-77 = "Эм, я имею в виду..."
1009002-78 = ""
1009002-80 = ""
1009002-81 = ""
1009002-82 = "Как видите, каждый фестиваль по-своему уникален."
1009002-83 = "Возьмём хотя бы этот фестиваль кукольного паланкина! Куклы, которые несли в прошлом году, отличаются от тех, что стоят на паланкине сейчас!"
1009002-84 = "Потому что торговая гильдия запрещает выставлять на фестивале прошлогодних кукол."
1009002-85 = "Когда дело касается подготовки к фестивалю, к каждому новому событию я подхожу с новой волной энтузиазма!"
1009002-86 = "Я понимаю, что вам они могут казаться похожими. И, возможно, оба пытаются перенести людей в мир мечты. Но фестивали и парки аттракционов совершенно—"
1009002-87 = "[s1] «Успокойся, Умика. Дыши.»\n[s2] «Я прекрасно понимаю твою страсть.»"
1009002-90 = "О-Ой, п-простите! Я увлеклась и начала тараторить..."
1009002-91 = "А? Что значит вам понравилось увидеть меня такой? Угх... Как же неловко..."
1009002-92 = "Но всё же... Что вы предпочитаете, Сенсей? Парки аттракционов или фестивали?!"
1009002-93 = "[s] «Наверное, я хотел бы одинаково наслаждаться и тем и другим...»"
1009002-94 = "Что? Вы «хотели бы наслаждаться»? А не просто «наслаждаетесь»? Что это значит?"
1009002-95 = "Погодите... Из-за обязанностей в Шале вам трудно ходить в парки аттракционов и на фестивали?"
1009002-96 = "П-Простите, Сенсей. Мне не стоило ничего говорить..."
1009002-97 = "[s] «Всё нормально. Правда.»"
1009002-98 = "Хм... Если из-за работы вам трудно находить время на фестивали, тогда..."
1009002-99 = ""
1009002-101 = ""
1009002-102 = "!!"
1009002-103 = "[ns] «Ты что-то сказала, Умика?»"
1009002-104 = "Нет-нет, ничего! Просто..."
1009002-105 = "Хи-хи-хи. Мне только что пришла отличная идея, как решить мою маленькую... проблему."
1009002-106 = "Хм? Какую проблему? Секрет! Расскажу, когда всё будет готово."
1009002-107 = "В любом случае, раз вы наконец пришли, Сенсей, давайте я ещё немного всё вам покажу!"
1009002-108 = "Не волнуйтесь! Как видите, я стану... величайшим мастером фестивалей Хяккияко!"
1009002-110 = ""
1009002-112 = "Мой величайший мастер фестивалей устроила мне подробную экскурсию по территории фестиваля."
