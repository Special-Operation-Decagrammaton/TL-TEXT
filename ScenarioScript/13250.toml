[translation]
13250-1 = "Episódio 25;A Batalha Final (1)"
13250-6 = "Gah...!"
13250-9 = "Cof, cof...!"
13250-10 = "A-Ainda não acabou... ugh."
13250-11 = "..."
13250-12 = "Por quê... Por que não consigo vencer?"
13250-15 = "Então me faltou força para negar Abydos?"
13250-16 = "Depois de vagar tanto pelo deserto, eu..."
13250-19 = "...O que você queria fazer?"
13250-20 = "Arf, arf..."
13250-21 = "Você disse que era para lutar comigo, né?#nA gente já se encontrou em algum lugar?"
13250-22 = "..."
13250-23 = "...A propósito, aquela história do caderno é verdade?"
13250-24 = "Caderno...?#nAh, aquilo da Presidente do Conselho Estudantil."
13250-27 = "Não me diga que acreditou mesmo que algo assim existisse?#nJá faz dois anos que não encontram, não é?"
13250-33 = "...Continuar presa ao passado por tanto tempo... que tolice."
13250-45 = "Eu..."
13250-46 = "Preciso me tornar a mais forte."
13250-47 = "...E dizer adeus a esta terra amaldiçoada."
13250-52 = "A mais forte?"
13250-53 = "...Bem, tanto faz. Já acabou, né?"
13250-57 = "Então, vou destruir o Canhão Ferroviário..."
13250-59 = "Não vou deixar você fazer isso!"
13250-63 = "Hã...?"
13250-68 = "Bem-vinda de volta, Hoshino-senpai."
13250-70 = "Não achei que chegaria o dia em que ouviria essas palavras de novo..."
13250-71 = "Mas não esperava que vocês chegassem tão rápido assim."
13250-72 = "[s] \"Hoshino, vim te impedir.\""
13250-73 = "Até o Sensei está aqui... isso vai dar trabalho, hein."
13250-78 = "Mas por quê?#nSe eu não destruir o Canhão Ferroviário, Abydos... não, Kivotos inteira vai cair no caos."
13250-79 = "Mesmo assim, não abandone a escola sem falar nada!"
13250-80 = "Não posso sair dando trabalho pras minhas calouras, né."
13250-81 = "E quem foi que pediu isso?!"
13250-83 = "Isso mesmo! Por que você sempre decide tudo sozinha?#nDesse jeito, não mudou nada desde a última vez!"
13250-84 = "Nn, mesmo sendo mais velha que a gente."
13250-86 = "S-Shiroko-chan..."
13250-87 = "Se você não quiser conversar, senpai,"
13250-88 = "vamos capturá-la!"
13250-90 = "Você também está cheia de energia, hein, Ayane-chan."
13250-95 = "Ayane-chan, Ayane-chan..."
13250-96 = "H-Hã...?"
13250-97 = "...?"
13250-103 = "Agora eu não sou mais a Ayane-chan..."
13250-104 = "A-Ayane-chan...?"
13250-105 = "Por favor..."
13250-110 = "Me chame de Presidente do Conselho Estudantil Ayane!"
