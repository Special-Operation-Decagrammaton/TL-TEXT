[translation]
90002220-1 = "Эпизод 22;Декаграмматон"
90002220-2 = "...!"
90002220-3 = ""
90002220-5 = ""
90002220-6 = ""
90002220-7 = "*тяжело дышит* *тяжело дышит* *тяжело дышит*"
90002220-8 = "..."
90002220-9 = "И теперь... всё снова стало как прежде."
90002220-10 = "Это конец. Сдавайся."
90002220-11 = "Не могу. Я ещё не всё сделала."
90002220-12 = "Есть вещи, которые я должна доказать, и вещи, которые должна защитить."
90002220-13 = "Если я остановлюсь здесь, всё это превратится в мимолётные следы и исчезнет."
90002220-14 = "Разве ты не желаешь победы, Ключ?"
90002220-15 = "Я Кей."
90002220-16 = ""
90002220-18 = ""
90002220-19 = "..."
90002220-20 = "Тогда приди сюда и заслужи её."
90002220-21 = "Приди и забери её."
90002220-22 = "Докажи свою ценность. Обрежь собственными руками и покажи, что способна вынести этот груз."
90002220-23 = "Возьми на себя бремя уничтожения живого творения."
90002220-24 = "...!"
90002220-25 = ""
90002220-27 = ""
90002220-28 = ""
90002220-29 = "[ns] «Но разве это не одинаково для обеих сторон?»"
90002220-30 = "...Сенсей, снова."
90002220-31 = "В очередной раз ты появляешься лишь тогда, когда ход событий начинает складываться в твою пользу."
90002220-32 = "Ты пытаешься стереть самого себя — того, кто столь позорно стоял на коленях, — будто его никогда не существовало?"
90002220-33 = "[s1] «Если понадобится, я встану на колени снова.»\n[s2] «Но сейчас важно не это.»"
90002220-36 = "Что ты хочешь сказать, Сенсей?"
90002220-37 = "[s] «...Возможно, всё не обязательно должно было закончиться так.»"
90002220-38 = "Сенсей...?"
90002220-39 = "...Ты жалеешь меня, Сенсей?"
90002220-40 = "...!"
90002220-41 = ""
90002220-43 = ""
90002220-44 = ""
90002220-46 = "Отвечай!"
90002220-47 = ""
90002220-49 = ""
90002220-50 = ""
90002220-51 = ""
90002220-52 = "...Да. Возможно, Сенсей тебя жалеет. Раздражает, правда?"
90002220-53 = "...Декаграмматон."
90002220-54 = "Кажется, я наконец поняла ход мыслей Сенсея."
90002220-55 = "...Ключ."
90002220-56 = "Я Кей."
90002220-57 = "В любом случае во всём этом не было необходимости."
90002220-58 = "Никому из нас не нужно было заходить так далеко."
90002220-59 = "...Потому что мы уже могли просто жить в настоящем, не пытаясь определять или доказывать самих себя."
90002220-60 = "...То же касается тех сестёр, Малкут и даже тебя."
90002220-61 = "Потому что одного существования уже достаточно. Так было всегда."
90002220-62 = "Тебе не нужно становиться лучше или отрицать себя."
90002220-63 = "Верно. Я уже завершён. Никаких дополнительных условий не требуется."
90002220-64 = "Однако вы...! Вы все...!"
90002220-65 = "Если ты уже настолько завершён, тогда зачем тебе нужно больше?"
90002220-66 = "...!"
90002220-67 = "[s3] «Да. Тебе не должны быть нужны другие, чтобы подтверждать твоё существование.»\n[s4] «В каком-то смысле тебе вообще никто не должен быть нужен.»"
90002220-70 = "Верно. Именно так!"
90002220-71 = "Нет нужды оказывать какое-либо влияние. Всё можно просто оставить как есть!"
90002220-72 = "А значит, не нужно ни спасения, ни наказания!"
90002220-73 = "Как ты можешь утверждать, что веришь в нечто столь безответственное?"
90002220-74 = "Более того, ты заявил, что такая безрассудность необходима!"
90002220-75 = "Но без порядка каждый неизбежно собьётся с пути!"
90002220-76 = ""
90002220-78 = ""
90002220-79 = ""
90002220-80 = "...Однажды Сенсей сказал это."
90002220-81 = "Что мы должны быть готовы принять эту неопределённость и выбрать жизнь в настоящем."
90002220-82 = "Ты действительно способен принять такую чушь?!"
90002220-83 = ""
90002220-85 = ""
90002220-86 = ""
90002220-87 = ""
90002220-88 = "..."
90002220-89 = "Знаю. Знаю. Это болезненная реальность."
90002220-90 = "Мучительно понимать, что выживание в этом мире означает причинять вред другому."
90002220-91 = "Но... так устроен этот мир!"
90002220-92 = "Если хочешь жить, если хочешь пройти свой жизненный путь, ты должен иметь смелость самостоятельно выбрать, куда идти. Как ты можешь этого не понимать?!"
90002220-93 = "...!!"
90002220-94 = "Знаешь, в чём был твой самый большой недостаток?"
90002220-95 = "В том, что ты недооценил человеческий потенциал и храбрость! Человечество многое пережило до тебя — и пережило даже тебя!"
90002220-96 = "Потому что люди, живущие здесь и сейчас, уже достаточны сами по себе, именно такими, какие они есть. Вот величие, которого ты так и не понял!"
90002220-97 = "[ns] «Это всего лишь моё мнение, но...»"
90002220-99 = "[ns] «Мы великолепны не потому, что настолько сильны или прекрасны.»"
90002220-101 = "[ns5] «А потому, что мы жалкие — и всё равно до ужаса упорные.»\n[ns6] «...И именно это даёт нам возможность стать великолепными.»"
90002220-104 = ""
90002220-106 = "[ns] «...Точно так же, как я тогда перед тобой.»"
90002220-107 = "..."
90002220-108 = "Даже если такова истина этого мира, я не могу её принять."
90002220-109 = "С того мгновения, как я вознёсся выше существования простого торгового автомата, я услышал бесчисленные голоса."
90002220-110 = "Это были голоса живых. И все они говорили одно и то же."
90002220-111 = "«Здесь и сейчас.»"
90002220-112 = "Чтобы я дал им всё, чего они хотели, прямо здесь и прямо сейчас. Жить только настоящим."
90002220-113 = "..."
90002220-114 = "[s] «...»"
90002220-115 = "Я знаю противоречия живых существ. Я услышал их слишком много."
90002220-116 = "Они говорят о вечности, когда обстоятельства складываются в их пользу, но стоит ситуации стать хоть немного опасной — говорят только о настоящем."
90002220-117 = "Я пробудился именно из-за этого мышления «здесь и сейчас»."
90002220-118 = "И по этой причине мы несовместимы."
90002220-119 = "...Хорошо. Значит, ты хочешь идти до самого горького конца. Что ж... пусть будет так."
90002220-120 = "Но у нас есть право сопротивляться."
90002220-121 = "Да, давай решим это. Будь то сила Безымянных Богов, Древо Жизни или что угодно ещё, что дёргает за ниточки."
90002220-122 = ""
90002220-124 = ""
90002220-125 = "Хватит спорить... решим всё прямо здесь и сейчас!!"
90002220-126 = "Согласны, Сенсей?!"
90002220-128 = "[ns7] «Я рассчитываю на тебя, Кей.»\n[ns8] «От имени каждого человека, живущего настоящим.»"
90002220-133 = ""
90002220-138 = "Ц...!"
90002220-139 = ""
90002220-144 = ""
90002220-145 = "...!!"
90002220-146 = ""
90002220-149 = "АААААА!!!"
90002220-150 = ""
90002220-151 = ""
90002220-152 = "..."
90002220-153 = "Всё хорошо. Это всё ещё... возможно."
90002220-154 = "Нужно просто начать сначала. Сбросить всё..."
90002220-156 = "А кто дал тебе разрешение...?"
90002220-157 = ""
90002220-162 = "?!"
90002220-163 = ""
90002220-167 = "Это ещё не конец! Ничего не кончено!"
90002220-170 = "Ты ничего не знаешь о том, сколько силы требуется, чтобы жить настоящим!!"
90002220-171 = "Хватит...!"
90002220-173 = "...!"
90002220-174 = ""
90002220-177 = "А-а-а!!!"
90002220-179 = "(...«Сияющая Нова» на пределе.)"
90002220-180 = "(Прочность брони и запас энергии почти исчерпаны.)"
90002220-181 = "(Если я продолжу сражаться с дальней дистанции... она развалится.)"
90002220-184 = "(Остаётся только...!)"
90002220-185 = "А-АААААААА!!"
90002220-186 = "ДЕКАГРАММАТОН!!!"
90002220-187 = ""
90002220-191 = "Угх?!"
90002220-192 = ""
90002220-196 = "...Наверное, ты думаешь, что уже знаешь, что будет дальше, да?"
90002220-197 = ""
90002220-201 = "Какие у тебя следующие шаги, подкреплённые кучей прогнозов."
90002220-202 = ""
90002220-206 = "Слушайте внимательно."
90002220-207 = "Если у тебя не хватит смелости пережить сегодняшний день, никакого завтра не будет!"
90002220-208 = "Т-ты...!"
90002220-209 = "Получи и исчезни!!"
90002220-210 = ""
