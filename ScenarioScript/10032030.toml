[translation]
10032030-1 = "Эпизод 3;Монополия на добычу"
10032030-11 = ""
10032030-14 = ""
10032030-15 = ""
10032030-16 = ""
10032030-17 = ""
10032030-18 = ""
10032030-19 = ""
10032030-20 = "...Что..."
10032030-21 = ""
10032030-23 = ""
10032030-24 = "ЧТО ЭТО ТАКОЕ?!"
10032030-25 = ""
10032030-26 = "Ха-ха-ха! На Ару всегда можно рассчитывать, когда нужны самые смешные реакции!"
10032030-27 = "Чего ты так удивилась? Во время нашего расследования мы нашли всех этих подозрительных людей. И заодно притащили бомбы, которые нашли у них!"
10032030-28 = "Насколько мы можем судить, они не подчинённые Аранчино. Они есть в списке гостей, но мы не нашли ничего, что подтверждало бы их принадлежность к какой-либо организации."
10032030-29 = "Скорее всего, это террористы или члены конкурирующей организации."
10032030-30 = "...И мы нашли их всего лишь после беглого осмотра. Внутри, наверное, ещё целая куча."
10032030-31 = "Да я, конечно, всё это понимаю! В этом-то и проблема! Как ты можешь говорить об этом настолько спокойно?!"
10032030-32 = "Террористов и бомб оказалось намного больше, чем мы рассчитывали! В миллион раз больше!"
10032030-33 = "Люди должны приходить в Оперный театр смотреть оперу, а не проводить тайные операции и причинять кому-то вред!"
10032030-34 = "[s1] «Эм... Ты сама себя слышишь?!»\n[s2] «...Ну, по крайней мере, она понимает иронию?»"
10032030-37 = "Почему вы цепляетесь к мелким и несущественным деталям, Сенсей?! Нам нужно срочно взять ситуацию под контроль!"
10032030-38 = "Если мы не выясним, зачем они устанавливают бомбы и проникают в Оперный театр, операция может...!"
10032030-39 = "Тьфу! Я думал, мы очень хорошо спрятали бомбы! Как они их нашли?!"
10032030-40 = "Серьёзно, только настоящий профи мог их вынюхать."
10032030-41 = ""
10032030-43 = ""
10032030-44 = "Считайте, вам не повезло. Наш специалист по взрывчатке довольно хорош."
10032030-45 = "Харука за день может установить гораздо больше бомб, чем вы. Конечно, она знает, куда такие зародыши преступников, как вы, стали бы их прятать."
10032030-46 = "Хех. Хи-хи-хи. Хи-хи."
10032030-47 = "Да она их практически с закрытыми глазами нашла. Вы что, новенькие в этом деле?"
10032030-48 = ""
10032030-50 = ""
10032030-52 = ""
10032030-53 = "Т-Ты кого новичками назвала?!"
10032030-54 = "Вы вообще кто такие, а?! Аранчино вас прислал с нами разбираться?!"
10032030-55 = ""
10032030-57 = ""
10032030-58 = ""
10032030-59 = ""
10032030-60 = "Вы закончили? По-моему, вы совсем не понимаете, в каком положении сейчас находитесь."
10032030-61 = "Акх!"
10032030-62 = "М-Мы ничего не знаем! Клянусь! Я просто выполнял приказ убрать Аранчино!"
10032030-63 = "...Приказ, значит?"
10032030-64 = "Но бомбы привлекают слишком много внимания и приводят к куче лишних жертв. О чём вы вообще думали?"
10032030-65 = "Было столько способов получше кого-нибудь «убрать»."
10032030-66 = "Бомбы дают лучший шанс на успех, разве нет? Мы просто действуем эффективно!"
10032030-67 = "И кому вообще есть дело до жертв?"
10032030-69 = ""
10032030-71 = ""
10032030-72 = "Цель оправдывает средства, верно? Наверное, не мне на это злиться."
10032030-73 = "...На кого вы работаете? Сколько вас?"
10032030-74 = "Э, не знаю точно. Наверное, несколько человек."
10032030-75 = ""
10032030-77 = ""
10032030-78 = "Погодите! Я понял! Вы здесь по тому же приказу! Вы тоже пытаетесь его достать!"
10032030-79 = "Слушайте, я подумал, что вы прихвостни Аранчино, потому что напали на нас и всё такое, но мы ведь не враги!"
10032030-80 = "Вы нам — мы вам! Ну же! Если объединимся, всё будет проще простого."
10032030-81 = "Мы же практически одинаковые! Эй! Ты меня вообще слушаешь? Девчонка, которая смахивает на главаря, ну же!"
10032030-82 = "Ты слушаешь—"
10032030-83 = ""
10032030-85 = ""
10032030-86 = ""
10032030-87 = "...меня...?"
10032030-88 = ""
10032030-90 = ""
10032030-93 = "А-а-а?!"
10032030-94 = ""
10032030-96 = ""
10032030-97 = ""
10032030-98 = "[ns4] «И-и-и... Они вырублены.»\n[ns5] «Не связывайтесь с Харукой...»"
10032030-99 = ""
10032030-100 = ""
10032030-102 = ""
10032030-103 = "...Кто..."
10032030-104 = "Кто позволил вам быть настолько наглыми...?"
10032030-105 = "Вы смеете обращаться к нашей уважаемой Ару на «ты»? Называть её «ДЕВЧОНКОЙ, КОТОРАЯ СМАХИВАЕТ НА ГЛАВАРЯ»?!"
10032030-106 = "Вы сравниваете себя с Ару?! Ставите себя с ней на один уровень?"
10032030-107 = "...Непростительно..."
10032030-108 = "Непростительно! Непростительно, непростительно, непростительно, непростительно!"
10032030-109 = ""
10032030-112 = ""
10032030-115 = "А-а-ай! Пощадите! Я ничего такого не имел в виду! Честно! Серьёзно!"
10032030-117 = ""
10032030-118 = ""
10032030-119 = "Хватит, Харука."
10032030-120 = "...!!"
10032030-121 = "...Д-Да, мэм!"
10032030-122 = "Полагаю, я понимаю вашу задумку. Просто не усложняйте себе жизнь и сровняйте весь Оперный театр с землёй."
10032030-123 = "Не могу сказать, что это нелогично. Ни план, ни ваша просьба."
10032030-125 = "Т-Тогда..."
10032030-126 = ""
10032030-129 = "...Но у меня для вас только плохие новости."
10032030-130 = "Видите ли, Решалы 68 не работают с мелкой сошкой вроде вас."
10032030-131 = ""
10032030-133 = ""
10032030-134 = "Что, простите?!"
10032030-135 = "Сначала называете нас новичками, теперь мелкой сошкой?! Всё, больше сдерживаться не буду!"
10032030-136 = "Думаете, вы та-а-акие большие и сильные, раз поймали нас, да?! Вы даже не представляете, сколько наших людей засело в Оперном театре!"
10032030-137 = "Вот узнают они, как вы сейчас с нами обращаетесь, и—"
10032030-139 = "...Знаете, а вы правы."
10032030-140 = ""
10032030-142 = ""
10032030-143 = "В таком случае сделаем так, чтобы они об этом не узнали."
10032030-144 = ""
10032030-147 = "А-а-а!"
10032030-148 = ""
10032030-150 = ""
10032030-151 = ""
10032030-153 = ""
10032030-154 = "Как вы и говорили, босс."
10032030-155 = "Х-Хорошо..."
10032030-156 = "Слушайте внимательно. Наша цель — босс, Дон Аранчино."
10032030-157 = "Решалы 68 всегда доводят дело до конца. Мы не верим в сотрудничество. Он наш и только наш."
10032030-158 = "Мы повторно проверим всех в Оперном театре до прибытия цели. Нам нужно лучше понимать текущую ситуацию."
10032030-159 = ""
10032030-161 = ""
10032030-163 = ""
10032030-164 = "Ох. Прямо всё здание? Работы будет выше крыши."
10032030-165 = "Она права. Это займёт много времени. Но у нас есть список гостей, так что ничего невозможного."
10032030-166 = ""
10032030-168 = ""
10032030-170 = ""
10032030-171 = "Задание всё то же. Мы его выполним и получим деньги. Именно так мы работаем."
10032030-172 = "Либо они заключают сделку со мной, боссом, либо они препятствия. Помехи. А вы знаете, что я делаю с помехами."
10032030-173 = ""
10032030-175 = ""
10032030-176 = "Что ж."
10032030-177 = ""
10032030-179 = ""
10032030-181 = ""
10032030-182 = "А-Ару! Ару...!!"
10032030-183 = ""
10032030-185 = ""
10032030-187 = ""
10032030-188 = "*вздыхает*"
10032030-189 = "Вот именно это я и имела в виду, Сенсей."
10032030-190 = "Я знаю, что она сказала, но босс..."
10032030-191 = "[s6] «Не волнуйся. Я понял, что она хотела сказать.»\n[s7] «Ну, Ару есть Ару, понимаешь?»"
10032030-194 = "Хи-хи. Ару не из тех, кто способен просто бросить такую ситуацию."
10032030-195 = "Она строит из себя крутую, но на самом деле беспокоится о горожанах."
10032030-196 = "Это куда веселее, чем я ожидала. Хи-хи."
10032030-197 = "И раз уж об этом..."
10032030-198 = "...Мы ещё немного побудем на вашем попечении, Сенсей."
