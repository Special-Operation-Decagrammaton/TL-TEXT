[translation]
1006302-1 = "Обитатель комнаты самоанализа"
1006302-2 = "Я отправился встретиться с Коюки в здании в самом центре Миллениум."
1006302-3 = "Я редко бывал в этом здании, и охранялось оно на удивление серьёзно."
1006302-4 = "[s1] «В Миллениум есть такое место?»\n[s2] «Коюки находится в таком месте?»"
1006302-7 = "...А! Этот голос!"
1006302-8 = ""
1006302-13 = "Сенсей! Сенсей! Сюда! Я здесь!"
1006302-14 = ""
1006302-19 = "Сенсей! Сенсе-э-эй!"
1006302-20 = "[s3] «...Коюки?!»\n[s4] «Эта дверь заперта!»"
1006302-23 = ""
1006302-30 = "Сенсей! Это правда вы, Сенсей!"
1006302-31 = "Вы сможете открыть дверь, Сенсей! У вас есть полномочия!"
1006302-32 = "Только вы сейчас можете мне помочь! Вы же не бросите меня здесь, правда?!"
1006302-33 = "[s5] «Успокойся. Я уже иду.»\n[s6] Я открыл дверь и вошёл."
1006302-37 = ""
1006302-39 = ""
1006302-44 = "Сенсей! Это и правда вы, Сенсей!"
1006302-45 = "Огромное спасибо, что пришли! Если бы вы не..."
1006302-46 = "То, что, как мне казалось, могло случиться..."
1006302-47 = "Это слишком ужасно, чтобы даже думать!"
1006302-48 = "А? Хотите знать, к чему такая спешка?"
1006302-49 = "Эм..."
1006302-50 = "Ну разве это не стоит решить вместе?"
1006302-51 = ""
1006302-53 = ""
1006302-56 = "Чем хотите заняться? Выбирайте, Сенсей!"
1006302-57 = ""
1006302-59 = ""
1006302-60 = ""
1006302-61 = "Хм? Вы не понимаете, из чего выбираете...? Ну, ничего конкретного я и не придумала!"
1006302-62 = ""
1006302-64 = ""
1006302-65 = "В конце концов, это Комната самоанализа... А меня поймали, поэтому я застряла здесь до завтрашнего вечера..."
1006302-66 = "И никто не хочет приходить, кроме как принести мне еду, так что..."
1006302-67 = "Мне та-а-ак скучно..."
1006302-68 = ""
1006302-70 = ""
1006302-71 = "Н-Но! Но сейчас это неважно! Сейчас важно решить, во что мы будем играть!"
1006302-72 = "[s7] «Подожди. То есть никакой настоящей проблемы у тебя нет?»\n[s8] «Ты притащила меня сюда просто поиграть?»"
1006302-75 = "Что?!"
1006302-76 = "У меня есть проблема, есть! Вы только посмотрите, какая я измученная и несчастная!"
1006302-77 = "[s] «...»"
1006302-78 = ""
1006302-81 = "[ns9] «...?»\n[ns10] «И чем же ты измучена?»"
1006302-84 = "...Ха!"
1006302-85 = "Сенсей, просто оглянитесь! Посмотрите на стены этой крошечной Комнаты самоанализа! Я заперта здесь уже целый день!"
1006302-86 = "...А?"
1006302-87 = "Хотите знать, почему меня сюда заперли? И почему я просто не уйду, если так хочу?"
1006302-88 = "Ха-ха, Сенсей! Почему вы сегодня такой непонятливый?"
1006302-89 = "Да уйти-то вообще не проблема!"
1006302-90 = "Проблема в том, что будет ПОСЛЕ того, как я уйду."
1006302-91 = "В ту же секунду! В ту же самую секунду, как они узнают, что меня нет, все из Семинара и C&C начнут носиться туда-сюда, а потом..."
1006302-92 = ""
1006302-94 = ""
1006302-95 = "...А потом...!"
1006302-96 = "Так что, очевидно, я не могу рисковать, пока не придумаю безотказный план, как не попасться!"
1006302-97 = "Поэтому пока ничего не придумала, мне остаётся сидеть тихо. Ладно? Теперь понятно?"
1006302-98 = "[s11] «...Эх...»\n[s12] «(Я понял только то, что ты вообще ни о чём не жалеешь...)»"
1006302-101 = "Ладно! Мы слишком долго говорили о всякой унылой фигне! Пора сосредоточиться. Во что хотите поиграть, а?"
1006302-102 = "Хм? Что это?"
1006302-103 = "О, вижу, вы заметили результат моих стараний! Глаз-алмаз, Сенсей!"
1006302-104 = "Ха-ха, ага! Тут вообще-то намного уютнее, чем можно было бы ожидать от Комнаты самоанализа!"
1006302-105 = "Меня сюда так часто запирают, что это уже почти моя личная комната. Ниха!"
1006302-106 = "[s] «...»"
1006302-107 = "Надо было мыслить нестандартно, понимаете?"
1006302-108 = "Если это практически моя комната... значит, надо украсить её как свою комнату! Если я всё равно постоянно здесь застреваю, пусть хотя бы будет приятно!"
1006302-109 = "Но я на этом не остановилась! Тут не только мило и уютно, знаете? Ещё здесь куча укромных местечек, куда никому и в голову не приходит заглядывать!"
1006302-110 = ""
1006302-112 = ""
1006302-113 = "Так что... Та-дам! Я спрятала тут целую кучу настольных игр!"
1006302-114 = "[s13] «...Что?!»\n[s14] «Эта комната вообще-то предназначена для самоанализа...»"
1006302-117 = "Нияха-ха! Рано ещё так удивляться! Потому что... у меня под диваном спрятаны закуски! А за фонтанчиком — манга!"
1006302-118 = "Так что если я найду кого-то для компании, это вообще идеальное убежище! Ну разве я не гений? Если уж меня здесь запирают, я сделаю это место приятным!"
1006302-119 = "Ну как? Потрясающе, да? Люди бесконечно приспосабливаются! Какие бы невзгоды ни случились, мы найдём выход!"
1006302-120 = ""
1006302-122 = ""
1006302-124 = "...А? Что у вас с лицом, Сенсей?"
1006302-125 = "Ниха-ха-ха! Я вас удивила, да? Даже вы ошеломлены моей сообразительностью!"
1006302-126 = "[s15] «Ну, это действительно немного удивляет...»\n[s16] «Хотя, возможно, не совсем в том смысле, который ты имеешь в виду...»"
1006302-129 = "Не стесняйтесь, Сенсей! Моё — ваше! Чувствуйте себя как дома! Возьмите что-нибудь перекусить!"
1006302-130 = "Выбирайте любую игру! Ночь только начинается! Или день только начинается! Или сколько там сейчас времени!"
1006302-131 = "Ах."
1006302-132 = "Наверное, и так очевидно, но никому об этом не говорите, ладно? Ниха-ха-ха!"
1006302-133 = ""
1006302-137 = "Мы с Коюки играли в настольные игры в Комнате самоанализа до поздней ночи."
1006302-138 = ""
1006302-141 = "А как только я вернулся в Шале, сразу сообщил Семинару о переделках Коюки."
