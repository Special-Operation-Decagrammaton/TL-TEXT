[translation]
1000408-1 = "Странная ночь"
1000408-2 = "Здание Префектурной команды Геенны"
1000408-3 = "Была поздняя праздничная ночь. Вокруг никого."
1000408-4 = "Свет горел только в кабинете главы Префектурной команды."
1000408-7 = "Перед кабинетом главы Префектурной команды"
1000408-9 = "*тук* *тук*"
1000408-10 = "..."
1000408-11 = "Ответа не было."
1000408-12 = "*тук* *тук* *тук*"
1000408-13 = "..."
1000408-14 = "[s] Войти."
1000408-17 = ""
1000408-18 = ""
1000408-19 = "А...? С-Сенсей?"
1000408-20 = "[s] «Я пришёл помочь.»"
1000408-21 = "Ты хочешь помочь мне с работой...?"
1000408-22 = "В такой час?"
1000408-23 = "Я ценю заботу, но это моя ответственность. Не думаю, что здесь есть что-то для тебя."
1000408-24 = "[s] «Тогда я просто побуду рядом.»"
1000408-25 = "..."
1000408-26 = "...Как хочешь."
1000408-28 = "Я сел рядом с Хиной и стал смотреть, как она работает."
1000408-29 = ""
1000408-30 = ""
1000408-31 = "*шуршание* *шуршание*"
1000408-32 = "..."
1000408-33 = ""
1000408-34 = "*шуршит* *шуршит* *шуршит*"
1000408-35 = "..."
1000408-36 = ""
1000408-37 = "*шуршит* *шуршит* *шуршит*"
1000408-38 = "Так не пойдёт."
1000408-39 = "Мне и так трудно сосредоточиться, а ты ещё сидишь и смотришь на меня."
1000408-40 = "..."
1000408-41 = "И почему здесь вдруг стало так жарко...?"
1000408-42 = "[s1] «У тебя лицо красное.»\n[s2] «У тебя жар?»"
1000408-43 = "П-Подожди! Что ты делаешь?!"
1000408-44 = "П-Подожди! Что ты делаешь?!"
1000408-45 = "[s] Приложить ладонь к её лбу."
1000408-46 = "А-Ах...!"
1000408-47 = "..."
1000408-48 = "..."
1000408-49 = "[s3] «Твой лоб весь горит.»\n[s4] «Твои щёки горят.»"
1000408-50 = "Е-Естественно. Наверное, потому что я уже несколько дней не спала."
1000408-51 = "Е-Естественно. Наверное, потому что я уже несколько дней не спала."
1000408-52 = "[s] «От недосыпа вообще бывает жар?»"
1000408-53 = "Конечно бывает! Организм естественным образом повышает температуру, компенсируя недостаток сна!"
1000408-54 = "[s5] Гладь, гладь, гладь.\n[s6] «Ты очаровательна, когда такая.»"
1000408-55 = ""
1000408-57 = ""
1000408-59 = "..."
1000408-60 = "Уф. Х-Хватит..."
1000408-63 = "..."
1000408-64 = "Я сказала прекрати!"
1000408-65 = ""
1000408-66 = ""
1000408-67 = "..."
1000408-68 = "Я вообще-то должна сейчас работать."
1000408-69 = "Когда ты гладишь меня по голове, становится так уютно, что хочется уснуть..."
1000408-70 = "[s] «Прости.»"
1000408-71 = "Не надо. Тебе не за что извиняться..."
1000408-72 = "..."
1000408-73 = "...Хаха."
1000408-74 = "Если подумать... сегодня странная ночь."
1000408-75 = "Никогда бы не подумала, что мы окажемся вдвоём в этом кабинете в такое время."
1000408-76 = "Когда ты рядом... кажется, я могла бы просто так и уснуть."
1000408-77 = "Хи-хи... Думаю... так и сделаю."
1000408-78 = "Так сонно... и уютно."
1000408-79 = "Сенсей..."
1000408-80 = ""
1000408-81 = "(плюх)"
1000408-82 = "Хина откинулась назад и растянулась у окна."
1000408-85 = "― ..."
1000408-88 = "― Когда ты так на меня смотришь... даже мне становится немного неловко.[wa:1940]"
1000408-91 = "― Не понимаю. Рядом с тобой мне так спокойно.[wa:4960]"
1000408-94 = "― Если честно... мне нравится видеть твою улыбку.[wa:2000]"
1000408-97 = "― ..."
1000408-100 = "— *вздох* Не хочу ни о чём думать.[wa:2040]"
1000408-103 = "― ..."
1000408-106 = "Так Хина и заснула."
1000408-107 = "Я накрыл её пальто и тихо вышел из комнаты."
