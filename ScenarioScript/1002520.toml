[translation]
1002520-1 = "Меняющееся и неизменное"
1002520-2 = "Я знаю, что ты занят. Ты уверен, что всё в порядке?"
1002520-3 = "[s] «Ага! Сегодня я свободен!»"
1002520-4 = "Слава богу..."
1002520-5 = "У меня такое чувство, что ты всегда так отвечаешь, даже когда занят."
1002520-6 = "[s] «Когда взрослый врёт, на то всегда есть веская причина...»"
1002520-7 = "Не пытайся меня убедить!"
1002520-8 = "В любом случае, давно у нас не было такого спокойного дня."
1002520-9 = "Погода хорошая, и ветерок приятный."
1002520-10 = "Здорово, когда есть время, в которое ничего не нужно делать."
1002520-11 = "[s] «Я рад, что могу провести время с тобой, Шун.»"
1002520-12 = "Серьёзно, ты меня смущаешь, когда говоришь такое!"
1002520-13 = "Иногда тебе нужно думать о том, как твои слова звучат со стороны!"
1002520-14 = "[s] «Хорошо, наставница Шун.»"
1002520-15 = "Ух. Ты опять меня дразнишь..."
1002520-16 = "[s] «Кстати, я заметил твою заколку...»"
1002520-17 = "А, это?"
1002520-18 = "Вообще-то это моя любимая заколка."
1002520-19 = "Мне кажется, пара ленточек выглядит очень мило."
1002520-20 = "Да, я люблю носить два хвостика."
1002520-21 = "Мне нравится, как они подпрыгивают на плечах, когда я бегаю или прыгаю."
1002520-22 = "Вообще-то... я выбрала заколку, похожую на ту, которую обычно ношу..."
1002520-23 = "...потому что мне так нравится этот дизайн."
1002520-24 = "[s1] «Если тебе так нравится эта причёска, носи её чаще.»\n[s2] «Почему тогда ты не носишь её чаще?»"
1002520-25 = "Эм... Не думаю, что это действительно уместно."
1002520-26 = "Эм... Не думаю, что это действительно уместно."
1002520-27 = "Мне было бы немного неловко ходить с хвостиками и ленточками..."
1002520-28 = "Думаю, детские воспоминания лучше оставить в прошлом."
1002520-29 = "[s] «Но то, что тебе нравится, не меняется из-за возраста, знаешь?»"
1002520-30 = "Хм?"
1002520-31 = "..."
1002520-32 = "Ты правда думаешь, что есть вещи, которые не меняются?"
1002520-33 = "[s3] «Невозможно, чтобы изменилось вообще всё, правда?» \n[s4] «Если есть вещи, которые меняются, значит, должны быть и те, что не меняются.»"
1002520-34 = "Хи-хи. Что это вообще за логика?"
1002520-35 = "Хи-хи. Что это вообще за логика?"
1002520-36 = "Но ладно... То, что не меняется... То, что мне нравится..."
1002520-37 = "Хи-хи-хи. Почему-то мне стало так хорошо."
1002520-38 = "Лицо горит от смущения."
1002520-39 = "[s] «Ты в порядке? Тебе дать лекарство от аллергии?»"
1002520-40 = "..."
1002520-41 = "Ты вообще не понял, Сенсей!"
1002520-42 = "[s] «Не кричи на меня...»"
1002520-43 = "Не веди себя как ребёнок. Я не буду тебя жалеть!"
1002520-44 = ""
1002520-46 = ""
1002520-50 = "Аргх! Что ты делаешь?!"
1002520-51 = "А? «Выше и выше», чтобы мне стало лучше?"
1002520-52 = "[s] «Выше и выше!»"
1002520-53 = "Ааа, щекотно! П-Пожалуйста, опусти меня. Это весело, но..."
1002520-55 = "Мне стало лучше?"
1002520-56 = "Эм... Да, можно и так сказать."
1002520-57 = "Вообще-то я даже не злилась."
1002520-58 = "Я хочу, чтобы ты мне кое-что пообещал..."
1002520-59 = "[s] «Что это?»"
1002520-60 = "Позже..."
1002520-61 = ""
1002520-63 = ""
1002520-64 = ""
1002520-65 = "Когда я снова стану взрослой, не смейся надо мной, если я буду носить два хвостика."
1002520-66 = "Хорошо?"
