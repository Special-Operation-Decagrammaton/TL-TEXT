[translation]
10038070-1 = "Эпизод 7;Если отправишься в путь, встретишь ли цилиня?"
10038070-7 = "Мы добрались, Сенсей. Тайное убежище Променада Чёрной Черепахи."
10038070-8 = "Не могу поверить, что мы добрались сюда, Сенсей..."
10038070-9 = "[s] «Это благодаря вам обеим, Мина, Рэйдзё.»"
10038070-10 = "Что ж, без ваших указаний мы бы не справились, Сенсей."
10038070-11 = "Верно, Мина? ...Она спит. Неудивительно. Не волнуйтесь, с ней всё хорошо."
10038070-12 = "А вы, госпожа?"
10038070-14 = "Мне...стыдно, и я у вас всех в долгу, но я не ранена."
10038070-15 = "Нечего стыдиться! Всё в порядке!"
10038070-16 = "...Если вы так говорите."
10038070-17 = ""
10038070-19 = ""
10038070-20 = "......"
10038070-21 = "Хотя было близко. Для Кисаки всё могло закончиться куда хуже."
10038070-23 = "И Шинтани Кай теперь вернулась. Уже одно это — серьёзная проблема. Но..."
10038070-24 = ""
10038070-27 = ""
10038070-28 = "......"
10038070-30 = "...если пока отложить это в сторону, как насчёт того, чтобы нам с тобой вернуться на Променад, Рэйдзё?"
10038070-31 = ""
10038070-34 = ""
10038070-35 = "А? Без президента?"
10038070-36 = "Да, именно."
10038070-37 = "К-К чему ты клонишь?"
10038070-38 = "Давай просто поторопимся."
10038070-39 = "Эй, Руми, не надо так надрываться! ...Ты же ребёнок. Я всё-таки сильнее тебя...!"
10038070-40 = ""
10038070-42 = ""
10038070-45 = "[ns] «Ну вот, ушли.»"
10038070-46 = "...И правда."
10038070-47 = "[s] «Кисаки, ты точно в порядке?»"
10038070-48 = ""
10038070-50 = ""
10038070-51 = "...Да. Никаких проблем."
10038070-52 = "[s] «Поверю тебе на слово...»"
10038070-55 = "Неловкое молчание продолжалось."
10038070-58 = ""
10038070-59 = "Кисаки не поднимала головы, глядя в пол."
10038070-60 = ""
10038070-63 = "[ns] «Расскажешь мне о Кай?»"
10038070-64 = ""
10038070-66 = ""
10038070-67 = "Шинтани Кай... Вы хотите знать?"
10038070-68 = "...Нет смысла. Это давняя история."
10038070-69 = ""
10038070-71 = ""
10038070-72 = "......"
10038070-73 = "Помните тот наш разговор?"
10038070-74 = "Когда я рассказывала вам о... первом решении, которое приняла, став новым президентом?"
10038070-75 = "[s] «Об исключении какой-то третьекурсницы?»"
10038070-76 = "Да. Как вы, возможно, уже догадались, тем студентом была..."
10038070-77 = "[s] «Кай.»"
10038070-78 = "Есть..."
10038070-79 = ""
10038070-81 = "Как я уже говорила, это решение не пользовалось популярностью."
10038070-82 = "Даже если это БЫЛО правильное решение, со всех сторон требовали соблюсти протокол, процедуру, законность..."
10038070-83 = "Но решение приняла я одна."
10038070-84 = ""
10038070-88 = "А раз воду разлил — обратно её уже не соберёшь."
10038070-91 = "...Шинтани Кай хотела стать мудрецом."
10038070-92 = "Она пыталась создать зелье, которое даровало бы ей просветление. Другим студентам она говорила, что делает эликсир бессмертия. Они поверили ей и захотели участвовать в её проекте."
10038070-93 = "И она дала им его испытать."
10038070-96 = ""
10038070-98 = ""
10038070-99 = ""
10038070-101 = ""
10038070-102 = "Она держала своих последователей в руках. Они стали просить её делать для них особые зелья с уникальными эффектами."
10038070-104 = "Поначалу результаты были впечатляющими..."
10038070-105 = "...но эффект быстро проходил, а вред здоровью оставался надолго."
10038070-108 = ""
10038070-111 = ""
10038070-112 = ""
10038070-113 = ""
10038070-115 = ""
10038070-118 = "Студенты, желавшие получать высокие оценки по физкультуре, пили зелья, усиливавшие силу и скорость... но те заодно нарушали обмен веществ."
10038070-119 = "Студенты, желавшие попробовать новые вкусы, пили зелья, которые навсегда изменяли их вкусовое восприятие."
10038070-122 = "Разумеется, Кай была не единственной, кто устраивал неприятности своими зельями. Сая тоже этим грешила."
10038070-123 = "Но Сая лишь хотела, чтобы её зелья делали людей счастливыми."
10038070-124 = "А тем, кто страдал от побочных эффектов, она всегда бесплатно давала противоядие."
10038070-125 = "Бессмертие противоречит всем законам природы. Назвать последствия всего лишь «побочными эффектами» было бы преуменьшением."
10038070-126 = "В случае Саи она, похоже, поняла, что настоящее счастье нельзя просто раздать всем бесплатно по бутылкам."
10038070-127 = ""
10038070-129 = ""
10038070-130 = "Но Кай была... куда упрямее. Одержимой. Её волновал лишь результат. Всё, что могло сделать её мудрецом, было для неё важнее всего."
10038070-131 = "Когда последователи умоляли её дать противоядие, она заставляла их его отрабатывать. Вынуждала исполнять каждый её приказ."
10038070-132 = "Студенты, приходившие к Кай за помощью или удовольствием, в итоге становились её рабынями."
10038070-133 = "...Очевидно, Гэнрюмон это не устраивало."
10038070-134 = "И не только по очевидным этическим причинам: Шинтани Кай фактически создала новую фракцию, совершенно не считаясь с их властью."
10038070-135 = "[s] «Звучит как пороховая бочка.»"
10038070-136 = ""
10038070-138 = ""
10038070-139 = ""
10038070-140 = "Позвольте спросить вас, Сенсей: вы знакомы с историей об обезьяньей лапе?"
10038070-141 = "О волшебном талисмане, исполняющем желания, но всегда извращённым образом."
10038070-142 = "Это хорошая метафора для ситуации, когда цена цели становится слишком неприятной, слишком высокой."
10038070-144 = "Кроме того, это было одно из прозвищ Шинтани Кай."
10038070-145 = "Возможно, я и правда действовала с ней слишком поспешно..."
10038070-146 = "...но я была уверена: если позволить ей бесчинствовать хотя бы ещё один день, Саньхайцзин пошатнулся бы до самого основания."
10038070-147 = "Но даже так исключить студента из школы — непростое решение."
10038070-148 = "Особенно в Саньхайцзине, с его знаменитой боязнью перемен и исключений из правил."
10038070-149 = "Фуфу. Если бы я решила пройти все положенные процедуры, Кай, возможно, успела бы выпуститься раньше, чем я смогла бы её исключить."
10038070-150 = ""
10038070-152 = "Поэтому я приняла беспрецедентное решение — исключить её немедленно."
10038070-153 = "А затем удалила все записи о её исследованиях, чтобы никто не смог повторить её работу."
10038070-155 = "...Возможно, происходящее сейчас — моя карма за это."
10038070-156 = ""
10038070-161 = ""
10038070-162 = "Кай имеет полное право ненавидеть меня."
10038070-163 = "Что бы она ни делала раньше, она не стремилась к мести, пока я сама не наполнила её сердце всей этой отравой."
10038070-164 = ""
10038070-168 = "Как она и сказала, для меня она была всего лишь небольшой жертвой во имя общего блага."
10038070-171 = "Я не стану оправдываться. Это было бы трусостью."
10038070-172 = "Мои действия, мои решения создали того монстра, которым Кай стала сейчас. Того, кто причиняет вред Саньхайцзину."
10038070-173 = ""
10038070-175 = ""
10038070-176 = "«Бури, пожары, наводнения...»"
10038070-177 = "«Вся ответственность — без всяких оправданий.» Она была права. Вот что значит быть президентом."
10038070-178 = ""
10038070-181 = "[ns] «Я так не считаю.»"
10038070-182 = ""
10038070-184 = ""
10038070-185 = "...Что вы имеете в виду, Сенсей?"
10038070-186 = "[s1] «Ты приняла своё решение, а она — своё.»\n[s2] «Кай должна сама отвечать за собственный выбор.»"
10038070-189 = "Вы хотите сказать, что именно Кай решила стать такой, какая она сейчас...?"
10038070-190 = "Но..."
10038070-191 = "[s3] «Не всё можно описать простыми словами.»\n[s4] «Как и прошлое Саньхайцзина, всё куда сложнее.»"
10038070-194 = "......"
10038070-195 = "[s5] «Не забывай, за что мы отвечаем сейчас.»\n[s6] «В настоящем мы всё ещё сами принимаем решения.»"
10038070-198 = "Но..."
10038070-199 = "[s7] «Совсем скоро этот миг тоже станет прошлым.»\n[s8] «И каждый день мы должны делать всё, что в наших силах.»"
10038070-202 = "Но тогда..."
10038070-203 = ""
10038070-207 = "[ns9] «Мы несём ответственность и перед будущим.»\n[ns10] «Нужно принимать решения, на которые потом можно будет оглянуться с гордостью.»"
10038070-210 = ""
10038070-211 = "...Так же, как мы уважаем наше прошлое и традиции."
10038070-212 = "Понимаю... Я никогда не смотрела на это с такой стороны."
10038070-213 = "......"
10038070-214 = ""
10038070-216 = ""
10038070-217 = "Многие студенты Саньхайцзина до сих пор сомневаются во мне."
10038070-218 = "Правление Кисаки никогда не было обычным."
10038070-219 = "......"
10038070-220 = ""
10038070-222 = ""
10038070-223 = "Вы знаете, как Академию Саньхайцзин воспринимают со стороны?"
10038070-224 = "Большинство даже не знает, где она находится. По сравнению с тремя крупнейшими академиями мы — крошечная точка на карте."
10038070-225 = "А те, кто всё-таки знает, где нас найти, обычно приходят лишь ради еды с Променада."
10038070-226 = "Они считают нас сборищем чудаков, прячущихся за традициями и обычаями."
10038070-227 = "Я это ненавидела. То, что они о нас думали, то, как с нами обращались."
10038070-228 = "Фуфу. Разговоры с вами всегда открывают мне что-то новое, Сенсей."
10038070-229 = "Не верите? Вам уже пора бы знать об этом своём удивительном таланте."
10038070-230 = ""
10038070-232 = ""
10038070-233 = "......"
10038070-234 = "Теперь путь вперёд стал немного яснее."
10038070-235 = "Спасибо, Сенсей. И я хочу попросить вас ещё об одном."
10038070-236 = ""
10038070-238 = ""
10038070-239 = "Мы ОБЯЗАТЕЛЬНО проведём Фестиваль лунного света."
10038070-240 = "А до тех пор... вы останетесь и поможете мне ещё немного?"
10038070-241 = "[s] «Как прикажете, госпожа президент.»"
10038070-242 = "Фуфу... Спасибо."
10038070-243 = ""
10038070-245 = ""
10038070-247 = ""
10038070-248 = ""
10038070-250 = "[ns] «К-Кисаки? Госпожа, что вы делаете?!»"
10038070-252 = "Что такое? Я всего лишь хочу, чтобы вы понесли меня на спине."
10038070-253 = "Это ваш первый приказ. Просто... постойте так ещё немного..."
10038070-254 = ""
10038070-259 = ""
10038070-262 = ""
10038070-263 = "Кисаки! Сенсей! Вы в порядке? Члены Променада Чёрной Черепахи хотят кое-что вам—"
10038070-264 = ""
10038070-266 = ""
10038070-268 = "*ахает*"
10038070-269 = "[s] «Эм...»"
10038070-270 = ""
10038070-272 = ""
10038070-273 = ""
10038070-274 = "Ч-Что вы двое делаете?!"
10038070-276 = "Э-Это... Ну..."
10038070-277 = "[s] «Ничего! Ничего не произошло! Правда, Кисаки?»"
10038070-278 = ""
10038070-280 = ""
10038070-282 = "Я тоже хочу покататься у тебя на спине, Сенсей!"
10038070-283 = "Так вот что ты имела в виду?!"
10038070-290 = ""
10038070-291 = "К-Кхм. Тогда начну сначала. Я привела членов Променада Чёрной Черепахи. Они хотят кое-что сказать."
10038070-292 = "Ох...? Редкий случай."
10038070-293 = "Люди с Променада хотят поговорить со мной? Лично?"
10038070-294 = "Н-Ну, сами поймёте, когда встретитесь. Заходите все."
10038070-295 = ""
10038070-304 = ""
10038070-306 = "Хм... Продолжайте. Я слушаю."
10038070-307 = ""
10038070-310 = ""
10038070-311 = ""
10038070-312 = ""
10038070-313 = ""
10038070-314 = "Гэнрюмон приветствует вас, госпожа!"
10038070-315 = ""
10038070-318 = ""
10038070-319 = "Хм?! Что происходит...?"
10038070-320 = "Хахаха! Удивлена? Члены Гэнрюмона попросили увидеться с тобой, Кисаки. Мне пришлось провести их тайком."
10038070-321 = "Нельзя же позволить им бегать по Променаду, пока ОНИ держат его под контролем, верно? Это вызвало бы кучу подозрений."
10038070-322 = "Вот поэтому они и пришли переодетыми!"
10038070-323 = ""
10038070-325 = ""
10038070-327 = "Саньхайцзину и Гэнрюмону нужны вы, госпожа. Все присутствующие с этим согласны."
10038070-328 = "Радикалы захватили Гэнрюмон и сбились с пути."
10038070-329 = "Они передали контроль Восточному алхимическому обществу и больше не справляются с ролью студсовета."
10038070-330 = "Поэтому мы пришли последовать за вами. Что бы вы ни решили, мы сделаем всё возможное, чтобы воплотить это в жизнь."
10038070-331 = ""
10038070-333 = ""
10038070-334 = ""
10038070-335 = "Гэнрюмон вновь ждёт ваших приказов, госпожа!"
10038070-336 = ""
10038070-338 = ""
10038070-339 = ""
10038070-340 = "...Хорошо."
10038070-341 = "......"
10038070-342 = ""
10038070-344 = ""
10038070-347 = "Слишком долго Саньхайцзин использовал прошлое не как фундамент, а как стену."
10038070-348 = "Вместо того чтобы искать ответы в его уроках, мы слепо служим его правилам. Послушание для нас важнее выбора и собственного суждения."
10038070-349 = "Но чтобы увидеть дорогу на много миль вперёд, нам нужно подняться ещё на один этаж башни. Мы должны идти по земле своими ногами и смотреть на небо своими глазами."
10038070-352 = "Этот миг, каждый миг — наша ответственность. Мы должны делать всё возможное и ждать воли небес."
10038070-353 = "Поддавшись страху и тревоге, мы ничего не добьёмся. Мы можем блуждать, но никогда не потеряем путь."
10038070-354 = "Теперь..."
10038070-355 = ""
10038070-357 = ""
10038070-359 = "Вернём же наш Саньхайцзин."
10038070-360 = ""
10038070-363 = ""
