[translation]
1600905-1 = "Девушка-ниндзя ничего не скрывает"
1600905-2 = "В итоге мы с Мичиру отправились в магазин, где продают товары для ниндзя... то есть инструменты ниндзюцу."
1600905-3 = ""
1600905-6 = "Сенсей, сюда!"
1600905-8 = ""
1600905-12 = ""
1600905-13 = "Мы пришли. Это мой самый любимый магазин!"
1600905-14 = "[s] «Уличная лавка? Странный магазин мерча.»"
1600905-15 = "Вахаха, правда? Это один из самых тщательно охраняемых секретов Кивотоса."
1600905-16 = "Но достопочтенный Сенсей! Я же говорила! Это магазин ниндзюцу, а не мерча!"
1600905-17 = "С возвращением! Девушка в косплее ниндзя! На свидании?"
1600905-18 = "[s] «Он сразу тебя узнал...»"
1600905-19 = "С-С-С-Свидании?!"
1600905-20 = "Чем могу помочь сегодня? У вас всегда такой хороший вкус, наверняка пришли за новинками."
1600905-21 = "Ха-ха-ха! Вот эта новая штука настоящая! Самый настоящий огнемёт! Для косплея лучше не найти!"
1600905-22 = "Я уже говорила, это не косплей!"
1600905-23 = "О! Простите, всё забываю наш сценарий."
1600905-24 = "Некоторые дамы такие требовательные. Наверное, с ней тяжело!"
1600905-25 = "[s] «Всё совсем не так.»"
1600905-26 = "Ик!"
1600905-27 = "Но хороший продавец должен удовлетворять требования клиента... Итак..."
1600905-28 = "Кодовое имя Ноль 13. Мадемуазель, что вам требуется?"
1600905-29 = "Нет! Просто нет! Неправильно! Это вообще не тот жанр! Ниндзя так не работают!"
1600905-30 = "О, хотя если смотреть широко, шпионская история с тайными операциями вполне может быть частью сюжета о ниндзя!"
1600905-31 = "[s] «По-моему, это уже натяжка.»"
1600905-32 = "Ха-ха-ха. Я попытался. Осматривайтесь сколько угодно. Приятного свидания!"
1600905-33 = ""
1600905-35 = ""
1600905-36 = "[ns] «Ну ладно.»"
1600905-37 = "А-А-ргх! Я же сказала, это не с-свидание! Это образовательная экскурсия! Что за чёрт?!"
1600905-38 = "*вдох* *выдох* Дыши..."
1600905-39 = "Хорошо. Я президент Клуба исследования ниндзюцу! Такая мелочь меня не смутит!"
1600905-40 = "Я должна сохранять ясный и спокойный разум."
1600905-41 = "А? Э-э-э?!"
1600905-42 = ""
1600905-44 = ""
1600905-45 = "Достопочтенный Сенсей! Смотрите, смотрите! Разве это не потрясающе?"
1600905-46 = "[s1] «А ты вроде собиралась сохранять спокойствие.»\n[s2] «Это пулемёт. И что?»"
1600905-47 = "И это всё, что вы скажете? Ну же, Сенсей!"
1600905-48 = "И это всё, что вы скажете? Ну же, Сенсей!"
1600905-49 = "Это не обычный пулемёт! Это проклятый злой пулемёт под названием «Зловещий Мураматлинг», который часто появляется в фильмах режиссёра Калико Нянгоро!"
1600905-50 = "Когда держишь этот пулемёт, тебя развращает душа древнего демонического ниндзя."
1600905-51 = "Конечно, немного нелепо, что он внезапно появляется и перескакивает между киновселенными. Фанаты либо обожают его, либо ненавидят, но всё же..."
1600905-52 = "Посмотрите на детализацию... Потрясающе! Сколько он стоит?!"
1600905-53 = "Что?! Два миллиона иен?!"
1600905-54 = "Уф... Как жаль... Похоже, придётся отказаться... А?"
1600905-55 = ""
1600905-57 = ""
1600905-58 = "О! Это постер ранней работы режиссёра Кайгенвуфвуфа?! Это оригинал? Серьёзно?! Ого, у хозяина магазина и правда потрясающий вкус!"
1600905-59 = "О! А это...!"
1600905-60 = "Не успел я ничего сказать, как Мичиру уже металась по магазину, восхищаясь каждой витриной."
1600905-62 = "Ого-о-о! Этот магазин забит невероятными вещами! Я могла бы смотреть на них часами, то есть днями!"
1600905-63 = "[s] «Похоже, тебе очень весело.»"
1600905-64 = "Вахаха! Конечно. Это место — настоящий сундук с сокровищами! Я слюной исхожу от одного взгляда!"
1600905-65 = "...О! Я-я просто... Простите, Сенсей! Я слишком разошлась."
1600905-66 = "Я притащила вас сюда через весь город... Может, я перебарщиваю...?"
1600905-67 = "[s3] «Нет, мне нравится видеть, как тебе весело.»\n[s4] «Одного взгляда на тебя хватает, чтобы зарядиться энергией.»"
1600905-68 = "О, правда? Хи... хи-хи... Ого, я краснею. Ну, энергии у меня действительно много."
1600905-69 = "О, правда? Хи... хи-хи... Ого, я краснею. Ну, энергии у меня действительно много."
1600905-70 = "[s] «За тобой всегда интересно наблюдать, Мичиру.»"
1600905-71 = "Это комплимент?!"
1600905-72 = "Я даже немного рада... что вы пошли со мной."
1600905-73 = "Что это? Мерч ниндзя? И где такое вообще использовать? Ха-ха-ха!"
1600905-74 = "А?"
1600905-75 = ""
1600905-78 = ""
1600905-79 = "Ха-ха-ха! Набор сюрикенов для новичков? «Взрывается через минуту!» Набор простых дымовых бомб?!"
1600905-80 = "Кто вообще покупает этот мусор? Так тупо! *хихикает*"
1600905-81 = "Отстой!"
1600905-83 = "[ns] «Они что-то слишком громкие... А? Мичиру?»"
1600905-84 = "Э-Э-э? Х-Хулиганы? Почему?!"
1600905-85 = ""
1600905-87 = ""
1600905-88 = ""
1600905-89 = "[s] «Мичиру? Ты в порядке?»"
1600905-90 = "*вдох* *выдох*"
1600905-91 = "Простите, я потеряла самообладание. Теперь всё нормально, Сенсей. С помощью ниндзюцу я сделаю разум чистым, как прозрачная вода..."
1600905-92 = "С-С-Спокойно... с-спокойно..."
1600905-93 = "[s] «У тебя голос дрожит... и руки тоже.»"
1600905-94 = "Уааа! То есть, что эти хулиганы вообще делают в моём святилище?!"
1600905-95 = ""
1600905-97 = ""
1600905-98 = ""
1600905-99 = "Сенсей, смотрите! Они лапают всё подряд... Как неуважительно!"
1600905-100 = "Они вообще ничего не знают о ниндзя. Как смеют называть это отстоем?"
1600905-101 = "Уходите! Проваливайте!"
1600905-102 = "[s] «Мичиру, ты разговариваешь со стеной.»"
1600905-103 = "Ну... Уф! М-Мне страшно кричать им это в лицо."
1600905-104 = "Лезть без плана немного рискованно..."
1600905-105 = "Н-Никогда не знаешь, что может случиться."
1600905-106 = "Я понимаю, это просто оправдание, но..."
1600905-107 = "Наверняка вы меня осуждаете..."
1600905-108 = "...Глупо, да? Я даже постоять за себя не могу. Только языком болтаю."
1600905-109 = "[s5] «Нет, я совсем не считаю тебя глупой. »\n[s6] «По-настоящему глупы те, кто создаёт проблемы.»"
1600905-110 = "О, Сенсей..."
1600905-111 = "О, Сенсей..."
1600905-112 = "Хи-хи! Это типа злой пулемёт? Мураматлинг? Всё тупее и тупее!"
1600905-113 = "...?!"
1600905-115 = "Если взять его в руки, злой пулемёт будет тобой управлять? Древняя... душа ниндзя? Что за бред?"
1600905-116 = "Сейчас нас одержит злой пулемёт! Давай проверим!"
1600905-117 = "*хихикает* Кому вообще нравятся тупые ниндзя? Такой отстой!"
1600905-118 = "Давай пробный выстрел..."
1600905-120 = "Это вы отстой!"
1600905-121 = ""
1600905-124 = ""
1600905-125 = "Ты ещё кто такая?"
1600905-126 = "Кто я?! Запоминайте моё имя, хулиганы! Я президент Клуба исследования ниндзюцу! Чидори Мичиру, самый могущественный ниндзя, которого вы когда-либо встретите!"
1600905-127 = "Ты вообще о чём несёшь?!"
1600905-128 = "Вам никогда не понять величия этого пулемёта! Немедленно положите его!"
1600905-129 = "Ты просто так в нас выстрелила!"
1600905-131 = "Заткнитесь! Я покажу вам силу ниндзюцу стиля Мичиру! Уничтожение ниндзя!!!"
1600905-132 = ""
1600905-140 = ""
1600905-141 = "Т-Ты за это заплатишь, президент Клуба исследования ниндзюцу!"
1600905-142 = "Я навсегда запомню твоё лицо!"
1600905-143 = "А?! Ну, это уже... Не надо!"
1600905-144 = ""
1600905-146 = ""
1600905-147 = "Они правда запомнят моё лицо?"
1600905-148 = "Теперь ночью придётся постоянно оглядываться!"
1600905-149 = "[s] «Всё нормально, Мичиру. Ты отлично справилась.»"
1600905-150 = "Хи-хи... Для ниндзя это обычное дело... Я не могла позволить каким-то хулиганам так издеваться над мерчем."
1600905-151 = "[s] «Так это ВСЁ-ТАКИ мерч, а не инструменты ниндзя.»"
1600905-152 = "Сенсей, обязательно было это говорить?"
1600905-153 = "Ого. Вы разобрались с этими хулиганами как настоящий ниндзя. Спасибо, госпожа!"
1600905-154 = "Хи-хи-хи. Не стоит благодарности!"
1600905-155 = "Вы правда дорожите этими вещами, да? Тогда в благодарность я подарю вам этот мерч."
1600905-156 = "Что? Правда?! То есть, признаю, я была настолько крута, что это стоило бы залить на наш канал и завирусить, но..."
1600905-158 = "Н-Н-Но Мураматлинг стоит два миллиона иен! Вы правда можете с ним расстаться?!"
1600905-160 = "А? Я не собирался отдавать именно его."
1600905-161 = "[s] «Какая жалость, Мичиру.»"
1600905-162 = "Тогда не надо было меня зря радовать!"
1600905-163 = "Вот немного нового мерча, который только поступил. Ещё раз спасибо за помощь. Наш магазин не существовал бы без таких фанатов, как вы. Надеемся на дальнейшую поддержку."
1600905-164 = "..."
1600905-165 = "[s7] «Ого, здорово, Мичиру. Ты победила хулиганов и получила желанный мерч.»\n[s8] «Какое невероятное достижение для Чидори Мичиру, сильнейшего ниндзя вокруг!»"
1600905-166 = "Я краснею, Сенсей! Но описание совершенно точное!"
1600905-167 = "Я краснею, Сенсей! Но описание совершенно точное!"
1600905-168 = "Н-Но..."
1600905-169 = "Ну, в общем! Счастливый конец! Вахаха!"
1600905-171 = "После этого мы с Мичиру ещё немного наслаждались покупками мерча."
