[translation]
1001615-1 = "...От воспоминаний не убежать, Сенсей"
1001615-6 = "И вот я присоединился к Мидори..."
1001615-7 = "...и мы с головой ушли в игру про охоту на монстров!"
1001615-8 = ""
1001615-10 = ""
1001615-11 = ""
1001615-12 = "Теперь, Сенсей! Он оглушён! Бейте по ядру и примените—"
1001615-13 = ""
1001615-17 = "ЧЕ-Е-ЕГО?!"
1001615-18 = "[ns] «Мидори? Тебя только что отключило?!»"
1001615-19 = "Да! Моя консоль просто выключилась!"
1001615-21 = "Несмотря на то что она дула в консоль и переворачивала её, та так и не включилась. Мы отнесли её в сервис..."
1001615-23 = ""
1001615-25 = "Хм... Будет непросто. Давно не видел настолько старую модель."
1001615-26 = "Нужны запасные детали, а совместимые, по-моему, уже даже НЕ ПРОИЗВОДЯТ."
1001615-27 = "То есть... совсем ничего нельзя сделать?"
1001615-28 = "Дайте я позвоню на склад и проверю остатки. Сейчас вернусь."
1001615-29 = "Спасибо..."
1001615-30 = ""
1001615-34 = "[ns] «А ведь мы были так близки к победе над монстром!»"
1001615-35 = "Да. Я была уверена, что в этот раз мы точно его добьём."
1001615-36 = "И было так весело играть только вдвоём. Это должно было стать таким особенным моментом..."
1001615-37 = ""
1001615-39 = ""
1001615-42 = ""
1001615-43 = "Спасибо, что подождали. Но... мне сказали, что нужной детали найти не удалось."
1001615-44 = "В-вы уверены?!"
1001615-45 = "Может, вас заинтересует новая модель? Посмотрите, сколько здесь новых функций!"
1001615-46 = "Но..."
1001615-47 = ""
1001615-49 = ""
1001615-50 = "Правда? Но... что если я найду детали в магазине подержанной электроники и принесу их? Или напечатаю что-нибудь на 3D-принтере?"
1001615-51 = "Мисс, поскольку мы фирменный магазин, мы не можем оказывать услуги по «несанкционированной модификации»..."
1001615-52 = "И даже если бы могли, мы не отвечаем за непредвиденные повреждения, которые могут привести к потере данных."
1001615-53 = "П-потере данных?! Нет, только не это! Мы ведь так близко!"
1001615-54 = "Как насчёт этого?"
1001615-55 = "Эта новая модель сейчас продаётся со скидкой. Если купите её здесь, я бесплатно перенесу данные и увеличу объём памяти!"
1001615-56 = "..."
1001615-57 = "[ns] «...»"
1001615-58 = "Похоже, другого выхода нет..."
1001615-59 = "Хорошо. Сделаем так."
1001615-60 = "Пожалуйста, отправьте счёт в Отдел разработки игр Научной школы Миллениум."
1001615-61 = "Так ведь можно? Это для исследования, значит, можно оплатить из бюджета клуба, верно? Семинар поймёт!"
1001615-62 = "Спасибо, мисс. Тогда начинаем. Перенос займёт некоторое время, так что придётся подождать!"
1001615-63 = "Хорошо. Спасибо за помощь."
1001615-64 = ""
1001615-66 = ""
1001615-67 = "[ns] «Случайно не Момои купила эту консоль вместе с тобой?»"
1001615-68 = "Да? К-как вы узнали?!"
1001615-69 = "[s] «Просто догадался...»"
1001615-70 = "Ну... Если подумать, наверное, это было очевидно..."
1001615-71 = "Она взяла розовую, а я зелёную. Мы поменялись контроллерами..."
1001615-72 = "Конечно, её консоль сломалась уже довольно давно. Я со своей была очень осторожна..."
1001615-73 = "...Но, наверное, так бывает..."
1001615-74 = ""
1001615-77 = "Не делайте такое лицо. Ничего страшного. Вообще-то это нормально. Электроника со временем устаревает..."
1001615-78 = "Иногда меня расстраивает, НАСКОЛЬКО быстро она устаревает, но всё же..."
1001615-79 = "Дело в том, что Момои очень старалась, чтобы купить её мне..."
1001615-80 = "...чтобы развратить меня."
1001615-81 = ""
1001615-84 = "[ns] «Р-развратить тебя?!»"
1001615-85 = "Это правда!"
1001615-86 = "Изначально я была просто художницей. Я вообще не играла, а теперь посмотрите на меня!"
1001615-87 = "Но я всё равно играю меньше неё, так что, думаю, ещё не полностью развращена."
1001615-88 = "А когда мы всё-таки играем вместе, я побеждаю её чаще чем в половине случаев. Так кто тут настоящий победитель?"
1001615-89 = "[s] «Если считать именно так...»"
1001615-90 = ""
1001615-92 = ""
1001615-93 = "...Момои всё равно меня впечатляет. Она никогда не сдаётся и всегда переполнена энергией..."
1001615-94 = "Она такая любознательная и никогда не избегает испытаний. Всё, что она делает, становится частью её истории..."
1001615-95 = "Это очень достойный образ мыслей, особенно ценный для творческого человека."
1001615-96 = "Хотя она вечно создаёт проблемы и втягивает меня в них!"
1001615-97 = "...Но всё же я восхищаюсь её смелостью. Раньше я так завидовала видеоиграм, что подсознательно избегала их."
1001615-98 = "[s] «Завидовала?»"
1001615-99 = "Да."
1001615-100 = "Как бы это объяснить?"
1001615-101 = "Она играла, а я краем глаза видела невероятные работы художников."
1001615-102 = "Я пыталась не делать этого, но всё равно постоянно сравнивала свои рисунки с работами профессионалов."
1001615-103 = "И поскольку тогда я была ещё большим новичком, от этого становилось только больнее."
1001615-104 = "[s1] «Вот как всё было...»\n[s2] «Уверенность приходит со временем.»"
1001615-107 = "Теперь я понимаю, что всё это было частью пути."
1001615-108 = "Но тогда я не могла перестать думать о том, насколько я посредственная!"
1001615-109 = "...Моя сестра никогда такой не была."
1001615-110 = "Она перечитывает старые работы и говорит о том, что ей нравится, не зацикливаясь на том, что кажется ей неловким."
1001615-111 = "Она и по жизни такая. Говорит, что жизнь коротка, поэтому нужно сосредоточиться на всём хорошем, что она может предложить."
1001615-112 = "Ах, простите, Сенсей! Что я вообще разболталась? Это всего лишь старая консоль..."
1001615-113 = "[s] «Всё нормально. Мне понравилось тебя слушать, Мидори.»"
1001615-114 = "П-правда?"
1001615-115 = "Слава богу..."
1001615-118 = "Спасибо, что подождали! Перенос данных завершён! Вот ваша старая консоль, а новую я снова упаковал!"
1001615-119 = ""
1001615-122 = "Хорошо. Большое спасибо."
1001615-123 = "Кстати... Что мне делать со старой?"
1001615-124 = "[s3] «Храни её всегда!»\n[s4] «Давай выставим её напоказ!»"
1001615-127 = "Что? Н-необязательно заходить настолько далеко..."
1001615-128 = "Вы говорите, что она драгоценна? Из-за всех воспоминаний?"
1001615-129 = "Ну, вы правы, но..."
1001615-130 = "Вы сделаете мне прозрачную витрину?!"
1001615-131 = "Н-н-н-н-нет, нельзя. Это уже слишком. Я не могу позволить вам—"
1001615-132 = "Что? У вас есть запасные? И подставка?"
1001615-133 = "..."
1001615-134 = "Какой роскошной жизнью вы живёте, если у вас просто валяются такие вещи?"
1001615-135 = "[s] «Что? Мне уже и хобби иметь нельзя?!»"
1001615-136 = "Вы же знаете, что я не это имела в виду!"
1001615-137 = "..."
1001615-138 = "Но вообще, Сенсей..."
1001615-139 = "Момои выставила свою старую консоль точно так же."
1001615-140 = "Ничего, если я сделаю что-то похожее... может, даже лучше?"
1001615-141 = "...Она обвинит меня в копировании, а это значит ещё одно очко Момои..."
1001615-142 = "[s] «А, знакомое чувство...»"
1001615-143 = "Спасибо, что понимаете..."
1001615-144 = "Дело в том, что я сторонница одной теории..."
1001615-145 = "...теории о том, что сёстры с рождения запрограммированы сражаться друг с другом!"
1001615-146 = "[s] «Да, но ведь не постоянно...?»"
1001615-147 = "Ничего! Этот раунд за ней!"
1001615-148 = "Но в следующем матче я её одолею!"
1001615-150 = "Мидори подключила новую консоль, и мы продолжили с того места, где остановились."
1001615-151 = "На этот раз мы наконец завершили охоту!"
