[translation]
1300305-1 = "Сумеречный час"
1300305-2 = "Пригородный парк Тринити"
1300305-3 = "Что это..?"
1300305-4 = "Привет, Сенсей. Не ожидала встретить тебя здесь."
1300305-5 = "Ты просто пришёл подышать свежим воздухом?"
1300305-6 = "Я тоже. Хотела найти время зайти в парк... прежде чем заняться сегодняшними делами клуба."
1300305-7 = "Какой приятный сюрприз, что я встретила тебя здесь. Хи-хи."
1300305-8 = "[s] «Что-то случилось?»"
1300305-9 = "Ничего особенного. Мне просто хотелось немного побыть одной."
1300305-10 = "Это идеальное время дня, чтобы сидеть в парке одной."
1300305-11 = "Можно беззаботно смотреть в небо..."
1300305-12 = "...и наблюдать, как оно становится фиолетовым в лучах заходящего солнца."
1300305-13 = "...Смотри."
1300305-14 = "Таким небо бывает всего несколько минут перед закатом. Нужно наслаждаться каждым мгновением."
1300305-15 = "Я никогда не была особенно разговорчивой..."
1300305-16 = "...но такой вид говорит сам за себя, правда?"
1300305-17 = "..."
1300305-18 = "...Сейчас я, наверное, звучу как сентиментальная старушка, да?"
1300305-19 = "[s] «Нет. Совсем нет.»"
1300305-20 = "Прости. Плохая привычка."
1300305-21 = ""
1300305-23 = "Пусть это и длится недолго, я хочу разделить этот момент с тобой."
1300305-24 = ""
1300305-26 = "Я сидел с Хасуми в парке до темноты, а потом вернулся в Шале."
