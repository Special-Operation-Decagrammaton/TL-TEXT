[translation]
10034190-1 = "1 день назад: Готовы выдвигаться"
10034190-3 = "Сегодня последний день, солдаты."
10034190-4 = "...Это был долгий путь."
10034190-5 = "..."
10034190-6 = "..."
10034190-7 = "..."
10034190-8 = ""
10034190-9 = "Но вот мы здесь, в конце пути. Последняя битва."
10034190-10 = "Иногда мы сбивались с пути, но не всякий, кто блуждает, потерян. Мы получили ценный опыт — пищу для духа."
10034190-11 = "Будет тяжело. Требования на прослушивании высокие, а мы всё ещё любители."
10034190-12 = "Но одно остаётся неизменным..."
10034190-13 = "По ту сторону прослушивания нас ждёт семла!"
10034190-14 = "И это должно развеять все ваши сомнения."
10034190-15 = "Не дрогните сейчас! Держитесь вместе, делайте то, что должны, и наше путешествие закончится именно так, как вы мечтали!"
10034190-16 = ""
10034190-18 = ""
10034190-20 = "Мы тренировались всё это время не только ради приятных воспоминаний! Эта семла должна оказаться у нас в желудках — и мы её туда отправим!"
10034190-21 = "Банда сладкоежек после школы выйдет победителем!"
