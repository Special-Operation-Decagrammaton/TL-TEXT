[translation]
10031060-1 = "Эпизод 6;Решение председателя"
10031060-2 = "Шёл четвёртый день подготовки вечеринки Общества Пандемониума. Я занимался работой в Шале перед поездкой туда, когда мне позвонила Ироха."
10031060-3 = ""
10031060-7 = ""
10031060-8 = "Сенсей..."
10031060-9 = "[s] «А? Неожиданно, что звонишь ты, Ироха. Обычно звонит Макото.»"
10031060-10 = "Насчёт этого... Макото сейчас не в состоянии вам звонить."
10031060-11 = "Честно говоря, мы все здесь оказались в небольшой передряге. И я не совсем понимаю, что с ней делать."
10031060-12 = "Знаю, ещё довольно рано, но не могли бы вы как можно скорее приехать в Общество Пандемониума?"
10031060-13 = "[s] «...?»"
10031060-14 = ""
10031060-16 = ""
10031060-17 = ""
10031060-20 = "Я добрался до исполнительного кабинета Общества Пандемониума так быстро, как только мог."
10031060-22 = ""
10031060-23 = "Ах..."
10031060-24 = "[s] «Макото! Я слышал, вы тут попали в передрягу! Что происходит?»"
10031060-25 = ""
10031060-27 = ""
10031060-28 = "Как поживаете, Сенсей?"
10031060-29 = "Вы сегодня раньше обычного. Фуфу. Вы очень прилежны."
10031060-30 = ""
10031060-33 = "[ns1] «Ироха! Макото сломалась?!»\n[ns2] «Ты не шутила, это и правда передряга!»"
10031060-36 = "...Точно?"
10031060-37 = "Эй, Ироха... Разве не жутко видеть Макото такой?"
10031060-39 = "Макото, ты в порядке?"
10031060-40 = "Фуфу. Всё хорошо, Ибуки."
10031060-41 = "О, у меня есть улун, который я специально достала для этой вечеринки. Хочешь попробовать?"
10031060-42 = "Ибуки любит только какао."
10031060-43 = "Да. Какао тоже было бы неплохо."
10031060-44 = "..."
10031060-45 = ""
10031060-47 = ""
10031060-48 = "[ns] «Что вообще здесь происходит?»"
10031060-49 = "Ну... произошло вот что..."
10031060-51 = "Тремя часами ранее..."
10031060-52 = ""
10031060-53 = "Как они смеют вмешиваться в мой план со статуями! Ц! Мерзавцы из Дисциплинарной комиссии!"
10031060-54 = "Не знаю, по-моему, с этим ты уже опасно приблизилась к грани..."
10031060-55 = "Ну, внимания это привлекло много, так что в каком-то смысле можно назвать это успешной рекламой, верно? Ахаха. В интернете все только об этом и говорили!"
10031060-56 = "Нет... Такими темпами мой план показать превосходство Общества Пандемониума над Дисциплинарной комиссией на Особой вечеринке Геенны в этом году..."
10031060-57 = "Ц. Чиаки! Чем сейчас занимается Дисциплинарная комиссия?!"
10031060-58 = "А, кажется, они только что начали свои обычные антитеррористические учения — в качестве меры предосторожности перед вечеринкой."
10031060-59 = "Понятно... Значит, это хотя бы ненадолго отвлекло её от занятий на пианино."
10031060-60 = "Этого недостаточно. Ей нужно ещё больше отвлекающих факторов, чтобы она не могла тренироваться."
10031060-61 = "Ради нашей миссии показать, у кого настоящая власть... Продемонстрировать качества великого лидера... Дать понять не только ученикам Геенны, но и [USERNAME] Сенсею, кто поведёт их в будущее..."
10031060-62 = "Уф! Ироха, принеси мне «это»!"
10031060-63 = "Что значит «это»? Может, меч?"
10031060-64 = ""
10031060-66 = ""
10031060-67 = ""
10031060-68 = "А, точно. Кажется, эту часть подготовки я поручила Сацуки, а не Ирохе."
10031060-69 = "Ты поручила подготовку Сацуки?!"
10031060-70 = "Ахаха! Конечно ты переживаешь, услышав такое, Ироха!"
10031060-71 = "Что именно—"
10031060-72 = ""
10031060-74 = ""
10031060-75 = ""
10031060-76 = "Хи-хи. Всё именно так, как сказала Макото. Моя подготовка уже завершена."
10031060-77 = "Узрите... Улучшенную версию моего проекта NK Ultra!"
10031060-78 = "Улучшенную что?!"
10031060-79 = "Фуфу, мой первоначальный проект был сосредоточен на расширении частных военных сил Общества Пандемониума путём «убеждения» студентов присягнуть нам на верность."
10031060-80 = "Но с улучшенной версией всё иначе. По просьбе Макото цель этого гипноза... добиться уважения!"
10031060-81 = "Я немного изменила свой обычный метод гипноза, чтобы с его помощью вызывать любовь и уважение к нашему дорогому лидеру!"
10031060-82 = "Кекеке! Ты никогда не подводишь, Сацуки! Как и ожидалось! Если использовать улучшенные навыки гипноза Сацуки..."
10031060-83 = "Цель переполнится сияющим уважением ко мне! Будь то Дисциплинарная комиссия, студент Геенны или даже Сенсей!"
10031060-84 = "...Что это вообще такое?"
10031060-85 = "Итак. Чиаки, Ибуки! В качестве первого испытуемого используем Ироху!"
10031060-86 = "Ч-Что?! П-Почему?!"
10031060-87 = "Принято! Прости, Ироха! Подчинённая обязана исполнять приказы начальства!"
10031060-88 = "Ироха, ты водишь!"
10031060-89 = ""
10031060-91 = ""
10031060-92 = "Ч-Что?! И-И ты тоже, Ибуки?!"
10031060-93 = ""
10031060-95 = ""
10031060-97 = "Кихехе. О, Ироха, давай наполним твоё сердце уважением ко мне до краёв!"
10031060-98 = "За одну эту фразу знай: ты потеряла всё моё уважение!"
10031060-99 = "Сацуки, сейчас!"
10031060-100 = "Всё хорошо, Ироха. Ты просто станешь чу-у-уточку больше любить Макото, чем сейчас!"
10031060-101 = "П-Погоди!"
10031060-102 = ""
10031060-104 = ""
10031060-106 = "Фуфуфу! Начинаем!"
10031060-107 = ""
10031060-109 = ""
10031060-111 = ""
10031060-113 = ""
10031060-115 = ""
10031060-117 = ""
10031060-119 = ""
10031060-121 = ""
10031060-122 = ""
10031060-123 = ""
10031060-126 = "[ns] «...То есть в итоге вместо Ирохи загипнотизировали Макото?»"
10031060-127 = ""
10031060-128 = "...Да, и она это заслужила. Серьёзно."
10031060-129 = "Ну, если она никому не вредит, может, оставить её такой и нормально?"
10031060-130 = "Хотя всё равно немного страшно..."
10031060-131 = "Ибуки нравится новая Макото!"
10031060-132 = "Хи-хи, мне тоже нравится я. И Ибуки, и остальные из Общества Пандемониума, и Сенсей. Мне нравятся все!"
10031060-133 = "Беру слова назад, такой она очень страшная."
10031060-134 = "Разве не будет огромной проблемой, если Дисциплинарная комиссия узнает, что Макото в таком состоянии?"
10031060-135 = "Особенно когда об этом узнает тот старший администратор... Она ведь не станет просто сидеть сложа руки."
10031060-136 = "Кстати, разве Макото не должна была пойти на тренировочную площадку и крикнуть: «Сорасаки Хина! Прекрати заниматься пианино и сосредоточься на антитеррористических учениях!»"
10031060-137 = "«Как председатель Общества Пандемониума, я лично прослежу за каждым аспектом тренировки!», верно?"
10031060-138 = "*ахает* Если они узнают о нынешнем состоянии Макото, может начаться настоящая война."
10031060-139 = "[s] «Не думаю, что Дисциплинарная комиссия зайдёт так далеко...»"
10031060-140 = "Может, глава и нет, но у нас есть история с тем старшим администратором... Услышав об этом, она может сорваться с цепи. Как далеко она тогда зайдёт, Сенсей?"
10031060-141 = "[s] «...Не уверен.»"
10031060-142 = "Ахаха! Быстро же ты изменил своё мнение, Сенсей."
10031060-143 = "Дисциплинарная комиссия? Война?"
10031060-144 = "Хм? Макото? Что такое?"
10031060-145 = "...Верно. Общество Пандемониума и Дисциплинарная комиссия — смертельные враги."
10031060-146 = "Мы снова и снова сражались друг с другом в этом танце ненависти."
10031060-147 = "Я размышляла о причине всего этого и пришла к единственному выводу."
10031060-148 = "[s] «И к чему же?»"
10031060-149 = "Само существование Общества Пандемониума и Дисциплинарной комиссии создаёт вражду!"
10031060-150 = ""
10031060-152 = ""
10031060-153 = "...Что?"
10031060-154 = "Если конфликты между этими организациями неизбежны... Если они лишь обременяют наших учеников...!"
10031060-155 = "Я воспользуюсь полномочиями председателя и потребую распустить и Общество Пандемониума, и Дисциплинарную комиссию!"
10031060-156 = ""
10031060-158 = ""
10031060-159 = ""
10031060-160 = ""
10031060-161 = ""
10031060-162 = ""
10031060-163 = ""
10031060-164 = ""
10031060-165 = ""
10031060-166 = "Какое вкусное какао!"
10031060-167 = ""
10031060-168 = "[ns] «Макото?»"
10031060-169 = "Нельзя терять время. Мы должны сообщить всей Геенне об этом решении! Возвестим начало новой эры мира!"
10031060-170 = "Да... Нам нечего получать от борьбы друг с другом!"
10031060-171 = "Пожертвуем всем ради мира в Геенне!"
10031060-172 = ""
10031060-174 = ""
10031060-176 = ""
10031060-177 = "П-П-П-Погоди?! Макото?!"
10031060-178 = ""
10031060-180 = ""
10031060-181 = ""
10031060-182 = "Ахахахаха!!!"
10031060-183 = "...Так ты не просто прекратишь драки! Ты прикончишь саму Геенну!"
10031060-184 = "[s] «М-Макото, стой!»"
10031060-187 = "Я погнался за Макото, пока она бегала вокруг и проповедовала своё послание. С огромным трудом мне удалось снять с неё гипноз."
