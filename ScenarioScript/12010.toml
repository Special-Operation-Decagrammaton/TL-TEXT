[translation]
12010-1 = "Episódio 1;Uma Aliança Inesperada"
12010-5 = "Imperdoável... Imperdoável... Imperdoável... Imperdoável..."
12010-7 = "Imperdoá—?"
12010-8 = "[s] Acabei fazendo contato visual com a Haruka."
12010-9 = "..."
12010-16 = "[ns1] (Melhor desviar o olhar...)\n[ns2] Finjo que não vi nada."
12010-21 = "..."
12010-22 = "..."
12010-23 = "..."
12010-25 = "Se você é a Oficial Administrativa... então é a número 2 do Comitê Disciplinar..."
12010-26 = "Ora, na verdade não é nada tão grandioso assim. Sou apenas uma espécie de secretária que auxilia a Chefe do Comitê Disciplinar..."
12010-27 = "Se fosse mesmo assim, as integrantes do Comitê Disciplinar ali não estariam tão tensas."
12010-28 = "Q-Quem é que tá tensa?!"
12010-29 = "..."
12010-30 = "Entendo, que excelente perspicácia. Se bem me lembro... Sunaookami Shiroko-san, não é?"
12010-31 = "..."
12010-32 = "Ouvi dizer que restaram apenas os membros do conselho estudantil em Abydos, e parece que são vocês."
12010-33 = "Ouvi dizer que o conselho estudantil de Abydos tem cinco membros, mas onde está a outra?"
12010-34 = "Ela não está aqui no momento. E nós não somos o conselho estudantil, somos o Comitê de Contramedidas, Oficial Administrativa."
12010-35 = "Okusora-san... certo? Então quer dizer que não há ninguém do conselho estudantil aqui? Eu gostaria de falar com alguém do conselho estudantil."
12010-36 = "O conselho estudantil de Abydos foi dissolvido há muito tempo! Na prática, nós estamos respondendo por ele, então se tem algo a dizer, diga pra gente!"
12010-37 = "Mas cercar a gente assim com armas apontadas e dizer \"vamos conversar~\" não parece uma postura muito adequada para uma conversa, não acha?"
12010-38 = "Hehe, tem razão..."
12010-39 = "Peço desculpas. Todas, baixem suas armas."
12010-40 = "(Abaixam as armas)"
12010-42 = "(Abaixam as armas...)"
12010-43 = "Nossa..."
12010-44 = "Elas baixaram mesmo as armas...?"
12010-45 = "..."
12010-46 = "Gostaria de pedir desculpas em nome delas pela imprudência de agora há pouco."
12010-47 = "O quê?! Eu só segui as suas ordens! Ako-chan?!"
12010-48 = "Por acaso as ordens incluíam \"primeiro abram fogo indiscriminadamente\"?"
12010-49 = "N-Não... avaliar a situação, fornecer fogo de cobertura no alcance necessário e depois enviar a infantaria... só segui o básico da tática..."
12010-50 = "Ainda mais perto do distrito autônomo de outra escola, o mínimo que se espera é ter cuidado com isso, não concorda?"
12010-51 = "(...?)"
12010-52 = "Peço desculpas, pessoal do Comitê de Contramedidas."
12010-53 = "Nós do Comitê Disciplinar de Gehenna viemos apenas para prender aquelas que violaram as regras da nossa academia."
12010-54 = "Embora tenham ocorrido alguns incidentes indesejáveis, ainda não se pode dizer que houve algo ilegal... ficaríamos gratas se compreendessem que foi inevitável."
12010-55 = "Poderíamos contar com a sua cooperação nas atividades do Comitê Disciplinar?"
12010-56 = "Como eu já disse antes... isso não vai acontecer!"
12010-57 = "Oh...?"
12010-58 = "Outra escola entrar no território alheio e iniciar um combate por conta própria com tanta desfaçatez!"
12010-59 = "Do ponto de vista da autonomia escolar, isso é uma violação clara!"
12010-61 = "Nós é que vamos decidir o destino da Faz-Tudo!"
12010-62 = "..."
12010-63 = "..."
12010-64 = "..."
12010-65 = "Nunca imaginei que uma academia tão grande quanto Gehenna cometeria um abuso desses, mas não vamos ceder aqui."
12010-67 = "...Entendo."
12010-68 = "Parece que as outras aí pensam da mesma forma."
12010-69 = "Ufa, não recuar nem diante de todo este efetivo..."
12010-70 = "Estarem tão cheias de confiança assim... será que é por terem um adulto confiável ao lado? ...Não é mesmo, Sensei [USERNAME]?"
12010-71 = "[s] \"...\""
12010-72 = "Sensei da Schale. Você também compartilha da mesma opinião do Comitê de Contramedidas?"
12010-73 = "[s3] \"As meninas da Faz-Tudo podem ser meio problemáticas, mas não são más pessoas.\"\n[s4] \"A Aru é um pouco esquisita, mas não é uma má pessoa.\"\n[s5] \"Elas podem ser meio bobinhas, mas quanto mais bobinhas, mais fofas são.\""
12010-74 = "Não, não, não! É óbvio que são más pessoas! Elas explodiram o restaurante de lámen?!"
12010-75 = "Não, não, não! É óbvio que são más pessoas! Elas explodiram o restaurante de lámen?!"
12010-76 = "Não, não, não! É óbvio que são más pessoas! Elas explodiram o restaurante de lámen?!"
12010-77 = "É só um palpite... mas acho que elas explodiram sem querer e ficaram com vergonha de admitir, aí pagaram de duronas."
12010-78 = "Hã?!"
12010-79 = "Se o alvo fôssemos nós, não haveria motivo para explodir quando não tinha ninguém lá. E não faria sentido usar um método tão chamativo numa situação daquelas, já que nos deixaria em alerta."
12010-80 = "...B-Bem, pensando bem, faz sentido."
12010-81 = "Quer dizer que elas detonaram por acidente enquanto preparavam a armadilha...? Quão idiotas elas conseguem ser...?"
12010-82 = "Mas o fato é que atacaram o Lámen Shibasaki. Não podemos entregá-las assim sem mais nem menos."
12010-83 = "Verdade, e ainda não sabemos quem está por trás delas. Precisamos interrogá-las primeiro."
12010-84 = "Sendo assim, as negociações estão encerradas! Comitê Disciplinar de Gehenna, exigimos que se retirem imediatamente!!"
12010-86 = "..."
12010-87 = "Que situação complicada... Hmm... Sendo assim, não há escolha. Eu realmente queria resolver isso de forma pacífica..."
12010-90 = "...Parece que teremos que resolver à força, não é?"
12010-98 = "(Ratatatatá! Ratatatatá!)"
12010-99 = "Uaaah?!"
12010-105 = "(Bang! Bang! Bang!)"
12010-106 = "Gah?!"
12010-110 = "O-O que foi isso?!"
12010-111 = "Imperdoável...!"
12010-112 = "Hã?!"
12010-114 = "Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Imperdoável! Uaaaaaaaaaaah!!"
12010-122 = "(Bang-bang-bang-bang-bang-bang!!)"
12010-123 = "Guh?! Ugh...!"
12010-124 = "(Baque)"
12010-126 = "Pare de mentir, Amau Ako."
12010-127 = "Oh?"
12010-128 = "Isso não foi coincidência nenhuma. Desde o começo, era exatamente esta situação que você estava buscando."
12010-129 = "Kayoko-san..."
12010-132 = "Mandou beeem, Haruka-chan☆"
12010-133 = "D-Desculpa! Demorei demais para vir ajudar...!"
12010-134 = "P-Por minha culpa...! O plano foi todo, todinho por água abaixo...! P-Posso morrer? Eu vou morrer!!!"
12010-135 = "É, foi mesmo culpa da Haruka-chan, mas tá divertido, então acho que não precisa morrer, né?"
12010-136 = "Nossa, elas conseguiram escapar do cerco...?"
12010-137 = "Quando foi que elas foram parar lá...?"
12010-138 = "...Mandaram bem."
12010-139 = "..."
12010-140 = "Minhas desculpas, Oficial Administrativa. Elas aproveitaram que desviamos o olhar... Vamos refazer o cerco agora mesm—"
12010-141 = "Não, está tudo bem. Não é grande coisa. ...Mas deixando isso de lado, você está dizendo algo bem interessante, Kayoko-san."
12010-142 = "..."
12010-143 = "...No começo, eu não entendi por que o Comitê Disciplinar apareceu aqui. Que motivo o Comitê Disciplinar teria para nos perseguir até outro distrito autônomo, ainda mais visando a gente?"
12010-144 = "Uma operação tão ineficiente assim não faz o estilo da Chefe do Comitê Disciplinar. Por isso, Ako, só pode ser uma ação por conta própria sua."
12010-145 = "..."
12010-146 = "Além disso, esse efetivo é grande demais só para lidar conosco. Tudo faz sentido se você estava prevendo um confronto contra outro grupo."
12010-147 = "Mas Abydos inteira só tem cinco alunas... então só há uma conclusão possível."
12010-152 = "Ako, o seu objetivo é a Schale. Desde o começo, você veio até aqui atrás do Sensei."
12010-154 = "?!"
12010-155 = "O-O que disse?!"
12010-156 = "Atrás do Sensei...?!"
12010-157 = "[s] \"De mim?\""
12010-159 = "..."
12010-160 = "Hehe, entendo."
12010-161 = "...Ah, eu tinha me esquecido completamente de que a Kayoko-san faz parte da Faz-Tudo. Não era hora para ficar batendo papo despreocupadamente..."
12010-162 = "Bom, não importa."
12010-168 = "(Tum, tum, tum, tum, tum, tum, tum, tum...)"
12010-170 = "?!"
12010-173 = "(Tum, tum, tum, tum, tum, tum, tum, tum...)"
12010-174 = "Às 12 horas e às 6 horas... às 3 e às 9... Mais tropas do Comitê Disciplinar estão se reunindo por todos os lados...!"
12010-175 = "..."
12010-179 = "(Tum, tum, tum, tum, tum, tum, tum, tum...)"
12010-180 = "..."
12010-181 = "...Reforços."
12010-182 = "Ainda havia mais delas... E em um número tão grande...!"
12010-183 = "Hmm... Achei que talvez estivesse exagerando um pouco... mas como estamos lidando com a Schale, nunca é demais ter reforços assim..."
12010-184 = "Bom, como dizem, é melhor sobrar do que faltar☆"
12010-185 = "Achei que tínhamos escapado do cerco... mas era um cerco duplo..."
12010-186 = "Exatamente. Ainda assim, como esperado da Kayoko-san. O que você disse agora há pouco está correto. ...Não, talvez valha apenas metade dos pontos? De fato, eu previ o pior cenário possível de entrarmos em conflito com a Schale."
12010-187 = "Porém, eu não criei esta situação intencionalmente. Gostaria que acreditasse pelo menos nisso... mas parece que vai ser difícil."
12010-189 = "Não há o que fazer. Vou explicar como tudo aconteceu... O estopim foi o Tea Party."
12010-190 = "Vocês conhecem, é claro: o conselho estudantil da Escola Geral Trinity, nossa rival de longa data contra a Academia Gehenna."
12010-191 = "Nosso departamento de inteligência relatou que o Tea Party colocou as mãos em um relatório sobre a Schale..."
12010-193 = "Assim que eu voltar, vou relatar este fato ao Tea Party!"
12010-195 = "No início, eu também não fazia ideia do que era a \"Schale\"... mas se é uma informação que o Tea Party possui, nós também precisamos saber."
12010-196 = "Então eu li o relatório que a Chinatsu-san escreveu."
12010-197 = "(Não demorou um pouco demais para ler...?)"
12010-198 = "Uma organização misteriosa deixada pela Presidente do Conselho Estudantil Geral... um clube extralegal comandado por um Sensei adulto."
12010-199 = "Por qualquer ângulo que se olhe, isso não cheira muito suspeito?"
12010-200 = "Essa tal de Schale parece uma variável extremamente perigosa. Não dá para saber que impacto ela pode ter no tratado que estamos prestes a firmar com Trinity."
12010-201 = "Portanto, pelo menos até que o tratado seja concluído em segurança, gostaríamos de acolher o Sensei sob a proteção do nosso Comitê Disciplinar."
12010-202 = "E, de quebra, cuidar das alunas delinquentes que estavam por aqui... algo nessa linha."
12010-203 = "..."
12010-204 = "Nn, na verdade ficou bem mais fácil de entender a situação."
12010-205 = "...Levar o Sensei embora? Achou mesmo que a gente ia dizer \"ah, tudo bem\" assim fácil?"
12010-206 = "..."
12010-208 = "...Hehe, imaginei que acabaria assim. Então não temos escolha, Okusora Ayane-san."
12010-209 = "...?"
12010-210 = "O Comitê Disciplinar de Gehenna usa a força quando necessário. E uma vez que tomamos essa decisão, não mostramos nenhuma hesitação."
12010-211 = "...!!"
12010-213 = "..."
12010-214 = "Chefe, se formos fugir, tem que ser agora. Assim que a luta começar, não tem mais volta."
12010-215 = "O Comitê Disciplinar com certeza pretende aniquilar Abydos e nós ao mesmo tempo. Mas enquanto Abydos distrai elas, podemos furar o ponto mais fraco do cerco..."
12010-216 = "...Hehe."
12010-217 = "Hehe, hehehehe."
12010-218 = "...Chefe?"
12010-219 = "...Ei, Kayoko, você já não conhece a minha personalidade há muito tempo?"
12010-220 = "...?"
12010-221 = "Numa situação dessas, depois de sermos tratadas assim... virar as costas e fugir?"
12010-222 = "Nós da Faz-Tudo jamais faríamos uma coisa de vilão de terceira categoria dessas!!!"
12010-223 = "...Ahaaa."
12010-226 = "Não vou sossegar até dar um bom soco na cara desse Comitê Disciplinar arrogante!"
12010-227 = "Aru-sama...!"
12010-228 = "(Mas ontem a gente não fugiu na hora...?)"
12010-229 = "Ufa... Tudo bem, mas você pretende mesmo enfrentar todo aquele efetivo de frente? Acho que mesmo juntando forças com Abydos vai ser por um triz..."
12010-230 = "E pra começar, não acho que Abydos vá cooperar conosco... sendo assim..."
12010-231 = "Beleza, Faz-Tudo! Vamos cercar elas pelos dois lados!! Temos que dar uma bela lição nesse Comitê Disciplinar!!!"
12010-232 = "Vocês vão servir de escudo para o Sensei."
12010-233 = "?!"
12010-234 = "Vamos todas proteger o Sensei juntas, combinado?"
12010-235 = "Que rápido para resolver isso..."
12010-237 = "Hehe... Ahahahahahaha!"
12010-238 = "Mas é claro! Quem vocês pensam que eu sou? Não precisam se preocupar!"
12010-239 = "Retribuímos confiança com confiança! Esse é o lema da nossa Faz-Tudo 68!"
12010-241 = "Sim!! O Sensei também já nos ajudou muito! Vamos conseguir com certeza...!"
12010-242 = "E já que estamos aqui, vou logo avisando! Não explodimos aquilo por acidente! Foi tudo planejado!"
12010-243 = "É uma guerra psicológica avançada que só uma fora da lei implacável como eu seria capaz de executar...!"
12010-244 = "...Nossa, cavou a própria cova."
12010-246 = "Hmm... Bem, essa também era uma situação que eu havia previsto..."
12010-247 = "Ainda assim, que elas se unissem tão rápido... isso sim foi inesperado."
12010-248 = "...Pois bem, então."
12010-249 = "Comitê Disciplinar, iniciem o ataque. Neutralizem o Comitê de Contramedidas e a Faz-Tudo, e garantam a custódia segura do Sensei."
12010-250 = "O Sensei é de fora de Kivotos, então tomem extremo cuidado para não machucá-lo."
12010-251 = "Como ousam descarregar uma escopeta em cima de mim... Preparem-se!!"
12010-253 = "O inimigo está fechando o cerco! Rompam a formação!"
12010-254 = "Sensei! Por favor, comande a gente e a Faz-Tudo 68!"
