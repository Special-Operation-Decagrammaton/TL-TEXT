[translation]
12010-1 = "Эпизод 1;Неожиданный союз"
12010-4 = ""
12010-5 = "Непростительно, непростительно, непростительно..."
12010-6 = ""
12010-7 = "Никогда, никогда, никогда, никогда не прощу... А?"
12010-8 = "[s] Встретиться взглядом с Харукой."
12010-9 = "..."
12010-10 = ""
12010-11 = ""
12010-12 = ""
12010-13 = ""
12010-14 = ""
12010-16 = "[ns1] «Лучше притвориться, что ничего не видел...»\n[ns2] Проигнорировать увиденное."
12010-21 = "..."
12010-22 = "..."
12010-23 = "..."
12010-24 = ""
12010-25 = "Ты старший администратор? Значит, второй человек в Префектурной команде..."
12010-26 = "Прошу! Ты выставляешь это куда роскошнее, чем есть на самом деле.#nЯ всего лишь секретарь, поддерживающий главного префекта."
12010-27 = "Если бы это было всё, твои подчинённые сейчас не дрожали бы от страха."
12010-28 = "К-Кто сказал, что я дрожу?!"
12010-29 = "..."
12010-30 = "Очень проницательно! Так... Ты, должно быть, Сунаоками Широко."
12010-31 = "..."
12010-32 = "По слухам, в районе остался только студсовет Абидоса. Полагаю, это все вы."
12010-33 = "Насколько я знаю, в студсовете Абидоса должно быть пять человек. Похоже, одной не хватает."
12010-34 = "Наша президент сейчас отсутствует. И мы не студсовет.#nМы Целевая группа по взысканию долгов, госпожа старший администратор."
12010-35 = "Окусора, верно? Здесь нет членов студсовета? Я хотела бы поговорить со студсоветом, если позволите."
12010-36 = "Студсовета Абидоса больше нет! По сути, теперь мы исполняем обязанности студсовета. Так что если вам есть что сказать — говорите нам!"
12010-37 = "И если для вас разговор — это держать кого-то на мушке, то, по-моему, это довольно мерзко."
12010-38 = "А..."
12010-39 = "Прошу прощения. Всем подразделениям — оружие опустить."
12010-40 = "*щелчок*"
12010-42 = "*щелк* *клац*"
12010-43 = "Ого..."
12010-44 = "Они правда послушались..."
12010-45 = "..."
12010-46 = "Позвольте извиниться за безрассудное применение силы моими коллегами."
12010-47 = "Какого чёрта?! Я же просто выполняла приказ! Ако?!"
12010-48 = "В приказе было сказано слепо вступать в бой и вести беспорядочный огонь?"
12010-49 = "Н-Ну, огневая поддержка — основа наземного тактического развёртывания пехоты..."
12010-50 = "Разве не очевидно, что при действиях на территории другой академии необходимо соблюдать определённые меры предосторожности?"
12010-51 = "(Хм?)"
12010-52 = "Ещё раз приношу искренние извинения Целевой группе по взысканию долгов."
12010-53 = "Префектурная команда Геенны была мобилизована для задержания конкретных лиц, нарушивших правила нашей академии."
12010-54 = "Это досадный инцидент, но поскольку ничего незаконного не произошло... надеюсь на ваше понимание. Мы лишь действовали исходя из срочности ситуации."
12010-55 = "Прошу вас содействовать Префектурной команде при исполнении её обязанностей."
12010-56 = "А мы уже сказали... не дождётесь!"
12010-57 = "О...?"
12010-58 = "Такая академия, как Геенна, злоупотребляет своей огромной армией и проводит боевую операцию против крошечной школы вроде нашей?!"
12010-59 = "Это явное нарушение юрисдикции!"
12010-61 = "Как поступить с Решатели проблем 68, решать будем мы!"
12010-62 = "..."
12010-63 = "..."
12010-64 = "..."
12010-65 = "Позор, что академия масштаба Геенны так злоупотребляет властью и устраивает подобный штурм!"
12010-67 = "Хм..."
12010-68 = "Похоже, вы все думаете одинаково."
12010-69 = "Удивительно, что вы настолько упрямы даже перед лицом наших сил..."
12010-70 = "Неужели источник вашей уверенности — способности одного определённого человека на вашей стороне? Возможно...[USERNAME] Сенсей?"
12010-71 = "[s] «...»"
12010-72 = "Сенсей, ты официальный советник Шале. Значит ли это, что ты согласен с Целевой группой?"
12010-73 = "[s3] «В Агентстве 68 одни дурочки, но они неплохие дети.»\n[s4] «Ару глуповата, но она не плохая.»\n[s5] «Ладно, они ВСЕ глуповаты, но не НАСТОЛЬКО.»"
12010-74 = "Что?! Да они гнилые яблоки! Они взорвали раменную!"
12010-75 = "Что?! Да они гнилые яблоки! Они взорвали раменную!"
12010-76 = "Что?! Да они гнилые яблоки! Они взорвали раменную!"
12010-77 = "Да, это они сделали... но спорю, что случайно взорвали её, а потом решили делать вид, будто так и было задумано."
12010-78 = "Что?!"
12010-79 = "Если взрыв и правда предназначался нам, зачем взрывать раменную, когда там никого не было? Это только раскрыло их план. Да и ловушка с самого начала была ужасной."
12010-80 = "Хм. Пожалуй, в этом есть смысл."
12010-81 = "Они поставили ловушку и сами же случайно в неё попались?#nГосподи. Кто вообще нанял этих идиотов?"
12010-82 = "Как бы то ни было, факт остаётся фактом: раменную они уничтожили.#nТак что повторю — мы их не отдадим."
12010-83 = "И мы всё ещё не выяснили, на кого они работают.#nС ними мы ещё не закончили."
12010-84 = "Подводя итог: нам незачем с вами договариваться!#nМы требуем, чтобы Префектурная команда Геенны немедленно#nвывела свои силы!"
12010-85 = ""
12010-86 = "..."
12010-87 = "Очень жаль. Раз вы так решили, вы не оставляете мне выбора.#nПравда, мне совсем не хочется прибегать к этому, но..."
12010-88 = ""
12010-89 = ""
12010-90 = "Нам придётся применить силу."
12010-91 = ""
12010-92 = ""
12010-98 = "*ба-бах* *бах* *бах* *бах*"
12010-99 = "А-а-а-а!"
12010-100 = ""
12010-105 = "*ба-бах* *бах* *бах* *бах*"
12010-106 = "Гааах!"
12010-107 = ""
12010-110 = "К-Какого?!"
12010-111 = "Непростительно..."
12010-112 = "О-Откуда ты взялась?!"
12010-114 = "А-а-а-а! Непростительно! Непростительно! Непростительно! Непростительно! Непростительно! Непростительно! Непростительно! Непростительно! Непростительно!"
12010-115 = ""
12010-122 = "*ба-бах* *бах* *бах* *бах* *бах* *бах*"
12010-123 = "Гааааах..."
12010-124 = "(падает)"
12010-125 = ""
12010-126 = "Хватит врать, Амау Ако."
12010-127 = "Простите?"
12010-128 = "Ты сказала, что тебе совсем не хочется этого делать... Ложь.#nИменно этого ты и хотела с самого начала."
12010-129 = "Кайоко..."
12010-130 = ""
12010-132 = "Отлично, Харука! ☆"
12010-133 = "П-Простите! Простите, что не пришла на помощь раньше..."
12010-134 = "Э-Это всё моя вина... План разрушен! М-Может, мне принести себя в жертву в искупление?! Я с радостью!"
12010-135 = "Ну, технически это и правда твоя вина. Но теперь, когда всё стало куда интереснее, думаю, ничего страшного."
12010-136 = "Ох. Вы сумели прорваться через наш периметр."
12010-137 = "Какого чёрта? Как они вообще туда добрались?"
12010-138 = "Э-Эм..."
12010-139 = "..."
12010-140 = "Прошу прощения, старший администратор. Мы отвлеклись на студентов Абидоса. Немедленно восстановим строй."
12010-141 = "Ничего страшного... А ты, Кайоко. К чему ведёшь?"
12010-142 = "..."
12010-143 = "Сначала я удивилась, что Префектурная команда вообще явилась сюда.#nЗачем тащиться на территорию другой школы ради ареста мелких преступников вроде нас?"
12010-144 = "Такое неэффективное и неряшливое применение силы совсем не в стиле Хины.#nОчевидно, это было твоё единоличное решение, Ако."
12010-145 = "..."
12010-146 = "И ты мобилизовала взвод размером с маленькую армию только ради нашего ареста? Нет. Ты сделала это, потому что с самого начала ожидала вооружённого столкновения с другой школой."
12010-147 = "Но вся школа состоит всего из пяти студентов...#nЗначит, остаётся только одно объяснение."
12010-148 = ""
12010-149 = ""
12010-150 = ""
12010-151 = ""
12010-152 = "Твоя настоящая цель — Шале. С самого начала тебе был нужен Сенсей."
12010-154 = "...?!"
12010-155 = "Ч-что?!"
12010-156 = "Сенсей?!"
12010-157 = "[s] «Я?»"
12010-158 = ""
12010-159 = "..."
12010-160 = "Хм-м."
12010-161 = "Ох. Нужно было помнить, что среди Решатели проблем 68 есть такая, как ты, Кайоко. Возможно, я слишком затянула..."
12010-162 = "Ну да ладно. Неважно."
12010-163 = ""
12010-164 = ""
12010-165 = ""
12010-168 = "*топ* *топ* *топ* *топ* *топ*"
12010-170 = "...?!"
12010-173 = "*топ* *топ* *топ* *топ* *топ*"
12010-174 = "Силы Префектурной команды наступают со всех сторон..."
12010-175 = "..."
12010-176 = ""
12010-177 = ""
12010-179 = "*топ* *топ* *топ* *топ* *топ*"
12010-180 = "..."
12010-181 = "Подкрепление."
12010-182 = "У вас ещё были силы в пути? Т-Так много?"
12010-183 = "Ладно, возможно, я немного переборщила... но при столкновении с Шале я решила, что лучше перестраховаться."
12010-184 = "Всё-таки лучше подготовиться слишком хорошо, чем недостаточно! ☆"
12010-185 = "Я думала, мы прорвали их линию окружения, но за ней оказалась ещё одна..."
12010-186 = "Кайоко права. Ну, наполовину. Да, я предполагала худший сценарий в случае столкновения с Шале."
12010-187 = "Но неправда, что я хотела, чтобы всё зашло так далеко.#nОчень надеюсь, вы мне поверите... хотя пойму, если нет."
12010-188 = ""
12010-189 = "Чаепитие..."
12010-190 = "Они выполняют роль студсовета Общей школы Тринити — давнего соперника Академии Геенны."
12010-191 = "Наша разведка узнала о докладе по Шале, который был передан Чаепитию."
12010-193 = "Я передам это Чаепитию!"
12010-194 = ""
12010-195 = "Поначалу я вообще не знала, что такое Шале... но какими бы сведениями ни располагало Чаепитие,#nнам было абсолютно необходимо получить те же данные."
12010-196 = "Поэтому я изучила доклад, который составила Чинацу."
12010-197 = "(Пусть и с огромным опозданием.)"
12010-198 = "Таинственная организация, оставленная президентом Генерального студсовета... Внесудебный клуб под руководством взрослого..."
12010-199 = "Неужели только мне это кажется подозрительным?"
12010-200 = "В Шале слишком много неизвестных переменных.#nЭто неприемлемо перед предстоящими переговорами с Тринити."
12010-201 = "Поэтому до подписания соглашения Префектурная команда возьмёт Сенсея под нашу опеку."
12010-202 = "А заодно разобраться с группой нарушителей — приятный бонус."
12010-203 = "..."
12010-204 = "Хорошо, что всё стало предельно ясно."
12010-205 = "Значит, ваш план — похитить Сенсея? Думаете, мы это позволим?"
12010-206 = "..."
12010-208 = "Да. Именно так всё и будет. Верно, Окусора Аяне?"
12010-209 = "...?"
12010-210 = "Если понадобится, мы без колебаний применим силу.#nБолее того, мы только приветствуем это."
12010-211 = "...!"
12010-213 = "..."
12010-214 = "Босс, это наш единственный шанс бежать. Как только начнётся бой, пути назад не будет."
12010-215 = "Префектурная команда попытается одним ударом уничтожить и нас, и Абидос. Но если студенты Абидоса отвлекут их огонь, мы сможем прорваться через одно из слабых мест."
12010-216 = "Хех."
12010-217 = "Хе-хе-хе..."
12010-218 = "Босс?"
12010-219 = "Ох, Кайоко. Ты ведь должна знать меня лучше."
12010-220 = "...?"
12010-221 = "Бежать? После того как они с нами обошлись? Мы никогда не поворачиваемся к врагу спиной!"
12010-222 = "Решатели проблем 68 — что угодно, но только не сборище третьесортных злодеев!"
12010-223 = "..."
12010-224 = ""
12010-225 = ""
12010-226 = "Я никогда себе не прощу, если позволю им уйти после такого вопиющего неуважения!"
12010-227 = "Ару..."
12010-228 = "(Но ведь вчера мы как раз сбежали из боя...)"
12010-229 = "*вздох* Значит, будем драться? Их будет трудно победить, даже если объединиться с Абидосом..."
12010-230 = "К тому же студенты Абидоса ни за что не станут с нами сотрудничать.#nОстаётся только—"
12010-231 = "Ладно! Работаем вместе с Решатели проблем 68! Сметём этих заносчивых мелких засранцев!"
12010-232 = "Мы станем щитом Сенсея."
12010-233 = "...?!"
12010-234 = "Все вместе защитим Сенсея! Ясно?"
12010-235 = "Как же быстро они переключаются..."
12010-236 = ""
12010-237 = "Ах... Ахахахаха!"
12010-238 = "Разумеется! За кого вы меня принимаете? Победа уже наша."
12010-239 = "Доверие на доверие! Таков путь Решатели проблем 68!"
12010-241 = "Да! И мы обязаны этим Сенсею!"
12010-242 = "И к слову, раменную мы взорвали вовсе не случайно!#nЭ-Это было полностью намеренно... ясно?!"
12010-243 = "Это была высокоуровневая психологическая война, доступная только хладнокровной преступнице вроде меня..."
12010-244 = "..."
12010-245 = ""
12010-246 = "Ну что ж. Мы знали, что такое возможно..."
12010-247 = "Но разве вы не стали друзьями СЛИШКОМ быстро?#nВообще-то такие вещи требуют времени."
12010-248 = "Но хорошо."
12010-249 = "Префектурная команда, в бой. Подавить Целевую группу и Решатели проблем 68, а также сделать всё возможное, чтобы захватить Сенсея."
12010-250 = "Сенсей — чужак в Кивотосе, поэтому проследите, чтобы он не пострадал."
12010-251 = "Я заставлю тебя заплатить за тот выстрел из дробовика!"
12010-253 = "Враг начал наступление!"
12010-254 = "Сенсей! Пожалуйста, командуй Решалами 68 вместе с нами!"
