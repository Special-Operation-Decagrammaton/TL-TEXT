[translation]
2601602-1 = "Стоит только начаться каникулам..."
2601602-2 = "Хм-хм! Песок до самого горизонта и бескрайние морские просторы..."
2601602-3 = ""
2601602-4 = "Это пляж!"
2601602-5 = "[s] «Ага! Факт неоспоримый!»"
2601602-6 = "Знаю, что это очевидно!"
2601602-7 = "Но хороший репортаж всегда начинается со сбора фактов!"
2601602-8 = "*принюхивается* Чую сенсацию! Солёную и с рыбным душком, как и положено настоящей сенсации!"
2601602-9 = "[s] «Разве у сенсаций бывает запах?»"
2601602-10 = "Да! Хотя, конечно, не у всех..."
2601602-11 = "Заголовок нашего специального репортажа: «Разоблачение! Ловим на горячем подозрительных пляжных торговцев!»"
2601602-12 = "Мы будем работать под прикрытием и разоблачать сомнительных дельцов, наживающихся на отдыхающих, потерявших голову от веселья!"
2601602-13 = "Нам уже прислали несколько наводок, так что чую: тут скрывается настоящая сенсация!"
2601602-14 = "Так, не будем терять времени! Вперёд!"
2601602-15 = ""
2601602-17 = ""
2601602-20 = ""
2601602-21 = "Ноги моей здесь больше не будет! Такие цены за такую еду!"
2601602-22 = "И вы называете это жареной скумбрией? Да любой увидит, что это какая-то мелкая сорная рыбёшка!"
2601602-23 = "Поставлю вам одну звезду! И всем об этом расскажу!"
2601602-24 = "Валяй, приятель. Думаешь, люди тащатся в такую даль из-за отзывов?"
2601602-25 = "Делай что хочешь. А мы подадим на тебя в суд за клевету."
2601602-26 = "В-ва-а-а! Ну вы и мерзавцы!"
2601602-27 = ""
2601602-29 = ""
2601602-30 = "Спасибо за визит! Приходите ещё!"
2601602-31 = "Столько шума, а закончилось всё довольно буднично."
2601602-32 = "Пишите о нас в интернете сколько угодно. У нас сезонный бизнес, так что, пока слухи разойдутся, нас здесь уже не будет."
2601602-33 = "И всё же не слишком ли мы наглеем? Продаём рыбёшек размером с мизинец под названием «Гигантская жареная скумбрия»."
2601602-34 = "Если хотим за один сезон заработать на весь остальной год, придётся экономить на всём! Ха-ха-ха!"
2601602-35 = "А идея не указывать цены нигде, кроме меню, просто гениальна! После заказа людям уже неловко отказываться, вот и платят!"
2601602-36 = "Ну что, сколько ещё вытянем из следующего простака?"
2601602-37 = ""
2601602-38 = ""
2601602-41 = ""
2601602-42 = "Добро пожаловать!"
2601602-43 = "Присаживайтесь! Проходите, вот сюда..."
2601602-44 = ""
2601602-46 = ""
2601602-47 = "О! А здесь намного приятнее, чем мне рассказывали!"
2601602-48 = "А?!"
2601602-49 = "Э-эта девчонка...!"
2601602-50 = "Что? Что не так?"
2601602-51 = "Идиот! Это же печально известный репортёр «Еженедельника Пандемониума»!"
2601602-52 = "Ай, точно! А с ней... Сенсей из Шале?!"
2601602-53 = "Слышал, если она вцепится в историю, то уже ни за что не отпустит!"
2601602-54 = "А большинство её читателей — студенты Геенны...!"
2601602-55 = "Теперь, когда подумал, она ведь ещё при входе упоминала какую-то «наводку»..."
2601602-56 = "Что будем делать?!"
2601602-57 = "Извините! Можно нам меню, пожалуйста!"
2601602-58 = "Д-да! Сейчас принесу!"
2601602-59 = "Для начала срочно снизь все цены в меню! Она непременно обвинит нас в обдирательстве!"
2601602-60 = "Т-точно!! И никаких фокусов с едой! Давай порции больше обычного, чтобы ничего не заподозрили!"
2601602-61 = "Тогда нам вот это, пожалуйста!"
2601602-62 = "Д-да! Конечно!"
2601602-63 = ""
2601602-65 = ""
2601602-66 = "Хм... Цены совсем не такие высокие, как в сообщениях. Наоборот, вполне разумные."
2601602-67 = "В одной из жалоб говорилось, что порции здесь до смешного крошечные, так что надо проверить и это!"
2601602-68 = "Хорошо! Я готова!"
2601602-69 = ""
2601602-71 = ""
2601602-72 = "[ns] «Чиаки? Что это у тебя?»"
2601602-73 = "Рулетка и весы! Нельзя писать статью, основываясь на одних субъективных впечатлениях! Иначе нас опять назовут газетой, которой пора на свалку!"
2601602-74 = "Иногда личные впечатления редактора точнее объективных данных, но в этот раз важны именно ФАКТЫ!"
2601602-75 = "Хи-хи-хи. Ни один грамм от меня не ускользнёт!"
2601602-77 = "А?!"
2601602-78 = "Она что, вытащила весы?!"
2601602-79 = "Если недовесим хоть чуть-чуть, она нас разнесёт!"
2601602-80 = "Разве работа под прикрытием не должна быть... ну, незаметной?!"
2601602-81 = "Что делать? У нас даже обычной скумбрии нет, не говоря уже о гигантской..."
2601602-82 = ""
2601602-84 = ""
2601602-85 = "П-погоди, придумал!"
2601602-87 = ""
2601602-88 = "В-ваша гигантская жареная скумбрия готова!"
2601602-89 = ""
2601602-91 = ""
2601602-92 = "Жареная... скумбрия?"
2601602-93 = "Это же похоже на... тунца..."
2601602-94 = "Х-ха-ха!! У нас сейчас специальная акция! Поэтому вместо скумбрии подаём жареного голубого тунца!"
2601602-95 = "Только сегодня, специально для вас!"
2601602-96 = "Ого-го! Вот это здорово!"
2601602-97 = "Хм... Цены разумные, а порции не просто не маленькие, а такие, что можно объесться."
2601602-98 = "Может, моя наводка была ложной... Мне говорили, здесь заправляют какие-то жулики."
2601602-99 = "[s] «Разве не хорошо, если они на самом деле честные?»"
2601602-100 = "Верно! Тогда это заведение заслуживает похвалы!"
2601602-101 = "Это тоже сенсация! Одну минутку!"
2601602-102 = ""
2601602-104 = ""
2601602-105 = ""
2601602-106 = ""
2601602-107 = ""
2601602-108 = ""
2601602-109 = "Пронесло, да?"
2601602-110 = "Она вроде довольна, так что вряд ли нас разоблачит!"
2601602-111 = "Похоже, этот сезон мы всё-таки переживём..."
2601602-113 = ""
2601602-115 = ""
2601602-116 = ""
2601602-117 = ""
2601602-118 = ""
2601602-119 = ""
2601602-120 = "О! Здесь ещё полно свободных мест!"
2601602-121 = "Хорошо, что пришли сразу, как увидели новость! Повезло!"
2601602-123 = "Ч-что это за толпа?!"
2601602-124 = "Да! Похоже, публикация сенсации принесла плоды!"
2601602-125 = "[s] «Почему сюда вдруг хлынуло столько народу?!»"
2601602-126 = "Ага! Я всем рассказала про редкое пляжное заведение с низкими ценами и огромными порциями!"
2601602-127 = "Только что выложила срочную новость об этом в соцсетях «Еженедельника Пандемониума»!"
2601602-128 = "Всё как в публикации! Здесь и правда дёшево!"
2601602-129 = "О, привет, Чиаки! И Сенсей здесь!"
2601602-130 = "Привет! Это место — настоящая находка, так что давайте поддержим его, заказав побольше!"
2601602-132 = "Отлично! Пройдёмся сразу по всему меню! Берём всё от сих до сих!"
2601602-133 = "А-а-а! Мы же так и не приписали к ценам ноль!"
2601602-134 = "Теперь уже поздно что-то менять!"
2601602-135 = "Извините! Мы здесь тоже хотим сделать заказ!"
2601602-136 = ""
2601602-138 = ""
2601602-139 = ""
2601602-140 = ""
2601602-141 = ""
2601602-142 = ""
2601602-143 = "Н-нет! Десятки заказов одновременно!"
2601602-144 = "Такими темпами мы израсходуем все запасы! Их ведь должно было хватить на целое лето!"
2601602-145 = "П-прошу прощения! У нас закончились все продукты!"
2601602-146 = "На сегодня мы закрываемся!"
2601602-148 = "Если продукты ещё есть, значит, вы не закрылись, верно?"
2601602-149 = "Мы сами проверим холодильник!"
2601602-151 = "Что?!"
2601602-153 = ""
2601602-156 = ""
2601602-157 = "Да тут в холодильнике ещё полно продуктов!"
2601602-158 = "Но это на завтра, госпожа!"
2601602-159 = "Тогда продайте нам всё прямо сейчас, а завтра отдохнёте!"
2601602-160 = "В-ва-а-а!"
2601602-161 = "А-ха-ха! Даже приятно на душе! Люблю поддерживать малый бизнес!"
2601602-162 = ""
2601602-164 = ""
2601602-167 = ""
2601602-168 = "Прошу, не пробивайте заказы сами! В-ва-а-а!"
2601602-170 = "Мы разорены!"
2601602-171 = ""
2601602-173 = "[ns] «Мне кажется, тот сотрудник плачет...?»"
2601602-174 = "Наверняка от счастья! Ах, как приятно видеть, что «Еженедельник Пандемониума» помогает процветать местным предприятиям!"
2601602-176 = "После этого, по мере распространения слухов, посетителей становилось всё больше."
2601602-177 = "Когда мы уходили из ресторана, толпа провожала нас аплодисментами и словами поддержки."
