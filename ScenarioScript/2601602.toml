[translation]
2601602-1 = "When the Vacation Begins..."
2601602-2 = "Hm, hm. White sand as far as the eye can see, and a horizon that stretches on#nforever..."
2601602-4 = "This is... the sea!"
2601602-5 = "[s] \"That's pretty obvious, isn’t it?\""
2601602-6 = "True, I think anyone who sees it would feel that way!"
2601602-7 = "However, news coverage is built upon a pile of facts!"
2601602-8 = "*Sniff, sniff* I smell a scoop around here!"
2601602-9 = "[s] \"Do scoops have a smell?\""
2601602-10 = "Yes! Well, not all of them do, but..."
2601602-11 = "This time's feature article is \"Exposed! Closing in on the Evil Merchants of #nthe Coast!\""
2601602-12 = "We'll be doing an undercover report on a baaaad restaurant that targets tourists #nwho are getting carried away by their vacation!"
2601602-13 = "We've received multiple tips, so it's safe to say they're almost certainly guilty!"
2601602-14 = "Well then, shall we go? Let's roll!"
2601602-21 = "What's the deal with this restaurant! The portion is way too small for the price!"
2601602-22 = "I ordered fried horse mackerel, but what is this tiny dish!"
2601602-23 = "I'm writing all about this in the reviews!"
2601602-24 = "Hah! Write whatever you want in the reviews."
2601602-25 = "We could even sue you for interfering with our business, you know?"
2601602-26 = "D-Damn it! I'm never coming back here again!"
2601602-30 = "Heh heh, thanks for your business."
2601602-31 = "Talking all big like that."
2601602-32 = "Even if they write a review, we'll be closed down by the time it spreads."
2601602-33 = "Still, not bad. Selling small fry under the name \"Extra Large Fried Horse Mackerel\"."
2601602-34 = "Heh heh. Gotta make a solid profit when we can!"
2601602-35 = "If we only write the prices on the menu and collect it right away, they won't be #nable to check!"
2601602-36 = "Now, who should we squeeze dry next..."
2601602-42 = "Welcome!"
2601602-43 = "Please take a seat!"
2601602-47 = "Oh! This restaurant is nicer than its reputation suggests!"
2601602-48 = "!!!"
2601602-49 = "Ah- That's...!?"
2601602-50 = "Who is it?"
2601602-51 = "You idiot! It's that reporter from Weekly Pandemonium!"
2601602-52 = "Now that you mention it...! And is that the Schale’s Sensei next to her?"
2601602-53 = "I heard that once the Weekly Pandemonium reporter bites into a scoop, she never lets go, no matter what."
2601602-54 = "Moreover, her readership consists of those Gehenna students...!"
2601602-55 = "I'm pretty sure... she just said something about our \"reputation\"..."
2601602-56 = "W-What do we do!?"
2601602-57 = "Excuse me! Could we get a menu!"
2601602-58 = "Y-Yes! I'll bring it right away!"
2601602-59 = "For now, just write down cheaper prices and hand it over!"
2601602-60 = "G-Got it! You make sure to cook the food properly too! Make it a large portion!"
2601602-61 = "Alright, we'd like this one, please!"
2601602-62 = "Right away! Please wait a moment!"
2601602-66 = "Oh? It's not that expensive."
2601602-67 = "There were rumors about the portions being small... Let's see that when the food arrives!"
2601602-68 = "Well then, let me get this ready first...!"
2601602-72 = "[ns] \"Chiaki? What's that?\""
2601602-73 = "A measuring cup and scale! I can't write an article based on my opinion alone! #nOtherwise, they'll call it a soup magazine again!"
2601602-74 = "There are times when subjectivity is important, but for this particular occasion, #nobjective facts are crucial!"
2601602-75 = "Fufufu, I won't overlook even a single gram of error, you know~?"
2601602-77 = "!?"
2601602-78 = "A scale!?"
2601602-79 = "If she uses that, we won't be able to talk our way out of it!"
2601602-80 = "Wait, isn't an undercover report supposed to be done secretly...?"
2601602-81 = "What do we do? We don't have regular-sized horse mackerel, let alone extra-large ones..."
2601602-85 = "...T-That's it!"
2601602-88 = "H-Here is your order of \"Extra Large Fried Horse Mackerel\"!"
2601602-92 = "Fried... horse mackerel?"
2601602-93 = "This looks like... tuna...?"
2601602-94 = "W-We're currently having an event! We are serving bluefin tuna instead of horse mackerel!"
2601602-95 = "It's a special dish for today only!"
2601602-96 = "I see! This is really amazing!"
2601602-97 = "Hmm... The price isn't high... #nAnd as for the amount, it's enough to make my stomach burst."
2601602-98 = "They don't feel like evil merchants at all. #nMaybe the tipster was mistaken?"
2601602-99 = "[s] \"If it wasn't a bad restaurant, isn't that a good thing?\""
2601602-100 = "That's true! In fact, they should be praised!"
2601602-101 = "This is a happy little miscalculation! Please wait a moment!"
2601602-109 = "W-well, we guess we managed to lie through it this time..."
2601602-110 = "She seems satisfied, so we probably won't be written in the news..."
2601602-111 = "With this, we safely make it through another yea—"
2601602-120 = "Thank goodness! There are still a lot of seats"
2601602-121 = "It was worth rushing here!"
2601602-123 = "W-What the!? All these people!?"
2601602-124 = "Ooh! Looks like the feature post is working perfectly!"
2601602-125 = "[s] \"There are a ton of customers coming in!?\""
2601602-126 = "Yes! That there's an amazing restaurant with cheap prices and large portions—"
2601602-127 = "I just posted a breaking news bulletin on the Weekly Pandemonium's #nsocial media!"
2601602-128 = "Just like the post said, it's ridiculously cheap!"
2601602-129 = "Hello Chiaki-chan! Ah, hello Sensei too!"
2601602-130 = "Hello! This is a great restaurant, so let's support them by ordering a lot!"
2601602-132 = "Alright! Excuse me! I'll take everything on the menu from here to here!"
2601602-133 = "W-Whaaaaaat! The menu prices are still the cheap ones!"
2601602-134 = "What do we do! We can't change them now!"
2601602-135 = "Excuse me! We'd like to order over here too!"
2601602-143 = "T-This is bad! The orders are pouring in!"
2601602-144 = "At this rate, they'll take all our ingredients!"
2601602-145 = "E-Excuse me customers! We've run out of ingredients!"
2601602-146 = "We are closed for today!"
2601602-148 = "Eh, really? Is there nothing left?"
2601602-149 = "Isn't there still some left?"
2601602-151 = "Excuse me!?"
2601602-157 = "Look! There's still a lot left in this fridge!"
2601602-158 = "T-Those are the ingredients for tomorrow...!"
2601602-159 = "If you use them all today, you can take tomorrow off!"
2601602-160 = "P-Please have mercy on us!"
2601602-161 = "Ahahaha! Recommending a good restaurant feels nice, doesn't it!"
2601602-168 = "We're making them in order, so please wait just a little longer!"
2601602-170 = "We're finished!"
2601602-173 = "[ns] \"The staff members are crying...?\""
2601602-174 = "Those must be tears of joy! #nI'm glad that Weekly Pandemonium was able to contribute to the local #ncommunity!"
2601602-176 = "(After that, customers who heard the rumors visited continuously)"
2601602-177 = "(When we left the restaurant, for some reason we received applause and cheers #nfrom the people around us)"