[translation]
2601602-1 = "When the vacation begins..."
2601602-2 = "Hmm, hmm. White sand as far as the eye can see, and a horizon that stretches on endlessly..."
2601602-4 = "This is... the ocean!"
2601602-5 = "[s] \"That's obvious.\""
2601602-6 = "Indeed, I think anyone would feel the same way!"
2601602-7 = "But, reporting is built upon a foundation of facts!"
2601602-8 = "Sniff, sniff... I can smell a scoop here!"
2601602-9 = "[s] \"Scoops have a smell?\""
2601602-10 = "Yes! Well, not all of them, but..."
2601602-11 = "Our feature article this time is: 'Exposed! Closing in on the unscrupulous merchants of the coast!'"
2601602-12 = "We're going undercover at a nasty shop that targets tourists who are too relaxed on their vacation!"
2601602-13 = "We've received multiple tips, so it's almost certainly a confirmed case!"
2601602-14 = "Here we go, then! Charge!"
2601602-21 = "What is this place! The portions are way too small for the price!"
2601602-22 = "I ordered horse mackerel fry, so what is this tiny thing?!"
2601602-23 = "I'm writing all of this in the reviews!"
2601602-24 = "Hah! Write whatever you want in the reviews."
2601602-25 = "I could just sue you for obstruction of business, you know?"
2601602-26 = "D-damn it! I'm never coming back here again!"
2601602-30 = "Heh, thanks for the business."
2601602-31 = "Big talk for someone like that."
2601602-32 = "By the time a review spreads, we'll have already closed up shop anyway."
2601602-33 = "Still, you've got guts. Selling small fry as 'Extra-Large Horse Mackerel Fry'."
2601602-34 = "Heh. You've gotta make money when you can!"
2601602-35 = "If you only write the price on the menu and take it away immediately, they can't verify it!"
2601602-36 = "Now then, who should I squeeze for money next..."
2601602-42 = "Welcome!"
2601602-43 = "Please, take any open seat!"
2601602-47 = "Oh! This place is better than the rumors suggested!"
2601602-48 = "!!!"
2601602-49 = "Wait, is that...!?"
2601602-50 = "Who is that?"
2601602-51 = "You idiot! That's the reporter from the Weekly Pandemonium!"
2601602-52 = "Now that you mention it...! And is that Sensei from Schale next to them?"
2601602-53 = "They say that once the Weekly Pandemonium reporter gets a lead on a scoop, they never let go."
2601602-54 = "And their readership is all those Gehenna students...!"
2601602-55 = "I'm sure they said something about 'preliminary rumors' earlier..."
2601602-56 = "W-what do we do!?"
2601602-57 = "Excuse me! Could we see the menu, please?"
2601602-58 = "Y-yes! I'll bring it right over!"
2601602-59 = "Quick, write down lower prices and give it to them!"
2601602-60 = "O-okay! And you, make sure you cook the food properly! And make the portions huge!"
2601602-61 = "We'll take these, please!"
2601602-62 = "Yes! Please wait just a moment!"
2601602-66 = "Oh? It's not that expensive."
2601602-67 = "There were rumors that the portions were small... let's verify that once the food arrives!"
2601602-68 = "I'll get the preparations ready first...!"
2601602-72 = "[ns] \"Chiaki? What's that?\""
2601602-73 = "A tape measure and a scale! I can't write an article based on subjectivity alone! Otherwise, people will call us a 'soup-like' magazine again."
2601602-74 = "Sometimes subjectivity is important, but in this case, objective facts are what matter!"
2601602-75 = "Hehehe, I won't let even a one-gram error slip by~!"
2601602-77 = "!?"
2601602-78 = "A scale!?"
2601602-79 = "If they use that, we won't be able to make any excuses!"
2601602-80 = "Wait, isn't undercover reporting supposed to be done secretly...?"
2601602-81 = "What do we do? We don't even have regular-sized horse mackerel, let alone extra-large ones..."
2601602-85 = "...A-aha!"
2601602-88 = "H-here is your 'Extra-Large Horse Mackerel Fry'!"
2601602-92 = "Horse... mackerel?"
2601602-93 = "This looks like... tuna, though..."
2601602-94 = "W-we're having an event right now! We're serving bluefin tuna instead of horse mackerel!"
2601602-95 = "It's a special one-day-only event!"
2601602-96 = "I see! That's certainly impressive!"
2601602-97 = "Hmm... The price isn't high... and the portion is so big I feel like I'm going to burst."
2601602-98 = "This doesn't feel like an unscrupulous merchant at all. Did our informant get it wrong?"
2601602-99 = "[s] \"If it's not a bad shop, isn't that a good thing?\""
2601602-100 = "You're right! If anything, we should be praising them!"
2601602-101 = "This is a happy miscalculation! Please wait a moment!"
2601602-109 = "D-did we manage to pull through...?"
2601602-110 = "They seem satisfied, so I doubt they'll write a bad article..."
2601602-111 = "We made it through another year—"
2601602-120 = "Great! There are still seats open!"
2601602-121 = "It was worth rushing over here!"
2601602-123 = "W-what is this!? All these people!?"
2601602-124 = "Oh~! It looks like the feature article was a huge success!"
2601602-125 = "[s] \"But there are so many customers here!?\""
2601602-126 = "Yes! I posted a breaking news update on the Weekly Pandemonium's social media just a moment ago—"
2601602-127 = "saying that there's a top-tier shop that's super cheap and has huge portions!"
2601602-128 = "Just like the post said, it's incredibly cheap!"
2601602-129 = "Hello, Chiaki! Oh, hello Sensei too!"
2601602-130 = "Hello! Since it's such a conscientious shop, let's order a lot and support them!"
2601602-132 = "Alright! Excuse me! I'll take everything on the menu from here to here!"
2601602-133 = "O-oh no! The menu prices are still set to the cheap ones!"
2601602-134 = "What do we do! We can't change them now!"
2601602-135 = "Excuse me! We'd like to order over here too!"
2601602-143 = "T-this is bad! The orders are coming in all at once!"
2601602-144 = "At this rate, they're going to take all our ingredients!"
2601602-145 = "S-sorry, customers! We've run out of ingredients!"
2601602-146 = "We're closed for the day!"
2601602-148 = "Eh, really? You don't have any left?"
2601602-149 = "Aren't there still some left?"
2601602-151 = "Huh!?"
2601602-157 = "Look! There's still plenty left in this fridge!"
2601602-158 = "T-that's for tomorrow's stock...!"
2601602-159 = "If you use it all up today, you can just take tomorrow off!"
2601602-160 = "H-have mercy on me!"
2601602-161 = "Ahaha! It feels so good to recommend a great shop!"
2601602-168 = "We're preparing them in order, so please wait just a little longer!"
2601602-170 = "It's all over!"
2601602-173 = "[ns] \"The shopkeeper... are they crying?\""
2601602-174 = "Those must be tears of joy! I'm so happy that the Weekly Pandemonium could contribute to the community!"
2601602-176 = "(After that, customers who had heard the rumors continued to visit without end.)"
2601602-177 = "(When we left the shop, for some reason, the people around us gave us applause and words of encouragement.)"