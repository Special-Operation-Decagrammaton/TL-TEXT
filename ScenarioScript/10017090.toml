[translation]
10017090-1 = "Эпилог; Рождественская песнь"
10017090-5 = "И после всего этого мы в итоге всё-таки праздновали вместе..."
10017090-6 = "Правда? Ха-ха. Пожалуй, никогда не знаешь наверняка, чем всё закончится."
10017090-7 = "Помните, я просила вас заглянуть в кафе?"
10017090-8 = "Конечно. И я заглянул. В конце концов. Я просто рад, что всё хорошо закончилось."
10017090-9 = "Пока всё происходило, я ужасно нервничала. Но, разумеется, в конце концов справедливость восторжествовала!"
10017090-10 = "У меня просто было чувство, что всё обязательно закончится хорошо!"
10017090-11 = "Ты невероятно позитивная, Ханаэ."
10017090-12 = "С-Слишком позитивная?!"
10017090-13 = "Нет-нет, вовсе нет. Меня это радует. Я даже немного тронута."
10017090-14 = "Н-Не говорите такого. Вы заставляете меня краснеть..."
10017090-15 = "[ns] «Майн, ты тоже что-нибудь скажи.»"
10017090-16 = ""
10017090-20 = "Мне действительно можно сейчас что-то сказать?"
10017090-21 = "Раз уж вы в меня верите, Сенсей, я отброшу свои сомнения..."
10017090-22 = "Кхм. В этом году произошло многое, но несмотря ни на что Рыцари спасения верно исполняли свой долг."
10017090-23 = "Сегодня каждый из Рыцарей спасения может по праву гордиться собой."
10017090-24 = "И в то же время мы должны продолжать совершенствоваться, размышляя об истинном смысле этого долга."
10017090-25 = ""
10017090-29 = "Ну, пожалуй, она не ошибается..."
10017090-30 = "Давай пока на этом и остановимся, Цуруги."
10017090-31 = ""
10017090-35 = "Мир чёрного чая оказался глубже, чем я думала. Я даже не знала, что существует столько купажей..."
10017090-36 = "Можно я помогу? Я немного разбираюсь в чёрном чае."
10017090-37 = "К-Капитан Майн? Д-Для меня это честь!"
10017090-38 = "В конце концов, капитан — самая утончённая среди Рыцарей спасения. Ха-ха-ха..."
10017090-39 = "Чтобы заботиться о пациентах, нужно разбираться во множестве вещей!"
10017090-40 = ""
10017090-44 = "Не уверена, что «знающие» — то слово, которым я бы описала некоторых людей..."
10017090-45 = "...Не стоит."
10017090-46 = ""
10017090-50 = "О, точно! У нас ещё остались самодельные перчатки и шапки! Можете взять их себе!"
10017090-51 = "В-вы уверены?!"
10017090-52 = "Их и делали для того, чтобы дарить. Пожалуйста, берите. Сегодня же Рождество!"
10017090-53 = "Большое спасибо. Какое замечательное Рождество!"
10017090-54 = "Хи-хи-хи. С Рождеством всех!"
10017090-55 = "Желаю всем счастливого Рождества."
10017090-56 = "Вы все отлично потрудились в этом году. С Рождеством."
10017090-58 = "С Рождеством!"
10017090-59 = "Счастливого Рождества в соборе: подарок Рыцарей спасения"
