[translation]
1009603-1 = "Техобслуживание водной горки"
1009603-2 = "Канна написала мне и попросила присоединиться к ней у открытой водной горки."
1009603-4 = "Питание... проверено. Подача воды... проверена. Внутренние системы... проверены. Пока всё хорошо..."
1009603-5 = "[s] «(Похоже, она занята. Может, немного подождать...)»"
1009603-6 = "Нижний бассейн... проверен. Весы... проверены. Всё чисто."
1009603-7 = ""
1009603-9 = ""
1009603-10 = "Сенсей, если вы уже здесь, могли бы и поздороваться."
1009603-11 = "[s1] «Хм?!»\n[s2] «О-Она меня заметила?»"
1009603-14 = "Конечно, я знала, что вы наблюдаете."
1009603-15 = "Я чувствовала на себе ваш взгляд."
1009603-16 = "Н-Нет, извиняться не нужно. Я вовсе не сердилась..."
1009603-17 = "В любом случае, перейдём к делу."
1009603-18 = "Эта «Мега-горка» откроется немного позже самого парка."
1009603-19 = "Это большой экстремальный аттракцион. Посетители его обожают. Поэтому время открытия специально сдвинуто, чтобы все не ринулись сюда одновременно."
1009603-20 = "Я закончила все проверки, всё работает нормально."
1009603-21 = "[s] «Хорошо... Я могу чем-нибудь помочь?»"
1009603-22 = "Конечно."
1009603-23 = "Перед открытием остался последний этап: пробный запуск."
1009603-24 = "Спасатель должен сам спуститься по горке и убедиться, что весь маршрут проходит без проблем."
1009603-25 = "Поэтому я и связалась с вами — хотела спросить, согласитесь ли вы принять участие."
1009603-26 = "[s3] «Под „принять участие“ ты имеешь в виду...?»\n[s4] «Ты хочешь, чтобы мы спустились вместе?»"
1009603-29 = "Так я буду гораздо увереннее."
1009603-30 = "Эта горка рассчитана сразу на нескольких человек."
1009603-31 = "Общий вес группы должен укладываться в определённый диапазон, иначе это будет небезопасно."
1009603-32 = "Поэтому я... надеялась, что вы присоединитесь ко мне, да."
1009603-33 = "[s5] «Если так, я с удовольствием помогу.»\n[s6] «Хех, и даже в очереди стоять не придётся.»"
1009603-36 = "Тогда подготовимся. И спасибо."
1009603-37 = ""
1009603-39 = ""
1009603-40 = ""
1009603-41 = "[ns7] «У меня есть один вопрос.»\n[ns8] «Можно спросить...?»"
1009603-44 = "Конечно. Отвечу на всё, на что смогу."
1009603-45 = "А? Люблю ли я аттракционы?"
1009603-46 = "...Я обычно не ищу таких острых ощущений, но и не избегаю их."
1009603-47 = "Меня нелегко напугать или застать врасплох."
1009603-48 = "[s] «Но разве эта Мега-горка не славится тем, что она ужасно страшная?»"
1009603-49 = "Для водной горки она, наверное, довольно страшная, но не страшнее террориста с базукой."
1009603-50 = "Я директор Бюро общественной безопасности. Мне не раз приходилось сталкиваться с НАСТОЯЩЕЙ опасностью."
1009603-51 = "На этом фоне аттракцион со встроенными мерами безопасности даже развлечением не кажется."
1009603-52 = "[s9] «Впечатляет, Канна...»\n[s10] «Не уверен, что могу сказать то же самое о себе...»"
1009603-55 = "Что ж, если испугаетесь, можете кричать сколько угодно."
1009603-56 = "Не переживайте, вашего лица я всё равно не увижу. Внутри будет кромешная тьма."
1009603-57 = "Хорошо, тогда садитесь сюда. Начинаем пробный запуск."
1009603-59 = "Мы с Канной сели друг напротив друга в надувной круг."
1009603-60 = ""
1009603-61 = "Всё готово. Пожалуйста, держитесь за ручки."
1009603-62 = "Три, два, один."
1009603-63 = "Выдвигаемся!"
1009603-64 = ""
1009603-67 = "[ns] «(Ого! Я знал, что будет захватывающе, но это что-то!)»"
1009603-68 = "Ик... Ииик..."
1009603-69 = "И-и-и-а-а-а!"
1009603-70 = "[s] «А?!»"
1009603-74 = ""
1009603-75 = "..."
1009603-76 = "[s] «...»"
1009603-77 = "*кашляет*"
1009603-78 = "[s] «Канна... ты ведь не испугалась?»"
1009603-79 = "Я-я не понимаю, о чём вы."
1009603-80 = "Напомню ещё раз: я директор Бюро общественной безопасности. Такой аттракцион для меня — сущая мелочь."
1009603-81 = "[s] «А тот крик, который я слышал на горке... что это тогда было...?»"
1009603-82 = "Я-я ничего не слышала."
1009603-83 = "Возможно, это шумела вода. Или из-за стресса и страха вам просто послышалось."
1009603-84 = "Такое бывает."
1009603-85 = "[s] «...»"
1009603-87 = "[ns] «Тогда прокатимся ещё раз?»"
1009603-88 = ""
1009603-89 = "Н-Нет, спасибо. Одного пробного запуска более чем достаточно."
1009603-90 = "Вообще-то я больше никогда туда не полезу."
1009603-91 = "Никогда!"
