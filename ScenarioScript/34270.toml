[translation]
34270-1 = "Эпизод 27;Эпилог"
34270-3 = ""
34270-7 = "Я-я никогда раньше не ходила этим путём..."
34270-8 = "А вдруг он приведёт нас в какое-нибудь ужасное место?"
34270-9 = "Не узнаем, пока не попробуем, Хиёри."
34270-10 = "Отныне каждый путь для нас неизвестен."
34270-11 = "...От этого не менее страшно."
34270-12 = ""
34270-14 = ""
34270-15 = "...А?"
34270-16 = "Г-Где лидер?!"
34270-17 = "А?"
34270-18 = "Разве она не была позади нас?! Исчезла! Может, её съели..."
34270-20 = "...Тц."
34270-21 = "Мисаки...?"
34270-22 = "Лидер ушла."
34270-23 = "Ушла?! В каком смысле у-ушла? Как она могла уйти? Куда?"
34270-24 = "Не знаю. Просто сказала заботиться об остальных."
34270-25 = "Но почему? Лидер..."
34270-26 = "..."
34270-27 = "Это нечестно, Саори. Если мне придётся делать всё самой... Я..."
34270-28 = "Для меня это слишком тяжело."
34270-29 = "Всё будет хорошо, Мисаки."
34270-30 = "Химэ..."
34270-31 = ""
34270-33 = ""
34270-35 = "Саори понадобится время."
34270-36 = "Ей нужно понять, кто она, и обдумать свои вопросы."
34270-37 = "Она сама найдёт нужные ответы."
34270-38 = "Н-Но... она вернётся? Я уже по ней скучаю..."
34270-39 = "Конечно. Она никогда нас не бросит."
34270-40 = "Значит, нам нужно идти дальше самим? Без неё?"
34270-41 = "Саори заботилась о нас все эти годы. Мы обязаны хотя бы этим."
34270-43 = "Но как?"
34270-44 = "Куда мы пойдём?"
34270-45 = "Ариус, Тринити, Геенна... Нас нигде не ждут."
34270-46 = "Мы будем в бегах. Никогда не задерживаться надолго на одном месте, чтобы нас не поймали."
34270-47 = "Ты готова к такой жизни, Химэ?"
34270-48 = "Да. Я была готова с того момента, как мы решили жить."
34270-49 = "..."
34270-50 = "О нет..."
34270-51 = "Химэ. Идеалами пустой желудок не накормишь."
34270-52 = "Знаю. Но мы справимся."
34270-53 = "..."
34270-54 = "Полевые цветы пробиваются сквозь трещины в бетоне."
34270-55 = "Азуса однажды сказала мне это."
34270-56 = ""
34270-58 = ""
34270-60 = "Мы продолжим бороться, даже если всё тщетно."
34270-61 = "Если Азуса смогла, значит, сможем и мы. Мы многое пережили вместе."
34270-62 = "И на этот раз мы не совсем одни."
34270-63 = ""
34270-65 = ""
34270-67 = ""
34270-68 = "...Сенсей."
34270-69 = "...Хорошо."
34270-70 = "Мы найдём способ..."
34270-72 = "Да. Работы впереди много."
34270-76 = "..."
34270-77 = ""
34270-79 = ""
34270-80 = ""
34270-86 = "Хи-хи-хи. А какая у тебя история, новичок? Просто так сюда никто не попадает."
34270-87 = "Не любишь говорить? Мне всё равно, лишь бы навыки были. Какую работу ищешь? Лёгкую или сложную?"
34270-89 = "Дай мне дорогую миссию. Самую сложную, какая есть."
34270-90 = ""
34270-92 = ""
34270-94 = "(Теперь я преступница в бегах. Я знаю, легко не будет.)"
34270-95 = "(Но дорога боли, по которой я шла все эти годы, должна когда-нибудь закончиться.)"
34270-96 = "(Если я дойду до конца, ждёт ли нас счастливое будущее?)"
34270-98 = ""
34270-100 = "У нас будет счастливый конец."
34270-101 = "Я верю в полевой цветок, цветущий сквозь бетон."
34270-102 = "Я верю в тебя, Саори."
34270-125 = "..."
34270-126 = ""
34270-128 = ""
34270-130 = "..."
34270-131 = ""
34270-133 = ""
34270-135 = "..."
34270-136 = ""
34270-138 = "Сенсей. Я больше не могу видеть вещие сны."
34270-139 = "Такова цена, которую я заплатила, чтобы выбраться из бесконечного сна."
34270-140 = "Мне нужно рассказать вам о последнем вещем сне."
34270-146 = ""
34270-147 = "Но, пожалуй... в другой раз."
34270-148 = "Сейчас я хочу запомнить этот момент."
34270-149 = "Мы наконец снова все вместе."
34270-150 = "И, как всегда, вместе преодолеем любое препятствие."
34270-152 = "[ns] «Хорошо, начнём слушание.»"
34270-167 = ""
34270-169 = "Это не то, что мне должны!"
34270-170 = "Хм? Не понимаю."
34270-171 = "Что это такое? Здесь даже половины обещанной суммы нет!"
34270-172 = "Ты сама нарушила наше соглашение."
34270-173 = "В контракте чётко написано: оплата студенту — тысяча йен."
34270-174 = "Но ты скрыла, что бросила школу, поэтому пятьсот."
34270-175 = "Что? Подожди, это..."
34270-176 = "Вот расчёт после вычета налогов, разных расходов и питания. Есть вопросы?"
34270-177 = "И, похоже, ты в розыске. Разве у тебя не будут проблемы, если кто-нибудь узнает, что ты здесь?"
34270-178 = "Придётся вычесть ещё пятнадцать процентов за конфиденциальность."
34270-180 = "Что? Подожди, тогда... сколько я получу...?"
34270-181 = ""
34270-184 = ""
34270-186 = "Ноль. Ни копейки. Ничего."
34270-187 = "Выход вон там."
34270-188 = "Есть жалобы? Уверена, можешь обратиться с ними в Полицейскую школу Валькирии."
34270-189 = ""
34270-192 = ""
34270-193 = "...Нет, поняла."
34270-194 = "Будем считать, урок усвоен."
34270-195 = ""
34270-198 = ""
34270-199 = ""
34270-202 = ""
34270-203 = "П-Простите."
34270-204 = "О, ты... та, кому я в прошлый раз дала заказ...?!"
34270-205 = "О, да-да... Э-Эм... Я кое-что забыла..."
34270-206 = "Забыла? Но расчёты уже закончены."
34270-207 = "Э-эм, да. Т-Так вот..."
34270-208 = ""
34270-210 = ""
34270-211 = "П-Прости..."
34270-212 = "Простить?"
34270-214 = "Я ТЕБЯ НЕ ПРОЩУ!!!"
34270-215 = ""
34270-224 = "П-Пожалуйста! Пощади!!"
34270-225 = "Как ты посмела украсть деньги Ару?! Я никогда тебя не прощу! Заставлю пожалеть, что ты вообще родилась!"
34270-226 = ""
34270-234 = ""
34270-235 = ""
34270-237 = "Ик."
34270-238 = "А-Ару сказала, что я должна прийти и донести свою мысль... сказать, чтобы ты правильно посчитала..."
34270-239 = "Д-Думаю, я донесла мысль...?"
34270-240 = "..."
34270-241 = "О-О! Я не знала, что здесь ещё кто-то есть!"
34270-242 = "П-Простите за шум! Простите, ч-что существую!"
34270-243 = "...Ничего страшного."
34270-244 = "Х-Хорошо! Т-Тогда мне нужно установить ещё несколько бомб... Пока!"
34270-245 = ""
34270-247 = ""
34270-248 = "Так устроен преступный мир?"
34270-251 = "Ч-что?!"
34270-253 = "П-Простите... Простите. Я просто ничего не умею делать правильно. Простите, что расстроила. Хотите, я исчезну? Мне вообще не стоило рождаться."
34270-254 = "*вздыхает*"
34270-255 = "А-ха-ха-ха! Ты лучшая, Харука! Ты точно донесла свою мысль!"
34270-256 = "Вот это были большие страшные ребята, которых ты взорвала. И что вы теперь будете делать, а?"
34270-257 = "Вот морока. Можно нам хоть один спокойный день?"
