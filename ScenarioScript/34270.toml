[translation]
34270-1 = "Episódio 27;Epílogo"
34270-7 = "E-Este caminho é novo pra mim..."
34270-8 = "Aonde será que ele leva...?"
34270-9 = "Vamos seguir em frente por enquanto."
34270-10 = "Não importa para onde formos, daqui em diante qualquer caminho será novo para nós."
34270-11 = "Sim... você tem razão."
34270-15 = "...Ué."
34270-16 = "C-Cadê a líder?!"
34270-17 = "Hã?"
34270-18 = "T-Tenho certeza de que a líder estava logo atrás da gente...#nE-Ela sumiu?!"
34270-20 = "...Tsc."
34270-21 = "Misaki...?"
34270-22 = "A líder foi embora pra algum lugar..."
34270-23 = "C-Como assim, foi embora pra algum lugar?!"
34270-24 = "Ela só me pediu pra cuidar de todas vocês e sumiu... Que egoísta."
34270-25 = "Líder... P-Por quê...?"
34270-26 = "..."
34270-27 = "Isso é golpe baixo, Saori.#nDeixar uma corrente dessas me prendendo..."
34270-28 = "É um fardo pesado demais pra mim..."
34270-29 = "...Está tudo bem, Misaki."
34270-30 = "Princesa..."
34270-35 = "A Saori só precisa de mais um tempinho."
34270-36 = "— Tempo para olhar para trás e conhecer a si mesma."
34270-37 = "Tempo para encontrar a resposta para a sua própria questão..."
34270-38 = "A líder... A Saori-neesan vai voltar?"
34270-39 = "Sim... A Sacchan vai voltar."
34270-40 = "Daqui pra frente, vamos ter que... sobreviver só nós três?"
34270-41 = "Sim... Não podemos depender da Sacchan para sempre, afinal."
34270-43 = "Não pode ser..."
34270-44 = "O que nós vamos fazer agora...?"
34270-45 = "Não temos lugar no Distrito Autônomo de Arius, nem em Trinity, nem em Gehenna..."
34270-46 = "...Acho que vamos ter que viver vagando de um canto para outro para fugir dos nossos perseguidores."
34270-47 = "É esse o futuro que nos espera... Princesa."
34270-48 = "Sim... Mesmo assim, nós vamos ficar bem."
34270-49 = "..."
34270-50 = "Princesinha..."
34270-51 = "Princesa... Não vai ser nada fácil."
34270-52 = "Não se preocupe, vai dar tudo certo."
34270-53 = "..."
34270-54 = "Se reclamarmos por causa disso, seria uma falta de respeito com a flor que desabrocha no concreto."
34270-55 = "Naquela época, a Azusa olhou para a flor e disse o seguinte:"
34270-60 = "Que, por mais que tudo pareça em vão... nunca devemos parar de resistir."
34270-61 = "Se a Azusa conseguiu chegar até lá, não tem como nós não conseguirmos.#nPorque a nossa juventude pertence somente a nós."
34270-62 = "E também temos alguém que está olhando por nós... Não é?"
34270-68 = "...O Sensei, né?"
34270-69 = "...Sim."
34270-70 = "É verdade..."
34270-72 = "Sim, vamos dar o nosso melhor juntas."
34270-76 = "..."
34270-86 = "...Heh. Um rosto que nunca vi por aqui.#nSe veio parar num lugar destes, imagino que tenha lá as suas circunstâncias."
34270-87 = "Desde que tenha habilidade, o resto não me importa.#nPois bem, que tipo de serviço você procura?#nAlgo simples? Ou algo difícil?"
34270-89 = "Um difícil... Não, não importa o quão impossível seja o trabalho, eu darei um jeito.#nMe dê uma missão que pague bem."
34270-94 = "(Eu sou uma criminosa — uma fugitiva, e daqui em diante terei dias duros e dolorosos pela frente.)"
34270-95 = "(Mas, se ao final dessa jornada de provações...)"
34270-96 = "(Houver um futuro maravilhoso esperando por nós também...)"
34270-100 = "Sim, esse dia vai chegar... para nós também..."
34270-101 = "...No fim, com certeza teremos um final feliz."
34270-102 = "Para nós também, não é, Saori?"
34270-125 = "..."
34270-130 = "..."
34270-135 = "..."
34270-138 = "Sensei... Provavelmente nunca mais terei sonhos proféticos."
34270-139 = "Esse foi — o preço a pagar para escapar daquele sonho."
34270-140 = "O que testemunhei no meu último sonho profético... é algo que precisarei discutir com o Sensei..."
34270-147 = "Contudo... será que isso pode ficar para um futuro um pouco mais distante?"
34270-148 = "Pois, agora... quero apenas me concentrar no nosso \"presente\", reunidas aqui."
34270-149 = "E... nós..."
34270-150 = "Uniremos forças como fizemos até agora — somando nossos esforços para superar essa provação."
34270-152 = "[ns] \"Muito bem, vamos começar a audiência.\""
34270-169 = "Espere, não foi esse o combinado."
34270-170 = "Ora, do que está falando?"
34270-171 = "O que significa isso?#nNão tem nem metade do valor prometido aqui!!"
34270-172 = "Mas foi você quem quebrou o acordo primeiro."
34270-173 = "Como consta neste contrato, o pagamento para estudantes é de 1.000 ienes por hora."
34270-174 = "No entanto, você escondeu o fato de que largou a escola, não foi?#nPortanto, o valor cai para 500 ienes por hora."
34270-175 = "Espere um pouco... Isso é..."
34270-176 = "Descontando os impostos, taxas diversas e despesas de alimentação, chegamos a essa quantia... Algum problema?"
34270-177 = "Ah... além disso, parece que você é uma fugitiva procurada.#nSe essa informação vazar, quem sairá prejudicada não é você?"
34270-178 = "Sendo assim, descontarei mais 15% como taxa pelo meu silêncio."
34270-180 = "E-Espere... Então o meu pagamento é..."
34270-186 = "Zero ienes, exato."
34270-187 = "Pois bem, a saída é por ali."
34270-188 = "Tem alguma reclamação?#nOu prefere abrir uma queixa na Escola de Polícia Valkyrie?"
34270-193 = "...Não, entendi."
34270-194 = "Vou encarar isso como uma lição aprendida."
34270-203 = "C-Com licença."
34270-204 = "Você é... aquela que nos contratou outro dia...?!"
34270-205 = "A-Ah, sim... É-É que...#nEu acabei me descuidando..."
34270-206 = "Tenho certeza de que já acertamos as contas."
34270-207 = "S-Sim... I-I-Isso mesmo.#nExatamente... E-Então, por isso..."
34270-211 = "I-Imperd..."
34270-212 = "Imperd?"
34270-214 = "IMPERDOÁVEL!!!!!!!"
34270-224 = "I-Iiiih?! S-Socorro?!"
34270-225 = "Passar a perna no dinheiro da Aru-sama é absolutamente imperdoável!!!"
34270-237 = "...Arf, arf."
34270-238 = "A-A Aru-sama me mandou dar um belo cumprimento...#nE-E acertar as contas direitinho... E-Então..."
34270-239 = "I-Isso já deve servir como um cumprimento adequado, né...?"
34270-240 = "..."
34270-241 = "A-Aaah...?!#nTinha outra pessoa aqui?!"
34270-242 = "P-Perdão pelo incômodo, p-peço mil desculpas!!"
34270-243 = "...Não, tudo bem."
34270-244 = "E-Então, até a próxima...#nPreciso ir plantar as bombas agora..."
34270-248 = "Então é assim que as coisas funcionam no submundo..."
34270-251 = "O-O QUE VOCÊ FEZ?!"
34270-253 = "M-Me desculpe... me desculpe... me desculpe...#nEu não sabia que \"dar um cumprimento\" não significava isso... C-Causei problemas de novo. Q-Quer que eu morra? Posso morrer para compensar?"
34270-254 = "...Ah, céus."
34270-255 = "Ahahahaha! Hilário demais!!#nA Haruka-chan foi lá dar um \"cumprimento\" de verdade~"
34270-256 = "Aquele pessoal parecia super perigoso, o que a gente vai fazer agora~?"
34270-257 = "Parece que as coisas vão ficar barulhentas de novo... *Suspiro*."
