[translation]
61050-1 = "Эпизод 5;Тайная вечеря(?)"
61050-2 = ""
61050-3 = "Спонсором была... Кирифуджи Нагиса? Из всех возможных людей?"
61050-4 = "Объяснитесь! Меня об этом не предупреждали!"
61050-5 = "Уааа! Прощай, жестокий мир... Нас похитят и увезут в Тринити... наверняка будут пытать... Только ногти не вырывайте, пожалуйста!"
61050-6 = ""
61050-8 = ""
61050-9 = "Хиёри, мы больше таким не занимаемся..."
61050-10 = "«Больше»? Значит, раньше занимались! Получается, «Апокриф Ариуса» был правдой!"
61050-11 = ""
61050-13 = ""
61050-22 = ""
61050-23 = "С-Сенсей...?"
61050-24 = "Сенсей?"
61050-25 = ""
61050-26 = "[ns1] «Давайте все сделаем глубокий вдох!»\n[ns2] «Ни у Нагисы, ни у меня нет дурных намерений.»"
61050-30 = "И вы думаете, мы просто в это поверим?"
61050-31 = "УВАААААА!"
61050-32 = ""
61050-33 = "Кхм. Тогда начнём сначала? Рада снова вас видеть, отряд Ариус."
61050-34 = "Я Кирифуджи Нагиса, хозяйка Чаепития."
61050-35 = "Здравствуйте, Нагиса. А я Хакари Ацуко из отряда Ариус. Взаимно рады знакомству."
61050-36 = "Я рада наконец познакомиться с вами официально."
61050-37 = ""
61050-39 = ""
61050-40 = "Имашино Мисаки."
61050-41 = "Я-Я Цучинага Хиёри... Хи-хи..."
61050-42 = "...Джомаэ Саори."
61050-43 = "Полагаю, обо мне вы как минимум знаете."
61050-45 = "Нет, не только о тебе. Я знаю всех вас, пусть лишь по отчётам и слухам."
61050-46 = "А учитывая характер нашего прошлого, не знать меня вы просто не могли."
61050-47 = "...Вы сразу переходите к делу, да?"
61050-48 = "И-И-и..."
61050-49 = "Хватит, Мисаки. Не будем упускать возможность поговорить друг с другом откровенно. Поэтому, пожалуйста... И ты тоже, Саори."
61050-51 = "...Ладно."
61050-52 = "Поняла."
61050-54 = "Что ж. Раз с представлениями покончено, пройдём внутрь?"
61050-55 = "Ч-Что...? Внутрь корабля?"
61050-56 = "Да, конечно. Я арендовала этот круизный лайнер на весь день, поэтому не беспокойтесь о посторонних глазах."
61050-58 = "?!"
61050-59 = "?!"
61050-60 = "..."
61050-61 = "[ns3] «Вы арендовали ВЕСЬ КОРАБЛЬ?!»\n[ns4] «Это не чересчур?!»"
61050-64 = "Хм? Почему? Корабль всё время останется у причала. Мне ведь даже не пришлось нанимать команду."
61050-65 = "Такая сумма вполне укладывается в бюджет. Итак."
61050-66 = ""
61050-68 = ""
61050-69 = "Это... какой-то особый вид кошмара... Хотя лучше бы это БЫЛ кошмар... Даже взрослая жизнь не так страшна..."
61050-70 = "...Во многих смыслах они действительно живут в другом мире, не таком, как наш."
61050-71 = "Ч-Что нам теперь делать?"
61050-72 = ""
61050-73 = "[ns] «Давайте... пока примем её гостеприимство...?»"
61050-75 = "Отлично. Тогда пойдём за ней."
61050-76 = "Хм? Вы рады, что хотя бы я воспринимаю это спокойно?"
61050-77 = "Ага. Видите ли, редко удаётся увидеть вас настолько озадаченной. Поэтому я решила, что обстоятельства и правда совершенно необычные."
61050-78 = "Если всё уже вышло далеко за рамки наших самых безумных ожиданий, разумнее просто плыть по течению, не так ли?"
61050-79 = "[ns] «Если Ацуко может, то и я смогу!»"
61050-83 = "О-Ого..."
61050-84 = "Кто-нибудь голоден? В этом ресторане нет меню, поэтому просто закажите всё, чего пожелает душа."
61050-86 = "...Просто заказать всё, что хочу? Как ресторан вообще может работать без меню?"
61050-87 = "[ns5] «Нет, Мисаки... Это знак их кулинарной гордости!»\n[ns6] «Они уверены, что действительно способны приготовить что угодно!»"
61050-90 = "В-Вот как? Я даже не знала, что такое возможно..."
61050-91 = "...Это что, наша последняя трапеза? Ну это уже..."
61050-93 = "«П-Последняя трапеза»? О чём ты? Я всего лишь хотела, чтобы мы вместе пообедали..."
61050-94 = "Госпожа Нагиса? Простите. Мы не очень привыкли к подобным местам."
61050-95 = "Можно оставить заказ на ваше усмотрение?"
61050-96 = "Конечно, Ацуко.#nПростите? Мы готовы сделать заказ."
61050-97 = ""
61050-99 = ""
61050-100 = ""
61050-101 = "Поняла, госпожа Нагиса. Как пожелаете."
61050-102 = "Что ж."
61050-104 = "Одно блюдо сменялось другим... и всё это были виды еды, которых я раньше даже не видела, не говоря уже о том, чтобы пробовать."
61050-105 = ""
61050-110 = "Для Нагисы это, похоже, был самый обычный обед. Остальные же настолько растерялись от незнакомой еды, что даже не могли осмыслить все эти разные вкусы."
61050-111 = "...То есть все, кроме одного человека."
61050-112 = ""
61050-113 = ""
61050-114 = ""
61050-115 = "Шо фкушна... Шооо фкуушна...!"
61050-116 = "Х-Хиёри? Невежливо разговаривать с набитым ртом..."
61050-117 = "*жует* *глотает* П-Простите...! Просто это та-а-ак вкусно! Столько вкусов, которых я никогда не пробовала!"
61050-118 = "Рада это слышать. Пожалуйста, не стесняйся. Здесь более чем достаточно."
61050-120 = "Всем понравилась еда?"
61050-121 = "[s] «Это было потрясающе...»"
61050-122 = "...Спасибо. Правда."
61050-123 = "Согласна. Мне даже было немного неловко есть что-то настолько роскошное."
61050-124 = ""
61050-126 = ""
61050-127 = "М-Может, попросим коробочку с собой!"
61050-128 = "Я понимаю твои чувства, но лучше проявить умеренность, Хиёри."
61050-129 = "Буууу... Ладно..."
61050-131 = "Может, выпьем чаю, чтобы помочь пищеварению?"
61050-132 = "Я принесла с собой чайные листья Brinings. Это одна из моих любимых марок."
61050-133 = "Приготовить его для вас, госпожа?"
61050-134 = "Нет, спасибо. Я сделаю сама. Это займёт всего минуту."
61050-136 = "Нагиса заваривала чёрный чай привычными, точными и выверенными движениями."
61050-137 = ""
61050-141 = "Вскоре вокруг разлился восхитительный аромат чёрного чая."
61050-142 = ""
61050-143 = "Вот и всё. Готово. Возможно, получилось не совсем на моём обычном уровне, но надеюсь, вам понравится."
61050-144 = ""
61050-146 = ""
61050-147 = "Х-Хи-хи... Такой тёплый... сразу становится уютно... М-м-м, напоминает Время воды в Ариусе."
61050-148 = "...А. Точно. Было такое."
61050-150 = "«Время воды»...?"
61050-152 = "Это было редким поощрением, но иногда тому, кто лучше всех проявлял себя на тренировке, выдавали чашку тёплой воды."
61050-153 = "Обычно как раз примерно в это время года."
61050-154 = ""
61050-155 = "[ns] «(Тёплая вода...?)»"
61050-156 = "Когда мне её давали, я смаковала воду крохотными-крохотными глотками. Но потом она остывала..."
61050-157 = "Забавно: это была всего лишь чуть тёплая вода... а почему-то казалась самой вкусной вещью на свете..."
61050-158 = "А! Г-Госпожа... Нагиса? Миледи? Ваше величество? Эм, в общем, ваш чай, конечно, в миллион раз лучше какой-то скучной чашки воды!"
61050-160 = "Спасибо. И, пожалуйста, можешь просто называть меня Нагисой."
61050-161 = "Вообще-то именно я попросила Сенсея помочь организовать эту встречу."
61050-162 = "...Вы первой связались с Сенсеем?"
61050-163 = "..."
61050-164 = "Откуда вы узнали? Сенсей говорил только с двумя переведёнными студентами."
61050-165 = ""
61050-166 = "[ns] «Кхм! Итак, если позволите объяснить—!»"
61050-167 = "Нет, Сенсей. Думаю, лучше будет, если это скажу я."
61050-168 = "По крайней мере, именно поэтому я и хотела провести эту встречу."
61050-169 = "С чего бы начать?"
61050-170 = "Разведывательный комитет Тринити трудится неустанно и показывает превосходные результаты."
61050-171 = "...Значит, вы знали о них ещё до Сенсея."
61050-172 = "А учитывая, что первой связались именно вы... За всеми переведёнными из Ариуса ведётся наблюдение, верно?"
61050-173 = "Видите ли..."
61050-174 = "[ns7] «А тепе-ерь предоставьте всё Сенсею!»\n[ns8] «Возможно, я передаю эстафету немного рано, но надеюсь, вы не против!»"
61050-177 = "С-Сенсей?"
61050-178 = "[s9] «Всё хорошо, Нагиса. Иногда нужно полагаться и на меня.»\n[s10] «К тому же я уже проверил всё, о чём ты мне рассказала.»"
61050-181 = "...Тогда оставлю это вам."
61050-182 = ""
61050-184 = ""
61050-185 = ""
61050-186 = "[ns11] «Ты права. За каждым переведённым студентом закреплена студент Тринити.»\n[ns12] «Но они помогают освоиться, а не следят за ними.»"
61050-189 = "[ns13] «На самом деле именно переведённые студенты...»\n[ns14] «...рассказали своим напарницам из Тринити о нашей встрече.»"
61050-192 = "...И я должна просто поверить в это?"
61050-193 = "Я понимаю, что прошу слишком многого. Между нашими школами слишком много разрушенных мостов, а я член Чаепития... Но всё же..."
61050-194 = ""
61050-195 = "[ns] «Можете хотя бы довериться своему учителю?»"
61050-197 = "..."
61050-198 = "Я-Я могу... Вы ведь Сенсей..."
61050-199 = "Хиёри..."
61050-200 = "Н-Но Сенсей столько нам помогал..."
61050-201 = "Он мог вызвать Валькирию в любой момент. И прямо сейчас может!"
61050-202 = "Нас запрут глубооооко в Исправительном бюро... или в каком-нибудь месте ещё страшнее..."
61050-203 = "П-Постойте! Вы всё это время только притворялись добрыми, выжидая, пока сможете нас утащить?! ИИИК!"
61050-204 = "После всего, через что мы прошли... вот и настал конец! Жизнь — лишь боль и страдания! Всё тщетно! Так что я хотя бы допью этот чёрный чай, прежде чем меня запрут!"
61050-205 = ""
61050-207 = ""
61050-208 = ""
61050-209 = ""
61050-210 = ""
61050-211 = "С-Сенсей? Она..."
61050-212 = "[s15] «Не волнуйся... Такова уж наша Хиёри...»\n[s16] «Не обращай на неё особого внимания.»"
61050-215 = "Как скажешь..."
61050-216 = "Хм? Мне следует сосредоточиться на том, ради чего я пришла?"
61050-217 = "..."
61050-218 = "Да. Вы правы. Все эти усилия были бы напрасны, если бы я не выполнила свою цель."
61050-219 = "Все, я хотела бы кое-что сказать. Не стану лгать и делать вид, будто сегодня я пришла сюда исключительно как частное лицо."
61050-220 = "Такова природа титула хозяйки Чаепития. Любое моё действие будут толковать, а в любых моих словах будут искать скрытый смысл."
61050-221 = "Ну..."
61050-222 = ""
61050-224 = ""
61050-225 = ""
61050-226 = "Я хотела бы официально и искренне извиниться перед каждой из вас."
61050-227 = ""
61050-229 = ""
61050-230 = "...А?!"
61050-231 = "Ч-Что вы...?!"
61050-232 = "..."
61050-233 = "Ранее вы сказали, что любое ваше действие будут толковать, а в любых словах — искать истинный смысл."
61050-234 = "Можно попросить вас объяснить подробнее, Нагиса?"
61050-236 = "Я и ожидала, что ты спросишь. Но всё именно так, как я сказала."
61050-237 = "Как хозяйка Чаепития и студент Тринити..."
61050-238 = "...и как та, кто сейчас представляет Тринити."
61050-239 = "Я приношу извинения всем вам и школе-сателлиту Ариус."
61050-240 = "Но почему? Разве не мы первыми выступили против Тринити?"
61050-241 = "Да. Я знаю, что отряд Ариус находился в самом центре того инцидента."
61050-242 = "Но я также знаю долгий и извилистый путь, который привёл нас к этому."
61050-243 = "Проблемы между Ариусом и Тринити начались не с нас."
61050-244 = "После Собора отношения Тринити и Ариуса... выродились в то, чем являются сейчас."
61050-245 = "Но сегодня, если взглянуть на наши отношения, в некоторых отношениях мы ближе друг к другу, чем любые другие школы Кивотоса."
61050-246 = "И однажды утром вы просто проснулись, и у вас вдруг проснулась совесть по этому поводу?"
61050-247 = "Мисаки."
61050-249 = "Всё в порядке. У тебя есть полное право так чувствовать."
61050-250 = "Тринити... никогда не следовало изгонять Ариус. Их единственной виной было отличие во взглядах."
61050-251 = "Думаю, лично я тоже виновата в том, что закрывала глаза на страдания окружающих."
61050-252 = "Я списывала это на политику и обстоятельства."
61050-253 = "Если я могу протянуть руку тем, кто всё ещё страдает, я хочу это сделать."
61050-255 = "...Не верю."
61050-256 = "С-Серьёзно?!"
61050-257 = "Я не хочу сидеть здесь и копаться в прошлом..."
61050-258 = "Но скажу прямо. Кирифуджи Нагиса, разве не вы были жертвой инцидента с Эдемским договором?"
61050-259 = "И вы вряд ли можете отрицать, что именно мы были виновницами того инцидента."
61050-260 = "Так почему вы, жертва, извиняетесь? Вы ведь понимаете, почему нам это кажется странным."
61050-261 = "Если поступки людей не имеют для тебя смысла, значит, они знают что-то, чего не знаешь ты."
61050-263 = "Хватит, Мисаки."
61050-264 = "..."
61050-265 = "Пожалуйста, всё в порядке. Я правда понимаю твои опасения."
61050-266 = "Я могу дать... два ответа. Один попроще, другой будет трудно принять."
61050-267 = "И какой же ответ попроще?"
61050-268 = "Ну..."
61050-269 = "Если бы одного моего извинения хватило, чтобы успокоить сохраняющееся беспокойство студентов Тринити по поводу Ариуса..."
61050-270 = "...с моей стороны это было бы весьма ловким политическим ходом."
61050-271 = "...Надо было с самого начала говорить честно."
61050-272 = "Ну-ну. Давай выслушаем её, Мисаки."
61050-273 = "А что насчёт более сложного ответа?"
61050-275 = "..."
61050-276 = "Позвольте рассказать историю о студенте, который возглавляет Чаепитие в Тринити."
61050-277 = "Пережив особенно тяжёлый инцидент под названием Эдемский договор, она долго размышляла о том, что пошло не так."
61050-278 = "В поисках ответов она начала изучать старые записи. Некоторые были настолько секретными, что даже ей, члену Чаепития, было трудно до них добраться. Но её не отпускала мучительная потребность понять всё, что произошло."
61050-279 = "Позже, глядя на кампус Тринити и на студентов, мирно живущих своей жизнью, она наконец поняла ответ."
61050-280 = "Чтобы обе школы могли двигаться вперёд, их отношения не могли оставаться прежними."
61050-281 = "То, что сделала Тринити, было неправильно."
61050-282 = "Так разве не Тринити должна первой протянуть руку примирения? Независимо от того, пожмут эту руку или отрубят?"
61050-283 = "...Напоминает одну чудовищно сильную розовую принцессу."
61050-284 = "Да. Возможно, именно та принцесса и помогла этому студенту наконец открыть глаза."
61050-286 = "..."
61050-287 = "..."
61050-288 = "Хи-хи."
61050-289 = ""
61050-291 = ""
61050-292 = "Тогда и я тоже."
61050-293 = ""
61050-295 = ""
61050-296 = "...!"
61050-297 = "Как представительница королевской крови..."
61050-298 = "И, пожалуй, та, кто ближе всех к роли президента школьного совета..."
61050-299 = "От имени школы-сателлита Ариус..."
61050-300 = "Я хотела бы извиниться за терроризм, который мы совершили против вас."
61050-301 = "Я ценю это. Правда."
61050-302 = "Но одних извинений, сказанных здесь, едва ли хватит, чтобы разрешить многолетний конфликт между нашими школами."
61050-303 = "Я бы хотела однажды получить возможность извиниться перед студентами, которые перевелись в Тринити..."
61050-304 = "...а также перед теми, кто остался в Ариусе."
61050-305 = "Однажды один учитель научил меня кое-чему."
61050-306 = "Извинения ничего не значат, если за ними не следует ответственность."
61050-307 = "А ответственность должна подтверждаться поступками."
61050-309 = "...С этим я согласна. Мне тоже есть за что извиняться."
61050-310 = "Но не будем больше тратить время на красивые слова."
61050-311 = "Зачем вы хотели встретиться с нами? Полагаю, у вас была другая цель, помимо того, чтобы просто склонить голову."
61050-312 = "Вы приложили слишком много усилий только ради возможности извиниться и сказать, что изменились."
61050-313 = "Да, хорошо сказано, Саори."
61050-314 = "Позвольте перейти к повестке нашей встречи."
61050-315 = "Итак, уверена, Сенсей уже говорил с вами об экзаменах."
61050-316 = "Вы имеете в виду...?"
61050-317 = "Да."
61050-318 = "Возможно, с моей стороны это самонадеянно."
61050-319 = "Но я разделяю мнение Сенсея."
61050-320 = "Я хочу, чтобы у всех из Ариуса..."
61050-321 = "...была возможность с достоинством жить в обществе. Если они сами этого захотят."
61050-322 = "Это очень доброжелательно. Спасибо, Нагиса."
61050-323 = "Я переживала... что вы сочтёте это снисходительностью или попыткой контролировать вас."
61050-324 = ""
61050-326 = ""
61050-327 = "Потому что за любым альтруистичным поступком..."
61050-328 = "...может скрываться подсознательное чувство собственного превосходства."
61050-329 = "Когда человек считает, что только он знает, как лучше, и решает, что остальные должны жить так, как считает правильным он..."
61050-330 = "Но у вас ведь никогда не было такого намерения, Нагиса?"
61050-331 = "Ацуко..."
61050-332 = "Думаю, сама способность осознавать возможные последствия своих поступков по-своему рождает доверие."
61050-333 = "Не так ли, Мисаки?"
61050-335 = "...Не могу сказать, что ты неправа."
61050-336 = "М-Мне вообще-то даже всё равно, если вы действительно так думаете..."
61050-337 = "Так что... лично для меня это нормально..."
61050-338 = ""
61050-341 = ""
61050-342 = "...Спасибо вам всем."
61050-343 = "Мы благодарны за всё ваше гостеприимство."
61050-344 = "Так что именно вы хотите, чтобы сделали отряд и Сенсей?"
61050-345 = "Я-Я ведь ещё даже не успела перейти к...! Как вы...?"
61050-346 = "Хм..."
61050-347 = "Это может прозвучать самонадеянно, но..."
61050-349 = "...это то, что называют «житейской хваткой»."
61050-351 = "Л-Лидер...!"
61050-352 = "Вообще-то, когда ты это сказала, выглядела довольно круто."
61050-353 = "Но это всё равно считается промахом, Сао-Сао."
61050-355 = "Я-Я так и думала..."
61050-357 = "Следующий Эпизод;Место по ту сторону"
