[translation]
10040080-1 = "Эпизод 8;Один год заканчивается, начинается новый"
10040080-3 = "...Здесь подойдёт."
10040080-4 = ""
10040080-6 = ""
10040080-7 = "Хотя уже почти полночь, всё ещё довольно светло, правда? Район всё ещё сияет огнями."
10040080-8 = "В обычный день полуночники Миллениум до поздней ночи занимаются исследованиями, поэтому город практически никогда не спит."
10040080-10 = "Но сегодня он ярче обычного. Последняя ночь года мерцает особенно сильно."
10040080-11 = "Разве не удивительно? Завтра начнётся ещё один год — вместе с новым днём, таким же, как любой другой."
10040080-12 = "Мы наделяем смыслом «первый» и «последний» дни года и с нетерпением ждём их наступления."
10040080-13 = "Вместо того чтобы отмечать день по какой-то особой причине, мы сами придумываем причины отметить выбранный нами день."
10040080-14 = "Даже сама идея что-то отмечать... лишь ещё один повод собраться вместе и отпраздновать."
10040080-15 = "Всё — причина для причины, которая стала причиной другой причины."
10040080-16 = "Если докопаться до сути всех этих причин, в их основе окажется очень простое объяснение."
10040080-17 = "...Желание веселиться вместе."
10040080-18 = "Проводить время вместе. Строить отношения. Создавать воспоминания."
10040080-19 = "Или стать частью..."
10040080-20 = ""
10040080-21 = ""
10040080-22 = "...чьих-то чужих воспоминаний."
10040080-23 = "Неужели нам настолько трудно быть честными с самими собой, что мы предпочитаем подыгрывать этим хлопотным выдумкам и выдавать их за «причины»?"
10040080-24 = "Кажется претенциозным красиво упаковывать эти желания и полностью игнорировать их настоящее содержание."
10040080-25 = "Хотя... я не в том положении, чтобы критиковать или осуждать других за это. Фуфу."
10040080-26 = "Достаточно взглянуть на сегодняшний день. Я сама виновна по всем пунктам."
10040080-27 = "[ns1] «Ноа, тебя такие вещи беспокоят?»\n[ns2] «Ты считаешь, что так поступать неправильно?»"
10040080-30 = "...Хм. У меня нет ответа."
10040080-31 = "Думаю, это важный механизм, который мы выработали ради межличностных отношений. Это ведь здравый смысл, разве нет?"
10040080-32 = "Но люди довольно хорошо умеют понимать истинные намерения за поступками других."
10040080-33 = "Мы часто понимаем настоящий смысл того, что человек хочет донести, даже если он не произносит это вслух. Так что, наверное, я не могу назвать всё это одной лишь показухой."
10040080-34 = "Хотя их способы общения разные, Коюки и Юука обе по-своему очень прозрачны."
10040080-35 = "И многие другие студенты Миллениум такие же."
10040080-36 = "Даже президент Рио. Она изо всех сил усложняет всё вокруг, но в конечном счёте её довольно легко понять."
10040080-37 = "...Что?"
10040080-38 = "...Что я думаю о самой себе?"
10040080-39 = "Фуфу. Я бы сказала, что это довольно прямолинейный вопрос, но, пожалуй, именно он и был настоящей темой нашего разговора."
10040080-40 = "Мой ответ на этот вопрос..."
10040080-41 = ""
10040080-43 = ""
10040080-44 = ""
10040080-45 = "Ох... ха-ха."
10040080-46 = "После такой красивой речи я всё равно так осторожно подбираю слова."
10040080-47 = "Полагаю, это уже само по себе ответ. Такова я, даже если не стремлюсь к этому. Поэтому людям и кажется, что меня трудно читать и узнавать ближе."
10040080-48 = "Это отвечает на ваш вопрос?"
10040080-49 = ""
10040080-51 = "[ns] «Хорошо.»"
10040080-53 = "[ns3] «И я понимаю, что в этом нет ничего плохого.»\n[ns4] «Например, в такие моменты. Когда мы вдвоём.»\n[ns5] «Всё относительно. Не так уж и отличается.»"
10040080-57 = "...Ага."
10040080-58 = "И правда... вполне логично. Я понимаю."
10040080-59 = "Фу-фу..."
10040080-60 = "К этому можно привыкнуть. Теперь я понимаю, почему все так и норовят провести с вами время, Сенсей."
10040080-61 = "Разговаривать с вами легко и естественно. Мне не приходится объяснять себя сверх меры или ходить вокруг да около."
10040080-62 = "Мне не нужно заставлять себя быть честной."
10040080-63 = ""
10040080-65 = ""
10040080-66 = "Так что вернёмся к теме."
10040080-67 = "Вы ведь понимаете, зачем я привела вас сюда в такой час."
10040080-68 = "И всё равно согласны быть здесь со мной? Вы уверены?"
10040080-69 = "Все спят. Мы вдвоём встречаем Новый год, любуясь ночным видом."
10040080-70 = "Я хотела остаться с вами наедине, завладеть всем вашим вниманием и взглядом."
10040080-71 = "Моё намерение сейчас действительно «не проблема»? Сенсей?"
10040080-72 = "...Мне правда можно так себя вести?"
10040080-73 = "Смотря как на это посмотреть..."
10040080-74 = "...у меня могут быть недобрые намерения."
10040080-75 = "[s6] «Ты понимаешь, что это противоречит всему, что ты только что сказала?»\n[s7] «...Ещё одна причина ради самой причины.»"
10040080-78 = "...Хи-хи."
10040080-79 = "Как я только что сказала, в конечном счёте такова я и есть. Человек, который говорит кругами. По-другому я просто не умею."
10040080-80 = "Наверное, поэтому я и ищу подтверждения. Хочу, чтобы вы сказали прямо то, чего не могу сказать я."
10040080-81 = "...Так можно?"
10040080-82 = ""
10040080-85 = "[ns] «Без проблем.»"
10040080-87 = "[ns8] «Это естественно для девушки твоего возраста.»\n[ns9] «Ты не сделала ничего плохого. Тебе не о чем переживать.»"
10040080-90 = "..."
10040080-91 = "..."
10040080-92 = "...Фух."
10040080-93 = "...Спасибо, Сенсей."
10040080-94 = ""
10040080-102 = "Именно эти слова я и надеялась услышать."
10040080-103 = ""
10040080-106 = "С Новым годом, Сенсей."
10040080-107 = "Пожалуйста, и дальше оставайтесь для всех нас хорошим учителем..."
10040080-108 = ""
10040080-111 = "...сегодня, завтра и ещё очень-очень долго."
10040080-120 = ""
10040080-121 = "...Ах."
10040080-122 = ""
10040080-124 = ""
10040080-125 = ""
10040080-126 = "Фуфу. И, пожалуйста, пусть этот разговор останется нашим маленьким секретом."
10040080-128 = "После этого мы с Ноа вернулись в Комнату самоанализа Коюки и прибрались там."
10040080-129 = "Когда мы закончили уборку и Ноа крепко уснула, я вернулся в Шале и тут же вырубился."
10040080-131 = "...На следующий день после полудня."
10040080-132 = "Сенсей!!"
10040080-133 = "[s10] «Дай мне поспать... ещё совсем чуть-чуть...» \n[s11] «Ещё пять минуточек... ма-а-ам...»"
10040080-136 = "Да что вы вообще говорите? Конечно нет! У нас ещё столько дел!"
10040080-137 = "Все специально пришли сюда помочь, так что постарайтесь ещё немного!"
10040080-138 = "Серьёзно! Она нас сюда вытащила, даже переодеться не дала!"
10040080-139 = "Когда я говорила, что помогу Сенсею чем смогу, я имела в виду немного не это."
10040080-141 = "..."
10040080-142 = "О? Это..."
10040080-143 = "...Котама. Стой."
10040080-144 = "...Хех."
10040080-146 = "Угх... тащиться сюда через весь город... только чтобы воровать пароли..."
10040080-147 = "Моя жизнь, моя свобода... куда вы делись...?"
10040080-148 = "...Фуфу. Вчера было так тихо, а сегодня здесь прямо оживлённо."
10040080-149 = "...Тихо...?"
10040080-150 = "Э-это ты называешь тихо? По-моему, вчера был полный кошмар."
10040080-151 = "Коюки!"
10040080-152 = "Кья-а-а! Жизнь так тяжела! Какая трагедия!"
10040080-153 = "Слушайте все! Пока Сенсей не закончит финансовый отчёт, никто не выйдет из этой комнаты!"
10040080-154 = "Если всё поняли, тогда за работу! Живо!"
10040080-155 = "Да, мэм...!"
10040080-156 = "И вы тоже, Сенсей! Вы должны стараться больше всех!"
10040080-157 = "[s12] «Да-а-а...» \n[s13] «Простите, все...»"
10040080-161 = ""
10040080-162 = ""
10040080-163 = ""
10040080-164 = "..."
10040080-165 = "...Хи-хи."
10040080-166 = ""
10040080-168 = ""
10040080-170 = "...Сегодня и правда первый день, ничем не отличающийся от любого другого."
10040080-171 = "Тайная полуночная вечеринка: Перезвон салок"
