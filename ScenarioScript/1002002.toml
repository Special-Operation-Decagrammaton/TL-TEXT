[translation]
1002002-1 = "О чём ты думаешь?"
1002002-2 = "(Кохару попросила помочь ей с учёбой...)"
1002002-3 = "(...но почему-то предложила встретиться в торговом центре, а не в библиотеке или классе.)"
1002002-4 = "В-Вот ты где, Сенсей."
1002002-5 = "Я ждала тебя. Хорошо, что ты пришёл вовремя."
1002002-6 = "Что это было?"
1002002-7 = "Зачем приходить учиться в торговый центр?"
1002002-8 = "Ну, потому что...!"
1002002-9 = "Что? Я пришла сюда только чтобы бездельничать...?"
1002002-10 = "Н-Нет. Конечно нет..."
1002002-11 = "Я знаю, что именно из-за отставания в учёбе вообще оказалась в Клубе дополнительных занятий."
1002002-12 = "Именно поэтому я и обратилась к тебе за помощью."
1002002-13 = "И это ведь твоя работа как моего сенсея, разве нет?"
1002002-14 = "А. Ты говоришь, что спрашивал не об этом?"
1002002-15 = "Ты всё ещё хочешь знать, почему именно это место..."
1002002-16 = "...а не какой-нибудь класс или библиотека."
1002002-17 = "Почему бы не пойти куда-нибудь потише?"
1002002-18 = "..."
1002002-19 = ""
1002002-20 = "Н-Ни за что! Нет! Никогда!"
1002002-21 = "Ты правда думаешь, что я стану делать что-то настолько непристойное?!"
1002002-22 = "[s1] «Что, прости?»\n[s2] «Почему непристойное...?»"
1002002-23 = "Я-я так и знала, что правильно сделала, позвав тебя в людное место вроде центра города!"
1002002-24 = "Я-я так и знала, что правильно сделала, позвав тебя в людное место вроде центра города!"
1002002-25 = "Я не такая, как остальные девушки! Я всё про это читала!"
1002002-26 = "В пустом классе... На парте... Даже на подоконнике!"
1002002-27 = "А уж библиотека тем более! Я знаю, что может происходить между этими книжными полками!"
1002002-28 = "Я всё про это читала и на такое не попадусь!"
1002002-29 = "[s3] «Я вообще ничего не понимаю.»\n[s4] Попросить показать книги, которые она читает."
1002002-30 = "..."
1002002-31 = "..."
1002002-32 = "Всё происходит слишком быстро..."
1002002-33 = "[s5] «Я что-то упускаю?»\n[s6] «Ты не можешь показать, что читала?»"
1002002-34 = "Э-Это не то, о чём ты думаешь."
1002002-35 = "Э-Это не то, о чём ты думаешь."
1002002-36 = "..."
1002002-37 = "Н-Неважно!"
1002002-38 = "Ты отвратительный! Извращенец!"
1002002-39 = ""
1002002-40 = "(...)"
1002002-41 = "(С этими словами Кохару убежала и скрылась, даже не оглянувшись.)"
1002002-42 = "[s] «...?»"
1002002-44 = "(Так я и не узнал, какие книги читает Кохару.)"
