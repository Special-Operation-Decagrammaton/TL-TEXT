[translation]
1301202-1 = "Расслабленный рэкет"
1301202-2 = "Деловой район Кивотоса 4"
1301202-3 = "Вот ты где, Сенсей."
1301202-4 = "Теперь, когда ты здесь, можем начинать патрулирование."
1301202-5 = "[s] «Что нам нужно патрулировать?»"
1301202-6 = "Хороший вопрос!"
1301202-7 = "Обязанность полиции — защищать граждан и предотвращать серьёзные преступления до того, как они произойдут."
1301202-8 = "Другими словами, мы будем наблюдать за округой и расследовать всё, что выглядит подозрительно!"
1301202-9 = "[s] «Но здесь всё выглядит спокойно...»"
1301202-10 = "Внешность обманчива! Никогда не знаешь, где пустят корни семена преступности."
1301202-11 = "Профессиональный детектив способен учуять дело даже в такие мирные времена."
1301202-12 = "*принюхивается* Так... Что-нибудь подозрительное, что-нибудь подозрительное..."
1301202-13 = ""
1301202-15 = ""
1301202-17 = "Хех. Я поняла. Но этого недостаточно!"
1301202-18 = "Теперь нам остаётся только..."
1301202-19 = ""
1301202-21 = ""
1301202-23 = ""
1301202-24 = "(Сенсей, видишь вон там?)"
1301202-25 = "(Этот человек выглядит ужасно подозрительно, правда?)"
1301202-26 = "(Так зловеще улыбается, а что это за подозрительная банка? Несёт её так, будто там самое драгоценное сокровище на свете.)"
1301202-27 = "[s1] «Может, потому что она хрупкая?»\n[s2] «Может, внутри что-то дорогое?»"
1301202-28 = "Нет. Для человека, который несёт что-то хрупкое, походка слишком подозрительная."
1301202-29 = "Нет. Для человека, который несёт что-то дорогое, походка слишком подозрительная."
1301202-30 = "Это может быть только..."
1301202-31 = "...бомба! Я уверена!"
1301202-32 = "[s] «Бомба?!»"
1301202-34 = "Конечно. В деловом районе Кивотоса находятся все важнейшие административные учреждения города."
1301202-35 = "Наверняка этого подозреваемого принудили стать злонамеренным террористом, который собирается взорвать бомбу и погрузить город в страх!"
1301202-36 = "Слава богу, я учуяла этот заговор до того, как всё переросло в крупномасштабный инцидент."
1301202-37 = "[s] «Будешь задерживать?»"
1301202-38 = "Ещё нет. В D.U. одно лишь владение бомбой не является преступлением."
1301202-39 = "Нужно тайно проследить за подозреваемым, пока он не заложит бомбу.#nТогда поймаем его с поличным и проведём арест!"
1301202-40 = "*ахнула* Он начинает действовать."
1301202-41 = "Скорее, Сенсей. Проследим за ним."
1301202-42 = ""
1301202-44 = ""
1301202-46 = ""
1301202-47 = "Хм. Странно."
1301202-48 = "Мы уже какое-то время преследуем подозреваемого, а он всё ещё не заложил бомбу."
1301202-49 = "Может, цель находится совсем в другом месте?"
1301202-50 = "[s] «А вдруг мы записали в подозреваемые невиновного?»"
1301202-51 = "Не может быть. Моё чутьё никогда не ошибается!"
1301202-52 = "Если подождём ещё немного..."
1301202-54 = ""
1301202-55 = ""
1301202-56 = ""
1301202-57 = ""
1301202-58 = ""
1301202-59 = ""
1301202-60 = "Ч-что?!"
1301202-61 = ""
1301202-62 = "Ха-ха. Я заберу эту дорогую на вид банку!"
1301202-63 = ""
1301202-64 = "В-Вор! Это вор!"
1301202-66 = "Другой преступник крадёт у нашего подозреваемого его бомбу!"
1301202-67 = "Плохо. Нужно срочно поймать вора, иначе..."
1301202-68 = "Эй, стой! Если не остановишься, я буду стрелять!"
1301202-69 = ""
1301202-71 = ""
1301202-73 = "Кирино погналась за вором."
1301202-74 = ""
1301202-82 = ""
1301202-83 = ""
1301202-84 = ""
1301202-85 = ""
1301202-86 = ""
1301202-87 = "Ух... Не могу поверить, что с такого расстояния я промахнулась каждым выстрелом."
1301202-88 = "Но хотя бы вор выронил банку во время побега. Бомба у нас!"
1301202-89 = "Теперь осталось только задержать первоначального подозреваемого и—"
1301202-90 = ""
1301202-91 = "А? Что это за запах?"
1301202-92 = "А! Вы её вернули! Слава богу!"
1301202-93 = "Я думал, что потерял домашнюю маринованную соевую пасту, которую мне прислали, прежде чем успел её попробовать."
1301202-94 = "М-Маринованная соевая паста?!"
1301202-95 = "Да, моя семья обычно присылает мне немного примерно в это время года."
1301202-96 = "В последнее время у меня почти нет аппетита. Это как раз то, что нужно!"
1301202-97 = "Не могу поверить. В банке всё-таки не было бомбы."
1301202-98 = "Что это вы говорите про бомбу...?"
1301202-99 = "Ну да ладно. Раз уж вы мне помогли, я поделюсь с вами маринованной соевой пастой. Уверен, вам понравится!"
1301202-100 = ""
1301202-101 = ""
1301202-102 = "С-Спасибо..."
1301202-104 = "Мы потратили столько сил, преследуя подозреваемого, который оказался вовсе не террористом. Немного удручает..."
1301202-105 = "В этот раз я слишком доверилась своему чутью и из-за этого слишком поспешно принимала решения."
1301202-106 = "[s3] «Зато ты остановила вора.»\n[s4] «Ты расстроена, что преступление оказалось несерьёзным?»"
1301202-107 = "Правда. Этого не хватит для перевода в Бюро безопасности, но хотя бы мы вернули имущество одному гражданину."
1301202-108 = "Н-Нет! Как студент Полицейской школы «Валькирия», я всегда должна прежде всего думать о безопасности граждан!"
1301202-109 = "Буду считать эту подаренную маринованную соевую пасту почётным знаком."
1301202-110 = "Но... её слишком много, чтобы съесть одной."
1301202-111 = "Придумала! После патрулирования добавлю немного к ужину!"
1301202-113 = "Мы с Кирино ещё немного патрулировали район, затем вернулись в Шале и вместе попробовали маринованную соевую пасту."
1301202-114 = "Без риса этот почётный знак оказался немного солоноватым."
