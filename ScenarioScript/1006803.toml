[translation]
1006803-1 = "Попробуй довериться, Рейса"
1006803-2 = "Гостиная Шале"
1006803-3 = "В один из спокойных рабочих дней я пригласил Рейсу в гостиную Шале."
1006803-4 = ""
1006803-7 = "[ns1] «Добро пожаловать, Рейса.»\n[ns2] «Дверь открыта.»"
1006803-13 = "З-Здравствуйте... Сенсей!"
1006803-14 = "Сегодня моё тело ощущается... эм, немного тяжелее обычного..."
1006803-15 = "[s3] «Рейса? Ты в порядке?»\n[s4] «Ты выглядишь измученной! Что случилось?»"
1006803-18 = "Всё нормально... ничего особенного не случилось, просто... Хе-хе... хи-хи... Хи-хи-хи-хи-хи..."
1006803-19 = "Эм... простите. Я пришла сюда не для этого... Надо просто... взять себя в руки."
1006803-20 = "А! Кхм!"
1006803-21 = ""
1006803-23 = ""
1006803-24 = "Хорошо! Так уже немного лучше."
1006803-25 = "В общем... я хотела попросить у вас совета, Сенсей! Хотела узнать, нет ли у вас каких-нибудь способов справиться с усталостью!"
1006803-26 = "Просто... ну, знаете, вечером я патрулирую, утром хожу на занятия, а после школы гуляю с друзьями..."
1006803-27 = "И... я начинаю понимать, что, наверное, мне не хватает времени на сон..."
1006803-28 = "Знаете, сначала я даже не замечала, потому что всё накапливалось понемногу... Но последние четыре дня были особенно загруженными, и я почти совсем не спала..."
1006803-29 = "..."
1006803-30 = "Раньше всё было нормально... потому что я просто дремала на переменах в школе. Но... ха-ха."
1006803-31 = "[s5] «Так вот почему ты хочешь узнать, как справляться с усталостью...»\n[s6] «Тебе просто не хватает времени на сон...»"
1006803-34 = "А-Ахаха..."
1006803-35 = "Д-Да! Я подумала: если кто и знает, то это вы, Сенсей."
1006803-36 = "Ну? Как это сделать? Есть какой-нибудь эффективный график короткого сна? Или рецепт энергетика?"
1006803-37 = "...Что?"
1006803-38 = "Но... у вас правда нет никакого особого метода? Мне просто нужно больше спать?"
1006803-39 = "Н-Ну, наверное, именно это все и говорят... Просто я думала, что вы знаете способ получше..."
1006803-40 = "В смысле... Раньше было проще, но теперь... Кроме Патрульной команды и школы, у меня всё равно остаётся ещё куча дел..."
1006803-41 = "И, ну... я не хочу отказываться от времени, которое провожу с друзьями..."
1006803-42 = "И если..."
1006803-43 = "Эм... Я боюсь, что если снова перестану проводить с ними время, они..."
1006803-44 = "Они, может быть..."
1006803-45 = "[ns] «...»"
1006803-47 = "[ns7] «Ты снова возвращаешься к старым привычкам, Рейса.»\n[ns8] «Нельзя одной силой воли заставить себя успевать вообще всё.»"
1006803-50 = "Что? Что вы имеете в виду?"
1006803-51 = "...Эм... не знаю... Не думаю, что в последнее время мне говорили что-нибудь особенно важное..."
1006803-52 = "...О."
1006803-53 = "Вообще-то, если подумать, друзья и правда говорили, что я выгляжу уставшей... Спрашивали, всё ли со мной в порядке, и предлагали вместо этого посидеть дома или встретиться на выходных..."
1006803-54 = "И Патрульная команда тоже... Сузуми сказала, что возьмёт мои патрули на себя, если понадобится."
1006803-55 = "Но... я, конечно же, отказалась. Ха-ха."
1006803-56 = "[s9] «Они все переживают за тебя, Рейса.»\n[s10] «Они не хотят, чтобы ты довела себя до изнеможения.»"
1006803-59 = "П-Правда? Эм... О. Я слишком себя загоняю?"
1006803-60 = "Ха-ха... Ну, теперь, когда я об этом думаю, наверное, определённо да... Странно."
1006803-61 = ""
1006803-63 = ""
1006803-64 = "Но всё-таки. Правда всё будет нормально?"
1006803-65 = "А вдруг друзья подумают, что я не хочу с ними гулять? А вдруг Патрульная команда решит, что я отлыниваю?"
1006803-66 = "Ха-ха... Не то чтобы ваш совет был нелогичным, но... Почему вы всегда просите меня делать такие страшные вещи?"
1006803-67 = "А если... А если это всё разрушит..."
1006803-68 = ""
1006803-70 = ""
1006803-71 = "...Но..."
1006803-72 = "Нет. Это неправильно. Ведь всё, о чём вы просили меня раньше, в итоге получалось хорошо."
1006803-73 = "Значит... и в этот раз должно быть так же! Да, точно."
1006803-74 = "[s11] «Ага. Попробуй немного больше доверять окружающим.»\n[s12] «Они заботятся о тебе не меньше, чем ты о них.»"
1006803-77 = "...!"
1006803-78 = "Хорошо!"
1006803-79 = "Эм... А... Ух ты..."
1006803-80 = ""
1006803-82 = ""
1006803-83 = ""
1006803-85 = "[ns13] «Рейса?!»\n[ns14] «Ты выглядишь так, будто сейчас упадёшь!»"
1006803-88 = "У-у... Просто... как будто всё напряжение разом вышло из тела..."
1006803-89 = "И мне стало очень... сон... сонно..."
1006803-90 = ""
1006803-92 = ""
1006803-95 = "Ага... Ахахаха... Конечно, это тоже звучит весело... Давайте... Хи-хи..."
1006803-96 = "[ns] «...»"
1006803-98 = "[ns] Выключить свет."
1006803-102 = "Я тихо вышел, стараясь не разбудить Рейсу."
