[translation]
11434010-1 = "Обычная концовка;«Оглядываясь назад»"
11434010-2 = "...Вот примерно так всё и было."
11434010-3 = "Ну что, результаты уже вывесили? Кажется, уже должны были..."
11434010-4 = "Хм. Погоди, сейчас проверю. Загружается..."
11434010-5 = "Эм..."
11434010-6 = "Эй, нельзя просто сказать «Эм...» и на этом закончить! Это незаконно! Ты что, не слышала о запрете на «эм»?!"
11434010-7 = "А-ха-ха-ха..."
11434010-8 = ""
11434010-11 = "...А?"
11434010-13 = "*ахает*"
11434010-14 = "Все, смотрите! Наши имена есть в списке!"
11434010-15 = "Что?! Правда?! Значит, получилось? Мы прошли, да?!"
11434010-16 = "Ого, мы правда прошли. Я не была уверена, что..."
11434010-17 = "Если бы мы в конце провалились, это было бы плохим повествованием."
11434010-18 = "И опять ты за своё."
11434010-20 = "В любом случае: все на ноги. Сейчас не время бездельничать."
11434010-21 = "Нацу? Куда ты вдруг собралась...?"
11434010-22 = "Куда? Разве не очевидно?"
11434010-23 = ""
11434010-25 = ""
11434010-26 = ""
11434010-27 = "...Ага. Больше никакой скрытности — можем войти туда так, будто это наше место."
11434010-28 = "А, да."
11434010-30 = "А-А...? Войти куда...? Эй, вы куда?"
11434010-31 = ""
11434010-33 = ""
11434010-34 = ""
11434010-36 = "За семлу!!"
