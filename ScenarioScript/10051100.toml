10051100-186 = "Я знаю эту бомбу! Она настолько мощная, что её запретили в большинстве супермаркетов и магазинов у дома!"
10051100-187 = "Но кого это сейчас волнует?! Цукуё! Ты в порядке?!"
10051100-188 = "Да, всё хорошо."
10051100-189 = "Правда, платье немного порвалось. Вы правы."
10051100-190 = "Хи-хи, я немного растрёпанно выгляжу, да?"
10051100-191 = "Н-Не в этом дело! Что будет с моделью, если она порвёт платье?"
10051100-192 = "Оно же... супердорогое, разве нет?"
