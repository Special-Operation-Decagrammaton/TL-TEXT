10051100-228 = "П-президент?!"
10051100-229 = "Почему вы плачете?!"
10051100-230 = "Я... Я думала, ты с нами покончила, Цукуё."
10051100-231 = "Потому что, в отличие от меня, у тебя есть талант! Тебя любят люди."
10051100-232 = "Я думала, что только тяну тебя назад, просто будучи..."
10051100-233 = ""
10051100-234 = "Я не хотела, чтобы ты растрачивала свои таланты на кого-то вроде... меня."
10051100-235 = "Я решила, что будет лучше, если ты не вернёшься. Я болела за тебя. А когда увидела, как ты сияешь на сцене... я так гордилась."
10051100-236 = "...Но."
10051100-237 = ""
10051100-238 = ""
10051100-239 = "Но даже думая так, я всё равно хотела удержать тебя! Хотела, чтобы ты осталась!"
10051100-240 = "Потому что всё, что мы делали вместе в Клубе исследования ниндзюцу, было действительно весело!"
10051100-241 = "Так что... да..."
