10051100-206 = "Нет, я не это имела в виду..."
10051100-207 = "Но это правда. Я всё ещё я."
10051100-208 = "Я Оно Цукуё. Большая, робкая и высокий студент, которому нравится ниндзюцу. Это я. И я всегда такой останусь."
10051100-209 = "...А как же модельная работа?"
10051100-210 = "Если честно, я не уверена."
10051100-211 = "Люди хвалят меня как модель. Некоторые даже говорят, что я лучшая."
10051100-212 = "Но слышать это, чувствовать давление и постоянно работать и жертвовать чем-то..."
10051100-213 = "...Это истощало. Будто я заперта в одежде не своего размера."
10051100-214 = "Одежда не своего размера..."
10051100-215 = "Вы сами видели, Президент. Если заставлять себя носить одежду, которая тебе не подходит..."
10051100-216 = "...рано или поздно она порвётся."
10051100-217 = "Цукуё..."
10051100-218 = "Президент, я хочу вернуться."
10051100-219 = ""
10051100-221 = ""
10051100-222 = "...В Клуб исследования ниндзюцу. К своим друзьям."
