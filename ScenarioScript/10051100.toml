[translation]
10051100-1 = "Эпизод 10;Конец показа"
10051100-4 = "Гримёрная модного показа"
10051100-5 = "Сейчас тебе предстоит самый длинный и важный выход в твоей пока ещё короткой карьере."
10051100-6 = "Готовы?"
10051100-7 = "..."
10051100-8 = "Не нервничай, но и не теряй остроты."
10051100-9 = "Сегодня твой большой дебют. Ты запомнишь его навсегда. Мы все запомним."
10051100-10 = "Большой дебют?"
10051100-11 = "Предыдущие показы? Мелочь. Поэтому твою неуклюжую походку ещё можно было простить."
10051100-12 = "Конечно, эта «особенность» сделала тебя популярной... но лишь потому, что твоя неопытность казалась милой."
10051100-13 = "Сегодняшний показ посвящён Новому году. Его увидит аудитория в несколько раз больше всего, что ты видела раньше."
10051100-14 = "Раньше ты была звездой. После этого станешь сверхновой."
10051100-15 = ""
10051100-17 = ""
10051100-18 = ""
10051100-19 = "Сегодня... ты наконец станешь профессиональной моделью. А со временем — супермоделью."
10051100-20 = "Профессиональная модель..."
10051100-21 = "Правда...? Я...?"
10051100-22 = "Да. Растрогана? Переполняют эмоции?"
10051100-23 = "..."
10051100-24 = "Или у тебя всё ещё есть сожаления? Всё ещё хочешь вернуться?"
10051100-25 = "Я-я..."
10051100-26 = "Эм..."
10051100-27 = "Если да, подумай, какой путь уже прошла. Сколько труда."
10051100-28 = "Жёсткая диета и упражнения, все тренировки..."
10051100-30 = "Не растрачивай свой талант. Поняла?"
10051100-31 = "П-Поняли..."
10051100-32 = ""
10051100-35 = "Время вышло. Мы готовы."
10051100-36 = "Отлично. Покажи им, какая ты звезда."
10051100-37 = "...Да."
10051100-38 = ""
10051100-40 = ""
10051100-41 = ""
10051100-43 = ""
10051100-44 = "Здесь толпа намного больше, чем раньше, Президент!"
10051100-45 = "Ага... Она... реально огромная."
10051100-46 = "...Цукуё скоро выйдет, да?"
10051100-47 = "Да, президент."
10051100-48 = "...А когда мероприятие закончится, вы даже сможете с ней поговорить."
10051100-49 = "...Потому что модели и охрана выходят через один и тот же коридор."
10051100-50 = "Цукуё..."
10051100-51 = "Кстати, Изуна."
10051100-52 = "Да, президент?"
10051100-53 = ""
10051100-55 = ""
10051100-56 = "Мне... правда обязательно говорить с Цукуё?"
10051100-57 = "Что?!"
