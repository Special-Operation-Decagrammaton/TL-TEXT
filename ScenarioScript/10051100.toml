10051100-259 = "Кстати, этот человек... Она ведь кажется знакомой...?"
10051100-260 = ""
10051100-262 = ""
10051100-263 = "Акх!"
10051100-264 = "Это модель с того модного показа! Та, что вмешалась в драку и получила гранатой."
10051100-265 = "Изуна тоже помнит! Её увезли на скорой, поэтому Цукуё взяли моделью на замену..."
10051100-266 = "П-Почему она здесь...?"
10051100-267 = ""
10051100-269 = ""
10051100-271 = "Ой... Голова... Опять..."
10051100-272 = ""
10051100-274 = ""
10051100-275 = "П-Подождите, где моя бомба?! Она мне нужна..."
10051100-276 = "Мы забрали бомбу."
10051100-277 = "Зачем ты вообще сделала такое?"
10051100-278 = "Зачем? Рада, что спросила, «звёздочка»."
10051100-280 = "Это всё из-за тебя!"
10051100-281 = "Что?!"
10051100-282 = "Ты забрала моё место, мою цель, моё платье!"
10051100-283 = "Это должны были быть мои прожекторы, мои пышные рукава, мои статьи в журналах, мои комплименты!"
10051100-284 = "Всё это должно было быть моим!"
10051100-285 = "О чём ты вообще? Цукуё даже не хотела тебя заменять! Её заставили."
10051100-286 = "З-Заткнись...!"
10051100-287 = "В любом случае... Я так просто не сдамся. Думаешь, мне нужна БОМБА, чтобы испортить твой большой дебют, дорогуша?"
10051100-288 = "Всё кончено, жердь! Я всё разрушу! Разрушу этот модный показ! Ты больше никогда не получишь работу!"
10051100-289 = "По-моему, ты уже достаточно всего испортила."
10051100-290 = "Заткнись! Моурё! В АТАКУ!"
