[translation]
90000105-2 = "Он отступил. Наш план провалился?.."
90000105-3 = "Не думаю. Возможно, ему удалось ускользнуть... но он точно получил серьёзные повреждения."
90000105-4 = "Это не те двенадцать часов, на которые мы рассчитывали, но на восстановление ему всё равно понадобится время."
90000105-5 = "Значит, мы всё ещё можем отправляться в Район Исследований?"
90000105-6 = "Да, пока Кетер не вернётся. По моим расчётам, у нас около восьми часов. За это время нужно найти место в Районе Исследований, где был обнаружен сигнал Декаграмматона."
90000105-7 = "Подтверждаю. Похоже, нас ждёт бессонная ночь."
90000105-8 = "Нам не привыкать."
90000105-9 = "Хорошо, заходим в Район Исследований."
90000105-12 = "Район Исследований"
90000105-13 = ""
90000105-16 = "Президент, мы добрались до Района Исследований."
90000105-17 = ""
90000105-19 = ""
90000105-20 = ""
90000105-21 = "Вокруг ничего враждебного. Всё выглядит так же, как и в остальных руинах."
90000105-22 = "И правда. Здесь намного тише, чем я ожидала."
90000105-23 = "Странно другое: судя по топографическому анализу, этот район должен быть полностью затоплен."
90000105-24 = "Правда? Но здесь нет ни капли воды."
90000105-25 = "Именно... Наличие здесь сухой земли означает, что кто-то проделал колоссальную работу по откачке воды."
90000105-26 = "...Так и думала. Примерно в десяти километрах отсюда построена огромная плотина."
90000105-27 = "Дело рук Декаграмматона?"
90000105-28 = "Или его пророка."
90000105-29 = "Думаю, Вы правы. Водоросли на зданиях доходят почти до середины стен. Скорее всего, совсем недавно весь этот район был под водой."
90000105-30 = "Эйми, полагаю, мне нужно увидеть это место собственными глазами. Немедленно возвращайся."
90000105-31 = "Вы хотите приехать сюда лично, Президент?"
90000105-32 = "Да. А пока я закончу подготовку к исследованию."
90000105-33 = ""
90000105-35 = ""
90000105-37 = "...Вы её слышали. Возвращаемся."
90000105-38 = "До возвращения Кетера время ещё есть. Думаю, всё будет в порядке."
90000105-40 = "Следующий эпизод;Декаграмматон"
