[translation]
10055165-2 = "Эй! А ну вставай!"
10055165-3 = "Мой речной рак не может проиграть так легко!"
10055165-4 = "Не дави на всех так сильно. Не у каждого бесконечный запас сил, как у тебя."
10055165-5 = "...Ладно, рачок, тебе нужен перерыв. Отдохни пять минут."
10055165-6 = "Ой, м-мы что, только что...?"
10055165-7 = "Да, вы выиграли. Поздравляю, победа ваша."
10055165-8 = "Ура! Мы справились, Чёрная Долли!"
10055165-10 = "Ки-хе-хе! Значит, одна звезда достаётся нам, офицеры."
10055165-11 = "Вот."
10055165-12 = "...Но позвольте дать вам один совет."
10055165-13 = "Ты же проиграла!"
10055165-15 = "Да выслушай её уже."
10055165-16 = "Чем больше побед одержите, тем больше станете мишенью."
10055165-17 = "Следующие соперники придут к вам во всеоружии."
10055165-18 = "Хмф. Это ты нам угрожаешь?"
10055165-19 = "Для нас это означает лишь ещё больше славы!"
10055165-20 = "Пусть собирают сильнейших и наступают со всех сторон! Мы подчиним их всех и докажем своё превосходство раз и навсегда!"
