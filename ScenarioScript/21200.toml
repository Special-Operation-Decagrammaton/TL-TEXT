[translation]
21200-1 = "Эпизод 20;Премия Миллениума"
21200-2 = "Департамент Разработки Игр Милленниума"
21200-3 = "Алиса! Алиса! Смотри!"
21200-4 = "Та-дам! Костюм горничной!"
21200-5 = "Ик!"
21200-6 = "*убегает*"
21200-7 = "Хи-хи! Как весело!"
21200-8 = "Что с тобой не так? Не видишь, что Алиса до смерти напугана?!"
21200-9 = "Ты в порядке, Алиса?"
21200-11 = "Эм... Пожалуйста, отныне держите всё и всех в форме горничной подальше от меня..."
21200-12 = "Похоже, ей уже лучше."
21200-13 = "Я ходила в Студсовет обсудить разрушенное нами здание."
21200-14 = "К счастью, они признали это результатом \"санкционированного клубного несчастного случая\"."
21200-15 = "Вау! Серьёзно?! Я думала, нас исключат или вроде того."
21200-16 = "Думаю, C&C всё уладили за нас."
21200-17 = "И Неру сказала мне:"
21200-18 = "\"Увидимся\"."
21200-19 = "Ик!"
21200-20 = ""
21200-22 = "Алиса! Вылезай из шкафа! Чему ты её учила, Юзу?"
21200-23 = "Ну, новости хорошие и всё такое, но..."
21200-24 = "Точно..."
21200-25 = ""
21200-26 = "Церемония объявления результатов Премии Миллениума началась."
21200-28 = "Вы знаете, что делать, да? Если берём золото — гуляем до упаду. Но если проиграем..."
21200-29 = "Нам придётся собирать вещи."
21200-30 = "Мы с Момои справимся, но Юзу и Алиса..."
21200-31 = "..."
21200-32 = "..."
21200-34 = "Церемония награждения Премии Миллениума"
21200-35 = "Здравствуйте и добро пожаловать на церемонию награждения Премии Миллениума! Меня зовут Котори, и сегодня я буду вашей ведущей!"
21200-36 = "Говорят, в этом году участников больше, чем когда-либо!"
21200-37 = "Наверное, потому что Студсовет обязал каждый клуб что-нибудь подать или тип того!"
21200-39 = "Департамент Разработки Игр Милленниума"
21200-40 = "Похоже, у Котори всё сложилось удачно."
21200-41 = "Ну, Инженерный Департамент — один из самых ценных клубов Миллениума."
21200-42 = "Но больше участников значит и больше конкуренции, да...?"
21200-43 = "Это плохо..."
21200-44 = ""
21200-45 = "В прошлом году победила \"Мера памяти\" Ноа. Для поэзии вещь необычная, но её хвалили как безотказное средство от бессонницы из-за обилия длинных метафизических терминов."
21200-46 = "В этом году у нас есть тюбики, похожие на зубную пасту, но на самом деле с сыром, большой зонт с ракетами для самообороны..."
21200-47 = "Галстук-пауэрбанк, нижнее бельё с оптическим камуфляжем, переносной холодильник размером с пенал — идеально ровно для одной банки..."
21200-48 = "И наконец ретро-игра для мобильных устройств, ставшая вирусной в сети Кивотоса: Tales Saga Chronicle 2!"
21200-49 = "Из сотен заявок только семь доберутся до вершины!"
21200-50 = "*глоть*"
21200-51 = "Итак, начинаем с седьмого места!"
21200-52 = "На седьмом месте — комплект камуфляжного белья от Утахи из Инженерного Департамента! Не уверена, что здесь функция важнее формы..."
21200-53 = "...но высокие оценки оно получило за то, что позволяет эксгибиционистам спокойно заниматься своим хобби. Хотелось бы узнать, кто эти рецензенты! Ну да ладно, дальше будет только лучше!"
21200-54 = "Ну..."
21200-55 = "Ничего. Нашей игре седьмое место всё равно не подходит."
21200-56 = "Переходим к шестому месту! Это...!"
21200-57 = "..."
21200-58 = "На пятом месте...!"
21200-59 = "Наше имя так и не назвали..."
21200-60 = "Дальше четвёртое место...!"
21200-61 = "Наше имя уже должны были назвать..."
21200-62 = "Пора определить тройку лучших! Третье место занимает..."
21200-63 = "Я больше не могу смотреть!"
21200-64 = "Пожалуйста... Пожалуйста..."
21200-65 = "За второе место шла очень плотная борьба, но в итоге оно достаётся..."
21200-66 = "..."
21200-67 = "Пожалуйста, пусть это будем мы... Пожалуйста..."
21200-68 = "Н-Не может быть... Нас... не назвали?"
21200-69 = "Это значит..."
21200-70 = "*ахает*"
21200-71 = "И наконец, но уж точно не в последнюю очередь — победитель. Участники, которые забирают Премию Миллениума!"
21200-72 = "Я этого не выдержу."
21200-73 = "И первое место получает..."
21200-74 = "Кажется, я сейчас сойду с ума."
21200-75 = ""
21200-76 = ""
21200-77 = ""
21200-78 = "...узнаете после рекламной паузы!"
21200-79 = ""
21200-80 = "А-Алиса!"
21200-81 = "Лазер полностью заряжен."
21200-82 = "Только не стреляй по церемонии награждения!"
21200-83 = "А-а-а! Это ожидание сводит с ума!"
21200-85 = "И мы снова с вами!"
21200-86 = "Первое место получает... Клуб Разработки Новых Материалов!"
21200-87 = "*бах-бах-бах*"
21200-88 = "А-а! Зачем ты расстреляла телик?!"
21200-89 = "Какая разница? Мы всё равно всё потеряем!"
21200-90 = "А-а-а-а! Всё кончено!"
21200-92 = "*вздыхает*"
21200-93 = "Вот и всё?"
21200-94 = ""
21200-96 = "Всё нормально, Юзу. Мы всё ещё можем..."
21200-97 = "Придумала! Нечего так унывать!"
21200-98 = "Отзывы были не такими уж плохими. Мы далеко ушли от легендарных неудачниц с наградой \"Худшая игра года\"."
21200-99 = "Мы просто будем становиться лучше."
21200-100 = "Даже если нас выпнут, соберём больше участников и сделаем что-нибудь ещё лучше! Когда клуб снова откроется, у нас будет ещё больше и лучше клубная комната!"
21200-101 = "Но... что будет с Юзу и Алисой?"
21200-102 = "Всё нормально, Мидори."
21200-103 = "Я вернусь в общежитие."
21200-105 = "А?"
21200-106 = "Не думаю, что теперь нас будут называть неудачницами. А даже если будут — меня это уже не волнует."
21200-107 = "Потому что у меня есть вы... и Сенсей."
21200-108 = "Я хочу поблагодарить вас, Сенсей."
21200-109 = "С тех пор как вы пришли в эту клубную комнату, мы все выросли и изменились."
21200-110 = "Но что до Алисы..."
21200-111 = ""
21200-112 = ""
21200-113 = ""
21200-114 = "[ns1] «Оставьте это мне.»\n[ns2] «Пойдём со мной в Шале, Алиса.»"
21200-115 = "Алис..."
21200-116 = "Алис..."
21200-117 = "..."
21200-118 = "П-Прости."
21200-119 = "Всё нормально."
21200-120 = "Я знаю, что могу доверять Сенсею."
21200-121 = "Однако."
21200-122 = "Это значит..."
21200-123 = ""
21200-124 = "...я больше не смогу оставаться с вами."
21200-125 = "...?!"
21200-126 = "Мне так жаль, Алиса!"
21200-127 = "Я буду навещать тебя в Шале каждый день! Серьёзно! Каждый день!"
21200-128 = "Нас всегда будет связывать игра, которую мы сделали вместе."
21200-130 = "*шмыгает носом*"
21200-131 = "Нет!"
21200-132 = "Нельзя забирать её, Сенсей!"
21200-133 = "О-Она может жить у меня! Будем делить кровать! Я буду делиться с ней едой!"
21200-134 = "Я тоже могу делиться!"
21200-135 = "Девочки, пожалуйста, не давите на Сенсея. Если кто-нибудь узнает..."
21200-136 = ""
21200-137 = "*бахает по столу*"
21200-138 = "Момои! Алиса! Мидори! Юзу!"
21200-139 = "А-а! Юука уже здесь?!"
21200-140 = "Ты даже минуту не могла подождать, прежде чем нас выселять?!"
21200-141 = "Это слишком жестоко! Как Студсовет может быть таким бессердеч—"
21200-143 = "Поздравляю!"
21200-144 = "Чт..?"
21200-145 = "...О чём ты?"
21200-146 = "Какого... чёрта?"
21200-147 = ""
21200-149 = "Хм?"
21200-150 = "Что с вами такое?"
21200-151 = "Вы что, результаты не видели?"
21200-152 = "Видели...?"
21200-153 = "Мы даже в семёрку не попали..."
21200-154 = "А?!"
21200-155 = "О чём вы вообще? Включите телевизор."
21200-156 = "В нём, эм, дырки от пуль."
21200-157 = "Господи. Ладно, смотрите с моего телефона."
21200-159 = "Церемония награждения Премии Миллениума"
21200-160 = "Премия Миллениума всегда предназначалась для награждения студентов за создание чего-то практичного."
21200-161 = "Однако практичность не способна полностью выразить эмоции, которые может вызвать интерактивный опыт."
21200-162 = "Поэтому впервые в истории Премии мы присуждаем особую высшую награду."
21200-163 = "Специальную награду получает Tales Saga Chronicle 2 от Департамента Разработки Игр!"
21200-164 = "С-Серьёзно?!"
21200-165 = "Что... происходит...?"
21200-166 = "Нас очаровала концепция, вышедшая за рамки ретро, история, не связанная формальностями, и странный мир, который прекрасно дополнял и то, и другое."
21200-167 = "Путешествие по странному неизвестному миру, встречи с новыми людьми и победа над Владыкой демонов."
21200-168 = "Мы считаем, что эта работа по-настоящему передаёт самую суть жанра RPG."
21200-169 = "Это игра, которая напоминает, почему мы вообще полюбили видеоигры..."
21200-170 = ""
21200-171 = "Именно поэтому мы сочли достойным присудить ей специальную награду Премии Миллениума."
21200-174 = "Департамент Разработки Игр Милленниума"
21200-175 = "О-ого..."
21200-176 = "Ещё раз поздравляю! Я тоже попробовала. Не самая захватывающая игра в моей жизни, но опыт был свежий! Мне понравилось!"
21200-178 = "Момо! Мидо! Я сыграла в TSC2! Было так весело! Она стала дико популярной!"
21200-179 = "Веритас говорят, её ищут чаще, чем любую знаменитость Кивотоса!"
21200-180 = "Я... не могу поверить..."
21200-181 = ""
21200-183 = "Понятно."
21200-184 = "Tales Saga Chronicle 2 скачали 7 705 раз и оставили 1 372 комментария всего за первые три часа после публикации."
21200-185 = "А за 26 секунд после объявления на Премии Миллениума число скачиваний перевалило за 10 000!"
21200-186 = "*ахает*"
21200-187 = "Из 500 новых комментариев 242 негативных, 192 выражают восторг, а оставшиеся 66 не определились."
21200-188 = "Р-Разве это не значит, что им не нравится?!"
21200-189 = "Не совсем."
21200-190 = "А? В смысле, Юзу?"
21200-191 = "..."
21200-192 = "..."
21200-193 = "Посмотри на ветку комментариев с самым большим числом лайков..."
21200-194 = ""
21200-195 = "chicken: Я долго думала и в итоге... рада, что смогла сыграть в эту игру."
21200-196 = "Kotoha0507: Честно говоря, раньше я была предвзята к Миллениуму."
21200-197 = "Kotoha0507: Но после Tales Saga Chronicle 2 я больше не могу прикрываться мыслью, что все студенты Миллениума холодные и расчётливые."
21200-198 = "...!"
21200-199 = "Но, подождите! Нам оставят клубную комнату?!"
21200-200 = ""
21200-202 = "Ну, как и раньше, конфискация откладывается. Поскольку ваша награда не была официальной, Студсовет решил дать вам ещё год, чтобы заново оценить, заслуживаете ли вы клубную комнату."
21200-203 = "И ещё..."
21200-204 = "*ёрзает*"
21200-205 = "А?"
21200-206 = "Я, эм... Простите, что назвала ваши консоли хламом."
21200-207 = "Когда я играла, то вспомнила, как любила игры в детстве... Будто пережила всё это впервые."
21200-208 = "Поздравляю. Приходите в Студсовет подать заявку на продление клубной комнаты или финансирование. Увидимся."
21200-211 = "Это значит...!"
21200-212 = "*ахает*"
21200-213 = "Мы..."
21200-214 = "МЫ СДЕЛАЛИ ЭТО!"
21200-215 = "А-а-а-а!"
21200-216 = "Слава богу... Мы правда сделали это."
21200-218 = "...?"
21200-219 = "Э-э-э...?"
21200-220 = "Мы справились, Алис! Мы получим бюджет и сохраним клубную комнату!"
21200-221 = "То есть..."
21200-222 = "...мы сможем остаться вместе?"
21200-224 = ""
21200-225 = "Конечно!"
21200-226 = ""
21200-228 = "Давайте и дальше делать игры вместе!"
21200-229 = "..."
21200-230 = "Я... Я так счастлива!"
21200-231 = "Алиса!"
21200-232 = "Мы правда справились!"
21200-233 = "Мечта продолжается!"
21200-234 = "Ага!"
21200-235 = ""
21200-237 = ""
21200-238 = "Идеальный результат!"
21200-243 = "..."
21200-244 = "Восстановление данных: 98,00%."
21200-245 = "Запуск системы."
21200-246 = "Система готова."
21200-247 = "Настройка программы."
21200-250 = "Divi:Sion..."
21200-251 = "..."
21200-253 = "[9b1e1e]AL-1S...[wa:3300] Или точнее..."
21200-255 = "[9b1e1e]Алиса.[wa:3000] Моя..."
21200-257 = "[9b1e1e]...дра[wa:500]го[wa:500]цен[wa:500]ная...[wa:1000]!@#$%$^&*(!@$!"
