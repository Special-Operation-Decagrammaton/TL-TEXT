[translation]
21200-1 = "Episódio 20;Millennium Prize"
21200-2 = "Millennium - Clube de Desenvolvimento de Jogos"
21200-3 = "Ei, ei, Aris, olha só~"
21200-4 = "Tcharam! Um uniforme de empregada~!"
21200-5 = "Aaaah!"
21200-6 = "(Zuum!)"
21200-7 = "Ahaha, que reação boa!"
21200-8 = "O que você tá fazendo, hein?! A Aris-chan ficou apavorada de verdade!"
21200-9 = "Aris-chan, você está bem?"
21200-11 = "A-Aris não quer ver uniformes de empregada por um bom tempo!"
21200-12 = "Parece que o corpo dela já se recuperou totalmente, mas o coração ainda vai precisar de um tempinho."
21200-13 = "Hum, eu fui até o conselho estudantil falar sobre o prédio que destruímos..."
21200-14 = "Por sorte, eles aceitaram registrar como um \"acidente\" durante as atividades do clube."
21200-15 = "Mentira! Como você conseguiu isso, Yuzu?! Eu achei que, mesmo se o clube continuasse existindo, a gente ia perder toda a verba pra pagar o prejuízo...!"
21200-16 = "Não fui eu, parece que a C&C cuidou disso."
21200-17 = "E... a Neru-senpai deixou um recado."
21200-18 = "\"Nos vemos de novo\"... foi o que ela disse."
21200-19 = "Aaaah?!"
21200-22 = "Aaah, Aris-chan! Não entra no armário! Você aprendeu umas manias esquisitas vendo a Yuzu-chan!"
21200-23 = "Ufa... bom, menos mal. Aliás..."
21200-24 = "...Sim."
21200-26 = "O Prêmio Millennium começou, né."
21200-28 = "Se a gente ganhar, vamos estourar confete. Mas, se não ganharmos..."
21200-29 = "...Vamos ter que arrumar as coisas logo."
21200-30 = "Tudo bem por nós, mas a Yuzu-chan e a Aris-chan..."
21200-31 = "..."
21200-32 = "..."
21200-34 = "Prêmio Millennium - Cerimônia de Premiação"
21200-35 = "Daremos início agora ao Prêmio Millennium! A apresentadora e mestre de cerimônias de hoje sou eu, Kotori!"
21200-36 = "Desta vez, tivemos o maior número de inscrições de toda a história do Prêmio Millennium."
21200-37 = "Provavelmente por causa da mudança de política do conselho estudantil, que passou a exigir \"resultados\" para manter os clubes ativos!"
21200-39 = "Millennium - Clube de Desenvolvimento de Jogos"
21200-40 = "...Parece que a Kotori-chan e o pessoal dela ficaram bem, né."
21200-41 = "O Clube de Engenharia já tinha bastante reconhecimento em Millennium desde antes... mas fico muito aliviada."
21200-42 = "Sim. Aliás, o maior número de inscrições da história..."
21200-43 = "Isso complica um pouco as coisas..."
21200-45 = "A obra vencedora do ano passado, a \"Coletânea de Poemas de Memórias\" da Noa-san, parece ter fugido um pouco da intenção original... mas sua sequência de palavras metafísicas foi aclamada como o melhor tratamento contra insônia de Millennium."
21200-46 = "Nesta edição, também temos \"Estojo portátil de queijo que parece pasta de dente mas solta queijo mussarela\", \"Guarda-chuva de autodefesa com mísseis embutidos\"..."
21200-47 = "\"Bateria portátil em formato de gravata\", \"Conjunto de roupas íntimas com camuflagem óptica\", \"Geladeira pessoal em formato de estojo que cabe exatamente uma latinha\"..."
21200-48 = "E também! O jogo estilo retrô com modo multijogador para celular que está causando um verdadeiro furor na internet de Kivotos, \"Tales Saga Chronicle 2\", entre muitos outros!"
21200-49 = "Dentre as centenas de obras inscritas desta vez, apenas 7 alcançarão a glória!"
21200-50 = "(Gulp...)"
21200-51 = "Vamos anunciar os vencedores, começando pelo 7º lugar!"
21200-52 = "Em 7º lugar está o \"Conjunto de roupas íntimas com camuflagem óptica\" da Utaha-san, do Clube de Engenharia! Trata-se de uma obra excêntrica que, mesmo vestida, deixa a pele à mostra por baixo, tornando impossível saber se a pessoa está usando ou não..."
21200-53 = "Recebeu notas altíssimas por permitir que exibicionistas pratiquem seu hobby dentro da lei... Fico até curiosa para saber quem foi o jurado que deu essa nota! Enfim, 7º lugar!"
21200-54 = "Ufa..."
21200-55 = "Bem, nosso jogo merece muito mais que um 7º lugar, né."
21200-56 = "E em 6º lugar! Este produto é..."
21200-57 = "..."
21200-58 = "Em 5º lugar...!"
21200-59 = "Nosso nome... não foi chamado."
21200-60 = "Próximo, 4º lugar...!"
21200-61 = "Aaaah! Por favor, que seja agora!"
21200-62 = "Agora entramos no Top 3! Em 3º lugar...!"
21200-63 = "M-Meu coração não vai aguentar!"
21200-64 = "Por favor... por favor..."
21200-65 = "E levando o 2º lugar por uma diferença mínima...!"
21200-66 = "..."
21200-67 = "Por favor, chamem o nosso nome...!"
21200-68 = "Droga, nem em 2º lugar...!"
21200-69 = "Então quer dizer que...!"
21200-70 = "...!"
21200-71 = "Por fim! A obra que conquistou a honra máxima neste Prêmio Millennium!"
21200-72 = "Tum-tum..."
21200-73 = "O 1º lugar vai para...!"
21200-74 = "Uuuh...!"
21200-78 = "Logo após os comerciais!"
21200-80 = "Aris!!!"
21200-81 = "Carregamento concluído! Pronta para disparar a qualquer momento!"
21200-82 = "Eu entendo como você se sente! Eu entendo, mas você não pode atirar nem no auditório nem nessa tela...!"
21200-83 = "Ai, por favor, parem de fazer suspense..."
21200-85 = "Agora sim! Vamos ao anúncio!"
21200-86 = "O tão aguardado 1º lugar é... o Clube de Desenvolvimento de Novos Materiais—"
21200-87 = "(Bang! Bang! Bang!)"
21200-88 = "Aaaah! Por que você atirou no monitor de verdade?!"
21200-89 = "Já vão levar tudo embora mesmo, não importa mais!"
21200-90 = "Buaaaá! Agora é o fim de vez!!"
21200-92 = "Uuuh..."
21200-93 = "No fim das contas, acabou assim mesmo..."
21200-96 = "Se acalma, mana. Mas..."
21200-97 = "...Eu sei! Eu sei que não fomos totalmente rejeitadas, que não tem por que desanimar..."
21200-98 = "As avaliações na internet não foram ruins, e a gente cresceu muito desde aquela época em 1º lugar no ranking de jogos horríveis."
21200-99 = "Com certeza vamos continuar crescendo."
21200-100 = "Da próxima vez vamos conseguir um resultado ainda melhor e até ganhar uma sala de clube maior e mais bonita que esta! ...Mas,"
21200-101 = "Sim... porque se formos expulsas daqui, a Yuzu-chan e a Aris-chan..."
21200-102 = "...Não se preocupe, Midori."
21200-103 = "Eu vou voltar para o dormitório."
21200-105 = "Hã?"
21200-106 = "Acho que ninguém mais vai me chamar de desenvolvedora de jogos horríveis. Não, mesmo que alguém chame, tudo bem."
21200-107 = "Porque agora eu tenho... vocês três e o Sensei."
21200-108 = "Muito obrigada, Sensei."
21200-109 = "Desde que o Sensei veio para esta sala de clube... nós mudamos muito."
21200-110 = "Só que a Aris-chan..."
21200-114 = "[ns1] \"...Sim, deixa comigo.\"\n[ns2] \"Aris, quer vir para a Schale?\""
21200-115 = "...Aris-chan."
21200-116 = "...Aris-chan."
21200-117 = "..."
21200-118 = "...Desculpa."
21200-119 = "Não."
21200-120 = "Porque eu posso confiar no Sensei."
21200-121 = "Mas..."
21200-122 = "Eu não vou mais..."
21200-124 = "Não vou mais poder ficar... junto com todo mundo, não é?"
21200-125 = "!!"
21200-126 = "Aah, desculpa... me desculpa, Aris-chan!"
21200-127 = "Eu vou na Schale todos os dias! É sério, eu prometo que vou todo santo dia!"
21200-128 = "Não importa onde a gente esteja! Vamos continuar fazendo jogos juntas!"
21200-130 = "Uuuuuh...!"
21200-131 = "N-Não! Eu não quero!"
21200-132 = "Sensei! Não pode levar a Aris embora!"
21200-133 = "E-Eu levo ela pro meu quarto! A gente divide a cama! Eu divido minha comida com ela também!"
21200-134 = "E-Eu dou a minha parte também!"
21200-135 = "Vocês duas, não deixem o Sensei em apuros... Além disso, se descobrirem isso, tanto você, Momoi, quanto você, Midori..."
21200-137 = "(Clac!)"
21200-138 = "Momoi! Midori! Aris-chan! Yuzu!"
21200-139 = "Aaaah! A Yuuka já chegou!"
21200-140 = "E-Espera um pouco! Já tão rápido assim...?!"
21200-141 = "Seu demônio! O conselho estudantil não tem coração?!"
21200-143 = "Parabéns!"
21200-144 = "...?"
21200-145 = "...Hã?"
21200-146 = "H-Hã...?"
21200-149 = "?"
21200-150 = "Ué, que reação é essa?"
21200-151 = "Vocês não viram o resultado?"
21200-152 = "...Resultado?"
21200-153 = "Nós não ficamos entre os 7 primeiros..."
21200-154 = "Hã?"
21200-155 = "Do que vocês estão falando? Ainda está passando ao vivo, olhem direito!"
21200-156 = "É que a mana explodiu o monitor..."
21200-157 = "O que vocês têm na cabeça...? Toma, olhem aqui. Eu também estava vendo no celular e vim correndo no meio da transmissão."
21200-159 = "Prêmio Millennium - Cerimônia de Premiação"
21200-160 = "Até hoje, o Prêmio Millennium concedeu prêmios às obras criadas com o talento e a capacidade das alunas tendo como eixo central a \"praticidade\". Isso se baseia no propósito de buscar e realizar um futuro melhor."
21200-161 = "No entanto, entre as obras desta edição, houve uma que nos fez enxergar a \"praticidade\" por um novo ângulo. Um certo \"jogo\" realmente nos fez recordar com clareza um passado nostálgico e sentir possibilidades para o futuro."
21200-162 = "Portanto, decidimos tomar uma decisão excepcional desta vez."
21200-163 = "Criaremos um \"Prêmio Especial\", e a obra vencedora é... \"Tales Saga Chronicle 2\", do Clube de Desenvolvimento de Jogos."
21200-164 = "Quê?! Mentira?!"
21200-165 = "O que está acontecendo...?"
21200-166 = "Um conceito retrô atemporal, reviravoltas que desafiam o bom senso e superam a imaginação uma após a outra, e um universo misterioso que à primeira vista parecia não combinar com nada disso... No começo foi uma confusão atrás da outra, mas..."
21200-167 = "Viajar por um mundo novo, criando novos laços um a um, para derrotar o Rei Demônio..."
21200-168 = "Acredito que é uma obra que capturou com maestria a diversão fundamental de um RPG."
21200-169 = "Enquanto jogava, lembrei nitidamente da época em que me apaixonei por jogos pela primeira vez. Em reconhecimento a isso, concedemos a esta obra..."
21200-171 = "O \"Prêmio Especial\" do Prêmio Millennium."
21200-174 = "Millennium - Clube de Desenvolvimento de Jogos"
21200-175 = "Hã... ah..."
21200-176 = "Meus parabéns de verdade! Hum, na verdade eu também joguei. Não posso dizer que foi impecavelmente divertido, mas... me proporcionou aquela sensação única que a gente tem depois de jogar um bom jogo."
21200-178 = "Momo, Mido! Eu também joguei \"TSC2\", é bom demais! Tá o maior alvoroço na internet agora!"
21200-179 = "Segundo o levantamento da Veritas, tem mais buscas por \"TSC2\" do que por nomes de idols famosas!"
21200-180 = "S-Sério mesmo...?"
21200-183 = "Confirmado."
21200-184 = "\"Tales Saga Chronicle 2\", publicado há 3 horas, contava até instantes atrás com 7.705 downloads e um total de 1.372 comentários..."
21200-185 = "Desde o anúncio do Prêmio Millennium, o número de downloads ultrapassou 10 mil em cerca de 26 segundos."
21200-186 = "!?"
21200-187 = "Também foram adicionados cerca de 500 comentários. Pela análise das nuances, 242 são negativos ou céticos, 191 são positivos ou de expectativa, e o restante é indeterminado ou ainda sem avaliação definida."
21200-188 = "U-Ué...? E-Então no fim das contas... a gente se deu mal?!"
21200-189 = "Não, de jeito nenhum."
21200-190 = "Yuzu-chan...?"
21200-191 = "..."
21200-192 = "..."
21200-193 = "Olhem. Os dois melhores comentários, empatados em primeiro lugar com mais curtidas..."
21200-195 = "<chicken: No começo eu hesitei muito se jogava ou não... mas agora penso assim: ainda bem que encontrei este jogo>"
21200-196 = "<Kotoha0507: Até hoje, eu tinha preconceito contra Millennium.>"
21200-197 = "<Kotoha0507: Posso afirmar com certeza que meu preconceito de que as alunas de Millennium só tinham frieza e racionalidade desapareceu completamente com este Prêmio Millennium e com \"Tales Saga Chronicle 2\">"
21200-198 = "...!"
21200-199 = "Hum... então quer dizer que o clube não vai ser fechado, né?!"
21200-202 = "Sim, exatamente. Ah, mas é apenas uma \"prorrogação temporária\", viu? Não é uma premiação oficial, então o conselho estudantil decidiu deixar o confisco da sala e o fechamento do Clube de Desenvolvimento de Jogos \"em suspenso\" até o próximo semestre."
21200-203 = "Hum, e mais uma coisa..."
21200-204 = "É que..."
21200-205 = "Hm?"
21200-206 = "...D-Desculpa por ter chamado os consoles daqui de tralha..."
21200-207 = "Graças a vocês, eu me lembrei de vários jogos que eu jogava quando era pequena. Depois de tanto tempo, senti de novo aquela alegria de explorar um mundo novo."
21200-208 = "...Obrigada. Bom, ainda precisamos cuidar do pedido de prorrogação da sala e do recebimento da verba do clube, então passem na sala do conselho estudantil quando se acalmarem. Até mais!"
21200-211 = "E-Então...!"
21200-212 = "...!"
21200-213 = "Con..."
21200-214 = "Conseguimooos!!"
21200-215 = "Que alívio...!"
21200-216 = "Conseguimos... Que felicidade...!"
21200-218 = "???"
21200-219 = "H-Hum...?"
21200-220 = "Aris-chan! A gente ganhou o Prêmio Especial! E este lugar vai continuar sendo a nossa sala de clube!"
21200-221 = "Hum, i-isso quer dizer que..."
21200-222 = "A Aris pode continuar... junto com todo mundo daqui pra frente...?"
21200-225 = "Sim!"
21200-228 = "Contamos com você daqui pra frente também...!"
21200-229 = "..."
21200-230 = "Eu também... eu também estou muito feliz."
21200-231 = "Aris-chan!!"
21200-232 = "Nós...!!"
21200-233 = "Vamos ficar juntas para sempre!"
21200-234 = "...Sim!"
21200-238 = "Conto com vocês daqui pra frente também...!"
21200-243 = "......"
21200-244 = "Taxa de recuperação de dados: 98.00%"
21200-245 = "Ativando sistema..."
21200-246 = "Preparação concluída"
21200-247 = "Configurando programa......"
21200-250 = "Divi:Sion..."
21200-251 = "..."
21200-253 = "[9b1e1e]AL-1S...[wa:1000] Não..."
21200-255 = "[9b1e1e]A r i s...[wa:1000] Minha..."
21200-257 = "[9b1e1e]Minha preciosa...[wa:500]...[wa:500]...[wa:500]...[wa:1000]!@#$%$^&*(!@$!!"
21200-261 = "Romance Retrô"
