[translation]
1300806-1 = "Запоздалое осознание"
1300806-2 = "(Мы с Серикой убирали улицы до поздней ночи.)"
1300806-4 = "*вздох* Ещё один изматывающий рабочий день."
1300806-5 = "[s1] «Всё равно ты отлично поработала.»\n[s2] «Да, сегодня было нелегко.»"
1300806-6 = "Ещё как. Я чуть волосы на себе не вырвала, когда тот мусорный бак опрокинулся."
1300806-7 = "Ещё как. Я чуть волосы на себе не вырвала, когда тот мусорный бак опрокинулся."
1300806-8 = "Хм..."
1300806-9 = ""
1300806-10 = ""
1300806-12 = "(Мы с Сенсеем каждый день вместе подрабатываем...)"
1300806-13 = "(Э-Это вообще нормально?)"
1300806-14 = "(В смысле... мне нравится проводить время с Сенсеем, но...!)"
1300806-15 = "(Но целый день собирать мусор и мести листья — не совсем мой идеальный вариант...)"
1300806-16 = ""
1300806-17 = "(Может, стоит как-нибудь разнообразить всё и...)"
1300806-18 = "(...с-сходить на свидание... или что-то такое.)"
1300806-19 = ""
1300806-20 = "..."
1300806-21 = "Нет, дура! Идиотка!"
1300806-22 = "[s3] «...Что?»\n[s4] «...Не знаю, что всё это значило, но прости?»"
1300806-23 = "Вы такой идиот, Сенсей! Я ухожу!"
1300806-24 = "Вы такой идиот, Сенсей! Я ухожу!"
1300806-26 = "(Серика накричала на меня, но я так и не понял почему.)"
