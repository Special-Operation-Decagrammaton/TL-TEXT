[translation]
1013908-1 = "Подношение Нико"
1013908-2 = "Мне стало интересно про еду длительного хранения, о которой говорила Нико, поэтому во время обеденного перерыва я ненадолго заглянул на кухню."
1013908-3 = ""
1013908-7 = "Кухня здания Шале"
1013908-9 = "Стоило открыть дверь кухни, как воздух наполнили шипение, похожее на дробь дождя, и насыщенный аппетитный запах масла."
1013908-10 = "[ns] «Этот запах...»"
1013908-12 = ""
1013908-13 = "Немного рановато. До готовности ещё далеко."
1013908-14 = "Немного рановато. До готовности ещё далеко."
1013908-15 = "[s1] «Пахнет очень вкусно.»\n[s2] «Разве ты не говорила, что готовишь боевой паёк?»"
1013908-18 = "Да, именно его."
1013908-19 = "Сейчас я готовлю традиционный боевой паёк, который солдаты носили с собой много лет назад..."
1013908-20 = ""
1013908-23 = "Это инаризуси!"
1013908-24 = "[s] «Инаризуси может быть боевым пайком?»"
1013908-25 = ""
1013908-27 = ""
1013908-28 = ""
1013908-29 = "Да. Инаризуси идеально соответствует требованиям к боевому пайку."
1013908-30 = "Его обжаривают в масле, поэтому он очень калорийный, а благодаря низкому содержанию влаги долго не портится. И ещё там много уксуса с антибактериальными свойствами."
1013908-31 = "Если вы в ситуации, где нельзя готовить или разводить огонь, для операции трудно придумать что-то лучше инаризуси."
1013908-32 = "Пожалуй, проблема моих только в том, что они настолько вкусные, что хочется съесть все сразу. Фуфу."
1013908-33 = "[ns] «Если подумать, ты права...»"
1013908-35 = "[ns3] «Но раз ты специально выделила время на готовку...»\n[ns4] «Они отличаются от инаризуси, которые ты обычно делаешь?»"
1013908-38 = "Да. Сегодняшние инаризуси полностью домашние: я делаю с нуля всё, от жареных кармашков тофу до начинки."
1013908-39 = "Для бэнто отряда FOX я обычно использую магазинный жареный тофу, но..."
1013908-40 = "Мне всегда хотелось найти время и самой сделать эти кармашки!"
1013908-41 = ""
1013908-44 = "О, уже столько времени?"
1013908-45 = "Прошу прощения на секунду..."
1013908-50 = "― [log=니코]Фуфу. Идеально приготовлено.[/log][wa:1300]"
1013908-52 = "― [log=니코]Идеально вздулось. Для идеального кусочка жареного тофу![/log][wa:1040]"
1013908-55 = "[ns] «Выглядит вкусно.»"
1013908-56 = "― [log=니코]А, ещё не готово.[/log][wa:1220]"
1013908-59 = "― [log=니코]Позже его нужно будет ещё раз немного обжарить.[/log][wa:10]"
1013908-62 = "― [log=니코]Сначала при более низкой температуре, а потом ещё раз при высокой.[/log]"
1013908-64 = "― [log=니코]Так вся влага уйдёт, и получится идеальный жареный тофу![/log][wa:40]"
1013908-67 = "[ns] «Не думал, что обжаривать тофу настолько трудоёмко...»"
1013908-68 = "― [log=니코]Да.[/log][wa:1140]"
1013908-70 = "― [log=니코]На кусочки жареного тофу уходит много времени и сил.[/log]"
1013908-73 = "― [log=니코]Именно поэтому[/log]"
1013908-75 = "― [log=니코]их приносили в дар, молясь о здоровье и богатом урожае.[/log][wa:420]"
1013908-78 = "― [log=니코]Всё, чего я желаю,[/log][wa:1850]"
1013908-80 = "― [log=니코]это счастья и благополучия тем, кто рядом со мной.[/log][wa:1140]"
1013908-83 = "― [log=니코]И если это чувство, вложенное в блюдо, достигнет их...[/log]"
1013908-85 = "― [log=니코]я буду очень счастлива.[/log]"
1013908-89 = ""
1013908-90 = "Тофу, обжаренный дважды, готов!"
1013908-91 = "Конечно, чтобы превратить его в инаризуси, придётся ещё немного поработать."
1013908-92 = "Но если не возражаете, сначала попробуете кусочек тофу, Сенсей?"
1013908-93 = "[s5] «С удовольствием, но...»\n[s6] «Точно можно мне пробовать твой самый первый домашний жареный тофу, Нико?»"
1013908-96 = "Можно. На самом деле я буду очень рада, если именно вы его попробуете, Сенсей."
1013908-97 = "[s] «Хорошо, пробую...»"
1013908-98 = ""
1013908-100 = ""
1013908-101 = "[ns7] «Он намного мягче и насыщеннее магазинного!»\n[ns8] «Мне очень нравится эта воздушная текстура!»"
1013908-104 = "Да. В этом преимущество домашнего приготовления: толщину и размер можно подобрать как угодно."
1013908-105 = "Хотя я, возможно, немного перестаралась. Это уже скорее толстый жареный тофу."
1013908-106 = "Но для первой попытки совсем неплохо!"
1013908-107 = "А, Сенсей. Вы говорили, что до конца дня у вас планов нет, верно?"
1013908-108 = "Раз я всё равно буду делать из этого тофу инаризуси, не хотите поужинать ими вместе со мной?"
1013908-109 = "[s] «Отличная идея!»"
1013908-110 = "Хорошо. Я сейчас всё приготовлю, а вы, пожалуйста, спокойно отдыхайте, как в обычный выходной, Сенсей."
1013908-111 = "[s] «Но...»"
1013908-112 = "Нет-нет! Я настаиваю. В конце концов, всё это я сама захотела сделать."
1013908-113 = ""
1013908-115 = ""
1013908-116 = ""
1013908-117 = "К тому же это моё первое подношение вам, Сенсей."
1013908-119 = "После этого мы приятно провели вечер, за ужином поедая домашние инаризуси Нико."
1013908-120 = "Вкус был очень мягким и тёплым. Наверное, потому что Нико готовила их так искренне."
