1005502-5 = ""
1005502-12 = "Место было таким удалённым, что к моему приходу солнце уже село."
1005502-13 = ""
1005502-16 = "А? Кто там?!"
1005502-17 = ""
1005502-20 = "...О."
1005502-21 = ""
1005502-25 = ""
1005502-26 = ""
1005502-27 = "Сенсей? Что вы делаете так далеко отсюда? Да ещё в такое время?"
1005502-28 = "...Что?"
1005502-29 = "О, мы ведь договаривались встретиться. Спасибо, что не забыли!"
1005502-30 = ""
1005502-32 = ""
1005502-33 = "Скорее, скорее. Заходите и согрейтесь. Иначе холод впустите."
1005502-34 = ""
1005502-41 = ""
1005502-42 = "Не хочу, чтобы это прозвучало плохо, но я правда не думала, что вы действительно придёте. Для меня это много значит."
1005502-43 = "Серьёзно, спасибо. Простите, что кроме меня вас некому развлечь."
1005502-44 = "Остальные ушли собирать сколько смогут дров."
1005502-45 = "[s1] «Не переживай, тебе не нужно обращаться со мной как с гостем.»\n[s2] «Ты совсем одна? Не скучно?»"
1005502-46 = "А кто вы тогда, если не мой гость? Хм, теперь я не успокоюсь, пока не придумаю ответ."
1005502-47 = "Ну, совру, если скажу, что не скучала. Но теперь вы здесь, правда, Сенсей?"
1005502-48 = "Хи-хи. Весело вас дразнить."
1005502-49 = "Ну, посмотрим... Простите. Мне почти нечего предложить."
1005502-50 = ""
1005502-52 = ""
1005502-53 = ""
1005502-54 = ""
1005502-56 = ""
1005502-58 = "Как насчёт этого? Вы, должно быть, немного хотите пить после такого долгого пути."
1005502-59 = "[s3] «Воды? Я умираю от жажды.»\n[s4] Поблагодарить и выпить."
1005502-60 = ""
1005502-61 = ""
1005502-66 = ""
1005502-69 = "[ns5] Выплюнуть.\n[ns6] «Э-Это водка!»"
1005502-71 = "Сенсей, вы всё вылили! Моя драгоценная вод... Моя вода жизни!"
1005502-73 = "...Технически вода ведь получается из водки, да?"
1005502-74 = "«Обманула» — не слишком ли агрессивно сказано? Я ведь никогда не говорила, что это вода."
1005502-75 = "И вообще, разве это так важно? Взрослые могут пить сколько угодно алкоголя."
1005502-76 = "А?"
1005502-77 = "Это не значит, что вам можно пить перед студентами?"
1005502-78 = "Хм... Честно говоря, такого я не ожидала..."
1005502-79 = ""
1005502-81 = ""
1005502-82 = "Может, договоримся, что с этого момента можно?"
1005502-83 = "[s7] «Если это не вода, ответ — нет.» \n[s8] «Пожалуйста, просто дай мне воды.»"
1005502-84 = "Но у меня есть только водка..."
1005502-85 = "Но у меня есть только водка..."
1005502-86 = "Я правда не пыталась вас обмануть, честно."
1005502-87 = "Видите ли, электричество отключено, поэтому в холодильнике всё замёрзло."
1005502-88 = "Вода, сок, газировка... Всё, кроме водки, потому что в ней много алкоголя."
1005502-89 = "Разве водка не идеальный напиток?"
1005502-90 = "Ею можно утолить жажду в крайнем случае, согреться на морозе или даже продезинфицировать открытую рану!"
1005502-91 = "Это как вода, только лучше! Ну что ещё можно пить И использовать как топливо для огня?"
1005502-92 = "[s] «Ты... правда любишь водку, да?»"
1005502-93 = "Люблю! Даже от одной мысли хочется глоток."
1005502-94 = "Да и пить здесь больше нечего. Вы же не хотите, чтобы я получила холодовой ожог, поедая лёд..."
1005502-95 = "Крошечный, совсем малюсенький глоток в такой отчаянной ситуации почти необходим, правда?"
1005502-96 = ""
1005502-98 = ""
1005502-99 = "Вот именно! Тогда я угощусь!"
1005502-100 = "[s9] «Нет, нет и ещё раз нет. Нельзя.» \n[s10] Забрать водку."
