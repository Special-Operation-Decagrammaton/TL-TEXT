[translation]
2300702-1 = "Необычная девушка"
2300702-2 = "Следуя указаниям Ханако, я пришёл в кампус Тринити, где мы договорились встретиться."
2300702-3 = "Кампус Тринити, как всегда, выглядел величественно и изысканно."
2300702-4 = "Сенсей!"
2300702-5 = "Сюда, сенсей!"
2300702-6 = "[s] «...?»"
2300702-8 = "[s] (Посмотреть в сторону голоса.)"
2300702-11 = "― Добро пожаловать, Сенсей.[wa:1840]"
2300702-13 = "― Спасибо, что пришёл.[wa:1220]"
2300702-16 = "[ns] «Что ты здесь делаешь?»"
2300702-17 = "― Здесь так приятно и прохладно. Обожаю.[wa:3120]"
2300702-20 = "― Это моё особенное тайное место... Хи-хи...[wa:2420]"
2300702-23 = "― Что скажешь, Сенсей?[wa:2990]"
2300702-26 = "― Разденемся здесь?[wa:2070]"
2300702-29 = "[ns1] «Нет, пожалуй.»\n[ns2] «Спасибо, но я откажусь.»"
2300702-30 = "― Хи-хи-хи... Когда вот так раздеваешься среди бела дня...[wa:1180]"
2300702-31 = "― Хи-хи-хи... Когда вот так раздеваешься среди бела дня...[wa:1180]"
2300702-33 = "― ...разве это не немного возбуждает?[wa:10]"
2300702-36 = "― Такое чувство, будто делаешь что-то запретное.[wa:1660]"
2300702-39 = "Ханако надевает обувь и спускается с фонтана."
2300702-40 = ""
2300702-41 = ""
2300702-42 = "Хи-хи..."
2300702-43 = "Тебе разве не нравится, Сенсей? Я про то, чтобы снимать их."
2300702-44 = "Я обожаю. Иногда я снимаю с себя всё и гуляю по кампусу, и каждый раз испытываю странное чувство..."
2300702-45 = "Будто думаю: разве можно мне вот так находиться в общественном месте? Словно я нарушаю какое-то табу..."
2300702-46 = "Я читала в книге, что это полезно для здоровья."
2300702-47 = "Хочешь попробовать, Сенсей? Кто знает, может, тебе понравится. Пока не попробуешь — не узнаешь."
2300702-48 = "[s3] «Ты ведь говоришь о... носках, да?»\n[s4] «Ты предлагаешь мне ходить босиком, да?»"
2300702-49 = "...Верно. Да, именно это я и говорю."
2300702-50 = "...Верно. Да, именно это я и говорю."
2300702-51 = "Кажется, это называется акупрессурой. Говорят, она полезна для здоровья."
2300702-52 = "Было бы забавно, если бы это вошло в моду в Тринити."
2300702-53 = "Представляешь, все студенты ходят вокруг совсем без ничего?"
2300702-54 = "Хи-хи-хи! Вот было бы зрелище, правда?"
2300702-55 = "[s] «Мы всё ещё говорим о том, чтобы ходить в школу босиком, да?»"
2300702-56 = "Нет! Я говорю о том, чтобы ходить в школу голышом! Г! О! Л! Ы! Ш! О! М!"
2300702-57 = "Снять всю одежду и ■■, пока ■■ и ■■■■■■."
2300702-58 = "[s] «...»"
2300702-59 = "..."
2300702-60 = "Ой, да ладно. Я просто шучу, Сенсей. В Тринити такое всё равно никогда не войдёт в моду."
2300702-61 = "Хотя уверена, это было бы очень весело..."
2300702-62 = "[s5] «(Если так продолжится, я ещё начну соглашаться с Ханако.)»\n[s6] «Лучше сразу перейти к делу.»"
2300702-63 = "...Ах да. Точно."
2300702-64 = "...Ах да. Точно."
2300702-65 = "Я связалась с тобой, потому что хотела кое-что спросить о дополнительных занятиях... Просто мне было так весело с тобой..."
2300702-66 = "Ну что, пойдём? Я знаю место, идеально подходящее для учёбы."
2300702-67 = "Там ты сможешь многому меня научить..."
2300702-68 = "Ну же, пошли!"
2300702-69 = ""
2300702-70 = ""
2300702-71 = ""
2300702-72 = ""
2300702-74 = ""
2300702-75 = "А? Сенсей? Ты не идёшь?"
2300702-76 = "[s7] «Кажется, сначала стоит спросить, куда ты направляешься.»\n[s8] «На всякий случай... Куда мы идём?»"
2300702-77 = "А? Ну очевидно же, если речь о дополнительных занятиях после уроков..."
2300702-78 = "А? Ну очевидно же, если речь о дополнительных занятиях после уроков..."
2300702-79 = "Мы должны пойти в тёмную кладовую спортзала, куда никто не ходит! Смотри, я даже ключи одолжила..."
2300702-80 = "[s9] «Ни за что!»\n[s10] «Отказываюсь!»"
2300702-81 = "О боже..."
2300702-82 = "О боже..."
2300702-83 = "Тогда... хочешь заняться этим здесь?"
2300702-84 = "Посреди площади академии, среди бела дня, в окружении всех этих людей? Для меня это может быть немного трудно..."
2300702-85 = "Но, может, один раз я смогла бы попробовать..."
2300702-86 = "[s] «Мы говорим об учёбе! Об учёбе!»"
2300702-87 = "Да-да. Учёба. Частный урок от тебя..."
2300702-88 = "Хи-хи-хи... Я просто пошутила. Прости."
2300702-89 = "...Ладно."
2300702-90 = "Вообще-то нам сюда. В главном здании есть общественная библиотека, там всегда много людей... Так что беспокоиться не о чем."
2300702-91 = "Хорошо, пойдём."
2300702-93 = "(После этого я настороженно последовал за Ханако, но в библиотеке прошло самое обычное дополнительное занятие.)"
2300702-94 = "(...И почему-то она задала мне всего один-два вопроса.)"
