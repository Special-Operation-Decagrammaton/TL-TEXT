[translation]
1600306-1 = "Девушка гонится за искрами"
1600306-2 = "Место, о котором рассказала Сузуми, оказалось тихим парком развлечений в Тринити."
1600306-3 = "Было уже довольно поздно, поэтому аттракционы работали почти без посетителей."
1600306-4 = "А, Сенсей. Я здесь."
1600306-5 = "Спасибо, что пришли. Знаю, вы заняты, да и уже довольно поздно..."
1600306-6 = "[s1] «Я рад, что пришёл.»\n[s2] «Что происходит?»"
1600306-7 = "Ну... Как я и сказала, ничего важного."
1600306-8 = "К-как я и сказала, ничего важного."
1600306-9 = "Эм..."
1600306-10 = "[s] «Да...?»"
1600306-11 = "З-звёзды..."
1600306-12 = "Я хотела показать вам... звёзды..."
1600306-13 = "[s3] «О! Почему?» \n[s4] «С чего вдруг звёзды?»"
1600306-14 = "П-простите. Знаю, это внезапно."
1600306-15 = "П-простите. Знаю, это внезапно."
1600306-16 = "Не знаю, о чём я думала... Наверное, это было глупо..."
1600306-17 = "Можете идти... Давайте сделаем вид, что ничего не было."
1600306-18 = ""
1600306-20 = ""
1600306-21 = "А? Вам всё равно?"
1600306-22 = "Так... вы спросили, с чего вдруг звёзды...?"
1600306-23 = "Особой причины нет..."
1600306-24 = "Просто мне захотелось показать их вам, наверное."
1600306-25 = ""
1600306-27 = ""
1600306-28 = ""
1600306-30 = ""
1600306-31 = "Понимаете..."
1600306-32 = "Этот парк развлечений — последняя точка моего ночного патруля."
1600306-33 = "В такое время здесь пусто и удобно прятаться, поэтому раньше тут часто собирались хулиганы."
1600306-34 = "Но они постоянно натыкались на меня и в конце концов ушли. Теперь здесь тихо и спокойно."
1600306-35 = "...Здесь действительно мирно."
1600306-36 = "Так у меня появилось время посидеть на балконе или просто постоять, глядя на звёзды."
1600306-37 = "И я подумала... может, с высоты звёзд будет видно больше."
1600306-38 = "Самая высокая точка здесь — колесо обозрения..."
1600306-39 = "Ну..."
1600306-40 = "Но как-то странно... кататься на колесе обозрения одной... Поэтому..."
1600306-41 = "[s] «Тебе нужен кто-то, кто прокатится с тобой»."
1600306-42 = "Когда произносишь это вслух, звучит совсем по-детски. Простите."
1600306-43 = "...! Вы правда не против?"
1600306-44 = "Э-это... эм..."
1600306-45 = ""
1600306-47 = ""
1600306-48 = "...Эм-м, неважно."
1600306-49 = "Спасибо, Сенсей."
1600306-50 = ""
1600306-52 = ""
1600306-53 = "Тогда сюда..."
1600306-54 = "[s] Следовать за Сузуми."
1600306-55 = ""
1600306-57 = ""
1600306-60 = "Мы с Сузуми пошли рядом к колесу обозрения."
1600306-61 = ""
1600306-68 = "Я уже говорила вам о дне, когда можно ни о чём не беспокоиться."
1600306-69 = "Мне иногда хотелось получить выходной, когда не нужно заниматься Патрульной командой и вообще ни о чём переживать."
1600306-70 = "И я поняла, что, возможно, это место как раз такое."
1600306-71 = "Во всяком случае, я об этом думала..."
1600306-72 = ""
1600306-75 = "Я-я извиняюсь. Я опять разболталась."
1600306-83 = "О... Мы пришли."
1600306-84 = "Скоро поднимемся, подождите секунду."
1600306-87 = "― ...Красиво.[wa:760]"
1600306-90 = "― Такое чувство,[wa:1000]"
1600306-92 = "― будто отсюда можно дотянуться до звёзд.[wa:260]"
1600306-95 = "― В последнее время мне всё больше нравятся[wa:2300]"
1600306-97 = "― такие короткие минуты передышки...[wa:1060]"
1600306-100 = "― Думаю, всё началось с тех пор, как я встретила вас.[wa:1720]"
1600306-103 = "― ...Сенсей.[wa:2640]"
1600306-106 = "― Как думаете, мы могли бы[wa:1400]"
1600306-108 = "― иногда вот так проводить время вместе?[wa:1400]"
1600306-111 = "― Я знаю,[wa:1540]"
1600306-113 = "― что постоянно говорю о скучных вещах, но...[wa:580]"
1600306-116 = "― Может быть, однажды я...[wa:3780]"
1600306-118 = "― ...Да, однажды...[wa:4240]"
1600306-121 = "...расскажу вам, что на самом деле хочу сказать."
