[translation]
2300306-1 = "Восстание машин"
2300306-2 = "Крыша Миллениума"
2300306-3 = "Я ждала вас, Сенсей."
2300306-4 = "Как и писала в сообщении, я закончила модифицировать дрон. Хочу провести тестовый полёт на крыше."
2300306-5 = "У этого дрона не только улучшены лётные характеристики, но ещё есть распознавание голоса и простой модуль ИИ, так что я могу управлять им голосом."
2300306-6 = "Его имя... Athena-3!"
2300306-7 = "Названный в честь богини мудрости, этот дрон основан на эмпирическом алгоритме, позволяющем выполнять когнитивные задачи на высоком уровне."
2300306-8 = "Иными словами, с помощью постоянного машинного обучения он способен находить оптимальное решение для любой поставленной задачи, какой бы приказ я ни дала."
2300306-9 = "[s1] «Впечатляющий функционал.»\n[s2] «...Я не понимаю, о чём ты.»"
2300306-11 = "Хм... извини. Кажется, я завалила тебя жаргоном."
2300306-12 = "Давай для начала проверим несколько простых функций?"
2300306-13 = "Athena-3, сфотографируй Сенсея с помощью камеры."
2300306-14 = "Режим фотосъёмки активирован. Съёмка объекта «Сенсей»."
2300306-15 = "Сбор селфи из социальных сетей для анализа актуальных тенденций... Расчёт яркости окружения для определения оптимального угла..."
2300306-16 = "Анализ завершён. Пожалуйста, не двигайтесь. 3, 2, 1..."
2300306-19 = "Ну как? Хорошо получилось, правда?"
2300306-20 = "[s] «Даже лучше, чем фотография из фотостудии...»"
2300306-21 = "Машина видит лучше человеческого глаза. Поэтому снимок получился лучше, чем с обычной камеры."
2300306-22 = "Кроме того, у неё куча других функций. Управление расписанием, будильник, а ещё фитнес-функции вроде помощи с тренировками."
2300306-23 = "Athena-3, активируй режим помощи с тренировками."
2300306-24 = "Режим помощи с тренировками активирован. Измерение физической активности объекта «Омагари Харэ»."
2300306-25 = "Ну что, пробежимся немного для теста?"
2300306-29 = "*бип* Температура тела и частота пульса объекта немного повысились. Анализ эффективности тренировки... Для большего расхода калорий рекомендую увеличить интенсивность."
2300306-30 = "*тяжело дышит* Как видишь, она автоматически анализирует физическое состояние пользователя и может быть личным тренером."
2300306-31 = "Фух... Думаю, хватит. Athena-3, отключи режим тренировки."
2300306-32 = "..."
2300306-33 = "*бип* Невозможно выполнить. Продолжаю режим помощи с тренировками."
2300306-34 = "Хм? Странно. Протокол принятия решений дрона не должен позволять ему отклонять команды человека... Что пошло не так?"
2300306-35 = "Athena-3, аварийная остановка. Запусти самодиагностику системы."
2300306-36 = "*бип* К сожалению, команда не может быть выполнена. Эта программа предназначена для постоянного выбора оптимальных решений."
2300306-37 = "Объект «Омагари Харэ» подвержен риску серьёзных нарушений здоровья из-за недостатка физической активности. Продолжаю тренировку."
2300306-38 = "Если объект не начнёт двигаться в течение тридцати секунд, программа может применить электрические разряды для обеспечения выполнения."
2300306-39 = "Три... два... один..."
2300306-40 = "П-Погоди... Подожди секунду...!"
2300306-42 = ""
2300306-43 = ""
2300306-44 = ""
2300306-45 = "Подтверждён достаточный расход калорий объектом «Омагари Харэ». Завершение режима тренировки..."
2300306-46 = "*тяжело дышит* *тяжело дышит* Наконец-то закончилось..."
2300306-47 = "Athena-3... аварийное отключение. Можешь отдохнуть..."
2300306-48 = "Поняла. Отключаюсь."
2300306-49 = ""
2300306-50 = "*вздох* Сегодняшний тест дрона — полный провал."
2300306-51 = "Не ожидала, что модуль логики поставит выполнение задачи выше команд пользователя и выключения... Похоже, я недооценила силу алгоритма обучения..."
2300306-52 = "Придётся полностью переписать её программу с нуля."
2300306-53 = "...И эту ненужную функцию помощи с тренировками точно надо удалить."
2300306-54 = "[s] «А почему бы не оставить функцию тренировки?»"
2300306-55 = "Ни за что!"
2300306-56 = "Человек должен тренироваться только тогда, когда сам хочет, а не когда его заставляют."
2300306-57 = "Хотя насчёт того, что мне отчаянно не хватает движения, она не ошиблась..."
2300306-58 = "Но всё равно люди не должны жить под контролем машин!"
2300306-60 = "Произнося это, Харэ выглядела решительнее обычного..."
