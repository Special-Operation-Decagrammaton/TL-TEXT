[translation]
1012806-1 = "Пространство Фую"
1012806-2 = "Я отправился в место, о котором говорила Фую..."
1012806-3 = ""
1012806-5 = ""
1012806-6 = "Ученики Вайлдхант всегда создают такое интересное искусство."
1012806-7 = "Фу-фу! Нас ждёт настоящее удовольствие!"
1012806-9 = "Народу было довольно много."
1012806-10 = "И тут я увидел афишу выставки."
1012806-11 = "[ns] «Выставка медиа-арта Вакасы Фую...?»"
1012806-12 = "Всё верно! Сольная выставка."
1012806-13 = ""
1012806-14 = "Это частный выставочный зал, посвящённый полному погружению в МОЙ мир."
1012806-15 = "Я хотела бы лично провести тебя внутрь, если позволишь."
1012806-16 = "[s] «...Менеджер по продажам, сейчас ты звучишь как настоящий художник!»"
1012806-17 = "Хи-хи, правда?"
1012806-18 = "Ну, я всё-таки поступила в Вайлдхант не по чистой случайности, Сенсей!"
1012806-19 = "Так что хотя бы сегодня не воспринимай меня как образцового менеджера по продажам Картеля свободной торговли..."
1012806-20 = "...а воспринимай как художницу. Сможешь, Сенсей?"
1012806-21 = "[s1] «Хм, тогда как мне тебя называть?»\n[s2] «Виртуоз? Продюсер?»"
1012806-24 = "Эм, ну..."
1012806-25 = "...Наверное, просто Фую?"
1012806-26 = "В любом случае! Зайдём внутрь?"
1012806-27 = "Не каждому художник лично проводит экскурсию по собственной выставке, знаешь ли!"
1012806-29 = "В выставочном зале было очень темно."
1012806-30 = "Его освещали только экраны с медиа-артом."
1012806-31 = "Начнём отсюда?"
1012806-32 = "Если представить эту выставку как сборник стихов..."
1012806-33 = "...то эту работу можно считать прологом."
1012806-34 = "[s] «То есть она задаёт основу всему, что мы увидим дальше? Верно?»"
1012806-35 = "Именно!"
1012806-36 = "Поэтому я поставила её у входа. Здесь немного лабиринт, но в любом случае..."
1012806-37 = "...эту работу ты увидишь первой!"
1012806-38 = "[s] «То есть ты продумываешь даже порядок работ?»"
1012806-39 = "Разумеется. Я учитываю расположение, угол, светимость, оттенок, яркость и даже маршрут движения между работами..."
1012806-40 = "Каждый элемент выставки должен нести замысел художника."
1012806-41 = "Ну что, продолжим?"
1012806-42 = ""
1012806-44 = ""
1012806-45 = ""
1012806-46 = ""
1012806-48 = "Мы постепенно прошли по залу, знакомясь с работами Фую."
1012806-49 = ""
1012806-50 = "...И теперь ты, возможно, начинаешь замечать повторяющийся мотив..."
1012806-51 = ""
1012806-54 = ""
1012806-55 = "...О, ты проголодался, Сенсей?"
1012806-56 = "[s] «Разве это не ТВОЙ живот урчал, Фую?»"
1012806-57 = "Фу-фу, видимо, придётся остановиться."
1012806-58 = "Как художница, я не могу проигнорировать громкий и отчаянный зов голода моего VIP-гостя."
1012806-59 = "[s] «Но это был не я...!»"
1012806-60 = "Тссс."
1012806-61 = "Просто иди за мной, хорошо? Сэн... сэй?"
1012806-62 = ""
1012806-64 = ""
1012806-66 = "И Фую провела меня через несколько дверей..."
1012806-67 = ""
1012806-71 = "...пока мы не спрятались за кулисами в уголке выставки."
1012806-72 = "[ns] «Э-Это место...?»"
1012806-75 = "― [log=후유]Мы за экранами.[/log][wa:1490]"
1012806-77 = "― [log=후유]То есть за самими произведениями...[/log][wa:770]"
1012806-80 = "― [log=후유]Место, куда может входить только художник.[/log][wa:10]"
1012806-83 = "― [log=후유]Единственный способ попасть сюда...[/log]"
1012806-85 = "― [log=후유]получить разрешение от меня, художника.[/log][wa:450]"
1012806-88 = "― [log=후유]Так что сейчас, в этом месте...[/log][wa:1350]"
1012806-90 = "― [log=후유]Здесь только ты и... я...[/log][wa:4970]"
1012806-93 = "― [log=후유]А, нет-нет-нет-нет![/log][wa:660]"
1012806-95 = "― [log=후유]Я-Я не это имела в виду...![/log]"
1012806-98 = "― [log=후유]В общем![/log]"
1012806-100 = "― [log=후유]Я приготовила ланч...[/log][wa:40]"
1012806-103 = "[ns] «Ты приготовила мне обед?!»"
1012806-104 = "― [log=후유]Эм, если ты не против...[/log][wa:2420]"
1012806-106 = "― [log=후유]...Не хочешь немного?[/log][wa:2040]"
1012806-109 = "Мы вместе поели приготовленный Фую ланч."
1012806-110 = "Фую не врала. Готовит она замечательно."
