[translation]
102020-1 = "Эпизод 2; Оперативное совещание"
102020-2 = ""
102020-4 = "*тяжело дышит* ... *тяжело дышит*"
102020-5 = "Хех. Я немного перестаралась..."
102020-7 = "Велопарковка школы Абидос"
102020-8 = "Хошино..."
102020-9 = "Но если бы я сдерживалась, меня бы разгромили."
102020-10 = "..."
102020-11 = "Занятно. Не знала, что в этом районе ещё остался такой умелый студент."
102020-12 = "Как тебя зовут, мелкая воришка?"
102020-13 = "...Широко. Сунаоками Широко."
102020-14 = "Хм, ясно. Широко, что ты здесь делаешь?"
102020-15 = "..."
102020-16 = "Пусть это место и выглядит развалинами, но это всё ещё филиал Абидоса... то есть старшая школа Абидос."
102020-17 = "Я раньше не видела такую форму."
102020-18 = "Я тоже. И для зимней формы она слишком тонкая."
102020-20 = "Эй, из какой ты школы, Широко?"
102020-21 = "...Не знаю."
102020-22 = "...?"
102020-23 = "Я просто очнулась здесь. Не помню ничего, кроме своего имени..."
102020-24 = "Ч-Что ты имеешь в виду? Амнезия теперь в моде у молодёжи? Я явно чего-то не понимаю..."
102020-25 = "Т-Ты хочешь сказать, что не помнишь ничего, кроме имени? Ни академию, ни номер телефона? Вообще ничего?"
102020-26 = "*кивает*"
102020-28 = "..."
102020-29 = "..."
102020-30 = "Х-Хошино... Что нам делать?"
102020-31 = "Хм... Вот же головная боль."
102020-33 = "Пойдём внутрь и поговорим, Широко. Здесь не лучшее место для долгой беседы."
102020-34 = "А?! М-Мы берём её с собой?"
102020-36 = "Вот, холодно. Надень это."
102020-39 = "Шарф...?"
102020-40 = "Немного, но пока хоть чуть-чуть поможет."
102020-41 = "Вот. Так лучше?"
102020-42 = "...Ага."
102020-44 = "...Тепло."
102020-45 = ""
102020-47 = "Хошино..."
102020-48 = "Нам нужно найти Широко. С ней наверняка случилось что-то плохое."
102020-49 = "Но ситуация..."
102020-50 = "Я пока не отвечу на вызов Шале. Разберись с ним, пожалуйста, Нономи."
102020-51 = "Ты даже не знаешь, где Широко! Что ты будешь делать одна?!"
102020-52 = "..."
102020-53 = "Широко уже не та, какой была раньше! И всё теперь иначе!"
102020-54 = "Ч-Что ты имеешь в виду? Ничего не изменилось!"
102020-56 = "Тогда ты была одна, а сейчас — нет!"
102020-57 = "...!"
102020-58 = ""
102020-65 = "Вот вы где! Вы ещё что тут делаете?!"
102020-66 = "Хошино... Давай вместе пойдём к Сенсею."
102020-67 = "...Вы..."
102020-68 = "Сенсей сможет помочь."
102020-70 = "...Хошино. Пожалуйста."
102020-71 = "..."
102020-72 = "...Ты права."
102020-73 = "Уверена, мы можем положиться на Сенсея, как всегда."
102020-74 = "Так что... Всё будет хорошо... Правда...? Правда?"
102020-75 = ""
102020-77 = ""
102020-78 = "..."
102020-79 = "..."
102020-80 = ""
102020-82 = ""
102020-83 = "...Да! Я уверена."
102020-87 = "..."
102020-88 = "Студенты идут отовсюду. Скоро они будут здесь..."
102020-89 = "..."
102020-90 = "Ты справишься здесь, в Шале, а не в Генеральном студенческом совете?"
102020-91 = "Башня Санктум уничтожена, а мне как исполняющей обязанности вынесли вотум недоверия."
102020-92 = "Генеральный студенческий совет фактически распался. Даже если я созову остальных руководителей, нет гарантии, что они будут выполнять мои указания..."
102020-93 = "Сейчас Шале — наша единственная надежда."
102020-94 = "Я понимаю, но потом тебе придётся разгребать адские последствия."
102020-96 = "...Я этого и ожидаю."
102020-97 = "Будем переживать об этом, если и когда сумеем разрешить нынешнюю ситуацию."
102020-98 = "Момока, Аюму, я рассчитываю на вас."
102020-99 = "Д-Да! И я тоже рассчитываю на вашу поддержку."
102020-100 = "Уф... Во всей этой ситуации всё неправильно."
102020-101 = "Но раз Рин так сказала, мы пойдём за ней хоть на край Вселенной."
102020-102 = ""
102020-104 = ""
102020-105 = "..."
102020-107 = "А? Ты кто такая?"
102020-109 = "...Ониката Каёко."
102020-110 = "Похоже, я первая. Ну, неважно."
102020-111 = "Исполняющая обязанности, сразу предупреждаю. У меня вообще нет опыта в таких вещах, так что многого не жди, ладно?"
102020-112 = "Тебя сюда вызвал Сенсей из Шале, а не Генеральный студенческий совет."
102020-113 = "...Знаю. Поэтому я и пришла."
102020-114 = ""
102020-116 = ""
102020-121 = "Я здесь! Исполняющая обязанности, вот наш отчёт по анализу явления. Много выяснить не удалось, но..."
102020-122 = "Я Амау Ако, старший администратор Префектурной команды Геенны."
102020-124 = "Юука, Ако."
102020-125 = "Генеральный студенческий совет...? А где Сенсей?"
102020-126 = "Сенсей отправился защищать D.U. Скоро вернётся."
102020-127 = "У Сенсея дел будет по горло."
102020-128 = "Д-Даже Каёко...?!"
102020-129 = "...Ага, знаю."
102020-130 = "Хм..."
102020-131 = ""
102020-133 = ""
102020-135 = "Любопытная компания собралась."
102020-136 = "У-Урава Ханако?"
102020-137 = "Хи-хи. Давно не виделись, Юука."
102020-138 = "Я Окусора Аяне, представитель старшей школы Абидос. Я пришла в Шале по просьбе Сенсея!"
102020-139 = "Аяне..."
102020-140 = "Х-Ха-ха... Даже Ханако здесь. Надеюсь, у тебя всё хорошо. Простите, что без любезностей, но..."
102020-141 = "Я всё прекрасно понимаю. Меня уже ввели в курс вашей ситуации, Аяне."
102020-142 = "Мы сделаем всё, что в наших силах, чтобы найти Широко."
102020-143 = "Да. Спасибо..."
102020-144 = "Ситуация может казаться безнадёжной, но мы не можем в ней увязнуть. Нам остаётся только двигаться вперёд."
102020-145 = "Только что ты напомнила мне одну мою подругу."
102020-146 = "Ты гораздо сильнее меня, Аяне."
102020-147 = "Ч-Что? Н-Нет, вовсе нет?"
102020-148 = "Ты долго сражалась, защищая свою школу. Ты сильная."
102020-149 = "..."
102020-150 = ""
102020-152 = ""
102020-154 = "Хорошо. Сенсей сейчас проводит операцию по обороне от неизвестных сил по всему D.U."
102020-155 = "Они уже почти закончили, так что Сенсей скоро вернётся."
102020-157 = "Хорошо. Встретим Сенсея в конференц-зале."
102020-179 = "Все должны были получить подготовленный нами план операции. Пожалуйста, ознакомьтесь с ним."
102020-180 = "Когда ты успела подготовить столько документов? И всё так подробно..."
102020-181 = "...Действительно. Отличная работа, главный администратор."
102020-182 = "Пока просто Рин, Ханако. Мои полномочия как администратора приостановлены."
102020-183 = "О, поняла..."
102020-184 = "Полномочия исполняющей обязанности приостановлены, Генеральный студенческий совет распался, а башня Санктум лежит в руинах... Действовать может только Шале."
102020-185 = "Ну, по крайней мере это упрощает дело."
102020-186 = "Генеральный студенческий совет слишком сильно зависит от башни Санктум."
102020-187 = "...Ноа? Я отправляю отчёт Генерального студенческого совета. Можешь взглянуть? И..."
102020-188 = "Я перепроверю, есть ли расхождения с данными, полученными Комитетом по противодействию закрытию школы!"
102020-196 = "Согласно анализу, башни нужно уничтожить в течение двух недель."
102020-197 = "..."
102020-198 = "Отныне будем называть шесть неопознанных башен, появившихся в Кивотосе, Ложными Санктумами."
102020-199 = "То есть что-то вроде поддельных башен Санктум. Это объясняет красное небо, бури и высокий уровень энергии."
102020-201 = "Тогда план — уничтожить их в течение следующих двух недель."
102020-202 = "Верно."
102020-204 = "Сэя... точнее, Чаепитие и Сестринство совместно изучили интересные сведения в древних текстах из старой библиотеки."
102020-205 = "Раньше подобное сотрудничество показалось бы смешной фантазией. Хотя без помощи Сенсея, скорее всего, так бы и осталось."
102020-206 = ""
102020-207 = "Это не пророчество, а мой собственный опыт, поэтому я могу сказать с полной уверенностью."
102020-208 = "Это явление означает, что Хрома вторгается в Академгородок."
102020-209 = ""
102020-210 = "Да. Понятие Хромы также упоминается в древних текстах, хранящихся у Сестринства."
102020-211 = "Проще говоря... это свет, сводящий людей с ума."
102020-212 = ""
102020-213 = "Хрома... сводит людей с ума...?"
102020-214 = "Верно, Юука."
102020-215 = "Ноа?"
102020-216 = "Инженерный отдел анализирует образцы данных Санктума. Они обнаружили сигнал, который действительно способен воздействовать на человеческий мозг."
102020-218 = "Воздействие этого света, похоже, изменяет личность и работу сознания. Это своего рода атака на разум..."
102020-219 = "Но слишком многое всё ещё невозможно объяснить. Нам нужно больше данных."
102020-220 = "Верно. С нашим оборудованием достоверность даже не достигает десяти процентов. Пока мы не можем выйти за рамки гипотезы."
102020-221 = "Пока Веритас пытается добыть для нас больше данных, ясно одно: эта технология превосходит всё, что мы когда-либо видели в Кивотосе."
102020-222 = "Именно поэтому нужно рассматривать всё с разных точек зрения! Я принесла книги из старой библиотеки Тринити! Куда их поставить?"
102020-223 = "О! Может, вырезать страницы и отсканировать их? Сделаем электронную книгу, чтобы её было проще носить с собой и просматривать...!"
102020-224 = "Если ты это сделаешь, председатель Библиотечного комитета Тринити тебя реально убьёт..."
102020-226 = "Учтите, это лишь гипотеза, но я полагаю, что высокая энергия, заключённая в башнях..."
102020-227 = "При таком темпе она достигнет критической точки примерно через триста часов."
102020-228 = "Если ничего не делать, пройдя в общей сложности четыре мутации, энергия в итоге распространится по всему Кивотосу."
102020-229 = "Мне понадобится ещё кофеин..."
102020-230 = "Заказать ещё Frenzy MAX? Ещё десять коробок?"
102020-231 = ""
102020-232 = "Всё в этом явлении совпадает с вещим сном, который мы видели, Сенсей."
102020-233 = "Из кроваво-красного неба возникает огромная башня..."
102020-234 = "Она разъедает весь мир, окутывая всё своей зловещей силой. Вместе с ней раздаётся ужасный визг."
102020-235 = ""
102020-236 = "У вас было апокалиптическое пророчество...?"
102020-237 = "...Ну, звучит как что-то, что вполне могло случиться в Тринити."
102020-238 = "..."
102020-239 = "Около трёхсот часов... Значит, через две недели Хрома распространится по всему Кивотосу..."
102020-240 = ""
102020-241 = "А обломки нашего истерзанного мира взметнутся бурей и рассыплются на части. И в конце на нас прольётся чёрный свет..."
102020-242 = "И Кивотос падёт."
102020-243 = ""
102020-244 = "От нас и нашего дома не останется и следа."
102020-246 = "[ns] «Для начала нужно найти способ вернуть в норму тех, кто подвергся воздействию.»"
102020-247 = ""
102020-248 = "..."
102020-249 = ""
102020-251 = ""
102020-253 = "Именно. Я согласна."
102020-254 = "У меня мало ответов... но тот студент, который спас меня..."
102020-255 = "Великая пророчица Хяккияко, Кузуха. Возможно, у неё есть нужные нам ответы."
102020-256 = "Ня? Кузуха?"
102020-257 = "..."
102020-258 = ""
102020-259 = "Не ожидала услышать это имя здесь."
102020-260 = "Хм... Ну, общий смысл я поняла. Кахо говорила, что Генеральный студенческий совет запрашивал сведения о Кузухе... Ясно..."
102020-261 = "Нам придётся позже обсудить это подробнее, Сенсей. ♪"
102020-262 = "Всё немного сложно, но... раз это важно, я постараюсь что-нибудь придумать."
102020-263 = ""
102020-264 = "[ns] «Я рассчитываю на тебя, Ния.»"
102020-265 = "Ня-ха-ха. Разумеется."
102020-266 = ""
102020-268 = ""
102020-269 = "Итак, если мы не разберёмся с Ложными Санктумами, через две недели энергия достигнет критической точки."
102020-270 = "Если это произойдёт..."
102020-271 = "Это будет означать уничтожение нашего мира таким, каким мы его знаем."
102020-273 = "Чтобы остановить это, мы должны уничтожить Ложные Санктумы..."
102020-274 = "Цель вроде бы достаточно понятная."
102020-275 = "Да... но сделать это за две недели..."
102020-276 = "Всего есть шесть Ложных Санктумов."
102020-277 = "Пустыня Абидос, парк развлечений возле Р.У., закрытая зона на окраине Миллениума, граница между Тринити и Геенной, тот новый город рядом с Миллениумом... и центр Р.У."
102020-278 = "Энергия Санктума в центре D.U. самая высокая, поэтому сначала следует уничтожить остальные пять, а затем заняться центральным."
102020-279 = "Не думаю, что всё так просто, как вы это представляете."
102020-281 = "Химари...?!"
102020-282 = "Хи-хи-хи. Да. Это я, хрупкая гениальная хакерша Миллениума."
102020-283 = "Гениальная...?"
102020-284 = "Хрупкая...?"
102020-286 = "Благодаря данным, оставленным Старшей Сестрой, нам удалось приблизиться к Ложному Санктуму. Там..."
102020-287 = "Мы увидели охраняющих его врагов. И очень сильных. Обычной силы против них недостаточно."
102020-288 = "Токи, данных достаточно. Не перенапрягайся. Отступай."
102020-289 = ""
102020-290 = "Ух...! Но..."
102020-291 = ""
102020-293 = ""
102020-297 = ""
102020-298 = "А вот теперь начинается самое интересное."
102020-299 = "Существо, охраняющее Санктум, воплощает в себе все странные, загадочные и необъяснимые явления, которые до сих пор происходили в Кивотосе."
102020-300 = "Пророки Декаграмматона, феномен Мимесиса, появившийся в Тринити, и Divi:Sion, недавно обнаруженный в руинах Миллениума..."
102020-301 = "Да, видите ли..."
102020-303 = "Пустыня Абидос"
102020-305 = "Третий пророк Декаграмматона — Бина."
102020-307 = "Заброшенный парк развлечений возле D.U."
102020-310 = "Аниматроники Мимесиса из Слампии — Широ и Куро."
102020-312 = "Пограничная зона между Тринити и Геенной"
102020-314 = "Иероним из Communio Sanctorum."
102020-316 = "Закрытая зона на окраине Миллениума"
102020-318 = "Четвёртый пророк Декаграмматона — Хесед."
102020-320 = "Новый город возле Миллениума"
102020-324 = "И восьмой пророк — Ход..."
102020-326 = "[ns] «Хм... Понятно.»"
102020-327 = "...Похоже, Сенсей начинает понимать."
102020-328 = "Именно. Просто уничтожить Ложные Санктумы недостаточно. Сначала нужно одолеть пророков и стражей каждого Санктума."
102020-330 = "Верно. Логистика будет сложной, но в сущности наша задача — победить стражей Санктумов, а затем уничтожить каждый из шести Ложных Санктумов."
102020-331 = "Нужно немедленно начинать подготовку. Потребуется крупномасштабная совместная операция, чтобы одновременно атаковать все шесть целей."
102020-332 = "Ага, и на всё это у нас две недели."
102020-334 = "Ладно, ладно. Знаю, вы уже рвётесь в бой, но сначала нам нужно привести в порядок ещё кое-что."
102020-335 = "Самое важное — обеспечить безопасность жителей и студентов. Нужно защищать их от врагов, одновременно эвакуируя в безопасные убежища."
102020-336 = "Геенна, Хяккияко, Красная Зима, Шаньхайцзин, Тринити, D.U... Сообщения о нападениях приходят отовсюду, даже из районов без Ложных Санктумов. Значит, стражи — не единственные наши враги."
102020-337 = "За Тринити можете не беспокоиться."
102020-338 = ""
102020-339 = "Мы сами защитим свой район. Это наш долг."
102020-340 = "Верно, Мика, Сэя?"
102020-341 = "Ха-ха-ха. Ага, этим Чаепитие и занимается! ☆"
102020-342 = "И я мизинчиком обещаю на этот раз делать ровно то, что скажут Наги и Сэя, так что за Тринити можете быть спокойны."
102020-343 = "Хотя... я бы хотела, чтобы Сенсей помогал нам. Хи-хи."
102020-344 = "Но я понимаю, что у Сенсея другие обязанности, так что оставьте это нам, Сенсей."
102020-345 = "Да, мы будем в безопасности. Будущее, которое я видела, мрачно..."
102020-346 = "Но это не повод не сражаться изо всех сил. Отныне у нас есть только один путь — вперёд."
102020-347 = ""
102020-348 = "Разумеется, под нашим надзором Геенне ничто не угрожает."
102020-349 = "Префектурная команда займётся безопасной эвакуацией и защитой наших студентов и жителей."
102020-351 = "Мы тоже будем там."
102020-352 = "Клуб неотложной медицинской помощи...!"
102020-353 = "С нашей поддержкой Префектурной команды глава префектов сможет заниматься тем, что умеет лучше всего, не беспокоясь о тылах."
102020-354 = "Сена..."
102020-355 = "Большое спасибо."
102020-357 = "Но взамен мы хотим, чтобы Чинацу вернулась в Клуб неотложной медицинской помощи."
102020-358 = "Ч-Ч-Что? Но я..."
102020-359 = "Это была шутка."
102020-360 = ""
102020-361 = "Да, поняла. Мы тоже подготовимся."
102020-362 = "Наши товарищи из Красная Зима не пострадают!"
102020-363 = ""
102020-364 = "Как и всегда, мы защитим район Хяккияко."
102020-365 = "Да. Я тоже, Сенсей."
102020-366 = "Клуб внутренней дисциплины к вашим услугам!"
102020-367 = ""
102020-368 = "Мы займёмся эвакуацией и помощью!"
102020-369 = "Да! По совпадению Босс недавно арендовала здание для нового дела, так что мы можем использовать его как убежище!"
102020-370 = "Прямо как большой фестиваль!"
102020-371 = "...Ой. Наверное, сейчас это прозвучало неуместно."
102020-372 = "Нет, ты всё правильно поняла! Наша работа — поддерживать и организовывать большую толпу, совсем как на фестивале!"
102020-373 = ""
102020-374 = "Шаньхайцзин можете оставить нам!"
102020-375 = "Да, мы ни за что не позволим причинить вред детям из Сада цветущей сливы или нашим жителям..."
102020-376 = "Д-Да...! Я всех защищу!"
102020-377 = ""
102020-378 = "Променад Чёрной Черепахи обеспечит всех едой и убежищем."
102020-379 = "Генрюмон тоже что-нибудь сделает. Кисаки не станет сидеть сложа руки в такой ситуации. Ха-ха-ха!"
102020-380 = ""
102020-381 = "Позвольте нам заняться эвакуацией D.U.!"
102020-382 = "В смысле, это вроде как наша работа."
102020-383 = "Да. Мы собрали все доступные силы."
102020-384 = ""
102020-385 = "С эвакуацией Миллениума проблем не ожидается."
102020-386 = "Старшая Сестра одержимо готовилась к любой возможной катастрофе в любой момент."
102020-387 = "Её навязчивость токсична до мозга костей, но в такие моменты она всё-таки оказывается полезной."
102020-388 = "Мы сможем укрыться в многочисленных бункерах, которые она спрятала по всему Миллениуму."
102020-389 = ""
102020-390 = "...Тогда план у нас есть."
102020-391 = "Наша цель — уничтожить шесть Ложных Санктумов, появившихся в Кивотосе."
102020-392 = "Одновременно с этим мы проводим эвакуацию и оборону каждого района."
102020-393 = "Ключевой фигурой для успеха этих операций станет [USERNAME] Сенсей из Шале."
102020-394 = "Сенсей должен контролировать оборону и эвакуацию каждого района, одновременно командуя атакой на Санктумы. Вы справитесь?"
102020-395 = "[s] «Да. Это не проблема.»"
102020-396 = "Ну и заняты же вы будете, Сенсей."
102020-397 = "Т-Тогда можете все, пожалуйста, синхронизировать часы по стандартному времени Кивотоса?"
102020-399 = "До окончательной критической точки Санктумов осталось четырнадцать дней, двадцать три часа, пятьдесят девять минут и пятьдесят девять секунд..."
102020-400 = ""
102020-401 = "Это всё время, что у нас осталось."
102020-402 = "У-Удачи всем. Нам нужно успеть всё — от разработки стратегии и подготовки до самой атаки — за это время..."
102020-403 = "Отличная работа, все. Ну что же..."
102020-405 = "Начнём подготовку."
102020-408 = "Сенсей, Сенсей! У вас есть минутка?"
102020-409 = "Нам нужно обсудить вашу предыдущую просьбу."
102020-410 = "[s] «Ния, Кахо.»"
102020-411 = "Нам также понадобится Сэя из Тринити."
102020-412 = ""
102020-413 = "Да, спасибо. У вас есть какие-нибудь зацепки о местонахождении Кузухи?"
102020-414 = "Ня-ха-ха! Немного неловко говорить об этом при всех..."
102020-415 = "Наверное, неудивительно, что люди хотят её найти."
102020-417 = "Как бы это сказать... Студенты по имени Кузуха в Хяккияко не существует."
102020-418 = "[s] «Не существует...?»"
102020-420 = "Я так и думала..."
102020-421 = "По сути, в нашем реестре студентов никогда не было официальной записи о ней."
102020-422 = "Кузуха, Великая пророчица... Я не могу наверняка сказать, существует она или нет..."
102020-423 = "...Что ты имеешь в виду?"
102020-424 = "Ну... Кузуха — это существо, которое, по словам лишь нескольких студентов Хяккияко, они встречали лично... Её существование скорее относится к легендам."
102020-425 = "...!"
102020-426 = "Представляете, насколько сюрреалистично было услышать её имя от постороннего! Ня-ха-ха!"
102020-427 = ""
102020-429 = ""
102020-430 = "Есть одна известная запись, в которой упоминается Кузуха."
102020-431 = "Как факт она ненадёжна, потому что о ней лишь вскользь говорится в старом сборнике сказаний и легенд, но..."
102020-432 = "Любая информация может помочь. Что там сказано?"
102020-433 = "...В прошлом, когда Хяккияко ещё не была альянсом, мы были разделены на множество сил, и войны в нашем регионе не прекращались."
102020-434 = "Тогда Великая пророчица Кузуха организовала Хяккарёран и поручила ей выступать посредником в конфликтах Хяккияко."
102020-435 = "Хяккарёран...?"
102020-436 = "А... Ты про организацию, созданную для урегулирования конфликтов внутри альянса, Совет урегулирования Хяккарёран. Что-то вроде посредников."
102020-437 = "Ого, ну конечно госпожа из Тринити об этом знала!"
102020-438 = "Именно. Хяккарёран — это группа посредников, или, можно сказать, хранителей равновесия. ...Хотя их история во многом окутана тайной."
102020-439 = "Если подумать, все студенты, утверждавшие, что встречали Кузуху... были председателями Хяккарёран."
102020-440 = "Даже сейчас ходят слухи, что только председатель Хяккарёран имеет право встретиться с Кузухой и получать от неё приказы..."
102020-441 = "Только Хяккарёран по-настоящему верит в существование Кузухи."
102020-442 = "Возможно, лишь им дано право встречаться с ней?"
102020-443 = "Как ни крути, вся эта история кажется мне подозрительной."
102020-444 = "До сих пор я списывала это на какую-то традицию Хяккарёран."
102020-445 = "...Она была чем-то вроде доброго воображаемого друга?"
102020-446 = "Ну, узнать правду всё равно никак. И до сих пор это никогда не было проблемой."
102020-447 = ""
102020-449 = ""
102020-450 = "Если возможно, я хотела бы встретиться с председателем Хяккарёран."
102020-451 = "Я не против, но из-за... недавних событий это может оказаться непросто."
102020-452 = "Хяккарёран вскоре могут распустить."
102020-453 = "...!"
102020-454 = "А? Нет-нет. Официально ещё ничего не решено... кажется?"
102020-455 = "Председатель и заместитель председателя недавно оборвали все контакты и словно сквозь землю провалились."
102020-456 = "Деятельность клуба уже некоторое время приостановлена, а по слухам, оставшиеся участницы теряют боевой дух и уходят."
102020-457 = "Мы сделали всё возможное, чтобы расследовать их исчезновение, но не нашли ни единой зацепки."
102020-458 = "Хяккарёран — невероятно скрытная группа, поэтому разобраться в её внутренних делах очень сложно. Прошу прощения."
102020-459 = "В общем, всё именно так, как сказала Кахо. Ситуацию держали в секрете, потому что никто не знает, какой хаос устроит Моурё, если узнает о состоянии Хяккарёран."
102020-460 = "...Пока удавалось держать. Но лишь вопрос времени, когда студенты и весь район узнают правду, Ния."
102020-461 = "Ну, не могу сказать, что ты неправа..."
102020-462 = "Значит, сейчас ты совсем не видишь способа найти Кузуху?"
102020-463 = "К сожалению, нет..."
102020-464 = "...Не то чтобы совсем никакого способа не было."
102020-465 = "Ния...?"
102020-466 = "Посмотрим... В Кивотосе появилось ужасающее явление под названием Хрома... Сам Сенсей из Шале хочет, чтобы мы в Хяккияко нашли способ вернуть в норму поражённых ею студентов."
102020-467 = "Дело чрезвычайной важности, так что мы обязаны помочь."
102020-468 = "Я не говорю, что не хочу помочь, но как...?"
102020-469 = "Кхм, видишь ли..."
102020-470 = "Ну, у меня есть хорошая идея. ♪ Просто дай мне немного времени. Хи-хи."
102020-472 = "Следующий эпизод; Планирование операции 1"
