[translation]
10030020-1 = "Эпизод 2;Разбиваем палатку"
10030020-5 = ""
10030020-6 = "Мы прибыли. Это Альпы Хигаси, горы на восточной границе Миллениума."
10030020-7 = "Разобьём лагерь здесь, у подножия горы Хигасидакэ, переночуем, а рано утром поднимемся на гору, чтобы встретить рассвет."
10030020-8 = "До тех пор у меня ничего не запланировано, так что после установки лагеря можете осмотреть окрестности и провести день как хотите."
10030020-9 = "[s1] «Не ожидал увидеть такую красивую природу рядом с Миллениумом...»\n[s2] «Я думал, Миллениум почти полностью урбанизирован.»"
10030020-12 = "Центр Миллениума, может, и построен с использованием передовых технологий, но окраины гораздо разнообразнее."
10030020-13 = "Есть немало мест, которых наша технология почти не коснулась, например руины Миллениума."
10030020-14 = "Не ими мы обычно славимся... но у нас есть и отличные места для лагеря, и туристические тропы."
10030020-15 = ""
10030020-18 = "...Мне нравится слушать, как ветер шепчет в соснах."
10030020-19 = "Ну как вы себя чувствуете? Разве разум и тело не освежились после побега из города и глотка свежего воздуха—"
10030020-20 = ""
10030020-22 = ""
10030020-23 = ""
10030020-25 = ""
10030020-27 = ""
10030020-28 = "...Или нет."
10030020-29 = "Я пыталась морально подготовиться, но тут правда вообще нет сигнала..."
10030020-30 = "Ближайший магазин больше чем в тридцати километрах... Г-Где мне брать энергетики?"
10030020-31 = "Кажется, я уже потеряла половину сил, просто добираясь сюда..."
10030020-32 = "Слишком рано ныть. Мы ещё даже не начали поход."
10030020-33 = "Маки, можешь достать из машины красную сумку?"
10030020-34 = ""
10030020-37 = ""
10030020-38 = "Красную сумку... Эту?"
10030020-39 = ""
10030020-41 = ""
10030020-42 = ""
10030020-43 = ""
10030020-44 = "Уф, тяжёлая... Что там вообще? Стальные трубы?"
10030020-45 = "Это дуги для нашей общей палатки. Нам нужно собрать палатку, в которой будем спать."
10030020-46 = "Забери и все сумки, которые лежали за ней. Там всё необходимое."
10030020-47 = "Почему палатка такая тяжёлая?"
10030020-48 = "Почему я должна тратить остатки своей энергии на установку лагеря сразу после приезда..."
10030020-49 = "Собирать палатку и спать на улице, когда у нас есть тёплая и удобная клубная комната... Как нелогично."
10030020-50 = "Ну, если хотите, можете спать под открытым небом."
10030020-51 = "Но в это время года прохладно. Без чего-то тёплого ночь будет долгой и холодной... Вас это устраивает?"
10030020-52 = ""
10030020-54 = ""
10030020-56 = ""
10030020-57 = "Угх…"
10030020-58 = "Ничего не поделаешь, раз так говорит вице-президент..."
10030020-59 = "Эм... А нет способа попроще?"
10030020-60 = "Я видела в интернете рекламу палатки, которая сама автоматически раскладывается..."
10030020-62 = "Ты имеешь в виду самораскладывающуюся палатку. Их часто выбирают новички, потому что их легко устанавливать..."
10030020-63 = "Но поскольку дуги и ткань у них объединены, даже в сложенном виде они занимают много места, поэтому их неудобно хранить. К тому же из-за низкого потолка они плохо подходят для больших многоместных палаток."
10030020-64 = ""
10030020-66 = ""
10030020-67 = ""
10030020-68 = "И обычно их делают из тонкой ткани, поэтому они плохо переносят дождь и холод. Так что зимой самораскладывающаяся палатка — далеко не лучший вариант."
10030020-69 = "Чтобы компенсировать это, пришлось бы добавлять тент или строить какое-то укрытие. В итоге проще поставить обычную палатку."
10030020-70 = "[s3] «Чихиро, похоже, настоящий знаток походов.»\n[s4] «Ты часто ходила с палаткой?»"
10030020-73 = "Ну, не то чтобы я часто ездила в кемпинги или что-то подобное..."
10030020-74 = "Но из-за работы по безопасности мне часто приходится не спать всю ночь. Я заинтересовалась походным снаряжением, когда искала портативные спальные мешки..."
10030020-75 = "Иногда я ставлю тент для уединения и загораю возле академии, когда между работой появляется свободное время."
10030020-77 = "Загорать на улице — это прямо как..."
10030020-78 = "Хобби бабушки..."
10030020-79 = ""
10030020-82 = ""
10030020-84 = ""
10030020-85 = "...И-Или внучки! Ха, ха-ха..."
10030020-87 = "...В любом случае, нужно поставить палатку до заката, так что все собирайтесь здесь."
10030020-88 = "Вместе справимся быстро. Так что выше нос, закончим в два счёта."
10030020-89 = "Ладно, ладно..."
10030020-93 = "Чихиро, это передняя сторона палатки?"
10030020-94 = "Да. Расстелите подстилку фольгой вниз. Так она не даст скапливаться влаге."
10030020-95 = "Но так она выглядит гораздо красивее..."
10030020-96 = "Это не декоративная простыня."
10030020-100 = "В-Вице-президент... Вы уверены, что эта дуга не сломается? Я правда могу так сильно её сгибать?"
10030020-101 = "Всё нормально. Она рассчитана на гораздо большую нагрузку, так что тяни сильнее."
10030020-102 = "Но даже если я попробую согнуть её сильнее... Сил уже нет..."
10030020-106 = ""
10030020-107 = "О-Ой, коврик улетает!"
10030020-108 = "П-Погодите! Если этот колышек вырвет, кто-нибудь может пострадать—"
10030020-109 = ""
10030020-111 = ""
10030020-112 = "Я прижму эту сторону, а ты закрепи её!"
10030020-124 = "И наконец, если привязать шнур, который удерживает тент..."
10030020-125 = ""
10030020-127 = ""
10030020-128 = ""
10030020-129 = "Это последний шаг. Отличная работа, все."
10030020-130 = ""
10030020-132 = ""
10030020-134 = "Я вымоталась..."
10030020-135 = "Установка палатки высосала из меня все силы..."
10030020-137 = "До ужина у нас ничего не запланировано, так что можете отдыхать."
10030020-138 = "Даже если ты говоришь, что можно отдыхать..."
10030020-139 = "Как нам расслабиться без интернета и какой-либо электроники?"
10030020-140 = "Я не могу играть, не могу сидеть в интернете — тут даже дивана нет, чтобы развалиться..."
10030020-141 = "...Вы правда не представляете себе никаких способов отдыхать, кроме как валяться и играть в видеоигры?"
10030020-142 = "Это шанс научиться отдыхать, не подключаясь ни к чему."
10030020-143 = "Прогуляйтесь и полюбуйтесь природой вокруг. Удивитесь, как быстро пролетит время."
10030020-144 = ""
10030020-146 = ""
10030020-148 = ""
10030020-149 = "Уф... Ну и шутка..."
10030020-150 = "Думаете, с вершины того холма можно поймать сигнал?"
10030020-151 = "Возможно, выше удастся подключиться к мобильной сети. Давайте посмотрим."
10030020-152 = ""
10030020-154 = ""
10030020-155 = ""
10030020-156 = "Ч-Чихиро, мы пойдём прогуляемся!"
10030020-158 = "Хорошо, но не сходите с тропы!"
10030020-159 = ""
10030020-162 = ""
10030020-163 = ""
10030020-164 = ""
10030020-165 = ""
10030020-167 = "Ну, раз лагерь уже готов... Сенсей, чем будете заниматься до ужина?"
10030020-168 = "[s5] «Мне нужно наверстать немного работы...»\n[s6] «Я распечатал несколько отчётов, чтобы почитать!»"
10030020-171 = "Категорически нет. Сенсей, вам сегодня тоже запрещено заниматься своей обычной работой."
10030020-172 = "[s] «...Почему?»"
10030020-173 = "Весь смысл этого похода — вырваться из наших нездоровых привычек и освежиться в новой обстановке."
10030020-174 = "Сегодня последний день года. Хотя бы сегодня отложите работу и переключитесь на что-нибудь другое."
10030020-175 = ""
10030020-177 = ""
10030020-178 = ""
10030020-180 = ""
10030020-181 = "Если вам нужно чем-то занять время, могу одолжить одну из книг, которые взяла с собой."
10030020-182 = "[s7] «...„Оружие, обаяние и рвение“, книга по популярной антропологии?»\n[s8] «„Душевой брокер“, биография печально известного разработчика бань?»"
10030020-185 = "На такие книги трудно сосредоточиться, когда специально выделяешь на них время, верно?"
10030020-186 = "Но даже сухая книга может увлечь, если убрать внешние отвлекающие факторы — например, в походе."
10030020-187 = ""
10030020-193 = ""
10030020-194 = "Я буду читать вон там, так что зовите, если что-нибудь понадобится."
10030020-196 = "Мы с Чихиро сели в тени и мирно провели несколько часов за чтением."
