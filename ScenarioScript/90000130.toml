[translation]
90000130-1 = "Эпизод 14;Сигнал"
90000130-2 = "Комната Специальных Операций"
90000130-4 = ""
90000130-5 = "Добро пожаловать, Сенсей."
90000130-6 = "Прошу прощения за внезапный вызов."
90000130-7 = "[s] «Это срочно? Что случилось?»"
90000130-8 = "Для начала, пожалуйста, не сердитесь."
90000130-9 = "[s] «...А?»"
90000130-10 = "Сразу уточню: вызывала Вас не я."
90000130-11 = ""
90000130-13 = ""
90000130-15 = ""
90000130-16 = ""
90000130-17 = ""
90000130-19 = "Протокол Экстренного Реагирования работает штатно."
90000130-20 = "[s] «ЧЕГО?!»"
90000130-21 = "Скорость, с которой Сенсей способен отреагировать на чрезвычайную ситуацию, крайне важна для успеха задания. Это необходимо было проверить."
90000130-22 = ""
90000130-25 = "[ns] «...Токи?»"
90000130-26 = "Да. Это Асума Токи. Полагаю, в представлениях нет нужды. Я делаю такой вывод, поскольку между нами уже сложились отношения. Довольно близкие, должна подметить."
90000130-27 = "Благодарю, что подтвердили отсутствие проблем в работе Протокола Экстренного Реагирования."
90000130-28 = "[s] «То есть... Ты хочешь сказать...»"
90000130-29 = "Верно. Всё в порядке. В Миллениуме царит мир и спокойствие."
90000130-30 = "В отличие от меня. Я не спокойна. Вместо этого я наготове. C&C продолжает выполнять задания без меня, а моя работа с Департаментом Разработки Игр окончена."
90000130-31 = "Есть ли слово сильнее, чем \"скучно\"? Потому что мне уже больше чем просто скучно."
90000130-32 = ""
90000130-34 = ""
90000130-35 = "[ns] «То есть ты нажала аварийную кнопку... от скуки?»"
90000130-36 = ""
90000130-37 = "Пис-пис."
90000130-38 = "Пожалуйста, не говори это с такой гордостью. В подобных ситуациях люди могут счесть тебя грубой."
90000130-39 = "Понятно. Социальные взаимодействия для меня по-прежнему загадка. Но это неважно. Сенсей, давайте поиграем. Мне скучно."
90000130-40 = "Не думаю, что ты меня вообще слушала."
90000130-41 = "[s1] «Токи в последнее время становится всё самостоятельнее...»\n[s2] «А ты стала такой ответственной, Эйми!»"
90000130-44 = ""
90000130-46 = ""
90000130-49 = "Ну и ну. Неужели я проглядела приглашение на вечеринку?"
90000130-50 = "Президент."
90000130-51 = "Здравствуйте, Президент Химари."
90000130-52 = "Вся команда в сборе. Что-то случилось?"
90000130-53 = "Ничего не случилось."
90000130-54 = ""
90000130-56 = ""
90000130-57 = ""
90000130-58 = "Совершенно ничего."
90000130-59 = ""
90000130-61 = ""
90000130-62 = "Ох. А это что?"
90000130-63 = "Аварийный сигнал. Токи?"
90000130-64 = "Это то, что люди называют «клеветой». Без веской причины я бы даже не посмотрела в сторону аварийной сигнализации."
90000130-65 = "...Об этом мы ещё поговорим позже."
90000130-68 = ""
90000130-69 = ""
90000130-70 = ""
90000130-71 = "Президент. Этот сигнал..."
90000130-72 = ""
90000130-74 = ""
90000130-76 = ""
90000130-77 = ""
90000130-78 = "Ты совершенно права, Эйми. Эти показания одновременно знакомые и тревожные."
90000130-79 = "Какие показания?"
90000130-80 = "Они указывают на хорошо знакомый нам сигнал. Это неожиданно."
90000130-81 = "Я всё ещё не понимаю. Пожалуйста, объясните, что это за сигнал."
90000130-82 = "Этот сигнал принадлежит Декаграмматону, единственному и неповторимому."
90000130-83 = ""
90000130-85 = ""
90000130-86 = ""
90000130-87 = "Как это возможно? По словам Эйми, его основное тело находится глубоко под водой в Районе Затопленных Руин."
90000130-88 = "И Эйми права. Почти невозможно представить, что этот дряхлый торговый автомат пережил взрыв и последующее давление воды."
90000130-89 = "И всё же вот мы здесь."
90000130-90 = "Я вычислила координаты источника сигнала, Президент."
90000130-91 = "Они ведут нас к... Ледниковому Морю. Как можно догадаться из названия, там очень холодно."
90000130-92 = "Настолько холодно, что там не способна выжить никакая цивилизация. Зачем Декаграмматону находиться там, где нет технологий?"
90000130-93 = "Позвольте мне."
90000130-94 = ""
90000130-96 = ""
90000130-97 = ""
90000130-98 = "Возможно, вы этого не заметили, но такого гения, как я, не обмануть. Это не сигнал Декаграмматона."
90000130-99 = "Он похож, но, судя по всему... Это его имитация."
90000130-100 = "Кто мог это сделать?"
90000130-101 = "Может, ещё один пророк?"
90000130-102 = "Если считать Хода, Отряд Исследования Сверхъестественного обнаружил уже четырёх пророков... Местонахождение оставшихся шестерых неизвестно."
90000130-103 = "Звучит правдоподобно. Но нельзя исключать и вариант, что это совершенно новый враг, который пытается замаскироваться под Декаграмматона."
90000130-104 = "Придётся самим отправиться на место и всё разузнать."
90000130-105 = "Я пока не знаю, что это такое, но в одном могу вас заверить. Что бы это ни было..."
90000130-106 = ""
90000130-108 = ""
90000130-109 = ""
90000130-110 = "..."
90000130-111 = ""
90000130-115 = "Оно нас зовёт."
90000130-117 = "Следующий эпизод;Ледниковое Море 1"
