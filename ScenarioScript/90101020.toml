[translation]
90101020-1 = "Episódio 2;Salsicha de Peixe com Sabor de Caranguejo"
90101020-2 = "Subsolo de Schale · QG de Operações do Esquadrão FOX"
90101020-6 = ""
90101020-7 = "FOX2 e FOX3 retornando à base."
90101020-8 = "Chegamos~"
90101020-9 = ""
90101020-11 = ""
90101020-12 = ""
90101020-13 = "Opa, bom trabalho."
90101020-14 = "Demoraram um bocado, hein? Rolou alguma coisa?"
90101020-15 = "Deu ruim no arquivo morto da Valkyrie?"
90101020-16 = "Hum... a infiltração em si correu sem problemas."
90101020-17 = "Estávamos com os distintivos do Departamento de Segurança e carteirinhas de aluna falsificadas perfeitas."
90101020-18 = "O problema foi na volta, quando fomos abordadas por uma aluna do Departamento de Segurança Pública."
90101020-19 = "Ela disse que nunca tinha visto nossos rostos no departamento de patrulha... Uma xereta de marca maior, isso sim."
90101020-20 = "Eita... Não me diga que rodaram?!"
90101020-21 = "Não. A Niko conseguiu despistar a garota puxando assunto sobre donuts... mas..."
90101020-22 = "De conversa em conversa, acabamos tendo que ir juntas até a confeitaria comprar donuts de edição limitada..."
90101020-23 = "Por isso atrasamos para voltar ao QG. Mil desculpas."
90101020-24 = "Relaxa, nada grave. Bom descanso aí."
90101020-25 = "Ué, cadê a Yukino?"
90101020-26 = "Lá com a Presidente do Conselho Estudantil Federal. #nAinda não voltou."
90101020-27 = "Avisou que ia jantar por lá mesmo antes de descer."
90101020-28 = "Então a Otogi ainda não jantou, né?"
90101020-29 = "Deve estar varada de fome, vou aprontar alguma coisa rapidinho."
90101020-30 = "Ah, precisa não. Já fiz meu lanchinho."
90101020-31 = "Isso aí na sua mão..."
90101020-32 = "Não é a \"Salsicha de Peixe Sabor Caranguejo\" da Hamidashi Foods? #nVocê é viciada nisso, né?"
90101020-33 = "Não é vício, é pura praticidade."
90101020-34 = "Enche o bucho, dura um tempão sem estragar..."
90101020-35 = "E além do mais é facinho de comer escondida♪ #nAtiradora de elite precisa manter a camuflagem até na hora da boia, então quebra um galhão."
90101020-36 = "Bom, sob esse ponto de vista até faz sentido... eu acho?"
90101020-37 = "Mas praticidade não é tudo. Você tá em fase de crescimento, precisa de refeição de verdade balanceada."
90101020-38 = "Vou preparar algo nutritivo, espera um pouquinho."
90101020-39 = "Tá boooom."
90101020-40 = "Ei, mas isso aí não custa os olhos da cara? #nSe tem carne de caranguejo..."
90101020-41 = "Não vai me dizer que você tá economizando na munição pra gastar com petisco, né...?"
90101020-42 = "Que nada, é baratíssimo. Não dá nem 100 ienes a unidade."
90101020-43 = "Hã? Uma lata de carne de caranguejo de verdade não sai por menos de 1.000 ienes no mercado... #nDeixa eu ver essa embalagem aí."
90101020-44 = ""
90101020-46 = ""
90101020-47 = "Olha só."
90101020-48 = "Tá escrito: [ruby=・]s[/ruby][ruby=・]a[/ruby][ruby=・]b[/ruby][ruby=・]o[/ruby][ruby=・]r[/ruby] caranguejo."
90101020-49 = "...Quê?"
90101020-50 = "Lê a tabela de ingredientes. Não tem quase nada de caranguejo aqui."
90101020-51 = "Só usaram aromatizante e extrato químico pra imitar o gosto."
90101020-52 = "Mentira... Como assim... não tem... caranguejo de verdade...?"
90101020-53 = "Meu mundo caiu..."
90101020-54 = "Devia ter desconfiado na hora pelo preço, né, criatura..."
90101020-55 = "Quando a esmola é demais, o santo desconfia."
90101020-56 = "Ah, falando em frutos do mar..."
90101020-57 = "Fiquei sabendo que o Esquadrão RABBIT resolveu um baita pepino numa vila de pescadores. #nE como agradecimento, ganharam um carregamento de camarão de primeira linha—"
90101020-58 = "Peraí. Como você sabe disso?"
90101020-59 = "Bem... na época em que estávamos presas no Centro Correcional... #nhouve uma crise de desabastecimento de camarão no D.U.—"
90101020-60 = "Não tô perguntando do camarão!"
90101020-61 = "Você tava trocando mensagens com elas pelas nossas costas?!"
90101020-62 = "Traíra, só você de segredinho!"
90101020-63 = "E-eu só estava respondendo às cartinhas que ela me mandava..."
90101020-64 = "Afinal, no presídio não podíamos usar smartphone, né? #nEntão a Miyako às vezes mandava cartas escritas à mão pelo correio."
90101020-65 = "...Ah, entendi."
90101020-66 = "Escrever cartas à mão em pleno século XXI... a Miyako é certinha até demais."
90101020-67 = "Ser sempre reta e sincera em qualquer situação é a maior virtude da Miyako."
90101020-68 = "Se bem que, quando passa do ponto, vira defeito."
90101020-71 = ""
90101020-72 = ""
90101020-73 = "...É verdade. É tanto qualidade quanto defeito."
90101020-74 = "Mas caramba... camarão fresquinho... que inveja boa~"
90101020-75 = "Será que não podia rolar um rolo desses com caranguejo pra nós? #nA gente resolvia num estalar de dedos e—"
90101020-76 = "Para com isso. Que falta de vergonha na cara torcer por tragédia alheia."
90101020-77 = "Tô brincando, tô brincando! Não me olha com essa cara feia não."
90101020-78 = "Mas falando bem sério... deu uma vontade louca de comer caranguejo agora. #nCaranguejo de verdade, não essa salsicha de peixe fake saborizada."
90101020-79 = ""
90101020-85 = ""
90101020-86 = "Ah, bem-vinda de volta."
90101020-87 = "Caranguejo."
90101020-88 = ""
90101020-90 = ""
90101020-91 = "...Oi?"
90101020-92 = ""
90101020-94 = ""
90101020-95 = "A partir de agora, nossa missão é caçar um caranguejo."
