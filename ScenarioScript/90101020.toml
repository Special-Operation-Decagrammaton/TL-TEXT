[translation]
90101020-1 = "Эпизод 2;Краб и рыбная сосиска"
90101020-2 = "Подвал Шале, штаб отряда FOX"
90101020-6 = ""
90101020-7 = "FOX 2, FOX 3 вернулись."
90101020-8 = "Приветик."
90101020-9 = ""
90101020-11 = ""
90101020-12 = ""
90101020-13 = "О, отлично сработали."
90101020-14 = "Но почему так поздно?"
90101020-15 = "Возникли проблемы в архиве Валькирии?"
90101020-16 = "Нет. Проникновение прошло безупречно."
90101020-17 = "Наши значки Бюро безопасности и студенческие удостоверения были абсолютно идентичны настоящим."
90101020-18 = "Но когда мы выходили, один студент из Бюро общественной безопасности начал на нас коситься. И как будто специально перекрывала дверь."
90101020-19 = "Похоже, глаз у неё острый — так пристально на нас смотрела. Явно что-то заподозрила."
90101020-20 = "Погоди... Бюро безопасности вас поймало?"
90101020-21 = "Неа. Нико заболтала её и начала взахлёб рассказывать про ремесленные пончики."
90101020-22 = "Разумеется, пришлось идти до конца. В итоге мы встали в очередь в Master's Donuts за их лимитированной новинкой. Очередь тянулась вокруг всего квартала."
90101020-23 = "Вот поэтому мы и опоздали. Простите."
90101020-24 = "Не извиняйтесь. Хорошая работа."
90101020-25 = "Знаю. Эй, а где Юкино?"
90101020-26 = "Она всё ещё на встрече с президентом Генерального студенческого совета."
90101020-27 = "И сказала, что поест там, так что ждать её не нужно."
90101020-28 = "О, Отоги... Ты ещё не ужинала?"
90101020-29 = "Наверное, голодная. Я что-нибудь приготовлю. Подожди."
90101020-30 = "Всё нормально. Я перекусывала вот этим."
90101020-31 = "Это разве не..."
90101020-32 = "Крабово-рыбная сосиска Yokozuna? Тебе она и правда нравится, да?"
90101020-33 = "Ну, она удобная."
90101020-34 = "Долго хранится, одной хватает, чтобы наесться. И главное — почти не пахнет. И есть её можно бесшумно."
90101020-35 = "Идеальный выбор для снайпера — нет, для убийцы. Того, кто всегда должен есть тайком. Незаметно."
90101020-36 = "...Ты сейчас кого-то изображала?"
90101020-37 = "Ничего у тебя не нормально. Какой бы удобной ни была эта мясная палочка, я не позволю тебе пропускать нормальную еду. Ты ещё растёшь, так что должна питаться как следует."
90101020-38 = "Жди здесь. Я что-нибудь приготовлю."
90101020-39 = "...Да, мэм."
90101020-40 = "Кстати, разве рыбная сосиска с крабом не должна стоить очень дорого?"
90101020-41 = "Ты что, урезаешь бюджет на боеприпасы ради перекусов?"
90101020-42 = "Нет. Она вообще недорогая. Меньше 100 иен за штуку."
90101020-43 = "Дешёвая банка краба стоит тысячу иен, а ты говоришь, что крабовая сосиска не стоит даже десятой части? Дай посмотреть."
90101020-44 = ""
90101020-46 = ""
90101020-47 = "Ах."
90101020-48 = "Это не настоящее крабовое мясо. Это рыбная сосиска со вкусом краба."
90101020-49 = "Что...?"
90101020-50 = "Посмотри на состав. СОДЕРЖИТ МЕНЕЕ 1% КРАБА."
90101020-51 = "Тебя обманывают. Просто прыснули крабовой эссенцией или чем-то таким на дешёвый рыбный фарш."
90101020-52 = "Не могу поверить. В крабово-рыбной сосиске Yokozuna нет настоящего краба...?"
90101020-53 = "...Мой мир рушится."
90101020-54 = "Не драматизируй. Ты должна была догадаться по цене."
90101020-55 = "Слышала поговорку: Бесплатных обедов не бывает?"
90101020-56 = "Раз уж заговорили о морепродуктах..."
90101020-57 = "Я слышала, наши младшие из отряда RABBIT помогли людям в ближайшей рыбацкой деревне. В награду им дали отборных креветок."
90101020-58 = "Хм? А когда это было?"
90101020-59 = "Мы тогда сидели в Исправительном бюро. Видишь ли, поставки креветок в D.U. внезапно прекратились—"
90101020-60 = "Нет, я не про креветки!"
90101020-61 = "Нико, ты общалась с нашими младшими? И ничего нам не сказала?"
90101020-62 = "Нечестно! Я тоже хотела их увидеть."
90101020-63 = "Я-я не планировала, что так получится..."
90101020-64 = "Ты же знаешь, в исправительном бюро нам не разрешали иметь личные телефоны. Я просто... отвечал на письма, которые присылала Мияко. Сначала это было очень непринуждённо и нерегулярно, но мы стали перепиской."
90101020-65 = "А... Понятно."
90101020-66 = "Мияко такая серьёзная. Представить только — сесть и реально написать письмо."
90101020-67 = "Ага. Это одна из её неизменных сильных сторон."
90101020-68 = "И частая слабость тоже. Она умеет доводить свою серьёзность до крайности."
90101020-71 = ""
90101020-72 = ""
90101020-73 = "...Верно. Похоже, нельзя получить хорошее без плохого."
90101020-74 = "А, но их креветкам я всё равно завидую..."
90101020-75 = "Может, нам тоже раскрыть какую-нибудь тайну, связанную с крабами? Глядишь, пару хороших ужинов заработаем."
90101020-76 = "Что за извращённое желание? Надеяться на происшествие только потому, что тебе захотелось краба...?"
90101020-77 = "Я пошутила. Хватит так смотреть."
90101020-78 = "Слушай, теперь я просто хочу краба. Не консервированного, не в сосиске, а настоящего..."
90101020-79 = ""
90101020-85 = ""
90101020-86 = "А, Юкино. С возвращением."
90101020-87 = "Краб."
90101020-88 = ""
90101020-90 = ""
90101020-91 = "...Что?"
90101020-92 = ""
90101020-94 = ""
90101020-95 = "Мы берёмся за краба."
90101020-97 = "Следующий эпизод;Краб и бочка"
