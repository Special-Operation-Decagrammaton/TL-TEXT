[translation]
41070-1 = "Episódio 7;Operação Cenoura (1)"
41070-2 = "(Alguns dias depois, voltei ao parque para verificar se todas estavam passando bem.)"
41070-5 = "Em frente ao Parque Kousagi"
41070-8 = "Moe, por que é você quem tá levando a marmita de yakiniku?!"
41070-9 = "Como assim por quê?! Fui eu que trouxe, então não tem do que reclamar!"
41070-10 = "Ontem você já comeu a marmita de porco ao gengibre! Hoje vê se fica quieta e come a marmita de broto de feijão!"
41070-11 = "E eu com isso?! Come você o broto de feijão, Saki!"
41070-15 = "Então, eu vou ficar com esta marmita de salsicha..."
41070-18 = "NEM PENSAR!!"
41070-23 = "Pessoal, acalmem-se, por favor. Alunas da SRT brigando por comida é algo vergonhoso."
41070-24 = "Nesta situação sem garantias, disputar pela qualidade da comida não faz o menor sentido. Por ora, devemos nos contentar em apenas encher o estômago."
41070-25 = "Então qual você vai pegar, Miyako?"
41070-26 = "Eu vou ficar..."
41070-27 = "Com esta marmita de karaage."
41070-28 = "Mas essa é a mais cara de todas!!!"
41070-29 = "[s] \"Oi, parece que está tudo bem por aqui?\""
41070-33 = "..."
41070-35 = "Logo neste momento..."
41070-36 = "N-Não, quer dizer, nós não estávamos brigando por causa das marmitas..."
41070-37 = "Isso mesmo, só estávamos conversando numa boa sobre o almoço."
41070-38 = "[s1] \"Numa boa...?\"\n[s2] \"Se não estavam brigando, que bom, mas...\""
41070-39 = "Se pareceu uma briga, é melhor ir lavar os olhos."
41070-40 = "Se pareceu uma briga, é melhor ir lavar os olhos."
41070-41 = "Nós estávamos apenas tendo uma deliberação perfeitamente legítima."
41070-42 = "E seja qual for o resultado, como companheiras que passaram pelo mesmo treinamento, na hora H..."
41070-43 = "Beleza, então vou pegar a marmita de yakiniku pra mim."
41070-44 = "A gente ainda tá deliberando! Anda logo e larga isso aí!!"
41070-50 = "...Desculpe por ter mostrado uma cena tão vergonhosa."
41070-51 = "Mas, sim. Não há nenhum problema em particular."
41070-52 = "Quanto à alimentação, bem..."
41070-54 = "Com aquelas marmitas descartadas, conseguimos resolver o problema por enquanto."
41070-55 = "Hehe, talvez o Sensei tenha tentado nos humilhar para quebrar o nosso espírito com aquilo, mas não vai funcionar. Nós não ligamos nem um pouco pra isso."
41070-57 = "Pela missão, nós fazemos o que for preciso."
41070-58 = "Mesmo sem o Sensei, nós vamos continuar assim...!"
41070-59 = "[s] \"Mas vocês parecem meio pálidas...\""
41070-61 = "[s] \"Estão bem? Passando mal?\""
41070-67 = "E-Espera! Não chega perto!"
41070-71 = "Se der mais um passo, eu te dou um soco de verdade, hein?!"
41070-72 = "[s] \"H-Hã...?\""
41070-74 = "Isso é, bem..."
41070-81 = "Por favor, não tente se aproximar disfarçadamente. Eu vou mirar nos seus pés."
41070-82 = "[s] \"N-Não pode ser...\""
41070-84 = "É que... o cheiro..."
41070-85 = "[s3] \"...Cheiro?\"\n[s4] \"Mas eu tomei banho antes de vir pra cá...?\""
41070-88 = "Não, não é isso que eu quis dizer...!"
41070-89 = "[s5] \"Será que é porque não tenho tomado banho de banheira ultimamente...?\"\n[s6] \"Aí não tem jeito mesmo, normal as alunas me evitarem...\""
41070-92 = "Não é isso! O problema somos nós!"
41070-94 = "Ah, pronto, falou..."
41070-95 = "F-Fazer o quê?! A gente já tá há quatro dias sem tomar banho!"
41070-96 = "[s] \"D-Desculpa... Então, que tal irem a uma casa de banhos...?\""
41070-98 = "A gente não tem dinheiro nem pra comprar comida, acha mesmo que dá pra pagar casa de banhos?"
41070-99 = "Para lavar o rosto, até conseguimos dar um jeito com a água do parque, mas..."
41070-100 = "Durante uma operação, não nos importamos de suar, mas em uma operação prolongada, a questão da higiene..."
41070-101 = "[s] \"Vocês podem usar os chuveiros da Schale, se quiserem.\""
41070-105 = "...Desprezível."
41070-106 = "...Não tem salvação."
41070-107 = "O-O que pretende fazer no instante em que tirarmos nosso equipamento...?!"
41070-109 = "Fazer a gente tomar banho pra aprontar o quê nesse meio-tempo? Por acaso prefere os vestígios a nós mesmas? Fiu-fiu!!"
41070-110 = "[s] \"O que diabos vocês acham que eu sou...?\""
41070-112 = "Um adulto não confiável."
41070-113 = "Um pervertido."
41070-114 = "Tipo lixo não incinerável..."
41070-115 = "Nada em especial..."
41070-116 = "[s] \"Entendi...\""
41070-118 = "De todo modo, vamos pensar em uma solução para isso, mas, por enquanto, peço que o Sensei não se aproxime deste parque."
41070-119 = "Mesmo assim, que solução a gente vai arrumar..."
41070-120 = "Se a gente jogar água fria no corpo aqui fora, aí sim que vamos pegar um resfriado..."
41070-122 = "...E se eu disparar um míssil na caixa d'água do banheiro?"
41070-123 = "Acho que a gente ia ficar ainda mais suja..."
41070-124 = "[s] \"Para banho de acampamento, que tal um tambor de metal...?\""
41070-126 = "...Um tambor de metal?"
41070-127 = "Ah, daqueles que você faz uma fogueira embaixo?"
41070-128 = "Acho que já vi algo parecido na Academia Aliada Hyakkiyako."
41070-130 = "Mas como é que se lava o corpo nisso aí?"
41070-131 = "E, falando nisso, que ideia antiquada."
41070-132 = "Concordo. Bom, vindo do Sensei, fazer o quê, né?"
41070-134 = "...Contudo,"
41070-135 = "talvez seja a única opção que temos."
41070-136 = "Não temos como providenciar instalações adequadas..."
41070-141 = "Moe, poderia se conectar ao sistema de gestão de recursos e localizar algum local que esteja usando tambores de metal?"
41070-142 = "Assim que encontrarmos um, vamos partir imediatamente."
41070-143 = "Partir, quer dizer..."
41070-144 = "A higiene é uma questão vital, diretamente ligada à sobrevivência do esquadrão. Precisamos resolvê-la o quanto antes, custe o que custar."
41070-145 = "Portanto, a partir de agora, para garantir uma banheira..."
41070-147 = "daremos início à \"Operação Cenoura\"!"
41070-149 = "Próximo;Operação Cenoura (2)"
