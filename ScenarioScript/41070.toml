[translation]
41070-1 = "Эпизод 7;Операция \"Морковь\", часть 1"
41070-2 = "Несколько дней спустя я заглянул в парк, чтобы проверить, как поживают Мияко и остальные."
41070-3 = ""
41070-5 = "Перед парком Коусаги"
41070-8 = "Стоять, Мое! Кто ТЕБЕ сказал, что ты получишь бенто с якинику?"
41070-9 = "Вообще-то я сама так решила. И что ты собираешься с этим делать?"
41070-10 = "Ты вчера сожрала бенто с шогаяки! В нём было больше всего мяса! А ну верни его обратно и возьми этот бенто с ростками маша."
41070-11 = "Заставь меня! Что-то я не видела, чтобы ты изъявляла желание съесть эту дрянь."
41070-12 = ""
41070-15 = "Э-эй… Я всё ещё здесь. Могу я съесть этот бенто с венскими сосисками?"
41070-17 = ""
41070-18 = "Да!!"
41070-20 = ""
41070-22 = ""
41070-23 = "Успокойтесь уже! Вы похожи на шавок, дерущихся за последнюю кость. Это недостойно."
41070-24 = "Мы даже не уверены, где возьмём еду в следующий раз. Лучшее, что мы можем сделать - это набить животы, пока можем, и не ссориться между собой."
41070-25 = "Хм? Да? Тогда, может, ты сама хочешь бенто с ростками маша?"
41070-26 = "Я..."
41070-27 = "…Думаю, я съем бенто с карааге. Никто же не против, верно?"
41070-28 = "Он тут самый дорогой, Мияко! Тоже мне, благодетельница выискалась!"
41070-29 = "[s] «Так, ну как дела??»"
41070-30 = ""
41070-32 = ""
41070-33 = "..."
41070-35 = "У Вас что, суперсила такая - приходить в самый неподходящий момент?"
41070-36 = "О-обещаю, мы вовсе не ссоримся из-за бенто."
41070-37 = "Что Вы тут делаете? У нас вообще-то намечался дружеский обед в кругу товарищей из отряда."
41070-38 = "[s1] «У тебя странное понятие дружбы.»\n[s2] «Большинство людей назвало бы это дракой.»"
41070-39 = "Возможно, это Вы странный, Сенсей."
41070-40 = "Ну и отлично, что мы не это большинство!"
41070-41 = "Для Вас это, может, и похоже на крики, но для нас это просто честный, демократический процесс распределения рациона."
41070-42 = "И какая разница, каков результат? Мы - сёстры по оружию, что преданы своему делу и друг другу! Мы все готовы пойти на необходимые жертвы!"
41070-43 = "Ну раз так, твоя жертва ведь наверняка включает бенто с якинику в мою пользу…"
41070-44 = "Если ты не уберёшь свои вонючие ручонки от этого бенто…"
41070-45 = ""
41070-47 = ""
41070-49 = ""
41070-50 = "Ну. Это неловко."
41070-51 = "Но, как сказала Саки… Вам не о чем беспокоиться."
41070-52 = "Наша проблема с припасами решена. У нас всё хорошо."
41070-54 = "Решена? Да мы же только что собирали выброшенные бенто…"
41070-55 = "Хи-хи, Вы удивлены Сенсей? Ваш план опозорить нас, заставив утилизировать остатки еды в качестве \"Специалистов по утилизации\", провалился!"
41070-57 = "Да. Дисциплинированные ученицы Академии SRT никогда не позволят чему-то столь тривиальному помешать своей миссии."
41070-58 = "Вы думали, что опозорите нас и заставите подчиниться, но вышло наоборот! Теперь мы сможем выживать здесь столько, сколько захотим. Так что убирайтесь!"
41070-59 = "[s] «Ты так говоришь, но выглядишь бледной…»"
41070-61 = "[s] «У тебя лихорадка? Ты приболела?»"
41070-62 = ""
41070-64 = ""
41070-65 = ""
41070-67 = "Н-нет! Не подходите ближе!"
41070-68 = ""
41070-70 = ""
41070-71 = "Сделаете ещё шаг, и я покажу Вам, какую боевую подготовку мы проходим в SRT!"
41070-72 = "[s] «Почему ты паникуешь?»"
41070-74 = "…Отлично. Вот и позор номер два."
41070-75 = ""
41070-77 = ""
41070-79 = ""
41070-81 = "Хватит приближаться. Иначе в следующий раз я не промахнусь."
41070-82 = "[s] «Почему вы все так напряжены?»"
41070-84 = "Из-за… запаха…"
41070-85 = "[s3] «Так и знал, что не нужно было есть рыбу.»\n[s4] «Я принимаю душ каждый день! Честно!»"
41070-88 = "Н-нет! Мы не про это, Сенсей!"
41070-89 = "[s5] «От меня несло всё это время? И никто не сказал мне?»\n[s6] «Из всего, что произошло, это ранит мои чувства больше всего.»"
41070-92 = "Чёрт, Сенсей! Нет! Единственные, от кого несёт - это от НАС!"
41070-94 = "Саки, ты когда-нибудь слышала… Хм, как сказать? А, да. ДЕРЖАТЬ ЯЗЫК ЗА ЗУБАМИ?!"
41070-95 = "Не говори, что тебе самой не противно! Я уже даже не помню, когда мылась в последний раз!"
41070-96 = "[s] «Почему бы вам не пойти в общественную баню?»"
41070-98 = "У нас что, деньги растут на деревьях? Если мы не можем даже купить себе еды, как мы можем позволить себе общественную баню?"
41070-99 = "Я больше не хочу мыться в общественных туалетах… Там даже нормальный душ принять невозможно."
41070-100 = "Необходимо терпеть трудности, это обычная ситуация во время операции. Но в долгосрочной перспективе это не самый лучший выход…"
41070-101 = "[s] «Если вам нужно место, где помыться, можете воспользоваться душем в Шале.»"
41070-102 = ""
41070-104 = ""
41070-105 = "Я никогда не слышала ничего более подозрительного в своей жизни."
41070-106 = "А мы слышали немало подозрительных вещей в своё время."
41070-107 = "Ч-ч-что Вы будете делать, пока мы моемся? Вы собираетесь украсть всё наше оружие?"
41070-109 = "Я видела такое по телику! Сенсей хочет понюхать нашу грязную, вонючую одежду, пока мы моемся. Верно, мистер Извращенец?!"
41070-110 = "[s] «Вы за кого меня принимаете?!»"
41070-112 = "За взрослого, которому нельзя доверять."
41070-113 = "Воплощение зла."
41070-114 = "За кого-то, кого я хотела бы взорвать?"
41070-115 = "Возможно, это уже не имеет значения…"
41070-116 = "[s] «...Это жестоко.»"
41070-118 = "Поэтому, прошу, воздержитесь от посещения парка, пока мы не сможем помыться. На самом деле, можете вообще не приходить."
41070-119 = "\"Пока не сможем помыться.\" И когда это будет?"
41070-120 = "Унылая реальность такова, что у нас нет горячей воды, а душ под холодной водой приведёт к болезням."
41070-122 = "О! Что если я заложу зажигательный заряд под ванной, и он нагреет воду? Хи-хи, Моэ, ты иногда просто слишком умная."
41070-123 = "Д-думаю, это сделает всё вокруг только грязнее. Включая нас самих."
41070-124 = "[s] «А как насчёт пустой бочки?»"
41070-126 = "Бочки?"
41070-127 = "…Мы могли бы наполнить одну водой и развести под ней огонь."
41070-128 = "Я уже видела, как такое делали в Академии Хяккияко. Должно сработать."
41070-130 = "Я тебе что, ниндзя какой-то? Ты сдохнуть хочешь?"
41070-131 = "Ещё одна тупая идея от тупого учителя. Такое бывает только в старых фильмах."
41070-132 = "Серьёзно! Вы что, старый пердун, Сенсей?"
41070-134 = "Мне неприятно это говорить, но…"
41070-135 = "Какие у нас ещё варианты? Установить полноценную ванну в парке?"
41070-136 = "Это дорого. А мы всего лишь кучка бедных студентов."
41070-137 = ""
41070-139 = ""
41070-140 = ""
41070-141 = "Мое. Получи доступ к цифровой системе управления ресурсами Кивотоса и найди рабочие объекты поблизости, где используют бочки."
41070-142 = "Все остальные - снаряжайтесь и будьте готовы выдвигаться."
41070-143 = "Выдвигаться? Ты сошла с ума, Мияко?"
41070-144 = "Успешность операции зависит не только от отличных навыков стрельбы. Без удовлетворения базовых потребностей отряд никогда не сможет показать себя с лучшей стороны."
41070-145 = "Так что, начиная с этого момента…"
41070-147 = "Начать операцию \"Морковь\": добыть железную бочку!"
41070-149 = "Следующий эпизод;Операция \"Морковь\", часть 2"
