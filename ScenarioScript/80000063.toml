[translation]
80000063-1 = "Подготовлено заранее"
80000063-3 = "Я ждал на скамейке в парке, когда ко мне поспешно подбежала Харука."
80000063-4 = "П-Простите, я опоздала, Сенсей! Я бежала так быстро, как могла!"
80000063-5 = "Вы долго ждали? О нет! Не могу поверить, что впустую потратила ваше драгоценное время!"
80000063-6 = "Я не знаю, что сказать... Мне совершить сэппуку?#nЭто смоет мой позор?"
80000063-7 = "Не переживать? Ну, если вы так говорите..."
80000063-8 = "Я х-хочу кое о чём спросить. Е-Если вы не против, конечно.#nЯ не хочу показаться грубой."
80000063-9 = "А? День святого Валентина? Д-Да, я знаю, что сегодня он..."
80000063-10 = "Я-я опоздала, потому что готовила к-к этому случаю кое-что?#nДа! Т-Точно! Вы меня раскусили."
80000063-11 = "Wait..."
80000063-12 = "Как вы узнали? И вы сами написали мне первым..."
80000063-13 = "[s1] Подыграть, пока Харука не впала в крайность.\n[s2] «(Нужно остановить Харуку, пока она не заложила ещё одну бомбу.)»"
80000063-14 = "...?"
80000063-15 = "...?"
80000063-16 = "Сенсей?"
80000063-17 = "О, точно! Ш-Шоколад! Да, я принесла.#nЯ берегла его рядом с собой с самой покупки!"
80000063-18 = "Сейчас только...!"
80000063-19 = ""
80000063-21 = ""
80000063-23 = "Вот. Ч-Честно говоря, я не очень разбираюсь в шоколаде и не знала, какой выбрать для вас..."
80000063-24 = "Я-я купила самый дорогой, который смогла позволить себе на свою жалкую зарплату!"
80000063-25 = "Н-Не то чтобы выбранный мной шоколад д-должен был значить для вас что-то особенное."
80000063-26 = "Наверное, он превратился в мусор в ту же секунду, как его коснулся кто-то вроде меня.#nМне не стоило даже надеяться, что вы его примете..."
80000063-27 = "[s3] «Но я позвал тебя сюда именно потому, что ХОТЕЛ его получить.»\n[s4] «Особенно сильно я ждал именно твой. Спасибо.»"
80000063-28 = "А?"
80000063-29 = "А?"
80000063-30 = "Вы... ждали, что я подарю вам шоколад?"
80000063-31 = "П-Правда?! Н-Не то чтобы я называла вас лжецом, но...!"
80000063-32 = "Просто трудно поверить, что вам нужен шоколад от кого-то вроде меня."
80000063-33 = "Ч-Что мне теперь делать? Вы добрее ко мне, чем я когда-либо заслуживала...#nКак мне отплатить вам?!"
80000063-34 = "А? Улыбнуться...? Но...! Этого же недостаточно!"
