[translation]
10009025-2 = "Фух. Нам снова удалось её обезвредить."
10009025-3 = "Спасибо, Сенсей! Даже не знаю, что бы мы без вас делали!"
10009025-4 = "[s] «На этот раз она умудрилась сбежать из Исправительного бюро?»"
10009025-5 = "Похоже, всё списывают на объект, куда её поместили.#nГоворят, он устаревший."
10009025-6 = "Она сумела этим воспользоваться и сбежала.#nЖутковато."
10009025-7 = "Вот почему я и говорю, что Лису Бедствий нельзя недооценивать!"
10009025-8 = "[s] «Мне всё ещё кажется, что мы что-то упускаем...»"
10009025-9 = "С кем не бывает! Нет смысла плакать над пролитым молоком."
10009025-10 = "На этот раз её переведут в новейший объект Исправительного бюро. Волноваться не о чем!"
10009025-11 = "Верно! Мы проследим, чтобы она добралась туда без происшествий!"
10009025-12 = "[s] «Если вы так говорите... Удачи вам двоим.»"
10009025-13 = ""
10009025-15 = ""
10009025-18 = "Продолжим патрулирование, Сенсей?"
10009025-19 = "[s] «Тебя всё это вообще не тревожит, Сэна?»"
10009025-21 = "Я всё ещё нервничал, но мы снова вернулись к патрулированию."
