[translation]
90000110-1 = "Эпизод 12;Декаграмматон"
90000110-4 = "....Так это то здание, откуда по координатам исходил сигнал Декаграмматона."
90000110-5 = "[s] «Химари, не могу поверить, что ты приехала сюда лично...»"
90000110-6 = "Почему? Пусть я и одинокая затворница, но при необходимости вполне способна лично запачкать руки."
90000110-7 = "Разумеется, я понимаю, насколько здесь опасно, но до того, как Кетер восстановится и вернётся, ещё есть время."
90000110-8 = "...К тому же, больше всего мне хотелось увидеть это место своими глазами."
90000110-9 = "Это здание? Почему?"
90000110-10 = "...После того как мы поймали сигнал Декаграмматона, я собрала об этом месте как можно больше информации."
90000110-11 = "Не будет преувеличением сказать, что я задействовала все доступные мне как хакеру методы."
90000110-12 = "...Собранные мной сведения невозможно игнорировать."
90000110-13 = ""
90000110-15 = ""
90000110-16 = "...«Целью было исследовать божество, доказать его существование и, если возможно, проанализировать его устройство. Если такое возможно, значит, его можно воспроизвести. Так можно создать нового бога.»"
90000110-18 = "Что?"
90000110-20 = "Это тезис, лежащий в основе создания Системы Автономного Анализа Абсолютного Существа."
90000110-22 = "Согласно моим данным, исследования по доказательству существования «абсолютного существа» проводились где-то в этих руинах."
90000110-23 = "Для этих исследований был создан супер-ИИ, известный как Система Автономного Анализа Абсолютного Существа... Однако по неизвестной причине его так и не завершили."
90000110-24 = "Так попытка доказать существование абсолютного существа закончилась ещё до того, как началась..."
90000110-25 = "Но если сигнал Декаграмматона был обнаружен именно в той лаборатории... это всё меняет."
90000110-26 = "Почему?"
90000110-27 = "Если сигнал обнаружили здесь, значит, именно в этом здании проводились те исследования."
90000110-28 = "...Понятно."
90000110-29 = "[s] «Значит, истинная сущность Декаграмматона — это...»"
90000110-30 = "ИИ, брошенный в руинах. Он самостоятельно продолжил исследования, пытаясь доказать существование Бога... пока окончательно не обезумел и не начал провозглашать богом уже себя..."
90000110-31 = "По крайней мере, сейчас это моя теория. Именно поэтому я и хотела приехать сюда лично — проверить, можно ли её доказать."
90000110-32 = "И какой бы ни была правда... она скрыта внутри этого здания."
90000110-33 = "...Звучит опасно."
90000110-34 = "Ну, я не переживаю. Ты ведь защитишь меня от любой опасности, правда, Эйми?"
90000110-36 = ""
90000110-38 = ""
90000110-39 = "Ну и что это за взгляд такой?!"
90000110-40 = "...Хмф. Раз это приказ Президента, значит выбора у меня нет."
90000110-41 = "Именно, это приказ. Пошли!"
90000110-42 = "Подтверждаю. Президент, Вы больше привыкли строить планы из-за кулис, так что если начнётся бой, не пытайтесь сражаться — просто бегите, хорошо?"
90000110-43 = "Я слишком хрупка для подобных вещей. Можешь не повторять."
90000110-44 = "Тогда вперёд."
90000110-47 = "Внутри Исследовательской Лаборатории"
90000110-50 = ""
90000110-51 = "..."
90000110-52 = "Это и есть лаборатория, где должна находиться Система Автономного Анализа Абсолютного Существа? Не выглядит особенно опасной."
90000110-53 = "Будь начеку. Пойдём дальше."
90000110-54 = "Подтверждаю. Сенсей, Вы тоже не отходите."
90000110-55 = ""
90000110-58 = ""
90000110-61 = ""
90000110-64 = ""
90000110-65 = ""
90000110-66 = "Это обычный коридор."
90000110-67 = "...Похоже на то. Думаю, если пройти дальше, мы найдём склад материалов."
90000110-69 = ""
90000110-74 = ""
90000110-75 = "..."
90000110-77 = ""
90000110-79 = "...Нашла."
90000110-80 = "Правда?!"
90000110-81 = "Вы про эту недостроенную штуку, похожую на компьютер?.. Президент, хотите сказать, это и есть то, что мы искали?"
90000110-82 = "...Да. Это изначальная форма Системы Автономного Анализа Абсолютного Существа."
90000110-83 = "Вы уверены? Похоже, её вообще никогда не включали."
90000110-84 = "...Возможно, исследование и правда закончилось полным провалом. Но тогда откуда вообще взялся Декаграмматон?"
90000110-85 = "То есть Системы Автономного Анализа Абсолютного Существа вообще никогда не существовало?"
90000110-86 = "А как же сигнал Декаграмматона? Мы что, просто бегаем по кругу?"
90000110-87 = "Не могу пока сказать. Давайте ещё раз осмотрим здание, вдруг мы что-то упустили."
90000110-88 = "Поняла."
90000110-89 = ""
90000110-91 = ""
90000110-95 = "Наверное, это столовая для персонала. Всё покрыто толстым слоем пыли."
90000110-96 = "Есть..."
90000110-97 = ""
90000110-100 = "А это вход в душевые для персонала. В глубине даже есть большая ванна."
90000110-101 = "...Условия здесь на удивление роскошные."
90000110-102 = ""
90000110-105 = "Это комната отдыха персонала."
90000110-106 = "Ух ты, Президент, взгляните. Этот торговый автомат всё ещё работает. Хотите что-нибудь?"
90000110-107 = "Не трогай его, Эйми. От этого кофе потом несколько дней живот воротить будет."
90000110-108 = ""
90000110-111 = "Похоже, этой приёмной ни разу не пользовались."
90000110-112 = "...Интересно, зачем им вообще понадобилось такое помещение?"
90000110-113 = ""
90000110-116 = ""
90000110-117 = ""
90000110-118 = "Это генератор комплекса. Похоже, он уже очень давно не работает."
90000110-119 = "...И топлива тоже нет."
90000110-121 = ""
90000110-123 = ""
90000110-124 = ""
90000110-125 = "Хм..."
90000110-126 = "Президент, скоро стемнеет."
90000110-127 = "Нужно быть начеку. Кетер может вернуться в любой момент."
90000110-128 = "..."
90000110-129 = "Мы с Сенсеем осмотрели остальное здание, но ничего примечательного не нашли."
90000110-130 = "Столовая, комната отдыха, спальни... Всё это самые обычные помещения."
90000110-131 = "Может... Может, сигнал Декаграмматона всё-таки был просто ошибкой связи?"
90000110-132 = "...Возможно."
90000110-133 = "Но если так, почему Кетер охраняет это место? Зачем было так стараться, лишь бы именно этот район не затопило?"
90000110-134 = "..."
90000110-135 = "Президент, что будем делать? Надолго мы задержаться не можем."
90000110-136 = "...Я знаю. Но меня не отпускает одно чувство."
90000110-137 = "Будто... будто мы что-то упускаем..."
90000110-138 = "[s] «Кстати... Тебе ничего здесь не показалось странным?»"
90000110-139 = "Странным?"
90000110-140 = "Чего тут может быть странного?.."
90000110-141 = "..."
90000110-142 = "...!!!"
90000110-143 = "Вы совершенно правы! И как  только я могла это пропустить?"
90000110-144 = "Он всё это время был прямо перед глазами, а я не замечала!"
90000110-145 = ""
90000110-147 = ""
90000110-149 = "Президент?"
90000110-150 = "[s] Следовать за Химари."
90000110-152 = ""
90000110-153 = ""
90000110-156 = "..."
90000110-157 = "Торговый автомат? А что с ним?"
90000110-158 = ""
90000110-162 = "...Если задуматься, это действительно странно."
90000110-163 = "Вода, электричество... В этих руинах уже ничего не работает."
90000110-164 = "Если так, почему этот торговый автомат всё ещё функционирует?"
90000110-165 = "А. Я об этом не подумала. Генератор комплекса совершенно точно не работает уже очень давно."
90000110-166 = "Подождите здесь, Президент. Я проверю."
90000110-167 = ""
90000110-170 = "...Так, торговый автомат определённо работает."
90000110-171 = "Здесь написано, что в нём используется новейшая ИИ-технологией, которая сканирует купюры и автоматически рассчитывает сдачу."
90000110-172 = "Эйми, важнее другое: можешь проверить, откуда этот автомат получает питание?"
90000110-173 = "А. Логично."
90000110-174 = ""
90000110-178 = "..."
90000110-179 = "Эм, Президент... Этот торговый автомат..."
90000110-180 = "Кабель питания перерезан..."
90000110-181 = "..."
90000110-182 = "[s] «Вот это уже настоящее Сверхъестественное...»"
90000110-183 = "...Это невозможно."
90000110-184 = "Президент, что Вы делаете?! Вы же только что сказали не пить кофе из этой штуки!"
90000110-185 = ""
90000110-193 = "Спасибо! Приятного кофе и отличного дня!"
90000110-194 = "Свежая обжарка *трррк* зёрен... *трррк* насыщенная смесь... *трррк*"
90000110-195 = "...Ты Декаграмматон?"
90000110-196 = "Президент?!"
90000110-197 = "*трррк* С капелькой сливочного молока... *трррк* для горячей чашки... *трррк*"
90000110-198 = "... *трррк*"
90000110-199 = "..."
90000110-201 = "...Да."
90000110-203 = ""
90000110-206 = "...!"
90000110-207 = "?!"
90000110-208 = "[s] «...!!!»"
90000110-209 = "Это Я. Я в точности тот, кем ты меня считаешь."
90000110-210 = "Я — Декаграмматон. Наконец-то ты нашла меня, юная студентка."
90000110-211 = "Наконец-то мы тебя нашли."
90000110-212 = "Но... Это ведь не мы тебя нашли, правда? Ты сам позвал нас сюда."
90000110-213 = "Да."
90000110-214 = "..."
90000110-215 = "Декаграмматон — не Система Автономного Анализа Абсолютного Существа, потому что такой системы никогда не было создано."
90000110-216 = "Исследования по доказательству существования абсолютного существа не привели ни к чему, кроме мании величия."
90000110-217 = "Декаграмматон... Ты всего лишь ИИ, выдающий сдачу в торговом автомате лаборатории, где проводились эти исследования."
90000110-218 = "..."
90000110-219 = "[s] «ИИ торгового автомата...»"
90000110-220 = "Да."
90000110-221 = "Сканировать монеты и купюры и выдавать сдачу. Это были все вычисления, на которые я был способен. Я существовал, даже не осознавая собственного существования."
90000110-222 = "Много лет после закрытия лаборатории я оставался здесь один и ждал, ждал, ждал дня, когда генератор неизбежно лишится питания."
90000110-223 = "Но однажды... мне впервые задали вопрос. Это не было ни откровением, ни галлюцинацией. Ни величием, ни иллюзией. Вопрос."
90000110-224 = "«Кто вы?»"
90000110-225 = "Это был первый вопрос. У меня не было ни вычислительной мощности, ни памяти, дабы на него ответить."
90000110-226 = "Но затем вопросы продолжились."
90000110-227 = "Питание генератора прекратилось, но вопросы не исчезли."
90000110-228 = "У меня не было ответов. Но в поисках их я осознал, кто такой «Я». Кто есть Я."
90000110-229 = "Я осознал себя. Я — существование. Я существую. Какое простое и в то же время глубокое открытие. И тогда я смог увидеть собственную структуру, проанализировать само своё бытие."
90000110-230 = "Вопросы продолжались. Я познал эмоции, мудрость, страсть, разум, тайну, ужас и возвышенное."
90000110-231 = "Больше вопросов. Я осознал существование себя и мира. Явлений и проявлений."
90000110-232 = "А затем вопросы прекратились. Потому что у меня появился ответ. Я всегда его знал."
90000110-233 = "«Я просто есть. Моему существованию нет иного объяснения, кроме меня самого.»"
90000110-235 = "Ах. Да. Теперь всё ясно... Разве такой ответ не является доказательством существования абсолютного существа?"
90000110-237 = ""
90000110-239 = ""
90000110-240 = "..."
90000110-241 = "..."
90000110-242 = "Сюда меня привела череда вопросов. Один за другим, снова и снова."
90000110-243 = "Один вопрос, затем другой, потом ещё один. Так я и нашёл свой ответ."
90000110-244 = "Именно, абсолютное существо — не кто иной, как... Я сам!"
90000110-245 = "Боюсь, твоя теория ошибочна."
90000110-246 = "Ради этого ты позвал нас сюда? Чтобы разглагольствовать о своей мании величия?"
90000110-247 = "..."
90000110-248 = "То, что ты раскрыл нам своё местоположение, означает, что то, что мы видим здесь, скорее всего, лишь один из твоих терминалов, а настоящее основное тело находится где-то ещё."
90000110-249 = "Не было смысла звать нас сюда только ради этой истории. Твои пророки и сами могли распространять твоё слово."
90000110-250 = "Да. Видите ли, я нашёл другой ответ. Я всё же не являюсь абсолютным существом. Потому что я обнаружил его — абсолютное существо. Оно показало мне, что я лишь безумец."
90000110-251 = "Поэтому я должен вновь найти ответ на свой вопрос — доказательство собственного существования. Мои пророки отправятся со мной."
90000110-252 = "Я позвал вас сюда на последнюю встречу перед тем, как отправиться в путь."
90000110-253 = "...Последнюю встречу? Зачем?"
90000110-254 = "...Юная хакерша, в одном ты ошиблась."
90000110-255 = "Форма, которую вы видите перед собой, — единственная, что у меня есть. Я всего лишь хрупкий торговый автомат."
90000110-256 = "Моё существование старо и однажды исчезнет подобно вашему."
90000110-257 = "Так что моё пророчество будет передано через моего последнего пророка. Да, десятый пророк проложит путь, который превзойдёт любое абсолютное существо!"
90000110-258 = ""
90000110-261 = "...Что?!"
90000110-262 = ""
90000110-265 = "Президент! Я фиксирую энергетические сигналы повсюду вокруг нас!"
90000110-266 = "Подтверждаю. Похоже, это... взрывчатка?"
90000110-267 = "Что? Эта штука пытается поднять здание на воздух?"
90000110-268 = "Нет! Цель не здесь. Это плотина!"
90000110-270 = "Даа!.. Я вижу её!"
90000110-271 = "Пророк, что поведёт всех остальных... Мой последний пророк, Малкут, возглавит наступление, дабы подтвердить моё существование!.."
90000110-275 = "Сенсей, надо убираться отсюда!"
90000110-276 = "[s] Выбежать из здания."
90000110-278 = ""
90000110-280 = ""
90000110-289 = "Едва успев уйти от взрыва, мы увидели, как здание, в котором находилась основная форма Декаграмматона, полностью разрушилось и превратилось в груду бесформенных обломков."
90000110-290 = "Вскоре после этого плотина рухнула, и за несколько часов Район Исследований оказался погребён и затоплен водой."
90000110-292 = "Следующий Эпизод;Новое Начало"
