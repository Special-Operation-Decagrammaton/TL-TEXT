[translation]
2005402-1 = "Система жизнеобеспечения"
2005402-8 = "[ns] «?!»"
2005402-9 = ""
2005402-11 = "Фу-фу. Хорошо спали, Сенсей?"
2005402-12 = "Ну как вам? Утренний звонок от такой прекрасной, утончённой и гениальной девушки-системы жизнеобеспечения?"
2005402-13 = "[s] «Ну, теперь я точно окончательно проснулся!»"
2005402-14 = "Понятно. Получать результат, отражающий архитектуру системы, — одна из величайших радостей разработчика."
2005402-15 = "Что ж, приступим к сегодняшним делам?"
2005402-16 = ""
2005402-18 = ""
2005402-19 = "[ns] «Это...»"
2005402-20 = "Начнём с небольшой растяжки, чтобы бодро начать день."
2005402-21 = "Хотя этот AMAS — работа Рио... думаю, в нынешних обстоятельствах вполне допустимо реквизировать его для общих нужд."
2005402-22 = "Я внесла несколько модификаций, улучшений и настроек... Всё это ради того, чтобы помочь вам с утренней растяжкой, Сенсей."
2005402-23 = "Итак, Сенсей. Сначала растянем спину. Примите положение."
2005402-24 = ""
2005402-26 = ""
2005402-27 = ""
2005402-28 = ""
2005402-30 = "[ns1] «?!» \n[ns2] «Ай!!»"
2005402-33 = ""
2005402-34 = ""
2005402-35 = "Фу-фу. Потерпите ещё немного, Сенсей. Как говорится: «Горькое лекарство лечит лучше»."
2005402-38 = ""
2005402-39 = "Вы уже умылись? Я подготовила образец моего любимого средства для умывания."
2005402-40 = "Оно идеально удаляет кожный жир и пот, которые накапливаются за ночь."
2005402-41 = "Средство мягкое и подходит чувствительной коже, так что о раздражении можно не беспокоиться."
2005402-45 = ""
2005402-46 = ""
2005402-47 = ""
2005402-49 = ""
2005402-50 = ""
2005402-51 = ""
2005402-52 = "Как я и думала. Сегодня на вас снова та же одежда..."
2005402-53 = "Я понимаю, что в наших обстоятельствах полный гардероб — своего рода роскошь... но нельзя пренебрегать основами."
2005402-54 = "Пусть это выражение и банально, но важно «выглядеть соответственно», разве нет?"
2005402-55 = "Я отпарю эту одежду. Нужно разгладить складки."
2005402-58 = ""
2005402-59 = "Теперь пора идти в кабинет. Как «всеведущая», я выберу для вас наиболее оптимальный маршрут."
2005402-60 = "Я отметила путь стрелками на полу. Вам остаётся лишь следовать им, хорошо?"
2005402-61 = "[s] «...Разве идти не совсем недалеко...?»"
2005402-62 = "..."
2005402-63 = "Вообще-то, это другое."
2005402-64 = "[ns] «В каком смысле...?»"
2005402-65 = "..."
2005402-66 = "Это ДРУГОЕ."
2005402-69 = ""
2005402-70 = "Добро пожаловать, Сенсей. Я вас ждала."
2005402-71 = "Фу-фу. В конце концов, где ещё вы найдёте столь утончённую, прекрасную и сверхгениальную хакершу, которая выступает вашей незаменимой системой жизнеобеспечения?"
2005402-72 = "[s] «Да... Хорошо... Спасибо за заботу...»"
2005402-73 = "Заботу...?"
2005402-74 = "Что ж. Говорят, путь сердца всегда прям."
2005402-75 = "Иными словами... я намерена и дальше вот так помогать вам в повседневной жизни, Сенсей. Запомните это."
2005402-76 = "[s] «Погоди, а моё мнение вообще учитывается?»"
2005402-77 = "..."
2005402-78 = "Это... Я ведь столько сил потратила, чтобы взломать половину системы Рио — Я ХОТЕЛА СКАЗАТЬ, договориться с ней..."
2005402-79 = "Подумать только, вы настолько бессердечны. Неужели отвергнете искренний жест бескорыстного студента, который лишь хотел использовать доступные ресурсы, чтобы улучшить вашу жизнь?"
2005402-80 = "Я потрясена..."
2005402-81 = "Это всё равно что одинокий цветок, жалко, но благородно цветущий на бесплодной вершине утёса, а какой-то бездумный ребёнок просто тянется к нему, чтобы сорвать, вырвать, убить — лишь потому, что может..."
2005402-82 = "Но если это будут руки Сенсея, полагаю, я смогу выдержать мучительную боль, даже если покажется, будто меня ломают пополам..."
2005402-83 = "[s] «Спасибо, Химари! Ты очень помогла!»"
2005402-84 = "Фу-фу. Так я и думала."
2005402-85 = "Кстати, согласно сегодняшнему гороскопу, на некоторое время нас окутала красная аура."
2005402-86 = "Поэтому я сменила обои монитора на... страстно-красные."
2005402-87 = "[ns] «У меня глаза болят. Нельзя оставить это хотя бы только на телефоне?»"
