[translation]
80000064-1 = "Валентинка"
80000064-2 = "Асуна написала мне и попросила прийти в нынешнюю клубную комнату C&C."
80000064-3 = ""
80000064-9 = "Свет горел, но внутри, похоже, никого не было."
80000064-10 = "[s1] «Асуна?»\n[s2] «Эй?»"
80000064-11 = "Ура! Вы пришли, Мастер!"
80000064-12 = "Ура! Вы пришли, Мастер!"
80000064-13 = "Та-дам! Это я!"
80000064-14 = "[s3] «Не пугай меня так!»\n[s4] «А-Асуна!»"
80000064-15 = "Ахаха! Какой же вы трусишка, Мастер!"
80000064-16 = "Ахаха! Какой же вы трусишка, Мастер!"
80000064-17 = "А? Я спряталась, чтобы внезапно выскочить и удивить вас!"
80000064-18 = "Вы не знаете, зачем я вас позвала?!"
80000064-19 = "[s5] «Ко Дню святого Валентина?»\n[s6] «Кажется, я догадываюсь.»"
80000064-20 = "Хи-хи! Значит, вы уже знаете, какой будет ещё больший сюрприз, да?"
80000064-21 = "Хи-хи! Значит, вы уже знаете, какой будет ещё больший сюрприз, да?"
80000064-22 = "Хорошо! Начинаем, Мастер!"
80000064-23 = ""
80000064-25 = ""
80000064-26 = ""
80000064-27 = ""
80000064-28 = ""
80000064-30 = "[ns7] «А-Асуна, с-стой!»\n[ns8] «Что ты делаешь?!»"
80000064-31 = "Мастер? Я думала, вы поняли! Я достаю шоколад!"
80000064-32 = "Мастер? Я думала, вы поняли! Я достаю шоколад!"
80000064-33 = "Он чуточку трудно... достаётся... Есть! Валентиновский шоколад Асуны — только для Мастера!"
80000064-34 = "Чтобы он стал совсем особенным, я должна покормить вас лично."
80000064-35 = "А-а-а! Откройте рот!"
80000064-36 = "Хм?"
80000064-37 = "Мастер? Почему вы так крепко сжали губы?"
80000064-38 = "Ахаха! У вас такое смешное лицо, Мастер! Совсем красное!"
80000064-39 = "Но в День святого Валентина я обязана накормить вас валентиновским шоколадом!"
80000064-40 = "Ну же, идите сюда, Мастер."
80000064-41 = "[s] Сбежать."
80000064-44 = "О-о! Теперь мы играем в догонялки?"
80000064-45 = "С вами всегда так весело. Хорошо! Но когда я вас поймаю, вы обязаны его съесть!"
80000064-46 = "Я иду!"
80000064-47 = ""
80000064-49 = ""
80000064-58 = "В итоге меня поймали и насильно накормили шоколадом."
