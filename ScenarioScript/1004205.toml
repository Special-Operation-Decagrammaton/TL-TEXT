[translation]
1004205-1 = "Уличный сад"
1004205-2 = "[ns] «Доброе утро, Ацуко.»"
1004205-3 = "Доброе утро, Сенсей."
1004205-4 = "Что это у вас в руках?"
1004205-5 = "[s] «О, это? Цветы для твоей композиции.»"
1004205-6 = "...Для меня?"
1004205-9 = "― Эти цветы... Вы...[wa:1640]"
1004205-11 = "― ...принесли их мне?[wa:970]"
1004205-14 = "― Только для меня?[wa:900]"
1004205-16 = "― ...Понятно.[wa:10]"
1004205-19 = "― Я буду их беречь.[wa:2360]"
1004205-22 = "― ...Я так счастлива.[wa:2520]"
1004205-24 = "― Спасибо."
1004205-27 = "Но, Сенсей... я вообще не собиралась делать цветочную композицию."
1004205-28 = "[s1] «...Что?»\n[s2] «П-Правда...?!»"
1004205-29 = "Я сказала, что хочу сделать клумбу, а не композицию."
1004205-30 = "Я сказала, что хочу сделать клумбу, а не композицию."
1004205-31 = "[s] «А... И это разные вещи.»"
1004205-32 = "К сожалению, эти цветы уже нельзя посадить, но я всё равно буду их беречь."
1004205-33 = "Хи-хи. Они особенные для меня."
1004205-34 = ""
1004205-36 = ""
1004205-37 = "Вот, покажу, что я имела в виду. Сюда."
1004205-38 = ""
1004205-40 = ""
1004205-42 = "В углу оживлённой улицы была устроена декоративная клумба."
1004205-43 = "На ней уже росли цветы и другие растения."
1004205-44 = "[ns] «Это и есть клумба?»"
1004205-45 = "Да... Саори сказала, что мы сможем оставаться в этом месте дольше обычного."
1004205-46 = "Я подумала, что можно сделать клумбу, чтобы скоротать время."
1004205-47 = "Я нашла хорошо освещённое место и стала сажать полевые цветы."
1004205-48 = "Сейчас она немного пустая, но скоро будет заполнена до краёв."
1004205-49 = "[s] «Не могу дождаться. Это тоже полевой цветок?»"
1004205-50 = "...Не уверена."
1004205-51 = "[s] «А где ты его нашла?»"
1004205-52 = "Это случайный сорняк из города. Если у него и есть название, я его не знаю."
1004205-53 = "Но... если бы я его оставила, он бы завял и умер."
1004205-54 = "Мне понравилась мысль, что разные растения смогут найти дом в этой земле."
1004205-55 = "[s] «Красивая мысль. Можно я помогу?»"
1004205-56 = "...Да. Я была бы рада."
1004205-57 = "Если увидите цветок, который вам понравится, выкопайте его вместе с корнями и принесите сюда."
1004205-58 = "[s3] «Буду приносить красивые, как ты.»\n[s4] «Надеюсь, тебе понравится мой выбор.»"
1004205-59 = "Я серьёзно, Сенсей. Если повредить корни, он погибнет, так что, пожалуйста, осторожнее."
1004205-60 = "Я серьёзно, Сенсей. Если повредить корни, он погибнет, так что, пожалуйста, осторожнее."
1004205-62 = "Остаток дня я провёл в поисках новых растений для её клумбы."
