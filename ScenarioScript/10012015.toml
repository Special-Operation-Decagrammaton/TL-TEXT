[translation]
10012015-2 = "Ай-ай-ай! Чуть не попались."
10012015-3 = "Широко? Все? Вы целы?"
10012015-4 = "Всё хорошо. Аяне тоже со мной."
10012015-5 = "С-Спасибо, Широко."
10012015-6 = "А Сенсей?! Сенсей не пострадал?!"
10012015-7 = ""
10012015-12 = "С Сенсеем всё хорошо! Все целы!"
10012015-13 = "Вот это способ меня разбудить. В следующий раз можно просто поцеловать в щёку или что-нибудь такое?"
10012015-14 = "Нономи! Хошино! Слава богу!"
10012015-15 = "[s1] «Спасибо, что спасла, Нономи.»\n[s2] «Ты за меня волновалась, Серика?»"
10012015-16 = "Хи-хи, не стоит благодарности."
10012015-17 = "Н-Нет! Я просто... проверяла, ясно?!"
10012015-18 = "Слава богу, никто не пострадал. Было бы обидно так испортить отпуск."
10012015-20 = "Мой купальник тоже цел. Отлично."
10012015-21 = "Тебя сейчас именно это волнует?!"
10012015-22 = "Хотя... ты права. Запасной купальник я не взяла."
10012015-23 = "[s3] «Хорошо, что твой купальник не испортился.»\n[s4] «Главное, что все целы...»"
10012015-24 = "Точно?"
10012015-25 = "Точно?"
10012015-26 = "С-Широко! Мне и так неловко ходить в этой штуке, ясно?! Не делай ещё хуже!"
10012015-27 = ""
10012015-29 = ""
10012015-31 = ""
10012015-32 = "[ns] «Аяне, ты здесь?»"
10012015-33 = "А-А?! Ой! Простите... Ничего..."
10012015-34 = "Главное, что мы добрались до острова целыми... Более-менее."
10012015-35 = "Хотя наш вертолёт — нет..."
10012015-36 = "Я быстро провела диагностику. Есть и хорошая новость: его можно починить."
10012015-37 = "Но быстро это не получится."
10012015-38 = "Простите меня, все. Мне следовало быть осторожнее..."
10012015-40 = "Ты чего извиняешься?! Не смей винить себя, Аяне!"
10012015-41 = "Вертолёт внезапно сломался! Кто бы ни сидел за штурвалом, ничего бы не изменилось."
10012015-42 = "И я дважды, трижды проверила всё целиком! Никаких заметных проблем не было."
10012015-43 = "Нам наверняка продали брак! Мы жертвы мошенничества!"
10012015-44 = "М-Мошенничество — это, наверное, слишком..."
10012015-45 = "[s5] «Но Серика права. Это не твоя вина, Аяне.»\n[s6] «Не вини себя. Для начала давайте доберёмся до курорта.»"
10012015-46 = "С-Спасибо, Сенсей."
10012015-47 = "С-Спасибо, Сенсей."
10012015-48 = "Х-Хорошо... Надеюсь, на курорте найдётся способ его починить."
10012015-50 = "Ага! В буклете его рекламировали как суперроскошный, так что там наверняка помогут."
10012015-51 = "Сможем попросить у них запчасти или ремонт! Раз плюнуть!"
10012015-52 = "...Вы точно в порядке, Сенсей? Вы всё ещё хромаете."
10012015-53 = "[s] «Наверное, просто камешек в ботинке. Всё нормально.»"
10012015-55 = "Вот это настрой! Я так вами всеми горжусь."
10012015-56 = "Не хочется портить момент, но..."
10012015-57 = "...насчёт того курорта, о котором мы говорили..."
10012015-58 = "Вы ведь не думаете, что это он?"
10012015-59 = ""
10012015-61 = ""
10012015-62 = ""
10012015-63 = ""
10012015-65 = "ЭТО И ЕСТЬ КУРОРТ?!"
10012015-66 = "Ты точно правильно прочитала карту?!"
10012015-67 = "...Посмотрите туда!"
10012015-69 = "И на это место...!"
10012015-71 = "Это заброшенные руины! Ни души вокруг!"
10012015-73 = "Мы не на том острове? Не на той планете? Не может быть, что это он!"
10012015-74 = "...Судя по координатам, именно он."
10012015-75 = "Н-Но... этот курорт явно не работает..."
10012015-76 = "К-Как думаете... Ну... Я хочу сказать..."
10012015-78 = "...Ах."
10012015-79 = "Она пытается сказать: «Нас опять обманули?»"
10012015-80 = ""
10012015-82 = ""
10012015-83 = ""
10012015-85 = "Как?! Но это же был приз, который я выиграла! Как он мог оказаться мошенничеством?"
10012015-86 = "Прости, Серика..."
10012015-87 = "Похоже, призом за первое место в конкурсе была поездка именно в эти руины."
10012015-88 = "Как и с вертолётом... Одно мошенничество за другим."
10012015-89 = "...Это правда снова происходит?"
10012015-90 = "Мы все так стараемся... Я думала..."
10012015-91 = "Я так радовалась... Мы наконец начали видеть плоды всех наших усилий..."
10012015-92 = "Неужели с нами хоть раз не может случиться что-нибудь хорошее? Почему всё всегда заканчивается плохо?"
10012015-93 = "Я больше не хочу мыслить позитивно... Это нечестно."
10012015-94 = "Серика..."
10012015-96 = "..."
10012015-97 = "*всхлипывает*"
10012015-98 = "[s7] «Выше нос, Серика. Всё будет хорошо.» \n[s8] «Всё не так плохо, как кажется, Серика.»"
10012015-99 = "П-Правда?"
10012015-100 = "П-Правда?"
10012015-101 = "Правда! Всё будет хорошо!"
10012015-102 = "Пусть это и не роскошный курорт нашей мечты, но мы всё равно на прекрасном острове с кристально голубой водой!"
10012015-103 = "У нас есть всё необходимое для веселья, включая друг друга. Так что давайте веселиться!"
10012015-104 = "Все наши припасы в хорошем состоянии. Нужно только забрать их из вертолёта."
10012015-105 = "Я уже немного прошлась вокруг и осмотрела сооружения."
10012015-106 = "Всё старое и ржавое, но немного труда — и это можно исправить. Да и инструменты с оборудованием здесь есть."
10012015-108 = "...Вы правда так думаете?"
10012015-109 = "На все сто, Серика! Мы вместе справлялись и с худшим."
10012015-110 = "Чтобы наслаждаться отпуском, нам не нужен дорогущий курорт."
10012015-111 = "Мы починим вертолёт и приведём объекты в порядок... Мы ведь Комитет по предотвращению закрытия."
10012015-112 = "А уж в ремонте оборудования мы неплохо разбираемся, так что волноваться не о чем."
10012015-114 = "Абидос вообще специализируется на ремонте и уборке."
10012015-115 = "Ага-ага! Как всё починим, у нас будет собственный частный курорт!"
10012015-116 = "И как можно не повеселиться на тайном острове?"
10012015-117 = "Давайте вместе устроим лучший отпуск в нашей жизни. ☆"
10012015-118 = "Ох, мои детишки. Вы стали такими взрослыми."
10012015-120 = "..."
10012015-121 = "[s9] «Это я вижу слёзы, Серика?»\n[s10] «Поплачешь после того, как попробуем, хорошо, Серика?»"
10012015-122 = ""
10012015-123 = ""
10012015-125 = ""
10012015-126 = ""
10012015-127 = "Кто сказал, что я плачу?! Ладно, давайте!"
10012015-128 = "Мы повеселимся так, что эти мошенники ещё пожалеют, что отдали нам билеты!"
10012015-129 = "Я не откажусь от мечты об отпуске на пляже!"
10012015-131 = ""
10012015-132 = "Ура! Пошли!"
