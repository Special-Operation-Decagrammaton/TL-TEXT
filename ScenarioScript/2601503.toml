[translation]
2601503-1 = "Безымянная девушка"
2601503-3 = ""
2601503-4 = "Ах."
2601503-5 = "Сенсей? Почему вы ещё не спите?"
2601503-6 = "Ха-ха, хотя мне-то говорить. Я ведь тоже не сплю."
2601503-7 = "Просто никак не могла уснуть."
2601503-8 = "А? Вы тоже, Сенсей?"
2601503-9 = "Тогда... хотите прогуляться вместе?"
2601503-10 = "О... Какой неожиданный бонус."
2601503-11 = "Хм? Ничего. Хи-хи. Просто разговаривала сама с собой."
2601503-12 = "С удовольствием. Ведите."
2601503-17 = ""
2601503-18 = "..."
2601503-19 = "[s] «Что-то не даёт тебе покоя?»"
2601503-20 = "...Хм? Почему вы спрашиваете?"
2601503-21 = "Простите, просто я удивилась. Я стараюсь не показывать людям, что переживаю, знаете ли."
2601503-22 = "Наверное, вы застали меня врасплох."
2601503-23 = "Короче говоря..."
2601503-24 = "Ну, у меня те же переживания, что и у любой старшеклассницы."
2601503-25 = "Но ничего настолько серьёзного, чтобы нагружать этим вас."
2601503-26 = "[s] «Следующий вопрос! Ты часто бываешь у моря?»"
2601503-27 = "А? Вот что вы хотите узнать?"
2601503-28 = "Не сказала бы, что часто— Хотя ладно, с вами я могу быть честной."
2601503-29 = "На самом деле я здесь впервые."
2601503-30 = "...Почему раньше не приезжала? Особой причины нет."
2601503-31 = "Если хорошенько подумать..."
2601503-32 = "Конечно, я не могу говорить за каждого члена Отряда правосудия, но обычно туда не вступают, если ты не довольно серьёзный человек."
2601503-33 = "Какими бы они ни были на самом деле, все стараются вести довольно аскетичный образ жизни."
2601503-34 = ""
2601503-36 = ""
2601503-37 = "Вы ведь понимаете, о чём я, Сенсей?"
2601503-38 = "[s1] «Да... Это точно.»\n[s2] «Правда? Вот как всё устроено?»"
2601503-41 = "В каком-то смысле, вступая в Отряд правосудия, ты расписываешься в отказе от беззаботной школьной жизни."
2601503-42 = "Наверное, поэтому я просто не привыкла куда-то выходить и развлекаться."
2601503-43 = "Но почему вы спросили?"
2601503-44 = "[s3] «Ну, ты довольно спокойно воспринимаешь всё происходящее.»\n[s4] «Обычно люди сильно радуются, когда оказываются на пляже.»"
2601503-47 = "А-а-а. Вы правы. Кто не любит хороший пляжный эпизод, да?"
2601503-48 = "Но всё-таки не стоит судить книгу по обложке. Уж вы-то должны это обо мне знать."
2601503-49 = "Пусть с виду я такая, внутри меня, может быть, просто переполняет восторг."
2601503-50 = ""
2601503-52 = ""
2601503-53 = "...Эй, даже не пытайтесь меня разоблачить. Я знаю, что вы не верите."
2601503-54 = "Вы всегда каким-то образом пробираетесь сквозь мою привычку всем угождать. Хмф."
2601503-55 = "Хм... Ладно, можно я скажу честно?"
2601503-56 = ""
2601503-58 = ""
2601503-59 = "Сразу уточню: ничего особо серьёзного. Просто не хочу, чтобы вы поняли меня неправильно."
2601503-60 = "Но думаю, вы поймёте. Так что скажу."
2601503-61 = "...Мне трудно найти причину, по которой я должна быть от этого в восторге."
2601503-62 = "Пляж ведь не НАСТОЛЬКО отличается от любого другого места, правда?"
2601503-63 = "По работе я часто езжу в другие школы и районы."
2601503-64 = "И поездка сюда ощущается примерно так же. Словно очередная командировка."
2601503-65 = "Звучит довольно неблагодарно, да? Многие члены отряда что угодно отдали бы, чтобы приехать вместо меня."
2601503-66 = "...Наверное, мне и правда стоило промолчать."
2601503-67 = "[s5] «Нет, спасибо, что поделилась со мной.»\n[s6] «Я рад услышать, о чём ты думаешь.»"
2601503-70 = "Я всё ещё не до конца понимаю, почему, но в какой-то момент люди начали многого от меня ожидать."
2601503-71 = "Поэтому я решила, что должна соответствовать этим ожиданиям."
2601503-72 = "...Когда говоришь это вслух, звучит хуже, чем есть на самом деле."
2601503-73 = "Хм? Разве это не тяжело?"
2601503-74 = "Ну... Не то чтобы я единственный человек в мире, который так себя чувствует."
2601503-75 = "Каждый в той или иной форме с этим сталкивается."
2601503-76 = "На самом деле я бы сказала, что вам и моим старшим приходится куда тяжелее, чем мне."
2601503-77 = ""
2601503-79 = ""
2601503-80 = "...Подождите-ка."
2601503-81 = "Как это вообще превратилось в сеанс психологической помощи?"
2601503-82 = "[s7] «Я-я не понимаю, о чём ты.»\n[s8] «Ты прочитала мои мысли?!»"
2601503-85 = "Ха. Когда мы разговариваем вдвоём, Сенсей, меня всегда затягивает беседа."
2601503-86 = "Это, конечно, не плохо. На самом деле я... очень за это благодарна."
2601503-87 = "Просто иногда становится трудно скрывать от вас те стороны себя, которые я не хочу показывать."
2601503-88 = "Но теперь мне и правда стало немного легче!"
2601503-89 = "Сегодня я хорошо посплю, так что..."
2601503-90 = "Спасибо!"
2601503-92 = "Мы с Ичикой ещё немного прогулялись вдоль берега. Когда вернулись, уже было далеко за полночь."
