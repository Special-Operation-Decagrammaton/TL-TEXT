[translation]
201040-1 = "Эпизод 4;Ностальгия небесно-голубого цвета"
201040-2 = "Закончив встречу с Каей, я проводил Рин обратно к зданию Генерального ученического совета."
201040-3 = ""
201040-6 = ""
201040-7 = "...Меня правда не обязательно провожать."
201040-8 = "Уже слишком поздно, чтобы вам делать такой крюк ради меня."
201040-9 = "[s1] «Не обращай на меня внимания, я делаю это по собственному желанию.»\n[s2] «К тому же так поздно опасно ходить в одиночку.»"
201040-12 = "Хотя моя специализация — кабинетная работа, я всё же член Генерального ученического совета. Местные хулиганы не представляют для меня никакой угрозы."
201040-13 = "Если уж на то пошло, [USERNAME] Сенсей, куда в большей опасности окажетесь именно вы."
201040-14 = ""
201040-16 = ""
201040-17 = "...Хотя теперь это уже не имеет значения."
201040-18 = "Раз уж вы всё равно здесь, не хотите ненадолго зайти?"
201040-19 = "[s3] «Эм... Рин, хотя я прекрасно понимаю твои намерения...»\n[s4] «Идти домой к другому человеку на первом же свидании — это немного...»"
201040-22 = "Да прекратите уже?!"
201040-23 = "Я хотела осмотреть Посох Шакеда, о котором говорила Кая."
201040-24 = "Для Каи он выглядел обычными умными часами, но, возможно, на вас он отреагирует так же, как Ковчег Шиттим, Сенсей."
201040-25 = "И если это действительно то, чем она его назвала, он может помочь нам стабилизировать Кивотос."
201040-26 = "...Или даже дать подсказку о местонахождении президента."
201040-27 = "Поэтому я хочу изучить его как можно скорее."
201040-28 = "[s5] «Неужели мы настолько спешим??»\n[s6] «Сейчас у нас есть дела поважнее.»"
201040-31 = "Что может быть важнее поиска президента...?"
201040-32 = "[s] «Твой выходной, Рин.»"
201040-33 = ""
201040-35 = ""
201040-36 = "[ns7] «Сегодня ты должна отдыхать.»\n[ns8] «А значит, ты НЕ должна работать.»"
201040-39 = "...Понимаю."
201040-40 = "День был долгим, так что вам тоже стоит вернуться и отдохнуть, Сенсей."
201040-41 = "Тогда прошу меня извинить."
201040-42 = ""
201040-44 = ""
201040-46 = "Кладовая президента Генерального ученического совета"
201040-49 = ""
201040-50 = "Так это..."
201040-51 = ""
201040-53 = ""
201040-55 = "Посох Шакеда должен быть внутри этого сундука."
201040-56 = "Он заперт... но, кроме этого, ничего особенно необычного в нём не видно."
201040-57 = "...А что это за эмблема?"
201040-58 = "Она не принадлежит Генеральному ученическому совету... Значит, она принадлежала президенту? Что вообще означает эта эмблема?"
201040-59 = "И фраза, написанная ниже..."
201040-61 = "«Вознёс тебя из небес»."
201040-63 = "Пароль подключения подтверждён. Пользователь: главный администратор Нанагами Рин, действующая исполняющая обязанности президента Генерального ученического совета."
201040-64 = "Результат сравнения: совпадение голосового отпечатка с авторизованным лицом — 99%."
201040-65 = "...Подтверждено. Снимаю печать ковчега."
201040-66 = ""
201040-70 = "...Это было легко."
201040-71 = "Значит, эти часы действительно Посох Шакеда..."
201040-72 = ""
201040-74 = ""
201040-75 = "...Но для меня они выглядят как самые обычные умные часы."
201040-76 = "Похоже, Сенсей — мой единственный вариант."
201040-79 = ""
201040-80 = "Я задавалась тем же вопросом и о Ковчеге Шиттим: зачем президенту вообще были нужны эти предметы?"
201040-81 = "Я прекрасно понимаю, что только сверхчеловек способен двигать фигуры, из которых состоит этот мир."
201040-82 = "Но неужели доступ к оставленным вами фрагментам может получить только взрослый — такой, как Сенсей?"
201040-83 = "...Президент."
201040-84 = "Я недостаточно хороша, чтобы заполнить оставленную вами пустоту."
201040-85 = "Если вы меня слышите, мне всё равно, даже если это будет ложь..."
201040-86 = "...но можете сказать, что всё будет хорошо? Хоть что-нибудь?"
201040-87 = "Я..."
201040-88 = ""
201040-94 = ""
201040-95 = "...Ринни."
201040-96 = "Ринни! Что бы ты сделала, если бы однажды я просто исчезла?"
201040-97 = "Если вы планируете длительный отпуск, пожалуйста, подайте заявление минимум за две недели."
201040-98 = "Нет-нет! Я говорю гипотетически!"
201040-99 = "Что, если я получу травму или серьёзно заболею и не смогу прийти на работу..."
201040-100 = "Или если внезапно что-нибудь случится и я исчезну. Что ты почувствуешь, Рин?"
201040-101 = "Сложно всерьёз рассуждать о таком гипотетическом случае, но если это произойдёт..."
201040-102 = "В лучшем случае это создаст проблемы."
201040-103 = "Моя рабочая нагрузка, скорее всего, удвоится."
201040-104 = "Какая жестокость! И это всё, что я для тебя значу?"
201040-105 = "Разве это не очевидная мысль? Посмотрите хотя бы на объём и сложность работы, которой вы занимаетесь."
201040-106 = "Найти вам замену было бы невозможно."
201040-107 = "...Неправда. Если достаточно усердно трудиться и посвятить себя делу, любой способен на что угодно."
201040-108 = "На самом деле я совсем не настолько важна."
201040-109 = "И есть одна вещь, которую не заменит даже самый способный человек."
201040-110 = "А вон то..."
201040-113 = "...Рин."
201040-114 = "...Рин, просыпайся."
201040-115 = "Главный администратор Нанагами Рин!!"
201040-116 = "..."
201040-117 = "Этот голос..."
201040-118 = ""
201040-119 = "...Доброе утро, Рин."
201040-120 = "Ты уснула за работой?"
201040-121 = "Усердно работать — это хорошо, но сколько раз мне повторять? Всё это бессмысленно, если ты в процессе угробишь здоровье!"
201040-122 = ""
201040-124 = ""
201040-126 = "Ты..."
201040-127 = "...Кто вы?"
201040-128 = "Вы не член Совета... Как вы сюда попали?"
201040-129 = "Ой, как обидно! Ты уже забыла, как я выгляжу?"
201040-130 = "Может, ты всё ещё спишь!"
201040-132 = "Не верится, что мне приходится это делать, но представлюсь ещё раз."
201040-133 = "Я твоя давняя подруга..."
201040-134 = "...президент Генерального ученического совета, управляющего академическим городом Кивотос..."
201040-135 = "...Президент Генерального Студсовета."
201040-137 = "Следующий Эпизод;Ошибка в памяти"
