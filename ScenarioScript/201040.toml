[translation]
201040-1 = "Episódio 4; Nostalgia Azul-Celeste"
201040-2 = "（Após a visita a Kaya, acompanhei Rin até o Conselho Estudantil Federal）"
201040-3 = ""
201040-6 = ""
201040-7 = "...... Eu já tinha dito que não precisava me acompanhar até aqui."
201040-8 = "Por minha causa, o Sensei vai acabar chegando tarde em casa――"
201040-9 = "[s1] \"Não esquenta com isso, fiz porque quis.\"\n[s2] \"Uma moça andando sozinha a essa hora é perigoso, sabia?\""
201040-12 = "Por mais que minha rotina seja burocrática, ainda sou um membro oficial do Conselho Estudantil Federal.#nUm bando de arruaceiras comuns não seria problema nenhum para mim."
201040-13 = "Na verdade, quem corre perigo andando sozinho a essa hora é o próprio [USERNAME] Sensei......"
201040-14 = ""
201040-16 = ""
201040-17 = "...... Mas ficar discutindo isso a essa altura não faz sentido."
201040-18 = "Pensando bem, já que você se deu ao trabalho de vir até o Conselho,#npor que não entra para tomar alguma coisa?"
201040-19 = "[s3] \"Agradeço o convite, mas......\"\n[s4] \"Subir no quarto de uma aluna a essa hora pega meio mal......\""
201040-22 = "O QUE VOCÊ TÁ PENSANDO COM ESSA CABEÇA SUJA?!"
201040-23 = "Eu só ia pedir a sua ajuda para conferir uma coisa.#n...... Lembra do 'Cajado de Amendoeira' que a Kaya mencionou?"
201040-24 = "Mesmo que aos olhos da Kaya parecesse um smartwatch qualquer, quem sabe o Sensei consiga enxergar o valor real dele,#nassim como aconteceu com a Arca de Shittim."
201040-25 = "Se aquilo for mesmo um artefato deixado pela Presidente do Conselho,#npode ser a chave para apaziguar a crise em Kivotos, ou até mesmo――"
201040-26 = "Pode se tornar a pista decisiva para desvendar o paradeiro da Presidente."
201040-27 = "Quero iniciar as investigações o mais rápido possível."
201040-28 = "[s5] \"Não precisa dessa pressa toda, sabia?\"\n[s6] \"Temos algo muito mais importante para focar agora.\""
201040-31 = "O que poderia ser mais importante do que encontrar a Presidente do Conselho――"
201040-32 = "[s] \"A sua folga, Rin.\""
201040-33 = ""
201040-35 = ""
201040-36 = "[ns7] \"Hoje é o seu dia de descanso, não é?\"\n[ns8] \"Então nada de encostar em trabalho por hoje.\""
201040-39 = "...... Está bem, você venceu."
201040-40 = "Muito obrigada por me acompanhar ao longo de todo o dia de hoje. O Sensei também merece um bom descanso."
201040-41 = "Com licença, vou me recolher."
201040-42 = ""
201040-44 = ""
201040-46 = "Depósito do gabinete da Presidente do Conselho"
201040-49 = ""
201040-50 = "Este é...... o relicário."
201040-51 = ""
201040-53 = ""
201040-55 = "O 'Cajado de Amendoeira' deve estar guardado aqui dentro......"
201040-56 = "Por fora parece intacto, mas...... está trancado."
201040-57 = "...... E este símbolo?"
201040-58 = "Nunca vi uma marca como essa...... não parece ter sido feita pela Presidente.#nPor que isso estaria aqui......?"
201040-59 = "As palavras entalhadas dizem......"
201040-61 = "\"Aquele que vos conduz para fora do paraíso.\""
201040-63 = "Senha reconhecida.#nUsuária: atual Presidente Interina, Administradora-Chefe Nanagami Rin."
201040-64 = "Permissão de acesso confirmada. Reconhecimento de voz―― 99% de compatibilidade."
201040-65 = "...... Autenticação concluída. Destravando o selo do relicário."
201040-66 = ""
201040-70 = "Abriu tão fácil assim......"
201040-71 = "Então este é...... o 'Cajado de Amendoeira'......"
201040-72 = ""
201040-74 = ""
201040-75 = "Realmente parece apenas um smartwatch comum, mas......"
201040-76 = "Acho melhor pedir a avaliação do Sensei depois."
201040-79 = ""
201040-80 = "Mas me pergunto...... tanto este relógio quanto a Arca de Shittim, para que propósito a Presidente os utilizava?"
201040-81 = "Será que apenas uma super-humana como você é capaz de exercer o controle perfeito sobre este mundo......?"
201040-82 = "Será que alguém precisa ser um adulto como o Sensei,#npara ter permissão de ao menos tocar nos vestígios que você deixou para trás?"
201040-83 = "...... Presidente."
201040-84 = "Num mundo sem você...... eu não tenho a menor confiança de que serei capaz de cumprir o seu papel."
201040-85 = "Se você puder ouvir a minha voz, nem que seja uma mentira piedosa――"
201040-86 = "―― Por favor, me diga que vai ficar tudo bem."
201040-87 = "Eu só queria......"
201040-88 = ""
201040-94 = ""
201040-95 = "...... Rin-chan."
201040-96 = "Se um dia eu sumisse, o que você faria?"
201040-97 = "Se estiver planejando tirar férias prolongadas, faça o favor de solicitar com duas semanas de antecedência."
201040-98 = "Não tô falando disso! É uma suposição!"
201040-99 = "E se eu sofrer um acidente ou ficar doente e não puder vir ao Conselho――"
201040-100 = "Ou se eu me meter num problemão do nada e desaparecer, o que a Rin-chan faria?"
201040-101 = "É uma hipótese difícil de conceber, mas se algo assim viesse a acontecer......"
201040-102 = "...... Seria um tanto inconveniente."
201040-103 = "Se a Presidente sumisse do nada, a minha carga de trabalho dobraria instantaneamente."
201040-104 = "Que crueldade! Até numa hora dessas você só pensa em trabalho?!"
201040-105 = "Mas é claro. Considerando o volume colossal de atribuições que a Presidente despacha――"
201040-106 = "Não existe ninguém em Kivotos capaz de assumir o seu lugar."
201040-107 = "...... Não é bem assim, sabia?#nCom esforço e dedicação, qualquer pessoa consegue alcançar qualquer coisa.#nMesmo que leve um tempinho a mais."
201040-108 = "O meu papel aqui nem é grande coisa assim."
201040-109 = "Mas tem uma única coisa...... que nem a pessoa mais brilhante do mundo jamais conseguiria substituir."
201040-110 = "E essa coisa é......"
201040-113 = "...... Rin."
201040-114 = "...... Rin, acorda, por favor."
201040-115 = "Administradora-Chefe Nanagami Rin!!"
201040-116 = "......"
201040-117 = "Essa voz......"
201040-118 = ""
201040-119 = "...... Bom dia!"
201040-120 = "Ficou trabalhando até tarde ontem de novo?"
201040-121 = "Dedicar-se ao trabalho é louvável, mas já te disse mil vezes que passar dos limites acaba sendo um tiro pela culatra."
201040-122 = ""
201040-124 = ""
201040-126 = "Quem......"
201040-127 = "...... Quem é você?"
201040-128 = "Como foi que você entrou aqui......?"
201040-129 = "Poxa vida...... já se esqueceu de mim? Não fala essas coisas que meu coração aperta!"
201040-130 = "Ou será que você ainda tá meio dormindo?"
201040-132 = "Deixe-me me apresentar formalmente mais uma vez, então."
201040-133 = "Eu sou a sua velha e grande amiga――"
201040-134 = "E a líder máxima do Conselho Estudantil Federal, que governa esta cidade acadêmica de Kivotos."
201040-135 = "A Presidente do Conselho Estudantil Federal."
201040-137 = "No Próximo Episódio; Falha na Memória"