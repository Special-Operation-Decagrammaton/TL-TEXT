[translation]
21030-1 = "Episódio 3;Rumo às Ruínas"
21030-2 = "Ruínas"
21030-5 = "..."
21030-6 = "..."
21030-7 = "...Ei, mana."
21030-8 = "Até quando vamos ter que ficar assim?"
21030-9 = "Fica quieta. Ah, Sensei, abaixa um pouquinho mais a cabeça...!"
21030-16 = "..."
21030-17 = "... ■■■ ■■■■..."
21030-20 = "... ■■■."
21030-21 = "■■■■ ■■."
21030-27 = "...Ufa, será que já foi embora?"
21030-28 = "Beleza, então vamos."
21030-29 = "Beleza nada!"
21030-30 = "Que lugar é esse, afinal?! Tem uma quantidade incontável desses robôs misteriosos rondando por aí!"
21030-31 = "Como assim que lugar... Já falei várias vezes."
21030-34 = "São as \"Ruínas\"."
21030-36 = "Como é uma zona de acesso proibido, eu até já esperava algum perigo, mas... nossa, dá um frio na espinha..."
21030-37 = "O que será que eram aqueles robôs...?"
21030-38 = "Não, mais do que isso... o que exatamente são essas \"Ruínas\" onde tantos deles ficam perambulando?"
21030-39 = "Hmm, eu também só ouvi umas coisinhas da Veritas, então tem muita coisa que não sei, mas..."
21030-40 = "Eu já cheguei a contar pro Sensei que o acesso aqui era estritamente restrito, né?"
21030-41 = "[s1] \"Sim, até aí eu ouvi.\"\n[s2] \"Onde eu estou... quem sou eu...?\""
21030-42 = "Já que chegamos até aqui, vou explicar de novo. Quem restringiu o acesso a este lugar e tentou esconder a própria existência dele ao máximo foi..."
21030-43 = "O status do Sensei tá em Confusão, então vou explicar de novo. Quem restringiu o acesso a este lugar e tentou esconder a própria existência dele ao máximo foi..."
21030-44 = "A Presidente do Conselho Estudantil Geral."
21030-45 = "A Presidente do Conselho Estudantil Geral...? Aquela que ficava no topo de todas as presidentes de conselho estudantil de Kivotos e desapareceu de repente?"
21030-46 = "Isso mesmo. Depois que ela sumiu, as forças do Conselho Estudantil Geral também se retiraram, e parece que o lugar acabou ficando abandonado."
21030-47 = "Graças a isso a gente conseguiu entrar aqui, mas... enfim!"
21030-48 = "Sem a segurança do Conselho Estudantil Geral e com a ajuda da Veritas, conseguimos chegar até aqui."
21030-49 = "Segundo a Himari-senpai, este lugar..."
21030-50 = "\"Talvez seja uma espécie de esgoto das eras, onde se acumulam as coisas que desapareceram e foram esquecidas por Kivotos\"... foi o que ela disse."
21030-51 = "Himari-senpai...? Aquela Himari-senpai bonita da Veritas, que anda de cadeira de rodas?"
21030-52 = "É bem raro ver a Himari-senpai — que sempre age como um sábio de RPG com cara de \"eu sei de tudo\" — usar a palavra \"talvez\"... Isso mostra o quanto este lugar é um mundo desconhecido."
21030-53 = "Mas por que o G.Bible estaria num lugar desses... Espera, calma aí?!"
21030-54 = "Não me diga que... você disse que o G.Bible estava aqui só porque ouviu que é \"onde se acumulam as coisas desaparecidas e esquecidas por Kivotos\"?! V-Você trouxe a gente pra cá só por causa disso?!"
21030-55 = "Não é só isso, não! Quando pedi pra Veritas procurar o G.Bible, elas me passaram umas coordenadas. As \"últimas coordenadas onde o funcionamento do G.Bible foi registrado\"."
21030-56 = "E essas coordenadas apontavam para um \"lugar que não existe em mapas comuns\"."
21030-57 = "Então isso quer dizer que...?!"
21030-58 = "Exato."
21030-59 = "Juntando as duas coisas, o G.Bible com certeza deve estar aqui... nas \"Ruínas\" cuja existência foi escondida esse tempo todo."
21030-60 = "[s] \"Afinal, o que é o G.Bible mesmo?\""
21030-61 = "Pensando bem, eu parei no meio da explicação disso também, né."
21030-62 = "Resumindo, na antiga Millennium... não, na antiga Kivotos..."
21030-63 = "Existia um criador de jogos lendário."
21030-64 = "E o que essa pessoa criou enquanto estudava na Millennium foi o \"G.Bible\"."
21030-65 = "Eu não sei os detalhes do conteúdo, mas..."
21030-66 = "Dizem que lá dentro tem o \"método secreto para criar o melhor jogo de todos\"."
21030-67 = "...Isso não é só propaganda de alguma escola de desenvolvimento de jogos, não?"
21030-68 = "Claro que não! O G.Bible existe, sim! A \"Bíblia dos Jogos\" que te permite fazer o jogo perfeito depois de ler com certeza existe!"
21030-69 = "Se a gente ler esse G.Bible, vamos conseguir fazer o jogo supremo... \"Tales Saga Chronicle 2\"!"
21030-70 = "Se a gente seguir até essas coordenadas que a Veritas passou, o G.Bible com certeza vai estar lá..."
21030-72 = "..."
21030-73 = "...■■■ ■■■■!"
21030-74 = "A-Aquilo é...!"
21030-75 = "Um robô?!"
21030-83 = "E-Eles não estão mirando bem na gente?! Estão todos vindo pra cá?!"
21030-84 = "D-Desse jeito vamos acabar cercadas!"
21030-85 = "Uaaah, o q-que a gente faz?!"
21030-86 = "[s] \"Ali! Dá pra ver algo parecido com uma fábrica!\""
21030-87 = "Hã? U-Uma fábrica?!"
21030-88 = "Oh, boa, Sensei! Depressa! Vamos abrir caminho pelos robôs e nos abrigar naquela fábrica!"
21030-89 = "Sensei, por favor, comande o combate!"
