21030-27 = "Фух. Они ушли?"
21030-28 = "Хорошо. Идём."
21030-29 = "Ничего не хорошо!"
21030-30 = "Что это за место? Оно кишит странными роботами!"
21030-31 = "В смысле? Я же рассказывала перед тем, как мы сюда пришли."
21030-32 = ""
21030-34 = "Это руины."
21030-36 = "Но я понимаю, о чём ты. Я знала, что это место считается опасным. Но всё же..."
21030-37 = "Почему здесь столько роботов?"
21030-38 = "Зачем им вообще охранять эти руины?"
21030-39 = "Я знаю лишь то немногое, что услышала от Веритас..."
21030-40 = "Я ведь уже говорила, что доступ сюда сильно ограничен, да?"
21030-41 = "[s1] «Ты упоминала это несколько раз.»\n[s2] «Как я сюда попал? Что происходит?»"
21030-42 = "Раз уж мы здесь, объясню ещё раз. Доступ к этому месту ограничила и пыталась скрыть само его существование никто иная, как..."
21030-43 = "Раз уж мы здесь, объясню ещё раз. Доступ к этому месту ограничила и пыталась скрыть само его существование никто иная, как..."
21030-44 = "...Президент Генерального Студсовета."
21030-45 = "Ты про президента, которая стоит над всеми остальными? Ту, что внезапно исчезла?"
21030-46 = "Именно. Генеральный Студенческий Совет даже держал здесь войска, но после её исчезновения их вывели."
21030-47 = "Иначе мы бы так далеко не пробрались. Но как бы то ни было!"
21030-48 = "Поскольку Генеральный Студсовет перестал скрывать это место и следить за ним, Веритас смогли провести нас внутрь."
21030-49 = "По словам Химари..."
21030-50 = "...в этих руинах могут храниться всевозможные давно утраченные вещи из прошлого Кивотоса."
21030-51 = "Химари? Ты про ту красивую старшекурсницу из Веритас, которая ездит на инвалидной коляске?"
21030-52 = "Она прямо как всезнающий мудрец из RPG. Если даже у неё есть сомнения... значит, это место действительно загадочное."
21030-53 = "Но почему ты решила, что Г.БИБЛИЯ здесь? ...Секундочку!"
21030-54 = "Только не говори, что ты решила, будто Г.БИБЛИЯ здесь, просто потому что так сказала Химари!"
21030-55 = "Не поэтому. Когда я попросила Веритас найти Г.БИБЛИЮ, они ещё проверили последнее место, где его активировали."
21030-56 = "Но результатом было \"область скрыта\"."
21030-57 = "Это значит...?!"
21030-58 = "Именно."
21030-59 = "Г.БИБЛИЯ где-то в этих руинах."
21030-60 = "[s] «Так что вообще такое эта Г.БИБЛИЯ, о которой вы говорите?»"
21030-61 = "Я собиралась рассказать вчера, пока Юука нас не прервала."
21030-62 = "В первые годы Милленниума — да и всего Кивотоса, если уж на то пошло..."
21030-63 = "...жил легендарный разработчик игр."
21030-64 = "Этот человек создал Г.БИБЛИЮ, будучи студентом Милленниума."
21030-65 = "Точные подробности неизвестны..."
21030-66 = "...но говорят, что там содержатся секреты создания идеальной игры."
21030-67 = "Звучит как маркетинговый ход какой-нибудь школы разработки игр."
21030-68 = "Нет! Г.БИБЛИЯ существует! Я знаю, что где-то есть библия создания идеальной игры!"
21030-69 = "Если мы доберёмся до Г.БИБЛИИ, Tales Saga Chronicle 2 станет идеальной!"
21030-70 = "Нам нужно лишь следовать координатам от Веритас, и мы наконец её найдём."
21030-71 = ""
