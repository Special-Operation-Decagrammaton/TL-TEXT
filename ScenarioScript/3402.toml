[translation]
3402-1 = "Слегка необычное утро в Шаньхайцзин 2"
3402-2 = "Должна сказать, нам действительно повезло."
3402-3 = "Я закончила всю работу на сегодня ещё до твоего прихода."
3402-4 = "[s1] «Кстати, об этом...»\n[s2] «...ты очень быстро справляешься с работой, Кисаки.»"
3402-7 = "Фуфу. Моё время крайне ограничено. Я не могу позволить себе терять ни минуты."
3402-8 = "К тому же людям от природы не свойственно встречать «работу» с распростёртыми объятиями."
3402-9 = "[s] «То есть... на самом деле ты лентяйка?!»"
3402-10 = "Интересно... Не могу сказать, что особенно люблю или не люблю работу."
3402-11 = "Скорее, я отношусь к ней так: «Я делаю это, потому что это нужно сделать»."
3402-12 = "А если сделать всё всё равно необходимо, эффективность и скорость — два инструмента, позволяющие сократить затраченное время."
3402-13 = "Да. Я бы сказала: «Если не хочешь работать — сделай работу»."
3402-14 = ""
3402-17 = "Хм? В обществе людей с таким образом мыслей называют «трудоголиками»?"
3402-18 = "Что это? А. Люди, которые зависимы от самой работы?"
3402-19 = "Казалось бы, для любой организации это только благо, но..."
3402-20 = "Ты знала, Сенсей?"
3402-21 = "Слишком старательный, слишком негибкий начальник... может измотать подчинённых."
3402-22 = "Если так подумать, несколько минут отдыха в главной комнате даже можно считать вкладом в будущее Генрюмон."
3402-23 = "Что скажешь, Сенсей?"
3402-24 = "[s3] «Хорошо, я тоже стану активнее и инициативнее...»\n[s4] «...и буду бездельничать вместе с Кисаки!»"
3402-27 = "Я бы, пожалуй, сказала, что ты и так делаешь этого вполне достаточно."
3402-28 = ""
3402-33 = "И-Инструктор Кокона?! Это же комната президента—"
3402-34 = ""
3402-37 = "Госпожа, госпожа! Эм, э-эм! Это правда?"
3402-39 = "О? Да это же инструктор Кокона."
3402-40 = ""
3402-43 = ""
3402-44 = "Ах, так нельзя. Я уже взрослая леди и инструктор, значит, должна соблюдать приличия."
3402-45 = "Здравствуйте, госпожа! Приветствую вас от Департамента дисциплинарной поддержки: инструктор первого года Сада цветущей сливы, Сунохара Кокона!"
3402-46 = "Сенсей тоже здесь? Что происходит?"
3402-47 = "[s] «Эм... Я просто зашла выпить чаю.»"
3402-49 = "Так нельзя, Сенсей! Не стоит попусту отнимать время президента!"
3402-50 = "Ничего страшного, инструктор Кокона. Но что привело тебя сюда? Давно я не видела тебя такой взволнованной."
3402-51 = "А, точно! Я хотела кое-что спросить!"
3402-52 = "Правда, что вы снова начали делать растяжку банзай?"
3402-53 = ""
3402-56 = "Р-Растяжку банзай...?"
3402-57 = "Э-Эм..."
3402-58 = "Госпожа?"
3402-59 = "Ничего. Мне просто... интересно, откуда ты услышала эту информацию."
3402-60 = "А, это! Я как раз хотела рассказать! В Шаньхайцзин об этом говорит куча людей!"
3402-61 = ""
3402-63 = ""
3402-64 = "...Что?"
3402-65 = "И вдобавок ходит целая куча странных слухов, которые я сама не очень понимаю."
3402-66 = "Не могла бы ты рассказать мне об этих... слухах?"
3402-67 = "Конечно! Например, говорят: «Как и ожидалось, президент не отказалась от растяжки банзай!»"
3402-68 = "А ещё: «Президент Генрюмон тайно использует все возможные способы, чтобы стать выше»."
3402-69 = "Ещё было: «Генрюмон наверняка сделал особый „заказ“ Сае из Восточного алхимического общества»."
3402-70 = ""
3402-72 = ""
3402-74 = "Нет, это, эм..."
3402-76 = "Чуть не забыла! «Генрюмон всегда может стереть с лица земли Променад Чёрной Черепахи, но не делает этого потому, что..."
3402-77 = "...Променад тайком готовит им еду, которая помогает расти!»"
3402-78 = "Есть ещё такое: «В день, когда госпожа станет выше, из Rikkagaku выпустят „нечто“, и тогда Шаньхайцзин станет величайшей академией Кивотос»."
3402-79 = ""
3402-81 = ""
3402-82 = "Кстати, последний слух правда, госпожа...?"
3402-83 = ""
3402-85 = ""
3402-86 = "Э-Эм... инструктор Кокона? Что касается слухов и молвы, обычно можно считать их ложными..."
3402-87 = "Фух, хорошо! Рада, что именно это я и сказала детям в Саду цветущей сливы!"
3402-88 = "Но я ещё подумала, что было бы здорово увидеть, как вы делаете Шаньхайцзин величайшей академией во всём Кивотос!"
3402-89 = "Я сделаю всё возможное, чтобы достичь этой цели без фантазий и беспорядочных слухов..."
3402-90 = "Ладненько!"
3402-91 = "Ох. Я взволнована. За моей утренней зарядкой нет никакого тёмного скрытого мотива."
3402-92 = "Подумать только, она породила слухи о росте и каких-то странных коварных заговорах. Быть президентом утомительно."
3402-93 = "[s5] «И правда нет никакой причины?»\n[s6] «НИ ОДИН из слухов не правдив?»"
3402-96 = "Хм?"
3402-97 = "Ты... тоже считаешь, что я вообще больше не вырасту?"
3402-98 = "[s] «Ч-Что...?!»"
3402-99 = "Иными словами, ты думаешь, что я останусь такой навсегда?"
3402-100 = "Тебя это устраивает, Сенсей?"
3402-101 = "Разве люди не существуют для того, чтобы упорно и бесконечно сопротивляться судьбе?"
3402-102 = "[s] «Я не это имела в виду! Я уважаю твоё стремление расти, Кисаки!»"
3402-103 = "Фуфу... Тогда спрошу ещё раз."
3402-104 = "Значит ли это, что ты, Сенсей, веришь слухам о том, что я тренируюсь в надежде стать выше?"
3402-105 = "И вдобавок считаешь меня человеком нерациональным, следующим таким же нерациональным рассуждениям?"
3402-106 = "Ты пробудила моё любопытство. Каким студентом ты считаешь Рюугэ Кисаки?"
3402-107 = "[s] «Э-Это...!»"
3402-109 = "[ns] «Прости! Пощади меня!»"
3402-110 = "Фуфу. Не переживай так, Сенсей. Ещё немного, и мне самой захочется извиниться."
3402-111 = "Простите... мне кажется, обо мне забыли."
3402-112 = "Мои извинения, инструктор Кокона. Ты случайно не слышала ещё подобных... историй?"
3402-113 = "А, насчёт этого! Тут слухи становятся совсем странными, но..."
3402-114 = "Я слышала, что существует фракция «Госпожа за кунг-фу», которую возглавляет Рэйдзё с Променада Чёрной Черепахи. Клуб исследования боевых искусств тоже в ней."
3402-115 = "А ещё фракция «Госпожа за пекинскую оперу», организованная Клубом пекинской оперы. Говорят, в тайных каналах между ними идёт ожесточённая борьба!"
3402-116 = "?!"
3402-117 = "[ns] «Что это вообще значит?!»"
3402-118 = "Я же сказала, сама не понимаю!"
3402-119 = "(«Фракция кунг-фу» и «Фракция пекинской оперы»? Звучит странно, но почему-то знакомо...)"
3402-120 = "(Почему у меня от этого такое тревожное предчувствие?)"
3402-121 = "В любом случае! Если вы и правда просто делаете зарядку по утрам..."
3402-122 = "Мы с детьми из Сада цветущей сливы тоже хотим присоединиться! Можно...?"
3402-123 = "Я вроде как бросила растяжку банзай, когда узнала, что она на самом деле не помогает расти..."
3402-124 = "...но думаю, если вы будете с нами, мы все найдём мотивацию! Мы с детьми точно сможем заставить себя вставать пораньше!"
3402-125 = "[s] «Ты права! Физические упражнения полезны для здоровья детей!»"
3402-126 = "С-Сенсей...?"
3402-127 = "..."
3402-128 = "Фуфу. Понимаю. И инструктор Кокона, и Сенсей приводят отличные аргументы."
3402-129 = "Будущее Шаньхайцзин — в Саду цветущей сливы."
3402-130 = "Не вижу никаких минусов в том, чтобы встречать утро вместе с нашим светлым будущим."
3402-131 = "Правда? Ура! Спасибо, госпожа!"
3402-132 = "Разумеется, Сенсей тоже присоединится."
3402-133 = "[s] «А...? Я-я тоже?!»"
3402-134 = "Конечно. Упражнения полезны для здоровья."
3402-135 = "А свежий утренний воздух даст ещё больше пользы, согласна?"
3402-136 = ""
3402-142 = "Не так быстро. И куда это ты собралась убежать, Сенсей? Наверняка у тебя есть КРАЙНЕ срочное дело."
3402-143 = "[s] «Нет, но что, если сказать, что оно, вероятно, скоро появится?»"
3402-144 = "Не пойдёт."
3402-145 = ""
3402-148 = "Не надо дуться. Ты ведь взрослая, разве нет?"
3402-150 = "В итоге мы договорились делать утреннюю зарядку в Парке Белого Тигра..."
