[translation]
10055130-1 = "Эпилог;Буйный вестник океана"
10055130-2 = ""
10055130-3 = ""
10055130-4 = "Я-я правда здесь... Я добралась до академии Геенна..."
10055130-5 = ""
10055130-7 = ""
10055130-8 = "Что и следовало ожидать от одной из трёх крупнейших академий Кивотоса... Здесь всё сверкает: от зданий до плитки под ногами..."
10055130-9 = ""
10055130-11 = ""
10055130-12 = ""
10055130-13 = "Ух ты, ух ты. Какой красивый кампус."
10055130-14 = "Хотя до корабля «Олимпос» из «Одиссеи» ему всё равно далеко."
10055130-15 = ""
10055130-17 = ""
10055130-18 = ""
10055130-19 = "...Неловко. Надо перестать вертеть головой."
10055130-20 = "И всё-таки наш председатель такая перестраховщица."
10055130-21 = "Раз дело касалось другой академии, можно было поручить его Айленд. Но не-е-ет, ей обязательно надо было отправить меня сюда лично извиняться!"
10055130-22 = "С другой стороны, хоть на берег выбралась."
10055130-23 = "Да и дело не такое уж долгое."
10055130-24 = "Если управлюсь быстро, может, на обратном пути случайно заблужусь... Всё-таки я здесь впервые, будет вполне естественно..."
10055130-25 = "А ещё биотоп Геенны славится среди коллекционеров насекомых разнообразными необычными растениями!"
10055130-26 = "Кто знает! Вдруг заблужусь и наткнусь на редкое насекомое... Фу-фу-фу..."
10055130-27 = "И-и! Но ничего не выйдет, если я быстро не закончу дело!"
10055130-29 = ""
10055130-30 = "Эм, извините."
10055130-31 = "А? Ты кто?"
10055130-32 = "Меня зовут Комори Сумика. Я прибыла в качестве дипломатического посланника Морской академии «Одиссея»."
10055130-33 = "Дипломатического посланника?"
10055130-34 = "Не беспокойтесь, пожалуйста. Я лишь хотела попросить вас показать дорогу."
10055130-35 = "Я ищу..."
10055130-36 = ""
10055130-38 = ""
10055130-39 = "...Эм. Теперь, когда задумалась, я даже не знаю её имени."
10055130-40 = "Геенна большая академия, девчонка. Без имени тебе её непросто будет найти."
10055130-41 = "Можешь хоть описать её?"
10055130-42 = "О, это просто. Она очень важная персона в Геенне."
10055130-43 = "Важная персона..."
10055130-45 = ""
10055130-46 = "И у неё очень приметные длинные серебристые волосы."
10055130-47 = "Хм?"
10055130-48 = "А ещё она невероятно сильна в бою!"
10055130-49 = "А, тогда это может быть лишь один человек."
10055130-50 = ""
10055130-52 = ""
10055130-53 = ""
10055130-54 = "Должно быть, наш глава Префектуры, Сорасаки Хина."
10055130-55 = ""
10055130-56 = "Понятно. Глава Префектов Сорасаки Хина. Запомню."
10055130-57 = "Кстати, куда мне идти, чтобы с ней встретиться?"
10055130-58 = "Эм, ну..."
10055130-59 = "По правде говоря, в это время года я бы не советовала к ней ходить..."
10055130-60 = "...?"
10055130-61 = "Но хотя бы скажу, где она. Если пойдёшь вот сюда..."
10055130-68 = "Вулкан Хинном, район 94-13, предгорья"
10055130-69 = ""
10055130-70 = ""
10055130-71 = "*тяжело дышит* *задыхается*!"
10055130-72 = "Я тут буквально жарюсь заживо! Нестерпимая жара! За что мне всё это?!"
10055130-73 = "Любой другой на моём месте уже сгорел бы дотла! А если бы найти Сорасаки Хину отправили другого посланника, не меня?!"
10055130-74 = "Никогда не думала, что буду так скучать по синему морю..."
10055130-75 = "Хм. Вот это необычно."
10055130-76 = ""
10055130-77 = "Обычные студенты так далеко сюда не заходят."
10055130-78 = "Вы нас искали?"
10055130-79 = ""
10055130-81 = ""
10055130-82 = "Господи! Наконец-то! Я вас нашла!"
10055130-83 = "Да, мне непременно нужно кое с кем встретиться. С главой команды Префектов Сорасаки Хиной..."
10055130-84 = "А, с главой Префектов. Глава Префектов! К вам посетитель!"
10055130-85 = "А? В это время года?"
10055130-86 = ""
10055130-88 = ""
10055130-89 = "Во время летних полевых сборов команды Префектов сюда мало кто хочет приходить. Говорят что-то о «суровых условиях»..."
10055130-90 = "Раз уж вы приложили столько усилий, чтобы добраться сюда сейчас, причина наверняка очень важная."
10055130-91 = "..."
10055130-92 = "...?"
10055130-93 = "Ты кто?"
10055130-94 = "Вы сами меня искали. Я Сорасаки Хина."
10055130-95 = "Вы не глава Общества Пандемониум?!"
10055130-96 = "А?!"
10055130-98 = "После этого Сумика побрела обратно с горы с усталым, опустошённым взглядом."
10055130-99 = "...А Хину немного расстроило, что её перепутали с Макото."
