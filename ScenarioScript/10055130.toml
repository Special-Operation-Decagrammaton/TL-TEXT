[translation]
10055130-1 = "Afterword Part 4;The Lively Messenger from the Sea"
10055130-4 = "S-so, I've actually arrived at Gehenna Academy..."
10055130-8 = "As expected of one of Kivotos's three major academies... everything from the outer walls to the flooring is sparkling clean."
10055130-13 = "W-well, it's fine! It's just like this, right?"
10055130-14 = "It's nothing compared to the Odyssey's 'Olympus'!"
10055130-19 = "...I should try not to look around too much, it's embarrassing."
10055130-20 = "Still, the President is such a worrywart."
10055130-21 = "She could have just left inter-academy issues to the 'Island,' so why go through the trouble of apologizing?"
10055130-22 = "Well... thanks to that, I got to come to land, so I guess it's fine."
10055130-23 = "The errand itself is simple enough..."
10055130-24 = "I might have a l-little extra time, and since it's my first time here, I might get lost..."
10055130-25 = "P-perfect! Gehenna's biotope is famous for its unique vegetation and variety! It's a super popular spot among insect collectors!"
10055130-26 = "Yes... by c-coincidence! I might be able to meet some rare insects... hehehe..."
10055130-27 = "Ah, this isn't the time for that. Let's finish the errand quickly!"
10055130-30 = "Um, excuse me, sorry for the sudden interruption."
10055130-31 = "Hm? And you are...?"
10055130-32 = "I am Sumika Komori, a diplomatic envoy dispatched from Odyssey Maritime High School."
10055130-33 = "A... diplomatic envoy?"
10055130-34 = "Ah, no need to look so troubled. I just wanted to ask for directions."
10055130-35 = "The person I'm looking for is—"
10055130-39 = "...Huh? Come to think of it, I don't actually know their name."
10055130-40 = "Um, there are so many people in Gehenna, so if I don't know the name, it might be a bit..."
10055130-41 = "Are there any distinguishing features?"
10055130-42 = "Ah, that's easy. They're a very important person in Gehenna."
10055130-43 = "An important person..."
10055130-46 = "Also, they have striking silver hair."
10055130-47 = "...Hm?"
10055130-48 = "And! They're incredibly strong."
10055130-49 = "Ah, in that case, there's no mistake."
10055130-54 = "That would be our Prefect, Hina Sorasaki."
10055130-56 = "I see, Hina Sorasaki. I'll remember that."
10055130-57 = "Where can I go to meet her?"
10055130-58 = "Ah, um..."
10055130-59 = "Actually, I wouldn't recommend trying to meet her during this time of year..."
10055130-60 = "...?"
10055130-61 = "I'll tell you the location, at least. From here—"
10055130-68 = "Hinomu Volcano, District 94-13, Foothills"
10055130-71 = "Huff... huff... huff...!"
10055130-72 = "It's hot! It's so hot!! Why am I doing this...!!"
10055130-73 = "I mean, a normal person couldn't get here in a single day, right!? It's only because it's me that I could...!"
10055130-74 = "I never thought I'd miss the blue sea this much..."
10055130-75 = "Huh? That's rare."
10055130-77 = "It's not often that a civilian comes all the way out here."
10055130-78 = "Do you have business with us?"
10055130-82 = "Ah, finally, people...!"
10055130-83 = "Yes, there's someone I really need to meet. A person named Hina Sorasaki..."
10055130-84 = "Ah, the Prefect? Prefect, you have a visitor."
10055130-85 = "Hm? At this time of year?"
10055130-89 = "The Prefect Team's summer training camp... I thought it was fairly well-known."
10055130-90 = "If you're here despite that, it must be urgent."
10055130-91 = "..."
10055130-92 = "..."
10055130-93 = "Who might you be?"
10055130-94 = "...? You were the one who called for me, weren't you? I am Hina Sorasaki."
10055130-95 = "You're... not the head of Pandemonium Society!?"
10055130-96 = "!?"
10055130-98 = "(And so, Sumika descended the mountain with her eyes rolled back in her head.)"
10055130-99 = "(Meanwhile... Hina felt melancholic at being mistaken for Makoto.)"