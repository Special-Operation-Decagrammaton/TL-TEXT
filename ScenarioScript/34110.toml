[translation]
34110-1 = "Episódio 11;Perseguidora"
34110-2 = "Misono... Mika..."
34110-3 = "Hora da entrada da vilã☆, eu acho! ...Você ainda se lembrava de mim, é?"
34110-4 = "Não parece uma cara de \"que bom te ver\"... O que houve?"
34110-5 = "Olhando pra mim desse jeito, até parece que viu uma bruxa."
34110-6 = "...Ouvi dizer que você estava atrás das grades."
34110-7 = "Eu dei uma escapadinha☆#n...É que eu queria muito encontrar vocês logo."
34110-8 = "Afinal, olha só... acho que ainda temos umas coisinhas pra conversar, não temos?"
34110-13 = "..."
34110-14 = "...E o Sensei?"
34110-15 = "V-Vem logo atrás... Acho que deve chegar já, já..."
34110-17 = "Eu também agi junto com vocês por um bom tempo até agora, sabe? Então saquei na hora que viriam pra cá."
34110-19 = "...Quanto tempo até a passagem se fechar?"
34110-20 = "Faltam cerca de 28 minutos... Não me diga que pretende lutar? Enfrentar essa mulher agora seria pura imprudência."
34110-21 = "I-Imprudência, será...?"
34110-22 = "..."
34110-23 = "Pra piorar, nosso fôlego já está no limite depois de fugir sem parar de Arius com a Princesa.#nSem comando, não temos condições de lutar direito."
34110-24 = "Até agora há pouco estávamos conseguindo lutar de algum jeito graças ao comando do Sensei, mas..."
34110-25 = "Mika Misono... Mesmo para os padrões da Tea Party, ela possui uma força de combate anormal, totalmente fora de série. Para completar, um combate caótico como este é o campo de batalha mais vantajoso para ela."
34110-27 = "Ahaha☆ Acharam que eu era só uma mulherzinha tola e me subestimaram? Bem que eu imaginava.#nMas pelo menos os códigos de vocês eu consigo entender."
34110-28 = "Ainda lembro dos pontos de encontro, das bases e tudo mais.#nPor mais que não pareça, fui eu a mentora do golpe de Estado!"
34110-29 = "Ahaha. Vocês provavelmente me achavam uma idiota, né?#n...Fui fácil de usar? Bom, isso eu não vou negar."
34110-32 = "E se recuarmos e tentarmos de novo?"
34110-33 = "Impossível, não há tempo. A passagem vai se fechar em breve."
34110-34 = "E se ganharmos tempo até o Sensei chegar?"
34110-35 = "Isso..."
34110-37 = "Ei, ei, estão me ouvindo? Vão me ignorar?#nNão acham maldade me ignorar? Depois de termos dado um golpe de Estado juntas e tudo mais..."
34110-38 = "Isso aí... não é me deixar de fora do grupo?"
34110-48 = "Hii! E-Ela veio pra cá!?"
34110-50 = "Dispersem! Não recebam o ataque de frente!"
34110-61 = "[ns1] (Não consigo contato com o Esquadrão, que entrou na frente para informar a situação lá dentro.)\n[ns2] (Aqueles tiros de agora há pouco...)"
34110-67 = "[ns] (Preciso ir atrás delas rápido.)"
34110-76 = "U-Uugh... Ela é rápida demais..."
34110-83 = "Tsc..."
34110-88 = "Ei? Ei, ei, Saori? É só isso mesmo?"
34110-89 = "Até uma boneca de enfeite lutaria melhor do que você agora, não acha?#nO \"Esquadrão\" não é só isso, né? Ei, o que aconteceu?"
34110-94 = "Urgh..."
34110-95 = "Ué, falando nisso, está faltando uma, né? Cadê aquela garota calada de máscara?"
34110-97 = "...!!"
34110-99 = "Ah, não... Já acabou a munição?#nVamos, atira mais! Eu estou parada aqui tão indefesa, vai!"
34110-103 = "Gu, agh..."
34110-104 = "Misaki...!"
34110-105 = "Hã... Então vocês também se importam com as companheiras?#nEu jurava que só ficavam juntas por causa da missão."
34110-106 = "Qualquer pessoa tem alguém importante pra si, né? Aham, eu também tinha, então eu entendo.#n— Estou falando da Seia-chan, que vocês tentaram matar."
34110-107 = "Sabia? A Seia-chan tinha um talento genial pra tirar os outros do sério.#nNem sei quantas vezes quase dei um soco na cara dela!"
34110-108 = "Mas... mesmo achando ela insuportável no dia a dia, quando ela se machucou, eu fiquei preocupada.#nFiquei aflita querendo saber se ela estava bem."
34110-109 = "Quando ouvi que a Seia-chan tinha morrido, doeu demais.#n...Estranho, né? Só de conversar com ela eu já ficava irritada, mas não fiquei nem um pouquinho feliz."
34110-110 = "Claro que eu detestava a Seia-chan, tá? Ela só falava coisa sem pé nem cabeça.#nMas, pra mim, ela era uma pessoa importante.#n— Eu não queria que ela morresse. Tampouco pretendia virar uma assassina."
34110-111 = "Só que agora... tudo, tudinho foi em vão..."
34110-122 = "Gu—!!"
34110-124 = "Misaki!!"
34110-126 = "Eu... só disse pra darem um susto nela, não foi?#nQuando foi que eu mandei quebrarem o halo dela?"
34110-127 = "Bom, depois de eu mesma ter saído quebrando tudo por conta própria e estragado as coisas, sei que parece hipocrisia bancar a vítima agora, mas..."
34110-128 = "Mas..."
34110-129 = "Tudo... o que era importante pra mim... tudinho desapareceu, sabia?"
34110-130 = "Minha escola... minhas amigas... meu tesouro... o lugar pra onde voltar... até a promessa com o Sensei..."
34110-131 = "E eu acreditava que, quando o amanhã chegasse, tudo poderia voltar ao normal...#nMas isso só existe nos contos de fadas... Ahaha... Parece que o destino já está decidido."
34110-132 = "Por isso... vocês do \"Esquadrão\"... especialmente você, Saori.#nVocês também têm que sentir a mesma dor que eu."
34110-133 = "Tudo o que eu perdi, vocês vão perder também. Caso contrário... seria injusto, não acha?"
34110-138 = "...!!"
34110-146 = "[ns] \"Espere um pouco!!\""
34110-151 = "Se-Se-Sensei...!?"
34110-152 = "Sensei..."
34110-153 = "[ns] \"Mika... O que você está fazendo aqui?\""
34110-154 = "E-Eu... err... bom..."
34110-155 = "Mais importante, por que...?"
34110-156 = "E-Ei... Sensei!? Por que você está junto com o Esquadrão...?"
34110-157 = "N-Não era pra ser assim..."
34110-158 = "Ei... por que as coisas acabam assim...?#nLogo você tinha que me ver desse jeito... Por quê...?"
34110-164 = "Por aqui!"
34110-165 = "Mika Misono também está aqui! Atirem!!"
34110-175 = "[ns] \"Mika...!\""
34110-176 = "Cof... Sensei, não temos tempo... Precisamos entrar agora."
34110-177 = "[s3] \"Mika, por ora volte para Trinity! Eu explico depois!\"\n[s4] \"Me espere em Trinity! Eu prometo que vou voltar!\""
34110-178 = "Ali! O \"Esquadrão\" está ali!"
34110-179 = "Ali! O \"Esquadrão\" está ali!"
34110-183 = "T-Temos que correr! A passagem já vai se fechar!"
34110-184 = "[s] Entrar nas Catacumbas junto com o Esquadrão."
34110-185 = "Corram!"
34110-203 = "Arf, arf... U-Ufa, por pouco..."
34110-204 = "...Ainda há um tempo até a passagem se fechar por completo. Precisamos nos apressar antes que os perseguidores cheguem."
34110-205 = "Vamos avançar. Sensei, daqui em diante o caminho é complexo, então é melhor tomar cuidado."
34110-206 = "A-Aqui não pega nem sinal... Se a gente se perder no caminho, já era..."
34110-207 = "Mais adiante fica o Distrito Autônomo de Arius. Vamos."
34110-212 = "[ns] (Mika...)"
34110-214 = "[ns5] (Não me diga que ela fugiu da prisão para se vingar do Esquadrão?)\n[ns6] (O que será que aconteceu em Trinity...?)"
34110-218 = "Eles fugiram para as Catacumbas! Vamos atrás deles?"
34110-219 = "Ainda resta tempo, vamos atrás deles!"
34110-225 = "Aah, qual é, isso dói!"
34110-227 = "Mika Misono...!?"
34110-233 = "Humm, reforços?"
34110-234 = "Mika Misono... Durante um tempo, você apoiou o nosso Distrito Autônomo.#nEm consideração a isso, se sumir daqui agora mesmo, não faremos nada contra você."
34110-235 = "Que foi, que foi? Estão dizendo que vão me enfrentar só com esse tantinho de gente? Vocês têm cérebro na cabeça?"
34110-236 = "Que engraçado! Só porque estou sozinha, acham que podem vencer?#nPensando desse jeito, o dia a dia de vocês não deve ser nada fácil, né?"
34110-237 = "Pra onde o \"Esquadrão\" foi? Ei, por acaso estão tentando ganhar tempo?"
34110-238 = "Não... Quem estamos perseguindo é o \"Esquadrão\"."
34110-239 = "...Hã?"
34110-241 = "O \"Esquadrão\" traiu Arius e fugiu. Nossa missão é eliminá-las."
34110-242 = "Espera aí... Do que você está falando? Traição? Fugiram?"
34110-247 = "..."
34110-248 = "Ahaha☆ Então é isso... Que interessante, foram descartadas pelos próprios aliados?"
34110-249 = "...Saori, então esse é o seu desfecho."
34110-250 = "...Entendi. Cães de caça que falham na caçada não têm mais serventia, é isso."
34110-251 = "E o Sensei..."
34110-252 = "Mais uma vez, está se sacrificando por crianças em apuros, né?"
34110-253 = "Sinceramente, viu..."
34110-254 = "...Não tem jeito mesmo."
34110-255 = "Saia da frente! Se sair agora, faremos vista grossa."
34110-256 = "Relatório! Informaram que o Sensei da \"Schale\" está acompanhando o Esquadrão!"
34110-257 = "O-O quê!? Rápido, reportem isso a ela..."
34110-266 = "Ei, ei, não ouviram o que eu disse? O Esquadrão é meu.#nNão vou entregar pra ninguém."
34110-267 = "— Então, será que podem sumir daqui?"
34110-272 = "A-Atirem!!"
34110-289 = "Próximo;Distrito Autônomo de Arius"
