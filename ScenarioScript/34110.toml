[translation]
34110-1 = "Эпизод 11;Преследователи"
34110-2 = "Мисоно Мика..."
34110-3 = "Это моё имя! Значит, помнишь, да? ☆ Как тебе мой выход? Я старалась выглядеть крутой мстительной злодейкой."
34110-4 = "Не скучали по мне, старые друзья? Чего такие лица? Вы смотрите..."
34110-5 = "...будто увидели ведьму."
34110-6 = "Ты сбежала из тюрьмы, чтобы найти нас?"
34110-7 = "Хи-хи. Наверное. Просто захотелось увидеть своих девочек!"
34110-8 = "То есть у нас осталось ма-а-аленькое незаконченное дело. Правда, Саори?"
34110-9 = ""
34110-11 = ""
34110-13 = "..."
34110-14 = "*шёпотом* Где Сенсей?"
34110-15 = "Сенсей должен идти сразу за нами... Отстаёт максимум на несколько минут."
34110-17 = "Хотите знать, как я поняла, что вы здесь? Я внимательно следила. Снова и снова наблюдала за вашими методами. Вы настолько легко меня списали?"
34110-19 = "Сколько до закрытия прохода?"
34110-20 = "Около двадцати восьми минут. Если начнём драться сейчас, проиграем обе стороны и не успеем к входу."
34110-21 = "М-Мы проиграем?!"
34110-22 = "..."
34110-23 = "Мы уже несколько дней в бегах. Все вымотаны. Сейчас нас спасает тактическое преимущество, а не грубая сила."
34110-24 = "Командование Сенсея довело нас до этого места."
34110-25 = "Мисоно Мика — главная ударная сила Чаепития. Бой на чистой силе — именно то, чего она хочет."
34110-27 = "Вы правда считали меня тупой, да? А я раскусила вас в два счёта."
34110-28 = "Если помните, именно я начала переворот. Я знаю все ваши ключевые точки сбора и места встреч. Прощаю, что вы не знали, но вообще-то я довольно важная персона."
34110-29 = "Но конечно вы не знали. Вы считали меня дурочкой, которой можно врать. Манипулировать. Пользоваться. Ну... в этом вы не совсем ошибались."
34110-31 = ""
34110-32 = "Лучший вариант — отступить и перегруппироваться."
34110-33 = "Нет. Мы потеряем единственный шанс попасть в Ариус."
34110-34 = "Можно отвлекать её, пока не придёт Сенсей."
34110-35 = "Это..."
34110-37 = "Алло? Вы серьёзно меня игнорируете?! Это вообще-то ужасно невежливо. Неужели забыли старые добрые времена заговоров и предательств?"
34110-38 = "Придётся наказать вас, хулиганки!"
34110-39 = ""
34110-45 = ""
34110-47 = ""
34110-48 = "О-Она идёт!!!"
34110-50 = "Рассыпаться! Не вступать в прямой бой!"
34110-51 = ""
34110-61 = "[ns1] «(Отряд сказал, что разберётся впереди, но я не могу с ними связаться.)»\n[ns2] «(Мне только что послышались выстрелы?)»"
34110-62 = ""
34110-63 = ""
34110-67 = "[ns] Поспешить на звук."
34110-68 = ""
34110-76 = "К-Как она такая... сильная... быстрая... Ух!"
34110-77 = ""
34110-79 = ""
34110-83 = "Уф."
34110-84 = ""
34110-86 = ""
34110-87 = ""
34110-88 = "И это печально известный отряд Ариуса? Всё?"
34110-89 = "Ха-ха-ха! Вы всегда были такими слабыми? Даже дурочка дралась бы лучше. Ой, это потому что у вас много бо-бо? Ха-ха-ха! Умора!"
34110-90 = ""
34110-92 = ""
34110-93 = ""
34110-94 = "Угх..."
34110-95 = "А? Где та молчаливая девочка? В странной маске? Ничего, найду её после того, как закончу здесь."
34110-97 = "...?!"
34110-99 = "Что такое, Саори? Я открытая мишень! Стреляй! Патроны закончились?"
34110-100 = ""
34110-103 = "Чёрт..."
34110-104 = "Мисаки!"
34110-105 = "О, так вы теперь все дружочки? Я думала, бездушные идиоты из Ариуса умеют заботиться только о своих тупых миссиях."
34110-106 = "Мне совсем не нравится, что у тебя есть друзья, но отношения ВАЖНЫ. Знаешь что? У меня тоже был дорогой человек! Сэя? Помнишь, как пыталась её убить?"
34110-107 = "*вздох* Не пойми неправильно, ты не представляешь, сколько раз мне самой хотелось отвесить ей пощёчину. Сэя ужасно действует мне на нервы."
34110-108 = "Но знаешь, когда она получает ранения... я так волнуюсь, что больше ни о чём думать не могу."
34110-109 = "Представь, что со мной было, когда я услышала, что Сэя умерла! Я совершенно слетела с катушек! Чувства такие глупые."
34110-110 = "Даже если я её ненавидела и иногда хотела, чтобы она страдала, она была мне дорога... Я не хотела её смерти... Не хотела становиться убийцей..."
34110-111 = "Но теперь это уже неважно."
34110-112 = ""
34110-114 = ""
34110-122 = "А-А-А-А!"
34110-124 = "Мисаки?!"
34110-126 = "Я сказала проучить её, а не разрушать ей нимб! Разве нет?"
34110-127 = "Хотя нельзя сказать, что я совсем невиновна. Я ведь тоже всё испортила."
34110-128 = "Но знаешь... Я кое-что поняла."
34110-129 = "Из-за этого... инцидента я потеряла всё."
34110-130 = "Академию... друзей... дом... воспоминания... обещание с Сенсеем..."
34110-131 = "Вернуться к нормальной жизни? Второй шанс? Ха! Какая глупая фантазия. Назад уже ничего не вернуть."
34110-132 = "Я хочу, чтобы вы страдали, отряд. Саори. Я заставлю вас почувствовать мою боль."
34110-133 = "Вы узнаете мою потерю. Моё страдание. Мою сердечную боль. Это справедливо."
34110-134 = ""
34110-136 = ""
34110-138 = "...?!"
34110-139 = ""
34110-146 = "[ns] «Хватит, Мика!»"
34110-148 = ""
34110-149 = ""
34110-151 = "С-С-Сенсей...?!"
34110-152 = "Сенсей..."
34110-153 = "[ns] «Мика! Что ты здесь делаешь?!»"
34110-154 = "Я-я... эм... ну..."
34110-155 = "Я-я не понимаю. Почему?"
34110-156 = "Сенсей. Почему вы вместе с отрядом?"
34110-157 = "Т-Так не должно было случиться..."
34110-158 = "Я не думала, что Сенсей окажется здесь. Не хотела, чтобы вы это видели."
34110-159 = ""
34110-163 = ""
34110-164 = "Сюда!"
34110-165 = "Мисоно Мика на месте! Огонь!"
34110-166 = ""
34110-173 = ""
34110-175 = "[ns] «Мика...!»"
34110-176 = "*кашель* Ариус у нас на хвосте, Сенсей. Нужно оставить её."
34110-177 = "[s3] «Мика! Вернись в Тринити! Я всё объясню!»\n[s4] «Жди в Тринити! Я приду! Обещаю!»"
34110-178 = "Туда! Отряд обнаружен!"
34110-179 = "Туда! Отряд обнаружен!"
34110-180 = ""
34110-183 = "П-Проход сейчас закроется! Б-Быстрее!"
34110-184 = "[s] Войти в катакомбы вместе с отрядом."
34110-185 = "Бегите!"
34110-186 = ""
34110-203 = "*тяжело дышит* *тяжело дышит* М-Мы живы..."
34110-204 = "Еле успели. Нужно отойти дальше. Идём."
34110-205 = "Верно. Сенсей, держитесь рядом. Дальше путь сложный."
34110-206 = "И связи нет... так что если потеряетесь, потеряетесь навсегда-навсегда-навсегда."
34110-207 = "Я бы предпочла этого избежать. Ариус в эту сторону."
34110-208 = ""
34110-210 = ""
34110-212 = "[ns] «(Мика...)»"
34110-214 = "[ns5] «(Она сбежала из тюрьмы, чтобы отомстить отряду?)»\n[ns6] «(В Тринити всё в порядке?)»"
34110-218 = "Они ушли в катакомбы. Преследовать?"
34110-219 = "Мы ещё успеем! За ними!"
34110-220 = ""
34110-222 = ""
34110-223 = ""
34110-224 = ""
34110-225 = "Ой-ой-ой-ой!"
34110-227 = "Мисоно Мика?"
34110-228 = ""
34110-230 = ""
34110-233 = "О, подкрепление?"
34110-234 = "Мисоно Мика. Раньше вы поддерживали наше дело. Немедленно покиньте это место."
34110-235 = "Простите, кажется, я ослышалась. Вы думаете, что с таким числом сможете меня выгнать?"
34110-236 = "Ха-ха-ха! Думали, что у вас преимущество, потому что я одна? Тупость не лечится!"
34110-237 = "Куда ушёл отряд? Вы выигрывали им время?"
34110-238 = "Нет. Мы преследуем отряд со времён инцидента с Эдемским договором."
34110-239 = "...А?"
34110-241 = "Отряд предал Ариус и попытался сбежать. Нам приказано их уничтожить."
34110-242 = "Не может быть? Предали и сбежали?"
34110-243 = ""
34110-245 = ""
34110-246 = ""
34110-247 = "..."
34110-248 = "Ха-ха-ха! Становится всё смешнее! Они предали собственную школу? Почему?"
34110-249 = "А, понятно. Это твой большой финал, Саори? Наверное, так бывает, когда охотничья собака теряет цель. Хм."
34110-250 = "Начинаю понимать."
34110-251 = "А Сенсей... Хм..."
34110-252 = "Сенсей снова рискует собой ради кого-то в беде."
34110-253 = "Ох, ну конечно."
34110-254 = "Теперь всё понятно."
34110-255 = "Отступи, Мика. Если уйдёшь сейчас, мы забудем об этом."
34110-256 = "Доклад! Преподаватель Шале сопровождает отряд!"
34110-257 = "Что?! Нужно немедленно доложить ей."
34110-258 = ""
34110-260 = ""
