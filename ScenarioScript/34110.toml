34110-263 = ""
34110-266 = "Вы вообще меня слушаете? Отряд МОЙ. Не трогайте мои вещи."
34110-267 = "Знаете, что бывает с теми, кто лезет к чужому? Я вам объясню столько раз, сколько потребуется."
