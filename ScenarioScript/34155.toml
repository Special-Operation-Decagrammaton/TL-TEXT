[translation]
34155-3 = "Cof, cof..."
34155-4 = "Haa... ugh..."
34155-5 = "Finalmente conseguimos contê-la..."
34155-6 = "U-Uuh... Será que a derrotamos?"
34155-10 = "Nngh... Isso dói... Com o Sensei aqui, as coisas ficam mesmo complicadas..."
34155-11 = "[s1] \"Mika... a Seia provavelmente está a salvo.\"\n[s2] \"Então volte para Trinity... Eu não quero machucar você, Mika.\""
34155-12 = "Sensei..."
34155-13 = "Sensei..."
34155-14 = "Desculpa... Eu sou sempre assim, né...?"
34155-15 = "Uma aluna problemática como eu... que vive dando preocupação pro Sensei... Eu sei muito bem que não posso mais ficar ao seu lado..."
34155-19 = "Mas... eu..."
34155-21 = "Eu... pra mim..."
34155-23 = "Não existe mais um lugar pra onde voltar... Nem em Trinity... nem em lugar nenhum..."
34155-24 = "Porque eu sou a traidora de Trinity, a inimiga de todas...#n— a bruxa que machucou a Seia-chan tantas vezes..."
34155-25 = "Se eu for expulsa da escola, nunca mais vou poder ver a Nagi-chan... nem as pessoas que são importantes pra mim..."
34155-26 = "E quando eu deixar de ser uma aluna... uma garota problemática como eu, nem mesmo o Sensei vai querer me ver mais..."
34155-27 = "Eu sei muito bem... que nenhum futuro feliz vai chegar pra mim daqui pra frente..."
34155-28 = "E-Eu sou... uma vilã... uma assassina..."
34155-29 = "Por isso... a única coisa que me resta é isso aqui..."
34155-30 = "E mesmo assim, vocês... por quê?"
34155-31 = "Eu perdi tudo o que era importante pra mim!#n— Tiraram tudo de mim!!"
34155-32 = "Então por que... vocês?"
34155-34 = "..."
34155-35 = "..."
34155-36 = "..."
34155-40 = "Vocês saírem sem pagar preço nenhum, sem terem nada roubado de vocês..."
34155-41 = "Se eu permitir uma coisa dessas... eu..."
34155-42 = "Eu... vou deixar de ser qualquer coisa..."
34155-43 = "Não vai sobrar nenhum sentido pra mim..."
34155-44 = "Eu..."
34155-45 = "O que é que eu devo fazer...?"
34155-46 = "..."
34155-47 = "Eu não posso deixar o Esquadrão — a Saori, sair impune assim..."
34155-48 = "Essa mulher receber a proteção do Sensei sem pagar preço nenhum... isso não pode acontecer..."
34155-49 = "..."
34155-50 = "Por isso, Sensei, não tente me impedir, tá?"
34155-63 = "[ns] \"Mika!\""
34155-64 = "E-Ela foi embora...?"
34155-65 = "Mas qual é o problema... daquela mulher?"
34155-66 = "Você me odeia... tanto assim, Mika?"
34155-67 = "...Talvez não tenha jeito mesmo."
34155-68 = "O que a gente faz, líder? Aquela mulher parece que vai voltar a nos perseguir... Invadir a Basílica desse jeito pode ser meio perigoso."
34155-69 = "Arius, os Justina... e ainda por cima uma stalker... Não dá pra dar conta de tudo isso."
34155-70 = "...Vamos seguir pelo corredor subterrâneo do prédio antigo e entrar na Basílica."
34155-71 = "Não importa o que ela esteja planejando. Vamos... não temos tempo."
34155-75 = "S-Sim!"
34155-79 = "...Não tem outro jeito, né?"
34155-80 = "Vamos, Sensei."
34155-85 = "[ns3] Segui-las.\n[ns4] (Mika...)"
34155-91 = "Próximo;Corredor Subterrâneo"
