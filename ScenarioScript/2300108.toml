[translation]
2300108-1 = "Преданность президента Клуба школьного питания"
2300108-2 = "(Сегодня я должен помочь Фууке в столовой Геенны.)"
2300108-3 = "(Но когда я пришёл...)"
2300108-4 = "Сегодня студенты снова подали жалобу!"
2300108-5 = "[s] «Ф-Фуука?»"
2300108-6 = ""
2300108-7 = "(Это... мирин?)"
2300108-8 = "[s] «Только не говори, что ты это пила, Фуука!»"
2300108-9 = "Всего глоток! Мне нужно было попробовать рецепт!"
2300108-10 = "[s] «Но в нём есть алкоголь...»"
2300108-11 = "Сейчас не это проблема, Сенсей!"
2300108-12 = "Я вкладываю душу в то, чтобы готовить всем вкусную еду!"
2300108-13 = "[s] «Я-я знаю, Фуука. Все это понимают.»"
2300108-14 = "Но готовить огромными объёмами всегда сложнее. Еда получается хуже, а потом студенты жалуются."
2300108-15 = "И нет. Не все замечают мои старания так, как ты..."
2300108-16 = "Я понимаю, что ждать этого от всех нереалистично. Я это принимаю."
2300108-17 = "НО ВСЁ РАВНО!"
2300108-18 = "Это они перепутали обычную горчицу с караси только потому, что обе жёлтые!"
2300108-19 = "И после этого ещё смеют жаловаться, что еда слишком острая?!"
2300108-20 = "Если собираетесь каждый день ныть, попробуйте готовить сами!"
2300108-21 = "Они вообще понимают, насколько неблагодарная работа — быть президентом Клуба школьного питания?!"
2300108-22 = "[s] «Я-я знаю, иногда с этим тяжело справляться.»"
2300108-23 = "Подожди. У меня идея."
2300108-24 = "...А что если во всех рецептах заменить обычную горчицу на караси? Тогда они поймут, что значит жаловаться."
2300108-25 = "Это придаст школьным обедам Геенны совершенно новое значение..."
2300108-26 = "[s] «Д-Давай без безумств!»"
2300108-27 = "Я шучу. Для Клуба школьного питания намеренно портить еду — кощунство."
2300108-28 = "[s] «Вот и хорошо. Никто не вкладывает в готовку столько любви, сколько ты!»"
2300108-29 = "В конце концов, из-за проблем Клуба школьного питания не стоит лишаться сна."
2300108-30 = "Я выбираю дорожить тем, что делает меня счастливой — например, когда кто-то говорит, что ему нравится моя еда. А лучше всего..."
2300108-31 = "...ты пришёл мне помочь, и одного твоего присутствия достаточно, чтобы на душе стало тепло."
2300108-32 = "Хи-хи. Хи-хи-хи..."
2300108-33 = ""
2300108-34 = ""
2300108-35 = "[s] «Фуука?»"
2300108-36 = "..."
2300108-37 = "[s] «Ф-Фуука...?»"
2300108-38 = "Хр-р..."
2300108-39 = "(Тут мне в глаза бросилась задняя этикетка бутылки мирина.)"
2300108-40 = "(«Содержит 0,00003% алкоголя.»)"
2300108-42 = "(Я поклялся себе больше никогда не подпускать Фууку к алкоголю.)"
