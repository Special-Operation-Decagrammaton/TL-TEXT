[translation]
10048070-1 = "Эпизод 7;Час краж и контрабанды"
10048070-2 = "Далёкое кафе"
10048070-3 = "Солнце начинает садиться."
10048070-4 = "Подумать только, завтра ночью, уже в полной темноте, откроется специальная выставка Вероники."
10048070-5 = "Можешь представить великолепие и величие выставочного зала?"
10048070-6 = "Хм..."
10048070-7 = "Посетители будут плыть мимо искусства, не породив ни одной собственной мысли, будто их везёт конвейер."
10048070-8 = "И при этом толпиться перед известными работами, словно муравьи на конфете, кивая и мыча так, будто и правда что-то чувствуют."
10048070-9 = "А может, они действительно оценят выставку?"
10048070-10 = "Нет. Публика ничего не понимает. Они не чувствуют ни ауры подлинной работы, ни грубой неискренности подделки."
10048070-11 = "Они вообще не СМОТРЯТ на произведение, понимаете."
10048070-12 = "Для них всё решают репутация и цена. Именно ОНИ определяют, что люди будут изображать из себя."
10048070-13 = "Они изучают всё ВОКРУГ картины, но так и не видят её истинного облика."
10048070-14 = "...Я снова и снова задаюсь вопросом. Настанет ли день, когда люди начнут по-настоящему ценить настоящее искусство?"
10048070-15 = "Взойдёт ли когда-нибудь над массами рассвет истинного зрения?"
10048070-16 = "Сомневаюсь. Это солнце никогда не взойдёт."
10048070-17 = "Скажите, что вы думаете?"
10048070-18 = ""
10048070-20 = ""
10048070-21 = ""
10048070-22 = "Не знаю насчёт всего этого, но кафе сейчас закроется, так что можете встать, чтобы я сложил стулья?"
10048070-23 = "А, о, а, прошу прощения."
10048070-24 = "Т-Тогда прощайте!"
10048070-25 = ""
10048070-27 = ""
10048070-29 = "Хранилище Вайлдханта"
10048070-30 = "Фуфу, завтра открывается специальная выставка."
10048070-31 = "Мы уже не впервые охраняем хранилище, но сейчас нервничаю сильнее всего. Всё время кажется, что эта воровка вот-вот выпрыгнет из тени."
10048070-32 = "..."
10048070-33 = "Стоять на посту и так тяжело, а теперь ещё может быть замешана одна из Семи заключённых..."
10048070-34 = "Ну, если сегодня она не покажется у хранилища, думаю, уже не придёт."
10048070-35 = "Даже если она какая-то легенда, как она вообще сможет проскользнуть мимо, когда мы все стоим здесь вот так —"
10048070-36 = "Кстати об этом."
10048070-37 = "Хм?"
10048070-38 = "Как вы думаете, что именно мы защищаем и от кого?"
10048070-39 = "Эм... защищаем искусство от воровки? Точнее, экспонаты Вероники..."
10048070-40 = "Разве мы не защищаем эти работы от тех, кто хочет ими полюбоваться?"
10048070-41 = "О чём ты вообще? Выставка начинается завтра. Любой сможет прийти и посмотреть. У нас даже бесплатные билеты!"
10048070-42 = "Но... Фонд Вероники сам решил, какие работы достойны выставки."
10048070-43 = "Люди смогут увидеть только то, что отобрал Фонд. Они не могут свободно выбирать, на что смотреть."
10048070-44 = "Говорить, будто искусство доступно всем свободно... это иллюзия."
10048070-45 = "...Да, но мне казалось, всё, что хранится здесь, будет выставлено."
10048070-46 = "Возможно, но произведения в этом хранилище — всего 10% огромной коллекции Фонда Вероники."
10048070-47 = "Остальные 90% где-то под землёй собирают пыль в такой же гробнице, как эта."
10048070-48 = "Запертые в состоянии, где никто не может наслаждаться их красотой..."
10048070-49 = "Разве это... справедливо? Чтобы искусство «принадлежало» тому, кто лишь хочет копить его и держать взаперти?"
10048070-50 = "Фонд владеет всем этим, так что... ничего не поделаешь, верно? Что есть, то есть."
10048070-51 = "Наверное, ты права в том, что владелец решает, что выставлять. Но это его право."
10048070-52 = "Не уверена. Если кто-то «купит» все реки и озёра мира, а потом решит, что тебе нельзя пить... это тоже будет его право?"
10048070-53 = "Но это другое."
10048070-55 = "На самом деле нет."
10048070-56 = "Искусство и эстетика — неотъемлемые права. Красота заслуживает того, чтобы ею делились."
10048070-57 = ""
10048070-61 = ""
10048070-64 = "А? Что?! Свет...!"
10048070-65 = ""
10048070-69 = "*хлоп хлоп хлоп*"
10048070-70 = "Д-Дымовые шашки тоже...?!"
10048070-71 = "Э-Это Благородная воровка...?!"
10048070-72 = "Разделимся. Я прикрою заднюю дверь!"
10048070-73 = "Эм, да! Я к воротам!"
10048070-74 = ""
10048070-76 = ""
10048070-78 = ""
10048070-79 = "Итак, ты всё-таки пришла..."
10048070-80 = ""
10048070-82 = ""
10048070-83 = ""
10048070-84 = "...Благородная воровка."
10048070-86 = "Парк Вайлдханта"
10048070-87 = "Благородная воровка здесь! Отряды 1, 2, 3, доложить в зону A!"
10048070-88 = "Помните тренировки! Это наша школа, наша территория! Используйте преимущество!"
10048070-89 = ""
10048070-91 = ""
10048070-92 = "Есть, мэм! Направляемся в зону A прямо..."
10048070-93 = ""
10048070-95 = ""
10048070-98 = ""
10048070-99 = "А?!"
10048070-100 = "Доклад! Что у вас?!"
10048070-101 = "Два бойца отряда провалились в яму!"
10048070-102 = "В... яму...? Почему здесь...? Вытащите их!"
10048070-103 = "Есть! Тут... вижу следы лопаты. Это выкопано как ловушка!"
10048070-104 = "Ловушка?! Я не давала приказа —"
10048070-105 = ""
10048070-110 = "Дымовая шашка?"
10048070-111 = "*кашляет* Их так много. Где они...?"
10048070-112 = "А-а-а! Доклад! Я потеряла обзор!"
10048070-113 = "Кто мог это сделать?!"
10048070-117 = "А-а... У-у... Простите, Префектурный совет... Мне ТАК жаль, Хироми..."
10048070-118 = "Мы сделали их настолько безопасными, насколько смогли. Никто не должен пострадать..."
10048070-119 = "Ну как, Миё? Они провалились в ямы?"
10048070-120 = "Эм, да. Безупречная работа с ловушками, Рицу."
10048070-121 = "Эй, а я? Мне хоть немного похвалы не полагается?"
10048070-122 = "Нет. Мы с тобой всё ещё работаем. Магнат, бери №3 и №5. И... мотор!"
10048070-123 = "Ага. №3 и №5, запись пошла."
10048070-124 = ""
10048070-127 = "Ещё дым! Ложись! Или вставай! Или... а-а-а!"
10048070-128 = "Гах! Ух, ещё одна яма! Вытащите меня! Опять!"
10048070-129 = "Где?! Я ничего не вижу!"
10048070-131 = "Не расслабляйся, Писец. Один отставший идёт в твою сторону."
10048070-132 = "Принято. Магнат, следи за северо-восточным склоном. Твой фланг открыт. Двигайся медленно, не спеши."
10048070-133 = "Принято. Подтверждаю: силы развернуты у западных ворот тайника."
10048070-134 = "Дубль 12, по метке... мотор!"
10048070-135 = "№12... Площадка горячая."
10048070-136 = ""
10048070-138 = ""
10048070-139 = "Картинка чистая. Перехожу к управлению."
10048070-140 = "Принято."
10048070-141 = ""
10048070-143 = ""
10048070-144 = "*выдыхает*..."
10048070-145 = "Угх..."
10048070-148 = "На связи."
10048070-149 = "Миё? Ты выглядишь как-то... Ты в порядке?"
10048070-150 = "А как я могу быть в порядке? Посмотри на нас: пособничаем преступнице и нападаем на собственный Префектурный совет..."
10048070-151 = "Эй. Послушай, Миё. Каждый раз, когда этот голосок в голове начинает заставлять тебя чувствовать вину, вспоминай одну вещь."
10048070-152 = "Вспоминать что...?"
10048070-153 = "...Все те разы, когда Префектурный совет конфисковывал наш товар и урезал нашу прибыль!"
10048070-154 = "Ничего этого не случилось бы, если бы мы не занимались контрабандой!"
10048070-155 = "Миё, пожалуйста, ПОЖАЛУЙСТА, хоть раз будь позитивнее."
10048070-156 = "Если всё получится, мы не только вернём произведение искусства на законное место, но и перехитрим величайшую воровку в истории."
10048070-157 = "У этой истории, которую ты написала, может быть счастливый конец."
10048070-158 = "Счастливый... конец..."
10048070-159 = ""
10048070-161 = ""
10048070-162 = "Да, что бы я ни чувствовала, сейчас мы уже не можем закрыть книгу."
10048070-163 = "Давайте доведём всё до конца, до последней страницы."
10048070-164 = "Фую, сколько ловушек осталось?"
10048070-165 = "Ни одной. Все использовали."
10048070-166 = "Очень хорошо. Значит, мы сделали всё, что могли."
10048070-167 = "Теперь остаётся только надеяться, что Благородная воровка справилась."
10048070-168 = "А если даже после всей нашей помощи она всё равно облажается, может, ей пора на пенсию."
10048070-169 = "...И правда."
10048070-170 = "Теперь, Фую, настоящая «Любовь пурпурного и синего света» всё ещё у тебя?"
10048070-171 = "Конечно. Она цела и надёжно лежит в моём кейсе."
10048070-172 = "Хорошо, тогда отступаем."
10048070-173 = "В конце концов, солнце уже садится..."
10048070-175 = "Мне кажется, некоторые из лучших разговоров случаются в сумерках."
10048070-176 = ""
10048070-178 = ""
10048070-179 = "...!"
10048070-180 = "Покров темноты скрывает показные выражения дневного времени и позволяет говорить правду."
10048070-181 = ""
10048070-183 = ""
10048070-185 = ""
10048070-186 = "Добрый вечер, мои анонимные помощницы."
10048070-187 = "Приятно познакомиться. Я Благородная воровка."
10048070-188 = "Не желаете... немного побеседовать?"
