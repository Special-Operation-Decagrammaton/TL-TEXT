[translation]
1004303-1 = "Сдержать обещание"
1004303-2 = "По делам Шале я отправился на пляж готовиться к предстоящему летнему фейерверку."
1004303-7 = "Ого, спасибо, что так помогаете, Сенсей [USERNAME]."
1004303-8 = "[s] «Не за что, я просто делаю свою работу.»"
1004303-9 = "О боже. Вы всегда такой скромный."
1004303-10 = ""
1004303-13 = ""
1004303-14 = "К вам только что пришёл гость, Сенсей [USERNAME]."
1004303-15 = ""
1004303-18 = "[ns] «Гость?»"
1004303-19 = ""
1004303-24 = ""
1004303-25 = "[s] «Ну конечно... Вакамо!»"
1004303-26 = ""
1004303-28 = ""
1004303-29 = "О, хи-хи. Вы так рады меня видеть! Я в восторге..."
1004303-30 = "[s] «Я же сказал, что мы встретимся позже, потому что сейчас занят работой...»"
1004303-32 = "Серьёзно?"
1004303-33 = "О, вы действительно так сказали, а потом пообещали встретиться позже."
1004303-34 = "Так что после нашего разговора в MomoTalk я ждала и ждала..."
1004303-35 = "Через несколько часов уже стало «позже,» и я пришла убедиться, что вы сдержите обещание. Хи-хи-хи."
1004303-36 = "[s] «Я так и думал!»"
1004303-37 = "В-Вы не хотите, чтобы я была здесь...?"
1004303-38 = "Е-Если так..."
1004303-39 = "[s] «Нет, дело не в этом, просто у меня есть работа...»"
1004303-40 = ""
1004303-42 = ""
1004303-46 = ""
1004303-48 = "Если только в этом дело, всё нормально. Осталось не так много."
1004303-49 = "Я не хочу вас задерживать. Вы так усердно работаете! Торговая гильдия позаботится об остальном!"
1004303-50 = "[s] «Спасибо... Тогда пойдём?»"
1004303-51 = ""
1004303-54 = ""
1004303-55 = "Хи-хи-хи. Да!"
1004303-60 = ""
1004303-61 = "[ns1] «Итак, чем бы ты хотела заняться?»\n[ns2] «Какие у тебя планы?»"
1004303-64 = ""
1004303-66 = ""
1004303-67 = "Хи-хи-хи. Я заранее всё изучила и составила идеальный план."
1004303-68 = "Это мой особый план, чтобы сделать ваш день идеальным."
1004303-69 = "Я называю это..."
1004303-70 = "«Идеальный летний план свидания Вакамо!»"
1004303-71 = "Сенсей, как вы думаете, что самое необходимое на пляже?"
1004303-72 = "[s3] «Хм... Не уверен.»\n[s4] «Танк с секретными припасами?»"
1004303-73 = "Хи-хи-хи. Не волнуйтесь. Я подготовилась."
1004303-74 = "А? Танк... с припасами...?"
1004303-75 = "Эм, я не понимаю, что это значит, но..."
1004303-76 = "В первую очередь — еда!"
1004303-77 = "Хорошо! Давайте сделаем то, что не удалось в прошлый раз."
1004303-78 = "[s] «……?»"
1004303-82 = ""
1004303-83 = ""
1004303-84 = "Добро пожаловать! Два гостя!"
1004303-85 = "[s] «Это... пляжное кафе?»"
1004303-86 = "Да! Именно."
1004303-87 = "В прошлый раз вы хотели поесть колотый лёд, но у нас не получилось."
1004303-88 = "[s] «О, ты всё ещё об этом помнишь?»"
1004303-89 = ""
1004303-91 = "Хи-хи-хи... У них есть колотый лёд с фруктами, популярный среди пар."
1004303-92 = "Поэтому... я подумала, что будет здорово насладиться им, сидя прямо рядом с вами."
1004303-93 = "Хи-хи, вот такой план. Что скажете?"
1004303-96 = ""
1004303-97 = "Спасибо за ожидание. Ваш «Абсолютное летнее господство: колотый лёд с фруктовым сиропом и мякотью»!"
1004303-98 = "[s] «Какое броское название!»"
1004303-100 = "Хорошо, тогда... Я сяду рядом с вами."
1004303-101 = ""
1004303-103 = ""
1004303-104 = ""
1004303-106 = "Я вложу ложечку своей любви в этот колотый лёд и поднесу к вашим губам, чтобы вы попробовали..."
1004303-107 = "[s] «А-а-а. М-м...»"
1004303-108 = ""
1004303-112 = "[ns] «Да, вкусно.»"
1004303-113 = "О-Ох... В-Вы ни секунды не колебались... Съели всю ложку."
1004303-114 = "Я-я так взволнована, что чувствую, как щёки становятся горячими..."
1004303-115 = "[s] «Теперь твоя очередь.»"
1004303-116 = "А? Моя очередь? Но..."
1004303-117 = ""
1004303-120 = "[ns] «Вот, а-а-а...»"
1004303-121 = ""
1004303-123 = ""
1004303-124 = "К-Как неожиданно, что вы будете кормить меня."
1004303-125 = "Ох... Я-я-я..."
1004303-126 = "Л-Ладно, м-мне нужно отойти..."
1004303-127 = ""
1004303-131 = ""
1004303-132 = "[ns] «О! Прости, Вакамо. Подожди...»"
1004303-133 = ""
1004303-135 = "Простите, что так внезапно связываюсь!"
1004303-136 = "С фейерверками проблема!"
1004303-137 = ""
1004303-140 = "[ns] «Прости, Вакамо. Мне нужно разобраться.»"
1004303-141 = "А-А?"
1004303-142 = "О, конечно."
1004303-143 = "Вы всегда заняты делами Шале. Я не настолько бесстыдна, чтобы мешать вашей работе."
1004303-144 = "Удачи. Я буду ждать здесь."
1004303-145 = "[s] «Хорошо, прости! Я скоро вернусь!»"
1004303-146 = ""
1004303-151 = "Когда я вернулся после решения проблемы, прошёл уже час. Колотый лёд давно растаял."
1004303-154 = "[ns] «Прости! Мне правда очень жаль! Я куплю новый...»"
1004303-155 = "Нет, всё нормально! Не нужно извиняться!"
1004303-156 = "Мой план только начался!"
1004303-157 = ""
1004303-159 = ""
1004303-160 = "Пойдёмте в следующее место, Сенсей!"
1004303-161 = "[s] «Хорошо... Прости.»"
1004303-164 = "Следующий пункт плана — не что иное, как..."
1004303-165 = "Поиграть с вами в воде... как то плавание, которым вы хотели заняться!"
1004303-166 = "[s] «О, мы же на пляже, так что это легко.»"
1004303-167 = "Да, но я не хочу просто плескаться в воде..."
1004303-168 = "[s] «……?»"
1004303-169 = "Согласно моим исследованиям, есть особая игра, которую пары устраивают на пляже."
1004303-170 = "Я хочу сыграть в неё с Сенсеем."
1004303-171 = "[s] «Что это?»"
1004303-172 = "Говорят, сейчас это уже старомодно, но..."
1004303-173 = ""
1004303-175 = ""
1004303-176 = "Она называется... «Попробуй поймай меня»! Ахаха!"
1004303-177 = "[s] «Вот это ты хочешь попробовать?!»"
1004303-178 = "Это странно? Может, немного неловко."
1004303-179 = "Я слышала, влюблённые пары так делают, когда приходят на пляж."
1004303-180 = "[s] «Не... так уж странно.»"
1004303-181 = "Тогда начнём."
1004303-182 = "Хорошо, дорогой. Моё тело и душа готовы для вас."
1004303-183 = "А теперь вы должны..."
1004303-184 = ""
1004303-186 = ""
1004303-187 = "[ns] «А?»"
1004303-188 = "Убегать от меня так быстро, как только можете!"
1004303-189 = "А я буду преследовать вас изо всех сил, хоть до самого края света!"
1004303-190 = "Хи-хи-хи!"
1004303-191 = "[s] «Эм, Вакамо, я ожидал немного другого!»"
1004303-192 = "Я не позволю вам уйти!"
1004303-193 = ""
1004303-195 = ""
1004303-197 = ""
1004303-198 = "Дорогой!"
1004303-199 = ""
1004303-203 = "[ns] «П-Подожди! Вакамо! Мне звонят! Стой!»"
1004303-204 = "А..."
1004303-205 = ""
1004303-208 = "Сенсей [USERNAME]! Нам не хватает важных припасов!"
1004303-209 = "Можете их привезти?"
1004303-210 = ""
1004303-213 = "[ns] «Прости, Вакамо... Работа снова зовёт.»"
1004303-214 = "О, хорошо..."
1004303-215 = "Я буду терпеливо ждать здесь..."
1004303-217 = "Каждый раз, когда мы пытались выполнить план Вакамо, мне приходилось уходить из-за работы Шале."
1004303-220 = "Сенсей!"
1004303-221 = ""
1004303-226 = "Я... просто хочу быть здесь с вами..."
1004303-227 = ""
1004303-232 = "Эм..."
1004303-234 = "Когда я разобрался с кучей дел, уже начинало темнеть."
1004303-237 = "[ns] «Прости, Вакамо! Мне правда очень жаль! Не знаю, почему сегодня столько дел.»"
1004303-238 = "Хи-хи-хи. Всё нормально, Сенсей."
1004303-239 = "Я уже знаю, что вы очень занятой человек."
1004303-240 = "Но раз уж мы здесь, надо продолжить «Идеальный летний план свидания Вакамо»..."
1004303-241 = ""
1004303-243 = ""
1004303-244 = "Я хочу завершить день, глядя на закат на пляже..."
1004303-245 = ""
1004303-249 = ""
1004303-250 = "[ns5] «Кажется, снова звонят насчёт фестиваля фейерверков.»\n[ns6] «Прости, они никак не перестанут просить помощи.»"
1004303-251 = "Хи-хи-хи. Всё нормально. Я в порядке."
1004303-252 = "Хи-хи-хи. Всё нормально. Я в порядке."
1004303-253 = "Можете идти."
1004303-254 = "[s] «Прости!»"
1004303-255 = ""
1004303-258 = "Эти... фейерверки!"
1004303-259 = "Эти штуки разрушили мой драгоценный день с вами..."
1004303-260 = "Как... Как они смеют...!"
1004303-261 = "Как вы смеете мешать мне и Сенсею, фейерверки!"
1004303-262 = ""
1004303-264 = ""
1004303-265 = "О... Это может сработать..."
1004303-266 = "Хи-хи-хи... Способ сдержать обещание..."
1004303-267 = "Решение всё это время было прямо передо мной."
1004303-269 = "Ого, Сенсей [USERNAME]. Простите."
1004303-270 = "Но благодаря вам подготовка к фестивалю завершена идеально."
1004303-271 = "[s7] «Рад это слышать...»\n[s8] «(Вакамо ждёт. Нужно скорее возвращаться.)»"
1004303-272 = ""
1004303-273 = ""
1004303-276 = "И тут я получил немного зловещее сообщение..."
1004303-277 = ""
1004303-280 = "«Хи-хи-хи. Не волнуйтесь, дорогой. Я обо всём позабочусь.»"
1004303-281 = "[s] «Вакамо? Позаботишься о чём...?»"
1004303-282 = "Меня озадачило внезапное сообщение Вакамо."
1004303-283 = ""
1004303-285 = ""
1004303-286 = "П-П-Проблема! Какой-то странный человек вошёл на склад фейерверков с бомбой!"
1004303-287 = "А?"
1004303-288 = "[s] «Не может быть!»"
1004303-293 = "Склад фейерверков"
1004303-297 = ""
1004303-298 = "Да. Хи-хи-хи. Нужно было догадаться с самого начала..."
1004303-299 = "Всё здесь — то, что мешало моему времени с Сенсеем."
1004303-300 = "Мне нужно просто всё уничтожить!"
1004303-301 = "С-Стойте! Это опасно...!"
1004303-302 = "Хмф, ещё один незваный гость?"
1004303-303 = "Что бы вы ни сказали, я уже решила..."
1004303-304 = "[s] «Вакамо!»"
1004303-305 = ""
1004303-307 = ""
1004303-308 = "О, дорогой...?"
1004303-309 = "[s] «Вакамо, что ты пытаешься сделать?!»"
1004303-310 = "Хи-хи-хи! Я обещала сделать сегодняшний день особенным."
1004303-311 = "Эти препятствия постоянно нас прерывали..."
1004303-312 = "Да! Я собираюсь взорвать все фейерверки!"
1004303-313 = "Тогда мы сможем проводить время вместе без помех!"
1004303-314 = "[s] «Погоди, ты нигде не ранена?»"
1004303-315 = ""
1004303-317 = ""
1004303-318 = "Н-Нет, не особо..."
1004303-319 = "Э-Эм..."
1004303-320 = "[s] «Хорошо... Ты выглядишь нормально, ран не вижу.»"
1004303-321 = ""
1004303-323 = ""
1004303-324 = "[ns] «Тогда начну.»"
1004303-325 = "Хм?"
1004303-326 = "Э-Эм... Сенсей? Что вы собираетесь начать?"
1004303-327 = ""
1004303-330 = "[ns] «Ты собиралась взорвать склад фейерверков?! О чём ты вообще думала?!»"
1004303-331 = ""
1004303-333 = ""
1004303-334 = "Я крикнул громче, чем собирался."
1004303-335 = "... *икает*"
1004303-336 = "Н-Ну... Это фейерверки мешали нашему времени вместе, поэтому..."
1004303-337 = "Когда я это поняла, подумала, что если просто от них избавиться..."
1004303-338 = "...Если просто убрать их... мы сможем провести время вместе..."
1004303-339 = "[s] «А если бы кто-то пострадал?!»"
1004303-340 = "Н-Но... Но..."
1004303-341 = "[s] «А если бы пострадала ты?! Что тогда?»"
1004303-343 = "[ns] «Ты смогла бы после этого сказать, что делала это ради нас?!»"
1004303-345 = "[ns] «Ты бы сказала мне не беспокоиться о тебе?»"
1004303-347 = "[ns] «А как бы ты чувствовала себя на моём месте?!»"
1004303-348 = "Я... Я просто...!"
1004303-349 = "[s] «Если бы такое случилось, я бы никогда тебя не простил.»"
1004303-350 = ""
1004303-352 = ""
1004303-353 = "Вы бы... никогда меня не простили...?"
1004303-354 = "О нет. Нет, я не могу этого допустить..."
1004303-355 = "Я-я-я простите..."
1004303-356 = "Простите, что пыталась всё взорвать... Пожалуйста, не говорите, что не сможете меня простить..."
1004303-357 = "Е-Если бы вы меня возненавидели..."
1004303-358 = "Моя жизнь потеряла бы смысл... Моему сердцу некуда было бы деться... Пожалуйста, не говорите так... Простите..."
1004303-359 = "Простите... *рыдает*"
1004303-360 = "[s] «...Всё нормально. Пойдём назад.»"
1004303-362 = "К счастью, Вакамо остановили на месте до того, как случилась катастрофа, и я отвёл её обратно в общежитие."
