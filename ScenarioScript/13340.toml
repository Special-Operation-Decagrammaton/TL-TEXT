[translation]
13340-1 = "Episódio 34;Pedido de Desculpas"
13340-3 = "...Sensei."
13340-4 = "[ns] \"...?\""
13340-5 = "Ai... d-desculpe."
13340-6 = "Se eu não me arrumar logo, parece que a Hoshino-chan vai ficar brava..."
13340-11 = "Yume-senpai, Sensei [USERNAME], venham logo!#nNós vamos caçar tesouros no oásis, não é?!"
13340-12 = "Vou estar esperando lá no portão da escola!"
13340-13 = "Se não vierem logo, eu vou sozinha, viu?!"
13340-17 = "Hihi... ela parece tão animada."
13340-18 = "Acho que a Hoshino-chan mudou desde que você chegou, Sensei.#nAh, no bom sentido, é claro!"
13340-19 = "[s] \"...\""
13340-20 = "...Sensei?"
13340-21 = "[s] \"Yume...\""
13340-22 = "Por que está com essa carinha tão triste? Aconteceu alguma coisa?"
13340-23 = "Teve um pesadelo, talvez...?"
13340-24 = "[s] \"Me desculpe, Yume.\""
13340-25 = "...?"
13340-26 = "[s] \"Me desculpe... mesmo eu sendo um adulto.\""
13340-27 = "..."
13340-28 = "[ns] \"Se eu pudesse, eu...\""
13340-30 = "[ns] \"Eu...\""
13340-32 = "Sensei."
13340-33 = "Eu não sei direito o que está acontecendo, mas..."
13340-34 = "Com certeza não é culpa sua, Sensei."
13340-35 = "Por isso, acho que não precisa pedir desculpas."
13340-36 = "[ns1] \"Eu não consigo voltar no tempo.\"\n[ns2] \"Eu não consigo desfazer a morte.\""
13340-39 = "[ns] \"...Um poder assim não existe.\""
13340-41 = "[ns] \"Porque eu sou apenas uma pessoa comum.\""
13340-44 = "[ns3] \"Quando há alguém sofrendo na minha frente...\"\n[ns4] \"Estender a mão é o máximo que consigo fazer.\""
13340-47 = "...Sensei."
13340-48 = "Por enquanto, acho que isso já é mais do que suficiente."
13340-49 = "Porque pequenos esforços acumulados um dia se tornam um grande milagre!"
13340-50 = "Ah, se eu falar de milagres com tanta facilidade,#ncapaz de levar bronca de novo, mas..."
13340-51 = "Eu acredito... não, eu quero acreditar."
13340-55 = "[ns] \"Não vou esquecer essas suas palavras, Yume.\""
13340-56 = "A-Ah, não tinha um significado tão profundo..."
13340-60 = "...Sensei, agora você vai salvar alguém que está sofrendo?"
13340-61 = "[s] \"Eu quero salvar quem estiver ao meu alcance.\""
13340-62 = "Espero que consiga salvá-la!"
13340-63 = "[s] \"Eu vou conseguir salvá-la.\""
13340-73 = "[ns] \"Acho que devo dizer 'prazer em conhecê-lo', não é?\""
13340-74 = "Você é... Sensei [USERNAME]?!"
13340-75 = "C-Como você veio parar aqui...?!"
13340-76 = "[s] \"Finalmente nos encontramos, Morador do Subterrâneo.\""
13340-77 = "O que pretende com isso?!"
13340-78 = "O jogo já deveria ter terminado com a minha vitória!#nO que um perdedor veio fazer aqui agora?!"
13340-79 = "[s] \"...Não.\""
13340-80 = "O quê?!"
13340-81 = "[s] \"Ainda não acabou.\""
13340-90 = "Coordenadas confirmadas.#nAtivando sequência de teletransporte forçado com o poder do \"Chroma\" manifestado."
13340-94 = "[ns] \"Shiroko! Pare a Shiroko—!\""
13340-101 = "...!"
13340-102 = "Não pode encostar numa coisa dessas."
13340-103 = "C-Como você está aqui...?!"
13340-113 = "Sunaookami Shiroko, você é forte."
13340-114 = "Afinal, você sou eu."
13340-115 = "Nn... então vai ficar tudo bem."
13340-119 = "[ns] \"Shiroko!\""
13340-120 = "Nn."
13340-124 = "Você precisa de ajuda, não é?"
13340-125 = "Hoshi—"
13340-127 = "—Se deixarmos a Hoshino-senpai assim, o mundo caminhará para a ruína."
13340-128 = "S-Sim..."
13340-129 = "Eu sei disso.#nPorque aquilo começou em Abydos."
13340-137 = "Ela desviou...?!"
13340-141 = "...Não... entendem."
13340-142 = "Ninguém mais entende essa dor..."
13340-143 = "Não."
13340-144 = "Eu também conheço muito bem."
13340-147 = "Vamos lutar, Hoshino-senpai."
13340-148 = "Você consegue vencer?"
13340-149 = "Nn, eu sei como lutar."
13340-158 = "Já lutei antes. Não vou perder."
13340-160 = "Próximo;Terror VS Terror"
