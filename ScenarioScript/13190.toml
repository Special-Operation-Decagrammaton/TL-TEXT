[translation]
13190-1 = "Episódio 19;A Assembleia Geral dos Credores"
13190-3 = "Presidente, a localização do Canhão Ferroviário foi confirmada."
13190-4 = "Oh."
13190-8 = "Fica na área restrita, a cerca de 480 km daqui!"
13190-9 = "...Entendo."
13190-10 = "Preparem-se para partir a qualquer momento."
13190-11 = "Também levaremos aquela senhorita da Nephthys conosco."
13190-13 = "Entendido."
13190-18 = "Determinem a localização exata.#nProvidenciem também um meio de transporte."
13190-20 = "Sim, senhor!"
13190-28 = "Fico feliz que tenha vindo, senhorita da Nephthys."
13190-29 = "...Presidente."
13190-43 = "Sr. Mordomo... Então a Nephthys estava de mãos dadas com a Kaiser o tempo todo."
13190-44 = "Hahaha, você pega as coisas rápido."
13190-45 = "Não se esperaria menos da herdeira de uma grande corporação."
13190-46 = "Por que fariam algo assim...!"
13190-47 = "Tudo foi pelo bem de Abydos!"
13190-48 = "Se ao menos conseguíssemos o Canhão Ferroviário, com aquele poder absoluto!#nPoderíamos recuperar nossa antiga glória...!"
13190-49 = "Isso não faz o menor sentido!"
13190-54 = "Envolver tantas pessoas assim..."
13190-62 = "Causar todo esse caos...!"
13190-63 = "Isso é..."
13190-64 = "A Hoshino-senpai tinha razão.#nSe deixarmos de medir os meios para alcançar nossos objetivos, acabamos perdendo quem nós somos..."
13190-66 = "Mas Abydos mesma não media os meios no passado, não é?"
13190-67 = "...?!"
13190-68 = "Dizem que até mesmo aquela tal de Trinity#ncostumava arrancar as unhas dos inimigos antigamente."
13190-69 = "Não seria nada estranho se Abydos, com todo o seu poder avassalador,#ntivesse feito coisas parecidas."
13190-70 = "Isso..."
13190-74 = "Presidente, temos uma invasora!"
13190-75 = "É a Schale?"
13190-76 = "N-Não!#nA invasora é apenas Hoshino Takanashi, sozinha!"
13190-78 = "Hoshino-senpai...?!"
13190-83 = "11:30 AM"
13190-85 = "Que horas são..."
13190-86 = "Ora, ora, ainda temos 30 minutos.#nMas nem mesmo o General foi páreo para ela, hein."
13190-87 = "Por que só a senpai veio...?"
13190-88 = "O Comitê de Contramedidas e o Sensei da Schale estão agindo separados de Hoshino Takanashi."
13190-89 = "Não sei o motivo, porém."
13190-90 = "Pessoal..."
13190-94 = "N-Não vamos conseguir segurá-la por muito mais tempo!"
13190-95 = "Francamente, isso é uma vergonha para o nome da Kaiser."
13190-96 = "Q-Quais são as suas ordens?!"
13190-97 = "Encontraram o Canhão Ferroviário?"
13190-99 = "Por favor, aguarde só mais um pouco!"
13190-101 = "E o transporte?"
13190-102 = "Um helicóptero chegará ao terraço em 20 minutos!"
13190-103 = "...Certo.#nNão tem jeito, vou entretê-la até lá."
13190-109 = "Coordenadas confirmadas!"
13190-110 = "...Setor 35-9 da Área Restrita do Deserto de Abydos?#nÉ lá que o Canhão Ferroviário está escondido?"
13190-114 = "11:45 AM"
13190-116 = "Arf, arf..."
13190-117 = "Hoshino-senpai...!"
13190-118 = "(Setor 35-9?)"
13190-119 = "Desculpa a demora, Nonomi-chan.#nVocê não se machucou?"
13190-120 = "Sim, eu estou bem..."
13190-133 = "...Kaiser Corporation."
13190-136 = "É a primeira vez que nos encontramos pessoalmente, não é, Hoshino Takanashi?#nEu sou o Presidente."
13190-137 = "Ouvi muitos rumores sobre você.#nParece que até o Terno Preto estava de olho em você."
13190-138 = "...Mais importante, a assembleia ainda não começou, né?"
13190-139 = "Claro que não.#nEmbora o representante do fundo privado tenha mudado para mim."
13190-140 = "Fique tranquila, eu lhe concederei o direito de fala."
13190-141 = "..."
13190-142 = "Pois bem, vamos declarar o início da assembleia."
13190-143 = "Damos agora início à Assembleia Geral dos Credores."
13190-150 = "Indo direto ao ponto, há algo que gostaria de dizer?"
13190-158 = "Se eu negar a legitimidade do \"Conselho Estudantil de Abydos\","
13190-159 = "você vai libertar a Nonomi-chan, certo?"
13190-165 = "...Presidente."
13190-166 = "A resposta é não.#nSe não houver legitimidade, a posse do Canhão Ferroviário passará para a Nephthys."
13190-167 = "E isso seria muito inconveniente para nós."
13190-168 = "..."
13190-169 = "Se quer que eu devolva Nonomi Izayoi sã e salva,#nbasta solicitar o \"cancelamento do contrato\"."
13190-170 = "Fazendo isso, a posse do Canhão Ferroviário passará a ser minha."
13190-171 = "..."
13190-173 = "Não faça isso, Hoshino-senpai!#nNão podemos entregar o Canhão Ferroviário nem para a Nephthys, nem para a Kaiser!"
13190-174 = "Por favor, não negue o tempo que você passou com a Presidente Yume...!"
13190-179 = "...É o que ela diz. E então, o que vai fazer?"
13190-181 = "Não faça isso!"
13190-182 = "Antes nas mãos da Nephthys do que cair nas garras da Kaiser!"
13190-183 = "Por favor, tome uma decisão sensata!#nPelo futuro de Abydos!"
13190-185 = "Sr. Mordomo...!"
13190-186 = "Senhorita, por acaso se esqueceu da questão da transferência?"
13190-187 = "Ainda dá tempo de—"
13190-192 = "—Eu vou abandonar Abydos!"
13190-199 = "Com isso, não terei mais valor como refém!"
13190-200 = "Então, senpai, por favor, não se sacrifique por mim!"
13190-201 = "Não se preocupe.#nA Nonomi-chan não precisa sair da escola."
13190-202 = "Hã...?"
13190-203 = "E claro, também não tenho a menor intenção de entregar o Canhão Ferroviário assim de mão beijada."
13190-204 = "N-Não pode ser..."
13190-208 = "Presidente."
13190-209 = "Como parte envolvida no contrato, eu reconheço que o Conselho Estudantil de Abydos era uma organização não oficial."
13190-210 = "...!"
13190-215 = "...!"
13190-216 = "Com isso, a validade do contrato referente à Ferrovia Transdesértica—"
13190-220 = "Espere um segundo!!"
13190-225 = "11:57 AM"
13190-229 = "[ns] \"Essa declaração é inválida!\""
13190-231 = "P-Pessoal...!"
13190-233 = "A Hoshino-senpai não tem mais autoridade como membro do Conselho Estudantil de Abydos!"
13190-234 = "Q-Quê...?!"
13190-235 = "Porque eu me tornei a presidente do Conselho Estudantil de Abydos!"
13190-236 = "A-A Ayane-chan virou a presidente do conselho estudantil?!"
13190-238 = "[ns1] \"Sim, agora a Ayane é a presidente do conselho estudantil.\"\n[ns2] \"Ela foi eleita por votação.\""
13190-241 = "[ns] \"Eu sou a testemunha.\""
13190-242 = "C-Como assim...?"
13190-243 = "Nn, nós decidimos todas juntas."
13190-244 = "Nem pense em tentar resolver tudo sozinha!"
13190-248 = "..."
13190-249 = "Além disso, você foi rebaixada de vice-presidente para secretária, senpai!"
13190-250 = "Uma mera secretária causar uma confusão dessas...!"
13190-252 = "(Mas até agorinha mesmo era ela quem era a secretária...)"
13190-254 = "Vou explicar para a Hoshino-senpai também!"
13190-255 = "Nosso \"Comitê de Contramedidas\", aprovado sob a tutela do Sensei,#nfundiu-se com o \"Conselho Estudantil de Abydos\"!"
13190-256 = "..."
13190-258 = "Ayane-chan..."
13190-260 = "Portanto, a parte atual do contrato é o \"Comitê de Contramedidas\"!"
13190-266 = "[ns] \"E Nonomi...\""
13190-268 = "[ns] \"Se quiser sair do comitê, precisa da minha permissão.\""
13190-269 = "Sensei..."
13190-273 = "12:00 PM"
13190-275 = "Entendo, então jogaram essa cartada."
13190-276 = "Talvez o erro tenha sido enfrentar a Schale desde o início."
13190-277 = "Bem, não importa.#nJá ganhei o tempo que precisava."
13190-281 = "A assembleia está encerrada."
13190-289 = "[ns] \"O quê...?!\""
13190-294 = "Afinal de contas, quem lhe deu permissão para falar?"
13190-295 = "I-Isso é...!"
13190-296 = "...!"
13190-298 = "No fim, todo o esforço de vocês não passou de perda de tempo."
13190-303 = "Declaro este contrato de compra e venda nulo e sem efeito."
13190-310 = "O Canhão Ferroviário sempre pertenceu à Kaiser desde o começo.#nNão é mesmo?"
13190-311 = "Não aceitarei nenhuma objeção."
13190-312 = "Você acha mesmo que vai sair impune de um absurdo desses?!"
13190-317 = "...Presidente, o helicóptero chegará em breve."
13190-321 = "Cuidem de todos os presentes aqui.#nEntenderam? Não deixem sobrar ninguém."
13190-328 = "Porém, senhorita da Nephthys... você virá comigo."
13190-338 = "Espere!"
13190-345 = "Hoshino-senpai! Nonomi!"
13190-348 = "Shiroko-senpai, se você se isolar vai acabar cercada!"
13190-350 = "Sensei, desse jeito a Nonomi-senpai vai...!"
13190-351 = "...Por favor, assuma o comando!"
