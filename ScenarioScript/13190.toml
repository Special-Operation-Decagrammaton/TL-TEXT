[translation]
13190-1 = "Эпизод 19;Общее собрание кредиторов"
13190-3 = "Президент! Мы почти вычислили местоположение Железнодорожной пушки!"
13190-4 = "О, правда? Посмотрим..."
13190-5 = ""
13190-7 = ""
13190-8 = "Мы сузили район поиска до закрытого сектора вдоль маршрута Транс-пустынной железной дороги, примерно в 480 километрах отсюда!"
13190-9 = "...Ах. Неужели...?"
13190-10 = "Даже я этого не предвидела. Они неплохо подумали."
13190-11 = "Готовьтесь. Нам понадобится наследница Нефтис."
13190-13 = "Поняла."
13190-14 = ""
13190-16 = ""
13190-18 = "Добейтесь более точного местоположения. И подготовьте транспорт."
13190-20 = "Поняла!"
13190-26 = ""
13190-28 = "О, наша маленькая госпожа Нефтис. Добро пожаловать."
13190-29 = "...Президент Кайзер?"
13190-30 = ""
13190-32 = ""
13190-33 = ""
13190-35 = ""
13190-36 = ""
13190-38 = ""
13190-39 = ""
13190-41 = ""
13190-43 = "Дворецкий... Нефтис объединилась с Кайзер...?"
13190-44 = "Ха-ха-ха, быстро соображаешь. Не зря наследница корпорации."
13190-45 = "Ты всё правильно поняла."
13190-46 = "Как вы могли?!"
13190-47 = "Всё, что мы делали, было ради Абидоса!"
13190-48 = "Стоило нам заполучить Железнодорожную пушку, и с такой силой возрождение Абидоса стало бы—"
13190-49 = "Ничего такого бы не произошло!"
13190-50 = ""
13190-53 = ""
13190-54 = "Оглянись вокруг, Дворецкий!"
13190-55 = ""
13190-58 = ""
13190-60 = ""
13190-62 = "Это то, чего вы хотели? Эти разрушения? Этот хаос?"
13190-63 = "Это..."
13190-64 = "Хошино была права. Если ради цели мы опустимся до такого, до таких методов... Мы потеряем себя."
13190-66 = "Лично мне это кажется вполне в духе Абидоса."
13190-67 = "...Что?!"
13190-68 = "Я слышала, Тринити когда-то не гнушалась вырывать врагам ногти, чтобы получить желаемое. «Такие методы», как ты выразилась, тогда считались обычным делом."
13190-69 = "Сомневаюсь, что Абидос, величайший и могущественнейший район своего времени, сторонился бы «таких методов»."
13190-70 = "Это..."
13190-71 = ""
13190-74 = "Президент! Нарушитель!"
13190-75 = "Это Шале?"
13190-76 = "Нет, только один человек. Таканаши Хошино вошла в здание!"
13190-78 = "Хошино...?!"
13190-79 = ""
13190-82 = ""
13190-83 = "Текущее время: 11:3X утра."
13190-85 = "О, текущее время..."
13190-86 = "Боже мой. До полудня осталось тридцать минут. Чем там вообще занимается Генерал?"
13190-87 = "Но почему она одна...?"
13190-88 = "Комитет по выплате долга и Сенсей Шале движутся отдельно от Хошино."
13190-89 = "Скорее всего, им не удалось договориться о дальнейших действиях."
13190-90 = "...Почему Хошино... и остальные...?"
13190-91 = ""
13190-94 = "Вторая линия сдерживания прорвана...! Похоже, всё будет сложнее, чем казалось сначала..."
13190-95 = "*вздох* Вот же... В итоге мы будем выглядеть проигравшими."
13190-96 = "К-Какие будут приказы?"
13190-97 = "Местоположение Железнодорожной пушки?"
13190-99 = "...Почти вычислили! Скоро будут точные координаты!"
13190-101 = "Транспорт?"
13190-102 = "На вертолётной площадке крыши будет вертолёт примерно через двадцать минут!"
13190-103 = "Хорошо. До тех пор я сама займусь нашими гостями."
13190-104 = ""
13190-107 = ""
13190-108 = ""
13190-109 = "Координаты подтверждены! Отправляю!"
13190-110 = "Закрытый район Пустыни Абидос, сектор 35-9...? Там спрятана Железнодорожная пушка?"
13190-111 = ""
13190-114 = "Текущее время: 11:4X утра."
13190-116 = "*тяжело дышит*... *тяжело дышит*..."
13190-117 = "Хошино...!!"
13190-118 = "(Сектор 35-9...?)"
13190-119 = "Прости, что опоздала. Ты не ранена, Нономи?"
13190-120 = "Нет... Я..."
13190-121 = ""
13190-123 = ""
13190-124 = ""
13190-126 = ""
13190-128 = ""
13190-130 = ""
13190-132 = ""
13190-133 = "....Корпорация Кайзер."
13190-136 = "Впервые встречаемся лично, Таканаши Хошино. Я президент Кайзер."
13190-137 = "Директор Кайзер докладывал мне о тебе. Это ведь тебя так сильно хотел Чёрный Костюм, верно?"
13190-138 = "...Что здесь происходит? Общее собрание кредиторов всё ещё идёт?"
13190-139 = "О, это. Я новый представитель фонда прямых инвестиций. Значит, все права созывать и закрывать общее собрание теперь у меня."
13190-140 = "...Ах, точно. Поскольку ещё не полдень... у тебя есть законные полномочия принять юридическое заявление."
13190-141 = "..."
13190-142 = "Долгое получилось вступление. Официально объявляю об открытии общего собрания кредиторов."
13190-143 = "Настоящим объявляю открытым общее собрание кредиторов по облигациям DLB Абидоса."
13190-144 = ""
13190-150 = "Ты хочешь что-то заявить на этом собрании, Таканаши Хошино?"
13190-151 = ""
13190-154 = ""
13190-155 = ""
13190-157 = ""
13190-158 = "Мне обещали освободить Нономи, если я откажусь от законности студсовета Абидоса."
13190-159 = "Однако..."
13190-160 = ""
13190-163 = ""
13190-165 = "Это всё ещё в силе?"
13190-166 = "Нет, разумеется. Если ты сделаешь такое заявление, Нефтис станет владельцем Железнодорожной пушки."
13190-167 = "Мы никак не можем этого допустить."
13190-168 = "..."
13190-169 = "Если хочешь безопасно вернуть Нономи, подтверди расторжение договора."
13190-170 = "Тогда я, представитель фонда прямых инвестиций, получу полные права на Железнодорожную пушку."
13190-171 = "..."
13190-173 = "Нет! Хошино! Не отдавай Железнодорожную пушку Нефтис или Кайзер!"
13190-174 = "Ты не можешь отрицать то, что у тебя было с Юмэ! Ты должна сохранить договор!"
13190-175 = ""
13190-178 = ""
13190-179 = "Ой-ой. Вот её позиция. Что будешь делать?"
13190-181 = "Нет, не делай этого!"
13190-182 = "Для нас, Нефтис, будет лучше, если такая сила окажется у нас, а не у низшего мусора из Кайзер!"
13190-183 = "Прими правильное решение! Это ради будущего Абидоса!"
13190-185 = "Дворецкий...!"
13190-186 = "Не забывай, ценность Нономи как заложника полностью связана с её принудительным переводом в академию Хайлендер!"
13190-187 = "Пока мы существуем, такая возможность всегда останется!"
13190-188 = ""
13190-190 = ""
13190-192 = "Тогда я уйду из Абидоса!!"
13190-193 = ""
13190-196 = ""
13190-198 = ""
13190-199 = "Вот и всё, правда? Тогда я больше ничего не стою как заложник!!"
13190-200 = "Вот, Хошино! Тебе больше не нужно меня защищать. Я уже—"
13190-201 = "...Не переживай, Нономи. Тебе не придётся уходить."
13190-202 = "Постой, что...?"
13190-203 = "Я не собираюсь просто отдавать Железнодорожную пушку. Не так."
13190-204 = "Хошино? Т-Ты ведь не...?"
13190-205 = ""
13190-207 = ""
13190-208 = "...Как вице-президент студсовета Абидоса, основной стороны договора, заявляю следующее."
13190-209 = "Я признаю, что студсовет Кучинаши Юмэ и Таканаши Хошино был несанкционированной организацией, действовавшей незаконно."
13190-210 = "...!!"
13190-211 = ""
13190-214 = ""
13190-215 = "...!!"
13190-216 = "Следовательно, настоящим подтверждаю, что Кучинаши Юмэ не имела полномочий председателя студсовета, а составленный ею договор является ничтожным и—"
13190-217 = ""
13190-220 = "А ну стой!"
13190-221 = ""
13190-224 = ""
13190-225 = "Текущее время: 11:5X утра."
13190-228 = ""
13190-229 = "[ns] «Стой! Это заявление недействительно!»"
13190-231 = "В-Все...!"
13190-233 = "Да! Это заявление недействительно. У Хошино нет полномочий представлять студсовет Абидоса!"
13190-234 = "Ч-Что...?!"
13190-235 = "Потому что председатель студсовета Абидоса — я!"
13190-236 = "Ч-Что...? Председатель студсовета...? Аяне...?!"
13190-238 = "[ns1] «Да, мы избрали Аяне новой председательницей студсовета.»\n[ns2] «Я был свидетелем.»"
13190-241 = "[ns] «Аяне — официальная председательница студсовета, избранная законным голосованием.»"
13190-242 = "С-Сенсей...? Все? Что вообще происходит...?"
13190-243 = "Да. Мы выбрали Аяне председательницей студсовета."
13190-244 = "Вот так, Хошино. Так что хватит играть в одинокого рейнджера."
13190-245 = ""
13190-248 = "..."
13190-249 = "И ещё: тебя понизили с вице-президента до секретаря!"
13190-250 = "Как смеет какой-то незначительный секретарь действовать самостоятельно, без разрешения председателя студсовета... Это непростительно!"
13190-252 = "(Она только что назвала свою прежнюю должность незначительной...?!)"
13190-254 = "Ты не можешь отрицать значение Юмэ для Абидоса, Хошино! Само наше существование доказывает, что Юмэ была настоящей председательницей!"
13190-255 = "Мы прямые преемники председателя Юмэ, а Комитет по выплате долга — доказательство существования студсовета Абидоса!"
13190-256 = "..."
13190-258 = "Аяне..."
13190-260 = "Следовательно, договор Юмэ будет исполнен Комитетом по выплате долга, законным студсоветом! Настоящим заявляю о нашем намерении заверить договор!"
13190-261 = ""
13190-263 = ""
13190-265 = ""
13190-266 = "[ns] «И без моего разрешения ты не можешь исключиться из нашей школы, Нономи.»"
13190-268 = "[ns] «Ты прекрасно знаешь, чем это закончилось в прошлый раз.»"
13190-269 = "Сенсей..."
13190-270 = ""
13190-272 = ""
13190-273 = "Текущее время: 12:0X."
13190-275 = "Так... вот как?"
13190-276 = "Надо было предвидеть, что Шале не позволит этому варианту спокойно разыграться."
13190-277 = "Эх, неважно. Я всё равно просто убивала время."
13190-278 = ""
13190-281 = "Хватит игр. Настоящим собрание закрывается."
13190-282 = ""
13190-288 = ""
13190-289 = "[ns] «Что?!»"
13190-290 = ""
13190-292 = ""
13190-294 = "Я хоть как-то признала ваше грандиозное заявление? На этом общем собрании хоть что-нибудь было официально заверено?"
13190-295 = "Что ты...?!"
13190-296 = "...!!"
13190-298 = "Иными словами, все ваши усилия были бессмысленны."
13190-299 = ""
13190-303 = "С момента подписания договора официально прошло два года. Следовательно, он больше не действует. Ничтожен."
13190-304 = ""
13190-309 = ""
13190-310 = "Иными словами, вашего маленького договора больше нет. Железнодорожная пушка всегда принадлежала Кайзер."
13190-311 = "Так всё началось, и так всё закончится."
13190-312 = "Э-Это абсурд."
13190-313 = ""
13190-315 = ""
13190-316 = ""
13190-317 = "*шёпотом* ...Вертолёт прибывает прямо сейчас."
13190-318 = ""
13190-320 = ""
13190-321 = "Разберитесь с мусором. Фонд прямых инвестиций, Нефтис, Абидос — со всеми!"
13190-322 = ""
13190-324 = ""
13190-326 = ""
13190-328 = "Я отправляюсь к местоположению Железнодорожной пушки. О, и приведите наследницу Нефтис. Она нам понадобится."
13190-329 = ""
13190-331 = ""
13190-332 = ""
13190-334 = ""
13190-336 = ""
13190-338 = "Стой!"
13190-339 = ""
13190-341 = ""
13190-342 = ""
13190-345 = "Хошино! Нономи!"
13190-346 = ""
13190-348 = "П-Подожди, Широко! На нас идут враги!"
13190-350 = "Они сейчас улетят с Нономи, Сенсей! Хошино сделает всё, чтобы её спасти, но..."
13190-351 = "Нам нужно спасти их обеих! Пожалуйста, командуйте!"
