[translation]
1001202-1 = "Появление тренера!"
1001202-2 = "Спортзал Миллениума"
1001202-3 = "О, Сенсей — то есть, Тренер! Ты пришёл!"
1001202-4 = "Я ждала тебя."
1001202-5 = "Хаха. Всё ещё непривычно признавать тебя своим тренером."
1001202-6 = "Как и обещала, я составила план тренировок."
1001202-7 = "Не посмотришь?"
1001202-8 = ""
1001202-9 = ""
1001202-10 = "(Сумирэ протянула мне телефон. Я не понимаю ни слова из того, что там написано.)"
1001202-11 = ""
1001202-12 = "Ну как, Тренер?"
1001202-13 = "Говорят, подъёмы гантелей над головой хорошо развивают трицепс и другие мышцы длинной головки."
1001202-14 = "Это упражнение должно добавить рукам упругости, а разгибания ног позволят..."
1001202-15 = "[s] «Эй, Сумирэ?»"
1001202-16 = "...увеличить силу ног и потом... О. Что такое, Тренер?"
1001202-17 = "[s] «Тебе не кажется, что ты перестаралась?»"
1001202-18 = "Ну... не буду отрицать, что стала сильнее себя нагружать."
1001202-19 = "Раньше я, наверное, не выдержала бы такую тренировку."
1001202-20 = "Но теперь я уже не та, кем была раньше."
1001202-21 = "П-Потому что теперь рядом мой тренер!"
1001202-22 = "[s] «П-Правда? Но я всё ещё мало разбираюсь в тренировках.»"
1001202-23 = "Ничего страшного!"
1001202-24 = "Ты уже доказал, что умеешь помогать всем вокруг!"
1001202-25 = "Я могу положиться на тебя и знаю, что ты остановишь меня, если я начну переутомляться."
1001202-26 = "В конце концов, именно благодаря тебе я смогла составить эту программу."
1001202-27 = "[s] «Рад помочь.»"
1001202-28 = "Н-Нет, это мне в удовольствие."
1001202-29 = "До встречи с тобой я была всего лишь новичком."
1001202-31 = "Медпункт Миллениума"
1001202-32 = "Не так давно..."
1001202-33 = "(дверь открывается)"
1001202-34 = "О, Сенсей."
1001202-35 = "[s] «Как ты?»"
1001202-36 = "Я в порядке! Просто лёгкое обезвоживание."
1001202-37 = "Я потеряла сознание примерно три раза, но всё будет хорошо."
1001202-38 = "А? Как я довела себя до такого обезвоживания?"
1001202-39 = "Ну... сейчас экзамены, поэтому в последнее время я гораздо больше сижу."
1001202-40 = "Я решила увеличить нагрузку, чтобы это компенсировать, и в итоге перегрузила себя. Дальше ты и сам понимаешь."
1001202-41 = "[s] «Тебе не кажется, что ты и так достаточно стараешься?»"
1001202-42 = "Совсем нет."
1001202-43 = "Главное в тренировках — постоянство. Никаких перерывов и никаких компромиссов."
1001202-44 = "Иначе..."
1001202-45 = "[s] «Иначе...?»"
1001202-46 = "...начинается потеря мышечной массы."
1001202-47 = "Ты не понимаешь? Все мои результаты просто исчезнут."
1001202-48 = "Это худший возможный сценарий. Я сделаю что угодно, лишь бы его избежать!"
1001202-49 = "[s1] «П-полагаю, да.»\n[s2] «Понимаю. Понимаю.»"
1001202-50 = "О-О! Прости. Я увлеклась."
1001202-51 = "О-О! Прости. Я увлеклась."
1001202-52 = "*вздыхает*"
1001202-53 = "В общем, поэтому я так и поступила."
1001202-54 = "[s] «Смысл тренировок — быть здоровой, Сумирэ.»"
1001202-55 = "Конечно. Я это знаю."
1001202-56 = "Поэтому я так стараюсь..."
1001202-57 = "[s] «Обезвоживание, по-твоему, это здоровье?»"
1001202-58 = "...?!"
1001202-59 = "Нет. Конечно нет. Ты прав."
1001202-60 = "Простите, Сенсей."
1001202-61 = "*вздыхает*"
1001202-62 = "Обычно я умею соблюдать нормальный график тренировок."
1001202-63 = "Хватило лишь немного потерять терпение, и я допустила такую ошибку."
1001202-64 = "Вот бы кто-нибудь мог страховать меня... но я даже не знаю, кого попросить."
1001202-65 = "Что мне делать?"
1001202-66 = "..."
1001202-67 = "[s3] «Я могу предложить свои услуги.»\n[s4] «Не ищи дальше! Я тебя натренирую!»"
1001202-68 = "Что?!"
1001202-69 = "Что?!"
1001202-70 = "Ты хочешь тренировать меня, Сенсей?"
1001202-71 = "Т-Ты правда уверен?"
1001202-72 = "Спасибо, Сенсей!"
1001202-73 = "Подожди, теперь мне называть тебя «Тренер»?"
1001202-74 = "[s5] «Меня это устраивает.»\n[s6] «Настоящим разрешаю тебе называть меня Тренером.»"
1001202-75 = "Поняла!"
1001202-76 = "Поняла!"
1001202-79 = "Ну что ж!"
1001202-80 = "Начнём?"
1001202-81 = "Я рассчитываю на тебя, Тренер."
