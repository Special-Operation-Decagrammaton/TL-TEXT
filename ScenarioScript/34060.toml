[translation]
34060-1 = "Episódio 6;Asas quebradas"
34060-3 = "S-Sim! Vim correndo assim que recebi seu contato."
34060-4 = "Fiquei um pouquinho surpresa quando disse que queria conversar a sós... não parece muito com você, Seia-chan!"
34060-5 = "Até pedi para a garota do Comitê de Justiça que sempre fica me vigiando esperar do lado de fora da porta. Então..."
34060-6 = "Mika..."
34060-7 = "S-Seia-chan...? Ué, você está tão pálida... Tudo bem? Seu corpo está tremendo... Você está bem mesmo? Melhor eu chamar alguém—"
34060-8 = "...Quando você entrou em contato com o Distrito Autônomo de Arius, chegou a encontrar mais alguém além do \"Esquadrão\"?"
34060-9 = "Quê...? Arius...?"
34060-10 = "Você realmente nunca foi ao Distrito Autônomo de Arius nenhuma vez?"
34060-11 = "É que... hum, Seia-chan...?"
34060-12 = "Você já viu uma mulher alta usando um vestido? Que outras informações você sabe sobre o \"Esquadrão\"?"
34060-13 = "...H-Hum, Seia-chan. Do que você está..."
34060-14 = "Cof, cof..."
34060-15 = "Por você ter entrado em contato com Arius..."
34060-19 = "..."
34060-20 = "Ah... é-é verdade, né? Por minha causa... várias coisas..."
34060-21 = "O Sensei... está na mira do Esquadrão..."
34060-22 = "...!?"
34060-23 = "...Seia-chan, o que você acabou de dizer...?"
34060-28 = "Porque você trouxe o Sensei para cá...!"
34060-29 = "...!!?"
34060-30 = "...Não, a culpa não é sua... Perdoe-me."
34060-31 = "Cof, cof, cof...!!"
34060-33 = "Cof, cof, cof, cof...!!"
34060-34 = "(Ah... não adianta. Meu corpo não me obedece...)"
34060-37 = "(Minha consciência... está... sumindo... aos poucos...)"
34060-41 = "..."
34060-42 = "...Onde estou?"
34060-43 = "Esse estilo arquitetônico... Não me diga que é do Distrito Autônomo de Arius...?"
34060-44 = "Sim — este é o lugar conhecido como a \"Basílica\" de Arius."
34060-45 = "!!"
34060-51 = "Ugh...!!"
34060-52 = "Imaginei que havia um ratinho bisbilhotando, e veja só se não era você mesma — quem diria que me seguiria até este Santo dos Santos."
34060-53 = "Baixou a guarda por achar que estava em um sonho? Arcanjo da Profecia... ou melhor, Yurizono Seia."
34060-54 = "...E-Este lugar é... aquele altar..."
34060-55 = "Sim. É um santuário secreto que nem mesmo os outros membros da Gematria jamais visitaram. Sinta-se honrada."
34060-60 = "...!!!"
34060-63 = "S-Seia-chan! Aguenta firme!!"
34060-64 = "Alguém!! Chamem alguém aqui!! A Seia-chan... tem alguma coisa errada com a Seia-chan!!"
34060-65 = "S-Sim! E-Entendido!!"
34060-67 = "(O que... é aquilo...?)"
34060-68 = "(Só de colocar os olhos naquilo... já sinto uma presença nefasta...)"
34060-69 = "(Este altar... o que... Não me diga que é para invocar aquilo...?)"
34060-71 = "(Ela está...!)"
34060-73 = "(...)"
34060-74 = "(Entendo, este ritual... Não pode ser... Impossível...)"
34060-78 = "(Que tipo de calamidade... essa mulher está tentando trazer... para Kivotos...?)"
34060-80 = "Ah... Seia-chan, você acordou?"
34060-81 = "Por que... a Seia-chan teve que passar por isso...?"
34060-82 = "O que eu faço...? Seia-chan... o que eu vou fazer...?"
34060-84 = "Mika... Eu fiz a mesma coisa... com você de novo..."
34060-85 = "Perdoe-me, Mika... A culpa não é sua. Isto é... uma falha que eu mesma provoquei..."
34060-86 = "...Sensei, se puder ouvir a minha voz... por favor..."
34060-87 = "Fuja — para o mais longe possível... Afaste-se do Distrito Autônomo de Arius."
34060-88 = "Caso contrário... o Sensei vai..."
34060-89 = "...cair nas mãos de quem o persegue..."
34060-90 = "Sensei...!!"
34060-92 = "Em algum lugar de Kivotos - Beco"
34060-94 = "[ns1] (...Tive a impressão de ouvir a voz da Seia agora há pouco.)\n[ns2] (Será impressão minha...? Estou com um mau pressentimento...)"
34060-95 = "(A cidade aonde cheguei guiado pelo e-mail de remetente desconhecido está deserta, sem nenhum sinal de gente por perto.)"
34060-96 = "(A cidade aonde cheguei guiado pelo e-mail de remetente desconhecido está deserta, sem nenhum sinal de gente por perto.)"
34060-101 = "[ns] (Tem alguém aí...?)"
34060-103 = "[ns] \"Saori...?\""
34060-104 = "..."
34060-110 = "Próximo;Escolha e decisão"
