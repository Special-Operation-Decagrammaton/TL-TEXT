[translation]
34060-1 = "Эпизод 6;Сломанные вещи"
34060-2 = ""
34060-3 = "Э-Это я! Я пришла сразу, как только ты позвала!"
34060-4 = "Я слышала, ты хотела поговорить наедине, и так нервничала!"
34060-5 = "Я сказала охраннику подождать за дверью. Так что, эм... Что случилось?"
34060-6 = "Мика..."
34060-7 = "О нет, Сэя, ты в порядке? Ты такая бледная, и тебя трясёт? Я-я позову кого-нибудь!"
34060-8 = "Когда ты добралась до района Ариуса, кого ты там встретила кроме отряда?"
34060-9 = "О чём ты говоришь? Тебе плохо, Сэя?"
34060-10 = "Мика, ты точно никогда не была в районе Ариуса?"
34060-11 = "Сэя... Я..."
34060-12 = "Ты когда-нибудь встречала высокую женщину с красной кожей? Что ещё ты знаешь об отряде?"
34060-13 = "...Я не понимаю, о чём ты."
34060-14 = "*кашляет* *кашляет*"
34060-15 = "Потому что ты связалась с Ариусом..."
34060-16 = ""
34060-18 = ""
34060-19 = "..."
34060-20 = "Я знаю. Мне так жаль, что из-за меня всё это..."
34060-21 = "Нет... Отряд... охотится за Сенсеем..."
34060-22 = "...?!"
34060-23 = "Ты, наверное, ошиблась, Сэя..."
34060-24 = ""
34060-26 = ""
34060-28 = "Это всё потому, что ты привела сюда Сенсея!"
34060-29 = "...?!"
34060-30 = "Нет... Я не должна... винить тебя... Прости."
34060-31 = "*кашель* *кашель*"
34060-32 = ""
34060-33 = "*кашель* *кашель-кашель*"
34060-34 = "(Я больше не чувствую... рук и ног...)"
34060-35 = ""
34060-36 = ""
34060-37 = "(Я... теряю сознание...)"
34060-40 = ""
34060-41 = "..."
34060-42 = "...Где я?"
34060-43 = "Этот архитектурный стиль... Я в районе Ариуса?"
34060-44 = "Да. Добро пожаловать в базилику Ариуса."
34060-45 = "...!"
34060-46 = ""
34060-48 = ""
34060-51 = "Ух...!"
34060-52 = "Ах да. Логично, что это ты. Я знала, что какая-то крыса подглядывает, но не думала, что ты последуешь за мной в это святое место."
34060-53 = "Думала, в своих снах ты в безопасности? Пророческий архангел... Юризоно Сэя."
34060-54 = "...Э-Это место... Это... алтарь..."
34060-55 = "Какая наблюдательность. Даже мои товарищи из Гематрии не знают об этом месте. Почти честь для тебя."
34060-56 = ""
34060-58 = ""
34060-59 = ""
34060-60 = "...!"
34060-61 = ""
34060-63 = "О нет! Сэя! Пожалуйста, проснись!"
34060-64 = "Кто-нибудь, помогите! Сюда! С Сэей что-то не так!"
34060-65 = "Сэя?! Немедленно вызову помощь!"
34060-67 = "(Что... это...?)"
34060-68 = "(Такое... зловещее...)"
34060-69 = "(Этот алтарь предназначен для... призыва чего-то...?)"
34060-71 = "(Эта девушка...!)"
34060-73 = "(...)"
34060-74 = "(Понятно... Этот ритуал... для...?)"
34060-78 = "(Эта женщина... пытается призвать что-то в Кивотос...)"
34060-80 = "Всё будет хорошо, Сэя! Помощь уже идёт!"
34060-81 = "Сэя... Нет... Пожалуйста... Только не снова!"
34060-82 = "Я... Я всего лишь хотела... Сэя!"
34060-84 = "Мика... Я снова причинила тебе боль..."
34060-85 = "Прости, Мика. Это не твоя вина. Ничего из этого."
34060-86 = "...Сенсей. Ты слышишь меня? Пожалуйста..."
34060-87 = "Беги, Сенсей. Уходи как можно дальше от района Ариуса."
34060-88 = "Иначе ты..."
34060-89 = "Они идут... за тобой..."
34060-90 = "Сенсей!"
34060-92 = "Переулок в Кивотосе. Поздняя ночь."
34060-94 = "[ns1] «(Мне только что послышался голос Сэи?)»\n[ns2] «(Или показалось? Что-то не так.)»"
34060-95 = "Я пришёл сюда после сообщения от неизвестного отправителя, но улица была пуста и вокруг ни души."
