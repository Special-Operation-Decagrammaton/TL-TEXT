[translation]
10034030-1 = "Эпизод 3;Почётная гостья из Вайлдхант"
10034030-4 = ""
10034030-5 = "Ну вот, Сенсей, мы пришли..."
10034030-6 = "...А. Вон там. В тот день она выступала именно там."
10034030-7 = "А сейчас... А?"
10034030-8 = ""
10034030-11 = "[ns1] «Кто-то всё ещё выступает на улице.»\n[ns2] «Надо же, старается так поздно.»"
10034030-14 = "Отсюда трудно понять, кто это. Давайте подойдём поближе."
10034030-15 = ""
10034030-17 = ""
10034030-19 = ""
10034030-20 = "...Нет, это кто-то другой."
10034030-21 = "Хм... И что нам теперь делать...?"
10034030-22 = "Хм? Что такое, юная леди?"
10034030-23 = ""
10034030-25 = ""
10034030-27 = ""
10034030-28 = "Студенту опасно гулять так поздно совсем одной..."
10034030-29 = "О, прошу прощения. Вы ведь не совсем одна. Ха-ха."
10034030-30 = "Ну, вряд ли вы пришли сюда ночью ради уличного выступления."
10034030-31 = "Что вас сюда привело? Кого-то ищете?"
10034030-32 = "[s3] «А, дело в том...»\n[s4] Объяснить ситуацию."
10034030-35 = ""
10034030-36 = "Понятно. Ладно, кажется, я понял."
10034030-37 = "Сам я её не видел, но... кажется, знаю, о ком вы говорите."
10034030-38 = "Правда?! К-как..."
10034030-39 = "Да, кажется, я знаю, о ком речь. Похоже на одну знакомую мне студента Вайлдхант. Она очень талантливая."
10034030-40 = "Вайлдхант...?"
10034030-41 = "А... Теперь, когда вы сказали, та форма..."
10034030-42 = ""
10034030-44 = ""
10034030-45 = ""
10034030-46 = "...Понятно... Вот почему она..."
10034030-48 = "В любом случае, я скажу, где, насколько слышал, её видели в последний раз. Если хотите её найти, можете начать оттуда."
10034030-49 = "Не то чтобы она обязательно была там прямо сейчас."
10034030-50 = "Но можете поспрашивать людей поблизости, вдруг кто-нибудь её видел, узнать, куда она пошла, и так далее..."
10034030-51 = "Хм. Хотя, наверное, это имеет смысл только если у вас столько же свободного времени, сколько у меня."
10034030-52 = "А вы учитель, так что наверняка слишком заняты. Без обид."
10034030-53 = "Всё в порядке. В любом случае спасибо."
10034030-54 = ""
10034030-56 = ""
10034030-58 = ""
10034030-59 = "[ns5] «Можете сказать, где её видели?»\n[ns6] «Не переживайте. Спасибо за помощь.»"
10034030-62 = "Сенсей...?"
10034030-63 = ""
10034030-65 = ""
10034030-67 = ""
10034030-68 = "Э-это правда может занять очень много времени. И это ещё ЕСЛИ мы вообще её найдём!"
10034030-69 = "...Всё в порядке? Правда? Но..."
10034030-70 = "[s7] «Мне нравится гулять по ночам.»\n[s8] «Эй, это всё равно лучше бумажной работы.»"
10034030-71 = ""
10034030-72 = ""
10034030-74 = ""
10034030-75 = ""
10034030-77 = ""
10034030-78 = ""
10034030-79 = ""
10034030-80 = "В такие моменты лучше слушаться взрослых, юная леди."
10034030-81 = "Я скажу вам, где это место. Если быстро доберётесь и вам повезёт, возможно, найдёте её там."
10034030-82 = "Д-да...! Тогда...!"
10034030-83 = ""
10034030-85 = ""
10034030-87 = ""
10034030-88 = ""
10034030-89 = "...Спасибо!"
10034030-90 = ""
10034030-92 = ""
10034030-94 = "Мы с Айри шли по её следу всю ночь."
10034030-95 = ""
10034030-96 = ""
10034030-97 = ""
10034030-98 = ""
10034030-99 = ""
10034030-100 = ""
10034030-101 = ""
10034030-102 = ""
10034030-103 = ""
10034030-105 = "...Но так её и не нашли."
10034030-108 = "Ох чёрт, который сейчас час?"
10034030-109 = "Мне так жаль, Сенсей. Из-за меня вы не спали всю ночь."
10034030-110 = "Что? С вами всё нормально? Ха-ха..."
10034030-111 = "...То есть, вы всегда ТАК говорите, но..."
10034030-112 = "Нет, хватит. Мне не стоит унывать. Наверное, вас это только сильнее расстроит."
10034030-113 = "И я это понимаю, но..."
10034030-114 = ""
10034030-116 = ""
10034030-117 = "Дело в том... Я уже много раз думала сказать: «всё хорошо, давайте вернёмся»."
10034030-118 = "Если бы я так сказала, нас бы сейчас здесь не было."
10034030-119 = "К тому же она студент Вайлдхант, совсем не такая, как я..."
10034030-120 = "И даже если я её найду, я..."
10034030-121 = ""
10034030-123 = ""
10034030-124 = "[ns9] «Дай и мне хоть слово вставить...»\n[ns10] «Айри. Подожди...»"
10034030-127 = "...Не рановато ли с самого утра так жаловаться?"
10034030-128 = ""
10034030-130 = ""
10034030-132 = "К-кто это сказал? Кто здесь?"
10034030-133 = "Я. Мне снился чудесный сон, но ваши переживания меня разбудили."
10034030-134 = ""
10034030-139 = ""
10034030-140 = ""
10034030-141 = ""
10034030-142 = "Та-дам. Это я, спящая красавица в лесу... Шиина Цумуги."
10034030-143 = "You don't have to call me \"beauty,\" though. We could say I'm an awakened demon lord, or a spy you just caught. Up to you."
10034030-144 = "Конечно, это вовсе не лес, да и красавицей меня не назовёшь, но..."
10034030-145 = ""
10034030-147 = ""
10034030-148 = ""
10034030-149 = "...эмоция..."
10034030-150 = "...вот что здесь важно."
10034030-151 = "А именно — душевные терзания нашей главной героини."
10034030-152 = "Именно так, мы говорим об истории этой юной леди."
10034030-153 = ""
10034030-155 = ""
10034030-156 = "[ns11] «Ты спала в кустах?!»\n[ns12] «Ты же можешь простудиться...!»"
10034030-159 = "...Ох ты ж."
10034030-160 = "Справедливо. И как вовремя сказано!"
10034030-161 = "Так вот кто вы. Незаменимый персонаж, который всегда находится рядом и защищает главную героиню."
10034030-162 = "Может, вы всеобщий талисман... или что-то вроде того."
10034030-163 = ""
10034030-165 = ""
10034030-166 = ""
10034030-168 = "Хм?"
10034030-169 = ""
10034030-171 = ""
10034030-172 = "А-а-а!!"
10034030-173 = "Ой! Вы меня напугали!"
10034030-174 = "Э-это...! Это она, Сенсей!! Та самая, о которой я говорила!"
10034030-175 = "Уличная музыкантка из Вайлдхант!"
10034030-176 = "А? Это как?"
10034030-177 = "Ох... Какая причудливая игра судьбы..."
10034030-178 = "Так вы двое..."
10034030-179 = "...всё это время искали меня?"
10034030-180 = ""
10034030-181 = "...Понятно, понятно. Я всё поняла."
10034030-182 = "Похоже, сама того не желая, я заставила вас изрядно помучиться. Прошу прощения."
10034030-183 = "Н-ничего страшного. Я этого не планировала, просто..."
10034030-184 = "С другой стороны, возможно, именно путь и придаёт смысл конечной цели."
10034030-185 = "Хм?"
10034030-186 = "Не поймите неправильно, но мне нравится, как всё сложилось. Напоминает историю о полководце, которому пришлось трижды навещать стратега. Чувствую себя сокровищем в самом сердце лабиринта."
10034030-187 = "Или замахнёмся ещё шире? Я словно сокровищница короля пиратов."
10034030-188 = ""
10034030-190 = ""
10034030-191 = ""
10034030-192 = "[ns13] «Айри, ты уверена, что это именно она?»\n[ns14] «*шёпотом* Она немного странная...»"
10034030-195 = "*шёпотом* Я-я ведь никогда раньше с ней не разговаривала..."
10034030-197 = "Не беспокойтесь. Учитывая нашу судьбоносную встречу, я обязана вам ответить."
10034030-198 = "Не ЮРИДИЧЕСКИ обязана, конечно, но..."
10034030-199 = ""
10034030-201 = ""
10034030-202 = ""
10034030-203 = "...«поток»..."
10034030-204 = "...вот что здесь важно."
10034030-205 = "Итак: я, Шиина Цумуги, помогу вам двоим изо всех сил, насколько это в моих возможностях."
10034030-206 = "П-правда? Вы серьёзно?"
10034030-207 = "Даже неловко называть это «помощью», когда вам всего лишь нужно, чтобы я помогла выбрать песню, а не сочинила её."
10034030-208 = "Так какую песню вы хотите? Какой BGM желает наша утончённая главная героиня?"
10034030-209 = "Что бы вы ни захотели научиться играть, я постараюсь помочь всем, чем смогу."
10034030-210 = "Х-хорошо, тогда...!"
10034030-211 = "Что-нибудь, что поможет пройти испытание или прослушивание...!!"
10034030-212 = "Хм?"
10034030-213 = "...А?"
10034030-214 = "Пожалуйста, выберите песню, которая получит лучшую оценку на репетиции или проверке!"
10034030-215 = "...Хм? Простите, я на секунду потеряла нить. Что вы сказали?"
10034030-216 = "Лучшую песню для испытания или оценки...? Это ещё что значит?"
10034030-217 = "Я же сказала! Через две недели мы хотим выступить на открытии Карнавала Тринити."
10034030-218 = "Мы хотим попасть на этот концерт и показать всем, на что способны. Но сначала нам нужно пройти прослушивание..."
10034030-219 = "...А...га..."
10034030-220 = "Хм? Ч-что...?"
10034030-221 = "...Что-то не так? Я вас не расстроила?"
10034030-222 = "Нет. Ну, ничего странного здесь нет. У каждого свои причины заниматься музыкой, и никто не вправе в это вмешиваться."
10034030-223 = "Никто... Но... Хм..."
10034030-224 = ""
10034030-226 = ""
10034030-227 = "...Понятно. Я всё поняла. Значит, вот к чему пока привела нас эта история."
10034030-228 = "Ладно, я могу подобрать для вас несколько песен. Уже есть пара вариантов."
10034030-230 = "*ахает*"
10034030-231 = "...Но."
10034030-232 = "Хм?! Д-да? Но...?"
10034030-233 = ""
10034030-235 = ""
10034030-236 = ""
10034030-237 = "Но, эм... Ну, вы же знаете, как бывает в таких историях."
10034030-238 = "Главная героиня слышит что-то загадочное и непонятное, но не понимает этого."
10034030-239 = "А потом, позже, всё внезапно обретает смысл. Мне нравятся такие истории."
10034030-240 = "Так что я просто кое-что скажу, а вы пока не думайте об этом слишком много."
10034030-241 = "Эм... Э-э..."
10034030-242 = "...Главная героиня, Куримура Айри."
10034030-243 = "...Д-да?!"
10034030-244 = ""
10034030-246 = ""
10034030-247 = ""
10034030-248 = ""
10034030-249 = "...Музыка похожа на лошадь. Она чувствует твои эмоции. Может быть, даже мысли."
10034030-250 = "Если нервничать, сидя верхом, она завалится прямо на тебя."
10034030-251 = "Так что не бойся сесть на неё..."
10034030-252 = ""
10034030-254 = ""
10034030-255 = ""
10034030-256 = "...и стань человеком, который умеет получать удовольствие от поездки."
