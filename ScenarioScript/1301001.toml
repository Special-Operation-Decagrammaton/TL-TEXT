[translation]
1301001-1 = "Ответственные траты"
1301001-2 = "Рабочий кабинет Сенсея в Шале"
1301001-3 = "Здравствуйте, Сенсей. Я принесла счёт, о котором писала. Посмотрите, когда будет время."
1301001-4 = "О! Ты ел. Простите, что помешала."
1301001-5 = "[s] «Всё нормально. Не переживай.»"
1301001-6 = "Тогда пока ты ешь, я приберу на столе."
1301001-7 = ""
1301001-8 = ""
1301001-9 = "Сенсей... ты на обед ешь только хлеб?"
1301001-10 = "Прости, если лезу не в своё дело... но разве тебе не стоит питаться полезнее?"
1301001-11 = "Питаться одним хлебом точно вредно."
1301001-12 = "Что?! У тебя закончились деньги, и до конца месяца ты не можешь позволить себе нормальную еду?"
1301001-13 = "Я не знала, что в Шале так мало платят преподавателям... Я в шоке."
1301001-14 = ""
1301001-15 = ""
1301001-16 = "Подожди. Этот чек разве не из знаменитого магазина игрушек в центре Кивотоса?"
1301001-17 = "Он с прошлой недели, и ты потратил... 100 000 иен на лимитированные трансформирующиеся роботы?!"
1301001-18 = "Сенсей! Объясни этот чек! Это месячный запас еды!"
1301001-19 = "Ты отказался от нормального питания ради детских игрушек? Ты с ума сошёл!"
1301001-20 = "[s1] «Это не просто игрушки! Они мне НУЖНЫ!»\n[s2] «Мне не нужна еда, пока у меня есть эти роботы!»"
1301001-21 = "Глупости! Тебе нужно начать тратить деньги разумнее!"
1301001-22 = "Глупости! Тебе нужно начать тратить деньги разумнее!"
1301001-23 = ""
1301001-24 = "Всё, хватит. Я сама буду проверять твои расходы! Где твоя чековая книжка?"
1301001-25 = "Что? Ты не ведёшь чековую книжку?"
1301001-26 = "Вот поэтому ты и тратишь деньги импульсивно!"
1301001-27 = ""
1301001-28 = "Сенсей, собери все чеки за последний месяц."
1301001-29 = "С этого момента я буду вести твою бухгалтерию и следить за расходами."
1301001-32 = "― Серьёзно... Ты взрослый, должен понимать, что нельзя совершать импульсивные покупки.[wa:2540]"
1301001-35 = "― Ты же не ребёнок, который тратит все карманные деньги сразу, как только получает?[wa:10]"
1301001-38 = "― И вдобавок только я помогаю тебе вот так разбирать чеки...[wa:3620]"
1301001-40 = "― Если продолжишь так, я больше не буду помогать![wa:420]"
1301001-43 = "― Сэндвич с курицей из магазина две недели назад... 500 иен.[wa:2880]"
1301001-45 = "― Новый том манги... 450 иен.[wa:1640]"
1301001-48 = "― А? Ты потратил 20 000 иен в Club Smoochie той ночью?[wa:3300]"
1301001-51 = "― С-Сенсей! Этот чек — то, о чём я думаю?![wa:620]"
1301001-53 = "― Ты учитель! Ты должен подавать пример студентам! Как ты мог...?[wa:2920]"
1301001-56 = "― Отвратительно! Ты просто худший![wa:360]"
1301001-59 = "― А? Club Smoochie — это название гача-игры?[wa:2320]"
1301001-61 = "― Фух. А я подумала, что ты ходил в...[wa:2020]"
1301001-64 = "― Подожди! Это всё равно не оправдывает 20 000 иен за одну ночь![wa:820]"
1301001-67 = "― Никаких больше импульсивных покупок! Тебе нужен бюджет![wa:2460]"
1301001-69 = ""
1301001-70 = "Смотри сюда. Если не считать трансформирующегося робота, ты мог сэкономить 50 000 иен!"
1301001-71 = "Если хотя бы время от времени следить за расходами, тебе не придётся питаться одним хлебом."
1301001-72 = "Если хочешь купить что-то дороже 5 000 иен, сначала советуешься со мной!"
1301001-73 = "[s] «Но почему я должен отчитываться тебе о своих расходах?»"
1301001-74 = "Ну, я... Если хочу о тебе заботиться, должна следить и за твоими привычками тратить деньги..."
1301001-75 = "В любом случае! Это ради твоего же блага, так что просто делай!"
1301001-77 = "Юука ещё какое-то время меня отчитывала, а потом ушла."
