[translation]
2600302-1 = "Ангел Тринити"
2600302-2 = "(После долгого рабочего дня я решил пройтись по парку и подышать свежим воздухом.)"
2600302-3 = "(На прохладном открытом воздухе мне вдруг захотелось холодного яблочного сока.)"
2600302-4 = "О, Сенсей! Какая встреча."
2600302-5 = "Гуляешь? Рада видеть, что ты заботишься о себе."
2600302-6 = "А я что здесь делаю? Эм, просто..."
2600302-7 = "Спасибо!"
2600302-8 = "Спасибо!"
2600302-9 = "Хи-хи. Ничего особенного. Просто помогла этим детям — им явно требовалась помощь."
2600302-10 = "Она достала мой шарик с дерева!"
2600302-11 = "А мне обработала рану, когда я ушибся, играя в мяч! Она лучшая!"
2600302-12 = "А-Ахаха. Немного неловко. Правда, ничего особенного..."
2600302-13 = "Не думаю, что я добрее обычного человека. К тому же я всё-таки Рыцарь исправительного курса."
2600302-14 = "Помогать людям и возвращать улыбки на их лица..."
2600302-15 = "...этого мне достаточно."
2600302-16 = "Я и сама до конца не понимаю. Наверное, просто такая я есть."
2600302-17 = "Но хватит обо мне. В последнее время ты выглядишь уставшим. Всё нормально?"
2600302-18 = "Говоришь, всё хорошо? Нет, не верю!"
2600302-19 = "От меня не скроешь. Ты слишком много работаешь, пропускаешь еду и перебиваешься перекусами..."
2600302-20 = "...и постоянно лезешь в опасные ситуации ради других. Так и свалиться можно!"
2600302-21 = "Я всегда ношу с собой аптечку, но это не значит, что хочу ей пользоваться."
2600302-22 = "...Эм."
2600302-23 = "Прости. Не стоило так лезть. Я не хочу тебя раздражать, Сенсей."
2600302-24 = "Вообще-то я и сама плохо о тебе заботилась. Мне стыдно."
2600302-25 = "Может, я слишком расслабляюсь, потому что ты старше..."
2600302-26 = "Я так разочарована в себе."
2600302-27 = "[s1] «Не нужно так волноваться. Со мной всё будет хорошо.»\n[s2] «Ты нужна и другим людям, я понимаю.»"
2600302-28 = "Но я же говорила: то, что ты взрослый, не означает, что можно тебя оставлять без внимания!"
2600302-29 = "Ты говоришь, что понимаешь, но всё равно..."
2600302-30 = ""
2600302-31 = "Это немного, но хочешь? Яблочный сок."
2600302-32 = "Что? Именно его тебе сейчас хотелось?!"
2600302-33 = "Тогда отлично. Рада быть полезной."
2600302-34 = "...Хи-хи."
2600302-35 = "Удачи с оставшейся работой! Только не переусердствуй!"
2600302-36 = "Если когда-нибудь понадобится помощь — зови меня, Сенсей!"
2600302-37 = "Я сразу прибегу!"
2600302-38 = "[s] «Не буду, и спасибо, Серина.»"
2600302-39 = "...Хи-хи."
2600302-40 = "Обещаешь."
2600302-41 = "Тогда я запомню! Ты знаешь, где меня найти!"
