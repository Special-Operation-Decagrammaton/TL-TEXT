83306065100-5 = ""
83306065100-6 = "Хм? Почему вокруг Клуба школьных обедов столько людей?"
83306065100-7 = "А, Хина. Дело в том, ну..."
83306065100-8 = "Кто-то сказал, что здесь слышал плач кошки."
83306065100-9 = "Кошки? ...Правда?"
83306065100-10 = "Ну... В районе Клуба школьных обедов редко увидишь бездомных кошек!"
83306065100-11 = "Все переживали, что какая-нибудь кошка просит о помощи."
83306065100-12 = "Просит о помощи, говоришь."
83306065100-13 = "...Хм."
