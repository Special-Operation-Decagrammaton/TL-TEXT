[translation]
1005102-1 = "Модная страсть капитана"
1005102-2 = "Мастерская Инженерного Департамента"
1005102-3 = "Я отправился в мастерскую Инженерного отдела, чтобы вернуть Утахе её лабораторный халат."
1005102-4 = ""
1005102-9 = "[ns] «Утаха, я пришёл.»"
1005102-10 = "Сенсей? Подождите..."
1005102-11 = "Одну минуту. Сейчас выйду..."
1005102-12 = ""
1005102-16 = ""
1005102-17 = "Вы и правда пришли! Что привело вас сюда в такой час?"
1005102-18 = "Вы проделали весь путь только чтобы принести мне лабораторный халат?"
1005102-19 = "На самом деле это было не так срочно... Простите, что побеспокоила."
1005102-20 = "[s] «Всё нормально. Не переживай.»"
1005102-22 = "[ns] «Но, эм, что за форма группы поддержки?»"
1005102-23 = "Ну, мне нечего было надеть поверх школьной формы."
1005102-24 = "В конце концов, когда я работаю с машинами, одежда всегда пачкается."
1005102-25 = "То сажа, то смазка..."
1005102-26 = "О, и многие мои инструменты довольно острые, так что школьная форма постоянно под угрозой."
1005102-27 = "Поэтому обычно ради безопасности я надеваю что-то поверх формы, но сегодня ничего подходящего не было, поэтому надела костюм, который носила на спортивном празднике."
1005102-28 = "[s] «Неудобно?»"
1005102-29 = "Хм... Немного жёсткий, но для работы подходит лучше, чем я думала."
1005102-30 = "В чём-то, возможно, даже лучше моей обычной одежды."
1005102-31 = "Высокий ворот закрывает шею, а тёмная ткань хорошо скрывает сажу."
1005102-32 = "И главное — мне кажется, эта одежда... пахнет страстью."
1005102-33 = "[s] «...Страсть случайно не пахнет сажей?»"
1005102-34 = "Возможно. Главное... когда я надеваю это, внутри меня что-то загорается."
1005102-35 = "Логика делает нашу работу возможной, но именно страсть делает нас мастерами."
1005102-36 = "Когда я работаю в этой форме... будто снова возвращаюсь на спортивный праздник, чувствую жар прямо на коже..."
1005102-37 = "Я слышу возгласы, наполнявшие стадион, вижу лучи солнца, поднимающиеся над трибунами..."
1005102-38 = "Быть наполненной страстью — вот стиль настоящего мастера. Без внутреннего огня мы бы застыли в застое! ...Надо поставить это на будильник."
1005102-39 = "Хаха. А ты что скажешь, Сенсей? Чувствуешь аромат страсти этой формы болельщицы?"
1005102-40 = ""
1005102-42 = ""
1005102-43 = ""
1005102-45 = "[ns] «Нет, она просто... пахнет.»"
1005102-46 = "...А?"
1005102-47 = "Ох... Ты... Мы ведь сейчас не о метафорическом запахе, да?"
1005102-48 = "Если подумать, после спортивного праздника я ведь просто оставила эту форму в мастерской..."
1005102-49 = "..."
1005102-50 = ""
1005102-52 = ""
1005102-57 = ""
1005102-58 = "...Прости, что так внезапно ушла и заставила тебя ждать."
1005102-59 = "Я... кое-что переосмыслила. Думаю, мне лучше придерживаться моей обычной одежды."
1005102-60 = "Материал лёгкий, поэтому двигаться удобно. И сразу понятно, когда он пачкается..."
1005102-61 = "Как и инструменты, одежда показывает свою настоящую ценность только в деле."
1005102-62 = "[s] «Значит, больше никакой формы болельщицы?»"
1005102-63 = "А? Той, что была на мне раньше?"
1005102-64 = "Ну... совсем исключать её не буду..."
1005102-65 = "Это дорогой подарок от моего младшего студента, да и дизайн с материалом мне нравятся."
1005102-66 = "...Хотя постирать её всё-таки стоит."
1005102-67 = "Но я твёрдо решила не надевать её во время работы с механизмами."
1005102-68 = "К тому же, если президент Инженерного отдела начнёт разгуливать в такой форме, это может вызвать путаницу насчёт образа Миллениума."
1005102-69 = "Но если мне когда-нибудь понадобится как следует разжечь свою страсть..."
1005102-70 = "...иногда дополнительная искра всё же нужна. Хи-хи."
