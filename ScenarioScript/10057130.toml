[translation]
10057130-1 = "Afterword Part 1;Heading to Gehenna"
10057130-2 = "Gehenna Cup Stadium"
10057130-6 = "Arrival."
10057130-12 = "My back hurts so much...! I should have made the seat cushions softer!"
10057130-13 = "Look, so many tanks! I am going to go check them out!!"
10057130-16 = "Wait, come with me!!"
10057130-21 = "Kikiki... What is this suspicious vehicle?"
10057130-22 = "Must be those Red Winter punks. Kikiki... Welcome to the Gehenna Cup--"
10057130-26 = "You must be the parking attendant. Thank you for your hard work."
10057130-30 = "???"
10057130-34 = "Whoa...!"
10057130-45 = "I have a feeling there are going to be some tough opponents here...!"
10057130-46 = "All of these tanks look so cool..."
10057130-47 = "Puppy-gou is not losing to them! We even got a discount on the toll fee!"
10057130-48 = "That is probably just because of its small size..."
10057130-51 = "Hey! Over there! Let us go take a look!"
10057130-54 = "So fast! Wait up!!"
10057130-58 = "Even with vertical armor, the defense looks high..."
10057130-61 = "...An 88mm gun. What a magnificent tank."
10057130-62 = "So cool. It looks super heavy, but I wonder if it actually runs?"
10057130-63 = "How about we take a picture with it?"
10057130-64 = "Hmm... But it would be bad if the owner showed up..."
10057130-69 = "What are you people doing?"
10057130-70 = "Whoa!! They actually showed up!!"
10057130-71 = "Well, of course they would!?"
10057130-72 = "You look like you have just seen a ghost..."
10057130-73 = "Please stay away from the tank, it is dangerous."
10057130-74 = "Y-Yes! We are sorry!!"
10057130-75 = "Jeez... This is so embarrassing!"
10057130-81 = "We should probably park our tank somewhere else."
10057130-82 = "It is parked in a weird spot. The body scraped against something a few times."
10057130-84 = "Was it a bad idea to move the cockpit into the fighting compartment?"
10057130-85 = "It could not be helped. #nSay, Rana, the engine got bigger... so the cockpit must have been cramped and hot, right?"
10057130-87 = "No. It was just right. It was warm and I slept well."
10057130-88 = "Isn't that the absolute worst thing to say while driving!?"
10057130-90 = "Hmm..."
10057130-97 = "A tank with a rather eccentric design..."
10057130-98 = "You people are interesting."
10057130-99 = "Iroha-選手! As the reigning champion of this tournament, please give us a comment!"
10057130-100 = "Sigh... This is why I did not want to go outside."
10057130-101 = "There are too many people here, let us move over there."
10057130-105 = "Eh? That person was the reigning champion?"
10057130-106 = "She kept staring right at us, so I wondered what was up..."
10057130-107 = "Compared to such an impressive tank, ours looks pretty wacky~"
10057130-110 = "Se..."
10057130-111 = "Ah, do not get mad. It did not feel like she was mocking us, and--"
10057130-116 = "She called it a tank!!"
10057130-117 = "See! Anyone can clearly tell it is a tank! That girl has a good eye!!"
10057130-118 = "I really am a genius!"
10057130-119 = "A-Ahahaha... I am just glad Anna is happy..."
