[translation]
10057130-1 = "Aftermath Part 1;Arriving at Gehenna"
10057130-2 = "Gehenna Cup Stadium"
10057130-6 = "We've arrived."
10057130-12 = "My back is killing me! I should've made the seat cushion softer!"
10057130-13 = "Look, there are so many tanks! I'm going to go check them out!"
10057130-16 = "Wait for me, let's go together!"
10057130-21 = "Kikiki... What is this strange vehicle?"
10057130-22 = "Must be those Red Winter folks. Kikiki... Welcome to the Gehenna Cup—"
10057130-26 = "You must be the parking attendant. We're counting on you."
10057130-30 = "???"
10057130-34 = "Whoa...!"
10057130-45 = "I have a feeling this place is full of tough opponents...!"
10057130-46 = "Every one of these tanks looks so cool..."
10057130-47 = "The Puppy-Go is just as good! We even got a discount on the toll!"
10057130-48 = "That's probably just because it's so small..."
10057130-51 = "Hey! Over there! Let's go see it!"
10057130-54 = "So fast! Hey, wait up!!"
10057130-58 = "It has vertical armor, but it looks like it has high defensive capabilities..."
10057130-61 = "...An 88mm cannon. What a magnificent tank."
10057130-62 = "Wow. It looks super heavy, but I wonder if it actually runs?"
10057130-63 = "How about we take a picture with it?"
10057130-64 = "Hmm... but it'd be bad if the owner showed up, wouldn't it?"
10057130-69 = "May I help you? Who are you people?"
10057130-70 = "Whoa!! They actually showed up!!"
10057130-71 = "Well, of course they would!?"
10057130-72 = "You look like you've seen a ghost..."
10057130-73 = "Please stay away from the tank, it's dangerous."
10057130-74 = "Y-yes! Sorry!!"
10057130-75 = "Ugh~! This is so embarrassing!"
10057130-81 = "Maybe we should park our tank somewhere else."
10057130-82 = "It's parked in a weird spot. We've already scraped the hull a few times."
10057130-84 = "Was it a bad idea to move the cockpit into the fighting compartment?"
10057130-85 = "It couldn't be helped. #nAlso Rana, since the engine got bigger... the cockpit was cramped and hot, right?"
10057130-87 = "Nope. It was just right. It was warm, and I slept well."
10057130-88 = "Isn't that the worst thing you could possibly do while driving!?"
10057130-90 = "Hmm..."
10057130-97 = "A tank with such eccentric ideas..."
10057130-98 = "You people are quite interesting."
10057130-99 = "Iroha-senshu! As the absolute champion of this tournament, could we get a comment?"
10057130-100 = "Sigh... this is exactly why I didn't want to come out."
10057130-101 = "There are too many people here, let's move over there."
10057130-105 = "Huh? That person was the absolute champion?"
10057130-106 = "They were staring at us so intently, I wondered what was up..."
10057130-107 = "Compared to such a magnificent tank, ours must look pretty weird, right?"
10057130-110 = "Se..."
10057130-111 = "Oh, don't be mad. It didn't feel like they were making fun of us—"
10057130-116 = "They called it a tank!!"
10057130-117 = "See! No matter how you look at it, it's a tank!! That person has a good eye!!"
10057130-118 = "I really am a genius!"
10057130-119 = "A-ahahaha... I'm just glad Anna is happy..."