[translation]
1009302-1 = "Клубная деятельность Кирары"
1009302-2 = "Я уже выходил из Геенны, когда увидел группу студентов, которые весело болтали и шли вместе."
1009302-3 = ""
1009302-5 = ""
1009302-6 = ""
1009302-7 = ""
1009302-8 = ""
1009302-9 = ""
1009302-10 = "[ns] «(Какая дружная компания...)»"
1009302-11 = ""
1009302-12 = "Нам туда! Пока, Кирара!"
1009302-13 = "Окей-доки! До встречи!"
1009302-14 = ""
1009302-16 = ""
1009302-18 = ""
1009302-19 = "О?"
1009302-21 = "Учитель! [USERNAME], Учитель! Вот это приятный сюрприз!"
1009302-22 = "Вы возвращаетесь после работы? Я тоже! Ну, не с работы, просто занятия только закончились!"
1009302-23 = "[s] «Это были твои подруги?»"
1009302-24 = "Ага! Я познакомилась с ними только сегодня, но мы уже лучшие подружки! Сразу нашли общий язык!"
1009302-25 = "[s1] «Совсем не похоже, что вы встретились впервые!»\n[s2] «Казалось, будто вы дружите уже вечность!»"
1009302-28 = "А? А какая разница, сколько я их знаю?"
1009302-29 = "Мы уже друзья! Ха-ха-ха!"
1009302-30 = "Ну типа, мы с вами тоже суперблизки, Учитель! Какая разница, когда познакомились!"
1009302-31 = "[s] «Вот это харизма...! Наверное, это и называют „душой компании“.»"
1009302-32 = "Ха-ха-ха! Да ничего особенного!"
1009302-33 = "А, поняла! Вы что... ревновали, Учитель?"
1009302-34 = "Ха-ха-ха! Не переживайте. Теперь я всё поняла!"
1009302-36 = ""
1009302-37 = ""
1009302-39 = ""
1009302-40 = ""
1009302-47 = ""
1009302-48 = "Так вот, в том магазине у дома..."
1009302-49 = "Ой! Мы уже пришли!"
1009302-50 = "Я живу в той стороне, так что давайте попрощаемся здесь!"
1009302-51 = "[s] «Перед тем как ты уйдёшь, можно спросить кое-что?»"
1009302-52 = "Вопрос? Мне?! О боже, какой? Какой?"
1009302-53 = "[s3] «Почему бы тебе не вступить в клуб, Кирара?»\n[s4] «Такая как ты завела бы в клубе кучу друзей.»"
1009302-56 = "О! Вот что вы хотели узнать?"
1009302-57 = "Но... я же состою в клубе?"
1009302-58 = "...А? Клуб «Домой после школы» — это просто красивое название для тех, кто избегает клубной деятельности?"
1009302-59 = "Ха-ха-ха! Учитель! От вас ничего не скроешь!"
1009302-60 = "Вы правы. Технически я была в Клубе «Домой после школы»..."
1009302-61 = ""
1009302-63 = ""
1009302-65 = "Но больше нет!"
1009302-66 = "Я создала совершенно особенный клуб! Клуб «Сияй-Сияй»!"
1009302-67 = "[s] «Клуб... „Сияй-Сияй“?»"
1009302-68 = "Точно! Суперволнительный, суперсияющий клуб!"
1009302-69 = "[s] «Я-я не понимаю...»"
1009302-70 = "Ну да, обычные клубные занятия вроде спорта, хобби и всего такого — весело... Но разве это вообще в моём стиле?"
1009302-71 = "Каждый день видеть одних и тех же людей... и каждый-каждый день делать одно и то же!"
1009302-72 = "Короткое время это может быть забавно, но представьте постоянно тусоваться только с одной компанией? Ску-у-ука!"
1009302-73 = "Вот поэтому я и создала совершенно новый клуб!"
1009302-74 = "Мы не будем ограничены одной темой, как другие клубы! По дороге домой можем встречать разных людей и заводить новых друзей!"
1009302-75 = "Заодно можно зайти на фуд-корт посплетничать... вместе пройтись по магазинам..."
1009302-76 = "Пойти попеть в караоке, если будет настроение..."
1009302-77 = "Будет просто отпад!"
1009302-78 = "Конечно, никто не обязан знакомиться с новыми людьми, ходить по магазинам или в караоке... Нужно просто веселиться!"
1009302-79 = "Вот девиз Клуба «Сияй-Сияй»!"
1009302-80 = "Ну как? Суперволнительно, суперсияюще! Правда?"
1009302-81 = "[s] «Точно! Такое под силу только Кираре — душе компании!»"
1009302-82 = "Вот тут вы ошибаетесь!"
1009302-83 = "Вы тоже можете, Сенсей!"
1009302-84 = "А... Может, и нет? Вы же всё-таки учитель...? Ха-ха-ха!"
1009302-85 = "Хм... Но знаете, мне кажется, сегодняшняя клубная деятельность прошла очень успешно!"
1009302-86 = "...Хм? Почему я так говорю?"
1009302-87 = ""
1009302-89 = ""
1009302-93 = "Ну потому что я встретилась с вами и вот так поболтала!"
1009302-94 = "Как вам, Учитель?"
1009302-95 = "[s] «Ты права. И мне понравилось узнать тебя чуть лучше, Кирара.»"
1009302-96 = "Хи-хи-хи!"
