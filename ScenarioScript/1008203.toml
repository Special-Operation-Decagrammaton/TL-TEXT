[translation]
1008203-1 = "Суть юности: Переведённый ученик"
1008203-3 = "[ns] Так что именно это за занятия?"
1008203-4 = "Хм, начинаешь с важных вопросов."
1008203-5 = "Я так настойчиво просила тебя помочь, но теперь, когда мы действительно начали, всё кажется немного ошеломляющим."
1008203-6 = "Мы оба новички в поисках юности, и у нас нет готового плана, которому можно следовать."
1008203-7 = "Пытаться найти путь здесь — всё равно что плыть по туманному морю без компаса..."
1008203-8 = "[s1] В юношеских занятиях тоже бывают новички?\n[s2] Может, мы немного слишком всё усложняем?"
1008203-9 = ""
1008203-10 = ""
1008203-12 = ""
1008203-13 = "Наставник! Если недооценить юность, она одолеет тебя прежде, чем ты это заметишь!"
1008203-14 = "Любое занятие требует правильной подготовки. Новички вроде нас не могут просто с головой броситься в юношеские приключения, иначе..."
1008203-15 = "[s] ...Иначе?"
1008203-16 = "Неподготовленные тело и разум могут не выдержать всей тяжести юности!"
1008203-17 = ""
1008203-19 = ""
1008203-20 = "Мы можем получить острый юностатический шок ещё до того, как поймём, что произошло!"
1008203-21 = ""
1008203-24 = "[ns] Ю-Юностатический шок?! Я не знал, что эти занятия настолько серьёзны!"
1008203-25 = "Всё в порядке, Наставник. Нам лишь нужно действовать осторожно и не пропускать ни одного шага."
1008203-26 = "Всё как на тренировках. Я ведь не отправляю новичков Хяккарёран сразу на самые сложные курсы."
1008203-27 = "Так что не волнуйся! Мы справимся с этим вместе."
1008203-28 = "Вообще-то я уже придумала несколько возможных сценариев для юношеских занятий."
1008203-29 = "[s] Ты уже давно это планируешь, да?"
1008203-30 = ""
1008203-32 = ""
1008203-33 = "Н-Ну...!"
1008203-34 = "Мне нечего стыдиться! ДА, я это планировала! Это ведь мечта всей моей жизни."
1008203-35 = "На самом деле я провела множество исследований о юности и о том, что она означает."
1008203-36 = "Литература по этой теме говорит, что отношения — сама суть юности!"
1008203-37 = "[s] Отношения? В каком смысле?"
1008203-38 = ""
1008203-40 = ""
1008203-41 = "Ученики переживают самые разные отношения. Например, соперничество!"
1008203-42 = "Двое соперников вращаются вокруг успехов и неудач друг друга. Они доводят себя до предела и встают друг против друга в пылающих безднах ада, стремясь превзойти противника!"
1008203-43 = "Это постоянное столкновение и притяжение конфликта и уважения, ненависти и любви!"
1008203-44 = "Что может лучше воплощать юность, чем пылающая страсть соперников?"
1008203-45 = "[s] Кажется, я начинаю немного лучше понимать эту затею... наверное..."
1008203-46 = "Если соперничество тебе не подходит, есть и другие виды отношений!"
1008203-47 = "Наш мир состоит из целого зверинца самых разных связей, каждая из которых сопровождается яркой историей юности!"
1008203-48 = "Поэтому для нашего первого, монументального и меняющего жизнь юношеского занятия я подготовила специальный сценарий."
1008203-49 = ""
1008203-51 = ""
1008203-52 = "Переведённый ученик!"
1008203-53 = "[ns] Что? Я ожидал совсем не этого!"
1008203-55 = "Отныне мы будем проживать опыт переведённого ученика, Сенсей—"
1008203-56 = "Нет! Наставник!"
1008203-57 = ""
1008203-62 = "Я побежал за Рэнгэ, которая умчалась вперёд с криком: «Именно здесь начинаются все приключения переведённого ученика!»"
1008203-63 = "Я удивился, когда мы оказались в переулке совсем недалеко от клубной комнаты Хяккарёран."
1008203-67 = "[ns] Почему все приключения переведённого ученика начинаются именно здесь, Рэнгэ?"
1008203-68 = "Разве ты не знаешь почему, Наставник?"
1008203-69 = "Мы воспроизводим уроки из произведения «Кои о любви» и следуем замыслу его автора в поисках моей юности."
1008203-70 = "Как тебе прекрасно известно, первая история автора рассказывала о приключениях неожиданно появившегося переведённого ученика и героини."
1008203-71 = "[s3] А, д-да. Конечно, прекрасно известно.\n[s4] ...Разве я это знал?"
1008203-74 = "Неожиданный гость издалека... Каждый день приносит новый волнующий поворот сюжета, и никогда не знаешь, по какому пути всё пойдёт дальше!"
1008203-75 = "Поэтому наши сегодняшние юношеские занятия начнутся точно так же, как та история."
1008203-76 = "Назовём это примерно так... «Суть юности: Переведённый ученик»!"
1008203-77 = "[s] ...То есть мы собираемся воссоздать события истории?"
1008203-78 = "Хи-хи! Именно так!"
1008203-79 = "Ты сразу понял мой замысел! Как и ожидалось от Наставника!"
1008203-80 = "Вот! Для этой сцены необходим важнейший реквизит."
1008203-81 = ""
1008203-83 = ""
1008203-84 = "[ns] Ломтик тоста...? Мы случайно не опаздываем в школу, Рэнгэ?"
1008203-85 = "Да, именно! Тогда ты точно знаешь, что делать, когда услышишь мой сигнал. Я займу позицию."
1008203-86 = ""
1008203-88 = ""
1008203-89 = "[ns] П-Подожди! Рэнгэ...?!"
1008203-93 = ""
1008203-94 = "Всё готово."
1008203-95 = ""
1008203-97 = ""
1008203-98 = "Тост у меня во рту, а земля под ногами ровная и твёрдая. Идеально, чтобы мчаться так, словно я опаздываю в школу."
1008203-102 = "Солнце светит как надо, а лёгкий ветер мягко играет с моими волосами."
1008203-105 = "Сцена готова! Идеальные декорации для эпизода юности!"
1008203-106 = "Каждая история о переведённом ученике начинается именно так...!"
1008203-107 = ""
1008203-109 = ""
1008203-111 = "Это событие «Я опаздываю в первый день в новой школе, поэтому со всех ног бегу с тостом во рту и врезаюсь в ученика в переулке»!"
1008203-112 = ""
1008203-116 = "Рэнгэ подала сигнал и рванула на полной скорости. Очень, очень большой скорости."
1008203-120 = ""
1008203-121 = "Пора! С тостом во рту я помчусь навстречу своей пылающей юности! Беги, Рэнгэ, беги! Изо всех сил...!"
1008203-122 = "А теперь реплика юности!"
1008203-123 = "«А! Я опаздываю! Я ужасно опаздываю!»"
1008203-124 = ""
1008203-126 = ""
1008203-127 = "Хи-хи-хи! Скоро твоя очередь, Наставник!"
1008203-128 = ""
1008203-130 = ""
1008203-133 = "[ns] Кажется, Рэнгэ не осознаёт, насколько быстро она бегает!"
1008203-134 = ""
1008203-137 = "Хия-а-а!"
1008203-138 = "Мы вот-вот должны были столкнуться на пугающе огромной скорости."
1008203-139 = ""
1008203-143 = "[ns] Ургх! Активировать аварийное уклонение!"
1008203-149 = ""
1008203-150 = "Ч-Ч-Что?! Сенсей?! Мы же были прямо на кульминации сцены! Почему ты уклонился?"
1008203-151 = "Цель — доблестно врезаться в переведённого ученика и оставить незабываемое первое впечатление, которое мы пронесём через всю жизнь!"
1008203-152 = "[s5] Если мы так столкнёмся, одним первым впечатлением дело не ограничится!\n[s6] Юношеские занятия не должны включать травмы!"
1008203-153 = ""
1008203-154 = ""
1008203-156 = ""
1008203-157 = "Э-Эм... О. Правда?"
1008203-158 = "[s] Как твой наставник, я должен быть твёрд. Следующая сцена, Рэнгэ!"
1008203-159 = "Пожалуй, спорить мне не стоит..."
1008203-160 = "Да! Не зря же ты мой наставник!"
1008203-161 = "Ничего страшного. Для такого типа отношений есть ещё множество сцен!"
1008203-163 = "Остальные подготовленные Рэнгэ эпизоды были похожи на первый, только немного менее опасными."
1008203-165 = "Незабываемая встреча с тостом уже состоялась, значит дальше..."
1008203-166 = "Я уже сижу за своей партой, как вдруг..."
1008203-171 = "[ns] Здравствуйте... Я новый переведённый—"
1008203-172 = ""
1008203-174 = ""
1008203-175 = "Ты! Я тебя помню! Мы столкнулись... увидели друг друга в переулке!"
1008203-176 = "Один раз ты от меня ускользнул, но теперь я так легко тебя не отпущу!"
1008203-177 = "[s] Почему ты издеваешься над переведённым учеником?!"
1008203-179 = "Вторая встреча после неожиданного выяснения, что новый ученик оказался в моём классе..."
1008203-180 = "Это будет..."
1008203-182 = "Что?!"
1008203-183 = "Ты забыл учебники? В первый же день?!"
1008203-184 = "Ничего не поделаешь. Х-Хех. Хех."
1008203-185 = "Вот, подвинься немного ближе."
1008203-186 = ""
1008203-191 = "Будем пользоваться вместе! Н-Но только сегодня, понятно?"
1008203-192 = "П-Предупреждаю, если пересечёшь границу моей парты... Хи-хи..."
1008203-193 = ""
1008203-195 = ""
1008203-196 = "Я уничтожу тебя и всё, что тебе дорого."
1008203-197 = "[s] Ты опять угрожаешь переведённому ученику?!"
1008203-199 = "А-А?! Я что-то сделала не так? Наверное, я просто не знаю, что именно говорят в такой ситуации."
1008203-200 = "Но... позволить переведённому ученику, которого я вообще не знаю, вторгнуться в моё личное пространство? Это уже слишком."
1008203-201 = "Меня это вообще-то... реально бесит... одна только мысль, что кто-то подойдёт ко мне без разрешения..."
1008203-202 = "[s] «Почему-то это так на тебя похоже, Рэнгэ!»"
1008203-208 = "Мы разыгрывали одну ситуацию за другой, разбирая, правильно ли воспроизводим сценарии с переведённым учеником. Но почему-то всякий раз промахивались мимо сути."
1008203-210 = "Время пролетело незаметно, и солнце начало садиться."
1008203-215 = ""
1008203-216 = "[ns7] «...День уже подходит к концу, Рэнгэ. Ну и каков вердикт?»\n[ns8] «Удалось тебе сегодня прочувствовать ту юность, которую ты представляла?»"
1008203-217 = ""
1008203-218 = ""
1008203-220 = ""
1008203-221 = "Не хочу тебя разочаровывать, но..."
1008203-222 = "Я не могу с уверенностью ответить ни да, ни нет."
1008203-223 = ""
1008203-225 = ""
1008203-226 = "И дело вовсе не в том, как ты справлялся, Наставник!"
1008203-227 = "Просто всё происходило совсем не так, как я представляла у себя в голове, понимаешь?"
1008203-228 = "Оказалось, разыгрывать то, что я всегда воображала, куда сложнее, чем я думала... Будто чего-то не хватает."
1008203-229 = "Как бы сказать..."
1008203-230 = "Мне кажется, я так увлеклась воссозданием сцен, что совсем потеряла из виду саму себя."
1008203-231 = "[s] «Понимаю тебя.»"
1008203-232 = "Я пыталась силой подогнать всё под эти неестественные ситуации, но детали никак не складывались как надо."
1008203-233 = "Я отняла у тебя столько времени, а сама показала довольно посредственное выступление."
1008203-234 = "Прости, Сенсей. Я плохо подготовилась к нашим сегодняшним вылазкам... Я ведь всё испортила, да?"
1008203-235 = "А! Можешь не отвечать. Всё равно уже поздно."
1008203-236 = ""
1008203-238 = ""
1008203-239 = "Немного неприятный осадок остался, но на сегодня, пожалуй, хватит."
1008203-240 = "[s] «Если бы я только что сюда перевёлся, то был бы новичком в этих местах, верно?»"
1008203-241 = ""
1008203-243 = ""
1008203-244 = "...А?"
1008203-245 = "[s] «Почему бы тебе не устроить переведённому ученику экскурсию по своим любимым местам?»"
1008203-246 = ""
1008203-248 = ""
1008203-249 = "О. И правда!"
1008203-250 = "Когда люди переводятся в другую школу, обычно это потому, что они переехали в новый район..."
1008203-251 = "Им столько всего нужно узнать. Разобраться, что где находится, найти лучшие места для завтрака и книжные магазины, выучить автобусные маршруты..."
1008203-252 = "Для переведённого ученика всё вокруг новое и незнакомое."
1008203-253 = "[s] «Так разве он не обрадуется, если местный поможет ему со всем этим?»"
1008203-254 = "Если так подумать, то и правда логично!"
1008203-255 = "Прямо в точку, Сенсей!"
1008203-256 = "Как и ожидалось от моего наставника по юности!"
1008203-257 = ""
1008203-259 = ""
1008203-260 = "У тебя со временем всё нормально? Да? Хорошо! Тогда вперёд!"
1008203-261 = "Вот клетки для отбивания мячей, куда я люблю ходить! А потом можем заглянуть в игровой зал!"
1008203-262 = ""
1008203-264 = ""
1008203-265 = "А неподалёку есть ресторан, где сейчас подают эксклюзивное сезонное меню!"
1008203-267 = "Рэнгэ провела для меня экскурсию по окрестностям и, когда мы расставались, выглядела заметно веселее."
