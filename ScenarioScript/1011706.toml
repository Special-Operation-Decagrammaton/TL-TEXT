[translation]
1011706-1 = "Девушка в боли"
1011706-2 = ""
1011706-3 = "Дикая Хикари появляется!"
1011706-4 = "[s] «Привет, Хикари. Ты сегодня отлично выглядишь.»"
1011706-5 = "Отлично и готово!"
1011706-6 = "Готова играть, Сенсей."
1011706-7 = "...Но ты выглядишь занятым. Много работы?"
1011706-8 = "[s] «О-о-очень много работы.»"
1011706-9 = "Бу-у."
1011706-10 = "[s] «Ха! Шучу! Я сегодня закончил пораньше.»"
1011706-11 = "У-у!"
1011706-12 = "Хороший Сенсей. (гладь-гладь)"
1011706-13 = "Пойдём за вкусняшками. Хикари платит. Кошелёк сегодня толстый."
1011706-14 = "[s] «Мне как раз не помешает сменить обстановку.»"
1011706-16 = "И мы с Хикари отправились гулять."
1011706-18 = ""
1011706-19 = "О, сюда-сюда. Мороженое с данго."
1011706-20 = ""
1011706-22 = ""
1011706-23 = "Ого. Новая Шипучая конфета. Надо попробовать."
1011706-25 = "К тому времени, как мы вернулись с нашей охоты за вкусняшками, солнце уже почти село."
1011706-29 = "Уф. Слишком много сладкого."
1011706-30 = "До сих пор всё чувствую на вкус. И ой, животик болит..."
1011706-31 = "[s] «Да уж, мы там серьёзно разошлись...»"
1011706-32 = "А. Ой, нет."
1011706-33 = "[s] «Хикари? Что такое?»"
1011706-34 = "..."
1011706-35 = "Зуб болит... Бу-у..."
1011706-36 = "Критическое ранение... Боль... беспрецедентная..."
1011706-37 = "[s] «Т-Ты в порядке?»"
1011706-38 = "Сенсей, посмотри."
1011706-41 = "― [log=히카리]Вот, вот здесь... [/log][wa:1900]"
1011706-44 = "[ns] «Г-Где...? Сзади?»"
1011706-46 = "― [log=히카리]Ага... Внутри... [/log][wa:1900]"
1011706-47 = "― [log=히카리]Зубы... болят...[/log][wa:4090]"
1011706-50 = "― [log=히카리]Видишь, Сенсей?  [/log][wa:960]"
1011706-53 = "[ns] «Отсюда я ничего странного не вижу...»"
1011706-55 = "― [log=히카리]Справа... коренной...[/log][wa:3210]"
1011706-58 = "― [log=히카리]Ух, вот там... Бо-ольно... [/log][wa:2590]"
1011706-61 = "[ns1] «Эм, я тут кое-что вспомнил...»\n[ns2] «Если полезу тебе в рот, можно занести инфекцию!»"
1011706-64 = "― [log=히카리]Тогда... Хикари... умрёт?[/log][wa:4560]"
1011706-65 = "― [log=히카리]Спаси меня... Сенсей. [/log][wa:5380]"
1011706-70 = ""
1011706-71 = "[ns] «У тебя там совсем сахар в голову ударил.»"
1011706-72 = "Слабая... не смогла устоять..."
1011706-73 = "Заплатила... жизнью... Столько сожалений..."
1011706-74 = "[s] «Сегодня перед сном хорошо почисти зубы, а завтра сходим к стоматологу.»"
1011706-75 = "К стоматологу? О, ОЧЕНЬ опасно."
1011706-76 = "Хикари ненавидит стоматолога."
1011706-77 = "[s3] «Ты лучше будешь дальше терпеть боль?»\n[s4] «Я бы сходил и поскорее с этим покончил.»"
1011706-80 = "Бу-у..."
1011706-81 = "Бу-у-у..."
1011706-82 = "Хикари хочет жить..."
1011706-83 = "Жить долго и играть с тобой, Сенсей..."
1011706-84 = "Ладно, хорошо, стоматолог."
1011706-85 = "[s] «Хороший выбор, Хикари.»"
1011706-87 = "На следующий день я проводил Хикари к стоматологу, чтобы ей вылечили зуб."
1011706-88 = "Я крепко держал её за руку, пока ей приводили зубы в порядок."
