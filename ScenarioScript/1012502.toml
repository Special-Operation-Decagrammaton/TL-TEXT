[translation]
1012502-1 = "Волшебная живопись"
1012502-3 = ""
1012502-4 = ""
1012502-5 = "Добро пожаловать, господин!"
1012502-6 = "[s] «Привет, Эри!»"
1012502-7 = "Я размышляла, чем нам заняться, пока мы вместе отдыхаем."
1012502-8 = "И тогда гримуар подсказал мне..."
1012502-9 = "...что сегодня нам стоит порисовать вместе в ателье!"
1012502-10 = "[s1] «О-о, рисовать вместе с Эри.»\n[s2] «Звучит волшебно.»"
1012502-13 = "Уверена, вместе мы создадим невероятный шедевр."
1012502-14 = "А теперь — вперёд!"
1012502-15 = ""
1012502-17 = ""
1012502-18 = ""
1012502-19 = ""
1012502-24 = "Сегодня я даже не стану выбирать тему для картины."
1012502-25 = "Всё, что окажется на этом холсте, будет чистой эмоцией, необузданным творческим порывом. #nОн вырвется наружу словно магия!"
1012502-26 = "В такой день, когда я чувствую, как моя мана входит в резонанс...#nлучше всего позволить сердцу вести меня."
1012502-27 = "А теперь прошу сосредоточить внимание вот здесь!"
1012502-28 = ""
1012502-30 = ""
1012502-31 = "[ns] «...Карты Таро? Я думал, мы будем рисовать.»"
1012502-32 = "Так и есть! Именно так мы добавим сюда магию!"
1012502-33 = "Ню-ху-ху... Какой же Аркан сегодня откроет нашу судьбу...?"
1012502-34 = ""
1012502-36 = ""
1012502-37 = "М-м. Башня в прямом положении."
1012502-38 = "Эта карта означает бедствие и разрушение. А значит, остаётся только..."
1012502-39 = "Я возьму эту кисть и РЕЗКО проведу ею по холсту!"
1012502-40 = "Вот ТАК!!"
1012502-41 = ""
1012502-49 = "[ns] «Ого, ты и правда разошлась.»"
1012502-50 = "Ню-ху-ху. А теперь, чтобы нанести следующий мазок..."
1012502-51 = ""
1012502-53 = ""
1012502-54 = "Что же укажет нам путь...?"
1012502-55 = ""
1012502-57 = ""
1012502-58 = "Хм? Смерть в перевёрнутом положении?"
1012502-59 = "Застывшее состояние. Ничего не меняется..."
1012502-60 = ""
1012502-62 = ""
1012502-63 = "Ага! Тогда ещё один резкий мазок!"
1012502-64 = ""
1012502-72 = "[ns] «М-Можно так сильно бить по холсту?»"
1012502-73 = "Всё в порядке! Верь в силу магии!"
1012502-74 = "Даже если холст порвётся,#nэто лишь покажет, сколько силы я в него вложила!#nЭто искусство! Бояться нечего!"
1012502-75 = "Итак! Продолжим!"
1012502-77 = "Карты Таро продолжали подталкивать Эри к одному мощному мазку за другим."
1012502-78 = ""
1012502-86 = "Некоторое время спустя..."
1012502-88 = ""
1012502-89 = "О-о, посмотри сюда."
1012502-90 = ""
1012502-92 = ""
1012502-93 = "Очаровательно! Даже не верится, что я сама это нарисовала!"
1012502-94 = "[s] «Покажи, покажи!»"
1012502-95 = ""
1012502-97 = ""
1012502-98 = "Узри! Благодаря резонансу маны и присутствию моего Мастера я создала..."
1012502-99 = ""
1012502-101 = ""
1012502-103 = "...невероятную картину!"
1012502-104 = "Я назову её «Вечная буря»!"
1012502-105 = "Если я способна направить СТОЛЬКО силы, быть может, я даже овладею Десятым Кругом и смогу силой одной воли создавать целые миры!"
1012502-106 = "[s3] «...Я не знаю, что такое Десятый Круг, но картина потрясающая.»\n[s4] «Отличная работа. Она такая динамичная!»"
1012502-109 = "Ню-ху-ху, правда ведь?"
1012502-110 = "Как говорится, «искусство — это взрыв!»"
1012502-111 = "Я рада, что привела тебя сюда, Мастер.#nВ одиночку я бы не смогла закончить эту работу."
1012502-112 = "Если продолжу в таком темпе, следующий практический экзамен вообще не станет проблемой!"
1012502-113 = ""
1012502-115 = ""
1012502-116 = "...Ох. Похоже, я истощила свои запасы..."
1012502-117 = "Мастер! Пожалуйста, восполни мою ману!"
1012502-118 = "[s5] «В-Восполнить ману?»\n[s6] «Ты про перекус, да?»"
1012502-119 = ""
1012502-120 = ""
1012502-122 = "[ns] Достать печенье от Префектурного совета."
1012502-124 = "Ох, выглядит очень вкусно!"
1012502-125 = "Но... хм, руки у меня все в краске..."
1012502-126 = "Ню-ху-ху, значит, остаётся только одно. Тебе придётся покормить меня, Мастер."
1012502-127 = "[s] «П-Понятно.»"
1012502-128 = ""
1012502-130 = ""
1012502-131 = ""
1012502-132 = "Я рада, что мы понимаем друг друга."
1012502-133 = "Спасибо за угощение!"
1012502-134 = ""
1012502-136 = ""
1012502-137 = "Как хорошо, что ты рядом в такие моменты, Мастер."
1012502-138 = "[s] «Так это с самого начала был твой план?»"
1012502-139 = "Ню-ху-ху, разумеется, нет."
1012502-140 = "Считай это волей судьбы."
1012502-142 = "Я продолжил с удовольствием восполнять ману Эри."
