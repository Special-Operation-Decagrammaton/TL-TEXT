[translation]
32180-1 = "Episódio 18;Mesmo um Mundo Assim (2)"
32180-2 = "A Irmandade...!?"
32180-3 = "Tsc, Hanako Urawa...!"
32180-4 = "...Digamos que eu fiz uma pequena promessa."
32180-5 = "Uma promessa...?"
32180-6 = "Não é nada com que você precise se preocupar, Mika-san."
32180-11 = "Cof, que a paz e a serenidade estejam com todas vocês hoje também... cof."
32180-12 = "C-Com licença, desculpem a intromissão..."
32180-13 = "Embora vá contra as tradições que mantivemos até hoje... a Irmandade irá intervir neste conflito interno da Tea Party."
32180-14 = "Mika Misono-san, da Tea Party. Você está detida por incitação à agressão e tentativa de lesão corporal contra outros membros da Tea Party."
32180-17 = "Sakurako Utazumi, da Irmandade..."
32180-18 = "...Aha. Confesso que lutar contra a Irmandade é novidade pra mim. Entendi, então esse era o seu trunfo?"
32180-19 = "...Hanako Urawa, como você fez a Irmandade se mexer?"
32180-20 = "Eu sei que você se dava bem com as irmãs. Mas elas jamais agiriam sem ganhar nada em troca... Ei, o que você pagou a elas?"
32180-21 = "..."
32180-22 = "...Hum, que interessante. Bom, parece que o número de pessoas que eu preciso dar um jeito aumentou de uma vez só."
32180-23 = "...Finalmente a sua expressão mudou, não é, Mika-san?"
32180-24 = "...Será? Bom, eu já estava pensando em fazer uma limpa na Grande Catedral assim que me tornasse a Anfitriã mesmo. É, vou encarar isso como uma chance de resolver tudo de uma vez."
32180-29 = "...Muito bem, vamos nessa então?"
32180-33 = "...Você pretende mesmo lutar até o fim, Mika-san? Você não é do tipo que não percebe quais são as suas chances de vitória nesta situação, não é?"
32180-34 = "...É, pode até ser. Mas depois de chegar tão longe, não dá pra simplesmente dizer \"eu me rendo quietinha\", né?"
32180-36 = "...Agora, só me resta ir até o fim."
