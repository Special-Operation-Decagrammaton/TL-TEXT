[translation]
32180-1 = "Эпизод 18;Так устроен мир, часть 2"
32180-2 = "Сестринство...?"
32180-3 = "Урава Ханако!"
32180-4 = "Именно. В конце концов я решила принять одно предложение и заключила собственный договор."
32180-5 = "Договор?"
32180-6 = "Тебя это не касается. Кроме того..."
32180-7 = ""
32180-10 = ""
32180-11 = "*кашель* Да пребудут с вами сегодня мир и счастье."
32180-12 = "Прошу прощения за столь внезапное вторжение."
32180-13 = "Мы решили нарушить наши обычаи и вмешаться во внутренний конфликт Чаепития."
32180-14 = "Мисоно Мика из Чаепития. Вы арестованы за попытку причинения вреда другим членам Чаепития и подстрекательство к этому."
32180-16 = ""
32180-17 = "Вы, должно быть, Утадзуми Сакурако из Сестринства."
32180-18 = "Ха-ха-ха! Впервые сражаюсь с Сестринством! Значит, вот какой козырь ты прятала в рукаве?"
32180-19 = "Как тебе удалось втянуть их, Ханако?"
32180-20 = "Я знала, что когда-то ты была с ними знакома, как и практически со всеми. Интересно, что ты предложила взамен. Эти незваные гости пальцем не пошевелят, если им нечего получить."
32180-21 = "..."
32180-22 = "Как любопытно. Хотя меня раздражает, что вредителей для уничтожения стало больше."
32180-23 = "По-моему, ты начинаешь нервничать, Мика."
32180-24 = "Я всё равно собиралась зачистить собор, когда стану хозяйкой. Так даже время сэкономлю."
32180-25 = ""
32180-27 = ""
32180-29 = "Ну что, все готовы? Начнём?"
32180-30 = ""
32180-32 = ""
32180-33 = "Ты правда собираешься продолжать драться?! Это бессмысленно, Мика. Опусти оружие."
32180-34 = "Может, и так, но я не могу просто сдаться. Не после того, как зашла настолько далеко."
32180-36 = "Я не остановлюсь ни перед чем."
