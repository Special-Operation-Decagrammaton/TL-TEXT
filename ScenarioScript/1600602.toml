[translation]
1600602-1 = "Как девушка наслаждается летом"
1600602-2 = "После последнего сообщения Изуми я пришёл к переполненной пляжной закусочной."
1600602-3 = ""
1600602-4 = "Вот ты где, Сенсей."
1600602-5 = ""
1600602-6 = "Долго же ты!"
1600602-7 = "Пойдём скорее, призы скоро могут закончиться!"
1600602-8 = "[s1] «Прости, что так долго, Изуми.»\n[s2] «Народу здесь и правда много.»"
1600602-9 = "Ага! Наверняка все пришли поучаствовать в событии!"
1600602-10 = "Ага! Наверняка все пришли поучаствовать в событии!"
1600602-11 = "Вот, взгляни на листовку."
1600602-12 = ""
1600602-13 = "[s] «Игра „Схвати песок“?»"
1600602-14 = "Именно, Сенсей. Это соревнование!"
1600602-15 = "А если победишь, сможешь бесплатно съесть знаменитое локо-моко в стиле Шиба, которое продают в пляжной закусочной!"
1600602-16 = "Забавное название, правда? Интересно, какое оно на вкус! Наверняка такое же вкусное, как звучит. *облизывается*"
1600602-17 = "[s] «Кто-то явно в предвкушении.»"
1600602-18 = "Ага! Соус звучит потрясающе. Ну, это же локо-моко!"
1600602-19 = ""
1600602-21 = "[ns] «А?»"
1600602-22 = "И на этом игра окончена!"
1600602-23 = "О! Похоже, другой матч только что закончился."
1600602-25 = "Победитель этого раунда..."
1600602-26 = "...владелец магазина!"
1600602-27 = "*ухмылка*"
1600602-28 = ""
1600602-29 = "Я же говорил не жадничать и брать совсем немного песка!"
1600602-30 = "Теперь уже поздно..."
1600602-32 = "Не расстраивайтесь. Владелец уже 15 лет подряд выигрывает чемпионат Кивотоса по хватанию песка."
1600602-33 = "Можно сказать, результат был предрешён!"
1600602-34 = ""
1600602-35 = "Это что, мошенничество?!"
1600602-36 = "Не забывайте: проигравшим всё равно придётся принять последствия."
1600602-37 = "Один из фирменных деликатесов нашего заведения — острый пальмовый соус!"
1600602-38 = "До дна, дамы!"
1600602-39 = "Ладно. Выпью ваш дурацкий острый соус. Насколько плохо это вообще может быть?"
1600602-40 = ""
1600602-41 = ""
1600602-42 = ""
1600602-43 = ""
1600602-44 = ""
1600602-45 = "Угххх?!"
1600602-46 = "Угххх?!"
1600602-47 = ""
1600602-48 = ""
1600602-51 = "Смакуйте, новички. Вот он — горький вкус поражения."
1600602-52 = "А теперь следующий претендент! Проходите!"
1600602-53 = ""
1600602-55 = "Наша очередь, Сенсей. Пойдём!"
1600602-56 = "[s3] «Ты не говорила, что за проигрыш будет наказание.»\n[s4] «Про острый соус вообще никто не говорил.»"
1600602-57 = "Не переживай об этом. Просто победим и заберём приз!"
1600602-58 = "Не переживай об этом. Просто победим и заберём приз!"
1600602-60 = "Так вы наши следующие претенденты?"
1600602-61 = "Именно. Я пришла сюда ради летнего деликатеса!"
1600602-62 = "Значит, вы всё ещё хотите приз даже после того, что случилось с предыдущими участниками."
1600602-63 = "Что ж! Я принимаю ваш вызов."
1600602-64 = "Матч начинается прямо сейчас!"
1600602-65 = "Я начну."
1600602-66 = ""
1600602-67 = "*берёт песок*"
1600602-68 = "Какой смелый ход — сразу забрать четверть песка! Воистину ход чемпиона!"
1600602-69 = "Как ответят на это претенденты?!"
1600602-70 = "Удачи вам!"
1600602-71 = "Неужели они и правда смогут победить чемпиона?"
1600602-72 = "[s] «Была не была...»"
1600602-74 = "А, совсем маленькая горстка? Ничего безумного."
1600602-75 = "Куда делись твои амбиции? Я думал, ты хочешь победить меня и выиграть фирменное блюдо моего заведения."
1600602-76 = "[s5] «Эм, вообще-то это всё была идея Изуми.»\n[s6] «Это всего лишь игра, а не вопрос жизни и смерти.»"
1600602-77 = "Моя очередь!"
1600602-78 = "Моя очередь!"
1600602-79 = "Так, сколько мне взять?"
1600602-80 = "Много? Немного?"
1600602-81 = "Сложный выбор..."
1600602-82 = "Что же сделают претенденты?!"
1600602-83 = "Если они проиграют, им придётся выпить острый пальмовый соус!#nСамый печально известный деликатес нашего магазина!"
1600602-84 = "Если хотите избежать соуса из самого ада, придётся быть осторожными!"
1600602-85 = "Будьте осторожнее, новички."
1600602-87 = "Ях!"
1600602-88 = "Претендентка идёт на огромный риск!"
1600602-89 = "Она забирает больше половины песка!"
1600602-90 = "Это не сработает! Палочка не удержится!"
1600602-91 = "[s] «И-Изуми?!»"
1600602-92 = "Нет! Смотри! Палочка...!"
1600602-93 = "Она едва держится!"
1600602-95 = "Вот это мастерство! Как такое возможно?!"
1600602-96 = "Только не говори... Мой противник десятилетней давности, Золотой Скорпион..."
1600602-97 = "Это высшая техника Золотого Скорпиона! Ты только что повторила «Удар Вечного Снега»?!"
1600602-98 = "Вечного снега? Что это?"
1600602-99 = "Погоди, почему палочка не упала? Эх..."
1600602-100 = "[s] «Почему ты расстроилась, Изуми?»"
1600602-101 = "Ч-Что ты такое говоришь, Соусэй? Т-То есть Сенсей!"
1600602-102 = "[s] «Ты! Ты ведь специально пыталась проиграть, да?!»"
1600602-104 = "Нет! Совсем нет! Ничего подобного!"
1600602-105 = "Я-Я правда старалась изо всех сил."
1600602-106 = "Я просто хотела выиграть заветный деликатес..."
1600602-107 = "[s7] «Ты вроде хотела локо-моко, помнишь?»\n[s8] «Ты говоришь про острый пальмовый соус, да?!»"
1600602-108 = "О, эм, дело в том..."
1600602-109 = "О, эм, дело в том..."
1600602-110 = "..."
1600602-111 = "А что мне ещё оставалось? Я могу попробовать его только если проиграю!"
1600602-112 = "И я вообще не могу участвовать без напарника!"
1600602-113 = "[s] «Но всё равно...!»"
1600602-114 = "Хе-хе-хе. Ну всё, я завёлся."
1600602-115 = "А?"
1600602-116 = "Давненько у меня не было настолько хорошего матча."
1600602-117 = "Ладно! Я покажу всё, на что способен!"
1600602-118 = "[s] «Он теперь полностью вошёл во вкус!»"
1600602-119 = ""
1600602-120 = "Приготовиться!"
1600602-122 = "Какого...?!"
1600602-123 = "Я не понимаю, что происходит, но сдаваться сейчас нельзя!"
1600602-131 = "Я... проиграл."
1600602-132 = ""
1600602-133 = ""
1600602-135 = "Победителями игры «Схвати песок» становятся..."
1600602-136 = "...претенденты!"
1600602-137 = "Урааааа!"
1600602-138 = "[s] «М-Мы победили.»"
1600602-139 = ""
1600602-140 = "Но как?! Почему мы вообще должны были победить, Сенсей?!"
1600602-141 = "Теперь я не смогу попробовать острый пальмовый соус!"
1600602-142 = "В отзывах в интернете писали, что он полностью онемляет рот и отправляет тебя прямиком в глубины ада.#nКак такой острый соус вообще может разочаровать?"
1600602-143 = "Я так давно мечтала его попробовать!"
1600602-144 = "[s] «По-моему, это были не комплименты!»"
1600602-145 = "Не волнуйтесь. Ваша страсть пробудила мои амбиции и тронула моё сердце."
1600602-146 = "В знак уважения к юной леди я дам вам не только локо-моко, но ещё и..."
1600602-147 = "...острый пальмовый соус! Получите оба!"
1600602-148 = ""
1600602-149 = ""
1600602-150 = "Правда? Ты серьёзно?"
1600602-151 = "Ух ты! Получилось, Сенсей!"
1600602-152 = "[s] «Я представлял летнее гостеприимство совсем не так!»"
1600602-153 = ""
1600602-154 = ""
1600602-155 = ""
1600602-156 = ""
1600602-157 = ""
1600602-158 = "Давай попробуем вместе!"
1600602-159 = "Вот трубочка. Ты первый, Сенсей. Скажи «а-а-а»!"
1600602-160 = "Я хотел сопротивляться, но не смог отказать сияющей улыбке Изуми."
1600602-162 = "В итоге остаток дня я провёл в туалете."
