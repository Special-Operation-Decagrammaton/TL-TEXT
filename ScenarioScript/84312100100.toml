[translation]
84312100100-5 = "...Хорошая работа, Юризоно Сэя."
84312100100-6 = "Во многом благодаря тебе и Нэру Миллениум Expo завершился без катастрофы."
84312100100-7 = "А... Если подумать, сегодня последний день. Ночных проникновений больше не будет."
84312100100-8 = "Так и думала. Ну..."
84312100100-9 = "...немного грустно."
84312100100-10 = ""
84312100100-12 = ""
84312100100-13 = "А? Что ты такое говоришь? Тебе не надоело просыпаться посреди ночи и бежать работать? Я бы радовалась, что всё закончилось."
84312100100-14 = "В любом случае, ты сразу уезжаешь? Мы можем ещё долго не поговорить."
84312100100-15 = "Верно. Теперь, когда угрозы нет, мне тоже пора уходить."
84312100100-16 = "Прямо сейчас...? Но Экспо ещё не совсем закончилось."
84312100100-17 = "Можно считать, что закончилось. После последнего сегодняшнего события оно сразу закроется, и все студенты Тринити разъедутся по домам."
84312100100-18 = "Если бы кто-то что-то планировал, это случилось бы ещё вчера. Но мы подтвердили, что угроз больше не осталось. Ни в выставочном зале, ни где-либо ещё на территории школы."
84312100100-19 = "(И как вообще можно такое подтвердить?)"
84312100100-20 = "А важнее всего то, что вы двое..."
84312100100-21 = ""
84312100100-23 = ""
84312100100-24 = ""
84312100100-25 = "...вы обе очень много работали до этого момента. Поэтому от вашего имени я официально предсказываю, что в выставочном зале больше ничего не случится."
84312100100-27 = "Рио..."
84312100100-29 = "Никогда не думала, что услышу от тебя что-то настолько доброе. Малышка-то выросла..."
84312100100-30 = "...? О чём ты? Мы с тобой одного возраста, Нэру."
84312100100-31 = ""
84312100100-33 = ""
84312100100-34 = "...Не совсем выросла, похоже."
84312100100-35 = "Ладно, мне тоже пора. Скажу Сенсею, что всё закончилось хорошо."
84312100100-36 = "О, ты всё ещё держала Сенсея в курсе?"
84312100100-37 = "...? Конечно. Это проблема?"
84312100100-38 = "Нет-нет, никаких проблем."
84312100100-39 = "Хорошо, что ты вернулась присмотреть за школой, но Сенсей есть Сенсей. Когда студенты оказываются втянуты во что-то подобное, хорошо держать Сенсея на связи."
84312100100-40 = "Не то чтобы Сенсей когда-либо контролировал нас по мелочам или мешал."
84312100100-41 = "Чтобы показать это на примере: Сэя вообще может участвовать во всём этом только потому, что Сенсей закрывает глаза."
84312100100-43 = "Это правда. Тогда мне тоже стоит сообщить Сенсею последние новости."
84312100100-44 = "...Перед отъездом мне придётся поговорить с ним отдельно, обо всём понемногу."
84312100100-45 = "Собрать вещи займёт некоторое время. Уверена, ничего не случится... но если вдруг что-то произойдёт, сообщите мне."
84312100100-46 = "И это личная просьба, но можете не рассказывать Сенсею СЛИШКОМ много о моём участии..."
84312100100-47 = "Не переживай. Сенсей уже сказал, что поговорит с тобой как-нибудь отдельно."
84312100100-48 = "Меня больше беспокоит... Хм..."
84312100100-49 = "...? Ты всё ещё чем-то обеспокоена?"
84312100100-50 = ""
84312100100-53 = ""
84312100100-54 = "ЕСТЬ ещё что-то?"
84312100100-55 = "Ну, точно сказать не могу. Возможно, волнуюсь зря."
84312100100-56 = "...Мне пора пройтись по кампусу и попрощаться."
84312100100-57 = "Можешь... не уезжать, пока я не вернусь, Рио?"
84312100100-58 = ""
84312100100-60 = ""
84312100100-61 = "...? Хорошо..."
84312100100-62 = "Фуфу, тогда я пойду."
84312100100-63 = "Тебя проводить?"
84312100100-64 = "Нет, всё нормально. Как сказала Рио, всё подозрительное уже проверили..."
84312100100-65 = "Всё должно быть нормально. Наверное."
