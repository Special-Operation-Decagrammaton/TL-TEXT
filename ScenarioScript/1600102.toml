[translation]
1600102-1 = "В своём темпе"
1600102-2 = "*дзинь* *дзинь*"
1600102-3 = "Добро пожаловать. Позвольте проводить вас к столику, Господин..."
1600102-4 = "Хм?"
1600102-5 = "Господин! Я даже не сразу поняла, что это ты. Рада, что пришёл."
1600102-6 = "Ой, но сначала я всё равно должна проводить тебя к столику."
1600102-7 = "Господин...?"
1600102-8 = "Хм. «Господи-и-и-ин»..."
1600102-9 = "[s] «Что-то не так, Асуна?»"
1600102-10 = "Просто ты всегда был моим господином, но здесь я должна называть «Господином» каждого посетителя."
1600102-11 = "Может, для тебя придумать что-нибудь особенное?"
1600102-12 = "Например, «Господин, который и раньше был Господином» или «Господин среди Господ»? Или просто «Господин» нормально?"
1600102-13 = "Господин... Господин, который является Господином...?"
1600102-14 = "[s1] «Господин есть господин, который есть господин...?»\n[s2] «Кто я? Как я сюда попал?»"
1600102-15 = "Ха-ха! Ты такой милый, когда путаешься!"
1600102-16 = "Ха-ха! Ты такой милый, когда путаешься!"
1600102-17 = "Но я ведь права, это реально сбивает с толку!"
1600102-18 = "Неважно, ты это или обычный посетитель — господин остаётся господином. Поэтому здесь я не буду называть тебя как-то иначе."
1600102-19 = "Что? Ты думал, мы будем гулять,#nа я почему-то тут работаю?"
1600102-20 = "Я и пришла сюда, чтобы провести время с тобой, но раз я в форме горничной, все решили, что я здесь работаю."
1600102-21 = "Это же мейд-кафе, так что я решила подыграть."
1600102-22 = "А? Сколько мне платят?"
1600102-23 = "Кто вообще говорил про оплату? Я просто развлекаюсь!"
1600102-24 = "Ха-ха! Опять это странное лицо! Ахахаха!"
1600102-25 = "*пых* *пых* Правда, Господин, с тобой так весело."
1600102-26 = "А?"
1600102-27 = "Почему я пригласила тебя именно в это кафе?"
1600102-28 = "...Ой, точно! Это же я предложила сюда прийти."
1600102-29 = "Что, думаешь, я забыла? Ну уж нет. И вообще, не цепляйся к мелочам."
1600102-30 = "Так вот, причина, почему я тебя сюда позвала..."
1600102-31 = "О! Вспомнила."
1600102-32 = "Сегодня у меня секретная миссия. Нужно проследить за одним человеком и арестовать его."
1600102-33 = "Вот поэтому я и спросила, не хочешь ли ты посидеть со мной в этом кафе. Хе-хе."
1600102-34 = "Это вообще не ответило на твой вопрос? И ты всё ещё не понимаешь, о чём я?"
1600102-35 = "Зачем идти в кафе, если я на секретной миссии?"
1600102-36 = "Хм. Хороший вопрос."
1600102-37 = "Кто знает?"
1600102-38 = "Просто мне кажется, если я буду здесь с моим Господином, всё как-нибудь само получится."
1600102-39 = "Ага, вот такое у меня чувство! Назовём это интуицией!"
1600102-40 = "А? Думаешь, мне лучше выйти и заняться настоящей разведкой?"
1600102-41 = "Поверь мне. Пока я с тобой, всё обязательно получится."
1600102-42 = "Ты ведь сейчас не занят, Господин? Может, стоило позвать тебя позже?"
1600102-43 = "Точно не проблема? Отлично. Мне повезло! ☆"
1600102-44 = "Давно я не ходила ни на что похожее на свидание. Может, хватит изображать подработчицу."
1600102-45 = ""
1600102-46 = ""
1600102-47 = "Вот. Ты не против, если я сяду напротив?"
1600102-48 = "Эй, госпожа горничная! Мы готовы сделать заказ!"
1600102-49 = "[s3] «Из горничной в госпожу — вот так сразу...»\n[s4] «Неужели так легко уволиться с работы, которую выполняла добровольно?»"
1600102-50 = "Я же сказала — не заморачивайся! Здесь отличный набор «Цифровой декадентский десерт»..."
1600102-51 = "Я же сказала — не заморачивайся! Здесь отличный набор «Цифровой декадентский десерт»..."
1600102-52 = "*дзинь* *дзинь*"
1600102-53 = "Да! Добро пожаловать, Господин!"
1600102-54 = "..."
1600102-55 = "Хорошо. Похоже, я от них оторвалась. Здесь можно немного пересидеть."
1600102-56 = "Они вообще не знают, когда сдаваться."
1600102-57 = "Теперь найти бы свободный столик."
1600102-58 = "Вот. Погоди, почему горничная сидит?"
1600102-59 = ""
1600102-60 = "Эй, ты. Разве ты не должна принимать заказы?"
1600102-61 = "Кто? Я?"
1600102-62 = "Почему горничная сидит и листает меню? Ты вообще нормальная?!"
1600102-63 = "Это у вас тут такой сервис?"
1600102-64 = "...?"
1600102-65 = "...?"
1600102-66 = "[s] «Что-то не так, Асуна?»"
1600102-67 = "...!"
1600102-68 = "Цель обнаружена!"
1600102-69 = "Ура! Похоже, я тебя поймала!"
1600102-70 = "К-Как ты догадалась устроить здесь засаду?! Невозможно!"
1600102-71 = "Погодите...!"
1600102-75 = "*грохот*"
1600102-77 = "(В конце концов Асуна поймала цель, и её секретная миссия завершилась успехом.)"
1600102-78 = "(Но когда я спросил Асуну, предсказала ли она маршрут цели...)"
1600102-79 = "..."
1600102-80 = ""
1600102-81 = "Не-а!"
1600102-82 = ""
1600102-83 = "(...)"
1600102-84 = "(После... этого остаток визита я ел десерты вместе с Асуной.)"
