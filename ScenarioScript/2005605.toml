[translation]
2005605-1 = "Битва в чайном домике"
2005605-3 = "...Раннее утро."
2005605-4 = "Мне нужно было встретиться с Коюки в игровом центре, поэтому я ненадолго отложил работу и отправился туда."
2005605-5 = ""
2005605-9 = "Сенсей! Сенсей! Тут пока совсем пусто! Нужно занять место ПРЯМО СЕЙЧАС!"
2005605-10 = "...Вот что я бы сказала, если бы была простушкой! Но я уже заняла нам места! Давайте, садитесь, садитесь."
2005605-11 = ""
2005605-14 = "[ns1] «Эм... Почему ты опять в пижаме...?»\n[ns2] «Кто вообще приходит в игровой центр в пижаме...?»"
2005605-17 = "...? А?"
2005605-18 = "О! Я буквально ПРИБЕЖАЛА сюда сразу после того, как проснулась, ну конечно!"
2005605-19 = "У меня не было времени на всякие мелочи вроде переодевания! Я серьёзно! Совсем скоро здесь будет не протолкнуться!"
2005605-20 = "Сегодня утром уже трижды объявляли, что пришлось разворачивать людей, которые всю ночь стояли в очереди. Вот насколько эта игра популярна!"
2005605-21 = "Так что садитесь уже! Пожалуйста? Сколько раз мне повторять, чтобы вы не цеплялись к мелочам?"
2005605-22 = "...? А?"
2005605-23 = "Занимать места ничем не лучше, чем не спать всю ночь...? ...Правда?"
2005605-24 = ""
2005605-26 = ""
2005605-28 = "НЕТ! По-моему, куда хуже вообще не получить возможность в это сыграть!"
2005605-29 = "[ns] Не отступать и строго её отругать."
2005605-30 = "Л-Ладно! Поняла, поняла! Обещаю, больше так не буду!"
2005605-31 = "Но здесь же пока никого нет! Так что один раз можно закрыть глаза, ну пожа-а-алуйста?"
2005605-32 = "[s] «Только в этот раз, хорошо?»"
2005605-33 = "Нихаха! Вот это мой Сенсей!"
2005605-34 = "Ладненько, мы уже и так потратили слишком много времени! Успели посмотреть все гайды по стратегии, которые я вам отправила?"
2005605-35 = "А?! Большую часть уже запомнили? Вот это мой Сенсей, умноженный на два! С силой дружбы..."
2005605-36 = "Мы первыми пройдём все 12 этажей! Вот наша конечная цель!"
2005605-37 = "Теперь..."
2005605-38 = "...Поехали!!"
2005605-40 = "Так мы с Коюки собрались с духом и начали играть в только что вышедшую «Битву в чайном домике»."
2005605-41 = "Два часа мы пробивались через игру кровью, потом и слезами, бросая монету за монетой в отчаянной попытке её одолеть."
2005605-45 = ""
2005605-46 = "Нам удалось... лишь однажды добраться до пятого этажа. Двенадцатый казался невозможной и далёкой мечтой, но мы продолжали эту бессмысленную погоню."
2005605-49 = "― [log=코유키 파자마]А-а-а! Ну зачем вы использовали это сейчас?! [/log][wa:1740]"
2005605-51 = "― [log=코유키 파자마]Я же сказала делать это ПОСЛЕ меня![/log][wa:780]"
2005605-54 = "[ns3] «Да ни за что! Твой план вообще не сработает!»\n[ns4] «Нужно ДО! Я уже всё тебе объяснил!»"
2005605-57 = "― [log=코유키 파자마]Вы что, пытаетесь разрушить мой безупречный план?![/log][wa:1770]"
2005605-59 = "― [log=코유키 파자마]Я ведь даже встала пораньше и заняла место специально для вас, Сенсей!![/log][wa:440]"
2005605-62 = "― [log=코유키 파자마]...А? Это вообще совсем другой вопрос?[/log][wa:2060]"
2005605-64 = "― [log=코유키 파자마]Если я правда хочу туда добраться... Сенсей потратил больше монет...?[/log][wa:940]"
2005605-67 = "― [log=코유키 파자마]Хм-м... Ну, это и правда так, но... [/log][wa:2600]"
2005605-69 = "― [log=코유키 파자마]Ладненько, будем считать, что мы квиты! Временное перемирие![/log][wa:1290]"
2005605-72 = "[ns5] «Главное — пройти эту игру!»\n[ns6] «У нас одна цель! Мы союзники!!»"
2005605-75 = "― [log=코유키 파자마]Точно! Вот следующая попытка точно будет той самой! Я прям чувствую!! [/log][wa:1300]"
2005605-77 = "― [log=코유키 파자마]...Нихаха![/log]"
2005605-80 = "― [log=코유키 파자마]...Нихахаха...[/log][wa:800]"
2005605-83 = "Мы с Коюки объединились в последний раз и опустили нашу последнюю монету."
2005605-84 = "Мы действовали в идеальном тандеме, пролетая уровни один за другим и устанавливая рекорд!!"
2005605-85 = ""
2005605-88 = "Пока не добрались до 7-го этажа... где нам пришлось признать поражение."
2005605-91 = "Уф... У-у-уф..."
2005605-92 = "Как такое возможно? Не-е-ет... Ниха... ха..."
2005605-93 = "Эта игра — мусор... Какая инди-студия вообще сделала это барахло...? Уф..."
2005605-94 = ""
2005605-96 = ""
2005605-97 = "Но всё равно, хорошая работа, Сенсей. Пусть мы дошли только до 7-го этажа, мне было очень весело."
2005605-98 = "Когда-нибудь у нас ещё будет шанс..."
2005605-99 = ""
2005605-102 = "...А?"
2005605-103 = "Сенсей? Зачем вы только что достали кошелёк?"
2005605-104 = "Эй, что вы делаете...? Это..."
2005605-105 = "Э-Эта карта...!! Не может быть...!!"
2005605-106 = "[ns7] «...Мы победим.»\n[ns8] «Я покупаю консольную версию, и мы победим.»"
2005605-109 = "..."
2005605-110 = "...!!"
2005605-111 = "В-Вы покупаете консольную версию?! Т-Так можно было всё это время?!"
2005605-112 = "Она же безумно дорогая!! Я... Понятно. Вот она, сила взрослого человека."
2005605-113 = ""
2005605-115 = ""
2005605-116 = "Я буду следовать за вами всю жизнь, Сенсей! Сегодня мы дойдём до самого конца!!"
2005605-117 = "В магазин игр!!"
2005605-119 = "Мы отправились в магазин игр и купили расширенное издание «Битвы в чайном домике»."
2005605-120 = "Мы с Коюки просидели 11 часов подряд в комнате отдыха Шале, играя без остановки."
2005605-123 = ""
2005605-124 = "И наконец-то победили."
