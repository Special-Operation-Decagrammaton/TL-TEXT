[translation]
10048030-1 = "Эпизод 3;Любовь пурпурного и синего света"
10048030-2 = "Днём ранее..."
10048030-3 = ""
10048030-4 = "Кафе за пределами Вайлдханта"
10048030-5 = ""
10048030-6 = ""
10048030-7 = "Эм, я слышала, вы... менеджер по продажам Картеля свободной торговли?"
10048030-8 = ""
10048030-10 = ""
10048030-11 = "Ха. Всё верно."
10048030-12 = "Давай присядем."
10048030-13 = "А, хорошо."
10048030-14 = "Так... Это правда, что вы можете достать что угодно?"
10048030-15 = "Назови что угодно. В конце концов, слово «торговля» есть у нас в названии."
10048030-16 = "И скажем так... моя репутация безупречна."
10048030-17 = "О-о...!"
10048030-18 = "В любом случае, ты меня заинтересовала. Обычно я не работаю с клиентами за пределами Вайлдханта."
10048030-19 = "Так что к делу. Чего ты хочешь и зачем тебе нужна я?"
10048030-20 = "Эм, назвать это... торговлей будет небольшой натяжкой. Сейчас объясню."
10048030-21 = ""
10048030-23 = ""
10048030-24 = "...Я хочу тайком вывезти картину из Вайлдханта."
10048030-26 = "..."
10048030-27 = ""
10048030-29 = ""
10048030-30 = "...Сделаю вид, что ничего не слышала. Всего доброго."
10048030-31 = "Эм, подождите, пожалуйста, выслушайте...!"
10048030-32 = "«Выслушать» что именно? Как ты хочешь украсть что-то из нашей школы?"
10048030-33 = "Найди Клуб воров или бандитов, или как там их! МЫ — Картель свободной торговли."
10048030-34 = "У вас есть такие клубы?"
10048030-35 = "А ты как думаешь?!"
10048030-36 = "Пожалуйста, ещё минутку...! Всё не так, как звучит."
10048030-37 = ""
10048030-39 = ""
10048030-41 = ""
10048030-42 = ""
10048030-43 = "...Ладно. Тогда в чём дело?"
10048030-45 = "...Я художница."
10048030-46 = "Сейчас у меня всё хорошо, я даже зарабатываю этим на жизнь..."
10048030-47 = "...Но в молодости мне приходилось тяжело."
10048030-48 = "Я делала многое, лишь бы выжить, понимаете!"
10048030-49 = "И одной из таких вещей была..."
10048030-50 = ""
10048030-51 = "...подделка картин."
10048030-52 = "Подделка... картин?"
10048030-53 = "Да. Я копировала известные картины до мельчайших деталей и продавала их как настоящие."
10048030-54 = "Я не стыжусь большей части того, что делала ради выживания."
10048030-55 = "...Но подделка картин... Этот стыд до сих пор лежит на моём сердце."
10048030-56 = "Я хочу лишь искупить вину и исправить содеянное."
10048030-57 = "Ладно... Но какое это имеет отношение к вашей просьбе?"
10048030-58 = "Скоро в Вайлдханте пройдёт специальная выставка Вероники."
10048030-59 = "Там будут выставлены некоторые мои работы — мои ПОДДЕЛКИ."
10048030-60 = "...!"
10048030-61 = "То есть Фонд Вероники купил ваши поддельные картины и теперь с гордостью их выставляет?"
10048030-62 = "...Да. Разумеется, Фонд считает мои работы подлинными."
10048030-63 = "М-м. И о какой картине речь?"
10048030-64 = "Да. Это..."
10048030-67 = "[log=시민 동물6 의뢰인]«Любовь пурпурного и синего света.»[/log]"
10048030-70 = "Вы подделали ЭТУ картину?!"
10048030-71 = "О, вы её знаете?"
10048030-72 = "Большинство людей не узнали бы её, даже если бы я показала им фотографию!"
10048030-73 = "Я учусь в Вайлдханте. Конечно, знаю."
10048030-74 = "Это одна из основополагающих работ. На истории искусств мы разбирали её целую неделю..."
10048030-75 = "...Фуфу. Какое облегчение наконец поговорить с культурным человеком."
10048030-76 = "Вы бы удивились, насколько мало широкая публика знает даже самые основы..."
10048030-77 = "...В любом случае, я подделала «Любовь пурпурного и синего света». Скоро эта копия окажется у вас под носом на специальной выставке Вероники."
10048030-78 = "Значит... вы хотите, чтобы мы тайком вынесли вашу поддельную картину?"
10048030-79 = "Именно."
10048030-80 = "Это... мягко говоря, амбициозно."
10048030-81 = "Даже если мы заберём картину, школа, не говоря уже о властях, поднимет тревогу."
10048030-82 = "Подделка это или нет, ограбление будет НАСТОЯЩИМ."
10048030-83 = "Если вы так уверены, почему бы не обратиться в фонд и не рассказать им правду?"
10048030-84 = "Смотрите. Настоящая картина у меня уже готова для вас."
10048030-85 = ""
10048030-87 = ""
10048030-88 = "...А?"
10048030-89 = "Недавно я выиграла подлинную «Любовь пурпурного и синего света» на подпольном аукционе."
10048030-90 = "Вот, она прямо здесь."
10048030-91 = ""
10048030-93 = ""
10048030-94 = "...!"
10048030-95 = "Всё, о чём я прошу, — тайком вынести подделку и заменить её настоящей картиной."
10048030-96 = "Никаких неприятностей ведь не будет, понимаете?"
10048030-97 = "Послушайте, если всё так, вам ТЕМ БОЛЕЕ стоит просто рассказать фонду. Они смогут проверить и —"
10048030-98 = "Я не могу позволить людям узнать, что я... что я была фальсификатором! Я слишком долго зарабатывала себе имя."
10048030-99 = "...Я лишь хочу всё исправить."
10048030-100 = "И пусть безвкусная публика никогда не узнает, что я сделала..."
10048030-101 = "...так я хотя бы смогу исправить свою ошибку."
10048030-102 = "Это... возможно?"
10048030-103 = ""
10048030-105 = ""
10048030-106 = "...Давайте честно. Вы наверняка понимаете, что меня беспокоит."
10048030-107 = "Что, если картина на выставке НАСТОЯЩАЯ, а вы просто пытаетесь её украсть?"
10048030-108 = "Вы мне не верите?"
10048030-109 = "А вы дали мне повод?"
10048030-110 = "Я не занимаюсь подделками, и Картель никто не водит за нос."
10048030-111 = "Да, это не моя специальность. Не уверена, что смогу отличить одну от другой."
10048030-112 = "Но всё же я ХУДОЖНИЦА. И мысль о том, чтобы украсть чью-то настоящую работу... мне не нравится."
10048030-113 = "Тогда как насчёт этого?"
10048030-114 = "Ваш Картель может сделать с вынесенной картиной всё, что захочет."
10048030-115 = "Повесьте её, сожгите, выбросьте — лишь бы она больше не появилась перед публикой, и я буду довольна."
10048030-116 = "Что, простите?!"
10048030-117 = "Подумайте сами. Что я с этого получу? Мне не нужно возвращать её."
10048030-118 = "Я прошу об этом, потому что знаю: у Вероники находится подделка."
10048030-119 = "Ну так что скажете? Теперь вы мне верите?"
10048030-120 = "..."
10048030-122 = "[log]Возвращаемся в настоящее.[/log]"
10048030-124 = ""
10048030-125 = "[ns] «Значит, вот какой у вас заказ...»"
10048030-126 = "И что ты ответила?"
10048030-128 = "Ха."
10048030-129 = ""
10048030-131 = ""
10048030-133 = ""
10048030-134 = "Погодите, это же..."
10048030-135 = "«Любовь пурпурного и синего света»...?! Правда?!"
10048030-136 = "Ого..."
10048030-137 = "Красиво."
10048030-138 = "Это... великолепно. Здесь, снаружи, под солнцем, а не в стенах галереи..."
10048030-139 = "Это настоящая?"
10048030-140 = "Якобы."
10048030-141 = "...Погоди."
10048030-142 = "Только не говори, что ты согласилась на заказ..."
10048030-143 = "...Я его не получала."
10048030-144 = "Хм?"
10048030-145 = "Пусть я и менеджер по продажам, это выше моего уровня полномочий."
10048030-146 = "Я сказала потенциальной клиентке, что сначала должна поговорить с президентом."
10048030-147 = "Тогда почему у тебя..."
10048030-148 = "...Она, можно сказать, буквально сунула её мне."
10048030-149 = "Но у меня есть её контакты. Если откажешься, я верну картину. Никакого давления..."
10048030-150 = "..."
10048030-151 = "Но... подумай, Миё."
10048030-152 = "Тайком вынести картину с выставки и правда звучит... тревожно, согласна."
10048030-153 = "Но мы заменим подделку настоящей. Разве это не своего рода МОРАЛЬНО правильный поступок?"
10048030-154 = "И ещё, взгляни на этот калькулятор."
10048030-155 = "Вот какую сумму мне удалось выбить за контракт."
10048030-156 = ""
10048030-158 = ""
10048030-159 = "...А!"
10048030-160 = "Ну как? Впечатляет, правда?"
10048030-162 = "Э-э-э...!"
10048030-163 = "На эти деньги я смогу купить ремесленный мрамор Каракара!"
10048030-164 = "[s] «Впечатляющая сумма...!»"
10048030-165 = "Узрите непревзойдённую силу переговоров менеджера по продажам Картеля свободной торговли...!"
10048030-166 = "Но Фую, ты ведь понимаешь, да?"
10048030-167 = "Хм? Понимаю что?"
10048030-168 = "Что Сенсей... всё ещё здесь..."
10048030-169 = ""
10048030-171 = ""
10048030-172 = "Почему вы всё ещё здесь?!"
10048030-173 = "[s] «Я никуда и не уходил...!»"
10048030-174 = "Эм, ну, эм..."
10048030-175 = "Погодите! Все успокойтесь. Паниковать незачем."
10048030-176 = "В конце концов, Сенсей, вы слышали всю историю! Это же... морально правильно, разве нет?"
10048030-177 = "Но ведь они слышали, как мы обсуждали КРАЖУ чего-то за ДЕНЬГИ."
10048030-178 = "Да они ни за что не позволят нам продо—"
10048030-179 = "[s] «Вообще-то, я не против.»"
10048030-180 = "Что?!"
10048030-181 = "[s1] «Вы пытаетесь поступить правильно. »\n[s2] «Я доверяю вашему решению.»"
10048030-182 = ""
10048030-183 = ""
10048030-186 = "[ns] «Конечно, я буду...'наблюдать' со стороны.»"
10048030-187 = "С-Сенсей..."
10048030-188 = "Если даже вы так говорите..."
10048030-189 = "Угх..."
10048030-190 = ""
10048030-192 = ""
10048030-193 = "Подумай, Миё!"
10048030-194 = "Клац-клац, дзынь! Cutey Berry 87 зовёт тебя!"
10048030-195 = "Заткнись!"
10048030-196 = ""
10048030-198 = ""
10048030-199 = "(...Ладно, только в этот раз. Ещё одна работа — и всё.)"
10048030-200 = ""
10048030-202 = ""
10048030-203 = "Хорошо."
10048030-204 = "...Мы принимаем заказ."
10048030-205 = ""
10048030-207 = ""
10048030-208 = "...Я составлю план."
