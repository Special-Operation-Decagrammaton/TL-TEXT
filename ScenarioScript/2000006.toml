[translation]
2000006-1 = "Мечтая о дне с тобой"
2000006-2 = "Инженерный отдел Миллениума"
2000006-3 = "Сон жизненно важен для здоровья."
2000006-4 = "Я всегда могла уснуть где угодно, если было куда лечь."
2000006-5 = "Даже представить не могу, насколько ужасна бессонница..."
2000006-6 = "...но знаю, что многие от неё страдают."
2000006-7 = "А? Думаешь, у меня появились мешки под глазами?"
2000006-8 = "Наверное, в последнее время я слишком часто работала всю ночь..."
2000006-9 = "..."
2000006-10 = "Ну хватит, не смотри на меня так."
2000006-11 = "В общем! Для людей с бессонницей ночь бывает очень тяжёлой."
2000006-12 = "Поэтому я разработала два новых устройства."
2000006-13 = "Первое я называю..."
2000006-14 = "...«Машина обморока»."
2000006-15 = "[s1] «У этого названия устрашающая аура.»\n[s2] «Это должна быть подушка?»"
2000006-16 = "Наоборот."
2000006-17 = "Скорее кровать."
2000006-18 = "Конечно, всегда бывают исключения..."
2000006-19 = "...но большинство людей проводит во сне треть жизни."
2000006-20 = "Другими словами, треть жизни ты лежишь в кровати."
2000006-21 = "Вот. Попробуй лечь на это устройство в форме подушки."
2000006-22 = "Что, тебя всё ещё беспокоит слово «обморок»?"
2000006-23 = "Ну... я ведь не эксперт по эргономике..."
2000006-24 = "Я только знаю, что люди часто говорят, будто после обморока просыпаются хорошо отдохнувшими."
2000006-25 = "Думаешь, сам обморок изначально вреден для здоровья?"
2000006-26 = "Хм... Хорошее замечание."
2000006-27 = "Справедливости ради, это пока только прототип."
2000006-28 = "У меня есть ещё кое-что, что может тебя заинтересовать."
2000006-29 = "Я называю это..."
2000006-30 = "...«Труба нокаута»."
2000006-31 = ""
2000006-32 = ""
2000006-33 = ""
2000006-34 = ""
2000006-35 = "Почему ты отступаешь?"
2000006-36 = "Сначала дослушай."
2000006-37 = "Метод, возможно, немного грубый... но эффективность «Трубы нокаута» научно доказана!"
2000006-38 = "[s] «Не уверен, что после этого вообще проснусь.»"
2000006-39 = "Ты слишком переживаешь. Она должна бить только по затылочной области."
2000006-40 = "Она тебя НЕ убьёт."
2000006-41 = "И это ещё не всё. Эта красавица..."
2000006-42 = "...оснащена моей любимой функцией."
2000006-43 = "[s3] «Самоуничтожение...?»\n[s4] «Аннигиляция...?»"
2000006-44 = "Блютуз."
2000006-45 = "Блютуз."
2000006-46 = "В неё заранее загружено 10 разных лекций по физике, от которых ты моментально уснёшь."
2000006-47 = "А ещё больше 200 усыпляющих песен — на любой музыкальный вкус."
2000006-48 = "[s5] «Теперь я за!»\n[s6] «Это действительно поможет?»"
2000006-49 = "Серьёзно?"
2000006-50 = "Серьёзно?"
2000006-51 = "Хорошо, Сенсей. Я подготовила для тебя эту кровать."
2000006-52 = "Ложись."
2000006-54 = "Отлично. Теперь включим музыку."
2000006-55 = "«Труба нокаута» теперь... полностью готова!"
2000006-60 = ""
2000006-61 = "..."
2000006-62 = "Хе-хе... Ты, должно быть, очень устал, Сенсей."
2000006-63 = "Ты отключился сразу, как заиграла музыка."
2000006-64 = "Благодаря тебе можно считать эксперимент успешным."
2000006-65 = "И ещё..."
2000006-66 = "...Хи-хи."
2000006-67 = "Ты такой милый, когда спишь."
