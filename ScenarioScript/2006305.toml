[translation]
2006305-1 = "Her Mission"
2006305-3 = "...We're here."
2006305-4 = "Sensei, keep this in mind."
2006305-5 = "A careless remark can lead to the failure of the entire operation."
2006305-6 = "[s] \"G-Got it...\""
2006305-8 = "The memo I received says:"
2006305-9 = "\"Please do as we did last time.\""
2006305-10 = "I'll try handling this myself first."
2006305-11 = "...Good. Target point reached. Confirming we have arrived at Delta Tango. #nI'm opening the hatch. Keep an eye on the surroundings for me."
2006305-15 = "Target point, Mochi Burger Gehenna, Delta Tango. No hostiles visible nearby."
2006305-16 = "We will now be extracting burgers via the drive-through. Commence operation."
2006305-17 = "[s] \"Wait, Delta Tango was referring to a drive-through!?\""
2006305-18 = "Yes. Everyone else is busy registering for the tournament, so they asked me to buy#nlunch via the Delta Tango."
2006305-19 = "I've come here with Hifumi before, but I don't remember the exact procedure."
2006305-20 = "First, we'll have to bring the tank closer to the checkpoint."
2006305-21 = "...Phew. #nI'm feeling nervous... but here goes nothing."
2006305-22 = "[s] \"This isn't a checkpoint, but that's fine for now!\""
2006305-32 = "...Strange. A guard's usually supposed to show up."
2006305-33 = "Their security is too lax. Where are the people? All they've left here is an interco-"
2006305-37 = "Hello! Welcome to Mochi Burger Gehenna's drive-through! May I take your order?"
2006305-38 = "Wha-!?"
2006305-39 = "An ambush!? Prepare the main cannon!"
2006305-40 = "[s] \"Wait wait wait! You're supposed to order through this!\""
2006305-43 = "Dear customer, have you decided on your order?"
2006305-47 = "Order... right, the order. I need to make it easy to understand."
2006305-48 = "It has to be brief and unmistakable—in a way that conveys our intentions without confusing the operator... I got it."
2006305-52 = "...I'm ready. Please send."
2006305-53 = "Send...? I'm ready to take your order!"
2006305-54 = "Signal here is weak, readibility 3. Deemed acceptable."
2006305-58 = "Therefore, I will continue using a 9-line brief."
2006305-59 = "Sensei, the signal may be weak, but I'll use my judgement to fill in the gaps."
2006305-60 = "Line 1, location. Current location. Mochi Burger Gehenna, Delta Tango."
2006305-61 = "Line 2: radio frequency and callsign. Maintain current channel. #nCallsign, Crusader-chan."
2006305-62 = "Line 3: low precedence. However, there are many vehicles behind us, so please#nprocess quickly. #nLine 4: no special equipment."
2006305-63 = "Line 5. Five Mochi Burger sets. Two salad bowls. #nAll drinks, cola."
2006305-64 = "U-Umm..."
2006305-65 = "Please refrain from interrupting. I will now resume the briefing due to time#nconstraints. Next, line 6—"
2006305-71 = "—That is all. Do not read back. Please prepare everything immediately.#nCrusader-chan, over."
2006305-72 = "I need to read back your order just to be safe, according to the rules, so... #nThat's five Mochi Burger sets, two salad bowls, and cola for all of the drinks. #nPlease move forward..."
2006305-73 = "*Sigh*... Why are all the customers in Gehenna so weird..."
2006305-78 = "Welcome..."
2006305-79 = "I see."
2006305-80 = "There's a window and a guard. Looks like this was a checkpoint after all."
2006305-81 = "A checkpoint...?"
2006305-82 = "Cutting the engine. DRL has been turned off."
2006305-83 = "Here is my ID. There are firearms in the vehicle; you can check if needed."
2006305-84 = "No, um... This isn't a checkpoint... You can just take your food and be on your#nway..."
2006305-85 = "Hm?"
2006305-91 = "Good. That's resupply complete, all according to plan."
2006305-92 = "How was that, Sensei? I think it wasn't bad for my first time."
2006305-96 = "[ns] \"You did great!\""
2006305-97 = "Sensei. #nThanks for helping me learn what it means to be normal."
2006305-98 = "I think I'll be able to do it by myself next time."
2006305-99 = "But... let's still go together next time. I think it'll be more fun that way."
2006305-101 = "(On the way back, Azusa hummed a small tune as she drove.)"
2006305-102 = "(Having accomplished her mission, Azusa seemed to be proud of herself.)"