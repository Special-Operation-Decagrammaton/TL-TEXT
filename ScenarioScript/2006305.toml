[translation]
2006305-1 = "A Girl's Errand"
2006305-3 = "……This is it."
2006305-4 = "Sensei, remember this."
2006305-5 = "Careless statements lead to mission failure."
2006305-6 = "[s] \"Y-You got it…….\""
2006305-8 = "It's what's written on the note I was given."
2006305-9 = "\"Please do it just like last time,\" it says."
2006305-10 = "So, I'll take it on by myself first."
2006305-11 = "……Alright. Target location, Delta Tango, confirmed. #nI'm opening the hatch, so Sensei, please keep watch on the surroundings."
2006305-15 = "Target location: \"Mochi Burger Gehena DT Branch\". No threats in the vicinity."
2006305-16 = "From here on, we begin the hamburger retrieval operation via Drive-Through."
2006305-17 = "[s] \"Delta Tango was a drive-through!?\""
2006305-18 = "Yeah. Everyone's busy registering for the tournament, so they asked me to go buy lunch at the DT."
2006305-19 = "I've been here before with Hifumi, but I can't quite remember the specific steps."
2006305-20 = "First, we need to approach the checkpoint with the tank and……."
2006305-21 = "……Phew. #nI'm nervous, but…… let's go."
2006305-22 = "[s] \"It's not a checkpoint, but whatever, close enough!\""
2006305-32 = "……Strange. Shouldn't there normally be a sentry coming out?"
2006305-33 = "Security is lax. Everyone's gone somewhere, leaving just the intercom——"
2006305-37 = "Hello! Welcome to Mochi Burger Gehena DT Branch! May I take your order?"
2006305-38 = "Wh—!?"
2006305-39 = "An ambush!? Main gun, prepare to fire!"
2006305-40 = "[s] \"Wait, wait! This is how you place an order!\""
2006305-43 = "Customer? Have you decided on your order?"
2006305-47 = "An order…… Right, an order. I need to make it clear."
2006305-48 = "Crisply and clearly…… without confusing the other party, firmly conveying our intentions——#nThat's it."
2006305-52 = "……Preparation complete. Please respond."
2006305-53 = "Respond……? Placing your order, please!"
2006305-54 = "Reception somewhat poor on this end. Signal strength 3. Determining no major obstacles."
2006305-58 = "Therefore, we will continue with the 9-line briefing."
2006305-59 = "Sensei, the communication quality is poor, but I'll fill in any cut-off parts."
2006305-60 = "Line 1, pickup point. Current location: Mochi Burger Gehena DT."
2006305-61 = "Line 2, radio frequency and call sign. Maintaining current channel. #nCall sign, Crusader-chan."
2006305-62 = "Line 3, urgency is low. However, due to many trailing vehicles, prompt response is requested. #nLine 4, no special remarks."
2006305-63 = "Line 5. Five Mochi Beef Burger Sets. Two salad bowls. #nAll drinks are cola."
2006305-64 = "U-Uhm……."
2006305-65 = "Please refrain from interrupting. Due to time constraints, the briefing will resume. #nNext, line 6——"
2006305-71 = "——End. No need for a repeat. Immediate preparation is requested. Crusader-chan out."
2006305-72 = "It's policy, so I'll repeat it just in case…… #nFive Mochi Beef Burger Sets, two salad bowls, and all drinks are cola, right? #nPlease pull forward……."
2006305-73 = "Sigh…… Why are all the customers in Gehena so weird……."
2006305-78 = "Welcome……."
2006305-79 = "Good."
2006305-80 = "There's a window, and a sentry. This really is a checkpoint."
2006305-81 = "A checkpoint……?"
2006305-82 = "Engine stopped. Daytime running lights turned off."
2006305-83 = "Presenting identification. There are also firearms inside the vehicle. Check them if necessary."
2006305-84 = "No, um…… This isn't a checkpoint, so…… If you could just take your items, that'd be……."
2006305-85 = "Hm?"
2006305-91 = "Alright. With this, supply is complete as scheduled."
2006305-92 = "Sensei, how was it? Not bad for a first time, right?"
2006305-96 = "[ns] \"You did great!\""
2006305-97 = "Sensei. #nThank you for helping me learn how to be \"normal\"."
2006305-98 = "Next time, I think I can do it well on my own."
2006305-99 = "Though…… let's come together next time, too. That's bound to be more fun."
2006305-101 = "(On the way back, Azusa drove the tank while humming a little tune.)"
2006305-102 = "(Having successfully completed her errand, Azusa looked proud of herself.)"
