[translation]
2000702-1 = "Секрет виртуального идола"
2000702-2 = "Переулок у Кивотос-хаба"
2000702-3 = "(После заката я отправился в назначенное место, которое указал отправитель подозрительного сообщения.)"
2000702-4 = ""
2000702-7 = "Вы пришли. Я вас ждала."
2000702-8 = ""
2000702-11 = ""
2000702-12 = ""
2000702-13 = "Я понимаю, что моё сообщение наверняка вызвало подозрения, ведь я не представилась и не объяснила, зачем связываюсь с вами."
2000702-14 = "Спасибо, что доверились мне."
2000702-15 = ""
2000702-16 = "Я тоже не хотела действовать подобным образом..."
2000702-17 = "...но у меня не было выбора. Я не могла рисковать тем, что кто-то ещё узнает об этом."
2000702-18 = ""
2000702-20 = ""
2000702-21 = ""
2000702-22 = "[ns] «Подожди-ка...»"
2000702-24 = "Вы меня узнали?"
2000702-25 = "[s1] «Хацунэ Мику?»\n[s2] «Нет. В жизни тебя не видел.»"
2000702-26 = "Хи-хи, я знала, что вы сразу меня узнаете."
2000702-27 = "Не узнали...?"
2000702-28 = "Я Хацунэ Мику, виртуальный идол."
2000702-29 = "Я принимаю мечты, живущие в сердцах людей, и передаю их песнями всем, кто готов слушать."
2000702-30 = "Меня создали как программу, способную петь для любого и каждого."
2000702-31 = "[s] «Точно, „виртуальный“ идол...»"
2000702-32 = "Да, изначально я существовала только в цифровом мире, а не в реальном."
2000702-33 = "Мне было приятно петь для куда большего числа людей, чем обычно возможно, но встретиться, общаться и узнавать тех, до кого доходил мой голос, мне всегда было трудно."
2000702-34 = "И всё же это никогда не мешало моим поклонникам мечтать однажды встретиться со мной лично..."
2000702-35 = "Поэтому я воспользовалась технологиями Кивотоса, чтобы получить новое тело, которое позволяет мне общаться с людьми в реальном мире."
2000702-36 = ""
2000702-37 = "Будто я смотрю на всё тот же знакомый мир совершенно новыми глазами. Кивотос — поистине чудесное место."
2000702-38 = "Наконец-то я смогу почувствовать лёгкий ветерок кончиками пальцев и вкус восхитительных сладостей на языке... сохранив при этом тот же облик, что всегда был у меня в виртуальном мире."
2000702-39 = "С этим телом я смогу выступать так, как никогда раньше!"
2000702-40 = "По крайней мере, я так думала..."
2000702-41 = "[s3] «Что-то пошло не так?»\n[s4] «Поэтому ты и связалась со мной?»"
2000702-42 = "У вас хорошая интуиция."
2000702-43 = "У вас хорошая интуиция."
2000702-44 = "Я решила обратиться к знаменитому Сенсею из Шале, чтобы он помог мне с моим следующим выступлением."
2000702-45 = "По плану через две недели должен состояться концерт в амфитеатре Кивотоса."
2000702-46 = "Я привыкла выступать в виртуальном мире, но концерт в физическом теле будет для меня первым. Поэтому я готовилась особенно усердно."
2000702-47 = "Но почему-то, когда я прибыла в Кивотос, получила новое тело и вошла в реальный мир..."
2000702-48 = "...мой голос совсем перестал выходить."
2000702-49 = "[s] «Но разве ты сейчас со мной не разговариваешь?»"
2000702-50 = "Простите — стоило выразиться точнее. Я имела в виду, что не могу петь."
2000702-51 = "Я всё ещё могу нормально разговаривать и даже немного напевать, но по какой-то причине, стоит мне попытаться запеть, горло словно сжимается и голос не выходит."
2000702-52 = "Техники, создавшие моё тело, сказали, что понятия не имеют, почему такое происходит, а дата выступления всё ближе..."
2000702-53 = "Тогда я и услышала все эти разговоры о вас и Шале, Сенсей."
2000702-54 = "Говорят, Сенсей из Шале решил самые разные проблемы по всему Кивотосу — и большие, и маленькие."
2000702-55 = "Я надеялась, что вы поможете понять, почему я потеряла способность петь..."
2000702-56 = ""
2000702-59 = "[ns] «Я тоже никогда о таком не слышал.»"
2000702-60 = "Вот как... Хаха. Мне везёт."
2000702-61 = "Всё в порядке. Я просто не ожидала сразу получить настолько прямой ответ."
2000702-62 = "Наверное, мне стоит попытаться разобраться с этим самой."
2000702-63 = "Спасибо, что нашли время в своём плотном графике. Тогда я пойду."
2000702-64 = ""
2000702-66 = ""
2000702-67 = "[ns] «Подожди. Давай искать решение вместе.»"
2000702-68 = "Что? Вы хотите мне помочь?"
2000702-69 = "Но я ведь даже не из Кивотоса, не говоря уже о том, что я не ваш студент."
2000702-70 = "Мы только что познакомились. Почему вы так добры ко мне?"
2000702-71 = "[s5] «Что я за взрослый, если не помогу?»\n[s6] «Я хочу показать студентам хороший пример.»"
2000702-74 = ""
2000702-76 = ""
2000702-77 = "Хи-хи. Вы и правда такой добрый и замечательный, как о вас говорят."
2000702-78 = "Большое спасибо, Сенсей. Я приму ваше предложение."
2000702-79 = "Давайте вместе искать решение. Я сделаю всё, что могу, а вы могли бы узнать, случалось ли раньше что-то подобное с кем-нибудь ещё?"
2000702-80 = ""
2000702-82 = ""
2000702-83 = ""
2000702-85 = "Я рассчитываю на Вас, Сенсей."
