[translation]
1013103-1 = "Хоккей"
1013103-2 = "Добро пожаловать, Сенсей! Как поживаете?"
1013103-3 = "[s] «Ха. Лучше не спрашивай.»"
1013103-4 = "Хорошо. Пожалуйста, следуйте за мной в просмотровую комнату."
1013103-5 = "Что? Почему мы не смотрим матч здесь? Ну уж нет. Это рабочее место!"
1013103-6 = "И, как вы могли заметить, здесь почти нет оборудования для видеопроекции!"
1013103-7 = "Прошу! Сюда!"
1013103-12 = "[ns] «Ого... Выглядит впечатляюще.»"
1013103-13 = "Вот как? Что ж, на меньшем я не могла остановиться. Всё-таки к нам приехал сам великий «Сенсей»."
1013103-14 = "[s1] «Я ценю старания, но...»\n[s2] «ВСЁ ЭТО принадлежит Издательскому отделу?»"
1013103-17 = "А, насчёт этого..."
1013103-18 = "Издательский отдел действительно предназначен для выпуска печатных материалов."
1013103-19 = "Но ВОТ ЭТО — наглядная демонстрация того, насколько президент любит тратить деньги..."
1013103-20 = "Среди различных культурных инициатив Красной Зимы Издательский отдел порой бывает весьма... увлечён отдельными проектами."
1013103-21 = "Вот к чему это и привело..."
1013103-22 = "[s] «...А Секретариат вообще не против?»"
1013103-23 = "К-Красная Зима живёт по своим правилам! Как и сам Издательский отдел!"
1013103-24 = "Нет никакой необходимости расследовать наши финансы или расходы, уверяю вас!"
1013103-25 = "Но главное — мы ведь пришли сюда ради хоккея, верно?"
1013103-26 = "Как я уже говорила, полуфинал вот-вот начнётся."
1013103-27 = "Естественно, в Красной Зиме немало студентов, занимающихся зимними видами спорта."
1013103-28 = "А у хоккея особенно много преданных поклонников!"
1013103-29 = ""
1013103-31 = ""
1013103-32 = "И вот мы здесь, дамы и господа! Полуфинал хоккейной лиги вот-вот начнётся!"
1013103-33 = "Началось, Сенсей!"
1013103-34 = "Как вы, возможно, уже знаете, каждая хоккейная команда состоит из шести игроков. По сравнению с другими видами спорта это довольно мало."
1013103-35 = "Матч состоит из трёх периодов по 20 минут, то есть общее игровое время составляет 60 минут."
1013103-36 = "Правила... на самом деле довольно просты. Игроки используют клюшки и стараются забить шайбу в ворота соперника."
1013103-37 = "Кстати, в хоккее вместо «голкиперов» у нас «вратари». В обычной речи их просто называют «вратарями»."
1013103-38 = "Отличный силовой приём! Очень агрессивная защита!"
1013103-39 = "[s] «Погоди, они только что... врезались в другого игрока!»"
1013103-40 = "Всё в порядке! Такое допускается правилами хоккея Красной Зимы."
1013103-41 = "Главное — не лежи пластом на льду! Быстро вставай! Если ещё сильнее затянешь игру, получишь штраф!"
1013103-42 = "[s3] «То есть намеренные столкновения не считаются фолом...»\n[s4] «А лежать на льду — считается...?»"
1013103-45 = "Да! Таковы правила хоккея Красной Зимы!"
1013103-46 = "[s] «Эй. Его ударили клюшкой!»"
1013103-47 = "Плохо дело! Это пятиминутный штраф!"
1013103-48 = "Что?! Судья, вы с ума сошли? Всего две минуты?! Нужно проверить его банковский счёт!"
1013103-49 = "[s5] «Это месть за тот силовой приём?»\n[s6] «Кажется, кого-то три раза подряд приложили...»\n[s7] «Защитное стекло трескается... Это нормально?!»"
1013103-53 = "Ох... Вот это уже перебор. Если защитное стекло будет серьёзно повреждено, матч придётся остановить до его замены."
1013103-54 = "К тому же такие намеренные и последовательные силовые приёмы наверняка приведут к десятиминутному штрафу за неспортивное поведение—"
1013103-55 = "Судья решил, что игра должна продолжаться! Такую щедрость не каждый день увидишь, дамы и господа!"
1013103-56 = "У судьи сотрясение мозга?! Он что, умереть хочет?"
1013103-57 = "[s] «Теперь они просто дерутся...»"
1013103-58 = "Разумеется! Это естественная реакция на такую несправедливость."
1013103-59 = "Вообще-то хоккейный матч без единой драки — довольно редкое зрелище!"
1013103-60 = "Если домашняя команда сильно проигрывает, игроки иногда специально начинают драки, чтобы не дать зрителям заскучать."
1013103-61 = "В конце концов, если матч скучный, игроки обязаны обеспечить болельщикам достойное шоу. Цена билета должна себя оправдать."
1013103-62 = "Хоккейная экипировка и шлемы довольно прочные, поэтому всё относительно безопасно."
1013103-63 = "А поскольку большинство игроков дерётся только кулаками, никто не получает серьёзных—"
1013103-64 = ""
1013103-69 = "[ns8] «Толпа тоже полезла в драку!»\n[ns9] «А кто-то жжёт флаг команды!»"
1013103-72 = "...Ох ты ж."
1013103-73 = "Вот это уже серьёзный инцидент."
1013103-74 = "...О? Такое часто бывает?"
1013103-75 = "..."
1013103-76 = "Ну, не то чтобы это происходило часто, но..."
1013103-77 = "...Такого нельзя назвать... чем-то неслыханным."
1013103-78 = ""
1013103-81 = "—а потому мы осуждаем Секретариат и порицаем его политику!"
1013103-82 = "Порицаем! Порицаем!"
1013103-83 = "Мы порицаем то, что сегодня утром в общежитиях всё ещё холодно! Что изнурительный труд продолжается уже третий день подряд! Что на ужин нам дают всего одну жалкую порцию разбавленного пудинга!"
1013103-84 = "А теперь ещё и моя любимая команда проиграла этот хоккейный матч? Возмутительно! Коррупция! Во всём виноват Секретариат!"
1013103-85 = "Да! Точно!"
1013103-86 = "Товарищи, марш к Секретариату!"
1013103-87 = "Вперёд! Вперёд!"
1013103-88 = ""
1013103-90 = "[ns10] «Неужели это...»\n[ns11] «Утренняя разминка Красной Зимы?!»"
1013103-93 = "К-Кто тебе вообще такое рассказал?"
1013103-94 = "...После всего, что я вам наговорила, мне даже немного стыдно как студенту Красной Зимы..."
1013103-95 = "Раз, раз, проверка микрофона. Проверка. Эй."
1013103-96 = "Здравствуйте, студенты Красной Зимы. Сообщаем, что в районе хоккейной арены в настоящий момент начинается небольшой переворот."
1013103-97 = "Секретариат заверяет, что сделает всё возможное для урегулирования ситуации, и объявляет в этой ограниченной зоне военное положение. Закон и порядок будут соблюдены."
1013103-98 = "Просим студентов не паниковать и вместо этого сосредоточиться на учёбе и физическом труде."
1013103-99 = "Повторяем. Красная Зима в безопасности. Красная Зима в безопасности."
1013103-100 = "Как думаешь, сколько нам придётся скрываться?"
1013103-101 = "Ставлю на два дня."
1013103-102 = "Я думаю, три."
1013103-103 = "Поспорим?"
1013103-104 = "Идёт."
1013103-105 = "Микрофон всё ещё включён, идиоты!"
1013103-106 = "Биииип"
1013103-107 = ""
1013103-111 = "..."
1013103-112 = "[s] «...»"
1013103-113 = "Эм, Сенсей?"
1013103-114 = "Понимаю, это может выглядеть... тревожно."
1013103-115 = "Может, вместо этого посмотрим подборку хоккейных моментов? Я бы хотела показать вам лучшие эпизоды."
1013103-117 = "Так мы с Таканэ и посмотрели несколько отличных моментов из старых хоккейных матчей."
