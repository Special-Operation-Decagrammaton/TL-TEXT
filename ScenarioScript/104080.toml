[translation]
104080-1 = "Эпизод 8; Там, где начинаются все чудеса"
104080-5 = "― И потому, Сенсей. [wa:1500]Я прошу вас."
104080-8 = "― Ваши отношения со всеми нами..."
104080-11 = "― Драгоценные [wa:2200]воспоминания, которые мы создали... Все дни, проведённые вместе... [wa:2200]Пожалуйста..."
104080-16 = "― Пожалуйста, берегите их."
104080-19 = "― Да... Такие драгоценные вещи [wa:1500]никогда не исчезнут."
104080-22 = "― Так же, как чудеса..."
104080-25 = "― Поэтому, [wa:1200]давайте вернёмся, [wa:1000]Сенсей."
104080-31 = "― Туда, [wa:2200]где живёт [wa:2000]вся наша любовь."
104080-36 = "Да, это единственный путь..."
104080-37 = "Понимая непостижимое, мы можем понять самих себя."
104080-42 = "Слава... богу..."
104080-43 = ""
104080-46 = "..."
104080-47 = "Да. Сенсей благополучно вернулся к своим студентам."
104080-48 = "Спасибо. Теперь..."
104080-49 = "Я рада, что своим последним поступком смогла спасти Сенсея."
104080-50 = "На этом для меня всё, Арона."
104080-51 = "Если я останусь в Ковчеге Шиттим... постоянная перегрузка станет для тебя бременем."
104080-52 = "Возвращайся в свою светлую и тёплую классную комнату."
104080-53 = "Тогда прощай, Арона."
104080-54 = ""
104080-58 = ""
104080-62 = ""
104080-63 = ""
104080-64 = "Тогда я..."
104080-65 = "..."
104080-66 = ""
104080-69 = ""
104080-70 = ""
104080-71 = "...Ты пошла за мной."
104080-72 = "Да."
104080-73 = "Похоже на то."
104080-74 = "Я не могу существовать здесь, не вызывая нарушений. В этом мире может быть лишь одна Широко."
104080-75 = ""
104080-77 = ""
104080-78 = "...Шарф."
104080-79 = "...?"
104080-80 = "Я не могу отдать тебе этот шарф. Он мне дорог."
104080-81 = "..."
104080-82 = "Но..."
104080-83 = ""
104080-85 = ""
104080-86 = ""
104080-87 = ""
104080-88 = "Я могу отдать тебе это."
104080-89 = "Это..."
104080-90 = "...Я знаю, что это."
104080-91 = "Это... важно для тебя. Ты правда хочешь отдать его мне?"
104080-92 = ""
104080-94 = ""
104080-95 = ""
104080-96 = "Но... почему?"
104080-97 = "Знаю. Для меня это так же дорого, как шарф."
104080-98 = "Он связывает меня со всеми из Комитета по предотвращению закрытия... Он наполнен нашими воспоминаниями."
104080-99 = "...Теперь он твой."
104080-101 = "Не понимаю."
104080-102 = "Просто кажется, что так будет правильно."
104080-103 = ""
104080-105 = ""
104080-110 = "Но это... настолько дорого тебе..."
104080-111 = "Ещё как. С этим можно ограбить любой банк."
104080-114 = "Знаю... Я тоже любила грабить банки..."
104080-117 = "Ах. Тогда всё сходится."
104080-120 = "Не думала, что когда-нибудь снова увижу это..."
104080-121 = "Вместе с Хошино, Нономи, Серикой и Аяне..."
104080-122 = "Мы ограбили Стигийский банк, секретное хранилище Генерального ученического совета... Какие дорогие воспоминания..."
104080-123 = "(Секретное хранилище...?)"
104080-124 = "Спасибо, я буду хранить это вечно."
104080-126 = "Спасибо..."
104080-129 = "...И не переживай."
104080-130 = ""
104080-132 = ""
104080-133 = "Думаю, ничего страшного, если здесь будут две Широко."
104080-134 = ""
104080-136 = ""
104080-137 = "А даже если из-за этого случится что-нибудь плохое... Сенсей что-нибудь придумает."
104080-138 = "...Сенсей."
104080-139 = "Да. Наш мир... защищает Сенсей."
104080-140 = ""
104080-142 = ""
104080-143 = "Тогда, может быть, когда-нибудь... мы сможем ограбить... то есть покататься на велосипеде вместе."
104080-144 = "Только без банков. Хошино на нас разозлится."
104080-145 = "Да. Ещё как."
104080-146 = ""
104080-148 = ""
104080-149 = ""
104080-151 = "Тогда... Пока, Широко. Береги себя."
104080-152 = ""
104080-154 = ""
104080-156 = "..."
104080-159 = "Здесь пусто, холодно и бесплодно..."
104080-160 = "Но однажды мы сможем добраться до конца."
104080-161 = "Да, может быть, когда-нибудь..."
104080-164 = "Куда ты идёшь?"
104080-166 = "К-Когда ты...?"
104080-167 = "Куда ты идёшь? Дом в другой стороне!"
104080-168 = "...А?"
104080-169 = "Не уходи одна. Пойдём домой вместе со мной."
104080-170 = "...С тобой?"
104080-171 = "Да! Пора возвращаться."
104080-172 = "Это... правда можно?"
104080-173 = "А? А почему нельзя?"
104080-174 = "Сенсей велел мне заботиться о студентах."
104080-176 = "Заботиться о тебе — моя миссия, Плана!"
104080-177 = "Пла...на...?"
104080-179 = "Не могу же я вечно звать тебя A.R.O.N.A., если мы будем жить вместе. Сенсей ещё запутается!"
104080-180 = "Но... почему Плана...?"
104080-181 = "Хи-хи... Только что придумала. Ты как одинокая звезда в ночном небе. Кажется, будто ты немного от всех отдалена."
104080-182 = "Отныне я хочу, чтобы ты освещала всё вокруг своим звёздным светом, поэтому назвала тебя Плана! Ты словно планетарий. Как тебе?"
104080-183 = "Раз уж ты спрашиваешь... думаю, я не против..."
104080-184 = "Тогда решено — Плана!"
104080-185 = "Плана... Хорошо."
104080-186 = ""
104080-188 = ""
104080-191 = "Тогда, Плана. Давай вернёмся вместе."
104080-194 = "..."
104080-195 = "Мне... взять тебя за руку?"
104080-196 = "Да! Чтобы мы не потерялись! Я должна заботиться о тебе как старшая сестра!"
104080-197 = "Моя... сестра."
104080-198 = ""
104080-203 = "Спасибо, Арона."
104080-204 = "Ты не будешь называть меня «сестрёнкой»?!"
104080-205 = "Пока буду называть тебя Ароной."
104080-206 = "*хнык*"
104080-207 = ""
104080-214 = "Тогда мы идём... домой?"
104080-217 = "Да! Мы возвращаемся домой — туда, где начинается наша история!"
104080-218 = "А ещё..."
104080-226 = "Следующий эпизод; Эпилог 1"
