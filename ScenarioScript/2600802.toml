[translation]
2600802-1 = "Видели? У меня получилось!"
2600802-2 = "Я отправился в пляжное кафе встретиться с Шизуко."
2600802-3 = "О, Сенсей!"
2600802-4 = "Я так долго вас ждала!"
2600802-5 = "[s] «Ты бодрая, как всегда.»"
2600802-6 = "Конечно!"
2600802-7 = "Как хозяйка и лицо «Момоёдо», я обязана всегда быть энергичной!"
2600802-8 = "[s] «Так зачем ты меня позвала?»"
2600802-9 = "Ого, серьёзно? Вам обязательно сразу переходить к делу?"
2600802-10 = "Мы на пляже, самый разгар лета!"
2600802-11 = "И в пляжном кафе становится всё оживлённее!"
2600802-12 = "Можете хотя бы немного подыграть?!"
2600802-13 = "[s1] «Я не совсем понимаю, что ты имеешь в виду, но ладно!»\n[s2] «Хм... Похоже, работы много.»"
2600802-16 = "Ух... Забудьте!"
2600802-17 = "Хватит меня дразнить, Сенсей!"
2600802-18 = "Когда услышите, что я хочу сказать, вы сразу начнёте относиться серьёзно!"
2600802-19 = "Тогда вам даже не придётся притворяться, что подыгрываете!"
2600802-20 = ""
2600802-22 = ""
2600802-24 = "Видите ли, это франшиза «Момоёдо»..."
2600802-25 = "...пляжное кафе!"
2600802-27 = "Мне нечего скрывать!"
2600802-28 = "Я почти добилась запуска франшизы через деловые контракты!"
2600802-29 = "Я заключила партнёрство со всеми курортами «Затерянного рая»!"
2600802-31 = "И отобрала лучшие услуги и товары каждого из них..."
2600802-32 = "...а затем представила их здесь, в пляжном кафе!"
2600802-33 = "Управляя каждым филиалом напрямую, словно флагманским магазином,"
2600802-35 = "мы добились беспрецедентной прибыли, сочетая специализированные товары,"
2600802-36 = "подобранные под особенности каждого филиала,"
2600802-37 = "с обычными товарами, которые можно найти где угодно!"
2600802-39 = "Источники дохода «Момоёдо» с этого момента — коммерческая тайна."
2600802-40 = "Такого резкого роста у нас ещё никогда не было!"
2600802-41 = "С таким темпом имя «Момоёдо» разойдётся повсюду!"
2600802-42 = "О нём будут знать во всём Кивотосе!"
2600802-43 = "Можно сказать, глобальный маркетинг продаж!"
2600802-44 = "[s3] «Это было довольно долгое объяснение.»\n[s4] «Очень впечатляет, Шизуко.»"
2600802-47 = "Вы должны хвалить мою деловую хватку, Сенсей!"
2600802-48 = "Ух! Почему мне всё ещё кажется, что вы надо мной издеваетесь?"
2600802-49 = "Вы уже посетили несколько филиалов? П-Правда?"
2600802-50 = "И как они вам?"
2600802-51 = "Что вы думаете о совершенно новых летних услугах «Момоёдо»?"
2600802-52 = "[s] «Мне понравилось, но я начал скучать по прежним услугам „Момоёдо“.»"
2600802-53 = "Прежним услугам? Что может быть лучше того, что мы делаем сейчас?"
2600802-54 = "А... вы про услугу «растеряшки» и те постановочные выступления?"
2600802-55 = "Э-Это... мне не кажется, что они были особо эффективными..."
2600802-56 = "Можно сказать, теперь они в самом низу списка приоритетов."
2600802-57 = "Или, может быть, я просто из них выросла."
2600802-58 = "У нас нет ресурсов..."
2600802-59 = "...чтобы тратить время на такие мелочи."
2600802-60 = "Решение было тяжёлым, но мне пришлось его принять. Хи-хи."
2600802-61 = "[s] «Шизуко, ты в последнее время вообще нормально отдыхаешь?»"
2600802-62 = "Ч-Что вы имеете в виду...?!"
2600802-63 = "Я почему-то кажусь странной?"
2600802-64 = "[s5] «Раньше ты всегда выглядела такой милой, обслуживая клиентов.»\n[s6] «Чем больше становится франшиза, тем меньше у тебя времени обслуживать клиентов самой.»"
2600802-67 = "Ч-Что?"
2600802-68 = "Т-Так... насчёт этого...!"
2600802-69 = "Я никогда раньше не видел, чтобы лицо Шизуко становилось настолько красным."
2600802-70 = "Я-я вспомнила, что мне нужно кое-что сделать!"
2600802-71 = "В деловом отделе меня ждёт одна умная, великолепная и очень сообразительная знакомая!"
2600802-72 = "У-Увидимся завтра!"
2600802-73 = ""
2600802-75 = ""
2600802-77 = "Шизуко куда-то убежала."
2600802-78 = "Меня немного обеспокоила её реакция, но в конце концов я вернулся на курорт."
