[translation]
1004002-1 = "Я-я хочу стать настоящим ниндзя!"
1004002-2 = "Я пришёл к месту встречи с Цукуё вовремя, но..."
1004002-3 = "По какой-то причине Цукуё сильно опаздывала."
1004002-4 = "[ns] «Надеюсь, с ней всё в порядке...»"
1004002-5 = "С-Сенсей..."
1004002-6 = ""
1004002-10 = "Я-я здесь...!"
1004002-13 = ""
1004002-15 = ""
1004002-16 = "[ns] «Ц-Цукуё?!»"
1004002-18 = "З-Здравствуйте... Простите, что заставила вас ждать..."
1004002-19 = "Я-я знаю, что сама попросила вас встретиться... но когда пришло время выходить, я так занервничала... и мне стало очень тревожно."
1004002-20 = "Я подумала, что не заслуживаю отнимать ваше время... Я ведь такая высокая и большая."
1004002-21 = "В-Вы так любезно согласились встретиться... но правда хотите стоять рядом с огромной великаншей?"
1004002-22 = "От этих мыслей мне захотелось спрятаться."
1004002-23 = "Поэтому я замаскировалась под дерево... и спряталась... П-Простите!"
1004002-24 = "[s] «Я бы никогда так не подумал. Пожалуйста, не переживай.»"
1004002-25 = "П-Правда...?"
1004002-26 = "[s] «Так о чём ты хотела посоветоваться, Цукуё?»"
1004002-27 = "Н-Ну! Насчёт этого..."
1004002-28 = "Я очень хочу стать полноценным ниндзя! Я... надеялась, что вы поможете мне им стать."
1004002-29 = "Говорят, Сенсей из Шале невероятный..."
1004002-30 = "И я подумала... может, с вашей помощью я смогу стать великим ниндзя!"
1004002-31 = "[s1] «Великим полноценным ниндзя?»\n[s2] «Почему ты хочешь стать именно таким ниндзя, Цукуё?»"
1004002-32 = "О! Т-Точно...! Наверное, кажется смешным, что такая девушка, как я, хочет стать ниндзя..."
1004002-33 = "О! Т-Точно...! Наверное, кажется смешным, что такая девушка, как я, хочет стать ниндзя..."
1004002-34 = "В-Вам... просто интересно почему?"
1004002-35 = "О, тогда причина... причина в том..."
1004002-36 = "Н-Ну... если я стану великим ниндзя, смогу больше помогать друзьям из Клуба исследования ниндзюцу."
1004002-37 = "Да...! Я хочу стать великим ниндзя, чтобы помогать людям."
1004002-38 = "В-Вот почему!"
1004002-39 = "Это... Это звучит глупо?"
1004002-40 = "[s] «Совсем нет. Я плохо разбираюсь в ниндзя, но давай попробуем!»"
1004002-41 = ""
1004002-43 = ""
1004002-44 = ""
1004002-45 = ""
1004002-46 = "Ого! С-Спасибо!"
1004002-48 = "Я-я сделаю всё, чтобы стать великим ниндзя, Сенсей! С-С чего начнём?"
1004002-49 = "[s3] «Для начала важно использовать то, что у тебя уже хорошо получается.»\n[s4] «Тренируйся шаг за шагом, начав с того, в чём уверена больше всего.»"
1004002-50 = ""
1004002-51 = ""
1004002-53 = ""
1004002-54 = "Хм! Понятно!"
1004002-55 = "То, что у меня уже хорошо получается... Сначала делать это..."
1004002-56 = "Тренироваться шаг за шагом... Хм, точно..."
1004002-57 = "Сенсей... Это звучит совершенно логично!"
1004002-58 = "Это было так мудро и полезно... словно старая пословица! Хочу записать..."
1004002-59 = "[s] «П-Правда...? В общем, в чём ты уверена больше всего?»"
1004002-60 = "А-А? О, ну... больше всего я уверена в..."
1004002-61 = "О! Есть одно!"
1004002-62 = "Я-я очень хорошо маскируюсь под дерево!"
1004002-63 = "[s5] «О, твои навыки маскировки и правда потрясающие.»\n[s6] «Я вообще не понял, что ты пришла раньше меня.»"
1004002-64 = "Правда...?!"
1004002-65 = "Правда...?!"
1004002-66 = "Хи-хи! Ого! Услышать это от вас делает меня такой счастливой!"
1004002-67 = "Маскироваться под дерево я тренируюсь ещё с детства!"
1004002-68 = "Я всегда была высокой ребёнком, поэтому в школьных спектаклях мне часто давали роль дерева!"
1004002-69 = "Поэтому мне очень привычно и уверенно быть деревом!"
1004002-70 = "Я была настолько хороша, что раньше меня прозвали «Младшее дерево Хяккияко»!"
1004002-71 = "Хватит разговоров... Я могу показать прямо сейчас!"
1004002-72 = "[s] «А-А? Сейчас? Здесь?»"
1004002-73 = "Да! Дайте мне минутку. Сначала..!"
1004002-74 = "Вот это сюда... вот так..."
1004002-75 = "Эту ветку... сюда..."
1004002-76 = "Фух... Теперь я готова..."
1004002-77 = "А теперь я, Оно Цукуё... покажу вам своё лучшее умение!"
1004002-78 = "Моя секретная специализация!"
1004002-79 = "Хия-я-я-я!"
1004002-80 = ""
1004002-84 = "Я-я похожа на дерево, Сенсей?"
1004002-85 = ""
1004002-90 = "[ns7] «П-Потрясающе! Это чудо!»\n[ns8] «Наверное, так и выглядит единение с природой!»"
1004002-91 = ""
1004002-92 = ""
1004002-93 = ""
1004002-94 = "Вот такая была демонстрация маскировки!"
1004002-95 = "К-Как вам? Всё нормально? Е-Есть что-нибудь, что можно улучшить?"
1004002-96 = "[s] «Э-Это было невероятно, Цукуё! Я вообще тебя не видел!»"
1004002-97 = "Хи... хи-хи... хи-хи-хи... Спасибо за похвалу..."
1004002-98 = "Благодаря вам... кажется, я стала чуточку увереннее!"
1004002-99 = "Это моя сильная сторона... Если я овладею маскировкой под дерево..."
1004002-100 = "Смогу стать полноценным ниндзя!"
1004002-101 = "[s] «Я верю в тебя, Цукуё! Ты отличный ниндзя!»"
1004002-102 = "С-Спасибо за совет, Сенсей!"
1004002-103 = "Я не сдамся!"
1004002-104 = ""
1004002-106 = "..."
1004002-107 = "...О, в-вообще-то..."
1004002-108 = "Я ошиблась, Сенсей."
1004002-109 = "Настоящий ниндзя должен был отступить и скрыть свой энтузиазм... У меня плохо получается..."
1004002-110 = "Это неважно? Я всё равно справилась?"
1004002-111 = "Х-Хорошо! Тогда я удалюсь, пока не стало слишком поздно!"
1004002-112 = "Хи-хи-хи. Хия!"
1004002-113 = ""
1004002-117 = "[ns] «О... Хорошо, пока, Цукуё.»"
1004002-119 = "[ns] «Хм... Наверное, и мне пора.»"
1004002-122 = "[ns9] «...Эм, Цукуё. Ты правда ушла?»\n[ns10] «Или... снова замаскировалась под дерево...?»"
1004002-125 = "[ns] «...»"
1004002-127 = "После этого я простоял там ещё около десяти минут на всякий случай. Затем вернулся в Шале, всё ещё немного подозревая неладное."
