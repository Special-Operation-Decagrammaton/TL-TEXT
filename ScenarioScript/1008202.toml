[translation]
1008202-1 = "Юность Сенсея"
1008202-3 = "По просьбе Рэнгэ я отправился в офис Совета урегулирования Хяккарёран."
1008202-7 = "Ха!"
1008202-8 = ""
1008202-18 = ""
1008202-19 = ""
1008202-20 = "Хия!"
1008202-21 = ""
1008202-27 = ""
1008202-28 = "Ещё раз!"
1008202-29 = "Ха!"
1008202-30 = ""
1008202-36 = "Отлично. А теперь добивающий удар!"
1008202-37 = ""
1008202-39 = ""
1008202-40 = ""
1008202-41 = ""
1008202-43 = "Хва-а!!!"
1008202-44 = ""
1008202-51 = ""
1008202-53 = "[ns] В-В последнем движении было столько страсти!"
1008202-54 = ""
1008202-56 = ""
1008202-57 = "К-Кто...? Сенсей?!"
1008202-59 = "...Как я это сделала?"
1008202-60 = "Ну, я совместила стрелковые техники Хяккарёран с небольшим... Ну, типа... Э-э, как бы тебе это объяснить?"
1008202-61 = "[s1] В любом случае интересно посмотреть, как ты тренируешься!\n[s2] Хяккарёран каждое утро так тренируется?"
1008202-64 = "Ага. Без исключений."
1008202-65 = "Несмотря на недавние события, Совет урегулирования Хяккарёран играет важную роль в защите учеников Хяккияко."
1008202-66 = "Мы бы не справились, если бы не были сильнейшими."
1008202-67 = "Моя работа — держать всех в отличной форме, поэтому каждое утро я провожу тренировки по стрельбе и физподготовке."
1008202-68 = "Сегодня я как раз придумывала новые упражнения. И должна сказать, я вообще не промахиваюсь! Чувствую себя отлично. Хи-хи."
1008202-69 = "[s3] Когда дело касается силы, лёгких путей и правда нет.\n[s4] Как и ожидалось от капитана штурмового отряда Хяккарёран!\n[s5] Фува Рэнгэ! Ты потрясающая!"
1008202-70 = ""
1008202-71 = ""
1008202-72 = ""
1008202-74 = ""
1008202-75 = "Ч-Что?"
1008202-76 = "Даже если будешь мне льстить, поблажек не получишь, знаешь ли."
1008202-77 = "В этом правда нет ничего особенного. От меня этого и ждут, понимаешь?"
1008202-78 = "То есть не пойми неправильно. Я не против немного похвалы. А от тебя... мне даже как-то приятно..."
1008202-79 = ""
1008202-81 = ""
1008202-82 = "Давай просто забудем, что я это сказала."
1008202-83 = "Эм... Ладно, дальше..."
1008202-84 = "Я думала, ты придёшь после утренней тренировки! Ты рано, Сенсей!"
1008202-85 = "[s] После твоих сообщений мне показалось, что нужно прийти сразу."
1008202-86 = "Чёрт. Я, наверное, сильно тебя заставила волноваться, да?"
1008202-87 = "Приятно чувствовать, что для кого-то ты в приоритете..."
1008202-88 = "Н-Не то чтобы я хотела, чтобы ты тратил время, сидя и ожидая меня! Прости... Надо было лучше всё спланировать."
1008202-89 = "Я ещё не совсем готова..."
1008202-90 = ""
1008202-92 = ""
1008202-94 = ""
1008202-95 = "[ns] Разберёмся вместе."
1008202-96 = ""
1008202-97 = "Э-Эй! Не двигайся!"
1008202-98 = "[s] Ч-Что?! Ты в порядке, Рэнгэ?"
1008202-99 = "Н-Нет! Тайм-аут! Пауза! Сядь!"
1008202-100 = ""
1008202-102 = ""
1008202-103 = "Я сказала, ни шагу больше, Сенсей!"
1008202-104 = "[s] Я не двигаюсь! Я что-то сделал не так?!"
1008202-105 = "Нет, вовсе нет. Дело не в тебе."
1008202-106 = "Слушай, я только что закончила утреннюю тренировку. Понимаешь?"
1008202-107 = "Я боюсь, что если ты подойдёшь слишком близко..."
1008202-108 = "От меня... ну, понимаешь! Будет неприятно пахнуть!"
1008202-109 = "[s] Теперь понял... Прости, что не подумал об этом."
1008202-110 = "Всё нормально, Сенсей. Но, пожалуйста, просто подожди прямо там."
1008202-111 = "Эту ситуацию ещё можно спасти, обещаю."
1008202-112 = ""
1008202-114 = ""
1008202-119 = "[ns] Ты... делаешь прыжки ноги-врозь?"
1008202-120 = "Да!!! Так... запах... нейтрализуется!"
1008202-121 = ""
1008202-123 = ""
1008202-124 = "Хия! Глубже!"
1008202-125 = ""
1008202-130 = "Сто повторений!"
1008202-131 = "[s] Я... я не думаю, что пот работает именно так..."
1008202-134 = "Я терпеливо ждал, пока Рэнгэ закончит свою внезапную тренировку."
1008202-137 = ""
1008202-138 = "Фух. Ладно. Спасибо, что подождал, Сенсей."
1008202-139 = "[s] Ты всегда такая страстная!"
1008202-140 = "Работа обязывает, знаешь ли."
1008202-141 = "В любом случае, раз с этим разобрались..."
1008202-142 = "Признаюсь, когда говоришь об этом лицом к лицу, немного неловко."
1008202-143 = "Эм..."
1008202-144 = "[s] Эм?"
1008202-145 = "Я к этому и веду!"
1008202-146 = "Чёрт, вслух это сказать сложнее, чем я думала."
1008202-147 = "Уф! Соберись, Рэнгэ!"
1008202-148 = "Я капитан штурмового отряда Хяккарёран! Я не пасую ни перед каким препятствием!"
1008202-149 = "Да! Следуй за мной, Сенсей!"
1008202-150 = ""
1008202-155 = ""
1008202-156 = "Итак, причина, по которой я сегодня тебя позвала..."
1008202-157 = "[s] Ты сказала, что хотела о чём-то поговорить."
1008202-158 = "Д-Да! Видишь ли, это насчёт... Ну, эм..."
1008202-159 = "Ладно. Сенсей, я осознала, что становлюсь старше. Поток времени — неудержимая сила, с которой я не могу бороться!"
1008202-160 = "Уф... Как бы это сказать..."
1008202-161 = ""
1008202-163 = ""
1008202-164 = "Моя юность! Я теряю свою юность, Сенсей!"
1008202-165 = "Я не из тех, кто просто сидит и позволяет жизни делать со мной что хочет! Я должна взять эту проблему за рога! И вот тут нужен ты, Сенсей!"
1008202-166 = "[ns] «...А?»"
1008202-167 = "Ах... Я всё ещё плохо объяснила, да?"
1008202-168 = ""
1008202-170 = ""
1008202-171 = "Попробую ещё раз."
1008202-172 = "Когда-нибудь наступит день, когда школьные годы останутся лишь смутным воспоминанием, которое я буду пытаться разглядеть в тумане, словно кружащуюся пылинку."
1008202-173 = "А что, если я оглянусь назад и увижу только воспоминания о том, как прилежно работала в Хяккарёран? Я тяжело вздохну и пожалею, что позволила своей юности пройти мимо."
1008202-174 = "Разве это не ужасно? Мне страшно даже думать об этом!"
1008202-175 = "Я не могу однажды проснуться на смертном одре и понять, что меня давит тысяча сожалений!"
1008202-176 = "Разве тебе не хочется однажды оглянуться на свою жизнь и с мягкой улыбкой вспоминать все насыщенные события, которыми она была наполнена?"
1008202-177 = "Разве не именно так и следует жить?!"
1008202-178 = ""
1008202-181 = "[ns6] Прости, Рэнгэ, но я запутался!\n[ns7] Это всё слишком серьёзные темы!\n[ns8] Я всё ещё не понимаю, что именно тебе нужно!"
1008202-182 = ""
1008202-183 = ""
1008202-184 = ""
1008202-188 = "Рэнгэ продолжила объяснять свои тревоги насчёт юности. Если кратко, всё сводилось примерно к следующему."
1008202-190 = "Серьёзно! Пока ещё не поздно, мне нужно чаще заниматься всякими юношескими делами!"
1008202-191 = "Пожалуйста, Сенсей! Мне нужна твоя помощь!"
1008202-192 = "[s9] Разве ты уже не занимаешься чем-то подобным?\n[s10] Ты ведь и так занята обязанностями Хяккарёран, Рэнгэ?"
1008202-195 = "[ns] Ты ведь и так участвуешь во множестве «юношеских занятий», разве нет?"
1008202-196 = "ЧЕГО? Ты же не серьёзно, Сенсей!"
1008202-197 = "Обязанности Хяккарёран не имеют ничего общего с юностью! Это просто пробежки, изучение военной стратегии, тренировки по стрельбе..."
1008202-198 = "...Уф, что ещё? Каждый день мы патрулируем территорию, а иногда проводим операции по задержанию преступников."
1008202-199 = "Это едва ли можно назвать воплощением юности!"
1008202-200 = "В фильмах о таком не рассказывают!"
1008202-201 = "[s] Я... я понял..."
1008202-202 = "Нет, не понял! Юность должна сиять, как фейерверк, и быть горько-сладким переживанием самой жизни!"
1008202-203 = "Она должна быть как сцены, которые пишет автор «Кои о любви»!"
1008202-204 = "[s] Может, примеры помогут?"
1008202-205 = "Например..."
1008202-208 = "Это как сердце, готовое выскочить из груди при встрече с кем-то новым, или мучительное прощание с хорошим другом..."
1008202-209 = "Или когда твоя обычная скучная жизнь внезапно переворачивается, потому что спутник зовёт тебя выпить кофе и признаётся в тайном прошлом!"
1008202-212 = "А потом выясняется, что вас с другом замысловато связывает нить судьбы, как в «Галактических воинах»!"
1008202-213 = "Вот чего я ищу! Такой опыт, который заново определяет само твоё представление о жизни."
1008202-214 = "А потом я состарюсь и поседею, хвастаясь всем своей ослепительной юностью, которую никто у меня уже не отнимет!"
1008202-215 = "[s] Это точно запомнится! Хотя, может, немного нереалистично!"
1008202-216 = "А! Прости, я немного увлеклась. Конечно, я понимаю, что в реальной жизни вряд ли выяснится, будто мы с Сенсеем прожили вместе несколько прошлых жизней или что-нибудь такое..."
1008202-217 = "Как бы сказать... Я настолько погрязла в однообразии тренировок и рутины Хяккарёран, что мне стало казаться, будто жизнь ускользает сквозь пальцы."
1008202-218 = "Ты поможешь мне ухватиться за свою юность, пока ещё не поздно, Сенсей?"
1008202-219 = "[s] Не могу сказать, что полностью понял всё, что ты рассказала."
1008202-221 = "[ns] Но я всё равно сделаю всё, что смогу, чтобы помочь тебе, Рэнгэ."
1008202-222 = ""
1008202-224 = ""
1008202-225 = "Т-Ты поможешь? Правда...?"
1008202-226 = "Хи-хи! Спасибо, Сенсей!"
1008202-227 = "Будто мы заключили наставнический союз во имя юности!"
1008202-228 = "[s] Наставнический... союз?"
1008202-229 = "Именно. Это значит, что теперь ты для меня не просто учитель..."
1008202-230 = "Для наших новых отношений нужен более подходящий титул... Хм..."
1008202-231 = ""
1008202-233 = ""
1008202-234 = ""
1008202-235 = ""
1008202-236 = "Наставник!"
1008202-237 = "[s] Н-Наставник?"
1008202-238 = "Идеально подходит!"
1008202-239 = "Отныне для меня ты будешь «Наставником», пока мы вместе ищем мою юность!"
1008202-240 = ""
1008202-242 = ""
1008202-244 = ""
1008202-245 = "Наставник! Я с нетерпением жду твоих уроков!"
1008202-246 = ""
1008202-248 = ""
1008202-249 = "Давай скрепим это рукопожатием."
1008202-250 = "[s] А, да. Я постараюсь."
1008202-251 = "Хи-хи!"
1008202-253 = "Так началось наше путешествие в поисках юности Рэнгэ."
