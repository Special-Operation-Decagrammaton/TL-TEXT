[translation]
41140-1 = "Эпизод 14;Бартерная система"
41140-2 = "Мое, у тебя есть решение наших проблем со снабжением?"
41140-3 = "У н-нас нет денег и нет способа их заработать."
41140-4 = "Ты называешь себя экспертом по припасам? И это говорит та, кто просрала все наши боеприпасы на идиотский фейерверк?"
41140-6 = "У тебя просто нет вкуса! Боеприпасы никогда не тратятся впустую, если это ради красивых взрывов! Это была необходимая жертва!"
41140-7 = "Ты хочешь, чтобы я выручила нас, или нет? Такой замечательный человек, как я, может достать нам припасы, не потратив ни цента."
41140-8 = "[s] «Я не могу просто стоять и смотреть, как вы грабите банк.»"
41140-9 = "Как Вы могли предположить что-то настолько ужасное?"
41140-10 = "Академия SRT существует для защиты граждан. Мы бы никогда не стали заниматься подобным."
41140-11 = "Сенсей, Вы настолько обо мне низкого мнения?"
41140-12 = "Мой секретный способ добычи припасов - это…"
41140-14 = "Бартерная система."
41140-15 = "Люди обменивались вещами ещё до того, как научились говорить."
41140-16 = "Так что, проще пареной репы: мы обмениваем наши ценные вещи на новые великолепные зажигательные средства… и оружие."
41140-18 = "Проблема твоего плана в том, что у нас нет ценных вещей."
41140-19 = "У нас есть просроченные бенто с якунику…"
41140-20 = "Ты идиотка? Думаешь, мы будем торговать с этими лицемерными монахами?"
41140-21 = "Что у нас реально есть, так это ракеты и бомбы на окраине лагеря. Мои малышки."
41140-22 = "Не могу поверить, что сама предлагаю продать своих драгоценных крошек… пусть даже они и пострадали от воды."
41140-23 = "Но моё обливающееся кровью сердце утешится знанием того, что заботливый хозяин будет любить их так же, как я. И тогда мои прекрасные, великолепные малышки взорвутся так, как они того заслуживают!"
41140-24 = "[s] «У тебя всё всегда заканчивается взрывом…»"
41140-26 = "Согласна, это очень дорогая взрывчатка, но она слишком сильно повреждена. Как мы её продадим?"
41140-27 = "А я, по-вашему, кто? Разве я не специалист по снабжению нашего отряда? У меня есть связи, о которых вы и не мечтали."
41140-28 = "Назову хотя бы одного…"
41140-29 = "Мой маленький друг, Кайзер Индастриз - это дочерняя компания Кайзер Групп, и они - главные поставщики оружия на Чёрном Рынке. Хи-хи, уловили? Они продают всё подряд безнадёжным наёмникам, готовым брать что угодно."
41140-30 = "Так что если кто и сможет хорошо позаботиться о моих ржавых малышках, так это Кайзер Индастриз."
41140-31 = "И вуаля! Взамен я получу для нас боеприпасы и оружие от самих Кайзер!"
41140-32 = "Я…я в шоке. Мое выдала действительно хорошую идею."
41140-33 = "В том бенто, что ты ела вчера, было что-то не то? Должно быть, именно так."
41140-34 = "Да я заставлю вас взлететь на воздух быстрее, чем вы успеете выговорить кролик!"
41140-35 = ""
41140-37 = ""
41140-38 = "Ну что, хотите посмотреть на профессионала за работой?"
41140-39 = ""
41140-41 = ""
41140-44 = ""
41140-45 = "Приветствую! Кайзер Индастриз - ведущий поставщик высококлассного оружия. Чем могу Вам помочь?"
41140-46 = "Дружище, давно не виделись."
41140-47 = "Это специалист по снабжению Академии SRT. Хи-хи."
41140-48 = "О, наш VIP-клиент!"
41140-49 = "Приветствую! Какое удовольствие снова поговорить с Вами!"
41140-50 = "Чем могу помочь Вам сегодня? У нас появились совершенно новые ракеты, которые Вам точно понравятся."
41140-51 = "Или… О Боже! Возникли какие-то проблемы с кассетной бомбой, которую вы приобрели? Я с радостью Вам помогу."
41140-52 = "…Мое. Он только что сказал кассетная бомба?"
41140-53 = "Девушке иногда приходится делать то, что приходится, понятненько?"
41140-54 = "Я потратила свои личные деньги, а не бюджет SRT! И это было в личных целях!"
41140-55 = "[s] «Утверждение про личные цели делает всю ситуацию ещё подозрительнее...»"
41140-56 = "На самом деле, я позвонила не для того, чтобы что-то купить."
41140-57 = "Я надеялась кое-что продать."
41140-58 = "Продать? Ну, мы обычно не занимаемся закупками через наш отдел продаж."
41140-59 = "Но у наших VIP-клиентов есть особые привилегии! Что именно Вы хотели продать?"
41140-60 = "Надеюсь, ты готов, а не то у тебя микросхемы перегорят! У меня есть куча ультрасовременного снаряжения, которое ты больше нигде не сможешь найти."
41140-61 = "Зенитные ракеты с инфракрасным наведением, кассетные гранаты, управляемые противотанковые ракеты…"
41140-62 = "Впечатляющий список редкого оружия! Вы уверены, что готовы его продать?"
41140-63 = "Знаю, знаю. Сделка века! Представляешь, как твой босс тебя похвалит? На нём есть совсем небольшая ржавчина, но сам понимаешь, какая у нас тут влажная погода."
41140-64 = "[s] «Она далеко не большая…»"
41140-65 = "(аткнись, Сенсей! Я пытаюсь заключить сделку!)"
41140-66 = "Что ж, подобное узкоспециализированное оборудование всегда пользуется спросом. Это немного не по правилам, но, полагаю…"
41140-67 = "Отлично. Я согласен."
41140-68 = "Банковский счёт, который сохранён у нас в базе, всё ещё актуален для оплаты?"
41140-69 = "Ах, видите ли, у меня тут возникла некоторая путаница с моим счётом."
41140-70 = "Скоро всё разрешится, но до тех пор я надеялась получить оплату оружием и патронами."
41140-71 = "…Оружием? Патронами?"
41140-72 = "Я вроде не заикалась! Я готова отдать зенитные ракеты на кучку обычных пушек. Хороших, конечно же."
41140-73 = "Или, знаете, если у вас есть термобарические гранаты… или гранаты с белым фосфором! *пхы* *пха*"
41140-74 = ""
41140-76 = ""
41140-77 = "Я бы с радостью помог Вам, но, к сожалению, мы совсем недавно распродали все наши запасы."
41140-78 = "Че-е-его-о-о? Все запасы?"
41140-79 = "Да. Один… анонимный покупатель недавно всё у нас выкупил."
41140-80 = "Кто вообще на свете мог купить столько огневой мощи? И зачем?"
41140-81 = "Единственная причина, зачем может понадобиться СТОЛЬКО оружия, - это война!"
41140-82 = "Я… не могу Вам этого сказать."
41140-83 = "Как VIP-клиент Вы должны меня понять. Вы бы тоже очень расстроились, если бы мы разгласили Вашу личную историю покупок, верно?"
41140-84 = "Ну, они уже и так знают про кассетные бомбы… но да, логично…"
41140-85 = "Мне ужасно жаль, но давайте сделаем вид, будто этого разговора вообще не было."
41140-86 = "Искренне надеюсь, что в будущем нас ждут куда более плодотворные сделки!"
41140-87 = ""
41140-89 = ""
41140-90 = ""
41140-91 = "Что вообще… В каком сумасшедшем мире мы живём, раз у Кайзер Индастриз просто… кончилось оружие? Во что превратилось наше общество?"
41140-93 = "Что куда важнее, Мое. Когда и как ты стала VIP-клиентом Кайзер Индастриз?"
41140-94 = "Я ЗНАЛА, что в журнале учёта припасов отряда были расхождения… А вы утверждали, что у меня паранойя…"
41140-95 = "М-Мое… Я не хочу, чтобы ты п-попала в тюрьму!.."
41140-97 = "П-погодите секунду! Вы можете вернуться к вопросу о припасах?"
41140-98 = "Не зацикливайтесь на мелочах!"
41140-99 = "Кайзер Индастриз, может, и подвела меня, но знаете, что никогда не подводит? Аукцион подержанных вещей! Я уже выставила лот, так что просто ждём, когда повалят покупатели!"
41140-100 = "Кто вообще будет покупать всё это безумное снаряжение на каком-то аукционе подержанных вещей?"
41140-101 = "Вы можете быть неотёсанными новичками, но недооценка таких аукционов станет вашей первой и последней ошибкой!"
41140-102 = "Смотрите! Сообщение! Я же говорила, что они не подведут!"
41140-103 = ""
41140-106 = ""
41140-107 = ""
41140-108 = "…Погодите, серьёзно?"
41140-110 = "Следующий эпизод;Маленькая, но неудача"
