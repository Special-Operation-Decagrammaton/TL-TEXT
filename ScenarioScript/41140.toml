[translation]
41140-1 = "Episódio 14;Escambo"
41140-2 = "Moe, você tem alguma boa ideia?"
41140-3 = "M-Mas agora nós não temos nem dinheiro nem conta bancária..."
41140-4 = "...Aliás, quem gastou munição a rodo primeiro foi você, né."
41140-6 = "Não, não, não! Eu já disse que aquele momento precisava daquilo!"
41140-7 = "Enfim, não é porque estamos sem dinheiro que não dá pra reabastecer."
41140-8 = "[s] \"Não me diga que um banco...\""
41140-9 = "Hã? O que você tá falando?"
41140-10 = "A SRT existe para proteger a segurança dos cidadãos. Jamais assaltaríamos um banco."
41140-11 = "Eu não teria uma ideia maluca dessas!"
41140-12 = "O que eu quero dizer é..."
41140-14 = "Simples: escambo!"
41140-15 = "Bem, de certa forma é voltar às origens, um método de negociação bem clássico."
41140-16 = "A gente entrega coisas valiosas que temos e recebe armas e munição em troca!"
41140-18 = "\"Coisas valiosas que temos\"...?"
41140-19 = "...Marmita de yakiniku? Mas já passou da validade..."
41140-20 = "Ninguém vai comprar isso, né. No máximo aquele pessoal da \"Felicidade da Posse\"."
41140-21 = "Não é isso! Tô falando daquele monte de mísseis e bombas."
41140-22 = "Mesmo tendo estragado por ficar debaixo d'água, não significa que perderam todo o valor."
41140-23 = "Parte o meu coração, mas acho que é melhor irem para alguém que possa cuidar melhor deles."
41140-24 = "[s] \"Entendi...?\""
41140-26 = "Mas será que alguém compraria? Por mais que fossem caros originalmente, a maioria está danificada ou enferrujada..."
41140-27 = "Ah, pode deixar essa parte comigo. Eu tenho contatos."
41140-28 = "Por exemplo, deixa eu ver..."
41140-29 = "A \"Kaiser Industries\", que vende armas no mercado negro. Lá sempre tem mercenários procurando armas usadas."
41140-30 = "Com certeza vai ter alguém lá que encontre alguma utilidade até pra esses mísseis enferrujados."
41140-31 = "E, em troca, a gente pega umas armas de qualidade razoável do Grupo Kaiser!"
41140-32 = "Ora, até que foi uma ideia sensata, vindo da Moe."
41140-33 = "Você tá se sentindo bem? Será que aquela marmita de napolitano de ontem te deu intoxicação alimentar?"
41140-34 = "Que saco, viu?!"
41140-38 = "Enfim, vamos ligar pro escritório de vendas."
41140-45 = "Alô, aqui é da \"Kaiser Industries\", fornecedora de armas da mais alta qualidade. Em que posso ajudar?"
41140-46 = "E aí, quanto tempo!"
41140-47 = "Sou eu, eu mesma! A responsável pelos suprimentos da Academia Especial SRT, que já comprou várias coisas com vocês."
41140-48 = "A-A cliente VVIP daquela vez...?!"
41140-49 = "Há quanto tempo!"
41140-50 = "Precisa de novos mísseis desta vez também?"
41140-51 = "Ou houve algum problema com as bombas de fragmentação que comprou anteriormente...?"
41140-52 = "...Moe, quando você fez essas compras?"
41140-53 = "N-Não, calma, não foi com o dinheiro da academia, tá?"
41140-54 = "São só bombas para uso pessoal! Paguei do meu bolso, então sem problemas!"
41140-55 = "[s] \"O que seriam 'bombas para uso pessoal'...?\""
41140-56 = "E-Enfim..."
41140-57 = "Hoje não tô ligando pra comprar, mas sim pra vender."
41140-58 = "Vender... disse? Em princípio, nossa loja não trabalha com compra de usados..."
41140-59 = "Ainda assim, não seria certo recusar sem antes ouvir. Posso perguntar do que se trata?"
41140-60 = "Então, na verdade eu tenho aqui uns equipamentos de ponta que você não encontra em loja de conveniência."
41140-61 = "Mísseis antiaéreos guiados, granadas de fragmentação com potência ajustável, lança-foguetes antitanque por controle remoto..."
41140-62 = "O-O quê... Você realmente pretende vender tudo isso?"
41140-63 = "Sim, bem, estão um pouquinho enferrujados, mas... acho que não tem problema."
41140-64 = "[s] \"...Um pouquinho?\""
41140-65 = "(Sensei, bico calado!!)"
41140-66 = "Sendo itens tão especiais, certamente não faltará demanda..."
41140-67 = "Sim, teremos o maior prazer em aceitar."
41140-68 = "A propósito, podemos fazer o pagamento via transferência para a mesma conta de antes?"
41140-69 = "Ah, na verdade essa conta meio que parou de funcionar..."
41140-70 = "Em vez de dinheiro, que tal pagar em mercadoria?"
41140-71 = "Em mercadoria... como assim?"
41140-72 = "Pode ser coisa mais barata mesmo, eu só quero armas com bastante poder destrutivo."
41140-73 = "Tipo bombas termobáricas, munição de fósforo branco... ah, ah...!"
41140-77 = "N-Na verdade, peço mil desculpas, mas... no momento estamos completamente sem estoque de armas..."
41140-78 = "...Quê? Mas vocês sempre têm um montão! Tudo acabou?"
41140-79 = "Sim... na verdade, há alguns dias, um cliente anônimo comprou absolutamente tudo."
41140-80 = "O quê... Estão planejando começar uma guerra em Kivotos?"
41140-81 = "Quem compraria uma quantidade dessas...?"
41140-82 = "Infelizmente, isso eu realmente não posso revelar..."
41140-83 = "Peço desculpas, mas trata-se de uma informação confidencial dos nossos clientes..."
41140-84 = "B-Bom, faz sentido..."
41140-85 = "Sendo assim, lamento muito, mas teremos que cancelar esta negociação..."
41140-86 = "Se precisar de mais alguma coisa, pode entrar em contato a qualquer momento!"
41140-91 = "Q-Que situação sem pé nem cabeça é essa... Pior, nosso plano foi por água abaixo..."
41140-93 = "A propósito, Moe, desde quando você virou cliente VVIP da Kaiser Industries?"
41140-94 = "Pensando bem, havia vários valores pequenos que não batiam nas contas... Não me diga que..."
41140-95 = "Moe-chan... presa por desvio de verba...?"
41140-97 = "N-Não é hora pra falar disso agora, né?!"
41140-98 = "Por enquanto, o mais importante é conseguir suprimentos...!"
41140-99 = "B-Bom, a \"Kaiser Industries\" não é meu único contato! Em leilões de usados, com certeza vai ter um monte de compradores!"
41140-100 = "Tem alguém que se daria ao trabalho de comprar esse tipo de coisa em leilão?"
41140-101 = "Não subestime! Nos leilões de hoje em dia, você encontra de tudo: armas, munição, equipamento de invasão e até uns legumes!"
41140-102 = "Aposto que agora mesmo já vai chegar uma mensagem pedindo pra comprar nossas bombas—"
41140-108 = "...Nossa, chegou mesmo."
41140-110 = "Próximo;Uma Pequena e Certa Derrota"
