10053130-14 = ""
10053130-15 = "Что там за шум?"
10053130-16 = "Эм... Они сказали, что хотят сдаться властям."
10053130-17 = "«Сдаться властям»? Очень правдоподобно..."
10053130-18 = "Ну, похоже, у них был «разговор» с заместителем директора Конохой."
10053130-19 = ""
10053130-21 = ""
10053130-22 = ""
10053130-23 = "Мы решили измениться!"
10053130-24 = "Честно говоря, мы просто больше никогда не хотим сталкиваться с таким монстром, как она..."
10053130-25 = ""
10053130-27 = ""
10053130-28 = ""
10053130-29 = "...Коноха? Я думала, она в отпуске."
10053130-30 = "Ну, уверена, она знает, что делает."
10053130-31 = "Временно задержите этих студентов, допросите их, проверьте показания и действуйте по обстоятельствам."
10053130-32 = "Поняла!"
10053130-33 = ""
10053130-35 = ""
10053130-36 = "А? Я думала, директор Канна любит сама проводить допросы?"
10053130-37 = "Она встречается с важным гостем."
10053130-38 = "С важным гостем? С кем?"
10053130-40 = ""
10053130-41 = ""
10053130-42 = ""
10053130-43 = "...Прошу прощения за шум."
10053130-44 = ""
10053130-45 = "Вообще-то я впечатлена такой преданностью делу. Хи-хи... Эмблема Бюро общественной безопасности, гордость Валькирии..."
10053130-46 = "Ваш заместитель директора остаётся усердной даже в отпуске. Хи-хи."
10053130-47 = "Вы нас смущаете."
10053130-48 = "Мы ничем не лучше остальных. Каждый отдел Валькирии завален работой по уши."
10053130-49 = "Хотя, похоже, Исправительному бюро приходится тяжелее всех. Вы разбираетесь со всем отребьем, с которым больше никто не справляется."
10053130-50 = "Но не стану слишком вам льстить, директор. Не хочу ставить вас в неловкое положение."
10053130-51 = ""
10053130-53 = ""
10053130-54 = ""
10053130-55 = ""
10053130-56 = "Хи-хи... Жаль, что не все думают так же, как вы, директор Канна."
10053130-57 = "Ведь если бы все так высоко ценили Исправительное бюро..."
10053130-58 = ""
10053130-60 = ""
10053130-61 = ""
10053130-62 = "Полагаю, у нас было бы чуточку больше работы, хи-хи..."
