[translation]
1000505-1 = "Тусклый свет"
1000505-2 = "Она не только сама излучает свет, но ещё и использует его для защиты. Разве не интересно?"
1000505-3 = "Можно подумать, что единственный источник света в тёмном море привлечёт хищников, но если так светится целая стая, это, наоборот, может их отпугнуть."
1000505-4 = "Как думаете, как это выглядит? Наверняка потрясающе."
1000505-5 = "[s1] «Скажи, что ты позвонила не только ради разговора о рыбе.»\n[s2] «Так... я могу чем-нибудь помочь?»"
1000505-6 = "Хех! Не торопитесь так, Сенсей."
1000505-7 = "Хех! Не торопитесь так, Сенсей."
1000505-8 = "Это в вас говорит дух охотника за сокровищами? Хороший знак."
1000505-9 = "У школы Абидос богатая история, поэтому искать все её скрытые тайны очень весело!"
1000505-10 = "В прошлый раз мы осмотрели склад, а сегодня пойдём в старое школьное здание!"
1000505-13 = "Старое школьное здание Абидоса 3"
1000505-14 = "*кхе* *кхе* И здесь бы хорошенько убрать пыль."
1000505-15 = "Повсюду столько хлама. Похоже, большую часть просто свалили сюда, так что вряд ли мы найдём что-нибудь полезное."
1000505-16 = "Осторожнее, Сенсей. Здесь очень легко споткнуться и упасть."
1000505-17 = "[s3] «Может, вернёмся днём?»\n[s4] «Здесь жутко...»"
1000505-18 = "Хех. Но ночью поиски сокровищ романтичнее, не думаете? И, что ещё лучше, в такой час нас никто не поймает."
1000505-19 = "Что такое, Сенсей? Страшно?"
1000505-20 = "Хватит всё усложнять. Идите прямо за мной, хорошо? Не отходите."
1000505-21 = "Готовы идти глубже?"
1000505-22 = "Обязательно забирайте всё хорошее, что найдёте. Кто нашёл — того и добыча. Таков закон мира охотников за сокровищами."
1000505-25 = "Хм. Мы уже давно ищем, но ничего хорошего мне так и не попалось..."
1000505-26 = "Наверное, всё ценное уже забрали."
1000505-27 = ""
1000505-28 = ""
1000505-29 = "(открывает дверь)"
1000505-30 = ""
1000505-32 = "Этим зданием пользовались студенты ещё до моего времени, поэтому я мало о нём знаю..."
1000505-33 = "*шорох*"
1000505-34 = "Хм?"
1000505-35 = "Вы что-то слышали?"
1000505-36 = "Вон оттуда..."
1000505-37 = "А-А-а-а?!"
1000505-38 = ""
1000505-39 = "*туп*"
1000505-40 = "*писк* *писк*"
1000505-41 = "..."
1000505-42 = "У-Ух... Я думала, сердце сейчас выпрыгнет из груди."
1000505-43 = "(встаёт) Эта мышь чуть меня до смерти не напугала."
1000505-44 = "Она свалила целую кучу хлама."
1000505-45 = "[s] «...»"
1000505-46 = "..."
1000505-47 = "Хм. О чём вы думаете, Сенсей? Чего так ухмыляетесь?"
1000505-48 = "Хотите поддразнить меня и сказать что-нибудь вроде: «Никогда раньше не слышал, чтобы ты так пугалась, Хошино», да?"
1000505-49 = "Кто бы не испугался в такой ситуации?"
1000505-50 = "Ну, раз вас это веселит, то ладно... А?"
1000505-51 = ""
1000505-52 = "Смотрите, Сенсей. Из той развалившейся кучи что-то светится."
1000505-53 = "[s] Поднять бумагу, испускающую тусклый свет."
1000505-54 = ""
1000505-55 = "Это... светящаяся в темноте наклейка?"
1000505-56 = "О, смотрите! Это наклейки с рыбами!"
1000505-57 = "Это тропическая рыба... А это ракушка... Тут ещё кальмар, рыба-луна... и медуза! Хи-хи."
1000505-58 = "Вот это я понимаю, Сенсей! Вы сорвали джекпот охотника за сокровищами!"
1000505-59 = "[s] «Наверное, они так тускло светятся из-за возраста...»"
1000505-60 = "Разве не здорово об этом думать? Не могу объяснить почему..."
1000505-61 = "...но будто они всё это время светились вот так, даже когда никто не смотрел."
1000505-62 = "[s5] «Можешь забрать их, Хошино.»\n[s6] «Считай это подарком.»"
1000505-63 = "А? Вы отдаёте их мне?"
1000505-64 = "А? Вы отдаёте их мне?"
1000505-65 = "Но ведь нашли их вы... А кто нашёл — того и добыча. Таковы правила охоты за сокровищами..."
1000505-66 = "[s] Передать их ей."
1000505-67 = ""
1000505-68 = ""
1000505-69 = "О... Ух ты. С-Спасибо, Сенсей."
1000505-70 = ""
1000505-71 = ""
1000505-72 = "Хех..."
1000505-73 = "Разве они не милейшие?"
1000505-74 = "Я наклею их на потолок! Тогда смогу смотреть на них, когда буду лежать ночью в кровати."
1000505-75 = "Хех. Пойдёмте, Сенсей."
1000505-77 = "Я ушёл вместе с воодушевлённой Хошино."
