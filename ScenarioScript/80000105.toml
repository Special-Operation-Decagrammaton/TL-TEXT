[translation]
80000105-1 = "Разные впечатления"
80000105-3 = "...Ага. Нашла."
80000105-4 = ""
80000105-6 = ""
80000105-7 = "Я искала вас, Сенсей. И вот вы здесь..."
80000105-8 = "...Хм?"
80000105-9 = "Нет, ничего серьёзного. Важного — да, но не серьёзного."
80000105-10 = "...Нет смысла тянуть, так что сразу к делу."
80000105-11 = ""
80000105-13 = ""
80000105-14 = ""
80000105-15 = ""
80000105-16 = ""
80000105-17 = ""
80000105-19 = "[ns1] «...Это шоколад?»\n[ns2] «Тогда он ко Дню святого Валентина?»"
80000105-22 = "...Как я и думала, вы такого не ожидали."
80000105-23 = "Послушайте, я прекрасно представляю, какое впечатление у вас обо мне сложилось."
80000105-24 = "Поэтому я хотела воспользоваться сегодняшним днём, чтобы, так сказать, растопить лёд."
80000105-25 = "У меня накопилось много причин быть вам благодарной..."
80000105-26 = "И если говорить лично о себе..."
80000105-27 = "Если говорить лично о себе... Я не стараюсь относиться к вам настороженно. И вы мне даже не неприятны..."
80000105-28 = ""
80000105-30 = ""
80000105-31 = "...Я заболталась. Пожалуйста, забудьте всё, что я только что сказала."
80000105-32 = "Всё это — чтобы улучшить ваше впечатление обо мне. Я вложила много сил, и всё будет бессмысленно, если это вас не порадует."
80000105-33 = "Надеюсь, вам понравится."
80000105-34 = "[s3] «Конечно! Шоколад меня очень радует!»\n[s4] «Ух ты! Шоколад Аой ко Дню святого Валентина!!»"
80000105-37 = ""
80000105-39 = ""
80000105-40 = "Не обязательно отвечать так быстро..."
80000105-41 = "...Хм? Хотите в благодарность угостить меня кофе?"
80000105-42 = "У меня нет причин отказываться, но... интересно... Вы так быстро меня пригласили..."
80000105-43 = "Откуда вы вообще знаете, вкусный ли мой шоколад? Вы его даже не открыли."
80000105-44 = "Между нами всё ещё ощущается такая дистанция..."
80000105-45 = "[s5] «...А? Какая дистанция?»\n[s6] «Я и не знал, что ты так себя чувствовала...»"
80000105-48 = "...?"
80000105-49 = "Хм..."
80000105-50 = "Э-э..."
80000105-51 = "*фух*"
80000105-52 = "Вот, значит, как... Хотя... Сенсей..."
80000105-53 = "Никогда не думала, что вы такой человек..."
80000105-54 = "[s7] «Аой? Ты в порядке?»\n[s8] «Что-то случилось?»"
80000105-57 = "..."
80000105-58 = "Если честно... Такое чувство, будто меня немного провели."
80000105-59 = "...Хм?"
80000105-60 = "Если меня что-то беспокоит, просто спросить? Вы готовы выслушать любого и в любое время?"
80000105-61 = ""
80000105-63 = ""
80000105-64 = ""
80000105-65 = "...Теперь понятно."
80000105-66 = "Проблема никогда не была во мне. Проблема — в вас."
80000105-67 = "[s] «...А?»"
80000105-68 = ""
80000105-70 = ""
80000105-71 = ""
80000105-72 = "П-Простите. Ничего. Просто мысли вслух. Если позволите, мне нужно заняться другими делами..."
80000105-73 = ""
80000105-75 = ""
80000105-76 = ""
80000105-77 = ""
80000105-79 = "Почему-то Аой ещё немного пробормотала что-то себе под нос, а затем поспешно ушла."
80000105-80 = ""
80000105-84 = "...Как бы то ни было, её шоколад был невероятно вкусным."
