[translation]
2002105-1 = "В ожидании Санты"
2002105-2 = "Добро пожаловать, Сенсей!"
2002105-3 = "Хи-хи. Вы впервые у меня в комнате."
2002105-4 = "Здесь не бог весть что, но располагайтесь поудобнее."
2002105-7 = "― Вот так... я готовлюсь[wa:980]"
2002105-9 = "― к приходу Санта-Клауса![wa:340]"
2002105-12 = "― Я как следует растопила камин,[wa:10]"
2002105-14 = "― чтобы Санте не было холодно...[wa:10]"
2002105-17 = "― И украсила ёлку множеством красивых игрушек.[wa:10]"
2002105-20 = "― Так я как бы говорю:[wa:520]"
2002105-22 = "― «Санта, я тебя ждала!»"
2002105-25 = "― А потом"
2002105-27 = "― он оставит мне маленький подарок в чулке![wa:630]"
2002105-30 = "― Но в этом году...[wa:620]"
2002105-33 = "― я всё переверну и сама отблагодарю Санту![wa:210]"
2002105-36 = "― Хи-хи-хи. Что скажете?[wa:200]"
2002105-38 = "― Домашнее печенье и свежее молоко![wa:520]"
2002105-41 = "Санта-Клаус ведь очень много работает на Рождество."
2002105-42 = "Я всегда только получала от него подарки и ничего не давала взамен..."
2002105-43 = "Поэтому в этом году я хочу отплатить ему добром!"
2002105-44 = "Думаю, Санта будет рад!"
2002105-46 = "Я оставался с Ханаэ, пока она не закончила делать свой чулок."
2002105-47 = "Закончив, она устала и уснула на диване."
2002105-48 = "Хр-р-р... В этом году... Санта, пожалуйста, сделай так... чтобы никто не пострадал..."
2002105-49 = "Если это невозможно... пожалуйста, подари мне мощное дезинфицирующее средство..."
2002105-50 = "[ns] Осторожно съесть печенье, запивая молоком."
2002105-52 = "[ns] Выйти купить подарок для Ханаэ."
2002105-54 = "Найти именно такое дезинфицирующее средство, какое она хотела, оказалось сложнее, чем я думал..."
