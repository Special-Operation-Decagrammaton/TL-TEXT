212170-334 = ""
212170-335 = "Vocês duas......"
212170-336 = "Vocês foram gigantescas. Deixem com a gente e descansem."
212170-337 = "Sim......"
212170-338 = "Se as duas estão aqui, quer dizer que――"
212170-339 = "Exatamente! A missão na rádio tá a todo vapor!"
212170-340 = "Que alívio imenso...... graças a Deus."
212170-341 = ""
212170-343 = ""
212170-346 = ""
212170-347 = "......Makoto-senpai."
212170-348 = "......Iroha. Eu tinha a sincera esperança de que você não aparecesse por aqui."
