212170-18 = ""
212170-20 = ""
212170-23 = "Kwahaha...... Vocês até que lutaram com alguma dignidade, mas a brincadeira acaba por aqui."
212170-24 = "Shiromi Iori, Hinomiya Chinatsu. Achavam mesmo que derrubariam Gehenna com esse punhado ridículo de combatentes?"
212170-25 = "Ouvi dizer que a grande Sorasaki Hina tinha um carinho e uma consideração especiais por vocês duas."
212170-26 = "Por que tomaram um caminho tão insano?#nHavia algo tão valioso assim que justificasse desfraldar a bandeira da traição?"
212170-27 = ""
212170-29 = ""
212170-30 = ""
212170-31 = "......É óbvio que sim! A gente tinha que enfiar a verdade na cabeça oca de vocês nem que fosse na bala!"
212170-32 = "......"
212170-33 = ""
212170-35 = ""
212170-36 = ""
212170-37 = "Makoto, deixe que eu cuido disso."
212170-38 = "......Humph. Quem semeia os ventos que colha as tempestades, como diz o ditado."
212170-39 = ""
212170-41 = ""
212170-42 = "......Iori, Chinatsu."
212170-43 = "Presidente Hina......"
212170-44 = ""
212170-46 = ""
212170-47 = "......Eu dei um aviso formal a vocês."
212170-48 = "Disse com todas as letras para não perturbarem a união sagrada de Gehenna."
212170-49 = "A união de Gehenna......?"
212170-50 = "E o que diabos significa essa sua 'união de Gehenna', Presidente?!"
212170-51 = "......"
212170-52 = "Significa todas marcharem como um só corpo por um objetivo comum. Obedecer à ordem militar.#nCerrar fileiras no mesmo ideal supremo de unificar Kivotos."
212170-53 = "Apenas isso. É algo extremamente simples."
212170-54 = "Hah......"
212170-55 = ""
212170-57 = ""
212170-58 = ""
212170-59 = ""
212170-60 = "Não, Presidente. Não tem nada de simples nisso aí.#nNem pra você, nem pra nós."
212170-61 = "Uma coisa dessas NUNCA deveria ser tratada como algo simples!"
212170-62 = ""
212170-64 = ""
212170-65 = ""
212170-66 = "Desistam. Com esses ferimentos, seus corpos não aguentam mais sustentar o combate."
212170-67 = "......Presidente, você ainda se lembra?#nDo dia em que fui até a sua sala pedir pra entrar no Comitê de Disciplina?"
212170-68 = "......Sim. Eu me lembro."
212170-69 = "Eu achava que esse clima anárquico e livre era o maior charme de Gehenna.#nMas no fundo, aquilo também me apavorava."
212170-70 = "Porque se todo mundo só pensasse em si mesma...... sentia que no fim não restaria nada de pé."
212170-71 = "E foi bem naquele momento que eu vi você."
212170-72 = ""
212170-73 = "No meio daquele campo de batalha ensurdecedor onde dezenas se matavam, você estava lá, de pé, em silêncio, traçando uma linha firme que ninguém ousava cruzar."
212170-74 = ""
212170-75 = "......"
212170-76 = "Vendo as suas costas inabaláveis, eu decidi que queria ser alguém capaz de guardar aquela linha junto com você...... Foi por isso que entrei na Disciplina!"
212170-77 = ""
212170-79 = ""
212170-80 = ""
212170-81 = "Eu sinto exatamente o mesmo.#nFoi porque a senhora traçou aquela linha inegociável que a liberdade de Gehenna pôde respirar."
212170-82 = "A guardiã da ordem mínima indispensável para que todas vivessem em paz sempre foi a senhora, Presidente!"
212170-83 = "Mas a estrada tenebrosa por onde a senhora marcha agora não tem nada a ver com aquela época!"
