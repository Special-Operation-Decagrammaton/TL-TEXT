212170-283 = "Muito bem, Sensei."
212170-284 = "O Departamento de Fontes Termais manterá guarda tática na retaguarda."
212170-285 = "Aquele lado ali tem uma incompatibilidade histórica terrível comigo, sabe como é."
212170-286 = "Ainda mais agora que estão em modo bélico frenético, temo que a minha dinamite cause estragos demais."
212170-287 = "Pode deixar com a gente! Daqui em diante eu assumo a escolta do Sensei com honra!"
212170-288 = "Se precisarem de suporte explosivo, não façam cerimônia: basta um assobio que broto do chão."
212170-289 = "Sim! Agradecemos imensamente pela colaboração fantástica!!"
212170-290 = ""
212170-292 = ""
212170-293 = "[ns] \"Graças a você conseguimos virar o jogo, Kasumi.\""
