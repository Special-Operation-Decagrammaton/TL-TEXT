212170-355 = "......Kwahaha, compreendo. Então é isso."
212170-356 = "Ahaha...... Ahahaha! AHAHAHAHAHA!!"
212170-357 = ""
212170-359 = ""
212170-360 = "Essa voz......"
212170-365 = ""
212170-366 = "Finalmente todos os atores estão em seus devidos lugares no palco."
212170-367 = ""
212170-368 = "Shoko......"
212170-369 = "Shoko-chan, do que você tá falando?!"
212170-370 = ""
212170-372 = ""
212170-374 = ""
212170-375 = "Refiro-me ao grandioso clímax."
212170-376 = "A ordem suprema já fora erigida de forma imutável.#nVer vocês rastejando até aqui tentando balançar seus alicerces...... é deveras patético."
212170-377 = ""
212170-379 = ""
212170-380 = "――Bando de vira-latas perdedoras."
212170-381 = "O que você tá querendo insinuar?"
212170-382 = "Essa rebeldia insignificante de vocês sequer será mencionada nas notas de rodapé da História."
212170-383 = "Tudo terminará como um espasmo fútil e sem sentido.#nPorque...... a História é sempre escrita pelo ponto de vista dos vencedores."
212170-384 = "......Sim. Apenas os triunfantes sobrevivem para contar o que houve."
212170-385 = "E neste instante, uma nova...... não, a LEGÍTIMA História está sendo cravada na pedra:"
212170-386 = "Que a ideologia e os valores DELA estavam certos o tempo todo!#n......O mundo enfim se curvará para glorificar a vontade suprema daquela mulher!"
212170-387 = "Dela......? De quem você tá falando afinal de contas?!"
