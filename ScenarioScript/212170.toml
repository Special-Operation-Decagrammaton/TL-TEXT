212170-140 = ""
212170-142 = ""
212170-143 = "Presidente Hina, lembre-se, por favor! Lembre-se do juramento que você fez ao seu próprio coração!"
212170-144 = "Urgh......!"
212170-145 = ""
212170-147 = ""
212170-148 = ""
212170-149 = "......Iori, Chinatsu. Por que essa teimosia cega até o fim?#nVocês mal conseguem ficar de pé......"
212170-150 = ""
212170-152 = ""
212170-153 = "Ako-chan......!"
212170-154 = "Ufa...... Parem com isso, pelo bem de vocês e da Presidente."
212170-155 = "Como assim......?"
212170-156 = "Parem de atormentar o coração da Presidente Hina."
212170-157 = "Vocês sabem muito bem, não sabem?#nQuem mais sangrou para proteger essa tal 'linha' que vocês tanto pregam foi a Presidente."
212170-158 = "Vocês viram a exaustão dela, viram as noites em que ela desmoronava em agonia......#nE agora, finalmente, a Presidente encontrou a paz de espírito!"
212170-159 = "Ninguém mais em Gehenna causa tormento a ela, tudo flui em perfeita harmonia militar......#nPor que vocês querem forçá-la a voltar àquele inferno de dor?!"
212170-160 = "Não estamos forçando nada!#nE essa loucura que tomou conta de Gehenna não é paz e nem ordem coisa nenhuma!"
212170-161 = "Pouco me importa o nome que dão a isso.#nTudo o que eu quero neste mundo é ver a Presidente Hina feliz e tranquila."
212170-162 = "E isso só é possível tendo um inimigo comum do lado de fora."
212170-163 = "Para que Gehenna permaneça unida, precisamos de um alvo para canalizar todo o rancor.#nO mundo lá fora...... Kivotos inteira."
