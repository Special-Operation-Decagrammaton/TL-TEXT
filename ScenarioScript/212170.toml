[translation]
212170-1 = "Эпизод 17;Операция «Возвращение Геенны», часть 2"
212170-4 = ""
212170-5 = "..."
212170-6 = ""
212170-7 = "...П-председатель Макото...?!"
212170-8 = ""
212170-10 = ""
212170-13 = "Ц-ц!!!"
212170-14 = ""
212170-17 = "Иори...!!!"
212170-18 = ""
212170-20 = ""
212170-23 = "Кихе... Вы далеко зашли, но дальше ни шагу."
212170-24 = "Широми Иори. Хиномия Чинацу. Вы и правда решили свергнуть власть Геенны столь жалкими силами?"
212170-25 = "Насколько мне известно, Сорасаки Хина когда-то очень дорожила вами обеими."
212170-26 = "Так зачем же такая жестокость? Ради чего предательство, ради чего мятеж?"
212170-27 = ""
212170-29 = ""
212170-30 = ""
212170-31 = "...Чтобы донести свою мысль."
212170-32 = "..."
212170-33 = ""
212170-35 = ""
212170-36 = ""
212170-37 = "Позволь мне с ними поговорить, Макото."
212170-38 = "...Хмф. Что ж, некоторым приходится самим убирать оставленный ими мусор."
212170-39 = ""
212170-41 = ""
212170-42 = "Иори, Чинацу..."
212170-43 = "Глава Префектуры..."
212170-44 = ""
212170-46 = ""
212170-47 = "...Я предупреждала вас."
212170-48 = "Предупреждала не делать ничего, что подрывает славное единство Геенны."
212170-49 = "Единство Геенны...?"
212170-50 = "Глава Префектуры... Что для вас означает «единство Геенны»?"
212170-51 = "..."
212170-52 = "Все идут к одной цели. Соблюдают порядок. Объединяются единой волей и разумом ради окончательного завоевания."
212170-53 = "Вот и всё. Это предельно легко понять. И исполнить."
212170-54 = "Ха-ха..."
212170-55 = ""
212170-57 = ""
212170-58 = ""
212170-59 = ""
212170-60 = "Нет, глава Префектуры. Это совсем не «легко». Ни для вас, ни для нас."
212170-61 = "Ничто из этого никогда не было лёгким."
212170-62 = ""
212170-64 = ""
212170-65 = ""
212170-66 = "...Сдавайтесь. В таком состоянии вы больше не можете сражаться."
212170-67 = "...Глава Префектуры. Вы помните день, когда я пришла к вам и сказала, что хочу вступить в Префектуру?"
212170-68 = "...Помню."
212170-69 = "Раньше свободолюбивая атмосфера Геенны казалась мне очаровательной. Но одновременно мне было страшно. Очень."
212170-70 = "Я думала, что если каждый будет делать всё, что ему вздумается, в итоге не останется ничего стоящего."
212170-71 = "И тогда я увидела вас, глава Префектуры."
212170-72 = ""
212170-73 = "Посреди хаоса, когда все творили что хотели, я увидела, как вы молча провели черту и объявили, что переступать её нельзя."
212170-74 = ""
212170-75 = "..."
212170-76 = "Я вступила в Префектуру, потому что увидела вас... настоящую вас, и восхитилась вами."
212170-77 = ""
212170-79 = ""
212170-80 = ""
212170-81 = "Вы вдохновили и меня. Свобода Геенны сохранялась именно благодаря той черте, которую вы провели, глава Префектуры."
212170-82 = "Вместе мы поддерживали порядок дисциплиной и сдерживали собственные прихоти скромностью."
212170-83 = "Но путь, по которому вы сейчас идёте... слишком далеко отклонился от прежнего."
212170-84 = ""
212170-86 = ""
212170-99 = "...Тц...!"
212170-100 = ""
212170-102 = ""
212170-103 = "Глава...!"
212170-105 = ""
212170-106 = ""
212170-107 = ""
212170-108 = ""
212170-109 = ""
212170-111 = ""
212170-113 = ""
212170-114 = ""
212170-115 = ""
212170-116 = ""
212170-117 = ""
212170-118 = ""
212170-127 = ""
212170-128 = ""
212170-131 = ""
212170-132 = ""
212170-133 = "Сюда, Сенсей!"
212170-134 = ""
212170-136 = ""
212170-137 = "[ns] «Чиаки, осторожно!»"
212170-139 = ""
212170-140 = ""
212170-142 = ""
212170-143 = "Глава Префектуры... Вспомните. Вспомните свою клятву. Свою решимость."
212170-144 = "...Ух..."
212170-145 = ""
212170-147 = ""
212170-148 = ""
212170-149 = "...Иори! Чинацу... Вы обязательно должны быть такими упрямыми? Посмотрите, как вы изуродовали форму этими ужасными ранами..."
212170-150 = ""
212170-152 = ""
212170-153 = "Ако...!"
212170-154 = "*вздох* Ради вашего блага и блага главы Префектуры, пожалуйста, прекратите."
212170-155 = "Что...?"
212170-156 = "Сейчас она гораздо счастливее."
212170-157 = "Вы ведь знаете. Хина всегда больше всех старалась «охранять границу», о которой вы без конца твердите."
212170-158 = "Вы сами видели, как она постоянно уставала и выбивалась из сил. А теперь, когда она наконец обрела душевный покой, вы хотите всё разрушить."
212170-159 = "Наконец-то во всём порядок. Согласие. Мир. Зачем вы пытаетесь насильно вернуть всё как было?"
212170-160 = "...Мы ничего не «навязываем». И никакого «порядка» здесь нет."
212170-161 = "Хватит цепляться к словам, Иори. Я лишь хочу жить в мире, где глава Префектуры Хина счастлива. Неужели это запрещено?"
212170-162 = "А для этого нам необходим внешний враг."
212170-163 = "Единой Геенне нужен общий противник, которого можно ненавидеть. Общая ненависть, которая сплотит нас... Да. Остальной Кивотос вполне подойдёт."
212170-174 = ""
212170-175 = ""
212170-176 = ""
212170-177 = ""
212170-178 = ""
212170-180 = ""
212170-181 = ""
212170-182 = ""
212170-183 = ""
212170-186 = ""
212170-187 = ""
212170-188 = ""
212170-189 = ""
212170-191 = ""
212170-197 = ""
212170-198 = "Ако... Тобой манипулируют! Тебя сделали марионеткой. Ты ведь не можешь во всё это верить."
212170-199 = "Не оскорбляй меня, Иори."
212170-200 = "Мы взялись за оружие не потому, что ненавидим вас!"
212170-201 = "Наоборот! Неужели ты не понимаешь?! Мы хотим, чтобы вы были свободны!"
212170-202 = "Мне плевать, если меня изобьют ещё десять или хоть сто раз!!! Я выдержу всё, лишь бы вы вернулись!"
212170-203 = "Глава Префектуры, однажды вы сказали: «Хотя у меня есть сила, я не действую по прихоти»."
212170-204 = "..."
212170-205 = "«Даже имея право давить на других, я знаю, где нужно остановиться»."
212170-206 = "«Именно потому, что я обладаю властью, я знаю, какие границы нельзя переступать»."
212170-207 = "Мы не остановимся, пока не упадём."
212170-208 = ""
212170-210 = ""
212170-211 = "Так мы отплатим вам за всё, чему вы нас научили."
212170-212 = ""
212170-214 = ""
212170-215 = ""
212170-216 = "Ага... Так что мы прямо здесь последуем вашим словам. Ты не права, Хина. Поэтому..."
212170-217 = ""
212170-219 = ""
212170-220 = "Мы проведём черту и перед вами, глава Префектуры, и перед нашими старшекурсниками."
212170-221 = "Хмф, сколько пустых угроз от этих неудачников! Хина, чего ты медлишь?"
212170-222 = "Они нарушили наш порядок! Беспощадно наказать предателей!"
212170-223 = "...Ух, тц... Наказание... Нет, черта... Которую я провела..."
212170-224 = "Глава Префектуры...!!!"
212170-225 = "...Нет. Я, я...!!!"
212170-226 = ""
212170-231 = "Я...!!!"
212170-232 = ""
212170-234 = ""
212170-235 = ""
212170-236 = ""
212170-239 = ""
212170-240 = "Ух...!"
212170-241 = ""
212170-243 = ""
212170-244 = "Иори...!!!"
212170-245 = ""
212170-250 = "Глава Префектуры... Пожалуйста, вернитесь к нам..."
212170-253 = ""
212170-254 = ""
212170-255 = ""
212170-256 = ""
212170-257 = ""
212170-258 = "[ns] «Спасибо, что продержалась, Иори»."
212170-259 = "С-Сенсей..."
212170-260 = "Дурак... Вы опоздали...!!!"
212170-261 = "[s] «Прости. Дальше я сам»."
212170-262 = ""
212170-264 = ""
212170-265 = ""
212170-266 = "Сенсей..."
212170-267 = "...Сенсей. Вам нельзя здесь находиться. Как это произошло?"
212170-269 = ""
212170-270 = ""
212170-272 = ""
212170-273 = ""
212170-276 = ""
212170-277 = ""
212170-278 = ""
212170-279 = ""
212170-282 = ""
212170-283 = "А, Сенсей."
212170-284 = "Ва-ха! Пожалуй, мы останемся и прикроем тыл!"
212170-285 = "...Наши клубы не слишком-то ладят, если понимаете, о чём я."
212170-286 = "Всё стало настолько серьёзно. Честно говоря, я бы только мешалась под ногами."
212170-287 = "Этого более чем достаточно! С этого момента я позабочусь о Сенсее!"
212170-288 = "Если что-нибудь случится, сразу зовите меня. Я мигом прибегу!"
212170-289 = "Поняла! Спасибо за помощь!"
212170-290 = ""
212170-292 = ""
212170-293 = "[ns] «Спасибо, Касуми»."
212170-294 = ""
212170-295 = ""
212170-296 = "...Берегите себя, Сенсей."
212170-297 = ""
212170-298 = "...Похоже, в Геенне всё ещё полно подрывных элементов."
212170-299 = "Видимо, я сама виновата, что не искоренила их раньше."
212170-300 = "[s] «Хина. Ты правда этого хочешь?»"
212170-301 = ""
212170-303 = ""
212170-304 = "..."
212170-305 = "Я уже говорила вам, Сенсей. Я осознала своё предназначение — служить славной Геенне."
212170-306 = ""
212170-308 = ""
212170-309 = "А-а..."
212170-310 = "Вы спрашиваете, почему все считают, что я «странно себя веду»?"
212170-311 = "Почему... Почему это должно иметь значение? Просто смотрите на меня. Признавайте мои заслуги. Поддерживайте меня."
212170-312 = "Глава Префектуры..."
212170-313 = "[s] «...»"
212170-314 = "Яха, какой абсурд!"
212170-315 = ""
212170-317 = ""
212170-318 = "Что ты сказала?"
212170-319 = ""
212170-321 = ""
212170-324 = ""
212170-325 = ""
212170-326 = "Какой идиот станет радостно поддерживать человека, который пытается прыгнуть с обрыва?"
212170-327 = "Мы примчались сюда издалека, а после того, как ты избила своих друзей, тебе больше нечего сказать? Жалкое зрелище."
212170-328 = "Лига наследия Геенны... Хм. А я всё думала, почему вас не видно."
212170-329 = "Уясни одно: мы пришли не потому, что когда-либо тобой восхищались. Наоборот, нас раздражал твой половинчатый подход к дисциплине."
212170-330 = "Но прежняя Сорасаки Хина хотя бы умела заслужить уважение. Она не выпрашивала чужого одобрения."
212170-331 = ""
212170-333 = ""
212170-334 = ""
212170-335 = "Ты..."
212170-336 = "Иори, Чинацу. Передохните. Спасибо, что удержали рубеж."
212170-337 = "М-м..."
212170-338 = "Раз вы двое здесь, значит..."
212170-339 = "Именно!"
212170-340 = "А, да. Какое... облегчение."
212170-341 = ""
212170-343 = ""
212170-346 = ""
212170-347 = "...Макото."
212170-348 = "...Ироха. Я надеялась, что ты не появишься."
212170-349 = "..."
212170-350 = "И ты, Чиаки?"
212170-351 = "Есть..."
212170-352 = ""
212170-354 = ""
212170-355 = "...Кихе. Понятно. Значит, вот как."
212170-356 = "Ха-ха... Ха-ха, ха-ха-ха!"
212170-357 = ""
212170-359 = ""
212170-360 = "Этот голос..."
212170-365 = ""
212170-366 = "Именно. Наконец все действующие лица собрались на сцене."
212170-367 = ""
212170-368 = "Шоуко..."
212170-369 = "О чём ты говоришь, Шоуко?"
212170-370 = ""
212170-372 = ""
212170-374 = ""
212170-375 = "Это значит, что всё готово к кульминации."
212170-376 = "Как жалко смотреть на вас, собравшихся здесь. Какой беспорядок, вы..."
212170-377 = ""
212170-379 = ""
212170-380 = "Неудачники."
212170-381 = "...Ты... Что ты пытаешься сказать?"
212170-382 = "Ваши жалкие потуги даже не попадут на страницы истории."
212170-383 = "Всё было тщетно и бессмысленно. Ведь историю пишут победители. А вы... Нужно ещё раз повторить?"
212170-384 = "...Всё идёт как задумано. В этом мире остаются лишь победители. И рассказывать будут только наши истории."
212170-385 = "И теперь будет написана новая... нет, СЛАВНАЯ история."
212170-386 = "Так мы войдём в мир, где признают её благородное видение, где её идеи и ценности станут законом."
212170-387 = "О ком... ты говоришь?"
212170-388 = ""
212170-390 = ""
212170-391 = "...Ух, только не говори, что..."
212170-392 = ""
212170-394 = ""
212170-395 = ""
212170-396 = ""
212170-397 = "Об Императоре-тиране."
212170-399 = "Следующий эпизод;Когда мы станем пламенем"
