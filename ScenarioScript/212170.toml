[translation]
212170-1 = "Episode 17;Gehenna Reclamation Operation (2)"
212170-5 = "……."
212170-7 = "Ch-Chairman Makoto……!?"
212170-13 = "Ugh!!"
212170-17 = "Iori……!!"
212170-23 = "Kikiki... You put up a decent fight, but this is the end."
212170-24 = "Shiromi Iori, Hinomiya Chinatsu. Did you really think you could overthrow Gehenna with such meager forces?"
212170-25 = "I heard that Sorasaki Hina held you both in high regard."
212170-26 = "Why make such a choice?#nWas there something you wanted to achieve, even at the cost of rebellion?"
212170-31 = "……I suppose so. There are things that simply must be made clear."
212170-32 = "……."
212170-37 = "Makoto, let me handle this."
212170-38 = "……Hmph. I suppose you reap what you sow."
212170-42 = "……Iori, Chinatsu."
212170-43 = "Chairwoman……."
212170-47 = "……I believe I warned you."
212170-48 = "Not to take any further actions that would disrupt Gehenna's unity."
212170-49 = "Gehenna's unity……?"
212170-50 = "What even is this 'Gehenna's unity' you keep talking about, Chairwoman?"
212170-51 = "……."
212170-52 = "It is everyone working toward a single goal. Following the chain of command.#nUniting as one heart toward the ultimate goal: the unification of Kivotos."
212170-53 = "That is all. It is simple."
212170-54 = "Hmph……."
212170-60 = "You're wrong, Chairwoman. It isn't simple at all.#nNot for you, and not for us."
212170-61 = "It shouldn't be something simple."
212170-66 = "Give up. In your condition, you can't fight anymore."
212170-67 = "……Chairwoman, do you remember?#nThe day I came to tell you I wanted to join the Prefect Team."
212170-68 = "……Yes. I remember."
212170-69 = "I used to think Gehenna's charm was its free-spirited atmosphere.#nBut at the same time, it was terrifying."
212170-70 = "If everyone just did whatever they wanted…… I felt like nothing would be left in the end."
212170-71 = "That was when I saw you, Chairwoman."
212170-73 = "In the middle of a chaotic brawl where everyone was running wild, you were the only one standing there, silently drawing a line."
212170-75 = "……."
212170-76 = "Seeing your back, I wanted to be someone who protected that line too…… and that's why I joined the Prefect Team."
212170-81 = "I feel the same way.#nBecause of the line you drew, Chairwoman, Gehenna's freedom was preserved."
212170-82 = "You are the one who maintained the bare minimum of order, Chairwoman."
212170-83 = "But…… the path you are trying to take now is different from back then."
212170-99 = "Ugh……! Ggh……!"
212170-103 = "Chairwoman……!"
212170-133 = "Sensei, over here!"
212170-137 = "[ns] \"Look out!\""
212170-143 = "Chairwoman, please remember! Remember the resolve you swore!"
212170-144 = "Ugh……."
212170-149 = "……Iori, Chinatsu. Why are you being so stubborn?#nYou're already covered in wounds……."
212170-153 = "Ako-chan……!"
212170-154 = "Haa…… For your own sakes, and for the Chairwoman's, please stop."
212170-155 = "Eh……?"
212170-156 = "Please, don't make Chairwoman Hina suffer any more than this."
212170-157 = "You know, don't you?#nThe one who has protected that 'line' you speak of more desperately than anyone else is the Chairwoman."
212170-158 = "You've seen her always exhausted, always suffering…… haven't you?#nThe Chairwoman has finally found peace."
212170-159 = "Not a single person in Gehenna is causing her pain, and everything is flowing in perfect order……#nWhy are you trying to force her back to how she was before?"
212170-160 = "That's not it…… we aren't forcing anything.#nBesides, what's ruling Gehenna right now isn't order."
212170-161 = "It doesn't matter what it is.#nI only wish for a world where Chairwoman Hina can be happy."
212170-162 = "And that can only be achieved if there is an enemy on the outside."
212170-163 = "For Gehenna to unite, it needs someone to hate.#nOutside the academy…… the existence known as Kivotos."
212170-198 = "Ako-chan…… you're being manipulated by ideologies planted in you……."
212170-199 = "That is an insulting thing to say."
212170-200 = "No! I just want to set my seniors free……!"
212170-201 = "We didn't pick up our guns because we hate our seniors!"
212170-202 = "If this is what it takes to save them, I don't care if I get scolded later!!"
212170-203 = "The Chairwoman once said, didn't she? Even with power, one must not act selfishly."
212170-204 = "……."
212170-205 = "Even with power, one must protect the line that needs protecting."
212170-206 = "――It is precisely because we have power that we must protect the line."
212170-207 = "We will not stop until the moment we collapse from exhaustion."
212170-211 = "That is the way of the Prefect Team, to honor your teachings."
212170-216 = "I'll say it as many times as I have to. The current Chairwoman is wrong. That's why――"
212170-220 = "We will redraw the 'line' you taught us, Chairwoman!!"
212170-221 = "Hmph, enough of the losers' babble. Hina, why are you hesitating?"
212170-222 = "Deliver merciless punishment to these rebels who disrupt order!"
212170-223 = "……Ugh, ggh…… Punishment…… No, the line…… What I drew was……."
212170-224 = "Chairwoman……!!"
212170-225 = "……No. I am, I am――!"
212170-231 = "I am……!!!"
212170-240 = "Ugh……!"
212170-244 = "Iori……!!"
212170-250 = "Come back to us, Senior……."
212170-258 = "[ns] \"Iori, you held out well.\""
212170-259 = "Se-Sensei……."
212170-260 = "Idiot, you're too late……!!"
212170-261 = "[s] \"Sorry. Leave the rest to me.\""
212170-266 = "Sensei……."
212170-267 = "You shouldn't be here…… how did you?"
212170-283 = "Ah, Sensei."
212170-284 = "We'll be waiting in the rear."
212170-285 = "I don't really get along with that side, you see."
212170-286 = "Especially when she's in 'serious mode' like this, I don't think I'd be of much use."
212170-287 = "It's alright! I'll take responsibility for getting them there from here!"
212170-288 = "If you need anything, don't hesitate to call. I'll come running immediately."
212170-289 = "Yes! Thank you for your cooperation!!"
212170-293 = "[ns] \"Thanks to Kasumi, we made it.\""
212170-296 = "Well, the climax is still ahead, isn't it? Don't let your guard down."
212170-298 = "……So many agitators were still left."
212170-299 = "Is it my responsibility that they haven't been cleared out yet……."
212170-300 = "[s] \"Hina. Is this what you wanted to do?\""
212170-304 = "……."
212170-305 = "I told you before.#nI've finally realized that I've lived for Gehenna."
212170-309 = "Haa……."
212170-310 = "Why does everyone say I'm wrong?"
212170-311 = "……All I wanted was for them to support me and acknowledge me."
212170-312 = "Chairwoman……."
212170-313 = "[s] \"…….\""
212170-314 = "Pfft, don't make me laugh!"
212170-318 = "What did you say?"
212170-326 = "You're trying to jump off a cliff, and you expect us to support that? That's just stupid."
212170-327 = "Ah, ah, I come running over here, and that's all you have to say while beating up your juniors?#nPfft, that's rich. It's pathetic, honestly."
212170-328 = "The Gehenna Restoration Committee…… no wonder I didn't see you around."
212170-329 = "Don't get the wrong idea. We didn't come this far because we admired you, Senior.#nIf anything, it's the opposite. Your methods were too soft, and it was always frustrating."
212170-330 = "Even so, the Sorasaki Hina from back then had the power to make everyone believe."
212170-335 = "You all……."
212170-336 = "You did well. You two should rest."
212170-337 = "Yeah……."
212170-338 = "The fact that you two are here means――"
212170-339 = "Exactly!"
212170-340 = "Oh, thank goodness……."
212170-347 = "……Makoto-senpai."
212170-348 = "……Iroha. I was hoping you wouldn't show up here."
212170-349 = "……."
212170-350 = "Chiaki, you too?"
212170-351 = "Yeees……."
212170-355 = "……Kishishi, I see. So that's how it is."
212170-356 = "Ahaha…… ahahaha, ahahahaha!!"
212170-360 = "This voice is……."
212170-366 = "The cast is finally all here."
212170-368 = "Shouko……."
212170-369 = "Shouko-chan, what are you talking about?"
212170-375 = "It means we have reached the climax."
212170-376 = "Even though order has already been established.#nTo see you all gathering here to try and shake it now…… how truly pathetic."
212170-380 = "――You losers."
212170-381 = "What are you trying to say?"
212170-382 = "Your trivial struggles won't even be recorded in history."
212170-383 = "They will end as empty, meaningless events.#nBecause…… history is written from the perspective of the victors."
212170-384 = "……Yes, only the victors survive."
212170-385 = "And now, a new…… no, a legitimate history will be carved."
212170-386 = "That her ideology and values were the correct ones.#n……A world that affirms that great will is being born."
212170-387 = "Her……? Who are you talking about?"
212170-391 = "……Don't tell me."
212170-397 = "The Thunder Emperor."
212170-399 = "Next Episode;We Who Become the Flame"