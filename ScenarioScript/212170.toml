212170-198 = "Ako-chan...... você tá sendo manipulada por comandos enfiados na sua mente......"
212170-199 = "Que colocação insolente e desrespeitosa."
212170-200 = "Não é desrespeito! Nós só queremos libertar vocês desse pesadelo......!"
212170-201 = "Se empunhamos nossas armas, não é por ódio às nossas veteranas!"
212170-202 = "Se com isso pudermos salvar vocês, não ligo se me colocarem de castigo depois!!"
212170-203 = "A senhora mesma nos ensinou, Presidente:#nque mesmo detendo o poder absoluto, jamais devemos agir por capricho egoísta."
212170-204 = "......"
212170-205 = "Mesmo com todo o poder nas mãos, guardar a linha ética."
212170-206 = "――Justamente POR TERMOS o poder nas mãos, devemos ser as primeiras a guardar a linha!"
212170-207 = "Nós não recuaremos um milímetro sequer até o nosso último suspiro!"
212170-208 = ""
212170-210 = ""
212170-211 = "É essa―― a forma como o Comitê de Disciplina honra tudo o que a senhora nos ensinou!"
