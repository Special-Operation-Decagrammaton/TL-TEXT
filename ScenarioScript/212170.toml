212170-214 = ""
212170-215 = ""
212170-216 = "Vou repetir quantas vezes forem necessárias: você tá errada, Presidente! Por isso――"
212170-217 = ""
212170-219 = ""
212170-220 = "A linha que você nos ensinou a proteger... nós vamos traçar de volta na sua frente agora mesmo!!"
212170-221 = "Humph, já ouvimos lamúrias de perdedoras o bastante. O que está hesitando, Hina?"
212170-222 = "Aplique a punição sumária e impiedosa a essas traidoras da disciplina!"
212170-223 = "......Argh, urgh...... punição...... não, a linha...... o que eu tracei......"
