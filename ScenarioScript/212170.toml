212170-295 = ""
212170-296 = "Ora, o ápice da batalha ainda está por vir, não está? Não baixem a guarda agora."
212170-297 = ""
212170-298 = "......Então ainda restavam tantas rebeldes organizadas."
212170-299 = "Não ter limpado essa resistência antes foi falha minha......"
212170-300 = "[s] \"Hina. É isso o que o seu coração realmente deseja fazer?\""
212170-301 = ""
212170-303 = ""
212170-304 = "......"
212170-305 = "Eu já lhe disse antes.#nEu finalmente compreendi que toda a minha vida existiu para a grandeza de Gehenna."
212170-306 = ""
212170-308 = ""
212170-309 = "Ufa......"
212170-310 = "Por que todas insistem em me dizer que perdi o juízo?"
212170-311 = "......Bastaria torcerem por mim, bastaria reconhecerem o meu esforço."
212170-312 = "Presidente Hina......"
212170-313 = "[s] \"......\""
212170-314 = "Hahaha, não me faz rir, ô folgada!"
212170-315 = ""
212170-317 = ""
212170-318 = "O que você disse?"
212170-319 = ""
212170-321 = ""
212170-324 = ""
212170-325 = ""
212170-326 = "Você tá prestes a se jogar de um penhasco suicida e ainda quer que a gente bata palma? Tem que ser muito tapada pra apoiar isso!"
212170-327 = "Cheguei aqui correndo e dou de cara com você descendo a lenha nas suas próprias seguidoras e ainda reclamando?#nHahaha, que piada de mau gosto. Dá até vergonha alheia!"
212170-328 = "Comitê de Restauração de Gehenna...... imaginei que estivessem escondidas por aí."
212170-329 = "Não confunde as bolas, querida. A gente nunca foi tiete da sua pose de superioridade.#nMuito pelo contrário: eu sempre achei essa sua Disciplina frouxa e morna pra dedéu."
212170-330 = "Mas pelo menos a Sorasaki Hina daquela época fazia todo mundo acreditar nela."
