[translation]
10033065-2 = "Ай, ай, АЙ!"
10033065-3 = "Мы его убили?!"
10033065-4 = "[ns] «Такова была ваша цель?!»"
10033065-5 = "Ну, несмотря на угрозы Макото..."
10033065-6 = "Оно держится."
10033065-7 = "Придётся забыть о политических соображениях. Во имя Ибуки мы уничтожим эту угрозу, чего бы это ни стоило."
10033065-8 = "Ироха совсем не шутит, когда дело касается Ибуки! Страшно."
10033065-9 = "Нужно обеспечить здесь безопасность Общества Пандемониума. Можешь заняться этим, Пина?"
10033065-10 = "Но что будешь делать ты, Умика?"
10033065-11 = "Я, эм...!"
10033065-12 = ""
10033065-15 = "Ого. Похоже, там какая-то суматоха."
10033065-16 = "Ещё люди?!"
10033065-17 = ""
10033065-20 = "Я привела их к назначенному месту встречи, но что, чёрт возьми, это за штуки?!"
10033065-22 = "Им правда вообще не дают передохнуть, да?"
10033065-23 = "Хахаха! Здесь прямо вечеринка."
10033065-24 = ""
10033065-26 = ""
10033065-28 = "Ик! Вот уж настоящий эффект зловещей долины!"
10033065-29 = ""
10033065-31 = ""
10033065-32 = "Они точно не похожи на остальных призраков, которых мы видели до сих пор."
10033065-34 = "Посмотри. Выглядит как настоящий призрак. Может, это ёкай, раз уж мы в Хяккияко."
10033065-35 = "Лучший способ выяснить — пострелять в него!"
10033065-36 = ""
10033065-39 = ""
10033065-40 = "Чёрт да. Тащите тяжёлое оружие."
10033065-41 = "Мы думаем одинаково! Поехали!"
10033065-42 = ""
10033065-45 = "Вы чё, не слышали, как я ору «ай»?! Господи, что не так с этими психованными мелкими из Геенны? Их вообще ничто не берёт!"
10033065-47 = "Смотри, оно психует. Кто бы мог подумать, что ёкаю можно навредить пулями?"
10033065-49 = "Мало! Надо преподать ему урок."
10033065-50 = "Пока у нас остались патроны — мы не закончили!"
10033065-52 = "Точно! Этот ёкай наверняка местная угроза, пытается околдовывать людей и... делать всякие гадости! Врежьте ему как следует! Хахахаха!"
10033065-53 = "Пир! Вечеринка! Фестиваль!"
10033065-54 = ""
10033065-57 = ""
10033065-58 = "Фестиваль?!"
10033065-59 = "...Фестиваль?"
10033065-60 = "[s] «Точно! Ты ведь не боишься фестиваля, правда, Ибуки?»"
10033065-61 = "!!"
10033065-62 = "Умно... Да, Ибуки. Мы просто празднуем местный фестиваль."
10033065-63 = "Наверняка так и есть! Это фестиваль!"
10033065-64 = "А, теперь понятно, почему не сработало. Фестиваль я загипнотизировать не могу."
10033065-65 = "Раз уж мы здесь, будет жалко не повеселиться, Ибуки!"
10033065-66 = ""
10033065-68 = ""
10033065-70 = "Вы... Вы все чудовища! До мозга костей!"
10033065-71 = "Пока отступаем!"
10033065-72 = ""
10033065-74 = ""
10033065-75 = "Эй! Оно убегает! Блин, мы ещё не все патроны потратили."
10033065-77 = "Не убегай, грязный ёкай! Дерись как демон, которым являешься!"
10033065-78 = "Может, погоню устроим?"
10033065-79 = ""
10033065-81 = ""
10033065-82 = ""
10033065-83 = "Ладно-ладно. Пусть делает что хочет. Чтобы закончить маршрут, идите по этой дорожке."
10033065-84 = "Угх, ну ла-а-адно. А я ещё хотела в него пострелять."
10033065-86 = ""
10033065-87 = ""
10033065-88 = "Если бы не студенты Геенны, мы бы не смогли вернуться к расписанию. Спасибо вам."
10033065-89 = "Хахаха! Мне нравится, как ты думаешь. Это сила Геенны, а значит, если подумать, практически моя сила!"
10033065-90 = "...Я просто рада, что с Ибуки всё хорошо."
10033065-91 = "Да-да! Ибуки очень повеселилась!"
10033065-92 = "Не знаю, имею ли я теперь право это говорить, но надеюсь, вам понравится оставшаяся часть испытания храбрости. Хаха..."
10033065-94 = "Можно фоткаться? Типа, насколько круто было бы сделать селфи с призраком?"
10033065-95 = "Ну, нельзя же просто встретить призрака потому, что тебе захотелось."
10033065-96 = ""
10033065-100 = "Хахаха! Проси — и получишь!"
10033065-101 = "И что мне теперь на это отвечать?"
10033065-102 = "Иди сюда, призрачек! Раз, два, три, сыр!"
10033065-103 = ""
10033065-105 = ""
10033065-108 = ""
10033065-109 = "(...)"
10033065-110 = "(Каким-то чудом нам удалось пережить первый день.)"
10033065-111 = "(Но всё это предприятие едва не закончилось катастрофой.)"
10033065-112 = "(Я правда... достаточно хороша для этого?)"
