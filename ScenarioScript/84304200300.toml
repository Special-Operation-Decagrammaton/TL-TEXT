84304200300-17 = "...Ух."
84304200300-18 = "А, я в порядке. Не ранена. Не нужно беспокоиться."
84304200300-19 = "Плохие новости. Те, кто остался лежать, — мелкая сошка. Все, кто действительно контактировал с нанимателем, сбежали."
84304200300-20 = "Они подготовились лучше, чем мы думали. Кто они вообще такие?"
84304200300-21 = "...Я продолжу расследование."
84304200300-22 = "Я смогу это выяснить. Пока возвращайся, Нэру."
84304200300-23 = "Эй, что такое? Ты вдруг совсем приуныла."
84304200300-24 = "Из-за того, что та мерзкая девчонка сказала по телефону? Ты ведь не принимаешь это близко к сердцу?"
84304200300-25 = "Нет, всё нормально... С этой частью я как раз в порядке."
84304200300-26 = ""
84304200300-28 = ""
84304200300-29 = "...? Правда, именно с этой частью? Что ты имеешь в виду?"
84304200300-30 = "Ну..."
84304200300-31 = "Долго объяснять. Возвращайся, поговорим лично."
84304200300-32 = "...Принято."
