[translation]
2601303-1 = "Цветочное поле беглецов"
2601303-2 = "Получив сообщение Ацуко, я отправился в условленное место."
2601303-4 = "А, Сенсей!"
2601303-5 = ""
2601303-7 = ""
2601303-8 = "[ns] «Папарацци-снимок?!»"
2601303-9 = "Хи-хи. Простите. Я хотела сфотографировать и вас."
2601303-10 = "...Я случайно не поступила грубо?"
2601303-11 = "[s] «Нет, всё нормально. Просто застала меня врасплох.»"
2601303-12 = "Хи-хи. Понятно."
2601303-13 = "А? Вы и были тем объектом, который я хотела снять?"
2601303-14 = "Хи-хи. Вы меня раскрыли. И первый снимок я смогла сделать сразу."
2601303-15 = "Второй объект находится в другом месте. Пойдём, Сенсей?"
2601303-17 = "Вон там, Сенсей."
2601303-18 = "Я обнаружила это место вчера, когда гуляла по фестивалю."
2601303-19 = "Его украсили цветами и сделали «фотозону». Там даже есть стул, на который можно сесть для снимка."
2601303-20 = "...Хотя по сравнению со вчерашним днём цветы выглядят немного увядшими."
2601303-21 = "[s1] «Для таких украшений это естественно.»\n[s2] «Но всё равно красиво.»"
2601303-24 = "Да. Это правда."
2601303-25 = "Сейчас сделаю снимок. Пожалуйста, сядьте на стул, Сенсей."
2601303-26 = "[s] «Разве ты уже не сфотографировала меня?»"
2601303-27 = "Тогда сначала сниму только цветы..."
2601303-28 = "Цветы с пустым стулом тоже смотрятся хорошо."
2601303-29 = ""
2601303-31 = ""
2601303-32 = "Теперь с этой стороны..."
2601303-38 = "Кажется, получился отличный снимок."
2601303-39 = "Теперь—"
2601303-40 = "Вы ещё кто такие?"
2601303-41 = ""
2601303-42 = "Кто разрешил вам здесь фотографировать?"
2601303-43 = "А разве нужно было разрешение?"
2601303-44 = "Ещё бы! Это мы устроили эту фотозону!"
2601303-45 = "[s] «Прошу прощения.»"
2601303-46 = "Хмпф! Одними извинениями не отделаешься!"
2601303-47 = "Говори честно, сколько снимков сделала?!"
2601303-48 = "Около... восьми?"
2601303-49 = "Немало. Ладно, по 10 000 иен за снимок — итого 80 000 иен."
2601303-50 = "А теперь платите."
2601303-51 = ""
2601303-53 = ""
2601303-54 = "Э-Это немного дорого. У меня нет таких денег."
2601303-55 = "[s3] «Да ладно. 10 000 иен за фотографию?»\n[s4] «Это же совершенно неразумно!»"
2601303-58 = "Хмпф. Ничего тут не неразумного."
2601303-59 = "Мы сделали фотозону, значит, мы и назначаем цены. Не вижу проблемы."
2601303-60 = "Вообще-то это вы ведёте себя неразумно, пытаясь фотографировать бесплатно!"
2601303-61 = "Я прошу прощения за то, что сделала, но я действительно не знала. Пожалуйста, простите меня в этот раз? Я не могу заплатить такую сумму..."
2601303-62 = "Ещё чего! Плати!"
2601303-63 = "Иначе больше никогда не ступишь на этот фестиваль! Я уж прослежу!"
2601303-64 = "Как жестоко..."
2601303-65 = ""
2601303-67 = ""
2601303-68 = "Возьмите меня за руку, Сенсей."
2601303-69 = "[s5] «А-А? Вот так?»\n[s6] «Что мы делаем?»"
2601303-72 = "А теперь бежим!"
2601303-73 = ""
2601303-77 = ""
2601303-78 = "*тяжело дышит* *тяжело дышит*..."
2601303-79 = "Присядьте, Сенсей. Я их не вижу, но они могли ещё не прекратить погоню."
2601303-80 = "Если будем держаться ниже, они нас не найдут."
2601303-81 = "[s] «Хорошо, что нам нашлось где спрятаться...»"
2601303-82 = "Да. Не ожидала увидеть такой густой кустарник прямо посреди пляжа."
2601303-83 = "Хм? Сенсей? Это не трава..."
2601303-84 = "...Цветы?"
2601303-85 = ""
2601303-87 = ""
2601303-88 = "Да! Похоже, это те же цветы, которыми была украшена фотозона."
2601303-89 = "[s] «И здесь их намного больше.»"
2601303-90 = "Да. Здесь они очень красиво расцвели."
2601303-91 = "Значит, цветы могут расти и в такой песчаной среде... Я не знала."
2601303-92 = "Вы знаете, как они называются, Сенсей?"
2601303-93 = "Роза морщинистая...? Я узнала что-то новое."
2601303-94 = "[s] «Ацуко, хочешь, я тебя сфотографирую?»"
2601303-95 = "Сфотографируете? Меня?"
2601303-96 = "Раз я раньше сфотографировала вас, теперь моя очередь...?"
2601303-97 = "...Тогда да, пожалуйста. Сфотографируйте меня, Сенсей."
2601303-100 = "― [log=아츠코 수영복]Я сделала много фотографий, но... [/log][wa:1885]"
2601303-102 = "― [log=아츠코 수영복]меня саму так фотографируют впервые.[/log]"
2601303-105 = "― [log=아츠코 수영복]Я немного не уверена, как мне позировать...[/log][wa:880]"
2601303-108 = "― [log=아츠코 수영복]Если я улыбнусь вот так, нормально? [/log][wa:1370]"
2601303-111 = "― [log=아츠코 수영복]Подойти ближе к цветам? Хорошо. [/log][wa:2140]"
2601303-114 = "― [log=아츠코 수영복]Роза морщинистая... Какой приятный аромат.[/log][wa:2120]"
2601303-117 = "― [log=아츠코 수영복]Мы наткнулись на это место случайно, но... благодаря вам я смогла его увидеть, Сенсей.[/log][wa:2790]"
2601303-120 = "― [log=아츠코 수영복]Спасибо, Сенсей. Вы помогли мне создать ещё одно замечательное воспоминание.[/log][wa:1070]"
2601303-123 = "Можно посмотреть фотографию?"
2601303-124 = "Вообще-то... немного неловко смотреть на собственную фотографию."
2601303-125 = ""
2601303-131 = "А?! Клянусь, они бежали сюда! Где они?!"
2601303-132 = "Чёрт. А ведь могли хорошо заработать."
2601303-133 = ""
2601303-139 = "...Мы оторвались. Наверное, они ушли."
2601303-140 = "В следующий раз я буду внимательнее к окружению, когда фотографирую. Не хочу, чтобы такое повторилось."
2601303-141 = "Спасибо. За помощь сегодня."
2601303-142 = "[s] «Я составлю тебе компанию, когда захочешь.»"
2601303-143 = ""
2601303-145 = ""
2601303-146 = "Это было бы замечательно."
2601303-147 = "Благодаря вам сегодня я сохранила прекрасные воспоминания."
2601303-148 = "До встречи, Сенсей."
