[translation]
10039070-1 = "Эпизод 7;Начало старинного Серафима"
10039070-3 = "[log=마리]«Все, пожалуйста, прекратите драться!»[/log]"
10039070-5 = ""
10039070-7 = ""
10039070-8 = "Хм? Кто это сказал...?"
10039070-9 = "Сенсей? Вы тоже здесь?"
10039070-11 = "...Сенсей? Мари...?"
10039070-12 = "Что ты здесь делаешь...?"
10039070-13 = "И... когда у тебя появился мотоцикл?"
10039070-14 = ""
10039070-16 = ""
10039070-17 = ""
10039070-18 = "Послушайте, я только что приехала и не знаю всего, что происходит, но, пожалуйста, не деритесь!"
10039070-19 = "Просто... отойдите на шаг и давайте всё обсудим! Вы, вы, Сенсей, все!"
10039070-20 = "Сегодня особенный день. Карнавал — это не просто развлечения. Он посвящён гармонии и общению."
10039070-21 = "Если мы уберём оружие и поговорим, уверена, сможем понять друг друга."
10039070-22 = "[ns1] «Она права. Давайте уберём оружие.»\n[ns2] «Для начала пусть они объяснят нам, что происходит.»"
10039070-25 = "Э-Эм..."
10039070-26 = "Ситуация довольно сложная. Я не хотела, чтобы именно вы увидели эту сторону... всего происходящего."
10039070-27 = "Боюсь, коротко объяснить не получится, но... вы учитель. Вы заслуживаете знать всё."
10039070-28 = "Для Тринити это очень важный—"
10039070-29 = "Мари!"
10039070-30 = "Я рада, что ты здесь. Я всё равно собиралась просить тебя прийти."
10039070-31 = "..."
10039070-32 = "Хм? Зачем?"
10039070-34 = "..."
10039070-35 = "А...? М-Меня...?"
10039070-36 = "Да, конечно. Мы хотим кое о чём тебя попросить."
10039070-37 = ""
10039070-39 = ""
10039070-40 = ""
10039070-41 = ""
10039070-42 = ""
10039070-43 = "Ах, да!"
10039070-44 = "Думаю, у нас с тобой один и тот же вопрос к ней."
10039070-45 = "Великие умы и правда мыслят одинаково."
10039070-47 = "Одинаково о... чём?"
10039070-48 = "П-Простите, я вообще не понимаю, к чему вы клоните."
10039070-50 = "Хи-хи..."
10039070-51 = "Мы обе долго всё обдумывали и считаем, что это лучший путь вперёд."
10039070-52 = ""
10039070-54 = ""
10039070-55 = "Мари..."
10039070-56 = "Мари..."
10039070-57 = "...не согласишься стать нашей старшей?"
10039070-59 = "*ахает* Что?!"
10039070-60 = "Ну..."
10039070-61 = "[ns3] «Вы хотите, чтобы Мари стала...»\n[ns4] «Вашей старшей?»"
10039070-64 = "Прости нас. Мы настолько сосредоточились на тренировках, что совсем не подумали о твоих чувствах."
10039070-65 = "Всё время, пока ты помогала нам готовиться, ты радовалась этому даже больше, чем мы."
10039070-66 = "Ты подходишь для этого гораздо лучше нас, Мари."
10039070-67 = "Во всех смыслах ты куда больше подходишь на роль идола."
10039070-68 = "После нашей прошлой встречи я изучила вопрос подробнее. И поняла, что на самом деле значит быть идолом."
10039070-69 = "Усердно работать днём и ночью — физически и эмоционально. Постоянно учиться, тренироваться и потеть."
10039070-70 = "Сияющая душа, которая освещает сцену и делает всех счастливыми."
10039070-71 = "Кому из нас это описание подходит лучше, чем тебе?"
10039070-72 = "Ты прирождённый идол..."
10039070-73 = "...если подумать, для нас ты в каком-то смысле уже им стала."
10039070-74 = "Оглядываясь назад, нам следовало заметить это намного, намного раньше."
10039070-75 = "Всё, что мы делали с самого начала, происходило под твоим руководством."
10039070-76 = "И если ты согласишься, думаю, эта роль зажжёт свет и в твоём сердце."
10039070-77 = "Важно, чтобы мы смогли достучаться до других, а не то, кто именно будет нас вести."
10039070-78 = "Кроме того, твои Сёстры и остальные товарищи знают тебя и доверяют тебе."
10039070-79 = "Твоя искренность найдёт в них отклик."
10039070-81 = "П-Подождите, вы хотите сказать..."
10039070-82 = ""
10039070-84 = ""
10039070-85 = ""
10039070-86 = "П-Погодите-погодите-погодите! Вы хотите, чтобы я...?!"
10039070-87 = "Я-Я буду..."
10039070-89 = "Да, именно. Это наше предложение."
10039070-90 = "Верно, Мари. Возможно, мы ошарашили тебя, и если так — прости, но..."
10039070-91 = "Мари..."
10039070-92 = "...ты возглавишь нашу идол-группу?"
10039070-94 = "Все, я..."
10039070-95 = ""
10039070-97 = ""
10039070-98 = ""
10039070-99 = "О боже... Значит..."
10039070-100 = "Значит, вы двое встретились здесь, чтобы..."
10039070-101 = "[ns5] «Выбрать нового лидера.»\n[ns6] «И всё это время речь шла об идол-группе.»"
10039070-104 = "..."
10039070-105 = "Ну да, конечно. ...А вы думали, речь о чём-то другом?"
10039070-106 = "Это очень серьёзный вопрос, Сенсей. Не будет преувеличением сказать, что на кону наши жизни."
10039070-107 = "Понял?"
10039070-108 = "Что случилось? У вас такое выражение лица..."
10039070-109 = "...Ах."
10039070-110 = "Возможно, мы неправильно тебя поняли, Мари. Если ты не хочешь присоединяться..."
10039070-111 = "О!"
10039070-112 = "Мы... ошиблись? Мы просто ещё сильнее давим на тебя?"
10039070-114 = "Н-Нет! Вовсе нет! Это не... Я..."
10039070-115 = "Мне правда всё это понравилось! И если вы позволите мне присоединиться, я буду очень ра—!"
10039070-116 = ""
10039070-118 = ""
10039070-119 = ""
10039070-120 = "Ах, хм... Ч-Что я только что сказала...?"
10039070-121 = "Что бы я ни сказала, эм, наверное, сказала это не так..."
10039070-122 = "*выдыхает* Ну... правда можно просто вот так взять и присоединиться?"
10039070-123 = "Мы поделили вашу песню на две партии, для вас двоих... У меня даже костюма нет..."
10039070-125 = ""
10039070-127 = ""
10039070-128 = ""
10039070-129 = "[ns7] «Об этом можешь не переживать.»\n[ns8] Достать принесённую фотографию."
10039070-133 = "Сенсей?"
10039070-134 = ""
10039070-137 = ""
10039070-139 = "*ахает* Сенсей...?!"
10039070-141 = "Это...!"
10039070-142 = "Это наш Сенсей — всегда всё предусмотрит."
10039070-143 = "Ха, меня беспокоило только то, что у нас мало времени, но вы решили и эту проблему. Спасибо, Сенсей."
10039070-145 = "Н-Но... Но...!"
10039070-146 = "Ахх, о боже..."
10039070-147 = "[ns] «...Мари.»"
10039070-149 = "[ns9] «Как сильно ты заботишься обо всех, так же сильно все заботятся о тебе.»\n[ns10] «Ты можешь честно сказать, чего хочешь.»"
10039070-152 = "Н-Но... Я... Можно мне...?"
10039070-153 = "Тогда... если так..."
10039070-154 = "Эм..."
10039070-155 = "..."
10039070-156 = "Я просто..."
10039070-157 = "...Хорошо... Спасибо... Я согласна!"
10039070-158 = ""
10039070-160 = ""
10039070-161 = "Хи-хи."
10039070-162 = ""
10039070-164 = ""
10039070-165 = ""
10039070-166 = ""
10039070-167 = "[ns11] «Вот она — сила говорить от чистого сердца!»\n[ns12] «Ты справишься.»"
10039070-172 = "Ма-ри! Ма-ри! Ма-ри! Ма-ри!"
10039070-173 = "Э...?! О, х-хватит... Пожалуйста, перестаньте..."
10039070-174 = "Пожалуйста...!!"
10039070-175 = ""
10039070-176 = ""
10039070-177 = "..."
