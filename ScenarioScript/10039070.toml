10039070-186 = "То есть...?"
10039070-187 = "Хм..."
10039070-188 = "...У-Уф!"
10039070-189 = ""
10039070-191 = ""
10039070-192 = "...Хммф! ☆"
10039070-193 = "Мы... здесь только мешаем. Нам лучше уйти."
10039070-194 = "Да, давай пойдём и..."
