[translation]
2001403-1 = "Заблудившийся кролик"
2001403-2 = "Горный перевал в пригороде D.U."
2001403-3 = "Фух, их тут гораздо больше, чем я думала."
2001403-4 = "Ростков фатсии так много. Нужна корзина побольше."
2001403-5 = "Этого хватит минимум на неделю... Хотя, может, даже на месяц!"
2001403-6 = "[s] «Они не испортятся?»"
2001403-7 = "Часть съедим сейчас, а остальное заготовим."
2001403-8 = "Можно засолить их или высушить... Они очень универсальные."
2001403-9 = "[s] «Похоже, тебе очень нравятся ростки фатсии.»"
2001403-10 = "Правда? Ну, думаю, они неплохие."
2001403-11 = "Вообще мне нравится большинство диких овощей и грибов, которые здесь растут."
2001403-12 = "Если припасы когда-нибудь закончатся, обычная растительность может спасти жизнь."
2001403-13 = "Но некоторые растения ядовиты, так что прежде чем что-либо собирать, нужно хорошо разбираться в видах."
2001403-14 = "Это всё часть подготовки к выживанию!"
2001403-15 = "И ещё... эм... Кажется, мы забрели слишком далеко."
2001403-16 = "Вы знаете... где мы?"
2001403-17 = ""
2001403-20 = "[ns] «...Мы заблудились?»"
2001403-21 = "Не волнуйтесь, Сенсей. Я взяла карту и компас!"
2001403-22 = "Немного ориентирования по карте — и я без проблем найду дорогу назад."
2001403-23 = "[s] «Ориентирования по карте?»"
2001403-24 = "Это определение своего положения по карте и изображённым на ней ориентирам. Потом по компасу можно понять, как вернуться домой."
2001403-25 = "Это базовый навык, которым владеет любой студент SRT."
2001403-26 = "Так... Вон та вершина — пик Шираиши..."
2001403-27 = "Хорошо, наши текущие координаты... вычислить угол между координатным севером и магнитным севером..."
2001403-28 = "Должны быть здесь. По карте мы в квадрате Чарли-9."
2001403-29 = "Ближайшая дорога находится в трёх километрах к северу..."
2001403-30 = "Сюда, Сенсей! Не потеряйтесь!"
2001403-31 = ""
2001403-33 = ""
2001403-35 = "Несколько часов спустя..."
2001403-37 = "Мне кажется... мы прошли намного больше трёх километров."
2001403-38 = "Мои расчёты точно не могли быть неправильными. Ничего не понимаю."
2001403-39 = "П-П-Погодите. Это был пик Куроиси, а не Шираиши?"
2001403-40 = "Не могу поверить, что допустила такую глупую ошибку... Простите, Сенсей."
2001403-41 = "Слишком темно, чтобы найти ориентир."
2001403-42 = "Придётся разбить лагерь и ждать рассвета."
2001403-43 = ""
2001403-46 = "Серьёзно? Вы сидите в телефоне, Сенсей? В такой момент?"
2001403-47 = ""
2001403-50 = "[ns] «Я нашёл наше местоположение по GPS.»"
2001403-51 = "...GPS?"
2001403-52 = "Автобусная остановка всего в пятистах метрах к востоку?"
2001403-53 = ""
2001403-55 = ""
2001403-56 = "Вы всё это время знали, где мы? Почему ничего не сказали?"
2001403-57 = "[s1] «Было мило смотреть, как ты так стараешься...»\n[s2] «Я не хотел портить тебе настроение...»"
2001403-58 = "А?"
2001403-59 = "А?"
2001403-60 = "И поэтому мы полдня ходили кругами?"
2001403-61 = "Да что с вами не так? Вы дурак?!"
2001403-63 = "Мы с Саки наконец нашли автобусную остановку и вернулись в Шале."
2001403-64 = "...А собранные ростки фатсии мы в итоге обжарили во фритюре и съели поздним вечером как темпуру."
