901010800230-18 = ""
901010800230-19 = "Aqui é a FOX2. Encontrei alguns arquivos bem interessantes no terminal da doca de expedição."
901010800230-20 = "Um deles é a folha de pagamento dos membros que atuam neste armazém, e o outro é o fluxo de caixa detalhado com a receita e despesas da filial."
901010800230-21 = ""
901010800230-23 = ""
901010800230-24 = "—O livro contábil é o caminho mais rápido para decifrar as verdadeiras intenções de uma organização."
901010800230-25 = "Excelente trabalho, FOX2. Faça uma cópia de segurança dos dados e transfira para o nosso terminal."
901010800230-26 = "Certo, vai ser rapidinho."
901010800230-27 = "FOX2, notou algum registro suspeito nas despesas? Alguma transação que salte aos olhos?"
901010800230-28 = "Humm, nada que pareça contrabando ilícito de cara, mas..."
901010800230-29 = "O que me chama a atenção é que eles vêm cortando gastos drasticamente nos últimos tempos."
901010800230-30 = "Os lanches fornecidos aos capangas foram trocados pelo biscoito mais barato do mercado, e até a munição de reposição periódica eles deixaram de comprar este mês."
901010800230-31 = "Será que ficaram sem grana de repente?"
901010800230-32 = "Não, muito pelo contrário: o saldo em caixa acumulado está bem acima da média dos outros anos."
901010800230-33 = "Eles devem estar guardando dinheiro para algum gasto vultoso planejado."
901010800230-34 = "E mesmo segurando cada tostão, compraram uma montanha de caranguejos sem intenção de comer... Isso tá com um cheiro estranho..."
901010800230-35 = ""
901010800230-37 = ""
901010800230-39 = ""
901010800230-40 = "Aqui é a FOX3."
901010800230-41 = "FOX2, aqueles dois capangas que estavam conversando perto do portão dos fundos, Tango 3 e Tango 4, saíram de seus postos."
901010800230-42 = "Parece que estão indo na direção do escritório. Saia daí agora mesmo!"
901010800230-43 = "Mas a cópia dos dados ainda tá em—"
901010800230-44 = ""
901010800230-46 = ""
901010800230-47 = "FOX2, tem alguém se aproximando da sua porta. Cuidado!"
901010800230-48 = "...!"
901010800230-49 = ""
901010800230-56 = ""
901010800230-57 = "Ué? A porta tá aberta?"
901010800230-58 = ""
901010800230-62 = ""
901010800230-63 = "Quem tá aí?!"
901010800230-64 = ""
901010800230-66 = ""
901010800230-70 = ""
901010800230-71 = "Oie, bom dia! Entrega da FOX EATS!"
901010800230-72 = "...FOX EATS?"
901010800230-73 = "Ah, chefe, é aquele serviço que eu te falei outro dia. Um aplicativo de entrega novo que tá fazendo sucesso pela região."
901010800230-74 = "Deve ser uma das entregadoras deles."
901010800230-75 = "Mas a gente não pediu nada disso! O que uma pessoa de fora tá fazendo bisbilhotando dentro do nosso escritório?!"
901010800230-76 = "Qual é a sua, pirralha? Tá espionando pra outra família rival, é?!"
901010800230-78 = "Ah, é que..."
901010800230-79 = ""
901010800230-81 = ""
901010800230-82 = "Mil desculpas! Eu vim trazer o pedido, mas não tinha ninguém na guarita da entrada..."
901010800230-83 = "Se eu deixasse a comida lá fora, ia estragar tudo com o sereno da noite, então entrei procurando alguém pra entregar em mãos!"
901010800230-84 = "É ruim, hein! A guarda do portão principal te deixou passar batida até aqui?!"
901010800230-85 = "Ué... mas não tinha absolutamente ninguém no portão da frente!"
901010800230-86 = "Droga de vadios... aqueles molengas matando serviço de novo!"
901010800230-87 = "E afinal de contas, quem fez o pedido e o que é isso aí?"
901010800230-88 = "Vejamos... são duas porções de inarizushi!"
901010800230-89 = "Provavelmente alguém pediu pro lanche da madrugada. #nInarizushi é levinho, perfeito pra comer à noite sem pesar no estômago, né?"
901010800230-90 = "Ei! Algum de vocês manés pediu inarizushi por acaso?!"
901010800230-92 = "Sei não, senhor... vou perguntar pro pessoal lá fora..."
901010800230-94 = "Tá, tá bom! Larga esse inarizushi aí em cima da mesa e dá o fora!"
901010800230-95 = "E se entrar aqui de novo sem bater, você vai levar chumbo, entendeu?!"
901010800230-96 = "Sim, senhor! Muito obrigada pela preferência e bom apetite!"
