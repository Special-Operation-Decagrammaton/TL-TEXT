901010800230-8 = ""
901010800230-10 = ""
901010800230-11 = "Это..."
901010800230-12 = ""
901010800230-14 = ""
901010800230-15 = "Фуфу, кажется, я сорвала джекпот."
901010800230-16 = ""
901010800230-18 = ""
901010800230-19 = "FOX 2 на связи. Я нашла данные возле погрузочной зоны, ближайшей к выходу."
901010800230-20 = "Здесь список членов организации, работающих на этом складе. Кроме того, есть отчёт о продажах с денежными потоками этого филиала."
901010800230-21 = ""
901010800230-23 = ""
901010800230-24 = "Лучший способ понять намерения организации — посмотреть её финансовые записи."
901010800230-25 = "Отличная работа, FOX 2. Скопируй данные и отправь нам."
901010800230-26 = "Поняла. Это недолго."
901010800230-27 = "FOX 2, что-нибудь бросается в глаза? Например, подозрительная транзакция?"
901010800230-28 = "Пока ничего..."
901010800230-29 = "Но похоже, они урезают расходы буквально по всем статьям."
901010800230-30 = "Обычные заказы снеков заменили на дешёвые сэмбэй, а в этом квартале даже не сделали привычную закупку боеприпасов."
901010800230-31 = "Может, они разоряются?"
901010800230-32 = "Нет. В этом году у них рекордная прибыль."
901010800230-33 = "Может, копят на крупную покупку?"
901010800230-34 = "Экономят на всём, но при этом покупают гору крабов, которых никто не собирается есть? Не сходится."
901010800230-35 = ""
901010800230-37 = ""
901010800230-39 = ""
901010800230-40 = "FOX 3, докладываю."
901010800230-41 = "FOX 2, слушай. Танго 3 и Танго 4, которые разговаривали у заднего входа, покинули посты."
901010800230-42 = "Они могут возвращаться в офис, так что заканчивай и выбирайся оттуда."
901010800230-43 = "Но я ещё не закончила копирование данных..."
901010800230-44 = ""
901010800230-46 = ""
901010800230-47 = "FOX 2. Кто-то идёт в твою сторону. Приготовься."
901010800230-48 = "...!"
901010800230-49 = ""
901010800230-56 = ""
901010800230-57 = "А? Почему дверь офиса открыта?"
901010800230-58 = ""
901010800230-62 = ""
901010800230-63 = "Кто здесь?!"
901010800230-64 = ""
901010800230-66 = ""
901010800230-70 = ""
901010800230-71 = "Здравствуйте, это FOX EATS!"
901010800230-72 = "...FOX EATS?"
901010800230-73 = "О, капо. Это то, о чём я рассказывал. Новая служба доставки, работающая в порту."
901010800230-74 = "А это их главная курьерша. Я её здесь видел."
901010800230-75 = "Я не спрашивал историю компании. Я хочу знать, ПОЧЕМУ посторонняя находится в нашем офисе!"
901010800230-76 = "Ты кто такая?! Шпионка конкурирующей семьи?"
901010800230-78 = "А, ну, я..."
901010800230-79 = ""
901010800230-81 = ""
901010800230-82 = "Простите... Я пришла с доставкой, но у двери никого не было."
901010800230-83 = "Я не могла оставить еду там портиться. Поэтому вошла, надеясь найти кого-нибудь, кому можно передать заказ..."
901010800230-84 = "Вот как? Хочешь сказать, охрана у главного входа просто тебя пропустила?"
901010800230-85 = "Нет... Потому что у двери охраны не было. П-Поэтому я и вошла."
901010800230-86 = "Ц, кучка бездельников. Похоже, им пора напомнить об обязанностях."
901010800230-87 = "Так, что за заказ?"
901010800230-88 = "Посмотрим... Две порции инаризуси!"
901010800230-89 = "Инаризуси — идеальный поздний перекус. Они лёгкие для желудка, не создают тяжести и не мешают спать."
901010800230-90 = "Хватит рекламы. Мы уже купили. Так, кто заказал инаризуси?"
901010800230-92 = "Не уверена. Могу поспрашивать."
901010800230-94 = "Хорошо. А теперь оставь еду и проваливай."
901010800230-95 = "И запомни: больше НИКОГДА не заходи на этот склад. Поняла?!"
901010800230-96 = "Поняла! Приятного аппетита!"
