[translation]
10023020-1 = "Эпизод 2; Уборку начать!"
10023020-2 = "Не успел я оглянуться, как подошло время встречи с Момои и остальными перед работой."
10023020-3 = "И как раз когда я начал гадать, где же они..."
10023020-4 = "К вашим услугам, Сенсей!"
10023020-5 = "[s] «Привет! ...М-Момои?!»"
10023020-6 = "Это я! Я сменила класс на горничную!"
10023020-7 = "Очень мило, правда?"
10023020-8 = "Разве не идеально?"
10023020-9 = "Ну же, хвали меня!"
10023020-10 = "[s1] «Наверное, звёзды выстроились ради этого момента...» \n[s2] «Должно быть, я родился, чтобы увидеть Момои в форме горничной!»"
10023020-11 = "Н-Не обязательно было заходить так далеко... Теперь мне даже неловко. Хе-хе."
10023020-12 = "Н-Не обязательно было заходить так далеко... Теперь мне даже неловко. Хе-хе."
10023020-13 = "Ха...! Ха...! Как так получается, что секунду назад ты жаловалась, какая неудобная форма, а теперь оставила нас далеко позади?!"
10023020-14 = "Желание показать её Сенсею оказалось сильнее неудобства!"
10023020-15 = "*вздох* Здравствуйте, Сенсей. Простите, что пришли позже вас."
10023020-16 = "[s] «Наверняка формы долго надевать. Тебе очень идёт, Мидори!»"
10023020-17 = "В-Вы правда так думаете? Спасибо. Хи-хи."
10023020-18 = "Юзу, вечно прятаться не получится! Давай!"
10023020-19 = "Нет, подожди! Я не могу... Я... л... ладно..."
10023020-20 = "Юбка слишком пышная...? Как думаете, Сенсей? Она ведь слишком пышная, да...?"
10023020-21 = "[s] «Идеальное количество оборок! И тебе идеально подходит, Юзу.»"
10023020-22 = "Сенсей?!"
10023020-23 = "Это не... Я... А-а-а!"
10023020-24 = ""
10023020-26 = ""
10023020-28 = "Теперь Арис!"
10023020-29 = "А? Арис?"
10023020-30 = "Тебе не подходит, Арис?"
10023020-32 = "Нет! Просто... Просто я ещё не готова носить форму горничной."
10023020-33 = "Мне не хватает силы, чтобы экипировать форму Нэру!"
10023020-34 = ""
10023020-35 = "Я правда думала, что мы смогли до неё достучаться..."
10023020-36 = "Ну, фобии обычно не проходят просто так. Хотя я не знаю, есть ли название для боязни формы горничной..."
10023020-37 = "[s] «Боязнь формы горничной?»"
10023020-38 = "Да... Арис всё ещё тревожится рядом с формой горничной, как видите."
10023020-39 = "Мы думали, что дружба с Нэру поможет, но, похоже, ассоциация слишком сильная."
10023020-40 = "Я с этим не смирюсь! Мы должны ей помочь. Герои всегда преодолевают страхи! Это всего лишь одежда!"
10023020-42 = "Но я..."
10023020-43 = "[s3] «У всех героев есть страхи. Но настоящие герои смотрят им в лицо.» \n[s4] «Герои никогда не сдаются! Каким бы сложным ни был квест!»"
10023020-44 = "Сенсей... прав... Но...!"
10023020-45 = "Сенсей... прав... Но...!"
10023020-46 = "Нет! Никаких «но». Я преодолею свой страх, потому что так поступил бы герой!"
10023020-47 = "Я завершу свой квест!"
10023020-49 = ""
10023020-50 = "Ах...!"
10023020-51 = "Я не знаю, что чувствую, когда ношу эту форму!"
10023020-52 = "[s] «Ты справилась, и это главное!»"
10023020-53 = "..."
10023020-54 = "Со мной... всё в порядке?"
10023020-55 = "Я всё ещё та же самая, даже в форме горничной?"
10023020-57 = ""
10023020-58 = "Ага! Ты наша Арис!"
10023020-59 = ""
10023020-61 = ""
10023020-62 = "Спасибо, что показали мне..."
10023020-63 = ""
10023020-65 = ""
10023020-66 = "...что эта форма — всего лишь форма, а я всегда останусь Арис, героем!"
10023020-68 = "Я знала, что у тебя получится, Арис! Я так тобой горжусь!"
10023020-70 = "Как всегда, ты потрясающая, Арис."
10023020-72 = "Наверное, было тяжело, Арис... Молодец."
10023020-73 = ""
10023020-75 = ""
10023020-76 = "[ns] «Ты отлично справилась, Арис.»"
10023020-77 = ""
10023020-79 = "Все поздравили Арис с тем, что она преодолела свой страх."
10023020-80 = "И жили они долго и счастливо..."
10023020-82 = "...но эта история заканчивается не так."
10023020-84 = "[ns] «...Почему на форме каждой есть позывной Двойной Ноль?»"
10023020-85 = "А, это? Ну, форма Нэру была единственной, которая нам подошла."
10023020-86 = "Мы знаем, что это её форма, потому что Аканэ оставила на ней записку: «На случай, если президент подрастёт.»"
10023020-87 = ""
10023020-89 = ""
10023020-90 = "Мы смогли распределить разные запасные формы Нэру между нами четырьмя..."
10023020-91 = "Остальные были слишком большими. Карин очень высокая!"
10023020-92 = "Уверена, это неважно! Раз все здесь и Сенсей дал добро..."
10023020-93 = "Пусть начнётся наше приключение!"
10023020-94 = "Почему у меня плохое предчувствие... Даже когда Сенсей здесь, я..."
10023020-95 = "У-Уф... Здесь есть шкафчик, в который можно заползти...?"
10023020-97 = "Так началось наше приключение(?) по выполнению нового квеста Отдела разработки игр..."
10023020-99 = "..."
10023020-100 = "..."
10023020-101 = ""
10023020-103 = ""
10023020-104 = "..."
10023020-105 = "?"
10023020-106 = ""
10023020-108 = ""
10023020-109 = "[ns] «Я одна не ожидала, что всё будет настолько... серьёзно?»"
10023020-110 = "М-Может, скажем, что у нас случилась чрезвычайная ситуация...!"
10023020-111 = "Мы уже здесь! Нельзя просто взять и отказаться!"
10023020-112 = ""
10023020-115 = ""
10023020-116 = ""
10023020-118 = "Юзу?! Эй? Пожалуйста, скажи что-нибудь!"
10023020-119 = ""
10023020-121 = ""
10023020-123 = ""
10023020-124 = "Добро пожаловать. Я вас ждал."
10023020-125 = "Вы не опоздали и не пришли рано. Идеально вовремя."
10023020-127 = "(Мидори, смотри... Это тот человек.)"
10023020-128 = "В-Вы клиент?"
10023020-129 = ""
10023020-131 = ""
10023020-133 = "[ns5] «Нам сказали, что это работа по уборке.» \n[ns6] «Что именно мы сегодня будем убирать?»"
10023020-134 = "Сразу к делу. Мне нравится."
10023020-135 = "Сразу к делу. Мне нравится."
10023020-136 = "Мои обязанности связаны с управлением, распределением и охраной произведений искусства. Часто я имею дело с ценными лотами аукционов."
10023020-137 = "Ваша задача — обеспечить безопасность и защиту произведения искусства. У меня есть особенно бесценная вещь, которая скоро будет выставлена на аукцион."
10023020-138 = "Безопасность? Защита?! Я думала, это уборка!"
10023020-139 = "Насколько я понимаю, «уборка» — кодовое слово для работы агентов под прикрытием C&C. Разве нет?"
10023020-140 = "(Погоди, серьёзно?!)"
10023020-141 = "(Откуда мне знать? Не спрашивай меня!)"
10023020-142 = "(Да быть не может! Что нам делать?!)"
10023020-143 = "(Всё будет нормально! Просто будем импровизировать!)"
10023020-144 = "Д-Да, всё верно! C&C к вашим услугам!"
10023020-145 = "[s] «Вам правда стоило озвучить все условия работы ещё на первом собеседовании.»"
10023020-147 = "Да, простите. Я лишь считал, что следует соблюдать осторожность."
10023020-148 = "Мне показалось неразумным настолько открыто нанимать секретного агента на публике."
10023020-149 = "Но я хочу сказать, что очень рад, что вы приняли мою просьбу. Наверное, вмешалась судьба."
10023020-150 = "Если честно, я немного ваш поклонник. Подумать только, я смогу увидеть вашу работу лично!"
10023020-152 = ""
10023020-153 = "...!"
10023020-155 = "Все знают, что C&C состоит из элитных специалистов, которым нет равных в выполнении задач."
10023020-156 = "О, не переживайте. Я понимаю, что существуют профессиональные секреты, которые нельзя раскрывать кому попало. Такая мелкая «уборка» едва ли требует от вас полной силы."
10023020-157 = "Надеюсь, я не прошу слишком многого, но мне хотелось увидеть хотя бы небольшой пример ваших навыков в деле."
10023020-158 = "(Так. Всё. Нужно признаться.)"
10023020-159 = "(Ты умереть хочешь? Нэру нас буквально убьёт, если узнает!)"
10023020-160 = "(Нет! Конечно, я не хочу умирать! Но мы же никакие не секретные агенты!)"
10023020-161 = "(Мы справимся, обещаю. Просто следуйте за мной!)"
10023020-162 = ""
10023020-164 = ""
10023020-165 = "Ну что, с чего начнём?"
10023020-166 = ""
10023020-169 = ""
10023020-171 = "Теперь я поняла! Это квест на смену класса. Я официально перейду в C&C!"
10023020-172 = "Алиса...?"
10023020-173 = "Что ты говоришь?!"
10023020-174 = "Класс C&C, который я выберу..."
10023020-175 = ""
10023020-177 = ""
10023020-179 = ""
10023020-180 = ""
10023020-181 = "..."
10023020-182 = ""
10023020-184 = ""
10023020-185 = ""
10023020-186 = ""
10023020-187 = "..."
10023020-188 = ""
10023020-190 = ""
10023020-191 = ""
10023020-192 = ""
10023020-193 = ""
10023020-194 = "Ик!"
10023020-195 = ""
10023020-197 = ""
10023020-198 = ""
10023020-199 = "...!!!"
10023020-200 = ""
10023020-202 = ""
10023020-204 = ""
10023020-205 = ""
10023020-206 = ""
10023020-207 = ""
10023020-208 = ""
10023020-209 = ""
10023020-211 = ""
10023020-212 = "Мой класс — одиночный боец светлого атрибута!"
10023020-213 = "И теперь, как боец, я подстрелю тот валун!"
10023020-214 = "Ха-а-а!"
10023020-215 = "Слепящий Свет!"
10023020-217 = "*БУМ*"
10023020-218 = ""
10023020-219 = "Ого! Этот валун был минимум в 800 метрах. Т-Теперь от него осталась только пыль!"
10023020-220 = "Я слышал, что снайпер C&C способен попасть в муху с другого конца Кивотоса. Значит, это вы!"
10023020-221 = "Н-Но, если не возражаете, я думал, снайперы должны быть немного более... незаметными?"
10023020-222 = "Н-Не этот! Её метод работы — полное подавление на любой дистанции. Д-Даже через весь Кивотос, как вы сказали."
10023020-223 = "Именно! Её любимая фраза: «Нет свидетелей — нет проблем.»"
10023020-224 = "Понятно. C&C придерживается весьма... интересной философии."
10023020-225 = "Что ж, спасибо. Пожалуйста, продолжайте представляться."
10023020-226 = "А кто эта тихая девушка, которая прячется за всеми?"
10023020-227 = ""
10023020-229 = ""
10023020-230 = "?! *вздох*"
10023020-231 = ""
10023020-233 = "(Что делать? Что делать? Чтоделать?!)"
10023020-234 = "(Не паникуй, Юзу! Ты много чего умеешь!)"
10023020-235 = "(Правда умеешь! Например... прятаться! Ты отлично прячешься!)"
10023020-236 = "(О! Придумала!)"
10023020-237 = "(Придумала? Что именно?!)"
10023020-238 = "(Просто... иди за мной!)"
10023020-239 = ""
10023020-240 = "Здравствуйте? Здесь кто-нибудь есть? Я вернулся через пять минут, как вы и просили..."
10023020-241 = ""
10023020-244 = "Что это?"
10023020-245 = ""
10023020-246 = ""
10023020-247 = "Хм. Эта коробка всегда здесь стояла?"
10023020-248 = ""
10023020-250 = ""
10023020-251 = ""
10023020-252 = ""
10023020-253 = ""
10023020-254 = ""
10023020-255 = ""
10023020-256 = ""
10023020-257 = ""
10023020-258 = ""
10023020-260 = ""
10023020-262 = "Не... двигайся...!"
10023020-263 = "Augh?!"
10023020-265 = "Как вам удалось оказаться у меня за спиной?! Вы полностью прошли мимо моей защиты!"
10023020-266 = "Вы, должно быть, та участница, что специализируется на проникновении! Вы не только двигаетесь с гибкой грацией — ваша необъяснимая удача может привести вас куда угодно!"
10023020-267 = "Я не ожидал, что вы настолько маленькая! Наверное, это сильно усложняет задания... Или, пожалуй, именно это делает вашу скрытность настолько смертоносной."
10023020-268 = "Да... И-Именно это я всегда и говорю..."
10023020-269 = "И конечно же, у нас есть знаменитый стратег. Я всегда восхищался тем, насколько эффективно вы ведёте команду через любые неожиданные повороты событий."
10023020-270 = "Это, должно быть, вы!"
10023020-271 = "Я? Стратег? Н-Наверное. Да, это я."
10023020-272 = "И напоследок..."
10023020-273 = "..."
10023020-274 = "..."
10023020-275 = "Что это за взгляд?! Если хочешь что-то сказать — говори!"
10023020-276 = "Да... Маленькая Угроза..."
10023020-278 = "С нашей встречи вы полностью оправдали свою репутацию. Буду рад работать с вами."
10023020-279 = "Я же говорила, я вообще не—!"
10023020-281 = "[ns7] «Мне интересно. У поместья такого масштаба разве нет собственной охраны?»\n[ns8] «Почему вы обратились к C&C? Какая-то система безопасности здесь ведь наверняка есть.»"
10023020-284 = "Не буду лгать. Моё поместье оснащено современной системой безопасности и охраной."
10023020-285 = "И всё же мне понадобились именно особые услуги C&C."
10023020-286 = ""
10023020-288 = ""
10023020-289 = "Дело в том... что я получил визитную карточку от Благородной Воровки."
10023020-290 = ""
10023020-292 = ""
10023020-293 = ""
10023020-294 = "Благородной... Воровки?"
