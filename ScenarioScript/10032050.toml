10032050-32 = ""
10032050-34 = ""
10032050-36 = ""
10032050-37 = "...Я сейчас, признаться, поражена. Из всех людей, с которыми можно было столкнуться..."
10032050-38 = "Даже если это ты, у меня, к сожалению, есть работа, которую я должна выполнить."
10032050-40 = "Слышала? Похоже, нас ждёт настоящая драка, Ару!"
10032050-41 = "П-Почему нам опять нужно с ней драться?"
