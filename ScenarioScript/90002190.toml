90002190-92 = "Что вообще...?"
90002190-93 = "Эйн...? Соф...? Ор...?"
90002190-94 = ""
90002190-96 = ""
90002190-97 = "А-а... А-а-а-а?!"
90002190-98 = "[ns] «...!!»"
90002190-99 = "Нет! Я не хочу этого! Только не так, не так...!!"
90002190-100 = "Не оглядывайтесь!"
90002190-101 = "?!"
90002190-102 = ""
90002190-104 = "[ns] «?!»"
90002190-105 = ""
90002190-106 = "Вот как убивают бога! Мы это знали. Это... и наш конец тоже!"
90002190-107 = "*кашель* *кашель* О-она права... Не останавливайтесь из-за нас...!"
90002190-108 = "Разве вы забыли? Вы проделали весь этот путь, чтобы остановить распространение — чтобы спасти мир..."
90002190-110 = "Это ваш шанс! Прорывайтесь, или хотите, чтобы все наши усилия пропали зря?"
90002190-111 = ""
90002190-113 = ""
90002190-114 = "Но, но...!"
90002190-115 = "Эйн? Соф? Ор? Почему?"
90002190-116 = "Пожалуйста. Зачем вы...?"
90002190-117 = "Хи-хи. Хи-хи-хи. Старшая сестра, потому что..."
90002190-118 = "Так будет правильно. Да. Именно так и должно быть. Я так рада, что смогла увидеть вас в последний раз. Ахахаха..."
90002190-119 = "Мы хотели кое-что вам сказать..."
90002190-121 = "Кто-то сказал, что мы очень старались."
90002190-124 = "Кто-то попросил нас стать друзьями и сказал бороться за то, во что мы верим."
90002190-127 = "Не только потому, что так правильно. А потому, что это единственное, что мы можем сделать."
90002190-130 = "Да. Мы хотим, чтобы вы жили, Старшая сестра."
90002190-133 = "Что бы ни случилось с нами, мы хотим, чтобы вы жили."
90002190-136 = "Мы хотим, чтобы вы увидели многое, встретили разных людей и испытали в жизни всё, что сможете."
90002190-139 = "Гораздо, гораздо больше, чем успели мы."
90002190-142 = "Есть столько всего, чего вы ещё не испытывали — даже больше, чем мы."
90002190-145 = "Поэтому, пожалуйста, продолжайте жить... до самого конца. Не останавливайтесь. Идите... продолжайте идти. Живите и за нас."
90002190-146 = ""
90002190-147 = "А... А-а... А-а-а...!"
90002190-148 = "Арис, мы же сказали тебе уходить и не оглядываться."
90002190-149 = "Что с вами такое? Вы делаете всё неловким. Мы вообще-то не ради вашего развлечения это устроили."
90002190-150 = "Д-да... И прежде всего спасибо. За то, что попросили нас стать вашими друзьями..."
90002190-151 = "Не останавливайтесь. Неважно, что случится. Тащитесь вперёд, пока не доберётесь до финиша."
90002190-152 = "Д-да...! Прокладываете ли вы собственную дорогу или идёте по следам тех, кто был до вас... Так ведь и живут, правда...?"
90002190-153 = "Да! И главное — остерегайтесь человека, который всё время хочет большего! Хахахаха!"
90002190-155 = "Простите, что пытались разрушить ваш мир."
90002190-156 = "Простите, что делали всё, что нам вздумается."
90002190-157 = "Но даже так, если вы не против..."
90002190-158 = "...Нам достаточно совсем маленького места в вашем мире."
90002190-159 = "Если там найдётся место для нашей Старшей сестры..."
90002190-160 = "Мы будем благодарны, если вы примете её."
90002190-164 = "[ns] «...!»"
90002190-165 = "Эйн...? Соф...? Ор...?"
