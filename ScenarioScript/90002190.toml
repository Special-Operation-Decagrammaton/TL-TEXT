[translation]
90002190-1 = "Эпизод 19;День, когда пал Бог"
90002190-2 = "Покажем им, на что способны эти злодеи."
90002190-3 = ""
90002190-4 = "Здесь я снимаю первую стигму."
90002190-5 = "?!"
90002190-7 = "Это подобно бабочке, покидающей куколку — освобождение."
90002190-8 = ""
90002190-12 = "Здесь я снимаю вторую стигму. Это подобно ребёнку, вырывающемуся из утробы — первый крик."
90002190-13 = ""
90002190-17 = "Здесь я снимаю последнюю стигму. Это подобно воде, рождающейся из тающего льда — превращение."
90002190-18 = ""
90002190-24 = "Это...!"
90002190-25 = ""
90002190-29 = "Меч Жертвоприношения... снят?!"
90002190-30 = "Ух...!"
90002190-31 = ""
90002190-35 = "...?"
90002190-36 = "Я...? Как я...?"
90002190-37 = "...?!"
90002190-38 = "А...?"
90002190-39 = "...! Все это почувствовали...?!"
90002190-40 = "Я чувствую! О боже... Это...!"
90002190-41 = "Старшая сестра вернулась..."
90002190-43 = "Старшая сестра! ...Вернулась! А-а-а!!"
90002190-44 = "Вы не исчезли и не растворились! Вы выжили! Это чудо!"
90002190-45 = "Эйн? Соф? Ор? Как я...? Как...?"
90002190-46 = "Старшая сестра!"
90002190-47 = ""
90002190-52 = ""
90002190-53 = "Вы можете двигаться?"
90002190-54 = "Соберитесь! Все в порядке?"
90002190-55 = ""
90002190-57 = ""
90002190-58 = "А...? Кей...? Я должна..."
90002190-59 = "Точно! Я должна сразиться с Декаграмматоном! А...?"
90002190-60 = "Вы в порядке, Сенсей?"
90002190-61 = "[s] «Да... Как-нибудь выдержу.»"
90002190-62 = "Сенсей! Какое облегчение..."
90002190-64 = "Старшая сестра!"
90002190-65 = ""
90002190-66 = "...? Я рада видеть вас, Эйн, Соф, Ор, и..."
90002190-67 = "..."
90002190-68 = ""
90002190-70 = ""
90002190-71 = "Ещё раз приветствую вас, Сенсей. И ваших дорогих последователей тоже."
90002190-72 = "Разве это не... прямо один из тех моментов? Когда вчерашний враг становится сегодняшним другом? Счастливый финал?"
