[translation]
90102060-1 = "Эпизод 6;Неожиданная встреча"
90102060-2 = ""
90102060-3 = ""
90102060-4 = "Это FOX4.#nFOX1, FOX2. Опрос завершён."
90102060-5 = ""
90102060-7 = ""
90102060-8 = "Это FOX2. Голос у тебя какой-то воодушевлённый. Нашла важную зацепку?"
90102060-9 = "Пока утверждать не могу, но, возможно, нашёлся перспективный подозреваемый."
90102060-10 = "FOX1, помнишь Алчного брокера?"
90102060-11 = "Почему сейчас всплыло это имя?"
90102060-12 = "Я сначала тоже так подумала..."
90102060-13 = "Похоже, он замешан в деле об исчезновениях."
90102060-14 = ""
90102060-16 = ""
90102060-17 = "Это правда?"
90102060-19 = "...Понятно.#nТо есть поезд-призрак может быть контрабандным поездом Алчного брокера."
90102060-20 = "Подделать данные о движении или вклинить поезд в промежуток между рейсами —#nдля него, выпускника Хайлендера, это не составит труда."
90102060-21 = "Что он перевозит — непонятно, но если это дело рук Алчного брокера,#nто кое-что сходится."
90102060-22 = "Пропавший студент мог участвовать в контрабанде или случайно оказаться втянутым."
90102060-23 = "Как гипотеза — вполне стройно."
90102060-24 = "Участились сообщения о встречах с Семью заключёнными, включая Лису бедствий.#nНет ничего странного в том, что Алчный брокер возобновил деятельность."
90102060-25 = "Но не кажется ли это немного внезапным?#nМожет, «Профессор» снова что-то замышляет...?"
90102060-26 = "Даже если так, сейчас приоритет — дело об исчезновениях."
90102060-27 = "Последующие расследования возобновим, как только разберёмся с текущим делом."
90102060-28 = "[s] «Слушай, хочу кое-что спросить...»"
90102060-29 = "Что такое?"
90102060-30 = "[s1] «Семь заключённых — выходцы из Хайлендера...?»\n[s2] «Алчный брокер?»"
90102060-33 = ""
90102060-35 = ""
90102060-36 = "Кстати, Сенсей может не знать."
90102060-37 = "Алчный брокен — один из Семи заключённых, бежавших вместе с Вакамо."
90102060-38 = "Он причастен ко всем видам незаконного оборота, дестабилизировал логистическую сеть Кивотоса,#nа из-за разнообразия путей отхода Валькирии было трудно его арестовать."
90102060-39 = "Думаю, мы бы его упустили, если бы не внутренний информатор."
90102060-40 = "Раз с его поимкой было столько хлопот — он был преступником топ-класса."
90102060-41 = ""
90102060-42 = "[ns3] «Семь заключённых...»\n[ns4] «В последнее время, кажется, много сообщений о встречах.»"
90102060-45 = "Вероятно, они мечутся, загнанные в угол.#nПрезидент Генерального Студенческого Совета вернулась, и расследование набирает обороты."
90102060-46 = "Сенсей, не беспокойтесь о выходках трудных студентов. Сначала сосредоточимся на текущем деле.#nНужно как-то проверить тот самый поезд..."
90102060-47 = ""
90102060-49 = ""
90102060-50 = "Если нет особого способа, остаётся только ждать, пока он появится."
90102060-51 = "Пока что оставьте сегодняшнюю ночь нам. Если сидеть в засаде на платформе, рано или поздно он придёт."
90102060-52 = "Сегодня всю ночь не спать~ давно не сидели в засаде."
90102060-53 = "[s] «Говорят, будет довольно холодно, вы справитесь?»"
90102060-54 = "Не волнуйтесь. Молча выполнять задачу в любых условиях — это и есть спецназ SRT."
90102060-55 = "Мы не раз проходили тренировки на холоде, так что ночной ветер на смене сезонов — легко, легко."
90102060-56 = "Итак, FOX3, FOX4, продолжайте наблюдение на месте."
90102060-57 = "Положись на нас!"
90102060-59 = "(Однако в ту ночь―)"
90102060-60 = ""
90102060-63 = ""
90102060-64 = ""
90102060-65 = "Алчный брокер, ну где же ты..."
90102060-66 = "Так и закоченеть можно..."
90102060-67 = "Воздух какой-то холоднее обычного, нет?#nМожет, потому что днём было тепло..."
90102060-68 = "Слушай, FOX4. Думаешь, поезд правда придёт?"
90102060-69 = "Кто знает. Это только у самого Брокера можно спросить."
90102060-70 = "Тем более неизвестно, замешан ли вообще Алчный брокер."
90102060-71 = "У-у... надо было хоть одно одеяло взять."
90102060-72 = ""
90102060-74 = ""
90102060-75 = "...Может, связаться с Сенсеем?"
90102060-76 = "Ты в своём уме? Ты знаешь, сколько сейчас времени?#nНельзя беспокоить Сенсея, который и так занят."
90102060-77 = "...К тому же есть гордость SRT.#nНельзя позволить себе здесь полагаться на Сенсея [USERNAME]."
90102060-78 = "И то верно."
90102060-79 = "Скорее бы уже... на худой конец, пусть хоть настоящий поезд-призрак..."
90102060-81 = "(Двое продолжали ждать на платформе, но, так и не добившись результата, встретили утро)"
90102060-86 = ""
90102060-87 = "FOX3... вернулась."
90102060-88 = "FOX4 тоже прибыла―"
90102060-89 = "[s5] «Куруми, Отоги. С возвращением.»\n[s6] «Спасибо, что мёрзли ради нас.»"
90102060-92 = "Ну, терпимо было."
90102060-93 = "Вы обе молодцы."
90102060-94 = "Как прошла ночь в засаде?"
90102060-95 = "Всё было тихо-спокойно."
90102060-96 = "Никакого поезда-призрака — даже муравей не прошёл."
90102060-97 = "Может, вчера был неудачный день.#nК тому же ветер сильный был― апчхи!"
90102060-98 = "У-у... что-то тело странное. Кажется, жар."
90102060-99 = "У меня тоже озноб... похоже на простуду."
90102060-100 = "Ох. Садитесь-ка сюда обе."
90102060-101 = "Сейчас приготовлю горячего чаю."
90102060-102 = ""
90102060-104 = ""
90102060-105 = "Всё-таки при больших перепадах температуры и здоровье подводит."
90102060-106 = "Прости, FOX1. Так оплошать из-за такой температуры — стыдно..."
90102060-107 = "Нет. Не предусмотреть это заранее — моя вина. Прости, что заставила тебя страдать."
90102060-108 = "Вы двое хорошенько отдохните. Сегодня на опрос идти не нужно."
90102060-109 = "Но что, если за это время появится подозреваемый?"
90102060-110 = "Беспокоиться не нужно."
90102060-111 = "Сегодняшнее расследование проведу я."
90102060-112 = ""
90102060-114 = ""
90102060-115 = "Юкино?"
90102060-116 = "Юкино!?"
90102060-117 = "Юкино... опрос? Горожан?"
90102060-118 = ""
90102060-120 = ""
90102060-121 = "...Есть какие-то проблемы?"
90102060-122 = "Да нет... Юкино, ты же плохо врёшь."
90102060-123 = "В обучении SRT всё строится на плане, поэтому и сходило с рук,#nно я не думаю, что Юкино справится в реальном деле..."
90102060-124 = "Подготовка к опросу завершена полностью."
90102060-125 = "Словечки, которыми пользуются «янь-ка», разумеется, и темы «науи» — всё изучено в совершенстве."
90102060-126 = "Изобразить чувствительную к моде старшеклассницу — никаких проблем."
90102060-127 = "Да нет, что значит играть... мы же старшеклассницы."
90102060-129 = "Юкино — «янь-ка»... вообще не представляю."
90102060-130 = "[s] «...Юкино настолько плохо играет?»"
90102060-131 = "Скорее... это можно назвать неспособностью врать. Ахаха..."
90102060-132 = "Сенсей, если не сложно, снимете видео с Юкино?"
90102060-133 = "В последнее время нет стоящих развлекательных передач, вот и скучаю."
90102060-135 = "FOX4, хватит нести чушь, сегодня сосредоточься на отдыхе."
90102060-136 = "FOX1, может, мне пойти вместо тебя?"
90102060-137 = "Нет, FOX2 слишком известна в соцсетях."
90102060-138 = "Даже с учётом секретности операции, разумнее будет пойти мне."
90102060-139 = "Это я понимаю, но... не переусердствуй."
90102060-140 = "Итак, FOX1. Отправляюсь на сегодняшнее расследование."
90102060-141 = ""
90102060-143 = ""
90102060-145 = ""
90102060-146 = "Справлюсь ли..."
90102060-150 = ""
90102060-151 = "Фух..."
90102060-152 = "[s7] «Юкино, ты в порядке?»\n[s8] «Ты очень нервничаешь...»"
90102060-155 = "Всё в порядке."
90102060-156 = "Просто давно не выходила в поле, вот и прокручивала всё в голове."
90102060-157 = "Повторять симуляцию на месте важно, чтобы быть готовой к непредвиденным ситуациям."
90102060-158 = "Фу-у-у..."
90102060-159 = "Итак, начинаю опрос."
90102060-160 = "Спокойно.#nПредставь обычную ученицу и выбери тему, которая естественно вызовет отклик..."
90102060-161 = ""
90102060-163 = ""
90102060-164 = "Йо-о, милая девушка!"
90102060-165 = "Если есть время, может, поболтаем о ME и Перороччи?"
90102060-166 = "[ns9] «(Ах...)»\n[ns10] «(Смотреть стыдно...)»"
90102060-169 = "...Я спешу."
90102060-170 = "Мне нужно идти."
90102060-171 = "А-а, понятно. Тогда ничего не поделаешь..."
90102060-172 = "Э? Подождите. Этот голос―"
90102060-173 = ""
90102060-175 = ""
90102060-176 = "...Юкино?"
90102060-177 = "А."
90102060-178 = "[ns] «А.»"
90102060-179 = "―И, [USERNAME] Сенсей."
90102060-180 = ""
90102060-182 = ""
90102060-183 = "Это... что за ситуация?"
90102060-184 = ""
90102060-186 = ""
90102060-187 = ""
90102060-188 = "...Объясните. Подробно."
90102060-189 = "[s] «Эм, ну это...»"
90102060-190 = ""
90102060-192 = ""
90102060-193 = "..."
90102060-194 = "...Давно не виделись, командир отряда [ruby=つきゆき]Цукиюки[/ruby]."
90102060-196 = "Следующий эпизод;Лиса и кролик"
