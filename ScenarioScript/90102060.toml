[translation]
90102060-1 = "Episode 6;An Unexpected Reunion"
90102060-4 = "FOX 4 here. #nFOX 1, FOX 2. We've finished the interviews."
90102060-8 = "FOX 2 here. You sound awfully lively. Did you find an important lead?"
90102060-9 = "We can't say for sure yet, but we might have found a strong suspect."
90102060-10 = "FOX 1, do you remember the Avaricious Broker?"
90102060-11 = "Why bring up that name now?"
90102060-12 = "I thought the same thing at first, but..."
90102060-13 = "It seems they're involved in this disappearance case."
90102060-17 = "Is that true?"
90102060-19 = "...I see. #nSo you're saying the true identity of the phantom train might be a smuggling train used by the Avaricious Broker."
90102060-20 = "Falsifying timetable info or slipping a train into the gaps between schedules—#nthat shouldn't be too hard for someone from Highlander."
90102060-21 = "I don't know what they're transporting, but if we assume it's the Avaricious Broker's doing, #nit all adds up to a certain extent."
90102060-22 = "Maybe the missing student was also involved in the smuggling, or just happened to get caught up in it."
90102060-23 = "It's a solid enough hypothesis."
90102060-24 = "Starting with the Calamity Fox, sightings of the Seven Prisoners have been on the rise. #nIt wouldn't be strange for the Avaricious Broker to have resumed operations."
90102060-25 = "Don't you think it's a bit sudden, though? #nI wonder if the \"Professor\" is plotting something again..."
90102060-26 = "Even if that's the case, the disappearance case is our priority right now."
90102060-27 = "We'll resume the rest of the investigation once the matter at hand is resolved."
90102060-28 = "[s] \"Hey, I have one question...\""
90102060-29 = "What is it?"
90102060-30 = "[s1] \"A Seven Prisoner from Highlander...?\"\n[s2] \"What's an Avaricious Broker?\""
90102060-36 = "Ah, Sensei might not know about them."
90102060-37 = "The Avaricious Broker is one of the Seven Prisoners who escaped alongside Wakamo."
90102060-38 = "They dabbled in all sorts of illegal distribution, throwing Kivotos's logistics network into chaos, #nand with their diverse escape routes, even Valkyrie had a hard time arresting them."
90102060-39 = "I doubt we would have caught them ourselves if we didn't have an inside helper."
90102060-40 = "When it comes to criminals who were a pain in the neck to catch, they were top-tier."
90102060-42 = "[ns3] \"The Seven Prisoners...\"\n[ns4] \"It feels like there've been a lot of sightings lately.\""
90102060-45 = "They're probably cornered and thrashing about. #nWith the General Student Council President back, the net is closing in on them."
90102060-46 = "Don't worry yourself over troublemakers' antics, Sensei. Let's focus on the task at hand first. #nThough we need to find a way to check out that train..."
90102060-50 = "If there's no special way, we'll just have to wait until it shows up."
90102060-51 = "Leave it to us for tonight. If we stake out the platform, it's bound to show up eventually."
90102060-52 = "An all-nighter, huh~ It's been a while since we did a stakeout."
90102060-53 = "[s] \"I hear it gets pretty chilly, will you be okay?\""
90102060-54 = "No need to worry. Quietly carrying out missions in any environment is what SRT's special forces do."
90102060-55 = "We've done cold-weather training plenty of times. A seasonal night breeze is nothing, totally nothing."
90102060-56 = "Then FOX 3, FOX 4, I'm counting on you both to keep watching the site."
90102060-57 = "Leave it to us!"
90102060-59 = "(However, that night—)"
90102060-65 = "The Broker is late..."
90102060-66 = "At this rate, I'm going to turn into an icicle..."
90102060-67 = "Isn't the air colder than usual? #n Maybe because it was warm during the day..."
90102060-68 = "Hey, FOX 4. Do you really think the train is coming?"
90102060-69 = "Who knows. You'd have to ask the Broker themselves about that."
90102060-70 = "Besides, we don't even know if the Avaricious Broker is involved in the first place."
90102060-71 = "Ugh... If I'd known, I would have brought at least a blanket."
90102060-75 = "...Should we contact Sensei?"
90102060-76 = "Are you crazy? What time do you think it is? #nWe can't bother Sensei, who's already busy as it is."
90102060-77 = "...Besides, we have SRT's pride. #nWe can't rely on [USERNAME] Sensei here."
90102060-78 = "I suppose you're right."
90102060-79 = "I hope they hurry... At this point, even a real ghost train would be fine..."
90102060-81 = "(The two continued waiting on the platform, but morning came without any results.)"
90102060-87 = "FOX 3... returning to base."
90102060-88 = "FOX 4 has also arrived—"
90102060-89 = "[s5] \"Kurumi, Otogi. Welcome back.\"\n[s6] \"Good work out there in the cold.\""
90102060-92 = "Well, it was tolerable at best."
90102060-93 = "Good work, both of you."
90102060-94 = "How was staking it out all night?"
90102060-95 = "Absolute peace and quiet."
90102060-96 = "Forget a ghost train, not even a single ant crossed our path."
90102060-97 = "Maybe yesterday was just bad luck. #nTo top it off, the wind was so strong—atchoo!"
90102060-98 = "Ugh... My body feels weird. I think I have a fever."
90102060-99 = "I have the chills too... Might be a cold."
90102060-100 = "Oh no. You two, sit over here."
90102060-101 = "I'll go get some warm tea right away."
90102060-105 = "I suppose large temperature swings will mess with your health."
90102060-106 = "Sorry, FOX 1. To get taken down by this kind of temperature, I'm ashamed..."
90102060-107 = "No. It's my fault for not factoring that in. I've put you through a hard time."
90102060-108 = "Get some proper rest, both of you. There's no need to go out for interviews today."
90102060-109 = "But what will we do if the suspect shows up in the meantime?"
90102060-110 = "You have nothing to worry about."
90102060-111 = "I will handle today's investigation."
90102060-115 = "Yukino?"
90102060-116 = "Yukino!?"
90102060-117 = "Yukino... doing interviews? With citizens?"
90102060-121 = "...Is there a problem?"
90102060-122 = "Well... Yukino, you're bad at lying."
90102060-123 = "You only got away with it during SRT training because everything was scripted, #nbut I don't see how Yukino can pull that off in a real situation..."
90102060-124 = "My preparations for the investigation are airtight."
90102060-125 = "I've thoroughly researched popular slang used by \"extroverts,\" as well as \"hip\" topics."
90102060-126 = "There will be no problem playing the part of a trend-conscious high school girl."
90102060-127 = "Playing a part or not... we *are* high school girls."
90102060-129 = "Extrovert Yukino... I honestly can't picture it at all."
90102060-130 = "[s] \"...Is Yukino really that bad at acting?\""
90102060-131 = "Or rather... I should say she has a personality that can't tell lies. Ahaha..."
90102060-132 = "Sensei, if you don't mind, could you record a video of Yukino?"
90102060-133 = "I was just getting bored because there haven't been any entertaining variety shows lately."
90102060-135 = "FOX 4, stop saying useless things and focus on recovering today."
90102060-136 = "FOX 1, shall I go in your place?"
90102060-137 = "No, FOX 2 is too well-known on social media."
90102060-138 = "Considering operational secrecy, it's appropriate for me to go."
90102060-139 = "I understand, but... please don't push yourself."
90102060-140 = "Then, FOX 1. Heading out for today's investigation."
90102060-146 = "I wonder if she'll be okay..."
90102060-151 = "Phew..."
90102060-152 = "[s7] \"Yukino, are you okay?\"\n[s8] \"You look really nervous...\""
90102060-155 = "There is no problem."
90102060-156 = "It's been a while since I've been out in the field like this, so I was just running simulations in my head."
90102060-157 = "It's important to repeat field simulations so you can respond to unexpected situations."
90102060-158 = "Huuuuuu..."
90102060-159 = "Now, I will begin the interviews."
90102060-160 = "Stay calm. #nAssume an ordinary student and choose topics that naturally build rapport..."
90102060-164 = "Yo there, cute girl!"
90102060-165 = "If you've got time, want to talk about ME and Pero-roches?"
90102060-166 = "[ns9] (Uwaaaaaah...)\n[ns10] (Watching this is making me second-hand embarrassed...)"
90102060-169 = "...I'm good."
90102060-170 = "I'm in a hurry."
90102060-171 = "O-Oh. Well, can't be helped..."
90102060-172 = "Huh? Wait a minute. This voice—"
90102060-176 = "...Yukino-senpai?"
90102060-177 = "Ah."
90102060-178 = "[ns] \"Ah.\""
90102060-179 = "—and [USERNAME] Sensei."
90102060-183 = "What is... the meaning of this?"
90102060-188 = "...Explain. In detail."
90102060-189 = "[s] \"Um, well...\""
90102060-193 = "..."
90102060-194 = "...Long time no see, Tsukiyuki Squad Leader."
90102060-196 = "Next Episode;The Fox and the Rabbit"
