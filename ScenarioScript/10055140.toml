[translation]
10055140-1 = "Day of the Lobster"
10055140-2 = "[log]Day 〇 of drifting[/log]"
10055140-7 = "[ns1] \"...I wonder how everyone is doing right now.\"\n[ns2] \"I hope they're doing okay...\""
10055140-10 = "Feeling weak-willed in the morning doesn't suit you, Sensei."
10055140-14 = "Do you have some sort of complaint about living in Neo-Gehenna, which I rule over?"
10055140-15 = "[s] \"Neo... Gehenna?\""
10055140-16 = "Yes, this morning... I had an awakening!"
10055140-17 = "That this ship, with Makoto-sama on board, is the true Gehenna!"
10055140-18 = "Therefore, I have named this place 'Neo-Gehenna'!"
10055140-19 = "...What's wrong, Sensei? You have a look like you want to say something."
10055140-20 = "[s3] \"I think that way of thinking is important.\"\n[s4] \"Makoto, you really are resilient.\""
10055140-23 = "Kishishi! So, in short, you're praising me!"
10055140-24 = "Rest easy and enjoy this time, Sensei! The rescue team will arrive shortly!"
10055140-28 = "I see~!"
10055140-32 = "So that's the kind of trouble you have with life at sea!"
10055140-33 = "Oh, Sensei!"
10055140-34 = "Huh? Oh, this is—"
10055140-35 = "Let me introduce you! This is Yona the fish, who is helping me with my report!"
10055140-36 = "A chance encounter is a bond from a past life! No, a chance gill-encounter is a bond from a past life!"
10055140-37 = "The miracle of meeting in this vast ocean! I can't think of you as a stranger!"
10055140-38 = "So, I've been interviewing them about various things."
10055140-39 = "What brings you here, Sensei?"
10055140-40 = "[s5] \"Um... I just stopped by for a bit.\"\n[s6] \"Good luck with... the interview.\""
10055140-43 = "Yes! Thank you very much!!"
10055140-44 = "Now then, continuing on with the story about being swallowed by a giant fish—"
10055140-48 = "Sigh... honestly, it's too painful to watch."
10055140-49 = "[s7] \"Iroha!\"\n[s8] \"Thank goodness! You were safe—\""
10055140-56 = "...What's wrong? You look like you've seen a ghost."
10055140-57 = "Huh? This?"
10055140-58 = "As you can see, it's Toramaru."
10055140-59 = "Is there a problem?"
10055140-63 = "Main gun, armor, no abnormalities..."
10055140-64 = "There's nothing particularly unusual, is there...?"
10055140-65 = "Isn't it just your imagination, Sensei?"
10055140-66 = "...Well then, I have rounds to make, so I'll be going."
10055140-67 = "Let's go, Toramaru."
10055140-71 = "Vroom."
10055140-76 = "...It seems best to leave them be until we get back to land."
10055140-77 = "[s9] \"Satsuki!!\"\n[s10] \"You were safe!!\""
10055140-80 = "The way you say that makes it sound like some people aren't safe..."
10055140-81 = "Looking at the current situation, I can't say that's not the case, can I?"
10055140-82 = "Still... setting Makoto-chan aside, even Iroha and Chiaki..."
10055140-83 = "This is a total loss of face for the Pandemonium Society."
10055140-84 = "[s11] \"Let's set Makoto aside...\"\n[s12] \"It seems like everyone is under a lot of stress.\""
10055140-87 = "True, I didn't think it would drag on this long either."
10055140-88 = "Sensei~!"
10055140-92 = "Hi there, Satsuki-senpai!"
10055140-93 = "Ibuki-chan, it's dangerous to run on the ship, you know?"
10055140-94 = "Ah! Yeah, I'll be careful..."
10055140-95 = "So, what's the rush?"
10055140-96 = "Guess what! There was an island over there!"
10055140-97 = "No way. An island near here..."
10055140-98 = "Ha! Don't tell me even Ibuki-chan is hallucinating!?"
10055140-99 = "...Hm? Sensei?"
10055140-100 = "Why are you spacing out? If you're not careful, you'll fall into the sea—"
10055140-101 = "[ns] \"La...\""
10055140-102 = "La?"
10055140-103 = "[ns] \"Land!!!\""
10055140-106 = "What! R-really!?"
10055140-107 = "Land!?"
10055140-108 = "What, is that true!?"
10055140-113 = "...I can't believe there's such a large island."
10055140-114 = "There are no signs of people for now. I hope it's not an uninhabited island."
10055140-115 = "What are you saying, Iroha! An uninhabited island is obviously better!"
10055140-116 = "Huh?"
10055140-117 = "If it's an uninhabited island... that means I, Makoto-sama, am the first discoverer of this island!"
10055140-118 = "Kishishi! From today, the name of this island is 'Makoto Island'!"
10055140-119 = "...How do you manage to stay so positive?"
10055140-125 = "Hm?"
10055140-126 = "Wow~ a cute hermit crab!"
10055140-127 = "It's true, it's cute! I'm going to take a picture!"
10055140-128 = "Yay, Pandemonium Society hermit crab~!"
10055140-129 = "Huh? Pandemonium Society hermit crab...?"
10055140-130 = "That's right! This one is Makoto-senpai. And this one is Satsuki-senpai..."
10055140-131 = "Oh! You're right, the shell color is the same as Makoto-senpai and the others' hair!"
10055140-132 = "Then, is this black one the secretary of the Pandemonium Society?"
10055140-133 = "...I see, the ecosystem is reasonably well-established."
10055140-134 = "In other words, there's a high possibility of procuring food."
10055140-135 = "I'm sorry to Ibuki, but these guys too..."
10055140-136 = "What did you say!?"
10055140-137 = "You intend to eat this guy!?"
10055140-138 = "Y-you startled me... what is it this time?"
10055140-139 = "What is it, you ask!"
10055140-140 = "Food is out of the question! This guy is a genuine fighter!"
10055140-141 = "............"
10055140-142 = "...Yes?"
10055140-144 = "The burning fighting spirit deep within those innocent eyes... you, you're no ordinary hermit crab, are you!?"
10055140-145 = "What is your true identity!"
10055140-146 = "Speak! What exactly are you!"
10055140-147 = "Oh my, congratulations, Mr. Hermit Crab. It's rare for Makoto-chan to praise someone like that."
10055140-148 = "No, no..."
10055140-149 = "To make such a big deal out of one hermit crab..."
10055140-150 = "Ahaha! But I'm glad everyone seems back to their usual selves!"
10055140-151 = "...Well, I suppose so. Better than being depressed."
10055140-152 = "I've got it! This guy is a shark! Even if its body is small, its spirit is no less than a shark's!"
10055140-153 = "From now on, you are 'Tiger Shark-maru'!"
10055140-154 = "The pinnacle of the hermit crab world... No, go beyond that and become the strongest crustacean champion!"
10055140-157 = "Uhe~"