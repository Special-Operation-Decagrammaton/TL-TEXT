[translation]
10055140-1 = "День омара"
10055140-2 = "[log]День XX в дрейфе[/log]"
10055140-7 = "[ns1] «Интересно, что сейчас происходит на суше...»\n[ns2] «Надеюсь, у всех всё хорошо...»"
10055140-10 = "Что за нытьё с самого утра, Сенсей?!"
10055140-11 = ""
10055140-13 = ""
10055140-14 = "Вас не устраивает жизнь в Нео-Геенне под моим правлением?"
10055140-15 = "[s] «Нео... Геенне...?»"
10055140-16 = "Именно! Сегодня утром меня внезапно осенило!"
10055140-17 = "Геенна вовсе не где-то далеко! Нет, где бы ни находилась я, Великая Макото, ТАМ и будет настоящая Геенна!"
10055140-18 = "Поэтому я провозглашаю этот корабль «Нео-Геенной»!"
10055140-19 = "...Да, Сенсей? Хотите что-то сказать?"
10055140-20 = "[s3] «Прекрасный взгляд на вещи».\n[s4] «Восхищаюсь вашей стойкостью»."
10055140-23 = "Кихехехе! Не совсем поняла, о чём вы, но приму это как комплимент!"
10055140-24 = "Так или иначе, не тревожьтесь, Сенсей! Спасатели скоро прибудут!"
10055140-25 = ""
10055140-27 = ""
10055140-28 = "...А, вот как! Очень интересно!"
10055140-29 = ""
10055140-31 = ""
10055140-32 = "Значит, у обитателей морских глубин есть свои особенные трудности!"
10055140-33 = "О, здравствуйте, Сенсей!"
10055140-34 = "Хм? С кем я разговариваю?"
10055140-35 = "Хи-хи, познакомьтесь! Это рыбка Йона!"
10055140-36 = "Стоило её плавнику коснуться моего рукава, и я поняла: мы подружимся!"
10055140-37 = "И вот мы, две заблудшие души в бескрайнем океане."
10055140-38 = "Кто бы мог подумать, что ей есть столько всего рассказать!"
10055140-39 = "...Сенсей, с вами всё хорошо?"
10055140-40 = "[s5] «Д-да, всё нормально».\n[s6] «Эм... Удачи с интервью»."
10055140-43 = "Ага! Спасибо!"
10055140-44 = "Ну так вот, Йона, расскажи подробнее, как тебя однажды проглотили целиком..."
10055140-45 = ""
10055140-47 = ""
10055140-48 = "*вздох* На это больно смотреть."
10055140-49 = "[s7] «А, Ироха!»\n[s8] «Хорошо, ты хотя бы в здра-а-авом...»"
10055140-52 = ""
10055140-56 = "...? Вы выглядите слегка ошарашенными."
10055140-57 = "Хм? Что значит «что я держу»?"
10055140-58 = "Вы что, не узнаёте Торамару?"
10055140-59 = "С ним ведь всё в порядке, разве нет?"
10055140-60 = ""
10055140-62 = ""
10055140-63 = "Главное орудие исправно, броня цела..."
10055140-64 = "По-моему, все системы работают штатно."
10055140-65 = "Хм? Ничего?"
10055140-66 = "...Ну ладно, мне пора на патрулирование."
10055140-67 = "Поехали на улицы, Торамару."
10055140-68 = ""
10055140-70 = ""
10055140-71 = "*вр-р-рум*"
10055140-72 = ""
10055140-75 = ""
10055140-76 = "Мы... оставим её в покое до возвращения на сушу, хорошо?"
10055140-77 = "[s9] «Сацуки!»\n[s10] «Ты в порядке!»"
10055140-80 = "Хм? Из этого следует, что я могла быть НЕ в порядке."
10055140-81 = "Не говорите так! Вы меня пугаете!"
10055140-82 = "...И всё-таки одно дело, когда Макото сходит с ума посреди моря, но теперь Ироха, да ещё и Чиаки..."
10055140-83 = "Это не сулит ничего хорошего репутации Общества Пандемониум."
10055140-84 = "[s11] «За Макото ты, значит, не волнуешься?»\n[s12] «Всё-таки мы все пережили немалый стресс»."
10055140-87 = "Признаться, не думала, что мы так долго будем дрейфовать..."
10055140-88 = "Сенсей!"
10055140-89 = ""
10055140-91 = ""
10055140-92 = "А, и Сацуки тоже! Привет!"
10055140-93 = "Осторожнее, Ибуки. Если бегать по палубе, можно споткнуться."
10055140-94 = "Ой... Осторожно-осторожно..."
10055140-95 = "Так почему такая спешка?"
10055140-96 = "Потому что вон там остров!"
10055140-97 = "Остров? Нет, невозможно. Мы слишком далеко в море."
10055140-98 = "*ах* Только не говорите, что теперь и Ибуки видит миражи!"
10055140-99 = "...Сенсей?"
10055140-100 = "Почему вы смотрите в море? Осторожнее, не упадите за борт."
10055140-101 = "[ns] «Зе... Зе...»"
10055140-102 = "Зе-зе? Что?"
10055140-103 = "[ns] «Земля!»"
10055140-106 = "Ч-что?! Серьёзно?!"
10055140-107 = "Земля?!"
10055140-108 = "Неужели?!"
10055140-109 = ""
10055140-113 = "...Вот он. Остров такого размера посреди океана."
10055140-114 = "Но никаких признаков людей. Если он необитаемый, нам от него мало пользы."
10055140-115 = "Нет, пусть будет необитаемым! Пусть его вообще никто не открывал!"
10055140-116 = "Что?"
10055140-117 = "Ведь тогда я первой ступлю на его берег!"
10055140-118 = "Кихехе! Отныне назовём это место «Островом Макото»!"
10055140-119 = "...Мне уже начинает казаться подозрительным твой безумный оптимизм."
10055140-122 = ""
10055140-123 = ""
10055140-124 = ""
10055140-125 = "А?"
10055140-126 = "Ой, смотрите! Какой милый рак-отшельник!"
10055140-127 = "Ой, и правда миленький! Дайте сфотографирую!"
10055140-128 = "Смотрите-смотрите, тут целое Общество Пандемониум из раков-отшельников!"
10055140-129 = "О чём ты говоришь?"
10055140-130 = "Видите! Вот этот — Макото, а тот — Сацуки..."
10055140-131 = "А, точно, теперь вижу! Их раковины тех же цветов, что и наши волосы!"
10055140-132 = "Значит, этот маленький чёрный — их секретарь, что ли?"
10055140-133 = "...Понятно. Значит, здесь процветает целая экосистема."
10055140-134 = "А значит, есть и еда."
10055140-135 = "Прости, Ибуки, но твоих новых друзей, возможно, придётся..."
10055140-136 = "...Придётся ЧТО?!"
10055140-137 = "Ты предлагаешь их СЪЕСТЬ?!"
10055140-138 = "Д-да ладно. Из-за чего столько шума? Чего ты разозлилась?"
10055140-139 = "Разве не видите? ПОСМОТРИТЕ на них!"
10055140-140 = "Эти создания — настоящие бойцы! Еда? Ни в коем случае."
10055140-141 = "..."
10055140-142 = "...Хм?"
10055140-144 = "Этот боевой дух пылает в их маленьких блестящих глазах... Ты ведь не простой рак-отшельник, верно?"
10055140-145 = "Так кто же ты?!"
10055140-146 = "Да! Кто ты такой??"
10055140-147 = "Ого, вот это похвала. Поздравляю, маленький рак-отшельник. Макото не так-то просто заслужить такое признание."
10055140-148 = "...А."
10055140-149 = "Все так суетятся из-за пары крошечных крабиков."
10055140-150 = "Но всё-таки приятно! Такое чувство, что Общество Пандемониум наконец вернулось к обычной жизни."
10055140-151 = "Ну, это хотя бы лучше, чем когда все унывают..."
10055140-152 = "Придумала! Этот малыш — акула! Пусть телом он рак-отшельник, но сражается как морской хищник!"
10055140-153 = "Отныне тебя будут звать «Тайгершаркмару»!"
10055140-154 = "Ты станешь чемпионом всех раков-отшельников! Нет, превзойдёшь их и станешь сильнейшим среди всех ракообразных!"
10055140-155 = ""
10055140-156 = ""
10055140-157 = "Хе-хе..."
