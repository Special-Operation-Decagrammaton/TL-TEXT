[translation]
104060-1 = "Эпизод 6; При прочих равных"
104060-4 = ""
104060-5 = ""
104060-6 = ""
104060-7 = "Анализ ситуации... Соединение с Утнапиштимом разорвано. Попытка обхода блокировки."
104060-8 = ""
104060-10 = ""
104060-11 = "...Неудача. Соединение с Утнапиштимом заблокировано. Вмешательство невозможно."
104060-12 = ""
104060-14 = ""
104060-15 = "Подтверждено, что подавление многомерного анализа сохраняется. Повторная попытка уничтожения посредством ускорения вычислений."
104060-16 = ""
104060-18 = ""
104060-19 = "Ускорение невозможно. Проверка процесса воплощения Санктумов на земле. Проверка состояния проявления временного объекта."
104060-20 = ""
104060-22 = ""
104060-23 = "Уничтожение временного объекта подтверждено. Проявление невозможно. Такими темпами план..."
104060-24 = "...провалится."
104060-25 = "..."
104060-26 = ""
104060-28 = ""
104060-36 = "...Состояние подтверждено. Подготавливается последовательность самоуничтожения Ковчега Атрахасис."
104060-37 = "После активации последовательности Ковчег самоуничтожится, а функция многомерного анализа будет навсегда уничтожена."
104060-38 = "Немедленная реакция на непосредственную угрозу."
104060-39 = ""
104060-41 = ""
104060-42 = "...Расчёт невозможен. Недостаточно ресурсов. Процесс воплощения Санктума..."
104060-43 = "...отменён."
104060-44 = ""
104060-51 = "Мы справились... да?"
104060-52 = "Мы сделали это! И что теперь? Это место самоуничтожится?"
104060-53 = "Ха-ха! Похоже на то!"
104060-55 = ""
104060-56 = ""
104060-57 = ""
104060-58 = "..."
104060-59 = "Фуука? Что случилось?"
104060-60 = ""
104060-62 = ""
104060-63 = ""
104060-64 = "С ней всё хорошо. Думаю, просто эмоции накрыли. Ты прекрасно справилась, Фуука."
104060-65 = "Наконец всё закончилось?"
104060-66 = "Должно быть, да?"
104060-67 = "Хи-хи-хи..."
104060-68 = "Что за зловещий смех?"
104060-70 = "Нет-нет! Нужно идти помогать Сенсею!"
104060-71 = "Т-Точно... Сенсей."
104060-72 = "Это же очевидно. Полноценный обед не заканчивается, пока не съеден десерт!"
104060-73 = "Ещё ничего не закончилось, так что давайте доведём дело до конца вместе!"
104060-74 = "Ах! Красота дружбы! ★"
104060-75 = "Ну, я примерно этого и ожидала. Похоже, выбора нет!"
104060-76 = ""
104060-78 = ""
104060-80 = "Пошли!"
104060-81 = "Я понесу Фууку на спине! Идём!"
104060-83 = "Небо снова изменилось!"
104060-84 = "Мы едва успели! Последовательность самоуничтожения Ковчега повторно активирована!"
104060-85 = "Тогда нам осталось только спасти Сенсея и Широко до взрыва и выбраться отсюда!"
104060-86 = "Аяне, мы сейчас идём помогать Сенсею! А ты эвакуируйся первой вместе с остальными!"
104060-87 = "...Нет, я уйду только после того, как спасут Сенсея и Широко! Я останусь с вами до конца!"
104060-88 = "Но..."
104060-89 = "Она права. Мы держимся вместе до конца. Аяне, веди."
104060-90 = "Да! Тогда не будем терять времени!"
104060-91 = "Пошли!"
104060-94 = "Вы слышали? Быстрее, ребята! Нам нужно воспользоваться последовательностью эвакуации президента Рио!"
104060-95 = "А? Подождите! Отдел разработки игр? Где вы сейчас?"
104060-96 = "Мы направляемся в центральную часть Ковчега!"
104060-97 = "Ага! Мы идём помогать Сенсею!"
104060-98 = "Скоро будем на месте!"
104060-99 = "Мы можем эвакуироваться в любой момент, так что..."
104060-100 = "Что?!"
104060-101 = ""
104060-103 = ""
104060-104 = "...Ух, ладно! Эвакуируйтесь вместе с Сенсеем, хорошо?!"
104060-105 = "Да! Доверься нам, Юука!"
104060-110 = "Небо..."
104060-111 = "Ха-ха-ха, видите? Я знала, что мы справимся!"
104060-112 = "Да, проявлявшиеся Ложные Санктумы тоже исчезли."
104060-113 = "Здесь почти всё улажено, и Токи в безопасности. Что теперь?"
104060-114 = "Осталось только одно!"
104060-115 = ""
104060-117 = "Ждать возвращения Сенсея!"
104060-118 = "Ага! Это я могу!"
104060-119 = "Хотя стоит продолжать следить и за ситуацией в других районах..."
104060-120 = "Справедливое замечание."
104060-122 = "Предупреждение. Подготавливается последовательность самоуничтожения Ковчега Атрахасис. После её активации вероятность пережить взрыв оценивается менее чем в 0,0003%."
104060-123 = "Сунаоками Широко. Сунаоками Широко. Сенсей [USERNAME]. Ожидается гибель всех. Необходимо подготовить ответ..."
104060-124 = ""
104060-126 = ""
104060-127 = "...Понятно."
104060-128 = "Вы тянули время, чтобы ваши студенты смогли найти способ добиться успеха."
104060-129 = "[s] «Потому что я в них верю.»"
104060-130 = ""
104060-132 = ""
104060-133 = "Да. Мне необязательно побеждать тебя."
104060-134 = "Важно, чтобы победили мы все — вместе!"
104060-135 = "...Вместе."
104060-136 = "[s] «Да. Они все скоро будут здесь.»"
104060-137 = "Да. Комитет по предотвращению закрытия и Шале."
104060-138 = ""
104060-140 = ""
104060-141 = "[ns] «Так что до тех пор я задержу тебя здесь. И хочу, чтобы ты меня выслушала.»"
104060-142 = "Выслушать вас..."
104060-143 = "Подготавливается ответ. Решение найдено. Начиная с этого момента, направить Утнапиштим по другому маршруту..."
104060-144 = "...Нет, это не сработает."
104060-145 = ""
104060-147 = ""
104060-148 = "Эта сцена будет просто повторяться с тем же результатом. Сенсей вместе со своими студентами преодолеет любой кризис."
104060-149 = "Объединяться с другими и сражаться вместе... Теперь я понимаю силу вашей стратегии."
104060-150 = "Сенсей обладает способностью создавать такие чудеса."
104060-151 = ""
104060-153 = ""
104060-155 = ""
104060-156 = "Теперь ясно. Чтобы мы добились успеха, сначала нужно избавиться от Сенсея."
104060-157 = "После этого можно будет снова запустить самоуничтожение Ковчега и проявление Ложных Санктумов."
104060-158 = "Если Сенсей будет устранён."
104060-159 = "Без Сенсея всё рухнет."
104060-160 = "Поэтому мы сосредоточим все силы на этой битве — здесь и сейчас."
104060-161 = ""
104060-163 = ""
104060-164 = ""
104060-165 = ""
104060-166 = "...Инструкции получены. Поняла. Вычислительная поддержка Ковчега Шиттим остановлена. Переключение в режим боевой поддержки."
104060-167 = ""
104060-169 = ""
104060-172 = "[ns] «Всё вокруг изменилось...?»"
104060-173 = "Все мощности перенаправлены на боевую поддержку."
104060-174 = "[s1] «Арона! Твой выход!»\n[s2] «Со мной невероятно талантливая Арона!»"
104060-177 = "Да! Супер-Арона здесь, чтобы помочь вам, Сенсей!"
104060-178 = "Если кто-то попытается навредить Сенсею [USERNAME], я ему этого не прощу. Кто бы это ни был!"
104060-179 = "Я не позволю причинить Сенсею вред."
104060-180 = "Логично... Похоже, хотя бы чувства у вас одинаковые."
104060-181 = "Но условия не в вашу пользу, Сенсей. Наш боевой опыт превосходит всё, что вы можете представить."
104060-182 = "У нас обеих одинаковый Ковчег Шиттим, но вы не сможете преодолеть разницу в опыте."
104060-183 = "[ns3] «...»\n[ns4] Достать кредитную карту."
104060-186 = ""
104060-187 = "Да. У вас есть это."
104060-188 = "С помощью этой вещи возможно вырвать победу, невзирая на текущие условия."
104060-189 = "Но... вы забыли, Сенсей?"
104060-190 = "Забыли, кем является стоящий перед вами Френапатес?"
104060-191 = ""
104060-193 = ""
104060-194 = ""
104060-199 = "С-Сенсей...?! Френапатес что-то достаёт!"
104060-200 = "Э-Это...?!"
104060-203 = "...?!"
104060-204 = "[ns] «...!»"
104060-205 = "Кредитная карта против кредитной карты..."
104060-206 = "Пусть победит сильнейшая карта."
104060-208 = "Следующий эпизод; Та же ситуация, тот же выбор"
