[translation]
52190-1 = "Episódio 19;Memórias da Outra Margem"
52190-5 = "Tem mesmo um \"Templo do Crepúsculo\" por aqui?"
52190-6 = "...Sim, é por aqui."
52190-7 = "Mesmo num campo de neve assim, ainda há marcos no caminho."
52190-8 = "As árvores cobertas de neve, o rio congelado... até aquela colina."
52190-9 = "A paisagem... é igualzinha à daquela vez."
52190-10 = "Essa sua mania esquisita por detalhes até que serve pra alguma coisa nessas horas, hein, Nagusa-chan?"
52190-11 = "Bom, vamos indo?"
52190-18 = "...Será que ela comeu alguma coisa estragada?"
52190-19 = "Soltar a gente do nada... O que será que ela tá tramando?"
52190-20 = "Quem sabe. Mas não dá para confiar no Clube Beleza da Natureza."
52190-21 = "Com certeza tem algo por trás disso."
52190-22 = "Eu também concordo... Afinal, foram elas que trouxeram o caos para Hyakkiyako. Não podemos confiar nelas."
52190-23 = "Só que... não sei bem por quê, mas sinto que ela está agindo por conta própria."
52190-24 = "Talvez a gente consiga escapar da vigilância do Clube Beleza da Natureza."
52190-25 = "Ora, ora... Não estão pensando em fugir, estão?"
52190-26 = "Nem pensem numa bobagem dessas, tá?#nNão importa o quão rápido corram, vocês não vão escapar de mim."
52190-27 = "Além disso... o cano da minha arma pode acabar apontando sem querer pra cabeça do Sensei...#nVai que acontece, né?"
52190-28 = "...Hmph."
52190-30 = "[ns] \"Ah, então eu que sou o refém?\""
52190-31 = "Hã?"
52190-32 = "Mesmo manipulando as alunas com uma única palavra,#nvocê não aguenta nem um tirinho, né?#nÓbvio que todo mundo vai mirar em você primeiro."
52190-33 = "E mesmo assim, sai se jogando sem nem pensar na própria pele. Sério..."
52190-46 = "...Que tolice."
52190-47 = "[s] \"Para proteger alguém, a minha própria força não importa.\""
52190-48 = "Ah, lá vem você com isso de novo..."
52190-49 = "Um fraco que não consegue nem se defender tentando proteger os outros... isso faz mesmo algum sentido?#nVocê só vai cair morto antes de quem tentou proteger, e fim de papo."
52190-50 = "Que lógica é essa pra fazer uma coisa dessas?#nNão faz o menor sentido!"
52190-51 = "[s1] \"Como eu já disse antes, meu corpo se mover ao ver alguém em perigo...\"\n[s2] \"Antes de ser racional ou normal...\"\n[s3] \"É simplesmente o natural para um ser humano.\""
52190-55 = "Na... tural...?"
52190-56 = "Uma coisa dessas..."
52190-57 = "Não tem nada de natural nisso!"
52190-61 = "Haa... haa..."
52190-62 = "Isso é ridículo, ridículo demais..."
52190-63 = "Vamos logo pro Templo do Crepúsculo...#nE nem pensem em tentar fugir, ouviram?"
