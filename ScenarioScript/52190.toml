[translation]
52190-1 = "Эпизод 19;Воспоминания из Запределья"
52190-4 = ""
52190-5 = "Значит, если продолжим идти сюда, действительно доберёмся до Сумеречного храма?"
52190-6 = "...Да. Ошибки быть не может."
52190-7 = "Даже в этой ледяной пустоши эти ориентиры врезались мне в память."
52190-8 = "Заснеженные деревья, замёрзшая река и тот холм впереди..."
52190-9 = "Да. Всё точь-в-точь как тогда."
52190-10 = "Иногда твоя странно хорошая память всё-таки полезна!"
52190-11 = "Ладно, тогда быстрее! Идём к Сумеречному храму."
52190-12 = ""
52190-14 = ""
52190-17 = ""
52190-18 = "...Что с ней? Чего вдруг?"
52190-19 = "Ни с того ни с сего отпускает нас, а теперь это? Что она задумала?"
52190-20 = "Я не могу определить её скрытые мотивы, но совершенно не доверяю «Красоте природы»."
52190-21 = "Не дайте ей вас обмануть. Мы всего лишь игрушки в её нелепой игре."
52190-22 = "Согласна. После того, как она говорила о Нагусе, верить ей нельзя! Протянутая рука — лишь очередной трюк."
52190-23 = "Однако... судя по всему, сейчас она действует по собственной воле."
52190-24 = "А это может дать нам шанс сбежать."
52190-25 = "О-хо? Решили придумать какую-нибудь глупость, раз теперь мы снаружи?"
52190-26 = "Даже не думайте. Какими бы быстрыми себя ни считали, я вас поймаю."
52190-27 = "Стоит вам только подумать о чём-то подозрительном — и голова Сенсея станет отличным местом для пули."
52190-28 = "Как же ты любишь разбрасываться пустыми угрозами..."
52190-29 = ""
52190-30 = "[ns] «О, так заложник здесь я?»"
52190-31 = "...А? Разумеется."
52190-32 = "Да, ты одним словом можешь командовать студентами Кивотоса, но тебя убьёт одна пуля. В кого ещё мне целиться?"
52190-33 = "Ты такой хрупкий... и всё равно инстинктивно бросаешься в опасность ради учеников. Абсурд."
52190-35 = ""
52190-38 = ""
52190-41 = ""
52190-45 = ""
52190-46 = "...Я тебя совершенно не понимаю."
52190-47 = "[s] «Личные ограничения не имеют значения, когда нужно кого-то защитить.»"
52190-48 = "*вздох*... Опять за своё. Ещё как имеют."
52190-49 = "Ты даже себя защитить не можешь. Чего надеешься добиться, бросаясь перед кем-то сильнее тебя? Что сделаешь, если умрёшь?"
52190-50 = "В этом нет никакой логики. Твои действия бессмысленны."
52190-51 = "[s1] «Как я уже сказал, когда видишь ребёнка в опасности — это инстинкт.»\n[s2] «Рациональность и здравый смысл здесь ни при чём.»\n[s3] «Люди просто так поступают.»"
52190-55 = "...Почему ты говоришь так, будто это очевидно?"
52190-56 = "Это... Это..."
52190-57 = "ЭТО ВООБЩЕ НЕ ОЧЕВИДНО!!"
52190-58 = ""
52190-60 = ""
52190-61 = "*тяжело дышит* *тяжело дышит*"
52190-62 = "Мы потратили слишком много времени на бессмысленный разговор."
52190-63 = "Пойдём уже к Сумеречному храму. И не забывайте: одна мысль о побеге — и... БАХ."
52190-64 = ""
