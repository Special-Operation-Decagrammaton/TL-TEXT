52130-3 = "Onde está a Yukari?"
52130-7 = "Deve estar lá no escritório."
52130-8 = "...O que houve?"
52130-9 = "É uma armadilha. Rápido, temos que ir até a Yukari—"
52130-13 = "Não... precisamos ir até o Sensei [USERNAME]!"
