[translation]
80000035-1 = "Да, я их сделала"
80000035-3 = "Хм. Этот документ можно отправлять."
80000035-4 = ""
80000035-8 = "[ns] «Ако, куда складывать готовые документы?»"
80000035-9 = "В ту корзину, пожалуйста."
80000035-10 = "Хи-хи. Спасибо, что помогаете мне в самый загруженный период."
80000035-11 = "На кого ещё мне рассчитывать в трудную минуту, как не на ВАС, Сенсей."
80000035-12 = "[s] «Звучит немного саркастично.»"
80000035-13 = "На этот раз нет. У меня сейчас нет времени на подколы."
80000035-14 = "Вот ваша награда за последний файл."
80000035-16 = "[s] «О, шоколад.»"
80000035-17 = "Хорошо. Перерыв окончен. Пожалуйста, продолжайте работать."
80000035-21 = "[ns] «Я закончил ещё один.»"
80000035-22 = "Хорошая работа. Ещё одна шоколадка."
80000035-23 = "[s] «Спасибо.»"
80000035-26 = "Вот ваша шоколадная награда."
80000035-30 = "Отличная работа! Ещё шоколадка."
80000035-35 = "И ещё одна шоколадка..."
80000035-37 = "Получив от Ако шесть шоколадок, я наконец набрался смелости задать мучивший меня вопрос."
80000035-40 = "[ns] «Кстати. Ты сама их сделала?»"
80000035-41 = "*ах*! Как...?! Как вы...?!"
80000035-42 = "Как вы вообще поняли?!"
80000035-43 = "[s1] «Это было очевидно уже по первой шоколадке.»\n[s2] «Мне стало любопытно, потому что они очень красиво выглядят.»"
80000035-44 = "Вы всё это время знали?! И делали вид, что ничего не замечаете?"
80000035-45 = "Вы всё это время знали?! И делали вид, что ничего не замечаете?"
80000035-46 = "Какой же вы хитрый!"
80000035-47 = "[s] «Мне просто нравилось, что ты их мне даёшь.»"
80000035-48 = "Н-Ну ладно. Наверное, в любом случае это не так важно."
80000035-49 = "В общем..."
80000035-50 = "Раз теперь вы знаете, что я их сделала, тем более наслаждайтесь."
80000035-51 = "Я, между прочим, очень старалась."
80000035-52 = "[s] «Может, съедим их вместе? Я сварю кофе.»"
80000035-53 = ""
80000035-55 = ""
80000035-56 = "*вздох* Наверное, перерыв мне не помешает."
80000035-57 = "Мне эспрессо."
80000035-59 = "Мы пили кофе и ели шоколад, пока Ако продолжала жаловаться на работу."
