[translation]
1601905-1 = "Улучшение"
1601905-2 = "Как вам уже известно, я получила улучшенное оружие."
1601905-3 = "Именно «улучшенное». «Усовершенствованное»."
1601905-4 = "[s] «Да. Это правда.»"
1601905-5 = "Да. Речь об этих двух энергетических пистолетах. Вы это тоже знаете. Я часто ими пользуюсь."
1601905-6 = "Как следует из названия, это энергетическое оружие."
1601905-7 = "При наличии бесконечного источника энергии такое оружие можно использовать бесконечно, пока не будет достигнут предел прочности конструкции."
1601905-8 = "Иными словами, у меня бесконечные боеприпасы."
1601905-9 = "К тому же это парные пистолеты. По одному в каждой руке."
1601905-10 = "Сенсей. Разве вы ничего не чувствуете, слыша это?"
1601905-11 = "[s1] «Бесконечные патроны... Парные пистолеты... Уф, голова...!»\n[s2] «Н-Не особо...?»"
1601905-14 = "Это не моё личное мнение, но на недавнем стриме мне сообщили, что это идеальное сочетание. «Билд», как там говорят."
1601905-15 = "Полагаю, я достигла статуса «Первая и Совершенная Асума Токи». Ура."
1601905-16 = "[s] «Так что на самом деле происходит...?»"
1601905-17 = "Ничего важного."
1601905-18 = "Просто мимолётная мысль..."
1601905-19 = "Сенсей. Как вам известно, в моём распоряжении есть различное вооружение."
1601905-20 = "В том числе перчатка, которую я часто использую во время операций проникновения."
1601905-21 = "Поэтому я была бы рада улучшить её энергетической оружейной системой."
1601905-22 = "Мне кажется, оптимизировать как можно больше вещей было бы «круто»..."
1601905-23 = "...«весело»..."
1601905-24 = ""
1601905-26 = ""
1601905-27 = ""
1601905-28 = "...и «полезно» для усиления наших сил."
1601905-29 = "[s] «Кажется, два твоих настоящих желания только что вырвались наружу!»"
1601905-30 = "Вы ослышались."
1601905-31 = "[s] «Правда?! А я и не заметил!»"
1601905-32 = "Хорошо. Вы абсолютно правы."
1601905-33 = "Хм? Почему вы так выдохнули? Знайте, есть поговорка, что частые вздохи уменьшают удачу."
1601905-34 = "Но, полагаю, это не проблема, ведь я — счастливая кроличья горничная, агент-разведчик — всегда рядом."
1601905-35 = "[s] «...Так что именно ты хочешь улучшить...?»"
1601905-36 = "Верно. Мы как раз об этом говорили."
1601905-37 = "До того как встретила вас, Сенсей..."
1601905-38 = "Если установить в мою перчатку энергетическую оружейную систему, в основном для стрельбы небольшими снарядами..."
1601905-39 = "Разве тогда я не смогу выполнять ракетный удар этой перчаткой?"
1601905-40 = "[s] «Ракетный кулак!»"
1601905-41 = "Как и ожидалось от Сенсея. Я знала, что вам будет интересно."
1601905-42 = "Что скажете, Сенсей? Разве это не буквально лучшая идея из возможных?"
1601905-43 = "Пожалуйста, признайте это и хвалите меня сколько душе угодно."
1601905-44 = "Разве вы не хотите увидеть, как я запускаю ракетные кулаки?"
1601905-45 = "Даже если вы лично не хотите видеть такие подвиги, я хочу. Поэтому скорее одобрите идею."
1601905-46 = "[s] «Но сначала один вопрос.»"
1601905-47 = "Что такое, Сенсей?"
1601905-48 = "[s] «Почему ты вообще пытаешься получить моё разрешение?»"
1601905-49 = ""
1601905-51 = ""
1601905-52 = "..."
1601905-53 = "..."
1601905-54 = "..."
1601905-55 = "[s] «Токи. Посмотри мне в глаза.»"
1601905-56 = "Хорошо, Сенсей."
1601905-57 = "[s] «И ответь честно.»"
1601905-58 = "..."
1601905-59 = "[s] «Почему теперь отводишь взгляд?»"
1601905-60 = ""
1601905-62 = ""
1601905-63 = "Похоже, мне придётся рассказать."
1601905-64 = "Потому что госпожа Рио и президент Химари не дали мне разрешения по так называемым «соображениям безопасности»."
1601905-65 = "Причина в том, что жар и давление ускорителя с высокой вероятностью могут вызвать ожоги."
1601905-66 = "[s] «Тогда тебе и правда не стоит этого делать.»"
1601905-67 = "Сенсей."
1601905-68 = "Разве вы не считаете, что небольшими потерями и рисками можно пренебречь ради большего блага?"
1601905-69 = "Неужели вы не считаете это потенциально «малой потерей» ради очень великого, совершенного, потрясающего блага?"
1601905-70 = "..."
1601905-71 = "Вам риск может казаться не маленьким, но для меня он именно такой. Поэтому, пожалуйста, выдайте мне соответствующее разрешение."
1601905-72 = "[s] «Нет.»"
1601905-73 = "Сенсей..."
1601905-74 = "[s] «Даже если будешь так на меня смотреть, „нет“ значит „нет“.»"
1601905-75 = "Тогда хотя бы разрешите установить ручную пушку высокой мощности."
1601905-76 = "А если она сможет стрелять очередями по три выстрела и получит улучшенный усиленный заряд?"
1601905-77 = "[s] «Отка-а-азано.»"
1601905-78 = "Сенсей..."
1601905-80 = "Потребовалось некоторое время, чтобы Токи перестала дуться."
1601905-81 = "В конце концов она смирилась. Для этого понадобилось много объятий и поглаживаний по голове."
