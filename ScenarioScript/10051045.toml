10051045-7 = "М-Мы их победили..."
10051045-8 = "Хи-хи-хи, всё было предсказано! Последними на ногах остаются немногие, гордые — ниндзя!"
10051045-9 = "Отличная работа, все! Нин-нин!"
10051045-10 = "[s] «Никто не пострадал, да?»"
10051045-11 = "Да, благодаря Сенсею все в порядке."
10051045-12 = "Если Сенсей имеет в виду только НАС, то да... Никто не пострадал."
10051045-13 = "Но вообще, насколько они были серьёзны? Кто приводит целую банду, чтобы украсть чью-то одежду?"
10051045-14 = "Президент! Может, сначала заберём украденное платье?"
10051045-15 = "А, точно! Платье дизайнера Шайнкэт! Это был главный приоритет!"
10051045-17 = "Полагаю, оно вон в том чехле для одежды. Вор держала его так бережно. Наверняка это оно."
10051045-18 = "К счастью, чехол вроде не повреждён."
10051045-19 = "Хорошо, вот и всё. Посылка в безопасности."
10051045-20 = "...Стоп, а кто эта женщина, корчащаяся на земле?"
10051045-21 = ""
10051045-23 = ""
10051045-24 = "..."
10051045-25 = "А...? Её здесь не было до того, как мы начали драться."
10051045-26 = "Изуна тоже её раньше не видела!"
10051045-27 = "Ой, её задело в драке?"
10051045-28 = "Нужно оказать ей помощь."
10051045-29 = ""
10051045-31 = ""
10051045-33 = "Вы, нашли моё платье?"
10051045-34 = "Хм? Да. Оно в этом чехле."
10051045-35 = "Ах, моя работа. Мой шедевр снова в безопасности. Великолепно."
10051045-36 = "Посмотрим... Хм? Прошу прощения, мисс. Я чуть на вас не наступил. Постойте..."
10051045-37 = ""
10051045-39 = ""
