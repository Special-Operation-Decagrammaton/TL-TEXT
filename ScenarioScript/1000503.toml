[translation]
1000503-1 = "Ленивое утро"
1000503-2 = "Комната Комитета по предотвращению закрытия"
1000503-3 = "Я вернулся проверить Хошино, но там никого не было."
1000503-4 = "Хр-р... *храп*"
1000503-5 = "Из соседнего класса доносился чей-то звук."
1000503-6 = "[s] Перейти в соседний класс."
1000503-8 = "Клубная комната Абидоса"
1000503-9 = "..."
1000503-10 = "*храп* Хр-р..."
1000503-11 = "(Хошино лежит на импровизированной кровати из нескольких сдвинутых вместе парт.)"
1000503-12 = "[s] Разбудить её."
1000503-15 = "...Х-Хм?"
1000503-18 = "У-Уа! Вы меня напугали!"
1000503-19 = "Сенсей? Что вы здесь делаете?"
1000503-20 = "[s] Попытаться объяснить."
1000503-21 = "...Я отправила вам сообщение, поэтому вы пришли мне помочь?"
1000503-22 = "Хех. Наверное, отправила во сне или что-то такое. Моя вина."
1000503-23 = "Я вроде смогла проснуться и прийти на занятия, но дальше почти ничего не помню..."
1000503-24 = "Похоже, уснула прямо здесь. Хех. Ну и дела."
1000503-25 = "Вы пришли, потому что волновались за меня. Не думала, что доживу до такого дня. Я тронута."
1000503-26 = "Раз уж вы здесь, почему бы не отправиться со мной на поиски сокровищ, Сенсей?"
1000503-27 = "Ну же, будет весело. Пойдём прочёсывать заросли на школьном дворе!"
1000503-29 = "Я три часа прочёсывал заросли на школьном дворе, но безрезультатно."
1000503-30 = "После этого покрытая пылью Хошино попрощалась со мной, и я вернулся в Шале."
