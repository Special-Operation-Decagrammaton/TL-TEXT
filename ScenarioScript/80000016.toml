[translation]
80000016-1 = "Прослушка под прикрытием"
80000016-2 = "Офис Шале"
80000016-3 = "Я ждала вас, Сенсей."
80000016-4 = "Сегодня День святого Валентина — день, когда девушки дарят шоколад тем, кого любят, признаваясь в чувствах."
80000016-5 = "Поэтому я приготовила для вас подарок."
80000016-6 = ""
80000016-8 = ""
80000016-9 = ""
80000016-10 = ""
80000016-11 = "Вот этот шоколадный маффин."
80000016-12 = "Вы его примете?"
80000016-13 = "Из маффина совершенно очевидно торчит устройство для прослушки."
80000016-14 = "[s] «Эм, спасибо, но... что вот это такое?»"
80000016-15 = "А, это. Эм..."
80000016-16 = "Если вы про гаджет, засунутый в маффин,#nто это просто украшение."
80000016-17 = "И всё. Это вовсе не прослушка для записи звука, если вы об этом подумали."
80000016-18 = "[s] «Почему ты постоянно прячешь прослушку в еде?»"
80000016-19 = "П-Потому что остальные мои подарки с прослушкой вы отвергали..."
80000016-20 = "Я подумала, что спрятать её в еде будет эффективнее."
80000016-21 = "[s1] «Выглядит не очень безопасно.»\n[s2] «А если я случайно проглочу жучок?»"
80000016-22 = "Справедливое замечание. Если вы случайно проглотите устройство, я смогу записывать лишь урчание вашего желудка, а не голос."
80000016-23 = "Справедливое замечание. Если вы случайно проглотите устройство, я смогу записывать лишь урчание вашего желудка, а не голос."
80000016-24 = "Хм. Урчание вашего желудка..."
80000016-25 = "Полагаю, наблюдать за этим тоже было бы неплохо."
80000016-26 = ""
80000016-28 = ""
80000016-29 = "Сенсей, откройте рот пошире."
80000016-30 = "[s] «Что ты задумала...?»"
80000016-31 = "Ничего. Я лишь собиралась разместить прослушку."
80000016-32 = "Не волнуйтесь. Здоровью она не повредит."
80000016-33 = "Прослушка специально рассчитана на установку в еду, поэтому нетоксична.#nОна даже не заржавеет, не говоря уже о том, чтобы вызвать болезнь."
80000016-34 = "И она достаточно маленькая, чтобы вы могли проглотить её с водой, как таблетку."
80000016-35 = "Так что, пожалуйста, откройте рот!"
80000016-36 = "[s] «Убери от меня эту штуку!»"
80000016-38 = "Некоторое время мне пришлось отбиваться от Котамы, чтобы не допустить прослушку в пищеварительную систему."
