[translation]
10052015-2 = ""
10052015-3 = "..."
10052015-4 = "..."
10052015-5 = "В-в-вы только что это видели, Мидори?! Прямо сейчас! Перед нами!"
10052015-6 = "Видела... Оно огромное! И извивалось, двигало всей этой массой, и...!"
10052015-7 = "Мы... сможем потом безопасно выбраться...?"
10052015-8 = "Не нужно бояться. С нами Сенсей."
10052015-9 = "Ага. Всё должно быть нормально."
10052015-10 = "К-как вы можете быть такими спокойными...?"
10052015-11 = "М-м, причин несколько."
10052015-12 = "Но я уже сталкивалась с Биной раньше. Я знакома с её повадками."
10052015-13 = ""
10052015-14 = "[ns] «Кстати, а как мы добудем ядро Бины?»"
10052015-15 = "Да. Насчёт этого... как бы сказать...?"
10052015-16 = "В общем, нам придётся спуститься в яму. Я фиксирую сигнал ядра там внизу."
10052015-17 = "Что?! Ты хочешь, чтобы мы туда прыгнули?!"
10052015-18 = "Н-нам придётся делать так... и с другими пророками, Сенсей?"
10052015-19 = "Я могу ответить. Скорее всего, нет. Похоже, Бина — особый случай, для которого потребовались дополнительные меры безопасности."
10052015-20 = "Д-да... Подземная физическая защита, буквально..."
10052015-21 = "Даже так спускаться на верёвках, как при скалолазании, было бы неэффективно."
10052015-22 = "Президент, на транспортном корабле должен быть небольшой вспомогательный летательный аппарат, верно? Запрашиваю развёртывание."
10052015-23 = "Он уже в пути."
10052015-24 = "...Хотя за штурвалом Рио. Она настояла."
10052015-25 = "Госпожа Рио уже летит сюда?"
10052015-26 = "Да. Она обнаружила узлы безопасности и файрволы, которые нельзя взломать удалённо. Поэтому..."
10052015-27 = "...она сочла самым логичным спуститься туда лично."
10052015-28 = "...В духе Рио."
10052015-31 = "Вскоре прибыл небольшой вспомогательный летательный аппарат."
10052015-32 = "Выйдя из кабины, Рио склонила голову, заметив недоверчивые лица остальных."
