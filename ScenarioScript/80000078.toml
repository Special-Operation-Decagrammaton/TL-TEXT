[translation]
80000078-1 = "Шоколад хорошего ныряльщика"
80000078-2 = "Где-то на Чёрном рынке"
80000078-3 = "Получив сообщение от Саори, я поспешил к месту встречи."
80000078-4 = "О, привет, Сенсей."
80000078-5 = "Я рада, что мы успели увидеться до конца дня."
80000078-6 = "[s] «Саори? Что происходит?! Что случилось?!»"
80000078-7 = "О... Ничего."
80000078-8 = "...Но понимаю, что с моим нынешним видом вас этим не убедить."
80000078-9 = "Поэтому скажу лишь... Всё это было ради сегодняшнего долга."
80000078-10 = "[s] «Что ты имеешь в виду под долгом?!»"
80000078-11 = "Именно то, что означает это слово."
80000078-12 = "Вот. Возьмите."
80000078-13 = ""
80000078-15 = ""
80000078-17 = "[ns] «...Шоколад? И, похоже, дорогой бренд...»"
80000078-18 = "Да. Мне сообщили, что сегодня именно такой день."
80000078-19 = "День, когда человеку, перед которым у тебя есть долг, дарят шоколад в знак благодарности."
80000078-20 = "Кажется, он называется Днём святого Валентина."
80000078-21 = "[s1] «То есть... ты права, но... ты в порядке?»\n[s2] «Но как ты так сильно поранилась?»"
80000078-22 = "Во время заказов я работала усерднее обычного. Всё стало... грязно."
80000078-23 = "Во время заказов я работала усерднее обычного. Всё стало... грязно."
80000078-24 = "Я не знала, что шоколад может стоить настолько дорого."
80000078-25 = "Но мне сказали, что если шоколад не высшего качества..."
80000078-26 = "...он не сможет должным образом выразить благодарность."
80000078-27 = "А если выбрать неподходящий подарок, это означает желание прекратить отношения."
80000078-28 = "По-видимому, некоторые даже дарят врагам дешёвый шоколад как оскорбление, а порой используют это как объявление войны..."
80000078-29 = "Трудно поверить, что для живущих во внешнем мире всё это просто здравый смысл."
80000078-30 = "Но раз я тоже решила жить во внешнем мире, мне следует придерживаться этих правил."
80000078-31 = "Что думаете, Сенсей?"
80000078-32 = "Этот шоколад достаточно хорош?"
80000078-33 = "Ваше выражение лица... меня беспокоит."
80000078-34 = "[s] «Кто...»"
80000078-35 = "Д-Да?"
80000078-36 = "[s] «Кто рассказал тебе такую чушь?!»"
80000078-37 = "С-Сенсей?!"
80000078-39 = "П-Понятно... Наверное, я неправильно поняла."
80000078-40 = "Простите за беспокойство."
80000078-41 = "[s3] «Нет, тебе совершенно не за что извиняться!»\n[s4] «Во всём виноваты нечестные владельцы магазина...»"
80000078-42 = "В любом случае я не знала, что шоколад можно делать самостоятельно."
80000078-43 = "В любом случае я не знала, что шоколад можно делать самостоятельно."
80000078-44 = "Оказывается, некоторые даже предпочитают домашний шоколад."
80000078-45 = "Так что в следующий раз я приготовлю его сама."
80000078-46 = "[s5] «Тебе не обязательно так утруждаться!»\n[s6] «Меня вполне радует уже сам жест.»"
80000078-47 = "Н-неужели?"
80000078-48 = "Н-неужели?"
80000078-49 = "Эта традиция Дня святого Валентина... запутанная."
80000078-50 = "О, вы хотите поделиться шоколадом со мной?"
80000078-51 = "Но... это же был подарок для вас, Сенсей!"
80000078-52 = "[s] «Я всё равно хочу съесть его вместе с тобой, Саори.»"
80000078-53 = "Ну..."
80000078-54 = "Хорошо. Если вы настаиваете."
80000078-55 = "Я благодарна вам за постоянную поддержку, Сенсей."
80000078-57 = "Мы с Саори разделили дорогой шоколад и редкий свободный момент."
