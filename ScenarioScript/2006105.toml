[translation]
2006105-1 = "Hot Spring Town's Charisma"
2006105-2 = "(I headed to the place Kasumi sent me.)"
2006105-6 = "(I thought she was using an inn as a hideout, but...)"
2006105-10 = "Sensei, over here!"
2006105-11 = "It was a complicated path, wasn't it? Did you get lost?"
2006105-12 = "Hm? What is it, looking all blank."
2006105-13 = "[s1] \"Isn't this... the Black Market...?\"\n[s2] \"It's kind of different from what I expected...\""
2006105-16 = "I see."
2006105-17 = "Your guess is correct. I am temporarily renting space here lately."
2006105-18 = "After all, I am a wanted person. I cannot afford to comfortably stay at a normal inn."
2006105-19 = "That being said, it is not like I am sleeping on the streets, so you can rest easy about that."
2006105-20 = "There are rules here, just like anywhere else."
2006105-21 = "And the Black Market is... well, strictly speaking, not quite."
2006105-22 = "Many people call this place the \"Black Market\", but in reality, it is merely a nameless back alley."
2006105-23 = "Where people gather, places untouched by the sun are bound to form. #nEven in the places Sensei has visited up until now, there are places like this――"
2006105-24 = "Ah, I have been rambling on too much."
2006105-25 = "Since I have taken up Sensei's precious time, I must make good use of it!"
2006105-26 = "Shall we get going, then?"
2006105-27 = "Hm? Our destination? Ah, did I not mention it yet?"
2006105-28 = "The Hot Spring Development Department is on the move."
2006105-34 = "Is it not obvious what we are going to do?"
2006105-38 = "...Yes, confirmation with the intermediary has been completed."
2006105-42 = "Kinugawa Kasumi-sama, you are indeed the person in question, correct? #nI was hoping we could get right down to business..."
2006105-43 = "And who is the adult with you?"
2006105-44 = "Ah, pay them no mind."
2006105-45 = "You intend to have them sit in on the transaction...?"
2006105-46 = "Hm? Did you not hear me?"
2006105-47 = "I said you do not need to worry about them."
2006105-51 = "...Pardon me. #nLet us proceed with the transaction, then."
2006105-52 = "The materials you requested can be arranged immediately. #nThough the quantity is quite large... we will likely need a barge for delivery."
2006105-53 = "Then we carry it out tonight?"
2006105-54 = "Yes. There are restrictions on the date and location, but as for those――"
2006105-57 = "(Kasumi exchanged a quiet discussion with the merchant.)"
2006105-61 = "...Hm, I suppose that is everything. A successful trade. #nIt is just that I had no acquaintances here, so you were a great help."
2006105-62 = "The pleasure is mine, I am glad to have made your acquaintance, Kasumi-sama. Please continue to patronize us."
2006105-63 = "Of course."
2006105-67 = "Now Sensei, let us move on to the next place."
2006105-68 = "[s3] \"Umm...\"\n[s4] \"What kind of transaction was that?\""
2006105-71 = "Nothing strange."
2006105-72 = "Hot spring development requires materials, does it not?"
2006105-73 = "Of course, I normally use standard routes. #nMy wallet would not survive if I had to do this every time."
2006105-74 = "However, this time the Prefect Team confiscated all of them."
2006105-75 = "Under such circumstances, I could hardly use the usual routes, could I?"
2006105-76 = "So I am buying things that do not exist with money that does not exist."
2006105-77 = "We are working for the sake of society, yet the Prefect Team is far too rigid. #nHa-ha-ha-ha-ha!"
2006105-78 = "[s5] \"For the sake of society...?\"\n[s6] \"It really is just materials, right?\""
2006105-81 = "Why would I lie to Sensei?"
2006105-82 = "Or perhaps... the very fact that a student comes to the Black Market #nmakes me a lost cause in Sensei's eyes."
2006105-83 = "Hm? That is not really... Uh, ah, I see..."
2006105-84 = "Wait, is this not abnormal...?"
2006105-85 = "Well, never mind that! Let us head to the next location!"
2006105-92 = "Yo! What are you doing in a place like this?"
2006105-93 = "Boss, I thought you got caught by the Prefect Team?"
2006105-94 = "I got out right away. A model prisoner like me is quite a rare sight."
2006105-95 = "Pfft! That sounds so cool!"
2006105-96 = "How have you been?"
2006105-97 = "Same as always. Picking up unexploded shells and cartridge cases, occasionally borrowing some building materials. #nBasically living on a mountain of junk."
2006105-98 = "Well, that is my line of work, after all. #nSo, what do you need today?"
2006105-99 = "It is faster to just show you. Here, the list."
2006105-104 = "Ooh, as expected of someone rolling in cash! Just wait. I will get it ready right away."
2006105-105 = "I am counting on you."
2006105-106 = "And... well, have you thought about it?"
2006105-107 = "Hm?"
2006105-108 = "About that project. I am still getting offers from all over. You could make a fortune, you know?"
2006105-109 = "I told you before that I would not do it."
2006105-110 = "Such a waste when you have got such skills..."
2006105-111 = "Why get hooked on something so nonsensical..."
2006105-112 = "Hm?"
2006105-113 = "Hot springs do not make money, do they? If it were you, Boss, you could do something much bigger--"
2006105-117 = "Now, now."
2006105-122 = "--you are talking too much, aren't you?"
2006105-126 = "O-Ooh... My bad."
2006105-128 = "There is no need to be scared, is there?"
2006105-129 = "We are business partners, aren't we? Come on, smile, smile."
2006105-130 = "A-Ah, y-yeah. I suppose so."
2006105-131 = "To get back to the topic--"
2006105-134 = "(After that, I accompanied Kasumi on her other 'shopping' trips.)"
2006105-138 = "Thank you for your help today. With this, our next development should proceed smoothly."
2006105-142 = "...Sensei? Is something the matter?"
2006105-143 = "[s7] \"No, I was just thinking lately...\"\n[s8] \"Kasumi, you have so many different sides to you.\""
2006105-146 = "Because it is advantageous."
2006105-147 = "There is no reason not to utilize a tool called 'myself'."
2006105-148 = "[s] \"Is that really okay?\""
2006105-149 = "Meaning?"
2006105-150 = "[s9] \"Adapting yourself to everyone else means...\"\n[s10] \"You are never showing your true feelings.\""
2006105-153 = "[ns11] \"I just thought it must be hard on you.\"\n[ns12] \"That is why I am worried.\""
2006105-158 = "Worried, you say."
2006105-159 = "When you say that to me, Sensei, I cannot even argue."
2006105-160 = "If my understanding is correct--"
2006105-161 = "You are telling me I can bare my true feelings in front of Sensei. #nI took that as a heartwarming word of encouragement, am I right?"
2006105-166 = "...If that is what you wish, shall I put it into practice?"
2006105-169 = "[wa:1900]-- [log=카스미 수영복]You know, don't you?[/log]"
2006105-171 = "-- [log=카스미 수영복]The security around here [wa:600]is terrible.[/log]"
2006105-174 = "-- [log=카스미 수영복]If a single person were to vanish, [wa:2160]no one would even notice.[/log]"
2006105-177 = "[wa:750]-- [log=카스미 수영복]You are lacking in thoroughness, [wa:1640]Sensei.[/log]"
2006105-179 = "-- [log=카스미 수영복]Knowing the one, [wa:880]but not the two, [wa:1030]as they say.[/log]"
2006105-182 = "[wa:580]-- [log=카스미 수영복]The more Sensei tries [wa:1320]to save me...[/log]"
2006105-184 = "-- [log=카스미 수영복]The better of a pawn [wa:2090]you become to me.[/log]"
2006105-187 = "[wa:540]-- [log=카스미 수영복]And--[wa:1250]the more it is like that,[/log]"
2006105-189 = "-- [log=카스미 수영복]the more human nature compels you [wa:1390]to want to obtain it.[/log]"
2006105-192 = "[wa:510]-- [log=카스미 수영복]You said you wanted to know [wa:1490]my true nature, didn't you...?[/log]"
2006105-194 = "-- [log=카스미 수영복]How do you like it?[/log]"
2006105-197 = "-- [log=카스미 수영복]Even if you say you want to turn back--[wa:2970]it is already too late.[/log]"
2006105-200 = "[wa:1900]-- [log=카스미 수영복]...Surprise![/log]"
2006105-203 = "-- [log=카스미 수영복]Seemed convincing enough, didn't it?[/log]"
2006105-205 = "-- [log=카스미 수영복]Do not make such a scary face. [wa:2610]It was a joke.[/log]"
2006105-208 = "What I mean is that such a thing is entirely possible."
2006105-209 = "Just because someone is always smiling does not mean they do not harbor some tremendous darkness underneath."
2006105-210 = "...You might live to regret it if you carelessly pry too deep, you know?"
2006105-211 = "Well, I am exactly as I appear, though! Ha-ha-ha-ha-ha!"
