[translation]
1000105-1 = "Исследование трендов 2"
1000105-2 = "Город Кивотос"
1000105-3 = "Привет, Сенсей. Я только что узнала кое-что новое."
1000105-4 = "По словам моих школьных друзей, сейчас стало популярно вместе ходить в караоке."
1000105-5 = "Я не очень понимаю, что весёлого в том, чтобы петь вместе в маленькой комнате..."
1000105-6 = "...но делать выводы, не попробовав самой, было бы неэффективно."
1000105-7 = "Итак, Сенсей. Пойдём вместе в караоке."
1000105-8 = "[s] «Разве с друзьями не было бы веселее?»"
1000105-9 = "Это не вариант. Караоке — опасное место."
1000105-10 = "[s] «И что именно опасного в караоке?»"
1000105-11 = "Маленькое закрытое звукоизолированное помещение. Мы будем отрезаны от внешнего мира."
1000105-12 = "Если на нас там нападут... у меня не будет шансов."
1000105-13 = "Поэтому логично пойти с Сенсеем — моим надёжным товарищем."
1000105-14 = ""
1000105-15 = "Ну что, пойдём петь... то есть исследовать это ваше караоке."
1000105-17 = "После этого мы с Эйми от души попели в караоке."
1000105-18 = "Я удивился, насколько хорошо Эйми умеет петь..."
