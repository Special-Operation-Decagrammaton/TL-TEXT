[translation]
1004703-1 = "То, что я хочу вам показать"
1004703-2 = "Я пришла, Сенсей."
1004703-3 = "[s] «Ты хотела мне что-то показать?»"
1004703-4 = "Это самое удивительное, что я когда-либо видела."
1004703-5 = "Повсюду сияние."
1004703-6 = "Я хотела показать его вам."
1004703-7 = "Нельзя терять время."
1004703-8 = "Пойдём, Сенсей."
1004703-9 = ""
1004703-11 = ""
1004703-12 = "Вон там."
1004703-13 = ""
1004703-27 = "[ns] «Мы уже довольно далеко. Что мы ищем?»"
1004703-28 = "Вот это. Прямо здесь."
1004703-29 = ""
1004703-32 = "Кви-и..."
1004703-33 = "[s] «Черепахи? Хотя... целая армия черепах??»"
1004703-34 = "Я увидел огромное количество черепах. Назвать их армией вовсе не было преувеличением."
1004703-35 = "Место, которое Чисэ нашла за скалами на морском берегу, похоже, было местом отдыха черепах."
1004703-37 = "Разве не удивительно?"
1004703-38 = "[s] «Если ты так считаешь.»"
1004703-39 = "Я искала сияние по всему пляжу."
1004703-40 = "А потом нашла это место."
1004703-41 = ""
1004703-43 = ""
1004703-44 = "Интересно, почему все черепахи собираются именно здесь."
1004703-45 = "Наверное, они пришли из подводного дворца."
1004703-46 = "[s] «Черепахи живут во дворце?»"
1004703-47 = "Конечно, Сенсей. Все черепахи родом из подводного дворца."
1004703-48 = "Потом они вместе уходят большой группой."
1004703-49 = "И выбрасываются на далёкий берег."
1004703-50 = "Если кто-то будет добр к черепахам, они в благодарность отведут его в подводный дворец."
1004703-51 = "[s] «О, прямо как в сказке...»"
1004703-52 = "Но президент Ния сказала, что, когда попадаешь в подводный дворец, там заставляют что-нибудь купить."
1004703-53 = "[s] «В-Вот это поворот.»"
1004703-54 = "Так что все эти черепахи могут..."
1004703-55 = "искать невинных людей, которым можно продать подводные сокровища."
1004703-56 = "[ns] «Чему вообще Ния тебя учит?!»"
1004703-58 = "О, черепахи двигаются!"
1004703-59 = "Сенсей, смотрите. Они сияют на солнце!"
1004703-60 = "Их панцири блестят."
1004703-61 = "[s] «Да, какое красивое зрелище.»"
1004703-62 = "Я рада, что смогла вам это показать."
1004703-63 = "Ослепительно."
1004703-64 = "Мне хотелось узнать, что вы почувствуете."
1004703-65 = "[s] «Спасибо, что показала.»"
1004703-66 = ""
1004703-70 = "Ах."
1004703-71 = "[s] «Чисэ? Ты в порядке...?»"
1004703-74 = "[ns] «П-Подожди! Т-Твоя одежда...?!»"
1004703-75 = "― Сенсей? Что случилось?[wa:2260]"
1004703-77 = "― Почему вы краснеете?[wa:320]"
1004703-80 = "[ns] «Т-Твой купальник, Чисэ.»"
1004703-81 = "― Если с вами всё нормально, мне больше ничего не нужно.[wa:1230]"
1004703-83 = "― Кстати, Сенсей, посмотрите сюда. Смотрите.[wa:3380]"
1004703-86 = "― Панцири этих черепах...[wa:720]"
1004703-88 = "― такие твёрдые, но..."
1004703-91 = "― А хвостики[wa:380]"
1004703-93 = "― такие пушистые. Пушистые![wa:4490]"
1004703-96 = "― Что думаете? Хотите потрогать?[wa:1840]"
1004703-98 = "― Они пушистые."
1004703-101 = "― Сенсей? Вот, сюда![wa:3260]"
1004703-104 = "[ns] «Нет! То есть сейчас не лучший момент!»"
1004703-105 = "― Не лучший момент...?[wa:510]"
1004703-107 = "― Почему? Сенсей?[wa:2900]"
1004703-110 = "Наконец мне удалось заставить Чисэ не двигаться, чтобы я мог поправить её купальник."
1004703-112 = "[ns1] «Так, теперь всё хорошо.»\n[ns2] «Я успел исправить всё до того, как это стало проблемой!»"
1004703-115 = "О, он развязался. Я не заметила."
1004703-116 = "Спасибо, Сенсей."
1004703-117 = "Ваше лицо только что..."
1004703-118 = "Было забавным и милым! Прямо как сияние."
1004703-119 = "[s] «Ну, рад, что тебе было смешно...»"
1004703-120 = "Да! Сегодня было очень весело!"
1004703-121 = "[s] «Так это и есть то сияние, которое ты искала?»"
1004703-122 = "Хм? Не уверена."
1004703-123 = "Здесь много сияния."
1004703-124 = "Но я не уверена, что это именно то, которое я искала."
1004703-125 = "Но мне было очень весело."
1004703-126 = "[s] «Да? Это главное.»"
1004703-127 = "Согласна, Сенсей."
1004703-129 = "Мы провели ещё немного времени в месте отдыха черепах."
