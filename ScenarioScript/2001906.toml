[translation]
2001906-1 = "Случай 4. Секретарское обслуживание прямо к вам"
2001906-2 = ""
2001906-7 = "Когда я закончил работу примерно на семьдесят процентов..."
2001906-8 = ""
2001906-11 = "Я сделал короткий перерыв и потянулся."
2001906-12 = ""
2001906-15 = "[ns] «Вот бы кто-нибудь сварил мне кофе...»"
2001906-16 = ""
2001906-18 = ""
2001906-19 = "Вот, Господин."
2001906-20 = ""
2001906-22 = ""
2001906-23 = "Моё пробормотанное желание сбылось, и передо мной внезапно появилась чашка кофе."
2001906-24 = "[ns] «О, эм, спасибо.»"
2001906-25 = ""
2001906-30 = "Кофе был чёрным — ни капли сливок, ни крупинки сахара."
2001906-31 = "Именно так, как я люблю. Идеальное сочетание горечи и кислинки."
2001906-32 = "Идеальная чашка кофе, способная унести прочь усталость и сонливость."
2001906-33 = ""
2001906-36 = ""
2001906-37 = "Ну как, Господин?"
2001906-38 = "[s] «Отличный кофе.»"
2001906-39 = "Хи-хи. Рада, что смогла помочь."
2001906-40 = "[s] «Тогда ты, должно быть, счастливый человек. Ты всегда помогаешь, Аканэ.»"
2001906-41 = "Спасибо, Сенсей."
2001906-42 = "От ваших добрых слов мне хочется..."
2001906-43 = ""
2001906-46 = "[ns] «А...?»"
2001906-47 = ""
2001906-49 = "[ns] «Аканэ???»"
2001906-50 = ""
2001906-51 = ""
2001906-52 = "Да! Аканэ-девушка-кролик к вашим услугам, Господин!"
2001906-53 = "Прыг-прыг."
2001906-56 = "Хи-хи... Чему вы так удивились?"
2001906-57 = "Я слышала, что вы будете работать допоздна..."
2001906-58 = "Поэтому долго думала, как могла бы помочь..."
2001906-59 = "И решила стать вашим секретарём-девушкой-кроликом!"
2001906-60 = "Только скажите, что вам нужно, Господин!"
2001906-61 = "Физическая или умственная работа — я справлюсь с чем угодно!"
2001906-62 = ""
2001906-65 = "[ns2] «Спасибо, но...»\n[ns2] «Ты в последнее время часто носишь этот костюм. Он тебе настолько нравится?»"
2001906-68 = "А?"
2001906-69 = "Такое впечатление у вас сложилось?"
2001906-70 = "Хахаха. Наверное, это логично."
2001906-71 = "В последнее время вы почти не видели меня в чём-то другом."
2001906-72 = "Хотите знать почему?"
2001906-73 = "Эм... Вообще-то немного неловко говорить это вслух..."
2001906-74 = "[s] «Потому что кролики — твои любимые животные?»"
2001906-75 = "Нет... Не поэтому..."
2001906-76 = "Просто..."
2001906-77 = "Я просто хочу, чтобы вы..."
2001906-78 = "[s] «Хочешь, чтобы я воспринимал тебя как девушку-кролика?»"
2001906-79 = ""
2001906-81 = ""
2001906-82 = "К-Как вы догадались?"
2001906-83 = "Ух ты, не ожидала, что вы скажете это так прямо. Что же мне делать?"
2001906-84 = "Ну... наверное, скрывать уже бессмысленно..."
2001906-85 = "Да. Всё именно так."
2001906-86 = "[s] «Тебе не нужно так переживать.»"
2001906-87 = ""
2001906-89 = ""
2001906-90 = "Я знала, что вы скажете что-то подобное..."
2001906-91 = "Спасибо, Господин."
2001906-92 = "Но... я правда хочу показывать вам новую сторону себя, когда служу вам."
2001906-93 = "[s] «Поэтому ты всё время носишь костюм девушки-кролика?»"
2001906-94 = "Да... Наверное, я просто не хотела, чтобы моё служение стало однообразным."
2001906-95 = "Это странно? Вам не нравится?"
2001906-96 = "[s3] «Странно? Конечно нет.»\n[s4] «Это мило!»"
2001906-97 = ""
2001906-98 = ""
2001906-100 = ""
2001906-101 = "...Спасибо, Господин."
2001906-102 = "Пока вы считаете это полезным, я счастлива."
2001906-103 = "[s] «Одежда неважна. Важно то, что ты всегда останешься Аканэ.»"
2001906-104 = "Вы правда так думаете?"
2001906-105 = ""
2001906-107 = ""
2001906-108 = ""
2001906-110 = "Можно мне теперь быть немного увереннее в себе?"
2001906-113 = "― Простите.[wa:940]"
2001906-115 = "― Мои мысли совсем не похожи на мысли горничной.[wa:2180]"
2001906-118 = "― Я начала терять уверенность в себе.[wa:630]"
2001906-121 = "― Господин, на вас лежит столько всего...[wa:3020]"
2001906-123 = "― но вы всегда улыбаетесь.[wa:800]"
2001906-126 = "― А я... Я даже не смогла...[wa:1610]"
2001906-128 = "― Я не смогла помочь снять с ваших плеч эту тяжесть...[wa:10]"
2001906-131 = "― Но ваши слова...[wa:2050]"
2001906-133 = "― Думаю, их достаточно, чтобы я снова почувствовала уверенность.[wa:10]"
2001906-136 = "― Я всегда буду стараться изо всех сил[wa:2170]"
2001906-138 = "― служить вам, даже если по пути буду оступаться.[wa:10]"
2001906-141 = "― Господин."
2001906-144 = "Ну что, вернёмся к работе?"
2001906-145 = "Уборка, стирка, готовка, закуски, работа с документами..."
2001906-146 = "Только скажите!"
2001906-147 = "Я покажу вам, насколько компетентной может быть горничная C&C!"
2001906-148 = "Прыг-прыг!"
2001906-150 = "Аканэ, как всегда, оказалась невероятно полезной и помогала с разными задачами, пока я заканчивал ночную смену."
