[translation]
10026095-2 = "Фух! Не знаю как, но мы снова их победили."
10026095-3 = "Это была самая большая группа из всех, что мы встречали. И они были такими агрессивными..."
10026095-4 = "Ух... На этот раз точно всё закончилось? Нам больше не нужны сюрпризы."
10026095-5 = "Кстати о сюрпризах, давайте узнаем, что в этом ящике, который мы так старались защитить."
10026095-6 = "Да, думаю, теперь можно не бояться, что кто-то снова подкрадётся. Давайте откроем его."
10026095-7 = "Хината, если ты не против, может, мы..."
10026095-8 = "А, да! Вот...!"
10026095-9 = ""
10026095-11 = ""
10026095-12 = "Отлично! Давайте откроем вместе..."
10026095-14 = "Ладно, тогда..."
10026095-15 = "Хи-хи!"
10026095-16 = "..."
10026095-17 = ""
10026095-19 = ""
10026095-20 = ""
10026095-21 = ""
10026095-23 = ""
10026095-24 = ""
10026095-25 = "...?"
10026095-26 = "...О?"
10026095-27 = "Эм..."
10026095-28 = "Он... совершенно пустой..."
10026095-29 = "[s] «...Пустой? После всего этого?»"
10026095-30 = "Зачем кому-то закапывать пустой ящик? Да ещё и в глубокой яме! На это же пришлось потратить силы!"
10026095-31 = ""
10026095-34 = ""
10026095-35 = "...Они не закапывали пустой ящик. Просто раньше он не был пустым."
10026095-37 = "А?"
10026095-38 = "Вы правы..."
10026095-39 = "Посмотрите на мелкие крошки в углах ящика."
10026095-40 = "Скорее всего, в этом ящике лежала бумага, которая со временем сгнила."
10026095-41 = "Похоже, её ничем не обрабатывали, чтобы защитить от разрушения со временем."
10026095-42 = "Да и сам ящик не был герметичным, так что нельзя исключать, что бумагу съели насекомые."
10026095-43 = "Понятно... Определённо..."
10026095-44 = "Значит, мы никак не узнаем, что там было?"
10026095-45 = "Не обязательно."
10026095-46 = "Если история чему-то меня и научила, так это тому, что у одной проблемы может быть больше одного решения."
10026095-47 = "Конечно, увидеть содержимое ящика своими глазами было бы самым простым вариантом."
10026095-48 = "Но не единственным. Мы можем сделать выводы на основе всей информации, которую собрали до этого момента."
10026095-49 = "Ну..."
10026095-50 = "Возьмём тайное убежище, которое студенты Совета использовали для тренировок..."
10026095-51 = "И шкафы за водопадом, где они хранили личные вещи, которые не хотели оставлять в соборе."
10026095-53 = "...?"
10026095-54 = "А?"
10026095-56 = "Здесь определённо что-то есть. Если учесть первые четыре места, которые мы исследовали, а также пещеру за водопадом..."
10026095-57 = ""
10026095-58 = "И самое важное свидетельство — ящик, который мы только что нашли..."
10026095-59 = "...который студенты Совета, тренировавшиеся здесь в то время, сделали вручную и спрятали..."
10026095-60 = "...думаю, этот ящик мог быть Капсулой воспоминаний."
10026095-61 = "[s] «...Капсулой воспоминаний?»"
10026095-62 = "Эм..."
10026095-63 = "Все... Сенсей..."
10026095-64 = "Если вы не против..."
10026095-65 = "Я хотела бы попросить об одолжении..."
