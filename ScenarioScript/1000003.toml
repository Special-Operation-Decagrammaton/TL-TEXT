[translation]
1000003-1 = "Сила убеждения"
1000003-2 = "Библиотека Геенны №17"
1000003-3 = "Какой навык, по-твоему, важнее всего для руководителя, Сенсей?"
1000003-4 = "[s] «Харизма, чтобы мотивировать сотрудников?»"
1000003-5 = "Базовые вещи важны. Это правда."
1000003-6 = "Но есть нечто ещё важнее."
1000003-7 = "[s1] «Следишь, чтобы у организации была милая сторона?»\n[s2] «Следишь, чтобы у организации была сексуальная привлекательность?»"
1000003-8 = "Нет, конечно! Это ей не нужно!"
1000003-9 = "Нет, конечно! Это ей не нужно!"
1000003-10 = "Слушай внимательно, Сенсей. Навык, который больше всего нужен лидеру, — это..."
1000003-11 = "[s] «...Это?»"
1000003-12 = "...сила убеждения — способность превратить любого противника в союзника!"
1000003-13 = "[s] «Разве это тоже не одна из основ?»"
1000003-14 = "Чем проще, тем лучше! Без основ вообще ничего не получится."
1000003-15 = "В любом случае, в бизнесе далеко не уйдёшь, если не умеешь убеждать людей."
1000003-16 = "Кто наносит первый удар, тот получает преимущество — в любой сфере бизнеса."
1000003-17 = "А раз я здесь начальник, значит, у меня уже есть талант убеждать других."
1000003-18 = "Учиться силе убеждения нужно тебе, Сенсей."
1000003-19 = "[s] «Я?»"
1000003-20 = "Мы же деловые партнёры, помнишь? Тебе нужно расширять свои навыки как совладельцу."
1000003-21 = "Давай представим ситуацию."
1000003-22 = "Допустим, ты кандидат, который хочет вступить в Решатели проблем 68..."
1000003-23 = "...а я провожу собеседование."
1000003-24 = ""
1000003-25 = ""
1000003-26 = "В этой книге описаны самые разные методы убеждения."
1000003-27 = "Выжми из неё всё возможное и используй знания на мне."
1000003-28 = "Убеди меня нанять тебя в наше агентство."
1000003-29 = ""
1000003-31 = "Как и сказала Ару, в книге было несколько техник убеждения."
1000003-32 = "Первый метод — искусство взаимного обмена."
1000003-33 = "«Танго танцуют вдвоём. Если хочешь чего-то от оппонента, сначала дай что-нибудь ему, чтобы он почувствовал себя обязанным.»"
1000003-34 = "[s] «Как насчёт сходить со мной на рамен, Ару? Заодно обсудим контракт.»"
1000003-35 = "У-Ужин с Сенсеем?!"
1000003-36 = "Ага! Подходит! Ты нанят!"
1000003-37 = "...Погоди, это не так должно работать! Нельзя просто подкупить меня раменом и получить работу!"
1000003-38 = "Не считается. Дисквалификация!"
1000003-40 = "Один раз обманул — стыд тебе. Давай ещё раз, Сенсей."
1000003-41 = "Второй метод убеждения — искусство слушать."
1000003-42 = "«Чтобы расположить человека к себе, сначала выслушай его, а уже потом высказывай своё мнение.»"
1000003-43 = "[s] «Ты всегда занята, Ару. У начальников, наверное, много обязанностей.»"
1000003-44 = "Ну да. Я каждую неделю сама разбираюсь с требованиями клиентов."
1000003-45 = "[s] «Тебе нужен кто-нибудь, с кем можно поговорить?»"
1000003-46 = "Не помешало бы."
1000003-47 = "[s] «Тогда найми меня.»"
1000003-48 = "О, правда?"
1000003-49 = "...Погоди, ты думал, что я вот так легко тебя найму?!"
1000003-50 = "Не обращайся со мной как с ребёнком! Этого недостаточно, чтобы сделать меня счастливой!"
1000003-51 = "[s] «Думаю, я мог бы быть тебе очень полезен, Ару.»"
1000003-52 = "Н-Не слишком ли напористо?"
1000003-53 = "Угх. Откуда у тебя эта убеждающая аура? Она слишком сильная!"
1000003-54 = "Сенсей... Ты овладел искусством убеждения!"
1000003-56 = "После этого Ару продолжала устраивать мне пробные собеседования и проверяла остальные методы из книги."
1000003-57 = "За двенадцать часов меня «наняли» двадцать четыре раза."
