[translation]
2601605-1 = "Согласно недавнему опросу,"
2601605-2 = "Как и ожидалось, ответ нашёлся на пляже!"
2601605-3 = "Азарт витает в воздухе! Ослепительное солнце! И опасное море!"
2601605-4 = "Можно сказать, что мы попали в настоящий голубой океан!"
2601605-5 = "[s1] «Буквально голубой океан, да».\n[s2] «Даже если ничего не найдём, просто насладимся отдыхом!»"
2601605-8 = "Ага! Надеюсь, сегодня мы откопаем много интересных историй!"
2601605-9 = "Ну что, пошли!"
2601605-10 = ""
2601605-12 = ""
2601605-14 = ""
2601605-15 = ""
2601605-16 = "Так-так-так! Интересно, что тут сегодня происходит!"
2601605-17 = ""
2601605-19 = ""
2601605-20 = ""
2601605-21 = "Ого, по-моему, это самая большая штука, какую я видела."
2601605-22 = "Ничего себе. Я впервые трогаю настоящую."
2601605-23 = "А! Чую сенсацию!"
2601605-24 = ""
2601605-25 = "Здравствуйте! Мы из «Еженедельника Пандемониума»! Не найдёте минутку для интервью?!"
2601605-26 = "А? Интервью? Ну, можно, наверное..."
2601605-27 = "«Еженедельник Пандемониума»? А, та штука, которую мой друг подкладывает под горячие кастрюли."
2601605-28 = "О! Рада, что мы по просьбам читателей перешли на жаропрочную бумагу!"
2601605-29 = "На что вы все смотрели? Что-то интересное?"
2601605-30 = "Ага, вот на это."
2601605-31 = "На берег выбросило морскую мину."
2601605-32 = ""
2601605-34 = ""
2601605-35 = "[ns] «Морскую мину?! Которая взрывается?!»"
2601605-36 = "Чёрт, напугали. А какие ещё бывают морские мины?"
2601605-37 = "Ну, неисправные, наверное."
2601605-38 = ""
2601605-40 = ""
2601605-41 = "[ns] «Разве это не тянет на сенсацию?»"
2601605-42 = "Хм. Как-то... не впечатляет."
2601605-43 = "По-моему, на целую статью этого маловато..."
2601605-44 = "Ну, может, она вовсе не неисправная?"
2601605-45 = ""
2601605-47 = ""
2601605-48 = "Смотрите! Если бы работала, давно бы уже взорвалась."
2601605-49 = "Думаешь, такую здоровенную штуковину можно взорвать, просто ударив по ней?"
2601605-50 = "Бу-у. Не могу же я написать статью о какой-то морской мине на пляже. Их тут сколько угодно."
2601605-51 = "Может, если выложить в соцсети, наберём... лайков десять?"
2601605-52 = "Эх. Поищем дальше."
2601605-53 = "[s] «Л-ладно...!»"
2601605-55 = "Может, там найдётся что-нибудь!"
2601605-56 = ""
2601605-58 = ""
2601605-59 = "О, похоже, та морская мина всё-таки была исправной."
2601605-60 = "[s] «Так она всё-таки взорвалась?!»"
2601605-61 = "Ну, её же для того и сделали, разве нет?"
2601605-62 = "Вон там тоже собралось много народу..."
2601605-63 = ""
2601605-64 = "Это наша территория! Валите отсюда!"
2601605-65 = "Хрен вам! Не надо нам тут втирать эту чушь!"
2601605-67 = "Швырните их в море!"
2601605-69 = ""
2601605-73 = "[ns3] «Э-это разборка банд!»\n[ns4] «Почти тянет на сенсацию... но их надо остановить!»"
2601605-76 = "Полная... тоска..."
2601605-77 = "В Геенне такие драки происходят чаще, чем люди ногти стригут."
2601605-78 = "Ах... Нигде ни одной сенсации..."
2601605-79 = "[s] «Чиаки совсем растеряла пыл?!»"
2601605-80 = "А-а..."
2601605-82 = "Мы ещё какое-то время продолжали поиски..."
2601605-83 = "Но сенсаций всё не находилось, а Чиаки с каждой минутой становилась всё более вялой."
2601605-86 = "Мир кажется таким пустым..."
2601605-87 = "«Еженедельник Пандемониума» без единой сенсации пуст, словно шум этих волн..."
2601605-88 = "Ха... А-ха-ха..."
2601605-89 = "[s] «Это же не конец света!»"
2601605-90 = "Ага! Я даже не расстроилась!"
2601605-91 = "Обычно стоит провести с Макото хотя бы полчаса, и материала уже хватает на целую статью..."
2601605-92 = "...в общем...?"
2601605-93 = ""
2601605-95 = ""
2601605-96 = "А? ЧЕГО-О?!"
2601605-97 = "Нашла сенсацию!"
2601605-98 = "Смотрите, Сенсей! Это невероятно, невероятно, невероятно длинная водоросль комбу! Её выбросило на берег!"
2601605-99 = "При такой длине она точно побила предыдущий рекорд! Возможно, это вообще самая длинная водоросль за всю историю Геенны!"
2601605-100 = "[s] «Впечатляет, конечно, но... ЭТО сенсация...?!»"
2601605-101 = "Читатели будут в восторге! Я так и знала, Сенсей, вы мой лучший напарник!"
2601605-102 = "Так! Для масштаба я лягу рядом с водорослью! Сфотографируйте меня вот так, пожалуйста!"
2601605-103 = "Раз, два! Скажите «водоро-о-осль»!"
2601605-104 = ""
2601605-106 = ""
2601605-108 = "Чиаки выглядела такой счастливой, что я решил: и этого вполне достаточно."
2601605-109 = "После этого мы с Чиаки, которая всё ещё не могла успокоиться от радости, вернулись в Шале."
