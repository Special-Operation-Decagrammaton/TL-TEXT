[translation]
2601605-1 = "According to recent investigations,"
2601605-2 = "As expected, the answer was at the beach, wasn't it?"
2601605-3 = "Excitement! Dazzling sun! And a dangerous sea!"
2601605-4 = "This is truly what you'd call a 'blue ocean'!"
2601605-5 = "[s1] \"Yeah. It's a real blue ocean, alright.\"\n[s2] \"Even if we don't find a scoop, let's just enjoy it as a change of pace!\""
2601605-8 = "Alright! I'm going to find plenty of scoops today!"
2601605-9 = "Let's go!"
2601605-16 = "Let's see, let's see! Is there anything here?"
2601605-21 = "Whoa, I've never seen one this big before."
2601605-22 = "Huh. So this is what the real thing looks like."
2601605-23 = "Aha! I smell a scoop!"
2601605-25 = "Excuse me! This is the 'Weekly Pandemonium'! Could I get a quick interview?"
2601605-26 = "An interview? I guess that's fine, but..."
2601605-27 = "'Weekly Pandemonium'...? Oh, is that the thing my friend uses as a trivet?"
2601605-28 = "Oh! It was worth switching to heat-resistant paper just like our readers requested!"
2601605-29 = "Everyone, what are you all gathered around looking at?"
2601605-30 = "This."
2601605-31 = "A naval mine washed up on the beach."
2601605-35 = "[ns] \"A mine!? The kind that explodes!?\""
2601605-36 = "H-hey, don't shout so suddenly. Obviously, right?"
2601605-37 = "Though, this one seems to be defective."
2601605-41 = "[ns] \"Wouldn't this be a good enough scoop?\""
2601605-42 = "Hmm, it's a bit underwhelming..."
2601605-43 = "As a story, it's one step... no, two steps short..."
2601605-44 = "Wait, maybe it's not defective?"
2601605-48 = "But look, it's not detonating at all."
2601605-49 = "You can't expect something this big to explode just from hitting it with a rifle stock."
2601605-50 = "You see mines on the beach all the time, so it's not really feature-article material..."
2601605-51 = "I'd be lucky if it got ten likes."
2601605-52 = "Let's keep looking..."
2601605-53 = "[s] \"O-okay...!\""
2601605-55 = "I wonder if there's anything interesting around here?"
2601605-59 = "Oh, it looks like that mine from earlier wasn't defective after all."
2601605-60 = "[s] \"It ends up exploding after all!?\""
2601605-61 = "Well, it was made to explode in the first place."
2601605-62 = "There's a crowd gathering over here, too..."
2601605-64 = "Get lost, you idiots! This is our turf!"
2601605-65 = "Don't mess with us! We were here first!"
2601605-67 = "Hey you guys! Sink all of them into the ocean!"
2601605-73 = "[ns3] \"I-it's a fight!\"\n[ns4] \"This is a scoop... or rather, we have to stop them!\""
2601605-76 = "Hmm... this is also a bit underwhelming."
2601605-77 = "Fights are more of a daily occurrence in Gehenna than clipping your nails."
2601605-78 = "Oh... my scoop... where are you..."
2601605-79 = "[s] \"She's super low-energy now!?\""
2601605-80 = "Sigh..."
2601605-82 = "(We looked around the area after that, but...)"
2601605-83 = "(There was nothing that could pass for a scoop, and Chiaki remained dejected.)"
2601605-86 = "How empty..."
2601605-87 = "A 'Weekly Pandemonium' without a scoop is as empty as the sound of these waves..."
2601605-88 = "Haha, ahahahaha..."
2601605-89 = "[s] \"W-well, our walk isn't over yet...!\""
2601605-90 = "Ahaha! I'm not actually that depressed, so don't worry."
2601605-91 = "As a last resort, if I walk with Makoto-senpai for about 30 minutes, all sorts of stories pop up..."
2601605-92 = "Right...?"
2601605-96 = "O-oh!?"
2601605-97 = "Scoop discovered!!!"
2601605-98 = "Look at this, Sensei! The length of this kelp!!"
2601605-99 = "This might be... the longest in Gehenna history!!"
2601605-100 = "[s] \"It's impressive, but... is it really a scoop...?\""
2601605-101 = "Our readers are going to be so excited! As expected, Sensei, you're the best partner!"
2601605-102 = "I'm going to lie down next to the kelp, so take a picture! #nI want to show our readers this overwhelming length!"
2601605-103 = "Alright, keeelp!"
2601605-108 = "(I was just glad to see Chiaki happy.)"
2601605-109 = "(I headed back to Schale with a high-spirited Chiaki.)"