[translation]
2601605-1 = "According to a Recent Investigation"
2601605-2 = "Sure enough, the answer was on the beach, huh."
2601605-3 = "A feeling of excitement! The dazzling sun! And the daring sea!"
2601605-4 = "This is exactly what they call a blue ocean, isn't it!"
2601605-5 = "[s1] \"Yeah. A real blue ocean.\"\n[s2] \"Even if there's no story for a scoop, let's just enjoy it!\""
2601605-8 = "Alright! I'm going to find a bunch of scoops today!"
2601605-9 = "Let's get going!"
2601605-16 = "Let's see! I wonder if there's anything here?"
2601605-21 = "Amazing, I've never seen one this big before."
2601605-22 = "Wow. So this is what the real thing looks like."
2601605-23 = "Hah! I smell a scoop!"
2601605-25 = "Excuse me! This is Weekly Pandemonium! Do you mind if I interview you for a bit?"
2601605-26 = "An interview? Sure, I guess..."
2601605-27 = "\"Weekly Pandemonium\"...? Ah, that newspaper that my friend was using as a pot holder."
2601605-28 = "Oh! I’m glad that switching to heat-resistant paper really worked out as well!"
2601605-29 = "What is everyone gathered around looking at?"
2601605-30 = "This."
2601605-31 = "A naval mine washed up on the beach."
2601605-35 = "[ns] \"A naval mine!? Those kinds that explode!?\""
2601605-36 = "D-Don't suddenly shout so loud. Isn't that obvious?"
2601605-37 = "But it looks like this one is defective."
2601605-41 = "[ns] \"Wouldn't this be enough for a scoop?\""
2601605-42 = "Hmm, it's a bit borderline..."
2601605-43 = "As a story, it's one step short... No, two steps short..."
2601605-44 = "Well, maybe it's not defective?"
2601605-48 = "But look, it's not detonating at all."
2601605-49 = "Just hitting it with a gunstock isn't enough to make something this big explode."
2601605-50 = "Naval mines are a common sight on the beach, so it's a bit much for #na feature article..."
2601605-51 = "It might just be a post that'd get around 10 likes, if we're lucky."
2601605-52 = "Let's look elsewhere..."
2601605-53 = "[s] \"Y-Yeah...!\""
2601605-55 = "I wonder if there's anything interesting here?"
2601605-59 = "Ah, looks like that naval mine from earlier wasn't defective after all."
2601605-60 = "[s] \"It ended up exploding!?\""
2601605-61 = "Well, it was originally meant to explode anyway."
2601605-62 = "There are people gathering over here too, but..."
2601605-64 = "Move it, you punks! This is our turf!"
2601605-65 = "Don't mess with us! We were here first!"
2601605-67 = "You little sh..! Sink them all into the sea!"
2601605-73 = "[ns3] \"A clash!\"\n[ns4] \"This could be a scoop... or rather, we have to stop them!\""
2601605-76 = "Hmm... this is also borderline."
2601605-77 = "Fights are a more everyday occurrence in Gehenna than clipping your nails."
2601605-78 = "Ah... a scoop... where could one be..."
2601605-79 = "[s] \"You're super low energy!?\""
2601605-80 = "*Sigh...*"
2601605-82 = "(Even after looking around the area for a while...)"
2601605-83 = "(There was nothing that seemed like a scoop, and Chiaki's spirit remained low)"
2601605-86 = "It's empty..."
2601605-87 = "A Weekly Pandemonium without a scoop is as empty as the sound of these #nwaves..."
2601605-88 = "Haha, ahahaha..."
2601605-89 = "[s] \"W-We're not done walking yet, so...!\""
2601605-90 = "Ahaha! I'm not actually that depressed, so I'm fine."
2601605-91 = "As a last resort, if I walk with Makoto-senpai for about 30 minutes, all sorts of ideas#nwill come up..."
2601605-92 = "Right...?"
2601605-96 = "O-Oh!?"
2601605-97 = "Scoop discovered!!!"
2601605-98 = "Look at this, Sensei! The length of this kelp!!"
2601605-99 = "This might be... the longest in Gehenna history!!"
2601605-100 = "[s] \"It's amazing, but... is it a scoop...?\""
2601605-101 = "The readers are sure to be thrilled! As expected, Sensei is my best partner!"
2601605-102 = "I'm going to lie down next to the kelp, so please take a picture! #nI want to convey this overwhelming length to the readers!"
2601605-103 = "Say keeelp!"
2601605-108 = "(I was so glad to see Chiaki happy.)"
2601605-109 = "(I returned to Schale with a high-spirit Chiaki)"