[translation]
2601005-1 = "Форма неба"
2601005-2 = "Мне хотелось узнать больше о том, что было у Мию на душе, поэтому я спросил, где она, и отправился к ней."
2601005-5 = "О... Сенсей...?"
2601005-6 = "В-Вы хотите знать, что я здесь делаю? Эм, я..."
2601005-7 = "...ничего особенного не делаю... Просто... этот подсолнух..."
2601005-8 = "А-а-а..."
2601005-9 = "Это из-за моего прошлого сообщения в MomoTalk? Я ничего особенного не имела в виду..."
2601005-10 = "Просто внезапно захотелось... поделиться впечатлением от неба..."
2601005-11 = "Вы переживали...?"
2601005-12 = "[s] «Мне захотелось увидеть то самое небо, о котором ты говорила.»"
2601005-13 = "А, тогда... Идите за мной."
2601005-14 = "Сядьте на ту швартовочную тумбу. Да. Лицом на запад, к морю..."
2601005-15 = "...Посмотрите на горизонт..."
2601005-16 = "Ха-ха-ха... Ничего особенного, правда?"
2601005-17 = "Просто обычное пустое небо. Но... для меня оно оказалось каким-то новым..."
2601005-18 = "Обычно я прячусь в тесном тёмном месте и жду момента для выстрела..."
2601005-19 = "А здесь всё такое... открытое. Лёгкий ветерок... Не слишком шумно и не слишком тихо..."
2601005-20 = "Мне нравится, потому что здесь всё... просто..."
2601005-21 = "[s] «Правда?»"
2601005-23 = "Моё обычное небо загромождено всякими вещами..."
2601005-24 = "Бесконечными зданиями... или зубчатыми горными хребтами..."
2601005-25 = "Граница между небом и землёй выглядит как огромный рваный разрез..."
2601005-26 = ""
2601005-27 = "А здесь между небом и морем ничего нет... Идеальный горизонт, словно кто-то провёл его линейкой."
2601005-28 = "Под таким простым небом не существует цели, в которую я не смогла бы попасть..."
2601005-29 = "От этого я почти чувствую... уверенность..."
2601005-30 = "Я подумала, что было бы здорово как-нибудь вернуться сюда, даже не ради задания."
2601005-31 = "А потом, не подумав, просто отправила вам те сообщения..."
2601005-32 = "Я-я заболталась. Не хотела вести себя так странно..."
2601005-33 = "[s1] «Здесь и правда очень красиво.»\n[s2] «Если захочешь, мы можем вернуться. С заданием или без.»"
2601005-36 = "Э-Эм... Не хочу, чтобы вы неправильно поняли...!"
2601005-37 = "А-а... Вот поэтому я и не хотела вам рассказывать..."
2601005-38 = "Я чувствую себя избалованным ребёнком... требующим проводить со мной ещё больше времени..."
2601005-39 = "[s3] «Ничто из сказанного тобой не заставило меня так подумать.»\n[s4] «Нет, я правда хочу сюда вернуться. Здесь идеально.»"
2601005-42 = "П-Правда...?"
2601005-43 = "Тебе правда тоже нравится? Этот горизонт и это небо..."
2601005-44 = ""
2601005-46 = ""
2601005-47 = "Если вы не шутите... Если вы правда, правда так думаете..."
2601005-48 = "Если вам действительно нравится этот вид, Сенсей..."
2601005-49 = "То есть, если нравится... Эм..."
2601005-50 = "...Ах..."
2601005-51 = "[s] «Давай как-нибудь вернёмся сюда вместе. На этот пляж.»"
2601005-52 = "...!"
2601005-53 = "...Ах."
2601005-54 = "О-О-о..."
2601005-55 = "Да."
2601005-57 = "Пожалуйста... Да."
