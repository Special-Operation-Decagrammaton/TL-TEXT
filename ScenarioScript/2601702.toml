[translation]
2601702-1 = "Packet Sleeping"
2601702-5 = "(The package should be arriving around now...)"
2601702-6 = "(I'm too distracted to focus on work.)"
2601702-10 = "I'm here to deliver a package."
2601702-11 = "[ns] \"It's heeeeere!\""
2601702-14 = "Hello. You have a lot of items today."
2601702-15 = "There was another package in front of your door, so I brought that in too."
2601702-16 = "Where should I put this large cardboard box?"
2601702-17 = "[s] \"What is... this package supposed to be...?\""
2601702-18 = "Who knows? I'm not sure either. #nIt was left in front of the door, so I assumed it was for you..."
2601702-19 = "Well, excuse me... I'll be going now."
2601702-25 = "[ns1] \"......\"\n[ns2] (Timidly opens the cardboard box)"
2601702-30 = "[wa:800]— [log=라나]Hello... [wa:2350]It's good to see you, [wa:1690]Sensei.[/log] "
2601702-32 = "— [log=라나]A familiar ceiling... [wa:2250]I see.[/log] "
2601702-35 = "— [log=라나]I'm glad [wa:1200] we managed to meet.[/log] "
2601702-38 = "[ns] \"Lana?! What are you doing inside a cardboard box?!\""
2601702-39 = "[wa:630]— [log=라나]Hmm? [wa:1690]Why am I inside a [wa:1310] delivery package...? [/log]"
2601702-41 = "— [log=라나]Because I got in it.[/log]"
2601702-44 = "— [log=라나]After buying my train ticket, [/log]"
2601702-46 = "— [log=라나]I couldn't afford to buy any souvenirs...[/log]"
2601702-49 = "— [log=라나]And then, [wa:1280]right here at Schale, [/log]"
2601702-51 = "— [log=라나]there was a cardboard box addressed to Sensei, [wa:1430]wasn't there? [/log]"
2601702-54 = "— [log=라나]So, [wa:1280]I decided to become the souvenir myself.[/log]"
2601702-57 = "[ns] \"You were inside a discarded cardboard box this whole time?! Are you okay?\""
2601702-58 = "[wa:680]— [log=라나]I am fine.[/log] "
2601702-60 = "— [log=라나]I excel at passing the time—[/log] "
2601702-63 = "— [log=라나]The cushioning material was fluffy, [/log] "
2601702-65 = "— [log=라나]and Sensei was careful when [wa:1550] opening the box, [wa:1970] so I am unharmed.[/log] "
2601702-68 = "— [log=라나]Fufu...[/log] "
2601702-71 = "[wa:1920]— [log=라나]Seeing your face like this, [wa:1970] I'm happy.[/log] "
2601702-73 = "— [log=라나]I really, [wa:1660] wanted to see you, [wa:1360] Sensei.[/log] "
2601702-77 = "— [log=라나]Umm...[/log] "
2601702-80 = "[wa:600]— [log=라나]Huu...[/log] "
2601702-82 = "— [log=라나]Well then, [wa:1860] good night.[/log] "
2601702-85 = "— [log=라나]Zzz...[/log] "
2601702-89 = "Zzz... Zzz..."
2601702-90 = "Sen... sei..."
2601702-92 = "(Gently picked up the sleeping Lana and moved her to the bed)"
2601702-93 = "(She must have been very tired, as she was sleeping soundly)"
2601702-94 = "(After a while, Lana woke up, so I saw her off to the entrance)"
