[translation]
84311100100-5 = ""
84311100100-6 = "...Сэя?"
84311100100-7 = "Почему ты уже вернулась? Прошёл всего день."
84311100100-9 = "Я правда ценю вашу заботу, но мне уже становится не по себе от безделья."
84311100100-10 = "Может, потому что я давно никуда не выбиралась... Но у меня полно энергии, и всё, через что мы прошли, всё ещё крутится в голове."
84311100100-11 = "Как ты и сказала, сегодня я уже достаточно насладилась Экспо... так что если после обеда будет что-то, чем можно заняться, сообщишь мне?"
84311100100-13 = "Ты УЖ СЛИШКОМ в это втянулась. Это не игра, знаешь ли..."
84311100100-14 = "Я переживаю, что это может быть тяжело для твоей выносливости. Чтобы нормально расти, нужен хороший ночной сон."
84311100100-15 = "Если слишком активно носиться по ночам, могут начаться проблемы с ростом или весом."
84311100100-16 = "Эм..."
84311100100-17 = "Прости, можешь повторить?"
84311100100-18 = "...? Что?"
84311100100-19 = "Ты хочешь сказать, что я низкая потому, что хожу по ночам?"
84311100100-20 = "Нет..."
84311100100-21 = "Зачем ты так говоришь? Тебя что-то беспокоит в медицинском плане насчёт твоего роста?"
84311100100-22 = "О, ты специально меня провоцируешь, да?"
84311100100-23 = "Нет. Я уже сказала, что ничего такого не имела в виду."
84311100100-24 = "Если случайно попала по больному месту, это уже твои проблемы и твои комплексы."
84311100100-25 = ""
84311100100-27 = ""
84311100100-29 = "О, ты только что НЕ...! Скажи это ЕЩЁ раз!"
84311100100-30 = "Могу повторить. Если уточнить: хотя повседневные привычки действительно влияют на рост, существуют также генетические, врождённые особенности, которые..."
84311100100-32 = "Хватит!!"
84311100100-33 = "Ты САМА попросила меня повторить. Почему ты злишься?"
84311100100-34 = ""
84311100100-36 = ""
84311100100-37 = "(...Похоже, это её больное место. Буду осторожнее.)"
84311100100-39 = "Т-Там вообще есть какая-нибудь ситуация? Потому что мы можем прямо сейчас пойти и разобраться!"
84311100100-40 = ""
84311100100-43 = ""
84311100100-44 = "А, ситуация есть. И она... достаточно сложная, чтобы понадобились вы обе."
84311100100-45 = "В выставочный зал только что добавили новый прототип. Причём уже после закрытия, так что его никто ещё не видел..."
84311100100-46 = "...но у меня есть подозрения. Если возможно, я хотела бы принести его сюда и проверить."
84311100100-47 = "Ты понятия не имеешь, что это? Просто хочешь забрать, проверить и вернуть, если всё нормально?"
84311100100-48 = "Это проблема?"
84311100100-49 = "Нет."
84311100100-50 = "Хорошо, должно помочь от твоей неусидчивости."
84311100100-52 = "Фуфу, именно то, что я хотела."
84311100100-53 = "Ладно, двигаемся. О вопросе роста... поговорим позже."
84311100100-54 = "Когда именно позже? Если скажешь точное время, я отмечу в календаре."
84311100100-55 = ""
84311100100-57 = ""
84311100100-58 = "*вздыхает*"
84311100100-60 = "Так... эм..."
84311100100-61 = "Неважно. Уверена, вы двое разберётесь."
