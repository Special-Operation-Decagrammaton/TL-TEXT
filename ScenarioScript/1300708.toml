[translation]
1300708-1 = "Не такой уж одинокий гурман"
1300708-2 = "Улица Чайнатауна возле академии Шаньхайцзин"
1300708-3 = "Фух! Как же вкусно было."
1300708-4 = "Эта улица полностью оправдывает свою славу. Здесь всё такое вкусное!"
1300708-5 = "Жареный рис, чар-сю, мясные пельмени... Всё отличное!"
1300708-6 = "Не зря я ехала сюда через весь город. Хи-хи."
1300708-7 = "А? Не хочу ли я передохнуть после всего этого?"
1300708-8 = "Ни за что! Мы ещё и половину ресторанов не обошли!"
1300708-9 = "Если не ускоримся, до конца дня не успеем попробовать каждое блюдо!"
1300708-10 = "Хотя... после всей этой жирной еды мне немного не по себе."
1300708-11 = ""
1300708-12 = ""
1300708-13 = ""
1300708-14 = "Ладно. Может, зайдём в кафе передохнуть?"
1300708-17 = "― А? Ч-Что? Почему ты так на меня смотришь?[wa:3840]"
1300708-19 = "― (Ну серьёзно...)[wa:880]"
1300708-22 = "― После отдыха мы ведь пойдём дальше по списку, да? Что съедим следующим?[wa:1680]"
1300708-25 = "― Вкусно! ♪[wa:2760]"
1300708-28 = "― Что?! Пить вместе?[wa:680]"
1300708-30 = "― Не глупи! Ты жить надоело?[wa:540]"
1300708-33 = "― (Сенсей ведь просто дразнит меня, да? Да? Тут только одна трубочка...)[wa:2600]"
1300708-35 = "― (Но если с Сенсеем... может, я была бы не против...)[wa:840]"
1300708-38 = "― Забудь! Никакого тебе сока![wa:10]"
1300708-41 = "Ах... Было вкусно!"
1300708-42 = "Сегодня был лучший день. Я съела столько вкусного!"
1300708-43 = "А с тобой всё казалось ещё вкуснее..."
1300708-44 = "П-Подожди, не пойми неправильно! Я и сама прекрасно умею есть вкусную еду!"
1300708-45 = "Но признаю... с кем-то рядом... вкуснее."
1300708-46 = "Сходишь со мной ещё как-нибудь перекусить?"
1300708-47 = "[s] «Разумеется»."
1300708-48 = ""
1300708-49 = ""
1300708-50 = ""
1300708-51 = "Правда? Тогда обещано! Я запомню!"
1300708-53 = "После этого я вернулся в школу вместе с сияющей от счастья Джунко."
