[translation]
84302300200-5 = "Я проанализировала поток данных."
84302300200-6 = "К сожалению, происходящее куда масштабнее, чем мы предполагали."
84302300200-7 = "Срыв Миллениум Expo — лишь начало их плана."
84302300200-8 = "Разумеется, я не собираюсь позволять этому случиться. Так что если операция окажется на грани провала, придётся напрямую сообщить Семинар."
84302300200-9 = "Но, по моим расчётам, мы всё ещё можем разобраться с ситуацией до этого. Если будем достаточно быстры."
84302300200-10 = "В этот раз первый ход за нами."
84302300200-11 = "Точкой столкновения станет..."
84302300200-12 = "...фитнес-центр Миллениум."
