[translation]
10007065-1 = "Эпизод 6;Морс для Рабочей партии!"
10007065-2 = "*тяжело дышит* *тяжело дышит* *тяжело дышит* Какие же вы упорные."
10007065-3 = "*тяжело дышит* *тяжело дышит* Это вы упорные."
10007065-4 = "Может, признаете поражение и снесёте курорт?"
10007065-5 = "Ни за что! Этот курорт — наша единственная надежда!"
10007065-6 = "Если мне придётся вернуться к тем ужасным дням в бывшем институте..."
10007065-7 = "Я лучше умру вместе с этим курортом!"
10007065-8 = "Я восхищаюсь твоим духом, но..."
10007065-9 = "На кону честь Рабочей партии, поэтому мы тоже не можем отступить!"
10007065-10 = ""
10007065-13 = "Уф, сегодня чертовски холодно."
10007065-15 = "Ахахаха! Вы н-недооценили холод в бывшем институте!"
10007065-16 = "Е-Если вам холодно, п-почему бы не сдаться и н-не уйти обратно?"
10007065-18 = "Это ты выглядишь так, будто замерзаешь!"
10007065-19 = "В одном тонком кимоно на заснеженной горе посреди зимы..."
10007065-20 = "Ты и часа так не протянешь!"
10007065-22 = "Ух...!"
10007065-23 = ""
10007065-27 = ""
10007065-28 = "Нодока, я принесла тебе тёплого морса."
10007065-29 = "Большое спасибо, Шигурэ."
10007065-31 = "Стой! Нельзя снабжать припасами прямо во время боя! Это нечестно!"
10007065-32 = "Эта битва идёт между Рабочей партией и спецотрядом. За нашу честь! Не полагайтесь на припасы и сражайтесь честно!"
10007065-33 = ""
10007065-36 = ""
10007065-37 = "Вот, выпейте, члены Рабочей партии."
10007065-38 = "А-А? Ты и нам даёшь?"
10007065-39 = "Конечно. У нас более чем достаточно морса из партии, которую мы приготовили прошлой весной."
10007065-40 = "Пейте, пока он тёплый, чтобы не простудиться."
10007065-41 = "Мы благодарим вас за гостеприимство, но..."
10007065-42 = "Воля наших рабочих не настолько слаба, чтобы её поколебал какой-то напиток!"
10007065-43 = ""
10007065-45 = ""
10007065-46 = ""
10007065-47 = ""
10007065-48 = ""
10007065-49 = "В-Вкусно!"
10007065-50 = "Что это за морс? Он такой мягкий и сладкий!"
10007065-51 = "Вместе с лёгким горьковатым послевкусием по всему телу разливается тепло... Для холода идеально!"
10007065-52 = "Хи-хи, я рада, что вам нравится. Мне тоже казалось, что эта партия очень хорошо перебродила."
10007065-53 = "Хотите ещё?"
10007065-54 = "М-Мы возьмём!"
10007065-56 = ""
10007065-57 = "Хи-хи-хи."
10007065-58 = "Очень вкусно. Мы с радостью выпьем ещё!"
10007065-59 = "[s] «...Ты в порядке, Минори?»"
10007065-60 = "Конечно! С этим тёплым морсом я выдержу даже самый лютый холод!"
10007065-61 = "Изнутри меня поднимается жар. Мне даже горячо!"
10007065-62 = "Или, кажется, мне становится холодно, потому что я вспотела... Что происходит?"
10007065-63 = "[s] «Я так и знал, что всё будет не в порядке...»"
10007065-64 = "Эм-м, теперь мне ещё холоднее от одной мысли о холоде..."
10007065-65 = "И голова кружится. Я больше не могу..."
10007065-66 = "Ой-ой, так дело не пойдёт. Вам стоит залезть в горячий источник и согреться, пока пот не остыл."
10007065-67 = "...В горячий источник?"
10007065-68 = "Ты предлагаешь Рабочей партии купаться в горячих источниках, построенных этими идиотами из Геенны?!"
10007065-69 = "Всё не так, президент Минори."
10007065-70 = "Нас действительно вынудили принять этот курорт, но мы очень беспокоимся о надёжности сооружения, построенного студентами Геенны."
10007065-71 = "Поэтому мы хотели бы, чтобы члены Рабочей партии, прославленные как лучшие архитекторы Кивотоса, лично зашли в купальни и проверили состояние комплекса."
10007065-72 = "Лучшие архитекторы Кивотоса..."
10007065-73 = "Хи-хи. Именно. В Кивотосе нет другой архитектурной группы, способной сравниться с нами!"
10007065-74 = "К тому же пить морс, отмокая в тёплой воде, — совершенно особое удовольствие."
10007065-75 = "*икает*"
10007065-76 = ""
10007065-78 = ""
10007065-79 = "*шёпотом* А кроме морса у вас случайно ничего нет?"
10007065-80 = "Для гостей курорта горячих источников №227 у нас есть большой выбор домашних фруктовых напитков."
10007065-81 = "Если Рабочая партия посетит наш курорт как гости, мы угостим вас любым напитком — хоть компотом, хоть морсом."
10007065-82 = "Хм... Наверное, ничего не поделаешь. Нам придётся искупаться, исключительно чтобы проверить, насколько плохо эти идиоты из Геенны построили курорт."
10007065-83 = "Я совершенно точно делаю это не потому, что хочу ещё морса!"
10007065-84 = "Да-да. Отличная идея."
10007065-85 = "Если вы все собираетесь купаться вместе, рекомендую северную большую открытую купальню."
10007065-86 = "Идёмте, товарищи."
10007065-87 = "За конструкционную безопасность курорта и ещё морса..."
10007065-88 = "То есть, за революционный отдых..."
10007065-89 = "Вперёд, к горячим источникам!"
10007065-91 = ""
10007065-92 = "За революционный отдых!"
10007065-93 = ""
10007065-95 = ""
10007065-97 = "Ух ты, эти упрямые члены Рабочей партии оказались совершенно бессильны перед уговорами Шигурэ."
10007065-98 = "Хи-хи, это было не так уж сложно."
10007065-99 = "Просьба, подкреплённая вкусным напитком и искренними словами, всегда работает."
10007065-100 = "Хоть мы и в одном спецотряде, иногда ты меня пугаешь, Шигурэ..."
10007065-101 = "[s] «Эй, Шигурэ.»"
10007065-102 = "А? Какая, Сенсей?"
10007065-103 = "[s] «С напитком ведь всё в порядке, да?»"
10007065-104 = "Конечно. Это традиционный морс, сделанный только из брусники, сахара и дрожжей."
10007065-105 = "Просто из-за плохих условий хранения он немного перебродил..."
10007065-106 = ""
10007065-108 = ""
10007065-109 = ""
10007065-111 = "Если сомневаешься, почему бы тебе самому не сделать глоток, Сенсей?"
10007065-113 = "После этого я отказался от морса, который Шигурэ продолжала мне предлагать, и сбежал внутрь курорта."
