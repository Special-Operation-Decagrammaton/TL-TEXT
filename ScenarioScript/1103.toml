[translation]
1103-1 = "Непредвзятый вкус"
1103-2 = "(Общество гурманов навещает лабораторию «Веритас» в Миллениуме.)"
1103-3 = "Именно поэтому людям с рецептором OR6A4 мята кажется на вкус мылом или шампунем."
1103-4 = "Причина — однонуклеотидный полиморфизм, или SNP."
1103-5 = "Любопытно. Значит, это нельзя вылечить?"
1103-6 = "Любовь к вкусу мяты — не болезнь. Зачем это лечить?"
1103-7 = "Вот именно! Ты говоришь так, будто это какой-то недостаток. Как грубо!"
1103-8 = "Мы серьёзно! А вдруг у тебя что-то не так с носом или языком?"
1103-9 = "Подумай, как это может мешать в повседневной жизни. Так и возникают расстройства."
1103-10 = "Да насколько всё может быть плохо?"
1103-11 = "Всё началось 30 лет назад..."
1103-12 = "Ты слишком далеко зашла! Ты вообще о чём?!"
1103-13 = "Вчера Префектурная команда заперла Изуми за производство и продажу мятного сока."
1103-14 = "Мятный сок...? Никогда о таком не слышала."
1103-15 = "Пить это, конечно, странновато, но разве за такое надо арестовывать?"
1103-16 = "Вот именно! Это всё один большой заговор. Хватит ненавидеть мяту!"
1103-17 = "Она называла это мятным соком, но на самом деле это была зубная паста, разведённая водой. ☆"
1103-18 = "А-а, теперь понятно."
1103-19 = "...?!"
1103-20 = "Когда Иори забирала её, она что-то говорила про испорченную еду."
1103-21 = ""
1103-22 = "(Иори из Префектурной команды Геенны.)"
1103-23 = ""
1103-24 = "(Примечание: мятная мания.)"
1103-26 = "Но по вкусу же совсем как мятный сок. К тому же полезно для зубов... и дёшево."
1103-27 = "Да кто вообще станет это пить?! Нельзя продавать подобное только потому, что тебе нравится!"
1103-28 = "В общем, Изуми любит мяту потому, что у неё нет этого рецептора."
1103-29 = "Иначе ей казалось бы, что мята на вкус как шампунь или мыло."
1103-30 = "Это врождённая особенность, так что изменить её невозможно."
1103-32 = "Вот именно. Я бы не стала есть шампунь или мыло."
1103-33 = "Я ем мяту просто потому, что она мне нравится!"
1103-34 = "Хм. Похоже, ничего не поделаешь."
1103-35 = "Верно."
1103-36 = "Раз уж вы все здесь, почему бы нам не проверить, у кого есть этот рецептор?"
1103-37 = "Говорят, лучший способ принять других — лучше понять самого себя."
1103-38 = "Ох! Звучит весело! ☆"
1103-39 = "То есть мы сможем узнать, кому мята кажется шампунем?"
1103-40 = "Это также связано с моими поисками идеального вкуса. Мне стало интересно."
1103-41 = ""
1103-43 = "А теперь скажи: «А-а-а...» Это недолго."
1103-45 = "(Через несколько минут...)"
1103-47 = "Вот результаты. Начнём с Акари: у неё рецептора нет."
1103-48 = "Правда? Значит, если мне не нравится мята, я просто привередничаю?"
1103-49 = "Не повредит попробовать её ещё раз, без предубеждений."
1103-50 = ""
1103-51 = ""
1103-52 = "Дальше Харуна. У неё рецептор есть."
1103-53 = "Харуна, значит, тебе мята должна казаться на вкус шампунем или мылом."
1103-54 = "Я этого ожидала. Я стараюсь одинаково относиться ко всем вкусам, но даже мне мята даётся нелегко."
1103-55 = "Подумать только, причина была в моей ДНК. И всё же это не оправдание для предвзятости."
1103-56 = ""
1103-57 = ""
1103-58 = "У Джунко рецептора тоже нет."
1103-59 = "Мне нравится почти всё — включая мяту."
1103-60 = "Следующая — Изуми."
1103-61 = "Разве и так не очевидно, что у Изуми нет рецептора? Она ведь обожает мяту."
1103-62 = ""
1103-63 = "Ага! Мята вкусная! Вообще не понимаю, почему люди её ненавидят."
1103-64 = ""
1103-65 = "Здесь сказано, что у Изуми... рецептор есть."
1103-67 = "...?!"
1103-68 = "Ч-что?!"
1103-69 = "Ох. Значит, Изуми мята кажется на вкус шампунем или мылом?"
1103-70 = "А?"
1103-72 = "Не может быть! Так вот какой шампунь на вкус?"
1103-73 = "Ты не знала?! П-Погоди, то есть ты ешь мяту, хотя она для тебя на вкус как шампунь?!"
1103-74 = "Вкус субъективен, так что... вполне могут существовать люди, которым нравится вкус шампуня."
1103-75 = "Наверное... То есть кто-нибудь такой наверняка есть... да?"
1103-76 = "В-Вы о чём вообще?! Это совершенно ненормально!"
1103-77 = "Зачем кому-то есть то, что на вкус как мыло или шампунь? Это же тупость!"
1103-79 = "Ого... Так вот какой вкус у шампуня?"
1103-80 = ""
1103-81 = "(улыбается) Значит, теперь я могу есть шампунь?"
1103-82 = "ДАЖЕ НЕ ДУМАЙ!"
1103-83 = "Непредвзятый вкус"
