[translation]
1001905-1 = "План"
1001905-2 = "Ты вовремя, Сенсей. Я тебя ждала."
1001905-3 = "Сегодняшняя тренировка на тебе. Я готова ко всему, что ты для меня приготовил."
1001905-4 = "Итак, чему мне нужно научиться сначала? Расскажи всё, что мне нужно знать, чтобы приспособиться к жизни здесь."
1001905-5 = "[s1] «Вообще-то у меня нет какого-то конкретного плана.»\n[s2] «Лучшая стратегия — делать то, что хочется.»"
1001905-6 = "Что?"
1001905-7 = "Что?"
1001905-8 = "Ты ничего не запланировал? Что это значит?"
1001905-9 = "Ты ведь сам решил, что сегодня будет день тренировки."
1001905-10 = "Ты правда вообще ничего не подготовил?"
1001905-11 = "Ты говоришь, что всё равно ничто никогда не идёт по плану? Что ты имеешь в виду?"
1001905-12 = "Но, Сенсей. Мир держится на порядке. Без планирования ничего не работает. То же касается операций и заданий."
1001905-13 = "Нельзя просто делать что угодно без подготовки. Так ты ничего не добьёшься даже в обычной жизни..."
1001905-14 = "[s3] «Ты уже достаточно подготовлена, Азуса.»\n[s4] «Тебе нужна небольшая доза неэффективности.»"
1001905-15 = "Вы так думаете?"
1001905-16 = "Вы так думаете?"
1001905-17 = "Звучит так, будто ты снова просто меня дразнишь."
1001905-18 = "...Нет. Я уже пообещала, что сегодня буду следовать твоим указаниям."
1001905-19 = "Ладно. Что мне нужно сделать, чтобы быть менее подготовленной?"
1001905-20 = "Ты хочешь, чтобы я выбрала сама? Почему?"
1001905-21 = "Я-я должна следовать твоим указаниям. Разве не в этом смысл тренировки? Почему выбирать должна я?"
1001905-22 = "Ну, в таком случае... Хм."
1001905-23 = "А? Я слишком много думаю?"
1001905-24 = "Но я должна убедиться, что принимаю разумное решение..."
1001905-25 = "Ты хочешь, чтобы я набиралась опыта, принимая необдуманные решения?"
1001905-26 = "Я-я не понимаю. Всё так запутанно."
1001905-27 = "..."
1001905-28 = "Десерт."
1001905-29 = "Я хочу перекусить, так что... поход в кондитерскую подойдёт?"
1001905-30 = "[s5] Уверенно направиться к кондитерской.\n[s6] Медленно подтолкнуть Азусу в сторону магазина."
1001905-31 = ""
1001905-33 = ""
1001905-34 = ""
1001905-35 = "П-Подожди! Сенсей! Я ещё не приняла окончательное решение!"
1001905-36 = ""
1001905-38 = ""
1001905-39 = ""
1001905-40 = "П-Подожди! Сенсей! Я ещё не приняла окончательное решение!"
1001905-42 = "Как только мы вошли в магазин, сотрудники встретили нас улыбками."
1001905-43 = "Азуса колебалась, поэтому я заказал за неё всё, что выглядело вкусно."
1001905-44 = ""
1001905-46 = ""
1001905-47 = "...?!"
1001905-48 = "Вкусно! Такое сладкое!"
1001905-49 = "Эти ингредиенты, способ выпечки...! Наверняка будут проблемы с доставкой и хранением, но какая разница?!"
1001905-50 = "Это так вкусно!"
1001905-51 = "Глаза Азусы сияли, пока она ела кусочек за кусочком."
1001905-54 = "Позже, в игровом зале..."
1001905-55 = "Уф. Да вы издеваетесь. Я проиграла?!"
1001905-56 = "Эта игра наверняка подкручена. Зачем вообще люди играют в этот мусор?"
1001905-57 = "Вообще, игры — пустая трата времени. Что ты от них получаешь?"
1001905-58 = "Это совершенно бессмысленно. Терпеть не могу!"
1001905-59 = "...Что?"
1001905-60 = "Ты хочешь, чтобы я попробовала ещё раз? Думаешь, я так легко сдамся?"
1001905-61 = "..."
1001905-62 = "П-Подвинься! Я только что придумала, как победить!"
1001905-63 = "Вот оно. Сейчас я его уничтожу!"
1001905-65 = "Через шестнадцать жетонов Азуса наконец прошла уровень."
1001905-66 = "Она отказывалась это признавать, но когда наконец победила, выглядела так, будто попала на небеса."
1001905-67 = "После этого мы посетили множество весёлых мест в торговом центре: рестораны, караоке и кинотеатр."
1001905-68 = "Каждый раз всё происходило одинаково. Сначала Азуса отказывалась, а вскоре уже полностью увлекалась."
1001905-70 = "Мы были так заняты, что я потерял счёт времени."
1001905-71 = "Что теперь? Куда пойдём дальше?"
1001905-72 = "Не знаю, что выбрать..."
1001905-73 = "Что? Ты хочешь пойти туда?"
1001905-74 = "Э-Эм, ладно. Если ты так хочешь."
1001905-75 = "[s] Войти в магазин вместе с Азусой."
1001905-76 = ""
1001905-78 = ""
1001905-79 = ""
1001905-81 = "...!"
1001905-82 = "Это...! Это же...!"
1001905-83 = "[s] «Это магазин Momo Friends.»"
1001905-84 = "Боже мой! Как бесстыдно!"
1001905-85 = "Отвратительно! Просто ужасно!"
1001905-86 = "Ты говоришь, это место для тренировки дружбы? Я-я должна пойти туда? К этим штукам?"
1001905-87 = "Н-Но я...!"
1001905-89 = "Я...!"
1001905-90 = ""
1001905-94 = "― Наверное, они всё-таки довольно милые!"
1001905-96 = "― Я никогда не видела столько милых плюшевых игрушек![wa:820]"
1001905-99 = "― К-Как же неловко...[wa:860]"
1001905-102 = "― Ты ведь снова будешь меня дразнить, да?[wa:800]"
1001905-104 = "― Ну, я уже привыкла. Если это ты, я не против.[wa:2860]"
1001905-107 = "― Ух! Какая милота![wa:1420]"
1001905-109 = "― Именно о таком я всегда мечтала.[wa:650]"
1001905-112 = "― Хи-хи-хи... Хи-хи...[wa:2640]"
1001905-115 = "― ..."
1001905-117 = "― А? О, ничего.[wa:2880]"
1001905-120 = "― (Лучше ничего не говорить.)"
1001905-122 = "― (Это только усложнит наши отношения.)"
1001905-125 = "― Так откуда ты узнал о таком милом месте?[wa:570]"
1001905-127 = "― Тебе нравятся такие вещи? Правда?[wa:590]"
1001905-130 = "― Ты обращаешься со мной как с ребёнком?[wa:1610]"
1001905-132 = "― Ну... не то чтобы я была против.[wa:600]"
1001905-135 = ""
1001905-136 = "Надо будет как-нибудь вернуться сюда."
1001905-137 = ""
1001905-139 = ""
1001905-140 = ""
1001905-141 = "Ты с самого начала это задумал? Весь день планировал привести меня сюда, да?"
1001905-142 = "Ты правда впервые там был?"
1001905-143 = "Ты просто захотел зайти, потому что там выглядело весело? Как и во все остальные места, где мы сегодня были?"
1001905-144 = "К-Как ты можешь быть таким..."
1001905-145 = "...беззаботным?"
1001905-146 = "По твоим словам, если я буду слишком строго придерживаться плана, то упущу маленькие радости жизни."
1001905-147 = "Ты говоришь, что если бы сегодня всё было заранее распланировано, я бы не повеселилась так сильно."
1001905-148 = "...Кажется, я наконец начинаю понимать."
1001905-149 = "Сегодняшняя тренировка была бесценной."
