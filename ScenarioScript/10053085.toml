[translation]
10053085-2 = ""
10053085-3 = "...А?!"
10053085-4 = "Что случилось? Я думала, будет драка?"
10053085-5 = ""
10053085-7 = ""
10053085-8 = "Она и была. Ты как-то умудрилась запнуться о собственную обувь сразу после начала. Мгновенно отключилась, и мы решили оставить тебя лежать."
10053085-9 = "В такой критический момент. Какой позор..."
10053085-10 = "То есть... ты сама избила всех этих бандитов?"
10053085-11 = "Ещё один ДИКИЙ логический скачок... Нет. Большинством занялась Коноха."
10053085-12 = "Хм? Для розыгрыша они слишком далеко зашли."
10053085-13 = ""
10053085-15 = ""
10053085-17 = ""
10053085-18 = "Теперь..."
10053085-19 = "Как насчёт немного НАСТОЯЩЕГО веселья?"
10053085-20 = ""
10053085-22 = ""
10053085-23 = ""
10053085-24 = "П-Подождите! Мы сдаёмся! Вы же не станете бить невинных гражданских, правда?"
10053085-25 = "Конечно стану. Кто сказал обратное?"
10053085-26 = "Студентам Валькирии так можно?!"
10053085-27 = "Да, очевидно. Как думаете, зачем я вообще пошла в полицию?"
10053085-28 = "Хотя, может, разойдёмся миром? Возможно, вы уже поняли, что связываться с офицером — не лучшая идея."
10053085-29 = "Подождите! О чём вы вообще? Мы вас не трогали! Это ложное обвинение! Она подбрасывает улики!"
10053085-30 = "Разве не вы перерезали телефонную линию? И мост?"
10053085-31 = "Эм... Ну да, это мы."
10053085-32 = "Наглости-то хватает ей ещё огрызаться, учитывая, что именно ТЫ вытащила танк. Классический газлайтинг."
10053085-33 = "Ты вообще на чьей стороне?"
10053085-34 = "О? А тут у нас несколько комиков. На шоу талантов пробуетесь?"
10053085-35 = "Эй, Рэна! Ты говорила, что не веришь в магию? Хочешь, прямо сейчас покажу?"
10053085-36 = ""
10053085-38 = ""
10053085-39 = ""
10053085-41 = "Видишь ли, у меня есть «магическая» способность заставить любого говорить правду. Круто, да?"
10053085-42 = ""
10053085-50 = ""
10053085-51 = "Н-Нет...! Честно! Клянусь! Это всё!"
10053085-52 = "Да, ладно! Это мы распространяли слухи о Цучиноко. Мы знали, что они заманят вас сюда."
10053085-53 = "Но всё остальное делали не мы! Честно!"
10053085-55 = "...Подождите, что вы сказали?"
10053085-56 = "Все свидетельства о Цучиноко были... сфабрикованы? Намеренная мистификация?"
10053085-58 = "Хм? А ты кто?"
10053085-60 = "Цучиноко не существует?"
10053085-62 = "...? Да. Очевидно. Никакого Цучиноко не существует."
10053085-63 = "Мы знали, что заместитель директора суеверна, поэтому раздули слух, чтобы заманить её сюда."
10053085-64 = "Вы специально целились в меня. Почему? Жить надоело?!"
10053085-65 = "Да ладно вам! Будьте реалистами. Это был розыгрыш! Все знают, что Цучиноко — миф!"
10053085-66 = "Но говорить, что она сама виновата, потому что попалась, — классическое обвинение жертвы."
10053085-67 = "Эй, ты вообще на чьей стороне?!"
10053085-68 = ""
10053085-70 = ""
10053085-71 = ""
10053085-72 = ""
10053085-73 = "..."
10053085-74 = "...Понятно. Цучиноко не существует."
10053085-75 = "Цубаса...?"
10053085-76 = "Я думала, если найду Цучиноко, а потом и пришельцев, Семинару придётся признать мою работу."
10053085-77 = "Тогда я смогла бы снова открыть клуб..."
10053085-78 = "..."
10053085-79 = ""
10053085-81 = ""
10053085-82 = "...Н-Нет! Я знала, что так может случиться! Я даже это предсказывала!"
10053085-83 = "И вообще, мне не обязательно находить именно Цучиноко, чтобы возродить клуб... Да!"
10053085-84 = "[s1] «Хорошо. Тогда продолжим поиски Цучиноко?»\n[s2] «Скоро взойдёт солнце.»"
10053085-87 = "А? Вы не слышали, Сенсей? Цучиноко не существует."
10053085-88 = ""
10053085-90 = ""
10053085-91 = ""
10053085-92 = "Да. Эти бандиты сами сказали, что распространяли слухи."
10053085-93 = "Но я ведь с самого начала не верила в Цучиноко."
10053085-94 = "Так что... выходит, ничего не изменилось."
10053085-95 = "Рэна..."
10053085-96 = ""
10053085-98 = ""
10053085-99 = ""
10053085-100 = "Ох... Обожаю хорошие сюжетные повороты."
10053085-101 = "Эй, ты."
10053085-103 = "Да?!"
10053085-104 = "Я закрою глаза на сегодняшние происшествия — при условии, что вы присоединитесь к нам. Добро пожаловать в Экспедиционную группу X. С такими масками вы отлично впишетесь."
10053085-105 = "Но Цучиноко не—"
10053085-106 = "Какой из этих кулаков был магическим? Левый или правый?"
10053085-107 = "Н-Не надо проверять! Все, ищем Цучиноко! Не оставим ни одного камня неперевёрнутым! Я начну... возле домика!"
10053085-108 = "Не упустите ни одной чешуйки! Прислушивайтесь к любому шороху!"
10053085-109 = ""
10053085-111 = ""
10053085-112 = ""
10053085-113 = ""
10053085-114 = "Хм..."
10053085-115 = "Всё равно что-то не сходится..."
10053085-116 = "[s3] «Что такое, Рэна?»\n[s4] «Тебя что-то беспокоит?»"
10053085-119 = "Да. Кто был на той фотографии, которую мы сделали?"
10053085-120 = "А? Очевидно, одна из тех девушек, которых мы только что поймали."
10053085-121 = "Я тоже сначала так подумала..."
10053085-122 = "Но ни на одной из них нет белого."
10053085-123 = "Э...?"
10053085-124 = ""
10053085-126 = ""
10053085-127 = "Ч-Что ты—?!"
10053085-128 = "Кто эта подозрительная особа? Она всё это время пряталась в кустах, пока мы дрались?"
10053085-129 = "Подозрительно."
10053085-130 = ""
10053085-131 = "[ns5] «Подождите, этот голос...?»\n[ns6] «Неужели...?»"
10053085-135 = "Президент?!"
10053085-136 = ""
10053085-140 = ""
10053085-141 = ""
10053085-142 = "Ах, ха-ха-ха... Здравствуй? Давно не виделись, дорогая Цубаса."
10053085-143 = "[s7] «Мирай... твой президент...?»\n[s8] «То есть клуб Цубасы на самом деле...?»"
10053085-146 = ""
10053085-148 = ""
10053085-149 = ""
10053085-150 = "А? Я думала, что говорила вам."
10053085-151 = "Я член Клуба псевдонауки. Ну, технически — бывший член..."
10053085-152 = "Вижу, вы уже знакомы с президентом Мирай."
10053085-153 = ""
10053085-155 = ""
10053085-156 = ""
10053085-157 = "Эм, можно ли сказать, что они меня «знают»? Возможно, было бы лучше, если бы мы вообще никогда не встречались..."
10053085-158 = "...Клуб псевдонауки? Президент Мирай? Кажется, мне это что-то напоминает."
10053085-159 = "Эй, давайте не будем всё переворачивать."
10053085-160 = "На этот раз у меня не было никаких, абсолютно НИКАКИХ злых намерений!"
10053085-161 = "Разумеется, я-я вообще никогда не желаю никому зла или неприятностей. Ни одного закона в жизни не нарушила..."
10053085-163 = "А, вспомнила. Я видела твою ориентировку. Ты мошенница!"
10053085-165 = "М-М-Мошенница?! Я изобретательница, которая использует НАУКУ для создания товаров на благо людей! Я... просто не успеваю возиться со всей этой бюрократией и нормативами!"
10053085-166 = "...? Разве ты не продаёшь всякие германиевые браслеты и нефритовые коврики?"
10053085-167 = "Это несколько наших самых продаваемых товаров. Очень-очень много довольных клиентов..."
10053085-168 = "Так ты ВСЁ-ТАКИ мошенница."
10053085-169 = "Подождите, а что я вообще сделала Клубу псевдонауки?"
10053085-170 = "А? Почему ты спрашиваешь?"
10053085-171 = "Ты здесь не ради мести?"
10053085-172 = "«Мести?» С чего бы мне тратить на это время? Какая пустая трата времени и денег!"
10053085-173 = "Ты часто представляешь себя центром Вселенной? Это может привести к мании величия."
10053085-174 = "Ладно. Тогда зачем ты здесь?"
10053085-175 = "Ну... Видишь ли, это сложно объяснить..."
10053085-176 = "Абракадабра, Рэна! Настало «Время магии»!"
10053085-177 = ""
10053085-179 = ""
10053085-180 = "Подождите! Назад! Я всё расскажу, ладно?!"
10053085-181 = "Прибегать к физическим угрозам? Как варварски..."
10053085-182 = "Для начала, жертва здесь вообще-то я! Не забывайте."
10053085-183 = "...? Хорошо. Продолжай."
10053085-184 = "Видите ли... Только, пожалуйста, не говорите маленькой Цубасе..."
10053085-185 = ""
10053085-187 = ""
10053085-188 = "Я услышала, что она собирается в поездку с несколькими «друзьями из интернета»..."
10053085-189 = "Не поймите неправильно, но Цубаса... своеобразная. Она искренне во всё верит и не слишком часто общается с людьми..."
10053085-190 = "Ты следила за нами, потому что переживала за неё?"
10053085-191 = "Эй, я не планировала целый поход! Хотела просто заглянуть, убедиться, что всё нормально, и вернуться!"
10053085-192 = "Но тут вообще не было мобильной связи!"
10053085-193 = "А потом ещё и мост обрушился?!"
10053085-194 = "А вдобавок я узнаю, что она с какой-то громилой из Валькирии?"
10053085-195 = "Вы вообще представляете, как я СТРАДАЛА?"
10053085-197 = "Ого, профессиональный уровень перекладывания вины..."
10053085-199 = "Значит, у домика была ты. Почему ты просто не постучала, не рассказала правду и не попросила помощи?"
10053085-200 = "Как я могла?! Я президент! У меня уважаемая репутация!"
10053085-202 = "Если кричать об этом, уважаемее ты не становишься..."
10053085-203 = "Значит, белое пятно на фотографии — это ты?"
10053085-204 = "Какая фотография? ...А, да. Я так испугалась, когда вы открыли окно, что убежала."
10053085-205 = "Какой-то совсем будничный финал..."
10053085-206 = ""
10053085-208 = ""
10053085-209 = ""
10053085-210 = "Ну, босс, что мне с ней делать? Связать?"
10053085-211 = "Что? За что?!"
10053085-212 = "Ты мошенница, дамочка. На тебя даже ориентировка есть."
10053085-213 = "Но я же открыла вам сердце! Рассказала свою трагическую историю! Вы... не можете!"
10053085-214 = ""
10053085-216 = ""
10053085-217 = ""
10053085-218 = "Хм... Да, оставь её."
10053085-219 = "Нельзя ожидать, что такой человек, как я, будет помнить каждого мелкого преступника со стены розыска. К тому же я не на службе."
10053085-220 = "Параноидальная президент, которая заботится о своей младшей? Эм, не знаю. Кажется, о такой я не слышала."
10053085-221 = "[s] «И это правда нормально?»"
10053085-222 = "Если честно — конечно нет! Если бы я была из тех, кто следует протоколу, она уже сидела бы в наручниках."
10053085-224 = "Ух...!"
10053085-225 = ""
10053085-228 = ""
10053085-229 = "Но."
10053085-230 = "Я не особо следую протоколу. И вообще не слишком люблю правила."
10053085-231 = "Просто, эм, держите это в секрете от Бюро, ладно?"
10053085-232 = "Ты меня отпустишь?"
10053085-233 = "Я не «отпускаю тебя,» я просто выбираю ничего не замечать."
10053085-234 = "Слушай, легавая. Если ты нарушишь слово..."
10053085-235 = "...То что именно ты сделаешь? Раз такая умная, веди себя соответственно. Я даю тебе поблажку."
10053085-236 = "А, да... Простите."
10053085-238 = ""
10053085-239 = "Эй, у вас всё в порядке? Вы уже довольно долго разговариваете..."
10053085-240 = "Н-Нет! Просто! Эм, как бы это сказать?"
10053085-241 = "А, Цучиноко! Я тоже здесь провожу исследование. Я... подумывала остановиться в этом чудесном домике, поэтому осматривала... стены и прочее."
10053085-242 = "О, правда?! Типа как «клубная деятельность»? Как раньше?"
10053085-243 = "А, нет, дорогая Цубаса. Официально работать вместе было бы немного сложно... Во-первых, я в бегах, а во-вторых, Клуб псевдонауки всё ещё в чёрном списке..."
10053085-244 = ""
10053085-246 = ""
10053085-247 = "Ну, всё же..."
10053085-248 = "Может, буду иногда к тебе заглядывать. Хотела бы?"
10053085-249 = ""
10053085-251 = ""
10053085-252 = ""
10053085-253 = "...!"
10053085-254 = "...Возможно."
10053085-255 = "Возможно, настоящим «Цучиноко» были друзья, которых мы нашли по пути."
10053085-256 = ""
10053085-258 = ""
10053085-259 = ""
10053085-260 = "...? Ты вообще о чём?"
