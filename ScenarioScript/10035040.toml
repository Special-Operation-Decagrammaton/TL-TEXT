[translation]
10035040-1 = "Эпизод 4;Застряли у волнового бассейна!"
10035040-2 = ""
10035040-3 = "Отлично, мы осмотрели аттракционы, так что разминку можно считать законченной."
10035040-4 = "Хи-хи-хи, как насчёт теперь волнового бассейна?"
10035040-5 = "Давайте оторвёмся по полной!"
10035040-8 = "Спасибо, что посетили «Эгир», крупнейший аквапарк Кивотоса. Благодарим за терпение."
10035040-9 = "Подготовка главного аттракциона нашего парка — открытого волнового бассейна — наконец завершена."
10035040-10 = "Наслаждайтесь отдыхом в волновом бассейне, созданном, чтобы имитировать настоящий пляж!"
10035040-11 = "...И ещё: трое спасателей, которые ранее устроили проблемы в детском бассейне, переведены к волновому бассейну. Пожалуйста, проследуйте на новое место работы."
10035040-13 = "...Ага, ну конечно."
10035040-14 = "Эх, не хочу обратно на улицу..."
10035040-15 = "...Мне так стыдно. Это всё моя вина."
10035040-16 = "Я не хотела заставить вас чувствовать себя виноватой, директор."
10035040-17 = "Просто хотелось бы, чтобы владелец перестал гонять нас туда-сюда."
10035040-18 = "Не переживайте, директор!"
10035040-19 = "Я пару раз теряла сбежавших заключённых, но в итоге всё всегда обходилось!"
10035040-20 = "[s1] «(Звучит как-то знакомо, но...)»\n[s2] «(Кажется, это было больше пары раз...)»"
10035040-23 = "В любом случае, сегодня мы здесь просто работаем спасателями."
10035040-24 = "Пойдём к волновому бассейну."
10035040-27 = "Ого! Какая огромная!"
10035040-28 = "И правда выглядит как настоящий пляж, да?"
10035040-29 = "Особенно с такой толпой."
10035040-30 = "И всеми этими спасателями, которые за ними следят."
10035040-31 = "Нам придётся очень тесно с ними координироваться."
10035040-32 = ""
10035040-34 = ""
10035040-35 = "Эй! Вы, должно быть, новые спасатели на подмогу, да? Бассейн большой, так что рассредоточьтесь и держите дистанцию. Так будет проще контролировать толпу."
10035040-36 = "Так, живее! Прибывают новые посетители!"
10035040-37 = "Ладно, разделяемся и за работу!"
10035040-38 = "Мы справимся, вы двое!"
10035040-39 = "Увидимся на перерыве, Сенсей!"
10035040-40 = ""
10035040-42 = ""
10035040-43 = "Не бегай слишком много, а то быстро устанешь. Не напрягайся."
10035040-44 = "Как я."
10035040-45 = ""
10035040-47 = ""
10035040-48 = ""
10035040-49 = "Похоже, я одна."
10035040-50 = "Надеюсь, это не повторится..."
10035040-51 = "[s3] «Наверное, тот ребёнок просто испугался.»\n[s4] «Наверное, ему просто стало неловко.»"
10035040-54 = "Спасибо, что говорите это."
10035040-55 = "Но ведь это я заставила его так себя чувствовать."
10035040-56 = "Я просто выгляжу слишком пугающе..."
10035040-57 = "Эй! Ты там! Быстро на своё место!"
10035040-58 = "Ладно, пока сосредоточусь на задаче."
10035040-59 = "Если зайду поглубже в бассейн, я буду пугать меньше посетителей."
10035040-60 = ""
10035040-62 = ""
10035040-63 = "[ns] «...»"
10035040-65 = "*бульк* *бульк* *вдох*"
10035040-66 = "П-Помогите! Кх!"
10035040-67 = "Сохраняйте спокойствие."
10035040-68 = "Хватайтесь за этот спасательный круг."
10035040-69 = "*кашляет*! Я-Я схватился!"
10035040-70 = "Держитесь крепче. Всё будет хорошо."
10035040-73 = "...Вот, вы в безопасности."
10035040-74 = "Огромное спасибо! Вы спасли мне жизнь!"
10035040-75 = "Не заходите на глубокую часть. Там волны очень высокие."
10035040-77 = "Хм-м, хм-м, хм-м... Да-да ду-да..."
10035040-78 = "Эй! Вы там!"
10035040-79 = "Пожалуйста, не пользуйтесь электронными устройствами в бассейне. Вас может ударить током!"
10035040-80 = "А? Хотите знать, что это за песня?"
10035040-81 = "Это «Rock the City» группы Death Angels."
10035040-82 = "Я-Я не об этом спрашивала."
10035040-83 = "Можете, пожалуйста, вынуть наушники?"
10035040-84 = "Ради безопасности — и чтобы они не потерялись."
10035040-85 = "А, понял."
10035040-86 = "Спасибо!"
10035040-88 = "(То есть мне просто нужно не пускать людей из группы риска на глубокую часть?)"
10035040-89 = "(Думаю, с этим я справлюсь...)"
10035040-90 = ""
10035040-93 = "А, волны начинаются."
10035040-94 = ""
10035040-96 = ""
10035040-97 = "Хм? Почему вокруг никого нет?"
10035040-98 = "Все посетители уже ушли—?"
10035040-99 = ""
10035040-101 = ""
10035040-102 = "*кашляет*"
10035040-104 = "(Меня подхватило волнами?)"
10035040-105 = "(Так, спокойно. Плыви к берегу...)"
10035040-106 = "(...Хм?)"
10035040-107 = ""
10035040-110 = "(Ч-Что за...?! )"
10035040-111 = ""
10035040-112 = ""
10035040-113 = "С-Сенсей, смотрите, директора захватило волнами! Её вынесло на берег!"
10035040-114 = "Больше похоже, что она сама выплыла."
10035040-115 = "Директор Канна довольно спортивная, знаете ли."
10035040-116 = ""
10035040-118 = ""
10035040-119 = "*кашляет* Кирино, Фубуки...!"
10035040-120 = "Хм?"
10035040-121 = "Нужно немедленно эвакуировать всех!"
10035040-122 = "Эвакуировать? О чём вы?"
10035040-124 = "В воде что-то есть — какое-то огромное чудовище!"
10035040-125 = "[s] «Чудовище?!»"
10035040-126 = ""
10035040-128 = ""
10035040-129 = "Не может быть. Директор, вы уверены, что именно это видели?"
10035040-130 = "Не перенапрягайтесь, директор. Если вам уже мерещится всякое, день у вас и правда был тяжёлый."
10035040-132 = "Я серьёзно!"
10035040-133 = "Поднимайте тревогу и немедленно эвакуируйте всех!"
10035040-134 = "Быстрее! Пока оно не вернулось!"
10035040-135 = "Если вы настолько серьёзны, я поверю."
10035040-136 = "Есть! Поднимаю тревогу!"
10035040-137 = ""
10035040-139 = ""
10035040-140 = "О боже, что происходит?"
10035040-141 = "Я сделаю объявление."
10035040-142 = ""
10035040-144 = ""
10035040-145 = "Вам тоже нужно уходить, Сенсей."
10035040-146 = "Я знаю, в это трудно поверить, но…!"
10035040-147 = "[s5] «Я верю тебе, Канна.»\n[s6] «Пойдём вместе!»"
10035040-150 = "Я прослежу, чтобы все вышли. Уйду последней."
10035040-151 = "Это обязанность спасателя."
10035040-152 = "Хорошо!"
10035040-153 = ""
10035040-155 = ""
10035040-156 = "[ns] Иди помоги студентам с эвакуацией."
10035040-159 = ""
10035040-160 = "Ха-ха! Смотрите, как все паникуют и пытаются убежать!"
10035040-161 = "Хи-хи-хи, они все в ужасе!"
10035040-162 = "Хорошо, воспользуемся этим..."
10035040-163 = ""
10035040-165 = ""
10035040-167 = "...и повеселимся по-настоящему!"
