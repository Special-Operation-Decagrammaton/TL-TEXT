[translation]
11130-2 = "Episódio 13;Em Ação! A Gangue Mascarada de Maiô (1)"
11130-3 = "Mercado Negro - Centro"
11130-4 = "Ah... que cansaço."
11130-5 = "Já faz umas boas horas que estamos andando, né..."
11130-6 = "Dessa vez até o velhote aqui se rendeu.#nMinhas costas e meus joelhos estão gritando de dor."
11130-7 = "Hã... Hoshino-san, quantos anos você tem...?"
11130-8 = "Quase a mesma idade que você!"
11130-9 = "Olha só! Tem uma barraquinha de taiyaki ali!"
11130-10 = "Nossa, é mesmo. Quem diria que teria uma barraquinha num lugar desses."
11130-11 = "Que tal fazermos uma pausinha ali? Eu pago o taiyaki pra todo mundo!"
11130-12 = "Quê?! Nonomi-senpai, você vai usar aquele cartão de novo?!"
11130-13 = "A gente também tem o \"Cartão de Adulto\" do Sensei~."
11130-15 = "Não, não, eu que tô com vontade de comer, então deixa comigo☆ Vamos comer todas juntas, tá bom?"
11130-18 = "Obrigado pela preferência!"
11130-19 = "(Nhac, nhac)"
11130-20 = "Que delícia!"
11130-21 = "Ah, eu tava mesmo precisando de um docinho."
11130-22 = "(Farfalhar) Ahaha... obrigada."
11130-23 = "(Nhac)"
11130-24 = "Toma..."
11130-26 = "Pro Sensei também."
11130-27 = "[s] \"Obrigado.\""
11130-29 = "Quando a gente voltar, eu pago um bem caprichado pra você, Ayane-chan. Desculpa a gente estar comendo sem você..."
11130-30 = "Ahaha. Não precisa se preocupar, Nonomi-senpai. Eu tô beliscando uns petiscos por aqui também..."
11130-31 = "Hora de uma pequena pausa, né."
11130-33 = "Não é possível que não haja nenhuma informação até agora... Que estranho."
11130-34 = "As informações sobre o tanque que vocês estão procurando...#nCom certeza deveriam estar em algum lugar,#nmas por mais que eu procure, não aparece nada..."
11130-35 = "Rotas de venda, registros de armazenamento...#nTenho a impressão de que alguém está escondendo tudo de propósito."
11130-36 = "Mesmo para as empresas que controlam este lugar,#ndeveria ser impossível dominar o Mercado Negro de forma tão absoluta assim..."
11130-37 = "É tão fora do normal assim?"
11130-38 = "Mais do que fora do normal... é tipo, alguém normalmente iria tão longe assim? É essa a sensação..."
11130-39 = "As empresas que se reúnem aqui fazem coisa errada na cara dura mesmo, então, pelo contrário, não costumam esconder as coisas desse jeito."
11130-40 = "Por exemplo, aquele prédio ali. Aquele é o famoso Banco Clandestino do Mercado Negro."
11130-41 = "Banco Clandestino?"
11130-42 = "É um dos maiores bancos do Mercado Negro. Pelo que ouvi dizer, 15% dos bens roubados em crimes por toda Kivotos acabam passando por lá..."
11130-43 = "Desvio de verba, assaltos, sequestros... Os lucros obtidos em todo tipo de crime são convertidos em armas e armamentos ilegais, que depois são usados em ainda mais crimes..."
11130-44 = "É um ciclo vicioso que não acaba nunca."
11130-45 = "...Mas isso é praticamente o banco incentivando o crime!"
11130-46 = "Exatamente. O próprio banco é, na prática, uma organização criminosa..."
11130-47 = "..."
11130-48 = "Que absurdo! O que diabos o Conselho Estudantil Geral tá fazendo?!"
11130-49 = "Deve ter vários motivos, né... Cada lugar tem lá os seus próprios problemas."
11130-50 = "A realidade é bem mais suja do que a gente imaginava.#nAcho que ficamos tão focadas em Abydos que acabamos sem saber quase nada do mundo lá fora..."
11130-53 = "Desculpa interromper! Um grupo armado está se aproximando da posição de vocês!"
11130-54 = "!!"
11130-55 = "Não parece que perceberam vocês, mas...#nAcho melhor se esconderem por enquanto..."
11130-56 = "A-Ai, meu Deus?! Aqueles são os Guardas do Mercado!"
11130-57 = "Guardas do Mercado?"
11130-58 = "É a organização de mais alto escalão entre as forças de segurança daqui, aquela de que falei antes!"
11130-59 = "Vamos rápido!"
11130-62 = "...Patrulha? Parece que estão escoltando alguma coisa..."
11130-63 = "(Vrum...)"
11130-64 = "Estão escoltando um caminhão... É um carro-forte."
11130-65 = "Ué... e aquilo ali..."
11130-66 = "(Vrum...)"
11130-67 = "Entrou no Banco Clandestino, né?"
11130-70 = "(Guincho de pneus)"
11130-71 = "Trouxe a coleta deste mês."
11130-72 = "Bom trabalho, chegou cedo. Assine aqui o comprovante de coleta."
11130-74 = "Sim. (Rabiscando)"
11130-75 = "Perfeito."
11130-76 = "Com licença, então."
11130-79 = "Vamos, abram logo. É o dinheiro deste mês."
11130-80 = "(Vrum...)"
11130-82 = "Olhem... aquela pessoa..."
11130-83 = "Hã...? C-Como assim?!#nAquele cara não é o funcionário do banco que vai lá todo mês cobrar os juros?!"
11130-84 = "Ué, é ele mesmo."
11130-85 = "Quê?! O quê...?"
11130-86 = "...O que isso significa?"
11130-87 = "É-É verdade mesmo! O veículo também é da Kaiser Loans!"
11130-88 = "Parece ser o mesmo carro de quando pagamos os juros hoje de manhã...#nPor que ele está no Mercado Negro...?!"
11130-89 = "K-Kaiser Loans?!"
11130-90 = "Você conhece eles, Hifumi-chan?"
11130-91 = "A Kaiser Loans é... a financeira de juros abusivos operada pela famosa#nKaiser Corporation..."
11130-92 = "Famosa...? É gente barra-pesada?"
11130-93 = "A-Ah, não... O Grupo Kaiser em si não comete crimes abertamente...#nMas é um conglomerado que sabe operar muito bem na zona cinzenta entre o legal e o ilegal..."
11130-94 = "A Kaiser também tem se expandido bastante no nosso distrito de Trinity, e o \"Tea Party\" tem ficado de olho neles por conta da má influência sobre as alunas."
11130-95 = "O \"Tea Party\"... Até o conselho estudantil de Trinity tá de olho neles, hein."
11130-96 = "A propósito, a dívida de vocês por acaso... Abydos pegou empréstimo com a Kaiser Loans...?"
11130-97 = "Bom, não fomos nós que pegamos o empréstimo..."
11130-98 = "É uma longa história. Ayane-chan, consegue rastrear a rota daquele carro-forte que acabou de entrar?"
11130-99 = "Um momento, por favor."
11130-101 = "...Não deu. Parece que gerenciam todos os dados offline.#nNão encontrei absolutamente nada."
11130-102 = "Já imaginava."
11130-103 = "Pensando bem, os pagamentos sempre foram feitos apenas em dinheiro vivo, não é? Isso significa que..."
11130-104 = "O dinheiro que a gente pagou tava indo direto pro Banco Clandestino do Mercado Negro...?"
11130-105 = "Então quer dizer o quê?! Que a gente tava financiando o crime no Mercado Negro esse tempo todo?!"
11130-106 = "..."
11130-107 = "..."
11130-108 = "..."
11130-109 = "..."
11130-110 = "B-Bom, ainda não dá pra ter certeza absoluta... Não temos provas suficientes.#nAté descobrirmos o trajeto daquele carro-forte..."
11130-111 = "...Ah! Aquele comprovante de coleta que ele assinou agora há pouco...#nSe a gente der uma olhada nele, não serviria de prova?"
11130-112 = "Boa."
11130-113 = "Opa, que ótima ideia, Hifumi-chan."
11130-114 = "Ahaha... mas pensando bem, o documento já tá lá dentro do banco... então não tem jeito."
11130-115 = "Afinal, estamos falando do banco com a segurança mais pesada de todo o Mercado Negro...#nE ainda tem todos aqueles Guardas do Mercado de vigia..."
11130-116 = "Outro jeito de descobrir a rota de coleta do carro-forte...#nHum... deixa eu pensar..."
11130-117 = "Nn,"
11130-118 = "Não tem outro jeito."
11130-119 = "Hã?"
11130-120 = "Hoshino-senpai, só nos resta aquele método."
11130-121 = "Entendi, aquele, né... Então é aquele mesmo."
11130-122 = "...Quê?"
11130-123 = "Ah...!! É verdade, com aquele método dá certo!"
11130-124 = "O quê? Como assim? ...Não me digam que é aquilo?! Não é o que eu tô pensando, né?!"
11130-125 = "..."
11130-126 = "M-Mentira?! Vocês tão falando sério?!"
11130-128 = "...C-Com licença. Eu tô completamente perdida aqui... O que é \"aquele método\"?"
11130-129 = "Só nos resta uma única opção."
11130-130 = "(Vupt)"
11130-132 = "Assaltar o banco."
11130-133 = "Oi?!"
11130-134 = "Sabia, tinha que acabar nisso mesmo."
11130-135 = "OIIIIII?!"
11130-136 = "Uau☆ Então vamos dar uma lição nesse banco malvado!"
11130-137 = "QUÊÊÊ?! E-Esperem um pouco!"
11130-138 = "Ah... sério mesmo? Vocês tão falando sério mesmo...?"
11130-139 = "Ufa, se é assim..."
11130-140 = "Então vamos até o fim com isso!!"
11130-141 = "A-Ah, uá...? A-Ai, meu Deus...?"
11130-143 = "..."
11130-144 = "...Haa, entendido. A essa altura, nem adiantaria tentar impedir vocês...#nVai dar tudo certo... espero..."
11130-146 = "Desculpa, Hifumi. Não tenho uma máscara extra pra você."
11130-147 = "Ué, quer dizer que#nse a gente for pega, só vai restar botar a culpa toda em Trinity, né."
11130-148 = "Quê?! N-Não pode ser... Máscara... por quê... quer dizer, então... a-ai..."
11130-149 = "Coitadinha, isso é maldade demais."
11130-150 = "Hifumi-chan, por enquanto usa isso aqui☆"
11130-151 = "O saco de papel do taiyaki? Opa! Com isso aí dá pro gasto!"
11130-152 = "Hã? E-Esperem um pouquinho, pessoal..."
11130-153 = "A-Aii..."
11130-155 = "(Farfalhar de papel)"
11130-156 = "Aii..."
11130-157 = "..."
11130-158 = "Nn, perfeito."
11130-159 = "Também já coloquei o número. Hifumi-chan, você é a número 5☆"
11130-160 = "Mas o visual ficou nível chefão final, hein? A própria raiz de todo o mal, a grande chefona!"
11130-161 = "E-Eu vou ter que ir junto também? No assalto ao Banco Clandestino...?"
11130-162 = "Você prometeu agora há pouco, lembra? Hifumi-chan,#ndisse que hoje ia andar com a gente."
11130-163 = "U-Uaaah... E-Eu nunca mais vou ter coragem de encarar o pessoal do conselho estudantil..."
11130-164 = "Sem problema! A gente não tá fazendo nada de errado! Os errados são eles! Por isso que vamos assaltar!"
11130-165 = "Então, Sensei. Manda aquela frase."
11130-166 = "[s] \"Vamos assaltar o banco!\""
11130-168 = "Sim! Hora de partir☆"
11130-169 = "A-Aii..."
11130-170 = "Certo... Então, Gangue dos Maiôs Mascarados."
11130-172 = "(Vupt)"
11130-173 = "Vamos entrar em ação."
11130-175 = "Próximo;Em Ação! A Gangue Mascarada de Maiô (2)"
