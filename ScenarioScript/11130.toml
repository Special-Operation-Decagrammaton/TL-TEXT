[translation]
11130-2 = "Эпизод 13;Банда в масках и купальниках! Часть 1"
11130-3 = "Улицы Чёрного рынка"
11130-4 = "*вздыхает* Я вымоталась."
11130-5 = "Такое чувство, будто мы уже несколько часов ходим..."
11130-6 = "Я слишком стара для такого. Колени и спина просто отваливаются."
11130-7 = "Правда? А сколько тебе лет, Хошино?"
11130-8 = "Я же говорила, мы все примерно одного возраста!"
11130-9 = "Смотрите! Там продают тайяки!"
11130-10 = "И правда. Не знала, что здесь есть уличные торговцы."
11130-11 = "Может, возьмём перекусить и отдохнём? Я угощаю!"
11130-12 = "Что?! Нономи, ты опять будешь платить своей картой?!"
11130-13 = "Всегда можно воспользоваться кредиткой Сенсея!"
11130-14 = ""
11130-15 = "Нет, всё нормально. Я сама очень хочу, так что настаиваю."
11130-18 = "Спасибо!"
11130-19 = "*ням* *ням*"
11130-20 = "Вкусно!"
11130-21 = "Фух, как раз вовремя. Сахар в крови уже падал."
11130-22 = "*шелест* Ха-ха. Спасибо. Не откажусь."
11130-23 = "*ням*"
11130-24 = "О."
11130-25 = ""
11130-26 = "Вы тоже берите, Сенсей."
11130-27 = "[s] «От такого не откажусь»."
11130-28 = ""
11130-29 = "Жаль, Аяне, что тебя здесь нет. Мы принесём тебе немного."
11130-30 = "Ха-ха. Всё нормально, Нономи. У меня есть перекус с собой."
11130-31 = "Вот видите? Всё в порядке. Просто ешьте и наслаждайтесь."
11130-33 = "Странно, что мы до сих пор не нашли ни одной зацепки."
11130-34 = "Я про оружие, которое вы ищете. Уверена, оно где-то есть, но мы не нашли вообще ничего."
11130-35 = "Даже бумажного следа нет. Ни записей о сделках, ни журналов складов... Ничего. Будто кто-то намеренно скрывает всю операцию."
11130-36 = "Даже корпорации не должны уметь настолько манипулировать Чёрным рынком."
11130-37 = "Это и правда странно."
11130-38 = "Не знаю, назвала бы я это странным. Скорее... зачем вообще так стараться?"
11130-39 = "Мы ведь говорим о Чёрном рынке. Обычно корпорациям ничто не мешает открыто вести здесь незаконный бизнес."
11130-40 = "Например, видите то здание? Это печально известный Стигийский банк Чёрного рынка."
11130-41 = "Стигийский банк?"
11130-42 = "Один из крупнейших банков Чёрного рынка. Говорят, через него проходит около 15 процентов всей незаконной прибыли от преступной деятельности в Кивотосе."
11130-43 = "Доходы от вымогательства, вооружённых ограблений, похищений и прочего затем идут на финансирование нелегального оружия для дальнейших преступлений."
11130-44 = "Замкнутый круг."
11130-45 = "Боже. Значит, банк такой же соучастник, как и остальные."
11130-46 = "Ага. Если подумать, банк сам по себе уже целая преступная организация."
11130-47 = "..."
11130-48 = "Это же безумие! Почему Генеральный ученический совет ничего не делает?!"
11130-49 = "Наверняка у них есть причины. Кто знает."
11130-50 = "Похоже, реальный мир совсем не такой радужный, как мы думали.#nНаверное, в безопасности Абидоса мы жили слишком защищённо..."
11130-51 = ""
11130-53 = "Погодите, все! К вам движется вооружённый отряд!"
11130-54 = "...!"
11130-55 = "Кажется, они вас не заметили, но на всякий случай лучше укрыться."
11130-56 = "Э-это смотрители рынка!"
11130-57 = "Смотрители рынка?"
11130-58 = "Они выполняют роль главных силовиков для всех групп, о которых я только что рассказывала!"
11130-59 = "Быстрее!"
11130-62 = "Похоже, это обычный патруль..."
11130-63 = "*щелчок* *лязг* *щелчок*"
11130-64 = "Похоже, они сопровождают бронированный грузовик, набитый деньгами."
11130-65 = "Эй. Смотрите туда."
11130-66 = "*щелчок* *лязг* *щелчок*"
11130-67 = "Он въезжает в Стигийский банк?"
11130-69 = ""
11130-70 = "*визг тормозов*"
11130-71 = "Это сборы за текущий месяц."
11130-72 = "Даже раньше срока. Отличная работа. Подпишите транспортные документы здесь."
11130-73 = ""
11130-74 = "Конечно. *чирк-чирк*"
11130-75 = "Прекрасно."
11130-76 = "Что ж. Хорошего дня."
11130-77 = ""
11130-78 = ""
11130-79 = "Открывайте ворота. Это денежные сборы за месяц."
11130-80 = "*вр-р-рум*"
11130-82 = "Эй. Это разве не...?"
11130-83 = "Какого чёрта?! Это же сотрудник банка, который каждый месяц забирает наши процентные платежи..."
11130-84 = "И правда."
11130-85 = "Что...?"
11130-86 = "Что происходит?"
11130-87 = "Вы правы! Это грузовик «Кайзер Кредит»!"
11130-88 = "Более того, это тот самый грузовик, в который сегодня утром загрузили наш наличный платёж! Что он делает на Чёрном рынке?!"
11130-89 = "«К-Кайзер Кредит»?!"
11130-90 = "Ты о них слышала, Хифуми?"
11130-91 = "Это кредитная компания печально известной Корпорации «Кайзер»..."
11130-92 = "Печально известной? Это преступная организация?"
11130-93 = "Не совсем. Корпорация «Кайзер» не делает ничего откровенно незаконного, но они определённо мутные. Постоянно ходят по грани между законной и преступной деятельностью..."
11130-94 = "«Кайзер» пытается расширить влияние и на район Тринити,#nпоэтому Чаепитие следит за ними в оба, чтобы они не создавали проблем студентам."
11130-95 = "Чаепитие... Это ученический совет Тринити, если я правильно помню."
11130-96 = "Ваш долг — перед «Кайзер Кредит»?"
11130-97 = "Ну, технически изначально долг был не наш."
11130-98 = "История довольно длинная. Аяне, можешь отследить тот бронированный грузовик?"
11130-99 = "Одну минуту."
11130-100 = ""
11130-101 = "Не получается. Похоже, они работают в закрытой сети. Я вообще не могу получить по ним данные."
11130-102 = "Стоило догадаться..."
11130-103 = "Если подумать, они очень настаивали на оплате исключительно наличными.#nНеужели потому, что...?"
11130-104 = "Наши наличные платежи стекаются в этот банк Чёрного рынка?"
11130-105 = "То есть всё это время мы фактически финансировали преступную деятельность Чёрного рынка?!"
11130-106 = "..."
11130-107 = "..."
11130-108 = "..."
11130-109 = "..."
11130-110 = "М-мы пока не можем утверждать наверняка... У нас нет твёрдых доказательств. Не раньше, чем узнаем, куда направляется этот грузовик."
11130-111 = "Разве транспортные документы, которые сотрудник только что подписал, нам не помогут?"
11130-112 = "Верно."
11130-113 = "Хорошая мысль, Хифуми."
11130-114 = "Хотя, если подумать... эти бумаги ведь внутри банка. Похоже, нам не повезло."
11130-115 = "И не просто банка — самого охраняемого банка на всём Чёрном рынке. Там полно вооружённой охраны."
11130-116 = "Вот бы был другой способ узнать маршрут этого грузовика. Так... Хм..."
11130-117 = "Нет."
11130-118 = "Другого способа нет."
11130-119 = "Простите?"
11130-120 = "Это наш единственный вариант, Хошино."
11130-121 = "Значит, вот как всё будет."
11130-122 = "Что?"
11130-123 = "А-а, теперь понятно! Мы ведь собираемся использовать ТОТ план, да?"
11130-124 = "Погодите. Вы же не серьёзно. Вы трое ведь не думаете о том, о чём, как мне кажется, вы думаете... правда?"
11130-125 = "..."
11130-126 = "Это что, было «да»?! Вы серьёзно?!"
11130-127 = ""
11130-128 = "Я не совсем понимаю. О чём вы все говорите?"
11130-129 = "Наконец-то настало время."
11130-130 = "*шорох*"
11130-132 = "Мы ограбим банк."
11130-133 = "Что?!"
11130-134 = "Выходит, это всё-таки был лучший план."
11130-135 = "Простите?"
11130-136 = "Ура-а! Пора преподать этому злому банку урок! ☆"
11130-137 = "Э-это ведь шутка, да?!"
11130-138 = "Это правда происходит? Мы действительно это сделаем?"
11130-139 = "Потому что если вы трое серьёзно..."
11130-140 = "...тогда я тоже с вами!"
11130-141 = "И ты, Сэрика...?"
11130-142 = ""
11130-143 = "..."
11130-144 = "*вздыхает* Поняла. Похоже, отговорить вас уже не получится. Удачи. Уверена, вы как-нибудь справитесь."
11130-145 = ""
11130-146 = "Прости, Хифуми. Мы не приготовили для тебя маску."
11130-147 = "Ну, если нас поймают, можем просто свалить всё на Тринити."
11130-148 = "Это было бы очень... ОЧЕНЬ плохо..."
11130-149 = "Но я не хочу, чтобы ты чувствовала себя лишней."
11130-150 = "Это лучшее, что мы смогли придумать на скорую руку. Держи, Хифуми! ☆"
11130-151 = "Пакет, в котором был тайяки? Гениально!"
11130-152 = "Погодите! Я ни на что такое не соглашалась..."
11130-153 = "А-а..."
11130-154 = ""
11130-155 = "*шуршит* *шуршит*"
11130-156 = "Мр-р-рп..."
11130-157 = "..."
11130-158 = "Прекрасно."
11130-159 = "Я даже номер тебе написала, Хифуми. Ты — номер 5. ☆"
11130-160 = "Ого, теперь она выглядит так, будто она наша главарь. Настоящий лидер."
11130-161 = "Я-я? В смысле... мы правда собираемся ограбить Стигийский банк?"
11130-162 = "Конечно, Хифуми. Помнишь? Сегодня мы держимся вместе."
11130-163 = "И как я объясню всё это Чаепитию, если они узнают?"
11130-164 = "А что тут объяснять? Мы грабим преступный банк! Мы хорошие!"
11130-165 = "Сенсей, окажете нам честь?"
11130-166 = "[s] «Ну что, ограбим банк!»"
11130-167 = ""
11130-168 = "Ура! Погнали! ☆"
11130-169 = "О нет..."
11130-170 = "*вздыхает* Всем бойцам Банды в масках и купальниках..."
11130-171 = ""
11130-172 = "*шорох*"
11130-173 = "Операция начинается."
11130-175 = "Следующий Эпизод;Банда в масках и купальниках! Часть 2"
