[translation]
2300003-1 = "Сахарная подзарядка"
2300003-2 = "Кафе «Мильфей»"
2300003-3 = "Вы меня удивили, Сенсей."
2300003-4 = "Как работа? В последнее время вы выглядите очень занятым..."
2300003-5 = "Надеюсь, я не надоедала вам своими сообщениями."
2300003-6 = "Простите, Сенсей."
2300003-7 = "[s1] «Всё хорошо. Это подождёт.»\n[s2] «Эти бумаги — проблема будущего меня.»"
2300003-8 = "Ха-ха..."
2300003-9 = "Ха-ха..."
2300003-10 = "В любом случае, ещё раз спасибо, что пришли сюда."
2300003-11 = "Я как раз собиралась зайти в кафе за десертом, когда подумала о вас."
2300003-12 = "Зная, насколько вы заняты, я решила, что сладкое поможет вам взбодриться."
2300003-13 = "Хи-хи."
2300003-14 = "[s] «Что будем заказывать?»"
2300003-15 = "А? Заказывать?"
2300003-16 = "О, я уже всё заказала, Сенсей."
2300003-17 = "Я хотела сэкономить вам время, ведь ваше расписание забито!"
2300003-18 = "Наш заказ должен быть готов с минуты на минуту."
2300003-19 = "Заказ готов! Один мокко, один мятно-шоколадный латте, кусочек шоколадного тирамису и шоколадный торт с ганашем."
2300003-20 = "Я заберу, Сенсей. Вы просто подождите здесь."
2300003-21 = ""
2300003-22 = ""
2300003-23 = "Та-дам!"
2300003-24 = "Я в основном заказала для вас шоколадные десерты, Сенсей..."
2300003-25 = "[s] «Шоколад?»"
2300003-26 = "Ну... Я слышала, шоколад хорошо помогает от усталости."
2300003-27 = "Вы не любите шоколад?"
2300003-28 = "[s3] «Моё второе имя — Шоколад.»\n[s4] «Под этой кожей? Шоколад. Сплошной шоколад.»"
2300003-29 = "Ого, правда? Рада это слышать."
2300003-30 = "Ого, правда? Рада это слышать."
2300003-31 = "Я переживала, что вам не понравится."
2300003-32 = "Такому мозгу нужен весь качественный сахар, какой только можно получить!"
2300003-33 = "Я тоже ем много сладкого, когда готовлюсь к экзаменам. Хи-хи."
2300003-34 = "Ну тогда!"
2300003-35 = "Приступим!"
2300003-37 = "После этого мы с Айри ели десерты, а я изо всех сил старался забыть о горе документов на своём столе."
