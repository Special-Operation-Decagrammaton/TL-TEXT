[translation]
1002205-1 = "Летний пейзаж с Хиной"
1002205-2 = "Комната Хины"
1002205-3 = ""
1002205-4 = "На сегодня с работой всё, верно?"
1002205-5 = "*вздыхает*"
1002205-6 = "Наверное, потому что я так рано встала, но перед встречей после обеда стоит немного отдохнуть."
1002205-7 = "Не нужно переутомляться и снова доставлять им проблемы."
1002205-8 = "Просто ненадолго закрою глаза..."
1002205-9 = ""
1002205-10 = ""
1002205-11 = ""
1002205-20 = "(Хм...)"
1002205-21 = "(А? Сколько я проспала?)"
1002205-22 = "(Тело такое тяжёлое. Неужели я настолько устала? Но важнее...)"
1002205-23 = "(*зевок* Такое чувство, будто я что-то забыла.)"
1002205-24 = "(Который час?)"
1002205-25 = "(Шесть вечера...?)"
1002205-26 = ""
1002205-27 = "(Это намного позже обеда... А!)"
1002205-29 = "Подожди. Я слишком долго спала."
1002205-30 = "[s] «Хорошо поспала, Хина?»"
1002205-31 = "А?"
1002205-32 = "Какого...?"
1002205-33 = "...?!"
1002205-34 = "С-Сенсей? Что ты вообще здесь делаешь?!"
1002205-35 = "И почему ты меня не разбудил? Уже ведь..."
1002205-36 = "[s1] «Ты спала очень крепко.»\n[s2] «Мне было жалко тебя будить.»"
1002205-37 = "Сенсей..."
1002205-38 = "Сенсей..."
1002205-39 = "Но..."
1002205-40 = "Мы договорились встретиться сегодня. Это я сама написала тебе и предложила провести время вместе."
1002205-41 = "*вздох* Прости."
1002205-42 = "Я даже обещала сходить с тобой на пляж. А теперь всё испортила."
1002205-43 = "Я не могу вот так смотреть тебе в глаза..."
1002205-44 = "А?"
1002205-45 = "Я так устала потому, что встала очень рано ради работы?"
1002205-46 = "Что ж, может, в этом есть доля правды. Работы действительно было много, и сегодня я встала особенно рано."
1002205-47 = "И всё же."
1002205-48 = "Это ничего не меняет. Всё случилось потому, что я проявила безответственность."
1002205-49 = "Мне нечем оправдываться."
1002205-50 = "Прости, Сенсей. На пляж уже слишком поздно... и из-за меня ты зря потратил время."
1002205-51 = "Поэтому..."
1002205-52 = ""
1002205-54 = ""
1002205-56 = ""
1002205-57 = ""
1002205-58 = "А? Что ты делаешь, Сенсей?"
1002205-59 = "П-Почему ты вдруг хватаешь меня за руку?"
1002205-60 = "[s] «Пляж ближе, чем тебе кажется.»"
1002205-61 = "Что значит «ближе, чем мне кажется»?"
1002205-62 = "О. Управляющий ведь говорил, что с террасы отеля видно пляж, верно?"
1002205-63 = "Вход был закрыт, потому что терраса не нужна для тренировочного лагеря, но..."
1002205-64 = "[s3] «Пойдём!»\n[s4] «Оттуда наверняка прекрасный вид на пляж.»"
1002205-65 = "Правда? Тебя точно это устраивает?"
1002205-66 = "Правда? Тебя точно это устраивает?"
1002205-67 = "..."
1002205-68 = "Ладно."
1002205-69 = "Ты всегда такой, Сенсей. Подумать только, тебя так легко порадовать."
1002205-70 = "Если ты этого хочешь... Может, это и правда не так плохо."
1002205-71 = "Тогда, пойдём...?"
1002205-72 = ""
1002205-74 = ""
1002205-75 = "А..."
1002205-76 = "А-А-А! Что...? Почему?"
1002205-77 = "П-Почему ты так на меня смотришь?"
1002205-78 = "Я просто... Это потому, что я только что проснулась."
1002205-79 = ""
1002205-81 = ""
1002205-83 = ""
1002205-85 = "А этот кардиган? Ты принёс его специально для меня?"
1002205-86 = "Да, хорошо."
1002205-87 = "(Ты всегда такой заботливый.)"
1002205-88 = "Спасибо. Я обязательно его надену."
1002205-89 = "Ну что, пойдём посмотрим на тот самый океанский вид, который ты так расхваливал?"
1002205-95 = "― Честно говоря, я никогда не понимала, почему люди так восхищаются[wa:2830]"
1002205-97 = "― океаном.[wa:50]"
1002205-100 = "― Пока все вокруг веселятся,[wa:10]"
1002205-102 = "― я никогда не чувствовала того же.[wa:150]"
1002205-105 = "― Под водой всё размыто, а когда ноги не достают до дна, мне становится тревожно.[wa:3200]"
1002205-107 = "― Сенсей, ты когда-нибудь чувствовал нечто подобное?[wa:40]"
1002205-110 = "― Мне было не по себе... Ночью море казалось бездонным колодцем.[wa:2740]"
1002205-112 = "― Я ненавидела ощущение, будто меня затянет внутрь, стоит только посмотреть на него.[wa:3040]"
1002205-115 = "― Но знаешь, кажется, я начинаю понимать. Хотя бы немного.[wa:5240]"
1002205-117 = "― Океан может быть таким красивым.[wa:1310]"
1002205-120 = "― Странно... Я никогда раньше такого не чувствовала.[wa:3350]"
1002205-123 = "― Спасибо, Сенсей... что ты здесь со мной.[wa:1440]"
1002205-125 = "― И за всё, чему ты меня научил.[wa:260]"
1002205-128 = "Мы смотрели на сверкающее море в ранних вечерних сумерках, пока совсем не стемнело."
