10057120-45 = "Yup, thank you very much. Please, continue."
10057120-46 = "Fire, commence!!"
10057120-56 = "Come to think of it, it's kind of warm today."
10057120-57 = "It's been rough with the blizzards these past few days, but things seem like they'll go well."
10057120-62 = "Oh, a grenade."
