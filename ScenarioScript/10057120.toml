10057120-22 = "Make them stop!"
10057120-30 = "Drag down the tyrant and win a 5-day weekend!"
10057120-31 = "All units, charge!!!"
10057120-35 = "Was the secretariat this way? It's been a while since I've come during the day, so I'm getting lost..."
