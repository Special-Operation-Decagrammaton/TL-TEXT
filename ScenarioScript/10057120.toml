10057120-98 = "That's true. Gehenna has volcanoes, too."
10057120-99 = "I want to buy a swimsuit, but I wonder if it's expensive~?"
10057120-100 = "I wonder if they take deferred payments? Either way, the prize money is ours!"
10057120-103 = "Oh, the officer on the 1st floor said they want you to relieve them for lunch."
10057120-104 = "Oh, you're right, it's already this time... Thank you!"
10057120-107 = "I want to buy a laptop when we get the prize money."
