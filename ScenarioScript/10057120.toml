10057120-79 = "It's nice that it's free, but they gave us way too much. It smells like gasoline..."
10057120-82 = "Cease fire! Cease fire! Who is that!"
10057120-83 = "Hello, this is No. 183. I'm here to get a stamp."
10057120-84 = "Oh, you're going to the office. It's a bit crowded right now."
10057120-85 = "If you get stopped at the checkpoint on the 2nd floor, tell them you were cleared on the 1st floor."
