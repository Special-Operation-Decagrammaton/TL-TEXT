10057120-66 = "I'm sorry! I threw it, but my hand slipped!"
10057120-67 = "Alright then, I'll throw it over there. Heave-ho!"
10057120-71 = "Gah!!"
10057120-75 = "It's great that we made it to the main tournament, but I feel a bit deflated."
10057120-76 = "I can't believe a coup suddenly happened and we ended up being the only ones in the qualifiers."
10057120-77 = "That's why they said they'll hold the qualifiers again later~#nWe're confirmed for the main tournament, though."
