[translation]
10057120-1 = "Episode 12;Peace in Their Own Way"
10057120-14 = "Worker's rights! Further guarantees!"
10057120-22 = "Make them stop!"
10057120-30 = "Drag down the oppressors and win the 5-day workweek!"
10057120-31 = "All units, charge!!!"
10057120-35 = "Was the administrative office this way? It has been a while since I came here during the day, so I am getting lost..."
10057120-36 = "What did you say~? The gunshots are~ making it hard to hear~!"
10057120-37 = "Well, it should be fine! Lana, make sure to follow right behind me!"
10057120-38 = "The air pressure changes are... ugh..."
10057120-39 = "Hii... We finally came here in the daytime, but Znamya Cafe is closed because of the damn coup..."
10057120-40 = "Um, excuse me during your shooting practice. Just passing through."
10057120-45 = "Yes, thank you very much. Please continue~"
10057120-46 = "Fire, start!!"
10057120-56 = "Come to think of it, it feels kind of warm today."
10057120-57 = "It has been tough with the blizzard the past few days, but things might actually work out."
10057120-62 = "Ah, a grenade."
10057120-65 = "Inhales... The sweet smell of TNT. Whose is this~?"
10057120-66 = "I am sorry! I threw it, but my hand slipped!"
10057120-67 = "Well then, I will throw it over there. Heave-ho!"
10057120-71 = "Guhah!!"
10057120-75 = "It is great that we made it to the main tournament, but all the tension just drained out of me."
10057120-76 = "I cannot believe a sudden coup happened and we ended up being the only preliminary contestants left."
10057120-77 = "That is why they are holding the preliminaries again later~ Which means we are guaranteed to advance to the main tournament."
10057120-78 = "I am glad they filled us up with plenty of fuel at the preliminary venue."
10057120-79 = "Free is nice, but they gave us way too much. It smells so much like gasoline..."
10057120-82 = "Ceasefire! Ceasefire! Who is that!"
10057120-83 = "Hello, this is No. 183. I came to get a stamp."
10057120-84 = "Ah, you are heading to the office then. It might be a bit crowded right now."
10057120-85 = "If you encounter an inspection on the second floor, just say you checked in on the first floor."
10057120-86 = "Understood. Everyone, have you had lunch?"
10057120-87 = "Actually... our replacements have not arrived yet, so not yet..."
10057120-88 = "In that case, I will let the administrative office know."
10057120-89 = "Thank you very much!"
10057120-91 = "Inside the Administrative Office"
10057120-96 = "We... barely have any clothes either. Clothes for three people fit into a single suitcase."
10057120-97 = "Then let us go shopping later! Gehenna is supposed to be warm, and we need new clothes!"
10057120-98 = "True. Gehenna has volcanoes, after all."
10057120-99 = "I want to buy a swimsuit too, but I wonder if it is expensive~?"
10057120-100 = "I wonder if we can pay later? The prize money is going to be ours anyway!"
10057120-103 = "Ah, the crew on the first floor said they want someone to relieve them for lunch."
10057120-104 = "Really, it is already this late... Thank you!"
10057120-107 = "I want to buy a laptop if we win the prize money."
10057120-108 = "You definitely should! Lana, you have to at least own one!"
10057120-109 = "I will get one that comes with a punch card reader."
10057120-110 = "Do they even sell those nowadays?"
10057120-113 = "Protect the Student Council President! Do not let anyone inside!"
10057120-118 = "Comrades! Expel Cherino! All units, charge! The revolution is right before our eyes!"
10057120-124 = "Um, are you waiting in line to enter the administrative office?"
10057120-125 = "No, I am just planning to pick up the gun if the person in front of me collapses."
10057120-126 = "Guess we do not need to wait in line then. Thank you!"
10057120-130 = "We are here for a different matter, not the coup. Coming through~"
10057120-139 = "Excuse me. I came to get a stamp on my outing permit."
10057120-142 = "There is no door, huh. Excuse me."
10057120-143 = "H-Hello..."
10057120-144 = "Hello! Where is President Cherino?"
10057120-145 = "She went to gather the Honor Guard, so she is not here right now."
10057120-146 = "I came to get a stamp too, but she happened to be out..."
10057120-147 = "So, I decided to play the role of Student Council President."
10057120-148 = "Let us see, stamp, stamp..."
10057120-152 = "This one belongs to the Security Committee, so it is wrong. This is a medal. Hmm..."
10057120-153 = "Hm. So this is what a stamp looks like."
10057120-156 = "Found it! Please give me your documents."
10057120-157 = "The Gehenna Cup, is it? Please be careful."
10057120-158 = "Next person, please~"
10057120-162 = "Shigure! It is our turn!"
10057120-163 = "Now that the president has changed, this is our chance! Let us get our reinstatement papers stamped!"
10057120-164 = "I never thought suspension could be lifted this easily."
10057120-165 = "We came to get approval for our reinstatement!"
10057120-166 = "Ah, yes, yes. Let us see..."
10057120-170 = "Huh? There is no such thing as Class 227 Special Class in the system?"
10057120-171 = "What!? That is impossible!!"
10057120-172 = "What could be wrong? Is it some kind of error?"
10057120-179 = "We finally got our outing permit!"
10057120-180 = "We are really going to participate in the Gehenna Cup!"
10057120-181 = "...Huh? Lana, what are you drawing?"
10057120-183 = "Sketching it before my memory fades."
10057120-184 = "A copy of the security key blueprint used for Red Winter protocols."
10057120-185 = "I was thinking of exploiting vulnerabilities in the authentication device management to perform a privilege escalation."
10057120-187 = "I have no idea what you are talking about, but it sounds fun~!"
10057120-188 = "Huh? By the way, where is Sensei?"
10057120-190 = "They left early because they had business to attend to. Said we would meet at the main tournament venue."
10057120-191 = "They also said they do not really like coups."
10057120-193 = "Is that so... Then we will definitely show Sensei our best in the main tournament!"
10057120-194 = "Our goal is victory!"
10057120-195 = "Alright! Three cheers for No. 183!!"
10057120-199 = "Hooray!!"
10057120-201 = "It is our Engine! ~Escape from No. 183!~"
