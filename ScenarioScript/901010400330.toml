[translation]
901010400330-7 = ""
901010400330-8 = "Здравствуйте, это FOX EATS!"
901010400330-9 = "Вы двое выглядите голодными. Ищете что-нибудь горячее, новое, популярное и вкусное?"
901010400330-10 = ""
901010400330-12 = ""
901010400330-14 = ""
901010400330-15 = "Именно так... Но простите, вы ведь вроде курьер?"
901010400330-17 = "FOX EATS специализируется на доставке еды, но мы также знаем все лучшие местные места. Это естественная часть работы!"
901010400330-18 = "Хотите рекомендации по порту Канэсаки?"
901010400330-19 = ""
901010400330-22 = ""
901010400330-23 = "Было бы замечательно!"
901010400330-24 = "Рекомендация от курьера еды. Она наверняка всё здесь знает!"
901010400330-26 = "Как насчёт блюда из краба прямо здесь, в Акита Сифуд? В Акита не прогадаете!"
901010400330-27 = "Они каждый день получают свежего краба и построили вокруг него всё своё потрясающее меню!"
901010400330-28 = ""
901010400330-31 = ""
901010400330-32 = "Мы разве... уже не проходили это место?"
901010400330-33 = "Простите, но, пожалуй, нет. Я не очень люблю краба."
901010400330-35 = "Ох! У вас, случайно, не аллергия на моллюсков?"
901010400330-36 = "Нет, дело не в этом... Краба просто трудно есть из-за панциря. Всё пачкается, да ещё и опасно."
901010400330-37 = "Я даже слышала, как на пляже крабы нападали на людей..."
901010400330-38 = "Мне кажется, я бы испугалась уже от одной острой клешни на тарелке."
901010400330-40 = "Ага. Почему крабы вообще такой формы? Одновременно острые и скользкие. Очень неудобно."
901010400330-42 = "Полагаю, они эволюционировали не ради того, чтобы мы их ели. Наверняка у них были свои причины."
901010400330-43 = "Тогда как насчёт блюда уже из очищенного крабового мяса?"
901010400330-44 = ""
901010400330-47 = ""
901010400330-48 = "Только мясо? И ничего не нужно ломать или держать?"
901010400330-49 = "Именно. Акита Сифуд может похвастаться разнообразным меню из очищенного краба. Только мясо — и никаких лишних хлопот!"
901010400330-50 = "Как насчёт крабового омлета? А их сливочная крабовая крокета с маслом тоже невероятная! Настоящий хит!"
901010400330-51 = "Риска пораниться не вижу..."
901010400330-52 = "А мне как раз хотелось чего-нибудь жирного..."
901010400330-53 = "Тогда решено. Пообедаем здесь?"
901010400330-59 = ""
901010400330-61 = ""
901010400330-62 = "Д-Добро пожаловать. На сколько человек?"
901010400330-64 = "На двоих!"
901010400330-65 = ""
901010400330-71 = "Вообще-то, можно нам стол побольше?"
901010400330-72 = "Мне нужно уместить три порции жареного риса с крабом!"
901010400330-73 = ""
901010400330-75 = ""
901010400330-76 = "Д-Да! Одну минуту, девушки!"
901010400330-77 = "Что происходит? Минуту назад здесь было пусто, а теперь очередь из клиентов..."
901010400330-78 = "Это Акита Сифуд? FOX EATS добавила вас в список Обязательно попробовать перед смертью!"
901010400330-79 = "Мне сказали, что за крабом нужно идти сюда."
901010400330-80 = "Да, это Акита Сифуд... Но вы сказали FOX EATS?"
901010400330-81 = ""
901010400330-83 = ""
901010400330-84 = "...Неужели всё это из-за того, что та девушка взяла мои меню?"
