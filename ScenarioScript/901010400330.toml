901010400330-78 = "Aqui é o Pescados Akita, a casa especializada em caranguejos que o FOX EATS indicou, né?"
901010400330-79 = "Todo mundo na rua tá falando que é o melhor lugar pra comer caranguejo de verdade na cidade!"
