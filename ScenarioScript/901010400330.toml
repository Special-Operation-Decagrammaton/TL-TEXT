901010400330-7 = ""
901010400330-8 = "Olá, muito bom dia! Aqui é do \"FOX EATS\"!"
901010400330-9 = "Por acaso vocês estão procurando um bom lugar para almoçar?"
901010400330-10 = ""
901010400330-12 = ""
901010400330-14 = ""
901010400330-15 = "Hã? Sim, mas... O quê? A gente não pediu delivery nenhum."
901010400330-17 = "O carro-chefe do FOX EATS são as entregas, mas também oferecemos consultoria gastronômica!"
901010400330-18 = "Se quiserem, posso indicar um restaurante fantástico com mesa livre agora mesmo aqui no porto."
901010400330-19 = ""
901010400330-22 = ""
901010400330-23 = "Olha só, aceitamos sim!"
901010400330-24 = "Que tipo de lugar uma entregadora local indicaria, hein?"
901010400330-26 = "Vejamos... No momento, minha recomendação de ouro é o \"Pescados Akita\"!"
901010400330-27 = "Eles recebem caranguejo vivo fresquinho todos os dias e preparam pratos fabulosos!"
901010400330-28 = ""
901010400330-31 = ""
901010400330-32 = "Esse lugar... não era aquele restaurante que a gente tava olhando agora há pouco?"
901010400330-33 = "Foi mal, mas passo. Não somos muito fãs de caranguejo."
901010400330-35 = "Seria por alguma alergia a frutos do mar?"
901010400330-36 = "Não, nada disso... É que comer caranguejo dá muito trabalho!"
901010400330-37 = "E além do mais, ouvi umas conversas estranhas de que andaram atacando pessoas por aí..."
901010400330-38 = "Dá até um arrepio esquisito só de olhar praquelas pinças pontudas."
901010400330-40 = "Pois é! Por que um bicho tão gostoso tem que ser tão chato de comer?"
901010400330-42 = "Talvez porque seja gostoso demais, aí precisa de uma armadura pra se proteger, haha!"
901010400330-43 = "Se a carapaça é o problema... que tal experimentarem pratos feitos com carne de caranguejo já desfiada?"
901010400330-44 = ""
901010400330-47 = ""
901010400330-48 = "Carne já desfiada sem casca?"
901010400330-49 = "Exato! Quebrar casca na mesa toma tempo e suja a roupa toda, não é mesmo?"
901010400330-50 = "Que tal uma omelete tenshinhan bem suculenta com caranguejo real desfiado? #nOu quem sabe croquetes cremosos de caranguejo na manteiga crocante?"
901010400330-51 = "Nossa... aí sim, desse jeito dá pra comer numa boa!"
901010400330-52 = "E eu tava louco pra comer uma comida quentinha e saborosa hoje."
901010400330-53 = "Bora almoçar lá naquele lugar então!"
901010400330-59 = ""
901010400330-61 = ""
