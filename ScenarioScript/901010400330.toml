901010400330-64 = "Duas pessoas, por favor~"
901010400330-65 = ""
901010400330-71 = "Tem mesa pra quatro aí dentro?"
901010400330-72 = "Com licença, quero três porções de arroz frito com caranguejo pra viagem, por favor!"
