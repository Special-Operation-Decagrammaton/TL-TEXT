[translation]
10004020-1 = "Эпизод 2;Неверленд с танхулу"
10004020-2 = "Променад Чёрной Черепахи"
10004020-3 = "Сенсей, смотрите! Танхулу с мандаринами!"
10004020-4 = "Я видела танхулу из боярышника, но с мандаринами — впервые!"
10004020-5 = "Аккуратно нанизанные мандарины на конце палочки похожи на золотые бутоны. Один вид уже радует."
10004020-6 = "Давайте попробуем, Сенсей. Вам понравится этот кисло-сладкий вкус!"
10004020-7 = "[s1] «Думаю, сначала стоит найти Шун.»\n[s2] «Перекусим потом.»"
10004020-8 = "Но... меню в этой лавке танхулу меняется каждый сезон, так что если не съедим сейчас, кто знает, когда ещё получится?"
10004020-9 = "Но... меню в этой лавке танхулу меняется каждый сезон, так что если не съедим сейчас, кто знает, когда ещё получится?"
10004020-10 = "Когда закончу, обязательно почищу зубы и буду слушаться инструкторов..."
10004020-11 = "Пожалуйста, купите мне один!"
10004020-12 = "Ну пожа-а-алуйста?"
10004020-13 = ""
10004020-15 = ""
10004020-16 = "[ns3] «Как я могу отказать такому личику?»\n[ns4] «Ладно, только один.»"
10004020-17 = "Ух ты! Спасибо, Сенсей!"
10004020-18 = "Ух ты! Спасибо, Сенсей!"
10004020-19 = ""
10004020-21 = "(А? Сенсей почему-то кажется мягче обычного.)"
10004020-22 = "(Потому что я выгляжу маленьким ребёнком?)"
10004020-23 = "(Немного нечестно пользоваться этим против Сенсея... но сейчас я хочу насладиться этой привилегией.)"
10004020-25 = ""
10004020-26 = ""
10004020-27 = "М-м-м! Такая сладкая! Танхулу с Променада Чёрной Черепахи — лучшие."
10004020-28 = "Каждый очищенный мандарин покрыт тонким слоем сахара, поэтому во рту он тает, как желе!"
10004020-29 = "Ну как вам, Сенсей? Разве не невероятно?"
10004020-30 = "[s5] «Да, вкусно.»\n[s6] «На Променаде всё вкусное.»"
10004020-31 = "Правда? Променад Чёрной Черепахи — главное гастрономическое место всего Кивотоса! Что ни съешь — всё превосходит ожидания!"
10004020-32 = "Правда? Променад Чёрной Черепахи — главное гастрономическое место всего Кивотоса! Что ни съешь — всё превосходит ожидания!"
10004020-33 = "Президент Руми, представляющая Променад, прекрасно разбирается не только в традиционной кухне Шаньхайцзина, но и в смешанной кухне разных школ. Она постоянно выпускает чудесные новинки."
10004020-34 = "Но Генрюмон, студсовет Шаньхайцзина, похоже, не любит еду Променада, говоря, что она нарушает «традиции» и «стабильность» Шаньхайцзина."
10004020-35 = "По слухам, эти две силы ещё и ведут ожесточённую закулисную борьбу за контроль над Шаньхайцзином..."
10004020-36 = "[s] «Откуда ты всё это знаешь, Шунлинь?»"
10004020-37 = "Э-Это всё из-за... Шун!"
10004020-38 = "Я всегда слушаю Шун. Она так много знает. Аха-ха..."
10004020-39 = "И Генрюмон, и Променад Чёрной Черепахи очень хорошо относятся к студентам Сада сливового цветка, поэтому мы надеемся, что они не будут ссориться..."
10004020-40 = "Даже заботиться о маленьких детях достаточно трудно. Могу только представить, насколько сложно управлять огромной организацией."
10004020-41 = "[s7] «Ты говоришь как взрослая.»\n[s8] «Для своего возраста ты очень зрелая.»"
10004020-42 = "А?! Я выгляжу настолько старой?"
10004020-43 = "А?! Я выгляжу настолько старой?"
10004020-44 = "Я думала, выгляжу такой молодой... Неужели всё равно кажусь старой?"
10004020-45 = "Я всё ещё веду себя как старуха, даже если выгляжу молодой?!"
10004020-46 = "[s] «Я имел в виду это как комплимент...»"
10004020-47 = "К-Комплимент?"
10004020-48 = "Т-Точно. Дети хотят быстрее повзрослеть, поэтому когда их называют взрослыми — обычно это комплимент! Аха-ха..."
10004020-49 = "Ой, какая же я глупая!"
10004020-50 = "[s] «Кстати, что ты имела в виду, говоря, что выглядишь моложе?»"
10004020-51 = "С-Сенсей, вы доели танхулу? Ну надо же... П-Похоже, Шун здесь всё-таки нет."
10004020-52 = "Раз её нет на Променаде Чёрной Черепахи, пойдём в другое место, где она может быть."
10004020-53 = "Сюда! Сюда! Пожалуйста, быстрее!"
10004020-54 = ""
10004020-56 = ""
