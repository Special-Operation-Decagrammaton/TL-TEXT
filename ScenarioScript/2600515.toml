[translation]
2600515-1 = "Налётчица на десерты"
2600515-2 = "После разговора с Ёшими я направился на ближайшую улицу с кафе."
2600515-3 = ""
2600515-5 = ""
2600515-6 = ""
2600515-7 = "[ns1] «...Ёшими?»\n[ns2] «В кои-то веки ты уже здесь.»"
2600515-10 = "...Потому что я уже закончила есть."
2600515-11 = "Если бы я всё ещё ела, когда вы пришли, вы бы опять начали нести какую-нибудь ерунду вроде: «Ты всё ещё ешь?» или «Ого, сколько ты съедаешь»."
2600515-12 = "Я это уже слишком много раз слышала. Конечно, на этот раз я подготовилась."
2600515-13 = "...Что? Говорите, вы никогда со мной так не разговаривали?"
2600515-14 = "Д-да какая разница?! Если я сказала, что всё было так, значит, так и было. Взрослый человек вроде вас должен уметь подыгрывать!"
2600515-15 = "...Что?"
2600515-16 = "Ну да. Конечно, было вкусно. Это довольно популярное место."
2600515-17 = "Я долго стояла в очереди, так что, когда наконец села, решила оторваться по полной."
2600515-18 = "Хи-хи. Кажется, я попробовала все вкусы..."
2600515-19 = ""
2600515-21 = ""
2600515-22 = "Я НЕ СВИНЬЯ!!!"
2600515-23 = "[s3] «А?! Я ничего не говорил...»\n[s4] «Это ты сама сказала...»"
2600515-26 = "Угх! В общем! Я позвала вас сюда не просто так, Сенсей."
2600515-27 = "Вот... Просто возьмите."
2600515-28 = "[s5] «...Это новое блюдо в меню?»\n[s6] «Ты заказала его навынос для меня?»"
2600515-31 = "Ну, немного неловко говорить это вслух, но с тех пор как мы познакомились, вы много всего для меня сделали."
2600515-32 = "Поэтому я подумала, что иногда тоже должна вам отплачивать."
2600515-33 = ""
2600515-35 = ""
2600515-36 = "Ч-Что..."
2600515-37 = "Что это за выражение?! Почему у вас на лице эта раздражающая ухмылка?!"
2600515-38 = "...Прекратите!"
2600515-39 = "Прекратите сейчас же! Хватит улыбаться! Как же вы бесите!"
2600515-40 = "[s7] «М-м, выглядит вкусно.»\n[s8] Открыть десерт."
2600515-43 = "...?!"
2600515-44 = "Ч-что вы делаете?! Мы всё ещё на улице! В-вы что, собираетесь есть его прямо сейчас?"
2600515-45 = "Съедите потом!! Запрещаю вам откусывать хоть кусочек!"
2600515-46 = "П-почему? Ну, потому что..."
2600515-47 = "П-потому что...! Другие люди могут... В такой ситуации..."
2600515-48 = ""
2600515-50 = ""
2600515-51 = "А-аргх! Я не обязана ничего объяснять! Просто делайте, что я сказала!"
2600515-52 = "Только попробуйте съесть его здесь! Я сразу украду обратно! Я предупредила!"
2600515-53 = "...Что?"
2600515-54 = "...И как я его украду без вилки?"
2600515-55 = "...Ха!"
2600515-56 = "Вы меня недооцениваете, Сенсей!"
2600515-57 = "Я привыкла, что вы меня недооцениваете, но это будет последний раз!"
2600515-58 = "В конце концов, мы говорим обо мне! Вы уже должны были понять!"
2600515-59 = ""
2600515-61 = ""
2600515-62 = ""
2600515-64 = "[ns9] «...Что...?»\n[ns10] «Что это...?!»"
2600515-67 = "Ну всё, Сенсей. Вы сами напросились."
2600515-68 = "Назад пути нет."
2600515-69 = "Член Клуба сладостей после уроков и ранкер десертных испытаний Тринити, покорительница лимитированных лакомств!!"
2600515-70 = "Это ультимативный навык Ибараги Ёшими!! Налётчица на десерты наносит удар!"
2600515-71 = ""
2600515-73 = ""
2600515-74 = "Моё секретное оружие!"
2600515-75 = "Украсть и сожрать — Налётчица на десерты!"
2600515-76 = "[s] «Что...?!»"
2600515-77 = ""
2600515-79 = ""
2600515-80 = "Куда это вы?! Стоять!"
2600515-81 = "Стойте! Вернитесь!"
2600515-82 = ""
2600515-84 = ""
2600515-88 = "Я изо всех сил пытался уклониться от атаки Налётчицы на десерты, но в итоге мы сцепились и повалились на пол."
2600515-89 = "К счастью, десерт не оказался на полу вместе с нами, но, к сожалению, Ёшими всё-таки умудрилась съесть почти половину."
