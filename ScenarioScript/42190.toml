[translation]
42190-1 = "Episódio 19;Abismo"
42190-5 = "Sensei, por aqui."
42190-6 = "A escada que a Kirino-san nos indicou dá neste corredor."
42190-7 = "A inclinação é íngreme, então cuidado onde pisa para não cair."
42190-15 = "...De fato, é um lugar suspeito."
42190-16 = "Talvez tenha sido uma obra às pressas, pois o acabamento dos corrimãos e revestimentos é precário...#nAinda assim, os cabos de energia e de comunicação estão conectados..."
42190-22 = "Isto é... há bastões químicos usados jogados no chão."
42190-23 = "Provavelmente, nossas senpais também usaram este corredor para entrar na instalação subterrânea."
42190-24 = "[s] \"Bastões químicos?\""
42190-25 = "Sim. É um tipo de sinalizador que forças especiais usam em operações no escuro para indicar acesso liberado e diferenciar aliados de inimigos..."
42190-26 = "Ou seja... há uma grande chance de o Esquadrão FOX estar de emboscada logo adiante."
42190-27 = "Para garantir uma rota de entrada segura, vou iniciar o arrombamento da porta."
42190-28 = "Afaste-se, Sensei, para não se ferir com a granada."
42190-34 = "Lá... vai!"
42190-44 = "[ns] \"Que instalação é essa...?\""
42190-45 = "...É um hangar militar."
42190-49 = "Equipamentos militares e trilhos de transporte... e dá para ver um elevador lá no fundo."
42190-50 = "Um hangar deste porte... conseguiria suprir o armamento de pelo menos um batalhão inteiro."
42190-51 = "[s] \"Por que existe uma instalação militar dessas debaixo da estação...?\""
42190-52 = "Não tenho certeza absoluta, mas..."
42190-53 = "Em geral, instalações militares costumam ser construídas nos arredores da cidade por serem malvistas pelos civis. Isso acaba elevando os custos de transporte e operação, mas —"
42190-54 = "Se puderem construir um hangar grande dentro da cidade assim... na teoria, os custos necessários caem drasticamente. E o que sobra pode ser investido em equipamentos —"
42190-55 = "Ainda mais estando bem abaixo da estação,#nnuma \"emergência\", eles poderiam usar a ferrovia para enviar tropas a qualquer ponto do D.U...."
42190-60 = "...Acho que entendi um pouco o motivo de o Grupo Kaiser ser tão obcecado pela revitalização de Kousagi Town."
42190-61 = "[s] \"Mas se explodirem tudo, vai tudo por água abaixo, né.\""
42190-62 = "...Sim."
42190-63 = "Afinal, se usarem munição termobárica, este lugar vai desaparecer sem deixar vestígios."
42190-64 = "Este é — um lugar secreto que nem mesmo quem vagava pelo submundo da sociedade conhecia."
42190-65 = "É justamente por isso que os poderosos podem expor aqui suas verdadeiras e repugnantes intenções."
42190-66 = "Talvez este fosse o único lugar onde eles podiam satisfazer seus desejos e seu orgulho."
42190-67 = "E — quão hediondo deve ser o terror que desejam causar a ponto de abrir mão de uma instalação como esta..."
42190-68 = "[s] \"...Por acaso você está nervosa?\""
42190-69 = "...Não."
42190-70 = "Assim como uma justiça que ninguém reconhece e ninguém proclama não tem força alguma..."
42190-71 = "Um terror que ninguém vê — vale menos do que uma marmita vencida jogada fora."
42190-72 = "...Eu também só percebi isso depois de chegar a este ponto."
42190-73 = "O quanto um título de autoridade herdado de outros — o nome da SRT — é sem valor."
42190-74 = "Hora atual: 1130.#nFalta muito pouco para a detonação da ogiva."
42190-75 = "O que precisamos fazer agora é —"
42190-82 = "Aguarde um instante, Sensei."
42190-83 = "Nossas senpais entraram nesta área antes, então avançar sem precaução é perigoso."
42190-84 = "Vou enviar um drone na frente para fazer o reconhecimento."
42190-88 = "Drone, ativar."
42190-102 = "...Como eu imaginava, fomos alvo de um disparo de precisão."
42190-103 = "Pela profundidade do impacto e pela velocidade do projétil...#nA atiradora está usando munição antimaterial de 12,7 mm... É a Otogi-senpai."
42190-104 = "Se fosse um inimigo comum, eu avançaria com tudo, mas...#nSendo a Otogi-senpai, o próximo tiro vai mirar um ponto vital."
42190-105 = "Mesmo eu não conseguiria aguentar um tiro de precisão num ponto vital."
42190-106 = "Se ao menos tivéssemos um batedor com equipamento à prova de balas..."
42190-108 = "...Parece que finalmente se lembrou de nós."
42190-112 = "Essa voz..."
42190-122 = "...Onde já se viu uma líder deixar o esquadrão para trás?"
42190-123 = "Que maldade, Miyako-chan..."
42190-124 = "Que frieza, hein.#nPelo menos dava um toque pra gente, né?"
42190-126 = "Bem, é que..."
42190-127 = "...D-Desculpem.#nEu achei que seria pedir demais de vocês..."
42190-128 = "E onde é que isso é pedir demais?"
42190-129 = "É que... eu acabaria forçando vocês a fazerem sacrifícios."
42190-130 = "No caminho que escolhi — não há disciplina rigorosa, nem equipamentos poderosos, nem um quarto quentinho."
42190-131 = "Apenas uma vida árdua e sofrida, onde só a justiça em que acredito é satisfeita..."
42190-132 = "Eu não podia dizer para vocês desistirem da vida que desejam só por causa dessa minha justiça..."
42190-139 = "...Ai."
42190-140 = "Você é mesmo cabeça-dura..."
42190-142 = "Que história é essa de \"minha justiça\"?#nEssa é a justiça de toda a SRT, não é?"
42190-143 = "...N-Nós também entramos na SRT porque admirávamos as nossas senpais..."
42190-145 = "Disciplina rigorosa — que nunca se dobra, nem nas situações mais extremas."
42190-146 = "Força avassaladora — capaz de derrubar qualquer vilão com um único golpe!"
42190-147 = "Coragem ousada — que não vacila nem diante de inimigos h-hediondos..."
42190-148 = "Lutar contra um inimigo desconhecido dá um pouco de medo... mas se estivermos todas juntas, eu não tenho medo."
42190-150 = "Quando a vitória é fácil demais, os tiros que a gente dispara perdem o gostinho de destruição, né."
42190-151 = "Afinal, existem verdades neste mundo que não estão escritas no manual..."
42190-158 = "Nós acreditamos — na justiça da Miyako."
42190-164 = "..."
42190-165 = "...Entendido."
42190-166 = "Então, pessoal, verifiquem seus equipamentos antes da invasão.#nAssim que estiverem prontas, iniciaremos a operação."
42190-168 = "Combate real contra o Esquadrão FOX... acho que estou um pouco nervosa."
42190-169 = "Pois é. Parece até que estamos lutando contra um monstro invisível numa caverna."
42190-170 = "Falando nisso, não tinha uma cena assim naquele romance antigo de Trinity de que a gente falou antes?"
42190-171 = "Sim. Naquele livro sobre coelhos selvagens lutando contra cavaleiros, tinha mesmo uma descrição assim."
42190-172 = "A mensagem escrita naquela caverna era, se não me engano —"
42190-174 = "\"Apenas os de coração corajoso e puro — encontrarão o caminho na Caverna de Carbanog.\""
42190-181 = "...Eu também gosto dessa história."
42190-182 = "[s] \"Já decidiram o nome da operação?\""
42190-183 = "Pensando bem, ainda não decidimos o nome da operação..."
42190-184 = "Já que estamos aqui, que tal usarmos o título daquele livro como nome da operação?"
42190-185 = "É, pode ser."
42190-186 = "Apoiado~"
42190-188 = "Certo, então..."
42190-194 = "Operação \"Coelho de Carbanog\" — começar!"
