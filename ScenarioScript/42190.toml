[translation]
42190-1 = "Эпизод 19; Бездна"
42190-5 = "Сенсей, сюда."
42190-6 = "Вертикальная лестница, о которой говорила Кирино, ведёт в этот коридор."
42190-7 = "Спуск крутой, так что смотрите под ноги."
42190-8 = ""
42190-15 = "...Здесь что-то не так."
42190-16 = "Дешёвые перила и отделка будто указывают на незавершённое или поспешное строительство, но все коммуникации здания полностью работают."
42190-17 = ""
42190-19 = ""
42190-20 = ""
42190-21 = ""
42190-22 = "Смотрите. Использованный инфракрасный химический источник света."
42190-23 = "Наверное, они вошли в подземный объект отсюда."
42190-24 = "[s] «Для чего нужен химический свет?»"
42190-25 = "Спецназ использует его в темноте для опознавания и подачи сигналов."
42190-26 = "Иными словами, наши коллеги из FOX, скорее всего, подготовили впереди ловушку."
42190-27 = "Я устанавливаю заряд для взлома двери, чтобы обеспечить нам вход, Сенсей."
42190-28 = "Отойдите."
42190-29 = ""
42190-33 = ""
42190-34 = "Хорошо... Укройтесь, Сенсей!"
42190-35 = ""
42190-40 = ""
42190-44 = "[ns] «Что это?»"
42190-45 = "...Военный ангар."
42190-46 = ""
42190-48 = ""
42190-49 = "Лифты и рельсовые системы предназначены для перевозки военной техники."
42190-50 = "Ангар такого масштаба... Здесь можно разместить серьёзные военные силы."
42190-51 = "[s] «Но почему здесь? Под популярной и постоянно загруженной станцией метро?»"
42190-52 = "Я тоже пытаюсь это понять..."
42190-53 = "Обычно военные базы строят далеко от городов и жилых районов. Как правило, на неосвоенной территории за городской чертой."
42190-54 = "Но технически, если построить базу прямо посреди города, как этот ангар, можно сэкономить целое состояние на управлении и перевозках."
42190-55 = "А поскольку он под станцией, в чрезвычайной ситуации отсюда легко перебросить войска в любую точку D.U."
42190-58 = ""
42190-60 = "Теперь я наконец понимаю, почему Кайзер Group так сильно интересовалась развитием города Коусаги."
42190-61 = "[s] «А взрыв бомбы здесь уничтожит все эти вложения.»"
42190-62 = "...Ты права."
42190-63 = "Взрыв бомбы полностью сотрёт это место с карты."
42190-64 = "И будет так, будто его никогда не существовало. Сомневаюсь, что даже обитатели городского подполья что-то о нём слышали, так что никто не знает, что оно здесь."
42190-65 = "Чтобы построить это место, им пришлось копнуть глубже, чем кто-либо ещё был готов."
42190-66 = "Наверное, мысль о месте, где можно свободно реализовывать корпоративные амбиции, была для них очень привлекательна."
42190-67 = "И они готовы отказаться от всего этого лишь ради того, чтобы вселить страх в граждан. Вот это пугает меня ещё сильнее."
42190-68 = "[s] «...Не передумала?»"
42190-69 = "...Нет, совсем нет."
42190-70 = "Это как с правосудием: оно имеет силу только тогда, когда ты готов за него говорить."
42190-71 = "Прятать страх из гордости так же бесполезно, как старое бенто в мусорке."
42190-72 = "...Мне самой пришлось оказаться выброшенной, чтобы понять этот урок."
42190-73 = "Я не позволю построить SRT на власти, которую они выпросили у Каи."
42190-74 = "Сейчас 11:30. До детонации осталось совсем немного времени."
42190-75 = "Наш следующий шаг должен—"
42190-76 = ""
42190-81 = ""
42190-82 = "Сенсей, подождите."
42190-83 = "Это вражеская территория. Слепо бросаться вперёд смертельно опасно."
42190-84 = "Я отправлю вперёд дрон для разведки."
42190-85 = ""
42190-87 = ""
42190-88 = "Запускаю дрон..."
42190-89 = ""
42190-102 = "Как и ожидалось. Снайпер."
42190-103 = "По глубине пулевого отверстия и скорости снаряда снайпер вооружён 12,7-мм антиматериальной винтовкой... Специализация Отоги."
42190-104 = "Будь там кто-то другой, я бы рискнула продвинуться вперёд. Но против Отоги это самоубийство."
42190-105 = "Даже я не выдержу прямого попадания из антиматериальной винтовки."
42190-106 = "Если бы у нас хотя бы была штурмовик в баллистической броне..."
42190-108 = "...А, так теперь, когда мы понадобились, ты про нас вспомнила?"
42190-109 = ""
42190-111 = ""
42190-112 = "Не может быть..."
42190-113 = ""
42190-115 = ""
42190-117 = ""
42190-121 = ""
42190-122 = "По крайней мере, когда командиром была я, я оставила только Мию! Кто вообще забывает всех троих членов своего отряда?"
42190-123 = "Н-Не могу поверить, что ты просто ушла, Мияко..."
42190-124 = "Отлично держишь нас в курсе. Могла хотя бы спросить, хотим ли мы пойти с тобой."
42190-126 = "Я... Я не подумала..."
42190-127 = "...П-Простите, все. Я не могла просить от вас ещё большего. Я и так уже слишком многого попросила."
42190-128 = "...Слишком многого? В каком смысле?"
42190-129 = "Вы все снова и снова жертвовали чем-то ради нашего отряда. Я не могла просить вас сделать это ещё раз."
42190-130 = "Мне пришлось бы попросить вас отказаться от чёткого расписания, неограниченного доступа к оружию и всех удобств, которыми вы наслаждаетесь."
42190-131 = "Я не смогла."
42190-132 = "После всего, через что мы уже прошли, я не могла просить вас отказаться от своей жизни ради моего представления о правосудии."
42190-133 = ""
42190-135 = ""
42190-136 = ""
42190-139 = "...Серьёзно?"
42190-140 = "Ну и упрямый же ты командир."
42190-142 = "М-Мияко... Дело не только в твоём чувстве правосудия. Мы все чувствуем то же самое."
42190-143 = "Мы все были очарованы отрядом FOX."
42190-145 = "Их железная дисциплина не колебалась ни при каких обстоятельствах."
42190-146 = "То, как преступники один за другим падали перед ними!"
42190-147 = "И м-мужество, которое не дрогнуло ни перед каким препятствием."
42190-148 = "Я-я боюсь всего... но не когда вы рядом."
42190-150 = "Если честно, фейерверки через пару вечеров начинают надоедать. Мне нужен азарт от того, что я режу наши ограниченные запасы. Хи-хи."
42190-151 = "Недавно я поняла, что в мире полно вещей, о которых не прочитаешь в учебниках."
42190-152 = ""
42190-154 = ""
42190-155 = ""
42190-156 = ""
42190-157 = ""
42190-158 = "Мияко, мы будем сражаться рядом с тобой за правосудие SRT!"
42190-159 = ""
42190-161 = ""
42190-163 = ""
42190-164 = "..."
42190-165 = "...Спасибо."
42190-166 = "Финальная проверка снаряжения. Когда все будут готовы, следуйте за мной."
42190-168 = "Сойтись лицом к лицу с отрядом FOX... О-Ох."
42190-169 = "Понимаю. Будто мы собираемся нырнуть в кромешно тёмную пещеру и знаем, что где-то внутри сидит Ктулху."
42190-170 = "В том романе была похожая сцена."
42190-171 = "Ага. В той истории из Тринити про кролика, который столкнулся с отрядом рыцарей."
42190-172 = "Те рыцари увидели послание, когда вошли в мрачное логово кролика."
42190-174 = "«Лишь храбрый и чистый сердцем найдёт свой путь в пещере Каэрбаннога.»"
42190-175 = ""
42190-177 = ""
42190-178 = ""
42190-180 = ""
42190-181 = "...Мне всегда нравилась эта история."
42190-182 = "[s] «Вы уже придумали название операции?»"
42190-183 = "Ой, я вообще об этом не подумала..."
42190-184 = "Ну, история как раз очень к месту. Почему бы тогда не назвать операцию в её честь?"
42190-185 = "Мне нравится!"
42190-186 = "Я тоже."
42190-188 = "В таком случае..."
42190-189 = ""
42190-194 = "Операция «Кролик Каэрбаннога», начать!"
