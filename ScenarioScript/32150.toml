32150-34 = ""
32150-36 = ""
32150-37 = "Наверное, вы волнуетесь. Понятно почему: весь Отряд правосудия вывели отсюда."
32150-38 = "У-Урава Ханако?! Что ты здесь делаешь?"
32150-39 = "Спрашиваешь, откуда я знала, что ты будешь именно в этом убежище? Я знаю порядок смены всех 87 запасных комнат Чайной партии."
32150-40 = "...?!"
32150-41 = "Я знаю и о вещах, которые формально не нарушают правил... например, что в минуты сильного волнения ты прячешься в своём секретном пентхаусе."
32150-42 = "Ч-Что всё это значит?!"
32150-43 = ""
32150-46 = "Не двигайся."
32150-47 = "...!"
32150-48 = "Кстати, по дороге сюда мы уже разобрались с твоей немногочисленной охраной. Какое-то время они не смогут нам помешать."
32150-49 = "И Урава Ханако, и Ширасу Азуса. Неужели..."
32150-50 = "Выходит, предательница была не одна, их было две."
32150-51 = "Не совсем. К тому же мы с Азусой лишь пришли на встречу. Руководит всем здесь кто-то другой."
32150-52 = "...!"
32150-53 = "Кто?! Требую назвать его!"
32150-54 = "Сначала ответь на мой вопрос. Неужели было необходимо заходить так далеко, Нагиса?"
32150-55 = "..."
32150-56 = "Я говорю о том, как ты поступила с нашим клубом. Понимаю, почему ты так волновалась, но зачем было задействовать ещё и полномочия Шале?"
32150-57 = "Ну..."
32150-58 = "Я даже понимаю, почему ты подозревала Азусу и меня. Но зачем подозревать Хифуми? Зачем втягивать невиновную Кохару?"
32150-59 = "..."
32150-60 = "Особенно Хифуми. Она считала тебя подругой."
32150-61 = "Как ты могла быть такой жестокой? Ты хоть подумала, как сильно её ранишь?!"
32150-62 = "..."
32150-63 = "Я понимаю, что поступила с Хифуми неправильно, даже если хотела как лучше."
32150-64 = "Часть меня надеялась, что после всего этого мы всё ещё сможем дружить... но я ни о чём не жалею."
32150-65 = "Хи-хи. ♥"
32150-66 = "Тогда передам тебе послание от нашей предводительницы."
32150-68 = "Она сказала: «Забавно было воображать, будто мы когда-либо были подругами.»"
32150-69 = "Что? Тогда вами руководит..."
32150-70 = ""
32150-74 = "Цель захвачена."
32150-75 = "Она получила в упор целый магазин патронов калибра 5,56 мм. Пролежит без сознания как минимум час."
32150-76 = "Отличная работа, Азуса. Сможешь теперь, как и планировали, отвлечь их на себя?"
32150-77 = "Поняла. Так ложная информация дойдёт до настоящей предательницы Тринити."
32150-78 = "Если твоя догадка верна, Ариусу придётся ускорить нападение."
32150-79 = "Именно. Ещё осталось кое-что выяснить..."
32150-80 = "...но я уверена по крайней мере в одном: предательница действительно есть."
32150-81 = "Кстати, так уж необходимо было говорить ей это напоследок?"
32150-82 = "Да это я так Хифуми отплатила. Нагиса сама напросилась."
32150-83 = "К тому же это маленькое недоразумение рано или поздно прояснится. ♥"
32150-84 = "..."
32150-85 = "Ладно. Скажи, сколько солдат пришлёт Ариус? Сможешь сама их задержать?"
32150-86 = "Точного числа не знаю, но я к этому готовилась."
32150-87 = "Каждую ночь я расставляла ловушки и рыла траншеи вокруг академии. Заманю их туда и воспользуюсь местностью, чтобы выиграть время."
32150-88 = "Встретимся в условленном месте."
32150-89 = "Хорошо. Скоро увидимся!"
