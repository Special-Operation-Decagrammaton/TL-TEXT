[translation]
32150-1 = "Episódio 15;O Primeiro Disparo"
32150-6 = "...Equipe IV, no local."
32150-7 = "Nenhuma anormalidade em especial. A segurança está dentro do esperado."
32150-11 = "Equipes V, VI e VIII informam que estão todas prontas."
32150-12 = "A localização do alvo foi confirmada. Vamos iniciar a operação conforme o planejado."
32150-13 = "Todas as unidades, avancem."
32150-20 = "...Ufa."
32150-24 = "...Se for mais chá preto, já estou satisfeita."
32150-29 = "...?"
32150-30 = "...Coitadinha, não consegue dormir, não é?"
32150-31 = "...!?"
32150-37 = "Mas também é compreensível. Com quase ninguém do Comitê de Justiça por perto... qualquer uma ficaria ansiosa, não é, Nagisa-san?"
32150-38 = "U-Urawa Hanako-san...!? Por que você está aqui...!?"
32150-39 = "Quer saber como descobri este esconderijo? Ora, é claro que é porque já sabemos de tudo. Todos os 87 esconderijos no total, e até mesmo o cronograma de rotação deles... Fufu♡"
32150-40 = "...!?"
32150-41 = "Também já temos uma boa noção dos seus padrões fora da rotina. Por exemplo... que quando você está profundamente ansiosa como agora, vem se esconder neste sótão secreto aqui♡"
32150-42 = "O qu—...!"
32150-46 = "Não se mexa."
32150-47 = "...!"
32150-48 = "Ah, e claro, já cuidamos de todas as guardas no caminho até aqui. É justamente por isso que pudemos entrar pela porta da frente assim."
32150-49 = "Shirasu Azusa-san, Urawa Hanako-san... Não pode ser...!"
32150-50 = "Não havia apenas uma \"traidora\", mas duas...!?"
32150-51 = "...Fufu, que linha de raciocínio mais simplória♡ Tanto eu quanto a Azusa-chan não passamos de meros peões. A nossa comandante é outra pessoa."
32150-52 = "...!!"
32150-53 = "Quem é ela...!?"
32150-54 = "Antes de falarmos sobre isso, Nagisa-san... Havia mesmo necessidade de ir tão longe?"
32150-55 = "..."
32150-56 = "Estou falando do Clube de Aulas de Reforço. Eu entendo muito bem o peso das preocupações da Nagisa-san. Mas chegar ao ponto de mobilizar até a \"Schale\"... era mesmo necessário ir tão longe assim?"
32150-57 = "Isso é..."
32150-58 = "Quanto a mim e à Azusa-chan, que já éramos suspeitas desde o começo, não havia o que fazer. Mas... quanto à Hifumi-chan e à Koharu-chan, você não acha que foi cruel demais?"
32150-59 = "..."
32150-60 = "Especialmente a Hifumi-chan... Vocês duas não eram tão boas amigas, Nagisa-san?"
32150-61 = "Por que você fez uma coisa dessas? Não parou para pensar no quanto a Hifumi-chan ficaria magoada?"
32150-62 = "..."
32150-63 = "...É verdade. Talvez eu tenha feito algo terrível com a Hifumi-san..."
32150-64 = "Mas eu não me arrependo. Tudo é por uma causa maior. É verdade que eu esperava poder preservar ao menos a minha relação com ela, mas... eu..."
32150-65 = "...Fufu♡"
32150-66 = "Sendo assim, permita-me transmitir uma mensagem da nossa comandante para você, Nagisa-san."
32150-68 = "\"Ahaha... Bom, até que foi bem divertido brincar de amiguinha com você, Nagisa-sama.\"... foi o que ela disse♡"
32150-69 = "...!? N-Não pode ser, isso quer dizer que...!?"
32150-74 = "Alvo neutralizado."
32150-75 = "Acertei um carregador inteiro de munição 5,56 mm à queima-roupa, então ela deve ficar desacordada assim por cerca de uma hora."
32150-76 = "Fufu♡ Então, Azusa-chan, posso deixar a tarefa de atrair o inimigo com você daqui em diante?"
32150-77 = "Entendido. Com isso, uma informação falsa deve chegar até a \"verdadeira traidora de Trinity\" que ainda está escondida em algum lugar... certo?"
32150-78 = "Se essa sua hipótese estiver correta, Hanako, com certeza Arius também vai apressar o ataque."
32150-79 = "Sim. Se a minha dedução estiver certa, embora ainda haja algumas coisas que não sabemos..."
32150-80 = "Ainda não temos provas concretas, mas... pessoalmente, já tenho quase certeza de quem é a \"verdadeira traidora\"."
32150-81 = "...A propósito, aquela última frase de agora há pouco era mesmo necessária?"
32150-82 = "Ah, aquilo foi, digamos, uma pequena vingança por conta própria pelo esforço da Hifumi-chan... Pensei em fazê-la levar pelo menos um pequeno choque."
32150-83 = "Bom, quando tudo acabar, o mal-entendido será esclarecido rapidinho."
32150-84 = "..."
32150-85 = "Por falar nisso, Azusa-chan, você tem ideia do tamanho da força militar de Arius? Para ser mais exata, eu gostaria de saber quanto tempo você consegue segurar as pontas sozinha."
32150-86 = "Não sei os detalhes. Mas já venho me preparando há bastante tempo, então, não importa o tamanho do inimigo, devo conseguir ganhar um bom tempo."
32150-87 = "Foi para isso que passei todas as noites montando armadilhas e cavando trincheiras nos arredores da academia. Vou atraí-las para lá e ganhar tempo com táticas de guerrilha."
32150-88 = "Bom, vamos nos separar por aqui. Nos vemos mais tarde no ponto de encontro."
32150-89 = "Sim, até mais tarde!"
32150-95 = "Esconderijo localizado! O alvo não está à vista!"
32150-96 = "...Alguém chegou antes de nós? Então aquela informação era mesmo verdadeira."
32150-97 = "Vasculhem a área! O mais silenciosamente possível!"
32150-98 = "Onde está a \"espiã\" que deveria se encontrar conosco?! Encontrem-na rápido!"
32150-99 = "Aqui é a Equipe IV, sofremos uma emboscada!"
32150-100 = "O quê!?"
32150-103 = "É a \"espiã\"! A \"espiã\" nos traiu!"
32150-104 = "(Fshhh, fshhh...)"
32150-106 = "Uwaaaah!?"
32150-107 = "A \"espiã\" nos traiu!? O-O que está acontecendo!!"
32150-112 = "Traição. Nada mais, nada menos."
32150-113 = "!?"
32150-114 = "Eu já fiquei com o alvo primeiro."
32150-115 = "P-Por quê?! Por que fazer uma coisa dessas...!?"
32150-116 = "Porque eu preciso acabar logo com isso para fazer a minha prova."
32150-117 = "...Hã?"
32150-118 = "A propósito, o relatório já chegou ao Comitê de Justiça. Se quiserem fugir, a hora é agora."
32150-119 = "(Bip)"
32150-120 = "..."
32150-121 = "...Vamos recuar?"
32150-122 = "Não, é um blefe. Se a informação estiver correta, o Comitê de Justiça jamais se moveria."
32150-123 = "Não se importem com isso, avancem!"
32150-124 = "Entendido!"
32150-126 = "Próximo;Batalha Feroz"
