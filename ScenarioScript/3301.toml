[translation]
3301-1 = "Замах на хоум-ран 1"
3301-3 = "Играем в мяч!"
3301-5 = "Так, все!"
3301-6 = "Это тренировочный матч, так что нервничать не нужно."
3301-7 = "Команда соперника — просто кучка роботов... Не бойтесь, что вас освистают или попадут подачей."
3301-8 = ""
3301-10 = ""
3301-11 = ""
3301-12 = "Стой, их сделал Инженерный отдел?! Это суперопасно!"
3301-13 = "Подающая машина, которую мы от них получили, была беспощадной! Она всё время бросала мячи со скоростью профессионалов!"
3301-14 = "Этот чёртов робот ещё и издевался над нами перед подачей!"
3301-15 = "Ммм, я знаю, у всех нас травма после той игры..."
3301-16 = "Но Семинар сказал, что все ошибки исправили. В этот раз нам нечего бояться."
3301-17 = "А теперь давайте сыграем в старый добрый бейсбол."
3301-18 = ""
3301-20 = ""
3301-21 = ""
3301-22 = ""
3301-24 = ""
3301-25 = ""
3301-27 = "Третий страйк! Аут!"
3301-28 = ""
3301-29 = ""
3301-30 = "Ух... Снова страйкаут."
3301-31 = ""
3301-32 = ""
3301-33 = ""
3301-34 = ""
3301-35 = ""
3301-36 = "Подача слишком быстрая."
3301-37 = ""
3301-39 = ""
3301-41 = ""
3301-42 = ""
3301-43 = ""
3301-44 = ""
3301-45 = "Следующая отбивающая — четвёртый номер бейсбольного клуба Миллениум, Номаса Рэй."
3301-46 = "Эй, разве это не та новичок, которая только недавно вступила?"
3301-47 = "Я слышала, она ас с невероятным средним показателем отбивания 0,08..."
3301-48 = "Стой, она отбивает 8 мячей из 100? Я даже 1 не могу..."
3301-49 = "Ой, да ладно вам, девочки. Вы меня смущаете. Хи-хи-хи..."
3301-50 = "Рэй! Осторожно! Питчер—"
3301-51 = ""
3301-53 = ""
3301-54 = "(Замах и—)"
3301-55 = "Летит!"
3301-56 = ""
3301-58 = ""
3301-60 = ""
3301-66 = ""
3301-67 = "Она отбила!"
3301-68 = "На такой скорости?!"
3301-69 = "Смотрите, как летит!"
3301-70 = "Не может быть! Это первый хоум-ран сезона?"
3301-71 = ""
3301-74 = "...Флай-аут!"
3301-75 = ""
3301-76 = "*вздыхает*"
3301-77 = "Иннинг завершён. Команда защиты, занимайте позиции!"
3301-79 = ""
3301-80 = "...И это конец игры. Отличная работа, все!"
3301-81 = ""
3301-82 = "Хорошая игра!"
3301-83 = "Сегодня ты была в ударе, Рэй!"
3301-84 = "Ты тоже. Отлично сыграла!"
3301-85 = "Я правда думала, что сегодня мы увидим хоум-ран..."
3301-86 = "Ага. В том ударе была настоящая мощь."
3301-87 = "Спасибо... но..."
3301-88 = "Это не был хоум-ран. Я поняла это в ту же секунду, как ударила по мячу..."
3301-89 = "Ты поняла только по ощущению от удара?"
3301-90 = "Н-Не совсем. Просто я вообще никогда раньше не делала хоум-ран."
3301-91 = "...Просто не было того ощущения «ба-бах», которое бывает при настоящем хоум-ране."
3301-92 = "Эм-м... раз ты так говоришь..."
3301-93 = "Ну, впереди ещё много игр, чтобы выбить настоящий."
3301-94 = "Девочки, у вас случайно нет советов, как делать хоум-раны?"
3301-95 = ""
3301-97 = ""
3301-98 = ""
3301-99 = "Советы по хоум-ранам? Думаю, важен угол вылета?"
3301-100 = "Летящий мяч движется с постоянным ускорением по вертикали и равномерно прямолинейно по горизонтали. Максимальная дальность достигается при ударе под углом 45 градусов."
3301-101 = "Да ладно! Эта баллистическая формула работает только в вакууме. Она учитывает лишь силу тяжести. Есть ещё куча факторов!"
3301-102 = "Для более точного расчёта нужно учитывать сопротивление воздуха и подъёмную силу."
3301-103 = ""
3301-105 = ""
3301-106 = ""
3301-107 = "Материал биты тоже важен. Более лёгкой битой с высокой упругостью можно замахнуться быстрее."
3301-108 = "Я слышала, Клуб разработки новых материалов делал отчёт о созданной ими бите—"
3301-109 = "Может, если расположиться по золотому прямоугольнику, можно использовать «вращение» биты, чтобы—"
3301-110 = ""
3301-112 = ""
3301-115 = ""
3301-116 = "Похоже, волшебной формулы для хоум-рана нет..."
3301-117 = "Может, мне просто нужно больше силовых тренировок?"
3301-118 = ""
3301-120 = ""
3301-121 = "С-Силовых тренировок?"
3301-122 = "Но силовые тренировки — это... *ахнула* физические упражнения."
3301-123 = ""
3301-125 = ""
3301-126 = ""
3301-127 = "Не делай этого! Бейсбольный клуб Миллениум — теоретический. Мы занимаемся оборудованием, статистикой и теорией! Не тренировками!"
3301-128 = "К тому же... тебе ведь НЕ ОБЯЗАТЕЛЬНО делать хоум-раны, правда? Просто хорошо отбивай и набирай очки."
3301-129 = "Верно. Для победы в матче количество успешных ударов важнее хоум-ранов."
3301-130 = ""
3301-132 = ""
3301-133 = ""
3301-134 = "Я знаю, но всё равно хочу выбить хоум-ран!"
3301-135 = ""
3301-138 = "Прости, Рэй. Наш клуб не очень может помочь, когда речь идёт о том, чтобы стать лучше именно в самой игре."
3301-139 = "Я президент, а даже моя физическая форма не слишком соревновательная. Могу дать тебе только теорию о том, как чаще делать успешные удары."
3301-140 = "...Понятно."
3301-141 = "Но вообще-то я знаю одного эксперта."
3301-142 = "Ты слышала о Клубе спортивной подготовки?"
3301-143 = "Клубе спортивной подготовки?"
3301-145 = "Фитнес-клуб Миллениум"
3301-146 = ""
3301-147 = ""
3301-148 = "Новенькая опаздывает..."
3301-149 = "Если продолжит пропускать занятия, потеряет мышцы."
3301-150 = ""
3301-152 = ""
3301-153 = ""
3301-154 = "...Ну конечно. Наверное, после вчерашней тренировки она сдалась."
3301-155 = "Такое чувство, что мы теряем участниц. И в Клубе спортивной подготовки, и в фитнес-клубе, где тренируемся."
3301-156 = "Может, мне самой выйти и набрать новых участниц—"
3301-157 = ""
3301-160 = ""
3301-161 = ""
3301-162 = ""
3301-163 = "Извините. Это Клуб спортивной подготовки?"
3301-164 = "Да, именно..."
3301-165 = "Здравствуйте, я Номаса Рэй из бейсбольного клуба Миллениум."
3301-166 = "Я поговорила с президентом о тренировках, чтобы улучшить свой показатель отбивания..."
3301-167 = "Тренировках?"
3301-168 = "И она сказала, что ваш клуб отлично подходит для укрепления мышц."
3301-169 = "Мышц!"
3301-170 = "Самой можно сделать лишь ограниченное количество, но я слышала, программы Клуба спортивной подготовки основаны на науке."
3301-171 = "Можно мне позаниматься с вами до следующего межшкольного бейсбольного сезона?"
3301-172 = ""
3301-174 = ""
3301-175 = "Простите. Понимаю, что это большая просьба. И ещё так внезапно..."
3301-176 = "Я вернусь на следующей неделе, чтобы у вас было время всё обдумать—"
3301-178 = "Начинаем прямо сейчас!"
3301-179 = "А-А?"
3301-180 = ""
3301-181 = "При правильном настрое эффективность тренировок отличается как день и ночь!"
3301-182 = "Раз уж выбрала путь фитнеса, нельзя терять ни секунды!"
3301-183 = "Даже пока ты просто стоишь, мышцы понемногу уменьшаются!"
3301-184 = ""
3301-186 = ""
3301-187 = ""
3301-188 = "Исправим это! Десять подходов приседаний! Вперёд!"
3301-189 = "П-Подождите! Я даже не переоделась!"
3301-190 = ""
3301-192 = ""
3301-193 = ""
3301-195 = ""
3301-197 = "...Так начался путь Рэй в мир фитнес-тренировок вместе с Сумирэ."
