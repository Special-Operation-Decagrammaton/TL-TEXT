[translation]
1015003-1 = "Lost Orca"
1015003-2 = "(After hearing from Kotone, I headed to the bookstore where she said she was waiting.)"
1015003-3 = "(When I arrived, Kotone was narrowing her eyes tightly and...)"
1015003-7 = "(--being lectured by an old man.)"
1015003-8 = "What is wrong with young people these days! Poking people, using casual speech!"
1015003-9 = "And what is with that rebellious look in your eyes!"
1015003-10 = "Ah... I did not know you. Sorry, I thought you were a friend."
1015003-11 = "It is not that I am giving you a rebellious look, I just cannot see very well in front of me..."
1015003-12 = "Who is your friend! Backtalking and showing no remorse--"
1015003-14 = "[ns1] \"Excuse me.\"\n[ns2] \"Is our student causing some kind of trouble...?\""
1015003-18 = "Are you her guardian?"
1015003-19 = "Good grief, what kind of education are you giving her!"
1015003-20 = "This girl here... she suddenly grabbed my shoulder and picked a fight with me!"
1015003-21 = "[ns] \"I am sure there must have been some misunderstanding...\""
1015003-23 = "(After somehow soothing the angry old man, I asked Kotone for her side of the story.)"
1015003-26 = "[ns3] \"So you accidentally broke your glasses...\"\n[ns4] \"And because you couldn't see well and squinted, it looked like you were picking a fight?\""
1015003-29 = "Yeah. The only way I could make out your face was by squinting."
1015003-30 = "So maybe I just looked unpleasant."
1015003-31 = "[s] \"That is quite a disaster...\""
1015003-35 = "[ns] \"How did your glasses break?\""
1015003-36 = "My favorite author released a new book, so I stopped by the bookstore..."
1015003-37 = "I was looking so hard at the books that I didn't realize the door was closed and walked right into it."
1015003-38 = "I didn't get hurt, but my glasses broke..."
1015003-39 = "[s] \"Do you not have a spare pair of glasses?\""
1015003-40 = "Nope. Of all times, that was my last pair..."
1015003-41 = "Well, I was thinking I needed to get a new pair soon anyway."
1015003-45 = "Hey, Sensei. Would you mind coming with me to get a new pair of glasses made?"
1015003-46 = "Without glasses, I can't go anywhere... and I might cause trouble again."
1015003-47 = "[s5] \"Of course, I will come with you.\"\n[s6] \"Where is the nearest optician?\""
1015003-50 = "The nearest optician is in Lamini Town, about three subway stations away from here."
1015003-51 = "There is a shop where I usually buy glasses online, so let us go there."
1015003-52 = "[s] \"Got it. Then I will guide you.\""
1015003-56 = "[ns7] \"Before that, Kotone...\"\n[ns8] \"Surely you aren't planning to go looking like that, right?\""
1015003-59 = "Yeah. Is it weird?"
1015003-64 = "Hey look, the Schale teacher is with a student in a swimsuit."
1015003-65 = "Whoa... I heard the rumors, but they are really walking around in a swimsuit."
1015003-66 = "I wonder if that is part of Schale's activities too."
1015003-67 = "If that is the teacher's hobby, it is in terrible taste."
1015003-68 = "Rumor has it that swimsuits are actually the mild ones. Apparently they sometimes hang out with girls wearing bunny suits or anime cosplay."
1015003-69 = "Creepy..."
1015003-70 = "[ns] \"Um... Kotone-san.\""
1015003-72 = "Hmm? What is wrong?"
1015003-73 = "[s] \"Could you not change into other clothes?\""
1015003-74 = "Other clothes, like a diving suit?"
1015003-75 = "I have a few, but they are inconvenient for walking on land, so I don't wear them."
1015003-76 = "[s] \"Not a diving suit, do you not have any regular clothes?\""
1015003-77 = "Regular clothes? This is my regular clothes."
1015003-78 = "I walk around in this outfit at ODS too, and almost nobody gave me weird looks."
1015003-79 = "If I take off the bolero, I can swim immediately, so isn't it practical?"
1015003-80 = "[s9] \"But this is the subway...\"\n[s10] \"Compared to what everyone else is wearing, it is a bit...\""
1015003-83 = "Everyone else's clothes?"
1015003-84 = "Hmm, I cannot see very well..."
1015003-85 = "[s11] \"...Never mind, forget it.\"\n[s12] \"Let us hurry to the optician.\""
1015003-90 = "(After that, we arrived at the optician while bathing in the piercing gazes of the people.)"
1015003-94 = "[ns] \"Excuse me! I need to get a pair of glasses made as soon as possible!\""
1015003-95 = "Um..."
1015003-96 = "I am sorry, we do not carry cosplay glasses..."
1015003-97 = "[ns] \"Regular glasses are fine!\""
1015003-99 = "(Fortunately, we were able to get new glasses made right away.)"
1015003-102 = "Great."
1015003-103 = "I can finally see properly."
1015003-104 = "[s13] \"Now you are all set...\"\n[s14] \"Do you think you can get home by yourself?\""
1015003-111 = "Umm..."
1015003-116 = "[ns15] \"Why are you suddenly clinging to me!?\"\n[ns16] \"Did the glasses not fit?\""
1015003-119 = "...No."
1015003-120 = "Actually... once I could see again, I suddenly started feeling embarrassed."
1015003-121 = "I couldn't tell earlier... but this swimsuit really does stand out a bit."
1015003-122 = "I can't go back alone like this, so I've decided to cling to Sensei on the way back."
1015003-123 = "[s17] \"Then at least could you step back a little?\"\n[s18] \"If you cling to me looking like that, people are going to misunderstand even more...\""
1015003-129 = "No."
1015003-130 = "Until we get back to ODS... I am definitely not letting go."
1015003-132 = "(After that... bathing in even colder gazes than before, we headed back to ODS.)"
