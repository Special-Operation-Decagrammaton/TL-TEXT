1000020-212 = "И наконец..."
1000020-215 = "[ns] «А...? Я что-то нашёл. Это он, Ару?»"
1000020-216 = "О, а-а?! Правда?!"
1000020-217 = ""
1000020-219 = ""
1000020-221 = "П-Правда! Т-Ты нашёл его, Сенсей!"
1000020-222 = "Большое спасибо!"
1000020-223 = "[s] «Но, Ару, он не выглядит как роскошный кошелёк...»"
1000020-224 = "О, ну... Снаружи он выглядит простым, но..."
1000020-225 = "Это подарок."
1000020-226 = "[s] «От кого?»"
1000020-227 = "Ну, через некоторое время после создания Решал 68..."
1000020-228 = "Участницы накопили деньги и купили его, чтобы поздравить меня с тем, что я стала начальником..."
1000020-229 = "Поэтому он для меня очень особенный... и его нельзя заменить..."
1000020-230 = "[s] «...»"
1000020-231 = "...А? Эм, Сенсей? Что это за выражение...?"
1000020-232 = "[s] «Я так рад, что мы его нашли!»"
1000020-233 = "П-Правда?!"
1000020-234 = "О, я-я тоже! Х-Хи-хи-хи."
1000020-235 = "Как ты и сказал, я очень рада, что ты его нашёл."
1000020-236 = ""
1000020-239 = "Хе!"
1000020-240 = "[s] «Это было очень весело.»"
1000020-241 = "Д-Да! В благодарность за помощь я куплю тебе рамен на завтрак!"
1000020-242 = "Хорошо, тогда пойдём..."
1000020-243 = "...О."
1000020-244 = "Случайно..."
1000020-245 = ""
1000020-247 = ""
