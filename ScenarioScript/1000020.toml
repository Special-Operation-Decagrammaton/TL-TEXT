[translation]
1000020-1 = "Нечто очень дорогое и важное"
1000020-2 = "Получив сообщение от Ару, я пришёл в роскошный ресторан."
1000020-4 = "[ns] «Ару, ты уверена насчёт этого места? Здесь выглядит очень дорого.»"
1000020-5 = "Хи-хи-хи. Да ладно, Сенсей."
1000020-6 = "Не робей. Ты консультант Решал 68 по управлению!"
1000020-7 = "Расслабься и веди себя в соответствии с уровнем Решатели проблем 68."
1000020-8 = "[s] «Разве консультант по управлению не должен беспокоиться о бюджете?»"
1000020-9 = "О, п-п-правда? Т-Ты прав!"
1000020-10 = "Даже сейчас ты продолжаешь заботиться о нас и думаешь о финансах Решатели проблем 68..."
1000020-11 = "...Нет, то есть!"
1000020-12 = "К-Кхм! Всё действительно нормально!"
1000020-13 = "[s] «Ты уверена?»"
1000020-14 = "Да! Сегодня нам точно не о чем волноваться!"
1000020-15 = "Вчера я успешно выполнила довольно много заказов и получила хорошую оплату! ♪"
1000020-16 = "[s] «А, понятно.»"
1000020-17 = "И всё это благодаря тебе, Сенсей."
1000020-18 = "Ты всегда вовремя даёшь советы — в любое время, в любом месте и любой ситуации..."
1000020-19 = "По-взрослому ты постоянно учишь меня тому, как руководить организацией!"
1000020-20 = "Да! Ты идеальный консультант Решатели проблем 68!"
1000020-21 = "[s1] «Ух ты, я краснею, просто слушая тебя, Ару!»\n[s2] «...Я сделал что-то настолько впечатляющее?»"
1000020-22 = "Кхм! Хватит болтовни!"
1000020-23 = "Кхм! Хватит болтовни!"
1000020-24 = "Сегодня я угощаю! Не стесняйся и наслаждайся!"
1000020-25 = "[s] «Ну, если ты настаиваешь, Ару...»"
1000020-27 = "В итоге мы с Ару прекрасно поужинали, пусть и немного роскошно."
1000020-28 = ""
1000020-29 = ""
1000020-30 = ""
1000020-31 = ""
1000020-32 = ""
1000020-33 = ""
1000020-35 = "И вот, когда Решатели проблем 68 появилась на месте, мы столкнулись с организацией протестующих Чёрного рынка, о которой рассказывал клиент."
1000020-36 = "[s] «Ух ты! И что было дальше?!»"
1000020-37 = "Хи-хи-хи. Знаешь, Сенсей... Я лидер Решал 68 и настоящий преступник Кивотоса..."
1000020-38 = "Я сказала противнику..."
1000020-39 = "«Мы не держим на вас зла. Вам просто не повезло встретиться с нами.»"
1000020-40 = "«Но ты пожалеешь, что встретил этого преступника, когда я отправлю тебя в ад!»"
1000020-41 = "[s] «Именно так сказал бы крутой хардбойлд-преступник!»"
1000020-42 = "Правда?! Ты тоже так думаешь, Сенсей?!"
1000020-43 = "Это одна из десяти лучших хардбойлд-фраз, которые каждый мечтает однажды произнести! ♪"
1000020-44 = "Хи-хи-хи... Хи-хи, хи-хи-хи!"
1000020-45 = "О, мы уже долго разговариваем. Посмотри на время..."
1000020-46 = "Мы доели... Пойдём, Сенсей?"
1000020-47 = "Эм... Хотя я ещё хотела рассказать тебе продолжение..."
1000020-48 = "[s] «Расскажи мне все свои истории.»"
1000020-49 = "П-Правда?"
1000020-50 = "Тогда расскажу, когда вернёмся в офис..."
1000020-51 = "Пойдём, Сенсей! ♪"
1000020-53 = "Как вам ужин, мадам?"
1000020-54 = "Было очень вкусно! Обязательно приду снова!"
1000020-55 = "Хаха! Рад это слышать! Когда будете готовы, вот счёт."
1000020-56 = "Да, сейчас посмотрим..."
1000020-57 = ""
1000020-59 = ""
1000020-60 = "..."
1000020-61 = ""
1000020-63 = ""
1000020-64 = "........."
1000020-65 = ""
1000020-67 = ""
1000020-68 = "............!"
1000020-69 = "Мадам?"
1000020-70 = "Ч-Что?! Ч-Чего-о-о?!"
1000020-71 = "[s] «Ару? Что случилось?»"
1000020-72 = "П-П-Пропал?!"
1000020-73 = "[s] «Что пропало?!»"
1000020-74 = "М-Мой кошелёк! Он был в кармане. Но его нет!"
1000020-75 = "...Мадам?"
1000020-76 = "Куда он мог деться? Почему это происходит?!"
1000020-77 = "[s] «Я заплачу.»"
1000020-78 = "Иик! С-Спасибо!"
1000020-80 = "Прости, Сенсей. Сегодня ведь я должна была тебя угощать..."
1000020-81 = "Как я могла потерять кошелёк...?"
1000020-82 = "Я даже не знаю, когда и где!"
1000020-83 = "[s] «Ару, ты говорила, что утром выполняла заказы, верно?»"
1000020-84 = "О, да. А-Что?"
1000020-85 = "[s] «А вдруг ты уронила его во время работы?»"
1000020-86 = "Т-Точно! Я могла..."
1000020-87 = "Во время заказа я много бегала. Наверное, тогда и потеряла..."
1000020-88 = "[s] «Может, пойдём проверим?»"
1000020-89 = "Д-Да, пожалуйста!"
1000020-92 = ""
1000020-93 = "Вот здесь я выполняла заказ!"
1000020-94 = "[s] «Как выглядит кошелёк? Какой он?»"
1000020-95 = "О... Он роскошного красноватого цвета..."
1000020-96 = "Какой именно...? Ну, это очень важная вещь."
1000020-97 = "Настоящая уникальная вещь премиум-класса..."
1000020-98 = "[s] «Должно быть, очень дорогой кошелёк.»"
1000020-99 = "О, д-да! Очень!"
1000020-100 = "[s] «Давай найдём его вместе.»"
1000020-101 = "……!!"
1000020-102 = "Спасибо! Огромное спасибо, Сенсей!"
1000020-104 = "Понимая, что шансы невелики, мы с Ару начали искать кошелёк."
1000020-105 = "Мы некоторое время обыскивали место выполнения заказа, но ничего не нашли."
1000020-107 = "Если подумать, кажется, я ещё ходила в ту сторону!"
1000020-108 = "[s] «Просто будем идти по твоему маршруту назад.»"
1000020-110 = "Мы обыскали несколько мест."
1000020-111 = "Угх, нигде нет..."
1000020-112 = "О! А вдруг поле зрения у нас слишком узкое? Может, мы упускаем что-то важное!"
1000020-113 = "Угх! Мне стыдно, что у лидера такое узкое поле зрения!"
1000020-114 = "Сенсей! Можно я сяду тебе на плечи? Пожалуйста!"
1000020-115 = "[s] «Это уже перебор... но ладно.»"
1000020-117 = "Я согласился на внезапную идею Ару, и мы продолжили поиски..."
1000020-118 = "*ахает*"
1000020-119 = "А что если его кто-то забрал? Он очень привлекательный, знаешь!"
1000020-120 = "[s] «...Вероятность кражи действительно немаленькая.»"
1000020-121 = "Угх! Не стоило терять бдительность."
1000020-122 = "Может, это была бездомная кошка!"
1000020-123 = "[s] «Это уже менее вероятно.»"
1000020-124 = "Не недооценивай бездомных кошек района академии Геенна, Сенсей!"
1000020-125 = "Однажды я делилась с участницами честно заработанными сэндвичами..."
1000020-126 = "И вдруг одна кошка бросилась на нас и выхватила их прямо из рук! Ужасные создания!"
1000020-127 = "Без преувеличения можно назвать их преступниками Геенны!"
1000020-128 = "[s] «Официально признано Ару?! Бездомные кошки Геенны страшные!»"
1000020-130 = "[ns3] «Что ж, возможно, добрая душа нашла вещь и сдала её.» \n[ns4] «Можем проверить бюро находок.»"
1000020-131 = "Д-Да... Хорошо."
1000020-132 = "Д-Да... Хорошо."
1000020-134 = "Мы продолжили поиски кошелька, но безуспешно."
1000020-136 = "[ns] «Похоже, его нигде нет.»"
1000020-137 = "*вздох* Где же я его потеряла...? Угх."
1000020-138 = ""
1000020-142 = "[ns] «Эм, Ару, посмотри на время...»"
1000020-143 = "О, да... Уже полночь..."
1000020-144 = ""
1000020-146 = ""
1000020-147 = "...Да, ладно."
1000020-148 = "Всё хорошо, Сенсей."
1000020-149 = "[s] «Ару? Что ты имеешь в виду?»"
1000020-150 = "Ты искал вместе со мной повсюду. Спасибо."
1000020-151 = "[s5] «Но ты сказала, что это очень ценная вещь.»\n[s6] «Ты выглядела такой грустной, когда поняла, что потеряла её.»"
1000020-152 = "О, я-я имею в виду, это правда, но...!"
1000020-153 = "О, я-я имею в виду, это правда, но...!"
1000020-154 = "Но...!"
1000020-155 = "Иногда мы ничего не можем сделать."
1000020-156 = "Уже очень поздно, пора возвращаться."
1000020-157 = "Мы сделали всё, что могли. Этого достаточно."
1000020-158 = "Хи-хи. Спасибо, что искал вместе со мной до такой поздноты, Сенсей."
1000020-159 = "[s] «Не за что. Я был рад помочь.»"
1000020-160 = "Жаль только, что мы так и не нашли его!"
1000020-161 = "Ладно, пойдём обратно, пока не стало ещё позже, Сенсей."
1000020-162 = "[s] «Хорошо, Ару. Давай провожу тебя.»"
1000020-163 = ""
1000020-167 = "Было обидно, что кошелёк так и не нашёлся."
1000020-168 = "Не имея другого выбора, мы с Ару решили вернуться каждый в свой офис."
1000020-169 = ""
1000020-184 = "Угх... Ну же... Где ты...?"
1000020-185 = "[s] «Ага, я так и знал.»"
1000020-186 = "И-и-и?!"
1000020-187 = "С-С-Сенсей?! Я думала, ты ушёл...?"
1000020-188 = "[s] «Ты правда думала, я поверил, когда ты сказала, что хватит?»"
1000020-189 = "Что?!"
1000020-190 = "[s7] «Ты сказала, что она очень важна для тебя!»\n[s8] «Ты не из тех, кто просто сдаётся.»"
1000020-191 = "О, н-но... я больше не хочу доставлять тебе неудобства..."
1000020-192 = "О, н-но... я больше не хочу доставлять тебе неудобства..."
1000020-193 = "Видите ли..."
1000020-194 = "[s] «Я партнёр Решал 68 и будущий консультант по управлению, вообще-то.»"
1000020-195 = "……!!"
1000020-196 = "Хи-хи."
1000020-197 = "Да, точно!"
1000020-198 = "Ты прав, Сенсей! Не понимаю, почему я пыталась справиться со всем одна."
1000020-199 = "Хорошо, Сенсей. Как партнёра и будущего консультанта Решатели проблем 68..."
1000020-200 = ""
1000020-202 = ""
1000020-203 = "«Пойдёшь со мной на самое дно ада?»"
1000020-204 = "[s] «Это одна из тех хардбойлд-фраз, которые ты давно хотела использовать?»"
1000020-205 = "Хе. Может быть."
1000020-206 = "[s] «Что ж, если тебе поможет, я пойду с тобой, Ару.»"
1000020-207 = ""
