[translation]
13220-1 = "Эпизод 22;Неуправляемый поезд"
13220-5 = "Ну, у меня плохие новости. Поезд ЧВК Кайзер догонит нас через считанные секунды."
13220-6 = "А?!"
13220-7 = "Агась. Мы пытались оторваться. Не помогло."
13220-8 = "[s] «Какие у нас варианты?»"
13220-9 = "...Никаких! Вы все прыгаете с поезда и идёте к этой вашей долине. А мы задержим их здесь."
13220-10 = "Ого! Время секретной техники! Поездной дрифт!"
13220-12 = "А? Н-Но..."
13220-14 = "Закрытый сектор 35-9 где-то в часе ходьбы отсюда. Лёгкая прогулка.#nА мы? Да не переживайте."
13220-15 = "Без проблем. Задержим их. Потом — бах — сдаёмся!"
13220-17 = "...Понятно."
13220-18 = "Спасибо, CCC..."
13220-20 = "Пахяхяхя! Мы что, на стороне справедливости? Как-то неправильно ощущается!"
13220-21 = "Нет... Герои. Мы герои!"
13220-23 = "...То есть если я правильно поняла, мы выпрыгиваем, как только поезд остановится...?"
13220-24 = "Да. Держись рядом со мной, Сенсей. Я тебя защищу."
13220-25 = "[s] «Хорошо. Спасибо, Широко. Буду должен.»"
13220-26 = ""
13220-31 = "Ну вот! Сейчас будет авария! Готовьтесь!"
13220-32 = "Готовы!!"
13220-33 = ""
13220-38 = "*ГРОХОТ*"
