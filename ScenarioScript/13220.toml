[translation]
13220-1 = "Episódio 22;Trem Desgovernado"
13220-5 = "Más notícias: parece que a Kaiser vai alcançar a gente."
13220-6 = "Não pode ser...!"
13220-7 = "Hmm, acho que não dá mesmo."
13220-8 = "[s] \"O que a gente faz...?\""
13220-9 = "...Não tem jeito, nós duas vamos segurar eles.#nDesçam do trem primeiro e vão logo pro destino de vocês."
13220-10 = "Uou, chegou a hora do nosso golpe especial: Drift em Trilho Duplo!"
13220-12 = "M-Mas..."
13220-14 = "Se for o Setor 35-9, vocês chegam lá em mais ou menos uma hora daqui.#nE nem precisam se preocupar com a gente, beleza?"
13220-15 = "A gente ganha um tempo e depois já levanta a bandeira branca."
13220-17 = "...Certo, entendi."
13220-18 = "Muito obrigada por nos ajudarem."
13220-20 = "Ahaha! Até parece que a gente virou aliada da justiça.#nNem faz o nosso estilo."
13220-21 = "O que você tá falando, Nozomi?#nSer heroína é legal, vai!"
13220-23 = "...Assim que o trem parar, é só a gente sair correndo, né?"
13220-24 = "Nn, eu protejo o Sensei.#nSegure firme."
13220-25 = "[s] \"Obrigado, Shiroko.\""
13220-31 = "Se preparem pro impacto!"
13220-32 = "Trêêês, dooois..."
13220-38 = "Kabuuuum!"
