[translation]
2300403-1 = "Безразборный мастер"
2300403-2 = "Центральный торговый центр Кивотоса"
2300403-3 = "По просьбе Утахи я отправился в торговый центр за аварийным набором инструментов."
2300403-4 = "Не верится, что в таком огромном комплексе, как Шале, нет ни одного электроинструмента."
2300403-5 = "Шале и так лёгкая цель для хулиганов, поэтому хотя бы простой ремонт нужно уметь делать самостоятельно."
2300403-6 = "Нельзя постоянно зависеть от ремонтников или студентов Миллениума."
2300403-7 = ""
2300403-8 = "...Вот магазин инструментов."
2300403-9 = "Ну что, Сенсей. Выбирай инструмент, который нравится. Я научу тебя им пользоваться."
2300403-11 = "[ns] Выбрать мультитул за 1000 иен."
2300403-12 = "...Сенсей, ты правда собираешься это купить?"
2300403-13 = "На первый взгляд мультитулы кажутся дешёвыми и универсальными, но при частом использовании они могут повредить механизм, потому что инструменты не соответствуют точным спецификациям."
2300403-14 = "В долгосрочной перспективе дешёвый инструмент обойдётся тебе дороже."
2300403-15 = "[s] «А что бы ты посоветовала?»"
2300403-16 = ""
2300403-17 = ""
2300403-18 = "Рекомендую вот это: профессиональный набор инструментов Manaslu."
2300403-19 = "Инструменты отполированы алмазной заточкой. Настолько острые, что способны пробить танк! А кейс сделан из титана и выдерживает мощные взрывы!"
2300403-20 = "Одного этого набора должно хватить почти на любую ситуацию в офисе."
2300403-21 = "[s] «Не слишком ли это для новичка вроде меня?»"
2300403-22 = "Ничуть. Чтобы быть готовым к чрезвычайной ситуации, тебе нужно именно это."
2300403-23 = "Ты пожалеешь, что не купил этот набор, когда в офис ворвётся танк."
2300403-24 = "[s] «Он стоит 100 000 иен?!»"
2300403-25 = "Я же говорила: дешёвые инструменты в итоге могут обойтись дороже."
2300403-26 = "Если считать это вложением в будущее, цена невысокая."
2300403-27 = "Говорят, настоящий мастер не смотрит на инструменты, но я считаю, что мастером вообще нельзя стать, если не выбирать инструменты придирчиво."
2300403-28 = "Вот, Сенсей, с этим набором ты быстро встанешь на путь настоящего мастерства!"
2300403-30 = "В итоге по настоянию Утахи я купил самый дорогой набор инструментов."
2300403-31 = "И всё, что вышло за бюджет, пришлось оплачивать из собственного кармана..."
