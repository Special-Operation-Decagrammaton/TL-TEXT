[translation]
10027030-1 = "Урок 3;Издание, переиздание и распространение"
10027030-5 = ""
10027030-6 = ""
10027030-7 = "Как всегда, Таканэ несёт какую-то чушь..."
10027030-8 = "Я всё ещё не уверена, что она действительно нам помогала."
10027030-9 = "[s] «По крайней мере, она дала нам зацепку, правда?»"
10027030-10 = "...Да. Для неё это необычно."
10027030-11 = "[s] «Думаешь, Таканэ знает о „Луне“ что-то, чего не знаем мы?»"
10027030-12 = "Не знаю... Но нам определённо стоит посетить Издательский отдел."
10027030-13 = "Ух! Ненавижу это признавать, но, похоже, она дала нам неплохой совет."
10027030-14 = "В Издательском отделе есть информация о каждой книге, когда-либо изданной в Красной Зиме."
10027030-15 = "Там наверняка есть что-нибудь и про «Луну»."
10027030-17 = ""
10027030-23 = "[ns] «Это Издательский отдел?»"
10027030-24 = "Ага. Большинство книг, распространяемых академией Красная Зима, делают здесь."
10027030-25 = "[s] «Впечатляет.»"
10027030-26 = "«Впечатляет» — одно из возможных слов..."
10027030-27 = "Они известны тем, что печатают довольно необычные вещи. И я имею в виду ОЧЕНЬ необычные."
10027030-28 = "Ещё они помогают Фронту освобождения знаний, когда нам нужно напечатать бюллетень. Это не то чтобы какая-то маргинальная организация, но—"
10027030-29 = ""
10027030-31 = ""
10027030-33 = "Я слышу тебя, даже когда ты говоришь тихо, знаешь ли."
10027030-34 = ""
10027030-38 = ""
10027030-39 = "Ух. Вот и она..."
10027030-40 = "Да-да. Страшная глава Издательского отдела пришла. Не знаю, что привело тебя сюда, но приятно наконец познакомиться, Мэру. Или мне называть тебя Мэрури?"
10027030-41 = "Мэру вполне подойдёт, Якумо."
10027030-42 = "[s] «Ты глава...?»"
10027030-43 = "Издательского отдела, да. Мы занимаемся всем, что связано с книгами: печатью, переплётом, упаковкой, управлением, продажами и расширением бизнеса. Я — Арамаки Якумо."
10027030-44 = "Я также управляю «Красным медведем». Хех."
10027030-45 = ""
10027030-48 = "[ns1] «Ух ты! Это „Красный медведь“?»\n[ns2] «Кажется, я уже его видел. Разве это не... пропаганда Черины?»"
10027030-51 = "Да, верно."
10027030-52 = "В этот момент мимо пролетел лист бумаги."
10027030-53 = ""
10027030-56 = "[ns3] «Это... ещё одна листовка?»\n[ns4] «„Я осуждаю отвратительные усы, которые выбрасывают крышечки от йогурта, не облизав их!“...?»"
10027030-60 = "Ух ты... Вы и такое печатаете?"
10027030-61 = ""
10027030-66 = "[ns5] «Вы печатаете и пропаганду Черины, и листовки, осуждающие её?!»\n[ns6] «И это нормально — печатать их одновременно?!»"
10027030-70 = "А почему нет? Продажи удваиваются."
10027030-71 = "Возьмём «Красного медведя»: если в одном выпуске поставить и материал, восхваляющий президента Черину, и карикатуру на президента Черину, мы охватим читателей по обе стороны."
10027030-72 = "Зачем выбирать одно, если можно заработать на обоих? Хех. Хех. Хех."
10027030-73 = "[s] «Тоже подход. Но за этой логикой немного трудно уследить.»"
10027030-74 = "Сочту это комплиментом. Итак... Как мне вас называть?"
10027030-75 = "[s] «Сенсей.»"
10027030-76 = "Так это вы?! Кхм. Прошу прощения. Я чуть не потеряла самообладание. Я горжусь тем, что являюсь невозмутимой главой издательства."
10027030-77 = "В любом случае... Добро пожаловать в Издательский отдел, Сенсей. Я слышала о вас столько невероятного, что уже начала сомневаться, существуете ли вы вообще."
10027030-78 = "Знаете, нам нужен главный материал для следующего выпуска «Красного медведя». Почему бы не сделать специальное интервью о визите Сенсея в Издательский отдел?"
10027030-79 = "[s] «Нет.»"
10027030-80 = "Ой, да ладно! Нам можно доверять. Вам это тоже будет выгодно."
10027030-81 = "Фронт освобождения знаний постоянно срывает сроки, имеет неясную аудиторию и печатает всякие странности. А вот у Издательского отдела есть серьёзный капитал, известность и мощная поддержка Секретариата."
10027030-83 = "Разве вся эта история с Секретариатом не должна быть секретом?"
10027030-85 = "Ой! Я слишком увлеклась рекламой. Просто сделайте вид, что не слышали эту маленькую деталь. А теперь продолжим."
10027030-86 = "[s] «Мы пришли, потому что нам нужна информация.»"
10027030-87 = "О! Сделка, значит? Я помогаю вам, а вы в ответ оказываете мне услугу?"
10027030-88 = "Рада, что мы всё-таки понимаем друг друга. Хотя вы довольно озорной, Сенсей. Если хотели договориться, надо было сразу сказать и не устраивать всю эту путаницу!"
10027030-89 = "Прочисти уши, Якумо. Сенсей ничего такого не говорил."
10027030-90 = "О. Не так?"
10027030-91 = "Никогда! Нет!"
10027030-92 = "Мэру, успокойся. Я спрашиваю Сенсея, что он имел в виду, а не тебя."
10027030-93 = "[s] «Если ответишь на наши вопросы, я соглашусь на интервью.»"
10027030-94 = "Сенсей?! Вас живьём освежуют за такое согласие!"
10027030-95 = "Простите, но... освежуют?"
10027030-96 = "Я имела в виду образно, конечно, а не буквально."
10027030-98 = "А. Ладно. Издательский отдел всё равно не работает с кожей."
10027030-99 = "[s] «...Что?!»"
10027030-100 = "..."
10027030-101 = "...?"
10027030-102 = ""
10027030-104 = ""
10027030-107 = "[ns] «Н-Ну, в любом случае... Давайте к делу.»"
10027030-108 = "Речь о «Луне»."
10027030-109 = "А, да. «Луна»."
10027030-110 = "Название кажется знакомым или... Будто где-то в самых дальних уголках моей памяти на меня смотрит чёрная кошка, а её бандана развевается на ветру..."
10027030-111 = "Звучит довольно опасно."
10027030-112 = "Ага! Теперь знаю почему. Название напомнило мне похожую историю."
10027030-113 = "[s] «Серьёзно?»"
10027030-114 = "Да. Это был комикс, опубликованный давным-давно. Сомневаюсь, что он ещё где-то есть... В общем, поэтому я не могла сразу вспомнить нужное произведение."
10027030-115 = "А, да. Теперь вспоминаю. Но зачем вы пришли именно в Издательский отдел?"
10027030-116 = "[s] «Таканэ сказала, что здесь можно найти зацепку.»"
10027030-117 = "Правда? Таканэ..."
10027030-118 = "Хмм... Ага... Ммм... Хе-хе-хе..."
10027030-119 = "[s] «Ну? Можешь дать нам зацепку?»"
10027030-120 = "Точно! Зацепку. Разумеется! Что-нибудь, что Сенсей и Мэру сочтут интересным, а может, даже захватывающим."
10027030-121 = "Да! Да! Что именно?!"
10027030-122 = "Ну, я не так много знаю о последнем томе «Луны»."
10027030-123 = "Но не волнуйтесь. Для вас у меня всё равно есть кое-какая сочная информация."
10027030-124 = "Тогда хватит ходить вокруг да около и говори!"
10027030-125 = "У «Луны» очень старый и очень преданный фандом. Он жив в Красной Зиме и по сей день. Иногда фанаты всё ещё собираются."
10027030-126 = "Обычно у них там довольно оживлённо..."
10027030-127 = "Фандом до сих пор собирается из-за общей любви к «Луне»?"
10027030-128 = "[s7] «Фанаты всё ещё собираются даже после завершения произведения?»\n[s8] «Это нормально для Красной Зимы, Мэру?»"
10027030-131 = "Нет... Не нормально."
10027030-132 = "То есть, конечно, после завершения произведения люди иногда ещё могут о нём говорить."
10027030-133 = "Но если фанаты продолжают обсуждать его и даже объединяться вокруг него..."
10027030-134 = "Ну, далеко не каждое произведение достаточно хорошее, чтобы заслужить такую преданность."
10027030-135 = "Да. У этого комикса богатая история."
10027030-136 = "Но..."
10027030-137 = "[s9] «Но что касается времени и места встречи...»\n[s10] «Ты ведь не знаешь, да?»"
10027030-140 = "Эм, вообще-то знаю."
10027030-141 = "Что?! Откуда?! Я была уверена, что ты скажешь, будто понятия не имеешь!"
10027030-142 = "Ну, я всё-таки довольно хорошо осведомлена. У меня обширная сеть источников."
10027030-143 = "В конце концов, мы — Издательский отдел, что бы о нас ни думали!"
10027030-144 = "Но раньше ты сказала, что почти ничего не помнишь!"
10027030-145 = "Я сказала, что мне трудно вспомнить быстро, а не что я вообще ничего не знаю. Итак, насчёт времени и места..."
10027030-146 = "Ну? Ну?"
10027030-147 = "Хех. Хех. Хех. Не так быстро. Сначала обсудим оплату."
10027030-148 = "[s] «Понятно. Ты хочешь вознаграждение.»"
10027030-149 = "Верно."
10027030-150 = "Якумо... Что ты теперь собираешься потребовать у Сенсея?!"
10027030-151 = "Не у Сенсея... У Мэру. Я хочу кое-что от тебя."
10027030-152 = "Хм? Я?"
10027030-153 = "Да. Ничего особенного. В будущем я могу попросить тебя предоставить рукопись."
10027030-154 = "Рукопись?! Ни за что! Ни один заказ, который ты давала раньше, не был нормальным!"
10027030-155 = "Нет? Тогда, полагаю, информация о «Луне» тебе всё-таки не нужна. Как жаль..."
10027030-156 = "Ургх!"
10027030-157 = ""
10027030-159 = ""
10027030-160 = ""
10027030-161 = "(Раз это ради Момидзи... Да, ради Момидзи я смогу.)"
10027030-162 = ""
10027030-165 = ""
10027030-166 = ""
10027030-167 = "Хорошо... Я сделаю это."
10027030-168 = "[s] «Ты уверена, что согласна на такую сделку, Мэру?»"
10027030-169 = "Да. Это ради Момидзи. Я справлюсь!"
10027030-170 = "О-о-о! Какая прекрасная демонстрация товарищества — аж слеза наворачивается."
10027030-171 = "[s] «Мэру...»"
10027030-172 = "Подожди! У меня есть условия! Я не стану делать ничего совсем уж странного. Это должно подходить моему стилю, быть чем-то, во что я сама верю!"
10027030-173 = "Хех. Хех. Хех. Не волнуйся. Если нужная мне рукопись вдруг совпадёт с предпочтениями Мэру, тем лучше для нас обеих..."
10027030-174 = "А теперь тебе всего лишь нужно подписать этот контракт, согласно которому твой планшет и перо переходят ко мне, если ты не выполнишь свою часть сделки."
10027030-175 = "Но... Это же жестоко!"
10027030-176 = "Да, полагаю, для автора редактор всегда кажется жестоким. А теперь, пожалуйста..."
10027030-177 = ""
10027030-179 = ""
10027030-180 = ""
10027030-181 = ""
10027030-182 = ""
10027030-183 = ""
10027030-184 = ""
10027030-186 = ""
10027030-189 = "[ns] «Это значит, мне ничего делать не придётся?»"
10027030-190 = "Ах, давайте обсудим это позже. Так будет веселее."
10027030-191 = "[s] «Пожалуйста, будьте добрее...»"
10027030-192 = "Хи. Хи. Хи."
