[translation]
10059040-1 = "Episode 4;The Suspicious Distributor"
10059040-2 = "(The next day, visiting the Art Council)"
10059040-5 = "Good day. We have been expecting you."
10059040-6 = "I would love to exchange some witty banter to reward you for your hard work yesterday, but—#nunfortunately, we don't have the luxury of time."
10059040-7 = "Let us get straight to the point."
10059040-8 = "Secretary Kanon, if you please."
10059040-13 = "Through yesterday's investigation, we secured the illegal organization's ledgers and numerous involved parties."
10059040-14 = "By tracing the flow of transactions based on those, the Council has reached a conclusion—"
10059040-15 = "—The name of the Wild Hunt is being used for money laundering."
10059040-16 = "[s] \"That's more serious than I imagined...\""
10059040-17 = "We attempted to persuade the individuals we captured yesterday to talk."
10059040-18 = "Well, you could call it the carrot and the stick...#nManami-sama wielded the stick, and then I offered the carrot..."
10059040-19 = "Though, um... I didn't expect Manami-sama to literally wield a whip..."
10059040-20 = "It was a truly spectacular record to behold."
10059040-24 = "A-anyway... I tried to lower their guard to extract information."
10059040-25 = "But in the end, I couldn't get anything out of them."
10059040-26 = "They were as tight-lipped as buds enduring the winter cold..."
10059040-27 = "And above all, they seemed terrified of their client."
10059040-28 = "They all said the same thing: 'If I betray them, I'll be erased forever.'"
10059040-29 = "They never deviated from that line."
10059040-30 = "We haven't identified the client, but they seem to be quite a well-known figure in the underworld."
10059040-31 = "The opponent is a major player, even among criminal organizations."
10059040-32 = "They never show their face, yet they wield immense influence while moving only goods and funds."
10059040-33 = "[s] \"Do you have any leads?\""
10059040-34 = "I would like to say it's that thieving cat—"
10059040-35 = "But it seems that is not the case."
10059040-36 = "I don't think that cowardly fugitive is a big enough shot to be feared by criminals.#nJudging by the situation, there must be a third party involved."
10059040-37 = "...But we can't grasp their true identity."
10059040-38 = "First, we need to tighten security within the Academy and flush out those involved."
10059040-39 = "It would be nice if we found a clue to catch that thieving cat in the process, too."
10059040-40 = "Once I catch them... I will sentence them to a life of drinking nothing but milk."
10059040-41 = "As a special mercy, I'll provide them with premium milk."
10059040-42 = "Fresh milk delivered every day, until they are absolutely sick of it—"
10059040-46 = "—Hm? Wait a moment."
10059040-47 = "Fresh milk... delivered every day?"
10059040-55 = "When did this product start circulating in the Academy?"
10059040-56 = "Two months ago."
10059040-57 = "And when did that suspicious buyer appear?"
10059040-58 = "...That was also approximately two months ago."
10059040-59 = "...How curious."
10059040-60 = "[s] \"Why the sudden talk about milk?\""
10059040-61 = "A suspicious buyer and milk distribution. They seem unrelated, but...#n the timing overlaps far too perfectly."
10059040-62 = "It won't be too late to judge them as unrelated after we investigate."
10059040-63 = "Secretary Kanon, please contact the milk distributor immediately."
10059040-64 = "I will question them myself."
10059040-67 = "As you wish."
10059040-73 = "Well, well, Council President! What brings you here?"
10059040-74 = "Good day."
10059040-75 = "I apologize for the sudden contact, but there is something I would like to confirm."
10059040-76 = "I would like to review your company's distribution routes.#nWould that be acceptable?"
10059040-77 = "Yes? That is quite sudden."
10059040-78 = "Well, I don't mind, but... when were you thinking?"
10059040-79 = "Right now."
10059040-80 = "Right now!?"
10059040-81 = "Is there a problem?"
10059040-82 = "N-no! I will come over immediately to guide you!"
10059040-87 = "[ns] \"They were very quick to respond, weren't they?\""
10059040-88 = "They don't want to get on our bad side.#nBeing entrusted with our Academy's logistics is no small feat."
10059040-89 = "Whether they are involved in crime is another matter entirely."
10059040-90 = "We shall see what turns up... Once they arrive, we will have them show us their distribution routes."
10059040-92 = "(Shortly after, the distributor arrived, and we went around to check the related facilities together)"
10059040-94 = "We take pride in the quality of our dairy products, but they do not have a long shelf life."
10059040-95 = "Therefore, we required a rapid and stable means of transport."
10059040-96 = "That is why we chose to partner with the Highlander Railway Academy."
10059040-97 = "Thanks to the railway network spanning all of Kivotos, we have achieved ideal delivery."
10059040-98 = "All transport is conducted with Highlander's cooperation, and no unauthorized personnel can intervene along the way."
10059040-99 = "In other words, there is no room for outsiders to interfere."
10059040-107 = "This is our control room, where we centrally manage our logistics."
10059040-108 = "Cameras monitor the trains 24 hours a day, and we can detect any abnormalities immediately."
10059040-109 = "Also, the footage is automatically backed up to a server and stored for one year."
10059040-110 = "The last two months you requested are all still here."
10059040-111 = "If you wish, we can check them together right now."
10059040-117 = "This is our ledger storage vault.#nAs a facility, it is no less secure than a bank's private safe."
10059040-118 = "Security guards are stationed here 24 hours a day in pairs, and access is strictly managed."
10059040-119 = "Though, if I am accompanying you, you are free to enter."
10059040-120 = "Now, which ledgers would you like to see?#nI will show you everything, with nothing hidden."
10059040-125 = "(We continued to tour the facilities, but found nothing out of the ordinary)"
10059040-127 = "I am glad to see you have gained an understanding."
10059040-128 = "Please, take care on your way back."
10059040-132 = "As the distributor said, the management was indeed thorough."
10059040-133 = "...Unnaturally so."
10059040-134 = "[s] \"Is it so perfect that it's suspicious?\""
10059040-135 = "Yes. A lie is most effective when hidden within the truth."
10059040-136 = "If I may interpret... this is just a general theory.#nIt does not mean that Manami-sama does this on a daily basis."
10059040-137 = "Regardless, protecting milk transaction records with facilities that rival a bank vault...#nIt is excessive by any measure."
10059040-138 = "It would be premature to think we know everything just by looking at the places the distributor showed us."
10059040-139 = "...No matter how well-managed it is, one cannot always keep an eye on every corner of the site."
10059040-140 = "Any rumor, no matter how trivial, will do.#nLet's pick up everything that catches our attention."
10059040-141 = "In that case, it would be more efficient to split up."
10059040-142 = "Since the area to investigate will be quite large."
10059040-143 = "U-um... then, like a pair of birds supporting each other... shall we move in pairs?"
10059040-144 = "Sensei... who would you be most comfortable moving with?"
10059040-145 = "Oh my. That is quite a bold question for the modest Urara-sama."
10059040-146 = "Are you asking... which of the three of us you will choose?"
10059040-147 = "Ehh!? I-is that how it sounded!?"
10059040-148 = "I-I'm sorry, I didn't mean it like that...!#nI will follow Manami-sama's judgment!"
10059040-149 = "Hmm..."
10059040-150 = "If you are to act with Sensei, the representative of Schale, it is only natural that I, the representative of the Academy, accompany you."
10059040-151 = "However, this time I will leave it to Vice President Urara."
10059040-152 = "Because Secretary Kanon would follow me no matter what I said..."
10059040-153 = "Naturally. Recording Manami-sama's steps is my duty as a secretary."
10059040-154 = "Especially for an important investigation like this, even more so."
10059040-155 = "To deliver beautiful memories to future generations in a way that they will not be lost.#nThat is my greatest joy."
10059040-156 = "Manami-sama. Until the day the heavens and earth part us—#nNo. Even if I have to defy the heavens and earth, I will follow you to the ends of the world."
10059040-157 = "[s] \"...Manami, you have it tough, don't you?\""
10059040-158 = "Fufu, I'm already used to it."
10059040-159 = "Secretary Kanon doesn't mean any harm, after all..."
10059040-160 = "Whatever the reason, I will act with Secretary Kanon."
10059040-161 = "So, Sensei. I leave Vice President Urara in your care."
10059040-162 = "She is an excellent Vice President whom I trust deeply.#nI am sure she will be a great help to you."
10059040-166 = "Allow me to explain—"
10059040-167 = "It means that if you do anything strange to my precious Vice President Urara, I will not let it slide."
10059040-171 = "[ns] \"I know that without you telling me!\""
10059040-172 = "Then I am relieved."
10059040-173 = "Now, let us begin gathering information.#nWe will report to each other tomorrow morning in the Council room."
10059040-181 = "Ahaha... I'm sorry.#nWe've made you go to quite a lot of trouble because of us, haven't we?"
10059040-182 = "[s] \"Not at all. If anything, I'm happy to be of help.\""
10059040-183 = "Fufu... Manami-sama and Kanon-sama both love their little pranks..."
10059040-184 = "When you're in trouble, please don't hesitate to tell me."
10059040-185 = "I may not look like it, but I am the Vice President...#nI can at least clear the morning dew from your path, Sensei..."
10059040-186 = "[s1] \"I'll just take your kind offer.\"\n[s2] \"Urara already looks out for me enough.\""
10059040-189 = "I-is that so..."
10059040-190 = "To hear you say that... I'm very happy."
10059040-191 = "[s] (Somehow... the scent is even healing my heart...)"
10059040-192 = "...Ah, I shouldn't be doing this. Now is not the time."
10059040-193 = "Let's start the investigation right away."
10059040-194 = "I'll gather as much information as I can, enough not to lose to those two!"
10059040-199 = "(After that, I went around the train lines with Urara, who seemed somewhat excited)"
10059040-213 = "(I heard many rumors, but most of them were meaningless)"
10059040-214 = "(—Except for the last rumor I heard)"
10059040-216 = "Station near the ranch"
10059040-217 = "Yes? The milk distributor...?"
10059040-221 = "Hmm, I wonder if that rumor is true..."
10059040-222 = "What kind of rumor is it?"
10059040-223 = "No... it's really just a rumor, but..."
10059040-224 = "It's about the distributor that supplies the premium milk—"
10059040-225 = "They say they are connected to a famous prisoner..."
10059040-229 = "Could it be... one of the Seven Prisoners?"
10059040-230 = "That seems to be the case."
10059040-231 = "Um, I think... I remember the name they were called."
10059040-235 = "[log=하이랜더 기관사]The Broker of Avarice[/log]"
10059040-238 = "[ns] \"The Broker... of Avarice?\""
10059040-241 = "That... has a very dangerous ring to it."
