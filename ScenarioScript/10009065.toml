[translation]
10009065-9 = "Теперь я понимаю, почему она была одной из Семи Заключённых."
10009065-10 = "На этот раз она нанесла ответный удар так, что никто даже не заметил её побега. Впечатляет."
10009065-11 = ""
10009065-13 = ""
10009065-14 = "Но теперь всё кончено. Благодаря руководству Сенсея у тебя не осталось союзников, а украденное оборудование отключено."
10009065-15 = "Ты встретила достойного противника, Лиса Бедствий."
10009065-16 = "...!"
10009065-17 = ""
10009065-19 = ""
10009065-20 = "Пытаешься сбежать из угла, в который сама себя загнала?"
10009065-21 = "Пусть так. Я предпочла бы, чтобы мне не пришлось иметь дело с новыми трупами..."
10009065-22 = "Точнее, с новыми ранеными. Так что пора заканчивать."
10009065-23 = "Я погонюсь за ней, Сенсей."
10009065-24 = "Часть её сил всё ещё может перегруппироваться и устроить неприятности.#nСоветую ради безопасности снова встретиться со студентами Валькирии."
10009065-25 = "[s] «Но, Сэна...!»"
10009065-26 = ""
10009065-28 = ""
10009065-30 = "Было уже поздно. Сэна умчалась в погоню за Вакамо."
10009065-31 = "Я некоторое время стоял на месте, думая, что делать дальше."
10009065-36 = ""
10009065-37 = "Сенсей, вы в порядке?! Вы не ранены?"
10009065-38 = "[s] «Я в порядке. Что случилось? Ты выглядишь взволнованной.»"
10009065-39 = "Погодите. Вы одни? Что случилось со студентом Геенны, которая была с вами?"
10009065-40 = "Она погналась за Вакамо?!"
10009065-41 = "Сенсей, нет! Это ловушка!"
10009065-42 = "[s] «Ловушка...?»"
10009065-43 = "Это с самого начала было планом Вакамо. Она устраивала все эти инциденты, чтобы сосредоточить внимание всех правоохранительных сил на себе."
10009065-44 = "Нет времени объяснять. Сохраняйте спокойствие и следуйте моим указаниям. Я только что взломала систему неподалёку от вас."
10009065-45 = "[s] «Ты что?!»"
10009065-46 = "Я могу использовать ближайшие камеры и светофоры, чтобы вывести вас в безопасное место."
10009065-47 = "Св...зь...проп..."
10009065-48 = "Сэн...сэй...!"
10009065-49 = ""
10009065-50 = ""
10009065-53 = "[ns] «Связь пропала...»"
10009065-54 = "Я не смог снова связаться с Чихиро и не знал, что делать, когда..."
10009065-56 = "Хи-хи-хи. Наконец-то я тебя нашла. ♥"
10009065-57 = "[s] «А?»"
10009065-60 = "Тем временем..."
10009065-63 = ""
10009065-65 = "Докладываю! Лиса Бедствий замечена в торговом районе D.U.! Запрашиваем подкрепление!"
10009065-66 = "С ней подкрепление! Мы не справимся одни!"
10009065-67 = "Приём! Говорит подразделение Западной улицы D.U.!"
10009065-68 = "Слышу вас отлично! Повторяю, направьте подкрепление к—"
10009065-69 = "Не можем! Лиса Бедствий сбежала из Исправительного бюро и атакует фестиваль на Западной улице! Мы сами запрашиваем подкрепление!"
10009065-70 = "Стойте! Что?!"
10009065-73 = ""
10009065-75 = "Повторяю! Вакамо в поле зрения!"
10009065-78 = ""
10009065-79 = "Невозможно! Мы сейчас сражаемся с Лисой Бедствий на Центральной улице D.U.!"
10009065-81 = ""
10009065-84 = ""
10009065-88 = "Что происходит, Фубуки...?!"
10009065-89 = "Да откуда мне знать! Они все...?!"
10009065-90 = "Поддельные, да. Вакамо спланировала всё это, чтобы сбежать из Исправительного бюро."
10009065-91 = "Это была сложная отвлекающая операция, чтобы она могла встретиться с Сенсеем один на один."
10009065-92 = "Что?!"
10009065-93 = "Нужно немедленно предупредить Сенсея!"
10009065-94 = "Я уже пыталась. Нашу связь глушат."
10009065-95 = "Откуда у неё оборудование, способное на такое?"
10009065-96 = ""
10009065-98 = ""
10009065-99 = "Ой-ой."
10009065-100 = "Что значит «ой»? Оно ведь не из Валькирии, правда?"
10009065-101 = "Неважно. У нас нет на это времени."
10009065-102 = "Если отсюда мы не можем связаться с Сенсеем, остаётся только один вариант."
10009065-103 = "Ты умеешь водить?"
10009065-105 = "Я?"
10009065-107 = "Я установила глушилку, чтобы нам никто не помешал. ♥"
10009065-108 = "Украденное по прихоти оборудование Валькирии оказалось весьма полезным."
10009065-109 = "Не правда ли... Сенсей?"
10009065-110 = "[s] «Вакамо...»"
10009065-113 = "Ох, как же я ждала... Ты даже не представляешь, как долго я мечтала об этом мгновении."
10009065-114 = "И сколько усилий мне потребовалось. Убрать все препятствия вокруг тебя оказалось довольно сложно."
10009065-115 = "Но наконец-то мне больше ничто не мешает."
10009065-116 = "Всё это время я думала, что должна сделать, чтобы подобраться к тебе так близко."
10009065-117 = "А ещё лучше — что я сделаю, когда наконец останусь с тобой наедине."
10009065-118 = "[s] «Поэтому ты устроила войну с Валькирией?»"
10009065-119 = "Хи-хи. Это был единственный способ отвлечь всех от тебя и переключить внимание на меня. Я подняла такой шум, что им пришлось сосредоточиться только на мне."
10009065-120 = "Всё ради возможности наконец остаться с тобой наедине."
10009065-121 = "Но хватит разговоров. Я больше не могу сдерживаться."
10009065-124 = ""
10009065-125 = ""
10009065-126 = "[ns] «...!»"
10009065-127 = "Наконец-то я могу исполнить своё самое сокровенное желание!"
10009065-128 = ""
10009065-130 = ""
10009065-131 = ""
10009065-132 = "Так... примешь это, Сенсей?"
10009065-133 = "[s] «Это... шоколад?»"
10009065-134 = "Конечно. Сегодня особенный день, поэтому я приготовила его специально для тебя. ♥"
10009065-135 = "[s] «Н-но почему шоколад...? Стой!»"
10009065-137 = "Мы ведь говорим о Дне святого Валентина — важном празднике.#nЭто день, когда обмениваются шоколадом и радуются."
10009065-139 = "День святого Валентина — особое исключение, ведь это такой важный праздник.#nВ этот день люди обмениваются шоколадом, чтобы передать чувства, которые хранят в сердце."
10009065-141 = ""
10009065-143 = "[ns] «Это значит...?»"
10009065-144 = "Да! Это была любовь с первого взгляда!"
10009065-145 = "С той самой минуты, как мы встретились, я тосковала по тебе и ждала этого дня."
10009065-146 = "И теперь, когда мы наконец одни, я могу подарить тебе этот шоколад и показать свои чувства."
10009065-147 = "Хи-хи-хи. Я не могла бы быть счастливее!"
10009065-148 = "[s] «Всё, что произошло сегодня... было ради того, чтобы подарить мне шоколад?»"
10009065-149 = "Да, Сенсей! ♥"
10009065-150 = "[s] «...»"
10009065-152 = "[s1] «Не пойми неправильно. Я благодарен и всё такое, но...»\n[s2] «По-моему, ты немного переборщила, Вакамо!»"
10009065-153 = "Ох. Я так рада, что тебе понравилось."
10009065-154 = "Я знала, что стоило сделать это с самого начала.#nЯ могла признаться тебе раньше!"
10009065-155 = "Хи-хи. Хи-хи-хи."
10009065-156 = "[s3] «Я правда это ценю, но...»"
10009065-157 = "А? Какой?"
10009065-158 = "[s4] «Не знаю, как к этому относиться.»"
10009065-159 = "Как относиться...?"
10009065-160 = "[s5] «Ты выбрала неправильный способ.»"
10009065-161 = "Неправильный, говоришь?"
10009065-162 = "Ч-что?!"
10009065-163 = "[ns6] «Из-за меня ты устроила множество проблем.»"
10009065-165 = "[ns7] «Тебе совсем не стыдно за это?»"
10009065-167 = "[ns8] «То, что ты сегодня сделала, было неправильно.»"
10009065-168 = "...!"
10009065-169 = "Н-но, Сенсей! День святого Валентина ведь должен быть...!"
10009065-170 = "Сегодня люди должны передавать друг другу свои истинные чувства."
10009065-171 = "Всё, что я сегодня сделала, было ради того, чтобы показать тебе свои чувства."
10009065-172 = "[s] «Я понимаю, но нельзя делать это за счёт других.»"
10009065-173 = "Но я...!"
10009065-174 = "[s9] «Не только у тебя сегодня были особые планы.»\n[s10] «Подумай о людях, чей особенный день ты испортила.»"
10009065-175 = "Я лишь хотела...!"
10009065-176 = "Я лишь хотела...!"
10009065-177 = "[s] «Если ты не можешь этого понять, тогда я действительно в тебе разочарован.»"
10009065-178 = "...!"
10009065-179 = "В-вы... разочарованы во мне...?"
10009065-180 = "Всё, что я делала, было ради тебя..."
10009065-181 = "...но это было неправильно? Я... разочаровала тебя?"
10009065-182 = "Да быть такого не может!"
10009065-183 = "Я не знаю, что буду делать, если заставила тебя меня ненавидеть! *всхлип*"
10009065-184 = "[s] «Но я верю, что ты сможешь извлечь из этого урок и стать лучше.»"
10009065-185 = "...!"
10009065-186 = "Ты веришь в меня...? Ты не ненавидишь меня, несмотря на мои ошибки?"
10009065-187 = "[s11] «Я всегда верю, что моим студентам нужно давать второй шанс.»\n[s12] «Я не смог бы ненавидеть одну из своих студентов. Просто пообещай исправиться.»"
10009065-188 = ""
10009065-189 = ""
10009065-191 = ""
10009065-192 = "Я... одна из твоих студентов?"
10009065-193 = "Ах... конечно! В следующий раз я буду лучше!"
10009065-194 = "Что угодно ради тебя, Сенсей!"
10009065-195 = "Отныне я не сделаю ничего, что могло бы тебя разочаровать."
10009065-196 = "Я буду соблюдать правила и стану твоим лучшим студентом!"
10009065-197 = "[s] «Хорошо. Обещаешь?»"
10009065-198 = "Да! Обещаю!"
10009065-199 = ""
10009065-201 = ""
10009065-202 = ""
10009065-204 = "О, Сенсей. Мой дорогой Сенсей! ♥"
10009065-205 = ""
10009065-208 = "И похоже, те назойливые люди уже идут сюда, чтобы снова прервать наше драгоценное время наедине."
10009065-209 = "Но ничего. У нас было время дать друг другу обещание."
10009065-210 = "Зная это, я смогу вынести печаль нашей временной разлуки.#nЯ уверена."
10009065-211 = "До скорой встречи, мой дорогой Сенсей."
10009065-212 = "[s] «Д-до встречи?»"
10009065-213 = "Именно. Я с нетерпением буду ждать."
10009065-214 = "До свидания, мой любимый! ♥"
10009065-215 = ""
10009065-217 = ""
10009065-219 = "Сенсей! Вы в порядке?!"
10009065-220 = "Фубуки, смотри! Лиса Бедствий убегает!"
10009065-221 = "Нельзя дать ей уйти! Сделайте всё, чтобы её поймать!"
10009065-223 = "И погоня началась снова, но на этот раз я остался позади и лишь ошеломлённо смотрел на шоколад, который подарила мне Вакамо."
