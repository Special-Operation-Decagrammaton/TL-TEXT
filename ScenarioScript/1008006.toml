[translation]
1008006-1 = "Высочайшие стандарты"
1008006-2 = "Почувствовав неладное, я отправился искать Шокухо."
1008006-3 = ""
1008006-7 = ""
1008006-8 = "О? Сенсей?"
1008006-9 = "Ах... Значит, ты беспокоился обо мне."
1008006-10 = "Кажется, я уже говорила это раньше, но ты действительно очень добрый человек."
1008006-11 = "Но, хм... Как бы это сказать?"
1008006-12 = "Даже если ты учитель, некоторые вещи трудно просить вот так напрямую."
1008006-13 = "[s1] У тебя какая-то сложная просьба?\n[s2] Я думал, ты просто ищешь ресторан."
1008006-16 = "Да, я действительно ищу ресторан, но..."
1008006-17 = "Я очень придирчива к ресторанам. И неважно, насколько я голодна."
1008006-18 = "Я не могу есть что попало... Разве бывает проблема более человеческая?"
1008006-19 = "Дома у меня было несколько любимых ресторанов, и мне всегда было легко заранее понять, чего ждать от нового заведения..."
1008006-20 = "Но здесь всё сложнее. Возможно, в такой ситуации мне всё-таки стоит прибегнуть к своей способности?"
1008006-21 = "[s3] Это уже перебор...\n[s4] Неужели всё настолько серьёзно?"
1008006-24 = "А разве нет? Мало что требует большей осторожности, чем решение о том, что попадёт тебе в рот."
1008006-25 = "Проще говоря, я не ем ничего, если это не приготовлено из свежих органических ингредиентов. Критерий предельно ясен."
1008006-26 = "Любой ресторан может заявить, что использует такие продукты... Но правда ли это?"
1008006-27 = "Откуда нам знать, что использовались действительно органические ингредиенты? Какому источнику можно доверять?"
1008006-28 = "Единственный способ убедиться — прочитать мысли владельца и повара."
1008006-29 = "Именно поэтому нынешняя ситуация для меня так сложна."
1008006-30 = "В этом вопросе я не пойду на компромисс. Я скорее буду голодать..."
1008006-31 = "...чем стану есть посредственную еду. Я серьёзно, Сенсей."
1008006-32 = ""
1008006-35 = "[ns5] Я ясно чувствую твою искренность.\n[ns6] Так она, оказывается, убеждённый гурман..."
1008006-38 = "...Хм?"
1008006-39 = "Ты очень выразителен, Сенсей. Похоже, тебе что-то пришло в голову."
1008006-40 = "Ну?"
1008006-41 = "Ты предлагаешь довериться тебе, Сенсей? Что ты задумал? Приготовить что-нибудь дома?"
1008006-42 = "...Нет?"
1008006-43 = "Ты знаешь ресторан...?"
1008006-44 = "Сенсей... Ты меня вообще слушал? У меня весьма особые вкусы..."
1008006-45 = "Говоришь, что полностью понял мои опасения..."
1008006-46 = "...и всё равно уверен в своём выборе."
1008006-47 = ""
1008006-49 = ""
1008006-50 = "...Хм."
1008006-51 = "Твои слова определённо пробудили моё любопытство."
1008006-52 = "Что ж, попробуем? Но, Сенсей, я ясно обозначила свои требования."
1008006-53 = "Даже если я не стану читать мысли повара, качество ингредиентов я всё равно определю по вкусу."
1008006-54 = "Если блюдо не будет соответствовать моим стандартам, я уйду. Пожалуйста, помни об этом."
1008006-55 = "Что ж тогда... Пойдём?"
1008006-57 = ""
1008006-58 = "...Это здесь?"
1008006-59 = "Выглядит достаточно чисто. Но я пока не убеждена..."
1008006-60 = "Что ж, раз уж мы здесь. Выбор основного блюда оставлю тебе, Сенсей."
1008006-61 = "Хм... Понятно. Значит, вот что ты заказываешь..."
1008006-62 = "Отлично. А что будете вы, мисс?"
1008006-63 = "...Мне то же самое."
1008006-64 = "Прекрасно. Ваш заказ скоро будет готов."
1008006-66 = "A few minutes later..."
1008006-68 = ""
1008006-73 = "Ваш заказ. Приятного аппетита!"
1008006-74 = ""
1008006-76 = ""
1008006-77 = "Хм... Понятно."
1008006-78 = "Ты выглядишь очень уверенно. Ты знаком с управляющим или поваром?"
1008006-79 = "Нет? Тогда почему ты так спокоен?"
1008006-80 = "Тебе может нравиться это место, Сенсей, но откуда тебе знать, не используют ли они какие попало продукты?"
1008006-81 = "...Говоришь, невозможно?"
1008006-82 = "Невозможно... Неужели..."
1008006-83 = "Нет смысла спорить. Меня просто удивила такая перемена в твоём поведении, Сенсей."
1008006-84 = "Ты производишь впечатление человека, который всегда говорит с некоторой осторожностью. Но сейчас так настойчиво уверяешь, что всё будет хорошо..."
1008006-85 = "Ты обычно такой сдержанный, а сейчас делаешь столь уверенное заявление, хотя сам не можешь знать наверняка."
1008006-86 = "Что ж..."
1008006-87 = "Значит, у тебя есть какой-то надёжный способ проверить еду здесь..."
1008006-88 = ""
1008006-90 = ""
1008006-91 = "Я угадала ответ?"
1008006-92 = "[s7] В Кивотосе тоже есть гурманы.\n[s8] Без них этого ресторана здесь бы не было."
1008006-95 = "Какой окольный ответ..."
1008006-96 = "Хорошо. Мы уже достаточно это обсудили, так что давай попробуем..."
1008006-97 = ""
1008006-99 = ""
1008006-100 = ""
1008006-101 = ""
1008006-102 = ""
1008006-104 = "...О?"
