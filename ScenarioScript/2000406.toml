[translation]
2000406-1 = "Наслаждаясь высотой"
2000406-2 = "Пляж Хигасицу"
2000406-3 = "Маширо занималась волонтёрской работой, поэтому я пришёл на пляж угостить её мороженым."
2000406-4 = "[s] «Она сказала, что будет здесь...»"
2000406-5 = "О, Сенсей. Я здесь."
2000406-6 = "[s1] «Маширо? Где ты?»\n[s2] «Ты опять в маскхалате?»"
2000406-7 = "Н-Нет, совсем нет."
2000406-8 = "Н-Нет, совсем нет."
2000406-9 = "В этот раз..."
2000406-10 = "...я прямо над тобой."
2000406-11 = "[s] «Надо мной?»"
2000406-12 = ""
2000406-14 = ""
2000406-15 = "Это мне стоит спросить, зачем ты здесь. Почему пришёл так далеко?"
2000406-16 = "О, ты принёс мороженое."
2000406-17 = "Признаюсь, от жары ужасно хочется пить. Спасибо, Сенсей."
2000406-18 = "[s] «Где ты была?»"
2000406-19 = "Я сидела на береговой наблюдательной вышке вон там."
2000406-20 = "С неё видно весь пляж."
2000406-21 = "[s] «Ты и правда любишь высокие места, Маширо.»"
2000406-22 = "Я была на вышке не поэтому."
2000406-23 = "Мне нужно видеть весь пляж, поэтому просто удобнее находиться повыше."
2000406-24 = "Высота ещё и устраняет слепые зоны, поэтому стрелять проще. Кроме того..."
2000406-25 = "...прохладный ветер снижает риск теплового удара, даже если мне придётся несколько часов ждать момента для выстрела."
2000406-26 = "К тому же с высоты пейзаж выглядит красивее."
2000406-27 = "Кстати, почему бы тебе не подняться на вышку вместе со мной, Сенсей?"
2000406-28 = "Мороженое будет ещё вкуснее, если съесть его с видом на красивый пейзаж."
2000406-29 = "[s] «А разве там не будет слишком тесно для двоих?»"
2000406-30 = "Не переживай. Будет тесновато, но если сядем поближе друг к другу, всё должно быть нормально."
2000406-31 = "Тебе ведь не неловко сидеть так близко ко мне... правда?"
2000406-32 = "[s] «Нет, дело не в этом.»"
2000406-33 = "Тогда пойдём."
2000406-34 = ""
2000406-35 = ""
2000406-36 = ""
2000406-37 = "Лестница скользкая, так что смотри под ноги и иди за мной."
2000406-39 = "Мы с Маширо смотрели на пляж со сторожевой вышки до самого заката."
