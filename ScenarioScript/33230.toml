[translation]
33230-1 = "Episódio 23;No Subsolo da Antiga Catedral"
33230-2 = "...Será que agora finalmente acabou?"
33230-3 = "Sim, mais do que isso já é..."
33230-4 = "..."
33230-5 = "Ainda não..."
33230-6 = "Ainda resta aquilo... no subsolo da Antiga Catedral..."
33230-15 = "Saori...!?"
33230-16 = "Para o subsolo da Antiga Catedral...!"
33230-17 = "Pelo jeito que ela falou, ainda resta algum recurso. Precisamos impedi-la!"
33230-23 = "Ela ainda tinha tanta força assim...?"
33230-24 = "...Eu vou."
33230-25 = "A-Azusa-chan, eu também vou...!"
33230-26 = "Com esse ferimento, fique descansando. Não precisa se preocupar, vai ficar tudo bem. Vou deter a Saori e já volto."
33230-27 = "[s] \"Eu também vou.\""
33230-28 = "...Obrigada, Sensei."
33230-29 = "Azusa-chan, tome cuidado...!"
33230-30 = "...Sim. Eu já estou bem."
33230-35 = "Hifumi, Hanako, Koharu... Já volto."
33230-36 = "Tá bom!"
33230-37 = "Estaremos esperando."
33230-38 = "T-Tome cuidado, viu?!"
33230-42 = "[ns] \"Bom, vamos lá.\""
33230-45 = "Azusa..."
33230-46 = "Saori, vamos acabar logo com isso."
33230-47 = "...Muito bem. Vou apostar tudo e fazer desta a nossa última batalha."
33230-48 = "...Você ainda acha mesmo que pode me vencer de frente no mano a mano?"
33230-49 = "Não, eu não estou sozinha."
33230-51 = "Tsc, Sensei...!"
33230-52 = "Eu vou acabar com tudo. Com você e com esse adulto também!"
33230-53 = "Neste mundo onde tudo é em vão, conheça a verdade!!"
33230-58 = "[ns] \"Azusa, vamos.\""
33230-59 = "...Sim."
