[translation]
10015020-1 = "Эпизод 2;Хакеры «Миллениума»"
10015020-2 = ""
10015020-7 = "Хакерская комната Веритас"
10015020-8 = "Котама... Ты уже что-нибудь слышишь?"
10015020-9 = "Ничего. Продолжу сканировать диапазон частот."
10015020-10 = "Правда? Я думала, к этому моменту уже что-нибудь будет. Харэ, как там дрон?"
10015020-11 = "Выглядит так... будто ничего нет."
10015020-12 = "Может, там просто никого нет."
10015020-13 = "Не может быть. Надо ещё раз попробовать обойти прокси."
10015020-14 = ""
10015020-17 = ""
10015020-18 = ""
10015020-19 = "...Что здесь происходит?"
10015020-20 = "Как раз тот человек, который нам нужен! Мы взламываем систему наблюдения в исполнительном офисе «Семинара»."
10015020-21 = "...Почему?"
10015020-22 = "Харэ пошла купить ещё энергетиков, и угадай, кого она увидела? [USERNAME]-сенсея, который зашёл в офис вслед за Юкой!"
10015020-23 = "Мы немедленно выдвинули гипотезу, зачем студент и учитель поздно ночью заходят в комнату вдвоём."
10015020-24 = "Они наверняка делают что-то весёлое! ...То есть подозрительное!"
10015020-25 = "Мы, «Веритас», защитники истины и искатели знаний! Моим долгом было провести расследование."
10015020-26 = "Так что... поможешь нам взломать систему, Чихиро? Ну пожа-а-алуйста?"
10015020-27 = "*вздыхает*"
10015020-28 = "Ваша гипотеза неверна. Фестиваль Хало уже завтра. Вполне логично, что Сенсей пришёл в «Семинар»."
10015020-29 = "Не придумывай истории ради собственных хотелок, Маки."
10015020-30 = "Н-Но..."
10015020-31 = "Кроме того, сколько раз я вам говорила: осторожность и аккуратность. Я впечатлилась, когда вы нашли ключ, перебирая дампы, но при удалении логов вы оставили повсюду отпечатки."
10015020-32 = "Я уже час назад знала, что вы, безрассудные дети, атакуете сервер видеонаблюдения. Сигнализация сработала почти сразу после начала."
10015020-33 = "Да, это больше работы, но перед удалением логов нужно использовать логическую бомбу. Всё решают детали, Маки. Детали."
10015020-34 = "А, чёрт. Совсем забыла."
10015020-35 = "О боже... Уф! Я ещё и забыла, что серверы видеонаблюдения администрируешь именно ты!"
10015020-36 = "...Вообще-то я советник «Миллениума» по безопасности. Факт, который вы трое постоянно забываете."
10015020-37 = ""
10015020-39 = ""
10015020-40 = "Ладно, хватит. Урок вы усвоили. Вы разве не собираетесь на спортивный фестиваль?"
10015020-42 = "На этот Фестиваль Хало? Мы? Серьёзно?"
10015020-43 = "Я ни за что не стану участвовать в фестивале, который проводит «Семинар»! Хотя... можно было бы сходить и установить несколько жучков..."
10015020-44 = "Я не люблю физические нагрузки. Конец истории."
10015020-46 = "...Зря я вообще спросила."
10015020-47 = "Понимаю, всё это странно и со студсоветом у нас отношения не лучшие."
10015020-48 = "Но это не мероприятие «Семинара». Его проводят студенты для студентов, независимо от клуба или академии."
10015020-49 = "Неужели вы трое не можете хотя бы ради одного фестиваля оторваться от компьютеров и дронов? Подышать свежим воздухом?"
10015020-50 = ""
10015020-51 = "Как мило с твоей стороны. И я согласна! Фестиваль Хало предназначен абсолютно для всех."
10015020-53 = "[USERNAME]-сенсей? Ноа? К-как вы сюда прокрались?!"
10015020-55 = "Спасибо за тёплый приём. Похоже, моя репутация идёт впереди меня."
10015020-56 = ""
10015020-59 = ""
10015020-60 = "[ns] «Привет. Давненько не виделись.»"
10015020-61 = "Вот уж не ожидала увидеть вас двоих вместе."
10015020-62 = "И что здесь делает важная шишка из «Семинара»? Да ещё так поздно?"
10015020-63 = "Поздно ночью... наедине с Сенсеем..."
10015020-65 = "Обещаю, что бы ты там ни надумала — всё не так. Хи-хи."
10015020-66 = "И я не хочу мешать тому, чем вы тут занимаетесь. Я пришла попросить о помощи."
10015020-67 = "Ты? Просишь нас? О помощи?"
10015020-68 = "Как вы только что обсуждали, завтра начинается Фестиваль Хало в Кивотосе, который проводит ваша родная школа."
10015020-69 = "Хотя «Семинар» приложил все силы, чтобы мероприятие прошло с оглушительным успехом, предусмотреть абсолютно всё невозможно."
10015020-70 = "К сожалению, за последние часы до события случилась целая серия происшествий, и Юука совершенно вымоталась, разбираясь с ними."
10015020-72 = "Юука и правда работает как сумасшедшая, без остановки, постоянно..."
10015020-73 = "Серьёзно! Ей надо отдохнуть перед самим мероприятием!"
10015020-75 = "Полностью согласна. Поэтому вы мне и нужны. Пока Юука отдыхает, кто-то должен обработать и разослать последние данные, которые она сортировала."
10015020-76 = "Естественно, участницы «Веритас» подходят для этой работы лучше всех."
10015020-79 = "Хи-хи! Похоже, у неё всё-таки есть здравый смысл! В компьютерах лучше нас никого нет."
10015020-80 = "...Я ожидала чего-нибудь намного хуже."
10015020-81 = "То есть вы просто... передаёте нам данные? Ну хотя бы не придётся больше устанавливать радиомодули передачи в каждом здании."
10015020-82 = "[s] «Что вы вообще собирались делать...?»"
10015020-84 = "Не спрашивайте. Мы справимся, Ноа. Для нас это простая задача."
10015020-85 = "Но «Семинару» действительно нормально обращаться к нам за помощью?"
10015020-86 = "Я бы не хотела оказаться даже в ста метрах от президента Рио, если она узнает, что несанкционированный клуб вроде «Веритас» участвовал в подготовке ни к чему-нибудь, а к Фестивалю Хало."
10015020-87 = "Я тоже не хотела бы!"
10015020-88 = "Я прекрасно знаю, что президент Рио думает о президенте Химари. И наоборот."
10015020-89 = "Но давайте не будем всё усложнять политикой."
10015020-90 = "Считайте это просьбой лично от меня, Ноа. Не от «Семинара»."
10015020-91 = "Я бы никогда не стала заставлять вас сотрудничать с «Семинаром», но... неужели вам совсем-совсем не будет стыдно отказать отчаявшемуся студенту, которому нужна помощь?"
10015020-93 = ""
10015020-95 = ""
10015020-96 = "Ты умеешь надавить на жалость."
10015020-97 = "Не думаю, что президент Рио одобрит, но мои очаровательные подопечные лично ничего плохого не сделали. Не вижу причин, почему они не могут хоть как-то поучаствовать в фестивале."
10015020-98 = "Хи-хи. Спасибо, что вошла в положение."
10015020-99 = "Ну? Что за данные?"
10015020-100 = "Юука собрала всё в список. Посмотрите."
10015020-101 = ""
10015020-103 = ""
10015020-105 = "Так... Ей нужен только учёт текущего оборудования и... составить списки спортсменок для отправки школам."
10015020-106 = ""
10015020-110 = "Это должно быть относительно просто."
10015020-111 = "Я сделаю макрос, который обработает все данные разом и разложит их по количеству. Потом сверим с реальным наличием оборудования — и всё."
10015020-112 = "Хи-хи. Я знала, что вы идеально подходите для этой работы."
10015020-113 = ""
10015020-115 = ""
10015020-116 = ""
10015020-117 = "О, пока не забыла. Раньше меня кое-что беспокоило."
10015020-118 = ""
10015020-120 = ""
10015020-122 = ""
10015020-124 = "Я ненадолго отошла отдохнуть, и за это короткое время на сервер «Миллениума» совершили несколько вредоносных атак."
10015020-126 = "Правда? Каких атак?"
10015020-127 = "Они пытались подобрать пароли, перехватить пакеты и подделать данные... а ещё внедрить вирусы. Не волнуйтесь, попытки были совсем детские. Наш брандмауэр всё заблокировал."
10015020-128 = "Но меня насторожило, что все атаки были направлены на оборудование и объекты, необходимые для спортивного фестиваля. Это выглядело намеренно."
10015020-129 = "Ещё одно совпадение..."
10015020-130 = "Президент Инженерного отдела раньше упоминала что-то похожее."
10015020-131 = "Я никогда особенно не верила в совпадения."
10015020-132 = "Я провела обратную трассировку IP атакующего, и сигнал шёл из самой школы. Думаю, одна из студентов «Миллениума» пытается сорвать фестиваль."
10015020-133 = "О боже..."
10015020-134 = "Мы не знаем, что ещё может случиться этой ночью, так что будьте осторожны, Сенсей."
10015020-135 = "Ха-ха! Безопасность гостей — абсолютный приоритет «Семинара». Смешно даже думать, что с ними что-нибудь случится."
10015020-136 = "Я каждую секунду буду рядом с [USERNAME]-сенсеем, пока он здесь. Не волнуйся."
10015020-138 = "Тогда не буду. Береги Сенсея."
10015020-139 = "Хи-хи. Я не стану легкомысленно относиться к твоему доверию."
10015020-140 = "Что ж, до большого дня ещё многое нужно сделать! Спасибо, что взялись за это."
10015020-141 = ""
10015020-145 = "Ладно. Приступим."
10015020-146 = "Маки, пожалуйста, рассортируй списки спортсменок по дисциплинам, в которых они будут участвовать."
10015020-147 = "Уже готово! Смотри, какие аккуратные у меня таблицы!"
10015020-148 = "Вот этот файл."
10015020-149 = "Ты уже всё организовала? Я даже не видела, чтобы ты садилась за компьютер."
10015020-150 = "Я, эм, просто предвидела, что такое может случиться, поэтому на самом деле составила списки спортсменок ещё несколько дней назад... Да, именно поэтому."
10015020-152 = "Перевод: ей показалось забавной и редкой возможностью составлять списки студентов из разных школ."
10015020-153 = "Поэтому я прихватила кучу личных данных и ещё несколько забавных фактов о студентах каждой школы!"
10015020-154 = ""
10015020-156 = ""
10015020-157 = "...Иными словами, ты украла личные данные без разрешения администратора?"
10015020-158 = "Я надеялась, что до этого не дойдёт... Но вам троим снова нужен урок этики. Прямо сейчас."
10015020-159 = "Н-н-но ведь в итоге это оказалось очень полезно, да?"
10015020-160 = "Пожалуйста! Смилуйся! Хоть раз в жизни!"
10015020-161 = ""
10015020-163 = ""
