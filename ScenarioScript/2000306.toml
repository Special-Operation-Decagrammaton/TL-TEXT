[translation]
2000306-1 = "Испытание снайпера. Часть 2"
2000306-2 = "Крыша здания"
2000306-3 = "Сила — ключ к сегодняшней тренировке!"
2000306-4 = "Большинство удивляется, узнав, что снайперы занимаются силовыми тренировками. Люди думают, что мы только сидим и ждём цель."
2000306-5 = "Хотя мы и правда много сидим, нам также приходится постоянно подниматься и спускаться по лестницам в поисках идеальной позиции."
2000306-6 = "Сенсей, хотите попробовать подержать мою винтовку?"
2000306-7 = ""
2000306-8 = ""
2000306-10 = "[s] «О-она... тяжёлая.»"
2000306-11 = ""
2000306-12 = ""
2000306-13 = "Верно. Средняя снайперская винтовка весит больше двадцати килограммов."
2000306-14 = "Нужна исключительная физическая форма, чтобы бегать с ней вверх и вниз по лестницам."
2000306-15 = "Поэтому сегодня я поднимусь на тридцать этажей за пять минут!"
2000306-16 = "Винтовку понесу я. Не могли бы вы нести боеприпасы и следовать за мной?"
2000306-17 = "[s] «П-подожди секунду...»"
2000306-18 = "Сейчас не время лениться!"
2000306-20 = "После этого я тренировался с Маширо, пока колени едва не начали подкашиваться."
