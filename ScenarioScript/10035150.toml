10035150-10 = "Давайте так повеселимся здесь, чтобы даже не вспомнить о пляже."
10035150-11 = "Просто расслабьтесь и наслаждайтесь летом, как мы все заслужили!"
10035150-12 = ""
10035150-14 = ""
10035150-16 = "Ох, капитан..."
10035150-17 = "Ради нас...?"
10035150-19 = "Ради вас и... ну, ради меня тоже. Я люблю аквапарки."
10035150-20 = "В любом случае! Давайте уже купим билеты!"
10035150-22 = ""
10035150-23 = "Есть, капитан!"
10035150-24 = ""
10035150-30 = ""
10035150-31 = "Добро пожаловать. Сколько вас будет?"
