10035150-59 = ""
10035150-61 = ""
10035150-63 = ""
10035150-64 = "*вздыхает*"
10035150-65 = "Сколько у вас денег?"
10035150-66 = "Хм, всего у нас..."
10035150-67 = ""
10035150-69 = ""
10035150-70 = "...1500 иен."
10035150-71 = "Можете пустить нас по 500 с человека?"
10035150-73 = "О нет, простите, но это все доступные скидки."
10035150-74 = ""
10035150-76 = ""
10035150-77 = "Следующий посетитель, пожалуйста!"
10035150-78 = "Погодите, погодите, погодите!"
