[translation]
10035150-1 = "Послесловие;Тайный отпуск Комакадзэ Рабу 2"
10035150-3 = ""
10035150-4 = "В-Вы привели нас в аквапарк?"
10035150-5 = "Похоже, прямо в день открытия. Это и есть то, что вы имели в виду под «будем пользоваться купальником»?"
