10035150-84 = "Нельзя ли войти в наше положение?"
10035150-85 = "А! А если мы поработаем для вас и так заплатим?"
10035150-86 = "Ну, это против правил, но..."
10035150-87 = ""
10035150-89 = ""
10035150-90 = "Я знаю, что в одном отделе не хватает сотрудников. Сейчас быстро позвоню."
