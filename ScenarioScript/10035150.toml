10035150-93 = "Что бы это ни было, мы отлично справимся!"
10035150-101 = "Значит, сегодня мы уборщики бассейнов. Довольно просто."
10035150-102 = "Не то чтобы мне НРАВИЛОСЬ тереть плитку крошечной щёточкой, но..."
10035150-103 = "...бывают и такие дни."
10035150-104 = ""
10035150-109 = "Капитан, здесь всё готово!"
