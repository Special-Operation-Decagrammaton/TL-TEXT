[translation]
12040-1 = "Эпизод 4;У каждого своя история 1"
12040-2 = "Главные ворота школы Абидос"
12040-3 = ""
12040-4 = ""
12040-5 = "О, Сенсей!"
12040-6 = "Ты и правда рано! До начала собрания ещё куча времени."
12040-7 = "[s] «Ты тоже рано, Нономи.»"
12040-8 = "Ага! Я пришла пораньше прибраться. Просто не могла сидеть без дела..."
12040-9 = "Как хозяин?"
12040-10 = "[s] «...Со здоровьем вроде всё нормально.»"
12040-11 = "О, рада слышать! ☆"
12040-12 = "Я подумала, ему будет тяжеловато, если мы всей толпой придём в больницу, поэтому не пошла с остальными."
12040-13 = "Позже схожу вместе с Широко и Хошино."
12040-14 = "Но когда ты говоришь «со здоровьем всё нормально»..."
12040-15 = "...значит, есть другая проблема?"
12040-16 = "[s] «Ты очень проницательная, Нономи.»"
12040-17 = "Ахаха... Назовём это интуицией."
12040-18 = "Ты ушёл с Серикой и Аяне, а вернулся один, поэтому я подумала, что что-то случилось..."
12040-19 = "Ладно, расскажешь, когда все соберутся. Если это важно, знать должны все."
12040-20 = "[s] «Хорошо.»"
12040-21 = "..."
12040-22 = "С тех пор как ты пришёл, многое изменилось..."
12040-23 = "У нас впервые появился советник, и мы смогли отбиться от банд, которые постоянно нас донимали..."
12040-24 = "Мы достали нужные припасы и решили множество проблем..."
12040-25 = "...Но кажется, теперь проблем впереди даже больше, чем раньше."
12040-26 = "Банда шлемов... Решатели проблем 68... Префектурная команда... корпорация Кайзер..."
12040-27 = "Интересно, что ещё нас ждёт..."
12040-28 = "..."
12040-29 = "Как думаешь... Целевая группа по взысканию долгов сможет продолжить идти вперёд?"
12040-30 = "[s1] «Да.»\n[s2] «Конечно.»"
12040-31 = "Ага-ага! Раз ты так говоришь, значит всё обязательно получится."
12040-32 = "Ага-ага! Раз ты так говоришь, значит всё обязательно получится."
12040-35 = "Привет, Нономи. Сенсей."
12040-36 = "О, Широко, ты тоже рано."
12040-37 = "...А Хошино где?"
12040-38 = "Хошино? Она уже здесь. Наверное, опять где-нибудь в школе дремлет..."
12040-39 = "Эм, ладно."
12040-40 = "..."
12040-41 = "...Сенсей, как хозяин?"
12040-42 = "[s] «Хозяин...»"
12040-43 = "Ага-ага! Сенсей сказал, что с хозяином всё хорошо! ☆"
12040-44 = "Но, похоже, случилось что-то ещё, поэтому надо всем собраться и обсудить."
12040-45 = "...Хорошо, поняла."
12040-46 = ""
12040-47 = "Тогда я пойду первой."
12040-48 = ""
12040-49 = "Почему-то Широко кажется..."
12040-50 = "[s] «Какой-то не такой, да?»"
12040-51 = "П-Правда? У меня тоже было такое ощущение..."
12040-52 = "Она почему-то выглядела нервной..."
12040-53 = "Хм, надеюсь, мне просто показалось..."
12040-54 = "[s] «Пойдём проверим.»"
12040-55 = "Да, хорошо!"
12040-57 = "*бах*"
12040-58 = "*грохот*"
12040-59 = "Ай... Больно, Широко."
12040-60 = "Не делай вид, будто ничего не знаешь."
