[translation]
12040-1 = "Episódio 4;A História de Cada Uma (1)"
12040-2 = "Abydos — Em frente ao portão"
12040-5 = "Ué, Sensei?"
12040-6 = "Chegou mais cedo do que eu esperava☆"
12040-7 = "[s] \"Você também, Nonomi.\""
12040-8 = "Sim, estava dando uma limpadinha. Eu também não conseguia ficar parada sem fazer nada..."
12040-9 = "O Mestre Shiba está bem...?"
12040-10 = "[s] \"...Pelo menos fisicamente, parece que ele está bem.\""
12040-11 = "...É mesmo? Que alívio☆"
12040-12 = "Eu bem que queria ver com meus próprios olhos se ele estava bem, mas não podíamos invadir o quarto em um grupo tão grande..."
12040-13 = "Quando tudo se acalmar, vou lá visitá-lo junto com a Shiroko-chan e a Hoshino-senpai."
12040-14 = "Mas, dizendo \"pelo menos fisicamente\"..."
12040-15 = "Quer dizer que houve algum problema em outro sentido...?"
12040-16 = "[s] \"...Não dá mesmo para esconder nada de você, Nonomi.\""
12040-17 = "Ahaha... Foi só uma impressão minha."
12040-18 = "Você deveria estar com a Serika-chan e a Ayane-chan, mas voltou sozinho... Então imaginei que houvesse algum motivo."
12040-19 = "...Fico curiosa, mas agora não é a hora. Vou ficar feliz se puder nos contar depois, quando todas estiverem reunidas."
12040-20 = "[s] \"Sim, conversamos na hora.\""
12040-21 = "..."
12040-22 = "Nem faz tanto tempo assim... Mas, parando para pensar, desde que você chegou, Sensei, tanta coisa mudou de repente."
12040-23 = "Claro, aconteceram muitas coisas boas e felizes. Pela primeira vez tivemos um Sensei conselheiro, conseguimos expulsar a Gangue dos Capacetes..."
12040-24 = "Conseguimos garantir suprimentos e superar vários problemas. Mesmo assim..."
12040-25 = "Um obstáculo atrás do outro continua surgindo no nosso caminho..."
12040-26 = "A Gangue dos Capacetes, a Faz-Tudo 68, o Comitê Disciplinar... e ainda a Kaiser Corporation..."
12040-27 = "O que será que vem pela frente agora...?"
12040-28 = "..."
12040-29 = "Desculpe, acabei trazendo um assunto pesado. Mesmo assim, não temos escolha a não ser seguir em frente por Abydos... E você vai continuar conosco, não vai, Sensei?"
12040-30 = "[s1] \"Com certeza.\"\n[s2] \"Claro que sim.\""
12040-31 = "Muito obrigada! Ouvir isso de você, Sensei, me deixa muito mais tranquila."
12040-32 = "Muito obrigada! Ouvir isso de você, Sensei, me deixa muito mais tranquila."
12040-35 = "Nonomi, Sensei."
12040-36 = "Ah, Shiroko-chan, você também chegou cedo?"
12040-37 = "Nn... Cadê a Hoshino-senpai?"
12040-38 = "A Hoshino-senpai provavelmente está tirando uma soneca em algum canto da escola de novo..."
12040-39 = "...Entendi."
12040-40 = "..."
12040-41 = "...Sensei, como está o Mestre Shiba?"
12040-42 = "[s] \"O Mestre Shiba está...\""
12040-43 = "Pelo que parece, fisicamente ele está bem☆"
12040-44 = "...Só que parece que há outras questões além disso. Quando todas se reunirem, vamos ouvir os detalhes direitinho."
12040-45 = "...Nn, certo."
12040-47 = "Então, vou entrando na frente."
12040-49 = "...? A Shiroko-chan não está meio..."
12040-50 = "[s] \"...Um pouco estranha, talvez?\""
12040-51 = "Você também achou, Sensei?"
12040-52 = "Não sei bem, ela pareceu meio inquieta, ou talvez apressada..."
12040-53 = "Espero que seja só impressão minha..."
12040-54 = "[s] \"...Vamos entrar também.\""
12040-55 = "S-Sim!"
12040-57 = "(Bum!)"
12040-58 = "(Bam!)"
12040-59 = "Aiai... Isso dói, viu~ O que deu em você, Shiroko-chan?"
12040-60 = "...Até quando vai continuar se fazendo de desentendida?"
12040-61 = "!!?"
12040-62 = "Que barulho foi esse...?!"
12040-65 = "[ns] Entrar na sala de onde veio o barulho."
12040-68 = "Uhee~, o velhote aqui não faz a mínima ideia do que você está falando~...?"
12040-69 = "..."
12040-70 = "...Não minta."
12040-71 = "Não estou mentindo~... Hm?"
12040-73 = "Hoshino-senpai! Shiroko-chan?! O que aconteceu?!"
12040-74 = "[s] \"...O que houve?\""
12040-75 = "Nn, é que..."
12040-76 = "O que foi que aconteceu aqui...?"
12040-77 = "...Preciso falar com a Hoshino-senpai."
12040-78 = "..."
12040-79 = "...Desculpem, mas deixem a gente a sós."
12040-80 = "Hmm, isso eu não posso permitir☆"
12040-81 = "..."
12040-82 = "No Comitê de Contramedidas, coisas como \"segredinhos só entre nós duas♡\" não são permitidas. Afinal de contas, estamos todas no mesmo barco."
12040-83 = "...Mas,"
12040-84 = "Por isso, garotas más que não explicam a situação direitinho..."
12040-87 = "Vão levar um castigo☆, viu?"
12040-89 = "U-Uhm..."
12040-90 = "...Bom, é que..."
12040-91 = "...Na verdade, o velhote aqui foi pego tirando uma soneca escondida~."
12040-92 = "Essa minha preguiça não é de hoje, mas acho que o velhote aqui andou dormindo um pouquinho demais ultimamente. Enfim, levei uma bronquinha por causa disso~."
12040-93 = "A-Ah, nn..."
12040-94 = "Mesmo assim, não precisava ficar tão brava~. A Shiroko-chan leva tudo tão a sério."
12040-95 = "Bom, todo mundo tem dias assim~. Já está quase na hora de nos reunirmos, vamos indo?"
12040-97 = "..."
12040-98 = "Nn..."
12040-101 = "..."
12040-102 = "[s] \"Tudo bem, Nonomi?\""
12040-103 = "Sim, estou bem. ...Parece que há algo que elas não querem contar."
12040-104 = "...Ufa."
12040-105 = "Não tem jeito. Todo mundo tem um ou dois segredos que prefere não contar..."
12040-106 = "Vamos indo também, Sensei? As outras já devem estar voltando."
12040-109 = "Sala do Comitê de Contramedidas"
12040-110 = "Uhee~..."
12040-111 = "..."
12040-112 = "..."
12040-113 = "[s] (Que climão...)"
12040-118 = "Pessoal, é grave!! Olhem isso!"
12040-119 = "Trouxemos os documentos referentes ao Distrito Autônomo de Abydos! Olhem só..."
12040-120 = "...?"
12040-121 = "...Ué?"
12040-122 = "..."
12040-123 = "..."
12040-124 = "...Q-Que clima é esse?"
12040-125 = "Aconteceu alguma coisa...?"
12040-126 = "[s] \"Por enquanto está tudo bem. Bem-vindas de volta, vocês duas.\""
12040-127 = "...Ah, estamos de volta? N-Não, esqueçam isso!"
12040-128 = "Descobrimos uma coisa absurda!"
12040-129 = "Sim, é um fato chocante...! Pessoal, primeiro deem uma olhada nisso!"
12040-131 = "(Folheia)"
12040-134 = "Hm~, isso aqui é... um mapa?"
12040-135 = "É o registro de terras do Distrito Autônomo de Abydos com as transações mais recentes... O que chamam de \"mapa cadastral\"."
12040-136 = "Um documento onde dá para verificar o proprietário dos terrenos, certo...?"
12040-137 = "Mas nem precisamos de documento para saber que as terras de Abydos pertencem ao Colégio Abydos..."
12040-138 = "Eu também achava isso até agora há pouco! Mas não é bem assim!"
12040-139 = "Quando fomos visitar o Mestre Shiba de manhã, ele nos contou."
12040-140 = "Não só o prédio onde fica o Lámen Shibasaki, mas quase todo o Distrito Autônomo de Abydos..."
12040-141 = "...Não está mais registrado como propriedade da nossa escola."
12040-142 = "O quê...?!"
12040-143 = "...Como assim? O Distrito Autônomo de Abydos não pertence a Abydos? Não pode ser..."
12040-145 = "(Folheia)"
12040-146 = "...Isso aqui..."
12040-147 = "O proprietário atual é..."
12040-148 = "Kaiser Construction... É o que está escrito aqui."
12040-149 = "...!!"
12040-150 = "Não pode ser...?!"
12040-151 = "...?!"
12040-153 = "Próximo;A História de Cada Uma (2)"
