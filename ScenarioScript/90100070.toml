[translation]
90100070-1 = "Episódio 7;Vulto na Rodovia"
90100070-2 = "3º Distrito Comercial, Zona 2"
90100070-4 = ""
90100070-5 = "Aqui é a FOX3. Estou interrogando o pessoal na Zona 2 do 3º Distrito Comercial, onde a primeira vítima foi encontrada."
90100070-6 = "A vítima era do setor comercial de uma farmacêutica daqui perto, e pelo visto costumava andar por esses lados até em pleno meio-dia."
90100070-7 = "Só que, tirando o reflexo cegante nos vidros dos prédios, não achei nada que pudesse ser confundido com um espantalho branco."
90100070-8 = ""
90100070-11 = "Área Restrita Classe A · Canteiro de Demolição"
90100070-12 = ""
90100070-13 = "Aqui é a FOX4. Vasculhando o canteiro de demolição na área restrita classe A, onde acharam a terceira vítima."
90100070-14 = "A vítima era operária da obra e vivia trampando no meio do descampado sem um pingo de sombra."
90100070-15 = "*Cof, cof*... quanta poeira, caramba. Não dá pra ver nem coisa branca, quanto mais um espantalho. #nFora o calor dos infernos, tudo normal por aqui."
90100070-16 = ""
90100070-19 = "Mercado Externo de Getsuten"
90100070-20 = ""
90100070-21 = "Aqui é a FOX2. Fazendo perguntas no mercado externo de Getsuten. #nFoi onde encontraram a sexta vítima."
90100070-22 = "Disseram que a vítima era dona de uma barraca aqui, mas... #nSerá por causa do calorão? Tá quase tudo fechado, mal cruzei com alguém."
90100070-23 = "Hmm... Será que não confundiram algum turista de roupa branca com um espantalho?"
90100070-24 = "De resto, nada fora do comum."
90100070-26 = "Rodovia KV, Rota 35"
90100070-27 = ""
90100070-28 = "Aqui é a FOX1. Em patrulha pela Rota 35 da Rodovia KV."
90100070-29 = "A nona vítima era uma mecânica da Administração de Trânsito do D.U. e sofreu o acidente durante uma inspeção de rotina."
90100070-30 = "Vistoriei minuciosamente até debaixo da ponte onde ela foi encontrada, mas..."
90100070-31 = ""
90100070-33 = ""
90100070-34 = "Ainda não é o suficiente."
90100070-35 = ""
90100070-37 = ""
90100070-38 = ""
90100070-39 = "O que não é suficiente? Água? Quer que eu busque mais?"
90100070-40 = "Acho que ela quer dizer pistas concretas pra identificar esse tal de espantalho branco."
90100070-41 = "Não me diga que você tá pensando em recomeçar do zero, tá...?"
90100070-42 = "Contudo..."
90100070-43 = ""
90100070-46 = "[ns1] \"Olá, entregas Schale EATS chegando!\"\n[ns2] \"Trouxe água geladinha e energético pra vocês!\""
90100070-49 = "Ah, Sensei..."
90100070-50 = "Tudo isso...? Muito obrigada. Não estava pesado? #nNão precisava se dar ao trabalho de nos acompanhar em todas as buscas..."
90100070-51 = "[s3] \"Achei que estivesse demorando mais do que o previsto.\"\n[s4] \"Aconteceu algum problema...?\""
90100070-54 = "Nenhum imprevisto grave. #nPorém, ainda nos faltam evidências que corroborem os depoimentos das vítimas..."
90100070-55 = "Pelo visto teremos que expandir o perímetro de busca e refazer as perguntas."
90100070-56 = ""
90100070-58 = ""
90100070-59 = "Ai, não..."
90100070-60 = ""
90100070-61 = "[ns5] \"Com esse calorão todo, não dá pra deixar pra depois?\"\n[ns6] \"Pelo menos esperar o sol baixar um pouco pra continuar...?\""
90100070-64 = "Isso... seria inviável."
90100070-65 = "Evidências de campo mudam de aspecto não apenas conforme o local, mas também com o horário e o clima."
90100070-66 = "Todas as vítimas foram encontradas sob o sol a pino do meio-dia. #nInvestigar após o pôr do sol não traria resultados úteis."
90100070-67 = "Faz sentido pra coletar provas, mas... #nNão seria bom levar o preparo físico do esquadrão em conta?"
90100070-68 = "Já faz dias que estamos debaixo desse sol escaldante. Todo mundo deve estar à beira do esgotamento."
90100070-69 = ""
90100070-71 = ""
90100070-72 = "...Não há outra saída."
90100070-73 = "Descancem por aqui nos arredores. Eu mesma farei a próxima rodada de perguntas sozinha—"
90100070-74 = "Francamente..."
90100070-75 = "Lá vem você de novo com essa mesma mania feia."
90100070-76 = "Yukino, você acha mesmo que a gente ia conseguir descansar de boa ouvindo isso? #nOu acha que somos do tipo de soldado que cruza os braços e vê a comandante se matar de trabalhar?"
90100070-77 = "N-não foi isso que eu quis dizer..."
90100070-78 = "[ns7] \"Não tem prazo limite rígido nem nada...\"\n[ns8] \"Que tal relaxar os ombros só um pouquinho?\""
90100070-81 = "Mas... enquanto estamos paradas aqui, outra vítima pode surgir."
90100070-82 = "Se outro civil se ferir por negligência minha... outra vez..."
90100070-83 = "Eu preciso agir mais rápido e assumir a responsabilidade antes que isso aconteça—"
90100070-84 = ""
90100070-86 = ""
90100070-87 = ""
90100070-88 = ""
90100070-89 = ""
90100070-90 = "Peraí. Tem um alvo não identificado se aproximando da direção do viaduto da rodovia."
90100070-91 = "Pelo jeito de se mover e pela velocidade... parece alguém correndo?"
90100070-92 = "Uma pessoa no meio da rodovia? #nTem alguma equipe de manutenção escalada hoje?"
90100070-93 = "Não, não consta nada no cronograma da concessionária."
90100070-94 = "Será que... é o tal \"espantalho branco\"...?"
90100070-95 = "Vamos atrás dele antes que suma de vista. Rápido!"
90100070-96 = ""
90100070-101 = ""
90100070-102 = ""
90100070-103 = "O alvo não identificado... é aquela aluna correndo ali?"
90100070-104 = "Com licen—"
90100070-107 = ""
90100070-108 = "Ué? O que tem gente fazendo num lugar desses...?"
90100070-109 = "Vocês precisam de ajuda com alguma coisa?"
90100070-110 = "Ei, ei, quem parece que precisa de ajuda é você, sabia?"
90100070-111 = "A passagem de pedestres é proibida daqui pra frente. Dê meia-volta."
90100070-112 = "Pra começo de conversa, nem devia ter entrado na rodovia! O que deu na sua cabeça pra vir aqui?"
90100070-113 = "Ora, é óbvio..."
90100070-114 = ""
90100070-116 = ""
90100070-117 = "Treinamento prático de pista!"
90100070-118 = "[s] \"Ué? Esse uniforme... você é da Academia Aliada Hyakkiyako...?\""
90100070-119 = "...Sensei da [USERNAME]?!"
90100070-120 = "Sim! Eu sou Asakusa Natsuki, do Clube de Riquixá da Academia Aliada Hyakkiyako! #nQuanto tempo desde o festival!"
90100070-121 = "Se quiser... não gostaria de uma carona?"
90100070-122 = "Levo você pra qualquer canto do D.U. agora mesmo, e sai bem mais em conta que táxi!"
90100070-123 = "[s9] \"Não, riquixá agora não precisa.\"\n[s10] \"Na verdade, queríamos te perguntar uma coisa...\""
90100070-127 = "Deixa eu ver se entendi... você tava treinando puxar riquixá na rodovia só porque talvez apareça algum cliente querendo ir além do distrito?"
90100070-128 = "Exatamente! Nosso lema é levar o cliente ao destino pela rota mais rápida e prática!"
90100070-129 = "Se eu não conhecer a geografia e acabar dando voltas à toa, vou perder a confiança dos meus passageiros."
90100070-130 = "Pois é... entendo bem. Quando o motorista pega uma rua esquisita do nada, bate aquele medo de estarem me enrolando pra cobrar mais na corrida."
90100070-131 = "Não bota táxi no mesmo saco que riquixá, tá legal?!"
90100070-132 = "Natsuki, né? #nAqui nas rodovias do D.U. é expressamente proibido circular de riquixá. #nEntão seria melhor você traçar outro caminho."
90100070-133 = "Ué, é sério isso?!"
90100070-134 = "Aaai... mal baixaram uma portaria proibindo em Hyakkiyako e agora descubro que no D.U. também é proibido?"
90100070-135 = "Antes de qualquer portaria, saber que riquixá numa rodovia expressa é suicídio devia ser bom senso..."
90100070-136 = "Aliás, como é que você inventa de correr com um tempo desses? #nAté o povo dos clubes de atletismo ia passar mal depois de meia hora nesse mormaço."
90100070-137 = "Tá meio quente, sim... mas tá tranquilo! Eu tô mais que acostumada!"
90100070-138 = "O asfalto reflete muito calor mesmo, mas correr no calorão é minha especialidade."
90100070-139 = "Comparado com o pico do verão lá em Hyakkiyako, isso aqui tá até fresquinho!"
90100070-140 = "[s11] \"Mesmo assim, toma cuidado com a insolação.\"\n[s12] \"Toma, bebe uma garrafa. Tá bem geladinha.\""
90100070-143 = "N-nossa... muito obrigada!"
90100070-144 = "Quem diria que eu ganharia uma bebida geladinha do Sensei de Schale num lugar desses... #nHoje é meu dia de sorte!"
90100070-145 = ""
90100070-147 = ""
90100070-148 = ""
90100070-149 = "Já que você costuma correr por pistas quentes o tempo todo, gostaria de lhe fazer uma pergunta."
90100070-150 = "Você já viu algo parecido com um \"espantalho branco\"?"
90100070-151 = "Espantalho branco...? É isso?"
90100070-152 = "Pelo que soubemos, todo mundo que olha diretamente pra ele desmaia e entra em convulsão..."
90100070-153 = "...Vocês por acaso tão falando do \"Kunekune\"?"
90100070-154 = "Kunekune...?"
90100070-155 = "Ah, mas é que ele costuma ser visto nos arrozais do interior. Quase nunca ouvi falar de relatos aqui na cidade grande cheia de prédios..."
90100070-156 = "Qualquer detalhe serve. O que é exatamente esse \"Kunekune\"?"
90100070-157 = "O Kunekune é uma lenda urbana bem famosa lá em Hyakkiyako. #nQuer dizer, começou a ficar famosa como história de terror faz pouco tempo."
90100070-158 = "Diferente de outras assombrações que aparecem em lugares escuros e úmidos, #ndizem que ele aparece em dias bem limpos e ensolarados, no meio de descampados com vista aberta."
90100070-159 = "De longe, parece um espantalho branco dançando e se contorcendo, #nmas ninguém sabe ao certo se é um humano ou um boneco. Isso porque..."
90100070-160 = "Quem chega perto pra ver o que é de verdade... enlouquece na hora... #ne acaba ficando igualzinho a ele."
90100070-161 = "Fica com um sorriso bizarro na cara, se contorcendo e rebolando sem parar..."
90100070-162 = "Eca... que coisa bizarra e assustadora."
90100070-163 = "Bom, não passa de uma história de terror de assombração, né. #nQuase ninguém em Hyakkiyako leva isso a sério de verdade. #nCom exceção de quem puxa riquixá que nem a gente, claro."
90100070-164 = "Ué? Quer dizer que você acredita, Natsuki?"
90100070-165 = "Não é bem que eu acredite na história de fantasma... é mais que eu entendo por que ela surgiu."
90100070-167 = "Sabe quando a gente anda no asfalto pelando e o ar quente começa a tremular... #ne sobe aquela miragem que parece uma fumaça branca se contorcendo?"
90100070-168 = "Num dia desses, se você forçar a barra puxando riquixá, vai direto pro hospital com insolação braba."
90100070-169 = "Por isso, o conselho de \"dar meia-volta assim que vir o espantalho branco se contorcendo no horizonte\"... #nna verdade é um conselho bem prático de sobrevivência."
90100070-171 = ""
90100070-172 = "Miragem do calor..."
90100070-173 = "...Entendo. Uma miragem térmica."
90100070-174 = "Você nos ajudou imensamente. Foi uma pista valiosa."
90100070-175 = "A-ah é...? Fico feliz em ajudar... eu acho?"
90100070-176 = ""
90100070-178 = ""
90100070-179 = ""
90100070-180 = "Sensei da [USERNAME]. Encerraremos a operação de campo por hoje e retornaremos ao QG."
90100070-181 = "[s] \"Entendido. Vamos voltar.\""
90100070-182 = ""
90100070-184 = ""
90100070-185 = ""
90100070-186 = "[ns] \"Toma cuidado com o sol no caminho de volta, Natsuki~\""
90100070-187 = "Pode deixar, vão com cuidado vocês também...!"
90100070-188 = ""
90100070-193 = ""
90100070-194 = "Mas pensando bem... aquelas garotas de uniforme de marinheiro... não me são estranhas..."
90100070-195 = "Será que já foram fazer excursão escolar lá em Hyakkiyako?"
90100070-197 = "A Seguir;Do Outro Lado da Miragem"
