[translation]
90100070-1 = "Эпизод 7;Ровно в полдень и восставший из мёртвых"
90100070-2 = "Деловой район 3, зона 2"
90100070-4 = ""
90100070-5 = "FOX 3 на связи. Сейчас обследую деловой район 3, зону 2. Здесь нашли первую пострадавшую."
90100070-6 = "Она работала торговым представителем в соседней фармацевтической компании. Это объясняет, почему она оказалась здесь посреди дня."
90100070-7 = "Кроме бликов от нескольких стеклянных зданий, я не вижу ничего, что можно было бы принять за белое пугало."
90100070-8 = ""
90100070-11 = "Площадка сноса в закрытой зоне класса A"
90100070-12 = ""
90100070-13 = "Говорит FOX 4. Сейчас обследую площадку сноса в закрытой зоне класса A. Здесь нашли третью пострадавшую."
90100070-14 = "Она работала на стройке и, похоже, часто находилась на открытых участках без тени."
90100070-15 = "Вся площадка покрыта пылью. Не вижу ничего белого, не говоря уже о чём-то похожем на пугало. Никаких аномалий, кроме совершенно безумной жары. Конец связи."
90100070-16 = ""
90100070-19 = "Внешний рынок Цукитэн"
90100070-20 = ""
90100070-21 = "FOX 2 на месте. Сейчас собираю данные на внешнем рынке Цукитэн. Здесь нашли шестую пострадавшую."
90100070-22 = "Она была продавцом в одном из уличных киосков. В день происшествия соседние лавки были закрыты, вероятно, из-за жары."
90100070-23 = "Хм... Может, она приняла туриста в белой одежде за пугало?"
90100070-24 = "Кроме этого предположения, здесь тоже ничего примечательного."
90100070-26 = "Шоссе KV, дорога 35"
90100070-27 = ""
90100070-28 = "FOX 1, докладываю. Сейчас обследую дорогу 35 шоссе KV, где нашли девятую пострадавшую."
90100070-29 = "Она была инженером дорожного управления D.U. Её «инцидент» произошёл во время осмотра моста."
90100070-30 = "Я тщательно проверила территорию под мостом, где нашли пострадавшую..."
90100070-31 = ""
90100070-33 = ""
90100070-34 = "...Всё равно недостаточно."
90100070-35 = ""
90100070-37 = ""
90100070-38 = ""
90100070-39 = "Ч-Чего «недостаточно»? Ты устала? Тебе принести попить?"
90100070-40 = "Наверное, она имеет в виду, что у нас недостаточно улик, чтобы определить, что такое белое пугало."
90100070-41 = "Только не говори, что нам придётся заново проверять вообще всё..."
90100070-42 = "Но—"
90100070-43 = ""
90100070-46 = "[ns1] «Здравствуйте, это Шале EATS!»\n[ns2] «Я принёс холодную воду и энергетики!»"
90100070-49 = "А, Сенсей..."
90100070-50 = "Вы проделали весь путь сюда только чтобы принести нам напитки? Не стоило."
90100070-51 = "[s3] «Похоже, это затягивается.»\n[s4] «Возникла проблема...?»"
90100070-54 = "Ничего серьёзного. Нам просто не хватает доказательств. Мы не можем подтвердить показания пострадавших."
90100070-55 = "Придётся расширить зону расследования."
90100070-56 = ""
90100070-58 = ""
90100070-59 = "Угх..."
90100070-60 = ""
90100070-61 = "[ns5] «Сейчас же невыносимо жарко. Нельзя сделать это позже?»\n[ns6] «Хотя бы после захода солнца...»"
90100070-64 = "Это... будет проблематично."
90100070-65 = "Доказательства на месте зависят не только от точного местоположения, но и от конкретных погодных условий."
90100070-66 = "Всех пострадавших находили посреди дня под сильными прямыми солнечными лучами. Работать ночью бессмысленно."
90100070-67 = "Я согласна, но можем ли мы всё-таки учитывать состояние членов отряда?"
90100070-68 = "Все вымотаны. Мы уже несколько дней работаем под солнцем."
90100070-69 = ""
90100070-71 = ""
90100070-72 = "...Хорошо."
90100070-73 = "Отряд, отдыхайте и восстанавливайтесь поблизости. Следующее обследование я проведу одна."
90100070-74 = "*вздыхает*"
90100070-75 = "Старые привычки не умирают."
90100070-76 = "Юкино, серьёзно? Думаешь, мы сможем спокойно закинуть ноги и отдыхать, пока ты работаешь одна? За кого ты нас принимаешь, за бессердечных товарищей?"
90100070-77 = "Я-я не хотела заставлять вас чувствовать вину."
90100070-78 = "[ns7] «У вас ведь нет жёсткого срока...»\n[ns8] «Почему бы не проходить эту миссию не спеша?»"
90100070-81 = "Но... а если кто-то вот-вот пострадает? Если появится ещё одна жертва?"
90100070-82 = "Если из-за моей халатности пострадает ещё один мирный житель..."
90100070-83 = "Если я не смогу достаточно быстро действовать и взять ответственность на себя..."
90100070-84 = ""
90100070-86 = ""
90100070-87 = ""
90100070-88 = ""
90100070-89 = ""
90100070-90 = "Стоп. Приближается неизвестный объект. Движется со стороны развязки путепровода."
90100070-91 = "Судя по движению и скорости цели... Это может быть человек."
90100070-92 = "Кто-то бежит по этому длинному путепроводу? Дорожное управление проводит работы?"
90100070-93 = "По графику — нет..."
90100070-94 = "Тогда, может, это наше «белое пугало»...?"
90100070-95 = "Сближаемся."
90100070-96 = ""
90100070-101 = ""
90100070-102 = ""
90100070-103 = "Студент? Думаете, она...?"
90100070-104 = "Эм, простите..."
90100070-107 = ""
90100070-108 = "О, здесь кто-то есть?"
90100070-109 = "Вам нужна помощь?"
90100070-110 = "Нет-нет-нет. По-моему, помощь нужна как раз тебе."
90100070-111 = "Пешеходам здесь находиться запрещено. Ради вашей безопасности рекомендуем выбрать другой маршрут."
90100070-112 = "Что ты вообще делаешь на путепроводе в такую погоду? Это опасно!"
90100070-113 = "Что значит «что»? Очевидно же, я..."
90100070-114 = ""
90100070-116 = ""
90100070-117 = "...посреди дорожной тренировки!"
90100070-118 = "[s] «Разве эта одежда не из Хяккияко...?»"
90100070-119 = "Постойте, [USERNAME] Сенсей?"
90100070-120 = "Ага! Это я! Асакуса Нацуки из Клуба рикш! Давненько не виделись! Вы пропустили несколько фестивалей!"
90100070-121 = "Если вас не пугает тряска... Хотите прокатиться на рикше?"
90100070-122 = "Я довезу вас куда угодно в D.U. намного дешевле такси."
90100070-123 = "[s9] «Р-Рикши — это здорово.»\n[s10] «Но сейчас я хотел спросить...»"
90100070-127 = "То есть... ты тренируешься тянуть рикшу по шоссе, потому что хочешь расширить сеть маршрутов? Хочешь возить людей ЗА ПРЕДЕЛЫ района?"
90100070-128 = "Именно! Я должна знать, как доставить клиента туда, куда ему нужно. А для этого приходится выходить сюда и искать самые быстрые маршруты."
90100070-129 = "Если всегда держаться официальных дорог, можно потерять доверие клиента. Или, что ещё хуже, заблудиться!"
90100070-130 = "Хм... Ну да. Я всегда нервничаю, когда водитель такси внезапно сворачивает с маршрута. Иногда кажется, что он просто накручивает счётчик."
90100070-131 = "Такси — это НЕ рикша!"
90100070-132 = "Нацуки? Не хочу тебя расстраивать, но рикши запрещены на шоссе D.U. Боюсь, придётся выбрать другой маршрут."
90100070-133 = "Э, правда?"
90100070-134 = "Ух... В Хяккияко их тоже запретили. Я думала, в D.U. всё будет иначе, понимаете?"
90100070-135 = "Даже если забыть о запретах, можно было бы включить здравый смысл. Как рикша вообще должна вливаться в поток на шоссе?"
90100070-136 = "Меня больше удивляет, что ты вообще ЗДЕСЬ и тащишь ТАКОЙ ГРУЗ в такую жару. Даже спортсмены не выдержали бы такой погоды."
90100070-137 = "Немного жарко... но я в порядке! Для рикши это обычный рабочий день."
90100070-138 = "Мы привыкли бегать по асфальту, который раскаляется от тепла. К высокой температуре привыкаешь."
90100070-139 = "Вообще-то по сравнению с пиком сезона в середине лета сейчас ещё прохладно!"
90100070-140 = "[s11] «Пожалуйста, берегись теплового удара.»\n[s12] «Вот, возьми с собой напиток.»"
90100070-143 = "А... Спасибо."
90100070-144 = "Получить холодный напиток от Сенсея из Шале... Похоже, сегодня мой счастливый день!"
90100070-145 = ""
90100070-147 = ""
90100070-148 = ""
90100070-149 = "Раз уж речь зашла о беге по раскалённым дорогам без тени, я хотела кое-что спросить."
90100070-150 = "Ты не видела возле дорог подозрительное «белое пугало»?"
90100070-151 = "Белое пугало...? В смысле, с поля?"
90100070-152 = "Да. Мы слышали, что в этом районе видели белое пугало. Люди при виде него падают в обморок и бьются в судорогах."
90100070-153 = "О, вы уверены, что речь не о кунэ-кунэ?"
90100070-154 = "Кунэ-кунэ...?"
90100070-155 = "Но это было бы довольно странно. Кунэ-кунэ обычно появляются у рисовых полей, где-нибудь в сельской местности. Не думаю, что один из них оказался бы здесь..."
90100070-156 = "Потешь моё любопытство. Что это за кунэ-кунэ?"
90100070-157 = "Ты выглядишь такой серьёзной, что это прозвучит глупо. Кунэ-кунэ — что-то вроде городской легенды. Это скорее история из Хяккияко."
90100070-158 = "В последнее время эта история стала очень популярной. Забавно, что, в отличие от большинства духов, он появляется не ночью, а на открытых лугах в ясные дни."
90100070-159 = "Издалека он выглядит как танцующее белое пугало. Но никто не подходил достаточно близко, чтобы точно понять, ЧТО это такое."
90100070-160 = "...Потому что говорят: если увидишь его истинный облик, сойдёшь с ума. И сам станешь КАК кунэ-кунэ."
90100070-161 = "Будешь валяться на земле, извиваться и жутко улыбаться..."
90100070-162 = "Что за...? Это же ужас какой-то."
90100070-163 = "Многие городские легенды такие! В Хяккияко никто особо не воспринимает её всерьёз — кроме рикш."
90100070-164 = "Хм? Нацуки, получается, ты веришь в кунэ-кунэ?"
90100070-165 = "Я бы не сказала, что верю именно в легенду... Скорее, понимаю, откуда она могла взяться."
90100070-167 = "Знаете, как марево иногда похоже на извивающийся белый дым? И как издалека асфальт в очень жаркий день кажется волнистым?"
90100070-168 = "В такие дни температура обычно поднимается до опасного уровня. Если не беречь силы за рикшей, можно плохо себя почувствовать."
90100070-169 = "Так что совет возвращаться домой, если увидишь на горизонте извивающееся белое пугало, может оказаться неожиданно полезным."
90100070-171 = ""
90100070-172 = "Марево..."
90100070-173 = "...Понятно. Это было марево."
90100070-174 = "Спасибо. Вы очень помогли."
90100070-175 = "П-Правда...? Ну, всегда пожалуйста."
90100070-176 = ""
90100070-178 = ""
90100070-179 = ""
90100070-180 = "Сенсей [USERNAME]. Мы немедленно возвращаемся в штаб. На сегодня расследование завершено."
90100070-181 = "[s] «Д-Да. Возвращаемся.»"
90100070-182 = ""
90100070-184 = ""
90100070-185 = ""
90100070-186 = "[ns] «Спасибо, Нацуки. Не перегревайся и береги себя!»"
90100070-187 = "Да, и вы тоже! Берегите себя!"
90100070-188 = ""
90100070-193 = ""
90100070-194 = "Хмм. Эти девушки в матросках показались мне знакомыми."
90100070-195 = "Может, когда-то они брали отпуск в Объединённой академии Хяккияко..."
90100070-197 = "Следующий эпизод;За маревом"
