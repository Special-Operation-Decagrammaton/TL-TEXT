[translation]
10008060-1 = "Эпизод 6;Причина вернуть"
10008060-3 = "[ns] «Может, ещё раз разберём ситуацию?»"
10008060-4 = "Хорошо. Всё началось с того, что Кайтенджеры во имя справедливости украли ящик для пожертвований Дайкичидэна."
10008060-5 = "Ч-Что привело к вмешательству других группировок и дисциплинарного комитета."
10008060-6 = "А теперь мы знаем, что новогоднее мероприятие и ящик были частью крупной мошеннической схемы преступного синдиката Курокамэ!"
10008060-7 = "Ха! Вот это странный поворот событий!"
10008060-8 = "*вздыхает* Почему я вообще должна была вляпаться в такое на Новый год?"
10008060-9 = ""
10008060-11 = ""
10008060-13 = ""
10008060-14 = "Хех."
10008060-15 = "А я, наоборот, счастливее быть не могу!"
10008060-16 = "Босс?"
10008060-17 = "Чему ты так радуешься, Ару?"
10008060-18 = "Н-Ну, просто я..."
10008060-19 = "А, поняла. Ты рада, что твоё желание не исполнится наоборот."
10008060-20 = "...?!"
10008060-21 = "Только не говори. Босс, мы всё это время гнались за ящиком именно поэтому?"
10008060-22 = ""
10008060-24 = ""
10008060-25 = "Н-Нет!"
10008060-26 = "Я-Я просто не хотела, чтобы новый год начался с плохой ноги..."
10008060-27 = "Никому не хочется начинать год с дурного знака!"
10008060-28 = "Ахахаха!"
10008060-29 = "Неудивительно, что ты так сильно сосредоточилась, когда загадывала желание!"
10008060-30 = "Э-Это? Н-Нет, я просто, эм..."
10008060-32 = "*вздыхает* Муцуки."
10008060-33 = "Н-Но понять чувства Ару нетрудно."
10008060-34 = "Ха-ха-ха!"
10008060-35 = "Фух... И что теперь делать? Если всё это мошенничество, может, просто прекратим?"
10008060-36 = "Или лучше вообще оставим содержимое ящика себе, раз теперь знаем правду?"
10008060-37 = ""
10008060-40 = ""
10008060-42 = ""
10008060-43 = "Ну что, босс? Тебе решать."
10008060-44 = "Мы продолжим погоню."
10008060-45 = "А?"
10008060-46 = "Вы ведь тоже загадывали желания, правда?"
10008060-47 = "Наверняка у каждой есть то, чего она хочет добиться в этом году."
10008060-48 = "И каждая отдала драгоценное пожертвование в надежде, что желание сбудется.#nВерно?"
10008060-49 = "Одна из вас пожертвовала ради этого бюджетом на своё увлечение."
10008060-51 = "..."
10008060-53 = "Другая отдала свободные деньги, заработанные ночной работой на стройке!"
10008060-54 = "Ару..."
10008060-55 = "(Хотя Харука, кажется, вообще не особо переживает из-за этого.)"
10008060-56 = "(А я всё равно положила игрушечные деньги.)"
10008060-58 = "Ну и что, что мы попались на мошенничество преступного синдиката и нас выставила дураками банда чудиков в костюмах?"
10008060-59 = "Загаданные нами желания всё равно были искренними!"
10008060-60 = "Я не позволю, чтобы они оказались напрасными!"
10008060-61 = ""
10008060-63 = ""
10008060-64 = ""
10008060-65 = "А-Ару! Ты такая заботливая!"
10008060-66 = "Хе. Очень на неё похоже, правда?"
10008060-67 = "*вздыхает* Всегда умеет удивить."
10008060-68 = ""
10008060-72 = "Ваш босс вообще-то говорит разумные вещи."
10008060-73 = "[s] «Ага. Это та Ару, которую я знаю.»"
10008060-74 = "Хмф! Наша цель остаётся прежней."
10008060-75 = "Мы вернём ящик и отнесём его обратно к святыне."
10008060-76 = "Возражения?"
10008060-78 = "Лично я другого варианта не вижу."
10008060-79 = "Звучит весело, я в деле!"
10008060-80 = "Да!"
10008060-82 = "Ладно, ладно. Не обязательно говорить так, будто это ультиматум."
10008060-83 = "[s] «Вперёд, все вместе!»"
10008060-84 = ""
10008060-86 = ""
10008060-87 = "Кстати... Кто-нибудь знает, куда пошли Кайтенджеры?"
10008060-88 = "Ха-ха-ха!"
10008060-89 = "Очень на тебя похоже — после всего этого задать такой пустоголовый вопрос!"
10008060-90 = "*вздыхает*"
10008060-91 = "Ну, по крайней мере, у нас есть зацепки."
10008060-92 = "Отличная работа, Каёко! Вот почему ты мой надёжный начальник отдела!"
10008060-93 = "Ладно, успокойся."
10008060-94 = "Судя по тому, что мы узнали от дисциплинарного комитета об отмывании денег банды Курокамэ, у меня есть идея, куда Кайтенджеры понесли ящик."
10008060-95 = "На ум приходит только одно место..."
10008060-97 = "Закоулок Чёрного рынка"
10008060-100 = "*тяжело дышит* *тяжело дышит*..."
10008060-101 = "Теперь-то мы наверняка сбили их со следа."
10008060-102 = ""
10008060-105 = ""
10008060-107 = ""
10008060-108 = "А ну стой!"
10008060-109 = "Что?!"
10008060-110 = "Как вы нас нашли?! Наш маршрут отхода был идеален!"
10008060-112 = "Ого! Каёко попала прямо в точку!"
10008060-113 = "Как я и сказала, на ум приходило только одно место. Кайтенджеры с самого начала знали, что уносят грязные деньги."
10008060-114 = "Лучшее место для такой мутной добычи — столь же незаконное место, например Чёрный рынок."
10008060-115 = "Уверена, дисциплинарный комитет скоро тоже до этого догадается."
10008060-117 = "И всё же благодаря тебе мы опередили их. Молодец, Каёко."
10008060-118 = ""
10008060-120 = ""
10008060-121 = "Вернёмся к делу. Отдайте ящик. Сейчас же!"
10008060-122 = "Ха! Я так и думал, что вы это скажете. Размечтались!"
10008060-123 = "Что?!"
10008060-124 = "Мы украли ящик честно и по правилам. Значит, теперь это деньги Кайтенджеров, и вы их не получите!"
10008060-125 = "[s] «Не думаю, что герои справедливости должны так говорить...»"
10008060-126 = "Конечно должны. Мы герои, и мы так сказали. Значит, это и ЕСТЬ справедливость!"
10008060-127 = "Раз уж дошло до этого! Сражайтесь изо всех сил ради нашей мечты!"
10008060-128 = ""
10008060-130 = ""
10008060-132 = ""
10008060-133 = "Мечты, будущее... Сегодня все будто заевшая пластинка."
10008060-134 = "*вздыхает*"
10008060-136 = "Хотите драки — получите драку!"
10008060-137 = "Пошли!"
