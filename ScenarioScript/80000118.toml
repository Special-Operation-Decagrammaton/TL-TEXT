[translation]
80000118-1 = "Креп на S+"
80000118-2 = "Получив сообщение Кирары, что она снова на грани провала по предмету, я отправился на кухню Геенны."
80000118-4 = "Сюда, Учитель!"
80000118-5 = "Хи-хи, дело в том, Сенсей, что я..."
80000118-6 = "...вот-вот завалю кулинарию!"
80000118-7 = "[s] «Ты слишком бодрая для человека на грани провала...!»"
80000118-8 = "Ну, я правда вложила в это душу! Проблема скорее в навыках..."
80000118-9 = "Тесто всё время рвалось, крошилось, разваливалось — всё такое."
80000118-10 = "Хм? Что я пыталась сделать?"
80000118-11 = "...Шоколадный креп!"
80000118-12 = "Главное — завернуть много шоколада в тонкий, хорошо прожаренный креп!"
80000118-13 = "Но я даже до «тонкого и хорошо прожаренного» добраться не могу..."
80000118-14 = "[s] «Тогда давай разберёмся вместе!»"
80000118-15 = "Ура! Давайте, Сенсей!"
80000118-17 = "После этого мы с Кирарой усердно решали проблему с крепами."
80000118-18 = "Мы меняли густоту теста, нагрев и даже перепроверили состояние сковороды."
80000118-19 = "После множества попыток наконец получился ровный круглый креп."
80000118-21 = "Смотрите, Сенсей! Наконец-то креп! Такой гладкий!"
80000118-22 = "Теперь добавим шоколадный крем, сложим и завернём..."
80000118-23 = "...потом навалим шоколада, шоколадного мороженого и шоколадного печенья...!"
80000118-24 = ""
80000118-26 = ""
80000118-28 = "Та-дам! Готово! Валентиновский шоколадный креп для Сенсея!"
80000118-29 = "Оценку оставляю вам!"
80000118-30 = "[s] «Что? Оценку?»"
80000118-31 = "Ага! На самом деле вы преподаватель этого курса! А я единственный студент!"
80000118-32 = "Просто я хотела подарить вам домашний креп на День святого Валентина. Хи-хи."
80000118-33 = "Ну как? Зачёт? Какая оценка? A+?"
80000118-34 = "[s] «Ммм... Нет.»"
80000118-35 = "Ч-что?!"
80000118-36 = "[s] «Такое... заслуживает S+...!»"
80000118-37 = "Аха-ха! Спасибо, Сенсей!"
80000118-39 = "И мы с Кирарой поделили креп, почти целиком состоявший из шоколада."
