[translation]
10051020-1 = "Эпизод 2;Допуск к миссии"
10051020-2 = "Класс в старом школьном здании Хяккияко 38"
10051020-3 = "...и поэтому Клуб исследования ниндзюцу будет обеспечивать скрытую охрану знаменитого дизайнера Шайнкэт!"
10051020-4 = "О-о!"
10051020-5 = "Вы потрясающая, Президент!"
10051020-6 = "Х-Хорошая работа."
10051020-7 = "*шмыг* Не могу поверить, что вам удалось раздобыть для нас такой ценный заказ..."
10051020-8 = "Эм... Вы обе ведь тоже не против?"
10051020-9 = "Я думала, вы разозлитесь, что я заставляю вас работать!"
10051020-10 = "Вовсе нет, Президент!"
10051020-11 = "Это возможность повысить репутацию нашего клуба, сопровождая знаменитую и уважаемую персону...!"
10051020-12 = "Нет ни одной причины отказываться!"
10051020-13 = "Я... тоже согласна."
10051020-14 = "Кстати, девушки, мне любопытно."
10051020-15 = "Вы когда-нибудь слышали об этом «Шайнкэт»?"
10051020-16 = "Изуна — нет!"
10051020-17 = "Какой быстрый ответ!"
10051020-18 = "Эй, погодите, тогда откуда вы знали, что он такой... «знаменитый и уважаемый»?"
10051020-19 = "Потому что вы сами так сказали, Президент!"
10051020-20 = "А?"
10051020-21 = "Ну, я сама узнала о нём только от Нии..."
10051020-23 = "Эм, Президент..."
10051020-24 = "Я... вообще-то слышала о нём."
10051020-25 = "О. Правда?"
10051020-26 = "Да. Шайнкэт переосмысляет классическую эстетику через современную призму..."
10051020-27 = "...и полностью перевернул устоявшуюся парадигму модной индустрии!"
10051020-28 = "Шайнкэт на самом деле служит примером для множества начинающих дизайнеров..."
10051020-29 = "Ты столько знаешь!"
10051020-30 = "В-вот как...?"
10051020-31 = "В любом случае, спасибо вам всем за такие восторженные ответы!"
10051020-32 = "Но!"
10051020-33 = "Ниндзя всегда профессионал! А профессионалы не работают без достойного вознаграждения!"
10051020-34 = "Так что... Та-дам!"
10051020-35 = "Взгляните на нашу новую камеру!"
10051020-36 = "Мы можем возобновить съёмки «Мичиручи: свиток девушки-ниндзя»! Эту сагу не остановить!"
10051020-37 = "О!"
10051020-38 = "Вы потрясающая, Президент!"
10051020-39 = "Э-Эта камера гораздо лучше нашей старой..."
10051020-40 = "Мы запечатлеем ваше ниндзюцу в высоком разрешении, Президент!"
10051020-41 = "Достопочтенная Цукуё, посмотрите внимательнее! Она водонепроницаемая!"
10051020-42 = "Т-Точно...!"
10051020-43 = "Мы сможем снять вид от первого лица из кипящей миски рамена! Нин-нин!"
10051020-44 = "Хи-хи, рада, что всем нравится!"
10051020-45 = "Однако ниндзя — тот, кто умеет терпеть...!"
10051020-46 = "Так что давайте на минуту прекратим праздновать и сосредоточимся на деталях миссии!"
10051020-47 = "О!"
10051020-48 = "Президент...!"
10051020-49 = "Итак, давайте ознакомимся со снаряжением, хорошо?"
10051020-50 = ""
10051020-52 = ""
10051020-54 = "Сундук...?"
10051020-55 = "О-о! Изуна с нетерпением ждёт, что внутри!"
10051020-56 = "Что же там может быть?"
10051020-57 = "Новый свиток ниндзюцу?"
10051020-58 = "Фу-фу, ну, нет. Но это очень важно для нашей деятельности ниндзя."
10051020-59 = "Это..."
10051020-61 = "...платья!"
10051020-62 = "Платья...?"
10051020-63 = "Платья...?"
10051020-64 = ""
10051020-66 = ""
10051020-68 = ""
10051020-69 = "Ого! Изуна никогда раньше не видела такой красивой одежды!"
10051020-70 = "Они... очень красивые."
10051020-71 = "Хотя сомневаюсь, что моя крупная фигура вообще влезет во что-то подобное..."
10051020-72 = "Эм... Я рада, что вам нравится, как они выглядят."
10051020-73 = "Потому что... нам придётся их надеть."
10051020-74 = ""
10051020-76 = ""
10051020-77 = "Что?!"
10051020-78 = "В-Вам не кажется, что в них будет трудно двигаться?"
10051020-79 = "Президент, наша миссия — пройтись... по подиуму?"
10051020-80 = "...И нам придётся терпеть бесконечный свист и насмешки зрителей?"
10051020-81 = "К-Конечно, если таков путь, который должен пройти ниндзя..."
10051020-82 = "...тогда я, Цукуё, с радостью..."
10051020-83 = "Нет-нет. Наша миссия — всего лишь охранять!"
10051020-84 = "Мы смешаемся с толпой и будем следить за подозрительной активностью. Никто даже не обратит на нас внимания."
10051020-85 = "Эти платья позволят нам сохранить скрытность и профессиональный вид, верно?"
10051020-86 = "П-Правда..."
10051020-87 = "И Ния сказала, что там дресс-код, так что если мы хотим иметь доступ повсюду, нужно выглядеть соответствующе!"
10051020-88 = "Например, знаете, то место, где едят все важные шишки, этот... Эм..."
10051020-89 = "Б-Банкетный зал?"
10051020-90 = "Точно! Банкетный зал!"
10051020-91 = "Нас туда не пустят, если мы не будем одеты с иголочки."
10051020-92 = "Ага. Поэтому Клуб Инь-Ян и одолжил нам эти платья. Вообще-то... довольно щедро с их стороны."
10051020-93 = "Но разве они не будут сковывать движения?"
10051020-94 = "Гибкость и быстрота жизненно важны для любого уважающего себя ниндзя..."
10051020-95 = "И, если честно, я вообще не думаю, что оно на меня налезет...!"
10051020-96 = "Стоит мне хотя бы плечами пошевелить — я точно порву ткань."
10051020-97 = "Хм! Тогда давайте наденем платья прямо сейчас! Нин-нин!"
10051020-98 = "Хм?"
10051020-99 = "...!"
10051020-100 = "Всё именно так, как говорит президент..."
10051020-101 = "«Ниндзя никогда не сдаётся, какие бы невзгоды ни встретились на пути!»"
10051020-102 = "А значит, мы не должны бояться носить платья."
10051020-103 = "Если потренируемся сейчас и привыкнем к посадке..."
10051020-104 = "...то на самом мероприятии будем чувствовать себя совершенно свободно!"
10051020-105 = "...Ты права. Нам стоит подготовиться и потренироваться перед миссией."
10051020-106 = "И ниндзя должен уметь слиться с любой обстановкой!"
10051020-107 = "Как сказала Изуна! Мы не можем позволить парадной одежде победить нас!"
10051020-108 = "Именно! Нин-нин!"
10051020-109 = "Тогда Изуна примерит первой!"
10051020-112 = "Президент! Это моё платье?"
10051020-113 = "Ага, это твоё. А вот это — Цукуё..."
10051020-114 = "У-Уааа...!"
10051020-115 = ""
10051020-116 = "Та-дам! Изуна в платье!"
10051020-117 = ""
10051020-119 = ""
10051020-120 = ""
10051020-121 = ""
10051020-122 = "Ох...!"
10051020-123 = "Ух ты...!"
10051020-124 = "Ты выглядишь потрясающе!"
10051020-125 = "Так красиво...!"
10051020-126 = "Хи-хи, Изуна выглядит неплохо?"
10051020-127 = "От такой похвалы Изуна смущается!"
10051020-128 = "Ты сможешь в нём двигаться?"
10051020-129 = "Есть несколько мест, где немного тесно и неудобно..."
10051020-130 = "Но когда Изуна привыкнет, сможет двигаться свободно!"
10051020-131 = "А главное, Изуна впервые носит такой красивый наряд..."
10051020-133 = "...это так волнительно!"
10051020-134 = "О, хорошо-хорошо."
10051020-135 = "Ладно, тогда..."
10051020-136 = "Дальше..."
10051020-137 = "П-Почему бы вам не примерить своё, Президент?"
10051020-138 = "Уверена, оно будет вам очень к лицу!"
10051020-139 = "Эм, д-думаешь?"
10051020-140 = "Тогда посмотрим, где тут моё..."
10051020-142 = "Мне... вот так его накинуть...?"
10051020-143 = "Вы надели его задом наперёд, Президент!"
10051020-144 = "Ик!"
10051020-145 = "Что?! Почему всё так сложно?!"
10051020-146 = "Президент, д-давайте не спешить и начнём вот с этого..."
10051020-147 = "И затянем здесь..."
10051020-148 = "О!"
10051020-149 = "А что если распустить вам волосы, Президент?"
10051020-150 = "Изуна думает, длинные прямые волосы будут смотреться чудесно."
10051020-151 = "Эй, вы ещё и причёску мне хотите поменять?!"
10051020-152 = "Н-Нам вовсе не обязательно..."
10051020-153 = "Обязательно, Президент!"
10051020-154 = "У-У меня как раз с собой есть плойка, так что давайте попробуем!"
10051020-155 = "Зачем ты вообще её с собой таскаешь?!"
10051020-156 = ""
10051020-157 = "Н-ну...?"
10051020-158 = "О! Ваша аура безупречна, Президент!"
10051020-159 = "Такая чистая и женственная...!"
10051020-160 = "Потенциал ниндзя и правда безграничен...!"
10051020-161 = "Н-Не льстите мне...!"
10051020-162 = "М-Мне немного неловко...!"
10051020-163 = "И-И вообще, мне кажется, Цукуё будет выглядеть ещё лучше... Правда?"
10051020-164 = "Э-Эээ?!"
10051020-165 = "Не уклоняйтесь, достопочтенная Цукуё!"
10051020-166 = "Вы обязательно должны примерить своё!"
10051020-167 = "У-Уааа...!"
10051020-168 = "Наверное..."
10051020-172 = "Оно может даже оказаться не моего размера."
10051020-173 = "Оно не налезет. Я знаю...!"
10051020-174 = "Поначалу будет тесновато, но только поначалу."
10051020-175 = "Э-э-э...!"
10051020-176 = "И вообще, подол не слишком короткий?"
10051020-177 = "Эм... Такой длины достаточно?"
10051020-178 = "Вы правда так думаете...? Э-Это всё потому, что я слишком высокая!"
10051020-179 = "Я такая большая... и даже не красивая..."
10051020-180 = "...и я даже нормальную одежду носить не могу...! Её не шьют для меня!"
10051020-181 = "Аааа...!"
10051020-182 = "Это неправда, достопочтенная Цукуё! Вы не должны сдаваться!"
10051020-183 = "Н-Но...!"
10051020-184 = "П-Подождите, если вы т-так сожмёте...!"
10051020-185 = ""
10051020-188 = "*тресь*"
10051020-190 = ""
10051020-191 = "Эм..."
10051020-192 = "Платье порвалось...!"
10051020-193 = "К-Кнопки тоже поотлетали...!"
10051020-194 = "Уа-а..."
10051020-195 = "Я так и знала! Я не заслуживаю носить такую красивую одежду!"
10051020-196 = "Я просто слишком высокая и нескладная...!"
10051020-197 = "Хватит! Прости нас...! Нам не стоило тебя заставлять...!"
10051020-198 = "Ты в порядке, Цукуё?"
10051020-199 = "Я-Я в порядке..."
10051020-200 = "Но разве мы не одолжили это платье у Клуба Инь-Ян...?"
10051020-201 = "А что если они узнают, что я его порвала? Вдруг начнут вымогать с нас ещё больше и заставят выполнять их приказы?"
10051020-202 = "А что если они заберут камеру обратно?!"
10051020-203 = "Из-за меня мы никогда не закончим «Мичиручи: свиток девушки-ниндзя»!"
10051020-204 = "[s] «Не переживай. Его можно починить.»"
10051020-205 = "Точно-точно. Отнесём портному, он всё исправит, и вернём его как новенькое."
10051020-206 = "Сейчас, знаешь ли, швейные машинки делают просто невероятные."
10051020-207 = "Так что не принимай это так близко к сер..."
10051020-208 = ""
10051020-210 = ""
10051020-211 = "...Стоп, а почему достопочтенный Сенсей здесь?"
10051020-212 = "[s] «О, я в городе по работе.»"
10051020-213 = "Нет... Я спрашиваю не совсем ПОЧЕМУ вы здесь..."
10051020-214 = "...а КАК ДАВНО вы здесь!"
10051020-215 = "С-Сенсей...?!"
10051020-216 = "Мой господин?!"
10051020-217 = "Н-Неужели вы были здесь, пока... мы раньше переодевались...?"
10051020-218 = ""
10051020-220 = ""
10051020-221 = ""
10051020-222 = "Н-Ниндзюцу! Техника истребления извращенцев! Смерть извращенцу!"
10051020-223 = "[s] «П-Подождите...!»"
10051020-224 = ""
