[translation]
10024080-1 = "Эпизод 8;Пронзая ложь, раскрывая истину"
10024080-3 = ""
10024080-4 = ""
10024080-6 = "Акх!"
10024080-7 = "Уф!"
10024080-9 = ""
10024080-11 = ""
10024080-14 = ""
10024080-15 = "Противники нейтрализованы."
10024080-16 = "*тяжело дышит* *тяжело дышит* У тебя ужасный прицел. Как ты собираешься защищать своего президента?"
10024080-17 = "Можешь сколько угодно прятаться за оружием, но в настоящей драке против меня не продержишься и десяти секунд."
10024080-18 = "Враги не станут откладывать оружие и устраивать честный бой. Жизнь — не фильм про кунг-фу, мелкая."
10024080-19 = "Хмпф! По крайней мере, я не воображаю себя нуарным мафиозным детективом."
10024080-20 = "[s] «(Пожалуй, обеим не помешало бы смотреть чуть меньше кино...)»"
10024080-21 = "Рада, что мы все тут наслаждаемся победой."
10024080-22 = "Кажется, у Общества восточной алхимии были вопросы к нашим друзьям-преступникам?"
10024080-23 = ""
10024080-25 = ""
10024080-27 = ""
10024080-28 = "Кхм! Точно!"
10024080-29 = "Вы двое! Кто покупает весь этот десятитысячелетний женьшень?"
10024080-31 = "?!"
10024080-32 = "?!"
10024080-33 = "Я-я не могу сказать! Я не знаю!"
10024080-35 = "..."
10024080-36 = "А, разговаривать не хочется. Хотя я почти уверена, что уже знаю ответ..."
10024080-37 = "Это Шинтани Кай, верно? Или теперь она зовёт себя Обезьяной Чувств?"
10024080-39 = "...!"
10024080-40 = "К-как ты...?"
10024080-42 = "Ну, до этого это была просто догадка. Но теперь вы её подтвердили."
10024080-44 = "Так... за всем этим стояла обезьяна?"
10024080-45 = "Это... неожиданно..."
10024080-46 = "Стойте. Секунду!"
10024080-47 = "Эта «Обезьяна Чувств» — неужели это ТА Шинтани Кай?"
10024080-48 = "Бывший президент Общества восточной алхимии?!"
10024080-50 = "Хоть кто-то понимает, что происходит."
10024080-51 = "Верно. Бывший президент Общества восточной алхимии и одна из Семи Заключённых."
10024080-52 = "Её изгнали из Шаньхайцзина за распространение запрещённых препаратов и эликсиров."
10024080-53 = "[s] «Семь Заключённых...? Тогда...»"
10024080-55 = "О, я о них слышала. Семь ужасных преступниц, которым удалось сбежать."
10024080-56 = "И одна из них стояла за всеми этими проблемами..."
10024080-57 = "Они куда серьёзнее, чем я думала."
10024080-59 = "Расскажите мне всё! Кто? Что? Где? Как?"
10024080-61 = "...Мы... вообще-то не знаем."
10024080-62 = "Я всего лишь посредник. Мы оставляем десятитысячелетний женьшень, забираем оплату и уходим."
10024080-63 = "(Нам ведь не стоит признаваться, что мы знаем Кай, верно?)"
10024080-64 = "(Конечно нет! Если эти девчонки решат, что мы важные, они нас никогда не отпустят!)"
10024080-66 = "Хм... Думаю, они что-то скрывают."
10024080-68 = "Оставьте их мне."
10024080-69 = "Генрюмон вытянет из них правду!"
10024080-71 = ""
10024080-73 = ""
10024080-75 = ""
10024080-81 = ""
10024080-82 = "Похоже, у Общества восточной алхимии пёстрое прошлое."
10024080-83 = "У всех в Шаньхайцзине пёстрое прошлое. Включая нас."
10024080-84 = "Пойдём, Рэйдзё. Оставим нашу подругу из Генрюмон заниматься своей работой. Её у неё и так хватает."
10024080-85 = "Простите, но разве у нас есть работа?"
10024080-86 = "Я ошибаюсь? Разыскать десятитысячелетний женьшень, разобраться с предателями и всё такое."
10024080-88 = "Я-я знаю! Это же основы!"
10024080-89 = "[s] «Итак, что теперь будет делать Генрюмон?»"
10024080-90 = "Ну, для начала надо собрать весь украденный женьшень, если получится."
10024080-91 = "А потом... правосудие в стиле Генрюмон. Наших заключённых ждёт долгий «допрос»."
10024080-92 = "Грех запятнать имя Генрюмон не воспринимается легко... Хе-хе-хе..."
10024080-93 = "Рада, что ты можешь над этим смеяться, но ты ничего не забыла?"
10024080-94 = "А?"
10024080-95 = "По-моему, вы поймали виновницу контрабанды женьшеня, верно?"
10024080-96 = "Да... Но теперь это внутреннее дело, так что..."
10024080-97 = "Променаду Чёрной Черепахи плевать на внутренние разборки Генрюмон."
10024080-99 = "Но мне не плевать, что Генрюмон превратила нашу жизнь в ад без единого доказательства нашей вины."
10024080-101 = "Ну... если так ставить вопрос..."
10024080-102 = "Я бы с удовольствием завалилась к вам и весь день грубила. Чтобы вы немного почувствовали то, что устроили нам."
10024080-103 = "П-послушай. Генрюмон принимает всю ответственность, и мы обязательно разберёмся—!"
10024080-104 = "Мне плевать, в чём там Генрюмон будет разбираться!"
10024080-105 = "Просто помните, что Генрюмон должна Променаду Чёрной Черепахи официальные извинения за всё, через что вы нас протащили."
10024080-106 = "Я... я имею в виду..."
10024080-107 = "Я-я не могу решить это сама! Но... думаю... было неправильно обвинять вас, не дав возможности защититься..."
10024080-109 = "Я-я немедленно организую официальные извинения!"
10024080-111 = ""
10024080-115 = "Она убежала..."
10024080-116 = "Ха-ха-ха. А чего ты ожидала? Ты была с ней довольно жёсткой."
10024080-117 = "Вам этого правда достаточно, Президент? После всего, через что мы прошли, мне хочется как следует им отплатить..."
10024080-118 = "Я вполне довольна. Достаточно того, что мы доказали свою невиновность."
10024080-119 = "И даже если мы устроим им проблемы, Генрюмон всё равно часть жизни здесь."
10024080-120 = "Если правильно сыграть карты, может, они позволят нам спокойно заниматься бизнесом."
10024080-121 = "Возвращаемся? А, и ещё раз спасибо, Общество восточной алхимии."
10024080-122 = "Ага, мне тоже пора. Надо убедиться, что лаборатория готова к следующему разу..."
10024080-123 = "Хорошо быть готовой, но не забудь немного отпраздновать."
10024080-124 = "И вам спасибо, Сенсей."
10024080-125 = "[s] «Я просто делал свою работу.»"
10024080-126 = "Всегда такой скромный... Когда вернёмся, я награжу вас возможностью попробовать мой последний эксперимент!"
10024080-127 = "А?! И как это награда— Нет. Забудь. Я чуть не сказала лишнего..."
10024080-129 = "(Но... большинство её экспериментов на вкус...)"
10024080-130 = "(Странные? Неописуемые? Крайне... экспериментальные?)"
10024080-132 = ""
10024080-134 = ""
10024080-135 = "[ns] «Последний эксперимент Променада Чёрной Черепахи? Как интересно!»"
10024080-136 = "Погодите... Это вроде тех сырных фрикаделек с лапшой, нарезанной ножом? Я за!"
10024080-138 = "(Я должна их предупредить... Но моя обязанность — защищать Президента Руми...!)"
10024080-139 = "(Но Сенсей и Сая нам так помогли...!)"
10024080-140 = "(А-а, я не знаю, что делать! Дух кунг-фу, направь меня...)"
10024080-142 = ""
10024080-144 = ""
10024080-145 = ""
10024080-146 = "Хм... Теперь заполучить десятитысячелетний женьшень будет непросто."
10024080-147 = "Как эти дети смогли всё это провернуть? Или им помог этот «Сенсей»?"
10024080-148 = "Неважно. Я уже собрала достаточно женьшеня, чтобы закончить своё последнее зелье."
10024080-149 = "И всё же жаль, что не удалось собрать больше данных."
10024080-150 = ""
10024080-152 = ""
10024080-153 = "По крайней мере, они меня развлекают."
10024080-154 = "Ке-хе... В следующий раз придётся самой наведаться в Шаньхайцзин. Жду не дождусь встречи со своими младшими..."
10024080-155 = "...и с этим их Сенсеем."
10024080-156 = "Сенсей... Хм."
10024080-157 = "Я и правда жду этой встречи. Ке-хе..."
