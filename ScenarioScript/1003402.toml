1003402-108 = ""
1003402-109 = ""
1003402-110 = ""
1003402-111 = ""
1003402-112 = ""
1003402-113 = ""
1003402-114 = "Хи-хи. Тогда идите, Сенсей. Хорошего дня!"
1003402-115 = "[s] «Д-Да!»"
1003402-117 = "Благодаря Мимори я успел на работу вовремя..."
1003402-118 = "...хотя так и не узнал, зачем она вообще пришла."
