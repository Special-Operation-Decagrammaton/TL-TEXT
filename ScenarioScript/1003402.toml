[translation]
1003402-1 = "Пора вставать и сиять"
1003402-2 = "Я едва мог открыть глаза. После работы всю ночь тело казалось невероятно тяжёлым от усталости."
1003402-3 = "Затем я услышал, как кто-то меня зовёт."
1003402-4 = "Доброе утро, Сенсей. Пора вставать."
1003402-5 = "[s] «Уф. Ещё пять минут...»"
1003402-6 = "Сенсей, вы ведёте себя как ребёнок!"
1003402-7 = "Пора просыпаться."
1003402-12 = "[ns] «Хм. Где... я?»"
1003402-13 = "Доброе утро, соня!"
1003402-14 = "[s] «Д-Доброе утро, Мимори.»"
1003402-15 = "Вы здесь уснули?"
1003402-16 = "[s1] «Наверное, я немного устал от работы.»\n[s2] «Мне нужно было найти кое-какие документы для работы, а потом...»"
1003402-17 = "Значит, вы работали всю ночь и отключились..."
1003402-18 = "Значит, вы работали всю ночь и отключились..."
1003402-19 = "И спали, скрючившись за столом."
1003402-20 = "Это вредно для спины и совсем не полезно для здоровья."
1003402-21 = "Если так продолжать, ваше здоровье начнёт ухудшаться."
1003402-22 = ""
1003402-23 = "Теперь я всё понимаю. Отлично."
1003402-24 = "Очень хорошо, что я пришла вас навестить."
1003402-25 = "[s] «Ч-Что ты имеешь в виду?»"
1003402-26 = "Пожалуйста, Сенсей. Времени нет."
1003402-27 = "Через 30 минут вам уже нужно быть на работе."
1003402-28 = "Почему бы не начать с чистки зубов?"
1003402-29 = "[s] «А?!»"
1003402-32 = "[ns3] «Ладно, зубы я почистил...»\n[ns4] «У-Мой рот плохо пах?»"
1003402-33 = "Теперь дыхание свежее и мятное! Хорошо, садитесь, пожалуйста."
1003402-34 = "Теперь дыхание свежее и мятное! Хорошо, садитесь, пожалуйста."
1003402-35 = "[s] «Л-Ладно.»"
1003402-36 = ""
1003402-41 = "Завтрак — самый важный приём пищи за день."
1003402-42 = "Я принесла это из дома. Пожалуйста, поешьте."
1003402-44 = "[s] «Это... сэндвич?»"
1003402-45 = "Да, приготовленный специально для вас, Сенсей!"
1003402-46 = "[s] «Т-Ты его приготовила?!»"
1003402-47 = "Именно! Для завтрака я постаралась сделать что-нибудь лёгкое."
1003402-48 = "Я избегала жирных и резких вкусов вроде бекона или яиц. Вместо этого здесь салат и ветчина, а хлеб намазан соевым соусом!"
1003402-49 = "Или вы предпочли бы более традиционный завтрак с супом и жареной рыбой...?"
1003402-50 = "[s] «Нет, это идеально.»"
1003402-51 = "Правда? Как замечательно!"
1003402-52 = "И ещё немного чая! Он должен быть приятно тёплым."
1003402-53 = "[s] «С удовольствием.»"
1003402-56 = "Наслаждайтесь сколько душе угодно."
1003402-59 = "Ой, Сенсей. У вас на щеке соус..."
1003402-60 = "Позвольте мне."
1003402-61 = ""
1003402-62 = ""
1003402-63 = ""
1003402-64 = ""
1003402-65 = ""
1003402-66 = ""
1003402-67 = "Хи-хи."
1003402-70 = "[ns] «Фух! Было очень вкусно.»"
1003402-71 = "Я рада это слышать."
1003402-72 = "А теперь, пожалуйста, ложитесь на массаж."
1003402-73 = "[s] «На что?»"
1003402-74 = "После сна за столом мышцы у вас наверняка болят."
1003402-75 = ""
1003402-76 = ""
1003402-77 = ""
1003402-78 = ""
1003402-79 = "Ну как? Ах! Задняя часть шеи ужасно напряжена."
1003402-80 = "Так часто бывает, если спать в неправильной позе."
1003402-81 = "[s5] «Ты правда очень хорошо это делаешь, Мимори!»\n[s6] «Чувствую, как мышцы расслабляются.»"
1003402-82 = "Как приятно это слышать."
1003402-83 = "Как приятно это слышать."
1003402-84 = ""
1003402-85 = ""
1003402-86 = "Терапия завершена! Теперь пора идти."
1003402-87 = "Работа в Шале начинается через десять минут."
1003402-88 = "[s] «Д-Десять минут?»"
1003402-90 = "Не волнуйтесь, я уже всё убрала."
1003402-91 = "Вам осталось лишь убедиться, что вы ничего не забыли."
1003402-92 = "[s] «Вроде всё на месте.»"
1003402-93 = "Хи-хи. Тогда приготовления завершены."
1003402-94 = "И напоследок."
1003402-95 = "*раскрывает объятия*"
1003402-96 = "[s] «Мимори? З-Зачем ты развела руки?»"
1003402-97 = "Пожалуйста, обнимите меня."
1003402-98 = "[s] «О-Обнять?!»"
1003402-99 = "Объятия помогают вырабатывать окситоцин и заряжают энергией на весь день."
1003402-100 = "Я прочитала об этом в интернете. Настоящая леди доводит дело до конца."
1003402-101 = "..."
1003402-102 = "Хм? Я-Я..."
1003402-103 = "...перешла границу?"
1003402-104 = "[s7] «Нет, конечно. Тогда окситоциновые объятия!»\n[s8] «Такая настоящая леди, как ты, никогда бы не перешла границу.»"
