[translation]
10012020-1 = "Эпизод 2; Нужно придумать оправдание получше"
10012020-4 = ""
10012020-5 = "...?! Вы это слышали?"
10012020-6 = "Ага. Это был взрыв?"
10012020-7 = "Что бы это ни было, естественным оно не было."
10012020-8 = "Значит... у нас гости."
10012020-9 = "Капитан Рабу?!"
10012020-10 = ""
10012020-11 = "Хи-хи-хи. Наконец-то хоть какое-то веселье."
10012020-12 = "Не ожидала конкуренции на таком уединённом острове."
10012020-13 = "Похоже, охота за курортами будет весёлой."
10012020-14 = "Кто-то пришёл отобрать добычу у Бандитов в шлемах."
10012020-15 = "Вопрос только в одном... позволим ли мы им?"
10012020-16 = "Конечно нет."
10012020-18 = "Серьёзно?! Я отвлеклась всего на пять секунд!"
10012020-19 = "Как ей вообще удалось улизнуть?"
10012020-20 = "[s1] «...Серика?»\n[s2] «Тебе что-нибудь нужно?»"
10012020-21 = "О! Сенсей, вы случайно не видели Хошино?"
10012020-22 = "Да, кстати! Сенсей, вы не видели Хошино?"
10012020-23 = "Аяне и остальные пошли забрать всё, что можно, из вертолёта, а мы остались убираться."
10012020-24 = "[s3] «Ага. Опять играем в прятки, да?»\n[s4] «Я помогу найти Хошино, гарантия сто процентов!»"
10012020-25 = "Ты звучишь как-то слишком радостно... Но ладно."
10012020-26 = "Ну, хорошо. Да, пожалуйста. Поищи её, пока я продолжу уборку."
10012020-27 = "Она должна быть где-то неподалёку. Может, спит в одной из комнат."
10012020-28 = "Сенсей! Как только найдёте её, сразу возвращайтесь ко мне, хорошо?"
10012020-29 = "Я вас знаю! Хошино похлопает своими красивыми ресницами — и внезапно вы уже делаете за неё всю работу."
10012020-30 = "Так что обещайте! Не будите её, просто придите за мной!"
10012020-32 = "Я обыскал все комнаты курорта в поисках Хошино."
10012020-33 = "К счастью, я уже неплохо знал местность, так что это заняло не слишком много времени."
10012020-39 = ""
10012020-40 = "...?"
10012020-41 = "Сенсей? Что вы здесь делаете?"
10012020-42 = "[s5] «Я мог бы спросить тебя о том же.»\n[s6] «Я тебя искал.»"
10012020-43 = "О... Вы меня искали?"
10012020-44 = "А? Зачем?"
10012020-45 = "Ой, я забыла сказать Серике. Простите-простите!"
10012020-46 = "Я просто ушла поискать инструменты для уборки."
10012020-47 = "Но она решила, что я где-то отлыниваю? Старушке немного обидно."
10012020-48 = "Моя драгоценная младшая расстроена! Конечно же, я бы не убежала спать!"
10012020-49 = "Т-Ты бы не удивился?"
10012020-50 = "Хех. Ладно, тут мне, пожалуй, нечего возразить..."
10012020-51 = ""
10012020-53 = ""
10012020-54 = "А?"
10012020-55 = "На что я смотрела, когда вы вошли?"
10012020-56 = "От вас и правда ничего не скроешь, Сенсей."
10012020-57 = "Ну... ладно. Только никому больше не говорите."
10012020-58 = "Назовём это бабушкиной интуицией, но меня кое-что беспокоит."
10012020-59 = ""
10012020-61 = ""
10012020-62 = "[ns7] «...Старый плакат фестиваля.»\n[ns8] «Мы видели такие в Абидосе...»"
10012020-63 = "...Хех."
10012020-64 = "...Хех."
10012020-65 = "[s] «Хошино...»"
10012020-66 = "Не забивайте свою красивую голову, Сенсей. Ваша единственная задача — не проболтаться."
10012020-67 = "Они не очень умеют отделять одно от другого, понимаете? Если узнают, будут переживать весь отпуск."
10012020-68 = "Я хочу, чтобы они действительно смогли отдохнуть."
10012020-69 = "[s] «...»"
10012020-70 = "...Я серьёзно, Сенсей."
10012020-71 = "С этим я справлюсь. Обещаю."
10012020-72 = "[s9] «Если ты так говоришь...»\n[s10] «Я всё ещё не согласен, но...»"
10012020-73 = "Спасибо, Сенсей. Ну что, займёмся уборкой?"
10012020-74 = "Но вы мне поверите! А теперь — за уборку."
10012020-75 = "Я начну здесь, а вам лучше вернуться к Серике."
10012020-76 = "Эта комната довольно далеко, так что вряд ли мы вообще будем ею пользоваться."
10012020-77 = ""
10012020-79 = ""
10012020-80 = "..............."
10012020-81 = "Ладно-ладно. Вы победили. Давайте убираться вместе."
10012020-82 = "Я правда ничего не могу поделать, когда вы так на меня смотрите."
10012020-83 = "Я начну приводить в порядок тот угол, а вы принесёте инструменты для уборки?"
10012020-84 = "...Я не сбегу. Серьёзно."
10012020-85 = "[s] Принести инструменты для уборки."
10012020-86 = ""
10012020-90 = "Мы с Хошино убирались, пока всё не заблестело."
10012020-92 = "Теперь это выглядело достойно пятизвёздочного курорта."
10012020-93 = "Фух! Честно говоря, это место такое большое, что сначала я понятия не имела, с какой стороны к нему подступиться."
10012020-94 = "Спасибо за помощь, Сенсей. Вам совсем не обязательно было это делать."
10012020-95 = "[s11] «Да ничего такого.»\n[s12] «Большую часть сделала ты.»"
10012020-96 = "...Вы всегда так говорите. Вам стоит научиться иногда признавать и собственные заслуги."
10012020-97 = "...Вы всегда так говорите. Вам стоит научиться иногда признавать и собственные заслуги."
10012020-98 = "Но должна признать... приятно видеть результат своего труда."
10012020-99 = "...Очень приятно."
10012020-100 = "Наши проблемы обычно такие сложные, понимаете? Простота уборки грязной комнаты неожиданно приносит удовлетворение."
10012020-101 = "Ха! Думала, тебе удастся сбежать?"
10012020-102 = "Ч-что?!"
10012020-103 = "Как ты могла улизнуть спать, когда была мне нужна?"
10012020-104 = "Серьёзно! Как наш президент и старший студент, ты не должна сваливать всю работу на нас!"
10012020-105 = "...Постой... Тут..."
10012020-106 = "...чисто...?"
10012020-107 = "Ч-Что здесь произошло? Сенсей, вы сделали уборку за Хошино?!"
10012020-108 = "[s13] «На самом деле всё сделала Хошино.» \n[s14] «Я всего лишь помогал ей.»"
10012020-109 = "Не врите! Хошино ни за что не могла сделать всё это."
10012020-110 = "Не врите! Хошино ни за что не могла сделать всё это."
10012020-111 = "Хахаха! Серика такая милая, когда её застают врасплох!"
10012020-112 = "Хошино..."
10012020-113 = "Если продолжишь так на меня смотреть, эта старушка ещё покраснеет."
10012020-114 = "Скажи хоть что-нибудь, Серика! Разве ты не гордишься своим любимым президентом?"
10012020-115 = "Горжусь... тобой...?"
10012020-116 = "Всё это время ты вообще-то умела держать швабру... но предпочитала прятаться и спать в клубной комнате."
10012020-118 = "И теперь ты хочешь... чтобы я гордилась... тем, что ты могла делать все эти годы...?"
10012020-120 = "А?"
10012020-121 = "Я не понимаю. Почему ты злишься?"
10012020-122 = "Сенсей, похоже, я попала в неприятности. Помогите, пожалуйста."
10012020-123 = "[s15] «Тут ты сама виновата.»\n[s16] «Здесь я мало чем смогу помочь.»"
10012020-124 = "Я думала, вы на моей стороне, Сенсей! Как вы могли?!"
10012020-125 = "Я думала, вы на моей стороне, Сенсей! Как вы могли?!"
10012020-126 = "Ты серьёзно?! Как ТЫ могла, Хошино?"
10012020-127 = "Садись! Нам нужно серьёзно поговорить!"
10012020-128 = ""
10012020-131 = "Это дверь?"
10012020-132 = "Думаю, да. Кто бы это мог быть?"
10012020-133 = "Наверное, остальные вернулись от вертолёта. Как раз вовремя!"
10012020-134 = "Слушайте все! Вы не поверите, что сделала Хошино!"
10012020-135 = ""
10012020-139 = ""
10012020-140 = "А? Кто, чёрт возьми, такая «Хошино»?"
10012020-141 = "...Ай!"
10012020-143 = "...А?"
10012020-144 = "Вот они! Молодцы, что нашли их."
10012020-145 = "Капитан! Мы обнаружили нарушителей!"
10012020-146 = "Нарушителей?! Они про нас? Что происходит?"
10012020-148 = "Хмф. Не могу поверить, что они нас победили. Нехотя, но впечатляет."
10012020-149 = "...Хи-хи."
10012020-150 = "Я узнаю этот взгляд. Вы ведь тоже Охотники за курортами, да?"
10012020-151 = "...?"
10012020-152 = "Охотники... за чем?"
10012020-153 = "И что не так с моими глазами?!"
10012020-154 = "Понятно. Вы не хотите раскрывать свою личность. Большинство из нас тоже. Но притворяться дураками бесполезно."
10012020-155 = "Если честно, мне всё равно, кто вы. Потому что для меня вы — конкуренты."
10012020-156 = "А конкурентов нужно раздавить!"
10012020-157 = "Все! Приготовиться к бою!"
10012020-159 = "Покажите им силу Банды в шлемах!"
10012020-160 = "Заставьте их пожалеть, что они вообще ступили на этот остров!"
10012020-161 = ""
10012020-163 = ""
10012020-164 = ""
10012020-165 = ""
10012020-166 = ""
10012020-168 = "Ч-Ч-Что?!"
10012020-169 = "Мы этих людей в жизни не видели! Почему они пытаются нас убить?!"
10012020-171 = ""
10012020-173 = ""
10012020-174 = "Кто знает! Но похоже, они настроены серьёзно."
10012020-175 = "Похоже, у нас только один путь, Серика."
10012020-176 = "...Прямо вперёд."
10012020-177 = "Вперёд, Сенсей~"
