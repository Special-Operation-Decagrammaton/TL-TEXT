[translation]
1009605-1 = "Привилегии спасателя"
1009605-2 = ""
1009605-3 = "Что вы здесь делаете, Сенсей?"
1009605-4 = "[s1] «Ты выглядела так, будто тебе нужна помощь.»\n[s2] «Я пришёл разделить с тобой все тяготы.»"
1009605-7 = "..."
1009605-8 = "Ну, они действительно говорили, что вместе со спасателями набирают дополнительных помощников."
1009605-9 = "Но я не ожидала, что одним из них окажетесь вы."
1009605-10 = "[s] «Ну вот мы оба здесь. Похоже, сегодня мы коллеги.»"
1009605-11 = "...Хорошо."
1009605-12 = "Раз уж мы НА РАБОТЕ, в этот раз особо повеселиться не получится. Вас это устраивает?"
1009605-13 = "[s] «Конечно. Я пришёл как следует поработать.»"
1009605-14 = "Тогда отнесите эти принадлежности для уборки на свой участок."
1009605-15 = "Это открытая зона."
1009605-17 = "Мы будем отвечать за «Оздоровительный спа-комплекс.»"
1009605-18 = "Главная услуга здесь — приватное спа для двух человек."
1009605-19 = "Как можете догадаться, очередь туда огромная."
1009605-20 = "[s] «Похоже, он прямо создан для парочек...»"
1009605-21 = "В любом случае, я начну с этой стороны."
1009605-22 = "А вы можете начать уборку с другого края и двигаться мне навстречу?"
1009605-23 = "Тщательно вычистите каждый угол. Сегодня это ваша ответственность."
1009605-24 = "[s3] «Т-Так точно!»\n[s4] *сглатывает*"
1009605-28 = "Некоторое время мы усердно убирали Оздоровительный спа-комплекс..."
1009605-30 = "Фух, на этом пока всё."
1009605-31 = "Хорошая работа, Сенсей."
1009605-32 = "[s5] «Ты тоже хорошо потрудилась, Канна.»\n[s6] «Теперь весь комплекс сияет чистотой.»"
1009605-35 = "Я доложу администрации парка, что работа закончена."
1009605-36 = ""
1009605-38 = ""
1009605-39 = "Старший Оздоровительного спа — управляющему парком. Приём."
1009605-40 = "*помехи* Есть проблема? Приём."
1009605-41 = "Уборка и проверка объекта завершены. Ожидаем новых распоряжений. Приём."
1009605-42 = "*помехи* Хорошая работа. У нас тут сейчас много дел, так что просто отдохните, пока мы снова не свяжемся... *помехи*"
1009605-43 = "Хм, связь оборвалась."
1009605-44 = "Они сказали, что заняты. Полагаю, можем просто подождать здесь, как нам и велели. Вас это устраивает?"
1009605-45 = "[s7] «Вполне. Я как раз хотел немного отдохнуть.»\n[s8] Размять ноющие мышцы."
1009605-46 = ""
1009605-47 = ""
1009605-49 = ""
1009605-50 = "Хорошо, тогда перерыв."
1009605-51 = "Если хотите, можем вместе воспользоваться «Оздоровительным спа»."
1009605-52 = "[s] «О? Нам можно?»"
1009605-53 = "Конечно. Прошу сюда."
1009605-56 = "― [log=칸나 수영복]А-а-а...[/log][wa:710]"
1009605-58 = "― [log=칸나 수영복]Чувствую, как вся усталость... уходит.[/log][wa:10]"
1009605-61 = "― [log=칸나 수영복]Всё нормально...[/log][wa:390]"
1009605-63 = "― [log=칸나 수영복]Можно считать это... проверкой оборудования.[/log][wa:10]"
1009605-66 = "― [log=칸나 수영복]Кроме того...[/log]"
1009605-68 = "― [log=칸나 수영복]Те, кто хорошо трудятся, заслуживают награды.[/log][wa:120]"
1009605-71 = "― [log=칸나 수영복]И ещё...[/log][wa:190]"
1009605-73 = "― [log=칸나 수영복]Я всегда... у вас в долгу, Сенсей.[/log][wa:710]"
1009605-76 = "― [log=칸나 수영복]Так что это...[/log][wa:360]"
1009605-78 = "― [log=칸나 수영복]лишь небольшой знак моей благодарности.[/log][wa:1190]"
1009605-81 = "[ns9] «То есть ты хочешь сказать...»\n[ns10] «Награда — возможность посидеть с тобой в спа?»"
1009605-82 = "― [log=칸나 수영복]Ч-Что?![/log][wa:380]"
1009605-83 = "― [log=칸나 수영복]Ч-Что?![/log][wa:380]"
1009605-85 = "― [log=칸나 수영복]К-Конечно же нет![/log][wa:810]"
1009605-88 = "― [log=칸나 수영복]Я здесь потому, что...[/log][wa:1490]"
1009605-91 = "― [log=칸나 수영복]Ради вашей безопасности![/log][wa:1830]"
1009605-93 = "― [log=칸나 수영복]Я спасатель![/log][wa:800]"
1009605-96 = "Давайте не будем так друг друга дразнить."
1009605-97 = "*помехи* Управляющий парком — старшему оздоровительного спа. Приём."
1009605-98 = "Отличная работа. Скоро заканчиваем, так что возвращайтесь в штаб. Конец связи. *помехи*"
1009605-99 = ""
1009605-102 = ""
1009605-103 = "Похоже, пора возвращаться, Сенсей."
1009605-104 = "Спасибо, что так хорошо помогли с уборкой."
1009605-105 = "[s] «Я хорошо провёл день, Канна.»"
1009605-106 = ""
1009605-109 = "[ns] «А ты?»"
1009605-110 = "Ну, спасателю не стоит думать о том, насколько ему нравится работа, но..."
1009605-111 = "...если говорить честно..."
1009605-113 = "...да, мне тоже понравилось, Сенсей."
