[translation]
201030-1 = "Episódio 3; O Gambito da Rainha"
201030-2 = "Centro Correcional - Sala de Visitas da Ala de Contenção Especial A"
201030-4 = "Detenta número 1192. Você tem visita."
201030-5 = ""
201030-8 = ""
201030-10 = "Quem diria...... me perguntava quem apareceria a uma hora dessas......"
201030-11 = "A que devo a honra da sua presença, Presidente Interina?#nE ainda por cima em trajes civis?"
201030-12 = ""
201030-14 = ""
201030-15 = "Acompanhada do Sensei da Schale...... veio tripudiar da minha situação?"
201030-16 = "Não seja ridícula. Por que vocês sempre insistem em associar as coisas dessa forma?"
201030-17 = "Só vim ver como você estava. E também tenho algumas perguntas a fazer."
201030-18 = "Suspiro......"
201030-19 = "Não podia ter mandado um ofício ou um funcionário no seu lugar?"
201030-20 = "A rotina da Presidente Interina não é atolada de serviço?#nVir pessoalmente até o Centro Correcional só pra isso――"
201030-21 = "Não precisa se preocupar com a minha rotina. Hoje estou de folga."
201030-22 = "Deixei tudo devidamente delegado, então não haverá problemas maiores."
201030-23 = "......"
201030-24 = "Gastar um dia precioso de folga vindo encarar a cara da sua arqui-inimiga...... você é biruta por acaso?"
201030-25 = "Ou veio aqui unicamente para tirar sarro da minha desgraça?"
201030-26 = "Não vou forçar a barra. Se prefere assim, posso oficializar as perguntas por escrito depois."
201030-27 = ""
201030-29 = ""
201030-30 = "E-Espera aí! Eu não disse que não queria conversar! Não vai saindo de fininho assim!"
201030-31 = "Cof, cof...... Bem, eu estava morrendo de tédio aqui mesmo, né?#nJá que vocês se deram ao trabalho de vir até aqui, posso arrumar um tempinho pra vocês."
201030-32 = "[s] \"A rotina na prisão tá muito corrida?\""
201030-33 = "M-Mas é claro! De manhã eu faço a minha corridinha matinal......"
201030-34 = "Depois eu leio livros sobre alta liderança e estratégias de governo......"
201030-35 = "Aí depois do almoço, bem...... é que......"
201030-36 = ""
201030-38 = ""
201030-39 = "...... É, tá bom, você venceu! Não tem absolutamente nada pra fazer aqui dentro!"
201030-40 = "Não tem distração nenhuma. E quase não tenho com quem conversar."
201030-41 = "Agradeço por terem me colocado numa cela separada do Esquadrão FOX, mas......#nficar sem ver ninguém é praticamente a mesma coisa que ficar numa solitária, sabia?!"
201030-42 = "Não chega nenhuma notícia do mundo lá fora, ninguém vem me visitar......!"
201030-43 = "A-Ah, e não vai achando que estou feliz só porque vocês vieram me ver, tá ouvindo?!"
201030-44 = "[s] \"Você tava se sentindo solitária, né......\""
201030-46 = "...... Pelo menos, vejo que a sua saúde continua em perfeito estado."
201030-47 = "Mas é óbvio! Alguém destinada a liderar no topo jamais perderia a saúde só por causa de um tropeço. Uma 'super-humana' não se abala por tão pouco!"
201030-48 = "Hoje estou trancafiada aqui no Centro Correcional, mas um dia vou dar outro golpe com sucesso#ne tomar aquela cadeira de volta!"
201030-49 = "...... Já pensava isso antes, mas preciso admitir: essa sua autoconfiança inabalável é admirável."
201030-50 = "Não se importar com o olhar alheio, não se deixar derrubar pela derrota.#nEssa determinação de tentar de novo quantas vezes forem necessárias é uma das suas maiores virtudes."
201030-51 = "Graças a isso, lembro que nunca consegui vencer uma série de jogos contra você."
201030-52 = ""
201030-54 = ""
201030-55 = "...... Já que estamos aqui, que tal jogarmos uma partida de xadrez?"
201030-56 = ""
201030-58 = ""
201030-62 = "Torre em h8, xeque."
201030-63 = "Bispo em h3."
201030-64 = "Cavalo em g6."
201030-65 = "Torre em f7, xeque."
201030-66 = "Rei em h6."
201030-67 = "Dama em g6, xeque."
201030-68 = ""
201030-71 = "...... Eu abandono."
201030-72 = "Sua habilidade continua afiada como sempre. Não sou páreo para você."
201030-73 = ""
201030-74 = "Passei todo esse tempo praticando aqui dentro, oras. Acho que fiquei ainda melhor do que antes."
201030-75 = ""
201030-77 = ""
201030-78 = "...... O xadrez é tão simples e direto, por que será que eu não consegui vencer naquela época?"
201030-79 = ""
201030-81 = ""
201030-82 = "Suspiro......"
201030-83 = "Q-Que cara é essa?! Eu falei alguma coisa errada por acaso?!"
201030-84 = "Você ainda não entendeu, não é?"
201030-85 = "Por mais brilhante que seja a sua tática, a realidade não se comporta como um tabuleiro de xadrez."
201030-86 = "Nem você, nem as pessoas sob o seu comando são super-humanos."
201030-87 = "Pessoas não são peças de jogo. Quanto mais você tenta impor controle absoluto sobre elas, mais o controle escapa pelos seus dedos."
201030-88 = "Para nós, pessoas comuns que não nascemos super-humanas, preservar o equilíbrio é o máximo que podemos fazer."
201030-89 = "E você acha que no meu lugar teria conseguido?!"
201030-90 = "Não. Eu também não sou uma super-humana."
201030-91 = "Capaz de mover as pessoas com a precisão perfeita de peças no tabuleiro...... a única super-humana que conheci na vida foi ela."
201030-94 = ""
201030-95 = "...... É. 'Ela' teria conseguido com facilidade."
201030-96 = "Aliás, ela sequer precisaria provar a própria capacidade.#nAs alunas de Kivotos confiavam nela de olhos fechados."
201030-97 = "Eu também...... desde o dia em que ela desapareceu, vivi correndo atrás da sombra dela."
201030-98 = "O que eu precisava fazer para compensar a ausência dela?#nQue proezas eu teria que alcançar para me tornar uma super-humana?"
201030-99 = "Revirei cada arquivo, tentei usar tudo o que ela deixou para trás, mas......"
201030-100 = "No fim das contas, olha só onde vim parar. Essa vergonha."
201030-101 = "Quando Kivotos inteira entrou em colapso e as instituições pararam de funcionar――"
201030-102 = "O que exatamente você ordenou ao Esquadrão FOX para afanar do subsolo da Schale?"
201030-103 = "......"
201030-104 = "Se preferir privacidade, posso usar minha autoridade de interina para dispensar a escolta da sala."
201030-105 = ""
201030-107 = ""
201030-108 = "Não precisa se dar ao trabalho."
201030-109 = "Revelar a verdade sobre aquilo não vai mudar absolutamente nada a essa altura."
201030-110 = ""
201030-112 = ""
201030-113 = "O que o Esquadrão FOX trouxe do porão da Schale foi um simples smartwatch comum."
201030-114 = "...... Quer dizer, um objeto que só parecia ser isso aos meus olhos."
201030-115 = "Como assim?"
201030-116 = "Desde que a Presidente desapareceu, passei a investigar em segredo tudo o que ela havia deixado."
201030-117 = "A maioria eram coisas banais, como jogos de chá e material escolar.#nPorém, no meio daquilo havia artefatos de poder assustador.#nCoisas capazes de transferir o controle total da Sanctum Tower."
201030-118 = "Sim, estou falando daquilo que o Sensei da Schale carrega―― a 'Arca de Shittim'."
201030-119 = "Se existia um artefato capaz de controlar a infraestrutura de Kivotos na palma da mão,#neu deduzi que deveria haver outros semelhantes...... ou quem sabe até mais poderosos."
201030-120 = "E acabei descobrindo que um artefato equivalente à Arca de Shittim estava guardado dentro de um relicário no subsolo da Schale."
201030-121 = "O nome dele é―― o 'Cajado de Amendoeira'."
201030-122 = "De acordo com os registros da Presidente, ele possuía o poder de discernir a verdade."
201030-123 = "[s] \"Cajado de Amendoeira......?\""
201030-124 = "Eu sabia que o Sensei já tinha ouvido falar dele."
201030-125 = "[s1] \"Não sei os detalhes, mas......\"\n[s2] \"Tenho a impressão de ter escutado esse nome em algum lugar......\""
201030-128 = "...... Poxa, e eu que pensei que você sabia de algo."
201030-129 = "No final das contas, nunca entendi o que 'discernir a verdade' significava.#nMesmo assim, ordenei ao Esquadrão FOX que o recuperasse."
201030-130 = "Se o 'Cajado de Amendoeira' fosse mesmo um artefato no nível da Arca de Shittim,#neu não apenas garantiria o sucesso do golpe de estado, como tomaria o controle total do Conselho Estudantil Federal."
201030-131 = "...... Só que na prática, o Cajado de Amendoeira não passava de um smartwatch qualquer."
201030-132 = "Tentei de todas as maneiras possíveis fazê-lo funcionar, mas nada acontecia......#nNa época do golpe, eu já até tinha me esquecido completamente da existência dele."
201030-133 = "Coloquei o Cajado de volta no relicário e guardei no depósito do Conselho.#nSe ninguém mexeu, deve estar lá até hoje."
201030-134 = "[s] \"Por que será que o Cajado de Amendoeira não reagiu com você?\""
201030-135 = "Vai saber......"
201030-136 = "Talvez haja um jeito certo de ativar, ou talvez eu simplesmente não tivesse a capacidade necessária......"
201030-137 = "Ou quem sabe...... as anotações da Presidente estivessem simplesmente erradas."
201030-138 = "Mas já que o [USERNAME] Sensei consegue operar a Arca de Shittim,#ntalvez você consiga enxergar o verdadeiro valor dele."
201030-139 = "...... Assim que voltarmos, vou procurar pelo relicário."
201030-140 = "[s] \"No fim das contas, virou trabalho de novo......\""
201030-141 = "Não se preocupe com isso. Eu aproveitei muito bem o meu dia."
201030-142 = "Pude saborear um prato nostálgico, e jogar xadrez com uma velha conhecida de longa data......#nCoisas que eu jamais conseguiria fazer na minha rotina normal."
201030-143 = ""
201030-145 = ""
201030-146 = "...... E agora, pretendo valorizar cada minuto deste descanso."
201030-147 = "Kaya. Se não se importar, podemos jogar mais uma partida?#nQuero dar o troco pela derrota de agora há pouco."
201030-148 = "Ora, se for xadrez, podemos jogar quantas você quiser......"
201030-149 = "Só não espere que eu pegue leve com você."
201030-152 = ""
201030-153 = "O primeiro lance é...... Peão em d4."
201030-154 = "Peão em d5."
201030-155 = "...... Administradora-Chefe."
201030-156 = "Com esse seu jeitinho certinho, sei que não faz muito o seu estilo, mas――"
201030-157 = "Para avançar no meio-jogo com velocidade e eficiência,#nsacrificar um peão com um gambito não é uma má ideia, sabia?"
201030-158 = "Peão em c4."
201030-159 = ""
201030-161 = ""
201030-162 = "...... Peão em e6. Agradeço, mas recuso."
201030-164 = "No Próximo Episódio; Nostalgia Azul-Celeste"
