[translation]
201030-1 = "Эпизод 3;Ферзевый гамбит"
201030-2 = "Исправительное бюро, специальный лагерь, корпус A, комната свиданий"
201030-4 = "Заключённая 1192. К вам посетитель."
201030-5 = ""
201030-8 = ""
201030-10 = "А я всё гадала, кто мог прийти ко мне в такой час..."
201030-11 = "Какими судьбами, исполняющая обязанности президента Генерального ученического совета? Ещё и так мило нарядилась."
201030-12 = ""
201030-14 = ""
201030-15 = "А раз вы даже Сенсея из Шале с собой привели... Пришли похвастаться свиданием?"
201030-16 = "...Вовсе нет. Почему все сразу делают именно такой вывод?"
201030-17 = "Я хотела узнать, как у тебя дела. И задать несколько вопросов."
201030-18 = "*вздыхает*"
201030-19 = "Главный администратор Рин. Для человека вашего положения разве не проще было кого-нибудь прислать? Или оставить записку?"
201030-20 = "Я прекрасно понимаю, насколько вы заняты как исполняющая обязанности президента. У вас правда есть время бездельничать здесь, в Исправительном бюро?"
201030-21 = "Спасибо за беспокойство, но сегодня у меня выходной."
201030-22 = "Я оставила каждому отделу строгие инструкции, так что они справятся, какой бы кризис ни возник."
201030-23 = "..."
201030-24 = "...И в свой драгоценный выходной вы пришли поболтать с врагом? Вы что, правда идиотка?"
201030-25 = "Или вам доставляет какое-то садистское удовольствие издеваться над заключённой?"
201030-26 = "Если моё присутствие доставляет тебе неудобства, я уйду и вместо этого отправлю письмо."
201030-27 = ""
201030-29 = ""
201030-30 = "П-Постойте! Я такого не говорила! Не уходите ещё!"
201030-31 = "К-Кхм. То есть... у меня как раз есть немного времени, а вы всё-таки потрудились прийти сюда. Было бы невежливо не уделить вам его."
201030-32 = "[s] «А ты здесь обычно сильно занята?»"
201030-33 = "К-Конечно. Сразу после пробуждения я иду на пробежку..."
201030-34 = "Потом, до завтрака, читаю книги по саморазвитию и лидерству..."
201030-35 = "А после завтрака я..."
201030-36 = ""
201030-38 = ""
201030-39 = "...Ладно, хорошо. У меня вообще нет никакого расписания."
201030-40 = "В тюрьме сложно найти хоть какое-нибудь приятное занятие, не говоря уже о собеседнике."
201030-41 = "Я понимаю, что меня отделили, чтобы я не пересекалась с членами отряда FOX, но в результате мне вообще не с кем разговаривать. По сути, я в одиночной камере."
201030-42 = "Доступ к новостям извне у меня до смешного ограничен, посетителей тоже нет..."
201030-43 = "Но это ещё не значит, что я рада вас видеть, ясно?!"
201030-44 = "[s] «Так тебе было одиноко...»"
201030-46 = "...Рада видеть, что ты здорова."
201030-47 = "Разумеется. Мне предначертано величие — такой сверхчеловек, как я, не сломается и не запустит своё здоровье из-за одной-единственной ошибки."
201030-48 = "Пусть я и оступилась, но я восстановлюсь! А потом устрою успешный переворот и верну себе власть!"
201030-49 = "Я и раньше так думала, но всё же должна признать: твоя уверенность в себе поистине безгранична."
201030-50 = "Похоже, ты вообще не знаешь, что такое поражение, и продолжаешь идти вперёд, несмотря ни на какие препятствия и осуждение."
201030-51 = "Я никогда не видела, чтобы ты проигрывала в игре."
201030-52 = ""
201030-54 = ""
201030-55 = "...Именно поэтому я хочу предложить тебе сыграть со мной в шахматы."
201030-56 = ""
201030-58 = ""
201030-62 = "Ладья на H8. Шах."
201030-63 = "Слон на H3."
201030-64 = "Конь на G6."
201030-65 = "Ладья на F7. Шах."
201030-66 = "Король на H6."
201030-67 = "Ферзь на G6. Шах."
201030-68 = ""
201030-71 = "...Я проиграла."
201030-72 = "Ты совершенно не растеряла шахматную форму, Кая. Я никогда не встречала никого подобного тебе."
201030-73 = ""
201030-74 = "Как я уже сказала, здесь особо нечем заняться. Я решала шахматные задачи сама с собой. С тех пор это мой первый настоящий матч против кого-то другого, но, кажется, я немного улучшила навыки."
201030-75 = ""
201030-77 = ""
201030-78 = "...Когда шахматы даются мне настолько легко, я всё равно не могу понять, почему тогда моя тактика не сработала."
201030-79 = ""
201030-81 = ""
201030-82 = "*вздыхает*"
201030-83 = "Ч-Что это за взгляд? Что не так с тем, что я сказала?!"
201030-84 = "Ты всё ещё не понимаешь, Кая."
201030-85 = "Тактика и идеальные планы ничего не значат в реальном мире. Жизнь — не шахматная доска."
201030-86 = "Потому что ни ты, ни твои подчинённые не сверхлюди."
201030-87 = "Люди — не шахматные фигуры. Чем сильнее пытаешься ими управлять, тем сложнее ими становится управлять."
201030-88 = "Для обычного человека, который так и не стал сверхчеловеком, лучшее, что остаётся, — поддерживать существующий порядок."
201030-89 = "И ты думаешь, ТЫ смогла бы добиться успеха там, где не смогла я?"
201030-90 = "Нет. Я тоже не сверхчеловек."
201030-91 = "Есть только один известный нам сверхчеловек, способный двигать людьми по доске словно шахматными фигурами."
201030-94 = ""
201030-95 = "...Ты права. Она смогла бы."
201030-96 = "Но ей и не пришлось бы этого делать. Никто бы не стал в ней сомневаться. Сама мысль о необходимости что-то доказывать, наверное, для неё совершенно чужда."
201030-97 = "С самого её исчезновения я гонялась за её тенью. Так же, как и ты."
201030-98 = "Я думала, это мой шанс стать сверхчеловеком. Думала, что смогу стать идеальной заменой."
201030-99 = "Я перечитала бесчисленное количество документов, думая, что если просто буду достаточно стараться..."
201030-100 = "Но вот где я оказалась."
201030-101 = "Когда Кивотос погрузился в хаос..."
201030-102 = "Что именно ты приказала отряду FOX принести тебе из подвала Шале?"
201030-103 = "..."
201030-104 = "Если здесь слишком много людей, я могу попросить их выйти. Как исполняющая обязанности президента, хотя бы такая власть у меня есть."
201030-105 = ""
201030-107 = ""
201030-108 = "Нет, всё в порядке."
201030-109 = "Какая теперь вообще разница?"
201030-110 = ""
201030-112 = ""
201030-113 = "Я приказала принести самые обычные старые наручные часы."
201030-114 = "Точнее, вещь, которая выглядела именно так."
201030-115 = "Расскажи подробнее."
201030-116 = "После исчезновения президента Генерального ученического совета я тайно изучила всё, что она оставила после себя."
201030-117 = "В основном это были обычные личные вещи — школьные принадлежности, наборы чашек и тому подобное. Но я искала артефакт, достаточно могущественный, чтобы передать контроль над Башней Санктум."
201030-118 = "Ковчег Шиттим Сенсея."
201030-119 = "Я подумала: если существует артефакт, способный одним движением управлять инфраструктурой всего Кивотоса, значит, должны существовать и другие. Возможно, даже более могущественный, чем Ковчег."
201030-120 = "И, просматривая записи президента Генерального ученического совета, я нашла упоминание именно такого артефакта — ещё одного, хранившегося в подвале Шале."
201030-121 = "Посох Шакеда."
201030-122 = "Согласно записям президента, это предмет, способный различать истину."
201030-123 = "[s] «Ты сказала... Посох Шакеда?»"
201030-124 = "О? Вы уже знаете о нём, Сенсей?"
201030-125 = "[s1] «Нет, не прямо такими словами...»\n[s2] «Просто звучит смутно знакомо.»"
201030-128 = "...Зря только обнадёжили. Как скучно."
201030-129 = "По записям было трудно понять, что именно означает «различать истину», поэтому я приказала отряду FOX принести артефакт мне."
201030-130 = "Я решила, что если Посох Шакеда действительно сопоставим с Ковчегом Шиттим, то он пригодится не только для переворота, но и для управления Генеральным ученическим советом."
201030-131 = "...Но когда Посох Шакеда оказался у меня в руках, он выглядел всего лишь как обычные часы."
201030-132 = "Я изучала его вдоль и поперёк, но он действительно умел только показывать время. А к началу переворота я о нём уже забыла."
201030-133 = "Я положила его обратно в сундук, где он изначально хранился, и оставила в кладовой здания Генерального ученического совета. Если его никто не забрал, он должен быть всё ещё там."
201030-134 = "[s] «Интересно, почему Посох Шакеда не сработал.»"
201030-135 = "Мне так и не удалось это выяснить."
201030-136 = "Возможно, существует какой-то особый способ им пользоваться, а может, у меня просто нет способности управлять этим артефактом."
201030-137 = "Или записи президента Генерального ученического совета были ошибочны."
201030-138 = "Возможно, пользователь Ковчега Шиттим сможет чего-то от него добиться, [USERNAME] Сенсей."
201030-139 = "...Разберёмся с этим, когда вернёмся в Генеральный ученический совет."
201030-140 = "[s] «И мы снова вернулись к работе.»"
201030-141 = "Не переживайте так, Сенсей. Несмотря на то, как всё выглядит, я действительно наслаждаюсь выходным."
201030-142 = "Поесть ностальгичную еду и поиграть с давней соперницей — для меня довольно редкий опыт."
201030-143 = ""
201030-145 = ""
201030-146 = "...Так что стоит воспользоваться им, пока есть возможность."
201030-147 = "Если ты не против, Кая, может, я возьму реванш за своё постыдное поражение чуть раньше?"
201030-148 = "Я всегда рада сыграть в шахматы..."
201030-149 = "...но поддаваться тебе не собираюсь."
201030-152 = ""
201030-153 = "Мой первый ход... Пешка на D4."
201030-154 = "Пешка на D5."
201030-155 = "...Главный администратор."
201030-156 = "Возможно, это не совсем в вашем стиле..."
201030-157 = "Но иногда пожертвовать пешкой ради усиления позиции в миттельшпиле — весьма эффективный гамбит."
201030-158 = "Пешка на C4."
201030-159 = ""
201030-161 = ""
201030-162 = "...Пешка на E6. Я отклоняю гамбит."
201030-164 = "Следующий Эпизод;Ностальгия небесно-голубого цвета"
