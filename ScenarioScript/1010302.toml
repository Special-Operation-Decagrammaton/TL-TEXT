[translation]
1010302-1 = "Ложь и правда"
1010302-2 = "Сенсей! Сюда! Я здесь!"
1010302-3 = "[s1] «Успокойся, Марина!»\n[s2] «Почему ты так взволнована?»"
1010302-6 = "Д-Да, насчёт этого..."
1010302-7 = "Этот ресторан..."
1010302-8 = "Добро пожаловать! Вы вместе? Позвольте проводить вас к столу! Наша уважаемая гостья уже заказала множество блюд, так что наслаждайтесь от души!"
1010302-9 = "...вот такая ситуация..."
1010302-10 = "[s] «Мне, пожалуй, нужно чуть больше контекста.»"
1010302-11 = "Эм, так..."
1010302-12 = "Мне весьма... настойчиво порекомендовали этот ресторан на Променаде Чёрной Черепахи."
1010302-13 = "Я не подумав заказала рекомендацию шефа. И одно за другим начали приносить совершенно невероятные блюда."
1010302-14 = "И вот в чём проблема! Я никак не могу принять столь щедрое гостеприимство."
1010302-15 = "Вот этот суп! Что это за хрустящий ингредиент? Я не могу перестать макать его в соус. Восхитительно!"
1010302-16 = "А у этой жареной зелени вкус сильный, но невероятно насыщенный. Хотя это всего лишь овощи, я продолжаю есть без остановки!"
1010302-17 = "А этот сэндвич с креветкой... жареный во фритюре? А здесь, похоже, рубленое мясо, несколько раз обжаренное. Есть даже золотой жареный рис..."
1010302-18 = "Гэнрюмон действительно согласился оплатить наше пребывание в Шаньхайцзине..."
1010302-19 = "...но могу ли я действительно есть нечто настолько невероятное? Обычному ученику Красной Зимы такой роскошный обед даже не снился."
1010302-20 = "Не становлюсь ли я слишком большой обузой для Гэнрюмона? Не запятнают ли мои действия репутацию Красной Зимы?"
1010302-21 = "[ns] «(Ну, порции и правда довольно большие.)»"
1010302-23 = "[ns] «(Но ингредиенты тут вовсе не высшего класса...)»"
1010302-24 = "С-Сенсей? Скажите хоть что-нибудь! Не стойте молча!"
1010302-25 = "Или... я была права? Я совершенно недостойна такого роскошного обращения!"
1010302-26 = "[s] «Такое количество... совершенно нормально. Правда, всё хорошо.»"
1010302-27 = "Вы уверены? Ваши слова меня успокаивают, но—"
1010302-28 = "Вы хорошо поели? Тогда на десерт попробуйте миндальный тофу! Сочетание сладкого и кислого вас поразит!"
1010302-29 = "Миндальный... тофу? Особый вид тофу? Но он такой упругий... и блестящий..."
1010302-30 = "Понятно! Значит, это пудинг из тофу! Невероятно! Я даже могу съесть два пудинга!"
1010302-31 = "[s] «Да-да.»"
1010302-33 = "...В итоге я переела..."
1010302-34 = "В Шаньхайцзине хороший тон — немного переесть? Правда...? Так интересно узнавать культуру других школ."
1010302-35 = "Но такие вкусные блюда наверняка требуют изысканных ингредиентов."
1010302-36 = "Не могу не спросить: где вы добыли ингредиенты для сегодняшних блюд, шеф?"
1010302-37 = "Ха-ха-ха! Мы не можем так просто раскрывать секреты наших рецептов. А вдруг узнают конкуренты?"
1010302-38 = "Теперь мне ещё любопытнее! Например, суп... Этот хрустящий кусочек наверняка был каким-то особым ингредиентом, верно?"
1010302-39 = "И как жареные овощи получили такой сложный вкус, если там только овощи? Здесь наверняка скрыт какой-то сложный секрет."
1010302-40 = "Я... я клянусь, никому не скажу. Может, вы просто... шепнёте мне?"
1010302-41 = "Ладно-ладно. Как я могу отказать? Слушайте внимательно."
1010302-42 = "Первым блюдом был суп из акульих плавников с древесными грибами."
1010302-43 = "Некоторые древесные грибы по текстуре похожи на акульи плавники и могут их заменять."
1010302-44 = "Если вы почувствовали что-то особенно изысканное... это были наши специальные белые древесные грибы!"
1010302-45 = "Только белый древесный гриб, выросший в тени пятисотлетнего дерева и ни разу не увидевший солнечного света, может заменить акулий плавник! Ха-ха-ха!"
1010302-46 = "С-Серьёзно?!"
1010302-47 = "[s3] «(А, фирменный блеф Шаньхайцзина.)»\n[s4] «(Посмотрю, чем всё закончится.)»"
1010302-50 = "Даже бок-чой! Только самый чистый и свежий бок-чой, выращенный силой собранной утренней росы, способен дать такой вкус!"
1010302-51 = "Мэнбоша приготовлена из гигантских креветок, которых можно поймать лишь в одном месте океана. Температура там круглый год неизменна, а глубина ни слишком большая, ни слишком маленькая!"
1010302-52 = "Соевый соус из семян, которые культивировали тысячу лет! Грудка феникса! Эти блюда приготовлены из ингредиентов, которых больше нигде в Кивотосе не найти! Ха-ха-ха!"
1010302-53 = "В-Вы серьёзно?!"
1010302-55 = "Ох... Что нам делать, Сенсей? Не могу поверить, что шеф настоял, чтобы мы заплатили только обычную цену за такую роскошь, называя нас «важными гостями»."
1010302-56 = "Я и правда стала невыносимой обузой и для Гэнрюмона, и для Красной Зимы!"
1010302-57 = "[s5] «Ладно-ладно. Я расскажу тебе правду.»\n[s6] «Не волнуйся. Шеф просто блефовал.»"
1010302-60 = "Б-Блефовал?! Но зачем?!"
1010302-61 = "А... Это такой юмор Шаньхайцзина? Значит, ингредиенты были самыми обычными?!"
1010302-62 = "Какое облегчение. Но подумать только, из обычных ингредиентов они смогли получить такой невероятный вкус..."
1010302-63 = "Теперь я понимаю. Истории об ингредиентах могли быть блефом, но мастерство повара — нет."
1010302-64 = "В центре любой лжи есть доля правды! Ха-ха! Сегодня я узнала нечто новое."
1010302-65 = "Отлично! Тогда я продолжу своё гастрономическое путешествие!"
1010302-66 = "Столько всего узнала всего в одном ресторане. Представьте, сколько ещё открою в других местах!"
1010302-67 = "Вы пойдёте со мной, правда, Сенсей?"
1010302-68 = "[s] «Ох. Эм. Кажется, я не могу отказать...»"
1010302-69 = "Отлично! Следующая остановка... вон тот переулок!"
1010302-72 = "Это...?!"
1010302-73 = "Ха-ха-ха. Вы готовы к тому, что ждёт вас дальше?"
1010302-74 = "Добро пожаловать в переулок Ван Дун Чэн! Наше фирменное блюдо — шашлычки из насекомых, только из лучших жареных тварюшек!"
1010302-75 = "[s] «М-Марина! Ты точно справишься?!»"
1010302-76 = "..."
1010302-77 = "Я же сказала. Теперь я всё понимаю, Сенсей."
1010302-78 = "Это очередной блеф, принятый в Шаньхайцзине."
1010302-79 = "Эти блюда только выглядят как насекомые, а внутри наверняка всевозможные вкусные начинки!"
1010302-80 = "[s] «Я... насчёт этого не уверен...»"
1010302-81 = "Поверьте мне, Сенсей! Вперёд — купим все виды шашлычков!"
1010302-82 = "Пойдём! ГРА-А-А!"
1010302-84 = "...Шашлык из скорпиона? Нет, правильнее назвать его шашлыком «в форме скорпиона»."
1010302-85 = "Сейчас попробую— Гх?!"
1010302-86 = "Ч-Что?! Это настоящий скорпион! Т-То есть это действительно шашлычки из насекомых?!"
1010302-87 = "Но... на удивление съедобно. Панцирь твёрдый, зато хрустящий и пикантный."
1010302-88 = "С-Следующее... шашлык из морской звезды?! Их тоже жарят во фритюре?!"
1010302-89 = "Эти бугорки снаружи особенно настораживают... но мы должны продолжать!"
1010302-90 = ""
1010302-92 = ""
1010302-93 = "...Немного горчит. Мякоть по вкусу примерно как у обычной рыбы..."
1010302-95 = "Несмотря ни на что, Марина продолжала есть один шашлык за другим: личинка цикады, гусеница, жук-усач и многоножка..."
1010302-96 = "Что именно Марина вынесла из этого опыта... я решил не спрашивать."
