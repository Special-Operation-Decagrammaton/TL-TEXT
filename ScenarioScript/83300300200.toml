[translation]
83300300200-5 = ""
83300300200-6 = "Глава префектов! Где вы были? Мы вас повсюду искали!"
83300300200-7 = "Я только что вернулась после проверки одного дела, Иори. Что случилось?"
83300300200-8 = "Вы видели нарушителей, которых мы только что разогнали? Они собрались вокруг нашего штаба."
83300300200-9 = "Мы постоянно имеем дело с подстрекателями, разве нет? Здесь у всех горячая кровь."
83300300200-10 = "Ну да, это, конечно, правда..."
83300300200-11 = "Но этот беспорядок ощущается иначе, чем обычно."
83300300200-12 = "Как и сказала Чинацу. На нас напали сразу после возвращения с тренировки, будто нас специально поджидали в засаде."
83300300200-13 = "Противники знали наш график тренировок... и, думаю, действовали организованно."
83300300200-14 = "По их слаженности видно, что они выполняли чьи-то приказы."
83300300200-15 = "Они явно пытались прижать нас и не дать перехватить инициативу..."
83300300200-16 = "И вдобавок очень быстро отступили, как только поняли, что бой складывается не в их пользу."
83300300200-17 = "...То есть ты считаешь, что они напали ради какой-то общей цели... и за нарушителями стоял кто-то ещё?"
83300300200-18 = "Да. Уверена, кто-то нанял их и объяснил, как именно нас атаковать."
83300300200-19 = "Нарушители устроили нам засаду именно сейчас, из всех возможных моментов..."
83300300200-20 = "Иори, Чинацу. Скажите, куда ушли нарушители. Я разберусь сама."
