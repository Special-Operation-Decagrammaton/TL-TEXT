[translation]
1002803-1 = "Жизнь кроликов"
1002803-2 = "Усталость от нескончаемой работы уже не позволяла мне продолжать заниматься делами."
1002803-3 = "Мне просто нужно было подышать свежим воздухом, поэтому я отправился к ближайшей набережной."
1002803-6 = "О? Это вы, Господин?"
1002803-7 = "[s1] «...?»\n[s2] «Этот голос похож на...»"
1002803-8 = ""
1002803-9 = ""
1002803-12 = ""
1002803-13 = "Приве-е-ет! Вот так встреча, Господин!"
1002803-14 = "Вы тоже пришли узнать о жизни кроликов?"
1002803-15 = "[s] «Асуна?»"
1002803-16 = "Я? А что со мной?"
1002803-17 = "Почему я здесь? А что не так с моей одеждой?"
1002803-18 = "Хахаха! Вы разве не слушали? Я пришла сюда посмотреть, как живут кролики!"
1002803-19 = "Чтобы понять кроликов, я должна сама стать кроликом! Ну как? Умно, да?"
1002803-20 = "А теперь смотрите, Господин! Здесь растёт белый клевер! Идеальная среда для кроликов!"
1002803-21 = "А?"
1002803-22 = "Другие люди смотрят? Ну и что?"
1002803-23 = "Это же очевидно, Господин! Будь здесь настоящий кролик, вы бы тоже смотрели."
1002803-24 = "Вы не это имели в виду?"
1002803-25 = "Тогда что?"
1002803-26 = ""
1002803-28 = ""
1002803-29 = "Неужели...?"
1002803-30 = "Случайно..."
1002803-31 = "Вы тоже хотели стать кроликом, Сенсей?"
1002803-32 = "[s3] «...Как ты вообще пришла к такому выводу?»\n[s4] «Какая часть нашего разговора навела тебя на эту мысль?»"
1002803-33 = "Только скажите слово, Господин! Я найду вам наряд, который идеально подойдёт!"
1002803-34 = "Только скажите слово, Господин! Я найду вам наряд, который идеально подойдёт!"
1002803-35 = "Всё в порядке?"
1002803-36 = "Вас устраивает не быть кроликом?"
1002803-37 = "Хахаха! Почему вы так растерялись? Я никогда вас не пойму, Господин!"
1002803-38 = "Кем вы вообще можете быть, если не кроликом? Наверное, никем, кроме Господина..."
1002803-39 = "Подождите."
