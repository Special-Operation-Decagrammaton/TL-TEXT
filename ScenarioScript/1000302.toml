[translation]
1000302-1 = "Новый мерч!"
1000302-2 = "Класс Тринити"
1000302-3 = "О, Сенсей! Ты пришёл!"
1000302-4 = "Ты ведь видел мой MomoTalk, да? У меня появился новый мерч."
1000302-5 = "Смотри! Та-дам!"
1000302-6 = "Это пушистая подушка для шеи в форме Wavecat!"
1000302-7 = "Теперь можно подремать где угодно!"
1000302-8 = "[s] «...Волновой кот?»"
1000302-9 = "А...? Ты никогда не слышал о Wavecat, Сенсей?"
1000302-10 = "Это длинный кот из Momo Friends. Они с Пероро лучшие друзья!"
1000302-11 = "Wavecat танцует не так хорошо, зато его движения очень обаятельные, поэтому фанаты Momo Friends его обожают."
1000302-12 = "А эта маленькая сова на голове Wavecat зовётся Big Brother!"
1000302-13 = "Глаза Big Brother становятся такими огромными, что он может увидеть что угодно — любую истину! Поэтому студенты любят брать мерч с ним на экзамены как талисман."
1000302-14 = "А эта квокка здесь — мистер Николай..."
1000302-15 = "Ой. Прости, что так разошлась!"
1000302-16 = "Когда начинаю говорить о Momo Friends, меня всегда заносит..."
1000302-17 = "[s] «Не переживай. Я тебя понимаю.»"
1000302-18 = "Спасибо, мне стало легче..."
1000302-19 = "...но многие мои друзья подшучивают надо мной, когда я говорю о Momo Friends."
1000302-20 = "Они смеются над персонажами за то, что те странные и чудные..."
1000302-21 = "Хотя именно в этом часть их очарования. Персонажи, которые немного отличаются от остальных, интереснее."
1000302-22 = "Я всегда была такой обычной... поэтому восхищаюсь этими персонажами за их непохожесть."
1000302-23 = "[s] «Мне тоже нравятся странные персонажи.»"
1000302-24 = "Х-Хаха... Правда? Немного неловко слышать, что у нас есть что-то общее."
1000302-25 = "О, Сенсей. Хочешь попробовать мою подушку Wavecat?"
1000302-26 = "Она такая мягкая и приятная!"
1000302-27 = ""
1000302-28 = ""
1000302-29 = ""
1000302-30 = "Хаха. Тебе очень идёт! Ты похож на нового персонажа Momo Friends!"
1000302-31 = "Ну как? Не хочется прилечь и вздремнуть?"
1000302-32 = "Прости, но мне придётся забрать её обратно. Достать её было нелегко!"
1000302-33 = ""
1000302-34 = "Но если когда-нибудь захочешь одолжить... я не против."
