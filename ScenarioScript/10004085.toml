[translation]
10004085-1 = "Эпизод 8;Шун и Шунлинь"
10004085-2 = "Сад Цветущей Сливы"
10004085-3 = "Инструктор, они снова дерутся!"
10004085-4 = "Эй, прекратите. Разве мы все не друзья в Саду сливового цветка?"
10004085-5 = "Почему вы дрались?"
10004085-6 = "Она дразнила меня за то, что я низкая!"
10004085-7 = "Но она первая начала и сказала, что мои очки уродливые!"
10004085-8 = "Нехорошо смеяться над внешностью. А теперь извинитесь друг перед другом и помиритесь."
10004085-9 = "Прости. На самом деле мне очень нравятся твои очки, просто я постеснялась сказать и вместо этого нагрубила."
10004085-10 = "Я тоже прости. На самом деле я хочу быть выше."
10004085-11 = "Хочу скорее вырасти и стать взрослой, как Шун."
10004085-12 = "Ага, я тоже. Шун такая высокая и умная. Я так завидую."
10004085-13 = "Шун, как мне стать такой же высокой, как ты?"
10004085-14 = ""
10004085-16 = "(Ха-ха. Ещё совсем недавно я сама говорила, что хочу снова стать ребёнком. Немного странно видеть детей, которые так хотят быстрее вырасти.)"
10004085-17 = ""
10004085-19 = "Я знаю, вы не поймёте, но высокий рост не означает, что со мной происходят только хорошие вещи."
10004085-20 = "Иногда быть высокой неудобно."
10004085-21 = "А что плохого в высоком росте? Можно доставать вещи с высоких полок и залезать на чердак Сада сливового цветка!"
10004085-22 = "Когда переношу вещи, это удобно, но я быстро устаю, а иногда ударяюсь головой о верх дверной рамы."
10004085-23 = "Знаете, иногда я скучаю по тому времени, когда была маленькой, как вы."
10004085-24 = "Тогда лучше оставаться молодой и маленькой?"
10004085-25 = "Не знаю. Я сказала, что высокий рост бывает неудобен, но это не значит, что он всегда плох."
10004085-26 = "Почему? Расскажи!"
10004085-27 = "Эм..."
10004085-28 = "Это..."
10004085-29 = "Хи-хи. Это секрет! Когда придёт время, сами узнаете."
10004085-30 = "Угх..."
10004085-31 = "Ну Шун!"
10004085-32 = "[s1] «Привет, Шун.»\n[s2] «Как всегда занята?»"
10004085-33 = "Какая неожиданность, Сенсей. Какими судьбами?"
10004085-34 = "Какая неожиданность, Сенсей. Какими судьбами?"
10004085-35 = "О, вы по дороге купили детям сладости на Променаде Чёрной Черепахи. Огромное спасибо."
10004085-36 = "Раз уж вы здесь, почему бы немного не отдохнуть за чашкой чая перед уходом?"
10004085-37 = "Я... давно хотела с вами поговорить."
10004085-38 = "[s3] «Прости, но у меня много работы в Шале.»\n[s4] «Вообще-то мне уже пора.»"
10004085-41 = "Что? Вы уже уходите?"
10004085-42 = "Уф, не-е-ет!"
10004085-43 = "Я теперь буду с вами добрее, так что, пожалуйста, отдохните хоть чуточку?"
10004085-44 = "А?"
10004085-45 = ""
10004085-47 = ""
10004085-48 = "[ns5] «Э-Это... Шунлинь?»\n[ns6] «Побочные эффекты всё ещё остались?»"
10004085-49 = "Нет. Я всё ещё Шун."
10004085-50 = "Нет. Я всё ещё Шун."
10004085-51 = "Но иногда строгому инструктору Шаньхайцзина тоже хочется вести себя как ребёнок."
10004085-52 = "Так что сегодня..."
10004085-53 = "...позвольте мне немного подурачиться!"
10004085-55 = "После этого я ещё долго пытался отбиться от Шун, которая по-детски цеплялась за мою руку."
10004085-56 = "Игра в догонялки в Неверленде"
