[translation]
1013408-1 = "Возвращение героя?"
1013408-2 = "...Сколько времени прошло с тех пор, как мы выиграли финальную битву на Стальном континенте и вернулись к обычной жизни?"
1013408-3 = "МомоТолк Арис показался немного необычным, поэтому я поспешил к месту, которое она мне отправила."
1013408-6 = "Добравшись туда, я увидел перед собой внушительное море людей. Казалось, в толпу невозможно даже протиснуться."
1013408-7 = "Оказалось, там проходила очень крупная игровая выставка."
1013408-8 = ""
1013408-10 = ""
1013408-11 = ""
1013408-12 = ""
1013408-13 = ""
1013408-14 = ""
1013408-15 = ""
1013408-16 = "...Через некоторое время я понял, что просто бродить вокруг в поисках Арис бесполезно."
1013408-17 = "Поэтому я отправил ей сообщение со своей геолокацией и написал, что уже пришёл."
1013408-22 = "Сенсей?"
1013408-23 = "Где вы? Я прямо здесь!"
1013408-24 = "[ns1] «Арис?!»\n[ns2] «Простите, пропустите...»"
1013408-27 = "Ах! Сенсей! Я вас нашла!"
1013408-28 = "Я сама к вам приду, так что, пожалуйста, не двигайтесь!"
1013408-29 = ""
1013408-32 = ""
1013408-33 = "Бум-бум-бум!"
1013408-34 = "Сенсей присоединился к группе!"
1013408-35 = "[s3] «Это же...?!»\n[s4] «Аби-Эшух?!»"
1013408-38 = "Верно! Герой Арис полностью возроди—"
1013408-39 = ""
1013408-41 = ""
1013408-42 = ""
1013408-43 = ""
1013408-44 = ""
1013408-45 = ""
1013408-46 = "Она только что полетела?!"
1013408-47 = "Как это работает? Это уже далеко за пределами обычного косплея!"
1013408-48 = "Это из какой-то игры? Из какого вы стенда?!"
1013408-50 = "И-и! Я забыла, что убегала!"
1013408-51 = "Я объясню позже, а пока, пожалуйста, бегите со мной!"
1013408-53 = ""
1013408-56 = ""
1013408-57 = "...Итак, Отдел разработки игр пришёл с новой игрой!"
1013408-58 = "Я слышала, что хорошая реклама — ключ к тому, чтобы выделиться среди других стендов..."
1013408-59 = "Но даже хорошего бывает СЛИШКОМ много!"
1013408-60 = "Все смотрели только на меня, а не на наш стенд!"
1013408-61 = "Из-за этого весь первоначальный замысел потерял смысл!"
1013408-62 = "[s5] «Логично. Летающая меха-девушка довольно бросается в глаза...»\n[s6] «Я бы тоже на сто процентов подошёл посмотреть.»"
1013408-65 = "И ты, Сенсей?!"
1013408-66 = "Если я буду разговаривать со всеми в толпе, то никогда не доберусь обратно до клубной комнаты!"
1013408-67 = "Она полетела туда!"
1013408-68 = "Можно вас сфотографировать в какой-нибудь позе?"
1013408-69 = "А-а! Нас обнаружили!"
1013408-70 = ""
1013408-72 = ""
1013408-73 = ""
1013408-74 = ""
1013408-76 = "М-Медленно, по одному, пожалуйста! А-А-А-А-А!"
1013408-77 = ""
1013408-79 = ""
1013408-82 = "Остаток этого очень суматошного дня я провёл на мероприятии вместе с Арис."
1013408-83 = ""
1013408-90 = "...К-Как-то мы всё-таки добрались до конца..."
1013408-91 = "Кажется, мои накопители памяти перестали работать где-то на полпути."
1013408-92 = "[s7] «Хорошая работа...»\n[s8] «Я помню только то, что мы сделали кучу фотографий...»"
1013408-93 = ""
1013408-94 = ""
1013408-97 = "[ns9] «О, кстати! Что произошло?!»\n[ns10] «Я думал, Аби-Эшух уже не подлежит восстановлению!»"
1013408-100 = "Ах, в этой суматохе я забыла объяснить!"
1013408-101 = "Бум-бум-бум! Герой Арис полностью возродилась!"
1013408-102 = "...По крайней мере, мне хотелось бы так сказать."
1013408-103 = "Но это реплика."
1013408-104 = "Хотя не полностью! В ней есть часть оригинала!"
1013408-105 = "Мне каким-то образом удалось найти остатки Аби-Эшуха до того, как мы покинули Стальной континент."
1013408-106 = "Это был всего лишь маленький фрагмент. Он помещался у меня на ладони."
1013408-107 = "[s11] «Но ты всё равно хотела вернуться вместе с ним.»\n[s12] «Ведь Аби-Эшух тоже твой друг.»"
1013408-108 = ""
1013408-109 = ""
1013408-111 = ""
1013408-112 = "Да, именно так, Сенсей!"
1013408-113 = "Я показала его всем, кому могла, в Миллениуме, надеясь, что его получится починить."
1013408-114 = ""
1013408-115 = ""
1013408-116 = ""
1013408-117 = ""
1013408-118 = ""
1013408-119 = ""
1013408-121 = ""
1013408-122 = ""
1013408-123 = "Все отвечали одно и то же: повреждения слишком серьёзные. Вернуть Аби-Эшух уже невозможно."
1013408-124 = "Но мне предложили другой вариант: если я очень подробно всё объясню, они смогут воссоздать его настолько точно, насколько возможно!"
1013408-125 = "Вот так Аби-Эшух и вернулся!"
1013408-126 = "...Хотя от оригинала в нём всего лишь маленький фрагмент."
1013408-127 = "И он намного слабее... поэтому я не могу летать очень быстро или долго."
1013408-128 = "Кроме того, он очень хрупкий, поэтому меня много раз предупредили, что сражаться в нём нельзя."
1013408-129 = "[s13] «Всё-таки ничто не сравнится с оригиналом.»\n[s14] «Наверное, обидно наконец вернуть его и получить такое.»"
1013408-132 = "...?"
1013408-133 = "Я совсем так не считаю."
1013408-134 = "После финальной битвы с повелителем демонов силы героя часто оказываются запечатаны. В наши дни это почти клише."
1013408-135 = "И ещё..."
1013408-137 = ""
1013408-138 = ""
1013408-139 = ""
1013408-140 = ""
1013408-142 = "Сегодня я впервые снова предстала перед всеми вместе с Аби-Эшухом."
1013408-143 = "И все говорили, что Аби-Эшух крутой и что он им нравится."
1013408-144 = "Мне кажется, это намного лучше, чем умение летать или сила, способная победить повелителя демонов."
1013408-145 = "Поэтому сегодня я была очень счастлива!"
1013408-147 = "Взявшись за руки, мы вернулись в клубную комнату Отдела разработки игр."
1013408-148 = "...Даже по дороге несколько прохожих попросили сфотографировать Арис."
