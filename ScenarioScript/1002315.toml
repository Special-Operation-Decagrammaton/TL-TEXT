[translation]
1002315-1 = "Пляж на закате"
1002315-2 = "На пляже, на закате"
1002315-4 = "Сдавайся сейчас!"
1002315-5 = "Сдашься сейчас — и страдать будешь... не слишком сильно!"
1002315-6 = ""
1002315-9 = "У-Угх! Не издевайся надо мной!"
1002315-10 = "Я пошла в тот ресторан только потому, что слышала, будто там готовят модные фьюжн-блюда. Но какого чёрта какигори С ВАСАБИ?!"
1002315-11 = "И ладно, допустим, в какой-то безумной вселенной я ещё могла бы это простить! Но я НЕ потерплю, чтобы соус для якисобы заменяли клубничным джемом! Ни за что!"
1002315-12 = "Это уже за гранью! Я не позволю этому проклятому ресторану так легко отделаться!"
1002315-14 = "Б-Без экспериментов прогресса не бывает..."
1002315-15 = "[s] «Может, это уже СЛИШКОМ экспериментально...»"
1002315-16 = "Эй! Не сочувствуй преступникам! У Дисциплинарного комитета одна работа — всего одна!"
1002315-17 = "Веди, Сенсей! Покончим с этим!"
1002315-18 = "[s] «Похоже, выбора у меня нет!»"
1002315-19 = ""
1002315-20 = ""
1002315-21 = "Угх! Так просто я не сдамся!"
1002315-22 = ""
1002315-24 = ""
1002315-28 = "А-Ай! Это... больно!"
1002315-29 = ""
1002315-31 = ""
1002315-33 = "Д-Думаешь, мы просто так это стерпим?!"
1002315-34 = ""
1002315-36 = ""
1002315-38 = "[ns] «Граната...!»"
1002315-39 = "Хмф! Не выйдет!"
1002315-40 = ""
1002315-42 = ""
1002315-43 = ""
1002315-46 = "[ns1] «В сторону океана!»\n[ns2] «Отлично, Иори!»"
1002315-53 = "[ns] «...А.»"
1002315-56 = "Меня полностью окатило волной морской воды."
1002315-58 = ""
1002315-59 = "Фух. Вот и работа закончена."
1002315-60 = "Отлично, Сенсей—"
1002315-61 = "П-Почему ты весь мокрый? Ты что, решил поплавать прямо посреди боя?!"
1002315-62 = "[s3] «Та граната, которую ты отбила, взорвалась в воде...»\n[s4] «Меня накрыло целой волной...»"
1002315-65 = "Ах..."
1002315-66 = "Т-Точно... Я же отбила её в сторону океана..."
1002315-67 = "Ты не ранен? Всё нормально?"
1002315-68 = "[s] «Ну, если не считать того, что я промок насквозь.»"
1002315-69 = "Это хорошо..."
1002315-70 = "Но что теперь делать? Даже летом вечера на пляже бывают холодными."
1002315-71 = "Если не высушить тебя, ты заболеешь."
1002315-72 = "Запасной одежды у тебя ведь нет, Сенсей?"
1002315-73 = "[s] «В отеле...»"
1002315-74 = ""
1002315-76 = ""
1002315-77 = ""
1002315-78 = "Ладно. Пока воспользуйся этим."
1002315-79 = ""
1002315-81 = ""
1002315-83 = "[ns] «Это...?»"
1002315-85 = "[ns] «...твоё одеяло?»"
1002315-86 = "Э-Это единственный вариант! Тебе не во что переодеться!"
1002315-87 = "И я не могу просто позволить тебе заболеть."
1002315-88 = "Так что закутайся в него и согрейся, пока мы не вернёмся в отель!"
1002315-89 = "[s] «Тёплое...»"
1002315-90 = "Ага. Это моё любимое одеяло, так что обращайся с ним осторожно!"
1002315-91 = "[s] «Это стандартное снаряжение Дисциплинарного комитета?»"
1002315-92 = "Не совсем. Мы получили его как... сувенир после моего первого тренировочного лагеря Дисциплинарного комитета."
1002315-93 = "Оно было таким пушистым и тёплым, что я сразу к нему привязалась."
1002315-94 = "Когда я в стрессе или раздражена, просто укрываюсь им и чувствую ткань... Это помогает расслабиться."
1002315-95 = "[s] «Что-то вроде твоего успокаивающего одеяла.»"
1002315-96 = "Я-Я бы не сказала именно так..."
1002315-97 = "[s] «Спасибо, что дала мне воспользоваться такой дорогой тебе вещью.»"
1002315-98 = "..."
1002315-99 = "Хотя оно уже немного потрёпанное..."
1002315-100 = "[s] «Для чего ты обычно его используешь?»"
1002315-101 = "Обычно просто как плед на колени... иногда сижу или лежу на нём..."
1002315-102 = "А, ещё иногда сплю на нём в клубной комнате."
1002315-103 = ""
1002315-105 = "[ns] «Теперь, когда ты сказала, кажется, я чувствую твой запах.»"
1002315-106 = "Ч-Что? Я постоянно его стираю! Оно не может пахнуть!"
1002315-107 = "Что за чушь ты несёшь?! С чего вдруг?!"
1002315-108 = "[ns5] Понюхать одеяло.\n[ns6] Уткнуться носом в одеяло и глубоко вдохнуть."
1002315-111 = "Ч-Что вы делаете?!"
1002315-112 = "[s] «Запах Иори!!»"
1002315-113 = "ОТДАЙ ЕГО МНЕ!!!"
1002315-115 = "Иори отобрала у меня одеяло, а я в итоге простудился..."
