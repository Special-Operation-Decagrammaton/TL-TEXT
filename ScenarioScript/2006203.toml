[translation]
2006203-1 = "Persuasion is also chemistry!"
2006203-2 = "Room 183 Special Class"
2006203-3 = "(Came to Room 183 with snacks to cheer up Erina)"
2006203-9 = "Ugh... Just text. Can they at least put in some illustrations...?"
2006203-10 = "\"Torque is... the force that acts around a fixed axis of rotation --\""
2006203-11 = "I see... Haah..."
2006203-12 = "\"...The longer the distance from the fulcrum, the greater the rotational force becomes.\""
2006203-13 = "\"Using this principle --\""
2006203-14 = "Ah... I don't wanna do this..."
2006203-15 = "[s1] \"You are so cool, Erina!\"\n[s2] \"You are doing your best with studies you hate, amazing!\""
2006203-18 = "Huh, Sensei? When did you get here?"
2006203-19 = "All right! Since Sensei is here, studies for today end right here!"
2006203-20 = "[s3] \"I came here to support your studies!\"\n[s4] \"Did I interrupt you instead!?\""
2006203-23 = "Ahaha! Just kidding, kidding! You really give the best reactions!"
2006203-24 = "It has almost been 8 hours, and I was just thinking about taking a break."
2006203-25 = "[s] \"You are so serious, you would not think you hate studying...\""
2006203-26 = "I really hate studying, but I like knowledge. Ehehe♪"
2006203-27 = "With knowledge, you can do more things, and your persuasiveness increases!"
2006203-28 = "[s] \"Persuasiveness? What kind of studying did you do?\""
2006203-29 = "Uhm, well~"
2006203-30 = "Ah... What was it again, what do you call it..."
2006203-31 = "Right! I was studying pro wrestling moves! #nFound something good in the wastepaper collection box, so I brought it!"
2006203-32 = "When I could not persuade someone, I always settled things with wrestling, but --"
2006203-33 = "Lately I feel like my technique is lacking, and since it is always the same moves, I feel like people are starting to read my patterns~ So I was studying!"
2006203-34 = "I have not seen any photos or videos, so I only understand it vaguely..."
2006203-35 = "Ah, that is right! Sensei, want to do some pro wrestling with me?"
2006203-36 = "[s] \"Eh?\""
2006203-37 = "Of course I will not go all out! I just want to try out the moves!"
2006203-38 = "It would really-really help if you could be my partner! You will help me, right, right? Sensei?"
2006203-39 = "[s5] \"Ah... Y-Yeah...\n[s6] (I must protect this honest smile.)"
2006203-42 = "Yay! Sensei is the best! Truly the best!"
2006203-43 = "Then, let us start with the figure-four leg lock I was most curious about!"
2006203-44 = "Lie on your back and raise your left leg! Yes, relax your muscles~"
2006203-45 = "[s] \"O-Okay...\""
2006203-47 = "Then grab Sensei is left leg with your right hand and rotate clockwise."
2006203-48 = "Twist Sensei is leg into the shape of the number 4, and put my right leg in the middle of the 4..."
2006203-49 = "Lastly, fall backward and done~! Oh, it really looks like a 4!"
2006203-50 = "Are you okay? Tell me if it hurts!"
2006203-51 = "[s7] \"It does not hurt... but!\"\n[s8] \"Maybe you can let go now!?\""
2006203-54 = "Yes, it is already fine! It was easier than I thought, so I will use it in actual combat!"
2006203-56 = "As expected, having Sensei help is the best!"
2006203-57 = "Well then, I will take it off~"
2006203-62 = "...Huh?"
2006203-66 = "Hmm~? Huh-huh~?"
2006203-67 = "It kinda... will not come off..."
2006203-68 = "A-Ahaha! Do not worry! I also studied topology!"
2006203-69 = "With this shape, I saw it in a book! Theoretically, it should be undoable!"
2006203-70 = "[s] \"Oh!! How do you do it!?\""
2006203-71 = "That is~!"
2006203-75 = "..."
2006203-76 = "Waaaaah! It was written in the second half of the book, so I do not know! #nI should have read it all the way to the end~!"
2006203-77 = "That is it! Let us borrow the power of chemistry at a time like this! #nIf we apply plenty of lubricant, the friction between the tangled legs should decrease and come off!"
2006203-78 = "Named the! Slippery Oil Operation! Here we go!!"
2006203-79 = "[ns] \"That makes it even worse--!!\""
2006203-81 = "(Managed to calm Erina down)"
2006203-82 = "(Remembered that it could be disassembled by reversing the assembly steps, and managed to escape)"
