[translation]
2006203-1 = "Persuation is Chemistry too!"
2006203-2 = "Special Class 183"
2006203-3 = "(I arrived at 183 with refreshments, hoping to cheer Erina up.)"
2006203-9 = "Ugh... Nothing but words. They could've at least put in some pictures..."
2006203-10 = "\"Torque is... a force acting around a fixed axis of rotation...\""
2006203-11 = "I see... Sigh..."
2006203-12 = "\"...The greater the distance from the lever's fulcrum, the greater this rotational#nforce becomes.\""
2006203-13 = "\"By utilizing this principle...\""
2006203-14 = "Aaaagh... I'm so tired of thisss..."
2006203-15 = "[s1] \"Looking good, Erina!\"\n[s2] \"Great job! Even though you hate it, you're still studying hard!\""
2006203-18 = "Huh, Sensei? When'd you get here?"
2006203-19 = "'Kay! Since you're here, that's enough studying for one day!"
2006203-20 = "[s3] \"But I only came here to cheer you on!\"\n[s4] \"Did I end up ruining your study session instead!?\""
2006203-23 = "Ahahah! I was just kiddin'! Your reactions are too good!"
2006203-24 = "I've actually been studying for eight hours now, so it seemed like a good time to#nstop."
2006203-25 = "[s] \"Awfully diligent for someone who seemingly abhors studying...\""
2006203-26 = "I haaate studying, but I suuuure love gaining knowledge. Ehehe. ♪"
2006203-27 = "The more you know, the more things you can do. Plus, you can also become more persuasive too!"
2006203-28 = "[s] \"Persuasive? What kind of studying are you doing?\""
2006203-29 = "Umm, let's seeee..."
2006203-30 = "Agh... What was it called again...?"
2006203-31 = "Right! I was studying pro wrestling techniques! #nI saw something that looked promising in the paper recycling bin, so I nabbed it#nfor myself!"
2006203-32 = "Whenever we can't persuade each other, we always end up wrestling to settle#nthings..."
2006203-33 = "BUT, I feel like my techniques have been lacking recently. #nI'm always throwing out the same moves, so it feels like I'm being read like an#nopen book at this point... So I decided to study up!"
2006203-34 = "I haven't seen any pictures or videos though, so I only have a vague#nunderstanding of it..."
2006203-35 = "Ah, that's it! Wanna do some pro wrestling together?"
2006203-36 = "[s] \"Huh?\""
2006203-37 = "I'll hold back, of course! I just wanna try out the techniques!"
2006203-38 = "It'd reaaaally help me out if you'd act as my sparring partner! You'll lend me#na hand, right? Sensei?"
2006203-39 = "[s5] \"Ah... S-sure...\"\n[s6] (Let's protect this honest smile of hers.)"
2006203-42 = "Let's goo! You're the best! The number one best!"
2006203-43 = "'Kay, then let's start from the one I'm most curious about: the figure-four hold!"
2006203-44 = "Lay on your back for me with your left leg up! 'Kay, now relaaaax!"
2006203-45 = "[s] \"G-got it...\""
2006203-47 = "Then I grab your left foot with my right hand and rotate clockwise."
2006203-48 = "I'll twist your legs into the shape of a 4, then stick my left leg into the center of it..."
2006203-49 = "And finally, I roll backwards aaand! Whoooa, it really does look like a 4!"
2006203-50 = "Are you doing good over there? Just tell me if it hurts, 'kay?"
2006203-51 = "[s7] \"It doesn't hurt... BUT!\"\n[s8] \"I think it's about time you let me go!\""
2006203-54 = "Sure thing, I've done enough! That was easier than I thought, so I think I'll try#nusing it in an actual fight!"
2006203-56 = "It really is the best having you around to help me!"
2006203-57 = "'Kay, I'll undo it noww!"
2006203-62 = "...Eh?"
2006203-66 = "Huh? Whuh huh?"
2006203-67 = "I... I can't undo it..."
2006203-68 = "A-ahahah! There's no need to worry! I've studied topology before!"
2006203-69 = "I've seen this shape before in a book! Theoretically, it should be possible to#nundo it!"
2006203-70 = "[s] \"Oooh! How do you do it then!?\""
2006203-71 = "Well, you seee!"
2006203-75 = "..."
2006203-76 = "Uwaaaagh! I never read the second half of the book, so I dunno! #nI really should've read the entire thing!"
2006203-77 = "That's it! I'll just use the good 'ol power of chemistry! #nIf I apply lots of lube to where our legs are caught, the friction between them#nshould drop!"
2006203-78 = "I dub thee! Operation Slippy-oily! It's go time!!"
2006203-79 = "[ns] \"Absolutely NOT!!\""
2006203-81 = "(I somehow calmed Erina down.)"
2006203-82 = "(After remembering that we could undo it by reversing the steps, we somehow#nmanaged to break free.)"