[translation]
10042055-2 = "Я... хотела сказать с десяток разных вещей, но все они мгновенно вылетели из головы."
10042055-3 = "И ни одна из них не была хорошей, если вам интересно."
10042055-4 = "Как... КАК вообще можно это объяснить?"
10042055-6 = "...Может, скачок роста?"
10042055-7 = "Фуука?!"
10042055-8 = "[ns1] «У меня голова болит...»\n[ns2] «Ладно, пусть будет так.»"
10042055-11 = "Не думаю, что дальнейшие вопросы хоть что-нибудь нам дадут."
10042055-12 = "Хотя, должна признать, это интригует."
10042055-13 = "Как ты можешь быть такой спокойной?!"
10042055-14 = "...Хм, справедливый вопрос. Мы все до сих пор говорили, что ничего серьёзного не происходит..."
10042055-15 = "Но..."
10042055-16 = "...кажется, теперь всё стало серьёзно."
