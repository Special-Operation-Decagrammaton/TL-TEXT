[translation]
1010805-1 = "После наступления темноты"
1010805-2 = "Я пришёл в Миллениум, чтобы выслушать студентов и помочь им с их проблемами."
1010805-3 = "Пока я давал советы одному студенту за другим, стало гораздо позже, чем я ожидал."
1010805-5 = "Сенсей, спасибо, что поговорили с нами сегодня!"
1010805-6 = "Благодаря вам я теперь гораздо лучше представляю, как спроектировать мусорные баки, которые мы установим на территории школы."
1010805-7 = "[s1] «Рад, что смог помочь.»\n[s2] «Но давайте впредь обойдёмся без взрывных функций.»"
1010805-10 = "Простите, что задержали вас допоздна."
1010805-11 = "Вы здесь ещё с обеда. Вам удалось хоть что-нибудь поесть?"
1010805-12 = "[s] «Всё нормально. Поем, когда вернусь в Шале.»"
1010805-13 = "Тогда хорошо. Берегите себя."
1010805-17 = "[ns3] «(Что бы я ни говорил, я вообще-то ужасно голоден...)» \n[ns4] «(Может, быстро перекусить в ближайшем магазине?)»"
1010805-21 = "Добро пожаловать в отделение Ангел 24 при учебном центре Миллениума."
1010805-22 = "У вас... салат с курицей и тост. Если будете есть сейчас, я могу подогреть тост!"
1010805-23 = "[s] «Да, пожалуйста. И сделайте его хрустящим.»"
1010805-24 = "Спасибо. Приходите ещё!"
1010805-26 = "Я перекусил и уже собирался выйти из магазина, когда..."
1010805-27 = "[ns5] «(Эй, разве это не...)»\n[ns6] «...Юука?»"
1010805-31 = "― [log=유우카 파자마]М-м-м. Ням-ням... Как же вкусно...[/log][wa:3390]"
1010805-34 = "― [log=유우카 파자마]Ч-что?![/log][wa:380]"
1010805-38 = "― [log=유우카 파자마]С-Сенсей?[/log][wa:1390]"
1010805-40 = "― [log=유우카 파자마]Что вы делаете здесь в такое время?[/log][wa:10]"
1010805-43 = "― [log=유우카 파자마]Я-я... Ну... Эм...[/log][wa:2260]"
1010805-45 = "― [log=유우카 파자마]Я не могла уснуть, поэтому вышла прогуляться,[/log][wa:810]"
1010805-48 = "― [log=유우카 파자마]а на листовке магазина увидела ангельскую курочку,[/log][wa:130]"
1010805-50 = "― [log=유우카 파자마]и она привлекла моё внимание...[/log]"
1010805-53 = "― [log=유우카 파자마]Я ничего не могла с собой поделать![/log][wa:990]"
1010805-55 = "― [log=유우카 파자마]Примерно в это время ангельскую курочку как раз жарят свежей.[/log][wa:70]"
1010805-58 = "― [log=유우카 파자마]Она такая тёплая и сочная![/log][wa:2120]"
1010805-60 = "― [log=유우카 파자마]Не купить её — вот это настоящая потеря![/log][wa:10]"
1010805-63 = "― [log=유우카 파자마]И... я ведь не то чтобы прихожу сюда[/log][wa:2780]"
1010805-65 = "― [log=유우카 파자마]за ночным перекусом каждый день...[/log][wa:670]"
1010805-68 = "― [log=유우카 파자마]Е-если хотите...[/log][wa:2590]"
1010805-70 = "― [log=유우카 파자마]Хотите тоже попробовать кусочек, Сенсей?[/log][wa:600]"
1010805-73 = ""
1010805-74 = "[ns7] «Спасибо, но я пас.»\n[ns8] «Желудки старшеклассников — это нечто. Есть курицу в такой час...»"
1010805-77 = "Н-не дразните меня!"
1010805-78 = "У-у-у... Если бы я знала, что вы будете здесь, выбрала бы что-нибудь полегче."
1010805-79 = "Например, желе из конняку или какую-нибудь закуску из тофу..."
1010805-80 = "[s] «Тебе всё ещё трудно уснуть в последнее время?»"
1010805-81 = "Ну, если честно..."
1010805-82 = "...Да, немного."
1010805-83 = "Я правда стараюсь изо всех сил не давить на себя слишком сильно."
1010805-84 = "Но стоит мне лечь, как в голове всё равно начинает крутиться слишком много мыслей."
1010805-85 = "Шум вентилятора серверного компьютера, который никогда не выключается, мягкое свечение неоновой вывески сквозь шторы, рёв грузовиков, везущих товары к месту назначения..."
1010805-86 = "Даже в, казалось бы, тихие ночи кто-то где-то готовится к следующему дню. И я начинаю думать, имею ли вообще право спать."
1010805-87 = "Я понимаю, что они работают всю ночь именно для того, чтобы я могла нормально отдохнуть и справиться со следующим днём... Просто мой разум устаёт куда сильнее, чем тело."
1010805-88 = "Поэтому я решила, что прогулка поможет мне устать, но... в итоге я ем жирную курицу из магазина."
1010805-89 = "[s] «По-моему, ты сделала хороший выбор.»"
1010805-90 = ""
1010805-93 = "[ns9] «Лёгкая прогулка действительно помогает заснуть.»\n[ns10] «Да и утолить ночной голод иногда тоже полезно для сна.»"
1010805-96 = "Серьёзно...?"
1010805-97 = "Вы всегда говорите студентам приятные вещи, поэтому вам трудно поверить."
1010805-98 = "[s11] «Конечно, курица долго переваривается, поэтому...»\n[s12] «...может, прогуляемся вместе, пока ты не будешь готова ко сну?»"
1010805-101 = "Хи-хи. Звучит неплохо."
1010805-102 = "Я покажу вам свою тайную тропу. Я довольно часто там гуляю."
1010805-103 = "Здесь темно, так что, пожалуйста, держитесь рядом со мной."
1010805-105 = "После этого мы с Юкой отлично провели время, гуляя по тихим улицам Миллениума."
