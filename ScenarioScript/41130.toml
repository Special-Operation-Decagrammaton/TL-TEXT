[translation]
41130-1 = "Episódio 13;Oinari-san"
41130-2 = "(Antes de ir para o parque de sempre, passei em Kousagi Town para comer alguma coisa.)"
41130-4 = "Arredores do Parque Kousagi - Kousagi Town"
41130-6 = "(...Mas, por algum motivo, não havia nenhuma loja aberta.)"
41130-9 = "Que tal um \"oinari-san\" bem gostoso?"
41130-10 = "Ah, você aí, cliente! Se ainda não comeu, o que acha deste aqui?"
41130-11 = "Hoje, modéstia à parte, ficou uma obra-prima!"
41130-12 = "E agora está acabadinho de fazer! É quando fica mais gostoso!"
41130-13 = "[s] \"Bom, já que estou aqui...\""
41130-15 = "Obrigada pela preferência!"
41130-16 = "Nossa, hoje não apareceu nenhum cliente e eu já estava ficando desanimada. Cheguei a ficar com dor de estômago pensando que não ia vender nem um sequer."
41130-17 = "Deu tanto trabalho para fazer, seria um desperdício."
41130-18 = "[s] \"Pensando bem, não tem ninguém por aqui e nenhuma loja está aberta.\""
41130-19 = "Pois é. Na verdade, vão começar uma revitalização nesta região em breve. Acho que é por causa disso."
41130-23 = "Ué, por acaso você não estava sabendo?"
41130-24 = "Pelo que dizem os boatos, parece que pretendem inaugurar uma nova linha de metrô por aqui."
41130-25 = "Dizem que vão demolir o comércio daqui e tudo mais para construir o metrô e erguer um novo centro comercial no lugar."
41130-26 = "Qual era o nome mesmo? Acho que era uma empresa com um logotipo parecido com um polvo..."
41130-27 = "[s] \"...Grupo Kaiser?\""
41130-28 = "Ah, isso, isso mesmo! Acho que era uma empresa do grupo chamada \"Kaiser Construction\"!"
41130-29 = "Parece que vão fazer uma obra gigantesca de revitalização, apostando o futuro da empresa nisso."
41130-30 = "Por causa disso, as lojas foram forçadas a fechar e parece que até os moradores estão sendo expulsos..."
41130-31 = "Bem, para uma aluna que vive de bicos como eu, isso é assunto de um mundo distante. Hihi..."
41130-35 = "[ns] Comprar mais um inarizushi."
41130-36 = "Ora, gostou tanto assim?"
41130-37 = "Que ótimo! Não querendo me gabar, mas tenho bastante confiança na minha mão, especialmente para fazer este \"oinari-san\"."
41130-38 = "Minhas colegas... minhas amigas e calouras sempre adoravam."
41130-42 = "...Ah, acabei fugindo do assunto."
41130-43 = "Vejamos..."
41130-44 = "Já que você comprou bastante, vou te contar mais uma boa informação."
41130-45 = "Sobre aquela revitalização da \"Kaiser Construction\" de que falei agora há pouco..."
41130-46 = "Parece que também há boatos de que ela pode ser cancelada."
41130-47 = "[s] \"E por que isso?\""
41130-48 = "Na verdade, há um grupo de errantes por esta região."
41130-49 = "Eles estão bem armados com armas de fogo e causam confusão toda vez que o pessoal da \"Kaiser Construction\" aparece... dizem que a obra está atrasando cada vez mais por causa disso."
41130-50 = "Além disso, no parque aqui perto, umas alunas armadas de não sei onde ocuparam o local, então a Valkyrie também anda cheia de dor de cabeça."
41130-51 = "Com a situação desse jeito, a \"Kaiser Construction\" também deve estar em maus lençóis... não acha?"
41130-52 = "[s] \"Essas alunas no parque...\""
41130-53 = "Ora, por acaso você as conhece?"
41130-54 = "Você já deve ter percebido, mas eu adoro conversar."
41130-61 = "Eu te dou mais um oinari-san por conta da casa, então, se souber de alguma coisa, não poderia me contar?"
41130-62 = "[s1] \"Acho que não tenho nada de especial para contar...\"\n[s2] \"Desculpa, eu também não sei muita coisa.\""
41130-63 = "...É mesmo? Que pena."
41130-64 = "...É mesmo? Que pena."
41130-65 = "Isso também não passa de boato, mas..."
41130-66 = "Dizem que essas alunas do parque são de alguma escola de elite."
41130-67 = "Se for verdade, elas devem ter armas de fogo bem poderosas, então até faz sentido a Valkyrie estar tendo tanto trabalho."
41130-68 = "Ainda assim, por que alunas de elite estariam ocupando um parque para viver lá...?"
41130-69 = "É apenas um palpite, mas talvez estejam tentando disfarçar alguma coisa, ou talvez um erro irreparável as tenha forçado a isso."
41130-70 = "Ou então... talvez elas estejam sonhando."
41130-71 = "Um sonho frágil, gentil e inalcançável... como o de flores criadas em estufa."
41130-72 = "Quem está na posição de guiar alunas imersas num sonho assim deve ter muito trabalho, não é?"
41130-73 = "[s] \"Acho que não é bem assim.\""
41130-74 = "...Entendo?"
41130-75 = "E por que diz isso?"
41130-76 = "[s] \"Porque apoiar os sonhos das alunas é o dever de quem as guia.\""
41130-80 = "...Você é uma pessoa curiosa."
41130-81 = "Bem, pode ser que exista essa forma de pensar também."
41130-85 = "Bom, acho que já está na hora de fechar por hoje. Muito obrigada pela compra!"
41130-89 = "[ns] \"...O que é isso?\""
41130-90 = "São as sobras que não vendi."
41130-91 = "Não vou conseguir comer tudo sozinha... então leve de brinde."
41130-92 = "Se não se importar,"
41130-93 = "dê para alguém que esteja com fome."
41130-94 = "Então, foi um prazer conhecê-lo hoje."
41130-95 = "Vamos nos encontrar de novo quando houver oportunidade, Sensei."
41130-100 = "Parque Kousagi"
41130-103 = "P-Pare aí! Se fizer algum movimento estranho, e-eu atiro...!"
41130-107 = "...Miyu, quando ficar em alerta, olha primeiro quem é, tá?"
41130-108 = "Olha só, é o Sensei."
41130-109 = "Ah... d-desculpa!"
41130-111 = "Ah, é o Sensei [USERNAME]."
41130-112 = "Estava andando de um jeito estranho, achei que fosse um cachorro ou algo assim."
41130-113 = "[s] \"Ah, é...\""
41130-114 = "Deixando isso de lado, por que veio aqui? Não lembro de ter chamado."
41130-115 = "Hm, esse cheiro..."
41130-119 = "[ns] Oferecer os inarizushi."
41130-120 = "Uau, é inarizushi! Parece uma delícia!"
41130-121 = "Faz tempo que não como isso... me lembra dos tempos da SRT..."
41130-122 = "P-Por acaso trouxe isso para nós...?"
41130-123 = "[s3] \"Sim, podem comer se quiserem.\"\n[s4] \"Bem... achei no caminho até aqui...\""
41130-124 = "Hmm..."
41130-125 = "Saki, experimenta aí primeiro. Vai que tem alguma coisa misturada."
41130-126 = "[s5] \"P-Pode comer sem medo! Eu também comi agora há pouco!\""
41130-127 = "E-Entendi... claro que o Sensei nunca gastaria dinheiro com gente como a gente..."
41130-128 = "Isso não tá estragado, né?"
41130-132 = "Pelo cheiro, parece que tá bom..."
41130-135 = "Ué, esse cheiro...?"
41130-136 = "Que nostalgia... Ah, bem, tínhamos veteranas na SRT. Veteranas que adoravam oinari-san."
41130-137 = "Onde será que elas estão agora...?"
41130-141 = "...Por enquanto, vamos comer."
41130-143 = "(Depois, enquanto dividíamos os inarizushi, contei a todas algumas das coisas que haviam acontecido até agora.)"
41130-147 = "...Entendo. Além de não podermos contar com o apoio do Conselho Estudantil Geral, também podemos esperar pressão corporativa por causa da revitalização."
41130-148 = "Eu já não esperava nada do Conselho Estudantil Geral desde o começo, mas a situação está pior do que eu pensava."
41130-149 = "E depois daquela chuva forte da última vez, nossos equipamentos estão bem precários..."
41130-151 = "Uma dificuldade dessas não é nenhuma surpresa."
41130-152 = "Se acabar a munição, eu luto até com as mãos vazias!"
41130-153 = "Eu sabia que ia acabar assim..."
41130-154 = "Os suprimentos acabam, o apoio não chega, os ataques continuam..."
41130-155 = "E no fim, um dia..."
41130-156 = "Vamos ser levadas para o Mercado Negro e passar por coisas horríveis..."
41130-157 = "Acho que a situação não vai chegar a esse ponto... até porque o Sensei também está aqui."
41130-158 = "De qualquer forma, o poder de fogo preocupa. Do jeito que estamos agora, mal sei se conseguiríamos trocar tiros de igual para igual com o Departamento de Segurança Pública..."
41130-159 = "Se ao menos pudéssemos consertar as metralhadoras e torretas para posicionar no parque..."
41130-161 = "Hehehe... pessoal, por acaso esqueceram de mim?"
41130-169 = "Quando o assunto é suprimentos, podem deixar comigo!"
41130-171 = "Próximo;Escambo"
