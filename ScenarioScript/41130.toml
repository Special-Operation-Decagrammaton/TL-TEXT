[translation]
41130-1 = "Эпизод 13;Лисы и Инари-суши"
41130-2 = "Прежде чем отправиться к Отряду RABBIT, я заглянул в соседний городок, чтобы перекусить."
41130-4 = "Город возле парка Коусаги"
41130-6 = "Но по какой-то причине ни одно заведение в городе не работало."
41130-9 = "Покупайте, пока горячие! Свежайшие инари-суши!"
41130-10 = "Доброго дня, покупатель! Если Вы ищете, где перекусить, не хотите попробовать вкуснейшие инари-суши?"
41130-11 = "Если Вы куда-то спешите, это идеальный вариант! Кармашки из обжаренного во фритюре тофу, наполненные рисом - точно наедитесь!"
41130-12 = "И, к счастью для Вас, я только что приготовила свежую партию! Свежее просто не найдёте!"
41130-13 = "[s] Купить инари-суши."
41130-15 = "Спасибо за покупку!"
41130-16 = "Сегодня на улицах совсем пусто, так что я уже боялась, что ничего не продам."
41130-17 = "Было бы очень жаль, если бы вся эта еда пропала."
41130-18 = "[s] «Если подумать, все магазины вокруг тоже закрыты.»"
41130-19 = "Ну, это вполне естественно, ведь скоро начнётся масштабная реконструкция."
41130-20 = ""
41130-23 = "Ой, Вы не слышали? Я думала, уже все знают."
41130-24 = "Ходят слухи, что здесь хотят построить новую станцию метро."
41130-25 = "А прямо над ней - новый торговый центр! Правда, похоже, сначала им придётся снести все старые постройки."
41130-26 = "За всем этим стоит крупная строительная компания… Как бишь её? Хм, у них ещё такой большой логотип с осьминогом…"
41130-27 = "[s] «Группа Кайзер?»"
41130-28 = "Да, именно! Строительная Компания Кайзер!"
41130-29 = "Судя по всему, Строительная Компания Кайзер ставит на кон всё будущее своей компании, взявшись за перепланировку этого района."
41130-30 = "Но в процессе некоторых местных жителей довольно грубо выгнали из магазинов..."
41130-31 = "Впрочем, в конце концов, я просто работаю на полставки, так что всегда смогу найти новую работу."
41130-32 = ""
41130-35 = "[ns] Купить ещё один инари-суши."
41130-36 = "Ого! Похоже, Вам действительно понравились мои инари-суши."
41130-37 = "Спасибо. Я очень горжусь своим рецептом."
41130-38 = "Мои друзья и младшекурсники раньше всегда говорили, что у меня самые вкусные инари-суши на свете!"
41130-39 = ""
41130-41 = ""
41130-42 = "…то есть, я имела в виду, мои школьные друзья."
41130-43 = "Кхм!"
41130-44 = "Раз уж Вы купили у меня столько инари-суши, я поделюсь с Вами горячими сплетнями."
41130-45 = "Строительная Компания Кайзер ещё даже не приступила к перепланировке этого места."
41130-46 = "Потому что, если верить другим слухам, весь проект в итоге могут просто отменить."
41130-47 = "[s] «Почему?»"
41130-48 = "Ну, из-за местных бездомных. Уверена, Вы о них хоть немного, но слышали."
41130-49 = "Какая-то группа хиппи раздобыла кучу тяжёлого огнестрельного оружия, и они устраивают настоящий ад каждый раз, когда рабочие Строительной Компании Кайзер просто подходят близко."
41130-50 = "Что ещё хуже, группа отлично вооружённых студентов оккупировала парк! Похоже, даже полиция плюнула на безопасность в этих краях."
41130-51 = "Со всеми этими неожиданными проблемами, полагаю, Строительная Компания Кайзер подумывает просто убраться отсюда от греха подальше."
41130-52 = "[s] «Студенты в парке?»"
41130-53 = "О! Вы их знаете?"
41130-54 = "Знаете, я ведь считаю сплетни своей главной специализацией."
41130-55 = ""
41130-57 = ""
41130-59 = ""
41130-61 = "Вот, возьмите ещё один инари-суши за счёт заведения! Вы знаете этих студентов в парке? Ну же, расскажите!"
41130-62 = "[s1] «Мне нечего о них рассказать.»\n[s2] «Я и сам толком ничего не знаю.»"
41130-63 = "Вот как. Какое разочарование."
41130-64 = "Вот как. Какое разочарование."
41130-65 = "Ну, по крайней мере, я кое-что знаю."
41130-66 = "Судя по всему, эти студенты из какой-то элитной академии."
41130-67 = "Вот откуда у них всё это высокотехнологичное снаряжение и как им удалось захватить парк."
41130-68 = "Но вот о чём слухи умалчивают - так это почему они живут на улице вместо своей академии."
41130-69 = "Как Вы думаете, их исключили? Или это просто дурацкая выходка?"
41130-70 = "Или… они просто мечтатели."
41130-71 = "Беспечные мечтатели, стремящиеся к невозможному будущему. Какая прекрасная привилегия тех, кто находится под защитой… мечтать."
41130-72 = "Должно быть, трудно, Сенсей, наставлять группу студентов, которые не хотят спускаться с небес на землю?"
41130-73 = "[s] «Ни в малейшей степени.»"
41130-74 = "Хм?"
41130-75 = "Вот как?"
41130-76 = "[s] «Моя работа - лелеять их мечты, пока они не станут реальностью.»"
41130-77 = ""
41130-79 = ""
41130-80 = "…Вы ставите меня в тупик."
41130-81 = "Впрочем, мне нравится Ваш ход мыслей. Делайте так, как считаете нужным."
41130-82 = ""
41130-84 = ""
41130-85 = "Ха-ха, что ж! Думаю, пора закрывать лавочку. Полагаю, больше покупателей сегодня не будет."
41130-86 = ""
41130-88 = ""
41130-89 = "[ns] «Что это?»"
41130-90 = "Это остатки инари-суши."
41130-91 = "Я всё равно не смогу всё это съесть, так что держите."
41130-92 = "Уберите их в холодильник на потом…"
41130-93 = "Или, я уверена, неподалёку найдутся голодные студенты, которые будут им очень рады."
41130-94 = "Спасибо за беседу, Сенсей."
41130-95 = "Возможно, мы когда-нибудь снова встретимся."
41130-96 = ""
41130-98 = ""
41130-100 = "Парк Коусаги"
41130-103 = "С-стоять! Не двигаться, или я буду стрелять!"
41130-104 = ""
41130-106 = ""
41130-107 = "Эй, разуй глаза, плакса. Вот что бывает, когда ты так боишься, что даже взглянуть на нарушителя не можешь."
41130-108 = "Это же просто Сенсей."
41130-109 = "Ой… П-простите!"
41130-111 = "Хм. Это всего лишь [USERNAME] Сенсей."
41130-112 = "А я-то думала, опять какая-то бродячая собака забрела."
41130-113 = "[s] «Они ведут себя так, будто у меня вообще нет чувств.»"
41130-114 = "В любом случае, зачем Вы пришли? Вас никто не просил."
41130-115 = "П-погодите. Чем это пахнет?"
41130-116 = ""
41130-119 = "[ns] Показать инари-суши."
41130-120 = "Инари-суши? Мию, Мию! Салфетку! У меня аж слюни текут."
41130-121 = "Не помню, когда в последний раз ела инари-суши. Ну, на самом деле ещё в Академии SRT..."
41130-122 = "Я-я не думаю, что Вы бы так поступили, но Вы же их не покупали, верно?"
41130-123 = "[s3] «Да, я потратил на них ку-у-учу денег.»\n[s4] «Я нашёл их в мусорном баке по пути сюда.»"
41130-124 = "...Подозрительно."
41130-125 = "Саки, попробуй первой. Не знаю, что туда подсыпали."
41130-126 = "[s5] «Повторю в последний раз: это просто еда!»"
41130-127 = "Но почему Вы потратили свои с таким трудом заработанные деньги на нас?.."
41130-128 = "Вы оставили их в холодильнике, и они испортились?"
41130-129 = ""
41130-131 = ""
41130-132 = "Хотя не похоже, чтобы они испортились…"
41130-135 = "Здравствуйте, Сенсей. Это инари-суши?"
41130-136 = "Навевает воспоминания. Старшекурсницы в SRTчасто готовили и ели их."
41130-137 = "Надеюсь, у них всё в порядке."
41130-138 = ""
41130-140 = ""
41130-141 = "Спасибо, Сенсей. Давайте поедим."
41130-143 = "Я объяснил всю ситуацию Отряду RABBIT, пока мы ели горячий перекус."
41130-146 = ""
41130-147 = "Значит, Генеральный Студенческий Совет отказывается оказывать какую-либо помощь, а строительная компания намерена полностью перестроить эту территорию."
41130-148 = "Хотя я и не ожидала особой поддержки от Генерального Студенческого Совета, ситуация оказалась куда хуже, чем я думала."
41130-149 = "И в довершение всего наше снаряжение и оружие повреждены из-за затопления."
41130-151 = "Ну, когда мы брались за эту миссию, мы с самого начала знали, что расклад не в нашу пользу."
41130-152 = "Если закончатся патроны, у нас всё ещё есть кулаки! Им нас не остановить."
41130-153 = "Я-я так и знала, что ты скажешь что-то подобное…"
41130-154 = "Но у нас больше нет припасов, и никто нам не п-поможет."
41130-155 = "Они, наверное, п-просто ждут, пока мы ослабнем и не сможем с-сопротивляться."
41130-156 = "А потом нас п-продадут на чёрном рынке и будут п-пытать! Не-е-ет!"
41130-157 = "Дыши глубоко, Мию. Сенсей присматривает за нами. Я не позволю этому случиться."
41130-158 = "Но если посмотреть правде в глаза, у нас едва хватит огневой мощи, чтобы отбиться от белки, не говоря уже о Бюро Общественной Безопасности."
41130-159 = "Если бы только мы могли починить пулемёты и турели по периметру парка…"
41130-161 = "Хи-хи-хи. Вы, глупышки, совсем обо мне забыли?"
41130-162 = ""
41130-164 = ""
41130-165 = ""
41130-168 = ""
41130-169 = "Ваш штатный эксперт по припасам к вашим услугам!"
41130-171 = "Следующий эпизод;Бартерная система"
