[translation]
34255-5 = "O-O que está acontecendo?! Por que não conseguimos entrar em contato com a Madame?!"
34255-6 = "É uma emergência!! Pelas dezenas de entradas das Catacumbas no distrito autônomo...!!"
34255-7 = "S-Soldados de Trinity estão...!!"
34255-8 = "O-O quê?!"
34255-14 = "P-Por aqui!"
34255-15 = "Mo-Mobilizar!"
34255-23 = "Q-Quem está aí?!"
34255-30 = "Então este é o Distrito Autônomo de Arius..."
34255-31 = "Assim como a Seia-sama disse... Este lugar precisa de \"socorro\"."
34255-37 = "P-Parem!!"
34255-51 = "— Perdoem-me. Por conta de sentimentos pessoais, negligenciei o dever que cabia a mim cumprir. Mesmo elas também sendo pessoas que necessitam de socorro..."
34255-52 = "Serina, Hanae. Tratem os ferimentos delas."
34255-53 = "S-Sim... Capitã."
34255-54 = "E também — peço que prestem socorro e tratem prontamente as feridas que eu estiver prestes a produzir daqui em diante."
34255-55 = "Aqui vou eu!!"
34255-64 = "C-Capitã..."
34255-66 = "É exatamente o nosso lema: \"A Capitã Mine destrói e as Cavaleiras curam\"!!#nDepois de tanto tempo, as Cavaleiras Socorristas vão mostrar a que vieram!"
34255-67 = "N-Nós não temos um lema desses..."
34255-69 = "Vamos, mexam-se com agilidade!"
34255-70 = "Com convicção e orgulho no peito! Levem o socorro adequado aonde for necessário!"
34255-71 = "Vamos libertar o Distrito Autônomo de Arius e salvar o Sensei e a Mika-sama!!"
34255-73 = "Sim!"
34255-74 = "Ser chamada de madrugada para uma missão repentina dessas...!#nBuááá!"
34255-76 = "Próximo;O Nosso Futuro Daqui em Diante"
