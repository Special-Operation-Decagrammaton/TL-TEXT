[translation]
2600805-1 = "Я такая амбициозная!"
2600805-2 = "Наполовину воодушевлённый, наполовину обеспокоенный, я отправился на встречу с Шизуко."
2600805-3 = "Добро пожаловать, Сенсей!"
2600805-4 = "Спасибо, что пришли в пляжное кафе «Момоёдо»!"
2600805-5 = "[s] «Привет, Шизуко.»"
2600805-6 = "Да-да, спасибо, что проделали весь путь сюда."
2600805-7 = "Я обязательно обслужу вас по высшему разряду!"
2600805-8 = "Тогда... начнём с услуги «растеряшки»!"
2600805-9 = "[s1] «Нет... Правда, не обязательно...»\n[s2] «Эта услуга „растеряшки“... Я по ней скучал.»"
2600805-13 = "Шизуко отлично обслуживала меня на протяжении всей трапезы."
2600805-14 = ""
2600805-17 = ""
2600805-18 = ""
2600805-19 = ""
2600805-20 = ""
2600805-21 = ""
2600805-22 = ""
2600805-23 = ""
2600805-24 = ""
2600805-25 = ""
2600805-26 = ""
2600805-27 = ""
2600805-28 = ""
2600805-34 = "Время пролетело незаметно, и наступил вечер..."
2600805-36 = "Ну как, Сенсей?!"
2600805-37 = "О, может, теперь мне называть вас «Господин»?"
2600805-38 = "Вам нормально «Сенсей»? Раз вы так говорите."
2600805-39 = "Ну и как вам?"
2600805-40 = "[s] «Такое чувство, будто я в „Момоёдо“, только посреди океана.»"
2600805-41 = "Серьёзно?"
2600805-42 = "Именно это я и хотела услышать!"
2600805-43 = "[s] «Ты выглядишь так, будто выдохнула.»"
2600805-44 = "Эм..."
2600805-45 = "Ух. Пожалуй, стоит честно признать свои чувства."
2600805-46 = "Спасибо, Сенсей."
2600805-47 = "Вы напомнили мне, за что я люблю «Момоёдо»."
2600805-48 = "И направили меня в правильную сторону."
2600805-49 = "[s] «...Не думаю, что я сделал что-то особенное.»"
2600805-50 = "Я знала, что вы так скажете."
2600805-51 = "Но если бы не вы..."
2600805-52 = "я бы всё ещё упускала из виду самое важное."
2600805-53 = "Ладно! Хватит разговоров!"
2600805-54 = "С завтрашнего дня я снова обычная Кавава Шизуко!"
2600805-55 = "Хорошо, тогда идёмте, Сенсей!"
2600805-56 = "[s] «Шизуко, п-подожди!»"
2600805-57 = ""
2600805-59 = ""
2600805-64 = "― Сенсей. Теперь я... понимаю, что должна делать.[wa:2700]"
2600805-67 = "― Если подумать, это ведь очевидно.[wa:10]"
2600805-69 = "― Не могу поверить, что поняла это только сейчас... всё из-за моей невнимательности![wa:1090]"
2600805-72 = "― Вы, возможно, уже знаете,[wa:120]"
2600805-74 = "― но я очень амбициозная![wa:10]"
2600805-77 = "― Я хочу сделать и получить очень многое.[wa:10]"
2600805-79 = "― И ни от чего не хочу отказываться.[wa:10]"
2600805-82 = "― Я хочу сделать всех счастливыми и стать успешной бизнес-леди![wa:550]"
2600805-84 = "― Я хочу, чтобы «Момоёдо» стало лучшей чайной во всём Кивотосе![wa:10]"
2600805-87 = "― Я не хочу ничего упускать![wa:2800]"
2600805-89 = "― Конечно... это касается и вас![wa:540]"
2600805-94 = "Сначала я перестрою франшизу."
2600805-95 = "Разработаю новое меню и верну услуги, соответствующие духу «Момоёдо»!"
2600805-96 = "Так что мне придётся много учиться и набираться опыта!"
2600805-98 = "Интересно, что ждёт нас в будущем."
2600805-99 = "От одной мысли об этом сердце начинает биться быстрее!"
2600805-100 = "Я попробую всё, что смогу!"
2600805-101 = "Сделаю всё, что потребуется!"
2600805-103 = "Я заполню весь этот архипелаг франшизами пляжного кафе!"
2600805-104 = "А потом, когда курорты «Затерянного рая» станут спокойным местом для отдыха..."
2600805-105 = "я подарю этот покой вам!"
2600805-106 = "[s] «Это... довольно большой подарок.»"
2600805-108 = "[ns] «Не знаю, заслуживаю ли я такого.»"
2600805-110 = "Дело не в том, заслуживаете вы или нет, Сенсей!"
2600805-111 = "Я, Кавава Шизуко, решила, что так и будет!"
2600805-112 = "Так что отбросьте сомнения!"
2600805-113 = "Я решаю, работаю ради этого и создаю!"
2600805-114 = "Всё, чего я прошу — чтобы вы были счастливы."
2600805-115 = "Это всё, чего я хочу!"
2600805-116 = "[s] «Ты и правда впечатляешь.»"
2600805-117 = "Хи-хи, хи-хи-хи, хи-хи-хи-хи!"
2600805-118 = "Хвалите меня ещё! Комплименты придают мне сил!"
2600805-119 = "Я буду продолжать расти вместе с «Момоёдо» и пляжным кафе!"
