[translation]
2002605-1 = "Скрытые леса"
2002605-2 = "Академия Красной Зимы, рабочий офис Трудовой партии"
2002605-6 = ""
2002605-7 = ""
2002605-8 = "О? Разве это не Сенсей из Шале?"
2002605-9 = "Что привело вас в рабочий офис?"
2002605-10 = "Вы ведь не на экскурсию по стройке пришли? Сегодня работу отменили из-за плохой погоды."
2002605-11 = "[ns] «А, Минори мне об этом рассказывала.»"
2002605-13 = "[ns1] «Я подумал, вам всем не помешает немного поднять настроение.»\n[ns2] «Я принёс вам угощения!»"
2002605-16 = ""
2002605-19 = "Ух ты! Это же те самые лимитированные шоколадки из Ангел 24!"
2002605-20 = "О, смотрите, тут ещё и заварной пудинг! И он не водянистый, как тот, что нам дают в Секретариате..."
2002605-21 = "Спасибо, Сенсей!"
2002605-22 = "[ns] «Тут хватит на всех, так что угощайтесь.»"
2002605-24 = "[ns] «Кстати, а где Минори?»"
2002605-25 = "Хороший вопрос. Кажется, она всегда куда-то исчезает, когда работу неожиданно отменяют..."
2002605-26 = "Обычно она идёт на объект проверять, чтобы все материалы и оборудование были надёжно закреплены."
2002605-27 = "Ух ты, президент Минори и правда усердно работает!"
2002605-28 = "Не знаю, пошла ли она туда сегодня. На улице такой мороз, что можно обморожение заработать..."
2002605-29 = "Ага, нужно быть сумасшедшим, чтобы выйти работать в такую погоду. Наверное, она вместо этого пошла в библиотеку."
2002605-30 = "[s] «Что ж, мне пора.»"
2002605-31 = "Уже?"
2002605-32 = "Спасибо за угощения, Сенсей. Как-нибудь загляните к нам на стройку!"
2002605-33 = "О, и постарайтесь не заблудиться! Академия Красной Зимы довольно большая."
2002605-34 = ""
2002605-36 = ""
2002605-37 = "[ns] Направиться к стройплощадке."
2002605-41 = "[ns3] «Минори, Минори, Миноририри!»\n[ns4] «Мино-о-ори! ♪»"
2002605-42 = ""
2002605-45 = ""
2002605-46 = "Кто там коверкает моё имя...?"
2002605-47 = ""
2002605-50 = ""
2002605-51 = "О, [USERNAME] Сенсей! Что вы здесь делаете?"
2002605-52 = "Я ведь точно отправила в MomoTalk уведомление, что работу отменили... Вы не получили?"
2002605-53 = "[s5] «Члены твоего клуба сказали, что ты можешь быть здесь.»\n[s6] «Я принёс угощения!»"
2002605-56 = "Я всего лишь выполняю работу по контракту. Дополнительная награда вроде этой — уже слишком..."
2002605-57 = "Если подумать, офис Красной Зимы никогда не присылал нам угощения. И заказчики тоже..."
2002605-58 = "Похоже, только вы и заботитесь о таких рабочих, как я, Сенсей."
2002605-59 = "[s] «Кстати, зачем ты вообще сюда пришла?»"
2002605-60 = "Я просто обхожу территорию и провожу проверки безопасности."
2002605-61 = "Работу отменили так внезапно, что часть оборудования, тентов и прочего осталась валяться. Нужно всё закрепить, чтобы ветром не унесло."
2002605-62 = "Не могу придумать лучшего способа провести такой редкий свободный день..."
2002605-63 = "А, вообще-то я хочу кое-что вам показать."
2002605-64 = ""
2002605-66 = ""
2002605-67 = "Не против пройти со мной? Сюда, наверх."
2002605-72 = "― [log=미노리]Ха-ха-ха... В такой холодный ясный день отсюда видно бесконечно далеко.[/log][wa:2100]"
2002605-74 = "― [log=미노리]Сенсей, не стойте там. Подойдите и посмотрите.[/log][wa:2580]"
2002605-77 = "[ns] «Эм... Это выдержит нас обоих?»"
2002605-78 = "― [log=미노리]Не о чем беспокоиться.[/log][wa:280]"
2002605-80 = "― [log=미노리]Эти леса настолько прочные, что выдержат целого слона.[/log][wa:1580]"
2002605-83 = "― [log=미노리]Если задуматься, эти строительные леса[/log][wa:900]"
2002605-85 = "― [log=미노리]очень похожи на Трудовую партию.[/log][wa:2200]"
2002605-88 = "― [log=미노리]Без них строительство невозможно, но[/log][wa:500]"
2002605-91 = "― [log=미노리]после завершения работы они должны исчезнуть,[/log][wa:400]"
2002605-92 = "― [log=미노리]словно их никогда и не было...[/log][wa:2940]"
2002605-95 = "― [log=미노리]Может быть, поэтому...[/log][wa:980]"
2002605-98 = "― [log=미노리]я так люблю стоять здесь, на лесах,[/log][wa:10]"
2002605-99 = "― [log=미노리]и смотреть сверху на стройку, словно с вершины мира.[/log][wa:3000]"
2002605-102 = "― [log=미노리]Это доказательство тяжёлого труда всех,[/log][wa:1100]"
2002605-103 = "― [log=미노리]кто стоял на краю и своими руками возводил эти стены.[/log][wa:6820]"
2002605-106 = "― [log=미노리]...Этого доказательства, которого не найти в уже готовом здании,[/log][wa:2120]"
2002605-108 = "― [log=미노리]я и хотела показать вам, Сенсей.[/log][wa:1620]"
2002605-111 = "Ну как вам? Каково смотреть вниз с такой высоты?"
2002605-112 = "[s7] «Красиво, но я рад снова стоять на твёрдой земле.»\n[s8] «На такой высоте у меня голова закружилась...»"
2002605-115 = "Наверняка вы бывали и выше..."
2002605-116 = "Хм. Может, небольшая высота даже страшнее, потому что мозг способен её осознать, в отличие от вида с очень высокого здания..."
2002605-117 = "Знаю! Давайте найдём место настолько высокое, что ваш мозг даже не сможет его осмыслить."
2002605-118 = "Поднимемся на самую вершину, Сенсей!"
2002605-119 = "Там вы наверняка сможете не спеша по-настоящему насладиться видом!"
2002605-121 = "Мне потребовались время и немало усилий, чтобы убедить Минори не тащить меня на самый верх строительных лесов..."
