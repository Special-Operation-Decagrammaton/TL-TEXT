[translation]
80000018-1 = "Предел казначея"
80000018-2 = "Офис Семинар в Миллениум"
80000018-3 = ""
80000018-4 = ""
80000018-5 = "Точно. На следующей неделе День святого Валентина."
80000018-6 = "Сенсей наверняка получит на следующей неделе всевозможный шоколад,#nучитывая его популярность."
80000018-7 = "Гораздо больше, чем ему нужно. Может, мне вообще не стоит отправлять ещё и свой."
80000018-8 = "..."
80000018-9 = "С другой стороны, на праздники принято дарить подарки.#nСенсей может хуже подумать о Семинар, если другие академии пришлют шоколад,#nа я как казначей — нет."
80000018-10 = "Придётся купить собственный подарочный набор."
80000018-11 = ""
80000018-13 = ""
80000018-17 = "Хм. «Шоколадный набор для деловых партнёров»."
80000018-18 = "Упаковка аккуратная и профессиональная, отзывы хорошие.#nДля Сенсея должно подойти идеально..."
80000018-19 = "...но он стоит 10 000 иен?!"
80000018-20 = "Подобает ли студенту дарить учителю что-то настолько дорогое?#nОсобенно мне, после того как я постоянно ругала Сенсея#nза расточительство..."
80000018-21 = "Но и экономить на шоколаде для Сенсея как-то неправильно...#nЧто же делать?"
80000018-22 = ""
80000018-24 = ""
80000018-25 = "Кажется, у меня есть идея."
80000018-27 = "Офис Шале"
80000018-28 = "Утро Дня святого Валентина."
80000018-29 = "Доброе утро, Сенсей."
80000018-30 = "[s] «Доброе утро, Юука.»"
80000018-31 = "Так... вы знаете, какой сегодня день?"
80000018-32 = "[s1] «День выхода на работу в одном белье?»\n[s2] «День сушёных анчоусов?»"
80000018-33 = "Что? Такого праздника ведь не существует?"
80000018-34 = "Что? Такого праздника ведь не существует?"
80000018-35 = "Сегодня День святого Валентина! Он даже отмечен в календаре Шале!"
80000018-36 = "В-В любом случае. Не то чтобы я придавала большое значение такому празднику,#nно за прошлый год я вам многим обязана, поэтому..."
80000018-37 = ""
80000018-39 = ""
80000018-40 = ""
80000018-41 = "Вот. Я купила вам шоколад на День святого Валентина."
80000018-42 = "Только... не думайте, что обязаны его есть. Это всего лишь моя благодарность за наши деловые отношения!"
80000018-43 = "[s] «Спасибо. Выглядит вкусно.»"
80000018-44 = ""
80000018-46 = ""
80000018-48 = ""
80000018-51 = "[ns] «Кстати. Это чек?»"
80000018-52 = "Это...! То есть, эм...!"
80000018-53 = "Я знаю, что сама требовала согласовывать со мной покупки дороже 5000 иен,#nи подумала, что вы будете меня осуждать, если я потрачу на шоколад больше."
80000018-54 = "И я не хотела послать неправильный сигнал, будто пытаюсь впечатлить вас или завоевать расположение."
80000018-55 = "Я просто хочу сказать, что я не такая девушка, так что не поймите неправильно."
80000018-56 = "Поэтому я специально потратила на ваш шоколад ровно 5000 иен и ни иеной больше."
80000018-57 = "Э-Это были деловые расходы! Ни больше ни меньше!"
80000018-59 = "Позже я заметил в кошельке Юки ещё один чек на 5000 иен — второй платёж за шоколад, который на самом деле стоил 10 000... но сделал вид, что ничего не видел."
