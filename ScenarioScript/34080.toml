[translation]
34080-1 = "Episódio 8;\"Esquadrão Arius\""
34080-6 = "Ah...! V-Você é...!"
34080-14 = "G-Guah!"
34080-19 = "Hiyori, você está bem!?"
34080-25 = "L-Líder..."
34080-26 = "Como descobriu este lugar...?"
34080-27 = "[s] \"Hiyori, que bom que você está a salvo.\""
34080-28 = "..."
34080-29 = "......"
34080-30 = "...Q-Quêê!?"
34080-31 = "P-Por que o Sensei da Schale está junto com a líder...!?"
34080-32 = "Isso é..."
34080-33 = "A-A hora do castigo divino finalmente chegou, não é? Eu sabia, é o meu fim..."
34080-34 = "Só pode ser isso... Pensando bem, o Sensei deve querer recuperar a gente de Arius... para nos punir com as próprias mãos..."
34080-35 = "Você pretende nos capturar e nos jogar naquela famosa masmorra subterrânea que dizem existir na Schale, não é!? Aquele lugar mal-assombrado onde dizem ouvir, noite após noite, os soluços de choro das garotas que desafiaram a Schale..."
34080-36 = "[s] \"...\""
34080-37 = "Buááááááááá! É o fim... E eu ainda tinha tantas coisas que queria fazer, tantas revistas que queria ler..."
34080-38 = "..."
34080-39 = "...Mas, mesmo que seja isso, por que a líder está junto com o Sensei? ...Ah, agora eu entendi tudo perfeitamente."
34080-40 = "Hiyori..."
34080-41 = "A líder está sendo ameaçada pelo Sensei da Schale, não é!? A vida da líder também é só sofrimento, que dó..."
34080-42 = "[s] \"Eu vim ajudar você, Hiyori.\""
34080-43 = "..."
34080-44 = "...Hã? M-Me ajudar...? P-Por quê?"
34080-45 = "S-Será que você está com amnésia ou algo assim? Não sabe quem nós somos...?"
34080-46 = "É como o Sensei disse, Hiyori. O Sensei da \"Schale\" vai nos ajudar."
34080-47 = "...!?"
34080-48 = "[s] \"Já me contaram toda a situação. Vamos salvar a Atsuko juntos.\""
34080-54 = "É mesmo, a Princesinha..."
34080-55 = "S-Será que nós... vamos mesmo conseguir salvar a Princesinha...?"
34080-56 = "E-Eu..."
34080-60 = "\"Ela\" me disse que, se eu contasse o paradeiro da líder, daria um jeito para que eu pudesse voltar ao Distrito Autônomo de Arius..."
34080-62 = "...!?"
34080-63 = "Disse que, c-como eu só obedeci às ordens da líder... havia espaço para clemência... Ehehe..."
34080-64 = "...Entendo."
34080-65 = "Nesse caso, é melhor fazer isso."
34080-66 = "...Hã?"
34080-67 = "Conte o meu paradeiro para \"ela\" e volte direto para o Distrito Autônomo."
34080-68 = "Assim, Hiyori, pelo menos você não vai sair prejudicada."
34080-69 = "O-O quê!? E-Eu..."
34080-70 = "Eu sabia que esse dia chegaria. Você já me acompanhou por tempo demais até aqui."
34080-71 = "Hum, bem... é que eu já recusei..."
34080-75 = "...Q-Que atitude é essa de tentar mostrar compreensão com uma traidora? Achou mesmo que eu fosse trair vocês tão fácil assim?"
34080-76 = "Para começo de conversa, nem dá para saber se a palavra \"dela\" é verdade... Além disso, nós já estamos todas no mesmo barco, com o destino entrelaçado... Não teria sentido nenhum eu voltar sozinha para o Distrito Autônomo..."
34080-77 = "E tem mais... mesmo que só eu fosse salva, o que aconteceria com a Atsuko-chan...?"
34080-78 = "E-Eu também acho que, se pudermos salvar a Atsuko-chan... a Princesinha todas juntas, vai ser muito melhor..."
34080-82 = "Você também pensa assim, não é, líder? Foi por isso que veio me salvar, né?"
34080-86 = "...Sim, é verdade."
34080-87 = "Vamos deixar os detalhes para quando estivermos todas reunidas. Primeiro, precisamos encontrar a Misaki."
34080-88 = "...Tem razão. A Misaki-san talvez consiga explicar essa situação um pouco melhor... Entendi."
34080-89 = "Eu tenho uma boa ideia de onde a Misaki-san pode estar."
34080-90 = "É... Provavelmente naquele lugar."
34080-91 = "[s] \"Então, vamos partir agora mesmo.\""
34080-92 = "S-Sim...!"
34080-94 = "Ponte abandonada há muito tempo"
34080-96 = "..."
34080-97 = "Daqui..."
34080-98 = "[s] \"É uma altura de dar vertigem...\""
34080-99 = "Além disso, o rio lá embaixo tem mais de 5 metros de profundidade."
34080-101 = "A correnteza também é rápida, então, se cair, provavelmente vai afundar direto até o leito do rio."
34080-102 = "Misaki."
34080-103 = "M-Misaki-san..."
34080-104 = "A líder e a Hiyori... e o Sensei da \"Schale\", é...?"
34080-105 = "Entendi... Então foi essa a sua escolha, líder."
34080-106 = "Quem diria que você faria isso, líder... E o Sensei também aceitou..."
34080-107 = "De qualquer forma, foi inesperado."
34080-108 = "Mas, Sensei, você sabia?"
34080-109 = "Se nós eliminarmos o \"Sensei\", poderemos voltar para o Distrito Autônomo de Arius."
34080-110 = "[s] \"...\""
34080-111 = "A Hiyori aí e a líder devem ter ouvido a mesma história. Não é?"
34080-112 = "A-A proposta que eu recebi foi um pouquinho diferente..."
34080-113 = "...Sim, foi o que ela me disse. Que perdoaria a nossa traição se eliminássemos o Sensei."
34080-114 = "...Mesmo sem saber quando podemos puxar o gatilho pelas suas costas, você consegue confiar na gente, Sensei?"
34080-115 = "Ainda mais se tratando de \"quem já atirou em você uma vez\"?"
34080-116 = "..."
34080-117 = "[s] \"Se a Saori tivesse essa intenção, eu já não estaria a salvo há muito tempo.\""
34080-118 = "...Entendo."
34080-119 = "Mas isso não muda nada para mim."
34080-123 = "[ns] \"Misaki, aí é perigoso...!\""
34080-125 = "M-Misaki-san...?"
34080-126 = "Salvar a Princesa é impossível."
34080-127 = "O que vamos fazer nos infiltrando no Distrito Autônomo de Arius? Vamos lutar em três para chegar à Basílica onde a Princesa está? Contra todas as alunas de Arius? E ainda por cima antes do amanhecer?"
34080-128 = "Provavelmente \"ela\" deve ter preparado armas que nem mesmo nós conhecemos."
34080-129 = "Só com nós três, por mais que tenhamos a ajuda de um adulto, é impossível."
34080-130 = "E, mesmo supondo que consigamos resgatar a Atsuko, que sentido teria isso?"
34080-131 = "Deixadas para trás neste mundo, sem ter para onde voltar, sobrevivendo apenas de engolir água suja de lama... Essa vida sem sentido e dolorosa só vai continuar, não é?"
34080-132 = "..."
34080-133 = "Prolongar a vida da Princesa, que só teve sofrimento... que valor existe nisso?"
34080-134 = "\"Tudo é vaidade.\" Essa é a única verdade que conseguimos aceitar."
34080-135 = "Não é mesmo, líder?"
34080-136 = "..."
34080-137 = "Ou será que você, Sensei... por ser um adulto, conhece a resposta para isso?"
34080-138 = "[s] \"Espere, é perigoso! Se der mais um passo...\""
34080-142 = "Cale a boca, Misaki."
34080-143 = "..."
34080-144 = "E então? Quer dizer que você também quer encontrar o descanso para a sua vida cheia de sofrimento? — Acha mesmo que uma ameaça dessas vai funcionar comigo?"
34080-145 = "..."
34080-146 = "Ouça bem, Misaki. Se você pular daí—"
34080-147 = "Eu pulo atrás de você no mesmo instante."
34080-148 = "Mesmo que tenha colocado algum peso dentro da roupa, é inútil. Não vou levar muito tempo para te arrastar até a margem do rio."
34080-149 = "No máximo vinte segundos até lá. E, mesmo que você perca a consciência, vou repetir a reanimação cardiopulmonar quantas vezes for preciso."
34080-150 = "Por mais que tente me ameaçar desse jeito, eu vou fazer você viver."
34080-151 = "Todas as vezes que tentou até hoje foram em vão. Acha mesmo que vai conseguir ter sucesso desta vez?"
34080-152 = "..."
34080-153 = "(...)"
34080-154 = "...É, acho que não tenho muita confiança nisso."
34080-159 = "...Então, no fim das contas, vamos mesmo salvar a Princesa."
34080-160 = "Está bem... Se é uma ordem da líder, eu obedeço."
34080-161 = "Vou acompanhá-la até o fim desta vez também, líder."
34080-162 = "...Sim, conto com você."
34080-163 = "Haaa~~~... Que bom que tudo se resolveu de algum jeito..."
34080-164 = "Agora que está decidido, vamos nos apressar... Restam cerca de 90 minutos. Precisamos chegar à entrada até lá."
34080-165 = "...Entendo. Uma hora e meia até a meia-noite... Vamos nos apressar."
34080-166 = "Explico tudo no caminho... Vamos."
34080-167 = "..."
34080-168 = "S-Sim! É por aqui...!"
34080-169 = "[ns] \"Entendido.\""
34080-174 = "Próximo;Rumo ao Distrito Autônomo de Arius (1)"
