[translation]
34080-1 = "Эпизод 8;Воссоединение отряда"
34080-2 = ""
34080-3 = ""
34080-4 = ""
34080-5 = ""
34080-6 = "А...?! Э-Эй!"
34080-7 = ""
34080-13 = ""
34080-14 = "И-и-и!"
34080-15 = ""
34080-19 = "Хиёри! Ты ранена?"
34080-20 = ""
34080-22 = ""
34080-24 = ""
34080-25 = "Л-Лидер..."
34080-26 = "Слава богу. К-Как вы меня нашли?"
34080-27 = "[s] «Главное, что мы успели.»"
34080-28 = "..."
34080-29 = "........."
34080-30 = "ЧЕГООО? ЧТО?!"
34080-31 = "Почему лидер и Сенсей вместе?!"
34080-32 = "Это..."
34080-33 = "Н-Неужели настало время моих страданий и наказания? Моё жалкое существование на этой планете подходит к концу!"
34080-34 = "Понятно... Вы спасли меня, чтобы лично схватить и пытать!"
34080-35 = "Поэтому и пришли именно сейчас! Вы бросите нас в ту подземную тюрьму! Мне говорили, там повсюду слышны крики студентов, восставших против Шале..."
34080-36 = "[s] «...»"
34080-37 = "Уа-а-а! Мне конец. Совсем конец. Если бы знала, что жизнь закончится так рано, постаралась бы наслаждаться ей сильнее! Хотя бы дочитала все журналы!"
34080-38 = "..."
34080-39 = "Но это не объясняет, почему вы вместе с Сенсеем, лидер. Что вообще происходит? А, теперь понятно..."
34080-40 = "Хиёри..."
34080-41 = "Сенсей вам угрожает, лидер? О нет! Жизнь лидера — сплошная череда страданий, прямо как моя! Посмотрите на эту боль у неё на лице! Простите, что вообще существую!"
34080-42 = "[s] «Хиёри, мы просто пришли тебя спасти.»"
34080-43 = "..."
34080-44 = "А?! Меня? Вы точно человека не перепутали?"
34080-45 = "Вас по голове ударили? Вы не помните, кто мы? Я сейчас заплачу от облегчения, если вы и правда меня спасаете... но правда? Я вообще ничего не понимаю..."
34080-46 = "Это правда, Хиёри. Сенсей решил нам помочь."
34080-47 = "...??"
34080-48 = "[s] «Мы спасём Ацуко, пока не стало слишком поздно.»"
34080-49 = ""
34080-51 = ""
34080-52 = ""
34080-53 = ""
34080-54 = "Химэ... Ацуко..."
34080-55 = "В-Вы правда думаете, что мы сможем спасти Химэ от Мадам?"
34080-56 = "Эм..."
34080-57 = ""
34080-59 = ""
34080-60 = "Она предложила позволить мне вернуться в район Ариуса, если я выдам местоположение лидера."
34080-62 = "...!"
34080-63 = "Сказала, что, поскольку я просто выполняла приказы, проявит снисхождение..."
34080-64 = "Понятно."
34080-65 = "Думаю, тебе стоит согласиться, Хиёри."
34080-66 = "...Ч-Что?"
34080-67 = "Скажи ей, где я, и она позволит тебе вернуться. Сохрани себя в безопасности."
34080-68 = "Это не остановит меня от попытки спасти Ацуко. Ты уже сделала достаточно."
34080-69 = "Ч-Что?! Но я..."
34080-70 = "Я всегда понимала, что этот день наступит. Спасибо, что всё это время выполняла мои требования."
34080-71 = "Но... понимаете... Я отказалась..."
34080-72 = ""
34080-74 = ""
34080-75 = "П-Почему настроение так резко изменилось? Почему вы выглядите так, будто рады простить предательницу?! Я для вас предательница?! Уа-а-а! Хуже некуда!"
34080-76 = "То есть... Она могла врать. И... мы всё это время были вместе... Я не хочу возвращаться без вас..."
34080-77 = "И... что насчёт Ацуко?"
34080-78 = "Я не могу просто бросить Ацуко и сбежать одна."
34080-79 = ""
34080-82 = "Вы ведь чувствуете то же самое, лидер? Поэтому и пришли за мной."
34080-83 = ""
34080-85 = ""
34080-86 = "Да. Мы обязаны её спасти, чего бы это ни стоило."
34080-87 = "Найдём Мисаки и придумаем план."
34080-88 = "...Верно. Она нам нужна... Идём!"
34080-89 = "Я... я думаю, что знаю, где она может быть."
34080-90 = "Кажется, я думаю о том же месте..."
34080-91 = "[s] «Отлично. Тогда идём.»"
34080-92 = "Х-Хорошо...!"
34080-94 = "Заброшенный мост"
34080-96 = "..."
34080-97 = "Это место..."
34080-98 = "[s] «Здесь довольно высоко.»"
34080-99 = "Да, и река внизу глубиной не меньше пяти метров."
34080-100 = ""
34080-101 = "Течение быстрое, так что если потерять сознание при ударе о воду, тебя унесёт за мгновение."
34080-102 = "Мисаки."
34080-103 = "М-Мисаки...!"
34080-104 = "Лидер, Хиёри... и даже Сенсей..."
34080-105 = "А, понятно. Значит, вот какое решение вы приняли, лидер."
34080-106 = "Удивлена, что вы это предложили, и ещё сильнее — что Сенсей согласился."
34080-107 = "Признаю, не думала, что такой сценарий вообще возможен. Никогда бы не представила вас двоих союзниками."
34080-108 = "Но вы слышали, Сенсей?"
34080-109 = "Мне предложили вернуться в Ариус, если я просто убью вас."
34080-110 = "[s] «...»"
34080-111 = "Хиёри и лидер, скорее всего, получили то же предложение."
34080-112 = "П-Примерно такое же."
34080-113 = "Да. Устранить Сенсея и заслужить её прощение."
34080-114 = "Вы доверяете спину человеку, который хочет в неё выстрелить, Сенсей?"
34080-115 = "Причём человеку, который уже однажды в вас стрелял?"
34080-116 = "..."
34080-117 = "[s] «Если бы Саори хотела меня застрелить, она бы уже это сделала.»"
34080-118 = "Понятно."
34080-119 = "В любом случае ситуация не меняется."
34080-120 = ""
34080-122 = ""
34080-123 = "[ns] «Мисаки? Ты слишком близко к перилам, мне это совсем не нравится...»"
34080-125 = "М-Мисаки...?!"
34080-126 = "Эта спасательная операция обречена."
34080-127 = "Проникнуть в район Ариуса, пробиться через все их войска и добраться до базилики, где держат Химэ?"
34080-128 = "Это и так невозможно, а у Мадам наверняка есть технологии, о которых мы даже мечтать не можем."
34080-129 = "Даже с помощью Сенсея у нас троих нет шансов."
34080-130 = "А если каким-то чудом мы всё-таки спасём Ацуко, что дальше?"
34080-131 = "Это просто отсрочка казни."
34080-132 = "..."
34080-133 = "Вся жизнь Химэ была сплошной болью. Зачем вы настаиваете продлевать её?"
34080-134 = "Vanitas vanitatum... Это единственная истина, которую мы способны понять."
34080-135 = "Разве не так, лидер?"
34080-136 = "..."
34080-137 = "Нет? А у вас есть ответ, Сенсей?"
34080-138 = "[s] «Мисаки, просто отойди от перил, и мы поговорим.»"
34080-139 = ""
34080-141 = ""
34080-142 = "Да заткнись ты уже, Мисаки."
34080-143 = "..."
34080-144 = "Думаешь, этот жалкий спектакль наконец принесёт тебе покой? Положит конец страданиям? Думаешь, я позволю?"
34080-145 = "..."
34080-146 = "Слушай, Мисаки. Если прыгнешь, вот что я сделаю."
34080-147 = "Сниму пальто и прыгну с моста следом. Ты знаешь, я тебя догоню."
34080-148 = "Уверена, ты набила карманы камнями, но это неважно. Я сорву с тебя одежду и вытащу из воды."
34080-149 = "Это займёт секунд двадцать. Если будешь без сознания, буду делать сердечно-лёгочную реанимацию, пока не очнёшься."
34080-150 = "Со мной такой трюк не пройдёт, Мисаки."
34080-151 = "Раньше я никогда тебе этого не позволяла. С чего решила, что начну сейчас?"
34080-152 = "..."
34080-153 = "*дрожит*"
34080-154 = "Попробовать стоило."
34080-155 = ""
34080-157 = ""
34080-159 = "Значит, вы действительно собираетесь спасать Химэ."
34080-160 = "До сих пор я слепо следовала за вами. Если наши судьбы заранее определены, неважно, что я выберу."
34080-161 = "Веди, Саори."
34080-162 = "Как всегда, доверяю тебе свою спину."
34080-163 = "Фух... Всё обошлось..."
34080-164 = "Лидер, у нас осталось только девяносто минут. Если не доберёмся до входа, все планы будут бессмысленны."
34080-165 = "Нужно спешить, Сенсей. Время идёт."
34080-166 = "Объясню по дороге. Уходим."
34080-167 = "..."
34080-168 = "Хорошо, т-тогда сюда!"
34080-169 = "[ns] «Спасём Ацуко.»"
34080-174 = "Следующий эпизод;В район Ариуса, часть 1"
