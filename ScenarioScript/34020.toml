[translation]
34020-1 = "Эпизод 2;Неловкий приём"
34020-2 = ""
34020-3 = "Давно не виделись. Спасибо, что пришли, Сенсей."
34020-4 = "[s] «Конечно. Всем привет.»"
34020-5 = "Рада встрече, Сенсей [USERNAME]. Мы всё ещё в долгу перед вами за прошлый раз."
34020-6 = "...Приятно познакомиться. Я Мине, капитан Рыцарей спасения."
34020-7 = "[s1] «Взаимно. Забавно видеть вас втроём.»\n[s2] «Интересная компания собралась.»"
34020-8 = "Ха-ха... Нагиса, наверное, назвала бы её проблемной."
34020-9 = "Ха-ха... Нагиса, наверное, назвала бы её проблемной."
34020-10 = "Я здесь не для того, чтобы провоцировать Нагису."
34020-11 = "Рыцари отстаивают свои убеждения и веру. Если я вижу несправедливость, я её исправляю. Вот и всё."
34020-13 = "Независимо от того, кто виновник."
34020-14 = "..."
34020-15 = "...От таких слов кто-нибудь однажды попадёт в неприятности."
34020-16 = "Хватит болтовни. Уверена, Сенсей занят."
34020-17 = "Сенсей, я пригласила вас, чтобы рассказать о ситуации в Тринити после инцидента с Эдемским договором и обсудить дальнейшие действия. Однако..."
34020-18 = "..."
34020-19 = "..."
34020-20 = "По причинам, которые мне не совсем понятны, лидеры Сестринства и Рыцарей спасения потребовали место за столом. И вот мы здесь."
34020-21 = "«Потребовали» — слишком жёсткое слово. Новый политический статус Сестринства означает, что мы должны участвовать в таких встречах."
34020-22 = "Как лидер Рыцарей спасения, старейшего клуба в истории Тринити, я всего лишь исполняю свой долг."
34020-23 = "..."
34020-24 = "[s] «То есть вы контролируете Чаепитие?»"
34020-25 = "Нет-нет. Я просто слежу за текущими событиями."
34020-26 = "А политика меня вообще не интересует."
34020-27 = "Инцидент с Эдемским договором благополучно завершился, но впереди ещё много разбирательств и анализа последствий."
34020-28 = "Сестринство помогает и проводит часть исследовательской работы."
34020-29 = "И цель этой встречи — обменяться информацией по этим вопросам."
34020-31 = "Она права."
34020-32 = "[s] «А-Ага... Понятно.»"
34020-33 = "..."
34020-34 = "Вы всё ещё выглядите растерянно. Понимаете, мы не могли просто оставить всё Чаепитию."
34020-35 = "Сейчас Чаепитие находится в хрупком состоянии."
34020-36 = "..."
34020-37 = "Арест действующего члена Чаепития — событие совершенно беспрецедентное. А нападение одного члена на другого — тем более."
34020-38 = "Представьте мой шок, когда я узнала, что за нападением на Сэю стояла Мика."
34020-39 = "..."
34020-40 = "..."
34020-41 = "Как вы прекрасно знаете, с тех пор Сэя находилась под моей защитой. Я сочла правильным самой расследовать дело."
34020-42 = "То, что Ариус воспользовался Микой, не снимает с неё ответственности."
34020-43 = "Кроме того, нынешняя хозяйка использовала экстерриториальные полномочия Шале в своих интересах и пыталась исключить неугодных студентов."
34020-44 = "..."
34020-45 = "Я понимаю, что вы извинились и в итоге никто не пострадал, но..."
34020-46 = "Это бросает тёмную тень на Чаепитие."
34020-47 = "..."
34020-48 = "Сам факт того, что Сэя вообще проснулась, — благословение. Но с тех пор её здоровье стабильно ухудшается, и теперь она прикована к постели."
34020-49 = "Поэтому я пришла к выводу, что Чаепитию нужна наша помощь."
34020-51 = "Верно."
34020-52 = "Какое ясное и обстоятельное объяснение, капитан Мине. Вы совсем не меняетесь."
34020-53 = ""
34020-55 = ""
34020-56 = ""
34020-57 = "[ns] «(Ну и неловко.)»"
34020-58 = "Капитан Мине — глава фракции Johan и лидер Рыцарей спасения."
34020-59 = "Она имела право участвовать в Чаепитии, но отказалась ради медицинской карьеры. Это даже мило."
34020-60 = "Не будем тратить время на воспоминания, Сакурако."
34020-61 = "Начну. В центре этого инцидента — Ариус."
34020-63 = "Мы подтвердили, что виновником инцидента с Эдемским договором действительно был Ариус."
34020-65 = ""
34020-66 = "Они координировали проникновения, по всей видимости обманув председателя Макото и Мику."
34020-67 = ""
34020-68 = "Более того, председатель Макото утверждает, что сама стала жертвой Тринити, поскольку Ариус — одна из её фракций."
34020-69 = "Она ещё бормотала какую-то чепуху о том, что выставит нам счёт за парикмахера, но это, думаю, можно проигнорировать."
34020-71 = "Именно участие Ариуса вызывает у Сестринства вопросы."
34020-72 = "Для начала: зачем Ариус напал на церемонию подписания Эдемского договора?"
34020-73 = "Ариус давно питал обиду и на Тринити, и на Геенну. Они увидели шанс подавить обе академии разом и воспользовались им."
34020-74 = "По словам Сэи, используя контракт Эдемского договора, они получили подавляющую военную силу."
34020-75 = "Да, армию, состоящую из призраков Совета Святой Юстины. Если бы их не остановили вовремя, и Тринити, и Геенна рухнули бы."
34020-76 = "..."
34020-77 = "Что вам известно об этих существах?"
34020-78 = "У нас нет ни крупицы доказательств. Только обоснованные догадки."
34020-79 = "Хорошо. Совет — предшественник Сестринства. Ты что-то скрываешь, Сакурако?"
34020-80 = "К сожалению, я знаю примерно столько же, сколько и вы."
34020-81 = "Я не могу игнорировать тот факт, что Сестринство держится на тайнах. Вы давно практикуетесь в манипулировании и сокрытии информации."
34020-82 = ""
34020-84 = ""
34020-86 = "Неудивительно, что многие студенты Тринити перестали доверять Сестринству."
34020-87 = ""
34020-89 = ""
34020-90 = ""
34020-92 = "Как и вы, капитан Мине?"
34020-93 = "..."
34020-94 = "..."
34020-95 = "[s] «(...Можно мне уйти?)»"
34020-96 = ""
34020-98 = ""
34020-99 = "Если вы думаете, что я единственная хранительница секретов Сестринства, то сильно ошибаетесь."
34020-100 = "Есть множество вещей, которых не знаю даже я. Больше сказать не могу."
34020-101 = "Я говорила из незнания. Прошу прощения."
34020-102 = "Ох..."
34020-103 = "Переходим к следующему вопросу. Анализ ракеты, нейтрализовавшей нашу систему обороны, завершён?"
34020-104 = "К сожалению, ничего не выяснили. Материалы и технология нам неизвестны. Откуда бы она ни появилась, это было не из Кивотоса."
34020-105 = "Неудивительно. В распоряжении филиала Ариуса есть как минимум два мощных ресурса, о которых мы ничего не знаем."
34020-106 = "И это подводит меня к следующему вопросу."
34020-107 = "Какие сведения у вас есть о планах Ариуса?"
34020-108 = "..."
34020-109 = "Ничего выяснить не удалось."
34020-110 = "Мы даже не можем найти район Ариуса, не говоря уже о сборе разведданных."
34020-111 = "Их местонахождение давно остаётся загадкой. Но несколько зацепок я всё-таки нашла."
34020-112 = "Во время инцидента с Эдемским договором они проникли через подземные катакомбы."
34020-113 = "Все предыдущие проникновения Ариуса тоже можно связать с катакомбами. Более того, крылатую ракету запустили из района руин в Тринити."
34020-114 = "Подземные руины? Это огромная сеть. Мы никогда не сможем взять её под контроль."
34020-115 = "К тому же тоннели там как лабиринт. Найти их внутри будет почти невозможно."
34020-116 = "Хм..."
34020-117 = "Сэя считает, что район может быть защищён какой-то непостижимой силой."
34020-118 = "Иначе она не видит объяснения тому, как им удаётся оставаться совершенно незаметными."
34020-119 = "Снова вещи, которых мы не понимаем..."
34020-120 = "Азуса, перешедшая из Ариуса, сказала, что перед каждой миссией ей давали карту катакомб с отмеченным маршрутом выхода."
34020-121 = ""
34020-123 = ""
34020-124 = "Но маршруты каждый раз были разными, поэтому пути обратно в район Ариуса она не знает."
34020-125 = "Вы её ДОПРАШИВАЛИ?!"
34020-126 = "Ч-Что?"
34020-127 = "Спрошу ещё раз. Вы заставили Ширасу Азусу выдать вам информацию?"
34020-128 = "Она стала предательницей в единственном доме, который знала, потому что помогла нам. Как вы смеете заставлять её страдать ещё больше?"
34020-130 = "Она наконец начала здесь привыкать! А вы ради собственной выгоды снова вскрываете старые раны? Это бездумно и жестоко."
34020-131 = "В-Вы неправильно поняли! Она сама предложила эту информацию."
34020-133 = "Очень сомневаюсь! Вы её принудили? Угрожали властью Чаепития?"
34020-134 = "Что, простите?!"
34020-135 = "Следите за словами, капитан Мине. Ваши обвинения ни на чём не основаны."
34020-136 = "Вы это проверили?"
34020-137 = "Да. Я знаю, Нагиса совершила немало отвратительных поступков, но с Азусой никогда плохо не обращались."
34020-138 = ""
34020-140 = ""
34020-141 = "Как минимум тот Сенсей никогда бы не позволил тронуть с её головы ни волоса."
34020-142 = "...Понятно."
34020-143 = "Я должна извиниться перед вами, Нагиса."
34020-144 = "..."
34020-145 = "[s3] «(Чашка Нагисы дрожит...)»\n[s4] «Ты в порядке, Нагиса?»"
34020-146 = "Не то чтобы я не понимала."
34020-147 = "Да. Я понимаю, правда."
34020-148 = "Ханако, Кохару, Азуса и... Хифуми."
34020-149 = "Каждая участница Клуба дополнительных занятий несёт на себе куда больше, чем должна была."
34020-150 = "И их тяжесть — следствие моих действий."
34020-151 = "Я не настолько бесстыдна. Я понимаю, что сделала."
34020-152 = "Я изо всех сил стараюсь держать их подальше от внимания, пока мы разгребаем последствия."
34020-153 = "Я хочу защитить их от повторения подобного. В конце концов, это наша ответственность."
34020-154 = "[s] «Нагиса...»"
34020-155 = "Я думаю так же. И снова заговорила, не подумав. Прошу простить мою оплошность."
34020-156 = "Рада, что мы все пришли к согласию."
34020-157 = "Я надеялась начать передавать обязанности Ханако, но..."
34020-158 = "Наш договор завершён, и я не стану её принуждать."
34020-159 = "Так что эта борьба — наша. Это меньшее, что мы можем для них сделать."
34020-160 = "Но у меня ощущение, что один конкретный учитель будет с нами до конца."
34020-161 = "[s] «Явился на службу.»"
34020-162 = "...Спасибо, Сенсей."
34020-164 = "Катакомбы — огромный лабиринт неизвестного масштаба. Найти меняющийся вход будет проблемой."
34020-165 = "Если только не спросить кого-то, кто хорошо знает эти проходы."
34020-166 = "У вас кто-то есть на примете?"
34020-168 = ""
34020-169 = "Джомаэ Саори, лидер отряда Ариуса, которая координировала нападение, должна знать путь."
34020-170 = "Верно. Именно Саори реализовывала их стратегию."
34020-171 = "Отряд нам обнаружить не удалось. Скорее всего, они покинули район."
34020-172 = "...Я могу назвать кое-кого ещё."
34020-173 = "..."
34020-174 = "Можешь? Кто вообще..."
34020-175 = ""
34020-177 = ""
34020-178 = ""
34020-179 = "Мисоно Мика."
34020-180 = "Что?!"
34020-182 = "Мика говорила, что не знает, где находится район Ариуса."
34020-183 = "Она долго сотрудничала с Ариусом. Вы правда думаете, что она понятия не имеет?"
34020-184 = "..."
34020-185 = "У нас есть записи, что Мика связывалась со студентами Ариуса для координации поставок."
34020-186 = "Можно лишь предположить, что она обратилась к Ариусу, чтобы получить поддержку для переворота."
34020-187 = "Но Мика..."
34020-188 = "Репутацию и поведение Мики за последние годы трудно назвать образцовыми."
34020-189 = "Вы знаете, что Мика прикрывалась Чаепитием, чтобы скрывать свои ошибки и избегать проблем."
34020-190 = "Осуждение, протесты и общественное мнение против Мики — результат долго копившегося раздражения её поступками."
34020-191 = "[s] «(...Протесты? Что происходит?)»"
34020-192 = "Мика бы не стала лгать об этом. Какой у неё мотив?"
34020-193 = "..."
34020-194 = "Я понимаю ваши чувства к Мике, Нагиса."
34020-195 = "Насколько я знаю, ваша дружба с ней тянется ещё с детства. Значит, вы знаете её лучше всех."
34020-196 = "..."
34020-197 = ""
34020-199 = ""
34020-201 = "Простите, если вопрос грубый, но ответьте честно. Вы думаете, Мика всё ещё что-то скрывает?"
34020-203 = ""
34020-204 = ""
34020-205 = "Если она что-то скрывает..."
34020-206 = "[s] «(Нагиса...)»"
34020-207 = ""
34020-209 = ""
34020-210 = "Нет. Я доверяю Мике."
34020-211 = "..."
34020-212 = "..."
34020-213 = "Я не могу всерьёз утверждать, что она была образцовым студентом."
34020-214 = "Но теперь я понимаю, что значит верить в человека!"
34020-215 = "Я убежу остальных тоже довериться Мике! Завтра на слушании я буду защищать её..."
34020-216 = "...против любого, кто обвинит её! Если понадобится, я сражусь со всей академией!"
34020-217 = "К чёрту последствия!"
34020-218 = "Я лишь перебирала все возможности, Нагиса. Никто её не обвиняет."
34020-219 = "Мы задели болезненную тему. Простите."
34020-220 = "[s] «Ну как ты там, Нагиса?»"
34020-221 = "*вздыхает*"
34020-222 = "Не волнуйтесь. Думаю, на этом можно заканчивать."
34020-223 = "Спасибо вам обеим, что пришли сегодня. Правда."
34020-224 = "Да, спасибо, что приняли мою просьбу присоединиться к встрече."
34020-225 = "Но предупрежу: меня очень беспокоит всплеск гнева в адрес Мики."
34020-226 = "Посмотрю, могу ли я чем-то ей помочь. До встречи."
34020-227 = "Я тоже откланяюсь."
34020-228 = "Простите, что не могу проводить вас. Счастливого пути."
34020-229 = ""
34020-233 = "*вздыхает*"
34020-234 = "Уф. Живот болит."
34020-235 = "[s] «Ты отлично справилась, Нагиса.»"
34020-236 = "Спасибо, Сенсей. Вы всё время видите мои стороны, которые я не собираюсь показывать."
34020-237 = "[s5] «Кстати... что случилось с Микой?»\n[s6] «Ситуация с Микой звучит серьёзно.»"
34020-238 = "А, да. Наверное, вы и правда не знаете."
34020-239 = "А, да. Наверное, вы и правда не знаете."
34020-240 = "Слушание Мики состоится завтра утром."
34020-241 = "[s] «Почему вообще будет слушание?!»"
34020-242 = "Ну, это скорее... вынесение дисциплинарного решения под надзором своего рода консультативного комитета."
34020-243 = "Там представят и обсудят преступления и нарушения Мики, особенно связанные с Эдемским договором."
34020-244 = ""
34020-246 = ""
34020-247 = "...Сенсей."
34020-248 = ""
34020-250 = ""
34020-251 = "Мику собираются исключить."
34020-253 = "Следующий эпизод;Заключённая принцесса"
