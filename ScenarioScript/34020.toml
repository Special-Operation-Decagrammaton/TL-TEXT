[translation]
34020-1 = "Episódio 2;Uma Tea Party Desalinhada"
34020-3 = "Muito obrigada por vir, Sensei. Faz algum tempo desde a sua última visita à Trinity, não é?"
34020-4 = "[s] \"Olá, Nagisa, pessoal.\""
34020-5 = "Nos encontramos novamente, [USERNAME]-sensei. Muito obrigada pela ajuda outro dia."
34020-6 = "...Muito prazer. Sou Mine, capitã das Cavaleiras Socorristas."
34020-7 = "[s1] \"Sim, muito prazer.\"\n[s2] \"Que combinação mais inusitada.\""
34020-8 = "Fufu... Mais do que inusitada, eu diria que é uma combinação que deixa a Nagisa-san desconfortável."
34020-9 = "Fufu... Mais do que inusitada, eu diria que é uma combinação que deixa a Nagisa-san desconfortável."
34020-10 = "Não tenho a intenção de deixar a Anfitriã desconfortável."
34020-11 = "Como membro de uma nobre ordem de cavaleiras que preza pela convicção e pelo orgulho, estou aqui apenas para corrigir aqueles que se desviaram do caminho."
34020-13 = "Mesmo que sejam alunas do Comitê de Justiça ou da Tea Party."
34020-14 = "..."
34020-15 = "...Parece que essas próprias palavras já estão deixando a Nagisa-san desconfortável."
34020-16 = "Bem, vamos encerrar a conversa fiada por aqui."
34020-17 = "O motivo pelo qual chamei o Sensei foi para discutirmos os desdobramentos após o recente Tratado do Éden e a resolução do incidente... mas..."
34020-18 = "..."
34020-19 = "..."
34020-20 = "As líderes da Irmandade e das Cavaleiras Socorristas insistiram em comparecer... e acabou ficando desta forma."
34020-21 = "...A Irmandade também mudou. De agora em diante, pretendemos participar ativamente de reuniões como esta."
34020-22 = "Eu também estou aqui apenas para cumprir meu dever como capitã das Cavaleiras."
34020-23 = "..."
34020-24 = "[s] \"Hum... Quer dizer que vocês duas vieram para manter a Tea Party na linha...?\""
34020-25 = "Não, é puramente por interesse."
34020-26 = "Eu não entendo muito bem dessas questões políticas."
34020-27 = "O tumulto do Tratado do Éden foi contido de alguma forma, mas os procedimentos pós-incidente e a análise da situação ainda não terminaram."
34020-28 = "Nós também não estamos alheias a esse incidente... até porque a Irmandade está encarregada de parte da análise."
34020-29 = "Por favor, considere esta reunião como um espaço para compartilharmos essas informações e discutirmos as medidas posteriores."
34020-31 = "É exatamente isso."
34020-32 = "[s] \"Entendo...\""
34020-33 = "..."
34020-34 = "Quanto à dúvida do porquê estamos fazendo isso em vez da Tea Party, eu mesma responderei."
34020-35 = "Neste momento, a Tea Party precisa de ajuda externa."
34020-36 = "..."
34020-37 = "Por volta da época do Tratado do Éden, ocorreu o incidente em que uma integrante da Tea Party atacou a Anfitriã e, como resultado, chegamos à situação sem precedentes de ela ser levada para a prisão."
34020-38 = "Quem diria que foi a própria Mika-sama quem ordenou o ataque à Seia-sama..."
34020-39 = "..."
34020-40 = "..."
34020-41 = "Como todos sabem, fui eu quem cuidou do tratamento da Seia-sama. Por isso, também investiguei este incidente à minha própria maneira."
34020-42 = "No fim das contas, a Mika-sama acabou sendo usada por Arius... mas isso não apaga os pecados que ela mesma cometeu."
34020-43 = "Além disso, a atual Anfitriã, Nagisa-sama, tentou usar uma organização extralegal chamada \"Schale\" para forçar a expulsão de alunas inocentes."
34020-44 = "..."
34020-45 = "Ouvi dizer que ela pediu desculpas às alunas prejudicadas e que tudo foi mais ou menos resolvido, mas..."
34020-46 = "Ainda assim, isso não significa que os atos da Nagisa-sama deixaram de existir."
34020-47 = "..."
34020-48 = "Felizmente, a Seia-sama pôde retornar à academia... porém, seu estado de saúde piorou ainda mais do que antes, a ponto de não conseguir sair do próprio quarto."
34020-49 = "Portanto, é meu julgamento que a atual e instável \"Tea Party\" precisa de auxílio externo."
34020-51 = "Compreendo."
34020-52 = "...Muito obrigada pela explicação tão detalhada, Capitã Mine."
34020-57 = "[ns] (Q-Que climão...)"
34020-58 = "A Capitã Mine é a líder do clube com a história mais antiga de Trinity e a chefe da facção Johanne."
34020-59 = "Originalmente, ela tem o direito de participar da Tea Party... embora, até hoje, tenha recusado para realizar pessoalmente as atividades de socorro."
34020-60 = "Isso são águas passadas."
34020-61 = "...Ao desvendarmos este incidente, tudo converge para a Filial Arius."
34020-63 = "O ataque ao local da conferência do Tratado do Éden teve a Filial Arius tanto como autora quanto como mentora por trás dos panos."
34020-66 = "Pode-se dizer que tanto a Presidente Makoto quanto a Mika-san foram apenas manipuladas pelas mãos de Arius..."
34020-68 = "A Presidente Makoto alega que, como Arius, uma facção dissidente de Trinity, foi quem os atacou, ela é na verdade uma vítima e toda a responsabilidade recai sobre nós."
34020-69 = "Por conta disso, ela disse o absurdo de que vai cobrar de nós até as despesas do salão de beleza para cortar o cabelo que foi queimado... Bem, deixemos isso de lado."
34020-71 = "Se Arius estava puxando as cordas por trás dos panos... ainda restam algumas dúvidas."
34020-72 = "Primeiro: por que a Filial Arius sabotou o Tratado do Éden?"
34020-73 = "Tenho conhecimento de que a Filial Arius nutre um ódio antigo tanto pela nossa Trinity quanto por Gehenna. Deve ter sido a oportunidade perfeita para neutralizar as figuras-chave de ambas as academias de uma só vez."
34020-74 = "Além disso, eles usaram o \"contrato\" conhecido como Tratado do Éden para obter uma força militar inexplicável... foi assim que a Seia-san explicou."
34020-75 = "Sim. Fantasmas com a forma do \"Conselho das Santas de Justina\". Se eles tivessem atacado Trinity e Gehenna daquele jeito... ambas as academias teriam entrado em colapso sem poder fazer nada."
34020-76 = "..."
34020-77 = "O que diabos era aquilo?"
34020-78 = "Existem algumas hipóteses sobre isso... mas, no momento, não conseguimos encontrar provas que as confirmem."
34020-79 = "O Conselho das Santas foi originalmente o grupo antecessor da Irmandade. Sakurako-san, não há nada sobre isso que esteja escondendo de nós?"
34020-80 = "...Não, infelizmente."
34020-81 = "A Irmandade sempre foi um grupo cheio de segredos. Vocês também são excelentes em controlar, ocultar e distorcer informações."
34020-86 = "Sabia que há muitas alunas na academia que nutrem suspeitas em relação à Irmandade?"
34020-92 = "...Como você, por exemplo?"
34020-93 = "..."
34020-94 = "..."
34020-95 = "[s] (Q-Que climão...)"
34020-99 = "...Se pensa que eu conheço todos os segredos da Irmandade, está enganada."
34020-100 = "Existem muitas coisas ocultas na Irmandade que nem mesmo eu conheço — embora eu não possa entrar em detalhes."
34020-101 = "...Entendo. Perdoe a minha indelicadeza."
34020-102 = "Haa..."
34020-103 = "Aquele míssil de cruzeiro que neutralizou o sistema de defesa de Trinity... como está o andamento da análise dele?"
34020-104 = "Estamos avançando com a análise, mas até o momento tanto a origem quanto a estrutura são desconhecidas... A única coisa que sabemos é que não se trata de uma tecnologia existente em Kivotos..."
34020-105 = "...Isso significa que a Filial Arius garantiu pelo menos dois poderes desconhecidos."
34020-106 = "Sim. E isso nos leva à segunda dúvida."
34020-107 = "Segundo: o que a Filial Arius está planejando?"
34020-108 = "..."
34020-109 = "...Sobre isso, não sabemos de absolutamente nada."
34020-110 = "Acima de tudo — nós nem sequer sabemos onde fica o distrito autônomo de Arius."
34020-111 = "...Isso sempre foi um mistério, mas este incidente nos permitiu obter algumas pistas."
34020-112 = "Naquela ocasião, elas se infiltraram pelas Catacumbas subterrâneas da Antiga Catedral."
34020-113 = "Descobrimos que todas as rotas de infiltração que usaram até agora também estão ligadas às Catacumbas. O local de lançamento do míssil de cruzeiro também foi em uma área de ruínas dentro de Trinity."
34020-114 = "Há um número considerável de ruínas subterrâneas no distrito autônomo de Trinity. É impossível investigar e controlar todas elas."
34020-115 = "Para completar, as Catacumbas são um labirinto cuja extensão ainda não foi revelada... Encontrar o distrito autônomo de Arius por conta própria a partir de lá também seria extremamente difícil."
34020-116 = "Hum..."
34020-117 = "Segundo a Seia-san, aquele distrito autônomo é protegido por \"um certo poder\" que está além da nossa compreensão."
34020-118 = "Ela disse que, se não fosse por isso, seria impossível explicar como conseguiram permanecer escondidos até hoje..."
34020-119 = "Mais uma conversa sobre poderes além da compreensão..."
34020-120 = "Pelo relato da Azusa-san, que já pertenceu a Arius, a cada missão ela recebia um mapa com o registro da saída das Catacumbas."
34020-124 = "A rota do mapa mudava todas as vezes e ainda por cima era criptografada... Ela disse que, como traidora, já não conhece mais o caminho de volta ao distrito autônomo de Arius..."
34020-125 = "...Vocês interrogaram essa garota?"
34020-126 = "Hã?"
34020-127 = "Shirasu Azusa-san... Vocês forçaram aquela menina a confessar informações sobre Arius?"
34020-128 = "Ela já pagou um preço mais do que suficiente! Foi marcada como traidora pelo próprio distrito de onde veio e, mesmo assim, deu o seu melhor por nós!"
34020-130 = "Envolver em nossas circunstâncias uma garota que finalmente deve ter recuperado a paz de espírito e pressioná-la por informações de Arius... Que crueldade...!"
34020-131 = "A-Ah, não! Não foi um interrogatório nem nada do tipo, foi algo que ela mesma nos contou espontaneamente..."
34020-133 = "Como se aquela garota fosse querer falar sobre isso por vontade própria! Vocês sem dúvida usaram a autoridade da Tea Party para coagir uma jovem indefesa...!!"
34020-134 = "Hã!? Q-Quê!?"
34020-135 = "Acalme-se, Capitã Mine. Isso não é verdade."
34020-136 = "...Não é?"
34020-137 = "Sim. É verdade que a Nagisa-san é uma pessoa cruel, sem sangue nas veias nem lágrimas, mas desta vez não foi o caso. A Azusa-san não recebeu nenhum tratamento desrespeitoso."
34020-141 = "Acima de tudo, o \"Clube de Aulas de Reforço\" é supervisionado pelo Sensei da Schale. Se algo assim tivesse acontecido, o Sensei não teria ficado calado."
34020-142 = "...Tem razão."
34020-143 = "Perdoe a minha indelicadeza, Nagisa-sama."
34020-144 = "..."
34020-145 = "[s3] (A xícara de chá da Nagisa está tremendo...)\n[s4] \"V-Você está bem, Nagisa?\""
34020-146 = "...Sim, eu também sei disso."
34020-147 = "...Sim, eu também sei disso."
34020-148 = "Hifumi-san... Hanako-san, Koharu-san, Azusa-san..."
34020-149 = "As meninas do Clube de Aulas de Reforço carregaram um fardo muito maior do que a responsabilidade que deveriam assumir..."
34020-150 = "Entre as coisas que elas acabaram carregando, certamente havia fardos causados por mim..."
34020-151 = "Quanto a isso, eu também tenho responsabilidades a assumir e muitos arrependimentos..."
34020-152 = "Por isso mesmo, estou me esforçando para que aquelas meninas não sejam envolvidas em situações como esta após o Tratado do Éden..."
34020-153 = "Essa troca de acusações suja deve ser papel nosso... Não podemos fazer com que aquelas meninas passem por uma experiência dessas..."
34020-154 = "[s] \"Nagisa...\""
34020-155 = "...Tem toda razão, Nagisa-sama. Por favor, perdoe a minha falta de cortesia."
34020-156 = "...Eu concordo."
34020-157 = "Pessoalmente, eu bem que gostaria de passar essa função para a Hanako-san, mas..."
34020-158 = "O acordo que ela fez comigo já foi cumprido... e também acho que não devemos colocar mais nenhum peso sobre os ombros dela."
34020-159 = "Resolvermos os problemas restantes apenas entre nós... essa deve ser a cortesia mínima que podemos oferecer."
34020-160 = "Contudo, acredito que o Sensei continuará agindo conosco até o fim."
34020-161 = "[s] \"Sim, claro.\""
34020-162 = "...Muito obrigada, Sensei."
34020-164 = "As Catacumbas são um labirinto gigantesco cujo mapa completo sequer é conhecido... Procurar uma entrada que muda todas as vezes é, de fato, um problema difícil."
34020-165 = "Vamos inverter a lógica... Que tal ouvirmos alguém que já conhece as passagens?"
34020-166 = "Alguém que conhece as passagens...?"
34020-169 = "A líder do \"Esquadrão Arius\", que conduziu o ataque: Joumae Saori. Ela com certeza conhece as passagens como a palma da mão."
34020-170 = "...Entendo. Se tratando de quem comandou o ataque, ela certamente..."
34020-171 = "Porém, o paradeiro do \"Esquadrão\" é desconhecido... A probabilidade de já terem fugido para o distrito autônomo é alta."
34020-172 = "Além do \"Esquadrão\", não há mais uma aluna que conhece muito bem as passagens?"
34020-173 = "..."
34020-174 = "Hum...? De quem está falando...?"
34020-179 = "Misono Mika."
34020-180 = "...!?"
34020-182 = "I-Isso não... A própria Mika-san disse que a localização do distrito autônomo de Arius era a única coisa que ela não sabia..."
34020-183 = "...Ela esteve em conluio com Arius por muito tempo. E mesmo assim você acredita nas palavras dela de que não sabe onde Arius fica?"
34020-184 = "..."
34020-185 = "...Se não me engano, há registros de que a Mika-sama entregou suprimentos para alunas de Arius."
34020-186 = "Para dar um golpe de Estado e obter o apoio de Arius... Seria natural pensar assim."
34020-187 = "Mas... a Mika-san..."
34020-188 = "A reputação e as atitudes da Mika-sama até hoje não podem ser chamadas de exemplares."
34020-189 = "Creio que a Nagisa-sama saiba muito bem disso... A Mika-sama usou sua posição na Tea Party como escudo para encobrir inúmeras falhas e problemas."
34020-190 = "Neste exato momento, as denúncias e o tumulto contra a Mika-sama que estão ocorrendo na academia — essa opinião pública também não pode ser considerada sem relação com o comportamento dela até aqui."
34020-191 = "[s] (...Tumulto?)"
34020-192 = "Está dizendo que... a Mika-san mentiu...?#nPara esconder o distrito autônomo de Arius... Mas por que ela faria..."
34020-193 = "..."
34020-194 = "Compreendo perfeitamente os sentimentos de consideração da Nagisa-sama pela Mika-sama."
34020-195 = "Ainda assim, perdoe a franqueza, mas — se formos discutir quem melhor entende a Mika-sama, não seria justamente a Nagisa-sama, sua amiga de infância?"
34020-196 = "..."
34020-201 = "Aos olhos da Nagisa-sama, você sente que a Mika-sama ainda está escondendo algo de nós?"
34020-205 = "Isso é..."
34020-206 = "[s] (Nagisa...)"
34020-210 = "...Não, eu acredito na Mika-san."
34020-211 = "..."
34020-212 = "..."
34020-213 = "É verdade que... a Mika-san não pode ser chamada de uma aluna exemplar, mas..."
34020-214 = "Mesmo assim, eu acredito na Mika-san — pois essa foi a lição que aprendi desta vez."
34020-215 = "Para que as outras pessoas também possam acreditar nela, comparecerei à audiência de amanhã e defenderei a Mika-san."
34020-216 = "Para que vocês — e, se necessário, toda esta academia — acreditem no depoimento da Mika-san!"
34020-217 = "Mesmo que eu acabe sendo condenada por isso... eu..."
34020-218 = "...Não, eu apenas levantei uma hipótese, sem nenhuma segunda intenção. Peço desculpas por causar um mal-entendido, Nagisa-sama."
34020-219 = "...Perdoe-me. Peço desculpas pela minha falta de cortesia."
34020-220 = "[s] \"Hum... bem...\""
34020-221 = "...Haa."
34020-222 = "Pois bem... já está ficando tarde, então que tal encerrarmos por hoje?"
34020-223 = "Muito obrigada por disponibilizarem seu tempo em meio a tantos compromissos hoje."
34020-224 = "...Imagina. Foi bom poder encontrá-los. Muito obrigada."
34020-225 = "E eu também considero esta situação... as críticas contra a Mika-sama, profundamente lamentáveis."
34020-226 = "Vou procurar uma solução à minha própria maneira. Com licença."
34020-227 = "Sim — sendo assim, eu também retornarei à Grande Catedral."
34020-228 = "Sim, vão com cuidado."
34020-233 = "Haa..."
34020-234 = "...Meu estômago está doendo."
34020-235 = "[s] \"Bom trabalho.\""
34020-236 = "...Muito obrigada, Sensei. Sinto que só tenho lhe mostrado um lado patético meu ultimamente..."
34020-237 = "[s5] \"Sobre aquilo agora há pouco... aconteceu alguma coisa com a Mika?\"\n[s6] \"Desde aquela hora você parece...\""
34020-238 = "...Ah. Então ainda não havia chegado aos ouvidos do Sensei?"
34020-239 = "...Ah. Então ainda não havia chegado aos ouvidos do Sensei?"
34020-240 = "Amanhã de manhã, está programada uma audiência para a Mika-san."
34020-241 = "[s] \"Uma audiência?\""
34020-242 = "Sim. Embora se chame audiência, na prática está mais para um interrogatório sobre o incidente recente... Seria melhor pensar nisso como um conselho de inquérito."
34020-243 = "Os pecados que a Mika-san cometeu até agora... especialmente aqueles relacionados ao Tratado do Éden, serão o centro da discussão..."
34020-247 = "...Sensei."
34020-251 = "A Mika-san... certamente será expulsa."
34020-253 = "Próximo;A Princesa na Gaiola"
