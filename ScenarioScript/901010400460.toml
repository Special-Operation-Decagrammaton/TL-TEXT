901010400460-35 = "O QUÊÊÊÊ?!"
901010400460-38 = "P-peraí... Deixa eu ver se entendi o resumo da ópera do Sensei..."
901010400460-39 = "Um bicho de pelúcia raro chamado \"Perorozilla\" se materializou em tamanho colossal pelo anseio dos fãs... #ne marchou em direção ao D.U.?"
901010400460-40 = "E o senhor teve que derrotar a besta numa operação conjunta com a Valkyrie?!"
901010400460-41 = "...Isso é piada, né?"
901010400460-42 = "[s] \"N-não é piada de jeito nenhum!\""
901010400460-43 = ""
901010400460-46 = "[ns3] \"Foi um incidente resolvido discretamente por Schale antes de chegar aos olhos da população...\"\n[ns4] \"Com exceção de uma unidade seleta da Valkyrie, quase ninguém em Kivotos sabe disso.\""
901010400460-49 = "Pensando bem, nos arquivos do Departamento de Segurança da Valkyrie constava um envio maciço de tropas costeiras."
901010400460-50 = "Mas as causas do alerta e a extensão dos danos foram todas tarjadas e classificadas como ultra-secretas..."
901010400460-51 = "Mas como é que um desastre desse tamanho aconteceu e nós nunca ficamos sabendo de nada?"
901010400460-52 = "Naquela época estávamos foragidas e procuradas por invadir o Conselho Estudantil Federal, esqueceu?"
901010400460-53 = "Ah... verdade, né."
901010400460-55 = "Se um kaiju colossal desses surgiu nas águas próximas ao D.U., mais alguém deveria ter visto..."
901010400460-56 = "É muito curioso que nenhuma foto ou relato tenha vazado nas redes sociais na época."
901010400460-57 = "[s5] \"O Conselho Estudantil Federal impôs blecaute informativo rigoroso pra evitar o pânico coletivo.\"\n[s6] \"Por isso quase todas as alunas acham que foi só mais uma lenda urbana.\""
901010400460-61 = "Realmente, aquele Peroro... ou seja lá como chamam esse pássaro, pode até ser esquisito, mas não parece uma criatura aterradora."
901010400460-62 = "Faz todo sentido que tenham tratado o caso como mero boato fantasioso."
901010400460-63 = "Uma entidade nascida de uma lenda urbana que se transforma ela mesma em lenda urbana... Que irônico."
901010400460-64 = "Quem diria que um boneco fofo daqueles viraria um monstro gigante destruidor de cidades."
901010400460-65 = "Se qualquer mascote famoso pode virar kaiju, estamos lascadas! #nJá pensou se um dia tivermos que enfrentar um Shuppogaki gigante na linha do trem?!"
