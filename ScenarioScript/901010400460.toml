[translation]
901010400460-6 = "Muito bem, vamos alinhar o que apuramos até este momento."
901010400460-7 = "1. \"O impacto do boato sobre o preço e a pesca de caranguejos foi insignificante no atacado.\""
901010400460-8 = "2. \"O foco central da lenda urbana foi calculado para despertar terror e aversão psicológica.\""
901010400460-9 = "3. \"A origem e propagação do boato partiu de civis da cidade, e não dos trabalhadores do porto.\""
901010400460-11 = "Hum... Só com isso ainda não dá pra cravar se o desaparecimento tem a ver com Lore."
901010400460-12 = "Não conseguiu nenhuma pista sobre o Miyaguchi — o pescador sumido?"
901010400460-14 = "Ainda não. Se uma forasteira chegasse perguntando de cara sobre um desaparecido, ia acender todos os alertas."
901010400460-15 = "Mas agora que já quebrei o gelo e fiz amizade, vou tocar no assunto na próxima visita."
901010400460-17 = "Amanhã é folga coletiva das docas, então retomamos a operação depois de amanhã com tudo."
901010400460-18 = "Tomara que nesse meio tempo a lenda não tome forma e um monstro gigante resolva dar as caras~"
901010400460-19 = "Pensando bem, o mar é o cenário preferido pra filmes de monstros gigantes e kaijus, né?"
901010400460-20 = "Lembrei até daquele boato de que um monstro no formato de mascote infantil emergiu do oceano faz pouco tempo."
901010400460-21 = "Você tá falando daquele pássaro esquisito e feio chamado Pepperoni?"
901010400460-22 = "Disseram que o desejo ardente dos fãs por um bicho de pelúcia exclusivo fez o bicho se materializar de verdade..."
901010400460-23 = "Eu dei muita risada na hora de tão ridículo."
901010400460-24 = "Pois é. Se o monstro fosse esse tal de Pepperoni, não meteria medo em ninguém."
