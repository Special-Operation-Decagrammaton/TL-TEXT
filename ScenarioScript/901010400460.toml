[translation]
901010400460-6 = "Что ж, подведём итог тому, что выяснили."
901010400460-7 = "Городская легенда оказывает на цены на краба и рыболовный промысел куда меньшее влияние, чем мы ожидали."
901010400460-8 = "Городская легенда делает упор на психологический ужас, а не на фактическую достоверность."
901010400460-9 = "Городская легенда распространилась через обычных людей, а не через тех, кто связан с рыболовной отраслью порта Канесаки."
901010400460-11 = "Информация полезная, но её недостаточно. Я всё ещё не вижу связи пропавших людей с Лором и вообще не уверена, что это дело Лора."
901010400460-12 = "Вернёмся к Миягучи. Удалось узнать о нём что-нибудь ещё?"
901010400460-14 = "Нет. Это уже показалось мне слишком подозрительным. Люди насторожились бы, если бы незнакомец начал расспрашивать о пропавшем человеке."
901010400460-15 = "Но теперь я уже не совсем незнакомка. В следующий раз расспрошу рыбаков."
901010400460-17 = "Завтра порт закрыт. Продолжим расследование послезавтра."
901010400460-18 = "Надеюсь только, что слух не успеет распространиться... и до тех пор не появится ЕЩЁ ОДНА аномалия."
901010400460-19 = "Похоже, море порождает немало чудовищ из городских легенд."
901010400460-20 = "Ну, как та история про монстра-курицу, которая была некоторое время назад."
901010400460-21 = "А, та уродливая птица. Как её звали? Пепперони?"
901010400460-22 = "Говорили, что безумное желание фанатов заполучить утраченную лимитированную плюшевую игрушку породило монстра..."
901010400460-23 = "Ого. Хорошая история..."
901010400460-24 = "Вот именно. Будто я стану бояться такого нелепого монстра."
901010400460-25 = ""
901010400460-27 = ""
901010400460-28 = ""
901010400460-29 = "...А? Почему вы так смотрите, Сенсей?"
901010400460-30 = "[s1] «Ну, дело в том...»\n[s2] «...'Перородзилла' действительно существовал.»"
901010400460-31 = ""
901010400460-32 = ""
901010400460-34 = ""
901010400460-35 = "Что?!"
901010400460-38 = "Давайте уточним, Сенсей."
901010400460-39 = "Эта лимитированная плюшевая игрушка по имени Перородзилла ожила из-за навязчивых желаний фанатов..."
901010400460-40 = "...Затем он приблизился к Ц.Р. и был разбит в совместной операции с Шале и Валькирией?"
901010400460-41 = "...Вы правда шутите?"
901010400460-42 = "[s] «Я-я не шучу!»"
901010400460-43 = ""
901010400460-46 = "[ns3] «Шале разобрался с ней прежде, чем кто-либо успел заметить...»\n[ns4] «Так что знают об этом лишь несколько студентов Валькирии.»"
901010400460-49 = "Знаете, в добытых нами записях Бюро безопасности Валькирии упоминалось крупное развёртывание сил."
901010400460-50 = "Мы не смогли проверить детали и ущерб, потому что слишком многое было засекречено..."
901010400460-51 = "Почему SRT не уведомили?"
901010400460-52 = "Потому что мы напали на Генеральный Студенческий Совет, помните?"
901010400460-53 = "А. Точно."
901010400460-55 = "Если оно было таким огромным, кто-нибудь должен был увидеть. Р.У. густо населён..."
901010400460-56 = "Интересно, что я ни разу не видела ни новостей, ни постов об этом."
901010400460-57 = "[s5] «Генеральный Студенческий Совет подавил информацию.»\n[s6] «Поэтому большинство студентов считают это городской легендой.»"
901010400460-61 = "Этот перотша... или как там зовут эту птицу, может, и выглядит немного неприятно, но по-настоящему не страшен."
901010400460-62 = "Наверное, поэтому все и думают, что это выдумка."
901010400460-63 = "Подумать только: сущность, созданная городской легендой, сама стала городской легендой... Иронично."
901010400460-64 = "Кстати, любой нелепо выглядящий персонаж может превратиться в гигантского монстра, если станет достаточно популярным?"
901010400460-65 = "А если всё модное будет становиться монстрами? Нам потом придётся сражаться с гигантским Shuppo?"
901010400460-66 = ""
