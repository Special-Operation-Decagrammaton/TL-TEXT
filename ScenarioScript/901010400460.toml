901010400460-70 = "..."
901010400460-71 = "FOX 2, не возражаешь, если завтра днём я ненадолго выйду?"
901010400460-72 = "Ага. Порт закрыт, так что дел всё равно нет. Но зачем?"
901010400460-73 = "Хочу кое-что проверить лично."
