[translation]
10033045-3 = "[ns] «Ты пришла в себя, Мэгу?»"
10033045-4 = "К сожалению, да! И куклы, похоже, тоже теряют энергию."
10033045-5 = "Неужели наш напор высушил жизненную силу горячих источников?"
10033045-6 = "Тактическое отступление! По крайней мере, пока!"
10033045-7 = ""
10033045-9 = ""
10033045-11 = "Посмотрите-ка. Они совсем перестали двигаться."
10033045-12 = "Все студенты Геенны на месте! Теперь всё хорошо, да?"
10033045-13 = "Хотя вы обе наши гости, вам уже столько раз пришлось нам помогать."
10033045-14 = "Я искренне прошу прощения. И я так вам благодарна."
10033045-15 = "Хахаха! Я так и знала, что всё так или иначе закончится именно этим!"
10033045-16 = "Мы не перешли границу?"
10033045-17 = "Нет-нет! Вовсе нет. Наоборот, теперь я чувствую себя ужасно обязанной вам."
10033045-18 = "Друзьям не нужно волноваться о таких вещах."
10033045-19 = "Друзьям... говоришь?"
10033045-20 = "Мы же сделали селфи и обменялись номерами, разве нет? Что ещё нужно, чтобы быть друзьями?"
10033045-21 = "Как я и говорила, личные границы — не сильная сторона Кирары."
10033045-22 = "Если она заставляет тебя чувствовать себя неловко, я извинюсь за неё."
10033045-23 = "Наоборот! Для меня это большая честь... просто я немного удивлена."
10033045-24 = "Т-тогда мы друзья?"
10033045-25 = "Ещё как! Давайте создадим кучу воспоминаний вместе в этой поездке! Рукопожатие?"
10033045-26 = "Х-Хорошо..."
10033045-28 = "Я тоже! Я тоже хочу участвовать!"
10033045-29 = ""
10033045-31 = ""
10033045-32 = "Лучшая дружба закаляется в самом жарком огне!"
10033045-33 = "Разбудите меня... когда пора будет идти к следующей точке. Хр-р..."
10033045-34 = "Я всё пытаюсь подобрать слова, но Цубаки и правда удивительная."
10033045-35 = ""
10033045-38 = ""
10033045-39 = "(Мы... сейчас отстаём от расписания на тридцать четыре минуты.)"
10033045-40 = "(На следующей остановке я наверстаю! Обязательно!)"
