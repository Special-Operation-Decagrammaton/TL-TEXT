[translation]
2300705-1 = "Подарок девушки"
2300705-2 = "Я пришла, Сенсей."
2300705-3 = "Ты меня ждал? Прости. Уборка заняла больше времени, чем я думала..."
2300705-4 = "Ну что, пойдём?"
2300705-5 = ""
2300705-6 = "А? Сенсей, ты не идёшь?"
2300705-7 = "[s] «...Куда мы идём?»"
2300705-8 = "О! Кажется, я забыла сказать."
2300705-9 = "Мы идём в торговый центр."
2300705-10 = "Эм... Самое обычное место, где всегда полно людей."
2300705-11 = "[s] «Понятно...»"
2300705-12 = "...Ахаха."
2300705-13 = "Наверное, я иногда слишком увлекаюсь своими шутками... Ты такой напряжённый."
2300705-14 = "М-м, прости. Наверное, мне не стоило тебя дразнить."
2300705-15 = "Когда я вижу тебя, мне постоянно хочется пошутить..."
2300705-16 = "Но это всего лишь оправдание..."
2300705-17 = "Пожалуйста, позволь мне ещё раз извиниться."
2300705-18 = "Прости, что заставила тебя через всё это пройти, Сенсей."
2300705-19 = "[s] «Ничего страшного. Просто у тебя... своеобразный способ выражаться.»"
2300705-20 = "Очень мило с твоей стороны так на это смотреть..."
2300705-21 = "...Хи-хи."
2300705-22 = "Я хочу купить тебе что-нибудь в знак извинения. Так что пойдём."
2300705-23 = "[s1] «Подарок? Нет, не надо.»\n[s2] «Тебе не обязательно это делать.»"
2300705-24 = "О, понятно... Я думала, что так и будет."
2300705-25 = "О, понятно... Я думала, что так и будет."
2300705-26 = "Я не была уверена, что одной пары носков будет достаточно..."
2300705-27 = "Я... слышала, что восстановить утраченное доверие в десять раз труднее, чем его заслужить..."
2300705-28 = "Может, уже слишком поздно..."
2300705-29 = "Это были всего лишь шутки, но когда думаю о том, насколько неловко тебе, наверное, было... Пожалуй, я это заслужила..."
2300705-30 = "Если ты меня ненавидишь, винить мне некого, кроме себя... Прости, Сенсей."
2300705-31 = "Ну... ещё увидимся."
2300705-32 = "[s] «Подожди, нет... Я возьму носки.»"
2300705-33 = "...Правда?"
2300705-34 = "[s] «Ага. Пойдём в торговый центр.»"
2300705-35 = ""
2300705-36 = "...Ты очень добрый."
2300705-37 = "Хи-хи. Хорошо, пошли!"
2300705-39 = "Мы зашли в магазин одежды посмотреть носки."
2300705-40 = "Сенсей, что думаешь об этих?"
2300705-41 = "Хи-хи-хи! Такой забавный рисунок!"
2300705-42 = "Эм, но если выбирать..."
2300705-43 = "Я бы выбрала такие белые носки. Они хорошо выглядят. Что думаешь, Сенсей?"
2300705-44 = "[s3] «Мне нравятся необычные узоры.»\n[s4] «Мне нравится простой дизайн.»"
2300705-45 = "О. Правда?"
2300705-46 = "О. Правда?"
2300705-47 = "Но мне нравится этот стиль."
2300705-48 = "Носить их буду я, так что куплю те, которые нравятся мне."
2300705-49 = "[s] «Почему?»"
2300705-51 = ""
2300705-52 = ""
2300705-53 = "Я возьму эти."
2300705-54 = "Хорошо. С вас 1000 иен. Это подарок? Упаковать?"
2300705-55 = "Нет, они для меня."
2300705-56 = "Я хочу надеть их прямо сейчас. У вас есть примерочная?"
2300705-57 = "Да, можете воспользоваться той, что вон там."
2300705-58 = "Я скоро вернусь, Сенсей."
2300705-59 = ""
2300705-60 = "[s] «...?»"
2300705-62 = ""
2300705-63 = ""
2300705-64 = "Всё, я вернулась! Они мне очень нравятся! И сидят идеально."
2300705-65 = "А теперь, пожалуйста, упакуйте вот эти."
2300705-66 = "А? Вы... хотите их упаковать?"
2300705-67 = "Но ты..."
2300705-68 = ""
2300705-69 = "Эти?"
2300705-70 = "Да. Мне нужна подарочная упаковка."
2300705-71 = "Я была в этих носках, а теперь собираюсь подарить их Сенсею. Так что если можно завернуть их в красивую упаковочную бумагу..."
2300705-72 = "[s] «Подожди минутку!»"
2300705-73 = "А? Сенсей?"
2300705-74 = "Разве ты не сказал, что возьмёшь носки?"
2300705-75 = "..."
2300705-76 = "..."
2300705-77 = "[s] «Не-е-ет! Нет, нет, нет! Я совсем не это имел в виду!»"
2300705-79 = "[s] «Не смотри на меня так! Это всё недоразумение!»"
2300705-80 = "Ох... Носков для тебя недостаточно?"
2300705-81 = "В-В таком случае... придётся найти что-нибудь больше соответствующее твоим вкусам..."
2300705-82 = "П-Простите... Где здесь ближайший магазин нижнего белья?"
2300705-83 = "..."
2300705-84 = "[s] «Прошу нас извинить!»"
2300705-86 = "(Я схватил Ханако и поспешно вытащил её из магазина.)"
