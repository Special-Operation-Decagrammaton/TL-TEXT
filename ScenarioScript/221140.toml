[translation]
221140-1 = "Episode 14;The Presence of a Vacant Seat"
221140-3 = "(About half a month has passed since Sammy set off...)"
221140-6 = "(Ever since that day, I visited Odyssey Marine High School for the first time in a while.)"
221140-11 = "Sumika - is there something wrong with the detergent we use for cleaning the deck?"
221140-12 = "Isn't it just our usual soap powder?"
221140-13 = "I reduced the ratio this time and added some leftover toothpaste."
221140-14 = "Why?"
221140-15 = "Because just soap powder makes way too many bubbles. #nIf we do that, Sammy will be――"
221140-19 = "...Ah."
221140-20 = "I am sorry, it just slipped out."
221140-21 = "No, it is fine. Even I automatically grab an extra can whenever I see leftover tuna."
221140-22 = "Habit is a scary thing."
221140-23 = "...Yeah."
221140-28 = "[ns1] \"Good work today, too.\"\n[ns2] \"Cleaning the deck?\""
221140-33 = "[USERNAME]-sensei?!"
221140-34 = "You were not scheduled to visit today... Could it be that there was a miscommunication on our end...?!"
221140-35 = "[s] \"It is fine. I just dropped by for a bit.\n"
221140-36 = "O-Oh, thank goodness... #nI thought I might have missed a message from you, Sensei..."
221140-37 = "Then, once again. #n...Ahem."
221140-41 = "The General Student Council's Sensei has boarded――!"
221140-42 = "[s3] \"Wait, wait! You do not have to shout!\"\n[s4] \"This is a private visit today...\""
221140-45 = "If we do that, how will we inform the other students of your visit, Sensei?"
221140-46 = "Besides, whenever guests board or disembark from the ship, it is Odyssey's custom to announce it loudly so that..."
221140-47 = "[s] \"But that is only for 'guests', right?\""
221140-49 = "[ns5] \"Can we just pretend a 'friend' came to hang out?\"\n[ns6] \"If it is just a friend, you would not really need to make a formal announcement about it.\""
221140-52 = "In that case... well?"
221140-53 = "Hmm... Odyssey does a lot of sailing, #nso the idea of a friend coming from off-campus is a bit hard to picture..."
221140-54 = "If you are a friend, it is a little embarrassing to announce it to everyone."
221140-55 = "[s] \"Right?\""
221140-56 = "Still, suddenly calling Sensei a friend is, well... you know?"
221140-57 = "Besides, it is not like we are that close, either~?"
221140-59 = "W-Wait! That is disrespectful to Sensei!"
221140-60 = "[s] \"I am the one who suggested it, so do not worry about it.\""
221140-62 = "[ns] \"More importantly, how is everyone doing?\""
221140-66 = "...Yes. #nOdyssey is peaceful and going about business as usual."
221140-67 = "No storms have struck, and no one has been seriously injured."
221140-68 = "Of course, we are not Island executives, #nso we do not know every single accident that happens around Odyssey, but..."
221140-69 = "Ah, that is right. Are you heading to the Island as well?"
221140-70 = "[s] \"Yeah. I figured I should go greet the captain.\""
221140-71 = "Then I will guide you to the gangway. #nIts position changed since the last time we set sail."
221140-76 = "Sensei."
221140-77 = "Just in case, please step on with your right foot first when boarding the ship."
221140-78 = "[s] \"...You still worry about the taboos?\""
221140-79 = "Yes."
221140-80 = "Even if it is just superstition, I would hate for anything to happen to you, Sensei."
221140-93 = "Oh, [USERNAME]-sensei."
221140-94 = "To arrive so suddenly... Is there some kind of emergency?"
221140-95 = "[s] \"Nope, I just came to see Minato.\""
221140-96 = "To see... me?"
221140-100 = "Ahaha, is this about the other day? It seems I caused you to worry."
221140-101 = "I am fine. #nMe, Vice Captain Ami... and everyone else at Odyssey are doing well."
221140-102 = "...On the surface, at least."
221140-103 = "Now that the port entry procedures are finished, I think we can resume our land-based activities next week."
221140-104 = "Ah... I would love to offer you some tea, but we have run out of tea leaves..."
221140-105 = "Would canned tea be alright?"
221140-106 = "[s] \"Of course. I will take some.\""
221140-111 = "[ns] \"...It is a shame about Sammy.\""
221140-115 = "...No."
221140-116 = "We were able to see Sammy off in the best way possible. Thanks to you, Sensei."
221140-117 = "Everyone seems satisfied with how it turned out, too."
221140-118 = "[s] \"Can we stop worrying about the taboos now?\""
221140-119 = "Who knows. I think that will be difficult to do right away."
221140-120 = "For many students, this incident served as a lesson that #n'breaking a taboo does not necessarily mean trouble will follow'."
221140-121 = "Even so, taboos and customs are deeply rooted in Odyssey."
221140-122 = "It is only natural that people still worry about them."
221140-127 = "Even I... still cannot bring myself to throw this away."
221140-128 = "[s] \"Sammy's cushion is still there, too.\""
221140-129 = "Yes. I thought about cleaning it up, but... I decided to leave it for a while."
221140-130 = "Just having this cushion here makes it feel like Sammy is still with us."
221140-131 = "That being said... as this life goes on, and we eventually grow used to it, #nnew encounters will surely come our way."
221140-132 = "Just as Sensei forged a bond with us."
221140-133 = "...When that time eventually arrives, I can only hope that we will not be bound by the past, and that we will be able to decide our own future with our own hands."
221140-134 = "[s7] \"I am sure you can do it.\"\n[s8] \"Because you are the protagonist of your own life.\""
221140-137 = "...I will do my best to become a protagonist, too."
221140-142 = "Well then, I look forward to working with you from now on, Sensei."
221140-144 = "(Later, while waiting on the station platform to return to Schale――)"
221140-152 = "(Someone called out to me from the opposite platform.)"
221140-153 = "...We meet again, [USERNAME]-sensei."
221140-158 = "[ns9] \"Oh, hello there.\"\n[ns10] \"What brings you to a place like this?\""
221140-161 = "I am waiting for the train."
221140-162 = "Is that not the same reason you are here, Sensei?"
221140-163 = "[s11] \"Still, it is rare to run into you outside the General Student Council building.\"\n[s12] \"Did you have business at Odyssey?\""
221140-166 = "Well..."
221140-167 = "Rather than business with Odyssey itself, perhaps I should say I had business with Sensei, who was visiting Odyssey."
221140-168 = "[s] \"With me...?\""
221140-169 = "Things have settled down, so I thought we could exchange opinions regarding Odyssey. #nI went to Schale, but unfortunately, you were out."
221140-170 = "When I asked around, I was told you had headed to Odyssey."
221140-171 = "Even though the topic was difficult to discuss over the phone or through email, I apologize for taking it upon myself to find out where you went without permission."
221140-172 = "[s13] \"No, no, my apologies as well.\"\n[s14] \"If you have something to discuss, should we go to a cafe?\""
221140-175 = "No, our discussion will not take long."
221140-176 = "No one else is around, and we have time before the next train arrives."
221140-177 = "Would you mind if we talked right here?"
221140-178 = "[s] \"Of course.\""
221140-179 = "Then I will take you up on that. #nFirst of all, thank you for your hard work regarding this Odyssey matter."
221140-180 = "For many students, it must have been the catalyst they needed to move toward a better tomorrow."
221140-181 = "[s] \"That is only because everyone worked hard.\""
221140-183 = "[ns] \"Especially Minato. I am glad she made that decision.\""
221140-184 = "Yes, indeed. #nWhile I have given her harsh evaluations in the past due to her indecisiveness, Minato is a capable student."
221140-187 = "Precisely because she has gained many lessons from this incident, I look forward to seeing her thrive from here on."
221140-188 = "...Though many problems still remain for Odyssey."
221140-189 = "With her current self, I am sure she will manage just fine."
221140-192 = "[ns] \"She is the captain of Odyssey whom everyone recognizes, after all.\""
221140-193 = "...I knew it. #nSensei, there is one error in that assumption."
221140-194 = "It is true that Minato is capable... but there are limits that she simply cannot reach no matter what."
221140-199 = "That she is not the true captain of Odyssey Marine High School is one of those limitations."
221140-203 = "[ns15] \"...Eh?\"\n[ns16] \"What is that supposed to mean?\""
221140-207 = "Oh, the train has arrived."
221140-208 = "That is all I wanted to convey to you."
221140-209 = "Well then, until we meet again, [USERNAME]-sensei."
221140-220 = "[ns] \"What do you mean she is not the true captain?!\""
221140-223 = "Odyssey Chapter;To be Continued in Chapter 2"
