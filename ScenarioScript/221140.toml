#[!][Data: "20/09"]
[translation]
221140-1 = "Episódio 14;O Peso de um Lugar Vazio"
221140-3 = "（Cerca de meio mês se passou desde a partida de Sammy......）"
221140-6 = "（Após aquele dia emocionante, retornei pela primeira vez ao Colégio Marítimo Odisseia.）"
221140-10 = ""
221140-11 = "Sumikaaa! O sabão que a gente tá usando pra lavar o convés não tá meio esquisito?"
221140-12 = "Não era pra ser o sabão em pó de sempre?"
221140-13 = "Eu diminuí a dosagem do sabão em pó e misturei um tubo de pasta de dente velha que tava sobrando no alojamento."
221140-14 = "Ué, e por que fez isso?"
221140-15 = "Porque o sabão em pó puro faz uma montanha de bolhas de sabão, ué.#nSe encher de bolha de novo, o Sammy vai aparecer correndo pra brinc――"
221140-16 = ""
221140-18 = ""
221140-19 = "......Ah."
221140-20 = "Foi mal... esqueci por um segundo."
221140-21 = "Não esquenta a cabeça... Eu mesma quase guardei uma latinha de atum na bolsa hoje de manhã pensando nele."
221140-22 = "A força do costume é uma coisa assustadora, né?"
221140-23 = "......É verdade."
221140-24 = ""
221140-28 = "[ns1] \"Bom trabalho pelo esforço de hoje.\"\n[ns2] \"Estão no meio da faxina do convés?\""
221140-29 = ""
221140-30 = ""
221140-32 = ""
221140-33 = "S-Sensei?!"
221140-34 = "Não constava nenhuma visita oficial agendada para hoje... Por acaso cometemos algum erro administrativo grave nos despachos...?!"
221140-35 = "[s] \"Calma, não houve erro nenhum. Só passei aqui pra dar um oi.\""
221140-36 = "U-Ufa, que alívio gigantesco... Achei que tinha deixado alguma mensagem do Sensei passar batida..."
221140-37 = "Pois bem, cumprindo o protocolo oficial!#n......Cof, cof."
221140-38 = ""
221140-40 = ""
221140-41 = "Atenção a todos: o Sensei da Schale embarca nest――!"
221140-42 = "[s3] \"Calma, calma! Não precisa berrar no microfone!\"\n[s4] \"Hoje é uma visita 100% informal......\""
221140-45 = "Mas se eu não anunciar, como as outras alunas vão saber da sua ilustre chegada?"
221140-46 = "Além do mais, é um costume sagrado da Odisseia anunciar aos quatro ventos toda vez que um visitante ilustre sobe a bordo..."
221140-47 = "[s] \"Mas essa regra vale para 'visitantes oficiais', não vale?\""
221140-49 = "[ns5] \"Será que não dá pra fingir que sou um 'amigo' que veio bater papo?\"\n[ns6] \"Afinal, amigos não precisam de alarme geral no alto-falante pra entrar.\""
221140-52 = "Bem... pensando por esse lado, até faz sentido..."
221140-53 = "Huumm... como a gente passa a vida em alto-mar, a ideia de receber a visita de um 'amigo de fora' soa meio surreal pra gente..."
221140-54 = "E anunciar no rádio que um amigo veio te ver seria até meio embaraçoso mesmo."
221140-55 = "[s] \"Viu só como faz sentido?\""
221140-56 = "Mas chamar o Sensei de amigo assim na lata também é meio... sabe como é, né?"
221140-57 = "Nem temos tanta intimidade assim ainda～!"
221140-59 = "E-Ei, parem com isso agora! Que falta de decoro com o Sensei!"
221140-60 = "[s] \"Fui eu quem deu a ideia, não ligo nem um pouco.\""
221140-62 = "[ns] \"Mas me digam: como estão as coisas por aqui?\""
221140-63 = ""
221140-65 = ""
221140-66 = "......Tudo em paz.#nA rotina da Odisseia segue firme como sempre."
221140-67 = "Nenhuma borrasca violenta atingiu os mastros e nenhuma aluna sofreu acidentes graves."
221140-68 = "Claro que nós somos apenas patrulheiras do Trident e não temos acesso a todos os boletins do Island, mas..."
221140-69 = "Ah, é mesmo! O Sensei vai dar um pulo na sala do conselho também?"
221140-70 = "[s] \"Sim, queria dar uma palavrinha rápida com a Capitã Minato.\""
221140-71 = "Então venha comigo, vou guiá-lo pela passarela de acesso.#nO navio mudou de posição no cais desde a última manobra."
221140-72 = ""
221140-74 = ""
221140-75 = ""
221140-76 = "Sensei."
221140-77 = "Apenas por precaução... poderia subir na prancha pisando primeiro com o pé direito?"
221140-78 = "[s] \"......Ainda tá preocupada com os tabus marítimos?\""
221140-79 = "Sim."
221140-80 = "Mesmo que seja pura crendice popular, eu não me perdoaria se algo de ruim acontecesse com você."
221140-87 = ""
221140-88 = ""
221140-92 = ""
221140-93 = "Ora, veja só quem veio nos agraciar! Sensei da Schale!"
221140-94 = "Uma visita tão repentina... Ocorreu alguma emergência externa?"
221140-95 = "[s] \"Não, nada disso. Só vim ver como você estava, Minato.\""
221140-96 = "Veio... me ver?"
221140-97 = ""
221140-99 = ""
221140-100 = "Ahaha, deve ser por causa dos últimos acontecimentos, né? Acabei lhe causando tanta apreensão."
221140-101 = "Pode ficar com o coração em paz.#nTanto eu quanto a Vice-Capitã Ami... e toda a tripulação da Odisseia estamos ótimas."
221140-102 = "......Ao menos na superfície."
221140-103 = "Como as formalidades de atracação foram concluídas, creio que na próxima semana já poderemos iniciar projetos em terra firme."
221140-104 = "Ah... eu adoraria lhe oferecer uma xícara de chá fresca, mas nossas folhas especiais se esgotaram completamente..."
221140-105 = "Um chá gelado em lata serve?"
221140-106 = "[s] \"Claro que sim, agradeço de coração.\""
221140-107 = ""
221140-111 = "[ns] \"......Sinto muito pelo que aconteceu com o Sammy.\""
221140-112 = ""
221140-114 = ""
221140-115 = "......Não precisa se desculpar."
221140-116 = "Conseguimos nos despedir do Sammy da melhor maneira que o mundo poderia permitir.#nTudo graças ao Sensei."
221140-117 = "Todas as alunas sentiram que honraram a vida dele com dignidade."
221140-118 = "[s] \"Acha que agora as garotas vão parar de temer os tabus?\""
221140-119 = "Difícil dizer. Acho que uma mudança profunda assim não acontece da noite para o dia."
221140-120 = "Para muitas estudantes, o fato de termos desafiado o tabu sem que nenhuma tragédia ocorresse serviu como uma grande lição de vida."
221140-121 = "Ainda assim, tabus e costumes estão cravados nas raízes mais profundas da Odisseia."
221140-122 = "É natural que o instinto de preservação ainda fale alto às vezes."
221140-123 = ""
221140-125 = ""
221140-126 = ""
221140-127 = "Até eu mesma... não tive coragem de me desfazer disto aqui."
221140-128 = "[s] \"A almofada onde o Sammy dormia também continua no mesmo lugar.\""
221140-129 = "Sim. Cheguei a pensar em guardar no armário, mas... decidi deixá-la ali por mais algum tempo."
221140-130 = "Olhar para aquela almofada me faz sentir como se o Sammy ainda estivesse tirando uma soneca ali debaixo."
221140-131 = "Contudo... a vida segue seu curso, e quando nos acostumarmos com essa ausência,#nnovos encontros e novos laços florescerão."
221140-132 = "Assim como o precioso vínculo que o Sensei forjou conosco."
221140-133 = "......Quando esse dia raiar, espero sinceramente que sejamos capazes de decidir nosso próprio destino sem ficarmos presas aos fantasmas do passado."
221140-134 = "[s7] \"Tenho certeza de que vocês vão conseguir.\"\n[s8] \"Afinal de contas, vocês são as protagonistas da própria história.\""
221140-137 = "......Vou me esforçar ao máximo para me tornar uma verdadeira protagonista."
221140-138 = ""
221140-140 = ""
221140-141 = ""
221140-142 = "Conto com a sua orientação constante de agora em diante, Sensei."
221140-144 = "（Mais tarde, enquanto aguardava o trem na plataforma da estação para retornar à Schale――）"
221140-148 = ""
221140-152 = "（Uma voz suave e inconfundível me chamou da plataforma oposta.）"
221140-153 = "......Nos encontramos novamente, Sensei."
221140-154 = ""
221140-157 = ""
221140-158 = "[ns9] \"Olá, boa tarde!\"\n[ns10] \"O que você tá fazendo por aqui a essas horas?\""
221140-161 = "Apenas aguardando o meu trem."
221140-162 = "Não seria esse o mesmo motivo do Sensei estar aqui?"
221140-163 = "[s11] \"É que é raro ver você fora dos prédios do Conselho Estudantil Federal.\"\n[s12] \"Tinha negócios a tratar na Odisseia de novo?\""
221140-166 = "Pois é......"
221140-167 = "Mais do que na Odisseia, seria mais correto dizer que eu tinha assuntos a tratar com o Sensei que acabava de visitar a escola."
221140-168 = "[s] \"Comigo......?\""
221140-169 = "Agora que a situação se acalmou, desejava trocar impressões com você sobre a Odisseia.#nCheguei a passar no gabinete da Schale, mas me informaram que você não estava."
221140-170 = "Disseram-me que havia se dirigido à Odisseia."
221140-171 = "Como eram assuntos delicados demais para serem debatidos por telefone ou e-mail, tomei a liberdade de vir ao seu encontro. Peço escusas pela intromissão."
221140-172 = "[s13] \"Imagina, não precisa se desculpar por nada.\"\n[s14] \"Quer sentar em algum café para conversarmos com calma?\""
221140-175 = "Não há necessidade, nossa conversa será bastante breve."
221140-176 = "A estação está deserta e ainda resta algum tempo até a chegada da próxima composição."
221140-177 = "Poderíamos conversar aqui mesmo, se não se importar?"
221140-178 = "[s] \"Claro, fique à vontade.\""
221140-179 = "Agradeço sua gentileza. Primeiramente, gostaria de parabenizá-lo pela condução exemplar do caso da Odisseia."
221140-180 = "Para muitas daquelas estudantes, essa experiência foi o primeiro passo corajoso rumo a um amanhã muito mais livre."
221140-181 = "[s] \"Isso foi mérito da coragem e do coração de todas elas.\""
221140-183 = "[ns] \"Principalmente da Minato, que teve a bravura de tomar aquela decisão tão difícil.\""
221140-184 = "Sim, com efeito.#nEmbora eu já a tenha repreendido com severidade por sua indecisão no passado, a senhorita Kairo é uma aluna de talentos brilhantes."
221140-185 = ""
221140-187 = "Tendo colhido lições tão profundas desse episódio, estou ansiosa para testemunhar o futuro que ela construirá."
221140-188 = "......Embora a Odisseia ainda carregue inúmeros dilemas complexos pendentes de resolução."
221140-189 = "Mas sob a liderança atual dela, tenho certeza de que encontrarão o caminho certo."
221140-190 = ""
221140-192 = "[ns] \"Afinal, ela é a Capitã que toda a Odisseia reconhece e admira, né?\""
221140-193 = "......Era exatamente o que imaginei que diria.#nSensei. Contudo, há um equívoco fundamental nessa premissa."
221140-194 = "É indiscutível que a senhorita Kairo seja excepcionalmente talentosa... no entanto, ela carrega um limite intransponível que suas mãos jamais conseguirão alcançar."
221140-195 = ""
221140-197 = ""
221140-199 = "O fato de que ela [ruby=・]não[/ruby] [ruby=・]é[/ruby] [ruby=・]a[/ruby] [ruby=・]verdadeira[/ruby] [ruby=・]Capitã[/ruby] do Colégio Marítimo Odisseia é apenas um deles."
221140-200 = ""
221140-202 = ""
221140-203 = "[ns15] \"......Hã?!\"\n[ns16] \"Como assim?! O que quer dizer com isso?!\""
221140-207 = "Ora, vejo que o meu trem acaba de despontar nos trilhos."
221140-208 = "Era unicamente isso o que eu gostaria de lhe transmitir hoje."
221140-209 = "Até breve, Sensei da Schale."
221140-210 = ""
221140-212 = ""
221140-220 = "[ns] \"Como assim ela não é a verdadeira Capitã da Odisseia?!\""
221140-223 = "Arco da Odisseia;Continua no Capítulo 2"
