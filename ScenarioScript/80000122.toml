[translation]
80000122-1 = "Секретный рецепт"
80000122-2 = "[ns] «Сегодня опять столько работы...»"
80000122-3 = "Я потягивал уставшее тело, когда..."
80000122-4 = ""
80000122-8 = "Здравствуйте, Сенсей!"
80000122-9 = "[s] «Сацуки...?!»"
80000122-10 = ""
80000122-13 = "[ns] «Сегодня твоя очередь дежурить представителем учеников?»"
80000122-14 = "Нет-нет!"
80000122-15 = "Я просто пришла вручить вам подарок."
80000122-16 = "Фу-фу, вам интересно, да?"
80000122-17 = "Тогда смотрите внимательно!"
80000122-18 = ""
80000122-21 = "Это шоколад, который я сделала, чтобы укрепить нашу связь и улучшить отношения!"
80000122-22 = "Умеренное количество сахара, как известно, помогает при усталости, так что это идеальный подарок для вас, постоянно заваленного работой."
80000122-23 = "[ns] «Ого! Спасибо!»"
80000122-25 = "[ns] «Погоди... Ты сама сделала?»"
80000122-26 = "Именно! Домашнее происхождение ещё сильнее укрепляет нашу связь, разве нет?"
80000122-27 = "Я решила, что должна сделать хотя бы это для близкого партнёра Общества Пандемониума."
80000122-28 = "Ну-ну. Не стойте столбом! Попробуйте!"
80000122-29 = "[s1] «А, к-конечно... Я просто удивился, потому что не ожидал этого.»\n[s2] «Т-тогда я попробую одну.»"
80000122-30 = ""
80000122-31 = ""
80000122-34 = "[ns] «...Вкусно, что удивляет ещё сильнее.»"
80000122-35 = "Разве это повод удивляться?"
80000122-36 = "Неужели плохой шоколад приготовить не сложнее?"
80000122-37 = "Такое вполне возможно? Очень интересно."
80000122-38 = "А, конечно, он может быть вкусным благодаря моему особому рецепту. Фу-фу."
80000122-39 = "[s] «Погоди. Твоему... особому рецепту?»"
80000122-40 = "Охо, я разожгла ваше любопытство?"
80000122-41 = "[s] «Скорее беспокойство, чем любопытство.»"
80000122-42 = "Аха-ха, вы проницательны. Но в тот момент, когда съели шоколад, уже попались в мою ловушку!"
80000122-43 = "Ну как? Сработало?"
80000122-44 = "[s] «Ничего особенного не чувствую... Что за рецепт?»"
80000122-45 = "Обычно этот секрет я храню очень тщательно, но, пожалуй, удовлетворить ваше любопытство тоже в моих интересах."
80000122-46 = "В этот шоколад..."
80000122-47 = "[ns] *глоть*"
80000122-48 = "Я наложила заклинание, чтобы он стал вкусным!"
80000122-49 = ""
80000122-52 = "[ns] «А?»"
80000122-53 = "Фу-фу... Используя силу Комитета разведки Общества Пандемониума, я раздобыла особое заклинание, которым пользуется одна тайная организация."
80000122-54 = "Сосредоточив всё внимание, я произносила заклинание над шоколадом во время готовки. Уверена, оно сработало."
80000122-55 = "Сенсей, вы тоже случайно знаете заклинание, которое делает еду вкусной?"
80000122-56 = "[s] «Ты имеешь в виду...?»"
80000122-57 = "Аха-ха, как и ожидалось. Знаете!"
80000122-58 = "Нужно мешать вот так и снова и снова повторять: «Стань вкусным, стань вкусным!»"
80000122-59 = "[s3] «Д-да...»\n[s4] «Э-это было заклинание?»"
80000122-62 = "Фу-фу, я старалась изо всех сил, потому что это для вас."
80000122-63 = "А теперь было бы идеально, если бы это событие настолько улучшило наши отношения, что вы добровольно подчинились желаниям Общества Пандемониума."
80000122-64 = "[s5] «Не думаю, что такое когда-нибудь случится...»\n[s6] «Но спасибо, что вложила в это все силы. Было очень вкусно.»"
80000122-67 = "Хмм. Какая жалость. Но реакция была неплохой, так что засчитаю половину успеха."
80000122-68 = "Рада, что пришла лично, чтобы вручить его вам."
80000122-69 = "Тогда не стесняйтесь, ешьте ещё. Ещё, ещё."
80000122-71 = "Сацуки посмотрела, как я доел весь шоколад, и вернулась обратно."
