[translation]
1006002-1 = "Башня Моримори"
1006002-2 = "Мне срочно позвонила Мэгу, и я поспешил на встречу с ней."
1006002-6 = "Но нашёл Мэгу возле магазина на тихой боковой улице. Она стояла с задумчивым выражением лица."
1006002-7 = ""
1006002-9 = ""
1006002-10 = "Ах."
1006002-11 = "Сенсей!"
1006002-12 = "[s1] «Привет, Мэгу.»\n[s2] «Тебя что-то беспокоит?»"
1006002-13 = "Да! Вообще-то у меня сейчас огромная проблема!"
1006002-14 = "Да! Вообще-то у меня сейчас огромная проблема!"
1006002-15 = "Если так пойдёт дальше, я разорюсь! Совсем разорюсь! Мой кошелёк из худого превратится в пустой!"
1006002-16 = "...М? Хочешь знать почему?"
1006002-17 = "Ну, проблема..."
1006002-18 = ""
1006002-20 = ""
1006002-22 = ""
1006002-24 = "Всё началось вот с этого..."
1006002-25 = ""
1006002-27 = ""
1006002-28 = "[ns3] «Мороженое...?»\n[ns4] «Моримори?»"
1006002-29 = "Ага. И ещё вот с этого..."
1006002-30 = "Ага. И ещё вот с этого..."
1006002-31 = ""
1006002-34 = "[ns5] «...Мороженые...?»\n[ns6] «Ещё... Моримори...?»"
1006002-37 = "Ага!"
1006002-38 = "Ну, точнее, раньше это БЫЛО Моримори."
1006002-39 = "У меня всё никак не получается... Я не знала, но, оказывается, съесть Моримори — задача не из лёгких."
1006002-40 = "Совсем не из лёгких! Моримори на удивление нежное."
1006002-41 = "Чуть что — сразу тает! Моментально!"
1006002-42 = "...А? Ты не понимаешь, что я имею в виду под «вспышкой» и «не получилось»?"
1006002-43 = "Хм-м."
1006002-44 = ""
1006002-46 = ""
1006002-47 = ""
1006002-48 = "Хм-м... Как бы это объяснить?"
1006002-49 = "Хочешь, я расскажу всё, что произошло, по порядку?"
1006002-50 = ""
1006002-52 = ""
1006002-53 = "Хорошо! Конечно!"
1006002-56 = "Всё началось с того, что я купила в этом магазине мороженое Моримори."
1006002-57 = "Моримори вкусное, но... это было очень, очень твёрдым!"
1006002-58 = "Я даже зубами его прокусить не могла."
1006002-59 = "Потому что оно промёрзло насквозь! Да, это называется мороженым, но тут слишком много льда и слишком мало крема!"
1006002-60 = "И... что мне было делать? Я очень-очень долго думала!"
1006002-61 = "И тут поняла. Если оно слишком замёрзшее, его надо разморозить. Может, я и не самый острый молоток в ящике с инструментами, но уж это-то понимаю!"
1006002-62 = "Ну..."
1006002-63 = ""
1006002-66 = "[ns7] «...Стой. Подожди минутку.»\n[ns8] «Под «разморозить» ты имеешь в виду...»"
1006002-69 = "Ага! Ты такой умный, Сенсей!"
1006002-70 = "Ты сразу понял решение!"
1006002-71 = ""
1006002-73 = ""
1006002-74 = "Я использовала свой «Расплавленный Мэг-Ма»!"
1006002-75 = "[s9] «Нет-нет-нет-нет-нет!»\n[s10] «Стой-стой-стой-стой-стой!»"
1006002-78 = "...? Сенсей? Что случилось? Почему у тебя вдруг такое лицо?"
1006002-79 = "А? В этот раз хочешь попробовать что-нибудь другое? Почему?"
1006002-80 = "...Хм. Если сделать то же самое ещё раз, результат ведь будет тем же..."
1006002-81 = ""
1006002-83 = ""
1006002-84 = ""
1006002-85 = "Поняла! Если огнемёт не подходит, почему бы не попробовать взрывчатку? О! Или сварочный аппарат?"
1006002-86 = "Я знала, что на тебя можно положиться, Сенсей!"
1006002-87 = "А, это всё ещё недостаточно отличается?"
1006002-88 = "О нет... Теперь я опять в тупике. Зубами Моримори не пробить, инструментами размораживать нельзя..."
1006002-89 = "И что же тогда делать...?"
1006002-90 = ""
1006002-92 = ""
1006002-93 = "Сенсей, ты ведь знаешь? Ты учитель, так научи меня!"
1006002-94 = "Пожалуйста! Я никак не пойму, как есть Моримори!"
1006002-95 = "Хм?"
1006002-96 = "Хочешь знать, когда я купила это Моримори?"
1006002-97 = "Ну, примерно тогда же, когда связалась с тобой..."
1006002-98 = "[s] «Тогда сейчас оно уже должно быть идеальным.»"
1006002-99 = "...? В смысле?"
1006002-100 = "М? Хочешь, чтобы я попробовала снова?"
1006002-101 = "Но у меня же зубы заболят!"
1006002-102 = ""
1006002-104 = ""
1006002-105 = "...Эм, но..."
1006002-106 = "Это ведь хороший совет от Сенсея, да?"
1006002-107 = "Если Сенсей так думает, попробовать точно стоит."
1006002-108 = ""
1006002-110 = ""
1006002-111 = "Ну..."
1006002-112 = "Была не была!"
1006002-113 = ""
1006002-118 = ""
1006002-119 = "...!? А...?"
1006002-120 = ""
1006002-122 = ""
1006002-123 = ""
1006002-124 = ""
1006002-125 = "Получается! Получается! Теперь я могу его есть!"
1006002-126 = "М-м-м! Вкусное, прохладное Моримори!"
1006002-127 = "Как так получилось?"
1006002-128 = "Ты растаяло, потому что Сенсей рядом? Так ведь, Моримори?"
1006002-129 = "[s11] «Хм... Скажем так, его растопило время.»\n[s12] «Иногда терпение нужно больше, чем огневая мощь...»"
1006002-132 = "Ого..."
1006002-133 = ""
1006002-135 = ""
1006002-136 = "...Я не понимаю, как это работает."
1006002-137 = "Но звучит мудро, значит, наверняка правда!"
1006002-138 = "Сенсей, я знала, что ты умный!"
1006002-139 = "Угу! Я так рада, что теперь могу есть Моримори!"
1006002-140 = "И всё благодаря тебе! М-м..."
1006002-141 = ""
1006002-143 = ""
1006002-144 = "...Вот! Хочешь немного, Сенсей?"
1006002-145 = ""
1006002-148 = "[ns13] «Не хочешь съесть всё сама?»\n[ns14] «Мне? Ты уверена?»"
1006002-151 = "Конечно!"
1006002-152 = "Если бы ты не пришёл помочь, это Моримори закончилось бы так же, как все предыдущие..."
1006002-153 = "Без тебя у меня вообще не было бы Моримори, так что, конечно, надо поделиться!"
1006002-154 = ""
1006002-156 = ""
1006002-157 = "Ладно! Не отказывайся, Сенсей. На улице жарко, и ты проделал такой путь. Разве мороженое сейчас не самое то? Держи!"
1006002-158 = ""
1006002-163 = "Хи-хи! Ну как?"
1006002-164 = "Тебе тоже нравится Моримори, правда, Сенсей?"
1006002-165 = ""
1006002-167 = ""
1006002-168 = "...Тогда давай возьмём ещё одно!"
1006002-170 = "Мы вернулись в магазин за новой порцией Моримори."
1006002-171 = "Но Мэгу купила так много, что Моримори закончилось."
1006002-172 = "А-а-а-а-а! Моримори!!"
