[translation]
13140-1 = "Эпизод 14;Ты и мы"
13140-9 = "..."
13140-10 = "Э-Эм..."
13140-11 = ""
13140-15 = ""
13140-17 = ""
13140-18 = ""
13140-20 = ""
13140-21 = "Аргх... Ух!"
13140-22 = ""
13140-24 = ""
13140-27 = "С-Широко!"
13140-28 = "Даже Широко не соперник. Н-Неужели разрыв в силе... всегда был таким...?"
13140-29 = "Похоже, ты стала ещё сильнее, Хошино..."
13140-33 = ""
13140-34 = "...Ты правда сильная, Широко. Такими темпами скоро превзойдёшь меня."
13140-35 = ""
13140-37 = ""
13140-39 = "*тяжело дышит*... *тяжело дышит*..."
13140-40 = "Ну вот. Довольна, Широко?"
13140-41 = "Хошино..."
13140-42 = "Тогда... мне казалось, что весь мир против меня. Но потом Нономи... Нономи спасла меня."
13140-43 = "Без неё я, наверное, сорвалась бы и стала преступницей. Я бы никогда не встретила Широко."
13140-44 = "..."
13140-45 = "Я встретила Нономи и Широко, и так появился Комитет по выплате долга. Так они меня спасли."
13140-46 = "Поэтому я не могу притвориться, будто время Нономи в Комитете было ненастоящим."
13140-47 = "Не позволю ей выставить себя злодейкой или поверить, что она никогда не заслуживала здесь быть."
13140-48 = "..."
13140-49 = "Так что я пойду и безопасно верну Нономи. Но это не будет иметь смысла, если ей некуда будет возвращаться. Поэтому вы должны остаться."
13140-50 = "..."
13140-51 = ""
13140-53 = ""
13140-55 = ""
13140-56 = "Наверняка есть способ... Если дождаться Сенсея..."
13140-57 = "Должен быть какой-то способ..."
13140-58 = "Ты не ошибаешься. Да... Конечно. С помощью Сенсея мы смогли бы победить всё, что встанет на пути."
13140-59 = "...Но даже Сенсей не может отменить прошлое. Так же как нельзя вернуть мёртвых."
13140-60 = "...?"
13140-61 = "Эта Железнодорожная пушка — противоположность мечте Юмэ об Абидосе, продолжающаяся война с фондом прямых инвестиций..."
13140-62 = "...Всё это берёт начало в ошибках студсовета Абидоса."
13140-63 = "Если бы Юмэ узнала о Железнодорожной пушке... она бы сразу прибежала просить помощи, чтобы уничтожить её. Такая уж она была."
13140-64 = "Но меня рядом с ней не было."
13140-65 = "Поэтому я даже притворяться не могу, будто понимаю, о чём Юмэ думала, подписывая этот договор."
13140-66 = "Может... она надеялась, что пушку невозможно будет найти в Пустыне Абидос."
13140-67 = "Вот почему... я закончу это. Сделаю то, чего не смогла два года назад."
13140-68 = "Железнодорожная пушка — символ тёмной стороны студсовета Абидоса. Комитету по выплате долга незачем в это вмешиваться."
13140-69 = "Нономи не должна тащить на себе всю эту вину. Широко, у тебя нет обязанности принимать на себя старые долги."
13140-70 = "Это мой крест."
13140-71 = ""
13140-73 = ""
13140-75 = "Не уходи. Хошино."
13140-76 = "Я... никогда не смогу узнать, каким человеком была Юмэ."
13140-77 = "Все мои воспоминания — о Комитете по выплате долга... Поэтому я никогда не узнаю, что с ней произошло."
13140-78 = "Я не могу притворяться, будто понимаю твои чувства... или какой ты была в студсовете Абидоса. Прости..."
13140-79 = "Но для меня... для меня Комитет по выплате долга — это всё. Это всё, что я знаю. Не отвергай его, Хошино."
13140-80 = ""
13140-83 = ""
13140-84 = "Почему... Почему ты всё время называешь Комитет по выплате долга «вы»?"
13140-85 = "Широко..."
13140-86 = "Должно быть «мы», верно? Не «вы»? Тогда почему...?"
13140-87 = ""
13140-89 = ""
13140-90 = ""
13140-91 = "...Прости, Широко. Мне нужно идти."
13140-93 = "Хватит шутить!!"
13140-94 = ""
13140-98 = ""
13140-99 = ""
13140-103 = ""
13140-104 = "...То есть ты собираешься уйти без нас?"
13140-113 = "Это ничем не отличается от прошлого раза!"
13140-115 = ""
13140-116 = "Аяне...? Откуда здесь столько «Водяных Облаков»...?"
13140-119 = "Ты вообще не способна учиться на своих ошибках? Хочешь снова и снова повторять один и тот же цикл? Это безответственно! Абсолютно безрассудно! А расплачиваться будут все остальные!"
13140-120 = "В прошлый раз мы едва-едва выбрались, и только благодаря Сенсею! А теперь ты снова собираешься сбежать и повторить ту же ошибку?!"
13140-123 = "Мы сейчас увидим знаменитый переворот стола Аяне...?"
13140-124 = "Мм. Ну да, примерно так. Когда решаешь что-то сделать, ты реально добиваешься своего, Аяне."
13140-125 = ""
13140-127 = ""
13140-128 = "Значит, вот как? Двое на одного — Серика и Аяне? Пожалуй, я не смогу называть себя вашей старшей, если не выложусь полностью."
13140-132 = "...Да. Я остановлю это нелепое, идиотское, безрассудное поведение любой ценой."
13140-133 = ""
13140-138 = "Готовься, Хошино!"
13140-140 = "Следующий эпизод;Приказ вице-президента студсовета"
