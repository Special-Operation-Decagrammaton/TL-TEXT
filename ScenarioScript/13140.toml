[translation]
13140-1 = "Episódio 14;Comitê de Contramedidas"
13140-9 = "..."
13140-10 = "Cof..."
13140-21 = "Argh, ugh..."
13140-27 = "S-Shiroko-senpai!"
13140-28 = "Você está bem?!"
13140-29 = "Eu não sabia que ela era tão forte assim..."
13140-34 = "...Como eu pensei, você é mesmo forte, Shiroko-chan.#nUm dia você vai acabar me superando, né?"
13140-39 = "Haa, haa..."
13140-40 = "...Mas esse \"um dia\" não é hoje."
13140-41 = "Hoshino... senpai..."
13140-42 = "Quando eu achava que o mundo inteiro era meu inimigo, quem me salvou naquela época foi a Nonomi-chan."
13140-43 = "Se eu não tivesse conhecido a Nonomi-chan, o meu \"agora\" não existiria."
13140-44 = "..."
13140-45 = "Por isso, agora é a minha vez de salvá-la."
13140-46 = "Eu não posso deixar a Nonomi-chan se tornar a culpada."
13140-47 = "Não vou deixar que o tempo que passamos juntas seja apagado como se nunca tivesse existido."
13140-48 = "..."
13140-49 = "...Vai ficar tudo bem. Confia no velhote aqui, tá?"
13140-50 = "..."
13140-56 = "Eu acho que deve haver algum jeito... com certeza."
13140-57 = "Porque o Sensei vai vir nos ajudar."
13140-58 = "...É verdade, se o Sensei estivesse aqui, talvez a situação fosse diferente."
13140-59 = "Mas o Sensei não pode vir.#nEstá no hospital."
13140-60 = "..."
13140-61 = "Tanto a existência do Canhão Ferroviário, que nega os ideais da Yume-senpai..."
13140-62 = "Quanto a faísca do conflito que o fundo privado está tentando provocar..."
13140-63 = "Se formos atrás da raiz de tudo isso, tudo leva de volta ao Conselho Estudantil de Abydos."
13140-64 = "Eu não sei por que a senpai assinou um contrato desses."
13140-65 = "Naquela hora, eu não estava ao lado dela..."
13140-66 = "...Mas, se a Yume-senpai soubesse da existência do Canhão Ferroviário,#nela com certeza iria impedir esse plano."
13140-67 = "Por isso, eu preciso ir."
13140-68 = "Tudo começou com o contrato que o Conselho Estudantil de Abydos firmou."
13140-69 = "O Comitê de Contramedidas não tem nada a ver com isso."
13140-70 = "Eu vou resolver esse problema sozinha."
13140-75 = "...Não vá, senpai."
13140-76 = "Eu... não sei que tipo de pessoa era a Presidente do Conselho Estudantil."
13140-77 = "Por isso, eu não consigo entender como você se sentia#nna época em que estava no Conselho Estudantil de Abydos."
13140-78 = "Porque eu só tenho memórias de quando entrei para o Comitê de Contramedidas..."
13140-79 = "As lembranças que criei no Comitê de Contramedidas são o meu mundo inteiro."
13140-84 = "Então por que você diz algo tão solitário assim...?"
13140-85 = "Shiroko-chan..."
13140-86 = "A Hoshino-senpai também é uma de nós, não é?"
13140-91 = "...Desculpa, Shiroko-chan.#nMesmo assim, eu tenho que ir."
13140-93 = "Não me faça rir!!!"
13140-104 = "...Ou seja, você está dizendo que vai nos deixar para trás, não é?"
13140-113 = "Desse jeito, não muda nada em relação àquela vez...!!"
13140-116 = "Quando foi que você preparou tantos Amagumos..."
13140-119 = "Vai repetir exatamente a mesma coisa daquela vez?!#nVocê não aprende mesmo, Hoshino-senpai?!"
13140-120 = "Depois de tudo o que o Sensei fez para podermos ficar juntas assim!"
13140-123 = "...Desculpa,"
13140-124 = "Ayane-chan."
13140-128 = "Disso eu não posso abrir mão."
13140-132 = "...Se a Hoshino-senpai é tão cabeça-dura, vamos fazê-la entender à força!"
13140-138 = "Se prepara, senpai!!"
13140-140 = "Próximo;A Ordem da Vice-Presidente do Conselho"
