[translation]
1001405-1 = "Что нравится Изуне"
1001405-2 = "(Я пришёл к Изуне на совместный просмотр исторической драмы.)"
1001405-3 = "А, мой господин! Вы пришли!"
1001405-4 = "Вы без проблем нашли дорогу?"
1001405-5 = "Хотите чаю?"
1001405-6 = "А если проголодались, у меня ещё есть мандзю со вкусом попкорна!"
1001405-7 = "[s1] «Ты и правда всё подготовила.»\n[s2] «Ты выглядишь такой взволнованной, Изуна.»"
1001405-8 = "Хи-хи!"
1001405-9 = "Хи-хи!"
1001405-10 = "Сериал, который мы будем смотреть, — один из любимых у Изуны."
1001405-11 = "Уверена, после просмотра вы по-новому оцените такие истории."
1001405-12 = "Я прямо места себе не нахожу..."
1001405-13 = "С тех пор как отправила вам то сообщение в MomoTalk, мне кажется, что я вот-вот взорвусь от нетерпения!"
1001405-14 = "[s] «Правда...? А что мы смотрим?»"
1001405-15 = "Это роскошное издание шедевра Шиба Дога Ван Вана — «77 одиноких странствующих ниндзя»!"
1001405-16 = "[s3] «Как они могут быть одинокими, если их 77?»\n[s4] «По-моему, друзей у них предостаточно...»"
1001405-17 = "Там восемь серий по часу каждая!"
1001405-18 = "Там восемь серий по часу каждая!"
1001405-19 = ""
1001405-20 = "Надеюсь, на следующие восемь часов у вас ничего не запланировано."
1001405-21 = "[s] «Ты эту часть не упоминала!»"
1001405-22 = "А? Но..."
1001405-23 = "Это обязательно нужно посмотреть, если вы хотите понять истинную ценность исторических драм про ниндзя."
1001405-24 = "Для вас это... слишком много? *поникла*"
1001405-25 = "[s5] (Обычно ушки Изуны стоят торчком, но сейчас...)\n[s6] (Я никогда раньше не видел, чтобы они так поникали!)"
1001405-26 = ""
1001405-27 = ""
1001405-28 = ""
1001405-29 = ""
1001405-30 = "[ns7] «Всё хорошо! Сегодня у меня больше никаких дел.»\n[ns8] «Я всё равно хотел весь день смотреть драмы про ниндзя!»"
1001405-31 = ""
1001405-32 = ""
1001405-33 = "Какое облегчение...!"
1001405-34 = "Тогда давайте смотреть вместе, мой господин!"
1001405-36 = "Вуху!"
1001405-37 = "Я просто вставлю кассету в проигрыватель..."
1001405-38 = ""
1001405-39 = ""
1001405-40 = ""
1001405-41 = "А? О, начинается!"
1001405-43 = "(Следующие восемь часов я провёл за просмотром исторической драмы вместе с Изуной.)"
1001405-45 = "Ух ты! Это было так весело!"
1001405-46 = "Верность господину!"
1001405-47 = "Ниндзя, вынужденные скрестить клинки ради выживания."
1001405-48 = "Отчаянные схватки! Предательство!"
1001405-49 = "И дружба с любовью, расцветающие среди пепла..."
1001405-50 = "Разве это не было потрясающе, мой господин?"
1001405-51 = "Когда Изуна это смотрит, она не может не думать: «Ух ты, как круто!»"
1001405-52 = "[s11] «Ага... Было намного лучше, чем я ожидал.»\n[s12] «Они определённо раздвинули границы жанра.»"
1001405-53 = "Конечно! Ниндзя — лучшие!"
1001405-54 = "Конечно! Ниндзя — лучшие!"
1001405-55 = "[s13] «Кажется, теперь я понимаю.»\n[s14] «Теперь ясно, почему они тебе так нравятся.»"
1001405-56 = ""
1001405-57 = ""
1001405-58 = "Наконец-то вы понимаете."
1001405-59 = "Хи-хи. Мой господин..."
1001405-60 = ""
1001405-61 = "Я так счастлива!"
1001405-62 = "[s] «О-ой. Успокойся, Изуна!»"
1001405-63 = "Хи-хи. ♪"
1001405-64 = ""
1001405-65 = ""
1001405-66 = ""
1001405-67 = ""
1001405-68 = "Мой господин, мой господин!"
1001405-69 = "О! Чуть не забыла. Этот сериал отличный, но Изуна хочет порекомендовать ещё один новый!"
1001405-70 = "[s] «Уже довольно поздно...»"
1001405-71 = "Но я хотела посмотреть и этот вместе с вами..."
1001405-72 = "Не можете остаться ещё совсем ненадолго...? *поникла*"
1001405-73 = ""
1001405-74 = ""
1001405-75 = "[ns] «Ну как я могу тебе отказать?!»"
1001405-76 = ""
1001405-77 = "Да! Начинается второй просмотр! ♪"
1001405-79 = "(Мы с Изуной не спали всю ночь.)"
