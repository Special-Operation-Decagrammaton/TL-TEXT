[translation]
10050080-1 = "Эпизод 8;Война за старую библиотеку"
10050080-2 = "[ns] «Что? Как Комитет правосудия узнал...?!»"
10050080-3 = "Понятия не имею! Наверное, где-то нашли зацепку."
10050080-4 = "Я делала, как вы сказали, и держалась рядом с Комитетом правосудия..."
10050080-5 = ""
10050080-6 = ""
10050080-7 = ""
10050080-8 = ""
10050080-9 = ""
10050080-11 = ""
10050080-12 = ""
10050080-13 = "...поэтому связалась с вами сразу, как только всё началось!"
10050080-14 = "[s] «Спасибо, Кохару! Ты, как всегда, лучшая!»"
10050080-15 = "П-Правда? Хи-хи-хи..."
10050080-16 = "Погодите, сейчас не время радоваться! Что нам делать, Сенсей?"
10050080-17 = "А? Позвонить ещё и Шимико...? Т-Точно! Нам понадобится и Библиотечный комитет! Хорошо, Сенсей!"
10050080-18 = ""
10050080-20 = ""
10050080-22 = "Быстрее... Быстрее...!"
10050080-23 = ""
10050080-25 = ""
10050080-26 = "Привет, Кохару. Что случилось?"
10050080-27 = "Плохие новости, Шимико!"
10050080-28 = "Что...?"
10050080-30 = "Это действительно плохие новости!!"
10050080-31 = "Я же сказала!"
10050080-32 = "Нет, ситуация ЗНАЧИТЕЛЬНО хуже, чем ты думаешь!"
10050080-33 = "...А?"
10050080-34 = "Нет времени объяснять. Мне нужно немедленно попасть в старую библиотеку."
10050080-35 = "А ты оставайся в укрытии, Кохару. Что бы ни случилось."
10050080-36 = "Потому что, понимаешь, Комитет правосудия и Уй — полные противоположности!"
10050080-37 = "А? Но почему я должна...?"
10050080-38 = "В старой библиотеке ты просто попадёшь под перекрёстный огонь между ними."
10050080-40 = "В худшем случае тебя могут принять за одну из наших торговок контрабандой!"
10050080-41 = "Понимаешь? Пока всё не закончится, держись как можно дальше от этого дела!"
10050080-42 = ""
10050080-44 = ""
10050080-45 = "Попасть под перекрёстный огонь... Контрабанда... Да... В этом есть смысл..."
10050080-46 = "..."
10050080-47 = "...Нет. Всё это неважно. Я должна идти."
10050080-48 = "Потому что так будет правильно."
10050080-49 = ""
10050080-51 = ""
10050080-57 = "Сенсей...? Что происходит?"
10050080-58 = "[s] «Уй! Слава богу. Послушай меня. Сейчас—»"
10050080-59 = ""
10050080-62 = "...Ещё люди? Серьёзно?"
10050080-63 = "Ух. Кто бы это ни был, пойду выскажу ему всё, что думаю."
10050080-64 = "[s] «Н-Нет! Я пытаюсь сказать, что...»"
10050080-65 = "Президент Козэки Уй, вы здесь? Это Маширо из Комитета правосудия."
10050080-66 = "Комитет... правосудия? Почему...?"
10050080-67 = "Здравствуйте, президент Уй. Давно не виделись."
10050080-68 = "...Зачем ты здесь?"
10050080-69 = "Я пришла по полученному докладу."
10050080-70 = "Мне сообщили, что сюда поступили подозрительные несанкционированные книги."
10050080-71 = "Несанкционированные книги...?"
10050080-72 = "...И что с того?"
10050080-73 = ""
10050080-75 = ""
10050080-77 = "Да! По этой причине... Мы просим вас содействовать всесторонней проверке старой библиотеки!"
10050080-78 = ""
10050080-80 = ""
10050080-81 = ""
10050080-82 = "...Что?"
10050080-83 = "Все... Всесторонней... «Проверке»? Что...?"
10050080-84 = "Нет, стойте. Что... вы пытаетесь сделать?"
10050080-85 = "Всестороннюю... проверку?"
10050080-86 = "Вы хотите провести её прямо сейчас... здесь?"
10050080-87 = "...Всестороннюю проверку старой библиотеки?"
10050080-88 = "Да, совершенно верно!"
10050080-89 = "То есть вы хотите..."
10050080-90 = "...похитить их? Забрать моих детей? Всех до единого?"
10050080-91 = "...Хм?"
10050080-92 = "Да, ну... если сочтём это необходимым, то да."
10050080-93 = "Кто знает, что мы найдём? В чём проблема?"
10050080-94 = ""
10050080-96 = ""
10050080-97 = "Именно поэтому я прошу вас о сотрудничестве!"
10050080-98 = "Если вы действуете по справедливости, вам нечего скрывать и—"
10050080-99 = "ЗАТКНИСЬ!!"
10050080-100 = ""
10050080-102 = ""
10050080-103 = "Вы хотите забрать моих детей?! Да кто вы вообще такие? Вы понимаете, по чьей земле сейчас топчутся ваши мерзкие ноги?"
10050080-104 = "Запомните каждое моё слово как следует."
10050080-105 = "За каждого моего ребёнка, которого вы попытаетесь похитить... Если вы хотя бы попробуете тронуть мои книги пальцем... Я переломаю всё. Ваши пальцы, руки, запястья—"
10050080-106 = "С-Стойте! Вы только что угрожали Комитету правосудия и пытались воспрепятствовать правосудию."
10050080-107 = "Я не могу терпеть подобное—"
10050080-108 = "Это моя фраза! И я всё равно знаю, что за всем стоят эти безграмотные из Чаепития!"
10050080-109 = "Чаепитие... Эти интриганы-цензоры, помешанные на власти!"
10050080-110 = "Я вижу вас насквозь! Это план Чаепития — наконец поглотить старую библиотеку. Эта проверка всего лишь жалкое прикрытие ваших злых, ненавидящих книги замыслов."
10050080-111 = "...Эм, что? Н-Нет! Я не это...!"
10050080-112 = "Прошу прощения, мы здесь по официальному делу Комитета правосудия!"
10050080-113 = "Именно! Если вы хотите играть так, мы не побоимся применить силу...!!"
10050080-114 = ""
10050080-119 = ""
10050080-120 = ""
10050080-121 = ""
10050080-122 = ""
10050080-123 = ""
10050080-125 = "Каждая из вас, слушайте меня очень внимательно. И знайте: я отвечаю за каждое сказанное слово."
10050080-126 = "Ни одна страница моих детей не покинет это место без моего разрешения. Я этого не позволю."
10050080-127 = "Иными словами, если именно это вы хотите сделать..."
10050080-128 = "...только через мой разбитый нимб."
10050080-129 = ""
10050080-131 = ""
10050080-132 = ""
10050080-133 = "...Понятно."
10050080-134 = "Я прекрасно поняла лишь то, что президент Уй не желает сотрудничать."
10050080-135 = "Также я понимаю, что президент Козэки Уй открыто проявляет враждебность и представляет угрозу приказу Чаепития и Комитету правосудия."
10050080-136 = "Комитет правосудия приступает к неизбежному исполнению правосудия."
10050080-137 = "Ага? Ну давайте."
10050080-138 = "...Давненько такого не было. Ладно. Только попробуйте забрать у меня моих детей."
10050080-139 = ""
10050080-141 = ""
10050080-142 = ""
10050080-143 = ""
10050080-144 = ""
10050080-145 = ""
10050080-146 = ""
10050080-147 = ""
10050080-148 = ""
10050080-149 = "...Вызов принят!"
10050080-150 = ""
10050080-154 = "[ns] «СТОООООЙТЕ!»"
10050080-155 = "Никому не двигаться!!"
10050080-156 = "Шимико?"
10050080-157 = "Сенсей?"
10050080-158 = "Все, пожалуйста! Это просто серьёзное недоразумение между друзьями. Всё можно решить без насилия."
10050080-159 = "В-вот как...?"
10050080-161 = ""
10050080-164 = "Сенсей? Шимико? Вы все в порядке?!"
10050080-165 = "А? Кохару? Ты что...?"
10050080-166 = "Разве я не велела тебе держаться подальше от опасности?"
10050080-167 = "Н-Но... я не могу! Неправильно — значит неправильно, несмотря ни на что!"
10050080-168 = "И важнее: почему вы, надоедливые вредители, всё прётесь сюда? Это не ваша общая комната!"
10050080-169 = "И ты, Шимико! Ты меня предала?!"
10050080-170 = "Я и подозревала, что есть информатор, но подумать только, это была ты... В наше время доверие и правда ограниченный ресурс—"
10050080-171 = ""
10050080-173 = ""
10050080-179 = "ГЯ-А-А-А!! С-СИМИКООО!"
10050080-180 = "Уй! Ты вообще не способна хоть секунду себя сдерживать? И что это за чушь? Информатор? Ты хоть представляешь, через что мне пришлось пройти?!"
10050080-181 = "И вообще, ПЕРЕСТАНЬ СТРЕЛЯТЬ В ЛЮДЕЙ! Сколько ещё происшествий мне придётся разгребать за тебя?"
10050080-182 = "Н-Нет...! Я просто...!!"
10050080-183 = "Ни слова!!"
10050080-184 = ""
10050080-192 = "ГАААААААХ!! ПОМОГИТЕ!"
10050080-194 = "О. Эм..."
10050080-195 = "Хотя ситуация перевернулась с ног на голову, нам всё равно нужно выполнить нашу задачу."
10050080-196 = "Мы получили сведения, что несанкционированные книги хранятся здесь. И теперь я почти уверена, что так и есть."
10050080-197 = "Мы не можем допустить распространения несанкционированных материалов в Тринити."
10050080-198 = "Да, с этим я согласна. Я не пытаюсь вам мешать."
10050080-199 = "Но мне всё же есть что—"
10050080-200 = ""
10050080-204 = ""
10050080-205 = "Простите, все."
10050080-206 = "Разве я не говорила вам спрятаться?! ...Мэм?"
10050080-207 = "Да, говорили... но это неправильно. Во всём виноваты мы."
10050080-208 = "Мы очень благодарны за всю полученную помощь, но я не могу закрывать глаза на то, что из-за нас товарищи конфликтуют друг с другом."
10050080-209 = "Ну же, выходите, Президент. Вы должны высказать свою позицию."
10050080-210 = "Ах, чёрт. А я так надеялась тихонько улизнуть, будто меня здесь вообще не было."
10050080-211 = "...Президент?"
10050080-212 = "Простите..."
10050080-213 = "Здравствуйте, Тринити. Мы из Издательского отдела Красной Зимы."
10050080-214 = "Издательского..."
10050080-215 = "...отдела?"
10050080-216 = "Именно. Для начала мне следует объяснить, почему всё это произошло и почему мы на такое решились."
10050080-217 = "По правде говоря, мы—"
10050080-219 = "Эм... Это... В общем, если вкратце..."
10050080-220 = "Пытаясь помочь голодающим студенткам Фронта освобождения знаний..."
10050080-221 = "...вы приехали аж в Тринити, надеясь помочь им, открыв новый канал распространения?"
10050080-222 = "Ну... Скорее не помочь им, а... дело больше в деньгах..."
10050080-223 = "Президент?"
10050080-224 = "А, простите."
10050080-225 = "Но всё же, в каком-то смысле..."
10050080-226 = "Ну, в Красной Зиме ничего не видит свет. Я правда подумала, что было бы неплохо дать людям из другой школы познакомиться с нашей культурой."
10050080-227 = "К тому же сюжетные линии этой книги в Красной Зиме уже использовались и переиспользовались столько раз, что спроса на неё не было."
10050080-228 = "И, к счастью, довольно многим студенткам Тринити она понравилась."
10050080-229 = "Это... определённо правда..."
10050080-230 = "Именно поэтому нам, Комитету правосудия, пришлось начать отслеживать книги в рамках совместной операции с Библиотечным комитетом..."
10050080-231 = "Подумать только, студентки Тринити помогали Издательскому отделу Красной Зимы..."
10050080-232 = "Теперь я понимаю, почему мы постоянно упирались в стену."
10050080-233 = "Так вот... что происходило, Шимико...?"
10050080-234 = "Да, Президент. Пожалуйста, иногда поднимайте взгляд и смотрите, что происходит за пределами этой библиотеки."
10050080-235 = "Это вообще-то должна была быть ваша обязанность, а не моя."
10050080-236 = "Н-Н-Нет... Это слишком жестокое наказание для меня..."
10050080-237 = "В любом случае, я считаю, что культурой нужно делиться."
10050080-238 = "Культура, которая застаивается, в конце концов начинает тянуть людей назад."
10050080-239 = "И денег она тоже не приносит."
10050080-240 = "Конечно, изначально мы приехали в Тринити не с такими высокими идеями."
10050080-241 = "Но, увидев, насколько студенткам Тринити понравились наши книги, я, пожалуй, невольно задумалась."
10050080-242 = "А? Правда, Президент?"
10050080-243 = "Хм... Скажем так. Некоторые вещи лучше не произносить вслух."
10050080-244 = "Ух. Используешь мои же слова против меня..."
10050080-245 = "Знаешь, этот титул президента мне не просто для красоты. Хе-хе-хе."
10050080-247 = "Однако вне зависимости от обстоятельств эти книги всё ещё считаются контрабандой."
10050080-248 = ""
10050080-251 = "[ns] «А Библиотечный комитет не может их разрешить?»"
10050080-252 = "Библиотечный комитет...?"
10050080-253 = "Да. Библиотечный комитет управляет обращением книг, распространяемых по Тринити."
10050080-254 = "Если мы официально сертифицируем книги Издательского отдела, они больше не будут считаться контрабандой."
10050080-255 = "Разумеется, нам придётся внести некоторые изменения, чтобы соответствовать правилам Тринити."
10050080-256 = "Я и сама понимала, что даже наша смягчённая версия немного слишком откровенная."
10050080-257 = "Это можно было вполне предвидеть..."
10050080-258 = ""
10050080-260 = ""
10050080-261 = ""
10050080-262 = "[ns] «Разве следование школьным процедурам — не один из видов справедливости?»"
10050080-263 = "Это новый взгляд! Спасибо, что расширили мой кругозор!"
10050080-264 = "Даже здесь, где справедливость едва не была разрушена, мы смогли восстановить её с помощью процедур!"
10050080-265 = "Я действительно впечатлена, Сенсей! Спасибо!"
10050080-266 = "[s] «М-м. Ага. Рад, что для тебя это прозвучало убедительно.»"
10050080-267 = "Кстати, Президент, а что вы думаете о книге?"
10050080-268 = "Ч-Что? П-Почему я...?"
10050080-269 = "Ну, полагаю, вы уже её прочитали."
10050080-270 = "Как вы узнали...?"
10050080-271 = "Фуфу. Сколько мы уже вместе работаем?"
10050080-272 = "От тебя ничего не скроешь..."
10050080-273 = "*вздыхает* Ну, книга хорошая. По моему мнению."
10050080-274 = "В работах Издательского отдела есть определённая... искренность, вплетённая в саму историю. Легко почувствовать страсть, вложенную в их труд."
10050080-275 = "...В наши дни большинство книг — навязчивая безвкусица, которая совершенно не уважает достоинство письменного слова... Я... никогда не прощу автора, продавшего душу, и не думаю, что эта книга такая."
10050080-276 = "Итак, окончательный вердикт?"
10050080-277 = "Она... нормальная. И содержание лично для меня проблемой не является."
10050080-278 = "Однако я всего лишь один человек. Делай так, как считаешь правильным, Шимико."
10050080-279 = "Поняла."
10050080-280 = "Спасибо, Библиотечный комитет. Тогда именно это я и укажу в отчёте по делу."
10050080-281 = "[s] «Я пойду с тобой.»"
10050080-282 = "Я тоже присоединюсь, раз уж президент, уверена, не захочет."
10050080-283 = "Я не пойду."
10050080-284 = "Но вам двоим вовсе не обязательно..."
10050080-285 = "..."
10050080-286 = "Неважно. Спасибо за сотрудничество до самого конца."
10050080-287 = "В конце концов, эта миссия с самого начала задумывалась как сотрудничество Комитета правосудия, Библиотечного комитета и Сенсея."
10050080-288 = "Я рада, что всё разрешилось, все."
10050080-289 = "Тогда давайте все прочитаем книгу, теперь официально разрешённую президентом Библиотечного комитета!"
10050080-290 = "Да! Мы тоже хотим посмотреть!"
10050080-291 = "*глоть*"
10050080-292 = "[s] «(Погодите, это что...?! )»"
10050080-293 = ""
10050080-295 = ""
10050080-296 = "...!"
10050080-297 = "Это довольно...?"
10050080-298 = ""
10050080-300 = ""
10050080-301 = ""
10050080-302 = ""
10050080-303 = ""
10050080-304 = "..."
10050080-305 = "А-А-А-А?!"
10050080-307 = "СМЕРТНАЯ КАЗНЬ!!"
