[translation]
1003002-1 = "Трудоголик"
1003002-2 = "Курорт с горячими источниками возле Геенны"
1003002-3 = "Следуя совету Чинацу, я отправился на курорт с горячими источниками возле Геенны, где, как говорят, отличные ванны для снятия усталости."
1003002-4 = ""
1003002-6 = ""
1003002-7 = "Во время последнего задания мы израсходовали аптечку гораздо быстрее, чем ожидалось, из-за большого количества травм."
1003002-8 = "Для начала нужно заказать ещё десять коробок марли и бинтов."
1003002-9 = "[s] «Чинацу...?»"
1003002-10 = "С-Сенсей?"
1003002-11 = "Что привело вас на этот уединённый курорт с горячими источниками так далеко от академии?"
1003002-12 = "О... Вы последовали моему совету и приехали сюда отдохнуть?"
1003002-13 = "Это замечательно. Как ответственная за медицинскую помощь, я рада, что вы решили сделать перерыв."
1003002-14 = "Если собираетесь сразу пойти в ванну, рекомендую открытый источник в дополнительном корпусе."
1003002-15 = "Я слышала, что открытая ванна этого курорта содержит различные минералы, полезные для снятия усталости."
1003002-16 = "Кроме того, если приложить к глазам полотенце, смоченное водой горячего источника, это заметно уменьшит напряжение глаз."
1003002-17 = "[s] «Ты тоже приехала сюда отдохнуть, Чинацу?»"
1003002-18 = ""
1003002-20 = ""
1003002-21 = "О, эм, дело в том, что я..."
1003002-22 = "Вообще-то я не хотела сюда приезжать, но получила путёвку на этот курорт..."
1003002-23 = "В последнее время я много работала сверхурочно, поэтому президент Хина заставила меня принять эту путёвку и отдохнуть."
1003002-24 = "Я пыталась отдать её другой участнице, но все отказались... Так что мне ничего не оставалось, кроме как приехать сюда."
1003002-25 = "Работы всё ещё очень много. Не уверена, что мне следует вот так отдыхать."
1003002-26 = "[s] «Что это за бумаги?»"
1003002-28 = "Как я только что сказала, мне не очень спокойно отдыхать без дела, когда ещё столько работы..."
1003002-29 = "Поэтому я взяла с собой самые срочные документы Префекторской команды."
1003002-30 = "Список заказа расходников для служебных задач, список членов Префекторской команды, которым нужен отпуск из-за травм, разные прочие документы..."
1003002-31 = "Если я не займусь этими мелкими делами, кому-то ещё из команды придётся делать их вместо меня."
1003002-32 = "И, возможно, это прозвучит странно, но этот курорт отлично подходит не только для отдыха, но и для работы."
1003002-33 = "Температура приятная — ни слишком холодно, ни слишком жарко. И мне не приходится видеть шумных нарушителей порядка, которые так часто устраивают сцены в академии."
1003002-34 = "Возможно, здесь я даже лучше сосредоточусь на работе, чем в клубной комнате."
1003002-35 = "[s1] «Разве сейчас тебе не стоит сосредоточиться на отдыхе?»\n[s2] «Мне кажется, бумаги лучше сделать потом.»"
1003002-36 = "Но даже сейчас остальные участницы усердно выполняют свои задачи. Одной наслаждаться неторопливым отдыхом как-то..."
1003002-37 = "Но даже сейчас остальные участницы усердно выполняют свои задачи. Одной наслаждаться неторопливым отдыхом как-то..."
1003002-38 = "К тому же я совсем не ранена."
1003002-39 = "[s3] «Я не смогу отдыхать, если ты не отдыхаешь, Чинацу.»\n[s4] «Разве ты не говорила, что отдых — тоже часть работы?»"
1003002-40 = ""
1003002-41 = ""
1003002-43 = ""
1003002-44 = "Вы правы. Я сама подчёркивала важность отдыха для вас, но, похоже, сама на него не способна..."
1003002-45 = "Хорошо, тогда я отложу работу и сосредоточусь на отдыхе во время этого отпуска."
1003002-46 = "Но меня беспокоит отдыхать, когда работа не закончена, поэтому сначала я просто завершу эти задачи."
1003002-47 = "[s] «Я помогу.»"
1003002-48 = "Нет, вам правда не нужно..."
1003002-49 = "Вам будет некомфортно, если не поможете?"
1003002-50 = "...Хаха, понятно."
1003002-51 = "Вы давно не отдыхали, Сенсей. Было бы нехорошо, если бы вам здесь было некомфортно."
1003002-52 = ""
1003002-54 = ""
1003002-55 = ""
1003002-57 = "Что ж, тогда заранее благодарю за помощь, Сенсей."
1003002-59 = "После этого мы с Чинацу усердно разбирали накопившиеся документы Префекторской команды Геенны."
1003002-60 = "К счастью, мы успели закончить всю работу до темноты, но к тому моменту принимать ванну было уже поздно."
