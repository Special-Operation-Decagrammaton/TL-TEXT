[translation]
2600608-1 = "В поисках облаков"
2600608-2 = "Станция метро Кивотоса"
2600608-3 = ""
2600608-4 = ""
2600608-5 = "Нодока шла с большим телескопом за спиной."
2600608-6 = "[s] «Привет, Нодока.»"
2600608-7 = ""
2600608-8 = "О! Здравствуй, Сенсей. Ты идёшь на работу?"
2600608-9 = "Сегодня такая хорошая погода. Если в такой день подняться куда-нибудь повыше, можно увидеть всё вокруг!"
2600608-10 = "Красная Зима ведь не по этой ветке?"
2600608-11 = "Ахаха... Да, ты прав. Вообще-то я ехала не в академию. Я собиралась выйти на станции за горами, чтобы посмотреть на облака."
2600608-12 = "Когда я утром проснулась и посмотрела на восток, то увидела красивое облако, повисшее на склоне горы."
2600608-13 = "Я подумала, что с вершины горы вид будет ещё красивее, поэтому направилась туда с телескопом."
2600608-14 = "[s] «Этот телескоп не тяжёлый?»"
2600608-15 = "Этот?"
2600608-16 = "Конечно, тяжёлый, но без него я не смогу как следует полюбоваться красивыми пейзажами."
2600608-17 = "Пока с его помощью я могу видеть великолепные виды, вес меня не беспокоит."
2600608-18 = "Сенсей, хочешь пойти со мной посмотреть на облака?"
2600608-19 = "Ой, ты слишком занят работой в Шале?"
2600608-20 = "Ну, тут уж ничего не поделаешь!"
2600608-21 = "Тогда я вместо тебя насмотрюсь на все прекрасные виды, какие только смогу найти!"
2600608-22 = "[s] «Хочешь, я понесу телескоп?»"
2600608-23 = "О, спасибо, Сенсей."
2600608-24 = ""
2600608-25 = ""
2600608-26 = ""
2600608-27 = "Ну что же, на платформу!"
2600608-29 = "Я проводил Нодоку до платформы и вернулся в Шале."
