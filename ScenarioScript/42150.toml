[translation]
42150-1 = "Episódio 15;A Justiça da SRT"
42150-11 = "Aah~ Que alívio, até renasci~#nQuanto tempo faz que eu não tomava um banho quente..."
42150-12 = "O cansaço... está até indo embora do meu corpo..."
42150-13 = "Um banho depois de se exercitar é bom demais..."
42150-14 = "Ufa..."
42150-15 = "...Hoje realmente foi um dia cheio de acontecimentos."
42150-16 = "É verdade. Parece que o dia passou muito mais rápido do que quando estávamos no parque."
42150-17 = "Realmente, levar uma rotina regrada faz toda a diferença no ritmo do dia."
42150-18 = "Mas, Saki, você já seguia o seu próprio cronograma até quando a gente estava no parque.#nNão faz tanta diferença assim, né."
42150-19 = "...Bom, mas hoje eu também fiquei super satisfeita.#nPude disparar à vontade munições especiais que normalmente a gente mal pode usar."
42150-20 = "Eu também... faz tempo que não fico numa instalação com um sistema de segurança tão completo... acho que me sinto um pouco mais tranquila."
42150-21 = "No parque, eu sempre levava susto quando aparecia alguém perdido ou algum animal selvagem..."
42150-22 = "Mas..."
42150-23 = "O que houve? Tem alguma coisa te incomodando?"
42150-31 = "...Será que está mesmo tudo bem... vivermos com tanto conforto assim?"
42150-32 = "Talvez seja um exagero chamar isso de vida confortável só por termos refeições nutritivas e banho quente, mas..."
42150-33 = "...Eu percebi novamente que a vida no parque impôs a todas um fardo maior do que eu imaginava. Peço desculpas."
42150-34 = "N-Não foi isso que eu quis dizer... é que..."
42150-35 = "Aqui, eu sinto que nem preciso tomar decisões por conta própria..."
42150-36 = "O que devemos comer, o que devemos fazer...#nSe não estamos tomando a decisão errada..."
42150-37 = "Porque as senpais decidem tudo no nosso lugar..."
42150-38 = "Mas, enquanto as outras pessoas estão apreensivas com o novo regime... será que está certo continuarmos assim...?"
42150-39 = "Parece que estou vestindo uma roupa que não serve em mim, sabe? Não consigo ficar tranquila..."
42150-40 = "...Não devemos nos comparar com os outros."
42150-41 = "Hoje realmente aconteceram muitas coisas, então entendo que esteja inquieta."
42150-42 = "Você só está um pouco agitada agora.#n...Se descansar bem, logo vai se acalmar."
42150-43 = "Será mesmo...?"
42150-46 = "...O banho no tambor de metal também não era tão ruim assim."
42150-47 = "Claro... ferver a água dava trabalho,#ne era apertado demais para se lavar direito, mas..."
42150-48 = "Ainda assim... até aquilo me fazia sentir que eu estava realmente atuando como membro da SRT."
42150-50 = "Agora é mais confortável do que antes, mas...#nFalando a verdade, parece que virei uma mercenária trabalhando por dinheiro."
42150-51 = "Eu também acho. Antes, eu já me divertia só de lançar um míssil pequeno, mas..."
42150-52 = "Quando realmente dizem que posso atirar à vontade, eu meio que fico sem graça.#nNem é tão divertido assim... quer dizer, eu fiquei satisfeita, mas..."
42150-53 = "Mesmo assim, dá uma sensação meio sufocante..."
42150-57 = "...E você, Miyako? Está bem com isso?"
42150-58 = "S-Sim? Eu...?"
42150-59 = "Eu..."
42150-63 = "Estou bem. Estou satisfeita com esta vida."
42150-64 = "É um ambiente em que todas podem se concentrar no treinamento, e ainda contribuímos para o renascimento da Academia Especial SRT...#nComo líder do Esquadrão RABBIT, acredito que não poderíamos ter tratamento melhor."
42150-65 = "...Não, agora sou apenas comandante de destacamento."
42150-66 = "...Não estamos falando de nós."
42150-67 = "Você, Miyako, está mesmo bem com as coisas do jeito que estão?"
42150-68 = "A justiça imutável... está mesmo certa assim?"
42150-73 = "...Com licença, vou me retirar primeiro.#nDescansem bem, pessoal."
42150-81 = "..."
42150-84 = "Ufa..."
42150-85 = "(Faz tempo que não entro de guarda logo depois de tomar banho.)"
42150-89 = "(A sensação da brisa noturna no rosto... como pude secar bem com o secador, meu cabelo nem está pesado.)"
42150-90 = "(Será que é porque também troquei por equipamentos novos que tudo parece tão leve...?)"
42150-91 = "...Com certeza, todas vão acabar se acostumando a esta vida."
42150-95 = "...? Alarme de invasão? Perto do prédio dos chuveiros...?"
42150-96 = "Mas nem existe estrada ou saída para o exterior por ali..."
42150-97 = "...Será que algum animal selvagem acabou disparando o alarme?"
42150-101 = "[ns1] \"Oi, Miyako.\"\n[ns2] \"Boa noite. Como você tem passado?\""
42150-104 = "...Sensei?"
42150-105 = "Por que você está aqui...?#nE como descobriu onde nós estávamos...?"
42150-106 = "[ns] \"Como eu descobri é segredo, mas...\""
42150-108 = "[ns] \"...Senti o cheiro do Esquadrão RABBIT vindo daqui.\""
42150-113 = "...Você está preso."
42150-115 = "Próximo;As Circunstâncias do Sensei"
