[translation]
42150-1 = "Эпизод 15; Правосудие SRT"
42150-11 = "Эх... Я уже целую вечность нормально не принимала горячий душ."
42150-12 = "Всё напряжение будто просто взяло и испарилось..."
42150-13 = "Ничто не сравнится с душем после долгого рабочего дня..."
42150-14 = "Ахх."
42150-15 = "Ну и денёк выдался."
42150-16 = "Ещё бы! Раньше в парке, когда делать было нечего, дни тянулись бесконечно."
42150-17 = "Вот поэтому я и говорю, что людям полезны строгие правила и чёткий распорядок."
42150-18 = "Говоришь так, будто сама в парке не вставала ровно в пять утра каждый день..."
42150-19 = "...Ладно-ладно. Мне тоже было весело. Наконец-то удалось пострелять особыми боеприпасами, которые в парке приходилось беречь из-за ограниченного бюджета."
42150-20 = "Давно у нас не было безопасной защищённой базы. Это успокаивает."
42150-21 = "Приятно не переживать о диких животных или заблудившихся туристах, как в парке."
42150-22 = "Но..."
42150-23 = "Что-то не так, Мию? Сегодня что-нибудь случилось?"
42150-24 = ""
42150-31 = "Нет, просто... Разве нам правда можно жить в таком комфорте?"
42150-32 = "Звучит немного глупо, но я никогда не понимала, какая это роскошь — горячий душ и свежая еда, пока не оказалась здесь."
42150-33 = "Не могу не чувствовать вину за то, что так долго заставляла вас терпеть жизнь в парке."
42150-34 = "Н-Нет... Я не такой комфорт имела в виду... Просто..."
42150-35 = "Н-Нам ведь здесь не нужно ничего решать, да?"
42150-36 = "Что мы едим, что делаем, д-даже было ли наше прошлое решение правильным или нет..."
42150-37 = "Отряд F-FOX решает всё за нас, и мне не нужно ни о ч-чём тревожиться..."
42150-38 = "Но разве студентам SRT можно жить в таком комфорте, к-когда всем снаружи страшно, потому что они не знают, что случится с Кивотосом?"
42150-39 = "Это как... К-Как будто одежда выглядит по размеру, но ощущается чужой. Не знаю..."
42150-40 = "После таких больших перемен в жизни сомневаться — совершенно естественно."
42150-41 = "За один день на тебя свалилось слишком многое, поэтому неудивительно, что у тебя столько вопросов и чувств."
42150-42 = "Почему бы не переспать с этой мыслью? Возможно, завтра всё станет яснее."
42150-43 = "М-Может быть..."
42150-46 = "...Если честно, я немного скучаю по нашим самодельным ваннам из бочек."
42150-47 = "Греть воду было мучением, я постоянно боялась чужих взглядов, а ванна была слишком тесной, чтобы нормально помыться..."
42150-48 = "Но несмотря на всё это, я всегда испытывала особую гордость как член SRT: мы использовали свои навыки и знания, чтобы выжить."
42150-50 = "Теперь телу комфортно... но вместо бойца SRT я чувствую себя скорее наёмницей."
42150-51 = "Впервые понимаю, о чём ты. В парке даже небольшие тренировки захватывали... Давали настоящий драйв."
42150-52 = "А теперь, когда у нас неограниченный доступ к лучшему снаряжению, острота ощущений будто притупилась. Не поймите неправильно, это всё ещё интересно, но... что-то не то."
42150-53 = "Будто прежнего удовольствия уже нет..."
42150-54 = ""
42150-57 = "...А ты что думаешь, Мияко?"
42150-58 = "Ч-Что? Я...?"
42150-59 = "Я..."
42150-60 = ""
42150-63 = "Условия меня полностью устраивают."
42150-64 = "Теперь отряд может полностью сосредоточиться на тренировках, а не думать, где взять следующую еду. Как командир отряда RABBIT, работающего ради возрождения SRT, я не могу жаловаться."
42150-65 = "Ну, теперь уже заместитель командира."
42150-66 = "Да-да. Ты всё равно не ответила на мой вопрос."
42150-67 = "А ТЫ? Как ТЕБЕ? Что ТЫ думаешь?"
42150-68 = "То непоколебимое правосудие, которым ты восхищалась и о котором без конца говорила с нашей первой встречи... База, горячая еда и тёплые кровати — для ТЕБЯ, Мияко, всё это того стоит?"
42150-69 = ""
42150-73 = "...Прошу прощения. Я оставлю вас."
42150-74 = ""
42150-81 = "..."
42150-84 = "..."
42150-85 = "(Я и забыла. Дежурство сразу после душа раньше было одной из моих любимых смен.)"
42150-86 = ""
42150-88 = ""
42150-89 = "(Ветер в ещё влажных волосах почему-то успокаивает. Такое знакомое чувство...)"
42150-90 = "(Знакомое там, где всё остальное незнакомо. Даже снаряжение ощущается иначе, чем наше старое оружие.)"
42150-91 = "...Они привыкнут к такому образу жизни. Им так будет лучше."
42150-92 = ""
42150-95 = "Что это было? Нарушитель? Зачем кому-то врываться через душевую?"
42150-96 = "Вход находится с другой стороны здания, да и обычных дорог сюда не ведёт."
42150-97 = "Дикое животное...?"
42150-100 = ""
42150-101 = "[ns1] «Привет, Мияко.»\n[ns2] «Добрый вечер!»"
42150-104 = "Сенсей...?"
42150-105 = "Как вы здесь оказались? И как вообще нас нашли?!"
42150-106 = "[ns] «Это, пожалуй, секрет...»"
42150-108 = "[ns] «Наверное, я просто пошёл на запах отряда RABBIT...?»"
42150-109 = ""
42150-111 = ""
42150-112 = ""
42150-113 = "...Я вас арестовываю."
42150-115 = "Следующий эпизод; Затруднительное положение Сенсея"
