[translation]
1001402-1 = "Техника слежки Изуны"
1001402-2 = "(Я иду по улице купить кое-что необходимое.)"
1001402-3 = ""
1001402-4 = "*шорох*"
1001402-5 = ""
1001402-6 = "[ns] «А?»"
1001402-8 = ""
1001402-9 = "*шурх* *шурх*"
1001402-10 = ""
1001402-11 = "*тук*"
1001402-12 = "Ч-чего?!"
1001402-13 = ""
1001402-15 = "Ай..."
1001402-16 = "*вздох* О-опять!"
1001402-17 = "*шурх* *шурх*"
1001402-18 = ""
1001402-19 = "[ns] «Эм...»"
1001402-21 = "*шурх* *шурх* *шурх*"
1001402-22 = "Мр-р-ряу?"
1001402-23 = ""
1001402-24 = "Т-тсс! Плохая киса! Тише!"
1001402-25 = "Если ты будешь так мяукать, меня поймают!"
1001402-26 = "Хм. Может, ты меня не понимаешь, потому что ты кошка?"
1001402-27 = "Интересно, существует ли ниндзюцу для общения с животными..."
1001402-28 = ""
1001402-29 = ""
1001402-30 = "М-мяу?"
1001402-32 = "Мяу?"
1001402-33 = "Ты правда даже это не поняла?!"
1001402-34 = "Ч-чёрт! Тогда у меня нет другого выхода."
1001402-35 = "Экстренная техника уклонения Изуны!"
1001402-36 = ""
1001402-37 = ""
1001402-41 = "Фух. Теперь-то меня точно не поймают!"
1001402-42 = "[s] «...»"
1001402-44 = "[s1] Написать Изуне сообщение.\n[s2] Попробовать позвонить Изуне."
1001402-46 = "*дзынь-дзынь* ♪"
1001402-48 = "*дзынь-дзынь* ♪"
1001402-49 = "А-а! Мой телефон!"
1001402-50 = "К-как его выключить?!"
1001402-52 = "Что происходит...?!"
1001402-54 = "*тык*"
1001402-55 = "Фух. Чуть не попалась."
1001402-56 = "[s3] «Насколько „чуть“?»\n[s4] «Тебя раскрыли задолго до этого.»"
1001402-57 = "Г-господин?!"
1001402-58 = "Г-господин?!"
1001402-59 = "Но как...?! Как вы узнали, что я здесь?!"
1001402-60 = "[s] «Ну, тихой тебя было сложно назвать...»"
1001402-61 = "Вы раскусили продвинутую технику слежки Изуны?"
1001402-62 = "Неужели вы...?"
1001402-63 = "[s] «Неужели я что?»"
1001402-64 = "Господин..."
1001402-65 = ""
1001402-66 = "Быть может, вы происходите из древнего рода ниндзя...? *сглотнула*"
1001402-67 = "[s5] «Именно! Мой дед был знаменитым ниндзя-хомяком!»\n[s6] «Что?! Нет!»"
1001402-68 = "Ох. Похоже, я ошиблась."
1001402-69 = "Ох. Похоже, я ошиблась."
1001402-70 = "Как жаль..."
1001402-71 = "[s] «Ты разочарована?»"
1001402-72 = "Изуна достаточно великий ниндзя, чтобы защитить вас."
1001402-73 = "Так что ничего страшного, если мой господин не ниндзя!"
1001402-74 = "[s] «А ты уверена в себе.»"
1001402-76 = "[ns7] «Если собираешься следить за мной, тебе стоит быть потише.»\n[ns8] «Ниндзя всегда должен следить за окружением.»\n[ns9] «Совет от профессионального ниндзя: держи телефон в беззвучном режиме.»"
1001402-77 = "(улыбается) А! Да, понятно!"
1001402-78 = "(улыбается) А! Да, понятно!"
1001402-79 = "(улыбается) А! Да, понятно!"
1001402-80 = "Каждая мудрая фраза — словно редкая драгоценность!"
1001402-81 = "Надо записать их все!"
1001402-82 = "Где мой блокнот?"
1001402-83 = "[s] «Кстати, а зачем ты вообще за мной следила?»"
1001402-84 = "О, вы правда хотите знать?"
1001402-85 = "Разве не очевидно? Чтобы защищать вас, мой господин!"
1001402-86 = "[s] «Защищать меня...?»"
1001402-87 = "Разве вы не помните, как я говорила, что волнуюсь?"
1001402-88 = "На самом деле я волновалась..."
1001402-89 = "...за вас, мой господин!"
1001402-90 = "[s] «Почему?»"
1001402-91 = "Изуна внезапно кое-что осознала."
1001402-92 = "Вы очень важный человек."
1001402-93 = "А значит, за вами ОБЯЗАТЕЛЬНО кто-нибудь охотится!"
1001402-94 = "[s] «Обещаю, никто за мной не охотится.»"
1001402-95 = "Нельзя так говорить, мой господин!"
1001402-96 = "Нельзя терять бдительность."
1001402-97 = "Вы что, никогда не смотрели исторические драмы?"
1001402-98 = "Опасно пить всё, что вам дают."
1001402-99 = "Стоит лишь расслабиться — и убийцы тут как тут!"
1001402-100 = "Это неизбежно!"
1001402-101 = "[s10] «Н-неизбежно?»\n[s11] «Но за мной никто не охотится!»"
1001402-102 = "Это же клише любой исторической драмы!"
1001402-103 = "Это же клише любой исторической драмы!"
1001402-104 = "[s] «К-клише?»"
1001402-105 = "Поэтому я всё думала..."
1001402-106 = "Что Изуна может сделать, чтобы вы были в безопасности, пока занимаетесь своими делами?"
1001402-107 = "Я думала снова и снова и наконец решилась!"
1001402-108 = "С сегодняшнего дня я стану вашим телохранителем и буду следить за каждым вашим шагом!"
1001402-109 = "[s] «Так вот почему ты всё это время ходила за мной...»"
1001402-110 = "Хи-хи!"
1001402-111 = "Именно!"
1001402-112 = "Я ваш ангел-хранитель!"
1001402-113 = "[s] «Есть одна маленькая проблема, Изуна.»"
1001402-114 = "П... проблема?"
1001402-115 = "[s] «Нельзя просто весь день ходить за человеком по пятам.»"
1001402-116 = "А-А?"
1001402-117 = "Н-но...! Изуна ради вас сделает что угодно, мой господин!"
1001402-118 = "[s] «Ты даже разрешения не спросила. А если я против?»"
1001402-119 = "Но почему?!"
1001402-120 = "[s] «У каждого есть право на личное пространство и секреты, которые он хочет сохранить, верно?»"
1001402-121 = "У-ух..."
1001402-122 = "П-простите, мой господин."
1001402-123 = "[s] «Я не злюсь. Просто в следующий раз сначала спроси.»"
1001402-124 = "*ур-р-рч*"
1001402-125 = "А..."
1001402-126 = "Я ничего не ела с самого завтрака, поэтому..."
1001402-127 = "[s] «Так не пойдёт. Хочешь перекусить?»"
1001402-128 = "П-перекусить?"
1001402-129 = "[s12] «Только если ты не против.»\n[s13] «Если не хочешь, не обязательно.»"
1001402-130 = ""
1001402-131 = ""
1001402-132 = "Нет, конечно я хочу!"
1001402-133 = "Пойдёмте! И по дороге можете рассчитывать на защиту Изуны!"
1001402-134 = "Но больше никакой слежки."
1001402-135 = "На этот раз я буду защищать господина открыто, прямо спереди, как настоящий ниндзя!"
1001402-136 = "[s] «Ладно, ладно.»"
1001402-137 = "Хи-хи!"
1001402-138 = ""
1001402-139 = "Нин-нин!"
1001402-141 = "(И так, под шумным сопровождением Изуны, мы отправились в ресторан.)"
