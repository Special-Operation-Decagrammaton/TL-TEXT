[translation]
2004105-1 = "Проектирование"
2004105-5 = "У меня тут заказ на 3D-принтер и... порошковые материалы, верно?"
2004105-6 = "Просто распишитесь здесь..."
2004105-17 = "Здравствуйте, Сенсей."
2004105-18 = "Кажется... я уже немного к этому привыкла. И всё равно ощущения свежие."
2004105-19 = "[s] «Похоже, ты заказала 3D-принтер.»"
2004105-20 = "Верно. Ещё мне нужно просторное место с хорошей вентиляцией."
2004105-21 = "В процессе работы 3D-принтеры обычно производят довольно много отходов."
2004105-22 = "...Поэтому работать в убежище я не могла."
2004105-23 = "[s] «Думаю, если поискать, я смогу найти подходящее место...»"
2004105-24 = ""
2004105-26 = ""
2004105-31 = ""
2004105-32 = "[ns] «Как насчёт здесь?»"
2004105-33 = "Здесь подойдёт. Вон там большое хорошее окно..."
2004105-34 = "Тогда я воспользуюсь этим помещением."
2004105-36 = ""
2004105-37 = ""
2004105-38 = ""
2004105-39 = ""
2004105-40 = ""
2004105-41 = ""
2004105-42 = "Хорошо. Если запустить сейчас, то..."
2004105-43 = ""
2004105-45 = ""
2004105-47 = "Что ж, давайте выйдем наружу. Вам понадобится свежий воздух."
2004105-51 = ""
2004105-52 = "[ns] «Ты делаешь что-то для конкретного проекта?»"
2004105-53 = "Не совсем. Иногда я просто экспериментирую с новыми промышленными дизайнами."
2004105-54 = "Это помогает заранее выявлять недостатки, а ещё играет роль в эстетике."
2004105-55 = "Это работа, но... не то чтобы неприятная."
2004105-56 = "[s] «То есть это хобби?»"
2004105-57 = "Хм? Хобби?"
2004105-58 = "П-Правда?"
2004105-59 = "Я никогда не думала об этом так."
2004105-60 = "Но... хобби по своей природе иррациональны."
2004105-61 = "Они существуют исключительно ради отдыха. Никакой учёбы, работы или тренировок, никакой прибыли или практической пользы..."
2004105-62 = "То есть отношение вложений к результату неизбежно стремится к нулю."
2004105-63 = "Могу ли я вообще позволить себе тратить время таким образом?"
2004105-64 = "[s] «Хм. Ничто ведь не запрещает.»"
2004105-65 = "То есть... завести хобби — не обязательно плохо? Вы даже рекомендуете?"
2004105-66 = "..."
2004105-67 = ""
2004105-69 = ""
2004105-70 = ""
2004105-71 = "Что ж, есть ещё одна проблема."
2004105-72 = "Мои проекты... Возможно, вы уже это знаете..."
2004105-73 = "Другие люди... обычно их не ценят."
2004105-74 = "Я стремлюсь к рациональности и функциональной красоте, но большинство людей, похоже, этого не понимают."
2004105-75 = "...Может, я просто всё делаю неправильно."
2004105-76 = "Нет, никакого «может». Я точно делаю что-то не так."
2004105-77 = "Статистически вероятность того, что ВСЕ остальные ошибаются насчёт моих работ, ничтожно мала. Ошибка определённо во мне."
2004105-78 = "[ns] «Ого!»"
2004105-80 = "[ns1] «Нет, я совсем так не думаю!»\n[ns2] «Если автор вложил в работу душу, это искусство, что бы ни говорили другие!»"
2004105-83 = "...Хм?"
2004105-84 = ""
2004105-86 = ""
2004105-87 = "Искусство...?"
2004105-88 = ""
2004105-90 = ""
2004105-91 = ""
2004105-92 = ""
2004105-93 = ""
2004105-94 = ""
2004105-95 = ""
2004105-96 = "Я... художник?!"
2004105-97 = "Я-я никогда не думала об этом так."
2004105-98 = "Искусство, конечно же, полностью субъективно. Объективности там просто нет места..."
2004105-99 = "Не существует конкретных параметров, определяющих качество искусства... а значит, никто не может по-настоящему сказать, что оно «неправильное»!"
2004105-100 = "..."
2004105-101 = "Вот как..."
2004105-102 = "Это искусство."
2004105-103 = "Я занималась искусством. ...Значит, я МОГУ заниматься искусством."
2004105-104 = "Я... вовсе не ошибалась!"
2004105-105 = "Спасибо, Сенсей!"
2004105-106 = "[s] «А? Ну да, конечно...»"
2004105-107 = "Вы всегда замечаете то, чего мне самой не хватает."
2004105-108 = "Полагаю, именно поэтому вы — «Сенсей»."
2004105-109 = "В конце концов, «Сенсей» означает «тот, кто прошёл путь раньше». Тот, кто способен вести за собой других и объяснять то, чего они ещё не понимают. Конечно. Вот почему...!"
2004105-110 = "[s] «Р-Рио? Ты в порядке?»"
2004105-111 = "Не знаю. Я... кажется, впервые в жизни настолько счастлива."
2004105-112 = "Мне всегда казалось, будто я веду непрерывную борьбу, лишь бы продолжать двигаться вперёд."
2004105-113 = "Но..."
2004105-114 = "...если я рядом с вами, то могла бы просто оставаться такой...!"
2004105-115 = ""
2004105-118 = "Я услышал звук завершившейся 3D-печати."
2004105-119 = ""
2004105-120 = "[ns] «Готово? Хочу посмотреть, что получилось.»"
2004105-121 = "И...!"
2004105-123 = "...Эм, Сенсей?"
2004105-124 = "Простите. Не оборачивайтесь, пожалуйста. Просто оставайтесь там и выслушайте меня."
2004105-125 = "...Спасибо за то, что вы сказали."
2004105-126 = "Мне правда было очень приятно... это услышать."
2004105-128 = ""
2004105-129 = ""
2004105-130 = ""
2004105-131 = ""
2004105-133 = "Провожая взглядом уходящую Рио, я ещё немного подумал о том, что такое искусство."
