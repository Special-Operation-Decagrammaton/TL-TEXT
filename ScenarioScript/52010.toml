[translation]
52010-1 = "Эпизод 1;Неприкасаемый подол"
52010-13 = "...Первогодка Совета урегулирования Хяккарёран, Горё Нагуса."
52010-14 = ""
52010-17 = ""
52010-18 = ""
52010-21 = "...и первогодка Совета урегулирования Хяккарёран, Нанакадо Аямэ."
52010-22 = ""
52010-25 = ""
52010-27 = "Обе, шаг вперёд."
52010-30 = "Согласно давним традициям Хяккарёран—"
52010-31 = "Мы проведём всё честно и справедливо."
52010-32 = ""
52010-34 = ""
52010-35 = ""
52010-38 = "Начали!"
52010-43 = ""
52010-44 = ""
52010-46 = "...Ты открылась."
52010-47 = ""
52010-49 = ""
52010-50 = ""
52010-57 = ""
52010-58 = ""
52010-59 = ""
52010-61 = ""
52010-64 = "Вот—!"
52010-65 = ""
52010-71 = "...Ух."
52010-72 = "Победитель: Нанакадо Аямэ!"
52010-73 = ""
52010-76 = ""
52010-77 = "...И это моя 201-я победа подряд."
52010-78 = "Хороший бой. Спасибо, Нагуса."
52010-79 = ""
52010-81 = ""
52010-82 = "Угххх..."
52010-83 = "Н-Нагуса?"
52010-84 = "Я опять проиграла Аямэ..."
52010-85 = "Эй! Не плачь. Ты отлично справилась, Нагуса!"
52010-86 = "Но... с такой некомпетентностью как я вообще смогу тебе помогать, Аямэ?"
52010-87 = "Я так долго тренировалась, а всё равно недостойна даже держаться за край твоего рукава... Я жалкая..."
52010-88 = "Ничего подобного! Ты постоянно становишься лучше."
52010-89 = ""
52010-91 = ""
52010-94 = "Дай руку."
52010-97 = "Даже если упадёшь, я буду рядом. Подниму тебя в любой момент."
52010-98 = ""
52010-101 = "Даже если буду тянуть тебя вниз?"
52010-102 = "Конечно."
52010-103 = "Даже если буду всхлипывать и заливаться слезами?"
52010-104 = "...Разумеется."
52010-105 = "Даже если в самый неподходящий момент снова застыну, потому что никак не могу решиться—"
52010-106 = "Всё нормально. Потому что правда в том—"
52010-107 = ""
52010-114 = "Ты никогда не была моей подругой, Горё Нагуса."
52010-115 = ""
52010-130 = ""
52010-131 = ""
52010-132 = "...!"
52010-133 = "*тяжело дышит* *тяжело дышит*... Просто сон... кошмар?"
52010-134 = "Я до сих пор чувствую, как её рукав выскальзывает из моей руки... этой руки."
52010-135 = ""
52010-137 = ""
52010-139 = "...Ух."
52010-142 = "Больно..."
52010-143 = "...С каждой наступившей ночью кажется, будто рука горит до самого костного мозга."
52010-144 = "Если бы я спасла Аямэ, наверное, осталась бы целой... во многих смыслах."
52010-145 = ""
52010-147 = ""
52010-148 = "Угх..."
52010-149 = "...Прости, Аямэ."
52010-150 = "Мне так искренне жаль..."
52010-152 = "Что я бесполезна."
52010-153 = "Что оказалась слишком слабой и трусливой, чтобы удержать..."
52010-154 = ""
52010-157 = "Мне так жаль, Аямэ..."
52010-159 = "Следующий эпизод;Новая история о призраках"
