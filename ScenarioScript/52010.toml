[translation]
52010-1 = "Episódio 1;Dedos Fora de Alcance"
52010-13 = "...Comitê de Mediação de Conflitos Hyakkaryouran, 1º ano, Nagusa Goryou."
52010-21 = "Igualmente do Comitê de Mediação de Conflitos Hyakkaryouran, 1º ano, Ayame Nanakado."
52010-27 = "Ambas, um passo à frente."
52010-30 = "De acordo com as antigas tradições do Hyakkaryouran—"
52010-31 = "Preparem-se para um duelo justo—"
52010-38 = "Lutem!"
52010-46 = "...Uma abertura."
52010-64 = "Agora—!!"
52010-71 = "Ngh..."
52010-72 = "Ippon! Fim de luta!"
52010-77 = "Com isso, são 201 lutas, 201 vitórias..."
52010-78 = "Obrigada por hoje também, Nagusa! Foi uma ótima luta."
52010-82 = "Snif... ugh..."
52010-83 = "N-Nagusa?"
52010-84 = "Eu perdi... para a Ayame de novo..."
52010-85 = "N-Não chora! Você também foi forte, Nagusa!?"
52010-86 = "Mas... desse jeito, eu vou acabar sendo inútil de novo."
52010-87 = "Eu me esforcei... tanto, mas sempre acaba assim...#nNão chego nem aos pés da Ayame."
52010-88 = "Não se culpe tanto assim."
52010-94 = "Vem, me dá a mão."
52010-97 = "Eu sempre vou estar ao seu lado.#nPara poder te estender a mão na hora, sempre que você cair."
52010-101 = "...Mesmo eu sendo um fardo?"
52010-102 = "Claro."
52010-103 = "...Mesmo sendo uma chorona?"
52010-104 = "Sim."
52010-105 = "Indecisa, incapaz de decidir nada sozinha—"
52010-106 = "Está tudo bem!#nPorque eu—"
52010-114 = "Eu... nunca te considerei minha amiga."
52010-132 = "...!!"
52010-133 = "Arf... arf...!#n...Um sonho?"
52010-134 = "Mas a Ayame... estava mesmo ali."
52010-139 = "...!"
52010-142 = "Agh... dói..."
52010-143 = "Parece que há chamas ardendo dentro do meu braço... Está tão quente..."
52010-144 = "Se naquela hora eu tivesse conseguido impedir a Ayame..."
52010-148 = "Ugh..."
52010-149 = "Me... desculpa, Ayame..."
52010-150 = "Me perdoa..."
52010-152 = "Por ser uma inútil, uma covarde..."
52010-153 = "Por eu ser assim..."
52010-157 = "...Me desculpe, Ayame."
52010-159 = "Próximo;Um Novo Conto Macabro"
