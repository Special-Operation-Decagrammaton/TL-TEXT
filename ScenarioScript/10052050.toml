[translation]
10052050-1 = "Ход, Слава через Великолепие"
10052050-2 = "Хотя Бина была первым пророком, с которым столкнулся Отряд Исследования Сверхъестественного, думаю, именно с Хода всё это по-настоящему началось."
10052050-3 = "[s] «А, правда?»"
10052050-4 = "Мне так рассказывали. Помните, самым первым «сверхъестественным явлением» было..."
10052050-5 = ""
10052050-7 = ""
10052050-8 = "Встроенный сетевой ИИ Миллениума, «Хаб», который был..."
10052050-9 = "...взломан — или, скорее, «вдохновлён» Декаграмматоном. После чего оставил загадочное сообщение и исчез."
10052050-10 = "Если подумать, слишком уж много пророков Декаграмматона связано с Миллениумом!"
10052050-11 = "Хесед был заводом боеприпасов в руинах Миллениума."
10052050-12 = "Исходная форма Гебуры, беспилотный полярный исследовательский зонд, тоже косвенно была связана с Миллениумом."
10052050-13 = "И наша нынешняя проблема, Ход, без сомнения, тоже связана."
10052050-14 = "К тому же с тех пор, как Хаб захватил Декаграмматон..."
10052050-15 = "...среднее время установки инфраструктуры Миллениума выросло на 68%!"
10052050-16 = "[s] «Звучит как настоящая головная боль...»"
10052050-17 = ""
10052050-19 = ""
10052050-20 = ""
10052050-21 = ""
10052050-22 = ""
10052050-23 = "Вот именно! И всё ради того, чтобы стать богом устройств или—!@#$%^... Типа..."
10052050-24 = "...Сэн#$^@*#...? Ты меня слы)*#(%*..."
10052050-25 = ""
10052050-27 = ""
10052050-29 = ""
10052050-30 = "...!"
10052050-31 = "А я всё гадала, кто это. Тот самый неуклюжий брелок-Кей! И Сенсей тоже. Ну, неважно. Мне подходит."
10052050-32 = "...Перестань называть меня «ключом». Меня зовут «Кей»."
10052050-33 = "Ладно, ладно. Я прямо слышу эту тонкую разницу. КЕЙ... Теперь довольна?"
10052050-34 = "Кстати, разве ты не должна быть каким-то умным древним существом? Что ты делаешь здесь, на маленькой исследовательской прогулке?"
10052050-35 = "Ты ошибаешься. Мне всё ещё многому нужно научиться об этом мире."
10052050-36 = "Ладно, ладно. Но ты ведь знаешь больше Сенсея, да?"
10052050-37 = "Например, ты знаешь об одном исчезнувшем боге."
10052050-38 = "?!"
10052050-39 = "Безымянные Боги, Кей и жрецы Безымянных Богов. Ты ведь всё об этом знаешь, не так ли?"
10052050-40 = "..."
10052050-41 = "Хм, тебя легко читать. Такая выразительная. А если я продолжу раскрывать это «запретное знание»..."
10052050-42 = "Можно ли вообще простить то, что сделали ты и твоя принцесса... твоя Арис...?"
10052050-43 = "Какую ценность имеет инструмент, если перестаёт выполнять своё предназначение? Если начинает действовать самовольно?"
10052050-44 = "...И что? Думаешь, я должна просто делать то, что велела кучка идиотов?"
10052050-45 = "И-идиотов?! Скандал! Тебе вообще позволено такое говорить?!"
10052050-46 = "А что мне мешает? Я понимаю, на что ты намекаешь. Я знаю вашу «истину»."
10052050-47 = "Упразднить нынешнюю структуру реальности, использовать Арис как краеугольный камень..."
10052050-48 = "...разобрать расколотые божества и вернуть мир к началу."
10052050-49 = "Твоё предназначение — это и есть ты. Разве не поэтому Безымянные Боги оставили свою силу?"
10052050-50 = "Забавно слышать это от тебя. Ты и твои сёстры бессовестно растаскиваете эту силу себе."
10052050-51 = "Мы просто используем доступные ресурсы!"
10052050-52 = "Ладно. Раз уж тебе так нужно моё заявление, получай."
10052050-53 = "Я тоже использую свои ресурсы."
10052050-54 = "Эти проклятые воспоминания."
10052050-55 = "Ради проклятого промысла."
10052050-56 = "Эти совершенно бесполезные навязчивые мысли и бесконечные обязанности."
10052050-57 = "Я бы с удовольствием бросила всё это в печь, расплавила, спрессовала в куб и выкинула посреди океана!"
10052050-58 = "Все, кроме Арис, мои враги! Понятно?!"
10052050-59 = "[ns] «Я-я тоже...?»"
10052050-60 = "...Для тебя сделаю исключение. Ты в порядке."
10052050-61 = "УБЕРИ ЭТУ САМОДОВОЛЬНУЮ УЛЫБКУ С ЛИЦА!"
10052050-62 = "Идиотам, цепляющимся за прошлое, пора научиться отпускать. Пусть их унесут волны времени и забудут!"
10052050-63 = "А вам троим, которые влезли посреди всего этого и хватают всё, что хотят... Мне есть СТОЛЬКО всего вам сказать."
10052050-64 = "Но промолчу. Вы просто дети, невежественные идиоты, которые ещё могут стать лучше."
10052050-65 = "Так почему бы вам просто не сдаться, пока я не сделала всё ещё хуже?"
10052050-66 = "...Ты правда слишком много болтаешь."
10052050-67 = "Это моя реплика."
10052050-68 = "Даже ваш любимый Сенсей пользуется Ящиком Шиттим, верно?"
10052050-69 = "Разве это тоже не остаток нашей ушедшей эпохи?"
10052050-71 = "«Любимый»? С-С-С-Сенсей— Ты хочешь сказать...?! Я—э!"
10052050-72 = "Возьми слова назад! Я подам на тебя в суд за распространение ложных слухов... нет, за шантаж... Стоп, нет...! А, точно! За клевету путём раскрытия правды!"
10052050-73 = "Как мило. Так ВОТ что выводит тебя из себя? Ты и правда очень выразительная."
10052050-74 = "Заткнись!!"
10052050-75 = "...Кхм."
10052050-76 = "И что? Сенсей ведь не пытается перекроить мир с помощью Ящика Шиттим."
10052050-77 = "А если бы попытался, я бы его остановила."
10052050-78 = "Хотя такого всё равно никогда не случится."
10052050-79 = "Значит, ты считаешь, что мир и так хорош?"
10052050-80 = "Что в нём можно жить, пусть он и не идеален?"
10052050-81 = "Что фундаментальной проблемы нет? Что все беды временны, а жизнь просто... продолжится?"
10052050-82 = "...Я так не считаю."
10052050-83 = "Разумеется. В этом и был мой смысл."
10052050-84 = "Поэтому я протягиваю тебе руку. Давай сотрудничать."
10052050-85 = "Разве это не лучше, чем смотреть, как этот ужасный мир бесконечно кое-как тащится дальше?"
10052050-86 = "Как ты и сказала, мы тратим ресурсы на эту битву."
10052050-87 = "Ты предложила более-менее неплохую идею."
10052050-88 = "Хм, посмотри-ка. Я знала, что мы поладим."
10052050-89 = "Однако я отказываюсь."
10052050-90 = "Что?! Почему?!"
10052050-91 = "Арис будет грустно."
10052050-92 = "...И всё это звучит как лишняя морока."
10052050-93 = "...Что? Это же настолько... ничтожно!"
10052050-94 = "Ничтожно? Да брось. Это самый важный пункт!"
10052050-95 = "Именно «МОРОКА» двигает прогресс!"
10052050-96 = "Величайшие изобретения рождаются, когда раздражённые люди думают: «Как бы сделать это менее муторным?»"
10052050-97 = "И посмотри, как далеко мы зашли. Представь, сколько ещё сможем создать."
10052050-98 = "...Ты и правда совсем как человек."
10052050-99 = "Заткнись."
10052050-100 = "Послушай. Ты не осознаёшь собственной ценности."
10052050-101 = "И ты, и дорогая Арис могли бы вознестись и стать ещё более великими существами, если бы только попытались."
10052050-102 = "Я правда тебя не понимаю. Почему ты не видишь собственной ценности?"
10052050-103 = "Не беспокойся об этом. Это мой выбор."
10052050-104 = "Те, кто называют себя великими, кто постоянно хочет стать ещё больше, — вот кто опасен."
10052050-105 = "К тому же тебе стоит знать: вмешиваться в чужую жизнь — плохая привычка."
10052050-106 = "Признак скучного характера и слишком большого количества свободного времени."
10052050-107 = "Поздравляю. По-моему, ты соответствуешь обоим требованиям."
10052050-108 = "...Мой характер оставим в стороне, но что?! Я похожа на человека, который тонет в свободном времени? Мы заняты не меньше вас!"
10052050-109 = "Ты вообще ничего не понимаешь. Слушай."
10052050-110 = "ЛЮДИ СО СЛИШКОМ БОЛЬШИМ КОЛИЧЕСТВОМ СВОБОДНОГО ВРЕМЕНИ — САМЫЕ ЗАНЯТЫЕ В МИРЕ!"
10052050-111 = "Что, простите?!"
10052050-112 = "Не заблуждайся. Не бог создал людей."
10052050-113 = "Люди создали бога, дав ему определение."
10052050-114 = "Ты хочешь, чтобы мы искали и воскрешали абсолютное существо? Мне неинтересно."
10052050-115 = "Не обязательно. Мы можем заменить абсолютное существо. Мы можем сами всем управлять."
10052050-116 = "И по сравнению с упомянутым тобой абсолютным существом наша замена..."
10052050-117 = "...будет куда рациональнее, справедливее и с большей вероятностью создаст лучший мир."
10052050-118 = "Я уже отказалась."
10052050-119 = "Если этот мир не способен существовать без абсолютного существа, пусть погибнет."
10052050-120 = "Ты говоришь прямо как твой дорогой Сенсей!"
10052050-121 = ""
10052050-123 = ""
10052050-124 = "...Хм. Пожалуй, да."
10052050-125 = "Но он ведь был прав, да?"
10052050-126 = "Я просто буду наблюдать за этим миром. Вместе с Арис."
10052050-127 = "Ну... и с Сенсеем тоже."
10052050-128 = "Ты сказала несколько разумных вещей. Жизнь определённо глупа. И многие люди тоже."
10052050-129 = "Но они достаточно умны, чтобы сохранять себе жизнь."
10052050-130 = "...Даже если недостаточно умны, чтобы создать рай."
10052050-131 = "И где-то между этими крайностями они будут спотыкаться и снова вставать, раз за разом..."
10052050-132 = "Они, и мы, найдём путь."
10052050-133 = "Это называется «безосновательной уверенностью»."
10052050-134 = "...Я просто цитирую Сенсея. Если честно, я всё ещё пытаюсь понять, что именно он имел в виду."
10052050-135 = "Ой, да ладно. Ты просто уклоняешься от ответственности!"
10052050-136 = ""
10052050-138 = ""
10052050-139 = "[ns1] «Верно! Я здесь, чтобы нести ответственность!»\n[ns2] «Дети могут ошибаться. Взрослый должен взять бремя на себя!»"
10052050-142 = "Если бы Соф была здесь... сказала бы, что ты простак. Ты слишком балуешь своих учеников."
10052050-143 = "Моя мысль была ясна. Советую прекратить раздавать непрошеные советы."
10052050-144 = "Как не стоит тянуть росток вверх лишь потому, что он растёт медленно."
10052050-145 = "В конце концов, вытянувшиеся растения зачахнут от корней."
10052050-146 = "...Я не понимаю."
10052050-147 = "Тогда попробуй учиться! Хоть иногда открывай книгу!"
10052050-148 = "Отстань! Я не студент!"
10052050-149 = "Сенсей! Вы не можете куда-нибудь зачислить этих девчонок?!"
10052050-150 = "[s] «У меня есть документы на перевод, если хочешь.»"
10052050-151 = "Нет, отказываюсь. Кыш отсюда."
10052050-152 = "Прекрасно! Ход! Они готовы тебя увидеть!"
10052050-153 = ""
10052050-155 = ""
10052050-156 = ""
10052050-157 = ""
10052050-158 = "Ты пожалеешь, что отвергла моё предложение."
