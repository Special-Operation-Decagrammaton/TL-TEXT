[translation]
80000095-1 = "Истина лежит дальше"
80000095-2 = "Я получил звонок Касуми и ночью отправился к мосту. Вокруг никого не было."
80000095-3 = "Через несколько минут я увидел, как Касуми идёт ко мне издалека и машет рукой."
80000095-4 = "О-о-о, Сенсей!! Рановато вы пришли, а?"
80000095-5 = "Вахахаха! Заставила ждать? Простите. Я вообще-то хотела прийти раньше и ждать вас сама, но..."
80000095-6 = "Я, знаете ли, немножко... беглянка. Пришлось потратить время, чтобы оторваться от всех преследователей."
80000095-7 = "Именно поэтому я изначально и попросила встретиться посреди ночи на этом одиноком мосту."
80000095-8 = "...Хм? Хотите знать, что происходит?"
80000095-9 = "Угх. Да ладно. Даже я помню про такой особенный день."
80000095-10 = "Разве не очевидно? Сегодня же День святого Валентина..."
80000095-11 = "Если дело не в этом, то... Может, вы вообще не любитель шоколада?"
80000095-12 = "Если так, простите, что потратила ваше драгоценное время. Вахахахаха!"
80000095-13 = "...О, не так? Отлично! Тогда не вижу причин колебаться и могу вручить подарок."
80000095-14 = "Итак..."
80000095-15 = "Вот! Та-дам!!"
80000095-16 = ""
80000095-18 = ""
80000095-20 = "[ns1] «Т... тапок?!»\n[ns2] «Это шоколад?!»"
80000095-23 = "Именно, именно! Ну как?! Разве не выглядит аппетитно?"
80000095-24 = "Помните, когда мой тапок порвался в лесу? Вы купили мне новый."
80000095-25 = "Уверена, вы уже совершенно об этом забыли. Но я не из тех, кто забывает долги."
80000095-26 = "Я подумала, что купить вам точно такие же тапки будет бессмысленно... поэтому воспользовалась случаем и сделала вот эти!"
80000095-27 = "Ну как? Шедевры, да? Выглядят совсем как настоящие тапки, правда?"
80000095-28 = "...Хм?"
80000095-29 = "Сама ли я их сделала? А вы как думаете?"
80000095-30 = "Хи-хи. Ну, мои отпечатки на них точно есть. Это я обещаю."
80000095-31 = "Правда, не совсем отпечатки рук..."
80000095-32 = "...Скорее отпечатки ног."
80000095-33 = ""
80000095-36 = "[ns3] «...?»\n[ns4] «Следы ног?»"
80000095-39 = "Ладно! Хватит болтать!"
80000095-40 = "Теперь..."
80000095-41 = ""
80000095-44 = "...Ой-ой."
80000095-45 = "Простите, Сенсей. Мне пора. Похоже, моё местоположение раскрыли."
80000095-46 = "Будет неприятно, если Префектурная команда или те бандиты поймают нас вместе."
80000095-47 = "Так что пора сматываться! Хорошего вечера!"
80000095-48 = "Вжух!!"
