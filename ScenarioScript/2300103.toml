[translation]
2300103-1 = "Сегодняшнее блюдо Фууки"
2300103-2 = "Ты пришёл, Сенсей."
2300103-3 = "[s] «Ну да. Я получил твоё сообщение.»"
2300103-4 = "Я тут случайно... услышала кое-какие слухи о тебе."
2300103-5 = "Говорят, Шале держит тебя занятым день и ночь."
2300103-6 = "Настолько, что ты почти никогда не ешь вовремя. Это правда?"
2300103-7 = "Плохо, Сенсей! Очень плохо!"
2300103-8 = "Ты уже взрослый."
2300103-9 = "В твоём возрасте пора относиться к здоровью серьёзнее!"
2300103-10 = "[s] «Быть взрослым ещё значит идти на жерт—»"
2300103-11 = "Хватит! Никаких оправданий!"
2300103-12 = "Ситуация критическая. Здесь требуется вмешательство президента Клуба школьного питания!"
2300103-13 = "Вообще-то именно поэтому мы вчера и ходили за продуктами."
2300103-14 = "[s] «Я думал, ты покупала продукты для столовой.»"
2300103-15 = "Покупала, но продукты для столовой были второй задачей."
2300103-16 = "Улучшить твоё питание — приоритет Клуба школьного питания!"
2300103-17 = "Рис — основа питательной еды, а правильное питание — ключ к здоровью!"
2300103-18 = "И это приводит нас к сегодняшнему меню."
2300103-19 = ""
2300103-20 = "Ужин из 18 блюд в стиле Клуба школьного питания Геенны!"
2300103-21 = "Надеюсь, ты готов, Сенсей!"
2300103-23 = "Начнём с закусок."
2300103-24 = "Это сделано из перетёртой красной фасоли и тофу с белой соевой пастой."
2300103-25 = "[s1] «М-м. Вкус тофу чувствуется очень хорошо!»\n[s2] «Сочетание соевой пасты и красной фасоли потрясающее!»"
2300103-26 = "Хи-хи-хи! А дальше..."
2300103-27 = "Хи-хи-хи! А дальше..."
2300103-30 = "...суп вонтон на бульоне из моллюсков."
2300103-31 = "Пей, пока горячий!"
2300103-32 = "[s3] «М-м. Какой великолепный суп!»\n[s4] «Моллюски и креветки придают ему замечательный морской вкус!»"
2300103-33 = "Ты ещё ничего не пробовал. Дальше..."
2300103-34 = "Ты ещё ничего не пробовал. Дальше..."
2300103-37 = "Следующее — вот это!"
2300103-39 = "Теперь попробуй это!"
2300103-41 = "И это блюдо тоже, Сенсей!"
2300103-43 = "(В итоге я попробовал все 18 блюд, которые подала Фуука.)"
2300103-45 = "Сенсей? Ты как-то плохо выглядишь..."
2300103-46 = "[s] «Ургх. М-Мой желудок...»"
2300103-47 = "А? Желудок?"
2300103-48 = "Что с желудком?"
2300103-51 = "С-Сенсей?!"
2300103-53 = "(После этого в медпункте Геенны меня накачали лекарствами для пищеварения.)"
