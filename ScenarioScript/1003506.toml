[translation]
1003506-1 = "Безымянный переводчик"
1003506-2 = "По просьбе Уи я купил в магазине напиток и жевательную резинку и отправился в старую библиотеку."
1003506-3 = "Уи выглядела переутомлённой, поэтому я заодно купил обезболивающий пластырь."
1003506-5 = "Внутри старой библиотеки"
1003506-8 = "А? Что это?"
1003506-9 = "И вообще, откуда вы знали, что дверь не заперта? Кто разрешил входить без спроса?"
1003506-10 = "[s1] «Уи?»\n[s2] «Ты звучишь очень уставшей...»"
1003506-11 = "...?"
1003506-12 = "...?"
1003506-13 = "О, простите. Я не поняла, что это вы, Сенсей. Не ожидала, что вы и правда принесёте мне это... Спасибо."
1003506-14 = "Пожалуйста... проходите сюда."
1003506-17 = "― С-Спасибо, Сенсей.[wa:5020]"
1003506-19 = "― Я, эм... благодарна вам.[wa:1380]"
1003506-22 = "― О, это?[wa:2120]"
1003506-24 = "― Я как раз расшифровывала эти тексты.[wa:2060]"
1003506-27 = "― Эта старая библиотека..."
1003506-29 = "― Здесь хранится несколько книг, написанных на древних языках.[wa:950]"
1003506-32 = "― У каждого из этих драгоценных детей есть своя история.[wa:4780]"
1003506-34 = "― Они ждали возможности поделиться ею с миром.[wa:10]"
1003506-37 = "― Поэтому я хочу помочь им рассказать свои истории.[wa:3380]"
1003506-40 = "― Простите. Наверное, вам всё это кажется скучным, да?[wa:3520]"
1003506-43 = "[ns3] «Нет. По-моему, это прекрасно.»\n[ns4] «Ты удивительный человек, Уи.»"
1003506-46 = "― ...! Э-Эм, я... наверное.[wa:4200]"
1003506-48 = "― Я-Я не привыкла к комплиментам...[wa:2480]"
1003506-51 = "― Я не знаю, что сказать..."
1003506-53 = "― Я совсем потеряла дар речи... Хе...[wa:4250]"
1003506-56 = "Я чувствую себя... как-то странно."
1003506-57 = "Сколько себя помню, я занималась этим в свободное время, но никогда не ожидала услышать от кого-то такие слова."
1003506-58 = "Особенно от такого человека, как вы, Сенсей."
1003506-59 = "Я всегда думала, что остальные скажут, будто я просто трачу время.#nУверена, многие так и думают..."
1003506-60 = "Но меня это никогда не беспокоило. Я просто хотела этим заниматься,#nи для меня этого было достаточно."
1003506-61 = "[s5] «Я совсем не считаю это пустой тратой времени.»\n[s6] «Кто-нибудь обязательно оценит твой труд.»"
1003506-62 = "Сенсей..."
1003506-63 = "Сенсей..."
1003506-64 = "[s7] «У меня нет никаких сомнений, когда я вижу, насколько ты этим увлечена.»\n[s8] «Теперь мне понятно, почему остальные сделали тебя президентом.»\n[s9] «Меня впечатляет, как много ты делаешь, оставаясь за кулисами.»"
1003506-65 = "А..."
1003506-66 = "А..."
1003506-67 = "А..."
1003506-68 = "..."
1003506-69 = "Спасибо. Для меня это очень много значит."
1003506-70 = "Если бы в мире было больше людей вроде вас, Сенсей, я бы не была такой интроверткой."
1003506-71 = "Я знаю, что не каждый посторонний невежественен или бездумен..."
1003506-72 = "...но от некоторых старых привычек трудно избавиться. Даже я это понимаю."
1003506-73 = "Вообще-то члены клуба стали ещё настойчивее по этому поводу."
1003506-74 = "Я не против них, но когда они так себя ведут, это бывает довольно утомительно."
1003506-75 = "Они не такие, как вы. Вы никогда не давите на меня слишком сильно."
1003506-76 = "Странно. Формально вы мой Сенсей..."
1003506-77 = "...но всё равно относитесь ко мне с уважением и общаетесь как с равной.#nВы не смеётесь над тем, что я называю книги своими детьми.#nВы даже сами так их назвали..."
1003506-78 = "Это меня удивило. Я никогда не понимала, насколько многим может быть настоящий Сенсей."
1003506-79 = "Возможно, у меня даже появились какие-то ожидания от вас."
1003506-80 = "Хотя я солгу, если скажу, что точно понимаю, что это за ожидания."
1003506-81 = "Но... думаю, со временем мне станет понятнее. Тогда я расскажу подробнее.#nВы не против?"
1003506-82 = "[s10] «Конечно. Решать тебе.»\n[s11] «Я буду готов, когда будешь готова ты.»"
1003506-83 = "*вздыхает*"
1003506-84 = "*вздыхает*"
1003506-85 = "Хорошо. Тогда так и сделаем."
1003506-86 = "Ещё раз спасибо, Сенсей."
1003506-88 = "Остаток дня я помогал Уи, пока она не закончила расшифровку."
1003506-89 = "Как только она закончила, сразу уснула. Я накрыл её одеялом,#nа уходя запер за собой дверь и вернулся в Шале."
