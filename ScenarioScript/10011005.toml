[translation]
10011005-1 = "Пролог;Атака ниндзя!"
10011005-5 = "Гостиная Шале"
10011005-8 = "Закончив дела в Шале раньше срока, я решил немного отдохнуть в гостиной."
10011005-9 = ""
10011005-13 = "[ns] «А? Этот свет только что...?»"
10011005-14 = ""
10011005-17 = ""
10011005-22 = ""
10011005-23 = ""
10011005-24 = ""
10011005-25 = "Мы пробрались внутрь без единой заминки. Хе-хе."
10011005-26 = ""
10011005-27 = "М-Мы... Мы правда это сделали! Мы действительно проникли в печально известную Шале..."
10011005-28 = ""
10011005-29 = "Правило ниндзя номер один! Ниндзя должен быть готов взяться за что угодно, в любое время и в любом месте, не колеблясь!"
10011005-30 = "Так мы и захватим Шале!"
10011005-31 = ""
10011005-32 = "О! Да, конечно!"
10011005-33 = ""
10011005-34 = "Ниндзя должен действовать, а не быть робким и нерешительным...!"
10011005-35 = ""
10011005-36 = "Какие мудрые слова, президент! Надо записать в блокнот."
10011005-37 = ""
10011005-38 = "Э-э... Это был комплимент, да...?"
10011005-39 = ""
10011005-40 = "Ладно, пора! Вжух-вжух-вжух! Ниндзя в движении!"
10011005-41 = ""
10011005-42 = "О, э-эм, да! Вжух-вжух-вжух...!"
10011005-43 = ""
10011005-46 = "[ns] «Эй, вы там...»"
10011005-47 = ""
10011005-49 = ""
10011005-50 = ""
10011005-51 = "А?"
10011005-52 = ""
10011005-53 = "А?!"
10011005-54 = "[s] «Вы кто...?»"
10011005-55 = ""
10011005-57 = ""
10011005-58 = "Аргх! Не паникуй! Цукуё! Сколько раз повторять?!"
10011005-59 = "Правило ниндзя номер два!"
10011005-60 = "О! Я-я знаю!"
10011005-61 = "Ниндзя никогда не сдаётся, какие бы трудности ни встретились!"
10011005-62 = "Цукуё! Время нашей особой двойной засады — ты и я! Здесь и сейчас!"
10011005-64 = "Ч-Что? Прямо сейчас?"
10011005-65 = "Да, прямо сейчас!"
10011005-66 = "[s] «Эй, погодите!»"
10011005-67 = ""
10011005-73 = "А? Президент! Свет..."
10011005-74 = "А?!"
10011005-75 = ""
10011005-77 = ""
10011005-78 = "Не бойтесь! Изуна здесь!"
10011005-79 = "Изуна...?"
10011005-80 = "Я примчалась сюда так быстро, как только позволили мои ноги ниндзя, господин!"
10011005-81 = "Г-Господин...?! Неужели я услышала крик о помощи?"
10011005-82 = "Вы в опасности?! Не может быть!"
10011005-83 = "Я, Изуна, защищу своего господина!"
10011005-84 = "Изуна! Стой! Это не по плану!"
10011005-85 = "Хия! Нин-нин!"
10011005-86 = "[s] «Эм, что?!»"
10011005-87 = ""
10011005-89 = ""
10011005-92 = "После примерно десяти минут возни мне наконец удалось выбраться из свалки."
10011005-93 = ""
10011005-96 = "Офис Шале"
10011005-97 = "Почему ты так внезапно выскочила, Изуна?! Это не входило в план!"
10011005-98 = "Н-Н-Но... Президент!"
10011005-99 = "Я услышала отчаянный зов моего господина, и тело само бросилось вперёд!"
10011005-100 = "К-Как у настоящего ниндзя!"
10011005-101 = "Не то чтобы я не понимала твои мотивы, но..."
10011005-102 = "З-Знаешь, как Изуна бросилась сюда без раздумий..."
10011005-103 = "Она выглядела так отважно!"
10011005-104 = "Хе-хе! Благодарю за комплимент, дорогая Цукуё!"
10011005-105 = "Ик! Хе... хе-хе... хе..."
10011005-106 = "[s] «Значит, вы друзья Изуны... Что вы здесь делаете?»"
10011005-107 = "А?"
10011005-108 = "Н-Ну... Эм... Дело в том... П-п-п-понимаете, мы..."
10011005-109 = ""
10011005-111 = ""
10011005-112 = "Г-Господин?! Неужели...! Прошу!"
10011005-113 = "[s] «...Неужели что?»"
10011005-114 = "Неужели вы уже забыли время, проведённое с вашей верной вассалкой?"
10011005-115 = "Неужели травма от их засады лишила вас памяти?!"
10011005-116 = "[s] «Что? Нет. Конечно, я тебя помню, Изуна.»"
10011005-117 = "Я видела такое в одном сериале про ниндзя... Ниндзя самоотверженно бросилась под удар, защищая своего господина..."
10011005-118 = "...но после нападения потеряла память! Этот поворот заставил меня плакать. А теперь в моей истории амнезия у господина!"
10011005-119 = "[s] «Изуна, хватит пока с теорией амнезии...»"
10011005-120 = "Вы правда всё забыли? Даже момент, когда ваша Изуна официально стала вашей вассалкой? Когда вы поддержали мои надежды и мечты?"
10011005-121 = "Злодейскую сагу Датэ Мяуру...? Все её повороты?"
10011005-122 = "Все наши драгоценные воспоминания о том, как мы вместе остановили злого повелителя и спасли мир? Неужели все эти прекрасные времена стёрлись из вашей памяти?"
10011005-123 = "[s] «Я вообще не помню, чтобы мы когда-либо спасали мир!»"
10011005-124 = "Я, Изуна, опустошена этим известием. Но всё будет хорошо, господин!"
10011005-125 = "Даже если вы забыли наши воспоминания, мы просто создадим новые!"
10011005-126 = "С памятью или без неё, я всегда буду вашим верным ниндзя! А вы... вы моим драгоценным господином."
10011005-127 = "[s1] «Спасибо, Изуна, но я имел в виду не это!»\n[s2] «Я просто спросил, кто твои друзья!»"
10011005-130 = ""
10011005-132 = ""
10011005-135 = ""
10011005-136 = "Фу-фу-фу. Значит, вы хотите узнать, кто мы?"
10011005-137 = "Кхм!"
10011005-138 = "Домо! Рада знакомству, достопочтенный Сенсей. Я Мичиру."
10011005-139 = "Э-э! Эм, о-очень приятно...! Я-я Цукуё..."
10011005-140 = "И это я, Изуна, господин!"
10011005-141 = "[s] «Привет всем... Простите, вы сказали „достопочтенный Сенсей“?»"
10011005-142 = "Ба-ха-ха! Зачем ходить вокруг да около? Позвольте представить наш отряд ниндзя!"
10011005-143 = "Изуна! Цукуё!"
10011005-144 = "Да, президент!"
10011005-145 = "Д-Да, п-президент!"
10011005-146 = "Ниндзя, гиперобъединение!"
10011005-147 = "[s] «Ниндзя... что...?»"
10011005-149 = ""
10011005-153 = "Наверняка вы задаётесь вопросом: что такое ниндзя? Что это за ниндзюцу, о котором я говорю?"
10011005-154 = ""
10011005-156 = "Ч-Что же это?"
10011005-157 = ""
10011005-159 = ""
10011005-160 = "Ниндзя всегда учатся, всегда исследуют и всегда стремятся к большему..."
10011005-161 = "Мы, троица из трёх, неустанно трудимся, чтобы распространять всё очарование ниндзя!"
10011005-162 = "Троица из трёх!"
10011005-163 = ""
10011005-165 = ""
10011005-166 = "Когда за дело берёмся мы, даже плачущие младенцы начинают улыбаться!"
10011005-167 = "Главный ниндзя-клуб академии Хяккияко!"
10011005-168 = "[s] «Клуб ниндзя?»"
10011005-172 = "Мы единственные и неповторимые! Исследовательский клуб ниндзюцу!"
10011005-173 = "Да! Единственные и неповторимые. ♪"
10011005-174 = "Е-Единственные и, эм, н-неповторимые..."
10011005-175 = ""
10011005-178 = "А я президент этого самого клуба! Чидори Мичиру!"
10011005-179 = "[s] «Звучит здорово, но что вы все здесь делаете?»"
10011005-180 = "Н-Ну... Эм... Хм... Кхм!"
10011005-181 = "Я понимаю, достопочтенный Сенсей. Когда вы впервые нас увидели, наверняка подумали..."
10011005-182 = "«Ого! Настоящие ниндзя! Троица из трёх крутых и очаровательных ниндзя появилась словно из ниндзюцу!»"
10011005-183 = "[s] «Не совсем мои слова...»"
10011005-184 = "А затем, достопочтенный Сенсей, в вашей голове появилась следующая мысль!"
10011005-185 = "«Да! Я хочу поддержать этих девушек! Надеюсь, однажды они ухватят свои мечты ниндзя обеими руками и заживут той жизнью, которой заслуживают!»"
10011005-186 = "Не переживайте, такие мысли естественны при встрече с ниндзя. Я бы чувствовала то же самое, поэтому кое-что подготовила, чтобы вам помочь!"
10011005-187 = ""
10011005-189 = ""
10011005-190 = ""
10011005-191 = "[ns] «Официальная рекомендация для аккредитации клуба?»"
10011005-192 = "Да-да! Просто подпишите здесь, пожалуйста?"
10011005-193 = "[s3] «Вы пришли ради официальной аккредитации клуба?»\n[s4] «То есть Исследовательский клуб ниндзюцу неофициальный?»"
10011005-196 = "Так это всё время был ваш план, Президент?! Я и не знала!"
10011005-197 = "Я тоже... Я думала, мы просто пришли поздороваться с Сенсеем..."
10011005-198 = "Н-Ну... Это тоже, наверное?"
10011005-199 = "...В любом случае. Ваша слава идёт впереди вас, достопочтенный Сенсей! По всей земле ходят рассказы о ваших достижениях и способности решать любую проблему, что встречается на пути!"
10011005-200 = "Так что помочь нам стать официальным клубом для вас — раз плюнуть!"
10011005-201 = "[s] «Прости. Не получится.»"
10011005-202 = "Что?!"
10011005-203 = "С-Сенсей?"
10011005-204 = "ГОСПОДИН?!"
10011005-205 = "Что вы такое говорите?! Достопочтенный Сенсей... прошу... Только не говорите..."
10011005-206 = "Только не говорите, что даже вы не верите в путь ниндзя и считаете, что «клуб изучения ниндзя — полная шутка!»"
10011005-207 = "[s] «Чтобы стать официальным клубом, нужно пройти установленную процедуру, верно?»"
10011005-208 = "Это...?! Ну... Технически да. Но дело в том..."
10011005-209 = "Эта бессердечная Кахо вообще не хочет нас слушать!"
10011005-210 = "Она ужасная формалистка без причины! Слишком строгая!"
10011005-211 = "...?"
10011005-212 = "На Кахо это как-то не похоже..."
10011005-213 = "Кхм! В любом случае! Достопочтенный Сенсей, пожалуйста, выслушайте нашу просьбу."
10011005-214 = "[s] «Мой ответ не изменился.»"
10011005-215 = ""
10011005-218 = ""
10011005-219 = "[ns] «О... Ещё один гость?»"
10011005-221 = ""
10011005-226 = ""
10011005-227 = "Рада знакомству, Сенсей. Я Куваками Кахо, вице-президент клуба Инь-Ян."
10011005-228 = "Я пришла от имени клуба Инь-Ян с официальной просьбой к Шале."
10011005-229 = "Пожалуйста, уделите мне немного времени."
10011005-230 = "Ого! Лёгок на помине!"
10011005-231 = "Неужели вы...?"
10011005-232 = "[s] «Эм, официальная просьба от клуба Инь-Ян?»"
