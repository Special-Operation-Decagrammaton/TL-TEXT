[translation]
42050-1 = "Эпизод 5;Тень FOX"
42050-2 = ""
42050-3 = "Какого чёрта происходит? Пусть кто-нибудь уже объяснит."
42050-4 = "Я следила за камерами наблюдения, когда на меня напали! Кто-то натянул на голову мешок и притащил сюда."
42050-6 = "М-М-Меня тоже...! Я была на позиции, а кто-то подошёл совсем бесшумно и..."
42050-7 = "З-Завязал мне глаза... Потом меня крутили и крутили в огромной бочке..."
42050-8 = "Ух... Сейчас стошнит..."
42050-9 = "Почему ты тоже бездельничаешь вместе с нами, Саки? Я думала, вы с Мияко уже проникли в здание."
42050-10 = "Проникли, но потом... Ух. Не помню."
42050-11 = "Я пошла в центральный проход, чтобы обойти баррикаду, но попала в засаду и отключилась..."
42050-12 = "Что было дальше, не помню. Только как проснулась здесь."
42050-13 = "Ну, мы не знаем, где находимся и кто нас сюда притащил, но одно я знаю точно!"
42050-14 = "...Мы позволили себя похитить, да?"
42050-15 = "Не заставляй меня это говорить... Уф. Мы просто расслабились."
42050-16 = "Я-я только что кое-что поняла... Эти подозреваемые торговцы оружием, д-да? Они ведь занимаются кучей незаконных сделок?"
42050-17 = "Такие суперплохие ребята обычно... у-убивают, да? Если мы ещё живы, значит, наверное... наверное... Они нас кому-нибудь ПРОДАДУТ!!!"
42050-18 = "Продадут в какую-нибудь лабораторию, где будут испытывать на нас оружие и пытать... И-Или... вдруг заставят надеть кошачий костюм и мяукать?! Это ещё хуже!"
42050-20 = "...Даже не хочу знать, откуда взялся последний страх."
42050-21 = "Всё нормально, Мию. Смотри, Мияко с нами нет — значит, её ещё не поймали."
42050-22 = "Сиди спокойно и думай, как мы этим ребятам отомстим после того, как она нас спасёт."
42050-23 = ""
42050-25 = ""
42050-26 = "Все целы? Никто не ранен?"
42050-27 = "Мияко!"
42050-28 = "Мияко! Как раз вовремя! Видите, я же говорила, что она придёт нас спасать!"
42050-29 = "О... Насчёт этого..."
42050-31 = "В нынешней ситуации я скорее пленница, чем спасительница."
42050-32 = "Это последняя... Дисквалификация."
42050-33 = ""
42050-35 = ""
42050-36 = ""
42050-37 = "Если бы это был экзамен SRT по CQB, каждая из вас была бы дисквалифицирована."
42050-39 = "Это снаряжение... Вы..."
42050-40 = "Разве вы не отряд FOX?! Я вообще не понимаю, что происходит..."
42050-41 = "Что? Не любите вечеринки? Мы решили устроить маленький сюрприз-приветствие для наших преемниц."
42050-42 = "Ну же... Я думала, после недавних приключений в Кивотосе вы немного повзрослели, но, похоже, всё те же."
42050-43 = "Вы что, думали, идёте на чаепитие? Я глазам не поверила, когда вы просто ворвались в неизвестное здание без поддержки и разведки."
42050-45 = "Ой. Ха-ха. Не будь так строга, Куруми."
42050-46 = "Студенты на экзамене CQB хотя бы знают, что сдают экзамен. Откуда им было предугадать нас? Против обычных торговцев оружием, как они думали, их план был бы идеальным."
42050-47 = "...Когда на поле боя внезапно появляется враг, в следующий раз попросим его вежливо уйти? Вы были не готовы."
42050-48 = "Простите..."
42050-50 = "В любом случае! Наверняка после такого вы проголодались. Я приготовила для всех кучу инаризуси!"
42050-51 = "Об операциях и готовности поговорим после того, как все насытятся."
42050-52 = "Знаю, у вас в голове миллион вопросов, и поверьте — у нас самих лёгкие полны вещей, которые хочется сказать. Но сначала поедим вместе."
42050-53 = "Хорошо..."
42050-55 = "Ням-ням. Я бы тоже медленно реагировала, если бы в разгар операции переживала о стольких вещах, как ты."
42050-56 = "Представь: узкий коридор, как у Мияко, основным оружием неудобно маневрировать. С другого направления приближается враг. Что делаешь?"
42050-57 = "Эм, по идее нужно переключиться на пистолет и выстрелить..."
42050-58 = "По руководству — верно. Но нужно оценивать ситуацию перед собой. Она всегда разная. Здесь лучше со всей силы ударить противника прикладом."
42050-59 = "В тесном помещении побеждает самый быстрый. В засаде оказалась ты, значит, враг не ожидает такой лобовой атаки. И всё меняется в зависимости от брони противника, дистанции, силы..."
42050-61 = "Уф. Реальные ситуации так отличаются от учебников..."
42050-62 = "Думала, пары миссий хватит, чтобы стать ветераном? Тебе ещё многому учиться. Хи-хи."
42050-63 = ""
42050-65 = ""
42050-66 = "Мм. Это икра лосося? На удивление хорошо подходит к инаризуси."
42050-67 = "Эй! Я это для себя берегла. Руки прочь!"
42050-68 = "Успокойся, это просто инаризуси. Правда хочешь позориться перед младшими?"
42050-69 = "Вот, возьми лучше с яичным соборо."
42050-70 = "Нет, спасибо. Останусь с икрой."
42050-72 = "Хи-хи. Я принесла достаточно каждого вида, так что ссориться не нужно."
42050-73 = ""
42050-75 = ""
42050-76 = "Мию, держи. Не стесняйся, ешь."
42050-77 = "П-Правда...? Даже мне можно?"
42050-78 = "Конечно! Более того, думаю, вот на этом прямо твоё имя написано."
42050-79 = "С-Спасибо..."
42050-80 = ""
42050-82 = ""
42050-83 = "Так вкусно!"
42050-85 = "Ах! Такое чувство, будто я вечность не ела готовку Нико."
42050-86 = "Нигде в Кивотосе не найдёшь инаризуси с таким количеством начинок."
42050-87 = "Хи-хи. Теперь я внезапно рада, что встала так рано."
42050-88 = "Мои инаризуси всегда узнаете среди любых других благодаря секретному маринаду!"
42050-89 = "(Хм. Почему мне кажется, что я недавно уже ела такие инаризуси... Или показалось?)"
42050-90 = ""
42050-92 = ""
42050-93 = ""
42050-94 = "Эм... Если можно спросить... Как вы м-меня нашли?"
42050-95 = "Я-я думала, нашла очень хорошее место... поэтому немного удивилась..."
42050-97 = "Мию, да? Звёздный студент, идеально сдавшая тренировку по маскировке!"
42050-98 = "И-Ик..."
42050-99 = "Вообще-то ты очень хорошо справилась. Мы бы не заметили, если бы Нико тебя не указала. Молодец."
42050-101 = "С-Спасибо... П-Почему вы всё ближе... и ближе..."
42050-102 = "Ты была так хорошо спрятана. Как ты это делаешь? Есть специальное маскировочное снаряжение? Какой зум на прицеле?"
42050-103 = "У-Уа-а-а-а!"
42050-106 = "В любом случае, если оружие покупали наши старшие из FOX, наверное, переживать не о чем."
42050-107 = "Если всё шло через них, деньги наверняка тоже чистые."
42050-108 = ""
42050-110 = ""
42050-111 = "..."
42050-112 = "Вообще-то я хочу задать вопрос."
42050-113 = "Конечно, задавай."
42050-114 = "Что вы забрали из подвала Шале во время переворота?"
42050-115 = "О-О... Ну... Это..."
42050-116 = "Но важнее другое. Я давно хотела спросить. Когда решили закрыть SRT, вы исчезли без единого слова. А потом внезапно штурмовали здание Генерального студенческого совета... Почему?"
42050-117 = "Ах..."
42050-118 = ""
42050-120 = ""
42050-122 = "Пока не могу поделиться этой информацией."
42050-123 = "Секретно...?"
42050-124 = "Нет."
42050-125 = "Дело не в этом. Нам нужно было понять, можете ли вы стать надёжными союзницами."
42050-126 = "Постойте. Разве мы не одна команда? SRT?"
42050-127 = "Ч-Что мы сделали не так...?"
42050-128 = "Тогда я задам вопрос."
42050-129 = "Если мы прикажем, сможете ли вы выступить против Сенсея на поле боя? Прямо сейчас?"
42050-130 = ""
42050-131 = "..."
42050-132 = ""
42050-134 = ""
42050-135 = "Видишь? Вы ещё не готовы принять решение."
42050-137 = "У оружия одна задача, и если оно не способно её выполнять — оно бесполезно."
42050-139 = "Спасибо за работу на этой миссии, командир отряда Цукиюки."
42050-140 = "С сегодняшнего дня отряд RABBIT расформирован. Вы все переходите в отряд FOX."
42050-141 = "Р-Расформирован? Н-Наш отряд?"
42050-142 = "Не пойми неправильно."
42050-143 = "Я не наказываю тебя за неудовлетворительное выполнение. Я ценю твоё лидерство."
42050-144 = "Мы лишь снимаем с вас бремя, которое вам никогда не следовало нести."
42050-145 = "Пусть дальше тяжёлую работу возьмём на себя мы."
42050-146 = "Но мы хотим помочь восстановить академию SRT... Мы никогда не сдавались..."
42050-147 = "Да. Вы все много работали. Это, вместе с условиями жизни, похоже, сильно измотало ваш отряд."
42050-148 = "..."
42050-149 = "Больше нет необходимости нести ответственность за возрождение академии SRT."
42050-150 = "Эта ответственность всегда была нашей. Ваша задача всегда заключалась в том, чтобы быть оружием в нашем наборе инструментов."
42050-151 = "Мы не этого... Мы... Отряд RABBIT—"
42050-152 = "Командир Цукиюки, ты должна решить."
42050-153 = "Станешь ли ты и дальше острым клинком и исполнишь долг?"
42050-154 = "Или дрогнешь и будешь сражаться за справедливость ржавым лезвием?"
42050-155 = "Мы..."
42050-157 = "[ns] «Погодите!»"
42050-158 = "У нас гости."
42050-159 = "Кто? Как они нас нашли?"
42050-160 = ""
42050-162 = ""
42050-163 = "...Сенсей [USERNAME]?"
42050-164 = "[s1] «Вы отряд FOX, верно? Приятно познакомиться.»\n[s2] «Привет, отряд FOX. Мне очень понравились ваши инаризуси в прошлый раз.»"
42050-165 = "Сенсей [USERNAME]? Вы следили за нами от самого парка?"
42050-166 = "..."
42050-167 = "Сенсей [USERNAME]? Вы следили за нами от самого парка?"
42050-168 = "Я не заметила, ч-что за нами следят..."
42050-169 = "[s3] «Вы так подозрительно ушли из парка, что я решил вас найти.»\n[s4] «Вы странно себя вели, поэтому я расспросил людей и отследил вас.»"
42050-172 = ""
42050-174 = ""
42050-176 = ""
42050-177 = "Полагаю, это наша первая встреча, Сенсей [USERNAME]."
42050-178 = "Я давно хотела поблагодарить вас за работу по устранению последствий внезапного исчезновения председателя студсовета."
42050-179 = "От имени академии SRT выражаю благодарность."
42050-180 = "[s] «Просто делаю свою работу.»"
42050-181 = "Но то, что я сейчас обсуждаю с командиром Цукиюки, — внутреннее дело академии SRT."
42050-182 = "Поэтому будем признательны, если оставите это нам."
42050-183 = "Я слышала, вы не из тех, кто подрывает решения или полномочия студентов."
42050-184 = "[s] «Считайте, что ваши полномочия я как раз не подрываю.»"
42050-186 = "[ns5] «Но моим студентам нужно время всё осмыслить.»\n[ns6] «Но думаю, Мияко сейчас нужно немного пространства.»"
42050-187 = ""
42050-188 = ""
42050-189 = "Поняла."
42050-190 = "Похоже, вы из тех взрослых, которым студенты естественно доверяют и за которыми идут."
42050-191 = ""
42050-193 = ""
42050-194 = ""
42050-195 = "Такие, как вы, обычно раздражают сильнее всего..."
42050-196 = "[s] «Ха-ха. Рад, что ситуация не убила в тебе характер.»"
42050-197 = "...Этот бой подождёт до дня «Д». Всё равно осталось недолго."
42050-198 = "Отряд FOX, отбой. Возвращаемся в штаб к следующей миссии."
