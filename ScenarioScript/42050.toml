[translation]
42050-1 = "Episódio 5;A Sombra das Veteranas"
42050-3 = "...Ei, o que é que está acontecendo aqui?"
42050-4 = "Eu estava checando as câmeras de segurança no node aqui perto#nquando jogaram um saco de papel na minha cabeça por trás..."
42050-6 = "E-Eu também... eu estava escondida quando me atacaram por trás..."
42050-7 = "Me jogaram vendada num lugar que eu nem sabia qual era... e eu fiquei rolando sem parar..."
42050-8 = "Uuuh... ainda estou enjoada..."
42050-9 = "E por que a Saki também tá aqui toda amarradinha com a gente?#nVocê não tinha entrado junto com a Miyako?"
42050-10 = "Pois é... nem eu entendi direito."
42050-11 = "Na hora que invadi o corredor central, levei uma pancada forte na cabeça..."
42050-12 = "Quando dei por mim, já estava assim."
42050-13 = "Ou seja... a gente foi sequestrada?"
42050-14 = "Não faço a menor ideia do que tá rolando, mas..."
42050-15 = "Tsc... Baixei demais a guarda."
42050-16 = "Ei... os caras que a gente emboscou eram traficantes de armas ilegais, né...?"
42050-17 = "Então será que eles deixaram a gente viva assim pra vender a gente em algum lugar...?"
42050-18 = "Tipo mandar a gente pra um laboratório pra testar armas novas...#nou botar roupas cheias de babados e fazer todo tipo de coisa com a gente..."
42050-20 = "...A última parte acho que não, né?"
42050-21 = "Não se preocupem. A Miyako ainda está lá fora."
42050-22 = "Com certeza a Miyako vai vir nos resgatar—"
42050-26 = "Pessoal, vocês estão bem?!"
42050-27 = "Miyako...!"
42050-28 = "Miyako-chan, você veio nos salvar...!"
42050-29 = "Ah... bem... é que, na verdade..."
42050-31 = "...Eu também acabei sendo capturada."
42050-32 = "Essa é a quarta... Todas desclassificadas."
42050-37 = "Se fosse o exame de CQB da SRT, teriam reprovado."
42050-39 = "E-Esse equipamento... não pode ser..."
42050-40 = "As veteranas do Esquadrão FOX...?#nP-Por que estão aqui...?"
42050-41 = "Bom, resumindo — foi uma pegadinha que preparamos pras nossas calouras."
42050-42 = "Ouvi dizer que vocês andavam se destacando por toda Kivotos,#nentão achei que tinham evoluído um pouco... mas parece que me enganei."
42050-43 = "Invadir um lugar desconhecido sem cobertura...#né praticamente dizer \"podem atirar em mim\". Acham que vieram fazer um piquenique?"
42050-45 = "Calma, calma, Kurumi-chan. Já acabou, pode parar por aí."
42050-46 = "Acho que elas também não esperavam uma situação dessas.#nAlém disso, contra mercenários comuns ou traficantes de armas, aquela tática já seria suficiente."
42050-47 = "...Ingênuo demais. O inimigo nem sempre aparece do jeito que você prevê."
42050-48 = "...Desculpe."
42050-50 = "B-Bom, que tal fazermos um lanchinho primeiro?!#nEu trouxe um monte de inarizushi que eu mesma fiz!"
42050-51 = "Vamos conversar enquanto comemos, tá bom?"
42050-52 = "Afinal... acho que temos muita coisa acumulada pra conversar."
42050-53 = "...Sim."
42050-55 = "Francamente! Você se preocupa demais com detalhes bobos.#nÉ por isso que a sua reação fica lenta."
42050-56 = "O que você faz se o inimigo aparecer de outra direção num lugar apertado onde é difícil manobrar a arma, como agora há pouco?"
42050-57 = "...Trocar pra arma secundária e atirar?"
42050-58 = "No manual, sim.#nMas em combate real, a resposta certa é \"dar uma coronhada direta\"."
42050-59 = "Usar a coronha é mais rápido pra acertar o inimigo do que trocar de arma.#nBom, a resposta certa varia conforme a distância e a blindagem do alvo, mas..."
42050-61 = "Urgh... Eu não me dou bem com situações de combate que fogem do manual..."
42050-62 = "Não se vira veterana assim tão fácil.#nTrate de se esforçar mais."
42050-66 = "Hmm, essa textura é... ovas de salmão?#nAté que combina bastante com inarizushi, né?"
42050-67 = "Ei, não pega isso! Eu tava guardando pra comer depois!"
42050-68 = "Ahaha, foi mal, foi mal.#nNão fica toda estressada na frente das calouras."
42050-69 = "Toma, eu te dou um com ovo."
42050-70 = "Não quero de ovo! Eu quero o de ovas de salmão!"
42050-72 = "Ei, ei, nada de brigar.#nAinda tem um monte de inarizushi sobrando."
42050-76 = "Aqui, Miyu-chan, pode comer sem cerimônia, tá?"
42050-77 = "A-Ah, ai... será que alguém como eu merece comer um inarizushi tão caprichado assim...?"
42050-78 = "Mas é claro. Eu fiz pensando em comer todo mundo junto."
42050-79 = "M-Muito obrigada..."
42050-83 = "...Q-Que delícia!"
42050-85 = "Aah~ Fazia quanto tempo que eu não comia o inarizushi da Niko-senpai?"
42050-86 = "Não se acha em lugar nenhum um inarizushi tão recheado de temperos diferentes assim."
42050-87 = "Hehe, obrigada. Assim até vale a pena ter acordado cedo pra preparar."
42050-88 = "Principalmente o caldo do tofu frito, que é receita minha.#nAcho difícil encontrar igual por aí."
42050-89 = "(...Pensando bem, parece que comi um inarizushi parecido com esse esses dias...#nSerá que é impressão minha...?)"
42050-94 = "Com licença... posso perguntar uma coisa?#nComo vocês conseguiram descobrir onde eu estava?"
42050-95 = "Não querendo me gabar, mas... eu achei que tinha me escondido bem direitinho..."
42050-97 = "Ah, por acaso você é a Miyu?#nAquela dos boatos que tirou nota máxima no treino de camuflagem!"
42050-98 = "I-Iih...?!"
42050-99 = "Sério, foi uma camuflagem perfeita!#nEu não tinha nem ideia de onde você tava até a Niko me passar as coordenadas!"
42050-101 = "O-Obrigada... v-você tá muito perto..."
42050-102 = "Você usa algum equipamento especial de camuflagem?#nTambém tô curiosa sobre o zoom da sua luneta!"
42050-103 = "U-Uuuh..."
42050-106 = "D-De qualquer forma, que alívio saber que quem comprou as armas foram as veteranas do Esquadrão FOX.#nAssim as armas da SRT não vão ser usadas pra nada de ruim."
42050-107 = "É verdade. E se foi dinheiro pago pelas veteranas, também não precisamos nos preocupar com a origem."
42050-111 = "..."
42050-112 = "Com licença, veteranas. Posso fazer uma pergunta?"
42050-113 = "Sim, claro. Pode perguntar o que quiser."
42050-114 = "...Naquele incidente, o que foi que vocês levaram da Schale?"
42050-115 = "Bem... sobre isso..."
42050-116 = "E mais — quando decidiram fechar a SRT, por que vocês atacaram o prédio do Conselho Estudantil Geral?"
42050-117 = "Isso é..."
42050-122 = "Ainda não podemos contar a vocês."
42050-123 = "...É confidencial?"
42050-124 = "Não."
42050-125 = "É porque, por enquanto, vocês ainda não estão do \"nosso\" lado."
42050-126 = "Espera aí.#nNós não somos todas integrantes da SRT...?"
42050-127 = "P-Por que você diz isso...?"
42050-128 = "...Deixe-me fazer uma pergunta."
42050-129 = "Se recebessem uma missão para enfrentar o Sensei da Schale, o que fariam?"
42050-131 = "..."
42050-135 = "Pois é. Vocês não conseguem decidir."
42050-137 = "Uma arma — só tem valor justamente porque não toma decisões por conta própria."
42050-139 = "Meus cumprimentos pela execução de uma operação tão árdua, Comandante de Esquadrão Tsukiyuki."
42050-140 = "— A partir de hoje, o Esquadrão RABBIT está dissolvido.#nCada integrante passará a atuar como destacamento subordinado ao Esquadrão FOX."
42050-141 = "Dissolvido...? O Esquadrão RABBIT...?"
42050-142 = "Não me entenda mal."
42050-143 = "Não temos intenção de prejudicá-las.#nRespeitaremos a autoridade discricionária da Comandante Tsukiyuki."
42050-144 = "Afinal, trata-se apenas de retomarmos a responsabilidade que um imprevisto acabou jogando sobre os ombros das nossas calouras."
42050-145 = "De agora em diante, deixem todas as escolhas difíceis conosco."
42050-146 = "Mas... se for para reerguer a Academia Especial SRT, nós também estamos determinadas a—"
42050-147 = "Vocês não estão todas exaustas depois de tanto tempo acampando?"
42050-148 = "..."
42050-149 = "Não há mais necessidade de carregarem a responsabilidade pela reconstrução da Academia Especial SRT."
42050-150 = "Deixem o resto conosco e cumpram seu dever como armas."
42050-151 = "...Nós, do Esquadrão RABBIT..."
42050-152 = "...Vamos, Comandante Tsukiyuki — decida-se."
42050-153 = "Você não esqueceu o seu dever como arma, esqueceu?"
42050-154 = "Não há nada mais patético do que brandir a justiça com uma faca enferrujada, cheia de hesitação."
42050-155 = "N-Nós..."
42050-157 = "[ns] \"...Esperem um pouco!\""
42050-158 = "Ué, um invasor?"
42050-159 = "Como é que chegou aqui...?!"
42050-163 = "...Sensei [USERNAME]?"
42050-164 = "[s1] \"Olá, pessoal do Esquadrão FOX.\"\n[s2] \"Aquele inarizushi da outra vez estava uma delícia.\""
42050-165 = "...Sensei [USERNAME]? O que está fazendo aqui?"
42050-166 = "..."
42050-167 = "...Sensei [USERNAME]? O que está fazendo aqui?"
42050-168 = "N-Não me diga que nos seguiu até aqui...?"
42050-169 = "[s3] \"Vocês sumiram de repente...\"\n[s4] \"Fui perguntando pela cidade até achar vocês.\""
42050-177 = "...É um prazer finalmente conhecê-lo, Sensei [USERNAME]."
42050-178 = "Já ouvi falar muito a seu respeito. Soube que conseguiu colocar ordem em Kivotos quando o caos se instalou na ausência da Presidente do Conselho Estudantil Geral."
42050-179 = "...Em nome da Academia Especial SRT, expresso minha mais profunda gratidão."
42050-180 = "[s] \"De nada.\""
42050-181 = "No entanto, o assunto que estou tratando com a Comandante Tsukiyuki diz respeito apenas à Academia Especial SRT."
42050-182 = "Portanto, peço gentilmente que deixe o restante conosco."
42050-183 = "Afinal, ouvi dizer que o Sensei... é um adulto que respeita a vontade das alunas."
42050-184 = "[s] \"Com certeza.\""
42050-186 = "[ns5] \"Mas foi tudo tão repentino que elas parecem confusas.\"\n[ns6] \"Será que você não pode dar um pouco mais de tempo pra Miyako pensar?\""
42050-189 = "...Compreendido."
42050-190 = "Como esperado do Sensei da Schale.#nPalavras dignas de alguém que conquista a confiança de todas as alunas."
42050-195 = "Nós... adultos como você — nós detestamos."
42050-196 = "[s] \"...Entendo.\""
42050-197 = "...Com o Dia D tão próximo, não há necessidade de entrar em conflito com o Sensei agora."
42050-198 = "— Esquadrão FOX, recuar.#nCada integrante deve retornar ao QG e se preparar para a próxima operação."
42050-206 = "...Comandante Tsukiyuki.#nAcabo de enviar um conjunto de coordenadas para o seu celular."
42050-207 = "Se decidir aceitar a minha proposta, vá até aquele local."
42050-208 = "Eu..."
42050-209 = "...Um dia, vocês também vão entender."
42050-210 = "..."
42050-214 = "Próximo;A Angústia das Calouras"
