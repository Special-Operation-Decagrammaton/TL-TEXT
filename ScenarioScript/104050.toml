[translation]
104050-1 = "Эпизод 5; Удобный выбор"
104050-2 = "Я отключила Ковчег. По крайней мере какое-то время он не сможет взламывать Утнапиштим."
104050-3 = "Системы Утнапиштима начинают восстанавливаться!"
104050-4 = "Тогда, Химари, дальше всё на тебе!"
104050-5 = ""
104050-7 = ""
104050-8 = "Я сейчас сброшу барьер. Скоро верну контроль над Утнапиштимом!"
104050-9 = "Нужно как можно скорее вернуть контроль над захваченным вычислительным устройством Ковчега! Рио! Прикажи Токи отступить!"
104050-10 = "...Токи! Мы сможем уничтожить Санктум со своей стороны!"
104050-11 = ""
104050-15 = "Да, я справлюсь. Так что, пожалуйста, уходи оттуда!"
104050-16 = "Не беспокойся! Пока отступи!"
104050-19 = ""
104050-20 = ""
104050-21 = ""
104050-22 = "Простите... Рио... Это уже второй приказ... которому мне придётся сегодня не подчиниться."
104050-23 = ""
104050-26 = "Токи?!"
104050-27 = "Похоже, я больше не могу двигаться... Но я должна его остановить..."
104050-28 = "Токи, п-подожди. Я запросила поддержку, так что..."
104050-29 = "Нет, я знаю, что помощь невозможна..."
104050-30 = ""
104050-32 = ""
104050-33 = "Я слишком далеко, подкрепление не успеет..."
104050-34 = ""
104050-36 = ""
104050-37 = ""
104050-38 = ""
104050-39 = "...Прости, Рио."
104050-41 = "?!"
104050-42 = "Пусть это длилось недолго, для меня было честью работать с вами, президент Химари."
104050-43 = "Э-Это..."
104050-44 = "Знаю, уже поздно признаваться, но я..."
104050-45 = "...хотела сражаться на одной стороне с Шале..."
104050-46 = "И... со старшими из C&C..."
104050-49 = "...Рио. Пожалуйста, скажи мне, как активировать самоуничтожение Abi-Eshuh."
104050-50 = "А?!"
104050-51 = "Я знала, что ты предусмотрела что-то подобное... на случай, если я тебя предам."
104050-52 = ""
104050-54 = ""
104050-55 = "Я смогу уничтожить этот Санктум энергией оружия."
104050-56 = "...Нет, Токи. Такой функции нет. Зачем мне было делать с тобой подобное...?"
104050-59 = "Ты говорила о проблеме вагонетки... Моя жизнь и уничтожение Кивотоса... Разве не очевидно, что выбрать?"
104050-60 = "Ты сказала, что кто-то должен потянуть рычаг..."
104050-61 = "Нет, Токи. Это..."
104050-62 = "Я поняла: сама постановка этой задачи была неверной."
104050-63 = "...Что?"
104050-64 = "Есть ещё один вариант. Оглядеться и найти того, кто поможет спасти всех."
104050-65 = "..."
104050-67 = "Это был бы удобный выбор, но..."
104050-69 = "Это..."
104050-70 = ""
104050-73 = "Цель подтверждена."
104050-74 = ""
104050-78 = "...?!"
104050-79 = "Что происходит...?"
104050-80 = ""
104050-84 = ""
104050-90 = "В-Вы все...?"
104050-91 = "Привет, Токи! Мы пришли помочь!"
104050-92 = "C&C, прибыли. Едва успели."
104050-93 = "Мы на месте. Хорошо, что вовремя."
104050-94 = ""
104050-97 = "Эй, Токи."
104050-100 = "Не стоит отбирать славу у своих старших!"
104050-101 = "К-Как вы..."
104050-103 = "*вздох* Мы все целы."
104050-104 = "Н-Ноа...? К-Как...?"
104050-105 = "Как ты могла знать...? Для этого пришлось бы видеть будущее..."
104050-106 = "Вам интересно, как они добрались сюда так быстро, президент? Ещё до начала всей этой ситуации они уже летели сюда на самом быстром вертолёте Миллениума."
104050-107 = "Как это возможно?"
104050-109 = "Вообще-то, это была моя просьба."
104050-110 = "...!"
104050-111 = "У меня больше нет дара пророчества, но кое-какие ощущения сохранились."
104050-112 = "У меня было дурное предчувствие, и теперь я понимаю, что оно предупреждало о Ложном Санктуме, появившемся здесь."
104050-113 = "Это была лишь догадка, но, к счастью, Ноа из Семинар поверила мне."
104050-114 = "Хи-хи. Вовсе нет. Все стараются изо всех сил. Это меньшее, что я могла сделать."
104050-115 = "У меня есть младшая с очень хорошей интуицией, которой я доверяю, поэтому я решила, что здесь может быть нечто похожее."
104050-117 = "Что ж, C&C, не будете ли вы так любезны безопасно доставить Токи домой?"
104050-118 = ""
104050-120 = ""
104050-121 = "..."
104050-122 = "Вот как всё и произошло, президент Рио."
104050-123 = "Иногда приятно иметь удобные варианты выбора, особенно тем, кто уже пострадал от попыток заглянуть в будущее."
104050-124 = "..."
104050-125 = ""
104050-127 = ""
104050-129 = "Что ж, подробности обсудим позже. А сейчас пора зачистить остатки."
104050-130 = "Тут осталось кое-что, что нужно убрать."
104050-131 = "Мне подходит. Сделаем это красиво."
104050-133 = "Наш выход!"
104050-135 = ""
104050-136 = "Придите в себя, президент!"
104050-137 = ""
104050-139 = ""
104050-140 = "Поблагодарите меня, когда вернёмся в академию! Сейчас никто из нас не может позволить себе расслабиться!"
104050-141 = "Прости, Юука. Ты права."
104050-142 = "Серьёзно, я никогда раньше не видела президента такой. Или в глубине души она всегда была такой?"
104050-143 = ""
104050-145 = ""
104050-146 = "Разве ты не знаешь? Старшая сестра снаружи строит из себя высокомерную и величественную, а внутри она просто выгребная яма."
104050-147 = ""
104050-149 = ""
104050-150 = "Это... вообще ничего мне не прояснило."
104050-151 = ""
104050-153 = ""
104050-155 = ""
104050-156 = "Хорошо, я вернула контроль над кораблём. Используя вычислительное устройство Утнапиштима, я снова запущу последовательность самоуничтожения Ковчега Атрахасис. Все приготовьтесь."
104050-157 = "Но разве это не значит...?"
104050-158 = "Да. Корабль придётся оставить здесь, и он взорвётся вместе с Ковчегом."
104050-159 = "И что, нам предлагается взорваться вместе с ним?"
104050-160 = "...Я эвакуирую остальных обратно на землю с помощью подготовленной мной последовательности эвакуации."
104050-162 = "Следующий эпизод; При прочих равных"
