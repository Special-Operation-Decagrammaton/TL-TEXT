[translation]
70016010-1 = "The Road to the Dragon Palace (1)"
70016010-4 = "We have received new information regarding the breakout that occured today at#nValkyrie's Correction Bureau."
70016010-5 = "The number of escapees is seven. #nIt is purported that they took advantage of the disorder caused by the General#nStudent Council President's disappearance to conduct their prison break."
70016010-6 = "The nearby area is currently under maximum alert by Valkyrie Police Academy."
70016010-10 = "No matter the channel, everyone is talking about the prison break."
70016010-11 = "I had hoped to tune in to a classical music show on this occasion, but it would#nseem reality has chosen otherwise."
70016010-16 = "...Just in, Valky... Corre... Bureau has just... an emergency statement..."
70016010-17 = "Oh, it would seem we are finally out of signal range. #nIn that case, I believe time has come for us to part ways."
70016010-25 = "Phew... I can finally breathe."
70016010-26 = "I had worried that there would be too much oxygen and it would turn into#na cardio workout, but... As expected, the air on the outside truly is excellent."
70016010-27 = "What do you plan to do from here?"
70016010-28 = "Let's see... For starters, I think I'll catch up some old friends of mine."
70016010-29 = "My muscles have gone soft after sitting behind bars for so long, #nso I'd like to do a few lat pulldowns with the Helmet Gang."
70016010-30 = "My, my. That seems like it would make for a pleasant trip."
70016010-35 = "At times like this, one would normally express their thanks. However..."
70016010-36 = "There's no need to do something unbecoming of yourself. #nBesides, I do not demand for you to be \"normal.\""
70016010-37 = "Kuku... It's good that you're quick to catch on."
70016010-38 = "So? What are you planning to do going forward?"
70016010-39 = "...Off the top of my head, I have a few ideas in mind."
70016010-40 = "However, I think I will go return an old favor of mine first.#nThat's only natural, wouldn't you agree?"
70016010-41 = "...You only speak of the natural ways of the world when it applies it to others."
70016010-42 = "I can surmise who it is you speak of in this situation. Though..."
70016010-43 = "Nevermind, anymore than this would be unnecessary meddling."
70016010-44 = "Perceptive, aren't you?"
70016010-45 = "Of course. In any case, I shall wish you success in your repayment."
70016010-49 = "Now then..."
70016010-53 = "Hum, do you not intend to alight?"
70016010-54 = "I would suggest you leave as soon as possible. It won't be long before the#nexplosives I planted detonate."
70016010-58 = "Where is this...? Could you not have put me somewhere closer to the sea#nat least...?"
70016010-59 = "I am a consultant. #nWhile there are times where I will lend a hand, I am no chauffeur."
70016010-60 = "Besides, this vehicle is being tracked. It would be dangerous to continue driving it."
70016010-61 = "Th-then what am I to do!? I have no idea where we are, nor do I have any coin..."
70016010-62 = "The oceans of Kivotos tremble in fear of you, the Sea Dragon. Do they not? #nI expect you to be able to handle something of this caliber."
70016010-63 = "I'm operating on a schedule precise to the second. #nAs such, I cannot spare you anymore time. I bid you a good day."
70016010-64 = "Urgh..."
70016010-70 = "One more addendum. Surely, you have seen yourself in a mirror at the Correction Bureau."
70016010-71 = "You have a very striking appearance. #nAt present, Valkyrie is frantically scouring the surrounding for us, #nso you would be well-advised to keep your identity hidden."
70016010-72 = "Finally, do not come searching for me. #nIf I ever need you to return this debt, I shall be the one to seek you out."
70016010-78 = "..."
70016010-82 = "Where's... the sea...?"
70016010-92 = "...Are they gone?"
70016010-93 = "I need to find a port... But it's far too bright here, and I cannot see the stars..."
70016010-94 = "I can't read the winds either... The buildings are in the way..."
70016010-95 = "...I really do hate the land. Where...? Just where is the sea!?"
70016010-96 = "The sea awaits my return! I have not the time to be tarrying about this—!"
70016010-102 = "Right away! Tonkatsu ramen with extra garlic!"
70016010-106 = "(Ugh...)"
70016010-107 = "(The nerve of these landlubbers' foods, smelling this good. #n...Perhaps 'twould have been wise to fill my stomach before the breakout.)"
70016010-108 = "(I want it... But with what coin...?)"
70016010-112 = "(Nay, but out at sea, the people had offered me their food. What is there to mull#nabout here!?)"
70016010-113 = "Somebody—!"
70016010-120 = "Sigh... It's already been work work work, and then a prison breakout decides to#nhappens..."
70016010-121 = "I get how you feel, but... #nThis is our first meal of the day, Konoka-san, so let's focus on that."
70016010-122 = "Konoka-what now!? You think you can act all buddy-buddy with me just 'cause#nI got demoted!?"
70016010-123 = "I-it was just a joke! Ugyaaah! No violeence!!"
70016010-125 = "How about I send YOU to the hospital instead of those escapees?"
70016010-131 = "O-officer, help! Wait, we are the officers..."
70016010-135 = "(Valkyrie...!)"
70016010-136 = "(If I recall... They are something of the landlubbers' equivalent to Trident.#nThat's no good!)"
70016010-141 = "Hm? Was someone calling?"
70016010-142 = "Huh? Are you hearing things now?"
70016010-143 = "Mmnn, it's probably 'cause I haven't slept in how many days now..."
70016010-144 = "Keep at it, *former* deputy director! #nYou'll be just fine, since you should be used to getting demoted by now!"
70016010-148 = "I'm used to what!? It looks like you haven't been chewed out#nenough yet!"
70016010-161 = "I'm sick of it! No matter where I go, there's nothing but police...."
70016010-162 = "Those Valkyrie lassies and whatnot keep popping up one after another...! #nWhat are they? Wharf roaches!?"
70016010-163 = "Nay, but at least wharf roaches smell of the seashores... #nPlease, anything but to be caught by a bunch of dirt-smellers!"
70016010-164 = "But walking all the way to the sea like this would be no easy feat..."
70016010-168 = "...That's it!"
70016010-169 = "I recall seeing a method to obtain a free ride on the TV at the Correction Bureau#nbefore."
70016010-170 = "I believe you are to stand by the road… and then raise your thumb!"
70016010-171 = "…Is one hand enough? Or perhaps I need both?"
70016010-178 = "Oooh! Here one comes!"
70016010-179 = "Aye, you lowborn landlubber! #nI bestow upon you the honor of serving me!"
70016010-180 = "Avast posthaste and bow your head before m—"
70016010-185 = "Oyo…!?"
70016010-186 = "Twas indeed two hands after all?"
70016010-196 = "Ugh… My arms are going numb…"
70016010-203 = "W-wait upp…!"
70016010-209 = "Ugh… I'm parched… My stomach's growling too…"
70016010-215 = "It stopped!"
70016010-222 = "Oh, a hitchhiker. Where're you headed?"
70016010-227 = "How impudent! The gall you have to make me run all this way!"
70016010-228 = "Im-impudent?"
70016010-229 = "The Dragon Queen has summoned for you. You should have been the one to#nscurry on over! If we were at sea, I'd have you walking the plank!"
70016010-230 = "Dragon Queen...? The sea...?"
70016010-231 = "By the way, I've never seen someone dressed like you before. Did you come from#nsome far away academy?"
70016010-232 = "Hmph. If you are unaware, then I shall enlighten you. I am the Sea Dra—"
70016010-237 = "One more addendum. Surely, you have seen yourself in a mirror at the Correction Bureau."
70016010-238 = "You have a very striking appearance. #nAt present, Valkyrie is frantically scouring the surrounding for us, #nso you would be well-advised to keep your identity hidden."
70016010-244 = "Dra..."
70016010-245 = "Dra?"
70016010-246 = "...A drained but ordinary high school student."
70016010-247 = "..."
70016010-248 = "I'm being nice here and offering you a ride, and this is the attitude you're giving#nme? Get out of here and walk on your own two feet!"
70016010-253 = "Ah, huh..."
70016010-259 = "W-waiiit!"
70016010-263 = "Right. I ought to keep my identity hidden..."
70016010-264 = "I must be careful next time, lest they send me back to the brig."
70016010-265 = "Twould be wise to speak as little as possible..."
70016010-270 = "...Here comes another one!"
70016010-276 = "What? You a hitchhiker?"
70016010-277 = "(Saying too much would invite suspicion.)"
70016010-278 = "(Careful now, lest I come off as too suspicious...)"
70016010-279 = "H-heheh..."
70016010-280 = "Am I, or am I not...?"
70016010-281 = "Huh?"
70016010-282 = "So you ain't a hitchhiker then?"
70016010-283 = "Ah, uh..."
70016010-284 = "It's just a prank, huh? Some people got places to be, y'know!"
70016010-291 = "A-aah..."
70016010-303 = "Excuse me, miss?"
70016010-307 = "Hm...?"
70016010-308 = "Would you like a ride? This is the last bus of the day."
70016010-309 = "Um, well..."
70016010-310 = "I-I will never abase myself to ride such an ignoble barge as this!"
70016010-311 = "Though... If you allow me to ride for no charge, then perhaps I may reconsider."
70016010-315 = "..."
70016010-316 = "All right, I understand how it is."
70016010-323 = "Urgh... This is exactly why I hate the land..."
70016010-324 = "No winds nor waves... And coins. Coins, coins. Everything costs coin..."
70016010-327 = "I can't wait to return to the sea..."
70016010-336 = "Zzz..."
70016010-342 = "Owaah!?"
70016010-343 = "Little missy, is there something wrong?"
70016010-344 = "Nodding off at a place like this... Is everything all right?"
70016010-345 = "Y-you startled me...! H-how insolent of you to frighten me!"
70016010-350 = "...Huh? This smells like... the seashore!"
70016010-351 = "Hey, is this car headed towards the sea?"
70016010-352 = "I smell like the seashore? Ah, it must be because of the fish I was loading earlier."
70016010-353 = "I suppose I am technically heading to towards the sea..."
70016010-354 = "I'm heading to Kanesaki Port. If you're fine going there, then I wouldn't mind#ntaking you with."
70016010-358 = "Aye! Very good! So long as it's by the sea, wherever goes!"
70016010-365 = "...Hup!"
70016010-366 = "Aye now, set sai— Ah, pardon me. Sally forth!"
70016010-367 = "(Anywhere by the sea is fine, she said...)"
70016010-368 = "(I wonder if she has something on her mind. That's how it is to be young,#nI suppose.)"
70016010-369 = "All right, all right. We're sallying forth."
70016010-370 = "It'll be a while before we reach the sea, so sit back and get yourself comfortable."
70016010-371 = "Aye, I have no problem with waiting! But of course, the faster the better!"