[translation]
70016010-1 = "Road to Ryugu (1)"
70016010-4 = "We have received new information regarding the mass breakout incident that occurred today at the Valkyrie Correction Bureau."
70016010-5 = "A total of seven inmates escaped, #nreportedly taking advantage of the chaos surrounding the General Student Council President's disappearance."
70016010-6 = "The Valkyrie Police Academy has placed all surrounding areas on the highest level of alert--"
70016010-10 = "Every channel is talking about nothing but the prison break."
70016010-11 = "I was planning to enjoy a classical music program at this hour, too..."
70016010-16 = "...Excuse me, the Val...Correc...Bureau is issuing an emergency statement..."
70016010-17 = "My, have we finally reached a place where the signal doesn't reach? #nThen, I suppose we will part ways here."
70016010-25 = "Phew... I can finally breathe properly."
70016010-26 = "I was worried there was too much oxygen and it would turn into cardio... #nStill, the air outside is wonderful, isn't it?"
70016010-27 = "What will you do now?"
70016010-28 = "Let's see... First, I think I will go see an old friend."
70016010-29 = "My muscle mass decreased during prison life, #nso I want to do some lat pulldowns with the Helmet Gang."
70016010-30 = "My, my. That sounds like it will be a fun journey."
70016010-35 = "In a situation like this, people usually express their gratitude, but..."
70016010-36 = "You should stop doing things that do not suit you. #nBesides, I do not expect you to be normal."
70016010-37 = "Heh... It helps that you are quick to understand."
70016010-38 = "And? What will you do from here?"
70016010-39 = "...Well, I had a few things in mind--"
70016010-40 = "First, I plan to repay an old favor. That is just how reason and logic work, isn't it?"
70016010-41 = "...When you talk about reason and logic, it is always only when applying it to others."
70016010-42 = "I can pretty much guess who you are talking about, but..."
70016010-43 = "No, any more than that would be none of my business."
70016010-44 = "You know very well, don't you?"
70016010-45 = "Yes. Well then, I wish you a good repayment."
70016010-49 = "Now..."
70016010-53 = "Hm, are you not getting out?"
70016010-54 = "I think it would be better to get out quickly. The bomb I planted will explode soon."
70016010-58 = "Where is this...? At least drop me off somewhere close to the ocean..."
70016010-59 = "I am a consultant. #nI sometimes help out, but I am not a chauffeur."
70016010-60 = "Besides, this car is being tracked. Driving any further is dangerous."
70016010-61 = "W-Well then! What am I supposed to do! I have no idea where this is, and I do not even have any money..."
70016010-62 = "Aren't you the Jiao Long of the Tidal Wave, the one who made the ocean of Kivotos tremble in terror? #nI am sure you can manage that much on your own."
70016010-63 = "I operate on a schedule down to the second. #nI cannot spare any more time for you. Farewell."
70016010-64 = "Ugh..."
70016010-70 = "That's right. You must have looked in a mirror at least once in the Correction Bureau, right?"
70016010-71 = "Your appearance stands out. #nValkyrie is currently searching for us with bloodshot eyes, #nso you had better conceal your identity."
70016010-72 = "I will give you one final warning: do not go looking for me. #nWhen I want you to repay this debt, I will come to find you myself."
70016010-78 = "..."
70016010-82 = "Where... is the ocean..."
70016010-92 = "...They're gone."
70016010-93 = "I must find a port... But it is far too bright here, I cannot even see the stars..."
70016010-94 = "And the wind... The buildings are in the way, I cannot read it at all..."
70016010-95 = "...I really hate land. The ocean... Where is the ocean!?"
70016010-96 = "The ocean is waiting for me! I cannot afford to waste time in a place like this--!"
70016010-102 = "Coming right up! Tonkotsu ramen with extra garlic!"
70016010-106 = "(Ugh...)"
70016010-107 = "(Giving off such an absurdly good aroma, considering it is mere land food. #n...Should I have filled my stomach before breaking out after all?)"
70016010-108 = "(I want it... But I have no money...)"
70016010-112 = "(No, in the ocean, everyone brought food as tribute to me! I have nothing to worry about!)"
70016010-113 = "Someone--!"
70016010-120 = "Haa... I'm busy enough as it is, and now a prison break..."
70016010-121 = "I understand how you feel, but... #nThis is your first meal today, so let's eat properly, Konoka."
70016010-122 = "Konoka-saaan?! Are you treating me like a friend just because I got demoted!?"
70016010-123 = "J-Just kidding! Ugyaa! Violence is bad!!"
70016010-125 = "I could always send you to the hospital in place of the escapee, you know?"
70016010-131 = "O-Officer! Ah, that's us..."
70016010-135 = "(Valkyrie...!)"
70016010-136 = "(If I recall correctly... they are like the trident of the land. This is bad!)"
70016010-141 = "Hm? Did someone call?"
70016010-142 = "Eh? Are you hearing things again?"
70016010-143 = "Nn, I haven't slept in a few days, so that might be why..."
70016010-144 = "Hang in there, Former Vice Director! #nGetting demoted is something you're already used to, isn't it?"
70016010-148 = "What do you mean, used to it! It looks like you haven't been chewed out enough yet!"
70016010-161 = "Good grief, police everywhere I go..."
70016010-162 = "Those Valkyrie fools, one after another...! #nThey are just like sea slaters!"
70016010-163 = "No, sea slaters are somewhat better since they smell like the shore... #nI refuse to be caught by these dirt-smelling fools!"
70016010-164 = "Still, walking all the way to the ocean like this will be difficult..."
70016010-168 = "...That's it!"
70016010-169 = "I saw a way to ride in cars for free on the television at the Correction Bureau. If I recall..."
70016010-170 = "You stand by the roadside like this... and stick your thumb out!"
70016010-171 = "...Just one arm is fine, right? Or both arms?"
70016010-178 = "Oh, it's coming!"
70016010-179 = "You there! Lowly scum crawling on the ground! #nI shall grant you the honor of serving me!"
70016010-180 = "Stop immediately and bow your head--"
70016010-185 = "Oh...!?"
70016010-186 = "Was it both arms after all?"
70016010-196 = "Ugh... My arm is going numb..."
70016010-203 = "W-Wait...!"
70016010-209 = "Ugh... My throat is dry... And my stomach is starting to rumble..."
70016010-215 = "It stopped!"
70016010-222 = "Oh, hitchhiking? Where are you headed?"
70016010-227 = "Insolence! You made me run!"
70016010-228 = "I-Insolence?"
70016010-229 = "The Dragon King is calling you right now. It is only natural that you should come running! #nIf this were the ocean, you would be walking the plank!"
70016010-230 = "Dragon King...? Ocean...?"
70016010-231 = "Come to think of it, you're wearing unusual clothes. Did you come from some distant academy?"
70016010-232 = "Hmph. If you do not know, I shall teach you. I am the Jiao Long of the Tidal--"
70016010-237 = "That's right. You must have looked in a mirror at least once in the Correction Bureau, right?"
70016010-238 = "Your appearance stands out. #nValkyrie is currently searching for us with bloodshot eyes, #nso you had better conceal your identity."
70016010-244 = "Like this..."
70016010-245 = "Like this?"
70016010-246 = "...I am an ordinary student attending high school."
70016010-247 = "..."
70016010-248 = "I was trying to be kind and give you a ride, but what is with that attitude? #nWalk by yourself!"
70016010-253 = "Ah, eh..."
70016010-259 = "W-Wait~!"
70016010-263 = "Ah. I needed to hide my identity..."
70016010-264 = "I must be careful next time. I would hate to be dragged back to the Correction Bureau."
70016010-265 = "I must avoid speaking as much as possible..."
70016010-270 = "...It came!"
70016010-276 = "What, hitchhiking?"
70016010-277 = "(If I say anything unnecessary, I will arouse suspicion.)"
70016010-278 = "(To avoid looking suspicious, I must be careful...)"
70016010-279 = "F-Fufu..."
70016010-280 = "Well now, I wonder..."
70016010-281 = "Huh?"
70016010-282 = "Aren't you hitchhiking?"
70016010-283 = "Ah, um..."
70016010-284 = "Jeez, just messing around. I'm in a hurry here!"
70016010-291 = "A-Ah..."
70016010-303 = "Um, customer?"
70016010-307 = "Nn...?"
70016010-308 = "Are you not getting on? This is the last bus for today."
70016010-309 = "Um, well..."
70016010-310 = "As if the likes of me would ride such a lowly flatboat!"
70016010-311 = "Well... If you are going to let me ride for free, I might consider it."
70016010-315 = "..."
70016010-316 = "Ah, is that so."
70016010-323 = "Ugh... This is why the land is..."
70016010-324 = "There is no wind, no waves... And no matter what you do, it is money, money, money..."
70016010-327 = "I must return to the ocean soon..."
70016010-336 = "Zzz..."
70016010-342 = "Whoa...!"
70016010-343 = "Miss, what is wrong?"
70016010-344 = "Falling asleep in a place like this... Are you alright?"
70016010-345 = "S-Startled me...! S-Startling me... How rude!"
70016010-350 = "...Hm? This is... the scent of the shore!"
70016010-351 = "Hey, is this car heading toward the ocean?"
70016010-352 = "The scent of the shore? Ah, maybe it's because I was carrying fish earlier."
70016010-353 = "I am heading in the direction of the ocean, though..."
70016010-354 = "If Kanesaki Port is fine with you, would you like a ride, young lady?"
70016010-358 = "Splendid, splendid! Anywhere is fine as long as it is the ocean!"
70016010-365 = "...Heave-ho!"
70016010-366 = "Now then, set sail-- No, depart!"
70016010-367 = "(Anywhere is fine as long as it's the ocean...)"
70016010-368 = "(Must be going through some kind of trouble. Ah, youth.)"
70016010-369 = "Yes, yes, we're heading out."
70016010-370 = "It's going to take a while to get to the ocean, so please make yourself comfortable."
70016010-371 = "Very well! Waiting is no issue! Though sooner is always better!"
