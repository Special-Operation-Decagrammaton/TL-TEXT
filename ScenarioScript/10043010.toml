[translation]
10043010-1 = "Эпизод 1;Никогда не говори «никогда»"
10043010-6 = "Ого, мы правда в раздевалке «Героев»."
10043010-7 = "Я не слишком знакома с бейсбольной культурой, но... фанатов обычно не пускают в служебные помещения команды, верно?"
10043010-8 = "[s] «И уж точно не проводят тайком, как нас...»"
10043010-9 = ""
10043010-13 = "Сенсей из Шале. Добро пожаловать."
10043010-14 = ""
10043010-16 = ""
10043010-17 = "[ns] «Не думаю, что мы знакомы.»"
10043010-18 = ""
10043010-20 = ""
10043010-22 = ""
10043010-23 = "Прошу прощения, позвольте представиться. Я тренер «Героев Корги»."
10043010-24 = ""
10043010-27 = ""
10043010-28 = "Тренер! Ого!"
10043010-29 = "Это..."
10043010-31 = "Как уже сказали ваши студенты, обычно мы не водим фанатов в служебные помещения, тем более посреди матча."
10043010-32 = "Но у нас срочная проблема, и, Сенсей, нам нужна ваша помощь."
10043010-33 = ""
10043010-35 = ""
10043010-36 = "Нам нужно, чтобы вы спасли «Героев»."
10043010-37 = ""
10043010-40 = ""
10043010-41 = "От... чего именно?"
10043010-42 = "Это как-то связано с тренировками?"
10043010-43 = "Скорее всего, нет!"
10043010-45 = "Дело в том, что...!"
10043010-46 = ""
10043010-51 = ""
10043010-52 = ""
10043010-54 = "Здравствуйте, тренер. Новые указания. Лучше будьте готовы."
10043010-56 = ""
10043010-57 = "!!!"
10043010-59 = "Я-я готов. Но что вам нужно? Деньги? Если да, мы—"
10043010-60 = "Дело не в деньгах. Важен матч."
10043010-61 = "А теперь слушайте внимательно. Повторять не буду. В следующий раз, когда ваша команда выйдет отбивать..."
10043010-62 = "...выведите игрока на базу, а потом сделайте бант. Поняли? Я хочу увидеть именно это. Ничего другого."
10043010-64 = "Если отойдёте от указаний, вы вынудите меня действовать."
10043010-65 = "*глоть*"
10043010-66 = "И если позвоните Валькирии или матч хоть как-то прервётся — то же самое. Я сделаю это. Сразу же."
10043010-67 = "Я позвоню снова, когда вы опять выйдете отбивать. И вы ОБЯЗАТЕЛЬНО ответите."
10043010-68 = ""
10043010-70 = ""
10043010-72 = "Они... повесили трубку?"
10043010-73 = "Ух, мне совсем не понравился этот голос. Похоже, они использовали модулятор."
10043010-75 = "Почему они продолжают это делать...?!"
10043010-76 = "[s] «Чем они вам угрожают?»"
10043010-77 = ""
10043010-79 = ""
10043010-80 = "Наверное, сначала стоит объяснить именно это. Если я вообще смогу выговорить..."
10043010-82 = "И ПОЧЕМУ они вам угрожают? Что вообще можно получить, запугивая бейсбольного тренера?"
10043010-83 = "Понятия не имею, что здесь происходит..."
10043010-85 = "Я даже думать об этом толком не могу, настолько страшно..."
10043010-86 = "Они сказали..."
10043010-87 = ""
10043010-90 = ""
10043010-92 = ""
10043010-94 = "...ну, понимаете, у «Героев» эксклюзивный контракт с одной фабрикой игрушек для жевания, и... и они сказали, что взорвут её!"
10043010-95 = "Они террористы! Худшие из худших!"
10043010-96 = ""
10043010-99 = "[ns] «Так, спокойно...»"
10043010-101 = "Фабрика жевательных игрушек...?"
10043010-102 = "Эм... тренер? Простите. Я не очень понимаю..."
10043010-104 = "...Ладно. Расскажу остальное."
10043010-105 = "Игрушки, которые там делают, как раз нужной твёрдости. Не знаю, что они делают с текстурой, но во рту ощущаются идеально."
10043010-106 = "К тому же в них добавляют этот вкус умами, который становится сильнее, чем дольше жуёшь. Это... неописуемо! Настолько вкусно!"
10043010-107 = "Когда игроки слишком возбуждены, они жуют их, чтобы успокоиться и всё такое."
10043010-108 = "Большинство команды жить без них не может. Они почти никогда не выходят ни отбивать, ни подавать, пока сначала немного не пожуют."
10043010-109 = "Без них наш средний процент отбивания упал бы как минимум вдвое!"
10043010-110 = "А наш ERA... Уф."
10043010-112 = "Вот как..."
10043010-113 = "(Я всё ещё не до конца понимаю... но если на кону результаты команды...)"
10043010-114 = ""
10043010-116 = ""
10043010-118 = ""
10043010-119 = "Хм, Тренер? Я не так хорошо разбираюсь в бейсболе, как Рэй..."
10043010-120 = "...но все эти угрозы и прочее выглядят совсем неспортивно."
10043010-121 = ""
10043010-123 = ""
10043010-124 = "Нет. Совсем. И... молодец, говоришь о спорте, не сводя всё к тренировкам!"
10043010-125 = "Может, бейсбол расширяет твой кругозор."
10043010-126 = "Здоровый взгляд на мир начинается со здорового тела."
10043010-127 = "Когда ты в форме, проблемы решаются проще!"
10043010-128 = "А ведь так хорошо начинала..."
10043010-130 = "[ns] «Хорошо, тренер, кажется, я понял.»"
10043010-131 = ""
10043010-133 = ""
10043010-134 = "Т-тогда... вы сможете нам помочь?"
10043010-135 = "...Эй, говорю как фанат бейсбола и вообще спорта: это очень неправильно."
10043010-136 = "Бейсбольные стадионы — священное место. С таким не шутят."
10043010-137 = "Тем более не устраивают ТЕРРОРИСТИЧЕСКИЕ угрозы! Нельзя позволить им уйти безнаказанными. Ни за что."
10043010-138 = "Согласна, Тренер. Если позволить этим террористам добиться своего..."
10043010-139 = "...это повлияет не только на матч. Это может изменить всю спортивную сцену Кивотоса."
10043010-140 = "[s1] «Хорошо, мы все согласны.»\n[s2] «Найдём способ помочь.»"
10043010-141 = ""
10043010-142 = ""
10043010-145 = ""
10043010-146 = "С-спасибо... Спасибо!"
10043010-148 = "Но что именно мы можем сделать?"
10043010-149 = ""
10043010-151 = ""
10043010-152 = "А? Осмотреть трибуны в поисках виновника? ...Верно, других зацепок у нас нет, так что начать стоит именно там."
10043010-153 = "Точно. Серия Ширатори ведь не транслируется в прямом эфире."
10043010-154 = "Если злодеи следят за матчем в реальном времени, значит, они должны делать это прямо отсюда, со стадиона. По крайней мере один из них."
10043010-155 = "Они сказали, что перезвонят в конце иннинга."
10043010-156 = "Верно. И они могут выдвинуть новые требования."
10043010-157 = "Нужно быть готовыми."
10043010-158 = ""
10043010-160 = ""
10043010-161 = "Ага... Допустим, мы подключимся к звонку. Сможем слушать, возможно, даже поговорить с преступником, пока ищем его."
10043010-162 = "Точно, может, удастся заставить его случайно выдать какую-нибудь информацию."
10043010-163 = "Рэй, Тренер, эту часть я оставлю вам двоим."
10043010-164 = "Я спортсменка, а не переговорщик с захватчиками."
10043010-165 = "Зато если нужно что-то сделать физически — я в деле."
10043010-166 = "[s3] «Хорошо, давайте распределим роли.»\n[s4] «Одна группа работает с телефоном, другая выходит искать звонящего.»"
10043010-169 = "Звучит хорошо. Я помогу со звонками и заодно буду искать."
10043010-170 = "А я займусь основным поиском."
10043010-171 = "Похоже, вы всё правильно придумали, Сенсей. Я оставлю линию открытой."
10043010-172 = ""
10043010-174 = ""
10043010-175 = "И... Сумирэ, верно?"
10043010-176 = ""
10043010-179 = ""
10043010-180 = "Верно, тренер. Что такое?"
10043010-181 = "Ну, думаю, Рэй здесь затеряется среди остальных, но..."
10043010-182 = "...ты можешь немного выделяться, если начнёшь ходить и всё осматривать."
10043010-183 = "Почему? Тренер, с моей одеждой что-то не так?"
10043010-184 = "[s] «Нет-нет! Они не это имели в виду!»"
10043010-185 = "Хотя, наверное, для бейсбола я действительно одета не совсем подходяще..."
10043010-186 = "Хорошо, что вы предлагаете?"
10043010-187 = ""
10043010-190 = ""
10043010-191 = "Ну, мы же НА бейсбольном стадионе..."
10043010-192 = "...значит, здесь наверняка найдётся подходящая одежда?"
10043010-193 = "[s] «Какая именно?»"
10043010-194 = "А! Эй, тренер, у вас случайно нет... *шёпот* *шёпот*"
10043010-195 = ""
10043010-198 = ""
10043010-199 = "Хм? А, да, есть! Сейчас принесу!"
10043010-200 = ""
10043010-202 = ""
10043010-204 = ""
10043010-205 = ""
10043010-215 = ""
10043010-216 = "...Так, спасибо, что подождали. Выходи, Сумирэ!"
10043010-217 = ""
10043010-219 = ""
10043010-223 = ""
10043010-224 = "Хм, а это действительно ощущается... довольно свежо."
10043010-225 = "Эй, эм, Тренер?"
10043010-226 = "Как... я выгляжу...?"
10043010-227 = "[s] «...!»"
10043010-229 = "[ns5] «Тебе очень идёт, Сумирэ!»\n[ns6] «Будто мы увидели тебя с совершенно новой стороны.»"
10043010-232 = "П-Правда?"
10043010-233 = "Если вы так говорите, Тренер... Фуфу, возможно, я смогу привыкнуть."
10043010-234 = "Особенно раз в такой одежде я могу разносить зрителям напитки, например полезные протеиновые..."
10043010-235 = "Совсем не в этом дело, Сумирэ."
10043010-236 = "В любом случае! Думаю, теперь мы готовы. Выдвигаемся!"
10043010-237 = "Мы уже долго разговариваем. Они могли успеть сменить стороны в иннинге."
10043010-238 = "Вообще-то... всё ещё только один аут. Время есть."
10043010-239 = "Погодите, за всё это время — всего ОДИН аут?"
10043010-240 = "Сколько у них уже было выходов на биту?!"
10043010-241 = ""
10043010-246 = "..."
10043010-247 = "..."
10043010-248 = "[s] «...»"
10043010-249 = ""
10043010-252 = ""
10043010-253 = "Н-ну, эй... бейсбол полон сюрпризов! Никогда не знаешь, что произойдёт до самого конца!"
