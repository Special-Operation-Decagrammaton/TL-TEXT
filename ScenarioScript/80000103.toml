[translation]
80000103-1 = "Вот именно поэтому"
80000103-2 = "Получив сообщение от Нагисы, я отправился в Тринити."
80000103-3 = "По какой-то причине она хотела встретиться у главных ворот Тринити."
80000103-4 = "...Вот и вы, Сенсей. Я вас ждала."
80000103-5 = "Хи-хи. Вы удивлены. Полагаю, этого и стоило ожидать."
80000103-6 = "Обычно я бы никогда не осмелилась предложить встретиться здесь, особенно в такой день."
80000103-7 = "Но я никогда ничего не делаю без причины. Наверное, лучше сразу всё объяснить и удовлетворить ваше любопытство, однако..."
80000103-8 = "Сначала, пожалуйста, возьмите это."
80000103-9 = ""
80000103-11 = ""
80000103-13 = "[ns1] «Это... шоколад?»\n[ns2] «Не ожидал, что ты подаришь мне нечто подобное.»"
80000103-16 = "Можете относиться к этому как хотите. Это просто подарок в знак благодарности за всё, что произошло."
80000103-17 = "Уверена, от человека моего положения он кажется слишком обычным и простым, но..."
80000103-18 = "На то есть причина, если позволите объяснить."
80000103-19 = "Так же как есть причина, почему я пригласила вас именно сюда..."
80000103-20 = "...Я опять заболталась?"
80000103-21 = "Тысяча извинений. Позвольте действительно всё объяснить."
80000103-22 = "Ничего серьёзного или драматичного. Причина, почему я пригласила вас в это уединённое место и почему дарю самый обычный шоколад, который можно найти где угодно..."
80000103-23 = "...в том, что я не хочу, чтобы люди узнали, что подарила вам шоколад на День святого Валентина."
80000103-24 = "[s3] «Пытаешься сохранить свой образ?»\n[s4] «Значит, это тайный шоколад?»"
80000103-27 = "Не то чтобы всё настолько серьёзно. Думаю, я переживу случайные слухи вроде «Я слышала, она всё-таки подарила Сенсею шоколад!»"
80000103-28 = "Как вы знаете, Тринити — школа, где требуется немало... «социального такта»."
80000103-29 = "«Она сделала это, чтобы поддерживать близкие отношения с Сенсеем ради Тринити»."
80000103-30 = "«Как член Чаепития, она пытается сблизиться с Сенсеем и продемонстрировать влияние. Через него она собирает сведения о других академиях»."
80000103-31 = "Такие политические трактовки неизбежны, как и версии, будто я пытаюсь заслужить ваше расположение ради будущей услуги или подкупить вас шоколадом."
80000103-32 = "Сам факт появления слухов — не проблема. На моём положении к этому привыкаешь. Моя работа — управлять такими историями, а иногда использовать их себе на пользу."
80000103-33 = "И всё же..."
80000103-34 = "Я не хочу, чтобы вы видели меня такой, какой меня могут изобразить эти слухи."
80000103-35 = "Поэтому я попросила встретиться в такое время и в таком месте, чтобы у нас была приватность."
80000103-36 = "Даже Чаепитие не станет искать меня здесь в это время дня."
80000103-37 = "Хотя у меня осталось всего несколько минут."
80000103-38 = "...Хи-хи."
80000103-39 = "Как я уже сказала, этот шоколад — просто благодарность за всё, что вы сделали для Тринити."
80000103-40 = "Это не часть сделки и не способ использовать подарок против вас при следующей совместной работе."
80000103-41 = "Можете взять, оставить, забыть — мне всё равно. Просто держите это в секрете."
80000103-42 = "И, Сенсей..."
80000103-43 = "Спасибо. За сегодня и за всё, что было раньше. Вы многому меня научили."
80000103-44 = ""
80000103-46 = ""
80000103-47 = "А теперь мне пора возвращаться. Простите, что так быстро ухожу, но у Чаепития много дел."
80000103-48 = "До следующей встречи..."
80000103-49 = "[s] «...»"
80000103-51 = "[ns] «...Нагиса.»"
80000103-52 = "Д-Да?"
80000103-53 = "[s5] «Было приятно с тобой познакомиться!»\n[s6] «Не с Нагисой из „Чаепития“ и не с Нагисой — лидером Тринити. С настоящей тобой!»"
80000103-56 = "...Хи-хи."
80000103-57 = "Я ожидала, что всё закончится именно так."
80000103-58 = "...Спасибо. Сенсей."
80000103-59 = "Это было трудно... но хотя бы один раз..."
80000103-60 = "Я изо всех сил старалась оставить политику в стороне... А теперь..."
80000103-62 = "Та «Нагиса», которая хотела услышать эти слова, набралась смелости объявить политическую войну остальной части меня. Что тут поделать?"
