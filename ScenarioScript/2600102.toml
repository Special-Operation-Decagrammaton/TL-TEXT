[translation]
2600102-1 = "Секреты взрослых"
2600102-2 = "Исполнительный офис Шале"
2600102-4 = "В свой дежурный день Котама принесла в кабинет Шале большого плюшевого медведя."
2600102-5 = "[ns] «Что это за медведь?»"
2600102-6 = "Ну... Эм..."
2600102-7 = "Это подарок. Подарок для Сенсея."
2600102-8 = "[s] «Неожиданный подарок?»"
2600102-9 = "Ты много мне помогал."
2600102-10 = "Я думала, как отблагодарить тебя, и решила подарить подарок."
2600102-11 = "[s] «Неожиданно... Но я приму. Спасибо.»"
2600102-12 = "Хорошо."
2600102-14 = "Сенсей. Если возможно, я бы хотела, чтобы этот медведь стоял в кабинете Шале."
2600102-15 = "У меня нет никаких скрытых мотивов."
2600102-16 = "Просто... думаю, так будет лучше для медведя."
2600102-17 = "Лучше поставить его где-нибудь на солнце, откуда он сможет видеть весь кабинет."
2600102-18 = "Не ставь перед ним ничего, что может закрыть обзор, и обязательно держи подальше от воды и электромагнитных полей, вредных для электроники..."
2600102-19 = "[s] (Внимательно осмотреть плюшевого медведя.)"
2600102-20 = ""
2600102-21 = "С-Сенсей? Зачем ты..."
2600102-23 = "(За одной из пуговиц медведя обнаружилось подозрительное устройство.)"
2600102-24 = "Э-Это... Не обращай внимания. Просто обычное..."
2600102-25 = "Это всего лишь устройство для записи звука!"
2600102-26 = "[s] «Прости, но этого медведя я принять не могу.»"
2600102-27 = "Понятно. Если он тебе не нравится, ничего не поделаешь..."
2600102-29 = "Но попытки Котамы установить прослушку продолжились..."
2600102-31 = "Сенсей, я принесла новые настенные часы."
2600102-32 = "На этот раз ты точно не найдёшь ничего странного."
2600102-33 = "[s] (Осмотреть часы.)"
2600102-35 = "(Между стрелками часов было спрятано устройство для прослушки.)"
2600102-36 = "О, это просто... часы с функцией записи. Кроме этого в них ничего особенного."
2600102-37 = "[s] «Эти часы я тоже принять не могу.»"
2600102-38 = "*вздох* ...Опять провал."
2600102-40 = "Сенсей, я приготовила тебе еду."
2600102-41 = "Пожалуйста, съешь, пока не остыла."
2600102-42 = "(Устройство для прослушки совершенно открыто плавало в еде.)"
2600102-43 = "[s] ..."
2600102-44 = "...Похоже, ты уже понял."
2600102-45 = "Видимо, спрятать устройство прослушки в еде тоже не вариант..."
2600102-47 = "Медведь, часы и еда не сработали. Что дальше..."
2600102-48 = "[s] «Почему ты так настойчиво пытаешься нас прослушивать?»"
2600102-49 = "Дело не в прослушке. Я просто хочу записать твой голос."
2600102-50 = "[s] «Тогда зачем делать это тайком?»"
2600102-51 = "Я пытаюсь, потому что..."
2600102-52 = "Хочу узнать о тебе секрет, которого не знает больше никто."
2600102-53 = "Я подумала, что если прослушивать кабинет, то смогу записать, как ты где-нибудь случайно проговоришься..."
2600102-54 = "[s1] «Что ты собиралась делать, узнав мой секрет?»\n[s2] «Шантажировать меня? Как в манге?»"
2600102-55 = "Нет, вовсе нет!"
2600102-56 = "Нет, вовсе нет!"
2600102-57 = "Я просто хочу нормально с тобой разговаривать..."
2600102-58 = "В моих глазах, Сенсей, ты идеальный взрослый без единого недостатка."
2600102-59 = "Конечно, благодаря этому ты очень много мне помог, но из-за этого мне ещё труднее просто разговаривать с тобой..."
2600102-60 = "Я думала, если буду знать твой секрет, которого не знает никто другой, то наконец смогу говорить с тобой нормально."
2600102-61 = "Но пронести прослушку в Шале оказалось непросто. Я откажусь от попыток раскрыть твои секреты."
2600102-62 = "[s] «Вообще-то я боюсь высоты.»"
2600102-63 = "Что?"
2600102-64 = "[s] «Моя слабость — я боюсь высоты.»"
2600102-65 = "Понятно. Значит, Сенсей боится высоты..."
2600102-66 = ""
2600102-67 = "Ахаха. Забавно. Ты работаешь в офисе в высоком здании и при этом боишься высоты."
2600102-68 = "[s] «Поэтому это и секрет.»"
2600102-69 = "И правда. Даже у человека, который кажется идеальным, есть неожиданная слабость..."
2600102-70 = "Кажется, теперь я понимаю тебя немного лучше, Сенсей."
2600102-71 = "Спасибо, что подыграл мне, Сенсей."
