[translation]
42060-1 = "Эпизод 6;Тревоги RABBIT"
42060-2 = "Парк Коусаги"
42060-3 = "Вернувшись в парк, отряд RABBIT рассказал мне о сегодняшней находке и последовавшей операции."
42060-4 = "[ns] «Значит, за инцидентом в Шале стоял отряд FOX...»"
42060-5 = "Нам стоило рассказать вам с самого начала."
42060-6 = "Одно дело — самим облажаться. Другое — когда наша ошибка подвергает опасности вас, Сенсей. Наверное, нам просто было страшно признаться..."
42060-7 = "[s1] «Вы отлично справились. Не о чем переживать.»\n[s2] «Всё нормально. Это не ваша вина.»"
42060-8 = "Но мы вообще ничего не понимали, п-просто счастливо жили в парке..."
42060-9 = "Но мы вообще ничего не понимали, п-просто счастливо жили в парке..."
42060-10 = "А вы принесли нам ту дорогущую говядину в благодарность! З-За то, что мы сами же и устроили!"
42060-11 = "А м-мы бедные бездомные студенты... Даже вернуть стоимость не можем!"
42060-12 = "У нас есть только просроченные бенто! П-Пожалуйста, возьмите их в благодарность!"
42060-13 = "[s] «Не надо, правда! Я прекрасно обойдусь без них!»"
42060-14 = "Мы всё исправим: узнаем, что они забрали из Шале, и вернём это."
42060-15 = "Но справиться с отрядом FOX будет непросто."
42060-16 = "Нужно хотя бы сначала понять, что именно они забрали..."
42060-17 = "Никто ничего такого не терял, и на видео предмет был маленьким..."
42060-19 = "Дорогие банки тунца? Нижнее бельё учителя?!"
42060-20 = "Нижнее бельё Сенсея...?!"
42060-22 = "Представить старших, которые в полном вооружении вламываются в Шале только ради трусов... тревожно."
42060-23 = ""
42060-25 = ""
42060-26 = "[ns] «Об этом подумаем позже.»"
42060-28 = "[ns] «Я хочу больше узнать об участницах отряда FOX.»"
42060-29 = "Я забыла, что вы с ними не знакомы."
42060-30 = "Если вкратце описать старших из FOX..."
42060-31 = "Они — элита Кивотоса."
42060-32 = "Элитных сил с боевыми возможностями SRT в Кивотосе полно. Но в спецоперациях? Им нет равных."
42060-33 = "Они обучены действовать в любой ситуации и любой среде. Их навыки далеко не ограничиваются боем."
42060-34 = "Они были идеалом. Подразделением, которое не просто соответствовало требованиям к агентам SRT, а воплощало их."
42060-35 = "Например, заместитель лидера FOX, Нико..."
42060-37 = ""
42060-38 = "Она «мама отряда». Её терпению и умению принимать других нет равных. Я знаю, потому что точно испытывала их на прочность. Хи-хи."
42060-39 = "Она готовила ланчи с инаризуси каждому отряду, уходившему на миссию..."
42060-40 = "Нико была опорой для всех. Другие отряды постоянно приходили к ней за советом."
42060-41 = ""
42060-42 = "Н-Нико очень помогла мне, когда я была новенькой..."
42060-43 = "Но она не просто добрая. Каким бы безнадёжным ни был бой, Нико не паникует. Её способность сохранять спокойствие и оценивать ситуацию бесценна."
42060-44 = "Говорят, она ни разу не потеряла счёт патронам или припасам, использованным отрядом в операции, даже после всех хаотичных боёв."
42060-45 = "...В этом смысле, Моэ, тебе бы поучиться у Нико."
42060-46 = "Не отрицай, тебе самой иногда нравится высадить весь магазин до последнего патрона!"
42060-47 = "...Потом Куруми — местная ворчунья и боец переднего края FOX."
42060-49 = ""
42060-50 = "Ну, когда постоянно находишься на передовой, становишься немного дёрганой."
42060-51 = "Нельзя расслабляться ни на секунду. От этого может зависеть жизнь всего отряда."
42060-52 = "Но настоящая сила Куруми проявляется в быстрой и гибкой реакции на неожиданности."
42060-53 = "Ни засады, ни внезапные атаки её не выбивают. То, как она мгновенно оценивает местность и использует её в своих интересах под давлением, впечатляет."
42060-54 = ""
42060-55 = "Я тоже это о ней слышала."
42060-56 = "Когда оружие сломалось прямо посреди вражеской территории, она не потеряла ни секунды. Просто выхватила пушку у ближайшего врага и начала прорываться их же огневой мощью."
42060-57 = "На её месте я, наверное, следовала бы полевому руководству и пыталась чинить оружие. Не смогла бы развернуть ситуацию так, как она."
42060-58 = "Я больше умная по учебникам, чем по жизни, поэтому не могу не восхищаться чужой адаптивностью."
42060-59 = ""
42060-61 = ""
42060-62 = "Теперь Отоги, снайпер FOX..."
42060-64 = ""
42060-65 = "Я-я мало с ней общалась, но никогда не встречала такого снайпера..."
42060-66 = "Верная оценка. Она точно не обычный снайпер-одиночка, который предпочитает незаметно сидеть в укрытии."
42060-67 = "У Отоги врождённая харизма, которая захватывает всё помещение. В SRT прожектор будто сам следовал за ней."
42060-69 = "[ns] «Никогда не встречал снайпера с таким присутствием.»"
42060-70 = "В этом смысле она странная. Обычно снайпер должен быть тихим и невидимым, чтобы ударить незаметно. Но когда Отоги выходит на поле — ты знаешь."
42060-71 = "Однажды я сражалась против неё на учениях, и это было ужасно тяжело! Я постоянно была на нервах: не знала, откуда прилетит следующая пуля, но знала, что она где-то рядом..."
42060-72 = "Говорят, хороший снайпер нейтрализует трёх врагов каждым выстрелом."
42060-73 = "И хорошая координация важна, чтобы товарищи могли воспользоваться всей разведкой, которую ты собрала..."
42060-74 = "По сравнению с ней я... Иногда даже мои товарищи забывают, что я существую."
42060-75 = "Э-Это было один раз... и совсем не твоя вина..."
42060-76 = "Она права! Виновата идиотка, которая не заметила пропажу участницы! Не так сложно считать до трёх!"
42060-77 = "З-Заткнись! Всё было не так!"
42060-78 = ""
42060-80 = ""
42060-81 = "А потом Юкино, лидер FOX..."
42060-83 = ""
42060-85 = "Она же госпожа Совершенство. И в этот раз реально совершенная, а не как когда я дразню Саки."
42060-86 = "...Но это правда. Юкино нет равных. Она управляет и направляет движения отряда буквально по секундам."
42060-87 = "Этот отряд доверяет ей больше, чем самим себе. Если она скажет прыгнуть из самолёта без парашюта, они сделают это, полностью веря, что всё будет хорошо."
42060-89 = "[ns] «Это была весьма лестная оценка.»"
42060-90 = "Да... Эти старшие были нашей самой безумной мечтой."
42060-91 = "Мы стремились к ним. Они были нашими образцами."
42060-92 = "Всё, что способен сделать наш RABBIT, FOX не просто способен повторить... Они сделают лучше, быстрее, эффективнее и умнее."
42060-93 = ""
42060-96 = "[ns] «Ты удивишься, насколько несовершенны „идеальные“ люди.»"
42060-98 = "[ns] «И, Мияко? Отряд RABBIT незаменим.»"
42060-99 = ""
42060-100 = "...Думаете?"
42060-101 = "Наверное, трудно не думать иначе."
42060-102 = "Потому что Юкино в моей памяти, то, как она сияла на экране..."
42060-103 = "Хотя это неважно. Она казалась другой. Старше? Взрослее?"
42060-104 = "Может, пока её не было, она выросла... Где-то, куда я не могла попасть..."
42060-105 = "...Я столько всего не понимаю."
42060-106 = "Может, они правы. Если после всего мы так и не выросли, возможно, пора сдаться. Выполнять приказы и позволить тем, кто умнее и лучше нас, нести всю ответственность..."
42060-107 = "А чего хотели бы вы трое?"
42060-108 = "Даже если спрашиваете..."
42060-109 = "Это просто с-слишком всё навалилось..."
42060-110 = ""
42060-112 = ""
42060-114 = "Что это за звук?"
42060-115 = "Это экстренная трансляция Генерального студенческого совета...?"
42060-116 = "Думаете, связано с недавним нападением?!"
42060-117 = "Всем гражданам Кивотоса: критическое объявление."
42060-118 = "Через несколько мгновений будет сделано срочное заявление от имени Генерального студенческого совета Кивотоса."
42060-119 = "Просим всех жителей включить официальный канал Генерального студенческого совета или канал «Кронос», чтобы услышать это важное сообщение."
42060-120 = "Официальный канал Генерального студенческого совета?! Где мой телефон?!"
42060-121 = "Тут есть экран гораздо, гораздо больше."
42060-122 = "Посмотрите вверх."
42060-123 = "Это видео... на борту дирижабля?"
42060-125 = "Приветствую граждан Кивотоса."
42060-126 = "Я Ширануи Кая, глава Оборонного отдела Генерального студенческого совета Кивотоса."
42060-127 = "Прошу прощения за столь внезапное обращение, но вопрос срочный."
42060-128 = "В последнее время наш город столкнулся со множеством кризисов."
42060-129 = "Загадочная конструкция спустилась с неба, парализовав город и нанеся огромный ущерб не только D.U., но и районам всех академий."
42060-130 = "К сожалению, Генеральный студенческий совет не смог должным образом отреагировать на столь масштабный кризис и предложить решение. Вместо этого мы полагались на решения Шале и отдельных районов, чтобы уменьшить ущерб."
42060-131 = "Причиной стало отсутствие Нанагами Рин, исполняющей обязанности председателя Генерального студенческого совета, во время инцидента. В результате она отказалась от своих обязанностей."
42060-132 = "Критика её неспособности исполнить обязанности временной председательницы не прекращалась даже внутри Административного совета."
42060-133 = "И наконец сегодня был принят вотум недоверия главному администратору Нанагами."
42060-134 = "Я, Ширануи Кая, официально вступила в должность новой временной председательницы Генерального студенческого совета."
42060-135 = ""
42060-136 = "Что...? Новая временная председательница Генерального студенческого совета?!"
42060-137 = "Мы не относимся к этой смене легкомысленно."
42060-139 = "Мы понимаем, что многие из вас наверняка обеспокоены столь внезапной сменой руководства Генерального студенческого совета."
42060-140 = "Тем не менее мы намерены вернуть Кивотос к нормальной жизни и просим вашей поддержки для нового Административного совета, который будет сформирован."
42060-142 = "И напоследок..."
42060-143 = "Сенсей [USERNAME]."
42060-144 = "Уверена, вы сейчас где-то смотрите эту трансляцию, Сенсей."
42060-145 = "Ради будущего Кивотоса и Шале прошу исполнить мою просьбу, Сенсей [USERNAME]."
42060-146 = "Сразу после окончания трансляции просим вас прибыть в приёмную Генерального студенческого совета."
42060-147 = "Все члены Генерального студенческого совета с нетерпением ждут вашего визита."
42060-148 = "Спасибо и до свидания. Я с надеждой смотрю в будущее Кивотоса."
42060-149 = ""
42060-152 = ""
42060-153 = "[ns] «Что вообще происходит?»"
42060-155 = "...Генеральный студенческий совет переживает кризис."
42060-157 = "Следующий эпизод;Государственный переворот"
