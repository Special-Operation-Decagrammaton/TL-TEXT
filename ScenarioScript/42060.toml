[translation]
42060-1 = "Episódio 6;A Angústia das Calouras"
42060-2 = "Parque Kousagi"
42060-3 = "(De volta ao parque, ouvi a história do Esquadrão RABBIT.)"
42060-4 = "[ns] \"Então quem estava na Schale naquela hora era o Esquadrão FOX...\""
42060-5 = "Sim.#nDesculpe por não termos podido explicar a situação antes..."
42060-6 = "Saber que o Sensei correu perigo por nossa causa me deixa com a consciência pesada..."
42060-7 = "[s1] \"Tudo bem, não se preocupem com isso.\"\n[s2] \"A culpa não é de vocês.\""
42060-8 = "Mas... nós estávamos aqui no parque acampando tranquilamente, sem saber de nada..."
42060-9 = "Mas... nós estávamos aqui no parque acampando tranquilamente, sem saber de nada..."
42060-10 = "E o Sensei até nos pagou aquela carne cara...#nO Sensei disse que era um agradecimento, mas, na verdade, nós é que devíamos estar pedindo desculpas..."
42060-11 = "Só que já comemos a carne toda... e mesmo se quiséssemos pagar, o pouco que temos não daria nem para o cheiro..."
42060-12 = "Desse jeito... só nos resta dar todas as nossas marmitas vencidas de todo dia para o Sensei...!"
42060-13 = "[s] \"N-Não precisa, está tudo bem mesmo...!\""
42060-14 = "A única forma de nos redimirmos agora é recuperar o que as veteranas levaram da Schale."
42060-15 = "...Embora eu ainda tenha dúvidas se conseguiremos fazer isso enfrentando as veteranas do Esquadrão FOX."
42060-16 = "Aliás, o que diabos as veteranas levaram da Schale?"
42060-17 = "Deve ser algo cuja falta o Sensei nem notou, não é?#nPelas imagens da câmera, não parecia ser nada muito grande..."
42060-19 = "Tipo uma lata de atum bem cara...?"
42060-20 = "Ou a roupa íntima do Sensei...?"
42060-22 = "...Nem quero imaginar as veteranas se infiltrando na Schale totalmente armadas só para roubar a roupa íntima do Sensei..."
42060-26 = "[ns] \"...Vamos deixar isso de lado por enquanto.\""
42060-28 = "[ns] \"Primeiro, quero que me contem sobre o Esquadrão FOX.\""
42060-29 = "Sobre o Esquadrão FOX... bem..."
42060-30 = "Se eu pudesse resumir em uma frase—"
42060-31 = "—É a unidade de forças especiais mais capaz de Kivotos."
42060-32 = "Se falarmos apenas de poder de combate convencional, existem várias alunas em outras academias à altura da SRT.#nMas, em operações sob condições especiais, não há grupo que supere o Esquadrão FOX."
42060-33 = "Forças especiais são treinadas não apenas para combates comuns, mas para cumprir missões nas mais diversas situações."
42060-34 = "Entre elas, pode-se dizer que o Esquadrão FOX é a unidade ideal, reunindo todas as habilidades que a SRT exige."
42060-35 = "Por exemplo, a sublíder, Niko-senpai—"
42060-38 = "Ela é tipo a \"mãezona do esquadrão\", sempre cuidando de todo mundo com carinho."
42060-39 = "Ela até fazia inarizushi caseiro e levava para as equipes antes das operações em campo..."
42060-40 = "Ela era uma veterana tão querida por todas que até integrantes de outros esquadrões iam pedir conselhos a ela."
42060-42 = "Quando eu acabei de entrar na academia, a Niko-senpai também me ajudou bastante..."
42060-43 = "Porém, apesar da personalidade gentil, ela também tem a frieza necessária para tomar decisões precisas mesmo no meio do caos."
42060-44 = "Dizem os boatos que ela consegue memorizar a quantidade exata de munição e suprimentos gastos durante toda uma operação."
42060-45 = "...Pensando nisso, Moe, que tal seguir um pouco o exemplo da Niko-senpai?"
42060-46 = "Ei! Descarregar toda a munição de uma vez é puro romance!"
42060-47 = "...Em comparação, a Kurumi-senpai vivia estressada."
42060-50 = "Mas ela também é o exemplo perfeito de ponta de lança, sempre mantendo a guarda alta nas operações."
42060-51 = "Na linha de frente, se você baixar a guarda por um segundo que seja, já era."
42060-52 = "Além disso, a Kurumi-senpai tem a capacidade de se adaptar com flexibilidade a qualquer situação."
42060-53 = "Dizem que, mesmo sob emboscadas ou imprevistos no meio de uma missão, ela nunca entra em pânico#ne consegue abrir caminho usando o terreno ao redor."
42060-55 = "Eu já ouvi essa história também."
42060-56 = "Parece que uma vez a arma dela emperrou bem no meio do território inimigo,#ne ela tomou a arma de um adversário para romper o cerco, né?"
42060-57 = "...Incrível.#nSe fosse comigo, acho que eu tentaria consertar a arma seguindo o manual e acabaria arruinando a operação."
42060-58 = "Para alguém como eu, só aquela flexibilidade de raciocínio já é um talento invejável."
42060-62 = "A Otogi-senpai é a franco-atiradora do Esquadrão FOX—"
42060-65 = "Eu nunca conversei muito com ela, mas... ela passava uma impressão diferente dos outros franco-atiradores..."
42060-66 = "É, ela não era do tipo lobo solitário que fica num canto dobrando traje ghillie."
42060-67 = "A Otogi-senpai chama bastante atenção...#nMesmo dentro da Academia Especial SRT, ela estava sempre no centro das atenções."
42060-69 = "[ns] \"Chamar atenção não é uma má ideia para uma franco-atiradora?\""
42060-70 = "Nem tanto. Se o objetivo for apenas abater um alvo, tudo bem,#nmas para conter a infantaria inimiga no meio de um tiroteio, é preciso impor certa presença."
42060-71 = "Uma vez enfrentei a equipe da Otogi-senpai num treinamento,#ne a pressão de não saber de onde o tiro viria me impediu de avançar..."
42060-72 = "Dizem que um bom franco-atirador consegue neutralizar três ou mais inimigos com um único disparo..."
42060-73 = "Além disso... para aproveitar bem as informações de reconhecimento, a coordenação com os aliados é essencial..."
42060-74 = "Comparada a ela, eu... até as minhas próprias aliadas esquecem que eu existo..."
42060-75 = "E-Eu já disse que aquilo não foi culpa da Miyu..."
42060-76 = "Foi culpa da Saki, que é tão tonta que nem sabe contar quantas integrantes tem no esquadrão."
42060-77 = "Cala a boca!"
42060-81 = "Por último, a líder, Yukino-senpai—"
42060-85 = "...Aquela ali é tão perfeita que nem tem defeitos~"
42060-86 = "Pois é, afinal dizem que ela coordenava os movimentos do esquadrão com precisão de segundos."
42060-87 = "As companheiras confiam muito nela... se for uma ordem da Yukino-senpai,#nparece que o Esquadrão FOX aceita qualquer missão..."
42060-89 = "[ns] \"Elas são muito bem conceituadas, pelo visto...\""
42060-90 = "...As veteranas eram o nosso sonho."
42060-91 = "Nosso objetivo a alcançar, alguém que admirávamos."
42060-92 = "Afinal, em toda e qualquer missão—o Esquadrão FOX sempre se sai melhor do que o Esquadrão RABBIT."
42060-96 = "[ns] \"Não existe ninguém perfeito neste mundo.\""
42060-98 = "[ns] \"E eu acho que há coisas que só vocês conseguem fazer.\""
42060-100 = "...Será mesmo?"
42060-101 = "Mas, pelo menos, é assim que eu vejo."
42060-102 = "Só que... naquela época, a Yukino-senpai brilhava tanto que chegava a ofuscar..."
42060-103 = "Por que ela diz coisas daquele tipo agora?#nParece até um adulto que já desistiu de tudo..."
42060-104 = "Será que ela mudou em algum lugar que eu desconheço...?"
42060-105 = "...Eu não entendo mais nada."
42060-106 = "Por sermos crianças, deveríamos deixar a responsabilidade com as veteranas—e apenas obedecer ao que nos dizem...?"
42060-107 = "...O que vocês acham?"
42060-108 = "Mesmo que pergunte para mim..."
42060-109 = "E-Eu não sei..."
42060-114 = "Isso é..."
42060-115 = "Um alerta de emergência do Conselho Estudantil Geral...?"
42060-116 = "Não pode ser, de novo...!?"
42060-117 = "<Atenção, cidadãos de Kivotos.>"
42060-118 = "<Em instantes, o Conselho Estudantil Geral de Kivotos fará um pronunciamento de emergência.>"
42060-119 = "<Solicitamos que todos os cidadãos sintonizem o canal oficial do Conselho Estudantil Geral#nou o Canal Kronos.>"
42060-120 = "O canal oficial do Conselho Estudantil Geral?#nOnde eu deixei meu celular...?"
42060-121 = "...Não, acho que não vai precisar do celular."
42060-122 = "Olhem ali."
42060-123 = "No dirigível... tem uma transmissão..."
42060-125 = "Olá a todos os cidadãos de Kivotos."
42060-126 = "Sou Kaya Shiranui, Chefe do Gabinete de Defesa do Conselho Estudantil Geral de Kivotos."
42060-127 = "Peço profundas desculpas por causar preocupação aos cidadãos com um pronunciamento tão repentino."
42060-128 = "...Ultimamente, Kivotos foi atingida por uma série de desastres sem precedentes."
42060-129 = "Estruturas não identificadas caídas do céu paralisaram o funcionamento da cidade,#ncausando danos severos não apenas no D.U., mas também em todos os distritos autônomos."
42060-130 = "Contudo, o Conselho Estudantil Geral deixou a resolução dessa crise a cargo da Schale e dos distritos autônomos,#nconcentrando-se apenas nos trabalhos de reconstrução. Considero isso profundamente vergonhoso."
42060-131 = "...Todos esses problemas decorrem do fato de que a responsável final—e Presidente Interina do Conselho Estudantil Geral, Rin Nanagami—desapareceu durante o incidente e abandonou suas responsabilidades."
42060-132 = "Diante disso, o Gabinete de Defesa apurou a responsabilidade da Administradora Nanagami..."
42060-133 = "E finalmente hoje—a moção de desconfiança contra a Administradora Nanagami, que estava pendente, foi aprovada."
42060-134 = "Sendo assim, eu, Kaya Shiranui, assumo como a nova Presidente Interina do Conselho Estudantil Geral."
42060-136 = "Nova Presidente Interina do Conselho Estudantil Geral?!"
42060-137 = "A Presidente Interina do Conselho Estudantil Geral não deveria poder ser trocada assim tão facilmente..."
42060-139 = "Compreendo que os cidadãos estejam surpresos#ncom essa mudança repentina na Presidência Interina do Conselho Estudantil Geral."
42060-140 = "No entanto, faremos o nosso melhor pela \"normalização\" de Kivotos,#nportanto peço o apoio de todos ao novo comitê administrativo."
42060-142 = "...E, por fim."
42060-143 = "Sensei [USERNAME]."
42060-144 = "Imagino que o Sensei também esteja assistindo a esta transmissão em algum lugar."
42060-145 = "Pelo futuro de Kivotos e da Schale, gostaria de conversar sobre um assunto importante com o Sensei [USERNAME]."
42060-146 = "Assim que esta transmissão terminar, por favor, compareça à sala de recepção do Conselho Estudantil Geral."
42060-147 = "Todo o Conselho Estudantil Geral aguarda ansiosamente a sua chegada."
42060-148 = "Até breve."
42060-153 = "[ns] \"...O que significa isso?\""
42060-155 = "...Parece que algo está acontecendo no Conselho Estudantil Geral."
42060-157 = "Próximo;Golpe de Estado"
