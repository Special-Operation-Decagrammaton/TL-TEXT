[translation]
1009705-1 = "Информация о логистике"
1009705-3 = "Рано утром, пока мы с Моэ прогуливались вдоль причала..."
1009705-4 = ""
1009705-9 = ""
1009705-10 = "Эй, это же рыбак!"
1009705-11 = "Привет! Ну что, сегодня хороший улов?"
1009705-12 = ""
1009705-14 = ""
1009705-15 = ""
1009705-16 = "...А, это ты, Казэкура."
1009705-17 = "Ну, сегодня мы и правда поймали больше обычного, но..."
1009705-18 = "Ого, это же махи-махи? Всё хранилище ими забито!"
1009705-19 = "Вы столько наловили! Вот это удачный день!"
1009705-20 = "Можно... и так сказать."
1009705-21 = "А? Что-то не так? Для человека, вернувшегося с полным уловом, ты выглядишь не слишком радостным."
1009705-22 = "Ну..."
1009705-24 = ""
1009705-25 = "А, вам не хватает места для хранения рыбы?"
1009705-26 = "Да. Ред Хук Экспресс, компания, которая занималась переработкой и доставкой морепродуктов в этом городе, какое-то время не сможет работать..."
1009705-27 = "Они ищут нового покупателя, поэтому пока деревня может переработать лишь ограниченное количество морепродуктов."
1009705-28 = "А ведь мы не можем съесть всю эту рыбу разом или просто заморозить её всю..."
1009705-29 = "[s] «Получается, большой улов стал скорее головной болью, чем удачей.»"
1009705-30 = "Но что тогда делать со всей этой рыбой? Не выбрасывать же..."
1009705-31 = "Что ж, остаётся только сделать кусая."
1009705-32 = "...Кусая?"
1009705-33 = "Да, это традиционный способ засолки, который уже давно передаётся в деревне. Если сделать кусая, рыба сможет храниться как минимум год."
1009705-34 = "Тогда проблема решена! Чего вы переживаете?"
1009705-35 = "Ну... кусая продавать сложнее, чем обычную рыбу."
1009705-36 = "Блюдо настолько специфическое, что даже некоторые местные его терпеть не могут. Продать его приезжим будет непросто."
1009705-37 = "Никогда бы не подумал, что слишком хороший улов тоже может стать проблемой..."
1009705-38 = ""
1009705-40 = ""
1009705-41 = ""
1009705-42 = "Хм... Думаю, я могу помочь."
1009705-43 = "Дайте минутку. Сейчас всё настрою..."
1009705-44 = ""
1009705-46 = ""
1009705-48 = ""
1009705-49 = "Просто добавим сюда адрес и название товара... Готово!"
1009705-50 = "Вот, попробуйте это приложение."
1009705-51 = "Зачем?"
1009705-52 = "Это приложение для прямых поставок. Через него можно рекламировать местные товары напрямую по всему Кивотосу."
1009705-53 = "Если кто-то из другого региона захочет купить кусая, приложение вас уведомит."
1009705-54 = "Да ладно, сколько вообще найдётся людей, которым захочется кусая...?"
1009705-55 = ""
1009705-57 = ""
1009705-58 = ""
1009705-60 = "Правда, что запах этой солёной рыбы почти достигает значения AU 1000?"
1009705-61 = "Я слышал, кто-то устроил стрим с испытанием по поеданию кусая, и просмотры взлетели до небес..."
1009705-62 = "Когда все говорят мне «ты это не съешь», мне наоборот хочется попробовать!"
1009705-63 = "Хочу подарить это другу, который обожает испытания!"
1009705-64 = "Я давно искал возможность попробовать морепродукты с ещё более резким запахом."
1009705-65 = ""
1009705-66 = "Что за...? Число заказов уже выросло до десятков, сотен, тысяч... десятков тысяч!"
1009705-67 = "В Кивотосе правда столько людей, которые хотят попробовать кусая...?"
1009705-68 = "Хи-хи... У всех разные вкусы."
1009705-69 = "Каким бы спорным ни было блюдо, если искать по всему Кивотосу, наверняка найдётся немало людей, которым оно нравится."
1009705-70 = "К тому же сейчас в интернете популярны челленджи с необычной едой... поэтому я и подумала, что будет много просто любопытных."
1009705-71 = "Ого... с таким количеством заказов мы продадим и весь сегодняшний улов, И все оставшиеся запасы!"
1009705-72 = "Мне лучше вернуться к площадке для сушки и начать всё готовить. Огромное спасибо за помощь!"
1009705-73 = ""
1009705-75 = ""
1009705-76 = ""
1009705-77 = ""
1009705-78 = ""
1009705-79 = "Что такое, Сенсей? Вы выглядите... недоверчиво."
1009705-80 = "[s1] «Ну, не то чтобы я сомневался в тебе, Моэ, но...»\n[s2] «Просто не ожидал, что ты придумаешь такое.»"
1009705-83 = "Эй, не всё же я решаю с помощью взрывчатки!"
1009705-84 = "Я знаю, когда стоит что-то делать, а когда — нет."
1009705-85 = "...Кроме того, в этой ситуации есть свой разрушительный элемент. Хи-хи-хи..."
1009705-86 = "[s] «В каком смысле...?»"
1009705-87 = "Подумай сама. Если кусая начнут продавать по всему Кивотосу, ВОНЬ от неё распространится повсюду."
1009705-88 = "И это ещё не всё: всё больше людей начнут её любить, и тогда эту вонь уже будет не остановить!"
1009705-89 = "Ха-а... У меня мурашки по коже от одной мысли об этом...!"
1009705-90 = "[s3] «У меня есть вопросы к твоим мотивам, но...»\n[s4] «...Ну, всё хорошо, что хорошо кончается.»"
1009705-91 = ""
1009705-92 = ""
1009705-95 = "[ns5] «Раз уж ты ДЕЙСТВИТЕЛЬНО решила проблему, я угощу тебя чем-нибудь вкусным.»\n[ns6] «Есть что-нибудь, что ты хочешь съесть?»"
1009705-98 = "Что-нибудь вкусное..."
1009705-99 = "А, кстати, слышала, в этой деревне есть блюдо под названием «набэ с кусая»."
1009705-100 = "Говорят, от него воняет ещё сильнее, чем от просто жареной кусая."
1009705-101 = "Сенсей... Хотите вместе со мной забить нос этим ужасным запахом? Хи-хи..."
1009705-103 = "Так мы с Моэ отправились в ресторан в рыбацкой деревне и попробовали набэ с кусая."
1009705-104 = "Кусая оказалась вкусной, но... запах ещё долго не выветривался из носа. И изо рта."
