[translation]
1004402-1 = "Иногда бывают такие дни"
1004402-2 = "Я пришёл в вестибюль, и Нономи помахала мне."
1004402-3 = ""
1004402-5 = ""
1004402-6 = ""
1004402-7 = "Сенсей, сюда. Сюда!"
1004402-8 = "Я вас ждала!"
1004402-9 = "[s1] «Нономи...? Что это за сумки?»\n[s2] «Зачем ты столько всего взяла?»"
1004402-12 = "А, это?"
1004402-13 = "Хи-хи. Ну..."
1004402-14 = "Чтобы понять, действительно ли место подходит, мне ведь придётся побыть там какое-то время."
1004402-15 = "Поэтому я взяла с собой всего несколько вещей."
1004402-16 = ""
1004402-18 = ""
1004402-19 = "Зонтик, коврик, закуски, стул..."
1004402-20 = ""
1004402-22 = ""
1004402-23 = "И соки разных вкусов!"
1004402-24 = "У меня три вида: апельсиновый, яблочный и виноградный..."
1004402-25 = "А? Хотите помочь, потому что тяжело?"
1004402-26 = "Хи-хи. Я так и думала, что вы это скажете!"
1004402-27 = "Но всё хорошо!"
1004402-28 = "Я ценю это, но вы и так уже делаете мне одолжение."
1004402-29 = ""
1004402-31 = ""
1004402-32 = ""
1004402-34 = "И я всё упаковала так, чтобы справиться сама. Не хочу нарушать раскладку. Я просто рада, что вы идёте со мной!"
1004402-35 = "[s3] «Ну, раз ты настаиваешь...»\n[s4] «Если станет тяжело — скажи. Я помогу.»"
1004402-36 = ""
1004402-37 = ""
1004402-39 = "Есть, сэр! А теперь идём! ☆"
1004402-45 = ""
1004402-46 = "Ого... Куда ни пойдём — везде так красиво! Не знаю, как выбрать!"
1004402-47 = ""
1004402-49 = ""
1004402-50 = "Как вам здесь?"
1004402-51 = "Не слишком далеко..."
1004402-52 = "Места много, и ветерок приятный!"
1004402-53 = "Для начала давайте разложим вещи..."
1004402-54 = ""
1004402-56 = ""
1004402-57 = "Хм? Сенсей! Что такое?"
1004402-58 = "...?"
1004402-59 = "Хотите ананасового сока? Я сейчас разложу вещи и достану его..."
1004402-60 = ""
1004402-62 = ""
1004402-63 = "А?"
1004402-64 = ""
1004402-66 = ""
1004402-67 = "Ахаха... Простите, Сенсей. Я не взяла ананасовый сок. Но, кажется, он есть в холле..."
1004402-68 = "Подождите минутку! ☆"
1004402-69 = "Я схожу и принесу вам!"
1004402-70 = ""
1004402-72 = ""
1004402-73 = "Скоро буду!"
1004402-74 = ""
1004402-76 = ""
1004402-77 = "[ns5] «...Тогда начнём.»\n[ns6] Начать раскладывать вещи."
1004402-84 = ""
1004402-85 = "Я вернулась, Сенсей!"
1004402-86 = "Вот ваш ананасовый сок!"
1004402-87 = ""
1004402-89 = ""
1004402-90 = "А?"
1004402-91 = "Сенсей! Что вы сделали?"
1004402-92 = "[s7] «Я всё разложил, пока ждал тебя.»\n[s8] «Неплохо, да?»"
1004402-93 = ""
1004402-94 = ""
1004402-96 = ""
1004402-97 = "...Ага."
1004402-98 = "Так вот зачем вы попросили ананасовый сок..."
1004402-99 = "Хм-м, я же сказала, что не надо беспокоиться."
1004402-100 = "Наверное, это просто ваша натура... но сегодня я хотела побаловать вас."
1004402-101 = "Неважно?"
1004402-102 = "Но вы сделали всё это ради меня..."
1004402-103 = ""
1004402-105 = ""
1004402-106 = "Разве это не было тяжело? Расстелить коврик, поставить зонтик, разложить стулья..."
1004402-107 = "[s9] «Я сделал это для тебя, а не из-за тебя, Нономи.»\n[s10] «Ты всегда помогаешь другим. Ты это заслужила.»"
1004402-108 = ""
1004402-109 = ""
1004402-111 = ""
1004402-112 = "Сенсей..."
1004402-113 = "...Хи-хи."
1004402-114 = "Вы уверены, что не пожалеете об этих словах?"
1004402-115 = "Если вы будете так со мной обращаться, я могу привыкнуть к тому, что вы меня балуете."
1004402-116 = "Я ведь могу стать обузой, знаете?"
1004402-117 = "[s11] «Конечно, уверен.»\n[s12] «Я этого и ждал! Давай, не сдерживайся!»"
1004402-118 = "Хи-хи-хи..."
1004402-119 = "Хи-хи-хи..."
1004402-120 = "Я так взволнована."
1004402-121 = "Ага, ага!"
1004402-122 = "Но на сегодня хватит."
1004402-123 = "Я очень благодарна за ваши слова..."
1004402-124 = "Но я не хочу пользоваться добротой дорогого мне человека. Наверное, когда мне действительно понадобится помощь, я попрошу вас."
1004402-125 = "Когда этот момент наступит..."
1004402-126 = ""
1004402-128 = ""
1004402-129 = ""
1004402-131 = "...пожалуйста, не отказывайте мне, хорошо?"
