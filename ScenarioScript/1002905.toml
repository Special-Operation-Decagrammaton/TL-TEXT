[translation]
1002905-1 = "Раскопки и открытие"
1002905-2 = "(Следуя указаниям Нацу, я добрался до торгового района на окраине Тринити.)"
1002905-3 = "(Окраина выглядела запущенной: старые закрытые здания и ни души вокруг.)"
1002905-4 = "Сенсей. Вы пришли. Рада вас видеть."
1002905-5 = ""
1002905-8 = ""
1002905-9 = "Я думала, вам будет трудно добраться до такого удалённого места, но, к счастью, вы даже пришли вовремя."
1002905-10 = "Я позвала вас сюда, потому что одна из самых романтичных вещей в мире..."
1002905-11 = "— разделить момент открытия с кем-то ещё!"
1002905-12 = "[s1] «Момент открытия?»\n[s2] «Разделить с кем-то ещё?»"
1002905-13 = "Ага. Я хотела разделить с вами это грандиозное, историческое, единственное в жизни событие, Сенсей."
1002905-14 = "Ага. Я хотела разделить с вами это грандиозное, историческое, единственное в жизни событие, Сенсей."
1002905-15 = "Какое событие? Какое открытие?"
1002905-16 = "Не торопитесь. Такие вещи всё равно никуда не убегут."
1002905-17 = "В мире есть вещи, которые простояли бесчисленные века. Они не обидятся, если я потрачу ещё несколько минут."
1002905-18 = "Хи-хи-хи. Это место идеально подходит под определение «сокровищница»."
1002905-19 = "Забытая кондитерская!"
1002905-20 = "[s3] «Забытая кондитерская?»\n[s4] «То есть это заброшенный магазин?»"
1002905-21 = "Именно! Забытая кондитерская — городская легенда, которую студенты Тринити передают с незапамятных времён."
1002905-22 = "Именно! Забытая кондитерская — городская легенда, которую студенты Тринити передают с незапамятных времён."
1002905-23 = "Это часть долгой и богатой истории школы. Место, где за всё это время появлялись и исчезали бесчисленные сладости!"
1002905-24 = "Чудесный склад, словно музей, идеально сохранившийся именно потому, что о нём забыли и никто сюда не ходил!"
1002905-25 = ""
1002905-27 = ""
1002905-28 = ""
1002905-30 = "И это именно то место, которое случайно нашла я! Я! Нацу!"
1002905-31 = "Я нашла подсказки, доказывающие его существование! И само его местоположение!"
1002905-32 = "И поэтому!"
1002905-33 = ""
1002905-35 = ""
1002905-36 = "..."
1002905-37 = "Я попыталась войти, но в последний момент струсила. Всё-таки это заброшенное здание."
1002905-38 = "[s5] «То есть ты хочешь пойти вместе, потому что тебе страшно.»\n[s6] «А. Мне нравится, что ты проявляешь инициативу.»"
1002905-39 = "Эй! Как жестоко. Я даю вам шанс увидеть что-то крутое, так что будем считать, что мы квиты, ладно?"
1002905-40 = "Эй! Как жестоко. Я даю вам шанс увидеть что-то крутое, так что будем считать, что мы квиты, ладно?"
1002905-41 = ""
1002905-43 = ""
1002905-44 = "Вон то здание, Сенсей. Видите? Выглядит немного жутковато, правда? Правда ведь?"
1002905-45 = "Оно выглядит настолько мрачно, что даже хулиганы не стали бы использовать его как убежище."
1002905-46 = "Ну, по крайней мере благодаря этому Забытая кондитерская и сохранилась."
1002905-47 = "А теперь пойдём внутрь, Сенсей! Давайте, давайте!"
1002905-48 = "Пошли! Уже!"
1002905-50 = "(Здание, в которое я вошёл вслед за Нацу, оказалось очень старым и полуразрушенным, как она и говорила.)"
1002905-51 = "(Некоторые детали отделки и конструкции здесь уже не встретишь в современных зданиях. Место действительно было древним.)"
1002905-56 = "Когда входили, мы были такими уверенными, но теперь, когда оказались внутри, стало немного страшно."
1002905-57 = "Но, согласно моему расследованию, кондитерская должна быть прямо за тем углом."
1002905-58 = "Хм? Что?"
1002905-59 = "Вы сильно расстроитесь, если мы проделали весь этот путь и ничего не найдём?"
1002905-60 = "...Хаха."
1002905-61 = "Ну, вы правы. Пройти такой путь и найти лишь пустое помещение... Такое вполне возможно."
1002905-62 = "Это точно будет огромным разочарованием. Я так старалась найти это место и так в него верила."
1002905-63 = "Но, Сенсей, романтика требует и побед, и разочарований."
1002905-64 = "Не волнуйтесь. Я готова."
1002905-65 = "Готова и к победе, и к грусти."
1002905-66 = ""
1002905-68 = ""
1002905-69 = "Теперь нам нужно только пройти дальше и..."
1002905-70 = ""
1002905-71 = "Если встать здесь, то это должно быть точно..."
1002905-72 = "Забытая кондитерская!"
1002905-73 = ""
1002905-75 = ""
1002905-76 = "...!"
1002905-79 = "― Смотрите, Сенсей! Потрясающе...[wa:1550]"
1002905-81 = "― Здесь всё забито до отказа![wa:10]"
1002905-84 = "― Такое я вижу впервые! И это тоже впервые![wa:1210]"
1002905-86 = "― Столько сладостей, которых я никогда раньше не видела![wa:10]"
1002905-89 = "― Фух. Простите.[wa:1500]"
1002905-91 = "― Такое чувство, будто ноги вдруг перестают меня держать.[wa:10]"
1002905-94 = "― Спасибо, Сенсей.[wa:2090]"
1002905-96 = "― Что пришли со мной.[wa:130]"
1002905-99 = "― Я правда очень благодарна.[wa:2480]"
1002905-101 = "― Я так рада, что смогла сделать это открытие вместе с вами.[wa:1900]"
1002905-104 = "Что вы сказали? Думаете, это нельзя есть, потому что всё слишком старое?"
1002905-105 = "Ахахаха. Это я понимаю. Ну конечно же!"
1002905-106 = "Но я всё равно счастлива?"
1002905-107 = "Разумеется."
1002905-108 = "Я пришла сюда не искать еду. Я пришла сделать историческое открытие!"
1002905-109 = "Это место идеально! Нужно сделать кучу фотографий, загрузить их в соцсети и поделиться со всеми!"
1002905-110 = ""
1002905-112 = ""
1002905-113 = ""
1002905-114 = ""
1002905-115 = "Сейчас выберу несколько для загрузки и..."
1002905-116 = ""
1002905-117 = "Хм-м."
1002905-118 = ""
1002905-120 = ""
1002905-121 = "[ns7] «Нацу?»\n[ns8] «Почему ты перестала загружать фотографии?»"
1002905-122 = "...Нет."
1002905-123 = "...Нет."
1002905-124 = "Вообще-то, я больше не хочу этим делиться."
1002905-125 = "Если я расскажу об этом и люди узнают, что это место действительно существует, любопытные наверняка начнут его искать."
1002905-126 = "Скоро одно посещение превратится в два, два — в десять, и не успеешь заметить, как это место полностью изменится."
1002905-127 = "Кто-нибудь наверняка утащит что-то на сувенир, а от постоянного потока людей вся магия исчезнет."
1002905-128 = "Я этого не хочу. Хочу, чтобы это место осталось в точности таким, какое оно сейчас."
1002905-129 = "Интересуетесь, как же тогда я расскажу о нём людям?"
1002905-130 = "Разве я не хотела доказать его существование и поделиться этим со всеми?"
1002905-131 = "Хи-хи. Вы правы. Поначалу именно этого я и хотела."
1002905-132 = ""
1002905-134 = ""
1002905-135 = ""
1002905-137 = "...Но я передумала."
1002905-138 = "Меня всё устраивает."
1002905-139 = "То, что мы никому не расскажем, не изменит того факта, что мы здесь были."
1002905-140 = "И не изменит того, как я воспринимаю историю, которой наслаждаюсь прямо сейчас."
1002905-141 = ""
1002905-143 = ""
1002905-144 = ""
1002905-146 = "Надеюсь, это место и дальше останется таким, как есть. Навсегда."
