[translation]
52180-1 = "Episódio 18;Mesma Cama, Sonhos Diferentes"
52180-3 = "Hmph... Nggghhhhh...!"
52180-4 = "Só... mais um pouquinho...!"
52180-8 = "Kikyou, para de ficar olhando e vem ajudar!"
52180-9 = "Essas grades estão quase abrindo espaço o suficiente pra alguém passar... Quase lá!#n...Que droga...!"
52180-10 = "Por que você não para de perder tempo com isso e poupa um pouco de energia?"
52180-11 = "Elas nem colocaram guardas aqui... Ou seja, têm certeza absoluta de que não vamos conseguir escapar."
52180-12 = "E é por isso que a gente tem que ficar parada?!#nTemos que tentar tudo o que der, não acha?!"
52180-13 = "Ah... Eu estou pensando em um plano de fuga agora.#nNem todo mundo resolve as coisas na base da força bruta e da teimosia como você."
52180-14 = "Pra começo de conversa, se não tivéssemos acreditado naquela Ayame desde o início..."
52180-15 = "É, nisso você tem razão, mas..."
52180-16 = "S-Se você tem alguma ideia, desembucha logo!"
52180-17 = "Fica quieta um segundo, eu preciso me concentrar!"
52180-18 = "O quê?! Kikyou, sua—!"
52180-19 = "K-Kikyou-senpai, Renge-senpai! Por favor, acalmem-se!"
52180-20 = "Não é hora para ficarmos discutindo...!"
52180-26 = "[ns1] \"Que barulheira toda é essa...\"\n[ns2] \"...Quanto tempo será que eu apaguei?\""
52180-29 = "Sensei [USERNAME]!"
52180-30 = "Mestre!"
52180-31 = "Sensei, você está bem? Se machucou?"
52180-32 = "[s3] \"Sim, estou com um pouco de dor de cabeça, mas estou bem.\"\n[s4] \"E vocês, ninguém se feriu?\""
52180-37 = "Relaxa. A gente só levou uns arranhões leves."
52180-38 = "Para integrantes do Hyakkaryouran, isso não é absolutamente nada!"
52180-40 = "[ns] \"Onde estamos...?\""
52180-41 = "No subsolo da \"Mansão Higan\"."
52180-42 = "Nós perdemos a luta contra o Clube Beleza da Natureza... e fomos trazidas para cá."
52180-43 = "Há um depósito parecido no subsolo da casa Kadenokouji... mas usá-lo como cela é simplesmente ultrajante."
52180-44 = "Tsc, se ao menos nossas balas funcionassem contra aquelas malditas..."
52180-45 = "[s5] \"Clube Beleza da Natureza...?\"\n[s6] \"O que aconteceu?\""
52180-48 = "Resumindo a história—"
52180-49 = "Tudo o que vimos e ouvimos daquela mulher no Distrito Autônomo do Norte era mentira."
52180-51 = "(Elas me explicaram tudo o que aconteceu enquanto eu estava desacordado.)"
52180-59 = "[ns] \"...Quem diria que a Azami era uma das integrantes do Clube Beleza da Natureza.\""
52180-60 = "Sim. Uma presidente que parecia tão gentil... Estou em choque."
52180-61 = "Era tudo teatro para nos enganar desde o começo.#nSó de lembrar daquele sorriso, já me dá arrepios."
52180-62 = "Então o distrito da Filial Ebisu e os moradores também eram todos falsos...?"
52180-63 = "Não, acho que aquelas pessoas não têm nada a ver com isso."
52180-64 = "Por mais poderoso que o Hyakumonogatari seja, duvido que consiga criar até os ingredientes usados no festival."
52180-65 = "Além disso, alguns moradores reagiram à Azami Habu como se estivessem vendo ela pela primeira vez."
52180-66 = "[s] \"Então... a Ayame também era falsa?\""
52180-67 = "Pois é, sobre isso..."
52180-68 = "Nós também ficamos na dúvida e perguntamos para a Nagusa-senpai, que ficou com a Ayame-senpai até o final, mas..."
52180-69 = "Só que não sabemos exatamente o que houve...#nA Nagusa-senpai está completamente abatida desde então."
52180-74 = "[ns7] \"...Você está bem?\"\n[ns8] \"Está se sentindo mal?\""
52180-77 = "...Estou bem."
52180-78 = "Me desculpem... Foi por causa da minha incompetência que todas vocês correram perigo."
52180-79 = "Você não tem culpa de nada, senpai! A culpa é toda do Clube Beleza da Natureza!"
52180-80 = "Exatamente, Nagusa-senpai! Você deu o seu melhor por todas nós!"
52180-81 = "Não vai adiantar nada ficar se culpando agora."
52180-82 = "Quem causou tudo isso não foi você, foi a Ayame-senpai, não foi?"
52180-83 = "...Não, a culpa não é da Ayame.#nEla não fez nada de errado."
52180-84 = "Hã?"
52180-85 = "No fim das contas, fui eu quem nunca conseguiu entender a Ayame—"
52180-86 = "É isso mesmooo. A culpa é toda sua por ter se entregado a um sonho tão conveniente.#nNão é, Nagusa-chan?"
52180-92 = "Shuro Yabuki...!"
52180-93 = "Aha, ahahaha!"
52180-94 = "Mas que cena mais patética é essaaa?"
52180-95 = "Onde foi parar toda aquela marra de antes, hein?"
52180-96 = "Não me diga que... você nem desconfiou que aquela Ayame tão gentil era falsa?#nVocê conseguiu confundir até a melhor amiga com quem tanto sonhava?"
52180-100 = "...É tudo mentira."
52180-101 = "Você só estava fechando os olhos para uma realidade inconveniente, não é mesmooo?"
52180-102 = "Entendi... Então a Ayame-senpai que encontramos não era a verdadeira."
52180-103 = "Sim, certíssimooo!"
52180-104 = "A melhor amiga surgindo heroicamente para salvar as companheiras em apuros num reencontro emocionante... Conveniência tem limite, não acham?"
52180-105 = "Aquela Ayame... ou melhor, \"aquilo\", era o \"medo\" da Nagusa-chan, nascido do livro amaldiçoado \"Toutei Bukkairoku\"!"
52180-106 = "M-Mas aquela pessoa era tão radiante... Jamais pareceria ser algo como o medo."
52180-107 = "Como sempre, você não sabe de nadinha, não é?"
52180-108 = "O medo, às vezes, vem disfarçado de felicidade, sabia?"
52180-109 = "Uma felicidade de sonho que você passou a vida inteira negando no fundo do coração.#nNão existe nada mais assustador do que ver isso se tornar realidade, né?"
52180-113 = "Quanto mais você saboreia uma felicidade falsa... mais nítida fica a realidade cruel."
52180-114 = "Ngh..."
52180-115 = "É poooor isso que você nunca vai conseguir substituir a Ayame, Nagusa-chan."
52180-116 = "O que você sabe sobre a Nagusa-senpai, sua pirralha?!"
52180-117 = "Aha! Não adianta nada dar chilique, sabia?"
52180-118 = "Não importa o quanto chorem ou fiquem furiosas, a realidade não vai mudar."
52180-119 = "Por mais que vocês se esforcem, nunca vão chegar nem aos pés daquela Ayame!"
52180-120 = "No fim, peças descartáveis destinadas a ir pro lixo não conseguem fazer nada mesmo!"
52180-121 = "[s] \"Shuro, quero te perguntar uma coisa.\""
52180-122 = "O que foiii?"
52180-123 = "Já estou cheia de ouvir seus papinhos furados."
52180-124 = "Choro de perdedor não me comove nem um pouquinho, tá?"
52180-125 = "[s9] \"Você sabia de tudo desde o começo, não sabia?\"\n[s10] \"Aquela hora em que a Ayame atirou em você também foi atuação?\""
52180-131 = "...Hã?"
52180-132 = "Era essa bobagem que queria perguntar? Que broxante."
52180-133 = "Claro que sim, né? Tudo, tudiiinho não passou de uma encenação para capturar vocês."
52180-134 = "Tanto ser pega por \"aquilo\", quanto atrair vocês até a Mansão Higan..."
52180-138 = "...Quê?"
52180-139 = "...Sensei de Schale?"
52180-142 = "Até usar você de escudo, tudo, tudo—"
52180-143 = "...Tsc, foi tudo uma atuação para a Kokuriko-sama!"
52180-146 = "[ns11] \"Sei que não estou em posição de falar nada estando preso aqui...\"\n[ns12] \"E talvez você já esteja cansada de ouvir isso, mas...\""
52180-149 = "[ns13] \"...Fingir ser algo que você não é não tem nada de errado.\"\n[ns14] \"Todo mundo faz isso em algum momento.\""
52180-152 = "[ns] \"Mas, justamente por isso... não desvie o olhar das suas próprias ações.\""
52180-154 = "[ns] \"Você só fez o que achou que precisava fazer, não foi, Shuro?\""
52180-155 = "Ha, haha... Olha só o que você vem me dizer."
52180-156 = "Tá tentando me convencer a mudar de lado com esse discurso bonito?"
52180-157 = "Acha mesmo que eu vou trair a Kokuriko-sama só porque você me salvou?"
52180-158 = "Você vive mesmo no mundo da lua, hein..."
52180-159 = "Que pensamento infantil e ridículo, parece até brincadeira de casinha..."
52180-160 = "É tudo um delírio idiota, igualzinho àquela Kuzunoha em que vocês acreditam!"
52180-164 = "...Kuzunoha."
52180-165 = "...Por que será que ela me salvou naquele dia?"
52180-166 = "Por que eu, em vez da Ayame... Teria sido melhor se ela tivesse me deixado lá..."
52180-167 = "Hã? Do que você está falando?"
52180-168 = "Fala como se tivesse encontrado a Kuzunoha de verdade..."
52180-169 = "[s15] \"Kuzunoha não é só um conto de fadas.\"\n[s16] \"Eu mesmo já recebi uma carta dela através da Nagusa.\""
52180-172 = "Kuzunoha... existe mesmo?"
52180-173 = "A origem de todos os livros amaldiçoados e a primeira Presidente do Hyakkaryouran... a Grande Profetisa Kuzunoha?"
52180-174 = "Que absurdo... Vocês estão tirando onda com a minha cara, né?#nSe for isso—!"
52180-181 = "Não, espera..."
52180-182 = "A Kokuriko-sama disse que a Nagusa estava no meio da grande planície nevada naquela época... e mesmo assim voltou viva."
52180-183 = "Quem poderia ter salvado a Nagusa num deserto de neve onde nem as feras chegam perto...?"
52180-184 = "E o Sensei de Schale... pode até falar um monte de besteira, mas não mente..."
52180-185 = "Se a Grande Profetisa Kuzunoha estiver mesmo... no Templo do Crepúsculo..."
52180-186 = "Será que dá para criar um livro amaldiçoado no lugar do \"Inou Mononokeroku\" que perdemos...?#nSe eu conseguir... até a Kokuriko-sama vai passar a me..."
52180-192 = "...Que pena, que peninha mesmo, Nagusa-chan.#nDeve estar se sentindo pisando em brasas agora, né?"
52180-193 = "Ah, pobre Nagusa-chan.#nEu sinto pena de você do fundo do meu coração."
52180-194 = "E que tal se eu, na minha imensa bondade, desse uma oportunidade para a pobre Nagusa-chan?"
52180-195 = "...Uma oportunidade?"
52180-196 = "Existe alguém que você quer salvar custe o que custar, não existe, Nagusa-chan?"
52180-201 = "Então é só ir encontrar ela de novo... a Kuzunoha."
52180-203 = "Próximo;Memórias da Outra Margem"
