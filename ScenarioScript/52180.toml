[translation]
52180-1 = "Эпизод 18;На разных страницах"
52180-3 = "У-у-ух... Н-н-н..."
52180-4 = "Ещё немного... Совсем немного и..."
52180-5 = ""
52180-7 = ""
52180-8 = "Не стой и не смотри, Кикё! Помоги разогнуть эти прутья!"
52180-9 = "Почти получилось! Ещё чуть-чуть — щель станет достаточно большой, чтобы пролезть!"
52180-10 = "Или, может, лучше сохранить те крохи сил, что у нас остались, для того, что ждёт дальше, вместо того чтобы тратить их на бесполезные попытки."
52180-11 = "Оглянись. Возле нашей камеры нет ни одного охранника. Они уверены, что побег невозможен, не говоря уже о... разрывании железных прутьев."
52180-12 = "И что?! Ты предлагаешь просто сидеть и ничего не делать?"
52180-13 = "Я. Думаю. Попробуй допустить, что грубая сила и одно упрямство не всегда являются решением."
52180-14 = "Если бы ты просто поверила моим сомнениям насчёт президента Аямэ, мы бы вообще не оказались в этой ситуации."
52180-15 = "Тут мне нечем крыть..."
52180-16 = "Ну хорошо! Тогда где твой умный выход, который придумал твой умный мозг, а?! Давай!"
52180-17 = "Моему «умному» мозгу было бы гораздо проще думать без твоего бесконечного трёпа!"
52180-18 = "Ч-Что вы только что сказали?!"
52180-19 = "К-Кикё, Рэнгэ! Пожалуйста, успокойтесь!"
52180-20 = "Сейчас совсем не время спорить..."
52180-21 = ""
52180-22 = ""
52180-25 = ""
52180-26 = "[ns1] «Что за шум...?»\n[ns2] «...Сколько я вообще спал?»"
52180-29 = "Сенсей [USERNAME]!"
52180-30 = "...Наставник!"
52180-31 = "Как вы, Сенсей? Нигде не ранены?"
52180-32 = "[s3] «Голова немного болит, но всё нормально.»\n[s4] «А вы все целы?»"
52180-33 = ""
52180-35 = ""
52180-37 = "Пара царапин, ничего серьёзного."
52180-38 = "Быть участницей Хяккарёран — значит быть крепкой и телом, и духом! Для нас это обычное дело!"
52180-39 = ""
52180-40 = "[ns] «Хорошо... но где мы?»"
52180-41 = "Это подземная тюрьма Особняка Запределья."
52180-42 = "Похоже, «Красота природы» заперла нас здесь после победы."
52180-43 = "В доме Кадэнокодзи тоже есть похожий подземный склад... но я никогда не думала, что его можно использовать как тюрьму..."
52180-44 = "Чёрт. Если бы только наши пули действовали на этих тварей...!"
52180-45 = "[s5] «Красота природы»...?\n[s6] «Что произошло, пока я был без сознания?»"
52180-48 = "Если коротко..."
52180-49 = "Весь наш опыт в северном районе был иллюзией поверх иллюзии."
52180-51 = "Кикё объяснила всё, что случилось после того, как я потерял сознание."
52180-53 = ""
52180-56 = ""
52180-59 = "[ns] «...Не могу поверить, что Азами была участницей „Красоты природы“.»"
52180-60 = "Именно! Я всё ещё в шоке! Как такой добрый президент могла оказаться членом «Красоты природы» и всё это время строить против нас козни?"
52180-61 = "С самого начала мы играли по их сценарию. Коварство за её фальшивой улыбкой... Ц. Меня мутит от одной мысли."
52180-62 = "Погодите. Значит, район возле Эбису и все жители, которых мы встретили, тоже были фальшивыми? Жутко..."
52180-63 = "Нет. К Ста Историям о призраках они отношения не имели. Они были настоящими."
52180-64 = "Ста Историям не хватает силы, чтобы сотворить фальшивый урожай для фестиваля."
52180-65 = "И если помните, даже некоторые жители не знали Азами."
52180-66 = "[s] «Тогда... Аямэ тоже была фальшивой?»"
52180-67 = "Насчёт этого..."
52180-68 = "Мы пришли к тому же выводу, что и вы, а Нагуса была последней, кто видел президента Аямэ до нашего пленения."
52180-69 = "Но с тех пор как мы проснулись, она... немного молчит."
52180-70 = ""
52180-72 = ""
52180-73 = ""
52180-74 = "[ns7] «...Ты в порядке, Нагуса?»\n[ns8] «Нигде не ранена?»"
52180-77 = "...Я в порядке."
52180-78 = "Просто... моя некомпетентность снова подвергла всех опасности... Нет извинения, способного меня оправдать."
52180-79 = "Ты ни в чём не виновата! Это всё эти психи из «Красоты природы»!"
52180-80 = "Она права, Нагуса! Ты сделала всё возможное, чтобы защитить нас всех!"
52180-81 = "Нагуса. Ты расстроена, но вина лежит не на тебе."
52180-82 = "Есть только один человек, на кого можно указать пальцем. Президент Аямэ должна исправить свои ошибки."
52180-83 = "...Нет. Не так. Аямэ ничего плохого не сделала."
52180-84 = "...Нагуса!"
52180-85 = "Если бы я только попыталась как следует её понять... Аямэ..."
52180-86 = "Именно. Это твоя вина — ты цеплялась за удобный сон и верила в то, во что хотела верить.#nРазве не так, Нагуса?"
52180-87 = ""
52180-89 = ""
52180-90 = ""
52180-91 = ""
52180-92 = "Ябуки Сюро...!"
52180-93 = "Аха-ха, АХАХАХА!"
52180-94 = "Тебе очень идёт это жалкое выражение лица."
52180-95 = "Куда делись вся твоя бравада и решимость? Похоже, в итоге ты навсегда останешься всхлипывающей и ползающей на коленях Нагусой."
52180-96 = "Ты серьёзно хочешь, чтобы мы поверили, будто не поняла, что Аямэ была фальшивкой? Что не узнала подругу, которая преследует каждый твой сон?"
52180-97 = ""
52180-99 = ""
52180-100 = "...Ложь."
52180-101 = "Ты отвернулась от неудобной реальности ради своих жалких желаний."
52180-102 = "Значит, мы были правы? Президент Аямэ была фальшивкой?"
52180-103 = "Разумеется."
52180-104 = "Подруга, которая внезапно появляется именно когда ты в опасности, спасает тебе жизнь и говорит ровно то, что ты хочешь услышать? Такое бывает только в детских книжках!"
52180-105 = "Та Аямэ... точнее, существо, похожее на неё, на самом деле было страхом Нагусы, рождённым магией проклятого тома — «Фантомных иллюстраций Тоутэй»!"
52180-106 = "Страхом Нагусы? Но она вообще не была страшной..."
52180-107 = "Как всегда ничего не понимаешь, да, Кадэнокодзи?"
52180-108 = "Конечно, страх может выглядеть как кошмарное чудовище, но некоторые... некоторые боятся счастья."
52180-109 = "Нереалистичная фантазия! Счастье, которого ты так хочешь, хотя глубоко-глубоко внутри понимаешь, что таким неблагодарным, как ты, оно недоступно! Разве не страшно, когда нечто, чего ты не заслуживаешь, внезапно оказывается на расстоянии вытянутой руки?"
52180-110 = ""
52180-112 = ""
52180-113 = "Чем больше ты наслаждаешься этим фантастическим счастьем, тем больнее потом ударяет реальность."
52180-114 = "Угх..."
52180-115 = "Вот почему Горё Нагусе никогда не сравниться с Нанакадо Аямэ."
52180-116 = "Ты ничего не знаешь о Нагусе!"
52180-117 = "А-ха-ха! Отрицай, отрицай, отрицай. Старайся сколько хочешь."
52180-118 = "Можешь вопить, кричать и рыдать сколько угодно — реальность всё равно будет ждать, чтобы тебя встретить."
52180-119 = "Что бы ты ни делала, тебе никогда не сравниться с Аямэ."
52180-120 = "Одноразовая. Вот кто ты. Мусор, который выбросят, как только перестанешь быть полезной."
52180-121 = "[s] «Сюро, мне кое-что интересно.»"
52180-122 = "Что такое, Сенсей Шале?"
52180-123 = "Если собираешься действовать мне на нервы своей занудной чушью — не трать дыхание."
52180-124 = "Тебя поймали! Ты проиграл! Меня не заденут слова ПРОИГРАВШЕГО!"
52180-125 = "[s9] «Сюро, ты всё знала с самого начала, да?»\n[s10] «То, что фальшивая Аямэ подстрелила тебя, тоже было частью спектакля?»"
52180-128 = ""
52180-130 = ""
52180-131 = "...А?"
52180-132 = "Серьёзно? Вот что ты хочешь спросить?"
52180-133 = "Ну да-а-а. Каждая сцена была идеально поставлена и выстроена так, чтобы привести к большому финалу: пленению тебя и Хяккарёран."
52180-134 = "И то, как меня поймала фальшивая Аямэ, и то, как я заманила вас в Особняк Запределья..."
52180-138 = "...А?"
52180-139 = "...Сенсей Шале?"
52180-141 = ""
52180-142 = "Даже в самом конце, когда я использовала тебя как щит..."
52180-143 = "...всё было притворством ради исполнения желаний Кокурико!"
52180-144 = ""
52180-146 = "[ns11] «Возможно, тебе не хочется слышать это от пленника.»\n[ns12] «И, может, тебе уже надоело, что я повторяю это снова и снова...»"
52180-149 = "[ns13] «...но ничего страшного в том, чтобы притворяться кем-то другим, нет.»\n[ns14] «В конце концов, все так делают — так или иначе.»"
52180-150 = ""
52180-151 = ""
52180-152 = "[ns] «Но взамен... никогда не закрывай глаза на собственные поступки.»"
52180-154 = "[ns] «Ты делала то, что считала необходимым, Сюро.»"
52180-155 = "Ха! Ха-ха-ха! А я-то думала, ты наконец скажешь что-нибудь интересное."
52180-156 = "Решил очаровать меня красивыми словами?"
52180-157 = "Поэтому ты меня тогда спас? Хотел убедить предать Кокурико и помочь ТЕБЕ?"
52180-158 = "Серьёзно. Ты и твои нелепые фантазии."
52180-159 = "Как маленький ребёнок, играющий понарошку."
52180-160 = "Прямо как та Кузуноха, в которую вы все верите. Живёте своими иллюзиями."
52180-161 = ""
52180-163 = ""
52180-164 = "...Кузуха."
52180-165 = "Если бы только... Кузуноха оставила меня умирать на Великом снежном поле."
52180-166 = "Почему она спасла меня... а не Аямэ? Миру было бы лучше, если бы она поступила наоборот."
52180-167 = "Что за чушь ты опять несёшь, Нагуса?"
52180-168 = "Теперь хочешь притвориться, будто реально встречала Кузуноху?"
52180-169 = "[s15] «Кузуноха — не просто персонаж легенды.»\n[s16] «Нагуса лично передала мне письмо от самой Кузунохи.»"
52180-172 = "Ты серьёзно говоришь... что Кузуноха реальна?"
52180-173 = "Великая Пророчица Кузуноха, источник всех проклятых томов и первый президент Хяккарёран...?"
52180-174 = "Если вы всё ещё пытаетесь со мной играть—"
52180-175 = ""
52180-177 = ""
52180-178 = ""
52180-179 = ""
52180-181 = "Если подумать, кое-что действительно не сходится."
52180-182 = "Кокурико говорила, что оставила Нагусу посреди Великого снежного поля, вдали от любой цивилизации. Тогда как она выжила?"
52180-183 = "Даже животные не заходят в тот район. Никто не мог просто случайно её найти."
52180-184 = "К тому же этот Сенсей Шале... как бы он ни изгибал обстоятельства, он ни разу не лгал..."
52180-185 = "Если Великая Пророчица Кузуноха действительно существует и скрывается в Сумеречном храме где-то на Великом снежном поле..."
52180-186 = "...Мы сможем создать новый том взамен утраченных «Фантомных записей Ино»!"
52180-187 = ""
52180-189 = ""
52180-191 = ""
52180-192 = "Какая же ты жалкая, Нагуса. Брошенная подругой, измученная виной и ненавистью к себе..."
52180-193 = "Мне тебя настолько жалко..."
52180-194 = "...что, пожалуй, дам тебе последний шанс, Нагуса."
52180-195 = "...Шанс?"
52180-196 = "Именно. Ведь хоть ты и всё испортила, всё равно цепляешься за крошечную надежду, что сможешь спасти подругу, правда?"
52180-197 = ""
52180-199 = ""
52180-201 = "...Тогда найди для меня Кузуноху."
52180-203 = "Следующий эпизод;Воспоминания из Запределья"
