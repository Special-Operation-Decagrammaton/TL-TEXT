[translation]
10042050-1 = "Эпизод 5;КАКОЙ ЧУДЕСНЫЙ ДЕНЬ"
10042050-2 = "Как странно."
10042050-3 = "[s] «Что именно?»"
10042050-4 = "След обрывается здесь. Больше нет слизи — точнее, сиропа — и никто им не покрыт."
10042050-5 = "В-Вместо этого..."
10042050-6 = "Похоже, последняя жертва просто упала сама по себе."
10042050-7 = "Возможно, его поведенческий шаблон изменился."
10042050-8 = "[s1] «Шаблон»...\n[s2] «Похоже, ты начинаешь втягиваться, Чинацу.»"
10042050-11 = "П-Подождите, когда это я успела стать специалистом по всему этому...?!"
10042050-12 = "Для начала возьмём образец. Уверена, на той пострадавшей что-нибудь найдётся."
10042050-15 = "Эй? Вы в порядке? ...Плохо дело. Она не реагирует."
10042050-16 = "Не просыпается, хм? Для такого у меня как раз есть средство."
10042050-17 = ""
10042050-19 = ""
10042050-20 = ""
10042050-21 = "А, ну конечно есть, Сэна!"
10042050-22 = ""
10042050-24 = ""
10042050-25 = "И-и-и!!"
10042050-26 = "Ай, мои уши! Какого чёрта?!"
10042050-27 = "[s] «...Тебе вообще можно так делать?»"
10042050-28 = "Эй, когда нужно срочно кого-то разбудить, именно так это и делают."
10042050-29 = "Эм... Сэна? Разве мы обычно не используем этот метод, чтобы усмирить буйствующего или проверить, действительно ли студент без сознания, а не притворяется...?"
10042050-30 = "Это тоже вполне допустимые применения, Чинацу. Метод универсальный и подходит для множества ситуаций."
10042050-31 = "А когда имеешь дело со студентом Геенны, иногда приходится быть безжалостной."
10042050-32 = "Она может быть в критическом состоянии. Насколько «безжалостной» с ней вообще нужно быть?"
10042050-33 = "Прошу прощения за Сэну. Она бывает немного..."
10042050-34 = "...О, смотрите! Она приходит в себя! Быстрее, зададим ей кучу вопросов."
10042050-36 = "Ух, где я? Что я здесь делаю?"
10042050-37 = ""
10042050-38 = "Вы какое-то время были без сознания. А теперь слушайте внимательно. Вы помните что-нибудь о живом блинчике?"
10042050-39 = "О блинчике...?! Постойте, раз вы заговорили об этом, кажется, я... А-А-А!!"
10042050-40 = "Блинчик!! Безжалостный, гигантский, фиолетовый блинчик!!"
10042050-41 = "Технически это не блинчик. Оно лишь на него похоже."
10042050-42 = "Мы сейчас охотимся за ним. Нам пригодилась бы ваша помощь, если хотите пойти с нами."
10042050-43 = ""
10042050-45 = ""
10042050-46 = "Пойти с вами...?"
10042050-47 = "Ха, ха-ха..."
10042050-48 = ""
10042050-50 = ""
10042050-51 = "Ни за что... Ни за что! Это же будет ловушка смерти!"
10042050-52 = "Вы! Я! Все мы! От этого не уйти!"
10042050-53 = "[s3] «Ч-Что вы такое говорите?!»\n[s4] «Спокойнее! Не нужно кричать!»"
10042050-56 = "Она в панике."
10042050-57 = ""
10042050-60 = "*ахает*"
10042050-61 = "Все, прячьтесь!"
10042050-62 = "Вон там."
10042050-63 = ""
10042050-65 = ""
10042050-68 = "Все здесь? Никого не потеряли?"
10042050-69 = "...О нет."
10042050-70 = "Ч-Что же это?"
10042050-71 = "Посмотрите туда."
10042050-72 = "Ха. С возвращением. Долго же тебя не было."
10042050-73 = "Я голодна, а ты привёл целый шве-е-едский стол."
10042050-74 = "О чём она говорит?"
10042050-75 = "Она загнана в угол, поэтому проявляет агрессию. Обычная реакция."
10042050-77 = "Да здесь вообще НИЧЕГО обычного нет!"
10042050-78 = ""
10042050-80 = ""
10042050-82 = "Мы все участвуем в одной большой гонке, и смерть — финишная черта. Каждый день мы продолжаем бежать к ней."
10042050-83 = "Даже ты. Куда бы ты ни ползло, оставляя липкий след сиропа, каждая капля привела тебя сюда, ко мне."
10042050-84 = "Да, именно так, видишь меня? Видишь эту пушку?! Ну давай!"
10042050-85 = "Я сказала, смотри на меня! На меня! Сюда!"
10042050-86 = "О-хо-хо, какой чудесный день!"
10042050-87 = "Если кто-то встанет у тебя на пути — рассмейся ему в лицо!"
10042050-88 = "Если кто-то тебе угрожает — разорви его в клочья!"
10042050-89 = "А когда увидишь необъяснимое, неизбежное..."
10042050-90 = "ПРИМИ ЭТО ВСЕМ СВОИМ ЧЁРТОВЫМ СЕРДЦЕМ!!"
10042050-91 = ""
10042050-93 = ""
10042050-98 = "[ns5] «...Что ж, это один из способов эффектно уйти.»\n[ns6] «Ого...»"
10042050-101 = "...Она ведь не умерла только что, правда?"
10042050-102 = "Казалось, что была готова, но нет, её жизни ничего не угрожает."
10042050-103 = "Она определённо получила пару нестандартных травм, но по степени тяжести всё вполне укладывается в норму."
10042050-104 = "И снова: что здесь вообще нормального?"
10042050-105 = "Помни, почти все здесь получают травмы в клубных драках или потасовках с хулиганами."
10042050-106 = "Конечно, ваш Клуб школьной столовой всегда занят собственной работой..."
10042050-107 = "...поэтому ты можешь не до конца осознавать, насколько обычны такие вещи в академии Геенны."
10042050-108 = "...За что, если честно, тебе стоит быть весьма благодарной."
10042050-109 = "(Благодарной? Серьёзно...?)"
10042050-110 = ""
10042050-112 = ""
10042050-113 = "[ns] «Да что это вообще ЗА место такое?»"
10042050-114 = "Место, где солнце восходит и садится, где в столовой подают обед в обеденное время, а у Клуба экстренной медицинской помощи всегда есть новые тела, то есть «пациенты», о которых нужно заботиться."
10042050-115 = "То тут, то там случаются неприятности, но Геенна будет катиться дальше, как всегда."
10042050-116 = "И конечно, пока Дисциплинарный комитет и его глава держат курс, мы..."
10042050-117 = "...Простите. Не стоило мне хвастаться такими вещами."
10042050-118 = ""
10042050-120 = ""
10042050-122 = "Кстати, все ведь только что почувствовали, как задрожала земля?"
10042050-123 = "Что может иметь достаточную массу, чтобы вызвать такую дрожь?"
10042050-124 = "Раньше я и правда слышала те глухие удары..."
10042050-125 = "Именно."
10042050-126 = "И, возможно, «поиски» нам больше не нужны."
10042050-127 = "[s] «Что... ты имеешь в виду?»"
10042050-128 = "Лучше один раз показать, чем объяснять."
10042050-129 = "Вон там."
10042050-132 = "[log]Не сказав больше ни слова, Сэна указала вдаль.[/log]"
10042050-135 = "[log]Там мы все увидели...[/log]"
