[translation]
10046260-2 = ""
10046260-3 = "Вж-ж-ж..."
10046260-4 = "Вж-ж-ж-ж..."
10046260-5 = "..."
10046260-6 = "Простите! Мне придётся вас остановить."
10046260-7 = "А-А? Вы обращаетесь к Изуне?"
10046260-8 = "Если тебя зовут именно так — да. К какой организации ты относишься?"
10046260-9 = "Изуна — ниндзя!"
10046260-10 = "Хм, ниндзя-превышатель скорости..."
10046260-11 = "...Ниндзя?"
10046260-12 = "Ниндзя, ниндзя... Простите, но это какая-то... дочерняя школа?"
10046260-13 = "О! Изуна — студент Объединённой академии Хяккияко!"
10046260-14 = "...!"
10046260-15 = "А, понятно. Ты... фанатка. Косплеишь."
10046260-16 = "Ип?!"
10046260-17 = "Э-Это не косплей!"
10046260-18 = "Изуна всё ещё тренируется, но она настоящий ниндзя!"
10046260-19 = "А? О, понятно... Настоящий ниндзя..."
10046260-20 = "...Так что такой ниндзя, как ты, делает здесь?"
10046260-21 = "Тренирует ниндзюцу!"
10046260-22 = "В последнее время Изуне казалось, что она топчется на месте. Песок даёт новую местность и новые испытания!"
10046260-23 = "Ого... Она сказала «ниндзюцу»..."
10046260-24 = "Кстати, а кто вы?"
10046260-25 = "Раз вам удалось раскусить Песчаную технику скрытности стиля Изуны... Вы явно выдающаяся личность!"
10046260-26 = "Техника скрытности...? А, ты про то, как махала этой тканью...?"
10046260-27 = "Я Ичика из Оперативной группы Правосудия. Как видишь, патрулирую пляж."
10046260-28 = "Оперативная группа Правосудия...! Тайная подпольная организация, стремящаяся к справедливости!"
10046260-29 = "Изуна так сосредоточилась на личных тренировках, что даже не поняла, что есть такой вариант..."
10046260-30 = "Если вы позволите, может Изуна присоединиться к вашей секретной миссии?"
10046260-31 = "...А? Эм... То есть ты хочешь помочь?"
10046260-32 = "Если готова, лишняя пара рук мне пригодится!"
10046260-33 = "Тогда Изуна вступает в ваши ряды!"
10046260-34 = ""
10046260-36 = ""
10046260-37 = ""
10046260-38 = ""
10046260-39 = "...М-да, мои стандарты заметно упали."
