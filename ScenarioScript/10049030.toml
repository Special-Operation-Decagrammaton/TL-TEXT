[translation]
10049030-1 = "Эпизод 3;Слишком много восторгов по волшебницам"
10049030-2 = "[log]3 дня назад, в комнате отдыха Библиотечного комитета...[/log]"
10049030-4 = "Я придумала!"
10049030-5 = "Ты придумала..."
10049030-6 = "Что?"
10049030-7 = ""
10049030-9 = ""
10049030-10 = "Давайте станем волшебницами!"
10049030-11 = "Х-Хи-хи... Никогда не думала, что мне правда выпадет шанс сказать такое."
10049030-12 = "«Спецвыпуск „Волшебница Тяжёлого Калибра“ в Пограничье»...? Что это?"
10049030-13 = "В Парке развлечений Пограничья проходит специальное мероприятие по «Волшебнице Тяжёлого Калибра»!"
10049030-14 = "Я вижу, что тут НАПИСАНО, но что это значит?"
10049030-16 = "По всему парку будут выступать несколько актёрских трупп в костюмах."
10049030-17 = "Здесь написано: «Из-за размера площадки на территории одновременно будут работать несколько составов персонажей.»"
10049030-18 = "Хорошо, но Рейса, какое это имеет отношение к нам?"
10049030-19 = "Мы можем проникнуть туда ПОД ВИДОМ волшебниц."
10049030-20 = "Там несколько составов, так что уверена, никто не заметит одну-две лишних!"
10049030-21 = "И где бы мы ни оказались в парке, мы не будем выглядеть чужими!"
10049030-23 = "Все команды приезжают извне, поэтому сотрудники парка вообще ничего не заподозрят!"
10049030-24 = "Хм, верно..."
10049030-25 = "Смутно помню, что очень давно видела это шоу. Его показывали по утрам для маленьких детей?"
10049030-26 = "Нет, вовсе нет! То есть да, его показывают утром... но!"
10049030-27 = "«Волшебница Тяжёлого Калибра» — эпическая история о команде девушек, защищающих Кивотос от вторжения злой офицерши Эры!"
10049030-28 = "П-Понятно..."
10049030-29 = "Но если мы ДЕЙСТВИТЕЛЬНО переоденемся этими персонажами, в бою окажемся в невыгодном положении."
10049030-30 = "Мы ведь не можем надеть кевлар поверх косплея..."
10049030-31 = "И раз уж речь о материалах, я вообще ни с чем из этого не знакома..."
10049030-32 = "К тому же я никогда не смотрела шоу про волшебниц..."
10049030-33 = "И ещё... будет немного неловко..."
10049030-34 = "А. Эм, понимаю."
10049030-35 = "Ладно, я просто подумала, что это может помочь. Надо же. Я придумала хорошую идею."
10049030-36 = "Ничего. Придумаю что-нибудь ещё."
10049030-37 = ""
10049030-39 = ""
10049030-40 = "Н-Нет, я не это имела в виду! Просто, эм..."
10049030-41 = "...эти костюмы и правда отлично подойдут для проникновения!"
10049030-42 = "Кто увидит нас в таком, сразу ПОЙМЁТ, что мы пришли не драться!"
10049030-43 = "Сузуми...?"
10049030-45 = "Ну, может быть, но всё-таки волшебницы немного детские, и..."
10049030-46 = "В-Вовсе нет! По-моему, «Волшебница Счастливая Гулливер» звучит потрясающе."
10049030-48 = "Разве не «Тяжёлого Калибра»?"
10049030-49 = "Да! Так даже лучше!"
10049030-50 = "...И с косплеем я справлюсь. Мне лишь нужна базовая информация о шоу."
10049030-51 = "Рейса, похоже, ты о нём много знаешь."
10049030-52 = "Ещё бы! Я огромная фанатка!"
10049030-53 = "Они в каком-то смысле похожи на линчевателей, потому что защищают мир во всём мире."
10049030-54 = "Я любила их с детства!"
10049030-55 = "Я даже смотрела фильм, который недавно вышел!"
10049030-56 = "И знаешь, до сих пор у меня как-то не было возможности ни с кем об этом поговорить..."
10049030-57 = "..."
10049030-58 = ""
10049030-60 = ""
10049030-62 = "Нам, эм, пора бы начинать работать над косплеем."
10049030-63 = "Типа, СРОЧНО. Просто скажи, каких персонажей рекомендуешь, Рейса."
10049030-65 = "Сузуми?!"
10049030-66 = ""
10049030-68 = ""
10049030-69 = "Правда?! Я сразу подготовлю для тебя заметки!"
10049030-70 = ""
10049030-72 = ""
10049030-74 = "(Интересно, зачем я это сказала...)"
10049030-75 = "(То есть Рейсе идея понравилась, и, НАВЕРНОЕ, она работает, но...)"
10049030-76 = "(...носить это от этого не легче.)"
10049030-77 = "Я знала, что тебе пойдёт! Ну же, не стесняйся!"
10049030-78 = "Я рада, что отдала тебе роль главной героини! У тебя идеально получается вайб протагониста, Сузуми."
10049030-79 = "...То есть «Термитовая Белая»!"
10049030-80 = "«Т-Термитовая Белая»...?"
10049030-81 = "Мы под прикрытием, помнишь? Нельзя использовать настоящие имена. Поэтому будем называть друг друга именами персонажей!"
10049030-82 = "А я «Термитовая Розовая», лучшая подруга и напарница Термитовой Белой!"
10049030-83 = "П-Понятно. Рэй—"
10049030-84 = ""
10049030-87 = ""
10049030-88 = ""
10049030-89 = "...Эм, Термитовая Розовая..."
10049030-90 = ""
10049030-92 = ""
10049030-93 = "...Так, погоди, тебя зовут Термитовая Розовая..."
10049030-94 = "...но костюм у тебя фиолетовый. Разве тогда и имя не должно быть таким?"
10049030-95 = "А! Хороший вопрос!"
10049030-96 = ""
10049030-98 = ""
10049030-99 = ""
10049030-101 = "[log=레이사 매지컬]Чтобы это объяснить, надо вернуться к тому моменту, когда я впервые посмотрела «Волшебницу Тяжёлого Калибра».#nПонимаешь, сначала у Термитовой Розовой Камень Сердца и розовое платье как часть основного образа! Но когда у неё начинаются проблемы#nв бою с верным слугой Эры, Серебряной Пластиной, в серии «Захват болта! Тяжёлый Калибр!»,#nона объединяется с Белой через Слияние Дружбы. Несмотря на новые силы, они[/log]"
10049030-102 = "[log=레이사 매지컬]вдвоём всё равно не могут победить Серебряную Пластину и падают. Их враг, Серебряная Пластина...[/log]"
10049030-103 = "[log=레이사 매지컬]...[/log]"
10049030-105 = ""
10049030-107 = "П-Погоди..."
10049030-108 = ""
10049030-109 = "[log=레이사 매지컬]...И как раз когда они уже собираются отправить энергию дружбы на планету ненависти,#nРозовая появляется в этом костюме и побеждает их. И поэтому...[/log]"
10049030-117 = "...Вот почему Розовая выглядит иначе! Я выбрала её костюм специальной трансформации, потому что очень люблю тот эпизод! Иными словами, это не базовая форма Розовой. Так она выглядит, когда пробуждает настоящую силу!"
10049030-118 = "П-Понятно... Это помогло..."
10049030-119 = "Кстати, Рэй... Термитовая Розовая. Ты связалась с Шимико?"
10049030-120 = "Это «Эра», злая офицерша!"
10049030-121 = "Точно. Эра. Где она?"
10049030-122 = "Не знаю. Я не смогла с ней связаться."
10049030-123 = "Интересно, она всё ещё спит..."
10049030-124 = "Раз мы вызвали её как подкрепление, то на месте с большинством ситуаций должны справиться вдвоём."
10049030-125 = "Но надеюсь, с ней ничего не случилось."
10049030-126 = ""
10049030-129 = ""
10049030-130 = "Это Маширо из Отряда справедливости. Я здесь для поддержки. Отряд линчевателей, приём?"
10049030-132 = "Приём."
10049030-133 = "Термитовая Розовая на связи. Приём."
10049030-135 = "Хорошо, вас обеих слышно громко и чётко. Если понадобится поддержка, свяжитесь со мной по этому каналу."
10049030-136 = "Я на обзорной башне, на территории Тринити."
10049030-138 = "Принято. Отмечу."
10049030-140 = "А вы, Сенсей? Приём?"
10049030-141 = "[s] «Громко и чётко.»"
10049030-142 = "Хорошо. Зовите, если понадоблюсь."
10049030-144 = "Канал связи открыт."
10049030-145 = "Спасибо за помощь, Маширо."
10049030-146 = ""
10049030-148 = ""
10049030-150 = "П-Погоди, «Сенсей»?!"
10049030-151 = "Сенсей!"
10049030-152 = "[s1] «Привет, Сузуми, Рейса.»\n[s2] «Здравствуйте, Термитовая Белая и Розовая.»"
10049030-156 = "К-К-Когда вы успели прийти?!"
10049030-157 = ""
10049030-159 = ""
10049030-160 = "А-А, этот костюм нужен для...!"
10049030-161 = "[s3] «Я пришёл прямо перед тем, как ты впервые вышла.»\n[s4] «Тебе идёт, Сузуми.»"
10049030-165 = "Хасуми сказала, что вам понадобится немедленная поддержка на месте."
10049030-166 = "Из доступных людей были только Сенсей и я, а я не могу покинуть башню."
10049030-167 = "Мне никто не говорил, что Сенсей будет здесь!"
10049030-168 = "А? Ты не знала, Сузуми?"
10049030-169 = "Конечно нельзя!"
10049030-171 = "Хасуми сказала, что поддержит нас «настолько, насколько сможет», и привлечение Сенсея было частью этого."
10049030-172 = "Больше она ничего не сказала."
10049030-173 = "П-Понятно. Я просто не ожидала поддержки от Шале."
10049030-174 = "[s5] «Что ж, рад её оказать, Сузуми.»\n[s6] «Да и здесь выглядит весело!»"
10049030-177 = "(Приятно снова увидеть Сенсея, впервые за долгое время...)"
10049030-178 = "(Но всё же, в этом костюме...)"
10049030-179 = "Перед тем как перейти в режим ожидания по радио, я хотела сказать одну вещь..."
10049030-180 = "Ваши костюмы довольно необычные."
10049030-181 = "Это форма Отряда линчевателей?"
10049030-182 = "Мне нравится. Яркая, не то что наша."
10049030-183 = "Нет, эм... У Отряда линчевателей нет формы, потому что мы не официальная организация."
10049030-184 = "Это, эм, оперативные костюмы для полевого наблюдения..."
10049030-186 = "Мы главные героини и лучшие подруги из «Волшебницы Тяжёлого Калибра»! Термитовая Белая и Розовая!"
10049030-187 = "Девушки в этих костюмах защищают мир и справедливость!"
10049030-188 = "..."
10049030-189 = "..."
10049030-190 = ""
10049030-192 = ""
10049030-193 = "Ну, мне нравится."
10049030-194 = "Воины за мир в таких нарядах. Теперь, если сложить всё вместе, логично."
10049030-195 = "..."
10049030-196 = "О, Сузуми, твой позывной «Термитовая Белая»? Разве не должно быть «Розовая», как твой костюм?"
10049030-197 = "А, хороший вопрос! Есть причина, почему она носит розовое, но зовётся «Белой». Видишь ли, в 7 серии 3 сезона..."
10049030-199 = "П-Позывной правильный. Спасибо, что уточнила!"
10049030-200 = "Рейса, может... не будем спойлерить, чтобы потом посмотреть всем вместе?"
10049030-201 = "А! Отличная идея! Я принесу диски!"
10049030-202 = "Принято. Перехожу в режим ожидания по радио."
10049030-203 = "Я буду наблюдать и прикрывать вас."
10049030-204 = "Но помните, мне понадобится разрешение Отряда справедливости, прежде чем я смогу открыть огонь."
10049030-205 = ""
10049030-207 = ""
10049030-208 = "*вздыхает*..."
10049030-209 = "Интересно, ещё не поздно переодеться обратно в обычную одежду?"
10049030-210 = "А? Но тебе так идёт!"
10049030-211 = "Всё равно неловко."
10049030-212 = "Эй! Вы! Вы должны быть наготове в гримёрке!"
10049030-213 = "Шевелитесь! Вы уже опоздали!"
10049030-214 = "М-Мы?"
10049030-215 = "Что?"
10049030-216 = "Я думал, вы сказали, что не сможете прийти, потому что поездная бригада вас высадила или что-то такое."
10049030-217 = "Неважно. Теперь вы здесь. Давайте начинать."
10049030-218 = "Начинать... что?"
10049030-219 = ""
10049030-221 = ""
10049030-223 = "Шоу. Волшебницы. Тяжёлого. Калибра. НА СЦЕНЕ!!"
10049030-224 = "Актёры у нас есть. Можно начинать."
10049030-225 = "В-Ваши актёры?"
