[translation]
10014015-2 = "Стой, Кёяма Казуса! Почему ты убегаешь?!"
10014015-3 = "В миллионный раз говорю, просто оставь меня в покое!!!"
10014015-4 = ""
10014015-19 = ""
10014015-20 = "*тяжело дышит* *тяжело дышит*"
10014015-21 = "*тяжело дышит* Я вся вспотела..."
10014015-22 = "Мы оторвались? Кажется, путь свободен."
10014015-23 = "Я больше не могу... Это уже третий раз за сегодня."
10014015-24 = "Простите, Сенсей. Вы в порядке? Пришлось много бежать."
10014015-25 = "Хорошо, отлично. Мне было бы ужасно неловко, если бы вы пострадали, помогая мне."
10014015-26 = "Хм?"
10014015-27 = "О... На самом деле убежать от неё не так уж сложно."
10014015-28 = "Она ужасно лазает, поэтому я просто завожу её в тупик и перепрыгиваю стену."
10014015-29 = ""
10014015-32 = "...Почему вы так на меня смотрите?"
10014015-33 = "[s1] «Ты умеешь перепрыгивать стены?»\n[s2] «Ты говоришь так, будто это очень легко...»"
10014015-34 = "...О."
10014015-35 = "...О."
10014015-36 = "Н-Ну...! Насчёт этого...!"
10014015-37 = "Есть... причина. Может, просто оставим всё как есть?"
10014015-38 = ""
10014015-40 = ""
10014015-41 = "*вздыхает*"
10014015-42 = "Ладно, хорошо. Вы согласились помочь, значит заслуживаете услышать подробности."
10014015-43 = "Я не скрываю это от вас или что-то такое... Просто не люблю об этом говорить."
10014015-44 = "Но, наверное, вам нужно знать всю историю."
10014015-45 = "Боже... С чего вообще начать?"
10014015-46 = "...Сенсей, вы знаете местных хулиганок?"
10014015-47 = "Наверняка встречали. Они... плохие студенты."
10014015-48 = "Всегда носят маски, переделывают школьную форму, удлиняя юбки, обматываются бинтами..."
10014015-49 = "Уверена, вы встречали их раз-другой."
10014015-50 = "Мелочи неважны. Суть в том..."
10014015-51 = "Рейса, та дурочка, которую вы только что видели, дерётся с этими хулиганками ещё со средней школы."
10014015-52 = "Она сама называла себя «Апостолом справедливости» или какой-то такой глупостью."
10014015-53 = "И сейчас всё ещё занимается этим под именем «Отряд линчевателей»... Она вообще не изменилась."
10014015-54 = "Уgh! Я ужасно не люблю драму. И тупых идиотов, которые её создают!"
10014015-55 = ""
10014015-57 = ""
10014015-58 = "Простите, я отвлеклась. Посмотрите на это."
10014015-59 = ""
10014015-61 = ""
10014015-63 = "[ns3] «Фотография? Разве это не...?»\n[ns4] «...Это фото тех хулиганок?»"
10014015-64 = "Чтобы было ясно: я храню это не из-за воспоминаний или чего-то такого. Просто подумала, что вам стоит увидеть."
10014015-65 = "Чтобы было ясно: я храню это не из-за воспоминаний или чего-то такого. Просто подумала, что вам стоит увидеть."
10014015-66 = "Я подумала... вы можете не поверить, если я просто расскажу."
10014015-67 = "Хм?"
10014015-68 = "Да... Вы правы. Теперь понимаете, да?"
10014015-69 = "Это..."
10014015-70 = "...это я."
10014015-71 = "То есть это я в средней школе."
10014015-72 = "Я..."
10014015-73 = "............"
10014015-74 = ""
10014015-76 = ""
10014015-78 = "...была хулиганкой."
