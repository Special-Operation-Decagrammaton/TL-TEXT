[translation]
1002106-1 = "Роскошь пляжа"
1002106-2 = "Добро пожаловать, Сенсей. Ты быстро добрался."
1002106-3 = "[s] «Ты здесь одна?»"
1002106-4 = "Да, я одна."
1002106-5 = "Не так давно здесь были туристы, но они все ушли."
1002106-6 = "Так зачем я тебя позвала? Эм... Ничего не происходит."
1002106-7 = "Ну... ладно."
1002106-8 = "Наверное, проблема как раз в том, что ничего не происходит."
1002106-9 = "[s1] «И это проблема?»\n[s2] «Что ты имеешь в виду?»"
1002106-10 = "Именно то, что сказала."
1002106-11 = "Именно то, что сказала."
1002106-12 = "Я нахожусь в таком великолепном месте и при этом просто сижу здесь, ничего не делая."
1002106-13 = "Просто ничего не происходит."
1002106-14 = "Я лишь наслаждалась этим."
1002106-15 = "[s3] «Ты хочешь сказать, что тебе нравится эта тишина?»\n[s4] «Это ощущается как роскошь?»"
1002106-16 = "П... пожалуй."
1002106-17 = "П... пожалуй."
1002106-18 = "Ты точно подметил, Сенсей. Я не знала, как выразить это словами."
1002106-19 = "Наверное, поэтому мне и понадобилась помощь."
1002106-20 = "Ты всегда умеешь всё понятно объяснить."
1002106-21 = "В каком-то смысле это и правда похоже на роскошь."
1002106-22 = "..."
1002106-23 = "Я рада, что приехала. Пусть времени было мало, но я многое узнала."
1002106-24 = "Когда я с тобой, всегда происходит что-нибудь хорошее, Сенсей."
1002106-25 = "Это словно..."
1002106-26 = "...Нет."
1002106-27 = "Ничего."
1002106-28 = "Прости, что заставила тебя прийти сюда. Такое чувство, будто я зря потратила твоё время."
1002106-29 = "Я просто хотела рассказать тебе об этом."
1002106-30 = "[s] «Я рад слышать, что тебе здесь понравилось.»"
1002106-31 = "О."
1002106-32 = "Очень."
1002106-33 = ""
1002106-34 = ""
1002106-35 = "Мне здесь очень понравилось."
