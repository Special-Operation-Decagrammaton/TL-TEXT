[translation]
10039140-1 = "Послесловие;Мы тоже студенты!"
10039140-4 = "Во время фестиваля на одной стороне улицы собралась необычно большая толпа."
10039140-5 = "[ns] «Это по пути в Центр искусств...»"
10039140-6 = ""
10039140-11 = ""
10039140-12 = "Угх... А я хотела посмотреть там выставку!"
10039140-13 = "И вот опять Банда Шлемов занимается своим обычным делом и всем мешает..."
10039140-14 = "Прямо посреди кампуса! Неужели в Тринити НИКТО не собирается это остановить?"
10039140-15 = ""
10039140-17 = ""
10039140-20 = "[ns] «...»"
10039140-22 = "[ns] Подойти и выяснить, о чём они говорят."
10039140-28 = ""
10039140-29 = "Чего? На что уставился? Не твоё дело!"
10039140-30 = ""
10039140-33 = ""
10039140-34 = "Ик! Мы встретились глазами. Пойдём отсюда."
10039140-35 = ""
10039140-37 = ""
10039140-39 = "Господи, вы что, Банду Шлемов раньше не видели?"
10039140-41 = "Они пялятся на нас, будто мы обезьяны в зоопарке, капитан."
10039140-42 = "Что странно. Мы ведь просто сидим спокойно."
10039140-43 = "Наверное, они все нас боятся. Ха-ха! Ну конечно, чего ещё ждать от школы, полной неженок?"
10039140-44 = "[s] «Может, они просто злятся, потому что вы перекрыли дорогу.»"
10039140-45 = ""
10039140-47 = ""
10039140-49 = ""
10039140-52 = "А? Что ты сказала?"
10039140-53 = ""
10039140-56 = "...Эм..."
10039140-58 = "С-Сенсей из Шале?!"
10039140-61 = "Угх! Это И ПРАВДА Сенсей!"
10039140-62 = "М-Мы ничего плохого не делаем, просто стоим здесь!"
10039140-63 = "[s] «Успокойтесь. Я здесь просто ради своих студентов, как учитель.»"
10039140-65 = "Учитель...?"
10039140-66 = "Э-Эй, сегодня мы вообще никаких проблем не устраивали!"
10039140-67 = "[s1] «Если вы вот так перекрываете дорогу, другим студентам становится не по себе.»\n[s2] «Люди смотрят на вас потому, что нервничают.»"
10039140-70 = "Хм...? П-Правда...?"
10039140-72 = "Но сесть было вообще негде..."
10039140-73 = "На площадке слишком много людей, и на лестницах тоже!"
10039140-75 = "Мы просто пришли посмотреть фестиваль. В чём проблема?"
10039140-76 = "[s] «Вы все пришли на Карнавал Тринити?»"
10039140-77 = ""
10039140-79 = ""
10039140-80 = "...В основном."
10039140-82 = "Ну да, типа того..."
10039140-83 = "Можно назвать это осмотром достопримечательностей, а можно — разведкой..."
10039140-85 = "Но да, нам хотелось увидеть, какой фестиваль может устроить такая большая школа! Ха-ха!"
10039140-86 = "И правда впечатляет."
10039140-87 = ""
10039140-89 = ""
10039140-90 = "Ага. В общем..."
10039140-91 = "...денег у нас особо нет, так что мы просто ходили и смотрели."
10039140-93 = "Вся еда в уличных палатках выглядит вкусно, но..."
10039140-94 = ""
10039140-96 = ""
10039140-98 = ""
10039140-99 = ""
10039140-100 = "..."
10039140-101 = "Э-Это просто биологическая реакция. Мы ничего не можем с этим поделать!"
10039140-102 = "Точно! Это наши внутренние органы говорят, не мы!"
10039140-103 = "Если задуматься, жутковато, да, Сенсей?! Ха-ха...!"
10039140-104 = ""
10039140-107 = "[ns3] «Эй, если вы не против...»\n[ns4] «Хотите погулять по фестивалю вместе со мной?»"
10039140-108 = ""
10039140-109 = ""
10039140-111 = ""
10039140-113 = ""
10039140-115 = "Вы серьёзно?"
10039140-116 = "[s5] «Вон та палатка с такояки выглядит особенно аппетитно.»\n[s6] «У меня не хватает смелости есть такое одному. Составите компанию?»"
10039140-119 = "..."
10039140-121 = "К-Капитан, это может быть шанс..."
10039140-122 = "Сам Сенсей из Шале предлагает. Может, стоит согласиться."
10039140-124 = "М-Может...?"
10039140-125 = "Я слышала, что другие студенты гуляют со своими учителями, развлекаются и едят вкусную еду..."
10039140-126 = "М-Может, нам тоже стоит попробовать..."
10039140-127 = ""
10039140-129 = ""
10039140-131 = "З-Заткнитесь! Решение здесь принимаю я!"
10039140-132 = ""
10039140-136 = "[ns7] «О, та якисоба тоже выглядит вкусно...»\n[ns8] «А тир и ловля шариков тоже кажутся весёлыми...!»"
10039140-137 = ""
10039140-138 = ""
10039140-140 = ""
10039140-141 = "Угх..."
10039140-143 = ""
10039140-144 = "Капитан?"
10039140-145 = ""
10039140-148 = ""
10039140-149 = ""
10039140-150 = "Хе-хе, хи-хи... Ну что ж, Сенсей..."
10039140-151 = "Если вы настолько хотите насладиться фестивалем, думаю, нет причин не составить вам компанию."
10039140-152 = "[s] «Хорошо, пойдём вместе.»"
10039140-153 = ""
10039140-156 = ""
10039140-157 = "Ура! Так держать, капитан!"
10039140-158 = "Я знала, что вы не подведёте!"
10039140-159 = "И мы наконец-то тоже погуляем с учителем!"
10039140-161 = "Хи-хи-хи!"
10039140-163 = "Так я присоединился к студентам Банды Шлемов, и мы вместе отправились исследовать фестиваль."
10039140-169 = ""
10039140-170 = ""
10039140-171 = ""
10039140-172 = "Ай! Как горячо!"
10039140-173 = "Я не знала, что свежие такояки могут быть НАСТОЛЬКО горячими...!"
10039140-174 = "Ну конечно не знала. МЫ-то едим только холодные!"
10039140-175 = ""
10039140-177 = ""
10039140-179 = ""
10039140-180 = ""
10039140-181 = ""
10039140-182 = "Кья-а! Горячо, очень горячо!! Ха! Хоп!"
10039140-183 = "[s9] «Можешь не торопиться...»\n[s10] «Если хочешь, я могу купить тебе что-нибудь другое.»"
10039140-188 = ""
10039140-195 = "А-а, чёрт! Одного не хватило!"
10039140-196 = "Угх! Я хотела выиграть ту огромную пушистую игрушку, размером с полчеловека!"
10039140-197 = "Да, но попытки закончились. Если хотим попробовать ещё раз, нужны дополнительные кредиты..."
10039140-198 = ""
10039140-200 = ""
10039140-201 = "[ns] «Хотите попробовать ещё раз?»"
10039140-202 = ""
10039140-203 = "Эм... Э-э..."
10039140-204 = "...Д-Да, пожалуйста..."
10039140-205 = "Сенсей..."
10039140-206 = "[s] Передать ещё кредитов."
10039140-207 = ""
10039140-209 = ""
10039140-212 = ""
10039140-214 = "О! Отлично, капитан! Сенсей!"
10039140-215 = "Она попала, попала! Теперь капитан получит игрушку!"
10039140-217 = "Вы же видели, да?! Я, Комакадзэ Рабу, лидер Банды Шлемов Всплеска, не та, кого стоит недооценивать! Бу-га-га!"
10039140-218 = "Дай пять, Сенсей!"
10039140-219 = ""
10039140-226 = "*шмыг*... Это была такая хорошая история..."
10039140-227 = "Я тоже расплакалась. Спектакли — потрясающая вещь!"
10039140-228 = "Тот последний монолог парализованной принцессы был просто великолепен..."
10039140-230 = "Да ладно, вы что, плачете? И ещё называете себя бандитками в шлемах?!"
10039140-231 = "Я тоже впервые смотрела спектакль, но ни слезинки не проронила!"
10039140-233 = "Но капитан, у вас глаза красные..."
10039140-234 = "Может, тушь размазалась...?"
10039140-235 = ""
10039140-238 = ""
10039140-239 = "З-Заткнитесь! Я просто немного потёрла глаза, потому что чесались!"
10039140-240 = ""
10039140-243 = "[ns11] «Из-за шлемов не сразу заметно, но...»\n[ns12] «...вы ведь тоже просто молодые студенты.»"
10039140-244 = ""
10039140-245 = ""
10039140-247 = ""
10039140-249 = ""
10039140-250 = "..."
10039140-251 = "Ну... то есть, очевидно, но..."
10039140-253 = "Но мы ещё и кучка никчёмных нарушительниц!"
10039140-254 = "[s] «Сегодня можно просто побыть обычными людьми.»"
10039140-255 = ""
10039140-257 = ""
10039140-258 = "[ns] «Пусть сегодня будут просто обычные студенты и их обычный Сенсей.»"
10039140-259 = ""
10039140-261 = "..."
10039140-263 = ""
10039140-264 = "..."
10039140-266 = "...Ну..."
10039140-267 = "То есть мы ведь НЕ ЗА ТЕМ пришли сюда, чтобы устраивать проблемы..."
10039140-268 = "И вот так проводить время с вами — тоже необычный опыт..."
10039140-269 = ""
10039140-271 = ""
10039140-272 = ""
10039140-273 = "Так что... Сенсей?"
10039140-274 = ""
10039140-276 = ""
10039140-277 = ""
10039140-278 = "Не могли бы вы... провести с нами и остаток дня?"
10039140-280 = "Я отлично провёл весь день с Бандой Шлемов, пока не зашло солнце."
10039140-281 = ""
10039140-285 = "...Хотя кошелёк у меня после этого заметно похудел..."
