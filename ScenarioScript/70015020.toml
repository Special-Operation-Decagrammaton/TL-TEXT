[translation]
70015020-1 = "The Ibuki Runaway Incident (2)"
70015020-4 = "..."
70015020-8 = "So basically..."
70015020-9 = "This is all because that racoon ate Ibuki-chan's pudding..."
70015020-10 = "Yes..."
70015020-11 = "In the end, Ibuki-chan ran away..."
70015020-12 = "And after a long fruitless search, you decided to ask us for help...#nAm I interpreting that right?"
70015020-13 = "As pathetic as it is, that's precisely the case..."
70015020-14 = "How'd this even happen...?"
70015020-15 = "All you do is antagonize the Prefect Team, yet here you are running to us for help now... #nSay what you like, but do you really think we're here to answer your every beck and call?"
70015020-16 = "We have no excuses for this..."
70015020-17 = "...Understood. We'll lend a hand."
70015020-21 = "Ibuki is still young... I'm sure she's feeling anxious after getting lost so far from#nhome."
70015020-22 = "Head Prefect..."
70015020-23 = "...What the Head Prefect says is right.#nFor Ibuki-chan's sake, we'll cooperate with you this time."
70015020-24 = "It's time for me to go on patrol, so I'll be sure to keep an eye out for her."
70015020-25 = "Thank you very much..."
70015020-26 = "Just to be sure... #nThis isn't some elaborate ploy to put the Prefect Team under your control, right?"
70015020-27 = "I don't think she has the luxury right now to be thinking about that..."
70015020-29 = "Ibukiii! I was wrong!! Please return to uuuss!!"
70015020-31 = "..."
70015020-32 = "*Sigh...*"
70015020-33 = "I've been searching for hours, but... #nForget finding Ibuki-chan herself, I haven't even found a single clue regarding her whereabouts..."
70015020-34 = "Where in the world could she have gone...?"
70015020-38 = "That's..."
70015020-40 = "Wee! Ibuki's flying! Ibuki's going sooo high!"
70015020-46 = "Haruka Onee-chan! You're so good with the seesaw!"
70015020-47 = "Ehehe... I'm just glad you're having fun..."
70015020-48 = "Would you like to ride on the swings next?"
70015020-49 = "Yeah! Ibuki loves swings!"
70015020-50 = "Kufufuh. Ibuki-chan and Haruka-chan are hitting it off reaaal well."
70015020-51 = "Yeah. Haruka's always been good at taking care of others."
70015020-52 = "..."
70015020-53 = "Whatcha thinking about, Aru-chan?"
70015020-54 = "Nothing... I was just wondering if this really is fine..."
70015020-55 = "Well I guess Ibuki-chan IS from the Pandemonium Society. #nSo you don't know what to do when they finally come knocking? Is that why you're#nscared?"
70015020-56 = "I-I'm not really THAT scared!"
70015020-57 = "Since our club isn't officially approved, I just thought it might be awkward if we#nmeet them!"
70015020-58 = "That's it! Really!"
70015020-59 = "...Actually, they're likely searching for Ibuki right now."
70015020-60 = "All we're doing is just looking over Ibuki-chan! You're worrying too much."
70015020-61 = "I-I guess that's true?"
70015020-62 = "We've even given her so much candy!#nDon't you think they should be thanking us instead?"
70015020-63 = "R-Right! That's true!"
70015020-64 = "It'll be all right. I doubt they'll think that we kidnapped her... Probably."
70015020-65 = "...!!"
70015020-66 = "K-ki-kidnapped!? We'd never do something so horrible...!"
70015020-67 = "But I suppose we are Problem Solver 68—a band of hardboiled outlaws... #nIt wouldn't be strange if they came to that conclusion...!!"
70015020-68 = "Calm down, boss. Even if that were to happen, Ibuki can always give an#nexplanation of the situation."
70015020-69 = "Y-Yeah... You're right."
70015020-70 = "Phew... Of course I knew that."
70015020-71 = "Kufufuh. Aru-chan really is entertaining to be around."
70015020-72 = "The question, then, is when we should send Ibuki back..."
70015020-73 = "For all we know, they could very well find us first..."
70015020-78 = "..."
70015020-79 = "...Ah."
70015020-80 = "...Would one of you like to explain what's going on here?"
70015020-82 = "―And that's basically what happened!"
70015020-83 = "...I see. So, Ibuki-chan... #nThese people played with you and bought you candy. In other words―"
70015020-84 = "They kidnapped you!"
70015020-85 = "It actually happened!"
70015020-86 = "Uh-uh, that's not it. Ibuki came here on her own."
70015020-87 = "All these Onee-chans did was play with Ibuki. They're good people!"
70015020-88 = "...Then it's fine I suppose, but..."
70015020-89 = "I-Ibuki. Someone's here to pick you up. It's time for you to head home now..."
70015020-90 = "I had a lot of fun playing together with you. Stay nice and healthy after you get#nback..."
70015020-91 = "...That's right. Let's go back, Ibuki-chan. The Pandemonium Society is—"
70015020-92 = "No! Ibuki doesn't want to go back yet!"
70015020-96 = "Wh-why is that? Are you still angry?"
70015020-97 = "...No. Ibuki's not angry, but..."
70015020-98 = "She doesn't want to go back yet."
70015020-99 = "Ibuki wants to be with these Onee-chans a bit longer!"
70015020-103 = "Ehehe... I-Is that so? I also want to stay with you a bit longer, Ibuki."
70015020-104 = "Yay! Let's stay together!!"
70015020-110 = "A-Aru-sama..."
70015020-111 = "Uhhh..."
70015020-112 = "*Sigh...*"
70015020-114 = "In that case... would you like to come to our office?"