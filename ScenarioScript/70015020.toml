[translation]
70015020-1 = "Ibuki's Runaway Incident (2)"
70015020-4 = "……."
70015020-8 = "In other words……."
70015020-9 = "Because that tanuki of yours ate Ibuki-chan's pudding……."
70015020-10 = "Yes……."
70015020-11 = "Ibuki-chan ran away……."
70015020-12 = "And now that you've lost track of her, you've come to us for help... is that right?"
70015020-13 = "It's a pathetic story, but that is correct……."
70015020-14 = "How did it even come to this……."
70015020-15 = "After treating the Prefect Team like your mortal enemies, you only come to us when you need help...#nDon't you think that's a bit too convenient?"
70015020-16 = "I have no room for excuses……."
70015020-17 = "……Understood. We'll help you."
70015020-21 = "Ibuki is still small…… If she's lost, she must be feeling scared."
70015020-22 = "Prefect Prefect……."
70015020-23 = "……As the Prefect says. Let's cooperate this time for Ibuki-chan's sake."
70015020-24 = "I'm heading out on patrol anyway, so I'll keep an eye out too."
70015020-25 = "Thank you so much……."
70015020-26 = "Just to be sure……#nThis isn't some elaborate scheme to take control of the Prefect Team, is it?"
70015020-27 = "I don't think we have the luxury to be thinking about things like that……."
70015020-29 = "Ibuki!! It was my fault!! Please come back!!!"
70015020-31 = "……."
70015020-32 = "Sigh……."
70015020-33 = "We've been searching for hours now……#nNot only have we not found Ibuki-chan, we haven't even found a single clue……."
70015020-34 = "Where on earth could she have gone……."
70015020-38 = "Is that……."
70015020-40 = "Wow~! Amazing, amazing! So hiiiigh!"
70015020-46 = "Haruka-oneechan, you're good at the seesaw!"
70015020-47 = "Hehe…… I'm just glad you're having fun……."
70015020-48 = "Shall we try the swings next?"
70015020-49 = "Yeah! Ibuki loves the swings!"
70015020-50 = "Kufufu. Ibuki-chan and Haruka-chan have really become good friends, haven't they?"
70015020-51 = "Yeah. Haruka is good at taking care of others, after all."
70015020-52 = "……."
70015020-53 = "Something wrong? Aru-chan."
70015020-54 = "No…… I was just wondering if it's really okay to keep doing this……."
70015020-55 = "Well, Ibuki-chan is from Pandemonium Society, after all.#nAre you worried that if they show up, we'll be in trouble?"
70015020-56 = "I-I'm not scared of them!"
70015020-57 = "We're an unapproved club, so I just thought it would be awkward if we ran into them!"
70015020-58 = "That's all!"
70015020-59 = "……In reality, they're probably looking for Ibuki right about now."
70015020-60 = "It's not like we're holding her hostage or anything! You're worrying too much."
70015020-61 = "R-right?"
70015020-62 = "We've been giving her plenty of snacks, so they should be thanking us, if anything!"
70015020-63 = "Y-yeah! That's right!"
70015020-64 = "Don't worry. They won't think we kidnapped Ibuki…… probably."
70015020-65 = "……!!"
70015020-66 = "K-k-kidnapped?! Such a dangerous thing to say……!"
70015020-67 = "But we are the hard-boiled, outlaw Problem Solver 68……#nIt wouldn't be strange if that's what they concluded……!!"
70015020-68 = "No, calm down, President. Even if they did, Ibuki would explain everything properly."
70015020-69 = "Y-yeah…… I suppose so."
70015020-70 = "Phew…… Of course, I know that."
70015020-71 = "Kufufu. Aru-chan is so funny."
70015020-72 = "The problem is when to send Ibuki back……."
70015020-73 = "There's also the possibility that they find us first……."
70015020-78 = "……."
70015020-79 = "……Ah."
70015020-80 = "……Could you explain what is going on here?"
70015020-82 = "――And that's what happened!"
70015020-83 = "……I see. So Ibuki-chan……#nwas played with by these people and even had snacks bought for her. In other words, this is――"
70015020-84 = "Kidnapping!"
70015020-85 = "I knew it!?"
70015020-86 = "No, that's not it. Ibuki left on her own."
70015020-87 = "These onee-chans were just playing with me. They're really nice people!"
70015020-88 = "……If that's the case, then fine……."
70015020-89 = "I-Ibuki. They've come to pick you up, so we have to go home now……."
70015020-90 = "It was fun playing with you. Please take care of yourselves……."
70015020-91 = "……Yes. Let's go home, Ibuki-chan. Right now, Pandemonium Society is――"
70015020-92 = "No! I don't want to go home yet!"
70015020-96 = "W-why is that? Are you still angry?"
70015020-97 = "……No. I'm not angry anymore, but……."
70015020-98 = "I just don't want to go home yet."
70015020-99 = "Ibuki wants to stay with these onee-chans more!"
70015020-103 = "Hehe…… I-is that so? I want to stay with you more too, Ibuki."
70015020-104 = "Yeah! Let's do that!!"
70015020-110 = "A-Aru-sama……."
70015020-111 = "Hmm……."
70015020-112 = "Sigh……."
70015020-114 = "In that case…… do you want to come to our office?"