[translation]
70015020-1 = "Исчезновение Ибуки, часть 2"
70015020-3 = ""
70015020-4 = "..."
70015020-6 = ""
70015020-7 = ""
70015020-8 = "То есть вы хотите сказать..."
70015020-9 = "...что ваша пронырливая председательница съела весь пудинг Ибуки..."
70015020-10 = "Есть..."
70015020-11 = "Ибуки расстроилась из-за этого и убежала..."
70015020-12 = "...а теперь вы пришли к нам за помощью в поисках?"
70015020-13 = "В общем, так и есть..."
70015020-14 = "Это вообще серьёзно...?"
70015020-15 = "Вы из кожи вон лезете, чтобы испортить нам жизнь, но, когда вам понадобилась помощь, без стыда явились к нам?"
70015020-16 = "Мне и оправдаться-то нечем..."
70015020-17 = "Не беспокойся. Мы поможем."
70015020-18 = ""
70015020-20 = ""
70015020-21 = "Речь об Ибуки, и сейчас ей нужна помощь. Она слишком мала, чтобы оставаться одной. Прежде всего мы обязаны позаботиться о её безопасности."
70015020-22 = "Глава Префектуры..."
70015020-23 = "...Как всегда, вы правы. Ради этого мы можем забыть о разногласиях."
70015020-24 = "Я как раз собиралась на патрулирование. Если что-то увижу или узнаю, сразу сообщу."
70015020-25 = "Спасибо вам, Префектура..."
70015020-26 = "Прежде чем согласиться, поклянитесь, что это не очередная идиотская затея председательницы, чтобы нам навредить."
70015020-27 = "Макото сейчас... совсем не до таких затей."
70015020-28 = ""
70015020-29 = "Ибуки! Ибуки-и-и! Пожалуйста! Я виновата! Вернись!"
70015020-31 = "..."
70015020-32 = "А-а..."
70015020-33 = "Я рада помочь, но у нас нет ни одной зацепки."
70015020-34 = "А ведь мы ищем уже несколько часов..."
70015020-35 = ""
70015020-37 = ""
70015020-38 = "...А?"
70015020-39 = ""
70015020-40 = "Уиии! Как весело!"
70015020-41 = ""
70015020-42 = ""
70015020-43 = ""
70015020-44 = ""
70015020-45 = ""
70015020-46 = "Харука, ты так здорово качаешься на качелях-балансире!"
70015020-47 = "Хи-хи... Я рада, что тебе нравится..."
70015020-48 = "Хочешь попробовать обычные качели?"
70015020-49 = "Да, качели! Качели! Ибуки хочет!"
70015020-50 = "Ку-фу-фу. Харука, ты отлично ладишь с детьми."
70015020-51 = "Они чувствуют её искреннюю доброту."
70015020-52 = "..."
70015020-53 = "Чего такой взгляд, босс?"
70015020-54 = "Просто... размышляю о нашей ситуации..."
70015020-55 = "А, поняла! Она же из Пандемониума. Её скоро могут начать искать, а ты от страха дрожишь!"
70015020-56 = "Н-ничего я не боюсь! Совсем!"
70015020-57 = "Просто наш клуб неофициальный, и ситуация может стать немного... неловкой, понимаешь?"
70015020-58 = "Это не беспокойство! И не страх! Просто... кро-о-шечное опасение!"
70015020-59 = "Её наверняка уже ищут."
70015020-60 = "Да мы ведь ничего плохого не делаем! Наоборот, заботимся о ней!"
70015020-61 = "В-верно?"
70015020-62 = "И ещё потратили часть лишних денег, чтобы вкусно её накормить! Нам вообще-то должны за это заплатить!"
70015020-63 = "Верно?! Должны ведь?"
70015020-64 = "...И они уж точно не станут делать поспешные выводы и решать, будто мы похитили Ибуки."
70015020-65 = "...!!"
70015020-66 = "Т-ты правда думаешь, что они так решат?! Даже не произноси этого слова! Не может быть!"
70015020-67 = "Хотя постой, мы же знаменитая и грозная «Проблема 68»! Крутые преступники! Они вполне могут так подумать!"
70015020-68 = "Думаю, всё будет хорошо. Даже если возникнет небольшое недоразумение, Ибуки сможет сама им всё объяснить."
70015020-69 = "А... Д-да. Верно."
70015020-70 = "Логично. Как я сразу не сообразила."
70015020-71 = "Ку-фу-фу. Вот это наш босс. Так быстро приходит в себя, что удивительно, как шею ещё не свернула."
70015020-72 = "Главный вопрос — Ибуки сама решит вернуться раньше..."
70015020-73 = "...или они нас раньше найдут."
70015020-74 = ""
70015020-76 = ""
70015020-77 = ""
70015020-78 = "..."
70015020-79 = "...Ах."
70015020-80 = "И что же именно здесь происходит...?"
70015020-82 = "Вот как всё было!"
70015020-83 = "...Понятно. Значит, они играли с тобой и покупали вкусности..."
70015020-84 = "Даже если смотреть на это самым снисходительным взглядом, разве это не похищение?!"
70015020-85 = "Я ТАК И ЗНАЛА!!"
70015020-86 = "Не-е-ет! Никакое не похищение! Ибуки разозлилась на Макото и сама убежала!"
70015020-87 = "А потом ей повезло встретить новых друзей! Ибуки они очень нравятся!"
70015020-88 = "Что ж, рада это слышать..."
70015020-89 = "Н-ну... Раз за тобой пришли, ч-чтобы забрать домой, значит, тебе пора..."
70015020-90 = "Мне... Мне было весело с тобой играть. Надеюсь, ты ещё подрастёшь... до нашей следующей встречи..."
70015020-91 = "...Да. Пойдём домой. Все в Пандемониуме так..."
70015020-92 = "Нет! Ибуки не пойдёт!"
70015020-93 = ""
70015020-95 = ""
70015020-96 = "П-почему?! Ты всё ещё злишься из-за пудинга?"
70015020-97 = "...Нет, Ибуки больше не злится."
70015020-98 = "Но Ибуки всё равно не хочет возвращаться."
70015020-99 = "Потому что Ибуки хочет остаться здесь!"
70015020-100 = ""
70015020-102 = ""
70015020-103 = "Хи-хи... Правда? Хочешь ещё немного поиграть с нами?"
70015020-104 = "Угу! Ибуки останется с вами!"
70015020-105 = ""
70015020-107 = ""
70015020-108 = ""
70015020-109 = ""
70015020-110 = "Б-босс..."
70015020-111 = "Хм..."
70015020-112 = "А-а..."
70015020-114 = "Эм... Тогда хочешь зайти к нам в офис?"
