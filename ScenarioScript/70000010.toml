[translation]
70000010-1 = "Подозрительная встреча 1"
70000010-3 = ""
70000010-4 = "Кекеке. Наконец-то я прибыла."
70000010-5 = "У меня слишком много вопросов, чтобы все перечислять, но начнём с..."
70000010-6 = "Почему, чёрт возьми, мы здесь?"
70000010-7 = "Разве не очевидно? Федеральная академия Красная Зима — одна из крупнейших школ Кивотос, а значит, у неё и одна из самых больших численностей учеников."
70000010-8 = "Я не это спрашивала."
70000010-9 = "Не может быть нормальной причины, по которой ты захотела устроить встречу по обмену с Красная Зима. Что ты задумала, Макото?"
70000010-11 = "Кекеке."
70000010-12 = "Всё станет ясно, когда мы встретимся с их диктатором!"
70000010-13 = "И мой гениальный, великолепный план идеально встанет на свои места!"
70000010-15 = "(...Я так и знала. Именно поэтому не взяла с нами Ибуки.)"
70000010-16 = "Умоляю, расскажи мне свой план."
70000010-17 = "Если я не знаю план, я не смогу подготовить нормальный путь отступления."
70000010-18 = "Хи-хи-хи. Опять ты за своё, Ироха. Этот план точно сработает, я знаю."
70000010-19 = "(...Именно это она говорила предыдущие восемьдесят два раза.)"
70000010-20 = ""
70000010-22 = ""
70000010-26 = ""
70000010-27 = "Большое спасибо за ожидание, Общество Пандемониума. Меня зовут Томоэ, я главный секретарь Офиса Красная Зима."
70000010-28 = "Наш Великий Вождь ждёт вас. Прошу, следуйте за мной."
70000010-30 = ""
70000010-33 = ""
70000010-34 = "Добро пожаловать в Красная Зима, люди из Геенна!"
70000010-36 = "(...Почему на ней фальшивые усы?)"
70000010-37 = "..."
70000010-38 = ""
70000010-40 = ""
70000010-41 = ""
70000010-42 = ""
70000010-43 = ""
70000010-44 = ""
70000010-45 = ""
70000010-46 = ""
70000010-47 = "Они... фальшивые?!"
70000010-48 = "(...До неё это слишком долго доходило.)"
70000010-49 = "Это Черина, наша уважаемая президент: Украшательница земель, Великий Вождь, капитан спортивного клуба, глава санитарной службы, начальник всех префектов, знаток школьного питания, MVP этого года, MVP этой недели и MVP сегодняшнего дня."
70000010-50 = "Да, это я! Я самый важный человек, с которым вам выпала честь встретиться в Красная Зима!"
70000010-52 = "...Ага. Звучит точь-в-точь как кое-кто другой."
70000010-53 = "Хи-хи-хи! Кекеке!"
70000010-54 = "Оставьте формальности. Я хитро заманила вас сюда, и мой план удался!"
70000010-55 = "Хахахахаха! Что я тебе говорила, Ироха?"
70000010-57 = ""
70000010-59 = ""
70000010-60 = ""
70000010-63 = ""
70000010-64 = "...Что ты сделала, Макото?"
70000010-65 = "Разве к этому моменту не очевидно?"
70000010-66 = "Я тайно сговорилась с председателем службы безопасности! Больше всего на свете она желает свергнуть диктатора, стоящего во главе Красная Зима!"
70000010-67 = "Она хотела революцию! А я поддерживала её на каждом шагу."
70000010-68 = "Что?!"
70000010-69 = "Хахаха! Проще говоря, это переворот!"
70000010-70 = ""
70000010-72 = ""
70000010-75 = ""
70000010-78 = "О, переворот, говоришь?"
70000010-79 = "Мне больше нечего скрывать! Ты угодила прямо в тщательно подготовленную ловушку, устроенную мной и твоей председательницей службы безопасности."
70000010-80 = "Кажется... я уже понимаю, к чему всё идёт..."
70000010-81 = "Твой выход, председатель службы безопасности! Обезвредь мелкую соплячку, и вместе мы будем править огромной силой Красная Зима!"
70000010-82 = ""
70000010-84 = ""
70000010-85 = "Э-Эм... Алло? Председатель службы безопасности? Это была её реплика для выхода..."
70000010-87 = "Томоэ, где Марина?"
70000010-88 = "На прошлой неделе она попыталась устроить переворот, поэтому сейчас содержится в Бывшем институте."
70000010-90 = "?!"
70000010-91 = "Марина никогда не перестанет пытаться, да? Не могу не уважать такую железную волю."
70000010-92 = "Председателя службы безопасности поймали при попытке ДРУГОГО переворота?! И её сослали?"
70000010-93 = "Возможно, план председателя Макото относился к перевороту прошлой недели."
70000010-94 = "Позвольте мне уточнить."
70000010-95 = ""
70000010-97 = ""
70000010-98 = ""
70000010-100 = "Председатель Марина? Надеюсь, у вас всё хорошо."
70000010-101 = "Я хотела уточнить текущую ситуацию. Общество Пандемониума из Геенна прибыло сюда, заявляя, что сегодня вы вместе планировали переворот?"
70000010-102 = "Устроить переворот...? Сегодня?"
70000010-103 = "А. Да, всё верно. Я совершенно забыла связаться с Геенна."
70000010-104 = "Главный секретарь Томоэ, простите, но не могли бы вы ввести их в курс дела за меня? Я сейчас занята тем, что пытаюсь одолеть это упрямое пятно на полу."
70000010-105 = "Поняла. Удачи."
70000010-106 = ""
70000010-108 = ""
70000010-109 = "Такова, похоже, ситуация."
70000010-111 = ""
70000010-113 = ""
70000010-114 = "..."
70000010-115 = "..."
70000010-117 = "Хи-хи-хи. Похоже, это ты пропустила свою реплику. Или, может, Марина просто не смогла тебя дождаться."
70000010-118 = ""
70000010-120 = ""
70000010-122 = ""
70000010-123 = ""
70000010-125 = "Н-Но...? Мой план...!"
70000010-126 = ""
70000010-128 = ""
70000010-129 = "*вздох* Ты снова сама себе подставила ногу, Макото."
70000010-131 = "Проводите членов Общества Пандемониума в зал встречи по обмену."
70000010-133 = ""
70000010-135 = ""
70000010-136 = "Да!"
70000010-138 = "?"
70000010-139 = "Прошу, сюда."
70000010-141 = "...Возможно, я не в том положении, чтобы спрашивать, но встреча по обмену всё ещё состоится? Это что, тайный код для тюрьмы?"
70000010-142 = "Зачем мне это делать? Перевороты здесь обычное дело."
70000010-143 = "Разумеется, Марине придётся понести последствия за попытку переворота, но мы не можем отменить такую важную встречу с Геенна из-за подобной мелочи."
70000010-145 = "М-Мелочи...? Обычное дело?!"
70000010-146 = "Естественно! Томоэ, сколько переворотов у нас было за последний месяц?"
70000010-147 = "Три попытки, Великий Вождь, две из них успешные."
70000010-148 = "Точно! Помнишь мою эпическую поездку верхом на гризли по заснеженным горам? Мы пересекли ледяные моря, а потом триумфально вернулись в академию!"
70000010-149 = "Вот как? Согласно моим записям, при встрече с медведем вы очень мило кричали и плакали, зовя меня. Я нашла это крайне очаровательным."
70000010-150 = ""
70000010-152 = ""
70000010-153 = "З-Замолчи, главный секретарь!"
70000010-154 = "Кхм. Надеюсь, теперь вам понятнее, председатель."
70000010-155 = "Я Великий Вождь Красная Зима! Такие незначительные события даже не способны коснуться моей власти!"
70000010-157 = "Н-Незначительные...?!"
70000010-158 = "Хватит разговоров! У такого диктатора, как я, плотное расписание! В зал встречи по обмену, живо!"
70000010-159 = "Л-Ладно... Наверное..."
70000010-160 = ""
70000010-162 = ""
70000010-165 = "(Как меня вообще втянули в этот бред...?)"
70000010-166 = "(Хотя забавно смотреть, как мелкая диктаторша помыкает Макото.)"
