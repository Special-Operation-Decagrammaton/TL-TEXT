[translation]
1006006-1 = "Рамэн и горячие источники"
1006006-2 = "Я отправился на встречу с Мэгу в назначенные ею время и место."
1006006-3 = "Это было тихое место вдали от главных улиц."
1006006-4 = ""
1006006-6 = ""
1006006-7 = "Эй, эй! Сенсей!! Сюда!"
1006006-8 = "[s1] «Мэгу! Вот ты где!»\n[s2] «Что ты делаешь так далеко?»"
1006006-11 = "А? В смысле?"
1006006-12 = "Я как раз собираюсь приготовить рамэн."
1006006-13 = "А, хочешь знать, почему я пришла именно сюда?"
1006006-14 = "Э-э..."
1006006-15 = "Я... особо об этом не думала."
1006006-16 = "Наверное, я просто всегда ищу какое-нибудь укромное место, чтобы приготовить рамэн."
1006006-17 = "Здесь хорошо... Никто не мешает, не пытается стащить кусочек и не начинает болтать без остановки..."
1006006-18 = "Ну, или типа того!"
1006006-19 = "В общем... думаю..."
1006006-21 = "Наверное, просто приятно спокойно смотреть, как варится рамэн."
1006006-22 = "...А, всё ещё не понимаешь? Хм... Как же объяснить, что значит смотреть на рамэн..."
1006006-23 = ""
1006006-25 = ""
1006006-26 = "Эм..."
1006006-27 = "...Не знаю, как это объяснить..."
1006006-28 = "[s3] «Тебе нравится само ощущение, когда ешь рамэн?»\n[s4] «Тебе нравится сам процесс приготовления рамэна?»"
1006006-31 = "Нет, эм, не совсем..."
1006006-32 = "Я же ем лапшу быстрого приготовления, потому что на самом деле готовить не умею."
1006006-33 = "Просто... когда я смотрю, как кипит кастрюля с рамэном..."
1006006-34 = "Если внимательно посмотреть..."
1006006-35 = "Она немного... похожа на горячий источник."
1006006-36 = ""
1006006-39 = "[ns5] «Как рамэн может быть похож на горячий источник?»\n[ns6] «Потому что вода кипит?»"
1006006-42 = "Хм, я и сама не до конца понимаю! Но..."
1006006-43 = "Ну, подумай, Сенсей."
1006006-44 = "А, наверное, странно, что это я говорю тебе «подумай»...?"
1006006-45 = "...В общем!"
1006006-46 = "Представь, Сенсей! Кастрюля кипящего рамэна!"
1006006-47 = "Сначала лапша жёсткая и ломкая, но в бурлящей воде постепенно размягчается и расправляется."
1006006-48 = "А ещё тепло и поднимающийся пар."
1006006-49 = "Получается почти как горячий источник для лапши! Правда? Я ведь права?"
1006006-50 = "А потом добавляешь овощи и другие ингредиенты и смотришь, как они расходятся по горячей воде и расслабляются... Мне от одного вида становится хорошо!"
1006006-51 = "Это самое лучшее и расслабляющее чувство на свете!"
1006006-52 = "А..."
1006006-53 = "Точно, точно! С другими супами ведь так же!"
1006006-54 = "Их я тоже люблю! Но готовить умею только рамэн."
1006006-55 = "И когда мне захочется это увидеть, я могу сразу приготовить его! Не нужно ждать!"
1006006-56 = "Вот поэтому он мне нравится! Да, точно! Наверное, поэтому."
1006006-57 = "[s7] «Необычная точка зрения!»\n[s8] «Наверное, так твой рамэн становится ещё вкуснее.»"
1006006-60 = "Хи-хи! Я знала, что ты поймёшь, Сенсей! Ты такой умный."
1006006-61 = "Ладно! Хватит разговоров. Давай я приготовлю тебе рамэн!"
1006006-62 = "Подожди минутку, Сенсей! Посмотрим, как он варится, вместе."
1006006-63 = ""
1006006-65 = ""
1006006-66 = ""
1006006-67 = "Садись! Я сделаю его очень вкусным."
1006006-68 = ""
1006006-73 = "Потом мы вместе съели рамэн Мэгу."
1006006-74 = ""
1006006-78 = "Марка лапши быстрого приготовления была самой обычной, но получилось вкусно — возможно, потому что мы вместе смотрели, как она варится."
1006006-81 = "Ух ты! Я так наелась!"
1006006-82 = "А ты, Сенсей? Всё ещё голодный? Могу приготовить ещё!"
1006006-83 = "А, точно? Я не против сделать ещё!"
1006006-84 = "Хорошо! Тогда отлично."
1006006-85 = "Похоже, я приготовила ровно сколько нужно!"
1006006-86 = ""
1006006-88 = ""
1006006-89 = "Хех... Хорошо-то как."
1006006-90 = ""
1006006-92 = ""
1006006-93 = "Ах!"
1006006-96 = "Смотри, ветчина всё ещё плавает в супе. Кружится, кружится, кружится и кружится!"
1006006-97 = "[ns9] «Завидую ветчине.»\n[ns10] «Наверное, здорово так расслабиться...»"
1006006-101 = "Ахахаха! Сенсей, странные вещи говоришь. Завидуешь ветчине?"
1006006-102 = "Хотя звучит и правда приятно... Лежать в тёплом горячем источнике..."
1006006-103 = "Хаха, но если бы ты был ветчиной, я бы сказала..."
1006006-104 = "Не могу дождаться, когда съем Сенсея!"
1006006-105 = ""
1006006-107 = ""
1006006-108 = "...И сразу бы съела! Ахаха!"
1006006-109 = "Фух."
1006006-110 = "Хи-хи. Не смеши меня больше! А то снова проголодаюсь!"
1006006-111 = "Ладно, раз мы поели..."
1006006-112 = ""
1006006-114 = ""
1006006-115 = ""
1006006-116 = "Оп!"
1006006-117 = "Пора возвращаться к строительству горячих источников!"
1006006-118 = "[ns11] «А?! В такое время...?!»\n[ns12] «Ты прямо сейчас уходишь?!»"
1006006-121 = "Хи-хи. Конечно!"
1006006-122 = "Я пришла сюда проверить рамэн и немного отдохнуть. А вообще у меня полно работы!"
1006006-123 = "Мне нужно выкопать очень важный горячий источник! Разве не всем хочется вытянуться и понежиться в горячей воде, как этой лапше?"
1006006-124 = "В этом и состоит миссия Департамента горячих источников!"
1006006-125 = "Спасибо, что пришёл, Сенсей! Давай скоро снова поедим вместе!"
1006006-126 = "Я побежала!"
1006006-127 = ""
1006006-129 = ""
1006006-135 = "[ns13] «...Рамэн у неё и правда получился отличный.»\n[ns14] Допить оставшийся бульон."
1006006-136 = ""
1006006-137 = ""
1006006-141 = "После этого я всё убрал и вернулся в Шале, где уснул на диване."
