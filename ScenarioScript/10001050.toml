[translation]
10001050-1 = "Эпизод 5; Хорошее место для сна"
10001050-2 = "Бывший институт академии Красная Зима"
10001050-3 = "*зевает* Спать хочется..."
10001050-4 = "До дневного сна ещё рано... Вы уже хотите спать, президент?"
10001050-5 = "Может, это из-за упадка сил после сладкого... Веки тяжелеют..."
10001050-6 = "А, и мы ведь долго шли сюда пешком. Неудивительно, что вы устали."
10001050-7 = "[s] «Хотя половину пути я нёс её на себе.»"
10001050-8 = "На что вы намекаете, Сенсей? Нам всё равно пришлось внезапно идти через горы."
10001050-9 = "Президент так долго сидела взаперти в своём кабинете, что поход через горы, конечно же, её утомил."
10001050-10 = "Как бы то ни было, в таком состоянии мы не можем продолжать операцию. Давайте отдохнём, чтобы президент восстановила силы."
10001050-12 = "Почему бы вам не вздремнуть в комнате отдыха, Великий лидер?"
10001050-13 = "Только не здесь. Они сказали, что тут водится медведь..."
10001050-14 = "Не переживайте! Если медведь и правда появится, я его прогоню!"
10001050-15 = "А как же жуки в одеялах...?"
10001050-16 = "Хм... Есть ли где-нибудь другое место, где можно спокойно поспать...?"
10001050-17 = "Я знаю идеальное место для сна."
10001050-18 = "О? Расскажите!"
10001050-19 = "Там тихо, температура в самый раз и даже приятно пахнет. Идеальное место для сна..."
10001050-20 = "Библиотека!"
10001050-21 = "[s] «Библиотека?»"
10001050-23 = "Конечно, ей далеко до библиотеки Тринити, но у нашей академии Красная Зима тоже отличная библиотека."
10001050-24 = "Там нет шумных студентов, и достаточно темно, чтобы спать..."
10001050-25 = "Там даже есть книги, которые можно использовать вместо подушек! Клянусь, библиотека создана для сна, а не для хранения книг!"
10001050-26 = "До того как меня свергли, я наверняка спала там уже сотню раз!"
10001050-27 = "[s1] «Этим не стоит хвастаться.»\n[s2] «Спать в библиотеке — лучше всего.»"
10001050-28 = "Уютное место для сна жизненно необходимо, товарищ! Без хорошего сна как вообще работать после обеда?"
10001050-29 = "Вижу, товарищ, ты тоже человек культуры!"
10001050-30 = "Однако у этого плана есть один роковой недостаток."
10001050-31 = "В библиотеке Красная Зима окопалась шайка злобных реакционеров, которые постоянно восстают против меня."
10001050-32 = "Это группа книжных червей, которые не могут устоять даже перед незаконными запрещёнными книгами. Они называются... э-э..."
10001050-33 = "Как там их ещё называют?"
10001050-34 = "Фронт освобождения знаний, Великий лидер."
10001050-35 = "Да! Эти еретики из Фронта освобождения знаний постоянно мешали мне спать под предлогом, что «библиотека нужна для чтения!»"
10001050-36 = "Сейчас наша главная задача — победить их и обеспечить себе уютное место для сна!"
10001050-37 = "Ого, Черино! Даже изнемогая от усталости, ты всё равно разрабатываешь план по возвращению секретариата!"
10001050-38 = "Погоди, что? Секретариат? Я просто хочу поспать..."
10001050-39 = "Библиотека — естественная крепость на вершине крутого холма. Если мы её захватим, получим отличную базу для дальнейшего наступления."
10001050-40 = "Кроме того, Фронт освобождения знаний — один из трёх крупнейших клубов академии!"
10001050-41 = "Если привлечём их на свою сторону, они сильно помогут нам в борьбе против председателя Марины и Государственной гвардии!"
10001050-42 = "Вы придумали такой блестящий план за столь короткое время..."
10001050-43 = "Вот почему вы наш Великий лидер!"
10001050-44 = "П-правда? Хи-хи..."
10001050-45 = "Но никакие комплименты не заменят мне сон!"
10001050-46 = "Верно. Раз план уже есть, немедленно отправляемся в библиотеку!"
10001050-47 = "*зевает* Хорошо."
10001050-48 = "Захватим крепость сна!"
10001050-50 = "Библиотека Академии Красной Зимы"
10001050-51 = "Наконец-то! Я достала новый фанбук про Шарль × Рэй от Luriel!"
10001050-52 = "Я уже почти отчаялась, ведь в Тринити был всего лишь ограниченный тираж..."
10001050-53 = "Мне невероятно повезло!"
10001050-54 = "Интересно, какие жаркие страсти ждут меня в этом выпуске?"
10001050-55 = "Я останусь в библиотеке и буду читать его все выходные."
10001050-56 = "[s] «Звучит весело.»"
10001050-57 = "А-а? Сенсей? И п-президент Черино?"
10001050-58 = "Д-давно вы здесь?"
10001050-59 = "Довольно давно."
10001050-60 = "[s] «С тех пор, как ты начала говорить о новом фанбуке.»"
10001050-61 = ""
10001050-62 = "Значит, вы всё слышали!"
10001050-63 = "Уф... У вас дело к Фронту освобождения знаний...?"
10001050-64 = "Рада, что вы спросили!"
10001050-65 = "Я пришла потому, что—"
10001050-66 = ""
10001050-67 = "Даже не говори. Опять пришла конфисковать наши драгоценные книги, да?"
10001050-68 = "Погоди, кажется, ты не так поняла—"
10001050-69 = ""
10001050-70 = "Только не забирай эту! Я ещё даже не успела её прочитать!"
10001050-71 = "Эй, да послушай же. Я пришла только—"
10001050-72 = "Нет! Пожалуйста, дай мне прочитать её хотя бы три раза..."
10001050-73 = "Нет, десять раз! Эту книгу было ужасно трудно достать!"
10001050-74 = ""
10001050-75 = ""
10001050-76 = "О боже, замолчи и послушай! Мне нет дела до твоих дурацких книг!"
10001050-77 = "...А?"
10001050-78 = "Тогда зачем ты вообще пришла сюда, в библиотеку?"
10001050-79 = "Это же очевидно — ради истинного предназначения библиотеки..."
10001050-80 = "Я пришла поспать!"
10001050-81 = ""
10001050-82 = "Что? Библиотека нужна для чтения!"
10001050-83 = "Давайте пропустим эту часть."
10001050-84 = "Так, посмотрим..."
10001050-85 = ""
10001050-86 = ""
10001050-87 = ""
10001050-88 = ""
10001050-89 = "А, вот идеальное место!"
10001050-90 = "Здесь тепло, потому что обогреватель рядом, а книжные полки дают приятную тень. Лучше некуда!"
10001050-91 = "Томоэ, подготовь мне это место."
10001050-92 = ""
10001050-93 = "Сию минуту, президент Черино! Я всё устрою именно так, как вам нравится."
10001050-94 = ""
10001050-96 = ""
10001050-99 = "П-погодите! Если перегородить проход одеялом, вы будете мешать другим читателям!"
10001050-100 = "И если ты собралась спать, зачем роешься в книжном шкафу?"
10001050-101 = "Мне нужна хорошая толстая книга вместо подушки!"
10001050-102 = "Хм-м... Кто из вас сегодня будет поддерживать мою голову...?"
10001050-103 = "О! «Роза Бастилии: ограниченное издание к 30-летию». Отлично подойдёт!"
10001050-104 = "П-погоди! Эту книгу нельзя использовать!"
10001050-105 = "Это редкая книга! Существует всего сто экземпляров. Её больше нигде в Кивотосе не найдёшь, не говоря уже об академии Красная Зима!"
10001050-106 = "Если тебе нужна просто толстая книга, почему бы не взять эту энциклопедию?"
10001050-107 = "Эх. Слишком твёрдая."
10001050-108 = "А эта в кожаном переплёте, поэтому приятно мягкая. Идеальный материал для сна."
10001050-109 = "Почему ты так одержима сном именно в библиотеке? Хочешь спать — иди в секретариат!"
10001050-110 = "К сожалению, не получится."
10001050-111 = "Почему?!"
10001050-112 = "Меня выгнали из секретариата, и председатель Марина за мной охотится."
10001050-113 = "Так что уютно подремать в комнате отдыха мне не светит."
10001050-114 = "Что? Тебя снова свергли?"
10001050-115 = "[s] «...Опять?»"
10001050-116 = "Перевороты довольно популярны среди студентов академии Красная Зима. Им нужна власть, поэтому президента Черино свергают довольно часто."
10001050-117 = "Это правда. Вообще-то это уже третий переворот за этот месяц."
10001050-118 = "Но в этот раз председатель Марина, да? Вот это наверняка головная боль."
10001050-119 = "Да-да, неважно. Теперь, когда ты всё знаешь, пора спать. *зевает*"
10001050-120 = ""
10001050-122 = ""
10001050-123 = ""
10001050-124 = ""
10001050-125 = "Я сказала, эту книгу нельзя!"
10001050-126 = "Если ты не понимаешь её ценности, я не могу отдать тебе такую книгу."
10001050-127 = "Ну и упрямая же ты! Не то чтобы книга износилась, если ОДИН раз использовать её как подушку."
10001050-128 = "Ты совсем ничего не понимаешь! Это очень ценное ограниченное издание!"
10001050-129 = "Ладно. Раз словами мне книгу не получить..."
10001050-130 = "...значит, придётся забрать её силой!"
10001050-132 = "Пф! Думаешь, я тебя боюсь? Ты всего лишь беззащитная беглянка."
10001050-133 = "Товарищи из Фронта освобождения знаний защитят наше право на свободное знание и неприкосновенность библиотеки..."
10001050-134 = "Хочешь драки — ты её получишь!"
