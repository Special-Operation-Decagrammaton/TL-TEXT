[translation]
90101110-1 = "Эпизод 11;Эпилог"
90101110-2 = "После того как происшествие разрешилось и всё успокоилось, я отправился в Генеральный студенческий совет."
90101110-5 = "[ns] «Ринни!»"
90101110-6 = "Приёмная Генерального ученического совета"
90101110-7 = ""
90101110-8 = "А, [USERNAME] Сенсей."
90101110-9 = "Давно не виделись. Надеюсь, у вас всё хорошо."
90101110-10 = "...Но важнее — не называйте меня Ринни."
90101110-11 = "[s1] «Я пришёл поднять тебе настроение!»\n[s2] «Я скучал, Ринни, столько времени прошло...»"
90101110-13 = "*вздыхает*"
90101110-14 = "Оставим ваши шутки. Вы ведь пришли что-то обсудить, да?"
90101110-15 = "Например, попросить ЕЩЁ ОДНУ отсрочку по отчёту о расходах бюджета Шале?"
90101110-16 = "Или, может быть, наконец сдать отчёт о командировке Административному совету?"
90101110-17 = "[s] «Уф...»"
90101110-18 = ""
90101110-20 = ""
90101110-21 = "Или вы пришли узнать, как продвигается анализ осколка стекла, который просили меня исследовать?"
90101110-22 = "[s3] «Не верится, что мы уже говорим о работе...»\n[s4] «Я правда переживал за тебя!»"
90101110-25 = "Волноваться не о чем. В последнее время со мной всё хорошо."
90101110-26 = "После той фальшивой..."
90101110-27 = "Простите. После возвращения президента работа Генерального студенческого совета более-менее вернулась в норму."
90101110-28 = "Она совсем не похожа на настоящего президента ни внешне, ни манерой речи, но по общей компетентности вполне сопоставима."
90101110-29 = "В чём-то, возможно, даже лучше."
90101110-30 = "Так или иначе, благодаря этому теперь я могу брать примерно один выходной в неделю."
90101110-31 = "[s5] «Один день в неделю...»\n[s6] «И для тебя это... хорошо?»"
90101110-34 = "Да. Больше выходных может нарушить мой ежедневный распорядок."
90101110-35 = ""
90101110-37 = ""
90101110-38 = "Что касается осколка... Я пыталась анализировать его разными методами."
90101110-39 = "Даже за полный 24-часовой цикл я не заметила никаких изменений в мире по ту сторону, и на свет или другие внешние раздражители он, похоже, не реагирует."
90101110-40 = "Вы называли его осколком стекла, но я бы скорее сравнила его с зеркалом."
90101110-41 = "[s] «Почему ты так думаешь?»"
90101110-42 = "Материал, который мы используем для стекла, позволяет смотреть наружу, как через окно."
90101110-43 = "Поэтому под каким углом ни смотри, изображение снаружи останется тем же."
90101110-44 = "Зеркало отражает свет, а не пропускает его, поэтому возвращает наблюдателю его собственное изображение."
90101110-46 = "Но изображение в осколке не исчезает на свету и само не светится в темноте."
90101110-47 = "Оно больше похоже на отражение."
90101110-48 = "Если это изображение отражает Кивотос, а не другой мир..."
90101110-49 = "Разве не точнее считать его зеркалом, а не осколком стекла?"
90101110-50 = "[s] «То есть это поле или бездна могут быть местами в Кивотосе?»"
90101110-51 = "Сейчас это моя основная гипотеза."
90101110-52 = "Но они не похожи ни на одно известное мне место в Кивотосе."
90101110-54 = "...Как и озеро на фотографии президента."
90101110-55 = ""
90101110-56 = "[ns] «...Кивотос в зеркале.»"
90101110-57 = "Теперь, когда думаю об этом, я помню нечто похожее в классической литературе Тринити."
90101110-58 = "Там девочка во сне проходит через зеркало и выходит с другой стороны в новый мир. Он в чём-то похож на знакомый ей мир, но во многом совершенно иной."
90101110-59 = "Всё исчезает, когда королева на шахматной доске просыпается, и тот мир оказывается всего лишь мимолётным сном."
90101110-60 = "Иногда мне невольно хочется, чтобы невероятная реальность, в которой мы живём, тоже оказалась сном."
90101110-61 = "[s] «Но мне бы не хотелось, чтобы время, проведённое с тобой, оказалось ненастоящим.»"
90101110-62 = "...Вы и с другими студентами так разговариваете?"
90101110-63 = "Пожалуйста, помните о своём положении, прежде чем такое говорить. Вам ни к чему подобные недоразумения."
90101110-64 = "[s] «Какая злая...»"
90101110-65 = "В любом случае."
90101110-66 = "Я не могу утверждать, что знаю каждый уголок Кивотоса, поэтому было бы самонадеянно говорить, что пейзажи из осколка точно нигде здесь не существуют."
90101110-67 = "Поэтому в следующий выходной я собираюсь покинуть D.U. и посмотреть, что смогу найти."
90101110-68 = "[s] «Можно с тобой?»"
90101110-69 = "Если хотите. Я не против вашей компании."
90101110-70 = "[s7] «Ура! Второе свидание с Ринни!»\n[s8] «Я приготовлю обед!»"
90101110-73 = "...Забудьте. Я пойду одна."
90101110-74 = "[s] «Какая ты злая, Ринни!»"
90101110-75 = "Перестаньте называть меня Ринни!"
90101110-80 = "Штаб отряда FOX"
90101110-81 = "[ns9] «Все уже поели?»\n[ns10] «Я собирался заказать что-нибудь на ужин...»"
90101110-84 = ""
90101110-86 = "[ns] «...Краб?»"
90101110-87 = "А. Попались."
90101110-88 = "Что значит «поймали»? Это звучит так, будто мы делаем что-то плохое, а мы ничего плохого не делаем!"
90101110-89 = "Ха-ха. Мы просто хотели посмотреть, сколько мяса в этих крабах."
90101110-90 = "Е-Если дадите нам минутку..."
90101110-91 = "...мы всё объясним."
90101110-92 = "[s11] «Тут вообще есть что объяснять?»\n[s12] «Если только вы вдруг не занялись чёрным рынком крабов.»"
90101110-95 = "Эм, ну, в общем..."
90101110-96 = "[s] «...Что вы натворили?»"
90101110-97 = "В-Всё не так!"
90101110-99 = "[ns] «...А. Это крабы семьи Карпаччо.»"
90101110-100 = "В точку. Мы смогли вернуть большую их часть, но Карпаччо не захотели забирать их обратно."
90101110-101 = "Что-то там про ПТСР и что с крабами они больше связываться не хотят..."
90101110-102 = "Говорят, рабочие, которые видели гигантского краба, теперь впадают в панику от одного звука щёлкающих клешней."
90101110-103 = "Пытались держать других в страхе, а в итоге страх обернулся против них самих. Вот уж ирония!"
90101110-104 = "Пф. Получили ровно то, что заслужили."
90101110-105 = "В общем, сейчас ходят слухи, будто Карпаччо использовали крабов для каких-то мутных дел. Они никому не были нужны, так что в порту собирались их выбросить. А мы решили, что переводить еду — расточительство."
90101110-106 = "Хотя у нас самих после всего случившегося воспоминания о крабах тоже не самые приятные."
90101110-107 = "Но вкусная еда ведь в этом не виновата."
90101110-108 = "Когда ещё выпадет шанс наесться такой горой крабов? Настоящая роскошь!"
90101110-109 = "Так что я буду есть, пока не станет плохо. Хи-хи."
90101110-110 = "Кхм."
90101110-111 = "В любом случае, простите, что пригласили так поздно..."
90101110-112 = "Но не хотите присоединиться к нам и поесть крабов, Сенсей?"
90101110-113 = ""
90101110-115 = ""
90101110-116 = ""
90101110-117 = "[ns] «А мне точно можно к вам присоединиться?»"
90101110-118 = "Конечно. У нас их полно."
90101110-122 = "И они уже почти готовы."
90101110-123 = "Так, посмотрим..."
90101110-124 = ""
90101110-127 = "Ого, и правда совсем другое дело..."
90101110-128 = "Такие сочные... Совсем не похожи на крабово-рыбные сосиски «Ёкозуна»!"
90101110-129 = "Ты серьёзно? Конечно, какие-то поддельные сосиски из муки и дешёвой рыбы с этим не сравнятся."
90101110-130 = "Фу-фу, попробуешь настоящего краба — и назад уже не захочешь."
90101110-131 = ""
90101110-135 = "...Правда? Вкус другой, но мне, если честно, рыбные сосиски нравятся больше."
90101110-136 = "ЧЕГО?! А ну язык покажи! Дай посмотрю! С ним точно что-то не так!"
90101110-137 = "Ну сами подумайте. У этих обычных крабов нет той жирности, что у рыбных сосисок. Я хочу, чтобы еда сама проскальзывала в горло!"
90101110-138 = "И вы только посмотрите! Я целую вечность ковырялась в панцире ради вот этого крошечного кусочка мяса! Это что, порция для креветки?!"
90101110-139 = "Если ты собираешься только жаловаться, тогда отдай его мне! Я съем."
90101110-140 = ""
90101110-144 = "Полагаю, Отоги хочет сказать, что мяса в этих крабах совсем немного."
90101110-145 = "Ничего удивительного. Сейчас не сезон крабов, да и поездка в металлической бочке наверняка была для них травматичной. Другого результата ждать и не стоило."
90101110-146 = ""
90101110-147 = ""
90101110-148 = "...Если говорить о количестве мяса, чем больше краб, тем его больше?"
90101110-149 = "И если продолжить эту мысль... сколько мяса, по-вашему, было бы в клешне того краба-монстра?"
90101110-150 = "Ты же сама сражалась с этой тварью вместе с нами! И теперь правда хочешь её СЪЕСТЬ?"
90101110-151 = "Да мне бы ещё доплатить пришлось, чтобы я попробовала того краба. Из него торчал огромный синий кусок металла, и он ещё плевался какой-то мерзкой жидкостью!"
90101110-152 = "Слишком узко мыслишь. Представь только, каково откусить от гигантской крабовой клешни, которая больше твоего лица."
90101110-153 = "..."
90101110-154 = "А, она задумалась."
90101110-155 = "НИЧЕГО ПОДОБНОГО!!"
90101110-158 = ""
90101110-159 = "Раньше мне доводилось есть только переработанное крабовое мясо, но из хот-пота оно тоже очень вкусное."
90101110-160 = "Похоже, остальные ингредиенты тоже готовы..."
90101110-161 = "Вот, Сенсей. Осторожно, горячо."
90101110-162 = ""
90101110-165 = "[ns13] «Сладко-солёное, будто его уже заранее приправили.»\n[ns14] «Теперь почему-то хочется риса.»"
90101110-168 = "А, хотите риса?"
90101110-169 = "Я как раз сварила немного для завтрашних инаризуси."
90101110-170 = "Нико, мне сейчас одна мысль пришла."
90101110-171 = "А что, если приправить рис этим крабовым мясом...?"
90101110-172 = "Разве не должно получиться вкусно?"
90101110-173 = "Это..."
90101110-174 = "Это точно будет вкусно!"
90101110-175 = "Ты гений, Отоги! Как мы раньше до этого не додумались?"
90101110-176 = "Потому что крабовое мясо дорогое, очевидно же."
90101110-177 = "Но сегодня у нас крабов с избытком..."
90101110-178 = "Пойду принесу весь готовый рис, который у нас есть."
90101110-179 = "Эм, а можно заодно взять из ящика на складе немного армейских крекеров?"
90101110-180 = "Мне кажется, крабовое мясо с майонезом отлично пойдёт с крекерами..."
90101110-181 = "Вот теперь ТЫ гений, FOX 3."
90101110-182 = "Сделаем это!"
90101110-183 = "Только не делайте это прямо у огня. Опасно."
90101110-184 = "Фу-фу, похоже, позже придётся сварить ещё риса."
90101110-186 = "Мы с отрядом FOX отлично провели время, доедая оставшихся крабов."
90101110-187 = ""
90101110-192 = ""
90101110-193 = "Вход в Старую библиотеку Тринити"
90101110-195 = ""
90101110-196 = "*кашляет* *кашляет*"
90101110-197 = "Президент, вы опять реставрировали старые тексты с закрытыми окнами?"
90101110-198 = "Я прямо вижу пыль в воздухе. Как вы вообще можете читать в таком помещении?"
90101110-199 = ""
90101110-201 = ""
90101110-202 = "П-Просто на улице так жарко! Если открыть окно, весь горячий воздух попадёт внутрь!"
90101110-203 = "И вообще, прямой солнечный свет — враг старых текстов..."
90101110-204 = "Ничего не знаю. Я прямо сейчас проветрю комнату."
90101110-205 = ""
90101110-207 = ""
90101110-208 = ""
90101110-209 = ""
90101110-212 = ""
90101110-213 = ""
90101110-215 = "И-И-и..."
90101110-217 = "Фух, вот так гораздо лучше."
90101110-218 = "Кстати, кажется, я раньше не видела этих книг."
90101110-219 = "Записи о сделках торговца времён междоусобиц в Хяккияко..."
90101110-220 = "Оригинальный экземпляр «Кувалды» автора «Кои о любви», отозванный из-за брака печати..."
90101110-221 = "А это... стенографическая запись Совета Святой Юстины с первого Совета Тринити?"
90101110-222 = ""
90101110-224 = ""
90101110-225 = "Почему это вообще здесь?!"
90101110-226 = "Только не говорите, президент... Вы опять сделали копию во время реставрации?"
90101110-227 = "Ч-Что значит «опять»? Я не так уж часто это делаю—"
90101110-228 = "Кхм. Эту книгу мне принесла Чиэру."
90101110-229 = "Чиэру... Разве она не пропадала довольно надолго?"
90101110-230 = "Если я правильно помню, она отправилась в катакомбы искать древние рукописи. Три месяца назад она пропала без вести..."
90101110-231 = "Она самая. Теперь уже вернулась. И притащила целую гору «раскопанных» книг."
90101110-232 = "Сейчас она снова в своей комнате в общежитии и читает всё, что пропустила. Похоже, надолго там засела."
90101110-233 = "Что ж, рада слышать, что с ней всё хорошо."
90101110-234 = "Особенно после прошлого раза. Когда её нашли возле вулкана Хинном, она создала немало проблем с Геенной."
90101110-235 = "Кошмар... Настоящий кошмар. Помнишь? Они всё твердили, что отпустят её только в том случае, если президент Библиотечного комитета лично к ним приедет."
90101110-236 = ""
90101110-238 = ""
90101110-239 = "Кстати, Шимико. Перед уходом Чиэру кое о чём спрашивала."
90101110-240 = "Она хотела узнать, не помнишь ли ты каких-нибудь новостных статей о «Перородзилле»."
90101110-241 = ""
90101110-243 = ""
90101110-244 = ""
90101110-245 = ""
90101110-246 = "...Перородзилла?"
90101110-248 = "В погоне за Лором;Продолжение в главе 3"
