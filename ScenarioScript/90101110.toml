#[!][Build: "1"]
#[!][Data: "20/09"]
[translation]
90101110-1 = "Episódio 11;Epílogo"
90101110-2 = "(Assim que o incidente dos caranguejos foi resolvido, visitei o Conselho Estudantil Federal.)"
90101110-5 = "[ns] \"Rin-chan!\""
90101110-6 = "Sala de Recepção do Conselho Estudantil Federal"
90101110-7 = ""
90101110-8 = "Sensei [USERNAME]."
90101110-9 = "Vejo que continua com a mesma disposição de sempre. #nA que devo a honra de sua visita hoje?"
90101110-10 = "...E, antes de mais nada, quem autorizou essa intimidade de 'Rin-chan'?"
90101110-11 = "[s1] \"Vim aqui para torcer por você e dar apoio moral!\"\n[s2] \"Faz tempo que não via a Rin-chan, estava morrendo de saudades...\""
90101110-13 = "Francamente..."
90101110-14 = "Conhecendo o Sensei como conheço, é óbvio que há um interesse escuso por trás dessa visita."
90101110-15 = "Quer pedir uma prorrogação de prazo para entregar os relatórios em atraso, imagino?"
90101110-16 = "Ou pretende me pedir para redigir em seu lugar a papelada destinada à Comissão Administrativa—"
90101110-17 = "[s] \"Ugh...! Acertou na mosca...\""
90101110-18 = ""
90101110-20 = ""
90101110-21 = "Ou então... veio conferir o andamento da perícia do fragmento de vidro que me solicitou anteriormente?"
90101110-22 = "[s3] \"Nossa, que frieza! Falar de trabalho logo de cara é maldade~\"\n[s4] \"Vim de verdade porque estava preocupado com o seu excesso de trabalho, Rin.\""
90101110-25 = "Não há a menor necessidade de tamanha preocupação. #n[ruby=・]U[/ruby][ruby=・]l[/ruby][ruby=・]t[/ruby][ruby=・]i[/ruby][ruby=・]m[/ruby][ruby=・]a[/ruby][ruby=・]m[/ruby][ruby=・]e[/ruby][ruby=・]n[/ruby][ruby=・]t[/ruby][ruby=・]e[/ruby], tenho estado muito bem."
90101110-26 = "Desde que aquela impostora—"
90101110-27 = "Digo, desde o retorno da Presidente do Conselho Estudantil Federal, a rotina administrativa foi praticamente normalizada."
90101110-28 = "Tanto a aparência quanto o modo de falar parecem os de outra pessoa, mas a sua capacidade de processar demandas é tão brilhante quanto a da titular."
90101110-29 = "Aliás, em determinados setores técnicos, talvez seja até superior..."
90101110-30 = "Graças a isso, passei a ter até um dia inteiro de folga por semana para dedicar a mim mesma."
90101110-31 = "[s5] \"Só um dia por semana...?\"\n[s6] \"Tem certeza de que está tudo bem com essa rotina?\""
90101110-34 = "Sim. Descansar mais do que isso me deixaria inquieta a ponto de desregular meu ritmo biológico."
90101110-35 = ""
90101110-37 = ""
90101110-38 = "Quanto a isto aqui — submetemos o fragmento entregue pelo Sensei a múltiplos métodos de aferição científica."
90101110-39 = "Observamos se havia variações na imagem do mundo em seu interior durante dias inteiros e aplicamos diferentes espectros de luz."
90101110-40 = "Como resultado, concluímos que, mais do que um vidro... trata-se de um [ruby=・]f[/ruby][ruby=・]r[/ruby][ruby=・]a[/ruby][ruby=・]g[/ruby][ruby=・]m[/ruby][ruby=・]e[/ruby][ruby=・]n[/ruby][ruby=・]t[/ruby][ruby=・]o[/ruby] [ruby=・]d[/ruby][ruby=・]e[/ruby] [ruby=・]e[/ruby][ruby=・]s[/ruby][ruby=・]p[/ruby][ruby=・]e[/ruby][ruby=・]l[/ruby][ruby=・]h[/ruby][ruby=・]o[/ruby]."
90101110-41 = "[s] \"E qual é a diferença entre os dois?\""
90101110-42 = "O vidro é uma matéria transparente feita para se olhar através."
90101110-43 = "Independentemente do ângulo de observação, ele revela a paisagem que se encontra do outro lado."
90101110-44 = "O espelho, por sua vez, possui uma das faces opaca que impede a passagem da luz, refletindo o próprio observador que se posta diante dele."
90101110-46 = "A imagem refletida neste fragmento não emite luminescência no escuro, nem desbota suas cores sob luminosidade intensa."
90101110-47 = "Comporta-se exatamente como se estivesse projetando e reagindo ao estado das coisas do nosso próprio lado."
90101110-48 = "Se o que ele reflete não é um mundo paralelo distante, mas sim uma projeção da realidade desta própria Kivotos—"
90101110-49 = "Então chamá-lo de estilhaço de espelho me parece uma definição muito mais fidedigna."
90101110-50 = "[s] \"Quer dizer que aquelas pradarias e o abismo marinho ficam em algum lugar de Kivotos?\""
90101110-51 = "Pelas análises obtidas até este momento, essa é a conclusão mais plausível."
90101110-52 = "Contudo, aquelas paisagens não guardam semelhança com nenhum local catalogado de Kivotos que seja do meu conhecimento."
90101110-54 = "...Assim como aquele lago retratado na fotografia deixada pela [ruby=・]P[/ruby][ruby=・]r[/ruby][ruby=・]e[/ruby][ruby=・]s[/ruby][ruby=・]i[/ruby][ruby=・]d[/ruby][ruby=・]e[/ruby][ruby=・]n[/ruby][ruby=・]t[/ruby][ruby=・]e[/ruby]."
90101110-55 = ""
90101110-56 = "[ns] \"...Uma Kivotos através do espelho, então.\""
90101110-57 = "Existe uma fábula clássica preservada em Trinity com uma premissa muito parecida."
90101110-58 = "A história de uma jovem que, em meio a um sonho, atravessa a superfície de um espelho e encontra um mundo que se parece com o dela, mas que funciona sob uma lógica inteiramente oposta."
90101110-59 = "Na narrativa, aquele mundo desaparece como um sonho efêmero no exato instante em que a Rainha do tabuleiro de xadrez desperta..."
90101110-60 = "Confesso que, por vezes, me pego desejando que toda esta realidade inacreditável não passe de um sonho passageiro de alguém."
90101110-61 = "[s] \"Mas eu prefiro que os momentos que passo assim com você, Rin, continuem sendo reais.\""
90101110-62 = "...Costuma dirigir palavras dessa natureza a todas as suas outras alunas?"
90101110-63 = "Isso apenas fomentará mal-entendidos desnecessários. Peço que o Sensei meça melhor as suas declarações levando em consideração a sua posição."
90101110-64 = "[s] \"Poxa... que dura...\""
90101110-65 = "Seja como for."
90101110-66 = "Nem mesmo eu tenho conhecimento de cada centímetro quadrado deste continente. #nNão posso assegurar com convicção de que aquela paisagem não exista em Kivotos."
90101110-67 = "Por esse motivo, pretendo aproveitar o meu próximo dia de descanso para me afastar um pouco do D.U. e explorar regiões mais ermas."
90101110-68 = "[s] \"Posso ir junto com você?!\""
90101110-69 = "Bom, se for apenas na condição de acompanhante, não vejo maiores inconvenientes..."
90101110-70 = "[s7] \"Ebaaa! Nosso segundo passeio a sós, Rin-chan!\"\n[s8] \"Pode deixar que eu cuido das marmitas!\""
90101110-73 = "...Esqueça, retiro o que disse. Irei absolutamente sozinha."
90101110-74 = "[s] \"Maldade, Rin-chan~ Não faz isso comigo~\""
90101110-75 = "Já mandei parar de me chamar de Rin-chan!"
90101110-80 = "QG do Pelotão FOX"
90101110-81 = "[ns9] \"Meninas! Pensei em pedir entrega de comida para o almoço!\"\n[ns10] \"O que acham de comermos junt—\""
90101110-84 = ""
90101110-86 = "[ns] \"...Caranguejo?\""
90101110-87 = "Eita, fomos pegas no pulo."
90101110-88 = "Pegas no pulo por quê?! Ninguém aqui tá comendo escondido de ninguém!"
90101110-89 = "É que... bem, precisávamos aferir a conservação dos crustáceos e achamos prudente cozinhá-los—"
90101110-90 = "Sensei. Poderia nos conceder um momento para justificarmos a situação?"
90101110-91 = "Explicaremos os fatos em ordem estritamente cronológica."
90101110-92 = "[s11] \"Tudo bem, tudo bem, não precisa de relatório militar.\"\n[s12] \"Desde que não tenham conseguido esses caranguejos por vias ilícitas...\""
90101110-95 = "Ah... sobre isso, bem..."
90101110-96 = "[s] \"Ué... foi por meios escusos de verdade...?!\""
90101110-97 = "Claro que não, caramba!"
90101110-99 = "[ns] \"...São aqueles caranguejos da outra noite, não são?\""
90101110-100 = "Isso. Depois do trabalhão que tivemos pra recolher os fugitivos, a Família Carpaccio recusou terminantemente reaver a carga."
90101110-101 = "Disseram que só de olhar pros bichos sentem calafrios e que não querem ver caranguejo na frente deles nem pintado de ouro..."
90101110-102 = "Os membros que viram o monstro gigante de perto tão tendo crise de pânico só de ouvir o 'clac-clac' de uma pinça."
90101110-103 = "Quem tentou governar pelo medo acabou devorado pelo próprio veneno... #nUm desfecho pra lá de irônico, não é?"
90101110-104 = "Plantaram vento e colheram tempestade. Bem feito."
90101110-105 = "Então, como a carga seria jogada no lixo, nós ficamos com ela. #nComo correu o boato de que eram os caranguejos da máfia, ninguém no mercado quis comprar."
90101110-106 = "A gente também só tem memórias traumáticas daquela noite, mas..."
90101110-107 = "Os bichinhos não têm culpa de nada!"
90101110-108 = "E poder comer tanto caranguejo fresco assim de graça não parece até um sonho?"
90101110-109 = "Vou aproveitar pra empanturrar o bucho até não aguentar mais... hehehe."
90101110-110 = "Aham."
90101110-111 = "Enfim, desculpe a falta de modos de não termos avisado com antecedência..."
90101110-112 = "Se não for incômodo, o Sensei gostaria de se juntar a nós para este banquete?"
90101110-113 = ""
90101110-115 = ""
90101110-116 = ""
90101110-117 = "[ns] \"Posso mesmo...?\""
90101110-118 = "Mas é claro! Tem caranguejo sobrando pra alimentar um regimento inteiro."
90101110-122 = "Parece que a panela já atingiu o ponto de fervura."
90101110-123 = "Vejamos... vou experimentar um pedaço..."
90101110-124 = ""
90101110-127 = "GENTE, O QUE É ISSO?! É totalmente diferente...!"
90101110-128 = "A carne é firme, suculenta e solta um caldo adocicado incrível...! #nNem se compara com os kanis borrachudos da 'Hamidashi Alimentos'!"
90101110-129 = "Mas é claro, sua boba! Querer comparar carne fresca pura com kani ultraprocessado cheio de amido é ofensa!"
90101110-130 = "Depois de provar o de verdade, nunca mais você consegue voltar pro genérico, né?"
90101110-131 = ""
90101110-135 = "Será? Eu ainda acho a salsicha de peixe de boteco mais saborosa..."
90101110-136 = "COMO É QUE É?! Cadê o seu paladar, garota?!"
90101110-137 = "É que, comparado com aquele gostinho doce e gorduroso da salsicha de peixe, #nesse caranguejo parece meio sem sal, levinho demais..."
90101110-138 = "Sem falar que a gente rala um tempão quebrando a casca pra tirar uma tirinha misera de carne! Uma carapaça gigante pra quase nada de comida."
90101110-139 = "Se vai ficar reclamando de barriga cheia, passa pra cá! Eu como a sua porção inteirinha com o maior prazer!"
90101110-140 = ""
90101110-144 = "Mas parando pra pensar, a Otogi tem um pingo de razão. #nEsses caranguejos não estão tão carnudos assim."
90101110-145 = "Também, foram mantidos amontoados em tonéis enferrujados por semanas. Era de se esperar que estivessem magros."
90101110-146 = ""
90101110-147 = ""
90101110-148 = "Se o corpo do bicho é gigante, a quantidade de carne acompanha o tamanho, né?"
90101110-149 = "Quer dizer então que as patas daquele caranguejo titânico que enfrentamos deviam estar abarrotadas de carne nobre, não é?"
90101110-150 = "Peraí... você tá cogitando comer aquele monstro de pesadelo?!"
90101110-151 = "Ele tinha ferros retorcidos cravados nas costas e cuspia uma gosma nojenta! #nEu não comeria aquilo nem se me pagassem em barras de ouro!"
90101110-152 = "Mas imagina só que loucura! #nUma pata tão grossa que mal cabe nas duas mãos, você arrancando lascas suculentas de carne fumegante—"
90101110-153 = "............"
90101110-154 = "Olha lá, ela tá balançando na dúvida!"
90101110-155 = "Tô nada! Eu não comeria aquilo de jeito nenhum!"
90101110-158 = ""
90101110-159 = "Até hoje estávamos acostumadas a comer apenas rações enlatadas e processadas, mas... #num ensopado quente cai muito bem na alma."
90101110-160 = "O caldo apurou todo o aroma e sabor da carne..."
90101110-161 = "Aqui, Sensei. Cuidado que a casca está pelando."
90101110-162 = ""
90101110-165 = "[ns13] \"Tem um sabor agridoce tão profundo e marcante.\"\n[ns14] \"Dá até vontade de mandar com uma tigela de arroz quente...\""
90101110-168 = "Gostaria de uma porção? Posso servir agora mesmo!"
90101110-169 = "Como pretendia fazer inarizushi amanhã cedo, acabei de cozinhar uma panela inteira de arroz."
90101110-170 = "...Gente, tive uma ideia genial!"
90101110-171 = "E se a gente misturar esse caldo gordo de caranguejo com o arroz temperado de inarizushi—"
90101110-172 = "Não vai ficar bom pra caramba?!"
90101110-173 = "Isso..."
90101110-174 = "É CLARO QUE VAI FICAR UMA DELÍCIA!"
90101110-175 = "A gente já comeu tanto inarizushi nessa vida, como é que nunca pensamos nisso antes?!"
90101110-176 = "Ora, porque comíamos inarizushi por necessidade, caranguejo nunca foi algo do nosso alcance."
90101110-177 = "Mas hoje temos crustáceo sobrando pra dar e vender!"
90101110-178 = "Vou trazer a panela inteira de arroz pra cá!"
90101110-179 = "Ei, posso pegar os pacotes de biscoito militar também?"
90101110-180 = "Passar uma maionese no caranguejo desfiado e colocar por cima do biscoitinho crocante... hummm!"
90101110-181 = "Você é um gênio gastronômico!"
90101110-182 = "Bora fazer isso agora mesmo!"
90101110-183 = "Meninas, não fiquem pulando perto do fogareiro aceso, é perigoso!"
90101110-184 = "Hehe... Acho que vou lavar mais um pouco de arroz e deixar de molho pro jantar."
90101110-186 = "(Dividindo aquele banquete de caranguejo com as meninas do Pelotão FOX, passamos momentos calorosos e inesquecíveis.)"
90101110-187 = ""
90101110-192 = ""
90101110-193 = "Entrada da Biblioteca Antiga de Trinity"
90101110-195 = ""
90101110-196 = "...Cof, cof-cof!"
90101110-197 = "Senhorita Ui, não me diga que trabalhou de novo sem abrir nenhuma janela?"
90101110-198 = "Ai, ai... esta sala está pura poeira. #nNão sei como consegue ler livros num ar pesado desses."
90101110-199 = ""
90101110-201 = ""
90101110-202 = "É-É que tem feito muito calor lá fora ultimamente... se eu abrir a porta, o bafo quente invade tudo."
90101110-203 = "Além do mais, a luz solar direta é a pior inimiga das obras raras—"
90101110-204 = "Sim, sim, já sei de cor. Vou abrir as frestas para ventilar um pouco."
90101110-205 = ""
90101110-207 = ""
90101110-208 = ""
90101110-209 = ""
90101110-212 = ""
90101110-213 = ""
90101110-215 = "A-Ai, que frio...!"
90101110-217 = "Ufa, que alívio. O ar renovado é outra coisa."
90101110-218 = "...Ué, nunca vi esses manuscritos por aqui."
90101110-219 = "Registros contábeis comerciais do período de guerras de Hyakkiyako... de uma guilda mercantil antiga."
90101110-220 = "A primeira edição de 'A Marreta', do autor Koi-yo-Koi... #nmas todas as cópias não deveriam ter sido recolhidas por defeito gráfico na encadernação...?"
90101110-221 = "E-Esta aqui... é a ata oficial redigida pelo Conselho dos Santos de Justina durante o Primeiro Concílio de Trinity?!"
90101110-222 = ""
90101110-224 = ""
90101110-225 = "Como é que tesouros desses vieram parar aqui...?"
90101110-226 = "...Senhorita Ui, não me diga que a senhora andou fazendo cópias clandestinas durante as restaurações de novo?"
90101110-227 = "O-O que você quer dizer com 'de novo'?! Nem sempre eu faço cópias, tá bom?!"
90101110-228 = "Cof, cof! E-Essas preciosidades foram resgatadas pela Chieru-chan!"
90101110-229 = "A Chieru-chan... a vice-diretora da comissão?!"
90101110-230 = "Aquela mesma que disse que ia procurar tomos perdidos nas catacumbas e estava desaparecida há mais de três meses?!"
90101110-231 = "Ela mesma. Ela retornou esta manhã com uma verdadeira coleção de manuscritos que [ruby=・]e[/ruby][ruby=・]s[/ruby][ruby=・]c[/ruby][ruby=・]a[/ruby][ruby=・]v[/ruby][ruby=・]o[/ruby][ruby=・]u[/ruby] no subterrâneo."
90101110-232 = "Agora ela está descansando no dormitório... #nmas avisou que vai se trancar para ler por um bom tempo, então nem adianta chamá-la."
90101110-233 = "Ela podia ao menos ter mandado um recado antes... Mas que bom que voltou sã e salva."
90101110-234 = "Da última vez que ela se meteu no Vulcão Hinnom, quase causou uma crise diplomática com Gehenna..."
90101110-235 = "Aquilo foi... um pesadelo sem fim. Disseram que só libertariam a refém se a diretora da biblioteca fosse pessoalmente até lá negociar... ai, minha cabeça."
90101110-236 = ""
90101110-238 = ""
90101110-239 = "Ah, antes que eu me esqueça... a Chieru-chan deixou um recado especial para você, Shimiko."
90101110-240 = "—Ela perguntou: 'Você ainda se lembra daquela antiga reportagem sobre o Perorodzilla?'"
90101110-241 = ""
90101110-243 = ""
90101110-244 = ""
90101110-245 = ""
90101110-246 = "...'Perorodzilla', ela disse?"
90101110-248 = "Caça às Lendas Urbanas;Continua no Capítulo 3"
