[translation]
1000808-1 = "Сияющая ночь"
1000808-2 = "Коридор Миллениума"
1000808-3 = "Эй, Сенсей. Спасибо, что пришёл так поздно."
1000808-4 = "Место, которое я хочу показать, своего рода секрет."
1000808-5 = "Я раньше никому о нём не рассказывала..."
1000808-6 = "Сюда я прихожу, когда прогуливаю занятия."
1000808-7 = "Так что теперь только ты можешь знать об этом месте."
1000808-8 = "Ладно, Сенсей."
1000808-9 = "Закрой глаза."
1000808-10 = ""
1000808-11 = "Давай."
1000808-13 = "Возьми меня за руку."
1000808-16 = "Эй! Это не моя рука!"
1000808-17 = "*вздох* Не пугай меня так."
1000808-18 = "Идём. Сюда."
1000808-22 = "*динь*"
1000808-23 = "Хе. Уже понял? Это лифт!"
1000808-24 = "Конечно, мы едем наверх."
1000808-25 = "Лучше приготовься. Эта штука движется со скоростью 2000 метров в минуту."
1000808-26 = "*вр-р-рум*"
1000808-27 = "..."
1000808-28 = "..."
1000808-29 = "..."
1000808-30 = "*вр-р-рум*"
1000808-31 = "*динь*"
1000808-32 = "Приехали. Наша остановка."
1000808-33 = "Смотри под ноги."
1000808-37 = "*ш-ш-ш*"
1000808-38 = "Можешь открыть глаза, Сенсей."
1000808-39 = "[s] «...!»"
1000808-42 = "― Добро пожаловать, Сенсей. Моё любимое место в мире.[wa:2900]"
1000808-45 = "― Я люблю эту школу. И... такие моменты.[wa:3820]"
1000808-48 = "― Боюсь ли я высоты? Не особо. Здесь наверху у меня адреналин зашкаливает.[wa:3710]"
1000808-51 = "― Ну, теперь ты понимаешь, почему я иногда прогуливаю. Хахаха![wa:1650]"
1000808-53 = ""
1000808-54 = "Крыша Милленниума"
1000808-55 = "Ах... Вот это было нужно."
1000808-56 = "Но теперь, когда ты знаешь это место, оно уже не секрет. Может, пора его отпустить."
1000808-57 = "[s] «Что ты имеешь в виду? Теперь это наш маленький секрет.»"
1000808-58 = "..."
1000808-59 = "Наш маленький секрет..."
1000808-60 = "Похоже, между нами постоянно появляются секреты... по крайней мере, мне так кажется."
1000808-61 = ""
1000808-62 = "Не то чтобы я была против!"
1000808-63 = "..."
1000808-64 = "Если честно, я очень этим дорожу."
1000808-65 = "..."
1000808-66 = "Т-Так что..."
1000808-67 = "...надеюсь, ты и дальше будешь мне доверять, Сенсей."
1000808-68 = ""
1000808-69 = ""
1000808-70 = "Пока я рядом с тобой, Сенсей... я не против хранить маленькие секреты только между нами."
