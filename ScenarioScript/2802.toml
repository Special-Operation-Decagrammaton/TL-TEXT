[translation]
2802-1 = "Петиция спецотряда, часть 2"
2802-2 = ""
2802-3 = ""
2802-5 = "Петиция Фронта освобождения мятного шоколада"
2802-6 = "Студенты спецотряда страдают, потому что не могут есть мятный шоколад, когда захотят."
2802-7 = "Следовательно, крайне важно снабдить спецотряд №227 огромным количеством мятного шоколада."
2802-9 = ""
2802-12 = "Петиция Федерации революционеров против лимона на жареной курице"
2802-13 = "Студенты спецотряда ежедневно сталкиваются с экстремальными условиями, нарушающими права человека. Их заставляют есть размокший караагэ!"
2802-14 = "Слово «караагэ» какое-то странное. Там, где я жила, жареную курицу называли «дзанги». Лучше назовёмся «Федерация революционеров против лимона на дзанги»."
2802-15 = "Караагэ есть караагэ. Других названий быть не может. И с тацутаагэ так же."
2802-16 = "А как насчёт дзантарэ? Можно назвать его каратарэ?"
2802-17 = "Нам даже лимонным соком его поливать нельзя. С чего вдруг соус тарэ разрешён?!#nЭй, ты что, шпионка?!"
2802-18 = "Почему они прямо в петиции ругаются друг с другом?"
2802-19 = "Мятный шоколад и караагэ никак не улучшат наше положение!#nКак они смеют проталкивать свои эгоистичные интересы в нашей петиции!"
2802-20 = "Ну, студенты Красная Зима и правда известны тем, что прежде всего думают о себе."
2802-21 = "Ух. Да и если текст напишет другой клуб, эффект будет не тот. Придётся постараться самой..."
2802-24 = "Привет, спецотряд №227!"
2802-26 = "М-Минори? Ты почему здесь?"
2802-27 = "М-Мы оплатили все строительные расходы и вообще никак не ущемляли права Рабочей партии!"
2802-28 = "Знаешь, мы не только и делаем, что бегаем и устраиваем забастовки."
2802-29 = "Объясню... Рабочая партия, естественно, слышит множество слухов, которые ходят среди студентов, и помогает этим же студентам находить разную работу."
2802-30 = "А теперь мы услышали, что спецотряд №227, с которым мы однажды планировали революцию, ищет помощи."
2802-31 = "Да... но нам не нужно ничего чинить. Мы хотим написать петицию для Секретариата."
2802-32 = "Я просила студентов из разных клубов написать для нас петиции и передать наши страдания, но ничего толком не вышло. Наверное, на этом всё.#nЯ старалась..."
2802-33 = "Хм. Вообще-то я эксперт по таким текстам!"
2802-34 = "Хороший проект создают сплочённые рабочие, единство рабочих достигается хорошими речами, а хорошие речи рождаются из хорошего текста!"
2802-35 = "П-Правда? Тогда, Минори, можно попросить тебя помочь нам?"
2802-36 = "Конечно! С удовольствием."
2802-37 = ""
2802-39 = ""
2802-41 = "«Студенты спецотряда №227 страдают от суровой погоды из-за плохих спальных мест и отопления»."
2802-43 = "«Даже с учётом их прошлых проступков эти условия чрезмерно суровы. Прошу принять меры, отменить их отстранение и вернуть всех в главный корпус»."
2802-44 = "Ого. Ты гораздо лучше, чем я ожидала."
2802-45 = "Вообще-то это немного грубо. Я всегда получаю пятёрки за письменные работы."
2802-46 = "Главное в тексте — ясно передать свою цель."
2802-47 = "И, конечно, нужно удерживать внимание читателя небольшой долей риторики."
2802-48 = "Спасибо! Эта петиция поможет Секретариату понять, насколько ужасна наша жизнь!"
2802-49 = "И ты так быстро её написала! Я впечатлена, президент Рабочей партии!"
2802-51 = "Она и правда хороша... но ты уверена, что президент Черина вообще её прочитает?"
2802-52 = "Зная её, она даже не посмотрит."
2802-54 = "Ты права, Шигурэ! Эта безответственная мелкая наверняка сожжёт её, даже не открыв!"
2802-55 = "Как заставить её прочитать?"
2802-57 = "У меня есть идея!"
2802-59 = "Просто добавлю это на лицевую сторону конверта..."
2802-61 = "Идеально! Увидев это, она точно не удержится!"
2802-63 = ""
2802-64 = "А ниже добавим вот это, чтобы она сразу поняла, от кого письмо."
2802-66 = "Ты гений, Минори!"
2802-67 = "Осталось только отправить нашу петицию в Секретариат..."
2802-68 = "И тогда наша жизнь в Старом институте наконец закончится!"
2802-70 = "Неделю спустя, в кабинете Черины в здании Красная Зима."
2802-71 = "Президент, время еженедельного отчёта."
2802-72 = "Как обычно, вам пришло множество писем от разных клубов."
2802-73 = "Хи-хи. Я уже знаю, о чём они!"
2802-74 = "Все хвалят моё величие и невероятные усы!"
2802-75 = "Вообще-то, если позволите, я кратко перескажу... Кхм!"
2802-76 = "«Ребёнок, который не ценит мяту, не заслуживает быть президентом!»#n«Нам надоели усы!»#n«Мелкой диктаторше пора очнуться!»"
2802-77 = "Ч-Что вы только что сказали?!"
2802-78 = "Как они смеют прятаться за письмами и бросать вызов авторитету моих усов?!"
2802-79 = "Дай мне все письма, Томоэ! Я подвергну чистке каждого до единого!"
2802-80 = ""
2802-82 = ""
2802-84 = ""
2802-86 = ""
2802-87 = "Это что? На конверте что-то написано красным."
2802-88 = ""
2802-89 = "«Если не прочитаешь это письмо, будешь проклята»?"
2802-90 = "Томоэ! Помоги! Что мне делать? Меня проклянут!"
2802-91 = "Не волнуйтесь. Скорее всего, это просто письмо-цепочка."
2802-92 = "Письмо-цепочка...?"
2802-93 = "Да. Манипулятивное сообщение, которое заставляет людей пересылать его другим. В последнее время это популярная шутка среди студентов."
2802-94 = "Наверняка там просто куча выдуманных несчастий."
2802-95 = "Понятно. Тут и правда много всего про несчастья."
2802-96 = "«Студенты спецотряда №227 страдают от суровой погоды из-за плохих спальных мест и отопления...»"
2802-97 = "Странно. Хотя это просто шутка, мне кажется, будто я забыла что-то важное..."
2802-98 = "Главный секретарь Томоэ. Сегодня во время сна побудь рядом со мной."
2802-99 = "Н-Не потому что мне страшно! Просто разум великого лидера всегда занят!"
2802-100 = "Конечно, президент. Я останусь с вами столько, сколько потребуется."
2802-101 = "Если позволите, я могу сжечь письмо-цепочку, чтобы оно больше на вас не влияло."
2802-103 = "Хорошая идея, Томоэ."
2802-105 = ""
2802-107 = ""
2802-108 = ""
2802-112 = "Ладно, идём дальше!"
2802-113 = "Так петиция спецотряда №227 превратилась лишь в горстку пепла..."
2802-114 = "Петиция спецотряда"
