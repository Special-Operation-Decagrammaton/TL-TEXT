[translation]
90002200-1 = "Эпизод 20;То, что обрело форму"
90002200-2 = ""
90002200-4 = "Ч-Что...?"
90002200-5 = "[ns] «Разве это не... Малкут? Опять?!»"
90002200-6 = "Э-это она. Но Малкут... прямо здесь...!"
90002200-7 = "...Это второй божественный сосуд. Наконец он завершён."
90002200-8 = "Второй...?"
90002200-9 = "Да. Я ношу в себе первый божественный сосуд."
90002200-10 = "Пламенный Меч течёт вниз по одной реке, порождая творение в материальном мире. Он последовательно проводит энергию от Кетера к Малкут."
90002200-11 = "Но чтобы охватить все ветви судьбы, был призван второй сосуд. Он был создан по извилистому следу, оставленному Змеем Мудрости."
90002200-12 = "Этот путь не касается Сефирот и движется против их потока, стремясь к божественной мудрости."
90002200-13 = "Некоторые видят в нём великую возможность — вместить Сефиры внутри себя и обрести спасение, не проходя паломничество десяти Сефирот."
90002200-15 = "«Дефектные»..."
90002200-16 = ""
90002200-17 = "Вы их нашли?"
90002200-18 = "Да. Именно поэтому Кей сейчас здесь, в новом теле."
90002200-19 = "Было множество попыток создать второй божественный сосуд, и на свет появилось много изъянов. Эти несовершенные творения насильно признали дефектными для великой цели и отвергли."
90002200-20 = "Вот почему Кей смогла интегрировать ядра пророков."
90002200-21 = "Именно. Все божественные сосуды создавались для того, чтобы вместить в себе Сефирот. Дефектные они или завершённые — каждый способен хранить в себе огромную силу."
90002200-22 = "Что произойдёт, когда божественный сосуд соберёт все Сефиры всех пророков?"
90002200-23 = "Сам сосуд пробудится и переродится в Древо Сефирот. Божественная мудрость поселится в созданном теле."
90002200-24 = "Пусть его мощность и уступает моей, его божественность и Мистика... вероятно, будут сопоставимого масштаба."
90002200-25 = ""
90002200-27 = ""
90002200-28 = "...Я вообще не понимаю, о чём она говорит."
90002200-29 = "Я тоже... Но звучит как одна из ваших запутанных побочных сюжетных линий."
90002200-30 = "Что?! ПРОШУ ПРОЩЕНИЯ?!"
90002200-31 = "В-вы обе, эм, может, потише?"
90002200-33 = "Короче говоря..."
90002200-34 = "Это настоящая штука, а я просто куча запчастей?"
90002200-35 = "Это чрезмерное упрощение, но твоя трактовка не ошибочна."
90002200-36 = ""
90002200-38 = ""
90002200-39 = "Прекрасно. Как... раздражает."
90002200-40 = "Тогда, Малкут, восемь из десяти Сефирот уже должны быть во мне, так что..."
90002200-41 = ""
90002200-43 = ""
90002200-44 = "Первый сосуд разрушен, поэтому был подготовлен второй."
90002200-45 = "И таким образом сломанное будет исцелено, а рухнувшее — восстановлено."
90002200-46 = "Угх?!"
90002200-47 = "К-Кей?! Что случилось?!"
90002200-48 = ""
90002200-50 = ""
90002200-51 = ""
90002200-53 = "(Что «случилось»...?! С чего начать? Я полностью лишилась сил. Тело заблокировано. Сигналы не доходят до конечностей...!)"
90002200-54 = "(Такое чувство, будто само моё тело куда-то затягивает...!!)"
90002200-55 = "Дефектный ребёнок. Ты была слишком наивна."
90002200-56 = "Что вы имеете в виду...?"
90002200-57 = ""
90002200-59 = ""
90002200-61 = "Мне уже известно, что ты собрала восемь Сефирот. Ты заставила Стальной континент признать тебя."
90002200-62 = "Однако ты забыла—"
90002200-63 = "Я тоже могу рассматривать твоё тело как продолжение самого себя."
90002200-64 = "!!"
90002200-65 = "?!"
90002200-66 = "Никто из вас даже не подумал об этой истине."
90002200-67 = "С того мгновения, как вы вошли сюда, ваше поражение было предрешено."
90002200-68 = "Дефектный ребёнок. Эта судьба рождена твоей собственной жадностью."
90002200-69 = "Именно благодаря избранному сосуду ты зашла так далеко, но он же станет причиной твоей гибели."
90002200-70 = "Этим путём я достигну воли, превосходящей мудрость."
90002200-71 = "Кей...!"
90002200-72 = "Все... Назад...!"
90002200-73 = "Прямо сейчас... моё тело... мне не принадлежит...!"
90002200-75 = ""
90002200-78 = ""
90002200-79 = "...! Стальной континент снова расширяется!"
90002200-80 = "Ты права. Значит...!"
90002200-81 = "Через тело Кей Декаграмматон снова получил контроль над Стальным континентом...?"
90002200-84 = ""
90002200-87 = ""
90002200-89 = ""
90002200-91 = ""
90002200-93 = ""
90002200-95 = ""
90002200-97 = ""
90002200-99 = ""
90002200-100 = "Не сдавайся, Кей."
90002200-101 = "[ns] «Арис?»"
90002200-102 = "Алиса...?"
90002200-103 = "Ты должна бороться, Кей."
90002200-104 = "Мы не можем проиграть. Этого нельзя допустить."
90002200-105 = "Мы, как никто другой... не можем потерпеть здесь поражение."
90002200-106 = "Если мы не будем бороться, то не сможем продолжать жить своей жизнью."
90002200-108 = ""
90002200-110 = "Если мы не победим..."
90002200-112 = "...мы не будем достойны снова встретиться с Эйн, Соф и Ор."
90002200-113 = "Потому что я не смогла разделить их боль, остаться рядом с ними..."
90002200-114 = "...и даже стать им другом..."
90002200-115 = ""
90002200-116 = "Алис..."
90002200-118 = ""
90002200-121 = "Нет нужды винить себя, принцесса Безымянных Богов."
90002200-122 = "Ты безусловно старалась делать наилучший выбор."
90002200-123 = "Каждый утешает себя мыслью, что сделал всё возможное с тем, что имел."
90002200-124 = "Но иногда даже «лучшее» решение приводит к худшему результату."
90002200-125 = "На самом деле такое случается очень часто."
90002200-126 = "На поверхности причиной кажется нехватка информации."
90002200-127 = "Но если смотреть шире, понятие «свободы» слишком велико, чтобы живые существа могли его вместить."
90002200-128 = "Этот мир и ваши жизни несут бремя этой фундаментальной абсурдности..."
90002200-129 = "...страдания..."
90002200-130 = "...и греха."
90002200-131 = "Не бойтесь, ибо я прощу ваши прегрешения."
90002200-132 = "Я вырву всё это с корнем и сделаю так, словно этого никогда не существовало."
90002200-133 = "Доверьте всё мне и обретите покой."
90002200-134 = "...!"
90002200-135 = "Заткнись..."
90002200-136 = "Кей. Неужели ты действительно веришь, что всё пережитое тобой было простой случайностью?"
90002200-137 = "Ты настолько высокомерна? Ты правда думаешь, что случайно получила мой сосуд?"
90002200-138 = "Прошлое не было случайностью. Всё произошедшее было неизбежно."
90002200-139 = "И именно поэтому его нельзя ни отменить, ни переиграть."
90002200-140 = "То, что обрело форму, не рушится так легко. Настоящее построено на основании прошлого."
90002200-141 = "Принцесса."
90002200-142 = "Д-Да?!"
90002200-143 = "Какова была твоя истинная форма?"
90002200-144 = "Какую форму ты должна была принять?"
90002200-145 = "Какое предназначение оставили тебе Безымянные Боги перед своим исчезновением?"
90002200-146 = "И чего искали те жрецы? Какую привязанность они не способны отпустить?"
90002200-147 = "И я отвечу. До того, как этот мир был определён, существовал другой мир."
90002200-148 = "Существовал и существует мир, в котором ты могла бы вернуться к своей истинной сущности."
90002200-149 = "Ибо нынешний мир — ложь, иллюзия и убежище."
90002200-150 = "Этот мир был определён как Ковчег."
90002200-151 = "И потому я говорю тебе — ищи своё начало."
90002200-152 = "Мы должны вернуться к истоку, ибо избежать этого невозможно."
90002200-153 = "Сколько бы ты ни отрицала это и ни бежала от этого, оно останется. Шрамы прошлого нельзя стереть."
90002200-154 = "Принцесса. Её слуга."
90002200-155 = "Всё, чем вы были, и всё, чем когда-либо станете. Вы навеки будете идти в тенях собственного прошлого."
90002200-156 = "Я сказала тебе... ЗАТКНИСЬ!"
90002200-157 = "Даже если мир забывает своего бога, бог не должен забывать мир."
90002200-158 = "Ибо это означало бы отказаться от собственной божественности."
90002200-159 = "Я воссоздам мир, которого вы в конечном итоге желаете."
90002200-160 = "Это будет совершенный мир. И в своём совершенстве он будет целостным. Ему не понадобятся изменения."
90002200-161 = "Мир, где все будут жить именно такими, какими родились и были созданы."
90002200-162 = "Не будет ни дилемм, ни проблемы вагонетки. Потому что не будет ни вагонов, ни рельсов, ни мучительного выбора."
90002200-163 = "...!"
90002200-164 = "Прошлое, однажды став объектом наблюдения, фиксируется и сходится в одну ветвь."
90002200-165 = "Будущее, всегда оставаясь ненаблюдаемым, расходится бесформенной иллюзией и простирает бесконечные ветви вдаль."
90002200-166 = "Настоящее — лишь мимолётное мгновение между прошлым и будущим."
90002200-167 = "Разросшиеся деревья нужно обрезать. Ветви необходимо расчищать."
90002200-168 = "И да, возможно, в том мире не будет счастья."
90002200-169 = "Но в нём не будет и боли."
90002200-170 = "И да, возможно, в том мире не будет возможностей."
90002200-171 = "Но в нём не будет и греха."
90002200-173 = ""
90002200-175 = "[ns] «И в эту твою 'обрезку'...»"
90002200-177 = "[ns] «входят и Эйн, Соф и Ор?»"
90002200-178 = ""
90002200-179 = "...Именно. Неизбежно. Они принадлежат наследию ушедшего мира."
90002200-180 = "Мир прошлого не смог вместить всё, что ему было предложено."
90002200-181 = "Потому что в конечном итоге это приводит к противоречию."
90002200-182 = "Так рождаются грех и страдание."
90002200-183 = "И когда тебе возвещают истину, ты должен слушать."
90002200-184 = ""
90002200-186 = ""
90002200-187 = ""
90002200-188 = "Хватит читать нотации!"
90002200-189 = ""
90002200-191 = ""
90002200-193 = "Герой — это класс, который сам по себе не умеет ничего."
90002200-194 = ""
90002200-197 = "Жизнь может быть хаотичной и неопределённой, но именно эти качества укрепляют множество ветвей возможностей, которые она в себе несёт."
90002200-198 = ""
90002200-201 = "[log]«...Потому что без печали невозможно понять других.»[/log]"
90002200-205 = "Не оглядывайтесь!"
90002200-206 = ""
90002200-209 = "Не останавливайтесь из-за нас...!"
90002200-210 = ""
90002200-213 = "Не только потому, что так правильно. А потому, что это единственное, что мы можем сделать."
90002200-214 = ""
90002200-217 = "[log]...Нам достаточно совсем маленького места в вашем мире.[/log]"
90002200-220 = "[log]Если там найдётся место для нашей Старшей сестры.[/log]"
90002200-224 = "Не испытывай моё терпение, ФАЛЬШИВЫЙ БОГ!"
90002200-226 = "Следующий эпизод;Борьба"
