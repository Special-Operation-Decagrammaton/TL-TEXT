[translation]
221050-1 = "Episode 5;The Elderly Cat, Sammy"
221050-3 = "[ns] \"A toy...?!\""
221050-4 = "Yes. Cats love things that move."
221050-5 = "Fabric or rubber balls break right away, so I made this out of rope so it wouldn't tear easily."
221050-10 = "Right in front of our guest... You are such a trouble maker. #nHow many times are you going to cause mischief just today?"
221050-11 = "Meow~"
221050-16 = "Is that so? #nI am glad to hear it was not a distress signal."
221050-17 = "...Then what was the intention behind the S.O.S. on this ball?"
221050-18 = "Sammy, O Spoudeios――it is Sammy's nickname, meaning the elderly cat, Sammy."
221050-19 = "Normally, we would not use a misleading label like S.O.S., but... since this was a cat toy..."
221050-20 = "In the first place, I never expected it to fall into someone's hands――"
221050-21 = "I am truly sorry for causing you worry."
221050-23 = "[ns] \"I am glad it wasn't an S.O.S.\""
221050-27 = "[ns1] \"So you are the owner of that ball.\" \n[ns2] \"What a cute little troublemaker.\" "
221050-32 = "Purr..."
221050-35 = "Offering your chin to someone you just met... You do not have an ounce of wariness in you..."
221050-36 = "...Though that is probably why everyone on the Odyssey loves you."
221050-37 = "Fufu, how adorable..."
221050-38 = "How old is she? Since she is called an elderly cat, is she quite old?"
221050-39 = "Even just from the records, she should be over 15 years old."
221050-40 = "We do not know exactly when she came aboard the ship, so we cannot say her exact age..."
221050-42 = "[ns] \"That is quite a long life for a cat.\""
221050-43 = "Yes, truly."
221050-44 = "Though she still acts just like a kitten."
221050-45 = "Meow..."
221050-46 = "So it was not my imagination that seemed to show every student in the academy knowing Sammy."
221050-47 = "I believe you mentioned it was not unusual on the Odyssey... #nIs keeping cats on the ship a tradition as well?"
221050-48 = "Yes. It is a custom known as the Ship Cat."
221050-49 = "Tracing back its origins, it apparently started with bringing them aboard to catch mice."
221050-50 = "Times have changed, but encountering a cat on a ship is still considered a good omen, #nso we keep cats even now to boost student morale and manage stress."
221050-51 = "Purr, purr..."
221050-52 = "Since we are on the subject, shall I introduce Sammy to you?"
221050-54 = "As I already mentioned, Sammy is an old cat of 15 years."
221050-55 = "When the captain before last enrolled, she was already running around the deck of the Olympus. #nIn other words, you could say she is the most experienced crew member in this academy."
221050-56 = "But actually... I have been worried for some time now about whether we should return to D.U. regarding Sammy. #nEven before receiving this request to return to port."
221050-57 = "Is there something wrong with Sammy?"
221050-58 = "She is quite old now. #nWhile she is as energetic as ever, we have begun to see signs of decline due to aging."
221050-59 = "According to the diagnosis by the Shipkeeper chief in the infirmary, her blood pressure is high and she shows symptoms of arthritis."
221050-60 = "Perhaps her left hind leg hurts, as she drags it when she walks..."
221050-61 = "Perhaps she was just too energetic until now. #nOver the past few months, she has been falling on the deck and coughing more often..."
221050-63 = "[ns] \"So you were considering returning to port for her treatment.\""
221050-64 = "No, as expected, we cannot change the course of the entire fleet for a single cat."
221050-65 = "If worst came to worst, we could have sent only Sammy to land using a Trident speedboat."
221050-66 = "However, what worried me even more was――"
221050-70 = "The maritime taboos?"
221050-74 = "...Yes."
221050-75 = "There are simply so many sailor superstitions related to cats."
221050-76 = "Like, good things happen when a cat is in a good mood, and bad things happen when it is in a bad one."
221050-77 = "If a cat falls, misfortune strikes; if a cat sneezes, a storm approaches..."
221050-78 = "So every time Sammy's health worsens, the students become unsettled. #nI had been agonizing over whether we should send her ashore."
221050-79 = "However..."
221050-80 = "[s] \"You found yourself with a reason you couldn't send her ashore.\""
221050-81 = "Yes. #nWhen I suggested sending Sammy to land for the sake of her health――"
221050-82 = "The Odyssey's opinions were split into two."
221050-83 = "One side insisted on taking Sammy off the ship based on the sailor taboos."
221050-87 = "We have already had three storms! #nWe have to get Sammy off the ship before something even worse happens."
221050-88 = "I do not want to imagine it... but what if Sammy's condition gets even worse than it is now?"
221050-89 = "I think receiving treatment on land where the facilities are solid would be better for Sammy, too."
221050-91 = "――And so on."
221050-92 = "However, the other side insisted she should not be taken off, citing the bonds they have built up."
221050-96 = "The Odyssey is not just any ship! #nWe can provide plenty of treatment right here inside the ship!"
221050-97 = "Sammy has spent her whole life on the sea! #nWill she even be able to get used to an environment on land now?"
221050-98 = "Just because a bit of bad luck has continued, we cannot just hand Sammy over, who we have spent years with, #nto someone whose background we do not even know!"
221050-100 = "――That is how it is."
221050-101 = "Precisely because you can understand both sides' arguments, you cannot make a decision."
221050-102 = "Yes..."
221050-106 = "[ns] \"What do you think, Minato?\""
221050-107 = "I..."
221050-108 = "...This is the reason I wanted to return to D.U. and meet the General Student Council President."
221050-109 = "The Odyssey's taboos have been built up over a long period of time. #nBecause of that, they have become a guide to lead the students."
221050-110 = "The conflicts that have arisen among the Odyssey students until now #nhave also been settled by precedent and rules."
221050-111 = "Yet only the matter of Sammy cannot be judged by any rule..."
221050-112 = "What is for Sammy's sake, for the students' sake, for the academy's sake. #nNo matter how much we discussed it, we could not reach an answer."
221050-113 = "Nor is it a problem that time will solve..."
221050-114 = "Therefore... I want to ask for the thoughts of the General Student Council President and Sensei."
221050-118 = "If you gain something, you also lose something."
221050-121 = "No matter what choice you make, you cannot avoid losing something."
221050-122 = "If your choice causes the students to lose something, you must bear that responsibility."
221050-123 = "――Is that not what a captain is?"
221050-127 = "However――"
221050-128 = "...As the General Student Council President says."
221050-130 = "[ns] \"Wait a minute.\""
221050-131 = "Do you have an opinion?"
221050-132 = "[s3] \"I mostly agree, but...\" \n[s4] \"Still, I think there is something we can do to help.\" "
221050-135 = "Certainly, helping an academy facing difficulties is the duty of the General Student Council President."
221050-136 = "However, by what method?"
221050-137 = "[s] \"Could you give us a few days of grace?\""
221050-141 = "[ns5] \"We might find a different answer, right?\" \n[ns6] \"From a third-party perspective, that is.\" "
221050-144 = "A third-party perspective, you say."
221050-145 = "That is one way to look at it. #nWe cannot yet say that we fully understand the situation they are placed in."
221050-146 = "Then――"
221050-147 = "――The deadline will be one week."
221050-148 = "We cannot keep a busy Sensei tied down to this matter, either."
221050-149 = "In the meantime, let us look around the academy and think of a way."
221050-150 = "Thank you for your consideration."
221050-151 = "Think nothing of it."
221050-153 = "Those with responsibility must fulfill it――because it is only natural."
221050-157 = "Next Episode;Curiosity Killed the Cat..."
