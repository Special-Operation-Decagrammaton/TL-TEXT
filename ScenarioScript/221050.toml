#[!][Data: "20/09"]
[translation]
221050-1 = "Episódio 05;Sammy, o Velho Gato Marinheiro"
221050-2 = ""
221050-3 = "[ns] \"Um brinquedo......?!\""
221050-4 = "Sim. Gatos adoram qualquer coisa que se mova ou role."
221050-5 = "Bolinhas comuns de borracha ou tecido rasgavam num piscar de olhos com as unhas dele,#nentão decidi trançar uma de corda naval resistente para não arrebentar."
221050-6 = ""
221050-8 = ""
221050-9 = ""
221050-10 = "Logo na frente das visitas importantes... que gato travesso você me saiu, hein?#nQuantas traquinagens vai aprontar só hoje?"
221050-11 = "Myaao～"
221050-12 = ""
221050-14 = ""
221050-15 = ""
221050-16 = "Compreendo perfeitamente.#nSe não se tratava de um pedido de socorro real, fico muito mais aliviada."
221050-17 = "......No entanto, qual seria o significado da inscrição 'S.O.S.' gravada na bola?"
221050-18 = "Sammy, O Spoudeios―― 'Sammy, o Velho Sábio'. É um apelido carinhoso que demos para ele."
221050-19 = "Em circunstâncias normais, jamais registraríamos a sigla 'S.O.S.' em nada a bordo para evitar alarme falso... mas aquilo era só um brinquedo de morder de um gatinho..."
221050-20 = "Nunca nos passou pela cabeça que um dia aquilo fosse parar nas mãos de alguém em terra firme――"
221050-21 = "Peço imensas desculpas por ter causado tanta preocupação desnecessária a vocês."
221050-22 = ""
221050-23 = "[ns] \"Se não era ninguém em perigo de verdade, tá tudo ótimo!\""
221050-24 = ""
221050-26 = ""
221050-27 = "[ns1] \"Então era você o dono daquela bolinha famosa, né?\"\n[ns2] \"Olha só que coisa mais fofa e bagunceira.\""
221050-32 = "Purrrr, purrrr......"
221050-33 = ""
221050-35 = "Oferecendo o queixinho para fazer carinho logo na primeira vez que vê a pessoa... Cadê o seu instinto de defesa, Sammy?"
221050-36 = "......Mas é por isso mesmo que todas as alunas da Odisseia são completamente apaixonadas por você."
221050-37 = "Fufufu, que gracinha adorável..."
221050-38 = "Quantos anos ele tem? Para ser chamado de 'velho gato', imagino que já tenha uma idade considerável, não?"
221050-39 = "Pelos registros históricos da escola, ele já passa dos 15 anos com certeza."
221050-40 = "Não sabemos a data exata em que ele embarcou pela primeira vez, então a idade precisa é um mistério..."
221050-41 = ""
221050-42 = "[ns] \"Para um gatinho, 15 anos é uma vida bem longa.\""
221050-43 = "Sim, com toda certeza."
221050-44 = "Embora ele continue se comportando como se fosse um filhote arteiro."
221050-45 = "Myaau......"
221050-46 = "Então não foi mera impressão minha quando notei que todas as alunas da escola conhecem o Sammy pelo nome."
221050-47 = "Você havia mencionado antes que isso é comum na Odisseia...#nCriar gatos a bordo de navios também faz parte das tradições marítimas?"
221050-48 = "Sim, é o antigo costume dos '[ruby=Ship Cat]gatos marinheiros[/ruby]'."
221050-49 = "Dizem que, nos primórdios da navegação, eles eram levados a bordo para caçar ratos nos porões de mantimentos."
221050-50 = "Os tempos mudaram, mas cruzar com um gato a bordo continua sendo considerado um sinal de suprema boa sorte.#nPor isso mantemos essa tradição viva até hoje, para elevar o moral da tripulação e aliviar o estresse das viagens longas."
221050-51 = "Purrrr, purrrr......"
221050-52 = "Aproveitando a ocasião, gostaria de lhes contar mais sobre a história do Sammy."
221050-54 = "Como mencionei, o Sammy já é um senhor idoso com mais de 15 anos de estrada."
221050-55 = "Quando a predecessora da minha antecessora ingressou na academia, o Sammy já corria livre pelo convés do Olympos.#nOu seja, ele é, com folga, o tripulante mais veterano e experiente de toda a Odisseia."
221050-56 = "Porém... para ser bem sincera, a questão da saúde do Sammy já vinha me tirando o sono sobre retornarmos ou não a D.U.#nMesmo antes de recebermos a ordem oficial do Conselho Estudantil Federal."
221050-57 = "Ocorreu algum problema de saúde com ele?"
221050-58 = "A idade avançada cobrou o seu preço.#nEle continua animado como sempre, mas os sinais de declínio físico ficaram evidentes demais."
221050-59 = "Pelo diagnóstico da doutora [ruby=Funamori]Sanae[/ruby], chefe da enfermaria, ele apresenta pressão arterial elevada e sintomas sérios de artrite."
221050-60 = "A patinha traseira esquerda parece doer bastante, ele vive mancando e arrastando o pé..."
221050-61 = "Talvez tenhamos nos acostumado a vê-lo tão cheio de vida no passado.#nNos últimos meses, as quedas repentinas no convés e os acessos de tosse ficaram cada vez mais frequentes..."
221050-62 = ""
221050-63 = "[ns] \"E foi por isso que pensou em voltar ao porto, pra tratá-lo?\""
221050-64 = "Não... por mais doloroso que seja, eu jamais poderia alterar o rumo de uma frota inteira por causa de um único gato."
221050-65 = "Se fosse apenas uma questão médica, eu teria despachado uma lancha rápida do Trident para levar o Sammy a uma clínica em terra."
221050-66 = "O que realmente me tirava o sono e me paralisava era outra coisa――"
221050-68 = ""
221050-70 = "Os tabus marítimos, correto?"
221050-71 = ""
221050-72 = ""
221050-73 = ""
221050-74 = "......Sim."
221050-75 = "Nas lendas e superstições dos marinheiros, existem incontáveis histórias ligadas aos felinos."
221050-76 = "Dizem que quando o gato do navio está feliz, bênçãos caem sobre o convés; mas quando ele adoece ou se enfurece, desgraças se aproximam."
221050-77 = "Se um gato tropeça, o azar é certo; se um gato espirra ou tosse, uma tempestade violenta se aproxima no horizonte..."
221050-78 = "Toda vez que a saúde do Sammy fraquejava, o pânico tomava conta das alunas.#nFiquei remoendo dia e noite se o certo não seria desembarcá-lo de vez."
221050-79 = "No entanto......"
221050-80 = "[s] \"Surgiu um motivo que te impediu de desembarcá-lo, não foi?\""
221050-81 = "Sim.#nQuando coloquei a proposta em pauta, sugerindo enviá-lo a terra firme por razões médicas――"
221050-82 = "A Odisseia se partiu ao meio em duas facções irredutíveis."
221050-83 = "Um lado defendia veementemente o desembarque imediato, amparando-se nos tabus sagrados dos mares."
221050-85 = ""
221050-86 = ""
221050-87 = "'Já enfrentamos três tempestades terríveis seguidas! Temos que tirar o Sammy do navio antes que algo muito pior aconteça!'"
221050-88 = "'Eu nem quero imaginar... mas e se a saúde do Sammy piorar ainda mais no meio do oceano?!'"
221050-89 = "'Ser tratado em clínicas de terra firme, com equipamentos de ponta, é o melhor para o bem-estar dele!'"
221050-91 = "――Diziam elas."
221050-92 = "Porém, a outra metade da tripulação bateu o pé, afirmando que os laços construídos por anos não permitiam abandoná-lo."
221050-94 = ""
221050-95 = ""
221050-96 = "'A Odisseia não é um barco qualquer! Nossa enfermaria tem plena capacidade de cuidar dele aqui dentro!'"
221050-97 = "'O Sammy passou a vida inteira navegando nas ondas! Como ele vai se acostumar a viver preso em terra firme agora?!'"
221050-98 = "'Só por causa de uma maré passageira de azar, vocês querem entregar o Sammy, que viveu com a gente por tantos anos, nas mãos de estranhos que ele nunca viu?!'"
221050-100 = "――E foi exatamente assim que o conflito se instalou."
221050-101 = "Compreendo perfeitamente o dilema. Como ambos os lados têm argumentos válidos, uma decisão justa se torna quase impossível."
221050-102 = "Sim......"
221050-103 = ""
221050-105 = ""
221050-106 = "[ns] \"E o que você pensa a respeito de tudo isso, Minato?\""
221050-107 = "Eu......"
221050-108 = "......Foi justamente por isso que desejei tanto voltar a D.U. e me encontrar com a Presidente do Conselho Estudantil Federal."
221050-109 = "Os tabus da Odisseia foram esculpidos ao longo de gerações.#nPor isso sempre serviram como a bússola moral e prática das alunas."
221050-110 = "Qualquer disputa interna anterior sempre foi resolvida aplicando-se precedentes históricos e o regimento disciplinar."
221050-111 = "Contudo, no caso do Sammy, nenhum artigo do código oferece uma resposta conclusiva..."
221050-112 = "O que seria melhor para o Sammy? O que seria melhor para as estudantes? O que seria melhor para a academia?#nPor mais que debatêssemos, nunca chegávamos a um denominador comum."
221050-113 = "E este não é o tipo de dilema que o simples passar do tempo resolverá por si só..."
221050-114 = "Por essa razão... eu gostaria imensamente de ouvir o parecer da Presidente do Conselho Estudantil Federal e do Sensei."
221050-115 = ""
221050-117 = ""
221050-118 = "Para cada ganho, há sempre uma perda correspondente."
221050-119 = ""
221050-120 = ""
221050-121 = "Não importa qual caminho decida trilhar, é impossível sair sem perder absolutamente nada."
221050-122 = "Se a [ruby=・]sua[/ruby] escolha privar as alunas de algo precioso, cabe a você carregar todo o peso dessa perda nos ombros."
221050-123 = "――Afinal... não é essa a responsabilidade de uma Capitã?"
221050-124 = ""
221050-126 = ""
221050-127 = "Mas――"
221050-128 = "......A Presidente do Conselho Estudantil Federal tem total razão."
221050-129 = ""
221050-130 = "[ns] \"Calma aí, espera um pouco.\""
221050-131 = "O Sensei teria alguma ponderação?"
221050-132 = "[s3] \"Concordo em partes com o que você disse, mas...\"\n[s4] \"Ainda acredito que nós possamos dar uma mãozinha nisso.\""
221050-135 = "De fato, prestar auxílio a uma instituição que enfrenta um impasse é uma das atribuições do Conselho Estudantil Federal."
221050-136 = "No entanto, qual solução o Sensei proporia?"
221050-137 = "[s] \"Poderia nos conceder alguns dias de prazo?\""
221050-138 = ""
221050-141 = "[ns5] \"Talvez a gente encontre uma terceira saída, não acha?\"\n[ns6] \"Olhando pela perspectiva de quem tá de fora.\""
221050-144 = "A perspectiva de um terceiro, é?"
221050-145 = "Faz sentido. Reconheço que ainda não compreendemos em sua totalidade a atmosfera e as dores da situação."
221050-146 = "Muito bem――"
221050-147 = "――Estabeleço um prazo improrrogável de uma semana."
221050-148 = "Não seria sensato prender o tempo precioso do Sensei a esta questão por mais tempo que isso."
221050-149 = "Durante esse período, observaremos a rotina da escola de perto para ponderarmos uma alternativa."
221050-150 = "Agradeço imensamente pela benevolência e consideração de vocês."
221050-151 = "Não precisa agradecer."
221050-153 = "Este é o dever natural que cabe àqueles [ruby=・]que[/ruby] [ruby=・]possuem[/ruby] [ruby=・]responsabilidades[/ruby]."
221050-155 = ""
221050-157 = "Próximo Episódio;A Curiosidade Matou o Gato..."
