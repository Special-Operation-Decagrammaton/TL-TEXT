[translation]
1015105-1 = "Genius and the Outing"
1015105-2 = "The mountain behind Special Class No. 183"
1015105-4 = "Sensei! Over here!"
1015105-5 = "Are you ready for our barbecue party in the snow?"
1015105-6 = "[s1] \"Wow, you look like a barbecue master!\"\n[s2] \"Do you do this often?\""
1015105-9 = "An outdoor barbecue? #nHmm, I suppose you could say I do it often, but..."
1015105-10 = "Actually... after a gas explosion blew up the kitchen wall of Class 183 the other day, I've been cooking and eating in the blizzard ever since."
1015105-11 = "Since there's no roof or walls, it's practically like having a barbecue outdoors."
1015105-15 = "Well, let's put that aside! #nI invited you because I wanted to have a barbecue party with you, Sensei!"
1015105-16 = "Leave it to me!"
1015105-17 = "[s] \"Where are the utensils?\""
1015105-18 = "Heheh. With me, the greatest scientist in Red Wint-... #nNo, all of Kivotos, there is no need to worry!"
1015105-19 = "With this one toolbox, everything can be solved. Watch me show off my secret#ntechnique!"
1015105-20 = "[s] \"Oh!\""
1015105-21 = "Now, let's begin!"
1015105-27 = "This place actually used to be a live-fire exercise site."
1015105-28 = "It apparently stopped being used long before I came to the special class, #nbut under the snow, there are missile parts and the remains of decommissioned#ntanks used for targets."
1015105-29 = "They're scraps, but it's high-quality steel, so... #nI can make everything we need for the barbecue with this!"
1015105-30 = "[s] \"That's amazing?! You can make everything?\""
1015105-31 = "Of course! The important thing is the technique, not power. #nAs a scientist, I use my head to build things."
1015105-32 = "Something like a frying pan can be whipped up just like that while we're talking!"
1015105-33 = "[s3] \"Faster than folding an origami?!\"\n[s4] \"I didn't even notice you were making it!\""
1015105-36 = "Ehehe. This is a piece of cake for me!"
1015105-37 = "Even without tools or strength, metalworking is easy as long as you get the hang#nof it!"
1015105-38 = "Next, I'll make a grill! #nThis tank's engine grill looks perfect."
1015105-39 = "I'll process it with hygiene in mind so it's safe to cook food on, so don't worry."
1015105-45 = "Ta-da! The barbecue set is complete!"
1015105-46 = "Not bad for something I made in 30 minutes, don't you think?"
1015105-47 = "[s5] \"Amazing!\"\n[s6] \"I'd almost believe it if you told me it was a store-bought item...\""
1015105-50 = "Hehe. Getting praised by you, Sensei, is truly special."
1015105-51 = "It's so heartfelt, it really moves me! #nYou might be a genius at praising, Sensei."
1015105-52 = "...A-Anyway, the firewood is ready! The utensils are ready! The table is ready!"
1015105-53 = "Now, Sensei, please bring out the meat!"
1015105-54 = "[s7] \"Hmm...?\"\n[s8] \"Was I... supposed to prepare the meat...?\""
1015105-59 = "Ah."
1015105-60 = "Eh?"
1015105-61 = "A-Ahhh?! I forgot to ask you!!"
1015105-64 = "Waaahh..."
1015105-65 = "*Munch munch*"
1015105-66 = "Sensei... do you want some more dried meat?"
1015105-67 = "[s] \"Thank you! But I think I've had enough.\""
1015105-68 = "I even wrote down \"Ask Sensei for the ingredients\" on my list."
1015105-69 = "But I forgot to check the list that I wrote that list on..."
1015105-70 = "I'm so sorry you came all this way and all I have is dried meat..."
1015105-71 = "[s9] \"I'm satisfied just seeing you work so hard, Anna!\"\n[s10] \"Seeing you happy makes me happy too!\""
1015105-74 = "A-Ahhh..."
1015105-75 = "...If you praise me like this every time, I might develop a bad habit"
1015105-76 = "..."
1015105-81 = "Sensei, is it cold? I'll go turn on the heater in Class 183."
1015105-87 = "Thank you as always."
1015105-88 = "[s11] \"It's okay if you develop a bad habit.\"\n[s12] \"I'll be watching over you so you don't stray from the path.\""
1015105-91 = "Eh!"
1015105-95 = "..."
1015105-96 = "I was just talking to myself! But you heard me!!"
1015105-97 = "Uwaaahhh!!"
1015105-102 = "(Anna ran away at a speed that was hard to believe for someone running on a#nsnowfield.)"
1015105-103 = "(Fortunately, I was able to follow the footprints Anna left behind and return to#nClass 183.)"