[translation]
1015105-1 = "Going Out with a Genius"
1015105-2 = "Behind Class 183"
1015105-4 = "Sensei! Over here!"
1015105-5 = "Are you ready for our barbecue party in the snow?"
1015105-6 = "[s1] \"Whoa, you look like a barbecue master!\"\n[s2] \"Do you do this often?\""
1015105-9 = "An outdoor barbecue?#nWell, if you call doing it often, I suppose..."
1015105-10 = "Actually... a gas explosion blew off the wall of the Class 183 kitchen the other day, so#nI have been cooking and eating out in the blizzard ever since."
1015105-11 = "Since there is no roof or wall, it is basically like having a barbecue outside."
1015105-15 = "Well, let us put that aside!#nI invited you today because I wanted to have a barbecue party with you, Sensei!"
1015105-16 = "Leave it to me!"
1015105-17 = "[s] \"Where are the utensils?\""
1015105-18 = "Hehe. Red Winter...#nNo, with me, Kivotos greatest scientist, you have nothing to worry about!"
1015105-19 = "A single toolbox solves everything. Behold my ultimate technique!"
1015105-20 = "[s] \"Whoa!\""
1015105-21 = "Here we go!"
1015105-27 = "Actually, this used to be a live-fire training range a long time ago."
1015105-28 = "It fell out of use long before I joined the special class, but#nunder the snow, there are missile fragments and the wrecks of target tanks."
1015105-29 = "They are scrap metal, but high quality steel so...#nI can make everything we need for the barbecue out of this!"
1015105-30 = "[s] \"Amazing!? You can make all of it?\""
1015105-31 = "Of course! What matters is not brute force, but technique.#nBeing a scientist, I use my head to make things."
1015105-32 = "A frying pan can be finished in a flash while we are talking like this!"
1015105-33 = "[s3] \"Faster than origami!?\"\n[s4] \"I did not even notice you making it!\""
1015105-36 = "Ehehe. This is a piece of cake!"
1015105-37 = "Even without tools or strength, metalwork is easy once you get the hang of it!"
1015105-38 = "Next up is the grill!#nThat tank engine grille over there looks just right."
1015105-39 = "I will process it with hygiene in mind so we can safely cook food on it, so do not worry."
1015105-45 = "Ta-da! Barbecue set, complete!"
1015105-46 = "Not bad for something made in thirty minutes, right?"
1015105-47 = "[s5] \"Amazing!\"\n[s6] \"I would believe you if you said it was store-bought...\""
1015105-50 = "Hehe. Being praised by Sensei is always something special."
1015105-51 = "It is so sincere, it really hits home!#nSensei, you might just be a genius at praising people."
1015105-52 = "...A-And the firewood is okay! Utensils are okay! Table is okay!"
1015105-53 = "Now Sensei, bring out the meat!"
1015105-54 = "[s7] \"Huh...?\"\n[s8] \"Was I supposed to prepare the meat...-chan...?\""
1015105-59 = "Ah."
1015105-60 = "Eh?"
1015105-61 = "Ah, aaah!? I forgot to ask you!!"
1015105-64 = "Hiiin..."
1015105-65 = "Munch munch..."
1015105-66 = "Sensei... do you want some more jerky?"
1015105-67 = "[s] \"Thank you! I think I have had enough.\""
1015105-68 = "I even wrote down 'Ask Sensei for ingredients' on my checklist."
1015105-69 = "I just forgot to check the list where I wrote that list..."
1015105-70 = "I am sorry, even though you came all this way. All we have is jerky..."
1015105-71 = "[s9] \"Just seeing you work hard is enough to make me happy!\"\n[s10] \"Seeing Anna happy makes me happy too!\""
1015105-74 = "A, aaah..."
1015105-75 = "...If you praise me like that every time, I might pick up some bad habits."
1015105-76 = "..."
1015105-81 = "It is cold, Sensei. I will turn on the heater in Class 183."
1015105-87 = "Thank you, as always."
1015105-88 = "[s11] \"It is fine if you pick up bad habits.\"\n[s12] \"I will keep an eye on you so you do not stray from the path.\""
1015105-91 = "What!"
1015105-95 = "..."
1015105-96 = "I was just talking to myself! Sensei heard me!!"
1015105-97 = "Waaaaah!!"
1015105-102 = "(Anna dashed away with a speed that made it hard to believe she was running across a snowfield.)"
1015105-103 = "(Fortunately, I was able to return to Class 183 by following the footprints Anna left behind.)"
