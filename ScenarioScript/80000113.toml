[translation]
80000113-1 = "Жадность в обе руки"
80000113-2 = "За день до Дня святого Валентина мне позвонила Юкари."
80000113-3 = ""
80000113-7 = ""
80000113-8 = "Сенсей! Сенсей! Вы слышали?!"
80000113-9 = "Завтра наступает особенный день!"
80000113-10 = "Ох какой значимый день — 14 февраля! День, который называют «Ваалентановым днём»!"
80000113-11 = "[s1] «Конечно, я слышал.»\n[s2] «Хм-хм. Послушай, Юкари, меня можно назвать мастером Дня святого Валентина.»"
80000113-14 = "Ого! Вы сказали это без малейшего сомнения! Как и ожидалось от Сенсея!"
80000113-15 = "Но тогда— Понятно. Похоже, я отстаю от моды."
80000113-16 = "...Хм? У меня мало опыта с Ваалентановым днём?"
80000113-17 = "Ну... В это время года слуги дома приносят мне много сладостей..."
80000113-18 = "И я часто думала: «Ура! Сегодня можно есть сколько угодно сладостей! Вот повезло!»"
80000113-19 = "А на самом деле это значимый день, когда «выражают чувства и благодарность особому человеку»."
80000113-20 = "Благодарность через сладости... Не знаю, кто первым это придумал."
80000113-21 = "Но это чудесный и душевный способ праздновать!"
80000113-22 = "[s] «(Про то, что это корпоративная маркетинговая схема, пожалуй, промолчу...)»"
80000113-23 = "Пусть я немного опоздала... Узнав об этом дне, я не могу просто сидеть сложа руки!"
80000113-24 = "Простите, что так внезапно... Но, Сенсей, можем встретиться завтра?"
80000113-25 = "[s] «Конечно. Что ты задумала?»"
80000113-26 = "Как насчёт..."
80000113-27 = "А! Давайте встретимся после обеда, пожалуйста! Я пришлю место и детали, как только определюсь!"
80000113-29 = "На следующий день сразу после обеда я отправился в место, выбранное Юкари."
80000113-30 = ""
80000113-38 = "Куда именно?"
80000113-40 = "Особняк Кадэнокодзи"
80000113-41 = "Пожалуйста, подождите немного. Госпожа примет вас, как только закончит приготовления."
80000113-42 = "[s] «Ладно...»"
80000113-43 = ""
80000113-45 = ""
80000113-47 = "Пока я ждал, огромный особняк и его торжественная атмосфера лишили меня дара речи."
80000113-53 = ""
80000113-54 = "[ns] «А, Юкари. Я уже ждал—»"
80000113-55 = ""
80000113-57 = ""
80000113-58 = "Добро пожаловать, Сенсей! Простите, что заставила ждать!"
80000113-59 = "[s] «Н-Нет-нет, всё хорошо. Но что за наряд мико?»"
80000113-60 = ""
80000113-62 = "Как я и говорила, сегодня «Ваалентанов день»."
80000113-63 = "День, когда выражают искреннюю благодарность особому человеку."
80000113-64 = "Поэтому я подумала, как лучше всего выразить вам свою благодарность..."
80000113-65 = "Как передать Сенсею нескончаемый поток моей признательности, не потеряв ни единой капли."
80000113-66 = "И после того как всю ночь думала снова и снова..."
80000113-67 = "[s] «...Это я обязан услышать...»"
80000113-68 = "То, что вы видите сейчас, — результат одного из моих решений."
80000113-69 = "Перед вами я, Юкари, демонстрирующая «безграничную мощь» семьи Кадэнокодзи!"
80000113-70 = "Можете обращаться ко мне как к Мико Юкари Mk. 2!"
80000113-71 = "Только так я, Юкари, могла выразить величину своих чувств!"
80000113-72 = "Итак! Сенсей, примите это!"
80000113-73 = ""
80000113-75 = ""
80000113-76 = "[ns] «Амулет?»"
80000113-77 = "Да! Я встала на рассвете, набрала чистой воды и вложила в него самые искренние молитвы... Это особый талисман семьи Кадэнокодзи!"
80000113-78 = "Он дарует безопасность семье, долгую и здоровую жизнь, финансовое благополучие, успех на экзаменах и даже туго натянутую леску на рыбалке нахлыстом!"
80000113-79 = "Надеюсь, вам понравится, Сенсей... Это сделает меня очень счастливой!"
80000113-80 = "[s3] «П-потрясающе! Я тоже счастлив!»\n[s4] «Но разве это не слишком роскошно для подарка на День святого Валентина?!»"
80000113-83 = "Хи-хи... Сенсей, вы слишком скромны. Этого недостаточно! Совсем недостаточно!"
80000113-84 = "Талисман семьи Кадэнокодзи несёт лишь половину чувств, которыми я хотела поделиться."
80000113-85 = "Есть ещё кое-что, что необходимо добавить, чтобы передать мои эмоции на полную мощность!"
80000113-86 = ""
80000113-88 = ""
80000113-89 = ""
80000113-90 = "[ns] «Она преобразилась?!»"
80000113-91 = "Если этот талисман воплощает мои чувства как Кадэнокодзи..."
80000113-92 = ""
80000113-94 = ""
80000113-95 = "То этот подарок несёт мои чувства как Юкари из Хяккарёран — той, что так многому научилась, наблюдая за вами, Сенсей."
80000113-96 = "[s] «Это шоколадная палочка.»"
80000113-97 = "Да! Ограниченная серия Corn Stick Deluxe со вкусом шоколадного парфе!"
80000113-98 = "Сегодня утром мне пришлось обойти столько магазинов. Я уже думала, что не найду!"
80000113-99 = "[s] «Так вот почему ты хотела встретиться после обеда...»"
80000113-100 = ""
80000113-102 = ""
80000113-104 = "Именно благодаря вам, Сенсей, я могу сегодня стоять здесь одновременно как Юкари из Кадэнокодзи и как Юкари из Хяккарёран."
80000113-105 = "Я хотела подарок, отражающий обе эти стороны меня."
80000113-106 = "Вот такая я жадная."
80000113-107 = "Сенсей, примете эти подарки?"
80000113-108 = "[s] «Спасибо. Я смиренно принимаю всё, что ты мне подарила, Юкари.»"
80000113-109 = "Хи-хи-хи! Рада это слышать!"
80000113-110 = "[s] «Раз уж мы здесь... Хочешь вместе съесть эту шоколадную палочку?»"
80000113-111 = "Да! Конечно!"
