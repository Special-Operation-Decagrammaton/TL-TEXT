[translation]
1013403-1 = "Стартовая деревня"
1013403-2 = ""
1013403-3 = "Простите, Сенсей? Что... это?"
1013403-4 = "[ns] «Это специальная тренировка!»"
1013403-5 = "Эм... Но это же..."
1013403-6 = "Разве это не игры?"
1013403-7 = "[ns] «Это специальная тренировка!»"
1013403-8 = "Э-Это чрезвычайная ситуация!"
1013403-9 = "Сенсей окончательно сломался! У него сбой!"
1013403-10 = "[s1] «Нет-нет! Просто выслушай меня секунду.»\n[s2] «Ты ведь пока ещё привыкаешь к своим геройским доспехам.»"
1013403-11 = ""
1013403-12 = ""
1013403-15 = "[ns3] «Так что, по сути, тебе просто нужно их разносить!»\n[ns4] «Выработать привычку и освоиться с ними!»"
1013403-18 = "Разносить...?"
1013403-19 = "Как спортсмен разнашивает обувь...? Способ повысить навык владения?"
1013403-20 = ""
1013403-22 = ""
1013403-23 = "То есть мне всего лишь нужно играть, не снимая геройские доспехи?"
1013403-24 = "Хм... Я всё ещё не понимаю, каким образом это тренировка."
1013403-25 = ""
1013403-28 = "Сенсей? Зачем вы выключаете свет?"
1013403-29 = "...В темноте игры ощущаются более захватывающими?"
1013403-30 = "Я тоже так думаю, но..."
1013403-31 = "Вы же всегда говорите, что играть с выключенным светом вредно для глаз!"
1013403-32 = "[s5] «Да. Обычно так делать не стоит.»\n[s6] «Но ради специальной тренировки сделаем исключение!»"
1013403-35 = "...!"
1013403-36 = "Почему-то от этих слов я ужасно взволновалась!"
1013403-37 = "Как тогда, когда я играла допоздна и мне пришлось пробраться в магазин за снеками!"
1013403-38 = ""
1013403-40 = ""
1013403-41 = "Ах...! Это был секрет...!"
1013403-42 = "В-В общем, игра! Игра! Во что мне сыграть?"
1013403-43 = "Правда? Я могу выбрать любую игру?"
1013403-44 = "Мне нравится очень много игр!"
1013403-45 = ""
1013403-47 = ""
1013403-48 = ""
1013403-49 = ""
1013403-50 = "...Шедевров так много, что трудно выбрать один."
1013403-51 = ""
1013403-53 = ""
1013403-54 = "Например, вот эта!"
1013403-55 = "В этой игре нужно охотиться на драконов с огромным оружием!"
1013403-56 = "А из материалов, добытых на охоте, можно делать ещё более мощное оружие и охотиться на ещё более сильных драконов!"
1013403-57 = "Конечно, дело не только в снаряжении! Ты не сможешь использовать созданные вещи, пока персонаж не станет достаточно сильным!"
1013403-58 = ""
1013403-60 = ""
1013403-61 = "Теперь, когда я это сказала, кажется, эта игра идеально описывает мою нынешнюю ситуацию!"
1013403-62 = "[s] «Тогда хочешь сыграть в неё?»"
1013403-63 = "...Мне действительно нравится эта игра."
1013403-64 = "Но она очень длинная, поэтому сейчас это не лучший выбор."
1013403-65 = "Дайте мне ещё немного подумать."
1013403-66 = "...О, вот эта игра!"
1013403-67 = ""
1013403-69 = ""
1013403-70 = "Она печально известна своей высокой сложностью!"
1013403-71 = "По всей карте спрятано бесчисленное количество ловушек с мгновенной смертью!"
1013403-72 = "А если не выучить атаки босса, он тоже убьёт тебя моментально!"
1013403-73 = "Но тяжёлый путь, на котором с каждой попыткой продвигаешься всё дальше, делает прохождение по-настоящему приятным!"
1013403-74 = "Если подумать, это тоже очень похоже на мою нынешнюю ситуацию..."
1013403-75 = "[s] «Тогда, может, её?»"
1013403-76 = "...Нет. Хотя эта игра мне нравится..."
1013403-77 = "Я не хочу связывать с геройскими доспехами такие ужасные воспоминания."
1013403-78 = "Нужна игра не слишком длинная и при этом приятная..."
1013403-79 = ""
1013403-81 = ""
1013403-82 = ""
1013403-83 = "Ах."
1013403-84 = ""
1013403-86 = ""
1013403-87 = "Я выбрала. Думаю, это идеальный вариант."
1013403-88 = "[s7] «Эта игра...»\n[s8] «Tales Saga Chronicle?»"
1013403-91 = "Да! Tales Saga Chronicle, а точнее — Tales Saga Chronicle 1!"
1013403-92 = "Это первая игра, которую Отдел разработки игр создал вместе ещё до того, как я к ним присоединилась."
1013403-93 = "Хотя тогда меня с ними не было, играя, я очень ясно чувствую, каким был ход их мыслей."
1013403-94 = "А что ещё важнее, эта игра..."
1013403-95 = "...очень плохая!"
1013403-96 = "[s9] «А-Арис?!»\n[s10] «Я СЛЫШАЛ, что она весьма своеобразная...!»"
1013403-99 = "Это правда!"
1013403-100 = "Когда я играла впервые, я этого не понимала, но теперь, освоив множество игр, могу уверенно дать такую оценку!"
1013403-101 = "Tales Saga Chronicle 1 — полная катастрофа!"
1013403-102 = ""
1013403-104 = ""
1013403-105 = "...Но она всё равно мне нравится."
1013403-106 = "Это первая игра, в которую я когда-либо играла."
1013403-107 = "Первая игра, назвавшая меня «героем»."
1013403-108 = "...Я правда очень люблю эту игру."
1013403-109 = "И по длительности она идеальна!"
1013403-110 = "Если знать, что делать, до истинной концовки можно добраться за три часа!"
1013403-111 = "А теперь, Сенсей! Давайте сыграем вместе!"
1013403-113 = "Так меня... уговорили сыграть с ней в Tales Saga Chronicle 1."
1013403-115 = "[56cd7b]2354 год Космического календаря. Человечество охвачено пламенем возмездия.[-]"
1013403-116 = "Говорят, это традиционная фэнтезийная RPG, а начинается она вот так!"
1013403-117 = "К тому же выражение «Космический календарь» используется только здесь!"
1013403-118 = "[56cd7b]Начало обучения.[-]"
1013403-120 = "[56cd7b]Нажмите кнопку B, чтобы экипировать оружие перед вами.[-]"
1013403-121 = "О, это ловушка. Если нажать B, игра закончится."
1013403-122 = "Чтобы продолжить, нужно нажать A."
1013403-124 = "[ns11] «Она ещё страннее, чем я слышал...»\n[ns12] «Ты уверена, что мы пройдём её всего за три часа?»"
1013403-127 = "Хм... Новичку это, скорее всего, было бы невозможно."
1013403-128 = "Но я опытный игрок! Никаких проблем!"
1013403-129 = ""
1013403-130 = "Ах."
1013403-131 = "Мы добрались до первой деревни, не встретив ни одного врага."
1013403-132 = "В начале способы восстановить HP очень ограничены, так что нам повезло!"
1013403-133 = ""
1013403-136 = ""
1013403-137 = ""
1013403-138 = "...Это BGM стартовой деревни."
1013403-139 = "Мне очень нравится. Когда слышу её, вспоминаю, как впервые играла в эту игру."
1013403-140 = "...Хи-хи."
1013403-141 = "Очень интересно оглядываться назад. Тогда я была словно новорождённый ребёнок и совсем ничего не знала."
1013403-142 = "С тех пор мне вручили Меч Света, я завела друзей и пережила множество приключений."
1013403-143 = "А теперь я далеко от дома, аж в Ледниковом море."
1013403-144 = "И правда кажется, будто я прошла настоящий путь героя!"
1013403-145 = "Стартовая деревня в этой игре была началом и для меня."
1013403-146 = ""
1013403-148 = ""
1013403-149 = "...Ах! Мы встретили монстра!"
1013403-150 = "Это Слабенькое Желе с двустволкой! В ближнем бою с ним трудно справиться! Вот..."
1013403-152 = "Я играл вместе с Арис в Tales Saga Chronicle 1."
1013403-153 = "Некоторое время спустя..."
1013403-156 = "...Вот и всё, мы победили финального босса!"
1013403-157 = "Сенсей...? Что-то не так?"
1013403-158 = "Вы снова выглядите как грустный щенок!"
1013403-159 = "[s] «Эй, Арис... Можно кое-что спросить?»"
1013403-160 = ""
1013403-162 = ""
1013403-163 = "[ns13] «Почему мама, которая в прошлой жизни была моей женой, стала любовным интересом?»\n[ns14] «Почему моя жена — моя переместившаяся во времени „сводная подруга“, с которой нас разлучили в детстве?»"
1013403-166 = ""
1013403-167 = "Понятия не имею!"
1013403-168 = "Но..."
1013403-169 = "Разве вам не было весело?"
1013403-170 = "[s15] «...Ты права.»\n[s16] «Это было очень весело.»"
1013403-173 = "Вы согласны, Сенсей? Мне тоже было очень весело!"
1013403-174 = "Тогда следующая..."
1013403-176 = "Не успел я опомниться, как мы перебрали уже невесть сколько игр."
1013403-177 = "Мы провели за играми больше времени, чем следовало, но было очень весело."
