[translation]
2001502-1 = "Талисман Клуба внутренней дисциплины!"
2001502-2 = "Куда бы я ни пошла, только и слышу, что наш клуб считают сборищем чудаков."
2001502-3 = "Наверняка это огромное недоразумение! Мы совсем не странные. Как думаете, Сенсей?"
2001502-4 = "[s1] «Конечно нет!»\n[s2] «Э-Эм, наверное, нет?»"
2001502-5 = "Вот видите? Я так рада, что вы согласны!"
2001502-6 = "[s3] «Рад это слышать.»"
2001502-7 = "Но вот в чём дело..."
2001502-8 = "Ну же, Сенсей. Что это за ответ такой...?"
2001502-9 = "[s4] «То есть да! Я совсем не считаю ваш клуб странным!»"
2001502-10 = "Вот так-то лучше!"
2001502-11 = "Но вот в чём дело..."
2001502-12 = "Даже если Клуб внутренней дисциплины будет отрицать, что мы кучка чудаков, и говорить, что всё это недоразумение, люди ведь от этого не передумают. Верно?"
2001502-13 = "Люди верят только в то, во что хотят верить."
2001502-14 = "Чтобы убедить их в обратном... нужна жаркая битва, которая прожжёт их до самой глубины души!"
2001502-15 = "По крайней мере, так говорили в «Мушикуин» на прошлой неделе."
2001502-16 = "[s5] «Ты про аниме?!»\n[s6] «Не думаю, что оттуда стоит брать жизненные советы!»"
2001502-17 = "А что плохого в том, чтобы учиться у «Мушикуин»? Не вижу проблемы!"
2001502-18 = "А что плохого в том, чтобы учиться у «Мушикуин»? Не вижу проблемы!"
2001502-19 = "В общем, я думала, как можно исправить это недоразумение."
2001502-20 = "И вот, когда я ужинала с Цубаки и Мимори, мне внезапно пришла отличная идея!"
2001502-21 = "Угадаете, какая, Сенсей? Хм? Ну же, угадайте!"
2001502-22 = "[s] «Сдаюсь. Что за идея?»"
2001502-23 = "Правда сдаётесь? Тогда слушайте!"
2001502-24 = "Как вы знаете, я милая, умная, очаровательная... и практически талисман Клуба внутренней дисциплины."
2001502-25 = "Поэтому именно мне нужно заняться пиаром нашего клуба и показать всему миру, какие мы нормальные!"
2001502-26 = "Я назвала это... «Пиар-блиц талисмана Каэдэ»! Я выложусь на полную."
2001502-27 = "Ну как, Сенсей? План безупречен!"
2001502-28 = "[s7] «Не очень понимаю, что именно ты рекламируешь, но ладно.»\n[s8] «Твоя уверенность заразительна!»"
2001502-29 = "Отлично, значит, вы в деле. Теперь мы сообщники!"
2001502-30 = "Отлично, значит, вы в деле. Теперь мы сообщники!"
2001502-31 = "Вы ведь не станете мне отказывать, правда?"
2001502-32 = "[s] «Конечно нет.»"
2001502-33 = "Тогда вперёд!"
2001502-35 = "Вот так я и согласился вместе с Каэдэ провести пиар-кампанию Клуба внутренней дисциплины."
2001502-36 = "Для начала надо показать, чем занимается Клуб внутренней дисциплины и как мы помогаем людям. Пусть увидят, на что мы способны!"
2001502-37 = "Может... начнём с уборки мусора?"
2001502-38 = "[s] «Это точно будет добрым делом.»"
2001502-39 = "Ага! Ходим вот так с мусорным захватом..."
2001502-40 = "О! Мусор!"
2001502-41 = ""
2001502-43 = ""
2001502-44 = ""
2001502-45 = "И подбираем вот так. Просто, правда?"
2001502-46 = "Но не теряйте бдительность, Сенсей. Мы не знаем, какой мусор встретится нам в Кивотосе. Например, в углу вон того переулка..."
2001502-47 = "Ох?!"
2001502-48 = "[s] «Что такое, Каэдэ?!»"
2001502-49 = "Смотрите, Сенсей! Кто-то это выбросил!"
2001502-50 = "[s] «Коллекционные карты...?»"
2001502-51 = "Ага! Старые карты «Мушикуин»! Если присмотреться... кажется, сейчас их запрещено использовать в карточной игре."
2001502-52 = "Но просто выбросить их как ненужный хлам — это слишком жестоко!"
2001502-53 = "[s] «Да. Похоже, их просто свалили здесь...»"
2001502-54 = "Они что, никогда не слышали о сердце карт?! Духам внутри это точно не понравится!"
2001502-55 = "[s] «Опять слишком серьёзно воспринимаешь аниме, да?»"
2001502-56 = "О! Там ещё мусор!"
2001502-57 = ""
2001502-59 = "Мы с Каэдэ какое-то время усердно убирали улицы."
2001502-61 = ""
2001502-62 = ""
2001502-63 = ""
2001502-64 = "Фух. Мы собрали кучу мусора!"
2001502-65 = ""
2001502-67 = ""
2001502-68 = "Ну как, Сенсей? Теперь люди будут лучше думать о Клубе внутренней дисциплины?!"
2001502-69 = "[s9] «Уже? Пиар так просто не работает! На это нужно время!»\n[s10] «Главное — действовать постоянно и не ждать мгновенного результата.»"
2001502-70 = "О, вот оно как?"
2001502-71 = "О, вот оно как?"
2001502-72 = "Хм... Пиар намного сложнее, чем я думала."
2001502-73 = "Но я ещё не сдаюсь. Продолжаем операцию!"
2001502-74 = "Что делать дальше?"
2001502-75 = "Мы с Каэдэ глубоко задумались, что предпринять дальше, как вдруг..."
2001502-76 = "Теперь я хочу на качели!"
2001502-77 = "Что?! Ты меня толкала совсем мало! Я тебя намного дольше толкала!"
2001502-78 = "Но теперь моя очередь!"
2001502-79 = "Эй! Почему вы двое дерётесь?"
2001502-80 = "А? Ты ведь из Клуба внутренней дисциплины?"
2001502-81 = "Послушай! Мы собирались по очереди кататься на качелях, но потом моя младшая сестра—"
2001502-82 = "Но теперь моя очередь!"
2001502-83 = "Обе прекратите! Сёстрам нельзя так ссориться из-за качелей!"
2001502-84 = "А теперь извинитесь друг перед другом!"
2001502-85 = "Л-Ладно."
2001502-86 = "П-Прости..."
2001502-87 = "[s] «Молодец, Каэдэ!»"
2001502-88 = "Да это пустяки! Я всё время с ними играю."
2001502-89 = "[s] «А, значит, вы знакомы?»"
2001502-90 = "Хм. Но как помочь им снова помириться после ссоры?"
2001502-91 = "О! Придумала!"
2001502-92 = ""
2001502-94 = ""
2001502-95 = "Эй, вы двое! У меня кое-что для вас есть!"
2001502-96 = "Что это?"
2001502-97 = "Коллекционные карты?"
2001502-98 = "Ага! Я их нашла. На турнире ими уже не поиграешь, но это всё равно веселее, чем драться из-за качелей."
2001502-99 = "Вот. Я научу вас играть."
2001502-100 = "К-Кхм...! Уф... Горло пересохло сильнее, чем я думала."
2001502-101 = "[s] «Тогда я принесу вам что-нибудь попить.»"
2001502-102 = "Правда? Спасибо, Сенсей!"
2001502-104 = "Я направился к автомату с напитками прямо у парка."
2001502-105 = "Та девочка на площадке... Она из Клуба внутренней дисциплины."
2001502-106 = "А? Ты про тот клуб, где одни чудаки?"
2001502-107 = "[s] «(Похоже, люди и правда так говорят...)»"
2001502-108 = "Хех. Смотри, как она играет с детьми. Может, этот клуб и странноват,#nно они вроде неплохие, да?"
2001502-109 = "Ага. Я часто вижу, как они занимаются общественными работами по всему району."
2001502-110 = "[s] «(Может, они всё-таки начинают менять мнение...)»"
2001502-111 = ""
2001502-114 = "Погодите. Что там происходит?"
2001502-116 = "Смотрите! Когда играете в «Мушикуин», нужно вставать вот в такую позу!"
2001502-117 = "Если сделаете такую позу во время атаки, почувствуете невероятную силу!"
2001502-118 = "О-о-о!"
2001502-119 = "Давайте вместе! Мушикуин!"
2001502-120 = "Атака!"
2001502-121 = "Мушикуин!"
2001502-122 = "Атака!"
2001502-124 = "Нет, всё-таки она странная."
2001502-125 = "И не говори..."
2001502-128 = "А вот и вы, Сенсей. Смотрите! Видите, сколько детей пришло играть?#nОни все без ума от «Мушикуин»!"
2001502-129 = "Мисс Мушикуин!"
2001502-130 = "Это было потрясающе!"
2001502-131 = "Она мастер «Мушикуин»!"
2001502-132 = "Мастер «Мушикуин»!"
2001502-133 = "Наверняка это ещё один шаг вперёд для пиара Клуба внутренней дисциплины! Правда, Сенсей?!"
2001502-134 = "[s] «К-конечно...»"
2001502-135 = "Дети были так рады, что я не смог сказать Каэдэ, что у наблюдавших взрослых недоразумение только усилилось."
2001502-136 = "Ха-ха-ха!"
