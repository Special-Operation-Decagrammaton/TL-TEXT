[translation]
32160-1 = "Episódio 16;Batalha Feroz"
32160-2 = "Alojamento"
32160-4 = "Por aqui! Confirmamos que ela entrou neste prédio trazendo o alvo consigo!"
32160-5 = "Entendo... Então você montou sua posição defensiva aqui, maldita Shirasu Azusa."
32160-6 = "Há apenas duas entradas que dão para o interior! Uma delas está bloqueada por uma barricada!"
32160-7 = "Só uma entrada aberta... Não, esse lado é uma armadilha. Explodam a barricada que está bloqueando a outra e invadam por lá!"
32160-8 = "Isso vai chamar bastante atenção, tem certeza de que tudo bem?"
32160-9 = "Sim, não importa. Acabamos de receber contato do \"Esquadrão\"; as tropas de reforço entrarão no distrito autônomo da Trinity a qualquer momento."
32160-10 = "A essa altura, é melhor já estarmos prontas para um conflito total contra a Trinity. Mas, na medida do possível, vamos recuperar o alvo antes disso!"
32160-12 = "Vamos!"
32160-21 = "Invadir!"
32160-23 = "Como eu imaginava."
32160-25 = "O quê!?"
32160-29 = "Guaaah!?"
32160-30 = "Grr! Não recuem, não recuem! Uma vez lá dentro, a vantagem é nossa pela superioridade numérica!"
32160-33 = "Quê, aqui também!?"
32160-36 = "C-Claymores!? Uwaaah!?"
32160-39 = "O que é isso, uma sacola plástica...? N-Não, um IED!? Gyaaaah!!"
32160-47 = "...Você nos deu um belo trabalho, não é, Shirasu Azusa?"
32160-48 = "..."
32160-49 = "...Entendo, o número delas diminuiu bastante. Como esperado da Azusa-chan."
32160-50 = "Sim."
32160-51 = "Seguindo por aqui é um beco sem saída, hein... Onde está o alvo?"
32160-52 = "Eu a escondi."
32160-53 = "...É melhor desembuchar logo. Outras tropas estão vindo para cá e cercarão este prédio a qualquer instante. Fugir ou resistir, de um jeito ou de outro, é inútil."
32160-54 = "...Reforços?"
32160-55 = "Sim, e tropas inteiras, ainda por cima!"
32160-56 = "...E o \"Esquadrão\"?"
32160-57 = "Nem precisa o \"Esquadrão\" vir até aqui. Além do mais, ao que parece, elas têm outras coisas para fazer."
32160-58 = "Então não há problema."
32160-62 = "Grr, ainda tentando fugir a essa altura...! Já sabemos muito bem que só há o ginásio mais à frente!"
32160-63 = "E também que não há mais armadilhas daqui em diante! Não deixem que escapem, atrás delas!"
32160-68 = "...Entendo, então não estavam fugindo, era uma emboscada."
32160-69 = "Mas é só isso?"
32160-70 = "Quantos minutos acham que vão aguentar contra nós em apenas quatro? Ainda mais num lugar como este, sem nenhuma rota de fuga!"
32160-72 = "Auuu..."
32160-73 = "...!"
32160-74 = "Exatamente, já não há rota de fuga. Vocês não podem escapar."
32160-75 = "Pois é, que tal partirmos para o toque final por enquanto?♡"
32160-76 = "[s] \"Eu estava esperando por vocês.\""
32160-78 = "...!"
32160-80 = "Não sei se já o conhecem, mas... este é o responsável pelo Clube de Aulas de Reforço e conselheiro da \"Schale\", o nosso Sensei♡"
32160-81 = "Iniciando batalha de aniquilação. Sensei, suas ordens."
32160-85 = "[ns] \"Muito bem, Clube de Aulas de Reforço, vamos lá.\""
