[translation]
3303-1 = "Замах на хоум-ран 3"
3303-2 = "Стадион младшей лиги района Геенна"
3303-3 = ""
3303-4 = "Это..."
3303-5 = "...меньше зрителей, чем я ожидала."
3303-6 = "Ага. Это всего лишь матч новичков младшей лиги, да ещё и в понедельник."
3303-7 = "Не делай такое лицо. Ты сама потащила нас на первый попавшийся матч..."
3303-8 = "...Но всё равно приятно снова сидеть на трибунах."
3303-9 = "Особенно на матче младшей лиги. Народу мало. Можно сидеть совсем рядом с игроками."
3303-10 = "Довольно много фанатов бейсбола ходят только на матчи младшей лиги именно по этим причинам."
3303-11 = "...Понятно."
3303-12 = "Кстати, насчёт еды в твоей руке..."
3303-13 = "Хм? Это хот-дог."
3303-14 = "Рэй... Я не хочу сажать тебя на строгую диету. Но переработанная жирная еда может перегружать пищеварение и значительно снижать эффективность наших тренировок."
3303-15 = "Если проголодалась, протеиновый батончик — куда лучший выбор. В нём отличный баланс белков и углеводов—"
3303-16 = "Ни за что! Нельзя приехать в Геенна и не попробовать их фирменные адски-жгучие хот-доги!"
3303-17 = "Адски-жгучие хот-доги?"
3303-18 = "Да. Видишь ли, на каждом стадионе продают закуски и напитки, чтобы можно было поесть во время матча."
3303-19 = "Обычно всё довольно стандартное, но на некоторых стадионах продают вкусности, связанные с домашней командой!"
3303-20 = "Здесь, в Геенна, есть адски-жгучие хот-доги. Их делают из редкой сверхострой колбаски. Они такие вкусные!"
3303-21 = "У стадиона каждой академии свой деликатес. Так что можно не только посмотреть захватывающий матч, но ещё и вкусно поесть!"
3303-23 = "Ну... Ладно. Но постарайся съесть только один."
3303-24 = "О! Я забыла добавить соус чили."
3303-25 = ""
3303-27 = ""
3303-28 = "Хотя колбаска и так хорошо приправлена, так что с чили становится ещё острее."
3303-29 = "А после укуса я запиваю всё хорошим имбирным элем..."
3303-30 = ""
3303-32 = ""
3303-33 = ""
3303-34 = "Ммф бмф... Вот это бейсбол!"
3303-36 = "О, заказывай что хочешь, Сумирэ. Я угощаю!"
3303-37 = "...Один салат из несолёной куриной грудки, пожалуйста."
3303-38 = "На стадионах вообще продают такую здоровую еду?"
3303-39 = ""
3303-41 = ""
3303-42 = ""
3303-44 = "...Похоже, матч начался."
3303-45 = "Я впервые смотрю на поле игроков Геенна. Их клуб хороший?"
3303-46 = "Ну... С девизом «Свобода, хаос и неприятности!» — насколько вообще возможно."
3303-47 = "У них талантливые игроки, но не хватает хорошей командной работы."
3303-48 = "Хотя даже их младшая лига намного сильнее бейсбольного клуба Миллениум..."
3303-49 = "Но мы здесь не играть, а смотреть. Так что забудем, кто откуда, и просто будем болеть!"
3303-50 = ""
3303-52 = ""
3303-53 = "Вперёд, Геенна! Ни пуха ни пера!"
3303-57 = "Вторая отбивающая Геенна у биты. Похоже, будет фастбол... и есть удар!"
3303-58 = "Мяч улетел прямо в центр аутфилда! Отбивающая берёт первую базу. Она рвётся ко второй..."
3303-59 = "...О нет, слишком жадно! Аут!"
3303-60 = "Ух, была возможность на хороший дабл... Какая жалость."
3303-61 = "Если нужно наступить на базу раньше, чем защитник коснётся тебя рукой..."
3303-62 = "Разве нельзя просто ударить игрока второй базы вращающимся ударом ногой в подкате?"
3303-63 = "Конечно нельзя!"
3303-65 = "Бейсбольный клуб Геенна проиграл матч, несмотря на то, что Рэй болела за них..."
3303-67 = ""
3303-68 = "...Вот унылый матч. Они могли победить, если бы команда соперника не сделала тот суперсейв в конце."
3303-69 = "Согласна."
3303-70 = "Будь я бегущей, я бы протаранила защитника плечом и рванула к базе."
3303-71 = "И той отбивающей Геенна стоило бы лучше прокачать дельтовидные мышцы."
3303-72 = "Ты точно понимаешь, как работает бейсбол, Сумирэ?"
3303-73 = "Но всё равно давно я не наслаждалась матчем вместе с кем-то. Приятно."
3303-74 = "Тренировки важны для фитнес-клуба. Но смотреть спорт и видеть, как другие соревнуются благодаря плодам своих тренировок, тоже отлично повышает собственную мотивацию."
3303-75 = "У тебя в голове всегда день тренировок?"
3303-76 = "Я серьёзно, Рэй."
3303-77 = "Ты помнишь тот хоум-ран, который видела?"
3303-78 = ""
3303-80 = ""
3303-81 = ""
3303-82 = ""
3303-83 = "...Да."
3303-84 = "На стадионе тогда тоже было не слишком много людей... как сегодня."
3303-86 = "Кто-то пришёл ради еды. Другие хотели сфотографироваться с любимыми игроками. Некоторые искали новые таланты для своих команд. У каждого была своя причина прийти на стадион."
3303-87 = "Но в конце все смотрели на отбивающую, когда она сделала тот хоум-ран."
3303-88 = ""
3303-89 = "Дуга мяча в небе была прекрасной. Но тот момент, когда отбивающая неспешно обегала поле и ничто не стояло у неё на пути? Это было так круто."
3303-90 = "Забавно. Я забыла почти весь матч, хотя столько говорила о хоум-ране."
3303-92 = "Важно иметь конечную цель тренировок."
3303-93 = "Это может быть становая тяга в 100 кг или хоум-ран. Но без цели упражнения — просто боль, которую ты причиняешь себе сама."
3303-94 = "У каждого подъёма, каждого замаха должна быть причина. Что-то, что заставит тебя бороться за каждый шаг, когда здравый смысл просит выбрать лёгкий путь."
3303-95 = "Как человек, который хочет поднять в становой 100 кг, стремится не просто поднять цифру, так и твоя цель должна быть больше, чем просто далеко отбить мяч. Иначе ты не будешь за неё бороться."
3303-96 = "Как в бейсболе много вещей, которыми можно наслаждаться, так и в тренировках их тоже много."
3303-97 = "Одна из них — стремление к достойной цели. Благодаря ей вместо страха перед каждым новым испытанием появляется воля его преодолеть."
3303-98 = "Готова вернуться со мной к тренировкам, Рэй?"
3303-99 = ""
3303-101 = ""
3303-102 = ""
3303-103 = "...Ещё бы!"
3303-104 = ""
3303-106 = ""
3303-107 = "Фитнес-клуб Миллениум"
3303-109 = ""
3303-110 = "...Беру свои слова обратно!"
3303-111 = ""
3303-112 = "Что-то не так, Рэй?"
3303-113 = "Почему в эту машину встроены кандалы?"
3303-114 = "Вижу, ты решила опробовать новый тренажёр для приседаний, который я купила."
3303-115 = "Эта малышка — тестовый продукт, который я заказала у Инженерного отдела. В неё встроено специальное устройство, удерживающее ноги на месте, пока не закончишь подход."
3303-116 = "Это поможет нашим слабовольным участницам заканчивать повторения! Есть даже фиксатор, который удерживает тело в правильном положении, чтобы приседания выполнялись с верной техникой!"
3303-117 = "Если нельзя остановиться, когда хочешь, разве это не просто орудие пыток?!"
3303-118 = "И вы говорили, что это упражнение поможет моему показателю отбивания... Как пыточные приседания помогут мне махать битой?!"
3303-119 = "Мышцы ног играют жизненно важную роль и при подаче, и при замахе."
3303-120 = "Чтобы вложить силу в мяч, нужно зафиксировать суставы, а для этого необходим сильный корпус. Если неправильно развивать мышцы, можно травмироваться."
3303-121 = "Кстати, «день ног» тоже пропускать нельзя."
3303-122 = ""
3303-124 = ""
3303-125 = ""
3303-126 = ""
3303-127 = ""
3303-128 = ""
3303-129 = ""
3303-130 = ""
3303-131 = ""
3303-132 = ""
3303-133 = ""
3303-134 = "Хватит приседаний. Переходим к выпадам!"
3303-135 = ""
3303-137 = ""
3303-139 = "Серьёзно..."
3303-140 = "После начала сезона я больше никогда с вами тренироваться не буду."
3303-141 = "Замах на хоум-ран"
