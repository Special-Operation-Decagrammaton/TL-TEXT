[translation]
12020-1 = "Эпизод 2;Главный префект Геенны"
12020-2 = "Сорасаки Хина. Главный префект Геенны."
12020-3 = "Внешность совпадает с досье. Значит, это она."
12020-4 = "Но главный префект Геенны — высшее лицо их вооружённых сил. Что могло привести такую фигуру сюда?"
12020-6 = "..."
12020-7 = "П-Понимаешь, Президент, я-я мобилизовала наши силы, чтобы... задержать группу нарушителей, и..."
12020-8 = "Ты о Решалах 68? Насколько я вижу, сейчас вы противостоите только Шале."
12020-9 = "А? «Решатель проблем» должен быть..."
12020-10 = ""
12020-12 = "*вжух*"
12020-13 = "К-Когда они успели сбежать?! Только что ведь были здесь..."
12020-14 = "..."
12020-15 = "Т-Так что... я-я могу всё объяснить, Президент."
12020-16 = "..."
12020-17 = "Нет, всё нормально. Думаю, я поняла."
12020-18 = "Полагаю, это было сделано ради выявления и устранения факторов риска для Геенны."
12020-19 = "..."
12020-20 = "Но, Ако, мы Префектурная команда, а не Студсовет."
12020-21 = "Шале, Чаепитие... президент Генерального студсовета... Этим лучше заниматься енотам из Общества Пандемониума."
12020-22 = "Детали обсудим, когда я вернусь. Отключи связь и посиди подумай в клубной комнате Префектурной команды, Ако."
12020-23 = "...Да, мэм."
12020-24 = ""
12020-25 = ""
12020-26 = "..."
12020-27 = ""
12020-28 = "..."
12020-29 = "..."
12020-30 = "..."
12020-31 = "..."
12020-32 = "[s] «...»"
12020-33 = "Сейчас наш шанс попробовать снова."
12020-35 = "П-Погодите! Главный префект Геенны чрезвычайно сильна. Во всём Кивотосе нет никого сильнее!"
12020-36 = "Нельзя бросаться напролом. Нужно договариваться! Почему вы так любите драться?"
12020-37 = "...Э-Эм."
12020-38 = ""
12020-39 = "Мы — Целевая группа по взысканию долгов Абидоса, госпожа главный префект."
12020-40 = "Вы понимаете ситуацию?!"
12020-41 = "..."
12020-42 = "Конечно."
12020-43 = "Произошло несанкционированное развёртывание войск на чужой территории без предварительного уведомления, а также столкновения со студентами другой академии."
12020-44 = "...Но правда и то, что вы вмешались в дела Префектурной команды, Абидос."
12020-45 = "...?!"
12020-46 = "Хорошо."
12020-47 = "И?"
12020-48 = "Наша позиция не изменилась."
12020-49 = "Погодите... Решатели проблем 68 исчезли, а вражеских сил меньше не стало. У нас только Сенсей... а остальных я не могу остановить..."
12020-50 = "Вот бы Хошино сейчас была здесь..."
12020-51 = "...Хошино?"
12020-52 = "...?"
12020-53 = "Неужели Хошино из Абидоса — это... Таканаши Хошино?"
12020-54 = "А?"
12020-55 = "Хех. Что тут у вас? Ну и бардак."
12020-56 = ""
12020-57 = ""
12020-59 = ""
12020-60 = "!"
12020-61 = "Что?!"
12020-62 = "Х-Хошино?!"
12020-64 = "Прости-прости. Я просто немного вздремнула. Знаю, опоздала."
12020-65 = "..."
12020-67 = "Где тебя носило?! Тут был полный кошмар! Эти придурки из Геенны..."
12020-68 = "Но мы всех победили."
12020-69 = "Ну, не совсем всех..."
12020-70 = ""
12020-71 = "Префектурная команда Геенны... Вы преследовали Решатели проблем 68 до самого сюда?"
12020-72 = "..."
12020-73 = "Ладно, я не знаю, что произошло, но теперь вся Целевая группа в сборе. Ну что, попробуем ещё раз, Префектурная команда?"
12020-74 = "..."
12020-75 = "...Ты очень изменилась со своего первого года. Я почти тебя не узнала."
12020-76 = "А? Ты меня знаешь?"
12020-77 = "Когда я была в Разведывательном комитете, я отмечала всех интересных студентов в каждом районе."
12020-78 = "Я никогда тебя не забуду, Таканаши Хошино... Я думала, после того инцидента ты ушла из Абидоса."
12020-79 = "..."
12020-80 = "...Понятно. Вот что произошло. Поэтому Шале..."
12020-81 = "..."
12020-82 = "Ну, неважно. Я пришла не драться."
12020-83 = ""
12020-84 = "...Иори. Чинацу."
12020-86 = "Д-Да, Президент."
12020-87 = "...Да."
12020-88 = ""
12020-89 = ""
12020-91 = ""
12020-92 = "Соберите войска. Отходим."
12020-93 = "Что?!"
12020-94 = "Отходим?!"
12020-95 = ""
12020-96 = ""
12020-98 = ""
12020-99 = ""
12020-100 = "*кланяется*"
12020-101 = "А?"
12020-102 = "О-Она поклонилась?!"
12020-103 = "Я, Сорасаки Хина, главный префект Геенны, официально приношу извинения Целевой группе по взысканию долгов Абидоса..."
12020-104 = "...за несанкционированное развёртывание и применение сил на чужой территории."
12020-105 = "...!"
12020-106 = "...?!"
12020-107 = "...!"
12020-108 = "Префектурная команда Геенны больше не войдёт в этот район без разрешения. Прошу вашего прощения и понимания."
12020-109 = ""
12020-110 = ""
12020-111 = "Президент..."
12020-112 = "П-Погодите, Президент! А нарушители? Что насчёт Решатели проблем 68?"
12020-113 = "(сверлит взглядом)"
12020-114 = "О-Ой..."
12020-115 = "Идём домой."
12020-116 = ""
12020-117 = ""
12020-118 = "..."
12020-120 = "*ш-ш-ш*"
12020-121 = "Все силы Префектурной команды... исчезли из Абидоса в мгновение ока..."
12020-122 = "Так быстро перемещать настолько крупные силы... Главный префект действительно впечатляет."
12020-123 = "Жаль. Хороший был шанс сразиться с сильными противниками."
12020-124 = "В Широко течёт кровь воина... Хотя я и сама от боя не откажусь."
12020-125 = "Эта старушка никак не поймёт, что вообще происходит. Что случилось?"
12020-126 = "Не знаю... Зачем здесь была главный префект?"
12020-127 = "А мы откуда знаем?! Где ТЫ была?!"
12020-129 = "Прости-прости."
12020-130 = "*вздох* Такое чувство... всё выходит из-под контроля."
12020-131 = "Столько хаоса... и ничего не понятно."
12020-132 = "Аяне..."
12020-133 = "Верно. Сегодня произошло слишком много... Не стоит заставлять себя делать ещё что-то. Нужно отдохнуть."
12020-134 = "Да. На сегодня расходимся, а завтра в школе разберёмся с ситуацией."
12020-135 = "...Хм, ладно. Ты права, Аяне. На сегодня хватит. Завтра утром встретимся в клубной комнате."
12020-136 = "Хорошо."
12020-137 = "Поняла. Мне всё равно нужен душ..."
12020-138 = ""
12020-139 = ""
12020-141 = "...Сенсей."
12020-142 = "Кажется, перед уходом главный префект что-то сказала тебе..."
12020-143 = "Что именно?"
12020-146 = "*вздыхает*"
12020-147 = "Иори, ты в порядке?"
12020-148 = "Мне угрожали дробовиком, меня катали по земле, Ако меня отчитала, а Президент испепелила взглядом. День был... тяжёлый."
12020-149 = "...Понятно."
12020-150 = "Эм... Можно не смотреть на меня с таким сочувствием?"
12020-151 = "Это называется сочувствие, Иори."
12020-152 = "...Хорошо."
12020-153 = ""
12020-154 = ""
12020-156 = ""
12020-157 = "...Сенсей из Шале."
12020-158 = "[s] «Хотела со мной поговорить?»"
12020-159 = "Да. Есть кое-что, что я должна тебе сказать."
12020-160 = "Я решила, что лучше тебе узнать заранее."
12020-161 = "[s] «Что это?»"
12020-162 = "...Ты знаком с корпорацией Кайзер?"
12020-163 = "[s1] «Я хорошо его знаю.»\n[s2] «Я о нём слышал.»"
12020-164 = "...Понятно."
12020-165 = "...Понятно."
12020-166 = "..."
12020-167 = "Ни Пандемониум, ни Чаепитие пока не получили эту информацию."
12020-168 = "Но я решила, что тебе стоит знать."
12020-169 = "..."
12020-171 = "Похоже, корпорация Кайзер что-то затевает в заброшенной пустыне Абидоса."
12020-172 = "[s3] «В Пустыне Абидос...»\n[s4] «Корпорация Кайзер?»"
12020-173 = "Да. Сообщать Абидосу я не собиралась. Их академию всё равно скоро закроют."
12020-174 = "Да. Сообщать Абидосу я не собиралась. Их академию всё равно скоро закроют."
12020-175 = "...Ну ладно."
12020-176 = "До встречи, [USERNAME] Сенсей."
12020-177 = ""
12020-178 = ""
12020-179 = "..."
12020-180 = "[s] «Расскажу, когда все соберутся.»"
12020-181 = "...Хорошо, Сенсей."
12020-182 = "Тогда возвращаемся."
12020-184 = "Следующий эпизод; Прощайте, Решалы 68"
