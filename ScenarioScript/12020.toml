[translation]
12020-1 = "Episódio 2;A Chefe do Comitê Disciplinar de Gehenna"
12020-2 = "A Chefe do Comitê Disciplinar de Gehenna... Hina Sorasaki."
12020-3 = "As informações de aparência também batem. Sem dúvida é ela mesma."
12020-4 = "Mas se é a Chefe do Comitê Disciplinar de Gehenna... ela tem o maior poder de combate de toda Gehenna... Logo alguém assim nessa situação..."
12020-6 = "..."
12020-7 = "B-Bem... estávamos tentando capturar umas alunas delinquentes..."
12020-8 = "Está falando da Faz-Tudo 68? E onde elas estão? Porque agora parece que você está enfrentando Schale e Abydos."
12020-9 = "Hã? A Faz-Tudo estava bem ali..."
12020-12 = "(Sumiram sem deixar rastro)"
12020-13 = "Q-Quando foi que elas fugiram?! E-Elas estavam bem ali até agora há pouco...!"
12020-14 = "..."
12020-15 = "B-Bem... Chefe, eu posso explicar tudo."
12020-16 = "..."
12020-17 = "Não, deixa para lá. Já entendi mais ou menos."
12020-18 = "Pelo que vejo, isso foi para verificar e eliminar possíveis ameaças a Gehenna. Parte de alguma manobra política, certo?"
12020-19 = "..."
12020-20 = "Mas, Ako, nós somos o Comitê Disciplinar, não o conselho estudantil."
12020-21 = "Schale, Tea Party, e a Presidente do Conselho Estudantil Geral... Deixe esse tipo de coisa para as raposas da \"Sociedade Pandemônio\"."
12020-22 = "Conversamos melhor quando eu voltar. Encerre a comunicação e fique em detenção no prédio da escola, Ako."
12020-23 = "...Sim."
12020-26 = "..."
12020-28 = "..."
12020-29 = "..."
12020-30 = "..."
12020-31 = "..."
12020-32 = "[s] \"...\""
12020-33 = "Então, vamos recomeçar?"
12020-35 = "E-Espere! A Chefe do Comitê Disciplinar de Gehenna é uma das pessoas mais fortes de toda Kivotos, difícil até de encontrar alguém à altura!"
12020-36 = "É melhor não fazer nenhum movimento precipitado e tentar negociar primeiro! Por que vocês gostam tanto de brigar?!"
12020-37 = "...D-Desculpa."
12020-39 = "Aqui é o Comitê de Contramedidas de Abydos. Você é a Chefe do Comitê Disciplinar de Gehenna, certo? Prazer em conhecê-la."
12020-40 = "Você compreende a situação atual?"
12020-41 = "..."
12020-42 = "Claro."
12020-43 = "Mobilização não autorizada de tropas no distrito autônomo de outra escola sem aviso prévio, além de confronto com alunas de outra instituição."
12020-44 = "...Porém, também é fato que vocês interferiram no cumprimento do dever do Comitê Disciplinar. Estou errada?"
12020-45 = "...?!"
12020-46 = "É, pode ser."
12020-47 = "E daí?"
12020-48 = "A nossa posição não vai mudar, viu?"
12020-49 = "Esperem um pouco...! O pessoal da Faz-Tudo sumiu, o número de tropas deles continua o mesmo, só temos o Sensei do nosso lado... e, por algum motivo, está difícil até de segurar as minhas próprias aliadas...!"
12020-50 = "Auu, se a Hoshino-senpai estivesse aqui numa hora dessas...!"
12020-51 = "...Hoshino?"
12020-52 = "...?"
12020-53 = "Hoshino de Abydos... Por acaso seria... Hoshino Takanashi...?"
12020-54 = "Sim?"
12020-55 = "Uhe~, mas o que foi que aconteceu aqui? A coisa ficou bem feia, hein~."
12020-60 = "!!"
12020-61 = "Hã?!"
12020-62 = "H-Hoshino-senpai?!"
12020-64 = "Foi mal, foi mal. Acabei tirando um cochilo~, aí atrasei um pouquinho."
12020-65 = "..."
12020-67 = "Cochilo?! A gente passou pelo maior perrengue aqui! O pessoal de Gehenna...!"
12020-68 = "Mas já derrotamos todas elas."
12020-69 = "Ainda não foram todas... mas a maioria, sim."
12020-71 = "O Comitê Disciplinar de Gehenna, é... Vieram até aqui atrás da Faz-Tudo?"
12020-72 = "..."
12020-73 = "Hmm, não sei bem o que está rolando, mas agora o Comitê de Contramedidas está completo. Sendo assim, quer tentar a sorte de novo? Chefinha do Comitê Disciplinar?"
12020-74 = "..."
12020-75 = "...Você mudou bastante desde o primeiro ano. A ponto de eu quase achar que é outra pessoa."
12020-76 = "...Hm? Você me conhece?"
12020-77 = "Quando eu era do Departamento de Inteligência, eu mantinha registro das alunas perigosas de cada distrito autônomo."
12020-78 = "Especialmente Hoshino Takanashi... Jamais esqueceria de você. Depois daquele incidente, achei que tivesse deixado Abydos."
12020-79 = "..."
12020-80 = "...Entendo, então é isso... Por isso Schale..."
12020-81 = "..."
12020-82 = "Enfim, tudo bem. Eu também não vim aqui para lutar."
12020-84 = "...Iori, Chinatsu."
12020-86 = "...Chefe."
12020-87 = "...Sim."
12020-92 = "Preparem a retirada, vamos voltar."
12020-93 = "Hã?!"
12020-94 = "Vamos voltar?!"
12020-100 = "(...Curva-se)"
12020-101 = "Hã?"
12020-102 = "Ela abaixou a cabeça...?!"
12020-103 = "Pela mobilização não autorizada de tropas sem aviso prévio e por causar tumulto no distrito autônomo de outra escola..."
12020-104 = "Eu, Hina Sorasaki, na qualidade de Chefe do Comitê Disciplinar de Gehenna, peço desculpas formalmente ao Comitê de Contramedidas de Abydos."
12020-105 = "!"
12020-106 = "?!"
12020-107 = "!!"
12020-108 = "Prometo que o Comitê Disciplinar de Gehenna jamais voltará a invadir este território sem permissão. Peço que nos perdoem."
12020-111 = "Chefe..."
12020-112 = "E-Espere, Chefe! E aquelas infratoras... o que faremos com a Faz-Tudo?!"
12020-113 = "(Olhar fulminante)"
12020-114 = "A-Ah, ugh..."
12020-115 = "Vamos, estamos indo."
12020-118 = "..."
12020-120 = "(Vento soprando...)"
12020-121 = "Todas as tropas do Comitê Disciplinar... desapareceram pelos arredores de Abydos numa velocidade incrível..."
12020-122 = "Comandar uma força tão grande sem a menor desordem... A Chefe do Comitê Disciplinar é incrível mesmo."
12020-123 = "Que pena. Era uma chance de lutar contra alguém forte."
12020-124 = "Shiroko-senpai, você parece de alguma raça guerreira... Bem, eu também não sou de fugir quando compram briga comigo, claro."
12020-125 = "Uhe~, no fim das contas o velhote aqui não entendeu nada do que aconteceu. Afinal, o que houve?"
12020-126 = "Eu gostaria de explicar, mas ainda há muita coisa que nós mesmas não entendemos... Por que será que a Chefe do Comitê Disciplinar veio até aqui?"
12020-127 = "Isso mesmo, nós também não estamos entendendo nada! E para começo de conversa, onde você esteve até uma hora dessas, Hoshino-senpai...?!"
12020-129 = "Foi mal, foi mal."
12020-130 = "Ah... Tenho a impressão de que isso está virando um problema ainda maior."
12020-131 = "Só acontecem coisas agitadas... e ainda tem tanta coisa que não sabemos."
12020-132 = "Ayane-chan..."
12020-133 = "É verdade, aconteceu muita coisa hoje... Talvez seja melhor não exagerarmos e irmos descansar um pouco."
12020-134 = "Sim. Então vamos encerrar por hoje e amanhã nos reunimos na escola para organizar a situação."
12020-135 = "...É, isso aí~, a Ayane-chan tem razão. Por hoje já deu, amanhã a gente se vê na sala."
12020-136 = "Vamos fazer isso, então."
12020-137 = "Quero tomar um banho logo..."
12020-141 = "...Sensei."
12020-142 = "A Chefe do Comitê Disciplinar falou alguma coisa com você no final..."
12020-143 = "Sobre o que era?"
12020-146 = "Ah..."
12020-147 = "Iori, você está bem?"
12020-148 = "Levei rajada de escopeta à queima-roupa, tomei uma coronhada bem no estômago, fui jogada de um lado pro outro... levei bronca da Ako-chan e um olhar fulminante da Chefe... Hoje não é o meu dia."
12020-149 = "...É verdade."
12020-150 = "Ei... dá para parar de me olhar como se eu fosse um cachorrinho abandonado?"
12020-151 = "Estamos no mesmo barco, Iori."
12020-152 = "...É, né."
12020-157 = "...Sensei de Schale."
12020-158 = "[s] \"Hm, eu?\""
12020-159 = "Sim. Há algo que preciso lhe dizer."
12020-160 = "Achei melhor falar isso diretamente."
12020-161 = "[s] \"Sobre o quê?\""
12020-162 = "...Você conhece a Kaiser Corporation?"
12020-163 = "[s1] \"...Conheço bem.\"\n[s2] \"...Só por alto.\""
12020-164 = "...Entendo."
12020-165 = "...Entendo."
12020-166 = "..."
12020-167 = "Esta é uma informação que nem a \"Sociedade Pandemônio\" nem o Tea Party sabem ainda."
12020-168 = "...Talvez seja melhor eu avisar você."
12020-169 = "..."
12020-171 = "No deserto abandonado de Abydos... a Kaiser Corporation está tramando alguma coisa por lá."
12020-172 = "[s3] \"No Deserto de Abydos...\"\n[s4] \"A Kaiser Corporation...?\""
12020-173 = "Sim. Na verdade, eu não tenho obrigação nenhuma de contar isso para Abydos, que está prestes a fechar."
12020-174 = "Sim. Na verdade, eu não tenho obrigação nenhuma de contar isso para Abydos, que está prestes a fechar."
12020-175 = "...Só por precaução."
12020-176 = "Até mais, [USERNAME]-sensei."
12020-179 = "..."
12020-180 = "[s] \"Depois eu conto na frente de todas.\""
12020-181 = "...Nn, entendi."
12020-182 = "Então vamos voltar, Sensei."
12020-184 = "Próximo;Adeus, Faz-Tudo 68"
