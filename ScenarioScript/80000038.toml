[translation]
80000038-1 = "Обман рулетки!"
80000038-2 = "Я направился в офис Решатели проблем 68 встретиться с Муцуки."
80000038-3 = ""
80000038-5 = ""
80000038-6 = ""
80000038-7 = ""
80000038-8 = "БУ!"
80000038-9 = ""
80000038-11 = ""
80000038-14 = "[ns] «Ч-Что за...?! Муцуки?!»"
80000038-16 = "Ха-ха-ха! Попался, Сенсей!"
80000038-17 = "Тебе пора бы знать, что рядом со мной нельзя расслабляться."
80000038-18 = "Не успеешь и глазом моргнуть, как тебя сожрут живьём!"
80000038-19 = "Будь осторожнее, знаешь ли. Ха-ха-ха!"
80000038-20 = "[s1] «Я... постараюсь это запомнить.»\n[s2] «Так ради чего всё это?»"
80000038-21 = "Точно. Насчёт того, зачем я тебя позвала."
80000038-22 = "Точно. Насчёт того, зачем я тебя позвала."
80000038-23 = "Я хотела сыграть в игру! Вот в эту!"
80000038-24 = ""
80000038-26 = ""
80000038-29 = "[ns3] «Они должны быть в форме цилиндров?»\n[ns4] «Шоколадная... русская рулетка?»"
80000038-30 = "Ага! Недавно лазила по интернету, увидела это#nи подумала, что выглядит интересно!"
80000038-31 = "Ага! Недавно лазила по интернету, увидела это#nи подумала, что выглядит интересно!"
80000038-32 = "Всё ровно как на коробке: «Шоколадная русская рулетка»!"
80000038-33 = "А раз сегодня День святого Валентина, с кем ещё мне играть, как не с тобой, Сенсей?"
80000038-34 = "Я весь день УМИРАЛА как хотела с тобой сыграть!"
80000038-35 = "Ну как, Сенсей? Ты же сыграешь со мной, правда?#nПожалуйста? Ну пожа-а-алуйста?"
80000038-36 = "[s5] «Очень мило с твоей стороны предложить, но...»\n[s6] «Не знаю, что думать об этом названии...»"
80000038-37 = "Ха-ха! Какой же ты трусишка!"
80000038-38 = "Ха-ха! Какой же ты трусишка!"
80000038-39 = ""
80000038-41 = ""
80000038-42 = ""
80000038-43 = "Правила простые. В этой коробке есть острые шоколадки."
80000038-44 = "[s] «На упаковке написано: одна из трёх.»"
80000038-45 = "Сначала делим шоколад пополам, потом по очереди едим..."
80000038-46 = "...и кто первым съест острый, тот проиграл!"
80000038-47 = "Ну как? Русская рулетка на День святого Валентина. Весело звучит, правда?"
80000038-48 = "[s] «Больше похоже на первоапрельскую шутку не по сезону...»"
80000038-49 = "Ой, не будь таким. Мы ещё даже не начали, а ты уже боишься!#nТы вообще-то взрослый."
80000038-50 = "[s] «Просто...!»"
80000038-51 = "А, теперь поняла. Ты струсил, потому что в таких играх я всегда тебя побеждаю."
80000038-52 = "Хи-хи. Ну ладно. Наверное, ты имеешь право бояться."
80000038-53 = "Раз я ТАКАЯ добрая, в этот раз отпущу тебя.#nСегодня твой счастливый день, Сенсей-Трусишка."
80000038-54 = "[s] «Гр-р-р, ладно! Играю!»"
80000038-55 = "Ха-ха-ха! Вот это другое дело!"
80000038-56 = ""
80000038-58 = ""
80000038-59 = ""
80000038-60 = "Ладно, первым выбирай шоколад."
80000038-61 = "Будет нечестно, если я пойду первой — ты ещё решишь, что я всё подстроила."
80000038-62 = "[s] «Ну ладно. Была не была...!»"
80000038-64 = "Я выбрал свои кусочки шоколада."
80000038-66 = "Хорошо. Теперь едим!"
80000038-67 = "Посмотрим, кто победит! На счёт три."
80000038-68 = ""
80000038-69 = "Раз, два..."
80000038-70 = "...три!"
80000038-71 = ""
80000038-75 = "[ns] «...?!»"
80000038-79 = "[ns7] *кашель*\n[ns8] «ВСЕ мои острые! Как так?!»"
80000038-80 = "Хе-хе-хе..."
80000038-81 = "Хе-хе-хе..."
80000038-82 = "Снова попался, Сенсей! Аха-ха-ха!"
80000038-83 = "Хочешь узнать, почему тебе достались только острые? Всё просто..."
80000038-84 = "Я купила три коробки, проверила, какие кусочки острые, а потом сложила ВСЕ острые вот в ЭТУ коробку!"
80000038-85 = "Правило было: кто первым съест острый, проиграл. А ты ел первым, значит проиграл!"
80000038-86 = "[s] «Т-Ты меня обманула!»"
80000038-87 = "Обманула?! Я сказала только, что в коробке есть острый шоколад!#nЭто ты решил, будто там перемешаны обычные и острые,#nпотому что так написано на упаковке."
80000038-88 = "Я не говорила, что острый только один из трёх — это коробка сказала!"
80000038-89 = "Ты сам решил довериться коробке, а не мне."
80000038-90 = "[s] «Э-Это...! Ты...! Всё с самого начала было ловушкой!»"
80000038-91 = "Ха-ха-ха! Как же легко тебя побеждать."
80000038-92 = "Хм. Я настолько хороша в этом, что сама себя начинаю бояться.#nХа-ха!"
80000038-93 = "[s] «...»"
80000038-94 = "Что такое, Сенсей? Язык проглотил?"
80000038-95 = "Или шоколад оказался слишком горячим? Не думала, что он настолько острый..."
80000038-96 = "[s] «Игра ещё не закончена.»"
80000038-97 = "Не... закончена? Эм, этот взгляд у тебя пугающий, Сенсей."
80000038-98 = "[s9] «Теперь твоя очередь есть СВОЙ шоколад.»\n[s10] «Ешь. Таково правило.»"
80000038-99 = "Что?! Я знаю, что сказала есть по очереди, но ты уже проиграл!"
80000038-100 = "Что?! Я знаю, что сказала есть по очереди, но ты уже проиграл!"
80000038-101 = ""
80000038-104 = ""
80000038-105 = "А-а-а! Сенсей, какой ты напористый!"
80000038-106 = "Ты правда собираешься заставить меня положить это в рот?"
80000038-107 = "[s] «Х-Хватит создавать двусмысленность!»"
80000038-108 = "Ха-ха! Снова попался!"
80000038-109 = ""
80000038-111 = ""
80000038-112 = "Ты такой милый, когда смущаешься."
80000038-113 = "С тобой было весело, но мне пора."
80000038-114 = "Пока! Можешь оставить шоколад, который я тебе дала."
80000038-115 = "Как-нибудь сыграем ещё!"
80000038-116 = ""
80000038-118 = ""
80000038-119 = "[ns] «Угх. Она опять меня сделала...»"
80000038-121 = "Позже я попробовал ещё немного «Шоколадной русской рулетки», которую оставила Муцуки.#nМне неожиданно понравилось, и теперь я фанат."
