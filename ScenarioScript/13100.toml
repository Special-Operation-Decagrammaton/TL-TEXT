[translation]
13100-1 = "Episódio 10;Aquele Dia"
13100-3 = "Mesmo que você resolva os problemas lutando, isso só acende a faísca para o próximo conflito."
13100-4 = "Além disso, se você passar a resolver tudo na base da força,#nacho que um dia vai acabar se perdendo de si mesma."
13100-8 = "Eu aceitei porque eu quis."
13100-9 = "Não acho legal falar desse jeito.#nAfinal, a culpa é da desertificação, não é?"
13100-13 = "Não é um sonho, né...?"
13100-23 = "Naquela época, eu sentia raiva de tudo."
13100-25 = "Da situação de Abydos..."
13100-26 = "Das tempestades de areia que chegavam sem dar um segundo de trégua, e da desertificação que não parava."
13100-29 = "Dos cidadãos apáticos, das alunas irresponsáveis, do antigo conselho estudantil incompetente."
13100-30 = "Dos adultos que só pensavam no próprio lucro e faziam sujeira..."
13100-32 = "E também,"
13100-34 = "Da minha senpai, que só cometia erros dia após dia —"
13100-37 = "E de mim mesma, cheia de grandes ideais, mas impotente demais para resolver qualquer coisa."
13100-38 = "Eu só conseguia me deixar levar pela raiva."
13100-40 = "Acreditando que assim eu conseguiria resolver todos os problemas."
13100-44 = "Tcharam!"
13100-45 = "Hoshino-chan, olha, olha! Um pôster antigo do Festival da Areia de Abydos! Finalmente consegui!"
13100-46 = "Nessa época, o oásis ainda se estendia como um lago, né? Ah, vou te dar esse pôster de lembrança!"
13100-47 = "Ehehe, não é maravilhoso? Se acontecer algum milagre, um montão de gente vai voltar a se reunir aqui como naquela época —"
13100-48 = "Milagres não acontecem, senpai."
13100-49 = "Não existe nada disso. Em vez de sonhar, encare a realidade!"
13100-50 = "H-Hau..."
13100-51 = "Como é que um monte de gente voltaria a vir para o meio deste deserto?!#nJá chega de viver no mundo da lua!"
13100-52 = "Ueeh, mas Hoshino-chaaan... d-desculpa, tá?"
13100-53 = "...Ngh."
13100-54 = "Fica aí com a cabeça nas nuvens, falando de milagre, felicidade e sei lá mais o quê..."
13100-55 = "Crie juízo de uma vez! Você é a presidente do conselho estudantil de Abydos! Que tal começar a ter noção do peso da responsabilidade nos seus ombros?!"
13100-59 = "(Som de papel rasgando!)"
13100-67 = "Um dia, como sempre acontecia, a Yume-senpai se meteu em encrenca."
13100-68 = "..."
13100-69 = "E eu fui lá salvar ela."
13100-70 = "Que tipo de encrenca...?"
13100-74 = "...Bem, só a briga de sempre com uns marginais."
13100-75 = "E eles quase levaram a senpai embora."
13100-76 = "Que horror..."
13100-77 = "Provavelmente, eles sabiam que a Yume-senpai era a presidente do conselho estudantil e a miraram de propósito."
13100-78 = "Hoje em dia Abydos está atolada em dívidas,#nmas há muito tempo era a escola com mais dinheiro em toda Kivotos."
13100-79 = "Bom, no fim das contas eu expulsei os marginais."
13100-82 = "A Yume-senpai se meter em problemas era algo tão comum..."
13100-83 = "Mas naquele dia, eu estava meio irritada."
13100-84 = "Então, descontei toda a minha raiva na Yume-senpai e voltei para casa na frente."
13100-87 = "Eu pretendia pedir desculpas logo depois..."
13100-88 = "...Mas por mais que eu procurasse, não encontrei a Yume-senpai em lugar nenhum."
13100-91 = "Yume-senpai, eu voltei."
13100-92 = "É só tomar mais cuidado da próxima vez."
13100-93 = "Enfim..."
13100-100 = "Yume-senpai...?"
13100-102 = "A partir daquele dia, eu procurei por toda parte pela Yume-senpai desaparecida."
13100-117 = "Desculpa, Hoshino-chan#nO sinal não tá @#$%"
13100-118 = "Eu tava no deserto@#&%peguei uma tempestade de areia&#@"
13100-122 = "Hoshino-chan... desculpa"
13100-123 = "Esqueci a bússola de novo."
13100-124 = "Eu deixei um bilhete, mas vou mandar aqui também#nO meu caderno está lá naquele lugar"
13100-125 = "Um lugar que a Hoshino-chan conhece bem@$^$%@#$#nDeixei bem à vista, então acho que você vai achar logo"
13100-126 = "Hoshino-chan, eu"
13100-128 = "A Yume-senpai foi encontrada 33 dias depois, no Deserto de Abydos."
13100-130 = "..."
13100-131 = "..."
13100-132 = "..."
13100-138 = "Provavelmente, ela foi para o deserto atender ao pedido de alguém em apuros#ne acabou pega por uma tempestade de areia."
13100-139 = "Se você se perder no deserto sem bússola,#nnão tem como conseguir voltar."
13100-140 = "E assim, vagando pelo mar de areia..."
13100-141 = "A Yume-senpai morreu de exaustão e desidratação."
13100-147 = "Francamente... eu procurei tanto por você."
13100-148 = "...Yume-senpai."
13100-150 = "...Eu recuperei o corpo e os pertences da Yume-senpai,#nmas só o caderno da presidente do conselho estudantil não foi encontrado."
13100-151 = "Por que ela realmente foi para o deserto?#nEu procurei pistas por toda parte para saber o que aconteceu, mas..."
13100-152 = "No fim, não consegui encontrar nada."
13100-153 = "Onde será que a senpai deixou aquele caderno?"
13100-154 = "Eu fui a todos os lugares em que consegui pensar, mas não estava em nenhum deles."
13100-155 = "Com certeza, se eu só tivesse aquele caderno, saberia toda a verdade..."
13100-156 = "...Por que eu não consegui descobrir onde estava o caderno?"
13100-161 = "(E se a Nephthys estiver envolvida na morte da presidente do conselho estudantil...?)"
13100-162 = "(Eu...)"
13100-165 = "Yume-senpai, por quê...?"
13100-180 = "?!"
13100-181 = "A campainha de novo?!"
13100-187 = "Sou eu. Abram."
13100-189 = "...Supervisora Suou?"
13100-191 = "Desculpe se assustei vocês. Mas fiquem tranquilas, não sou eu quem tem assuntos a tratar.#nVocês têm um compromisso com um executivo da Nephthys, não têm?"
13100-195 = "Senhorita..."
13100-197 = "Mordomo..."
13100-200 = "...Vim conversar sobre a \"Ferrovia Transdesértica\"."
13100-202 = "...Sim, estávamos esperando."
13100-211 = "Vamos voltar para a sala de aula?"
13100-212 = "...Nn."
13100-215 = "Próximo;O Segredo Revelado"
