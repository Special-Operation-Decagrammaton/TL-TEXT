[translation]
13100-1 = "Эпизод 10;Тот день"
13100-3 = "Н-Наверное, но... если пытаться решать проблему насилием, это ведь не настоящее решение... Так круг просто продолжится..."
13100-4 = "А если постоянно прибегать к дракам, скоро это будет единственный способ решать конфликты, который ты знаешь..."
13100-5 = ""
13100-8 = "Я стала председателем не потому, что так было удобно. Я сама этого хотела. Хотела быть председателем."
13100-9 = "Нельзя винить людей, которые просто пытались облегчить свои страдания, Хошино. Виноваты стихийные бедствия!"
13100-10 = ""
13100-13 = "Это сон? Или, может, чудо…? Да! Точно! Это определённо чудо!"
13100-15 = ""
13100-16 = ""
13100-18 = ""
13100-19 = ""
13100-21 = ""
13100-22 = ""
13100-23 = "Тогда... я была полна ярости."
13100-25 = "Я злилась из-за состояния Абидоса..."
13100-26 = "Злилась, что каждый раз, когда казалось, будто можно расслабиться, новая песчаная буря снова всё уничтожала. На неумолимое опустынивание... бесконечные дни без дождя... жестокий ночной холод пустыни..."
13100-29 = "...на безответственных студентов, бросивших Абидос... равнодушных жителей и некомпетентный прежний студсовет..."
13100-30 = "...преступников, пользовавшихся тяжёлыми временами... жалких взрослых..."
13100-31 = ""
13100-32 = "...на председателя студсовета, у которой совсем не было чувства срочности... которая постоянно ошибалась..."
13100-33 = ""
13100-34 = "Но сильнее всего — на себя. На себя, которая ничего не могла решить..."
13100-37 = "Я злилась на всё."
13100-38 = "Хотя нет... Не совсем так. Я верила в свою ярость. Думала, что она — единственное решение."
13100-40 = "Будто одной силы моего гнева хватит, чтобы всё исправить."
13100-41 = ""
13100-44 = "Та-дам!"
13100-45 = "Смотри, Хошино! Я наконец нашла один из старых плакатов Фестиваля оазиса Абидоса!"
13100-46 = "Можешь поверить, раньше оазис был размером с озеро? Вот, держи! На память!"
13100-47 = "Разве не потрясающе? Если случится какое-нибудь чудо, сюда снова начнут приезжать люди! Только представь!"
13100-48 = "Чудес не бывает."
13100-49 = "Такого не случится!"
13100-50 = "Чт—"
13100-51 = "Кто вообще захочет ехать в какую-то точку посреди пустыни?! Хоть раз в жизни перестань витать в облаках!"
13100-52 = "П-Прости, Хошино... Я-я просто глупенькая..."
13100-53 = "...!!"
13100-54 = "Чудеса, удача, везение..."
13100-55 = "Ты председатель студсовета Абидоса! Научись серьёзнее относиться к ответственности!"
13100-56 = ""
13100-59 = "*рвёт* *р-р-рвёт* *р-р-рвёт*"
13100-60 = ""
13100-62 = ""
13100-63 = ""
13100-65 = ""
13100-67 = "И тогда... наступил тот день."
13100-68 = "..."
13100-69 = "В тот день Юмэ снова влезла в неприятности, а я, как обычно, разгребала последствия."
13100-70 = "Неприятности...?"
13100-71 = ""
13100-73 = ""
13100-74 = "...Ничего особенного."
13100-75 = "Какие-то бандиты, забредшие в район Абидоса, устроили драку, и Юмэ пошла её прекращать. Вместо этого её саму едва не похитили."
13100-76 = "С-Серьёзно...?"
13100-77 = "Думаю, с самого начала это была ловушка для председателя студсовета. Для Юмэ."
13100-78 = "В итоге мне пришлось вмешаться и полностью разнести эту банду."
13100-79 = "Если подумать, они точно были чужаками. Любой из Абидоса знал бы, что у нашего студсовета давно ни гроша. Мы уже давно не были финансовой державой Кивотоса."
13100-81 = ""
13100-82 = "В тот день я просто была злая. Злая на всё, вымотанная и доведённая до предела."
13100-83 = "Как я сказала, это была мелочь. Но я просто не выдержала."
13100-84 = "Такое происходило постоянно, но именно тогда я сорвалась. Оставила её и ушла домой одна."
13100-87 = "...Я просто сорвалась на ней. Я не имела в виду ничего из сказанного. Собиралась несколько дней её игнорировать, а потом вернуться."
13100-88 = "Поэтому выключила телефон, два дня бездельничала и вернулась в школу. Но к тому моменту Юмэ уже исчезла."
13100-91 = "Я вернулась, Юмэ."
13100-92 = "...Забудь, что было. Я уже совсем не злюсь."
13100-93 = "Важнее другое..."
13100-94 = ""
13100-96 = ""
13100-100 = "...Юмэ?"
13100-102 = "И с того дня поиски Юмэ поглотили меня целиком. Я обыскала весь Абидос."
13100-117 = "Прости... Хошино. Связь прерывается—"
13100-118 = "Возникло срочное дело, поэтому мне пришлось пересечь пустыню, и— *тршш* я... песчаная буря—"
13100-119 = ""
13100-122 = "Хошино... Прости."
13100-123 = "Я опять забыла компас."
13100-124 = "Я оставила тебе записку, но и здесь тоже оставлю сообщение. Обязательно забери мою тетрадь. Я оставила её для тебя."
13100-125 = "Она в *тршш*. Ты легко её найдёшь!"
13100-126 = "Хошино... Я..."
13100-127 = ""
13100-128 = "...А потом, спустя тридцать три дня, Юмэ нашли в Пустыне Абидос."
13100-130 = "..."
13100-131 = "..."
13100-132 = "..."
13100-133 = ""
13100-136 = ""
13100-138 = "Наверное, её застала песчаная буря, когда она пыталась пересечь пустыню по этому срочному делу."
13100-139 = "Когда началась буря, она, вероятно, сошла с маршрута, чтобы её обойти... но песчаные бури меняют сам ландшафт пустыни. И связи там не было. Я никак не могла с ней связаться."
13100-140 = "Она... не смогла найти дорогу назад."
13100-141 = "Причиной смерти стали обезвоживание и истощение."
13100-147 = "Серьёзно... Ха-ха-ха... Я так долго тебя искала..."
13100-148 = "...Юмэ."
13100-150 = "...Я забрала останки Юмэ, а также её оружие, щит и остальные вещи, но... её тетрадь так и не нашла."
13100-151 = "Я искала и искала хоть малейшую зацепку о том срочном деле и о том, что на самом деле произошло."
13100-152 = "Но ничего не нашла."
13100-153 = "Где вообще было то место, где она оставила тетрадь?"
13100-154 = "Я проверила всё, что могла придумать, но... её нигде не было."
13100-155 = "В этой тетради должны быть ответы о том, что с ней случилось..."
13100-156 = "Так почему же... почему я не смогла найти эту проклятую тетрадь...?"
13100-157 = ""
13100-159 = ""
13100-160 = ""
13100-161 = "(Если... Нефтис каким-то образом была связана со смертью председателя Юмэ...)"
13100-162 = "(Тогда я...)"
13100-165 = "Почему...? Юмэ, почему?"
13100-166 = ""
13100-168 = ""
13100-172 = ""
13100-177 = ""
13100-179 = ""
13100-180 = "Ай?!"
13100-181 = "А? Опять дверной звонок?!"
13100-182 = ""
13100-184 = ""
13100-186 = ""
13100-187 = "...Это я."
13100-189 = "Это разве не... надзиратель Суо?"
13100-191 = "Прошу прощения, если напугала. Я пришла вместе с сотрудником Нефтис на нашу встречу. Вы забыли?"
13100-192 = ""
13100-194 = ""
13100-195 = "Можно войти, госпожа?"
13100-197 = "Дворецкий..."
13100-199 = ""
13100-200 = "Я пришёл обсудить тайну Транс-пустынной железной дороги."
13100-202 = "...Да. Я ждала."
13100-203 = ""
13100-206 = ""
13100-207 = ""
13100-208 = ""
13100-210 = ""
13100-211 = "Может, уйдём отсюда?"
13100-212 = "Да. Пойдём в комнату Комитета по выплате долга."
13100-213 = ""
13100-215 = "Следующий эпизод;Тайна раскрыта"
