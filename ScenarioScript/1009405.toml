[translation]
1009405-1 = "Отдых горничной!"
1009405-2 = "[ns] «А? Это не клубная комната Отдела разработки игр.»"
1009405-3 = "Ну, ИЗНАЧАЛЬНО я хотела, чтобы мы отдыхали в клубной комнате..."
1009405-4 = "...но когда все узнали, что вы придёте, разные клубы решили помочь."
1009405-5 = "Клуб диеты, Клуб образа жизни и здоровья, Клуб спортивных тренировок... даже Инженерный отдел."
1009405-6 = "Эти названия вас нервируют? Расслабьтесь. Не все хотят на вас ставить опыты."
1009405-7 = "То есть с Клубом спортивных тренировок и Инженерным отделом вы уже... знакомы. Но чего вы ждёте от остальных?"
1009405-8 = "Клуб диеты вполне уважаемый. Они продвигают коррекцию фигуры научными методами, без диет и упражнений."
1009405-9 = "Клуб образа жизни и здоровья улучшает здоровье через эксперименты на людях! Законные, я имею в виду."
1009405-10 = "[s] «От этого мне не стало спокойнее ни насчёт одного из них.»"
1009405-11 = "Не волнуйтесь! Всё будет хорошо! Никто в Миллениуме не хочет сделать вам ничего плохого."
1009405-12 = "...Ну, если вы это ЗНАЕТЕ, почему всё равно нервничаете?"
1009405-13 = "Просто доверьтесь им. Отдохните телом и душой и подготовьтесь к завтрашнему дню!"
1009405-14 = "Мы уже согласились протестировать их разработки и дать отзыв, так что отступать поздно!"
1009405-15 = "Итак... первое, что мы будем тестировать..."
1009405-16 = "...этот ультравысокочастотный массажёр!"
1009405-17 = "Позвольте объяснить! Он создан для значительно более сильного расслабления мышц."
1009405-18 = "Его улучшили и модифицировали так, чтобы частоты намного превосходили стандартный диапазон!"
1009405-19 = "...По крайней мере, так написано в инструкции."
1009405-20 = "Инструкция простая: прикрепите устройство туда, где хотите массаж."
1009405-21 = "А затем включите переключатель."
1009405-23 = "Отбросив тревогу, я включил массажёр."
1009405-24 = ""
1009405-29 = "[ns] «У-о-о-о-о!»"
1009405-30 = "В-Вибрации такие сильные! Я чувствую их аж в голове!"
1009405-31 = "А-а-а... У меня кружится голова... Так кружится...!"
1009405-32 = "Но вибрации настолько невероятно сильные, что я даже пальцем пошевелить не могу...!"
1009405-33 = "А-а-а! Помогите, Сенсей! Мне нужно его выключить, но я не могу двигаться!"
1009405-35 = "Каким-то чудом мне всё же удалось его выключить."
1009405-36 = ""
1009405-39 = ""
1009405-40 = "*тяжело дышит* *тяжело дышит* Чуть не померла..."
1009405-41 = "Н-Но это была просто случайность. Дальше — специальный EMS-костюм!"
1009405-42 = "[s] «И о какой?»"
1009405-43 = "Костюм для тех, кто хочет получить эффект от тренировок, не занимаясь упражнениями!"
1009405-44 = "[s1] «Погоди, можно тренироваться, вообще не тренируясь?!»\n[s2] «Это же революция. Давай скорее попробуем!»"
1009405-47 = "Хе-хе-хе... Я знала, что вы согласитесь."
1009405-48 = "Если честно, я и сама не особо хочу заниматься спортом..."
1009405-49 = "Костюм использует электрические импульсы нужной частоты и силы, чтобы стимулировать мышцы."
1009405-50 = "Это укрепляет мышечные волокна и повышает выносливость!"
1009405-52 = "Мы с Момои прочитали инструкцию, после чего я помог ей надеть EMS-костюм."
1009405-53 = ""
1009405-58 = ""
1009405-59 = "У-о-о-о-о!"
1009405-60 = "С-Стимуляция слишком сильная! Разряды идут один за другим слишком быстро!"
1009405-61 = "У меня мышцы болят! Как будто меня током бьёт!"
1009405-62 = "Сенсей! Помогите! Сенсей!"
1009405-65 = "Мне едва удалось отключить питание костюма."
1009405-68 = "[ns] «Ты точно хочешь продолжать?»"
1009405-69 = "На этот раз всё точно будет иначе! За этой штукой стоят и Клуб спортивной подготовки, И Инженерный отдел!"
1009405-70 = "А? От этого вам ВДВОЕ тревожнее? Ну серьёзно, иногда людям всё-таки нужно доверять!"
1009405-71 = "К тому же это всего лишь обычный массажный ролик."
1009405-72 = "Недавние исследования показывают, что неестественные позы, которые мы часто принимаем, могут быть одной из причин хронической усталости."
1009405-73 = "Поэтому они разработали массажный ролик с ИИ для укрепления мышц, выпрямляющих позвоночник."
1009405-74 = "Он автоматически оценивает состояние пользователя и подбирает оптимальный режим массажа."
1009405-75 = "Попробуем? Тут написано положить его под бёдра и перекатываться вперёд-назад."
1009405-76 = ""
1009405-78 = ""
1009405-79 = ""
1009405-80 = "А-а-а!"
1009405-81 = "Он крутится слишком быстро! И сам по себе двигается! Сенсей—!"
1009405-82 = "[s3] «Я правда хочу тебе помочь, но...»\n[s4] «А-а-а! Меня затягивает!»"
1009405-86 = "Перепробовав самые разные устройства для расслабления..."
1009405-87 = "...мы в итоге вместе рухнули, измученные болью."
