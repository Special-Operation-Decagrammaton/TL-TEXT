[translation]
10032075-7 = "М-мы правда выбрались?"
10032075-8 = "Пока что. Но они не станут просто разводить руками только потому, что мы ушли."
10032075-9 = "Ах. Это..."
10032075-10 = "Что такое, Харука?"
10032075-11 = "Гах! Н-ничего! Совсем ничего! П-прямо как я — крошечная, бесполезная проблемка...!"
10032075-13 = "Мы выполнили цель нашего союза. Давайте разойдёмся, пока они нас не догнали."
10032075-14 = "...Я не знаю, как вас благодарить, Сенсей."
10032075-15 = "И ещё..."
10032075-16 = "...Решалы 68."
10032075-18 = "Ха. Поблагодарить нас означало бы признать, что мы действовали не в собственных интересах. А мы действовали именно так."
10032075-19 = "Ничего из сделанного нами не было специально направлено на помощь."
10032075-21 = "...Понятно."
10032075-22 = "Возможно, вы так это воспринимаете, но я не могу притвориться, будто не получила помощь от вашей компании."
10032075-23 = "Если бы не вы, я снова осталась бы одна, использованная работодателем."
10032075-24 = "Самое малое, что я могу сделать в ответ..."
10032075-25 = ""
10032075-27 = ""
10032075-28 = ""
10032075-30 = "...Что ты делаешь?!"
10032075-32 = "Я дарю вам подарок. Судя по всему, контракт всё равно больше не действует."
10032075-33 = "Я должна возвращать долги. Говорят, в этой сфере так принято."
10032075-34 = "Это просчитанное решение..."
10032075-35 = "...ради долгосрочных отношений."
10032075-36 = "...Вау. Просто вау."
10032075-37 = "У неё это прозвучало куда круче, чем когда мы так говорили! Хаха!"
10032075-38 = "Долги долгами, но ты просто отдаёшь нам цель, словно мешок подарков?!"
10032075-39 = "Погоди-ка. Если ты отдаёшь этот мешок нам, то... Тогда..."
10032075-40 = "Он наш?!"
10032075-41 = "Мы правда...?"
10032075-42 = "Мы правда, по-настоящему выполнили работу? Мы?!"
10032075-44 = "Что значит «правда, по-настоящему»...?"
10032075-46 = "Я-я и не думала, что мы сможем выполнить такую с-сложную работу!"
10032075-47 = "П-потрясающе, Ару! Ты всё идеально спланировала!"
10032075-48 = ""
10032075-50 = ""
10032075-51 = "...А?"
10032075-52 = "Ч-что...? А? Что происходит?"
10032075-54 = "...!"
10032075-55 = "Я... Я поняла!"
10032075-56 = "Ты предвидела это ещё тогда, когда впервые предложила помощь."
10032075-57 = "Ты и правда провидица в этой сфере. Я обязательно воспользуюсь уроками, которые сегодня получила, продолжая свою карьеру."
10032075-58 = "[s1] «Это... и правда так всё произошло?»\n[s2] «Наверное, всё хорошо, что хорошо кончается.»"
10032075-61 = "Х-ха! Именно! Для меня это было детской забавой!"
10032075-62 = "Но это знаменует конец нашего сотрудничества, каким бы коротким оно ни было."
10032075-63 = "Мы разойдёмся с—"
10032075-64 = "Я их нашёл! Сюда!"
10032075-65 = ""
10032075-69 = "Мелкие засранцы, думали, сможете здесь спрятаться?! Мы так просто не проиграем!"
10032075-70 = "А ну сюда! Мы вернём босса так или иначе!"
10032075-72 = "Цк. Быстрее, чем я думала."
10032075-73 = "Мы можем уйти, но они не отстанут, пока мы что-нибудь не сделаем."
10032075-75 = "Позвольте мне. Я создам заграждение и выиграю вам немного времени."
10032075-76 = ""
10032075-78 = ""
10032075-79 = ""
10032075-80 = "...А. А как насчёт этого?"
10032075-81 = ""
10032075-83 = ""
10032075-84 = ""
10032075-85 = ""
10032075-86 = "Этот мусорный контейнер отлично подойдёт."
10032075-87 = "Похоже, он забит доверху, так что послужит и прекрасным укрытием, и отличным препятствием."
10032075-89 = "...?"
10032075-90 = "Хм..."
10032075-91 = "...Ах."
10032075-92 = "А?!?!!"
10032075-93 = "[s3] «Харука? Что такое?»\n[s4] «Почему ты так побледнела?!»"
10032075-96 = "Н-ничего! Совсем ничего...! Почти! То есть, просто..."
10032075-97 = "[s5] «Просто...?»\n[s6] «Да...?»"
10032075-100 = "П-просто..."
10032075-101 = "Этот мусорный контейнер...!!"
10032075-102 = ""
10032075-107 = "Чёрт! Они не отстают."
10032075-108 = ""
10032075-110 = ""
10032075-112 = ""
10032075-113 = "Они просто прут напролом... Наверное, отчаянно хотят вернуть босса."
10032075-114 = "Тогда валим отсюда! Сейчас же!"
10032075-115 = "М-мусорный контейнер...! К-к-контейнер!"
10032075-116 = "У нас нет времени, Харука."
10032075-117 = "Что не так с контейнером?"
10032075-118 = "Там...! Я-я..."
10032075-119 = "Бомбы! Все они...! Внутри..."
10032075-120 = "Я сложила все найденные нами бомбы в этот мусорный контейнер!!!"
10032075-121 = "Там не мусор! Там взрывчатка!"
10032075-122 = "...В контейнере?"
10032075-123 = "...Взрывчатка?"
10032075-124 = ""
10032075-126 = ""
10032075-128 = ""
10032075-129 = "Все бомбы, которые мы конфисковали при зачистке Оперного театра? Ты об этом, Харука?"
10032075-130 = ""
10032075-132 = ""
10032075-133 = "...Ага!"
10032075-134 = "Точно! Теперь я вспомнила! Хорошо, что мы забрали их все."
10032075-135 = "...Ару."
10032075-136 = "Мы используем мусорный контейнер, набитый взрывчаткой, как укрытие?"
10032075-138 = "Что вы сейчас обсуждаете? Времени нет."
10032075-139 = ""
10032075-145 = "Ах. Г-граната..."
10032075-147 = "Летит!"
10032075-148 = ""
10032075-151 = "[ns] «...О.»"
10032075-152 = ""
10032075-156 = "[ns] «Значит, вот так всё и закончится.»"
