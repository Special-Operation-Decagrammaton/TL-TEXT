[translation]
10056005-1 = "Prologue;The Girl's Isobue"
10056005-4 = "(Around the time the Odyssey Marine High School fleet returned to D.U.--)"
10056005-5 = "(It happened when I was visiting for work.)"
10056005-10 = "[ns] \"What is that sound...?\""
10056005-11 = "(From the direction of the ocean, a sound like birds chirping could be heard.)"
10056005-12 = "(It sounded similar to the dolphin calls I heard on TV once, and--)」"
10056005-14 = "(I leaned over the railing and looked around,)"
10056005-20 = "..."
10056005-22 = "(What was there was neither a seabird nor a dolphin, but--a single girl.)"
10056005-28 = "(She would dive, then surface again to catch her breath.)"
10056005-29 = "(Each time, her clear whistle carried all the way up to the deck.)"
10056005-33 = "[ns] \"Excuse me!\""
10056005-35 = "Hmm...?"
10056005-39 = "...Eep!"
10056005-45 = "(Realizing my presence, the girl dived back into the water in an instant.)"
10056005-46 = "(Only the ripples left on the surface of the sea proved that she had been there.)"
10056005-50 = "[ns] \"What was that...?\""
10056005-53 = "Odyssey Marine High School \"Island\" - Captain's Office"
10056005-56 = "Now then... It has been a while since you came to stay at Odyssey, but--"
10056005-57 = "Are you having any trouble?"
10056005-58 = "[s1] \"Thanks to everyone, I am having a great time.\"\n[s2] \"There is still a lot I do not understand, though...\""
10056005-61 = "I suppose so. Odyssey is one of the largest scales in Kivotos, after all."
10056005-62 = "There are a few academies larger than this one, so I will not call it number one, though."
10056005-63 = "Even so, the difficulty of touring the entire place is peerless.#nMost clubs use their respective ships as club rooms, and#nif their voyage schedules do not match up, you often cannot even see each other."
10056005-64 = "If you truly want to understand Odyssey, you have no choice but to join us on an ocean voyage."
10056005-65 = "...No, perhaps you might not reach an understanding#nunless you tour every nook and cranny of this vast sea. Fufu."
10056005-70 = "Um, Captain."
10056005-71 = "By the way, Teacher, have you had lunch?#nIf you do not mind, I will treat you to this ship's proud cuisine.#nAfter all, today is Friday! It is curry day!"
10056005-72 = "I have been looking forward to it since yesterday..."
10056005-73 = "I am not exaggerating. You cannot get fresh ingredients during a voyage.#nSo, frozen vegetables inevitably become the main ingredient. Ho, we, ver--"
10056005-74 = "According to the chef, today it is packed with fresh tomatoes."
10056005-78 = "Captain..."
10056005-79 = "There are many restrictions on cooking during a voyage."
10056005-80 = "When the waves are rough, it is even difficult to use fire, so we sometimes just make do with retort pouches."
10056005-81 = "Well, I think those are pretty decent in their own way.#nVegetable powder, simmered thoroughly to a thick consistency, has a unique flavor."
10056005-82 = "Though it is not very popular with many of the students."
10056005-83 = "--Minato-senpai!"
10056005-87 = "Whoa...?! You startled me..."
10056005-88 = "Why are you shouting like that?"
10056005-89 = "You know we are in the middle of a meeting, right? Such unbecoming behavior for an executive of Island, who is supposed to be a role model for others."
10056005-90 = "I return those exact words to you."
10056005-91 = "I told you that you do not have a single moment to spare for idle chatter.#nHave you forgotten that there is a mountain of work related to Kanegasaki Port?"
10056005-92 = "Just because [USERNAME]-sensei is here, to suddenly schedule a meeting..."
10056005-93 = "If you just chat like this, you will not finish even if you pull an all-nighter, you know?"
10056005-99 = "Pry-een."
10056005-100 = "It is not \"pry-een.\""
10056005-101 = "You are the student council president of Odyssey--of Island, so please refrain from using childish language."
10056005-102 = "Pry-een, though."
10056005-103 = "Adding \"though\" does not change anything."
10056005-107 = "Pardon me for showing you such an unsightly scene."
10056005-108 = "Even though you must be busy, Teacher,#n-thank you for humoring the captain's idle chatter."
10056005-109 = "[s3] \"Not at all.\"\n[s4] \"It was a good excuse to slack off, anyway...\""
10056005-111 = "Is this... an adult?"
10056005-112 = "...Ahem."
10056005-113 = "In any case, I am glad to hear you are having no trouble."
10056005-114 = "If anything happens at Odyssey, please contact us at Island or Trident.#nThey are in charge of public morals, after all."
10056005-115 = "[s] \"Thanks for caring about me.\""
10056005-119 = "[ns] \"...Since we are on the subject, there is a student I am curious about.\""
10056005-120 = "Curious, you say?"
10056005-122 = "(I told Minato and Ami about what happened yesterday.)"
10056005-124 = "Ah, that whistle..."
10056005-125 = "That is probably a student from the diving club."
10056005-126 = "[s] \"The diving club?\""
10056005-127 = "It is a club responsible for underwater activities."
10056005-128 = "What you heard was likely the \"Isobue\" (ocean whistle).#nIt is a unique breathing technique, so I hear it is difficult unless you are an experienced diver."
10056005-129 = "When it comes to students capable of that level of freediving,#nthere are only a handful of them even here at Odyssey."
10056005-130 = "We can manage shallow, short-term dives, but the diving club is on a different level."
10056005-131 = "[s] \"That is an amazing skill...\""
10056005-135 = "[ns5] \"What does the diving club usually do?\"\n[ns6] \"Are they entrusted with an important job?\""
10056005-138 = "Well... that is..."
10056005-139 = "They certainly are talented, but--"
10056005-140 = "They keep a lot of secrets, or rather, they lack cooperation..."
10056005-141 = "To put it bluntly, they are a club that requires caution."
10056005-142 = "Putting aside the fact that they are extremely shy..."
10056005-143 = "There are several suspicious things about their cash flow."
10056005-144 = "[s7] \"Suspicious things...?\"\n[s8] \"Could they be secretly using it for other activities?\""
10056005-147 = "No, what is suspicious is not their expenses, but their income."
10056005-148 = "The equipment used by the diving club is hard to obtain and expensive.#nHowever, they do not have a source of income to cover all that."
10056005-149 = "They do not engage in fishing, nor do they have special sponsors.#n...And yet, they manage to stay in business."
10056005-150 = "There is a suspicion that they might be obtaining some shady income."
10056005-151 = "[s] \"Specifically...?\""
10056005-152 = "There are many items obtainable underwater that are traded at high prices in the black market."
10056005-153 = "If they were conspiring with problematic students like the Jiao Long of the Tidal Waters--"
10056005-154 = "Yes, yes, that is enough gloomy talk."
10056005-155 = "Being told such things out of the blue, Teacher, you must be troubled, right?"
10056005-156 = "Ah... excuse me."
10056005-157 = "[s9] \"Um, in other words...\"\n[s10] \"You are worried about the students in the diving club, aren't you?\""
10056005-163 = "[ns] \"If you do not mind, I will go talk to them, too.\""
10056005-164 = "...Are you sure?"
10056005-165 = "It is not like the problem has surfaced, so a full-scale investigation is difficult...#nand we have not been able to do anything about it until now."
10056005-166 = "If you would lend us your strength, Teacher, that would be a great help, but..."
10056005-167 = "You must not! You are a busy person, Teacher...!"
10056005-168 = "Please do not mind what the captain said.#nThis is an Odyssey problem, so--"
10056005-169 = "[s11] \"Still, these are students with a problem, right?\"\n[s12] \"Listening to students' troubles is a teacher's job.\""
10056005-175 = "If you insist... I will take you up on your offer..."
10056005-176 = "Fufu. Schale's Teacher... just as the rumors say."
10056005-177 = "Now, to get back on track--"
10056005-178 = "The diving club should be maintaining their equipment at the pier on the east side of Terminal 3."
10056005-179 = "If you leave right now, you should make it in time."
10056005-183 = "W-Wait a minute. Right now?"
10056005-184 = "Isn't there still time?#nL-Look. Even after you finish the \"ochazuke\" right here--"
10056005-185 = "That is a sign telling you to go home already."
10056005-186 = "You have enjoyed chatting enough already, haven't you?#nIf you do not get back to work soon, you will live to regret it."
10056005-187 = "Ugh..."
10056005-188 = "Well then, Teacher, we are counting on you."
10056005-189 = "...Oh, and one piece of advice."
10056005-193 = "Marine life in the dolphin family are very curious, but they are just as wary.#nPlease be careful when approaching them."
