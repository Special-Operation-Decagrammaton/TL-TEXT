[translation]
10056005-1 = "Prologue; Her Whistle, Like Singing"
10056005-4 = "(It hadn't been long since the Odyssey Maritime School's fleet returned to #nthe D.U.)"
10056005-5 = "(This was during a time when I paid them a visit for work.)"
10056005-10 = "[ns] \"What is that sound?\""
10056005-11 = "(From the seas beyond, I could hear what seemed to be the chirping of a bird.)"
10056005-12 = "(Or perhaps it was like the whistling of a dolphin I'd once heard on TV.)"
10056005-14 = "(As I put my weight onto the railings and leaned forward to look around...)"
10056005-20 = "..."
10056005-22 = "(What appeared was neither a seabird nor a dolphin―but rather one, single girl.)"
10056005-28 = "(She would dive down before resurfacing, her head peeking through the water #neacFh time to catch her breath.)"
10056005-29 = "(Each time she surfaced, a clear whistling sound would resonate through the ship.)"
10056005-33 = "[ns] \"Um, excuse me!\""
10056005-35 = "Hm...?"
10056005-39 = "...Eek."
10056005-45 = "(The moment she noticed me, she vanished beneath the waves before I could #neven blink.)"
10056005-46 = "(The ripples left along the water's surface were the only proof that she had been#nhere.)"
10056005-50 = "[ns] \"What was that all about...?\""
10056005-53 = "Odyssey Maritime School \"Island\" - Stateroom"
10056005-56 = "Right... Now that you've been here at Odyssey for a while now..."
10056005-57 = "Have you had any problems during your stay?"
10056005-58 = "[s1] \"Thanks to everyone, it's been smooth sailing.\"\n[s2] \"Feels like I still don't know a single thing about this place though...\""
10056005-61 = "That's to be expected. Odyssey's one of the biggest schools in Kivotos."
10056005-62 = "Of course, there's still a few schools bigger than us, so we can't claim to be THE #nbiggest."
10056005-63 = "But if you have to look around the entire place, then we've got everyone else beat. #nA vast majority of our clubs use ships as their clubroom, so unless their schedules happen #nto line up, don't expect to be able to meet a lot of them."
10056005-64 = "Though if you truly wish to understand what Odyssey is about, then you HAVE to #nsail the open seas with us."
10056005-65 = "...Or perhaps you will never understand; #nnot until you've journeyed every corner of the vast ocean expanse. Heheh."
10056005-70 = "Um, Captain."
10056005-71 = "By the way, Sensei. Have you decided on lunch yet? #nIf it's fine with you, how about I treat you to some of our ship's finest cuisine? #nToday's a Friday, which means it's curry day!"
10056005-72 = "I've been looking reaaal forward to this since yesterday..."
10056005-73 = "And seriously, I'm not kidding. Out at sea, we can't get access to fresh ingredients. #nAs a result, frozen veggies inevitably become the mainstay out here. That being#nsaaaid..."
10056005-74 = "According to our chef, it seems we received a large batch of fresh tomatoes today."
10056005-78 = "Captain..."
10056005-79 = "Cooking out at sea comes with many restrictions."
10056005-80 = "In rough waters, using something as simple as a fire becomes difficult, so we sometimes resort to eating stuff out of retort pouches."
10056005-81 = "I have to say, though. Apart from that, it's got its own charm. #nAfter slowly simmering and thickening, the vegetable powder has quite a unique #nflavor."
10056005-82 = "It's not very popular with most of the students, though."
10056005-83 = "Minato-senpai!"
10056005-87 = "Wuwah!? You scared me..."
10056005-88 = "Why're you yelling all of a sudden?"
10056005-89 = "You know we have a visitor over, right? The upper brass of Island is meant to#nserve as a role model for others, but your behavior just now was quite unbecoming#nof one."
10056005-90 = "I could say the exact same for you."
10056005-91 = "I believe I have already reminded you that we have absolutely zero time to be#nwasting on idle chatter. #nHave you forgotten about the mountain of work we have regarding Kanesaki Port?"
10056005-92 = "Just because Sensei is here, does not mean you should suddenly schedule for a#nmeeting with them..."
10056005-93 = "Not even an all-nighter will be enough at this rate if you continue to do nothing#nbut idly chat away."
10056005-99 = "Sad face."
10056005-100 = "Don't \"sad face\" me."
10056005-101 = "You are the president of Island, the student council of Odyssey. As such, please #nrefrain from making such childish remarks."
10056005-102 = "Unhappy expression."
10056005-103 = "Making it sound more formal does not change a thing."
10056005-107 = "I apologize for such an unsightly display, Sensei."
10056005-108 = "I understand you are a busy individual, #nbut thank you for nonetheless taking your time to entertain the captain's prattling."
10056005-109 = "[s3] \"No no, not at all.\"\n[s4] \"It gave me an excuse to skimp on my duties too...\""
10056005-111 = "Is this what an adult is like...?"
10056005-112 = "...Ahem."
10056005-113 = "In any case, I'm pleased to hear that you haven't run into any problems during#nyour time here."
10056005-114 = "If anything arises, please get in touch with either us over at Island, or with Trident. #nThe latter is responsible for maintaining order at Odyssey."
10056005-115 = "[s] \"Thank you for your concern.\""
10056005-119 = "[ns] \"...Also, this is a bit out of nowhere, but there's a student I'm curious about.\""
10056005-120 = "Someone you're curious about, you say?"
10056005-122 = "(I told Minato and Ami about what happened yesterday.)"
10056005-124 = "I see. If it's the whistle I'm thinking about..."
10056005-125 = "Then I reckon they're probably a member of the Diving Club."
10056005-126 = "[s] \"Diving Club?\""
10056005-127 = "Their club primarily takes charge in underwater activities."
10056005-128 = "What you heard is what's known as \"isobue,\" or a sea whistle. #nDue to it being a peculiar breathing technique, it's difficult for anyone who#nisn't a professional diver to execute."
10056005-129 = "There are only a handful of students at Odyssey #nwho are capable of freediving at such a level."
10056005-130 = "We're able to do short, shallow dives, but the Diving Club is on a whole other level."
10056005-131 = "[s] \"That's some crazy skill...\""
10056005-135 = "[ns5] \"What does the Diving Club normally do?\"\n[ns6] \"Are they in charge of anything important?\""
10056005-138 = "Well... How should I put it..."
10056005-139 = "They certainly are excellent, but..."
10056005-140 = "They keep things amongst themselves... Or maybe I should say they don't#ncooperate with others very well."
10056005-141 = "To put it simply, they are a club to be wary of."
10056005-142 = "Setting aside how incredibly shy they are..."
10056005-143 = "There's a number of things suspicious about their cash flow."
10056005-144 = "[s7] \"By suspicious things...\"\n[s8] \"You mean like they've been secretly spending money on other things?\""
10056005-147 = "No. What's suspicious is not their expenditures, but rather their revenue."
10056005-148 = "The Diving Club solely utilizes equipment that are costly and difficult to procure. #nHowever, the amount they earn is not enough to cover those costs."
10056005-149 = "They do not engage in fishing, nor are they backed by any special sponsers. #n...And yet, they're able to continue their operations."
10056005-150 = "There are suspicions afloat that they are obtaining income from shady sources."
10056005-151 = "[s] \"Would you care to elaborate...?\""
10056005-152 = "There is a multitude of things that can be aquired underwater, all of which go for#nhigh prices on the black market."
10056005-153 = "And if they were to be conspiring with a problem child such as [ruby=The]sea[/ruby] [ruby=Kraken]monster[/ruby]..."
10056005-154 = "Okay, okay. That's enough about the dark side of things."
10056005-155 = "If you suddenly dump all this talk onto Sensei, even they would feel troubled by it."
10056005-156 = "Ah... Pardon me."
10056005-157 = "[s9] \"Umm, so in other words...\"\n[s10] \"You're worried about the students in the Diving Club.\""
10056005-163 = "[ns] \"If you'd like, how about I try talking to them?\""
10056005-164 = "...Are you sure?"
10056005-165 = "This hasn't actually become a problem yet, so it's been difficult to conduct any sort#nof proper investigation. This is also why we haven't done anything about it yet."
10056005-166 = "If you could assist us with this, then it would be a tremendous amount of help!"
10056005-167 = "Absolutely not! Sensei is a busy person!"
10056005-168 = "Please do not pay the Captain's words any mind. #nThis is an issue for Odyssey to figure out, so―"
10056005-169 = "[s11] \"But still, this is a problem regarding students.\"\n[s12] \"It's a teacher's duty to listen to their students' troubles.\""
10056005-175 = "Since you're willing to go so far... then we'll take up your offer on that..."
10056005-176 = "Heheh. Schale's Sensei... You really are as the rumors say."
10056005-177 = "Returning to the topic then..."
10056005-178 = "The Diving Club should currently be servicing their equipment at terminal 3, along the east side pier."
10056005-179 = "You should be able to reach them in time if you head out now."
10056005-183 = "Wa-wait just a second. Like, now?"
10056005-184 = "Can't they stay a little longer? #nL-look. There's some chazuke here that they could have―"
10056005-185 = "This is a sign for you to get back to work."
10056005-186 = "Haven't you had enough fun chatting by now? #nIf you don't get back to work soon, you will be regretting it later."
10056005-187 = "Ugh..."
10056005-188 = "We'll be counting on you then, Sensei."
10056005-189 = "...Ah, and one last piece of advice."
10056005-193 = "Although dolphins are creatures brimming with curiosity, they also possess#nequal parts wariness. Please exercise caution when you approach."