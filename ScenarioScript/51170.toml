[translation]
51170-1 = "Эпизод 17;Уличные слухи 1"
51170-2 = "Площадь Фестиваля фонарей"
51170-4 = "Подготовка завершена! Прошу сюда."
51170-5 = ""
51170-7 = ""
51170-9 = ""
51170-10 = ""
51170-12 = "Орёл приземлился! Повторяю, орёл приземлился!"
51170-13 = ""
51170-15 = ""
51170-19 = ""
51170-20 = "Ого! Будто специально для тебя сшили."
51170-22 = "Как сидит? Нигде не жмёт?"
51170-24 = "Не больше обычного."
51170-25 = "Хи-хи. Вы выглядите великолепно, госпожа Кадэнокодзи. Как приятно видеть, что вы наконец принимаете свою роль."
51170-26 = "Я так рада, что наша госпожа решила бросить эту ерунду с Хяккарёран и вернуться домой."
51170-27 = "Теперь всё снова так, как и должно быть!"
51170-28 = ""
51170-31 = ""
51170-32 = "Эм... Юкари..."
51170-33 = "Ты и сама прекрасно знаешь, но это событие станет главным номером фестиваля. В полночь ты, как мико Кадэнокодзи, исполнишь ритуальный танец на сцене."
51170-34 = "Камеры уже установлены, и твоё выступление будут транслировать в прямом эфире на всё Хяккияко."
51170-35 = "Для местных студентов это станет прекрасным символом возрождения и нового начала."
51170-37 = "Да! Получается, ты словно символ лучшего завтра, надежда Хяккияко!"
51170-38 = "Подумать только, такая потрясающая традиция могла навсегда исчезнуть! Для меня большая честь увидеть её своими глазами."
51170-39 = "Все ужасно взволнованы!"
51170-40 = ""
51170-43 = ""
51170-44 = "Вот расписание и список—"
51170-45 = "Хи-хи. Как мило с вашей стороны, но госпоже Кадэнокодзи подобная помощь не требуется. Она неустанно изучала ритуальное искусство с самого детства."
51170-46 = "С самого детства?!"
51170-48 = "Разумеется. Моё обучение началось, едва я научилась читать и писать."
51170-49 = "Уверяю вас, всё будет хорошо."
51170-50 = "Рада это слышать, но..."
51170-51 = "А ТЫ сама будешь в порядке?"
51170-52 = "Да."
51170-53 = "Я..."
51170-54 = "Со мной всё совершенно нормально."
51170-55 = "Ладно... Раз ты так говоришь."
51170-56 = "Тогда пора занимать наши места!"
51170-57 = ""
51170-59 = ""
51170-60 = ""
51170-61 = "Да... Всё хорошо."
51170-62 = ""
51170-64 = ""
51170-66 = "По крайней мере, будет."
51170-67 = ""
51170-72 = "На этом мой доклад окончен."
51170-73 = "Ты с ума сошла, Кикё? Зачем ты вообще стала потакать её состязанию за преемство?"
51170-74 = "...Ух, я понимаю почему! Она говорила от всего сердца. Но ты всё равно была слишком сурова..."
51170-75 = "Впрочем, ты рассказала мне всё это не затем, чтобы я тебя отчитывала."
51170-76 = "..."
51170-77 = "Я знаю, она заходила и к тебе, прежде чем пришла ко мне."
51170-78 = "Я решила, что ты захочешь узнать, чем всё закончилось."
51170-79 = "Мне так и не удалось её отговорить, да? Ох, Юкари..."
51170-80 = "Ц. Но я говорила искренне. Возвращаться некуда."
51170-81 = "На этом можем закончить, Кикё."
51170-82 = "...Закончить?"
51170-83 = "Давай оставим прошлое в покое. Не нужно тянуться к нему при первом же приступе ностальгии."
51170-84 = "Не переживай о том, чтобы держать меня в курсе или думать, чего я могу хотеть. Я уже двигаюсь дальше. Я ищу свою юность."
51170-85 = "У меня нет времени на такую реликвию, как Хяккарёран. Так что давай похороним её."
51170-86 = ""
51170-88 = ""
51170-90 = ""
51170-91 = "...Считай, похоронена."
51170-92 = "Я рада слышать, что в этом наши чувства совпадают."
51170-93 = "...И всё же надеюсь, что ты найдёшь свою юность."
51170-94 = "Но береги себя, Рэнгэ. Ты плохо выглядишь."
51170-95 = "Такое чувство, что твои кости сломаются, стоит мне лишь прикоснуться к тебе."
51170-96 = "Что?! Кикё! Эй!"
51170-97 = ""
51170-99 = ""
51170-100 = "Думаешь, можешь просто оставить последнее слово за собой и убежать?! Уф!"
51170-101 = "УФ!"
51170-102 = "Лучше о себе позаботься, кошка-переросток!"
51170-103 = "*вздыхает* Дурочка..."
51170-104 = "Зачем ты снова бередишь старые раны..."
51170-106 = "А?!"
51170-107 = "Рэнгэ, ты в порядке? Что случилось?!"
51170-108 = "Рэнгэ?"
51170-109 = "*зевок*"
51170-110 = ""
51170-113 = ""
51170-114 = "Ой, простите. Ничего не случилось!"
51170-115 = "Просто прошлое внезапно напомнило о себе..."
51170-116 = "Это связано с Хяккарёран?"
51170-117 = "Как ты..."
51170-118 = "Неважно. Вообще-то, теперь всё это уже неважно!"
51170-119 = "В конце концов, я пришла сюда как член Клуба внутренней дисциплины, чтобы насладиться Фестивалем фонарей."
51170-120 = "Посещение фестивалей — обязательный опыт для тех, кто ищет свою юность! Так что пойдём проживать её на полную!"
51170-121 = "Верно, президент? Мимори? Каэдэ?"
51170-122 = ""
51170-124 = ""
51170-126 = ""
51170-127 = "Не хочу тебя обидеть, Рэнгэ, но врёшь ты отвратительно."
51170-129 = "Ч-Что?"
51170-131 = ""
51170-132 = "Можешь повторить это ещё раз с невозмутимым лицом? Что тебе уже всё равно?"
51170-133 = "Ты бы слышала, как сама об этом говорила. Всё время только «Хяккарёран то» да «Хяккарёран это»!"
51170-135 = "Неужели всё было настолько очевидно...?"
51170-136 = "Если тебе всё равно, почему телефонный разговор так тебя расстроил?"
51170-137 = ""
51170-139 = ""
51170-141 = "Я полагаю, потому что для тебя всё это по-прежнему слишком важно, разве нет?"
51170-142 = "Хи-хи. Даже не пытайся отрицать, Рэнгэ. Ты говоришь с Мимори, Читающей Мысли Хяккияко! От её зоркого глаза ничто не ускользнёт."
51170-143 = "Так что лучше сразу во всём признайся!"
51170-144 = "К-Каэдэ, пожалуйста! Я вовсе не утверждаю, что умею такое!"
51170-145 = ""
51170-147 = ""
51170-149 = ""
51170-150 = "И какой смысл, даже если я признаюсь?"
51170-151 = "Всё кончено. Всё уже закончилось."
51170-152 = "Я могу кричать, плакать и закатить истерику прямо посреди этой площади. Нагусу и остальных это не вернёт."
51170-153 = "Я не стану раскапывать уже похороненные скелеты."
51170-154 = "Я вам уже говорила. Те дни позади. Теперь я Рэнгэ из Клуба внутренней дисциплины."
51170-155 = "Если бы ты и правда так думала, то не была бы так добра к Юкари."
51170-156 = "Я? Добра к Юкари? Я бы выбрала другое слово."
51170-157 = "Я... сильно её ранила. Юкари, я имею в виду."
51170-158 = "Наоборот. Ты пыталась избавить её от боли того, кто остаётся и ждёт."
51170-159 = "Не думаю, что человек, способный взвалить на себя бремя младшего студента, действительно ни о чём не переживает."
51170-160 = "А насчёт Кикё... Разве вы не подруги детства?"
51170-161 = "..."
51170-162 = "Не думаю, что она держит на тебя зло. На то и нужны друзья, разве нет?"
51170-163 = "Отношения закаляются и хорошими, и плохими временами. Мы выходим из себя, выплакиваем всё до последней слезы и говорим то, чего не думаем. Но связь под всем этим никуда не исчезает."
51170-164 = "Мне ведь тоже доводилось переживать нечто подобное."
51170-166 = "Правда?! Даже вам, Мимори?"
51170-167 = "Хи-хи. Я далеко не идеальна, Каэдэ."
51170-168 = "У меня тоже есть подруга детства, и между нами не всегда всё было гладко."
51170-169 = "Правда ведь, Цубаки?"
51170-171 = "...Разозлённая Мимори страшнее моего самого жуткого кошмара."
51170-173 = "О-о! Я прекрасно понимаю, о чём ты!"
51170-174 = "П-Простите?!"
51170-175 = "Ну вы двое..."
51170-176 = ""
51170-178 = ""
51170-179 = "Вернёмся к делу."
51170-180 = ""
51170-183 = ""
51170-184 = "...Уже слишком поздно."
51170-185 = "Я уже не могу вернуться. Я ушла из Хяккарёран. В поисках своей юности я встретила всех вас. Я уже иду по этому пути."
51170-186 = "Здесь важны не организации и не титулы. Разве ты не хочешь хотя бы ещё раз поговорить с самыми дорогими тебе людьми? Рассказать, что действительно чувствуешь?"
51170-187 = "Но... как они отреагируют? Разве я не расстрою их ещё сильнее?"
51170-188 = "Это не в твоей власти. Важно то, чего хочешь ТЫ."
51170-189 = "Вице-президент Мимори..."
51170-190 = ""
51170-192 = ""
51170-194 = ""
51170-195 = "Рэнгэ, как президент Клуба внутренней дисциплины я официально отменяю твоё испытательное членство."
51170-197 = "А?!"
51170-199 = "Теперь ты свободна и можешь сделать то, что должна."
51170-200 = "Но не переживай. Мы тебе поможем."
51170-201 = "Ведь мы успели создать столько воспоминаний вместе как Клуб внутренней дисциплины, верно?"
51170-203 = "Цубаки, Мимори, Каэдэ..."
51170-204 = ""
51170-206 = ""
51170-207 = ""
51170-208 = ""
51170-209 = "Ты права. Я больше не могу убегать."
51170-210 = ""
51170-211 = "Кикё рассказала мне об их состязании за преемство."
51170-212 = "Чтобы Юкари услышала всё это от неё сразу после всего, что сказала я..."
51170-213 = "Она не скажет этого прямо, но я знаю, что Кикё хочет, чтобы я проведала Юкари."
51170-215 = "Немного раздражает, ведь она прекрасно могла бы сделать это сама, но..."
51170-216 = "Я не могу просто оставить Юкари вот так. Мне нужно с ней поговорить."
51170-218 = ""
51170-219 = "Если ты этого хочешь, значит, так и сделаем."
51170-220 = "Ага! Мы вместе найдём Юкари!"
51170-222 = "Спасибо вам всем."
51170-223 = ""
51170-226 = ""
51170-230 = "Ого. Фейерверки!"
51170-231 = "Это означает начало Фестиваля фонарей."
51170-232 = "В таком случае у нас мало времени. Давайте—"
51170-233 = ""
51170-237 = "Бегите! Спасайтесь!"
51170-238 = ""
51170-241 = ""
51170-242 = "Что происходит?"
51170-243 = ""
51170-246 = ""
51170-247 = ""
51170-248 = ""
51170-250 = ""
51170-252 = ""
51170-253 = "М-Мимори? Цубаки! ЧТО это такое?"
51170-254 = "!!"
51170-255 = ""
51170-256 = "Без понятия. Но я с полной уверенностью могу сказать, что фестиваль их не интересует."
51170-257 = ""
51170-259 = ""
51170-261 = ""
51170-264 = ""
51170-266 = "Какого...?! Все, не теряйте бдительности! Ни на секунду!"
51170-267 = "Приготовиться!"
51170-268 = ""
51170-276 = ""
51170-278 = "Ч-Ч-Что происходит?!"
51170-279 = ""
51170-281 = ""
51170-282 = ""
51170-284 = "Ого!"
51170-285 = ""
51170-289 = ""
51170-291 = ""
51170-293 = ""
51170-295 = ""
51170-297 = "Осторожно, президент!"
51170-298 = "П-П-Президент!!!"
51170-300 = "Я в порядке! Отлично спасли, вы двое."
51170-301 = "Но важнее другое — фестиваль разрушен..."
51170-302 = "Хотя нет, самое важное — откуда вообще взялись эти чудовища?!"
51170-304 = "Президент... Это напоминает мне день, когда небо стало красным..."
51170-305 = "Ч-Что?! Думаешь... это что-то похожее?"
51170-306 = "Что нам делать...?"
51170-308 = "Не смотрите на меня! Это далеко за пределами знаний ниндзя!"
51170-309 = "Им нет конца! Ещё немного — и нас окружат."
51170-310 = ""
51170-312 = ""
51170-314 = "(Совершить тактическое отступление?)"
51170-315 = "(Но столько посетителей фестиваля ещё не успели эвакуироваться.)"
51170-316 = "(И я не могу просто бросить Цукуё и Изуну! Я их президент!)"
51170-317 = ""
51170-320 = ""
51170-321 = ""
51170-322 = ""
51170-324 = "Уааа?"
51170-325 = "И-Ик!"
51170-326 = ""
51170-329 = ""
51170-330 = ""
51170-332 = "Президент! Цукуё! Не бойтесь!"
51170-334 = ""
51170-335 = "И-Изуна?"
51170-336 = "Изуна...?"
51170-338 = "В конце концов, наш господин здесь, в Хяккияко."
51170-339 = "И наш господин поручил нам, Клубу исследования ниндзюцу, важное задание."
51170-340 = ""
51170-343 = ""
51170-345 = "Я не сдамся, пока не выполню его, нин-нин!"
51170-346 = "Вот это слова настоящего ниндзя! Вперёд, Изуна."
51170-347 = "Когда происходит что-то за пределами нашего понимания, Сенсей всегда всё исправляет!"
51170-348 = ""
51170-350 = ""
51170-352 = "Так что давайте поверим Сенсею, а Клуб исследования ниндзюцу сосредоточится на эвакуации студентов, чтобы выиграть для Сенсея больше времени!"
51170-354 = "Поняла! Как и подобает ниндзя!"
51170-355 = "Мы уже в пути, господин!"
51170-365 = "Вице-президент Кахо! Поступают сообщения о неопознанных существах, сеющих хаос на Фестивале фонарей."
51170-366 = "Похоже, основная активность сосредоточена в Западном районе! Число пострадавших растёт!"
51170-367 = "Вице-президент! Гильдия торговцев сообщает о тех же существах!"
51170-369 = "Что нам делать?! Вице-президент Кахо!"
51170-371 = "Первым делом всем нужно успокоиться! Немедленно!"
51170-372 = "Как это могло..."
51170-373 = "Сейчас важно собрать информацию и навести порядок в этом хаосе. Ния!"
51170-374 = ""
51170-376 = ""
51170-378 = ""
51170-379 = "Ты хочешь сказать, что странные чудовища начали нападать на всех сразу после начала фестиваля?"
51170-380 = "Если учесть весь контекст..."
51170-382 = "«Красота природы»."
51170-383 = ""
51170-387 = "А я-то решила, что то письмо — всего лишь глупая угроза устроить беспорядки или переворот."
51170-388 = ""
51170-392 = "Я отказалась от помощи Шале. Зачем беспокоить их из-за какого-то пустякового слуха?"
51170-393 = "Похоже, я сыграла прямо им на руку."
51170-395 = "И откуда мне было знать? «Красота природы» считалась давно забытой городской легендой."
51170-396 = "Я не могу предугадать вообще каждое возможное будущее!"
51170-397 = "Что это было? Что я упустила? Ничего не происходит просто так, и случайностей не существует..."
51170-399 = "Ния."
51170-401 = "...Кузуноха? С неё всё началось?"
51170-402 = "Ния..."
51170-403 = "Я слишком легкомысленно относилась к Хяккарёран? Да, исчезновение Аямэ меня заинтересовало, но я решила, что Хяккарёран сам разберётся со своими делами..."
51170-404 = "Если бы я копнула глубже, смогла бы это предотвратить?"
51170-405 = "Ния...!"
51170-406 = "Надо подумать. Что-то наверняка было прямо у меня под носом... Иногда из-за множества облаков можно не заметить даже луну..."
51170-407 = ""
51170-409 = ""
51170-411 = "НИЯ—"
51170-412 = ""
51170-421 = ""
51170-422 = "Я тебя стукнула. Плохая президент Ния."
51170-423 = ""
51170-427 = ""
51170-429 = ""
51170-430 = "Ч-Чисэ? Какого...?!"
51170-431 = "Чисэ?!"
51170-432 = ""
51170-434 = ""
51170-436 = "..."
51170-437 = "!!"
51170-438 = "Не поддавайтесь страху."
51170-439 = "Отвести взгляд вы не сможете."
51170-440 = "Укрепите решимость в своём сердце."
51170-441 = "Президент Ния. Все напуганы и растеряны."
51170-442 = "Вы им нужны."
51170-443 = ""
51170-445 = ""
51170-447 = "Чисэ..."
51170-448 = "...Ах."
51170-449 = "А-а..."
51170-450 = "..."
51170-451 = ""
51170-453 = ""
51170-454 = ""
51170-455 = "Ня-ха-ха. Моя маленькая Чисэ стала мудрее."
51170-456 = "Похоже, пришло время самой запачкать руки."
51170-457 = "Кахо. Свяжись с Фестивальным отделом и выясни, что происходит на месте."
51170-459 = "Да, мэм."
51170-460 = ""
51170-462 = ""
51170-466 = "Не могу дозвониться. Связь глушат..."
51170-467 = "Глушат? Я не удивлена, но... ц."
51170-468 = "Они не оставляют мне выбора, да? Похоже, придётся вступить в бой самой."
51170-469 = "Пока я этим занимаюсь, Кахо, ты главная. Гильдия торговцев неподалёку. Они помогут."
51170-470 = "В таком бою информация — наше сильнейшее оружие. Составь хронологию событий, а затем мы сформируем группу реагирования. Что бы ни случилось, Кахо, опирайся на факты и действуй решительно."
51170-471 = "Не переживай. Если что-то пойдёт не так, можешь свалить всё на меня."
51170-473 = "Поняла. Я вас не подведу."
51170-474 = "Вы слышали приказ президента Нии. Клуб Инь-Ян мобилизуется в полном составе!"
