[translation]
51170-1 = "Episódio 17;O Conto Macabro que Caminha pela Cidade (1)"
51170-2 = "Local do Festival das Lanternas - Praça"
51170-4 = "Os preparativos aqui já terminaram!"
51170-12 = "A Senhorita Sacerdotisa chegou!"
51170-20 = "Ah! Magnífico!#nFicou perfeito na senhorita!"
51170-22 = "Não está apertado demais?#nGostaria de algo para beber...?"
51170-24 = "Não, não precisa se preocupar.#nJá estou acostumada."
51170-25 = "Hehe... Sim! Com certeza! Afinal, é a herdeira dos Kadenokouji.#nEstávamos todos aguardando ansiosamente por este momento."
51170-26 = "Que alívio imenso a senhorita ter voltado do Hyakkaryouran...!"
51170-27 = "Agora não há mais com o que se preocupar; tudo certamente ocorrerá sem nenhum contratempo."
51170-32 = "Aham, Yukari-san."
51170-33 = "Como você já sabe, a Dança da Sacerdotisa será realizada pela \"Sacerdotisa dos Kadenokouji\" para encerrar o festival—"
51170-34 = "A apresentação será transmitida ao vivo pela TV e pela internet."
51170-35 = "O significado da dança é a passagem do velho para o novo — despedir-se do passado e acolher o novo..."
51170-37 = "É uma dança que simboliza desenhar um amanhã e um futuro melhores!"
51170-38 = "Ouvi dizer que a última apresentação foi há 20 anos, e agora vou poder ver de novo!"
51170-39 = "A Pina está super animada!"
51170-44 = "Eu resumi o roteiro do ritual aqui, então—"
51170-45 = "Quanto a isso, não precisa se preocupar.#nA senhorita aprendeu todos os passos do ritual desde pequena."
51170-46 = "...Ah, entendo."
51170-48 = "Sim — é o meu dever."
51170-49 = "Irei cumpri-lo com perfeição, portanto, fiquem tranquilos."
51170-50 = "Se é assim, tudo bem, mas..."
51170-51 = "Você tem certeza... de que está tudo bem...?"
51170-52 = "Sim."
51170-53 = "Eu..."
51170-54 = "Eu... estou bem."
51170-55 = "Entendido."
51170-56 = "Então, vamos lá!"
51170-61 = "Sim... é assim que deve ser."
51170-66 = "Tudo isso."
51170-72 = "...E foi isso o que aconteceu."
51170-73 = "Você fez isso mesmo...? Um Torneio de Sucessão com a Yukari...?"
51170-74 = "Quer dizer, o Torneio de Sucessão já foi um baita choque, mas..."
51170-75 = "...Por que você se deu ao trabalho de contar isso pra mim?"
51170-76 = "..."
51170-77 = "Ela se encontrou com você antes de ir à sala de mediação, não foi?"
51170-78 = "Por isso achei melhor te avisar, só por via das dúvidas."
51170-79 = "Aquela garota... mesmo depois de tudo que eu disse... ela ainda não tinha desistido..."
51170-80 = "...Tsc, que se dane. Eu avisei pra ela.#nDisse que voltar não ia adiantar nada."
51170-81 = "Então já chega, Kikyou."
51170-82 = "...Como assim, já chega?"
51170-83 = "Você não precisa mais ficar me ligando assim."
51170-84 = "Não preciso da sua consideração.#nEu já decidi... que vou procurar a minha própria juventude."
51170-85 = "Eu não tenho mais o menor interesse no Hyakkaryouran."
51170-91 = "...Entendo."
51170-92 = "É verdade, foi atrás disso que você foi embora daqui."
51170-93 = "...Certo. Eu também pensava assim, então tudo bem. Fim de papo.#nFaça o que quiser, Renge."
51170-94 = "Apesar de tudo, somos amigas... então vou torcer pela sua felicidade."
51170-95 = "...Pois é, espero que você fique tão feliz que engorde uns 10 quilos."
51170-96 = "Hã?! Ei, o que você—"
51170-100 = "Aquela...! Fala o que bem entende e desliga na minha cara...!!"
51170-101 = "Droga...!"
51170-102 = "Você é que seja m-u-i-t-o f-e-l-i-z!!"
51170-103 = "Haaah... que saco..."
51170-104 = "Já acabou tudo...#nPor que eu ainda..."
51170-106 = "Uau?!"
51170-107 = "O que houve, Renge-senpai?!"
51170-108 = "Renge-chan?"
51170-109 = "Haaah...?"
51170-114 = "Não... não é nada."
51170-115 = "É só um assunto meu... coisa do passado."
51170-116 = "É sobre o Hyakkaryouran... não é?"
51170-117 = "Bom, é, mas..."
51170-118 = "Não, tá tudo bem agora. Que se dane o Hyakkaryouran!"
51170-119 = "Já que é dia de festival, tenho que aproveitar como membro do Clube de Disciplina Interior... não tenho tempo pra ficar pensando em outras coisas."
51170-120 = "É... como é mesmo... Aproveitar o festival também faz parte do treinamento!#nA juventude não espera por ninguém. As garotas devem correr pela noite!"
51170-121 = "Né, Presidente Tsubaki, Vice-Presidente Mimori, Kaede?!"
51170-127 = "Você não é muito boa em mentir, né, Renge-chan?"
51170-129 = "Hã...?"
51170-132 = "Você diz \"que se dane o Hyakkaryouran\"... mas no fundo não pensa isso."
51170-133 = "Isso mesmo! Desde que chegou aqui, você só fala do Hyakkaryouran, Renge-senpai!"
51170-135 = "N-Não, também não é pra tanto...?!"
51170-136 = "Se você não se importasse de verdade... acho que não teria ficado brava depois de desligar o telefone."
51170-141 = "A Tsubaki-chan tem razão. Você não quer que termine assim, quer, Renge-chan?"
51170-142 = "Hehehe! Afinal, a Mimori-senpai é ninguém menos que a leitora de mentes mais forte de Hyakkiyako!"
51170-143 = "Nenhuma mentira passa por ela!!"
51170-144 = "Ah, Kaede-chan... não é nada disso!"
51170-150 = "...Por que vocês todas estão dizendo isso?"
51170-151 = "Já acabou... tudo isso já ficou pra trás."
51170-152 = "Por mais que eu gritasse, nem a Nagusa-senpai nem ninguém voltou."
51170-153 = "Então é melhor colocar logo um ponto final nisso."
51170-154 = "Eu resolvi largar tudo e ir atrás da minha juventude... então por quê?"
51170-155 = "Mas, Renge... você foi gentil com a Yukari, não foi?"
51170-156 = "Eu? Gentil com a Yukari...? Até parece."
51170-157 = "Naquela hora eu só disse coisas que machucaram a Yukari..."
51170-158 = "Você disse que, se quem fica esperando só sofre, então era melhor que o comitê deixasse de existir."
51170-159 = "Aquelas palavras foram pela Yukari...#nAcho que todo mundo percebeu que foi uma mentira para não machucar sua caloura."
51170-160 = "Você disse que você e a Kikyou-chan são amigas de infância, não é, Renge-chan?"
51170-161 = "..."
51170-162 = "Às vezes acabamos dizendo o oposto do que realmente sentimos. Ainda mais quando estamos preocupadas."
51170-163 = "Quando a preocupação fala mais alto... acabam saindo palavras que nem queremos dizer."
51170-164 = "Já aconteceu comigo também, então eu entendo muito bem."
51170-166 = "Hã, com você também, Mimori-senpai?!"
51170-167 = "Hehe... sim, é verdade, Kaede-chan."
51170-168 = "A Tsubaki-chan e eu somos amigas de infância...#nEntão já passamos por muita coisa juntas, sabia?"
51170-169 = "Não é, Tsubaki-chan?"
51170-171 = "...A Mimori dá medo quando fica brava de verdade."
51170-173 = "Acho que eu também sei bem disso!"
51170-174 = "H-Hã?"
51170-175 = "Vocês duas..."
51170-179 = "Portanto, Renge-chan."
51170-184 = "Mas eu já..."
51170-185 = "Eu saí do Hyakkaryouran e estou fazendo teste no Clube de Disciplina Interior... agora já é tarde..."
51170-186 = "Mas você ainda tem algo, não tem, Renge-chan?#nPalavras que quer dizer para as pessoas importantes pra você."
51170-187 = "...Será que ainda dá tempo...? Elas não vão me achar cara de pau?"
51170-188 = "O que importa são os seus \"sentimentos\", Renge-chan."
51170-189 = "Vice-Presidente Mimori..."
51170-195 = "...O período de teste da Renge termina aqui. É uma ordem da presidente."
51170-197 = "Quê?!"
51170-199 = "Vá fazer o que você quer fazer."
51170-200 = "Nós vamos te ajudar também."
51170-201 = "Pela consideração de ex-colega do Clube de Disciplina Interior, né?!"
51170-203 = "Tsubaki, Mimori, Kaede..."
51170-209 = "...Certo. Entendi."
51170-211 = "A Kikyou me contou."
51170-212 = "Que talvez tenha feito a Yukari sofrer."
51170-213 = "Que estava preocupada e queria que eu fosse ver como ela está."
51170-215 = "...Mandar os outros fazerem o que ela mesma devia fazer é bem a cara dela, mas..."
51170-216 = "Eu vou lá conversar com a Yukari."
51170-219 = "Sim. Então vamos encontrá-la agora mesmo."
51170-220 = "Beleza! Todo mundo em marcha!"
51170-222 = "Valeu mesmo, pessoal."
51170-230 = "Ah, fogos de artifício!"
51170-231 = "Parece que o festival começou."
51170-232 = "Antes que a gente se atrase também—"
51170-237 = "Aaaah! F-Fujam!!"
51170-242 = "O que será que aconteceu?"
51170-253 = "...Hã, hã? Tsubaki-senpai, Mimori-senpai! O-O que é aquilo...?!"
51170-254 = "!!"
51170-256 = "Huum, não sei bem...#nMas não parece que dá pra virar amiga disso aí..."
51170-266 = "Tsc...!#nCuidado, pessoal!"
51170-267 = "Aí vem!!"
51170-278 = "M-M-Mas o que é issooo?!"
51170-284 = "Unyaaaah?!"
51170-297 = "Presidente! Você está bem?!"
51170-298 = "Presidente...!!"
51170-300 = "Ah, s-sim!"
51170-301 = "Eu estou bem... mas o local do festival...!"
51170-302 = "Esses monstros... de onde eles vieram?!"
51170-304 = "Presidente, isso... parece igual àquela vez em que o céu ficou vermelho..."
51170-305 = "O-O quê?!#nIgual... àquela vez?!"
51170-306 = "Presidente... Izuna-chan!#nO-O que a gente faz?!"
51170-308 = "O-O-O que a gente faz?!"
51170-309 = "Uau! Tem mais daquele lado também...!"
51170-314 = "(Será que devíamos fugir?!)"
51170-315 = "(Mas ainda tem gente no local do festival...)"
51170-316 = "(Mas, mas, eu não posso colocar a Izuna e a Tsukuyo em perigo também...)"
51170-324 = "Uaaah?!"
51170-325 = "Presidente!!"
51170-332 = "Não precisam se preocupar! Presidente, Tsukuyo-dono!"
51170-335 = "I-Izuna?"
51170-336 = "Izuna-chan...?"
51170-338 = "Neste momento, meu Lorde está em Hyakkiyako!"
51170-339 = "Meu Lorde confiou no nosso Clube de Pesquisa Ninjutsu!"
51170-345 = "A Izuna vai dar tudo de si para corresponder a essa confiança!"
51170-346 = "...É verdade! A Izuna tem razão.#nCerto, então primeiro vamos ajudar todo mundo aqui!"
51170-347 = "Com certeza o Sensei-dono vai dar um jeito!"
51170-352 = "Até lá, nós do Clube de Pesquisa Ninjutsu — a equipe de agentes especiais — vamos proteger todo mundo!"
51170-354 = "S-Sim, entendido!"
51170-355 = "Sim! Então, iniciar operação! Nin-nin!"
51170-365 = "Vice-Presidente Kaho! Algo não identificado apareceu ao redor do local do festival... parece que há um tumulto!"
51170-366 = "Estão relatando vários feridos no Distrito Oeste!"
51170-367 = "Vice-Presidente Kaho! Recebemos um relato de que monstros não identificados apareceram no distrito comercial...!"
51170-369 = "Vice-Presidente Kaho! O que devemos fazer...?!"
51170-371 = "Acalmem-se todos, por favor...!"
51170-372 = "O que... está acontecendo...?"
51170-373 = "Monstros não identificados no local do festival... o que eu faço...?"
51170-379 = "Atacantes desconhecidos que agiram no exato momento em que o festival começou... a pista para prever isso era..."
51170-380 = "Apenas uma."
51170-382 = "...O Clube Beleza da Natureza."
51170-387 = "Julguei aquela carta como uma mera ameaça... só mais um alarme falso de sempre."
51170-392 = "Pensei que seria melhor evitar envolver a Schale em algo tão trivial e ficar devendo um favor... mas..."
51170-393 = "...Eu errei no julgamento desde o início?"
51170-395 = "Afinal, o Clube Beleza da Natureza era uma existência lendária, presente apenas nos registros."
51170-396 = "Quer dizer que eu deveria ter presumido que eram reais...?"
51170-397 = "Onde e o que eu deixei passar...?#nAlgum fator que não considerei... alguma outra pista...?"
51170-399 = "Niya-sama."
51170-401 = "...Pelo momento em que aconteceu, tem mesmo relação com a Kuzunoha...?#nNão, ou será que..."
51170-402 = "Niya-sama..."
51170-403 = "No Hyakkaryouran...?#nA Presidente que desapareceu... havia alguma informação que desconhecíamos...?"
51170-404 = "Para nos prepararmos contra a ameaça, eu devia ter investigado aquele lado...?"
51170-405 = "Niya-sama...!"
51170-406 = "Eu preciso reunir as informações que não sei... que não consegui obter...#nPreciso descobrir onde e o que deixei passar—"
51170-411 = "Niya—"
51170-422 = "Presidente Niya, feio.#nVai levar peteleco na testa~"
51170-430 = "Ai...?!#nC-Chise...?!"
51170-431 = "Chise-chan?!"
51170-436 = "..."
51170-437 = "!!"
51170-438 = "Não tenha medo,"
51170-439 = "sem desviar o olhar,"
51170-440 = "vamos encarar~"
51170-441 = "Presidente. Não pode ficar parada."
51170-442 = "Olha, está todo mundo com medo."
51170-447 = "Chise-chan..."
51170-448 = "...Ah."
51170-449 = "Aah..."
51170-450 = "..."
51170-455 = "Nyahaha, é verdade. A Chise tem razão."
51170-456 = "Sou a presidente do Clube Yin-Yang, afinal; nesse estado, não sirvo de exemplo."
51170-457 = "Kaho, pode entrar em contato com o Comitê de Organização de Festivais?#nCompartilhe a situação atual."
51170-459 = "S-Sim!"
51170-466 = "Ué... não conecta...#nParece que algo está interferindo nas comunicações...?"
51170-467 = "Hmm... bom, não seria nada estranho se estivessem fazendo isso mesmo."
51170-468 = "Deixa eu ver... certo, então eu mesma vou até lá..."
51170-469 = "Kaho, você pode colher informações com as associações comerciais de Hyakkiyako que ajudaram no festival?"
51170-470 = "Agora a prioridade é organizar a situação e montar nossa base.#nPode compilar as informações por horário e por tipo?"
51170-471 = "A gente pode cobrar os responsáveis depois, então conto com você."
51170-473 = "...Sim, entendido.#nDeixe comigo!"
51170-474 = "Pois bem, pessoal, a partir de agora nós do Clube Yin-Yang agiremos sob as ordens de Niya-sama!"
51170-476 = "A partir daqui é uma corrida contra o tempo! Vamos com força total!#nConto com todos vocês!"
51170-477 = "Sim!!"
51170-479 = "Próximo;O Conto Macabro que Caminha pela Cidade (2)"
