[translation]
1602002-1 = "Небольшая беседа одного снайпера"
1602002-3 = "Я отправился в известную сеть кафе, которая недавно открылась рядом со зданием Шале."
1602002-4 = "Обеденное время уже прошло, но кафе всё равно было полно посетителей."
1602002-5 = "[ns1] «(Так вот это то кафе, о котором все говорят в соцсетях...)»\n[ns2] «(Слышал, здесь кофе всегда идеально подбирают под вкус клиента.)»"
1602002-9 = ""
1602002-10 = "Здравствуйте! Что будете заказывать?"
1602002-11 = "[s] «Здравствуйте! Один чёрный кофе, пожалуйста.»"
1602002-12 = "А, прошу прощения! Вы, наверное, здесь впервые."
1602002-13 = "У нас большой выбор зёрен и отточено множество способов заваривания. Поэтому каждая чашка идеально подбирается под ваши предпочтения!"
1602002-14 = "Какие зёрна хотите? Мытая обработка или натуральная? А степень обжарки?"
1602002-15 = "[s] «К-Какие вообще у вас есть зёрна...?»"
1602002-16 = "Большой выбор: Bourbon, Typica, Geisha, Catuai и другие."
1602002-17 = "Можно также выбрать степень обжарки, но для зёрен с высокой кислотностью мы рекомендуем светлую, чтобы сохранить аромат."
1602002-18 = ""
1602002-20 = ""
1602002-21 = "[ns] «Эм, тогда... Эм...»"
1602002-22 = ""
1602002-24 = ""
1602002-25 = "О? [USERNAME] Сенсей?"
1602002-26 = "Вы тоже увидели это кафе во FruLink? В последнее время оно везде вирусится."
1602002-27 = "[s3] «Отоги!»\n[s4] «Слава богу. Помоги мне, пожалуйста...»"
1602002-30 = "...А? Почему вы так растеряны?"
1602002-31 = "[s] «Ты раньше бывала в этом кафе, Отоги?»"
1602002-32 = "Нет, я здесь впервые. А что такое?"
1602002-33 = "...В меню слишком много всего и всё слишком сложно, поэтому трудно выбрать..."
1602002-34 = "Можно ведь просто спросить сотрудника?"
1602002-35 = "...Вам неловко спрашивать перед всей этой толпой?"
1602002-36 = ""
1602002-38 = ""
1602002-39 = ""
1602002-40 = "Если проблема только в этом, я помогу!"
1602002-42 = ""
1602002-43 = "Эй—"
1602002-44 = "Эй, а чем отличаются зёрна «washed» от «natural»?"
1602002-45 = "А, при мытой обработке кофейные зёрна отделяют от плодов после сбора, промывают и сушат, а при натуральной зёрна ферментируются вместе с плодом."
1602002-46 = "Обычно мытую обработку предпочитают те, кому нравится чистый вкус кофе, а натуральная добавляет фруктовые ноты."
1602002-47 = "Ого, не знала, что кофе может быть таким фруктовым. Круто!"
1602002-48 = "А есть что-нибудь с ароматом юзу? Это мой любимый."
1602002-49 = "Да. Натурально ферментированный Bourbon даёт сладкий цитрусовый профиль с приятным ароматом юзу."
1602002-50 = "Тогда берём его? А каким способом заваривать?"
1602002-51 = "Хм... Я плохо разбираюсь в кофе, так что тем, который лучше всего подходит этим зёрнам."
1602002-52 = "Хорошо, тогда сделаем ручной пуровер."
1602002-53 = "А вам..."
1602002-54 = "[s] «М-Мне то же самое!»"
1602002-55 = "Отличный выбор. Скоро всё будет готово."
1602002-56 = ""
1602002-58 = ""
1602002-59 = "[ns5] «Ты меня спасла...»\n[ns6] «В наши дни всё стало таким сложным.»"
1602002-62 = "Да, заведения с подобной персонализацией в последнее время очень популярны."
1602002-63 = "Мне нравится. Весело разговаривать с сотрудниками и узнавать новое."
1602002-64 = "Хотя некоторые считают, что это слишком много общения, и избегают таких мест любой ценой."
1602002-65 = "Сотрудник ведь не перепрыгнет через стойку и не нападёт, если не знаешь, как ответить на вопрос."
1602002-66 = ""
1602002-68 = "Ваш кофе!"
1602002-69 = "А, наш заказ готов."
1602002-70 = "Мм, пахнет хорошо... У кофе действительно есть этот необычный цитрусовый аромат."
1602002-71 = "Если бы он был холодным, можно было бы принять запах за холодный чай."
1602002-72 = "Лёд заметно приглушит аромат, но если захотите, просто скажите."
1602002-73 = "Нет-нет. Хочу попробовать так, как вы рекомендовали."
1602002-74 = "А какие зёрна хорошо подходят для айс-кофе? В следующий раз было бы интересно попробовать."
1602002-75 = "Если хотите, могу дать несколько образцов колд-брю!"
1602002-76 = "О, отлично. Пожалуйста, если не сложно!"
1602002-78 = ""
1602002-79 = ""
1602002-80 = ""
1602002-81 = ""
1602002-83 = ""
1602002-84 = "[ns7] «Ты очень хорошо умеешь поддерживать разговор...»\n[ns8] «Ты общительнее других знакомых мне снайперов.»"
1602002-87 = "Других снайперов...?"
1602002-88 = "А. Понимаю. Потому что снайперы обычно работают одни."
1602002-89 = "Наверное, отсюда и стереотип, что снайперы робкие и замкнутые."
1602002-90 = "Конечно, одиночки, привыкшие к изоляции и самостоятельной работе, часто хорошо справляются с одиночными снайперскими заданиями..."
1602002-91 = "Но мы всё равно часть отряда. Чтобы скоординированная операция шла гладко, нужны хорошие социальные навыки."
1602002-92 = "И у меня есть одно правило для себя как для снайпера. Оно помогло мне избавиться от этого ощущения."
1602002-93 = "[s] «Что за правило?»"
1602002-94 = "Видите ли..."
1602002-95 = ""
1602002-97 = ""
1602002-98 = "Эй, вы уронили эту закладку."
1602002-99 = ""
1602002-101 = "О боже, спасибо! Не верится, что я чуть её не потеряла. Она очень важна для меня."
1602002-102 = "Кажется, я узнаю этот автограф..."
1602002-103 = "А, автор «Koi About Love»! Из серии «Forbidden Love»."
1602002-104 = "Точно! Я получила её на одном из мероприятий издательства, так что она единственная в своём роде."
1602002-105 = "Не верится, что вы узнали. Вы тоже поклонница?"
1602002-106 = "Не знаю, могу ли назвать себя поклонницей, но мне правда нравятся все их работы. Если вижу новый выпуск — обязательно покупаю."
1602002-107 = "А! Вы уже купили их новый сборник рассказов? Он вышел на прошлой неделе."
1602002-108 = "Что? Нет, ещё нет!"
1602002-109 = "Отлично... Тогда держите! Это новинка."
1602002-110 = "Вы уверены? Она наверняка вам очень дорога."
1602002-111 = "Да, берите! Это просто мой план превратить вас в такого же фаната, как я."
1602002-112 = ""
1602002-114 = ""
1602002-115 = "Тогда спасибо! Для меня честь."
1602002-116 = "Если не против, можно ваш MomoTalk? Когда дочитаю, напишу впечатления!"
1602002-118 = "Да, конечно! Это..."
1602002-120 = ""
1602002-121 = ""
1602002-122 = ""
1602002-123 = ""
1602002-124 = ""
1602002-125 = ""
1602002-127 = ""
1602002-128 = ""
1602002-129 = ""
1602002-130 = ""
1602002-131 = ""
1602002-132 = ""
1602002-134 = "Оставшуюся часть визита Отоги естественно заводила разговоры с сотрудниками и посетителями при каждом удобном случае."
1602002-135 = "Благодаря её общительности мы неожиданно получили много полезной информации и всяких приятных бонусов."
1602002-136 = ""
1602002-137 = "Ах, было весело."
1602002-138 = "Спасибо, Сенсей. Давно мне не было настолько весело, и всё благодаря вам."
1602002-139 = "[s] «Да нет. Это мне нужно тебя благодарить.»"
1602002-140 = ""
1602002-143 = "[ns] «Так... Что это было за правило?»"
1602002-144 = "Точно, я забыла, о чём мы говорили."
1602002-145 = "Работа снайпера во многом состоит из оценки возможностей."
1602002-146 = "«Стрелять сейчас? Или подождать ещё немного ради лучшего момента?»"
1602002-147 = ""
1602002-149 = ""
1602002-150 = ""
1602002-151 = "Но я поняла, что когда возможность появляется, нужно просто пользоваться ею."
1602002-152 = "Ошибку всегда можно исправить. А упущенный момент не вернёшь."
1602002-153 = "То же самое работает и в жизни. Знакомство с человеком, попытка чего-то нового или изучение сложных вещей — я стараюсь не убегать от шанса."
1602002-154 = "[s9] «Отличное жизненное правило.»\n[s10] «Надеюсь, ты сохранишь его, когда станешь старше.»"
1602002-157 = "Фуфу. Не хочу хвастаться, но благодаря этому убеждению я, кажется, попробовала почти всё."
1602002-158 = "Небо, земля, море — почти нет ситуаций, которые способны застать меня враспло—"
1602002-159 = ""
1602002-160 = "Новинка! Пожалуйста, попробуйте."
1602002-161 = "Такого раньше не существовало и больше никогда не будет. Революционная лапша быстрого приготовления — шоколадно-чили рамен!"
1602002-162 = "..."
1602002-163 = "Когда встречаю что-то новое, нельзя избегать. Нужно попробовать, правда...?"
1602002-164 = "[s11] «Нет, не нужно себя заставлять?!»\n[s12] «Некоторые вещи понятны и без дегустации!»"
1602002-167 = "Нет, Сенсей."
1602002-168 = "Иногда агент спецподразделения SRT обязан идти вперёд, даже зная, что миссия безнадёжна."
1602002-169 = "Я попробую сама и расскажу вам, каково это на вкус."
1602002-171 = "После этого Отоги попробовала лапшу, которую все обходили как чуму. Выражение её лица стало мрачным."
1602002-173 = ""
1602002-174 = "Да... Согласна. Такое действительно больше никогда не должно существовать."
1602002-175 = ""
1602002-177 = ""
1602002-181 = "[ns] «Отоги...!»"
1602002-183 = "Она рухнула от боли."
