[translation]
10011025-2 = "Нас размазали!"
10011025-3 = ""
10011025-5 = ""
10011025-7 = "Нам надрали задницы! Да кто это вообще?!"
10011025-8 = ""
10011025-9 = "Погодите! Это же Сенсей из Шале?!"
10011025-10 = "Тот самый Сенсей, о котором все шумят? Говорят, одного взгляда хватает, чтобы испортить тебе весь день!"
10011025-11 = "[s] «Мне кажется, меня сейчас очень несправедливо оценивают...»"
10011025-12 = "Ц! Все, бежим!"
10011025-13 = ""
10011025-15 = ""
10011025-17 = "[ns] «Вот и убежали. Ты в порядке, Цукуё?»"
10011025-18 = "Уа... Уа-а-а-а! С-Сенсей...!!"
10011025-20 = "[ns] «Теперь немного легче?»"
10011025-21 = "Спасибо, Сенсей..."
10011025-22 = "Я... Мне очень жаль, что втянула вас в свои проблемы."
10011025-23 = "[s1] «Ничего страшного. Почему они к тебе приставали?»\n[s2] «Ситуация была неприятная. Такое часто с тобой случается?»"
10011025-26 = "Ну, эм..."
10011025-27 = "Я просто... я такая ужасно большая и высокая..."
10011025-28 = "Наверное, такое часто случается, потому что меня очень легко заметить в толпе..."
10011025-29 = "Ещё раз спасибо за помощь."
10011025-30 = "[s] «Любой бы так поступил. Пойдём обратно?»"
10011025-31 = "Да!"
10011025-32 = ""
10011025-34 = ""
10011025-38 = "*нервно оглядывается*"
10011025-39 = ""
10011025-41 = ""
10011025-45 = "*ёрзает*"
10011025-46 = "[s] «...У меня что-то на лице?»"
10011025-47 = "Нет! Всё в порядке!"
10011025-48 = "П-П-П-Простите! Наверное, вы думаете, что я ужасно грубая, раз так пялюсь! Простите, простите, простите!"
10011025-49 = "[s] «Я совсем не злюсь. Просто хотел понять, о чём ты думаешь.»"
10011025-50 = "Хорошо, понимаете..."
10011025-51 = "Видите ли..."
10011025-52 = "Ну..."
10011025-53 = "Господин Изуны... Я всегда задавалась вопросом..."
10011025-54 = "Какой вы человек..."
10011025-55 = "[s] «А, так вот почему...»"
10011025-56 = "Хе. Хи-хи!"
10011025-58 = "С тех пор как она вступила в Исследовательский клуб ниндзюцу, Изуна постоянно говорила..."
10011025-59 = "«Я стану ниндзя номер один в Кивотосе ради моего господина!»"
10011025-60 = "Конечно, президент всегда думала, что её обманул какой-то странный незнакомец..."
10011025-61 = "[s] «О...»"
10011025-62 = "Простите! Я не хотела сказать, что вы странный незнакомец, Сенсей!"
10011025-63 = "Просто раньше мы все так думали!"
10011025-65 = ""
10011025-66 = "Но вы бы видели... Изуна всегда сияла, когда говорила о своём господине!"
10011025-67 = "Я не думала, что её обманули... На самом деле мне всегда хотелось с вами познакомиться..."
10011025-68 = "[s3] «Ну и как, после знакомства я тебя удивил?»\n[s4] «Ну и как, после знакомства я тебя разочаровал?»"
10011025-72 = "Н-Нет, совсем нет!"
10011025-73 = "Сенсей, вы были таким спокойным, даже когда мы неожиданно к вам ворвались. И..."
10011025-74 = "[s] «И?»"
10011025-75 = "Вы не кричали и не ругали нас... И самое главное, даже когда мы говорили о ниндзя..."
10011025-76 = "В-Вы ни разу над нами не посмеялись."
10011025-77 = "Вы даже специально вступились за нас перед клубом Инь-Ян."
10011025-78 = "Я удивилась. В хорошем смысле."
10011025-79 = "Знать, что в мире есть такие люди, как вы, Сенсей..."
10011025-80 = "Мне от этого очень радостно."
10011025-81 = "Уверена, Изуна и президент тоже счастливы рядом с вами."
10011025-82 = "[s] «Приятно видеть, как хорошо вы все ладите.»"
10011025-83 = "Эм..."
10011025-84 = "Да!"
10011025-85 = "Я долго сомневалась, может ли такая, как я, вступить в клуб."
10011025-86 = "Но Изуна замечательная... И я очень уважаю президента за то, что она приняла меня."
10011025-87 = "Я могу быть очень медленной и туповатой... Но президент..."
10011025-89 = ""
10011025-90 = "Цукуё, верно?"
10011025-91 = ""
10011025-93 = ""
10011025-95 = "Даже несмотря на то, какая я..."
10011025-96 = "Д-Дело в том, что я хочу стараться изо всех сил!"
10011025-97 = "Соблюдать правила ниндзя и н-не подвести их!"
10011025-98 = ""
10011025-100 = ""
10011025-101 = "Что... гораздо легче сказать, чем сделать."
10011025-102 = "Но я твёрдо решила помочь, чтобы представление прошло успешно."
10011025-103 = "[s5] «...А, хорошо.»\n[s6] «Я знаю, ты справишься, Цукуё.»"
10011025-106 = "Х-Хорошо. В-Вы правда так думаете?"
10011025-107 = ""
10011025-109 = "Это мой господин! И Цукуё!"
10011025-110 = "Давайте! Подготовка почти закончена!"
10011025-111 = "О! М-Мы идём!"
