[translation]
51230-1 = "Эпизод 23;Искусная ложь"
51230-2 = ""
51230-3 = ""
51230-5 = ""
51230-6 = ""
51230-7 = "Сенсей! Кто-то лежит на земле без сознания."
51230-8 = ""
51230-10 = "[ns] «Юкари?!»"
51230-11 = ""
51230-16 = ""
51230-17 = ""
51230-18 = ""
51230-19 = ""
51230-20 = "[ns] «Уф. Этим чудовищам нет конца.»"
51230-22 = ""
51230-23 = "Вы двое вообще не умеете сдаваться, да?"
51230-25 = "Сюро..."
51230-26 = "[s] «...Сюро. Всё закончится сейчас.»"
51230-27 = ""
51230-29 = ""
51230-30 = "Мы забираем Юкари домой."
51230-31 = ""
51230-34 = ""
51230-35 = "...Ха."
51230-36 = "Ха-ха."
51230-37 = "Ха-ха-ха-ха!"
51230-38 = ""
51230-40 = ""
51230-41 = "Вы раздражаете. Очень, очень раздражаете."
51230-42 = ""
51230-44 = ""
51230-45 = ""
51230-47 = "Знаете, кажется, я уже что-то такое слышала."
51230-48 = "Прославленный Сенсей из Шале, способный решить любую проблему."
51230-49 = "Назойливый любитель лезть не в своё дело, который не может не вмешаться в любой конфликт, возникающий в Кивотосе."
51230-50 = "Раньше вы всегда всё исправляли, так почему не сейчас? Вы доблестно прибежали сюда с Нагусой, думая, что достаточно щёлкнуть пальцами — и Юкари спасена."
51230-51 = "Серьёзно? Вот прям серьёзно?! Ещё один росчерк пера — и финал истории наконец будет моим."
51230-52 = "Я уже на последней странице, а вы думаете, что теперь сможете меня остановить? Ага. Я злюсь. Раздражена. Это смешно."
51230-53 = "Вы просто умора, Сенсей. Развлекаете без конца."
51230-54 = ""
51230-56 = ""
51230-57 = "Но знаете, кто на самом деле очень-очень, невероятно смешной? Ты, Нагуса."
51230-59 = "...Прекрати."
51230-61 = "«Верни Юкари»? Из всех людей именно ты считаешь, что имеешь право это говорить?"
51230-62 = "Ты думаешь, что герой этой истории, Нагуса? Правда поверила, что прискачешь на белом коне и всё исправишь?"
51230-63 = "Насколько отвратительно бредовой можно быть?"
51230-64 = "Твои друзья произнесли для тебя милую мотивирующую речь?"
51230-65 = "Дай угадаю, что они сказали. А! «Только ты можешь спасти Юкари! Пожалуйста!»"
51230-66 = "Но с чего бы им говорить что-то подобное?"
51230-67 = "Ведь ты та трусиха, которая не смогла спасти Аямэ."
51230-68 = ""
51230-71 = ""
51230-72 = "О. Теперь всё сходится. Ты всё ещё лжёшь."
51230-73 = "Ты рассказала им правду? На-а-астоящую правду о том, что случилось на Великом снежном поле?"
51230-74 = "[s] «Нагуса, тебе не обязательно это слушать.»"
51230-75 = "Вообще-то обязательно. И вам, Сенсей, тоже стоит послушать."
51230-76 = "Посмотрите на Нагусу. Стоит такая гордая, наконец готова стать лидером! Пара добрых слов — и она уже думает, что способна спасти мир."
51230-77 = "Но на деле она слабовольная идиотка, которая никак не может перестать врать!"
51230-78 = ""
51230-81 = ""
51230-83 = "Помнишь, Нагуса? Потому что я помню!"
51230-85 = "Ты вернулась. Так старалась спасти Аямэ. И провалилась, провалилась, ПРОВАЛИЛАСЬ!"
51230-86 = "Покажи правую руку. Вытяни её как можно дальше, и мы увидим, как она выглядела, когда ты упустила Аямэ."
51230-87 = "Наверное, маленькая Нагуса была слишком труслива, чтобы дотянуться до неё."
51230-89 = "Никогда не забывай, кто ты. Самозванка, вцепившаяся когтями в Аямэ, будто её совершенство могло стать твоим спасением."
51230-91 = "О чём мы там говорили?"
51230-92 = "Ах да. О твоей правой руке."
51230-93 = "...Я сказала, прекрати."
51230-94 = "Покажи Сенсею свою бесполезную, иссохшую руку. Видите, Сенсей, её руку поглотил мир духов, когда она попыталась протянуть её туда и спасти Аямэ."
51230-95 = "Так храбро, так достойно восхищения. Ага, конечно. Как только возникли трудности, ты сбежала со всех ног."
51230-96 = "Я не... Нет..."
51230-97 = ""
51230-99 = ""
51230-101 = "Тс-с. Я ещё не закончила твою историю."
51230-102 = "Я как сейчас помню, что Аямэ сказала тебе после того, как стала Фантомным сказанием."
51230-103 = "Ты тоже помнишь, Нагуса?"
51230-104 = "Заткнись! Заткнись!"
51230-106 = "«Ты никогда не была моей подругой, Горё Нагуса.»"
51230-107 = ""
51230-109 = ""
51230-110 = ""
51230-112 = "Этот момент был таким прекрасным. Я запомню его навсегда."
51230-113 = "На одно мгновение она поверила в тебя, Нагуса. По-настоящему поверила, что ты её спасёшь. Можно ли винить её за то, что она сказала тебе жестокую правду, когда поняла, насколько ты бесполезна?"
51230-114 = "Если честно, я полностью на её стороне."
51230-115 = "Только представьте, если бы там оказался кто-нибудь другой."
51230-116 = "Кто-нибудь другой — да вообще любой — мог бы это остановить. Мог бы спасти Аямэ."
51230-117 = "Разве нет?"
51230-119 = "[ns] «Твои слова — яд, Сюро!»"
51230-120 = ""
51230-122 = ""
51230-123 = "Пожалуйста, не перебивайте меня. Я, Ябуки Сюро, бард историй о призраках, говорю."
51230-124 = ""
51230-126 = ""
51230-127 = ""
51230-129 = ""
51230-130 = ""
51230-131 = ""
51230-135 = "[ns] «Ммф?!»"
51230-136 = "Вот так. Призраки заставят вас помолчать."
51230-137 = "Ведите себя хорошо там, Сенсей из Шале."
51230-139 = "Сенсей!"
51230-140 = "Вернёмся к теме. Ты, Нагуса. Всё это из-за тебя."
51230-141 = "Задела твои чувства? Кажется немного несправедливым? Мм?"
51230-142 = "Я тебе докажу."
51230-144 = "Мой том обнажит всю правду."
51230-145 = ""
51230-147 = ""
51230-160 = "(Я родилась с грузом ожиданий на плечах.)"
51230-161 = "(Моим долгом было превзойти каждое из них.)"
51230-162 = "(Я улыбалась под тяжестью их ожиданий.)"
51230-165 = "Меня зовут Кадэнокодзи Юкари."
51230-166 = "Наследница одной из старейших и наиболее почитаемых семей Хяккияко."
51230-167 = "Не посрами имя Кадэнокодзи."
51230-168 = "Таков был мой долг с самого момента рождения."
51230-169 = "...Я знаю."
51230-170 = "Это единственная цель моей жизни."
51230-171 = ""
51230-173 = ""
51230-175 = "Но..."
51230-176 = "А потом я встретила Нагусу."
51230-177 = "Она научила меня стремиться к той жизни, которой хочу я, а не к той, что мне навязали!"
51230-178 = ""
51230-181 = "Да! Я хотела вступить в Хяккарёран вместе с Нагусой!"
51230-182 = ""
51230-185 = ""
51230-186 = ""
51230-187 = ""
51230-188 = "Тебя ввели в заблуждение, Юкари..."
51230-189 = "Я не заслуживаю ни твоего восхищения, ни твоей гордости."
51230-190 = ""
51230-192 = ""
51230-193 = ""
51230-194 = "Я была мошенницей."
51230-195 = "Каждый день надевала маску и играла ту роль, которую от меня ждали."
51230-196 = ""
51230-200 = "Всё, что ты обо мне знала, было ложью."
51230-201 = ""
51230-211 = "И потому что я лгала..."
51230-212 = "Потому что я создала эту личину Нагусы только ради эгоистичного желания стоять рядом с Аямэ..."
51230-213 = "Именно поэтому Юкари захотела вступить в Хяккарёран. Потому что верила в меня."
51230-215 = "Хорошо, хорошо. Начинаешь понимать, Нагуса. Всё, к чему ты прикасаешься, умирает."
51230-216 = "Кто-нибудь получше смог бы вытащить Аямэ из мира духов. Спасти Юкари, пока не стало слишком поздно."
51230-217 = ""
51230-219 = ""
51230-220 = ""
51230-221 = "И всё это потому, что ты была идиоткой и решила, будто имеешь право стоять рядом с Аямэ."
51230-222 = "Посмотри на пламя вокруг и пойми: оно здесь потому, что ты посмела выйти за отведённые тебе рамки."
51230-223 = "Никогда этого не забывай."
51230-225 = "Я виновата... во всём... Это моё наказание за то, что я мечтала..."
51230-226 = "Я погубила Хяккарёран. Сам Хяккияко."
51230-227 = "Моё существование... было ошибкой..."
51230-229 = "[ns] «На...са...!»"
51230-230 = "Ску-у-учно. Подчините Нагусу."
51230-231 = ""
51230-233 = ""
51230-234 = ""
51230-235 = ""
51230-239 = "[ns] «...!!!»"
51230-241 = "А-а-а. Так гораздо лучше."
51230-242 = "Она и без того была пустой оболочкой человека. Превратить её в призрака оказалось легко."
51230-243 = "Ты навсегда станешь моей любимой маленькой питомицей, Нагуса."
51230-244 = "*вздыхает*"
51230-245 = "Итак, дамы и господа, мы подходим к финалу!"
51230-248 = "Хи-хи, ага, аха-ха-ха."
51230-249 = "Как прекрасно. Великолепно!"
51230-250 = "Я довольна. Все узнали своё место."
51230-251 = "Всё прошло точно по плану."
51230-254 = "Признаюсь, заставить всех ополчиться друг на друга оказалось куда легче, чем я ожидала. Сеять семена недоверия среди людей слишком просто."
51230-255 = "И посмотрите на Сенсея! Известен по всему Кивотосу, а для меня оказался всего лишь пешкой."
51230-257 = ""
51230-258 = ""
51230-259 = "Тебе нравятся мои истории о призраках, Кокурико?"
51230-260 = "А теперь начинается самое весёлое. Проклинайте и ненавидьте друг друга! Рубите своих же студентов и сотрите Хяккияко с лица земли!"
51230-262 = "В моей версии «Ста историй о призраках» Хяккияко сгорает дотла. Кокурико, я достигла идеальной утончённости!"
51230-263 = ""
51230-265 = ""
51230-266 = "Теперь осталось получить моего Каташиро..."
51230-268 = ""
51230-271 = "[ns] «...!!!»"
51230-273 = "А?!"
51230-274 = ""
51230-278 = ""
51230-279 = ""
51230-282 = "Посмотрите на себя. Вся избита и в синяках от попыток сопротивляться."
51230-283 = "Чего вы вообще пытаетесь добиться? Спасти Юкари?"
51230-284 = "Блеск надежды в ваших глазах мне отвратителен."
51230-285 = "Как смеют бессильные надеяться? Вы не такие, как мы. Я могу убить вас в одно мгновение, Сенсей."
51230-287 = "[ns] «...!»"
51230-288 = ""
51230-292 = "Прекратите! Идиот!"
51230-293 = ""
51230-298 = "Вы всё ещё пытаетесь? Перестаньте! Двигаться!"
51230-299 = "У вас вообще мозгов нет? Вы просто тупица?"
51230-300 = "Или вы настолько отчаянно хотите спасти Юкари?"
51230-302 = "[ns] «...ХИЯ-А-А!»"
51230-303 = ""
51230-305 = ""
51230-309 = "...Я совершенно озадачена."
51230-310 = "Вы всё ещё не понимаете ситуацию?"
51230-311 = "Если бы не Юкари, я не смогла бы создать Безликого Каташиро, который прямо сейчас уничтожает всё, что студенты Хяккияко знают и любят."
51230-312 = "Она так сильно всех ненавидела и так отчаянно жаждала свободы, что породила чудовище."
51230-313 = "Ваши глупые заблуждения об этому глупому маленькому студенту заставляют вас верить во ложь."
51230-314 = "Юкари никогда не была хорошим человеком. Она манипулировала вами, чтобы вы помогли ей возродить Хяккарёран."
51230-315 = "Люди только этим и занимаются! Ложь! Ложь! Ложь!"
51230-316 = "Никакие они не герои. Вы ранены сильнее некуда, но всё равно упорно идёте вперёд, решив спасти всех."
51230-317 = "Почему вы так стараетесь спасти каких-то никчёмных лживых идиотов? Почему?!"
51230-318 = "[s1] «Ты права. Они лжецы.»\n[s2] «Они ужасно боялись правды.»\n[s3] «Поэтому лгали ради собственной выгоды.»"
51230-322 = "Вы всё ещё не понимаете ситуацию?"
51230-323 = "Я знала, что вы наконец поймёте мою точку зрения!"
51230-324 = "[s] «...Ты права.»"
51230-326 = "[ns] «Но какое это имеет значение?»"
51230-327 = ""
51230-329 = ""
51230-330 = "...Что?"
51230-331 = "[s4] «Разве лгать действительно настолько плохо?»\n[s5] «Или иногда быть лицемером?»"
51230-334 = "Что за бред..."
51230-335 = "[ns] «Это не бред. Это здравый смысл.»"
51230-336 = ""
51230-339 = "[ns] «Всё это — самые обычные вещи.»"
51230-340 = ""
51230-341 = "...Что?"
51230-342 = ""
51230-344 = ""
51230-348 = "Следующий эпизод;Обычные события"
