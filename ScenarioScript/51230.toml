[translation]
51230-1 = "Episódio 23;Palavras Falsas"
51230-7 = "Sensei...! Ali...!"
51230-10 = "[ns] \"Yukari?!\""
51230-20 = "[ns] \"Tsc... Tem monstros aqui também!\""
51230-23 = "Finalmente chegaram até aqui, né?#nSensei da Schale... Nagusa-chan."
51230-25 = "Shuro..."
51230-26 = "[s] \"Shuro, já chega.\""
51230-30 = "Devolva a Yukari."
51230-35 = "Hã...!"
51230-36 = "Aha..."
51230-37 = "Ahahahahahaha!!"
51230-41 = "Como vocês são irritantes!"
51230-47 = "Pensando bem, eu ouvi uns boatos por aí."
51230-48 = "Dizem que o Sensei da Schale resolve qualquer problema—"
51230-49 = "Que mete o nariz em tuuudo que acontece em Kivotos... o maior idiota de todos."
51230-50 = "Então veio até aqui... bancando o justiceiro, é?"
51230-51 = "Logo quando só falta o toque final para a minha \"Hyakumonogatari\"?"
51230-52 = "E mesmo assim? Vem atrapalhar bem agora...?#nSério, sério meeesmo! Isso me faz rir de verdade!"
51230-53 = "O Sensei da Schale já é uma piada, mas..."
51230-57 = "Nagusa-chan, você em especial."
51230-59 = "...!!"
51230-61 = "Não pode ser... Logo você dizendo \"Devolva a Yukari\"...?"
51230-62 = "Quer dizer que você veio achando mesmo que consegue salvar a Sacerdotisa?#nEi, me conta, Nagusa-chan!"
51230-63 = "Que cara de pau a sua de falar uma coisa dessas..."
51230-64 = "Será que as suas amiguinhas deram um empurrãozinho?"
51230-65 = "Ficaram te incentivando, dizendo que só você#npode salvar a Sacerdotisa?"
51230-66 = "Que estranho... Será que elas não sabem?"
51230-67 = "Que você nem conseguiu salvar a Ayame, Nagusa-chan?"
51230-72 = "Aaah... Não me diga que você ainda está escondendo de todo mundo?"
51230-73 = "O que aconteceu na Grande Planície Nevada... a verdade—"
51230-74 = "[s] \"Nagusa, você não precisa dar ouvidos a ela.\""
51230-75 = "Não, não, precisa sim!#nAté o Sensei devia ouvir, sabia?"
51230-76 = "Que a Nagusa-chan, que veio correndo ao seu lado com essa carinha de \"Eu vou salvar a minha kouhai!\"..."
51230-77 = "Na verdade é uma mentirosa sem força nem vontade de salvar ninguém... Não acha melhor saber disso?"
51230-83 = "Eu ainda me lembro muito bem, viu, Nagusa-chan?"
51230-86 = "Essa sua mão nem sequer conseguiu tocar na Ayame."
51230-87 = "Bem, para começar, você nunca teve estofo para isso, né?"
51230-89 = "Só uma garota que imitava a Ayame.#nUma idiota que se achou aluna exemplar só porque andava ao lado dela."
51230-91 = "Hmm, e o que foi mesmo que aconteceu depois?"
51230-92 = "Ah, sim! Esse seu braço direito—"
51230-93 = "...Para."
51230-94 = "Esse braço nem se mexe mais, né?#nEu sei de tudo. O pobre braço direito que se estendeu para a Ayame e foi rejeitado.#nPorque foi engolido pelo Crepúsculo."
51230-95 = "Falta coragem, né? Faltava tão pouquinho, e você desistiu!"
51230-96 = "Não é verdade... Eu..."
51230-101 = "Eu ainda me lembro direitinho, viu?#nNaquele dia, enquanto a Ayame afundava no \"Crepúsculo\"—"
51230-102 = "As palavras que ela lançou para você, já reduzida a uma \"Hyakumonogatari\"."
51230-103 = "Se não me engano—"
51230-104 = "Não...! Para!"
51230-106 = "\"Desde o começo, eu nunca te considerei minha amiga.\""
51230-112 = "Sim, sim.#nForam palavras tão maravilhosas, não foram?"
51230-113 = "O desespero dela ao ver que a Nagusa-chan, em quem ela confiava para salvá-la, não fez nada!"
51230-114 = "Ah... o que a Ayame sentiu naquele momento... eu entendo até demais."
51230-115 = "Para começo de conversa... se quem tivesse ido resgatá-la não fosse você, Nagusa..."
51230-116 = "Se fosse alguém mais capaz, talvez a tragédia tivesse sido evitada, né?"
51230-117 = "Ei, você não acha?"
51230-119 = "[ns] \"Shuro...!\""
51230-123 = "Poderia não atrapalhar?#nA contadora de histórias de terror, Yabuki Shuro, está falando!"
51230-135 = "[ns] \"Guh... Hmmm?!\""
51230-136 = "Mesmo sendo o Sensei da Schale,#nnão dá para falar enquanto é imobilizado pela Hyakumonogatari, né?"
51230-137 = "Fique quietinho aí, tá?"
51230-139 = "Sensei...!"
51230-140 = "Ahaha! Essa tragédia é toda, tooooda culpa sua, sabia, Nagusa-chan?"
51230-141 = "Transferir a culpa... está achando que eu estou exagerando...?"
51230-142 = "Aha! Então eu mostro a prova para você!"
51230-144 = "Com o meu livro maldito, o \"Inou Mononokeroku\"—"
51230-160 = "(Tirar nota máxima era obrigação.)"
51230-161 = "(Ser útil aos outros era o mínimo esperado.)"
51230-162 = "(Corresponder às expectativas era um dever.)"
51230-165 = "Meu nome é Kadenokouji Yukari."
51230-166 = "A herdeira da família Kadenokouji, uma das linhagens mais ilustres de Hyakkiyako."
51230-167 = "\"Mantenha-se íntegra como membro da família Kadenokouji.\""
51230-168 = "Essa é a minha missão e o meu dever."
51230-169 = "...Eu sei muito bem disso."
51230-170 = "Sei que é isso que devo fazer."
51230-175 = "Mas..."
51230-176 = "Quando conheci a Nagusa-senpai—"
51230-177 = "Ela foi a primeira pessoa... a me ensinar não o que \"devo fazer\", mas o que \"quero fazer\"."
51230-181 = "Basta que eu entre para o Hyakkaryouran!"
51230-188 = "Não é assim... Yukari."
51230-189 = "Eu não sou a pessoa admirável que você pensa..."
51230-194 = "Eu só... vivi uma mentira muito distante da verdade..."
51230-195 = "Eu só usava uma máscara para enganar a todos..."
51230-200 = "Tudo não passava de mentira..."
51230-211 = "Porque eu estava aqui."
51230-212 = "Para ficar ao lado da Ayame, eu interpretei a \"Nagusa\"... e continuei mentindo..."
51230-213 = "E por causa disso, a Yukari passou a querer entrar no Hyakkaryouran... e então..."
51230-215 = "Isso mesmo, Nagusa-chan. Finalmente percebeu?#nTudo que você tenta alcançar acaba se quebrando, tuuudo."
51230-216 = "Tudo! Tuuudo! Culpa sua!#nA Ayame ter sido engolida pelo Crepúsculo e a Yukari ter virado uma \"Hyakumonogatari\", tuuudo!"
51230-221 = "Porque você, sem saber o seu lugar, insistiu em ficar ao lado da Ayame."
51230-222 = "Uma tragédia causada por tentar atuar sem ter talento para o papel—"
51230-223 = "Grave isso beeem fundo na sua mente, viu?"
51230-225 = "Tudo... foi culpa minha... Porque eu usei uma máscara falsa..."
51230-226 = "Eu estraguei tudo."
51230-227 = "Por minha culpa, tudo..."
51230-229 = "[ns] \"...! ...Na... gusa!\""
51230-230 = "Hmph, vamos prender a Nagusa também."
51230-239 = "[ns] \"...!!!\""
51230-241 = "Ahaha! Sabia de uma coisa?"
51230-242 = "Um coração partido se transforma em \"história de terror\" com muito mais facilidade."
51230-243 = "Eu também vou cuidar de você com muuuito carinho, Nagusa-chan, viu?"
51230-244 = "Ufa..."
51230-245 = "E com isso, caso encerrado."
51230-248 = "Hihi... aha, ahahaha!"
51230-249 = "Sim, sim, já está ótimo assim."
51230-250 = "Se viverem conforme o seu lugar e entenderem isso, ótimo, ótimo, maravilha!"
51230-251 = "Tudo saiu exatamente como eu planejei."
51230-254 = "Xingam-se, hostilizam-se e geram conflito— ingredientes perfeitos."
51230-255 = "Para isso, até o Sensei da Schale foi usado como peça no meu tabuleiro."
51230-259 = "Ah, contemple, Kokuriko-sama... a minha \"Hyakumonogatari\"."
51230-260 = "Vamos, vamos, quebrem-se por completo.#nAmaldiçoem-se, derrubem-se uns aos outros— e no fim, cruzem lâminas até virarem pó."
51230-262 = "Com isso, eu completei a \"Hyakumonogatari\" que vai reduzir Hyakkiyako a cinzas#n— uma beleza sublime, Kokuriko-sama."
51230-266 = "Agora só falta recolher a Sacerdotisa que criou o Katashiro e..."
51230-271 = "[ns] \"...!!!\""
51230-273 = "Quê?!"
51230-282 = "Ora, ora? Espantou a Hyakumonogatari... e olha só para onde está indo..."
51230-283 = "Acha mesmo que salvar a Yukari vai mudar essa situação?"
51230-284 = "—Que ilusão ridícula."
51230-285 = "Eu sei muito bem, viu? Diferente de nós, o Sensei da Schale é uma criatura frágil que desmorona com um único dedo."
51230-287 = "[ns] \"...!\""
51230-292 = "Eu já disse que é inútil!"
51230-298 = "Hããã? Que tolice é essa?"
51230-299 = "Será que... você quebrou de vez?"
51230-300 = "Mesmo que passe por tudo isso para salvar a Yukari, o que diabos pretende fazer?"
51230-302 = "[ns] \"...Haaah!!\""
51230-309 = "...Eu não consigo entender."
51230-310 = "Você também já sabe, não sabe?"
51230-311 = "Foi a Yukari quem criou o \"Katashiro Sem Rosto\" que está destruindo o festival."
51230-312 = "A verdadeira culpada, que odiou vocês, quis queimar tudo e jogar tudo para o alto."
51230-313 = "Isso mesmo, a aluna exemplar do primeiro ano do Hyakkaryouran que você tanto elogiou... nunca existiu desde o início."
51230-314 = "Até a Yukari enganou você em benefício próprio, fingindo ser uma aluna de bom coração."
51230-315 = "Aaah... Mentira em cima de mentira, um bando de mentirosas!"
51230-316 = "Ela nem heroína é... Por que diabos você se arrasta pelo chão só para salvá-la?"
51230-317 = "Por que salvar mentirosas sem valor nenhum—?!"
51230-318 = "[s1] \"...É verdade, talvez elas tenham mentido.\"\n[s2] \"Talvez tivessem medo de mostrar o que realmente sentiam...\"\n[s3] \"E talvez tenham fingido ser boas pessoas.\""
51230-322 = "Sim, sim! Você sabe muito bem, não é?"
51230-323 = "Isso, é tudo mentira! Escondendo o que realmente sentem lá no fundo e empilhando mentiras nojentas—"
51230-324 = "[s] \"...Sim.\""
51230-326 = "[ns] \"Mas... qual o problema nisso?\""
51230-330 = "...Oi?"
51230-331 = "[s4] \"Mentir, fingir estar bem.\"\n[s5] \"Atuar assim... não tem nada de errado.\""
51230-334 = "O que você..."
51230-335 = "[ns] \"No fim das contas...\""
51230-339 = "[ns] \"É algo comum, que todo mundo já fez pelo menos uma vez.\""
51230-341 = ".........Hã?"
51230-348 = "Próximo;Algo Comum"
