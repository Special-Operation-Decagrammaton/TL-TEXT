[translation]
2300802-1 = "Благородная сестра"
2300802-2 = "За собором Тринити"
2300802-3 = "Следуя указаниям Мари, я нашёл её позади собора Тринити."
2300802-4 = "Сюда, Сенсей."
2300802-5 = ""
2300802-8 = ""
2300802-9 = "Я ждала тебя."
2300802-10 = "Знаю, это внезапно, но спасибо, что пришли."
2300802-11 = "А?"
2300802-12 = "Время? А. Простите. Особой причины не было."
2300802-13 = "Просто это был единственный свободный момент у меня сегодня..."
2300802-14 = "[s1] «Прости. Ты, наверное, была очень занята.»\n[s2] «Может, стоило выбрать для встречи менее загруженный день?»"
2300802-15 = "Вовсе нет. Я рада, что вы пришли."
2300802-16 = "Вовсе нет. Я рада, что вы пришли."
2300802-17 = "Я, как обычно, работала в соборе. Ничего особенно напряжённого."
2300802-18 = "Хотите побольше узнать о моей работе?"
2300802-19 = "А. Понятно."
2300802-20 = "Конечно, как у сестры, у меня много обязанностей."
2300802-21 = ""
2300802-23 = ""
2300802-24 = "Но моя самая важная обязанность — выслушивать исповеди людей и сопереживать печалям их сердец."
2300802-25 = "Это немного, но порой всё, что нужно человеку для облегчения, — это кто-то, кто готов его выслушать."
2300802-26 = "Простите? Это похоже на консультацию психолога?"
2300802-27 = "Наверное, чем-то похоже."
2300802-28 = "Конечно, в отличие от консультантов, которые дают советы... я лишь слушаю."
2300802-29 = "Если я могу хоть чем-то помочь, я с радостью уделю этому своё время."
2300802-30 = "Примерно как сейчас, когда я вышла встретиться с вами, Сенсей."
2300802-31 = "Ну а теперь..."
2300802-32 = ""
2300802-34 = ""
2300802-35 = ""
2300802-37 = "Если вы не против, могу я спросить, что вас тревожит, Сенсей?"
2300802-38 = "А?"
2300802-39 = "Вы пришли не из-за какой-то конкретной проблемы? Просто хотели поздороваться...?"
2300802-40 = "О-Ох... П-Простите. Кажется, я сама того не заметив зашла слишком далеко..."
2300802-41 = "Вас это не беспокоит?"
2300802-42 = "Вам становится спокойнее просто от того, что вы видите, как усердно я работаю?"
2300802-43 = ""
2300802-45 = ""
2300802-46 = "Хи-хи."
2300802-47 = "Спасибо, Сенсей."
2300802-48 = "Одних ваших слов достаточно, чтобы усталость за день растаяла."
2300802-49 = "[s3] «Ты точно не слишком себя нагружаешь?»\n[s4] «Может, немного отдохнёшь?»"
2300802-50 = "Хм-м."
2300802-51 = "Хм-м."
2300802-52 = "Спасибо, что говорите так, но, думаю, я не могу. У меня ещё много дел."
2300802-53 = "Конечно, приятно чувствовать любовь верующих, которые приходят в собор, но..."
2300802-54 = "Я тоже хочу продвигаться в Сестринстве и однажды стать достойной сестрой."
2300802-55 = "[s5] «Ты хочешь стать сестрой?»\n[s6] «Разве ты уже не сестра?»"
2300802-56 = "Ну... это немного не то."
2300802-57 = "Ну... это немного не то."
2300802-58 = "Не совсем правильно говорить, что любой, кто носит одеяние сестры, уже является настоящей сестрой."
2300802-59 = "Мне ещё многому нужно научиться и многое узнать."
2300802-60 = "Мне всё ещё неловко, когда меня называют сестрой."
2300802-61 = "Я мечтаю однажды услышать, как кто-то назовёт меня сестрой Мари, и не смутиться."
2300802-62 = "Поэтому я хочу выкладываться во всём, что делаю."
2300802-63 = "А?"
2300802-64 = "Я... кажусь вам взрослой?"
2300802-65 = "У меня уже есть сердце настоящей сестры?"
2300802-66 = "Н-Не дразните меня так! Я лучше всех знаю, что мне ещё очень далеко!"
2300802-67 = "Я-Я сделаю вид, что не слышала этого. Сенсей, ну что вы такое говорите!"
2300802-68 = "[s7] «Ха. Называть тебя сестрой совсем несложно.»\n[s8] «Сестра Мари! Сестра Мари!»"
2300802-69 = "П-Прекратите...! Пожалуйста, прекратите!"
2300802-70 = "П-Прекратите...! Пожалуйста, прекратите!"
2300802-71 = "[s] «Сестра Мари!»"
2300802-72 = "П-Прекратите!"
2300802-73 = ""
2300802-78 = "...?!"
2300802-83 = ""
2300802-84 = "С-Сенсей?"
2300802-85 = ""
2300802-88 = ""
2300802-89 = "Вы в порядке?! Сенсей?!"
2300802-91 = "(К счастью, я не получил серьёзных травм. Через некоторое время я очнулся и вернулся в Шале.)"
