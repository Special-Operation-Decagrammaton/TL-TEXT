[translation]
1006906-1 = "На пару"
1006906-2 = "Я бодрым шагом вернулся на Променад Чёрной Черепахи."
1006906-3 = ""
1006906-6 = "Променад Чёрной Черепахи"
1006906-7 = ""
1006906-8 = "Вы рано, Сенсей."
1006906-9 = "Вообще-то очень вовремя. Мы как раз собирались ставить пельмени на пару."
1006906-10 = "Я так рада, что вы пришли. Боялась, что для вас это слишком рано..."
1006906-11 = "Ну что ж... Начнём?"
1006906-12 = "Все! Разжигайте пароварки!"
1006906-14 = ""
1006906-18 = "По команде Руми воздух заполнили клубы пара."
1006906-20 = "Впечатляет, правда?"
1006906-21 = "Когда мы готовим пельмени на пару, кухня почти превращается в сауну."
1006906-22 = "[s1] «Это... слишком...»\n[s2] «А нельзя просто подождать снаружи, пока всё готовится?»"
1006906-25 = "Поверьте, я бы с радостью вышла..."
1006906-26 = "Но мне нужно следить за пароварками."
1006906-27 = "Если жара слишком много — пельмени лопнут, а если мало — не приготовятся как следует."
1006906-28 = "Вы можете наблюдать из дверей, Сенсей. А я останусь здесь."
1006906-30 = ""
1006906-32 = "Как и предложила Руми, я встал у двери..."
1006906-33 = ""
1006906-35 = ""
1006906-37 = "[ns] «Эм... Руми?»"
1006906-38 = "Что такое, Сенсей? Что-то не так?"
1006906-41 = "― [log=루미]А-а... Посмотрите-ка. Одежда стала немного... прозрачной.[/log][wa:2080]"
1006906-44 = "― [log=루미]О, не переживайте. Немного пара меня не убьёт.[/log][wa:1080]"
1006906-47 = "― [log=루미]...Если бы я знала, что так получится,[/log][wa:30]"
1006906-49 = "― [log=루미]я бы надела бельё посимпатичнее.[/log][wa:10]"
1006906-52 = "― [log=루미]Даже немного обидно, знаете?[/log][wa:940]"
1006906-55 = "― [log=루미]Ха-ха! Вам не обязательно отворачиваться.[/log][wa:1020]"
1006906-57 = "― [log=루미]Я совсем не против.[/log][wa:1140]"
1006906-60 = "― [log=루미]Не знала, что у вас есть такая сторона, Сенсей...[/log][wa:1070]"
1006906-62 = "― [log=루미]Ха-ха! Мне нравится![/log][wa:1240]"
1006906-65 = "― [log=루미]Такое ведь нечасто случается, так что...[/log][wa:10]"
1006906-67 = "― [log=루미]может, мне заставить вас смутиться ещё сильнее...?[/log][wa:10]"
1006906-70 = "Фух, хорошо. Пельмени готовы."
1006906-71 = "Я приготовила много, так что попробуйте."
1006906-72 = ""
1006906-74 = ""
1006906-75 = ""
1006906-76 = ""
1006906-78 = "[ns3] «Р-Руми?!»\n[ns4] «Э-Этот пельмень...!»"
1006906-81 = "Хм? Что такое?"
1006906-82 = "Понимаете, недавно в Тринити я попробовала штуку под названием «пирог с сардинами», и он оказался довольно вкусным."
1006906-83 = "Вот я и решила попробовать сделать пельмень с сардиной!"
1006906-84 = "Оказывается, точный рецепт пирога — что-то вроде секрета Тринити..."
1006906-85 = "Я приготовила это специально для вас, так что, пожалуйста, угощайтесь!"
1006906-87 = ""
1006906-90 = "[ns5] «*кхе* *кхе*...!»\n[ns6] «Я ценю старания, но...»"
1006906-94 = "Что-то не так? Говорят, рецепт как-то связан с историей и традициями Тринити..."
1006906-95 = "Ну же, всего один кусочек! Вы знаете, как трудно придать пельменю такую форму?"
1006906-96 = ""
1006906-98 = "[ns] «...Похоже, выбора у меня нет!»"
1006906-100 = "С опаской я взял пельмень с сардиной..."
1006906-101 = "Я дрожал, представляя невообразимый ужас, который вот-вот обрушится на мои вкусовые рецепторы, но..."
1006906-102 = ""
1006906-106 = "На самом деле всё оказалось не так уж плохо."
