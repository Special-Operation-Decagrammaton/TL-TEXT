[translation]
1011808-1 = "Неожиданная сторона"
1011808-2 = "Нозоми позвала меня на выездное обследование участка для строительства железной дороги."
1011808-4 = "Доброе утро!"
1011808-5 = "[s] «Доброе утро, Нозоми!»"
1011808-6 = "Спасибо, что пришёл! Пахьяхья!"
1011808-7 = "Вообще-то это работа на двоих, но в итоге я осталась одна."
1011808-8 = "А одной скучно, понимаешь?"
1011808-9 = "[s1] «Фуфу...»\n[s2] «А я как раз тоже скучал!»"
1011808-12 = "Пахьяхья! Тогда отлично!"
1011808-13 = "Ладно, пойдём повеселимся..."
1011808-14 = "...то есть поработаем!"
1011808-15 = "[s] «Сейчас прозвучало так, будто ты сказала именно то, что хотела.»"
1011808-17 = "Так! Вот первое, что надо проверить."
1011808-18 = "[s] «А что именно я проверяю?»"
1011808-19 = "Нужно просто убедиться, что этот письменный отчёт соответствует действительности. Всё просто, да?"
1011808-20 = "Предварительное технико-экономическое исследование. CCC проводит обследование до начала строительства."
1011808-21 = "Например, это место на первом обследовании одобрили для прокладки новой железнодорожной линии."
1011808-22 = "Если построить здесь экспресс-линию, она соединится с районом D.U. Это упростит процесс распределения финансирования."
1011808-23 = "[s] «Нозоми...»"
1011808-24 = "Что? Чего ты так смотришь?"
1011808-25 = "[s] «Ты сейчас выглядишь такой компетентной, знаешь?»"
1011808-26 = "Хех, я же не ВСЕГДА валяю дурака."
1011808-27 = "..."
1011808-28 = "Пф..."
1011808-29 = "Пф-ф! Пахьяхья!"
1011808-30 = ""
1011808-33 = "Сенсей, у тебя такое смешное лицо!"
1011808-34 = "Неужели ты правда поверил, что я хоть слово из этого понимаю?!"
1011808-35 = "Я просто прочитала всё прямо из отчёта!"
1011808-36 = "[s] «Да, я так и подумал.»"
1011808-37 = "Фуфуфу... Ну, знаешь, когда имеешь дело с начальством, нужно хотя бы ВЫГЛЯДЕТЬ так, будто понимаешь, о чём говоришь."
1011808-38 = "А всей этой сложной ерундой пусть занимается кто-нибудь другой. Я просто вожу поезда."
1011808-39 = "Хотя сейчас я звучала довольно убедительно, правда?"
1011808-40 = "Сегодня опять выездное обследование, так что можем ещё немного повалять дурака. Считай это сменой обстановки."
1011808-41 = "[s3] «Э-Это точно нормально?»\n[s4] «Разве это не важная работа?!»"
1011808-44 = "Знаешь, даже если мы отнесёмся к этому серьёзно и распишем все свои мнения, ничего не изменится."
1011808-45 = "В Хайлендере несколько фракций. Если одна сторона говорит: «делайте так,» другая почти всегда отвечает: «нет, делайте иначе.»"
1011808-46 = "Мне здесь достаточно просто сделать вид, что работа выполнена."
1011808-47 = "[s] «Всё же сомневаюсь, что так можно...»"
1011808-48 = "Ну, до сих пор это работало."
1011808-49 = "Большинство студентов заняты обслуживанием и эксплуатацией."
1011808-50 = "Пока каждая делает свою работу, всё нормально."
1011808-51 = "Хотя... если бы я могла, я бы просто проложила рельсы по всему Кивотосу и не возилась с бумажками."
1011808-52 = "Тогда я смогла бы ездить куда захочу."
1011808-53 = "В парки, раменные, на крыши..."
1011808-54 = ""
1011808-56 = ""
1011808-57 = "...У тебя такой вид, будто хочешь что-то сказать. Пахьяхья!"
1011808-58 = "Кстати о фракциях: думаю, ты можешь меня понять, да, Сенсей?"
1011808-59 = "[s] «Хм? Что ты имеешь в виду?»"
1011808-60 = "Ну, Шале тоже работает со множеством разных академий."
1011808-61 = "Тебе приходится учитывать их нужды, желания... Наверное, всё это довольно сложно."
1011808-62 = "[s5] «Моя роль — слушать студентов и направлять их.»\n[s6] «Я стараюсь не вмешивать сюда политику.»"
1011808-65 = "Хм-м."
1011808-66 = "Значит, ты относишься ко всем студентам одинаково честно?"
1011808-67 = "[s] «Да. Я обязан.»"
1011808-68 = ""
1011808-70 = ""
1011808-71 = "Ну..."
1011808-72 = "...тогда по отношению ко мне это нечестно! Пахьяхья!"
1011808-73 = "[s7] «Вообще-то соблюдать баланс непросто.»\n[s8] «Я всё ещё учусь по ходу дела.»"
1011808-76 = ""
1011808-79 = "[ns9] «Но прямо сейчас передо мной именно ты.»\n[ns10] «И прямо сейчас ты важнее всех для меня.»"
1011808-82 = "Пф-ф, чего это ты вдруг такое говоришь? Пахьяхья! Смешной ты!"
1011808-83 = "Ага, значит, всё ещё учишься по ходу дела, да?"
1011808-84 = ""
1011808-86 = ""
1011808-87 = "Ну, раз ты сам сказал..."
1011808-88 = ""
1011808-90 = ""
1011808-91 = ""
1011808-92 = "Сегодня я заставлю тебя заботиться обо мне больше всех! Давай, скорее!"
1011808-94 = "Так я и провёл весь день, следуя за Нозоми."
1011808-96 = ""
1011808-98 = ""
1011808-100 = ""
1011808-102 = "Несмотря на все её шуточки, обследование она проводила очень старательно."
