[translation]
1600806-1 = "Доброта ленивого полицейского"
1600806-2 = "Закончив некоторые дела в Полицейской школе «Валькирия», я заглянул в офис Бюро общественной безопасности проверить Фубуки."
1600806-4 = "Офис Бюро общественной безопасности"
1600806-5 = "Я же говорю, это не наша обязанность."
1600806-6 = "Но вы сказали обращаться в Бюро общественной безопасности, когда у меня проблемы."
1600806-7 = "Я знаю, это может казаться пустяком, но для меня это очень важно!"
1600806-8 = "Я понимаю, о чём ты, но это как-то..."
1600806-9 = "Пожалуйста, ПОЖАЛУЙСТА, помогите мне. Такой заколки больше нигде в мире нет."
1600806-10 = "Бабушка сделала её мне на день рождения. Её ничем не заменить!"
1600806-11 = "Работа с потерянными вещами ДЕЙСТВИТЕЛЬНО входит в обязанности Бюро общественной безопасности, но это не то же самое, что выходить и разыскивать каждую пропажу."
1600806-12 = "И где ты вообще потеряла заколку?"
1600806-13 = "Клянусь, когда я вышла из дома, она была в волосах... но к моменту, когда я добралась до школы, её уже не было."
1600806-14 = "Наверное, она выпала по дороге."
1600806-15 = "Понимаю, что ты расстроена, но зона поиска всё равно слишком большая.#nМы не можем искать вещь, когда ты понятия не имеешь, где она могла потеряться."
1600806-16 = "У нас и так не хватает людей. Мы не можем назначать кадетов на такие дела."
1600806-17 = "Вы серьёзно?! Да вы в Бюро общественной безопасности целыми днями только спите!"
1600806-18 = "И говорите, что у вас нет времени искать мою заколку? Это нечестно!"
1600806-19 = "Хмф. Ладно, насчёт сна ты меня поймала... но!#nЯ серьёзно говорю, что мы не можем надолго покидать офис.#nНам нужно оставаться наготове на случай чрезвычайной ситуации."
1600806-20 = "Я могу лишь пообещать, что мы позвоним, если найдётся что-то подходящее под описание твоей заколки. Оставишь номер?"
1600806-21 = "Полиция вообще бесполезна!"
1600806-22 = ""
1600806-26 = ""
1600806-27 = "*вздох* Снова гражданские меня отчитали."
1600806-28 = "Сенсей? Вы всё это время здесь стояли?"
1600806-29 = "[s] «Я видел почти всё.»"
1600806-30 = "Хаха... ха. Неловко вышло."
1600806-31 = "Не переживайте. При работе с жалобами граждан такое происходит постоянно."
1600806-32 = "Нас просят искать потерянные вещи, открывать запертые двери,#nразыскивать пропавших собак... Список можно продолжать бесконечно."
1600806-33 = "[s] «Ты не можешь помочь найти заколку?»"
1600806-34 = "Может, и смогла бы, если бы она точно знала, где её обронила.#nНо у меня нет времени обыскивать весь её путь от дома до школы."
1600806-35 = "Чтобы проверить такую огромную территорию, уйдёт весь день."
1600806-36 = "К тому же это скользкая дорожка. Стоит сделать одно-два исключения для таких просьб, и когда об этом узнают, нас завалят похожими запросами.#nПоэтому лучше сразу отказывать."
1600806-37 = "[s1] «Я понимаю, но всё же...»\n[s2] «Мне показалось, ты говорила довольно холодно.»"
1600806-38 = "..."
1600806-39 = "Даже мне иногда приходится быть профессионалом. Полиция не должна поддаваться на эмоциональные просьбы!"
1600806-40 = "..."
1600806-41 = "А, точно. Я только что вспомнила, что у меня закончились пончики."
1600806-42 = "Можете присмотреть здесь за всем, пока я схожу за новыми?#nВернусь до начала следующей смены. Если кто-то придёт, скажите им что-нибудь."
1600806-43 = "[s] «Я думал, ты серьёзно говорила, что должна оставаться наготове?!»"
1600806-44 = "К-Кирино или другой студент сможет со всем разобраться..."
1600806-45 = "Покупка пончиков — важная часть работы Бюро общественной безопасности!"
1600806-46 = "В любом случае я скоро вернусь. Рассчитываю на вас!"
1600806-47 = ""
1600806-49 = ""
1600806-55 = "Прошло некоторое время, но Фубуки так и не вернулась к началу своей следующей смены."
1600806-56 = "[ns] Найти Фубуки."
1600806-59 = "Рядом с государственной начальной школой D.U."
1600806-61 = ""
1600806-62 = "Я нашёл Фубуки, роющуюся в кустах у тротуара неподалёку от начальной школы."
1600806-63 = ""
1600806-65 = ""
1600806-66 = ""
1600806-67 = "Хм. Нет, это всего лишь открывалка для бутылок."
1600806-68 = ""
1600806-69 = "И это тоже не то."
1600806-70 = "[s] «Что ты делаешь?»"
1600806-71 = "С-Сенсей?! Что вы здесь делаете?"
1600806-72 = "О. Вы пошли меня искать, потому что я не вернулась вовремя к смене."
1600806-73 = "Простите. В магазине пончиков была ужасно длинная очередь."
1600806-74 = "А потом, по дороге обратно, я... уронила здесь пончик. Да, именно так."
1600806-75 = "Уверена, он где-то здесь, но никак не могу найти."
1600806-76 = "[s] «Помочь?»"
1600806-77 = "Нет-нет. Вам не нужно. Потому что я..."
1600806-78 = ""
1600806-79 = "Ой, кого я обманываю? Вам я врать не могу."
1600806-80 = "Я знаю, что говорила, будто не должна заниматься такими вещами,#nно ничего не смогла с собой поделать. Каждый день видеть беспомощных людей выматывает."
1600806-81 = "Даже пончики не способны перебить этот неприятный привкус."
1600806-82 = "Нет, погодите — забудьте. Я хотела сказать, что просто отлыниваю от работы, чтобы спокойно есть пончики. Не поймите неправильно!"
1600806-83 = "[s] «Я помогу поискать.»"
1600806-84 = "А? Почему?"
1600806-85 = "[s] «Скажем так, мне захотелось пончиков.»"
1600806-86 = ""
1600806-88 = ""
1600806-89 = "Ну ладно. Пончики — важная часть сбалансированного рациона полицейского.#nНельзя слишком долго себе отказывать."
1600806-90 = "Вы берите левую сторону, а я поищу справа."
1600806-93 = "Некоторое время спустя..."
1600806-94 = ""
1600806-96 = ""
1600806-97 = ""
1600806-98 = "Нашла! Я нашла заколку, которую потеряла та девочка!"
1600806-99 = "Это заняло гораздо меньше времени, чем я думала.#nСпасибо за помощь."
1600806-100 = "Теперь можем вернуться и сказать, что кто-то её сдал.#nОна будет рада получить заколку обратно."
1600806-101 = "[s] «Почему не сказать, что именно ты её нашла?»"
1600806-102 = "Зачем мне это делать?"
1600806-103 = "Если станет известно, что я специально выхожу помогать людям с такими делами, на меня постоянно будут сваливать подобную работу. Мне и так хватает дел."
1600806-104 = "Я лишь хочу расслабиться и наслаждаться пончиками."
1600806-105 = "[s] «Может, по дороге обратно купим пончиков?»"
1600806-106 = "Звучит отлично! Вы угощаете?"
1600806-107 = "[s3] «Конечно.»\n[s4] «В награду за такую усердную работу.»"
1600806-108 = "Sweet! I'll take a box of glazed ones from Master Donuts!"
1600806-109 = "Sweet! I'll take a box of glazed ones from Master Donuts!"
1600806-110 = "Рада, что мы со всем разобрались. Пончики всегда вкусные,#nно нет ничего вкуснее БЕСПЛАТНЫХ пончиков!"
1600806-112 = "Мы с Фубуки вернулись в офис и убедились, что заколка вернулась к владелице. После этого мы вместе наслаждались пончиками."
