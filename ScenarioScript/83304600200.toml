83304600200-5 = ""
83304600200-6 = ""
83304600200-9 = "Префектурная команда! Стоять!"
83304600200-10 = ""
83304600200-14 = ""
83304600200-15 = ""
83304600200-16 = "...Макото? В чём проблема?"
83304600200-17 = "Это я должна спросить! Что вы здесь делаете?"
83304600200-18 = "Мы только что закончили антитеррористические учения и возвращались в штаб, председатель Макото."
83304600200-19 = "Закончили? Возвращаетесь? Уже?"
83304600200-20 = "...Что значит «уже»?"
83304600200-21 = "Этого недостаточно! Совершенно недостаточно!"
83304600200-22 = "Сейчас не праздничные выходные!"
83304600200-24 = "..."
83304600200-25 = "Вы вообще понимаете, насколько важна предстоящая Вечеринка Геенны?"
83304600200-26 = "Невозможно предугадать, какие неприятности могут возникнуть на таком мероприятии!"
83304600200-27 = "Поэтому, чтобы компенсировать вашу недальновидность, вы обязаны как следует подготовиться тренировками!"
83304600200-28 = "А значит, этих жалких учений мало! Вы должны тренироваться вдвое, нет, втрое дольше обычного!"
83304600200-29 = "Из-за вашей недостаточной подготовки наша Ибуки пострадала! Я больше никогда не позволю случиться подобной трагедии!"
83304600200-30 = "Что за чушь?!"
83304600200-31 = "Во-первых, Ибуки пострадала только из-за тебя...!"
83304600200-32 = "Хватит искать виноватых! Властью, данной мне Обществом Пандемониума, приказываю продлить тренировку!"
83304600200-34 = "Хорошо."
83304600200-35 = "Г-глава префектов?!"
83304600200-36 = "Я не собираюсь тратить время на спор об этом."
83304600200-37 = "Мы продолжим тренировку с повышенной интенсивностью, как ты и требуешь."
83304600200-38 = "Ха! Так бы сразу и сказала—"
83304600200-39 = "Но только это. И если ты пожалуется ещё хоть на что-нибудь..."
83304600200-40 = ""
83304600200-42 = ""
83304600200-44 = ""
83304600200-45 = "Мы с тобой поговорим лично."
83304600200-46 = "Т-тц! Л-ладно, д-делай как хочешь! Только не разочаруй Великую Макото!"
