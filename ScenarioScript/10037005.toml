[translation]
10037005-1 = "Пролог;Письмо из далёких краёв"
10037005-4 = "Ранее в Blue Archive..."
10037005-8 = "(Десятитысячелетний женьшень — фирменный товар Шаньхайцзина — тайно вывозили куда-то за пределы кампуса.)"
10037005-9 = "Есть растение, которое растёт только в Шаньхайцзине. Десятитысячелетний женьшень."
10037005-10 = "Поскольку выращивать его невероятно трудно, его распространение и использование строго контролируются. А экспорт женьшеня запрещён."
10037005-11 = "Но по слухам, Променад Чёрной Черепахи контрабандой вывозит десятитысячелетний женьшень за пределы академии."
10037005-14 = "(Аналог студенческого совета в Шаньхайцзине называется Генрюмон. Его глава, Рюгэ Кисаки, назвала виновником Променад Чёрной Черепахи.)"
10037005-15 = "Десятитысячелетний женьшень редок даже в Шаньхайцзине. Никто не может собирать его без нашего разрешения."
10037005-16 = "Чтобы столь редкий продукт отправляли за пределы Шаньхайцзина без нашего прямого разрешения... Немыслимо."
10037005-17 = "Генрюмон не может оставить это безнаказанным. Променад Чёрной Черепахи должен ответить."
10037005-20 = "(Глава Променада Чёрной Черепахи, Акэширо Руми, попросила помощи у Сенсея из Шале, чтобы доказать невиновность Променада.)"
10037005-21 = "У меня есть, скажем так... просьба. Или заказ."
10037005-22 = "Променаду Чёрной Черепахи нужна ваша помощь."
10037005-25 = "(Однако выяснилось, что контрабандой десятитысячелетнего женьшеня занималась не кто иная, как офицер самого Генрюмона!)"
10037005-26 = "Мне нужна была твоя должность. А чтобы её получить, нужны были деньги."
10037005-27 = "Я услышала о ком-то за пределами Шаньхайцзина, кто хотел заполучить десятитысячелетний женьшень."
10037005-29 = "(Чужаком, купившим незаконный женьшень у офицера Генрюмона, оказалась изгнанница из Шаньхайцзина, которую выгнали за распространение запрещённых лекарств и эликсиров.)"
10037005-30 = "(Это была не кто иная, как одна из Семерых Заключённых — Шинтани Кай.)"
10037005-31 = ""
10037005-33 = "Неважно. Я уже собрала достаточно женьшеня, чтобы закончить своё последнее зелье."
10037005-34 = "И всё же жаль, что не удалось собрать больше данных."
10037005-41 = ""
10037005-42 = "Хр-р... Хр-р..."
10037005-43 = "Нет, Томоэ, нельзя... Если построить плотину на пудинговой реке, поток пудинга остановится, и никто не сможет его есть..."
10037005-44 = "Ммф... Но кастелла, клубничное молоко и банановые эклеры..."
10037005-45 = ""
10037005-48 = "Черино? Ты всё ещё спишь?"
10037005-49 = "Хр-р... Хр-р..."
10037005-50 = "Ха-ха! Когда она спит, она всегда такая милая."
10037005-51 = ""
10037005-53 = ""
10037005-54 = "Пора вставать, Черино."
10037005-55 = ""
10037005-57 = ""
10037005-58 = ""
10037005-59 = "А...? Томоэ...? Что такое? Я же говорила не будить меня во время дневного сна..."
10037005-60 = "Боюсь, отведённое на сон время уже закончилось."
10037005-61 = "Что? Уже? Угх..."
10037005-62 = "Ладно. Тогда сегодня я продлеваю дневной сон. Разбуди меня через пять минут, Томоэ..."
10037005-63 = "Но, Черино — то есть, Великий Вождь Черино, — мы только что получили очень важные документы, предназначенные исключительно для ваших глаз."
10037005-64 = "Документы...? Разберись с ними сама, Томоэ... Если только это не очередная попытка государственного переворота?"
10037005-65 = "Не совсем. Мы получили послание от студенческого совета Академии Шаньхайцзин."
10037005-66 = "Академия Шаньхайцзин...?"
10037005-72 = "О. Наверное, это просьба провести встречу по обмену."
10037005-73 = "Я разрешаю. Отличная возможность продемонстрировать моё великодушие!"
10037005-74 = "Полагаю, студентам Шаньхайцзина будет непросто проделать весь путь до Красной Зимы."
10037005-75 = "Напротив, Великий Вождь Черино. Это... нас пригласили к ним."
10037005-76 = "Что? Ты хочешь сказать, нам придётся покинуть Красную Зиму и ехать в Шаньхайцзин?"
10037005-77 = "Думаю, да."
10037005-78 = "Какая морока..."
10037005-79 = "Посмотри на это иначе, Черино. Отличный повод отправиться в путешествие."
10037005-80 = "В-В путешествие?!"
10037005-81 = "П-Понятно! Я всё поняла. Хорошо! Я лично приму это приглашение и позабочусь, чтобы встреча по обмену с Шаньхайцзином прошла с оглушительным успехом!"
10037005-82 = "Иного я и не ожидала от нашего великого вождя. Не сомневаюсь, что ваш величественный облик станет примером для всех нас."
10037005-83 = "Разумеется! В конце концов, я президент студенческого совета Красной Зимы, Главный инспектор по благоустройству, Главный секретарь, Начальник санитарной службы, Капитан спортивного клуба, Глава всех старост, Начальник санитарной службы и Знаток столового питания."
10037005-85 = "А совсем недавно меня ещё и выбрали лучшим пудинговым гурманом месяца и даже директором производства кастеллы!"
10037005-86 = "Как скажете, Великий Вождь Черино!"
10037005-88 = "Хм, но... Томоэ, у меня есть вопрос."
10037005-89 = "Что такое?"
10037005-90 = ""
10037005-92 = ""
10037005-93 = "Это место... Шаньхайцзин. Где оно вообще находится?"
10037005-94 = ""
10037005-96 = ""
10037005-98 = ""
