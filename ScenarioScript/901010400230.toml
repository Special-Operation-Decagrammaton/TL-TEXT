901010400230-6 = ""
901010400230-7 = "Aqui é a FOX1. FOX2, relate o andamento da missão."
901010400230-8 = "Aqui é a FOX2. Como o pessoal aqui é bem desconfiado, tô priorizando criar um clima de simpatia primeiro."
901010400230-9 = "Sondei casualmente sobre o \"Caranguejo de Tambor de Óleo\", mas ninguém nunca ouviu falar."
901010400230-10 = "Existe a possibilidade de estarem fingindo ignorância?"
901010400230-11 = "Alguém pode até estar mentindo, mas... #npros trabalhadores daqui, colocar caranguejo em tambor é uma aberração técnica sem lógica."
901010400230-12 = "Se a intenção do boato fosse aterrorizar a comunidade portuária, teriam bolado uma ameaça mais verossímil."
901010400230-13 = "Exato. Qualquer um com o mínimo de noção de pesca descartaria esse rumor na hora."
901010400230-15 = "Sendo assim, encerramos as averiguações por hoje?"
901010400230-16 = "Hum... como ainda temos tempo na luz do dia, que tal eu dar uma passada na zona comercial?"
901010400230-18 = "FOX3 de acordo. O vento hoje tá fresquinho, dá pra aguentar a posição sem cansar."
901010400230-19 = "FOX4 sem objeções. Continuo vigiando o cais de olho em qualquer movimentação suspeita."
901010400230-21 = "Muito bem. FOX2, avance para o Ponto Charlie e dê prosseguimento à operação."
901010400230-22 = "FOX2, entendido!"
