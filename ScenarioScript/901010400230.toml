[translation]
901010400230-6 = ""
901010400230-7 = "Говорит FOX 1. FOX 2, запрашиваю доклад."
901010400230-8 = "Говорит FOX 2. Цели очень насторожены, поэтому сейчас я в первую очередь выстраиваю доверие."
901010400230-9 = "Я между делом упоминала историю о крабах в бочке, но местные, похоже, её не знают."
901010400230-10 = "Прикидываются?"
901010400230-11 = "Это всегда возможно, но большинство сотрудников порта считали, что класть крабов в бочку бессмысленно."
901010400230-12 = "То есть если преступник хотел запугать местных... ему стоило придумать историю получше."
901010400230-13 = "Очень точное наблюдение. Эти люди слишком хорошо разбираются в теме. Они бы никогда не стали распространять слух о крабах из бочки, потому что знают, что он нелепый."
901010400230-15 = "На этом сегодняшнее расследование окончено?"
901010400230-16 = "Хмм... Думаю ещё поспрашивать в промышленном районе. Время есть."
901010400230-18 = "FOX 3 возражений не имеет. Тут приятный ветерок. Я ещё немного выдержу."
901010400230-19 = "FOX 4 тоже без возражений. Продолжу наблюдать за портом."
901010400230-21 = "Принято. FOX 2, переместись в точку Чарли и продолжай миссию там."
901010400230-22 = "FOX 2, принято."
