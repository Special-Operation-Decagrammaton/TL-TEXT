[translation]
33250-1 = "Эпизод 25;Эпилог"
33250-2 = "А-а-а-а-а! Как они посмели выставить меня дурой?!"
33250-3 = "Ироха! Где ты?! Готовь сама-знаешь-что! Мы не можем просто это проглотить!"
33250-4 = "Нет, я не знаю что. В любом случае вам нужно больше отдыхать."
33250-5 = "Кроме того, мы так долго были без сознания, что конфликт уже разрешился. И, пожалуйста, сначала приведите волосы в порядок, а потом открывайте рот."
33250-6 = "Что ты сказала? Что не так с моими волосами...?"
33250-7 = "НЕ-Е-ЕТ! КТО ЭТО СДЕЛАЛ С МОИМИ ВОЛОСАМИ?!"
33250-8 = "Вы не помните, как мы рухнули в огненном шаре? Наверное, тогда... *вздох* Неважно."
33250-10 = "Как вы себя чувствуете, госпожа Нагиса?"
33250-11 = "Мне казалось, мой нимб сейчас расколется, но теперь я просто благодарна, что жива."
33250-12 = "Мы тоже. Пожалуйста, не торопитесь с восстановлением."
33250-13 = "Спасибо... но вы пришли только ради этого?"
33250-14 = "Нет... Вообще-то я должна была передать это письмо. Оно от госпожи Мики."
33250-15 = "Что там написано?"
33250-16 = "Эм, ну..."
33250-18 = "Привет, Наги! Слышала, ты отключилась наглухо после попадания ракеты!"
33250-19 = "Пока ты дрыхла, столько всего произошло. Не думаешь, что хозяйке стоит подавать пример получше?"
33250-20 = "Я знаю, что постоянно говорю тебе меньше работать и больше отдыхать, но не думала, что ты воспримешь это НАСТОЛЬКО буквально! Пора просыпаться, спящая красавица."
33250-21 = "Кстати, раз ты уже проснулась, можно попросить об услуге? Вставай с кровати и возвращайся к делам. Работы полно."
33250-22 = "Во-первых, в комнате заключения есть только обычные эфирные каналы! Представляешь? Подключи мне кабельное, чтобы я могла смотреть любимые передачи круглосуточно!"
33250-23 = "А ещё у меня закончился любимый увлажняющий крем. Он продаётся всего в нескольких местах, так что будь лапочкой и купи мне? Потом пришлю адрес!"
33250-24 = "О! И фен почти перестал нормально работать. Купишь новый? Самый топовый, пожалуйста!"
33250-25 = "Возьми такой же, как у тебя! Ну тот, БЕЗУМНО дорогой!"
33250-26 = "А ещё, ещё...!"
33250-27 = ""
33250-28 = "..."
33250-29 = "Как вы хотите, чтобы мы... ответили на её просьбы? Похоже, она не очень серьёзно относится к своему заключению."
33250-30 = "Отныне кормите её только рулетами."
33250-31 = "Р-Рулетами?!"
