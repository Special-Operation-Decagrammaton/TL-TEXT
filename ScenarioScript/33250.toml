33250-93 = "«...дел всё ещё полно».#nВерно?"
33250-94 = "С-Сэя...?"
33250-95 = "Ого! Откуда ты взялась?!"
33250-97 = "Рада снова видеть вас обеих."
33250-98 = "Давненько Чаепитие не собиралось полным составом."
33250-99 = "Нам многое нужно наверстать..."
33250-100 = "...и не думаю, что этот разговор можно дальше откладывать."
33250-101 = "Пора поделиться тем, чем мы никогда раньше не делились — и не могли."
33250-102 = "И тем, что всегда хотели сказать друг другу."
33250-103 = "Недоразумения неизбежны. Нам придётся просто верить друг другу, даже если мы никогда не сможем точно знать, о чём думает другая. Настоящий парадокс."
33250-104 = "У нас нет выбора, кроме как двигаться сквозь тьму, помня об этом. Таково наше задание."
33250-105 = ""
33250-107 = ""
33250-108 = "..."
33250-109 = "Ох, Сэя. Ты говоришь так зловеще! Именно из-за этих больших философских речей у тебя так мало друзей, знаешь?"
33250-110 = "..."
33250-111 = "Наоборот. Возможно, у тебя самой было бы больше друзей, если бы ты заполнила пустую голову хоть каплей культуры и утончённости."
33250-112 = "У-Успокойтесь вы обе..."
33250-114 = "[ns] «Итак... первоначальный Клуб дополнительных занятий сдал экзамены и распустился...»"
33250-116 = "[ns] «...а теперь я здесь, чтобы консультировать НОВЫЙ Клуб дополнительных занятий.»"
33250-117 = "..."
33250-118 = "..."
33250-119 = "..."
33250-120 = "..."
33250-121 = "[ns] «ПОЧЕМУ В НЁМ ВСЁ ТЕ ЖЕ УЧАСТНИЦЫ?!»"
33250-123 = "Х-Ха-ха... Ну, понимаете..."
33250-124 = "...я сходила на концерт Пероро и как-то забыла, что на следующий день экзамен."
33250-125 = "Мы были так заняты, что я забыла подготовиться к следующему экзамену."
33250-126 = "Эм, а я немного переоценила себя и попыталась записаться на курс третьего года, и... ну да."
33250-127 = "А я не могла позволить им всем снова вступить в клуб без меня, поэтому специально завалила ещё один экзамен. ♥"
33250-128 = "П-Простите, Сенсей. Мы правда вас подвели..."
33250-129 = "Н-Но хотя бы в этот раз нас не исключат, и экзамены должны быть нормальными!"
33250-130 = "[ns] Упасть в обморок."
33250-132 = "С-Сенсей?!"
33250-133 = "Сенсей!"
33250-134 = "Ч-Что за... Вам не кажется, что вы немного перегибаете с реакцией?!"
33250-135 = "О боже. Вам действительно идёт лежать на спине, Сенсей."
33250-136 = "Прекратить! Хватит пользоваться ситуацией, извращенка!"
33250-137 = "СМЕРТНАЯ КАЗНЬ!"
33250-144 = "Азуса..."
33250-145 = "Я надеюсь, что ты и твои друзья продолжите учиться и расти вместе."
33250-146 = "Продолжите стремиться к светлому будущему."
33250-147 = "Я знаю, что так и будет, потому что ты сильная."
33250-148 = "Даже в тёмном мире, где всё тщетно."
33250-149 = "Даже если окажешься в самой безысходной глубине."
33250-150 = "Азуса..."
33250-151 = "Я начинаю понимать твою историю о цветке."
33250-152 = "Здесь наши пути расходятся..."
33250-153 = "...но я искренне надеюсь, что ты найдёшь счастье."
33250-154 = ""
33250-166 = "Понятно."
33250-167 = "Значит, носительница королевской крови решила бежать."
33250-168 = "Этого нельзя допустить. Захватите Ацуко и верните её. Проследите, чтобы она не пострадала."
33250-169 = "Остальные расходный материал."
33250-170 = "Именно. Можете спокойно разбить их нимбы."
