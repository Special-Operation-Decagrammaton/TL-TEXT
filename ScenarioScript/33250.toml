[translation]
33250-1 = "Episódio 25;Epílogo"
33250-2 = "Como ousam... como ousam enganar a grande Makoto-samaaaaaaaa!!!"
33250-3 = "Iroha, cadê a Iroha?! Prepare AQUILO agora mesmo! Como se eu fosse deixar barato depois de apanhar assim...!"
33250-4 = "Mesmo que a senhora diga \"aquilo\", eu não faço a menor ideia do que esteja falando, mas acho melhor continuar deitada mais um pouco."
33250-5 = "Além disso, se for falar alguma coisa, por favor dê um jeito nessa sua cabeça engraçada primeiro. Pra começo de conversa, quase tudo já foi resolvido."
33250-6 = "Como é que é...? Cabeça?"
33250-7 = "M-Mas o que é issooooooo?!"
33250-8 = "Bem, é que naquela hora você ficou envolta em chamas... *Suspiro*."
33250-10 = "...Como está se sentindo, Nagisa-sama?"
33250-11 = "Pensei que meu halo fosse se estilhaçar... mas, ao que parece, estou a salvo."
33250-12 = "Sim, felizmente... Foi um verdadeiro alívio. Por favor, não se esforce demais."
33250-13 = "...Obrigada. A propósito, veio até aqui tratar de algum assunto?"
33250-14 = "Ah, na verdade, bem... chegou uma carta da Mika-sama..."
33250-15 = "...E o que diz nela?"
33250-16 = "Bom, veja bem..."
33250-18 = "Yaho, Nagi-chan! Pelo que ouvi dizer, você ficou desacordada o tempo todo desde que aquele míssil caiu?"
33250-19 = "Mesmo depois de tanta coisa ter acontecido, ficar dormindo tão tranquila assim não é bem a imagem que a anfitriã deveria mostrar para todo mundo, né?"
33250-20 = "Bom, você esteve se esforçando o tempo todo, então eu queria mesmo que descansasse. Só não imaginava que fosse dormir tão profundamente assim."
33250-21 = "Já que parece ter acordado bem, será que pode me fazer uns favorzinhos? Eu ficaria super feliz se você voltasse logo ao posto de anfitriã e desse um jeito nisso pra mim!"
33250-22 = "Pra começar, a TV daqui só pega os canais normais, né? Será que dá pra instalar aquele negócio que passa um monte de coisa 24 horas por dia?"
33250-23 = "Ah, e o meu creme para as mãos acabou. Só consigo usar o da minha marca de sempre, então pode comprar e trazer pra mim? Depois te passo onde vende!"
33250-24 = "Além disso, o secador de cabelo está ficando meio fraco. Será que não dá pra trocar por um pouquinho mais caro?"
33250-25 = "Ah, já que vai trocar, vou querer um igualzinho ao seu, Nagi-chan! Você está usando o modelo topo de linha daquela marca maravilhosa, né? Aquele que você trocou bem quando seu cabelo ficou ótimo. Eu sei de tudo, viu!"
33250-26 = "E também, e também—"
33250-28 = "..."
33250-29 = "Hum... o que faremos? Pelo visto, em vez do cárcere..."
33250-30 = "De hoje em diante, todas as refeições da Mika-san podem consistir exclusivamente de rocambole."
33250-31 = "Sim... Quê?!"
33250-72 = "Pessoal."
33250-73 = "C-Comandante...?!"
33250-74 = "Comandante!!!"
33250-75 = "...Me desculpem por ter sumido sem dizer nada."
33250-76 = "Buááááááá!! Comandanteeeee!!"
33250-82 = "Peço desculpas pela demora... Mesmo que um pouco tarde, estou de volta."
33250-85 = "Mika-san..."
33250-86 = "Nagi-chan, por que ainda está com essa cara? Bem, as coisas que deram certo... talvez tenham sido poucas, mas mesmo assim."
33250-87 = "É que..."
33250-93 = "Ainda temos uma montanha de lições de casa não resolvidas... não é?"
33250-94 = "S-Seia-san...?"
33250-95 = "Seia-chan?!"
33250-97 = "...Olá, Nagisa, Mika."
33250-98 = "Há quanto tempo não nos reunimos assim."
33250-99 = "Muito tempo se passou e muitas coisas aconteceram, mas..."
33250-100 = "Já está na hora de conversarmos umas com as outras."
33250-101 = "Sobre o que não dissemos, e o que não pudemos dizer."
33250-102 = "E também sobre o que, na verdade, queríamos ter dito."
33250-103 = "Haverá mal-entendidos, e haverá coisas difíceis de acreditar. Mesmo que não consigamos chegar a lugar algum... ainda assim, não temos escolha a não ser encarar essa questão impossível de provar que é o coração do outro."
33250-104 = "Todas nós precisamos seguir em frente. Carregando essa lição de casa nas costas para sempre, mesmo em meio a esta escuridão... apenas olhando para o que há além."
33250-108 = "...Tem razão."
33250-109 = "Sim, concordo totalmente... mas você continua falando só coisas difíceis como sempre. Seia-chan, é por isso que você não tem amigos, sabia? Você tem um pouquinho de noção disso?"
33250-110 = "..."
33250-111 = "Para começo de conversa, Mika, acho que seria melhor colocarmos um pouco de cultura e elegância nessa sua cabeça oca que parece fazer eco, não acha?"
33250-112 = "Hum, vocês duas..."
33250-114 = "[ns] \"Hum... Todas do Clube de Aulas de Reforço anterior já deveriam ter se formado...\""
33250-116 = "[ns] \"Ouvi dizer que formaram um novo Clube de Aulas de Reforço desta vez, então vim ver, mas...?\""
33250-117 = "..."
33250-118 = "..."
33250-119 = "..."
33250-120 = "..."
33250-121 = "[ns] \"São as mesmas integrantes?!\""
33250-123 = "A-Ahaha... Sobre isso, bem..."
33250-124 = "Eu fui ao show do Peroro-sama, mas parece que, na verdade, era dia de prova..."
33250-125 = "Eu ainda não aprendi o conteúdo da próxima prova."
33250-126 = "Hum, bem... eu tentei fazer a prova do terceiro ano, mas..."
33250-127 = "Ser deixada de lado sozinha é tão solitário, não acha? ♡"
33250-128 = "H-Hum, me desculpe, Sensei... De algum jeito, as coisas acabaram ficando assim de novo..."
33250-129 = "M-Mas desta vez não tem expulsão, e o conteúdo da prova também é totalmente normal...!"
33250-130 = "[ns] Sentir uma tontura e desmaiar."
33250-132 = "S-Sensei?!"
33250-133 = "Sensei!"
33250-134 = "Q-Que isso! Não precisava reagir desse jeito, né?!"
33250-135 = "Ora, mas que..."
33250-136 = "Ei! Você acabou de fazer uma cara de \"Que oportunidade perfeita, vou aproveitar essa brecha\", não fez?!"
33250-137 = "Idiota! Coisas pervertidas são proibidas!! Pena de morte!!!"
33250-144 = "..."
33250-145 = "Daqui em diante, você certamente aprenderá muitas coisas. Para sempre, junto com as suas amigas."
33250-146 = "Vai estudar, se esforçar e encontrar diversas possibilidades."
33250-147 = "...Porque você é forte."
33250-148 = "Mesmo que tudo seja em vão, mesmo que este mundo seja escuro e solitário..."
33250-149 = "Mesmo que seja no canto do concreto..."
33250-150 = "...Azusa."
33250-151 = "Aquela flor que você me mostrou naquela época... agora, talvez eu consiga entendê-la um pouco."
33250-152 = "Talvez nunca mais nos encontremos outra vez."
33250-153 = "Por favor, seja feliz."
33250-166 = "...Então foi isso?"
33250-167 = "Aquela Sangue Real fugiu, não é?"
33250-168 = "...Capturem-na e tragam-na aqui. Sem nenhum ferimento, com todo o cuidado."
33250-169 = "Quanto às outras além dela, não me importo se eliminarem todas."
33250-170 = "...Sim. Quero dizer que não me importo se \"destruírem os halos\" delas."
