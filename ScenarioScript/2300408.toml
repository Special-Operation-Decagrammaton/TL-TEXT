[translation]
2300408-1 = "Медаль мейстера"
2300408-2 = "Магазин в пригороде Шале"
2300408-4 = "Мы с Утахой приехали в город за покупками для работы и наткнулись на недавно открывшийся магазин."
2300408-5 = "Хм? Это место новое."
2300408-6 = "Здесь много молодых девушек в очереди. Интересно, что продают..."
2300408-7 = "Здравствуйте! Добро пожаловать на торжественное открытие Momo Nails!"
2300408-8 = "В честь открытия мы бесплатно ухаживаем за ногтями, обязательно попробуйте!"
2300408-9 = "Хм, салон маникюра."
2300408-10 = "Если подумать, в Миллениуме есть студенты, которые клеят на ногти гель и украшения."
2300408-11 = "[s] «Утаха, почему бы тебе не попробовать?»"
2300408-12 = "Мне? Сделать маникюр?"
2300408-13 = "Нет, спасибо. Мои ногти всё равно не очень красивые..."
2300408-14 = ""
2300408-15 = "Девушка! У вас отличные руки!"
2300408-16 = "Хотите бесплатный уход за ногтями?"
2300408-17 = "Я? Но я никогда не делала маникюр..."
2300408-18 = "Тем лучше. За такими ногтями особенно приятно ухаживать!"
2300408-19 = "Настоящая мода начинается с макушки и заканчивается кончиками пальцев! Красивые ногти отлично повышают уверенность!"
2300408-20 = "Но..."
2300408-21 = "[s1] «Всё хорошо, попробуй.»\n[s2] «Мейстеру нельзя бояться пробовать новое!»"
2300408-24 = ""
2300408-25 = "Ну... если Сенсей настаивает."
2300408-26 = "Тогда, может, совсем немного..."
2300408-27 = "Хорошо, присаживайтесь сюда!"
2300408-29 = "Готово. Ну как?"
2300408-30 = "Давно я не видела свои пальцы такими чистыми."
2300408-31 = "Трещин больше нет, масло полностью смыли... Будто смотрю на чужие руки."
2300408-32 = "Маникюр и правда удивительная вещь."
2300408-33 = "[s] «Может, будешь делать маникюр каждую неделю?»"
2300408-34 = "...Нет, спасибо. Если украшать ногти, это будет мешать работе с машинами."
2300408-35 = "Мне больше подходят потрескавшиеся и испачканные маслом руки."
2300408-36 = "Мне не стыдно. Может, они и выглядят грязными... но грязные руки — почётный знак мейстера."
2300408-37 = "...Хотя, наверное, оставлю мизинец украшенным на память."
2300408-38 = ""
2300408-39 = ""
2300408-40 = "Простите, можно нанести гель только на мизинец?"
2300408-41 = "Конечно, без проблем. Секунду."
2300408-43 = "После салона я вернулся в Шале вместе с заметно воодушевлённой Утахой."
