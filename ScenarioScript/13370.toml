[translation]
13370-1 = "Эпизод 37;То, что должно быть сказано"
13370-5 = ""
13370-6 = "Хошино."
13370-7 = ""
13370-9 = ""
13370-10 = ""
13370-11 = "Что Юмэ пыталась сказать мне перед самым концом?"
13370-12 = "Что она написала в той тетради?"
13370-13 = "Наверное... я никогда не узнаю."
13370-14 = "И пока не узнаю, эти страдания не исчезнут."
13370-15 = "Эта боль..."
13370-16 = "Эта боль должна быть..."
13370-17 = "...грехом, который мне суждено нести, да?"
13370-18 = "Хошино. Ты ошибаешься."
13370-19 = "Не в этом истинный источник твоей боли и сожалений!"
13370-20 = "Ты жалеешь... что не сказала Юмэ, насколько дорожила ею. Что не обращалась с ней с той добротой, которой она заслуживала."
13370-21 = "И тебе так больно потому, что в самом конце ты уже не могла этого исправить."
13370-22 = ""
13370-23 = ""
13370-24 = "Если бы я знала, что это будет последний раз..."
13370-25 = "Я должна была быть честной с ней... при каждой возможности..."
13370-26 = "Но ты не знала! Ты никак не могла знать, что больше никогда её не увидишь."
13370-28 = ""
13370-29 = "Это был несчастный случай, Хошино."
13370-30 = ""
13370-31 = "Такими жалкими оправданиями мне эти чувства не облегчить."
13370-32 = "Ты не виновата."
13370-33 = ""
13370-34 = "Я знаю. Всегда знала. Но всё равно виновата я."
13370-35 = "Во всём виновата я."
13370-36 = "Хошино. Если бы не ты..."
13370-37 = "Я умерла бы одна в той пустыне. Дрожала бы от холода, напуганная и одинокая."
13370-38 = "Да. Я берегу твой шарф с того самого дня, Хошино."
13370-39 = ""
13370-40 = "...Я просто помогла тебе, потому что ты была в беде. Юмэ... для меня..."
13370-41 = "Да. Тогда и Юмэ я тоже должна быть благодарна."
13370-42 = ""
13370-43 = "..."
13370-45 = ""
13370-46 = ""
13370-47 = "Мы рождаемся, страдаем и умираем. Наверное, в этом и есть великий секрет жизни..."
13370-48 = "Если у смерти действительно есть какой-то высший смысл..."
13370-49 = "Тогда в чём был смысл смерти Юмэ? Почему она должна была умереть именно так?"
13370-50 = "Хошино..."
13370-51 = ""
13370-52 = "Юмэ заблудилась и умерла."
13370-53 = "У неё не было ни компаса, ни воды... а коммуникатор не работал. Небо, наверное, было слишком затянуто облаками, чтобы ориентироваться по звёздам."
13370-54 = "Старый телефон Юмэ был почти неработающим куском хлама. Снова и снова ей хотелось заменить его новым. Но в итоге она всегда себе отказывала."
13370-55 = "Потому что хотела, чтобы каждая последняя йена шла на выплату нашего долга..."
13370-56 = "А если... тогда... я бы..."
13370-57 = "Хошино!"
13370-58 = ""
13370-59 = "..."
13370-60 = "У меня... нет ответов. Мне никогда не приходилось задумываться о таких вещах..."
13370-61 = "Но если ты продолжишь этот бесплодный поиск... в конце концов..."
13370-62 = ""
13370-63 = "Аяне."
13370-64 = "...Это ты починила кран в школе."
13370-65 = "А...?"
13370-66 = ""
13370-67 = "Спасибо. Я почти никогда этого не говорю, но всегда была тебе благодарна."
13370-68 = "Хошино...?"
13370-70 = "..."
13370-71 = "*вздох* Прости, Хошино. Я не знаю, какие слова сейчас правильные..."
13370-72 = "..."
13370-73 = "Просто возвращайся уже! Дурочка! Вместе сходим за горячей миской рамена!"
13370-74 = "Я даже соглашусь на тупую тему с айдолами вместе с Аяне! Только вернись!"
13370-75 = ""
13370-76 = "Серика..."
13370-77 = "Ты такая милая, Сэрика..."
13370-78 = "...А?!"
13370-80 = "..."
13370-81 = "Пора отпустить."
13370-82 = "Позволь себе стать свободной, Хошино. Ты должна отпустить председательницу студсовета."
13370-83 = ""
13370-84 = "Широко...?"
13370-85 = "Позволь Серике и Аяне, которые не несут боли воспоминаний о ней..."
13370-86 = "...наполнить эту академию, этот класс, преследуемый её потерей, своим смехом."
13370-87 = "А вместо этого..."
13370-88 = "...помни драгоценные воспоминания о времени, проведённом вместе, и отпусти её трагическую смерть."
13370-89 = "Её смерть останется в слухах и шёпоте, но только ты... можешь помнить Юмэ такой, какой она была при жизни."
13370-90 = "Так что отпусти... ту тетрадь."
13370-95 = ""
13370-96 = ""
13370-97 = "Спасибо, Широко из другого мира..."
13370-98 = "Может, я тебя и не знаю, но понимаю слишком хорошо."
13370-99 = "Ты хочешь защитить Широко от того, чтобы она стала такой, как я."
13370-100 = "Спасибо, Широко. Ты и правда она."
13370-101 = "Но..."
13370-102 = "У тебя ведь тоже они всё ещё есть, да?"
13370-103 = "...!"
13370-105 = ""
13370-106 = ""
13370-107 = "Оружие, которое Серика, Нономи, Аяне и я оставили после своей смерти..."
13370-108 = "Ты так и не смогла заставить себя выбросить его."
13370-109 = "Я..."
13370-110 = ""
13370-111 = "Так могу ли я правда отпустить это, Широко?"
13370-112 = "Для нас... такое вообще возможно? Можем ли мы позволить времени идти дальше и забыть воспоминания, которые нельзя забывать?"
13370-113 = "..."
13370-114 = "... ..."
13370-115 = "Я не могу... ответить на это, Хошино."
13370-116 = "Не знаю, возможно ли это..."
13370-117 = "Может ли человек..."
13370-118 = "...сбежать? Сбежать от греха? От трагедии? От страданий?"
13370-119 = "Такое может быть столь же невозможным, как воскресить мёртвых..."
13370-120 = "..."
13370-121 = ""
13370-125 = "СВЕРШИЛОСЬ!!"
13370-126 = "Проявление Ярости Сета завершено!!"
13370-127 = "О-о-о! Сет! Свирепый удар молнии!"
13370-128 = "Сожги всё! Испепели мир дотла!!"
13370-129 = ""
13370-132 = "Сенсей! Ярость Сета...!!"
13370-133 = "Что-то надвигается! О-Осторожно! Энергия чудовищная!"
13370-134 = ""
13370-137 = "Я..."
13370-138 = "Я... ..."
13370-139 = "Это невозможно..."
13370-140 = ""
13370-143 = "След Юмэ..."
13370-144 = "Пока я не увижу его своими глазами... пока наконец не пойму..."
13370-145 = ""
13370-148 = "Я..."
13370-149 = ""
13370-156 = "Осторожно, Сенсей!!"
13370-157 = "У меня больше нет сил заблокировать атаку!!"
13370-158 = "Все студенты! Они сейчас—"
13370-159 = "Уа-а-а!!"
13370-160 = ""
13370-163 = "[ns] «Хошино. Как думаешь, что написано в тетради Юмэ?»"
13370-164 = "Я должна узнать. Я—"
13370-165 = "[s] «Ты никогда не сможешь.»"
13370-166 = "..."
13370-167 = "[s] «Ты это знаешь. Но ищешь то, во что сможешь поверить.»"
13370-168 = "Что Юмэ... могла там написать?"
13370-169 = "[s] «Ты знаешь Юмэ лучше всех.»"
13370-170 = "..."
13370-171 = "[ns1] «Что бы ты ни надеялась увидеть в её записях...»\n[ns2] «...во что бы ты ни надеялась поверить...»"
13370-174 = "[ns3] «Пусть это может быть не настоящим...»\n[ns4] «...но это всё равно истина.»"
13370-177 = "[ns] «Пусть этого даже не существует, эта истина — твоя реальность.»"
13370-179 = "[ns] «Поверь в свою истину и иди вперёд. Другого пути нет.»"
13370-181 = "[ns5] «Для обычных людей вроде нас...»\n[ns6] «...людей, которые не могут воскресить мёртвых или повернуть время назад...»"
13370-184 = "[ns7] «Это наше единственное чудо.»\n[ns8] Это наше единственное чудо."
13370-191 = ""
13370-192 = "..."
13370-193 = "Это место..."
13370-194 = "...А?"
13370-195 = ""
13370-197 = ""
13370-199 = "...Тетрадь?"
13370-200 = "Ч-Что...?"
13370-201 = ""
13370-203 = ""
13370-204 = "Чего-о-о?! П-Почему она... з-здесь...?"
13370-205 = ""
13370-208 = "Как ты поживаешь, Хошино?"
13370-213 = ""
13370-215 = ""
13370-217 = "Хи-хи-хи. Мне было интересно, насколько ты вырастешь за два года..."
13370-222 = "Следующий эпизод;Обещание"
