[translation]
13370-1 = "Episódio 37;O Que Precisa Ser Dito"
13370-6 = "...Hoshino-senpai."
13370-11 = "O que será que a Yume-senpai tentou dizer no final?"
13370-12 = "O que será que estava escrito naquele caderno?"
13370-13 = "...Não vou mais ter a chance de descobrir."
13370-14 = "Mesmo sabendo disso, não consigo desistir."
13370-15 = "Mas esse sofrimento..."
13370-16 = "Não, esse sofrimento é justamente..."
13370-17 = "O \"pecado\" que foi imposto a mim."
13370-18 = "Não é isso, senpai."
13370-19 = "Você não se arrepende por não ter encontrado o caderno..."
13370-20 = "Mas por não ter conseguido expressar seus sentimentos para a Presidente Yume..."
13370-21 = "É por isso que ainda está sofrendo, não é?"
13370-24 = "Se eu soubesse que aquela seria a última vez..."
13370-25 = "...Não. Independentemente disso, eu devia ter dito o que sentia no dia a dia."
13370-26 = "Porque ninguém imagina que... vai deixar de ver alguém assim, de repente."
13370-29 = "Aquilo foi um acidente, senpai."
13370-31 = "Mesmo assim, conseguir aceitar ou não é outra história."
13370-32 = "Não foi culpa sua, senpai."
13370-34 = "Na minha cabeça eu entendo... mas não consigo me conformar."
13370-35 = "Eu estava errada."
13370-36 = "Se não fosse pela Hoshino-senpai..."
13370-37 = "Naquele dia, eu teria morrido."
13370-38 = "...Mas você me deu o seu cachecol, senpai."
13370-40 = "A Yume-senpai disse para eu fazer isso..."
13370-41 = "Nn. Então tenho que agradecer à Yume-senpai também."
13370-43 = "..."
13370-47 = "Nós sofremos e morremos sem sentido algum.#nDeve ser esse o nosso destino."
13370-48 = "Porque, se a \"morte\" realmente tivesse algum sentido—"
13370-49 = "Que sentido haveria na senpai ter morrido daquele jeito?"
13370-50 = "Hoshino-senpai..."
13370-52 = "A Yume-senpai se perdeu no deserto e caiu sem forças."
13370-53 = "Sem água, sem bússola e sem comunicador.#nNaquele dia, o tempo estava tão ruim que não dava para ver uma única estrela."
13370-54 = "Se ao menos o celular dela fosse mais novo...#nTalvez eu tivesse conseguido receber as palavras da senpai...#nTalvez tivessem encontrado ela mais cedo."
13370-55 = "Mas a senpai deixou para trocar de aparelho depois, dizendo que precisava pagar a dívida..."
13370-56 = "Se eu... tivesse conversado direito com ela..."
13370-57 = "Hoshino-senpai!"
13370-59 = "..."
13370-60 = "Talvez eu não devesse me intrometer nos assuntos#nentre a Hoshino-senpai e a Presidente Yume."
13370-61 = "Mas se você continuar se torturando desse jeito, senpai..."
13370-63 = "...O encanamento da escola."
13370-64 = "Foi você quem consertou, né, Ayane-chan?"
13370-65 = "Hã...?"
13370-67 = "Obrigada.#nNa verdade, eu queria ter te dito isso bem antes."
13370-68 = "...Hoshino-senpai."
13370-70 = "..."
13370-71 = "Uf... desculpa, não sou boa em colocar isso em palavras."
13370-72 = "...Volta logo, sua senpai idiota!"
13370-73 = "Aí a gente vai comer lámen juntas de novo!"
13370-74 = "Se você voltar, eu até viro idol junto com a Ayane-chan!"
13370-76 = "...Serika-chan."
13370-77 = "A Serika-chan é mesmo uma fofa, né~"
13370-78 = "E-Ei!?"
13370-80 = "......"
13370-81 = "—Já chega."
13370-82 = "O passado é passado — pode deixá-lo como está."
13370-84 = "Shiroko... chan...?"
13370-85 = "Valorize o que vem pela frente... um futuro onde haverá cada vez mais alunas como a Serika e a Ayane, que não a conheceram."
13370-86 = "Não há nada de errado no fato de quem não a conheceu conseguir sorrir hoje."
13370-87 = "Por isso..."
13370-88 = "Em vez de ficar presa à morte, vamos levar as memórias para o futuro."
13370-89 = "Você é quem melhor sabe que tipo de pessoa a presidente do conselho estudantil era, não é, senpai?"
13370-90 = "Então, solte essa mão."
13370-97 = "...Obrigada."
13370-98 = "Eu não te conheço direito, mas... eu entendo."
13370-99 = "...Você não quer que eu repita o mesmo erro, né?"
13370-100 = "A Shiroko-chan é tão gentil."
13370-101 = "...Além disso."
13370-102 = "—Você também não conseguiu abrir mão, né?"
13370-103 = "...!"
13370-107 = "...Das armas que todas usavam."
13370-108 = "Você ainda está com elas, não é?"
13370-109 = "Eu..."
13370-111 = "Você consegue jogar isso fora?"
13370-112 = "Enquanto as lembranças vão se apagando aos poucos, você consegue abrir mão até dessas memórias?"
13370-113 = "..."
13370-114 = "......"
13370-115 = "Não sei."
13370-116 = "...Será que conseguimos?"
13370-117 = "Será que nós..."
13370-118 = "Conseguimos escapar do \"pecado\"... da \"tristeza\", do \"sofrimento\"?"
13370-119 = "...Acho que deve ser tão difícil quanto trazer alguém morto de volta à vida."
13370-120 = "..."
13370-125 = "Está completo!"
13370-126 = "Finalmente, a \"Fúria de Set\" se manifestará!"
13370-127 = "Oooooh, fúria do relâmpago...!"
13370-128 = "Reduza a terra a cinzas—!!"
13370-132 = "Sensei, cuidado!"
13370-133 = "Uma reação de energia gigantesca está...!"
13370-137 = "..."
13370-138 = "Eu..."
13370-139 = "...não consigo."
13370-143 = "Aquilo que a senpai deixou no final."
13370-144 = "Eu preciso confirmar o que significa."
13370-148 = "Senão, eu..."
13370-156 = "Desvie, Sensei!"
13370-157 = "Eu não consigo bloquear aquele ataque agora!"
13370-158 = "E-E as alunas também...!"
13370-159 = "Uwaaaaaah!?"
13370-163 = "[ns] \"O que você acha que está escrito no caderno, Hoshino?\""
13370-164 = "Não sei.#nPor isso, para descobrir—"
13370-165 = "[s] \"Sim. Porque isso é algo que ninguém tem como saber.\""
13370-166 = "..."
13370-167 = "[s] \"Mesmo assim, você acredita, não é?\""
13370-168 = "...Que tipo de palavras será que a Yume-senpai deixou?"
13370-169 = "[s] \"Quem melhor a conhecia era você, Hoshino, não é?\""
13370-170 = "..."
13370-171 = "[ns1] \"Então, lá com certeza...\"\n[ns2] \"Devem estar escritas as palavras em que você acredita, Hoshino.\""
13370-174 = "[ns3] \"Talvez nunca saibamos os fatos.\"\n[ns4] \"Mas a verdade está lá.\""
13370-177 = "[ns] \"Mesmo que não exista mais, o fato de ser verdade não muda.\""
13370-179 = "[ns] \"Essa é a única escolha que nós podemos fazer.\""
13370-181 = "[ns5] \"Pois não podemos desfazer a morte, nem voltar no tempo...\"\n[ns6] \"Para pessoas comuns como nós...\""
13370-184 = "[ns7] \"É o único — milagre que existe.\"\n[ns8] É o único — milagre que existe."
13370-192 = "..."
13370-193 = "Que lugar é esse..."
13370-194 = "...Hm?"
13370-199 = "...O caderno?"
13370-200 = "O quê?"
13370-204 = "C-Como?!#n...Como isso veio parar aqui?!"
13370-208 = "Hoshino-chan, você está bem?"
13370-217 = "Ehehe. Como será que a Hoshino-chan cresceu agora que está no 3º ano?"
13370-222 = "Próximo;A Promessa"
