[translation]
1012208-1 = "Когда-нибудь — для меня"
1012208-2 = "[ns] «Она сказала, что нужно идти сюда...»"
1012208-3 = ""
1012208-4 = "Сенсей! Сюда!"
1012208-5 = "А-ха-ха, спасибо, что пришёл."
1012208-6 = "Есть одно место, которое я хотела тебе показать..."
1012208-7 = "[s] «Звучит как что-то особенное. Мне уже интересно.»"
1012208-8 = "Ага! Но придётся идти пешком, хорошо?"
1012208-9 = "Отсюда немно-ожечко далековато, так что..."
1012208-10 = "О, ты любишь гулять ночью? Не боишься чудовищ?"
1012208-11 = "Хи-хи, какое облегчение."
1012208-12 = "В таком случае..."
1012208-13 = ""
1012208-15 = ""
1012208-16 = ""
1012208-17 = "...пойдём?"
1012208-19 = "Мы пошли вдоль берега."
1012208-21 = ""
1012208-22 = "А, кстати, если подумать..."
1012208-23 = "..."
1012208-24 = "Сенсей, прости меня."
1012208-25 = "[s] «Хм?»"
1012208-26 = "Эм, когда я вырубилась, а ты отнёс меня обратно..."
1012208-27 = "[s1] «Ага. Это было настоящее испытание.»\n[s2] «Ты была лёгкой, как... грузовик перьев.»"
1012208-28 = "П-Правда???"
1012208-29 = "Я-Я была НАСТОЛЬКО тяжёлая...? Мне очень трудно в это поверить..."
1012208-30 = "...А. Шутка."
1012208-31 = "Бу-у! Какой же ты вредный. Я уже почти поверила, знаешь ли..."
1012208-32 = "...К-Конечно, я понимаю, что сама виновата, но..."
1012208-33 = "Х-Хм?"
1012208-34 = "П-Правда? Ты считал, что я была лёгкой и совсем не доставила хлопот?"
1012208-35 = "Н-Ну... рада это слышать, но..."
1012208-36 = "...В общем, я хотела извиниться. Мне не стоило так делать."
1012208-37 = "Я снова у тебя в долгу, Сенсей."
1012208-38 = "«Всё нормально, пока я снова не пытаюсь вести себя как взрослая»?"
1012208-39 = "...Д-Да... Больше не буду притворяться... Даже вспоминать об этом слишком стыдно."
1012208-40 = "Ты научил меня, что мне не нужно себя заставлять..."
1012208-41 = "...и что лучше просто быть честной."
1012208-42 = "[ns] «Ты уже не волнуешься так, как раньше?»"
1012208-43 = ""
1012208-44 = "Наверное... я стала меньше тревожиться. Эм..."
1012208-45 = "Я много об этом думала, и..."
1012208-46 = ""
1012208-48 = ""
1012208-49 = "Мы почти пришли, Сенсей."
1012208-50 = "Нам сюда."
1012208-51 = "Вот, здесь...!"
1012208-57 = "[ns] «Как красиво!»"
1012208-58 = "Ага, знаю!"
1012208-59 = "Я сама нашла это место. Пришла сюда совсем одна, пытаясь разобраться в мыслях."
1012208-60 = "А потом увидела всё это — и будто сразу всё прояснилось!"
1012208-61 = "Хи-хи, и я сразу поняла, что ОБЯЗАНА показать это тебе."
1012208-62 = "Ну же, ну же! Садись сюда, Сенсей."
1012208-63 = ""
1012208-65 = ""
1012208-70 = "Здесь так спокойно..."
1012208-71 = "Когда лежишь вот так, кажется, будто все тревоги могут просто рассеяться."
1012208-72 = "Ах..."
1012208-73 = "С-Сенсей! Смотри...!"
1012208-74 = "[ns] «Это же...?!»"
1012208-79 = "Ого... Сколько падающих звёзд..."
1012208-80 = "...Красиво... Всё такое прекрасное."
1012208-81 = "[ns] «Спасибо, Мика.»"
1012208-82 = "Хм?"
1012208-83 = "[ns3] «Это было особенное мгновение.»\n[ns4] «Ты показала мне невероятное зрелище!»"
1012208-86 = "..."
1012208-89 = "― [log=미카 수영복]Эм, Сенсей. [/log][wa:1190]"
1012208-91 = "― [log=미카 수영복]Я... рада, что смогла увидеть этот пейзаж вместе с тобой.[/log][wa:4790]"
1012208-94 = "― [log=미카 수영복]Сомнения...[/log][wa:1900]"
1012208-96 = "― [log=미카 수영복]Тревоги...[/log]"
1012208-99 = "― [log=미카 수영복]Беспокойство... Оно всё ещё со мной. [/log][wa:3080]"
1012208-102 = "― [log=미카 수영복]Но всё же...[/log][wa:270]"
1012208-104 = "― [log=미카 수영복]Когда я вот так смотрю на небо, полное звёзд...[/log][wa:10]"
1012208-107 = "― [log=미카 수영복]...может, всё это не так уж важно.[/log][wa:3760]"
1012208-109 = "― [log=미카 수영복]Именно так я сейчас чувствую.[/log]"
1012208-112 = "― [log=미카 수영복]Сенсей, ты ведь говорил мне это раньше. [/log][wa:1480]"
1012208-115 = "― [log=미카 수영복]Что именно этот миг продолжит...[/log][wa:6520]"
1012208-117 = "― [log=미카 수영복]...поддерживать меня в будущем. Ага.[/log][wa:1590]"
1012208-120 = "― [log=미카 수영복]Так что...[/log][wa:570]"
1012208-122 = "― [log=미카 수영복]Я тоже буду счастлива.[/log][wa:2650]"
1012208-125 = ""
1012208-126 = "..."
1012208-127 = "Я-Я это сказала..."
1012208-128 = "[ns] «Ты будешь счастлива, Мика.»"
1012208-129 = ""
1012208-131 = ""
1012208-132 = "[ns] «Я в это верю.»"
1012208-133 = "Э-Это..."
1012208-134 = "Серьёзно... Не понимаю, как взрослые умудряются говорить такое с совершенно невозмутимым лицом."
1012208-135 = ""
1012208-137 = ""
1012208-138 = ""
1012208-139 = "Спасибо, Сенсей."
1012208-140 = "Я... однажды буду счастлива. Ага."
1012208-141 = "Ты ведь поможешь мне, да...?"
1012208-142 = "[s5] «Да, конечно.»\n[s6] «Я всегда буду на твоей стороне.»"
1012208-145 = "А-ха-ха, опять ты такой серьёзный... ☆"
1012208-146 = "..."
1012208-147 = ""
1012208-149 = ""
1012208-150 = "Сенсей, ты странный, иногда глупенький, но всегда добрый."
1012208-151 = ""
1012208-153 = ""
1012208-154 = "Ну вот, теперь я сказала всё, что хотела..."
1012208-155 = ""
1012208-157 = ""
1012208-158 = ""
1012208-159 = "А если останусь здесь ещё дольше, то могу стать плохой девочкой..."
1012208-160 = "...Так что давай вернёмся, пока этого не произошло! ☆"
1012208-161 = ""
1012208-164 = "[ns] «Хм? О чём ты вообще...?»"
1012208-165 = "А-ха-ха, пошли, Сенсей!"
1012208-167 = "Мы вернулись, идя вдоль берега."
1012208-169 = ""
1012208-170 = ""
1012208-171 = ""
1012208-173 = "Мика улыбалась и болтала всю обратную дорогу..."
1012208-174 = "...Она выглядела счастливой."
