[translation]
1012603-1 = "Голос девушки"
1012603-2 = "У меня был обычный рабочий день, когда..."
1012603-3 = ""
1012603-6 = "[ns] «Номер мне незнаком...»"
1012603-7 = "...Я решил пока что ответить."
1012603-8 = ""
1012603-11 = "А? Вы там...?"
1012603-12 = "А-Алло? Это [USERNAME]-Сенсей?"
1012603-13 = "[s] «Да, это я. Привет.»"
1012603-14 = "Ого! Это правда вы, [USERNAME]-Сенсей! Хи-хи..."
1012603-15 = "Сенсей, послушайте. Простите, что беспокою, но можно минутку поговорить?"
1012603-16 = "[s] «Конечно... но кто это?»"
1012603-17 = "А! Простите! Я-Я слишком стесняюсь представиться...!"
1012603-18 = "Дело в том... что я уже давно за вами наблюдаю."
1012603-19 = "Думаю, вы меня не знаете, но мне кажется, что я довольно хорошо знаю вас."
1012603-20 = "Вы всегда так добры к своим студентам, и я... Кажется, я испытываю к вам определённые чувства..."
1012603-21 = "П-Поэтому... вы могли бы прийти ко мне?"
1012603-22 = "Это моё самое большое желание — встретиться с вами наедине."
1012603-23 = "[s] «(Это может закончиться неприятностями.)»"
1012603-24 = "Э-э... Е-Если это не доставит вам проблем, конечно..."
1012603-25 = "[s1] «(...Мне стоит встретиться с ней хотя бы затем, чтобы всё объяснить.)»\n[s2] «Хорошо. Встретимся в парке рядом с Шале.»"
1012603-28 = "Ура! Большое спасибо! Я буду ждать!"
1012603-29 = ""
1012603-34 = "Я увлёкся работой, затем сделал перерыв и вышел в парк."
1012603-37 = "[ns] «Она должна быть где-то здесь...»"
1012603-38 = "Мяу. Мя-яу."
1012603-39 = "Кар. Кар-кар."
1012603-40 = "[ns] «...Здесь всегда было столько кошек и ворон?»"
1012603-41 = "Странно... Стоит мне выйти на улицу, как вокруг обязательно собираются вороны и чёрные кошки."
1012603-42 = ""
1012603-44 = ""
1012603-45 = "Если услышишь их крики, значит, скоро увидишь и меня."
1012603-46 = "[s] «Каноэ... Можно спросить, почему ты здесь?»"
1012603-47 = "Я ждала вас, Сенсей."
1012603-48 = "[ns3] «(Что-то здесь не так...)»\n[ns4] «(Так, какой путь для отступления лучший...?)»"
1012603-51 = "Э-хе-хе, боюсь, сбежать не получится."
1012603-52 = "Все за Сенсеем!"
1012603-53 = "Мяу! Мя-яу!!"
1012603-54 = "Кар! Кар-кар!!"
1012603-55 = ""
1012603-67 = "...Кошки и вороны окружили меня, пока я не отказался от попытки сбежать."
1012603-68 = ""
1012603-69 = "[ns] «Ч-Что происходит? Я просто пришёл встретиться со студентом!»"
1012603-70 = "Да. И этим студентом была я..."
1012603-71 = ""
1012603-73 = ""
1012603-74 = "Так что здравствуйте, Сенсей! Спасибо, что пришли!"
1012603-75 = "Хи-хи, моё желание исполнилось!"
1012603-76 = "[s5] «Т-Та девушка была тобой...?»\n[s6] «Н-Но голоса у вас совершенно разные!»"
1012603-79 = "Я думала, ты знаешь, что я актриса. И актриса озвучки тоже."
1012603-80 = "То, что ты слышал, был мой голос «милой девушки»."
1012603-81 = "И раз он заманил тебя сюда... значит, именно такая милота тебе нравится, Сенсей."
1012603-82 = "[s] «Я-Я собирался всё с ней обсудить и отправить её обратно!»"
1012603-83 = ""
1012603-85 = ""
1012603-86 = "Понятно. Значит, ты собирался отвергнуть других девушек ради меня — своей возлюбленной из прошлой жизни."
1012603-87 = "Хи-хи, судьба и правда сплела для нас чудесную паутину. И я понимаю тебя так же хорошо, как много лет назад..."
1012603-88 = "[s] «У нас не было никаких прошлых жизней вместе!»"
1012603-89 = "В любом случае, я не могу отпустить тебя обратно вот так, Сенсей..."
1012603-90 = "Я позвала тебя сюда... по другой причине."
1012603-91 = ""
1012603-93 = ""
1012603-94 = "Я записала ASMR-трек, и как раз сегодня он вышел."
1012603-95 = "Так что мне хотелось... узнать твоё мнение."
1012603-96 = "[s] «ASMR, значит? Ты озвучиваешь одного из своих персонажей?»"
1012603-97 = "Именно. Говорят, в этой нише меня даже считают вундеркиндом."
1012603-98 = "Хи-хи, достаточно интересно, чтобы послушать?"
1012603-99 = ""
1012603-101 = ""
1012603-102 = ""
1012603-103 = ""
1012603-104 = "Вот, возьми эти наушники."
1012603-106 = "Я вставил наушники, затем медленно закрыл глаза и стал слушать."
1012603-107 = ""
1012603-114 = "...Я услышал, как прямолинейная девушка смущённо напевает колыбельную."
1012603-115 = ""
1012603-116 = "[ns] «Это правда твой голос?»"
1012603-117 = "Один из моих голосов — да."
1012603-118 = "Возможно, именно этот персонаж тебе не по вкусу, но..."
1012603-119 = "[s] «О, я не это имел в виду! Звучишь отлично!»"
1012603-120 = ""
1012603-122 = ""
1012603-123 = "Хи-хи, понятно... Спасибо..."
1012603-124 = "Оставь эту запись себе в подарок."
1012603-125 = "[s] «Я бы ни за что не понял, что это ты. Отличный диапазон.»"
1012603-126 = "Если хочешь, я могу показать и другие голоса."
1012603-127 = "Монстров, призраков... даже звуки окружающей среды."
1012603-128 = "Какой голос тебе нравится, Сенсей?"
1012603-129 = "Скажи мне. Я могу всё."
1012603-130 = "Всё-что-у-год-но."
1012603-131 = "Хи-хи... Э-хе-хе-хе..."
1012603-133 = "Я слушал разные голоса Каноэ. Перерыв затянулся дольше, чем я рассчитывал."
1012603-134 = "Кошки и вороны тоже собрались вокруг послушать."
