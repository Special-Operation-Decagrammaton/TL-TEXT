[translation]
1002405-1 = "Вместе повсюду"
1002405-2 = "Широко неизменно сообщала мне о каждом месте, куда прибывала точно по расписанию."
1002405-3 = "Несмотря на длину маршрута, казалось, ей действительно очень весело."
1002405-5 = "Даже когда она в конце концов добралась до пляжа."
1002405-6 = ""
1002405-7 = ""
1002405-8 = "Сенсей. Я здесь."
1002405-9 = "Спасибо. Ты пришёл как раз вовремя."
1002405-10 = "[s] «Ты и правда выкладываешься по полной.»"
1002405-11 = "Я же говорила, что всегда хотела это сделать."
1002405-12 = "Хи-хи."
1002405-13 = "Ну, я поехала. Увидимся на следующей точке."
1002405-14 = ""
1002405-16 = ""
1002405-18 = "Даже у железной дороги глубоко в горах."
1002405-19 = "И снова ты пришёл точно вовремя."
1002405-20 = "Это так приятно. И как раз пора сменить полотенце. Спасибо, Сенсей."
1002405-21 = "[s] «Тебе не тяжело?»"
1002405-22 = "Хм. Мне действительно пришлось много тренироваться ради этого."
1002405-23 = "Признаю, это намного тяжелее моих обычных тренировок."
1002405-24 = "Но по крайней мере в этот раз я..."
1002405-25 = "Хм-м."
1002405-26 = "Ничего."
1002405-27 = "До встречи в следующий раз, Сенсей."
1002405-28 = ""
1002405-30 = ""
1002405-32 = "И даже у подвесного моста."
1002405-33 = ""
1002405-36 = "В этот раз ты приехал раньше меня, Сенсей."
1002405-37 = "Спасибо за напиток."
1002405-38 = "Хм? Я выгляжу так, будто мне весело?"
1002405-39 = "Ну, это потому что..."
1002405-40 = "..."
1002405-41 = "Я-Я выбилась из графика. Нужно ехать, иначе не успею к следующей контрольной точке."
1002405-42 = "Прости, что так быстро ухожу, Сенсей. До встречи."
1002405-43 = ""
1002405-45 = ""
1002405-47 = "Я пришла, Сенсей."
1002405-48 = "Я уже далеко продвинулась в поездке. Всё идёт гладко."
1002405-49 = "Такими темпами я должна закончить вовремя."
1002405-50 = "И всё это... благодаря тебе."
1002405-51 = "[s] «Я рад, что смог помочь.»"
1002405-52 = "Да."
1002405-53 = "Ты столько для меня сделал."
1002405-54 = "[s] «Отмеченная здесь точка — последняя.»"
1002405-55 = "Точно."
1002405-56 = "Отсюда я собиралась ехать прямо до конца без отдыха."
1002405-57 = "У меня есть ещё одно место на примете, так что напишу тебе, когда приеду."
1002405-58 = ""
1002405-60 = ""
1002405-61 = "Широко выглядела посвежевшей, когда скрылась вдали."
1002405-63 = "Я решил вернуться в клубную комнату и ждать, когда она свяжется со мной."
