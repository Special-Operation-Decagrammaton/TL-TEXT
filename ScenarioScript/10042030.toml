[translation]
10042030-1 = "Эпизод 3;Биологическая угроза"
10042030-2 = ""
10042030-3 = "Мы готовы к транспортировке, президент."
10042030-4 = "Хорошая работа."
10042030-5 = "Эм... президент? Не знаю, стоит ли это говорить, но..."
10042030-6 = "Кажется, сегодня в кафе я видела... ту самую «штуку», о которой вы говорили..."
10042030-7 = "Штуку...?"
10042030-8 = ""
10042030-10 = ""
10042030-11 = "...А, ты имеешь в виду обсуждаемое странное чудовище."
10042030-12 = "?!"
10042030-13 = "(Погодите-ка, я знаю этого человека...!)"
10042030-14 = "Можешь рассказать об этом подробнее?"
10042030-15 = "Конечно. Мы с подругой заказывали кое-что в Панкейк-кафе..."
10042030-16 = "И вдруг появилась какая-то фиолетовая штука, похожая на панкейк, вся покрытая зелёной слизью."
10042030-17 = "Зелёная и фиолетовая... Понятно."
10042030-18 = "Она двигалась так быстро, что я не успела её толком рассмотреть, но теперь, когда пытаюсь вспомнить, кажется, у неё были какие-то щупальца... В общем."
10042030-19 = "Она извивалась и носилась повсюду, а потом просто умчалась."
10042030-20 = "Это было странно... и мне совсем не понравилось."
10042030-21 = "Понятно. Есть идеи, куда она могла отправиться потом?"
10042030-22 = "Без понятия. Я даже не знаю, откуда она взялась."
10042030-23 = "Ясно. Для начала нужно переместить тело, то есть «пострадавшую», и наблюдать за её состоянием."
10042030-24 = "Да, президент."
10042030-25 = ""
10042030-27 = ""
10042030-28 = "Что ж, вопросов у нас теперь определённо больше, чем ответов."
10042030-29 = "Но в одном мы можем быть уверены."
10042030-30 = "Я больше не могу просто стоять в стороне."
10042030-31 = "[s1] «Ты говоришь как доктор из научно-фантастического фильма.» \n[s2] «...Ты вообще доктор или кто?»"
10042030-34 = "Доктор...?"
10042030-35 = "Слово «доктор» может означать многое, но подозреваю, что вы хотели сказать, что доверяете моему суждению."
10042030-36 = "Спасибо за комплимент."
10042030-37 = "Кроме того, здесь играет роль и моё собственное любопытство."
10042030-38 = "И это куда интереснее, чем запихивать хулиганов в машины Клуба экстренной медицинской помощи."
10042030-39 = "Так что... что вы теперь собираетесь делать?"
10042030-40 = "Я просто пойду по тем следам, которые у нас уже есть."
10042030-41 = "Т-Ты уверена...? Мы уже потеряли одну участницу..."
10042030-42 = "Верно, но думаю, всё равно будет весело."
10042030-44 = "Весело...?"
10042030-45 = "Разве хоть ЧТО-ТО из этого можно назвать весёлым...?"
10042030-46 = "Справедливый вопрос. Честно говоря, я вообще мало что называю весёлым."
10042030-47 = "Но сейчас я не могу подобрать лучшего слова для своих ощущений."
10042030-48 = "[s3] «Даже после того, что случилось с Иори...»\n[s4] «Может, нам стоит относиться ко всему немного серьёзнее...?»"
10042030-51 = "Не беспокойтесь. Мне уже очень весело, то есть я уже отношусь ко всему предельно серьёзно."
10042030-52 = "(Какая именно часть...?)"
10042030-53 = "Начнём поиски. Я пойду первой."
10042030-56 = "[ns] «Этого... как-то многовато.»"
10042030-57 = "По всему коридору ещё больше этой зелёной слизи..."
10042030-58 = "И чем дальше мы идём, тем её БОЛЬШЕ."
10042030-59 = "Ты права, Чинацу. Масса определённо увеличивается."
10042030-60 = "Ч-Что это значит? Что это значит?!"
10042030-61 = "Пока невозможно узнать, Джури. Просто продолжаем идти вперёд."
10042030-62 = "И посмотрим, насколько интереснее всё станет."
10042030-63 = "Не думаю, что «интереснее» — подходящее слово..."
10042030-64 = "Ух... Ах..."
10042030-65 = "...! Вы это слышали...?"
10042030-66 = "Слышала. Следующее тело, то есть «улика», то есть «жертва» должна быть где-то рядом."
10042030-67 = ""
10042030-69 = ""
10042030-70 = ""
10042030-71 = "С-Сэна?! Позволь мне пойти с тобой!"
10042030-72 = ""
10042030-74 = ""
10042030-76 = ""
10042030-81 = "Ух, ах..."
10042030-82 = ""
10042030-85 = "[ns] «В-Вы в порядке? Что случилось?!»"
10042030-86 = "Тот... класс вон там... Я услышала что-то... странное..."
10042030-87 = "Я просто хотела проверить. Я не думала... Ух..."
10042030-88 = ""
10042030-90 = ""
10042030-91 = ""
10042030-92 = ""
10042030-93 = "[ns5] «Это прямо учебниковый сюжетный ход...»\n[ns6] «Очень уж жирное предзнаменование.»"
10042030-96 = "Почему вы всё ещё так говорите, Сенсей? Что вы имеете в виду?"
10042030-97 = "Это отсылка к естественному ходу вещей. Другие назвали бы это клише."
10042030-98 = "...Теперь понимаете?"
10042030-99 = "Понимаю только, что вы вообще ни капли не серьёзны."
10042030-100 = "...Мне стоит извиниться за неё. Она всегда была немного... такой."
10042030-101 = "Что ж, пока это совпадает с тем, что случилось с Иори. За одним важным исключением..."
10042030-102 = "Здесь слизи как минимум вдвое больше."
10042030-103 = ""
10042030-104 = "В-Вдвое?"
10042030-105 = "След ведёт туда."
10042030-106 = "В класс. Идём."
10042030-113 = "Ч-Что ЭТО такое?!"
10042030-114 = "Ого..."
10042030-115 = ""
10042030-117 = ""
10042030-118 = "Слизь стала ещё гуще. Её достаточно, чтобы приклеить человека к стене."
10042030-119 = "И её становится всё больше."
10042030-120 = ""
10042030-122 = ""
10042030-123 = "Позвольте уточнить одну вещь. Насколько большим было существо, когда вы впервые его увидели?"
10042030-124 = "А...? Н-Ну, примерно с обычный блинчик..."
10042030-125 = "Размером с блинчик. Понятно. Тогда позвольте спросить всех..."
10042030-126 = "...похоже ли такое количество сиропа на то, что могло вытечь из обычного блинчика?"
10042030-127 = "[s] «Я бы точно так не подумал.»"
10042030-128 = "Верно. Тело, то есть «случай», то есть «жертва», которую мы нашли в коридоре, была покрыта ещё большим количеством сиропа, чем Иори."
10042030-129 = "Иными словами, здесь есть лишь одна возможность."
10042030-130 = "...Эта «штука» становится больше."
10042030-131 = "*ахает*"
10042030-132 = "[ns7] «За такой короткий промежуток времени...?»\n[ns8] «А как же закон сохранения массы...?»"
10042030-135 = "..."
10042030-136 = "Сенсей, вы правда ожидали, что хоть что-то из этого будет иметь смысл?"
10042030-137 = "[s9] «Н-Ну...»\n[s10] «Тут мне и правда нечего сказать...»"
10042030-140 = "Именно. В таких ситуациях искать логику — пустая трата времени."
10042030-141 = "Просто возьмите здравый смысл, всё, что знаете о науке, и уберите куда подальше."
10042030-142 = "Важно лишь принять происходящее здесь как факт."
10042030-143 = "Тогда мы сможем с восторгом предугадать, что случится дальше... то есть должным образом подготовиться."
10042030-144 = ""
10042030-146 = ""
10042030-147 = "*ахает*"
10042030-148 = "Рядом с классом. Нужно спешить."
10042030-149 = ""
10042030-157 = "[ns] «Э-Это...?!»"
10042030-158 = "К-Как вообще могло случиться нечто подобное...?"
10042030-159 = "Впечатляет сразу во многих смыслах."
10042030-160 = ""
10042030-162 = ""
10042030-163 = "Что ж, теперь всё ясно. Эта штука И ВПРАВДУ становится больше после каждого нападения."
10042030-164 = "Если её не остановить, вся Геенна может..."
10042030-165 = "...она может закончить как тот «Город Енотов», о котором я слышала."
10042030-166 = "Город... Енотов?"
10042030-167 = ""
10042030-169 = ""
10042030-170 = "[ns11] «Город Енотов...? Что это?»\n[ns12] «...Погодите, вы говорите о...?»"
10042030-171 = "...Видимо, не все о нём слышали."
10042030-172 = "Так называется город, где странный эксперимент вышел из-под контроля и заполонил улицы монстрами..."
10042030-173 = "...из видеоигры."
10042030-174 = "А, значит, вы знаете, Сенсей."
10042030-175 = "Тогда вы наверняка понимаете, что означает этот сюжетный ход."
10042030-176 = "Хотя он, кажется, немного выбивается из обычной последовательности..."
10042030-177 = "Я кое-что слышала о подобных явлениях. Это не первый случай, когда сущность появляется таким образом."
10042030-178 = "Конечно, я и представить не могла, что она окажется настолько интригующей... прошу прощения, настолько огромной."
10042030-179 = "Что?! Т-Ты знала? Обо всём этом?!"
10042030-180 = "Не больше, чем из случайных слухов. Страшилки, городские легенды..."
10042030-181 = "...ну, вроде «Я слышал, в Клубе школьной столовой живёт монстр!» и тому подобного."
10042030-182 = "Да о чём ты вообще говоришь?!"
10042030-183 = "Что ж, я стараюсь проверять каждый слух, который слышу."
10042030-184 = "Поэтому, если опираться на то, что я помню, эта ситуация..."
10042030-185 = "...что ж, она стала гораздо критичнее и масштабнее, чем была вначале."
10042030-186 = "Что?!"
10042030-187 = "[ns13] «Масштабнее...?!»\n[ns14] «Критичнее...?!»"
10042030-190 = "Ну, иначе всё было бы не так интересно..."
10042030-191 = "...то есть страшно."
10042030-192 = "Н-Но...!"
10042030-193 = "Но это значит, что из-за меня все в Геенне в опасности...!"
10042030-194 = "...? Хм? Вовсе нет. Если смотреть шире, это всего лишь небольшая неприятность на пути."
10042030-195 = "Ну и что, что есть мерзкий сироп, от которого люди теряют сознание."
10042030-196 = "По статистике, нечто такого масштаба случается раз-два каждые несколько месяцев."
10042030-197 = "По сравнению с тем, что может устроить Отдел горячих источников или террористические организации... это действительно мелочь."
10042030-198 = "Ну, Я рада, что ТЫ так считаешь, но проблема всё равно остаётся!"
10042030-199 = "С Отделом горячих источников вообще ничто не сравнится. Это отдельная категория."
10042030-200 = "*вздыхает*"
10042030-201 = "Ладно. Значит, всё дошло до этого... в самом конце концов..."
10042030-202 = "[s15] «У тебя есть какое-то тайное решение?»\n[s16] «Самый конец концов...?»"
10042030-205 = "План... в некотором роде. Назовём его «Сломанная стрела»."
10042030-206 = "И да. Он решит эту проблему. Желательно до того, как о ней узнает Общество Пандемониума."
10042030-207 = "Если они ВСЁ-ТАКИ узнают, Дисциплинарному комитету устроят немалую головомойку."
10042030-208 = ""
10042030-209 = "Комната Префектурной команды Геенны"
10042030-211 = ""
10042030-212 = "Да, чем могу помочь? Я очень занята, так что, пожалуйста, покороче."
10042030-213 = ""
10042030-215 = ""
10042030-216 = ""
10042030-217 = "...Простите?"
10042030-218 = "Что вы вообще...?"
