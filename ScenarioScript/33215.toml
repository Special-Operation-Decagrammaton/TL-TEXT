[translation]
33215-2 = "O choque entre duas ETOs... Aquelas que acreditam no Paraíso e aquelas que o negam..."
33215-3 = "...Entendo."
33215-4 = "\"É possível provar a verdade daqueles que alcançaram o Paraíso?\""
33215-5 = "Essa exigência violenta e impossível de prova, que nos força a escolher entre \"SIM\" ou \"NÃO\"..."
33215-6 = "Contudo, a resposta do Sensei foi: \"Não há necessidade de responder a isso\"..."
33215-7 = "Em vez de escolher um dos lados à força... um Paraíso que se prova através do ato de acreditar..."
33215-8 = "...Eu jamais havia pensado nisso dessa forma."
33215-9 = "Não. Na verdade, o Paraíso sempre existiu bem ao nosso lado exatamente dessa maneira..."
33215-10 = "Talvez fosse isso que aquela pergunta realmente quisesse dizer, não é?"
33215-11 = "Que absurdo... Isso está longe de ser uma prova ou qualquer coisa do tipo."
33215-12 = "Contudo... sim. A derrota é minha, Sensei."
33215-13 = "Mesmo que não possa ser provado, é...? Sim, eu estava completamente enganada. Esta não era esse tipo de história."
33215-14 = "Para começo de conversa, tentar desafiar um adulto e vencer já era uma imprudência desde o princípio, não é...?"
33215-19 = "Porque os adultos sempre acabam vencendo assim, das maneiras mais inesperadas."
33215-21 = "Próximo;O Nome do Paraíso (3)"
