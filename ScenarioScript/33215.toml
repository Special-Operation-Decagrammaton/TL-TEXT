[translation]
33215-2 = "Столкновение двух разных ОЭД... Одна верит в рай, другая его отрицает."
33215-3 = "Как интересно."
33215-4 = "«Можно ли доказать, что кто-нибудь когда-либо достиг рая?»"
33215-5 = "Райский парадокс, и всё же он требует ответа."
33215-6 = "Возможно, вопрос не настолько ошибочен, как многие считают. Вы решили ответить, что доказательства вообще не нужны."
33215-7 = "Вместо этого ваш рай существует просто благодаря силе веры."
33215-8 = "Такая возможность мне никогда не приходила в голову."
33215-9 = "Тогда можно утверждать, что рай существовал всегда — здесь, рядом со всеми нами."
33215-10 = "Возможно, именно это вы и имели в виду."
33215-11 = "Это настолько дерзко, что даже смешно. И ничего не доказывает."
33215-12 = "И всё же я признаю ваше превосходство, Сенсей."
33215-13 = "Теперь я понимаю эту историю. Я ошибалась."
33215-14 = "Оглядываясь назад, пожалуй, изначально было глупо бросать вызов взрослому."
33215-15 = ""
33215-17 = ""
33215-18 = ""
33215-19 = "В конце концов, вы прекрасно умеете вырывать победу из пасти поражения."
33215-21 = "Следующий эпизод;Имя рая, часть 3"
