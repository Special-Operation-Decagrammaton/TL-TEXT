[translation]
10046170-2 = ""
10046170-3 = "Член Оперативной группы Правосудия. Я тебя искала."
10046170-4 = "Ты... знаешь Кохару, верно?"
10046170-5 = ""
10046170-7 = ""
10046170-8 = ""
10046170-9 = "(Ширасу Азуса. Студент Кружка дополнительных занятий вместе с Кохару... Если бы всё было только так.)"
10046170-10 = ""
10046170-12 = ""
10046170-13 = ""
10046170-14 = "(Она проблемный студент, устроивший бесчисленное количество происшествий. Из-за характерного бесстрастного выражения лица её прозвали «Ледяной королевой».)"
10046170-15 = "(Несмотря на хрупкую внешность, она специализируется на тактике истощения, заставляя противника терять как можно больше сил и крови.)"
10046170-16 = "(...Честно говоря, совсем не тот человек, с которым хотелось столкнуться в такой загруженный день.)"
10046170-17 = ""
10046170-19 = ""
10046170-20 = ""
10046170-21 = "Ну, ты меня нашла! Чем могу помочь, Азуса?"
10046170-22 = "Я пришла не «за» чем-то."
10046170-23 = "Я пришла помочь тебе."
10046170-24 = ""
10046170-26 = ""
10046170-27 = "...А?!"
10046170-28 = "Это здорово... но разве ты не ненавидишь Оперативную группу Правосудия?"
10046170-29 = "Ненавижу?"
10046170-30 = "Ну... потому что мы постоянно сражаемся друг с другом?"
10046170-31 = "Да. С тех пор как я перевелась в Тринити, мы несколько раз сталкивались."
10046170-32 = "Это происходило потому, что вы обеспечивали безопасность Тринити. Это была ваша обязанность. Ничего личного."
10046170-33 = "Я восхищаюсь тем, как ваша Оперативная группа выполняет задания."
10046170-34 = "Эм, спасибо."
10046170-35 = "Это ещё не всё."
10046170-36 = "Благодаря Оперативной группе Правосудия я обрела друзей. Я дорожу Хифуми, Маширо и вашим президентом."
10046170-37 = "Я благодарна вашей организации за то, что получила такой опыт."
10046170-38 = "А... Понятно."
10046170-39 = "Тогда ты хочешь...?"
10046170-40 = "...Выразить благодарность. Тринити научила меня ценить это."
10046170-41 = "Разумеется, тебе ещё нужно согласиться на мою компанию..."
10046170-42 = "Хаха... Ты нечто особенное, редкость. И это хорошо!"
10046170-43 = "...Конечно! Мне всё равно нужна помощь. Будем считать, что мы в расчёте!"
10046170-44 = "Сомневаюсь, что одного дня добровольной помощи будет достаточно..."
10046170-45 = "...но я тебя не подведу. Я отлично подготовлена и справлюсь с любой ситуацией."
10046170-46 = "Ага... только ещё раз уточню... Ты ведь понимаешь, чем я здесь занимаюсь, да?"
10046170-47 = "Разумеется. Ты мобильный боец, выявляющий и ликвидирующий противников."
10046170-48 = "Что...? «Ликвидирующий»...?"
10046170-49 = "Я понимаю, что мы уже перегружены. Проникновение началось, и мы должны дать отпор."
10046170-50 = "Времени мало. Выдвигаемся."
10046170-51 = ""
10046170-53 = ""
10046170-54 = ""
10046170-55 = ""
10046170-56 = "...Лучше за ней присмотреть."
