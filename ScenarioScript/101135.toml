[translation]
101135-7 = "Отступаем, отступаем!"
101135-8 = "Отступить внутрь здания и перегруппироваться!"
101135-9 = ""
101135-11 = ""
101135-13 = ""
101135-14 = ""
101135-17 = "Магазин на первом этаже захвачен!"
101135-18 = "Вы пришли помочь, Специалисты по утилизации бэнто!"
101135-19 = "...Сора?"
101135-20 = "В этом здании было столько жестоких происшествий, что я... теперь эксперт по укрытию на складе. Наверное, уже привыкла..."
101135-21 = "...Прости за неприятности."
101135-22 = "Нет, спасибо, что спасли меня! О! Хотите просроченные бэнто? У нас много."
101135-23 = "...Спасибо. С удовольствием съем после завершения миссии."
101135-25 = "Готово! Вход чист!"
101135-26 = "Спасибо за помощь, Бюро общественного порядка."
101135-27 = "Разве вы не должны быть образцовыми законопослушными полицейскими? Помогать нам как-то не вяжется с вашим паиньским образом."
101135-28 = "Преступники только смеяться будут над полицейскими, которые сами нарушили закон."
101135-29 = "Ха-ха... Странно слышать такое от отряда RABBIT..."
101135-30 = "Всё нормально, ведь мы помогаем директору Канне."
101135-31 = "Студентов Валькирии преступники и так постоянно высмеивают..."
101135-32 = "Мы закрепимся у входа, чтобы подкрепления не ударили вам в спину, а вы идите возвращать здание!"
101135-33 = "Рассчитываем на вас."
101135-35 = "Начиная с этого момента мы входим в здание Шале и одновременно выполняем две задачи."
101135-36 = "Первая — отбить у PMC Производственную камеру в подвале Шале."
101135-37 = "Вторая — спасти главного администратора, запертую где-то в здании Шале."
101135-38 = "Но... мы не знаем, где именно она находится."
101135-39 = "Если ворвёмся, не зная местоположения заложницы, поставим её безопасность под угрозу."
101135-40 = "Здесь мы можем помочь."
101135-41 = "А! В-вы кто...?"
101135-42 = "М-Мы из Генерального студенческого совета."
101135-43 = "[s] «Момока! Аюму! Вы в безопасности!»"
101135-45 = "Ага. Мы в подземном центре связи башни Санктум. Ты даже не представляешь, как трудно было прятаться, чтобы PMC нас не заметили."
101135-46 = "Кто бы мог подумать, что моя нора для прогулов окажется такой полезной? Ха-ха-ха!"
101135-47 = "М-Момока...!"
101135-48 = "Эй, зато благодаря этому мы восстановили журнал связи и определили, где держат Рин."
101135-49 = "Третья пустая комната над общежитием Шале."
101135-50 = "Сенсей... Пожалуйста, спасите Рин..."
101135-52 = "[ns] «Я доставлю её к вам целой и невредимой.»"
101135-53 = "...Да!"
101135-55 = "Следующий эпизод; Операция по возвращению Шале 2"
