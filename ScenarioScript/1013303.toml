[translation]
1013303-1 = "Монолог"
1013303-2 = "Я работал один в комнате, когда решил выйти немного проветриться."
1013303-3 = ""
1013303-7 = "[ns1] «Как тихо...» \n[ns2] «Интересно, чем занимается Рио.»"
1013303-10 = "А... Не здесь."
1013303-11 = "[ns] «...?»"
1013303-12 = "Не хочу мешать Сенсею..."
1013303-13 = "Нужно вести себя как можно тише."
1013303-14 = "[ns] «...??»"
1013303-15 = "Любопытство взяло верх, и я пошёл на звук её голоса."
1013303-16 = ""
1013303-22 = "[ns] «Рио? Ты здесь?»"
1013303-23 = "Хм..."
1013303-24 = "[s] «Рио...?»"
1013303-25 = "..."
1013303-26 = "(Она не заметила, что я здесь...)"
1013303-27 = "(Она так сосредоточена... Не стоит мешать. Пока просто посмотрю.)"
1013303-28 = "Да. Вот там. Как можно осторожнее..."
1013303-29 = "Это... Слишком сильно. Нужно медленнее..."
1013303-30 = "...Идеально. Вот так."
1013303-31 = "А, подожди. Там всё очень хрупкое, обращайся осторожно."
1013303-32 = "Да... Вот там."
1013303-33 = "Хм..."
1013303-34 = "...Фух, хорошая работа."
1013303-35 = "Запомни это ощущение. А теперь ещё раз."
1013303-36 = "[ns] «...?»"
1013303-37 = "...Монолог Рио продолжался и продолжался."
1013303-38 = "Я боялся, что её увидят другие, когда вернутся, поэтому снова попытался привлечь её внимание."
1013303-39 = "[ns] «Эм... Рио?»"
1013303-40 = "Теперь попробуем вот здесь."
1013303-41 = "Теперь, когда ты привыкла, сможешь сделать лучше, правда?"
1013303-42 = "[s] «Р-Рио...?»"
1013303-43 = "...?"
1013303-44 = ""
1013303-46 = ""
1013303-47 = "...!!"
1013303-48 = "С-Сенсей? Как давно вы...?"
1013303-49 = "[s] «С того момента, когда ты сказала быть максимально осторожной?»"
1013303-50 = "Э-Это..."
1013303-51 = "...Значит, вы видели."
1013303-52 = "Нужно было сказать, что вы здесь. Вы меня напугали."
1013303-53 = "[s] «Что... именно ты делала?»"
1013303-54 = "Если честно... немного неловко."
1013303-55 = "[s] «П-Понятно! Тогда дальше спрашивать не буду!»"
1013303-56 = "...Всё нормально. Раз вы уже видели, что я это делаю, скрывать нечего."
1013303-57 = "Я модернизировала транспортный корабль."
1013303-58 = "С помощью этого AMAS."
1013303-59 = ""
1013303-61 = ""
1013303-62 = ""
1013303-63 = "[ns] «А...!»"
1013303-64 = "Во время недавних операций мне удалось добыть несколько полезных деталей."
1013303-65 = "Поэтому я решила воспользоваться возможностью, пока корабль пустует."
1013303-66 = "И я..."
1013303-67 = "...ещё хотела провести модернизацию втайне и удивить всех..."
1013303-68 = "[s3] «П-Понятно!»\n[s4] «Я так тобой горжусь, Рио!»"
1013303-71 = "Да. Спасибо..."
1013303-72 = "Кстати... Почему у вас покраснело лицо? Это нерациональная реакция."
1013303-73 = "...А? Я странно разговаривала сама с собой?"
1013303-74 = "Вот как? Но я ведь произносила вполне обычные команды."
1013303-75 = ""
1013303-77 = ""
1013303-78 = ""
1013303-79 = "Осторожно."
1013303-80 = "Медленно."
1013303-81 = "Прекрасно."
1013303-82 = "Тут хрупко, будь нежнее."
1013303-83 = "...Примерно это я и говорила, верно?"
1013303-84 = ""
1013303-86 = ""
1013303-87 = "...Ничего из этого не было «странным», правда?"
1013303-88 = ""
1013303-90 = ""
1013303-91 = ""
1013303-92 = "[ns] «Д-Да!! Совсем не странно!»"
1013303-93 = "...Теперь я запуталась ещё больше."
1013303-94 = "Должно быть, вы знаете что-то, чего не знаю я."
1013303-95 = "Но я считала себя экспертом в этой области."
1013303-96 = "Может быть... Вас беспокоит, что я решила работать тайком?"
1013303-97 = "Я действительно считала такой подход наиболее рациональным."
1013303-98 = "Я бы не стала переходить границы... Не стала бы..."
1013303-99 = "[s] «Дело совершенно не в этом!»"
1013303-100 = "Хм, ваша реакция выглядит искренней. Значит, причина и правда не в этом."
1013303-101 = "Но других рациональных вариантов я придумать не могу."
1013303-102 = "Что вы от меня скрываете, Сенсей?"
1013303-103 = "Пожалуйста, скажите честно, чтобы я могла разобраться в ситуации."
1013303-104 = "[s] «А, ты, должно быть, устала после всей этой работы! Хочешь, я сделаю тебе кофе?»"
1013303-105 = "Даже я замечаю, когда вы настолько очевидно пытаетесь сменить тему, Сенсей."
1013303-106 = "...Однако ради чашки кофе, приготовленной вами, я закрою на это глаза."
1013303-107 = "При одном условии."
1013303-108 = "Раз уж всё равно будете делать кофе, можете остаться и помочь мне?"
1013303-109 = "Когда я надеваю HMD, обзор перекрывается, и работать становится неудобно."
1013303-110 = "Вы ведь не заняты?"
1013303-111 = "[s] «Я останусь! Я совершенно свободен!»"
1013303-112 = "Тогда я рассчитываю на вас."
1013303-113 = "Если это вы... я знаю, что могу доверять вам как помощнику."
1013303-115 = "Я быстро приготовил кофе, а затем помог Рио с модернизацией транспортного корабля."
1013303-116 = "Я был рад, что каким-то образом выбрался оттуда, так и не дав ей понять истинную причину..."
