[translation]
10043020-1 = "Эпизод 2;Разбуди меня перед камбэком"
10043020-3 = "Здесь становится жарко, правда, Тренер?"
10043020-4 = "Толпа со всех сторон кричит и орёт."
10043020-5 = "[s] «На таких матчах всегда так.»"
10043020-6 = "...Хм."
10043020-7 = "Странно."
10043020-8 = ""
10043020-11 = "[ns] «Что странного?»"
10043020-12 = "Просто всё это так отличается от того, к чему я привыкла."
10043020-13 = ""
10043020-15 = "В Клубе спортивных тренировок всё построено на концентрации и дисциплине."
10043020-16 = "Анализ образа жизни ради максимального результата, оптимизированные графики кардио- и силовых тренировок, контроль питания..."
10043020-17 = "...и конечная цель — создать тело, которое ты хочешь."
10043020-20 = "Там нет места, чтобы кто-то вмешивался. Всё основано на анализе и личной воле."
10043020-21 = "Конечно, можно ПРОСИТЬ о помощи, но в центре всё равно остаёшься только ты."
10043020-22 = "Это почти как разновидность современного аскетизма."
10043020-23 = "В самой основе — борьба с самим собой."
10043020-24 = "[s] «Очень глубокий подход.»"
10043020-25 = "Правда? Для меня это просто очевидная истина."
10043020-26 = ""
10043020-28 = ""
10043020-29 = "Но... возвращаясь к теме, командные виды спорта выглядят полной противоположностью."
10043020-30 = "Правила я понимаю, конечно. Ударить по мячу, сравнить статистику..."
10043020-31 = "...а в процессе игрокам приходится сотрудничать, действовать сообща, выполнять указания и при этом показывать собственное мастерство."
10043020-32 = "В каком-то смысле это гармонично."
10043020-33 = "Кажется, я начинаю понимать, откуда берётся вся эта страсть."
10043020-34 = "Но... эм... как бы сказать?"
10043020-35 = "Я начинаю думать, что у этой страсти есть и обратная сторона."
10043020-36 = "Ведь мы ищем любого, кто ведёт себя подозрительно..."
10043020-37 = "...потому что думаем, что он может быть связан с преступником, но..."
10043020-38 = "...ну, неловко это говорить..."
10043020-39 = "...но на данный момент подозрительно ведут себя практически все."
10043020-40 = ""
10043020-44 = "Отдельное спасибо всем болельщикам, которые сегодня пришли на стадион поддержать «Героев»!"
10043020-45 = "Большое вам спасибо. Мы вас любим!"
10043020-46 = ""
10043020-51 = ""
10043020-52 = "Если любите, так докажите уже!"
10043020-53 = "Ага, если бы вам было не плевать, вы бы тренировались усерднее!"
10043020-54 = ""
10043020-59 = ""
10043020-60 = "Да этот мяч наверняка фальшивый! Надо его разрезать!"
10043020-61 = "Может, внутри теннисный мяч! Это многое бы объяснило!"
10043020-62 = ""
10043020-64 = ""
10043020-66 = ""
10043020-67 = "Начните уже играть на победу, а не придумывать новые способы проиграть!"
10043020-68 = ""
10043020-72 = "САМИ сюда выходите и болейте! А МЫ будем играть!"
10043020-73 = "Просто уйдите, чтобы перестать тянуть нас вниз!"
10043020-74 = ""
10043020-76 = ""
10043020-78 = ""
10043020-79 = "..."
10043020-80 = "Честно говоря, я видела здесь и похуже. Но... да, иногда они такие."
10043020-81 = "[s] «Фух. Бейсбол.»"
10043020-82 = "Так теперь это считается «поддержкой»?"
10043020-83 = "Или к этому слову добавили новое значение, пока я не смотрела?"
10043020-84 = "[s1] «Наверное, они злятся именно потому, что им не всё равно...?»\n[s2] «Если бы это было неважно, они бы так не расстраивались...»"
10043020-87 = "И всё же всему есть предел, понимаете?"
10043020-88 = ""
10043020-91 = "Чтобы поблагодарить болельщиков за поддержку, после игры мы подготовили автограф-сессию—"
10043020-93 = "Нам не нужны автографы! Нам нужны победы! Помните, что это такое?"
10043020-94 = "На этот матч нужно предупреждение о контенте! У меня сейчас удар случится от одного вида этого позорища!"
10043020-95 = ""
10043020-100 = "Эй, питчер! Просто бросай прямо по центру! Пусть отбивают! Да всё равно!"
10043020-101 = "Готов спорить с кем угодно десять к одному, эта команда НИКОГДА не победит!"
10043020-102 = "Я во всём могу сомневаться, но в этом уверен."
10043020-103 = ""
10043020-105 = ""
10043020-107 = ""
10043020-108 = "Простите, пропустите..."
10043020-109 = ""
10043020-112 = ""
10043020-113 = "А? Ты кто? А, да. Ты! Дай напиток, быстро!"
10043020-114 = "*вздох* Да, мне тоже не помешало бы что-нибудь выпить и остыть."
10043020-115 = ""
10043020-118 = ""
10043020-119 = "Два напитка, сейчас будут!"
10043020-120 = ""
10043020-122 = ""
10043020-125 = ""
10043020-126 = "Бе-е! Что ЭТО такое?! Всё зернистое и... яичное!"
10043020-127 = "Теперь у меня просто живот раздуло и всё забито! Будто внутри пузырится!"
10043020-129 = "Для протеинового напитка описание вполне точное."
10043020-130 = "В нём нет ни лактозы, ни жира. Никаких лишних калорий, никакого риска непереносимости лактозы."
10043020-131 = "К тому же здесь быстро усваиваемый изолят сывороточного белка. Аминокислоты попадают именно туда, куда нужно — в мышцы."
10043020-132 = "Но, как и любой протеиновый напиток, его следует пить медленно."
10043020-133 = "Если пить слишком быстро, даже без лактозы и жира может немного расстроиться желудок."
10043020-134 = ""
10043020-137 = ""
10043020-138 = "Ты НАРОЧНО пытаешься меня выбесить?! Кто пьёт протеин на бейсбольном матче?!"
10043020-139 = "Знаешь что? Я уже не могу смотреть эту игру. Просто отвернусь и сорвусь на тебе!"
10043020-140 = ""
10043020-142 = ""
10043020-144 = "..."
10043020-145 = "Хм, они ещё сильнее возбуждены, чем остальная толпа..."
10043020-146 = "Они кричали питчеру, чтобы тот дал соперникам отбить мяч, значит, явно хотят поражения команды..."
10043020-147 = "...и даже после полезного протеинового напитка всё ещё ведут себя агрессивно."
10043020-148 = ""
10043020-151 = ""
10043020-152 = "Она что, теперь сама с собой бормочет? Да что с ней НЕ ТАК?"
10043020-153 = ""
10043020-156 = ""
10043020-157 = "Тренер."
10043020-158 = "Это точно преступники."
10043020-159 = ""
10043020-162 = "[ns] «КАК ты вообще пришла к такому выводу?!»"
10043020-163 = "Ну, даже на фоне всего ненормального поведения вокруг..."
10043020-164 = "...эти двое выделяются сильнее всех."
10043020-165 = "Единственный человек, которого мы слышали здесь и который был НАСТОЛЬКО антисоциален, — голос по телефону."
10043020-166 = "Все кусочки идеально сходятся!"
10043020-167 = ""
10043020-170 = ""
10043020-171 = "Не знаю, о чём ты там треплешься..."
10043020-172 = "...но сейчас тебе будет очень плохо!"
10043020-173 = ""
10043020-176 = ""
10043020-177 = "Хорошо, Тренер..."
10043020-178 = "...пора предать их правосудию."
10043020-179 = "[s] «Это нормально? Это правда нормально?!»"
10043020-180 = "Доверьтесь мне."
10043020-181 = "И не переживайте за них. Я знаю, сейчас они в стрессе..."
10043020-182 = "...но когда всё закончится, я проведу с каждой индивидуальную тренировку один на один."
10043020-183 = "[s] «Погоди, а зачем тебе вообще...?»"
10043020-184 = ""
10043020-186 = ""
10043020-187 = "Потому что упражнения снимают стресс, очевидно же. Выпотеешь — и всё."
10043020-188 = "Лучшего решения от стресса просто не существует."
10043020-190 = "Заткнись и жри свинец!"
10043020-191 = "Я научу тебя не связываться с разъярённым фанатом!"
