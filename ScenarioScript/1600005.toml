[translation]
1600005-1 = "Неправильный способ"
1600005-2 = "С-Сенсей! Вы правда снова пришли..."
1600005-3 = "Спасибо, что согласились."
1600005-4 = "Я-я думала, вы больше никогда не захотите меня видеть..."
1600005-5 = "Не переживать из-за прошлого раза? Я-я не могу..."
1600005-6 = "П-простите! Я не хотела вам перечить. Я имела в виду...!"
1600005-7 = "Х-хорошо. Постараюсь не переживать. Ещё раз спасибо..."
1600005-8 = "Н-на этот раз я хочу подарить вам нормальный подарок."
1600005-9 = ""
1600005-10 = ""
1600005-11 = "В-вот. Не знаю, понравится ли вам..."
1600005-12 = "[s1] «Модель ограниченного выпуска?!»\n[s2] «Фигурка аниме-девушки?!»"
1600005-13 = "Т-там ещё есть. Вот... и ещё... Я подумала, вам может понравиться, так что берите всё."
1600005-14 = "Т-там ещё есть. Вот... и ещё... Я подумала, вам может понравиться, так что берите всё."
1600005-15 = "Я-я не делала их сама, как первый подарок... так что с ними не должно быть ничего не так. И ещё раз простите за прошлый раз..."
1600005-16 = ""
1600005-18 = "(Из свёртка на спине Харуки хлынул целый поток коллекционных вещей.)"
1600005-19 = "(Каждая из них невероятно дорогая, и истинную ценность поймёт только человек в теме.)"
1600005-20 = "(Если не считать вопроса, откуда Харука вообще узнала о таких вещах — где она их достала?)"
1600005-21 = "Н-ну как вам, Сенсей?"
1600005-22 = "О-они... недостаточно хорошие?"
1600005-23 = "[s3] «Они великолепны. Каждая из них потрясающая!»\n[s4] «Где ты всё это достала?»"
1600005-24 = "..."
1600005-25 = "..."
1600005-26 = "Хе... Хе-хе."
1600005-27 = "Рада, что вам нравится... Сенсей..."
1600005-28 = "Если вам такое нравится... я достану ещё."
1600005-29 = "*ж-ж-ж* *ж-ж-ж*"
1600005-30 = "...?"
1600005-31 = "А? Почему канал вдруг переключился?"
1600005-32 = "Срочные новости? Что происходит?"
1600005-33 = "Эм... Ну..."
1600005-34 = "[s] «Харука?»"
1600005-35 = "..."
1600005-36 = ""
1600005-37 = "(Один за другим все телевизоры переключились на один и тот же новостной канал.)"
1600005-38 = "Срочные новости. Сегодня рано утром в нескольких сувенирных магазинах торгового района произошла серия ограблений."
1600005-39 = "Все ограбления объединяет одна особенность: преступник похищал только ценные и редкие товары, не трогая кассы."
1600005-40 = "Предполагается, что основной целью преступника была не денежная выгода."
1600005-41 = "Следователи считают, что преступник всё ещё находится в районе Тринити..."
1600005-42 = "..."
1600005-43 = "[s] «Харука»."
1600005-44 = "...!"
1600005-45 = "Я-я могу объяснить!"
1600005-46 = "Я-я не думала, что они так быстро заметят! Я была уверена, что расследование начнут только к вечеру!"
1600005-47 = "Это... не то объяснение, которое вы хотели? Точно. Нужно было лучше замести следы..."
1600005-48 = "А? И это не то, что вы имели в виду? Э-эм. Угх... Простите."
1600005-49 = "Простите... Мне так жаль. Простите простите простите простите..."
1600005-50 = "[s] «Пойдём всё вернём»."
1600005-51 = "Но зачем?! Они же не едут сюда. Они ещё даже не поняли, что это была я..."
1600005-52 = "Н-нет... я всё ещё не пытаюсь вам перечить..."
1600005-53 = "Я-я поняла... Раз вы так сказали, Сенсей."
1600005-55 = "(После этого мы с Харукой обошли все магазины торгового района и вернули украденные вещи.)"
1600005-56 = "(Мы долго извинялись, и поскольку товары оставались в коробках, магазины приняли их обратно — всё обошлось.)"
1600005-58 = "..."
1600005-59 = "Простите. Мне так жаль..."
1600005-60 = "Из-за меня вам пришлось извиняться перед всеми ними."
1600005-61 = "Я хотела подарить вам подарок, а в итоге создала ещё больше проблем. Я просто..."
1600005-62 = "Я не хочу..."
1600005-63 = "...больше вас беспокоить, Сенсей."
1600005-64 = "[s5] «Ты мне не мешаешь.»\n[s6] «Не нужно покупать моё время подарками.»"
1600005-65 = "Не... мешаю?"
1600005-66 = "Не нужно...?"
1600005-67 = "Н-но... я доставила вам столько проблем."
1600005-68 = "Думаете, мне стоит чувствовать себя свободнее рядом с вами? Мне...? С вами...?"
1600005-69 = "Э-это невозможно! Я-я не говорю, что не хочу этого! Но всё же...!"
1600005-70 = "Эм... Угх..."
1600005-71 = "Я постараюсь. Если вы говорите, что всё хорошо, т-тогда постараюсь."
1600005-72 = "Эй, Сенсей?"
1600005-73 = "Вы точно... не сердитесь на меня? Вы ведь не ненавидите меня?"
1600005-74 = "Совсем? Но почему? Как? Я ведь такая неудачница..."
1600005-75 = "[s7] «Я твой учитель. Я бы никогда так не поступил.»\n[s8] «Обязанность учителя — принимать студентов такими, какие они есть.»"
1600005-76 = "А? Ч-что вы такое говорите...?"
1600005-77 = "А? Ч-что вы такое говорите...?"
1600005-78 = "Я не совсем понимаю, что вы имеете в виду... и почему этого достаточно."
1600005-79 = "Когда-нибудь в будущем... я пойму?"
1600005-80 = "..."
1600005-81 = "П-простите. Жалко, что я всё ещё не понимаю."
1600005-82 = "Хорошо. Сделаю, как вы говорите..."
1600005-83 = "Хе-хе..."
1600005-84 = "Спасибо, Сенсей."
1600005-86 = "(Харука ещё некоторое время неловко стояла рядом, а затем быстро ушла.)"
1600005-87 = "(По дороге домой я купил несколько коллекционных вещей, которых никогда бы не нашёл без Харуки.)"
