[translation]
33010-1 = "Эпизод 1;Разбор последствий, часть 1"
33010-4 = "Тайная комната"
33010-5 = ""
33010-6 = "Юризоно Сэя?"
33010-7 = "Я ждала тебя, Ширасу Азуса из филиала Ариуса."
33010-8 = "Ты... ждала?"
33010-9 = "Да. Потому что всё это уже приходило ко мне во сне."
33010-10 = "Объяснить сложно — предвидение. Можешь считать это способностью видеть «вещие сны»."
33010-11 = "Они снятся мне часто: сны, которые становятся реальностью. И сны, которые от реальности не отличить."
33010-12 = "Значит, ты знаешь, что я сейчас сделаю?"
33010-13 = "Да. Ты пришла уничтожить мой нимб."
33010-14 = "В этой миссии были и другие, но только ты смогла зайти так далеко. Ты очень талантлива, Азуса."
33010-15 = "Тогда почему ты не сбежала?"
33010-16 = "Если хочешь знать... потому что это было бы бессмысленно."
33010-17 = "Всё тщетно. Как гласит мудрое изречение, которое так любит Ариус. Для человека вроде меня, способного видеть будущее, сопротивление бессмысленно."
33010-18 = "Смерть в Кивотосе встречается нечасто, но это не значит, что мы от неё свободны. Пусть мы её и не видим, пока дышим, смерть всегда остаётся рядом."
33010-20 = "Уничтожить чей-то нимб — значит убить его. Значит, кто-то желает моей смерти."
33010-21 = "И вот ты здесь. Ты добралась сюда и проникла в тайную комнату, так и не будучи замеченной. Ты, Ширасу Азуса, студент филиала Ариуса."
33010-22 = ""
33010-23 = "Ты когда-нибудь раньше уничтожала нимб?"
33010-24 = "Нет, но я знаю как... Меня учили."
33010-25 = "Учили?"
33010-26 = "Нимб разрушится, если снова и снова наносить достаточно тяжёлые ранения."
33010-27 = "Студент Кивотоса может получить десяток попаданий 5,56-мм пулями, и это всё равно не станет смертельной раной..."
33010-28 = "...но при достаточном количестве боеприпасов, времени и тактическом превосходстве уничтожить нимб одним лишь огнестрельным оружием возможно."
33010-29 = "Если достаточно долго лишать человека еды и воды, долго душить, дать потерять достаточно крови, довести до переохлаждения или другого тяжёлого состояния..."
33010-30 = "Любого из этих способов достаточно, чтобы уничтожить нимб."
33010-31 = "Насколько я понимаю, ты ещё и особенно хрупкая, Юризоно Сэя."
33010-32 = "Думаешь, твоего оружия хватит?"
33010-33 = "В большинстве случаев — да. Но у меня мало времени и сейчас нет тактического преимущества."
33010-34 = "Поэтому я принесла эту бомбу. Ею я могу мгновенно уничтожить твой нимб."
33010-35 = "Бомба, способная разбить нимб? Я никогда не слышала о таком оружии."
33010-36 = "Должно быть, именно этому Ариус посвящает своё обучение. Как уничтожать нимбы — как убивать."
33010-37 = "Разумеется. Школа — место для учёбы, разве нет? Именно этому меня там и учили."
33010-38 = "..."
33010-39 = "Понятно. Значит, вот во что превратился Ариус."
33010-40 = ""
33010-42 = ""
33010-43 = ""
33010-44 = "Ты действительно готова стать убийцей, Азуса?"
33010-45 = "..."
33010-47 = "Я уже видела это. Насколько сильно ты боишься стать убийцей."
33010-48 = "Убийство остаётся убийством. Хотела ты этого или нет, был ли у тебя другой выбор..."
33010-49 = "Ничто из этого не имеет значения. Это черта, после которой назад уже не вернуться. Ты будешь нести это с собой столько, сколько останешься в этом мире."
33010-50 = "Отчаяние, боль, ярость, сожаление, бессилие и беспомощность, которые ты почувствуешь... Никто никогда не сможет по-настоящему разделить это, а со временем и эти чувства растворятся в ничто — как и ты."
33010-51 = "Тебе всю жизнь повторяли: vanitas vanitatum — такова истина мира."
33010-52 = "Но, насколько я вижу, ты живое противоречие. Ты одновременно веришь в эти слова и не веришь им."
33010-54 = "Разве не так?"
33010-55 = "Именно об этом ты думала, глядя на тот цветок."
33010-56 = "«Даже если всё тщетно... я должна продолжать бороться»."
33010-57 = "Это лежит в самой основе твоего существа — образ, который ты видишь, когда закрываешь глаза. Сначала я не могла его понять..."
33010-58 = "...но теперь всё совершенно ясно."
33010-59 = ""
33010-60 = "Ты пришла сюда не убивать меня. Ты пришла за советом."
33010-61 = "Советом о своей борьбе."
33010-63 = "Комната собраний Сестринства"
33010-64 = ""
33010-65 = "Вы в порядке, Сенсей [USERNAME]?"
33010-66 = "[s1] «Кажется, я ненадолго задремал.»\n[s2] «Мне будто приснился какой-то сон...»"
33010-67 = "Я знаю, что в последнее время вы заняты то одним, то другим, но буду благодарна, если вы немного сосредоточитесь."
33010-68 = "Я знаю, что в последнее время вы заняты то одним, то другим, но буду благодарна, если вы немного сосредоточитесь."
33010-69 = "[s] «Прости.»"
33010-70 = "Насколько я понимаю, вы добровольно помогаете разбираться с последствиями того инцидента."
33010-71 = "[s] «Я взрослый. Кто-то должен взять на себя ответственность.»"
33010-72 = "Справедливо."
33010-73 = "За столь короткое время произошло очень многое. Было бы безответственно не провести тщательный разбор."
33010-74 = "Он, несомненно, будет утомительным, но такова природа разбора происшествия."
33010-75 = "Итак, вернёмся к началу."
33010-76 = "Палата восстановления Сэи была уничтожена примерно в три часа ночи в ночь нападения."
33010-77 = "Первой на место прибыла капитан Мине из Рыцарей спасения."
33010-79 = ""
33010-80 = "Разобравшись в ситуации, она доложила о случившемся Чаепитию."
33010-81 = "Пока Чаепитие охватила паника, начались совместные попытки скрыть известие о смерти Сэи и найти виновного."
33010-82 = ""
33010-84 = ""
33010-85 = "Капитан Мине воспользовалась хаосом и скрылась с телом Сэи. Даже другие члены её клуба не знали, куда она ушла."
33010-86 = ""
33010-87 = "Это всё, что знало Чаепитие. На самом деле Мине лишь создала видимость уничтожения нимба Сэи и спрятала её в безопасном месте."
33010-88 = "Это был лучший способ защитить Сэю от нового нападения. На мёртвого человека никто не охотится."
33010-89 = "В конце концов, у Чаепития хватает врагов. Виновником мог быть кто угодно. Думаю, с учётом этого Мине приняла правильное решение."
33010-90 = "Теперь мы знаем, что нападение организовала Мика. Решение Мине оказалось мудрым."
33010-91 = "Однако Сэя до сих пор не очнулась."
33010-92 = "Раны от взрыва зажили, но она остаётся без сознания... по неизвестной причине, как говорит капитан."
33010-93 = "Итак, капитан Мине и Сэя всё ещё скрываются. Их местонахождение никому не известно."
33010-94 = "Это всё, что нам известно о нападении на Юризоно Сэю."
33010-95 = ""
33010-99 = ""
33010-100 = "[ns] «Ханако.»"
33010-101 = "Я подумала, что Сакурако, наверное, уже усыпила тебя до смерти, поэтому пришла спасать."
33010-102 = "Я не в настроении для твоих шуток, Ханако."
33010-103 = "Какая ты зануда. Улыбнись! Поживи немного! Прогуляйся по пляжу — найди что-нибудь непристойное почитать!"
33010-104 = "Что-то мне подсказывает, тебе как раз понравится. ♥"
33010-105 = ""
33010-107 = ""
33010-108 = ""
33010-109 = "Ты ведь не забыла о заключённом тобой договоре?"
33010-110 = "Конечно нет."
33010-112 = ""
33010-113 = "[ns] «Что всё это значит, Ханако?»"
33010-114 = "Сенсей? Что вы здесь делаете?"
33010-115 = ""
33010-117 = ""
33010-118 = "[ns] «Ты сказала, что заключила договор с Сестринством.»"
33010-119 = "А. Это..."
33010-120 = "При всём уважении, Сенсей, это не касается ни вас, ни Шале."
33010-121 = "[s] «Я являюсь советником Клуба дополнительных занятий, так что Ханако всё ещё МОЙ студент.»"
33010-122 = "Боже..."
33010-123 = "..."
33010-124 = "П-Простите. Это моя вина."
33010-125 = "Мари..."
33010-126 = ""
33010-128 = ""
33010-129 = "Это была сделка. Ханако попросила меня помочь убедить Сакурако."
33010-130 = "А взамен..."
33010-131 = "...я попросила Ханако передумать насчёт ухода из школы."
33010-132 = "..."
33010-133 = "Это был единственный способ! Я не могла понять, что чувствует Ханако, и не могла отговорить её бросать школу."
33010-134 = "Я лишь хотела, чтобы она осталась в академии, даже если ради этого пришлось быть эгоистичной."
33010-135 = "Ты не была эгоистичной, Мари."
33010-136 = "Тебе не нужно стыдиться или извиняться. Если кто и был эгоистичен, то я — раз заставила тебя так переживать."
33010-137 = "Прости, Мари."
33010-138 = "Ханако..."
33010-139 = "Можешь не сомневаться: теперь уйти из школы — последнее, о чём я думаю."
33010-140 = "П-Правда? Ты серьёзно?"
33010-141 = "Абсолютно. В Клубе дополнительных занятий я многому научилась, в том числе ценности борьбы и умению заставить себя сделать ещё чуть больше. Верно, Сенсей?"
33010-142 = "[s] «Да. Ты справишься.»"
33010-143 = "Я так рада это слышать. Спасибо вам обоим."
33010-144 = ""
33010-146 = ""
33010-147 = "Однако одного этого недостаточно."
33010-148 = "Сакурако?"
33010-149 = "У меня есть собственная просьба к тебе, Ханако."
33010-150 = "..."
33010-151 = "Это..."
33010-153 = ""
33010-154 = ""
33010-155 = "Какая коварная. До сих пор не верится, что ты попросила помочь создать школьное правило, запрещающее одежду в классах. Только полностью голые уроки!"
33010-156 = "Я рада, что ты пом—"
33010-157 = "Что, простите?"
33010-158 = "Кто бы мог подумать, что у Сестринства такие развратные амбиции. Впрочем, от тебя, Сакурако, другого и ожидать не стоило. Эта организация действительно окутана тайнами."
33010-159 = "Хотя пункт, разрешающий членам Сестринства оставлять на себе вуаль, даже будучи голыми, мне понравился."
33010-161 = "Полностью обнажённые, и только вуаль. Какой смелый способ продемонстрировать привилегии Сестринства."
33010-162 = "Что, простите?!"
33010-163 = "Я дала слово, так что выбора нет — придётся содействовать твоему плану! Я добьюсь принятия этого правила, даже если это будет последнее, что я сделаю!"
33010-164 = "Но я не могу согласиться с фаворитизмом, который создаёт исключение для вуали. Поэтому предлагаю поправку: всем остальным студентам разрешается хотя бы носить носки!"
33010-165 = "Сделай эту уступку, и я обещаю, что твоё правило примут!"
33010-166 = "Сакурако! Т-Ты всё это время скрывала это от меня?!"
33010-167 = "Конечно нет!"
33010-168 = "Точно?"
33010-169 = "Да, точно!"
33010-171 = "Условием выполнения твоей просьбы было то, что ты выполнишь одну из наших!"
33010-172 = "О-о-о, во-о-от оно что. Теперь вспомнила."
33010-174 = "*вздыхает*"
33010-175 = "Как бы мне ни хотелось попросить тебя вступить в Сестринство, это было бы нечестно. По сути, я бы тебя принуждала."
33010-176 = "После последнего инцидента мы решили изменить политику невмешательства. По крайней мере в обозримом будущем Сестринство будет активнее участвовать в политике Тринити."
33010-177 = "В этом наверняка будет немало... болезней роста, и помощь настолько талантливого человека, как ты, могла бы их смягчить."
33010-178 = "Думаю, это я могу..."
33010-179 = "Почему так неуверенно? Надеюсь, ты всё ещё не думаешь о той выдуманной просьбе, которую якобы сказала от меня."
33010-180 = "[s] «Думаю, за Ханако должно оставаться право сказать „нет“, когда она хочет.»"
33010-181 = "Сенсей..."
33010-182 = "Да, с этим я согласна. Нам и так стоит считать удачей, что ты вообще готова помочь. Не буду злоупотреблять удачей и просить больше, чем тебе комфортно."
33010-183 = "Спасибо, Сакурако."
33010-184 = "Но вернёмся к делу. Мы обсуждали—"
33010-185 = "Конечно же вопрос посещения занятий нагишом! ♥"
33010-186 = "Именно, политику наготы— нет! Мы обсуждали ситуацию с Сэей!"
33010-187 = "Точно."
33010-188 = ""
33010-190 = ""
33010-192 = "Ладно, теперь серьёзно... Мы уже знаем, что напавшей на Сэю была наша маленькая Азуса — Ширасу Азуса."
33010-193 = "Комната Сэи была уничтожена в три часа ночи в ночь нападения, но по записям проникновение должно было произойти примерно в два."
33010-194 = "Значит, незваная гостья, Азуса, провела с Сэей примерно час."
33010-195 = "Что могло произойти между ними за это время?"
33010-196 = "Азуса мне не рассказывала. Однако..."
33010-198 = "Комната консультирования"
33010-199 = ""
33010-200 = ""
33010-201 = "Входи, Ширасу Азуса."
33010-202 = "..."
33010-204 = "Следующий эпизод;Разбор последствий, часть 2"
