[translation]
33010-1 = "Episódio 1;Post-mortem (1)"
33010-4 = "Quarto Secreto"
33010-6 = "...Yurizono Seia?"
33010-7 = "Sim, sou eu. Eu estava esperando por você, \"Shirasu Azusa\", da Filial Arius."
33010-8 = "...Me esperando? Por mim?"
33010-9 = "Sim, porque eu já tinha visto esta cena em um sonho."
33010-10 = "Como eu poderia explicar... Bem, pode pensar nisso como um \"sonho profético\"."
33010-11 = "Às vezes, eu tenho esse tipo de sonho. Sonhos que acabam se tornando realidade mais tarde, além de vários outros."
33010-12 = "...Quer dizer que você também já sabe o que eu vim fazer aqui?"
33010-13 = "Sim, você veio destruir a minha auréola, não é?"
33010-14 = "Parece que você tinha outras companheiras, mas só você conseguiu chegar até aqui. É uma habilidade impressionante, Shirasu Azusa."
33010-15 = "...Se você sabia, por que não fugiu?"
33010-16 = "...Porque não faz sentido."
33010-17 = "\"Tudo é vaidade\"... São as palavras favoritas de Arius, não são? É a mesma coisa. Para mim, que enxergo o futuro, lutar contra ele não tem sentido."
33010-18 = "É verdade que a \"morte\" é um conceito difícil de enxergar em Kivotos. Ainda assim, nós estamos vivas, então é impossível que a \"morte\" não caminhe ao nosso lado."
33010-20 = "\"Destruir uma auréola\"... Em outras palavras, alguém deseja a minha morte."
33010-21 = "E você se infiltrou até este quarto secreto sem que mais ninguém percebesse. Se você é capaz de chegar a esse ponto, debater-se é mesmo inútil... Mesmo da sua posição, você não concorda, Shirasu Azusa?"
33010-23 = "Bem, não é como se não houvesse outros motivos além desse, mas... a propósito, você já destruiu uma auréola antes?"
33010-24 = "...Não, nunca. Mas aprendi como fazer."
33010-25 = "\"Aprendeu\"..."
33010-26 = "Causar danos fatais e irreversíveis ao corpo... e continuar causando."
33010-27 = "Normalmente, não importa quantos tiros de calibre 5.56mm você dispare, quase nunca será um ferimento fatal."
33010-28 = "Mas isso não significa que não haja dano. Uma quantidade absurda de munição, uma vantagem esmagadora para continuar infligindo dano e tempo suficiente para isso. Contanto que você descarregue tudo isso em um nível \"anormal\"... não é impossível destruir uma auréola apenas com armas de fogo."
33010-29 = "E fora armas de fogo, existem inúmeras outras formas. Doenças também não estão descartadas. Por exemplo, cortar à força a ingestão de água e comida por um longo período, trancar a pessoa à força em um ambiente onde não se possa respirar, fazê-la sangrar até que as funções corporais parem, mantê-la imobilizada constantemente em uma condição que deixe a temperatura corporal abaixo de certo limite..."
33010-30 = "Existem inúmeros métodos para levar alguém à \"morte\"."
33010-31 = "Além disso, ouvi dizer que \"Yurizono Seia tem a saúde frágil\"."
33010-32 = "...Então você acha que essa arma de fogo já seria o bastante?"
33010-33 = "...Não seria impossível. Mas, no momento, não tenho garantia nem de tempo suficiente, nem de vantagem."
33010-34 = "Por isso, vou usar esta bomba especial. Com ela, vou \"destruir a sua auréola\"."
33010-35 = "Quer dizer então que isso é uma \"bomba que destrói auréolas\"? Nunca ouvi falar dessa tecnologia, mas..."
33010-36 = "...Entendo, então é esse tipo de pesquisa que Arius anda fazendo. \"Formas de destruir uma auréola\", ou seja, \"formas de matar uma pessoa\"."
33010-37 = "...Sim, e foi isso que você aprendeu. Afinal, uma \"escola\" é um lugar para \"aprender\" esse tipo de coisa, não é?"
33010-38 = "..."
33010-39 = "Entendo... Então Arius chegou a esse ponto..."
33010-44 = "...Shirasu Azusa, deixe-me perguntar uma coisa. Tudo bem para você se tornar uma \"assassina\"?"
33010-45 = "..."
33010-47 = "Eu vi a sua imagem, temendo se tornar uma \"assassina\"."
33010-48 = "Se você desejava isso ou não, se tinha outra escolha ou não... na verdade, nada disso importa muito."
33010-49 = "\"Uma assassina é uma assassina\". Essa premissa clara, absoluta e, acima de tudo, desesperadoramente fácil de entender ficará cravada em você. E continuará existindo neste mundo."
33010-50 = "O desespero, o sofrimento, a raiva, o arrependimento, a frustração e a sensação de impotência que você sentirá depois que isso acontecer... tudo isso vai desaparecer no vazio sem alcançar ninguém."
33010-51 = "Se você é de Arius, não tem como não conhecer. \"Vanitas vanitatum\"... a verdade deste mundo."
33010-52 = "...Contudo, eu sei. Sei que, embora concorde com essas palavras, em algum lugar dentro de si você também as nega."
33010-54 = "...Não é mesmo?"
33010-55 = "Enquanto olhava para aquela flor, era nisso que você estava pensando."
33010-56 = "\"Tudo é vaidade\"... Mas, mesmo assim, é preciso lutar."
33010-57 = "Isso é o que está enraizado na sua essência, a imagem mental que define quem você é... embora eu mesma não tenha compreendido muito bem."
33010-58 = "Sendo assim, na verdade..."
33010-60 = "...você não veio aqui para me matar, mas sim para me pedir um conselho, não foi?"
33010-61 = "Sobre como você deve lutar daqui em diante."
33010-63 = "Sala de Reuniões da Irmandade"
33010-65 = "...Sensei [USERNAME]?"
33010-66 = "[s1] \"...Desculpe, acabei cochilando um pouco.\"\n[s2] \"Acho que tive algum tipo de sonho...\""
33010-67 = "...Sei que anda muito ocupado, mas agradeceria se pudesse se concentrar um pouquinho mais."
33010-68 = "...Sei que anda muito ocupado, mas agradeceria se pudesse se concentrar um pouquinho mais."
33010-69 = "[s] \"Desculpe...\""
33010-70 = "É verdade que, ultimamente, ouvi dizer que você tem corrido para lá e para cá lidando com as consequências do incidente... até mesmo com assuntos fora da sua jurisdição."
33010-71 = "[s] \"Foi falta de capacidade minha... Ainda tem tanta coisa que não consegui resolver direito...\""
33010-72 = "...Entendo."
33010-73 = "Aconteceram muitas coisas uma atrás da outra, então que tal colocarmos tudo em ordem?"
33010-74 = "Provavelmente será uma conversa entediante. Pelo menos não acho que vá ser algo divertido... mas, ao organizarmos os fatos, há coisas que nos permitem seguir em frente. É o que chamam de \"post-mortem\"."
33010-75 = "...Bem, vamos direto ao assunto."
33010-76 = "O quarto da Seia-san foi explodido por volta das 3 horas da madrugada."
33010-77 = "Depois disso, a primeira pessoa a chegar ao local foi a Capitã Mine, das \"Cavaleiras Socorristas\"."
33010-80 = "Após verificar a situação dentro do quarto, a Capitã Mine relatou o ocorrido imediatamente à Tea Party."
33010-81 = "Mesmo em meio à confusão, a Tea Party deu início às manobras para encobrir a informação e à busca pelo culpado."
33010-85 = "No entanto, aproveitando-se de todo aquele alvoroço, a Capitã Mine desapareceu levando consigo o corpo da Seia-san. Dizem que nem mesmo as outras integrantes das Cavaleiras Socorristas sabiam do seu paradeiro."
33010-87 = "...E essa era a situação sob o ponto de vista da Tea Party. Mas, na realidade, a própria informação sobre o \"corpo da Seia-san\" era uma farsa. A Capitã Mine espalhou o boato falso de que \"a auréola havia sido destruída\" enquanto escondia a Seia-san em um local seguro."
33010-88 = "Pensando logicamente, não haveria motivo para alguém mirar em uma \"aluna cuja auréola já foi destruída\". Pode-se dizer que foi o melhor método possível para proteger a Seia-san."
33010-89 = "Diante da situação anormal de um membro da Tea Party sofrer um atentado... antes mesmo de pensar em quem deveria confiar no momento, ela provavelmente decidiu resolver tudo com as próprias mãos."
33010-90 = "Levando em conta que, na verdade, a mandante era a Mika-san, da própria \"Tea Party\" — onde todas as informações deveriam se concentrar —, podemos dizer que o julgamento dela acabou sendo o correto no fim das contas..."
33010-91 = "...Contudo, a Seia-san ainda não despertou."
33010-92 = "Embora os ferimentos da explosão já tenham cicatrizado, ela continua dormindo ininterruptamente... Até a Capitã disse não saber a causa."
33010-93 = "Neste exato momento, a Capitã Mine e a Seia-san continuam escondidas em um lugar que ninguém conhece."
33010-94 = "...Ainda que de forma resumida, esse é o panorama geral sobre o atentado contra a Yurizono Seia-san."
33010-100 = "[ns] \"Hanako!\""
33010-101 = "Imaginei que você estivesse sofrendo nas mãos da Sakurako-san e das conversas pouco divertidas dela, então vim te salvar, Sensei. Fufu♡"
33010-102 = "...Este não é o momento para brincadeiras, Hanako-san."
33010-103 = "Você continua a mesma de sempre, hein, Sakurako-san... Que tal lermos juntas um livro um pouquinho mais ousado da próxima vez?♡"
33010-104 = "Não sei por quê, mas tenho a impressão de que você não tem a menor imunidade para esse tipo de coisa, Sakurako-san... Ufufu♡"
33010-109 = "...Hanako-san. Você não se esqueceu da promessa daquela vez, não é?"
33010-110 = "...É claro que não."
33010-113 = "[ns] \"Achei você, Hanako.\""
33010-114 = "Ora. Sensei, o que faz aqui...?"
33010-118 = "[ns] \"Aquela promessa com a Irmandade que você mencionou antes...\""
33010-119 = "Ah, aquilo é..."
33010-120 = "...Sensei da Schale, este não é um assunto no qual você deva intervir."
33010-121 = "[s] \"A Hanako faz parte do Clube de Aulas de Reforço, ela é minha aluna.\""
33010-122 = "Ora, ora..."
33010-123 = "..."
33010-124 = "Com licença... É que, bem, fui eu que..."
33010-125 = "Mari-chan..."
33010-129 = "Fui eu quem pediu. Para ajudar a Hanako-san, eu convenci a Sakurako-sama..."
33010-130 = "Em troca, como promessa,"
33010-131 = "pedi para que a Hanako-san retirasse o pedido de desistência da escola..."
33010-132 = "..."
33010-133 = "Sozinha, eu não era capaz de impedir a Hanako-san... Eu não conseguia compreender o que havia no fundo do coração dela..."
33010-134 = "Me desculpe por as coisas terem terminado dessa forma... Mas é que eu queria muito que a Hanako-san continuasse na escola..."
33010-135 = "...Não, Mari-chan."
33010-136 = "Você não tem pelo que se desculpar, Mari-chan. Fui eu quem agiu de forma egoísta e deixou todo mundo preocupado. Na verdade, quem deve pedir desculpas sou eu."
33010-137 = "Me desculpe, Mari-chan... Eu deixei você preocupada, não foi?"
33010-138 = "Hanako-san..."
33010-139 = "Agora eu não penso mais em largar a escola. Pode ficar tranquila."
33010-140 = "É verdade mesmo...?"
33010-141 = "Sim. Afinal, foi o que aprendi no Clube de Aulas de Reforço... Decidi tentar \"lutar\" mais um pouquinho. Não é, Sensei?"
33010-142 = "[s] \"...Sim.\""
33010-143 = "...Muito obrigada. Hanako-san, Sensei [USERNAME]."
33010-147 = "...No entanto, apenas isso não será o bastante."
33010-148 = "Sakurako-sama...?"
33010-149 = "Tenho mais um pedido. Hanako-san."
33010-150 = "..."
33010-151 = "Trata-se de—"
33010-155 = "\"Permitir apenas a nudez como traje escolar\"... Vocês querem a minha ajuda no plano de criar essa regra escolar e transformar Trinity em um \"Paraíso da Nudez\"... Era isso, não era?"
33010-156 = "Sim, exatamen—"
33010-157 = "...Como é?"
33010-158 = "Quem diria que a Irmandade estava tramando uma conspiração dessas... Não esperava menos de você, Sakurako-san, líder de uma organização secreta envolta em mistérios."
33010-159 = "E ainda tem aquela cláusula sobre a exceção: \"Em princípio, nudez total. Contudo, apenas à Irmandade será permitido o uso do véu ao ir para a escola\"..."
33010-161 = "Até mesmo eu estremeci com essa. Nua usando apenas um véu, que novo mundo fascinante..."
33010-162 = "Quê...!?"
33010-163 = "Mas, na minha posição atual, não tenho escolha a não ser cooperar... E, já que vou fazer isso, garanto que farei desse plano um sucesso!"
33010-164 = "Porém, essa questão do véu é injusta demais. Portanto, tenho uma contraproposta: que tal \"Em princípio, nudez total. Contudo, todas as alunas terão permissão para usar apenas meias\"?!"
33010-165 = "Se aceitarem essa condição, terei prazer em colaborar com o plano!"
33010-166 = "Sa-Sa-Sa-Sakurako-sama!? U-Um plano desses...!?"
33010-167 = "Não é nada disso!?"
33010-168 = "Não pode ser..."
33010-169 = "Nada de \"Não pode ser...\"! Que absurdos você está dizendo assim do nada?!"
33010-171 = "\"Em troca de atendermos ao pedido da Hanako-san, a Hanako-san também atenderá a um pedido nosso\", essa era a promessa, não era!?"
33010-172 = "...Ah, é verdade, teve uma conversa dessas mesmo, né?"
33010-174 = "Haa..."
33010-175 = "Na verdade, o ideal seria que você entrasse para a Irmandade... mas isso provavelmente só serviria para atormentá-la e deixá-la encurralada."
33010-176 = "...Com este incidente como ponto de virada, a nossa antiga \"política de não intervenção\" também vai mudar. Aos poucos, teremos que nos envolver em questões políticas."
33010-177 = "Certamente enfrentaremos vários obstáculos nesse processo. Quando esse momento chegar, poder contar com a ajuda de alguém como você, Hanako-san, pode ser uma peça-chave fundamental. Era apenas disso que eu estava falando."
33010-178 = "Bem, se for só isso, por mim tudo bem... Haa..."
33010-179 = "Por que está fazendo essa cara de decepção...? Quer dizer, por favor, não volte mais àquele assunto de antes..."
33010-180 = "[s] \"...Hanako, tem certeza de que não se incomoda com isso?\""
33010-181 = "Sensei..."
33010-182 = "...Não usaremos métodos coercitivos. De qualquer forma, será apenas um pedido para que a Hanako-san \"nos ajude\", e não temos a intenção de exigir nada absurdo."
33010-183 = "...Muito obrigada, Sakurako-sama."
33010-184 = "Acabamos desviando do assunto... Vamos voltar ao tema principal. Vejamos..."
33010-185 = "A conversa sobre \"ir para a escola completamente nua\", não é?♡"
33010-186 = "Sim, essa mesma... Quer dizer, não! Eu já pedi para não voltar a esse assunto...!"
33010-187 = "Ufa,"
33010-192 = "Não tem jeito mesmo, né... Vamos voltar à história do atentado contra a Seia-chan. Como já sabem, parece que a executora foi a Azusa-chan."
33010-193 = "...O quarto da Seia-chan foi explodido às 3 horas da madrugada. Porém, a invasão ao quarto ocorreu por volta das 2 horas da madrugada."
33010-194 = "Há uma lacuna de cerca de uma hora aí. A invasora... ou seja, a Azusa-chan esteve naquele quarto junto com a Seia-chan durante uma hora inteira."
33010-195 = "Durante esses 60 minutos, que tipo de conversa será que aconteceu entre as duas...?"
33010-196 = "A Azusa-chan não quis entrar em muitos detalhes sobre isso, mas..."
33010-198 = "Sala de Aconselhamento"
33010-201 = "Shirasu Azusa-san, pode entrar."
33010-202 = "..."
33010-204 = "Próximo;Post-mortem (2)"
