[translation]
1000203-1 = "Путь благородства"
1000203-2 = "Чайный дом на окраине Геенны"
1000203-3 = "Я ждала вас, Сенсей."
1000203-4 = "[s] «Здесь потрясающе...»"
1000203-5 = "Хех. Время для исследований важно, поэтому я хотела выбрать лучшее место. Когда дело касается исследований, я не жалею средств."
1000203-6 = "Здесь мы сможем спокойно заниматься исследованиями — до полуночи весь чайный дом в нашем распоряжении."
1000203-7 = "Что может быть лучше чайного дома поздно ночью?"
1000203-8 = "Тогда начнём."
1000203-9 = "[s1] «Конечно. Тема сложная, так что не знаю, насколько буду полезен...»\n[s2] «Хорошо, но я немного нервничаю...»"
1000203-12 = ""
1000203-13 = ""
1000203-14 = "*туп*"
1000203-15 = "(Харуна поставила на стол стакан лапши быстрого приготовления.)"
1000203-16 = "[s3] «...?»\n[s4] «...Лапша быстрого приготовления?»"
1000203-17 = "Тема сегодняшнего гастрономического исследования — лапша быстрого приготовления в стаканчике."
1000203-18 = "Тема сегодняшнего гастрономического исследования — лапша быстрого приготовления в стаканчике."
1000203-19 = "Хм? А как же чайная церемония?"
1000203-20 = "Ты неправильно меня понял. Я никогда не говорила, что сегодня мы будем исследовать чайные церемонии."
1000203-21 = "Я лишь сказала, что чайная церемония учит высшей форме этикета."
1000203-22 = "Подумай вот о чём. Если поза, атмосфера, поведение и настрой определяют то, как мы воспринимаем вкус..."
1000203-23 = "...что произойдёт, если применить ту же философию к лапше быстрого приготовления?"
1000203-24 = "Иными словами, лапша быстрого приготовления..."
1000203-25 = "...достойна исследования!"
1000203-26 = "[s5] «...Ты меня убедила.»\n[s6] «...Теперь понятно!»"
1000203-27 = "Хе-хе. Очень хорошо! Я знала, что ты поймёшь всю глубину этой идеи!"
1000203-28 = "Хе-хе. Очень хорошо! Я знала, что ты поймёшь всю глубину этой идеи!"
1000203-29 = "А теперь позволь объяснить, что мы будем использовать в эксперименте."
1000203-30 = ""
1000203-31 = ""
1000203-32 = "*туп*"
1000203-33 = "(Харуна достала дорогую на вид кастрюлю.)"
1000203-34 = "Эту посуду изготовил мастер. В ней я вскипячу воду."
1000203-35 = ""
1000203-36 = ""
1000203-37 = "(Харуна достала маленькую бутылку воды.)"
1000203-38 = "Это артезианская вода с глубины более 500 метров, из вулканического района Геенны."
1000203-39 = "Очень дорогая минеральная вода. И я не преувеличиваю."
1000203-40 = ""
1000203-41 = ""
1000203-42 = "(Харуна достала большую корзину.)"
1000203-43 = "Это древесный уголь из дуба — ещё одна дорогая вещь. Благодаря ему вода будет нагреваться равномерно."
1000203-44 = ""
1000203-47 = "*тик* *тик* *тик*"
1000203-48 = "Ещё у меня есть секундомер для времени, термометр для температуры воды, пара лучших бамбуковых палочек и, наконец, чайник с тонким носиком, чтобы наливать воду..."
1000203-49 = "Хе-хе. Всё выглядит хорошо. Начнём?"
1000203-50 = "Позволь мне вскипятить воду."
1000203-52 = "Так... а как разжечь уголь?"
1000203-53 = "*кашель* *кашель* Что? Огня нет — только дым...!"
1000203-54 = "Так печь и должна работать? Как вообще пользоваться этой посудой...?"
1000203-55 = "(На розжиг угля у нас ушло два часа. Наконец Харуна налила воду в кастрюлю, вскипятила её и перелила кипяток в чайник.)"
1000203-56 = "(Именно тогда я заметил в углу чайного дома электрический чайник, но решил ничего не говорить.)"
1000203-58 = "Хех. Спасибо, что подождал. Всё готово."
1000203-59 = "[s7] «Я умираю с голоду... Покорми меня, пожалуйста.»\n[s8] «Теперь можно поесть...»"
1000203-60 = "Не спеши. Мы только начинаем!"
1000203-61 = "Не спеши. Мы только начинаем!"
1000203-62 = "Нам ещё нужно решить, как наливать воду и что она должна коснуться первым — лапши или порошковой приправы!"
1000203-63 = "Я думаю использовать метод ручного пролива. Есть разные способы наливать воду — спиралью, кругами или точками, но я выберу спираль...!"
1000203-64 = "Именно так я впервые научилась заваривать кофе вручную, значит, должно сработать."
1000203-65 = ""
1000203-66 = "*льётся*"
1000203-67 = "(Мне остаётся лишь молча смотреть, как Харуна с предельной сосредоточенностью наливает воду.)"
1000203-68 = "*тяжело дышит* *тяжело дышит*"
1000203-69 = "Чтобы наливать воду, нужна такая концентрация."
1000203-70 = "Должно хватить. Засеку три минуты на секундомере..."
1000203-72 = "(Три минуты спустя.)"
1000203-73 = ""
1000203-74 = ""
1000203-76 = "Вот, Сенсей!"
1000203-78 = "(Поздней ночью мы с Харуной ели в чайном доме лапшу быстрого приготовления за 100 иен.)"
1000203-79 = "(...На вкус она была хорошей — ровно такой, какой и должна быть обычная лапша.)"
1000203-80 = "По дороге домой"
1000203-81 = "Хе-хе... Ну как тебе сегодняшнее исследование?"
1000203-82 = "По-моему, было довольно вкусно — совсем не так, как обычная лапша."
1000203-83 = "Есть лапшу в таком изящном месте, как тихий и спокойный чайный дом..."
1000203-84 = "Мне даже показалось, что в тот момент я достигла просветления."
1000203-85 = "Думаю, ещё немного экспериментов — и мы доведём Дао лапши быстрого приготовления до совершенства."
1000203-86 = "Хех... Но на сегодня хватит. До встречи!"
1000203-88 = "(Я проводил Харуну. Когда мы расставались, она выглядела очень довольной.)"
