[translation]
1000702-1 = "Образцовая гражданка"
1000702-2 = "Полицейский участок"
1000702-3 = "У-а-а-а! Сенсей!"
1000702-4 = "Полиция арестовала меня, хотя я невиновна..."
1000702-5 = "Ты прекрасно знаешь, за что тебя задержали!"
1000702-6 = "У-а-а, Сенсей! Полицейские меня обижают!"
1000702-7 = "Вы опекун этой девочки?"
1000702-8 = "[s] «Я её учитель.»"
1000702-9 = "Вы знаете, чем занималась эта юная леди?"
1000702-10 = "Я ничего плохого не сделала! Я делала то, что должна была!"
1000702-11 = "Ах ты!"
1000702-12 = ""
1000702-13 = "Эту девочку поймали за незаконным проникновением на частную территорию..."
1000702-15 = "...и вдобавок за порчей имущества!"
1000702-16 = "Граффити — это не порча имущества. Это искусство!"
1000702-17 = "Расскажи это владельцу здания, юная леди."
1000702-18 = "[s] «Порча имущества?»"
1000702-19 = "Именно. Или «граффити», как выражается эта нарушительница. Её поймали за тем, как она рисовала на стене чужого здания."
1000702-20 = "Но владелец сказал, что всё нормально!"
1000702-21 = "Он сказал, что прощает тебя, а не что изначально разрешал это делать. И это далеко не первый случай."
1000702-22 = "Эстакада на трассе KV, переулок у рынка «Куро Нэко»..."
1000702-23 = "Ты постоянно оставляешь рисунки там, где мало людей. Ты вообще представляешь, как тяжело потом всё это отмывать?"
1000702-24 = "Это не грязь — это искусство!"
1000702-25 = ""
1000702-26 = "[s] «...Простите за неё.»"
1000702-27 = "Извиняться должна она, а не вы."
1000702-28 = "Что?! Я всего лишь добавляю немного жизни этому унылому городу!"
1000702-29 = "[s] «Тебе правда стоит извиниться, Маки.»"
1000702-30 = "Но... Угх..."
1000702-31 = "Ладно. Я... простите за всё это."
1000702-32 = "Хмф. На этот раз отделаюсь предупреждением. Не думай, что в следующий раз тебе так же повезёт!"
1000702-34 = "Эй, Сенсей. Ты... злишься на меня?"
1000702-35 = "[s] «С чего бы?»"
1000702-36 = "Не ври. Злишься же, да? Эм..."
1000702-37 = "Но эта унылая серая стена буквально звала меня! Она хотела, чтобы её раскрасили яркими красивыми цветами!"
1000702-38 = "Я-я знаю, что рисовать на чужой собственности неправильно, ладно...?"
1000702-39 = "Но я просто не смогла сдержать пылающую во мне страсть художника..."
1000702-40 = "Прости. Последнее, чего я хотела, — разозлить тебя."
1000702-41 = "Граффити для меня очень важно, но не важнее тебя."
1000702-42 = "Вот беда. Как мне продолжать выражать себя через граффити и при этом не злить Сенсея...?"
1000702-43 = "[s] «Можно купить тебе огромный холст.»"
1000702-44 = "...Огромный холст?"
1000702-45 = "А, поняла! Если соединить несколько холстов, можно использовать их вместо стены здания!"
1000702-46 = "Может, это и не то же самое, что настоящая стена... но с тобой всё весело, Сенсей."
1000702-47 = "Так что... если я соберу огромный холст, поможешь мне его разрисовать?"
1000702-48 = "[s] «Конечно. Сделаем вместе.»"
1000702-49 = "Обещаешь, да? Спасибо, Сенсей!"
