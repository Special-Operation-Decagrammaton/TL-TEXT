[translation]
2600605-1 = "Место для наблюдения за метеорами"
2600605-2 = "Бывший институт академии Красная Зима"
2600605-3 = ""
2600605-4 = ""
2600605-5 = "О, Сенсей. Ты пришёл."
2600605-6 = "Почему я такая подавленная?"
2600605-7 = "Н-Ничего."
2600605-8 = "[s] «Не грусти. В эти выходные ты сможешь посмотреть на метеорный поток.»"
2600605-9 = "Дело в том... что в этом году мы, похоже, не увидим метеоры."
2600605-10 = "По прогнозу погоды весь день над Кивотосом будет облачно."
2600605-11 = "Метеорный поток Леониды можно увидеть лишь раз в тридцать лет..."
2600605-12 = "Так обидно упускать такую возможность. За всю жизнь такое случается всего два-три раза."
2600605-13 = "Я собиралась загадать желание... Говорят, желание, загаданное на падающую звезду, обязательно сбудется."
2600605-14 = "Но, наверное, желание потому и называется желанием... что сбывается не всегда."
2600605-15 = "[s1] «Ещё слишком рано сдаваться.»\n[s2] «Давай найдём другой способ.»"
2600605-16 = "Что? Но даже в лучший телескоп метеоры не увидишь, если облака будут слишком плотными."
2600605-17 = "Что? Но даже в лучший телескоп метеоры не увидишь, если облака будут слишком плотными."
2600605-18 = "То есть, если облака закрывают метеоры... нам нужно подняться выше облаков?"
2600605-19 = "[s] «Ага! Давай посмотрим на метеорный поток с здания, которое выше облаков.»"
2600605-20 = "Но разве в Кивотосе есть такое здание..."
2600605-21 = "Ты имеешь в виду здание, где находится Исполнительный офис Шале?"
2600605-22 = "Отличная идея! Крыша здания Шале находится выше облаков, так что оттуда мы точно увидим метеорный поток!"
2600605-23 = "Но чтобы войти в здание Шале в нерабочее время, придётся получить разрешение у той страшной Рин из Генерального студсовета..."
2600605-24 = "Т-Ты уверен, что всё будет нормально..."
2600605-25 = "[s3] «Всё нормально. Оставь это мне.»\n[s4] «Я привык иметь дело с Рин.»"
2600605-26 = "Хаха... Рада это слышать."
2600605-27 = "Хаха... Рада это слышать."
2600605-29 = "С разрешения Генерального студенческого совета нас впустили внутрь."
