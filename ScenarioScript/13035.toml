[translation]
13035-3 = "Ого-ого-ого! Эти ребята сильнее... сильнее поезда!!!"
13035-4 = "Нас размотали..."
13035-5 = ""
13035-7 = ""
13035-8 = "Не оборачивайся, но, кажется, нас окружили! График точно пострадает!"
13035-9 = "Это плохо... Стройка вся летит к чертям."
13035-11 = "Столько понтов... а они оказались... такими слабыми..."
13035-13 = "Хватит бессмысленной драки. Отвечайте на вопросы!"
13035-14 = "Что Железнодорожная академия Хайлендер делает в Абидосе?! Какова ваша цель?"
13035-15 = "Вы достаточно умные, чтобы уже хотя бы часть сложить, разве нет?"
13035-16 = ""
13035-18 = ""
13035-19 = ""
13035-21 = ""
13035-23 = "Надзиратель!"
13035-24 = "Помогите... Нам конец. Они реально... могут нас убить."
13035-26 = "Ещё один студент Хайлендер? Кто ты?"
13035-27 = "Их подруга? Пришла выручать?"
13035-29 = "...«Подруга» — слишком сильное слово."
13035-31 = "Что?!"
13035-32 = "Никому нельзя доверять..."
13035-34 = "Формально моё задание — вытащить их. Но уверяю, это исключительно обязанность."
13035-35 = "Меня зовут Асагири Суо. Я надзиратель Железнодорожной академии Хайлендер и подчиняюсь только совету директоров."
13035-36 = "Надзиратель?"
13035-37 = "Ничего особенного. Девочка на побегушках у начальства. И, к сожалению, эти идиотские..."
13035-38 = "*вздох* То есть близняшки, которых вы задержали, — Тачибана Хикари и Нозоми, офицеры Центрального центра управления, CCC."
13035-39 = "Наши отношения скорее... отношения противников, которые без колебаний обманут друг друга, но иногда вынуждены сотрудничать."
13035-41 = "Вот именно! Она идеально играет роль надзирателя! Злая злодейка, ненавидящая стройку! Живёт только ради того, чтобы ломать нам графики."
13035-42 = "И стой-ка. Ты ведь собиралась назвать нас чем-то очень-очень обидным?"
13035-43 = "Агась. Собиралась. Как грубо."
13035-45 = ""
13035-47 = ""
13035-48 = "Наша академия состоит из филиалов с независимыми полномочиями. Так что хоть мы и под одним знаменем, союзниками нас не назовёшь."
13035-49 = "Каждый железнодорожный маршрут и район контролируют разные фракции."
13035-50 = "Но вернёмся к делу."
13035-51 = "Как их надзиратель я приношу извинения. Они не соблюли процедуру и действовали безрассудно, так что полностью виноваты в нынешней ситуации."
13035-52 = "..."
13035-53 = "Вы наверняка знаете, но теперь мы владеем правами на развитие железной дороги Абидоса."
13035-55 = "Не может быть!"
13035-56 = "Мы проверили! Облигации купила Нефтис, а не академия Хайлендер!"
13035-58 = "На этом этапе мы практически одно и то же."
13035-59 = "Для корпоративной академии вроде Хайлендер заключать контракты с частными компаниями — обычное дело."
13035-60 = "Если коротко, права и обязанности Нефтис теперь также права и обязанности Хайлендер. Вы разве не знали, госпожа Изаёй Нономи?"
13035-61 = ""
13035-64 = ""
13035-65 = "Вы знакомы?"
13035-66 = "Не то чтобы, но..."
13035-68 = "Пусть она сама объяснит. А пока не могли бы вы передать Тупую и Ещё Тупее под мою ответственность? Взамен я приду в старшую школу Абидоса и отвечу на ваши вопросы."
13035-69 = "Э-Это..."
13035-70 = "Можете отпустить их."
13035-71 = ""
13035-74 = ""
13035-75 = ""
13035-76 = ""
13035-77 = ""
13035-78 = "Свобода!"
13035-79 = "Страшно. Это было очень-очень страшно."
13035-80 = "Подготовьте вопросы. Как только смогу, приду к вам."
13035-81 = "Вы двое. Уходим."
13035-82 = ""
13035-84 = ""
13035-85 = ""
13035-86 = "Вот так просто…"
13035-87 = ""
13035-89 = ""
13035-90 = "..."
13035-91 = "Пошли, мелкие. Пока уходим отсюда. Скоро получим ответы."
13035-92 = "[ns] Вернуться в комнату Комитета по выплате долга."
