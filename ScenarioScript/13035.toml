[translation]
13035-3 = "Uaaah?!#nElas são fortes demais!"
13035-4 = "Dano bem pesadinho..."
13035-8 = "E ainda fomos cercadas... Será que a gente não vai conseguir entregar no prazo?"
13035-9 = "Será que já era?"
13035-11 = "Mas quem são essas garotas...?"
13035-13 = "Por favor, expliquem o que está acontecendo..."
13035-14 = "Pessoal da Academia Ferroviária Highlander.#nO que vocês estavam fazendo no Distrito Autônomo de Abydos?"
13035-15 = "Vocês provavelmente já têm uma boa ideia, não?"
13035-23 = "Supervisora!"
13035-24 = "Help me."
13035-26 = "...Quem é você?"
13035-27 = "Ora, veio resgatar elas?"
13035-29 = "...Não, não é bem isso."
13035-31 = "Mentira?!"
13035-32 = "Traição?"
13035-34 = "Não é traição.#nSó não quero que pensem que somos aliadas."
13035-35 = "Meu nome é Asagiri Suou.#nSou a Supervisora Administrativa subordinada diretamente ao conselho diretor da Academia Ferroviária Highlander."
13035-36 = "Supervisora Administrativa...?"
13035-37 = "Podem me considerar a garota de recados dos superiores. Quanto às idio..."
13035-38 = "As gêmeas ali são Tachibana Hikari e Tachibana Nozomi.#nAmbas são executivas do Centro de Controle Central."
13035-39 = "Eu e elas temos uma relação de vigilância e contenção mútua...#nBasta que entendam isso."
13035-41 = "Na verdade, ela é nossa inimiga! Inimiga da obra e inimiga do prazo!"
13035-42 = "E espera aí, você não ia chamar a gente de idiota agora há pouco?!"
13035-43 = "Em vez de gêmeas, somos idiotas agora?#nUé?"
13035-48 = "Em nossa academia, cada departamento possui autoridade independente.#nNão é só porque somos da mesma escola que vou ficar brincando de amiguinha com vocês."
13035-49 = "Podem pensar nisso como facções divididas por região — ou seja, de acordo com as linhas que cada departamento administra."
13035-50 = "Acabei me alongando demais, mas deveria ter começado pedindo desculpas."
13035-51 = "Embora a responsabilidade seja do Centro de Controle Central — isto é, dessas idiotas —,#ncomo supervisora, peço desculpas. Causamos transtorno."
13035-52 = "..."
13035-53 = "Mas vocês já devem saber, não?#nOs direitos de desenvolvimento da Ferrovia Trans-Deserto de Abydos pertencem a nós atualmente."
13035-55 = "Hã?!"
13035-56 = "Isso não deveria pertencer à Nephthys?"
13035-58 = "Ah... parece que há um mal-entendido.#nVou explicar novamente."
13035-59 = "Para começar, é bastante comum que a Academia Ferroviária Highlander faça parcerias com empresas privadas."
13035-60 = "E, desta vez, essa parceira é simplesmente a Nephthys.#nVocê deve saber bem disso, não?#n— Izayoi Nonomi."
13035-65 = "Vocês se conhecem?"
13035-66 = "N-Não.#nMas..."
13035-68 = "De qualquer forma, poderiam soltar essas idiotas?#nPrometo que faremos uma explicação formal e detalhada sobre o assunto em Abydos em uma data posterior."
13035-69 = "I-Isso..."
13035-70 = "...Pode soltá-las."
13035-78 = "Nos salvamos!"
13035-79 = "Que susto."
13035-80 = "Se tiverem perguntas, peço que as reúnam até o dia marcado."
13035-81 = "Pois bem, com licença."
13035-86 = "Elas foram embora..."
13035-90 = "..."
13035-91 = "Por enquanto, vamos voltar também.#nEla disse que viria explicar tudo pessoalmente, afinal."
13035-92 = "[ns] Voltar para a sala do Comitê de Contramedidas."
13035-97 = "Próximo;Aqueles Que Seguem Adiante"
