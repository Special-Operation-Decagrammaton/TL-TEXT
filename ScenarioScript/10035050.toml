[translation]
10035050-1 = "Эпизод 5;Я не вижу чудовище..."
10035050-3 = "Да, так что... мы настоятельно просим всех посетителей волнового бассейна немедленно выйти из воды."
10035050-4 = "Так-так, не толкаемся, пожалуйста. Соблюдаем безопасность."
10035050-5 = "Дело в том... Просто..."
10035050-6 = "Если честно, я и сама не совсем уверена..."
10035050-7 = "Забудьте. Просто бегите!"
10035050-8 = ""
10035050-10 = ""
10035050-11 = ""
10035050-12 = ""
10035050-13 = "О нет!"
10035050-14 = "Пожалуйста, не толкайтесь. Эвакуируйтесь медленно и спокойно!"
10035050-15 = "Помните, безопасность прежде всего..."
10035050-16 = ""
10035050-18 = ""
10035050-19 = "А-а!"
10035050-20 = ""
10035050-22 = ""
10035050-24 = "Все, выходите из воды!"
10035050-25 = "Пожалуйста, эвакуируйтесь организованно!"
10035050-27 = "Что происходит? Почему нас эвакуируют?"
10035050-28 = "Не знаю, но должна же быть причина!"
10035050-29 = "Ага, пока просто будем действовать по ситуации!"
10035050-30 = ""
10035050-32 = ""
10035050-33 = "Стойте! Стойте!"
10035050-34 = "Что вы все делаете?"
10035050-35 = "Как вы можете выгонять посетителей из бассейна, даже ничего не доложив?"
10035050-36 = "Произошёл какой-то несчастный случай?"
10035050-38 = "О, вот и владелец!"
10035050-39 = "Несчастного случая не было, но есть опасность."
10035050-40 = "Знаете, когда «Валькирия» прислала вас, я думал... Какая ещё опасность?"
10035050-41 = "Неисправен генератор волн?"
10035050-42 = "Датчик качества воды подаёт сигнал?"
10035050-43 = "Но..."
10035050-44 = "Позволь мне говорить, Фубуки."
10035050-45 = "Меня зовут Огата Канна. Я спасатель от Полицейской школы «Валькирия»."
10035050-46 = "Сегодня примерно в 11:20 мы подтвердили присутствие неопознанного существа в волновом бассейне."
10035050-47 = "Из-за угрозы безопасности посетителей мы были вынуждены принять экстренные меры."
10035050-48 = "Неопознанное существо?"
10035050-49 = "Вот как? И как выглядело это существо?"
10035050-50 = "Оно было под водой, поэтому я не смогла хорошо рассмотреть, но..."
10035050-51 = "У него была большая пасть, четыре толстые лапы и мощное тело."
10035050-52 = "Ближайшее сравнение..."
10035050-53 = "...пожалуй, аллигатор."
10035050-55 = "Аллигатор?"
10035050-56 = ""
10035050-58 = ""
10035050-59 = "Вы хотите сказать, что видели АЛЛИГАТОРА в нашем парке?! Серьёзно?!"
10035050-61 = "Ик!"
10035050-62 = "Хм, тон сразу совсем другой."
10035050-64 = "Это не пляж и не река, это ПАРК, ради всего святого!"
10035050-65 = "Здесь и ЗОЛОТУЮ РЫБКУ не найдёшь, не то что аллигатора!"
10035050-66 = "Я многого от вас ожидал, раз вы из «Валькирии», а вы только мешаете моему бизнесу!"
10035050-67 = "Я просто сообщаю то, что видела."
10035050-68 = "Или вы намекаете, что я лгу?"
10035050-69 = "Э-Эй! Н-Нет-нет, пожалуйста, не смотрите на меня так!"
10035050-70 = "М-Может, вам просто показалось или вы не так увидели!"
10035050-71 = "Вы напугали посетителей и разогнали их без всякой причины!"
10035050-72 = "Вы же знаете, что история про «аллигаторов в канализации» — городская легенда, верно?"
10035050-73 = "Ущерб, который вы нанесли парку—"
10035050-74 = "[s1] «Подождите.»\n[s2] «Пожалуйста, успокойтесь.»"
10035050-77 = "О?"
10035050-78 = "А ты ещё кто, чёрт возьми?"
10035050-79 = "Хм? Сенсей из «Шале», говорите?"
10035050-80 = "И вы здесь как посетитель...?"
10035050-81 = "О боже! Прошу прощения. Я не понял, кто вы!"
10035050-82 = "Если бы я знал, что придёте именно ВЫ... я бы сделал всё гораздо удобнее для вас."
10035050-83 = "[s] «Не беспокойтесь об этом. Но, пожалуйста, обдумайте то, что рассказали студенты.»"
10035050-85 = "[ns] «Я их знаю, и они не из тех, кто действует безответственно.»"
10035050-86 = "*ахает*"
10035050-87 = "Но их заявление совершенно абсурдно!"
10035050-88 = "[s3] «Раз уж все посетители всё равно эвакуированы...»\n[s4] «Не лучше ли проверить на всякий случай?»"
10035050-91 = "Хм... Спокойствие посетителей и правда ВАЖНО..."
10035050-92 = "Ладно, хорошо. Сделаем."
10035050-93 = "Я не ожидаю найти никаких аллигаторов, но пусть охрана на всякий случай проведёт поиск."
10035050-94 = "[s] «Спасибо, что выслушали.»"
10035050-95 = "НО. Если они ничего не найдут..."
10035050-96 = "Ты..."
10035050-97 = "Вас всех отправят работать к стойке с такояки на открытом фуд-корте!"
10035050-98 = ""
10035050-101 = ""
10035050-103 = "Справедливо, не так ли? Если вы без веской причины сорвали работу парка?"
10035050-104 = "П-Пожалуйста, только не это...!"
10035050-105 = "Эй, ты! Пусть охрана и спасатели обыщут волновой бассейн!"
10035050-106 = "Осторожнее. Пф-ф, вдруг там «аллигатор»."
10035050-107 = ""
10035050-109 = ""
10035050-110 = ""
10035050-111 = "...Спасибо, Сенсей."
10035050-112 = "Хотя... спасатели вообще-то должны помогать, а не сами получать помощь."
10035050-113 = "[s5] «Не переживай об этом.»\n[s6] «Помогать ученикам — часть моей работы.»"
10035050-116 = "Ну, с таким количеством людей они обязательно найдут аллигатора."
10035050-117 = "Если он вообще существует..."
10035050-118 = "Я не вру, Фубуки."
10035050-119 = "Я своими глазами видела его тень в воде."
10035050-120 = "Я вам верю, директор!"
10035050-121 = "Они обязательно его найдут!"
10035050-122 = ""
10035050-125 = ""
10035050-127 = "Такояки, горячие такояки... Вкусные, обжигающе горячие такояки..."
10035050-129 = "Угх... Уже не понимаю, я готовлю такояки или такояки готовят меня..."
