[translation]
10050070-1 = "Эпизод 7;Последний шанс"
10050070-2 = "А... Сенсей. Здравствуйте..."
10050070-3 = "Я, эм, в общих чертах поняла, что происходит."
10050070-4 = "[s] «Прости, Уй.»"
10050070-5 = "Н-Нет... Вы... Вы мне не так уж мешаете."
10050070-6 = "Но раз уж об этом заговорили... Один, два... Четверо?"
10050070-7 = "Ух... Четверо, возможно, слишком много для старой библиотеки. Не беспокойте детей."
10050070-8 = "[s] «М-Мы постараемся вести себя тихо!»"
10050070-9 = "Хорошо... Тогда сюда... Идите за мной..."
10050070-10 = ""
10050070-12 = ""
10050070-14 = "Д-Добро пожаловать, Сенсей. Вы и правда уже были здесь."
10050070-15 = "Вот это неожиданное гостевое появление. И где — в Тринити!"
10050070-16 = "[s1] «Похоже, ситуация серьёзная, так что перейдём сразу к делу.»\n[s2] «Зачем ты вообще это устроила, Якумо?»"
10050070-19 = "У-Ух. Сегодня даже без приветствий?"
10050070-20 = "Хорошо. Хорошо... *вздыхает*"
10050070-21 = "Если сразу к сути — я сделала это ради денег."
10050070-22 = "П-Президент, сейчас не та ситуация, чтобы этим гордиться!"
10050070-23 = "Но это всё. Правда, больше ничего..."
10050070-24 = "...А? Вы не согласны? Это вообще-то было ужасное бизнес-решение?"
10050070-25 = "Прийти в район чужой школы, нелегально продавать книги... Риск не соответствует прибыли?"
10050070-26 = "[s] «Якумо, которую я знаю, просчитала бы всё до последней монеты.»"
10050070-27 = "Нет-нет-нет-нет. Вы же меня знаете, я люблю плыть по течению!"
10050070-28 = "Ух... Не смотрите на меня так."
10050070-29 = "*вздыхает*"
10050070-30 = "Хорошо, хорошо. Поняла."
10050070-31 = "...Значит, вы хотите, чтобы я сразу всё выложила? Ух... Так взрослые разговаривают?"
10050070-32 = "Тогда, Сенсей. Как вы думаете, что нужно культуре, чтобы расти?"
10050070-33 = "[s] «Эм... Любовь и интерес людей?»"
10050070-34 = "Понятно. Любовь и интерес..."
10050070-35 = "Вы не совсем неправы, но сама идея неверная."
10050070-36 = "Культура... — живое существо, которое растёт, питаясь деньгами. В этом она не так уж отличается от живых организмов вроде нас."
10050070-37 = "Думаете, это слишком радикально? Нет. Печально, но это реальность!"
10050070-38 = "Чтобы наслаждаться культурой... нужно тратить своё время... и деньги..."
10050070-39 = "...И за эту цену люди ожидают получить ценность: удовольствие, веселье, смех и всё такое."
10050070-40 = "По крайней мере, они хотят уйти с каким-то уроком или положительным впечатлением."
10050070-41 = "Сенсей. Вы когда-нибудь задумывались, сколько всего пишется каждый день?"
10050070-42 = "Есть такой идеалистический взгляд: если создать что-то хорошее, люди это обязательно заметят."
10050070-43 = "Но прямо сейчас, пока мы говорим, пишутся тысячи новых книг, статей и постов в соцсетях."
10050070-44 = "Я сказала «каждый день», но это слишком грубая мера. Немыслимое количество культурного контента выливается в мир каждый час, минуту, секунду."
10050070-45 = "И большая его часть отодвигается в сторону, забывается и выбрасывается."
10050070-46 = "...Это несправедливо. И грустно."
10050070-47 = "[s] «...»"
10050070-48 = "Этот боксёрский поединок, который мы называем рынком... Если бы им хотя бы позволили на мгновение гордо выйти на ринг перед поражением, это ещё можно было бы понять."
10050070-49 = "Они бы чему-то научились на неудаче. Когда-нибудь набрались бы смелости попробовать снова."
10050070-50 = "...А может, и нет. Некоторые споткнутся уже в первом раунде и больше никогда не поднимутся."
10050070-52 = "Но реальность такова, что большинство вообще не получит шанса выйти на ринг."
10050070-53 = "Их отодвигают на обочину и заставляют болеть за счастливчика-чемпиона, которому повезло победить."
10050070-54 = "Помните себя ребёнком? Дети всегда хотят быть кем-то, кем они не являются."
10050070-55 = "Они хотят сделать это, создать то, доказать себя и получить признание..."
10050070-57 = "Это просто часть человеческого опыта. Потребность в подтверждении своей ценности."
10050070-58 = "Но у мечт есть срок годности. Застоявшаяся мечта — испорченная мечта."
10050070-59 = "Не иметь мечты — трагедия, но ещё хуже цепляться за прогнившую, испорченную мечту. Есть такое выражение."
10050070-60 = "Зачем вселять желание..."
10050070-61 = "...а затем лишать меня таланта?"
10050070-63 = "[ns3] «Я знаю, это прозвучит как слова душного взрослого...»\n[ns4] «...но ты не слишком молода, чтобы думать о таком?»"
10050070-66 = "...И не говорите."
10050070-67 = "Но думаю, независимо от возраста, по всему миру есть дети, которые чувствуют именно так."
10050070-68 = "В любом случае, моя мысль вот в чём."
10050070-69 = "Каждый заслуживает хотя бы один шанс выйти на ринг. Сбудется твоя мечта или разобьётся вдребезги — по крайней мере, у тебя был шанс."
10050070-70 = "А ключ от ринга... это маркетинг."
10050070-71 = "Получить ярлык неудачника, даже не получив шанса доказать себя... По-моему, это жестоко."
10050070-72 = "Но на самом деле у маркетинга нет никакого ключа. Ключ — деньги. Именно деньги впускают людей в бой."
10050070-73 = "Потому что культура растёт на почве под названием «деньги», и кто-то должен эту почву возделывать."
10050070-74 = "...В общем, вот так мы здесь и оказались."
10050070-75 = ""
10050070-78 = "[ns5] «Но если деньги настолько важны...»\n[ns6] «...тогда почему ты работаешь с печатными изданиями и издательством?»"
10050070-81 = "Что?!"
10050070-82 = "[s7] «Есть куда более выгодные отрасли, если цель — заработать.»\n[s8] «Дистрибуция, логистика, финансы — список можно продолжать.»"
10050070-85 = "Кх?!"
10050070-86 = "Вы! Вы попали прямо в больное место...!"
10050070-87 = ""
10050070-89 = ""
10050070-90 = ""
10050070-91 = "[ns] «Я перегнул?»"
10050070-93 = "Нет-нет! Это было отлично, Сенсей! Иногда президенту нужен кто-то, кто нажмёт на тормоза вместо неё."
10050070-94 = "Однако я не могу сказать, что полностью не согласна с её словами."
10050070-95 = "В самом деле, кто идёт в издательское дело ради денег?"
10050070-96 = "[s] «Тогда и Якумо тоже...?»"
10050070-97 = "Фуфу. Кто знает?"
10050070-98 = "И почему, интересно, такой критик, как я, работает на такого президента?"
10050070-99 = "Да. Всё именно так, как вы думаете. Я работаю в смежной сфере, потому что люблю культуру, а если ещё и зарабатываю на этом — вообще прекрасно."
10050070-100 = "А если всё ещё и хорошо продвигается — лучше некуда."
10050070-101 = "Жадная и извращённая, правда? Такая она в самой своей основе."
10050070-102 = "Всю эту тему... она бы никогда не признала, если бы не вы, Сенсей."
10050070-103 = "В конце концов, почему человеку настолько кривому и аморальному было бы так трудно говорить об этом? Зачем обходиться метафорами и эвфемизмами?"
10050070-104 = "Потому что она говорит о себе, разумеется."
10050070-105 = "Например, кто так и не получил шанса выйти на ринг? Кто озлоблен из-за того, что мотивации полно, а таланта нет?"
10050070-106 = "Есть над чем подумать."
10050070-107 = "[s] «Тогда... ты хочешь сказать...?»"
10050070-108 = "Фуфу. Некоторые вещи лучше оставить воображению, Сенсей."
10050070-109 = "...Не говори странных вещей, Таканэ. Накаркаешь ещё, и мы не получим нашу совершенно заслуженную выплату."
10050070-110 = "Да-да. Поняла, Президент."
10050070-112 = "[ns9] «Я понимаю позицию Издательского отдела.»\n[ns10] «Но какими бы ни были мотивы, лгать всё равно нельзя.»"
10050070-115 = "А? Лгать? О чём вы...?"
10050070-116 = "[s11] «Например, называть Таканэ принцессой...»\n[s12] «И не только это...»"
10050070-119 = "К-Как вы узнали...? Таканэ...?"
10050070-120 = "Задумайтесь над своими поступками, Президент! Вы с этим зашли слишком далеко!"
10050070-121 = "Мне до сих пор ужасно неловко!"
10050070-122 = "[s13] «В любом случае, я всё для вас улажу.»\n[s14] «А ваша задача — закончить эту бизнес-затею. Здесь и сейчас.»"
10050070-125 = "Ладно-о..."
10050070-126 = ""
10050070-131 = ""
10050070-132 = "П-Плохие новости. Сенсей! Студентки Комитета правосудия... идут к вам!"
