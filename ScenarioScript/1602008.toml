[translation]
1602008-1 = "Секретная база одного снайпера"
1602008-2 = "Я возвращался в Шале после деловой встречи..."
1602008-3 = ""
1602008-6 = ""
1602008-7 = "[ns] «Здравствуйте! Здесь что-то случилось?»"
1602008-8 = "А, [USERNAME] Сенсей!"
1602008-9 = "Здравствуйте! Спасибо за вашу службу, Сенсей."
1602008-10 = "Мы обыскиваем район по заявлению, поступившему в Валькирию."
1602008-11 = "[s] «Что-то случилось?»"
1602008-12 = "Нет, скорее просто странное явление."
1602008-13 = "Сенсей, вы раньше видели такой символ?"
1602008-14 = ""
1602008-16 = ""
1602008-18 = "[ns1] «Каракули...?»\n[ns2] «Это какое-то проклятие...?»"
1602008-20 = "Н-Не говорите так зловеще!"
1602008-21 = "В последнее время мы получаем сообщения о загадочных символах, появляющихся в разных местах D.U., и сейчас расследуем."
1602008-22 = "Связи между местами пока найти не удалось."
1602008-23 = "Никаких преступлений не совершено, анализ символов тоже ничего не дал."
1602008-24 = "Но всё равно подозрительно, поэтому Бюро безопасности усилило патрулирование района."
1602008-25 = "[s] «У вас и без того работы хватает...»"
1602008-26 = "Это обычная служба Полицейской школы Валькирии."
1602008-27 = "Если случайно увидите такой символ где-нибудь, пожалуйста, сообщите, Сенсей!"
1602008-28 = "[s] «Буду иметь в виду.»"
1602008-29 = "Спасибо!"
1602008-30 = ""
1602008-32 = ""
1602008-34 = "Некоторое время спустя..."
1602008-36 = "[ns3] «Хм, прогноз ничего не говорил о дожде...»\n[ns4] «Где можно укрыться?»"
1602008-39 = "[ns] Направиться под эстакаду."
1602008-42 = "Вокруг никого не было, а под эстакадой слышались только стук дождя и шум проезжающих машин."
1602008-43 = "Кто-то, похоже, незаконно сваливал здесь строительный мусор — повсюду беспорядочно валялся хлам."
1602008-44 = "На одной из опор я заметил что-то странное."
1602008-45 = "[ns] «Это...?»"
1602008-47 = "Присмотревшись, я увидел символ, который показывали студенты Валькирии, нарисованный над лестницей к импровизированному второму уровню."
1602008-48 = ""
1602008-51 = "Мне показалось, что наверху кто-то есть."
1602008-52 = "[ns5] «Дикое животное...?»\n[ns6] «Стоит проверить...»"
1602008-55 = "[ns] Подняться по лестнице."
1602008-59 = "...Кто там?!"
1602008-60 = "[ns7] «Н-Не стреляй!»\n[ns8] «Я просто проходил мимо!»"
1602008-62 = "Какой случайный прохожий решил бы полезть по лестнице?!"
1602008-63 = "...О, Сенсей?"
1602008-64 = ""
1602008-66 = ""
1602008-67 = "[ns] «Отоги?»"
1602008-68 = "Ах. Вы меня нашли. А я только недавно сделала эту базу."
1602008-69 = ""
1602008-71 = ""
1602008-72 = ""
1602008-73 = "Как вы узнали, что я здесь?"
1602008-74 = "[s] «Просто пошёл по странному символу на лестнице.»"
1602008-75 = "А, Код убежища."
1602008-76 = "Люди без жилья используют такие символы для общения."
1602008-77 = "По ним можно понять, кто здесь бывает и безопасно ли место."
1602008-78 = "Во время миссий мне часто приходится заходить на их территорию, поэтому я отмечаю места, которыми пользуюсь..."
1602008-79 = "Не ожидала, что именно это вас сюда и приведёт. Придётся пересмотреть метод."
1602008-80 = "[s] «Это твоя секретная база?»"
1602008-81 = "Да. Уютно, правда?"
1602008-82 = "Пусть так не выглядит, здесь есть необходимые для миссий припасы: патроны, батареи и прочее."
1602008-83 = "И кофейник! На случай если нужно передохнуть."
1602008-84 = ""
1602008-86 = ""
1602008-87 = "Хм. Похоже, дождь скоро не закончится..."
1602008-88 = "Как насчёт чашки кофе?"
1602008-93 = "― [log=오토기]Ух... Горький и сухой...[/log][wa:2040]"
1602008-95 = "― [log=오토기]Ужасный. Может, зёрна испортились.[/log]"
1602008-98 = "[ns9] «По-моему, не настолько плохо.»\n[ns10] «Пить кофе под дождём на улице — будто сон.»"
1602008-101 = "― [log=오토기]Мой сон...[/log][wa:1556]"
1602008-103 = "― [log=오토기]Да.[/log][wa:40]"
1602008-106 = "― [log=오토기]Без этой мечты[/log]"
1602008-108 = "― [log=오토기]я никогда бы не дошла так далеко.[/log][wa:10]"
1602008-111 = "― [log=오토기]Вы[/log][wa:850]"
1602008-113 = "― [log=오토기]в детстве когда-нибудь хотели построить секретную базу?[/log]"
1602008-116 = "― [log=오토기]Реальность[/log]"
1602008-118 = "― [log=오토기]оказалась совсем не такой, как я представляла, когда наконец сделала свою.[/log]"
1602008-121 = "― [log=오토기]Здесь тесно, неудобно[/log]"
1602008-123 = "― [log=오토기]и довольно скучно.[/log]"
1602008-127 = "― [log=오토기]Наверное,[/log][wa:2380]"
1602008-129 = "― [log=오토기]с мечтами всегда так. Реальность никогда до них не дотягивает.[/log]"
1602008-132 = "― [log=오토기]Идеальный взрослый,[/log]"
1602008-134 = "― [log=오토기]жизнь в SRT...[/log]"
1602008-137 = "― [log=오토기]Но одновременно[/log]"
1602008-139 = "― [log=오토기]именно благодаря этой мечте...[/log]"
1602008-142 = "― [log=오토기]Разочарования реальности[/log][wa:10]"
1602008-144 = "― [log=오토기]стали для меня чем-то вроде приобретённого вкуса.[/log][wa:10]"
1602008-147 = "― [log=오토기]Сенсей. Каков на вкус дешёвый кофе, настоянный на моих мечтах?[/log][wa:2150]"
1602008-149 = "― [log=오토기]Ну как?[/log]"
1602008-152 = "― [log=오토기]Фуфу.[/log]"
1602008-154 = "― [log=오토기]Ещё раз добро пожаловать в мой мир.[/log][wa:1140]"
1602008-157 = "Мы с Отоги пережидали дождь под эстакадой, вместе потягивая её горький кофе."
