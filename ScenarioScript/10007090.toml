[translation]
10007090-1 = "Эпизод 9;Снести всё!"
10007090-4 = "Экскаватор... Наша мечта построить огромный курорт горячих источников...!"
10007090-5 = ""
10007090-7 = ""
10007090-10 = "Как смеют эти мелкие из Геенны вытворять такое на территории Красной Зимы!"
10007090-11 = "Я вычищу их так, что ничего не останется!"
10007090-12 = "О, Марина. Прекрасно! Как и ожидалось от моей правой руки!"
10007090-13 = "В знак признания твоего выдающегося достижения в устранении этих непокорных мелких, угрожавших безопасности академии Красной Зимы, я награждаю тебя специальным орденом воинской доблести первого класса!"
10007090-14 = "Спасибо, президент. Я, Марина, буду изо всех сил стараться быть вам ещё преданнее."
10007090-15 = "Хм, хорошо, хорошо!"
10007090-16 = "Теперь осталось только снести курорт горячих источников."
10007090-17 = "Жаль сносить такой комплекс... Куда лучше разобрать его и использовать материалы для статуи меня самой!"
10007090-19 = "Так, «Чистильщик №1»! Сноси всё!"
10007090-20 = ""
10007090-23 = ""
10007090-24 = "Ч-Что вы собираетесь сносить?"
10007090-25 = "О, бывшая управляющая. Наконец-то пришла."
10007090-26 = ""
10007090-29 = ""
10007090-30 = "Клуб горячих источников и гвардия Секретариата..."
10007090-31 = "Что, чёрт возьми, происходит?"
10007090-32 = "Хмф, оказалось, эти непокорные мелкие из Геенны собирались взорвать весь район Красной Зимы только потому, что в источниках может закончиться вода!"
10007090-33 = "На курорте закончится вода...?"
10007090-34 = "Именно. Ради такой ерунды они собирались взорвать здание Секретариата. Нелепость!"
10007090-35 = "Но не волнуйся! Их злодейские планы уже уничтожены доблестным Советом безопасности Секретариата!"
10007090-36 = "Н-Но что будет с курортом горячих источников №227?!"
10007090-37 = "Ну, обычно он просто закрылся бы, когда вода иссякнет."
10007090-38 = "Но прежде чем это случится, мы разберём его до последнего обломка."
10007090-39 = "Высококачественный строительный камень и древесина курорта будут повторно использованы для создания символов моей власти, которыми все будут восхищаться... Можешь гордиться, ахахаха!"
10007090-40 = ""
10007090-42 = ""
10007090-43 = "Это... неприемлемо!"
10007090-45 = "Это неприемлемо!!"
10007090-47 = "Почему ты вдруг закричала?! Я чуть не упала!"
10007090-48 = "По какому праву вы закрываете курорт горячих источников, президент?"
10007090-49 = "П-По какому праву? Я-Я президент!"
10007090-50 = "Президентские полномочия туда, полномочия сюда. Ну и где вы были, президент, когда мы замерзали до смерти в бывшем институте без единого полена?!"
10007090-51 = "Э-э, ну, эм..."
10007090-52 = "Даже если он был построен с нечистыми намерениями, этот курорт нам дорог!"
10007090-53 = "Этот курорт — единственное счастье, которое мы испытали! Наша единственная надежда!"
10007090-54 = "А ты пытаешься отнять его у нас!"
10007090-55 = "Глупая мелкая! Фальшивые усы! Надеюсь, ты перестанешь расти и всю жизнь останешься ростом 4'2!"
10007090-56 = "К-Как ты смеешь говорить такие оскорбительные вещи мне, самому могущественному человеку Федеральной академии Красной Зимы!"
10007090-57 = ""
10007090-58 = "Ты с ума сошёл?"
10007090-59 = "Я не сошла с ума! Чего мне вообще бояться, если ты отнимаешь у меня всё? А?!"
10007090-60 = "Президент... Президент..."
10007090-61 = "Я никогда тебя не прощу!"
10007090-62 = "...*икает*"
10007090-63 = ""
10007090-65 = ""
10007090-67 = ""
10007090-68 = "*шёпотом* Эм, Нодока... что-то пила?"
10007090-69 = "Морс, который я дала ей раньше, возможно, перебродил сильнее, чем я думала."
10007090-70 = "Но даже так она выпила всего один стакан..."
10007090-72 = ""
10007090-73 = "Я этого не потерплю!"
10007090-74 = ""
10007090-75 = "Я собиралась просто снести курорт и никого не вычищать, потому что мне понравились местные мандзю!"
10007090-76 = ""
10007090-77 = "Но теперь за оскорбление меня тебя ждёт самое страшное наказание! Разбавленный водой пудинг, который студенты спецотряда раньше получали раз в месяц, больше выдавать не будут!"
10007090-78 = "Думаешь, нас это напугает?"
10007090-79 = "Если продолжишь вести себя неразумно, у меня есть и другие способы с тобой разобраться!"
10007090-80 = ""
10007090-82 = ""
10007090-83 = ""
10007090-84 = "Минори!"
10007090-86 = "Ага, звала?"
10007090-87 = "У меня для вас заказ. Мы наймём вас на прибыль от бизнеса горячих источников!"
10007090-88 = ""
10007090-90 = ""
10007090-91 = ""
10007090-92 = "Один миллион иен! Заплачу авансом!"
10007090-93 = "П-Подожди, Нодока. Это все наши деньги."
10007090-94 = "Какая разница!"
10007090-95 = "Если мы потеряем курорт, они всё равно станут бесполезны!"
10007090-96 = "Ладно. Мы согласны. Что Рабочей партии нужно сделать?"
10007090-97 = "Вышвырните эту чёртову мелкую диктаторшу и её прихвостней с курорта!"
10007090-98 = "Если всего-то..."
10007090-99 = "Мы можем хоть весь день!"
10007090-100 = "Товарищи, нам поручили новую работу!"
10007090-101 = "С этого момента вместе со студентами спецотряда мы выбьем дерзкую президентшу Черино!"
10007090-103 = ""
10007090-104 = "Революция! Революция!"
10007090-106 = "Спецотряд и Рабочая партия объединили силы?"
10007090-107 = "Д-Да хоть сколько вас будет!"
10007090-108 = "Марина!"
10007090-109 = "Снеси курорт вместе с этими реакционными силами, которые сомневаются в моей власти!"
10007090-110 = "Да начнётся парад чистки!"
