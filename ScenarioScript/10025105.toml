[translation]
10025105-2 = "RABBIT 1 докладывает. Носовая палуба под контролем."
10025105-3 = "RABBIT 2 докладывает. Кормовая палуба под контролем."
10025105-4 = "RABBIT 4 докладывает. Мостик под контролем."
10025105-5 = "Все противники нейтрализованы."
10025105-6 = "...Миссия завершена. Хорошая работа!"
10025105-7 = ""
10025105-9 = ""
10025105-11 = "Подождите. Вы мне никого не оставили!"
10025105-12 = "Ты опоздала."
10025105-13 = "Эти враги ничего особенного из себя не представляли. А я только начала разминаться..."
10025105-14 = "Хмпф. Я даже не успела испытать новые противокорабельные ракеты..."
10025105-15 = ""
10025105-17 = ""
10025105-18 = ""
10025105-20 = "Эм, RABBIT 2... Ничего же страшного, если я выпущу всего ОДНУ противокорабельную ракету?"
10025105-21 = "Говорят, одной достаточно, чтобы потопить корабль..."
10025105-22 = "Эй! Ты вообще понимаешь, что мы всё ещё на корабле?!"
10025105-23 = ""
10025105-25 = ""
10025105-27 = ""
10025105-28 = "...Так вы, девчонки, из SRT?"
10025105-29 = "А. Да. Ну..."
10025105-30 = "Простите..."
10025105-31 = "Мы не хотели вас обманывать. Мы просто приехали расследовать..."
10025105-32 = "Да мне всё равно, что вы не выложили передо мной всю душу. Просто..."
10025105-33 = "Обидно, что для решения проблем нашей деревни пришлось обращаться к чужакам."
10025105-34 = ""
10025105-36 = ""
10025105-37 = "Нет. Это была проблема не только деревни Ятоура."
10025105-38 = "Это ещё как?"
10025105-39 = "Эта деревня — часть Кивотоса. Проблема, случившаяся здесь, — проблема, которую мы все должны решать вместе."
10025105-40 = "Так что если в будущем у вас снова появится проблема масштаба Кивотоса, пожалуйста, не стесняйтесь обращаться в академию SRT."
10025105-41 = "Мы всегда рады помочь."
10025105-42 = "SRT, значит..."
10025105-43 = "Ладно. Запомню это название."
10025105-44 = "Отлично!"
10025105-45 = ""
10025105-47 = ""
10025105-49 = ""
10025105-50 = "Кстати, насчёт нашего подозреваемого..."
10025105-51 = "Дальше мы сами!"
10025105-52 = "В конце концов, содержание и передача задержанных — одна из наших обязанностей..."
10025105-53 = "К тому же это крупное задержание. В отчётах об эффективности будет смотреться отлично."
10025105-55 = "Понятно. Тогда уборку оставим вам."
10025105-57 = "Что вы собираетесь со мной делать...?"
10025105-58 = ""
10025105-60 = ""
10025105-62 = ""
10025105-63 = ""
10025105-64 = "Эй, Кумагаи."
10025105-65 = "Давайте покажем этому типу старое доброе гостеприимство Ятоуры."
10025105-67 = "П-Подождите... Что ещё за гостеприимство...?"
10025105-69 = "Ну, понимаешь, сначала—"
10025105-70 = "Не рассказывай. Пусть немного помучается."
10025105-72 = "Н-Но мне нужно знать, чтобы я мог—"
10025105-73 = ""
10025105-76 = ""
10025105-77 = ""
10025105-78 = "Ты испытаешь ровно то, через что заставил пройти нас."
10025105-80 = "Представляй самое худшее. Пусть страх пропитает тебя. Мучайся в темноте, гадая, что с тобой случится."
10025105-82 = ""
10025105-85 = "В конце концов, нет ничего страшнее неизвестности."
