[translation]
2003103-1 = "Серьёзно"
2003103-2 = "Я отвёл Шигурэ в большую баню в городке неподалёку от Бывшего института."
2003103-3 = ""
2003103-5 = ""
2003103-6 = "*вздох* Это было прекрасно!"
2003103-7 = "Иногда я приезжаю в город обменивать пойманных животных на необходимые вещи, но даже не знала, что здесь есть баня."
2003103-8 = "Спасибо, Сенсей. Сама я никогда не смогла бы позволить себе такое место."
2003103-9 = "Хотя мне правда было нормально мыться просто в реке..."
2003103-10 = "Вы ведь не всё ещё переживаете из-за того, что случилось в прошлый раз?"
2003103-11 = "[s1] «Это я заставил тебя опустошить горячий источник.»\n[s2] «Я не могу позволить своим студентам мыться в ледяной воде.»"
2003103-14 = "...Какой же вы добрый взрослый, Сенсей."
2003103-15 = "Ещё раз спасибо. Было приятно хоть раз воспользоваться нормальной баней."
2003103-16 = "Раз уж мы теперь чистые, может, вернёмся в Бывший институт?"
2003103-17 = "[s] «Раз уж мы здесь, почему бы немного не осмотреться?»"
2003103-18 = "Вы хотите осмотреться... в бане? Я не против, но..."
2003103-19 = ""
2003103-21 = ""
2003103-22 = ""
2003103-23 = "О? У них есть фруктовое молоко. Как мило."
2003103-24 = "Может, вы помните: на Курорте горячих источников №227 мы продавали свежие мандзю и фруктовое молоко из местных продуктов."
2003103-25 = "Хотите верьте, хотите нет, но они были очень популярны... В Бывший институт до сих пор иногда приходят письма с вопросом, вернётся ли наше фруктовое молоко."
2003103-26 = "Но это, похоже, сделано на фабрике..."
2003103-27 = ""
2003103-29 = ""
2003103-30 = ""
2003103-31 = "П-Простите... Вы случайно не одна из девушек, которые управляли Курортом горячих источников №227?"
2003103-32 = "...О? Мы знакомы?"
2003103-33 = "Полагаю, да. Когда я услышал, что Бывший институт открыл горячий источник, мне пришлось увидеть его своими глазами."
2003103-34 = "Курорт горячих источников №227 был настолько популярен, что мы потеряли из-за вас половину клиентов..."
2003103-35 = "Хаха... Когда вы так говорите, мне даже немного неловко."
2003103-36 = "Не переживайте. Мы и до этого не были крупным бизнесом."
2003103-37 = "В общем, фруктовое молоко, которое вы подавали, было настолько вкусным, что я захотел продавать такое же в своей бане..."
2003103-38 = "Но ни в одном магазине я не нашёл фруктового молока с тем же вкусом, что пил у вас."
2003103-39 = "О, такого фруктового молока вы нигде больше не найдёте. Каждый стакан я готовила сама."
2003103-40 = "Я могу сделать ещё, если будут подходящие ингредиенты..."
2003103-41 = "Не возражаете, если я воспользуюсь вашей кухней?"
2003103-42 = "Конечно. Располагайтесь."
2003103-43 = ""
2003103-45 = ""
2003103-46 = "[ns3] «Шигурэ, уверен, мне не нужно это говорить, но...»\n[ns4] «Пожалуйста, не добавляй алкоголь во фруктовое молоко.»"
2003103-49 = "Ну что вы, Сенсей. За кого вы меня принимаете? Я не подливаю алкоголь во всё, к чему прикасаюсь."
2003103-50 = "Хотя небольшая ферментация ведь не повредит...?"
2003103-51 = "[s] «Это совсем не успокаивает.»"
2003103-52 = "Посмотрим. Молоко, сахар и хороший выбор фруктов..."
2003103-53 = "Всё необходимое есть, так что пора приступать."
2003103-61 = ""
2003103-62 = "Готово. Представляю вам фирменное фруктовое молоко Шигурэ."
2003103-63 = "Я приготовила много, так что и вы выпейте стакан, Сенсей."
2003103-64 = ""
2003103-65 = ""
2003103-66 = ""
2003103-67 = "Вот оно! Именно этот вкус я искал...!"
2003103-68 = "Как странно! Я пытался приготовить его сам, но не мог повторить эту глубокую, насыщенную сладость..."
2003103-69 = "Хорошие ингредиенты — лишь часть уравнения. Ещё важнее их соотношение."
2003103-70 = "Вкус самого молока не менее важен, чем сладость фруктов. Добавишь слишком много фруктов — и баланс разрушится."
2003103-71 = "Когда смешиваете напиток, большую часть фруктов разомните, а немного нарежьте кубиками. Так вкус будет устойчивым, а текстура — интересной."
2003103-72 = "Добавьте немного сиропа от компота... и получите фирменное фруктовое молоко Шигурэ."
2003103-73 = "[s] «А, значит, ферментированным ингредиентом был сироп.»"
2003103-74 = "Верно. В отличие от обычного сахара, фруктовый сироп даёт более мягкую сладость и равномерно смешивается с остальным напитком."
2003103-75 = "С любой едой так. Если вкладывать усилия, результат может становиться только лучше."
2003103-76 = ""
2003103-78 = ""
2003103-79 = "Не хочу навязываться, но..."
2003103-80 = "Не могли бы вы рассказать, как готовите сироп, который использовали здесь?"
2003103-81 = "...Вы хотите мой рецепт сиропа?"
2003103-82 = "Да. Как видите, эта баня немного в стороне, да и условия не самые лучшие, поэтому посетителей у нас немного."
2003103-83 = "Но если бы мы могли продавать это вкусное фруктовое молоко... оно могло бы спасти бизнес!"
2003103-84 = "Хмм... Конечно, я могу научить..."
2003103-85 = "Но мне нужно кое-что взамен."
2003103-86 = "Б-Боюсь, я не смогу заплатить много, с таким-то слабым потоком клиентов..."
2003103-87 = "О, деньги мне не нужны."
2003103-88 = "Эта баня не слишком далеко от Бывшего института..."
2003103-89 = "Можно ли студентам Бывшего института бесплатно пользоваться баней здесь зимой?"
2003103-90 = "Летом можно без проблем мыться снаружи, но когда становится холодно, многим из нас тяжело."
2003103-91 = "Конечно можно! Если дадите рецепт, можете пользоваться этой баней когда угодно!"
2003103-92 = "Хи-хи. Тогда договорились."
2003103-93 = "Итак, насчёт сиропа..."
2003103-94 = "Для начала, каждая минута ферментации делает вкус насыщеннее..."
2003103-96 = "Я остался и помог Шигурэ подробно разобрать этапы приготовления сиропа для её знаменитого фруктового молока."
