[translation]
10046025-3 = "Ичика! Не будь такой злой, Милашка! Не притворяйся, что не знаешь меня!"
10046025-4 = "Лучше бы я тебя никогда не встречала!"
10046025-5 = "Рыбак рыбака видит издалека, да?"
10046025-6 = "Я никакой не...«игрок»! Хватит... петлять! Иди сюда!"
10046025-7 = "Вахаха! О, какая настойчивая! Прямо как... хорёк на охоте!"
10046025-8 = ""
10046025-10 = ""
10046025-12 = "..."
10046025-13 = ""
10046025-15 = ""
10046025-16 = "А, простите. Я... немного впала в ступор."
10046025-17 = "Никогда не видела, чтобы Ичика так заводилась."
10046025-18 = "Эта Касуми... У них что, какое-то соперничество?"
10046025-19 = "[s1] «Долгая история.»\n[s2] «Лучше не вдаваться в подробности...»"
10046025-20 = ""
10046025-21 = ""
10046025-23 = ""
10046025-24 = "Поверю вам на слово."
10046025-25 = ""
10046025-27 = ""
10046025-29 = ""
10046025-30 = "Хм... Думаю, на сегодня достаточно! Отступаем!"
10046025-31 = ""
10046025-33 = ""
10046025-35 = ""
10046025-36 = ""
10046025-38 = "Сегодня не уйдёте! Хасуми! Я их загоню!"
10046025-39 = ""
10046025-41 = ""
10046025-42 = "Ха, прямо как на нашем первом совместном задании. Хорошо, я зайду с тыла."
10046025-43 = ""
10046025-47 = "Все, остановитесь!"
10046025-48 = ""
10046025-50 = ""
10046025-51 = "...Мика?"
10046025-52 = ""
10046025-54 = ""
10046025-56 = ""
10046025-57 = "Пожалуйста. Я прошу вас перестать преследовать Кружок горячих источников."
10046025-58 = "Но что, если они..."
10046025-59 = "Да, я знаю. Они вернутся и разнесут наш драгоценный пляж своими лопатами и взрывчаткой."
10046025-60 = "Но самое главное — Наги скоро прибудет."
10046025-61 = ""
10046025-63 = ""
10046025-64 = "И для меня именно она сейчас важнее всего."
10046025-65 = "Если она увидит драку или следы драки, начнёт переживать и снова загонит себя работой."
10046025-66 = "Так что преследование Геенны или их арест... думаю, придётся отложить."
10046025-67 = "Если дойдёт до этого, я даже не против потерять часть пляжа. Самое важное..."
10046025-68 = ""
10046025-70 = ""
10046025-72 = "...сохранить спокойствие. Сделать так, чтобы Наги не пришлось вмешиваться..."
10046025-73 = "...Точно?"
10046025-74 = "А теперь все за мной! Нам нужно вернуться к расписанию!"
10046025-75 = "[s3] «Ты потрясающая, Мика.»\n[s4] «Я помогу всем, чем смогу.»"
10046025-76 = ""
10046025-77 = ""
10046025-79 = ""
10046025-81 = ""
10046025-82 = "...Мне стыдно. Вся эта драка была ниже моего достоинства."
10046025-83 = "Ты совершенно права. Главный приоритет здесь — Нагиса. Она заслуживает отдыха."
10046025-84 = "Эм... Я начну это собирать."
10046025-85 = ""
10046025-87 = ""
10046025-88 = "Давайте всё уберём. Времени всё меньше."
10046025-96 = "...Огромная."
10046025-97 = "Они оставили достаточно материалов, чтобы построить одно здание, а то и два! Что они вообще собирались делать?"
10046025-98 = "Что же ещё? Горячий источник."
10046025-99 = "...Понятно. Они немного... зациклены, да?"
10046025-100 = "Но хотя бы мы заперли их материалы. В ближайшее время они ничего не построят."
10046025-101 = "...Может, хотя бы пока мы здесь, они будут вести себя тихо."
10046025-102 = "Ахаха... Ага, надеюсь."
10046025-103 = "Главное, чтобы этот отпуск закончился хорошо."
10046025-104 = "Да, если в итоге со всеми всё будет хорошо, остальное неважно."
10046025-105 = ""
10046025-107 = ""
10046025-108 = "Мика?"
10046025-109 = ""
10046025-111 = ""
10046025-112 = "Ой, ничего!"
10046025-113 = "Большое вам всем спасибо."
10046025-115 = "Это был наш долг, и мы были рады помочь!"
10046025-117 = "Да. Больше ничего не говори."
10046025-118 = "И всё же я просто хочу выразить свою благодарность."
10046025-119 = "...Хи-хи."
10046025-121 = "Мики...?"
10046025-122 = "[s5] «...Мика?»\n[s6] «Что смешного?»"
10046025-123 = ""
10046025-124 = ""
10046025-126 = ""
10046025-127 = "А, эм. Ничего. Просто..."
10046025-128 = "У меня просто такое хорошее предчувствие! Всё будет замечательно, и всё потому, что мы работали вместе!"
10046025-129 = "...Ага!"
10046025-130 = "Всё обязательно закончится хорошо! Точно!"
