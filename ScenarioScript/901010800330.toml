[translation]
901010800330-6 = ""
901010800330-7 = "Начнём с руководства, найденного у входа на склад..."
901010800330-8 = "В основном там были обычные правила патрулирования, но сзади от руки было вписано странное правило."
901010800330-9 = "Требовалось один раз прокатить бочку вокруг порта."
901010800330-10 = "Это подтвердилось. Перед моим проникновением на склад мы видели, как член семьи катил бочку."
901010800330-11 = "Зачем руководство семьи Карпаччо заставляло сотрудников делать это?"
901010800330-12 = "Это напоминает мне один случай..."
901010800330-13 = "Я слышала, студенты Одиссеи однажды ночью катали артиллерийские снаряды по палубе корабля. Так они протестовали против своего студсовета."
901010800330-14 = "Может, здесь похожий жест?"
901010800330-15 = "Если так, то непонятно. Кому угрожают? Что хотят сказать?"
901010800330-16 = "Не очень-то это заявление, если никто не видит. А в полночь в порту почти никого."
901010800330-18 = "Верно. Но если хотя бы один человек увидит что-то настолько странное, слухи разлетятся быстро."
901010800330-19 = "Значит, они хотели распространять слухи..."
901010800330-20 = "То есть семья Карпаччо катала бочки среди ночи, чтобы..."
901010800330-21 = ""
901010800330-23 = ""
901010800330-24 = ""
901010800330-27 = ""
901010800330-28 = "#Q;오토기;То есть семья Карпаччо катала бочки среди ночи, чтобы...\n[as1] «Перемещать вещи в другие места.»\n[as2] «Тренировать членов семьи физически.»\n[as3] «Распространять слухи о бочках.»"
901010800330-29 = "Нет. В приказе явно сказано катить бочку вокруг порта, а не переместить её в конкретное место."
901010800330-30 = "И если целью была просто перевозка вещей, зачем делать это только глубокой ночью?"
901010800330-31 = "Уверена, причина лучше."
901010800330-32 = ""
901010800330-34 = ""
901010800330-36 = ""
901010800330-37 = ""
901010800330-40 = "Хм, катать тяжёлую бочку — наверняка неплохая тренировка..."
901010800330-41 = "Но тренажёры намного эффективнее для наращивания мышц."
901010800330-42 = "Да ещё можно травмироваться, занимаясь с ржавой бочкой. Или хуже — подхватить столбняк."
901010800330-43 = ""
901010800330-45 = ""
901010800330-46 = ""
901010800330-49 = "Верно. Если точнее, о крабах из бочки."
901010800330-50 = "Даже поздно ночью кто-нибудь обязательно заметит, если постоянно греметь катящейся бочкой."
901010800330-51 = "Когда по порту уже ходят слухи о крабах в бочках, очевидно, что подумают люди, увидев ночью члена семьи Карпаччо, катящего бочку."
901010800330-52 = "Семья Карпаччо перевозит крабов-монстров."
901010800330-53 = "Зачем им хотеть, чтобы люди так думали? Для бизнеса звучит плохо."
901010800330-54 = "Я бы не хотела связываться с тем, кто делает подобные вещи."
901010800330-55 = "Большинство тоже."
901010800330-56 = "Но такая городская легенда делает их опаснее в глазах людей. Они и так бандиты. Им выгодна устрашающая репутация."
901010800330-57 = "А, как когда люди рисуют число уничтоженных целей на борту танка?"
901010800330-58 = "Да. Хотя, к счастью, здесь всё значительно менее смертельно."
