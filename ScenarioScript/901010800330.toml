#[!][Data: "20/09"]
[translation]
901010800330-6 = ""
901010800330-7 = "Primeiro, quanto aos documentos encontrados na entrada do armazém..."
901010800330-8 = "Era um manual padrão de segurança, mas havia uma anotação muito bizarra no final."
901010800330-9 = "'Uma vez por semana, o vigilante do plantão noturno deve rolar um tambor de óleo e dar uma volta completa no porto à meia-noite'."
901010800330-10 = "E, de fato, antes de entrarmos no galpão, vimos com nossos próprios olhos um membro rolando o latão."
901010800330-11 = "O que será que a chefia da Família Carpaccio tinha na cabeça para dar uma ordem dessas?"
901010800330-12 = "Pensando em casos semelhantes que conheço..."
901010800330-13 = "Ouvi dizer que na Odyssey, os alunos protestavam contra o conselho rolando balas de canhão no convés de madrugada."
901010800330-14 = "Será que não é algo parecido com isso?"
901010800330-15 = "Protesto ou intimidação? Mas direcionado a quem?"
901010800330-16 = "Para começo de conversa, rolar um latão num cais deserto no meio da madrugada quase não tem testemunhas..."
901010800330-18 = "Mas basta uma única pessoa ver e ouvir, que o boato se espalha num piscar de olhos."
901010800330-19 = "Ou seja, o objetivo era justamente virar boato..."
901010800330-20 = "Então, o motivo pelo qual a Família Carpaccio rolava os tambores na calada da noite era—"
901010800330-21 = ""
901010800330-23 = ""
901010800330-24 = ""
901010800330-27 = ""
901010800330-28 = "Então, o motivo pelo qual a Família Carpaccio rolava os tambores na calada da noite era—\n[as1] Para transportar cargas de um lugar para outro.\n[as2] Para treinar a forma física dos capangas.\n[as3] Para disseminar os boatos sobre os tambores de óleo."
901010800330-29 = "Não, a ordem explícita não era levar para lugar nenhum, e sim apenas dar a volta no cais rolando o latão."
901010800330-30 = "Além disso, se a intenção fosse transportar carga, não haveria necessidade nenhuma de fazer isso de madrugada."
901010800330-31 = "Pense um pouco melhor, Sensei."
901010800330-32 = ""
901010800330-34 = ""
901010800330-36 = ""
901010800330-37 = ""
901010800330-40 = "Empurrar um latão pesado daqueles até serve como exercício físico, mas..."
901010800330-41 = "Se o foco fosse musculação, eles usariam aparelhos decentes de academia, não acha?"
901010800330-42 = "Sem falar que rolar tambor enferrujado no asfalto é pedir pra levar corte e pegar tétano."
901010800330-43 = ""
901010800330-45 = ""
901010800330-46 = ""
901010800330-49 = "Exatamente. Mais precisamente, alimentar o boato do 'Caranguejo de Tambor de Óleo'."
901010800330-50 = "Mesmo num cais vazio no meio da noite, aquele estrondo metálico inevitavelmente atrai os olhares de alguém."
901010800330-51 = "Com os rumores do caranguejo monstro ganhando força no Porto de Kanezaki, se as pessoas vissem mafiosos da Carpaccio rolando latões no escuro... é óbvio o que pensariam, não acha?"
901010800330-52 = "'A Família Carpaccio está transportando o caranguejo monstro.'"
901010800330-53 = "Mas ter uma fama assustadora dessas não prejudicaria os negócios deles?"
901010800330-54 = "Se dependesse de mim, eu não iria querer nem passar perto de gente assim..."
901010800330-55 = "Para pessoas comuns, sim."
901010800330-56 = "Mas para uma organização que flerta com agiotagem e extorsão, essa fama cai como uma luva, não é mesmo?"
901010800330-57 = "Ahhh... tipo pintar marcas de abate na fuselagem do tanque de guerra pra botar banca?"
901010800330-58 = "Embora ninguém tenha sido sacrificado de verdade neste caso."
