[translation]
41025-2 = "...Hm?"
41025-3 = "Que foi? Algum problema?"
41025-4 = "Parece que apareceram mais soldados."
41025-5 = "Achei que não tivesse sobrado mais ninguém..."
41025-6 = "Não me diga que é o Departamento de Segurança Pública...?"
41025-7 = "Ah, então é só bucha de canhão. Perdi meu tempo perguntando."
41025-8 = "Se é só isso, a Miyu dá conta deles de boa."
41025-9 = "É verdade, mas tem algo me incomodando..."
41025-10 = "...Bom, devo estar me preocupando à toa."
41025-12 = "Está escuro, que medo... Quero voltar logo para a escola..."
41025-13 = "...Ah, é mesmo, a escola foi fechada. O lugar para onde eu podia voltar..."
41025-14 = "Depois de tudo isso, agora nem para Valkyrie eu posso..."
41025-15 = "Acho que vou acabar sendo esquecida aqui, sozinha..."
41025-16 = "Até quando vamos ficar assim..."
41025-20 = "...?"
41025-24 = "Hã? Uma granada de fumaça...?"
41025-28 = "Kyaaah?!"
41025-29 = "D-De onde veio isso...? Mas os inimigos já..."
41025-30 = "Não recebi nenhum aviso nem nada... P-Preciso relatar a situação logo...!"
41025-37 = "Q-Quem está aí...?!"
41025-39 = "Humm..."
41025-40 = "Ora, sou eu, eu mesma. Do Esquadrão RABBIT..."
41025-41 = "Esquadrão RABBIT..."
41025-42 = "Hã, Saki-chan?"
41025-44 = "Isso, isso!"
41025-46 = "Tipo, parece que uma granada de fumaça disparou por acidente, então vim dar uma olhada."
41025-47 = "M-Mas, Saki-chan, você não tinha acabado de dizer \"não saia da sua posição de jeito nenhum\"...?"
41025-48 = "E além disso, a sua voz..."
41025-50 = "Ah, é que eu acabei inalando um pouco de fumaça... Cof, cof!"
41025-52 = "Bom, enfim, está tudo bem. Então que tal abaixar essa arma por enquanto?"
41025-53 = "(...Isso é suspeito. Nem o jeito de falar nem a voz parecem com os da Saki-chan...)"
41025-54 = "(É nessas horas que eu devo usar a senha...)"
41025-58 = "...\"Trevo\"."
41025-60 = "...Hã?"
41025-61 = "A Saki-chan sabe a resposta direitinho, né?"
41025-62 = "S-Se não souber responder, eu atiro agora mesmo...!"
41025-64 = "\"Trevo\"!"
41025-65 = "...Hã, quê?"
41025-67 = "Disse alguma coisa? Tem muito barulho por aqui e não consegui ouvir direito. A propósito... você sabe direitinho a resposta para essa palavra, né?"
41025-68 = "Q-Quê?! N-Não pode ser...?!"
41025-70 = "Se não responder, eu vou atirar, viu?"
41025-71 = "C-\"Cenoura\"!"
41025-73 = "Hmm, entendi. Beleza."
41025-74 = "Hã, a-ah...?"
41025-76 = "Parece que ela cede fácil sob pressão psicológica... Bem como o Sensei disse."
41025-83 = "Valeu por me contar a senha. Tchauzinho, senhorita atiradora coelhinha."
41025-88 = "E-Eu fui enganada...?!"
41025-93 = "...Que tiro foi esse agora? Não foi perto?"
41025-94 = "Não me diga que pegaram a Miyu...?"
41025-95 = "Até parece, é o Departamento de Segurança Pública, né? Até pelos equipamentos, eles não têm nível para derrotar a Miyu."
41025-96 = "Pois é, mas... não estou conseguindo contato com a Miyu."
41025-100 = "Eu vou lá."
41025-101 = "Moe, conto com o seu fogo de cobertura."
41025-102 = "Hã? Que cobertura o quê, já não tenho mais nenhuma munição."
41025-103 = "...Quê? Por quê?"
41025-104 = "Você mesma disse antes, \"com tudo\" e \"use tudo o que tiver\"."
41025-105 = "Quando fui perseguir o drone, torrei tudinho de uma vez♪"
41025-106 = "Hã?! V-Você só pode estar brincando!!"
41025-107 = "Despejar tudo de uma só vez sem pensar no amanhã..."
41025-108 = "As faíscas ficam tão lindas, é tão emocionante... Haah, haah..."
41025-109 = "Quem é que usa literalmente \"tudo\", sua idiota?! É óbvio que precisamos pensar no depois numa hora dessas!"
41025-110 = "Ficar sem munição numa situação dessas, o que a gente vai fazer agora—"
41025-117 = "Que explosão foi essa agora...?"
41025-121 = "Saki, Moe, qual é a situação? Relatem!"
41025-125 = "Sem resposta... Fomos emboscadas."
41025-126 = "Por isso mesmo eu disse para ficarem em alerta..."
41025-127 = "Não tem jeito, primeiro vou mudar de posição e contra-atacar..."
41025-132 = "Parada aí!"
41025-133 = "Estava mesmo aqui, exatamente como o Sensei disse...! Não se mexa!"
41025-134 = "Ocupação de um parque público usado pelos cidadãos e manifestação com uso de armas ilegais..."
41025-135 = "Sinto muito, mas vou ter que detê-la!"
41025-136 = "Siga as ordens desta oficial, levante as mãos e renda-se!"
41025-142 = "(Isso ficou complicado... Não esperava que já tivessem chegado até aqui.)"
41025-143 = "(Ela está armada apenas com uma pistola padrão... Provavelmente consigo desviar do primeiro tiro...)"
41025-147 = "N-Não se mexa! Eu vou atirar mesmo, viu?!"
41025-148 = "...Eu não vou me render!"
41025-154 = "A-Abrindo fogo!"
41025-164 = "Ngh!! Mas eu estava vendo para onde o cano apontava...?!"
41025-165 = "Ela contou que eu desviaria e mirou de propósito para outro lado até o último instante...?"
41025-166 = "Então... quem baixou a guarda fui eu também..."
41025-171 = "...E-Eu acertei?!?!"
41025-172 = "S-Será que finalmente a pontaria desta oficial melhorou...?"
41025-173 = "O esforço realmente dá frutos..."
41025-174 = "E a justiça também sempre vence no final... não é mesmo?!"
41025-178 = "Não consigo acreditar..."
41025-179 = "Quem diria que alunas do Departamento de Segurança Pública sozinhas realmente conseguiriam neutralizar a SRT..."
41025-180 = "[s] \"As duas se esforçaram muito.\""
41025-181 = "Entendo... Então este é o poder do Sensei [USERNAME]. E ainda mantém uma postura humilde."
41025-182 = "Pelo visto, os rumores entre as alunas também eram verdadeiros."
41025-183 = "...Em nome da Academia de Polícia Valkyrie, agradeço."
41025-192 = "Viu só, Sensei?! Meu disparo perfeito!"
41025-193 = "Foi um golpe impecável, digno do pessoal do Departamento de Segurança...!"
41025-194 = "Nossa, não achei que um truque tão velho ainda fosse funcionar..."
41025-195 = "Bom, foi tudo graças ao plano do Sensei, mas... que ótimo que deu certo."
41025-196 = "Com isso, acho que já dá para ganhar uns 20 dias de folga especial, né? Hehe..."
41025-198 = "...Haaah."
41025-199 = "Reconheço o mérito de vocês. Porém, isso não é algo que alguém na minha posição possa decidir. É da alçada dos superiores."
41025-200 = "Bom trabalho. Quanto à recompensa, aguardem o anúncio de méritos e punições do mês que vem."
41025-202 = "O quê? Não vou ganhar na hora...?"
41025-203 = "Que decepção."
41025-204 = "Mas o mês que vem já está logo aí! Quem sabe eu realmente consiga entrar para o Departamento de Segurança...!"
41025-205 = "Ah, não, eu dispenso..."
41025-206 = "Na verdade, eu recuso..."
41025-211 = "Nós perdemos para umas garotas com cara de tapadas daquelas...?"
41025-212 = "Olha quem fala, logo você que fez a burrice de gastar toda a munição de uma vez."
41025-213 = "Que é isso? Não existe nada mais importante do que um instante de puro brilho!"
41025-214 = "Acabou tudo..."
41025-215 = "A SRT, o Esquadrão RABBIT, eu... Estamos fadadas a perder tudo e desaparecer sozinhas..."
41025-216 = "..."
41025-217 = "[s1] \"Prazer em conhecê-las.\"\n[s2] \"Vocês são as alunas da Academia Especial SRT... certo?\""
41025-218 = "...Não temos absolutamente nada para falar com você!"
41025-219 = "...Não temos absolutamente nada para falar com você!"
41025-220 = "O que foi, veio tirar sarro? Ou veio rir da nossa cara?"
41025-222 = "...Você é o \"adulto\" que comandou o Departamento de Segurança Pública?"
41025-223 = "[s] \"Sim, sou eu.\""
41025-224 = "...Entendo. Então você é o famoso \"Sensei da Schale\", com autoridade investigativa extrajudicial, que resolve os problemas de tantas alunas e tem a confiança delas..."
41025-228 = "...Sensei. Adultos como você são os que nós mais detestamos."
41025-229 = "Vá para o inferno."
41025-230 = "Acho que nunca mais vamos nos ver."
41025-237 = "[ns] \"Hmm, elas estão cheias de energia.\""
41025-238 = "Não precisa se importar. Devem estar irritadas por terem sido derrotadas."
41025-239 = "[s] \"O que vai acontecer com elas agora?\""
41025-240 = "Primeiro, passarão por um interrogatório."
41025-241 = "Normalmente, depois disso, caberia a Valkyrie decidir a punição, mas..."
41025-242 = "Como o Conselho Estudantil Geral se envolveu até certo ponto, provavelmente não será o caso. A Chefe do Gabinete de Defesa deve decidir o destino delas."
41025-243 = "Se desejar, acredito que seja possível acompanhar o interrogatório."
41025-244 = "Bem, por enquanto, bom trabalho."
41025-250 = "Próximo;As Circunstâncias de Cada Um"
