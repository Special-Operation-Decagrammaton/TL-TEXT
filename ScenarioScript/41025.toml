[translation]
41025-2 = "…Что происходит?"
41025-3 = "Чего ты так надулась? Что-то не так с приборами наблюдения?"
41025-4 = "Нет, но к нам приближаются отряды."
41025-5 = "Разве мы не разгромили Бюро Безопасности и Бюро Внутренней Безопасности?"
41025-6 = "Они что, отправили против нас Бюро Общественной Безопасности?"
41025-7 = "Ха-ха-ха! Да я этих мелких сошек на десерт сожру!"
41025-8 = "Эх, ну, Мию следит за местностью. Так что взорвать их не будет проблемой."
41025-9 = "Надеюсь. Но зачем они вообще прислали таких бесполезных студентов…"
41025-10 = "Ну да ладно, уверена, всё будет в порядке."
41025-12 = "Ч-что, опять жук? Мне страшно… Хочу домой."
41025-13 = "Ой, но они ведь закрыли здание SRT, так что у меня больше нет дома…"
41025-14 = "А теперь и в Валькирию меня никогда не примут…"
41025-15 = "Меня просто оставят здесь, забытую и одинокую…"
41025-16 = "Они уверены, что мне всё ещё нельзя уходить?.."
41025-17 = ""
41025-20 = "А?"
41025-21 = ""
41025-23 = ""
41025-24 = "Дымовая граната?"
41025-25 = ""
41025-28 = "Ик!"
41025-29 = "Они не говорили мне, что враги подберутся так близко!"
41025-30 = "Я должна немедленно сообщить об этом."
41025-31 = ""
41025-35 = ""
41025-36 = ""
41025-37 = "Стоять! Или я буду стрелять!"
41025-38 = ""
41025-39 = "Эм..."
41025-40 = "Это я! Ученица из Академии SRT и отряда RABBIT…"
41025-41 = "Из Отряд RABBIT?"
41025-42 = "С-Саки?"
41025-43 = ""
41025-44 = "Д-Да!"
41025-45 = ""
41025-46 = "Появилась дымовая завеса, вот я и пришла проверить, всё ли у тебя в порядке."
41025-47 = "Но Саки, ты же сама говорила, что не стоит покидать свою позицию, несмотря ни на что."
41025-48 = "И ты как-то странно звучишь…"
41025-49 = ""
41025-50 = "Разве? Я… надышалась дымом! *кхе-кхе* Должно быть, из-за этого голос такой хриплый!"
41025-51 = ""
41025-52 = "Так или иначе, хватит направлять оружие на боевого товарища."
41025-53 = "(...Это странно. Она совсем не говорит и не звучит как Саки…)"
41025-54 = "(Думай, Мию!)"
41025-55 = ""
41025-57 = ""
41025-58 = "…Клевер."
41025-59 = ""
41025-60 = "Ч-Что ты сказала?"
41025-61 = "Ты не знаешь? Настоящая Саки знает кодовое слово и ответную фразу!"
41025-62 = "Тебе лучше ответить, или я буду стрелять!"
41025-63 = ""
41025-64 = "Ну… Эм… Клевер!"
41025-65 = "А?! Я первая это сказала!"
41025-66 = ""
41025-67 = "Здесь так шумно, я вообще ничего не слышу! Живо отвечай, и побыстрее!"
41025-68 = "Н-но… Это же не…"
41025-69 = ""
41025-70 = "Отвечай! Или ты будешь считаться врагом Академии SRT, и я открою огонь!"
41025-71 = "Л-Ладно! Морковь!"
41025-72 = ""
41025-73 = "Отлично. Кодовое слово — «клевер», ответ — «морковь»."
41025-74 = "О чём ты?"
41025-75 = ""
41025-76 = "Сенсей говорил, что снайпером будет легко манипулировать. Признаюсь, это было легче лёгкого."
41025-77 = ""
41025-79 = ""
41025-81 = ""
41025-82 = ""
41025-83 = "Спасибо за информацию. Пока-пока, крошка-кролик."
41025-84 = ""
41025-87 = ""
41025-88 = "Л-Лгунья!"
41025-89 = ""
41025-93 = "Вам не кажется, что звуки выстрелов становятся ближе?"
41025-94 = "Они же не могли победить Мию, не так ли?"
41025-95 = "Хах! Ты действительно думаешь, что эти глупые игрушечные полицейские со своими пукалками могли одолеть нашу Мию?"
41025-96 = "Её коммуникатор отключён. Что-то здесь не так."
41025-97 = ""
41025-99 = ""
41025-100 = "Я выдвинусь и разведаю ситуацию."
41025-101 = "Мое, дай ещё патронов."
41025-102 = "Патронов? Их нет. Ни-че-го. Даже пылинки не осталось."
41025-103 = "Н-но как?"
41025-104 = "Хи-хи. Все они пошли на \"бабах\"  для нашего шоу фейерверков!"
41025-105 = "Мы использовали всё-ё-ё: бомбы, патроны и всё остальное, чтобы взорвать тот дрон."
41025-106 = "Т-ты серьёзно использовала всё?!"
41025-107 = "Взорвать всё сразу? Вообще не думая о последствиях?"
41025-108 = "Ничто не могло обрадовать меня больше! Ха-ха-ха-ха! *тяжело дышит*"
41025-109 = "Но последствия есть! Миссия не выполнена!"
41025-110 = "Как ты могла потратить все наши патроны? Ты тупая?!"
41025-111 = ""
41025-114 = ""
41025-117 = "Что это за взрыв?"
41025-118 = ""
41025-120 = ""
41025-121 = "Саки, Мое. Ответьте! Вы в порядке?"
41025-122 = ""
41025-125 = "Нет связи. Должно быть, на них напали."
41025-126 = "Я постоянно говорила им быть начеку."
41025-127 = "Мне нужно подготовиться, чтобы переместить нашу базу и переработать стратегию…"
41025-128 = ""
41025-130 = ""
41025-132 = "Стоять на месте, нарушительница спокойствия!"
41025-133 = "Как и говорил [USERNAME] Сенсей, их лидер будет скрываться здесь!"
41025-134 = "Оккупация городского парка и использование нелегального оружия для противостояния официальной власти…"
41025-135 = "Серьёзность твоих преступлений невозможно измерить!"
41025-136 = "Бросай оружие и сдавайся!"
41025-137 = ""
41025-139 = ""
41025-141 = ""
41025-142 = "(Не ожидала, что их авангард прибудет так скоро. Что же делать…)"
41025-143 = "(Бюро Общественной Безопасности вооружено всего лишь короткоствольными пистолетами. Я смогу победить, но нужно действовать решительно и быстро.)"
41025-144 = ""
41025-146 = ""
41025-147 = "С-стой! Не двигайся, или я начну стрелять! Я серьёзно!"
41025-148 = "Нет! Я не сдамся без боя!"
41025-149 = ""
41025-151 = ""
41025-154 = "ССтой! Или я начну стрелять! На этот раз по-настоящему!"
41025-155 = ""
41025-157 = ""
41025-162 = ""
41025-164 = "К-как? Разве она не направила свой пистолет в совершенно другую сторону?"
41025-165 = "Она намеренно вынудила меня побежать и предугадала мои движения?"
41025-166 = "Похоже, на этот раз меня перехитрили…"
41025-167 = ""
41025-169 = ""
41025-171 = "П-п-погоди! Я реально в неё попала? С такого расстояния?"
41025-172 = "Хех. Полагаю, мой навык стрельбы действительно стал намного лучше."
41025-173 = "Впрочем, я не удивлена! Я назову это приём \"Удар Справедливости\", созданный специально для усмирения преступников!"
41025-174 = "И справедливость всегда побеждает!"
41025-177 = ""
41025-178 = "Я поражена."
41025-179 = "Нет, это не значит, что я не верила в Вас, но у меня совсем не было веры в учениц Бюро Общественной Безопасности."
41025-180 = "[s] «Это всё благодаря усердной работе самих студентов.»"
41025-181 = "Возможно, в этом и заключается Ваш истинный талант, [USERNAME] Сенсей."
41025-182 = "Признаюсь, у меня были сомнения. Но теперь я понимаю, как Вы заслужили такое безграничное доверие."
41025-183 = "Я бы хотела ещё раз поблагодарить Вас от имени всей Полицейской Академии Валькирия."
41025-184 = ""
41025-186 = ""
41025-190 = ""
41025-192 = "Сенсей, Сенсей! Вы видели мой \"Удар Справедливости\", который уложил плохишек?"
41025-193 = "Должно быть, я уже на одном уровне с девчатами из Бюро Безопасности!"
41025-194 = "А я-то думала, что на мою уловку даже ребёнок не поведётся, не говоря уже об элите..."
41025-195 = "Пусть это и был план Сенсея, но я на месте тоже отлично отыграла свою роль, не так ли?"
41025-196 = "О-о-о, не могу дождаться своего месячного отпуска. Хи-хи."
41025-198 = "Неужели мне придётся с этим мириться?"
41025-199 = "То, что вы хорошо показали себя на миссии, не означает, что вы получите всё, чего желаете. Руководство Полицейской Академии Валькирий само оценит ваши действия и наградит соответственно."
41025-200 = "Сейчас же возвращайтесь к своим обязанностям и ждите решения комитета по поощрениям и взысканиям в следующем месяце."
41025-202 = "Мне придётся ждать целый месяц до своего отпуска?"
41025-203 = "Хмф."
41025-204 = "Месяц - это ничто! Всего через месяц я стану полноценным бойцом Бюро Безопасности!"
41025-205 = "Почему ты считаешь это чем-то хорошим?"
41025-206 = "Если награда будет такой, я надеюсь, что смогу отказаться."
41025-207 = ""
41025-209 = ""
41025-211 = "Нас действительно поймала кучка таких тупиц?"
41025-212 = "Кто тут тупица? А? Не ты ли превратила все наши патроны в фейерверк ради собственного удовольствия?"
41025-213 = "Ты сомневаешься в красоте взрывов? Если да, то я тебя…"
41025-214 = "Вот и всё… Всё кончено…"
41025-215 = "Академия SRT, Отряд RABBIT, мой дом… теперь меня действительно забудут навсегда… Не только мои товарищи по отряду…"
41025-216 = "..."
41025-217 = "[s1] «Всем привет, Отряд RABBIT.»\n[s2] «Как вы, держитесь?»"
41025-218 = "Мы Вам ничего не скажем!"
41025-219 = "Мы Вам ничего не скажем!"
41025-220 = "Вы пришли, чтобы покичиться своей победой? Да?"
41025-222 = "Вы тот самый \"взрослый\", кто руководил ученицами из Бюро Общественной Безопасности?"
41025-223 = "[s] «Я просто дал им несколько советов.»"
41025-224 = "Хм. Легендарный Сенсей из Шале. Которому доверяют абсолютно все, который вмешивается куда угодно и машет своими внесудебными полномочиями, как волшебной палочкой, решая любые проблемы."
41025-225 = ""
41025-227 = ""
41025-228 = "Таких взрослых, как Вы, я не переношу больше всего."
41025-229 = "Надеюсь, Вы споткнётесь и сломаете палец на ноге."
41025-230 = "Если я снова Вас встреч - устрою Вам настоящий ба-бах."
41025-231 = ""
41025-233 = ""
41025-237 = "[ns] «Ха-ха. Какой весёлый отряд.»"
41025-238 = "Прошу, не обращайте внимание на оскорбления этих нарушителей. Они просто разочарованы и злы из-за поражения."
41025-239 = "[s] «Что с ними теперь будет?»"
41025-240 = "Мы расследуем их мотивы и будем действовать исходя из этого."
41025-241 = "Обычно Полицейская Академия Валькирий сама выносит наказание, но…"
41025-242 = "Из-за всей этой суматохи и репортёров на кону сейчас стоит репутация Главного Студенческого Совета. Полагаю, в это дело вмешается лично глава Оборонного комитета."
41025-243 = "Если захотите, можете заглянуть в Валькирию, чтобы поприсутствовать на расследовании."
41025-244 = "Ещё раз спасибо за проделанную сегодня работу. До следующей встречи."
41025-245 = ""
41025-247 = ""
41025-250 = "Следующий эпизод;Положение отряда"
