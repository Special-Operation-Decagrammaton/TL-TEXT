[translation]
10029025-2 = "...Понятно. Значит, вот как всё было."
10029025-3 = "Впрочем, от тебя иного и ожидать не стоило, Мисака. Наивная до невозможности..."
10029025-4 = "Но, как видишь... Ничего неподобающего ведь не произошло, верно?"
10029025-5 = "В отличие от Мисаки, я не хожу повсюду и не ввязываюсь в драки без причины."
10029025-6 = ""
10029025-8 = ""
10029025-9 = "[ns1] «Мисака? Это Шокухо?»\n[ns2] «Она спокойнее, чем ты описывала.»"
10029025-12 = "А... Эм... Да, это она, но..."
10029025-13 = "Так, подождите-ка! Она выставляет всё так, будто странная здесь Я!"
10029025-14 = "Что ты задумала, Шокухо?! Это совсем на тебя не похоже! Почему ты не устраиваешь проблем?!"
10029025-16 = "Ох. Теперь ты ещё и голос повышаешь? Только потому, что всё идёт не так, как ты ожидала? Впрочем, это вполне в твоём характере."
10029025-17 = "Правда, нельзя вот так просто объявлять людей нарушителями спокойствия... Не кажется, что твои обвинения слегка чрезмерны?"
10029025-18 = "Не говоря уже о том, что ты попала в такое место и сразу рассказала совершенно незнакомым людям всё о своих силах и способностях..."
10029025-19 = "Хаха. Я немного поражена. Я знала, что ты простая, но не думала, что настолько..."
10029025-20 = "Как ты меня назвала...?"
10029025-21 = "А... Что? Опять."
10029025-22 = "...Ммф... Моё электричество..."
10029025-23 = "[s3] «Что-то не так?»\n[s4] «Тебе будто не по себе...»"
10029025-26 = "А-а. Ну, просто... Ничего серьёзного."
10029025-27 = "Просто с тех пор, как я здесь, мне немного... сложно сосредоточиться. Когда пытаюсь создать заряд, начинает кружиться голова, и я не могу нормально сконцентрироваться..."
10029025-28 = "Если очень постараться, я могу, просто это немного неприятно. Вот и всё."
10029025-29 = "...Погоди."
10029025-30 = "Ага! Я вижу это по твоим глазам... Шокухо, с тобой происходит то же самое...!"
10029025-31 = "Разве я недостаточно ясно сказала, что не стоит рассказывать незнакомцам каждую мелочь о своих способностях?"
10029025-32 = "А теперь ты ещё и меня втягиваешь в свою глупость. Я старалась сохранять спокойствие и держать это при себе...!"
10029025-33 = "Как ни посмотри, мы здесь чужаки. Стоило бы проявлять хоть немного осторожности, не думаешь? Мисака?"
10029025-34 = "[s5] «Вы двое подруги?»\n[s6] «Сразу видно, что вы очень близки.»"
10029025-37 = ""
10029025-38 = "Нет, точно нет! / Нет, конечно же, нет."
10029025-39 = "[s] «...Прошу прощения. Простите.»"
10029025-41 = "*вздыхает*"
10029025-42 = "Так вот зачем вы меня искали? Чтобы вручить мне этот «местный обычай»?"
10029025-43 = "А вы... Вы Сенсей...?"
10029025-44 = "[s7] Передать оружие из Инженерного отдела.\n[s8] «Верно. Я пришёл отдать тебе это.»"
10029025-47 = "Хм..."
10029025-48 = ""
10029025-50 = ""
10029025-51 = ""
10029025-52 = "Лёгкое."
10029025-53 = "Не могу сказать, что это в моём стиле, но... Пожалуй, в этом месте куда сильнее бросается в глаза отсутствие оружия."
10029025-54 = "Спасибо за это, но... Надеюсь, вы простите меня, если я пока не готова сделать вас своим новым лучшим другом."
10029025-55 = "Возможно, я смогу выразить благодарность, предложив помощь, если она когда-нибудь понадобится вам в будущем?"
10029025-56 = "Ого, ты на удивление сговорчивая. Какая неожиданная прямота."
10029025-57 = "И кого мне благодарить за то, что я вообще оказалась в таком положении...?"
10029025-58 = "Я уже начинаю подозревать, что ты делаешь это нарочно, мисс Мисака."
10029025-59 = "...?! Ты хочешь сказать, что это моя вина?"
10029025-61 = "Как бы то ни было, сейчас нам эффективнее работать вместе. Давайте отложим личные разногласия."
10029025-62 = "Что касается последнего человека..."
10029025-63 = ""
10029025-66 = "...Ах."
10029025-67 = ""
10029025-70 = ""
10029025-71 = "[ns9] «Эйми?»\n[ns10] «Тебе кто-то позвонил?»"
10029025-74 = "Мне позвонила президент. Она закончила исследование и хочет, чтобы мы вернулись к ней."
10029025-75 = "О, и ещё она говорит, что о третьем человеке можно не переживать."
10029025-76 = "Президент уже забрала её."
