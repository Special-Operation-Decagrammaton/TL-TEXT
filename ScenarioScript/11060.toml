[translation]
11060-2 = "Episódio 6;Operação de Resgate!"
11060-3 = "Quarto da Serika"
11060-4 = "(Dim-dom)"
11060-5 = "Serika-chan? Serika-chan, você está aí?"
11060-7 = "(Dim-dom, dim-dom)"
11060-8 = "Serika-chaaan? O que será que houve? Ela nem atende o telefone..."
11060-9 = "Onde eu deixei a chave reserva mesmo...?"
11060-11 = "(Clique)"
11060-12 = "Serika-chan...? Será que ainda não voltou?"
11060-13 = "...Isso nunca tinha acontecido antes."
11060-14 = "N-Não pode ser...!!"
11060-16 = "Você tentou ligar para ela?"
11060-17 = "...Sim. Mas parece que o celular está desligado há várias horas..."
11060-18 = "No trabalho, parece que ela saiu no horário normal. Então não voltou para casa depois disso."
11060-19 = "Ela nunca ficou fora até tão tarde assim antes, né...?"
11060-20 = "Será que... foi aquele pessoal da Gangue dos Capacetes?"
11060-21 = "O quê?! A Gangue dos Capacetes pegou a Serika-chan...?!"
11060-22 = "Vamos esperar por enquanto. A Hoshino-senpai e o Sensei estão investigando."
11060-23 = "..."
11060-25 = "(Clack!)"
11060-26 = "Pessoal, desculpa a demora~"
11060-27 = "Hoshino-senpai! Sensei!"
11060-28 = "[s] \"Voltei.\""
11060-29 = "Como foi, senpai?"
11060-30 = "Usando a autorização do Sensei, conseguimos acessar a Rede Central administrada pelo Conselho Estudantil Geral."
11060-31 = "A Rede Central...#nSensei, você tem autorização até para isso..."
11060-32 = "Uhe~ Claro que foi escondido, né. Se descobrirem, vai sobrar relatório de advertência~"
11060-33 = "Eeeh?! V-Você tem certeza de que tudo bem, Sensei?"
11060-34 = "[s1] \"Sem problema, se for pela segurança da Serika.\"\n[s2] \"Se ninguém descobrir, tá tudo certo.\""
11060-35 = "Sensei..."
11060-36 = "B-Bem, isso é verdade, mas..."
11060-37 = "..."
11060-38 = "...Sim."
11060-39 = "Muito obrigada, Sensei."
11060-40 = "A localização do aparelho da Serika-chan logo antes de perder o sinal foi aqui, ó~"
11060-41 = "Aqui é... na extremidade da área urbana onde a desertificação está avançando, né?"
11060-42 = "É uma área em ruínas e sem moradores...#nComo não dá para manter a ordem lá, é um lugar onde só se juntam marginais."
11060-43 = "Quando fizemos a análise de ameaças antes, confirmamos que essa área#né onde se concentra a força principal da Gangue dos Capacetes Kata-Kata."
11060-44 = "Então... foi mesmo obra da Gangue dos Capacetes Kata-Kata...!!"
11060-45 = "Entendi~ Eles sequestraram a Serika-chan no caminho para casa e levaram ela para o esconderijo deles, então~"
11060-46 = "Atacar a escola não foi o bastante, então resolveram fazer uma refém para nos chantagear."
11060-47 = "Não adianta ficarmos aqui pensando! Vamos rápido resgatar a Serika-chan!"
11060-48 = "Sim, claro."
11060-49 = "Belezaaa! Então bora lá!"
11060-50 = "[s] \"Partiu!\""
11060-53 = "(Trec, trec)"
11060-54 = "U-Uugh..."
11060-55 = "...Hã?"
11060-56 = "(Ergue-se de repente) ?!"
11060-57 = "O-Onde eu estou?! Eu fui sequestrada?!"
11060-58 = "Ai, ugh... Minha cabeça..."
11060-59 = "(Trec, trec)"
11060-60 = "Aqui é... a carroceria de um caminhão...?"
11060-61 = "Maldita Gangue dos Capacetes... Para onde estão me levando...?"
11060-62 = "Está escuro... mas tem um pouco de luz entrando por uma fresta."
11060-63 = "Será que dá... para ver lá fora?"
11060-64 = "...Deserto... Trilhos de trem?!"
11060-65 = "Um lugar com trilhos... N-Não me diga que estamos no deserto nos arredores de Abydos?!"
11060-66 = "...N-Não pode ser. Daqui não dá para entrar em contato com ninguém!#nMesmo se eu conseguir escapar, como vou avisar o pessoal do Comitê de Contramedidas...?"
11060-67 = "O que eu faço? Todo mundo deve estar preocupado..."
11060-68 = "..."
11060-69 = "...Será que vão me enterrar em algum lugar assim mesmo?#nSem que ninguém nunca descubra..."
11060-70 = "Vou sumir sem dar notícias... e vão achar que eu fui embora da cidade, igual às outras alunas..."
11060-71 = "Será que vão achar que eu traí elas...?"
11060-72 = "Morrer sendo mal-interpretada, sem nunca mais ver todo mundo..."
11060-73 = "Eu não... quero isso..."
11060-74 = "..."
11060-75 = "Snif... ugh..."
11060-76 = "Snif, snif..."
11060-77 = "(KABUUUUM!!!)"
11060-78 = "A-Aaaah?!"
11060-80 = "(ESTRONDO!)"
11060-81 = "Cof, cof... cof..."
11060-83 = "O-O quê?! Uma explosão?! O caminhão explodiu?!"
11060-84 = "Será que fomos atingidos por um projétil de canhão... Mas de onde veio?"
11060-85 = "Serika-chan localizada! Confirmado que está bem!"
11060-86 = "...A-Ayane-chan?!"
11060-87 = "Também confirmei aqui! Encontrei uma Serika quase chorando!"
11060-88 = "?!"
11060-89 = "O quêêê?! A nossa adorável Serika-chan estava chorando?!#nVocê ficou tão solitária assim?#nA mamãe errou, desculpaaa!!"
11060-90 = "A-Aaaah?! C-Calem a boca!! E-Eu não estava chorando!!"
11060-91 = "Mentira! Eu vi direitinho com os meus próprios olhos!"
11060-92 = "Não chore, Serika-chan! Nós vamos enxugar essas suas lágrimas!"
11060-93 = "Aaaah, já disse para calarem a boca!! Eu disse que não estava, e pronto!! Quietos!!"
11060-94 = "[s] Dizer que está aliviado."
11060-95 = "P-Por que o Sensei também está aqui?! Como vocês chegaram até aqui?!"
11060-96 = "[s3] \"Não sou um stalker à toa.\"\n[s4] \"Salvar a princesa sequestrada é o dever do herói!\""
11060-97 = "N-Não brinque comigo! Seu Sensei pervertido!!"
11060-98 = "I... Id...!"
11060-99 = "Você é idiota, por acaso?!"
11060-100 = "Q-Quem você está chamando de princesa?! Para de brincadeira!! Q-Quer levar um soco?!"
11060-101 = "Uhe, parece que tá cheia de energia, né~ Resgate concluído com sucesso~"
11060-102 = "Que alívio... Serika-chan... Eu fiquei com tanto medo de que algo tivesse acontecido com você..."
11060-103 = "Ayane-chan..."
11060-104 = "Ainda não podemos baixar a guarda. Neutralizamos o caminhão usando o Sistema de Suporte Tático,#nmas ainda estamos bem no meio do território inimigo."
11060-105 = "Pois é~ Quando os inimigos souberem que o veículo com a refém foi destruído, vão vir furiosos pra cima da gente~"
11060-106 = "Múltiplas forças da Gangue dos Capacetes Kata-Kata detectadas à frente!!"
11060-107 = "E também detectei várias armas pesadas enormes!#nEles estão fechando o cerco aos poucos!"
11060-108 = "Tenho que admitir, eles são bons...#nBem, já que estamos aqui, que tal romper o cerco e voltar para casa?"
11060-109 = "...Tomem cuidado. Eles têm um tanque pesado modificado."
11060-110 = "Eu sei, um Flak 41 modificado."
11060-113 = "Então..."
11060-117 = "Vamos?"
