[translation]
11060-2 = "Эпизод 6;Спасательная операция!"
11060-3 = "Комната Сэрики"
11060-4 = "*динь-дон*"
11060-5 = "Сэрика? Ты там, Сэрика?"
11060-7 = "*динь-дон* *динь-дон*"
11060-8 = "Сэрика? Почему ты не отвечаешь на телефон?"
11060-9 = "Где она хранит запасные ключи...?"
11060-11 = "(открывает дверь)"
11060-12 = "Что происходит, Сэрика? Ты ещё не вернулась домой?"
11060-13 = "Такого раньше никогда не случалось..."
11060-14 = "Неужели...?"
11060-16 = "А что с её телефоном?"
11060-17 = "Он уже несколько часов выключен..."
11060-18 = "Её начальник сказал, что она отметилась после смены и ушла как обычно.#nПолучается, до дома она так и не добралась?"
11060-19 = "Ничего подобного раньше не случалось. Она всегда благополучно возвращалась домой..."
11060-20 = "Не думаете же вы... что это Банда шлемов?"
11060-21 = "Что? Банда шлемов?!"
11060-22 = "Возможно, но не будем делать поспешных выводов. Хошино и Сенсей всё ещё расследуют."
11060-23 = "..."
11060-25 = "(открывает дверь)"
11060-26 = "Простите, что заставили ждать."
11060-27 = "Хошино! Сенсей!"
11060-28 = "[s] «Мы вернулись»."
11060-29 = "Вы выяснили, что произошло?"
11060-30 = "Сенсею удалось войти в центральную сеть связи Генерального ученического совета."
11060-31 = "Вы смогли попасть в их сеть? Ого. Сенсей — это серьёзно..."
11060-32 = "Только это секрет. Если нас поймают, будут большие проблемы."
11060-33 = "Погодите! То есть вы даже не спросили разрешения?!"
11060-34 = "[s1] «Ничего страшного. Это ради безопасности Серики.»\n[s2] «Всё нормально, пока меня не поймают...»"
11060-35 = "Сенсей..."
11060-36 = "Да, но..."
11060-37 = "..."
11060-38 = "Хорошо."
11060-39 = "Спасибо, Сенсей."
11060-40 = "Вот последнее известное местоположение телефона Сэрики перед тем, как он отключился."
11060-41 = "Это один из районов, который сейчас поглощает пустыня, верно?"
11060-42 = "Скорее уже заброшенная пустошь. Там некому следить за порядком, поэтому вокруг полно всяких преступников."
11060-43 = "Верно. Когда мы изучали угрозы вокруг школы, выяснили, что здесь обитала Банда шлемов Ката-Ката."
11060-44 = "Значит, это всё-таки они!"
11060-45 = "Должно быть, они похитили Сэрику по дороге домой и отвезли в своё убежище."
11060-46 = "Наверняка до сих пор злятся после нашей последней битвы. Возможно, они взяли Сэрику в заложники, чтобы отомстить."
11060-47 = "Скорее всего! Нужно её спасать!"
11060-48 = "Согласна."
11060-49 = "Нельзя терять ни минуты!"
11060-50 = "[s] «Вперёд!»"
11060-51 = ""
11060-53 = "*тук* *тук*"
11060-54 = "Угх..."
11060-55 = "А?"
11060-56 = "...?!"
11060-57 = "Где я? Меня похитили?!"
11060-58 = "Ай... Голова."
11060-59 = "*тук* *тук*"
11060-60 = "Это кузов грузовика?"
11060-61 = "Банда шлемов... Куда они меня везут?"
11060-62 = "Здесь темно, но через щель в двери пробивается немного света."
11060-63 = "Может, получится разглядеть, что снаружи..."
11060-64 = "Песок... и железная дорога?"
11060-65 = "Значит, мы в пустыне на окраине Абидоса?"
11060-66 = "Плохо... Здесь одна пустошь и совершенно нет сигнала!#nДаже если мне удастся сбежать, связаться с остальными не получится."
11060-67 = "Что мне делать? Они наверняка с ума сходят от беспокойства."
11060-68 = "..."
11060-69 = "Они собираются закопать меня где-нибудь в пустыне, чтобы никто не нашёл?"
11060-70 = "А команда может решить, что я бросила их и уехала, как все остальные студенты..."
11060-71 = "Они подумают, что я их предала?"
11060-72 = "Так я и умру? И все запомнят меня предательницей...?"
11060-73 = "Нет. Я не могу этого допустить..."
11060-74 = "..."
11060-75 = "Угх..."
11060-76 = "*шмыгает носом*"
11060-77 = "*БА-А-АХ*"
11060-78 = "Ч-что это было?!"
11060-80 = "*удар* *грохот*"
11060-81 = "*кашляет* *кашляет*"
11060-82 = ""
11060-83 = "Какого чёрта? Взрыв? Грузовик взорвался?!"
11060-84 = "Откуда летят эти снаряды?"
11060-85 = "Я обнаружила Сэрику!"
11060-86 = "А-Аяне?!"
11060-87 = "Вижу её! Повторяю: вижу Сэрику! Она плачет!"
11060-88 = "...?!"
11060-89 = "Что?! Наша маленькая Сэрика плачет? Ой, наверное, так по нам скучала.#nЯ и не знала, что мы ей настолько дороги!"
11060-90 = "Угх! Какие же вы все раздражающие! Я не плакала!"
11060-91 = "Неверно! Подтверждаю: ещё несколько секунд назад в твоих глазах были слёзы!"
11060-92 = "Не плачь, Сэрика! Мы уже здесь и обещаем вытереть твои залитые слезами щёчки!"
11060-93 = "Чёрт возьми! Можно быть ещё более бесячими?! Я сказала, что не плакала, так что заткнитесь уже!"
11060-94 = "[s] «Рад видеть, что ты в порядке»."
11060-95 = "Что? Вы тоже здесь, Сенсей?! Как?"
11060-96 = "[s3] «Я же сталкер, помнишь?»\n[s4] «Герои ведь спасают принцесс, верно?»"
11060-97 = "Что вы несёте? Извращенец!"
11060-98 = "Вы что..."
11060-99 = "Вы там совсем мозгами поехали?!"
11060-100 = "Что вы только что сказали? Вы идиот? ЖИТЬ НАДОЕЛО?!#nК-кого это вы назвали принцессой?!"
11060-101 = "Хех. Наша дева в беде спасена. Теперь с ней всё будет хорошо."
11060-102 = "Слава богу. Я так переживала за тебя, Сэрика."
11060-103 = "Аяне..."
11060-104 = "Рано расслабляться. Мы остановили грузовик,#nно всё ещё на вражеской территории."
11060-105 = "Верно. Раз грузовик уничтожен, подкрепление наверняка уже в пути."
11060-106 = "Впереди подтверждены многочисленные противники из Банды шлемов Ката-Ката!"
11060-107 = "Также вижу немало сверхтяжёлого вооружения!#nОни постепенно смыкают кольцо!"
11060-108 = "Сглазила, называется! Угх. Что скажете, просто прорвёмся сквозь этих неудачников?"
11060-109 = "Осторожно. У этих головорезов есть модернизированный тяжёлый танк."
11060-110 = "Да, мы знаем. Это переделанная Flak 41."
11060-111 = ""
11060-113 = "Ну что..."
11060-114 = ""
11060-115 = ""
11060-116 = ""
11060-117 = "Начнём?"
