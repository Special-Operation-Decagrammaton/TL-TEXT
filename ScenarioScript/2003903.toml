[translation]
2003903-1 = "Вопрос бабочки"
2003903-2 = "Офис Шале"
2003903-4 = "...Так что это вызвало немалый переполох."
2003903-5 = "Сотрудничество президента Гэнрюмон с посторонними противоречит традициям. Это ставит вас в довольно затруднительное положение."
2003903-6 = "Я же просто хотела оставить свой пост."
2003903-7 = "[s] «Серьёзно?!»"
2003903-8 = "Фу-фу. Я пошутила."
2003903-9 = "[s] «Я так и знал...»"
2003903-10 = "Однако в каждой шутке есть доля правды."
2003903-11 = "[s] «Так всё-таки как?!»"
2003903-12 = "Фу-фу. Разгадать это — тоже часть удовольствия."
2003903-13 = "А теперь вернёмся к работе."
2003903-14 = "У меня никогда не было возможности посвящать силы задачам, не связанным с Гэнрюмон. Я весьма воодушевлена."
2003903-15 = "Но прежде чем мы начнём..."
2003903-16 = ""
2003903-18 = ""
2003903-19 = ""
2003903-21 = "[ns] «Что это?»"
2003903-22 = "Мне сказали, что это лечебные благовония, предназначенные для успокоения нервов и восстановления сил."
2003903-23 = "Общество восточной алхимии тайно приготовило их, узнав, что я стану представительницей студентов."
2003903-24 = "Итак, начнём. Время — драгоценный ресурс."
2003903-26 = "Так началась наша совместная работа с Кисаки..."
2003903-28 = "Хм... Сейчас стало популярно вести личные трансляции и снимать эти «челлендж-видео» в заброшенных зданиях старого города."
2003903-29 = "Местные жители всё сильнее обеспокоены шумом и угрозой безопасности."
2003903-30 = "Похоже, они просят Шале о дополнительном содействии, включая официальное заявление?"
2003903-31 = "[s] «Что бы ты сделала, Кисаки?»"
2003903-32 = "Всё очевидно. Корень проблемы — заброшенное здание."
2003903-34 = "При помощи Гэнрюмон мы просто снесём его до самого фундамента."
2003903-35 = "[s] «Это очень радикальный подход!»"
2003903-37 = "Разве? В Шаньхайцзине это было бы обычным делом."
2003903-38 = "...Нужно учитывать контекст?"
2003903-39 = "Полагаю... но я всё же считаю, что подобные ситуации нельзя разрешить без сильного и решительного руководства."
2003903-41 = "Что дальше? Массовые протесты студентов, недовольных нехваткой оружия и боеприпасов."
2003903-42 = "Как и должно быть. Постоянное и эффективное снабжение оружием, равно как и его обслуживание, в Кивотосе следует считать вопросом первостепенной важности. Оружие столь же необходимо, как пища, одежда и жильё."
2003903-43 = "[s] «(Серьёзно?!)»"
2003903-44 = "У студентов есть неотъемлемое право на протест, а также обязанность выдерживать последующую критику."
2003903-45 = "Дополнительное расследование не требуется. Похоже, здесь имело место ненадлежащее использование средств: предоставленная поставщиком бухгалтерская книга явно была подделана."
2003903-46 = "Гэнрюмон принято отвечать быстро и с абсолютной силой—"
2003903-47 = "[s] «Нельзя просто направо и налево применять физическую силу!»"
2003903-48 = "...Вот как? В Шаньхайцзине при желании можно казнить виновного в тот же день..."
2003903-49 = "*вздох* Конечно, в идеале люди просто соблюдали бы закон."
2003903-50 = "Однако вы должны понимать, Сенсей. В этом мире люди идут по тонкой грани, которую необходимо тщательно контролировать."
2003903-52 = "Просто определите, ложное ли это обвинение или нарушение закона, и при необходимости примените смертную казнь."
2003903-53 = "[s] «Н-никакой смертной казни!»"
2003903-54 = "Я, разумеется, выражаюсь фигурально—"
2003903-55 = "[s] «Мне всё равно! Нет!»"
2003903-56 = "Вот как..."
2003903-58 = "Хм. На сегодня с задачами закончено, Сенсей."
2003903-59 = "Ваше обычное рабочее время сократилось почти вдвое? Фу-фу. Я рада, что смогла быть полезной."
2003903-60 = "Хм? Моя скорость и рассудительность впечатляют, но предложенные решения были... слишком радикальными?"
2003903-61 = "Как печально. Похоже, мир пока ещё недостаточно велик, чтобы понять уклад Шаньхайцзина."
2003903-62 = "Итак, Сенсей. Что вы теперь будете делать?"
2003903-63 = "Хм? Всё закончилось гораздо раньше, чем вы ожидали, поэтому планов у вас нет?"
2003903-64 = ""
2003903-66 = ""
2003903-68 = "Я всё время чувствовал откуда-то чудесный аромат."
2003903-69 = "И понял, что он исходит от курильницы, которую принесла Кисаки."
2003903-70 = "Что-то случилось, Сенсей? Вы выглядите измученным."
2003903-71 = "Ах. Вас настолько завалили работой, что вы не спали три дня?"
2003903-72 = "Это недопустимо. Такому важному человеку, как вы, необходимо беречь здоровье. Тогда, может, сменим место?"
2003903-74 = "Ложитесь сюда. Я одолжу вам свои колени."
2003903-75 = ""
2003903-77 = ""
2003903-78 = ""
2003903-79 = ""
2003903-80 = "Да-да... Отдайтесь аромату и закройте глаза."
2003903-81 = "Вдох, выдох... Вот так..."
2003903-82 = ""
2003903-84 = ""
2003903-86 = ""
2003903-89 = "В какой-то момент стало трудно понять, сон это или реальность."
2003903-90 = "Но среди всего этого я ощущал прикосновение маленькой ладони, мягко поглаживающей меня."
2003903-91 = ""
2003903-92 = "...Вам что-то снится, Сенсей? У вас такое спокойное выражение лица."
2003903-93 = "Хотя говорят, что сны — признак того, что сон не слишком глубокий."
2003903-94 = "На моём лбу..."
2003903-95 = ""
2003903-96 = "Есть одна старая история."
2003903-97 = "Однажды человеку приснилось, что он — бабочка, порхающая по миру. Он был счастлив и доволен жизнью."
2003903-98 = "На моих щеках..."
2003903-99 = ""
2003903-100 = "Бабочка была так счастлива, что уже не знала, человек она или вовсе нечто иное."
2003903-101 = "Но внезапно человек проснулся. Он снова оказался человеком, а не бабочкой."
2003903-102 = "На моей шее..."
2003903-103 = ""
2003903-104 = "И он невольно задумался. Бабочка — это я? Или я — бабочка?"
2003903-105 = "Или между нами никогда не было различия? Такая незначительная вещь..."
2003903-106 = ""
2003903-116 = "Когда я открыл глаза, ни Кисаки, ни курильницы уже не было."
2003903-117 = "Я даже не был уверен, что Кисаки вообще действительно здесь находилась."
