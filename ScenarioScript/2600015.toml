[translation]
2600015-1 = "Чья-то ответственность"
2600015-2 = "Я вышел просто немного прогуляться."
2600015-3 = "Хм? Сенсей?"
2600015-4 = "Какая неожиданная встреча..."
2600015-5 = ""
2600015-8 = "[ns1] «Звучит как... Ого!»\n[ns2] «Чинацу? Это Чинацу!!»"
2600015-11 = "Д-да. Это я."
2600015-12 = "Какая бурная реакция. Мне приятно."
2600015-13 = "Но я не ожидала так скоро встретить вас прямо на улице. Возможно, вы слишком серьёзно восприняли моё сообщение..."
2600015-14 = "...Ах."
2600015-15 = "Ну, не поймите меня неправильно, я..."
2600015-16 = "...Прошу прощения?"
2600015-17 = "Разве у меня сегодня не выходной? Да, именно так. Как я и говорила."
2600015-18 = "...Моя сумка?"
2600015-19 = ""
2600015-21 = ""
2600015-23 = "А, вы об этом."
2600015-24 = "[s3] «Даже в выходной у тебя полная сумка.»\n[s4] «Это медицинская сумка. Думаешь, сегодня понадобится?»"
2600015-27 = "А. Значит, вот что вы имели в виду. Простите. Наверное, я плохо объяснила."
2600015-28 = "У меня выходной конкретно от Префектурной команды. Я собиралась зайти в Клуб неотложной помощи."
2600015-29 = "Не то чтобы у них всё совсем плохо, но они всегда заняты, так что лишние руки им точно пригодятся."
2600015-30 = "[s5] «Тебе из-за этого позвонили?»\n[s6] «И ты идёшь к ним сама.»"
2600015-33 = "Ну, не знаю, помните ли вы, но начинала я именно в Клубе неотложной помощи."
2600015-34 = "С тех пор я всегда ношу эту сумку... и помню все процедуры, которым там научилась."
2600015-35 = "Их президент и остальные..."
2600015-36 = ""
2600015-38 = ""
2600015-39 = "...ну, все они довольно странные, но в их навыках сомневаться не приходится."
2600015-40 = "[s7] «Значит, весь клуб такой?»\n[s8] «Наверное, тебе было нелегко.»"
2600015-43 = "Фу-фу. Мне никогда не казалось, что с ними особенно трудно."
2600015-44 = "И с работой мы всегда помогаем друг другу."
2600015-45 = "...Прошу прощения?"
2600015-46 = "Хотите что-то спросить?"
2600015-47 = "Хм... Что именно? При таких обстоятельствах я могу догадаться, но..."
2600015-48 = "...спрашивайте свободно. Я отвечу как смогу."
2600015-49 = "[s9] «Почему ты вступила в Префектурную команду, Чинацу?»\n[s10] «Почему ты сменила клуб?»"
2600015-52 = "Я угадала. Фу-фу."
2600015-53 = "Ну, ничего страшного, на это я могу легко ответить."
2600015-54 = "Вы не первый, кто спрашивает."
2600015-55 = "Если совсем просто... скажем так..."
2600015-56 = "...кто-то должен был."
2600015-57 = "Если честно, я просто не могла оставить всё как есть."
2600015-58 = "[s11] «Кто-то должен был?»\n[s12] «Ты не могла их бросить...?»"
2600015-61 = "...Именно."
2600015-62 = "Префектурная команда и Клуб неотложной помощи могут хорошо ладить, но это разные организации."
2600015-63 = "Президенты обеих организаций тоже в хороших отношениях, но одна другой не подчиняется."
2600015-64 = "При этом работа Префектурной команды часто заканчивается пострадавшими."
2600015-65 = "Конечно, когда такое происходит, Клуб неотложной помощи всегда выезжает, но отреагировать мгновенно получается не всегда."
2600015-66 = "Когда я была в Клубе неотложной помощи, я видела это собственными глазами."
2600015-67 = "И подумала: «В Префектурной команде должен быть кто-то, кто сможет сразу оказать медицинскую помощь»."
2600015-68 = "Конечно, президенты обеих организаций не отличаются гибкостью, поэтому любые разговоры о реорганизации быстро застряли в комитетах."
2600015-69 = "Уверена, у всех были свои причины. Обе президентки знают ситуацию."
2600015-70 = "Но единственным оставшимся вариантом... было самой стать этим «кем-то»."
2600015-71 = "Так я и оказалась там, где сейчас. Это отвечает на ваш вопрос?"
2600015-72 = "Честно говоря, не хочу себя нахваливать, но устойчивость Префектурной команды на передовой после моего перевода выросла..."
2600015-73 = "...по крайней мере, так сказала глава Префектурной команды. Уверена, это правда. Она всегда старается выражаться объективно."
2600015-74 = ""
2600015-77 = "[ns13] «Ты и правда удивительная, Чинацу.»\n[ns14] «Это одна из причин, почему все тебя любят.»"
2600015-80 = "К-клянусь, я рассказывала это не для того, чтобы напроситься на комплименты."
2600015-81 = "В любом случае именно поэтому я иногда захожу в Клуб неотложной помощи."
2600015-82 = "И как раз туда я сейчас и направляюсь."
2600015-83 = "...Эм..."
2600015-84 = "Так... а чем сегодня занимаетесь вы, Сенсей? Судя по прежнему сообщению, сегодня у вас было..."
2600015-85 = "...Да?"
2600015-86 = "У вас тоже дела в Клубе неотложной помощи?"
2600015-87 = "...Внезапно?"
2600015-88 = "Что-то... ТОЛЬКО ЧТО появилось?"
2600015-89 = "[s] «Ну, может быть»."
2600015-90 = ""
2600015-93 = "[ns] «У меня тоже есть кое-что, что я не могу оставить без внимания»."
2600015-94 = ""
2600015-96 = ""
2600015-97 = "Ха. Вы безнадёжны, Сенсей."
2600015-98 = "Что тут скажешь?"
2600015-99 = "Ну... ладно. Вместе работа спорится, верно? Уверена, Клуб неотложной помощи будет рад."
2600015-100 = "И снова мне кажется, что я у вас в долгу."
2600015-101 = "Так что, раз уж так..."
2600015-102 = "...раз на этот раз вы идёте к нам, то..."
2600015-103 = "...в свой следующий выходной... может, я..."
2600015-104 = "...приду в «Шале» и помогу вам?"
2600015-106 = "После этого мы с Чинацу зашли в Клуб неотложной помощи и помогли с разными делами."
2600015-107 = "Все там приветствовали Чинацу как хорошую подругу."
