[translation]
901010600320-6 = "Здравствуйте!"
901010600320-7 = "Привет."
901010600320-8 = "Погоди, разве ты не та девушка-курьер, которая в последнее время всё время здесь мелькает?"
901010600320-9 = "Кажется, возникло недоразумение. Мы торгуем только живой продукцией, доставкой не занимаемся."
901010600320-10 = "О, ха-ха, не переживайте! Я не по поводу доставки."
901010600320-11 = "Я думала об ужине, а рыба у вас выглядит отлично. Есть скумбрия?"
901010600320-12 = "Скумбрии полно. Что собираешься с ней делать?"
901010600320-13 = "Наверное, пожарить или приготовить на гриле."
901010600320-14 = "Жареная скумбрия всегда хороша, но в это время года она особенно жирная. Из неё выходит отличное сашими."
901010600320-15 = "Если хочешь, могу прямо сейчас нарезать свежего сашими."
901010600320-16 = "Хм, надо подумать. Холодное сашими из скумбрии звучит вкусно, но ещё хочется попробовать её пожарить..."
901010600320-17 = "...Можно половину так, половину так? Не слишком странно?"
901010600320-18 = "Отличная идея!"
901010600320-19 = "Половину нарезать для сашими, вторую — для жарки, верно? Секунду."
901010600320-20 = "Спасибо!"
901010600320-21 = "Фуфу. Мне здесь нравится. Все, кого я встретила в порту, такие добрые."
901010600320-22 = "О, кроме тех, кто проверяет людей у ворот. Они были немного холодными."
901010600320-23 = "Те, у ворот... Ты про семью Карпаччо?"
901010600320-24 = "Не хочу наговорить лишнего..."
901010600320-25 = "Но хорошей девочке вроде тебя лучше держаться подальше от семьи Карпаччо. Они... Скажем так, я слышал о них неприятные истории."
901010600320-27 = "Под историями вы имеете в виду, что они дают займы под огромный процент?"
901010600320-28 = "Нет, это не история, а обычный факт. Вот чего тебе действительно следует опасаться..."
901010600320-29 = ""
901010600320-31 = ""
901010600320-33 = ""
901010600320-34 = "...того, что происходит, когда им не платят."
901010600320-35 = "Говорят, если не вернуть семье Карпаччо деньги вовремя, тебя ждёт ОЧЕНЬ плохой конец."
901010600320-36 = "Плохой... конец?"
901010600320-37 = "Именно. Семья Карпаччо отвечает за журналы входа и выхода из порта, понимаешь?"
901010600320-38 = "Поэтому ходят слухи, что они тайком проводят должников в порт, когда вокруг никого нет, и не оставляют записи. А потом тихо избавляются от своей... проблемы."
901010600320-39 = "Открытое море, куча ящиков и бочек... Лучшего места, чтобы избавиться от человека-другого, не придумаешь."
901010600320-40 = "Есть ещё слух, будто они скармливают людей крабам в бочке... Но это уже полный бред."
901010600320-41 = "Как страшно."
901010600320-42 = "Но разве не выгоднее выбивать долг угрозами и запугиванием? Вместо того чтобы... ну, вы понимаете?"
901010600320-43 = "Я только предполагаю, но угрозами и запугиванием далеко не всегда можно добиться своего."
901010600320-44 = "Большинство людей с огромными долгами теряют желание работать. Даже основную сумму вернуть будет тяжело."
901010600320-45 = "А вот если похитить их и продать куда-нибудь, например в ЧВК, в качестве наёмников, тогда..."
901010600320-46 = ""
901010600320-48 = ""
901010600320-49 = "Кхм! Я просто хочу сказать, что мир бывает страшным. Ты тоже будь осторожна, девочка."
901010600320-50 = "Обычно я советов не раздаю, но ты выглядишь такой наивной... Просто запомни мои слова. Смотри по сторонам. Ты слишком быстро доверяешь людям."
901010600320-51 = "Да, буду осторожна."
901010600320-52 = ""
901010600320-54 = ""
901010600320-55 = "Вот твоя скумбрия. Один пакет для сашими, второй для жарки. Приятного ужина!"
901010600320-56 = "Спасибо! Хорошего дня!"
