#[!][Data: "20/09"]
[translation]
901010600320-6 = "Olá, muito bom dia!"
901010600320-7 = "Pois não, seja bem-vi—"
901010600320-8 = "Ué? Você de novo por aqui, garota?"
901010600320-9 = "Olha, se for sobre entregas, houve um mal-entendido: nós só vendemos peixe fresco in natura no balcão, não trabalhamos com delivery."
901010600320-10 = "Ahaha, não se preocupe! Não vim a trabalho de entrega desta vez."
901010600320-11 = "Vim como cliente em busca do peixe pro nosso jantar... Vocês têm carapau fresco?"
901010600320-12 = "Tem carapau saindo pelo ladrão! Como você pretende preparar?"
901010600320-13 = "Tava pensando em fazer grelhado ou quem sabe frito e bem empanado."
901010600320-14 = "Nesta época do ano o carapau tá bem gordinho, se comer cru como sashimi fica um manjar dos deuses!"
901010600320-15 = "Se você quiser, eu mesmo já limpo e fatio em lâminas de sashimi pra viagem. Que tal?"
901010600320-16 = "Ai, que dúvida cruel... Sashimi fresco é irresistível... mas aquele filé frito crocante também dá água na boca..."
901010600320-17 = "...Daria para fazer metade sashimi e a outra metade pra fritura?"
901010600320-18 = "Mas com certeza!"
901010600320-19 = "Mando metade fatiado fininho e a outra metade em filés limpos pra frigideira. Aguenta aí um instante!"
901010600320-20 = "Muito obrigada!"
901010600320-21 = "Hihi, o pessoal deste porto é tão acolhedor e atencioso."
901010600320-22 = "...Embora os guardas de terno do portão principal não tenham sido tão simpáticos assim comigo..."
901010600320-23 = "Aqueles brutamontes do portão...? Você tá falando da Família Carpaccio?"
901010600320-24 = "Hum... não gosto nem de tocar no nome desses sujeitos, mas..."
901010600320-25 = "Um conselho de amigo: mantenha distância máxima da Família Carpaccio. #nOnde aquela corja pisa, só brota desgraça e boato podre."
901010600320-27 = "Boato podre...? Está falando dos empréstimos com juros abusivos?"
901010600320-28 = "Não, pior do que isso..."
901010600320-29 = ""
901010600320-31 = ""
901010600320-33 = ""
901010600320-34 = "O problema é quando a pessoa não consegue pagar."
901010600320-35 = "Quem pega dinheiro com a Família Carpaccio e dá calote sofre o pão que o diabo amassou. #nNão que caloteiro mereça palma, mas o método deles passa de qualquer limite."
901010600320-36 = "Passa dos limites... como assim?"
901010600320-37 = "Veja bem. O controle de entrada e saída deste porto tá na mão da Família Carpaccio, certo?"
901010600320-38 = "Dizem que na calada da noite, quando não passa uma alma viva, eles arrastam os devedores pra cá... #ne dão um sumiço definitivo neles."
901010600320-39 = "O porto é colado no oceano aberto, né? #nE o que não falta por aqui são caixotes e tambores de óleo... O cenário perfeito pra desovar um ou dois sem deixar rastro."
901010600320-40 = "Até corre a lenda urbana de que jogam os coitados dentro de tambores lotados de caranguejos assassinos pra servirem de banquete... mas isso com certeza é exagero de pescador."
901010600320-41 = "Que história mais assustadora..."
901010600320-42 = "Mas financeiramente falando, não seria mais vantajoso forçar a pessoa a pagar do que dar fim nela?"
901010600320-43 = "Olha, é só palpite meu, mas... cobrar de quem não tem nem onde cair morto tem limite."
901010600320-44 = "Quem se atola numa dívida daquelas já perdeu o patrimônio todo e não tem como pagar nem os juros da semana."
901010600320-45 = "Por isso dizem que eles vendem essa gente como mão de obra escrava pra empresas mercenárias de PMC pra reaver o prejuízo—"
901010600320-46 = ""
901010600320-48 = ""
901010600320-49 = "*Cof, cof*! Enfim! O cais anda perigoso demais ultimamente, então tome muito cuidado por onde anda, mocinha."
901010600320-50 = "Você tem cara de ser uma menina ingênua e de bom coração... Fique atenta pra não cair na conversa de gente ruim e ser levada pra onde não deve."
901010600320-51 = "Pode deixar, vou redobrar a atenção!"
901010600320-52 = ""
901010600320-54 = ""
901010600320-55 = "Prontinho, fresquinho na bandeja! Metade sashimi e metade limpo pra frigideira!"
901010600320-56 = "Muito obrigada pelo atendimento!"
