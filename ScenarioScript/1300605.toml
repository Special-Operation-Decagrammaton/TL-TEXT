[translation]
1300605-1 = "Хобби бесёнка"
1300605-2 = "(Я как обычно патрулировал улицу по делам Шале.)"
1300605-3 = ""
1300605-4 = "[ns] «Хм? Муцуки?»"
1300605-5 = ""
1300605-6 = ""
1300605-7 = ""
1300605-8 = "(Не успел я обратиться к ней, как Муцуки быстрым шагом исчезла из виду.)"
1300605-9 = "(Муцуки ушла туда...)"
1300605-10 = "[ns] «В сторону Чёрного рынка?»"
1300605-12 = "[ns] «...»"
1300605-14 = "[ns] «...Надо пойти за ней.»"
1300605-17 = ""
1300605-18 = "[ns] «Муцуки!»"
1300605-19 = "А? О, это всего лишь ты, Сенсей."
1300605-20 = "Странно видеть тебя в таком месте. У тебя дела на Чёрном рынке?"
1300605-21 = "[s1] «Это моя реплика.»\n[s2] «Что привело тебя сюда, Муцуки?»"
1300605-22 = "Хаха! Я здесь из-за того хобби, о котором рассказывала в MomoTalk."
1300605-23 = "Хаха! Я здесь из-за того хобби, о котором рассказывала в MomoTalk."
1300605-24 = "[s] «Хобби...?»"
1300605-25 = "М-м, проще показать, чем объяснять. Согласен, Сенсей?"
1300605-26 = ""
1300605-27 = ""
1300605-28 = "Ладно, Сенсей. Пошли!"
1300605-29 = "[s] «А? Н-Но...»"
1300605-31 = "[ns] «...Магазин Boom — все „бабахи“, какие только понадобятся?»"
1300605-33 = "[ns] «Так это твоё хобби...»"
1300605-34 = "Ага. Я коллекционирую взрывчатку."
1300605-35 = "[s] «В-Взрывчатку? Зачем тебе...»"
1300605-36 = "Кихихи! Очевидно же, потому что..."
1300605-37 = "[s] «Потому что что?»"
1300605-38 = "Потому что бомбы — лучшие инструменты для розыгрышей!"
1300605-39 = "[s] «Розыгрышей...?»"
1300605-40 = "Ага-ага! Вот смотри, например, эту. Это дымовая граната, да?"
1300605-41 = "Если выдернуть чеку и бросить её, примерно на минуту ослепнут все вокруг."
1300605-42 = "А это значит..."
1300605-43 = "[s] «Что значит?»"
1300605-44 = "Если бросить её где-нибудь на площади, целую минуту можно разыгрывать кого угодно, и никто ничего не заметит!"
1300605-45 = "[s] «...Ага.»"
1300605-46 = "Ахаха! Ещё есть светошумовая граната, примерно для тех же целей."
1300605-47 = "Если взорвать её после заката, все будут носиться как куры без головы! Так весело!"
1300605-48 = "[s] «Куры, значит...»"
1300605-49 = "О, ещё есть липкие бомбы. Классные, правда?"
1300605-50 = "Кроме них есть вот эта... и эта..."
1300605-51 = "[s] «Бомбы бывают самых разных форм и размеров.»"
1300605-52 = "Ха, именно! И отличаются они не только начинкой, Сенсей."
1300605-53 = "Существуют тысячи видов бомб. Что бы тебе ни понадобилось — для этого найдётся бомба."
1300605-54 = "Теперь понимаешь, насколько удивителен и глубок мир взрывчатки?"
1300605-55 = "[s3] «Не скажу, что полностью понимаю...»\n[s4] «Но вижу, что ты очень увлечена своими хобби, Муцуки.»"
1300605-56 = "Хи-хи-хи, правда?"
1300605-57 = "Хи-хи-хи, правда?"
1300605-58 = "Интересно, смогу ли сегодня выбить скидку, раз ты со мной."
1300605-59 = "Эй, Сенсей. Как тебе эта? Бомба с блёстками!"
1300605-60 = "[s] «Что такое бомба с блёстками?»"
1300605-61 = "Правда хочешь узнать?"
1300605-62 = ""
1300605-63 = ""
1300605-64 = ""
1300605-65 = ""
1300605-67 = "(Мы с Муцуки отлично провели время за покупками.)"
1300605-68 = "(За покупками взрывчатки, если точнее...)"
