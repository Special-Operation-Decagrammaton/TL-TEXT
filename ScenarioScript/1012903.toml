[translation]
1012903-1 = "Верить настолько слепо"
1012903-3 = "Это был ещё один мирный день..."
1012903-4 = "...по крайней мере, я так думал, сидя на скамейке в парке."
1012903-5 = ""
1012903-10 = "Сенсей!"
1012903-11 = "Я на некоторое время займу пространство за скамейкой. Пожалуйста, не обращайте внимания!"
1012903-12 = "[s] «Сузуми?! Что происходит?»"
1012903-13 = ""
1012903-15 = ""
1012903-18 = "Смотрите прямо перед собой. Ведите себя естественно. Не смотрите на меня."
1012903-19 = "Меня преследуют."
1012903-20 = "[s] Следовать указаниям Сузуми."
1012903-24 = ""
1012903-25 = "Куда она делась? Она ведь пошла сюда, да?"
1012903-26 = "Поймать её и заставить заплатить! Это уже личное!"
1012903-27 = "Окружить парк! Не дать ей выйти!"
1012903-28 = "Понял! Перекрываем все выходы!"
1012903-29 = "Если увидите бледную беловолосую чудилу в форме Тринити — валите её!"
1012903-30 = ""
1012903-32 = ""
1012903-34 = "[ns1] «Твои поклонники?»\n[ns2] «Твои друзья?»"
1012903-37 = "Совсем наоборот."
1012903-38 = ""
1012903-40 = ""
1012903-41 = "Пока они отступили к окраинам парка."
1012903-42 = "Понимаете, я направлялась в ателье, о котором вы говорили, но на меня внезапно напали."
1012903-43 = "Полагаю, это была заранее подготовленная ловушка. Я попыталась защищаться, но закончились боеприпасы."
1012903-44 = "Благодаря вам я наконец могу перевести дух. Хотя что делать дальше — непонятно."
1012903-45 = "[s] «Сколько там бандитов?»"
1012903-46 = "Точно посчитать не удалось."
1012903-47 = "Я обезвредила примерно 90 человек, но боюсь, это была даже не половина их настоящего числа."
1012903-48 = "[s3] «90?!»\n[s4] «То есть ты сражаешься примерно с 200 людьми?»"
1012903-51 = "Это... вполне может быть правдой."
1012903-52 = "Похоже, сбежать будет... довольно сложно."
1012903-53 = "*вздыхает*"
1012903-54 = "Спасибо, Сенсей. Кажется, я немного восстановилась. Я нашла слабое место и сейчас попытаюсь прорваться на свободу."
1012903-55 = "Пожалуйста, до этого спокойно покиньте парк. Я не хочу, чтобы вы попали под перекрёстный огонь."
1012903-56 = ""
1012903-58 = ""
1012903-59 = ""
1012903-60 = "Ай... Ах..."
1012903-61 = "[s] «О, ты ранена?»"
1012903-62 = "Кажется, я... слегка подвернула лодыжку."
1012903-63 = "Не думаю, что смогу бежать. Но, возможно, получится отползти к..."
1012903-64 = "[s5] «Не перенапрягайся!»\n[s6] «Давай найдём другой способ!»"
1012903-67 = "Они... уже знают, как я выгляжу. Они назвали меня «бледной»! Думаю, столкновения не избежать, потому что незаметно пройти не получится."
1012903-68 = "Всё в порядке. Я что-нибудь придумаю, а вы должны..."
1012903-69 = "[s7] «У меня есть хорошая идея...»\n[s8] «Пожалуйста, выслушай меня.»"
1012903-72 = "Я не могу подвергать вас опасности, Сенсей!"
1012903-73 = "[s] «Но я ТВОЙ Сенсей, Сузуми.»"
1012903-74 = ""
1012903-76 = ""
1012903-77 = "Х-Хорошо. Тогда что мне..."
1012903-80 = "С-Сенсей..."
1012903-82 = ""
1012903-83 = "То есть... этот костюм и был вашей «хорошей идеей»?"
1012903-84 = "[s] «Он уже был у тебя! Ты же шла к портному!»"
1012903-85 = "Это тактический недостаток. Нас меньше, а это платье ограничивает мою подвижность."
1012903-86 = "Э-Это шутка?!"
1012903-87 = "[s9] «Но ты слышала их, да?»\n[s10] «Они ищут девушку из Тринити.»"
1012903-90 = "!"
1012903-91 = "Вы... убедительны. Если подумать..."
1012903-92 = "Скорее всего, они ищут девушку в серой форме Тринити."
1012903-93 = "И не думаю, что у них есть моя фотография."
1012903-94 = "Поэтому, если позволите мне такую дерзость... возможно, я смогу пройти мимо в этой маскировке?"
1012903-95 = "Но всё равно это слишком стыдно...!"
1012903-96 = "[s11] «Девочки-волшебницы — воины справедливости.»\n[s12] «Разве этот костюм не идеально подходит к ситуации?»"
1012903-99 = "Даже если вы так говорите... *вздыхает* Ладно."
1012903-100 = "Но ради вашей безопасности держитесь немного подальше, Сенсей."
1012903-101 = "[s] «Прости. У меня тоже есть роль.»"
1012903-102 = ""
1012903-104 = ""
1012903-108 = ""
1012903-109 = "Вы её не видели, да? Ту девчонку из Тринити?"
1012903-110 = "Пока нет. Хотя других тут прошло полно..."
1012903-111 = "Пусть лучше начинает молиться! Я её разорву!"
1012903-112 = ""
1012903-116 = ""
1012903-117 = "Это ещё кто?"
1012903-118 = ""
1012903-120 = ""
1012903-121 = "Т-Thermite White прибыла!"
1012903-122 = ""
1012903-125 = ""
1012903-126 = "?"
1012903-127 = "Разве рядом с ней не Сенсей из Шале?"
1012903-128 = "Они снимают видео на телефон?"
1012903-130 = "Стрелок готов, огонь! Пиу! ☆"
1012903-131 = "[s] «Немного кокетливее! Давай, работай!»"
1012903-132 = ""
1012903-134 = ""
1012903-135 = "П-Прямо в глаза... Светошумовая граната! ☆"
1012903-137 = "Так вот чем увлекается Сенсей из Шале..."
1012903-138 = "Они постепенно приближаются. Просто пропустите их."
1012903-139 = "Наверное, это стандартная работа представителя учеников."
1012903-140 = "Чёрт... Тяжело этим ученикам живётся..."
1012903-141 = "С-Спасибо, что пропустили нас, мои добрые феи! Да пребудет с вами благословение!"
1012903-142 = "А... Ага..."
1012903-143 = "Давайте просто свалим. Не смотри учителю в глаза..."
1012903-144 = ""
1012903-146 = ""
1012903-148 = ""
1012903-149 = "Это реально сработало."
1012903-150 = "Спасибо за вашу роль, Сенсей. Очевидно, мне был нужен режиссёр."
1012903-151 = "[s13] «Исправим на монтаже.»\n[s14] «Продолжай отыгрывать реплики, Thermite White!»"
1012903-152 = ""
1012903-153 = ""
1012903-155 = ""
1012903-157 = "Погодите, вы правда снимаете?!"
1012903-159 = "Я выбрался из парка вместе с Сузуми."
1012903-160 = "Остальные бандиты ничего не заподозрили. Мы прошли без проблем."
