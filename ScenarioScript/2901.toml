[translation]
2901-1 = "Девушки собираются вместе 1"
2901-2 = ""
2901-7 = "Класс в старом школьном здании Хяккияко 38"
2901-8 = "Ура! Мы наконец закончили съёмку!"
2901-9 = "П-прекрасная работа, п-президент... Хотите воды?"
2901-10 = "Спасибо, Цукуё."
2901-11 = "Я ещё п-принесла полотенце вытереть вам л-лоб... и немного д-домашнего лимона с мёдом!"
2901-12 = "Ого! Правда?"
2901-13 = "Хи-хи! Не откажусь!"
2901-14 = "Мы отличная команда, правда? Как будто нам суждено быть вместе."
2901-15 = "И ты оказалась куда подготовленнее, чем я ожидала, Цукуё!"
2901-17 = "О, это е-ерунда... Для этого я з-здесь..."
2901-18 = "Ерунда! Ты сегодня очень помогла на съёмке!"
2901-19 = "Если бы не твоё мастерство с этим отражателем света..."
2901-20 = "...мы бы никогда не сняли ту невероятную сцену!"
2901-21 = "Как тени обвились вокруг пленного ниндзя... Ах!"
2901-22 = "Э-Это правда... Но всё же... Хотелось бы быть п-полезнее во время съёмок..."
2901-23 = "Максимум, на что я м-могу рассчитывать, — быть помощницей на съёмках..."
2901-24 = "И даже с этим я плохо с-справляюсь... Как сегодня утром..."
2901-25 = "А, ты об этом..."
2901-27 = "Цукуё! Да, держи отражатель прямо там! Идеально!"
2901-28 = "Х-Хорошо! Держать отражатель. Просто..."
2901-29 = ""
2901-32 = "А? Ой, эм..."
2901-33 = ""
2901-36 = "Здравствуйте. П-Пожалуйста, не стойте так близко."
2901-37 = "Я занимаюсь кое-чем о-очень важным."
2901-38 = ""
2901-43 = "Когда вы крутитесь у меня под н-ногами, мне трудно делать р-работу."
2901-44 = "Пожалуйста! Я не хочу попасть в н-неприятности!"
2901-46 = "Ого! Посмотрите, сколько там кошек!"
2901-47 = "Будто у них семейная встреча!"
2901-48 = "Так круто! Я сфотографирую!"
2901-49 = ""
2901-55 = "А! П-Пожалуйста, не фотографируйте!"
2901-56 = "М-Мы прямо сейчас снимаем!"
2901-58 = "Ха-ха! Вот это был бардак, да?"
2901-59 = "*шмыг* Ещё... ещё 30 минут прошло... прежде чем мы смогли снова начать съёмку..."
2901-60 = "М-Мне так жаль, п-президент!"
2901-61 = "Это всё м-моя вина!"
2901-62 = "Ты не виновата, Цукуё."
2901-63 = "Наверное, они увидели столько солнечного света и решили, что это отличное место для сна."
2901-64 = "*шмыг* Тогда... в с-следующий раз я принесу лакомства, чтобы их отвлечь."
2901-65 = "В следующий раз?! Сомневаюсь, что такое повторится. Не надо готовиться настолько тщательно!"
2901-66 = ""
2901-68 = ""
2901-69 = "Мы прекрасно справимся и без кошачьих лакомств."
2901-70 = "Что скажете, госпожа Цукуё?"
2901-72 = "Ч-Что? Г-Госпожа?"
2901-73 = "Ага! Разве это не правильное обращение к ниндзя?"
2901-74 = "Ну... Д-Да, наверное!"
2901-75 = "Забудем про утро и сосредоточимся на следующем!"
2901-76 = "Пора монтировать видео, которое мы сегодня сняли!"
2901-77 = "П-Поняла!"
2901-78 = ""
2901-84 = "Примерно час спустя..."
2901-86 = "Хм..."
2901-87 = "Хм..."
2901-88 = "Агх!"
2901-89 = "П-Президент! Что случилось?"
2901-90 = "Не хочется это говорить, но..."
2901-91 = "...этого недостаточно."
2901-93 = "Н-Недостаточно?"
2901-94 = "Даже близко нет. Я представляла идеальную композицию, операторскую работу, монтаж..."
2901-95 = "С моим глазомером и твоими навыками я думала..."
2901-96 = "Ну, я думала, будет больше эффекта!"
2901-97 = "Больше блеска! Всё должно было быть таким крутым!"
2901-98 = "А это... Тут нет того шика, которого я хотела. Я не могу это загрузить..."
2901-99 = "О нет..."
2901-100 = "Ладно, ничего страшного. Даже с лучшими такое случается."
2901-101 = "М-Мне так жаль! Надеюсь, это не из-за м-меня!"
2901-102 = "А?"
2901-103 = "Я была н-недостаточно хороша... Вы так старались, а я только м-мешалась!"
2901-104 = "Я у-ужасная н-ниндзя! *всхлип*"
2901-106 = "Это не из-за тебя, Цукуё!"
2901-107 = "Ты всё ещё учишься."
2901-108 = "Нельзя винить себя за то, что ты не знаешь всего."
2901-109 = "*всхлип* П-Правда...?"
2901-110 = "Правда. Да и вообще в последнее время мне не нравится много наших видео."
2901-111 = "Кажется, у нас просто заканчиваются свежие идеи..."
2901-112 = ""
2901-114 = ""
2901-115 = "Возможно, придётся подумать о..."
2901-116 = "Что?"
2901-117 = "Новом члене клуба."
2901-118 = ""
2901-120 = ""
2901-121 = "Н-Новом члене клуба!"
2901-123 = "Я знаю, Клуб исследования ниндзюцу пока ещё не официальный."
2901-124 = "Поэтому мы не получаем клубного финансирования, как остальные."
2901-125 = "К тому же нас сослали в угол Хяккияко... И каждый раз, когда мы заходим в старое школьное здание, мы по сути незаконно проникаем внутрь..."
2901-126 = "Эм..."
2901-127 = "Но нельзя позволить этому нас остановить!"
2901-128 = "Я хочу, чтобы больше людей узнали о ниндзя! Хочу, чтобы весь Кивотос увидел, насколько ниндзя крутые, модные и потрясающие!"
2901-129 = "Уже несколько месяцев прошло с тех пор, как мы запустили канал «Мичиручи, a Girl’s Ниндзя Scroll» именно ради этого..."
2901-130 = "Но подписчиков у нас не стало больше, чем было в начале."
2901-131 = "Хуже того, с нашими видео никто не взаимодействует. Даже негативных комментариев нет!"
2901-132 = "Единственный недавний комментарий был вот этот."
2901-133 = "Вот, прямо здесь."
2901-134 = "O.C. написала: «Это так весело! Просто лучшее!»"
2901-135 = "Но этот комментарий написала ты, Цукуё!"
2901-136 = "П-Потому что мне правда нравятся ваши в-видео."
2901-137 = "Я не в-всегда их понимаю, но..."
2901-138 = "Простите."
2901-139 = "Нет-нет! Я рада, что тебе нравится. Но комментировать собственные видео — это как-то..."
2901-140 = "Ух. Нам просто нужен новый контент, что-нибудь свежее..."
2901-141 = "А новый член клуба обязательно всё освежит!"
2901-142 = "Хм... Новый член клуба..."
2901-143 = "Надеюсь, это будет н-настоящая ниндзя! Хи-хи!"
2901-144 = "Сомневаюсь. По-моему, ниндзя вообще больше не существуют."
2901-146 = "О, правда? Я н-не знала."
2901-147 = "Ага. Я думала, это всем известно."
2901-148 = "Как бы то ни было, когда-то они существовали."
2901-149 = "А значит, мы всё ещё можем учиться у их философии!"
2901-150 = "Когда мы полностью примем образ мышления и идеологию ниндзя, сможем считать себя настоящими товарищами-ниндзя!"
2901-151 = ""
2901-155 = "Единственная проблема... товарищей-ниндзя трудно найти."
2901-156 = "Нам нужна та, кто не считает ниндзя глупостью, согласна с нами и хочет вступить в Клуб исследования ниндзюцу."
2901-157 = "Кто-то, кто идеально с нами совпадает! И она должна быть милой, потому что... Ну, кто лучше представит ниндзя?"
2901-158 = "Интересно, есть ли вообще такая?"
2901-159 = ""
2901-162 = ""
2901-163 = ""
2901-164 = "Простите... У меня нет т-таких друзей..."
2901-165 = "И я не м-милая..."
2901-166 = "Что? Да ты очень милая, Цукуё!"
2901-167 = "О, с-спасибо. Но ведь мы неофициальный клуб..."
2901-168 = "Думаете, кто-нибудь вообще з-захочет вступить?"
2901-169 = "Сразу к делу, да, Цукуё?"
2901-170 = "П-Простите!"
2901-171 = "Нет, ты права. Это наверняка будет проблемой."
2901-172 = ""
2901-174 = ""
2901-175 = "Но сидеть и унывать из-за этого не поможет."
2901-176 = "Если будем стараться, у нас всё получится! В конце концов, мы товарищи-ниндзя, рассказывающие миру о пути ниндзя!"
2901-177 = "И мы уже давно не просто фанатки. Можно прямо сейчас называть себя ниндзя!"
2901-178 = ""
2901-182 = "Однажды все узнают, кто мы такие — Клуб исследования ниндзюцу!"
2901-183 = "Мы никогда не сдадимся! Ни при каких обстоятельствах!"
2901-184 = "Давай! Найдём нового члена клуба и наберём больше подписчиков! Скоро станем официальным клубом!"
2901-185 = "Помни философию из Ниндзя Ninpero."
2901-186 = "Ниндзя никогда не сдаётся, какие бы трудности ни встретились!"
2901-188 = "Д-Да!"
2901-189 = "Ладно. Я подумаю, что мы будем снимать завтра. А пока ты можешь—"
2901-190 = ""
2901-193 = "А?!"
2901-194 = "Что?"
2901-195 = "У нас г-гость?"
2901-196 = "Гость здесь? Это вообще возможно?!"
2901-197 = "Хм..."
2901-198 = "Может, это Хяккарёран! Или енот из Клуба Инь-Ян?"
2901-199 = "Наверняка они узнали, что мы сюда незаконно пробираемся, и пришли нас выгнать!"
2901-200 = "Выгнать нас... А?!"
2901-201 = "Я всегда знала, что этот день настанет."
2901-202 = "Президент! Ч-Что нам делать?!"
2901-203 = "Спокойно, Цукуё! Помни поговорку..."
2901-204 = "Даже перед тигром, эм... сохраняй спокойствие, эм... что-то там, что-то там... и добьёшься успеха!"
2901-205 = "Т-Тигром? Звучит страшно!"
2901-206 = ""
2901-211 = "Извините!"
2901-212 = ""
2901-215 = ""
2901-217 = ""
2901-218 = "Президент?"
2901-219 = "Заткнись! Мы никуда не уйдём! Да здравствует Клуб исследования ниндзюцу!"
2901-220 = ""
2901-222 = ""
2901-223 = "...?"
2901-224 = "Стой... Ты не похожа ни на кого из Клуба Инь-Ян или Хяккарёран."
2901-225 = "Кто т-ты?"
2901-226 = "О! Надо представиться. Меня зовут Изуна!"
2901-227 = "Я хочу вступить в Клуб исследования ниндзюцу!"
2901-228 = "..."
2901-229 = ""
2901-231 = ""
2901-232 = "...А?"
2901-233 = ""
