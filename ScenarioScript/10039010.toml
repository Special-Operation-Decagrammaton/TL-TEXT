[translation]
10039010-1 = "Эпизод 1;Шанс изменить свой образ"
10039010-2 = "— 48 часов назад —"
10039010-7 = "...Фух! Это последняя!"
10039010-8 = ""
10039010-10 = ""
10039010-11 = "Получилось намного быстрее, чем я ожидала. Спасибо за всю вашу работу, сестра Мари!"
10039010-12 = "Да ничего. Я только помогла прибраться с мелочами. Всю тяжёлую работу сделали вы."
10039010-13 = "Всё прошло так быстро именно благодаря вам. Это мне следует благодарить."
10039010-14 = "Н-Нет... Вовсе нет. Я просто..."
10039010-15 = ""
10039010-17 = ""
10039010-18 = ""
10039010-19 = "Хм? Сообщение...?"
10039010-20 = "...О, оно не мне."
10039010-21 = "О? Д-Да, это мне. Лучше отвечу..."
10039010-22 = ""
10039010-24 = ""
10039010-25 = "......?"
10039010-26 = "...Сестра Мари?"
10039010-27 = "Ой, простите. Просто я не ожидала такого сообщения..."
10039010-28 = "Сакурако..."
10039010-29 = "Сакурако? Ей ещё что-то нужно?"
10039010-30 = "Нет, не думаю, что она это имеет в виду. Хм, по тексту трудно понять..."
10039010-32 = "Она пишет «Экстренный запрос о поддержке,» но это может означать что угодно..."
10039010-36 = "Извините..."
10039010-37 = "Сакурако позвала меня. Она здесь...?"
10039010-38 = "......?"
10039010-40 = ""
10039010-42 = ""
10039010-45 = "*ахает*"
10039010-46 = "С-Сакурако?! Минэ?! Что происходит...?!"
10039010-48 = "...Хм?"
10039010-49 = "А, Мари, как раз вовремя. Я знаю, ты занята, поэтому спасибо, что нашла время."
10039010-50 = "Если бы тебя здесь не было, всё могло бы закончиться плохо."
10039010-51 = "Нам пришлось бы «урегулировать» всё без нормального решения и так ничего толком не решить."
10039010-52 = "«Урегулировать»? «Решение»? О-О чём вообще речь...?!"
10039010-54 = "......?"
10039010-55 = "...Хм?"
10039010-56 = "«Решение»? Между нами что, какой-то конфликт, о котором я не знала?"
10039010-57 = "......?"
10039010-58 = "Разве не это вы только что подразумевали?"
10039010-59 = "Разве вы не сказали: «Вердикт Мари должен уладить конфликт между нами»?"
10039010-60 = "...?"
10039010-61 = "Я вовсе не хотела намекать на конфликт. Неужели это действительно так прозвучало?"
10039010-62 = "Ну, мне просто хотелось узнать её мнение."
10039010-63 = ""
10039010-65 = "А. Ну тогда..."
10039010-66 = "П-Подождите..."
10039010-67 = "Вы двое спорите из-за меня? Я что-то сделала не так...?!"
10039010-68 = "О нет, вовсе нет."
10039010-69 = "Мы всего лишь обсуждали, насколько сильно другие Сёстры тебе доверяют."
10039010-71 = "Да, прошу простить... расплывчатость нашего разговора, сестра Мари. Должно быть, это ужасно сбивает с толку."
10039010-72 = "Позволь мне объяснить..."
10039010-73 = "Нет, погодите."
10039010-74 = "Позвольте мне."
10039010-75 = "Не хочу усугублять недоразумение, но как человек, давно наблюдающий за вами, боюсь, ваше объяснение лишь запутает её ещё сильнее."
10039010-76 = "...Хм?"
10039010-77 = "«Запутает ещё сильнее»?"
10039010-78 = "Почему ты так решила?"
10039010-79 = "..."
10039010-80 = "Думаю, наш разговор до этого момента — достаточное доказательство."
10039010-81 = "...Уф. Такое сильное дежавю..."
10039010-82 = "Хорошо. Тогда пока поступим, как ты предлагаешь."
10039010-84 = "Как скажете, Сакурако..."
10039010-85 = "Итак. Мари, прошу прощения, что отрываю тебя от дел, но позволь объяснить ситуацию."
10039010-87 = "Как ты знаешь, Карнавал Тринити уже совсем близко."
10039010-88 = "Как всегда, мероприятий будет много, но нас с твоей сестрой интересует так называемое «идол-мероприятие.»"
10039010-89 = "Оно открыто для клубов из разных школ, не только Тринити."
10039010-90 = "Некоторые из них имеют определённый... образ, определённую репутацию среди других студентов. Но сцена этого мероприятия даёт редкую возможность:"
10039010-91 = "Шанс изменить этот образ."
10039010-93 = "Изменить то, как нас воспринимает весь мир."
10039010-94 = "Иными словами, и Рыцари скорой помощи, и Сестринство получили уникальный шанс избавиться от общественных заблуждений о нас."
10039010-95 = "З-Заблуждений? Другие студенты нас не любят?"
10039010-97 = "К сожалению, Мари... ну, они часто понимают нас неправильно."
10039010-98 = "Возможно, ты не знаешь, но сама природа наших клубов — плодородная почва для слухов и теорий заговора."
10039010-99 = "Некоторые даже говорят, будто мы, Сёстры, шпионим за другими или похищаем их по ночам."
10039010-100 = "Или что мы, рыцари, сами устраиваем бедствия, а потом изображаем спасение, лишь бы получить повод применить силу."
10039010-101 = "Какие мерзкие разговоры. Мы всегда стремились лишь помогать и утешать."
10039010-102 = "Но как вообще можно такое говорить?!"
10039010-103 = "Отличный вопрос. И правда хочется знать, откуда взялись эти слухи."
10039010-104 = "Как бы там ни было, они стали проблемой для всех нас, и мы твёрдо намерены её решить."
10039010-105 = "Даже если для этого придётся... с головой броситься на неизведанную территорию."
10039010-106 = "«Неизведанную территорию»?"
10039010-107 = "Мари..."
10039010-108 = "Мы с капитаном Минэ..."
10039010-109 = ""
10039010-111 = ""
10039010-112 = "...собираемся стать поп-идолами."
10039010-113 = "*ахает* Поп-идолами?!"
10039010-114 = "Разумеется, ни одна из нас особенно для этого не подходит. Все эти розовые сердечки, оленьи глазки и бодрая музыка. Это... не совсем в круге наших интересов."
10039010-115 = "Ну..."
10039010-116 = "Если говорить за себя, я не то чтобы НЕНАВИЖУ такие вещи."
10039010-117 = "...И всё может закончиться провалом и нелепым унижением. Мы готовы принять этот риск."
10039010-118 = "П-Подождите минутку!"
10039010-119 = "«Нелепым унижением»?! Насколько это вообще вероятно?"
10039010-120 = "Кто знает? Но если такая нелепость поможет разрушить стены между нами и другими студентами..."
10039010-121 = "Эм..."
10039010-122 = "...тогда мы примем это с открытыми объятиями и открытыми сердцами."
10039010-124 = "Ох, Сакурако..."
10039010-125 = ""
10039010-127 = ""
10039010-128 = "Понимаю. Если вы обе действительно этого хотите, как я могу не помочь?"
10039010-129 = "Скажите, чем могу помочь, — и я сделаю всё, что в моих силах."
10039010-130 = "Мари..."
10039010-131 = "...Мари..."
10039010-132 = "Итак, без лишних слов... позвольте представить..."
10039010-133 = ""
10039010-135 = ""
10039010-137 = "Ч-Что я вообще вижу?"
10039010-138 = "Мы с капитаном Минэ каждая подготовили собственное предложение по проекту. Именно поэтому мы попросили тебя прийти."
10039010-139 = "Мы разбили всё на три категории: «Костюмы,» «Танец» и «Песня»..."
10039010-140 = "...И дальше пока не продвинулись. У каждой свои идеи, и мы надеялись, что ты поможешь выбрать между ними."
10039010-141 = "И Сакурако, и я полностью готовы принять любой твой выбор."
10039010-142 = "П-Подождите, вы хотите, чтобы Я приняла настолько важное решение за вас обеих?"
10039010-143 = "Ты знаешь о стиле и культуре поп-идолов куда больше, чем любая из нас."
10039010-144 = "Я видела, как ты используешь свои житейские навыки, чтобы получать скидки в магазинах или работать в киоске быстрого питания."
10039010-145 = "Хм? Я... тоже такое умею..."
10039010-146 = "Кроме того, я знаю, что ты прекрасный советчик для других студентов и уважаешь их предпочтения и чувства..."
10039010-147 = "Ну, это звучит разумно..."
10039010-148 = "...а значит, ты понимаешь их вкусы и культуру — а нам обеим этого понимания очень не хватает."
10039010-149 = "Эй, подожди! Это совсем не так!"
10039010-150 = "Что ещё за «нам»? Всё, что ты сейчас сказала, относится только к тебе!"
10039010-151 = "Может, я и не специалист по поп-культуре, но у меня есть слабость к «розовым сердечкам и бодрой музыке,» как ты выражаешься!"
10039010-152 = "Ты написала песню для идолов со словами: «Мой клинок нас двоих защитит, эту священную клятву хранит.» Даже я понимаю, что это странно!"
10039010-153 = "Как я уже объяснила, я просто хотела добавить немного колорита. Я признала ошибку."
10039010-154 = "По крайней мере МОЙ текст не был взят из сборника гимнов."
10039010-155 = "Он был ВДОХНОВЛЁН сборником гимнов. И что в этом плохого? Все любят гимны!"
10039010-156 = "«Все»? Кто тебе это сказал?"
10039010-158 = "Я видела это в восторженных глазах нашего кафедрального хора!"
10039010-159 = "Так это ПОТОМУ ЧТО он кафедральный хор!"
10039010-160 = "Спроси Мари! Мари, тебе же нравятся гимны?"
10039010-161 = "Ну, конечно нравятся, но..."
10039010-162 = "Вот видишь?!"
10039010-164 = "...И что, по-твоему, я должна на это ответить?"
10039010-165 = ""
10039010-167 = ""
10039010-168 = ""
10039010-169 = "...Мари, теперь ты видишь нашу дилемму. Мы обе согласились довериться твоему здравому суждению."
10039010-170 = "Пусть я и не твоя сестра по ордену и не твой руководитель, но я верю в твою добродетель и чувство справедливости."
10039010-171 = "Если ты скажешь, что путь сестры Сакурако лучший, я последую ему."
10039010-172 = ""
10039010-175 = ""
10039010-176 = "Эм..."
10039010-177 = "Т-Так, дело в том, эм..."
10039010-178 = "Капитан Минэ говорит правду. В этом вопросе твоё слово будет для нас законом."
10039010-179 = "Ну... Эм... Э..."
10039010-181 = "Выбери, умоляем тебя! Перед нами два пути, и только ты можешь направить нас на верный."
10039010-182 = "Ну...! Эм...!!"
10039010-183 = ""
10039010-185 = ""
10039010-186 = "...Можно..."
10039010-188 = "Можно... вы дадите мне несколько дней...?"
10039010-190 = ""
10039010-191 = ""
10039010-192 = "...Вот примерно так я и оказалась здесь. Так что..."
10039010-193 = "[s1] «...Ты хорошо справилась, Мари.»\n[s2] «Я впечатлён тем, как достойно ты себя держишь.»"
10039010-196 = "Ахаха... Ну, говорят, я довольно изящна."
10039010-197 = "Я уважаю то, чего они обе пытаются добиться."
10039010-198 = "И делают они это из хороших побуждений."
10039010-199 = "Эти слухи, о которых они говорили, должно быть, действительно сильно на них давят."
10039010-200 = "Я понятия не имела. Просто делала свою работу и не переживала о том, что кто подумает."
10039010-201 = "Теперь у меня есть шанс помочь им обеим, а я не знаю, как сделать так, чтобы обе остались довольны."
10039010-202 = "Я просто..."
10039010-203 = "Я очень надеюсь, что не задену чувства ни одной из них."
10039010-204 = ""
10039010-207 = "[ns3] «Мари...»\n[ns4] «Ты так внимательно ко всему этому относишься.»"
10039010-210 = "Хм? Ты что-то сказал, Сенсей?"
10039010-211 = "...Правда?"
10039010-212 = "Вы хотите помочь? Помочь мне?"
10039010-213 = "Хотите пойти со мной, пока я буду узнавать что смогу у других клубов?"
10039010-214 = "Н-Нет, я вовсе не хотела просить вас об этом!"
10039010-215 = "У вас и без того куча работы. Я не могу просить вас настолько сильно менять свои планы ради меня."
10039010-216 = "...Правда?"
10039010-217 = "Мне не обязательно смотреть на это так? Что вы имеете в виду...?"
10039010-218 = "[s5] «Я имею в виду, что мы думаем одинаково.»\n[s6] «Я тоже хочу помочь Сакурако и Минэ.»"
10039010-221 = "Ох, Сенсей..."
10039010-222 = ""
10039010-224 = ""
10039010-225 = "Хи-хи..."
10039010-226 = "Вы... Вы действительно удивительный человек, знаете?"
10039010-227 = "Наверное, логично, что вы так скажете. Просто я не думала, что вы..."
10039010-228 = "Ну, раз вы сами предлагаете, было бы невежливо отказываться."
10039010-229 = "Спасибо, Сенсей. Я рада, что вы снова помогаете мне."
10039010-230 = "...Хотя мне стоит помнить: дело не во мне."
10039010-231 = "Мне нужно сосредоточиться на том, чтобы помочь Сакурако и Минэ."
10039010-232 = "Так что... Сенсей."
10039010-233 = "На сегодня закончим, уже поздно."
10039010-234 = "А завтра утром..."
10039010-235 = ""
10039010-237 = ""
10039010-238 = ""
10039010-239 = "...мы «выйдем в народ» и узнаем всё, что только можно, о жизни поп-идолов!"
