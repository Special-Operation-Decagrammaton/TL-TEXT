[translation]
212140-1 = "Episódio 14;As Rebeldes"
212140-6 = "Aqui o movimento de pessoas é quase zero."
212140-7 = "Circular pelo pátio aberto é pedir pra ser presa. Melhor nos movermos pelas sombras, né?"
212140-8 = ""
212140-12 = "Droga, que ódio, que ódio!"
212140-13 = "O Sensei foi levado bem diante do meu nariz e eu tive que ficar parada que nem uma pamonha......#nIsso é uma vergonha imperdoável pro meu distintivo da Disciplina......!"
212140-14 = "Acalme-se, Iori. O Sensei já previa exatamente esse desdobramento."
212140-15 = "Foi justamente por isso que ele nos confiou essas missões antes de ser levado."
212140-16 = "......Ele nos alertou: se o pilar aparente sumir, o inimigo baixará a guarda."
212140-17 = "E que o nosso retorno aos nossos respectivos papéis marcaria o início real da operação."
212140-18 = "Eu sei de tudo isso na teoria, mas engolir isso a seco é outra história......!"
212140-19 = "Não é fácil engolir o orgulho desse jeito......"
212140-21 = "......O peito de todo mundo aqui tá apertado igual."
212140-22 = "Por isso mesmo que a gente vai ter que acertar um soco bem no meio da fuça delas!#nTodo mundo decorou muito bem as suas tarefas, né?"
212140-23 = ""
212140-26 = ""
212140-27 = "Primeiro passo é arregimentar aliadas."
212140-28 = "Eu cuido do Comitê de Disciplina. Tenho certeza absoluta de que nem todas caíram no transe."
212140-29 = "Eu vou abordar as alunas que demonstravam as mesmas dúvidas que nós."
212140-30 = "Se não forem do 3º ano, conseguiremos convencê-las pela razão."
212140-32 = "A gente também vai tomar o maior cuidado pra não levantar suspeitas."
212140-34 = "Contudo, o sucesso de tudo repousa na conclusão da frequência de interferência."
212140-35 = "Podemos juntar um exército inteiro, mas se não quebrarmos a lavagem cerebral, terá sido tudo em vão......#nSatsuki-senpai, a senhora garante que consegue?"
212140-36 = "Fufufu...... podem deixar com esta que vos fala.#nNinguém neste mundo entende mais das maquinações da Imperatriz do que eu."
212140-37 = "Certo. Contamos com a sua perícia."
212140-38 = "E vendo vocês, minhas queridas júniors, se desdobrarem com tanta garra,#como única veterana do 3º ano aqui, não posso me dar ao luxo de passar vergonha, não é?"
212140-39 = "Sem contar que não aguento mais ver a Makoto-chan agindo daquele jeito deprimente."
212140-40 = "......Faço de suas palavras as minhas."
212140-42 = "No dia da execução, nós abriremos caminho até a sala da rádio na força bruta."
212140-43 = "A segurança tá pesadíssima, mas daremos conta nem que seja na marra."
212140-44 = "Tenham cuidado redobrado com as veteranas da Disciplina e da Pandemonium."
212140-45 = "Se formos descobertas antes da hora...... ninguém sairá ilesa."
212140-47 = "Na melhor das hipóteses seremos trancadas numa cela; na pior, punidas sumariamente como traidoras."
212140-48 = ""
212140-51 = ""
212140-52 = "Será que elas teriam coragem de ir tão longe assim?"
212140-54 = "Você ouviu o aviso da Presidente Hina, não ouviu? Aquele olhar dela era de quem não hesitaria em disparar."
212140-55 = "Não cometam o erro de medir a Presidente Hina de agora com a régua do passado."
212140-57 = "Ter cautela é ótimo, mas se dermos de cara com ela durante a invasão, o que a gente faz?"
212140-58 = ""
212140-61 = ""
212140-62 = "......Sendo bem sincera: não há força humana capaz de detê-la."
212140-63 = "Se a Presidente Hina entrar em combate, toda a nossa determinação será varrida em questão de segundos."
212140-65 = "Ela é tão invencível assim mesmo......?"
212140-66 = "Os preparativos de invasão de Gehenna estão na fase final.#nSe a guerra começar antes de agirmos, será tarde demais."
212140-67 = "Não tem um jeito de atrasar o cronograma delas nem que seja um pouquinho......?"
212140-68 = "Eu vou emperrar todas as autorizações de munição e suprimentos da Disciplina o máximo que puder.#nQualquer empecilho burocrático já nos compra horas preciosas."
212140-69 = "E há mais pessoas sabotando as engrenagens além de nós."
212140-70 = "O exemplo mais notável é――"
212140-77 = ""
212140-78 = ""
212140-80 = ""
212140-81 = ""
212140-82 = "NÃO VOU FAZER!! É IMPOSSÍVEL!!"
212140-83 = ""
212140-86 = ""
212140-87 = "Por que essa recusa absurda?!"
212140-88 = "Estamos apenas pedindo para cozinharem rações de campanha, não é nada de outro mundo!"
212140-89 = "Não difere em quase nada do que o Clube de Alimentação faz todo santo dia!"
212140-90 = "Exatamente! Por acaso preparar refeições para todo o exército de Gehenna é pedir demais?!"
212140-92 = "É PEDIR O IMPOSSÍVEL, SIM!! Vocês fazem ideia de quantas alunas estudam em Gehenna?!#nE vocês querem comida pra esse batalhão todo em TRÊS DIAS?! Vocês por acaso sabem fazer conta de padaria?!"
212140-93 = "Se operarem com rigor e eficiência, o cronograma é perfeitamente exequível. Nós planejamos a escala militar minuto a minuto――"
212140-94 = "Esse delírio de escala é problema de vocês!! O que não dá, não dá e pronto!"
212140-95 = "Se vocês são burras demais pra entender, eu desenho agora mesmo:"
212140-96 = "Em primeiro lugar: nossa infraestrutura não aguenta!"
212140-97 = "Já estamos assando barras de proteína hipercalóricas 24 horas sem parar!"
212140-98 = "Se ligarmos mais um ciclo agora, os fornos explodem e mandam o prédio inteiro pro espaço! Querem pagar pra ver?!"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "C-Chefa...... o forno começou a fazer um barulho de fera rosnando lá dentro......#nS-Será que foi porque eu encostei na tampa......?"
212140-107 = "Rosnando......?! De dentro do forno......?!"
212140-108 = "Deixando esse perigo biológico de lado por ora: segundo problema é a conservação!"
212140-109 = "O cardápio ridículo que vocês exigiram estraga quase que instantaneamente em temperatura ambiente!"
212140-110 = "Se empacotarmos desse jeito, o exército inteiro vai ter uma intoxicação alimentar fulminante no meio da marcha!"
212140-111 = "Se vocês querem matar as próprias tropas envenenadas, o problema é de vocês!"
212140-112 = "N-Não foi isso o que pedimos......"
212140-113 = "E por último: falta de braço!"
212140-114 = "Mesmo com nós duas virando a noite trabalhando sem piscar, é fisicamente impossível cozinhar oito vezes a demanda normal! NÃO DÁ!"
212140-115 = ""
212140-120 = ""
212140-121 = "C-C-Chefa!! Os onigiris que fiz com as sobras ganharam vida......#ne tão devorando as rações de emergência da despensa todinha......!"
212140-122 = "O-O que a gente faz agora?!"
212140-124 = "Vocês tão vendo?! Só pra dedetizar aquela aberração e desinfetar o galpão vai levar no mínimo três dias!"
212140-125 = "Três dias?! Se a líder Makoto descobrir isso, vai rolar cabeças......!"
212140-126 = "Então venham vocês mesmas pilotar o fogão!#nEntenderam agora? Nem que a vaca tussa a gente cumpre esse prazo insano!"
212140-129 = ""
212140-130 = "Droga, fomos emboscadas por esse gargalo imprevisto......"
212140-131 = "Subestimamos a logística alimentar. Nesse ritmo, todo o cronograma da ofensiva será prejudicado."
212140-132 = "Há alguma contramedida viável que possamos adotar imediatamente?"
212140-133 = "Sendo assim――!!"
212140-136 = ""
212140-137 = ""
212140-139 = ""
212140-141 = ""
212140-142 = "Eis que viemos nos apresentar como força auxiliar para o Clube de Alimentação."
212140-143 = ""
212140-145 = ""
212140-146 = "Mas vocês não sabem fritar um ovo sem explodir a cozinha!!"
212140-147 = "Pensando bem, é verdade, não é mesmo?"
212140-148 = "ENTÃO POR QUE DIABOS VOCÊS VIERAM PRA CÁ?!"
212140-151 = "(Algum tempo depois......)"
212140-154 = ""
212140-155 = "Peneirei a farinha todinha, gente～!"
212140-156 = "Nossa, que agilidade!#nPode deixar comigo que agora eu sovo a massa!"
212140-157 = ""
212140-159 = ""
212140-161 = "Picar cebolas em cubos milimétricos...... uma tarefa simplória para o meu refinamento."
212140-162 = "Seguindo estritamente as medidas regulamentares, sem um mísero milímetro de erro......"
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "Ai, como arde os olhos...... snif. Contudo......"
212140-168 = "Jamais negligenciarei o esforço supremo de guerra...... ugh."
212140-169 = "Haruna, até que você tá indo bem, mas...... por que essa obsessão toda do nada?"
212140-170 = "Ora, mas é evidente――"
212140-171 = "Snif."
212140-172 = ""
212140-174 = ""
212140-175 = "É pela perfeição absoluta de Gehenna."
212140-176 = "Hã? Como assim?"
212140-177 = "Acaso não sente a sede de combate pulsando em suas veias?"
212140-178 = "Vivíamos aprisionadas à busca efêmera da alta gastronomia, desperdiçando nossos dias em deleites vazios.#nMas agora ganhamos um propósito glorioso e imutável."
212140-179 = "A estrada para a vitória suprema começa sob a lâmina desta faca."
212140-180 = ""
212140-182 = ""
212140-183 = ""
212140-184 = "Ai, meus olhinhos...... tá queimando tudo......"
212140-185 = "......Entregar o coração aos preparativos é nosso dever inalienável, concorda?"
212140-186 = "......"
212140-187 = "Fufufu, mal posso esperar pelo dia em que unificaremos Kivotos.#nAssim não precisaremos mais arrumar confusão entre distritos para importar ingredientes raros."
212140-188 = "A felicidade degustada sob uma ordem inabalável talvez seja muito mais doce do que qualquer iguaria exótica incerta."
212140-189 = "Vamos trabalhar com afinco para que esse dia chegue logo★"
212140-190 = ""
212140-192 = ""
212140-193 = "Aquelas duas tão muito estranhas. Digo, birutas elas sempre foram, mas agora......"
212140-194 = "Parece que viraram outras pessoas......"
212140-195 = "Pois é. De repente viraram patriotas fanáticos de Gehenna."
212140-197 = "Parece que acharam algo mais valioso do que a própria gastronomia.#nPor que será?"
212140-198 = "Não são só elas...... a escola inteira adoeceu de alguma loucura inexplicável."
212140-199 = "Eu acho tão sem graça se tudo tiver o mesmo gosto......"
212140-200 = "Se o mundo inteiro tiver sabor de Gehenna......"
212140-201 = "Eca...... não quero nem pensar."
212140-202 = "......Sem contar que, se a guerra explodir, até os restaurantes famosos vão ser destruídos."
212140-203 = "O fornecimento de ingredientes vai parar, os prédios vão virar escombros......#e vão fechar as portas pra sempre."
212140-204 = "Tenho uma lista cheia de restaurantes incríveis que ainda nem tive a chance de visitar......"
212140-205 = ""
212140-207 = ""
212140-208 = "......Temos que impedir essa guerra a qualquer custo. Ou ao menos atrasá-la ao máximo."
212140-209 = ""
212140-212 = ""
212140-213 = "E como a gente faz isso?"
212140-214 = "Não importa quantos soldados você tenha: sem comida, exército nenhum marcha."
212140-215 = "E a comida de Gehenna tá todinha nas nossas mãos."
212140-216 = "......Quer dizer que basta a gente ser as cozinheiras mais incompetentes do planeta?"
212140-217 = ""
212140-219 = ""
212140-221 = "Exatamente."
212140-223 = ""
212140-224 = ""
212140-226 = ""
212140-227 = "COMO ASSIM?! Eu mesma destaquei as maiores autoridades gastronômicas de Gehenna para reforçar a cozinha!"
212140-228 = "POR QUE DIABOS A PRODUÇÃO CAIU PELA METADE?!!"
212140-229 = ""
212140-231 = ""
212140-232 = "D-Do relatório que chegou da cozinha consta apenas que...... 'Culinária não é conta de somar!'......!"
212140-234 = "Malditas! Queria refutar o argumento, mas não entendo patavina de preparo em escala industrial! Que humilhação cósmica!"
212140-235 = "Depender exclusivamente daquele Clube de Alimentação para a intendência de guerra agora nos custa caro......"
212140-236 = "Líder Makoto, ao que parece a raiz do problema é outra."
212140-237 = "O quê?! O que está querendo insinuar?"
212140-238 = "......Sabotagem intencional."
212140-239 = "A senhora tem ciência das movimentações clandestinas das alunas rebeldes."
212140-240 = "Devemos encarar este atraso sob a mesma perspectiva."
212140-241 = "......Mas o Sensei, que era o cérebro articulador, já está devidamente encarcerado!"
212140-242 = "Mesmo após conter um incêndio florestal, as brasas continuam queimando sob a terra."
212140-243 = "Então o que sugere?! Que eu mande fuzilar a chefe de cozinha Aikiyo Fuuka agora mesmo――"
212140-244 = ""
212140-248 = "Aguarde, líder Makoto. Tomar essa atitude extrema não resolverá o nosso impasse em nada."
212140-249 = ""
212140-251 = ""
212140-252 = ""
212140-256 = ""
212140-257 = "Não há ninguém em toda Gehenna capaz de suprir esse volume mastodôntico de mantimentos num prazo tão exíguo."
212140-258 = "A senhorita Fuuka tem plena ciência disso, e é por esse motivo que se comporta com tamanha audácia."
212140-260 = "......Ela tem razão.#nSe punirmos o Clube de Alimentação, a intendência de Gehenna entrará em colapso total."
212140-261 = "E vamos ficar de braços cruzados assistindo?!#nNão há outra saída para conter esse boicote?!"
212140-263 = "Lamentavelmente, não vislumbro nenhuma solução mágica de pronto."
212140-264 = "A Fuuka e a Juri são surpreendentemente obstinadas quando cismam com algo."
212140-266 = "Trabalhadores insubstituíveis são um estorvo nas horas críticas......"
212140-267 = "Tsc! Não chamei vocês aqui para ouvir lamentações óbvias!#nExigi que me trouxessem soluções práticas!"
212140-268 = "No frigir dos ovos, a negligência em não treinar um corpo substituto de cozinheiras foi sua, líder Makoto."
212140-269 = "CALE ESSA BOCA!!"
212140-270 = "Por ora, nós da Sociedade de Pesquisa Gastronômica estenderemos o turno de vigilância presencial na cozinha."
212140-271 = "Ufa...... que seja. Podem se retirar."
212140-272 = "Apenas recordem-se: coações violentas contra a equipe de cozinha só agravarão o boicote.#nFufufu."
212140-273 = "Humph, logo vocês bancando as protetoras? Foram vocês que explodiram o refeitório e sequestraram a chefe Fuuka dúzias de vezes!"
212140-274 = "Eram atos indispensáveis em prol da alta culinária.#nContudo, diante de um desígnio histórico superior, não podemos nos rebaixar a velhos vícios do passado."
212140-276 = "Sem contar que maltratar o Clube de Alimentação é privilégio exclusivo nosso.#nNão permitiremos que ninguém mais usurpe esse nosso direito sagrado★"
212140-277 = "......É o cúmulo do absurdo."
212140-278 = "Diretora Ako.#nCaso esse boicote se estenda...... de quanto será o atraso estimado na deflagração da guerra?"
212140-279 = "......Estimo um atraso de semanas; na pior das hipóteses, meses adicionais de preparação."
212140-280 = "......Que desastre."
212140-281 = "O tempo era o nosso elemento de ouro."
212140-282 = ""
212140-286 = ""
212140-287 = "Concordo plenamente. Mas......"
212140-288 = "Uma guerra-relâmpago para aniquilar o Conselho Estudantil Federal e as outras escolas antes que percebessem o golpe seria o ideal......#nMas nas atuais condições logísticas, é inviável."
212140-289 = "E a cada dia que passa, as variáveis de risco aumentam exponencialmente."
212140-290 = "Embora estejamos censurando as redes sociais, há postagens esparsas furando o bloqueio.#nEstamos rastreando e deletando tudo, mas......"
212140-291 = ""
212140-293 = ""
212140-294 = "......"
212140-296 = "Se é assim, basta mudarmos a nossa estratégia."
212140-297 = ""
212140-299 = ""
212140-300 = ""
212140-301 = "......Mudar para qual estratégia?"
212140-302 = ""
212140-304 = ""
212140-306 = ""
212140-307 = ""
212140-308 = "Reduziremos tudo a cinzas primeiro, e sobre os escombros ergueremos a nova ordem."
212140-309 = "Reduzir Kivotos inteira a cinzas? Mas como pretende fazer isso?"
212140-310 = "Kwahaha! Uma solução extremamente elementar:"
212140-311 = "Mísseis com ogivas químicas de destruição em massa capazes de transformar o distrito central de D.U. em terra arrasada com um único impacto.#nE se tivermos dezenas dessas ogivas prontas para lançamento?"
212140-312 = ""
212140-314 = ""
212140-315 = "Não me diga que......"
212140-316 = "Sim! Vou recriar o arsenal de armas estratégicas da finada Imperatriz do Trovão!"
212140-317 = "A manufatura não exigirá tempo demais?"
212140-318 = "Kwahaha, não tema! Todos os esquemas industriais estão perfeitamente arquivados aqui na minha memória genial!"
212140-319 = "......Formidável, Makoto."
212140-320 = "Minha mente estava presa à logística tradicional de ocupação terrestre, mas diante da sabotagem, mudemos as armas!"
212140-321 = "Não será o capricho de meia dúzia de cozinheiras que deterá a nossa marcha gloriosa!"
212140-322 = ""
212140-324 = ""
212140-327 = ""
212140-328 = "......O poder latente de Gehenna é verdadeiramente assombroso.#nConfesso que ignorava a existência de armamento tão formidável."
212140-329 = "Kwahaha! Apenas mantivemos guardado em segredo, sem motivo para usar."
212140-330 = "Mas agora que enxergamos a futilidade dos limites morais anteriores......#tais amarras deixam de ter qualquer valor, não concorda?"
212140-331 = "Eu garanto:#nUnida sob um único comando, Gehenna será absolutamente indestrutível!"
212140-332 = "......Sim. A Gehenna de agora será mais poderosa do que qualquer força existente."
212140-333 = "Assim que as ogivas estiverem armadas, dispararemos sem aviso prévio. Mantenham todas as tropas em prontidão máxima!"
212140-335 = "Compreendido. Ako, reorganize as diretrizes de combate integrando as novas armas."
212140-336 = "Sim, Presidente Hina. Apresentarei o novo plano em uma hora."
212140-338 = ""
212140-339 = "......"
212140-341 = "Próximo Episódio;Montando o Plano"
