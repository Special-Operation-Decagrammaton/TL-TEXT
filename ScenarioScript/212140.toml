[translation]
212140-1 = "Episode 14;The Rebels"
212140-6 = "There's not much foot traffic here."
212140-7 = "The school grounds are dangerous, so we should stick to places where we won't stand out, right?"
212140-12 = "Damn it, damn it all!"
212140-13 = "Sensei was taken away, and all I could do was watch...#nI'm not fit to be a Prefect at this rate...!"
212140-14 = "Please, calm down. Sensei already predicted this situation, didn't they?"
212140-15 = "That is precisely why they entrusted us with these roles in advance."
212140-16 = "...Sensei said it, didn't they? That if the pillar is removed, the other side will let their guard down."
212140-17 = "That us returning to our respective duties is the start of the operation."
212140-18 = "I know that, but still...!"
212140-19 = "It's not that easy to just accept it..."
212140-21 = "...We all feel the same."
212140-22 = "That's exactly why we have to hit them hard. #nEveryone, you remember your jobs, right?"
212140-27 = "First, we need to gather our allies."
212140-28 = "I'll handle the Prefect Team. Not everyone has been swayed by them."
212140-29 = "I'll try to make contact with the students who share similar thoughts."
212140-30 = "I should be able to persuade anyone who isn't a third-year."
212140-32 = "We'll be careful not to draw any attention to ourselves, too."
212140-34 = "That said, the key to everything is the completion of the jamming frequency."
212140-35 = "No matter how many people we gather, it'll all be for nothing if we can't break the brainwashing...#nSatsuki-senpai, will you be okay?"
212140-36 = "Hehe... Leave it to me.#nThere shouldn't be anyone better than me when it comes to the Raitei's research."
212140-37 = "Yes. We're counting on you."
212140-38 = "Besides, my juniors are working so hard. #nAs the only third-year, I can't show them a pathetic side, can I?"
212140-39 = "I don't want to see Makoto-chan like that, either."
212140-40 = "...I agree."
212140-42 = "When the day of the operation comes, we'll clear the path to the broadcasting room."
212140-43 = "The security is tight, but we'll find a way."
212140-44 = "Please be especially careful of surveillance from the Prefect Team and the Pandemonium Society seniors."
212140-45 = "If we're discovered... I doubt it will end peacefully."
212140-47 = "We'll be treated as rebels and suffer... even if we're lucky, we'll be detained."
212140-52 = "Do you think they'd go that far?"
212140-54 = "You heard the Prefect's warning, didn't you... She had the look of someone who would do anything."
212140-55 = "You shouldn't think of the current Hina-iinchou as the same person she used to be."
212140-57 = "You're free to think whatever you want, but what will you do if you run into her during the operation?"
212140-62 = "...Sigh. Honestly, there's no way to stop her."
212140-63 = "If Hina-iinchou shows up, she'll wipe us out in an instant, regardless of our resolve."
212140-65 = "So she really is overwhelming..."
212140-66 = "Gehenna's attack preparations are already in the final stage. #nIt's meaningless if we don't act before the fighting starts."
212140-67 = "Can't we somehow delay the preparations..."
212140-68 = "I'll delay the approval process for the Prefect Team's ammunition and supplies as much as possible. #nTo at least cause some disruption to the schedule."
212140-69 = "There are other students who think the same way, outside of this group."
212140-70 = "The most prominent one is—"
212140-82 = "We won't do it!! It's impossible!!"
212140-87 = "Why not!?"
212140-88 = "It's just a simple matter of preparing supplies!"
212140-89 = "It shouldn't be much different from what the School Lunch Club does on a daily basis."
212140-90 = "Exactly. Are you saying it's unreasonable to ask for combat rations to feed all of Gehenna?"
212140-92 = "It is unreasonable! How many people do you think are in all of Gehenna!? #nAnd you want it done in three days? Can you even do basic math!?"
212140-93 = "It's a calculation that's possible if you work efficiently. We've already set the training schedule down to the minute—"
212140-94 = "That's your problem, isn't it!? If it's impossible, it's impossible!"
212140-95 = "If you don't understand, I'll explain it to you now."
212140-96 = "First, we lack the equipment."
212140-97 = "We're already making high-calorie protein bars 24 hours a day."
212140-98 = "If we add another cycle here, the ovens will explode and blow up the whole building. #nDo you still want us to do it?"
212140-105 = "A-and the ovens have started making sounds like a beast growling... #nWas it a mistake for me to touch them...?"
212140-107 = "Growling...? Inside the oven...?"
212140-108 = "Setting that aside for a moment. #nSecond, there's the issue of preservation."
212140-109 = "Most of the menu you're requesting will spoil immediately at room temperature."
212140-110 = "Even if we could make it, if we took it out like this, everyone would be wiped out by food poisoning."
212140-111 = "If that's what you want, be my guest!"
212140-112 = "W-well, that's not what I meant..."
212140-113 = "Finally, we're short on staff."
212140-114 = "Even if two people worked full-time through the night, we can't cook eight times the usual amount. #nIt's physically impossible!"
212140-121 = "B-buchou! The rice balls we made with the leftovers just came to life... #nThey've started devouring the emergency rations in the warehouse...!"
212140-122 = "W-what should we do!?"
212140-124 = "You saw it, right? It'll take at least three days just to exterminate those and disinfect the warehouse."
212140-125 = "Three days!? If the Chairman finds out, I'm done for...!"
212140-126 = "Then why don't you do it yourselves! #nYou get it now, right? We won't meet your demands even if it kills us!"
212140-130 = "Ugh, I didn't expect such an ambush..."
212140-131 = "We underestimated the importance of logistics. #nAt this rate, the entire schedule will be disrupted."
212140-132 = "Is there any immediate remedy?"
212140-133 = "In that case—!!"
212140-142 = "And so, we have arrived as auxiliary staff for the School Lunch Club."
212140-146 = "You guys can't even cook, can you!?"
212140-147 = "Come to think of it, that's true, isn't it?"
212140-148 = "Then why did you come here!?"
212140-151 = "(A while later...)"
212140-155 = "I've sifted the flour~!"
212140-156 = "Wow! That's incredibly fast! #nI'll take it from here to make the dough, so tag you're it!"
212140-161 = "The task of chopping onions... this is nothing."
212140-162 = "According to the specified size, without a single millimeter of error..."
212140-167 = "Sigh, it stings... *sniff*. But..."
212140-168 = "We cannot neglect our preparations... *sob*."
212140-169 = "Haruna, you're doing better than I thought, but... why are you so desperate?"
212140-170 = "Oh, that is, of course—"
212140-171 = "*sniff*."
212140-175 = "It is for a perfect Gehenna."
212140-176 = "Eh, what's that?"
212140-177 = "Do you not feel it? The thirst for battle pulsing in our blood."
212140-178 = "We were obsessed with gourmet food and wasted our days aimlessly. #nBut now, haven't we been given a clear goal?"
212140-179 = "The path to victory begins with these hands."
212140-184 = "Ugh... my eyes..."
212140-185 = "...It's only natural to put our hearts into the preparations, isn't it?"
212140-186 = "..."
212140-187 = "Ufufu, I look forward to the day we unify Kivotos. #nThen there will be no need to cause trouble between schools just for ingredients."
212140-188 = "The happiness tasted within order might be sweeter than uncertain gourmet food."
212140-189 = "Now, let's do our best for the day that is to come★"
212140-193 = "Those two are acting kind of weird. Ah, they were weird before, but... how should I put it..."
212140-194 = "It's like they're different people..."
212140-195 = "Yeah, exactly. Like they suddenly love Gehenna too much."
212140-197 = "It's like they found something more important than gourmet food. #nWhy do you think that is?"
212140-198 = "It's not just the two of them... Gehenna itself is becoming strange."
212140-199 = "I wish there were more variety in flavors..."
212140-200 = "If the whole world ends up tasting like Gehenna..."
212140-201 = "Ugh... I don't want that."
212140-202 = "...And if the fighting starts, even the best restaurants will be damaged."
212140-203 = "Ingredient deliveries might stop, or the shops might get destroyed... #nThey might even close down."
212140-204 = "I've been taking notes so hard, and there are still so many places I haven't been to yet..."
212140-208 = "...We have to make sure the war doesn't happen. Or at least delay it as much as possible."
212140-213 = "Can you do that?"
212140-214 = "No matter how strong they are or how many people they have, they can't fight without supplies."
212140-215 = "And we control Gehenna's supplies."
212140-216 = "...You mean we just have to make ourselves useless?"
212140-221 = "Yes."
212140-227 = "I, myself, even went as far as to get Gehenna's strongest gourmets to help out!"
212140-228 = "Why has production been cut in half!!"
212140-232 = "T-the reports from the field only say... cooking isn't 1+1...!"
212140-234 = "Ugh, I'm not well-versed in mass cooking, so I can't even refute them...! This is the height of frustration!"
212140-235 = "So this is the price we pay for relying entirely on the School Lunch Club for the supply process..."
212140-236 = "Chairman Makoto, it seems the cause lies elsewhere."
212140-237 = "What was that!? What do you mean by that!"
212140-238 = "...It's sabotage."
212140-239 = "You should already be aware of the organized movements of the opposition."
212140-240 = "I believe this matter should be viewed from the same perspective."
212140-241 = "...But we already detained Sensei, who is seen as the center of it."
212140-242 = "Once a fire is lit, even if the wildfire is extinguished, embers remain underground."
212140-243 = "Then what should we do! Should we punish the School Lunch Club manager, Fuuka, and—"
212140-248 = "Wait a moment. That will not help solve the current situation at all."
212140-257 = "There is no one else who can prepare such a vast amount of supplies in such a short period."
212140-258 = "Fuuka-san knows that, which is likely why she is acting the way she is now."
212140-260 = "...That is correct. #nIf we punish the School Lunch Club, the entire supply system of Gehenna will completely collapse."
212140-261 = "Then are you telling me to just watch? #nIs there any other way to prevent the sabotage?"
212140-263 = "Unfortunately, I don't have any brilliant ideas for that."
212140-264 = "Fuuka-san and Juri-san are surprisingly stubborn, aren't they?"
212140-266 = "It's troublesome to have personnel that cannot be replaced..."
212140-267 = "Ugh, I didn't call you here to hear that! #nI'm telling you to bring me a solution!"
212140-268 = "If we trace it back to the source, isn't it your fault for not training replacements for the School Lunch Club?"
212140-269 = "Shut up!!"
212140-270 = "For the time being, let's deal with it by increasing the surveillance range and time of the Gourmet Research Society."
212140-271 = "Sigh... Understood. Then you may leave."
212140-272 = "Threatening or interfering with the School Lunch Club will only lead to a further deterioration of the situation... Don't forget that. #nFufu."
212140-273 = "Hmph, you yourselves are the very threat to the School Lunch Club. #nI've received countless reports of cafeteria bombings, the kidnapping of the School Lunch Club manager, and more."
212140-274 = "It was necessary for the sake of gourmet food. #nHowever, now that we have a bigger goal, we cannot continue to behave as we did before."
212140-276 = "Besides, we're the only ones who should be doing that to the School Lunch Club. #nWe can't let others copy us★"
212140-277 = "...What an absurd story."
212140-278 = "Administrative Officer Ako. #nIf this situation continues... how much of a delay can we expect before the attack begins?"
212140-279 = "...At the very least, it will take weeks, and if it drags on, months of additional time."
212140-280 = "...This is bad."
212140-281 = "Even though time is our greatest weapon."
212140-287 = "I agree. But..."
212140-288 = "A blitzkrieg to wipe out the General Student Council and other schools before they catch on would be ideal, but... #nIt's impossible under the current circumstances."
212140-289 = "However, the longer it takes, the more the anxiety grows."
212140-290 = "We are controlling social media, but there are rare cases where posts get through. #nWe are tracking and deleting them, but..."
212140-294 = "..."
212140-296 = "Then, we should change our methods."
212140-301 = "...Like what?"
212140-308 = "After we level the ground, we will build a new order upon the ashes."
212140-309 = "The entire Kivotos region? How?"
212140-310 = "Kishishi, what, it's a simple story."
212140-311 = "Chemical bombs that can turn the D.U. central district into scorched earth with just one hit. #nWhat if we had dozens of them?"
212140-315 = "Could it be..."
212140-316 = "Yes, we will restore the Raitei's strategic weapons."
212140-317 = "Won't that take time?"
212140-318 = "Kishishi, no problem. I have everything memorized in this head."
212140-319 = "...As expected of you."
212140-320 = "Our thinking was trapped by the occupation, but now that the situation has changed, we should change our means as well."
212140-321 = "A bit of sabotage will never stop this progress."
212140-328 = "...Gehenna's hidden potential is truly terrifying. #nI didn't know such things even existed."
212140-329 = "Kikiki. We just didn't bother to bring them out or use them."
212140-330 = "But now that we realize the lines we've been protecting are meaningless... #nSuch restrictions are as good as non-existent, aren't they?"
212140-331 = "I, myself, will guarantee it. Gehenna, with the goal of a single order, is the strongest."
212140-332 = "...Yes. The current Gehenna will be stronger than anything else."
212140-333 = "As soon as the weapons are ready, we will begin the attack immediately. Everyone, stay on high alert and stand by."
212140-335 = "Understood. Ako, organize the changes from the existing plan."
212140-336 = "Yes, Iinchou. I will report back in an hour."
212140-339 = "..."
212140-341 = "Next Episode;Operation Planning"