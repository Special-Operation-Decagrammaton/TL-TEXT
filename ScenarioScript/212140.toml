[translation]
212140-1 = "Эпизод 14;Предатели"
212140-6 = "Сюда редко кто заглядывает."
212140-7 = "И раз мы больше не можем встречаться на территории академии, приходится соблюдать осторожность."
212140-8 = ""
212140-12 = "Чёрт, чёрт!"
212140-13 = "Не могу поверить, что просто стояла и смотрела, как уводят Сенсея... И после этого я называю себя членом Префектуры...?!"
212140-14 = "Успокойся, Иори. Сенсей предвидел такой исход."
212140-15 = "Именно поэтому каждому из нас поручена своя роль."
212140-16 = "...Сенсей предсказал, что после устранения «главного виновника» они ослабят бдительность."
212140-17 = "Теперь начинается наша настоящая операция. Нужно разойтись по своим участкам и действовать."
212140-18 = "Это так, но..."
212140-19 = "Мне кажется... сердце сейчас разорвётся..."
212140-21 = "...Думаю, всем нам так кажется."
212140-22 = "Поэтому стоит как следует им врезать. Все помнят свои задания?"
212140-23 = ""
212140-26 = ""
212140-27 = "Для начала нужно собрать как можно больше единомышленников."
212140-28 = "Я займусь вербовкой в Префектуре. Уверена, некоторые её члены не хотели участвовать в этом безумии."
212140-29 = "А я сделаю то же самое в Пандемониуме."
212140-30 = "Пусть прежней власти у меня больше нет, я смогу убедить хотя бы нескольких студентов. Кроме третьего курса, разумеется."
212140-32 = "А мы сделаем всё, что сможем, силами Лиги наследия."
212140-34 = "И самое главное... нам нужна частота для подавления сигнала, которую должна найти Сацуки."
212140-35 = "...Сколько бы внимания мы ни привлекли и сколько бы людей ни собрали, всё бесполезно, если не сможем отменить промывание мозгов... Сацуки?"
212140-36 = "Фу-фу... Положитесь на меня. Никто во всём Кивотосе не изучал исследования Императора-тирана лучше меня."
212140-37 = "Очень на тебя рассчитываю."
212140-38 = "Не могу же я опозориться, пока студенты младших курсов так усердно работают."
212140-39 = "И мне невыносимо больше видеть Макото такой."
212140-40 = "...Да. Мне тоже."
212140-42 = "Когда придёт время, мы проложим путь к радиорубке."
212140-43 = "Охрана сильная, но мы справимся."
212140-44 = "И ещё надо быть начеку из-за старшекурсников Префектуры и Пандемониума."
212140-45 = "Если нас поймают... добра не жди."
212140-47 = "...Нас объявят предателями Геенны и подвергнут пыткам... или, если повезёт, просто посадят."
212140-48 = ""
212140-51 = ""
212140-52 = "Неужели они настолько далеко зайдут?"
212140-54 = "Ты ведь слышала предупреждение главы Префектуры... Её не остановить."
212140-55 = "Мы не можем считать её прежней Хиной."
212140-57 = "А если она появится прямо во время боя? У нас есть план?"
212140-58 = ""
212140-61 = ""
212140-62 = "...*вздох* Честно говоря, против неё никакая стратегия не поможет."
212140-63 = "Если глава Префектуры вмешается, всё кончится в одно мгновение."
212140-65 = "Настолько она сильна..."
212140-66 = "Подготовка к войне почти завершена. Если собираемся действовать, нужно спешить."
212140-67 = "Ух. Но нам нужно больше времени! Мы едва успели организовать сопротивление!"
212140-68 = "Постараемся как можно дольше затянуть согласование вооружения Префектуры."
212140-69 = "К тому же есть и другие, кто готов сражаться за наше дело, хотя сейчас их здесь нет."
212140-70 = "Например..."
212140-77 = ""
212140-78 = ""
212140-80 = ""
212140-81 = ""
212140-82 = "ОТКАЗЫВАЮСЬ!!! НЕ МОГУ!!!"
212140-83 = ""
212140-86 = ""
212140-87 = "Что?! Объяснись!"
212140-88 = "Это всего лишь подготовка необходимых припасов!"
212140-89 = "Ничем не отличается от обычных обязанностей Клуба школьного питания. Почему ты не можешь выполнить запрос?"
212140-90 = "Что НЕРАЗУМНОГО в том, чтобы за 72 часа приготовить боевые пайки для всех войск Геенны?"
212140-92 = "Три дня?! Издеваетесь?! Вы представляете, сколько в Геенне вечно голодных подростков?! А готовим мы ВДВОЁМ! Сами посчитайте!"
212140-93 = "Если правильно организовать работу, это возможно. Вот, например, мы уже расписали весь график учений буквально по минутам..."
212140-94 = "Так это ВАШИ проблемы! Готовка так не работает."
212140-95 = "Так, слушайте внимательно. Сейчас я здраво и разумно объясню, почему не могу приготовить все эти пайки за три дня."
212140-96 = "Во-первых, у нас нет подходящего оборудования."
212140-97 = "Главный клапан вот-вот лопнет после целого дня выпечки высококалорийных протеиновых батончиков."
212140-98 = "Если я запущу ещё одну партию пайков, печь взорвётся и разнесёт столовую вместе с нами. Всё ещё считаете, что надо продолжать?"
212140-99 = ""
212140-101 = ""
212140-104 = ""
212140-105 = "Я-я только что слышала какой-то странный звук из духовки... Будто животное плачет... Это потому, что я последней трогала дверцу?"
212140-107 = "Плачет...? Погоди, из духовки...?"
212140-108 = "Не отвлекайтесь! Во-вторых, есть проблема с хранением."
212140-109 = "Вы понимаете, что большинство ваших «предметов первой необходимости» требуют постоянного охлаждения? При комнатной температуре они ИСПОРТЯТСЯ."
212140-110 = "Если загрузить такую еду в грузовики, можно и не начинать войну. Все студенты отравятся ещё до неё."
212140-111 = "Если вам так хочется устроить биологическую катастрофу, продолжайте на меня давить!"
212140-112 = "...Н-но это же..."
212140-113 = "И наконец, у нас не хватает людей."
212140-114 = "Даже если мы обе будем работать без сна, мы не сможем приготовить в восемь раз больше еды, чем обычно. На это просто не хватит ни сил, ни времени!"
212140-115 = ""
212140-120 = ""
212140-121 = "А! Рисовый шарик, который я приготовила, ожил... и теперь поедает неприкосновенный запас продуктов...!"
212140-122 = "Ч-что нам делать? Председатель, помогите...!"
212140-124 = "Видите? А теперь мне понадобится ещё как минимум ТРИ дня, чтобы истребить всю эту живность в кладовке."
212140-125 = "Т-три дня?! Это недопустимо! Председатель требует результатов!"
212140-126 = "Тогда готовьте сами! Только вы не сможете, потому что это невозможно!"
212140-129 = ""
212140-130 = "Тц, таких препятствий я не предвидела..."
212140-131 = "Мы недооценили важность снабжения. Такими темпами весь график сорвётся."
212140-132 = "...Какие есть варианты? Предлагайте самый быстрый!"
212140-133 = "В таком случае...!"
212140-136 = ""
212140-137 = ""
212140-139 = ""
212140-141 = ""
212140-142 = "...Именно поэтому нас направили помогать с составлением меню!"
212140-143 = ""
212140-145 = ""
212140-146 = "НО ВЫ ЖЕ СОВСЕМ НЕ УМЕЕТЕ ГОТОВИТЬ!"
212140-147 = "А разве это имеет значение?"
212140-148 = "Вы издеваетесь?"
212140-151 = "Некоторое время спустя..."
212140-154 = ""
212140-155 = "Готово! Я просеяла муку!"
212140-156 = "Ничего себе! Так быстро! Отлично, тогда я замешаю тесто."
212140-157 = ""
212140-159 = ""
212140-161 = "Нарезать лук... Проще простого."
212140-162 = "Соблюдать указанные стандарты, не допуская отклонения даже на миллиметр..."
212140-163 = ""
212140-165 = ""
212140-166 = ""
212140-167 = "*вздох* Мои глаза. *шмыг* Но..."
212140-168 = "Я не могу относиться к подготовке легкомысленно. *шмыг*"
212140-169 = "Харуна, ты справляешься гораздо лучше, чем я думала... Но почему так сильно плачешь?"
212140-170 = "О, ну конечно же, ради..."
212140-171 = "*шмыг*"
212140-172 = ""
212140-174 = ""
212140-175 = "...нашей славной Геенны."
212140-176 = "...Что ты имеешь в виду?"
212140-177 = "Фуука, разве ты не чувствуешь, как по жилам разливается неудержимая жажда завоеваний?"
212140-178 = "Прежде мы были одержимы иллюзией изысканной кухни. Теперь же нас заботит только завоевание Кивотоса."
212140-179 = "Путь к победе мы прокладываем собственными руками."
212140-180 = ""
212140-182 = ""
212140-183 = ""
212140-184 = "*шмыг*"
212140-185 = "...Разве не естественно, что мы должны участвовать в подготовке?"
212140-186 = "..."
212140-187 = "Фу-фу, не дождусь, когда мы захватим Кивотос. Тогда мне больше не придётся воровать золотого магуро из других академий. Мы ведь все станем едины!"
212140-188 = "Знаешь, пожалуй, такая предсказуемо съедобная еда гораздо приятнее, чем сомнительный гастрономический эксперимент!"
212140-189 = "Ну что, давайте постараемся приблизить этот славный день! ★"
212140-190 = ""
212140-192 = ""
212140-193 = "С этими двумя творится что-то странное. Нет, они и раньше были СТРАННЫМИ, но..."
212140-194 = "...Как будто стали совсем другими людьми?"
212140-195 = "Ага, точно. Раньше им почти не было дела до академии, а теперь они словно влюбились в Геенну..."
212140-197 = "Такое ощущение, будто Харуна и Акари нашли что-то... действительно важнее еды."
212140-198 = "...С Геенной сейчас творится что-то неладное."
212140-199 = "Мне нравится мир, в котором есть много разных вкусов..."
212140-200 = "Но если весь мир станет Геенной, как они говорят, разве эти... редкие и особенные блюда не исчезнут?"
212140-201 = "Ух... Какая трагедия! Я такого НЕ ХОЧУ..."
212140-202 = "...И если война действительно начнётся, пострадают все хорошие заведения, которые я так старательно находила."
212140-203 = "Где-то возникнет нехватка продуктов, куда-то попадёт бомба, а кто-то и вовсе разорится."
212140-204 = "А я ещё столько мест не успела посетить..."
212140-205 = ""
212140-207 = ""
212140-208 = "...Тогда нужно не дать войне начаться. Или хотя бы отложить её насколько возможно."
212140-209 = ""
212140-212 = ""
212140-213 = "К-как?"
212140-214 = "Армия не может воевать на голодный желудок."
212140-215 = "А снабжать едой всю Геенну поручено НАМ."
212140-216 = "...То есть нам просто нужно всё испортить?"
212140-217 = ""
212140-219 = ""
212140-221 = "Да."
212140-223 = ""
212140-224 = ""
212140-226 = ""
212140-227 = "Я-я даже отправила им на подмогу лучших гурманов Геенны!"
212140-228 = "Так ПОЧЕМУ производство пайков сократилось вдвое?!"
212140-229 = ""
212140-231 = ""
212140-232 = "Н-ну... Они только и говорят о каком-то «законе убывающей отдачи»!"
212140-234 = "Тц, звучит подозрительно, но я никогда не изучала организацию массового питания...!"
212140-235 = "Не верится, что решение сосредоточить всё производство еды в Клубе школьного питания так нам аукнулось!"
212140-236 = "Председатель Макото, сомневаюсь, что дело лишь в слаженности работников."
212140-237 = "Что?! Что вы имеете в виду, старший администратор Амау Ако?!"
212140-238 = "...Похоже на намеренное замедление работы. Иными словами, саботаж."
212140-239 = "Вы ведь знаете, как мы подавили повстанческую организацию, выступавшую против единой Геенны."
212140-240 = "Предлагаю применить к этим несогласным тот же подход."
212140-241 = "...Но мы ведь уже заперли Сенсея. Он был центральной фигурой, главарём!"
212140-242 = "Как ни прискорбно, после потушенного пожара ещё долго тлеют угли."
212140-243 = "Тогда что нам делать?! Может, наказание председателя Клуба школьного питания Айкиё Фууки послужит при...!"
212140-244 = ""
212140-248 = "Нет. Это не устранит главную проблему."
212140-249 = ""
212140-251 = ""
212140-252 = ""
212140-256 = ""
212140-257 = "Никто другой не способен организовать питание в таких масштабах, тем более за столь короткий срок. Нам нужна Фуука."
212140-258 = "Фуука бунтует, потому что осознала собственную незаменимость."
212140-260 = "...Она права. Если сейчас наказать Клуб школьного питания, вся система снабжения Геенны рухнет."
212140-261 = "Так какое ваше решение? Можно остановить это замедление?"
212140-263 = "Откровенно говоря, не представляю как."
212140-264 = "Вот именно. Фуука и Джури бывают ужасно упрямыми."
212140-266 = "Всегда неприятно, когда незаменимый сотрудник осознаёт себе цену..."
212140-267 = "Тц, я подняла этот вопрос не ради вашей болтовни. Предложите решение!"
212140-268 = "А разве не вы виноваты, что не подготовили замену Клубу школьного питания?"
212140-269 = "Молчать!!!"
212140-270 = "Если пожелаете, мы можем увеличить продолжительность и масштаб наблюдения за Обществом гурманов."
212140-271 = "Уф... Ладно. Возвращайтесь на посты. И подготовьте отчёты!"
212140-272 = "И прошу помнить: любые меры против Клуба школьного питания лишь усугубят ситуацию... Фу-фу."
212140-273 = "Хмф, разве Общество гурманов не представляло главную угрозу Клубу школьного питания? Припоминаю несколько взрывов в столовой и даже похищение председателя клуба."
212140-274 = "Всё это было необходимо ради высокой кухни. Но теперь у нас появилась более важная цель, и мы исправились."
212140-276 = "И вообще, только нам дозволено издеваться над Клубом школьного питания! Нельзя же позволять остальным думать, что им тоже можно! ★"
212140-277 = "...Невероятно."
212140-278 = "Старший администратор Ако. Если всё так продолжится, насколько мы отстанем от графика?"
212140-279 = "...На несколько недель, если не месяцев."
212140-280 = "...Недопустимо."
212140-281 = "На войне время — наше главное преимущество."
212140-282 = ""
212140-286 = ""
212140-287 = "Согласна."
212140-288 = "Но, похоже, наш план молниеносно захватить основные цели до вмешательства Генерального студенческого совета больше неосуществим."
212140-289 = "Более того, остаётся ещё несколько неопределённых факторов. Чем дольше мы медлим, тем хуже наше положение."
212140-290 = "Мы также ограничиваем социальные сети, но отдельные публикации всё же просачиваются. Мы отслеживаем и удаляем их, однако..."
212140-291 = ""
212140-293 = ""
212140-294 = "..."
212140-296 = "Если наступление и захват окажутся слишком сложными, придётся прибегнуть к другим методам."
212140-297 = ""
212140-299 = ""
212140-300 = ""
212140-301 = "...Каким именно?"
212140-302 = ""
212140-304 = ""
212140-306 = ""
212140-307 = ""
212140-308 = "Уничтожить всё и установить новый порядок на выжженной земле."
212140-309 = "«Уничтожить»... Вы имеете в виду весь Кивотос? Но как?"
212140-310 = "Кихехе, это проще простого."
212140-311 = "Нам достаточно нескольких десятков боеголовок с химическим оружием... Каждая способна полностью уничтожить целый район центра D.U..."
212140-312 = ""
212140-314 = ""
212140-315 = "То есть вы хотите сказать...?"
212140-316 = "Именно. Мы возродим одно из самых стратегически важных орудий Императора-тирана."
212140-317 = "А что со сроками?"
212140-318 = "Кихехе, дело быстрое и простое. Я помню все подробности."
212140-319 = "...Впечатляет."
212140-320 = "Мы сами себя ограничивали, рассматривая лишь оккупацию. Но раз обстоятельства изменились, должны измениться и методы."
212140-321 = "Горстка непокорных смутьянов не помешает нашему благородному походу."
212140-322 = ""
212140-324 = ""
212140-327 = ""
212140-328 = "...В Геенне действительно таится такой потенциал. Не знала, что мы способны создавать подобное."
212140-329 = "Кихе. Мы просто не раскрывали эти возможности и не пользовались ими."
212140-330 = "Но теперь, когда мы поняли бессмысленность «границы», которую прежде оберегали, такие ограничения совершенно не нужны."
212140-331 = "И уверяю вас, Геенна сплочённее любой другой академии. Мы едины."
212140-332 = "...Именно. Наша славная Геенна превосходит всех остальных."
212140-333 = "Мы начнём войну, как только оружие будет готово. Всем сохранять бдительность и ждать приказов."
212140-335 = "Понятно. Ако, доложи мне об изменениях первоначального плана наступления."
212140-336 = "Да, глава Префектуры. Доложу через час."
212140-338 = ""
212140-339 = "..."
212140-341 = "Следующий эпизод;Разработка операции"
