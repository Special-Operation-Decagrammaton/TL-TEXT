[translation]
11234030-1 = "Командная работа;Лучшая программа 1"
11234030-2 = "Хм..."
11234030-3 = "Хм..."
11234030-4 = "...Казуса? Что такое? Выглядишь так, будто тебя что-то беспокоит."
11234030-5 = "Н-Ну, эм... Ничего серьёзного..."
11234030-6 = "Хотя мы все стараемся, будто чего-то всё равно не хватает... Не могу избавиться от ощущения, что мы плохо действуем вместе."
11234030-7 = "Да? А мне казалось, у нас всё неплохо. Думаешь, мы недостаточно хороши?"
11234030-8 = "Раз уж ты сказала... по отдельности мы все действительно стали играть лучше..."
11234030-9 = "Но если мы не сможем стоять вместе, то все развалимся. Это простая и вечная истина."
11234030-10 = "Нам нужно улучшить командную работу. Пора заняться групповой тренировкой."
11234030-11 = "Эм, мы и так уже тренируемся группой."
11234030-12 = "Я как раз хотела предложить просто чаще играть вместе..."
11234030-13 = "Тс-с!"
11234030-14 = "С таким слабым духом вы не переживёте Всемирный турнир исполнительских искусств!!"
11234030-15 = "С каких пор это вообще мировой турнир...?"
11234030-16 = "Мы должны понимать друг друга по одному взгляду... нет, даже не глядя друг на друга. Мы должны вместе вложить самих себя в одну-единственную ноту!"
11234030-17 = "Вложить себя в одну ноту... Да. Вот какая тренировка нам нужна!"
11234030-19 = "...Одна нота...?"
11234030-20 = "Вложить себя... вместе...?"
11234030-22 = "Хе-хе. К счастью, я подготовилась к такому случаю. Сейчас нам нужно..."
11234030-23 = "...упражнение на сплочение команды!"
11234030-24 = "Что ты имеешь в виду?"
11234030-25 = "Наверняка опять что-то странное. Нам уже пора к такому привыкнуть."
11234030-26 = "Хи-хи... Оставьте всё мне."
11234030-27 = "Я придумаю величайшее упражнение из всех возможных!"
