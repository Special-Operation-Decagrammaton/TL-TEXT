[translation]
10033080-1 = "Эпизод 8;В самом разгаре фестиваля"
10033080-2 = ""
10033080-3 = "Ритуал Древа божеств!"
10033080-4 = "Два в одном: и ритуал, и фестиваль! Это ежегодное событие проходит под этой сакурой — самой настоящей иконой Хяккияко!"
10033080-5 = "Самое крутое в Древе божеств то, что его видно из любой точки Хяккияко. Наверняка вы уже заметили!"
10033080-7 = "*зевает* Мы проводим ритуал для дерева... чтобы молиться о благословении..."
10033080-8 = "У этого ритуала долгая история. Он появился ещё во времена, когда жители Хяккияко молились дереву, надеясь на богатый урожай до конца года!"
10033080-9 = "Обычно во время фестиваля мастера со всего района строят и украшают роскошные паланкины, которые затем отправляются на площадь Древа божеств."
10033080-10 = "Во время долгого путешествия по Хяккияко паланкины несут удачу и энергию нашим многочисленным жителям!"
10033080-11 = "Надежды всех наших людей доносятся сюда и разделяются во время ритуала!"
10033080-12 = "Из-за коротких сроков, к сожалению, вы не увидите раннюю часть фестиваля, когда эти паланкины движутся к площади."
10033080-13 = "Вместо этого вы сможете полюбоваться этим величественным паланкином, представляющим все остальные, которые сегодня не смогли присутствовать!"
10033080-14 = ""
10033080-16 = ""
10033080-18 = "Прямо здесь, на площади Древа божеств, вы увидите, как мы совершаем подношения во время ритуала."
10033080-19 = "А в качестве особого сюрприза роль мико в ритуале исполнит очень особенная гостья!"
10033080-20 = ""
10033080-22 = ""
10033080-23 = "Именно! Знаменитый идол самой Хяккияко!"
10033080-24 = "Это Чисэ!"
10033080-25 = "Мяу?"
10033080-29 = "Ого, это тот паланкин, о котором она говорила?"
10033080-30 = "Он даже больше, чем я представляла. Туда, наверное, человек двадцать влезет."
10033080-31 = "Я слышала, кто-то говорил, что во время путешествия люди действительно забираются на него, играют на инструментах и всякое такое. Я тоже хочу."
10033080-32 = "Блин, я тоже. Правда, пока он стоит пустой, будет не так весело."
10033080-33 = ""
10033080-35 = ""
10033080-36 = "(Сегодня я исправлю всё, что произошло до сих пор.)"
10033080-37 = "(Ритуал Древа божеств должен стать главным событием всей экскурсии.)"
10033080-38 = "(Если только всё пройдёт хорошо, я смогу сохранить репутацию нашего клуба и оправдать ожидания всех.)"
10033080-39 = "(К счастью, хотя бы вступление к ритуалу прошло гладко.)"
10033080-40 = "(И вдобавок я уже привезла и установила фейерверки, которые мы запустим в конце фестиваля! Так мы уже опережаем график.)"
10033080-41 = ""
10033080-43 = ""
10033080-47 = "Люди в белой одежде окружают паланкин!"
10033080-49 = "Смотри-смотри. Я даже не знала, что крыша может вот так открываться. Ого."
10033080-50 = "Ага, я читала, что там наверху есть маленькая деревянная коробка, в которой хранится вся эта удача, о которой говорила экскурсовод."
10033080-51 = "Если коробка откроется до того, как её коснётся мико, тебя проклянут! Ну, думаю, просто весь оставшийся год будет невезение или что-то такое."
10033080-52 = "Жутко! А какое именно невезение?"
10033080-53 = "Хм, не знаю. Может, каждый раз, вставая с кровати, будешь биться мизинцем, или случайно наступишь на особенно маленькую пластиковую игрушку, или каждый раз на улице будешь получать тепловой удар?"
10033080-54 = "Не знала, что в Хяккияко всё так! Звучит как кошмар."
10033080-55 = "Тогда мы должны помочь им очистить плохую энергию! Огнём! Держи зажигательные гранаты!"
10033080-56 = "Почему ты даёшь их мне?!"
10033080-58 = ""
10033080-59 = "Как вы видите, во время перемещения коробки к ней нельзя прикасаться."
10033080-60 = "Мы осторожно накрываем её чистой белой тканью, а затем переносим в этой бамбуковой переноске."
10033080-61 = "Чтобы хорошая энергия не утекла, во время переноса мы зачаровываем её звуками флейты."
10033080-62 = ""
10033080-64 = ""
10033080-66 = "Я немного отвлеклась, но нам надо что-то петь? Эй, ты знаешь школьный гимн?"
10033080-67 = "Конечно нет. А ты?!"
10033080-68 = "Разумеется нет! Погоди... А он у нас вообще есть?"
10033080-69 = "Чувак, ты меня напугала. Я думала, только я одна его не знаю."
10033080-71 = "Да ладно. Готова спорить, спроси кого угодно на этой экскурсии — никто не знает."
10033080-73 = ""
10033080-74 = "Примерно сейчас..."
10033080-75 = ""
10033080-77 = ""
10033080-78 = ""
10033080-82 = "Ого! Откуда взялись все эти лепестки?!"
10033080-83 = "Смотри-смотри. Они падают с Древа божеств!"
10033080-84 = ""
10033080-86 = ""
10033080-87 = "Да, мэм! Согласно легендам, когда Хяккияко посещает удача, с Древа божеств падают лепестки словно розовый дождь!"
10033080-88 = "Сегодня нам, должно быть, невероятно везёт! Лепестки начали падать как раз тогда, когда сундук завершил путь к площади!"
10033080-90 = "Это точно не студенты разбрасывают их с крыш..."
10033080-92 = ""
10033080-93 = ""
10033080-94 = "И наконец — звезда этого часа! Чисэ!"
10033080-95 = ""
10033080-97 = "Я выбрала дорогу, которой ходят реже, преодолела все повороты и прибыла."
10033080-98 = ""
10033080-100 = ""
10033080-101 = "Наша мико, Чисэ, направляется к сцене для проведения ритуала."
10033080-102 = "Неудача, прочь, ведь удача пришла. Держись крепче, изо всех сил."
10033080-103 = "Она читает стих подношения! Это песня наших молитв, которую мико произносит, чтобы прогнать неудачу и призвать счастье!"
10033080-104 = "Цветок расцветает, пусть ветер играет. Поднимайся, поднимайся, поднимайся на холм."
10033080-105 = ""
10033080-107 = ""
10033080-108 = "Когда мико поднимается на вершину сцены, поверх алтаря кладут большой лист бумаги. Как она делает сейчас!"
10033080-109 = ""
10033080-111 = ""
10033080-113 = "Что у неё в руке? Похоже на... кусок дерева с приклеенной бумагой."
10033080-114 = "Это ритуальный предмет под названием гохэй. Он очищает сундук и прогоняет плохую энергию!"
10033080-115 = "Сейчас она будет размахивать гохэем над коробкой, а затем исполнит танец Древа божеств, чтобы наполнить её доброй—"
10033080-116 = "Стоять! Этот фарс вместо ритуала заканчивается прямо сейчас!"
10033080-117 = "?!"
10033080-118 = "А-а?!"
10033080-119 = "Ч-что происходит?"
10033080-120 = "...?!"
