[translation]
10023100-1 = "Эпизод 10;Слушайте внимательно. Это важно."
10023100-2 = ""
10023100-3 = "...Ты с самого начала всё это планировала."
10023100-4 = "Что ж, скажем так: у нас разные системы ценностей."
10023100-5 = "Для вас это была ваша миссия, а для меня — следование моим стандартам красоты, например защита Короны Короля Часов."
10023100-6 = "Ты всегда такая?"
10023100-7 = "Что может подразумевать кролик под «такая»? Хм-м..."
10023100-8 = "Может, «это» означает мою уверенность, что цель всегда оправдывает средства? О! Или полное отсутствие угрызений совести, когда я предаю союзников при первой возможности, если мне это выгодно?"
10023100-9 = "Или готовая отказаться от всего ради своей веры?"
10023100-10 = "..."
10023100-11 = "Вот вам и ответ."
10023100-12 = "Надеюсь, я удовлетворила ваше любопытство."
10023100-14 = "Нет, я не понимаю."
10023100-15 = "Как мило. Я и не ожидала, что поймёте."
10023100-16 = "Было несколько людей, которые думали, что смогут понять, но все они уходили, повторяя один и тот же текст."
10023100-17 = "«Я не понимаю... Я никогда тебя не прощу! Монстр!»"
10023100-18 = "Уверена, даже отважный Сенсей в конце концов придёт к тому же выводу."
10023100-19 = "Уверен, эту проблему можно решить и другими способами."
10023100-20 = "Ладно, хорошо. Тогда ответьте мне вот на что. Допустим, я не заберу корону. Что с ней будет?"
10023100-21 = "Пока Мэйтаро не арестуют и не признают виновным, она будет пылиться на складе контрабанды Валькирии."
10023100-22 = "Понятно. Значит, произведение искусства, которым должны наслаждаться все... запрут и забудут о нём?"
10023100-24 = "...Разве потом её не выставят в каком-нибудь музее для публики?"
10023100-26 = "Вы правы. Ею будут распоряжаться и выставлять те, кто считает, что ценность искусства определяется ценником."
10023100-27 = "Хватит говорить намёками, Благородная Воровка. К чему ты клонишь?"
10023100-28 = "Я говорю, что ни один вариант не верен. Ваша сторона, моя, их — правильного ответа нет ни у кого."
10023100-29 = ""
10023100-31 = ""
10023100-33 = ""
10023100-34 = ""
10023100-35 = ""
10023100-37 = "Я не согласна!"
10023100-38 = "Нашему отряду нужна Корона, иначе мы не сможем завершить задание."
10023100-40 = "Хи-хи. Мне искренне жаль, но отдать её я не могу."
10023100-41 = "Меня интересует только искусство. Чтобы оно было выставлено там, где его смогут ценить так, как оно того заслуживает."
10023100-42 = "Полагаю, договориться нам не удалось?"
10023100-43 = "Наше совместное приключение было недолгим, но очень весёлым."
10023100-44 = "Я до последнего надеялась, что всё не закончится таким образом."
10023100-45 = "Должна сказать то же самое."
10023100-46 = "Однако долгие прощания никогда не были в моём стиле."
10023100-47 = "Чисто, эффектно и красиво. Такой я была всегда и такой останусь."
