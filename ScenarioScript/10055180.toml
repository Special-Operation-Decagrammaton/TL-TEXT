[translation]
10055180-1 = "Гордое триединство вечернего моря"
10055180-2 = ""
10055180-3 = "Все, я осознала нечто чрезвычайно важное."
10055180-4 = "Ну разумеется. ...Смотри под ноги, Ибуки. Уже темно."
10055180-5 = "Хорошо! И ты осторожнее, Ироха!"
10055180-6 = ""
10055180-8 = ""
10055180-10 = "С самого прибытия на остров я заметила определённую закономерность в наших противниках!"
10055180-11 = "...Почему кому-то вообще нравится пляж по ночам? Здесь так страшно... Чиаки, подожди! Не уходи далеко!"
10055180-12 = "А, прости! Просто хотела посмотреть на палатки с едой!"
10055180-13 = ""
10055180-15 = ""
10055180-17 = "Вам наверняка любопытно. Небось умираете от любопытства."
10055180-18 = "...Разве нет?!"
10055180-19 = "[s1] «Д-да!»\n[s2] «М-мне очень интересно, да!»"
10055180-22 = "Ки-хе-хе! Рада, что спросили!"
10055180-23 = "Ответ вот в чём! Наши соперники появляются в определённом порядке!"
10055180-24 = "Вспомните. Кого мы встретили первыми?"
10055180-25 = "...Абидос, разве нет?"
10055180-26 = "Верно. Маленькую, почти забытую академию. А кто был после них...?"
10055180-27 = "Полицейская школа «Валькирия». И та злая начальница. Чего она такая раздражённая была...?"
10055180-28 = "Хм. Пусть они и цепные псы Генерального студсовета, но по сравнению с Абидосом гораздо влиятельнее. А совсем недавно мы встретили..."
10055180-29 = "Объединённую академию Хяккияко. Понимаю, к чему ты ведёшь, Макото."
10055180-30 = "Как всегда проницательна, Сацуки! Именно! Может, Хяккияко и не сравнится с нашей Геенной, но это тоже довольно крупная академия."
10055180-31 = "Иными словами, каждый следующий противник был сильнее предыдущего! Предсказываю, что следующий соперник превзойдёт Хяккияко и, возможно, сравнится по силе с нами."
10055180-32 = "И вскоре мы встретим «ту самую академию»... нашего величайшего соперника!"
10055180-33 = "Соперника?"
10055180-34 = "О-хо-хо-хо! Кажется, вы одержали немало побед подряд!"
10055180-35 = "Но боюсь, на этом ваша удача закончится."
10055180-36 = ""
10055180-37 = "Как я и думала! Вот вы где."
10055180-38 = "Какое неправдоподобно удобное совпадение..."
10055180-39 = ""
10055180-41 = ""
10055180-42 = ""
10055180-43 = "Ходят слухи, будто одна дворняжка из Геенны сомнительного происхождения подняла переполох. И всё это с каким-то раком-отшельником."
10055180-44 = ""
10055180-45 = "Гордое триединство вечернего моря"
10055180-48 = ""
10055180-50 = "«Крабовые бои» — благородное, достойное занятие. Я прослежу, чтобы вы усвоили этот урок."
10055180-51 = "Нгх! Как ты смеешь так со мной разговаривать?"
10055180-52 = "О, вы забываетесь. Неужели искренне верите, что какой-то жалкий рак-отшельник победит лучших ракообразных Тринити?"
10055180-53 = "Какая смехотворная фантазия! О-хо-хо-хо!"
10055180-54 = "Эй, Наги, что на тебя нашло?"
10055180-55 = "Ты перенервничала? Или съела несвежий бисквитный рулет?"
10055180-56 = ""
10055180-58 = ""
10055180-59 = "..."
10055180-60 = ""
10055180-62 = ""
10055180-63 = "...!"
10055180-64 = "...Не говори так, Мика."
10055180-65 = "А?"
10055180-66 = "Оглянись вокруг."
10055180-67 = "Что вы имеете в виду...?"
10055180-68 = "То есть..."
10055180-69 = "...что от этой вонючей дворняжки у меня чай становится невкусным! Прогоним её!"
10055180-70 = "Сэя?!"
10055180-71 = "О-хо-хо-хо!"
10055180-72 = "Наги, и ты тоже?!"
10055180-73 = ""
10055180-75 = ""
10055180-76 = "...Ну, раз уж сегодня такой вечер..."
10055180-77 = "Пора ткнуть эту шавку носом в то, что она натворила!"
10055180-78 = "И куда делись ваши благородные манеры, Чайная вечеринка?!"
10055180-79 = "Трое против одной? Какое малодушие!"
10055180-80 = "«Трое против одной». Хмф..."
10055180-81 = "Что смешного?"
10055180-82 = "Где же тут благородство?"
10055180-83 = "В этом состязании побеждает самый достойный участник."
10055180-84 = "Позвольте представить вам лучшего бойца Тринити!"
10055180-85 = ""
10055180-87 = ""
10055180-88 = ""
10055180-90 = ""
10055180-91 = "А...? Ч-что происходит? Где я?!"
10055180-92 = "Боже мой, это же..."
10055180-93 = ""
10055180-95 = ""
10055180-96 = "...Кто это?"
10055180-97 = "Хифуми."
10055180-98 = "...Кто такая Хифуми?"
10055180-99 = "Самая добрая душа Кивотоса! Удивительно, насколько некоторые невежественны..."
10055180-100 = "Итак, Хифуми, мы все на тебя рассчитываем!"
10055180-102 = "Что?! Нагиса?! Что происходит?! П-постой...!"
10055180-103 = "ЧТО ПРОИСХОДИ-И-ИТ?!"
