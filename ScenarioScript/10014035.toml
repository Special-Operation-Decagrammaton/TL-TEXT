[translation]
10014035-2 = "Тем же вечером."
10014035-3 = "О, вы уже здесь. Простите, что заставила ждать."
10014035-4 = "[s1] «Я недолго ждал.»\n[s2] «Я наслаждался свежим воздухом. Всё нормально.»"
10014035-5 = "Это мило с вашей стороны..."
10014035-6 = "Это мило с вашей стороны..."
10014035-7 = ""
10014035-10 = ""
10014035-11 = "Но вы всегда так говорите, поэтому я не знаю, правда ли имеете это в виду."
10014035-12 = "Ха-ха. Не переживайте, я шучу. Правда ценю это."
10014035-13 = "Так зачем вы хотели встретиться? Есть новости?"
10014035-14 = "...Рейса?"
10014035-15 = "Что случилось? Она что-то сделала с вами?!"
10014035-16 = "Что?"
10014035-17 = "Я... разговаривала с ней? С чего такой вопрос?"
10014035-18 = "И как я вообще должна это сделать? Она каждый раз нападает, как только видит меня."
10014035-19 = "Да и не хочу. Я вижу, как она радуется всякий раз, когда бросает мне вызов."
10014035-20 = "Это напоминает старые времена... и раздражает."
10014035-21 = "Почему? Думаете, стоит?"
10014035-22 = "А?"
10014035-23 = "Расскажете, когда узнаете больше? Расскажите сейчас."
10014035-24 = "Что?!"
10014035-25 = "Вы ходили к ней?"
10014035-26 = "Она правда с вами разговаривала? Прям целый разговор?"
10014035-27 = "Невероятно... Что она сказала?"
10014035-28 = "[s3] «...Да. То да сё.» \n[s4] Рассказать ей всё, что услышал."
10014035-29 = ""
10014035-30 = ""
10014035-32 = ""
10014035-33 = "..."
10014035-34 = "......?!"
10014035-36 = "........."
10014035-37 = "............"
10014035-38 = "..............."
10014035-39 = "[s5] «...Эм, Казуса, прошло уже тридцать минут.»\n[s6] «Х-Хочешь об этом поговорить?»"
10014035-40 = "... *выдох* ... *вдох* ... *выдох* ..."
10014035-41 = "... *выдох* ... *вдох* ... *выдох* ..."
10014035-42 = "Простите, Сенсей. Мне просто нужно было немного остыть."
10014035-43 = "Она правда... всё это сказала? Именно этими словами?"
10014035-44 = "Мир тьмы...? Аура зверя?"
10014035-45 = ""
10014035-47 = ""
10014035-48 = "Кат Палуг...?"
10014035-49 = "[s7] «Что такое? По-моему, звучит круто.»\n[s8] «Ты смущена?»"
10014035-50 = "Вы серьёзно? Вы меня дразните?!"
10014035-51 = "Конечно!"
10014035-52 = "Я знала, что она сумасшедшая, но не могу поверить, что она правда всё это сказала!"
10014035-53 = "Когда она уже прекратит?! Она постоянно говорит обо мне тупые и позорные вещи!"
10014035-54 = "Кто-нибудь ещё это слышал?"
10014035-55 = "Пожалуйста, скажите, что никто больше не слышал, Сенсей. Ради моего рассудка."
10014035-56 = ""
10014035-58 = ""
10014035-59 = "О... Правда?"
10014035-60 = "Члены Отряда линчевателей... и какие-то случайные хулиганки, валявшиеся на земле...? То есть много людей?"
10014035-61 = "...О, даже участницы клуба?"
10014035-62 = "[s9] «Прости за это...»\n[s10] «Тут виноват я.»"
10014035-63 = "...Хе..."
10014035-64 = "...Хе..."
10014035-65 = "Хи-хи-хи-хи... Было приятно познакомиться, Сенсей. Пора уходить в подполье."
10014035-66 = "[s11] «Я никогда не видел у тебя такого лица...»\n[s12] «Казуса сломалась...»"
10014035-67 = "...Всё кончено, да?"
10014035-68 = "...Всё кончено, да?"
10014035-69 = "Я не смогу ходить по школьному коридору как «Кат Палуг». Это слишком унизительно."
10014035-70 = "Новая жизнь, которую я так тяжело строила, разрушена. Теперь все будут знать меня как Кат Палуг, хулиганку!"
10014035-71 = "А?"
10014035-72 = "Почему мне так стыдно за прошлое? Думаете, я по-своему была крутой?"
10014035-73 = "...Сенсей."
10014035-74 = "Рейса и правда забралась вам в голову, да?"
10014035-75 = "Пусть она навешивает какие угодно пафосные ярлыки, но я была просто хулиганкой. Вот и всё."
10014035-76 = "В том, что ребёнок ввязывается в драки, нет ничего особенного или крутого."
10014035-77 = "Я была незрелой и ничего не понимала о мире."
10014035-78 = "...Поэтому мне стыдно."
10014035-79 = "Я уже переросла это, но никак не могу от этого уйти. А в реальной жизни ластика для ошибок нет."
10014035-80 = "И это правда была ошибка, понимаете? Мы думали, что такие крутые, но на деле наше поведение было жалким."
10014035-81 = "Я знаю, вы пытались быть добрым... но фактов это не меняет."
10014035-82 = "Я же говорила. У каждого есть одна-две вещи, которые хочется забыть."
10014035-83 = "[s13] «Дни, которые хочется забыть...»\n[s14] «Ты хочешь стереть эти воспоминания.»"
10014035-84 = "*вздыхает*"
10014035-85 = "*вздыхает*"
10014035-86 = "Ладно, хорошо. Спасибо, что поговорили с Рейсой..."
10014035-87 = "За одну ночь ничего не изменится, но я уверена, что со временем мы сможем убедить её, что я уже не такая."
10014035-88 = "Будет непросто, но... что посеешь, то и пожнёшь, да?"
10014035-89 = ""
10014035-91 = ""
10014035-92 = "Фух."
10014035-93 = "Я просто хочу, чтобы всё это закончилось."
