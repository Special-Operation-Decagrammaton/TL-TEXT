[translation]
34160-1 = "Эпизод 16;Подземный коридор"
34160-2 = "Старый институт филиала Ариуса"
34160-4 = "Сюда."
34160-5 = "[s] «Это самое старое здание, которое я видел в районе Ариуса.»"
34160-6 = "Я н-никогда раньше не была внутри..."
34160-7 = "Логично. Пусть оно и разрушено, это всё ещё исторический объект."
34160-8 = "Странно думать, что первые студенты Ариуса когда-то здесь учились. Интересно, какие у них были занятия..."
34160-9 = "Эти ответы потеряны для истории."
34160-10 = "Идём. Нужно добраться до подземного коридора."
34160-12 = "Подземный коридор Старого института"
34160-13 = "С-Сюда! Кажется, это он!"
34160-14 = "Отличная работа, Хиёри."
34160-15 = "Одну минуту."
34160-16 = ""
34160-18 = ""
34160-19 = "Если проход соединён с базиликой прямой линией... местность будет опасной."
34160-20 = "Я думала о возможности засады. Учитывая, что путь прямой..."
34160-21 = "Нет, я говорю о Мисоно Мике."
34160-22 = "Я пыталась представить, что сделала бы на её месте."
34160-23 = "Сейчас Сенсей — её единственное препятствие. Она не хочет причинять вам вред, но пока вы рядом, она не сможет осуществить месть."
34160-25 = "Это значит..."
34160-26 = ""
34160-28 = ""
34160-29 = "*грохот*"
34160-30 = "Плохо."
34160-31 = "С-С-Сенсей! Нет, обернитесь! Колонна падает!"
34160-32 = "[ns1] «...!»\n[ns2] Увернуться от падающей колонны."
34160-38 = "*бум*"
34160-40 = "Вы в порядке, Сенсей?"
34160-41 = "[s] «Да, едва успел.»"
34160-42 = "С-Слава богу. Знаю, эти руины старые, но она рухнула совершенно внезапно."
34160-43 = ""
34160-45 = ""
34160-46 = "П-Подождите! Где лидер?"
34160-47 = "Лидер? Где вы?"
34160-48 = "Я здесь. По другую сторону колонны."
34160-49 = "Слишком много дыма и обломков. Ты не ранена?"
34160-50 = "Со мной всё нормально. Просто оказалась не на той стороне."
34160-51 = "Я-я сдвину колонну для вас, лидер! Подождите секунду!"
34160-52 = ""
34160-54 = ""
34160-56 = "Ах! Что делать? Я только делаю хуже, когда пытаюсь её сдвинуть! Почему я всегда всё порчу?"
34160-57 = ""
34160-60 = "*кашляет* *кашляет*"
34160-61 = "Плохо. Обойти никак."
34160-62 = "Всё разрушено! Лидер! Вы в порядке?"
34160-63 = "Лидер, слышите? Придётся найти точку посередине и встретиться там."
34160-65 = ""
34160-66 = "Боюсь, это придётся отложить."
34160-67 = ""
34160-70 = "...Я сделала это! Пришлось очень точно контролировать силу, чтобы Сенсея тоже не затянуло!"
34160-71 = ""
34160-73 = ""
34160-74 = ""
34160-75 = "..."
34160-80 = "Ну что, Джомаэ Саори. Я надеялась, что попадёшься именно ты."
34160-82 = "Следующий эпизод;Состязание"
