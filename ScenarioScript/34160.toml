[translation]
34160-1 = "Episódio 16;Corredor Subterrâneo"
34160-2 = "Filial Arius - Prédio Antigo"
34160-4 = "Por aqui."
34160-5 = "[s] \"Então este é o prédio antigo da Filial Arius...\""
34160-6 = "É a primeira vez que entro aqui..."
34160-7 = "Pois é. Mais do que uma ruína... este lugar já está mais para uma relíquia do passado."
34160-8 = "Será que antigamente as alunas de Arius estudavam aqui...?#nO-O que será que elas aprendiam...?"
34160-9 = "Quem sabe... Provavelmente não resta mais ninguém que se lembre disso."
34160-10 = "Vamos nos apressar... O corredor fica no subsolo."
34160-12 = "Prédio Antigo - Corredor Subterrâneo"
34160-13 = "A-Achei! É por aqui!"
34160-14 = "Entendo."
34160-15 = "...Esperem."
34160-19 = "Se, como a Líder disse, esta passagem leva em linha reta até a Basílica... este terreno é perigoso."
34160-20 = "Eu também considerei a possibilidade de uma emboscada. Mas, justamente por ser em linha reta..."
34160-21 = "Não, estou falando da Misono Mika."
34160-22 = "Eu estava pensando... no que eu faria se estivesse no lugar dela."
34160-23 = "Para ela, o maior obstáculo provavelmente é a presença do Sensei.#nEla não quer que ele se machuque, e o comando do Sensei também deve ser um problema para ela."
34160-25 = "Nesse caso, com certeza ela..."
34160-29 = "Bruuuuuuuuuuum..."
34160-30 = "Isso é..."
34160-31 = "C-Cuidado! Sensei, o pilar atrás de você...!!"
34160-32 = "[ns1] \"...!!\"\n[ns2] Correr para a frente desviando do pilar que está caindo."
34160-38 = "BOOOOOOOOM!!!!"
34160-40 = "Urgh... Sensei, você está bem?"
34160-41 = "[s] \"Sim, de algum jeito...\""
34160-42 = "Q-Que alívio... Um pilar desabar assim do nada... O que foi isso...?"
34160-46 = "A-Aah!? E-E a Líder?"
34160-47 = "Líder, onde você está?"
34160-48 = "...Estou aqui. Do outro lado."
34160-49 = "Não consigo ver direito por causa dos escombros. Você se machucou?"
34160-50 = "Não, estou bem."
34160-51 = "E-Espere só um pouquinho, Líder! Vou tentar tirar o pilar do caminho..."
34160-56 = "A-Aah! Ainda não acabou!? Vão cair mais!?"
34160-60 = "...Cof, cof."
34160-61 = "Não adianta... Está completamente bloqueado."
34160-62 = "É-É o nosso fim, não é!? A Líder está bem!?"
34160-63 = "Líder, está me ouvindo? Se o caminho de volta do seu lado não estiver bloqueado, vamos procurar um ponto de encontro."
34160-66 = "...Não, acho que isso vai ser difícil."
34160-70 = "...Que bom! Eu diminuí a força porque achei que o Sensei podia acabar sendo atingido,#nmas mesmo assim eu estava preocupada."
34160-75 = "..."
34160-80 = "Mas enfim, Joumae Saori — que bom que você ficou para trás direitinho assim."
34160-82 = "Próximo;Confronto"
