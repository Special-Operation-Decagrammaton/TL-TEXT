[translation]
10048100-1 = "Эпизод 10;Результаты проверки"
10048100-2 = "Главные ворота Вайлдханта"
10048100-3 = "На следующее утро."
10048100-4 = "Ух ты, сколько народу!"
10048100-5 = "Как и ожидалось от специальной выставки Вероники... Сколько ещё до открытия?"
10048100-6 = "Ты смотрела буклет? Я не знала, что у них есть ЭТА картина!!"
10048100-7 = "О, да. Кажется, я видела её в учебнике..."
10048100-8 = ""
10048100-10 = ""
10048100-11 = "*гул толпы*"
10048100-12 = ""
10048100-14 = ""
10048100-15 = ""
10048100-16 = ""
10048100-17 = "(...Они даже не знают, что такое настоящее искусство, а всё болтают и болтают.)"
10048100-18 = "(Эти дураки не узнают подделку, даже если она будет смотреть им прямо в лицо...)"
10048100-19 = "(...Я помню, как только начинала.)"
10048100-21 = "(Критики, которые осуждали мои оригинальные, наполненные душой работы...)"
10048100-22 = "(...оказались теми же людьми, которых обманула созданная мной подделка. Только тогда они остались довольны..)"
10048100-23 = "(Никто не пытался увидеть картину такой, какая она есть.)"
10048100-24 = "(Все видели лишь стоящую за ней славу, репутацию, ожидания.)"
10048100-25 = "(Им никогда не было дела до истинной сути внутри.)"
10048100-27 = "[log=시민 동물6 의뢰인]Вот почему у них нет права.[/log]"
10048100-31 = "[log=시민 동물6 의뢰인]...Права созерцать истинное великолепие..![/log]"
10048100-33 = ""
10048100-34 = "(Именно поэтому я одну за другой заменю мировые «шедевры» подделками.)"
10048100-35 = "(Истинная эстетика, настоящее искусство обесцениваются пустыми похвалами невежд.)"
10048100-36 = "(...И самое главное, со мной связался Картель свободной торговли.)"
10048100-37 = "(Они сказали, что миссия прошла успешно.)"
10048100-38 = "(...Фуфу, отлично. Это только начало, глупцы!)"
10048100-39 = "(Готовьте свои пустые лица, чтобы с благоговением пялиться на мою грубую подделку!)"
10048100-40 = "(Именно этого вы и заслуживаете...!)"
10048100-41 = ""
10048100-42 = "Наши двери открываются! Пожалуйста, выстройтесь в упорядоченную очередь у этих ворот!"
10048100-43 = "Для вашего удобства заранее приготовьте билеты!"
10048100-44 = "Фуфу... Наконец-то настало время."
10048100-45 = "И вот... началось."
10048100-46 = ""
10048100-48 = ""
10048100-50 = "Зал специальной выставки Вероники"
10048100-51 = "*гул голосов*"
10048100-52 = ""
10048100-54 = ""
10048100-55 = "Что? Это... не так."
10048100-56 = "А...? Почему они выставили две одинаковые картины?"
10048100-58 = "Но... эта ведь знаменитая, да?"
10048100-59 = "Может, это какая-то инсталляция современного искусства?"
10048100-60 = ""
10048100-62 = ""
10048100-63 = ""
10048100-64 = "Что происходит? На что вы, идиоты, ворчите?"
10048100-65 = "Подвиньтесь... Ну же..."
10048100-66 = "На что ты смотришь?"
10048100-67 = "Прошу прощения. Простите. Если можно, я протиснусь и —"
10048100-68 = ""
10048100-70 = ""
10048100-71 = ""
10048100-72 = "Ч-Что...?!"
10048100-73 = ""
10048100-75 = ""
10048100-77 = "Две... почти одинаковые картины выставлены рядом?!"
10048100-78 = "Что происходит...?!"
10048100-80 = "[log]Предыдущей ночью...[/log]"
10048100-82 = "Парк Вайлдханта"
10048100-83 = "...Ты говоришь, что не доверяешь людям, но дело не только в этом."
10048100-84 = "Как и наша клиентка, ты считаешь, что публика не способна отличить настоящее от подделки. Думаешь, у людей нет эстетического чутья."
10048100-85 = "Вот как?"
10048100-86 = "Верно."
10048100-87 = "Тогда... позволь спросить ещё кое-что."
10048100-88 = "Ты когда-нибудь проверяла это убеждение?"
10048100-89 = "Проверяла?"
10048100-90 = "Именно. Я хочу узнать, действительно ли публика настолько невежественна, как ты говоришь."
10048100-91 = "...С эстетической точки зрения это интригует."
10048100-92 = "Что ж. И как ты предлагаешь это проверить?"
10048100-93 = ""
10048100-95 = ""
10048100-97 = "...Просто. Покажем людям обе версии «Любви пурпурного и синего света» — настоящую и поддельную."
10048100-98 = "...!"
10048100-99 = "Сначала посетители растеряются."
10048100-100 = "Но вскоре толпа разделится. Без объяснений и заранее заданных ожиданий каждого человека потянет к одной из картин."
10048100-101 = "Кто-то встанет перед подлинником, а кто-то — перед подделкой..."
10048100-102 = "Но если людям от природы присуще художественное чутьё, в итоге вокруг подлинника соберётся больше людей."
10048100-103 = "А если люди настолько невежественны, как ты говоришь, толпа разделится примерно поровну."
10048100-104 = "...Ах."
10048100-105 = "Если у настоящей картины соберётся больше людей, у тебя не останется причин её красть."
10048100-106 = "...Потому что публика докажет, что достойна её. Разве не такой луч надежды ты искала?"
10048100-107 = "Фуфу, очень умно."
10048100-108 = "Хорошо. Если всё так и выйдет, я прекращу охоту хотя бы за ЭТОЙ картиной."
10048100-109 = "...Но что, если твой эксперимент провалится?"
10048100-110 = "Если окажется, что права я, что ты сделаешь для меня?"
10048100-111 = "..."
10048100-112 = "...Я помогу тебе в следующем деле..."
10048100-113 = "...всеми силами моего Картеля свободной торговли."
10048100-114 = "Миё-миё-миё-миё, это не слишком рискованное пари?!"
10048100-115 = "А что, если люди поведут себя не так, как мы думаем?!"
10048100-116 = "...Я не могу просто стоять и смотреть, как крадут искусство. Мы студенты Вайлдханта. Мы должны за что-то отвечать."
10048100-117 = ""
10048100-119 = ""
10048100-120 = "Отлично. Я согласен."
10048100-121 = "Раз уж это эстетически меня заинтересовало..."
10048100-122 = "Я проберусь внутрь и повешу обе картины. Между прочим, такие вещи нужно делать как следует."
10048100-123 = "...Спасибо."
10048100-124 = "Теперь нам и правда пора расстаться."
10048100-125 = "Надеюсь, в следующий раз мы встретимся в другом качестве, Миё."
10048100-126 = "...И Сенсей."
10048100-127 = "[s] «Пока, госпожа Воровка.»"
10048100-128 = "До встречи, Воришка!!"
10048100-129 = "Фуфу. Уверена, мы ещё встретимся."
10048100-130 = ""
10048100-132 = ""
10048100-133 = ""
10048100-134 = ""
10048100-135 = "Миё! Они собираются перед настоящей!"
10048100-136 = "Мы победили! У нас получилось!"
10048100-137 = "..."
10048100-138 = "К-Какое облегчение."
10048100-139 = ""
10048100-141 = ""
10048100-142 = ""
10048100-143 = "Миё?!"
10048100-144 = "Миё?!"
10048100-145 = ""
10048100-147 = ""
10048100-149 = ""
10048100-150 = "В этой... есть что-то особенное."
10048100-151 = "Картина та же, но в ней будто... больше души?"
10048100-153 = "...Мне эта тоже нравится больше!"
10048100-154 = "Да, и мне!"
10048100-155 = ""
10048100-157 = ""
10048100-159 = "..."
10048100-160 = "(Почему...!)"
10048100-161 = "(Почему все собираются перед настоящей картиной?!)"
10048100-162 = "(Откуда эти невежественные, немытые массы знают...? Как они могли не попасться на мой гениальный обман?!)"
10048100-163 = "(И почему Картель свободной торговли сказал мне, что закончил работу?!)"
10048100-164 = "Здравствуйте."
10048100-165 = ""
10048100-167 = ""
10048100-169 = ""
10048100-170 = "Ч-Что происходит?"
10048100-171 = "Фуфу. Думаю, вы и сами знаете. Это ВАША работа, не так ли?"
10048100-172 = "Ч-что?!"
10048100-173 = "Обсудим это в участке."
10048100-174 = "И учтите, мы не Валькирия. У вас нет права хранить молчание."
10048100-175 = "Н-Нет! Вы всё неправильно поняли."
10048100-176 = "Я невиновна! Это Картель свободной торговли! Это они всё сделали!"
10048100-177 = "Картель свободной торговли...?"
10048100-178 = "Фуфу. Вы, должно быть, ошиблись."
10048100-179 = "...Хм?"
10048100-180 = ""
10048100-182 = ""
10048100-183 = "В Вайлдханте нет такой организации."
10048100-184 = ""
10048100-187 = ""
10048100-188 = ""
10048100-189 = ""
10048100-190 = "Уведите её."
10048100-191 = ""
10048100-193 = ""
10048100-195 = "Нет! Нет! У меня миссия, миссия защищать искусство от невежд! Они жульничали!"
10048100-196 = ""
10048100-198 = ""
10048100-204 = ""
10048100-205 = ""
10048100-208 = ""
10048100-209 = "Значит, этот раунд я проиграла, мои умные младшие."
10048100-210 = "...Но в следующем поединке я уже не буду столь мягкой."
10048100-211 = "Правда ведь, Сенсей?"
10048100-212 = "[s] «...Ты продолжишь быть Воровкой.»"
10048100-213 = "Хм? Воровкой? Понятия не имею, о чём вы, Сенсей."
10048100-214 = "Я всего лишь офицер Префектурного совета..."
10048100-215 = "...которая арестовала фальсификатора и... отрицала существование какого-либо картеля."
10048100-216 = "[s1] «То есть...»\n[s2] «Ты останешься „Мирией“, а я — Сенсеем?»"
10048100-219 = "Похоже на то."
10048100-220 = "Что это? Вы позволите мне продолжать, пока я не «перехожу черту»?"
10048100-221 = "..."
10048100-222 = "Занятно. Если это вы, то, откровенно говоря..."
10048100-223 = "Мне кажется, быть преследуемой вами было бы... восхитительной эстетикой."
10048100-224 = "Каждой воровке нужен хороший детектив, который будет ею одержим."
10048100-225 = "[s] «А? Воровка...?»"
10048100-226 = "А, н-ничего."
10048100-227 = "В любом случае, у меня есть ещё одно дело."
10048100-228 = "[s] «Ещё одно дело...?»"
10048100-229 = "Эм... Н-Ну, мне поручили быть вашим гидом, Сенсей."
10048100-230 = "Х-Хотите, я покажу вам выставку?"
10048100-231 = "[s] «Конечно! Веди!»"
10048100-232 = "Фу, фуфу, хорошо тогда..."
10048100-233 = ""
10048100-235 = ""
10048100-236 = ""
10048100-237 = "Для начала давайте полюбуемся этой работой — «Любовью пурпурного и синего света.»"
