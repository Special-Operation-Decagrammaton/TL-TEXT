[translation]
10009075-1 = "Эпилог;День после Валентина"
10009075-2 = "Офис Шале"
10009075-3 = "Нам удалось вернуть большую часть украденного оборудования, но как минимум половина оказалась сломана."
10009075-4 = "Большинство нарушителей, помогавших Лисе Бедствий, тоже арестовали и отправили в исправительные учреждения."
10009075-5 = "На этом, пожалуй, всё."
10009075-6 = "И ещё..."
10009075-7 = "Студенты из других академий, которые пришли помочь, просили передать вам кое-что."
10009075-9 = ""
10009075-10 = ""
10009075-11 = "Юука сказала: «Прости, что не смогла помочь больше.»"
10009075-13 = ""
10009075-15 = "Сузуми и Чинацу сказали примерно то же самое и предложили проводить регулярные встречи с Шале, чтобы обсуждать эффективные меры против Вакамо."
10009075-17 = ""
10009075-18 = ""
10009075-19 = "Что до Хасуми, она сказала, эм...«Почему вы не предупредили, что шоколадные батончики во время операции были по 1200 калорий каждый?!»"
10009075-20 = "Погоди, Кирино. Это было адресовано нам. До этого у неё было сообщение и для Сенсея."
10009075-21 = "О-о, точно. Простите. Она сказала: «Пожалуйста, дайте знать, если вам снова понадобится моя помощь.»"
10009075-23 = "[ns] «А, хорошо. Надо будет потом всех их поблагодарить.»"
10009075-24 = "*вздыхает* Слава богу, всё закончилось. Ну и суматошный выдался День святого Валентина."
10009075-25 = "Мои оценки тоже сильно пострадали."
10009075-26 = "А Лиса Бедствий тем временем всё ещё на свободе.#nПолучается, всё было зря!"
10009075-27 = "Должно быть, она всё это время просто играла с нами.#nНе зря она одна из Семи Заключённых."
10009075-28 = "Гах! Как подумаю об этом, так злюсь!"
10009075-29 = "[s] «Как по мне, вы обе неплохо справились...»"
10009075-30 = "Так или иначе, на этом наш отчёт об инциденте в День святого Валентина завершён."
10009075-31 = "Если что-то ещё произойдёт, мы вам позвоним."
10009075-32 = "До встречи, Сенсей. Как-нибудь сходим за пончиками."
10009075-33 = ""
10009075-35 = ""
10009075-38 = "[ns] «Привет.»"
10009075-39 = ""
10009075-40 = "Здравствуйте, Сенсей."
10009075-41 = "Прошу прощения, что не позвонила раньше."
10009075-42 = "Есть кое-что, что я хотела обсудить."
10009075-43 = "Простите, что вчера мы не продолжили патруль. Мне не следовало позволять той преступнице обмануть себя и оставлять вас одного."
10009075-44 = "Мой долг — любой ценой защищать мёртвых и..."
10009075-45 = "[s] «Мёртвых?»"
10009075-46 = "Прошу прощения. Я имела в виду раненых и уязвимых. Хотя из-за моего неверного решения вы действительно могли стать трупом. Приношу искренние извинения."
10009075-47 = "[s1] «Всё нормально. Мы оба растерялись.»\n[s2] «Не переживай об этом, Сэна.»"
10009075-48 = ""
10009075-49 = ""
10009075-51 = ""
10009075-52 = "Вы хотите сказать, что мне стоит смотреть вперёд, а не зацикливаться на ошибках?"
10009075-53 = "Взрослая мудрость, значит. Я приму ваши слова близко к сердцу."
10009075-54 = "[s] «Я вообще-то не говорил ничего настолько глубокого.»"
10009075-55 = "И всё же..."
10009075-56 = "Мне пора идти."
10009075-57 = "Буду ждать следующей возможности поработать вместе."
10009075-58 = ""
10009075-60 = ""
10009075-62 = "Закончив разговор, я решил немного расслабиться и просмотреть документы об ущербе за вчерашний день."
10009075-66 = "[ns] «Входите! Открыто!»"
10009075-69 = ""
10009075-70 = "Снимаю 40 баллов с вашей оценки безопасности."
10009075-71 = "Вы оставляете дверь незапертой и приглашаете людей войти, даже не зная, кто по другую сторону? Сколько раз мне повторять, что к безопасности нужно относиться серьёзнее?"
10009075-72 = "[s] «Я тебя впустил, и ВОТ как ты со мной обращаешься?!»"
10009075-73 = ""
10009075-75 = ""
10009075-76 = ""
10009075-77 = "И это ещё не всё: я вижу несколько слепых зон в системе безопасности Шале."
10009075-78 = "Похоже, замок на главном входе сломан. Неудивительно, что вы его не запираете — вы просто не можете."
10009075-79 = "Что с ним случилось?"
10009075-80 = "[s] «Я-я не знаю. Износ?»"
10009075-81 = "Вы советник этого клуба. Разве не стоит относиться к таким вещам серьёзнее?"
10009075-82 = "*вздыхает* Одно дело, если бы проблема была только программной.#nНо с ремонтом железа я мало что могу сделать."
10009075-83 = "Стоит отправить запрос Инженерному клубу, чтобы они пришли и посмотрели."
10009075-84 = "Правда, они наверняка добавят двери функции, которые ей вообще не нужны... но это лучше, чем оставлять её сломанной, да и доверять им можно."
10009075-85 = "[s] «О, не знал, что вы друзья.»"
10009075-86 = "Я бы не заходила так далеко..."
10009075-87 = "В любом случае, я пришла извиниться за вчерашнее."
10009075-88 = "[s] «За что? Ты ничего плохого не сделала.»"
10009075-89 = "Глупости. Именно я отвечала за решения по безопасности фестиваля."
10009075-90 = "Я беру на себя ответственность за то, что не заметила уязвимости, которыми воспользовались, раньше."
10009075-91 = "Простите. В следующий раз я буду внимательнее, чтобы такое не повторилось."
10009075-92 = "Иногда, чтобы стать сильнее, нужно обнаружить свои слабости — и в безопасности, и в жизни."
10009075-93 = "Это всё, что я хотела сказать. Тогда я пойду."
10009075-94 = "Я ещё зайду к вам, когда буду готова провести очередную плановую проверку."
10009075-95 = "[s] «Хорошо. До встречи.»"
10009075-96 = "Ага. До встречи."
10009075-97 = ""
10009075-99 = ""
10009075-100 = "К счастью, последствия инцидента в День святого Валентина устранялись без проблем благодаря усердной работе моих студентов."
10009075-101 = ""
10009075-104 = "[ns] «(Хм. Мои студенты...)»"
10009075-107 = "[s] «Ч-что за...?!»"
10009075-109 = ""
10009075-110 = "[ns] «В-Вакамо?! Что ТЫ здесь делаешь?!»"
10009075-111 = "Хи-хи-хи! ♥"
10009075-112 = "Я выполняю то, что сказала вчера!"
10009075-113 = "Дверь была открыта, поэтому я решила зайти сама. Видишь?#nВот я и пришла увидеться с тобой снова!"
10009075-114 = "[s] «Может, Чихиро была права насчёт двери...»"
10009075-116 = "С тех пор как я прибыл в Кивотос, я встретил самых разных студентов.#nИ Вакамо, без сомнения, самая настойчивая из них."
10009075-117 = "Похоже, мне просто придётся привыкнуть к её присутствию, потому что, кажется, она ещё очень и очень долго никуда не денется."
10009075-118 = "Счастливый ♥ Валентинов патруль Шале"
