[translation]
10046200-2 = ""
10046200-3 = "Ах..."
10046200-4 = "Ах."
10046200-5 = "..."
10046200-6 = "..."
10046200-7 = "Эм, здравствуйте?"
10046200-8 = "Я похожа на человека, которому сейчас хочется общаться?!"
10046200-9 = "Хаха... Пожалуй, нет."
10046200-10 = "Ты из Префектской команды Геенны, верно? Мне просто немного интересно, зачем ты здесь."
10046200-11 = "Хотя если ты пришла как отдыхающая..."
10046200-12 = "Нет!"
10046200-13 = "А, хорошо..."
10046200-14 = "..."
10046200-15 = "Угх, как же это бесит! Почему ты ведёшь себя так неловко?"
10046200-16 = "Ну, мы с тобой познакомились не при самых приятных обстоятельствах..."
10046200-17 = "Наверное, это моя вина, хаха..."
10046200-18 = "Ой, да пожалуйста! Просто извинись и закончим с этим. Я не могу смотреть, как ты мнёшься!"
10046200-19 = "Если мы собираемся работать вместе, перестань шаркать ногами и постоянно оглядываться!"
10046200-20 = "Да, ты права... Работать вместе..."
10046200-21 = ""
10046200-23 = ""
10046200-24 = "Погоди? Что?"
10046200-25 = "Ах."
10046200-26 = "Наши студенты вам мешали, да? Кружок горячих источников, Общество гурманов..."
10046200-27 = "А, да, ну... наверное?"
10046200-28 = "Так что в знак доброй воли я хочу тебе помочь."
10046200-29 = "Правда?!"
10046200-30 = "Ага, если ты не против!"
10046200-31 = "Если честно, Префектской команде стоило с самого начала разбираться с этим."
10046200-32 = "...Так что простите. Нам следовало лучше следить за своими студентами."
10046200-33 = ""
10046200-35 = ""
10046200-36 = "Хаха... Ничего себе..."
10046200-37 = "Вот она, фирменная прямота Геенны."
10046200-38 = "...И это комплимент!"
10046200-39 = "Да? Вообще-то я завидую Тринити. Здесь люди вроде умеют себя вести, а ваша форма такая ми— А, неважно!"
10046200-40 = "...Хаха!"
10046200-41 = "Что? Что смешного?"
10046200-42 = "Ой, ничего. Просто поняла, что у нас много общего."
10046200-43 = "И что здесь смешного...?"
10046200-44 = "В любом случае, похоже, ты принимаешь мою помощь."
10046200-45 = "Тогда вперёд!"
