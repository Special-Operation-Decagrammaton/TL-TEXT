[translation]
10027010-1 = "Эпизод 1;Объявление забастовки"
10027010-4 = "[ns1] «Ух! Эта работа вообще когда-нибудь закончится?»\n[ns2] «Сколько бы я ни делала, её всегда становится больше.»\n[ns3] «Просто замечательно!!»"
10027010-8 = ""
10027010-13 = ""
10027010-14 = "Эм... Сенсей? Ух ты, вы совсем плохо выглядите."
10027010-15 = "Вы явно сегодня очень заняты... Я-Я могу позвонить в другой раз..."
10027010-16 = "[s] «Мэру, что случилось? Какая-то проблема?!»"
10027010-17 = "Н-Не надо поднимать шум! То, что я смущаюсь, ещё не значит, что есть проблема."
10027010-18 = "То есть серьёзно. За кого вы меня принимаете? Неужели я настолько, настолько..."
10027010-19 = "Ой, кого я обманываю? Вы правы. Кое-что есть..."
10027010-20 = "Раньше я об этом особо не думала, но, пожалуй, мне действительно не помешал бы совет."
10027010-21 = "Но вы выглядите занятым, и я не хочу вам мешать, Сенсей. Такое чувство, что вы вот-вот отключитесь."
10027010-23 = "[ns] «Я сейчас буду! Просто подожди немного!»"
10027010-26 = "Ч-Что? Сенсей? Сенсей?!"
10027010-28 = ""
10027010-30 = "Библиотека Красной Зимы"
10027010-31 = ""
10027010-32 = ""
10027010-33 = "Вы так быстро отреагировали, Сенсей."
10027010-34 = "[s] «Что сказать? Я прокрастинирую.»"
10027010-35 = "...Вы же понимаете, что в итоге придётся не спать всю ночь, чтобы всё доделать."
10027010-36 = "Но, полагаю, такова человеческая природа. Мы готовы на всё, лишь бы как можно дольше оттягивать неизбежное."
10027010-37 = "Понимаю. Ты знаешь, что дедлайн приближается, но всё равно просто хочется развлекаться..."
10027010-38 = "Хех. Звучит так, будто я в чём-то признаюсь."
10027010-39 = "[s] «Разве нет? Ты говорила очень серьёзно.»"
10027010-40 = "Разве?"
10027010-41 = "Я немного на нервах, но... Это было настолько заметно?"
10027010-42 = "[s] «Немного. И я заметил, что Момидзи с тобой нет.»"
10027010-43 = "Ах..."
10027010-44 = "..."
10027010-45 = "Да... Поэтому я и позвала вас, Сенсей."
10027010-46 = "Эм..."
10027010-47 = "Момидзи... ушла из библиотеки."
10027010-48 = ""
10027010-51 = "[ns] «А. Хочешь рассказать, что случилось?»"
10027010-52 = "Ну, видите ли…"
10027010-54 = ""
10027010-59 = ""
10027010-61 = "[ns] «Хм... Мэру, думаю, в этот раз ты была неправа.»"
10027010-62 = "Что?! Почему вы встаёте на её сторону?!"
10027010-63 = "То есть потом я и сама задумалась, не перегнула ли палку."
10027010-64 = "Но я тоже автор! Я просто высказала профессиональное мнение. История была слабой! Из-за такого не стоит злиться!"
10027010-65 = "Ну, полагаю, кто-то другой мог бы думать иначе..."
10027010-66 = "И я ведь всё обдумала... Не то чтобы совсем нет..."
10027010-67 = "[s] «Вы часто ссоритесь?»"
10027010-68 = "Не так уж часто. Конечно, время от времени мы не соглашаемся друг с другом."
10027010-69 = "Просто у нас с Момидзи разные взгляды на вещи. В такой работе невозможно НЕ иметь твёрдого мнения."
10027010-70 = "Казалось, это обычное разногласие, каких у нас уже было много. Я думала, со временем мы помиримся."
10027010-71 = "Но Момидзи не отвечает на телефон..."
10027010-72 = "..."
10027010-73 = "Я не знаю, что делать."
10027010-74 = "Я никогда не видела Момидзи настолько злой. И она ещё ни разу вот так не убегала из библиотеки."
10027010-75 = "Что мне делать, Сенсей?"
10027010-76 = "[s] «Почему бы тебе честно не извиниться?»"
10027010-77 = "Если бы я думала, что это сработает, то не стала бы вам звонить, Сенсей!"
10027010-78 = "Так было всегда. Что бы я ни говорила, до неё ничего не доходит..."
10027010-79 = "А? Вы не согласны?"
10027010-80 = "[s4] «Искренне извинись, и всё будет хорошо.»\n[s5] «А если не сработает, я вмешаюсь и помогу.»"
10027010-83 = "Это не какая-нибудь история из романа! Одних искренних извинений точно недостаточно!"
10027010-84 = "Да даже если бы это был роман, люди сказали бы, что всё слишком поверхностно... даже примитивно!"
10027010-85 = "[s] «Ну а ты сама как думаешь, что нужно сделать, Мэру?»"
10027010-86 = "Просто поговорить с ней недостаточно. Нужен более системный подход..."
10027010-87 = "Какая-нибудь формула примирения..."
10027010-88 = "..."
10027010-89 = "«Луна»..."
10027010-90 = "Хм..."
10027010-91 = ""
10027010-94 = ""
10027010-95 = ""
10027010-96 = "Последний том, 22-й, правда, немного свернул не туда, но..."
10027010-97 = "Я просто хотела узнать, почему нет финального тома, который завершил бы историю."
10027010-99 = ""
10027010-101 = ""
10027010-102 = ""
10027010-103 = "Вот оно!"
10027010-104 = "Сенсей! Я знаю, что делать!"
10027010-105 = ""
10027010-107 = ""
10027010-110 = "[ns] «Решил заглянуть и узнать, как продвигается твоя идея, Мэру.»"
10027010-111 = "Отлично! Вот как! Помните, как мы с Момидзи поссорились из-за истории «Луны»?"
10027010-112 = "После этого я немного покопалась. Оказалось, финальный том никто не может достать потому, что в своё время продажи были ужасными и отпечатали всего несколько экземпляров."
10027010-113 = "Теперь они невероятно редкие — настолько, что его называют Неуловимым 22-м томом «Луны»!"
10027010-114 = "Если я сумею достать экземпляр финального тома, Момидзи придётся меня простить!"
10027010-115 = "Идеальный план! Уверена, он сработает!"
10027010-116 = "[s6] «(Это немного чересчур, но...)»\n[s7] «(Пока можно поддержать план Мэру...)»"
10027010-119 = "Вы что-то совсем притихли, Сенсей. Значит, возражений нет!"
10027010-120 = "А! Вы всегда меня понимаете! Как же хорошо, что я попросила вас помочь, Сенсей!"
10027010-121 = "Теперь осталось только придумать, как заполучить настолько редкую книгу..."
10027010-122 = "По крайней мере, у нас есть цель! Если двигаться шаг за шагом, решение обязательно найдётся."
10027010-123 = "Наше путешествие за полным собранием «Луны» начинается прямо сейчас!"
10027010-124 = "[s8] «И первым делом ты решила выйти на улицу?»\n[s9] «Я так горжусь! Сейчас расплачусь от счастья!»"
10027010-127 = "Тц! Я не затворница! Да, я предпочитаю сидеть в помещении, но всё же!"
10027010-128 = "Я знаю, когда пора выйти и подышать свежим воздухом!"
10027010-129 = "Итак, первой остановкой должно быть... вот это место!"
10027010-131 = ""
10027010-135 = "Район букинистов"
10027010-136 = ""
10027010-137 = "Я не была здесь целую вечность! Мм... Пахнет точно так же, как я помню."
10027010-138 = "[s] «Что это за место?!»"
10027010-139 = "Целая улица, посвящённая подержанным книгам. Фронт освобождения знаний постоянно сюда ходит."
10027010-140 = "Понимаете, это не обычные книжные магазины... Они специализируются на редких и снятых с печати книгах!"
10027010-141 = "Неважно, сколько книге лет или о чём она. Здесь можно найти что угодно. Только... будьте осторожны."
10027010-142 = "Здесь довольно жёсткие порядки. Новичков вроде вас тут съедают на завтрак!"
10027010-143 = "[s] «Это, эм... звучит пугающе...»"
10027010-144 = "Хи-хи-хи. Похоже, вы не слышали о тёмной стороне этой индустрии, да, Сенсей? Сейчас объясню."
10027010-145 = "Первое, что нужно знать: цены здесь безумно завышены, потому что продавцы заранее рассчитывают на торг."
10027010-146 = "Поэтому они обожают, когда приходят наивные покупатели."
10027010-147 = "И ещё не всё, что они продают, строго законно... или безопасно. Если власти узнают, будут большие проблемы."
10027010-148 = "А отсутствие регулирования означает, что менее честные продавцы пытаются подсунуть подделки ничего не подозревающим покупателям."
10027010-149 = "Хахаха! Хотите знать, почему мы всё равно сюда ходим? Ну, независимо от качества, законности и даже безопасности, коллекционеру ведь лучше сохранить вещь, чем позволить ей оказаться на какой-нибудь свалке, правда?"
10027010-150 = "И последнее: если вы просто смотрите витрины и ничего не покупаете, вас никто не тронет."
10027010-151 = "И вот мы пришли — магазин, где точно должен быть финальный том «Луны»!"
10027010-152 = "Но... здесь бывает довольно сурово. Внутри настоящий Дикий Запад — выживает сильнейший! Так что... ради безопасности вам, наверное, стоит держать меня за руку."
10027010-153 = "[s] «Не уверен, что книжный магазин можно назвать Диким Западом, дорогая Мэру.»"
10027010-154 = "Эм... В любом случае!"
10027010-155 = ""
10027010-157 = ""
10027010-159 = ""
10027010-164 = ""
10027010-166 = "[ns] «Почему на этой книге написано „Библиотека“?»"
10027010-167 = "О, скорее всего, она попала сюда из библиотеки, а бирку просто забыли снять."
10027010-168 = "Начнём искать, хорошо? 22-й том «Луны», мы идём!"
10027010-170 = ""
10027010-173 = ""
10027010-174 = "[ns] «Мы ищем уже три часа...?!»"
10027010-175 = "Е-Если хочешь найти иголку в стоге сена, приходится много искать."
10027010-176 = "Но, думаю, на этой стороне улицы мы сделали всё, что могли. Пойдём в следующее место!"
10027010-178 = ""
10027010-182 = ""
10027010-183 = "Спорю, вы раньше даже не заметили этот переулок. Если пройти здесь..."
10027010-184 = "Тут тесновато, но в книжном магазине дальше есть очень старые вещи."
10027010-185 = "Если эта книга где-то и есть, то именно там!"
10027010-187 = ""
10027010-193 = "[ns] «Боюсь, наша миссия провалена, капитан Мэру.»"
10027010-194 = "Как?! Мой план был идеален!"
10027010-196 = ""
10027010-201 = "[ns] «Такое чувство, будто мы снова вернулись в самое начало.»"
10027010-202 = "Это нелепо! Столько поисков, а мы всё ещё понятия не имеем, где её найти?!"
10027010-203 = "Слухи говорили, что она неуловима. Но это уже превзошло мои ожидания. «Луна» — грозный противник!"
10027010-205 = ""
10027010-206 = "Мне показалось, что я узнала твой голос. Какая неприятность — встретить тебя именно здесь... Мэрури."
10027010-208 = "Этот голос!"
10027010-209 = ""
10027010-211 = ""
10027010-214 = ""
10027010-215 = "Давненько не виделись. Как поживаешь?"
