[translation]
2002705-1 = "Ожидания"
2002705-2 = "У меня было чувство, что у Широко проблемы, поэтому я направился к её комнате на курорте."
2002705-3 = "Когда я завернул за угол, то заметил фигуру на другом конце коридора."
2002705-4 = ""
2002705-5 = ""
2002705-8 = ""
2002705-11 = "[ns1] «Это Широко...»\n[ns2] «Что она делает здесь так поздно?»"
2002705-14 = ""
2002705-16 = ""
2002705-18 = ""
2002705-22 = "[ns] Следовать за Широко."
2002705-28 = "[ns] «(...?)»"
2002705-30 = "[ns3] «Я потерял её...»\n[ns4] «Она исчезла!»"
2002705-33 = "..."
2002705-34 = ""
2002705-36 = ""
2002705-38 = ""
2002705-40 = ""
2002705-42 = ""
2002705-44 = "Сенсей."
2002705-45 = ""
2002705-46 = "[ns] «...?!»"
2002705-49 = "[ns5] «Ого!»\n[ns6] «Широко...?»"
2002705-52 = ""
2002705-53 = ""
2002705-54 = "..."
2002705-55 = "Простите, Сенсей. Я не хотела вас пугать."
2002705-56 = "Мне показалось, что за мной следят. Поэтому я спряталась."
2002705-57 = "Потом увидела, что это вы. Позвала вас, и..."
2002705-58 = "О, куда я шла? Ну..."
2002705-59 = "Никуда... Просто... вышла на утреннюю прогулку..."
2002705-60 = ""
2002705-62 = ""
2002705-63 = "Простите... Это была ложь."
2002705-64 = "На самом деле... меня кое-что беспокоит. Я хотела увидеть это снова."
2002705-65 = "Я про пляж."
2002705-66 = "[s7] «Тот, где мы запускали фейерверки?»\n[s8] «Тот, где мы вместе жарили барбекю?»"
2002705-69 = "...Да."
2002705-70 = "Я думала сказать кому-нибудь, куда иду. Но уже почти полночь..."
2002705-71 = "Не хотела устраивать суету. Или портить кому-то настроение."
2002705-72 = "Но те весёлые вещи, которые мы там делали... Не думаю, что смогу повторить их снова. Когда мы вернёмся домой, в смысле."
2002705-73 = "Я пыталась отпустить это. Но не смогла уснуть..."
2002705-74 = "[s] «...»"
2002705-75 = "Я подумала... если схожу туда ещё один раз... тогда смогу уснуть."
2002705-76 = "Я не собиралась задерживаться. Всего несколько минут..."
2002705-77 = ""
2002705-79 = ""
2002705-80 = "Плохая идея, да? Уже слишком поздно."
2002705-81 = "[s9] «Я не против немного прогуляться до пляжа.»\n[s10] «Хорошо, что я тебя поймал. Тебе нужен сопровождающий.»"
2002705-84 = "Вы тоже пойдёте...?"
2002705-85 = "Хорошо. Мне нравится."
2002705-86 = ""
2002705-88 = ""
2002705-89 = "Сюда..."
2002705-90 = ""
2002705-92 = ""
2002705-96 = ""
2002705-97 = "Да. Иначе. Почему-то."
2002705-98 = ""
2002705-100 = ""
2002705-101 = "О... Хм..."
2002705-102 = "[s11] «Что-то не так?»\n[s12] «Всё не так, как ты ожидала.»"
2002705-105 = "...Да."
2002705-106 = "Выглядит иначе. Раньше море было... как..."
2002705-107 = "А, сейчас прилив? Значит, место, где мы играли... теперь под водой..."
2002705-108 = "Так что... сейчас я его не вижу..."
2002705-109 = "Как оно выглядело тогда... Больше оно никогда не будет выглядеть точно так же."
2002705-110 = "[s13] «Всё меняется, но благодаря этому появляются новые впечатления.»\n[s14] «Всегда будет следующий раз.»"
2002705-113 = "Что вы имеете в виду...?"
2002705-114 = "Как я могу...? Школа... не пляж..."
2002705-115 = "Пляж здесь... Именно здесь происходили весёлые вещи..."
2002705-116 = "Я не понимаю, Сенсей."
2002705-117 = "Когда вернёмся, мы будем жарить барбекю? Смотреть фейерверки?"
2002705-118 = "Наверное, нет, да?"
2002705-119 = "Что ж..."
2002705-120 = "[s15] «Разве нет чего-нибудь ещё, чего можно ждать?»\n[s16] «Никогда не знаешь, какие новые весёлые впечатления ждут тебя впереди.»"
2002705-123 = "Эм..."
2002705-124 = "Простите, Сенсей. Я не понимаю. Может быть... для меня это слишком сложная мысль..."
2002705-125 = ""
2002705-127 = ""
2002705-128 = "Но..."
2002705-129 = "Хм. Но это говорите именно вы. Поэтому я чувствую вот это..."
2002705-130 = "Что это за чувство? Ожидание...?"
2002705-131 = "Сейчас я не понимаю. Но, может быть, пойму в будущем..."
2002705-132 = "Вот такое у меня чувство."
2002705-133 = "..."
2002705-134 = "О. Мне стало немного легче. И я чуть больше уверена."
2002705-135 = ""
2002705-137 = ""
2002705-140 = ""
2002705-141 = "Сенсей."
2002705-143 = "Я буду ждать следующего раза."
