[translation]
10041070-1 = "Эпизод 7;Эпилог"
10041070-8 = ""
10041070-9 = "...Вот и последние. Всех отправили в Валькирию."
10041070-11 = "Это было напряжённо. Всю Выставку и правда могли отменить."
10041070-12 = "Но всем было весело! Я даже слышала, как студенты Тринити бегали вокруг и кричали: «Ого, вот это Миллениум!»"
10041070-13 = "Верно, хотя, думаю, наш публичный образ стал немного... странным."
10041070-15 = "Учитывая масштаб случившегося, если это худшее последствие, значит миссия выполнена."
10041070-16 = "...А что бухгалтер Семинар? Она что-нибудь сказала?"
10041070-17 = "Ну, конечно, она злилась. Но в итоге всё разрешилось, да и изначально это была совместная миссия Сенсея и C&C..."
10041070-18 = "Она сказала, что в следующий раз отчитает Сенсея за то, что не держал её в курсе. Думаю, на этом всё."
10041070-19 = "[s1] «Так в итоге отчитывать будут меня...»\n[s2] «Хех, мне не привыкать, когда меня ругают...»"
10041070-22 = "Не поймите неправильно, мы тоже немного злимся."
10041070-23 = "Не знаю насчёт Семинар, но хотя бы нам можно было сказать. Совместная миссия с важной гостьей из Тринити?"
10041070-24 = "Мы обо всём этом вообще ничего не знали."
10041070-25 = ""
10041070-29 = "Простите. Это было моё решение, продиктованное исключительно моим упрямством."
10041070-30 = "В худшем случае Сенсей и Нэру просто потакали моей детской стороне. Поэтому, если можете..."
10041070-31 = "...проявите великодушие и простите их."
10041070-32 = ""
10041070-34 = ""
10041070-35 = "Эм, что? Э?"
10041070-36 = "Н-нет. Нет. Я совсем не это имела в виду...!"
10041070-37 = "Фуфу, Карин, ты невероятна. Заставить кого-то из Чаепития Тринити склониться перед тобой."
10041070-38 = "Ага, эм, меня просто втянули сюда как услугу, так что... ладно, моя вина."
10041070-39 = "Я найду способ загладить вину. А пока постарайся не слишком злиться."
10041070-40 = ""
10041070-43 = ""
10041070-44 = "Нет! Я вообще не этого просила!"
10041070-45 = ""
10041070-48 = ""
10041070-49 = ""
10041070-50 = ""
10041070-52 = ""
10041070-54 = ""
10041070-55 = "...Сенсей."
10041070-56 = "[s3] «Ты в порядке? Не пострадала?»\n[s4] «Что ты теперь обо всём этом думаешь?»"
10041070-59 = "...Я в порядке. Значит, вы действительно всё знали с самого начала."
10041070-60 = "А я тем временем приехала сюда, чтобы доказать себя..."
10041070-61 = "...Но неважно. Если бы не вы, всё наверняка закончилось бы плохо."
10041070-62 = ""
10041070-64 = ""
10041070-65 = "Спасибо. И ещё..."
10041070-66 = "...простите, что ушла одна."
10041070-67 = "[s5] «Пока не говори этого.»\n[s6] «Прибереги это до возвращения.»"
10041070-68 = ""
10041070-69 = ""
10041070-71 = ""
10041070-72 = "Что? ...Что это значит...?"
10041070-73 = "Раз вы так говорите, Сенсей. Уверена, у вас есть причина."
10041070-74 = "Но всё же, Сенсей, должна упомянуть... возможно, какое-то время у вас больше не будет шанса увидеть... «её». Вы правда хотите уйти, не попрощавшись?"
10041070-75 = "Уверена, вы ещё успеете. Она наверняка всё ещё в убежище и собирает вещи."
10041070-76 = "...Что? Вы И ПРАВДА хотите уйти, не попрощавшись?"
10041070-77 = "Вот уж неожиданно. Я думала, вы захотите проводить её."
10041070-78 = "[s7] «Пока лучше оставить всё как есть.»\n[s8] «Для таких вещей есть своё время и место.»"
10041070-81 = "...Вот как?"
10041070-82 = "[s9] «Кстати, а ты, Сэя?»\n[s10] «Хочешь с ней попрощаться?»"
10041070-85 = "...Что?"
10041070-86 = "Ой, эм..."
10041070-87 = ""
10041070-89 = ""
10041070-90 = "...Ладно."
10041070-93 = "Час спустя..."
10041070-99 = ""
10041070-100 = "Рио? Мы пришли."
10041070-101 = "Я почти закончила собираться. Нам стоит..."
10041070-102 = ""
10041070-104 = ""
10041070-108 = ""
10041070-110 = ""
10041070-111 = "...Полагаю, вы уже возвращаетесь."
10041070-112 = "Ну... да, такой был план."
10041070-113 = "...Рио..."
10041070-114 = "Хм?"
10041070-115 = "*вздох* Что у тебя за лицо? Ты вот так быстро к ней привязалась? Теперь расплачешься, потому что она уезжает?"
10041070-116 = ""
10041070-118 = ""
10041070-119 = "Нет. Ни капли. Я..."
10041070-120 = ""
10041070-122 = ""
10041070-123 = "...Ох, ладно, скажу всё как есть. Это неприятно, но..."
10041070-124 = "...во всём этом у меня словно заноза в голове."
10041070-125 = "Заноза?"
10041070-126 = "То, что меня раздражает. Как я это вижу..."
10041070-127 = "...ну, Рио может чувствовать необходимость что-то доказать, но на самом деле ей это не нужно."
10041070-128 = "Сама она, возможно, этого не чувствует, но остальные уже..."
10041070-129 = ""
10041070-131 = ""
10041070-132 = "Хм?"
10041070-133 = ""
10041070-135 = ""
10041070-136 = "...Уже что? Ты собираешься закончить предложение?"
10041070-137 = "Они уже признали её. Единственный человек, который пока не сделал того же..."
10041070-138 = "...это она сама."
10041070-139 = ""
10041070-141 = ""
10041070-142 = "...О."
10041070-143 = "Понятно, Сенсей. Значит, вот что вы имели в виду."
10041070-144 = "Вы теперь сами отвечаете на собственные вопросы? Рио так делает, и меня это бесит, так что, пожалуйста, не надо."
10041070-145 = "Фуфу, прошу прощения. У меня есть такая неприятная привычка."
10041070-146 = "В любом случае..."
10041070-147 = ""
10041070-149 = ""
10041070-150 = "...Нэру, если позволишь, я бы хотела ещё раз попросить твоей помощи."
10041070-151 = "...Какой помощи?"
10041070-152 = "Ну..."
10041070-153 = ""
10041070-155 = ""
10041070-156 = ""
10041070-159 = ""
10041070-160 = "Рио. Я хочу кое-что сказать."
10041070-161 = ""
10041070-164 = ""
10041070-165 = "Хм? Что там?"
10041070-166 = ""
10041070-169 = ""
10041070-170 = "Если позволишь, думаю, тебе стоит остаться в Научной школе «Миллениум» ещё примерно на неделю."
10041070-171 = "Я тоже останусь вместе с Нэру. А от тебя прошу лишь смотреть и наблюдать."
10041070-172 = "Ты заслуживаешь своими глазами увидеть оставшуюся часть Выставки, которую сама защитила."
10041070-173 = ""
10041070-175 = ""
10041070-177 = ""
10041070-178 = "Я всё думала, что же ты скажешь..."
10041070-179 = "Что ж, боюсь, нет. Я не заслуживаю наслаждаться Выставкой здесь. Это уже решено."
10041070-180 = "Я предполагала, что ты так скажешь. Но дело не в том, «заслуживаешь» ты этого или нет."
10041070-181 = "Не в этом? О чём ты говоришь?"
10041070-182 = "Может, тебе кажется, что теперь всё решено, но сегодня лишь первый день Выставки."
10041070-183 = "Возможно, остальная часть мероприятия пройдёт относительно спокойно, а возможно, и нет. Может быть, её заполнят безумные происшествия, большие и маленькие."
10041070-184 = "Семинар, конечно, настороже, но сколько всего они смогут решить самостоятельно?"
10041070-185 = "Кому-то нужно незаметно следить за происходящим. Разве так не будет лучше?"
10041070-186 = "Разумеется, этим кем-то не обязательно должна быть ты. Возможно, Сенсей, работая ВМЕСТЕ с Семинар, сможет взять на себя дополнительную нагрузку, но..."
10041070-187 = ""
10041070-189 = ""
10041070-191 = ""
10041070-192 = "...ты ведь не хочешь для него такого, Рио?"
10041070-193 = "Ну..."
10041070-194 = ""
10041070-196 = ""
10041070-197 = ""
10041070-198 = "...Нэру, что ты думаешь?"
10041070-199 = ""
10041070-202 = ""
10041070-203 = "Ты правда хочешь знать моё мнение? Странный сегодня день. Но не плохой."
10041070-204 = "Думаю, всё должно быть нормально. Тебя не обнаружат, если только не начнёшь разгуливать на виду у всех."
10041070-205 = "К тому же это ведь и есть работа президентов студсовета, да?"
10041070-207 = "...Хм-м..."
10041070-208 = "Почему мне кажется, будто я попадаю в ловушку?"
10041070-209 = "Выбор за тобой."
10041070-210 = "Никто не станет заставлять тебя, если ты не хочешь."
10041070-211 = ""
10041070-214 = ""
10041070-215 = "Н-нет. Я не говорила, что не хочу. Конечно, хочу."
10041070-216 = "Эм... Ну, я, э-э..."
10041070-217 = ""
10041070-219 = ""
10041070-220 = ""
10041070-221 = "...Ладно. Я сделаю это."
10041070-222 = ""
10041070-224 = ""
10041070-225 = "Только одну неделю. Как только она закончится, я вернусь."
10041070-226 = "Одной недели более чем достаточно. И мы с Нэру будем рядом каждый её день."
10041070-227 = "Хорошо, тогда я пойду распакую вещи..."
10041070-228 = ""
10041070-230 = ""
10041070-231 = "...Сработало."
10041070-233 = "Ха-ха! Неплохо ты с ней управилась. Когда вы двое успели так сблизиться?"
10041070-234 = "Ну, в каком-то смысле, наверное."
10041070-235 = "Она из тех людей, которые отказываются принимать то, чего хотят, если только у них нет оправдания."
10041070-236 = "Я хорошо знаю такой образ мышления. Каждый день вижу его в зеркале."
10041070-237 = "И вот ты снова создаёшь проблемы."
10041070-238 = "...Фуфу."
10041070-239 = "Я имела в виду каждое слово, которое ей сказала."
10041070-240 = ""
10041070-242 = ""
10041070-243 = "И да, иногда я действительно создаю проблемы именно так."
10041070-244 = "Код: BOX — Тень, приближающаяся к Миллениуму"
