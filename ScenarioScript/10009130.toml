10009130-43 = "Рыцари спасения?"
10009130-44 = "А, теперь вспомнила. Вы ведь группа бездельниц из Тринити, не так ли?"
10009130-45 = "И среди Рыцарей Спасения правда есть кто-то настолько способный, чтобы разгадать мои уловки и найти меня?"
10009130-46 = "Это так удивительно? Я просто пробилась напролом."
10009130-47 = "В любом случае, ты меня заинтересовала. Что капитан Рыцарей Спасения делает здесь?"
10009130-48 = "Только не разочаруй меня, сказав какую-нибудь глупость вроде того, что пришла меня остановить."
10009130-49 = "Лиса Бедствий. Я должна услышать кое-что непосредственно от тебя."
10009130-50 = "...?"
10009130-51 = ""
10009130-53 = ""
