10009130-129 = ""
10009130-131 = ""
10009130-132 = "А что нам делать с остальным этим бедламом, Капитан?"
10009130-134 = "Ты права, Ханаэ."
10009130-135 = "Сможет ли Лисица Бедствия честно выразить свои чувства или нет... Наша обязанность — превратить хаос в порядок."
