10009130-147 = "Мы должны помочь тем, кто сбился с пути и сеет хаос!"
10009130-148 = "А когда Лисица Бедствия закончит своё дело, мы её найдём."
10009130-149 = ""
10009130-150 = "Есть, капитан!"
10009130-151 = "Аптечка, иглы, шины и компрессионные бинты при мне! Мы готовы!"
