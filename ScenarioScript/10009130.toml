10009130-103 = "Когда закончишь, мы проведём исправительные меры за твои поступки."
10009130-107 = "К-Капитан? Та, с кем вы сейчас разговаривали..."
10009130-108 = "Это была... Лисица Бедствия?!"
10009130-109 = "И-и вы просто... отпустили её?"
10009130-111 = "..."
10009130-112 = "Серина, Ханаэ. После всего этого хаоса вы ещё помните, какой сегодня день?"
10009130-114 = "Сегодня? Эм... Столько всего произошло, и..."
10009130-115 = "О! Точно! Я помню! Сегодня День святого Валентина!"
10009130-117 = "Верно. В этот день говорят о своих искренних чувствах тем, кто тебе дорог."
10009130-118 = "Поэтому в такой день... было бы неправильно преграждать ей путь."
10009130-119 = "Позволить ей признаться в своих чувствах..."
10009130-120 = ""
10009130-122 = ""
10009130-123 = "Разве это тоже не своего рода исцеление?"
10009130-124 = ""
10009130-127 = ""
