10009130-60 = "...Сегодня..."
10009130-61 = "...Сегодня?"
10009130-62 = "Сегодня День святого Валентина. День, когда признаются в своих истинных чувствах."
10009130-63 = "Я... просто хочу поговорить с одним человеком..."
10009130-64 = "Поэтому, если кто-нибудь встанет у меня на пути, кем бы он ни был..."
10009130-65 = "Я, Вакамо, должна уничтожать, уничтожать и ещё раз уничтожать, пока не доберусь до него."
10009130-66 = ""
10009130-68 = ""
10009130-69 = "Чтобы признаться в своих чувствах в День святого Валентина?"
10009130-70 = "Неважно, что ты об этом думаешь."
10009130-71 = ""
10009130-73 = ""
10009130-74 = "Если встанешь у меня на пути, я отправлю тебя прямиком в ад."
10009130-75 = "..."
10009130-76 = "Что ж, тогда... Если тебе нужна драка—"
10009130-77 = ""
10009130-79 = ""
10009130-81 = ""
10009130-82 = "Я понимаю. Прошу, продолжай."
10009130-83 = "...Что?"
10009130-84 = "Не знаю, что ты задумала, но знай: я, Вакамо, не попадусь на дешёвые уловки."
10009130-85 = "Уловки? У меня нет ни уловок, ни скрытых мотивов."
10009130-86 = "Подобное недостойно Рыцаря исцеления."
10009130-87 = ""
10009130-89 = ""
10009130-90 = ""
10009130-91 = "Признаться в истинных чувствах в День святого Валентина... Если это твой план, у меня нет причин вставать у тебя на пути."
10009130-92 = "..."
10009130-93 = ""
10009130-95 = ""
10009130-96 = ""
