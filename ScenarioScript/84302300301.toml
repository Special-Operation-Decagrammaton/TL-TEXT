[translation]
84302300301-5 = ""
84302300301-6 = "Можно задать один вопрос? Просто из личного любопытства..."
84302300301-7 = "А? Какой?"
84302300301-8 = "Эта... Коюки... Она часто доставляет здесь проблемы? Судя по тому, как вы о ней говорите, она немного проблемная."
84302300301-9 = ""
84302300301-12 = ""
84302300301-13 = "Немного проблемная, говоришь...?"
84302300301-15 = "Ну..."
84302300301-16 = "Прошу прощения. Я слышала, что она состоит в Семинар. Не хотела ставить под сомнение её порядочность."
84302300301-17 = "О, не пойми неправильно. Она ДЕЙСТВИТЕЛЬНО проблемная. Просто не «немного»."
84302300301-18 = "Хм... Как бы это сравнить...?"
84302300301-19 = "Есть у вас в школе кто-нибудь, кто... постоянно выделяется, может, с розовыми волосами, активная, но слегка бездумная, и куда бы она ни пошла, там всё время что-то происходит?"
84302300301-20 = "..."
84302300301-21 = "...Есть одна такая..."
84302300301-23 = "(...Ого, её прямо передёрнуло...)"
