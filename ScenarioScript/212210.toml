212210-187 = ""
212210-188 = "......É doce demais."
212210-189 = ""
212210-191 = ""
212210-192 = "Esse doce é tão suave...... que sinto minha cabeça girar em confusão......"
212210-193 = "Snif...... ugh......"
212210-196 = "......"
212210-197 = ""
212210-200 = ""
212210-201 = "Exatamente como suspeitávamos. Quem estava operando nas sombras era 'A Tormenta'."
212210-202 = "Aqueles fanáticos que herdaram a doutrina da Imperatriz do Trovão e buscam restaurar o antigo arsenal dela."
212210-203 = "Eu julgava que não passavam de ratos subterrâneos lambendo plantas industriais velhas nos esgotos, mas――"
212210-204 = "não imaginei que teriam a audácia de um ataque terrorista dessa magnitude."
212210-205 = "......Nós fomos descuidadas demais."
212210-206 = "Eles provaram ter poder suficiente para ameaçar a existência de toda a academia."
212210-207 = "O monstro que acreditávamos ter sepultado no passado......"
212210-208 = "Parece ter despertado sob uma roupagem ainda mais sorrateira e ardilosa, kwahaha!"
212210-209 = "......"
212210-210 = "O lado positivo de toda essa provação foi termos expurgado todos os vestígios da Imperatriz que restavam dentro de Gehenna."
212210-211 = "Com isso, a ameaça interna foi neutralizada.#Resta-nos apenas blindar as fronteiras contra infiltrações externas e――"
212210-212 = "Não. Nem todo o legado da Imperatriz do Trovão foi erradicado."
