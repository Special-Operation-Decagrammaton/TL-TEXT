212210-172 = "[s] \"Hã......?\""
212210-173 = "É o codinome da organização que me acolheu, me treinou e me confiou esta missão."
212210-174 = "[s] \"Isso quer dizer que......!!\""
212210-175 = "É tudo o que estou autorizada a dizer por ora."
212210-176 = "......Pode ir embora agora, por favor."
