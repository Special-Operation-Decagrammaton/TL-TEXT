212210-216 = "......Ah."
212210-217 = ""
212210-219 = ""
212210-220 = "............"
212210-221 = "Pois dependendo da perspectiva, o mais genuíno e verdadeiro legado da Imperatriz――"
212210-223 = ""
212210-224 = "É a própria Ibuki."
